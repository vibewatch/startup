  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与定价不透明
        blocks:
          - type: paragraph
            body: >-
              公开证据支持把 Outrider 看作面向企业销售的一体化自动化方案，而不是狭窄软件工具。系统组合自主拖车移动、调度与监控软件、拖车库存 API、现场基础设施，以及现在的企业级支持服务。Outrider
              自己反复把业务描述为面向 Fortune 500
              物流枢纽的自主堆场运营即服务；即使具体合同机制仍未公开，这也暗示商业关系具有重复性。支持服务发布在财务上很重要，因为它围绕车辆加软件技术栈增加了明确的正常运行时间、诊断和异常处理服务，形成一个即使初始部署偏项目制也可能复购的服务层。


              公开记录没有给出的，是价格实现。已审阅的官方页面、新闻稿或独立文章都没有披露标价、按次移动费用、站点订阅、实施费用、软件席位定价或支持合同费率。这意味着本章可以描述变现架构，但不能把它换算成经审计 ARR、GMV
              或毛利数学。因此，收入质量结论是混合的：产品边界具体，重复性服务逻辑可信，但所有重要的变现金额仍是私下谈判且未披露。
