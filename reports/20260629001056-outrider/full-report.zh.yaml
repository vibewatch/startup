      - number: '3.4'
        title: 护城河耐久性、反向证据与未解尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开记录仍支持 Outrider 拥有真实切口，但不是不可攻破的切口。公司依然异常聚焦配送堆场自主化，其围绕拖车管线处理、混合交通安全、强化学习收益和 24x7
              支持的可见声明，比许多同行发布的更宽。这很重要，因为买方关心的是自主堆场牵引车能否在混乱设施中真正替代重复劳动力，而不只是点到点行驶。反向情形同样清楚。OEM 与自主化开发商正在汇合；Kalmar 和
              Forterra 显示，一个受信任的牵引车平台可以多快获得自主化层；ISEE 加 TICO 也显示，改装和工厂集成路径可以并存。FERNRIDE
              的人机协助自主化也可能赢得谨慎客户，这些客户偏好风险更低的运营模式，而非完全无人驾驶声明。与此同时，YMS
              和可视化供应商不断扩大不借助机器人也能改善的范围。独立市场评论对长期需求建设性，但仍强调资本强度、集成成本，以及部署扩大前需要清晰运营价值。主要未解承销缺口，恰好是公开供应商不愿披露的内容：每站点实际价格、正面竞争胜率、客户集中度、自主每次移动成本，以及技术栈中硬件、软件或服务收入各占多少。在这些问题回答前，Outrider
              的护城河看起来可信，但只被部分证明。
