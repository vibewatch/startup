  - id: TV006
    title: 最终尽调事项表
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前估值
        - 最新一轮融资的投前估值、投后估值、股数和每股价格
        - 没有真实入场价格，任何回报模型都站不住。
        - CEO/CFO 提供融资材料、董事会同意文件和股权结构表导出。
      - - 证券条款
        - 清算优先权、认股权证、反稀释条款，以及任何二级出售结构
        - 这些条款决定下行保护，也决定谁吃到上行。
        - 公司律师共享已签署的投资意向书和最终文件。
      - - 收入质量
        - 按客户拆分的 ARR 或合同收入、按站点拆分的毛利率、支持强度
        - 这能区分可扩展的软件式经济性，还是项目交付很重的推广经济性。
        - 财务团队提供分群模型、毛利率桥和客户单位经济性。
      - - 客户集中度
        - 具名客户清单、站点数量、续约历史和扩张管线
        - 客户集中可能把一个标杆客户变成误导估值的锚。
        - 销售运营提供账户集中度和分群扩张包。
      - - 现金续航与烧钱
        - 当前现金、月度烧钱、债务和下行情景现金续航预测
        - 2026 年融资本身不能说明融资是可选项还是必需项。
        - FP&A 提供月度现金桥和下行情景现金续航敏感性。
      - - 基准比较包
        - 投行可比公司、近期私募市场估值标记，以及相对同行的内部定价位置
        - 边界可比公司有帮助，但最终定价需要定制化同行和交易样本。
        - 领投方或投行提供当前可比公司表和私募市场信息。
    notes: 要把本章从「继续研究」推进到真正的定价建议，这些是最低限度的补充事项。公开披露为空，应视为尽调义务，而不是可以凭空填补的空白。
    claimRefs:
      - CV012
      - CV039
      - CV040
      - CV041
      - CV044
