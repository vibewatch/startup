  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 公开假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 牛
        - 2026 年推广转成多场地合同收入，支持强度随规模下降，融资条款干净。
        - 只有私人数据证明扩张经济性可重复且稀释有限，高于当前融资的溢价才站得住。
        - 需要披露收入质量、客户多元化，以及相对当前条款可信的估值上调理由。
        - 执行滑坡、优先权包袱或续约数据差，都能很快抹掉溢价。
      - - 基准
        - 运营证明真实但仍窄，2026 年融资是必要动作，而非纯机会型融资。
        - 最站得住的情形，是确认利润率、runway 和集中度数据后，在接近最新条款处纪律性参与。
        - 符合当下公开证据：产品可信、价格发现不完整、市场信号混杂。
        - 任何隐藏的条款栈复杂性或疲弱毛利率，都会把判断推向熊情景。
      - - 熊
        - 收入质量仍不透明，融资条款保护投资人，客户扩张仍集中。
        - 相比溢价标记，平轮或下轮框架更可能成立，因为公开证据支撑不了未来回报。
        - 如果尽调令人失望，其他自动驾驶公司的折价融资和疲弱卡车周期需求会提高该情景概率。
        - 公司仍可能具备战略价值，但给新增资金带来糟糕股权回报。
    notes: 情景逻辑有意保持条件性，因为没有公开来源披露当前估值标记。本表围绕尽调必须证明什么来框定回报纪律，而不是围绕虚构价格目标。
