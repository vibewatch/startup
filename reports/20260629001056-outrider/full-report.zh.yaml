    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与系统边界
        blocks:
          - type: paragraph
            body: >-
              尽管部分运营细节仍未公开，Outrider 在公开材料中的定位异常一致。公司 2020 年脱离隐身状态时，自称是第一家专门聚焦物流枢纽自主堆场运营的公司；到 2025
              年的产品、安全和支持公告中，这一定位仍未改变。公司卖的不是单个机器人，也不是狭窄的感知技术栈；它主推的是一套整合系统，把管理软件、自主堆场牵引车和现场基础设施放在一起，让堆场能够调度移动、追踪拖车库存、对接装卸月台，并集中监控运营。从官方产品页到后续新闻稿，同一个使命反复出现：用零排放自主运营替代危险、重复的堆场工作，提高吞吐、安全和可持续性。这种一致性很重要，因为它说明公司一直紧扣一个受控环境里的自主化切口，而不是漂向通用卡车运输叙事。
