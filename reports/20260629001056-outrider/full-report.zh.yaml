      - number: '5.2'
        title: 架构与赋能技术
        blocks:
          - type: paragraph
            body: >-
              技术栈具体到足以作为真实产品承销，而不是泛自主化品牌。官方材料称，NVIDIA DRIVE 处理感知计算，合作伙伴硬件提供基础 EV 卡车、转向和机器人层，Outrider
              自有软件管理感知、运动规划、调度、拖车库存和云 API。两个最差异化的技术元素，是拖车处理工作流及其周围的数据闭环。TrailerConnect
              以机器人方式把刹车和电气线路连接到未改装拖车；自主挂接则用感知、运动规划和控制算法，适配不同拖车高度和方向，并确认 kingpin
              连接成功。在此之上，拖车库存能力使用传感器、计算机视觉和深度学习，在运营中的卡车上捕捉位置、拖车 ID 和堆场状态数据，并通过 API 推送到云软件和客户系统。Outrider
              后续感知和强化学习发布显示，公司正在为规模化加固技术栈，而不只是增加功能：更远传感器范围、更多数据、更快路径规划和混合云训练，都指向吞吐和边缘案例处理是当前工程前沿。
