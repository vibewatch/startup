            body: >-
              估值未披露，情景分析只能保持条件化。牛市情景需要的不止是漂亮演示叙事：2026
              年部署必须转化为多场站收入扩张，正常运行时间可靠，客户集中度可管理，融资条款也不能把大部分上行转移给普通股股东之外的资本。基准情景假设 Outrider
              的技术和客户证据足以通过尽调，但只有在收入质量得到验证之后，才能按接近当前融资的纪律性条款投资。熊市情景的驱动因素与其说是产品无关，不如说是经济性和资本市场。TechCrunch 对 Kodiak
              的报道、Truck News 的宏观评论，以及 Crunchbase
              的集中度快照都指向同一点：自动驾驶领域仍有资本，但资本更挑剔，对无法快速证明规模经济的公司也越来越惩罚。再叠加尚未稳定的联邦规则制定环境，结论就是：公司或许值得再看一轮，但不值得盲目给溢价估值。
