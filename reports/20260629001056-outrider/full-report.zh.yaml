      - number: '2.2'
        title: 规模测算视角与估计区间
        blocks:
          - type: paragraph
            body: >-
              公开市场规模数据只有在被当作分层视角，而不是单一 TAM 时才可用。最窄的硬件视角是码头牵引车市场，独立出版机构分歧很大：The Business Research Company 估计 2026 年价值为
              $1.04 billion，Mordor Intelligence 则估计为 $1.41 billion。两者仍同意北美是当前最大区域，电动化和自动化是重要前向驱动。更宽的软件加硬件视角来自
              FactMR，其将自主堆场车辆市场测算为 2026 年 $2.1 billion，并到 2036 年增长至 $5.7 billion。另一层控制软件体现在月台与堆场管理系统，The Business
              Research Company 估计 2026 年规模为 $5.13 billion。Outrider 自己的支持服务新闻稿还引用 ABI Research 对自主堆场和 shuttle 运营的更宽 $64
              billion 全球市场估计；但该数字由公司材料引用，且很可能纳入相邻工作流，因此更适合作为上限叙事标记，而不是基础情景承销输入。实际结论是，Outrider
              位于多个重叠的数十亿美元支出池交汇处，这些边界不应机械相加。
