      - number: '8.4'
        title: 最终尽调要求与退出准备度
        blocks:
          - type: paragraph
            body: >-
              退出准备度问题很直接：Outrider 目前还不够透明，无法进行干净的公开市场式估值讨论。公开档案仍缺当前估值标记、融资结构、收入质量指标、客户集中度，以及 2026
              年发行之后的现金续航桥接。这些不是表面缺口；它们决定公司应被视为溢价自动化平台、里程碑驱动的私募轮，还是存在桥接风险的标的。正确尽调姿态是在定价前迫使公司证明三件事：第一，商业化正在走出灯塔部署；第二，场站扩张后，毛利率和支持强度会改善；第三，最新融资条款没有嵌入下行保护，导致新投资人付了上行的钱却拿不到上行。管理层若无法用一手证据回答这些要求，资金投入前投资假设就应中止。
