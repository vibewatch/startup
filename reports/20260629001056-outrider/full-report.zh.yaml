      - number: '4.2'
        title: 成本结构、单位经济性与牵引力代理指标
        blocks:
          - type: paragraph
            body: >-
              Outrider 的公开成本结构明显重于纯软件，但轻于一家从零制造自有码头牵引车的公司。Orange EV 的合作伙伴页面显示，Outrider 及其客户购买了具备自主化准备的电动堆场牵引车，并可通过 OEM
              生态获得购买、租赁、租用、保修和现场服务选项。Sustainability Magazine 和 Rite-Hite
              材料显示，部署栈其余部分仍需要充电、无线网络、月台设备、控制系统和设施流程改造。支持服务发布又增加了远程专家、自诊断、预防性维护和人在回路的异常处理。强化学习材料还增加了另一项成本桶：AI
              训练基础设施，包括混合云训练和 NVIDIA DGX H200 容量。


              公开牵引力信号真实存在，但还不是财务报表。Georgia-Pacific 在一个具名部署中完成了 1,000 多次自主拖车移动；到 2024 年 10 月，Outrider 称其总体已超过 100,000
              次自主拖车移动。来源还重复了公司声明：其客户基础代表北美堆场牵引车的 20%
              以上。这些事实支持商业相关性和潜在利用率，但没有揭示每次移动收入、每站点支持人力、毛利率、CAC、回本期或客户集中度。因此，单位经济性可以从结构上描述，但无法用数字承销。
