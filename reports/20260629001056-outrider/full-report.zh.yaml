      - number: '3.3'
        title: 转换成本、分销力量，以及为何现状仍重要
        blocks:
          - type: paragraph
            body: >-
              Outrider 最难打的竞争对手，可能是已经嵌在买方采购流程里的玩家。Orange EV 有足够多在役车辆、正常运行时间证明和客户标准化经验，让电动堆场牵引车显得正常而非实验性。Kalmar Ottawa 和
              Terberg 同样受益于装机基础信任、经销商或服务覆盖，以及未来在熟悉平台上叠加自主化的能力。ISEE 和 TICO 则用另一种方式降低转换摩擦：承诺下线即具备自主化能力的牵引车，并为现有 TICO
              车队提供改装；对一些买方来说，这比同时改变工作流和硬件标准更容易。软件优先替代方案进一步压低风险。Kaleris、FourKites 和 C3
              可以数字化闸口控制、拖车可视化、月台排程和调车任务调度，同时基本保留现有卡车和用工模式。这一点很重要，因为真实堆场中的手工作业基线仍很强：2026
              年公开评论继续把电子表格、纸质日志、无线电调度和薄弱拖车可视化描述为常见运营实践。在这种环境里，许多运营方在接受完整自主化带来的资本、安全和组织负担之前，先靠软件、摄像头和流程重设计就能显著提高吞吐。因此，Outrider
              不仅要卖更好的机器人，还要卖一条比既有厂商、软件供应商和买方自有运营团队更有说服力的变革管理路径。
