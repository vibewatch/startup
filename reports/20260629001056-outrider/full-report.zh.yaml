      - - 客户集中 / 合同不透明
        - 具名生产证据没有突破稀薄的公开参考集
        - 尽调中拿不到合同包、SLA/赔偿附件或多场地生产参考名单
        - 限制持仓规模，或等私人客户尽调补上透明度缺口后再推进。
      - - 监管 / 责任就绪度
        - 安全论证和场地合规包仍然泛化
        - 没有针对具体部署的合规备忘录、事故治理包或保险分配审查
        - 升级到法律尽调，不要把下行风险按常规工业软件风险承保。
    notes: 终止标准是定性的，但可以监控。它们把来源支撑的风险栈转成尽调触发项，而不是编造概率。
