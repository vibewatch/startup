        - 直接同业
        - 最近披露的大额融资达到 $50M；2023 年披露 130+ 名员工
        - 欧洲场院、制造园区和集装箱码头
        - 人机协同自动驾驶和远程接管降低运营焦虑
        - 最近可见融资披露已较早；公开材料暗示仍有人工参与，而不是纯无人驾驶自动化
      - - Orange EV
        - 既有电动场院卡车 OEM
        - 1,900+ 辆卡车在役；创纪录的 600 辆订单部署至 2026 年
        - 北美正在电动化场院运营的车队
        - 规模、正常运行时间、保修和服务支持让 EV 场院卡车走向主流
        - 本身不解决完整自动驾驶工作流；自动驾驶可叠在硬件之上
      - - Kalmar Ottawa + Forterra
        - 既有 OEM 加自动驾驶新进入者
        - 已生产 85,000+ 辆牵引车；AutoTT 目标 2026 年底全面量产
        - 配送中心、码头、工业场院
        - 可承接自动化的线控平台，叠加既有厂商服务可信度
        - 公开材料中，自动驾驶仍处于测试 / 试点推进阶段
      - - Terberg
        - 既有 OEM
        - 全球服务网络；为 TOC Europe 2026 重点展示增强版 EV 牵引车
        - 港口、配送中心、工业运营
        - 全球支持网络和灵活 EV 电池版本
        - 公开材料更强调 EV / 服务，而非已上线自动化场院部署
      - - Kaleris / FourKites / C3
        - 相邻软件供应商
        - 企业场院软件平台，有可见客户证明和集成
        - 高吞吐配送中心、零售、杂货、包裹、网络化货主
        - 不靠机器人卡车，也能解决闸口、月台、可视化和任务分派痛点
        - 不能直接替代拖车驾驶人工
      - - Lazer Logistics EV 项目
        - 托管服务替代方案
        - 覆盖美国 20 个州和加拿大的 70+ 个站点
        - 想要低运营负担推进电动化的货主
        - 一站式卡车采购、充电、合规和报告
        - 主要回答电动化和托管运营问题，不是自动驾驶搬运
      - - 人工场院运营 / 内部自建
        - 现状 / 替代方案
        - 现有人工、当前调车车队、内部 IT 预算
        - 较小或资本纪律更强的场院，以及先上软件的企业
        - 组织变化最小，也最容易用现有卡车分阶段推进
        - 仍受人工登记、无线电调度、场院搜索时间和可视化不稳定约束
