        title: 耐久性、支持与扩张逻辑
        blocks:
          - type: paragraph
            body: >-
              Outrider 对耐久性的披露是运营性的，而不是合同性的。系统以订阅服务形式提供，打包自主化、云软件、自动拖车库存和 24x7
              支持；这正是经常性收入和重复使用所需的架构形态。支持披露异常具体：系统自诊断问题，追踪维护间隔之间的移动，在被堵月台或碎片需要人工介入时提醒现场人员，并把未解决问题升级给受训远程专家，专家结论再用于改进 AI
              技术栈。这很重要，因为它说明客户耐久性取决于正常运行时间和异常处理，而不是“零人工运营”的幻想。扩张逻辑同样可信。Outrider
              把当前部署与当下配送中心相连，并把未来多式联运铁路和港口应用放在后面；Orange EV 的 2026
              年市场证据显示，相邻堆场电动化市场的客户在正常运行时间、服务和融资模型被证明后，正从试点转向车队标准化。不过，这些都不能替代实际续约、流失或多站点 cohort 披露。
