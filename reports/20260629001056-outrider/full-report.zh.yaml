  - id: TV004
    title: 可比估值表
    columns:
      - 参考对象
      - 2026 年运营信号
      - 2026 年估值或融资标记
      - 与 Outrider 的相关性
      - 主要限制
    rows:
      - - Serve Robotics
        - FY2025 收入 $2.7M 后，2026 年收入展望约 $26M
        - 约 $0.51B 市值
        - 收入基数薄的新兴自动驾驶软件下边界标记。
        - 人行道配送不是场院运营工作流。
      - - Ouster
        - 2026 Q1 收入 $49M；GAAP 毛利率 43%；出货 12,600+ 个传感器
        - 约 $2.67B 市值
        - 有用的组件平台和工业自动驾驶参考。
        - 传感器经济性不等于完整部署经济性。
      - - Aurora
        - 2026 Q1 商业启动带来收入 $1M；自动驾驶期权价值仍驱动估值
        - 约 $12.47B 市值
        - 展示公开市场如何在收入成熟前给自动驾驶定价。
        - 高速自动驾驶不同于封闭场院工作流和安全范围。
      - - Symbotic
        - FY2026 Q2 收入 $676M；调整后 EBITDA $78M
        - 约 $24.89B 市值
        - 上边界仓储自动化规模参考，且有真实盈利证明。
        - 相比 Outrider，它是规模大得多、成熟得多的上市公司。
      - - FERNRIDE
        - Series A 延伸轮新增 €18M；总融资 €75M
        - 私募融资标记，估值未披露
        - 欧洲最接近的已披露私有场院自动驾驶融资参考。
        - 融资额不是估值标记，地域也不同。
      - - Gatik
        - $600M 合同收入；完全无人配送已规模化
        - 私有商业里程碑标记，估值未公开
        - 展示由合同支撑的自动驾驶证明可以是什么样子。
        - 中程厢式货车不是场院牵引车。
      - - Kodiak
        - 以大幅折价融资 $100M，股价下跌 37%
        - 折价 2026 年融资信号
        - 自动驾驶故事在压力下如何被重估的反向可比项。
        - 公开交易动态不同于私募轮，模式也是高速货运。
    notes: 公开市值截至 2026-06-29 访问日期。私有公司行使用融资或合同里程碑，因为已审阅公开来源没有披露可比私有估值标记。
    enumerationScope:
      coverage: partial
      basis: >-
        Model-appropriate 2026 reference set spanning warehouse automation, autonomy platforms, sensing, and
        yard-adjacent private peers rather than an exhaustive peer list.
