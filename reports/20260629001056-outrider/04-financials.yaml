- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Current public status
  - Underwriting impact
  - Exact diligence path
  rows:
  - - Realized pricing by site, truck, software module, and support contract
    - Not publicly disclosed
    - Cannot determine revenue quality or software-versus-services mix
    - Request executed contracts, invoices, and revenue-recognition memo
  - - Revenue / ARR / mix by stream
    - Not publicly disclosed
    - Impossible to anchor valuation or growth quality from public evidence
    - Request audited revenue by stream and month plus bookings waterfall
  - - Gross margin by stream and support cost per site
    - Not publicly disclosed
    - Margin path and scalability remain unproven
    - Request site-level P&L and stream-level gross margin bridge
  - - CAC, sales cycle, and payback
    - Not publicly disclosed
    - Enterprise sales efficiency and return on deployment remain unknown
    - Request CRM funnel metrics, CAC model, and customer ROI studies
  - - Cash balance, burn, runway, debt, and covenants
    - Not publicly disclosed
    - Capital adequacy cannot be underwritten from fundraising headlines alone
    - Request cash bridge, debt schedules, lease obligations, and runway model
  - - Customer concentration, renewal behavior, and contract duration
    - Not publicly disclosed
    - Strong traction metrics could still mask concentration risk
    - Request top-customer revenue table, contract durations, and renewal rates
  notes: This table captures the exact missing metrics blocking a full underwriting view. “Not publicly disclosed” is an evidence-backed conclusion, not a placeholder guess.
