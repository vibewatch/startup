callouts:
- calloutType: insight
  title: Commercial architecture is visible even though pricing is not
  body: 'The public record is sufficient to show what Outrider sells: integrated autonomous yard operations, software, support, and site integration. It is not sufficient to show what customers actually pay for any one layer.'
  claimRefs:
