  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-and-revenue
    missingEvidence: Executed customer contracts, SKU-level pricing schedules, realized price per site or per move, and any revenue-recognition policy for multi-year deployments or support subscriptions.
    whyItMatters: Without realized contract economics, investors cannot separate software-like recurring revenue from hardware pass-throughs, services revenue, or deployment fees, so revenue quality remains opaque.
    diligencePath: Request five recent customer contracts, pricing redlines, booked-versus-realized revenue by stream, and any monthly recurring support or software invoices.
    relatedQuestionRefs:
    - QI002
    - QI003
    - QI009
    - QI025
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by stream, support labor cost per site, CAC, sales-cycle length, payback period, and any customer ROI studies with baseline and post-deployment operating data.
    whyItMatters: Margin path is the core underwriting question for an autonomy business that blends hardware, software, field support, and AI compute; public sources only describe the mechanism, not the economics.
    diligencePath: Request cohort-level gross margin, sales funnel conversion by stage, customer ROI case studies, and site-level P&Ls covering support, maintenance, compute, and depreciation assumptions.
    relatedQuestionRefs:
    - QI004
    - QI010
    - QI013
    - QI014
    - QI015
    - QI016
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-durability
    missingEvidence: Current cash balance, monthly burn, runway forecast, working-capital assumptions, debt facilities, letters of credit, and any project-finance or leasing commitments.
    whyItMatters: The 2026 Form D shows financing remained active after the 2024 Series D, but public sources do not reveal whether that reflects growth acceleration, cash need, or prudent balance-sheet management.
    diligencePath: Request board-approved budget, monthly cash bridge, debt and leasing schedules, covenant package, and management’s next-round trigger or break-even plan.
    relatedQuestionRefs:
    - QI006
    - QI008
    - QI011
    - QI021
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: customer-concentration-and-sales-efficiency
    missingEvidence: Named customer roster, contract duration, renewal rates, site count by customer, pilot-to-production conversion, and revenue concentration by top account.
    whyItMatters: Public traction metrics such as >20% yard-truck representation are impressive but can still mask a highly concentrated revenue base or unusually long enterprise sales cycles.
    diligencePath: Request top-20 customer table with ARR or contract value, deployment stage, start date, renewal status, and pipeline conversion history.
    relatedQuestionRefs:
    - QI004
    - QI005
    - QI022
    - QI023
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
  - type: missing-source
    severity: minor
    topic: site-level-capex-breakdown
    missingEvidence: Per-site cost breakdown for truck procurement, autonomy kit retrofit, charging, wireless networking, dock equipment, safety validation, and rollout services.
    whyItMatters: Public sources prove the cost buckets exist, but not their relative size, making it hard to compare Outrider’s capital intensity against software-only yard alternatives or manual operations.
    diligencePath: Request one representative deployment bill of materials and the standard implementation workback schedule from signed purchase order to live autonomous operations.
    relatedQuestionRefs:
    - QI006
    - QI007
    - QI012
    relatedTableRefs:
    - TI003
