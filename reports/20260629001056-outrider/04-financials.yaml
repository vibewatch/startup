- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Gross margin
    - null
    - Low
    - Key test of whether the business behaves more like software, services, or industrial automation
    - Provide gross margin by stream and contribution margin by live site
  - - CAC / sales efficiency
    - null
    - Low
    - Enterprise autonomy can hide expensive pilots and long conversion cycles
    - Provide CAC, sales-cycle duration, pilot-to-production conversion, and pipeline stage aging
  - - Customer payback / ROI
    - null
    - Low
    - Management claims lower cost and better utilization, but no audited payback is public
    - Provide baseline-versus-postdeployment labor, dwell, damage, and throughput data
  - - Support labor intensity
    - 24x7 remote monitoring plus specialist exception handling
    - Medium
    - Support labor can be a major drag on gross margin if deployments are still exception-heavy
    - Provide average tickets per site, remote-resolution rate, and field-service cost per site
  - - Vehicle-platform capital intensity
    - 24 autonomy-ready EV trucks purchased; OEM financing options visible
    - Medium
    - Outsourcing base trucks lowers manufacturing burden but not deployment capital needs
    - Provide truck cost, autonomy-kit cost, ownership mix, and lease terms
  - - AI compute and training cost
    - Hybrid cloud plus NVIDIA DGX H200 training environment
    - Medium
    - Training velocity and inference costs can materially affect unit economics in robotics
    - Provide annual compute spend, depreciation policy, and cost per model release
  notes: Public evidence supports the existence of these cost buckets, but not their magnitudes. Unknown numeric metrics remain null rather than guessed.
