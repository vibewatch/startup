- calloutType: risk
  title: Financing remained active in 2026, but runway is still opaque
  body: A new Form D after the 2024 Series D is not a red flag by itself, but it does confirm that commercialization still required fresh financing activity. Without cash, burn, debt, or covenant data, investors cannot tell whether that was opportunistic or necessary.
  claimRefs:
  - CI029
  - CI030
  - CI032
  - CI033
- calloutType: risk
  title: Adverse evidence targets scaling economics, not product relevance
  body: The key skeptical sources do not argue that yard autonomy is useless. They argue that wide deployment still depends on purpose-built platforms, trust, and provable economic value—exactly the areas where Outrider’s public disclosures remain thinnest.
