- id: cost-structure-unit-economics-and-traction-proxies
  title: Cost structure, unit economics, and traction proxies
  body: 'Outrider’s public cost structure looks materially heavier than pure software, but lighter than a company trying to manufacture its own terminal tractors from scratch. Orange EV’s partner page shows that Outrider and its customers bought autonomy-ready electric yard trucks and can access purchase, lease, rent, warranty, and field-service options through the OEM ecosystem. Sustainability Magazine and Rite-Hite materials show the rest of the deployment stack still needs charging, wireless networking, dock equipment, controls, and facility-process changes. The support-services launch adds remote specialists, self-diagnostics, preventative maintenance, and human-in-the-loop exception handling. Reinforcement-learning materials add another cost bucket: AI training infrastructure, including hybrid-cloud training and NVIDIA DGX H200 capacity.


    Public traction signals are real but not yet financial statements. Georgia-Pacific completed more than 1,000 autonomous trailer moves in one named deployment, and by October 2024 Outrider said it had surpassed 100,000 autonomous trailer moves overall. Sources also repeat the company claim that its customer base represents more than 20% of North American yard trucks. Those facts support commercial relevance and potential utilization, but they do not reveal revenue per move, support labor per site, gross margin, CAC, payback, or customer concentration. As a result, unit economics can be described structurally but not underwritten numerically.'
