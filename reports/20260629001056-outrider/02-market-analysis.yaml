- id: sizing-lenses-and-range
  title: Sizing Lenses and Estimate Range
  body: 'Public market sizing is usable only when treated as layered lenses instead of a single TAM. The narrowest hardware lens is the terminal tractor market, where independent publishers disagree materially: The Business Research Company puts 2026 value at $1.04 billion while Mordor Intelligence estimates $1.41 billion. Both still agree North America is the largest current region and that electrification plus automation are important forward drivers. A broader software-and-hardware lens comes from FactMR, which sizes autonomous yard vehicles at $2.1 billion in 2026, growing to $5.7 billion by 2036. A different control-software layer appears in dock and yard management systems, which The Business Research Company sizes at $5.13 billion in 2026. Outrider’s own support-services release cites an even wider $64 billion global market for autonomous yard and shuttle operations from ABI Research, but because that figure is company-authored and likely sweeps in adjacent workflows, it works better
    as an upper-bound narrative marker than as a base-case underwriting input. The practical conclusion is that Outrider sits at the intersection of several overlapping multi-billion-dollar spend pools whose boundaries should not be added together mechanically.'
