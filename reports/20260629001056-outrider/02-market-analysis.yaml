- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Autonomous yard operations system
    - Autonomous trailer moves, yard orchestration software, trailer tracking, remote support, safety tooling
    - Public-road AV networks and generic warehouse robotics
    - Large enterprise distribution, manufacturing, and logistics operators
    - Closest expression of what Outrider publicly sells today
  - - Terminal tractors / yard trucks
    - Manual, electric, and autonomy-ready yard trucks used inside private yards
    - Linehaul tractors and on-road fleets
    - Fleet, yard, and facilities operators
    - Hardware layer that bounds near-term vehicle TAM
  - - Dock / yard management software
    - Gate management, dock scheduling, trailer tracking, yard inventory control, yard management
    - Unrelated ERP modules or non-yard labor tools
    - Supply-chain IT and operations teams
    - Control layer that determines integration scope
  - - Site electrification and charging
    - Chargers, feeder upgrades, battery monitoring, service packages
    - Grid generation and unrelated building retrofits
    - Facilities and sustainability stakeholders
    - Required when buyers pursue zero-emission yards
  - - 'Adjacency: intermodal and port automation'
    - Container handling and repetitive geofenced yard moves
    - Broad marine equipment spend not tied to trailer workflows
    - Terminal and rail operators
    - Useful adjacency but broader than current Outrider proof set
  notes: Boundary logic separates Outrider’s yard wedge from broader autonomy, port-equipment, and warehouse-automation categories so later TAM claims do not double count adjacent spend.
