company:
  name: Outrider
chapter:
  number: 2
  title: Market Analysis
  summary: 'Outrider sells into a layered market rather than one clean category: autonomous yard vehicles, terminal tractors, and dock-and-yard orchestration software all matter to the buying decision. Independent publishers support a 2026 spend floor in the low-single-digit billions for the software and hardware layers, while Outrider cites a far broader $64 billion upper bound for autonomous yard and shuttle operations; the gap mainly reflects market-boundary differences, not a settled TAM. Demand is real in distribution centers, 3PL networks, and manufacturing yards, but brownfield power upgrades, safety governance, and undisclosed customer economics still constrain the immediately serviceable market.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary and Status-Quo Substitutes
  body: Outrider’s market is best defined as private-yard trailer movement and control, not generic autonomy. Its homepage, system page, and 2025 operating releases all describe a package that combines autonomous electric yard trucks, yard orchestration logic, trailer tracking, and remote support for mixed-traffic logistics yards. That means included spend covers terminal tractors and yard trucks, the control software that dispatches and tracks trailer moves, site integration work, and the support services needed to keep driverless yards running. Excluded spend should include long-haul AV networks, inside-the-four-walls robotics, and unrelated warehouse software. The status quo is still manual diesel or electric terminal tractors coordinated through local operating rules plus YMS, WMS, or TMS systems. This boundary matters because broad autonomy headlines can easily inflate Outrider’s opportunity by mixing yard, port, warehouse, and public-road categories into one number.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
