- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Large distribution centers
    - Retailers, parcel networks, large e-commerce operators
    - Yard spotters, dock managers, dispatch teams
    - Corporate logistics or facility budget
    - Pilot autonomous trailer moves -> WMS/TMS/YMS integration -> multi-site rollout
    - Operations + supply-chain IT + facilities
    - Trailer-turn pressure, safety, and labor savings
  - - 3PL networks
    - Third-party logistics operators
    - Yard supervisors and dispatch teams
    - 3PL operating budget or customer-backed capex
    - Start at highest-volume campuses -> expand across network
    - Operations + commercial leadership
    - Need for automation-ready service levels for shipper clients
  - - Manufacturing yards
    - Manufacturers with private trailer yards
    - Plant logistics and shipping teams
    - Plant operations budget
    - Automate repetitive shuttles around production schedules
    - Plant operations + EHS + facilities
    - Safety, scheduling precision, and reduced manual labor
  - - Intermodal / port adjacencies
    - Terminal and rail operators
    - Terminal crews and dispatchers
    - Terminal capex and operating budgets
    - Deploy in geofenced repetitive moves with stronger governance
    - Terminal operations + engineering
    - Throughput and asset utilization
  - - Software-led yard orchestration buyers
    - Enterprises modernizing gate, dock, and trailer visibility first
    - Schedulers and planners
    - Supply-chain software budget
    - Replace manual data entry -> digital twin / automated scheduling -> hardware automation later
    - Supply-chain IT + logistics operations
    - Need for real-time visibility and lower manual checking
  notes: Budget ownership is partly inferred from public buyer descriptions, integration requirements, and electrification workstreams. Public evidence is stronger on segment and workflow than on exact internal approval chains.
