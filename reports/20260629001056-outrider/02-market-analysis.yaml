callouts:
- calloutType: insight
  title: Outrider’s real market is a system budget, not a single vehicle SKU
  body: The public evidence points to a combined systems purchase in which software integration, uptime support, and site readiness matter almost as much as the vehicle itself. That helps explain why the dock-and-yard management software pool is larger than the pure terminal-tractor hardware pool.
  claimRefs:
  - CM015
  - CM017
  - CM025
  - CM029
- calloutType: risk
  title: Published TAMs can overstate the serviceable distribution-yard wedge
  body: The public estimates range from about $1 billion for terminal tractors to $64 billion for broad yard-and-shuttle automation. That spread is too wide to treat as one market and mainly reflects changing category boundaries, port exposure, and whether software or services are included.
  claimRefs:
  - CM007
  - CM008
  - CM011
  - CM012
- calloutType: strength
  title: Distribution centers and 3PLs look like the cleanest wedge
  body: Distribution centers are the largest end-use segment in the fetched autonomous-yard-vehicles source set, and industrial real-estate research points to ongoing 3PL outsourcing, automation-ready buildings, and sustained trailer-dense logistics demand. That gives Outrider a sharper entry wedge than the broadest market reports imply.
  claimRefs:
  - CM009
  - CM022
  - CM023
  - CM031
  - CM032
