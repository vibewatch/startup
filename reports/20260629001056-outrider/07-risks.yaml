- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold/event
  - action implication
  rows:
  - - Capital sufficiency
    - Follow-on financing cadence versus rollout spend
    - 2026 Form D remains partially sold deep into deployment season or next raise is on materially worse terms
    - Pause underwriting of aggressive deployment assumptions and re-run downside with slower commercialization.
  - - Operational support burden
    - Remote specialists and site personnel cannot absorb edge cases
    - Intervention rate stays high or MTTR fails to improve after new support services and additional hiring
    - Treat uptime economics as structurally labor-intensive rather than software-like.
  - - Partner concentration
    - Vehicle, sensing, or compute supplier disruption
    - Any key partner roadmap slip or inability to support next deployment wave
    - Assume rollout timing slips and margin worsens until substitution path is documented.
  - - Customer concentration / contract opacity
    - Named production proof does not expand beyond a thin public reference set
    - No contract pack, SLA/indemnity schedule, or multi-site production reference list in diligence
    - Cap position size or defer until private customer diligence closes the transparency gap.
  - - Regulatory / liability readiness
    - Safety-case and site-compliance package remains generic
    - No deployment-specific compliance memo, incident-governance pack, or insurance allocation review
    - Escalate to legal diligence and do not underwrite downside as routine industrial-software risk.
