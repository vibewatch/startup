- id: operational-reliability-and-site-readiness
  title: Operational reliability risk comes from edge cases, site infrastructure, and harsh-yard conditions
  body: 'The operational risk case is strongest where Outrider is also most candid: the system still needs humans when edge cases exceed autonomous recovery. Support-service materials repeatedly say the platform notifies site personnel when assistance is needed and escalates harder issues to trained remote specialists. That is a credible commercialization model, but it also means uptime depends on staffing quality, diagnostic tooling, and the rate at which novel incidents can be converted into repeatable playbooks. Partner evidence sharpens the same point. Ouster frames the product as a 24/7 harsh-environment system that must back trailers to docks, hitch precisely, and operate through snow, rain, and temperature extremes. Rite-Hite shows the yard cannot be automated in isolation because dock levelers, restraints, communication systems, and facility retrofits still have to work as part of the operating loop. Terminal Industries'' 2026 yard research is a useful adverse check: many facilities
    still lack real-time yard visibility and still lose time to gate congestion and trailer misplacement. So the operational question is no longer whether the product exists; it is whether exception-heavy brownfield yards can support reliable multi-site deployment without service intensity eroding economics.'
