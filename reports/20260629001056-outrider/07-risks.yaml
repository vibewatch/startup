  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Named production-account list, top-customer revenue share, expansion schedule by site, and customer SLA pack.
    whyItMatters: Residual downside changes materially if the business is concentrated in a few early accounts or if contract protections are weak.
    diligencePath: Request the five largest customer contracts, current production-site list, and an account-level rollout and renewal schedule.
    relatedQuestionRefs:
    - QR015
    - QR021
    relatedTableRefs:
    - TR005
  - type: missing-source
    severity: material
    topic: incident-history
    missingEvidence: Public or private incident ledger covering collisions, emergency stops, remote interventions, recalls, and near misses by site and period.
    whyItMatters: Without incident and intervention telemetry, investors cannot test whether support intensity is falling or whether safety claims are holding under scale.
    diligencePath: Request safety committee minutes, incident summaries, root-cause reviews, and monthly intervention-rate dashboards for the last 12 months.
    relatedQuestionRefs:
    - QR018
    - QR027
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: insurance-and-indemnity
    missingEvidence: Customer-facing insurance tower, liability allocation, indemnity carve-outs, and limitation-of-liability exhibits.
    whyItMatters: The liability stack can move from manageable to thesis-breaking if operational responsibility and coverage are misaligned across Outrider, customers, and partners.
    diligencePath: Review insurance binders, broker summary, enterprise MSA exhibits, and partner indemnity language for safety-critical components.
    relatedQuestionRefs:
    - QR021
    - QR030
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: deployment-specific-compliance
    missingEvidence: Site-by-site legal memos covering OSHA allocation, remote-assistance governance, incident reporting, and any state or local operating constraints.
    whyItMatters: Current public evidence explains the general framework but not whether each live deployment has cleared the exact compliance and liability path needed for scale.
    diligencePath: Request outside-counsel memos, site hazard assessments, and any insurer or regulator correspondence for live and near-term deployment states.
    relatedQuestionRefs:
    - QR028
    - QR001
    relatedTableRefs:
    - TR001
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-risk-register
    missingEvidence: A more exhaustive jurisdiction-by-jurisdiction list of permits, standards, or contractual obligations for every deployment environment.
    whyItMatters: The chapter can rank the visible risk buckets without this list, but it cannot claim the public regulatory register is exhaustive.
    diligencePath: Extend the register with deployment-state legal reviews, customer site standards, and partner approval documentation before final IC memo drafting.
    relatedQuestionRefs:
    - QR004
    - QR028
    relatedTableRefs:
    - TR001
