company:
  name: Outrider
chapter:
  number: 7
  title: Risks
  summary: 'Outrider''s highest residual risks are execution-linked rather than existential: safety and uptime still depend on human exception handling, rollout still depends on partner hardware and site retrofits, and the 2026 Form D means capital needs did not end with the 2024 Series D. Public mitigations are real, but legal/regulatory exposure, customer-opacity, and financing sufficiency still require private diligence before downside can be underwritten confidently.'
sections:
- id: legal-regulatory-and-liability-stack
  title: Legal, regulatory, and liability risk is manageable only with a defensible safety case
  body: 'Outrider has more public safety process disclosure than a typical industrial-autonomy startup, but that does not make the legal stack trivial. Its safety page describes an explicit safety-case framework built around risk assessment, design completion, testing completion, and sign-off, and the 2025 safety release adds unusually concrete numbers: 14 safety mechanisms addressing more than 200,000 yard-specific hazards, plus outside review from TUV SUD against the AV Conformity Framework. Those are meaningful mitigations because the relevant deployment environment is not a lab; it is a mixed-traffic yard with people, docks, trucks, and trailers. Still, the public regulatory backdrop remains incomplete. OSHA''s general duty clause makes the customer site responsible for recognized workplace hazards, while federal autonomous-commercial-vehicle rulemaking is still evolving and proposed frameworks would rely on manufacturer-authored safety cases and could shift real-time driving duties
    toward the manufacturer. Outrider''s own privacy notice and terms also broaden the diligence surface by adding applicant-data handling, site-availability disclaimers, and binding-arbitration language. The right conclusion is not that legal risk is acute today, but that it stays high until incident, insurance, compliance, and contract packs are reviewed privately.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR013
  - CR014
  - CR015
