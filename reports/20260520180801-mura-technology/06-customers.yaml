  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: repeat-usage-and-satisfaction
    missingEvidence: Customer-level delivery histories, renewal notices, NRR or churn metrics, and satisfaction evidence for named counterparties.
    whyItMatters: Without repeat-usage data, the public record proves strategic commitment but not durable recurring demand.
    diligencePath: Request customer shipment histories, renewal schedules, QBR decks, and any retention KPI pack used by the board.
    relatedQuestionRefs:
    - QU013
    - QU014
    - QU026
  - type: private-evidence-only
    severity: material
    topic: customer-economics
    missingEvidence: Contracted volumes, pricing formulas, margin contribution, and customer revenue concentration by account.
    whyItMatters: These details determine whether the named customer set is commercially diversified or just strategically impressive.
    diligencePath: Review executed offtake and licence summaries with pricing, minimum-volume, and take-or-pay terms.
    relatedQuestionRefs:
    - QU022
    - QU015
  - type: missing-source
    severity: material
    topic: actual-customer-shipments
    missingEvidence: Monthly shipment data or independent customer confirmations showing recurring deliveries from Wilton or Ibaraki.
    whyItMatters: Public proof currently shows agreements and launches more clearly than repeat fulfillment, making retention inference indirect.
    diligencePath: Ask for bills of lading, mass-balance certification outputs, and customer acceptance records for initial and repeat deliveries.
    relatedQuestionRefs:
    - QU013
    - QU023
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table coverage
    missingEvidence: A full list of all signed counterparties, pipeline prospects, and any unnamed or confidential offtake or feedstock agreements.
    whyItMatters: The named customer table is credible but incomplete because only public counterparties can be enumerated.
    diligencePath: Reconcile a management-provided customer register against the public list and classify each account by stage and materiality.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: singapore-commercialisation
    missingEvidence: Named Singapore offtakers, feedstock suppliers, final investment timing, and customer conversion milestones for the Jurong project.
    whyItMatters: Singapore is the most important new expansion node, but public proof is still at site-rights and integration-benefits stage.
    diligencePath: Request the Singapore project development plan, partner MOUs, and any local feedstock or offtake heads of terms.
    relatedQuestionRefs:
    - QU007
    - QU019
