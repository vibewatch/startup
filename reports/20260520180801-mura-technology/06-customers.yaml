- id: adoption-and-commitment-depth
  title: Adoption trajectory and commitment depth
  body: 'The adoption path is visible through milestones rather than through a disclosed customer-count dashboard. In 2022, Dow and Mura announced a large-scale strategic partnership in which Dow would act as a key off-taker and support a plan for multiple world-scale facilities. In 2024, Mura signed a separate Neste offtake agreement for ISCC PLUS accredited products from Wilton. On the licensing side, LG Chem moved from investment and licence purchase in 2022 to construction in 2023, while Mitsubishi Chemical and ENEOS moved from earlier licensing into a launched 20,000-tonne Ibaraki facility in 2025. The 2025 Singapore announcement then extended the visible pipeline with a PCS-backed Jurong Island site and direct access to potential downstream customers.


    This pattern matters because it shows that Mura is not trying to win dozens of small contracts before proving the system. It is using large counterparties to validate different parts of the model: Dow and Neste for product offtake, LG Chem and Mitsubishi/ENEOS for technology deployment, and Geminor for feedstock reliability. Public traction therefore resembles infrastructure project development more than software customer acquisition. The positive interpretation is that every incremental counterparty materially upgrades credibility. The negative interpretation is that customer acquisition remains lumpy: each new account is large, strategic, slow-moving, and highly consequential to the wider commercial story.'
  claimRefs:
