  summary: Mura’s commercial path moves from strategic validation through licensing/offtake, feedstock lock-in, commissioning, and only then repeat delivery proof.
  data:
    items:
    - stage: '1'
      label: Problem owner identified
      detail: Large petrochemical or waste-chain actor identifies need for circular feedstock or deployment partner
    - stage: '2'
      label: Strategic diligence
      detail: Counterparty evaluates Hydro-PRT, licensing structure, certification pathway, and plant economics
    - stage: '3'
      label: Commitment signed
      detail: Outcome is usually a licence sale, feedstock contract, or offtake agreement rather than a simple product PO
    - stage: '4'
      label: Site integration
      detail: Host site, utilities, feedstock preparation, or pipeline connections are locked in around the project
    - stage: '5'
      label: Commissioning / launch
      detail: Customer proof strengthens when a plant starts up, launches, or moves toward customer shipments
    - stage: '6'
      label: Repeat expansion
      detail: 'The weakest public stage today: recurring delivery, renewal, and satisfaction evidence remain thin'
