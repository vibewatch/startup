  - id: adverse-signals-and-open-gaps
    title: Adverse Signals and Open Gaps
    body: >
      The most significant publicly evidenced adverse signal is the cancellation of the Böhlen advanced recycling
      facility in Germany in August 2025. The announcement cited "persistent economic and regulatory challenges"
      affecting manufacturing investment competitiveness in Europe. This follows the broader context of ExxonMobil
      reportedly pausing €100 million of European plastic recycling investment due to draft EU rules (noted in
      chemicalrecycling.org news index), suggesting a sector-wide regulatory headwind rather than a Mura-specific
      failure. Nevertheless, the Böhlen project had been cited in prior materials as a flagship European
      deployment alongside the Teesside plant, and its loss removes a planned ~120 kta capacity addition and
      the Dow partnership from the European growth story.

      Additional open questions include: (1) Total equity dilution and cap table composition—KBR holds 18.5%,
      Licella's vehicle held 25-50% (now removed from PSC register), LG Chem amount unknown, and BlackRock's
      stake undisclosed. (2) Revenue recognition to date: Mura Wilton has "shipped first product" per website
      claims but no revenue figures are publicly available. (3) The KBR IP charge (Charge 0002, March 2026)
      represents a potentially significant control lever by a single strategic partner who also controls global
      licensing. (4) Directors Stuart Bradie and others departed in March 2026, raising governance continuity
      questions around the time KBR tightened its financial security interest. (5) Operations at Mura Wilton have
      been delayed repeatedly (mid-2024 → Q4 2025 → beyond), which may indicate unresolved commissioning or
      process engineering challenges.
    claimRefs:
      - CO042
      - CO043
      - CO044
      - CO045
      - CO046

