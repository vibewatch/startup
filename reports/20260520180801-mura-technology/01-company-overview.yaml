callouts:
  - calloutType: strength
    title: World's First Commercial Hydrothermal Plastic Recycling at Scale
    body: >
      Mura Wilton is the first commercial-scale Hydro-PRT® facility globally. The technology has
      received independent LCA validation (WMG/ecoinvent, EU JRC), demonstrating ~80% lower GWP versus
      incineration and ~50% lower GWP versus pyrolysis. Inclusion in the ecoinvent database provides
      the supply chain with independently auditable environmental data, which is critical for ISCC PLUS
      accreditation claims by downstream customers.
    claimRefs:
      - CO015
      - CO016
      - CO017
      - CO033

  - calloutType: risk
    title: KBR Multi-Role Concentration Risk
    body: >
      KBR simultaneously holds equity (18.5%), operates as exclusive global licensor, acts as preferred
      engineering contractor, and as of March 2026 holds a security charge over all of Mura's IP and
      property. This concentration of roles in a single strategic partner creates significant dependency
      and a potential conflict of interest: KBR controls the licensing pipeline, the engineering delivery,
      and now the IP security position. Any deterioration in the KBR-Mura relationship would threaten the
      licensing business model simultaneously from commercial, engineering, and creditor angles.
    claimRefs:
      - CO006
      - CO028
      - CO032
      - CO046

  - calloutType: risk
    title: European Regulatory Headwind Evidenced by Böhlen Cancellation
    body: >
      The August 2025 cancellation of the Böhlen facility with Dow—citing "persistent economic and
      regulatory challenges" in European manufacturing—signals material risk to the company's European
      growth plan. This is corroborated by reports of ExxonMobil pausing €100M of European plastic
      recycling investment due to EU regulatory uncertainty. If the EU Packaging and Packaging Waste
      Regulation (PPWR) or Extended Producer Responsibility (EPR) frameworks do not deliver the
      economic incentives promised, further European projects may not proceed, concentrating risk in Asia.
    claimRefs:
      - CO041
      - CO042
      - CO043

  - calloutType: insight
    title: Licensing Business Model Depends on KBR Channel Exclusively
    body: >
      All global licensing outside Mura's owned plant routes through KBR. This means Mura's ability to
      monetise its technology at scale is entirely contingent on KBR's commercial priority and pipeline.
      With KBR also holding an IP charge, Mura's technology assets—the primary differentiator—serve as
      collateral for what is functionally a lender, not only a partner.
    claimRefs:
      - CO006
      - CO007
      - CO032

