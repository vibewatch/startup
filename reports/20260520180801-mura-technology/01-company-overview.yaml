  - id: commercial-milestones-and-facilities
    title: Commercial Milestones and Facilities
    body: >
      Mura Wilton (Teesside, UK) is the company's first and only wholly owned commercial-scale Hydro-PRT® plant,
      located within the Wilton Centre industrial complex on the former ICI Wilton site in Redcar, Cleveland. The
      plant was formerly branded as ReNew ELP (a Mura subsidiary), and entered its commissioning phase in 2025
      under px Group's operations and maintenance contract. The Innovate UK grant completion announcement (June
      2025) confirmed the plant's operational status. In March 2024, Mura signed a long-term offtake agreement
      with Neste for ISCC PLUS-certified circular hydrocarbon products; the Mura website's Neste news article
      initially expected operations at the Teesside site to commence mid-2024, subsequently delayed to Q4 2025
      per the Singapore announcement. An annual carbon-saving of 40,000 tonnes (CO2e) has been identified at
      the Wilton site (per the Innovate UK/WMG KTP announcement, August 2024).

      Two licensed commercial facilities are in operation internationally: Mitsubishi Chemical Corporation (MCC)
      in Ibaraki, Japan (license signed 2021), and LG Chem in Dangjin, South Korea (equity investor and licensee).
      Mura states combined UK, Japan, and Korea capacity of approximately 60 kta by end of 2025. In August 2025,
      Mura announced a new 50 kta facility on Jurong Island (Singapore Essential Chemicals Complex) with site
      secured from PCS Pte. Ltd.—its first expansion into Southeast Asia, operated through a Mura Technology Asia
      entity. A 5-year research partnership with Ghent University's Laboratory for Chemical Technology (LCT),
      announced in April 2024, supports R&D into hard-to-recycle polymers.

      The adverse milestone is the cancellation of the planned Böhlen (Germany) facility with Dow in August 2025,
      attributed to "persistent economic and regulatory challenges" affecting manufacturing competitiveness in
      Europe. This represents a material contraction of the originally planned European footprint and raises
      questions about commercial viability in regulated Western markets beyond the UK.
