  - id: founding-story-and-technology-origins
    title: Founding Story and Technology Origins
    body: >
      Mura Technology was established as a joint venture by Licella Holdings Limited (an Australian
      hydrothermal-liquefaction technology firm). Licella began R&D on advanced plastic recycling in 2014, building
      on its Cat-HTR™ (Catalytic Hydrothermal Reactor) platform originally developed for biomass conversion.
      The Cat-HTR™ technology applies supercritical water—water heated and pressurised above its critical point
      (374°C, 221 bar)—to crack carbon-carbon bonds in polymers, converting them to shorter-chain hydrocarbons
      without the need for hydrogen or catalysts. Licella established Mura as the commercial vehicle for plastic
      advanced recycling in 2016, with Dr Stephen (Steve) Mahon as CEO and co-founder.

      Mura has since branded and registered the process as Hydro-PRT® (Hydrothermal Plastic Recycling
      Technology), which replaces the earlier HydroPRS™ trade name. The technology's key advantage over
      competing pyrolysis-based approaches is the use of water as the reaction medium rather than heat alone;
      this enables processing of a wider range of plastic types—including contaminated, flexible, multi-layered,
      and mixed plastics that cannot be mechanically recycled—without pre-sorting, while producing higher-quality
      outputs. An EU Joint Research Centre (JRC) report published in 2023 benchmarked Hydro-PRT® as best-in-class
      among advanced recycling technologies, showing approximately 50% lower Global Warming Potential (GWP)
      versus two reviewed pyrolysis technologies. A University of Warwick WMG LCA independently published in 2023
      showed an 80% reduction in climate impacts from Hydro-PRT® versus incineration of plastic waste. In November
      2024 Mura became the first advanced recycler to be included in the ecoinvent life cycle inventory database
      following peer review, giving downstream buyers access to independently verified environmental data.

      Mura's relationship with Licella as founding parent and technology licensor was materially restructured
      over time: Cat-Htr Plastics Pty. Limited (an Australian entity associated with Licella) formerly held a
      25–50% stake in Mura as a Person with Significant Control (PSC), but that designation has since been
      removed. The two companies continue to collaborate, with Licella's website confirming that Mura's Hydro-PRT
      facilities are "at the core of three completed commercial advanced recycling facilities globally."
