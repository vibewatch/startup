companyProfile:
  summary: >
    Mura Technology Limited (Companies House #10520772) is a private limited company incorporated in December 2016
    in Teesside, UK. It commercialises Hydro-PRT®, a hydrothermal advanced recycling process derived from
    Licella Holdings' Cat-HTR™ platform, which uses supercritical water to crack mixed plastic waste into
    circular hydrocarbon products without catalysts or hydrogen. The company operates Mura Wilton — the world's
    first commercial-scale hydrothermal plastic recycling plant, which entered commissioning in 2025 and has
    shipped its first product to offtake partner Neste. KBR Inc. acts as exclusive global licensing partner,
    preferred engineering contractor, and holds 18.5% equity plus a March 2026 IP security charge. Licensed
    facilities are operating at Mitsubishi Chemical Corporation (Ibaraki, Japan) and being commissioned by
    LG Chem (Dangjin, South Korea). A planned German facility with Dow at Böhlen was cancelled in August 2025
    citing persistent economic and regulatory challenges in Europe. Singapore expansion (50 kta) was announced
    in August 2025, with a site secured on Jurong Island. CEO Dr Steve Mahon has led the company since inception.
  foundedDate: "2016-12-12"
  founders:
    - name: "Dr Stephen (Steve) Mahon"
      role: "Co-founder and CEO"
      background: >
        Investment professional and entrepreneur with background in environmental sector investing; has delivered
        three IPOs in prior career; has led Mura since 2016.
      claimRefs: [CO019]
  foundingLocation: "Wilton Centre, Redcar, Cleveland, UK"
  headquarters: "Main Building, Wilton Centre, Redcar, Cleveland, TS10 4RF, UK"
  productSummary: >
    Hydro-PRT® process technology: converts mixed, contaminated, and hard-to-recycle plastic waste into circular
    hydrocarbon products (naphtha, wax, process gas, heavy oil) via supercritical water at 374°C and 221 bar.
    Outputs are ISCC PLUS certified and sold on offtake agreements to petrochemical companies (e.g. Neste) for
    use as fossil-replacement feedstock in new plastic production. Technology is also licensed to international
    petrochemical firms (MCC, LG Chem) through KBR, with KBR providing engineering services per licensed site.
  customerFocus: >
    Petrochemical companies and plastics producers seeking ISCC-certified circular feedstocks (direct product
    buyers); international chemical groups seeking turnkey licensed advanced recycling capacity (technology
    licensees); waste management companies and packaging brands seeking recycling solutions for hard-to-recycle
    plastics (feedstock suppliers and Packaging Pact partners).
  businessModel: >
    Dual revenue model: (1) direct hydrocarbon product sales from Mura Wilton operations under long-term offtake
    agreements; (2) technology licensing fees earned when KBR licenses Hydro-PRT® to third parties plus
    engineering margin from KBR-delivered projects. Mura receives a proportion of licensing and engineering
    revenues from the KBR partnership.
  stage: "Commercial (first plant commissioned and producing product; technology licensed at 2 additional sites)"
  fundingStatus: >
    KBR Inc. has invested an aggregate $100M for an 18.5% equity stake. LG Chem made an equity investment of
    undisclosed size alongside its technology licence. Innovate UK awarded £4.42M in 2024 (completed June 2025).
    A £120M fundraise was reported by The Guardian in December 2023 (article no longer accessible; amount and
    BlackRock participation unconfirmed independently). No public valuation confirmed. KBR holds a security
    charge (Charge 0002, March 2026, outstanding) over all Mura property and intellectual property.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO006, CO009, CO019, CO027, CO028, CO032]
summary:
  headline: >
    Mura Technology is the first commercial operator of hydrothermal advanced plastic recycling, with
    best-in-class environmental credentials and KBR's institutional backing, but faces critical financial
    opacity, an outstanding IP security charge, and the Böhlen cancellation as adverse commercial signals.
