- id: head-to-head-diligence-gaps-and-adverse-view
  title: Head-to-head diligence gaps and the adverse comparison
  body: |-
    The adverse view is straightforward. Plastic Energy presently looks more proven than Mura on accessible commercial track record: it has an operating plant network, long-standing strategic relationships with major petrochemical partners, and a clearer history of selling TACOIL™ into the plastics value chain. Brightmark shows a second warning sign from the opposite direction: big announced capacity and high-profile investment plans can coexist with restructuring, bankruptcy-court processes, and uneven plant performance. Mura’s own Böhlen cancellation places it between those two examples—more differentiated technologically than Brightmark, but less commercially de-risked than Plastic Energy.

    The remaining diligence gaps are therefore highly decision-relevant. Public materials do not disclose comparable plant-level pricing, uptime, yield, or gross-margin data across Mura and peers. Exact licensing economics, minimum-volume commitments, and customer switching frictions are largely undisclosed. Even competitor scale is inconsistently reported: accessible pages clearly show operating sites, JVs, and capacity ambitions, but not always auditable plant counts or utilization. Before making a hard head-to-head underwriting decision, an investor would need plant-performance data from Wilton, a sharper view of KBR’s licensing funnel, and customer interviews that compare Mura’s hydrothermal product quality with Plastic Energy’s and Brightmark’s pyrolysis oils in real procurement workflows.
