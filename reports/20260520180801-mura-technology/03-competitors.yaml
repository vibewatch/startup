- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat-factor
  - mura-position
  - risk-if-eroded
  - mitigation
  rows:
  - - Feedstock flexibility
    - Hydro-PRT® is positioned for mixed, contaminated, flexible, multilayer waste
    - If pyrolysis peers or incumbent preprocessors match tolerance, Mura loses its cleanest differentiation
    - Prove yield and uptime on the hardest streams at Wilton and future licensed sites
  - - Carbon-performance narrative
    - Mura cites ~50% lower GWP versus reviewed pyrolysis and strong incineration savings
    - If customers buy mainly on price or challenge methodology, sustainability premium compresses
    - Keep third-party LCA and database inclusion current and comparable
  - - KBR distribution and licensing reach
    - Exclusive global licensing partner extends Mura beyond its own balance sheet
    - If KBR pipeline slows or bargaining power shifts, Mura’s GTM leverage weakens
    - Diversify commercial proof points and disclose license pipeline quality
  - - Certification and downstream integration
    - ISCC PLUS and offtake relationships support customer adoption
    - If rivals deliver equivalent certification with stronger balance sheets, switching costs fall
    - Deepen customer qualification, mass-balance workflows, and product consistency
  - - Wilton learning curve advantage
    - First commercial hydrothermal plant gives operational know-how and troubleshooting data
    - If Wilton underperforms, first-mover status turns from moat into proof of fragility
    - Show sustained uptime, product quality, and commissioning milestones
  - - Brand / IP / Hydro-PRT® trademark
    - Distinct process brand and patent-backed know-how help narrative control
    - If core economics are reproducible by larger rivals, branding alone is weak
    - Pair IP narrative with measurable plant performance and customer adoption
  notes: Risk register focuses on whether Mura’s claimed advantages translate into durable commercial leverage rather than on technological novelty alone.
