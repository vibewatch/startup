- id: moat-durability-and-switching-costs
  title: Moat durability, switching costs, and erosion scenarios
  body: |-
    Mura’s best moat argument is not simply that it has a proprietary process; many rivals also claim patents, certification pathways, and partner ecosystems. The stronger case is that Hydro-PRT® combines three things that are not yet matched in one package by the reviewed peers: hydrothermal rather than pyrolytic conversion, broad feedstock flexibility, and a documented sustainability narrative that claims materially lower carbon intensity than reviewed pyrolysis pathways. KBR’s exclusive global licensing role also gives Mura a distribution amplifier that a small independent startup would struggle to build alone, while Wilton provides first-of-a-kind operating data and troubleshooting experience that only become more valuable if the plant reaches sustained utilization.

    Still, this moat is conditional rather than absolute. Feedstock flexibility loses value if pyrolysis systems materially improve contamination tolerance or if waste-management incumbents lock up the most attractive waste streams. Carbon advantage loses value if customers buy primarily on price or if integrated petrochemical groups package mass-balance circular products with stronger balance sheets and broader customer reach. Licensing leverage becomes a vulnerability if KBR’s incentives diverge from Mura’s. The Böhlen cancellation is the most concrete reminder that commercial readiness is not the same as moat durability: a differentiated process can still struggle if site economics, regulation, and partner commitment do not hold.
