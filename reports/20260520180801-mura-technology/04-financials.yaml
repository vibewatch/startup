- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - why it matters
  - best public proxy
  - impact on underwriting
  - exact diligence path
  rows:
  - - Current cash balance
    - Needed for runway and insolvency-risk assessment
    - Strategic investors, share allotments, and government support
    - High — cannot tell whether Mura can self-fund delays
    - Obtain latest management accounts and cash waterfall by entity
  - - Monthly burn / fixed overhead
    - Needed to assess urgency of further fundraising
    - KBR backing and ongoing commissioning activity
    - High — no public runway estimate is credible
    - Request monthly burn bridge split by corporate, Wilton, and development projects
  - - Wilton realized selling prices
    - Needed to model revenue quality and gross margin
    - Named offtake counterparties and long-term-contract language
    - High — contract proof exists but commercial economics do not
    - Request sample offtake agreements and price formulas
  - - Feedstock procurement economics
    - Inbound plastic cost / gate fees can swing contribution margin sharply
    - Named suppliers Elite and Geminor; no economics
    - High — margin case could invert depending on feedstock terms
    - Request supplier contracts and contamination-quality adjustments
  - - Yield and product-slate mix
    - Needed to convert plant throughput into monetizable outputs
    - Hydro-PRT descriptions of output families only
    - High — impossible to build tonnage-to-revenue bridge precisely
    - Request operating data from commissioning and guaranteed-yield assumptions
  - - Working-capital cycle
    - Inventory and receivables can consume large cash before revenues normalize
    - None
    - Medium to high — first-of-a-kind plants often need more working capital than expected
    - Request DSO / DPO / inventory plans and customer payment terms
  - - Secured debt / charge terms
    - Determines seniority, covenants, and refinancing risk
    - Companies House charge filing only
    - High — collateralization of all property and IP can materially change downside recovery
    - Request facility agreement, security package, and covenant schedule
  - - License economics with KBR / licensees
    - Needed to assess whether the asset-light model is truly attractive
    - Exclusive licensing language and named partner sites
    - Medium — thesis depends on high-margin technology revenue
    - Request license fee schedule, royalty rates, and services attachment
  notes: The right diligence posture is not “wait for public data to improve”; it is “identify the private data required to convert this into an underwritable model.”
