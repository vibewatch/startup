- calloutType: risk
  title: Böhlen plus the 2026 charge are the clearest adverse finance signals
  body: One public signal shows a major project failing on economics and regulation; the other shows all-property / all-IP security granted to a KBR affiliate. Together they argue for caution on capital adequacy despite partner backing.
