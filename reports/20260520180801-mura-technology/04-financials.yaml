- id: TI004
  title: Capital adequacy table
  columns:
  - metric
  - public value / status
  - evidence
  - implication
  - diligence ask
  rows:
  - - Cash on hand
    - Undisclosed
    - No reviewed source gives a current cash balance
    - Impossible to verify self-funded runway
    - Request latest cash balance by legal entity
  - - Monthly burn
    - Undisclosed
    - No reviewed filing or investor page surfaces the number
    - Cannot estimate operating runway or urgency of next financing
    - Request trailing 12-month cash burn and capex burn separately
  - - Runway months
    - Undisclosed
    - Derived metric cannot be built without cash and burn
    - Forward capital adequacy remains inferential
    - Request board runway model with downside case
  - - Planned use of funds
    - Support first commercial plant and develop additional US / Europe projects
    - Mura and KBR explicitly say 2022 proceeds support Teesside and future projects
    - Capital still tied to project delivery milestones
    - Request updated use-of-proceeds after Wilton commissioning delays
  - - Next-round trigger
    - Not publicly stated
    - No reviewed source defines a formal trigger
    - Likely linked to Wilton ramp, additional own-site development, or refinancing needs
    - Request management view on next external-capital decision point
  - - Equity sponsor backing
    - $100m KBR additional investment; LG Chem equity investment (amount undisclosed)
    - Strategic investors remain visible in cap table
    - Partner backing is real but not fully quantified
    - Request full cap table, ownership percentages, and side-letter economics
  - - Project / government support
    - £4.42m Innovate UK grant + £5m Future Fund for Wilton
    - Publicly disclosed on Wilton site page
    - Reduces first-site funding burden and signals external validation
    - Confirm whether support has been fully drawn and what conditions apply
  - - Debt / project-finance obligations
    - March 2026 charge over all property and IP in favor of KBR affiliate
    - Filing shows fixed + floating charges and negative pledge
    - Adds financing concentration and possible covenant risk
    - Request underlying facility agreement, maturities, and collateral release conditions
  - - Licensee capex externalization
    - Partner sites funded by licensees rather than Mura-owned capex
    - LG Chem and MCC examples support asset-light scale-out
    - Can reduce Mura capex intensity if license funnel converts
    - Request share of capex, royalties, and support obligations for partner sites
  notes: The binding requirement here is not to pretend public numbers exist where they do not. This table keeps the missing fields explicit and separates strategic backing from actual runway disclosure.
