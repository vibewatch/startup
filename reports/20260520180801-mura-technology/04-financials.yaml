- id: capital-base-is-strategic-but-increasingly-encumbered
  title: Capital base is strategic, but increasingly encumbered
  body: |-
    Public evidence shows Mura has raised meaningful strategic capital even though full cash balances remain undisclosed. KBR’s June 2022 press release says it invested an additional $100 million, bringing its aggregate stake to 18.5%, funding Mura in two tranches and taking a board seat. LG Chem separately completed an equity investment and bought a process licence, while Mura’s Wilton page says the first site was backed by parent-company funding plus investment from Dow, KBR, and igus, alongside a £4.42 million Innovate UK grant and a £5 million Future Fund equity injection. Companies House filings reinforce that capital has continued to come in: total ordinary shares rose from 2,995,901 in February 2023 to 3,211,829 in March 2025.

    The shareholder base itself matters. The February 2026 confirmation statement still lists KELLOGG BROWN & ROOT LIMITED, LG Chem, Dow Europe Holding B.V., and CAT-HTR Plastics Pty Ltd as shareholders, showing that strategic partners and the underlying Cat-HTR licensor remain embedded in the cap table. But March 2026 also introduced a more cautionary signal: Mura registered a charge in favor of Kellogg Brown & Root Solutions Limited covering all property and all intellectual property, with fixed and floating charges plus a negative pledge. Without the underlying financing document, it is not possible to say whether this is a routine project-support structure or a tighter secured-credit arrangement. Either way, public evidence now points to a company that is well connected, but not obviously self-funding from disclosed operating cash flow.
