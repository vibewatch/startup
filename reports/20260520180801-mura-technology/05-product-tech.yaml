    - Hydrothermal supercritical-water route rather than pyrolysis; broad mixed-plastic claim set
    - Request independent yield, uptime, and product-spec data from steady-state operations
  - - Mura Wilton commercial asset
    - Mura and first offtake / validation counterparties
    - First owned commercial-scale site
    - Reference plant for operating proof, customer qualification, and sustainability data generation
    - Request commissioning dossier and first full-year operating metrics
  - - KBR-led licensing package
    - Global industrial licensees
    - Commercially active
    - Exclusive licensing + preferred engineering channel extends deployment beyond Mura-owned capex
    - Request sample license package, scope of engineering support, and rollout economics
  - - Licensed partner sites (LG Chem / MCC)
    - Partner operators in Korea and Japan
    - In build / deployment
    - Evidence that the process is replicable outside the UK and within major petrochemical groups
    - Need site-by-site startup, design, and output proof
  - - Sustainability evidence stack (WMG / JRC / ecoinvent)
    - Regulators, brand owners, petrochemical customers
    - Active and expanding
    - Unusually rich independent LCA narrative for an early industrial platform
    - Need ongoing updates based on actual plant operation rather than design assumptions
  - - Ghent research / pilot capability
    - R&D and future chemical partners
