    - Engineers, partners, policy stakeholders
    - Active outreach layer
    - Industry explainers, process video, FAQ, and IChemE-linked documentary content
    - Outreach is not a substitute for auditable plant-performance data
  notes: 'The “product” here is a platform: process chemistry, commercial asset, licensing package, and evidence stack rather than a single SKU.'
