company:
  name: Mura Technology
chapter:
  number: 5
  title: Product & Technology
  summary: 'Mura’s product is not a consumer-facing app or a generic “advanced recycling” claim; it is a specific hydrothermal plastics-conversion platform, Hydro-PRT®, wrapped in a deployment stack that includes feedstock preparation, supercritical-water conversion, downstream hydrocarbon offtake, KBR-led licensing, and a growing evidence layer of LCAs and partner research. The public architecture is unusually legible for an industrial startup: Mura explains the hydrothermal route, the targeted waste streams, the Wilton commercial asset, and the research extensions with WMG and Ghent. Product differentiation rests on three linked claims — broad mixed-plastic acceptance, hydrothermal rather than pyrolytic conversion, and stronger documented carbon performance — but maturity is still uneven. The scientific and partner ecosystem is expanding faster than public proof of steady-state plant reliability. Practitioner signal exists through hiring, industry-facing resources, and conference participation
    rather than open-source developer activity.'
sections:
- id: product-definition-and-asset-map
  title: Product definition and asset map
  body: |-
    Hydro-PRT® is best understood as an industrial recycling platform rather than a single reactor or a vague sustainability brand. In customer workflow terms, the product takes mixed post-consumer plastics that would otherwise be landfilled, incinerated, or exported, converts them through a hydrothermal process that uses supercritical water, and produces circular hydrocarbon feedstocks that petrochemical partners can upgrade into new plastics. That workflow has at least five public-facing assets: the Hydro-PRT core process; Wilton as the first commercial reference site; KBR’s licensing and engineering channel for external deployments; partner-funded licensed sites such as LG Chem and Mitsubishi Chemical; and a documentation layer of LCAs, FAQs, and sustainability statements that helps customers and regulators assess the process.

    The product line is therefore broader than “recycling plant capacity.” Mura sells or supports multiple things at once: a process design, a site deployment pattern, a set of hydrocarbon outputs, and an evidence-backed sustainability narrative. Public materials are strong on what the process is for — mixed, contaminated, multilayer, flexible, and rigid plastics — and on where it sits in the plastics value chain. They are weaker on mature plant-performance proof such as uptime, yield, and quality-control statistics. For product diligence, Mura looks more specific than most marketing-heavy advanced-recycling startups, but still earlier on operational disclosure than on conceptual architecture.
