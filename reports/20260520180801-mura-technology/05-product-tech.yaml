- id: roadmap-maturity-and-practitioner-signal
  title: Roadmap, maturity, and practitioner signal
  body: |-
    The public roadmap is clearest where Mura is still building evidence rather than claiming finished maturity. Ghent adds a five-year research path and a continuous-flow pilot-scale facility to evaluate more difficult polymers and composites. WMG’s Innovate UK-backed KTP extends LCA and sustainability modelling into future sites and tools. The ecoinvent interview describes design evolution from the first plant’s 20,000 annual tonnes toward larger future plants, while Mura’s current web surface still lists Wilton as the first owned commercial site and Japan / Korea as licensed facilities. Together these signals suggest a product that is commercially launched in narrow form but technically still expanding and optimizing.

    Because Hydro-PRT is an industrial process platform, the closest thing to “developer signal” is not GitHub activity. It is hiring, practitioner documentation, conference participation, and external research collaboration. Mura’s careers page highlights a small but deliberately skilled organization with long-term incentives, while the resources page shows public videos, LCA documentation, and IChemE-facing communications. That is a valid practitioner proxy, but it also tells you where maturity still sits: in engineering and commercialization, not in a software-style community ecosystem. Product confidence should therefore be anchored to plant data, customer qualification, and replication at partner sites — not to the existence of good conference slides and sustainability explainers.
