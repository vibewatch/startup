- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - company solution
  - measurable benefit
  - limitation
  rows:
  - - Divert mixed plastic waste that mechanical systems reject
    - Waste goes to incineration, landfill, or export
    - Hydro-PRT converts mixed, flexible, rigid, and multilayer waste into circular hydrocarbons
    - Company-claimed route to recycle plastics otherwise not mechanically recyclable
    - No public steady-state conversion economics by waste subtype
  - - Prepare heterogeneous waste for conversion
    - Manual sorting and limited downstream options
    - Baled waste is shredded, contaminants are removed, and feed is pressurized before entering the conversion unit
    - Creates a defined industrial workflow rather than a black-box reactor claim
    - Public detail exists for flow logic but not for throughput loss or reject rate
  - - Produce circular feedstock for petrochemical value chain
    - Virgin fossil feedstock supplied to crackers / polymer plants
    - Hydro-PRT output sold as circular hydrocarbon feedstock to partners like Dow and Neste
    - Drop-in fossil replacement narrative reduces need for packaging redesign
    - No public product spec sheets or realized contract pricing
  - - Deploy advanced recycling in partner geographies
    - Each new geography would require Mura-owned plant development
    - KBR-led licensing enables partner-funded deployments in Korea and Japan
    - Potentially lighter-capex global rollout
    - Public evidence on exact replication quality and startup timing is incomplete
  - - Evidence environmental performance to brands and regulators
    - Chemical recycling often challenged on sustainability credibility
    - WMG LCA, JRC comparison, ecoinvent incorporation, FAQ, and sustainability statements
    - Stronger transparency posture than many category peers
    - Operational data still needs to replace design assumptions over time
  - - Expand addressable polymer scope
    - Harder polymers / composites often remain outside standard process claims
    - Ghent pilot and R&D partnership evaluate broader materials
    - Potential product-boundary expansion beyond current packaging-centric focus
    - Future capability still needs publications and operating proof
  notes: Benefits are evidence-backed but frequently still company-led or pilot-led rather than based on long-run operating disclosure.
