  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Fully diluted ownership
        - Current cap table, option pool, SAFEs / converts, and all liquidation preferences
        - Determines whether common-equity value survives inside the public-evidence range.
        - CFO + counsel data room review.
      - - KBR control mechanics
        - Full charge documents, default triggers, cure rights, and any intercreditor restrictions
        - Clarifies whether the core IP and licensing estate can be impaired in downside cases.
        - Legal diligence on Companies House filings and side letters.
      - - Wilton operating proof
        - Monthly throughput, yield, uptime, product-spec pass rates, and repeat-customer shipments
        - Separates story risk from real commercialization.
        - Operations pack plus customer acceptance evidence.
      - - Customer / license economics
        - Revenue recognition, margin profile, milestone payments, and counterparty concentration
        - Allows real valuation modeling instead of milestone-only proxies.
        - Finance + commercial diligence.
      - - Project-finance plan
        - Cash runway, own-build site capex plan, grants, and debt / equity funding roadmap
        - Advanced-recycling value can be destroyed by financing structure as much as by technology.
        - Treasury / project-finance review.
      - - Exit path
        - Board view on IPO, strategic sale, secondary liquidity, and timing
        - Entry discipline depends on a credible return path, not just a technology story.
        - Board materials and banker conversations.
    notes: These asks are mandatory, not optional, before turning a watch posture into a priced investment decision.
