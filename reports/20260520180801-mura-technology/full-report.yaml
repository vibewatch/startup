      - number: '8.3'
        title: Public comparables argue for a discount, not disbelief
        blocks:
          - type: paragraph
            body: >-
              PureCycle is the most useful public valuation reference in the retained source set because it combines
              real operating disclosure with a current public price. As of May 20, 2026, StockAnalysis showed a roughly
              $2.15 billion market cap, while CompaniesMarketCap put the figure at about $2.14 billion and Macrotrends
              showed a $2.54 billion market cap reference in October 2025. Those values are not trivial: the market is
              willing to capitalize an advanced-recycling company at multi-billion levels before mature profitability.
              But the same evidence also shows why Mura deserves a discount today. StockAnalysis still shows only $10.9
              million of trailing revenue, large losses, negative net cash, 1.47 debt-to-equity, and very high short
              interest, while PureCycle’s own Q1 2026 update points to continuing dependence on project finance, grants,
              revolvers, warrants, and capital-heavy plant buildouts.


              That is the comp lesson: a commercialization-stage recycling platform can absolutely be worth billions,
              but public investors only give that latitude to a company with transparent operating data, public
              liquidity, and repeat reporting. Mura does not yet offer those conditions in the retained public record.
              Market-size research supports the upside case, but even there the figures are wide enough to punish false
              precision: Allied forecasts about $4.0 billion in 2025 rising to $14.4 billion by 2035, while Fairfield
              via Recycling International talks about a $50 billion market by the end of the decade. That spread
              supports optionality, not a premium mark by itself.
