  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct rivals, substitutes, and the real competitive set
        blocks:
          - type: paragraph
            body: >-
              Mura is not only competing against other venture-backed advanced recyclers. The relevant competitive field
              spans at least four layers: direct mixed-plastic conversion peers, polymer-specific advanced recyclers,
              incumbent mechanical recyclers, and integrated petrochemical groups that can source advanced-recycling
              feedstock without owning the front-end process. Plastic Energy is the clearest direct rival because it
              also sells circular hydrocarbon feedstock into petrochemical value chains, already operates plants in
              Spain, and has deep strategic relationships with SABIC and TotalEnergies. Brightmark is the closest U.S.
              analogue in mixed-plastic pyrolysis, although its Ashley restructuring shows how fragile project economics
              can be. PureCycle and Agilyx are technologically credible but narrower: PureCycle is a
              polypropylene-purification specialist and Agilyx is concentrated on polystyrene depolymerization.


              Mechanical incumbents such as Veolia, Biffa, and REMONDIS do not replicate Hydro-PRT®, but they matter
              because they own collection, sorting, municipal relationships, and clean-stream recycling budgets.
              Integrated petrochemical programs such as BASF’s ChemCycling add a different threat: they can combine
              mass-balance certification, existing cracker infrastructure, and customer relationships without building a
              full-stack waste-to-feedstock platform. In practice, Mura must therefore win two contests at once: it must
              prove that hydrothermal processing is better than pyrolysis for hard-to-recycle mixed waste, and it must
              show that a specialist platform can keep enough feedstock and customer access against larger
              waste-management and petrochemical incumbents.
