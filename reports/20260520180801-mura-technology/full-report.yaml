  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Mura is one of the more credible advanced-recycling platforms in the private set because the public record
              shows real strategic counterparties, not just pilot-language optimism. The company has KBR as investor and
              global licensing partner, named offtake linkage with Neste, deployment progress with LG Chem and
              Mitsubishi/ENEOS, a new Singapore project, and an ambition to reach 1.5 million tonnes of annual capacity
              in operation or development by 2032. That is enough to justify continued investor attention. It is not
              enough to justify paying an unspecified premium valuation.


              The key valuation problem is not whether Mura has promise; it is that the retained public evidence still
              does not disclose current revenue, EBITDA, cash burn, a fully diluted cap table, or liquidation
              preferences. That means the right recommendation is track / research-more with explicit entry discipline.
              Investors should treat PureCycle’s public market cap as a sentiment ceiling for commercialization-stage
              advanced recycling, not as a floor Mura automatically deserves. Without repeat Wilton shipment proof and
              private cap-table transparency, public evidence supports conditional interest only at a meaningful
              discount to that public-comp ceiling or with downside-protective structure.
