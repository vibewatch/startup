    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              Mura Technology Limited (Companies House number 10520772) is a private limited company incorporated on 12
              December 2016 in England and Wales, originally under the name Armstrong Chemicals Limited, and renamed to
              its current form on 13 February 2019. The registered office is at Main Building, Wilton Centre, Redcar,
              Cleveland, TS10 4RF, where the company's first commercial Hydro-PRT® facility (Mura Wilton) is also
              located. The company's primary SIC code is 38320 (Recovery of sorted materials), confirming its industrial
              classification as a recycling business rather than a pure technology licensor.

              Mura's business model has two interdependent revenue streams. The first is direct operations: Mura Wilton
              (formerly the ReNew ELP plant) converts waste plastic feedstock into circular hydrocarbon
              products—naphtha, wax, process gas, and heavy oil—sold on long-term offtake contracts to petrochemical
              customers such as Neste. The second is technology licensing: Mura, through its exclusive partnership with
              KBR Inc., licences the Hydro-PRT® process to international petrochemical firms, who build and operate
              their own plants. Licensees include Mitsubishi Chemical Corporation (Ibaraki, Japan) and LG Chem (Dangjin,
              South Korea). KBR acts as the preferred engineering contractor and provides project delivery services at
              each licensed site, creating an integrated engineering-and-licensing revenue model. The company describes
              its mission as becoming "the world's leading producer of circular hydrocarbons from waste plastic," with a
              stated target of 1.5 million tonnes per annum of Hydro-PRT® capacity in operation or development by 2032.
