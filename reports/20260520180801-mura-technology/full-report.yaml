      - number: '8.4'
        title: Bull, base, and bear ranges should be milestone-weighted
        blocks:
          - type: paragraph
            body: >-
              Because Mura does not disclose the operating inputs needed for a conventional revenue-multiple or DCF
              exercise, the most defensible public-evidence method is milestone-weighted comparables. The bear case
              assumes Wilton does not produce convincing repeat shipments, another Böhlen-style execution setback
              emerges, or KBR-control concerns dominate the discussion. In that state, Mura looks more like a
              strategically interesting but finance-constrained platform, supporting only a sub-$1 billion range.


              The base case assumes Wilton can evidence repeat commercial output, the Japan and Korea references keep
              de-risking the licensing model, Singapore advances without a fresh project failure, and investors still
              apply a substantial discount to PureCycle because Mura lacks public revenue and cap-table clarity. That
              produces a roughly $0.9 billion to $1.5 billion range. The bull case requires more than narrative: repeat
              Wilton proof, continued license conversion, no control shock from KBR, and sustained sector sentiment
              strong enough to let Mura approach a public-comp ceiling. That is how the valuation can move into roughly
              the $1.8 billion to $2.4 billion band. On this evidence, the probability-weighted view clusters around the
              low-$1 billions, not around an automatic multi-billion premium.
            claimRefs:
              - CV024
