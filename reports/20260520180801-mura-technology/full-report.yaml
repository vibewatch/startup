      - number: '5.2'
        title: Operating architecture and deployment dependencies
        blocks:
          - type: paragraph
            body: >-
              Mura has disclosed enough about the operating flow to describe a real architecture. Waste arrives in
              bales, is prepared through shredding and removal of glass, metals, and non-target plastics, then is heated
              and pressurized before entering the Hydro-PRT conversion unit. The process uses supercritical water as the
              “agent of change,” breaking carbon bonds and forming shorter-chain, stable hydrocarbons for downstream
              upgrading. Around that core sits a dependency network: specialist waste-management companies provide
              feedstock, px operates Wilton under a 10-year O&M contract, Dow and Neste anchor downstream product
              uptake, and KBR serves as the exclusive licensing and engineering channel for wider global rollout.


              That architecture is promising because it is modular. Wilton provides first-of-kind plant proof, while the
              licensed-site model in Korea and Japan suggests Mura can scale the technology without funding every future
              project itself. But the same architecture creates concentration risks. KBR is not just a sales partner; it
              is deeply embedded in licensing and engineering. px is not just an operator; it is central to site
              reliability. Research partners are not peripheral; they are helping define the next capability boundary
              for new polymers and sustainability models. In other words, the product is not just Hydro-PRT chemistry.
              It is Hydro-PRT plus a partner ecosystem. That is commercially powerful, but it also means
              underperformance by any critical node can slow perceived maturity of the whole platform.
