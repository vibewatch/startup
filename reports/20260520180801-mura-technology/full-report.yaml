  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Mura should not be valued against the entire plastics economy or the entire waste-management stack. Its
              relevant market is the narrower layer where hard-to-recycle post-use plastics are converted into circular
              hydrocarbon feedstocks for petrochemical reuse. That includes hydrothermal or adjacent advanced-recycling
              capacity, feedstock-preparation relationships, certified offtake, and the value-chain interfaces that let
              resin producers and brands claim recycled content without redesigning all packaging formats. It does not
              include all mechanical recycling, all municipal waste operations, all packaging, or all circular-economy
              spending.


              Status-quo alternatives remain important because they set both price ceilings and buyer behavior. Simple,
              cleaner streams can still go through mechanical recycling. Low-value contaminated streams still compete
              with energy-from-waste, landfill, or export. Within advanced recycling, pyrolysis-based providers such as
              Plastic Energy target many of the same waste streams and downstream buyers. Mura’s own positioning
              therefore supports a boundary defined by difficult-to-recycle plastic conversion and circular feedstock
              supply, with adjacencies in collection, upgrading, resin production, and packaging compliance rather than
              one undifferentiated “plastics circularity” TAM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM044
