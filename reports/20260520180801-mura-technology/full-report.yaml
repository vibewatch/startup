      - number: '1.4'
        title: Funding and Investor Landscape
        blocks:
          - type: paragraph
            body: >
              Mura is a private, undisclosed-financials company; no audited financial statements have been made
              available in the public domain from this diligence run. The most material publicly reported financing
              event is a £120 million (approximately $150 million) fundraise reported in December 2023, with BlackRock's
              infrastructure investment unit cited as a leading investor by The Guardian (article now 404). KBR's
              aggregate investment in Mura totals $100 million, as announced in press coverage summarised by
              chemicalrecycling.org, securing KBR an 18.5% equity stake. LG Chem made an equity investment in Mura
              (amount undisclosed), which also includes a technology-licence agreement for a Hydro-PRT® facility in
              Dangjin, South Korea. The UK government's Innovate UK agency provided a £4.42 million Smart Sustainable
              Plastic Packaging (SSPP) Challenge grant, completed June 2025. Total capital raised cannot be verified
              from available public sources and is an open diligence item requiring access to Companies House group
              accounts (last filed July 2025, 53 pages) or direct management disclosure.

              The capital structure carries notable complexity: KBR holds Charge 0002 (registered March 2026, currently
              outstanding) over "all property and all intellectual property" of Mura Technology Limited. A prior charge
              in favour of Dow Europe Holding B.V. was registered February 2022 and satisfied September 2022, consistent
              with the timeline of the Dow commercial partnership. The KBR charge, combined with KBR's roles as
              exclusive licensor, preferred engineering contractor, equity investor and now secured creditor, creates a
              web of interdependencies that should be evaluated for conflicts of interest and governance implications.
              No secondary markets activity or valuation data has been located in any accessible public source.
