  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Named customer map and segment proof
        blocks:
          - type: paragraph
            body: >-
              Mura’s customer proof is unusually specific for an industrial recycling startup, but the proof is
              concentrated in a small number of strategic counterparties rather than a broad disclosed account base. The
              named commercial relationships split into four practical groups. First are offtake buyers, most clearly
              Neste and Dow, which matter because they validate whether Hydro-PRT output can move into the mainstream
              petrochemical chain. Second are technology licensees, especially LG Chem and Mitsubishi Chemical with
              ENEOS, which matter because they validate whether the process can be deployed outside Mura’s own balance
              sheet. Third are feedstock suppliers such as Geminor and other Wilton-linked waste partners, which matter
              because they anchor plant utilization. Fourth are ecosystem signatories such as the UK Packaging Pact,
              which are not customers in the narrow revenue sense but do widen Mura’s route into packaging stakeholders
              and future feedstock relationships.


              The strongest public evidence is commitment evidence: signed offtake, licence sales, construction starts,
              facility launches, and named feedstock tonnage. That is stronger than logo-only marketing, but it is not
              the same as a mature repeat-purchase record. There is little public disclosure of customer-level revenue,
              realized delivery volumes, renewal rates, or satisfaction metrics. So the chapter judgment is that Mura
              has real customer traction, but the traction is strategic and partner-led. The company has persuaded
              tier-one industrial names to commit around plants, licences, and supply chains; it has not yet disclosed
              the kind of broad recurring demand metrics that would remove concentration concerns.
