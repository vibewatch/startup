      - number: '3.2'
        title: Capabilities, pricing logic, and go-to-market overlap
        blocks:
          - type: paragraph
            body: >-
              Capability overlap is real, but not symmetrical. Mura’s Hydro-PRT® proposition is that supercritical water
              can handle mixed, contaminated, flexible, and multilayer plastic that mechanical systems reject and that
              many pyrolysis systems still preprocess heavily. Plastic Energy’s TAC™ route also targets difficult waste
              and produces a circular oil for petrochemical customers, making it the most comparable substitute in buyer
              workflow terms. Brightmark makes a similar pyrolysis pitch in the U.S., but with more visible execution
              turbulence. By contrast, PureCycle competes for a narrower share of the budget because it upgrades
              polypropylene into ultra-pure resin pellets rather than selling hydrocarbon feedstock; Agilyx is narrower
              still because Styrenyx is optimized for polystyrene and styrene monomer recovery.


              Public pricing transparency is weak across the set. None of the reviewed companies publish posted pricing
              for circular feedstock or license packages in the way software vendors publish list prices. Instead, the
              monetization pattern is long-term offtake, customized resin or feedstock contracts, site-specific
              licensing fees, engineering packages, and occasionally waste-management contracts. That means buyer
              lock-in comes less from posted price and more from certification, plant integration, feedstock
              qualification, and downstream product acceptance. Mura’s KBR-led licensing channel could become a strong
              route to market, but it also means Mura’s commercial leverage partly depends on one partner’s pipeline and
              execution priorities.
