      - number: '1.3'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >
              Mura's leadership team is led by Dr Stephen (Steve) Mahon (CEO and founder), a British national who has
              served as director since the company's incorporation in December 2016. Mahon is an experienced investment
              professional with a background spanning three IPOs, AIM-listed technology businesses, and early renewable
              energy development in the UK. He holds a First Class degree and PhD in Geophysics and Planetary Physics.
              Under his leadership, Mura has secured global partnerships with KBR, Dow, LG Chem, and CPChem, and raised
              external capital to fund its first commercial plant.

              The current C-suite also includes Jo-Anne Illman (Chief People Officer), Richard Daley (Chief Technology
              Officer and Managing Director of Mura Wilton, a Chartered Chemical Engineer), Dr Dianna Kyles (Chief Legal
              Officer, with a PhD in Law from King's College London), and Steve Garbutt (Project Director, focused on
              Teesside commissioning). The board-level governance reflects KBR's significant stake: Stuart Bradie (KBR's
              former global CEO) sat as a director until March 2026, when Andrew Marino Goodwin (an American national)
              was appointed. This change coincides with KBR registering a broad legal charge over Mura's property and
              intellectual property in March 2026 (Charge 0002), creating a security position for KBR as a lender in
              addition to its roles as investor, licensee partner, and engineering partner.

              Director turnover has been notable: Larry Ciccarelli and Robin Chamberlayne departed in November 2024.
              Leonard Humphreys (Australian, director since February 2019, linked to Licella's founding involvement) and
              Douglas Nick Kelly (American, appointed May 2024) remain on the board. The concentration of value and
              institutional knowledge in the CEO/founder presents key-person risk, as Mahon is the founding technical
              and commercial lead across all major relationships.
