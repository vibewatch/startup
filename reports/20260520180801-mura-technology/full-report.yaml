              Mura Wilton is the first commercial-scale Hydro-PRT® facility globally. The technology has received
              independent LCA validation (WMG/ecoinvent, EU JRC), demonstrating ~80% lower GWP versus incineration and
              ~50% lower GWP versus pyrolysis. Inclusion in the ecoinvent database provides the supply chain with
