companyProfile:
  summary: >
    Mura Technology Limited (Companies House #10520772) is a private limited company incorporated in December 2016 in
    Teesside, UK. It commercialises Hydro-PRT®, a hydrothermal advanced recycling process derived from Licella Holdings'
    Cat-HTR™ platform, which uses supercritical water to crack mixed plastic waste into circular hydrocarbon products
    without catalysts or hydrogen. The company operates Mura Wilton — the world's first commercial-scale hydrothermal
    plastic recycling plant, which entered commissioning in 2025 and has shipped its first product to offtake partner
    Neste. KBR Inc. acts as exclusive global licensing partner, preferred engineering contractor, and holds 18.5% equity
    plus a March 2026 IP security charge. Licensed facilities are operating at Mitsubishi Chemical Corporation (Ibaraki,
    Japan) and being commissioned by LG Chem (Dangjin, South Korea). A planned German facility with Dow at Böhlen was
    cancelled in August 2025 citing persistent economic and regulatory challenges in Europe. Singapore expansion (50
    kta) was announced in August 2025, with a site secured on Jurong Island. CEO Dr Steve Mahon has led the company
    since inception.
