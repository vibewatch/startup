      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-sided. At one end are waste suppliers and aggregators that secure
              difficult-to-recycle feedstock. In the middle are Mura’s own plants and licensees, backed by KBR and
              chemical operators such as Mitsubishi Chemical and LG Chem. Downstream are petrochemical offtake buyers
              like Neste and strategic partners like Dow, who use circular hydrocarbons as inputs for new plastics.
              Beyond them sit resin producers, converters, consumer brands, and obligated packaging producers whose
              budgets are shaped by recycled-content mandates, EPR fees, and circular-packaging commitments.


              That structure means the user is not always the payer. Waste companies care about disposal alternatives
              and preprocessing economics. Petrochemical buyers care about certified input quality, plant integration,
              and feedstock availability. Brands and producers often supply the economic pull because they need
              compliant recycled-content claims, but they usually purchase through resin or packaging supply chains
              rather than from Mura directly. Adoption therefore tends to move through a value-chain sequence: secure
              feedstock, prove conversion quality, sign offtake, then scale licensing or own-build capacity. Certified
              offtake matters because it converts environmental narrative into a budgetable compliance and procurement
              pathway.
            claimRefs:
