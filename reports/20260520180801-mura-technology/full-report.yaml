  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is visible, but realized economics are opaque
        blocks:
          - type: paragraph
            body: >-
              Mura’s public materials support a two-track monetization model rather than a single plant-sales story.
              First, Mura-owned assets such as Wilton are meant to sell circular hydrocarbon outputs into long-term
              petrochemical offtake relationships. Hydro-PRT product pages explicitly state that feedstock will be
              available on long-term contracts, while Mura’s Wilton page and Neste announcement show named downstream
              buyers for Teesside output. Second, Mura commercializes Hydro-PRT through KBR, which is described as the
              exclusive global licensing and preferred engineering partner. That means future revenue can include
              license awards, milestone payments, engineering packages, and possibly downstream technical-support or
              royalty streams tied to partner-funded plants rather than just Mura-owned production.


              That structure is strategically attractive because it creates a more asset-light scaling path than
              building every plant on Mura’s own balance sheet. It also means public contract announcements are not the
              same thing as recognized revenue. The reviewed source pack contains no posted prices for circular
              hydrocarbons, no public license-fee schedule, and no disclosed split between Mura economics and KBR
              economics on licensed projects. As a result, the commercial route is believable, but revenue quality is
              still unproven in public data. Investors can see where cash should come from; they still cannot see
              realized selling prices, margin capture, or the timing of revenue recognition across product, licensing,
              and engineering streams.
