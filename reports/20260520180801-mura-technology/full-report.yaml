              KBR simultaneously holds equity (18.5%), operates as exclusive global licensor, acts as preferred
              engineering contractor, and as of March 2026 holds a security charge over all of Mura's IP and property.
              This concentration of roles in a single strategic partner creates significant dependency and a potential
              conflict of interest: KBR controls the licensing pipeline, the engineering delivery, and now the IP
              security position. Any deterioration in the KBR-Mura relationship would threaten the licensing business
              model simultaneously from commercial, engineering, and creditor angles.
