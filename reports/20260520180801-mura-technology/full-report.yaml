              The public roadmap is clearest where Mura is still building evidence rather than claiming finished
              maturity. Ghent adds a five-year research path and a continuous-flow pilot-scale facility to evaluate more
              difficult polymers and composites. WMG’s Innovate UK-backed KTP extends LCA and sustainability modelling
