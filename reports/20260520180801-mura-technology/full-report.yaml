        - Clarify board roles, succession and sponsor influence
        - Director changes, committee composition, disclosure quality
        - Walk if governance becomes less transparent while secured-creditor influence increases
      - - Financial model resilience
        - Stress-test fees, compliance, and capital needs
        - Policy fee updates, compliance burden, capex financing signals
        - Walk if unit economics break under plausible fee / delay / compliance downside cases
    notes: >-
      Kill criteria are investor decision rules, not predictions; they translate cited risks into monitorable go/no-go
      thresholds.
