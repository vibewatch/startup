      - number: '6.3'
        title: Retention signals, repeat-usage limits, and expansion potential
        blocks:
          - type: paragraph
            body: >-
              Durability evidence exists, but it is narrower than investors would ideally want. The clearest continuity
              signal is the move from initial agreement to deeper integration. LG Chem did not stop at becoming an
              investor and licensee; it moved into construction. Mitsubishi Chemical and ENEOS progressed from
              technology adoption to plant launch and planned customer shipments. Dow’s relationship also survived the
              failure of the Böhlen project: the cancellation announcement explicitly says Dow and Mura remain committed
              and are pursuing new European opportunities. Neste’s offtake was described as long term, which is stronger
              than a spot-sale framing. These are meaningful retention-like signals because they show relationships
              persisting across years and project stages.


              What is missing is equally important. Mura does not publicly disclose net revenue retention, gross
              retention, renewal percentages, delivered tonnage by customer, repeat order history, or customer
              satisfaction data. Public evidence of actual repeat usage therefore remains indirect. The best available
              proxy is staged continuity: agreement, then construction, then commissioning, then launch, then customer
              shipments. That is enough to say several counterparties are deeply integrated into the platform. It is not
              enough to say Mura has a diversified, recurring, low-churn customer base. Expansion potential is still
              attractive because licensing can add geography without Mura funding every plant itself, but the company
              has not yet published the operating data that would turn continuity into repeat-demand proof.
