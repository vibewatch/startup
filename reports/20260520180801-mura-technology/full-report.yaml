              The August 2025 cancellation of the Böhlen facility with Dow—citing "persistent economic and regulatory
              challenges" in European manufacturing—signals material risk to the company's European growth plan. This is
              corroborated by reports of ExxonMobil pausing €100M of European plastic recycling investment due to EU
