  - id: TE003
    title: Technology / operating architecture table
    columns:
      - layer / process / component
      - role
      - dependency
      - risk
    rows:
      - - Feedstock sourcing and qualification
        - Secures mixed-plastic bales and determines incoming quality band
        - Specialist waste-management suppliers and qualification rules
        - Feedstock contamination or composition drift can impair yield and product quality
      - - Pre-processing and contaminant removal
        - Shredding and removal of glass, metals, and non-target plastics before conversion
        - Mechanical front-end equipment and sorting discipline
        - Public process flow exists, but reject rates and loss factors are undisclosed
      - - Pressurized feed / extruder system
        - Heats and pressurizes prepared plastic before conversion unit
        - Reliable materials handling and thermal control
        - Throughput bottlenecks or startup instability can reduce practical capacity
      - - Hydro-PRT conversion core
        - Uses supercritical water to crack polymer chains into hydrocarbon products
        - Proprietary hydrothermal know-how, operating envelope, and reactor control
        - Core yield and uptime remain the biggest technical diligence gap
      - - Product separation and finishing
        - Generates circular hydrocarbon slate for downstream upgrading
        - Separation efficiency and downstream partner acceptance
        - No public spec sheet on product consistency or reject rates
      - - Licensing and engineering layer
        - Packages the process for third-party deployment through KBR
        - KBR sales reach, engineering capability, and customer pipeline
        - Partner concentration risk if KBR priorities shift
      - - Operations and maintenance layer
        - Runs Wilton under O&M structure
        - px operating capability and site staffing
        - Operator underperformance would weaken first-reference-site proof
      - - Evidence and certification layer
        - Supports sustainability claims through LCA, ecoinvent data, and ISCC-linked output use
        - WMG, Ghent, ecoinvent, KBR / Mura transparency work, downstream certification
        - Sustainability documentation is strong, but it cannot replace long-run operating data
    notes: >-
      This architecture table describes the disclosed industrial flow and partner dependencies, not a confidential
      process diagram.
