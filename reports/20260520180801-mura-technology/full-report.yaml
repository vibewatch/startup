  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk is the top tier
        blocks:
          - type: paragraph
            body: >-
              The most acute legal and regulatory risk is not a generic complaint about policy uncertainty; it is the
              very specific fact pattern created by KBR’s March 2026 charge over all Mura property and all intellectual
              property. Companies House does not describe a narrow asset pledge. It records an outstanding charge in
              favor of Kellogg Brown & Root Solutions Limited, and the filed MR01 confirms that the security package
              includes fixed and floating charges plus a negative pledge. That matters because KBR is not a passive
              lender. Mura’s own licensing page says KBR is the exclusive Global Licensing and Preferred Engineering
              Partner, so creditor enforcement would intersect directly with the company’s commercialization channel. If
              the relationship ever deteriorated, Mura would not simply lose a vendor; it could lose practical control
              over the licensing estate that underpins the bull case.


              The second regulatory layer is category treatment. Mura frames Hydro-PRT as hydrothermal advanced
              recycling that complements mechanical recycling and beats incineration on climate metrics, and KBR points
              to JRC benchmarking against energy recovery. But NGOs and advocacy groups continue to attack advanced or
              chemical recycling as a category, often arguing that it is energy-intensive, fuel-oriented, or not true
              recycling. Those critiques do not always map perfectly onto Mura’s hydrothermal route, which differs from
              pyrolysis, yet the policy risk is still real because regulators often write rules for categories, not for
              one company’s preferred technical nuance. UK packaging reform adds another complexity layer: pEPR,
              modulated fees, and evidence rules create a more structured environment for recycling economics, but also
              a more burdensome one.
