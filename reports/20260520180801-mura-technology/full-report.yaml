            body: >-
              The key public underwriting problem is not the absence of a business model; it is the absence of enough
              numbers to convert that model into cash-flow confidence. Wilton’s phase-one scale is disclosed at 20 kta,
              with public room to expand beyond 80 kta, and partner sites in Korea and Japan show that Hydro-PRT can
              scale through licensees. Yet none of the reviewed sources disclose feedstock cost per tonne, product
              selling price per tonne, actual yield split across naphtha / gas oils / waxes, plant utilization,
              working-capital cycle, monthly burn, or cash runway. The Companies House filing history confirms that
              accounts exist, but the accessible text extraction for the filed accounts is unusable for this chapter and
              the landing pages do not surface the missing headline metrics directly.


              That makes Mura a financing-dependent story until Wilton produces auditable operating data. The bullish
              case is that Wilton demonstrates stable conversion economics and turns named offtake plus KBR-led licenses
              into a blended model of plant revenue and high-margin technology income. The bearish case is that Wilton
              ramps more slowly than expected, license conversion remains partner paced, and further site development
              depends on secured support structures rather than internally generated cash. The Böhlen cancellation is
              the clearest public evidence that differentiated technology does not eliminate economic and regulatory
              execution risk. For now, Mura looks financeable through partners, but not yet publicly underwritable on
              stand-alone cash generation.
