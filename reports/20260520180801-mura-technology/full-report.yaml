      - number: '5.3'
        title: Trust, quality controls, and transparency posture
        blocks:
          - type: paragraph
            body: >-
              Mura’s strongest trust signal is not a long list of generic certifications; it is the amount of public
              technical and sustainability documentation attached to Hydro-PRT. The sustainability page, resources hub,
              WMG materials, KBR’s JRC summary, and ecoinvent interview all point to a company that knows it must prove
              environmental credibility with third-party methods rather than only with sales copy. Public materials
              reference ISCC PLUS accredited products at Teesside, a WMG LCA focused on Wilton, the European Commission
              JRC comparison against pyrolysis and incineration, and ongoing incorporation of Mura datasets into
              ecoinvent for wider LCA use.


              That is useful, but it is not the same thing as complete product-quality disclosure. The reviewed sources
              do not provide steady-state uptime, yield distributions, product-specification sheets, reject rates,
              process safety metrics, or public incident history. Even the ecoinvent interview explicitly notes that
              design assumptions need to be checked against actual plant operation over reasonable periods. So Mura’s
              trust posture is unusually data-aware for an industrial startup, but still incomplete on the operational
              metrics that customers and investors would want before calling the platform fully mature. The company has
              made transparency a product feature in its commercial narrative; it now needs the operating data to
              complete that story.
            claimRefs:
              - CE012
              - CE013
