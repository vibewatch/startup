  topStrengths:
    - >-
      First-of-kind commercial hydrothermal plant operating (Mura Wilton, Teesside UK), shipping ISCC PLUS certified
      product to Neste.
    - >-
      Best-in-class LCA: EU JRC 2023 benchmark shows ~50% lower GWP vs pyrolysis; WMG Warwick shows 80% reduction vs
      incineration.
    - >-
      KBR exclusive global licensing infrastructure already generating two international licensed plants (MCC Japan, LG
      Chem Korea).
    - >-
      Technology differentiator: processes ANY mixed/contaminated plastic including flexible and multilayer; not limited
      by feedstock type unlike pyrolysis.
    - >-
      Regulatory tailwinds: UK EPR full implementation, EU recycled content mandates, ISCC PLUS certification create
      captive petrochemical demand.
  topRisks:
    - >-
      KBR IP charge (March 2026, outstanding): KBR holds security over all Mura property and IP; enforcement could
      transfer control of technology to KBR.
    - >-
      No public financials: revenue, margins, cash runway, and full cap table all undisclosed; financial health cannot
      be assessed independently.
    - >-
      Böhlen cancellation (August 2025): Dow–Mura European facility abandoned, citing persistent economic and regulatory
      headwinds; signals commercial-model fragility in Europe.
    - >-
      Single-plant concentration: Mura Wilton is sole directly operated facility; commissioning delays or operational
      failure eliminates the commercial proof case.
    - >-
      Licella IP dependency: technology originated from Licella's Cat-HTR™; terms of ongoing royalty or licence
      obligations not publicly disclosed.
  unresolvedGaps:
    - >-
      Full audited financials (FY2024 group accounts filed July 2025 but not reviewed): revenue, margin, cash runway,
      net debt.
    - >-
      Full cap table and valuation history: £120M Guardian-reported fundraise and BlackRock participation not
      independently confirmed.
    - 'Terms and scope of KBR Charge 0002 (IP security charge): enforcement triggers, events of default, cure periods.'
    - 'Current throughput and operational metrics at Mura Wilton: actual tonnes processed, yield, product quality.'
    - 'Licella relationship post-PSC removal: whether royalties remain payable and on what terms.'
