  shortDescription: >
    Mura Technology is a UK-based advanced plastics recycler that uses its proprietary Hydro-PRT® supercritical water
    hydrothermal process to convert mixed, hard-to-recycle plastic waste into circular hydrocarbon feedstocks (naphtha,
    wax, process gas, heavy oil). KBR Inc. is its exclusive global licensing partner and holds an 18.5% equity stake
    secured by a charge over all of Mura's IP.
