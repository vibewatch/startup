summary:
  headline: >
    Mura Technology is the first commercial operator of hydrothermal advanced plastic recycling, with best-in-class
    environmental credentials and KBR's institutional backing, but faces critical financial opacity, an outstanding IP
    security charge, and the Böhlen cancellation as adverse commercial signals.
