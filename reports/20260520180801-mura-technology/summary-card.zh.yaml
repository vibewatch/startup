summary:
  headline: |
    Mura Technology 是水热法先进塑料回收的首个商业运营商，环境表现同类领先，也有 KBR 的机构背书；但财务不透明、未结清的 IP 担保权以及 Böhlen 项目取消，都是明确的反向商业信号。
