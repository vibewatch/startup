evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financials
    missingEvidence: Revenue, gross margin, EBITDA, and cash runway for Mura Technology group
    whyItMatters: >-
      Operational financial performance is essential for valuation and risk assessment; Mura Wilton has entered
      commissioning but no revenue figures are available
    diligencePath: Review CH group accounts (FY2024, filed July 2025); request management accounts from company
    relatedQuestionRefs:
      - QO021
      - QO022
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: Böhlen cancellation
    missingEvidence: Terms of the Böhlen project termination with Dow (exit costs, IP reversion, any ongoing Dow offtake arrangements)
    whyItMatters: >-
      Dow relationship and European exposure are key commercial risk factors; terms of exit affect Mura's balance sheet
      and future Dow partnership status
    diligencePath: Request management disclosure; review any public filings by Dow regarding the project
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: Licella relationship
    missingEvidence: Current status of Licella's economic interest in Mura after PSC removal; ongoing royalty or licence terms
    whyItMatters: >-
      Licella is the technology originator; understanding ongoing obligations to Licella affects IP ownership risk and
      cost structure
    diligencePath: Review Licella-Mura technology licence agreement; confirm whether royalty payments are still being made
    relatedQuestionRefs:
      - QO011
      - QO030
  - type: missing-source
    severity: minor
    topic: leadership and founder table
    missingEvidence: Complete public list of all executives, directors, advisors, and appointment metadata as of May 2026
    whyItMatters: TO002 is marked partial; a complete governance roster is needed to assess management depth and board coverage
    diligencePath: >-
      Request full leadership and board list from management; reconcile with Companies House officers data and website
      biographies
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO006
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: virgin-parity economics
    missingEvidence: >-
      Open-source evidence that Hydro-PRT output is consistently at or below virgin-fossil economics across oil-price
      cycles and customer contracts.
    whyItMatters: Valuation depends on whether demand is mandate-only or economically self-sustaining without regulatory pull.
    diligencePath: >-
      Request plant-level cost curves, contracted floor-price formulas, and sensitivity tables versus naphtha or virgin
      polymer benchmarks.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: hard-to-recycle feedstock share
    missingEvidence: >-
      A directly citable open source that quantifies what share of global plastic waste is flexible, contaminated,
      multi-layer, or otherwise unsuitable for mechanical recycling.
    whyItMatters: >-
      This number is needed to move from broad plastics volumes to a defensible SAM rather than a narrative-only
      boundary.
    diligencePath: >-
      Obtain a waste-composition study or analyst dataset that breaks global post-use plastics into mechanically
      recyclable versus advanced-recycling-target streams.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer ROI and premium willingness
    missingEvidence: >-
      Contracted offtake pricing, avoided-fee economics, carbon-credit value, and customer ROI analyses that quantify
      willingness to pay for circular hydrocarbons.
    whyItMatters: >-
      Without quantified customer economics it is hard to underwrite conversion rates, margin durability, or penetration
      into non-mandated segments.
    diligencePath: >-
      Request sample offtake agreements, recycled-content compliance economics, and customer business cases from
      petrochemical buyers and brands.
    relatedQuestionRefs:
      - QM028
    relatedTableRefs:
      - TM004
  - type: access-blocked
    severity: minor
    topic: closed market databases
    missingEvidence: >-
      Full access to premium statistics and member-only industry databases that may refine narrow-market sizing or
      regional splits.
    whyItMatters: >-
      These sources could narrow low/base/high ranges, but the chapter can still ship using open-source evidence with
      disclosed uncertainty.
    diligencePath: >-
      Review Statista premium tables, Chemical Recycling Europe member material, and any licensed market-research
      reports during management diligence.
    relatedQuestionRefs:
      - QM025
      - QM028
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure-gap
    missingEvidence: >-
      Comparable realized contract pricing, feedstock formulas, and license-fee schedules for Mura, Plastic Energy,
      Brightmark, PureCycle, and Agilyx.
    whyItMatters: >-
      Without price and margin visibility, it is difficult to judge whether Mura’s technology edge translates into
      commercial advantage.
    diligencePath: >-
      Request management data room materials, sample customer contracts, and customer interview evidence focused on
      pricing and switching costs.
    relatedQuestionRefs:
      - QP016
      - QP025
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: material
    topic: plastic-energy-scale
    missingEvidence: >-
      Auditable plant-by-plant operating status and utilization for Plastic Energy’s full global footprint, including
      the exact count of commercial plants and JVs.
    whyItMatters: >-
      Plastic Energy is the closest direct rival and operating proof is central to any head-to-head underwriting
      decision.
    diligencePath: Obtain partner confirmations, plant commissioning records, and third-party operating data for each named site.
    relatedQuestionRefs:
      - QP007
      - QP027
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: diligence-gap-comparables
    missingEvidence: Plant-level uptime, yield, product quality, and gross-margin data for Wilton and peer facilities.
    whyItMatters: Commercial readiness cannot be compared credibly on website narratives alone.
    diligencePath: >-
      Request Wilton operating reports, commissioning data, and third-party technical diligence benchmarking against
      direct peers.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs: []
  - type: missing-source
    severity: minor
    topic: mechanical-incumbent-threat
    missingEvidence: >-
      More direct evidence on whether Veolia or other incumbents are moving beyond mechanical recycling into
      advanced-recycling partnerships that would overlap Mura more directly.
    whyItMatters: Incumbent threat may accelerate if waste majors control both feedstock and advanced-recycling channels.
    diligencePath: >-
      Review incumbent annual reports, partnership announcements, and procurement contracts tied to advanced-recycling
      projects.
    relatedQuestionRefs:
      - QP014
      - QP026
    relatedTableRefs:
      - TP001
  - type: stale
    severity: minor
    topic: integrated-petrochemical-threat
    missingEvidence: >-
      A fresher, directly accessible SABIC circular-products page or live petrochemical partner release that is
      auditable in this source pack.
    whyItMatters: The integrated-petrochemical threat is real, but the reviewed live source set is stronger for BASF than for SABIC.
    diligencePath: >-
      Re-fetch current SABIC circular-economy materials or obtain customer/partner documents naming advanced-recycled
      feedstock pathways.
    relatedQuestionRefs:
      - QP015
      - QP027
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: cash-and-burn-disclosure-gap
