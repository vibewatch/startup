company:
  name: Mura Technology
chapter:
  number: 2
  title: Market Analysis
  summary: Mura’s relevant market is not all plastics or all recycling; it is the narrower but still large layer where hard-to-recycle plastic waste is converted into circular feedstocks for petrochemical and packaging value chains. Public estimates vary from a narrow hydrothermal-processing lens of roughly $0.8 billion to a broad chemical-recycling lens of roughly $4.0 billion today, expanding toward $14.4 billion by 2035, while adoption is pulled forward by EPR and PPWR but constrained by capital intensity, feedstock quality, and still-incomplete unit-economics evidence.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and substitutes
  body: |-
    Mura should not be valued against the entire plastics economy or the entire waste-management stack. Its relevant market is the narrower layer where hard-to-recycle post-use plastics are converted into circular hydrocarbon feedstocks for petrochemical reuse. That includes hydrothermal or adjacent advanced-recycling capacity, feedstock-preparation relationships, certified offtake, and the value-chain interfaces that let resin producers and brands claim recycled content without redesigning all packaging formats. It does not include all mechanical recycling, all municipal waste operations, all packaging, or all circular-economy spending.

    Status-quo alternatives remain important because they set both price ceilings and buyer behavior. Simple, cleaner streams can still go through mechanical recycling. Low-value contaminated streams still compete with energy-from-waste, landfill, or export. Within advanced recycling, pyrolysis-based providers such as Plastic Energy target many of the same waste streams and downstream buyers. Mura’s own positioning therefore supports a boundary defined by difficult-to-recycle plastic conversion and circular feedstock supply, with adjacencies in collection, upgrading, resin production, and packaging compliance rather than one undifferentiated “plastics circularity” TAM.
