tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Advanced recycling of hard-to-recycle plastics
    - Conversion of mixed, contaminated, flexible, rigid, and multi-layer plastic waste into circular hydrocarbons or feedstocks
    - Simple-stream mechanical recycling, landfill, and energy-from-waste for non-upgraded disposal
    - Petrochemical operators, licensed plant owners, and downstream recycled-content buyers
    - Core monetization surface for Mura
  - - Feedstock preparation and aggregation
    - Sorting, preprocessing, and contracted delivery of recovered plastic feedstock to Hydro-PRT plants
    - Generic municipal waste collection with no conversion route or qualification for Hydro-PRT
    - Waste companies, aggregators, and plant operators
    - Determines whether Mura has usable throughput
  - - Certified offtake and circular feedstock supply
    - ISCC PLUS or comparable qualified sale of circular hydrocarbons into petrochemical chains
    - Generic oil trading with no recycled-content or circularity claim
    - Petrochemical buyers, resin producers, converters
    - Turns recycling output into budgetable customer value
  - - Technology licensing and engineering
    - License fees, engineering services, and project development for petrochemical groups wanting their own advanced-recycling assets
    - Unrelated EPC or industrial-service revenue with no Hydro-PRT deployment
    - Chemical groups, refiners, KBR-linked clients
    - Important second revenue stream and adoption path
  - - Adjacent packaging circularity spend
    - Compliance planning, packaging redesign avoidance, and resin substitution driven by EPR or recycled-content rules
    - Broader sustainability programs not tied to plastic packaging or recycled feedstock purchases
    - Brands, converters, obligated producers
    - Indirect payer layer that creates demand pull
  - - Status-quo substitutes
    - Mechanical recycling for clean streams, incineration, landfill, and pyrolysis-based alternatives
    - N/A
    - Waste owners and downstream buyers comparing disposal or circular options
    - Sets the ceiling on pricing and conversion
  notes: Boundary focuses on monetizable advanced-recycling spend and adjacent buyer pathways; excluded spend covers disposal routes and non-relevant circularity programs.
