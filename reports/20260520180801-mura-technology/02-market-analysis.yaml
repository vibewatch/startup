- id: sizing-lenses-and-capacity-anchors
  title: 'Sizing lenses: preserve narrow and broad estimates'
  body: |-
    Public market numbers diverge sharply, but the divergence is mostly about perimeter rather than simple contradiction. Allied Market Research measures a broad chemical-recycling revenue pool and estimates $4.0 billion in 2025 scaling to $14.4 billion by 2035. Market Growth Reports measures a much narrower hydrothermal-processing category at roughly $0.8 billion in 2026 scaling to $2.1 billion by 2035, but that category includes non-plastics applications such as wet biomass and wastewater. Treating one of those figures as “the” TAM without disclosing scope would distort diligence.

    A more grounded approach is to pair revenue lenses with physical-volume anchors. Open sources show a plastics system that is huge relative to today’s deployed advanced-recycling capacity: Plastic Energy cites 390+ million tonnes of global plastic production annually, while EPA reports 35.7 million tons of US plastics generation and 27 million tons going to landfill in 2018. Against that backdrop, Mura’s claimed 60kta by end-2025 and 1.5 million tonnes targeted by 2032 show why serviceable share is still execution constrained. The right conclusion is not that the market is small; it is that sizing should stay multi-lens and explicit about what each number does and does not include.
