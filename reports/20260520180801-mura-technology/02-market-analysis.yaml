  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: virgin-parity economics
    missingEvidence: Open-source evidence that Hydro-PRT output is consistently at or below virgin-fossil economics across oil-price cycles and customer contracts.
    whyItMatters: Valuation depends on whether demand is mandate-only or economically self-sustaining without regulatory pull.
    diligencePath: Request plant-level cost curves, contracted floor-price formulas, and sensitivity tables versus naphtha or virgin polymer benchmarks.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: material
    topic: hard-to-recycle feedstock share
    missingEvidence: A directly citable open source that quantifies what share of global plastic waste is flexible, contaminated, multi-layer, or otherwise unsuitable for mechanical recycling.
    whyItMatters: This number is needed to move from broad plastics volumes to a defensible SAM rather than a narrative-only boundary.
    diligencePath: Obtain a waste-composition study or analyst dataset that breaks global post-use plastics into mechanically recyclable versus advanced-recycling-target streams.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer ROI and premium willingness
    missingEvidence: Contracted offtake pricing, avoided-fee economics, carbon-credit value, and customer ROI analyses that quantify willingness to pay for circular hydrocarbons.
    whyItMatters: Without quantified customer economics it is hard to underwrite conversion rates, margin durability, or penetration into non-mandated segments.
    diligencePath: Request sample offtake agreements, recycled-content compliance economics, and customer business cases from petrochemical buyers and brands.
    relatedQuestionRefs:
    - QM028
    relatedTableRefs:
    - TM004
  - type: access-blocked
    severity: minor
    topic: closed market databases
    missingEvidence: Full access to premium statistics and member-only industry databases that may refine narrow-market sizing or regional splits.
    whyItMatters: These sources could narrow low/base/high ranges, but the chapter can still ship using open-source evidence with disclosed uncertainty.
    diligencePath: Review Statista premium tables, Chemical Recycling Europe member material, and any licensed market-research reports during management diligence.
    relatedQuestionRefs:
    - QM025
    - QM028
