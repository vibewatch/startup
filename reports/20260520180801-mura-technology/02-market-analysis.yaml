- id: TM003
  title: Segment / buyer map
  columns:
  - segment
  - buyer
  - user
  - payer
  - workflow
  - budget owner
  - adoption trigger
  rows:
  - - Feedstock suppliers and aggregators
    - Waste-management partner or feedstock trader
    - Sorting, preprocessing, and logistics teams
    - Waste owner or contracted aggregator
    - Collect difficult-to-recycle plastics, qualify feedstock, deliver to plant
    - Waste-services and operations budget
    - Need disposal alternative to landfill or incineration plus contracted outlet
  - - Mura own-build plants
    - Plant management and commercial team
    - Operations, engineering, and certification teams
    - Mura balance sheet plus project finance
    - Convert feedstock to circular hydrocarbons and sell under offtake contracts
    - CEO/project-finance sponsorship
    - Need proof of conversion quality, throughput, and buyer demand
  - - Licensed petrochemical operators
    - Chemical-company investment committee
    - Refinery, operations, and sustainability teams
    - Petrochemical capex budget
    - Build Hydro-PRT capacity in own infrastructure with KBR engineering support
    - C-suite capex owner and business-unit sponsor
    - Need strategic circular-feedstock capacity and integration fit
  - - Petrochemical offtake buyers
    - Circular-feedstock procurement or business-development lead
    - Feedstock planning and certification teams
    - Feedstock procurement budget
    - Buy ISCC PLUS or equivalent circular hydrocarbons for upgrading into new plastics
    - Business-unit procurement owner
    - Need recycled-content inputs and reliable offtake economics
  - - Converters and consumer brands
    - Packaging procurement and sustainability leadership
    - Packaging design, resin sourcing, and compliance teams
    - Packaging or procurement budget
    - Pull recycled-content demand through resin and packaging supply chains
    - Packaging P&L owner or sustainability-linked budget
    - Need PPWR or EPR compliance without full packaging redesign
  - - Obligated producers under EPR
    - Producer-responsibility and finance teams
    - Packaging reporting and data teams
    - Producer-fee and compliance budgets
    - Report packaging data, pay fees, and seek lower-cost compliant circular solutions
    - Finance/compliance owner
    - Need to lower waste costs and demonstrate future-readiness
  notes: The map separates direct customers from indirect economic pull. Brands and producers matter economically even when Mura’s contractual buyer is a petrochemical partner.
