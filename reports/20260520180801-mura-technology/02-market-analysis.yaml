- id: drivers-constraints-and-diligence-gaps
  title: Growth drivers, adoption constraints, and unresolved diligence gaps
  body: |-
    The strongest growth drivers are regulatory and system-level rather than purely discretionary. UK EPR already changes who pays for packaging waste. EU PPWR makes post-consumer recycled content in plastic packaging a dated legal requirement from 2030, with higher thresholds in 2040. EMF’s policy work and Mura’s Packaging Pact commentary reinforce the same message: circularity will not scale on corporate aspiration alone; it needs policy, infrastructure, and coordination. Those drivers help explain why packaging is the most important end market and why certified feedstock relationships matter so much.

    The constraints are just as material. Public sources consistently flag capital intensity, feedstock sorting and collection gaps, and technology scale-up risk. Market Growth Reports highlights demo-plant capex and low uninterrupted-run rates for HTL systems. AMR flags infrastructure weakness and feedstock inconsistency. Mura’s own Böhlen cancellation shows that even with credible partners, regulatory and economic conditions can stop project build-out. The biggest remaining diligence gaps are not whether demand exists, but how quickly customers will pay for it without mandates, what exact share of waste is addressable by hydrothermal recycling, and what commercial plant economics look like at scale. Those unresolved points should stay visible rather than hidden behind a single oversized TAM.
