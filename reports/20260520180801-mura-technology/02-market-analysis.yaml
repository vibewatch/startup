- id: TM004
  title: Growth drivers and constraints table
  columns:
  - driver/constraint
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - UK EPR reporting and fee regime
    - Driver
    - 2025 onward
    - Pushes packaging economics toward recovery and raises willingness to fund compliant recycling routes
    - Quantify how EPR costs flow through to recycled-feedstock demand by segment
  - - EU PPWR minimum recycled-content targets
    - Driver
    - 2030 and 2040
    - Creates dated demand for post-consumer recycled content in multiple plastic-packaging formats
    - Model which packaging classes can actually absorb chemically recycled output
  - - Packaging-sector policy coordination
    - Driver
    - Current
    - Industry coalitions and policy advocacy accelerate infrastructure and data harmonization around packaging circularity
    - Test whether pact participation translates into contracted volumes or only signaling
  - - Certified offtake and circular claims
    - Driver
    - Current
    - Lets petrochemical buyers convert recycling output into budgetable compliance and procurement value
    - Request sample mass-balance and certification workflows with buyers
  - - Capital intensity of new plants
    - Constraint
    - Current to medium term
    - Large project capex slows deployment and forces financing discipline
    - Request full commercial-plant capex, payback, and debt assumptions by site
  - - Technology scale-up and commissioning risk
    - Constraint
    - Current
    - Low uninterrupted-run evidence in public HTL data and Böhlen cancellation keep execution risk high
    - Review uptime, yields, and ramp curves for Wilton and licensed sites
  - - Feedstock quality and collection gaps
    - Constraint
    - Current
    - Inconsistent waste streams raise preprocessing cost and can lower plant economics
    - Review contamination thresholds, sorting requirements, and supply-concentration risk
  - - Virgin-price and ROI uncertainty
    - Constraint
    - Current
    - Mandates may create demand, but the open record does not yet prove durable parity with virgin-fossil economics
    - Request customer ROI models, pricing floors, and naphtha sensitivity scenarios
  notes: Rows mix regulatory pull with execution risk; diligence should not assume that strong policy automatically removes project-finance, feedstock, or pricing constraints.
