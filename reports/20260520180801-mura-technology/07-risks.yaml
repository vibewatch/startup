- id: operational-quality-and-single-plant-risk
  title: Operational, quality, and single-plant risk
  body: 'Operationally, the whole proof stack still concentrates on Wilton. Mura’s current page calls it the first commercial-scale Hydro-PRT site and says operations commence in Q1 2026. That matters because Mura’s own earlier materials pointed to earlier operating dates, so investors are not looking at a clean one-time startup story; they are looking at a plant that appears to have moved right over time. A schedule slip is not fatal for a first-of-kind plant, but it becomes more serious when the same site carries the burden of proving yield, uptime, product quality, feedstock handling, and customer deliveries all at once.


    The public record is also thin on the metrics that would let an investor discriminate between ordinary first-plant noise and a deeper process problem. Mura discloses 20kta design ambition, named feedstock suppliers, an operator contract, and customer names, but it does not disclose steady-state uptime, reject rate, product-spec compliance, or incident history. Government reporting rules for reprocessors and exporters underscore why this matters: novel recycling plants are increasingly expected to document tonnage received, tonnage recycled, evidence of receipt, recyclable proportion, and downstream handling. If Wilton struggles on feed quality, mass-balance evidence, or output consistency, the problem will not stay inside an engineering silo. It will surface in compliance, customer qualification, and financing conversations as well.'
