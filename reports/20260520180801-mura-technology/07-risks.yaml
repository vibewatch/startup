- id: partner-and-dependency-risk
  title: Partner and dependency risk
  body: 'Mura’s dependency map is unusually dense. KBR sits at the center because it spans licensing, engineering, equity, and now secured-creditor status. Licella matters because Licella itself says Mura was established as a joint venture in 2016 and that Hydro-PRT is based on Cat-HTR technology. Dow matters because it supports both customer credibility and the historical European rollout thesis. px matters because Wilton’s O&M sits under contract. Feedstock suppliers matter because throughput begins with waste quality and availability. And licensed sites in Japan and Korea help de-risk the scale-up story, but they do not fully substitute for evidence that Mura can run its own flagship site reliably.


    The Böhlen cancellation is therefore more than a customer setback. It is a dependency stress test that failed in public. Even with a top-tier partner, a circular-economy narrative, and strategic alignment, the project was abandoned because economics and regulation in Europe were not supportive enough. That is the best live example of how risks transmit through the system: category treatment influences economics, economics shapes project feasibility, project feasibility shapes customer confidence, and customer confidence affects both funding and valuation. In that sense, Mura’s biggest risk is not one isolated technical flaw. It is stacked dependency risk across IP control, regulation, operations, and counterparties.'
