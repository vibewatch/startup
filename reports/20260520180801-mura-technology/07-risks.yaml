- id: people-execution-and-kill-criteria
  title: People, execution, and kill criteria
  body: 'The people and execution layer adds another reason to insist on hard kill criteria. Steve Mahon is clearly a key-person risk because the public company narrative repeatedly routes through his partnership-building track record. Richard Daley is another concentrated dependency because he combines technology leadership with direct accountability for Wilton. Dianna Kyles provides a visible legal lead, but public bench depth below the named leaders is thin. Meanwhile, Companies House shows director turnover in November 2024 and again in March 2026, when Stuart Bradie exited and Andrew Goodwin arrived on the same day as the KBR charge filing. That timing does not prove misconduct, but it does raise governance questions that a serious investor should resolve directly rather than wave away.


    The practical mitigation framework is straightforward. Investors should monitor charge amendments or releases, Wilton startup cadence, evidence of repeat shipments, partner milestone delivery in Japan and Korea, and any policy guidance that changes how advanced recycling outputs are treated in compliance systems. The kill criteria should be equally crisp: walk if KBR tightens or enforces its security rights in a way that compromises IP control; walk if Wilton cannot evidence repeat shipments and stable operating data within a reasonable window after startup; walk if policy treatment or compliance economics make Hydro-PRT materially less competitive than management’s case assumes. Mura may still become a strong industrial platform, but only if those monitorable triggers continue to move in the right direction together.'
