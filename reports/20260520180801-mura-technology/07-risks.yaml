  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: kbr-charge-enforcement-terms
    missingEvidence: The underlying charge instrument, covenant package, default triggers, cure rights, and any intercreditor or consent agreements tied to KBR’s security over IP.
    whyItMatters: Without the operative legal terms, investors cannot quantify how close KBR is to effective control of Mura’s licensing estate if downside scenarios occur.
    diligencePath: Obtain the full security documents, side letters, and any board papers describing enforcement triggers and waiver mechanics.
    relatedQuestionRefs:
    - QR002
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: licella-royalties-and-consents
    missingEvidence: Current royalty obligations, consent rights, field-of-use restrictions, and any dispute-resolution terms between Mura and Licella.
    whyItMatters: The public record proves technology lineage but not the commercial or legal constraints that could surface if the relationship deteriorates.
    diligencePath: Request the core IP licence and any amendments, and reconcile them with current commercialization geographies and sublicensing rights.
    relatedQuestionRefs:
    - QR027
  - type: private-evidence-only
    severity: material
    topic: process-safety-and-incidents
    missingEvidence: HAZOP summaries, incident logs, pressure-safety controls, commissioning near-miss reports, and independent process-safety reviews.
    whyItMatters: Hydrothermal processing at scale is a process-safety issue as much as a chemistry issue, yet the public record is thin on safety controls.
    diligencePath: Review plant-safety management systems, major-hazard analyses, and insurer or lender engineering reports for Wilton.
    relatedQuestionRefs:
    - QR012
  - type: private-evidence-only
    severity: material
    topic: operational-economics-and-performance
    missingEvidence: Wilton dashboards covering yield, uptime, throughput, product-spec conformity, energy use, and repeat shipments by month.
    whyItMatters: Without steady-state operating data, investors cannot distinguish a credible startup delay from a deeper commercial-performance problem.
    diligencePath: Request the first twelve months of Wilton operating data and compare them against original design assumptions and customer acceptance criteria.
    relatedQuestionRefs:
    - QR029
  - type: missing-source
    severity: minor
    topic: governance-bench-depth
    missingEvidence: Public biographies and remit detail for Andrew Goodwin and a fuller board skill matrix after the 2024-2026 director changes.
    whyItMatters: Governance continuity matters more when creditor rights, plant startup, and licensing expansion all sit in motion at once.
    diligencePath: Request a current board and executive roster with biographies, committee membership, and sponsor affiliations.
    relatedQuestionRefs:
    - QR020
