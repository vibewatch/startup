- id: thesis-breaks-exit-readiness-and-diligence
  title: Thesis-breaks, exit readiness, and final diligence asks
  body: 'The most important valuation risk is not that advanced recycling lacks demand; it is that common-equity investors may not control the downside if operating proof or financing terms disappoint. The KBR charge shows why. If the same counterparty that supplies licensing leverage also sits over the asset base, then a governance or covenant shock can compress value quickly. Böhlen also remains a live reminder that industrial partners and circularity narratives do not guarantee project completion. Sector peers reinforce the need for discipline: Plastic Energy provides operating credibility but no usable public pricing anchor, while Agilyx and Licella help validate licensing and hydrothermal pathways without solving Mura’s current pricing problem.


    Exit readiness is therefore still limited in the public record. There is no retained public IPO timetable, no public sale process, and no detailed cap-table waterfall. The final diligence package should focus on six items before any priced investment decision: fully diluted ownership and preferences; complete KBR charge and default mechanics; Wilton shipment, uptime, and spec-pass data; customer and license economics; project-finance plans for own-build sites; and realistic exit materials. Until those points are closed, the right investment posture is to keep Mura on the board and avoid underwriting upside as if disclosure quality were already public-market grade.'
