- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - IP / control deterioration
    - KBR charge tightens, defaults, or constrains practical control of the licensing estate
    - Breaks the asset-control assumption behind any premium platform valuation.
    - Pause or walk away unless downside is structurally protected.
  - - Wilton proof failure
    - No repeat commercial shipments, weak product-spec acceptance, or extended ramp slippage
    - Removes the main bridge from narrative to monetizable proof.
    - Move toward the bear range and demand a lower entry price.
  - - Commercial rollout stalls
    - Singapore slips materially or licensed-site momentum weakens
    - Undercuts the milestone stack needed for the base and bull cases.
    - Reduce valuation toward sub-$1B logic until milestones recover.
  - - Cap-table / preference surprise
    - New diligence shows senior preferences or dilution absorb value near the base-case range
    - Turns an apparently fair enterprise value into poor common-equity returns.
    - Require structure change or do not invest.
  - - Sector / policy setback
    - Another high-profile project cancellation or adverse policy treatment hits economics
    - Compresses multiples and raises financing risk across the category.
    - Tighten scenario probabilities and shift to watch-only posture.
  notes: Triggers are monitorable decision rules rather than generic risks. Each one directly compresses valuation support or equity upside.
