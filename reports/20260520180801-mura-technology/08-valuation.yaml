- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Market opportunity
    - Large plastic-waste and recycled-content tailwinds support a real category opportunity.
    - Third-party TAM estimates vary widely, so market size alone cannot justify a premium mark.
    - Show plant-level economics and customer demand conversion, not just large TAM headlines.
  - - Commercial proof
    - Mura has named partners across offtake, licensing, and site development.
    - The company still lacks retained public revenue, repeat-shipment, and margin disclosure.
    - Release Wilton delivery data and customer / license monetization metrics.
  - - Financing / cap structure
    - KBR and strategic shareholders prove serious external support.
    - Public evidence still omits last-round price, liquidation preferences, and common-equity waterfall.
    - Provide the fully diluted cap table, preference terms, and recent financing materials.
  - - Public comp discipline
    - PureCycle proves public markets can value advanced recycling in the low-single-digit billions.
    - PureCycle also proves that investors demand reporting, liquidity, and capital access that Mura has not yet disclosed.
    - Close the disclosure gap and demonstrate repeat operating proof before seeking a peer-like valuation.
  - - Exit readiness
    - Strategic counterparties could create optionality over time.
    - No retained public IPO, sale, or tender evidence supports near-term liquidity.
    - Share board-approved exit paths or banker materials.
  notes: Thesis and anti-thesis are both evidence-led. Missing private-company disclosures are treated as valuation blockers rather than optimistic assumptions.
