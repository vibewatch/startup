  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: Fully diluted ownership, option pool, preferred share classes, liquidation preferences, anti-dilution terms, and the last priced-round valuation.
    whyItMatters: Without the cap-table waterfall, investors cannot tell whether a fair enterprise-value range would translate into attractive common-equity returns.
    diligencePath: Obtain the current cap table, financing documents, side letters, and any 409A or board valuation materials.
    relatedQuestionRefs:
    - QV006
    - QV027
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: kbr-charge-mechanics
    missingEvidence: The full charge instrument, default triggers, cure rights, consent requirements, and any side agreements governing KBR’s security over all property and all intellectual property.
    whyItMatters: The public record proves the security package exists, but not how easily it could impair the licensing estate or equity value in downside scenarios.
    diligencePath: Review the complete charge package, related board papers, and any lender or investor communications explaining enforcement boundaries.
    relatedQuestionRefs:
    - QV007
    - QV029
    relatedTableRefs:
    - TV005
  - type: private-evidence-only
    severity: material
    topic: wilton-commercial-dashboard
    missingEvidence: Monthly Wilton data on throughput, yield, uptime, product-spec pass rate, customer acceptance, and repeat shipments.
    whyItMatters: Milestone-weighted valuation depends on repeat commercial proof, not just a commissioning narrative or single launch statement.
    diligencePath: Request the first twelve months of operating dashboards, shipment records, and customer qualification updates for Wilton.
    relatedQuestionRefs:
    - QV015
    - QV024
    - QV027
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table coverage
    missingEvidence: A fuller public and private comparable set with current market values, revenue anchors, and financing terms for additional advanced-recycling peers beyond PureCycle.
    whyItMatters: TV004 is decision-useful but still partial because most private sector peers do not publish enough valuation detail to support a deeper numeric comp set.
    diligencePath: Expand the comp set with banker materials, secondary data, and additional public filings or market-data sources where available.
    relatedQuestionRefs:
    - QV020
    - QV021
    - QV022
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: exit-path-and-liquidity
    missingEvidence: Any board-approved IPO plan, strategic-sale process, secondary-clearing evidence, or banker materials describing realistic liquidity timing.
    whyItMatters: Entry discipline depends on a credible path to realizing value, and the retained public record does not show one yet.
    diligencePath: Request banker updates, board minutes, and any formal evaluation of IPO, secondary, or strategic-sale options.
    relatedQuestionRefs:
    - QV028
    - QV030
    relatedTableRefs:
    - TV006
