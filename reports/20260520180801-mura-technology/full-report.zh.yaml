  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险位于最高层
        blocks:
          - type: paragraph
            body: >-
              最急迫的法律和监管风险，不是泛泛的政策不确定性，而是 KBR 2026 年 3 月对 Mura 全部财产和全部知识产权设立押记这一非常具体的事实组合。Companies House
              描述的不是狭义资产质押；它记录了以 Kellogg Brown & Root Solutions Limited 为受益人的未清偿押记，已提交的 MR01
              确认担保包包括固定押记、浮动押记和负面质押。这很关键，因为 KBR 不是被动贷款人。Mura 自己的许可页面称 KBR 是独家 Global Licensing and Preferred Engineering
              Partner，因此债权人执行会直接撞上公司的商业化渠道。如果双方关系恶化，Mura 失去的不只是供应商；它可能失去对支撑乐观情景的许可资产的实际控制。


              第二层监管风险是品类待遇。Mura 将 Hydro-PRT 定位为水热先进回收，补充机械回收，并在气候指标上优于焚烧；KBR 也指向 JRC 与能量回收的基准比较。但 NGO
              和倡议组织仍在攻击先进回收或化学回收这个品类，常见理由是能耗高、偏燃料化，或不是真正回收。这些批评并不总能精准套到 Mura
              的水热路径上，毕竟它不同于热解；但政策风险仍然真实，因为监管者往往按品类写规则，而不是按某家公司偏好的技术细节。英国包装改革又增加一层复杂性：pEPR、调节费率和证据规则让回收经济性更结构化，也让合规负担更重。
