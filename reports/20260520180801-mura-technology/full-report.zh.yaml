      - number: '4.3'
        title: 承保仍卡在利润率和现金跑道问题
        blocks:
          - type: paragraph
            body: >-
              公开承保的关键问题不是没有商业模式，而是数字不足，无法把商业模式转成现金流信心。Wilton 一期规模披露为 20 kta，公开材料显示可扩张至超过 80 kta；韩国和日本的伙伴场地说明 Hydro-PRT
              可以通过被许可方扩张。但受评来源都没有披露每吨原料成本、每吨产品售价、石脑油 / 瓦斯油 / 蜡 的实际良率拆分、工厂利用率、营运资金周期、月度烧钱速度或现金跑道。Companies House
              申报历史确认账目存在，但已提交账目的可访问文本提取结果对本章不可用，落地页也没有直接呈现缺失的核心指标。


              在 Wilton 产出可审计运营数据之前，Mura 仍是一个依赖融资的故事。乐观情景是，Wilton 证明稳定的转化经济性，并把具名承购和 KBR
              主导许可转成工厂收入加高利润率技术收入的混合模式。悲观情景是，Wilton 爬坡慢于预期，许可转化仍按伙伴节奏推进，后续场地开发依赖担保支持结构，而不是内部生成现金。Böhlen
              取消是最清楚的公开证据：差异化技术不能消除经济和监管执行风险。目前看，Mura 能通过伙伴融资，但尚不能基于独立现金生成公开承保。
