      - number: '3.4'
        title: 一对一尽调缺口与反向对比
        blocks:
          - type: paragraph
            body: >-
              反向观点很直接。从可访问商业记录看，Plastic Energy 目前比 Mura 更经验证：它有运营中的工厂网络，与大型石化伙伴有长期战略关系，也更清楚地证明了 TACOIL™
              进入塑料价值链的销售历史。Brightmark 从相反方向给出第二个警示：大额公布产能和高调投资计划，可以与重组、破产法院流程和工厂表现不均同时存在。Mura 自己取消 Böhlen
              项目，使它落在这两个例子之间——技术上比 Brightmark 更差异化，但商业去风险程度不如 Plastic Energy。


              剩余尽调缺口因此高度影响决策。公开材料没有披露 Mura
              与同业之间可比的工厂级定价、正常运行时间、良率或毛利数据。精确的许可经济性、最低采购量承诺和客户切换摩擦大多未披露。即便竞争对手规模也报告不一：可访问页面清楚显示运营场地、合资项目
              和产能目标，但不总是给出可审计的工厂数量或利用率。投资人在做硬性一对一承保决策前，需要 Wilton 工厂表现数据、对 KBR 许可漏斗的更清晰判断，以及能在真实采购流程中比较 Mura 水热产品质量与
              Plastic Energy、Brightmark 热裂解油的客户访谈。
