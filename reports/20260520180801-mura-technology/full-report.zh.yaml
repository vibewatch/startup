      - number: '8.3'
        title: 上市可比公司支持折价，而不是否定
        blocks:
          - type: paragraph
            body: >-
              PureCycle 是留存来源集中最有用的公开估值参照，因为它同时有真实运营披露和当前公开价格。截至 2026 年 5 月 20 日，StockAnalysis 显示其市值约 $2.15
              billion，CompaniesMarketCap 给出约 $2.14 billion，Macrotrends 在 2025 年 10 月显示 $2.54 billion
              市值参考。这些数值不小：市场愿意在成熟盈利前，以数十亿美元级别为先进回收公司定价。但同一证据也说明，Mura 现阶段应有折价。StockAnalysis 仍显示 PureCycle 过去 12 个月收入只有
              $10.9 million、亏损很大、净现金为负、债务股本比 1.47、空头兴趣很高；PureCycle 自己的 2026 年 Q1 更新也指向持续依赖项目融资、补助、循环信贷、认股权证和资本密集型工厂建设。


              可比公司的启示是：商业化阶段回收平台当然可能价值数十亿美元，但公开投资人只会把这种空间给到运营数据透明、有公开流动性、并持续报告的公司。Mura
              在留存公开记录中还不具备这些条件。市场规模研究支持上行情景，但这些数字差异很大，足以惩罚伪精确：Allied 预测 2025 年约 $4.0 billion，2035 年升至 $14.4
              billion；Fairfield 通过 Recycling International 提到本十年末 $50 billion 市场。这个跨度支持可选性，而不是单凭它就给溢价标记。
