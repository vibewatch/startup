      - number: '4.2'
        title: 资本基础具战略性，但束缚越来越重
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，尽管完整现金余额未披露，Mura 已筹集到有意义的战略资本。KBR June 2022 新闻稿称，其追加投资 $100 million，使累计持股达到 18.5%，分两批为 Mura
              提供资金并取得董事会席位。LG Chem 另行完成股权投资并购买工艺许可；Mura Wilton 页面称，首个场地由母公司资金以及 Dow、KBR、igus 的投资支持，另有 £4.42 million
              Innovate UK 赠款和 £5 million Future Fund 股权注入。Companies House 申报也强化了资本持续流入的事实：普通股总数从 February 2023 的
              2,995,901 增至 March 2025 的 3,211,829。


              股东基础本身很重要。February 2026 确认声明仍列出 KELLOGG BROWN & ROOT LIMITED、LG Chem、Dow Europe Holding B.V. 和 CAT-HTR
              Plastics Pty Ltd 为股东，说明战略伙伴和底层 Cat-HTR 许可方仍嵌在股权结构表中。但 March 2026 也带来更值得警惕的信号：Mura 向 Kellogg Brown & Root
              Solutions Limited
              登记一项覆盖全部财产和全部知识产权的押记，包含固定与浮动押记以及负面承诺。没有底层融资文件，无法判断这是一套常规项目支持结构，还是更紧的担保信贷安排。无论哪种，公开证据现在指向一家连接资源很强、但不明显能靠已披露经营现金流自我供血的公司。
