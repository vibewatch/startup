        - 董事变动、委员会构成、披露质量
        - 若担保债权人影响力上升时治理透明度下降，则退出
      - - 财务模型韧性
        - 压力测试费用、合规和资本需求
        - 政策费用更新、合规负担、capex 融资信号
        - 如果合理的费用、延误或合规下行情景打穿单位经济性，就退出
    notes: 终止标准是投资人的决策规则，不是预测；它把已引用风险转成可监控的继续 / 停止阈值。
