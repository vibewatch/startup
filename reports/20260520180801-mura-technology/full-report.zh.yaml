    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Mura Technology Limited（Companies House 编号 10520772）是一家私营有限公司，12 December 2016 在英格兰和威尔士注册成立，原名 Armstrong
              Chemicals Limited，13 February 2019 更名为现名。注册办公室位于 Main Building, Wilton Centre, Redcar, Cleveland, TS10
              4RF；公司的首座商业 Hydro-PRT® 工厂（Mura Wilton）也在这里。公司的主要 SIC code 是 38320（分拣材料回收），说明其产业分类是回收企业，而不是单纯技术许可方。

              Mura 的商业模式有两条相互依赖的收入线。第一条是自有运营：Mura Wilton（原 ReNew ELP 工厂）把废塑料原料转化为循环烃产品——石脑油、蜡、工艺气和重油——并通过长期承购合同卖给 Neste
              等石化客户。第二条是技术许可：Mura 借助与 KBR Inc. 的独家合作，把 Hydro-PRT® 工艺授权给国际石化企业，由后者建设并运营自有工厂。被许可方包括 Mitsubishi Chemical
              Corporation（日本 Ibaraki）和 LG Chem（韩国 Dangjin）。KBR
              担任首选工程承包商，并在每个授权场地提供项目交付服务，由此形成工程与许可一体化的收入模式。公司把使命描述为成为“全球领先的废塑料循环烃生产商”，并设定到 2032 年让 1.5 million tonnes
              per annum Hydro-PRT® 产能投入运营或进入开发的目标。
