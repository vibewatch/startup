      - number: '1.6'
        title: 反向信号与未解缺口
        blocks:
          - type: paragraph
            body: >
              公开证据中最重要的反向信号，是德国 Böhlen 先进回收设施在 August 2025 取消。公告称，“持续的经济和监管挑战”影响欧洲制造业投资竞争力。更大的背景是 chemicalrecycling.org
              新闻索引提到，ExxonMobil 据报道因 EU 规则草案暂停了 €100 million 欧洲塑料回收投资，说明行业层面存在监管逆风，而不一定是 Mura 单点失败。即便如此，Böhlen
              项目此前在材料中一直被列为与 Teesside 工厂并列的旗舰欧洲部署；该项目失去后，原计划约 120 kta 的新增产能以及 Dow 合作都从欧洲增长故事中消失。

              其他未解问题包括：（1）总股权稀释和股权结构表构成——KBR 持有 18.5%，Licella 载体曾持有 25-50%（现已从 PSC 登记移除），LG Chem 金额未知，BlackRock
              持股未披露。（2）截至目前的收入确认：Mura Wilton 据官网称已“发出首批产品”，但公开领域没有收入数字。（3）KBR IP 押记（Charge 0002，March
              2026）可能成为一个重大控制抓手，而单一战略伙伴同时控制全球许可。（4）Stuart Bradie 等董事在 March 2026 离任，恰逢 KBR 收紧其财务担保权益，带来治理连续性问题。（5）Mura
              Wilton 投运一再推迟（mid-2024 → Q4 2025 → 之后），可能意味着调试或工艺工程挑战仍未解决。
            claimRefs:
              - CO042
              - CO043
              - CO044
              - CO045
              - CO046
      - number: '1.7'
        title: 证据要点
        blocks:
          - type: callout
            title: 全球首个商业规模水热塑料回收
            body: >
              Mura Wilton 是全球首座商业规模 Hydro-PRT® 设施。该技术已获得独立 LCA 验证（WMG/ecoinvent、EU JRC），显示其 GWP 约比焚烧低 80%、约比热裂解低 50%。被纳入
              ecoinvent 数据库，为供应链提供了可独立审计的环境数据；下游客户主张 ISCC PLUS 认证时，这一点很关键。
            calloutType: strength
