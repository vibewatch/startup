      - number: '3.2'
        title: 能力、定价逻辑与市场进入重叠
        blocks:
          - type: paragraph
            body: >-
              能力重叠真实存在，但并不对称。Mura 的 Hydro-PRT® 主张是，超临界水能够处理机械系统拒收、许多热裂解系统仍需大量预处理的混合、受污染、柔性和多层塑料。Plastic Energy 的 TAC™
              路线同样瞄准难处理废弃物，并为石化客户生产循环油；从买方工作流看，它是最可比的替代方案。Brightmark 在美国提出类似的热裂解叙事，但执行波动更可见。相比之下，PureCycle
              争夺的是更窄的一块预算，因为它把聚丙烯升级为超纯树脂颗粒，而不是销售烃原料；Agilyx 更窄，因为 Styrenyx 为聚苯乙烯和苯乙烯单体回收优化。


              这组企业的公开定价透明度都很弱。受评公司没有像软件供应商发布标价那样公开循环原料或许可包的挂牌价格。变现模式反而是长期承购、定制化树脂或原料合同、按场地设定的许可费、工程包，有时还包括废弃物管理合同。这意味着买方锁定不太来自标价，而更多来自认证、工厂集成、原料资格认定和下游产品接受度。Mura
              由 KBR 牵头的许可渠道可能成为强市场进入路线，但也意味着 Mura 的商业议价力部分取决于单一伙伴的管线和执行优先级。
