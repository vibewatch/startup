  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接对手、替代品与真实竞争集合
        blocks:
          - type: paragraph
            body: >-
              Mura
              的竞争对手不只是其他风投支持的先进回收企业。相关竞争场覆盖至少四层：直接处理混合塑料转化的同业、按聚合物分类的先进回收企业、既有机械回收企业，以及能够在不拥有前端工艺的情况下获取先进回收原料的一体化石化集团。Plastic
              Energy 是最清晰的直接对手，因为它同样把循环烃原料卖入石化价值链，已在西班牙运营工厂，并与 SABIC、TotalEnergies 建立了深度战略关系。Brightmark
              是美国最接近的混合塑料热裂解类比对象，不过其 Ashley 重组显示项目经济性可能很脆弱。PureCycle 和 Agilyx 技术可信，但范围更窄：PureCycle 专注聚丙烯纯化，Agilyx
              集中于聚苯乙烯解聚。


              Veolia、Biffa、REMONDIS 等机械回收既有企业并不复制 Hydro-PRT®，但它们重要，因为它们掌握收集、分拣、市政关系和清洁料流回收预算。BASF ChemCycling
              等一体化石化项目带来另一类威胁：它们可以把质量平衡认证、既有裂解装置基础设施和客户关系组合起来，而无需建设完整的废弃物到原料平台。实践中，Mura
              必须同时赢下两场比赛：一是证明水热处理在难回收混合废弃物上优于热裂解；二是证明专业平台能在更大的废弃物管理和石化既有企业面前守住足够原料和客户入口。
