      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Mura 的依赖图谱异常密集。KBR 位于中心，因为它横跨许可、工程、股权和现在的有担保债权人身份。Licella 重要，因为 Licella 自称 Mura 于 2016 年作为合资公司成立，Hydro-PRT
              基于 Cat-HTR 技术。Dow 重要，因为它同时支撑客户可信度和历史欧洲扩张逻辑。px 重要，因为 Wilton 的 O&M
              由合同承包。原料供应商重要，因为吞吐量始于废料质量和可得性。日本和韩国授权站点有助于降低扩产叙事风险，但不能完全替代 Mura 可靠运行自有旗舰站点的证据。


              因此，Böhlen
              取消不只是客户挫折，而是一场公开失败的依赖压力测试。即便有一线合作伙伴、循环经济叙事和战略一致性，项目仍因欧洲经济性和监管支撑不足而被放弃。这是风险如何穿透系统的最佳现实案例：品类待遇影响经济性，经济性塑造项目可行性，项目可行性塑造客户信心，客户信心又影响融资和估值。换言之，Mura
              最大风险不是某个孤立技术缺陷，而是 IP 控制、监管、运营和交易对手层层叠加的依赖风险。
