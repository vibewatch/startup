      - number: '2.4'
        title: 增长驱动、采用约束与未解尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强的增长驱动来自监管和系统层面，而不是纯粹自由裁量支出。UK EPR 已经改变包装废弃物由谁付费。EU PPWR 将塑料包装中的消费后再生成分变成从 2030 起有日期约束的法律要求，2040 阈值更高。EMF
              的政策工作和 Mura 对 Packaging Pact
              的评论强化了同一个信息：循环化不能只靠企业愿景扩张；它需要政策、基础设施和协调。这些驱动也解释了为什么包装是最重要的终端市场，以及为什么认证原料关系如此关键。


              约束同样重要。公开来源持续提到资本密集度、原料分拣和收集缺口，以及技术放大风险。Market Growth Reports 强调 HTL 系统的示范工厂资本开支和较低的连续运行率。AMR
              提到基础设施薄弱和原料不一致。Mura 自己取消 Böhlen
              项目，说明即便有可信伙伴，监管和经济条件也能叫停项目建设。最大的剩余尽调缺口，不在于需求是否存在，而在于没有强制要求时客户多快会为此付费、水热回收究竟能覆盖废弃物的哪一部分，以及商业工厂规模化后的经济性是什么。这些未解点应该留在台面上，而不是被一个过大的
              TAM 掩盖。
