        title: 运营、质量与单厂风险
        blocks:
          - type: paragraph
            body: >-
              运营上，整套证明栈仍集中在 Wilton。Mura 当前页面称它是首座商业规模 Hydro-PRT 站点，并称运营将于 2026 年 Q1 开始。这很重要，因为 Mura
              自己早期材料曾指向更早运营日期，所以投资人看到的不是一次干净的启动故事，而是一座时间表似乎不断右移的工厂。首创工厂延期并不致命，但当同一个站点同时背负证明产率、稼动率、产品质量、原料处理和客户交付的任务时，延期就更严肃。


              公开记录也缺少能让投资人区分普通首厂噪声与更深工艺问题的指标。Mura 披露了 20kta
              设计目标、点名原料供应商、运营商合同和客户名称，但没有披露稳态稼动率、拒收率、产品规格达标情况或事故记录。政府针对再加工商和出口商的报告规则凸显了这一点：新型回收工厂越来越需要记录收到吨位、回收吨位、收货证据、可回收比例和下游处理。如果
              Wilton 在原料质量、质量平衡证据或产出一致性上吃力，问题不会留在工程孤岛里，也会出现在合规、客户认证和融资对话中。
