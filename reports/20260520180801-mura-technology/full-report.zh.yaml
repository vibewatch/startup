  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与资产图谱
        blocks:
          - type: paragraph
            body: >-
              Hydro-PRT®
              更适合被理解为一个工业回收平台，而不是单一反应器或模糊的可持续品牌。从客户工作流看，这个产品接收本会被填埋、焚烧或出口的混合消费后塑料，通过使用超临界水的水热工艺转化，并生产石化伙伴可升级为新塑料的循环烃原料。这个工作流至少有五类公开资产：Hydro-PRT
              核心工艺；作为首个商业参考场地的 Wilton；KBR 面向外部部署的许可和工程渠道；LG Chem、Mitsubishi Chemical 等伙伴出资的授权场地；以及由 LCA、FAQ
              和可持续声明构成的文件层，帮助客户和监管方评估工艺。


              因此，产品线比“回收工厂产能”更宽。Mura
              同时销售或支持多种东西：一套工艺设计、一种场地部署模式、一组烃产出，以及一套有证据支撑的可持续叙事。公开材料在工艺用途上很强——混合、受污染、多层、柔性和刚性塑料——也清楚说明其在塑料价值链中的位置。但在成熟工厂表现证据上较弱，例如
              正常运行时间、良率和质量控制统计。做产品尽调时，Mura 比多数营销味很重的先进回收初创公司 更具体，但在运营披露上仍早于概念架构。
