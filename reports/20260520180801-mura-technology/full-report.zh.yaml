        - 完成完整押记和许可尽调
        - 押记修订、豁免、违约、董事会文件
        - 若 KBR 可在缺乏可接受补救权的情况下实质限制 IP 或许可，则退出
      - - 监管分类
        - 建模下行情景下的政策待遇和客户接受度
        - 新监管指引、NGO 动能、客户采购措辞
        - 若产出待遇变化导致经济性依赖有争议分类，则退出
      - - Wilton 运营
        - 要求按月提供启动、收率和发货看板
        - 首批产品、重复发货、正常运行时间趋势、规格通过率
        - 若 Wilton 无法在合理的启动后窗口证明重复商业发货，则退出
