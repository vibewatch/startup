      - number: '1.5'
        title: 商业里程碑与设施
        blocks:
          - type: paragraph
            body: >
              Mura Wilton（英国 Teesside）是公司的第一座、也是唯一一座全资商业规模 Hydro-PRT® 工厂，位于 Redcar, Cleveland 的前 ICI Wilton 场地、Wilton
              Centre 工业综合体内。该厂此前以 Mura 子公司 ReNew ELP 为品牌，并在 2025 根据 px Group 的运营维护合同进入调试阶段。Innovate UK 赠款完成公告（June
              2025）确认了该厂的运营状态。March 2024，Mura 与 Neste 签署长期承购协议，供应 ISCC PLUS 认证循环烃产品；Mura 网站上的 Neste 新闻最初预计 Teesside 场地在
              mid-2024 投运，随后根据 Singapore 公告推迟到 Q4 2025。Innovate UK/WMG KTP 公告（August 2024）确认 Wilton 场地每年可节省 40,000
              tonnes（CO2e）碳排放。

              两座授权商业设施已在国际市场运营：Mitsubishi Chemical Corporation（MCC）在日本 Ibaraki 的设施（2021 签署许可）和 LG Chem 在韩国 Dangjin
              的设施（既是股权投资方也是被许可方）。Mura 称英国、日本和韩国合计产能到 2025 年底约为 60 kta。August 2025，Mura 宣布在 Jurong Island（Singapore
              Essential Chemicals Complex）建设一座新的 50 kta 设施，场地由 PCS Pte. Ltd. 提供；这是其首次进入东南亚，并通过 Mura Technology Asia
              实体运营。April 2024 宣布的与 Ghent University Laboratory for Chemical Technology（LCT）为期 5 年
              的研究合作，支持公司围绕难回收聚合物开展研发。

              反向里程碑是 Mura 与 Dow 原计划在德国 Böhlen 建设的设施于 August 2025
              取消，理由是“持续的经济和监管挑战”影响欧洲制造业竞争力。这意味着原本规划的欧洲布局实质收缩，并引发一个问题：在英国以外受监管的西方市场，商业可行性是否站得住。
