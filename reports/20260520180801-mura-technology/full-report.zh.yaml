  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              给 Mura
              估值时，不应拿整个塑料经济或整个废弃物管理链条作参照。它真正面对的是更窄的一层：难回收的使用后塑料被转化为循环烃原料，再供石化体系复用。这个市场包括水热或相邻先进回收产能、原料准备关系、认证承购，以及让树脂生产商和品牌方不用重做所有包装格式也能主张再生成分的价值链接口。它不包括所有机械回收、所有市政废弃物运营、所有包装，也不包括所有循环经济支出。


              现状替代方案仍然重要，因为它们同时决定价格上限和买方行为。简单、较干净的料流仍可进入机械回收。低价值受污染料流仍要与垃圾发电、填埋或出口竞争。在先进回收内部，Plastic Energy
              等基于热裂解的供应商瞄准许多相同的废弃物流和下游买方。因此，Mura 自身定位支持的边界，是难回收塑料转化和循环原料供应；相邻领域是收集、升级、树脂生产和包装合规，而不是一个不加区分的“塑料循环化”TAM。
