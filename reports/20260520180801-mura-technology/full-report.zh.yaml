      - number: '5.4'
        title: 路线图、成熟度与从业者信号
        blocks:
          - type: paragraph
            body: >-
              公开路线图最清楚之处，是 Mura 仍在补证据，而不是宣称成熟度已经收官。Ghent 增加了一条五年研究路径和连续流中试规模设施，用来评估更难处理的聚合物和复合材料。WMG 获 Innovate UK 支持的
              KTP，则把 LCA 和可持续性建模延伸到未来站点和工具。ecoinvent 访谈描述了从首座工厂年处理 20,000 吨向更大未来工厂演进的设计路线；Mura 当前网页仍把 Wilton
              列为首个自有商业站点，把日本 / 韩国列为授权设施。合在一起，这些信号说明产品已经以较窄形态商业化推出，但技术上仍在扩展和优化。


              Hydro-PRT 是工业工艺平台，因此最接近“开发者信号”的东西不是 GitHub 活跃度，而是招聘、从业者文档、会议参与和外部研究合作。Mura
              的招聘页面显示，公司规模小但刻意配置熟练人才，并提供长期激励；资源页则展示公开视频、LCA 文档和面向 IChemE
              的沟通材料。这是有效的从业者代理指标，也说明成熟度仍落在工程和商业化上，而不是软件式社区生态。产品信心应锚定工厂数据、客户认证和合作伙伴站点复制——而不是漂亮会议幻灯片和可持续性说明的存在。
