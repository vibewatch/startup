  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 已披露客户版图与细分市场验证
        blocks:
          - type: paragraph
            body: >-
              Mura 的客户证明在工业回收初创公司中少见地具体，但证据集中在少数战略交易对手，而不是广泛披露的账户基础。已点名商业关系可分成四类。第一类是承购买家，最明确的是 Neste 和 Dow；它们重要，是因为能够验证
              Hydro-PRT 产出能否进入主流石化链。第二类是技术被许可方，尤其是 LG Chem，以及 Mitsubishi Chemical 与 ENEOS；它们重要，是因为能够验证工艺能否在 Mura
              自身资产负债表之外部署。第三类是 Geminor 等原料供应商，以及 Wilton 周边其他废料伙伴；它们支撑工厂利用率。第四类是 UK Packaging Pact 等生态签署方；它们不是狭义收入客户，但能拓宽
              Mura 进入包装利益相关方和未来原料关系的路径。


              最强公开证据是承诺证据：签署承购、许可销售、开工建设、设施投运和点名原料吨位。这比只有 logo
              的营销更扎实，但还不是成熟的重复采购记录。公开材料很少披露客户级收入、实际交付量、续约率或满意度指标。因此，本章判断是：Mura
              有真实客户牵引力，但牵引力由战略合作伙伴驱动。公司已经说服一线工业企业围绕工厂、许可和供应链作出承诺；还没有披露能消除集中度担忧的广泛、经常性需求指标。
