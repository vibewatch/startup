    rows:
      - - 难回收塑料的先进回收
        - 将混合、受污染、柔性、刚性、多层塑料废弃物转化为循环烃或原料
        - 面向未升级处置的单一料流机械回收、填埋和垃圾能源化
        - 石化运营商、授权工厂业主和下游再生成分买方
        - Mura 核心变现面
      - - 原料预处理与聚合
        - 对回收塑料原料分拣、预处理，并按合同交付至 Hydro-PRT 工厂
        - 没有转化路径、也不符合 Hydro-PRT 要求的通用市政垃圾收集
        - 废弃物公司、聚合商和工厂运营方
        - 决定 Mura 是否有可用吞吐量
      - - 认证承购与循环原料供应
        - 向石化链销售 ISCC PLUS 或同等认证的循环烃
        - 没有再生成分或循环性主张的普通油品交易
        - 石化买方、树脂生产商、转换商
        - 把回收产出转成客户可编入预算的价值
      - - 技术许可与工程服务
        - 面向希望自建先进回收资产的石化集团，收取许可费、提供工程服务和项目开发
        - 与 Hydro-PRT 部署无关的 EPC 或工业服务收入
        - 化工集团、炼厂、KBR 相关客户
        - 重要的第二收入流和采用路径
      - - 相邻包装循环支出
        - 由 EPR 或再生成分规则驱动的合规规划、避免包装重新设计和树脂替代
        - 未绑定塑料包装或再生原料采购的更广泛可持续项目
        - 品牌方、转换商、责任生产者
        - 创造需求拉动的间接付款层
      - - 现状替代方案
        - 清洁料流机械回收、焚烧、填埋和热解替代方案
        - N/A
        - 在处置和循环方案之间比较的废弃物所有者与下游买方
        - 给定价和转化率设定上限
    notes: 边界聚焦可变现的先进回收支出和相邻买方路径；排除支出涵盖处置路线和无关的循环项目。
