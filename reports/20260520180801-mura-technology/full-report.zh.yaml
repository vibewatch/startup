      - number: '8.5'
        title: 投资逻辑失效点、退出准备度与最终尽调清单
        blocks:
          - type: paragraph
            body: >-
              最重要的估值风险不是先进回收缺少需求，而是如果运营证明或融资条款不及预期，普通股投资人可能控制不了下行。KBR
              押记说明了原因。如果同一个带来许可杠杆的交易对手也压在资产基础之上，治理或契约冲击就能迅速压缩价值。Böhlen 也仍是现实提醒：工业合作伙伴和循环叙事不能保证项目完工。行业同行强化了纪律必要性：Plastic
              Energy 提供运营可信度，但没有可用公开定价锚；Agilyx 和 Licella 有助于验证许可和水热路径，却不能解决 Mura 当前定价问题。


              因此，从公开记录看，退出准备度仍然有限。没有留存公开 IPO 时间表，没有公开出售流程，也没有详细股权结构分配瀑布。任何定价投资决定前，最终尽调包应聚焦六项：完全稀释后所有权和优先权；完整 KBR
              押记和违约机制；Wilton 发货、稼动率和规格通过数据；客户和许可经济性；自建站点的项目融资计划；以及现实的退出材料。在这些问题关闭前，正确投资姿态是把 Mura
              留在观察名单上，避免像披露质量已经达到公开市场水平那样承销上行。
