  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河因素
      - Mura 定位
      - 削弱后的风险
      - 缓释措施
    rows:
      - - 原料适应性
        - Hydro-PRT® 定位于处理混杂、受污染、柔性、多层废弃物
        - 如果热解同行或既有预处理商追平耐受度，Mura 最清晰的差异化会消失
        - 在 Wilton 和未来许可站点，用最难处理的料流证明收率和稼动率
      - - 碳表现叙事
        - Mura 引用的数据称，相比已审阅热解方案，GWP 约低 50%，相对焚烧也有明显减排
        - 如果客户主要按价格采购，或质疑方法学，可持续溢价会被压缩
        - 持续更新第三方 LCA 和数据库收录，保持可比
      - - KBR 分销与许可触达
        - 独家全球许可伙伴让 Mura 借资产负债表之外的力量扩张
        - 如果 KBR 管线放慢，或议价权转移，Mura 的 GTM 杠杆会变弱
        - 分散商业验证点，并披露许可管线质量
      - - 认证与下游整合
        - ISCC PLUS 和包销关系支撑客户采用
        - 如果竞争对手凭更强资产负债表交付同等认证，切换成本会下降
        - 加深客户认证、质量平衡流程和产品一致性
      - - Wilton 学习曲线优势
        - 首座商业水热工厂沉淀运营 know-how 和故障排查数据
        - 如果 Wilton 表现不达标，先发地位会从护城河变成脆弱性的证据
        - 拿出持续稼动率、产品质量和投产里程碑
      - - 品牌 / IP / Hydro-PRT® 商标
        - 清晰的工艺品牌和专利支撑的 know-how 帮助 Mura 掌握叙事
        - 如果更大的对手能复刻核心经济性，单靠品牌不够强
        - 把 IP 叙事和可量化的工厂表现、客户采用绑定
    notes: 风险登记表关注的是 Mura 声称的优势能否转化为持久商业杠杆，而不只是技术新颖性。
    claimRefs:
