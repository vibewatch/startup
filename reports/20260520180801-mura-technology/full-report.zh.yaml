  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式可见，但实际经济性不透明
        blocks:
          - type: paragraph
            body: >-
              Mura 的公开材料支持一套双轨变现模式，而不是单一工厂销售故事。第一，Wilton 等 Mura 自有资产计划把循环烃产出卖入长期石化承购关系。Hydro-PRT
              产品页面明确说明，原料将以长期合同供应；Mura 的 Wilton 页面和 Neste 公告也显示 Teesside 产出已有下游买方点名。第二，Mura 通过 KBR 商业化 Hydro-PRT，KBR
              被描述为全球独家许可和首选工程伙伴。这意味着未来收入可以包括 许可授予、里程碑付款、工程包，也可能包括与伙伴出资工厂挂钩的下游技术支持或版税流，而不只是 Mura 自有产量。


              这种结构在战略上有吸引力，因为它比把每一座工厂都建在 Mura 自己资产负债表上更轻资产。但公开合同公告不等于确认收入。受评来源包没有循环烃挂牌价格，没有公开许可费表，也没有披露授权项目中 Mura 经济性与
              KBR 经济性如何分成。因此，商业路径可信，但公开数据尚未证明收入质量。投资人能看见现金应从哪里来；仍看不见实际销售价格、利润捕获，或产品、许可和工程收入流的确认时点。
