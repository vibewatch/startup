      - number: '5.2'
        title: 运营架构与部署依赖
        blocks:
          - type: paragraph
            body: >-
              Mura 已披露足够信息，可以勾勒一套真实运营架构。废弃物以打包料形式到厂，经过破碎并去除玻璃、金属和非目标塑料后，被加热加压，再进入 Hydro-PRT
              转化单元。工艺使用超临界水作为“变化媒介”，打断碳键，生成更短链且稳定的烃，用于下游升级。核心工艺周围是一张依赖网络：专业废弃物管理公司提供原料，px 根据 10-year O&M 合同运营 Wilton，Dow
              和 Neste 锚定下游产品消纳，KBR 则担任全球更大范围推广的独家许可和工程渠道。


              这套架构有吸引力，因为它是模块化的。Wilton 提供首个同类工厂证明，韩国和日本的授权场地模型说明 Mura 可以在不为每个未来项目买单的情况下扩展技术。但同一套架构也制造集中风险。KBR
              不只是销售伙伴；它深嵌在许可和工程中。px 不只是运营方；它对场地可靠性居于核心。研究伙伴也不是外围；它们正在帮助界定新聚合物和可持续模型的下一段能力边界。换句话说，产品不只是 Hydro-PRT 化学本身，而是
              Hydro-PRT 加一个伙伴生态。这在商业上很有力，但也意味着任何关键节点表现不佳，都可能拖慢外界对整个平台成熟度的判断。
