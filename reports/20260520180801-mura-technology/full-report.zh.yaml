      - number: '5.3'
        title: 信任、质量控制与透明度姿态
        blocks:
          - type: paragraph
            body: >-
              Mura 最强的可信度信号，不是一长串通用认证，而是围绕 Hydro-PRT 公开的技术和可持续性文件密度。可持续性页面、资源中心、WMG 材料、KBR 的 JRC 摘要，以及 ecoinvent
              访谈都指向同一件事：公司知道，环境可信度必须靠第三方方法来证明，不能只靠销售文案。公开材料提到 Teesside 的 ISCC PLUS 认证产品、围绕 Wilton 的 WMG LCA、European
              Commission JRC 对热解和焚烧的比较，以及 Mura 数据集持续纳入 ecoinvent、供更广泛 LCA 使用。


              这有用，但不等同于完整的产品质量披露。已审阅来源没有提供稳态稼动率、产率分布、产品规格表、拒收率、工艺安全指标或公开事故记录。就连 ecoinvent
              访谈也明确提到，设计假设需要在足够周期的真实工厂运行中校验。因此，Mura
              作为工业初创公司在可信度上格外重视数据，但客户和投资人在认定平台完全成熟前所需的运营指标仍未补齐。公司已经把透明度写进商业叙事中的产品特征；现在还需要用运营数据把故事闭环。
