    Cat-HTR™ 平台的 Hydro-PRT® 水热先进回收工艺商业化，用超临界水把混合塑料废弃物裂解为循环烃产品，不需要催化剂或氢气。公司运营 Mura Wilton——全球首座商业规模水热塑料回收工厂；该厂已于 2025
    进入调试，并向承购伙伴 Neste 发出首批产品。KBR Inc. 是全球独家许可合作伙伴、首选工程承包商，并持有 18.5% 股权以及 March 2026 的知识产权担保押记。Mitsubishi Chemical
