      - number: '2.2'
        title: 规模测算视角：保留窄口径和宽口径估计
        blocks:
          - type: paragraph
            body: >-
              公开市场数字差异很大，但差异主要来自边界，而不是简单矛盾。Allied Market Research 衡量的是较宽的化学回收收入池，估计 2025 为 $4.0 billion，到 2035 增至 $14.4
              billion。Market Growth Reports 衡量的是窄得多的水热处理类别，估计 2026 约为 $0.8 billion，到 2035 增至 $2.1
              billion；但该类别也包括湿生物质、废水等非塑料应用。如果把其中任何一个数字当成“那个”TAM 而不披露口径，就会扭曲尽调结论。


              更扎实的做法，是把收入口径和实物体量锚点放在一起看。公开来源显示，相比当前已经部署的先进回收产能，塑料体系极其庞大：Plastic Energy 称全球每年塑料产量超过 390+ million
              tonnes，EPA 报告 2018 年美国塑料产生量为 35.7 million tons，其中 27 million tons 进入填埋。在这个背景下，Mura 宣称到 2025 年底拥有 60kta，并以
              2032 年 1.5 million tonnes 为目标，说明可服务份额仍受执行能力约束。正确结论不是市场很小，而是规模测算必须多视角，并明确每个数字包含什么、不包含什么。
