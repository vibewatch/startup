      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图是多边的。一端是锁定难回收原料的废弃物供应商和聚合商。中间是 Mura 自有工厂和被许可方，由 KBR 以及 Mitsubishi Chemical、LG Chem 等化工运营商支撑。下游是 Neste
              这样的石化承购买方，以及 Dow 这样的战略伙伴，它们把循环烃作为新塑料投入品。再往后，是树脂生产商、转换商、消费品牌和负有义务的包装生产商，其预算受再生成分强制要求、EPR 费用和循环包装承诺塑造。


              这种结构意味着用户不一定总是付款方。废弃物公司关心处置替代方案和预处理经济性。石化买方关心认证输入质量、工厂集成和原料可得性。品牌和生产商往往提供经济拉力，因为它们需要合规的再生成分主张，但通常是通过树脂或包装供应链采购，而不是直接向
              Mura 采购。因此，采用路径通常沿价值链推进：先锁定原料，再证明转化质量，签承购，随后扩大许可或自建产能。认证承购很重要，因为它把环境叙事转成可编入预算的合规与采购路径。
