      - number: '8.2'
        title: 融资背景真实，但资本结构不透明仍主导估值判断
        blocks:
          - type: paragraph
            body: >-
              公开融资记录有帮助，但不完整。Mura 2022 年 6 月公告显示，KBR 进行了 $100 million 股权投资并获得董事会席位，这是有意义的战略验证。2026 年 2 月确认声明显示，Dow
              Europe Holding B.V. 和 CAT-HTR Plastics Pty Ltd 位列股东名册，进一步说明 Mura
              的股权结构中有工业方和技术源流持有人，而不只有财务赞助方。这些事实支持一个判断：严肃交易对手已经投入资本并形成利益一致。


              但同一公开记录也凸显，估值必须对结构敏感。Companies House 现在显示，KBR 于 2026 年 3 月对全部财产和全部知识产权设立担保包，包含固定押记、浮动押记和负面质押。这种重叠很关键，因为
              KBR 不只是债权人；它也是商业故事里的许可渠道。公开证据没有披露上一轮定价、优先股堆叠、反稀释保护、清算分配顺序，或近期融资是否重设普通股价值。因此，当前融资证据足以证明 Mura
              能融资，但不足以证明一个头部企业价值会转化为新投资人的有吸引力股权回报。
            claimRefs:
              - CV002
              - CV003
