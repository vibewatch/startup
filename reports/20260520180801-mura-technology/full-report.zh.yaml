      - number: '1.2'
        title: 创立故事与技术源头
        blocks:
          - type: paragraph
            body: >
              Mura Technology 由 Licella Holdings Limited（一家澳大利亚水热液化技术公司）以合资形式创立。Licella 在 2014
              开始先进塑料回收研发，基础是其最初为生物质转化开发的 Cat-HTR™（Catalytic Hydrothermal Reactor）平台。Cat-HTR™
              技术用超临界水——加热并加压到临界点以上（374°C、221 bar）的水——裂解聚合物中的碳碳键，不用氢气或催化剂就把聚合物转化为更短链的烃。Licella 在 2016 设立
              Mura，作为塑料先进回收的商业化载体，并由 Dr Stephen (Steve) Mahon 担任 CEO 和联合创始人。

              此后，Mura 将该工艺品牌化并注册为 Hydro-PRT®（Hydrothermal Plastic Recycling Technology），取代更早的 HydroPRS™
              商号。相较基于热裂解的竞争方案，这项技术的核心优势在于用水作为反应介质，而不是单靠热量；因此它能处理更广泛的塑料类型——包括受污染、柔性、多层、混合且无法机械回收的塑料——且无需预分拣，同时产出质量更高。EU
              Joint Research Centre（JRC）在 2023 发布的报告把 Hydro-PRT® 评为先进回收技术中的同类最佳，并显示其 Global Warming
              Potential（GWP）约比两项受评热裂解技术低 50%。University of Warwick WMG 在 2023 独立发布的 LCA 显示，与焚烧塑料废弃物相比，Hydro-PRT® 可降低 80%
              气候影响。November 2024，Mura 经同行评审后成为首家被纳入 ecoinvent 生命周期清单数据库的先进回收企业，使下游买方能够获得独立验证的环境数据。

              Mura 与创始母公司、技术许可方 Licella 的关系后来发生实质性重组：与 Licella 相关的澳大利亚实体 Cat-Htr Plastics Pty. Limited
              曾作为具有重大控制权的人（PSC）持有 Mura 25–50% 股权，但该登记已被移除。两家公司仍在合作；Licella 网站确认，Mura 的 Hydro-PRT
              设施是“全球三座已完成商业先进回收设施的核心”。
