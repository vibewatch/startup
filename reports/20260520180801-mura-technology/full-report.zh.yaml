      - number: '1.3'
        title: 领导团队与治理
        blocks:
          - type: paragraph
            body: >
              Mura 的领导团队由 Dr Stephen (Steve) Mahon（CEO 兼创始人）带领。Mahon 为英国籍，自公司 December 2016
              注册成立以来一直担任董事。他是一名经验丰富的投资专业人士，背景覆盖三次 IPO、AIM 上市科技企业以及英国早期可再生能源开发。他拥有地球物理与行星物理的一等学位和博士学位。在他的领导下，Mura 与
              KBR、Dow、LG Chem 和 CPChem 建立全球合作，并募集外部资本，为首座商业工厂提供资金。

              现任高管团队还包括 Jo-Anne Illman（首席人力官）、Richard Daley（首席技术官兼 Mura Wilton 董事总经理，特许化学工程师）、Dr Dianna
              Kyles（首席法务官，King's College London 法学博士）以及 Steve Garbutt（项目总监，聚焦 Teesside 调试）。董事会层面的治理结构反映出 KBR 的重要持股：KBR
              前全球 CEO Stuart Bradie 曾担任董事，直至 March 2026 Andrew Marino Goodwin（美国籍）获任命。这一变动与 KBR 在 March 2026 对 Mura
              财产和知识产权登记广泛法律押记（Charge 0002）同期发生，使 KBR 除投资方、许可伙伴、工程伙伴之外，还取得贷款方的担保地位。

              董事变动较明显：Larry Ciccarelli 和 Robin Chamberlayne 于 November 2024 离任。Leonard Humphreys（澳大利亚籍，February 2019
              起任董事，与 Licella 的创始参与相关）和 Douglas Nick Kelly（美国籍，May 2024 获任命）仍留在董事会。公司价值与机构知识集中在 CEO/创始人身上，形成关键人风险，因为
              Mahon 是所有重大关系中的创始技术和商业负责人。
