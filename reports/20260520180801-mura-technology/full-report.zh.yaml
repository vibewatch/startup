      - number: '8.4'
        title: 乐观、基准、悲观估值区间应按里程碑加权
        blocks:
          - type: paragraph
            body: >-
              由于 Mura 没有披露传统收入倍数或 DCF 所需的运营输入，公开证据下最可辩护的方法是按里程碑加权的可比估值。悲观情景假设 Wilton 无法产出有说服力的重复发货，出现另一次类似 Böhlen
              的执行挫折，或 KBR 控制权担忧主导讨论。在这种状态下，Mura 更像一个战略上有意思但融资受限的平台，只支撑低于 $1 billion 的区间。


              基准情景假设 Wilton 能证明重复商业产出，日本和韩国案例继续降低许可模式风险，新加坡推进且没有新的项目失败，同时投资人仍因 Mura 缺少公开收入和股权结构清晰度而相对 PureCycle
              大幅折价。由此得到约 $0.9 billion 至 $1.5 billion 的区间。乐观情景要求的不只是叙事：Wilton 重复证明、许可转化持续、KBR 不发生控制权冲击，以及行业情绪足够强，足以让 Mura
              接近上市可比公司上限。估值因此可以进入约 $1.8 billion 至 $2.4 billion 区间。基于现有证据，概率加权视角聚集在十亿美元出头，而不是自动的数十亿美元溢价。
            claimRefs:
              - CV024
