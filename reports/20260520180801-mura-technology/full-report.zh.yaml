      - number: '6.3'
        title: 留存信号、复用证据边界与扩张潜力
        blocks:
          - type: paragraph
            body: >-
              耐久性证据存在，但比投资人理想中更窄。最清楚的连续性信号，是从初始协议走向更深整合。LG Chem 没有止步于投资者和被许可方身份，而是推进到开工建设。Mitsubishi Chemical 和 ENEOS
              从采用技术推进到工厂投运和计划客户发货。Dow 的关系也经受住 Böhlen 项目失败：取消公告明确称 Dow 和 Mura 仍保持承诺，并在寻找新的欧洲机会。Neste
              的承购被描述为长期协议，比一次性现货销售更强。这些都是有意义的类留存信号，因为它们显示关系跨越多年和多个项目阶段仍在延续。


              同样重要的是缺口。Mura
              没有公开披露净收入留存、总留存、续约比例、按客户划分的交付吨位、重复订单历史或客户满意度数据。因此，实际重复使用的公开证据仍是间接的。最佳可得代理指标是阶段性连续：协议、开工、调试、投运、客户发货。这足以说明若干交易对手已经深度嵌入平台，但不足以说明
              Mura 拥有多元化、经常性、低流失客户基础。扩张潜力依然有吸引力，因为许可模式能在不让 Mura 自己出资建设每座工厂的情况下增加地域覆盖；但公司还没有发布能把连续性转化为重复需求证明的运营数据。
