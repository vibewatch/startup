  - id: TV005
    title: 投资逻辑破坏与终止触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - IP / 控制权恶化
        - KBR 担保权加严、违约，或限制许可资产的实际控制权
        - 打破任何溢价平台估值背后的资产控制假设。
        - 暂停或退出，除非下行已通过结构性安排保护。
      - - Wilton 验证失败
        - 没有重复商业发货、产品规格接受度弱，或爬坡延误拉长
        - 切断从叙事到可变现验证的主桥。
        - 估值转向悲观区间，并要求更低入场价格。
      - - 商业推广停滞
        - 新加坡明显延后，或许可场地势头转弱
        - 削弱基准和乐观情景所需的里程碑堆叠。
        - 将估值下调到低于 $1B 的逻辑，直到里程碑恢复。
      - - 股权结构表 / 优先权意外
        - 新尽调显示高级优先权或稀释在基准情景区间附近吃掉价值
        - 把看似合理的企业价值变成糟糕的普通股回报。
        - 要求改变结构，否则不投。
      - - 行业 / 政策挫折
        - 另一个高调项目取消，或不利政策待遇打击经济性
        - 压缩倍数，并抬高整个品类的融资风险。
        - 收紧情景概率，并转向仅观察姿态。
    notes: 触发因素是可监控的决策规则，不是泛泛风险。每一项都会直接压缩估值支撑或股权上行空间。
