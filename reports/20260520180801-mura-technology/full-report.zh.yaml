      - number: '1.4'
        title: 融资与投资人格局
        blocks:
          - type: paragraph
            body: >
              Mura 是一家私人公司，未披露财务；本次尽调未能在公开领域取得经审计财务报表。公开报道中最重要的融资事件，是 December 2023 报道的一笔 £120 million（约 $150
              million）融资，The Guardian 称 BlackRock 基础设施投资部门为主要投资方（文章现为 404）。chemicalrecycling.org 摘要的新闻显示，KBR 对 Mura
              的累计投资为 $100 million，并取得 18.5% 股权。LG Chem 也对 Mura 进行了未披露金额的股权投资，同时包含一份针对韩国 Dangjin Hydro-PRT®
              设施的技术许可协议。英国政府机构 Innovate UK 提供了 £4.42 million Smart Sustainable Plastic Packaging（SSPP） Challenge 赠款，June
              2025 完成。基于可得公开来源，无法核实累计融资总额；这仍是开放尽调事项，需要取得 Companies House 集团账目（最后提交于 July 2025，53 页）或管理层直接披露。

              资本结构存在明显复杂性：KBR 持有 Charge 0002（March 2026 登记，目前仍未解除），覆盖 Mura Technology Limited 的“全部财产和全部知识产权”。此前一项以 Dow
              Europe Holding B.V. 为受益人的押记于 February 2022 登记，并于 September 2022 清偿，与 Dow 商业合作时间线一致。KBR
              的押记，加上其独家许可方、首选工程承包商、股权投资人以及如今担保债权人的角色，织出一张相互依赖的网络，需要评估其中的利益冲突和治理影响。任何可访问公开来源中均未发现老股交易活动或估值数据。
