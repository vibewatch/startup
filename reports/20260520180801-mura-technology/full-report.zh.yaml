      - number: '7.4'
        title: 人员、执行与止损条件
        blocks:
          - type: paragraph
            body: >-
              人员和执行层面进一步说明，必须设置硬性止损条件。Steve Mahon 显然是关键人风险，因为公开公司叙事反复落到他搭建伙伴关系的记录上。Richard Daley 也是集中依赖点，因为他同时承担技术领导和
              Wilton 直接责任。Dianna Kyles 提供了可见的法务负责人，但公开可见的命名高管之下，团队纵深很薄。与此同时，Companies House 显示 2024 年 11 月和 2026 年 3
              月都有董事变动；2026 年 3 月，Stuart Bradie 退出、Andrew Goodwin 加入，时间与 KBR
              押记提交同日。这一时间点不能证明不当行为，但确实提出治理问题，严肃投资人应直接核清，而不是轻轻带过。


              实际缓释框架很直接。投资人应监测押记修订或解除、Wilton 启动节奏、重复发货证据、日本和韩国合作伙伴里程碑交付，以及任何改变先进回收产出在合规体系中待遇的政策指引。止损条件也应同样清晰：如果 KBR 以削弱
              IP 控制的方式收紧或执行担保权，退出；如果 Wilton 在启动后合理窗口内无法证明重复发货和稳定运营数据，退出；如果政策待遇或合规经济性让 Hydro-PRT 相比管理层假设明显失去竞争力，退出。Mura
              仍可能成为强工业平台，但前提是这些可监测触发项继续同向改善。
