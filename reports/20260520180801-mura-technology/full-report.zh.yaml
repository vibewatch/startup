      - number: '3.3'
        title: 护城河耐久性、切换成本与侵蚀情景
        blocks:
          - type: paragraph
            body: >-
              Mura 最好的护城河论点，不只是它拥有专有工艺；许多对手也声称拥有专利、认证路径和伙伴生态。更强的论证是，Hydro-PRT®
              把三件事组合在一起，而受评同业尚未在同一个包里匹配：以水热而非热裂解方式转化、广泛的原料灵活性，以及有文件支撑的可持续叙事，声称其碳强度显著低于受评热裂解路径。KBR 的全球独家许可角色也给 Mura
              一个分销放大器，这是小型独立初创公司很难单独搭建的；Wilton 则提供首套同类工厂的运营数据和故障排查经验，只要工厂达到持续利用率，这些经验会更有价值。


              但这条护城河有条件，并非绝对。若热裂解系统大幅提升污染容忍度，或废弃物管理既有企业锁住最有吸引力的废弃物流，原料灵活性的价值会下降。若客户主要按价格采购，或一体化石化集团用更强资产负债表和更广客户触达来包装质量平衡循环产品，碳优势会削弱。若
              KBR 的激励偏离 Mura，许可杠杆会变成脆弱点。Böhlen 取消最具体地提醒我们：商业就绪不等于护城河耐久。即便工艺有差异化，若场地经济性、监管和伙伴承诺撑不住，仍会受挫。
