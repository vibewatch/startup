  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 完全摊薄所有权
        - 当前股权结构表、期权池、SAFEs / 可转债，以及所有清算优先权
        - 决定普通股价值能否在公开证据区间内保住。
        - CFO + 律师数据室审查。
      - - KBR 控制权机制
        - 完整担保权文件、违约触发因素、补救权，以及任何债权人间限制
        - 厘清核心 IP 和许可资产在下行情景中是否会受损。
        - 对 Companies House 文件和附函做法律尽调。
      - - Wilton 运营验证
        - 月度吞吐量、收率、正常运行时间、产品规格通过率和重复客户发货
        - 区分故事风险和真实商业化。
        - 运营材料包加客户验收证据。
      - - 客户 / 许可经济性
        - 收入确认、利润率结构、里程碑付款和交易对手集中度
        - 让估值建模摆脱只看里程碑的代理指标。
        - 财务 + 商业尽调。
      - - 项目融资计划
        - 现金跑道、自建场地 capex 计划、补助，以及债务 / 股权融资路线图
        - 先进回收价值不仅会被技术毁掉，也会被融资结构毁掉。
        - 财资 / 项目融资审查。
      - - 退出路径
        - 董事会对 IPO、战略出售、老股流动性和时间安排的看法
        - 入场纪律取决于可信回报路径，而不只是技术故事。
        - 董事会材料和投行沟通。
    notes: 这些问题是强制项，不是可选项；只有回答清楚，才能把观察姿态转成带价格的投资决定。
