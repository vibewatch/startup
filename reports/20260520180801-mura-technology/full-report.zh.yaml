      - number: '6.2'
        title: 采用路径与承诺深度
        blocks:
          - type: paragraph
            body: >-
              Mura 的采用路径不是通过披露客户数仪表盘呈现，而是通过里程碑显现。2022 年，Dow 和 Mura 宣布大规模战略合作，Dow 将担任关键承购方，并支持多座世界级设施计划。2024 年，Mura 又与
              Neste 签署 Wilton ISCC PLUS 认证产品的承购协议。许可侧，LG Chem 从 2022 年的投资和购买许可，推进到 2023 年开工；Mitsubishi Chemical 和 ENEOS
              则从更早的许可推进到 2025 年 Ibaraki 20,000 吨设施投运。2025 年的新加坡公告又把可见管线延伸到 PCS 支持的 Jurong Island 站点，并直接接入潜在下游客户。


              这个模式重要，因为它说明 Mura 并不试图在证明系统前赢下几十个小合同。它用大型交易对手验证模型的不同部位：Dow 和 Neste 验证产品承购，LG Chem 与 Mitsubishi/ENEOS
              验证技术部署，Geminor
              验证原料可靠性。因此，公开牵引力更像基础设施项目开发，而不是软件获客。正面解读是，每新增一个交易对手都会实质提升可信度；反面解读是，获客仍然不连续：每个新账户都大、战略性强、推进慢，并且对更广泛商业叙事影响很大。
