          - type: callout
            title: KBR 多重角色集中风险
            body: >
              KBR 同时持有股权（18.5%）、担任全球独家许可方、作为首选工程承包商，并自 March 2026 起持有覆盖 Mura 全部 IP
              和财产的担保押记。单一战略伙伴集中这么多角色，带来显著依赖和潜在利益冲突：KBR 控制许可管线、工程交付，如今还控制 IP 担保位置。KBR-Mura
              关系一旦恶化，许可商业模式会同时从商业、工程和债权人三个角度受到威胁。
            calloutType: risk
            claimRefs:
              - CO006
              - CO028
              - CO032
              - CO046
          - type: callout
            title: Böhlen 取消证明欧洲监管逆风
            body: >
              Mura 与 Dow 的 Böhlen 设施在 August 2025 取消，理由是欧洲制造业存在“持续的经济和监管挑战”，这给公司的欧洲增长计划发出重大风险信号。ExxonMobil 因 EU 监管不确定性暂停
              €100M 欧洲塑料回收投资的报道，也印证了这一点。如果 EU Packaging and Packaging Waste Regulation（PPWR）或 Extended Producer
              Responsibility（EPR）框架无法兑现承诺中的经济激励，更多欧洲项目可能无法推进，风险会集中到亚洲。
            calloutType: risk
            claimRefs:
              - CO041
              - CO042
              - CO043
          - type: callout
            title: 许可商业模式完全依赖 KBR 渠道
            body: >
              除 Mura 自有工厂路线外，所有全球许可都经由 KBR。这意味着 Mura 规模化变现技术的能力完全取决于 KBR 的商业优先级和项目管线。KBR 同时持有 IP 押记，Mura
              的技术资产——最核心的差异化来源——已成为抵押品；从功能上看，KBR 不只是伙伴，也像贷款方。
            calloutType: insight
            claimRefs:
              - CO006
