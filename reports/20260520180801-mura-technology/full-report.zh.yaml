        - 审查 Wilton 及授权场址的运行时间、收率和爬坡曲线
      - - 原料质量和收集缺口
        - 约束
        - 当前
        - 废弃物流不稳定，会推高预处理成本，并压低工厂经济性
        - 审查污染阈值、分拣要求和供应集中度风险
      - - 原生料价格和 ROI 不确定性
        - 约束
        - 当前
