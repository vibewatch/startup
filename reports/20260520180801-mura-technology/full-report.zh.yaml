  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Mura 是私有先进回收公司中可信度较高的平台之一，因为公开记录显示的是实在的战略交易对手，而不只是试点式乐观语言。公司有 KBR 作为投资人和全球许可合作伙伴，与 Neste 有点名承购联系，与 LG Chem
              和 Mitsubishi/ENEOS 有部署进展，有新的新加坡项目，并计划到 2032 年达到 1.5 million tonnes 的年运营或开发产能。这足以让投资人继续关注；但不足以支持支付未说明的溢价估值。


              关键估值问题不是 Mura 有没有前景，而是留存的公开证据仍未披露当前收入、EBITDA、现金消耗、完全稀释后股权结构表或清算优先权。因此，正确建议是观察 / 继续研究，并设置明确入场纪律。投资人应把
              PureCycle 的公开市值视为商业化阶段先进回收的情绪上限，而不是 Mura 自动应得的底部。在 Wilton
              重复发货证明和私有公司股权结构透明度出现之前，公开证据只支持在相对该上市可比公司上限有显著折价、或带有下行保护结构的条件性兴趣。
