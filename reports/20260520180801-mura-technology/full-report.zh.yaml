      - number: '6.4'
        title: 集中度与反向商业信号
        blocks:
          - type: paragraph
            body: >-
              主要客户风险是集中度。Mura 大部分公开证明都落在少数名字里：Dow、Neste、LG
              Chem、Mitsubishi/ENEOS、Geminor，以及规划中的新加坡交易对手。每一个都支撑模型不同一条腿，商业上高效，但也有风险。Dow 或 Neste 如果削减需求，Wilton
              作为市场出口的可信度会受损。LG Chem 或 Mitsubishi/ENEOS 如果表现不及预期，许可投资逻辑会变弱。Geminor 或其他原料渠道如果失效，Wilton
              的利用率更难维持。这个平台里，供应商、客户和部署证明彼此重叠，因此某个已点名关系出问题，会传导到更广泛的投资判断。


              Böhlen 取消是最清楚的反向信号。它表明，即便 Mura 拥有一线合作伙伴和公开战略一致性，欧洲项目仍可能因为经济性和监管不足以支撑最终落地而被放弃。这并不推翻 Dow
              关系；同一公告强调双方继续合作。但它证明 Mura 的商业模式仍暴露在宏观条件、监管和逐厂可行性之下。因此，投资人应把客户基础解读为质量高但窄、可信但不完整，且只有 Wilton
              运营、亚洲被许可方和未来承购转化共同继续推进时，扩张准备度才成立。
