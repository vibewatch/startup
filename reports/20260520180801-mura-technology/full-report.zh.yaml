        - 驱动
        - 2030 年和 2040 年
        - 为多种塑料包装形式中的消费后再生成分设定带时间表的需求
        - 建模判断哪些包装类别真正能吸收化学回收产出
      - - 包装行业政策协同
        - 驱动
        - 当前
        - 行业联盟和政策倡导加快包装循环所需基础设施和数据标准协同
        - 验证参与协议是否转化为签约量，还是仅为表态
      - - 认证承购和循环主张
        - 驱动
        - 当前
        - 让石化买方把回收产出转成可编入预算的合规和采购价值
        - 要求提供与买方使用的质量平衡和认证流程样本
      - - 新建工厂资本强度
        - 约束
        - 当前至中期
        - 大额项目资本开支拖慢部署，也迫使融资保持纪律
        - 按场址索取完整商业工厂资本开支、回本期和债务假设
      - - 技术放大和投产风险
        - 约束
        - 当前
