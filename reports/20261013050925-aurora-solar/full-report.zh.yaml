      - number: '8.2'
        title: 融资历史与资本结构压顶
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar 历史累计获得 $520.4 million–$537 million 风险投资，最终在 2022 年 2 月完成由 Coatue Management 与 Energize
              Ventures 共同领投的 $200 million Series D，投后估值 $4.0 billion。更早的机构轮次包括：Coatue 于 2021 年 5 月领投、据报估值 $2.0 billion 的
              $250 million Series C；ICONIQ Capital 于 2020 年 11 月领投的 $50 million Series B；以及 2019 年的 $23.5 million Series
              A。尽管 IPO 前券商和二级市场追踪平台仍引用 $4.0 billion 的 headline 估值，二级交易流动性仍极差，并受严格转让限制和优先购买权约束。在接近 2022
              年估值的水平建立股权仓位，意味着显著的下行风险；尤其是后期资本方的清算优先权层层叠加，普通股股东或近期二级投资者要参与退出收益，必须先跨过很高的回报门槛。
