            - 低
            - 高
    approximationNotes: 可能性和影响等级根据承包商调查数据、监管申报及市场评审结果分类。
    claimRefs:
      - CR001
      - CR002
      - CR011
      - CR012
  - id: FV001
    title: 估值评估与建议逻辑
    type: flow
    summary: 依次展开的分析链条，最终得出进一步研究的建议及估值偏高的判断。
    data:
      nodes:
        - id: scale
          label: 品类领先
          detail: 超过 7,000 家客户机构、累计完成 20M 多个设计，验证了其在住宅工作流中的核心主导地位。
        - id: pricing
          label: 高端席位定价
          detail: 据报告，席位价格为 $159-$259/月，加购项使每名活跃安装商带来的总收入较高。
        - id: macro
          label: 太阳能市场逆风
          detail: OBBB 政策转向及联邦激励到期，导致安装商市场波动加剧，并推高软成本压力。
        - id: multiples
          label: 倍数压缩
          detail: 垂直 SaaS 公司的公开市场交易倍数已从 2021—2022 年 25x—30x 的峰值，压缩至 ARR 的 6x—10x。
        - id: overhang
          label: D 轮估值压力
          detail: 历史上的 D 轮 $4.0B 估值，相较基准情景价值形成了显著的优先权和回报门槛。
        - id: decision
          label: 建议：进一步研究
          detail: 估值偏高且缺少经审计财务报表，因此在完成私下尽调前应暂缓推进。
      edges:
        - from: scale
          to: pricing
        - from: pricing
          to: macro
        - from: macro
          to: multiples
        - from: multiples
          to: overhang
        - from: overhang
          to: decision
    approximationNotes: 流程顺序反映定性尽调综合判断，而非定量模拟。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV008
      - CV014
