  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类定义与支出分类
        blocks:
          - type: paragraph
            body: >-
              太阳能设计和项目工作流软件位于规模更大的 $100 billion 太阳能生态核心位置。过去十年，光伏硬件成本下降超过
              90%，但客户获取、工程现场勘测、阴影计算、许可审批和融资协调等非硬件软成本，仍占住宅安装总支出的 60% 至 70%。Aurora Solar
              将云平台定位为专门的设计与销售引擎，直接压缩施工前软成本，用计算机视觉屋顶建模和经 NREL 验证的阴影模拟替代人工现场测量和 CAD 制图。可服务的软件支出边界十分明确：包括 SaaS
              订阅、按项目计费的建模额度、API 集成席位和自动化许可图纸生成；但签约后的运营支出——CRM、项目管理、现场施工人工、采购物流和实体资产性能监测——大多不在 Aurora
              原生平台范围内，安装企业因此仍需拼接多个供应商的软件栈。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与实际覆盖范围
        blocks:
          - type: paragraph
            body: >-
              估算垂直太阳能软件的可服务市场，需要把宽泛的自上而下风险投资预测与自下而上的运营现实放在一起比较。机构股权研究引用早期风险投资人 Energize Ventures 的估计称，到 2025 年，美国太阳能软件
              TAM 将达到 $3 billion，国际市场达到 $19 billion；全球光伏发电容量扩张超过 1.2 terawatts 是主要推动力。在这一宏观范围内，专门用于施工前设计、阴影计算和方案的软件 SAM
              更窄，北美约为 $400 million 至 $500 million。Manhattan Venture Research 根据 Aurora 客户数量和分层订阅价格（每位用户每月 $159 至
              $259）建立自上而下收入模型，估算公司 2022 年年收入为 $145 million 至 $181 million；这与 Sacra 对 Aurora 2023 年收入 $170 million
              的第三方估算大致一致，后者假设同比增长 70%。不过，区域监管边界限制了可服务范围：Aurora 的模拟引擎针对 National Electrical
              Code（NEC）和美国国内净计量优化，在当地公用事业电价和建筑标准不同的市场，国际采用会遇到摩擦。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
