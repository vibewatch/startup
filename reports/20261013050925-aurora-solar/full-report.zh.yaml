  - id: TV002
    title: 投资论点与反论点
    columns:
      - 分析支柱
      - 核心投资论点
      - 反方论点
      - 关键尽调触发点
    rows:
      - - 市场地位与护城河
        - Aurora Solar 实际上已成为美国住宅太阳能软件的标准，拥有 7,000 多家客户组织，已完成 20M+ 个设计。
        - 核心软件护城河集中在美国住宅屋顶；商业 EPC 仍需要 AutoCAD 制作电气 SLD。
        - 通过 HelioScope 集成实现商业工程采用和 SLD 自动化的成功证据。
      - - 定价能力与单位经济
        - 多层定价结构（基础版 $159-$259 / 席位 / 月，另加 AI 和 Sales Mode）能够捕获较高支付意愿。
        - 按席位按月计费的模式难以适应安装商现场员工数量波动，也带来明显的评估摩擦。
        - 安装商利润率承压期间的客户留存和许可证席位扩张数据。
      - - 宏观与监管暴露
        - 软件自动化直接降低软成本，使 Aurora 在政策环境变化时成为不可或缺的效率工具。
        - 联邦太阳能激励到期后的市场波动会导致客户收缩和安装商破产。
        - 联邦政策转向后的季度设计量趋势及安装商存活率。
      - - 资本结构与估值
        - Coatue、Energize、ICONIQ 组成的一线投资人联合体提供品牌背书和资产负债表稳定性。
        - Series D $4.0B 投后估值在估值倍数正常化时会造成严重估值悬垂和负向回报偏斜。
        - 私募二级平台的成交价格，以及发起方是否愿意为结构化轮次或下轮融资定价。
    notes: 将核心投资论点支柱与可验证的商业反证进行对照。
