      - number: '3.4'
        title: 壁垒持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Aurora
              的壁垒看起来是运营型而非绝对型：集成工作流、积累的用户培训、企业控制和成熟的住宅销售体验会提高替换成本，但专业工具及供应商自称的低价套餐可能压缩单个模块。低产量买方若瓶颈不在设计吞吐量，内部流程和点解决方案仍然可行。现有证据没有量化多平台使用、续约行为、迁移成本、渠道影响或胜负单表现，也没有独立验证竞争对手价格或相对准确性。这些遗漏很重要，因为宽套件只有在客户使用足够多的模块抵消席位成本，并且融资、工程和监管相关方接受其输出时，才具有持久性。分配持久竞争溢价前，必须进行合同、遥测数据和客户推荐电话尽调。
