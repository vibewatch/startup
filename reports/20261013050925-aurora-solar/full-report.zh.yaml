      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 以消除软成本为基础的品类领导力
            body: >-
              Aurora Solar 通过解决美国住宅太阳能最昂贵的运营瓶颈——上门测量屋顶和计算阴影所需的车辆出动——确立市场地位。平台将经 NREL 验证的辐照度建模、航拍 LIDAR
              和自动化方案工作流结合起来，把原本需要两周的工程报价任务压缩为十五分钟的销售咨询。
            calloutType: insight
            claimRefs:
              - CO002
              - CO003
              - CO005
          - type: callout
            title: 监管依赖与打包摩擦
            body: >-
              Aurora Solar 在美国一线安装商中拥有很高的客户信任度，但其财务建模和合规引擎与美国 National Electrical Code 规则及零售净计量经济性紧密绑定。Sales Mode 和 AI
              Mode 另行许可，再叠加按席位定价，使小型承包商团队和国际运营商面临预算压力。
            calloutType: risk
            claimRefs:
