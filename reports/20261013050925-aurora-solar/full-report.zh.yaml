            title: 太阳能安装商市场 Beta 风险
            body: Aurora Solar 的收入增长高度杠杆于美国住宅太阳能安装商生态的健康度。联邦税收激励到期、宏观利率压力上升后，安装商破产和裁员会直接带来席位收缩及毛流失率上升，而小幅提高软件价格很难抵消这些影响。
            calloutType: risk
            claimRefs:
              - CV005
              - CV007
              - CV013
