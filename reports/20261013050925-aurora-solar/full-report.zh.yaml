chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与核心平台架构
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar 是一家成立于 2013 年、总部位于加利福尼亚州旧金山的私有企业软件公司。公司旨在消除长期拖累北美住宅及商业太阳能安装的高额软成本、人工现场勘测和运营摩擦。Aurora Solar
              无需人员爬上屋顶测量坡度和阴影，而是构建云原生平台，结合航拍影像、LIDAR 数据集和计算辐照度模拟，在远程环境中还原屋顶。

              公司核心软件已从远程制图扩展为覆盖太阳能全生命周期的操作系统。如今，Aurora
              集成计算机视觉现场建模、远程阴影计算、电气工程校验、互动式客户方案、原生融资报价、电子签名工作流和管辖审批机构（AHJ）图纸集生成。包括 National Renewable Energy
              Laboratory（NREL）研究在内的独立技术验证已确认，Aurora 的阴影计算所得太阳能利用率在统计上等同于现场实测值。这种计算精度使 Aurora
              输出广泛获得融资伙伴、公用事业审查人员和工程团队认可，也让该软件成为美国太阳能行业的标准设计基准。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
