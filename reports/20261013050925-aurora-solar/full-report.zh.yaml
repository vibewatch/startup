      - number: '7.2'
        title: 运营与数据质量风险
        blocks:
          - type: paragraph
            body: >-
              偏远地区太阳能工程要稳定运行，必须依靠高分辨率空间数据和准确仿真。Aurora 的屋顶重建引擎结合 USGS 3DEP 公共高程模型与私有商业航拍数据，预计覆盖美国郊区大都市区的 95%。农村地区覆盖率却会降至
              70%–80%；未建模树冠和过时航拍影像，可能导致人工放置遮挡物偏差、阴影计算错误，以及售后重新设计安装方案等重大风险。为防止技术生产错误，Aurora
              内置了经美国国家可再生能源实验室（NREL）验证的仿真引擎，仿真结果与现场人工太阳路径仪测量达到统计等效。即便如此，承包商销售组织仍普遍存在一种运营失误：销售代表常为加快报价，向市政许可申报使用简化的 Sales
              Mode 损耗因子，而不是用 Design Mode 运行完整的 NREL SAM
              小时级仿真。此外，账户治理和访问控制也带来运营摩擦。采用按席位按月订阅后，承包商经常让季节性销售人员与外包设计师共用凭证，损害项目可审计性，也让客户面临软件许可合规压力。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR006
              - CR010
      - number: '7.3'
        title: 合作伙伴与供应商依赖
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar 的软件架构依赖由外部数据合作方、硬件库维护者和云计算基础设施织成的网络。最关键的上游依赖是第三方航拍空间数据和高程网格。远程三维场地建模需要定期航拍和高密度 LIDAR
              点云，因此供应商涨价、API 降级，或城市影像更新延迟，都会立即拖慢报价周转。与此同时，Aurora 维护覆盖 3,000 多家电力公用事业和全球 17,000
              项公用事业费率的庞大数据库，并维护涵盖太阳能组件、逆变器和储能系统的完整部件库。制造商规格过时、符合 UL 1741-SB 和 IEEE 1547-2018
              标准的新认证智能逆变器接入延迟，或公用事业费率意外重构，都可能让面向屋主的报价出现层层叠加的财务预测偏差。Aurora 通过把公共高程模型与商业影像供应商结合、维持多区域冗余云服务，并提供可同步客户 CRM
              系统的企业 API，部分缓解了这些依赖；但供应商集中仍是结构性的运营现实。
            claimRefs:
              - CR007
              - CR005
              - CR003
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR005
              - CR003
      - number: '7.4'
        title: 财务模型与宏观经济逆风
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar 的商业定位，是在成熟且波动的下游市场中承受高增长软件估值。公司已获得超过 $520 million 的风险投资，2022 年 Series D 的基准估值为 $4
              billion，因此必须持续扩大企业 ARR。但商业扩张存在天花板：Aurora 的设计和辐照度算法主要面向住宅及商业屋顶应用，明确不被接受为公用事业级太阳能发电的可融资收益评估；后者几乎都要求使用 PVsyst
              建模。同时，Aurora 按报价收费的席位制定价（在另行购买 AI Mode 和 Sales Mode 插件前，常见报价为每位用户每月
              $159–$259），会让业务放缓的小型和中型承包商明显感到压力。利率高企、联邦补贴减少压缩安装商利润后，软件支出很容易成为承包商削减预算、降档或转向低价捆绑替代方案的首要目标。因此，长期投资判断必须密切跟踪住宅承包商网络中的安装商客户群流失、席位收缩率和下游信用违约。
            claimRefs:
