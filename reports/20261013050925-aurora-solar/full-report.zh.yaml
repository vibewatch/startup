            - 线索捕获 AI
            - 安装商网站组件
          detail: 房主在屋顶上可视化太阳能方案并提交联系信息；SunFarm 观察到 25% 的转化率。
          tone: positive
        - label: 2. 工程设计
          touchpoints:
            - 设计模式
            - LIDAR 屋顶建模
          detail: 设计师生成 3D CAD 场地模型，并运行经 NREL 验证的遮阴分析，无需现场出车勘察。
          tone: positive
        - label: 3. 销售方案
          touchpoints:
            - 销售模式
            - 公用事业费率数据库
          detail: 销售人员向客户展示客厅场景方案，按 17,000 多种公用事业费率测算电费节省。
          tone: positive
        - label: 4. 融资与签约
          touchpoints:
            - 合同管理器
            - Mosaic 与 TPO 集成
          detail: 安装商即时取得融资预批准，并为房主生成电子签名协议。
          tone: neutral
        - label: 5. 许可与安装
          touchpoints:
            - 许可图纸集
            - NEC 规则检查
          detail: 自动生成的许可图纸集减少 AHJ 返工，并消除安装商变更单。
          tone: positive
        - label: 6. 账户扩张
          touchpoints:
            - Sync API
            - 企业团队与角色
          detail: 企业承包商增加席位并同步 CRM 数据；拆分定价给预算带来压力。
          tone: risk
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按发生可能性、影响程度和缓解状态，跨类别评估主要法律、运营、依赖及财务风险。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解状态
        - 残余严重程度
      rows:
        - label: 联邦政策与 25D 到期
          values:
            - 高
            - 高
            - 低
            - 严重
        - label: 州级费率与净计费分歧
          values:
            - 高
