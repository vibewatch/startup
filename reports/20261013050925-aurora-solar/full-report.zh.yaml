      - number: '8.3'
        title: 可比估值与情景分析
        blocks:
          - type: paragraph
            body: >-
              评估 Aurora Solar 的估值，需要把其私有经营指标与当前垂直 SaaS 及能源科技市场倍数对比。券商首次覆盖报告和私有追踪模型估计，Aurora 年收入超过 $100 million，历史增速接近
              50%；当前基准 ARR 估计为 $130 million–$150 million。按 $4.0 billion 估值计算，Aurora 隐含的 trailing ARR 倍数为
              26x–40x，而上市垂直软件的中位数已压缩至 6x–10x ARR。基准情景假设稳态 ARR 为 $130 million、正常化软件倍数为 8.0x，则企业价值约为 $1.04 billion，较
              Series D 高峰估值下跌约 74%。即使在乐观情景下，HelioScope 商业化成功且 AI 变现推动 ARR 达到 $180 million、倍数扩张至 15.0x，合理价值也只有 $2.70
              billion，仍低于 2022 年的优先权门槛。悲观情景反映安装商收缩、客户流失，ARR 降至 $95 million、倍数为 5.0x，企业价值将降至 $475 million。
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
