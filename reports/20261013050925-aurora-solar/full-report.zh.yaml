      - number: '3.2'
        title: 能力、信任与工作流匹配
        blocks:
          - type: paragraph
            body: >-
              Aurora 在需要快速把远程住宅设计变成客户方案的场景中差异最明显。公司材料描述了 3D
              可视化、辐照度分析、财务建模、角色化工作流和企业管理；第三方摘要也将其描述为端到端设计与销售产品。但这种覆盖面不证明其在每个细分市场都更优。两份竞争对手发布的评测将 Aurora
              的住宅销售优势与可融资收益工作和商业工程区分开来，但发布方有商业利益，权重应当谨慎。能力矩阵因此把已支持功能与未知单元分开，避免把供应商比较变成独立基准。采购方应在同一批项目上测试输出质量，并核实各金融伙伴、主管机构和内部用户究竟要求哪些工具。
