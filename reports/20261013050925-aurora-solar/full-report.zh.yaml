        - label: 监管与公用事业费率基础设施
          detail: 建模分时费率结构和消防规范边界退距
          modules:
            - 全球公用事业费率库（17,000 多个费率）
            - 自动化 NEC 规范与辖区退距引擎
        - label: 商业工作流与销售演示层
          detail: 交付面向客户的提案生成和实时财务建模
          modules:
