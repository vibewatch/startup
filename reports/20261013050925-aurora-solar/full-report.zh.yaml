            body: >-
              在企业层级，Aurora 为高产量太阳能组织提供程序化集成层和管理控制。Sync API 与 Salesforce 等外部 CRM 数据库、企业资源规划平台及第三方太阳能融资提供商保持双向同步；Design
              API 则支持后台自动制图和模拟。平台治理包括单点登录（SSO）认证、多租户团队隔离，以及控制项目访问和编辑权限的自定义角色权限。尽管技术实力突出，机构评估者仍面临关键尽调风险。Aurora
              采用高价按报价按席位定价，未捆绑的增购模块会在团队扩张时推高软件成本。此外，专有项目文件格式限制互操作性；由于没有公开的开源 SDK 代码库或公共 API 遥测，外部开发者社区信号仍然有限。
            claimRefs:
              - CE002
              - CE011
              - CE012
              - CE014
              - CE015
      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: 经 NREL 验证的阴影引擎与自动化远程感知壁垒
            body: >-
              Aurora Solar 的核心技术壁垒在于计算物理和远程感知管线。平台结合 LiDAR 结构建模、机器学习树冠定位，以及与现场实体测量精度匹配的 NREL
              验证阴影引擎，取消车辆上门，并产出受主要太阳能贷款方和融资伙伴信任的可融资太阳能利用率。
