      - number: '4.4'
        title: 资本充足性、融资依赖与偿付能力风险
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar 在多轮机构融资中累计筹得 $523.5 million 至 $537 million 的风险资本和成长股权。2022 年 2 月，公司完成由 Coatue Management 和
              Energize Capital 联合领投的 $200 million D 轮后，投后估值达到 $4.0 billion，ICONIQ Capital、Fifth Wall、Lux Capital 和
              Emerson Collective 也参与其中。此前，公司 2021 年 5 月以 $2.0 billion 估值完成 $250 million C 轮，2020 年 11 月完成 $50 million B
              轮。大量股权资产负债表提供了显著流动性缓冲，但联邦能源立法通过、住宅太阳能税收激励（Section 25D）于 2025 年底到期后，市场环境急剧转向。2026 Aurora Solar Snapshot
              发布的行业数据确认，住宅太阳能安装商面临严重客户成本冲击和融资摩擦，直接压低安装商人数及软件席位扩张。Aurora
              持续现金消耗、跑道时长、债务契约和二级市场定价仍不透明。独立研究报告和二级平台指出，经审计收入申报缺失、净留存率不透明，使对未来偿付能力和估值持久性的投资判断依赖保密数据室披露。
            claimRefs:
              - CI008
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: 财务结论：投资判断可行性与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar 凭借超过 10 million 个项目设计和超过 7,000
              个客户账户所代表的运营规模，展现出美国太阳能领域顶尖设计与销售软件的强大市场地位。然而从投资和投资判断角度看，公司财务画像存在重大的结构性不确定性。由于 AI Mode 和 Sales Mode
              被激进拆分，小型和中型承包商对按席位定价产生反弹，五人团队的总年成本升至 $14,000–$18,000，而 SurgePV 等全包竞争产品仅为年费 $6,495。此外，Aurora
              高度针对美国净能源计量（NEM）和 National Electrical Code（NEC）标准优化，限制了其在欧洲或亚洲上网电价市场的无缝变现。由于经审计 GAAP 收入、经常性 ARR
              拆分、净收入留存队列和现金流盈亏平衡轨迹全部属于私有信息，机构投资者若不取得经审计财务报表、账单队列及股权结构表中的优先股堆叠，便无法按 $4.0 billion 基准估值对 Aurora 做出投资判断。
            claimRefs:
              - CI003
              - CI004
              - CI008
              - CI014
              - CI015
      - number: '4.6'
        title: 展示项
        blocks:
          - type: callout
            title: 安装商暴露于太阳能政策变化与席位收缩
            body: >-
              Aurora Solar 的订阅收入模式直接暴露于住宅太阳能安装量和承包商人数。联邦住宅清洁能源税收抵免（Section 25D）于 2025
              年底到期，在美国太阳能承包商生态中造成广泛客户成本冲击和融资波动。由于 Aurora 主要按月按席位许可，承包商缩编和分支合并会威胁收入留存及扩张席位额度。
