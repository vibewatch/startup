      - number: '1.3'
        title: 资本化历史、投资人联合体与估值
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar 展现出极强的融资势头，七轮机构融资累计获得 $520.4 million 至 $537 million 的风险资本和成长股权。公司 2014 年获得 Pear VC 种子融资后，于
              2019 年由 Energize Capital 领投 $23.5 million A 轮，2020 年再由 ICONIQ Growth 领投 $50 million B 轮。2021 年 5 月，科技跨界投资人
              Coatue Management 领投 $250 million C 轮，估值达到 $2.0 billion，显示机构投资者高度看好太阳能数字化。

              2022 年 2 月，Aurora 完成最新一轮股权融资：由 Coatue Management 和 Energize Capital 联合领投的 $200 million D 轮，投后估值达到 $4.0
              billion。Fifth Wall、Lux Capital 和 Emerson Collective 等知名成长型及行业专业投资者也参与其中。尽管历史投资者评论显示，公司 2022 年年收入已超过 $100
              million 且同比快速增长，但 2024 至 2026 年的经审计财务仍未发布。Nasdaq Private Market
              等另类交易系统上的私股交易偶尔为员工和早期投资者提供流动性，但当前经审计的财务桥接数据仍未见公开披露。
            claimRefs:
              - CO006
              - CO007
