              环境，重新定义太阳能项目开发生命周期。平台服务三类主要运营用户：负责组织数据库参数和公用事业定价设置的 Aurora Admin；在互动式 Sales Mode 中生成面向消费者方案的销售代表；以及在
              Design Mode 中构建工程级系统的 Solar Designer。商业上，Aurora 将软件打包进 Build、Grow、Scale 和自助式方案，并辅以 Expert Design
