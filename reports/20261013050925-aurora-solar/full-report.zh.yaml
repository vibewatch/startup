      - number: '5.2'
        title: 太阳能安装商工作流转型与可量化运营影响
        blocks:
          - type: paragraph
            body: >-
              在住宅太阳能承包商组织中，Aurora 把技术尽调从昂贵的实体屋顶拜访转为远程数字评估，彻底改变了运营方式。过去，承包商需要派测量技术员现场测量屋顶面、坡度和障碍物边界，承担大量软成本。借助远程 LiDAR
              高程数据和高清航拍影像，Aurora 让工程团队无需车辆出动即可构建可融资的 3D 现场模型，使约 20% 的项目不再需要重复现场勘测，每次避免的访问预计节省 $150 至
              $300。独立承包商部署记录显示，设计周转时间最多缩短 70%；采用 Aurora 标准化工作流后，方案到安装的变更单从 40% 降至 10%。因此，美国排名前 100 的住宅太阳能承包商中超过 70% 已采用
              Aurora，但运营成效仍取决于目标辖区是否有高分辨率地理空间影像。
