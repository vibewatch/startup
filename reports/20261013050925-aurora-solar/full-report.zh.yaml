            body: >-
              Aurora Solar 若要通过 IPO 或战略收购实现流动性，必须证明其增长足够持久，并与周期性的美国住宅太阳能安装量脱钩。在当前市场，合格的 IPO 候选公司应有正向自由现金流、超过 70% 的 GAAP
              毛利率，以及高于 110% 的净收入留存率。能源科技或 CAD 软件生态中的战略收购方，可能包括企业软件供应商或清洁能源集团；但按当前 $4.0 billion
              基准估值交易似乎难以承受。会迫使建议降为回避的明确论点破坏触发器包括：美国安装商破产加速、市场份额被 SurgePV 或 OpenSolar
              等竞争工具蚕食，或采用激进高级优先权结构的下轮融资。关键验证性尽调应获取经审计的 2024–2026 年损益表、客户 cohort 留存表，以及保密的 409A 估值记录。
