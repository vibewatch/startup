      - number: '2.3'
        title: 买方分层、用户画像与采购归属
        blocks:
          - type: paragraph
            body: >-
              太阳能软件的采购机制和预算归属，会因组织规模和市场进入方式而显著不同。Aurora 围绕三类核心用户构建平台：管理数据库设置和公用事业费率目录的系统管理员；在 Sales Mode 中利用互动式 3D
              可视化向屋主推介方案的销售代表；以及在专业 CAD 环境中核验电气串联和 NEC
              合规性的设计工程师。对于中小型住宅承包商，软件预算通常由企业主或销售副总裁掌握，驱动力是缩短获客周期并取消上门车辆出动。在区域和企业级 EPC 中，采购会转到运营副总裁和 CTO 角色，他们购买
              Build、Grow、Scale 企业套餐，或协商超过 $15,000 的定制年约，再通过 Sync APIs 和 Design APIs 将 Aurora
              接入中央数据架构。在这些企业客户中，销售领导层已展现商业议价能力，部分情况下能以预测 ARR 的数倍完成企业客户扩张；但小型承包商常因按席位定价和单项增购而承受预算摩擦。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 增长驱动、监管动态与市场约束
        blocks:
          - type: paragraph
            body: >-
              自动化太阳能软件受到长期结构性驱动的加速，同时也要应对短期剧烈的政策波动。宏观层面，全球净零排放承诺、地方清洁能源强制要求，以及联邦 Inflation Reduction Act
              延长清洁能源税收抵免，为分布式太阳能部署提供基础支持。此外，Aurora 自有的全球公用事业费率数据库覆盖超过 3,000 家公用事业公司和 17,000
              个电费标准，在复杂的分时（TOU）计费结构下形成显著分析壁垒。然而，安装商价值链的采用瓶颈依然严重。2026 Aurora Solar Snapshot 的行业调查数据指出，继 One Big Beautiful
              Bill（OBBB）等重大联邦立法变化，以及现金和贷款系统的住宅清洁能源税收抵免（Section 25D）到期后，客户成本冲击和融资波动已成为屋主转化的主要障碍。由于 Aurora
              的能力止于数字合同签署，且没有集成 CRM，安装商面临软件栈割裂，小型承包商不得不评估统一的低成本替代方案，否则就要承受利润率压缩。
            claimRefs:
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 软成本压缩是核心软件方向
            body: 光伏硬件组件过去十年降价 90%，软成本如今占住宅项目总支出的 60% 至 70%。能压缩客户获取、现场评估和工程方案审查的软件平台，靠守住承包商利润率获取持久价值。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
          - type: callout
            title: 激励到期后的政策冲击与软件栈割裂
            body: Section 25D 税收抵免到期，加上消费者借贷成本上升，给住宅承包商带来更大的转化阻力。在销售摩擦加剧的环境下，Aurora 较高的按席位定价和缺少原生 CRM，使安装商暴露于软件栈成本通胀。
            calloutType: risk
            claimRefs:
              - CM008
              - CM014
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与买方任务
        blocks:
          - type: paragraph
            body: >-
              Aurora 面对的不止一种软件品类。对高产量美国住宅安装商而言，直接竞争发生在一体化设计与销售平台之间；对融资驱动或工程主导的项目，PVsyst
              等专业收益工具可能仍是必需的配套，而非完全替代品。商业设计工具、供应商自称的一体化替代方案、内部工作流和割裂的点工具栈，都只覆盖同一买方任务的某一部分。Aurora
              最有证据支撑的定位优势是覆盖面：独立描述涵盖远程现场建模、系统设计、性能模拟、融资分析和方案，官方材料还增加了企业控制、API、图纸集和合同工作流。竞争对手画像表有意只作代表性展示而非穷尽，因为当前证据池无法确定任何竞争对手的市场份额、融资或当前规模。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP009
              - CP011
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
