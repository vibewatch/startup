  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议框架
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar 是太阳能设计与销售赋能软件的头部品类公司，已为超过 7,000 家安装商组织完成超过 20 million 个项目设计。核心投资论点在于：平台自有计算机视觉、经 NREL
              验证的阴影引擎和一体化 CAD 工作流，能缩短屋顶设计周期，加快住宅销售转化。但反向论点也很清楚：Aurora
              的主要收入引擎仍紧紧绑定波动的美国住宅太阳能安装商市场，近期联邦激励政策变化和高昂客户软成本持续构成逆风。此外，公司缺少自动生成单线图的能力，限制了商业 EPC；产品又以美国净计量和 NEC
              标准为前提，国际采用因此受限。公司 2022 年最后一轮公开融资估值 $4.0 billion 对应约 25x–40x ARR 的高峰市场倍数；结合当前基本面，建议继续研究，风险评级为高，估值偏贵。
