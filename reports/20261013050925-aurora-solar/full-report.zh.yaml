  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价打包与变现架构
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar 主要通过企业版和自助式 SaaS 订阅创收，覆盖云端太阳能计算机辅助设计（CAD）、销售方案生成和工作流自动化。根据官方客户支持文档，Aurora 将软件许可分为 Build、Grow
              和 Scale 多个套餐，并辅以自助式 Foundation、Basic 和 Premium 方案。软件架构把功能拆进专门的运营工作流：核心 Design Mode 负责高保真 3D 建模和 LIDAR
              阴影分析，Sales Mode 则提供面向客户的演示工具，帮助直接与业主签约。第三方行业定价分析显示，Aurora 采用无公开价目表的报价制商业模式，设计席位通常为每位用户每月 $159 至 $259（年费
              $1,908 至 $3,108）。除基础席位订阅外，公司还通过单独许可的 Aurora AI（自动 3D 现场建模）和 Sales Mode 模块，以及面向外勤勘察员、功能受限的 Lite Mode
              席位变现。公司进一步通过按使用量计费的增购服务获得使用和交易收入，包括用于市政许可的按需 Plan Sets、外包 3D 屋顶建模的 Expert Design Services，以及用于企业自动化工作流的
              Design 和 Sync APIs。
