figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 从 2013 年成立到 2026 年企业平台规模化的公司与产品里程碑时间顺序。
    data:
      items:
        - label: 2013 - 公司成立
          detail: Christopher Hopper 和 Samuel Adeyemo 在旧金山创立 Aurora Solar，旨在自动化太阳能屋顶设计。
          tone: positive
        - label: 2014 - 种子资本
          detail: 获得 Pear VC 领投的种子资金，用于开发云端三维 CAD 建模和辐照度引擎。
          tone: positive
        - label: 2019 - A 轮扩张
          detail: 获得 Energize Capital 领投的 $23.5M A 轮融资，扩大工程团队和产品功能。
          tone: positive
        - label: 2020 - B 轮规模化
          detail: 完成 ICONIQ Growth 领投的 $50M B 轮融资，扩大运营并加快计算机视觉工具开发。
          tone: positive
        - label: 2021 - C 轮与收购 Folsom Labs
          detail: Coatue 领投 $250M C 轮融资，估值达到 $2B；收购 Folsom Labs（HelioScope），进入商业太阳能市场。
          tone: positive
        - label: 2022 - D 轮与 $4B 基准
          detail: Coatue 和 Energize Capital 联合领投 $200M D 轮融资，投后估值达到 $4B。
          tone: positive
        - label: 2024 - 运营成熟
          detail: 扩大自动化 Plan Sets Service 和 AI Mode 工作流，为数百万个住宅项目提供支持。
          tone: neutral
        - label: 2026 - 企业规模与多产品深度
          detail: 活跃客户组织超过 7,000 家，同时应对美国净计量监管调整。
          tone: neutral
    approximationNotes: 里程碑时间线反映已公布的公司融资日期、重大收购和已报告的平台规模里程碑。
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO007
      - CO009
      - CO012
  - id: FM001
    title: 市场规模与可触达性金字塔
    type: pyramid
    summary: 从广泛的太阳能软成本支出逐层收窄至 Aurora 核心国内住宅设计覆盖面的分层可触达市场。
    data:
      items:
        - label: 全球太阳能软成本（$100B 以上行业）
          value: $60B-$70B
          detail: 非硬件安装、客户获取、许可和融资等软成本，占全球太阳能支出的 60-70%。
        - label: 全球太阳能软件 TAM（2025 年预测）
          value: $19.0B
          detail: Energize Ventures 估算的全球光伏部署软件解决方案预计总可服务市场。
        - label: 美国太阳能软件 TAM（2025 年预测）
          value: $3.0B
          detail: 覆盖美国住宅、商业和公用事业级太阳能项目工作流的预计可触达软件市场。
        - label: 美国住宅软成本可触达机会
          value: $1.5B-$2.0B
          detail: 设计自动化、遮挡模拟和许可计划集生成直接瞄准的国内施工前支出。
        - label: 核心远程设计、遮挡与销售 SAM
          value: $400M-$500M
          detail: 美国住宅太阳能安装商及专业销售团队可触达的 SaaS 和信贷支出。
        - label: Aurora Solar 规模覆盖面（2022-2023 年已实现）
          value: $145M-$170M
          detail: 预计年度订阅和平台收入覆盖 7,000 多家客户组织及已设计的 10M+ 个项目。
    approximationNotes: 全球和美国市场规模数字反映 Energize Ventures 的自上而下风险投资预测，以及 Manhattan Venture Research 和 Sacra 的研究汇编；公司层面收入为第三方分析师估算。
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
  - id: FP001
    title: 按工作流广度与专业适配度的竞争定位
    type: quadrant
    summary: 方向性的序数图，描述留存证据如何刻画各替代方案，而非衡量市场排名。
    data:
      points:
        - label: Aurora Solar
          x: 5
          'y': 5
          detail: 覆盖远程设计到销售的广泛工作流；有最强证据支持的适配场景是美国住宅市场。
        - label: PVsyst
          x: 2
          'y': 5
          detail: 工作流覆盖较窄；竞争对手资料认为它适合专业审查可融资发电量。
        - label: SurgePV
          x: 4
          'y': 3
          detail: 发行方声称覆盖一体化设计、仿真、制图和提案；没有独立适配度证据。
        - label: HelioScope
          x: 2
          'y': 4
          detail: 竞争对手资料认为其适合商业布局和发电量报告；主要证据缺失。
        - label: 内部 / 人工
          x: 1
          'y': 2
          detail: 狭窄而定制化的工作流，在项目量较低时仍可能可行。
        - label: 点工具栈
