      - number: '1.4'
        title: 运营规模、市场里程碑与结构性约束
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar 的运营版图已从早期住宅 CAD 工具扩展为行业级工作流基础设施，为超过 7,000 家太阳能企业提供支持，从本地承包商到全国安装网络均涵盖其中。平台迄今已处理 10 million 至
              20 million 个项目设计，每月支持数十万次太阳能现场评估。2021 年，公司战略收购 HelioScope 创始公司 Folsom Labs，这是一个关键里程碑，使 Aurora
              的产品组合从住宅屋顶延伸到工商业太阳能阵列工程。

              尽管成绩显著，Aurora 仍面临新的商业和结构性逆风。软件采用按报价、按席位许可的商业模式，核心设计席位通常为每位用户每月 $159 至 $259，Sales Mode 和 AI Mode
              等关键模块另行收费。这种打包方式显著增加了小型安装团队和季节性劳动力的成本。此外，平台的财务计算、激励库和工程规则引擎高度针对美国 National Electrical Code
              标准及零售净计量框架定制。在太阳能经济性取决于上网电价、当地电网规范或州补贴的国际市场，软件原生适配度大幅下降，承包商不得不在平台外自行完成财务核算。
            claimRefs:
              - CO005
              - CO009
              - CO011
              - CO012
