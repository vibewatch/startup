  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险敞口
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar 的平台防御力和核心工作流集成，与美国能源政策、公用事业电价结构及地方市政许可标准深度交织。进入 2026 年的宏观经济环境在重大联邦立法通过、Section 25D
              现金及贷款住宅安装投资税收抵免随后到期后明显失稳。激励退坡造成住宅安装商需求剧烈波动，引发安装取消和严重成本冲击。监管与电价层面，Aurora 的核心财务及收益引擎高度针对北美标准调校，具体包括 National
              Electrical Code（NEC 690）电气要求，以及加利福尼亚净计费电价（NEM
              3.0）避免成本计算器的小时级外送电量估值。这种区域深度在国内安装商渠道形成较强黏性，却也构成进入欧洲或亚洲市场的结构性障碍，因为这些市场的上网电价、地方技术规范和政府补贴机制并不符合美国设计范式。此外，市政建筑部门执行碎片化的地方许可规则；Aurora
              自动生成的图纸集和 SolarApp+ 兼容性可加快标准辖区的许可审批，但定制工程审查和非标准地方 AHJ 修改仍是承包商持续面临的运营风险。
            claimRefs:
              - CR002
              - CR003
              - CR008
              - CR013
