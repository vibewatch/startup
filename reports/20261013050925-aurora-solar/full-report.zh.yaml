      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar 由 Christopher Hopper 和 Samuel Adeyemo 联合创办，两人在 Stanford University Graduate School of
              Business 就读期间相识。他们最初开发太阳能安装项目时，发现人工 CAD 制图和不准确的阴影估算造成严重运营拖累，于是在 2013 年创办公司，将自动化云端设计软件商业化。Hopper 在 Aurora
              成长期间一直担任 Chief Executive Officer，负责公司融资、组织扩张和企业合作。Adeyemo 在公司早期扩张阶段担任 Chief Revenue
              Officer，建立面向住宅安装商网络的初始市场进入架构和销售打法。

              随着各法律实体的组织规模超过 300 名员工，管理层扩展出负责企业合作、云基础设施、AI 模型训练和客户成功运营的专业高管。日常管理虽然稳定，但关键人物依赖仍集中在 Hopper
              长期领导以及早期技术架构师的组织记忆上。除主要风险投资方代表外，公司董事会委员会分工、独立董事任命和正式治理架构均未公开，使外部治理监督仍是重要的确认性尽调事项。
            claimRefs:
              - CO001
              - CO013
