      - number: '4.2'
        title: GTM 动作、销售效率代理指标与分销渠道经济性
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar
              的市场进入（GTM）动作面向住宅太阳能承包商、商业工程公司（EPC）和机构融资网络。由于客户获取成本（CAC）、回本周期和销售效率比率属于受保护的私有数据，运营效率必须靠工作流代理指标和经核实的渠道合作评估。承包商案例显示，自动设计生成和集成式方案软件将现场评估及方案生成周期从两周压缩到约
              15 分钟，把销售到安装的时间线缩短约 20 天，几乎消除变更单。Aurora 还通过与 Mosaic
              等头部太阳能贷款机构的嵌入式集成加深分销壁垒，让住宅安装商能在销售演示中直接提供即时贷款预审批和定制融资结构。此外，公司在安装商网站部署 Lead Capture AI，使合格数字线索最多增加 4x，并将约
              25% 的网站访客转为可销售线索。通过嵌入覆盖 3,000 多家公用事业公司和 17,000 个全球费率结构的自动费率计算器，Aurora
              把客户对话从系统原始容量转向电费节省、净现值（NPV）和内部收益率（IRR）。
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.3'
        title: 成本结构、毛利率动态与交付经济性
        blocks:
          - type: paragraph
            body: >-
              作为轻资产云软件平台，Aurora Solar 受益于软件毛利率结构，但也面临影响服务交付盈利能力的独特基础设施成本。核心平台高度依赖第三方地理空间影像、航拍 LIDAR 数据集、高清卫星数据流和计算密集型 3D
              光线追踪模拟引擎。实时交付自动阴影模拟和机器学习屋顶重建，需要大量云计算资源及授权数据版税。此外，Aurora 还要承担人工参与的 Expert Design Services 和按需 Plan Set
              制图运营的可变交付成本，其毛利率低于纯软件席位许可。行业研究显示，传统住宅太阳能设计需要车辆上门和人工测量屋顶，而 Aurora 的远程评估为承包商消除了实体劳动费用。不过，Aurora
              自身成本结构仍暴露于不断上升的地理空间数据供应商费用和 GPU 计算成本。由于公开文件没有披露毛利率、研发分配和 G&A 管理费用，核实云基础设施单位成本仍是首要投资判断尽调要求。
            claimRefs:
              - CI001
              - CI006
              - CI012
              - CI015
