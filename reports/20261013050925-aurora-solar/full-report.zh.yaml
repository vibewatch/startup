        blocks:
          - type: paragraph
            body: >-
              Aurora 的核心技术栈整合地理空间数据摄取、计算机视觉算法和计算物理模拟。数据层摄取 LiDAR
              点云及高分辨率航拍影像，用于建模地形化屋顶面和障碍物。专有机器学习算法自动识别树木、绘制树冠边界并计算阴影影响，耗时约 15 秒，而历史人工制图需要 5-to-10 分钟。计算物理引擎经 National
              Renewable Energy Laboratory（NREL）验证，后者确认 Aurora 的辐照度计算在统计上等同于实体现场阴影工具测量。此外，Aurora
              还对组件级电气物理进行建模，纳入旁路二极管位置和电池串优化器行为，以准确预测部分遮阴条件下的系统输出。不过，运行这些细致的 3D CAD 模拟会给客户端带来较重的计算需求；软件对美国 National
              Electrical Code（NEC）规则和净计量电价的结构性依赖，也限制了其在国际市场的开箱即用效果。
