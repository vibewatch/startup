          detail: "Narrow, bespoke workflow that can remain viable when project volume is low."
        - label: "Point-tool stack"
          x: 3
          y: 3
          detail: "Potential specialist depth across tools, offset by handoffs and multiple licenses."
    approximationNotes: >-
      Analyst-coded ordinal scores, not market measurements. X is workflow breadth from 1 (single or
      manual step) to 5 (integrated end-to-end suite); Y is fit for the source-described primary job
      from 1 (weak) to 5 (strong). Scores use only retained descriptions and do not infer unknown
      capabilities, adoption, or accuracy.
    claimRefs: ["CP007", "CP009", "CP012", "CP013", "CP014", "CP015"]
