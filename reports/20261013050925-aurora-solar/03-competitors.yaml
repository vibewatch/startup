    body: >-
      Aurora combines remote design, sales presentation, enterprise administration, APIs, contracts,
      and permitting services in one documented workflow, raising the operational burden of replacing
      the suite module by module.
    claimRefs: ["CP002", "CP003", "CP004", "CP012", "CP013"]
