company:
  name: "Aurora Solar"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Aurora's defensible position is the breadth of its residential solar workflow, from remote
    modeling through proposals, enterprise controls, and downstream services. The assigned evidence
    also exposes a material underwriting limit: current pricing, competitor scale, win rates, and
    switching outcomes are not independently verified, while the strongest displacement claims come
    from vendors selling alternatives.
sections:
  - id: "landscape-and-buyer-jobs"
    title: "Landscape and buyer jobs"
    body: >-
      Aurora competes against more than one software category. For high-volume US residential
      installers, the direct contest is between integrated design-and-sales platforms; for financed
      or engineering-led projects, specialist yield tools such as PVsyst can remain a required
      companion rather than a clean substitute. Commercial design tools, vendor-claimed integrated
      alternatives, internal workflows, and fragmented point-tool stacks address narrower slices of
      the same buyer job. Aurora's strongest evidence-backed positioning is breadth: independent
      descriptions cover remote site modeling, system design, performance simulation, financing
      analysis, and proposals, while official materials add enterprise controls, APIs, plan sets, and
      contract workflows. The profile table is deliberately representative rather than exhaustive
      because the assigned pool does not establish market share, funding, or current scale for any
      competitor.
    claimRefs: ["CP001", "CP002", "CP007", "CP009", "CP011", "CP015"]
    tableRefs: ["TP001"]
    figureRefs: ["FP001"]
  - id: "capability-and-trust"
    title: "Capability, trust, and workflow fit"
    body: >-
      Aurora's differentiation is clearest where remote residential design must become a customer
      proposal quickly. Company materials describe 3D visualization, irradiance analysis, financial
      modeling, role-specific workflows, and enterprise administration; third-party summaries also
      describe an end-to-end design-and-sales product. That breadth does not prove superiority in
      every segment. Two competitor-issued reviews distinguish Aurora's residential sales strength
      from bankable yield work and commercial engineering, but their commercial interests require
      cautious weighting. The capability matrix therefore separates supported features from unknown
      cells and avoids converting vendor comparisons into independent benchmarks. Procurement should
      test output quality on the same projects and verify which finance partners, authorities, and
      internal users actually require each tool.
    claimRefs: ["CP001", "CP002", "CP003", "CP004", "CP007", "CP009", "CP011", "CP014"]
    tableRefs: ["TP002"]
  - id: "pricing-distribution-and-lock-in"
    title: "Pricing, distribution, and lock-in"
    body: >-
      The pricing evidence is directionally useful but not decision-grade. Aurora's current help page
      names Build, Grow, and Scale plans without publishing prices in the retrieved text. An archived
      directory page lists older monthly Basic and Premium prices, while two vendors selling
      alternatives repeat a 2026 annual seat range and explicitly say Aurora is quote-based. Those
      figures should not be treated as realized contract pricing. Workflow breadth can create
      switching cost through trained Admin, Sales, and Designer roles, synchronized systems, custom
      permissions, SSO, proposals, contracts, and permitting services. This is an inference about
      integration depth, not measured retention. A buyer should compare total seat mix, add-ons,
      migration effort, and acceptance requirements using current written quotes and project-level
      trials.
    claimRefs: ["CP003", "CP005", "CP006", "CP008", "CP010", "CP012", "CP013", "CP014"]
    tableRefs: ["TP003"]
  - id: "moat-durability-and-diligence"
    title: "Moat durability and displacement risk"
    body: >-
      Aurora's moat appears operational rather than absolute: integrated workflows, accumulated user
      training, enterprise controls, and a polished residential sales experience can make replacement
      costly, but specialist tools and lower-priced vendor-claimed bundles can pressure individual
      modules. Internal processes and point solutions also remain viable for low-volume buyers whose
      constraint is not design throughput. The retained evidence does not quantify multi-homing,
      renewal behavior, migration costs, channel influence, or win-loss performance. It also does not
      independently validate competitor prices or comparative accuracy. These omissions matter
      because a broad suite is durable only if customers use enough modules to offset seat cost and
      if finance, engineering, and regulatory stakeholders accept its outputs. Contract, telemetry,
      and reference-call diligence are therefore necessary before assigning a durable competitive
      premium.
    claimRefs: ["CP007", "CP009", "CP012", "CP013", "CP014", "CP015"]
