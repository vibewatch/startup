  title: "Risks"
  summary: "Comprehensive diligence evaluation of Aurora Solar's regulatory, operational, partner dependency, and financial model risks following federal tax incentive expiration and market normalization."
sections:
  - id: "regulatory-legal-exposure"
    title: "Regulatory and Legal Exposure"
    body: "Aurora Solar's platform defensibility and core workflow integration are deeply intertwined with United States energy policy, utility tariff structures, and local municipal permitting standards. The macroeconomic environment entering 2026 has been significantly destabilized following the passage of major federal legislation and the subsequent expiration of the Section 25D Investment Tax Credit for cash and loan residential installations. This incentive sunset created acute demand volatility across residential installers, triggering installation cancellations and severe cost shocks. On the regulatory and tariff front, Aurora's core financial and yield engines are heavily tuned to North American standards, specifically National Electrical Code (NEC 690) electrical requirements and net metering structures such as California's Net Billing Tariff (NEM 3.0) Avoided Cost Calculator hourly export valuations. While this regional depth creates substantial stickiness within domestic installer channels, it presents a structural barrier to international expansion into European or Asian markets where feed-in tariffs, local technical codes, and government subsidy mechanisms do not conform to US design paradigms. Furthermore, municipal building departments enforce fragmented local permitting rules; while Aurora's auto-generated plan sets and SolarApp+ compatibility expedite permitting approvals across standard jurisdictions, custom engineering reviews and non-standard local AHJ amendments continue to represent persistent operational exposure for contractors."
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR008"
      - "CR013"
    tableRefs:
      - "TR001"
  - id: "operational-data-quality"
    title: "Operational and Data Quality Risks"
    body: "Operational reliability in remote solar engineering relies on high-resolution spatial datasets and simulation accuracy. Aurora's rooftop reconstruction engine leverages USGS 3DEP public elevation models alongside private commercial aerial feeds, achieving an estimated 95% coverage across US suburban metropolitan areas. However, coverage degrades to 70% to 80% across rural regions, where unmodeled tree canopies and stale aerial imagery create material risks of manual obstruction misplacement, shading errors, and costly post-sale installation redesigns. To protect against technical production errors, Aurora embeds a simulation engine validated by the National Renewable Energy Laboratory (NREL), establishing statistical equivalence with manual on-site solar pathfinder measurements. Nonetheless, a prevalent operational failure mode occurs within contractor sales organizations: representatives frequently attempt to expedite proposals by using simplified Sales Mode loss factors for municipal permit submissions rather than executing full NREL SAM hourly simulations in Design Mode. Additionally, account governance and access controls present operational friction. Under per-seat monthly subscription models, contractor organizations frequently engage in credential sharing across seasonal sales reps and subcontracted designers, which compromises project auditability and exposes customers to software license compliance friction."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR010"
    tableRefs:
      - "TR002"
  - id: "partner-vendor-dependencies"
    title: "Partner and Vendor Dependencies"
    body: "Aurora Solar's software architecture relies on an interconnected web of external data partners, hardware library maintainers, and cloud compute infrastructure. The most critical upstream dependency centers on third-party aerial spatial data and elevation meshes. Because remote 3D site modeling depends on regular aerial flyovers and high-density LIDAR points, any supplier price increases, API degradation, or latency in urban imagery refreshes immediately degrades proposal turnaround speed. In parallel, Aurora maintains extensive databases spanning more than 3,000 electric utilities and 17,000 global utility rates, alongside comprehensive component libraries covering solar modules, inverters, and storage systems. Stale manufacturer specifications, delayed integration of newly certified smart inverters complying with UL 1741-SB and IEEE 1547-2018 standards, or unexpected utility rate tariff restructurings can generate compounding financial projection inaccuracies for homeowner proposals. Aurora partially mitigates these dependencies by blending public elevation models with commercial imagery vendors, maintaining redundant multi-region cloud services, and offering enterprise APIs that synchronize customer CRM systems, but vendor concentration remains a structural operational reality."
    claimRefs:
      - "CR007"
      - "CR005"
      - "CR003"
    tableRefs:
      - "TR003"
  - id: "financial-model-and-macroeconomic-risks"
    title: "Financial Model and Macroeconomic Headwinds"
    body: "Aurora Solar's commercial positioning reflects a high-growth software valuation navigating a mature and volatile underlying end market. Having secured over $520 million in venture funding with a benchmark Series D valuation mark of $4 billion in 2022, the company must sustain substantial enterprise ARR expansion. However, commercial expansion faces ceiling constraints: Aurora's design and irradiance algorithms are engineered primarily for residential and commercial rooftop applications and are explicitly not accepted as bankable yield assessments for utility-scale solar generation, which overwhelmingly requires PVsyst modeling. Concurrently, Aurora's quote-based per-seat pricing model—frequently cited between $159 and $259 per user per month before a la carte AI Mode and Sales Mode add-ons—creates significant friction for small and mid-sized contractors experiencing volume slowdowns. As installer margins compress under elevated interest rates and diminished federal subsidies, software expenditure becomes a primary target for contractor budget cuts, down-tiering, or migration to lower-cost bundled alternatives. Long-term underwriting must therefore closely monitor installer cohort churn, seat contraction rates, and downstream credit defaults across residential contractor networks."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR009"
      - "CR011"
      - "CR012"
      - "CR014"
    figureRefs:
      - "FR001"
