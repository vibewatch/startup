  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-disclosures
      missingEvidence: Audited 2024-2026 financial statements, exact recurring revenue (ARR), gross margins, cash burn rate, and net revenue retention (NRR) cohorts.
      whyItMatters: Without audited financial figures, operating profitability, capital efficiency, and customer net expansion cannot be verified independently.
      diligencePath: Request confidential financial statements, 2024-2026 management bridge reports, and auditor retention letters under NDA.
      relatedQuestionRefs:
        - QO009
    - type: enumeration-incomplete
      severity: minor
      topic: executive-and-board-composition
      missingEvidence: Complete listing of all corporate officers, independent directors, and formal board of directors committee assignments.
      whyItMatters: Prevents comprehensive underwriting of corporate governance depth, fiduciary oversight, and key-person succession planning.
      diligencePath: Inspect state corporate filings, review minute books, and request full board rosters during formal confirmatory diligence.
