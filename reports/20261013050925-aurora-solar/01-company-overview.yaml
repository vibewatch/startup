callouts:
  - calloutType: insight
    title: Category Leadership Anchored by Soft-Cost Elimination
    body: 'Aurora Solar established its market position by solving the costliest operational bottleneck in US residential solar: physical truck rolls for roof measurements and shading calculations. By pairing NREL-validated irradiance modeling with aerial LIDAR and automated proposal workflows, the platform transitioned solar quoting from a two-week engineering task to a fifteen-minute sales consultation.'
    claimRefs:
      - CO002
      - CO003
      - CO005
  - calloutType: risk
    title: Regulatory Dependency and Packaging Friction
    body: While Aurora Solar commands high customer trust across tier-one US installers, its financial modeling and compliance engines are tightly coupled to US National Electrical Code rules and retail net metering economics. Furthermore, separately licensed add-on modules for Sales Mode and AI Mode alongside seat-based pricing create budget friction for smaller contractor teams and international operators.
    claimRefs:
      - CO004
      - CO011
      - CO012
