company:
  name: Aurora Solar
chapter:
  number: 1
  title: Company Overview
  summary: Aurora Solar is a category-defining solar workflow software platform founded in 2013 that has raised over $520 million, achieving a $4.0 billion Series D valuation while serving more than 7,000 customer organizations. The company automates rooftop site assessment, computer vision 3D modeling, NREL-validated shading analysis, sales proposals, and permitting plan sets, but faces seat-pricing friction, unbundled module packaging, and high structural dependency on US net metering regulatory frameworks.
sections:
  - id: corporate-identity-and-core-platform
    title: Corporate Identity and Core Platform Architecture
    body: |-
      Aurora Solar is a private enterprise software company founded in 2013 and headquartered in San Francisco, California. The company was created to eliminate the extensive soft costs, manual site visits, and operational friction that have historically burdened residential and commercial solar installations across North America. Rather than requiring physical roof climbs to measure slopes and shading, Aurora Solar engineered a cloud-native platform combining aerial imagery, LIDAR datasets, and computational irradiance simulations to model rooftop environments remotely.

      The company's core software platform has expanded from remote drafting into a full end-to-end solar lifecycle operating system. Today, Aurora integrates computer vision site modeling, remote shade calculations, electrical engineering validations, interactive customer proposals, native financing quotes, electronic signature workflows, and Authority Having Jurisdiction (AHJ) plan set generation. Independent technical validations, including studies conducted by the National Renewable Energy Laboratory (NREL), have confirmed that Aurora's shading calculations provide solar access values statistically equivalent to physical on-site measurements. This computational accuracy has made Aurora output widely accepted by financing partners, utility reviewers, and engineering teams, establishing the software as a standard design benchmark across the United States solar industry.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
    tableRefs:
      - TO001
  - id: founding-leadership-and-governance
    title: Founders, Executive Leadership, and Governance
    body: |-
      Aurora Solar was co-founded by Christopher Hopper and Samuel Adeyemo, who met while studying at Stanford University's Graduate School of Business. Their initial experience developing solar installations highlighted the severe operational drag caused by manual CAD drafting and inaccurate shading estimates, leading them to launch the company in 2013 to commercialize automated, cloud-based design software. Hopper has served as Chief Executive Officer throughout Aurora's growth, leading its corporate financing, organizational expansion, and enterprise partnerships. Adeyemo served as Chief Revenue Officer during the company's early expansion, establishing the initial go-to-market structure and sales playbook across residential installer networks.

      As the organization scaled past 300 employees across its legal entities, leadership expanded to include specialized executives managing enterprise partnerships, cloud infrastructure, AI model training, and customer success operations. While day-to-day management is stable, key-person dependency remains concentrated in Hopper's long-standing leadership and the institutional memory of early technical architects. Full corporate board committee assignments, independent directorships, and formal governance structures remain undisclosed outside of primary venture sponsor representation, leaving external governance oversight an important confirmatory diligence item.
    claimRefs:
      - CO001
      - CO013
    tableRefs:
      - TO002
  - id: capitalization-investors-and-valuation
    title: Capitalization History, Investor Syndicate, and Valuation
    body: |-
      Aurora Solar has demonstrated exceptional fundraising traction, securing between $520.4 million and $537 million in cumulative venture and growth equity across seven institutional rounds. After seed financing from Pear VC in 2014, the company accelerated institutional expansion with a $23.5 million Series A in 2019 led by Energize Capital, followed by a $50 million Series B in 2020 led by ICONIQ Growth. In May 2021, technology crossover investor Coatue Management led a $250 million Series C round at a $2.0 billion valuation, underscoring strong institutional conviction in solar digitization.

      In February 2022, Aurora closed its latest equity round, a $200 million Series D co-led by Coatue Management and Energize Capital, establishing a post-money valuation of $4.0 billion. The round included prominent growth and sector-specialist investors such as Fifth Wall, Lux Capital, and Emerson Collective. While historical investor commentary indicated that annual revenue surpassed $100 million in 2022 with rapid year-over-year expansion, the company has not released audited financials for 2024 through 2026. Private share transactions on alternative trading systems like Nasdaq Private Market provide occasional liquidity for employees and early investors, but a current audited financial bridge remains absent from public disclosure.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO010
      - CO014
    tableRefs:
      - TO003
  - id: operational-milestones-and-scale-constraints
    title: Operational Scale, Market Milestones, and Structural Constraints
    body: |-
      Aurora Solar's operational footprint has scaled from an early residential CAD tool to an industry-wide workflow utility powering more than 7,000 solar businesses, from local contracting shops to nationwide installation networks. The platform has processed between 10 million and 20 million project designs to date, supporting hundreds of thousands of solar site evaluations every month. A pivotal milestone occurred in 2021 with the strategic acquisition of Folsom Labs, the creator of HelioScope, which expanded Aurora's product portfolio from residential rooftops into commercial and industrial solar array engineering.

      Despite these notable achievements, Aurora faces emerging commercial and structural headwinds. The software operates on a quote-based, seat-licensed commercial model where core design seats commonly range from $159 to $259 per user per month, with essential modules like Sales Mode and AI Mode billed separately. This packaging structure substantially increases overhead for smaller installation teams and seasonal workforces. Furthermore, the platform's financial calculations, incentive libraries, and engineering rule engines are heavily customized for US National Electrical Code standards and retail net metering frameworks. In international markets where solar economics depend on feed-in tariffs, local grid codes, or state subsidies, the software's native fit diminishes significantly, forcing contractors to perform custom financial reconciliation outside the platform.
    claimRefs:
      - CO005
      - CO009
      - CO011
      - CO012
    figureRefs:
      - FO001
