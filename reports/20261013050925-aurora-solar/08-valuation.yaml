        - "Core software moat is concentrated in US residential rooftop; commercial EPCs still require AutoCAD for electrical SLDs."
        - "Evidence of successful commercial engineering adoption and SLD automation through HelioScope integration."
      - - "Pricing Power & Unit Economics"
        - "Multi-tiered pricing structure ($159-$259/seat/month base plus AI and Sales modes) captures high willingness-to-pay."
        - "Per-seat monthly model scales poorly with fluctuating installer field staff and creates significant evaluation friction."
        - "Customer retention and license seat expansion data during periods of installer margin compression."
      - - "Macro & Regulatory Exposure"
        - "Software automation directly reduces soft costs, positioning Aurora as an essential efficiency tool in changing policy climates."
        - "Market volatility following the expiration of federal solar incentives creates customer contraction and installer insolvencies."
        - "Quarterly design volume trends and installer survival rates following federal policy transitions."
      - - "Capital Structure & Valuation"
        - "Tier-one investor syndicate (Coatue, Energize, ICONIQ) provides brand validation and balance sheet stability."
        - "Series D $4.0B post-money valuation creates severe overhang and negative return skew under normalized multiples."
        - "Clearing prices on private secondary platforms and sponsor willingness to price structured or down rounds."
