callouts:
  - calloutType: "recommendation"
    title: "Valuation Discipline Recommendation"
    body: "Prospective investors should avoid underwriting Aurora Solar at or near its historical $4.0 billion Series D valuation benchmark. In the absence of audited financial statements, verified retention metrics, and transparent cap table preference seniority, capital allocation should be paused or gated on secondary market transactions priced at deep structural discounts (exceeding 60% below the Series D post-money mark)."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV004"
      - "CV014"
  - calloutType: "risk"
    title: "Solar Installer Market Beta Risk"
    body: "Aurora Solar's revenue growth is highly leveraged to the health of the US residential solar installer ecosystem. Following the expiration of federal tax incentives and macroeconomic interest rate pressures, installer insolvencies and workforce reductions pose a direct risk of seat contraction and elevated gross churn that cannot be offset easily by modest software price increases."
    claimRefs:
      - "CV005"
      - "CV007"
      - "CV013"
