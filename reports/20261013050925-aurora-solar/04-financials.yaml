callouts:
  - calloutType: "risk"
    title: "Installer Exposure to Solar Policy Shifts and Seat Contraction"
    body: "Aurora Solar's subscription revenue model is directly exposed to residential solar installation volumes and contractor headcount. The expiration of federal residential clean energy tax credits (Section 25D) at year-end 2025 created widespread customer cost shock and financing volatility across the US solar contractor ecosystem. Because Aurora licenses primarily on a per-seat monthly basis, contractor downsizing and branch consolidations threaten gross revenue retention and expansion seat quotas."
    claimRefs:
      - "CI008"
      - "CI014"
      - "CI015"
  - calloutType: "insight"
    title: "Pricing Model Disconnect Between Headcount and Project Volume"
    body: "Industry analysis highlights a growing tension in Aurora's commercial model: seat-based monthly billing penalizes installers whose staffing fluctuates or who employ seasonal canvassers, while competitors like SurgePV bundle proposal generation into flat-rate multi-user plans. For high-volume regional installers, unbundled fees for AI Mode, Sales Mode, and base CAD create meaningful budget unpredictability, incentivizing account sharing or competitive platform evaluation."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
