companyProfile:
  summary: >-
    Aurora Solar is a late-stage private software company founded in 2013 by Christopher Hopper and Samuel Adeyemo that
    sells a cloud platform for solar design, sales, permitting, and workflow automation. The product is built for US
    residential and commercial solar installers, combining remote site modeling, shading analysis, proposal generation,
    plan sets, APIs, and enterprise controls. Public and third-party sources indicate more than 7,000 customer
    organizations and a prior $4.0 billion Series D valuation, but the company keeps audited financials, retention, and
    cash-flow detail private.
