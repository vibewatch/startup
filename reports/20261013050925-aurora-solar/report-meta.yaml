  topStrengths:
    - Dominant US residential solar workflow breadth spanning design, sales, permitting, APIs, and enterprise controls.
    - Large installed base with more than 7,000 customer organizations and deep installer adoption.
    - Technical moat from remote modeling and NREL-validated shading analysis.
  topRisks:
