  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation Framework
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar represents a premier category leader in solar design and sales enablement software, having
              powered over 20 million project designs across more than 7,000 installer organizations. The core
              investment thesis rests on the platform's proprietary computer vision, NREL-validated shading engine, and
              integrated CAD workflow, which reduce rooftop design timelines and accelerate residential sales
              conversion. However, the investment anti-thesis highlights that Aurora's primary revenue engine remains
              tightly tethered to the volatile US residential solar installer market, where recent federal incentive
              shifts and high customer soft costs create persistent market headwinds. Furthermore, commercial EPC
              capabilities remain constrained by the lack of automated single-line diagram generation, and international
              adoption is limited by product assumptions centered on US net metering and NEC standards. Given that the
              company's last public funding valuation of $4.0 billion in 2022 reflects peak market multiples of
              approximately 25x to 40x ARR, current market fundamentals warrant a research-more recommendation with a
              high risk rating and a stretched valuation stance.
