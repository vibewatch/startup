  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Exposure
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar's platform defensibility and core workflow integration are deeply intertwined with United
              States energy policy, utility tariff structures, and local municipal permitting standards. The
              macroeconomic environment entering 2026 has been significantly destabilized following the passage of major
              federal legislation and the subsequent expiration of the Section 25D Investment Tax Credit for cash and
              loan residential installations. This incentive sunset created acute demand volatility across residential
              installers, triggering installation cancellations and severe cost shocks. On the regulatory and tariff
              front, Aurora's core financial and yield engines are heavily tuned to North American standards,
              specifically National Electrical Code (NEC 690) electrical requirements and net metering structures such
              as California's Net Billing Tariff (NEM 3.0) Avoided Cost Calculator hourly export valuations. While this
              regional depth creates substantial stickiness within domestic installer channels, it presents a structural
              barrier to international expansion into European or Asian markets where feed-in tariffs, local technical
              codes, and government subsidy mechanisms do not conform to US design paradigms. Furthermore, municipal
              building departments enforce fragmented local permitting rules; while Aurora's auto-generated plan sets
              and SolarApp+ compatibility expedite permitting approvals across standard jurisdictions, custom
              engineering reviews and non-standard local AHJ amendments continue to represent persistent operational
              exposure for contractors.
            claimRefs:
