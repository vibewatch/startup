            title: Category Leadership Anchored by Soft-Cost Elimination
            body: >-
              Aurora Solar established its market position by solving the costliest operational bottleneck in US
              residential solar: physical truck rolls for roof measurements and shading calculations. By pairing
              NREL-validated irradiance modeling with aerial LIDAR and automated proposal workflows, the platform
              transitioned solar quoting from a two-week engineering task to a fifteen-minute sales consultation.
            calloutType: insight
            claimRefs:
