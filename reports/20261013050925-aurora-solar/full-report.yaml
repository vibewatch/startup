            body: >-
              Aurora Solar redefines the solar project development lifecycle by collapsing a historically fragmented
              toolchain—previously distributed across separate generic CAD packages, manual shading spreadsheets, and
              disconnected document proposals—into a unified, browser-accessible cloud SaaS environment. The platform
              addresses three primary operational user personas: Aurora Admins who establish organizational database
