          - type: callout
            title: Regulatory Dependency and Packaging Friction
            body: >-
              While Aurora Solar commands high customer trust across tier-one US installers, its financial modeling and
              compliance engines are tightly coupled to US National Electrical Code rules and retail net metering
              economics. Furthermore, separately licensed add-on modules for Sales Mode and AI Mode alongside seat-based
              pricing create budget friction for smaller contractor teams and international operators.
