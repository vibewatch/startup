      - number: '4.4'
        title: Capital Adequacy, Financing Dependency, and Solvency Risks
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar has raised a cumulative total of $523.5 million to $537 million in venture capital and growth
              equity across multiple institutional rounds. The company achieved a $4.0 billion post-money valuation in
              February 2022 upon closing a $200 million Series D round co-led by Coatue Management and Energize Capital,
              alongside ICONIQ Capital, Fifth Wall, Lux Capital, and Emerson Collective. This followed a $250 million
              Series C in May 2021 at a $2.0 billion valuation and a $50 million Series B in November 2020. While the
              significant equity balance sheet provides substantial liquidity cushion, market dynamics shifted sharply
              after the passage of federal energy legislation and the expiration of residential solar tax incentives
              (Section 25D) at year-end 2025. Industry data published in the 2026 Aurora Solar Snapshot confirms that
