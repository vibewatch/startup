    title: Recommendation Summary
    columns:
      - Investment Parameter
      - Assessed Stance
      - Supporting Evidence & Metric
      - Strategic Diligence Implication
    rows:
      - - Recommendation
        - Research-More
        - >-
          Headline $4.0B Series D valuation exceeds verifiable standalone fundamentals; requires audited ARR, NRR, and
          margin data.
        - Withhold unhedged capital deployment pending full financial audit and secondary market clearing disclosure.
      - - Valuation Stance
        - Stretched
        - >-
          Last reported $4.0B Series D mark implies 26x-40x trailing revenue multiple vs prevailing public vertical SaaS
          comps at 6x-10x.
        - >-
          Insist on structured downside protections, liquidation preference parity, or deep secondary discounts before
          entry.
      - - Risk Rating
        - High
        - >-
          Heightened exposure to US residential solar installer market volatility following tax credit transitions and
          policy shifts.
        - Model extreme downside sensitivity to residential solar installer insolvency and seat churn.
      - - Confidence Level
        - Medium
        - >-
          High confidence in technical product moat and residential category leadership; medium confidence in private
          financial metrics.
        - Prioritize independent cap table review and 409A trendline verification during confirmatory diligence.
    notes: Synthesis of primary valuation benchmarks, secondary market data, and diligence findings.
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV014
  - id: TV002
    title: Investment Thesis vs. Anti-Thesis
    columns:
      - Analytical Pillar
      - Core Investment Thesis
      - Counterpoint Anti-Thesis
      - Pivotal Diligence Trigger
    rows:
      - - Market Position & Moat
        - >-
          De facto standard in US residential solar software with 7,000+ customer organizations and 20M+ completed
          designs.
        - >-
          Core software moat is concentrated in US residential rooftop; commercial EPCs still require AutoCAD for
          electrical SLDs.
        - Evidence of successful commercial engineering adoption and SLD automation through HelioScope integration.
      - - Pricing Power & Unit Economics
        - >-
          Multi-tiered pricing structure ($159-$259/seat/month base plus AI and Sales modes) captures high
          willingness-to-pay.
        - >-
          Per-seat monthly model scales poorly with fluctuating installer field staff and creates significant evaluation
          friction.
        - Customer retention and license seat expansion data during periods of installer margin compression.
      - - Macro & Regulatory Exposure
        - >-
          Software automation directly reduces soft costs, positioning Aurora as an essential efficiency tool in
          changing policy climates.
        - >-
          Market volatility following the expiration of federal solar incentives creates customer contraction and
          installer insolvencies.
        - Quarterly design volume trends and installer survival rates following federal policy transitions.
      - - Capital Structure & Valuation
        - Tier-one investor syndicate (Coatue, Energize, ICONIQ) provides brand validation and balance sheet stability.
        - >-
          Series D $4.0B post-money valuation creates severe overhang and negative return skew under normalized
          multiples.
        - Clearing prices on private secondary platforms and sponsor willingness to price structured or down rounds.
    notes: Evaluates core investment thesis pillars against verifiable commercial counter-evidence.
