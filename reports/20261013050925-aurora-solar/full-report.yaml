      - number: '2.3'
        title: Buyer Segmentation, User Archetypes, and Procurement Ownership
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics and budget ownership across solar software vary significantly by organization scale
              and go-to-market structure. Aurora structures its platform around three core user archetypes: system
              administrators who manage database settings and utility rate catalogs; sales representatives who pitch
              homeowners using interactive 3D visualizations in Sales Mode; and design engineers who utilize specialized
              CAD environments to verify electrical stringing and NEC compliance. For small-to-midsize residential
              contractors, the business owner or VP of Sales typically owns the software budget, driven by the urgency
              of shortening customer acquisition cycles and eliminating physical truck rolls. At regional and enterprise
              EPC scales, procurement shifts to VP of Operations and CTO personas who license enterprise tiers (Build,
              Grow, and Scale) or negotiate custom annual commitments exceeding $15,000, integrating Aurora via Sync
              APIs and Design APIs into central data architectures. Within these enterprise accounts, sales leadership
              has demonstrated commercial leverage, in some cases closing enterprise logo expansions at multiples of
              forecasted annual recurring revenue (ARR), although smaller contractors frequently experience budget
              friction from seat-based pricing and a la carte add-ons.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Growth Drivers, Regulatory Dynamics, and Market Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption of automated solar software is accelerated by long-term secular drivers while navigating sharp
              near-term policy volatility. On the macro level, global commitments to net-zero carbon emissions,
              municipal clean energy mandates, and the federal Inflation Reduction Act's extension of clean energy tax
              credits provide baseline support for distributed solar deployment. Furthermore, Aurora's proprietary
              global utility rate database—covering over 3,000 utilities and 17,000 electric tariffs—provides
              significant analytical defensibility under complex time-of-use (TOU) billing structures. Nevertheless,
              severe adoption bottlenecks persist throughout the installer value chain. Trade industry survey data from
              the 2026 Aurora Solar Snapshot highlights that following major federal legislative shifts such as the One
              Big Beautiful Bill (OBBB) and the expiration of residential clean energy tax credits (Section 25D) for
              cash and loan systems, customer Cost Shock and financing volatility have become primary barriers to
              homeowner conversion. Additionally, because Aurora stops at the digital contract signature and lacks
              integrated CRM capabilities, installers face software stack fragmentation, forcing small contractors to
              evaluate unified low-cost alternatives or risk margin compression.
            claimRefs:
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Soft-Cost Compression as the Core Software Vector
            body: >-
              Because photovoltaic hardware modules have undergone a 90% cost reduction over the past decade, soft costs
              now represent 60% to 70% of total residential project expense. Software platforms that compress customer
              acquisition, site assessment, and engineering plan review capture durable value by defending contractor
              margins.
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
          - type: callout
            title: Post-Incentive Policy Shock and Stack Fragmentation
            body: >-
              The expiration of Section 25D tax credits and rising consumer borrowing costs create heightened conversion
              headwinds for residential contractors. In an environment where sales friction escalates, Aurora's premium
              per-seat pricing and lack of native CRM capabilities expose installers to software stack cost inflation.
            calloutType: risk
            claimRefs:
              - CM008
              - CM014
              - CM015
