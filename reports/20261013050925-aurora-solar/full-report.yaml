chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Core Platform Architecture
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar is a private enterprise software company founded in 2013 and headquartered in San Francisco,
              California. The company was created to eliminate the extensive soft costs, manual site visits, and
              operational friction that have historically burdened residential and commercial solar installations across
              North America. Rather than requiring physical roof climbs to measure slopes and shading, Aurora Solar
              engineered a cloud-native platform combining aerial imagery, LIDAR datasets, and computational irradiance
              simulations to model rooftop environments remotely.


              The company's core software platform has expanded from remote drafting into a full end-to-end solar
              lifecycle operating system. Today, Aurora integrates computer vision site modeling, remote shade
              calculations, electrical engineering validations, interactive customer proposals, native financing quotes,
              electronic signature workflows, and Authority Having Jurisdiction (AHJ) plan set generation. Independent
              technical validations, including studies conducted by the National Renewable Energy Laboratory (NREL),
              have confirmed that Aurora's shading calculations provide solar access values statistically equivalent to
              physical on-site measurements. This computational accuracy has made Aurora output widely accepted by
              financing partners, utility reviewers, and engineering teams, establishing the software as a standard
              design benchmark across the United States solar industry.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO010
              - CO013
      - number: '1.2'
        title: Founders, Executive Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar was co-founded by Christopher Hopper and Samuel Adeyemo, who met while studying at Stanford
              University's Graduate School of Business. Their initial experience developing solar installations
              highlighted the severe operational drag caused by manual CAD drafting and inaccurate shading estimates,
              leading them to launch the company in 2013 to commercialize automated, cloud-based design software. Hopper
              has served as Chief Executive Officer throughout Aurora's growth, leading its corporate financing,
              organizational expansion, and enterprise partnerships. Adeyemo served as Chief Revenue Officer during the
              company's early expansion, establishing the initial go-to-market structure and sales playbook across
              residential installer networks.


              As the organization scaled past 300 employees across its legal entities, leadership expanded to include
              specialized executives managing enterprise partnerships, cloud infrastructure, AI model training, and
              customer success operations. While day-to-day management is stable, key-person dependency remains
              concentrated in Hopper's long-standing leadership and the institutional memory of early technical
              architects. Full corporate board committee assignments, independent directorships, and formal governance
              structures remain undisclosed outside of primary venture sponsor representation, leaving external
              governance oversight an important confirmatory diligence item.
            claimRefs:
              - CO001
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO013
      - number: '1.3'
        title: Capitalization History, Investor Syndicate, and Valuation
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar has demonstrated exceptional fundraising traction, securing between $520.4 million and $537
              million in cumulative venture and growth equity across seven institutional rounds. After seed financing
              from Pear VC in 2014, the company accelerated institutional expansion with a $23.5 million Series A in
              2019 led by Energize Capital, followed by a $50 million Series B in 2020 led by ICONIQ Growth. In May
              2021, technology crossover investor Coatue Management led a $250 million Series C round at a $2.0 billion
              valuation, underscoring strong institutional conviction in solar digitization.


              In February 2022, Aurora closed its latest equity round, a $200 million Series D co-led by Coatue
              Management and Energize Capital, establishing a post-money valuation of $4.0 billion. The round included
              prominent growth and sector-specialist investors such as Fifth Wall, Lux Capital, and Emerson Collective.
              While historical investor commentary indicated that annual revenue surpassed $100 million in 2022 with
              rapid year-over-year expansion, the company has not released audited financials for 2024 through 2026.
              Private share transactions on alternative trading systems like Nasdaq Private Market provide occasional
              liquidity for employees and early investors, but a current audited financial bridge remains absent from
              public disclosure.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO010
              - CO014
