        title: Technical Architecture, Computational Physics, and Operating Dependencies
        blocks:
          - type: paragraph
            body: >-
              The core technology stack powering Aurora integrates geospatial data ingestion, computer vision
              algorithms, and computational physics simulations. At the data layer, the platform ingests LiDAR point
              clouds and high-resolution aerial imagery to model topographic roof facets and obstructions. Proprietary
              machine learning algorithms perform automated tree detection, mapping canopy boundaries and calculating
              shade impact in approximately 15 seconds compared to historical 5-to-10 minute manual drafting routines.
              The computational physics engine is validated by the National Renewable Energy Laboratory (NREL), which
              confirmed that Aurora's irradiance calculations achieve statistical equivalence to physical onsite shade
              tool measurements. Furthermore, Aurora models sub-module electrical physics, incorporating bypass diode
              locations and cell-string optimizer behaviors to forecast system output accurately under partial shade.
              However, running these detailed 3D CAD simulations imposes heavy client-side computing demands, and the
              software's structural reliance on U.S. National Electrical Code (NEC) rules and net metering tariffs
