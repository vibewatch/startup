              margins compress under elevated interest rates and diminished federal subsidies, software expenditure
              becomes a primary target for contractor budget cuts, down-tiering, or migration to lower-cost bundled
              alternatives. Long-term underwriting must therefore closely monitor installer cohort churn, seat
