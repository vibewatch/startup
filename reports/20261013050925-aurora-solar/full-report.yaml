      - number: '8.2'
        title: Financing History and Capital Structure Overhang
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar has raised between $520.4 million and $537 million in aggregate venture capital across its
              financing history, culminating in a $200 million Series D round in February 2022 co-led by Coatue
              Management and Energize Ventures that valued the company at $4.0 billion post-money. Earlier institutional
              rounds included a $250 million Series C led by Coatue in May 2021 at a reported $2.0 billion valuation, a
              $50 million Series B led by ICONIQ Capital in November 2020, and a $23.5 million Series A in 2019. While
              pre-IPO broker-dealers and secondary tracking platforms continue to reference the $4.0 billion headline
              valuation, secondary trading liquidity remains highly illiquid with substantial transfer restrictions and
              rights of first refusal. Entering equity positions at or near the 2022 valuation implies significant
              downside risk, particularly because liquidation preference stacks from late-stage capital providers create
              substantial return hurdles before common shareholders or recent secondary investors participate in exit
              gains.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV008
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
