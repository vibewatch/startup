              - CV011
              - CV012
      - number: '8.4'
        title: Exit Readiness, Thesis-Break Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar's path toward liquidity via an initial public offering or strategic acquisition requires
              demonstrating durable growth that is decoupled from cyclical US residential solar installation volumes. A
              viable IPO candidate in the current market must exhibit positive free cash flow, GAAP gross margins
              exceeding 70%, and net revenue retention above 110%. Strategic acquirers in the energy tech or CAD
              software ecosystems could include enterprise software providers or clean energy conglomerates, yet any
              transaction at the current $4.0 billion benchmark appears prohibitive. Clear thesis-break triggers that
              would force a downgrade to an avoid stance include accelerating US installer insolvencies, market share
              erosion to competitive tools like SurgePV or OpenSolar, or a down-round financing with aggressive senior
              preference structures. Key confirmatory diligence priorities include obtaining audited 2024-2026 income
              statements, customer cohort retention schedules, and confidential 409A valuation records.
            claimRefs:
              - CV005
              - CV007
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Discipline Recommendation
            body: >-
              Prospective investors should avoid underwriting Aurora Solar at or near its historical $4.0 billion Series
              D valuation benchmark. In the absence of audited financial statements, verified retention metrics, and
              transparent cap table preference seniority, capital allocation should be paused or gated on secondary
              market transactions priced at deep structural discounts (exceeding 60% below the Series D post-money
              mark).
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV014
          - type: callout
            title: Solar Installer Market Beta Risk
            body: >-
              Aurora Solar's revenue growth is highly leveraged to the health of the US residential solar installer
              ecosystem. Following the expiration of federal tax incentives and macroeconomic interest rate pressures,
              installer insolvencies and workforce reductions pose a direct risk of seat contraction and elevated gross
              churn that cannot be offset easily by modest software price increases.
            calloutType: risk
            claimRefs:
              - CV005
              - CV007
              - CV013
