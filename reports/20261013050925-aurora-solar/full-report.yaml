      - number: '1.4'
        title: Operational Scale, Market Milestones, and Structural Constraints
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar's operational footprint has scaled from an early residential CAD tool to an industry-wide
              workflow utility powering more than 7,000 solar businesses, from local contracting shops to nationwide
              installation networks. The platform has processed between 10 million and 20 million project designs to
              date, supporting hundreds of thousands of solar site evaluations every month. A pivotal milestone occurred
              in 2021 with the strategic acquisition of Folsom Labs, the creator of HelioScope, which expanded Aurora's
              product portfolio from residential rooftops into commercial and industrial solar array engineering.


              Despite these notable achievements, Aurora faces emerging commercial and structural headwinds. The
              software operates on a quote-based, seat-licensed commercial model where core design seats commonly range
              from $159 to $259 per user per month, with essential modules like Sales Mode and AI Mode billed
              separately. This packaging structure substantially increases overhead for smaller installation teams and
              seasonal workforces. Furthermore, the platform's financial calculations, incentive libraries, and
              engineering rule engines are heavily customized for US National Electrical Code standards and retail net
              metering frameworks. In international markets where solar economics depend on feed-in tariffs, local grid
              codes, or state subsidies, the software's native fit diminishes significantly, forcing contractors to
              perform custom financial reconciliation outside the platform.
            claimRefs:
              - CO005
              - CO009
              - CO011
              - CO012
