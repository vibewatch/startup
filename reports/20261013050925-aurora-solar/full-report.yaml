      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Aurora's moat appears operational rather than absolute: integrated workflows, accumulated user training,
              enterprise controls, and a polished residential sales experience can make replacement costly, but
              specialist tools and lower-priced vendor-claimed bundles can pressure individual modules. Internal
              processes and point solutions also remain viable for low-volume buyers whose constraint is not design
              throughput. The retained evidence does not quantify multi-homing, renewal behavior, migration costs,
              channel influence, or win-loss performance. It also does not independently validate competitor prices or
              comparative accuracy. These omissions matter because a broad suite is durable only if customers use enough
              modules to offset seat cost and if finance, engineering, and regulatory stakeholders accept its outputs.
              Contract, telemetry, and reference-call diligence are therefore necessary before assigning a durable
              competitive premium.
