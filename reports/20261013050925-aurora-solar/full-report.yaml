            body: >-
              Aurora competes against more than one software category. For high-volume US residential installers, the
              direct contest is between integrated design-and-sales platforms; for financed or engineering-led projects,
              specialist yield tools such as PVsyst can remain a required companion rather than a clean substitute.
              Commercial design tools, vendor-claimed integrated alternatives, internal workflows, and fragmented
              point-tool stacks address narrower slices of the same buyer job. Aurora's strongest evidence-backed
              positioning is breadth: independent descriptions cover remote site modeling, system design, performance
              simulation, financing analysis, and proposals, while official materials add enterprise controls, APIs,
              plan sets, and contract workflows. The profile table is deliberately representative rather than exhaustive
