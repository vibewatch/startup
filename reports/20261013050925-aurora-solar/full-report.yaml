      - number: '7.3'
        title: Partner and Vendor Dependencies
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar's software architecture relies on an interconnected web of external data partners, hardware
              library maintainers, and cloud compute infrastructure. The most critical upstream dependency centers on
              third-party aerial spatial data and elevation meshes. Because remote 3D site modeling depends on regular
              aerial flyovers and high-density LIDAR points, any supplier price increases, API degradation, or latency
              in urban imagery refreshes immediately degrades proposal turnaround speed. In parallel, Aurora maintains
              extensive databases spanning more than 3,000 electric utilities and 17,000 global utility rates, alongside
              comprehensive component libraries covering solar modules, inverters, and storage systems. Stale
              manufacturer specifications, delayed integration of newly certified smart inverters complying with UL
              1741-SB and IEEE 1547-2018 standards, or unexpected utility rate tariff restructurings can generate
              compounding financial projection inaccuracies for homeowner proposals. Aurora partially mitigates these
              dependencies by blending public elevation models with commercial imagery vendors, maintaining redundant
              multi-region cloud services, and offering enterprise APIs that synchronize customer CRM systems, but
              vendor concentration remains a structural operational reality.
