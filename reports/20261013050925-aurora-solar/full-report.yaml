              - CV009
              - CV010
      - number: '8.3'
        title: Comparative Valuation and Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              Evaluating Aurora Solar's valuation requires comparing its private operating benchmarks against prevailing
              vertical SaaS and energy technology market multiples. Equity research initiation reports and private
              tracking models estimated Aurora's annual revenue at exceeding $100 million with historical growth near
              50%, while current benchmark ARR is estimated around $130 million to $150 million. At a $4.0 billion
              valuation, Aurora commands an implied trailing ARR multiple between 26x and 40x, compared to median public
              vertical software multiples that have compressed to 6x to 10x ARR. In our base-case scenario, assuming
              steady-state ARR of $130 million and a normalized software multiple of 8.0x, Aurora's enterprise value
              calibrates to approximately $1.04 billion, representing an approximate 74% decline from the peak Series D
              mark. Even in a bull-case scenario where ARR reaches $180 million and multiple expansion to 15.0x occurs
              via successful HelioScope commercialization and AI monetization, fair value yields $2.70 billion, still
              below the 2022 preference threshold. In a bear-case scenario reflecting installer contractions and
              customer churn down to $95 million ARR at a 5.0x multiple, enterprise value falls to $475 million.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
