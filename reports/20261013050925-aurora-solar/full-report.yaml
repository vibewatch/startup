      - number: '7.2'
        title: Operational and Data Quality Risks
        blocks:
          - type: paragraph
            body: >-
              Operational reliability in remote solar engineering relies on high-resolution spatial datasets and
              simulation accuracy. Aurora's rooftop reconstruction engine leverages USGS 3DEP public elevation models
              alongside private commercial aerial feeds, achieving an estimated 95% coverage across US suburban
              metropolitan areas. However, coverage degrades to 70% to 80% across rural regions, where unmodeled tree
              canopies and stale aerial imagery create material risks of manual obstruction misplacement, shading
              errors, and costly post-sale installation redesigns. To protect against technical production errors,
              Aurora embeds a simulation engine validated by the National Renewable Energy Laboratory (NREL),
              establishing statistical equivalence with manual on-site solar pathfinder measurements. Nonetheless, a
              prevalent operational failure mode occurs within contractor sales organizations: representatives
              frequently attempt to expedite proposals by using simplified Sales Mode loss factors for municipal permit
              submissions rather than executing full NREL SAM hourly simulations in Design Mode. Additionally, account
              governance and access controls present operational friction. Under per-seat monthly subscription models,
              contractor organizations frequently engage in credential sharing across seasonal sales reps and
              subcontracted designers, which compromises project auditability and exposes customers to software license
              compliance friction.
