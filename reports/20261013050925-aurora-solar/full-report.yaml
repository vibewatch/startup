        - label: 2013 - Company Inception
          detail: Christopher Hopper and Samuel Adeyemo found Aurora Solar in San Francisco to automate solar rooftop design.
          tone: positive
        - label: 2014 - Seed Capital
          detail: Secures seed funding led by Pear VC to develop cloud-based 3D CAD modeling and irradiance engine.
          tone: positive
        - label: 2019 - Series A Expansion
          detail: Raises $23.5M Series A led by Energize Capital to expand engineering and product features.
          tone: positive
        - label: 2020 - Series B Scaling
          detail: Closes $50M Series B led by ICONIQ Growth to scale operations and accelerate computer vision tools.
          tone: positive
        - label: 2021 - Series C & Folsom Labs Acquisition
          detail: >-
            Raises $250M Series C led by Coatue at $2B valuation; acquires Folsom Labs (HelioScope) to enter commercial
            solar.
          tone: positive
        - label: 2022 - Series D & $4B Benchmark
          detail: Raises $200M Series D co-led by Coatue and Energize Capital, establishing a $4B post-money valuation.
          tone: positive
        - label: 2024 - Operational Maturity
          detail: Expands automated Plan Sets Service and AI Mode workflows, powering millions of residential projects.
          tone: neutral
        - label: 2026 - Enterprise Scale & Multi-Product Depth
          detail: Reaches over 7,000 active customer organizations while navigating US net metering regulatory adjustments.
