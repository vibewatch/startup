  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definitions, and Spend Taxonomy
        blocks:
          - type: paragraph
            body: >-
              The market for solar design and project workflow software occupies a critical position within the broader
              $100 billion solar energy ecosystem. While solar photovoltaic hardware expenses have declined by more than
              90% over the past decade, non-hardware soft costs—encompassing customer acquisition, engineering site
              surveys, shading calculations, permitting, and financing coordination—persistently account for 60% to 70%
              of total residential installation expenditures. Aurora Solar positions its cloud platform as a specialized
              design-and-sell engine that directly compresses these pre-construction soft costs, replacing manual
              on-site roof measurements and CAD drafting with computer-vision roof modeling and NREL-validated shading
              simulations. The boundaries of this addressable software spend are strictly delineated: included spend
              comprises SaaS subscriptions, per-project modeling credits, API integration seats, and automated permit
              plan generation. Conversely, post-signature operational spend—including customer relationship management
              (CRM), project management, field construction labor, procurement logistics, and physical asset performance
              monitoring—remains largely outside Aurora's native platform scope, forcing installation businesses to
              assemble fragmented multi-vendor software stacks.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and Realized Footprint'
        blocks:
          - type: paragraph
            body: >-
              Estimating addressable market size for vertical solar software requires contrasting broad top-down venture
              forecasts with bottom-up operational realities. According to estimates by early venture investor Energize
              Ventures cited in institutional equity research, the total addressable market (TAM) for solar software
              will reach $3 billion within the United States and $19 billion internationally by 2025, buoyed by the
              global expansion of photovoltaic generation capacity exceeding 1.2 terawatts. Within this macro envelope,
              the serviceable addressable market (SAM) for dedicated pre-construction design, shade calculation, and
              proposal software represents a narrower subset of approximately $400 million to $500 million in North
              America. Independent equity analysis by Manhattan Venture Research constructed a top-down revenue model
              from Aurora's customer count and tiered subscription pricing ($159 to $259 per user per month), deriving
              estimated annual revenue of $145 million to $181 million for 2022, which closely aligns with third-party
              estimates from Sacra pegging Aurora's 2023 revenue at $170 million following 70% year-over-year expansion.
              However, addressability is constrained by regional regulatory boundaries: because Aurora's simulation
              engine is optimized for the National Electrical Code (NEC) and domestic net metering, international
              adoption faces friction where local utility tariffs and building standards diverge.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
