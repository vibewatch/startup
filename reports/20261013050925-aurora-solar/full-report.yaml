      - number: '4.2'
        title: GTM Motion, Sales Efficiency Proxies, and Distribution Channel Economics
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar's go-to-market (GTM) motion targets residential solar contractors, commercial engineering
              firms (EPCs), and institutional financing networks. Because customer acquisition costs (CAC), payback
              cycles, and sales efficiency ratios are guarded private figures, operational efficiency must be assessed
              through workflow proxies and verified channel partnerships. Contractor case studies highlight that
              automated design generation and integrated proposal software reduce site assessment and proposal
              generation cycles from two weeks to approximately 15 minutes, cutting sales-to-installation timelines by
              roughly 20 days and virtually eliminating change orders. Aurora deepens its distribution moat through
              embedded integrations with top solar lenders such as Mosaic, enabling residential installers to deliver
              instant loan pre-approvals and customized financing structures directly within the sales presentation.
              Furthermore, Aurora deployed Lead Capture AI on installer websites, generating up to a 4x increase in
              qualified digital leads and converting approximately 25% of web visitors into sales-ready prospects. By
              embedding automated rate tariff calculators covering over 3,000 utilities and 17,000 global rate
              structures, Aurora shifts customer conversations from raw system capacity to utility bill savings, net
              present value (NPV), and internal rate of return (IRR).
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.3'
        title: Cost Structure, Gross Margin Dynamics, and Delivery Economics
        blocks:
          - type: paragraph
            body: >-
              As an asset-light cloud software platform, Aurora Solar benefits from software gross margin dynamics but
              faces distinct infrastructure cost drivers that weigh on service-delivery profitability. The core platform
              relies heavily on third-party geospatial imagery, aerial LIDAR datasets, high-definition satellite feeds,
              and compute-intensive 3D ray-tracing simulation engines. Delivering real-time automated shading
              simulations and machine-learning roof reconstructions requires substantial cloud compute and licensed data
              royalties. Additionally, Aurora incurs variable service delivery costs for its human-in-the-loop Expert
              Design Services and on-demand Plan Set drafting operations, which carry lower gross margins than pure
              software seat licenses. Industry research indicates that while traditional residential solar design
              required physical truck rolls and manual roof measurements, Aurora's remote assessment eliminates physical
              labor expenses for contractors. However, Aurora's own cost structure remains exposed to rising geospatial
              data vendor fees and GPU compute costs. With gross margin percentages, R&D allocation, and G&A overhead
              undisclosed in public filings, confirming cloud infrastructure unit costs remains a primary underwriting
              diligence requirement.
            claimRefs:
              - CI001
              - CI006
              - CI012
              - CI015
