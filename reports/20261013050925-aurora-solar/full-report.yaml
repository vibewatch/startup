  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Packaging, and Monetization Architecture
        blocks:
          - type: paragraph
            body: >-
              Aurora Solar generates revenue primarily through enterprise and self-serve SaaS subscriptions for
              cloud-based solar computer-aided design (CAD), sales proposal generation, and workflow automation.
              According to official customer support documentation, Aurora structures its software licensing across
              multiple packaging tiers—specifically Build, Grow, and Scale—supplemented by self-serve Foundation, Basic,
              and Premium plans. The software architecture partitions features into specialized operational workflows:
              core Design Mode handles high-fidelity 3D modeling and LIDAR shading analysis, while Sales Mode provides
              customer-facing presentation tools for closing contracts directly with property owners. Third-party
              industry pricing analysis indicates that Aurora employs a quote-based commercial model without published
              list pricing, with reported design seat costs commonly clustering between $159 and $259 per user per month
              ($1,908 to $3,108 annually). In addition to base seat subscriptions, Aurora monetizes through separately
              licensed add-on modules including Aurora AI (automated 3D site modeling) and Sales Mode, alongside
              restricted-functionality Lite Mode seats targeted at canvassers. The company further captures usage and
              transaction revenue via consumption-based add-ons, including on-demand Plan Sets for municipal permitting,
              Expert Design Services for offloaded 3D roof modeling, and programmatic Design and Sync APIs for automated
              enterprise workflows.
