company:
  name: "Aurora Solar"
chapter:
  number: 6
  title: "Customers"
  summary: "Aurora Solar has established deep customer penetration across US residential solar installers, with public evidence claiming adoption by over 7,000 organizations and 90% of the top 100 US residential solar contractors. However, customer accounts face increasing pricing sensitivity due to quote-based seat packaging ($159–$259/user/month plus unbundled add-ons), while macroeconomic shifts toward third-party ownership and battery storage reshape installer workflows following the expiration of federal solar tax credits."
sections:
  - id: "customer-segmentation-and-buyer-personas"
    title: "Customer Segmentation & Core Buyer Personas"
    body: "Aurora Solar targets three primary operational personas across solar businesses: Aurora Admins configuring organizational settings, Designers operating specialized CAD modeling tools in Design Mode, and Sales professionals pitching proposals via Sales Mode. The customer base spans local regional EPCs and national installers, segmented commercially into self-serve tiers (Foundation, Basic, Premium) and custom enterprise tiers (Build, Grow, Scale). Enterprise tiers package advanced administrative governance, including custom user permissions across Teams, Single Sign-On, Contract Manager for digital deal execution, and programmatic Sync APIs. While high-volume residential contractors drive core seat volume, the platform also serves commercial developers through its HelioScope tool and integrates financing channel partners such as Mosaic."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-market-penetration"
    title: "Adoption Trajectory & Installer Market Penetration"
    body: "Aurora Solar's platform has scaled to more than 7,000 active customer organizations globally, powering over 100,000 solar projects weekly and accumulating more than 20 million project designs worldwide. Industry penetration is heavily concentrated among large US residential solar installers, with independent analyst evaluations indicating that 90% of the top 100 US residential contractors utilize Aurora's platform. However, the adoption environment entered severe turbulence in 2026 following the passage of the One Big Beautiful Bill (OBBB) and the expiration of Section 25D residential solar investment tax credits. Installers face severe homeowner 'cost shock', accelerating a structural pivot where 55% of installers identify third-party ownership (TPO) as their leading financing option and 65% expect TPO to generate more than half of their 2026 sales volume."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
  - id: "named-customer-deployments-and-operational-outcomes"
    title: "Named Customer Deployments & Measurable Outcomes"
    body: "Production deployments demonstrate significant operational velocity improvements alongside notable implementation boundaries. Florida installer SunFarm Energy deployed Lead Capture AI, Aurora AI, Sales Mode, and Contract Manager to scale past 10 megawatts of installations in 2023, achieving a 25% website visitor open-to-lead conversion rate. In California, contractor Solarponics reported eliminating post-sale change orders entirely after adopting Aurora's LIDAR roof modeling and National Electrical Code validation tools. At an infrastructure level, global assurance firm DNV integrated Solcast typical meteorological year weather data into Aurora to deliver bankable irradiance forecasts for residential and commercial systems. Nevertheless, smaller contractors observe friction: the platform requires substantial workstation configurations (4 to 8 GB of RAM) and steep administrative onboarding compared to lightweight alternatives."
    claimRefs:
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "customer-journey-retention-and-expansion-friction"
    title: "Customer Journey, Expansion Loops & Procurement Friction"
    body: "The customer journey begins with top-of-funnel lead generation and progresses through remote site assessment, living-room sales closing, and automated contract generation. Expansion loops operate by upselling additional design seats, AI Mode automation, and on-demand services such as Plan Sets and Expert Design Services. However, customer expansion faces meaningful commercial friction. Aurora relies on quote-based pricing commonly reported at $159 to $259 per user per month, with AI Mode and Sales Mode sold as separate licenses rather than integrated bundles. This per-seat model scales poorly for seasonal or part-time staff, incentivizing unauthorized credential sharing. Furthermore, because Aurora's financial and electrical calculation engines are tightly coupled to US National Electrical Code rules and utility net metering tariffs, international installers outside the US face substantial workflow mismatches."
    claimRefs:
      - "CU013"
      - "CU014"
      - "CU015"
    figureRefs:
      - "FU001"
