company:
  name: "Aurora Solar"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Aurora Solar delivers a cloud-native SaaS and CAD architecture that unifies remote 3D site modeling, NREL-validated shading analysis, and sales proposal generation, eliminating physical truck rolls for over 70% of the top 100 U.S. residential solar contractors. Its computational physics and AI tree-detection engines are protected by 8 utility patents and corroborated by contractor case studies showing up to 70% design time reductions and 75% change-order compression. However, the platform commands premium unbundled per-seat pricing, requires heavy desktop compute for complex 3D rendering, and remains structurally tethered to U.S. National Electrical Code and net metering frameworks that constrain international expansion."
sections:
  - id: "core-platform-definition"
    title: "Platform Definition, Core Capabilities, and Product Packaging"
    body: "Aurora Solar redefines the solar project development lifecycle by collapsing a historically fragmented toolchain—previously distributed across separate generic CAD packages, manual shading spreadsheets, and disconnected document proposals—into a unified, browser-accessible cloud SaaS environment. The platform addresses three primary operational user personas: Aurora Admins who establish organizational database parameters and utility pricing settings, Sales Representatives who operate within an interactive Sales Mode to generate consumer-facing proposals, and Solar Designers who build engineering-grade systems in Design Mode. Commercially, Aurora packages its software across structured tiers including Build, Grow, Scale, and self-serve plans, supplemented by specialized on-demand services such as Expert Design modeling and jurisdiction-compliant Plan Sets. Core automation modules including Aurora AI computer vision and Contract Manager e-signature execution streamline deal flow, while programmatic AutoDesigner workflows and bi-directional CRM data updates are enabled through separately licensed Design API and Sync API endpoints."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE006"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE001"
    figureRefs: []
  - id: "workflow-solutions-impact"
    title: "Solar Installer Workflow Transformation and Quantifiable Operating Impact"
    body: "Across residential solar contracting organizations, Aurora fundamentally alters operating mechanics by shifting technical due diligence from expensive physical roof visits to remote digital assessments. Traditionally, solar contractors incurred substantial soft costs dispatching survey technicians to physically measure roof facets, pitch angles, and obstacle boundaries. Utilizing remote LiDAR elevation data and high-definition aerial imagery, Aurora allows engineering teams to construct bankable 3D site models without truck rolls, eliminating repeat site surveys for approximately 20% of projects and generating estimated operational savings between $150 and $300 per avoided visit. Independent contractor deployments document design turnaround reductions of up to 70%, with proposal-to-installation change orders declining from 40% down to 10% when standardized on Aurora workflows. Consequently, more than 70% of the top 100 U.S. residential solar contractors have adopted Aurora, though operational success remains contingent on high-resolution geospatial imagery availability in targeted geographic jurisdictions."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE007"
      - "CE009"
      - "CE013"
    tableRefs:
      - "TE002"
    figureRefs: []
  - id: "technical-architecture-simulation"
    title: "Technical Architecture, Computational Physics, and Operating Dependencies"
    body: "The core technology stack powering Aurora integrates geospatial data ingestion, computer vision algorithms, and computational physics simulations. At the data layer, the platform ingests LiDAR point clouds and high-resolution aerial imagery to model topographic roof facets and obstructions. Proprietary machine learning algorithms perform automated tree detection, mapping canopy boundaries and calculating shade impact in approximately 15 seconds compared to historical 5-to-10 minute manual drafting routines. The computational physics engine is validated by the National Renewable Energy Laboratory (NREL), which confirmed that Aurora's irradiance calculations achieve statistical equivalence to physical onsite shade tool measurements. Furthermore, Aurora models sub-module electrical physics, incorporating bypass diode locations and cell-string optimizer behaviors to forecast system output accurately under partial shade. However, running these detailed 3D CAD simulations imposes heavy client-side computing demands, and the software's structural reliance on U.S. National Electrical Code (NEC) rules and net metering tariffs limits out-of-the-box efficacy in international markets."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE010"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "ecosystem-security-risks"
    title: "Enterprise Integration, Security Governance, and Technical Diligence Gaps"
    body: "At the enterprise tier, Aurora provides programmatic integration layers and administrative controls tailored to high-volume solar organizations. The Sync API maintains bi-directional synchronization with external CRM databases such as Salesforce, enterprise resource planning platforms, and third-party solar financing providers, while the Design API enables automated background drafting and simulation. Platform governance encompasses single sign-on (SSO) authentication, multi-tenant team segregation, and custom role-based permissions governing project access and editing rights. Despite these technical strengths, key diligence risks persist for institutional evaluators. Aurora commands premium quote-based per-seat pricing with unbundled add-on modules that inflate software costs as teams scale. Moreover, proprietary project file formatting limits interoperability, and external developer community signals remain restricted due to the absence of public open-source SDK repositories or public API telemetry."
    claimRefs:
      - "CE002"
      - "CE011"
      - "CE012"
      - "CE014"
      - "CE015"
    tableRefs: []
    figureRefs: []
