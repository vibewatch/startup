callouts:
  - calloutType: "strength"
    title: "NREL-Validated Shading Engine and Automated Remote Sensing Defensibility"
    body: "Aurora Solar's core technical moat resides in its computational physics and remote sensing pipeline. Combining LiDAR structural modeling, machine-learning tree canopy placement, and an NREL-validated shading engine that matches onsite physical measurement accuracy, the platform eliminates truck rolls and produces bankable solar access values trusted by major solar lenders and financing partners."
    claimRefs:
      - "CE004"
      - "CE006"
      - "CE007"
  - calloutType: "risk"
    title: "International Geographic Friction and Unbundled Per-Seat Software Inflation"
    body: "While dominant in U.S. residential markets, Aurora's technical architecture exhibits geographic and commercial friction. Its utility rate and electrical compliance engines are closely coupled to U.S. National Electrical Code (NEC) rules and net metering tariffs, limiting immediate applicability abroad. Furthermore, separate seat licensing across Design Mode, Sales Mode, and AI add-ons inflates total cost of ownership as contractor teams scale."
    claimRefs:
      - "CE002"
      - "CE014"
      - "CE015"
