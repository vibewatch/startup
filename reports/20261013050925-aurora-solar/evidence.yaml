evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosures
    missingEvidence: >-
      Audited 2024-2026 financial statements, exact recurring revenue (ARR), gross margins, cash burn rate, and net
      revenue retention (NRR) cohorts.
    whyItMatters: >-
      Without audited financial figures, operating profitability, capital efficiency, and customer net expansion cannot
      be verified independently.
    diligencePath: >-
      Request confidential financial statements, 2024-2026 management bridge reports, and auditor retention letters
      under NDA.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: executive-and-board-composition
    missingEvidence: >-
      Complete listing of all corporate officers, independent directors, and formal board of directors committee
      assignments.
    whyItMatters: >-
      Prevents comprehensive underwriting of corporate governance depth, fiduciary oversight, and key-person succession
      planning.
    diligencePath: >-
      Inspect state corporate filings, review minute books, and request full board rosters during formal confirmatory
      diligence.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: cap-table-and-shareholder-breakdown
    missingEvidence: >-
      Detailed cap table including common versus preferred share classes, liquidation preference seniority, and option
      pool allocation.
    whyItMatters: >-
      Precise distribution of proceeds, voting control thresholds, and secondary transaction discounts cannot be
      determined from round press releases.
    diligencePath: Review full capitalization table and investor rights agreements in a secure virtual data room.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: tam-sam-som-reconciliation
    missingEvidence: >-
      Audited, vendor-neutral segmentation of global versus domestic solar software spend distinguishing pure-play
      design tools from full CRM and ERP stacks.
    whyItMatters: >-
      Public TAM figures rely on top-down venture projections ($3B US / $19B international by 2025) that conflate
      vertical CAD software with broad energy management tools.
    diligencePath: >-
      Request customer cohort ARPU breakdowns and third-party analyst bottoms-up market reports from Gartner, Wood
      Mackenzie, or Solar Power Europe.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer adoption
    missingEvidence: Independent current usage by module, active-seat intensity, multi-homing, renewal, churn, and migration data.
    whyItMatters: Workflow breadth is durable only if customers use enough modules and face measurable switching friction.
    diligencePath: >-
      Request anonymized product telemetry, cohort retention, renewal exports, and customer references that have
      evaluated or completed migrations.
    relatedQuestionRefs:
      - QP009
  - type: missing-source
    severity: material
    topic: competitor scale
    missingEvidence: >-
      Primary or independent current competitor funding, revenue, customer scale, pricing, win-rate, and loss-reason
      evidence.
    whyItMatters: Without comparable scale and commercial data, competitive intensity and pricing pressure cannot be underwritten.
    diligencePath: >-
      Obtain current vendor quotes, primary product documentation, financing records, procurement data, and blinded
      win-loss analysis.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: >-
      Audited GAAP income statements, balance sheets, and cash flow statements for 2024 through 2026, including gross
      margin and net cash burn.
    whyItMatters: >-
      Without audited financial statements, investors cannot verify operating leverage, software gross margins, or
      ongoing cash consumption rates.
    diligencePath: >-
      Request audited annual financial statements and current year-to-date trial balances from the company's
