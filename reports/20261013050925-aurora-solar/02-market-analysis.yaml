company:
  name: Aurora Solar
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Aurora Solar operates at the intersection of solar software and soft-cost reduction, targeting an addressable market
    projected by Energize Ventures at $3 billion in the United States and $19 billion internationally by 2025. While
    hardware costs have fallen over 90% in the last decade, non-hardware soft costs still represent 60% to 70% of total
    residential installation expense, creating durable software demand for automated design, shading, and sales
    proposals. However, Aurora's core domestic addressability remains constrained by US-specific electrical code and
    net-metering assumptions, leaving international expansion and commercial adoption as critical but unproven sizing
    frontiers.
sections:
  - id: market-boundary-and-taxonomy
    title: Market Boundary, Category Definitions, and Spend Taxonomy
    body: >-
      The market for solar design and project workflow software occupies a critical position within the broader $100
      billion solar energy ecosystem. While solar photovoltaic hardware expenses have declined by more than 90% over the
      past decade, non-hardware soft costs—encompassing customer acquisition, engineering site surveys, shading
      calculations, permitting, and financing coordination—persistently account for 60% to 70% of total residential
      installation expenditures. Aurora Solar positions its cloud platform as a specialized design-and-sell engine that
      directly compresses these pre-construction soft costs, replacing manual on-site roof measurements and CAD drafting
      with computer-vision roof modeling and NREL-validated shading simulations. The boundaries of this addressable
      software spend are strictly delineated: included spend comprises SaaS subscriptions, per-project modeling credits,
      API integration seats, and automated permit plan generation. Conversely, post-signature operational
      spend—including customer relationship management (CRM), project management, field construction labor, procurement
      logistics, and physical asset performance monitoring—remains largely outside Aurora's native platform scope,
      forcing installation businesses to assemble fragmented multi-vendor software stacks.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
    tableRefs:
      - TM001
  - id: tam-sam-som-sizing-lenses
    title: "Market Sizing Lenses: TAM, SAM, and Realized Footprint"
    body: >-
      Estimating addressable market size for vertical solar software requires contrasting broad top-down venture
      forecasts with bottom-up operational realities. According to estimates by early venture investor Energize Ventures
      cited in institutional equity research, the total addressable market (TAM) for solar software will reach $3
      billion within the United States and $19 billion internationally by 2025, buoyed by the global expansion of
      photovoltaic generation capacity exceeding 1.2 terawatts. Within this macro envelope, the serviceable addressable
      market (SAM) for dedicated pre-construction design, shade calculation, and proposal software represents a narrower
      subset of approximately $400 million to $500 million in North America. Independent equity analysis by Manhattan
      Venture Research constructed a top-down revenue model from Aurora's customer count and tiered subscription pricing
      ($159 to $259 per user per month), deriving estimated annual revenue of $145 million to $181 million for 2022,
      which closely aligns with third-party estimates from Sacra pegging Aurora's 2023 revenue at $170 million following
      70% year-over-year expansion. However, addressability is constrained by regional regulatory boundaries: because
      Aurora's simulation engine is optimized for the National Electrical Code (NEC) and domestic net metering,
      international adoption faces friction where local utility tariffs and building standards diverge.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyer-personas-and-adoption-pathways
    title: Buyer Segmentation, User Archetypes, and Procurement Ownership
    body: >-
      Procurement dynamics and budget ownership across solar software vary significantly by organization scale and
      go-to-market structure. Aurora structures its platform around three core user archetypes: system administrators
      who manage database settings and utility rate catalogs; sales representatives who pitch homeowners using
      interactive 3D visualizations in Sales Mode; and design engineers who utilize specialized CAD environments to
      verify electrical stringing and NEC compliance. For small-to-midsize residential contractors, the business owner
      or VP of Sales typically owns the software budget, driven by the urgency of shortening customer acquisition cycles
      and eliminating physical truck rolls. At regional and enterprise EPC scales, procurement shifts to VP of
      Operations and CTO personas who license enterprise tiers (Build, Grow, and Scale) or negotiate custom annual
      commitments exceeding $15,000, integrating Aurora via Sync APIs and Design APIs into central data architectures.
      Within these enterprise accounts, sales leadership has demonstrated commercial leverage, in some cases closing
      enterprise logo expansions at multiples of forecasted annual recurring revenue (ARR), although smaller contractors
      frequently experience budget friction from seat-based pricing and a la carte add-ons.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM012
    tableRefs:
      - TM003
  - id: growth-drivers-and-adoption-constraints
    title: Growth Drivers, Regulatory Dynamics, and Market Constraints
    body: >-
      Adoption of automated solar software is accelerated by long-term secular drivers while navigating sharp near-term
      policy volatility. On the macro level, global commitments to net-zero carbon emissions, municipal clean energy
      mandates, and the federal Inflation Reduction Act's extension of clean energy tax credits provide baseline support
      for distributed solar deployment. Furthermore, Aurora's proprietary global utility rate database—covering over
      3,000 utilities and 17,000 electric tariffs—provides significant analytical defensibility under complex
      time-of-use (TOU) billing structures. Nevertheless, severe adoption bottlenecks persist throughout the installer
      value chain. Trade industry survey data from the 2026 Aurora Solar Snapshot highlights that following major
      federal legislative shifts such as the One Big Beautiful Bill (OBBB) and the expiration of residential clean
      energy tax credits (Section 25D) for cash and loan systems, customer Cost Shock and financing volatility have
      become primary barriers to homeowner conversion. Additionally, because Aurora stops at the digital contract
      signature and lacks integrated CRM capabilities, installers face software stack fragmentation, forcing small
      contractors to evaluate unified low-cost alternatives or risk margin compression.
    claimRefs:
      - CM013
      - CM014
      - CM015
