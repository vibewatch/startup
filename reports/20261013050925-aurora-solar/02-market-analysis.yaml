callouts:
  - calloutType: insight
    title: Soft-Cost Compression as the Core Software Vector
    body: >-
      Because photovoltaic hardware modules have undergone a 90% cost reduction over the past decade, soft costs now
      represent 60% to 70% of total residential project expense. Software platforms that compress customer acquisition,
      site assessment, and engineering plan review capture durable value by defending contractor margins.
    claimRefs:
      - CM002
      - CM003
  - calloutType: risk
    title: Post-Incentive Policy Shock and Stack Fragmentation
    body: >-
      The expiration of Section 25D tax credits and rising consumer borrowing costs create heightened conversion
      headwinds for residential contractors. In an environment where sales friction escalates, Aurora's premium per-seat
      pricing and lack of native CRM capabilities expose installers to software stack cost inflation.
    claimRefs:
      - CM008
      - CM014
      - CM015
