    title: Market Definition and Spend Scope
    columns:
      - Segment / Category
      - Included Spend
      - Excluded Spend
      - Primary Buyer / Payer
      - Relevance to Aurora
    rows:
      - - Residential Rooftop Solar
        - Aerial 3D modeling, LIDAR shading, Sales Mode proposals, AHJ permit plan sets
        - In-person ladder site surveys, manual AutoCAD drafting, customer CRM, field truck rolls
        - Installer Owner, Head of Sales
        - Core flagship market; accounts for primary revenue and highest platform density
      - - Commercial & Industrial (C&I) Rooftop
        - Multi-megawatt engineering layout, HelioScope flat-roof design, financial analysis
        - Civil site grading, high-voltage interconnection engineering, construction EPC labor
        - VP of Commercial Development, Senior Project Engineer
        - Expanded addressability following the acquisition of Folsom Labs (HelioScope)
      - - Community & Ground-Mount Solar
        - Preliminary feasibility modeling, irradiance mapping, initial layout simulations
        - SCADA telemetry systems, tracker control hardware, transmission interconnection studies
        - Project Developer, Renewable Asset Sponsor
        - Secondary boundary; utilized for preliminary design rather than utility-scale execution
      - - Post-Install Operations & Asset Management
        - API data synchronization into field management systems and contract archive storage
        - Fleet inverter monitoring, O&M truck rolls, customer billing, warranty asset servicing
        - VP of Field Operations, Asset Manager
        - Excluded from core scope; creates operational boundary where installers require separate tooling
    notes: >-
      Taxonomy delineates solar software expenditure boundaries; pre-construction spend represents Aurora's core
      addressable scope while post-sale operational execution requires third-party tooling.
