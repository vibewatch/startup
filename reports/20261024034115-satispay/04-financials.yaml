schemaVersion: "report-v2"
artifact: financials
slug: satispay
runDate: 2026-10-24
company:
  name: Satispay
chapter:
  number: 4
  title: Financials
  summary: >-
    Satispay reports more than €116 million of annualized revenue and growing
    activity across payments, welfare, and investing, but those company-reported
    operating indicators do not establish audited revenue quality, gross margin,
    cash burn, or runway. The proposed 2026 capital increase demonstrates access
    to investor support, not cash already available.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Satispay's core economic model is merchant-funded rather than a consumer
      subscription model. An independent payments review describes merchant fees
      as the main revenue stream, supplemented by premium merchant services and
      value-added features, while a company-data provider labels the model
      "Commission." Corporate welfare adds a second monetization surface, but the
      official disclosure only says meal-voucher commissions have remained below
      the statutory 5% cap; it does not disclose realized commission, partner
      costs, or contribution margin. Satispay also reports same-day processing
      and one-working-day crediting for welfare reimbursements, which may improve
      merchant liquidity but creates an operational-service obligation whose
      funding mechanics are not public. Investing, savings, top-ups, gift cards,
      bill payment, and Pay in 3 broaden the product set, yet the assigned
      evidence does not quantify each stream's revenue recognition or mix.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics
    title: Traction, sales efficiency, and unit economics
    body: >-
      Current public traction is substantial but heterogeneous. Satispay reported
      annualized revenue above €116 million at 31 May 2026 and 80% year-on-year
      growth over the prior two quarters. It also reported 6.5 million users,
      more than 450,000 merchants, €670 million of deposits, €420 million of
      annualized welfare volume, and more than €140 million of invested assets.
      These measures use different denominators: deposits and assets are balances,
      welfare volume is activity, and annualized revenue is not necessarily
      audited LTM revenue or SaaS ARR. The company further says core lines reached
      gross operating profitability net of commercial expenses, but that wording
      does not reveal gross margin, central overhead, incentive spend, provisions,
      or free cash flow. Directional demographic and company-profile sources add
      no CAC, churn, cohort retention, or payback evidence, so distribution scale
      cannot yet be translated into acquisition efficiency.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI014, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      The relevant forward-looking financing fact is the proposed capital
      increase of up to €120 million, not the historical round chronology covered
      in Company Overview. Nearly €60 million was described as covered by
      subscription commitments from existing investors, but the transaction was
      still subject to shareholder consideration and therefore must not be read
      as cash on hand. Stated uses include organic growth, new investment and
      pension products, technology development, added liquidity, and possible
      acquisitions. Those uses imply continued investment across product,
      regulatory, and operating capabilities. Public Luxembourg records identify
      active Satispay entities and a filing history, but the assigned excerpts do
      not expose consolidated cash, debt, earnings, or burn. Without a current
      balance sheet and cash forecast, neither the proposed raise nor prior
      funding establishes runway or the timing of a next financing need.
    claimRefs: [CI011, CI012, CI016]
  - id: financial-verdict
    title: Revenue quality, margin path, and diligence blockers
    body: >-
      The financial verdict is constructive on monetization breadth and network
      activity, but conservative on revenue quality and capital intensity.
      Welfare offers a differentiated merchant proposition: the company reports
      a meal-voucher receipt 60% above ordinary Satispay digital-payment receipts
      at the same point of sale and more than €30 million reimbursed monthly.
      However, company-issued economics are not an independent margin benchmark,
      and the investing expansion still faces the behavioral adoption question
      raised by independent coverage. Historical revenue data also remains
      difficult to compare because one provider labels a 2022 figure as revenue
      while warning that round-linked values may be run-rate or LTM. Underwriting
      therefore requires segment revenue, realized pricing, gross and
      contribution margins, cohort economics, credit losses, cash, burn, debt,
      and a financing-close bridge before reported scale can support a firm
      profitability or runway conclusion.
    claimRefs: [CI002, CI003, CI004, CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns: [Stream, Mechanism, Public status, Quality and diligence ask]
    rows:
      - [Merchant payments, "Merchant fees on an account-linked payment network", "Described as the main revenue stream", "Obtain realized take rate, processing cost, incentives, and refunds"]
      - [Corporate welfare, "Meal vouchers, benefits, reimbursements, and pension tools", "€420M annualized volume reported at May 2026", "Volume is not revenue; obtain commission and contribution margin by product"]
      - [Investing and savings, "Funds, Invested Money Box, and planned stocks and ETFs", ">500,000 users and >€140M invested assets reported", "Assets are not revenue; obtain fee schedule, partner share, and attachment by cohort"]
      - [Value-added and credit, "Top-ups, gift cards, bills, loyalty, and Pay in 3", "Products are active, but revenue mix is undisclosed", "Obtain pricing, credit-loss, funding-cost, and recognition schedules"]
    notes: "Public disclosures mix balances, activity volume, users, and annualized revenue; none is substituted for another metric."
    claimRefs: [CI001, CI005, CI008, CI009, CI010]
  - id: TI002
    title: Pricing and monetization table
    columns: [Product or customer, Public pricing signal, Realized-pricing caveat, Diligence ask]
    rows:
      - [Consumers, "Peer-to-peer exchange is described as free", "Free transfers do not establish economics for other consumer products", "Obtain consumer fees, partner rebates, float treatment, and cross-sell revenue"]
      - [Merchants, "Commission model with merchant fees as the main stream", "No current realized take rate or discount schedule is public", "Obtain contracts by merchant size, channel, geography, and cohort"]
      - [Meal vouchers, "Commission stated by Satispay as below the 5% statutory cap", "Below-cap pricing does not establish net margin", "Obtain realized commission, reimbursement funding, and service-delivery cost"]
      - [Investing and Pay in 3, "Product adoption is disclosed but complete fee terms are not", "Assets and transaction value are not recognized revenue", "Obtain asset fees, partner share, credit losses, and merchant economics"]
    notes: "Pricing signals are public statements, not a complete price book; realized pricing, discounts, and margins remain unavailable."
    claimRefs: [CI001, CI002, CI010]
  - id: TI003
    title: Unit economics table
    columns: [Metric, Public value, Confidence, Why it matters and diligence ask]
    rows:
      - [Annualized revenue, ">€116M at 31 May 2026", "Medium; company-reported through independent coverage", "Reconcile to audited LTM revenue and accounting recognition"]
      - [Revenue growth, "+80% year on year over the prior two quarters", "Medium; company-reported", "Provide monthly values and the base-period denominator"]
      - [Gross operating profitability, "Claimed across core lines, net of commercial expenses", "Medium; definition incomplete", "Reconcile to gross margin, EBITDA, central costs, and free cash flow"]
      - [Distribution, "6.5M users and >450,000 merchants", "Medium; company-reported", "Provide active definitions, transaction cohorts, churn, and acquisition cost"]
      - [Welfare activity, "€420M annualized volume at May 2026", "Medium; company-reported", "Provide net revenue, reimbursement funding, and contribution margin"]
      - [Investment activity, ">500,000 users and >€140M invested assets", "Medium; company-reported", "Provide fee revenue, partner economics, and funded-account retention"]
      - [CAC and payback, null, "Unavailable", "Provide channel and segment CAC, payback, and sales-cycle cohorts"]
      - ["Cash, net burn, and runway", null, "Unavailable", "Provide latest balance sheet, monthly cash bridge, debt schedule, and 24-month forecast"]
    notes: "Null means unavailable, not zero; values retain their reported periods and denominators and are not presented as comparable funnel stages."
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI015, CI016]
