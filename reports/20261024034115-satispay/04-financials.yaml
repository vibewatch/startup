    title: Revenue model bridge
    type: flow
    summary: >-
      Customer and merchant activity can feed several monetization lines, but the
      public evidence does not quantify their conversion into gross profit or cash.
    data:
      nodes:
        - id: network
          label: Consumer and merchant network
          detail: "6.5M users and more than 450,000 merchants reported in 2026"
        - id: payments
          label: Merchant payment activity
          detail: "Merchant fees are described as the main revenue stream"
        - id: welfare
          label: Corporate welfare activity
          detail: "€420M annualized welfare volume reported at May 2026"
        - id: adjacencies
          label: Investing and value-added services
          detail: "Invested assets, top-ups, gift cards, bills, and Pay in 3 expand monetization options"
        - id: annualized-revenue
          label: Annualized revenue
          detail: "More than €116M reported at 31 May 2026"
        - id: profit-and-cash
          label: Gross profit and cash generation
          detail: "Gross margin, net burn, and runway remain undisclosed"
      edges:
        - from: network
          to: payments
        - from: network
          to: welfare
        - from: network
          to: adjacencies
        - from: payments
          to: annualized-revenue
        - from: welfare
          to: annualized-revenue
        - from: adjacencies
          to: annualized-revenue
        - from: annualized-revenue
          to: profit-and-cash
    approximationNotes: "This is a qualitative operating flow, not a proportional waterfall; no conversion rate, revenue share, or margin is inferred."
    claimRefs: [CI001, CI005, CI008, CI009, CI010, CI016]
callouts:
  - calloutType: strength
    title: Operating scale is visible
    body: >-
      Reported annualized revenue, users, merchants, welfare volume, and invested
      assets demonstrate meaningful activity across several monetization surfaces.
    claimRefs: [CI005, CI008, CI009, CI010]
  - calloutType: risk
    title: Financing access is not liquidity
    body: >-
      The proposed €120 million increase and nearly €60 million of subscription
      commitments do not establish transaction closing, cash on hand, burn, or runway.
    claimRefs: [CI011, CI012, CI016]
