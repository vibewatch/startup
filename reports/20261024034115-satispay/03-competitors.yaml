company:
  name: Satispay
chapter:
  number: 3
  title: Competitors
  summary: Satispay competes from a strong Italian two-sided network and a low-friction account-to-account payment proposition, but its moat is less proven outside Italy and its expansion into investing, cards, and welfare puts it directly against larger, better-capitalized fintech and domestic-wallet ecosystems.
sections:
  - id: landscape-and-positions
    title: Competitive landscape and positions
    body: >-
      The relevant landscape is broader than mobile-payment apps. Satispay faces
      card rails and wallets at checkout, domestic schemes such as Bancomat Pay,
      pan-European fintechs such as Revolut and N26, investment-led challengers
      such as Trade Republic, and status-quo bank transfers or cash. Edgar, Dunn
      describes Satispay as an emerging independent network among European
      wallets, while its comparison of the Italian market places Satispay against
      Bancomat Pay and notes that established domestic acceptance remains much
      larger. Satispay's own business surface emphasizes merchant acceptance
      rather than a closed consumer-only wallet. The strategic implication is
      that Satispay must win both merchant distribution and daily consumer
      frequency; a feature checklist alone will not overcome incumbent
      acceptance, trust, or default-wallet advantages.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: differentiation-and-distribution
    title: Differentiation, pricing, and distribution
    body: >-
      Satispay's clearest differentiation is a proprietary, bank-linked network
      with merchant economics designed to be simple at small ticket sizes. The
      current Business page lists no activation fee, no subscription fee, free
      transactions below EUR 10, and a 0.95% charge at or above EUR 10. This is
      a concrete acquisition lever, but it is not proof of realized take rate or
      profitability. Independent coverage also describes a city-by-city
      expansion approach and warns that mobile-payment propositions often have
      similar functionality. The Mastercard launch and investment functionality
      broaden the use case, but also move Satispay into categories where
      Revolut, N26, and Trade Republic already have product presence. Distribution
      through welfare and an installed payments habit could lower cross-sell
      friction; public evidence does not yet establish attachment, retention, or
      payback by product.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002]
  - id: moat-and-displacement
    title: Moat durability and displacement risk
    body: >-
      The moat case rests on accumulated local density and workflow integration,
      not on proprietary functionality that competitors cannot reproduce. Recent
      reporting describes 6.5 million users and 450,000 merchants, while earlier
      independent coverage documented three million consumers and 200,000
      merchants and cautioned that international traction lagged Italy. Those
      figures are from different periods and should not be treated as a verified
      cohort or market-share series. European interoperability initiatives and
      the Digital Markets Act may reduce distribution barriers for alternative
      wallets, but they may also make it easier for better-funded rivals to reach
      the same users. The key underwriting question is whether Satispay's
      merchant density, welfare channel, and daily-use frequency create switching
      costs before pan-European networks or bank-backed schemes commoditize the
      payment layer.
    claimRefs: [CP010, CP011, CP012, CP013]
    tableRefs: [TP003]
  - id: competitor-exhibits
    title: Competitive evidence and limitations
    body: >-
      The comparison below separates observed product or pricing statements from
      unknowns. Public sources in this pool provide useful directional evidence
      on competitor categories and Satispay's positioning, but they do not
      provide a consistent, current, like-for-like dataset for rival pricing,
      active users, contribution margin, or retention. Unknown cells are
      therefore analytical gaps rather than estimates. The positioning figure
      uses ordinal scores solely to make the stated evidence legible: it is not a
      market-share or quality ranking.
    claimRefs: [CP014, CP015]

tables:
  - id: TP001
    title: Competitor profile table
    columns: [Competitor or alternative, Category, Scale or evidence, Target segment, Differentiation, Limitation for Satispay]
    rows:
      - [Satispay, "Independent account-linked network", "6.5m users and 450k merchants reported in 2026 coverage", "Italian consumers, SMEs, employers", "Local density, merchant pricing, welfare and adjacent services", "Cross-border scale and retention by product are not publicly established"]
      - [Bancomat Pay, "Domestic wallet / scheme", "Established Italian domestic acceptance network", "Italian bank customers and merchants", "Bank-linked domestic distribution and scheme familiarity", "Evidence in the pool does not quantify current active users or pricing"]
      - [Revolut, "Pan-European fintech", "More than 52m global customers reported in 2026 coverage", "Digitally active consumers across Europe", "Broad financial app and existing investment capability", "Satispay-specific relative economics and Italian penetration are unknown"]
      - [N26, "Digital bank", "Investment products already available in its banking app", "European retail banking users", "Banking relationship plus integrated investing", "Relative Italian merchant acceptance and fees are unknown"]
      - [Trade Republic, "Investment-led fintech", "Building an Italian user base since 2023", "Younger Italian savers", "Investment-first proposition and market focus", "Payment-network density and merchant distribution are not established"]
      - [Visa and Mastercard, "Global card networks", "Incumbent card rails referenced across the evidence", "Consumers and merchants requiring broad acceptance", "Global acceptance and default payment behavior", "Higher merchant-cost critique is directional; no comparable current fee dataset is retained"]
      - [Status quo, "Cash, bank transfer, and incumbent bank apps", "Still-recognized payment alternatives in Italian commerce", "Price-sensitive consumers and existing bank customers", "Familiarity, existing account relationship, and no new app adoption", "Switching benefit must exceed inertia and trust concerns"]
    notes: "Rows synthesize heterogeneous sources and periods; scale figures are reported values, not a harmonized market-share dataset. Unknown cells are intentionally preserved."
    claimRefs: [CP001, CP002, CP003, CP010, CP014]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, Satispay, Revolut or N26, Domestic wallets, Evidence implication]
    rows:
      - ["Account-linked everyday payments", "Supported through Satispay's independent network", "Supported through fintech accounts; exact rail differs", "Supported by some domestic schemes", "Core capability is not unique; network density and defaults matter"]
      - ["Merchant acceptance", "450k merchants reported; current geographic mix unknown", "No comparable merchant count in the pool", "Domestic acceptance is established but not quantified here", "Satispay has a disclosed local scale signal, not a like-for-like lead"]
      - ["Cards and global acceptance", "Mastercard debit cards launched", "Existing broader banking/card propositions", "Varies by scheme", "Card access narrows a former product gap but adds a partner-dependent layer"]
      - ["Investing", "Stocks, ETFs, and investment products reported", "Revolut and N26 already offer investing; Trade Republic is investment-led", "Generally not evidenced", "Cross-sell convenience competes with specialist depth"]
      - ["Welfare / employer distribution", "Corporate welfare channel reported", "Not evidenced in the assigned sources", "Not evidenced in the assigned sources", "Potential channel advantage, but attachment and economics are unknown"]
      - ["Regulatory and trust posture", "EMI / payment-service posture described by secondary sources", "Regulated-fintech posture varies by product and market", "Bank or scheme trust may be stronger locally", "Licensing is necessary but not a durable differentiation by itself"]
    notes: "The matrix records only capabilities stated or directionally supported by assigned sources; absent rival disclosures remain unknown rather than scored."
    claimRefs: [CP005, CP007, CP008, CP009, CP012]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Provider or alternative, Price or fee disclosed in pool, Included capability, Discount or unknown, Competitive implication]
    rows:
      - [Satispay Business, "Free below EUR 10; 0.95% at or above EUR 10", "Merchant acceptance; no activation fee or subscription fee", "Realized pricing, refunds, and enterprise terms unknown", "Simple small-ticket pricing can support merchant acquisition"]
      - [Satispay investing, "EUR 0.89 per stock or ETF transaction; recurring Vanguard ETF plans free", "Stocks and ETFs in the app", "Assets, spreads, and full schedule unknown", "Convenience competes with specialist investment platforms"]
      - [Revolut, "Not disclosed in assigned sources", "Trading and broad financial-app functions", "Current Italian schedule unknown", "Do not infer a price advantage"]
      - [N26, "Not disclosed in assigned sources", "Banking app with ETF investing", "Current Italian schedule unknown", "Feature overlap is visible; economics are not comparable"]
      - [Trade Republic, "Not disclosed in assigned sources", "Investment-led account and trading", "Current Italian schedule unknown", "Specialist positioning may pressure investment attachment"]
      - [Bancomat Pay, "Not disclosed in assigned sources", "Domestic mobile-payment alternative", "Current Italian schedule unknown", "Domestic distribution is a competitive unknown"]
    notes: "Only Satispay prices are directly retained in the assigned pool. The table must not be read as a realized-revenue, margin, or total-cost comparison."
    claimRefs: [CP005, CP007, CP008, CP015]

figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Satispay is positioned as locally dense and increasingly broad, while pan-European fintechs are broader but not shown with comparable merchant-network evidence in this pool.
    data:
      points:
        - {label: "Satispay", x: 4, y: 4, note: "Local network and adjacent-product breadth are evidenced; cross-border durability remains uncertain."}
        - {label: "Revolut", x: 4, y: 3, note: "Broad financial-app and investing capability are evidenced; comparable merchant-network evidence is absent."}
        - {label: "N26", x: 3, y: 3, note: "Banking-app and investing capability are evidenced; merchant distribution is not comparable in the pool."}
        - {label: "Trade Republic", x: 2, y: 2, note: "Investment focus is evidenced; payments-network breadth is not."}
        - {label: "Bancomat Pay", x: 4, y: 2, note: "Domestic acceptance strength is described; product breadth is not quantified."}
        - {label: "Status quo", x: 1, y: 1, note: "Existing bank and cash habits have familiarity but no disclosed Satispay-specific switching-cost evidence."}
      xAxis: "Breadth of disclosed customer-facing capabilities (ordinal 1-5)"
      yAxis: "Evidence of local payment-network distribution (ordinal 1-5)"
    approximationNotes: "Ordinal coordinates are analyst synthesis of assigned-source descriptions, not measured market shares, quality scores, or a common benchmark."
    claimRefs: [CP001, CP003, CP008, CP010, CP011]

callouts:
  - calloutType: strength
    title: Local network density is the strongest visible moat
    body: "The assigned evidence consistently points to Satispay's merchant-and-consumer network as the core advantage; adjacent products are more defensible when they increase usage of that installed network."
    claimRefs: [CP001, CP002, CP010]
  - calloutType: risk
    title: Product breadth increases direct competitive exposure
    body: "Cards, investing, and welfare expand the addressable relationship but place Satispay against rivals with existing strengths in banking, trading, or pan-European distribution."
    claimRefs: [CP007, CP008, CP009, CP012]
  - calloutType: assumption
    title: Retention and unit economics remain unverified
    body: "No assigned source provides cohort retention, churn, CAC payback, realized merchant take rate, or comparable competitor pricing; these are underwriting gaps, not inferred positives."
    claimRefs: [CP005, CP013, CP015]

