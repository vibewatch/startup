artifact: company-overview
slug: satispay
runDate: 2026-10-24
company:
  name: Satispay
chapter:
  number: 1
  title: Company Overview
  summary: Satispay is a Milan-founded, account-linked payments network that has expanded into welfare and investment products. The latest refresh evidence supports substantial reported scale and a planned 2026 capital raise, but private-company governance, current headcount, and the completed funding outcome remain incompletely disclosed.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: "Satispay was founded in Milan in 2013 by Alberto Dalmasso, Samuele Pinta, and Dario Brignone. Its core proposition is an account-linked payment app for consumers and merchants that operates outside Visa and Mastercard rails, with peer-to-peer transfers and merchant acceptance as the initial use cases. The platform has since added employer welfare, savings and investment products, and buy-now-pay-later. This is a platform expansion rather than evidence that every adjacent product has reached the same scale as payments. Public sources also conflict on launch framing and network size: a partner description says the service launched in 2015 and names more than 200,000 retailers, while newer reporting gives materially higher 2026 figures. The stable identity is therefore the Milan headquarters, 2013 founding date, and payments-first model; current operating metrics should be treated as dated claims rather than a single audited fact."
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founders, leadership and governance
    body: Alberto Dalmasso remains the central publicly identified executive and co-founder, while Samuele Pinta and Dario Brignone are identified as the other founders. The available evidence describes an expanded leadership team with banking, compliance and consumer-technology experience, but it does not provide a current named executive roster or board composition. A 2026 report says existing investors retain confidence in founders who retain a controlling governance role, while a separate report identifies Lightrock partner Umur Hursever as a non-executive director since 2021. This combination suggests meaningful founder influence alongside institutional oversight, but the control mechanics, director list, voting rights, and succession arrangements remain diligence items. Key-person dependence is material because the current evidence repeatedly attributes strategy and product direction to Dalmasso.
    claimRefs: [CO006, CO007, CO008, CO009]
    tableRefs: [TO002]
  - id: funding-and-scale
    title: Funding, valuation and operating scale
    body: Satispay crossed the unicorn threshold with a reported €320 million Series D in September 2022 at a valuation above €1 billion, then raised a reported €60 million in November 2024. Indexed records $501.5 million across eight rounds and identify a $64.3 million November 2024 round, while Multiples records a different private-company data set; these amounts should not be merged without reconciling currency, round classification and database methodology. In June 2026, reporting described a proposed pre-emptive rights offering of up to €120 million, with about half reportedly committed by Addition, Greyhound Capital and Lightrock and a shareholder vote scheduled for June 29. The pool does not establish that the offering closed. Current reported scale includes 6.5 million users, 450,000 merchants, €116 million annualised revenue as of May 31, and €670 million of deposits, but these are media-reported figures rather than audited disclosures in the retained evidence.
    claimRefs: [CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
  - id: milestones-and-gaps
    title: Milestones and unresolved diligence
    body: The operating arc runs from a 2013 founding and payments network to a 2022 unicorn financing, a 2024 follow-on round, 2025 workforce expansion and buy-now-pay-later launch, and 2026 investment-fund expansion. The investment launch is supported by a January 2026 report describing Bond, Balanced and Global Equity funds with Invesco as portfolio manager and Fondaco supervising operations and risk management. Eurofound records a March 2025 expansion announcement that planned 400 hires on top of a workforce of over 700, mainly in Milan and a new Naples office. The principal gaps are the current employee count, completed 2026 financing and cap table, current board and investor rights, audited revenue and profitability, and reconciled user and merchant definitions. These gaps matter because the company is using payments distribution to support products with different regulatory, fiduciary and engagement requirements.
    claimRefs: [CO015, CO016, CO018]
    figureRefs: [FO001]
  - id: exhibits
    title: Exhibits
    body: "The timeline below separates historical milestones from forward-looking or reported events. Dates are retained only where the source provides a publication or announcement date; the June 2026 financing remains a proposed raise in the evidence set. The sequence also shows why the company should not be assessed solely as a payments processor: welfare, investment and credit products add new execution and compliance dependencies. The evidence supports the existence of those launches, but not their contribution to consolidated revenue, retention or cash generation."
    claimRefs: [CO010, CO011, CO015, CO016, CO018]
