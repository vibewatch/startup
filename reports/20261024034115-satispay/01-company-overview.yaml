callouts:
  - calloutType: strength
    title: Payments distribution is the strategic asset
    body: "The retained evidence supports a payments-first network that has added welfare and investment products, giving Satispay an existing consumer and merchant distribution base for adjacencies."
    claimRefs: [CO003, CO004, CO015]
  - calloutType: risk
    title: Scale and financing remain disclosure-sensitive
    body: "The reported 2026 scale and proposed €120 million raise are material, but current valuation, cap table, financing close, revenue quality and active-user definitions are not independently reconciled."
    claimRefs: [CO012, CO013, CO014]
  - calloutType: recommendation
    title: Request governance and KPI verification
    body: "Before relying on the unicorn valuation, obtain the completed financing documents, current cap table, board roster, audited revenue bridge, headcount file and reconciled active-user and merchant cohorts."
    claimRefs: [CO009, CO012]
