      - ["Public or institutional programs", "Program sponsor and recipient", "Food-stamp distribution and related benefits", "TechCrunch reports city-government food-stamp use", "Distribution credibility and volume", "Contract economics and renewal"]
    notes: >-
      Segments are analytical groupings from assigned sources rather than a
      company-reported segmentation. Scale signals use each source's stated date
      and denominator; null gaps mean the assigned pool does not disclose the
      requested customer metric.
    claimRefs: [CU001, CU005, CU006, CU010, CU011, CU012]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date or period, Source basis, Confidence, Implication, Missing denominator]
    rows:
      - [New users, 450000, First ten months of 2020, Scaleapse summary of 2020 company figures, medium, Fast acquisition during COVID period, Starting base and active share]
      - [New affiliated businesses, 35000, First ten months of 2020, Scaleapse summary of 2020 company figures, medium, Merchant acquisition capability, Starting base and retained share]
      - [Active users, 1300000, 2020, Scaleapse summary of 2020 company figures, medium, Early Italian network scale, Definition and monthly activity]
      - [Merchants, 130000, 2020, Scaleapse summary of 2020 company figures, medium, Early acceptance density, Active versus signed merchants]
      - [Payments, 21500000, First ten months of 2020, EconomyUp account, medium, Meaningful transaction activity, User and transaction-frequency denominator]
      - [Payment value, €400 million, First ten months of 2020, EconomyUp account, medium, Monetized network activity, GMV definition and take rate]
      - [Consumers, 3000000, September 2022, TechCrunch and fDi Intelligence reporting, high, Larger network at Series D, Active versus registered consumers]
      - [Merchants, 200000, September 2022, TechCrunch and fDi Intelligence reporting, high, Larger acceptance footprint, Active versus signed merchants]
      - [Users, 5000000, November 2024, Multiples dataset, medium, Later reported consumer scale, Verification and active-user definition]
      - [Merchants, 380000, November 2024, Multiples dataset, medium, Later reported acceptance scale, Verification and active-merchant definition]
      - [Users, 6500000, 2026 report, Eastern Herald report, low, Reported continued scale, Verification and active-user definition]
      - [Merchants, 450000, 2026 report, Eastern Herald report, low, Reported acceptance expansion, Verification and active-merchant definition]
    notes: >-
      Values are reported metrics from different dates and publications; they
      are not a single audited time series. The table deliberately preserves
      missing denominators and does not infer retention or conversion.
    claimRefs: [CU002, CU005, CU006, CU007, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: sample
      basis: Named customer and deployment examples disclosed by assigned public sources through 2026-10-24
    columns: [Customer or user group, Segment, Deployment or use case, Production vs pilot, Outcome or signal, Limitation]
    rows:
      - ["Carrefour", "Merchant", "In-store payment acceptance", "Unclear", "Named as a Satispay retailer", "No current deployment or volume evidence"]
      - ["Decathlon", "Merchant", "In-store payment acceptance", "Unclear", "Named as a Satispay retailer", "No current deployment or volume evidence"]
      - ["Trenitalia and Trenord", "Merchant or service operator", "Payment acceptance", "Unclear", "Named among large retailers using the service", "No contract, volume or renewal evidence"]
      - ["Shopify merchants", "Merchant channel", "Online checkout acceptance", "Partnership deployment", "EconomyUp reports an omnichannel integration", "No active merchant or conversion denominator"]
      - ["French users in Metz and Menton", "Consumer and merchant network", "City-by-city market entry", "Experiment or early rollout", "fDi reports impressive results", "No numeric result or retention evidence"]
      - ["Food-stamp recipients", "Consumer beneficiary", "Government food-stamp distribution", "Use case reported", "TechCrunch describes city-government distribution through the app", "No contract economics or repeat-use evidence"]
    notes: >-
      This is a representative sample, not an exhaustive customer list. Named
      organizations demonstrate reported association or use case, not customer
      retention, production scope, or financial contribution.
    claimRefs: [CU010, CU011, CU012, CU014]
figures:
  - id: FU001
    title: Customer journey from payment utility to attached services
    type: journey-map
    summary: Satispay's disclosed customer path begins with everyday payments and can extend into merchant, welfare, savings and investment use cases.
    data:
      items:
        - label: Acquire
          description: Consumers link the app to an existing bank account and merchants join an alternative acceptance network.
          touchpoints: [App onboarding, Merchant acceptance, Peer referral]
        - label: Use daily
          description: Users pay in stores or online and exchange money with friends.
          touchpoints: [QR or app payment, Online checkout, P2P transfer]
        - label: Add utility
          description: Users and merchants encounter bills, top-ups, gift cards, meal vouchers and welfare workflows.
          touchpoints: [Bill payment, Phone top-up, Meal voucher, Employer welfare]
        - label: Deepen relationship
          description: Savings, investment and BNPL products are offered as adjacent financial services.
          touchpoints: [Money box, Investment products, Paga in 3]
        - label: Expand density
          description: City-by-city rollout and merchant density can reinforce the network, but public sources do not quantify the loop.
          touchpoints: [New geography, Merchant density, Repeat usage]
        - label: Verify durability
          description: Retention, concentration and active-use evidence are required to confirm that scale converts into durable economics.
          touchpoints: [Cohort retention, Concentration schedule, Unit economics]
    approximationNotes: null
    claimRefs: [CU001, CU003, CU013, CU014]
