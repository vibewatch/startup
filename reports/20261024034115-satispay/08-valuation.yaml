callouts:
  - calloutType: recommendation
    title: Research-more
    body: "Satispay merits continued diligence because network scale and investor support are real, but the assigned evidence does not support a current price, cash-flow, or dilution-adjusted return case."
    claimRefs: [CV001, CV006, CV009, CV015]
  - calloutType: risk
    title: The key risk is evidence-to-price conversion
    body: "A reported billion-plus valuation and a planned €120 million raise do not establish an attractive entry without current financing terms, audited economics, and evidence that new financial products change contribution profit."
    claimRefs: [CV003, CV009, CV011, CV013]
