slug: satispay
runDate: 2026-10-24
company:
  name: Satispay
chapter:
  number: 5
  title: Product & Technology
  summary: Satispay is a bank-linked payment network delivered through consumer and merchant applications, QR and hosted checkout flows, and partner integrations. Public evidence supports a mature payment workflow and expanding product surface, but detailed internal architecture, security controls, reliability metrics, and roadmap execution remain insufficiently disclosed.
sections:
  - id: customer-workflow
    title: Customer and merchant workflow
    body: >-
      Satispay's core product is a mobile payment method that lets a customer select Satispay at checkout, receive a payment request or QR code, authorize in the Satispay app, and return with immediate confirmation. Stripe documents the same sequence for a merchant integration: select, redirect, identify by phone number or QR scan, authorize, and complete. Viva's partner documentation adds that the payment is synchronous, activation is instant, and settlement for confirmed transactions is next day. This is a concrete workflow rather than a generic wallet description, and it clarifies why the product can be embedded in third-party checkout without requiring every merchant to open a Satispay account. The operating limitation is equally concrete: Viva lists unsupported recurring payments, pre-authorizations, and cross-currency payments, while Stripe documents a different integration surface with mandates and recurring-payment support. Those differences indicate that capabilities vary by channel and should not be treated as a single universal product contract.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: product-surface
    title: Product surface and maturity
    body: >-
      Public materials show a product expanding from everyday payments into adjacent financial services, but the evidence is uneven by module. Partner documentation verifies merchant acceptance through hosted checkout and API-connected platforms; the current Satispay employer profile describes payments, benefits, investing, and cards as the visible product sequence. Current reporting describes a free Red debit card, more than 650,000 activated IBANs, and nearly 100,000 cards, while other reporting describes planned or recently launched investment products and buy-now-pay-later. These are company or press-reported product claims, not independently audited usage or performance measures. The product map therefore separates observed integration capabilities from reported adjacency launches and from roadmap intent. The main maturity risk is that breadth can outpace proof: public sources do not establish attachment rates, failure rates, support load, or whether each adjacency is available in every market.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
  - id: architecture-dependencies
    title: Architecture and operating dependencies
    body: >-
      The observable architecture is a layered payment workflow: a consumer app and merchant-facing checkout connect through Satispay's account-linked payment environment, while platforms such as Stripe and Viva provide distribution and integration surfaces. The evidence supports QR-based authorization, immediate payment status, refund and dispute handling, and webhook-style status updates in the Stripe integration. API Tracker explicitly says that authentication, permissions, and integration details remain undocumented in its profile, so internal service boundaries, credentials, observability, deployment model, and scalability cannot be responsibly inferred. Satispay's reported independence from Visa and Mastercard is a strategic and operating differentiator, but the system remains dependent on bank connectivity, regulated payment operations, partner availability, and market-specific eligibility. The architecture is therefore best understood as a verified external workflow with material unverified internals, not as a claimed microservice or ledger design.
    claimRefs: [CE009, CE010, CE011, CE012]
    figureRefs: [FE001]
  - id: trust-controls
    title: Trust, safety, and implementation risks
    body: >-
      Trust controls are visible at the boundary but not fully measurable inside the system. Viva describes secure authorization in the Satispay environment and restricts activation for specified merchant categories; Stripe documents customer authorization for saved payment methods, refund windows, dispute evidence deadlines, and mandate revocation. A separate review describes Satispay as an Electronic Money Institution subject to PSD2, AML controls, sanctions screening, and transaction monitoring, although that source is not a regulator record. These controls reduce the risk of treating the product as an unregulated checkout widget, but they do not prove incident rates, uptime, fraud loss, penetration-test status, or privacy-control effectiveness. The key technical diligence request is access to security and reliability evidence by product and market, alongside partner-specific capability matrices, because current public documentation contains both strong boundary-level detail and large gaps in internal assurance.
    claimRefs: [CE013, CE014, CE015]
    callouts:
      - calloutType: risk
        title: Internal assurance is the main product diligence gap
        body: >-
          Public integrations make the payment journey testable, but public sources do not establish Satispay's internal uptime, fraud, security, privacy, or deployment controls. Underwriting should require product-level reliability and assurance evidence before treating the expanding platform surface as technically mature.
        claimRefs: [CE012, CE015]
tables:
  - id: TE001
    title: Verified payment workflow capabilities
    columns: [Workflow stage, Publicly supported behavior, Evidence posture, Limitation or diligence gap]
    rows:
      - [Checkout selection, Customer selects Satispay as the payment method, "Observed in Stripe documentation", "Channel-specific availability should be confirmed"]
      - [Authorization, Customer approves in the Satispay app after phone-number request or QR scan, "Observed in Stripe documentation", "No public latency or failure-rate series"]
      - [Confirmation, Payment status is confirmed immediately, "Observed in Stripe and Viva documentation", "Operational SLA and outage history not disclosed"]
      - [Refunds and disputes, Partial/full refunds and dispute workflows are supported, "Observed in partner documentation", "Partner terms differ; validate merchant implementation"]
      - [Settlement, Confirmed Viva transactions are deposited next day, "Partner-documented", "This is not a universal settlement promise"]
    notes: "Partner documentation describes channel behavior; null or unreported operational metrics are not assumed to be zero."
    claimRefs: [CE001, CE002, CE003, CE004, CE009, CE010]
  - id: TE002
    title: Workflow constraints by integration surface
    columns: [Capability, Viva documentation, Stripe documentation, Underwriting implication]
    rows:
      - [Recurring payments, Not supported, Supported through saved payment methods and mandates, "Capability depends on integration path"]
      - [Pre-authorizations, Not supported, Extended authorization options are listed, "Do not generalize one partner's contract"]
      - [Refund timing, Next-day settlement context; partial/full refunds, Refunds may take up to five minutes to complete, "Reconcile cash and support processes by channel"]
      - [Disputes, No public detail in the reviewed page, 120-day customer window and 15-day evidence period, "Merchant loss exposure requires partner-specific testing"]
      - [Cross-currency, Not yet supported, EUR presentment is documented, "Geographic and currency expansion remains constrained"]
    notes: "This comparison preserves differences between partner surfaces; it is not evidence that Satispay has one uniform API contract."
    claimRefs: [CE003, CE004, CE009, CE010]
  - id: TE003
    title: Product module and asset matrix
    columns: [Module or asset, User, Status or maturity, Differentiation, Diligence gap]
    rows:
      - [Mobile payment app, Consumer, "Core operating product", "Account-linked payment flow independent of card rails", "Current active-use and reliability metrics are not public"]
      - [Merchant checkout and QR flow, Merchant and platform, "Documented integrations", "Hosted checkout, QR authorization, immediate confirmation", "Integration certification and monitoring controls are not public"]
      - [Benefits and meal vouchers, Employer and employee, "Reported adjacent product", "Extends daily-payment distribution into workplace benefits", "Attachment rate and unit economics are not public"]
      - [Red debit card and IBAN-related services, Consumer, "Reported current rollout", "Moves the app toward primary financial-account use", "Licensing, availability, and operational metrics need confirmation"]
      - [Investing and savings products, Consumer, "Reported launch or expansion", "Uses existing payment distribution for financial adjacency", "AUM, suitability controls, and retention need verification"]
      - [Buy-now-pay-later, Consumer and merchant, "Reported late-2025 launch", "Adds credit-like checkout functionality", "Underwriting, arrears, and regulatory controls are not public"]
    notes: "Status labels distinguish partner-observed capabilities from company or press-reported adjacencies; reported launches are not independently audited."
    claimRefs: [CE005, CE006, CE007, CE008]
figures:
  - id: FE001
    title: Observable Satispay product architecture
    type: stack
    summary: The public evidence supports a layered payment workflow and partner distribution model, while internal assurance layers remain unverified.
    data:
      layers:
        - label: Consumer interaction
          modules:
            - label: Satispay app authorization
              detail: Phone-number request or QR scan followed by customer approval
            - label: Mobile account experience
              detail: Payments and reported adjacent financial services
        - label: Merchant interaction
          modules:
            - label: Hosted checkout
              detail: Customer selects Satispay and returns after authorization
            - label: QR acceptance
              detail: QR code is presented for scanning in the mobile flow
        - label: Payment orchestration
          modules:
            - label: Immediate status
              detail: Stripe and Viva document immediate or synchronous confirmation
            - label: Refund and dispute handling
              detail: Partner-specific refund, dispute, and mandate workflows
        - label: Account-linked rails
          modules:
            - label: Bank-linked payment environment
              detail: Public sources describe an account-linked alternative to card rails
            - label: Settlement
              detail: Viva documents next-day settlement for confirmed transactions
        - label: Partner distribution
          modules:
            - label: Stripe
              detail: Payment-method integration with Checkout and APIs
            - label: Viva
              detail: Smart Checkout activation and merchant-category controls
        - label: Assurance boundary
          modules:
            - label: Secure authorization and eligibility
              detail: Boundary controls are documented by partners
            - label: Internal reliability and security evidence
              detail: Not publicly established in the reviewed sources
    approximationNotes: "Layers are an evidence map, not a claim about Satispay's internal software topology."
    claimRefs: [CE001, CE009, CE012, CE013, CE015]
callouts:
  - calloutType: strength
    title: The payment journey is externally legible
    body: >-
      Stripe and Viva documentation exposes concrete checkout, authorization, confirmation, refund, and settlement behaviors, giving merchants a testable integration surface even though internal implementation details are not public.
    claimRefs: [CE001, CE002, CE003, CE009, CE010]
