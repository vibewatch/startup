  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo alternatives
        blocks:
          - type: paragraph
            body: >-
              Satispay's defensible market is narrower than European financial services or total household wealth. Its
              core is an account-linked network for consumer payments, peer-to-peer transfers, and merchant acceptance;
              welfare, instalments, and investing are adjacent products distributed through the same interface. Included
              spend is therefore activity that Satispay can process or monetize through its own products. Bank deposits,
              card-issuing economics, unrelated acquiring, and the whole asset-management market are excluded. Consumers
              can instead use cash, cards, bank applications, or other wallets, while merchants can retain existing
              acceptance stacks. Satispay's reported no-monthly-fee, flat-charge merchant proposition directly addresses
              payment cost, but acceptance density, reliability, and customer preference remain equally important
              purchasing criteria.
            claimRefs:
              - CM001
              - CM002
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
      - number: '2.2'
        title: Evidence-constrained sizing and adoption
        blocks:
          - type: paragraph
            body: >-
              The available figures form sizing lenses, not an additive market model. A 2025 CEPS/ECRI report says 13
              large European mobile-payment solutions collectively served 135 million users and processed more than 9.6
              billion transactions. That is an ecosystem benchmark, not Satispay's TAM. At company level, June 2026
              reporting placed Satispay above 6.5 million users and at 450,000 accepting merchants. Adjacent adoption
              included 43,000 corporate-welfare clients, 500,000 investment-product users, and more than 35,000
              instalment users, but those populations overlap and use different periods and units. Without active-user
              definitions, payment volume, take rate, product-level margins, and geographic splits, these data cannot
              establish a defensible SAM or SOM.
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM011
              - CM013
              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Satispay operates several linked but distinct purchasing paths. Individuals choose the payment application
              and fund personal payment, instalment, or investment activity. Merchants pay for acceptance and care about
              customer reach, conversion, predictable fees, and integration. Employers or benefits teams own the welfare
              budget, while employees use the benefit. The network can create distribution leverage: repeated payment
              use may lower discovery friction for investing, and employer distribution may introduce additional users.
              Yet attachment is not automatic. June reporting of 500,000 investment users and nearly 70% recurring plans
              is promising, while the earlier company-issued cohort of more than 300,000 investors provides a useful
              checkpoint; neither disclosure supplies retention, acquisition cost, or contribution margin.
            claimRefs:
              - CM002
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Growth drivers, adoption constraints, and market judgment
        blocks:
          - type: paragraph
            body: >-
              Digital adoption is a real tailwind, but it is uneven. In euro-area point-of-sale volume, cash declined
              from 72% in 2019 to 52% in 2024, while cards rose from 25% to 39% and mobile applications from 1% to 6%.
              Zeb separately reports that more than 60% of Europeans aged 18-35 use mobile wallets daily. Constraints
              remain material: more than 60% of euro-area consumers still consider the option to pay with cash
              important, most European payment solutions remain nationally bounded, and merchant adoption balances
              conversion against cost. Dealroom's estimated concentration of Satispay web traffic and workforce in Italy
              reinforces the expansion question. The market is attractive, but valuation should depend on proof that
              domestic density converts into durable cross-sell and repeatable multi-country economics.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution is the market thesis
            body: >-
              The upside depends less on a generic payments TAM than on whether Satispay can convert frequent payment,
              merchant, and employer touchpoints into retained adjacent-product usage.
            calloutType: insight
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM014
          - type: callout
            title: A precise SOM is not public
            body: >-
              Registered users, accepting merchants, deposits, assets under management, and transaction volume are
              different denominators; public disclosures cannot be combined into obtainable revenue.
            calloutType: risk
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM011
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and positions
        blocks:
          - type: paragraph
            body: >-
              The relevant landscape is broader than mobile-payment apps. Satispay faces card rails and wallets at
              checkout, domestic schemes such as Bancomat Pay, pan-European fintechs such as Revolut and N26,
              investment-led challengers such as Trade Republic, and status-quo bank transfers or cash. Edgar, Dunn
              describes Satispay as an emerging independent network among European wallets, while its comparison of the
              Italian market places Satispay against Bancomat Pay and notes that established domestic acceptance remains
              much larger. Satispay's own business surface emphasizes merchant acceptance rather than a closed
              consumer-only wallet. The strategic implication is that Satispay must win both merchant distribution and
              daily consumer frequency; a feature checklist alone will not overcome incumbent acceptance, trust, or
              default-wallet advantages.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP008
              - CP010
              - CP011
      - number: '3.2'
        title: Differentiation, pricing, and distribution
        blocks:
          - type: paragraph
            body: >-
              Satispay's clearest differentiation is a proprietary, bank-linked network with merchant economics designed
              to be simple at small ticket sizes. The current Business page lists no activation fee, no subscription
              fee, free transactions below EUR 10, and a 0.95% charge at or above EUR 10. This is a concrete acquisition
              lever, but it is not proof of realized take rate or profitability. Independent coverage also describes a
              city-by-city expansion approach and warns that mobile-payment propositions often have similar
              functionality. The Mastercard launch and investment functionality broaden the use case, but also move
              Satispay into categories where Revolut, N26, and Trade Republic already have product presence.
              Distribution through welfare and an installed payments habit could lower cross-sell friction; public
              evidence does not yet establish attachment, retention, or payback by product.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP009
              - CP012
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat case rests on accumulated local density and workflow integration, not on proprietary
              functionality that competitors cannot reproduce. Recent reporting describes 6.5 million users and 450,000
              merchants, while earlier independent coverage documented three million consumers and 200,000 merchants and
              cautioned that international traction lagged Italy. Those figures are from different periods and should
              not be treated as a verified cohort or market-share series. European interoperability initiatives and the
              Digital Markets Act may reduce distribution barriers for alternative wallets, but they may also make it
              easier for better-funded rivals to reach the same users. The key underwriting question is whether
              Satispay's merchant density, welfare channel, and daily-use frequency create switching costs before
              pan-European networks or bank-backed schemes commoditize the payment layer.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP007
              - CP008
              - CP015
      - number: '3.4'
        title: Competitive evidence and limitations
        blocks:
          - type: paragraph
            body: >-
              The comparison below separates observed product or pricing statements from unknowns. Public sources in
              this pool provide useful directional evidence on competitor categories and Satispay's positioning, but
              they do not provide a consistent, current, like-for-like dataset for rival pricing, active users,
              contribution margin, or retention. Unknown cells are therefore analytical gaps rather than estimates. The
              positioning figure uses ordinal scores solely to make the stated evidence legible: it is not a
              market-share or quality ranking.
            claimRefs:
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Local network density is the strongest visible moat
            body: >-
              The assigned evidence consistently points to Satispay's merchant-and-consumer network as the core
              advantage; adjacent products are more defensible when they increase usage of that installed network.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP010
          - type: callout
            title: Product breadth increases direct competitive exposure
            body: >-
              Cards, investing, and welfare expand the addressable relationship but place Satispay against rivals with
              existing strengths in banking, trading, or pan-European distribution.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP012
          - type: callout
            title: Retention and unit economics remain unverified
            body: >-
              No assigned source provides cohort retention, churn, CAC payback, realized merchant take rate, or
              comparable competitor pricing; these are underwriting gaps, not inferred positives.
            calloutType: assumption
            claimRefs:
              - CP005
              - CP013
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Satispay's core economic model is merchant-funded rather than a consumer subscription model. An
              independent payments review describes merchant fees as the main revenue stream, supplemented by premium
              merchant services and value-added features, while a company-data provider labels the model "Commission."
              Corporate welfare adds a second monetization surface, but the official disclosure only says meal-voucher
              commissions have remained below the statutory 5% cap; it does not disclose realized commission, partner
              costs, or contribution margin. Satispay also reports same-day processing and one-working-day crediting for
              welfare reimbursements, which may improve merchant liquidity but creates an operational-service obligation
              whose funding mechanics are not public. Investing, savings, top-ups, gift cards, bill payment, and Pay in
              3 broaden the product set, yet the assigned evidence does not quantify each stream's revenue recognition
              or mix.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI005
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
              - CI008
              - CI009
              - CI010
              - CI016
      - number: '4.2'
        title: Traction, sales efficiency, and unit economics
        blocks:
          - type: paragraph
            body: >-
              Current public traction is substantial but heterogeneous. Satispay reported annualized revenue above €116
              million at 31 May 2026 and 80% year-on-year growth over the prior two quarters. It also reported 6.5
              million users, more than 450,000 merchants, €670 million of deposits, €420 million of annualized welfare
              volume, and more than €140 million of invested assets. These measures use different denominators: deposits
              and assets are balances, welfare volume is activity, and annualized revenue is not necessarily audited LTM
              revenue or SaaS ARR. The company further says core lines reached gross operating profitability net of
              commercial expenses, but that wording does not reveal gross margin, central overhead, incentive spend,
              provisions, or free cash flow. Directional demographic and company-profile sources add no CAC, churn,
              cohort retention, or payback evidence, so distribution scale cannot yet be translated into acquisition
              efficiency.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI015
              - CI016
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The relevant forward-looking financing fact is the proposed capital increase of up to €120 million, not
              the historical round chronology covered in Company Overview. Nearly €60 million was described as covered
              by subscription commitments from existing investors, but the transaction was still subject to shareholder
              consideration and therefore must not be read as cash on hand. Stated uses include organic growth, new
              investment and pension products, technology development, added liquidity, and possible acquisitions. Those
              uses imply continued investment across product, regulatory, and operating capabilities. Public Luxembourg
              records identify active Satispay entities and a filing history, but the assigned excerpts do not expose
              consolidated cash, debt, earnings, or burn. Without a current balance sheet and cash forecast, neither the
              proposed raise nor prior funding establishes runway or the timing of a next financing need.
            claimRefs:
              - CI011
              - CI012
              - CI016
      - number: '4.4'
        title: Revenue quality, margin path, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is constructive on monetization breadth and network activity, but conservative on
              revenue quality and capital intensity. Welfare offers a differentiated merchant proposition: the company
              reports a meal-voucher receipt 60% above ordinary Satispay digital-payment receipts at the same point of
              sale and more than €30 million reimbursed monthly. However, company-issued economics are not an
              independent margin benchmark, and the investing expansion still faces the behavioral adoption question
              raised by independent coverage. Historical revenue data also remains difficult to compare because one
              provider labels a 2022 figure as revenue while warning that round-linked values may be run-rate or LTM.
              Underwriting therefore requires segment revenue, realized pricing, gross and contribution margins, cohort
              economics, credit losses, cash, burn, debt, and a financing-close bridge before reported scale can support
              a firm profitability or runway conclusion.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Operating scale is visible
            body: >-
              Reported annualized revenue, users, merchants, welfare volume, and invested assets demonstrate meaningful
              activity across several monetization surfaces.
            calloutType: strength
            claimRefs:
              - CI005
              - CI008
              - CI009
              - CI010
          - type: callout
            title: Financing access is not liquidity
            body: >-
              The proposed €120 million increase and nearly €60 million of subscription commitments do not establish
              transaction closing, cash on hand, burn, or runway.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer and merchant workflow
        blocks:
          - type: paragraph
            body: >-
              Satispay's core product is a mobile payment method that lets a customer select Satispay at checkout,
              receive a payment request or QR code, authorize in the Satispay app, and return with immediate
              confirmation. Stripe documents the same sequence for a merchant integration: select, redirect, identify by
              phone number or QR scan, authorize, and complete. Viva's partner documentation adds that the payment is
              synchronous, activation is instant, and settlement for confirmed transactions is next day. This is a
              concrete workflow rather than a generic wallet description, and it clarifies why the product can be
              embedded in third-party checkout without requiring every merchant to open a Satispay account. The
              operating limitation is equally concrete: Viva lists unsupported recurring payments, pre-authorizations,
              and cross-currency payments, while Stripe documents a different integration surface with mandates and
              recurring-payment support. Those differences indicate that capabilities vary by channel and should not be
              treated as a single universal product contract.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE009
              - CE010
      - number: '5.2'
        title: Product surface and maturity
        blocks:
          - type: paragraph
            body: >-
              Public materials show a product expanding from everyday payments into adjacent financial services, but the
              evidence is uneven by module. Partner documentation verifies merchant acceptance through hosted checkout
              and API-connected platforms; the current Satispay employer profile describes payments, benefits,
              investing, and cards as the visible product sequence. Current reporting describes a free Red debit card,
              more than 650,000 activated IBANs, and nearly 100,000 cards, while other reporting describes planned or
              recently launched investment products and buy-now-pay-later. These are company or press-reported product
              claims, not independently audited usage or performance measures. The product map therefore separates
              observed integration capabilities from reported adjacency launches and from roadmap intent. The main
              maturity risk is that breadth can outpace proof: public sources do not establish attachment rates, failure
              rates, support load, or whether each adjacency is available in every market.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Architecture and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              The observable architecture is a layered payment workflow: a consumer app and merchant-facing checkout
              connect through Satispay's account-linked payment environment, while platforms such as Stripe and Viva
              provide distribution and integration surfaces. The evidence supports QR-based authorization, immediate
              payment status, refund and dispute handling, and webhook-style status updates in the Stripe integration.
              API Tracker explicitly says that authentication, permissions, and integration details remain undocumented
              in its profile, so internal service boundaries, credentials, observability, deployment model, and
              scalability cannot be responsibly inferred. Satispay's reported independence from Visa and Mastercard is a
              strategic and operating differentiator, but the system remains dependent on bank connectivity, regulated
              payment operations, partner availability, and market-specific eligibility. The architecture is therefore
              best understood as a verified external workflow with material unverified internals, not as a claimed
              microservice or ledger design.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE009
              - CE012
              - CE013
              - CE015
      - number: '5.4'
        title: Trust, safety, and implementation risks
        blocks:
          - type: paragraph
            body: >-
              Trust controls are visible at the boundary but not fully measurable inside the system. Viva describes
              secure authorization in the Satispay environment and restricts activation for specified merchant
              categories; Stripe documents customer authorization for saved payment methods, refund windows, dispute
              evidence deadlines, and mandate revocation. A separate review describes Satispay as an Electronic Money
              Institution subject to PSD2, AML controls, sanctions screening, and transaction monitoring, although that
              source is not a regulator record. These controls reduce the risk of treating the product as an unregulated
              checkout widget, but they do not prove incident rates, uptime, fraud loss, penetration-test status, or
              privacy-control effectiveness. The key technical diligence request is access to security and reliability
              evidence by product and market, alongside partner-specific capability matrices, because current public
              documentation contains both strong boundary-level detail and large gaps in internal assurance.
            claimRefs:
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The payment journey is externally legible
            body: >-
              Stripe and Viva documentation exposes concrete checkout, authorization, confirmation, refund, and
              settlement behaviors, giving merchants a testable integration surface even though internal implementation
              details are not public.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and jobs
        blocks:
          - type: paragraph
            body: >-
              Satispay serves two sides of a payments network. Consumers use the app for in-store and online purchases,
              peer-to-peer transfers, bills, top-ups and savings-oriented services, while merchants use it as an
              alternative acceptance method. The customer proposition is strongest where low-value, frequent payments
              and merchant fee sensitivity matter: the original product was designed around avoiding card friction for a
              cup of espresso, and sources describe a prepaid or account-linked operating model rather than a
              conventional bank account. The platform has also added employee benefits, meal vouchers, investing and
              buy-now-pay-later products, creating possible expansion paths but making segment-level economics harder to
              isolate. Public sources do not provide a current split of users by payer, user, geography, vertical or
              revenue band.
            claimRefs:
              - CU001
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU010
              - CU011
              - CU012
      - number: '6.2'
        title: Adoption trajectory and durability
        blocks:
          - type: paragraph
            body: >-
              The public record supports a large and expanding network, but the measures are not interchangeable.
              TechCrunch and fDi Intelligence reported three million consumers and 200,000 merchants around the
              September 2022 Series D, while later sources described five million users and 380,000 merchants in 2024
              and 6.5 million users and 450,000 merchants in 2026. Older evidence shows 1.3 million active users,
              130,000 merchants and 21.5 million payments in the first ten months of 2020, with transaction value up 78%
              year over year. These datapoints indicate growth in disclosed scale, not a verified active-user cohort or
              retention curve. Reuters separately relayed the CEO's statement that the customer base doubled over the
              prior two years, but that statement did not define customer or activity. No assigned source discloses NRR,
              GRR, churn, renewal, CAC, payback, monthly active users, or a consistent denominator across periods.
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
      - number: '6.3'
        title: Named customer proof and use cases
        blocks:
          - type: paragraph
            body: >-
              Named merchants and institutional use cases provide evidence that Satispay is more than a logo list, but
              they vary in proof quality. EconomyUp names large retailers and reports that the meal-voucher product
              initially had 70,000 affiliated activities; TechCrunch describes food-stamp distribution and remote or
              contactless use during COVID; and the 2026 coverage describes an employee-welfare program embedded in
              43,000 Italian companies. The sources do not establish that every named merchant remains active, that
              deployments are production-wide, or that the associated outcomes are incremental. Customer evidence is
              therefore best read as proof of use-case breadth and channel access, not as retention or revenue
              attribution.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU013
              - CU014
      - number: '6.4'
        title: Expansion, friction and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              Satispay's expansion logic is a density-building loop: acquire consumers, add merchants, increase everyday
              payment frequency, then attach services such as welfare, savings, investing or BNPL. The international
              record is more qualified than the Italian record. fDi Intelligence reported strong Italian scale but less
              traction abroad, a city-by-city approach in France, a Luxembourg presence and trials in Germany, while
              also warning that critical-mass adoption and differentiation would determine success in a crowded market.
              A regulated-EMI profile supports the existence of payment infrastructure, but also records no deposit
              guarantee and limited support options. The assigned evidence does not quantify top-customer exposure,
              merchant concentration, channel dependence, procurement cycle, or cross-sell attachment, so these remain
              material diligence gaps.
            claimRefs:
              - CU014
              - CU015
              - CU016
              - CU017
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Network scale is visible
            body: >-
              Public sources consistently describe a large Italian consumer and merchant network, with newer coverage
              reporting further scale and adjacent product usage.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU010
          - type: callout
            title: Durability is not disclosed
            body: >-
              Customer counts and named logos do not substitute for cohorts, retention, active-use definitions,
              concentration, or segment-level economics.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
              - CU017
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The risk hierarchy is led by regulatory and control execution, followed by payment availability and
              partner dependency. Satispay is adding Mastercard cards and securities investing to an account-linked
              payments platform while third-party descriptions still frame it as an electronic-money institution rather
              than a full bank. That combination raises the number of permissions, conduct duties, outsourced processes,
              reconciliations, and customer-support paths that must work together. The April 2026 PPRO degradation
              provides direct evidence that a supplier-side failure can affect Satispay processing; it does not
              establish recurring instability. Customer-review and scale snapshots provide monitoring signals, but their
              changing vintages and indirect methodologies do not quantify transaction losses, churn, or control
              quality.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR009
              - CR010
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              EconomyUp describes Satispay as operating through a mosaic of authorisations, specialist companies, and
              partnerships rather than under a full banking licence. The model can support breadth, but it makes the
              entity-and-product perimeter a central diligence item. CMS Law's summary of Circular CSSF 26/906 shows the
              2026 governance direction for Luxembourg payment and electronic-money institutions: robust internal
              governance, risk processes, internal controls, safeguarding, annual ICT and security-risk assessment, and
              management attestation, with alignment required before 30 June 2026. Italy's reported extension of
              electronic-payment acceptance duties to mobile wallets may aid adoption, yet the accompanying fee reset
              shows that regulation can alter commercial economics. No assigned source proves Satispay-specific
              compliance with the circular or rules out unreported enforcement; both remain evidence gaps.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR007
              - CR012
      - number: '7.3'
        title: Operational, customer, and partner dependency
        blocks:
          - type: paragraph
            body: >-
              IsDown reproduces a PPRO update describing a severe service degradation affecting Satispay on 20 April
              2026, with restoration after roughly 1.1 hours. Because the underlying update is supplier-issued, it
              confirms the event and recovery message but does not independently verify root cause, transaction impact,
              or corrective-action effectiveness. Product expansion adds more counterparties: Mastercard supplies global
              card acceptance, Vanguard is named for recurring ETF plans, and LeadIQ reports a Stripe partnership for
              online shopping. Traders Union's aggregation of 4,916 Trustpilot reviews reports a 21.75% one-star share,
              a customer-friction signal that requires complaint-category and cohort analysis before it can be tied to
              retention. Partner concentration, service levels, failover tests, and loss exposure are not publicly
              disclosed.
            claimRefs:
              - CR003
              - CR005
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR012
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR005
              - CR013
              - CR014
              - CR016
      - number: '7.4'
        title: Financial model risk, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Italy Telegraph reports zero merchant fees below €10 and a 0.95% fee at or above €10 from September 2026.
              That may support density, but public evidence does not show whether incremental volume offsets waived
              revenue and higher card, investment, compliance, and support costs. Eastern Herald reports a proposed
              rights offering of up to €120 million with about half committed and annualised revenue of €116 million as
              of 31 May; the offering is not cash already available, and annualised revenue is not ARR or free cash
              flow. Multiples' older $42 million revenue record explicitly allows either run-rate or LTM treatment,
              limiting comparability. The thesis should be re-underwritten if a regulator blocks a product, material
              control findings remain open, severe degradation recurs before remediation is verified, a critical partner
              exits without tested substitution, or audited product contribution remains negative after the pricing
              reset.
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A resolved incident is not proof of resilience
            body: >-
              The PPRO update confirms restoration after one severe degradation, but the assigned evidence does not
              disclose recurrence, affected transaction volume, root cause, losses, or independently verified corrective
              action.
            calloutType: risk
            claimRefs:
              - CR014
              - CR016
          - type: callout
            title: Underwrite controls and contribution before expansion
            body: >-
              Investment approval should require entity-level regulatory evidence, incident and fraud denominators,
              partner-continuity testing, and audited product contribution after the September 2026 merchant-pricing
              reset.
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is a dense Italian distribution network that can compound from daily payments into
              welfare, savings, and investment products. Recent reporting describes 6.5 million users, 450,000
              merchants, annualised revenue of €116 million as of May 31, 2026, and a proposed raise of up to €120
              million; these are meaningful operating indicators, although the figures are reported rather than audited
              in the assigned pool. Existing investors Addition, Greyhound Capital, and Lightrock were reported as
              committing roughly half of the proposed raise, while Tech.eu records €539 million across nine rounds
              through October 24, 2026. The anti-thesis is that the next growth leg depends on converting payment and
              welfare engagement into investing behavior, a product and regulatory expansion whose economics, retention,
              and profitability are not publicly disclosed here. A billion-plus valuation therefore requires evidence of
              durable monetization, not only user and transaction scale.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV016
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The financing record provides useful anchors but not a current fully diluted price. Tech.eu reports €320
              million in September 2022 and €60 million in November 2024, with €539 million cumulative funding; Tracxn
              separately reports a $962 million post-money valuation for the September 2022 round and $501 million total
              funding, while Multiples reports $980 million and a 23.3x revenue multiple on its September 2022 data.
              These differences likely reflect currency, database methodology, and whether revenue is run-rate or
              reported, so they should not be blended into a precise mark. June 2026 coverage describes a pre-emptive
              rights issue of up to €120 million and says the valuation remains above €1 billion, but the assigned
              evidence does not provide a cap table, preference stack, dilution terms, or a closed-round price. Entry
              discipline should therefore require the signed financing documents, current share count, liquidation
              preferences, and a reconciled net-revenue definition before underwriting a multiple.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV011
              - CV012
      - number: '8.3'
        title: Scenarios, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              A defensible scenario range must be conditional because current audited revenue, gross margin, net take
              rate, cash burn, and free cash flow are not available in the assigned pool. The bull case requires the
              investment and welfare products to deepen engagement without disproportionate compliance or
              customer-acquisition cost, while the base case assumes payments remain the economic core and new products
              add optionality but not yet a reliable valuation premium. The bear case is a failed behavior change or a
              capital-intensive expansion that forces a down-round or compresses the payment-network multiple.
              Comparable evidence is directional only: Multiples lists private and public payment comparables with
              reported multiples, and the assigned Adyen market-cap page shows a $33.52 billion market capitalization in
              October 2026, but these companies differ in scale, margins, liquidity, geography, and business mix. Exit
              readiness is therefore not established. Before investing, diligence should reconcile the financing terms,
              product-level cohorts, regulatory permissions, loss and fraud metrics, and a path to positive free cash
              flow.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV009
              - CV011
              - CV015
      - number: '8.4'
        title: Recommendation
        blocks:
          - type: paragraph
            body: >-
              The evidence supports research-more with medium confidence and a stretched valuation stance. Satispay has
              credible scale, a long financing history, and a potentially valuable distribution moat, but the public
              record does not establish a current valuation, durable unit economics, or the terms and dilution of the
              planned capital increase. A buyer should condition any entry on a reconciled current price and cap table,
              audited or management-certified financial metrics, and proof that welfare and investment products improve
              retention and contribution profit. The recommendation should move toward buy only if those materials show
              that growth is translating into cash generation at a multiple that remains defensible against liquid
              payment peers; it should move toward avoid if the raise is needed to fund structurally negative economics
              or if customer investment adoption is materially below plan.
            claimRefs:
              - CV003
              - CV009
              - CV011
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV011
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more
            body: >-
              Satispay merits continued diligence because network scale and investor support are real, but the assigned
              evidence does not support a current price, cash-flow, or dilution-adjusted return case.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV015
          - type: callout
            title: The key risk is evidence-to-price conversion
            body: >-
              A reported billion-plus valuation and a planned €120 million raise do not establish an attractive entry
              without current financing terms, audited economics, and evidence that new financial products change
              contribution profit.
            calloutType: risk
            claimRefs:
              - CV003
              - CV009
              - CV011
              - CV013
