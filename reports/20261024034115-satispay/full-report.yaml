        title: Milestones and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The operating arc runs from a 2013 founding and payments network to a 2022 unicorn financing, a 2024
              follow-on round, 2025 workforce expansion and buy-now-pay-later launch, and 2026 investment-fund
              expansion. The investment launch is supported by a January 2026 report describing Bond, Balanced and
