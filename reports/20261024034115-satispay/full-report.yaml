  - id: FE001
    title: Observable Satispay product architecture
    type: stack
    summary: >-
      The public evidence supports a layered payment workflow and partner distribution model, while internal assurance
      layers remain unverified.
    data:
      layers:
        - label: Consumer interaction
          modules:
            - label: Satispay app authorization
              detail: Phone-number request or QR scan followed by customer approval
            - label: Mobile account experience
              detail: Payments and reported adjacent financial services
        - label: Merchant interaction
          modules:
            - label: Hosted checkout
              detail: Customer selects Satispay and returns after authorization
            - label: QR acceptance
              detail: QR code is presented for scanning in the mobile flow
        - label: Payment orchestration
          modules:
            - label: Immediate status
              detail: Stripe and Viva document immediate or synchronous confirmation
            - label: Refund and dispute handling
              detail: Partner-specific refund, dispute, and mandate workflows
        - label: Account-linked rails
          modules:
            - label: Bank-linked payment environment
              detail: Public sources describe an account-linked alternative to card rails
            - label: Settlement
              detail: Viva documents next-day settlement for confirmed transactions
        - label: Partner distribution
          modules:
            - label: Stripe
              detail: Payment-method integration with Checkout and APIs
            - label: Viva
              detail: Smart Checkout activation and merchant-category controls
        - label: Assurance boundary
          modules:
            - label: Secure authorization and eligibility
              detail: Boundary controls are documented by partners
            - label: Internal reliability and security evidence
              detail: Not publicly established in the reviewed sources
    approximationNotes: Layers are an evidence map, not a claim about Satispay's internal software topology.
    claimRefs:
      - CE001
      - CE009
      - CE012
      - CE013
      - CE015
  - id: FU001
    title: Customer journey from payment utility to attached services
    type: journey-map
    summary: >-
      Satispay's disclosed customer path begins with everyday payments and can extend into merchant, welfare, savings
      and investment use cases.
    data:
      items:
        - label: Acquire
          description: Consumers link the app to an existing bank account and merchants join an alternative acceptance network.
          touchpoints:
            - App onboarding
            - Merchant acceptance
            - Peer referral
        - label: Use daily
          description: Users pay in stores or online and exchange money with friends.
          touchpoints:
            - QR or app payment
            - Online checkout
            - P2P transfer
        - label: Add utility
          description: Users and merchants encounter bills, top-ups, gift cards, meal vouchers and welfare workflows.
          touchpoints:
            - Bill payment
            - Phone top-up
            - Meal voucher
            - Employer welfare
        - label: Deepen relationship
          description: Savings, investment and BNPL products are offered as adjacent financial services.
          touchpoints:
            - Money box
            - Investment products
            - Paga in 3
        - label: Expand density
          description: >-
            City-by-city rollout and merchant density can reinforce the network, but public sources do not quantify the
            loop.
          touchpoints:
            - New geography
            - Merchant density
            - Repeat usage
        - label: Verify durability
          description: >-
            Retention, concentration and active-use evidence are required to confirm that scale converts into durable
            economics.
          touchpoints:
            - Cohort retention
            - Concentration schedule
            - Unit economics
    approximationNotes: null
    claimRefs:
      - CU001
      - CU003
      - CU013
      - CU014
