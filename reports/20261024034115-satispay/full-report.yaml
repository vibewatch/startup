chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Satispay was founded in Milan in 2013 by Alberto Dalmasso, Samuele Pinta, and Dario Brignone. Its core
              proposition is an account-linked payment app for consumers and merchants that operates outside Visa and
              Mastercard rails, with peer-to-peer transfers and merchant acceptance as the initial use cases. The
              platform has since added employer welfare, savings and investment products, and buy-now-pay-later. This is
              a platform expansion rather than evidence that every adjacent product has reached the same scale as
              payments. Public sources also conflict on launch framing and network size: a partner description says the
              service launched in 2015 and names more than 200,000 retailers, while newer reporting gives materially
              higher 2026 figures. The stable identity is therefore the Milan headquarters, 2013 founding date, and
              payments-first model; current operating metrics should be treated as dated claims rather than a single
              audited fact.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: Founders, leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Alberto Dalmasso remains the central publicly identified executive and co-founder, while Samuele Pinta and
              Dario Brignone are identified as the other founders. The available evidence describes an expanded
              leadership team with banking, compliance and consumer-technology experience, but it does not provide a
              current named executive roster or board composition. A 2026 report says existing investors retain
              confidence in founders who retain a controlling governance role, while a separate report identifies
              Lightrock partner Umur Hursever as a non-executive director since 2021. This combination suggests
              meaningful founder influence alongside institutional oversight, but the control mechanics, director list,
              voting rights, and succession arrangements remain diligence items. Key-person dependence is material
              because the current evidence repeatedly attributes strategy and product direction to Dalmasso.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
