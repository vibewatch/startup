          unit: users
          detail: Aggregate for 13 large solutions in the 2025 CEPS/ECRI report.
        - id: satispay-users
          label: Satispay users
          value: 6500000
          unit: users
          detail: More than 6.5 million reported in June 2026.
        - id: investment-users
          label: Investment-product users
          value: 500000
          unit: users
          detail: Reported in June 2026.
        - id: satispay-merchants
          label: Accepting merchants
          value: 450000
          unit: merchants
          detail: Reported in June 2026.
        - id: welfare-clients
          label: Corporate-welfare clients
          value: 43000
