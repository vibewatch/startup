  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Satispay is positioned as locally dense and increasingly broad, while pan-European fintechs are broader but not
      shown with comparable merchant-network evidence in this pool.
    data:
      points:
        - label: Satispay
          x: 4
          'y': 4
          note: Local network and adjacent-product breadth are evidenced; cross-border durability remains uncertain.
        - label: Revolut
          x: 4
          'y': 3
          note: Broad financial-app and investing capability are evidenced; comparable merchant-network evidence is absent.
        - label: N26
          x: 3
          'y': 3
          note: Banking-app and investing capability are evidenced; merchant distribution is not comparable in the pool.
        - label: Trade Republic
          x: 2
          'y': 2
          note: Investment focus is evidenced; payments-network breadth is not.
        - label: Bancomat Pay
          x: 4
          'y': 2
          note: Domestic acceptance strength is described; product breadth is not quantified.
        - label: Status quo
          x: 1
          'y': 1
          note: Existing bank and cash habits have familiarity but no disclosed Satispay-specific switching-cost evidence.
      xAxis: Breadth of disclosed customer-facing capabilities (ordinal 1-5)
      yAxis: Evidence of local payment-network distribution (ordinal 1-5)
