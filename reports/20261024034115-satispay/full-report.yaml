      - number: '1.3'
        title: Funding, valuation and operating scale
        blocks:
          - type: paragraph
            body: >-
              Satispay crossed the unicorn threshold with a reported €320 million Series D in September 2022 at a
              valuation above €1 billion, then raised a reported €60 million in November 2024. Indexed records $501.5
              million across eight rounds and identify a $64.3 million November 2024 round, while Multiples records a
              different private-company data set; these amounts should not be merged without reconciling currency, round
              classification and database methodology. In June 2026, reporting described a proposed pre-emptive rights
              offering of up to €120 million, with about half reportedly committed by Addition, Greyhound Capital and
              Lightrock and a shareholder vote scheduled for June 29. The pool does not establish that the offering
              closed. Current reported scale includes 6.5 million users, 450,000 merchants, €116 million annualised
              revenue as of May 31, and €670 million of deposits, but these are media-reported figures rather than
              audited disclosures in the retained evidence.
