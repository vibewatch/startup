    title: Evidence-constrained scale layers
    type: pyramid
    summary: >-
      Six reported scale markers place Satispay's network and adjacencies inside a broader European mobile-payment
      context.
    data:
      nodes:
        - id: european-mobile-payments
          label: European mobile-payment users
