      still described as proposed.
    data:
      items:
        - date: '2013'
          label: Founded
          title: Founded
          details: Alberto Dalmasso, Samuele Pinta and Dario Brignone founded Satispay in Milan.
          tone: neutral
          claimRefs:
            - CO001
            - CO006
        - date: 2022-09
          label: Series D and unicorn threshold
          title: Series D and unicorn threshold
          details: A reported €320 million Series D placed valuation above €1 billion.
          tone: positive
          claimRefs:
            - CO010
        - date: 2024-11
          label: Follow-on funding
          title: Follow-on funding
