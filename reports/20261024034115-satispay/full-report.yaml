        - research-more
        - Scale and financing evidence are positive, but current price and economics are not reconciled.
        - Do not underwrite a buy before finance and cap-table diligence.
      - - Confidence
        - medium
        - Multiple sources corroborate scale and funding, while current profitability and terms remain undisclosed.
        - Treat reported operating metrics as provisional.
      - - Risk rating
        - high
        - Expansion into investing and welfare adds execution, compliance, and behavior-change exposure.
        - Require milestone-based underwriting.
      - - Valuation stance
        - stretched
        - >-
          Historical marks were near $1 billion and 2026 coverage says the valuation remains above €1 billion without a
          current price.
        - Demand price and preference transparency.
    notes: >-
      Assessment is analytical; reported operating and financing figures are not treated as audited or as a current
      share-price mark.
    claimRefs:
      - CV001
      - CV003
      - CV009
      - CV011
  - id: TV002
    title: Thesis / anti-thesis
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
      - Investment implication
    rows:
      - - Distribution moat
        - Coverage reports 6.5 million users, 450,000 merchants, and welfare distribution inside 43,000 companies.
        - Cohort data show weak repeat use or merchant churn.
        - Scale can justify a premium only if engagement persists.
      - - Financing validation
        - >-
          Tech.eu records €539 million raised across nine rounds; returning investors reportedly back the proposed
          raise.
        - Current round terms reveal heavy dilution, preferences, or a down-round.
        - Investor sponsorship is not a substitute for price discovery.
      - - Adjacency option value
        - Reported investment products have 500,000 users and €140 million AUM, while welfare volumes are growing.
        - Attachment rates, contribution margin, or compliance costs disappoint.
        - Underwrite adjacencies as milestones, not as certain revenue.
      - - Behavior-change risk
        - Reporting explicitly frames moving Italian savers into markets as the unresolved next challenge.
        - Recurring investment retention and net deposits exceed plan.
        - Require evidence before assigning a fintech-super-app premium.
    notes: >-
      Rows combine reported facts with conditional analyst interpretation; figures are not independently audited in the
      assigned evidence.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV011
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Investment and welfare products increase recurring engagement; current payment scale converts into profitable
          cross-sell; financing closes on acceptable terms.
        - >-
          A premium to the historical roughly $1 billion mark could be justified only after verified growth, margin, and
          cash-flow evidence.
        - Regulatory execution, customer adoption, and competition from Revolut, N26, and Trade Republic.
        - Low-to-medium until product cohorts and economics are disclosed.
      - - Base
        - >-
          Payments remain the core business; new products add option value but do not yet change verified contribution
          economics.
        - >-
          Value near the last disclosed private marks, subject to dilution and preference adjustments, with no
          unsupported forward multiple.
        - Opaque financials and uncertain current price.
        - Base case pending financing documents.
      - - Bear
        - >-
          Investment adoption stalls or expansion consumes capital faster than contribution profit grows; the new raise
          becomes a financing dependency.
        - Down-round, flat mark, or payment-peer multiple compression becomes possible.
        - Behavior change, compliance cost, fraud/loss exposure, and liquidity constraints.
        - Material downside cannot be quantified from public evidence.
      - - Diligence gate
        - >-
          Obtain current cap table, audited revenue and margin bridge, cohort retention, product-level CAC/payback, and
          regulatory permissions.
        - No target return or exit value should be stated until the inputs are reconciled.
        - Missing evidence itself is a decision risk.
        - Required before investment committee approval.
    notes: >-
      Scenarios are conditional, not price targets; the source pool does not support a precise current valuation range
      or probability-weighted return.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV013
      - CV014
      - CV015
