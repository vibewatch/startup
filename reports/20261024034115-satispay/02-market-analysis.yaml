      - [Small and midsize merchants, Merchant owner, Merchant staff and shoppers, Merchant, "Enable in-store or online acceptance", "No activation or monthly fee and a flat charge above €10"]
      - [Employers and benefits teams, Employer or HR buyer, Employee, Employer benefits budget, "Issue and manage welfare benefits", "Administrative simplicity and employee reach"]
      - [Investment users, Individual, Individual, Individual savings budget, "Open and fund investment products", "Low-friction in-app discovery and recurring plans"]
      - [Instalment users, Individual, Individual, Individual repayment capacity, "Split eligible purchases into instalments", "Embedded access at the moment of purchase"]
    notes: "Buyer roles are analytical segmentation; public sources do not disclose segment-level acquisition cost, retention, payback, or contribution margin."
    claimRefs: [CM002, CM007, CM009, CM010, CM011, CM012, CM013, CM014, CM015]
