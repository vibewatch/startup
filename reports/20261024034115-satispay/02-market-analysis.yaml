      - [Merchant acceptance, "Satispay acceptance and related merchant fees", "Unrelated acquiring and terminal revenue", Merchant, "Core monetization and network density"]
      - [Corporate welfare, "Meal vouchers and employer-funded welfare workflows", "Payroll and total employee compensation", Employer or benefits team, "B2B distribution adjacency"]
      - [Consumer finance adjacencies, "Investments and instalment products offered in the application", "All household wealth and the full asset-management market", Consumer, "Potential wallet-share expansion"]
      - [Status-quo alternatives, "Cash, cards, bank applications, and competing wallets", "None; these are substitutes rather than Satispay spend", Consumer and merchant, "Limits obtainable share"]
    notes: "Analytical boundary based on assigned sources; categories overlap and are not additive market totals."
    claimRefs: [CM001, CM002, CM007]
  - id: TM002
    title: Market and company sizing lenses
    columns: [Lens, Period, Geography, Reported value, Denominator or basis, Confidence, Limitation]
    rows:
      - [European mobile-payment ecosystem, 2025, Europe, "135 million users; >9.6 billion transactions", "Aggregate for 13 large European solutions", Medium, "Not Satispay TAM, revenue, or obtainable share"]
      - [Euro-area point-of-sale mix, 2024, Euro area, "52% cash; 39% cards; 6% mobile apps by volume", "Share of point-of-sale transaction count", Medium, "Regional aggregate; country behavior differs"]
      - [Satispay user network, "June 2026", Italy-led network, ">6.5 million users", "Reported registered user base", Medium, "Active-user definition and geography split undisclosed"]
      - [Satispay merchant network, "June 2026", Italy-led network, "450,000 merchants", "Reported accepting merchants", Medium, "Active locations and payment volume undisclosed"]
      - [Corporate welfare, "Through May 2026", Italy, "43,000 companies; €420 million annualised volume", "Reported client companies and annualised welfare volume", Medium, "Volume is not revenue or retained budget share"]
      - [Investment products, "June 2026", Italy, "500,000 users; €140 million assets under management", "Reported users and assets under management", Medium, "Product revenue, retention, and cohort mix undisclosed"]
      - [Investment recurrence, "June 2026", Italy, "Nearly 70% recurring-plan adoption", "Share of reported investment-product users", Medium, "Publisher-reported company metric; cohort definition undisclosed"]
      - [Buy now pay later, "Since late-2025 launch", Italy, ">35,000 users; >€6 million transactions", "Reported users and cumulative transaction value", Medium, "Short operating history and no credit economics"]
      - [Invested Money Box checkpoint, "Mid-May to December 2025", Italy, ">300,000 investors; >€120 million deposited", "Company-issued launch update", Medium, "Company claim; deposits are not revenue or assets available to Satispay"]
    notes: "Values preserve each source's period, unit, and denominator; unlike populations and financial measures are not summed into TAM, SAM, or SOM."
    claimRefs: [CM003, CM004, CM008, CM009, CM010, CM011, CM012, CM013, CM014, CM015]
