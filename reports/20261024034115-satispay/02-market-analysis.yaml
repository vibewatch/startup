callouts:
  - calloutType: insight
    title: Distribution is the market thesis
    body: "The upside depends less on a generic payments TAM than on whether Satispay can convert frequent payment, merchant, and employer touchpoints into retained adjacent-product usage."
    claimRefs: [CM009, CM010, CM011, CM012, CM014]
  - calloutType: risk
    title: A precise SOM is not public
    body: "Registered users, accepting merchants, deposits, assets under management, and transaction volume are different denominators; public disclosures cannot be combined into obtainable revenue."
    claimRefs: [CM003, CM009, CM010, CM011, CM015]
