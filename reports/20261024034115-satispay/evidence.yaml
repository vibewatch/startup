evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: funding
    missingEvidence: Completed 2026 rights-offering documents, proceeds received, current cap table and investor preference terms.
    whyItMatters: >-
      The proposed financing and reported billion-euro valuation affect dilution, liquidity and the credibility of the
      current capital base.
    diligencePath: >-
      Request the signed financing documents, shareholder resolution, capitalization table and latest management
      accounts from the company.
    relatedQuestionRefs:
      - QO003
      - QO006
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: scale
    missingEvidence: Audited revenue bridge, active-user and merchant definitions, current headcount and product-level economics.
    whyItMatters: >-
      Reported users, merchants, revenue and deposits come from different publications and may use different periods or
      denominators.
    diligencePath: >-
      Reconcile monthly active users, registered merchants, annualised revenue, deposits and headcount to a dated KPI
      pack and audited accounts.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: identity
    missingEvidence: >-
      Authoritative incorporation and launch records that explain 2013 founding versus partner descriptions calling the
      service launched in 2015.
    whyItMatters: The discrepancy is not material to the current model but affects historical chronology and source confidence.
    diligencePath: Obtain the incorporation extract and product launch chronology from Satispay or a primary registry.
    relatedQuestionRefs:
      - QO001
      - QO007
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete executive and board roster, founder ownership, voting rights and succession arrangements.
    whyItMatters: Founder control and key-person dependence cannot be assessed from a founder list and one reported director.
    diligencePath: Request the latest board minutes, governance chart, shareholder agreement and management succession plan.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: geographic-concentration
    missingEvidence: Current users, active merchants, transaction volume, revenue, and contribution margin by country.
    whyItMatters: >-
      Public workforce and traffic estimates suggest Italian concentration but cannot measure international commercial
      traction or expansion economics.
    diligencePath: >-
      Request a country-level operating dashboard with monthly active users, active merchants, payment volume, revenue,
      and contribution margin.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: serviceable-market
    missingEvidence: >-
      Active-user definitions, payment volume, take rate, retained merchant cohorts, and share of eligible spend by
      product and segment.
    whyItMatters: >-
      Broad ecosystem users and reported registrations cannot be converted into company-specific SAM, SOM, or obtainable
      revenue.
    diligencePath: >-
      Reconcile management KPIs to transaction-level cohorts and build a bottom-up market model by geography, product,
      active user, and active merchant.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adjacent-product-economics
    missingEvidence: >-
      Retention, acquisition cost, payback, contribution margin, and cross-sell attachment for welfare, investing, and
      instalment products.
    whyItMatters: >-
      Adoption counts and deposits do not establish durable revenue, profitability, or valuation-supporting wallet
      share.
    diligencePath: >-
      Obtain cohort-level economics by product, acquisition channel, and customer segment, including overlap among
      reported populations.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Current cohort retention, churn, CAC payback, realized merchant take rate, and contribution margin by product and
      geography.
    whyItMatters: Competitive durability depends on whether network density converts into repeat usage and attractive economics.
    diligencePath: >-
      Request monthly cohort, channel, and product-level unit-economic schedules and benchmark them against named
      rivals.
    relatedQuestionRefs:
      - QP010
  - type: missing-source
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Comparable current pricing, interchange, spread, subscription, and merchant-acquiring terms for Revolut, N26,
      Trade Republic, Bancomat Pay, and card rails.
    whyItMatters: The current evidence shows feature overlap but cannot establish a price or margin advantage.
    diligencePath: Collect current official price cards and representative merchant contracts for each relevant competitor.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
