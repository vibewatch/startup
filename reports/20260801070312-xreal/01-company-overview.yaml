- id: capital-stage-and-ipo-transition
  title: Capital stage, investor map, and the IPO transition
  body: The best-supported capital picture is that XREAL is a late-stage private company that completed a $100 million Series D in January 2026 and is now preparing to test public-market appetite through a Hong Kong listing. Sina's January 2026 report quotes Chi Xu disclosing the new round and says the investors were mainly supply-chain participants plus existing shareholder support, while Tracxn lists a Jan. 8, 2026 Series D at a $1 billion valuation and cumulative disclosed funding of roughly $433 million. That same Tracxn profile also shows earlier late-stage backers such as Alibaba, NIO Capital, Kuaishou Technology, Gentle Monster, and Sequoia. The April 2026 IPO reporting from 36Kr and ChinaBiz Insider adds a second layer of nuance. It suggests the company now has enough disclosed operating data to argue it is not a science-project startup, but not enough balance-sheet slack to delay public financing indefinitely. Those reports frame the IPO not merely as optional growth capital, but
    as part of the company's transition from private hardware leader to a more scrutinized public contender. The critical caveat is that the reviewed set still does not provide a fully reconciled cap table, liquidation stack, or board-rights map.
