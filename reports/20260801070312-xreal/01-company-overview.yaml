- id: milestones-market-position-and-emerging-risks
  title: Milestones, market position, and emerging risks
  body: 'XREAL''s milestone record also supports a real claim to category leadership, while leaving important adverse signals attached to the story. Official materials trace a sequence from the 2019 Nreal Light CES debut, to the 2020 Wuxi optical-module factory, to 2021''s XREAL Air and NebulaOS, 2023''s rebrand and Air 2 / Beam cycle, 2024''s Beam Pro, Air 2 Ultra, and X1-powered One platform, and 2026''s 1S, Project Aura, ROG XREAL R1, and HKEX filing. The about page says XREAL held the number-one global AR-glasses revenue position for 2022 through 2025, and IDC independently shows the company still ranked in the global top five of the broader smart-glasses field in Q1 2026 even after Meta''s display-less AI-glasses surge. That is strong positioning evidence, but it is not the whole risk picture. Review sources still describe the product class as tethered and edge-case dependent, app-store reviews show software dissatisfaction among some real users, and XREAL''s own January 2026 patent
    suit against Viture underscores how defensibility in lightweight AR is now being contested in court as well as in stores. The right overview read is therefore leadership with pressure: XREAL looks like a real market leader inside a still-small and rapidly crowding category.'
