company:
  name: XREAL
chapter:
  number: 1
  title: Company Overview
  summary: XREAL is a 2017-founded Chinese AR-glasses company that rebranded from Nreal and now sits at the center of consumer display glasses, Android XR partnership hardware, and late-stage capital formation. The public record supports real category leadership and global reach, but governance depth, exact financing structure, and the economics behind the pending Hong Kong IPO still require direct diligence.
sections:
- id: identity-and-platform-shift
  title: Identity, founding context, and platform shift
  body: 'XREAL''s company identity is unusually legible for a private AR hardware startup because its official materials, partner announcements, and market-tracker coverage all tell the same broad story: this is the rebranded Nreal platform company founded by Dr. Chi Xu in 2017 and now positioned around consumer AR glasses, companion compute, and software that extends those devices into spatial-computing workflows. The official about page says the company designs, develops, manufactures, and markets AR eyewear alongside related hardware and software, while the career page updates the mission into a more explicit AI-and-spatial-computing thesis built around bringing AI into the physical world. That platform shift matters. XREAL is no longer describing itself as only a display accessory vendor; it is describing a full-stack product line that stretches from optical engines and on-glasses coprocessors to companion devices, Android XR hardware, and developer-facing spatial tools. Public sources
    also consistently place the company in China and describe a genuinely international commercial footprint, with official materials claiming retail presence in more than 40 countries and regions and Road to VR explicitly labeling XREAL a Beijing, China-based XR glasses maker.'
