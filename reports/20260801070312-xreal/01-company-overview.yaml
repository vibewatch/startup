callouts:
- calloutType: insight
  title: XREAL is evolving from display-glasses pioneer to ecosystem hardware specialist
  body: The strongest through-line across the reviewed sources is not just “AR glasses.” It is XREAL's move from tethered display hardware toward a fuller stack of chips, optics, companion compute, Android XR partnership devices, and channel-specific variants such as gaming glasses. That broadening is strategically important because it reduces the risk that XREAL remains only a niche portable-monitor brand.
  claimRefs:
  - CO004
  - CO005
  - CO013
  - CO015
  - CO031
  - CO034
- calloutType: risk
  title: Public leadership and product visibility are ahead of governance transparency
  body: XREAL's founder, products, and partnerships are easy to verify; its board structure, investor rights, and exact treasury position are not. That asymmetry is tolerable for a private growth company, but it becomes more material as the business moves toward an IPO and asks investors to underwrite not only optical leadership but also governance quality and capital discipline.
  claimRefs:
  - CO010
  - CO011
  - CO022
  - CO024
  - CO027
  - CO028
