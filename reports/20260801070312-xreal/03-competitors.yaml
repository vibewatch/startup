chapter:
  number: 3
  title: Competitors
  summary: XREAL sits in a contested middle lane between screenless AI glasses and heavier spatial-computing headsets. Its nearest competition comes from lightweight display-glasses peers such as Rokid, RayNeo, Vuzix, and Viture-style products, but the strategic ceiling is shaped by Meta, Apple, Google, and Snap, which control larger ecosystems and distribution.
sections:
- id: landscape-and-classes
  title: Landscape, product classes, and likely entrants
  body: 'XREAL competes in a landscape that is crowded only if one ignores product-class boundaries. The closest direct competitors are other lightweight display or AR-glasses vendors such as Rokid, RayNeo, Vuzix, and Viture-style products that promise private displays, translation, or light AR in a glasses form factor. Meta''s Ray-Ban line sits one layer adjacent: it dominates screenless AI glasses and is training consumers to wear connected eyewear, but its current value proposition is different from XREAL''s private-screen and display-led story. Apple Vision Pro and future Apple wearables are even further up the immersion and price stack, yet they matter because they define aspirational spatial-computing expectations. Snap Spectacles is more developer-first than mass-market today. The practical conclusion is that XREAL has a credible direct-peer set in lightweight display glasses, but its strategic ceiling is set by platform giants whose budgets, distribution, and developer reach are
    far larger.'
