- id: distribution-and-switching-costs
  title: Distribution, platform power, and switching costs
  body: Distribution and switching costs currently favor the largest ecosystems rather than the best standalone optics. Meta benefits from Ray-Ban and Oakley eyewear branding, while Apple benefits from a massive installed base, retail presence, and operating-system control. Google is extending Android XR with XREAL and Samsung, which can help XREAL, but it also means the platform layer will not be controlled by XREAL. In XREAL's current category, switching costs are still relatively low because many buyers are choosing an accessory-like hardware product for a few key jobs—gaming, travel video, portable productivity, or developer experimentation. Multi-homing is plausible, especially for enthusiasts. Over time, switching costs could rise if app ecosystems, prescription support, accessories, cloud AI, enterprise workflows, and saved-device preferences deepen. Today, however, distribution, brand trust, software leverage, and control of the surrounding ecosystem are more defensible moats than any one hardware specification, which is why platform owners deserve more underwriting weight than spec-sheet winners.
  claimRefs:
  - CP019
  - CP020
  - CP021
  - CP022
  - CP023
  - CP024
  - CP025
  - CP026
