- id: TM005
  title: Substitute and ecosystem control points
  columns:
  - Control point / substitute
  - Current owner or class
  - Why buyers care
  - How it affects XREAL
  rows:
  - - AI assistant layer
    - Meta / Google / others
    - Determines what the glasses actually help users do
    - XREAL benefits if Android XR closes the software gap
  - - Compute host / phone / puck
    - User device or partner platform
    - Determines compatibility and friction
    - XREAL still depends on external compute in many workflows
  - - Eyewear distribution and fit
    - Meta-Essilor, retail optics, direct channels
    - Determines trial, prescription access, and mainstream acceptance
    - XREAL must build or borrow distribution trust
  - - Content and app ecosystem
    - Google Play, Android XR developers, media services
    - Determines repeat use beyond demos
    - Critical for Aura and Beam Pro differentiation
  - - Status-quo screen stack
    - Phone, laptop, TV, monitor, console
    - Defines whether glasses offer enough incremental utility
    - XREAL wins only when it is better than carrying another screen
  notes: These control points matter because XREAL does not own every layer of the buyer journey.
