tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / market lens
  - Included spend
  - Excluded spend
  - Why it matters for XREAL
  rows:
  - - Broad AR market
    - AR hardware, software, services, vertical apps, and related immersive stacks across enterprise and consumer
    - Non-AR electronics are out, but scope still includes many categories XREAL does not sell into directly
    - Useful only as a thematic upper bound, not as an underwriting market for XREAL
  - - Smart glasses without displays
    - Camera, audio, and AI-first glasses such as Meta-style products
    - Display-equipped tethered glasses and headsets
    - Important because this is the volume category teaching consumers to wear glasses daily, but it is not XREAL's strongest current lane
  - - Wearable display glasses
    - Private-screen glasses for video, work, and gaming
    - Headsets, camera AI glasses, and software-only spend
    - This is XREAL's clearest current commercial wedge
  - - Spatial AR / optical see-through glasses
    - World-aware display glasses with sensors, hand tracking, and spatial anchors
    - Heavier passthrough headsets and non-see-through wearables
    - This is the strategic future lane for Aura and parts of the developer story
  - - Enterprise AR/VR workflow budgets
    - Training, remote support, immersive productivity, and industrial guidance spending
    - General software services and hardware categories not compatible with glasses-shaped deployments
    - Helpful for pilot demand, but only a subset is reachable by XREAL's current form factors
  - - Status-quo substitutes
    - Laptops, tablets, monitors, TVs, smartphones, handheld consoles, and traditional eyewear
    - Purely conceptual future devices
    - These substitutes define the real switching test buyers face today
  notes: The core boundary choice is to separate XREAL's display and spatial-computing jobs from the broader AI-camera-glasses narrative and from full AR software TAMs.
