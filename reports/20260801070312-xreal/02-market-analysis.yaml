- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Why it matters
  - Evidence status
  - Implication for XREAL
  rows:
  - - Meta-funded consumer education
    - driver
    - Normalizes wearing glasses-shaped AI devices in public
    - Well supported by IDC and official Meta materials
    - Helps the whole category, even when XREAL is not the unit-share leader
  - - Android XR ecosystem build-out
    - driver
    - Improves app surface, developer interest, and platform legitimacy for display and OST devices
    - Well supported by Google and XREAL materials
    - Direct upside for Aura and broader ecosystem relevance
  - - Better optics and lighter form factors
    - driver
    - Makes display glasses more usable for travel, work, and gaming
    - Supported by XREAL, Smartscope, and review context
    - Supports premium private-screen positioning
  - - Enterprise training / productivity budgets
    - driver
    - Creates workflow demand beyond entertainment
    - Supported generally by HBR and PwC
    - Useful but narrower than full enterprise XR narratives imply
  - - Tethering and companion-device dependence
    - constraint
    - Limits simplicity compared with standalone or screenless devices
    - Explicit in XREAL product pages and market commentary
    - Raises friction for mainstream adoption
  - - Price and premium positioning
    - constraint
    - Display and spatial glasses remain costlier than basic AI glasses
    - Visible across official product pages
    - Keeps XREAL closer to premium/prosumer buyers
  - - Category fragmentation
    - constraint
    - Buyers still confuse AI glasses, HUDs, wearable displays, and headsets
    - Strongly supported by Smartscope and IDC
    - Creates education burden and comparability noise
  - - Crowding from Meta, Google, Snap, and Chinese peers
    - constraint
    - Competitive attention and platform power can dilute differentiation quickly
    - Strongly supported by IDC, Smartscope, CNBC, and official launches
    - XREAL must defend niche leadership while giants enter adjacent lanes
  notes: The driver set is real, but several drivers benefit the category more broadly than they guarantee XREAL-specific value capture.
