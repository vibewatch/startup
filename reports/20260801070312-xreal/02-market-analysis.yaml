callouts:
- calloutType: risk
  title: Broad AR TAMs are directionally useful but operationally misleading for XREAL
  body: The market around XREAL looks huge only when software, services, and many non-comparable hardware categories are bundled together. For underwriting, the relevant lens is the smaller display and spatial-computing device wedge where XREAL actually competes.
  claimRefs:
  - CM010
  - CM011
  - CM012
  - CM015
- calloutType: insight
  title: XREAL benefits from category growth even when other companies lead the top of funnel
  body: Meta's and Google's scale may do more to normalize glasses-shaped computing than XREAL could do alone. That can still help XREAL if it keeps a differentiated value proposition around private screens, gaming, and spatial productivity rather than trying to mimic every AI-camera use case.
  claimRefs:
  - CM004
  - CM029
  - CM030
  - CM031
  - CM039
