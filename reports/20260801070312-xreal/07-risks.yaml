chapter:
  number: 7
  title: Risks
  summary: XREAL's risk stack is dominated by privacy and social-license ambiguity around camera-enabled glasses, capital intensity heading into an IPO attempt, and dependence on platform, channel, and ecosystem partners. Public evidence shows real mitigations—improving margins, active IP defense, and strong partners—but the residual underwriting burden remains high because software quality, data-governance specificity, and concentration are still only partially disclosed.
sections:
- id: regulatory-legal-and-privacy-risk
  title: Regulatory, legal, privacy, and IP risk
  body: XREAL does not appear to face a single existential licensing blocker today, but its risk surface is widening as the company expands from display glasses into camera, software, and Android XR workflows while also preparing an IPO. The formal regulatory backdrop matters. China's 2022–2026 virtual-reality action plan shows the category is policy-supported, yet that same industrial framing implies growing scrutiny as AR devices move from enthusiast hardware toward mass-market electronics. In parallel, the EU AI Act, ICO surveillance guidance, and FTC privacy-security materials all show that face-worn devices become materially more sensitive once they capture biometric, video, or health-adjacent data. XREAL's own public policy pages do not yet make it easy to inspect device-specific obligations in the fetched snapshots, which is itself a disclosure risk rather than proof of noncompliance. The litigation record adds another layer. XREAL is actively enforcing patents against Viture in the
    U.S. after a Germany injunction, which supports moat claims but also proves that the category is contested enough to generate multi-jurisdiction IP expense and distraction right as the company is trying to convince public-market investors it is ready for broader scrutiny.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR009
  - CR010
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-quality-and-support-risk
  title: Operational, quality, software, and support risk
  body: 'Operationally, XREAL still looks more like a hardware-and-companion stack than a finished consumer platform with abundant margin for error. IPO-era reporting says most revenue still comes from AR glasses hardware and that category leadership translates into a relatively modest revenue base, which means every major product cycle carries disproportionate weight. The portfolio has also broadened at the same time: One Pro, 1S, Beam Pro, Aura, apps, and developer surfaces all need compatibility, support, and release discipline. Public support signals are mixed rather than disastrous. The company maintains visible support and community surfaces, and Google Play shows active updates in 2026, but the Apple App Store snapshot still displayed weak ratings. That combination suggests XREAL is shipping and maintaining real products, yet software quality remains tightly linked to hardware satisfaction and return risk. Because glasses often depend on companion apps, host-device compatibility,
    or accessory workflows, a software regression can damage adoption far beyond a normal consumer gadget update.'
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
