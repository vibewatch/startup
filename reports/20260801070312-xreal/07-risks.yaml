  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: device-level-privacy-and-security-controls
    missingEvidence: The public record does not expose product-specific data-flow maps, telemetry retention rules, incident response commitments, or jurisdiction-by-jurisdiction privacy terms for XREAL devices.
    whyItMatters: If XREAL expands camera, biometric, or AI-heavy features, these controls become material to legal exposure, customer trust, and post-incident cost.
    diligencePath: Request the current privacy architecture, region-specific customer terms, telemetry retention schedule, vendor list, and incident-response playbook for each active product family.
    relatedQuestionRefs:
    - QR003
    - QR004
    - QR005
    - QR006
    - QR025
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: quality-retention-and-return-metrics
    missingEvidence: There is no public dataset for return rates, defect rates, crash rate, ticket backlog, cohort retention, or repurchase behavior by channel or product generation.
    whyItMatters: Without durability metrics, improving gross margin and visible retail expansion can mask support drag, refund exposure, and weak long-term product satisfaction.
    diligencePath: Request product-level RMA rate, return reasons, crash-free sessions, support response times, and repeat purchase by major geography and channel.
    relatedQuestionRefs:
    - QR013
    - QR014
    - QR016
    - QR028
    - QR029
    relatedTableRefs:
    - TR002
    - TR005
  - type: enumeration-incomplete
    severity: minor
    topic: partner-and-channel-concentration
    missingEvidence: Public sources confirm major partners and channels but do not quantify revenue concentration, contractual dependence, or substitutability across Google, ASUS, Amazon, Best Buy, app stores, and direct web sales.
    whyItMatters: Concentration determines how much pricing power, growth, and product discoverability XREAL truly controls itself versus renting from third-party ecosystems.
    diligencePath: Request partner revenue share, contract duration, exclusivity terms, channel margin, traffic split, and contingency plans if one major partner or retailer underperforms.
    relatedQuestionRefs:
    - QR017
    - QR018
    - QR019
    - QR020
    - QR027
    relatedTableRefs:
    - TR003
    - TR005
