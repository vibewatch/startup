- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Software-quality drag
    - Companion-app ratings, support backlog, or return complaints worsen
    - No visible ratings improvement or support transparency by next major product cycle
    - Delay conviction until QA and retention evidence improve
  - - Partner concentration
    - Google / ASUS / retail partner narrative weakens
    - Aura slips materially, co-brand fades, or channel breadth narrows
    - Lower growth assumptions and require direct-demand proof
  - - Financing / IPO dependence
    - Listing does not progress or cash cushion appears tighter
    - IPO stalls without alternative capital plan or updated treasury disclosure
    - Assume down-round / bridge risk and haircut valuation support
  - - Regulatory / privacy escalation
    - Camera / recognition features face policy backlash or enforcement interest
    - Evidence of complaints, restrictions, or rushed policy rewrites
    - Demand privacy-by-design and jurisdictional legal memos before underwriting
  - - Moat erosion
    - Viture-style IP defense fails to preserve differentiation while big-tech rivals scale
    - Litigation drags on with little strategic benefit and competitor gap narrows
    - Treat moat as weaker and emphasize price discipline or pass
  notes: These kill criteria are designed to be trackable from the outside rather than requiring perfect private-company disclosure.
