- id: partner-platform-and-channel-risk
  title: Partner, platform, ecosystem, and channel risk
  body: XREAL's best visible growth catalysts are also major dependencies. Android XR and Aura give the company a powerful narrative upgrade, but they also make Google's platform priorities, release timing, and policy decisions more important to XREAL's roadmap. ASUS extends XREAL into gaming with the ROG XREAL R1, while retail proof across Best Buy and Amazon shows mainstreaming, but those wins also concentrate discovery and merchandising power in third-party surfaces. Qualcomm and the broader XR silicon ecosystem influence the pace and baseline capability of competing devices even when XREAL uses its own X1 family as a differentiation story. This is not a reason to avoid the company; rather, it means investors should treat partner strength and partner dependence as the same fact viewed from two angles. XREAL has enough partner validation to prove relevance, but not enough public disclosure to underwrite how replaceable those routes to market really are if one major platform, co-brand,
    or channel changes strategy.
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
