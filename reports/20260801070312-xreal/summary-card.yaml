  topStrengths:
    - Category leadership in independent consumer AR glasses with real products and global retail circulation
    - Strategic upside from Google Android XR partnership and ASUS gaming collaboration
    - Improving 2025 gross margin and more credible product mix than many earlier AR hardware startups
    - Public evidence base is stronger than average for a private AR hardware company
  topRisks:
    - Revenue remains heavily hardware-led in a category that is still small and operationally demanding
    - Retention, channel concentration, support quality, and product-level unit economics remain under-disclosed
    - IPO timing and financing flexibility are still uncertain despite the published Application Proof
    - Partner and platform dependence can capture narrative upside while leaving XREAL with execution burden
  unresolvedGaps:
    - Product-level gross margin, working-capital dynamics, and cash runway under different IPO outcomes
    - Cohort retention, repeat purchase, return rates, and support-ticket burden by channel and product line
    - Channel concentration and the exact revenue contribution of Google, ASUS, Amazon, Best Buy, and direct web
    - Cap-table, preference stack, and full IPO-readiness package
