  - - Confidence
    - Medium
    - Evidence quality is better than for many private hardware startups, but still incomplete on retention and economics
    - Keep position-sizing conservative
  - - Risk rating
    - High
    - Hardware concentration, partner dependence, and IPO uncertainty remain material
    - Require milestone-based underwriting
  - - Valuation stance
    - Fair
    - Current public mark already reflects leadership and optionality, but not enough margin of safety
    - Prefer discount or stronger proof before upgrading
  - - Decision trigger
    - Upgrade only on proof or price
    - Need better retention, channel, and cash-runway disclosure or a meaningfully lower entry price
    - No buy call today
  notes: 'The summary view is intentionally price-sensitive: XREAL can be strategically exciting while still being only fairly priced on present evidence.'
