- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Support
  - What would change the view
  rows:
  - - Mass-market AR-glasses leader
    - XREAL shows live products, premium retail surfaces, and category-share claims
    - Need audited or filing-grade proof that leadership converts into durable earnings power
  - - Android XR and partner optionality
    - Google, ASUS, and Aura expand strategic upside beyond legacy display glasses
    - Need evidence that partner buzz becomes recurring demand rather than one-off launches
  - - Hardware concentration still dominates
    - 2025 revenue mix remains mostly glasses-led with limited software diversification
    - A clearer services or ecosystem monetization layer would improve the thesis
  - - Retention and support are under-disclosed
    - App, support, and return data are still too sparse for premium underwriting
    - Cohort retention, return rates, and ticket data would justify more confidence
  - - IPO can unlock capital but not by itself de-risk the model
    - Listing progress helps financing flexibility, but public markets can also compress hardware multiples
    - A successful listing plus better fundamentals could move valuation support higher
  notes: 'The investment case is not one-sided: the same facts that create upside also explain why investors should demand valuation discipline.'
