    - TV006
  - type: missing-source
    severity: material
    topic: retention-and-channel-durability
    missingEvidence: No public cohort retention, repeat purchase, return-rate, refund-rate, or channel-level profitability dataset is available for XREAL.
    whyItMatters: Valuation depends on whether sell-through becomes durable repeat demand or simply expensive hardware acquisition with heavy post-sales burden.
    diligencePath: Request retention by cohort, channel margin, refund rates, attach rates for Beam Pro and accessories, and support-ticket recurrence.
