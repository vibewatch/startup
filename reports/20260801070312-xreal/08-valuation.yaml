- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: Rows are selected to bracket XREAL using public wearable, smart-glasses, eyewear, and diversified-electronics references; they are not strict like-for-like peers and should be read as directional anchors only.
  columns:
  - Comparable
  - Current metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Vuzix
    - Pure-play smart-glasses public comp
    - ~$0.19B market cap in Aug 2026
    - Closest public AR-wearables reference for downside hardware economics
    - Enterprise skew and weaker consumer profile than XREAL
  - - Snap
    - Consumer-platform company with Spectacles program
    - ~$7.77B market cap in Aug 2026
    - Shows how wearable optionality can live inside a much larger consumer network
    - Ad-tech and social-platform model make it a poor direct multiple comp
  - - Warby Parker
    - Public eyewear brand
    - ~$3.27B market cap in Aug 2026
    - Useful for branded consumer-eyewear distribution context
    - No AR software or spatial-computing upside
  - - Xiaomi
    - Scaled consumer-electronics vendor
    - ~$94.80B market cap in Aug 2026
    - Illustrates what diversified hardware breadth can command
    - Far broader product base than XREAL
  - - Sony
    - Diversified electronics and entertainment platform
    - ~$136.59B market cap in Aug 2026
    - Shows how ecosystem, content, and hardware can reinforce valuation
    - Too diversified and mature for direct peer use
  - - VITURE private funding context
    - Private XR competitor
    - Raised over $200M within six months by Feb 2026
    - Confirms private capital still backs independent XR stories
    - Financing data is not valuation or operating-quality proof
  notes: 'The comp set argues against both extremes: XREAL is worth more than a failing gadget maker but less than a proven platform or diversified electronics franchise.'
