- id: final-verdict-and-diligence-path
  title: Final verdict, kill triggers, and next diligence path
  body: 'The best current investment stance is therefore track with medium confidence and high risk. XREAL has enough substance to stay on the shortlist: it is not merely a speculative optics story, because public evidence shows products, partners, retail surfaces, litigation-backed IP claims, and filing activity. However, current buyers would still be underwriting a transition that has not fully happened yet—from premium hardware vendor to durable public-market spatial-computing company. What moves the call upward is not another headline partnership on its own but better evidence on repeat use, product-level gross margin, channel concentration, post-sales support quality, and cash runway through or beyond the IPO window. What breaks the call is also clear: if the IPO stalls, software friction persists, or partners capture most of the narrative upside while XREAL keeps the operating burden, the valuation can compress quickly. That is why the report lands on fair rather than cheap and on
    track rather than buy today overall.'
