- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - IPO / financing slippage
    - Listing process stalls without clear alternative capital plan
    - Narrative premium collapses into runway concerns
    - Move from track to avoid unless price resets
  - - Support / retention disappointment
    - No evidence of better app quality, returns, or repeat use through next product cycle
    - Premium-hardware story loses durability
    - Do not underwrite multiple expansion
  - - Partner-concentration shock
    - Google, ASUS, or major retail channels lose momentum or narrow exposure
    - Optionality weakens while dependency remains
    - Cut bull-case probability sharply
  - - Margin reversal
    - Gross-margin gains stall or reverse as mix or support costs worsen
    - Hardware economics look less scalable than hoped
    - Value closer to smaller public-hardware peers
  - - Category-scale failure
    - Leadership persists but total AR demand stays niche
    - Revenue ceiling arrives before platform economics form
    - Treat current mark as too full
  notes: Each trigger is observable enough that investors can revisit the call quickly as new data arrives.
  claimRefs:
  - CV023
  - CV026
  - CV029
  - CV034
  - CV038
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Product-level margin
    - Gross margin by Air, One, Aura, and accessories
    - Needed to know whether margin gains are durable or just mix-driven
    - Request current internal product P&L bridge
  - - Cash runway and financing plan
    - Updated treasury, burn, and fallback capital path if IPO timing slips
    - Determines downside financing risk and dilution pressure
    - Request latest board deck or treasury summary
  - - Retention and repeat purchase
    - Cohort usage, upgrade, return, and refund behavior
    - Separates sell-through from durable demand quality
    - Request cohort table by product generation and channel
  - - Channel concentration
    - Revenue and traffic split across direct, Amazon, Best Buy, Google, ASUS, and others
    - Shows who really owns growth and margin
    - Request channel mix, gross margin, and contract summary
  - - Support quality
    - Ticket volumes, response times, crash rates, and defect data
    - Public app/store signals are too noisy to price accurately
    - Request support and QA dashboard
  - - IPO readiness
    - Latest filing timetable, audit/compliance status, and preference overhang
    - Critical for exit timing and late-stage entry discipline
    - Request legal / finance workback plan and cap-table summary
  notes: The report can move from track to stronger conviction only if these diligence asks close the biggest evidence gaps in economics, durability, and financing.
