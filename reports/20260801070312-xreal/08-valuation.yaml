  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-runway
    missingEvidence: The public record still lacks a full audited view of product-level gross margin, working capital, cash runway under different IPO timing outcomes, and preference overhang.
    whyItMatters: Without those numbers, investors cannot know whether the current valuation reflects sustainable economics or merely a temporary premium hardware mix plus financing optionality.
    diligencePath: Request the latest cap table, treasury bridge, product P&L by line, gross-to-net waterfall, and financing contingency plan.
    relatedQuestionRefs:
    - QV003
    - QV004
    - QV021
    - QV025
    relatedTableRefs:
