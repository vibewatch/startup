- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - IPO progresses, Aura / Android XR launch lands well, partner channels deepen, and margin keeps improving
    - Supports roughly $1.3B-$1.8B as narrative and economics both improve
    - Execution slippage or partner dependence still matter
    - Requires visible milestone conversion, not just press momentum
  - - Base
    - XREAL remains independent category leader but with modest market scale and limited software monetization
    - Supports roughly $0.9B-$1.1B and implies fair current pricing
    - Small-market ceiling and ongoing losses cap upside
    - Most consistent with current public evidence
  - - Bear
    - IPO slips, support friction persists, and public investors benchmark XREAL closer to weaker hardware peers
    - Supports roughly $0.4B-$0.7B on multiple compression and financing stress
    - Channel or partner concentration magnifies downside
    - Triggered by delayed financing or weak post-launch proof
  notes: The scenario spread is deliberately wide because public evidence is meaningful but still incomplete.
