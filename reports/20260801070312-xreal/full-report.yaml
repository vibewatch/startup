            body: >-
              Operationally, XREAL still looks more like a hardware-and-companion stack than a finished consumer
              platform with abundant margin for error. IPO-era reporting says most revenue still comes from AR glasses
              hardware and that category leadership translates into a relatively modest revenue base, which means every
              major product cycle carries disproportionate weight. The portfolio has also broadened at the same time:
              One Pro, 1S, Beam Pro, Aura, apps, and developer surfaces all need compatibility, support, and release
              discipline. Public support signals are mixed rather than disastrous. The company maintains visible support
              and community surfaces, and Google Play shows active updates in 2026, but the Apple App Store snapshot
              still displayed weak ratings. That combination suggests XREAL is shipping and maintaining real products,
              yet software quality remains tightly linked to hardware satisfaction and return risk. Because glasses
              often depend on companion apps, host-device compatibility, or accessory workflows, a software regression
              can damage adoption far beyond a normal consumer gadget update.
