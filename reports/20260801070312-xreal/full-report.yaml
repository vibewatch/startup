  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The key market-definition mistake for XREAL is to treat every number attached to “AR,” “XR,” or “smart
              glasses” as equally relevant. The reviewed sources make clear that several different device markets are
              being collapsed into one label. Smartscope splits the 2026 field into audio glasses, camera AI glasses,
              HUD glasses, wearable displays, and spatial AR glasses. IDC separately reports explosive growth in
              display-less smart glasses, while its AR/VR tracker treats display-equipped optical-see-through devices as
              a distinct segment. That distinction matters because XREAL is strongest today in wearable display and
              display-enabled spatial-computing jobs, not in the camera-first AI-glasses lane dominated by Meta. CNBC
              captures the buyer-facing difference well: XREAL and Rokid can position their products as portable TVs or
              work monitors, which is a materially different purchase trigger from buying glasses mainly for image
              capture and voice AI. The official XREAL pages reinforce that boundary. One Pro is a private large-screen
              device, Beam Pro is a companion spatial-computing terminal, and Aura is a developer-leaning Android XR
              spatial-computing product. Broad AR TAMs therefore overstate XREAL's realistic near-term market unless
              they are stepped down to the device classes and jobs the company actually serves.
            claimRefs:
