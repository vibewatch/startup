  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, privacy, and IP risk
        blocks:
          - type: paragraph
            body: >-
              XREAL does not appear to face a single existential licensing blocker today, but its risk surface is
              widening as the company expands from display glasses into camera, software, and Android XR workflows while
              also preparing an IPO. The formal regulatory backdrop matters. China's 2022–2026 virtual-reality action
              plan shows the category is policy-supported, yet that same industrial framing implies growing scrutiny as
              AR devices move from enthusiast hardware toward mass-market electronics. In parallel, the EU AI Act, ICO
              surveillance guidance, and FTC privacy-security materials all show that face-worn devices become
              materially more sensitive once they capture biometric, video, or health-adjacent data. XREAL's own public
              policy pages do not yet make it easy to inspect device-specific obligations in the fetched snapshots,
              which is itself a disclosure risk rather than proof of noncompliance. The litigation record adds another
              layer. XREAL is actively enforcing patents against Viture in the U.S. after a Germany injunction, which
              supports moat claims but also proves that the category is contested enough to generate multi-jurisdiction
              IP expense and distraction right as the company is trying to convince public-market investors it is ready
              for broader scrutiny.
            claimRefs:
