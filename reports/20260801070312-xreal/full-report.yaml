      - number: '4.3'
        title: Cost structure, unit-economics proxies, and margin path
        blocks:
          - type: paragraph
            body: >-
              The cost structure implied by the source set is exactly what investors should expect from a
              capital-intensive consumer-hardware company trying to behave like a future platform. 36Kr's summary of the
              application proof shows improving gross margin—from 18.8% in 2023 to 35.2% in 2025—but still reports large
              adjusted losses, meaningful selling expense, heavy R&D, and tight cash. It also shows the product mix
              moving away from lower-priced Air units toward higher-priced One-series devices, which helps gross margin
              but can also signal a small market relying on premium mix rather than broad entry-level volume. Chinabiz
              strengthens the concern by describing stagnant annual shipment volume around 130,000 units despite better
              margin. The cost burden is not only bill-of-materials. XREAL is carrying optical R&D, custom chip work,
              software support, global operations, inventory, after-sales service, and ecosystem partnership costs.
              Vuzix's 2025 10-K is a useful cautionary peer: pure-play smart-glasses vendors can still carry gross
              losses, inventory obsolescence charges, and prolonged net losses even with real products in market.
              XREAL's own improvement trend is encouraging, but the public record still points to a business whose
              economics are improving faster than its cash cushion.
