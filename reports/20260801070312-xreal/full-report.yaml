  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, product classes, and likely entrants
        blocks:
          - type: paragraph
            body: >-
              XREAL competes in a landscape that is crowded only if one ignores product-class boundaries. The closest
              direct competitors are other lightweight display or AR-glasses vendors such as Rokid, RayNeo, Vuzix, and
              Viture-style products that promise private displays, translation, or light AR in a glasses form factor.
              Meta's Ray-Ban line sits one layer adjacent: it dominates screenless AI glasses and is training consumers
              to wear connected eyewear, but its current value proposition is different from XREAL's private-screen and
              display-led story. Apple Vision Pro and future Apple wearables are even further up the immersion and price
              stack, yet they matter because they define aspirational spatial-computing expectations. Snap Spectacles is
              more developer-first than mass-market today. The practical conclusion is that XREAL has a credible
              direct-peer set in lightweight display glasses, but its strategic ceiling is set by platform giants whose
              budgets, distribution, and developer reach are far larger.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
