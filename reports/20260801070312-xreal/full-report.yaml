      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: XREAL is not competing for exactly the same purchase as Meta or Apple
            body: >-
              Meta is winning camera-first AI eyewear while Apple defines premium spatial-computing headsets. XREAL's
