  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product line, modules, and customer workflow jobs
        blocks:
          - type: paragraph
            body: >-
              XREAL's product surface is easier to understand as a workflow stack than as a single headset substitute.
              One Pro and 1S anchor the current display-glasses line around private screens, travel entertainment,
              gaming, and lightweight spatial use. Beam Pro functions as the companion control and app plane, extending
              the glasses into a broader spatial-computing setup with Google Play access, 3D capture, and
              always-available apps. Aura then pushes the stack further toward optical-see-through spatial computing
              with Android XR, Gemini, and a split-compute architecture. The result is a portfolio that spans at least
              three technical jobs: wearable display glasses, companion-device spatial computing, and developer-leaning
              Android XR hardware. That breadth is a strength because it lets XREAL address consumer media, prosumer
              work, gaming, and future platform bets with related hardware. It is also a complexity cost because each
              layer adds support, software, compatibility, and product-maturity obligations that are more difficult than
              selling one static screen accessory.
