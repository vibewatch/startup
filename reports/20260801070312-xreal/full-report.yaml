  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Underwriting posture and entry discipline
        blocks:
          - type: paragraph
            body: >-
              XREAL has crossed the threshold from concept company to real commercial platform candidate, which is why
              the valuation question is meaningful rather than hypothetical. Public evidence supports live products,
              visible retail circulation, improving gross margin, Android XR partnership optionality, and an active IPO
              attempt. But the same record also shows why the company should not be treated like a de-risked platform
              asset. Revenue is still relatively small for the ambition, the business remains predominantly glasses-led,
              and software quality or retention proof is incomplete. That mix argues for disciplined underwriting.
              Investors are paying for the right to believe XREAL can become the leading independent AR-glasses public
              company, not for a business that has already proven durable consumer-platform economics. On current
              evidence, that supports a track recommendation and a fair valuation stance: interesting enough to follow
              closely, not sufficiently de-risked to chase at any price.
            claimRefs:
