      - number: '8.3'
        title: Bull, base, and bear range analysis
        blocks:
          - type: paragraph
            body: >-
              Because the public dataset is incomplete, scenario valuation is more honest than any point estimate
              pretending to precision. The bull case assumes XREAL converts Android XR partnership into real product
              momentum, progresses the IPO, expands mainstream retail and partner-led demand, and keeps gross margin
              moving in the right direction. The base case assumes the company remains the most credible independent
              AR-glasses brand but continues to operate inside a niche category with limited software monetization and
              ongoing execution drag. The bear case assumes IPO slippage, multiple compression toward smaller public
              hardware peers, and continued ambiguity around customer durability or support friction. Those scenarios
              produce a range wide enough to respect uncertainty while still centering the current public mark as
              roughly fair. Put differently, upside exists, but much of it still depends on narrative conversion into
              financial proof rather than on already-demonstrated scaled economics.
            claimRefs:
              - CV021
