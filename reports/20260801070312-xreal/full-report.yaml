chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding context, and platform shift
        blocks:
          - type: paragraph
            body: >-
              XREAL's company identity is unusually legible for a private AR hardware startup because its official
              materials, partner announcements, and market-tracker coverage all tell the same broad story: this is the
              rebranded Nreal platform company founded by Dr. Chi Xu in 2017 and now positioned around consumer AR
              glasses, companion compute, and software that extends those devices into spatial-computing workflows. The
              official about page says the company designs, develops, manufactures, and markets AR eyewear alongside
              related hardware and software, while the career page updates the mission into a more explicit
              AI-and-spatial-computing thesis built around bringing AI into the physical world. That platform shift
              matters. XREAL is no longer describing itself as only a display accessory vendor; it is describing a
              full-stack product line that stretches from optical engines and on-glasses coprocessors to companion
              devices, Android XR hardware, and developer-facing spatial tools. Public sources also consistently place
              the company in China and describe a genuinely international commercial footprint, with official materials
              claiming retail presence in more than 40 countries and regions and Road to VR explicitly labeling XREAL a
              Beijing, China-based XR glasses maker.
