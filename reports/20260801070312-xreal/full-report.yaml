        title: Exhibits
        blocks:
          - type: callout
            title: Broad AR TAMs are directionally useful but operationally misleading for XREAL
            body: >-
              The market around XREAL looks huge only when software, services, and many non-comparable hardware
              categories are bundled together. For underwriting, the relevant lens is the smaller display and
              spatial-computing device wedge where XREAL actually competes.
            calloutType: risk
            claimRefs:
