          - type: callout
            title: XREAL benefits from category growth even when other companies lead the top of funnel
            body: >-
              Meta's and Google's scale may do more to normalize glasses-shaped computing than XREAL could do alone.
              That can still help XREAL if it keeps a differentiated value proposition around private screens, gaming,
              and spatial productivity rather than trying to mimic every AI-camera use case.
