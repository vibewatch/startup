      - number: '2.2'
        title: Multiple sizing lenses and why they conflict
        blocks:
          - type: paragraph
            body: >-
              Public sizing lenses are useful only when kept separate. The broadest top-down numbers come from
              augmented-reality market reports, where Mordor puts the 2026 AR market at roughly $125.11 billion and
              Precedence lifts the 2026 figure to about $207.16 billion. Those totals are directionally helpful for
              long-run thematic growth, but they bundle software, services, vertical applications, headsets, and other
              hardware categories far beyond what XREAL directly monetizes. At the narrower device layer, Prof Research
              estimates the global smart-glasses market at roughly $7.5 billion to $12.5 billion in 2026. IDC then gives
              the most operationally useful segmentation: display-less smart glasses should reach about 13.6 million
              units and $5.1 billion in 2026, while optical see-through display glasses from players such as XREAL,
              Viture, and RayNeo should grow from roughly 3.0 million units in 2026 to 12.2 million by 2030. Treeview's
              estimate of 900,000 AR-display-glasses units in 2025 and about 325,000 2025 units for XREAL gives a still
              narrower, though less authoritative, cross-check. The right conclusion is not one magic TAM. It is that
              XREAL sits in a smaller but faster-defining device wedge inside a much larger and noisier AR narrative.
            claimRefs:
