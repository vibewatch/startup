      - number: '3.2'
        title: Capability overlap and product comparison
        blocks:
          - type: paragraph
            body: >-
              On capability, XREAL's strongest comparative position is in balancing portable display utility with a more
              glasses-like form factor than headsets. Official XREAL pages center giant-screen media, gaming, and
              spatial productivity; CNBC and review coverage reinforce that buyer job. Rokid and RayNeo overlap heavily
              on translation, media, and lightweight AR features, while Meta emphasizes camera, voice AI, and social
              capture instead of a virtual screen. Apple emphasizes full spatial computing in a heavier headset. Snap
              emphasizes developer creation. Vuzix remains more enterprise-skewed, as reflected in its 10-K and Z100
              positioning. That means XREAL is not trying to beat every rival at the same thing. It is trying to win a
              middle lane between all-day AI eyewear and high-end headsets. The risk is that this middle lane is
              precisely where features commoditize fastest once optics, chipsets, and Android XR software become more
              widely available.
