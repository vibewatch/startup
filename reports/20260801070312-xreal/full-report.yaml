      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              XREAL's buyer map is broader than a single “consumer gadget” label, but narrower than the broad
              AR-software universe. Official product pages and market commentary point to at least four live pathways.
              The first is self-pay entertainment and gaming users who want a large private screen for travel, console
              play, or media. The second is mobile knowledge workers and prosumers who want a private monitor, spatial
              workspace, or lightweight screen-extension device rather than a headset. The third is developers and early
              adopters pursuing Android XR, app experimentation, or spatial-computing workflows through Aura and
              developer tooling. The fourth is lighter-weight enterprise or pilot buyers who care about training, remote
              guidance, immersive productivity, or AI-assisted field workflows. HBR and PwC support the idea that
              enterprises do spend on AR/VR-enabled workflows, but that spend should not be confused with
              XREAL-reachable near-term demand; much of it lands in software, services, training, or heavier headsets
              rather than glasses-shaped displays. In practice, the market still looks self-pay and prosumer led, with
              enterprise demand more credible as a follow-on wedge than as the current core revenue pool.
            claimRefs:
              - CM020
              - CM021
              - CM022
              - CM023
