          - type: callout
            title: Public leadership and product visibility are ahead of governance transparency
            body: >-
              XREAL's founder, products, and partnerships are easy to verify; its board structure, investor rights, and
              exact treasury position are not. That asymmetry is tolerable for a private growth company, but it becomes
              more material as the business moves toward an IPO and asks investors to underwrite not only optical
              leadership but also governance quality and capital discipline.
