            body: >-
              Deployment quality depends on the control plane around the glasses at least as much as on the optics
              themselves. Support surfaces are visible: XREAL maintains a public support page, app listings, a Discord
              community, and developer docs. The downside is that public reliability signals are mixed. The App Store
              listing for the XREAL app showed a 1.9 out of 5 rating from 76 ratings in the reviewed snapshot, while the
              Google Play launcher page shows active 2026 maintenance but not the kind of broad public adoption data
              that would make support quality easy to underwrite. Third-party community signals point the same way. The
              XRLinuxDriver project exists because users want broader host-device support, especially on Linux and Steam
              Deck-like workflows, but its own page also makes clear that extra software layers are needed for fuller
              functionality. Together, these signals suggest that XREAL's hardware is commercially real and technically
              ambitious, yet routine usability still depends on firmware, companion software, documentation quality, and
