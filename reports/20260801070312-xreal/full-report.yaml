      - number: '8.2'
        title: Financing context and comparable set
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to value XREAL is through a hybrid lens rather than a single comp bucket. Pure-play
              public AR or smart-glasses names such as Vuzix show the downside case when investors focus on current
              hardware economics instead of category narrative. Giant platform companies such as Meta and Apple shape
              the strategic ceiling, but their market caps are too large and diversified to function as direct comps.
              Snap, meanwhile, is useful mainly as a reminder that consumer hardware narratives can coexist with much
              larger software and advertising models—again, not a direct comparison. Warby Parker, Xiaomi, and Sony help
              frame how public markets reward eyewear, hardware, or diversified consumer-electronics distribution, but
              each has a fundamentally broader or different cash-flow base than XREAL. The right conclusion is that
              XREAL deserves more credit than a struggling hardware pure-play if Android XR and premium distribution
              keep working, yet less than a platform multiple until revenue durability, retention, and financing
              flexibility are more legible.
            claimRefs:
              - CV011
