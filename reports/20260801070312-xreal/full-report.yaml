      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: XREAL is evolving from display-glasses pioneer to ecosystem hardware specialist
            body: >-
              The strongest through-line across the reviewed sources is not just “AR glasses.” It is XREAL's move from
              tethered display hardware toward a fuller stack of chips, optics, companion compute, Android XR
              partnership devices, and channel-specific variants such as gaming glasses. That broadening is
              strategically important because it reduces the risk that XREAL remains only a niche portable-monitor
              brand.
            calloutType: insight
            claimRefs:
              - CO004
