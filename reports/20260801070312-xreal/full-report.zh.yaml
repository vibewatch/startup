  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 产品级利润率
        - Air、One、Aura 和配件的毛利率
        - 需要判断利润率改善能否持续，还是只由产品组合驱动
        - 要求提供当前内部产品 P&L 桥表
      - - 现金续航与融资计划
        - 若 IPO 时间延后，需更新资金、烧钱速度和备用融资路径
        - 决定下行融资风险和稀释压力
        - 要求提供最新董事会材料或资金摘要
      - - 留存与复购
        - 队列使用、升级、退货和退款行为
        - 区分动销和持久需求质量
        - 要求按产品代际和渠道提供队列表
      - - 渠道集中度
        - 直营、Amazon、Best Buy、Google、ASUS 等渠道的收入和流量拆分
        - 显示增长和利润率真正由谁掌控
        - 要求提供渠道组合、毛利率和合同摘要
      - - 支持质量
        - 工单量、响应时间、崩溃率和缺陷数据
        - 公开 App / 商店信号噪声太大，无法准确定价
        - 要求提供支持和 QA 看板
      - - IPO 准备度
        - 最新申报时间表、审计 / 合规状态和优先清算权负担
        - 对退出时间和后期入场纪律至关重要
        - 要求提供法律 / 财务倒排计划和股权结构表
    notes: 只有上述尽调问题补上经济性、耐久性和融资上的最大证据缺口，本报告才能从跟踪转向更强信念。
    claimRefs:
      - CV030
      - CV035
      - CV036
      - CV039
      - CV040
