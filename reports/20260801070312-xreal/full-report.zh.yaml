            body: >-
              扩张潜力可见，但集中度和采购摩擦仍是开放尽调问题。XREAL 的扩张逻辑有三条明显分支：通过主流零售和线上直销做地域扩张；通过 Google 与 ASUS
              硬件或平台合作做生态扩张；通过创作者、玩家、移动专业人士和联网汽车用例做工作流扩张。同一组公开证据也暴露了集中风险。收入高度海外化，渠道证据越来越指向少数高可见度零售和平台表面——Amazon、Best
              Buy、Google、ASUS 以及公司自有直销渠道。这是获得触达的有效方式，但也意味着分发、定价和客户发现，可能比深厚自有企业客户簿更依赖伙伴行为。本章结论因此是平衡的。XREAL
              显然拥有活跃客户、主流零售证据和国际触达。公开证据仍无法回答的是：这些客户有多黏、收入按渠道或地域有多集中，以及装机基础里有多少是复购用户而非一次性早期采用者。
