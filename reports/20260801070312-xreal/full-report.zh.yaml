    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立背景与平台转向
        blocks:
          - type: paragraph
            body: >-
              在私营 AR 硬件创业公司里，XREAL 的公司身份相对清楚：官方材料、合作伙伴公告和市场追踪机构给出的主线基本一致——它就是由 Dr. Chi Xu 在 2017 年创立的 Nreal 平台公司，后来改名为
              XREAL，并围绕消费级 AR 眼镜、配套计算和软件，把设备延伸到空间计算工作流。官方 About 页面称，公司设计、开发、制造并营销 AR 眼镜及配套硬件和软件；招聘页面则把使命更新为更明确的 AI
              与空间计算命题，核心是把 AI 带入物理世界。这个平台转向很关键。XREAL 已不再只把自己描述成显示配件供应商，而是在描述一条全栈产品线：从光学引擎、眼镜端协处理器，到配套设备、Android XR
              硬件和面向开发者的空间工具。公开来源也持续把公司放在中国语境下，并描述其真实的国际商业版图：官方材料称零售覆盖超过 40 个国家和地区，Road to VR 也明确称 XREAL 是一家总部位于中国北京的 XR
              眼镜制造商。
