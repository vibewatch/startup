      - number: '2.2'
        title: 多种市场规模口径及其冲突原因
        blocks:
          - type: paragraph
            body: >-
              公开市场规模口径只有分开看才有用。最宽的自上而下数字来自增强现实市场报告，Mordor 估算 2026 年 AR 市场约 $125.11B，Precedence 则把 2026 年数字抬到约
              $207.16B。这些总量对长期主题增长有方向性帮助，但它们把软件、服务、垂直应用、头显和其他硬件类别都打包在一起，远超 XREAL 能直接变现的范围。在更窄的设备层，Prof Research 估算 2026
              年全球智能眼镜市场约 $7.5B 至 $12.5B。IDC 则给出最有操作意义的分割：无显示智能眼镜 2026 年应达到约 13.6M 台、$5.1B；而 XREAL、Viture、RayNeo
              等玩家所在的光学透视显示眼镜，应从 2026 年约 3.0M 台增长到 2030 年的 12.2M 台。Treeview 对 2025 年 AR 显示眼镜 900,000 台、XREAL 2025 年约
              325,000 台的估算，提供了更窄、但权威性较弱的交叉校验。正确结论不是一个神奇 TAM，而是：XREAL 位于一条更小、但轮廓加速清晰的设备楔形市场里，外层包着一个更大也更嘈杂的 AR 叙事。
