      - number: '8.3'
        title: 牛市、基准与熊市区间分析
        blocks:
          - type: paragraph
            body: >-
              公开数据集不完整，因此情景估值比假装精确的单点估值更诚实。牛市情景假设 XREAL 把 Android XR 合作转化为真实产品动能， 推动
              IPO，扩大主流零售与伙伴带来的需求，并继续改善毛利率。基准情景假设公司仍是最可信的独立 AR 眼镜品牌， 但继续困在软件变现有限、执行拖累仍在的小众品类里。熊市情景假设 IPO
              滑坡，估值倍数向较小上市硬件同行压缩， 客户耐久性或售后支持摩擦继续不清楚。这些情景给出的区间足够宽，能够尊重不确定性，同时仍把当前公开估值锚在大致公允的位置。
              换句话说，上行空间存在，但很大一部分仍取决于把叙事转化为财务证据，而不是已经跑出来的规模化经济性。
