      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >-
              XREAL 的买方地图比单一「消费电子」标签更宽，但比宽泛的 AR
              软件宇宙更窄。官方产品页和市场评论至少指向四条已经存在的路径。第一类是自费娱乐和游戏用户，他们想在旅行、主机游戏或影音场景中拥有一块私人巨幕。第二类是移动知识工作者和发烧级办公用户，他们想要私人显示器、空间工作区或轻量屏幕扩展设备，而不是头显。第三类是围绕
              Aura 和开发者工具做 Android XR、应用实验或空间计算工作流的开发者与早期用户。第四类是更轻量的企业或试点买方，他们关注培训、远程指导、沉浸式生产力或 AI 辅助现场工作流。HBR 和 PwC
              支持企业确实会为 AR/VR 工作流花钱，但这些支出不能等同于 XREAL
              短期可触达需求；其中很多落在软件、服务、培训或更重的头显上，而不是眼镜形态显示设备。实际看，市场仍由自费和准专业消费者驱动；企业需求更可信的角色是后续楔子，而不是当前核心收入池。
