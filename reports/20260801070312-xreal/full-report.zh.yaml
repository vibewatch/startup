      - number: '2.4'
        title: 增长驱动、采用约束与市场天花板
        blocks:
          - type: paragraph
            body: >-
              对 XREAL 所在市场来说，最强的增长驱动来自生态正常化和形态改进，最大刹车则仍是实用性和品类竞争。IDC 显示，眼镜形态设备已成为 XR 增长主引擎；Meta 的规模实际上补贴了消费者对面戴式 AI
              产品的教育。Google 和 Samsung 正把 Android XR 带入眼镜，这应会扩大应用可得性、开发者关注和平台合法性，利好 Aura
              这类产品。市场从笨重头显转向更轻、更容易被社会接受的硬件，XREAL 也受益。但约束清单仍很长。Smartscope 认为智能手机替代还很远。XREAL
              自己的页面仍在描述大量依赖配套硬件、线缆、计算盒或外部主机才能释放价值的设备。高端显示眼镜仍比无屏 AI 镜框更贵；不同产品类别的隐私预期不同；竞争正把市场分裂成便宜 AI
              伴侣和更高端的显示或空间计算设备。因此，市场在增长，但还没有收敛到单一赢家或主导产品原型。
