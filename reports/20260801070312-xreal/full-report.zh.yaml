        - label: 主流零售证据
          value: Amazon + Best Buy
          detail: 消费者发现产品的路径已越过小众专业渠道。
    claimRefs:
      - CU011
      - CU013
      - CU014
      - CU017
      - CU021
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 按发生概率、影响、缓释成熟度、披露清晰度和剩余敞口，对比 XREAL 风险最高的几组问题。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 披露清晰度
        - 剩余敞口
      rows:
        - label: 隐私 / 监控扩张
          values:
            - 中
            - 高
            - 低
            - 低
            - 高
        - label: IP / 诉讼
          values:
            - 中
            - 中高
            - 中
            - 中
            - 中
        - label: 软件 / 支持质量
          values:
            - 高
            - 高
            - 中
            - 中
            - 高
        - label: 伙伴 / 平台依赖
          values:
            - 中高
            - 高
            - 中
            - 中低
            - 中高
        - label: 融资 / IPO 执行
          values:
            - 中
            - 高
            - 中
            - 中
            - 中高
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR009
      - CR016
      - CR021
      - CR031
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 展示产品、法律和伙伴风险如何传导到收入质量、利润率、融资和估值。
    data:
      nodes:
        - id: software
          label: 软件质量
          detail: 配套应用的可靠性和兼容性。
        - id: privacy
          label: 隐私 / 政策压力
          detail: 监控和数据治理审查。
        - id: partner
          label: 伙伴集中度
          detail: Google、ASUS、应用商店和零售渠道。
        - id: hardware
          label: 硬件集中度
          detail: 收入仍锚定眼镜销售。
        - id: revenue
          label: 收入耐久性
          detail: 动销、留存和升级韧性。
        - id: margin
          label: 利润率路径
          detail: 退货、支持成本和定价权。
        - id: financing
          label: 融资灵活性
          detail: IPO 成功，或需要新的资本补充。
        - id: valuation
          label: 估值支撑
          detail: 能否守住当前私募市场叙事。
      edges:
        - from: software
          to: revenue
          label: 留存和采用拖累
        - from: software
          to: margin
          label: 支持和退货成本
        - from: privacy
          to: revenue
          label: 功能摩擦或信任流失
        - from: partner
          to: revenue
          label: 渠道和平台触达
        - from: hardware
          to: margin
          label: 组合和规模敏感性
        - from: revenue
          to: financing
          label: IPO 证据
        - from: margin
          to: financing
          label: 资本效率
        - from: financing
          to: valuation
          label: 价格支撑
    claimRefs:
      - CR011
      - CR016
      - CR018
      - CR021
      - CR024
      - CR032
      - CR035
      - CR038
      - CR039
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: 标出实质影响 XREAL 产品交付和分销的外部层。
    data:
      nodes:
        - id: xreal
          label: XREAL 核心栈
          detail: 眼镜、Beam Pro、Aura、应用和支持。
        - id: google
          label: Google / Android XR
          detail: Aura 和未来 XR 工作流的平台伙伴。
        - id: asus
          label: ASUS ROG
          detail: 游戏联名品牌和渠道放大器。
        - id: retail
          label: Amazon / Best Buy
          detail: 可见的主流发现入口。
        - id: appstores
          label: 应用商店
          detail: 配套应用的分发和更新。
        - id: qualcomm
          label: Qualcomm 生态
          detail: 设定外部 XR 芯片节奏和市场预期。
        - id: markets
          label: 资本市场 / HKEX
          detail: 融资和披露路径。
      edges:
        - from: google
          to: xreal
          label: 平台叙事和软件层
        - from: asus
          to: xreal
          label: 游戏触达和联名可信度
        - from: retail
          to: xreal
          label: 发现和动销
        - from: appstores
          to: xreal
          label: 上手和维护
        - from: qualcomm
          to: xreal
          label: 生态基准压力
        - from: markets
          to: xreal
          label: 资本和披露纪律
    claimRefs:
      - CR021
      - CR023
      - CR024
      - CR025
      - CR027
      - CR028
      - CR031
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 解释为什么 XREAL 落在跟踪和公允，而不是买入或回避。
    data:
      nodes:
        - label: 真实商业证据
          detail: 产品已上线，零售入口、合作关系和申报动作都存在。
        - label: 但经济体量仍小
          detail: 收入基数不大，且高度由硬件驱动。
        - label: 可选项仍有价值
          detail: Android XR、ASUS 和 IPO 路径都有机会改善叙事。
        - label: 关键耐久性缺口仍在
          detail: 留存、渠道集中度和现金跑道细节仍不完整。
        - label: 结论：跟踪 / 公允
          detail: 公司有看点，但今天给出买入判断的安全边际还不够。
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 排序未来 12-18 个月最影响 XREAL 估值支撑的因素。
    data:
      items:
        - label: 收入规模耐久性
          value: 5
        - label: 毛利率轨迹
          value: 4
        - label: IPO 完成 / 融资灵活性
          value: 4
        - label: 留存 / 支持证据
          value: 4
        - label: Android XR 转化为需求
          value: 3
        - label: 零售 / 伙伴集中度
          value: 3
    claimRefs:
      - CV019
      - CV021
      - CV027
      - CV029
      - CV030
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 以百万美元计的指示性情景估值区间；公开证据不完整，因此区间刻意留宽。
    data:
      items:
        - label: 悲观
          low: 400
          mid: 550
          high: 700
        - label: 基准
          low: 850
          mid: 1000
          high: 1150
        - label: 乐观
          low: 1300
          mid: 1550
          high: 1800
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV028
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 用 IC 风格评分概括 XREAL 投资案例。
    data:
      items:
        - label: 市场位置
          value: 7/10
          detail: 细分赛道领导者，但终端市场规模仍需验证。
        - label: 产品证据
          value: 7/10
          detail: 真实设备和合作关系已经落地，但支持摩擦仍在。
        - label: 护城河
          value: 6/10
          detail: 专利和伙伴地位有帮助，但平台锁定有限。
        - label: 经济性
          value: 4/10
          detail: 利润率改善，但亏损和硬件集中仍未解决。
        - label: 风险
          value: 3/10
          detail: 运营、融资和伙伴依赖都高。
        - label: 估值
          value: 5/10
          detail: 如果执行守住，估值算公允；但并不明显便宜。
        - label: 证据质量
          value: 5/10
          detail: 好于一般私营硬件故事，但仍不完整。
    claimRefs:
      - CV031
      - CV032
      - CV035
      - CV039
      - CV040
