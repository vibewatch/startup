companyProfile:
  summary: >-
    XREAL（前身 Nreal）是一家总部位于北京的 AR 硬件公司，由 Chi Xu 于 2017 年创立。公司销售 One Pro、1S 等轻量消费级 AR 眼镜，也销售 Beam Pro 等配套设备，并准备推出 Android
    XR 产品 Aura。公开证据显示，公司已经进入全球零售流通，2025 年毛利率改善，并与 Google、ASUS 建立战略合作；但业务仍高度依赖硬件销售，留存和单位经济细节披露有限。
  foundedDate: '2017-01-01'
  founders:
