      - number: '1.2'
        title: 领导权集中、治理披露有限与生态伙伴
        blocks:
          - type: paragraph
            body: >-
              领导层证据呈现出一个组合：顶层很清楚，顶层以下偏薄。官方和独立来源都一致认定 Chi Xu 是创始人兼 CEO；他在 Android XR 和 ASUS
              公告中的公开角色也说明，战略、生态合作和品类叙事仍高度由创始人牵引。在快速变化的硬件品类里，这种集中度可以是正面因素，因为公司似乎从 Nreal Light 到 Project Aura
              一直维持着连贯的光学与产品判断。但已审阅的公开材料没有以同等细节披露更完整的高管梯队、董事会构成或投资人治理结构。部分抵消这种不透明的是一张异常可见的伙伴地图。Google 现在把 XREAL 列为
              Android XR 的主要硬件伙伴，ASUS 正在共同开发 ROG XREAL R1 游戏眼镜，Apple 和 Google 移动生态仍是产品页上的兼容目标，App Store 列表还显示 XREAL
              软件可把眼镜连接到 NIO 车机系统。战略模式很清楚：XREAL 想做硬件与平台专家，接入更大的计算、内容和分发生态，而不是独自拥有每一层。
