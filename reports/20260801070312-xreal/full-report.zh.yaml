      - number: '3.3'
        title: 分发、平台权力与切换成本
        blocks:
          - type: paragraph
            body: >-
              当前的分发和切换成本更偏向最大生态，而不是单体最佳光学。Meta 受益于 Ray-Ban 和 Oakley 眼镜品牌，Apple 则受益于庞大装机量、零售存在和操作系统控制。Google 正与 XREAL 和
              Samsung 一起扩展 Android XR，这能帮助 XREAL，但也意味着平台层不会由 XREAL 控制。在 XREAL
              当前品类里，切换成本仍相对低，因为许多买家是在为几个关键任务选择类似配件的硬件——游戏、旅行视频、便携生产力或开发者实验。发烧友多栖使用也很可能。随着应用生态、配镜支持、配件、云端
              AI、企业工作流和已保存设备偏好加深，切换成本可能上升。但今天，分发、品牌信任、软件杠杆和周边生态控制，比任何单一硬件规格更能构成防御性护城河，这也是平台所有者在投资判断中应获得更高权重的原因。
