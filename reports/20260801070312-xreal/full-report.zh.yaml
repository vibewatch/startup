      role: 创始人兼 CEO
      background: 作为创始人兼 CEO，带领 XREAL 从 Nreal 阶段走到当前的消费级 AR 与 Android XR 战略。
      claimRefs:
        - CO010
  foundingLocation: Beijing, China
  headquarters: Beijing, China
