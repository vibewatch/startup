  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 市场视角
      - 纳入支出
      - 排除支出
      - 对 XREAL 为何重要
    rows:
      - - 广义 AR 市场
        - 企业和消费场景中的 AR 硬件、软件、服务、垂直应用和相关沉浸式技术栈
        - 排除非 AR 电子产品，但范围仍含大量 XREAL 并不直接销售的品类
        - 只能作为主题上限，不能作为 XREAL 的承销市场
      - - 无显示智能眼镜
        - 摄像头、音频和 AI 优先眼镜，如 Meta 风格产品
        - 带显示的有线眼镜和头显
        - 重要之处在于，该高出货品类正在教育消费者每天戴眼镜，但它不是 XREAL 当前最强赛道
      - - 可穿戴显示眼镜
        - 用于视频、办公和游戏的私人屏幕眼镜
        - 头显、摄像头 AI 眼镜和纯软件支出
        - 这是 XREAL 当前最清晰的商业切入口
      - - 空间 AR / 光学透视眼镜
        - 具备传感器、手势追踪和空间锚点、能感知世界的显示眼镜
        - 更重的 passthrough 头显和非透视可穿戴设备
        - 这是 Aura 和部分开发者故事的战略未来赛道
      - - 企业 AR / VR 工作流预算
        - 培训、远程支持、沉浸式生产力和工业指导支出
        - 无法适配眼镜形态部署的通用软件服务和硬件品类
        - 有助于试点需求，但 XREAL 当前形态只能触达其中一部分
      - - 现状替代品
        - 笔记本、平板、显示器、电视、智能手机、掌机和传统眼镜
        - 纯概念未来设备
        - 这些替代品才定义了买家今天真正面对的切换测试
