        title: 资本充足性、融资依赖与结论
        blocks:
          - type: paragraph
            body: >-
              资本充足性是本章最主要的投资判断阻塞点，因为最强的公开证据同时指向两个方向。一方面，公司在 2026 年 1 月新融 $100M，估值达到 $1B 以上，并仍受益于 Google 和 ASUS
              周边的战略支持。另一方面，36Kr 和 Chinabiz 都称 2025 年末现金仅约 RMB 64M，较一年前约 RMB 205M 大幅下降，而亏损仍然可观。这个组合让 2026 年 4 月 HKEX
              申请证明更容易解读：IPO
              路径不像机会主义时间选择，更像是对一家仍需要资金同时扩张硬件、软件和生产的公司所做的资本充足性回应。因此，最好的财务结论是谨慎但不悲观。收入质量显然好过纯小工具原型故事，毛利率已明显改善，海外变现也有意义。但公开证据仍未披露
              2026 年 1 月融资后的当前现金、债务或优先权条款、按 SKU 实现的毛利、保修负担或退货。这些缺口足够大，使投资判断停留在「有意思但不完整」。
