      - number: '1.4'
        title: 里程碑、市场位置与新兴风险
        blocks:
          - type: paragraph
            body: >-
              XREAL 的里程碑记录也支撑了其品类领导主张，但故事里仍挂着重要负面信号。官方材料梳理出一条路径：2019 年 Nreal Light 在 CES 首秀，2020 年无锡光学模组工厂落地，2021 年推出
              XREAL Air 和 NebulaOS，2023 年改名并进入 Air 2 / Beam 周期，2024 年推出 Beam Pro、Air 2 Ultra 和搭载 X1 的 One 平台，2026 年则有
              1S、Project Aura、ROG XREAL R1 和 HKEX 申报。About 页面称，XREAL 在 2022 至 2025 年保持全球 AR 眼镜收入第一；IDC 也独立显示，即便 Meta 无显示
              AI 眼镜快速崛起，XREAL 在 2026 年一季度仍位列更广义智能眼镜全球前五。这是很强的定位证据，但不是全部风险图。评测来源仍把这类产品描述为依赖连接设备、依赖边缘场景；App Store
              评论显示部分真实用户对软件不满意；XREAL 自己在 2026 年 1 月对 Viture 提起的专利诉讼也说明，轻量 AR
              的可防御性正在法庭和门店里同时被争夺。因此，正确的概览读法是「有压力的领先」：XREAL 看起来是一个真实市场领导者，但所在品类仍小、变化快且越来越拥挤。
