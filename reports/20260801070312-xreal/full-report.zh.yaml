  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价与实际变现项
        blocks:
          - type: paragraph
            body: >-
              XREAL 公开收入模式不止一个眼镜 SKU，但仍远窄于成熟平台业务。官方产品表面显示出几层变现：通过 One Pro 和 1S 销售高端 AR 眼镜，通过 Beam Pro 销售付费空间配套设备，通过 ROG
              XREAL R1 合作延伸配件和游戏，通过 Aura 走未来预约订金路径。36Kr 的 IPO 分析强化了一个事实：即便产品扩展后，2025 年实际收入结构仍高度由硬件驱动——AR 眼镜贡献 RMB
              403M，配件 RMB 73M，服务及其他收入 RMB 40M。这个结构很重要，因为它证明 XREAL 不是完全依赖单一
              SKU；但也说明，市场期待的软件或平台层，在已披露财务里仍很小。因此，最强的财务读法是喜忧参半。收入机制可见且在改善，但大多数变现仍取决于大规模发货实体设备，并把产品组合推向更高价型号，而不是转向经常性软件收入。
