  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 证据基础
      - 含义
    rows:
      - - 建议
        - 跟踪
        - 真实产品、合作伙伴和申报进展都存在，但业务尚未降风险到财务尽调级别
        - 监控，不追当前价格
      - - 置信度
        - 中
        - 证据质量好过许多私营硬件创业公司，但留存和经济性仍不完整
        - 仓位控制保持保守
      - - 风险评级
        - 高
        - 硬件集中、伙伴依赖和 IPO 不确定性仍然重要
        - 按里程碑推进投资判断
      - - 估值立场
        - 合理
        - 当前公开估值锚已反映领先地位和可选性，但安全边际不足
        - 升级前更偏好折价或更强证明
      - - 决策触发项
        - 只有证明或价格到位才上调
        - 需要更好的留存、渠道和现金续航披露，或显著更低的入场价格
        - 今天不给买入结论
    notes: 摘要视角刻意对价格敏感：XREAL 可以在战略上令人兴奋，但基于现有证据仍只是定价合理。
