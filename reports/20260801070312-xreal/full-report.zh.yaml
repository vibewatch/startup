      - number: '8.2'
        title: 融资背景与可比公司集合
        blocks:
          - type: paragraph
            body: >-
              给 XREAL 估值，最干净的方法是用混合视角，而不是硬塞进单一可比公司框。Vuzix 这类纯 AR 或智能眼镜上市公司，展示了投资人只看当前硬件经济性、 不看品类叙事时的下行情景。Meta、Apple
              这类巨型平台公司定义了战略天花板，但市值太大、业务太分散，无法作为直接可比。 Snap 的价值主要在于提醒市场：消费硬件叙事可以和规模大得多的软件、广告模型共存——但同样不是直接比较。Warby
              Parker、Xiaomi、Sony 有助于理解公开市场如何给眼镜、 硬件或多元消费电子分销定价，但它们的现金流基础都比 XREAL 更宽，或根本不同。正确结论是：如果 Android XR 与高端分销继续跑通，
              XREAL 应该比挣扎中的纯硬件公司拿到更多信用；但在收入耐久性、留存和融资弹性更清楚之前，它还拿不到平台型倍数。
