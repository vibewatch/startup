  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律、隐私与 IP 风险
        blocks:
          - type: paragraph
            body: >-
              XREAL 目前似乎没有面临单一生死攸关的许可障碍，但随着公司从显示眼镜扩展到相机、软件和 Android XR 工作流，并准备 IPO，风险表面正在扩大。正式监管背景很重要。中国 2022—2026
              年虚拟现实行动计划显示，该品类受到政策支持；但同样的产业框架也意味着，AR 设备从发烧友硬件走向大众电子产品时，审查会增加。与此同时，EU AI Act、ICO 监控指南和 FTC
              隐私安全材料都表明，一旦面戴设备捕捉生物识别、视频或健康相邻数据，敏感度会显著上升。XREAL
              自有公开政策页面在抓取快照里还不容易检查设备特定义务，这本身是披露风险，而不是不合规证据。诉讼记录又增加了一层。XREAL 在德国禁令之后，正在美国对 Viture
              执行专利权，这支持护城河主张，但也证明就在公司试图说服公开市场投资人其已准备好接受更广审视时，该品类已经有足够争议，会产生跨司法辖区 IP 成本和管理分心。
