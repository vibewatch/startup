        title: GTM 动作、海外占比与销售效率可见度
        blocks:
          - type: paragraph
            body: >-
              最清楚的公开 GTM 信号不是经典企业销售效率数学，而是全球直销、伙伴分发和海外需求集中三者的组合。36Kr 称，2025 年超过 70% 收入来自海外市场，其中美国贡献 36.9%、日本 14.6%、欧洲
              13.8%，直销占收入 70.8%。这说明 XREAL 主要靠品牌、渠道和产品定位直接变现，而不是主要依赖批发中间商。Chinabiz、PYMNTS 和 ASUS 材料补充显示，XREAL
              仍在用发布节奏和伙伴联合品牌来扩张需求；官方支持页面则显示，背后必须有 24/7 支持联系层承接这些销售。缺失环节是销售效率。公开材料没有
              CAC、渠道折扣、退货率、企业销售周期或回本期披露。公开牵引力足以支持市场存在判断，但不足以支持一个干净的 DTC 或伙伴渠道效率模型。
