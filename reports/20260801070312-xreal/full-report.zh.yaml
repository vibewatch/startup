              把 XREAL 的产品表面理解成一套工作流栈，比理解成单一头显替代品更容易。One Pro 和 1S 围绕私人屏幕、旅行娱乐、游戏和轻量空间使用，锚定当前显示眼镜产品线。Beam Pro
              扮演配套控制与应用平面，把眼镜扩展成更宽的空间计算组合，提供 Google Play 访问、3D 捕捉和常驻应用。Aura 则用 Android XR、Gemini
              和分体计算架构，把这套栈进一步推向光学透视空间计算。结果是，一个组合至少覆盖三类技术任务：可穿戴显示眼镜、配套设备空间计算，以及偏开发者的 Android XR 硬件。这种宽度是优势，因为 XREAL
              可以用同一硬件族覆盖消费媒体、准专业办公、游戏和未来平台押注。它也是复杂度成本，因为每一层都会增加支持、软件、兼容性和产品成熟度义务，比卖一个静态屏幕配件更难。
