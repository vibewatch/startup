      - number: '1.3'
        title: 资本阶段、投资人地图与 IPO 过渡
        blocks:
          - type: paragraph
            body: >-
              证据最充分的资本图景是：XREAL 是一家后期私营公司，2026 年 1 月完成 $100M Series D 轮，现在准备通过香港上市测试公开市场胃口。Sina 2026 年 1 月报道引用 Chi Xu
              披露新一轮融资，并称投资人主要是供应链参与方和老股东支持；Tracxn 列示 2026 年 1 月 8 日的 Series D 轮估值为 $1B，累计披露融资约 $433M。同一 Tracxn
              档案还显示，早期后期投资人包括 Alibaba、NIO Capital、Kuaishou Technology、Gentle Monster 和 Sequoia。36Kr 与 ChinaBiz Insider 的
              2026 年 4 月 IPO 报道增加了第二层细节：公司现在披露的经营数据足以证明它不是科学项目式创业公司，但资产负债表余量又不足以无限期推迟公开融资。这些报道把 IPO
              描述成不只是可选增长资本，更是公司从私营硬件领导者走向更受审视的公众市场竞争者的一部分。关键保留意见是，已审阅材料仍没有给出完全对齐的股权结构表、清算优先序列或董事会权利地图。
