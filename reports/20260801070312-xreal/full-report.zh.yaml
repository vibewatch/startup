  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              判断 XREAL 市场时，最容易犯的错误是把所有带有「AR」「XR」或「智能眼镜」标签的数字都视为同样贴近公司。已审阅来源显示，几个不同设备市场被压进了同一个标签。Smartscope 把 2026
              年市场拆成音频眼镜、相机 AI 眼镜、HUD 眼镜、可穿戴显示设备和空间 AR 眼镜。IDC 另行报告无显示智能眼镜爆发式增长，同时在 AR/VR 追踪中把带显示、光学透视设备视为独立细分。这个区别很重要，因为
              XREAL 今天最强的是可穿戴显示和带显示的空间计算任务，而不是 Meta 主导的相机优先 AI 眼镜赛道。CNBC 很好地抓住了买方面差异：XREAL 和 Rokid
              可以把产品定位成便携电视或办公显示器，这和主要为了图像捕捉及语音 AI 而买眼镜，是实质不同的购买触发点。XREAL 官方页面也强化了这条边界。One Pro 是私人巨幕设备，Beam Pro
              是配套空间计算终端，Aura 是偏开发者的 Android XR 空间计算产品。因此，宽口径 AR TAM 会高估 XREAL 现实的近期市场，除非把它下调到公司实际服务的设备类别和用户任务。
