  customerFocus: 面向技术尝鲜消费者、玩家、旅行者、移动办公人群、创作者和开发者，他们使用轻量可穿戴显示设备和早期空间计算工作流。
  businessModel: 目前以硬件销售为主，辅以配件和有限服务 / 软件；未来的平台上行空间取决于 Android XR、合作伙伴生态和配套设备使用深度。
