              Deck 的工作流上；但其页面也明确说明，更完整功能需要额外软件层。合在一起，这些信号说明 XREAL
              的硬件商业上真实、技术上有野心，但日常可用性仍依赖固件、配套软件、文档质量和社区变通方案，并可能实质影响留存和支持负担。
