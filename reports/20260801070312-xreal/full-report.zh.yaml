            body: >-
              部署质量至少和光学本身一样，取决于眼镜周边的控制平面。支持表面是可见的：XREAL 维护公开支持页面、应用列表、Discord 社区和开发者文档。下行信号在于，公开可靠性指标喜忧参半。已审阅快照中，XREAL
              App Store 列表显示 76 个评分给出 1.9 / 5；Google Play 启动器页面显示 2026
