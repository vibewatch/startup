      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - IPO 推进，Aura / Android XR 发布落地良好，伙伴渠道加深，利润率继续改善
        - 叙事和经济性同步改善时，支撑约 $1.3B-$1.8B
        - 执行滑坡或伙伴依赖仍然重要
