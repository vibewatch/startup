        title: 运营、质量、软件与支持风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，XREAL 仍更像一个硬件加配套软件栈，而不是一个容错余量充足的成熟消费平台。IPO 阶段报道称，大部分收入仍来自 AR
              眼镜硬件；品类领先映射出的收入基数仍相对有限，这意味着每个主要产品周期权重都很高。产品组合也在同一时期变宽：One Pro、1S、Beam
              Pro、Aura、应用和开发者表面都需要兼容性、支持和发布纪律。公开支持信号并非灾难，但很混杂。公司维持可见支持和社区表面，Google Play 也显示 2026 年有活跃更新；但 Apple App
              Store 快照仍显示评分偏弱。这个组合说明 XREAL
              正在发货并维护真实产品，但软件质量仍与硬件满意度和退货风险紧密相连。由于眼镜常依赖配套应用、主机设备兼容或配件工作流，一次软件回退对采用的伤害可能远超普通消费电子更新。
