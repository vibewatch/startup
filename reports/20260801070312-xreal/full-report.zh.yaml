  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - IPO / 融资延误
        - 上市流程停滞，且没有清晰替代资本计划
        - 叙事溢价坍缩为现金续航担忧
        - 除非价格重置，否则从跟踪转为回避
      - - 支持 / 留存不及预期
        - 到下一个产品周期仍没有 App 质量、退货或复用改善证据
        - 高端硬件故事失去持久性
        - 不承认倍数扩张
      - - 伙伴集中冲击
        - Google、ASUS 或主要零售渠道失去势头或收窄曝光
        - 可选性走弱，依赖仍在
        - 大幅下调乐观情景概率
      - - 利润率反转
        - 产品组合或支持成本恶化后，毛利率改善停滞或反转
        - 硬件经济性看起来不如预期可扩展
        - 估值向小型上市硬件同业靠拢
      - - 品类规模化失败
        - 领先地位延续，但 AR 总需求仍停留在小众市场
        - 平台经济性形成前，收入天花板先到
        - 将当前标价视为过满
    notes: 每个触发项都足够可观察，投资人可在新数据出现后快速复盘判断。
