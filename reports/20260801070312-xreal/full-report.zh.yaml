      - number: '8.4'
        title: 最终判断、否决触发点与下一步尽调路径
        blocks:
          - type: paragraph
            body: >-
              因此，当前最合适的投资立场是继续跟踪，置信度中等、风险高。XREAL 有足够实质，应该留在短名单上：它不只是一个投机性的光学故事， 公开证据显示公司有产品、伙伴、零售触点、诉讼支撑的 IP
              主张和申报动作。但今天买入的人，仍然是在承销一场尚未完全完成的转型： 从高端硬件卖家，转成具备耐久性的公开市场空间计算公司。真正能上调判断的，不是又一条合作头条本身，
              而是重复使用、产品级毛利率、渠道集中度、售后支持质量，以及穿过或越过 IPO 窗口的现金跑道证据。下调触发点也清楚： 如果 IPO 停滞、软件摩擦持续，或伙伴拿走大部分叙事上行而 XREAL
              继续背运营负担，估值会很快压缩。 因此，本报告的结论是估值公允而非便宜，整体建议是跟踪而非今天买入。
