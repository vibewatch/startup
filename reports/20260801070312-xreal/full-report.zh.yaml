  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资判断姿态与入场纪律
        blocks:
          - type: paragraph
            body: >-
              XREAL 已经越过从概念公司走向真实商业平台候选者的门槛，因此估值问题不再是假设题，而是有现实意义。公开证据支撑了几件事： 产品已经上市，零售流通可见，毛利率在改善，Android XR 合作带来可选性，IPO
              也在推进。但同一组记录也说明，市场不应把它当成风险已经出清的平台资产。 收入相对其野心仍偏小，业务仍主要由眼镜硬件拉动，软件质量或留存证据还不完整。这种组合要求投资人有纪律地承销。 投资人买的是相信 XREAL
              有机会成为领先独立 AR 眼镜上市公司的权利，而不是一家已经证明消费者平台经济性能长期成立的公司。 以当前证据看，合理结论是继续跟踪、估值公允：足够有意思，值得密切关注；但风险尚未降到可以不计价格追买。
