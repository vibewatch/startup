  - id: TV002
    title: 正反投资论点表
    columns:
      - 论点
      - 支撑
      - 什么会改变判断
    rows:
      - - 大众 AR 眼镜领导者
        - XREAL 有在售产品、高端零售入口和品类份额说法
        - 需要审计或申报级证据，证明领先地位能转化为持久盈利能力
      - - Android XR 与伙伴可选性
        - Google、ASUS 和 Aura 把战略上行空间扩到传统显示眼镜之外
        - 需要证据证明伙伴声量会变成复购需求，而不是一次性发布
      - - 硬件集中度仍主导
        - 2025 年收入结构仍主要由眼镜驱动，软件多元化有限
        - 更清晰的服务或生态变现层会改善论点
      - - 留存和支持披露不足
        - App、支持和退货数据仍太稀疏，撑不起溢价投资判断
        - 队列留存、退货率和工单数据会支撑更高置信度
      - - IPO 能打开资本通道，但不能单独降低模型风险
        - 上市进展有利于融资灵活性，但公开市场也可能压缩硬件倍数
        - 成功上市叠加基本面改善，才可能抬高估值支撑
    notes: 投资案例不是单边故事：制造上行的同一组事实，也解释了为什么投资人应要求估值纪律。
