      - number: '4.3'
        title: 成本结构、单位经济代理指标与毛利路径
        blocks:
          - type: paragraph
            body: >-
              来源材料暗示的成本结构，正是投资人应从一家资本密集型消费硬件公司身上预期到的样子：它试图表现得像未来平台。36Kr 对申请证明的摘要显示，毛利率从 2023 年的 18.8% 提升到 2025 年的
              35.2%，但仍报告大额调整后亏损、有意义的销售费用、重研发和现金紧张。摘要还显示，产品组合从低价 Air 单元转向高价 One
              系列设备，这有助于毛利，但也可能意味着市场较小、依赖高端组合而非广泛入门级销量。Chinabiz 描述年出货量停滞在约 130,000 台，尽管毛利改善，这进一步加强了担忧。成本负担不只是物料清单。XREAL
              还在承担光学研发、定制芯片、软件支持、全球运营、库存、售后服务和生态合作成本。Vuzix 的 2025 年 10-K
              是一个有用的同业警示：即便已有真实产品在市场上销售，纯智能眼镜厂商仍可能承受毛亏、库存减值和长期净亏损。XREAL 自身改善趋势令人鼓舞，但公开记录仍指向一家经济性改善速度快于现金垫厚度的公司。
