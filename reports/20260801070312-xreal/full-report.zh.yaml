  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户表面、细分人群与实际购买者
        blocks:
          - type: paragraph
            body: >-
              把 XREAL
              的客户故事看成消费者、准专业消费者、创作者和生态用户组成的一组栈，比看成经典企业客户名单更清楚。公开证据强力支持消费和准专业消费者需求，核心场景是私人屏幕媒体、游戏、旅行和便携生产力。现有产品本身也指向这些任务：One
              Pro 和 1S 面向可穿戴显示使用，Beam Pro 扩展应用驱动使用，Aura 则面向开发者和未来空间计算采用者。用户表面还延伸到相邻生态。App Store 描述明确称，XREAL app 可连接
              XREAL 眼镜用于观看空间视频，也可连接 NIO 车载系统，以控制眼镜中显示的内容。与此同时，Visionaries 页面展示了围绕具名用户搭建的官方创作者计划，而不是匿名营销口号。这很重要，因为它说明
              XREAL 已经拥有多个客户表面——零售买家、创作者、联网汽车用户和开发者——即便公司仍很少披露账户数量、复购行为或企业集中度。
