company:
  name: XREAL
chapter:
  number: 4
  title: Financials
  summary: 'XREAL now looks like a real late-stage hardware business rather than a concept company: public sources support meaningful 2025 revenue, materially improved gross margin, a predominantly overseas sales mix, and multiple monetization surfaces across glasses, accessories, and companion devices. The central financial risk is not the absence of traction, but the combination of persistent losses, low disclosed year-end cash, and continued dependence on hardware-led economics and fresh financing.'
sections:
- id: revenue-model-and-pricing
  title: Revenue model, pricing, and what is actually monetized
  body: 'XREAL''s public revenue model is wider than a single glasses SKU, but still much narrower than a mature platform business. The official product surface shows several monetization layers: premium AR glasses through One Pro and 1S, a paid spatial companion device through Beam Pro, accessory and gaming extensions through the ROG XREAL R1 partnership, and a future reservation-deposit path through Aura. 36Kr''s IPO analysis reinforces that the actual 2025 revenue mix remained heavily hardware-led even after product expansion: AR glasses contributed RMB 403 million, accessories RMB 73 million, and services plus other revenue RMB 40 million. That mix matters because it proves XREAL is not purely one-SKU dependent, but it also shows that the hoped-for software or platform layer is still small in disclosed financial terms. The strongest financial read is therefore mixed. Revenue mechanisms are visible and improving, yet most monetization still depends on shipping physical devices at scale
    and moving product mix toward higher-priced models rather than toward recurring software revenue.'
