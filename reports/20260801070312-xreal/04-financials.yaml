    - Reported in Sina funding coverage
    - Request exact budget split across R&D, tooling, inventory, and GTM
  - - Debt / project finance obligations
    - Not publicly disclosed in reviewed set
    - Debt can materially alter runway and downside
    - Unavailable
    - Request credit facilities, covenants, supplier financing, and pledge terms
  - - Next-round trigger
    - Likely tied to IPO progress or sharper margin improvement
    - Determines dilution and financing risk
    - Inferred from low year-end cash and April 2026 filing path
    - Request management downside plan if IPO timing slips
  notes: The funding chronology lives in Company Overview; this table focuses only on whether disclosed cash and fresh financing appear sufficient for forward operations.
