- id: capital-adequacy-and-verdict
  title: Capital adequacy, financing dependency, and verdict
  body: 'Capital adequacy is the chapter''s main underwriting blocker because the strongest public evidence points in two directions at once. On one hand, the company raised a fresh $100 million round in January 2026, reached a $1 billion-plus valuation, and still benefits from strategic support around Google and ASUS. On the other hand, both 36Kr and Chinabiz say end-2025 cash sat at only about RMB 64 million, down sharply from roughly RMB 205 million a year earlier, while losses were still substantial. That combination makes the April 2026 HKEX application proof easier to interpret: the IPO path looks less like opportunistic timing and more like a capital-adequacy response to a business that still needs funding to scale hardware, software, and production simultaneously. The best financial verdict is therefore cautious but not bearish. Revenue quality is clearly better than a pure gadget prototype story, gross margin has improved materially, and overseas monetization appears meaningful.
    But public evidence still does not disclose current cash after the January 2026 financing, debt or preference terms, realized gross profit by SKU, warranty burden, or returns. Those omissions are large enough to keep the underwriting call at “interesting but incomplete.”'
