- id: gtm-and-public-traction
  title: GTM motion, overseas mix, and sales-efficiency visibility
  body: The clearest public GTM signal is not classic enterprise efficiency math; it is the combination of global direct sales, partner-led distribution, and overseas demand concentration. 36Kr says more than 70% of 2025 revenue came from overseas markets, with the United States contributing 36.9%, Japan 14.6%, and Europe 13.8%, and it says direct sales accounted for 70.8% of revenue. That suggests XREAL is monetizing brand, channel, and product positioning directly rather than relying mainly on wholesale intermediaries. Chinabiz, PYMNTS, and ASUS materials add that XREAL is still using launch cadence and partner co-branding to expand demand, while official support pages show a 24/7 support contact layer that must sit behind those sales. The missing piece is sales efficiency. There is no public CAC, channel discount, return-rate, enterprise-sales-cycle, or payback disclosure. Public traction is real enough to underwrite market presence, but not real enough to underwrite a clean DTC or partner-channel
    efficiency model.
  claimRefs:
