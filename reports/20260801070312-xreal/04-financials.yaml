- id: FI003
  title: Capital intensity / cash-flow map
  type: matrix
  layout: standard
  summary: Connects the main financial pressure points that make XREAL’s capital adequacy hard to underwrite from public evidence alone.
  data:
    columns:
    - Revenue quality
    - Margin path
    - Working capital
    - Financing dependence
    rows:
    - label: Positive signal
      values:
      - RMB 516M 2025 revenue is meaningful for a niche AR vendor
      - Gross margin improved to 35.2%
      - January 2026 financing likely eased near-term stress
      - Series D and IPO path show access to capital markets
    - label: Pressure signal
      values:
      - Revenue is still highly hardware concentrated
      - Adjusted loss remained about RMB 250M in 2025
      - End-2025 cash fell to roughly RMB 64M
      - Business still appears dependent on external capital
    - label: Unresolved variable
      values:
      - Service revenue quality and recurrence remain unclear
      - SKU-level gross profit and warranty burden are undisclosed
      - Inventory turns and debt terms are undisclosed
      - Runway after the January 2026 round is undisclosed
    - label: Underwriting implication
      values:
      - Do not treat current revenue as platform-quality revenue
      - Do not extrapolate profitability from margin improvement alone
      - Demand a treasury bridge before sizing risk
      - Treat financing risk as material until audited disclosures surface
