- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Current post-Series-D cash balance
    - Runway cannot be estimated from year-end 2025 cash alone
    - Request latest monthly treasury package and unrestricted cash balance
  - - Debt, covenants, and supplier financing
    - Leverage and downside protection remain opaque
    - Request full debt schedule, covenant summary, and supplier-finance terms
  - - Return rate, warranty reserves, and RMA burden
    - Realized margin and customer durability may be overstated without them
    - Request returns by SKU, reserve policy, and cash cost per return
  - - Realized ASP and gross margin by SKU
    - List prices and mix data are not enough to model contribution margins
    - Request product-level P&L with landed cost and discount waterfall
  - - Recurring-service customer counts and renewal
    - Services could be a second growth curve, but the public set cannot prove it
    - Request service revenue composition, contract length, and renewal data
  - - Inventory turns and build commitments
    - Working-capital needs may be driving financing urgency
    - Request inventory aging, obsolete-stock policy, and purchase-commitment schedule
  notes: These are the missing variables that most directly determine whether XREAL deserves hardware, platform, or distressed-capital framing.
