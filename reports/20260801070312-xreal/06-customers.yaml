- id: adoption-signals-and-public-proof
  title: Adoption trajectory and the strongest public proof
  body: 'The public adoption evidence is real, but it comes in mixed units and should not be mistaken for a fully auditable installed-base model. 36Kr says XREAL sold 133,731 pairs of glasses in 2025, with the One series alone contributing roughly 111,000 units. It also says more than 70% of revenue came from overseas markets. Official and retail surfaces support the same internationalization story from another angle: XREAL says it has retail presence in more than 40 countries and regions, Best Buy and Amazon now list XREAL hardware, Mashable says about 10,000 One Pro pre-orders were fulfilled before wider retail availability, and Phandroid describes a deliberate shift from niche online stores to Amazon and Best Buy. These are not perfect customer metrics, but they are powerful proofs that XREAL is beyond prototype scale and is attempting to mainstream distribution. The right read is that XREAL has crossed into real consumer-market circulation, while still leaving major ambiguity around
    active users, returns, attachment, and channel concentration.'
  claimRefs:
