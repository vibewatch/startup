tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Retail consumer buyers
    - Individual buyer is also primary user and payer
    - Private media, gaming, and portable display
    - Amazon, Best Buy, official shop, and app surfaces show mainstream retail distribution
    - Likely core revenue base today
    - No public repeat-purchase, refund, or active-usage cohort disclosure
  - - Prosumer mobile-work users
    - Individual or reimbursed professional
    - Portable workspace, 3D capture, and app-driven AR workflows
    - Beam Pro and One Pro positioning plus review coverage support this segment
    - Could support higher ASP and attach rates
    - No public data on employer reimbursement or workplace renewal
  - - Creator / enthusiast community
    - Named creators and early adopters
    - Content creation, experimentation, product advocacy
    - Visionaries page lists named users and public community presence
    - Important for word-of-mouth and ecosystem credibility
    - Does not prove paid production deployment or retention
  - - Developer / Android XR builders
    - Developer or product team
    - Build spatial apps and future XR workflows
    - Aura positioning, docs portal, and GitHub surfaces support this user class
    - Strategic value for ecosystem growth
    - No public active-developer or paid-conversion metrics
  - - Connected-car users
    - XREAL owner integrating with NIO car system
    - Control or consume content through in-car workflow
    - App Store page explicitly references NIO connectivity
    - Shows real adjacent-use-case expansion
    - No user counts, usage frequency, or satisfaction data disclosed
  - - Partner-channel buyers
    - End users reached through Amazon, Best Buy, ASUS, and other channels
    - Discover, trial, and buy XREAL hardware through partner surfaces
    - Retail and co-branding coverage supports this route to market
    - Important for geographic expansion
    - Channel concentration and margin economics remain opaque
  notes: The customer base is broadest and easiest to prove in consumer and prosumer surfaces; enterprise concentration is not the dominant public story today.
