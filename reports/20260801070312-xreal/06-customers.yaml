- id: expansion-and-concentration-risks
  title: Expansion logic, channel leverage, and concentration risk
  body: 'Expansion potential is visible, but concentration and procurement friction remain open diligence questions. XREAL''s expansion logic has three obvious branches: geographic scaling through mainstream retail and direct online sales, ecosystem scaling through Google and ASUS hardware or platform partnerships, and workflow scaling through creators, gamers, mobile professionals, and connected-car use cases. The same public evidence also reveals concentration risks. Revenue is heavily overseas, and channel proofs increasingly point to a small number of high-visibility retail and platform surfaces—Amazon, Best Buy, Google, ASUS, and the company''s own direct channels. That is a useful way to gain reach, but it also means distribution, pricing, and customer discovery can be more dependent on partner behavior than on a deep self-owned enterprise book. The chapter verdict is therefore balanced. XREAL clearly has live customers, mainstream retail proof, and international reach. What public
    evidence still cannot answer is how sticky those customers are, how concentrated revenue is by channel or geography, and how much of the installed base is composed of repeat users rather than one-time early adopters.'
