- id: durability-satisfaction-and-post-sale-signals
  title: Durability, satisfaction, and post-sale signals
  body: Retention and satisfaction are the hardest parts of the customer story to verify, and the available signals are mixed. The strongest adverse datapoint is the XREAL App Store listing, which showed a 1.9 out of 5 rating from 76 ratings in the reviewed snapshot. That does not prove broad churn, but it does warn that the software control plane can weaken the overall customer experience. The support page shows a 24/7 support email and Discord community, and the Google Play launcher listing shows active 2026 maintenance, so XREAL is clearly operating a real post-sale layer. Yet none of those signals converts into finance-grade retention evidence. There is no public NRR, GRR, contract-length, return-rate, cohort, or renewal disclosure. External review evidence from Android Headlines is more positive on comfort and usability, but it still remains reviewer proof rather than a large customer cohort. The result is a customer base that looks commercially real and globally distributed, while
    durability remains more inferred than measured.
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
