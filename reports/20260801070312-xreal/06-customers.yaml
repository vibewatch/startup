chapter:
  number: 6
  title: Customers
  summary: 'XREAL has crossed well beyond prototype demand: public sources support meaningful 2025 unit sales, broad overseas exposure, official creator and developer community surfaces, connected-car integration evidence, and retail expansion into mainstream channels such as Amazon and Best Buy. The key open question is not whether customers exist, but how durable, satisfied, and diversified the installed base really is once software friction, channel dependence, and retention opacity are taken into account.'
sections:
- id: customer-surfaces-and-segmentation
  title: Customer surfaces, segments, and who actually buys XREAL
  body: 'XREAL''s customer story is clearest when treated as a stack of consumer, prosumer, creator, and ecosystem users rather than as a classic enterprise roster. Public evidence strongly supports consumer and prosumer demand around private-screen media, gaming, travel, and portable productivity. The live products themselves point to those jobs: One Pro and 1S target wearable display use, Beam Pro broadens app-driven usage, and Aura is being positioned toward developers and future spatial-computing adopters. The user surface also extends into adjacent ecosystems. The App Store description explicitly says the XREAL app connects to XREAL glasses for spatial-video viewing and can connect to a NIO in-car system to control content shown in the glasses. The Visionaries page, meanwhile, shows an official creator program built around named users rather than anonymous marketing slogans. This matters because it suggests XREAL already has multiple customer surfaces—retail buyers, creators, connected-car
    users, and developers—even if the company still discloses very little about account counts, repeat-purchase behavior, or enterprise concentration.'
  claimRefs:
