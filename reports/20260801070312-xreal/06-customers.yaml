callouts:
- calloutType: insight
  title: XREAL's customer proof is strongest in mainstream consumer and prosumer circulation
  body: The retail and unit-volume evidence is much stronger than classic enterprise reference-customer evidence. That is consistent with a company monetizing lightweight display hardware at global consumer scale rather than through a few disclosed institutional accounts.
  claimRefs:
  - CU011
  - CU012
  - CU016
  - CU017
  - CU018
- calloutType: risk
  title: The software control plane may be weakening the public satisfaction signal
  body: The sharp App Store rating and absence of public retention metrics mean that strong sell-through does not automatically imply strong durable usage. Customer quality could be materially lower than distribution quality if software friction persists.
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU027
  - CU030
