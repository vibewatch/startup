- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Mainstream retail expansion
    - Reliance on a small set of visible channels such as Amazon and Best Buy
    - Retail policy or ranking changes could quickly affect discovery and sell-through
    - Request channel sales mix, margin by channel, and sell-through concentration
  - - Overseas-led demand
    - Heavy revenue exposure outside China creates geography concentration and FX sensitivity
    - Strong global upside, but weaker resilience if one major region softens
    - Request revenue and units by region plus regional support costs
  - - Partner ecosystem growth
    - Google, ASUS, and NIO integration increase relevance but deepen dependency
    - Partner strategy changes can affect customer acquisition and use cases
    - Request partner revenue contribution and contract dependencies
  - - Creator / community advocacy
    - Community users can accelerate adoption but are not a substitute for retention
    - Can create awareness spikes without durable monetization
    - Request referral share, repeat use, and creator program economics
  - - Direct-sales plus partner mix
    - Direct ownership of customer surface may be strong, but partner channels may still dominate discovery
    - Concentration can hide behind a mixed GTM model
    - Request direct vs marketplace vs retail split and customer-lifetime economics
  notes: The next customer diligence step is less about whether buyers exist and more about where those buyers come from, how sticky they are, and how concentrated the channels have become.
