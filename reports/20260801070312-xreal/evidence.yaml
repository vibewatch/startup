evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, investor rights, and detailed executive bench beyond Chi Xu.
    whyItMatters: >-
      Governance maturity and key-person concentration become materially more important as XREAL approaches public
      markets.
    diligencePath: Request the latest board deck, governance org chart, and shareholder-rights summary from management.
    relatedQuestionRefs:
      - QO006
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: primary-ipo-filing
    missingEvidence: Direct reviewed access to XREAL's full Hong Kong prospectus rather than secondary media summaries.
    whyItMatters: >-
      Revenue mix, cash, liabilities, litigation exposure, and customer concentration are materially more reliable in
      the primary filing than in commentary about it.
    diligencePath: Obtain the full HKEX filing or official PDF and reconcile all quoted financial figures to the primary document.
    relatedQuestionRefs:
      - QO018
      - QO019
      - QO024
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: funding-and-valuation-history
    missingEvidence: >-
      A fully reconciled round history linking the 2024 Series C, 2025 follow-on funding references, and 2026 Series D
      to exact investors and post-money marks.
    whyItMatters: >-
      Without a clean capital-history bridge, later-stage ownership dilution, preference stack, and true valuation
      momentum remain harder to underwrite.
    diligencePath: Request signed financing announcements, cap-table history, and a round-by-round investor schedule.
    relatedQuestionRefs:
      - QO015
      - QO016
      - QO017
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: xreal-specific-som
    missingEvidence: >-
      A vendor-neutral XREAL-specific SOM that splits consumers, prosumers, developers, and enterprise pilots by real
      purchase intent and geography.
    whyItMatters: >-
      Without that narrower SOM, top-down TAMs can make the market look much larger and more monetizable than XREAL's
      current device lineup actually supports.
    diligencePath: Request shipment mix, channel mix, geography mix, and active-user segmentation by product family from management.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: device-class-taxonomy
    missingEvidence: >-
      A single authoritative public taxonomy that cleanly reconciles AI-camera glasses, wearable displays, HUD glasses,
      and spatial AR categories across analysts.
    whyItMatters: >-
      Category overlap makes competitor comparison and market-share interpretation noisy, especially when buyers and
      investors use “smart glasses” as a catch-all term.
    diligencePath: >-
      Build an internal device taxonomy and remap all market datasets to that scheme before using them in valuation
      work.
    relatedQuestionRefs:
      - QM001
      - QM002
      - QM024
    relatedTableRefs:
      - TM001
  - type: private-evidence-only
    severity: minor
    topic: xreal-enterprise-pipeline
    missingEvidence: >-
      Direct evidence of how much current XREAL demand comes from enterprise pilots versus self-pay consumer and
      prosumer buyers.
    whyItMatters: >-
      The enterprise share of demand changes both margin expectations and the credibility of future software or service
      monetization.
    diligencePath: Request current pipeline mix, active pilot count, average deal size, and conversion data by segment.
    relatedQuestionRefs:
      - QM013
      - QM022
      - QM025
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: minor
    topic: win-rates-and-switching
    missingEvidence: >-
      Public sources do not disclose XREAL's win rates, competitive displacement data, or repurchase behavior versus
      Meta, Rokid, RayNeo, or Vuzix.
    whyItMatters: >-
      Without competitive win/loss data, it is hard to judge whether XREAL's perceived niche leadership translates into
      durable revenue or only attention.
    diligencePath: Request win-loss logs, channel sell-through by geography, and return / repurchase rates by product family.
    relatedQuestionRefs:
      - QP017
      - QP018
      - QP024
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: normalized-pricing
    missingEvidence: >-
      A fully normalized, geography-adjusted price list across XREAL and each major competitor was not consistently
      available in the reviewed source set.
    whyItMatters: Incomplete pricing comparability obscures how much of XREAL's differentiation is product-led versus price-led.
    diligencePath: Build a region-specific price and bundle tracker across official stores and key channels.
