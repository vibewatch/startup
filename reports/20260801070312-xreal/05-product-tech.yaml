callouts:
- calloutType: insight
  title: XREAL is building a layered stack, not just selling glasses
  body: The most durable part of the product story is that XREAL now shows devices, software, docs, templates, and partner ecosystem surfaces together. That is more platform-like than the average gadget vendor, even if monetization still trails the ambition.
