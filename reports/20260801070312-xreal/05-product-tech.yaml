- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Optics and display engine
    - Delivers optical-see-through or private-display visual experience
    - X-Prism and related optical system execution
    - Optical quality, comfort, and manufacturability remain hard to verify from public data
  - - Custom spatial-computing silicon
    - Supports lower latency and device-side processing
    - X1 or X1S chip family plus firmware stack
    - Chip advantage may be real, but cost, yield, and sustained advantage are private
  - - Sensors and tracking
    - Enable 3DoF, 6DoF, hand tracking, plane detection, and anchoring
    - SLAM cameras, IMU, and SDK integration
    - Tracking quality and power consumption drive usability
  - - Companion compute and app plane
    - Handles settings, app access, capture, and control for many workflows
    - Beam Pro, phone apps, or tethered compute puck
    - Companion-device dependence increases friction and support complexity
  - - Platform and ecosystem layer
    - Adds Android XR, Gemini, Google Play, and developer frameworks
    - Google, Qualcomm, Unity XR Plugin, and third-party tooling
    - XREAL does not control every critical software layer
  - - Community extension layer
    - Expands device utility into unsupported workflows
    - GitHub examples, topic repos, and third-party drivers
    - Can improve adoption, but also signals where official coverage is incomplete
  notes: The architecture is multi-layered and credible, but every additional layer introduces one more dependency outside a simple hardware bill of materials.
