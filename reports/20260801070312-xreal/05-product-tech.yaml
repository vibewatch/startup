- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - XREAL solution surface
  - Public benefit signal
  - Main limitation
  rows:
  - - Private media and gaming screen
    - Phones, tablets, and handheld displays are small or public
    - One Pro, 1S, and ROG XREAL R1 provide wearable private-screen viewing
    - Official pages and ASUS describe giant-screen gaming and media workflows
    - Long-session comfort and software compatibility remain important
  - - Portable spatial productivity
    - Desk-bound monitors do not travel well
    - Beam Pro plus display glasses bring apps and workspace into AR
    - Beam Pro page explicitly positions all apps in AR with 5G companion capability
    - Still depends on companion hardware and app support
  - - Android XR development
    - Developers need hardware plus tools to build spatial apps
    - Aura, SDK docs, templates, and developer portal form the developer path
    - Google and XREAL both frame Aura as an Android XR canvas
    - Public developer-usage momentum is visible but not deeply quantified
  - - World-aware spatial computing
    - Traditional display glasses lack environmental understanding
    - SDK docs highlight 6DoF, plane detection, image anchoring, and hand tracking
    - Docs portal and GitHub overview describe these capabilities directly
    - Requires software integration, host compatibility, and likely stronger compute
  - - Cross-platform hobbyist / Linux workflows
    - Some host environments are not supported cleanly by vendor software
    - Community drivers and workarounds extend hardware utility
    - XRLinuxDriver explicitly supports XR glasses recognition on Linux-like hosts
    - Community dependence implies official support gaps or incomplete native tooling
  notes: These use cases show why XREAL should be evaluated as a workflow stack, not as a single entertainment gadget.
