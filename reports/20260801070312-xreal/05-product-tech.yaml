company:
  name: XREAL
chapter:
  number: 5
  title: Product & Technology
  summary: XREAL has evolved from a simple display-glasses vendor into a broader hardware-and-software stack spanning proprietary optics, custom chips, companion devices, Android XR hardware, and public developer tooling. The upside is credible technical differentiation and ecosystem ambition; the main product-tech risks are continued dependence on companion software, partner platforms, and still-incomplete public trust and reliability disclosures.
sections:
- id: product-lineup-and-user-jobs
  title: Product line, modules, and customer workflow jobs
  body: 'XREAL''s product surface is easier to understand as a workflow stack than as a single headset substitute. One Pro and 1S anchor the current display-glasses line around private screens, travel entertainment, gaming, and lightweight spatial use. Beam Pro functions as the companion control and app plane, extending the glasses into a broader spatial-computing setup with Google Play access, 3D capture, and always-available apps. Aura then pushes the stack further toward optical-see-through spatial computing with Android XR, Gemini, and a split-compute architecture. The result is a portfolio that spans at least three technical jobs: wearable display glasses, companion-device spatial computing, and developer-leaning Android XR hardware. That breadth is a strength because it lets XREAL address consumer media, prosumer work, gaming, and future platform bets with related hardware. It is also a complexity cost because each layer adds support, software, compatibility, and product-maturity obligations
    that are more difficult than selling one static screen accessory.'
  claimRefs:
