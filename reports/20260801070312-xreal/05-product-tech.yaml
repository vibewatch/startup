tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / product line
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - XREAL One Pro
    - Media, gaming, and prosumer display user
    - Commercially live product surface
    - X-Prism optics plus X1 chip and display-glasses positioning
    - Need real-world return rates, comfort data, and support burden by geography
  - - XREAL 1S
    - Mainstream consumer or gamer seeking lower-cost entry into AR glasses
    - Commercially live product surface
    - X1 chip marketed as spatial-intelligence silicon for AR glasses
    - Need clarity on realized ASP, channel mix, and feature usage
  - - XREAL Beam Pro
    - Existing XREAL glasses owner who wants apps, 3D capture, and a spatial companion
    - Commercially live companion device
    - Google Play-enabled AR companion and spatial-computing controller
    - Need attach rate, active usage, and software-support cost
  - - XREAL Aura / Project Aura
    - Developer and future spatial-computing user
    - Pre-launch / reservation phase for fall 2026
    - 70° optical see-through display with Android XR and Gemini in glasses form
    - Need launch timing certainty, compute economics, and production readiness
  - - XREAL SDK / docs portal
    - Developer building XR applications for XREAL hardware
    - Publicly visible tooling surface
    - Unity XR Plugin integration, hand tracking, plane detection, and 6DoF support
    - Need active developer counts, release cadence, and issue-resolution data
  - - Support and community surfaces
    - Installed base of XREAL device owners
    - Live operational layer
    - 24/7 support email, Discord, app listings, and tutorials
    - Need response-time, bug backlog, and satisfaction metrics
  notes: XREAL clearly sells more than one pair of glasses; the stack includes devices, software, developer tooling, and support layers that all shape product maturity.
