- id: architecture-and-operating-stack
  title: Architecture, software stack, and dependency layers
  body: The technical architecture is increasingly explicit in public materials. XREAL's own pages and SDK documentation describe a stack that includes optics, custom silicon, motion tracking, computer vision, companion software, and external platform integration. The 1S and One Pro pages both anchor product differentiation in the X1 family of spatial-computing chips and in XREAL's proprietary optical engine, while the docs portal and SDK overview describe spatial computing, optimized rendering, hand tracking, plane detection, image anchoring, and 6DoF tracking inside a Unity XR-plugin framework. Aura expands that architecture into a split-compute model, with the glasses tethered to an external puck and linked to Android XR and Gemini. This is important because it means XREAL is not merely assembling commodity glasses shells. The public record supports a real hardware-plus-software system. At the same time, it also shows how dependent the experience remains on platform partners, developer
    tooling, host hardware, and compatibility layers that XREAL does not entirely control.
  claimRefs:
  - CE011
  - CE012
