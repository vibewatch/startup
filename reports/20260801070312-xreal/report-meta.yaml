companyProfile:
  summary: >-
    XREAL (formerly Nreal) is a Beijing-based AR hardware company founded in 2017 by Chi Xu. The
    company sells lightweight consumer AR glasses such as One Pro and 1S, companion devices such as
    Beam Pro, and an upcoming Android XR product, Aura. Public evidence shows real global retail
    circulation, improving 2025 gross margin, and strategic partnerships with Google and ASUS, but
    the business remains heavily tied to hardware sales and still discloses limited retention and
    unit-economics detail.
  foundedDate: '2017-01-01'
  founders:
    - name: Chi Xu
      role: Founder & CEO
      background: Founder-CEO who has led XREAL from the Nreal era into its current consumer AR and Android XR strategy.
      claimRefs: [CO010]
  foundingLocation: Beijing, China
  headquarters: Beijing, China
  productSummary: >-
    Consumer AR glasses, companion compute devices, developer tooling, and upcoming Android XR
    hardware including One Pro, 1S, Beam Pro, and Aura.
  customerFocus: >-
    Tech-forward consumers, gamers, travelers, mobile professionals, creators, and developers using
    lightweight wearable displays and early spatial-computing workflows.
  businessModel: >-
    Primarily hardware sales plus accessories and limited services / software today, with future
    platform upside tied to Android XR, partner ecosystems, and companion-device engagement.
  stage: Series D
  fundingStatus: >-
    Series D disclosed in January 2026; Tracxn lists roughly $433M total disclosed funding and a $1B
    valuation anchor, while IPO-era reporting also cites a lower ~$833M reference, reinforcing that
    current pricing should be treated as a range rather than a single exact mark.
  disclosureProfile: private-undisclosed
