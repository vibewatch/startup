companyProfile:
  summary: >
    Liquid Death is a consumer beverage brand founded in 2019 by CEO Mike Cessario that sells canned still
    and sparkling water, iced teas, and lemonade in 16oz tallboy aluminum cans under a deliberately
    provocative heavy-metal aesthetic and the "Murder Your Thirst" tagline. The company converted a
    commodity — water — into a high-velocity lifestyle brand, expanding from direct-to-consumer online
    sales to more than 133,000 retail locations (Whole Foods, Target, Costco, 7-Eleven, Amazon) in roughly
    three years, plus an exclusive Live Nation venue distribution deal. Liquid Death reached a $1.4 billion
    valuation in its March 2024 Series E and has raised roughly $267 million of equity across rounds, plus a
    $55 million Ares Management credit facility secured in December 2024. Third-party estimates put 2024
    revenue near $333 million with a roughly $340 million target for 2025. Its sustainability mission
    ("Murder plastic pollution") leans on infinitely recyclable aluminum, and a growing merchandise business
    extends the brand. As a private company it discloses no audited financials, margins, or unit economics.
  foundedDate: "2019-01-01"
  founders:
    - name: "Mike Cessario"
      role: "Co-founder and CEO"
      background: "Former creative director; conceived Liquid Death's heavy-metal branding and led its expansion from DTC to mass retail."
      claimRefs: ["CO007"]
  foundingLocation: "Santa Monica, California"
  headquarters: "Los Angeles, California"
  productSummary: >
    Liquid Death sells still and sparkling water (DEAD WATER), flavored sparkling waters (e.g. Severed Lime,
    Mango Chainsaw), iced teas, and an iced-tea/lemonade blend (Armless Palmer), plus seasonal flavors, all
    in 16oz infinitely recyclable aluminum tallboy cans. Core water products are zero-calorie and
    zero-sweetener. A growing merchandise line (apparel, accessories, skateboards) extends the brand.
  customerFocus: "Gen Z and younger millennial, sober-curious, health- and culture-driven consumers; plus retail accounts and the Live Nation live-event channel."
  businessModel: >
    Sells premium-priced canned beverages produced by contract co-packers through retail distribution
    (133,000+ doors), e-commerce, DTC subscription, and an exclusive Live Nation venue channel, supplemented
    by higher-margin merchandise and licensing. Revenue is transactional and non-recurring; gross margin and
    unit economics are undisclosed.
  stage: "Growth (private; Series E, March 2024)"
  fundingStatus: >
    Roughly $267 million of equity raised across seed through Series E, with the March 2024 Series E (~$67M)
    pricing the company at a $1.4 billion valuation. A $55 million Ares Management credit facility was added
    in December 2024. Investors include Science Inc., Live Nation, Access Industries, and others.
  disclosureProfile: private-undisclosed
  claimRefs: ["CO007", "CO009", "CO010", "CO011", "CO012", "CO015", "CO026"]

summary:
  headline: "Liquid Death's category-defining brand, 133,000+ door distribution, and rapid scaling to ~$333M revenue are real and well-evidenced, but a premium ~4x revenue valuation, thin disclosed economics, and concentration risk warrant TRACK / research-more with medium confidence."
