      - number: '1.5'
        title: Brand, Marketing, and Partnerships
        blocks:
          - type: paragraph
            body: >-
              Liquid Death's growth engine is its marketing, which the company treats as comedic entertainment content
              rather than conventional advertising. Campaigns lean into shock value, heavy-metal imagery and absurdist
              humor, and the brand is regularly cited among the most innovative consumer companies for turning water
              into a lifestyle product with apparel, accessories and novelty merchandise. Partnerships reinforce the
              brand: Live Nation provides an exclusive concert and venue channel, and the company has collaborated with
              figures from action sports and entertainment. This same edge, however, generates recurring controversy.
              Instagram has removed or restricted posts for violent content, and critics periodically dismiss the brand
              as a gimmick. The marketing flywheel is therefore a double-edged asset: it produces outsized earned media
              and cultural relevance, but it also exposes the company to platform moderation risk and reputational
              backlash that could complicate retail or advertising relationships as it scales.
            claimRefs:
