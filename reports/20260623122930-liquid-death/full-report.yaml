        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              The economics of canned water hinge on a small number of levers, most of which are undisclosed. Aluminum
              cans and co-packing are the largest variable costs, and distributor and retailer margins absorb a
              meaningful share of the shelf price before revenue reaches the brand. Gross margin is the single most
              important undisclosed driver of the investment case; industry benchmarks suggest canned-water brands can
              run a wide margin range depending on scale and co-packing terms. Marketing intensity is elevated, as the
              brand spends heavily to drive trial, which both fuels growth and pressures near-term profitability.
              Working capital is intensive because inventory must be staged across more than 133,000 retail doors. The
              net read is positive contribution per case with improving operating leverage as fixed marketing spreads
