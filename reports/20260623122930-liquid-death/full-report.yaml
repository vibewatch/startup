      - number: '1.2'
        title: Founders, Leadership, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >-
              Mike Cessario is the founder and chief executive of Liquid Death and remains the central creative and
              brand voice of the company. His background in advertising creative direction underpins a founder-market
              fit that is unusually marketing-led for a beverage business: the product is a commodity, but the brand and
              content engine are the differentiators. Pat Cook is associated with the company's early team and formative
              marketing period. Because the brand identity is so tightly tied to Cessario's creative sensibility,
              key-person dependency is concentrated at the top, and the company does not publicly disclose a deep
              executive bench. This concentration is a strength while the founder is engaged and a risk in any
              succession scenario. As the company scales toward a possible public listing, investors will want evidence
              of a broader leadership team capable of sustaining the brand without the founder driving every campaign
              and creative decision.
            claimRefs:
