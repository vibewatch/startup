      - number: '7.3'
        title: Operational and Quality Risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk centers on the outsourced, physical nature of the business. Canned-beverage producers
              face recall exposure from contamination or packaging defects, and because Liquid Death relies on contract
              co-packers, quality control sits with third parties, raising both the likelihood and the brand impact of a
              quality event. Water sourcing must meet source-quality and treatment standards, a lower-likelihood but
              high-impact dependency. Aluminum can supply is a key input whose availability and price can constrain
              output, partially mitigable through dual-sourcing. Logistics and distribution disruption round out the
              cluster. None of these has produced a publicly recorded major incident, but the impact of a recall would
              be high, so the mitigation maturity — co-packer audits, dual-sourcing, and quality systems — is a central
              diligence question. The dependency map identifies aluminum and co-packers as the principal upstream single
              points of failure on which continuity rests.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR031
              - CR036
          - type: table
            tableRef: TR002
