chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              Liquid Death is a Los Angeles-based American beverage company founded in 2019 by Mike Cessario, a former
              advertising creative director who built the company around a deliberately absurd heavy-metal and
              death-metal aesthetic. The brand sells still and sparkling water, sparkling flavored waters, iced teas and
              lemonade, all packaged in 16-ounce aluminum tallboy cans marketed as infinitely recyclable. Its core
              positioning is captured by the tagline 'Murder Your Thirst', and its sustainability narrative is framed as
              a mission to 'murder plastic pollution' by replacing single-use plastic bottles with aluminum. The
              flagship lineup includes DEAD WATER still and sparkling water, Severed Lime sparkling water, Mango
              Chainsaw, and the Armless Palmer half-iced-tea, half-lemonade. Original water products are positioned with
              zero calories and zero sweeteners, letting Liquid Death straddle a health proposition and a
              punk-entertainment brand simultaneously.
