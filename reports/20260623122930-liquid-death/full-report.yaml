  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundaries
        blocks:
          - type: paragraph
            body: >-
              Liquid Death competes in the premium and better-for-you packaged-water category, which spans still and
              sparkling water, flavored sparkling water, and ready-to-drink iced tea and lemonade in recyclable aluminum
              cans. The relevant boundary includes premium canned and sparkling water as the core, with flavored
              sparkling and RTD tea-and-lemonade as fast-growing sub-segments, and functional hydration as an adjacency.
              Excluded or adjacent categories include plastic-bottled commodity water, carbonated soft drinks, energy
              drinks, and electrolyte powders, while the dominant status-quo substitute remains tap water. The category
              is defined as much by brand and occasion as by liquid: the same consumer may treat Liquid Death as a
              water, a soda alternative, or an alcohol alternative depending on context. Channel scope is broad,
              spanning grocery, club, convenience, direct-to-consumer, and a differentiated live-event layer, with the
              United States as the core revenue base and selective global expansion.
            claimRefs:
              - CM001
              - CM002
              - CM022
              - CM024
              - CM028
              - CM036
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM022
              - CM024
              - CM036
      - number: '2.2'
        title: Market Sizing Across Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              The category opportunity is best understood through nested lenses rather than a single number. The total
              addressable market of global packaged water is valued in the hundreds of billions of dollars and grows at
              a mid-single-digit rate, while the United States alone represents tens of billions of dollars of annual
              bottled-water revenue. Within that, the serviceable segment most relevant to Liquid Death — premium and
              flavored sparkling water — is a multi-billion-dollar market growing at a high-single to double-digit rate,
              supplemented by a comparably sized ready-to-drink iced tea and lemonade adjacency. Against these lenses,
              Liquid Death's roughly $333 million of annual sales implies only a low single-digit share of US packaged
              water, underscoring substantial headroom. Because third-party estimates diverge by definition and
              methodology, the responsible framing is a range, corroborated across multiple independent research houses,
              rather than a single precise figure.
