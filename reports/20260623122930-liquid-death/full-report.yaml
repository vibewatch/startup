      - number: '2.3'
        title: Buyer Segments and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Liquid Death's demand is concentrated among brand-led younger consumers, sober-curious drinkers,
              health-conscious water buyers, and music and action-sports culture, with household bulk buyers and retail
              category managers rounding out the picture. For most segments the user is also the budget owner, since
              these are self-purchased impulse and repertoire products rather than committee purchases. The adoption
              path typically begins with discovery through social media and marketing or an encounter at a live event,
              progresses to a trial purchase at convenience, club, or direct-to-consumer channels, and then converts to
              repeat purchase and, for the most engaged buyers, multi-SKU and merchandise loyalty. Surveys indicate a
              majority of younger consumers will pay a premium for beverages with a strong brand identity, which is the
              economic engine behind the category's pricing. Retailers, in turn, are allocating more shelf space to
              better-for-you beverages, reinforcing the funnel from awareness to repeat purchase.
            claimRefs:
