  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Overview and Severity
        blocks:
          - type: paragraph
            body: >-
              Liquid Death's risk profile is dominated by the same provocative brand strategy that drives its growth.
              The top clusters, ranked by residual exposure, are regulatory and reputational risk from edgy and
              environmental marketing, operational recall risk concentrated in third-party co-packers, partner and
              account concentration across the Live Nation channel and a few large retailers, capital and covenant risk
              from the Ares facility and thin physical-goods margins, and execution risk around the founder-CEO and
              marketing fatigue. None has yet produced enforcement, a recall, or a lost flagship account, so most are
              monitorable rather than realized. Severity here is assigned from cited evidence and category analogues,
              not intuition: impact is highest for recall and account-loss scenarios, while likelihood is highest for
              ongoing regulatory and trademark-management burden. The transmission map shows how upstream causes —
              marketing, co-packer dependence, concentration — feed into brand, liability, and revenue volatility, and
              ultimately into valuation and return risk for an investor.
            claimRefs:
              - CR001
              - CR011
              - CR015
              - CR020
              - CR021
              - CR030
              - CR033
          - type: figure
            figureRef: FR001
            claimRefs:
