        title: Product Definition and Lineup
        blocks:
          - type: paragraph
            body: >-
              In customer-workflow terms, Liquid Death's product is a canned beverage that does a hydration job while
              letting the buyer express identity and values. The lineup is deliberately focused: still and sparkling
              water as the mature core, flavored sparkling SKUs such as Severed Lime and Mango Chainsaw as the growth
              engine, and ready-to-drink iced tea and the Armless Palmer tea-lemonade as adjacencies, all in a single
              16-ounce aluminum tallboy format. Seasonal and limited-edition flavors rotate continuously to keep the
              assortment fresh, and a growing merchandise line extends the brand beyond beverages. The use cases span
              everyday hydration, an alcohol alternative for sober-curious occasions, concert refreshment through the
              live-event channel, a soda replacement, and pure brand expression. The unifying thread is that the same
              simple liquid serves many jobs because the brand, not the formulation, carries the differentiation.
