  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              Liquid Death sits in a crowded field with four overlapping competitor types. Direct branded challengers
              include LaCroix, Spindrift, and Waterloo, each strong on flavor and clean-label positioning. Beverage
              incumbents compete through owned water brands — Coca-Cola via Topo Chico, PepsiCo via bubly and Aquafina,
              Keurig Dr Pepper via Bai — bringing formidable bottler distribution. Adjacent functional players such as
              Liquid I.V. compete for the same hydration wallet, while tap water and plastic-bottled commodity water
              remain the dominant status-quo substitutes. Finally, a wave of celebrity-backed and copycat entrants is
              explicitly modeling Liquid Death's canned, edgy-branding playbook. The result is a market where Liquid
              Death's cultural brand stands out, but where incumbents hold structural distribution advantages and new
              entrants continually raise the cost of attention. Understanding which of these threats is durable versus
              transient is central to the competitive thesis.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP014
              - CP020
