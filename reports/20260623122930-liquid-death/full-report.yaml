      - number: '7.4'
        title: Partner, Dependency, and Financial Risk
        blocks:
          - type: paragraph
            body: >-
              Partner and financial risks stem from concentration. A large share of premium-water volume flows through a
              handful of major retail accounts, increasing revenue volatility and bargaining exposure, and the exclusive
              Live Nation venue deal concentrates an entire channel on one partner whose priorities could shift. The
              ongoing transition of the distributor network during rapid growth risks service gaps and channel
              disruption if not staged carefully. On the balance sheet, the Ares credit facility adds covenant and
              refinancing risk to an otherwise equity-funded company, and those covenant terms are undisclosed for a
              private borrower. More broadly, physical beverage businesses are capital-intensive with thin margins
              relative to software-style peers, and the absence of public SEC filings limits financial transparency
              until any future IPO. These are the dependencies whose failure would most directly transmit into
              investment impact, and they anchor the thesis-break triggers.
            claimRefs:
              - CR015
