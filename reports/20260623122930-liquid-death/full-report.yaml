      - number: '3.3'
        title: Distribution Power, Switching, and Lock-In
        blocks:
          - type: paragraph
            body: >-
              Switching costs in packaged water are minimal: these are low-commitment impulse purchases, buyers
              multi-home across several brands, and loyalty is moderate and easily disrupted by price or novelty. That
              dynamic makes distribution power the decisive competitive variable. Incumbents leverage Coca-Cola and
              PepsiCo bottler networks to dominate shelf and on-premise placement, and retailers allocate space to
              whatever brand delivers the highest velocity. Liquid Death's counter is twofold: cultural demand that
              drives velocity, and an exclusive live-event distribution channel through Live Nation that rivals cannot
              match. Private label, meanwhile, exploits retailer-owned shelf control to undercut on price. Because share
              is reversible in a multi-homing category, Liquid Death must continually convert brand attention into
              measurable sell-through to retain and expand its distribution footprint against better-resourced
              incumbents and cheaper private-label alternatives.
            claimRefs:
              - CP011
              - CP017
              - CP018
              - CP021
              - CP023
              - CP025
              - CP026
              - CP036
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP009
              - CP011
              - CP018
              - CP029
              - CP033
      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Liquid Death's moat rests primarily on brand and culture, which is powerful today but inherently imitable:
              celebrity-backed and copycat entrants are already replicating the edgy-branding template, and the
              industry-wide shift to aluminum is eroding the original sustainability differentiation. The most
              defensible asset is the live-event channel, which is contractually exclusive and hard to replicate.
              Against these moats stand clear displacement risks: commoditization of a fundamentally undifferentiated
              liquid, private-label price competition, and multi-homing that makes any share gain reversible. The
              durable conclusion is that Liquid Death's premium is sustainable only while brand demand outpaces
              imitation and while it keeps converting cultural relevance into shelf velocity. A meaningful evidence gap
              remains because private competitor strategy, margins, and trade-spend levels are not publicly disclosed,
              limiting precise moat-durability conclusions.
