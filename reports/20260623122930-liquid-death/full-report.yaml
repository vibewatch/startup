      - number: '6.5'
        title: Evidence Quality and Reliability
        blocks:
          - type: paragraph
            body: >-
              A diligence-grade read of the customer evidence must weigh its quality, not just its direction. The
              strongest signals are the named retail-account proofs and e-commerce rankings, which are observable,
              recent, and corroborated by multiple independent sources, and the syndicated NielsenIQ and Circana panel
              data on demographics, repeat purchase, and penetration, which carry high reputation weight. The weaker
              signals are review-site sentiment from Yelp, Reddit, Trustpilot, and ConsumerAffairs, which is
              directionally useful for surfacing themes such as price sensitivity and availability gaps but is
              self-selected and not statistically representative. The most important missing evidence is private:
              disclosed cohort retention, repeat-rate, and account-concentration figures that only management can
              provide. The honest conclusion is that public evidence convincingly establishes demand and reasonable
              satisfaction, but the durability and concentration questions that most affect lifetime value require
              primary data obtained directly in diligence.
