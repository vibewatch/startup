companyProfile:
  summary: >
    Liquid Death is a consumer beverage brand founded in 2019 by CEO Mike Cessario that sells canned still and sparkling
    water, iced teas, and lemonade in 16oz tallboy aluminum cans under a deliberately provocative heavy-metal aesthetic
    and the "Murder Your Thirst" tagline. The company converted a commodity — water — into a high-velocity lifestyle
    brand, expanding from direct-to-consumer online sales to more than 133,000 retail locations (Whole Foods, Target,
    Costco, 7-Eleven, Amazon) in roughly three years, plus an exclusive Live Nation venue distribution deal. Liquid
    Death reached a $1.4 billion valuation in its March 2024 Series E and has raised roughly $267 million of equity
    across rounds, plus a $55 million Ares Management credit facility secured in December 2024. Third-party estimates
    put 2024 revenue near $333 million with a roughly $340 million target for 2025. Its sustainability mission ("Murder
    plastic pollution") leans on infinitely recyclable aluminum, and a growing merchandise business extends the brand.
    As a private company it discloses no audited financials, margins, or unit economics.
