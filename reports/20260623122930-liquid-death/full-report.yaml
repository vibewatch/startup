      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Several structural drivers expand the category. Plastic-pollution concern shifts demand toward aluminum
              cans, the sober-curious movement multiplies non-alcoholic drinking occasions, sparkling water continues to
              outgrow still water, and younger consumers' willingness to pay for brand identity supports premium
              pricing. Strategic interest from alcohol majors hedging declining drinking rates further validates the
              non-alcoholic adjacency. Against these tailwinds stand real constraints. Water is fundamentally a
              low-differentiation commodity, so durable pricing power depends almost entirely on brand. A flood of
              imitators is copying Liquid Death's branding, retailer private-label lines undercut premium pricing, and
              environmental critics question whether canned bottled water is genuinely more sustainable than tap water.
              The net read is a category with powerful demand-side momentum but persistent supply-side commoditization
              pressure, which makes brand durability and channel access the decisive competitive variables.
            claimRefs:
              - CM013
              - CM016
              - CM018
              - CM019
              - CM023
              - CM031
              - CM032
          - type: table
            tableRef: TM004
            claimRefs:
              - CM013
              - CM019
              - CM023
              - CM031
              - CM032
      - number: '2.5'
        title: Sizing Uncertainty and Evidence Gaps
        blocks:
          - type: paragraph
            body: >-
              The principal analytical risk in this chapter is estimate reliability. Market-size figures for premium and
              canned water vary materially across research providers because the segment is young, fast-moving, and
              inconsistently defined — some lenses count all sparkling water, others only premium or functional
              products, and few isolate the canned format. As a result, the serviceable obtainable market for any single
              brand can only be bounded, not pinpointed, and Liquid Death's realistic ceiling share remains an open
              question pending granular scanner and channel data. These uncertainties do not undermine the conclusion
              that the category is large and growing, but they do caution against precise share or capture forecasts.
              The diligence path is to triangulate multiple independent estimates, obtain retail scanner data by
              channel, and reconcile the company's reported sales against category-level dollar growth to validate the
              share trajectory.
            claimRefs:
              - CM030
              - CM034
              - CM035
              - CM008
