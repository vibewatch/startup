        title: Revenue Streams and Pricing
        blocks:
          - type: paragraph
            body: >-
              Liquid Death's revenue is dominated by canned beverage sales spanning still and sparkling water, flavored
              sparkling SKUs, and ready-to-drink iced tea and lemonade, sold overwhelmingly through retail wholesale
              with a smaller direct-to-consumer channel and a higher-margin merchandise and licensing stream layered on
              top. Pricing sits firmly in the premium tier: single 16-ounce tallboys and multipacks command prices well
