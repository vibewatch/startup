        title: Scale, Metrics, and Distribution
        blocks:
          - type: paragraph
            body: >-
              Liquid Death has grown into a large-scale consumer beverage operation. The company reported approximately
              $333 million of revenue in 2024 and has guided toward roughly $340 million in 2025, and it distributes
              through more than 133,000 retail locations globally, including Whole Foods, Target, 7-Eleven, Costco and
              Amazon. The distribution arc is itself a milestone: the company expanded from a direct-to-consumer online
