              exclusive venue agreement adds a concert and live-event channel that few beverage brands can match.
              Headcount is estimated at more than 300 employees, though the company does not publish a formal figure.
              The reported $1.4 billion valuation against about $333 million of 2024 revenue implies a revenue multiple
              of roughly four times, a premium that reflects brand strength and growth expectations rather than
