      - number: '6.4'
        title: Expansion and Concentration
        blocks:
          - type: paragraph
            body: >-
              On expansion, Liquid Death has clear land-and-expand levers within its accounts: adding flavored and tea
              SKUs, securing seasonal and limited placements, and growing multi-SKU and merchandise cross-buying, all of
              which deepen revenue per account. DTC subscription provides an additional, higher-retention expansion
              path. Against these opportunities sit concentration risks. A large share of premium-water volume flows
              through a small number of major retail accounts, and a meaningful slice of demand depends on the single
              Live Nation partner relationship, so the loss or downgrade of any one of these would be material.
              Procurement friction, including retailer terms and slotting, is a lower-grade but persistent risk. The
              balanced conclusion is that customer-side economics are improving through expansion within accounts, but
              account and channel concentration is the principal customer risk to monitor, mitigated primarily by
              diversifying the retail base and broadening event distribution beyond a single partner.
