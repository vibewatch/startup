      - number: '1.6'
        title: Legal and Adverse Events
        blocks:
          - type: paragraph
            body: >-
              Liquid Death's rise has been accompanied by legal and reputational friction. The company settled a
              trademark-related dispute with PepsiCo connected to a Mountain Dew flavor, resolving a potential conflict
              over naming. Separately, the brand's marketing has repeatedly drawn backlash: social platforms have
              restricted content for violence, and commentators have questioned whether the shock approach is
              sustainable. The company has also used legal-themed and challenge-style campaigns as marketing devices,
              blurring the line between genuine disputes and promotional stunts. As a private company, Liquid Death does
              not disclose audited financials, gross margin, profitability or unit economics, which means external
              parties cannot independently verify capital efficiency or the durability of its growth. These adverse and
              disclosure factors do not undermine the brand's commercial traction, but they form the core diligence
              agenda: confirming the cap table, validating revenue, and assessing whether marketing risk or legal
              exposure could materially affect the company's trajectory toward a public listing.
