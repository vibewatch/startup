  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment case for Liquid Death rests on five pillars. The brand is a category-defining cultural
              asset that converted commodity water into a high-velocity lifestyle product; distribution spans more than
              133,000 doors plus the exclusive Live Nation venue channel; the premium-water and RTD market is large and
              growing; revenue has scaled rapidly toward a roughly $340M target; and bulls argue this growth justifies a
              premium multiple. The anti-thesis is equally concrete. Brand novelty can fatigue, account and channel
              concentration create fragility, the category is crowded and multi-homed, margins are thin and
              capital-intensive with no public financials to confirm them, and skeptics contend the roughly 4x revenue
              multiple already prices in unproven future growth. A credible valuation must weigh both sides rather than
              extrapolate the brand story, and the balance of public evidence supports quality while leaving the
              price-versus-value question genuinely open. Each pillar below is anchored to evidence developed across the
              market, product, customer, financial, competitive and risk chapters rather than asserted from the brand
              narrative alone.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV022
              - CV034
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV007
              - CV009
              - CV022
              - CV034
      - number: '8.2'
        title: Valuation and Comparables
        blocks:
          - type: paragraph
            body: >-
              Liquid Death's Series E priced the company at a $1.4 billion valuation in March 2024 on roughly $333M of
              2024 sales, implying a revenue multiple near 4x — and the company raised about $267 million of equity
              across its rounds, corroborated by Form D filings. That multiple sits within the range for high-growth
              beverage brands, which have priced at mid-single-digit to low-double-digit revenue multiples, above
              commodity CPG and public beverage majors at roughly 2-4x but below software comparables. A fair read
              blends public majors, late-stage growth challengers, premium-water private rounds, strategic beverage M&A,
              and indicative secondary-market marks rather than relying on any single anchor. Secondary platforms list
              pre-IPO interest near the last round with a liquidity discount, but those marks are indicative, not a
              reliable price. The disciplined conclusion is that the valuation is fair-to-stretched: defensible if
              growth and margin hold, vulnerable to compression if they do not.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
