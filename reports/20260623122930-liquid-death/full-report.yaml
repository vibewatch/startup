              - CV028
              - CV029
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV035
              - CV036
              - CV038
              - CV040
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV004
              - CV026
              - CV036
              - CV037
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track / Research-More, Not an Unconditional Buy
            body: >-
              On public evidence, Liquid Death is a high-quality, category-defining brand priced at roughly a 4x revenue
              multiple. The strong demand and distribution proof support quality, but missing private margin and
              unit-economics data and a premium price warrant a disciplined track / research-more stance rather than an
              unconditional buy until financials are confirmed.
            calloutType: recommendation
            claimRefs:
              - CV035
              - CV036
              - CV038
              - CV004
          - type: callout
            title: Value Is Most Sensitive to Growth Durability and Exit Multiple
            body: >-
              The scenario range — roughly $0.8B in a bear case to nearly $3B in a bull case — is driven almost entirely
              by how long double-digit growth persists and what exit multiple the market assigns. Margin conversion is
              the swing factor between them.
            calloutType: insight
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
          - type: callout
            title: Overvaluation, Down-Round, and Liquidity Risks Are Real
            body: >-
              Skeptics argue the $1.4 billion price embeds aggressive future growth; if growth slows before
              profitability, down-round and multiple-compression risk rise, and late-stage preferences plus liquidity
              timing could disadvantage common holders.
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV016
              - CV022
          - type: callout
            title: Convert the Call With Five Diligence Asks
            body: >-
              A buy decision hinges on five private items: audited financials, unit economics, the cap table and
              preference stack, credit-facility covenants, and account-concentration data. Securing these would convert
              the track call into a confident buy or avoid.
            calloutType: recommendation
            claimRefs:
              - CV038
              - CV040
              - CV028
              - CV029
