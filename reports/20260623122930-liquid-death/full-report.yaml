      - number: '5.2'
        title: Operating Architecture and Manufacturing
        blocks:
          - type: paragraph
            body: >-
              Liquid Death's operating model is an outsourced, asset-light beverage architecture. Water is sourced and
              treated to potable standards, recipes for flavored products are formulated and handed to contract
              co-packers, and aluminum cans sourced from can suppliers are filled, seamed, and quality-controlled to
              defined specifications before distribution. Like most challenger beverage brands, the company does not own
              plants; it relies on co-packers, which keeps it capital-light but concentrates operational risk on a small
              set of manufacturing partners and on aluminum supply. The architecture stacks cleanly from a brand and
              mission layer at the top, through product, packaging, formulation, and manufacturing, down to a
              distribution layer that spans retail, direct-to-consumer, and live events. Standard aluminum can
              manufacturing and rigorous fill-and-seam quality control underpin shelf stability and safety. The net
              picture is a simple, replicable platform optimized for speed and scale rather than proprietary process
              technology.
