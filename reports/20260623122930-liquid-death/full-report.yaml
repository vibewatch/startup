        title: Funding, Valuation, and Investors
        blocks:
          - type: paragraph
            body: >-
              Liquid Death's financing history runs from seed and Series A rounds in 2021 through a March 2024 Series E
              that raised approximately $67 million and valued the company at $1.4 billion. Cumulative equity raised is
              estimated at roughly $267 million across the round sequence, supplemented by a $55 million credit facility
              from Ares Management in December 2024 that added non-dilutive capital. The cap table blends institutional
              investors such as Science Inc., Access Industries and Convivialite Ventures (the venture arm of Pernod
              Ricard) with the strategic backer Live Nation Entertainment, which is both an equity investor and the
              exclusive venue water partner. A distinctive feature is the roster of celebrity investor-endorsers,
              including Tony Hawk, Travis Barker, Wiz Khalifa and Gary Vaynerchuk, who amplify the brand while holding
              equity. Because Liquid Death is private, the precise cap table, ownership percentages and governance
              rights are not disclosed, and round amounts before the Series E are largely undisclosed.
