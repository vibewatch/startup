  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Liquid Death's customer base operates on two levels. End consumers skew Gen Z and younger millennial,
              concentrated in urban and coastal markets, and divide into brand-led youth who treat the can as identity,
              sober-curious drinkers who use it as an alcohol alternative, health-conscious buyers drawn to zero-calorie
              water, household stock-up purchasers, and music and sports fans who encounter it at events. For these
              consumers the user is also the payer, since purchases are self-directed impulse and repertoire decisions.
              The second level is retail accounts, where category managers are the budget owners deciding assortment.
              Channels span convenience, grocery, warehouse club, e-commerce, and the exclusive Live Nation venue
              network, with no single dominant channel. The sober-curious occasion is particularly important because it
              widens the addressable base beyond traditional water buyers, letting one product serve hydration,
              soda-replacement, and alcohol-alternative jobs across distinct consumer segments.
