              - CR012
              - CR033
              - CR038
      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              The regulatory and legal picture is active but largely managed. Marketing that appeals to younger
              audiences can draw FTC scrutiny over fairness and deception, and recyclability and sustainability claims
              must be substantiated under the Green Guides, exposing the brand to greenwashing and false-advertising
              theories if messaging outruns evidence. Provocative content has previously been moderated or restricted by
              social platforms, a recurring reputational rather than legal cost. On litigation, the most prominent
              matter — a trademark dispute with PepsiCo over a Mountain Dew product — was resolved by settlement, and
              the much-publicized MSCHF collaboration used mock legal threats as a marketing device rather than real
              litigation. The company holds and defends multiple trademarks central to its identity and has both filed
              and faced challenges, an ongoing IP-management burden, while edgy marks can raise registrability
              questions. Federal records show limited active litigation at review time, and the overall picture is
              current as of early 2026.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
