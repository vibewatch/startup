        title: Dependencies and Supply-Chain Resilience
        blocks:
          - type: paragraph
            body: >-
              Because production is outsourced and physical, the most important operational questions concern
              dependencies. Aluminum can supply and can availability are critical upstream inputs that directly affect
              cost and the ability to produce, and any aluminum supply shock would flow straight through to operations.
              Co-packing capacity is the second critical dependency; concentrating fill-and-seam on few partners is a
              single-supplier risk that scaling brands typically mitigate by multi-sourcing capacity. Water sourcing,
              distributors and third-party logistics, the exclusive Live Nation venue channel, and the 133,000-plus
              retail doors complete the dependency graph that gates finished-product availability. Servicing live-event
              venues at scale is itself a distinct operational capability beyond ordinary retail logistics. The
              resilience question — how diversified the co-packing and aluminum supply base is — is partly unanswerable
              from public sources, which is a genuine diligence gap, but the structure of the dependencies is clear and
