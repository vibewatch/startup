callouts:
- calloutType: strength
  title: Large, Verifiable Revenue Scale With Premium Price Realization
  body: Public estimates and pricing data confirm Liquid Death has scaled to roughly $333 million of revenue at a premium price point well above estimated cost of goods, a genuinely strong top-line signal for a brand less than a decade old.
  claimRefs:
  - CI004
  - CI006
  - CI036
  - CI023
- calloutType: risk
  title: Margins, Burn and Unit Economics Are Undisclosed
  body: The investment case hinges on gross margin, marketing efficiency, and cash burn — none of which the private company discloses. Independent reporting questions whether margins justify the valuation, leaving a material evidence gap.
  claimRefs:
  - CI018
  - CI021
  - CI028
  - CI032
- calloutType: insight
  title: Debt Plus Equity Reflects a Capital-Intensive Physical Model
  body: Unlike software, Liquid Death must fund inventory across 133,000+ doors, making working capital intensive. The $55 million Ares facility complements equity precisely because the model is physical and working-capital heavy.
  claimRefs:
  - CI011
  - CI015
  - CI016
  - CI031
- calloutType: assumption
  title: Profitability Depends on Marketing Leverage at Scale
  body: The path to profitability assumes fixed marketing investment leverages over a growing revenue base. That is plausible for scaled challenger brands but unproven here without disclosed operating data.
  claimRefs:
  - CI019
  - CI020
  - CI024
  - CI029
