chapter:
  number: 4
  title: Financials
  summary: Liquid Death reported roughly $333M of 2024 revenue with a 2025 target near $340M, funded by about $267M of equity across its rounds plus a $55M Ares credit facility. As a private company it discloses no audited margins, burn, or unit economics, so this chapter triangulates revenue mix, pricing, and capital adequacy from public signals and flags the private-metric gaps that bound diligence.
sections:
- id: revenue-streams-and-pricing
  title: Revenue Streams and Pricing
  body: 'Liquid Death''s revenue is dominated by canned beverage sales spanning still and sparkling water, flavored sparkling SKUs, and ready-to-drink iced tea and lemonade, sold overwhelmingly through retail wholesale with a smaller direct-to-consumer channel and a higher-margin merchandise and licensing stream layered on top. Pricing sits firmly in the premium tier: single 16-ounce tallboys and multipacks command prices well above mainstream sparkling water and far above the estimated cost of goods, which is driven primarily by aluminum and co-packing inputs. The revenue model bridges from gross retail sales through retailer and distributor margins to recognized brand net revenue, with direct-to-consumer and merchandise improving net realization. Because the company publishes no segment breakdown, stream shares are qualitative estimates, but the consistent signal across sources is premium price realization on a fundamentally transactional, non-recurring revenue base.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI006
  - CI023
  - CI024
  - CI025
  - CI030
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: unit-economics-and-cost-structure
  title: Unit Economics and Cost Structure
  body: The economics of canned water hinge on a small number of levers, most of which are undisclosed. Aluminum cans and co-packing are the largest variable costs, and distributor and retailer margins absorb a meaningful share of the shelf price before revenue reaches the brand. Gross margin is the single most important undisclosed driver of the investment case; industry benchmarks suggest canned-water brands can run a wide margin range depending on scale and co-packing terms. Marketing intensity is elevated, as the brand spends heavily to drive trial, which both fuels growth and pressures near-term profitability. Working capital is intensive because inventory must be staged across more than 133,000 retail doors. The net read is positive contribution per case with improving operating leverage as fixed marketing spreads over a larger revenue base, but the absence of audited margin and CAC data keeps these conclusions in estimate territory.
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010
  - CI028
  - CI029
  - CI034
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: capital-structure-and-adequacy
  title: Capital Structure and Adequacy
  body: 'Liquid Death''s capital base combines roughly $267 million of equity invested across its financing rounds with a $55 million credit facility from Ares Management secured in December 2024. SEC Form D exempt-offering filings document the private securities sales underpinning the equity, providing a rare piece of primary-source evidence in an otherwise opaque picture. The decision to add debt is logical for a physical-product business with intensive working-capital needs: inventory and marketing must be funded ahead of sell-through, and non-dilutive capital extends runway without further dilution. Cash on hand, burn, and runway are not disclosed, so capital adequacy can only be inferred from the scale of raised capital against growth spend. The most likely next-financing or IPO trigger appears tied to demonstrating sustainable profitability rather than revenue growth alone, which management has signaled is the gating milestone.'
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  - CI016
  - CI022
  - CI026
  - CI027
  - CI031
  tableRefs:
