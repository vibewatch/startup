  figureRefs:
  - FI004
- id: public-traction-versus-private-gaps
  title: Public Traction Versus Private-Metric Gaps
  body: 'The verifiable public picture is strong on traction and weak on profitability. Third-party estimates and company guidance consistently place revenue near $333 million in 2024 with a 2025 target around $340 million, and these figures are directionally consistent across independent sources even though they are unaudited. What remains entirely private is the part that determines value creation: gross margin, net income, cash burn, CAC and payback, segment revenue, and working-capital intensity. Independent reporting explicitly questions how much cash was consumed to reach scale and whether margins justify the $1.4 billion valuation, which rests on growth and brand rather than disclosed profit. This asymmetry — robust top-line evidence against opaque bottom-line evidence — defines the financial diligence agenda and is the principal reason conviction must remain qualified until management data is shared.'
  claimRefs:
  - CI004
  - CI005
  - CI018
  - CI021
  - CI032
  - CI033
  tableRefs:
  - TI005
  figureRefs:
  - FI003
- id: financial-verdict-and-blockers
  title: Financial Verdict and Diligence Blockers
  body: 'On balance, Liquid Death presents high-quality revenue scale and premium price realization offset by unproven profitability and a capital-intensive model. Revenue quality is solid in magnitude but structurally transactional and non-recurring, unlike subscription businesses, so durability depends on sustained brand demand and repeat purchase rather than contracted revenue. The margin path is plausible given the scale-leverage dynamics seen in other challenger beverage brands, but it is unconfirmed. Capital intensity is real and appropriately financed with a blend of equity and debt. The decisive diligence blockers are disclosure of gross margin, cash burn and runway, and unit-economics cohorts; until those are provided under NDA, the valuation cannot be independently validated against profit evidence. The verdict is therefore a constructive but conditional one: strong commercial traction, incomplete financial proof.'
  claimRefs:
  - CI019
  - CI020
  - CI025
  - CI032
  - CI035
