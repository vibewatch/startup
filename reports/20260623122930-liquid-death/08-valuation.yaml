- id: scenarios-and-sensitivity
  title: Scenarios and Sensitivity
  body: Three scenarios bound the outcome. The bull case assumes sustained growth, multiple expansion to roughly 6-8x, and a strong exit window, producing meaningful uplift; the base case assumes continued double-digit growth with gradual margin improvement at a 4-5x multiple and a solid strategic exit; the bear case assumes growth deceleration and multiple compression to 2-3x, implying a down-round or soft exit. Translated to value, this spans roughly $0.8 billion in the bear case to nearly $3 billion in the bull case against a $1.4 billion entry, with a base implied MOIC around 1.35x. The sensitivity is dominated by two levers — how durably double-digit growth persists and what exit multiple the market assigns — while margin conversion is the swing factor that determines which scenario plays out. Because both levers are partly unobservable from public data, the scenarios are best treated as a disciplined range rather than a precise point estimate.
  claimRefs:
  - CV025
  - CV026
  - CV031
  - CV032
  - CV033
  - CV034
  - CV039
  tableRefs:
  - TV003
  figureRefs:
  - FV002
- id: recommendation-and-exit
  title: Recommendation, Exit, and Diligence Asks
  body: 'Weighing thesis, anti-thesis, comparables and scenarios, the disciplined recommendation on public evidence is track / research-more, not an unconditional buy: the brand quality and demand proof are strong, but the premium price and missing private financials cap conviction. Confidence is medium and the risk rating medium given concentration, imitability and capital intensity. On exits, strategic M&A is the most credible near-term path because acquirers prize established distribution and cultural brand equity, while an IPO remains conditional on a selective consumer window and audited-financial readiness; private holders also face liquidity-timing and preference-overhang risk. Converting this call into a confident buy or avoid requires five diligence asks — audited financials, unit economics, the cap table and preference stack, credit-facility covenants, and account-concentration data. Until those are obtained, entry discipline and a margin of safety between price and evidence-supported value should govern any decision, with defined thesis-break triggers monitored throughout.'
