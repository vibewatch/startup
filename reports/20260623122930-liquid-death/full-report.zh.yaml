chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Liquid Death 是一家位于洛杉矶的美国饮料公司，由前广告创意总监 Mike Cessario 于 2019
              年创立；公司围绕刻意荒诞的重金属和死亡金属美学搭建品牌。品牌销售纯净水、气泡水、风味气泡水、冰茶和柠檬水，全部装入 16oz 铝制高罐，并以可无限回收为卖点。其核心定位浓缩在标语「Murder Your
              Thirst」里，可持续叙事则被包装为用铝罐替代一次性塑料瓶、从而「murder plastic pollution」的使命。旗舰产品包括 DEAD WATER 纯净水和气泡水、Severed Lime
              气泡水、Mango Chainsaw，以及半冰茶半柠檬水的 Armless Palmer。原味水产品主打零卡、零甜味剂，让 Liquid Death 同时踩住健康主张和朋克娱乐品牌两个位置。
