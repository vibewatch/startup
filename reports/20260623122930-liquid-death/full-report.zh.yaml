        blocks:
          - type: paragraph
            body: >-
              从能力看，Liquid Death 的明确领先点是品牌和营销病毒性，得分高于所有对手；但在口味科学上，它只是持平或落后于巨头和 clean-label
              挑战者。其分销很强，并由现场活动渠道形成独特增强，不过饮料巨头仍保有更强的灌装商触达，自有品牌则受益于零售商对货架空间的所有权。在可持续包装上，Liquid Death
              的铝罐定位很强，但随着整个行业转向罐装，这一点正越来越被追平。价格上，Liquid Death 与 Spindrift、Topo Chico 同处高端层级，显著高于主流 LaCroix
              和自有品牌。独立味觉测试发现，品牌对偏好的预测力很弱，这意味着溢价靠的是身份和文化，而不是可证明的产品优越性。因此，零售商最终奖励的指标是货架周转，而不是配方。
