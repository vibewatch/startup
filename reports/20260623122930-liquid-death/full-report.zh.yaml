            body: >-
              采用图景强劲，且证据充分。联合面板数据表明，罐装水买家更偏年轻，复购有意义，家庭渗透率上升且更多是增量而非替代，跨 SKU
              购买也在增长，因为客户会加入风味和茶类变体。对一个私营品牌来说，具名客户证明异常具体：Whole Foods 和 Target 全国全线铺货，Amazon 将其列入畅销水品类且存在
              subscribe-and-save 需求，Costco 和 7-Eleven 带来会员店和便利店触达，Live Nation
              则让它成为旗下场馆的独家水。上述证据很近——多数日期在最近几个月内——且反映的是完整生产分销，而非试点，这实质性增强了需求论点。剩余限制在于枚举完整性：具名名单覆盖主要客户，但不穷尽每一个区域铺货方，因此最好视作强代表性样本。
