      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              几个结构性驱动正在扩大品类。塑料污染担忧把需求推向铝罐，清醒好奇运动放大了非酒精饮用场景，气泡水持续跑赢纯净水，年轻消费者愿意为品牌身份付费也支撑了高端定价。大型酒企为对冲饮酒率下滑而关注非酒精邻近市场，也进一步验证了这一机会。顺风之下仍有真实约束。水本质上是低差异化大宗商品，持久定价权几乎完全依赖品牌。大量模仿者正在复制
              Liquid Death 的品牌打法，零售商自有品牌压低高端定价，环保批评者也质疑罐装瓶装水是否真的比自来水更可持续。净判断是：需求侧动能强劲，但供给侧商品化压力长期存在，因此品牌耐久性和渠道准入将决定竞争结果。
