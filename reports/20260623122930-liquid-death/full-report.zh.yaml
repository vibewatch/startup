          - type: callout
            title: 价值对增长耐久性和退出倍数最敏感
            body: 情景区间——熊市约 $0.8B，牛市接近 $3B——几乎完全由双位数增长能持续多久、市场给出什么退出倍数驱动。毛利转化是两者之间的摇摆因素。
            calloutType: insight
