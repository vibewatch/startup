      - number: '2.3'
        title: 买方细分与采用路径
        blocks:
          - type: paragraph
            body: >-
              Liquid Death
              的需求集中在受品牌驱动的年轻消费者、对清醒生活方式感兴趣的饮者、健康意识强的购水人群，以及音乐和极限运动文化圈；家庭囤货买家和零售品类经理补足了这幅图。大多数细分里，使用者也是预算所有者，因为这些是自购型冲动消费和常备组合产品，而不是委员会采购。采用路径通常从社交媒体和营销触达，或现场活动邂逅开始；随后在便利店、会员店或
              DTC 渠道试购，再转化为复购；最投入的买家会进一步形成多 SKU 和周边忠诚。调查显示，多数年轻消费者愿意为强品牌身份的饮料支付溢价，这正是该品类定价的经济引擎。零售商也在把更多货架分配给
              better-for-you 饮料，进一步强化从认知到复购的漏斗。
