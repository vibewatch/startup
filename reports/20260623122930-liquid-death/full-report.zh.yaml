  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与产品线
        blocks:
          - type: paragraph
            body: >-
              用客户工作流来讲，Liquid Death 的产品是一种完成补水任务的罐装饮料，同时让买家表达身份和价值观。产品线刻意聚焦：成熟核心是纯净水和气泡水，增长引擎是 Severed Lime、Mango
              Chainsaw 等风味气泡 SKU，相邻产品是即饮冰茶和 Armless Palmer 茶柠檬水；全部统一使用 16oz
              铝制高罐。季节性和限量口味持续轮换，以保持组合新鲜感；增长中的周边产品线则把品牌延展到饮料之外。使用场景覆盖日常补水、清醒好奇场景下的酒精替代、通过现场活动渠道服务的演唱会补给、汽水替代，以及纯粹的品牌表达。统一线索是：同一种简单液体能服务多种任务，因为承担差异化的是品牌，而不是配方。
