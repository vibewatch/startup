        title: 收入流与定价
        blocks:
          - type: paragraph
            body: >-
              Liquid Death 的收入主要来自罐装饮料销售，覆盖纯净水、气泡水、风味气泡 SKU，以及即饮冰茶和柠檬水；绝大部分通过零售批发卖出，较小的 DTC
              渠道和更高毛利的周边与授权收入叠在其上。定价牢牢处于高端层级：单支 16oz
              高罐和组合装价格显著高于主流气泡水，也远高于估计的商品成本；成本主要由铝材和代工灌装投入驱动。收入模型从零售总销售额，经零售商和分销商利润，再桥接到品牌确认的净收入；DTC
              和周边改善了净实现。由于公司不发布分部拆分，各收入流占比只能定性估计；但各来源传递的信号一致：在一个本质上交易型、非经常性收入基础上，公司实现了高端价格。
