      - number: '2.2'
        title: 多重视角下的市场规模
        blocks:
          - type: paragraph
            body: >-
              与其用单一数字概括，这个品类机会更适合用嵌套视角理解。全球包装水的总可寻址市场价值达数千亿美元，并以中个位数增速增长；仅美国就代表每年数百亿美元瓶装水收入。在其中，与 Liquid Death
              最相关的可服务细分——高端和风味气泡水——是一个数十亿美元市场，增速处于高个位数到双位数区间，旁边还有规模相近的即饮冰茶和柠檬水邻近品类。放在这些口径下，Liquid Death 约 $333M
              年销售额只意味着美国包装水低个位数份额，凸显仍有可观空间。由于第三方估计会随定义和方法而分歧，负责任的表述应是经多家独立研究机构交叉印证的区间，而不是一个精确点值。
