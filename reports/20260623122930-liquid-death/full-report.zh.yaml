            body: >-
              综合来看，Liquid Death
              展现出高质量收入规模和高端价格实现，但盈利能力尚未证明，模型也占用资本。收入质量在规模上扎实，但结构上是交易型、非经常性，不同于订阅业务；因此耐久性取决于持续品牌需求和复购，而不是合同收入。参照其他挑战者饮料品牌的规模杠杆，利润率路径可信，但尚未确认。资本强度真实存在，并用股权和债务组合融资，结构上合适。决定性的尽调阻塞项是披露毛利率、现金消耗与
              runway、单位经济 cohort；在 NDA 下取得这些数据之前，估值无法用利润证据独立验证。因此，结论是建设性但有条件的：商业牵引强，财务证明不完整。
