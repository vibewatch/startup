    Palmer），另有季节性口味，全部采用 16oz 可无限回收铝制高罐包装。核心水产品为零卡、零甜味剂。增长中的周边产品线（服饰、配件、滑板）继续延展品牌。
  customerFocus: Gen Z 和年轻千禧一代、对清醒生活方式感兴趣、受健康与文化驱动的消费者；以及零售客户和 Live Nation 现场活动渠道。
  businessModel: |
