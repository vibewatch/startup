      - number: '1.5'
        title: 品牌、营销与合作
        blocks:
          - type: paragraph
            body: >-
              Liquid Death 的增长引擎是营销，公司把营销当作喜剧娱乐内容，而不是传统广告。Campaign
              刻意拥抱冲击感、重金属视觉和荒诞幽默；品牌也经常被列入最具创新性的消费公司，因为它把水做成了带服饰、配件和新奇周边的生活方式产品。合作进一步强化品牌：Live Nation
              提供独家演唱会和场馆渠道，公司也与极限运动和娱乐圈人物合作。但同样的锋芒也带来反复争议。Instagram 曾因暴力内容删除或限制帖子，批评者也周期性地把品牌斥为噱头。因此，营销飞轮是一项双刃资产：它带来超额
              earned media 和文化相关性，也让公司暴露于平台审核风险和声誉反弹；随着规模扩大，这些问题可能让零售或广告关系更复杂。
