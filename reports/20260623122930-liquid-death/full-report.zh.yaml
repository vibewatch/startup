              $340M；虽然未经审计，但这些数字在独立来源之间方向一致。完全私有的部分，恰恰决定价值创造：毛利率、净利润、现金消耗、CAC
              和回本期、分部收入以及营运资本强度。独立报道明确质疑公司为达到规模消耗了多少现金，以及利润率能否支撑 $1.4B 估值；该估值更多建立在增长和品牌上，而非已披露利润。这种不对称——强劲的 top-line
