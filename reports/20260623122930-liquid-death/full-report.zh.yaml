      - number: '1.4'
        title: 规模、指标与分销
        blocks:
          - type: paragraph
            body: >-
              Liquid Death 已经长成大规模消费饮料业务。公司披露 2024 年收入约 $333M，并指引 2025 年约 $340M；其全球分销覆盖 133,000 多个零售点，包括 Whole
              Foods、Target、7-Eleven、Costco 和 Amazon。分销轨迹本身就是里程碑：公司从靠病毒视频营销启动的 DTC 线上业务，约三年内进入全国性零售。Live Nation
              的独家场馆协议又增加了演唱会和现场活动渠道，这一点很少有饮料品牌能匹配。员工数估计超过 300 人，但公司未发布正式数字。以约 $333M 的 2024 年收入对应 $1.4B 报道估值，隐含收入倍数约 4
              倍；这一溢价反映的是品牌强度和增长预期，而非已披露的盈利能力，因为毛利率和净利润仍属私有信息。
