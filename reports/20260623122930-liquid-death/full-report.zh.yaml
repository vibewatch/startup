        title: 图表
        blocks:
          - type: callout
            title: 前卫营销带来的监管与声誉暴露
            body: >-
              Liquid Death 的挑衅式品牌既是增长引擎，也是最大的声誉风险：面向年轻受众的营销会招来 FTC 审查，环保声明必须按 Green Guides
              提供支撑，挑衅式内容此前也被平台限流。尚未出现执法，但暴露是结构性的。
