      - number: '3.3'
        title: 分销力量、切换与锁定
        blocks:
          - type: paragraph
            body: >-
              包装水的切换成本极低：购买承诺低、偏冲动，买家会同时购买多个品牌，忠诚度中等且容易被价格或新鲜感打断。这种动态让分销力量成为决定性竞争变量。巨头借 Coca-Cola 和 PepsiCo
              灌装商网络主导货架与场内铺货，零售商则把空间分配给周转最高的品牌。Liquid Death 的反击有两层：能推动周转的文化需求，以及通过 Live Nation
              获得、竞争者无法匹配的独家现场活动分销渠道。与此同时，自有品牌利用零售商掌控货架的优势压低价格。多品牌并存品类里，份额可逆；因此，Liquid Death 必须持续把品牌注意力转化为可量化
              sell-through，才能在资源更强的巨头和更便宜的自有品牌替代面前守住并扩大分销覆盖。
