      - number: '6.3'
        title: 留存、满意度与忠诚度
        blocks:
          - type: paragraph
            body: >-
              留存和满意度信号为正，但需要限定。整体评论情绪在品牌、包装和口味上都很有利，订阅和 subscribe-and-save
              的采用也显示真实经常性需求。不过，忠诚度只是中等，因为该品类多品牌购买很重，切换几乎无摩擦，所以留存依赖持续品牌投入，而不是结构性锁定。示意性 cohort 视角显示，DTC 订阅者留存远好于冲动消费
              cohort，凸显直接关系的战略价值。两个反复出现的负面因素压低了图景：即便在忠诚买家中，高端定价也是最常见抱怨；区域可得性缺口也制造替代风险，因为更便宜的替代品总在相邻货架上。净判断是：客户基础满意但价格敏感，其耐久性真实存在却不能保证，真实
              cohort 留存仍属私有信息。
