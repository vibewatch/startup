      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管和法律图景活跃，但大体可控。面向年轻受众的营销可能因公平性和欺骗性问题招致 FTC 审查；可回收和可持续声明必须按 Green Guides
              提供支撑，一旦话术跑在证据前面，品牌就会暴露在漂绿和虚假广告理论下。挑衅式内容过去曾被社交平台限流或限制，这是一项反复出现的声誉成本，而非法律成本。诉讼层面，最受关注的事项——与 PepsiCo 围绕一款
              Mountain Dew 产品的商标纠纷——已通过和解解决；广受报道的 MSCHF 合作使用模拟法律威胁作为营销装置，并非真实诉讼。公司持有并维护多项对身份认同至关重要的商标，也曾主动发起和应对挑战，构成持续的
              IP 管理负担；前卫商标还可能引发可注册性问题。联邦记录显示，截至 2026 年初复核时，活跃诉讼有限，整体图景以当时为准。
