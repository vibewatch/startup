      - number: '6.4'
        title: 扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              扩张层面，Liquid Death 在既有客户里有清晰的 land-and-expand 抓手：增加风味和茶饮 SKU、拿下季节性和限量陈列、带动多 SKU 与周边商品交叉购买，进而做深单个账户收入。DTC
              订阅又提供了一条留存更高的扩张路径。机会背后是集中度风险。高端水销量很大一部分流经少数大型零售账户，需求中相当一块也依赖 Live Nation
              这一单一伙伴关系；任何一个账户或渠道丢失、降级，影响都会很大。采购摩擦，包括零售商条款和进场费，等级较低但持续存在。平衡看，客户侧经济性正靠账户内扩张改善，但账户和渠道集中度是最需要跟踪的客户风险，主要缓释手段是分散零售基础，并把活动分销拓宽到单一伙伴之外。
            claimRefs:
              - CU016
              - CU017
              - CU026
              - CU032
              - CU033
          - type: table
            tableRef: TU005
            claimRefs:
              - CU016
              - CU026
