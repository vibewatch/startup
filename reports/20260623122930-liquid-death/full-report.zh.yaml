      - number: '7.3'
        title: 运营与质量风险
        blocks:
          - type: paragraph
            body: >-
              运营风险集中在这门外包、实体属性强的生意上。罐装饮料生产商面临污染或包装缺陷导致的召回暴露；Liquid Death
              依赖合同代工厂，质量控制落在第三方手里，因此质量事件发生概率和品牌冲击都会被放大。水源必须满足源头质量和处理标准，这项依赖发生概率较低但影响很高。铝罐是关键投入，其供应和价格可能约束产量，双重采购可部分缓释。物流和分销中断构成这一风险组的其余部分。公开记录中尚未出现重大事件，但一旦召回，影响会很高，所以缓释成熟度——代工厂审计、双重采购和质量体系——是核心尽调问题。依赖图把铝和代工厂标为主要上游单点故障，连续性就压在这些环节上。
