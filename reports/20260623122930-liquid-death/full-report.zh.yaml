companyProfile:
  summary: >
    Liquid Death 是一个消费饮料品牌，由 CEO Mike Cessario 于 2019 年创立，销售罐装纯净水、气泡水、冰茶和柠檬水，统一使用 16oz 高罐铝罐包装，并刻意采用挑衅性的重金属美学和「Murder
    Your Thirst」标语。公司把水这种大宗商品改造成高周转生活方式品牌，约三年内从 DTC 线上销售扩张到 133,000 多个零售点（Whole Foods、Target、Costco、7-Eleven、Amazon），并拿下
    Live Nation 场馆独家渠道协议。Liquid Death 在 2024 年 3 月 Series E 轮估值达到 $1.4B，历轮股权融资约 $267M，另于 2024 年 12 月获得 Ares Management
    提供的 $55M 信贷额度。第三方估计 2024 年收入接近 $333M，2025 年目标约 $340M。其可持续使命「Murder plastic
    pollution」押注可无限回收的铝材，增长中的周边业务也在延展品牌。作为私营公司，Liquid Death 不披露经审计财务、利润率或单位经济。
  foundedDate: '2019-01-01'
  founders:
    - name: Mike Cessario
      role: 联合创始人兼 CEO
      background: 前创意总监；构思了 Liquid Death 的重金属品牌，并带领公司从 DTC 扩张到大众零售。
