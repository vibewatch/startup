  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Liquid Death 竞争于高端和 better-for-you 包装水品类，覆盖纯净水、气泡水、风味气泡水，以及装在可回收铝罐中的即饮冰茶和柠檬水。相关边界以高端罐装水和气泡水为核心，风味气泡水与 RTD
              茶 /
              柠檬水是快速增长的子赛道，功能性补水则是相邻机会。被排除或仅相邻的品类包括塑料瓶装大宗水、碳酸软饮、能量饮料和电解质粉；最主要的现状替代品仍是自来水。该品类由品牌和场景定义的程度不亚于液体本身：同一个消费者可能在不同语境下把
              Liquid Death 当作水、汽水替代品或酒精替代品。渠道范围很宽，横跨商超、会员店、便利店、DTC 和一层差异化的现场活动渠道；美国是核心收入基地，全球扩张则具选择性。
            claimRefs:
              - CM001
              - CM002
              - CM022
              - CM024
              - CM028
              - CM036
