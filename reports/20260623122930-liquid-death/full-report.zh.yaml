        title: 图表
        blocks:
          - type: callout
            title: 跟踪 / 继续研究，而非无条件买入
            body: >-
              基于公开证据，Liquid Death 是一个高质量、定义品类的品牌，定价约为 4x 收入倍数。强需求和分销证明支撑其质量，但私有毛利和单位经济数据缺失，再加上高端定价，要求投资人保持有纪律的跟踪 /
              继续研究姿态；在财务得到确认前，不应无条件买入。
            calloutType: recommendation
            claimRefs:
              - CV035
              - CV036
              - CV038
