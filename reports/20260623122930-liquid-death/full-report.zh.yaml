  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资假设与反向假设
        blocks:
          - type: paragraph
            body: >-
              Liquid Death 的投资理由建立在五根支柱上。品牌是定义品类的文化资产，把商品化饮用水变成高周转生活方式产品；分销覆盖超过 133,000 个门店，并拥有 Live Nation 独家场馆渠道；高端水和
              RTD 市场规模大且在增长；收入快速放大，接近约 $340M
              的目标；多头认为这类增长足以支撑溢价倍数。反向假设同样具体：品牌新鲜感可能疲劳，账户和渠道集中度带来脆弱性，品类拥挤且用户多品牌并用，毛利薄、资本密集且没有公开财务数据可核实，怀疑者则认为约 4x
              收入倍数已经计入尚未证明的未来增长。可信估值必须同时权衡两面，而不是线性外推品牌故事；公开证据整体支持其质量，但价格与价值的问题仍真正开放。下方每根支柱都锚定在市场、产品、客户、财务、竞争和风险章节形成的证据上，而不是单靠品牌叙事主张。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV022
              - CV034
