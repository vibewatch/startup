      - number: '7.4'
        title: 伙伴、依赖与财务风险
        blocks:
          - type: paragraph
            body: >-
              伙伴和财务风险源于集中度。高端水销量很大一部分流经少数大型零售账户，抬高收入波动和议价暴露；Live Nation
              独家场馆协议则把整条渠道押在一个伙伴身上，而该伙伴的优先级可能变化。快速增长期间，分销商网络持续切换，如果节奏安排不慎，可能带来服务缺口和渠道扰动。资产负债表上，Ares
              信贷额度给一家原本由股权融资支撑的公司增加了契约和再融资风险；作为私营借款人，其契约条款并未披露。更广泛地说，实体饮料业务资本开支高，毛利相对软件式同行更薄；没有公开 SEC 文件，也限制了公司未来 IPO
              前的财务透明度。这些依赖一旦失效，最容易直接传导为投资影响，也是 thesis-break 触发项的锚点。
            claimRefs:
