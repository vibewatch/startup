      - number: '8.2'
        title: 估值与可比公司
        blocks:
          - type: paragraph
            body: >-
              2024 年 3 月，Liquid Death 的 Series E 轮以 $1.4 billion 估值定价，基于约 $333M 的 2024 年销售额，隐含收入倍数接近 4x；公司历轮累计募得约 $267
              million 股权资金，并由 Form D 文件佐证。这个倍数落在高增长饮料品牌区间内；该类品牌曾以中个位数到低双位数收入倍数定价，高于约 2-4x 的商品化 CPG
              和上市饮料巨头，但低于软件可比公司。公允读法应混合上市龙头、后期增长挑战者、高端水私募轮、战略饮料 M&A 和二级市场指示性报价，而不是依赖单一锚点。二级平台显示，IPO
              前兴趣接近上一轮价格并带有流动性折价，但这些报价只是指示性，不是可靠价格。克制结论是：估值处于合理到偏紧之间；若增长和毛利守住，可以辩护，若守不住，则容易被压缩。
