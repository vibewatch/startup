              - CU033
      - number: '6.5'
        title: 证据质量与可靠性
        blocks:
          - type: paragraph
            body: >-
              以尽调标准看客户证据，不能只看方向，还要看质量。最强信号来自具名零售账户证明和电商排名：这些信号可观察、较新，并由多个独立来源相互印证；另一个强信号是 NielsenIQ 和 Circana
              的联合面板数据，覆盖人口结构、复购和渗透率，来源声誉高。较弱信号来自 Yelp、Reddit、Trustpilot 和 ConsumerAffairs
              等评价站点的情绪反馈；它们能提示价格敏感、供货缺口等主题，但样本自选择，并不具备统计代表性。最关键的缺口仍是私有数据：管理层才掌握的 cohort
              留存、复购率和账户集中度。诚实结论是，公开证据足以有力证明需求和合理满意度，但真正影响生命周期价值的耐久性和集中度问题，需要在尽调中直接从一手数据取得答案。
            claimRefs:
              - CU028
              - CU034
              - CU035
              - CU036
