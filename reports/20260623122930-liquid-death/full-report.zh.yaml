      - number: '2.5'
        title: 规模不确定性与证据缺口
        blocks:
          - type: paragraph
            body: >-
              本章的主要分析风险是估计可靠性。不同研究机构给出的高端和罐装水市场规模差异显著，因为该细分年轻、变化快、定义不统一——有的口径纳入所有气泡水，有的只统计高端或功能性产品，很少有口径单独隔离罐装形态。因此，任何单一品牌的可服务可获得市场只能划边界，无法精确定位；在获得细颗粒度扫描和渠道数据之前，Liquid
              Death
              的现实份额上限仍是开放问题。这些不确定性不削弱「品类庞大且增长」这一结论，但提醒我们不要给出精确份额或获取率预测。尽调路径应是交叉比对多个独立估计，获取按渠道拆分的零售扫描数据，并把公司披露销售额与品类层面美元增长对齐，以验证份额轨迹。
            claimRefs:
              - CM030
              - CM034
              - CM035
              - CM008
