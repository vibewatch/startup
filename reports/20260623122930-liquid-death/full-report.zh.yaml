      - number: '5.2'
        title: 运营架构与制造
        blocks:
          - type: paragraph
            body: >-
              Liquid Death
              的运营模型是一套外包、轻资产的饮料架构。水源经处理达到饮用标准；风味产品配方完成后交给合同代工灌装商；从罐供应商采购的铝罐按既定规格完成灌装、封口和质控，再进入分销。和多数挑战者饮料品牌一样，公司不自建工厂，而是依赖代工灌装商；这让公司保持轻资本，但也把运营风险集中到少数制造伙伴和铝材供应上。架构自上而下清晰堆叠：顶部是品牌与使命层，往下是产品、包装、配方和制造，底部是覆盖零售、DTC
              与现场活动的分销层。标准铝罐制造和严格灌装封口质控支撑货架稳定性与安全性。整体来看，这是一个简单、可复制的平台，为速度和规模优化，而不是为专有工艺技术优化。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE025
              - CE034
