      - number: '8.3'
        title: 情景与敏感性
        blocks:
          - type: paragraph
            body: >-
              三个情景给结果划边界。牛市情景假设增长持续、倍数扩张至约 6-8x、退出窗口强劲，从而带来明显上行；基准情景假设继续保持双位数增长、毛利逐步改善、倍数为
              4-5x，并实现稳健战略退出；熊市情景假设增长减速、倍数压缩至 2-3x，意味着 down round 或偏弱退出。折算成价值，熊市约 $0.8 billion，牛市接近 $3 billion，对应 $1.4
              billion 入场估值，基准隐含 MOIC 约
              1.35x。敏感性主要由两个杠杆决定——双位数增长能持续多久，以及市场给出什么退出倍数；毛利转化则是决定落入哪一情景的摇摆因素。由于两个杠杆都无法完全从公开数据观察，这些情景更适合作为一组有纪律的区间，而不是精确点估计。
            claimRefs:
              - CV025
              - CV026
              - CV031
              - CV032
              - CV033
              - CV034
