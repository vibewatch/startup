  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分
        blocks:
          - type: paragraph
            body: >-
              Liquid Death 的客户基础分为两层。终端消费者偏 Gen Z
              和年轻千禧一代，集中在城市和沿海市场，并可拆成几类：把罐身当作身份表达的品牌驱动年轻人、把它当作酒精替代的清醒好奇饮者、被零卡水吸引的健康意识买家、家庭囤货购买者，以及在活动中接触产品的音乐和体育粉丝。对这些消费者来说，使用者也是付款者，因为购买多为自主的冲动消费和常备组合决策。第二层是零售客户，品类经理作为预算所有者决定选品。渠道横跨便利店、商超、仓储会员店、电商和独家
              Live Nation 场馆网络，没有单一主导渠道。清醒好奇场景尤其重要，因为它把可寻址基础扩展到传统购水人群之外，让一个产品同时服务补水、汽水替代和酒精替代等不同消费者任务。
