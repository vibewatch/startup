      - number: '4.2'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >-
              罐装水的经济性取决于少数杠杆，其中大多数未披露。铝罐和代工灌装是最大的可变成本；收入到达品牌之前，分销商和零售商利润会吃掉货架价的有意义份额。毛利率是投资论点中最重要的未披露驱动；行业基准显示，罐装水品牌会因规模和代工条款不同而落在很宽的利润率区间。营销强度偏高，品牌大笔投入拉动试用，既推动增长，也压制近期盈利能力。由于库存必须铺到
              133,000 多个零售门店，营运资本占用较重。净判断是：单箱贡献为正，随着固定营销投入摊到更大收入基数上，经营杠杆会改善；但缺少经审计利润率和 CAC 数据，使这些结论仍停留在估计区间。
