      - number: '5.3'
        title: 依赖关系与供应链韧性
        blocks:
          - type: paragraph
            body: >-
              生产外包且产品为实体，最重要的运营问题就集中在依赖关系上。铝罐供应和罐体可得性是关键上游投入，直接影响成本和生产能力；任何铝材供应冲击都会直接传导到运营。代工灌装产能是第二个关键依赖；把灌装和封口集中在少数伙伴身上，会形成单一供应商风险，成长型品牌通常用多来源产能来缓解。水源、分销商和第三方物流、独家
              Live Nation 场馆渠道，以及 133,000
              多个零售门店，共同构成决定成品可得性的依赖图谱。规模化服务现场活动场馆，本身就是不同于普通零售物流的独特运营能力。韧性问题——代工灌装和铝材供应基础到底有多分散——公开来源只能回答一部分，这是真实尽调缺口；但依赖结构很清楚，也符合品类典型形态。
            claimRefs:
              - CE014
              - CE015
              - CE016
              - CE021
              - CE027
              - CE028
              - CE035
