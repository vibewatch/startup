      - number: '7.5'
        title: 人、缓释措施与否决标准
        blocks:
          - type: paragraph
            body: >-
              执行风险集中在人和品牌上。创始人 CEO 承载品牌本身，若领导层变化，会形成关键人风险；以新鲜感驱动的营销机器如果 campaign
              失去冲击力，也会出现疲劳风险；快速扩张还会带来普通的组织压力。与之对应，缓释框架具体且可监控。监管暴露靠声明佐证和法律复核缓释；运营风险靠铝罐与代工厂双重采购、质量审计缓释；伙伴和集中度风险靠账户分散和活动渠道拓宽缓释；资本风险靠维持契约余量和股权缓冲缓释。每一组风险都对应一个监控指标和一个
              thesis-break 触发项：FTC 对声明采取不利行动、重大产品召回、前三大账户或 Live Nation
              协议流失、营销效率大幅下滑，或违反契约。仍有两个开放尽调问题——未披露的契约条款和任何私有事故历史——应直接向管理层确认。
