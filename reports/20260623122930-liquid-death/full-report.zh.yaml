      - number: '5.5'
        title: 路线图与成熟度展望
        blocks:
          - type: paragraph
            body: >-
              Liquid Death 的未来路线图建立在延展，而不是重造之上。最可见的动作，是以持续节奏推出季节性和限量口味，刷新产品线并制造新鲜感；同时周期性推出新的气泡
              SKU，并继续放大冰茶和柠檬水邻近品类。产品之外，路线图包括选择性国际扩张、增长中的周边和品牌延展业务，以及探索包装形态扩展以触达新场景。成熟度有意保持不均衡：核心水产品线已经完全成熟，是组合锚点；风味气泡和
              RTD
              邻近品类仍在放量，承载更多执行和竞争风险。关键在于，路线图依赖口味和形态扩张，而不是核心技术变化，因此执行风险偏运营而非技术。主要限制是可见度：公开证据能看到发布模式，但看不到内部路线图，所以当前产品线之外的增长耐久性仍是尽调问题。
