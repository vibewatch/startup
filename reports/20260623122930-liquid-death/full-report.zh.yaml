  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重程度
        blocks:
          - type: paragraph
            body: >-
              Liquid Death 的风险画像主要由其推动增长的挑衅式品牌策略决定。按剩余暴露排序，最高的几组风险是：前卫与环保营销带来的监管和声誉风险；第三方代工厂集中的运营召回风险；Live Nation
              渠道和少数大型零售商带来的伙伴与账户集中度；Ares 融资安排和实体商品低毛利带来的资本与契约风险；以及创始人 CEO
              和营销疲劳相关的执行风险。迄今尚未出现执法、召回或旗舰账户流失，因此多数风险仍可监控，而非已经兑现。本章的严重程度来自引用证据和品类类比，而不是直觉：召回和账户流失情景的影响最高，持续的监管负担和商标管理负担发生概率最高。传导图显示，上游原因——营销、代工依赖、集中度——如何传导为品牌、责任和收入波动，最终影响投资人的估值和回报风险。
