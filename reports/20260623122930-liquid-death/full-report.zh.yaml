      - number: '8.4'
        title: 建议、退出与尽调要求
        blocks:
          - type: paragraph
            body: >-
              权衡投资假设、反向假设、可比公司和情景后，基于公开证据的克制建议是跟踪 /
              继续研究，而不是无条件买入：品牌质量和需求证明很强，但高估值和缺失的私有财务数据限制了确信度。考虑到集中度、可模仿性和资本密集度，信心为中等，风险评级为中等。退出层面，战略 M&A
              是最可信的近中期路径，因为收购方看重已建立的分销和文化品牌资产；IPO
              仍取决于消费品窗口是否开放、审计财务是否准备好；私有持有人还面临流动性时点和优先权悬垂风险。要把这一判断转成确信买入或回避，需要五项尽调材料：经审计财务、单位经济、股权结构和优先权栈、信贷额度契约、账户集中度数据。在取得这些材料前，任何决策都应由入场纪律以及价格与证据支持价值之间的安全边际主导，并全程监控明确的
              thesis-break 触发项。
