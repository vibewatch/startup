      - number: '1.3'
        title: 融资、估值与投资方
        blocks:
          - type: paragraph
            body: >-
              Liquid Death 的融资历程从 2021 年种子轮和 Series A 轮一路延伸到 2024 年 3 月的 Series E 轮；该轮融资约 $67M，公司估值 $1.4B。历轮股权融资累计估计约
              $267M，2024 年 12 月来自 Ares Management 的 $55M 信贷额度又补上一层非稀释资本。股东结构混合了 Science Inc.、Access
              Industries、Convivialite Ventures（Pernod Ricard 的风险投资部门）等机构投资方，以及战略支持方 Live Nation
              Entertainment；后者既是股权投资人，也是独家场馆水合作伙伴。一个鲜明特征是名人投资人 / 背书人阵容，包括 Tony Hawk、Travis Barker、Wiz Khalifa 和 Gary
              Vaynerchuk，他们持有股权，也放大品牌声量。由于 Liquid Death 是私营公司，精确股权结构、持股比例和治理权利均未披露，Series E 之前的轮次金额也大多未公开。
