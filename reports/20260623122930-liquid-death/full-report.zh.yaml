      - number: '1.6'
        title: 法律与不利事件
        blocks:
          - type: paragraph
            body: >-
              Liquid Death 的崛起伴随法律和声誉摩擦。公司曾与 PepsiCo 就一款 Mountain Dew
              口味相关的商标争议达成和解，消除了命名上的潜在冲突。另一个层面，品牌营销多次引发反弹：社交平台因暴力内容限制传播，评论者也质疑冲击式打法能否持续。公司还把法律主题和挑战式 campaign
              当作营销装置，模糊了真实争议与宣传噱头之间的界线。作为私营公司，Liquid Death
              不披露经审计财务、毛利率、盈利能力或单位经济，外部无法独立验证资本效率或增长耐久性。这些不利因素和披露缺口并不否定品牌的商业牵引力，但构成了核心尽调议程：确认股权结构、验证收入，并评估营销风险或法律敞口是否可能实质影响公司走向上市的轨迹。
