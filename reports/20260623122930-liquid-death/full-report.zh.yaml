          - type: callout
            title: 可验证的大收入规模与高端价格实现
            body: 公开估计和定价数据确认，Liquid Death 已经以显著高于估计商品成本的高端价格点做到约 $333M 收入；对一个成立不到十年的品牌来说，这是实质性很强的 top-line 信号。
            calloutType: strength
            claimRefs:
              - CI004
              - CI006
              - CI036
              - CI023
          - type: callout
            title: 利润率、烧钱和单位经济未披露
            body: 投资论点取决于毛利率、营销效率和现金消耗——私营公司没有披露其中任何一项。独立报道质疑利润率能否支撑估值，留下重要证据缺口。
            calloutType: risk
            claimRefs:
              - CI018
              - CI021
              - CI028
              - CI032
          - type: callout
            title: 债务加股权反映资本密集型实体模型
            body: 不同于软件，Liquid Death 必须为 133,000+ 个门店的库存投入资金，营运资本占用很重。$55M Ares 额度正是因为模型实体化、营运资本负担重，才与股权资本形成互补。
            calloutType: insight
            claimRefs:
              - CI011
              - CI015
              - CI016
              - CI031
          - type: callout
            title: 盈利能力取决于规模化后的营销杠杆
            body: 通向盈利的路径假设固定营销投入会随收入基数增长而形成杠杆。对已成规模的挑战者品牌来说，这一逻辑可信；但没有披露经营数据，在这里仍未证明。
            calloutType: assumption
            claimRefs:
