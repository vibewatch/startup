      - number: '1.2'
        title: 创始人、领导层与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Mike Cessario 是 Liquid Death 的创始人兼 CEO，至今仍是公司的核心创意与品牌声音。他的广告创意总监背景撑起了一个对饮料公司来说少见的营销驱动型 founder-market
              fit：产品本身是大宗商品，真正拉开差距的是品牌和内容引擎。Pat Cook 与公司早期团队和成型阶段营销有关。由于品牌身份与 Cessario
              的创意敏感度绑定极深，关键人物依赖集中在最高层，公司也没有公开披露厚实的高管梯队。创始人持续投入时，这种集中度是优势；任何接班场景里，它又会变成风险。随着公司向潜在上市推进，投资人会希望看到更宽的领导团队，证明即使不是创始人亲自推动每一次
              campaign 和创意决策，品牌也能延续。
