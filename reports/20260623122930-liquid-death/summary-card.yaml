summary:
  headline: >-
    Liquid Death's category-defining brand, 133,000+ door distribution, and rapid scaling to ~$333M revenue are real and
    well-evidenced, but a premium ~4x revenue valuation, thin disclosed economics, and concentration risk warrant TRACK
    / research-more with medium confidence.
