callouts:
- calloutType: strength
  title: Cultural Brand Plus Live-Event Channel Differentiate the Field
  body: Liquid Death leads the field on brand and cultural resonance and, uniquely, holds an exclusive live-event distribution channel that no rival can easily replicate, giving it an edge over both flavor-led challengers and scale-led incumbents.
  claimRefs:
  - CP009
  - CP018
  - CP028
  - CP029
- calloutType: risk
  title: Brand Moat Is Imitable and the Category Multi-Homes
  body: The brand-based moat is being actively copied by celebrity-backed and challenger entrants, switching costs are minimal, and buyers multi-home across brands, so share gains are reversible and require sustained marketing spend to defend.
  claimRefs:
  - CP010
  - CP017
  - CP027
  - CP032
- calloutType: insight
  title: Distribution Power Decides the Shelf War
  body: 'Across the field, distribution power rather than product formulation is the decisive variable: incumbents out-distribute via bottler networks while Liquid Death counters with cultural velocity and an exclusive live-event channel.'
  claimRefs:
  - CP011
  - CP026
  - CP036
  - CP021
- calloutType: assumption
  title: Commoditization and Private Label Cap the Premium
  body: Premium pricing holds only while brand demand outpaces imitation; private label and commoditization set a ceiling, so Liquid Death must keep converting cultural relevance into shelf velocity to defend its price position.
  claimRefs:
  - CP008
  - CP030
  - CP031
  - CP034
