- id: operational-risk
  title: Operational and Quality Risk
  body: Operational risk centers on the outsourced, physical nature of the business. Canned-beverage producers face recall exposure from contamination or packaging defects, and because Liquid Death relies on contract co-packers, quality control sits with third parties, raising both the likelihood and the brand impact of a quality event. Water sourcing must meet source-quality and treatment standards, a lower-likelihood but high-impact dependency. Aluminum can supply is a key input whose availability and price can constrain output, partially mitigable through dual-sourcing. Logistics and distribution disruption round out the cluster. None of these has produced a publicly recorded major incident, but the impact of a recall would be high, so the mitigation maturity — co-packer audits, dual-sourcing, and quality systems — is a central diligence question. The dependency map identifies aluminum and co-packers as the principal upstream single points of failure on which continuity rests.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR031
  - CR036
  tableRefs:
  - TR002
  figureRefs:
  - FR003
- id: partner-and-financial-risk
  title: Partner, Dependency, and Financial Risk
  body: Partner and financial risks stem from concentration. A large share of premium-water volume flows through a handful of major retail accounts, increasing revenue volatility and bargaining exposure, and the exclusive Live Nation venue deal concentrates an entire channel on one partner whose priorities could shift. The ongoing transition of the distributor network during rapid growth risks service gaps and channel disruption if not staged carefully. On the balance sheet, the Ares credit facility adds covenant and refinancing risk to an otherwise equity-funded company, and those covenant terms are undisclosed for a private borrower. More broadly, physical beverage businesses are capital-intensive with thin margins relative to software-style peers, and the absence of public SEC filings limits financial transparency until any future IPO. These are the dependencies whose failure would most directly transmit into investment impact, and they anchor the thesis-break triggers.
  claimRefs:
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR024
  - CR025
  - CR032
  - CR033
