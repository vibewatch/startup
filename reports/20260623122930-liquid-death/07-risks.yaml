callouts:
- calloutType: risk
  title: Regulatory and Reputational Exposure From Edgy Marketing
  body: 'Liquid Death''s provocative brand is its growth engine and its largest reputational risk: marketing that appeals to younger audiences invites FTC scrutiny, environmental claims must be substantiated under the Green Guides, and provocative content has been moderated by platforms before. None has produced enforcement, but the exposure is structural.'
  claimRefs:
  - CR001
  - CR002
  - CR005
  - CR030
- calloutType: risk
  title: Operational Recall Risk Sits With Third-Party Co-Packers
  body: Outsourced production concentrates quality control in contract co-packers, so a contamination or packaging defect could trigger a recall whose brand and liability impact would be high even if likelihood is moderate.
  claimRefs:
  - CR011
  - CR012
  - CR031
  - CR039
- calloutType: risk
  title: Partner and Account Concentration Are the Key Dependencies
  body: A large share of volume runs through a handful of retail accounts and the exclusive Live Nation channel, while a single Ares credit facility adds covenant risk. Loss of any one would be a thesis-break trigger.
  claimRefs:
  - CR015
  - CR016
  - CR032
  - CR038
- calloutType: recommendation
  title: Track Defined Kill Criteria in Diligence
  body: Monitor FTC/AG action on claims, recall and complaint rates, top-account revenue share, marketing efficiency, and covenant headroom. Any breach of the mapped thresholds should reopen the investment thesis. Obtain covenant terms and incident history directly from management.
  claimRefs:
  - CR037
  - CR038
  - CR040
  - CR041
