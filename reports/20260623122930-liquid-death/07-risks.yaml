- id: people-mitigations-and-kill-criteria
  title: People, Mitigations, and Kill Criteria
  body: 'Execution risk is concentrated in people and brand. The founder-CEO embodies the brand, creating key-person risk if leadership changed, and the novelty-driven marketing engine carries fatigue risk if campaigns lose impact; rapid scaling adds ordinary organizational strain. Against these, the mitigation framework is concrete and monitorable. Regulatory exposure is mitigated by substantiating claims and legal review; operational risk by dual-sourcing cans and co-packers and by quality audits; partner and concentration risk by diversifying accounts and broadening event channels; and capital risk by maintaining covenant headroom and an equity buffer. Each cluster maps to a monitoring indicator and a thesis-break trigger: adverse FTC action on claims, a material product recall, loss of a top-three account or the Live Nation deal, a sharp decline in marketing efficiency, or a covenant breach. Two items remain open diligence questions — undisclosed covenant terms and any private incident history — that should be resolved directly with management.'
