- id: scale-metrics-and-distribution
  title: Scale, Metrics, and Distribution
  body: 'Liquid Death has grown into a large-scale consumer beverage operation. The company reported approximately $333 million of revenue in 2024 and has guided toward roughly $340 million in 2025, and it distributes through more than 133,000 retail locations globally, including Whole Foods, Target, 7-Eleven, Costco and Amazon. The distribution arc is itself a milestone: the company expanded from a direct-to-consumer online launch with viral video marketing to full national retail within roughly three years. Live Nation''s exclusive venue agreement adds a concert and live-event channel that few beverage brands can match. Headcount is estimated at more than 300 employees, though the company does not publish a formal figure. The reported $1.4 billion valuation against about $333 million of 2024 revenue implies a revenue multiple of roughly four times, a premium that reflects brand strength and growth expectations rather than disclosed profitability, since gross margin and net income remain private.'
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
