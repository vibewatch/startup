company:
  name: Liquid Death
chapter:
  number: 1
  title: Company Overview
  summary: Liquid Death is a Los Angeles-based canned-water and beverage brand founded in 2019 by CEO Mike Cessario, selling still and sparkling water, iced tea, and flavored sparkling water in 16oz aluminum cans under a heavy-metal 'Murder Your Thirst' brand. The company reached a $1.4B valuation in a March 2024 Series E, reported $333M of 2024 revenue, raised roughly $267M of equity plus a $55M Ares credit facility, and distributes across 133,000+ retail locations with Live Nation as both investor and exclusive venue partner.
sections:
- id: identity-and-business-model
  title: Identity and Business Model
  body: Liquid Death is a Los Angeles-based American beverage company founded in 2019 by Mike Cessario, a former advertising creative director who built the company around a deliberately absurd heavy-metal and death-metal aesthetic. The brand sells still and sparkling water, sparkling flavored waters, iced teas and lemonade, all packaged in 16-ounce aluminum tallboy cans marketed as infinitely recyclable. Its core positioning is captured by the tagline 'Murder Your Thirst', and its sustainability narrative is framed as a mission to 'murder plastic pollution' by replacing single-use plastic bottles with aluminum. The flagship lineup includes DEAD WATER still and sparkling water, Severed Lime sparkling water, Mango Chainsaw, and the Armless Palmer half-iced-tea, half-lemonade. Original water products are positioned with zero calories and zero sweeteners, letting Liquid Death straddle a health proposition and a punk-entertainment brand simultaneously.
  claimRefs:
  - CO001
  - CO003
  - CO004
  - CO005
  - CO006
