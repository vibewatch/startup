- id: founders-leadership-and-key-person-risk
  title: Founders, Leadership, and Key-Person Risk
  body: 'Mike Cessario is the founder and chief executive of Liquid Death and remains the central creative and brand voice of the company. His background in advertising creative direction underpins a founder-market fit that is unusually marketing-led for a beverage business: the product is a commodity, but the brand and content engine are the differentiators. Pat Cook is associated with the company''s early team and formative marketing period. Because the brand identity is so tightly tied to Cessario''s creative sensibility, key-person dependency is concentrated at the top, and the company does not publicly disclose a deep executive bench. This concentration is a strength while the founder is engaged and a risk in any succession scenario. As the company scales toward a possible public listing, investors will want evidence of a broader leadership team capable of sustaining the brand without the founder driving every campaign and creative decision.'
  claimRefs:
  - CO002
  - CO030
  - CO031
  tableRefs:
  - TO002
- id: funding-valuation-and-investors
  title: Funding, Valuation, and Investors
  body: Liquid Death's financing history runs from seed and Series A rounds in 2021 through a March 2024 Series E that raised approximately $67 million and valued the company at $1.4 billion. Cumulative equity raised is estimated at roughly $267 million across the round sequence, supplemented by a $55 million credit facility from Ares Management in December 2024 that added non-dilutive capital. The cap table blends institutional investors such as Science Inc., Access Industries and Convivialite Ventures (the venture arm of Pernod Ricard) with the strategic backer Live Nation Entertainment, which is both an equity investor and the exclusive venue water partner. A distinctive feature is the roster of celebrity investor-endorsers, including Tony Hawk, Travis Barker, Wiz Khalifa and Gary Vaynerchuk, who amplify the brand while holding equity. Because Liquid Death is private, the precise cap table, ownership percentages and governance rights are not disclosed, and round amounts before the Series E are largely undisclosed.
  claimRefs:
  - CO007
  - CO008
  - CO009
