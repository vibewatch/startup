callouts:
- calloutType: strength
  title: Simple, Focused Architecture Built for Fast Scaling
  body: 'Liquid Death runs an operationally simple platform: a tight SKU set on a single aluminum can format, produced through contract co-packers. This lean architecture, paired with a strong brand and packaging layer, lets the company scale quickly without owning manufacturing.'
  claimRefs:
  - CE025
  - CE026
  - CE034
  - CE003
- calloutType: risk
  title: Differentiation Is Imitable and Recyclability Claims Are Scrutinized
  body: Because differentiation is brand and packaging rather than proprietary technology, it is imitable, and the gap between the infinitely-recyclable claim and real-world recycling rates exposes the brand to environmental criticism and rising labeling scrutiny.
  claimRefs:
  - CE012
  - CE013
  - CE023
  - CE032
- calloutType: insight
  title: The Real Technology Is Supply Chain and Distribution
  body: For a canned-water brand, the operational moat lives in supply-chain resilience and distribution capability — multi-sourced co-packing, aluminum supply, and the unique ability to service live-event venues at scale alongside 133,000+ retail doors.
  claimRefs:
  - CE014
  - CE015
  - CE021
  - CE033
- calloutType: assumption
  title: Aluminum Format Plus Mission Are the Most Durable Features
  body: The aluminum tallboy format and the plastic-pollution mission together form the most defensible product features, assuming the brand can keep recyclability messaging credible as regulators scrutinize environmental claims.
  claimRefs:
  - CE022
  - CE020
  - CE031
  - CE036
