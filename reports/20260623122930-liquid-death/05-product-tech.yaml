- id: roadmap-and-maturity-outlook
  title: Roadmap and Maturity Outlook
  body: 'Liquid Death''s forward roadmap is built on extension rather than reinvention. The most visible motion is a continuous cadence of seasonal and limited-edition flavors that refresh the lineup and generate novelty, supported by periodic new sparkling SKUs and the ongoing scaling of the iced tea and lemonade adjacency. Beyond product, the roadmap includes selective international expansion, a growing merchandise and brand-extension business, and exploratory packaging-format extensions to reach new occasions. Maturity is uneven by design: the core water line is fully mature and operates as the portfolio anchor, while flavored sparkling and RTD adjacencies are still scaling and carry more execution and competitive risk. Crucially, the roadmap relies on flavor and format expansion rather than core technology change, which keeps execution risk operational rather than technical. The principal limitation is visibility: public evidence reveals launch patterns but not an internal roadmap, so the durability of growth beyond the current lineup remains a diligence question.'
  claimRefs:
  - CE017
  - CE029
  - CE030
  - CE034
