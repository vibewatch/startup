      - number: '6.3'
        title: Named Customer Proof & Enterprise Production Deployments
        blocks:
          - type: paragraph
            body: >
              Verifiable commercial proof for Liquid AI is anchored by marquee lighthouse enterprise partnerships where
              real-time latency and local processing are mission-critical requirements. Under its multi-year commercial
              licensing agreement announced in 2025, Shopify deployed a custom Liquid AI model into its production
              search architecture, achieving catalog query completion in under 20 milliseconds. In automotive mobility,
              Liquid AI reported an edge deployment collaboration with Mercedes-Benz focused on in-cabin voice
              interaction and low-latency vehicle edge processing. Additional commercial relationships include sovereign
              AI infrastructure developer G42 and smart-glasses pioneer Brilliant Labs. Liquid AI has also participated
              in collaborative biomedical research, co-authoring the LongevityBench benchmark with Insilico Medicine
              researchers to evaluate frontier models across biological aging datasets. However, enterprise engagements
              remain characterized by bespoke engineering and collaborative pilot evaluations, leaving the exact
              production scale, annual contract values, and expansion scope undisclosed across the partner portfolio.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU013
              - CU014
              - CU015
          - type: table
