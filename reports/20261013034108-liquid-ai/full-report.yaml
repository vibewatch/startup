              - CO013
      - number: '1.3'
        title: Capitalization History and Investor Syndicate
        blocks:
          - type: paragraph
            body: >-
              Liquid AI formally emerged from stealth operations in December 2023, announcing an initial seed capital
              raise of $46.6 million. The financing round was co-led by OSS Capital, an open-source enterprise fund, and
              PagsGroup, the family office of Boston Celtics co-owner and Bain Capital veteran Stephen Pagliuca.
              Secondary enterprise technology reporting from outlets such as SiliconANGLE concurrently reported the seed
              total as $37.6 million, reflecting potential differences in closing tranches, convertible notes, or equity
              structures. The seed syndicate featured participation from leading venture firms and corporate entities
              including Breyer Capital, Samsung Next, Bold Capital Partners, and ISAI Cap Venture (Capgemini's corporate
              investment vehicle), alongside prominent angel investors such as Naval Ravikant, Tobias Lütke, and Tom
              Preston-Werner. Subsequent market commentary has circulated unverified private valuation figures reaching
              $2.3 billion in 2026, yet no verified Series A or growth-stage equity filings have been made available
              publicly. Furthermore, Liquid AI discloses no secondary share transactions, venture debt facilities, or
              formal cap table allocations, obscuring ownership dilution and institutional control rights.
