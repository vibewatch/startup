  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Adjacencies, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Liquid AI's relevant market is not all generative-AI spending. The supported boundary is model software
              and deployment tooling for workloads that benefit from local, edge, on-premises, or hybrid execution.
              TechCrunch reported that the original commercialization plan included private and on-premises
              infrastructure, while Liquid's current documentation exposes local and edge formats. Candidate workloads
              include mobile and consumer devices, robotics, drones, automotive systems, sequential industrial or
              scientific data, and private enterprise applications. Hardware revenue, general cloud-compute spend,
              frontier-model training, and unrelated vertical software should be excluded unless Liquid captures them
              contractually. Status-quo substitutes include cloud APIs, existing compact models, internal model
              optimization, and specialist on-device vendors such as Cactus; this makes the opportunity a contest for
              deployable workload share rather than a claim on total AI spend.
            claimRefs:
