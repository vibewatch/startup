      - number: '4.2'
        title: Edge Inference Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              The core unit economic proposition of Liquid Foundation Models relies on shifting runtime compute from
              centralized cloud data centers to on-device silicon. Standard cloud-hosted language models incur ongoing,
              volume-sensitive inference costs that introduce volatility into enterprise operating expenses and create
              margin pressure for software vendors. Liquid AI targets client hardware such as mobile SoCs, laptop
              processors, and automotive computers where local inference operates without per-query cloud infrastructure
              fees. By co-designing hybrid neural architectures alongside hardware partners like AMD and Qualcomm, the
              company aims to eliminate cloud networking latency and ongoing token metering. For enterprise adopters,
              this operational architecture offers predictable cost containment and enhanced privacy. For Liquid AI,
              delivering an edge software runtime avoids the massive capital expenditures associated with hosting
              centralized frontier model clusters.
            claimRefs:
              - CI001
              - CI008
              - CI010
              - CI014
          - type: figure
            figureRef: FI001
            claimRefs:
