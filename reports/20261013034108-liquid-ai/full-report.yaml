  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Risk
      - What Would Change the View
    rows:
      - - Architecture & Efficiency
        - Proprietary LFM/LFM2 hybrid models deliver up to 2x faster CPU prefill/decode with subquadratic memory scaling
        - >-
          Open-source transformer compression, sub-2-bit quantization, and small models (Llama, Gemma) close the
          efficiency gap
        - Independent third-party production benchmarks demonstrating sustained edge cost advantage
      - - Commercial Traction
        - Strategic backing from AMD and high-profile partnerships validate enterprise interest
        - Absence of public production revenue, retention rates, or ARR metrics suggests early pilot stage
        - Audited disclosure of multi-million dollar annual recurring revenue contracts and net revenue retention >110%
      - - Edge AI Market
        - Rapid growth in on-device AI across automotive, robotics, and mobile devices demands low-power local inference
        - >-
          Specialized device alternatives like Cactus Compute and mobile SDK providers capture device developer
          workflows
        - Verified OEM device shipments running production LFM runtimes at commercial scale
      - - Capital & Governance
        - Substantial $296.6M capital cushion provides runway through ongoing architectural R&D
        - Heavy R&D burn rate and top-tier talent acquisition create down-round exposure if market multiples compress
        - Demonstrated path to cash flow breakeven or non-dilutive strategic licensing revenue
    notes: >-
      Thesis points grounded in MIT CSAIL technical reports, AMD-led Series A syndicate, and public market comparability
      data.
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV012
      - CV014
  - id: TV003
    title: Bull, Base, and Bear Scenarios
    columns:
      - Scenario
      - Core Operating Assumptions
      - Valuation / Return Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          LFMs become the standard edge AI control layer; enterprise OEM contracts scale ARR to $60M+; AMD silicon
          co-optimization accelerates adoption
        - >-
          $5.0B-$7.0B exit valuation (2.2x-3.1x MOIC) at 20x-30x ARR multiple comparable to high-growth infrastructure
          IPOs
        - Hyperscaler lock-in and commoditization of small open models
        - 20% (Low — contingent on rapid enterprise software revenue conversion)
      - - Base Case
        - >-
          Niche adoption in automotive and industrial robotics; ARR reaches $25M-$35M by 2027; moderate hardware
          partnership traction
        - >-
          $2.0B-$2.5B valuation (0.9x-1.1x MOIC) reflecting multiple compression to 15x-20x P/ARR, roughly flat with
          Series A post-money
        - Valuation stagnation, employee option dilution, extended pilot-to-production cycles
        - 55% (Moderate — aligned with current enterprise pilot disclosure pacing)
      - - Bear Case
        - >-
          LFMs remain research prototypes; transformer alternatives and edge runtimes dominate; revenue stalls below
          $15M
        - $500M-$1.0B down-round or acqui-hire fire sale (0.2x-0.4x capital return on Series A)
        - Cash burn outpaces commercialization; inability to raise Series B at step-up valuation
        - 25% (Elevated — consistent with high mortality in pre-revenue foundation model startups)
    notes: >-
      Scenarios model 3-to-5 year hold periods from the December 2024 Series A valuation baseline ($2.28B post-money,
      $250M round led by AMD).
    claimRefs:
      - CV002
      - CV006
      - CV010
      - CV011
      - CV013
