      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Liquid AI's balance sheet reflects substantial venture backing, anchored by an AMD-led Series A financing
              of approximately $250 million closed in late 2024 at a $2.3 billion post-money valuation, following an
              initial $37.6 million seed round. Additional strategic backing from semiconductor leaders including Texas
