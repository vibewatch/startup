      - number: '4.3'
        title: Unit Economics and Private Metric Gaps
        blocks:
          - type: paragraph
            body: >-
              From an institutional diligence standpoint, Liquid AI's commercial traction is characterized by
              substantial private information gaps. The company has released zero public metrics regarding annual
              recurring revenue, revenue run-rate, gross margin percentages, customer account counts, or net revenue
              retention. While developer downloads and technical benchmarks demonstrate community interest, technical
              observers on public forums have questioned whether proprietary liquid networks provide decisive commercial
              differentiation over rapidly improving open transformer alternatives. Furthermore, competing on-device AI
              vendors emphasize that Liquid AI functions primarily as a foundational model provider rather than a
              turnkey mobile application SDK. In the absence of audited financial statements, prospective investors
              cannot determine whether current partner engagements represent multi-year software contracts, pilot
              evaluations, or subsidized research collaborations.
            claimRefs:
