      - number: '3.3'
        title: Commercial Packaging, Licensing, and Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Commercialization in the foundation model sector is structured around distinct licensing mechanisms and
              deployment models. Frontier cloud providers such as OpenAI and Anthropic monetize through variable
              per-token API pricing and seat-based enterprise subscriptions, creating ongoing operational expenditure
              and platform lock-in around proprietary cloud infrastructure. In contrast, Liquid AI employs a dual
              open-and-commercial licensing structure that allows developers and commercial entities to download,
              execute, and fine-tune models free of charge until reaching $10 million in annual customer revenue. This
              pricing posture reduces adoption friction for resource-constrained startups while aiming to capture value
              as enterprise deployments scale into production volume. To lower switching costs and counter the lock-in
              of hyperscaler ecosystems, Liquid AI supports open-source inference engines including llama.cpp, vLLM,
              SGLang, and MLX, providing standardized export formats in GGUF, MLX, and ONNX. Furthermore, direct silicon
              optimization with AMD, Qualcomm, Apple, and Nvidia ensures that enterprise buyers can multi-home models
              across heterogeneous edge and on-premises server fleets without relying on single-vendor hardware lock-in.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat Durability, Displacement Risks, and Adverse Technical Evidence
        blocks:
          - type: paragraph
            body: >-
              Despite promising benchmark figures, Liquid AI faces substantial competitive headwinds and architectural
              risks regarding moat durability. Historical research on liquid neural networks originated in biological
              modeling of nematode nervous systems for robotics and continuous sensory control, leading machine learning
              researchers and developer communities to question whether the architecture transfers smoothly to discrete
              symbolic language generation. Community critics have highlighted that early promotional claims comparing
              compact 20-neuron drone-steering controllers against 175-billion-parameter language models constituted an
              asymmetric comparison that glossed over language modeling complexities. Moreover, open-weights incumbents
              like Meta command enormous community ecosystems, extensive compiler optimizations, and massive GPU
              training clusters that can rapidly erode architectural latency leads through advanced pruning and
              distillation. In the ultra-constrained embedded domain, micro-model competitors like Cactus Compute
              deliver sub-30MB binaries using sub-2-bit quantization, demonstrating that alternative compression
              techniques can achieve edge execution without adopting novel dynamical network formulations. As
              standardized transformer runtimes continue optimizing on-device inference, Liquid AI must prove sustained
              superior accuracy on complex enterprise tasks to defend its proprietary architectural premium.
            claimRefs:
              - CP005
              - CP006
              - CP009
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commoditization Pressure from Open-Weights Incumbents
            body: >-
              While Liquid AI achieves impressive CPU throughput and subquadratic memory scaling, hyperscaler-backed
              open-weights models like Meta Llama and Alibaba Qwen benefit from massive ecosystem developer inertia and
              extensive tooling optimization, creating ongoing pressure on proprietary architecture adoption.
            calloutType: risk
            claimRefs:
              - CP001
              - CP006
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Liquid AI pursues a hybrid commercialization strategy combining open model distribution with proprietary
              enterprise software licensing and strategic hardware co-development. The foundation model provider
              releases its base LFM weights under permissive open licenses across multi-platform formats including GGUF,
              MLX, and ONNX, driving broad developer awareness and initial ecosystem adoption. Commercial revenue
