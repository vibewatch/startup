  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Enterprise Workflows
        blocks:
          - type: paragraph
            body: >-
              Liquid AI packages its proprietary model architecture as a dual offering: generative Liquid Foundation
              Models (LFMs) designed for multi-modal edge execution and specialized decision models designed to replace
              generative chat LLMs in structured operational tasks. In standard customer workflows such as content
              moderation, video clipping, document classification, and customer support routing, conventional large
              language models introduce substantial overhead by generating verbose token streams that require downstream
              regex parsing. Liquid AI's newly released d1-3B decision model addresses this structural inefficiency by
              accepting inputs up to 32,768 tokens across text, JSON, and images, and evaluating classification
              questions in a single forward pass without generating output tokens. Standard models across the LFM family
              support 32K context windows, extending up to 128K tokens on specialized configurations such as
              LFM2.5-8B-A1B, enabling local edge devices to process complex documents without cloud offloading.
            claimRefs:
              - CE001
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE005
      - number: '5.2'
        title: Model Portfolio, SKU Architecture, and Maturity
        blocks:
          - type: paragraph
            body: >-
              The company's commercial and open-weight portfolio spans several distinct architectural generations.
              Liquid AI launched its initial foundation model lineup with dense checkpoints at 1.3 billion (LFM-1B) and
              3.1 billion (LFM-3B) parameters alongside a 40.3-billion parameter Mixture of Experts (MoE) configuration
              designed for server deployments. In late 2025 and 2026, the company broadened this family into the LFM2
              series, incorporating task-specialized checkpoints, vision-language variants (LFM2-VL), and
              late-interaction retrieval modules (LFM2-ColBERT). In October 2026, Liquid AI expanded into
              decision-focused systems by releasing d1-3B (a 3.12-billion parameter model based on LFM2.5-VL-3B) and
              d1-omni-600M (an experimental multimodal audio-text encoder). To monetize this technology while
              encouraging developer adoption, Liquid AI applies the LFM Open License v1.0, which permits free evaluation
              and deployment up to a strict $10 million annual revenue threshold, above which commercial licensing is
              required. However, independent testing indicates significant performance gaps between hardware
              environments: while vendor benchmarks claim 8-millisecond inference on RTX 4090 GPUs, CPU sandbox
              execution takes between 4.6 and 7.8 seconds per request.
            claimRefs:
              - CE002
              - CE006
              - CE009
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE006
              - CE009
              - CE010
      - number: '5.3'
        title: Architectural Foundations and Operating Stack
        blocks:
          - type: paragraph
            body: >-
              Liquid AI's technical differentiation stems from mathematical formulations originally developed at MIT
              CSAIL. Unlike conventional transformer models that rely entirely on quadratic self-attention mechanisms,
              Liquid AI's LFM2 architecture is built on a minimal hybrid design dominated by gated short convolution
              blocks paired with a restricted number of grouped-query attention (GQA) layers. During architecture
              search, Liquid AI evaluated configurations directly on target consumer hardware, including Qualcomm
              Snapdragon SoCs and AMD Ryzen laptop processors. This hardware-in-the-loop search demonstrated that gated
              short convolutions achieved superior quality-latency-memory Pareto trade-offs compared to more complex
              state-space models or pure linear-attention variants. Pre-training incorporates 10 to 12 trillion tokens
              followed by a 32K-token mid-training phase, using decoupled Top-K knowledge distillation to stabilize
              student learning when teacher models expose only partial logits. Post-training relies on supervised
              fine-tuning (SFT), length-normalized preference alignment, and model merging to ensure rigorous adherence
              to structured JSON schemas and tool-use templates.
            claimRefs:
              - CE003
              - CE007
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE007
              - CE008
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE003
              - CE007
              - CE012
      - number: '5.4'
        title: Deployment Footprint, IP Differentiation, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              For enterprise deployment, Liquid AI supports open-source runtimes including GGUF for llama.cpp and
              Ollama, MLX for Apple Silicon unified memory, and ONNX Runtime for embedded edge hardware, alongside its
              proprietary LEAP fine-tuning and deployment framework. Despite these engineering milestones, Liquid AI
              faces technical and market risks. In developer communities such as Reddit r/singularity, practitioners
              have expressed skepticism regarding whether liquid neural networks offer decisive real-world advantages
              over heavily optimized transformer alternatives, citing historical delays in delivering production
              weights. Furthermore, specialized competitors such as Cactus Compute are targeting the extreme edge by
              compressing automation foundation models below 2 bits per weight to fit microcontroller and wearable
              memory footprints. Finally, Liquid AI's headline benchmarks, including a Decision Index 0.2.1 score of
              48.57 for d1-3B, currently represent vendor-scored results that have not been submitted to public
              leaderboards or validated by independent third parties.
            claimRefs:
              - CE008
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Hardware-in-the-Loop Pareto Efficiency vs. Brute Scale
            body: >-
              Liquid AI's decision to favor gated short convolutions and grouped-query attention over complex
              linear-attention or pure SSM hybrids was driven by empirical Pareto measurements on physical Snapdragon
              and Ryzen silicon. Under real-world thermal ceilings and memory bandwidth constraints, this pragmatic
              design delivers superior decode throughput compared to academic architectures that look appealing on
              paper.
            calloutType: insight
            claimRefs:
              - CE003
              - CE007
          - type: callout
            title: Commercial Licensing Moat and Benchmark Replicability
            body: >-
              The introduction of the LFM Open License v1.0 with a strict $10 million commercial revenue ceiling
              protects Liquid AI from unmonetized hyperscaler exploitation, but creates friction for fast enterprise
              adoption. Furthermore, headline benchmark achievements like the Decision Index score of 48.57 currently
              rest on vendor-scored evaluations that await independent community reproduction.
            calloutType: risk
            claimRefs:
              - CE006
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Target Buyers
        blocks:
          - type: paragraph
            body: >
              Liquid AI targets commercial buyers who require edge-native inference to circumvent the latency, cloud
              compute cost, and data governance overhead of conventional cloud-hosted large language models. The company
              pursues a dual-track commercial model: it seeds an expansive developer ecosystem with open-weight releases
              while monetizing enterprise custom engineering, OEM device licensing, and production runtime integration.
              Target enterprise buyers segment into high-throughput e-commerce infrastructure operators, automotive
              original equipment manufacturers (OEMs), wearable device hardware makers, and sovereign computing
              providers. Reported lighthouse commercial engagements include a multi-year licensing agreement with
              Shopify for on-device product catalog search, alongside strategic design initiatives with Mercedes-Benz,
              G42, and smart-glasses developer Brilliant Labs. Concurrently, Liquid AI offers its LEAP platform to
              mobile application developers, enabling on-device model deployment in approximately ten lines of code.
              While developer mindshare is supported by 42.2 million reported model downloads across Hugging Face and
              partner registries, commercial revenue remains heavily concentrated among early custom design partners
              rather than standardized self-serve tiers.
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU008
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
