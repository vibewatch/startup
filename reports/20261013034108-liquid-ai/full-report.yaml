  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Alternative Architecture Landscape and Competitor Taxonomy
        blocks:
          - type: paragraph
            body: >-
              Liquid AI operates in a rapidly fragmenting foundation model market characterized by two divergent
              architectural paradigms: cloud-scale transformer foundation models and compact edge-oriented models. While
              hyperscalers like OpenAI, Google, and Anthropic continue scaling dense and mixture-of-experts transformer
              architectures to hundreds of billions of parameters hosted in power-dense datacenters, enterprise demand
              for local inference, predictable latency, and data privacy has spurred intense competition among small
              language models. Liquid AI challenges traditional fixed-parameter transformers through liquid foundation
              models grounded in continuous-time dynamical systems and numerical linear algebra. Across this landscape,
              direct peers include open-weights small transformer incumbents such as Meta's Llama 3.2 family,
              Microsoft's synthetic-data-trained Phi-3.5 series, and Alibaba's Qwen3 models. Concurrently, specialized
              embedded alternatives such as Cactus Compute focus on aggressive sub-2-bit quantization and ultra-compact
              binaries for microcontrollers, creating a multi-front competitive environment spanning datacenter, mobile
              SoC, and embedded microcontroller hardware tiers.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP009
      - number: '3.2'
        title: Architectural Differentiation and Technical Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Liquid AI's primary technical differentiation centers on its non-standard model architecture, which
              addresses the quadratic computational and memory scaling bottlenecks inherent to softmax self-attention.
              While conventional transformers experience explosive key-value cache memory growth when processing long
              sequences, Liquid AI's LFM and LFM2 architectures leverage subquadratic sequence modeling, maintaining
              recurrent associative memory representations and gated short convolution blocks. On standard evaluations,
              early checkpoints demonstrated that LFM-1B outperformed transformer baselines on MMLU and ARC-C, while
              LFM-3B delivered competitive performance against Meta Llama and Microsoft Phi-3.5 without equivalent
              memory footprints. With the release of LFM2, hardware-in-the-loop architecture search on client silicon
              revealed that minimal hybrids dominated by gated short convolutions consistently beat linear attention and
              state space models in quality-latency Pareto profiles on commodity CPUs. This architectural design enables
              dense models spanning 230M to 1.2B parameters to achieve roughly 2x higher prefill and decode throughput
              than similarly sized Qwen3 and Gemma 3 models on target consumer processors.
            claimRefs:
              - CP001
              - CP004
              - CP008
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP008
              - CP009
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
