    title: 'Competitive Positioning Map: Edge Footprint vs. Capability Breadth'
    type: quadrant
    summary: >-
      Ordinal comparison of foundation model alternatives across on-device operational efficiency and general language
      capability breadth.
    xAxisLabel: Edge Operational Efficiency (Low Memory & Compute Overhead)
    yAxisLabel: General Language Capability and Reasoning Breadth
    data:
