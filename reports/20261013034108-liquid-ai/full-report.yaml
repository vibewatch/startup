              - CU004
              - CU005
              - CU006
              - CU008
      - number: '6.2'
        title: Adoption Trajectory & Developer Ecosystem
        blocks:
          - type: paragraph
            body: >
              Adoption of Liquid Foundation Models has expanded primarily through open-weight community distribution and
              hosted playground evaluations. As of August 2026, the company reported 42.2 million cumulative model
              downloads, 56 shipped foundation model architectures, and over 3,300 fine-tuned variants. To facilitate
              developer experimentation, Liquid AI seeded initial model access through the Liquid Playground, Lambda
              Chat and APIs, and Perplexity Labs. The introduction of LFM2 and LFM2.5 hybrid architectures established
              hardware-optimized checkpoints spanning 350M to 2.6B parameters, engineered specifically for Snapdragon
              mobile chipsets and Ryzen laptop processors. The foundation models support 32K token context windows and
              provide native runtime export to GGUF, Apple Silicon MLX, and cross-platform ONNX runtimes. The company
              also released Liquid Apollo, an on-device conversational demonstration application that executes entirely
              locally without internet connectivity. Nonetheless, technical community practitioners on developer forums
              continue to question whether broad download volume has translated into measurable production usage outside
              of Liquid AI's proprietary promotional demonstrations.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU007
              - CU008
              - CU009
