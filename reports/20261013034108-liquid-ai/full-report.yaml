        - label: Liquid AI (LFM2)
          x: 8.5
          'y': 7.2
          description: Balanced hybrid subquadratic architecture optimized for CPU and edge SoCs
        - label: Meta Llama 3.2 (1B/3B)
          x: 5.5
          'y': 7.5
          description: Standard transformer SLM with strong quality but high KV cache memory overhead
        - label: Microsoft Phi-3.5
          x: 5
          'y': 7.8
          description: High reasoning small model constrained by quadratic attention scaling
        - label: Cactus Needle
          x: 9.5
          'y': 4
          description: Ultra-compact sub-2-bit binaries optimized strictly for microcontroller tool calls
        - label: OpenAI GPT-4o / Cloud Frontier
