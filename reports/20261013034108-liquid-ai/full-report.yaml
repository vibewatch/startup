      - number: '1.4'
        title: Technical Milestones, Architecture Evolution, and Market Reception
        blocks:
          - type: paragraph
            body: >-
              Liquid AI's technical roadmap reflects an aggressive transition from academic proof-of-concept to
              production model deployments. In September 2024, the company introduced its first-generation foundation
              models (LFM-1B, LFM-3B, and LFM-40B mixture-of-experts), demonstrating competitive benchmark performance
              against traditional small language models such as Microsoft's Phi-3.5 and Meta's Llama family. The company
              subsequently introduced its second-generation LFM2 family in July 2025, culminating in a comprehensive
              51-page technical blueprint in December 2025 detailing hybrid architectures that combine gated short
              convolutions with grouped-query attention. By late 2026, Liquid AI expanded its documentation catalog to
              LFM2.5 models spanning 230M to 8B parameters, multimodal vision-language processors, and specialized
              decision models. However, this progression encountered meaningful developer skepticism during early
              announcements, with community observers on platforms such as Reddit questioning the opacity of claimed
              real-time adaptation mechanisms. Concurrently, competitive edge intelligence providers such as Cactus
              Compute highlight operational tradeoffs, noting that while Liquid AI produces highly capable model
              weights, it functions primarily as a model provider without native mobile application SDKs. Liquid AI
              continues to broaden domain-specific validation through collaborative research, including the September
              2026 LongevityBench biological AI benchmark with Insilico Medicine.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
