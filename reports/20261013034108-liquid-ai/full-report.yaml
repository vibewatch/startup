      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The evidence points to several buyer contexts but does not disclose Liquid's actual procurement owners or
              budget lines. Automotive, mobile-device, robotics, and industrial product teams are plausible buyers
              because model performance must be validated against device memory, latency, thermal, and connectivity
              limits. CIO, CISO, and enterprise platform teams are plausible sponsors for private or on-premises
              deployments where data movement and service resilience matter. Developers and machine-learning engineers
              are users across both paths, but downloads or format availability are not proof of paid adoption. The
              likely adoption sequence is technical evaluation, hardware profiling, workload-specific testing, security
              review, integration, and then a production contract. Management evidence must confirm who signs, which
              budget pays, the duration of qualification, and whether revenue is a license, platform fee, usage charge,
              services engagement, or embedded royalty.
