chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Origins, and Mission
        blocks:
          - type: paragraph
            body: >-
              Liquid AI represents an enterprise and on-device artificial intelligence company established in 2023 as a
              direct commercial spinout from the Massachusetts Institute of Technology's Computer Science and Artificial
              Intelligence Laboratory (MIT CSAIL). Headquartered in Cambridge, Massachusetts, the company was created to
              commercialize non-transformer neural architectures originally developed over a decade of academic
              investigation into continuous-time and dynamical systems. Unlike conventional generative artificial
              intelligence infrastructure built almost exclusively around Transformer backbones, Liquid AI designs
              Liquid Foundation Models (LFMs) optimized for execution efficiency, latency determinism, and
              hardware-constrained environments ranging from edge microcontrollers and mobile processors to hybrid
              on-premises enterprise servers. While the company has released extensive open technical weights and model
              catalogs across multiple runtime environments including llama.cpp, MLX, ONNX, and vLLM alongside its
              proprietary LEAP deployment stack, Liquid AI maintains complete confidentiality regarding commercial
              traction. As of October 2026, the company provides zero audited revenue run-rate disclosures, customer
              counts, or unit economic metrics, creating a pronounced contrast between its scientific pedigree and
              unverified commercial scale.
            claimRefs:
              - CO001
              - CO002
              - CO011
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
      - number: '1.2'
        title: Founding Team, Leadership, and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              The founding leadership of Liquid AI unites premier computational neuroscience and robotics researchers
              from MIT CSAIL. Chief Executive Officer Ramin Hasani and Chief Technology Officer Mathias Lechner lead
              executive operations and systems architecture, having pioneered the mathematical foundations of liquid
              time-constant neural networks during their doctoral and postdoctoral tenures at MIT. They are joined by
              co-founders Alexander Amini, who serves as Chief Science Officer leading model dynamics and safety, and
              Daniela Rus, Director of MIT CSAIL and an internationally renowned roboticist who acts as senior
              scientific advisor. This founding quartet provides exceptional theoretical depth and academic credibility,
              but also creates significant key-person dependencies, as core algorithmic innovations remain tightly
              coupled to the original research group. Beyond the founding researchers, Liquid AI has expanded
              engineering teams around hardware-in-the-loop compilation, yet public disclosure concerning formal
              corporate governance remains minimal. The company has not published the composition of its fiduciary Board
              of Directors, independent board oversight, or specific voting agreements between the founders and
              institutional seed investors, representing an essential diligence inquiry for prospective capital
              partners.
            claimRefs:
              - CO001
              - CO013
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
