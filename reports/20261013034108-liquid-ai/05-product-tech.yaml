callouts:
  - calloutType: "insight"
    title: "Hardware-in-the-Loop Pareto Efficiency vs. Brute Scale"
    body: "Liquid AI's decision to favor gated short convolutions and grouped-query attention over complex linear-attention or pure SSM hybrids was driven by empirical Pareto measurements on physical Snapdragon and Ryzen silicon. Under real-world thermal ceilings and memory bandwidth constraints, this pragmatic design delivers superior decode throughput compared to academic architectures that look appealing on paper."
    claimRefs:
      - "CE003"
      - "CE007"
  - calloutType: "risk"
    title: "Commercial Licensing Moat and Benchmark Replicability"
    body: "The introduction of the LFM Open License v1.0 with a strict $10 million commercial revenue ceiling protects Liquid AI from unmonetized hyperscaler exploitation, but creates friction for fast enterprise adoption. Furthermore, headline benchmark achievements like the Decision Index score of 48.57 currently rest on vendor-scored evaluations that await independent community reproduction."
    claimRefs:
      - "CE006"
      - "CE014"
