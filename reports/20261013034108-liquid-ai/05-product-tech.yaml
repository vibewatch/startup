company:
  name: "Liquid AI"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Liquid AI delivers non-transformer Liquid Foundation Models (LFMs), including hybrid convolution-attention LFM2 architectures, on-device decision models (d1-3B), and the LEAP deployment stack, aiming to achieve subquadratic efficiency and real-time execution across edge and enterprise environments. While benchmark results and hardware-in-the-loop optimizations demonstrate substantial latency and memory advantages on consumer CPUs and edge SoCs, commercial adoption faces licensing thresholds, unverified independent benchmarks, and practitioner skepticism regarding novel non-transformer paradigms."
sections:
  - id: "product-definition-and-use-cases"
    title: "Product Definition and Enterprise Workflows"
    body: "Liquid AI packages its proprietary model architecture as a dual offering: generative Liquid Foundation Models (LFMs) designed for multi-modal edge execution and specialized decision models designed to replace generative chat LLMs in structured operational tasks. In standard customer workflows such as content moderation, video clipping, document classification, and customer support routing, conventional large language models introduce substantial overhead by generating verbose token streams that require downstream regex parsing. Liquid AI's newly released d1-3B decision model addresses this structural inefficiency by accepting inputs up to 32,768 tokens across text, JSON, and images, and evaluating classification questions in a single forward pass without generating output tokens. Standard models across the LFM family support 32K context windows, extending up to 128K tokens on specialized configurations such as LFM2.5-8B-A1B, enabling local edge devices to process complex documents without cloud offloading."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
  - id: "model-portfolio-and-asset-matrix"
    title: "Model Portfolio, SKU Architecture, and Maturity"
    body: "The company's commercial and open-weight portfolio spans several distinct architectural generations. Liquid AI launched its initial foundation model lineup with dense checkpoints at 1.3 billion (LFM-1B) and 3.1 billion (LFM-3B) parameters alongside a 40.3-billion parameter Mixture of Experts (MoE) configuration designed for server deployments. In late 2025 and 2026, the company broadened this family into the LFM2 series, incorporating task-specialized checkpoints, vision-language variants (LFM2-VL), and late-interaction retrieval modules (LFM2-ColBERT). In October 2026, Liquid AI expanded into decision-focused systems by releasing d1-3B (a 3.12-billion parameter model based on LFM2.5-VL-3B) and d1-omni-600M (an experimental multimodal audio-text encoder). To monetize this technology while encouraging developer adoption, Liquid AI applies the LFM Open License v1.0, which permits free evaluation and deployment up to a strict $10 million annual revenue threshold, above which commercial licensing is required. However, independent testing indicates significant performance gaps between hardware environments: while vendor benchmarks claim 8-millisecond inference on RTX 4090 GPUs, CPU sandbox execution takes between 4.6 and 7.8 seconds per request."
    claimRefs:
      - "CE002"
      - "CE006"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE002"
  - id: "architectural-design-and-operating-model"
    title: "Architectural Foundations and Operating Stack"
    body: "Liquid AI's technical differentiation stems from mathematical formulations originally developed at MIT CSAIL. Unlike conventional transformer models that rely entirely on quadratic self-attention mechanisms, Liquid AI's LFM2 architecture is built on a minimal hybrid design dominated by gated short convolution blocks paired with a restricted number of grouped-query attention (GQA) layers. During architecture search, Liquid AI evaluated configurations directly on target consumer hardware, including Qualcomm Snapdragon SoCs and AMD Ryzen laptop processors. This hardware-in-the-loop search demonstrated that gated short convolutions achieved superior quality-latency-memory Pareto trade-offs compared to more complex state-space models or pure linear-attention variants. Pre-training incorporates 10 to 12 trillion tokens followed by a 32K-token mid-training phase, using decoupled Top-K knowledge distillation to stabilize student learning when teacher models expose only partial logits. Post-training relies on supervised fine-tuning (SFT), length-normalized preference alignment, and model merging to ensure rigorous adherence to structured JSON schemas and tool-use templates."
    claimRefs:
      - "CE003"
      - "CE007"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "deployment-differentiation-and-technical-risks"
    title: "Deployment Footprint, IP Differentiation, and Technical Risks"
    body: "For enterprise deployment, Liquid AI supports open-source runtimes including GGUF for llama.cpp and Ollama, MLX for Apple Silicon unified memory, and ONNX Runtime for embedded edge hardware, alongside its proprietary LEAP fine-tuning and deployment framework. Despite these engineering milestones, Liquid AI faces technical and market risks. In developer communities such as Reddit r/singularity, practitioners have expressed skepticism regarding whether liquid neural networks offer decisive real-world advantages over heavily optimized transformer alternatives, citing historical delays in delivering production weights. Furthermore, specialized competitors such as Cactus Compute are targeting the extreme edge by compressing automation foundation models below 2 bits per weight to fit microcontroller and wearable memory footprints. Finally, Liquid AI's headline benchmarks, including a Decision Index 0.2.1 score of 48.57 for d1-3B, currently represent vendor-scored results that have not been submitted to public leaderboards or validated by independent third parties."
    claimRefs:
      - "CE008"
      - "CE013"
      - "CE014"
