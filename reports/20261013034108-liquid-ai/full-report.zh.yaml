  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 替代架构格局与竞争者分类
        blocks:
          - type: paragraph
            body: >-
              Liquid AI 所处的基础模型市场正在快速分化，形成两种相反的架构范式：云规模 Transformer 基础模型，以及面向边缘的紧凑模型。OpenAI、Google、Anthropic
              等超大规模云厂商持续把稠密和混合专家 Transformer 扩展到数千亿参数，并部署在高能耗数据中心；与此同时，企业对本地推理、可预测延迟和数据隐私的需求推动小型语言模型之间展开激烈竞争。Liquid AI
              以基于连续时间动力系统和数值线性代数的液态基础模型，挑战传统固定参数 Transformer。在这一格局中，直接同业包括 Meta Llama 3.2 系列、Microsoft 以合成数据训练的 Phi-3.5
              系列，以及 Alibaba Qwen3 等开放权重小型 Transformer。Cactus Compute 等专注嵌入式的替代方案则采用激进的低于 2-bit
              量化和超紧凑二进制文件，面向微控制器，形成覆盖数据中心、移动 SoC 和嵌入式微控制器的多线竞争。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
