      - number: '3.2'
        title: 架构差异化与技术基准
        blocks:
          - type: paragraph
            body: >-
              Liquid AI 的主要技术差异化在于非标准模型架构，目标是解决 softmax 自注意力固有的二次计算与内存扩展瓶颈。传统 Transformer 处理长序列时，键值缓存内存会爆炸式增长；Liquid AI
              的 LFM 和 LFM2 架构采用次二次序列建模，保留循环关联记忆表示，并加入门控短卷积模块。早期检查点的标准评测显示，LFM-1B 在 MMLU 和 ARC-C 上超过 Transformer
              基线；LFM-3B 在相当内存占用下，与 Meta Llama 和 Microsoft Phi-3.5 的表现具有竞争力。LFM2 发布后，针对客户端芯片的硬件在环架构搜索显示，在普通 CPU
              上，由门控短卷积主导的最小混合架构，在质量—延迟 Pareto 表现上持续优于线性注意力和状态空间模型。该设计让 230M 至 1.2B 参数的稠密模型，在目标消费级处理器上的预填充与解码吞吐量约为同规模
              Qwen3 和 Gemma 3 的 2 倍。
            claimRefs:
              - CP001
              - CP004
              - CP008
              - CP014
