      - number: '5.4'
        title: 部署覆盖、IP 差异化与技术风险
        blocks:
          - type: paragraph
            body: >-
              面向企业部署，Liquid AI 支持 llama.cpp 和 Ollama 使用的 GGUF、Apple Silicon 统一内存使用的 MLX，以及嵌入式边缘硬件使用的 ONNX Runtime，并配套专有
              LEAP 微调与部署框架。尽管取得这些工程进展，公司仍面临技术和市场风险。Reddit r/singularity 等开发者社区的实践者质疑液态神经网络相对于高度优化 Transformer
              替代方案是否具有决定性的现实优势，并指出生产权重交付曾经延迟。Cactus Compute 等专门竞争者正把自动化基础模型压缩到每个权重低于 2 bit，以适配微控制器和可穿戴设备的内存。最后，d1-3B 的
              Decision Index 0.2.1 分数 48.57 等主要基准目前都是供应商自评结果，尚未提交公开排行榜，也未获独立第三方验证。
            claimRefs:
              - CE008
              - CE013
              - CE014
      - number: '5.5'
        title: 展示
        blocks:
          - type: callout
            title: 硬件在环 Pareto 效率与蛮力扩模
            body: >-
              Liquid AI 之所以偏好门控短卷积和分组查询注意力，而不是复杂线性注意力或纯 SSM 混合架构，是因为在实体 Snapdragon 和 Ryzen 芯片上测得了更好的 Pareto
              结果。在现实散热上限和内存带宽约束下，这种务实设计的解码吞吐量优于纸面上更吸引人的学术架构。
            calloutType: insight
            claimRefs:
              - CE003
              - CE007
          - type: callout
            title: 商业授权护城河与基准可复现性
            body: >-
              LFM Open License v1.0 设定严格的 $10 million 商业收入上限，能防止超大规模云厂商无偿利用 Liquid AI，但也会阻碍企业快速采用。此外，Decision Index
              48.57 等主要基准成绩仍依赖供应商自评，等待独立社区复现。
            calloutType: risk
            claimRefs:
              - CE006
              - CE014
