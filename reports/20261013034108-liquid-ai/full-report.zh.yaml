  - id: FM001
    title: 从广泛相邻市场到可获取收入的证据阶梯
    type: pyramid
    summary: 每一层向下都增加一项证据要求；现有来源支持部署类别，但不足以量化 SOM。
    data:
      items:
        - label: 广义 AI 与边缘相邻市场
          detail: 排除设备硬件、通用云算力、前沿训练和无关垂直领域支出。
        - label: 符合条件的本地、私有和混合工作负载
          detail: 找出内存、延迟、连接性、隐私或韧性会影响架构选择的工作负载。
        - label: 技术上可服务的终端
          detail: 在目标设备和企业系统上验证模型、运行时、格式和硬件兼容性。
        - label: 合格买方与预算
          detail: 确认采购负责人、经济买方、合同形式和年度软件价值。
        - label: 生产部署
          detail: 衡量付费终端数、工作负载量、实施时长和从评估到转化的比例。
        - label: 可获取的经常性收入
          detail: 应用经验证的价格、赢单率、续约率、集中度和销售能力假设。
    approximationNotes: 仅为概念层级；层宽和顺序不代表市场价值、转化率或已观察到的客户数量。
    claimRefs:
      - CM001
      - CM006
      - CM009
      - CM011
      - CM014
      - CM015
  - id: FP001
    title: 竞争定位图：边缘覆盖范围 vs. 能力广度
    type: quadrant
    summary: 对基础模型替代方案进行序数比较，维度为端侧运营效率和通用语言能力广度。
    xAxisLabel: 边缘运营效率（低内存与计算开销）
    yAxisLabel: 通用语言能力与推理广度
    data:
      points:
        - label: Liquid AI（LFM2）
          x: 8.5
          'y': 7.2
          description: 均衡的混合次二次方架构，针对 CPU 和边缘 SoC 优化
        - label: Meta Llama 3.2（1B/3B）
          x: 5.5
          'y': 7.5
          description: 标准 transformer SLM，质量强但 KV cache 内存开销高
        - label: Microsoft Phi-3.5
          x: 5
          'y': 7.8
          description: 推理能力强的小型模型，但受二次方注意力扩展限制
        - label: Cactus Needle
          x: 9.5
          'y': 4
          description: 超紧凑的低于 2 bit 二进制模型，专门针对微控制器工具调用优化
        - label: OpenAI GPT-4o / 云端前沿模型
          x: 1.5
          'y': 9.8
          description: 推理广度最大，但需要大规模数据中心 GPU 基础设施
        - label: Alibaba Qwen3（Small）
          x: 5.8
          'y': 7.4
          description: 具备竞争力的多语言小型模型，采用标准 transformer 计算特征
    claimRefs:
      - CP001
      - CP005
      - CP009
      - CP014
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 结构化流程展示从开放模型分发和战略联合开发，过渡到商业化边缘部署并产生毛利。
