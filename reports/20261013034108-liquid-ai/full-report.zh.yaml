figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 展示 Liquid AI 从 MIT 研究起源，到 LFM、LFM2 和 LFM2.5 模型架构的时间序列演进。
    data:
      items:
        - label: MIT 液态时间常数研究
          date: '2020-12-01'
          detail: Ramin Hasani、Daniela Rus、Mathias Lechner 和 Alexander Amini 发表奠基性论文，确立液态神经网络。
          tone: neutral
        - label: 公司注册与隐身运营
          date: '2023-01-15'
          detail: Liquid AI 在特拉华州注册，并在剑桥设立总部，将液态架构商业化。
          tone: positive
        - label: $46.6M 种子资本公告
          date: '2023-12-06'
          detail: 公司结束隐身状态，宣布由 OSS Capital 和 PagsGroup 领投、战略天使参与的 $46.6M 种子融资。
          tone: positive
        - label: 开发者社区审视
          date: '2024-01-11'
          detail: 机器学习社区质疑架构透明度，以及未经验证的非 transformer 基准表现。
          tone: adverse
        - label: 第一代 LFM 发布
          date: '2024-09-30'
          detail: 在 Liquid Playground、Lambda 和 Perplexity Labs 发布 LFM-1B、LFM-3B 和 LFM-40B 混合专家模型。
          tone: positive
        - label: LFM2 系列架构亮相
          date: '2025-07-15'
          detail: 推出 LFM2 系列模型，采用带门控短卷积的硬件在环搜索。
          tone: positive
        - label: LFM2 技术蓝图发布
          date: '2025-12-01'
          detail: 发布 51 页的完整技术报告，开源训练配方、后训练和多模态扩展。
          tone: neutral
        - label: LongevityBench 生物 AI 发布
          date: '2026-09-17'
          detail: 与 Insilico Medicine 研究人员共同编写开放基准，评估前沿 AI 在衰老生物学任务上的表现。
          tone: positive
        - label: LFM2.5 生产模型扩展
          date: '2026-10-13'
          detail: 通过 LEAP 微调和跨运行时支持，将产品目录扩展到边缘、音频、视觉和决策模型。
