  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与企业工作流
        blocks:
          - type: paragraph
            body: >-
              Liquid AI 将专有模型架构包装成双重产品：面向多模态边缘执行的生成式 Liquid Foundation Models（LFMs），以及面向结构化运营任务、用于替代生成式聊天 LLM
              的专用决策模型。在内容审核、视频剪辑、文档分类、客服路由等标准客户流程中，传统大语言模型会生成冗长 token 流，后续还要用正则表达式解析，带来大量额外开销。Liquid AI 新发布的 d1-3B
              决策模型通过一次前向传递直接评估分类问题、无需生成输出 token，且可接收最多 32,768 个 token 的文本、JSON 和图像输入，解决了这一结构性低效。LFM 系列标准模型支持 32K
              上下文窗口，LFM2.5-8B-A1B 等专用配置最高支持 128K token，让端侧设备无需把复杂文档上传云端即可处理。
            claimRefs:
              - CE001
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE005
      - number: '5.2'
        title: 模型组合、SKU 架构与成熟度
        blocks:
          - type: paragraph
            body: >-
              公司商业与开放权重基础模型产品组合覆盖多代架构。Liquid AI 最初推出 1.3 billion 参数的 LFM-1B、3.1 billion 参数的 LFM-3B 稠密检查点，以及为服务器部署设计的
              40.3-billion-parameter Mixture of Experts（MoE）配置。2025 年末和 2026 年，公司将产品扩展到 LFM2
              系列，加入任务专用检查点、视觉语言变体（LFM2-VL）和后交互检索模块（LFM2-ColBERT）。2026 年 10 月，公司发布 d1-3B（基于 LFM2.5-VL-3B 的
              3.12-billion-parameter 模型）和 d1-omni-600M（实验性多模态音频—文本编码器），进入决策系统领域。为在鼓励开发者采用的同时实现变现，Liquid AI 采用 LFM Open
              License v1.0，允许在严格的 $10 million 年收入门槛以内免费评估和部署，超过后必须商业授权。不过，独立测试显示不同硬件环境差距显著：供应商称 RTX 4090 GPU 推理只需
              8-millisecond，而 CPU 沙盒每次请求需要 4.6 至 7.8 秒。
            claimRefs:
              - CE002
              - CE006
              - CE009
              - CE010
