  - id: FV001
    title: 建议逻辑链
    type: flow
    summary: 决策链连接技术差异化、商业披露缺口、估值倍数压力和最终的“跟踪”立场。
    data:
      nodes:
        - id: tech-foundation
          label: 技术架构
          description: MIT CSAIL 分拆公司开发专有的非 transformer Liquid Foundation Models（LFM/LFM2），实现次二次方内存扩展。
        - id: capital-cushion
          label: 融资与联合投资
          description: Seed（$46.6M）和 AMD 牵头的 Series A（$250M）两轮共募资 $296.6M，建立了强劲资产负债表。
        - id: commercial-opacity
          label: 商业披露缺口
          description: 未披露经验证的公开 ARR、毛利率、客户留存或单位经济性；仅有 $13.2M 未经验证的估计值。
        - id: valuation-premium
          label: 估值压力
          description: $2.28B-$2.4B 私募估值意味着 P/ARR 倍数高于 170 倍，远超公开软件 / AI IPO 可比公司的 15x-41x P/S。
        - id: competitive-headwinds
          label: 竞争与稀释风险
          description: 小型 transformer 模型和专用边缘运行时带来激烈竞争；累计优先股稀释约 26%。
        - id: final-recommendation
          label: 跟踪建议
          description: 在披露生产规模 ARR 和合同留存数据之前，维持“跟踪”立场及“偏高”估值评级。
      edges:
        - from: tech-foundation
          to: capital-cushion
        - from: capital-cushion
          to: commercial-opacity
        - from: commercial-opacity
          to: valuation-premium
        - from: valuation-premium
          to: competitive-headwinds
        - from: competitive-headwinds
          to: final-recommendation
    approximationNotes: 流程图综合估值分析中的定性与定量投资判断逻辑。
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV014
      - CV015
