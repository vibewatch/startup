  - id: FE001
    title: 产品架构图
    type: stack
    summary: 覆盖训练课程到边缘设备运行时的六层架构栈。
    data:
      layers:
        - label: 边缘与嵌入式运行时
          detail: 通过 GGUF、MLX 和 ONNX 在 Snapdragon、Apple Silicon 及 AMD/ARM 设备上本地执行
        - label: 决策与专用模型层
          detail: d1-3B（3.12B）和 d1-omni-600M，经过零输出 token 校准，用于分类和路由
        - label: 基础模型骨干
          detail: LFM2 / LFM2.5 混合门控短卷积与分组查询注意力（GQA）架构
        - label: 多模态与音频摄取
          detail: 采用 PixelUnshuffle 动态切片的 SigLIP2 视觉编码器，以及分叉式音频处理
        - label: Agentic 检索与记忆
          detail: LFM2-ColBERT 后交互本地检索与 MeMo 外部状态表示
        - label: 训练与后训练基础设施
          detail: 硬件在环搜索、解耦 Top-K 蒸馏，以及 SFT/DPO 对齐流水线
    claimRefs:
      - CE003
      - CE007
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 覆盖开放权重开发者发现、端侧评估和企业商业部署的端到端客户采用旅程。
