chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、起源与使命
        blocks:
          - type: paragraph
            body: >-
              Liquid AI 是一家企业级、端侧人工智能公司，2023 年由 Massachusetts Institute of Technology 的 Computer Science and Artificial
              Intelligence Laboratory（MIT CSAIL）直接商业化分拆而来。公司总部位于马萨诸塞州剑桥，目标是把 MIT 十多年连续时间系统与动力系统研究中形成的非 Transformer
              神经架构商业化。传统生成式人工智能基础设施几乎都围绕 Transformer 骨干构建，而 Liquid AI 设计的 Liquid Foundation
              Models（LFMs）则针对执行效率、延迟确定性和硬件受限环境优化，覆盖边缘微控制器、移动处理器到混合本地部署企业服务器。公司已在 llama.cpp、MLX、ONNX 和 vLLM
              等多个运行时环境发布大量开放技术权重与模型目录，并配套自研 LEAP 部署栈，但对商业进展完全保密。截至 2026 年 10
              月，公司没有披露任何经审计的收入运行率、客户数或单位经济指标，科学背景的深度与未经验证的商业规模形成鲜明反差。
            claimRefs:
              - CO001
              - CO002
              - CO011
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
      - number: '1.2'
        title: 创始团队、管理层与治理结构
        blocks:
          - type: paragraph
            body: >-
              Liquid AI 的创始管理层汇聚了 MIT CSAIL 的顶尖计算神经科学和机器人研究者。CEO Ramin Hasani 与 CTO Mathias Lechner 负责经营和系统架构；他们在 MIT
              读博及博士后期间率先研究了液态时间常数神经网络的数学基础。联合创始人 Alexander Amini 担任首席科学官，负责模型动力学与安全；MIT CSAIL 主任、国际知名机器人学家 Daniela Rus
              担任高级科学顾问。四人组成的团队理论深度和学术可信度突出，但也带来显著的关键人物依赖：核心算法创新仍与原研究团队紧密绑定。除创始研究者外，公司已围绕硬件在环编译扩充工程团队，但对正式公司治理的公开信息仍极少。公司尚未公布受托董事会的组成、独立董事监督机制，或创始人与机构种子投资人的具体投票协议；对潜在资本合作方而言，这都是必须补齐的尽调问题。
            claimRefs:
              - CO001
              - CO013
              - CO014
          - type: table
            tableRef: TO002
