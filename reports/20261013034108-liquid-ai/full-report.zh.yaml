  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近领域与替代方案
        blocks:
          - type: paragraph
            body: >-
              Liquid AI 的相关市场并不是全部生成式 AI 支出，而是受益于本地、边缘、本地部署或混合执行的工作负载所需的模型软件与部署工具。TechCrunch
              报道称，公司最初的商业化计划包含私有及本地部署基础设施；Liquid 当前文档也提供本地和边缘格式。候选工作负载包括移动和消费设备、机器人、无人机、汽车系统、序列工业或科学数据，以及私有企业应用。除非
              Liquid 以合同方式捕获这些收入，否则硬件收入、一般云计算支出、前沿模型训练和无关的垂直软件都应排除。现有云 API、紧凑模型、内部模型优化和 Cactus
              等专用端侧厂商是现状替代方案；因此，这场竞争争夺的是可部署工作负载份额，而不是全部 AI 支出的份额。
