        - 不同 SoC 需要专用的底层编译器支持
      - - 解耦式 Top-K 蒸馏
        - 从前沿 LLM 迁移知识，同时避免 logits 爆炸
        - 训练期间需要接入高能力前沿教师模型
        - 教师模型分布变化可能引入隐蔽的行为幻觉
      - - 动态 Token PixelUnshuffle
        - 针对多模态输入进行激进的视觉 token 压缩
        - SigLIP2 NaFlex 视觉编码器和动态切片流水线
        - 密集技术图纸的空间分辨率可能下降
      - - LEAP 部署框架
        - 边缘编排、量化和本地微调工具链
        - 集成 ONNX Runtime、llama.cpp 和 Apple MLX 库
        - 需要持续跟踪上游运行时的破坏性变更，维护负担较重
    notes: 架构组件摘自 LFM2 技术报告和学术预印本；第三方验证尚未完成。
