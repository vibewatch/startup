          - type: paragraph
            body: >-
              Liquid Foundation Models
              的核心单位经济逻辑，是把运行时计算从集中式云数据中心转移到端侧芯片。标准云端语言模型会产生持续且随用量变化的推理成本，使企业运营支出波动，并挤压软件供应商利润率。Liquid AI 面向移动
              SoC、笔记本处理器和汽车计算机等客户硬件，在这些设备上，本地推理无需为每次查询支付云基础设施费。通过与 AMD、Qualcomm 等硬件伙伴共同设计混合神经架构，公司希望消除云网络延迟和持续 token
              计量。对企业采用者而言，这种运营架构让成本更可预测，也增强隐私；对 Liquid AI 而言，提供边缘软件运行时可以避开托管集中式前沿模型集群所需的巨额资本开支。
