      - number: '1.3'
        title: 资本化历程与投资人联盟
        blocks:
          - type: paragraph
            body: >-
              Liquid AI 于 2023 年 12 月正式结束隐身运营，宣布完成 $46.6 million 的种子轮融资。该轮由开放源代码企业基金 OSS Capital 与 Boston Celtics
              共同所有人、Bain Capital 老将 Stephen Pagliuca 的家族办公室 PagsGroup 共同领投。SiliconANGLE 等科技媒体随后报道种子轮总额为 $37.6
              million，可能反映交割批次、可转债或股权结构的差异。种子轮投资人包括 Breyer Capital、Samsung Next、Bold Capital Partners、ISAI Cap
              Venture（Capgemini 的企业投资工具）等知名机构和企业，以及 Naval Ravikant、Tobias Lütke、Tom Preston-Werner 等天使投资人。市场评论还流传着 2026
              年最高达 $2.3 billion 的未经验证私募估值，但公开渠道没有任何经验证的 Series A 或成长阶段股权申报文件。此外，Liquid AI
              没有披露老股交易、风险债务工具或正式股权结构表，所有权稀释和机构控制权因而不透明。
