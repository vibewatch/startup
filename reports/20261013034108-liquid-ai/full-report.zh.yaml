  - id: TE001
    title: 工作流与用例表
    columns:
      - 用户任务
      - 当前工作流
      - Liquid AI 方案
      - 可量化收益
      - 技术限制
    rows:
      - - 内容审核与策略路由
        - 大型聊天 LLM 生成冗长解释文本，再用正则表达式解析
        - d1-3B 决策模型一次前向传播就能评估状态和问题
        - 不生成输出 tokens；RTX 4090 GPU 上供应商延迟为 8 ms
        - 纯 CPU 备用方案延迟很高（每次查询 4.6 至 7.8 秒）
      - - 端侧文档分析
        - 受移动设备 RAM 限制，文档必须流式传输到云端点
        - LFM-3B 稠密模型在本地运行，支持 32K token 上下文窗口
        - 保护数据隐私，并消除持续产生的云推理 API 费用
        - 面对开放式逻辑任务时，复杂推理仍落后于前沿云模型
      - - 边缘多模态视频分诊
        - 大型视觉 Transformer 需要高功耗服务器 GPU
        - LFM2-VL 搭配 SigLIP2 视觉编码器和 PixelUnshuffle token 压缩
        - 动态切片将 token 数量压到移动处理器可承受的范围
        - 在小型实验性模型检查点中，视听联合处理仍受限
      - - 本地企业 RAG 与检索
        - 向量数据库需要外部加速器，并带来网络开销
        - LFM2-ColBERT 的后交互检索与设备共置运行
        - 本地索引速度快，确保机密文档不会离开边界
        - 4GB 以下消费级移动设备的内存容量有限
    notes: 分析基于供应商技术文档和开发者指南；延迟改善以配备专用 GPU 加速为前提。
