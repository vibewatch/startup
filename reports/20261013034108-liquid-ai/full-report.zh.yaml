      - number: '1.4'
        title: 技术里程碑、架构演进与市场反馈
        blocks:
          - type: paragraph
            body: >-
              Liquid AI 的技术路线体现出从学术概念验证快速走向生产部署的意图。2024 年 9 月，公司推出第一代基础模型（LFM-1B、LFM-3B 和 LFM-40B 混合专家模型），在 MMLU、ARC-C
              等基准上展现出与 Microsoft Phi-3.5、Meta Llama 等传统小型语言模型相当的表现。2025 年 7 月，公司推出第二代 LFM2 系列，并于 2025 年 12 月发布一份 51
              页技术蓝图，详述把门控短卷积与分组查询注意力结合起来的混合架构。到 2026 年底，文档目录已扩展至覆盖 230M 至 8B 参数的
              LFM2.5、多模态视觉语言处理器和专用决策模型。不过，早期发布也遭遇开发者质疑：Reddit 等平台的社区观察者质疑其所宣称的实时适应机制为何不透明。与此同时，Cactus Compute
              等边缘智能竞争者指出运营取舍：Liquid AI 虽能产出能力很强的模型权重，却主要仍是模型供应商，没有原生移动应用 SDK。公司还通过合作研究拓展垂直验证，包括 2026 年 9 月与 Insilico
              Medicine 共同开展的 LongevityBench 生物 AI 基准。
