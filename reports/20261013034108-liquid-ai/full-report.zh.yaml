      - number: '2.4'
        title: 采用驱动、约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              最有力的采用逻辑来自运营，而不只是基准成绩。本地推理可以减少网络依赖、把延迟交给设备控制，并让选定数据留在企业或产品边界内；混合架构则可把云端模型留给需要更强推理能力的工作负载。但同一逻辑也制造执行风险。VentureBeat
              将延迟、内存和散热约束描述为生产设计上限；一份存档的开发者讨论则显示，社区质疑液态神经网络的实际差异化和可见结果。Liquid
              还必须与其他小模型和压缩方案竞争，而不只是与前沿云厂商竞争。估值判断应把技术可部署性与市场捕获分开：公开证据没有披露定价、付费部署数量、续约行为、工作负载量，或从评估到生产的转化率。这些缺失的商业变量主导任何近期
              SOM 估算。
