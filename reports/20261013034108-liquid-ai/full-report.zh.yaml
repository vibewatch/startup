      - number: '5.3'
        title: 架构基础与运行栈
        blocks:
          - type: paragraph
            body: >-
              Liquid AI 的技术差异化源自 MIT CSAIL 最初开发的数学构式。传统 Transformer 完全依赖二次自注意力机制，而 Liquid AI 的 LFM2
              架构采用由门控短卷积模块主导的最小混合设计，并配以数量受限的分组查询注意力（GQA）层。架构搜索时，公司直接在目标消费级硬件上评估配置，包括 Qualcomm Snapdragon SoC 和 AMD Ryzen
              笔记本处理器。硬件在环搜索显示，门控短卷积相较复杂状态空间模型或纯线性注意力变体，在质量—延迟—内存 Pareto 权衡上更优。预训练使用 10 至 12 trillion 个 token，之后进行
              32K-token 中期训练；同时采用解耦 Top-K 知识蒸馏，在教师模型只暴露部分 logits 时稳定学生模型学习。后训练依靠监督微调（SFT）、长度归一化偏好对齐和模型合并，确保严格遵循结构化 JSON
              模式与工具调用模板。
            claimRefs:
              - CE003
              - CE007
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE007
              - CE008
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
