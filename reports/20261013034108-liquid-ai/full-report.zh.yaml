      - number: '3.3'
        title: 商业封装、授权与切换成本
        blocks:
          - type: paragraph
            body: >-
              基础模型行业的商业化依托不同授权机制和部署模式。OpenAI、Anthropic 等前沿云厂商通过按 token 浮动计价的 API
              和按席位计费的企业订阅变现，使客户持续承担运营支出，并被锁定在专有云基础设施中。相比之下，Liquid AI 采用开放与商业并行的授权结构：开发者和商业实体可以免费下载、运行和微调模型，直到达到客户年收入 $10
              million 的门槛。这个定价策略降低了资源有限初创公司的采用阻力，同时希望在企业部署进入生产规模后捕获价值。为降低切换成本、对抗超大规模云生态的锁定，Liquid AI 支持
              llama.cpp、vLLM、SGLang 和 MLX 等开源推理引擎，并提供 GGUF、MLX 和 ONNX 标准导出格式。此外，公司与 AMD、Qualcomm、Apple 和 Nvidia
              直接开展芯片优化，使企业客户能在异构边缘和本地部署服务器集群上使用多家硬件，而不被单一供应商锁定。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 护城河持久性、替代风险与反向技术证据
        blocks:
          - type: paragraph
            body: >-
              尽管基准数字亮眼，Liquid AI
              仍面临显著竞争压力和架构护城河风险。液态神经网络的早期研究源自用于机器人和连续感知控制的线虫神经系统生物建模，因此机器学习研究者与开发者社区质疑这种架构能否顺利迁移到离散的符号语言生成。社区批评者指出，早期把
              20 个神经元的无人机控制器与 175-billion-parameter 语言模型比较的宣传，属于忽略语言建模复杂性的非对称比较。Meta 等开放权重既有厂商拥有庞大的社区生态、广泛的编译器优化和巨型 GPU
              训练集群，可以通过剪枝和蒸馏迅速削弱架构延迟优势。在极度受限的嵌入式领域，Cactus Compute 等微模型竞争者用低于 2-bit 的量化交付小于 30MB
              的二进制文件，说明不采用新型动力网络也能依靠其他压缩技术实现边缘执行。随着标准 Transformer 运行时持续优化端侧推理，Liquid AI
              必须证明自己在复杂企业任务上能持续保持更高准确率，才能守住专有架构溢价。
