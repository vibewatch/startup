      - "CI011"
      - "CI015"
  - calloutType: "insight"
    title: "Edge Inference Cost Dynamics"
    body: "Liquid AI's economic moat depends on shifting model execution to endpoint hardware, where marginal inference cost is effectively decoupled from usage volume. If edge adoption scales, the company could achieve high gross margins by licensing runtime software while avoiding centralized cloud hosting expenses."
