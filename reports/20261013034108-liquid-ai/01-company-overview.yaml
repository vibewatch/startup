company:
  name: "Liquid AI"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Liquid AI is a Cambridge, Massachusetts-based MIT CSAIL spinout founded in 2023 by Ramin Hasani, Mathias Lechner, Alexander Amini, and Daniela Rus to build proprietary Liquid Foundation Models (LFMs). The company emerged from stealth in December 2023 with $46.6M in seed financing led by OSS Capital and PagsGroup, expanding its model family across LFM, LFM2, and LFM2.5 architectures for edge, on-device, and cloud deployment while leaving commercial ARR and customer concentration unquantified."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Origins, and Mission"
    body: "Liquid AI represents an enterprise and on-device artificial intelligence company established in 2023 as a direct commercial spinout from the Massachusetts Institute of Technology's Computer Science and Artificial Intelligence Laboratory (MIT CSAIL). Headquartered in Cambridge, Massachusetts, the company was created to commercialize non-transformer neural architectures originally developed over a decade of academic investigation into continuous-time and dynamical systems. Unlike conventional generative artificial intelligence infrastructure built almost exclusively around Transformer backbones, Liquid AI designs Liquid Foundation Models (LFMs) optimized for execution efficiency, latency determinism, and hardware-constrained environments ranging from edge microcontrollers and mobile processors to hybrid on-premises enterprise servers. While the company has released extensive open technical weights and model catalogs across multiple runtime environments including llama.cpp, MLX, ONNX, and vLLM alongside its proprietary LEAP deployment stack, Liquid AI maintains complete confidentiality regarding commercial traction. As of October 2026, the company provides zero audited revenue run-rate disclosures, customer counts, or unit economic metrics, creating a pronounced contrast between its scientific pedigree and unverified commercial scale."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Founding Team, Leadership, and Governance Structure"
    body: "The founding leadership of Liquid AI unites premier computational neuroscience and robotics researchers from MIT CSAIL. Chief Executive Officer Ramin Hasani and Chief Technology Officer Mathias Lechner lead executive operations and systems architecture, having pioneered the mathematical foundations of liquid time-constant neural networks during their doctoral and postdoctoral tenures at MIT. They are joined by co-founders Alexander Amini, who serves as Chief Science Officer leading model dynamics and safety, and Daniela Rus, Director of MIT CSAIL and an internationally renowned roboticist who acts as senior scientific advisor. This founding quartet provides exceptional theoretical depth and academic credibility, but also creates significant key-person dependencies, as core algorithmic innovations remain tightly coupled to the original research group. Beyond the founding researchers, Liquid AI has expanded engineering teams around hardware-in-the-loop compilation, yet public disclosure concerning formal corporate governance remains minimal. The company has not published the composition of its fiduciary Board of Directors, independent board oversight, or specific voting agreements between the founders and institutional seed investors, representing an essential diligence inquiry for prospective capital partners."
    claimRefs:
      - "CO001"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-investor-syndicate"
    title: "Capitalization History and Investor Syndicate"
    body: "Liquid AI formally emerged from stealth operations in December 2023, announcing an initial seed capital raise of $46.6 million. The financing round was co-led by OSS Capital, an open-source enterprise fund, and PagsGroup, the family office of Boston Celtics co-owner and Bain Capital veteran Stephen Pagliuca. Secondary enterprise technology reporting from outlets such as SiliconANGLE concurrently reported the seed total as $37.6 million, reflecting potential differences in closing tranches, convertible notes, or equity structures. The seed syndicate featured participation from leading venture firms and corporate entities including Breyer Capital, Samsung Next, Bold Capital Partners, and ISAI Cap Venture (Capgemini's corporate investment vehicle), alongside prominent angel investors such as Naval Ravikant, Tobias Lütke, and Tom Preston-Werner. Subsequent market commentary has circulated unverified private valuation figures reaching $2.3 billion in 2026, yet no verified Series A or growth-stage equity filings have been made available publicly. Furthermore, Liquid AI discloses no secondary share transactions, venture debt facilities, or formal cap table allocations, obscuring ownership dilution and institutional control rights."
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO012"
      - "CO014"
    tableRefs:
      - "TO003"
  - id: "technical-milestones-and-reception"
    title: "Technical Milestones, Architecture Evolution, and Market Reception"
    body: "Liquid AI's technical roadmap reflects an aggressive transition from academic proof-of-concept to production model deployments. In September 2024, the company introduced its first-generation foundation models (LFM-1B, LFM-3B, and LFM-40B mixture-of-experts), demonstrating competitive benchmark performance against traditional small language models such as Microsoft's Phi-3.5 and Meta's Llama family. The company subsequently introduced its second-generation LFM2 family in July 2025, culminating in a comprehensive 51-page technical blueprint in December 2025 detailing hybrid architectures that combine gated short convolutions with grouped-query attention. By late 2026, Liquid AI expanded its documentation catalog to LFM2.5 models spanning 230M to 8B parameters, multimodal vision-language processors, and specialized decision models. However, this progression encountered meaningful developer skepticism during early announcements, with community observers on platforms such as Reddit questioning the opacity of claimed real-time adaptation mechanisms. Concurrently, competitive edge intelligence providers such as Cactus Compute highlight operational tradeoffs, noting that while Liquid AI produces highly capable model weights, it functions primarily as a model provider without native mobile application SDKs. Liquid AI continues to broaden domain-specific validation through collaborative research, including the September 2026 LongevityBench biological AI benchmark with Insilico Medicine."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
    figureRefs:
      - "FO001"
