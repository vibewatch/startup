  topStrengths:
    - >-
      Exceptional early capital base and investor quality, including Flagship, Braidwell, Collective Global, and
      Nvidia-backed participation.
    - >-
      Differentiated end-to-end AI Science Factory thesis that combines models, robotics, and automated experimentation
      instead of software-only discovery tooling.
    - High-caliber founder and scientific bench with deep Flagship and frontier-science credibility.
    - >-
      Large potential upside across therapeutics, biotech, chemistry, and materials if the closed-loop platform proves
      repeatable.
  topRisks:
    - >-
      No public revenue, margin, pricing, utilization, or named paying-customer data supports traditional underwriting
      today.
    - >-
      Public scientific proof remains thinner than the ambition and valuation narrative, so repeatability and
      transferability are still open questions.
    - A more than $1.3B mark at the Series A stage leaves limited margin for execution misses.
    - >-
      The model appears capital intensive because it requires lab infrastructure, robotics, frontier AI talent, and
      substantial compute.
    - >-
      Regulatory, biosecurity, IP, and downstream commercialization handoff risks remain significant in life-science and
      materials workflows.
  unresolvedGaps:
    - >-
      Independent validation of Lila's claimed discovery outcomes, benchmark wins, and throughput economics is still
      limited.
    - Named customer references, pricing, contract structure, and recurring-revenue quality remain undisclosed.
    - Burn, runway, gross margin, and cap-table terms are not public.
    - >-
      Evidence that AI Science Factories can scale repeatably across multiple domains without bespoke support is still
      incomplete.
