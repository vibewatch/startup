      - number: '3.2'
        title: Modular software, automation, and open-science substitutes
        blocks:
          - type: paragraph
            body: >-
              The more dangerous substitute set is not only the direct AI-drug-discovery players. Benchling, Opentrons,
              OpenBioML, and Arcadia illustrate a modular alternative to Lila’s integrated thesis. Benchling offers
              enterprise R&D software, end-to-end process tracking, AI tools, integrations, and implementation scale,
              but it does not claim to autonomously run the scientific method. Opentrons similarly markets
              reconfigurable automation and explicit freedom from closed systems, making it a wet-lab layer substitute
              rather than a science-factory owner. OpenBioML extends the substitute map on the model and community
              layer: its open research lab framing, public repositories, and compute-backed collaborations show that
              parts of biological AI can be built in an open ecosystem rather than inside a proprietary vertical stack.
              Arcadia pushes on a different flank by releasing tools, protocols, and software pipelines back to the
              community while trying to rethink the research cycle. None of these efforts reproduces Lila’s full claim
              alone, but together they describe a plausible assemble-your-own path in which a buyer combines data
              infrastructure, automation hardware, and open or partner-driven models instead of adopting one closed
              factory.
