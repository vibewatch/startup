  - id: FR002
    title: Risk transmission map
    type: dag
    layout: standard
    summary: >-
      How Lila's biggest risks transmit from scientific proof and governance into customer adoption, financing leverage,
      and ultimately the investment thesis.
    data:
      nodes:
        - id: PROOF
          label: Weak public proof
          detail: Platform claims remain stronger than public benchmark or replication evidence
        - id: GOV
          label: Governance gap
          detail: Biosecurity, privacy, and data controls are not publicly productized
        - id: CUST
          label: Slow customer conversion
          detail: First-cohort language lacks named customers, ACV, or outcomes
        - id: BURN
          label: High burn / capital intensity
          detail: Factories plus global hiring consume capital before durable revenue
        - id: COMP
          label: Competitive pressure
          detail: Focused peers market narrower proof points
        - id: FUND
          label: Tougher next financing
          detail: Investors demand hard evidence rather than narrative optionality
        - id: THESIS
