  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitute stacks
        blocks:
          - type: paragraph
            body: >-
              Lila Sciences should not be underwritten against a single generic “AI for science” TAM. The public
              evidence splits the relevant spend into adjacent layers. Lab automation reports focus on robotic systems,
              automated workstations, liquid handling, screening, and workflow software used in drug discovery,
              genomics, and diagnostics. Laboratory informatics reports cover the data and control backbone—LIMS, ELN,
              LES, cloud delivery, and compliance tooling. AI drug discovery reports describe software and services for
              target identification, screening, repurposing, de novo design, and preclinical prioritization. The
              self-driving-laboratory literature then describes a narrower, emergent orchestration layer that connects
              automated instruments, AI decision engines, and data systems in closed-loop experimentation. For Lila,
              included spend is the overlap where those layers are purchased together to accelerate discovery or process
              optimization. Excluded spend should include routine diagnostics operations, generic enterprise AI, full
              clinical-development or CRO service revenue, and broad industrial automation that does not sit inside an
              experimental loop. In practice, the status quo substitute is usually a fragmented stack of instruments,
              informatics, internal scripts, CRO work, and human-driven experiment planning rather than one direct
              incumbent product.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM019
