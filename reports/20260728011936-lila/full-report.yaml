      - number: '2.3'
        title: Buyer, user, payer, and initial serviceable market
        blocks:
          - type: paragraph
            body: >-
              The clearest commercial buyer set is pharma and biotech R&D. Mordor says pharmaceutical and biotechnology
              companies accounted for 53.14% of laboratory informatics spending in 2025, and Thermo Fisher’s 2024
              revenue profile shows 57% of its revenue coming from pharma and biotech customers. CROs are the
              next-most-relevant segment because they appear explicitly in lab automation end-user lists and are one of
              the faster-growing informatics cohorts. Academic and government labs are important for technical
              validation, methods development, and reference accounts—NIH says its nearly US$48 billion budget supports
              almost 50,000 competitive grants across more than 2,500 institutions—but that procurement base is diffuse
              and generally less likely to support a full factory-style enterprise contract. Materials, chemistry, and
              industrial R&D matter strategically because self-driving-lab literature is strongest there and Thermo and
              Agilent both emphasize advanced materials and applied-lab workflows, but public market reports do not
              isolate those programs cleanly. The practical buyer inside an integrated deployment is usually a head of
              platform R&D, medicinal chemistry, screening, automation engineering, or lab operations, while the users
              are bench scientists, automation engineers, and computational scientists. The payer is typically a central
              R&D budget owner who can defend automation spend on throughput, cycle-time compression, or reproducibility
              rather than pure IT modernization.
