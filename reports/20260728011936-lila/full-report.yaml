      - number: '2.4'
        title: Growth drivers, adoption constraints, and fragmented competition
        blocks:
          - type: paragraph
            body: >-
              The adoption case for Lila’s market rests on productivity pressure. High-throughput screening, labor
              scarcity, and the need to reduce manual error keep pushing laboratories toward automated workflows. In
              informatics, compliance, auditability, and cloud-native data handling are forcing labs to modernize
              systems of record. In AI drug discovery, buyers are motivated by the cost and time burden of discovery
              itself: Mordor highlights pressure to compress multiyear discovery cycles and cites an average US$2.6
              billion cost to commercialize a molecule. Yet the constraints are equally visible. Both market reports and
              self-driving-lab reviews repeatedly point to legacy-system integration, fragmented instrument estates,
              high upfront cost, implementation burden, and weak interoperability. The Bruker/Chemspeed launch
              reinforces the same point from the supply side: heterogeneous labs still struggle with siloed tools and
              integration gaps. The market is also subject to credibility risk. STAT’s 2024 coverage quotes Insitro’s
              Daphne Koller warning that people expect breakthroughs “tomorrow,” which is a reminder that investor
              enthusiasm can run ahead of realized deployment. Competitive context is fragmented rather than
              winner-take-all: lab automation is dominated by incumbents such as Thermo, Danaher, Agilent, Tecan, and
              Roche; AI discovery has its own software cohort; and self-driving-lab startups still compete inside
              broader stacks defined by instruments, informatics, and services.
