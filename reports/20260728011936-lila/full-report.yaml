      - number: '2.5'
        title: Sizing and adoption diligence gaps that matter for valuation
        blocks:
          - type: paragraph
            body: >-
              The main underwriting problem is not whether the market exists; it is whether Lila is monetizing the right
              slice of it. Public evidence does not support a clean, standalone TAM for autonomous labs or AI science
              factories. It supports adjacent funded categories that can be stitched into a commercialization thesis,
              with pharma and biotech as the most defensible first wedge and materials discovery as a strategically
              important but harder-to-size second wedge. That means valuation work needs bottom-up commercial evidence
              from Lila rather than more top-down market reports. The key asks are straightforward: current ACV by
              customer type, software-versus-automation-versus-services mix, implementation duration, renewal behavior,
              and evidence that customers actually expand from one workflow into a broader factory model. Without those
              data, a broad TAM can justify interest in the category but not conviction in Lila’s share capture or
              margin structure.
            claimRefs:
              - CM018
              - CM019
              - CM039
              - CM043
              - CM044
              - CM045
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is layered, not monolithic
            body: >-
              The best evidence does not support a single TAM for AI science factories. It supports several adjacent
              categories that Lila must integrate better than point-solution vendors and status-quo workflows.
            calloutType: insight
            claimRefs:
              - CM001
              - CM011
              - CM018
              - CM019
          - type: callout
            title: Bottom-up proof matters more than top-down TAM
            body: >-
              Because the autonomous-lab inner shell is still publicly unsized, valuation should lean on customer mix,
              ACV, deployment speed, and renewal evidence rather than on the largest available market report.
            calloutType: risk
            claimRefs:
              - CM019
              - CM039
