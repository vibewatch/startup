      - number: '7.3'
        title: Commercialization and competitive risk
        blocks:
          - type: paragraph
            body: >-
              Even if Lila's core science stack is real, commercialization risk remains severe because the company is
              trying to shorten categories that are structurally long-cycle. External sources on drug discovery are
              blunt: most preclinical programs never reach human testing, clinical approval rates remain low,
              development often takes more than a decade, and total costs can run into the billions. Advanced materials
              commercialization is different in mechanism but similar in consequence: qualification, integration, and
              customer adoption still take time. That means Lila is exposed to a classic deep-tech trap in which capital
              is raised against platform promise long before the market can verify repeatable productization. Public
              commercialization proof is also thin. Management says a first cohort of customers is being welcomed, but
              named customers, contract size, revenue, and outcome data are not public. Meanwhile, the competitive set
              is not empty. Recursion, Isomorphic Labs, Insilico, Absci, and CuspAI all market domain-specific proof
              points, pipelines, or specialized technical positions. Lila therefore has to beat not just incumbents in
              science, but also specialized peers that can tell a simpler story to investors and buyers. A multi-domain
              platform can look larger in TAM terms while still losing on focus, urgency, and trust at the point of
              sale.
