      - number: '8.2'
        title: Financing context, comparables, and the Flagship premium
        blocks:
          - type: paragraph
            body: >-
              The best way to value Lila today is not with a revenue multiple; revenue is not publicly disclosed and the
              company is not presenting itself as a fully integrated therapeutics business. A better frame is
              probability-weighted milestone pricing against three comparable clusters: premium private AI-science
              rounds, Flagship platform peers, and public AI-drug resets. On the upside, Xaira's $1 billion launch
              financing and Isomorphic Labs' $600 million 2025 round followed by a $2.1 billion 2026 round show that
              private markets will fund category leaders at exceptional scale when they believe an AI platform can
              become foundational. Generate:Biomedicines is the closer Flagship-style reference: still capital
              intensive, but with a more visible clinical pipeline and nearly $700 million raised since 2020.


              On the downside, public comps are much harsher. Recursion's June 2026 market cap is only about $2.01
              billion despite years of platform building, public listing access, and multiple partnerships, while its
              10-K still warns that it has no approved products and expects to need substantial additional funding.
              Exscientia shows the sharper reset: a well-funded 2021 IPO was followed by a 2024 merger at about $688
              million, with BioPharma Dive and other coverage emphasizing that both Recursion and Exscientia had lost
              most of their value by then. Those public outcomes do not make Lila overvalued by definition, but they do
              cap how much investors should pay for narrative without proof.


              Flagship does deserve some premium versus an ordinary early-stage company because it can originate deep
              technical teams, strategic capital, and category storytelling. But that premium should not be infinite.
              Without named partners, published validation data, or unit economics, the public evidence does not justify
              paying as if Lila has already converted platform promise into durable, repeatable cash flows.
            claimRefs:
