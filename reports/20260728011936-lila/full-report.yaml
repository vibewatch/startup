      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Financially, Lila screens as exceptionally well funded and strategically ambitious, but still pre-proof on
              the operating metrics that matter most. The upside case is easy to understand: a rare investor syndicate
              has already underwritten the buildout, the company is broadening from biotech into energy, semiconductors,
              and materials, and it is finally moving from stealth into first-customer commercialization. The downside
              case is just as visible. Fierce noted that Lila had not publicly released data supporting several
              breakthrough claims, and skeptical analysis argues that the model will work economically only if factory
              throughput, standardization, and customer conversion become measurable. Because the public record lacks
              revenue, realized pricing, gross margin, burn, utilization, and reference accounts, the next underwriting
              milestone is not another financing announcement. It is proof that the first cohort of customers converts
              into repeatable paid programs or software-plus-capacity contracts with acceptable unit economics. Until
              that evidence exists, the right financial stance is constructive on capital adequacy but cautious on
              revenue quality, margin path, and the speed with which a science-factory narrative becomes a real
              business.
