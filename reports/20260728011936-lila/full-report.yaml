      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Public adverse evidence argues against treating the autonomous-science category as already settled. The
              SLAS 2026 market map described at least 15 companies competing for the lab-operating-system layer, which
              means orchestration, integration, and closed-loop automation are fragmenting across many vendors. The
              Royal Society review is even more direct: self-driving labs can automate nearly the full scientific method
              in some settings, but true fully autonomous Level-5 AI scientists have not yet been realized. UChicago’s
              AI-advisor framing argues that leading practitioners still want humans sharing control, not disappearing
              from the loop. Northwestern’s megalibrary work shows another challenge specific to materials: massively
              parallel screening can outperform iterative self-driving-lab approaches for some discovery problems, so
              Lila’s materials thesis may face alternatives that are data-rich without using the same factory model. The
              implication is that Lila’s moat cannot rest only on saying it is vertically integrated or autonomous. It
              has to prove that cross-domain, closed-loop execution creates better economics or better discoveries than
              narrower therapeutic stacks, modular lab systems, or internal pharma programs. Until public customer,
              throughput, and outcome data appear, moat durability remains more strategic argument than demonstrated
              market lock-in.
