        title: Cost structure and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              The likely cost structure is visible even though the P&L is not. Lila is building AI Science Factories
              across multiple geographies, Reuters says it signed a 235,500-square-foot Cambridge lab lease, and current
              hiring materials show multi-site facilities leadership, large-budget capital planning, heavy-equipment
              moves, process gases, water and air systems, wastewater handling, and compliance workloads. Job boards
              simultaneously show aggressive hiring across frontier AI, lab operations, product, partnerships, and
              enterprise sales. Flagship’s AWS collaboration also points to meaningful cloud and compute spend alongside
              wet-lab capex and scientific labor. Put together, the model looks much more capital- and
              utilization-sensitive than a typical software startup. Public sources reviewed do not disclose gross
              margin, CAC, payback, retention, utilization, or cost-of-revenue detail, so investors cannot tell whether
              the company will earn software-like contribution margins or settle into a services-and-capacity business
              with higher fixed-cost absorption needs. The main proxy available publicly is directional: if factory
              utilization, rerun rates, and standardization do not improve quickly, the combination of leases,
              equipment, compute, and specialist staffing could weigh heavily on margins.
