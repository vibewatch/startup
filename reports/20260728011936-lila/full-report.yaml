companyProfile:
  summary: >-
    Lila Sciences is a Flagship Pioneering-built startup founded in 2023 and publicly unveiled in March 2025 to pursue
    what it calls scientific superintelligence. Its platform combines Lila Iris, scientific software, automated
    experimentation, robotics, and AI Science Factories to accelerate discovery across therapeutics, biotech, chemistry,
    and materials. Public evidence also shows an unusually large early financing base—$200M seed funding followed by a
    $350M Series A for $550M total capital—and a major Cambridge lab footprint. What remains missing from the public
    record is equally important: named paying customers, revenue, margins, and independent validation of how repeatable
    the scientific-output claims are at scale.
  foundedDate: '2023-01-01'
  founders:
    - name: Geoffrey von Maltzahn
      role: Co-founder and CEO
      background: >-
        Flagship Pioneering general partner and repeat biotech founder whose prior company-building record includes
        Generate:Biomedicines, Tessera Therapeutics, Quotient Therapeutics, Indigo Ag, Sana Biotechnology, and Seres
        Therapeutics.
      claimRefs:
        - CO009
        - CO010
  foundingLocation: Cambridge, Massachusetts
  headquarters: Cambridge, Massachusetts
  productSummary: >-
    Lila sells partner access to a closed-loop AI-for-science platform that can generate hypotheses, design and run
    experiments, and return validated data, assets, or technical roadmaps using its scientific models plus AI Science
    Factory lab infrastructure.
  customerFocus: >-
    Biopharma, biotech, chemicals, materials, energy, semiconductor, and other research-intensive organizations that
    need faster discovery cycles and do not want to build the full AI-plus-lab stack themselves.
  businessModel: >-
    Hybrid platform-access and scientific-services model: Catalyst provides access to Lila Iris, scientific experts, and
    Lab-as-a-Service capacity, while Creation runs end-to-end partner campaigns intended to output validated assets,
    data packages, IP, or new ventures.
  stage: Series A / pre-commercial
