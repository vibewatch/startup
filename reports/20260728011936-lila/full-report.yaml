      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Lila is not exit-ready on public evidence. The company may ultimately support a very large outcome if it
              becomes the infrastructure layer for scientific discovery across multiple verticals, but that is still a
              strategic ambition, not a disclosed operating profile. A clean recommendation change would require
              evidence that partner interest converts into paid programs, that the labs generate measurable productivity
              gains, and that the current valuation is not hiding preference or dilution overhangs that would impair
              future returns.


              The most important diligence work is therefore practical rather than philosophical. Investors need to see
              whether any customers are paying, how repeatable those programs are, what the output economics look like,
              and whether the company can package its technical claims into a validation set that a skeptical outsider
              can underwrite. They also need the capital-structure files: cap table, preference stack, option pool, and
              governance rights. Without those, even a correct top-line valuation call can still produce the wrong
              return.


              Thesis-break triggers are also clear. If 12 to 18 months pass with no customer disclosure, if Lila still
              cannot show reproducible technical evidence, or if public AI-drug comps suffer another leg down, the
              current premium should compress. Conversely, disclosed paid partners, benchmark data, and cleaner terms
              would justify revisiting the recommendation quickly.
            claimRefs:
              - CV010
