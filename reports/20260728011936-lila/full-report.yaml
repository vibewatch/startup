  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Closed-loop science engine and product surface
        blocks:
          - type: paragraph
            body: >-
              Lila's public product story is unusually concrete for a young scientific platform. The company presents
              Lila Iris as a scientific reasoning model trained on experiment-generated tokens, then surrounds that
              model with verifiers, scientific tools, compute, and AI Science Factories that can generate real-world
              reward signals. In other words, the public architecture is not a chatbot for scientists; it is a control
              plane for iterative discovery in which hypotheses, experimental design, execution, interpretation, and
              policy optimization feed one another. The buyer-facing layer translates that engine into two commercial
              motions. Catalyst is the platform-access offer: teams get direct access to Lila Iris, factory capacity,
              and scientific experts through a Lab-as-a-Service model that converts fixed laboratory capex into
              on-demand throughput. Creation is the outcome-oriented offer: Lila runs campaigns that generate validated
              assets, protocols, and data packages, with IP and de-risked roadmap output. That combination supports a
              diligence view of Lila as both software and discovery capacity provider rather than a pure-model vendor.
