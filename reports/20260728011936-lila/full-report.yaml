      - number: '7.2'
        title: Regulatory, biosecurity, and data-governance risk
        blocks:
          - type: paragraph
            body: >-
              The public record suggests Lila has website-level legal hygiene, but it does not yet show product-specific
              governance equal to the sensitivity of autonomous science in biology. That gap matters because once a
              platform moves from generic AI claims into biological experimentation, regulated health-data use, or
              synthetic-biology workflows, the burden shifts from “interesting AI company” to “company whose failure
              modes can trigger privacy, biosafety, and dual-use exposure.” NIST, NIH, HHS, EDPS, RAND, and the Johns
              Hopkins Center for Health Security all point in the same direction: frontier AI systems that touch
              sensitive data or biological workflows require explicit governance, trustworthiness controls, and in some
              settings containment or oversight procedures. Lila's privacy policy acknowledges GDPR, UK-DPA,
              cross-border transfer, and regulatory disclosure obligations, while its terms establish Massachusetts-law
              and warranty-disclaimer foundations. That is helpful but insufficient. Those documents govern a website,
              not an autonomous science platform deployed into partner programs. The public materials do not describe
              product-level data segregation, biosecurity screening, red-teaming, or audit processes. Given the
              company's stated interest in therapeutics and biology-adjacent work, that absence should be treated as a
              real diligence issue rather than as a paperwork backlog.
