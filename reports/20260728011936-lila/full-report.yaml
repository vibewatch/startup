      - number: '7.5'
        title: Monitoring, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The public record does show some early mitigation signals: legal and privacy pages exist, AI-safety roles
              are being hired, and management is pairing capital formation with platform and factory buildout rather
              than pretending commercialization is already solved. But the visible mitigations are still generic
              relative to the company's risk surface. They do not yet show product-specific governance, partner
              validation, or hard evidence that the same system can produce repeatable value across several scientific
              domains. For that reason, the investment posture should remain explicitly milestone-based. The near-term
              underwriting question is not whether Lila could become important; it is whether it can turn a large,
              expensive, multi-domain platform into narrow, externally validated proof before capital intensity and
              competitive pressure harden. The cleanest thesis-break criteria are therefore empirical: if the company
              still lacks named customer proof, externally credible benchmark data, or disclosed governance controls by
              the next major financing checkpoint, the risk profile should be treated as worsening rather than
              improving. Public ambition is abundant; public falsifiable evidence is still scarce.
