    title: Risk heatmap
    type: matrix
    layout: standard
    summary: >-
      Likelihood-versus-residual-severity view of Lila's main risks using only public evidence. The darkest cells
      concentrate on scientific-proof, commercialization, governance, and execution risks that remain poorly mitigated
      in the public record.
    data:
      columns:
