  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing, and commercial readiness
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Lila will monetize as a hybrid of software access, scientific-program revenue,
              and paid factory capacity rather than as a pure SaaS vendor. Official materials say the new capital is
              meant to bring the platform to customers and that a first cohort of commercial partners is being welcomed
              now. Reuters adds that Lila plans to sell enterprise software access to its AI models and automated labs,
              while Sacra describes a business model centered on project-based discovery programs with a future
              lab-as-a-service or usage-based layer. That combination is economically plausible for a company operating
              robotic wet labs across life sciences, materials, energy, and semiconductors, but it also means revenue
              quality is not yet proven. No reviewed official or market-data source disclosed list pricing, standard
              contract terms, ACV, revenue mix, or named paying customers. The result is a credible commercialization
              path with very weak public monetization disclosure: investors can see what Lila hopes to sell, but not yet
              the terms, customer proof, or repeatability that would let them underwrite recurring revenue quality.
