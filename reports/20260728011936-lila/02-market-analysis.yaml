- id: diligence-gaps
  title: Sizing and adoption diligence gaps that matter for valuation
  body: 'The main underwriting problem is not whether the market exists; it is whether Lila is monetizing the right slice
    of it. Public evidence does not support a clean, standalone TAM for autonomous labs or AI science factories. It supports
    adjacent funded categories that can be stitched into a commercialization thesis, with pharma and biotech as the most defensible
    first wedge and materials discovery as a strategically important but harder-to-size second wedge. That means valuation
    work needs bottom-up commercial evidence from Lila rather than more top-down market reports. The key asks are straightforward:
    current ACV by customer type, software-versus-automation-versus-services mix, implementation duration, renewal behavior,
    and evidence that customers actually expand from one workflow into a broader factory model. Without those data, a broad
    TAM can justify interest in the category but not conviction in Lila’s share capture or margin structure.'
