  summary: The most defensible market lens for Lila narrows from several adjacent funded categories toward a still-unsized
    autonomous-lab control layer.
  data:
    nodes:
    - label: Broad adjacent public categories
      detail: Lab automation, laboratory informatics, and AI drug discovery are all independently funded categories with 2025-2026
        market evidence.
      tone: positive
    - label: Integrated discovery stack
      detail: The relevant overlap is software, data, and automated execution bought together for repeated experimental loops.
      tone: neutral
    - label: Initial commercial SAM
      detail: Pharma, biotech, and selected CRO programs are the clearest first wedge because buyers, budgets, and productivity
        pressure are visible.
      tone: positive
    - label: Autonomous orchestration core
      detail: The innermost self-driving-lab layer appears strategically important but lacks a standardized standalone TAM
        in public data.
      tone: neutral
  approximationNotes: This pyramid is a scope lens rather than a revenue roll-up. It shows where public category evidence
