- id: sizing-lenses
  title: Sizing lenses, contradictory estimates, and evidence-constrained scope
  body: 'The public market evidence is good enough to establish category importance but not good enough to justify one headline
    TAM. Lab automation alone ranges from roughly US$2.7 billion in 2026 in FMI to US$12.12 billion in Business Research Insights,
    with MarketsandMarkets at US$6.60 billion and Precedence at US$8.91 billion. Laboratory informatics is narrower but still
    inconsistent, with Mordor at US$4.05 billion in 2026 and Business Research Insights at US$5.4 billion, while Grand View
    frames the category at US$4.1 billion in 2025 with a slower 4.9% CAGR through 2033. AI drug discovery is the smallest
    adjacent category by current revenue, but it is the fastest-growing one: Mordor puts the market at US$3.25 billion in
    2026 with a 25.94% CAGR to 2031, while Global Market Insights says the market exceeded US$3.1 billion in 2025 and will
    grow 30.5% annually through 2035. Those figures support a broad, adjacent market envelope in the low-teens billions of
    dollars, but they are not additive as a clean TAM because the same buyer can purchase all three layers. The more credible
    takeaway is that Lila is pursuing a fast-growing integration problem inside several already-funded categories, while the
    innermost autonomous-lab control layer remains publicly unsized.'
