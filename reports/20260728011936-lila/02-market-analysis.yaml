  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-sizing-variance
    missingEvidence: Publisher-level inclusion rules and methodology needed to reconcile why named lab automation, informatics,
      and AI-discovery markets differ so sharply.
    whyItMatters: Without methodology reconciliation, a single top-down TAM can overstate or understate Lila’s real addressable
      market by several turns.
    diligencePath: Ask management to show which external category definitions they use in planning and map those directly
      against customer workflows and current pipeline.
    relatedQuestionRefs:
    - QM007
    - QM027
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: autonomous-lab-tam
    missingEvidence: Independent 2026 revenue source that isolates autonomous or self-driving laboratory procurement as a
      standalone market.
    whyItMatters: The core differentiated layer in Lila’s story remains publicly unsized, which makes top-down valuation logic
      fragile.
    diligencePath: Request bottom-up customer counts, ACV, and expansion data for any production autonomous-lab deployments
      and avoid using a standalone TAM that public evidence does not support.
    relatedQuestionRefs:
    - QM008
    - QM027
  - type: private-evidence-only
    severity: material
    topic: sam-penetration
    missingEvidence: Customer counts, ACV, and vertical mix for Lila’s current deployments and pipeline.
    whyItMatters: Those data determine whether Lila is really selling into pharma-first budgets, materials programs, or broader
      enterprise software lines.
    diligencePath: Ask for customer-by-vertical pipeline, live deployments, expansion paths, and budget-owner map; compare
      those against the buyer segmentation in TM003.
    relatedQuestionRefs:
    - QM022
    - QM028
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Software-versus-automation-versus-services mix, implementation effort, and renewal behavior.
    whyItMatters: Margin structure and scaling logic differ materially depending on whether Lila is mainly software, systems
      integration, or high-touch scientific services.
    diligencePath: Request cohort-level gross margin, services attachment, deployment duration, and renewal metrics before
      underwriting valuation multiples.
    relatedQuestionRefs:
    - QM014
    - QM028
