tables:
- id: TM001
  title: Market definition table
  columns:
  - segment/category
  - included spend
  - excluded spend
  - buyer/payer
  - relevance
  rows:
  - - Lab automation hardware and workflow systems
    - Robotic arms, liquid handling, workstations, screening workflows, and workflow software used in discovery labs
    - Routine diagnostic operations, broad hospital automation, and generic manufacturing robotics
    - Platform R&D, screening, or lab-operations leaders; paid from central R&D or lab capex/opex budgets
    - Forms the physical execution layer of an AI science factory and is the best-sized adjacent category.
  - - Laboratory informatics and data backbone
    - LIMS, ELN, LES, cloud delivery, audit trails, data capture, workflow configuration, and interoperability layers
    - Generic enterprise data lakes, unrelated ERP/CRM systems, and non-lab analytics stacks
    - Lab informatics, quality, or digital-lab owners; paid from R&D software and compliance budgets
    - Critical because Lila needs structured data and orchestration, not just robots.
  - - AI drug discovery software and services
    - Target identification, molecular screening, repurposing, de novo design, and preclinical prioritization tools
    - Clinical-trial software, commercial analytics, and unrelated healthcare AI
    - Discovery informatics, translational science, or computational chemistry leaders; paid from discovery-program budgets
    - Best proxy for willingness to pay for model-led scientific acceleration.
  - - Autonomous / self-driving laboratory orchestration
    - Closed-loop experiment planning, execution, analysis, and re-planning across instruments and data systems
    - Single-purpose instrument control without learning loop or orchestration layer
    - Automation engineering or platform-science leadership; payer is usually central R&D
    - This is Lila’s most differentiated layer but also the least independently sized by public reports.
  - - Materials and chemistry discovery automation
    - High-cycle experimental programs in batteries, catalysts, polymers, specialty chemicals, and applied materials
    - Broad industrial process automation after R&D stage, routine QC-only spend
    - Advanced materials, formulation, or applied-research leaders; paid from innovation budgets
    - Strategically important adjacency where self-driving-lab literature is strongest.
  - - Status-quo substitute stack
    - Internal scripts, fragmented instruments, CRO work, human experiment design, and point solutions
    - N/A
    - Scientific team and lab managers absorb spend indirectly through people and vendor fragmentation
    - This is the practical displacement target; Lila rarely displaces one monolithic incumbent.
  notes: Included spend requires a repeated experimental loop where models, data, and automated execution are bought together;
    excluded spend sits outside that closed-loop discovery workflow.
