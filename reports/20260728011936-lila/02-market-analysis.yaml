slug: lila
runDate: '2026-07-28'
company:
  name: Lila Sciences
chapter:
  number: 2
  title: Market Analysis
  summary: 'Lila Sciences sits inside a real but definition-sensitive market stack rather than one clean category: lab automation,
    laboratory informatics, AI drug discovery, and emergent self-driving laboratory orchestration. Public 2025-2026 market
    data supports meaningful demand pools across those adjacent categories, but the estimates disagree sharply and the innermost
    autonomous-lab layer still lacks a standardized standalone TAM. The most defensible near-term serviceable market is therefore
    pharma and biotech R&D plus selected CRO and advanced materials programs that have repeated design-make-test-analyze loops,
    strong productivity pressure, and budgets that can justify integrating software, automation, and data infrastructure.'
sections:
- id: market-boundary
  title: Market boundary, included spend, and substitute stacks
  body: Lila Sciences should not be underwritten against a single generic “AI for science” TAM. The public evidence splits
    the relevant spend into adjacent layers. Lab automation reports focus on robotic systems, automated workstations, liquid
    handling, screening, and workflow software used in drug discovery, genomics, and diagnostics. Laboratory informatics reports
    cover the data and control backbone—LIMS, ELN, LES, cloud delivery, and compliance tooling. AI drug discovery reports
    describe software and services for target identification, screening, repurposing, de novo design, and preclinical prioritization.
    The self-driving-laboratory literature then describes a narrower, emergent orchestration layer that connects automated
    instruments, AI decision engines, and data systems in closed-loop experimentation. For Lila, included spend is the overlap
    where those layers are purchased together to accelerate discovery or process optimization. Excluded spend should include
    routine diagnostics operations, generic enterprise AI, full clinical-development or CRO service revenue, and broad industrial
    automation that does not sit inside an experimental loop. In practice, the status quo substitute is usually a fragmented
    stack of instruments, informatics, internal scripts, CRO work, and human-driven experiment planning rather than one direct
    incumbent product.
