chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与商业模式
        blocks:
          - type: paragraph
            body: >-
              Lila Sciences 把自己定位为科学超级智能公司，而不是普通 AI 实验室或单一产品的生物技术公司。官方材料持续把平台描述为一个 AI 系统：它能生成假设、设计实验、通过 AI Science
              Factory 的仪器运行实验，并实时从生命科学、化学和材料问题产生的数据中学习。尽调上，这一点重要，因为它的商业形态看起来是平台访问权：Lila
              在为外部科研项目搭自动化实验室和企业软件，而不是传统的内部疗法管线。Reuters 的报道也强化了这个定位：管理层希望 Lila
              平台上的合作伙伴和初创公司，把分子、材料或能源突破推进到下游开发。因此，第一章的运营结论是：Lila
              是前沿模型公司、机器人实验室运营商和发现基础设施供应商的混合体。公开材料有力支撑了使命和架构，但还没有给出量化收入、已命名客户或员工人数披露；即使融资故事已经很大，核心商业化指标仍部分不透明。
