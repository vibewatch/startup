      - number: '1.4'
        title: 里程碑、商业化与怀疑信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，Lila 正试图把戏剧性的资本故事转成可信的平台业务。2025 年 3 月发布确立了种子轮融资和公开使命。9 月 Series A 首次关闭、10
              月扩展融资随后抬高估值叙事；管理层也在官方融资公告中称，Lila 正欢迎首批客户，并向外部合作伙伴开放平台。Reuters 补充称，能源、半导体和药物开发公司都表现出兴趣，但也说 Lila
              不打算自己把产品一路推进到临床开发或大规模工业部署。这让模式相比完全一体化生物技术公司更轻资本，但证明点也转向合作伙伴转化和已验证案例研究。两条怀疑来源让风险更尖锐。Fierce Biotech
              指出，公司尚未公开发布支撑多项发现主张的数据；CNBC 则称，热度可能跑在现实前面，因为许多 AI 平台仍难以稳定超越传统研究模型。因此，近期尽调问题是：在估值叙事进一步跑到证据前面之前，Lila
              能否把科学超级智能话术转成外部可审计的结果。
