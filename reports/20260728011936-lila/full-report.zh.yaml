      - number: '2.2'
        title: 规模测算视角、互相矛盾的估算与证据约束边界
        blocks:
          - type: paragraph
            body: >-
              公开市场证据足以说明品类重要，但不足以支撑一个头条 TAM。仅实验室自动化一项，2026 年规模就从 FMI 的约 US$2.7B 到 Business Research Insights 的 US$12.12B
              不等，MarketsandMarkets 为 US$6.60B，Precedence 为 US$8.91B。实验室信息学更窄，但仍不一致：Mordor 预计 2026 年为 US$4.05B，Business
              Research Insights 为 US$5.4B；Grand View 则把 2025 年品类规模定在 US$4.1B，并给出到 2033 年 4.9% 的较慢 CAGR。AI
              药物发现按当前收入是最小的相邻品类，但增长最快：Mordor 认为 2026 年市场为 US$3.25B，到 2031 年 CAGR 为 25.94%；Global Market Insights 称 2025
              年市场已超过 US$3.1B，并将在 2035 年前按年 30.5% 增长。这些数字支持一个低十几亿美元量级的广义相邻市场外壳，但它们不能干净相加成
              TAM，因为同一个买家可能同时购买三层。更可信的结论是：Lila 正在几个已有预算的品类内部，追一个快速增长的集成问题；最内层的自主实验室控制层仍没有公开规模测算。
