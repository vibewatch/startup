        title: 收入模式、定价与商业就绪度
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Lila 的变现方式更像软件访问、科学项目收入和付费工厂产能的混合体，而不是纯 SaaS 供应商。官方材料称，新资本将用于把平台带给客户，公司正在欢迎第一批商业合作伙伴。Reuters
              补充称，Lila 计划出售企业软件访问权，让客户使用其 AI 模型和自动化实验室；Sacra 则描述了一种以项目制发现计划为核心、未来叠加 Lab-as-a-Service
              或按用量收费层的商业模式。对一家在生命科学、材料、能源和半导体领域运营机器人湿实验室的公司来说，这个组合在经济上说得通，但也意味着收入质量尚未得到证明。审阅到的官方或市场数据来源均未披露标价、标准合同条款、ACV、收入结构或已命名付费客户。结果是一条可信的商业化路径，但公开变现披露很弱：投资人能看见
              Lila 希望卖什么，却还看不见可用于承销经常性收入质量的条款、客户证明或可复现性。
