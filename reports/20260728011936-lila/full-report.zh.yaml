    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据支持的理由
      - 缓解方式 / 尽调问题
    rows:
      - - 一个通用 AI 科学工厂
        - Recursion / Exscientia 已经像一个全栈小分子对手
        - 高
        - Recursion 的自动化生物学加上 Exscientia 的自动化化学，是最接近的公开全栈疗法类比
        - 要求证明 Lila 的跨领域 stack 能带来优于疗法单一垂直平台的结果
      - - 跨领域范围具备独特价值
        - 买方可能更偏好药物发现、信息学或材料中的窄而经验证 stack
        - 高
        - 直接对手更窄但更清晰，模块化替代品也让买方只为所需层付费
        - 要求按买方类型和领域提供赢单 / 输单数据，证明跨领域宽度在商业上何处重要
      - - 自主执行创造持久锁定
        - 领先公开文献和研究人员仍偏好 human-in-the-loop 自主
        - 中
        - Royal Society 称 Level-5 全自主系统尚未实现，UChicago 提出共享控制
        - 要求提供无人值守周期、错误率以及人类必须介入的时点证据
      - - 封闭系统优于开放工具
        - Benchling、Opentrons 和 OpenBioML 提供反锁定替代方案
        - 高
        - 开放集成、模块化自动化和开放模型社区，削弱了单一供应商必须拥有整个 stack 的论点
        - 量化相对于模块化 stack 的切换成本和集成收益
      - - 数据飞轮很难复制
        - 大药企内部项目已经坐拥数十年实验室和临床数据
        - 高
        - Genentech 的实验室闭环和 NVIDIA 支持平台说明，具备规模的买方可以把数据和分发留在 内部
        - 要求证明外部客户能从汇聚式学习中获益，而这种学习效果无法在内部复制
      - - 材料科学自主化是清晰切入点
        - megalibraries 这类并行搜索平台，在某些材料工作流里可能跑赢迭代式自驱实验室
        - 中
        - Northwestern 认为，在某些材料问题上，megalibraries 生成数据和候选物的速度可能快过自驱实验室
        - 将 Lila 的材料工作流与 megalibrary 或高通量并行筛选替代方案做基准对比
      - - 实验室 OS 控制权会走向整合
        - SLAS 2026 证据显示，编排层已经拥挤，供应商很多
        - 高
        - Drug Discovery Trends 梳理出至少 15 家公司在争夺 AI 驱动实验室操作系统层
        - 说明 Lila 拥有哪些差异化层，能顶住编排层商品化
    notes: 严重程度衡量的是 Lila 竞争位置可能承受的压力，不是必然失败。多项威胁来自替代或分发风险， 而不是一对一功能替换风险。
