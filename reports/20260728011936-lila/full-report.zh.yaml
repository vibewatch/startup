  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 科学有效性与自主规模化风险
        blocks:
          - type: paragraph
            body: >-
              Lila
              的核心承诺异常激进：一个系统跨多个科学领域实时生成假设、设计并运行实验，再从新数据中学习。这个野心重要，因为核心失败模式不是普通软件失手，而是平台在内部循环中看似强大，一旦暴露给合作伙伴工作流、混乱的生物系统或长周期材料测试，却无法产出可复现、能说服外部的结果。今天的公开证据对野心的支持比对证明的支持更清晰。Lila
              自称在广泛科学任务上表现更好，但公开界面没有给出基准表、盲测对比或复现实验包。Fierce Biotech
              明确指出，几项醒目的技术主张仍缺少公开支持数据。因此，科学风险问题不是概念是否有趣，而是自主实验能否规模化，同时不优化到虚假代理指标、实验室特定伪影或隐藏人工脚手架。广度又放大了风险。Lila
              并未聚焦一个狭窄检测或边界清晰的垂直领域，而是同时谈疗法、化学和先进材料。每个领域都有不同的验证规范、错误成本和时间线。自动化可以加快迭代，但不会抹掉可复现性、校准或领域迁移风险。
