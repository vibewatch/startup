  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户地图与分层：ICP 很宽，但尚未形成广泛装机基础
        blocks:
          - type: paragraph
            body: >-
              截至 2026-07-28 的运行日期，Lila
              的公开客户故事仍主要是一张目标买方地图，而不是已验证账户名单。公司把自己包装成科学操作系统，可以服务“你的项目、你的科学家和你最重要的发现挑战”；解决方案页面把这个承诺拆成两种面向合作伙伴的动作：Catalyst
              提供平台访问和 Lab-as-a-Service，Creation 承接端到端项目，生成已验证资产，甚至孵化新公司。这个表述指向企业 R&D
              领导者、首席研究员、风险创建者和科学团队这些真实买家与用户。它并不指向自助产品，也不指向已经大规模部署的装机基础。最可能的最早用户是 Flagship 相关内部项目和少量定制化外部团队；Biopharma
              Dive 称 Lila 计划与其他 Flagship 初创公司和外部生物技术公司合作，Reuters 后来又称公司才刚开始向商业客户开放平台，这一点尤其支持该判断。
