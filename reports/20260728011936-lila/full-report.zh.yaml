      - number: '8.2'
        title: 融资背景、可比公司与 Flagship 溢价
        blocks:
          - type: paragraph
            body: >-
              今天给 Lila 估值，最好的方法不是收入倍数；收入未公开，公司也没有把自己包装成完全一体化的治疗业务。更合适的框架，是把三个可比集群做概率加权的里程碑定价：高溢价 AI 科学私募轮、Flagship
              平台型同业，以及公募 AI 药物公司的重估。上行参照里，Xaira 的 $1 billion 启动融资，以及 Isomorphic Labs 在 2025 年 $600 million 融资后又于 2026
              年完成 $2.1 billion 融资，说明私募市场一旦相信 AI 平台能成为基础设施，就会以异常规模资助品类领导者。Generate:Biomedicines 是更接近 Flagship
              风格的参照：仍然资本密集，但临床管线更可见，2020 年以来已融资近 $700 million。


              下行参照要苛刻得多。Recursion 经过多年平台建设、已上市并拥有多项合作，2026 年 6 月市值仍只有约 $2.01 billion；其 10-K
              还警告公司没有获批产品，并预计需要大量额外资金。Exscientia 的重估更陡：2021 年资金充足的 IPO 之后，2024 年以约 $688 million 合并；BioPharma Dive
              等报道强调，到那时 Recursion 和 Exscientia 都已失去大部分价值。这些公募结果并不当然说明 Lila 高估，但会限制投资人愿意为没有证据的叙事付多少钱。


              相对普通早期公司，Flagship 确实应有一定溢价，因为它能发起深技术团队、战略资本和品类叙事。但溢价不该无限。没有具名合作伙伴、已发表验证数据或单位经济，公开证据不足以支撑按 Lila
              已将平台承诺转化为持久、可重复现金流来定价。
