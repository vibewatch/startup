      - number: '7.5'
        title: 监控、缓释与推翻投资假设的触发条件
        blocks:
          - type: paragraph
            body: >-
              公开记录确实显示一些早期缓释信号：法律和隐私页面已经存在，公司在招聘 AI
              安全岗位，管理层把融资与平台、工厂建设绑定，而不是假装商业化已经解决。但相对于公司的风险面，能看到的缓释措施仍然偏通用。它们尚未展示产品级治理、合作伙伴验证，也没有硬证据证明同一系统能在多个科学领域产出可重复价值。因此，投资姿态应明确保持里程碑驱动。近期承销问题不是
              Lila
              能否变得重要，而是它能否在资本强度和竞争压力固化之前，把一个庞大、昂贵、多领域的平台压成狭窄且经外部验证的证据。最干净的推翻投资假设标准因此是经验性的：如果到下一次重大融资检查点，公司仍缺乏具名客户证据、外部可信的基准数据或已披露治理控制，风险画像应被视为恶化，而不是改善。公开雄心很多；公开、可证伪的证据仍然稀缺。
