        title: 横跨生命科学、化学和材料的领域项目
        blocks:
          - type: paragraph
            body: >-
              领域地图很宽，但围绕生命科学、化学和材料保持一致。Lila
              的疗法页面聚焦可编程基因药物、递送载体、抗体与配体工程，以及对效力、特异性、持久性、安全性和可制造性的协同优化。生物技术页面把同一逻辑延伸到构建体、宿主系统、表达平台、配方、试剂、检测和商业相关生产流程。化学与能源页面把同一运营模型推向催化剂发现、反应器选择、电催化剂、吸附剂、无稀土磁体、燃料和化学信息驱动的分离。先进材料页面又加入薄膜涂层和基础设施部件，强化了同一平台要在生物、化学和物理科学问题之间迁移的意图。官方页面持续强调真实实验、已验证或人工验证数据，以及在制造或商业对齐条件下运行，说明
