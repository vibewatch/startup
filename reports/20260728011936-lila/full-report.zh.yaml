      - number: '1.3'
        title: 资本基础、投资方与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Lila 从隐身状态切换成大额资本故事，速度很快。2025 年 3 月发布时带着 $200M 种子轮；9 月 Series A 首次关闭增加 $235M；10 月扩展融资把 Series A 推到
              $350M，总资本达到 $550M。Reuters、CNBC、Goodwin 及转载报道均把扩展后的估值放在 $1.3B 以上。投资阵容和金额一样关键：Flagship 仍居核心，Braidwell 和
              Collective Global 领投首次关闭，扩展融资又加入 NVentures、IQT、Analog Devices、Catalio 等投资方，拓宽了公司在
              AI、国防和工业邻近领域的触角。空间扩张同样激进。Reuters 及相关报道称，Lila 签下 Cambridge 235,500 平方英尺租约，被描述为 Boston 2025
              年最大实验室租约之一；Flagship 和后续媒体还指向 San Francisco 与 London 的进一步扩张。实体建设很重要，因为 Lila 的论点依赖自有自动化实验产能，而不只是训练更大的软件模型。
