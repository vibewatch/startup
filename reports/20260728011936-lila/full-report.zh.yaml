    rows:
      - - Lila Sciences
        - 参照公司 / AI 科学工厂
        - 上线时已承诺 $200M 种子资金；公开野心覆盖生命、化学和材料科学
        - 寻求一套自主发现 stack 的研究人员、药企和科学项目
        - 通用自主科学平台，跨多个领域覆盖从假设生成到实验执行
        - 公开材料未披露具名客户、吞吐量指标或商业定价
      - - Recursion / Exscientia
        - 直接集成型 TechBio 对手
        - 2024 年 Q2 合并现金约 $850M；上市公司平台；预计 18 个月内有约 10 个临床读数
        - 优先考虑 AI 赋能小分子发现和湿实验规模的 biopharma 团队
        - 规模化生物探索，加上 Exscientia 的精准化学和自动化合成
        - 公开叙事仍集中在小分子疗法，而不是更广泛的科学工厂领域
      - - Insilico Medicine
        - 直接 AI 药物发现对手
        - 平台覆盖靶点识别到 Phase II；按 2021 年销售额计，已与前 20 大药企中的 10 家合作
        - 希望获得 AI 发现疗法和可合作管线资产的 biopharma 团队
        - 明确的 A-to-Z AI 药物发现管线，带自动化和合作验证
        - 面向疗法的公开范围窄于 Lila 的跨领域自主性主张
      - - Isomorphic Labs
        - 前沿模型药物设计对手
        - Lilly 预付款 $45M，里程碑最高 $1.7B；2025 年新闻页列出 $600M 外部投资轮
        - 通过合作寻求 AI-first 分子设计的大型药企发现团队
        - 源自 AlphaFold 的数字生物学 stack 和顶级药企合作入口
        - 伙伴主导的商业模式清晰，但公开材料更强调药物设计，而不是自主湿实验执行
      - - Benchling
        - 相邻 / 基础设施替代品
        - 获 1,200+ biotech 组织信任；宣称有数千次实施
        - 正在数字化发现、临床前和工艺开发工作流的 R&D 组织
        - 已嵌入的信息学层，带 AI 工具、集成能力和端到端工作流支持
        - 不声称能自主运行科学方法，也不拥有完整湿实验闭环
      - - Arcadia Science
        - 开放科学替代品
        - 成立于 2021 年，拥有专门的研究、软件和实验室运营团队
        - 被开放工具、协议和社区导向研究资产吸引的科学家
        - 重新思考研究周期，同时把工具和 pipeline 回馈给社区
        - 开放科学姿态不等于工业化端到端自主执行
      - - OpenBioML + Opentrons
        - 开放 / 模块化 stack 替代品
        - OpenBioML 获工业级算力支持；Opentrons 销售可重新配置的自动化硬件
        - 希望把开放模型和灵活自动化拼起来、而不是购买单一封闭供应商 stack 的实验室
        - 开放协作、公开代码库和无锁定的模块化自动化
        - 需要集成工作，也没有呈现统一的发现 P&L 或经过验证的跨领域工厂
      - - 内部药企 AI 项目
        - 现状 / 内部自建替代品
        - Genentech 提到数十年的实验室和临床数据，以及 NVIDIA 支持的生成式 AI；AstraZeneca 引述显示自动化建立在中立基础设施上
        - 更愿意把发现能力留在内部的大型药企 R&D 组织
        - 数据、科学家、预算和分销已经嵌在买方组织内部
        - 资本和集成负担高，且不同药企公开细节不均衡
