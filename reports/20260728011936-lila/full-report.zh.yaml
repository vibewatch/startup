  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 直接挑战 AI 科学工厂论点的一体化对手
        blocks:
          - type: paragraph
            body: >-
              即使放在面向科学的 AI 领域，Lila 的公开叙事也异常激进。公司称自己在构建一个通用科学操作系统，可以跨生命、化学和材料科学，自主生成假设、设计实验、运行实验并从结果中学习。这让 Recursion 加
              Exscientia、Insilico Medicine 和 Isomorphic Labs 成为最接近的直接竞争组，但理由不同。Recursion
              已经把大型自有生物与化学数据集、自动化湿实验室和模型驱动设计结合起来；Exscientia 交易又加入精准化学和自动化合成，使其最接近全栈小分子药物发现对手。Insilico
              在疗法领域也明确是端到端模式，但其公开表述仍是 Pharma.ai 和从 A 到 Z 创建管线，而不是通用科学操作系统。Isomorphic
              同样偏前沿模型，并通过制药合作拥有强分发，但公开叙事仍是数字生物学和分子设计，而不是跨领域实验自主。因此，直接对手地图是真实的，但仍比 Lila 的主张更窄：大多数直接同行卖的是 AI 赋能的疗法发现，而
              Lila 主张的是横跨多个科学领域的自主科学工厂。
