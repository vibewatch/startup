            body: >-
              资本充足性是公开记录中最强的一项。Flagship 在 2025 年 3 月以 $200M 承诺种子资本推出 Lila；公司随后披露 9 月 Series A 首次关闭 $235M，10 月又追加
              $115M，把该轮推至 $350M，累计披露资本达到 $550M。Bloomberg 将 9 月估值定在约 $1.23B，Reuters 称扩展融资把 Lila 推到 $1.3B 以上，Forge 后来展示了
              $1.42B 的 Series A 估值快照。这套资金栈大幅降低了近期救急融资风险，也给 Lila
              留出建实验室、招聘和测试商业化的空间。但它并没有消除融资依赖。由于公开来源未披露收入、现金、烧钱速度、毛利率或客户集中度，投资人无法判断公司把资本转化为持久运营基础的速度。SEC 和 NASAA 针对 AVSF
              - Lila Sciences 2025, LLC 的 Form D 还显示，2025
              年融资过程中至少涉及一个馈线基金或联合认购工具，进一步说明该轮融资广泛且结构化，而不是简单的双边风险投资。审阅到的公开来源均未披露债务额度或项目融资义务。
