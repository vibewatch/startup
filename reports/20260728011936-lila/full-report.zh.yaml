      - number: '2.3'
        title: 买方、用户、付款方与初始可服务市场
        blocks:
          - type: paragraph
            body: >-
              最清晰的商业买方群体是制药和生物技术 R&D。Mordor 称，2025 年制药与生物技术公司占实验室信息学支出的 53.14%；Thermo Fisher 的 2024 年收入结构也显示，其 57%
              收入来自制药和生物技术客户。CRO 是下一个最相关的细分，因为它们明确出现在实验室自动化终端用户名单中，也是信息学增长更快的群体之一。学术与政府实验室对技术验证、方法开发和参考账户很重要——NIH 称其近
              US$48B 预算支持 2,500 多家机构的近 50,000 项竞争性资助——但这个采购基础分散，通常更难支撑完整的工厂式企业合同。材料、化学和工业 R&D
              具有战略重要性，因为自驱实验室文献在这些领域最强，Thermo 和 Agilent 也都强调先进材料和应用实验室流程；但公开市场报告并未清晰拆出这些项目。集成部署里的实际买方，通常是平台
              R&D、药物化学、筛选、自动化工程或实验室运营负责人；用户则是台架科学家、自动化工程师和计算科学家。付款方通常是中央 R&D 预算负责人，他需要用通量、周期压缩或可复现性来捍卫自动化支出，而不是单纯讲 IT
              现代化。
