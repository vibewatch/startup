      - number: '7.3'
        title: 商业化与竞争风险
        blocks:
          - type: paragraph
            body: >-
              即便 Lila
              的核心科学栈属实，商业化风险仍然很重，因为公司试图压缩的品类本身周期就很长。外部药物发现资料很直接：多数临床前项目进不了人体试验，临床获批率仍低，开发常常超过十年，总成本可能达到数十亿美元。先进材料商业化机制不同，结果相似：认证、集成和客户采用都要时间。因此
              Lila
              暴露在典型硬科技陷阱里——市场能验证可重复产品化之前，公司就先按平台承诺融资。公开商业化证据也很薄。管理层称正在欢迎首批客户，但客户名称、合同规模、收入和结果数据都未公开。与此同时，竞争集并不空。Recursion、Isomorphic
              Labs、Insilico、Absci 和 CuspAI 都在销售面向特定领域的证据、管线或专业技术定位。因此 Lila
              不只要击败科学领域的既有玩家，还要赢过那些能向投资人和买家讲出更简单故事的专业同行。多领域平台在 TAM 口径上可以显得更大，但到销售点上，仍可能输在聚焦、紧迫性和信任。
