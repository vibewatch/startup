      - number: '3.4'
        title: 护城河持久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              公开反向证据不支持把自主科学品类视为已经尘埃落定。SLAS 2026 市场地图显示，至少 15 家公司在争夺实验室操作系统层，意味着编排、集成和闭环自动化正分散到许多供应商手里。Royal Society
              的综述更直接：自驱实验室在某些场景中几乎可以自动化完整科学方法，但真正完全自主的 Level-5 AI 科学家还没有实现。UChicago 的 AI-advisor
              表述认为，领先实践者仍希望人类共享控制权，而不是从闭环中消失。Northwestern 的 megalibrary
              工作展示了材料领域的另一个挑战：在某些发现问题上，大规模并行筛选可以优于迭代式自驱实验室方法；因此，Lila 的材料论点可能面对数据丰富但不使用同一工厂模型的替代方案。含义是，Lila
              的护城河不能只靠“垂直一体化”或“自主”这个说法。它必须证明，跨领域闭环执行能比更窄的疗法技术栈、模块化实验室系统或制药内部项目带来更好的经济性或更好的发现。在公开客户、通量和结果数据出现之前，护城河持久性更像战略论点，而不是已经证明的市场锁定。
