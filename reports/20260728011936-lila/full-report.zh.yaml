    rows:
      - - 实验室自动化硬件和工作流系统
        - 发现实验室使用的机械臂、液体处理、工作站、筛选流程和工作流软件
        - 常规诊断运营、广义医院自动化和通用制造机器人
        - 平台 R&D、筛选或实验室运营负责人；由中央 R&D 或实验室 capex/opex 预算支付
        - 构成 AI science factory 的实体执行层，也是规模最接近的相邻类别。
      - - 实验室信息学和数据底座
        - LIMS、ELN、LES、云交付、审计轨迹、数据捕获、工作流配置和互操作层
        - 通用企业数据湖、无关 ERP/CRM 系统和非实验室分析栈
        - 实验室信息学、质量或数字实验室负责人；由 R&D 软件和合规预算支付
        - 关键在于 Lila 需要结构化数据和编排，不只是机器人。
      - - AI 药物发现软件和服务
        - 靶点识别、分子筛选、老药新用、从头设计和临床前优先级排序工具
        - 临床试验软件、商业分析和无关医疗 AI
        - 发现信息学、转化科学或计算化学负责人；由发现项目预算支付
        - 衡量市场为模型驱动科学加速付费意愿的最佳代理。
      - - 自主 / 自驱实验室编排
        - 跨仪器和数据系统的闭环实验规划、执行、分析和再规划
        - 没有学习循环或编排层的单一用途仪器控制
        - 自动化工程或平台科学负责人；付款方通常是中央 R&D
        - 这是 Lila 最差异化的一层，也是公开报告最少独立测算的一层。
      - - 材料和化学发现自动化
        - 电池、催化剂、聚合物、特种化学品和应用材料中的高周转实验项目
        - R&D 阶段后的广义工业流程自动化、仅限常规 QC 的支出
        - 先进材料、配方或应用研究负责人；由创新预算支付
        - 战略上重要的相邻领域，自驱实验室文献在这里最强。
      - - 现状替代栈
        - 内部脚本、碎片化仪器、CRO 工作、人工实验设计和点状方案
        - N/A
        - 科学团队和实验室经理通过人员和供应商碎片化间接吸收支出
        - 这是实际替代目标；Lila 很少直接替代一个单体巨头。
    notes: 纳入支出要求模型、数据和自动化执行在重复实验循环中一起购买；排除支出则位于该闭环发现工作流之外。
