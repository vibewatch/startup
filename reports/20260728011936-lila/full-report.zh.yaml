  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 闭环科学引擎与产品界面
        blocks:
          - type: paragraph
            body: >-
              对一家年轻科学平台来说，Lila 的公开产品故事异常具体。公司把 Lila Iris 描述为一个在实验生成 token 上训练的科学推理模型，再用验证器、科学工具、算力和 AI Science Factories
              包围该模型，让它产生真实世界奖励信号。换句话说，公开架构不是给科学家的聊天机器人，而是迭代式发现的控制平面：假设、实验设计、执行、解释和策略优化彼此反馈。面向买家的层面把这个引擎转成两种商业动作。Catalyst
              是平台访问产品：团队通过 Lab-as-a-Service 模式直接访问 Lila Iris、工厂产能和科学专家，把固定实验室 capex 转成按需通量。Creation 是结果导向产品：Lila
              运行项目，生成已验证资产、协议和数据包，并交付 IP 与降风险路线图。这个组合支持一种尽调判断：Lila 既是软件供应商，也是发现产能供应商，而不是纯模型供应商。
