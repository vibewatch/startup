      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Lila
              极其资金充足，战略野心也大，但最关键的运营指标仍处在证据前阶段。上行逻辑很好理解：罕见的投资人联盟已经为建设买单，公司正从生物技术扩展到能源、半导体和材料，并终于从隐身状态进入首批客户商业化。下行逻辑同样清楚。Fierce
              指出，Lila
              尚未公开发布支撑多项突破主张的数据；怀疑性分析则认为，只有工厂通量、标准化和客户转化变得可衡量，这个模式在经济上才跑得通。由于公开记录缺少收入、已实现定价、毛利率、烧钱速度、利用率和参考账户，下一项承销里程碑不是另一则融资公告，而是首批客户能否转化为可重复的付费项目或软件加产能合同，并具备可接受的单位经济。在证据出现之前，合适的财务立场是：认可资本充足性，但对收入质量、利润率路径，以及科学工厂叙事变成真实业务的速度保持谨慎。
