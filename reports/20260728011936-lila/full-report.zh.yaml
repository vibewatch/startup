      - number: '1.2'
        title: 创立故事、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Lila 的创立叙事与 Flagship Pioneering 绑定得异常紧。PR Newswire 和 Flagship 称，Lila 于 2023 年在 Flagship 的实验室成立，经过多年孵化后在
              2025 年 3 月公开发布；公司自己的发布说明也称，它在 Flagship 内部幕后搭建了约三年。Geoffrey von Maltzahn 是故事核心：Lila 和 Flagship
              都把他描述为连续公司创建者，履历横跨 Generate:Biomedicines、Tessera、Indigo、Sana、Seres 及相关公司。治理也仍然带有强赞助方色彩，因为 Noubar Afeyan 既是
              Flagship 创始人 / CEO，也是 Lila 的联合创始人 / 董事长。围绕 Geoffrey，公开领导班底比典型刚亮相的平台公司更强：Andrew Beam 托住 AI 科学可信度，Jawad
              Ahsan 补上规模化财务纪律，Chris Fussell 带来组织与国家安全运营经验，Julie Shah 增加机器人深度，Rafael Gómez-Bombarelli 强化化学 /
              材料覆盖。主要尽调风险不是缺少资深领导者，而是要弄清 Flagship 仍掌握多少实际控制权，以及这套治理结构在后续融资或商业化中能撑多久。
