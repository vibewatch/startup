          detail: 实验室自动化、实验室信息学和 AI 药物发现都是独立获得融资的类别，并且都有 2025-2026 年市场证据。
          tone: positive
        - label: 一体化发现技术栈
          detail: 真正的重叠区，是为了反复实验循环而一起采购的软件、数据和自动化执行能力。
          tone: neutral
        - label: 初始商业 SAM
          detail: 制药、生物技术和部分 CRO 项目是最清晰的第一切入点，因为买方、预算和生产力压力都可见。
          tone: positive
        - label: 自主编排核心
          detail: 最内层的自驱实验室能力看起来具备战略价值，但公开数据中尚无标准化的独立 TAM。
