      - number: '2.5'
        title: 对估值真正重要的规模与采用尽调缺口
        blocks:
          - type: paragraph
            body: >-
              核心承销问题不是市场是否存在，而是 Lila 是否正在变现正确的切片。公开证据不支持自主实验室或 AI 科学工厂的干净独立
              TAM。它支持的是相邻且已有资金的品类，可以被缝合成商业化论点；其中制药和生物技术是最能防守的第一楔子，材料发现则是战略重要但更难测算的第二楔子。这意味着估值工作需要 Lila
              提供自下而上的商业证据，而不是更多自上而下市场报告。关键要求很直接：按客户类型拆分的当前 ACV、软件 / 自动化 /
              服务组合、实施周期、续约行为，以及客户确实从单个工作流扩展到更广泛工厂模式的证据。没有这些数据，广义 TAM 可以证明品类值得关注，但不能支撑对 Lila 份额获取或利润率结构的确信。
            claimRefs:
              - CM018
              - CM019
              - CM039
