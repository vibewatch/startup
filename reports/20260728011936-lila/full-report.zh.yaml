      - number: '7.2'
        title: 监管、生物安全与数据治理风险
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，Lila 在网站层面的法律基础动作已经做了，但还看不出与生物学自主科学敏感度相匹配的产品级治理。这个缺口重要：平台一旦从泛 AI
              主张走进生物实验、受监管健康数据使用或合成生物学工作流，外界看的就不再是“有意思的 AI 公司”，而是“失败模式可能触发隐私、生物安全和双重用途风险敞口的公司”。NIST、NIH、HHS、EDPS、RAND 和
              Johns Hopkins Center for Health Security 的指向一致：触及敏感数据或生物工作流的前沿 AI 系统，需要明确治理、可信控制；在某些场景下还需要隔离或监督程序。Lila
              的隐私政策承认 GDPR、UK-DPA、跨境传输和监管披露义务，条款也搭好了 Massachusetts
              法律适用和保证免责声明基础。这有用，但不够。上述文件管的是网站，不是部署进合作伙伴项目的自主科学平台。公开材料没有说明产品级数据隔离、生物安全筛查、红队测试或审计流程。考虑到公司公开表达了对治疗和生物学相邻工作的兴趣，尽调应把这项缺失视为真实问题，而不是文书待办。
