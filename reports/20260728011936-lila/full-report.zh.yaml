      - number: '8.3'
        title: 乐观、基准与悲观估值框架
        blocks:
          - type: paragraph
            body: >-
              乐观情形取决于 Lila 从异常漂亮的融资观感走向可验证运营证据。也就是披露具名付费伙伴、展示可复现的技术基准或客户结果，并证明自主实验室能比传统团队创造显著更高的发现吞吐。如果这些信号出现，Lila
              可能合理拿到下一轮高溢价私募标记，约在 $2.3 billion 至 $3.0 billion 区间。即便如此，它仍低于 Isomorphic 已经达到的资本规模，也接近私募 AI
              科学投资人在没有公募市场检验时愿意出资的上沿。


              基准情形更温和，而且关键的是，它离当前估值近得让人不舒服。在该情形下，Lila 继续吸引强支持者和有限的合作伙伴试点，但披露的经济性不足以让估值决定性重估。如果资本市场保持建设性，约 $1.1 billion 至
              $1.6 billion 的估值区间可以支撑。这个区间意味着相对当前标记几乎没有安全边际，因为今天的价格已经折现了相当一部分未来证据。


              悲观情形是公募重估传导到私募市场：技术主张仍不透明，合作伙伴采用仍含糊，更广泛的 AI 药物发现板块继续提醒投资人，尚无 AI 发现药物获批，后期疗效仍未证明。在这种世界里，Lila 可能被迫重估至 $0.5
              billion 至 $0.9 billion，或出现降价轮。这三种情形的概率加权中点落在当前估值附近，这正是为什么类似股票投资的答案不是 Lila 不好，而是价格尚不宽厚。
