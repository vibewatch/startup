              Lila 的 ICP
              异常宽，但仍然自洽：它瞄准的是发现速度、实验通量和物理实验室集成比通用软件席位更重要的科学问题。疗法和生物技术页面强调基因药物、抗体、小分子、生物工艺、试剂和检测流程。化学品、先进材料和能源页面强调催化剂、吸附剂、涂层、磁体，以及在商业对齐条件下的工业测试。跨这些行业看，商业化路径也一致。Catalyst
