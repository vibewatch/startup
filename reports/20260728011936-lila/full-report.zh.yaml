              安全岗位。候选人隐私通知比营销页面更具体，列出基于角色的权限、传输与静态加密、异常监控，以及对第三方招聘工具的定期安全审查；通用隐私政策也提到技术和组织保障，以及按需访问控制。与此同时，审阅的公开材料没有列出产品级认证、受监管质量体系、公开正常运行时间目标，或
