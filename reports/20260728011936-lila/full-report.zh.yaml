            body: >-
              Lila 的运营模式依赖严肃的机器人与科学计算栈，公开记录给出了公司正在为此配人的可信证据。Julie Shah 领导机器人；Milad Abolhasani
              把自驱实验室、多模态分析和机器人专长带入化学项目；Rafael Gómez-Bombarelli 托住化学和材料的实验加物理驱动 AI；Kenneth Stanley
              覆盖开放式发现方法。招聘信号进一步强化了领导班底：Greenhouse 职位横跨生命科学基础模型、前沿能力、AI 安全、蛋白工程和 AI 数据；CareersInRobotics 职位则加入
              sim-to-real、MoveIt、LiDAR、SLAM、灵巧操作，以及 NVIDIA Isaac Sim 和 Omniverse。这足以推断公司有定制的实验室编排和仿真环境，但不足以重建确切硬件 BOM
