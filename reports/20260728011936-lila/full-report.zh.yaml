      - number: '8.4'
        title: 退出准备度、尽调问题与推翻投资假设的触发条件
        blocks:
          - type: paragraph
            body: >-
              以公开证据看，Lila
              尚未具备退出条件。如果公司成为跨多个垂直领域的科学发现基础设施层，最终可能支撑很大的结果，但那仍是战略雄心，不是已披露的运营画像。要清晰上调建议，需要看到合作伙伴兴趣转化为付费项目、实验室产生可衡量的生产率提升，以及当前估值没有藏着会损害未来回报的优先权或稀释包袱。


              最重要的尽调工作因此很实际，而不是哲学讨论。投资人需要看到是否有客户在付费，这些项目多可重复，产出经济性长什么样，公司能否把技术主张包装成一个怀疑者也能承销的验证集。他们还需要资本结构文件：股权表、优先权栈、期权池和治理权。没有这些，即便顶部估值判断正确，最终回报也可能错。


              推翻投资假设的触发条件也很清晰。如果 12 到 18 个月过去仍没有客户披露，如果 Lila 仍拿不出可复现技术证据，或公募 AI
              药物可比公司再下一台阶，当前溢价就应压缩。反过来，披露付费伙伴、基准数据和更干净的条款，将足以快速重看建议。
