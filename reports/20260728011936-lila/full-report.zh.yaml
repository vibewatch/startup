            body: >-
              即使 P&L 不公开，可能的成本结构已经看得见。Lila 正在多个地区建设 AI Science Factories；Reuters 称它签下 Cambridge 235,500
              平方英尺实验室租约；当前招聘材料显示，公司需要多地设施领导、大额资本规划、重型设备搬迁、工艺气体、水和空气系统、废水处理和合规工作。招聘网站同时显示，公司正在前沿
              AI、实验室运营、产品、合作伙伴和企业销售上大举招聘。Flagship 与 AWS 的合作也指向湿实验室 capex
              和科学人力之外的显著云与算力支出。合在一起，这个模式比典型软件初创公司更依赖资本和利用率。公开来源未披露毛利率、CAC、回本周期、留存、利用率或收入成本细节，投资人无法判断公司会赚到软件式贡献利润率，还是落入更需要吸收固定成本的服务加产能业务。公开可用的主要代理指标是方向性的：如果工厂利用率、重跑率和标准化不能快速改善，租约、设备、算力和专业人员组合会显著压低利润率。
