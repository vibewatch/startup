  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Lila 已完成 AI 原生科学领域最强的一组早期私募融资：先以 $235 million 首次交割，再以 $115 million 扩展轮把 2025 年 Series A 推到 $350
              million，累计融资达到 $550 million，最新披露估值超过 $1.3 billion。这样的资本形成很重要。它说明成熟投资人愿意为 Flagship
              孵化、异常宽的平台野心，以及自主实验室可在治疗、材料、化学和其他领域复利的可能性买单。单看融资，Lila 已经像优质资产，而不是常规 Series A 公司。


              问题在于，当前价格更多由辛迪加质量和平台可选性支撑，而不是公开披露的商业证据。Reuters 称 Lila 计划主要通过合作伙伴商业化，而不是自己推进分子；Fierce
              也指出，公司尚未公开发布支撑最强技术主张的数据。在审阅的来源中，仍没有具名付费客户、披露的经常性收入、披露的毛利率，也没有公开股权表条款。因此，即便当前标记可以理解，也很难称得上有吸引力。


              因此，我的建议是跟踪，不买入。信心中等，风险高。公开证据支持 Lila 是一个高质量融资故事，但尚未证明它是一个有吸引力的价格。当前估值看起来偏紧，而非不理性：它高于普通 Series A 定价，低于最激进的
              AI 科学私募融资，也容易在证据继续稀薄时遭遇类似公募市场的重估。
