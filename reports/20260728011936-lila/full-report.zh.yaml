      - number: '3.3'
        title: 分发力量与制药公司内部自建路径
        blocks:
          - type: paragraph
            body: >-
              Lila 最难打的竞争仗，可能不是原始技术野心，而是分发和准入。Isomorphic 的公开证据显示，它通过 Novartis、Lilly 和 Johnson & Johnson
              走合作伙伴路线，其中包括很大的里程碑经济。Recursion 和 Exscientia 也强调过由大型交易方组成、带里程碑潜力的制药合作组合；这意味着大型生物医药买家可以通过成熟联盟模式获得 AI
              赋能发现，而不必采用一个新的通用平台。Benchling 的客户证据又给出另一条路：大型 R&D 组织可以在中立软件和自动化层上升级内部科学运营，而不把控制权交给单一科学工厂供应商。Genentech
              自己的实验室闭环叙事让替代类别更尖锐。如果大型制药公司能把自有数据、内部科学家、湿实验室基础设施和外部算力或软件合作伙伴组合起来，那么分发优势就落在既有 R&D 组织内部嵌入式项目手里。在这个背景下，Lila
              的公开材料在商业化、外部客户和通量上仍相对不透明。这不推翻技术故事，但确实让它的商业化落地路径比周围那些重合作伙伴或内部自建替代方案更难看清。
