      - number: '7.4'
        title: 资本、招聘与执行风险
        blocks:
          - type: paragraph
            body: >-
              Lila 对一家如此年轻的公司而言已融到异常大的一笔钱，但公开证据显示，这笔钱买来的是尝试建设的权利，不是建设已在运营上去风险的证明。公司称将资金用于扩张 AI Science
              Factories、引入首批客户并吸引更多聪明人才。招聘足迹说明这件事有多宽：Greenhouse 招聘页仍有 AI
              安全、蛋白工程、前沿能力、细胞生物学自主科学、机器学习研究和技术项目管理等开放岗位。这些不是边缘招聘；任何想安全、规模化运行自主科学的公司都离不开这些核心职能。Cambridge、San Francisco 和
              London 的多站点布局进一步加重管理复杂度，尤其公司还同时横跨多个科学终端市场。由此形成熟悉的硬科技风险栈：前期支出重、验证周期长，执行瓶颈会通过招聘、协同、安全评审延迟或实体基础设施利用不足暴露出来。如果
              Lila 不能足够快地把资本转化为外部看得懂的科学和商业里程碑，下一轮融资可能会先于证据到来。
