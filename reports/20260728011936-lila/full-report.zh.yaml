      - number: '3.2'
        title: 模块化软件、自动化与开放科学替代方案
        blocks:
          - type: paragraph
            body: >-
              更危险的替代集合不只是直接的 AI 药物发现玩家。Benchling、Opentrons、OpenBioML 和 Arcadia 展示了 Lila 一体化论点之外的模块化路径。Benchling 提供企业 R&D
              软件、端到端流程跟踪、AI 工具、集成和实施规模，但并不声称自主运行科学方法。Opentrons 同样主打可重配置自动化，并明确强调摆脱封闭系统，因此它更像湿实验层替代品，而不是科学工厂运营者。OpenBioML
              在模型和社区层面扩展了替代地图：它的开放研究实验室定位、公开代码库和算力支持合作显示，生物 AI 的部分能力可以在开放生态中搭建，而不必塞进专有垂直栈。Arcadia
              则从另一侧推进，把工具、协议和软件管线发布回社区，同时尝试重想研究周期。单看这些努力，没有一个能复制 Lila
              的完整主张；合在一起，它们描绘出一条可行的自组装路径：买家把数据基础设施、自动化硬件以及开放或合作伙伴驱动的模型组合起来，而不是采用一个封闭工厂。
