companyProfile:
  summary: >-
    Lila Sciences 是 Flagship Pioneering 孵化的初创公司，成立于 2023 年，2025 年 3 月公开亮相，目标是打造其所谓的科学超级智能。平台把 Lila Iris、科学软件、自动化实验、机器人和
    AI Science Factories 组合起来，加速疗法、生物技术、化学和材料领域的发现。公开证据还显示，它早期融资基础异常雄厚：先有 $200M 种子轮，再有 $350M Series A，累计资本达到 $550M，并在
    Cambridge 拿下大面积实验室。公开记录同样缺少关键内容：已命名付费客户、收入、利润率，以及科研产出主张在规模化后能否反复成立的独立验证。
