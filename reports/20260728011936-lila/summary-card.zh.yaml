  topStrengths:
    - 早期资本基础和投资人质量异常强，包括 Flagship、Braidwell、Collective Global，以及 Nvidia 背书参与方。
    - 差异化的端到端 AI Science Factory 投资逻辑，把模型、机器人和自动化实验结合起来，而不是只做软件发现工具。
    - 创始人和科研团队水准高，具备深厚 Flagship 背景和前沿科学可信度。
    - 如果闭环平台证明可重复，在疗法、生物技术、化学和材料等领域上行空间很大。
  topRisks:
    - 目前没有公开收入、利润率、定价、利用率或具名付费客户数据支撑传统承销。
    - 公开科学证据仍薄于愿景和估值叙事，可重复性和可迁移性仍待验证。
    - Series A 阶段超过 $1.3B 的估值，给执行失误留下的安全垫有限。
    - 模式看起来资本密集，因为需要实验室基础设施、机器人、前沿 AI 人才和大量算力。
    - 生命科学和材料工作流里，监管、生物安全、知识产权和下游商业化交接风险仍显著。
  unresolvedGaps:
    - Lila 所称发现成果、基准胜出和吞吐经济性的独立验证仍有限。
    - 具名客户参考、定价、合同结构和经常性收入质量仍未披露。
    - 烧钱速度、现金跑道、毛利率和股权结构条款未公开。
    - AI Science Factories 能否在多个领域重复扩展且无需大量定制支持，证据仍不完整。
