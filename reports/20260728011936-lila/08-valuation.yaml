- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'THESIS: Lila is building a genuinely differentiated autonomous science platform'
    - Multi-domain positioning, AI Science Factories, and $550M of backing from elite investors
    - Independent validation data or named paying partners would strengthen this thesis materially
  - - 'THESIS: Flagship incubation supports an early premium'
    - Flagship has repeatedly built capital-intensive platform companies and can bring strategic capital
    - The premium should expand only if Lila proves commercial conversion, not just fundraising strength
  - - 'THESIS: Private-market appetite for AI science can still be very large'
    - Xaira and Isomorphic demonstrate that category leaders can raise at exceptional scale
    - Private appetite alone is not enough if public resets keep compressing ultimate outcomes
  - - 'ANTI-THESIS: Public proof is too thin for the current mark'
    - No named paying customers or revenue disclosure; Fierce notes no public data for key technical claims
    - A referenceable customer list and reproducible benchmarks would weaken the anti-thesis
  - - 'ANTI-THESIS: Public AI-drug comps have reset hard'
    - Recursion and Exscientia both lost most of their public value; Exscientia sold for about $688M
    - A durable public rerating or clear private proof would soften this warning
  - - 'ANTI-THESIS: Sector economics remain unproven'
    - No AI-discovered drug approval and late-stage efficacy remains the investor bottleneck
    - Late-stage wins or approved products would justify paying a larger premium
