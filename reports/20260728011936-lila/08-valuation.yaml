- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - No named paying customers
    - No customer disclosure by the next material financing or within 12-18 months
    - Platform optionality remains narrative rather than commercial proof
    - Do not average up; assume premium should compress
  - - No public technical validation
    - Still no reproducible benchmark data or partner case study at next diligence cycle
    - Scientific moat remains unverified and harder to monetize
    - Move the valuation case toward bear
  - - Sector re-rating
    - Another material drawdown in public AI-drug comps or comparable private down-round
    - Private appetite may no longer support today's premium
    - Re-underwrite with public-reset haircuts
  - - Adverse terms or overhang
    - Preference stack, governance terms, or dilution prove harsher than expected
    - Return profile can break even if the headline valuation holds
    - Pause until capital-structure risk is understood
