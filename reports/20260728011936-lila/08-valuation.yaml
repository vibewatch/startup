- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Commercial proof
    - Named customers, contract values, renewals, and partner references
    - Need to know whether platform interest converts into repeatable revenue
    - Management and customers; request reference calls and contract summaries
  - - Lab economics
    - Throughput, cost per experiment, success rates, and failure modes
    - Determines whether AI Science Factories compound or simply absorb capital
    - Ops review; request KPI time series and cohort analysis
  - - Technical validation
    - Reproducible benchmarks and third-party case studies
    - Current premium depends on a measurable moat, not just a narrative
    - Science diligence; request data room packet and replication evidence
  - - Capital structure
    - Cap table, liquidation preferences, option pool, and governance rights
    - Headline valuation can misstate actual investor outcome by a wide margin
    - Legal diligence; request term sheets and waterfall model
  - - Comparable precision
    - Broker or management-confirmed private marks for Xaira and Isomorphic
    - Helps tighten premium and discount assumptions in the comp set
    - Secondary data vendors, brokers, and management discussions
