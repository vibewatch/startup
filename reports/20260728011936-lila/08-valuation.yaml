  evidenceGaps:
  - type: missing-source
    severity: material
    topic: commercial-proof
    missingEvidence: Named paying customers, contract value, renewal evidence, and any recurring software or platform revenue.
    whyItMatters: The current mark assumes the platform is commercially useful, but public evidence stops at interest and intended customer opening.
    diligencePath: Request signed customer summaries, cohort economics, and at least one referenceable partner case study.
    relatedQuestionRefs:
    - QV023
    - QV026
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Current cap table, liquidation preferences, option pool, and any investor protections tied to the Series A and seed.
    whyItMatters: Return math can change materially even if the headline post-money valuation stays constant.
    diligencePath: Request the latest cap table, Series A term sheet, pro forma ownership, and waterfall model from counsel.
    relatedQuestionRefs:
    - QV024
    - QV026
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Experiment throughput, success rates, cost per validated output, and partner gross-margin contribution for AI Science Factories.
    whyItMatters: Without unit economics it is hard to separate a durable scaling advantage from capital-intensive burn.
    diligencePath: Request operating KPI time series for each lab, per-program cost curves, and failure-mode analysis.
    relatedQuestionRefs:
    - QV025
    - QV026
  - type: missing-source
    severity: material
    topic: private-comps
    missingEvidence: Precise post-money valuations and terms for Xaira and Isomorphic private rounds that are comparable to Lila's current stage.
    whyItMatters: Funding amounts alone show appetite, but valuation precision matters for premium or discount selection in the comp table.
    diligencePath: Use brokered secondary data, direct management disclosure, or investor-mark materials to tighten private comp math.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV004
  - type: missing-source
    severity: material
    topic: technical-validation
    missingEvidence: Reproducible public benchmark data or partner case studies validating Lila's claimed discoveries and model advantage.
    whyItMatters: The financing premium assumes a technical moat, but the public record is still mostly narrative rather than measured output.
    diligencePath: Request a validation packet with benchmark design, error bars, third-party replication, and named partner feedback.
    relatedQuestionRefs:
    - QV009
    - QV026
