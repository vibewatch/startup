- id: scenario-framing
  title: Bull, base, and bear valuation framing
  body: |-
    The bull case depends on Lila moving from extraordinary financing optics to verifiable operating proof. That means disclosing named paid partners, showing reproducible technical benchmarks or customer outcomes, and demonstrating that autonomous labs can create materially better discovery throughput than conventional teams. If those signals appear, Lila could plausibly earn the next premium private mark in the roughly $2.3 billion to $3.0 billion range. That would still leave it below the capital scale already seen at Isomorphic and near the upper end of what private AI-science investors have funded without a public-market check.

    The base case is more modest and, importantly, sits uncomfortably close to the current valuation. In that scenario, Lila continues to attract strong backers and limited partner pilots, but does not disclose enough economics to re-rate decisively. A valuation range around $1.1 billion to $1.6 billion is supportable if capital markets remain constructive. That range implies little margin of safety from the current mark because today's price already discounts a meaningful amount of future proof.

    The bear case is a public-reset import into private markets: technical claims remain opaque, partner uptake stays vague, and the broader AI drug discovery sector keeps reminding investors that no AI-discovered drug has yet won approval and that late-stage efficacy remains unproven. In that world, Lila could be forced into a $0.5 billion to $0.9 billion re-rate or down-round. The probability-weighted midpoint of these cases lands near the current valuation, which is exactly why the stock-like answer is not that Lila is bad, but that the price is not yet generous.
