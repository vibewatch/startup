  evidenceGaps:
    - type: missing-source
      severity: material
      topic: benchmark-gap
      missingEvidence: >-
        Independent FLUX 3 benchmark results with methodology, comparison set,
        sample sizes, failure cases, and reproducible evaluation artifacts.
      whyItMatters: >-
        Company capability claims cannot establish relative model quality,
        latency, consistency, or cost without comparable testing.
      diligencePath: >-
        Obtain the promised benchmark package and rerun representative image,
        video, audio, and action workloads against named alternatives.
      relatedQuestionRefs: [QE005, QE006, QE009]
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: >-
        API uptime history, latency distributions, capacity limits, support
        response times, incident postmortems, and enterprise SLA performance.
      whyItMatters: >-
        Production readiness and integration cost cannot be judged from product
        availability or named integrations alone.
      diligencePath: >-
        Review twelve months of status and incident data, SLA reports, support
        metrics, and three production-customer architecture references.
      relatedQuestionRefs: [QE004, QE007]
    - type: missing-source
      severity: material
      topic: safety-controls
      missingEvidence: >-
        Detailed model and API safety evaluations, privacy controls, training
        data governance, misuse monitoring, red-team coverage, and certifications.
      whyItMatters: >-
        Open-weight and hosted deployments expose different abuse, compliance,
        privacy, and enforcement risks that a general safeguards statement
        cannot resolve.
      diligencePath: >-
        Request model cards, system cards, red-team reports, data-governance
        documentation, control mappings, incident logs, and external audit results.
      relatedQuestionRefs: [QE007]
    - type: missing-source
      severity: minor
      topic: developer-ecosystem
      missingEvidence: >-
        Current repository activity, release cadence, contributor counts,
        package or model downloads, and retained-developer usage.
      whyItMatters: >-
        An investor's qualitative popularity statement does not quantify the
        durability or breadth of developer adoption.
      diligencePath: >-
