  topStrengths:
    - Research-heavy founding team and sustained FLUX product-release cadence.
    - Multiple deployment modes spanning hosted APIs, enterprise access, and open weights.
    - Large Series B and broad platform-integration signals support commercial reach.
  topRisks:
    - Audited revenue quality, gross margin, retention, concentration, cash, burn, and runway are undisclosed.
    - Compute intensity and rapid feature convergence may compress differentiation and margins.
    - Legal, privacy, copyright, model-safety, incident, and reliability controls lack primary evidence.
    - Headline integrations and downloads do not establish durable paid adoption or switching costs.
  unresolvedGaps:
