      Audited monthly revenue by product and customer, ARR definition, gross margin after inference costs, retention,
      realized pricing, and channel economics.
    - Cash on hand, monthly burn, runway, debt, GPU-financing obligations, and committed infrastructure spend.
    - >-
      Top-customer concentration, contract duration, renewal terms, and current production status for named platform
      relationships.
    - Primary legal, privacy, copyright, security, incident, model-safety, SLO, and disaster-recovery records.
    - >-
      Fully diluted capitalization, liquidation preferences, board rights, founder attribution, voting control, and
      succession coverage.
    - >-
      Independent comparable benchmarks and normalized private-market transactions supporting performance durability and
      the $3.25 billion financing reference.
