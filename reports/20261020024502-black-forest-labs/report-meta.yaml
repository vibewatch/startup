companyProfile:
  summary: >-
    Founded in 2024 and headquartered in Freiburg, Black Forest Labs converts research pedigree in latent-diffusion
    image generation into a broad FLUX product family distributed through hosted APIs, a browser playground, enterprise
    arrangements, and selected open weights. The company has moved rapidly through major model releases and a large
    Series B, while its operating economics, customer durability, governance, and control environment remain materially
    less transparent than     its product and financing record.
