      - number: '3.3'
        title: 可观察的价格证据有限；分发既可能形成锁定，也可能带来依赖
        blocks:
          - type: paragraph
            body: >-
              指定资料中的公开价格证据仅包括 SiliconFlow 供应商对三种早期 FLUX 版本的报价，每张图 $0.015 至 $0.06。这是转售商目录价，不是 BFL
              实现的收入、企业合同价格或当前全市场比较。缺少直接可比的竞争者价格，无法可靠断言 BFL 更便宜或更贵。分发证据更强但有两面性：Northzone
              描述开发者采用，多份来源确认与大型创意及科技平台的集成或关系。深度集成可提高客户切换成本，但若平台捆绑自有模型或转移需求，BFL 仍可能受制。合同期限、最低承诺、排他性和集中度在本资料池中均未公开。
