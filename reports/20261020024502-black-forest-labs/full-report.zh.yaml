  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合不止模型供应商
        blocks:
          - type: paragraph
            body: >-
              买方可以从 Midjourney 等直接产品获得视觉生成，也可以通过 API 嵌入基础模型、在自有基础设施运行开放权重、在现有创意平台内使用生成能力，或保留大体手工的创意栈。Black Forest Labs
              覆盖的路径多于单一界面产品：其产品形态包括 API、开放权重、企业和 Playground 访问。对重视部署选择的技术买方，这种广度是优势；但 BFL
              也同时面对模型实验室和掌控终端工作流的平台竞争。Adobe、Canva 和 Meta 出现在 BFL 关系描述中，说明同一家公司可能既是客户、渠道，也可能拥有议价能力。Google、Meta 和 OpenAI
              等大型实验室可借助现有产品分发竞争能力，仍是可信的潜在进入者。
            claimRefs:
              - CP001
              - CP007
              - CP009
