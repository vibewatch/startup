            - API
            - Developer integration
        - id: self-deploy
          label: 自行部署
          detail: 技术团队可以在自有基础设施上运行和定制开放权重。
          touchpoints:
            - Open weights
            - Fine-tuning
            - Local deployment
        - id: enterprise
          label: 企业采用
          detail: 大型组织可以寻求规模化、定制和商业许可。
          touchpoints:
            - Enterprise agreement
            - Procurement
        - id: expand
          label: 扩大使用
          detail: 成功部署可能扩展到更多产品或团队，但公开的用户群证据缺失。
          touchpoints:
            - Additional workloads
            - Custom deployment
    approximationNotes: 该序列代表可用的采用界面，不是观测到的转化率；未找到公开的漏斗分母或留存用户群。
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU012
      - CU013
      - CU016
  - id: FR001
    title: 风险热力图：基于证据的剩余风险视图
    type: matrix
    summary: 情景影响与已观测概率分开处理；未知单元格代表尽调阻塞点，不代表假定安全。
    data:
      columns:
        - label: 概率证据
          detail: 对发生率或成熟度的观测支持；未知不等于零。
        - label: 情景影响
          detail: 失败发生时对投资的条件性影响。
        - label: 缓解成熟度
          detail: 仅纳入指定来源中描述的缓解措施。
        - label: 剩余风险
          detail: 受所列缺口约束的缓解后评估。
      rows:
        - label: 监管 / 法律状况
          note: 没有指定主要监管机构、法院、隐私或详细合规来源。
          values:
            - label: Unknown
              tone: warning
            - label: 不利时为高
              tone: risk
            - label: 尚未建立
              tone: risk
            - label: 高不确定性
              tone: risk
        - label: 发布成熟度
          note: FLUX 3 能力被描述为分阶段推出，视频仍处于早期访问。
          values:
            - label: 已观察到转变
              tone: warning
            - label: 高
              tone: risk
            - label: 反馈 + 安全测试
              tone: neutral
            - label: 中高
              tone: warning
        - label: 服务可靠性
          note: API 规模是公司说法；公开的 SLO 和事故证据缺失。
          values:
            - label: Unknown
              tone: warning
            - label: 高
              tone: risk
            - label: 自托管选项
              tone: neutral
            - label: 中高
              tone: warning
        - label: 团队执行
          note: 公开员工人数数据存在冲突，同时招聘和业务范围都在扩大。
          values:
            - label: Unknown
              tone: warning
            - label: 中高
              tone: warning
            - label: 有融资支持的招聘
              tone: neutral
            - label: 中高
              tone: warning
        - label: 资本密集度
          note: 融资已披露，但现金、消耗速度、资金续航和算力义务未披露。
          values:
            - label: Unknown
              tone: warning
            - label: 高
              tone: risk
            - label: $300M 融资
              tone: neutral
            - label: 核实前为高
              tone: risk
        - label: 合作伙伴集中度
          note: 已点名若干集成，但没有收入或合同集中度数据。
          values:
            - label: Unknown
              tone: warning
            - label: 集中时为高
              tone: risk
            - label: 多渠道访问
              tone: neutral
            - label: 中高
              tone: warning
    approximationNotes: 定性矩阵；指定证据中没有事故概率、货币敞口或控制有效性评分。
    claimRefs:
      - CR005
      - CR010
      - CR013
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 观察到的产品执行和融资势头，在形成继续研究建议前，会先经过耐久性和披露缺口的筛选。
    data:
      nodes:
        - id: technical-proof
          label: 技术证明
          detail: FLUX 3 和 FLUX 3 Image Klein 延续了 2026 年的发布节奏。
        - id: distribution
          label: 分发信号
          detail: API、开放权重、企业渠道和 Playground 形成多条采用路径。
        - id: financing
          label: 融资参考
          detail: $300M B 轮融资，投后估值 $3.25B。
        - id: durability-test
          label: 耐久性测试
          detail: 功能趋同和资本密集度可能侵蚀模型层面的定价能力。
        - id: evidence-gap
          label: 估值证据缺口
          detail: 经审计的经济性、股权结构表条款、集中度和可比公司数据不可得。
        - id: recommendation
          label: 继续研究
          detail: 跟踪执行，但不要把最新估值视为经过独立验证的公允价值。
      edges:
        - from: technical-proof
          to: distribution
        - from: distribution
          to: financing
        - from: financing
          to: durability-test
        - from: durability-test
          to: evidence-gap
        - from: evidence-gap
          to: recommendation
    approximationNotes: 仅为概念性决策链；节点顺序不代表定量权重、转化率或概率。
    claimRefs:
      - CV005
      - CV006
      - CV010
      - CV013
      - CV014
