        title: 控制能力与工作流集成决定产品取舍
        blocks:
          - type: paragraph
            body: >-
              BFL 当前最可守住的位置，不是单一基准领先，而是托管访问与客户自主部署的组合。2026 年 10 月开放权重发布称 FLUX 3 Image Klein 可在消费级 GPU 和笔记本上运行，完整产品形态还支持
              API 和企业使用。独立评测将这种灵活性与 Midjourney 更强的成品体验和社区作对比，并提醒本地部署仍需要可观 GPU 能力。新兴 FLUX 3
              还覆盖图像、视频、音频和动作预测，可能让竞争基础超出图像质量。不过，现有资料没有独立受控基准把这些能力与所有主要替代方案比较，因此下图是有证据支撑的部署控制与工作流覆盖序位视图，不是性能排名。
