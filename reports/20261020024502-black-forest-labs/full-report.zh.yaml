  - id: FI001
    title: 商业路径与利润泄漏点
    type: flow
    summary: BFL 可以通过托管使用、自托管许可和平台合同实现分发变现，但算力成本仍是未解决的毛利润约束。
    data:
      nodes:
        - id: open-weights
          label: 开放权重采用
          detail: 开发者和企业在客户控制的基础设施上部署。
        - id: enterprise-license
          label: 企业许可
          detail: 年度商业许可路径；公开的实际价格不可得。
        - id: direct-usage
          label: API 和 Playground 使用
          detail: 直接试验和生产工作负载，按图像或百万像素计价。
        - id: usage-fees
          label: 托管使用费
          detail: 收入随按量计费的生成量增长，但会受到折扣和结构的影响。
        - id: platform-demand
          label: 平台集成
          detail: 大型合作伙伴将 FLUX 嵌入下游产品和工作流。
        - id: strategic-contracts
          label: 多年期合同
          detail: 据报道的合同价值需要补上收入确认和集中度桥接。
        - id: compute-cost
          label: GPU 和云成本
          detail: 训练和推理敞口可能挤压毛利率。
        - id: gross-profit
          label: 毛利润
          detail: 根据留存证据无法量化。
      edges:
        - from: open-weights
          to: enterprise-license
        - from: direct-usage
          to: usage-fees
        - from: platform-demand
          to: strategic-contracts
        - from: usage-fees
          to: gross-profit
        - from: enterprise-license
          to: gross-profit
        - from: strategic-contracts
          to: gross-profit
        - from: compute-cost
          to: gross-profit
    approximationNotes: 图示展示的是机制而非收入比例；没有公开的收入结构、利润率或转化率可供推断。
    claimRefs:
      - CI001
      - CI011
      - CI015
