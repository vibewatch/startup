        title: 图表与证据
        blocks:
          - type: callout
            title: 采用证据不等于市场规模
            body: 下载、集成、合作和早期访问测试者证明了触达，但各自人群不同且付费转化率未知，不能据此建立 TAM、市场份额、经常性收入或可服务可获得市场。
            calloutType: risk
