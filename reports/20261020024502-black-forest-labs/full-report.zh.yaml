  - id: FP001
    title: 序数竞争定位：部署控制与工作流触达
    type: quadrant
    summary: BFL 位于差异化的高控制力位置，但在位平台和直接产品仍拥有工作流分发优势。
    data:
      points:
        - label: Black Forest Labs
          x: 5
          'y': 4
          detail: API、开放权重、企业访问，以及广泛的多模态方向。
        - label: Midjourney
          x: 1
          'y': 4
          detail: 有证据支持其成品和社区；本地控制力没有证据。
        - label: Stable Diffusion / 开放生态
          x: 5
          'y': 2
          detail: 部署控制力高，但集成和运营由买方负责。
        - label: Adobe / Canva 工作流
          x: 2
          'y': 5
          detail: 工作流位置强；部署控制力证据不完整。
        - label: 大型模型实验室
          x: 2
          'y': 5
          detail: 分发实力是核心威胁；当前功能平价尚未测试。
        - label: 内部自建 / 手工现状
          x: 5
          'y': 1
          detail: 流程控制力最大，但封装后的工作流触达最低。
    approximationNotes: 分析师编制的 1 到 5 序数评分，不是实测基准。X 轴代表买方部署控制力，Y 轴代表封装后的工作流或分发触达；评分仅使用留存的定性证据，并保留未经支持的比较缺口。
