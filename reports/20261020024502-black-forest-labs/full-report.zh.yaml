      - - 版权、训练数据与模型许可
        - 训练、分发、定制和下游使用
        - 开放权重和定制已有记录；来源、许可执行和索赔历史没有记录
        - Unknown
        - 可能很高；没有一手法律证据无法排序
        - 指定来源没有建立具体缓解措施
        - 证据不确定性高
        - 获取训练数据治理、许可清单、赔偿条款、下架流程、未决索赔和外部律师意见
    notes: 该登记表仅基于截至 2026-10-20 指定的预取证据；情景严重性是有条件的，未知的可能性不按零处理。
    enumerationScope:
      coverage: partial
      basis: >-
        Material legal and regulatory risk classes visible from the assigned source pool; not an exhaustive
        jurisdictional search.
    claimRefs:
      - CR009
      - CR011
      - CR012
      - CR016
  - id: TR002
    title: 运营、质量与安全风险登记表
    columns:
      - 失效模式
      - 可能性证据
      - 情景严重性
      - 缓解成熟度
      - 剩余敞口
      - 未解决证据
    rows:
      - - 早期访问能力无法达到可靠的生产成熟度
        - 观察到分阶段推出和早期访问定位
        - 若持续存在，则对企业采用为高
        - 部分：已描述反馈和安全测试
        - 中高
        - 发布标准、生产使用情况、缺陷率、回滚历史和客户验收
      - - 托管 API 的容量、延迟或可用性无法满足企业要求
        - 公司声称 API 达到生产规模；未提供 SLO 或事故记录
        - 若嵌入客户工作流，则为高
        - 部分：开放权重提供自行托管的替代方案
        - 中高 / 未量化
        - SLO 达成情况、容量计划、状态历史、灾难恢复和按基础设施提供商划分的集中度
      - - 开放权重被滥用或下游定制不安全
        - 开放定制和独立部署已有记录
        - 在不利的滥用或绕过控制情景下为高
        - 部分：公司称发布包含安全护栏和支持工具
        - 高 / 控制有效性未知
        - 滥用测试、安全护栏绕过率、许可执行、漏洞处理和下游监测
      - - 团队产能或关键人员依赖限制交付
        - 公开资料中的员工人数互相矛盾，为 34 人和 70 人；公司计划继续招聘
        - 若多模态范围超过人员配置，则为中高
        - 发展中：融资部分用于招聘和基础设施
        - 中高
        - 当前组织架构、人员流失、关键负责人地图、招聘计划、继任覆盖和运营节奏
    notes: 可能性和剩余风险标签是基于引用的推出、分发、安全护栏、人员配置和融资证据作出的分析判断；缺失的运营指标仍明确列出。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR005
      - CR006
      - CR007
      - CR009
      - CR010
      - CR011
      - CR012
      - CR014
  - id: TR003
    title: 合作伙伴、平台与财务依赖风险登记表
    columns:
      - 依赖项
      - 交易对手 / 角色
      - 集中度证据
      - 失效情景
      - 情景严重性
      - 缓解措施
      - 剩余敞口
      - 尽调路径
    rows:
      - - 托管服务和计算容量
        - 为 API 和模型开发提供支持但未披露的基础设施提供商
        - 未披露
        - 容量、成本或提供商条款使服务无法可靠且经济地运行
        - 高
        - 开放权重允许部分客户独立部署
        - 在提供商组合和经济性明确前为高
        - 获取提供商合同、已承诺支出、容量预留、单位成本曲线、冗余安排和终止权
      - - 企业集成与市场进入合作伙伴
        - Adobe、Canva、Deutsche Telekom、Meta 及其他未具名企业
        - 已披露具名合作的广度；未披露按合作伙伴或客户划分的收入分成
        - 失去重要关系或对方重新定价会削弱分发或收入
        - 若集中度重大，则为高
        - 多种交付模式和多个具名集成
        - 中高 / 集中度未知
        - 获取头部客户和合作伙伴收入、合同期限、续约、最低承诺、终止条款和替代性分析
      - - 用于研发、招聘和基础设施的外部资本
        - B 轮投资者和未来融资市场
        - 已披露 $300M 轮融资和超过 $450M 的累计募资；现金、消耗和义务未披露
        - 在持久经济性得到证明前，基础设施支出耗尽流动性
        - 高
        - 近期融资提供资源，但未证明现金跑道
        - 在流动性和单位经济得到核实前为高
        - 审阅银行流水、债务和 GPU 义务、月度消耗、现金跑道计划、毛利率、收入质量和下行情景预算
    notes: 募集资金不按可用现金处理，具名集成也不被视为收入多元化或合同持久性的证明。
    claimRefs:
      - CR004
      - CR008
      - CR009
      - CR012
      - CR013
      - CR014
      - CR015
  - id: TV001
    title: 建议摘要
    columns:
      - 维度
      - 证据
      - 评估
      - 决策含义
    rows:
      - - 建议
        - 技术和融资势头强劲，但经济性信息不完整
        - 继续研究 / 跟踪
        - 不要按最新估值作出购买判断
      - - 信心
        - 融资轮次和发布记录有据可查；但财务表现没有相应记录
        - 中低
        - 结论只能有条件地看待
      - - 风险评级
        - 资本密集度、功能趋同，以及未披露的单位经济性
        - 高
        - 要求分阶段尽调并设置下行保护
      - - 估值立场
        - $3.25B 投后估值的 B 轮参考值
        - 偏高 / 未经独立验证
        - 争取低于该估值成交，或加入结构性保护
      - - 入场纪律
        - 留存来源没有经审计的收入、利润率、现金消耗或优先权披露
        - 以证据为门槛
        - 财务和股权结构表完成核验后再推进
    notes: 评估采用 2025 年 12 月的融资参考值，以及截至 2026-10-20 审阅的公开来源；缺失的私有财务和法律条款不作估算。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV011
      - CV013
      - CV014
  - id: TV002
    title: 正论与反论
    columns:
      - 立场
      - 论点
      - 当前证据
      - 哪些信息会改变判断
    rows:
      - - 正论
        - 技术执行
        - FLUX 3 和 FLUX 3 Image Klein 在 2026 年延伸了模型家族
        - 各版本的独立性能和成本基准
      - - 正论
        - 分发广度
        - API、开放权重、企业渠道和 Playground 拓宽了采用路径
        - 按渠道拆分且经过审计的收入结构、留存和转化
      - - 正论
        - 研究与企业信号
        - 投资者报告的引用覆盖范围，以及已部署工作流的需求
        - 客户背书和合同层面的扩张证据
      - - 反论
        - 差异化可能收窄
        - 独立分析指出，竞争对手可以快速复制技术功能
        - 持久的切换成本和不断改善的推理经济性
    notes: 公司和投资者的说法均按其属性呈现；本表不把产品可用性或引用量等同于经常性收入。
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 企业采用进一步加深；模型迭代节奏延续；利润率变得有吸引力
        - 经过审计的规模和利润率得到证明后，$3.25B 以上的价值可能站得住
        - 算力成本和在位者反应
        - 留存、集中度和毛利率扩张
      - - 基准
        - 技术进步延续，但经济性和可防御性仍未验证
        - 仅将 $3.25B 作为融资参考；争取更低的实际价格或保护条款
        - 价格发现有限，以及优先权带来的估值压力
        - 经审计的财务数据，加上清晰的完全摊薄股权结构表
      - - 悲观
        - 在经营杠杆显现前，功能趋同和定价压力先到来
        - 新一轮融资估值下调，或相对最新私募估值出现重大减值
        - 资本密集度高、切换成本弱，或采用放缓
        - 续约率下降、推理成本上升，或融资估值低于上一轮
    notes: 情景值是围绕已披露投后估值的方向性边界，不是点估计；没有私有经营数据，概率和目标回报仍不可得。
    claimRefs:
      - CV001
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV015
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: BFL 在两年多一点的时间里，压缩完成了公司成立、融资和四代主要 FLUX 产品的历程。
    data:
      items:
        - date: '2024'
          label: 公司成立
          detail: Black Forest Labs 在 Freiburg 成立，定位为独立的视觉智能实验室。
          tone: neutral
          claimRefs:
            - CO001
            - CO002
        - date: 2024-08
          label: FLUX.1 发布
          detail: 初代产品线推出 Pro、Dev 和 Schnell 版本，覆盖商业 API 和开放权重使用场景。
          tone: positive
          claimRefs:
            - CO006
        - date: '2025'
          label: FLUX.1 Kontext 增加编辑能力
          detail: 产品线扩展到基于指令的图像编辑，并加入一致性控制。
          tone: positive
          claimRefs:
            - CO007
        - date: 2025-11
          label: FLUX.2 发布
          detail: BFL 增加了 4K 生成能力，并支持最多十张输入图像的多参考条件控制。
          tone: positive
          claimRefs:
            - CO008
        - date: '2025-12-01'
          label: B 轮融资公布
          detail: 公司宣布融资 $300 million，投后估值为 $3.25 billion。
          tone: positive
          claimRefs:
            - CO009
            - CO010
        - date: 2026-01
          label: FLUX.2 Klein 开放权重
          detail: BFL 延续开放权重发布策略，推出 FLUX.2 Klein 家族。
          tone: positive
          claimRefs:
            - CO014
        - date: 2026-09
          label: FLUX 3 Action 开放权重
          detail: 公司将 FLUX 3 架构延伸到机器人和动作预测方向。
          tone: neutral
          claimRefs:
            - CO014
        - date: '2026-10-15'
          label: FLUX 3 Image Klein 开放权重
          detail: BFL 发布了一款可定制图像模型，并称其可在消费级 GPU 和笔记本电脑上运行。
          tone: positive
          claimRefs:
            - CO015
    approximationNotes: 留存来源未提供具体日期时，采用年份或月份级日期；发布描述属于公司说法，除非另有独立归因。
