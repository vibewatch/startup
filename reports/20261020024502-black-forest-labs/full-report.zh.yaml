      - number: '2.3'
        title: 买方、用户、付款方与预算路径
        blocks:
          - type: paragraph
            body: >-
              买方结构随部署渠道变化。个人创作者和评估者可从浏览器 Playground 开始，开发者可接入 API 端点，平台团队可通过 fal 等基础设施伙伴使用
              FLUX，企业则可许可开放权重进行受控部署和定制。终端用户包括设计师、营销人员、开发者和新兴机器人团队；经济买方更可能是创意技术负责人、产品或平台负责人，以及企业技术或采购部门。采用从试验或嵌入式端点开始，只有质量、控制、延迟、成本、隐私和可靠性满足生产要求后才会推进。来源没有披露各分层的预算归属、合同规模，或下载及试点转为付费经常性使用的转化率，因此这些变量仍是尽调输入，而非推导出的市场事实。
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM008
              - CM009
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              增长来自更快的创意迭代、对品牌一致素材的需求、软件产品内嵌生成，以及客户在托管 API、开放权重和本地部署之间的选择。Northzone 称营销组织正从试验走向部署；Salesforce Ventures
              则把精确度、品牌一致性、速度、规模和灵活部署视为生产采用要求。这些证据带有商业利益，不能当作独立市场基准。近期约束很具体：VentureBeat 报道 FLUX 3 进入受限早期访问，但没有公开
              API、价格、生产服务等级、完整评估方法或已发货模型基准；其针对 Gemini Omni Flash 的 52%
              偏好结果基于初步候选版本。这些缺口推迟总成本和质量验证，使转化经济性和持久付费使用比下载量更影响估值。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM010
              - CM011
              - CM013
