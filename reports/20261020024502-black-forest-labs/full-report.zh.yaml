  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现路径
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs 有三条清晰的商业路径：按量使用托管模型、向在自有基础设施部署开放权重的企业授权，以及协商平台协议。其网站还把 Playground 作为试验漏斗；Sacra
              描述了按图像和每百万像素计价的
