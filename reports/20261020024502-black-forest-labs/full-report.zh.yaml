chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Black Forest Labs 是一家德国视觉智能公司，2024 年成立、总部位于弗赖堡；公开资料还提到旧金山和伦敦的团队或实验室。其产品覆盖托管 API、可下载开放权重、企业许可和浏览器
              Playground，同一 FLUX 模型家族可用于试验、嵌入式生产、私有部署和定制。这是一种混合基础设施模式，而非单一消费应用：分发既可经由 BFL API
              直接完成，也可通过集成或自托管模型的开发者和企业间接完成。该结构扩大了采用路径，但现有证据没有披露各交付模式的收入贡献、定价经济性或利润率。
            claimRefs:
              - CO001
              - CO002
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO010
              - CO012
              - CO013
      - number: '1.2'
        title: 创始团队深度清晰，治理深度尚不明确
        blocks:
          - type: paragraph
            body: >-
              Northzone 和公司现有简介一致将 Robin Rombach、Patrick Esser、Andreas Blattmann 列为三位联合创始人，并将团队与潜在扩散及 Stable Diffusion
              研究联系起来。TechFundingNews 另称 Dominik Lorenz 为创始人，形成归属冲突，应以注册和股权表记录核实，不能自行调和。公开资料能确认 Rombach 担任
              CEO，但没有完整高管名单、董事会成员、投票控制、继任覆盖或创始人归属安排。因此，公司具备很强的创始人与市场匹配度，同时也存在明显的关键人物和治理尽调风险：技术积累高度集中，机构监督和职能领导覆盖无法从保留的公开来源判断。
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.3'
        title: 融资更能验证势头，而非经营经济性
        blocks:
          - type: paragraph
            body: >-
              2025 年 12 月 1 日，BFL 宣布由 AMP 和 Salesforce Ventures 领投的 $300 million B 轮，投后估值 $3.25 billion，已披露累计融资超过 $450
              million。投资者组合兼有财务投资者和生态战略参与者，包括 Nvidia 及创意软件领域投资者，可能改善算力与分发获取，但不能证明持久的单位经济性。BFL 还称与十多家《财富》500
              强企业合作、模型下载量达数千万。这些是有用的采用信号，却不能替代经审计收入、合同积压、客户集中度、留存、毛利率、现金、烧钱、跑道或债务数据。目录显示的 51-200 人区间只能作方向性参考，不应当作精确员工数。
