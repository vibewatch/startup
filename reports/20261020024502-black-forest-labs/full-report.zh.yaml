  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              在已披露的 $3.25 billion 投后估值参考下，可投资结论是继续研究，而不是买入。2025 年 12 月 B 轮带来 $300
              million；一份独立叙述将该交易定性为原始资本，而非股东流动性。这能说明跑道获得资金支持，但募资额不等于当前可用现金，也不能证明经常性收入、毛利率、烧钱或回报潜力。审阅过的融资材料还遗漏清算优先权及其他股权结构表条款。因此，入场应以经审计经营证据、完全摊薄股权结构表和下行保护为条件，不能把最新私募估值直接当作公允价值。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV013
              - CV014
      - number: '8.2'
        title: 正论、反论与持久性
        blocks:
          - type: paragraph
            body: >-
              正论由可信的技术积累、多种部署模式、持续的产品节奏和据报道的企业采用构成。Black Forest Labs 提供 API、开放权重、企业和 Playground 访问；2026 年 7 月发布多模态 FLUX
              3 架构，10 月发布 FLUX 3 Image Klein 开放权重。投资者 Northzone
              还指出其研究引用触达广泛，生成式媒体正从试验走向部署。反论是产品特征可能快速趋同，图像模型经济性仍然算力密集，而通过大型平台分发不一定转化为持久定价能力。只有获得留存、集中度、推理成本和利润率证据后，判断才会改善。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: 情景框架与价格支撑
        blocks:
          - type: paragraph
            body: >-
              公开证据支持情景边界，但不支持精确的概率加权估值区间。乐观情景要求最新模型在保持有吸引力单位经济性和差异化性能的同时深化企业采用，这可能支撑高于最新融资参考的价值。基准情景把 $3.25 billion
              视为融资参考，而非独立验证的公允价值，并要求更低的有效入场价格或投资者保护。悲观情景是模型差异化在收入和利润率规模化前被压缩，导致下轮融资或减值。在获得经审计经济性和可比交易前，不应主张目标回报、持有期或退出倍数。
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备、尽调要求与论点破裂
        blocks:
          - type: paragraph
            body: >-
              退出准备度仍未得到证明。投资者联合体和企业集成为战略选择提供了空间，2026
              年发布节奏也证明公司持续执行，但二者都没有指向收购方、公开市场时间表或可持续财务画像。下一道决策闸门应要求按产品和客户拆分的经审计收入、扣除推理成本后的毛利率、现金和月度烧钱、留存、客户集中度、完全摊薄股权表、优先权条款及董事会权利。论点破裂包括企业采用明显放缓、推理经济性无法改善、没有切换成本却迅速实现功能平价，或融资低于最新估值。在这些测试通过前，公司值得跟踪，但价格尚未得到验证。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV013
              - CV014
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV013
              - CV014
      - number: '8.5'
        title: 图表与证据
        blocks:
          - type: callout
            title: 对价格敏感的建议
            body: 继续研究并跟踪执行；只有在经审计经济性和融资条款让 $3.25 billion 参考估值可以独立检验后，才重新考虑投资。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV013
              - CV014
              - CV015
          - type: callout
            title: 论点破裂信号
            body: 下轮融资、企业采用放缓、推理经济性恶化，或没有切换成本却迅速实现功能平价，都会使当前上行情景失效。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV016
