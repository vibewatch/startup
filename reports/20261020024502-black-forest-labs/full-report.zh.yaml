  - id: FM001
    title: 受证据约束的市场与采用层级
    type: pyramid
    summary: 该层级从无法量化的视觉内容大盘，逐步收窄到可衡量的分发、企业采用和早期扩张信号，但不把它们呈现为共享同一总体的漏斗。
    data:
      nodes:
        - label: 全球视觉内容工作流
          value: Unquantified
          detail: 覆盖信息流、产品页面、演示文稿和创意制作中的相机媒体与生成媒体。
        - label: 生成式媒体工作负载
          value: Unquantified
          detail: 图像和视频创作从孤立产出走向嵌入式工作流。
        - label: 可部署的模型基础设施
          value: API + open weights + enterprise licensing
          detail: BFL 可触达的层面包括模型访问、推理、定制和部署。
        - label: FLUX 分发
          value: 400M+ downloads
          detail: Salesforce Ventures 的多平台说法；付费转化和重复下载量未知。
        - label: 企业证据
          value: More than 12 Fortune 500 partners
          detail: AI Engineer 的 2025 年 12 月报告；合同价值和生产状态未披露。
        - label: FLUX 3 扩张证据
