  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场边界小于媒体、广告和创意软件的全部支出。Black Forest Labs 将自己定位为视觉智能研究实验室，通过 Playground、API、可下载模型和企业合作提供
              FLUX，因而属于生成式视觉模型基础设施：为图像及新兴视频工作流提供模型推理、部署、定制和许可。可计入的支出，是创意技术预算中用于模型访问、推理、模型许可或部署支持的部分；相机、媒体采买、不消耗模型的传统设计软件、代理商人力，以及
              BFL 未捕获的下游应用收入应排除。现状替代方案包括相机制作素材、手工创作—审核—改进循环和内部组装的模型栈。该边界避免把所有视觉内容支出都当成可触达的模型收入。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM012
      - number: '2.2'
        title: 受证据约束的市场规模与采用情况
        blocks:
          - type: paragraph
            body: >-
              保留来源提供的是采用代理指标，而非可比的市场规模序列。Salesforce Ventures 报告多个分发渠道的 FLUX 下载量超过 400 million；AI Engineer 报告截至 2025 年 12
              月 Hugging Face 下载量达数千万，并与十多家《财富》500 强企业合作。这些指标分母不同，不能拼成漏斗、收入估算或市场份额。VentureBeat 另称有五家机构测试 FLUX
              3，说明其扩展到视频和实体 AI 用例，但早期测试不等于付费生产部署。因此，证据只支持一条受限的采用阶梯：广泛开发者分发、具名企业集成和早期扩张群体；没有独立支出数据及 BFL 转化经济性，就不能支持美元口径
              TAM、特定地域 SAM 或可获得 SOM。
