  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: >-
        GRR, NRR, churn, renewal rate, contract length, active paid accounts, and
        cohort retention by API, open-weights license, and enterprise route.
      whyItMatters: >-
        Public reach metrics cannot establish recurring revenue quality or customer
        durability without cohort and renewal evidence.
      diligencePath: >-
        Request board-approved customer KPIs and anonymized monthly cohorts, then
        reconcile retained revenue to contracts, invoices, and cash collections.
      relatedQuestionRefs: [QU005]
      relatedTableRefs: [TU002]
    - type: conflicting-data
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        Contract-level revenue, duration, termination rights, renewal status, and
        top-10 customer concentration, including the reported Meta relationship.
      whyItMatters: >-
        A large estimated platform contract could make growth sensitive to one renewal,
        while the available value is outside reporting rather than company disclosure.
      diligencePath: >-
        Inspect executed contracts and amendments, customer invoices, revenue by
        counterparty, and renewal correspondence for the largest platform accounts.
      relatedQuestionRefs: [QU006]
    - type: enumeration-incomplete
      severity: material
      topic: named-integrations
      missingEvidence: >-
        A complete current customer roster that labels production, pilot, partner,
        investor, former relationship, payer, and end user separately.
      whyItMatters: >-
        Public lists mix different relationship types and therefore cannot support a
        reliable customer count or production-deployment rate.
      diligencePath: >-
        Obtain the CRM export and contract register, sample the largest named accounts,
        and secure customer reference calls that confirm current production status.
      relatedQuestionRefs: [QU003, QU004]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: customer-outcomes
      missingEvidence: >-
        Customer-authored evidence of measured cost, speed, quality, revenue, or
        workflow outcomes from sustained FLUX deployment.
      whyItMatters: >-
        Named integrations demonstrate distribution but do not show realized customer
        value, satisfaction, or willingness to expand.
      diligencePath: >-
        Request three production customer references across platform, enterprise, and
        developer routes, with baseline and post-deployment operating metrics.
      relatedQuestionRefs: [QU004]
