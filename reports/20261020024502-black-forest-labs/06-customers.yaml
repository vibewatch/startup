schemaVersion: "report-v2"
artifact: customers
slug: black-forest-labs
runDate: "2026-10-20"
company:
  name: Black Forest Labs
chapter:
  number: 6
  title: Customers
  summary: >-
    Black Forest Labs reaches customers through self-serve APIs and open weights,
    enterprise licensing, and integrations inside major creative platforms. Public
    adoption signals are substantial, but retention, contract durability, realized
    customer outcomes, and concentration remain largely undisclosed.
sections:
  - id: customer-segments-and-routes
    title: Customer segments and routes to market
    body: >-
      The public offer supports three commercial paths rather than a single buyer
      profile. Developers and technical teams can start with open weights and deploy
      on their own infrastructure; product teams can integrate a production-oriented
      API; and larger organizations can seek enterprise licensing, scale, and
      customization. A fourth audience, creative professionals, often experiences
      FLUX indirectly through embedded products rather than buying from Black Forest
      Labs. This structure broadens distribution, but it also obscures the identity
      of the ultimate payer, the revenue contribution of each route, and the boundary
      between free adoption and contracted demand. The investable customer question
      is therefore not whether FLUX is accessible, but which adoption surface produces
      durable, high-margin revenue.
    claimRefs: [CU001, CU002, CU003, CU016]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-named-proof
    title: Adoption trajectory and named proof
    body: >-
      Public evidence establishes reach more clearly than monetization. Black Forest
      Labs says its foundations power millions of creations, while Innobu reported
      more than 400 million model downloads by June 2026. Independent profiles also
      identify FLUX inside products from Adobe, Canva, Meta, Microsoft, and other
      platforms. The strongest use-specific proof in the assigned evidence is Martin
      Scorsese's reported use of FLUX for film storyboarding; however, this is an
      adviser use case rather than a disclosed enterprise contract with measured
      economics. The named relationships validate distribution and workflow relevance,
      but the sources do not consistently separate production deployment, pilot,
      partnership, investment, or customer status.
    claimRefs: [CU004, CU005, CU006, CU007, CU010, CU014, CU015]
    tableRefs: [TU002, TU003]
  - id: retention-concentration-and-durability
    title: Retention, concentration, and durability
    body: >-
      Durability is the largest customer-evidence gap. None of the eight assigned
      sources discloses net or gross retention, churn, renewal rates, contract length,
      active paid accounts, customer cohorts, or top-customer revenue concentration.
      CourionAI cites outside reporting of an approximately $140 million multi-year
      Meta contract and approximately $300 million of combined large-platform contract
      value, but explicitly says these are not company figures. The same profile says
      xAI stopped using FLUX after moving to its own image model, demonstrating that
      platform distribution can be reversible. Customer-investor overlap at Adobe and
      Canva may improve strategic alignment, but it is not evidence of renewal,
      satisfaction, or pricing power.
    claimRefs: [CU007, CU008, CU009, CU011]
  - id: expansion-case-and-diligence
    title: Expansion case and diligence implications
    body: >-
      The plausible expansion loop begins with low-friction experimentation, moves
      through API integration or local deployment, and can culminate in enterprise
      customization or a platform embedding. The October 2026 open-weights release
      reinforces that acquisition path by giving developers and businesses additional
      options to adapt and deploy the newest model family. Northzone, an investor,
      reports that generative media is moving from experimentation to real deployment,
      but that claim is channel-informed rather than independent customer telemetry.
      Before underwriting expansion, diligence should reconcile contracts to active
      usage and cash collections, identify the payer behind embedded distribution,
      obtain cohort retention by route, and quantify revenue exposure to the largest
      platforms.
    claimRefs: [CU001, CU002, CU003, CU012, CU013, CU016]
tables:
  - id: TU001
    title: Customer segmentation and commercial route
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale or strategic value
      - Evidence gap
    rows:
      - [Developers and researchers, Technical user; payer may be individual or employer, Download and adapt open weights, Broad top-of-funnel and ecosystem adoption, Paid conversion and commercial-use mix are undisclosed]
      - [API product teams, Engineering or product buyer; organization pays, Embed image and visual-intelligence generation in products, Production-oriented API is marketed for workloads at any scale, Active paid accounts and usage concentration are undisclosed]
      - [Large enterprises, Enterprise team and procurement function, Licensed deployment plus customization and scale, Highest-potential contract route, Contract values terms renewals and margins are undisclosed]
      - [Creative professionals through platforms, End user inside Adobe Canva or another host product; platform likely pays, Image generation editing and storyboarding, Extends reach without direct customer acquisition, End-user activity and platform revenue attribution are undisclosed]
    notes: >-
      Segments synthesize the official product routes and reported integrations; payer
      identity, revenue contribution, and conversion are not disclosed and should not
      be inferred from reach.
    claimRefs: [CU001, CU002, CU003, CU006, CU010, CU016]
  - id: TU002
    title: Public adoption and deployment signals
    columns:
      - Metric or signal
      - Reported value
      - Date / period
      - Source quality
      - Implication
      - Missing denominator
    rows:
      - [Creations powered, Millions worldwide, Current official page accessed 2026-10-20, Company claim, Demonstrates broad usage surface, No paid share time period or unique-user count]
      - [FLUX downloads, More than 400 million, Reported 2026-06-06, Independent consultant article, Strong developer distribution signal, Downloads are not active users or paying customers]
      - [Named embedded products, Adobe Canva Meta Microsoft ElevenLabs and Vercel, Reported 2026-06-06, Independent consultant article with partial corroboration, Shows platform breadth, Deployment depth usage and commercial terms are absent]
      - [Newest open-weights release, FLUX 3 Image Klein for developers and businesses, Announced 2026-10-15, Company-issued syndicated release, Refreshes acquisition and self-deployment surface, Adoption after release is not yet disclosed]
    notes: >-
      Values preserve each source's metric and date; downloads, creations, integrations,
      and releases are different units and are not presented as a conversion funnel.
    claimRefs: [CU004, CU005, CU006, CU011, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Named organization
      - Segment
      - Deployment or use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - [Adobe, Creative software platform and strategic investor, FLUX reported inside Adobe products including Photoshop, Reported integration; production scope not quantified, Access to professional creative workflows, No usage revenue renewal or outcome metric]
      - [Canva, Design platform and strategic investor, FLUX reported inside Canva products, Reported integration; production scope not quantified, Access to a large design-user surface, No usage revenue renewal or outcome metric]
      - [Meta, Consumer technology platform, FLUX reported in Meta products with an outside estimate of a multi-year contract, Reported commercial relationship; terms unverified, Potentially material platform distribution, Contract value is an outside estimate and concentration is undisclosed]
    notes: >-
      Sample of named relationships supported by the assigned sources as of 2026-10-20;
      it is not an exhaustive customer list, and labels distinguish reported integration
      from quantified production outcomes.
    enumerationScope:
      coverage: sample
      basis: >-
        Named platform relationships appearing in at least two retained evidence
        sources or carrying a separately identified commercial estimate.
    claimRefs: [CU006, CU007, CU008, CU014]
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Public product surfaces create a progression from experimentation to enterprise
      deployment, while conversion, retention, and revenue remain unreported.
    data:
      nodes:
        - id: discovery
          label: Discover FLUX
          detail: Individuals and teams encounter FLUX directly or inside a partner product.
          touchpoints: [Embedded product, Public model visibility]
        - id: experiment
          label: Experiment
          detail: Users can test models in a browser without code.
          touchpoints: [Playground]
        - id: build
          label: Build
          detail: Developers integrate a production-oriented API into a product or workflow.
          touchpoints: [API, Developer integration]
        - id: self-deploy
          label: Self-deploy
          detail: Technical teams can run and customize open weights on their own infrastructure.
          touchpoints: [Open weights, Fine-tuning, Local deployment]
        - id: enterprise
          label: Enterprise adoption
          detail: Larger organizations can seek scale, customization, and commercial licensing.
          touchpoints: [Enterprise agreement, Procurement]
        - id: expand
          label: Expand usage
          detail: A successful deployment may broaden across products or teams, but public cohort evidence is absent.
          touchpoints: [Additional workloads, Custom deployment]
    approximationNotes: >-
      The sequence represents available adoption surfaces, not observed conversion
      rates; no public funnel denominators or retention cohorts were found.
    claimRefs: [CU001, CU002, CU003, CU012, CU013, CU016]
callouts:
  - calloutType: risk
    title: Reach is not retention
    body: >-
      Downloads, creations, integrations, and named relationships validate distribution
      but do not disclose paid usage, renewals, concentration, or customer-level economics.
    claimRefs: [CU005, CU006, CU008, CU009, CU011]
