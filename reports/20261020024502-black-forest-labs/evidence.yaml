evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, voting control, founder vesting, option pool, liquidation preferences, investor rights,
      secondary transactions, and fully diluted ownership.
    whyItMatters: >-
      Governance and preference terms determine minority-investor protection, effective valuation, succession
      resilience, and exit proceeds.
    diligencePath: >-
      Obtain the charter, bylaws, board minutes, voting agreements, stockholder ledger, option schedule, financing
      documents, and a fully diluted post-Series-B cap table.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: founders
    missingEvidence: Primary incorporation and cap-table records resolving whether Dominik Lorenz is legally or economically a founder.
    whyItMatters: Founder attribution affects ownership, governance, key-person risk, and historical accuracy.
    diligencePath: Reconcile commercial-register filings, formation documents, founder stock issuances, and management confirmation.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited revenue or ARR, gross margin, customer denominator, concentration, retention, cash, monthly burn, runway,
      debt, GPU commitments, and an exact employee roster.
    whyItMatters: >-
      Announced funding and partnerships cannot establish recurring economics, liquidity, or operating leverage at the
      reported private valuation.
    diligencePath: >-
      Obtain audited financials, monthly management accounts, bank and debt statements, customer cohorts, top-contract
      schedules, compute commitments, and payroll by function and location.
    relatedQuestionRefs:
      - QO006
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: Independent category-spend estimates with consistent geography, year, workload boundary, and methodology.
    whyItMatters: Without comparable spend data, a dollar TAM or serviceable market would overstate the evidence.
    diligencePath: Obtain reputable analyst or industry datasets and reconcile them to BFL's model-infrastructure revenue boundary.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Segment pricing, contract value, consumption, renewal, conversion, and budget-owner data.
    whyItMatters: Distribution and partnership counts cannot establish paid adoption, recurring revenue, or obtainable share.
    diligencePath: >-
      Request customer-level cohort data and contracts segmented by API, licensing, hosted-partner, and enterprise
      channels.
    relatedQuestionRefs:
      - QM002
      - QM004
      - QM006
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: benchmark-uncertainty
    missingEvidence: >-
      Shipping-model benchmarks with methodology, sample sizes, raters, reproducible prompts, pricing, and production
      service levels.
    whyItMatters: Buyers cannot compare quality-adjusted cost or operational reliability before committing production workloads.
    diligencePath: Obtain the promised general-availability benchmark package, rate card, API documentation, and service-level terms.
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Current, directly comparable BFL and competitor list prices, enterprise discounts, usage units, minimum
      commitments, and contract terms.
    whyItMatters: Without a common unit and contract basis, relative pricing power and gross-margin implications cannot be assessed.
    diligencePath: >-
      Obtain current vendor quotes for a fixed image and video workload and normalize them for quality, latency,
      resolution, and committed volume.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: benchmarks-and-trust
    missingEvidence: >-
      Independent controlled benchmarks and comparable licensing, safety, privacy, and regulatory documentation for BFL
      and major alternatives.
    whyItMatters: Qualitative positioning cannot establish performance leadership or a durable trust advantage.
    diligencePath: >-
      Commission blind task-level evaluations and review vendor contracts, model cards, data rights, incident records,
      and compliance documentation.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer retention, multi-homing, concentration, contract duration, exclusivity, integration depth, and
      inference-cost trends.
    whyItMatters: >-
      These private metrics determine whether distribution relationships create durable lock-in or leave BFL exposed to
      platform substitution.
    diligencePath: >-
      Review customer-level cohorts and contracts, interview reference customers, and benchmark fully loaded inference
      costs against alternative providers.
    relatedQuestionRefs:
      - QP005
      - QP006
      - QP007
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Audited monthly revenue, ARR definition, revenue recognition by contract, revenue mix, realized pricing,
      discounts, renewal terms, and customer concentration.
    whyItMatters: Public estimates and contract values cannot establish recurring recognized revenue or its durability.
    diligencePath: >-
      Obtain audited financials, monthly revenue cohorts, executed material contracts, invoices, and a
      revenue-recognition memorandum.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: >-
      Gross margin, inference and training cost, support cost, CAC, sales cycle, payback, retention, expansion, and
      channel economics by monetization route.
    whyItMatters: Without these inputs, revenue scale cannot be translated into contribution margin or capital-efficient growth.
    diligencePath: >-
      Request model-level cost accounting, customer cohorts, sales-funnel data, partner statements, and contract-level
      contribution margins.
    relatedQuestionRefs:
      - QI004
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: liquidity-gap
    missingEvidence: >-
      Cash on hand, restricted cash, monthly burn, runway, debt, GPU financing, infrastructure commitments, and
      next-round triggers.
    whyItMatters: The amount raised does not establish available liquidity or the timing and terms of future financing needs.
    diligencePath: >-
      Reconcile bank statements, debt schedules, cloud and GPU commitments, headcount plan, and the board-approved
      operating forecast.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue-quality
    missingEvidence: A common-period reconciliation of Sacra's annualized-revenue estimate and Dealroom's 33.9x EV/revenue multiple.
