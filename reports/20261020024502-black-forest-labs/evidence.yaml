    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: benchmark-gap
    missingEvidence: >-
      Independent FLUX 3 benchmark results with methodology, comparison set, sample sizes, failure cases, and
