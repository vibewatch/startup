    title: Technical pedigree converted into financing velocity
    body: >-
      A research-heavy founding team progressed from FLUX.1 to a $300 million Series B and multiple
      model generations in under two years, a strong signal of execution speed.
    claimRefs: [CO003, CO006, CO009, CO014, CO015]
  - calloutType: risk
    title: The public record is stronger on launches than economics
    body: >-
      Product cadence, financing, and partnership claims are visible, but the assigned evidence
      does not disclose audited revenue, margins, cash, burn, debt, concentration, retention, or governance terms.
    claimRefs: [CO012, CO016]
