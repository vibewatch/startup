  - id: FM001
    title: Evidence-constrained market and adoption stack
    type: pyramid
    summary: >-
      The stack narrows from the unquantified visual-content universe to measurable distribution, enterprise, and early
      expansion signals without presenting them as a common-population funnel.
    data:
      nodes:
        - label: Global visual-content workflows
          value: Unquantified
          detail: Camera-based and generated media across feeds, product pages, presentations, and creative production.
        - label: Generative-media workloads
          value: Unquantified
          detail: Image and video creation moving from isolated outputs toward embedded workflows.
        - label: Deployable model infrastructure
          value: API + open weights + enterprise licensing
          detail: The BFL-addressable layer is model access, inference, customization, and deployment.
        - label: FLUX distribution
          value: 400M+ downloads
          detail: Salesforce Ventures' multi-platform claim; paid conversion and duplicate downloads are unknown.
        - label: Enterprise evidence
          value: More than 12 Fortune 500 partners
          detail: AI Engineer's December 2025 report; contract value and production status are undisclosed.
        - label: FLUX 3 expansion evidence
          value: 5 named testers
          detail: VentureBeat named Canva, Burda, Magnific, Krea, and Picsart; testing is not paid deployment.
    approximationNotes: >-
      Conceptual layers are not proportional. Numeric values preserve distinct source populations and cannot be
      converted into TAM, SAM, SOM, market share, or conversion rates.
