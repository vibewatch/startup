  - id: FR001
    title: 'Risk heatmap: evidence-based residual view'
    type: matrix
    summary: >-
      Scenario impact is separated from observed likelihood; unknown cells identify diligence blockers rather than
      assumed safety.
    data:
      columns:
        - label: Likelihood evidence
          detail: Observed support for incidence or maturity; unknown is not zero.
        - label: Scenario impact
          detail: Conditional investment impact if the failure occurs.
        - label: Mitigation maturity
          detail: Only mitigation described in assigned sources.
        - label: Residual view
          detail: Post-mitigation assessment subject to listed gaps.
      rows:
        - label: Regulatory / legal posture
          note: No primary regulator, court, privacy, or detailed compliance source is assigned.
          values:
            - label: Unknown
              tone: warning
            - label: High if adverse
              tone: risk
            - label: Not established
              tone: risk
            - label: High uncertainty
              tone: risk
        - label: Release maturity
          note: FLUX 3 capabilities are described as phased and video as early access.
          values:
            - label: Observed transition
              tone: warning
            - label: High
              tone: risk
            - label: Feedback + safety testing
              tone: neutral
            - label: Medium-high
              tone: warning
        - label: Serving reliability
          note: API scale is company-claimed; public SLO and incident evidence is absent.
          values:
            - label: Unknown
              tone: warning
            - label: High
              tone: risk
            - label: Self-host option
              tone: neutral
            - label: Medium-high
              tone: warning
        - label: Team execution
          note: Public headcount figures conflict while hiring and scope expand.
          values:
            - label: Unknown
              tone: warning
            - label: Medium-high
              tone: warning
            - label: Funded hiring
              tone: neutral
            - label: Medium-high
              tone: warning
        - label: Capital intensity
          note: Funding is disclosed, but cash, burn, runway, and compute obligations are not.
          values:
            - label: Unknown
              tone: warning
            - label: High
              tone: risk
            - label: $300M financing
              tone: neutral
            - label: High until verified
              tone: risk
        - label: Partner concentration
          note: Several integrations are named without revenue or contract concentration.
          values:
            - label: Unknown
              tone: warning
            - label: High if concentrated
              tone: risk
            - label: Multi-channel access
              tone: neutral
            - label: Medium-high
              tone: warning
    approximationNotes: >-
      Qualitative matrix; no incident probabilities, monetary exposures, or control-effectiveness scores were available
      in the assigned evidence.
