              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.2'
        title: Architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              BFL describes FLUX 3 as a unified architecture trained jointly across images, video, and audio, with an
              extension to action prediction. That design is intended to reuse one learned representation across media
              and physical-action tasks rather than maintain unrelated product foundations. Public third-party material
              describes earlier FLUX generations as using latent-space rectified flow and hybrid transformer blocks, but
              this is weaker evidence than a current FLUX 3 technical paper and should not be treated as a verified
              implementation specification. Deployment is more tangible: hosted access coexists with base, distilled,
              and quantized open-weight variants that customers can adapt and run independently.
            claimRefs:
              - CE003
              - CE008
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE003
              - CE008
              - CE011
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
