      - CR010
      - CR013
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Observed product execution and financing momentum are filtered through durability and disclosure gaps before
      reaching a research-more recommendation.
    data:
      nodes:
        - id: technical-proof
          label: Technical proof
          detail: FLUX 3 and FLUX 3 Image Klein continued the 2026 release cadence.
        - id: distribution
          label: Distribution signal
          detail: API, open weights, enterprise, and playground routes create several adoption paths.
        - id: financing
          label: Financing reference
          detail: $300M Series B at a $3.25B post-money valuation.
        - id: durability-test
          label: Durability test
          detail: Feature convergence and capital intensity can erode model-level pricing power.
        - id: evidence-gap
          label: Valuation evidence gap
          detail: Audited economics, cap-table terms, concentration, and comparables are unavailable.
        - id: recommendation
          label: Research more
          detail: Track execution but do not treat the latest mark as independently validated fair value.
      edges:
        - from: technical-proof
          to: distribution
        - from: distribution
          to: financing
        - from: financing
          to: durability-test
        - from: durability-test
          to: evidence-gap
        - from: evidence-gap
          to: recommendation
    approximationNotes: >-
      Conceptual decision chain only; node order does not imply quantitative weights, conversion rates, or
      probabilities.
    claimRefs:
      - CV005
      - CV006
      - CV010
      - CV013
      - CV014
