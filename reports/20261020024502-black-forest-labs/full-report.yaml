  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: BFL compressed founding, financing, and four major FLUX generations into a little over two years.
    data:
      items:
        - date: '2024'
          label: Company founded
          detail: Black Forest Labs was founded in Freiburg as an independent visual-intelligence lab.
          tone: neutral
          claimRefs:
            - CO001
            - CO002
        - date: 2024-08
          label: FLUX.1 launched
          detail: The initial family shipped Pro, Dev, and Schnell variants spanning commercial API and open-weight use.
          tone: positive
          claimRefs:
            - CO006
        - date: '2025'
          label: FLUX.1 Kontext added editing
          detail: The product line expanded to instruction-based image editing with consistency controls.
          tone: positive
          claimRefs:
            - CO007
        - date: 2025-11
          label: FLUX.2 released
          detail: BFL added 4K generation and multi-reference conditioning across up to ten input images.
          tone: positive
          claimRefs:
            - CO008
        - date: '2025-12-01'
          label: Series B announced
          detail: The company announced $300 million at a $3.25 billion post-money valuation.
          tone: positive
          claimRefs:
            - CO009
            - CO010
        - date: 2026-01
          label: FLUX.2 Klein open weights
          detail: BFL continued its open-weight release strategy with the FLUX.2 Klein family.
          tone: positive
          claimRefs:
            - CO014
        - date: 2026-09
          label: FLUX 3 Action open weights
          detail: The company extended the FLUX 3 architecture toward robotics and action prediction.
          tone: neutral
          claimRefs:
            - CO014
        - date: '2026-10-15'
          label: FLUX 3 Image Klein open weights
          detail: BFL released a customizable image model described as runnable on consumer GPUs and laptops.
          tone: positive
          claimRefs:
            - CO015
    approximationNotes: >-
      Year- or month-level dates are used where the retained source did not provide a specific day; release descriptions
