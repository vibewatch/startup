      - CM008
      - CM012
      - CM013
      - CM014
      - CM015
  - id: FP001
    title: 'Ordinal competitive positioning: deployment control versus workflow reach'
    type: quadrant
    summary: >-
      BFL occupies a differentiated high-control position, while incumbent platforms and direct products retain
      workflow-distribution advantages.
    data:
      points:
        - label: Black Forest Labs
          x: 5
          'y': 4
          detail: API, open weights, enterprise access, and broad multimodal direction.
        - label: Midjourney
          x: 1
          'y': 4
          detail: Finished product and community are evidenced; local control is not.
        - label: Stable Diffusion / open ecosystem
          x: 5
          'y': 2
          detail: High deployment control but buyer-owned integration and operations.
        - label: Adobe / Canva workflows
          x: 2
          'y': 5
          detail: Strong workflow position; deployment-control evidence is incomplete.
        - label: Large model labs
          x: 2
          'y': 5
          detail: Distribution strength is the central threat; current feature parity is untested.
        - label: Internal build / manual status quo
          x: 5
          'y': 1
          detail: Maximum process control with the lowest packaged workflow reach.
    approximationNotes: >-
