          detail: "Observed support for incidence or maturity; unknown is not zero."
        - label: "Scenario impact"
          detail: "Conditional investment impact if the failure occurs."
        - label: "Mitigation maturity"
          detail: "Only mitigation described in assigned sources."
        - label: "Residual view"
          detail: "Post-mitigation assessment subject to listed gaps."
      rows:
        - label: "Regulatory / legal posture"
          note: "No primary regulator, court, privacy, or detailed compliance source is assigned."
          values:
            - label: "Unknown"
              tone: "warning"
            - label: "High if adverse"
