callouts:
  - calloutType: "risk"
    title: "Financing is not runway"
    body: >-
      The $300 million Series B and more than $450 million of total funds raised establish
      financing history, not current liquidity. Cash, burn, infrastructure commitments,
      revenue quality, gross margin, and downside runway remain diligence requirements.
    claimRefs:
      - "CR004"
      - "CR013"
      - "CR014"
  - calloutType: "recommendation"
    title: "Conditional thesis-break tests"
    body: >-
      Do not reduce the risk rating until management provides primary legal and security
      records, production reliability evidence beyond early access, a reconciled operating
      plan, and concentration and liquidity data against pre-agreed investment thresholds.
    claimRefs:
      - "CR005"
      - "CR011"
      - "CR014"
      - "CR016"
