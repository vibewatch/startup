company:
  name: "Black Forest Labs"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Black Forest Labs' principal disclosed risk is execution across a widening set of
    models, deployment modes, and enterprise integrations while releases remain phased
    and some capabilities are still in early access. Public evidence documents funding,
    local-deployment options, and misuse safeguards, but it does not establish legal
    posture, incident history, partner concentration, revenue quality, burn, or runway.
sections:
  - id: "ranked-risk-summary"
    title: "Ranked risk view"
    body: >-
      The highest-priority risks are those where scenario impact is high and the public
      evidence needed to estimate likelihood is missing. Regulatory, copyright, privacy,
      and model-safety exposure therefore rank first as diligence priorities, not because
      the assigned sources prove an adverse event, but because the company distributes
      powerful models through APIs and open weights while the evidence pool contains no
      regulator, court, privacy, or detailed compliance record. Execution risk ranks next:
      FLUX 3 is described as a phased rollout with early-access capabilities, so production
      maturity, service reliability, and safety performance still require direct evidence.
      Financial and dependency risks remain material because a large financing and broad
      partner list do not disclose cash available, compute obligations, unit economics, or
      concentration. The heatmap preserves these unknowns rather than converting them into
      unsupported incident probabilities.
    claimRefs:
      - "CR005"
      - "CR006"
      - "CR009"
      - "CR011"
      - "CR013"
      - "CR015"
      - "CR016"
    figureRefs:
      - "FR001"
  - id: "regulatory-legal-and-safety"
    title: "Regulatory, legal, and model-safety exposure"
    body: >-
      The assigned evidence supports only a mitigation signal, not a compliance conclusion.
      A company-issued release says open-weight packages include safeguards intended to
      reduce misuse and that customers can deploy models on their own infrastructure for
      data-sovereignty needs. Those design choices may reduce some enterprise-control risk,
      but they do not establish copyright provenance, privacy compliance, EU AI Act
      classification, jurisdiction-specific approvals, or the effectiveness of safety
      controls after model customization. Open weights also move part of the control surface
      to downstream operators, making license terms, acceptable-use enforcement, model-card
      testing, and customer allocation of liability important diligence items. No assigned
      source documents a lawsuit, enforcement action, breach, or outage; that absence is an
      evidence gap and must not be read as evidence that none occurred.
    claimRefs:
      - "CR009"
      - "CR011"
      - "CR012"
      - "CR016"
    tableRefs:
      - "TR001"
  - id: "operational-quality-and-security"
    title: "Operational, quality, and security execution"
    body: >-
      Product breadth increases the number of failure surfaces that management must govern.
      The company now spans hosted APIs, open-weight deployment, enterprise delivery, and a
      browser playground, while third-party product material describes FLUX 3 capabilities
      as rolling out in phases and video as early access. This supports a maturity risk:
      benchmark preference and research progress are not substitutes for production SLOs,
      incident-response records, capacity data, or customer renewal evidence. Mitigations
      include feedback and safety testing during early access, independent deployment for
      customers that need control, and company-stated safeguards. Team execution also needs
      verification because one public profile reports both 34 and 70 employees, while the
      financing announcement identifies hiring and infrastructure as uses of proceeds.
      Management should reconcile headcount and provide release-quality, security, and
      reliability evidence before the execution risk is reduced.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR014"
    tableRefs:
      - "TR002"
  - id: "dependencies-financial-and-kill-criteria"
    title: "Dependencies, financial exposure, and thesis-break triggers"
    body: >-
      Distribution appears diversified at the surface: company materials name API,
      open-weight, enterprise, and playground channels, and identify integrations with
      Adobe, Canva, Deutsche Telekom, and Meta. The same evidence does not quantify revenue
      by customer, partner, channel, model, or hosting mode, so diversification cannot be
      assumed. The announced $300 million Series B and more than $450 million of total funds
      raised indicate financing access, but funding raised is not cash available or runway;
      the company also says proceeds support research, hiring, and infrastructure. Before
      investment, thesis-break conditions should include failure to produce primary legal
      and security records, inability to demonstrate dependable production operation beyond
      early access, compute commitments that are not covered by a board-approved liquidity
      plan, or customer and platform concentration above an investment-committee threshold.
      These are proposed monitoring triggers, not claims that any threshold has already
      been breached.
    claimRefs:
      - "CR004"
      - "CR008"
      - "CR009"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
