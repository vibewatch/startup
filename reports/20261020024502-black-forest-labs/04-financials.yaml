callouts:
  - calloutType: risk
    title: Capital raised is not runway
    body: >-
      The reported Series B provides financing capacity, but the retained evidence does not
      disclose current cash, burn, debt, GPU-financing obligations, or committed infrastructure
      spend; runway cannot be calculated.
    claimRefs: [CI008, CI013, CI016]
  - calloutType: recommendation
    title: Require a revenue-to-gross-profit bridge
    body: >-
      Underwriting should remain conditional on monthly recognized revenue, customer concentration,
      realized pricing, inference cost, channel economics, retention, and liquidity reconciled to
      bank cash and contractual commitments.
    claimRefs: [CI003, CI004, CI005, CI011, CI012, CI013]
