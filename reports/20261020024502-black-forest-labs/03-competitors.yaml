      Analyst-authored ordinal scores from 1 to 5, not measured benchmarks. X represents buyer
      deployment control and Y represents packaged workflow or distribution reach; scores use
      only the retained qualitative evidence and preserve unsupported comparisons as gaps.
    claimRefs: ["CP006", "CP007", "CP009", "CP010", "CP013", "CP014"]
callouts:
  - calloutType: "strength"
    title: "Deployment flexibility is the clearest current differentiator"
    body: >-
      BFL can serve API users, enterprises, local deployers, and experimenters without forcing
      every buyer into the same interface or hosting model.
    claimRefs: ["CP001", "CP002"]
  - calloutType: "risk"
    title: "Distribution and imitation can compress the moat"
    body: >-
      Integrated platforms and large model labs can bundle alternatives, while fast feature
      replication makes retention, inference economics, and integration depth decisive.
    claimRefs: ["CP009", "CP010", "CP016"]
