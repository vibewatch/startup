  unresolvedGaps:
    - 按产品和客户划分的经审计月度收入、ARR 定义、扣除推理成本后的毛利率、留存、实际成交价格和渠道经济性。
    - 手头现金、月度消耗、现金跑道、债务、GPU 融资义务和已承诺的基础设施支出。
    - 头部客户集中度、合同期限、续约条款，以及已点名平台合作关系当前是否处于生产环境。
    - 法律、隐私、版权、安全、事故、模型安全、SLO 和灾难恢复的一手记录。
    - 完全摊薄后的资本结构、清算优先权、董事会权利、创始人归属、投票控制权和继任安排。
    - 支持业绩持久性和 32.5 亿美元融资参考值的独立可比基准及标准化私募市场交易。
