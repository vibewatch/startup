      - [Risk rating, "Capital intensity, feature convergence, and undisclosed unit economics", "High", "Require staged diligence and downside protection"]
      - [Valuation stance, "$3.25B post-money Series B reference", "Stretched / not independently validated", "Negotiate below the mark or add structural protection"]
      - [Entry discipline, "No audited revenue, margin, burn, or preference disclosure in retained sources", "Evidence-gated", "Advance only after financial and cap-table verification"]
    notes: "Assessment uses the December 2025 financing reference and public sources reviewed through 2026-10-20; missing private financial and legal terms are not estimated."
    claimRefs: [CV001, CV002, CV003, CV011, CV013, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Argument, Current evidence, What would change the view]
    rows:
      - [Thesis, "Technical execution", "FLUX 3 and FLUX 3 Image Klein extend the model family in 2026", "Independent performance and cost benchmarks across releases"]
      - [Thesis, "Distribution breadth", "API, open weights, enterprise, and playground routes broaden adoption paths", "Audited revenue mix, retention, and conversion by route"]
      - [Thesis, "Research and enterprise signal", "Investor-reported citation reach and deployed workflow demand", "Customer references and contract-level expansion evidence"]
      - [Anti-thesis, "Differentiation may compress", "Independent analysis notes that competitors can replicate technical features quickly", "Durable switching costs and improving inference economics"]
    notes: "Company and investor claims are presented as such; the table does not equate product availability or citations with recurring revenue."
    claimRefs: [CV004, CV005, CV008, CV009, CV010]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns: [Case, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Enterprise adoption deepens; model cadence persists; margins become attractive", "Value above $3.25B may be supportable after audited scale and margin proof", "Compute cost and incumbent response", "Retention, concentration, and gross-margin expansion"]
      - [Base, "Technical progress continues but economics and defensibility remain unverified", "Use $3.25B only as a financing reference; seek a lower effective price or protections", "Limited price discovery and preference overhang", "Audited financials plus clean fully diluted cap table"]
      - [Bear, "Feature parity and pricing pressure arrive before operating leverage", "Down round or material impairment below the latest private mark", "Capital intensity, weak switching costs, or adoption slowdown", "Lower renewal, rising inference cost, or financing below the prior mark"]
    notes: "Scenario values are directional boundaries around the disclosed post-money reference, not point estimates; probabilities and target returns remain unavailable without private operating data."
    claimRefs: [CV001, CV009, CV010, CV011, CV012, CV013, CV015, CV016]
