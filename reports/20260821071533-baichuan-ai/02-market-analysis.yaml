- id: drivers-constraints-and-procurement-friction
  title: Growth drivers, constraints, and procurement friction in China's domestic-model market
  body: 'Three forces pull demand in Baichuan''s favor. First, national policy is clearly supportive: the May 2026 AI-agent implementation guidelines explicitly tie AI agents to the broader "AI+" action and identify 19 target application scenarios across research, industry, consumption, public well-being, and governance. Second, IDC''s China AI outlook says 80% of China''s top-1,000 enterprises will prioritize AI sovereignty by 2027, which helps local model providers relative to blocked or politically sensitive U.S. offerings. Third, Baichuan''s own technical stance on private deployment and medical alignment fits a market that cares about local data control. But those same drivers come with frictions. The 2023 generative-AI measures mean registration, security, and content-governance work are recurring costs rather than one-time checkboxes. Healthcare buyers face added privacy and reliability scrutiny. U.S. export-control tightening on advanced AI chips increases supply risk and raises
    the value of model efficiency or domestic-chip compatibility. And a 2026 Chinese LLM price war shows that even when demand is rising, monetization can still be compressed by rival vendors willing to push list prices downward. This is why Baichuan''s market looks attractive in theory yet still difficult in practice: the company is addressing a growing domestic need, but it must do so inside one of the world''s most policy-shaped and margin-contested AI markets.'
