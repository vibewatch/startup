  - CM028
- id: TM006
  title: Healthcare AI submarket table
  columns:
  - Subsegment
  - Current workflow problem
  - Why AI is attractive
  - Baichuan fit
  - Unresolved budget / adoption question
  rows:
  - - Pre-visit symptom preparation
    - Patients arrive with incomplete or noisy information
    - LLMs can structure symptoms and triage questions
    - Baixiaoyi and pediatric products already position here
    - 'Who pays for this in production: hospital, insurer, or consumer?'
  - - Post-visit result interpretation
    - Patients struggle to understand reports and instructions
    - Chinese-language explanation lowers confusion and follow-up errors
    - Baixiaoyi and medical foundation models are built for explanation workflows
    - How much clinical liability can providers accept?
  - - Clinical decision support
    - Doctors need faster retrieval and reasoning under data/privacy constraints
    - Private deployment and evidence-anchored output are valuable
    - Baichuan markets low-hallucination medical APIs and M2 deployment efficiency
    - Actual procurement cycle length and measured ROI remain undisclosed
  - - Pediatric and grassroots care
    - Specialist scarcity is acute outside top hospitals
    - Dual-doctor and pediatric model workflow can extend expertise
    - Futang·Baichuan is direct proof of Baichuan focus here
    - How reproducible is the Beijing pilot outside flagship partners?
  - - Healthcare-service platforms
    - Need scalable AI assistance without exporting sensitive data
    - APIs plus private deployment can accelerate product launches
    - Haina Baichuan program directly targets institutions serving medical workers
    - Revenue split and customer concentration are still unknown
  notes: Rows focus on the healthcare workflows Baichuan actually markets or has shown in public partnership evidence, not every possible healthcare AI use case.
