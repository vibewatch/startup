- id: TM007
  title: Regulation and procurement gate table
  columns:
  - Gate
  - Who controls it
  - What it demands
  - Why it matters to Baichuan
  - Missing evidence
  rows:
  - - Generative AI service rules
    - CAC and related regulators
    - Security, content governance, and service registration obligations
    - Every public-facing model or app must clear these obligations
    - Baichuan-specific registration statuses are not fully itemized publicly
  - - AI-agent implementation guidance
    - CAC/NDRC/MIIT
    - Safety, standardization, and application alignment
    - Supports expansion but also sets expectations for controllability
    - How much product roadmap is directly tied to the 19 scenarios?
  - - Healthcare privacy and data localization
    - Hospitals, regulators, privacy officers
    - Sensitive-data control and secure deployment architecture
    - Strengthens demand for private deployment and on-prem options
    - Detailed architecture and audit posture are not public
  - - Clinical trust and liability
    - Hospitals and medical professionals
    - Low hallucination, evidence anchoring, supervision, disclaimers
    - Crucial because Baichuan sells into healthcare rather than generic chat only
    - Independent error-rate evidence is still thin
  - - Export-control and compute access
    - U.S. Commerce rules plus hardware supply chain
    - Potentially restricted access to advanced GPUs
    - May favor efficient or domestic-chip-compatible models but constrains scale
    - Baichuan's actual chip mix and reserve capacity are undisclosed
  notes: Policy support does not remove friction; it channels demand through concrete registration, safety, and infrastructure gates that shape deal velocity and margin.
