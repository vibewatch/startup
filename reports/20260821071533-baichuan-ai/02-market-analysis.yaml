- id: substitutes-contradictions-and-what-baichuan-can-realistically-own
  title: Status-quo substitutes, contradictory estimates, and what Baichuan can realistically own
  body: 'Baichuan''s addressable market is large only if one ignores substitution and contradictory measurement. Hospitals can still rely on human clinicians, legacy software, or a slower digital-transformation path with no generative AI layer. Enterprises can choose hyperscaler stacks such as Qwen, ERNIE, or Doubao, or build on top of multiple low-cost domestic APIs with limited switching friction. Developers can multi-home across open-weight communities and compatible chat-completions APIs. At the same time, public market estimates use different units entirely: dollars, infrastructure spend, token consumption, regulatory counts, and adoption forecasts. None of them can be added together without double counting. That is especially important for Baichuan because the company does not need the whole China AI market to be investable; it needs a credible share of the healthcare and regulated-enterprise slices where its private-deployment and medical-orientation claims matter. The evidence so
    far supports the market opportunity as real, but it does not prove how much spend Baichuan can convert into durable recurring revenue. Until procurement depth, reimbursement pathways, and customer concentration are more visible, the right stance is to treat China''s AI and healthcare tailwinds as opportunity conditions rather than as proof of Baichuan''s eventual market ownership.'
