- id: TM005
  title: Status-quo substitute and adjacency table
  columns:
  - Alternative
  - Why buyers use it
  - Why it competes with Baichuan
  - Where Baichuan may still win
  - Limitation for Baichuan
  rows:
  - - Human-only clinical workflow
    - Trusted and already embedded in hospitals
    - Avoids model risk and new procurement
    - AI can help before and after visits where clinician time is scarce
    - Clinical buyers may prefer labor plus existing software
  - - Legacy hospital or enterprise software
    - Already contracted and integrated
    - Can satisfy basic workflow without generative AI
    - Baichuan can add reasoning, explanation, and agent behavior
    - Switching requires proof of ROI and integration effort
  - - Domestic hyperscaler models (Qwen, ERNIE, Doubao)
    - Large distribution and cloud/compliance stacks
    - Offer similar API surfaces and stronger channels
    - Baichuan can differentiate on medical depth and private deployment
    - Incumbents can outspend on pricing and GTM
  - - Multi-homed open-weight stacks
    - Developers can self-host and swap providers
    - Reduces lock-in and supports cost control
    - Baichuan's medical tuning may offer better out-of-box healthcare results
    - Open-weight availability also lowers switching cost away from Baichuan
  - - Generic consumer chatbots
    - Already familiar to users
    - Can serve light informational tasks
    - Baixiaoyi is more explicitly healthcare-oriented
    - Generic consumer tools can still capture attention and low-stakes usage
  notes: Substitutes range from no-AI workflows to larger domestic model providers and open-weight multi-homing patterns.
  claimRefs:
