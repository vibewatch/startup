      - number: '5.2'
        title: 模型和智能体架构：医疗线越来越像受约束的智能体系统，而不只是聊天模型
        blocks:
          - type: paragraph
            body: >-
              公开记录中最深的技术证据，位于医疗模型谱系内部。Baichuan-M1 描述了一个从零训练的医疗模型，训练数据混合医疗和通用语料，并针对长上下文和临床推理任务做了明确架构调整。Baichuan-M2
              随后把这套栈推向真实世界推理：Large Verifier System、患者模拟器、中期训练医疗适配、多阶段强化学习，同时仍宣传某些配置可用单张 4090 部署。Baichuan-M3
              通过主动临床问询、事实感知强化学习、分段工作流奖励、OpenAI 兼容服务、推测解码和量化部署，进一步提升运行模式复杂度。M4 论文给出最清晰的架构转向：它明确界定
              Baichuan-Harness、核心推理模型和临床工具层，并加入长期患者记忆、循证检索、多模态感知、动作约束和子智能体分派。这很重要，因为它说明 Baichuan
              正尝试把医疗决策支持产品化为一套受管理的交互系统，而不只是无约束的下一个 token 生成。
