        blocks:
          - type: paragraph
            body: >-
              Baichuan 的公开成本图景碎片化，但方向清楚。公司仍在运营基础模型栈，依赖昂贵算力、频繁模型更新和专门医疗适配。美国限制 Nvidia H20
              出货，提高了中国实验室面对更高有效基础设施成本和更复杂供应路径的概率。产品层面，Baichuan 自己的代码库称 Baichuan-M2 可在单张 RTX 4090
              上运行，这有助于部分买方的私有化部署经济性，但它只降低边缘推理摩擦；它没有披露 Baichuan 自身的训练和平台账单。2026 年中国价格战是另一项主要成本侧问题。如果 Baichuan
              必须匹配一个反复降价并已固化为常态的市场，除非医疗专精真的提高支付意愿，否则利润率扩张会更难。医疗可以形成比通用聊天更好的护城河，但 36Kr 的报道认为，同一垂直领域也可能高度定制、扩张缓慢，而且以当前 To
