      - number: '3.4'
        title: 护城河耐久性：医疗专精真实存在，但仍有条件
        blocks:
          - type: paragraph
            body: >-
              Baichuan 剩下的切口是具体的，而不是宽泛的。公司有医疗优先的公开品牌、可见的医疗模型家族、儿科部署证据，以及围绕低幻觉和私有化部署的明确主张。这比许多同行的泛泛「企业 AI」叙事更具运营细节。即便
              Qwen、Kimi、DeepSeek 和 ERNIE 继续赢得通用叙事，它也给了 Baichuan 一个合理存在理由。但切口仍然有条件。Digital Applied 仍把 Baichuan
              归入第二梯队利基供应商。KrASIA 认为，中国「AI 老虎」这一批公司仍需证明自己能在巨头支持的对手面前跑出持久经济性。开放权重和 API 兼容性帮助 Baichuan
              触达开发者，也降低了切到资本更充足替代品的成本。医疗本身比消费者聊天更可能形成强护城河，但也是一个更慢、更受监管、更依赖信任的市场。因此，合理的竞争结论应保持均衡：Baichuan
              不必处处击败每个中国模型实验室，但必须在横向对手认为同一垂直领域值得重兵投入之前，把医疗叙事转化为可重复的客户胜利。
