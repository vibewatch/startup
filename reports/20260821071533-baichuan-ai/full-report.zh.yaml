  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和合规风险是最清晰的硬性外部约束
        blocks:
          - type: paragraph
            body: >-
              Baichuan 处在中国监管体系下；这个体系一边支持本土 AI 发展，一边对服务提供方要求很高。2023 年 7
              月《生成式人工智能服务管理暂行办法》明确规定，面向国内公众提供服务的提供方必须管理合法训练数据、个人信息处理、禁止内容控制、投诉机制、服务协议，以及——当服务具有舆论属性或社会动员能力时——安全评估和算法备案义务。这些不是抽象政策主题，而是运营要求，会影响新产品上线速度、模型训练方式，以及投资者应索取什么证据。Baichuan
              自己的法律界面也强化了这不是泛化风险。公司用户协议称，产品提供咨询而非医疗诊断；隐私政策强调事故响应和数据保护义务。对一家医疗导向模型公司来说，合规负担不仅落在前沿模型治理上，也落在患者相邻信任、投诉处理和个人信息纪律上。公开记录没有展示
              Baichuan 的具体 CAC 备案状态、安全评估结果或经审计合规控制，因此谨慎读法是：即便今天没有已知执法行动，监管暴露仍然重大。
