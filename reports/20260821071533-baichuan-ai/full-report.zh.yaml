      - number: '2.2'
        title: 买方分层，以及 Baichuan 似乎想占住的医疗子市场
        blocks:
          - type: paragraph
            body: >-
              对 Baichuan 最重要的市场区分，不是抽象地区分消费者和企业，而是区分受监管的医疗需求和其他一切。Baichuan 官网、Haina Baichuan 医疗 API 计划和 Futang·Baichuan
              儿科部署，都指向一个买方、用户和付款方被拆分在医院、医生、服务机构、患者以及部分公共卫生系统之间的市场。这种复杂性会拖慢商业化速度，但也创造了通用聊天应用难以自动占有的切口。TMTPost 引用 Frost &
              Sullivan 数据称，中国 AI 医疗市场将从 2023 年约 $1.2 billion 增至 2033 年 $42.5 billion；ScienceNet 和 BSIA 则显示，Baichuan
              已把自己嵌入儿科工作流，而不是等待未来试点。医疗之外，Baichuan 仍服务金融和教育领域的企业团队，也服务通过 API 或开放权重版本接入的开发者和医疗科技
              合作伙伴。这些相邻市场是真实的，但公开证据显示它们更像支撑性需求入口，不是首页身份。投资研判时，更窄但更能防守的框架是：Baichuan 瞄准的是中国医疗和受监管企业的 AI
              预算，在这些场景里，私有化部署、低幻觉率和国内数据处理比原始消费者规模更重要。
