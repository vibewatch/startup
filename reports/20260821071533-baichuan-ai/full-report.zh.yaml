      - number: '3.3'
        title: 能力、定价、分发，以及锁定效应为何难以维持
        blocks:
          - type: paragraph
            body: >-
              按当前基准测试观感，公开赢家在别处。BenchLM 的 2026 年 8 月切片由 Kimi K3 领先，并把 Qwen3.8 Max 列为最佳开放权重选项；Digital Applied 也显示
              Qwen、MiniMax、Z.ai、DeepSeek 等领导者比 Baichuan 有更清晰的周 token 份额信号。定价也不是 Baichuan 的干净救命稻草。官网称 Baichuan4-Turbo
              定价低于 GPT-4o，Baichuan4-Air 大幅降低推理成本，但 Apidog 的价格战对比显示，更广的中国市场已经在多个竞争对手之间压缩了标价。分发差异比定价还大。Qwen 搭载 Alibaba
              Cloud 和 Alibaba 应用，ERNIE 搭载 Baidu，Doubao 搭载 ByteDance，Kimi 有更好的基准和融资动能，MiniMax 和 Z.ai 已有公开市场货币，DeepSeek
              则把开放权重可信度和更深资本结合起来。这些供应商大多提供 OpenAI 式 API 轨道或可下载模型，技术切换摩擦低。这对 Baichuan
              有战略意义：公司必须靠医疗专属工作流契合、信任和部署经济性赢下买方，而不是靠泛化平台锁定效应。
