      - number: '2.4'
        title: 现状替代品、相互矛盾的估算，以及 Baichuan 现实能拿下什么
        blocks:
          - type: paragraph
            body: >-
              只有忽略替代和口径冲突，Baichuan 的可服务市场才显得巨大。医院仍可以依赖医生、传统软件，或走一条没有生成式 AI 层的慢速数字化路径。企业可以选择 Qwen、ERNIE、Doubao
              这样的超大规模云厂商栈，也可以叠加多个低价本土 API，切换摩擦有限。开发者可以在开放权重社区和兼容 chat-completions 的 API
              之间多平台使用。与此同时，公开市场估算使用的单位完全不同：美元、基础设施支出、token 消耗、监管数量和采用率预测。它们不能相加，否则会重复计算。对 Baichuan 尤其如此，因为公司并不需要整个中国 AI
              市场都可投资；它需要在医疗和受监管企业这些切片中拿到可信份额，而它的私有化部署和医疗导向主张正是在这些切片里有意义。到目前为止，证据支持市场机会真实存在，但没有证明 Baichuan
              能把多少支出转化为持久的经常性收入。在采购深度、报销路径和客户集中度更清晰之前，正确立场是把中国 AI 和医疗顺风当作机会条件，而不是 Baichuan 最终拥有市场的证明。
