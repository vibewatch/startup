      - number: '1.2'
        title: 创始人与市场契合、领导层集中度和治理可见度
        blocks:
          - type: paragraph
            body: >-
              Baichuan 领导力叙事最强的一环，是 Wang Xiaochuan 的创始人与市场契合。TechCrunch 把公司直接连到 Wang 在 Sogou
              长期积累的搜索和语言技术经验，也连到他公开呼吁中国需要自己的 OpenAI；官网和 Caixin 又把他与前 Sogou 运营负责人 Ru Liyun，以及来自中国和全球头部科技公司的团队放在一起。这个组合让
              Baichuan 更像严肃的中国基础模型竞争者，而不是营销空壳。薄弱处在治理可见度。公开材料集中在 Wang，次之是
              Ru；已审阅的官方页面没有公布董事会名单、委员会结构、财务负责人，也没有展开当前高管梯队。用户协议和隐私政策确实显示，公司在正式的中国法律框架内运营，包含海淀法院管辖条款、医疗使用免责声明和隐私响应承诺，但这些是合规界面，不是治理透明度。合适的阶段标签是商业化中的后期私营
              AI 公司：它拿过多轮大额融资，有开放平台、清晰的行业包装和真实部署主张，但仍缺少上市软件公司投资者会期待的公开控制和披露深度。
