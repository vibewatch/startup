      - number: '7.5'
        title: 风险结论与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              因此，投资问题变成：Baichuan
              能否在市场围绕它商品化之前，把一个受政策塑形、资本密集、价格受压的机会，转成以医疗为核心的、可持续的企业经济性。现有公开证据支持一个平衡但谨慎的答案。没有单一来源证明公司已经失灵；但公开证据也不足以把主要风险轻描淡写成普通创业公司的成长阵痛。正确的尽调姿态是盯住风险之间的相互作用。医疗场景高度依赖信任，监管审视因此更重要。通用模型价格已经承压，出口管制波动因此更重要。医院部署看起来是战略核心，客户不透明因此更重要。公司仍是私营且披露有限，创始人或执行集中度因此更重要。投资逻辑不是被一条新闻打断，而是在其中两三项风险相互强化时破裂——比如，芯片政策再次收紧，同时价格压缩加深，医疗部署又无法转成可重复、更高毛利的客户账户。
