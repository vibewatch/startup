            body: >-
              Baichuan
              的正向逻辑很直接：公开价格卡、可见客户和医院部署、可信投资者支持，以及独立报道显示商业化不再为零。负向逻辑同样重要。公司没有公布判断收入究竟像软件、偏服务还是靠战略补贴所需的合同条款、留存曲线、成本栈、折扣规则或利润率桥。若干最佳收入数据点也来自媒体报道，而非审计。与此同时，医疗优先转向和国内
              API 价格战形成张力：专精可能改善产品契合，但也可能把公司困在长销售周期、高定制化和预算有限的买方中。截至报告日期，Baichuan 看起来是一家严肃的商业化阶段私营 AI
              公司，有足够资本支持继续建设；但仅凭公开证据，还不能干净地研判收入质量、利润率路径或现金跑道。
