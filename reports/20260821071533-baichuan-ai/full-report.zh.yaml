      - number: '1.4'
        title: 医疗转向、里程碑节奏，以及后续章节需要继承的审慎点
        blocks:
          - type: paragraph
            body: >-
              后续章节需要承接的主要战略变化，是 Baichuan 从宽泛的前沿模型叙事转向以医疗为中心的应用栈。首页现在强调 Baixiaoyi 和 Haina Baichuan
              计划，而不是泛化的消费者聊天机器人。TMTPost 称，Wang 明确把医疗基础模型称为 AI 研究的「皇冠明珠」；GitHub、Hugging Face 和官网则展示出模型弧线：从
              Baichuan-7B、Baichuan-13B 到 Baichuan2、M1、M2、M3 和 Baichuan4。最具体的医疗里程碑，是 2025 年 3 月与 Beijing Children's
              Hospital 发布 Futang·Baichuan 儿科成果；ScienceNet 和北京软件行业协会把它描述为面向基层儿科照护的双医生部署路径。TMTPost 还补充，Baichuan-M2
              可在相对轻量的硬件上私有化部署，HealthBench 得分 60.1，并面向真实临床环境构建。这些里程碑有分量，但没有消除核心尽调疑点。公司仍很少披露治理深度、商业质量或财务韧性；KrASIA 的更宽「AI
              老虎」框架也暗示，Baichuan 仍暴露在商业模式压力下，压力来自更大的中国巨头和更显眼的前沿模型同行。
