      - number: '7.2'
        title: 算力、出口管制和技术运营风险可能快速变化
        blocks:
          - type: paragraph
            body: >-
              Baichuan 是一家中国前沿模型公司，所处市场即便国产替代在改善，仍高度依赖 Nvidia 和 CUDA 兼容生态。这带来一个 Baichuan
              无法直接控制的风险：美国出口规则的政策摇摆，以及随后中国侧的反向压力。CNBC 报道称，美国采取行动关闭一个漏洞，这个漏洞可能允许中国企业的海外子公司无需许可证获取先进芯片。Benzinga 基于 Reuters
              的报道称，H20 需要出口许可证，且中国主要买方下单超过 $16 billion，显示中国 AI 需求仍多么暴露于这条特定产品线。Yahoo 的 Reuters 报道后来显示许可证恢复，但 Business
              Standard 随后描述了中国围绕 H20 出货的安全担忧和生产暂停。Baichuan
              得到的教训不只是「芯片稀缺」。真正风险在于，硬件可得性、价格和部署规划都可能在几乎没有预警的情况下双向摆动。产品效率工作、更小的私有化部署占用和国产芯片适配或许能缓冲冲击，但无法消除算力受限政策环境带来的运营不确定性。
