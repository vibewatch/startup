      - number: '7.3'
        title: 竞争、价格战和依赖风险更威胁利润率，而不是需求相关性
        blocks:
          - type: paragraph
            body: >-
              Baichuan 最可能的失败方式不是马上失去相关性，而是经济性被挤压。公司有足够的产品深度，也拿出了医疗场景证据，仍然值得被关注；但它卖进的是中国大语言模型市场，定价、分发和基准领先权已经被
              Qwen、DeepSeek、Doubao、Z.ai、Moonshot、MiniMax 等资金更厚或渠道更强的对手塑形。Apidog 2026 年价格战调查、Digital Applied 的服务商份额报告，以及
              KrASIA 对「AI 老虎」的表述，都指向同一个结论：中国大语言模型市场很活跃，但并不宽容。开放权重和 OpenAI 式 API 通道降低客户评估摩擦，也降低切换成本。战略投资人和渠道伙伴能提高生存概率，但
              Baichuan 缺少 Alibaba、Baidu、ByteDance
              那种内置云、搜索或社交分发引擎。公司因此更依赖产品专业化、销售执行，以及医院或企业场景验证。利润率风险尤其突出：通用模型价格持续下压，医疗部署却可能更慢、更定制化，也更难标准化。
