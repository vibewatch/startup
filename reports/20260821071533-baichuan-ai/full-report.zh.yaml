      - number: '4.4'
        title: 资本充足性和融资依赖：Baichuan 背后资金强，但公开流动性可见度仍弱
        blocks:
          - type: paragraph
            body: >-
              公开记录中支撑最强的财务优势是融资能力，不是现金生成。Tracxn 称 Baichuan 已完成 4 轮融资、累计约 $1.04 billion；CB Insights 显示累计融资 $1.038
              billion，2026 年 4 月估值接近 $2.9 billion，且 Series B 包括 37 Interactive。TMTPost、Yahoo/SCMP 和 36Kr 也印证了 2024 年 7
              月由中国头部战略方和国资相关基金领投的大额融资。这让 Baichuan 在中国当前 AI
              融资体系内看起来可融资。但资本充足性不同于资本可得性。公开材料仍没有经审计现金余额、月度烧钱披露、债务时间表或现金跑道模型。36Kr 的反向文章引用一位未具名行业人士估计称，Baichuan 手头仍有超过
              RMB3 billion，但这不是管理层级别证据。实践结论是，Baichuan 的短期偿付能力因为股东基础够深而看起来合理，但投资判断仍依赖私下流动性数据，而不是公开资产负债表证明。
