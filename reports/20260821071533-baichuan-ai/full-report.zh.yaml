  - id: TV005
    title: 投资逻辑破裂和止损触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 医疗验证不能变现
        - 下一轮复盘周期内，具名医疗部署仍像试点或偏项目制
        - 击穿溢价差异化的核心论据
        - 将公允价值推向悲观区间，并把医疗视为信用背书而非护城河
      - - 国内价格重置再次加深
        - 中国前沿 API 价格大范围明显下探，且没有足够溢价需求抵消
        - 同时压缩毛利率和倍数假设
        - 下调估值区间，并要求证明溢价留存
      - - 算力政策冲击
        - 美国新限制或中国侧 GPU 停摆明显损害供应规划
        - 放慢模型路线图并抬高基础设施成本
        - 下调增长假设并提高下行概率
      - - 合规缺口浮现
        - 产品缺少必要备案 / 评估证据，或面临正式行动
        - 把可管理风险变成直接估值损伤
        - 暂停新的投资评估，直到修复
      - - 收入质量不透明持续
        - 资料室仍缺少分部毛利率、集中度、续约和优先权清晰度
        - 即使表面估值看似合理，也无法支撑投资判断
        - 保持观察 / 继续研究，而不是上调
    notes: 关键估值杀手是组合事件：同时削弱经济性和信心。
    claimRefs:
