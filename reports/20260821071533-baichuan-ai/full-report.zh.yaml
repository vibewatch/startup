      - number: '7.4'
        title: 医疗商业化与执行风险，仍是最难穿透的内部投资判断题
        blocks:
          - type: paragraph
            body: >-
              Baichuan 的医疗重心既是战略差异化，也是一项高要求的经营选择。已有具名医院案例，M 系列加上 Futang-Baichuan 叙事也是实打实的优势。但关于公司的最佳反向报道指出，医疗 To B
              项目可能高度定制，数据接入分散，医院采购慢，百万元人民币级年度项目成本对客户仍可能偏贵。这让医疗切口两面性很强。它能提高产品匹配度和信任，也可能把公司困在服务含量高的实施、续约质量不清晰、低毛利定制里。Caixin
              报道的 2025 年签约目标和财务章节的收入信号说明商业化在推进，但仍无法回答业务中有多少是经常性软件收入，多少是项目制部署。与此同时，公开记录对管理层梯队深度、客户集中度，以及创始人 Wang
              Xiaochuan 个人影响之外的组织韧性披露仍薄。实际风险在于，Baichuan 在医疗方向可能判断正确，却要同时扛住前沿模型研发、监管义务、企业销售和医院级交付，运营上被拉得过紧。
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
