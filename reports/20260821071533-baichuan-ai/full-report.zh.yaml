  - id: TR005
    title: 风险缓释与止损标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - CAC / AI 治理不合规
        - 监管备案缺口、调查通知或产品暂停
        - 任何正式执法行动、上线公开产品缺少强制备案，或被迫回滚服务
        - 暂停评估医疗主导扩张，直到合规证据补齐
      - - 算力供应冲击
        - 美国新限制、中国侧采购停摆或成本明显飙升
        - 连续 2+ 个季度失去合规 Nvidia 供应，或发生重大被迫迁移成本
        - 上调基础设施成本假设，并大幅下调增长 / 毛利率预期
      - - 医疗部署经济性失效
        - 具名医院验证不能转化为软件式经常性收入
        - 连续两个重大医疗部署仍偏项目制，且缺少扩张或续约证据
        - 将医疗切入点视为信任背书，而非变现护城河
      - - 国内价格战加深
        - 竞争对手前沿 API 价格再次下探，而 Baichuan 无法证明溢价定价
        - 市场再次广泛重定价，且没有企业锁定效应或垂直行业付费意愿抵消
        - 压缩估值倍数；新资金评估前要求毛利率桥接证据
      - - 客户集中 / 不透明持续
        - 对头部客户、续约或分部组合没有可用披露
        - 尽调后期资料室仍缺少集中度、NRR 和合同层级可见度
        - 因经济性仍无法支撑投资判断，从「可跟踪风险」移向「投资逻辑破裂」区间
    notes: 关键投资逻辑破裂触发因素来自政策动作、合同证据和部署经济性，而不是模糊叙事恶化。
