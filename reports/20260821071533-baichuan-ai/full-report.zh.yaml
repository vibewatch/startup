  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 已确认收入和毛利率桥接
        - 没有公开的经审计分部损益或毛利率桥接
        - 估值取决于 Baichuan 到底像软件公司、偏服务，还是靠战略补贴支撑
        - 要求按 API、企业部署和医疗产品提供月度或季度收入，并按产品线提供毛利率
      - - 客户集中度和续约
        - 没有公开 NRR/GRR、头部账户敞口或合同期限披露
        - 具名客户如果没有续约和集中度数据，不能证明持久价值
        - 要求提供前 10 大客户、续约率、队列扩张和试点到生产转化
      - - 股权结构表和优先权条款
        - 上一轮估值公开，优先股堆叠不公开
        - 回报算术取决于清算优先权、按比例跟投权和附函
        - 要求提供最新股权结构表、优先权条款和任何投资人特定保护
      - - GPU / 云承诺
        - 没有公开算力合同或供应商敞口拆分
        - 基础设施成本和路线图风险是下行情景核心
        - 要求提供云支出、GPU 库存、供应商集中度和备选情景
      - - 按产品划分的监管状态
        - Baichuan 具体 CAC 备案 / 评估证据未公开
        - 合规滑坡会同时损害增长和估值信心
        - 要求提供上线产品的备案编号、评估结果和内部合规签字
    notes: 这些问题是把 Baichuan 从有意思的公司推进到可大额承做投资所需的最低材料包。
