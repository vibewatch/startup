companyProfile:
  summary: |
    Baichuan AI 由 Wang Xiaochuan 于 2023 年在北京创立，如今已是中国知名度较高的私营基础模型创业公司之一。
    公司最初押注更宽泛的中国 LLM 机会，之后把医疗 AI 打成最鲜明的公开切口，同时保留企业模型平台、开源开发者入口和企业工作流工具。
    产品栈包括通用 Baichuan 模型、医疗 M 系列模型、Bai Xiaoyi 面向消费者和健康场景的入口，以及支持私有化部署和智能体式
    工作流的企业 API / 平台层。公开护城河证据最强的地方在医疗，尤其是与 Beijing Children's Hospital 相关的
    Futang·Baichuan 儿科工作；公司也在营销金融和教育用例。
