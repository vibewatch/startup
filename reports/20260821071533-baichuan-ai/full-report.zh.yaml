      - number: '8.3'
        title: 乐观、基准、悲观情景与建议
        blocks:
          - type: paragraph
            body: >-
              合理的乐观情景存在。它要求 Baichuan 把医疗可信度转成可重复的企业经济性，证明 2025 年签约是真实且可转化的业务，而不主要是试点阶段承诺，并守住足够定价权，让国内 API
              价格战不至于抹掉毛利潜力。在这个世界里，今天的估值标记可能显得保守，估值升至 $3B 中段到 $4B
              中段变得说得通。基准情景更谨慎。公开证据最强的是战略方向和产品相关性，不是经审计经济性。公司真实、有资金、也有差异化，但仍难以高确信度承销。这把最可辩护的现值区间压在约 $2.0B-$2.6B，也让 2026 年
              4 月估值显得合理偏满。悲观情景不是破产，而是商业化不达预期。如果医疗 To B 仍然定制化且受预算约束，如果价格竞争加深，或者硬件和合规摩擦拖慢部署，Baichuan 的公允价值可能跌向约
              $1.0B-$1.6B。这样的分布支持继续研究 / 观察建议，而不是按最后公开价格给出买入判断。
