      - number: '5.5'
        title: 信任、安全、合规和技术风险：产品明确定位为辅助工具，这很谨慎，但也定义了当前上限
        blocks:
          - type: paragraph
            body: >-
              Baichuan 的公开医疗材料对安全边界说得格外直接。用户协议称平台不构成诊断或处方；M3 卡片称它用于研究 / 参考，并应在专业指导下使用；M4
              论文称，输出不得替代医生判断，也不得直接用于最终诊断、治疗计划、处方或紧急关键决策。这是严肃医疗 AI 栈应有的姿态，但也说明 Baichuan
              卖的是受控决策支持，而不是自主医疗。同一批文件还暴露了更深的技术风险：罕见病局限、图像偏差风险、长尾泛化问题，以及对可靠检索、记忆管理和工具约束的高度依赖。隐私和安全控制主要在政策层面讨论，但公开的运行证据在正常运行时间、事故报告、外部审计和真实世界错误率上仍然很薄。结果是，这套产品栈看起来技术野心强，也比通用聊天部署更安全，但仍需要在生产可靠性、合规运营和临床治理上拿出更强的独立证明。
