figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Baichuan 在三年内从成立走到开放模型发布、战略融资，并形成医疗优先的商业化姿态。
    data:
      items:
        - date: '2023-03-24'
          label: 公司成立
          details: 官网显示 Baichuan 由 Wang Xiaochuan 于 2023-03-24 创立。
          tone: positive
        - date: '2023-04-10'
          label: 天使轮
          details: Tracxn 记录公司上线后不久获得 $50M 天使融资。
          tone: positive
        - date: '2023-06-15'
          label: Baichuan-7B 发布
          details: 早期开放权重发布让公司进入中国 LLM 早期排名。
          tone: positive
        - date: '2023-07-11'
          label: Baichuan-13B 可见度跃升
          details: TechCrunch 报道 13B 双语模型和 Wang 的创始人叙事。
          tone: positive
        - date: '2023-10-17'
          label: 战略融资
          details: Alibaba/Tencent/Xiaomi 支持的融资轮加深了战略股东背书。
          tone: positive
        - date: '2024-07-25'
          label: RMB5B Series A 轮
          details: TMTPost 和 Tracxn 指向公司已披露的最大一轮融资，估值约 $2.7B。
          tone: positive
        - date: '2025-03-20'
          label: Futang·Baichuan 儿科模型
          details: Baichuan 与 Beijing Children's Hospital 推出儿科 AI 模型和双医生工作流。
          tone: positive
        - date: '2025-09-07'
          label: Baichuan-M2 发布
          details: 医疗推理模型发布，强化医疗切入点。
          tone: positive
        - date: '2025-09-07'
          label: 私有部署主张
          details: TMTPost 称，M2 面向医院可在一张 RTX 4090 和国产芯片上运行。
          tone: positive
        - date: '2026-04-01'
          label: Series B 已记录
          details: CB Insights 记录由 37 Interactive 参与的 Series B，投后估值接近 $2.9B。
          tone: positive
        - date: '2026-08-01'
          label: AI 虎群压力显现
          details: KrASIA 将 Baichuan 放在一组仍需对抗巨头、证明持久经济性的公司中。
          tone: warning
        - date: '2026-08-21'
          label: 医疗优先首页
