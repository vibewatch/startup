    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：Baichuan 位于中国模型领导者第一梯队之后
        blocks:
          - type: paragraph
            body: >-
              Baichuan 的竞争集合比「AI 老虎」叙事更宽，但比整个中国 AI 经济更窄。Digital Applied 的 2026 年 Q2 格局报告称，10 家供应商基本覆盖了所有有意义的中国 AI
              输出，Alibaba、Z.ai、DeepSeek、Moonshot、MiniMax、ByteDance、Baidu、Tencent、Xiaomi 和 StepFun 吃掉大部分份额和能见度，Baichuan、Yi
              等则落在第二梯队的利基带。这个框架有用，因为它把 Baichuan 与三类对手拆开。第一类是 Z.ai、Moonshot、MiniMax、DeepSeek 这样的纯创业公司同行，它们当前的规模信号都强于
              Baichuan。第二类是 Qwen、ERNIE、Doubao 这样的内嵌大厂模型家族，背后有云、搜索或消费者生态，而 Baichuan 没有。第三类是开放权重和 API
              生态，许多供应商提供相似技术接口，买方可以多平台使用。Baichuan
              自己的公开材料让公司看起来比这些通才更窄：官网突出医疗和家庭健康工作流，而不是宽泛的消费者助手或云平台。因此，竞争分析从一个简单观察开始：Baichuan
              不是在争做万能的中国模型领导者；它要证明的是，一个医疗优先的专科玩家能在更大的横向对手面前活下来。
