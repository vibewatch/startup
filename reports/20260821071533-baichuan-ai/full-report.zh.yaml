chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围和当下可见的运营足迹
        blocks:
          - type: paragraph
            body: >-
              Baichuan AI 现在的公开身份比「中国 LLM 创业公司」这个泛标签更具体。官网称，公司由前 Sogou CEO Wang Xiaochuan 于 2023-03-24
              创立，使命是帮助公众获取世界知识和专业服务，核心团队来自 Sogou、Baidu、Huawei、Microsoft、ByteDance 和
              Tencent。官网还把运营地点锚定在北京海淀区，列出百川智能科技有限公司这个法律品牌以及互联网服务、医疗信息备案号。这个细节重要，因为 Baichuan 不再只把自己呈现为模型实验室。首页主推
              Baixiaoyi AI 家庭医生、Haina Baichuan 医疗 API 计划，以及围绕更安全、更低幻觉医疗使用的应用层承诺。同时，平台站点和 API 文档显示，Baichuan 仍在运营更宽的企业栈：通用
              Baichuan4 模型、工具调用 API、企业智能体，以及金融和教育垂直定位。因此，一句话概括：Baichuan 是一家总部位于北京的私营模型公司，可见商业化层已经转向医疗，但没有放弃更大的平台野心。
