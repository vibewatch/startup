      - number: '8.2'
        title: 可比框架与倍数读法
        blocks:
          - type: paragraph
            body: >-
              看 Baichuan 估值，最有用的镜头不是单一直接可比公司，因为这样的公司不存在。Alibaba、Baidu 等中国上市平台巨头按低个位数市销率交易，反映的是更成熟、增长更慢但披露强得多的业务。Nvidia
              的倍数高得多，但它是全球算力平台，收入规模和公开市场流动性都异常强。中国私营 AI 创业公司的可比样本又讲了另一套故事：Moonshot 据报道的 $20B 融资、DeepSeek 估值超过 CNY330B
              的巨额融资，以及 MiniMax 的公开融资或 IPO 路径，都说明市场愿意为可见规模、基准动能或消费者分发支付多高溢价。Baichuan 还没有这一层级的公开证明。Digital Applied
              的服务商份额研究和竞争章节都把 Baichuan 放在二线但仍可信的专业玩家位置，而不是通用模型赢家组的顶部。这意味着 Baichuan 相比上市在位企业应拿到一定私募 AI
              成长溢价，但也应相对资金最足的突围实验室折价。因此，当前 $2.8B 估值按相对位置看可以理解；但把客户不透明、医疗项目风险和价格压缩纳入后，并不明显便宜。
