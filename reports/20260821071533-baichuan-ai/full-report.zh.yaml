  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 支柱
      - 投资逻辑
      - 反向逻辑
      - 哪些证据会改变判断
    rows:
      - - 医疗差异化
        - Baichuan 拥有真实的医疗模型和医院验证，这是许多通用型对手缺少的。
        - 医疗验证仍可能偏服务、推进慢，且难以用软件式毛利率变现。
        - 来自多个上线医疗部署的续约、扩张和毛利率数据。
      - - 商业化动能
        - 订单目标、具名客户和可见价格界面显示，公司已不再是零收入实验。
        - 公开信号尚未证明收入质量、留存或客户集中纪律。
        - 经审计收入桥接和分部留存。
      - - 相对同业创业公司的定价
        - Baichuan 定价远低于 Moonshot 和 DeepSeek 这类突破型私人市场龙头。
        - 那些估值更高的同业也有更强的公开规模、消费端分发或资本市场证明。
        - 证据需显示：即便可见度较低，Baichuan 的医疗切入点也能带来更强韧性。
      - - 相对上市巨头的溢价
        - 如果 Baichuan 复合增长更快，相对 Baidu 或 Alibaba 享有私人 AI 成长溢价可以成立。
        - 上市巨头已经披露规模，交易倍数接近低个位数 P/S；Baichuan 需要证明更强的增长溢价，但目前证据还不够。
        - 更清晰的增长、毛利率和可复制性证据。
      - - 战略可选性
        - 医疗、企业 AI 和开源分发叠加，给公司留下多条胜出路径。
        - 战线太多也可能意味着焦点分散、烧钱更高、变现更模糊。
        - 更细的产品线经济性和资源配置披露。
    notes: 这张表把公司质量和特定价格下的可投资性拆开；这正是核心估值问题。
