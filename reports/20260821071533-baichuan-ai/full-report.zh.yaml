            body: >-
              Baichuan 当前的公开品牌主打医疗，但底层产品地图明显更宽。官网、价格页和平台首页合在一起，至少展示了四个可见产品层：Baichuan4-Turbo、Baichuan4-Air
              等通用基础模型；面向医疗、金融、教育和角色 / NPC 用途的领域增强线；带知识库和工具调用功能的企业智能体平台；以及通过 GitHub、Hugging Face 和研究论文分发的开放权重模型。Bai
              Xiaoyi 把医疗栈变成面向用户的家庭医生工作流；NPC 领域线则显示，Baichuan 仍支持角色型智能体，而不只做医院或临床软件。实践中，这意味着 Baichuan 应被理解为一个平台：它可以以
