              或客户集中度。即便最强的医疗证明，也没有说明部署是否付费、是否经常性、是否扩张。开发者下载显示的是漏斗顶部热度，不是已变现留存。因此，本章可以支持可重复采用路径，但还不能以机构级信心支持持久客户经济性。
