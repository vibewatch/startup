  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式和价格界面：Baichuan 通过 API 用量、工具和企业项目变现，但实际收益率仍不透明
        blocks:
          - type: paragraph
            body: >-
              Baichuan 的公开材料让变现入口比损益表更容易看见。官方价格卡显示，通用模型、医疗模型、搜索插件、向量嵌入、文件存储和暂时免费的 Assistants API
              都采用按用量付费。文档还显示，自助式开发者路径仍需要实名认证、充值和创建 API key；企业文档则把更大买方导向商务咨询流程。这意味着收入设计是混合型，而非纯 SaaS：边缘是自助 token
              收入，中间是销售驱动的部署和集成，战略核心则通过 Hai Na Baichuan 计划培育医疗生态。难点在实际定价。公开标价无法说明大客户折扣、捆绑支持、收入确认，或 Baichuan
              的医疗足迹有多少是在补贴换分发，而不是直接变现。财务上，价格界面是真实的；留存下来的收益率仍未公开。
