      - number: '2.3'
        title: 中国本土模型市场的增长驱动、约束和采购摩擦
        blocks:
          - type: paragraph
            body: >-
              有三股力量把需求拉向 Baichuan。第一，国家政策明确支持：2026 年 5 月 AI 智能体实施指引把 AI 智能体与更广的「AI+」行动直接绑定，并列出科研、产业、消费、民生和治理等 19
              个目标应用场景。第二，IDC 中国 AI 展望称，到 2027 年，中国 1,000 强企业中 80% 将优先考虑 AI 主权，这让本土模型供应商相对受阻或政治敏感的美国产品更占优。第三，Baichuan
              自己在私有化部署和医疗对齐上的技术立场，贴合一个重视本地数据控制的市场。但同一批驱动也带来摩擦。2023 年生成式 AI
              办法意味着，备案、安全和内容治理不是一次性勾选，而是持续成本。医疗买方还会追加隐私和可靠性审查。美国对先进 AI 芯片收紧出口管制，增加供给风险，也抬高了模型效率或国产芯片兼容性的价值。2026 年中国 LLM
              价格战还显示，即便需求在增长，愿意压低标价的竞争对手仍会挤压变现。这就是 Baichuan 的市场理论上诱人、实践中难做的原因：公司面对的是增长中的国内需求，但必须在全球政策塑形最重、利润率争夺最激烈的 AI
              市场之一中执行。
