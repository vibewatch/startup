      - number: '5.3'
        title: 部署、集成和工作流：Baichuan 正在从 API 自助到辅助私有化部署之间优化多种运行模式
        blocks:
          - type: paragraph
            body: >-
              Baichuan 的部署叙事相对于私营中国模型实验室而言格外明确。API 文档展示了常规自助流程：认证、充值、API key 设置和 JSON 端点；平台页和 NPC
              页面则反复把更大客户导向商务咨询和辅助上手。企业平台页还列出内部工作流栈：数据处理、增量预训练、微调、PPO/DPO 强化学习、评估、压缩、模型部署、知识库和工具调用。这说明 Baichuan
              卖的不只是原始推理；它把自己定位为可在客户工作流中适配和部署模型的垂直赋能层。开放权重侧，GitHub 和 Hugging Face 材料给出基于 transformers、vLLM 和 SGLang
              的具体服务指南。医疗侧，ScienceNet 和 BSIA 显示，产品可以嵌入儿科和医院工作流，而不是停留在演示。缺点是，每种运行模式都会带来支持负担、集成风险，以及不同买方之间变化的信任要求。
