  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和规模测算：Baichuan 到底在卖什么
        blocks:
          - type: paragraph
            body: >-
              不能按整个中国 AI 或半导体经济给 Baichuan 做投资测算。公开页面显示，它的变现层窄得多，但仍然可观：国内模型 API、企业 /
              智能体工作流、医疗部署，以及面向金融和教育的选择性垂直包装。官网和开放平台通过 Baixiaoyi、医疗 API 计划、通用企业模型，以及工具调用、结构化输出等 API 功能，把这个边界讲得很清楚。这把
              Baichuan 放在 Forrester 所说更大基础设施热潮的下游，也放在医院和受监管企业的终端工作流预算上游。因此，公开市场口径应彼此拆开，不能硬塞进一个假的单一 TAM。IMARC 估计，中国生成式 AI
              应用市场 2025 年约 $5.16 billion，到 2034 年增至 $19.56 billion。Gartner 和 Forrester 描述的是全球 AI 支出和中国 AI
              基础设施中更大的相邻资金池；China Daily 和 IDC 则显示 token 消耗扩张速度远快于任何已经稳定的收入基础。对 Baichuan
              来说，正确读法是分层市场：应用和模型用量真实存在，但最宽的支出池只有一部分归它，因为云基础设施、芯片和通用企业软件都在它的直接变现轨道之外。
