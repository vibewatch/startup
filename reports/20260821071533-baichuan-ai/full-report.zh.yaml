      - number: '8.4'
        title: 最终尽调问题与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              缺失的尽调工作异常具体。投资人主要不需要更多 Baichuan
              雄心叙事；他们需要能把雄心转成可承销价值的经济性。最高优先级问题包括分部收入结构、头部客户集中度、医疗与通用企业客户的续约或扩张、项目服务负担、毛利率桥、GPU
              和云承诺，以及最新一轮附带的任何优先权条款或附函。同样重要的是，投资人需要公司层面证据，确认面向公众的线上产品是否取得 CAC 或备案状态，因为医疗 AI
              是一个合规错误能迅速污染估值的领域。若两件事同时发生，投资逻辑就会破裂：商业化证据持续不透明，而外部压力恶化。实际表现可能是国内价格重置更剧烈、医疗部署转化更慢、算力政策冲击，或有证据显示当前估值假设的收入质量强于公司能够证明的水平。除非这些缺口闭合，正确姿态是纪律性跟踪，而不是热情承销。
