        title: 商业化代理指标：公开订单和客户信号存在，但仍不足以形成清晰的经常性收入视图
        blocks:
          - type: paragraph
            body: >-
              Baichuan 已不再只是没有收入证据的研究实验室。Caixin 报道称，联合创始人 Ru Liyun 预计 2025 年签约订单额为 RMB1-2 billion；36Kr 的反向报道则称，公司 To B
              业务 2024 年收入接近 RMB100 million。同一篇 36Kr 文章列出 Bank of China、NE Digital、China Merchants Bank、Xinyada 和 Tiankai
              Group 等客户和合作伙伴；ScienceNet 和 BSIA 则记录了儿科和医院部署。这些是有意义的需求信号，因为它们显示 Baichuan
              已从模型发布走进真实企业和医疗工作流。但证据仍有大洞。签约订单不等于确认收入，一次性定制项目也不等于持久的经常性软件利润率。公开记录同样没有拆分当前需求中有多少来自付费推理、付费部署，或免费向医疗机构开放
              M3-Plus 这类受补贴战略项目。
