      - number: '3.2'
        title: 竞争者画像：融资、产品范围和战略方向
        blocks:
          - type: paragraph
            body: >-
              最强的纯创业公司同行，在公开资本和能见度上都领先 Baichuan。TechCrunch 称，Moonshot 在 2026 年 5 月按 $20 billion 估值融资 $2 billion；CNBC
              称，MiniMax 在香港 IPO 中募资约 $619 million，大部分收入来自订阅和应用内购买。TrendForce 称，DeepSeek 以超过 CNY 330 billion 的估值融资超过 CNY
              50 billion，瞬间拉开了相对 Baichuan 低得多的公开估值区间的资产负债表差距。Z.ai/GLM 围绕企业部署和国产硬件韧性定位；Alibaba 的 Qwen
              则置于一个足够宽的云和应用生态中，可覆盖代码、多模态和企业工作流。Baidu 和 ByteDance 在分发上更难攻击，因为 ERNIE 可以借 Baidu 的巨大装机基础，Doubao
              可以借消费者入口。Baichuan 明显更窄。它最广为宣传的资产是 M2/M3 等医疗模型、儿科部署证据，以及更便宜的医疗导向部署主张，而不是大众应用领导地位或全国基准统治力。这个策略是连贯的，但也意味着
              Baichuan 选择的战场比领导者更小。
