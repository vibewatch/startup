  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 定价背景与当前估值标记
        blocks:
          - type: paragraph
            body: >-
              Baichuan 的估值故事有一个硬锚，也有几个软锚。硬锚是 2026 年 4 月 Series B 融资，据报道估值约 $2.8B，累计融资处于高数亿美元区间，战略投资人包括 37
              Interactive、Xiaomi 和 Alibaba Cloud。这不是种子期或科研项目估值，而是商业化阶段 AI
              公司的估值标记。但公司仍处在私募市场里一个典型区间：估值可以跑在披露前面。公开证据显示，公司有真实的收入表面、具名医院案例和企业牵引信号；但投资人通常用来支撑私募估值的经审计输入——确认收入、续约质量、分部利润率、项目制与软件收入结构、客户集中度、优先权条款——仍然缺位。实际含义是，Baichuan
              当前估值不能单独读成低估或高估的清晰证明。更合理的读法是：市场为中国医疗 AI 与更广泛企业模型平台的战略可选性协商出的价格。公开证据足以支撑继续关注，但不足以支撑不计价格买入。
