      - number: '1.3'
        title: 融资路径、投资者基础，以及封面指标能支撑什么、不能支撑什么
        blocks:
          - type: paragraph
            body: >-
              Baichuan 的融资记录显示，这家仍未上市的中国模型公司得到了异常深的战略支持，但不同来源对具体轮次时间线并不完全一致。TechCrunch 称，公司在 2023 年成立后很快融资 $50
              million。TMTPost 随后记录了 2023 年 Alibaba 和 Tencent 的战略支持，以及 2024 年 7 月由 Alibaba、Xiaomi 和 Tencent 领投、CICC 和国资
              AI 基金参投的一轮更大融资。Tracxn 的时间线方向一致：2023 年 10 月 $300 million 轮、2024 年 4 月未披露金额轮，以及 2024 年 7 月按 $2.7 billion
              投后估值完成的 $691 million 轮。CB Insights 把记录延伸到 2026 年 4 月 1 日，称 Baichuan 最新投后估值约 $2.9 billion，并明确列出 37
              Interactive Entertainment 是 Series B 投资方。最稳妥的结论不是一份干净、由公司认证的股权结构表，而是一个有支撑的区间：Baichuan 累计融资约 $1.0
              billion，估值从 2024 年中约 $2.7 billion 走到 2026 年 Series B 时约 $2.8-2.9
              billion。同样重要的是缺口：已审阅的公开来源没有披露经审计收入、ARR、客户数、员工数、烧钱速度或 Series B 的确切募资额。
