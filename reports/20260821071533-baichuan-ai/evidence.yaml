evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-transparency
    missingEvidence: Board roster, committee structure, CFO or finance leader identity, and any formal governance charter.
    whyItMatters: Without governance disclosure it is hard to assess investor protections, oversight quality, and succession depth.
    diligencePath: Request board materials, latest cap table, executive roster, and governance documents directly from management.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: series-b-terms
    missingEvidence: Exact Series B amount, security terms, preference stack, voting rights, and ownership impact.
    whyItMatters: Valuation without proceeds and terms does not show dilution, cash runway extension, or downside protection.
    diligencePath: Obtain financing docs or management confirmation of the April 2026 round structure and economics.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Audited revenue, ARR, customer count, headcount, and any disclosed burn or runway.
    whyItMatters: >-
      These metrics are necessary to judge commercial quality, capital efficiency, and whether valuation is supported by
      operating traction.
    diligencePath: Request the latest audited financial package and KPI dashboard by product and customer segment.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: minor
    topic: headquarters-normalization
    missingEvidence: One canonical registered office and principal operating office statement.
    whyItMatters: The city is clear, but normalized legal-entity records matter for diligence files and later regulatory checks.
    diligencePath: Verify registered office, principal office, and any office move history against registry documents.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: healthcare-budget-capture
    missingEvidence: >-
      Signed contract values, procurement cycles, reimbursement support, and renewal behavior for healthcare
      deployments.
    whyItMatters: >-
      Market size does not translate into revenue without proof of how hospitals or health-service institutions actually
      buy and renew.
    diligencePath: Request customer-by-segment bookings, procurement cycle data, and any reimbursement or hospital-budget evidence.
    relatedQuestionRefs:
      - QM021
      - QM024
  - type: missing-source
    severity: material
    topic: clinical-liability-and-outcomes
    missingEvidence: Independent error-rate, hallucination-rate, or clinical-outcome evidence for Baichuan deployments.
    whyItMatters: Healthcare willingness to pay depends on trust and measurable workflow quality, not only on general market growth.
    diligencePath: Obtain independent evaluation studies, hospital case studies, and safety-monitoring metrics.
    relatedQuestionRefs:
      - QM021
  - type: conflicting-data
    severity: minor
    topic: market-sizing-methodology
    missingEvidence: One reconciled methodology linking application-spend, token-usage, and healthcare-submarket estimates.
    whyItMatters: The available market lenses are directionally helpful but not additive; valuation work must avoid double counting.
    diligencePath: >-
      Build an investor model from bottom-up buyer counts and expected contract sizes instead of relying on syndicated
      top-down estimates.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: baichuan-market-share
    missingEvidence: Baichuan's actual share of healthcare AI, enterprise API usage, or regulated-deployment wins.
    whyItMatters: >-
      Without share or conversion data, the chapter can only describe favorable demand conditions, not proven market
      ownership.
    diligencePath: Request segment revenue mix, API usage by vertical, and named-customer deployment depth from management.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: Baichuan healthcare moat proof
    missingEvidence: Signed customer counts, repeat contracts, retention, and budget share for healthcare deployments.
    whyItMatters: Without proof of customer capture, the healthcare wedge is still a narrative rather than a demonstrated moat.
    diligencePath: Request segment revenue, named healthcare customers, renewal data, and deployment depth by institution.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: material
    topic: Competitive switching behavior
    missingEvidence: >-
      Direct buyer interviews showing why customers choose Baichuan over Qwen, DeepSeek, or Z.ai and how often they
      multi-home.
    whyItMatters: >-
      Competitive intensity is high and API compatibility lowers switching friction, so qualitative buyer evidence
      matters.
    diligencePath: Interview customers, partners, or integrators who evaluated multiple Chinese model providers.
    relatedQuestionRefs:
      - QP012
      - QP013
  - type: private-evidence-only
    severity: material
    topic: Baichuan pricing and margin realization
    missingEvidence: Net contract pricing, discounts, and gross-margin outcomes versus public list-price signals.
    whyItMatters: The chapter can describe the price war but not Baichuan's realized economics inside it.
    diligencePath: Request price books, discount corridors, gross-margin bridges, and customer-level monetization data.
    relatedQuestionRefs:
      - QP010
      - QP015
  - type: conflicting-data
    severity: minor
