- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Hospital proof to broader healthcare rollout
    - customer proof may still be concentrated in a small set of marquee hospitals
    - healthcare moat could look stronger than actual installed base
    - Request full hospital customer list, live-site count, and production expansion status.
  - - Developer downloads to paid enterprise usage
    - open-source popularity may not convert cleanly into API or deployment revenue
    - large top-of-funnel could still monetize weakly
    - Request conversion from downloads or evaluations into paid accounts and ACV tiers.
  - - Platform logos to real contracts
    - logos may overstate production maturity or current spend
    - commercial traction can be misread from marketing collateral
    - Request logo-by-logo mapping of pilot, production, and churned accounts.
  - - Medical To B customization
    - projects may be too bespoke and costly to scale efficiently
    - customer growth can add services burden faster than retained software margin
    - Review implementation hours, support cost, and standardized deployment package usage.
  - - Consumer Bai Xiaoyi route
    - shift toward To C may broaden reach but dilute focus or monetization discipline
    - customer mix may become harder to evaluate across consumer and institutional buckets
    - Request product-line revenue mix, repeat usage, and user acquisition cost by surface.
  notes: Expansion logic exists, but each path has a different conversion and concentration risk.
