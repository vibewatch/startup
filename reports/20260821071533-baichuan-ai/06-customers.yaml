  rows:
  - - Bai Xiaoyi individual users
    - individual / individual or family / mostly user today
    - pre-visit triage, post-visit explanation, household health management
    - officially visible product surface but no public MAU or payer count
    - important To C awareness and future funnel into healthcare services
