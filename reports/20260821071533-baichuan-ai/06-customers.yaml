    - label: Platform logos / ecosystem
      values:
      - label: low-medium
        tone: warning
        detail: Many recognizable logos are visible, but logos alone are weak proof.
      - label: low
        tone: warning
        detail: Outcome specificity is mostly absent.
      - label: low
        tone: warning
        detail: Production maturity cannot be inferred from logos.
      - label: low
        tone: warning
        detail: No durability data at all.
  approximationNotes: The matrix ranks proof quality rather than customer value. It distinguishes truly named workflow evidence from broad but shallow marketing collateral.
