figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Baichuan's customer journey differs by segment, but most routes run from low-friction evaluation into higher-trust or higher-value deployment only after domain fit is established.
  data:
    items:
    - label: Discover / awareness
      detail: Users encounter Bai Xiaoyi, hospital launch coverage, open-source releases, or Baichuan's enterprise platform.
      touchpoints:
      - Bai Xiaoyi
      - medical launch news
      - GitHub / Hugging Face
      - platform homepage
    - label: Evaluate / trial
      detail: Developers download models, enterprises request demos, and hospitals evaluate safety, fit, and workflow utility.
      touchpoints:
      - download
      - API test
      - consultation
      - hospital assessment
    - label: Initial use / pilot
      detail: Usage begins through consumer interactions, self-hosted tests, API proofs of concept, or controlled institutional workflows.
      touchpoints:
      - consumer chat
      - prototype
      - pilot deployment
      - department test
    - label: Production / supervised deployment
      detail: The strongest public proof appears where Baichuan enters supervised medical or enterprise workflows with named institutions.
      touchpoints:
      - Beijing Children's Hospital
      - Cancer Hospital
      - enterprise workflow
      - private deployment
    - label: Expand / renew / switch
      detail: The next step should be expansion into more departments or workflows, but renewal and retention metrics are mostly undisclosed.
      touchpoints:
      - department expansion
      - new workflow
      - renewal
      - unknown churn
  approximationNotes: This journey map is inferred from the public product and customer surfaces rather than from a disclosed internal funnel.
  claimRefs:
  - CU001
  - CU005
  - CU010
  - CU016
  - CU018
  - CU023
- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: wide
  summary: Baichuan's adoption funnel is visible at the top but much less measured at the bottom where retention and expansion should be proven.
  data:
    nodes:
    - id: discover
      label: Awareness / discovery
      description: Users encounter Bai Xiaoyi, the platform homepage, open-source releases, or medical launch coverage.
    - id: evaluate
      label: Evaluation
      description: Developers download models, hospitals assess fit, or enterprises enter consultation and trial workflows.
    - id: deploy
      label: Initial deployment
      description: Products move into self-hosted tests, API usage, or named institutional workflows.
    - id: expand
      label: Expansion
      description: Potential next step is more departments, more workflows, or migration into broader paid contracts.
    - id: blind
      label: Retention blind spot
      description: Public sources do not disclose renewal, NRR, churn, or concentration by segment.
    edges:
    - from: discover
      to: evaluate
      label: try / download / contact
    - from: evaluate
      to: deploy
      label: pilot / integrate / use
    - from: deploy
      to: expand
      label: if value proven
    - from: expand
      to: blind
      label: public metrics missing
  approximationNotes: The flow intentionally ends in a measurement gap because the public record is much stronger on top-of-funnel discovery than on down-funnel durability.
  claimRefs:
  - CU007
  - CU008
  - CU010
  - CU017
  - CU024
  - CU025
