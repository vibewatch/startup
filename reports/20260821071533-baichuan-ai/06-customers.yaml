- id: durability-repeat-usage-and-expansion
  title: Durability, repeat usage, and expansion
  body: 'Durability is where the Baichuan customer story becomes much less complete. There is enough public evidence to show adoption paths: a consumer/app surface, hospital pilots or deployments, enterprise API and private-deployment lanes, and open-source developer distribution. There is also a plausible land-and-expand logic: free or low-friction open-weight usage can lead to API usage; medical institutions can begin with evaluation or subsidized access and later move to private deployment; enterprise agent-platform projects can expand from one workflow into several. But that logic is still mostly inferred. Baichuan does not publicly disclose NRR, GRR, churn, renewal rates, contract length, seat growth, cohort curves, CSAT, or customer concentration. Even the strongest healthcare proof does not clarify whether deployments are paid, recurring, or expanding. Developer downloads show top-of-funnel energy, not monetized retention. As a result, the chapter can support repeatable adoption routes,
    but not yet durable customer economics with institutional confidence.'
  claimRefs:
  - CU007
  - CU008
  - CU016
  - CU017
  - CU023
  - CU024
  - CU025
  - CU026
  tableRefs:
  - TU004
  figureRefs: []
- id: concentration-procurement-and-customer-risks
  title: Concentration, procurement, and customer risks
  body: 'Customer quality is constrained by several visible risks. First, the most persuasive customer proof is clustered in healthcare and a limited set of enterprise references, which raises concentration questions that the public record cannot answer. Second, 36Kr argues that medical To B commercialization is hard because hospital data is siloed, deployment is highly customized, and million-yuan annual project costs can still feel expensive for hospitals that are not structured as profit-maximizing buyers. Third, Baichuan''s own legal and product disclaimers keep the medical system in an assistive posture rather than a fully autonomous care role, which is prudent but narrows the category of workflows that can convert quickly into high-trust revenue. Finally, platform logos and partner names are not the same as retained high-value contracts. The customer verdict is therefore balanced: Baichuan has stronger named proof than many private model labs, especially in healthcare, but procurement
    friction, sparse retention metrics, and uncertain concentration still block a clean customer-quality underwrite.'
