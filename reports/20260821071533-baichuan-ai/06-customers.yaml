- id: adoption-and-usage-signals
  title: Adoption and usage signals
  body: 'The public adoption picture is strongest when user groups are separated. Bai Xiaoyi and the broader medical app layer show that Baichuan is not purely a backend API provider; it is trying to meet end users in pre-visit and post-visit care flows. ToolChase independently describes the consumer product as free with daily quotas, while also saying the open-source model family is popular with developers and researchers. The M3 technical blog adds an important bridge between research and customer proof by saying that M2 attracted hundreds of thousands of downloads after release. For enterprise and institutional usage, the best scale clues are more qualitative: visible logos, named hospital deployments, and named To B customers in media reporting. Caixin''s 2025 bookings target and the financial chapter''s revenue proxy suggest these customer surfaces are not purely experimental. But public adoption data still lacks active account counts, monthly active users, or installed-site counts
    outside a few named medical examples.'
  claimRefs:
  - CU001
  - CU007
  - CU008
  - CU009
  - CU010
