    - label: Named enterprise customers in 36Kr
      values:
      - label: medium
        tone: positive
        detail: Specific enterprise names are public.
      - label: low-medium
        tone: warning
        detail: Outcome and workflow specificity are limited.
      - label: low-medium
        tone: neutral
        detail: Relationship appears real but current status is unknown.
      - label: low
