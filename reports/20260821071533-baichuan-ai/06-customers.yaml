- id: named-customer-proof-and-production-maturity
  title: Named customer proof and production maturity
  body: Baichuan's best named customer proof is in healthcare. BSIA and ScienceNet both document the Futang-Baichuan pediatric model with Beijing Children's Hospital, and TMTPost adds that Baichuan had already deployed AI pediatricians there while also citing use at the Cancer Hospital of the Chinese Academy of Medical Sciences. These are not generic logos; they are workflow-specific healthcare references tied to named institutions. On the broader enterprise side, the evidence quality drops a notch but remains meaningful. 36Kr says Baichuan's 2024 commercial-services arm brought in customers and partners such as Bank of China, NE Digital, China Merchants Bank, Xinyada, and Tiankai Group. The platform homepage also shows logos from Tencent, Xiaomi, Intel, Didi, iQiyi, 58.com, and others, but those logos alone do not tell us production depth, spend, or retention. The right reading is that Baichuan has real deployment and account proof, yet production maturity varies by segment and is much
    stronger in hospitals than in general enterprise disclosure.
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU006
  - CU011
  - CU012
  - CU013
  - CU015
  - CU020
