company:
  name: Baichuan AI
chapter:
  number: 6
  title: Customers
  summary: 'Baichuan AI has more customer proof than its public revenue disclosure might suggest, but the proof is uneven. The strongest named evidence sits in healthcare deployments such as Beijing Children''s Hospital and the Futang-Baichuan pediatric model, plus reported hospital use at the Cancer Hospital of the Chinese Academy of Medical Sciences. The strongest broad-enterprise evidence sits in Baichuan''s platform logos and a 36Kr report naming Bank of China, NE Digital, China Merchants Bank, Xinyada, and Tiankai Group as customers or partners in its 2024 commercial-services effort. The strongest developer evidence is open-weight distribution through GitHub and Hugging Face plus reports of hundreds of thousands of downloads. What remains weak is durability: Baichuan does not publicly disclose NRR, GRR, churn, contract length, production expansion, or customer concentration. The customer story is therefore real but still more deployment-and-access proof than fully underwritten retention
    proof.'
sections:
- id: customer-segmentation-and-surfaces
  title: Customer segmentation and surfaces
  body: 'Baichuan''s customer map is broader than the healthcare-first narrative alone. Official pages show at least five outward-facing user groups: individual/family users interacting with Bai Xiaoyi; hospitals and medical-service institutions evaluating or deploying M-series products; enterprise API buyers and agent-platform customers; developers and self-hosters downloading open weights; and non-medical vertical buyers in banking, insurance, education, retail, manufacturing, and terminal-device contexts. The platform homepage strengthens that view by listing many recognizable enterprise logos and industry solution lanes, while the cooperation page invites developers, enterprises, and organizations into a sales-assisted funnel. Financially and strategically, these are not equal segments. Hospitals offer high-trust proof and vertical credibility. Enterprises offer the path to larger contracts. Developers widen distribution and adoption but do not automatically equal paying accounts. Consumer
    medical experiences such as Bai Xiaoyi create awareness and a potential To C route, but their commercial durability is the least transparent in the public record.'
