    - evidence-backed medical API usage and embedded workflows
    - qualification-based free and paid access are public, but institution count is not
    - creates ecosystem reach and potential land-and-expand path
    - free usage versus paid conversion is undisclosed
  - - Enterprise API and agent-platform accounts
    - IT/operations lead / internal users / company
    - summarization, agent workflows, knowledge base, vertical automation
    - platform logos plus reported customers and partners in finance/enterprise
    - most plausible scalable B2B contract layer outside healthcare
    - logos and named customers do not show spend or retention
  - - Developer and self-hosting community
    - developer / developer / self-funded or employer-funded
    - download, benchmark, self-host, prototype, fine-tune
