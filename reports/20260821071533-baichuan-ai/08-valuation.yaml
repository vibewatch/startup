    - RMB0.8B-RMB1.2B revenue-quality path with mixed project/software economics
    - RMB0.3B-RMB0.6B path with slow conversion and weak pricing power
  - - Gross-margin direction
    - Software-like mix improves as medical and enterprise deployments standardize
    - Margins improve slowly because services and discounting remain material
    - Price war and customization keep margin thin
  - - Customer quality
    - Named hospital and enterprise proof expands into repeat accounts across several verticals
    - Some strong accounts exist, but concentration and renewal remain only partly proven
    - Pilot-heavy or bespoke accounts dominate
  - - Valuation multiple logic
    - High-growth private AI specialist premium still justified
    - Moderate private-growth premium, but below breakout labs
    - Discount toward lower private or public-tech multiple zone
  - - Implied current valuation range
    - ~$3.4B-$4.5B
    - ~$2.0B-$2.6B
    - ~$1.0B-$1.6B
  - - New-money return logic from $2.8B entry
    - 1.2x-1.6x on current value; 2x+ plausible at successful next mark or exit
    - Capital largely works only if execution improves and dilution stays reasonable
    - Down-round or low-return outcome becomes plausible
  - - Key trigger
    - Healthcare wedge proves repeatable and premium-priced
    - Commercialization continues but remains mixed-quality
    - Medical To B stalls, price war deepens, or compliance/compute shock hits execution
  notes: Scenario bands are heuristic and evidence-backed rather than pseudo-precise DCF outputs. The public record is too thin for a clean audited cash-flow model.
