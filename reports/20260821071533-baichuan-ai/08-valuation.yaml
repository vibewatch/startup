- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Alibaba
    - Public market cap and P/S
    - ~$312.9B market cap; ~2.15x P/S
    - Shows what a large disclosed Chinese AI/cloud platform can trade at in public markets
    - Too mature and diversified to be a direct startup comp
  - - Baidu
    - Public market cap and P/S
    - ~$31.2B market cap; ~1.71x P/S
    - Useful China AI platform comp with direct model exposure and public disclosure
    - Still much broader and more mature than Baichuan
  - - Nvidia
    - Public market cap and P/S
    - ~$5.25T market cap; ~20.7x P/S
    - Illustrates how exceptional AI infrastructure scale can command very rich multiples
    - Not a relevant direct operating comp for a private Chinese model startup
  - - Moonshot AI
    - Private round valuation
    - ~$20B reported May 2026 valuation
    - Shows premium attached to breakout Chinese AI startup with stronger consumer visibility
    - Reported private mark with limited public financial disclosure
  - - DeepSeek
    - Private funding valuation
    - '>CNY330B reported valuation in 2026 funding round'
    - Shows how much premium capital markets can assign to a breakout technical winner
    - Exceptional outlier; not a clean benchmark for Baichuan
  - - MiniMax
    - Public financing / IPO signal
    - ~$619M raised in Hong Kong IPO; stronger market visibility than Baichuan
    - Indicates capital-market access for a better-known Chinese AI peer
    - IPO proceeds are not identical to enterprise value or durable economics
  - - Baichuan AI current mark
    - Latest disclosed private mark
    - ~$2.8B Series B reported April 2026
    - Anchor for current underwriting and return math
    - Needs deeper cap-table, preference, and revenue-quality context
  notes: 'The comp set is intentionally mixed: public incumbents for floor multiples, frontier public AI infrastructure for premium context, and Chinese AI private or financing marks for relative startup positioning.'
  enumerationScope:
    coverage: partial
    basis: Rows cover the most decision-relevant public and private anchors available from retained sources; many private peers remain too opaque for rigorous comp work.
