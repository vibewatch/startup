- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - pillar
  - thesis
  - anti-thesis
  - what would change the view
  rows:
  - - Healthcare differentiation
    - Baichuan has real medical-model and hospital proof that many generalist rivals lack.
    - Healthcare proof can still remain services-heavy, slow, and hard to monetize at software-like margins.
    - Renewal, expansion, and margin data from multiple live medical deployments.
  - - Commercialization momentum
    - Bookings target, named customers, and visible pricing surfaces show the company is beyond zero-revenue experimentation.
    - Public signals do not yet prove revenue quality, retention, or concentration discipline.
    - Audited revenue bridge and segment-level retention.
  - - Relative pricing vs peer startups
    - Baichuan is priced far below Moonshot and DeepSeek-style breakout private leaders.
    - Those richer peers also have stronger public scale, consumer distribution, or capital-market proof.
    - Evidence that Baichuan’s healthcare wedge creates superior durability despite lower visibility.
  - - Premium vs public incumbents
    - A private-AI-growth premium over Baidu or Alibaba can be rational if Baichuan compounds faster.
    - Public incumbents already disclose scale and trade near low-single-digit sales multiples, so Baichuan needs a stronger growth premium than it has yet proven.
    - Clearer growth, margin, and repeatability evidence.
  - - Strategic optionality
    - Healthcare plus enterprise AI plus open-source distribution create multiple ways to win.
    - Multiple surfaces can also mean diffuse focus, higher burn, and blurry monetization.
    - Tighter product-line economics and resource-allocation disclosure.
  notes: This table separates company quality from investability at a specific price, which is the central valuation question.
