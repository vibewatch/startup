  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Audited revenue, margin, and product-line mix
    missingEvidence: No audited public financial package shows recognized revenue, gross margin, or project-versus-software mix for Baichuan’s businesses.
    whyItMatters: Valuation ranges can shift materially depending on whether healthcare commercialization is software-like, services-heavy, or strategically subsidized.
    diligencePath: Request audited or investor-grade monthly/quarterly P&L by API, enterprise deployment, and medical products with gross-margin bridge.
    relatedQuestionRefs:
    - QV003
    - QV015
    - QV017
    - QV019
    - QV025
    relatedTableRefs:
    - TV003
    - TV006
    - TV004
  - type: private-evidence-only
    severity: material
    topic: Customer concentration and renewal quality
    missingEvidence: The public record does not show top-customer exposure, contract length, NRR/GRR, or pilot-to-production conversion by segment.
    whyItMatters: Hospital logos and named enterprise references are not enough to support a premium multiple without durable customer-quality evidence.
    diligencePath: Request top-10 customer list, revenue concentration, renewal rates, and expansion metrics by healthcare and enterprise segment.
    relatedQuestionRefs:
    - QV014
    - QV020
    - QV022
    - QV028
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: Cap-table preferences and investor protections
    missingEvidence: The last round valuation is public, but liquidation preferences, anti-dilution, participation, side letters, and pro-rata protections are not.
    whyItMatters: Return math for new or secondary investors depends on the true cap-table stack, not only the headline post-money number.
    diligencePath: Request latest cap table, term sheet, side letters, and waterfall model under bull/base/bear exits.
    relatedQuestionRefs:
    - QV001
    - QV020
    - QV028
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: minor
    topic: Company-specific compliance status for live products
    missingEvidence: Public materials do not show detailed CAC filing or assessment evidence for each live public-facing Baichuan surface.
    whyItMatters: A compliance gap could impair both commercialization and exit readiness faster than a normal product miss.
    diligencePath: Request filing numbers, assessment outcomes, and product-level compliance owners for each live service.
    relatedQuestionRefs:
    - QV023
    - QV028
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
