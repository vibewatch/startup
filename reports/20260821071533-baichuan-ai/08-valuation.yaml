- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Healthcare proof does not monetize
    - Named medical deployments remain pilot-like or project-heavy across the next review cycle
    - Destroys the main argument for premium differentiation
    - Move fair value toward the bear range and treat healthcare as credibility, not moat
  - - Domestic price reset deepens again
    - Broad Chinese frontier API pricing falls materially without offsetting premium uptake
    - Compresses gross-margin and multiple assumptions together
    - Lower valuation range and require evidence of premium retention
  - - Compute-policy shock
    - New U.S. restriction or China-side GPU halt meaningfully impairs supply planning
    - Slows model roadmap and raises infrastructure cost
    - Cut growth assumptions and raise downside probability
  - - Compliance gap emerges
    - Product lacks required filing / assessment evidence or faces formal action
    - Turns a manageable risk into a direct valuation impairment
    - Pause new underwriting until remediated
  - - Revenue-quality opacity persists
    - Data room still lacks segment margins, concentration, renewal, and preference clarity
    - Makes even a fair-looking headline mark non-underwritable
    - Stay in track / research-more mode rather than upgrade
  notes: The key valuation killers are combination events that weaken both economics and confidence at the same time.
  claimRefs:
