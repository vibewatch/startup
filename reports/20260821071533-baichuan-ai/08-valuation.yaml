  - CV031
  - CV035
  - CV036
  - CV037
  - CV038
  - CV039
  - CV040
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner / diligence path
  rows:
  - - Recognized revenue and margin bridge
    - No audited segment P&L or gross-margin bridge is public
    - Valuation hinges on whether Baichuan is software-like, service-heavy, or strategically subsidized
    - Request monthly or quarterly revenue by API, enterprise deployment, and medical products plus gross margin by line
  - - Customer concentration and renewal
    - No public NRR/GRR, top-account exposure, or contract-length disclosure
    - Named customers do not prove durable value without renewal and concentration data
    - Request top-10 customers, renewal rates, cohort expansion, and pilot-to-production conversion
  - - Cap-table and preference terms
    - Last round valuation is public, preference stack is not
    - Return math depends on liquidation preferences, pro-rata rights, and side letters
    - Request latest cap table, preference terms, and any investor-specific protections
  - - GPU/cloud commitments
    - No public compute contract or vendor exposure breakdown exists
    - Infrastructure cost and roadmap risk are central to downside cases
    - Request cloud spend, GPU inventory, vendor concentration, and fallback scenarios
  - - Regulatory status by product
    - Company-specific CAC filing / assessment evidence is not public
    - Compliance slippage would impair both growth and valuation confidence
    - Request filing numbers, assessment outcomes, and internal compliance sign-offs for live products
  notes: These asks are the minimum package required to move from interesting company to fully underwritable investment at size.
