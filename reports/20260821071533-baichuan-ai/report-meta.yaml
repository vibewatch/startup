coverageNotes: |
  Public evidence is strong enough to show that Baichuan is a real commercialization-stage AI company with meaningful funding,
  named healthcare proof, open-source and API distribution, and a reported April 2026 Series B valuation around $2.8B-$2.9B.
  But the public record remains thin on audited revenue, segment margins, customer concentration, retention, cap-table preferences,
  and company-specific compliance status for live products. Recommendation and valuation stance are therefore evidence-sensitive.
