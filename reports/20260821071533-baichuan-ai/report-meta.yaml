  topStrengths:
    - Baichuan has a real healthcare wedge with named pediatric deployment proof, which is more differentiated than many generic Chinese model labs.
    - The company has visible product breadth across open-source models, APIs, enterprise workflows, and health-facing applications rather than a single narrow surface.
    - Funding support and strategic investors give Baichuan more staying power than a lightly capitalized frontier-model startup.
    - Reported bookings ambition and named enterprise or hospital references suggest commercialization is beyond zero-revenue experimentation.
  topRisks:
    - Public evidence on revenue quality, retention, concentration, and margin remains too thin for conviction at the last reported valuation.
    - Chinese API price compression, plus hospital-grade customization burden, can squeeze both multiple support and gross-margin potential.
    - Compute-policy volatility and company-specific compliance status remain meaningful valuation overhangs in a healthcare-adjacent AI business.
    - Baichuan appears strategically credible but still trails breakout Chinese AI winners on public scale, distribution, and financial visibility.
  unresolvedGaps:
    - No audited public financial package shows recognized revenue, gross margin, or project-versus-software mix by product line.
    - Top-customer concentration, contract length, renewal, and cohort expansion metrics remain non-public.
    - The latest cap table, liquidation preferences, and any investor-specific protections are not publicly disclosed.
    - Product-by-product CAC filing or security-assessment status for live public-facing services is not publicly visible.
