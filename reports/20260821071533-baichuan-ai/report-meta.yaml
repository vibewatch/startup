  productSummary: |
    Baichuan sells and distributes general foundation models, medical-specialized models, API access, and enterprise workflow
    tooling. Public materials show a combination of self-serve developer access, enterprise consultation, and healthcare-linked
    deployment surfaces, including open-source model releases and private-deployment-friendly medical offerings.
  customerFocus: Hospitals and healthcare institutions, enterprise AI teams, developers/self-hosters, and selected consumer health users via Bai Xiaoyi.
  businessModel: Usage-based API pricing, enterprise deployment and licensing, healthcare-focused solutions, and adjacent workflow products.
  stage: late-stage private
  fundingStatus: Reported April 2026 Series B at roughly $2.8B-$2.9B valuation; tracker data suggests about $1.0B cumulative capital raised with strategic investors including 37 Interactive, Xiaomi, and Alibaba Cloud.
