  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Independent production reliability and monitoring evidence
    missingEvidence: The public source set does not include status-page history, deployment-level error dashboards, uptime SLAs, or post-market monitoring reports for Baichuan's medical deployments.
    whyItMatters: Technical sophistication alone does not prove safe or reliable production behavior in regulated workflows.
    diligencePath: Request uptime history, incident logs, model-monitoring dashboards, and deployment QA reports for live hospital or enterprise environments.
    relatedQuestionRefs:
    - QE021
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: Detailed architecture and governance for non-medical product lines
    missingEvidence: The public record is much richer for the medical stack than for the finance, education, or role-model lines, leaving cross-line maturity unevenly documented.
    whyItMatters: A buyer or investor could overgeneralize medical-stack quality to the rest of the platform without enough proof.
    diligencePath: Request internal architecture docs, release notes, and customer references for non-medical product families.
    relatedQuestionRefs:
    - QE003
    - QE004
    - QE023
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: Clinical governance and hospital deployment operating model
    missingEvidence: Independent deployment proof exists, but public sources do not describe supervision protocols, human-review loops, escalation rules, or indemnity structure in enough detail.
    whyItMatters: Medical AI trust depends on governance and accountability, not only model quality.
    diligencePath: Request hospital SOPs, clinician review requirements, escalation paths, and legal/compliance materials for live deployments.
    relatedQuestionRefs:
    - QE019
