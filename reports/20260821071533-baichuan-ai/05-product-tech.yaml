chapter:
  number: 5
  title: Product & Technology
  summary: 'Baichuan AI no longer looks like a single Chinese base-model release train. Its public surface now spans enterprise general models, a healthcare-first M-series, Bai Xiaoyi family-doctor workflows, role/NPC models, an agent platform with knowledge base and tool calling, and open-weight releases distributed through GitHub and Hugging Face. The strongest technical evidence sits in the medical stack: M1 shows from-scratch medical pretraining and architectural changes, M2 adds a Large Verifier System and lightweight private deployment path, M3 adds fact-aware RL and OpenAI-compatible serving options, and M4 reframes the product as a clinical agent system with memory, tools, retrieval, multimodal perception, and safety constraints. The opportunity is real, but so are the trust and implementation risks: many claims are still company-authored, medical outputs remain assistive rather than autonomous, and the product stack depends on external bases, inference frameworks, and enterprise
    deployment discipline.'
sections:
- id: product-surface-and-module-map
  title: 'Product surface and module map: Baichuan ships a wider product family than its healthcare-first branding initially suggests'
  body: 'Baichuan''s current public brand leads with healthcare, but the underlying product map is materially broader. The homepage, pricing page, and platform homepage together show at least four visible product layers: general-purpose foundation models such as Baichuan4-Turbo and Baichuan4-Air; domain-enhanced lines for medical, finance, education, and role/NPC use; an enterprise agent platform with knowledge base and tool-calling features; and open-weight models distributed through GitHub, Hugging Face, and research papers. Bai Xiaoyi turns the medical stack into a user-facing family-doctor workflow, while the NPC domain line shows that Baichuan still supports character-style agents rather than only hospital or clinical software. In practice, that means Baichuan should be understood as a platform that can appear as an API, a private deployment package, a verticalized model family, or a consumer-like healthcare interaction layer. The product surface is therefore coherent but not simple:
    it is one stack exposed through multiple delivery modes for different customers and trust thresholds.'
