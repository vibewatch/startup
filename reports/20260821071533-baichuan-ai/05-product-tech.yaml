- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / process / component
  - role
  - dependency
  - risk
  rows:
  - - Base models and inherited backbones
    - provide the underlying model family from general to medical
    - Qwen2.5-32B for M2; Qwen3 base for M3; prior Baichuan/Baichuan2 family for general line
    - dependence on outside bases can narrow proprietary moat and create adaptation debt
  - - Medical training and verifier systems
    - align models to clinical inquiry and safer reasoning
    - patient simulators, verifier systems, medical data curation, multi-stage RL
    - quality depends on internal evaluation design that outside buyers cannot easily audit
  - - Agent runtime / Harness layer
    - keeps training and deployment behavior aligned for tool use and constraints
    - Baichuan-Harness, action guards, memory system, subagent dispatch
    - complex runtime increases safety surface and operational debugging burden
  - - Retrieval and knowledge-base stack
    - grounds outputs in evidence and enterprise documents
    - embedding model, vector retrieval, sparse retrieval, evidence ranking
    - retrieval quality and source governance materially affect hallucination and trust
  - - Inference and serving layer
    - turns weights into deployable APIs or private endpoints
    - Transformers, vLLM, SGLang, quantization, speculative decoding
    - framework compatibility and GPU configuration can become support bottlenecks
  - - Multimodal perception tools
    - handle OCR, X-rays, dermatology, and clinical-document parsing
    - vision-language models, OCR pipelines, image-analysis tools
    - image bias, format variation, and edge-case failure can create clinical risk
  - - Enterprise adaptation toolchain
    - customizes models for customer domains
    - data processing, incremental pretraining, fine-tuning, PPO/DPO RL, evaluation, compression, deployment
    - services-heavy adaptation can increase implementation cost and reduce repeatability
  notes: The architecture stack is assembled from official platform pages, repos, model cards, and papers. Where the company does not publish implementation specifics, the row focuses on the role and dependency rather than low-level internals.
