- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - CAC / AI-governance noncompliance
    - Regulatory filing gap, investigation notice, or product suspension
    - Any formal enforcement action, missing mandatory filing for a live public product, or forced service rollback
    - Pause underwriting of healthcare-led expansion until compliance evidence is remediated
  - - Compute-supply shock
    - New U.S. restriction, China-side procurement halt, or visible cost spike
    - Loss of access to compliant Nvidia supply for 2+ quarters or major forced migration cost
    - Raise infrastructure-cost assumptions and reduce growth / margin expectations materially
  - - Healthcare deployment economics fail
    - Named hospital proofs do not convert into recurring software-like revenue
    - Two consecutive major medical deployments remain project-heavy without expansion or renewal evidence
    - Treat healthcare wedge as credibility asset, not monetization moat
  - - Domestic price war deepens
    - Competitor frontier API prices fall again while Baichuan cannot demonstrate premium pricing
    - Another broad market price reset without offsetting enterprise lock-in or vertical willingness to pay
    - Compress valuation multiple and require margin bridge before new capital underwriting
  - - Customer concentration / opacity persists
    - No usable disclosure on top accounts, renewals, or segment mix
    - Data room still lacks concentration, NRR, and contract-tier visibility late in diligence
    - Move from “trackable risk” toward thesis-break territory because economics stay non-underwritable
  notes: The key thesis-break triggers are observable from policy actions, contract evidence, and deployment economics rather than from vague narrative deterioration.
