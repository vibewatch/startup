  - type: private-evidence-only
    severity: minor
    topic: Management bench depth and attrition by function
    missingEvidence: The public evidence set does not show full org design, succession depth, or attrition by product, medical, research, or commercialization functions.
    whyItMatters: Execution and talent risk are hard to underwrite when the public narrative centers heavily on a founder and a few flagship products.
    diligencePath: Request org chart, key-man dependencies, attrition statistics, and succession or redundancy planning for critical functions.
