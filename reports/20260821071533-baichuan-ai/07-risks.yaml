  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Specific CAC filing and security-assessment status
    missingEvidence: The public source set does not disclose Baichuan’s product-by-product CAC filing numbers, security-assessment outcomes, or regulator correspondence.
    whyItMatters: Regulatory risk cannot be cleared from general law alone; the company-specific compliance state matters.
    diligencePath: Request all CAC-related filings, assessment outcomes, policy memos, and product scope analyses for each public-facing service.
    relatedQuestionRefs:
    - QR003
    - QR006
    - QR028
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: material
    topic: GPU procurement, cloud commitments, and domestic-chip fallback
    missingEvidence: There is no public disclosure of Baichuan’s GPU inventory, cloud commitments, vendor concentration, export-license exposure, or domestic-chip substitution plan.
    whyItMatters: Compute volatility is one of the company’s highest residual risks and directly affects cost, roadmap, and customer delivery.
    diligencePath: Request GPU and cloud contracts, vendor mix, inventory age, domestic fallback tests, and scenario modeling under tighter U.S. or China-side constraints.
    relatedQuestionRefs:
    - QR007
    - QR008
    - QR009
    - QR010
    relatedTableRefs:
    - TR002
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: Customer concentration, renewals, and revenue quality by segment
    missingEvidence: The public record does not provide top-customer concentration, renewal rates, NRR/GRR, pilot-to-production conversion, or margin by healthcare versus general enterprise business.
    whyItMatters: Named hospital or enterprise proofs do not establish durable economics without concentration and retention visibility.
    diligencePath: Request cohort retention, revenue bridges, top-account exposure, contract length, and project-versus-software margin by product line.
    relatedQuestionRefs:
    - QR017
    - QR020
    - QR021
    - QR025
    relatedTableRefs:
