chapter:
  number: 7
  title: Risks
  summary: Baichuan AI’s risk profile is not one binary red flag; it is a compounding stack. The biggest hard risks are formal Chinese AI compliance duties, unstable cross-border GPU policy, fierce domestic price compression, healthcare-deployment economics that can become services-heavy, and a disclosure gap around retention, concentration, and governance depth. Baichuan has mitigants—visible capital backing, product efficiency work, named hospital proof, and a broader platform than a pure medical app—but the residual exposure remains high because the company is operating inside one of the world’s most policy-shaped and margin-sensitive AI markets.
sections:
- id: regulatory-legal-and-compliance-risk
  title: Regulatory, legal, and compliance risk is the clearest hard external constraint
  body: Baichuan operates under a Chinese regulatory regime that is simultaneously supportive of domestic AI development and demanding on service providers. The July 2023 Interim Measures for Generative AI Services make clear that providers serving the domestic public must manage lawful training data, personal-information handling, prohibited content controls, complaint mechanisms, service agreements, and—where services have public-opinion or social-mobilization attributes—security assessment and algorithm-filing obligations. Those are not abstract policy themes; they are operational requirements that affect how quickly new products can ship, how models can be trained, and what evidence an investor should ask for. Baichuan’s own legal surfaces reinforce that this is not a generic risk. The company’s user agreement says the product offers consultation rather than medical diagnosis, while the privacy policy stresses incident response and data-protection obligations. For a healthcare-oriented
    model company, that means compliance burden sits not only in frontier-model governance but also in patient-adjacent trust, complaint handling, and personal-information discipline. The public record does not show Baichuan’s detailed CAC filing status, security-assessment outcomes, or audited compliance controls, so the prudent reading is that regulatory exposure is material even without a known enforcement action today.
