  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary and sizing lenses: what Baichuan is actually selling into'
        blocks:
          - type: paragraph
            body: >-
              Baichuan should not be underwritten against the full Chinese AI or semiconductor economy. Its public
              surfaces show a much narrower, but still substantial, monetization layer: domestic model APIs,
              enterprise/agent workflows, healthcare deployment, and selective vertical packaging for finance and
              education. The official site and open platform make that boundary clear by advertising Baixiaoyi, a
              medical API program, general-purpose enterprise models, and API features such as tool calling and
              structured output. That places Baichuan downstream of the larger infrastructure boom Forrester cites and
              upstream of end-user workflow budgets inside hospitals and regulated enterprises. The public market lenses
              therefore should stay separate instead of being forced into a fake single TAM. IMARC estimates China's
              generative-AI applications market at about $5.16 billion in 2025, growing toward $19.56 billion by 2034.
              Gartner and Forrester describe a much larger adjacent pool in worldwide AI spend and China AI
              infrastructure, while China Daily and IDC show that token consumption is scaling much faster than any
              settled revenue base. For Baichuan, the right read is a layered market: applications and model usage are
              real, but the broadest spend pools only partially belong to the company because cloud infrastructure,
              chips, and generic enterprise software sit outside its direct monetization rail.
