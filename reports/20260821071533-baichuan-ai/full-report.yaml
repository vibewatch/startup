      - number: '4.3'
        title: >-
          Cost structure and capital intensity: healthcare specialization may improve product fit, but it does not make
          the model business cheap
        blocks:
          - type: paragraph
            body: >-
              Baichuan's public cost picture is fragmentary but directionally clear. The company still operates a
              foundation-model stack that depends on expensive compute, frequent model updates, and specialized
              healthcare adaptation. US restrictions on Nvidia H20 shipments raise the probability that Chinese labs
              face higher effective infrastructure cost and more complicated supply routing. At the product level,
              Baichuan's own repo says Baichuan-M2 can run on a single RTX 4090, which helps private deployment
              economics for some buyers, but that only reduces inference friction at the edge; it does not reveal
              Baichuan's own training and platform bill. The 2026 Chinese price war is the other major cost-side
              problem. If Baichuan has to match a market where repeated price cuts became permanent, margin expansion
              becomes harder unless medical specialization truly raises willingness to pay. Healthcare can create a
              better moat than generic chat, but 36Kr's reporting argues the same vertical can also be highly
              customized, slow to scale, and not obviously profitable in its current To B form.
