      - number: '1.3'
        title: Funding path, investor base, and what the cover metrics do and do not support
        blocks:
          - type: paragraph
            body: >-
              Baichuan's financing record shows unusually deep strategic support for a still-private Chinese model
              company, but the exact round chronology is not perfectly standardized across sources. TechCrunch says the
              company raised $50 million quickly after launch in 2023. TMTPost then documents strategic backing from
              Alibaba and Tencent in 2023 and a much larger July 2024 financing led by Alibaba, Xiaomi, and Tencent
              alongside CICC and state AI funds. Tracxn's timeline is directionally consistent, listing a $300 million
              October 2023 round, an undisclosed April 2024 round, and a $691 million July 2024 round at a $2.7 billion
              post-money valuation. CB Insights extends the record to April 1, 2026, saying Baichuan's latest post-money
              valuation was about $2.9 billion and explicitly naming 37 Interactive Entertainment as a Series B
              investor. The safest takeaway is not a clean, company-certified cap-table story but a supported range:
              Baichuan has raised about $1.0 billion cumulatively, with valuation moving from roughly $2.7 billion in
              mid-2024 to roughly $2.8-2.9 billion by the 2026 Series B. What remains missing is equally important: no
              reviewed public source disclosed audited revenue, ARR, customer count, headcount, burn, or exact Series B
              proceeds.
