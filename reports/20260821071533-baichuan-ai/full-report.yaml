    sections:
      - number: '4.1'
        title: >-
          Revenue model and price surface: Baichuan monetizes across API usage, tools, and enterprise work, but the
          realized yield is still opaque
        blocks:
          - type: paragraph
            body: >-
              Baichuan's public materials make the monetization surface much easier to see than the income statement.
              The official price card shows pay-as-you-go charging across general models, medical models, search
              add-ons, embeddings, file storage, and an Assistants API that is temporarily free. The docs further show a
              self-serve developer motion that still requires real-name verification, recharge, and API-key creation,
              while the enterprise docs route larger buyers toward business-consultation flows. That means the revenue
              design is mixed rather than pure SaaS: self-serve token revenue at the edge, sales-led deployment and
              integration in the middle, and healthcare ecosystem seeding through the Hai Na Baichuan program at the
              strategic core. The difficult part is realized pricing. Public list prices say nothing about
              large-customer discounts, bundled support, revenue recognition, or how much of Baichuan's healthcare
              footprint is subsidized to win distribution rather than directly monetized. Financially, the price surface
              is real; the retained yield is not yet public.
