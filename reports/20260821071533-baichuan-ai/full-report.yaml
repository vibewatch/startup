      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The missing diligence work is unusually concrete. Investors do not mainly need more narrative on
              Baichuan’s ambition; they need economics that convert ambition into underwritable value. The
              highest-priority asks are segment revenue mix, top-account concentration, renewal or expansion by
              healthcare versus general enterprise customers, project-service burden, gross-margin bridge, GPU and cloud
              commitments, and any preference terms or side letters attached to the latest round. Just as important,
              investors need company-specific evidence on CAC or filing status for live public-facing products, because
              healthcare AI is a domain where compliance errors can quickly contaminate valuation. The thesis breaks if
              two things happen together: commercialization evidence stays opaque while external pressure worsens. In
              practice that means some combination of a sharper domestic price reset, slower healthcare deployment
              conversion, a compute-policy shock, or evidence that the current valuation assumed stronger revenue
              quality than the company can prove. Unless those gaps close, the right posture is disciplined tracking
              rather than enthusiastic underwriting.
