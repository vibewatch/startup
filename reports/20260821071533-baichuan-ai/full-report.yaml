            body: >-
              Durability is where the Baichuan customer story becomes much less complete. There is enough public
              evidence to show adoption paths: a consumer/app surface, hospital pilots or deployments, enterprise API
              and private-deployment lanes, and open-source developer distribution. There is also a plausible
              land-and-expand logic: free or low-friction open-weight usage can lead to API usage; medical institutions
