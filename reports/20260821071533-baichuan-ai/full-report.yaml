      - number: '1.2'
        title: Founder-market fit, leadership concentration, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The strongest part of Baichuan's leadership story is Wang Xiaochuan's founder-market fit. TechCrunch ties
              the company directly to Wang's long search and language-technology history at Sogou and to his public call
              that China needed its own OpenAI, while the official site and Caixin connect him with former Sogou
              operator Ru Liyun and a team recruited from leading Chinese and global tech companies. That combination
              makes the company legible as a serious Chinese foundation-model contender rather than a marketing shell.
              The weaker part of the story is governance visibility. Public materials are concentrated around Wang and,
              to a lesser extent, Ru; the reviewed official surfaces do not publish a board roster, committee structure,
              finance chief, or broader current executive bench. The user agreement and privacy policy do show the
              company operating inside a formal PRC legal framework, with Haidian-court venue clauses, medical-use
              disclaimers, and privacy-response commitments, but those are compliance surfaces rather than governance
              transparency. The right stage label is a late-stage private AI company in commercialization mode: it has
              multiple large financings, an open platform, visible sector packaging, and real deployment claims, yet it
              still lacks the public controls and disclosure depth investors would expect from a listed software
              company.
