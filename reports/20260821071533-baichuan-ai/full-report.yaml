      - number: '8.2'
        title: Comparable framework and multiple read-through
        blocks:
          - type: paragraph
            body: >-
              The most useful valuation lens for Baichuan is not a single direct comp, because none exists. Public
              Chinese platform giants such as Alibaba and Baidu trade on low-single-digit price-to-sales ratios,
              reflecting mature businesses with slower growth but far stronger disclosure. Nvidia trades on a far richer
              multiple, but that is a global compute platform with extraordinary revenue scale and public-market
              liquidity. Private Chinese AI startup comps tell a different story again: Moonshot’s reported $20 billion
              raise, DeepSeek’s huge funding round at a valuation above CNY330 billion, and MiniMax’s public financing
              or IPO path all show how much premium the market will pay for visible scale, benchmark momentum, or
              consumer distribution. Baichuan does not have that level of public proof. Digital Applied’s provider-share
              work and the competitive chapter both place Baichuan closer to a second-tier but still credible specialist
              than to the top general-purpose winner set. That means Baichuan deserves some private-AI-growth premium
              over public incumbents, but also a discount to the best-funded breakout labs. The current $2.8 billion
              mark therefore looks understandable on relative positioning, but not obviously attractive once customer
              opacity, healthcare project risk, and price compression are included.
            claimRefs:
