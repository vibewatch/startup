      - number: '5.5'
        title: >-
          Trust, safety, compliance, and technical risk: the product is explicitly assistive, which is prudent but also
          defines its current ceiling
        blocks:
          - type: paragraph
            body: >-
              Baichuan's public medical materials are unusually direct about safety boundaries. The user agreement says
              the platform does not constitute diagnosis or prescriptions, the M3 card says it is for research/reference
              and should be used under professional guidance, and the M4 paper says outputs must not replace physician
              judgment or be used directly for final diagnosis, treatment planning, prescriptions, or emergency-critical
              decisions. That is the right posture for a serious medical AI stack, but it also makes clear that Baichuan
              is selling controlled decision support rather than autonomous care. The same documents surface deeper
              technical risks: rare-disease limitations, image-bias risk, long-tail generalization problems, and heavy
              dependence on reliable retrieval, memory management, and tool constraints. Privacy and security controls
              are discussed at policy level, but public operational evidence on uptime, incident reporting, external
              audits, and real-world error rates remains thin. The result is a product stack that appears technically
              ambitious and safer than generic chat deployment, yet still needs stronger independent proof on
              reliability, compliance operations, and clinical governance in production.
            claimRefs:
