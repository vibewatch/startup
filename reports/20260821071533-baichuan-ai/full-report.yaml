        blocks:
          - type: paragraph
            body: >-
              Baichuan's broad claim to differentiation is not that it owns the entire stack end to end. Several public
              materials make clear that the company often builds on top of outside foundations and popular inference
              frameworks. The stronger differentiation case is narrower and more operational: a healthcare-centered
              training and deployment discipline that combines medical data curation, verifier systems, clinical inquiry
              modeling, evidence retrieval, memory management, multimodal medical perception, and deployment packages
              that can run in more constrained environments. M1 highlights medical data scale and bespoke architectural
              tuning; M2 highlights verifier-guided reasoning and lightweight deployment; M3 highlights
              low-hallucination clinical inquiry and speculative decoding; and M4 reframes those pieces as a
              continuous-care agent system. The platform homepage also points to an end-to-end vertical enhancement
              toolchain that includes data treatment, incremental pretraining, model fine-tuning, reinforcement
              learning, evaluation, compression, and deployment. If that operating stack proves repeatable, Baichuan has
