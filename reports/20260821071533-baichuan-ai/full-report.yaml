  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: >-
          Product surface and module map: Baichuan ships a wider product family than its healthcare-first branding
          initially suggests
        blocks:
          - type: paragraph
            body: >-
              Baichuan's current public brand leads with healthcare, but the underlying product map is materially
              broader. The homepage, pricing page, and platform homepage together show at least four visible product
              layers: general-purpose foundation models such as Baichuan4-Turbo and Baichuan4-Air; domain-enhanced lines
              for medical, finance, education, and role/NPC use; an enterprise agent platform with knowledge base and
              tool-calling features; and open-weight models distributed through GitHub, Hugging Face, and research
              papers. Bai Xiaoyi turns the medical stack into a user-facing family-doctor workflow, while the NPC domain
              line shows that Baichuan still supports character-style agents rather than only hospital or clinical
              software. In practice, that means Baichuan should be understood as a platform that can appear as an API, a
              private deployment package, a verticalized model family, or a consumer-like healthcare interaction layer.
              The product surface is therefore coherent but not simple: it is one stack exposed through multiple
              delivery modes for different customers and trust thresholds.
