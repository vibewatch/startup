      - number: '7.3'
        title: Competition, price war, and dependency risk threaten margin more than relevance
        blocks:
          - type: paragraph
            body: >-
              Baichuan’s most likely failure mode is not immediate irrelevance. It is economic compression. The company
              has enough product depth and healthcare proof to matter, but it sells into a Chinese model market where
              pricing, distribution, and benchmark leadership are already shaped by richer or better-distributed rivals
              such as Qwen, DeepSeek, Doubao, Z.ai, Moonshot, and MiniMax. Apidog’s 2026 price-war survey, Digital
              Applied’s provider-share report, and KrASIA’s framing of the “AI tigers” all support the same conclusion:
              China’s LLM market is active, but it is not forgiving. Open-weight availability and OpenAI-like API rails
              lower evaluation friction for customers, yet they also lower switching costs. Strategic investors and
              channel partners help survivability, but Baichuan lacks the built-in cloud, search, or social distribution
              engine of Alibaba, Baidu, or ByteDance. That makes the company more dependent on product specialization,
              sales execution, and hospital or enterprise proof. The margin risk is especially strong because
              generic-model prices keep compressing while healthcare deployments can remain slower, more customized, and
              harder to standardize.
            claimRefs:
              - CR018
