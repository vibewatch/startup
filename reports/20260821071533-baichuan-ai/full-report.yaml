companyProfile:
  summary: >
    Baichuan AI was founded in 2023 by Wang Xiaochuan in Beijing and has become one of China’s better-known private

    foundation-model startups. The company began with a broader Chinese LLM ambition and has since made healthcare AI a

    defining public wedge while still keeping a broader enterprise-model platform, open-source developer surfaces, and

    enterprise workflow tooling. Its product stack spans general-purpose Baichuan models, medical M-series models,

    Bai Xiaoyi consumer/health surfaces, and an enterprise API/platform layer that supports private deployment and
    agent-style

    workflows. The strongest public moat evidence sits in healthcare, especially the pediatric Futang·Baichuan work with

    Beijing Children’s Hospital, but the company also markets finance and education use cases.
