        title: >-
          Model and agent architecture: the medical line increasingly looks like a constrained agent system, not just a
          chat model
        blocks:
          - type: paragraph
            body: >-
              The deepest technical evidence in the public record sits inside the medical model lineage. Baichuan-M1
              describes a from-scratch medical model trained on mixed medical and general corpora with explicit
              architectural changes for long-context and clinical reasoning tasks. Baichuan-M2 then moves the stack
              toward real-world reasoning with a Large Verifier System, patient simulator, mid-training medical
              adaptation, and multi-stage reinforcement learning, while still advertising single-4090 deployment for
              some configurations. Baichuan-M3 raises the operating-model sophistication further by emphasizing
              proactive clinical inquiry, fact-aware reinforcement learning, segmented workflow rewards,
              OpenAI-compatible serving, speculative decoding, and quantized deployment. The M4 paper is the clearest
              architectural pivot: it explicitly defines Baichuan-Harness, a core reasoning model, and a clinical tool
              layer, with long-term patient memory, evidence-based retrieval, multimodal perception, action constraints,
              and subagent dispatch. This is important because it shows Baichuan is trying to productize medical
              decision support as a managed interaction system rather than as unconstrained next-token generation alone.
