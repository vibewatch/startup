              clustered in healthcare and a limited set of enterprise references, which raises concentration questions
              that the public record cannot answer. Second, 36Kr argues that medical To B commercialization is hard
              because hospital data is siloed, deployment is highly customized, and million-yuan annual project costs
              can still feel expensive for hospitals that are not structured as profit-maximizing buyers. Third,
              Baichuan's own legal and product disclaimers keep the medical system in an assistive posture rather than a
              fully autonomous care role, which is prudent but narrows the category of workflows that can convert
              quickly into high-trust revenue. Finally, platform logos and partner names are not the same as retained
              high-value contracts. The customer verdict is therefore balanced: Baichuan has stronger named proof than
              many private model labs, especially in healthcare, but procurement friction, sparse retention metrics, and
