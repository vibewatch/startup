      - number: '3.3'
        title: Capability, pricing, distribution, and why lock-in is hard to sustain
        blocks:
          - type: paragraph
            body: >-
              On current benchmark optics, the public winner set is elsewhere. BenchLM's August 2026 slice leads with
              Kimi K3 and places Qwen3.8 Max as the best open-weight option, while Digital Applied shows Qwen, MiniMax,
              Z.ai, DeepSeek, and other leaders with clearer weekly-token-share signals than Baichuan. Pricing is also
              not a clean rescue for Baichuan. The official homepage says Baichuan4-Turbo is priced below GPT-4o and
              that Baichuan4-Air cuts inference cost sharply, but Apidog's price-war comparison shows the broader
              Chinese market has already compressed list prices across multiple rivals. Distribution diverges even more
              than pricing. Qwen rides Alibaba Cloud and Alibaba apps, ERNIE rides Baidu, Doubao rides ByteDance, Kimi
              has better benchmark and funding momentum, MiniMax and Z.ai now have public-market currency, and DeepSeek
              combines open-weight credibility with much deeper capital. Most of these vendors expose either OpenAI-like
              API rails or downloadable models, which keeps technical switching friction low. That is strategically
              important for Baichuan: the company must win buyers through healthcare-specific workflow fit, trust, and
              deployment economics rather than through generalized platform lock-in.
