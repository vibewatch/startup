      - number: '7.5'
        title: Risk verdict and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The investment question is therefore whether Baichuan can turn a policy-shaped, capital-intensive, and
              price-compressed opportunity into durable, healthcare-led enterprise economics before the market
              commoditizes around it. The current public evidence supports a balanced but cautious answer. There is no
              single source proving the company is broken; there is also no public evidence base strong enough to
              dismiss the main risks as routine startup growing pains. The correct diligence stance is to monitor
              interaction effects. Regulatory scrutiny matters more because healthcare is trust-sensitive.
              Export-control volatility matters more because generic-model prices are already under pressure.
              Customer-opacity matters more because hospital deployments appear strategically central. And founder or
              execution concentration matters more because the company is still private and disclosure-light. The thesis
              breaks not when one headline appears, but when two or three of these risks reinforce each other—for
              example, if chip policy tightens again while price compression deepens and healthcare deployments fail to
              convert into repeatable, higher-margin accounts.
            claimRefs:
