      - number: '4.2'
        title: >-
          Commercialization proxies: public order and customer signals exist, but they still fall short of a clean
          recurring-revenue view
        blocks:
          - type: paragraph
            body: >-
              Baichuan is no longer just a research lab with no revenue evidence. Caixin reports that co-founder Ru
              Liyun expected 2025 signed-order bookings of RMB1-2 billion, and the 36Kr adverse report says the
              company's To B business generated nearly RMB100 million of revenue in 2024. The same 36Kr piece lists
              named customers and partners such as Bank of China, NE Digital, China Merchants Bank, Xinyada, and Tiankai
              Group, while ScienceNet and BSIA document pediatric and hospital deployments. Those are meaningful signs
              of demand because they show Baichuan has moved from model release into actual enterprise and healthcare
              workflows. Yet the evidence still has major holes. Signed orders are not the same as recognized revenue,
              and one-off customization projects are not the same as durable recurring software margins. The public
              record also does not break out how much of current demand comes from paid inference, paid deployments, or
              subsidized strategic programs such as free M3-Plus access for medical institutions.
