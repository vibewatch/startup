  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Pricing context and current mark
        blocks:
          - type: paragraph
            body: >-
              Baichuan’s valuation story starts with one solid anchor and several softer ones. The solid anchor is the
              April 2026 Series B financing reported at roughly a $2.8 billion valuation, with cumulative capital in the
              high-hundreds-of-millions range and strategic investors including 37 Interactive, Xiaomi, and Alibaba
              Cloud. That is not a seed-stage or science-project valuation; it is a commercialization-stage AI mark. But
              the company still sits in the part of the private market where valuation can outrun disclosure. Public
              evidence shows a real revenue surface, named hospital proof, and enterprise traction signals, yet the
              audited inputs investors normally use to defend a private mark—recognized revenue, renewal quality,
              segment margin, project-versus-software mix, concentration, and preference terms—remain absent. The
              practical implication is that Baichuan’s current mark should not be read as a clean proof of underpricing
              or overpricing on its own. It is better read as a negotiated price for strategic optionality in Chinese
              healthcare AI plus a broader enterprise-model platform, with public evidence strong enough to justify
              interest but not strong enough to justify a buy-at-any-price posture.
            claimRefs:
              - CV001
              - CV002
