      - number: '7.4'
        title: Healthcare commercialization and execution risk remain the hardest internal underwriting problem
        blocks:
          - type: paragraph
            body: >-
              Baichuan’s healthcare focus is a strategic differentiator, but it is also a demanding operating choice.
              Named hospital proof exists, and the M-series plus Futang-Baichuan narrative are real strengths. Yet the
              best adverse reporting on the company says medical To B projects can be bespoke, data access is
              fragmented, hospital procurement is slow, and million-renminbi annual project costs may still feel
              expensive for customers. That makes the healthcare wedge double-edged. It can improve product fit and
              trust, but it can also trap the company in service-heavy implementations, unclear renewal quality, and
              low-margin customization. Caixin’s reported 2025 bookings target and the financial chapter’s revenue
              signals show commercialization is progressing, but they do not resolve how much of that business is
              recurring software versus project-style deployment work. At the same time, the public record remains thin
              on management-bench depth, customer concentration, and organizational resilience beyond founder Wang
              Xiaochuan’s prominence. In practice, the execution risk is that Baichuan may be directionally right on
              healthcare but operationally stretched between frontier-model R&D, regulatory obligations, enterprise
              selling, and hospital-grade delivery.
            claimRefs:
