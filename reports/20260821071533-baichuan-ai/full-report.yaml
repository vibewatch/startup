              agent-platform projects can expand from one workflow into several. But that logic is still mostly
              inferred. Baichuan does not publicly disclose NRR, GRR, churn, renewal rates, contract length, seat
              growth, cohort curves, CSAT, or customer concentration. Even the strongest healthcare proof does not
              clarify whether deployments are paid, recurring, or expanding. Developer downloads show top-of-funnel
              energy, not monetized retention. As a result, the chapter can support repeatable adoption routes, but not
