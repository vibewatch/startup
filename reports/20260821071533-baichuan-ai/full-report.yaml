      - number: '1.4'
        title: Healthcare pivot, milestone cadence, and the caveats later chapters should inherit
        blocks:
          - type: paragraph
            body: >-
              The main strategic change later chapters need to inherit is Baichuan's pivot from a broad frontier-model
              story to a healthcare-centered application stack. The front page now emphasizes Baixiaoyi and the Haina
              Baichuan plan rather than a generic consumer chatbot. TMTPost says Wang explicitly called medical
              foundation models the "crown jewel" of AI research, while GitHub, Hugging Face, and the official site show
              a model arc from Baichuan-7B and Baichuan-13B to Baichuan2, M1, M2, M3, and Baichuan4. The most concrete
              healthcare milestone is the March 2025 Futang·Baichuan pediatric release with Beijing Children's Hospital,
              which ScienceNet and the Beijing software-industry association describe as a dual-doctor deployment path
              for grassroots pediatric care. TMTPost adds that Baichuan-M2 can be privately deployed on relatively light
              hardware, scored 60.1 on HealthBench, and was built for real clinical environments. Those are meaningful
              milestones, but they do not eliminate the core diligence caveats. The company still discloses little about
              governance depth, commercial quality, or financial durability, and KrASIA's wider AI-tigers framing
              implies that Baichuan remains exposed to business-model pressure from much larger Chinese incumbents and
              more visible frontier peers.
