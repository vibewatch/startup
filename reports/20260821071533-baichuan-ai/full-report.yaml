    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and the operating footprint visible today
        blocks:
          - type: paragraph
            body: >-
              Baichuan AI's current public identity is more concrete than the generic "Chinese LLM startup" label
              suggests. The official homepage says the company was founded on 2023-03-24 by former Sogou CEO Wang
              Xiaochuan, frames the mission as helping the public access world knowledge and professional services, and
              says the core team came from Sogou, Baidu, Huawei, Microsoft, ByteDance, and Tencent. The same page
              anchors the operating footprint in Beijing's Haidian district and shows the legal brand 百川智能科技有限公司
              alongside internet-service and medical-information filing numbers. That matters because the company is no
              longer presenting only as a model lab. The homepage leads with the Baixiaoyi AI family doctor, the Haina
              Baichuan medical API program, and an application-layer promise around safer, lower-hallucination
              healthcare use. At the same time, the platform site and API docs show Baichuan still runs a broader
              enterprise stack: general-purpose Baichuan4 models, tool-calling APIs, enterprise agents, and vertical
              positioning for finance and education. The best one-line description is therefore a Beijing-based private
              model company whose visible commercialization layer has pivoted toward healthcare without abandoning a
              wider platform ambition.
