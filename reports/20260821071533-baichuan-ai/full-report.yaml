              tone: warning
              detail: Public narrative still overweights a small visible leadership bench.
            - label: medium-high
              tone: warning
              detail: Execution miss would slow both commercialization and fundraising quality.
            - label: low-medium
              tone: warning
              detail: Capital backing and product breadth provide some buffer.
            - label: medium-high
              tone: warning
              detail: Residual exposure is above a normal enterprise-software baseline.
    approximationNotes: This heatmap is ordinal and source-backed. It ranks residual risk rather than fabricating probabilities.
    claimRefs:
      - CR001
      - CR010
      - CR018
      - CR021
      - CR027
      - CR032
      - CR035
      - CR038
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Baichuan’s main risks transmit through compliance burden, compute volatility, and healthcare economics into
      margin, growth, financing, and valuation.
    data:
      nodes:
        - id: reg
          label: Compliance burden
          detail: Chinese AI governance and healthcare-adjacent legal duties raise process and launch friction.
          tone: warning
        - id: compute
          label: Compute volatility
          detail: Export controls and chip-policy whiplash move supply and cost assumptions quickly.
          tone: negative
        - id: health
          label: Healthcare project economics
          detail: Customized deployments risk becoming service-heavy and slow to renew.
          tone: warning
        - id: trust
          label: Customer trust
          detail: Medical and enterprise buyers deepen usage only if reliability and governance look solid.
          tone: warning
        - id: margin
          label: Margin pressure
          detail: Lower prices and higher delivery cost can compress economics.
          tone: negative
        - id: growth
          label: Growth durability
          detail: Expansion slows if hospitals or enterprises do not convert into repeatable accounts.
          tone: warning
        - id: fin
          label: Financing dependence
          detail: A weaker margin path prolongs need for outside capital.
          tone: negative
        - id: val
          label: Valuation risk
          detail: Higher uncertainty and weaker unit economics compress private-market support.
          tone: negative
      edges:
        - from: reg
          to: trust
        - from: reg
          to: margin
        - from: compute
          to: margin
        - from: compute
          to: growth
        - from: health
          to: trust
        - from: health
          to: margin
        - from: trust
          to: growth
        - from: margin
          to: fin
        - from: growth
          to: val
        - from: fin
          to: val
    approximationNotes: The graph shows causal direction implied by the public evidence; it is not a probabilistic model.
    claimRefs:
      - CR002
      - CR011
      - CR019
      - CR028
      - CR031
      - CR035
      - CR036
      - CR039
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Baichuan’s dependency web runs through external compute, medical partners, enterprise proof, and capital support
      rather than a single dominant node.
    data:
      nodes:
        - id: gpu
          label: Nvidia / GPU supply
          detail: Training and advanced inference economics still depend on externally governed hardware.
          tone: negative
        - id: reg2
          label: Chinese regulators
          detail: CAC-led governance shapes what can launch, how it is labeled, and which obligations persist.
          tone: warning
        - id: med
          label: Hospital partners
          detail: >-
            Medical institutions provide credibility, workflow access, and proof, but scaling beyond marquee sites is
            uncertain.
          tone: warning
        - id: ent
          label: Enterprise buyers
          detail: Named customers and logos support commercialization, but renewal depth is unclear.
          tone: warning
        - id: cap
          label: Strategic capital
          detail: Investor backing buys runway but can hide weak unit economics if unchecked.
          tone: warning
        - id: oss
          label: Open-source community
          detail: Developer adoption broadens reach while also lowering switching costs.
          tone: warning
        - id: bc
          label: Baichuan AI
          detail: Company strategy must coordinate product, compliance, and commercialization across all nodes.
          tone: neutral
      edges:
        - from: gpu
          to: bc
        - from: reg2
          to: bc
        - from: med
          to: bc
        - from: ent
          to: bc
        - from: cap
          to: bc
        - from: oss
          to: bc
        - from: bc
          to: ent
        - from: bc
          to: med
    approximationNotes: The dependency map emphasizes counterparty and ecosystem leverage points rather than ownership structure.
    claimRefs:
      - CR010
      - CR018
      - CR020
      - CR023
      - CR024
      - CR025
      - CR033
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows a simple chain: real product and customer proof support interest, but revenue-quality
      and risk evidence are not yet strong enough for a buy call at the last visible mark.
    data:
      nodes:
        - id: market
          label: Market + product relevance
          detail: Chinese healthcare and enterprise AI remain large enough for Baichuan to matter.
          type: input
          tone: positive
        - id: proof
          label: Proof of real company
          detail: Funding, hospital proof, API pricing, and named customers show Baichuan is beyond concept stage.
          type: process
          tone: positive
        - id: valuation
          label: 'Current mark: ~$2.8B'
          detail: Last visible Series B valuation is meaningful but not obviously cheap.
          type: process
          tone: neutral
        - id: gaps
          label: Missing underwriting data
          detail: Revenue quality, retention, concentration, margin, and preference terms remain opaque.
          type: process
          tone: risk
        - id: risks
          label: Key risk stack
          detail: Price war, healthcare customization, compute policy, and compliance all pressure confidence.
          type: process
          tone: risk
        - id: rec
          label: 'Recommendation: research-more / track'
          detail: Maintain interest, but require either lower price or stronger evidence before upgrading.
          type: output
          tone: neutral
    claimRefs:
      - CV001
      - CV004
      - CV011
      - CV027
      - CV031
      - CV034
