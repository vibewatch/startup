      - number: '4.4'
        title: >-
          Capital adequacy and financing dependency: Baichuan has strong backers, but public liquidity visibility is
          still weak
        blocks:
          - type: paragraph
            body: >-
              The best-supported financial strength in the public record is capital access, not cash generation. Tracxn
              says Baichuan has raised about $1.04 billion across four rounds, while CB Insights shows $1.038 billion
              raised, an April 2026 valuation near $2.9 billion, and a Series B that included 37 Interactive. TMTPost,
              Yahoo/SCMP, and 36Kr also corroborate the large July 2024 raise led by top Chinese strategics and
              state-linked funds. That makes Baichuan look financeable inside China's current AI funding system. But
              capital adequacy is a different question from capital access. There is still no public audited cash
              balance, monthly burn disclosure, debt schedule, or runway model. The 36Kr adverse piece cites an unnamed
              industry estimate that Baichuan still had more than RMB3 billion on hand, but that is not management-grade
              evidence. The practical conclusion is that Baichuan's near-term solvency looks plausible because the cap
              table is deep, yet the underwriting case still depends on private liquidity data rather than public
              balance-sheet proof.
