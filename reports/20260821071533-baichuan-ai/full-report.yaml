      - number: '3.2'
        title: 'Competitor profiles: funding, product scope, and strategic direction'
        blocks:
          - type: paragraph
            body: >-
              The strongest pure-play startup peers are ahead of Baichuan on public capital and visibility. TechCrunch
              says Moonshot raised $2 billion at a $20 billion valuation in May 2026, while CNBC says MiniMax raised
              about $619 million in a Hong Kong IPO and derives most of its revenue from subscriptions and in-app
              purchases. TrendForce says DeepSeek raised more than CNY 50 billion at a valuation above CNY 330 billion,
              instantly creating a balance-sheet gap versus Baichuan's far lower reported valuation range. Z.ai/GLM
              positions around enterprise deployment and domestic-hardware resilience, while Alibaba's Qwen sits inside
              a cloud and app ecosystem broad enough to cover coding, multimodal, and enterprise workflows. Baidu and
              ByteDance are even harder to attack on distribution because ERNIE can leverage Baidu's giant installed
              base and Doubao can leverage consumer surfaces. Baichuan is visibly narrower. Its best-publicized assets
              are medical models such as M2/M3, pediatric deployment proof, and cheaper healthcare-oriented deployment
              claims rather than mass-market app leadership or national benchmark dominance. That is a coherent
              strategy, but it also means Baichuan is choosing a smaller battlefield than the leaders are.
