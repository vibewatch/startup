  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Baichuan sits behind the first tier of Chinese model leaders'
        blocks:
          - type: paragraph
            body: >-
              Baichuan's competitive set is broader than the "AI tigers" narrative but narrower than the whole Chinese
              AI economy. Digital Applied's Q2 2026 landscape says ten providers cover essentially all meaningful
              Chinese AI output, with Alibaba, Z.ai, DeepSeek, Moonshot, MiniMax, ByteDance, Baidu, Tencent, Xiaomi, and
              StepFun absorbing most share and visibility while Baichuan, Yi, and others sit in a second-tier niche
              band. That framing is useful because it separates Baichuan from three different rival classes. First are
              pure-play startup peers such as Z.ai, Moonshot, MiniMax, and DeepSeek, each of which has stronger current
              scale signals than Baichuan. Second are big-tech-embedded model families such as Qwen, ERNIE, and Doubao
              that ride cloud, search, or consumer ecosystems Baichuan does not have. Third is the open-weight and API
              ecosystem, where many providers expose similar technical interfaces and buyers can multi-home. Baichuan's
              own public materials make the company look narrower than these generalists: the homepage foregrounds
              healthcare and family-health workflows, not a broad consumer assistant or cloud platform. Competitive
              analysis therefore starts with a simple observation: Baichuan is not fighting to be the universal Chinese
              model leader; it is fighting to prove that a healthcare-first specialist can survive against larger
              horizontal rivals.
