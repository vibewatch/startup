- id: blockers-and-financial-verdict
  title: 'Financial blockers and verdict: promising commercialization, unresolved revenue quality'
  body: 'The positive case on Baichuan is straightforward. There are public price cards, visible customer and hospital deployments, credible investor support, and independent reporting that commercialization is no longer zero. The negative case is equally important. The company does not publish the contract terms, retention curves, cost stack, discounting rules, or margin bridge needed to determine whether its revenue is software-like, service-heavy, or strategically subsidized. Several of the best revenue datapoints are also media-reported rather than audited. Meanwhile, the healthcare-first pivot and domestic API price war create a tension: specialization may improve product fit, but it can also trap the company in long sales cycles, high customization, and buyers with limited budgets. As of the run date, Baichuan looks like a serious commercialization-stage private AI company with enough capital support to keep building, but not yet like a business whose revenue quality, margin path,
    or runway can be cleanly underwritten from public evidence alone.'
