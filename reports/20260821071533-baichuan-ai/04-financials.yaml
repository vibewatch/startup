- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact
  - exact diligence path
  rows:
  - - Audited financial statements
    - Without audited statements, order and revenue anecdotes cannot be reconciled to recognized revenue or gross profit
    - Request the latest audited annual and interim statements plus revenue-recognition policy by product line.
  - - Cash, burn, and runway
    - Capital adequacy remains inferential rather than measurable
    - Request monthly cash bridge, board runway materials, and cloud / capex commitments.
  - - Realized pricing and discount policy
    - List pricing can materially overstate revenue quality if large buyers get deep discounts
    - Review sample enterprise contracts, discount approvals, and billed usage exports.
  - - Customer concentration and renewal
    - A few named wins do not prove durable recurring revenue
    - Request top-customer concentration, renewal curves, NRR, and backlog aging.
  - - Services versus software mix
    - High customization can depress margins and make revenue less repeatable
    - Break out deployment, integration, support, inference, and license revenue separately.
  - - Clinical liability and monetization constraints
    - Medical disclaimers, hospital budgets, and privacy limits can slow revenue scaling and increase cost
    - Request hospital procurement model, indemnity position, privacy architecture, and clinical-risk governance memos.
  notes: These are the highest-impact blockers preventing a clean public-only underwriting case on Baichuan AI as of 2026-08-21.
