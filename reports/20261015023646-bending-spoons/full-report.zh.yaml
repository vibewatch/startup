    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >
              现有证据支持的身份判断，比 6 月更新时更明确。Bending Spoons 于 2013
              年在米兰成立，将自己定位为数字产品的长期收购者和运营者，而不是传统的风险投资支持型应用工作室或私募股权卖方。官方材料反复描述同一套循环：收购已有规模的产品，深度重建产品、技术、组织和变现，再把由此产生的收益投入更多交易。独立报道大体认可这一框架，但也提醒，规模叙事由并购驱动，因此后文应区分平台能力与产品的有机增长。
