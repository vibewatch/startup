            body: >-
              Bending Spoons
              并不是向一个买方画像销售一套一体化产品。现有证据显示，组合覆盖几类差异明显的客户：大众消费者和专业消费者订阅应用、创作者和协作工具，以及通过大型并购加入的企业工作流业务。招股书提供了最清晰的组合规模证明：公司称
              2026 年 3 月服务超过 500 million 月活用户和超过 9 million 月付费客户，同时警告两个数字都可能在不同产品间重复计算同一用户或付费方。产品案例说明了这一警告为何重要。2026 年 3
              月，WeTransfer 有 58 million 月活用户和 1 million 月付费客户；Brightcove 只有约 15,000 月活用户和 1,700
