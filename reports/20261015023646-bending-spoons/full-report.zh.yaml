      - - 基准
        - 公司保持战略动能，但在下一轮申报周期结束前，公开披露仍不完整。
        - 股价围绕上市后的公开估值波动，区间介于 IPO 周超过 $25B 的信号和 $30B 出头区间的乐观情绪之间。
        - 叙事领先于证据，限制倍数扩张。
