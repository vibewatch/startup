      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 当前应监测的论点崩裂触发器
            body: >-
              最快的论点崩裂路径包括：下一笔大交易之前出现再融资挤压或契约问题；AOL、Eventbrite、Airtable 或 Miro
              遭监管施加补救措施或延迟；调价或客服变化后留存明显下降；或一次重大宕机、安全事件或平台政策变化同时冲击多个产品的计费或分发。
            calloutType: risk
            claimRefs:
              - CR001
