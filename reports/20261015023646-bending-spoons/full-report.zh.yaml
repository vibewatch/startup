      - number: '5.4'
        title: 安全、隐私、AI 与供应商暴露是重大技术风险
        blocks:
          - type: paragraph
            body: >-
              招股书异常明确地指出，技术栈不仅带来执行上行，也带来真实的控制风险。管理层将隐私、数据保护、网络安全、中介责任和 AI 监管暴露列为重大法律与运营问题，并指出 AI
              系统可能不准确、有偏差或以其他方式不可靠。对这个组合而言，风险比狭窄的单一产品公司更大，因为共享运营模式也可能制造共享故障模式：薄弱供应商、薄弱控制流程或薄弱的 AI 上线，都可能同时影响多个品牌。披露的
              2026 年 4 月第三方分析供应商事件影响了 Vimeo 客户和用户数据，进一步印证了这一点。对投资评估而言，实际结论是，Bending Spoons
              在转型速度上看起来强于公开控制透明度。因此，本章在运营模式证据上通过了产品技术门槛，但在公开保障证据上没有通过。
