        title: 展示项
        blocks:
          - type: callout
            title: 组合经济性好于典型滚雪球
            body: 这批公开文件把规模、经常性和表面效率结合起来，这在并购驱动的软件故事中并不常见：93% 的订阅占比、95% NRR、已披露广告强度低，以及利润改善，都指向真实的变现质量，而不只是 M&A 造出的表象。
