        - Airtable 带来了一项约 $480M ARR、同比增长超过 20% 的资产，与公司的复利增长叙事相符。
        - 若证据显示近期大型交易整合后没有损害利润率或留存，信心会提高。
      - - 反论
        - 独立报道将这一模式与裁员、削减免费层以及并购后的客户反弹联系起来。
