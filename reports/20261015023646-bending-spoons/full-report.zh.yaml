      - number: '3.2'
        title: 差异化来自共享平台和交易引擎
        blocks:
          - type: paragraph
            body: >-
              有证据支持的最强差异化，是 Bending Spoons 的共享平台：管理层和第三方报道都提到，可复用的人才、自有技术、数据、AI
              工具、定价实验和运营纪律会在被收购产品之间部署。这个共享系统之所以重要，是因为它让 Bending Spoons
              可以声称自己即使出价高于竞争者，交割后仍能获得足够回报。同一证据还显示出组合运营商少见的分发杠杆：基于申报文件的《财富》报道称，2025 年通过有机渠道获得的客户贡献了新客户收入的 79%，而广告费用仅占收入的
              6%；即使尚未叠加新并购，强品牌和产品驱动渠道仍然重要。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP012
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
