      - number: '1.3'
        title: 里程碑、规模与压力点
        blocks:
          - type: paragraph
            body: >
              2026 年，Bending Spoons 借助新股权、债务能力和经营现金流，完成了从欧洲私人复合增长企业到公开市场收购者的转变，并开始追逐更大目标。7 月上市后，8 月达成 Airtable 协议，9 月达成
              Miro 协议；公开指标如今包括《金融时报》人物报道给出的 $1.65 billion TTM 收入，以及 Global Finance 引用的 $704 million Q2
              收入。这一速度确实亮眼，但同一批独立来源也指出了核心摩擦：并购驱动增长不等于有机增长，反复裁员和调价会带来用户信任风险，而杠杆仍高到足以让后文检验：当整合复杂度上升时，复合增长故事是否还能成立。
