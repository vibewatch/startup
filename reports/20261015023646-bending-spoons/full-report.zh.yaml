  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围很广，但组合围绕可重复的工作流类别组织
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Bending Spoons 已不再是一家单一应用公司，甚至也不只是移动应用聚合商。当前组合覆盖消费者 AI /
              媒体工具、创作者和分发工具、知识工作软件，以及企业工作流平台。《财富》报道，AOL、Brightcove、Eventbrite、Evernote、Harvest、komoot、Remini、StreamYard、Vimeo
              和 WeTransfer 十项业务贡献了 2026 年 Q1 超过 80% 的收入，因此管理层注意力和共享工具集中在已有规模、经过验证的品牌，而非实验性押注。Airtable
              交易同样具有战略意义：它把组合从偏订阅的消费者和专业消费者资产延伸至企业工作流软件；在这里，自定义应用、数据模型和自动化构成产品界面。这种广度是一项优势，因为它给 Bending Spoons
              提供了许多可优化的收入池，但也让逐品牌技术尽调更难，因为公开记录仍更强调运营模式，而非每项业务的详细产品地图。
            claimRefs:
              - CE007
              - CE008
              - CE014
