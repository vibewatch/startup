              领导层依旧明显以创始人为中心。Luca Ferrari 仍以 CEO 身份代表公司，Francesco Patarnello 继续掌管资本和并购；Matteo Danieli
              从首席产品官转任产品副总裁，说明管理层愿意在绩效文化中重新分配权力，而非固守头衔。公开持股图景不如运营故事完整，但已足以显示 2023 年机构增发、2026 年 7 月 IPO，以及 Berkshire
