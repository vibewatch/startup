      highLabel: centralized platform
    yAxis:
      label: 企业工作流暴露度
      min: 1
      max: 5
      lowLabel: low mission-critical workflow depth
      highLabel: high mission-critical workflow depth
    data:
      points:
        - label: Bending Spoons
          x: 5
          'y': 4
          detail: 覆盖消费应用、传统互联网和不断增长的企业工作流资产的集中式组合运营商。
          claimRefs:
            - CP001
            - CP008
        - label: Constellation Software
          x: 2
          'y': 4
          detail: 以收购驱动的可比公司，去中心化程度更高，也更聚焦垂直市场 B2B。
          claimRefs:
            - CP005
        - label: Airtable
          x: 3
          'y': 5
          detail: 企业工作流和无代码平台，在组织中的渗透率较高。
          claimRefs:
            - CP006
            - CP011
        - label: Miro
          x: 3
          'y': 5
          detail: 留存收购管线证据中提到的企业协作和工作流平台。
          claimRefs:
            - CP007
        - label: 内部自建
          x: 5
          'y': 3
          detail: 控制力最高的选项，但需要工程能力，而非直接部署现成产品。
          claimRefs:
            - CP011
        - label: 独立传统运营商
          x: 1
          'y': 2
          detail: 单一产品所有者缺少 Bending Spoons 所强调的组合级运营平台。
          claimRefs:
            - CP001
    approximationNotes: 坐标是序数判断，不是测量得出的市场份额或基准分数；它们概括了留存证据支持的运营模式差异。
    claimRefs:
      - CP001
      - CP005
      - CP006
      - CP007
      - CP008
      - CP011
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据描绘了一条复利循环：买下已有规模的数字产品，重做平台和定价，以订阅变现，再把现金和新资本投入更多收购。
    data:
      nodes:
        - label: 具备存量需求的成熟产品
          value: 500M MAUs / 9M paying customers
          note: 截至 2026 年 3 月、未来收购前的组合公开规模。
        - label: 小型转型团队与共享平台
          note: 官方材料描述了在可复用平台上重组团队、改造技术、重做界面和改变变现方式。
        - label: 以订阅为主的变现
          value: 93% FY2025 sales / 84% Q1 2026 revenue
          note: 经常性订阅占报告收入组合的主要部分。
        - label: 留存加相对轻量的付费获客
          value: 95% NRR / 79% organically acquired new-customer revenue
          note: 公开代理指标表明，大部分收入得以留存，且新增收入中很大一部分并非靠重投广告买来。
        - label: 经营杠杆
          value: $278M 2025 operating profit
          note: 人均收入从 2023 年到 2025 年增长超过一倍。
        - label: 将资本循环投入更多收购
          value: $1.68B IPO + $330M Berkshire placement
          note: 管理层和独立报道都将新资本视为持续并购的燃料，其中包括已宣布的 Airtable 交易。
    approximationNotes: 这是定性流程，而非已核对的瀑布图：指定公开来源描述了复利机制，但没有披露从客户活动到毛利的逐产品桥接。
    claimRefs:
      - CI003
      - CI007
      - CI008
      - CI009
      - CI011
      - CI012
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Bending Spoons 将标的筛选、共享工具、AI 和组合运营叠加到一个转型平台上。
    data:
      layers:
        - label: 标的搜寻与筛选
          detail: 高容量漏斗在投入资源前识别经久耐用的数字品牌。
          modules:
            - label: 机会漏斗
              detail: 2025 年获得 2,500+ 个机会，约 200 个经过深入分析，完成 6 笔收购。
            - label: 标的管线
              detail: 招股书称，未来标的超过 1,000 个，均可能成为候选。
        - label: 转型打法
          detail: 交割后的工作围绕重组、技术改造、UI 重做、产品加速和变现展开。
          modules:
            - label: 深度转型
              detail: 官方披露描述的是技术改造和持续优化，而非被动持有。
        - label: 共享专有技术
          detail: 通用内部系统部署到各项被收购业务中。
          modules:
            - label: 工具示例
              detail: 数据基础设施、用户生命周期价值预测器和实验工具包。
        - label: 专有数据与实验
          detail: 跨组合遥测数据为产品和运营决策提供输入。
          modules:
            - label: 规模证据
              detail: 2025 年进行了 3,000 次实验，2026 年 Q1 平均每天处理 3.8B 个数据点。
        - label: AI 运营层
          detail: AI 已嵌入内部开发和运营工作流。
          modules:
            - label: 内部软件开发
              detail: 截至 2026 年 Q1 末，超过 90% 的 pull request 由 AI 单独或共同编写，其中约 70% 完全由 AI 编写。
            - label: 复用功能
              detail: 独立报道将 AI 复用与工程、定价、支持、招聘和产品分析联系起来。
        - label: 组合产出
          detail: 该平台支持消费应用、创作者 / 媒体工具、生产力软件和企业工作流产品。
          outputs:
            - label: Consumer and creator brands
              detail: Remini, Splice, StreamYard, Vimeo, WeTransfer.
            - label: Productivity and workflow brands
              detail: Evernote, Harvest, Airtable.
            - label: Community and media brands
              detail: AOL, Brightcove, Eventbrite, komoot.
    approximationNotes: 这一堆栈是根据公开披露综合出的运营模式；Bending Spoons 没有发布把每项共享服务与每个组合品牌对应起来的标准架构图。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE008
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 商业引擎从收购的存量用户基础开始，随后分化为消费 / 专业消费者和企业客户界面，最终由现金产生能力为下一轮交易提供资金。
    data:
      items:
        - label: 收购已验证的需求
          actor: Bending Spoons 并购
          touchpoints:
            - 选择已有用户、付费者和可预测收入的产品，而不是从零打造需求
            - Airtable 于 2026 年 9 月完成交易；Miro 宣布于 2026 年 Q4 交割
          tone: neutral
        - label: 保留存量用户基础
          actor: 组合产品团队
          touchpoints:
            - 现有用户继续在被收购产品中使用原品牌、工作流、数据和订阅
            - 组合的月活用户和月度付费客户总数是汇总值，并未去重
          tone: neutral
        - label: 按客户类型分流
          actor: 消费者、专业消费者和企业买家
          touchpoints:
            - WeTransfer 展示了广泛的受众规模
            - Brightcove 展示了范围较窄但价值更高的企业密度
          tone: neutral
        - label: 重定价与重建
          actor: 产品和变现团队
          touchpoints:
            - 免费层限制、价格变化和产品改造旨在提高生命周期价值
            - Evernote 引发的批评表明这一阶段可能引发用户反弹
          tone: risk
        - label: 守住经常性收入
          actor: 现有订阅用户基础
          touchpoints:
            - 截至 2026 年 Q1，组合净收入留存率保持在九十多的低至中段。
            - 长期订阅用户仍占收入的很大一部分
          tone: positive
        - label: 再投资下一项资产
          actor: 公司资本配置者
          touchpoints:
            - 现金产生能力和融资为下一轮收购提供资金
            - 当前扩张最明显的是企业工作流软件，而不是套件交叉销售
          tone: opportunity
    claimRefs:
      - CU001
      - CU005
      - CU007
      - CU009
      - CU010
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在公开证据中，融资、监管审查、留存反弹和整合 / 平台依赖仍是四个最高的剩余风险簇。
    data:
      columns:
        - label: 可能性
          detail: 基于当前公开证据的 12 个月概率
        - label: 影响
          detail: 对收入、审批灵活性或估值的下行影响
        - label: 缓释成熟度
          detail: 当前公开缓释措施看起来有多成熟
        - label: 剩余暴露
          detail: 已披露缓释措施之后剩余的风险
      rows:
        - label: 杠杆收购与再融资风险
          note: 债务偿付契约和利率敏感性很重要，因为收购速度仍是战略核心。
          values:
            - label: 高
              tone: warning
            - label: 高
              tone: critical
            - label: 中
              tone: neutral
            - label: 高
              tone: critical
        - label: 跨境监管与竞争审查
          note: AOL 的 CFIUS 审查和 Airtable 的批准表明审查正在发生，而非假设性风险。
          values:
            - label: 中高
              tone: warning
            - label: 高
              tone: critical
            - label: 中
              tone: neutral
            - label: 高
              tone: critical
        - label: 裁员和变现变化后的客户留存
          note: 独立报道指出存在投诉和用户敏感性，但公开流失数据仍然稀薄。
          values:
            - label: 高
              tone: warning
            - label: 中高
              tone: warning
            - label: 中低
              tone: neutral
            - label: 高
              tone: critical
        - label: 平台云和 AI 供应商依赖
          note: 第三方商店、支付处理商和基础设施可能直接影响正常运行时间、分发和利润率。
          values:
            - label: 中高
              tone: warning
            - label: 高
              tone: critical
            - label: 中
              tone: neutral
            - label: 中高
              tone: warning
        - label: 隐私与供应商安全事件暴露
          note: 招股书已披露一起与 Vimeo 相关的供应商事件，并称各司法辖区的合规仍在演进。
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: critical
            - label: 中
              tone: neutral
            - label: 中高
              tone: warning
        - label: 创始人控制下的治理
          note: 集中的投票控制可以保持速度，但如果风险偏好走得太远，也会限制外部纠偏。
          values:
            - label: 高
              tone: warning
            - label: 中高
              tone: warning
            - label: 低
              tone: neutral
            - label: 中高
              tone: warning
    approximationNotes: 序数标签是根据来源支持的披露和报道综合出的分析师排名，不是建模概率。
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR008
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开规模和融资证明支持这一故事，但折价的后续资本加上稀疏的运营披露，使判断仍需谨慎。
    data:
      nodes:
        - label: IPO 证明了需求
          detail: 2026 年 7 月 IPO 募资约 $1.68B，隐含估值约 $18.4B。
          tone: positive
        - label: 交易热情加速
          detail: 独立报道称 IPO 周估值超过 $25B，随后在 Berkshire 新闻日飙升至约 $31B。
          tone: positive
        - label: 新资本延长跑道
          detail: Berkshire 同意通过 1,000 万股私募配售再投资 $330M。
          tone: positive
        - label: 并购引擎仍在运转
          detail: 仅 Airtable 就被描述为约 $480M ARR、同比增长超过 20%，而更广泛的管线仍然庞大。
          tone: positive
        - label: 价格与披露仍然背离
          detail: 配售以每股 $33 成交，留存的 Q2 页面没有披露足够的单位经济性或杠杆细节。
          tone: warning
        - label: 建议仍为继续研究
          detail: 只有在公开申报文件更完整或入场点更宽松后，才进行投资判断。
          tone: adverse
    approximationNotes: 逻辑链使用观察到的融资和市场锚点，而非推断出的比例加权模型。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV007
      - CV012
      - CV014
      - CV015
