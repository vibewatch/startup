      - number: '3.3'
        title: 持久性取决于更激进变现和更复杂整合后的留存
        blocks:
          - type: paragraph
            body: >-
              只有当组合在转型打法变得更激进后仍能留住用户，护城河才算真实。多份保留来源把战略与收购后的涨价、收紧免费计划和大规模裁员联系起来；独立分析则警告，客户是否愿意继续付费，比单纯减少员工更重要。因此，竞争风险既来自流失、订阅疲劳和声誉损害，也来自直接功能对标。规模还改变了风险画像：据报道，AOL
              剥离需要数月技术难度很高的平台迁移，而拟议的 Airtable 交易仍有监管、员工留存和交割风险。更大的企业工作流目标可以拓宽机会集，却也会让执行错误更加昂贵。
            claimRefs:
              - CP003
              - CP004
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 主要竞争风险是交割后的价值流失，而不是缺少目标
            body: 保留证据表明 Bending Spoons 的管线仍然充足，但更难的问题是：更大、企业属性更强的资产，在调价、收紧免费计划、裁员和长期整合后，能否留住用户。
            calloutType: risk
            claimRefs:
              - CP010
              - CP013
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 经常性订阅是核心经济引擎，但增长仍高度由并购驱动
        blocks:
          - type: paragraph
            body: >-
              最有力的公开财务信号是，Bending Spoons 已经更像一个有规模的经常性收入组合，而不是投机性的应用滚雪球。多份追溯至 IPO 申报文件的报道称，2025 年收入为 $1.31 billion，同比增加
              95%；订阅贡献 2025 年销售额的 93%，净收入留存率为 95%。2026 年 Q1 收入中订阅占比仍高达 84%，月活用户超过 500 million；公司另称 2026 年 3 月服务超过 9
              million
              月付费客户。这个组合很重要，因为它意味着公司拥有一个可以长期调价、留存并交叉提供资金的庞大存量基础，即使公司没有披露品牌层面的毛利率或队列留存。需要抵消这一点的是，独立报道仍把近期收入跃升的大部分归因于并购，而非干净的同店有机复合增长，因此投资者应认为规模质量很强，但尚未按细分披露。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI013
      - number: '4.2'
        title: 变现纪律和集中式工具似乎带来效率，但单位经济性仍不完整
        blocks:
          - type: paragraph
            body: >-
              对一家增长如此迅速的公司而言，公开销售效率信号异常有利，但它们仍是代理指标，而不是完整运营模型。《财富》根据申报文件的报道称，2025 年有机获客贡献新客户收入的 79%，广告费用仅占收入的
              6%，说明获客并非主要靠高额付费投放。该来源还称，2023 至 2025
              年人均收入翻倍以上；公司官方材料则描述了一套由人员、自有技术和自有数据组成、可在被收购产品之间复用的集中式平台。这支持一条可信的利润率路径：小型整合团队、共享工具、调价和运营简化，可以抬高经济性，而不必让每个品牌独立重建完整技术栈。缺失之处是，指定的公开来源都没有提供产品层面的
              CAC、回本期、毛利率、客服负担或渠道费披露，因此当前单位经济性故事仍是推断，尚未达到完整承保式评估的程度。
