companyProfile:
  summary: >-
    Bending Spoons 由米兰起步，是一家在纳斯达克上市的软件复合增长企业：收购已有规模的数字产品，在集中式平台上重建其技术和运营模式，并长期持有这些资产。2026 年 IPO 及随后 Berkshire
    的追加资本提升了公司的并购火力；公开证据也已显示出组合规模的经常性收入和庞大的存量用户基础。不过，公开记录对产品层面经济性、债务细节和品牌层面留存的披露仍不完整，因此，描述这家公司比完整评估它容易得多。
