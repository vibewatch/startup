  productSummary: 一套用于收购数字业务、重做产品、技术、变现和团队，再以长期所有者身份管理所得组合的自有运营平台。
  customerFocus: 通过被收购的软件品牌触达消费者、创作者和工作流用户；近期并购也在扩大企业客户覆盖。
