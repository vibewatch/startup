company:
  name: "Bending Spoons"
chapter:
  number: 1
  title: "Company Overview"
  summary: >
    Bending Spoons is now a founder-led, Nasdaq-listed software compounder whose
    identity is clearer than it was in the prior report: Milan headquarters,
    2013 founding, and a long-term buy-and-rebuild model are well supported,
    while 2026 milestones show the platform scaling into billion-dollar targets.
    The strongest update is not just size but pace: the company paired a July
    IPO with Airtable and Miro deals, plus incremental Berkshire capital, even
    as independent coverage keeps flagging leverage, layoffs, and user-trust
    backlash as the main reasons later chapters should pressure-test durability.
sections:
  - id: "identity-and-operating-model"
    title: "Identity and operating model"
    body: >
      The assigned evidence now supports a tighter identity statement than the
      June refresh context did. Bending Spoons was founded in Milan in 2013 and
      positions itself as a long-term acquirer and operator of digital products
      rather than a conventional venture-backed app studio or private-equity
      seller. Official materials repeatedly describe a cycle of buying scaled
      products, deeply rebuilding product, technology, organization, and
      monetization, then reinvesting the resulting earnings into more deals.
      Independent coverage broadly accepts that frame, but also warns that the
      scale narrative is acquisition-led, so later chapters should distinguish
      platform capability from organic product momentum.
    claimRefs: ["CO001", "CO002", "CO003", "CO012", "CO015"]
    tableRefs: ["TO001"]
  - id: "leadership-and-stakeholder-alignment"
    title: "Leadership and stakeholder alignment"
    body: >
      Leadership remains visibly founder-centric. Luca Ferrari still fronts the
      company as CEO, Francesco Patarnello remains the capital-and-M&A owner,
      and Matteo Danieli's move from Chief Product Officer to VP Product shows
      that management is willing to reallocate authority inside a meritocratic
      culture rather than preserve titles. The public ownership picture is less
      complete than the operating story, but the pool is good enough to show a
      2023 institutional primary round, a July 2026 IPO, and Berkshire
      Hathaway's later top-up as the major externally visible capital anchors.
      What it does not disclose cleanly is the full board roster, committee
      independence, or a reconciled current cap table.
    claimRefs: ["CO004", "CO005", "CO006", "CO011", "CO016"]
    tableRefs: ["TO002", "TO003"]
  - id: "milestones-scale-and-pressure-points"
    title: "Milestones, scale, and pressure points"
    body: >
      2026 turned Bending Spoons from a private European compounder into a
      public acquirer using fresh equity, debt capacity, and operating cash
      flow to pursue larger targets. The July listing was followed by the
      Airtable agreement in August and the Miro agreement in September, while
      public metrics now span a $1.65 billion TTM revenue readout from the FT
      profile and a $704 million Q2 revenue print cited by Global Finance.
      That pace is impressive, but the same independent sources highlight the
      core frictions: acquisition-led growth is not the same as organic growth,
      repeated layoffs and pricing changes create user-trust risk, and leverage
      remains meaningful enough that later chapters should test whether the
      compounding story still holds when integration complexity rises.
    claimRefs: ["CO007", "CO008", "CO009", "CO010", "CO013", "CO014"]
    figureRefs: ["FO001"]
