callouts:
  - calloutType: "risk"
    title: "The 2026 step-up is real, but so is execution pressure"
    body: >
      The evidence is strong enough to treat Bending Spoons as a scaled,
      acquisition-led software operator rather than an aspirational roll-up, yet
      the same pool still leaves real diligence pressure on debt structure,
      customer backlash after repricing, and whether larger post-IPO deals can
      integrate without eroding the platform's small-team advantage.
    claimRefs: ["CO005", "CO010", "CO013", "CO014", "CO016"]
