      - [Confidence, medium, Evidence supports the model but not a decision-grade underwriting case.]
      - ["Risk rating", high, "Integration pace, repricing backlash, and financing complexity can compress upside quickly."]
      - ["Valuation stance", "Demanding versus current disclosure", "Public marks have moved faster than retained operating detail."]
