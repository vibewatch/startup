    notes: >-
      Judgment table only: assessments synthesize retained sources and explicit
      disclosure gaps, not a standalone valuation model.
    claimRefs: [CV003, CV004, CV005, CV012, CV014, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Evidence, What would change the view]
    rows:
      - ["Platform thesis", "Berkshire added another $330M and management says the M&A pipeline remains strong.", "Sustained post-IPO filings showing earnings conversion and disciplined deal underwriting would strengthen the thesis."]
      - ["Scale thesis", "Airtable adds an asset described at about $480M ARR growing more than 20% YoY and fits the company's compounding narrative.", "Evidence that recent large deals integrate without margin or retention damage would improve confidence."]
      - ["Anti-thesis", "Independent reporting ties the model to layoffs, free-tier cuts, and customer backlash after acquisitions.", "Clean cohort retention, churn, or ARPU disclosure by major brand would reduce this concern."]
      - ["Disclosure gap", "The retained Q2 results page does not expose enough revenue, margin, cash-flow, or leverage detail for conviction underwriting.", "A detailed 6-K or later public filings with debt, dilution, and segment economics would move the call positively."]
    notes: >-
      Rows mix factual support with explicit evidence thresholds for changing the
      recommendation; null public disclosures are treated as gaps, not as proof.
    claimRefs: [CV006, CV007, CV010, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Fresh capital funds accretive acquisitions and post-IPO filings prove durable earnings expansion.", "Market sustains or exceeds the roughly $31B trading mark cited after the Berkshire news.", "Integration execution still has to outrun backlash and financing complexity.", "Requires new disclosure plus clean execution."]
      - [Base, "Company keeps strategic momentum but public disclosure remains incomplete through the next filing cycle.", "Shares orbit the post-listing public marks between the IPO-week >$25B signal and the low-$30B enthusiasm range.", "Narrative stays ahead of evidence and limits multiple expansion.", "Most consistent with current evidence."]
      - [Bear, "Large integrations disappoint or financing becomes more dilutive or constrained than bulls expect.", "Valuation compresses toward the $18.4B IPO anchor or other private-placement-clearing levels.", "User trust, pricing pushback, or weak post-close execution break the compounding story.", "Material if disclosure or execution slips."]
    notes: >-
      Valuation anchors are observed public marks from retained sources, not a
      discounted-cash-flow or comps-based fair-value model.
    claimRefs: [CV001, CV002, CV004, CV005, CV007, CV014, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public scale and financing proof support the story, but discount-priced
      follow-on capital plus sparse operating disclosure keep the call cautious.
    data:
      nodes:
        - label: IPO proved demand
          detail: July 2026 IPO raised roughly $1.68B at an implied valuation of about $18.4B.
          tone: positive
        - label: Trading enthusiasm accelerated
          detail: Independent coverage described IPO-week value above $25B and a later Berkshire-day spike to about $31B.
          tone: positive
        - label: Fresh capital extends runway
          detail: Berkshire agreed to invest another $330M through a 10 million share private placement.
          tone: positive
        - label: Acquisition engine remains active
          detail: Airtable alone was described at about $480M ARR growing more than 20% YoY, while the broader pipeline remains large.
          tone: positive
        - label: Price and disclosure still diverge
          detail: The placement cleared at $33 per share and the retained Q2 page does not expose enough unit economics or leverage detail.
          tone: warning
        - label: Recommendation stays research-more
          detail: Underwrite only after fuller public filings or a more forgiving entry point.
          tone: adverse
    approximationNotes: >-
      Logic chain uses observed financing and market anchors rather than an
      inferred proportional weighting model.
    claimRefs: [CV001, CV003, CV004, CV005, CV007, CV012, CV014, CV015]
callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      Public evidence supports following Bending Spoons closely, but not paying
      for a clean compounding story before filings make the return bridge more
      explicit.
    claimRefs: [CV004, CV005, CV012, CV014, CV015]
  - calloutType: strength
    title: Financing plus pipeline are real
    body: >-
      A second Berkshire check, an active target pipeline, and continued large
      acquisitions show that the capital-formation side of the model is working.
    claimRefs: [CV003, CV006, CV007, CV009]
  - calloutType: risk
    title: Execution and trust are still the gating variables
    body: >-
      The recurring pattern of layoffs, tighter free plans, and customer
      backlash means valuation upside depends on Bending Spoons proving that its
      transformations create more value than they destroy.
    claimRefs: [CV010, CV011, CV014]
