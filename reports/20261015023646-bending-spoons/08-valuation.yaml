  evidenceGaps:
    - type: missing-source
      severity: material
      topic: disclosure-gap
      missingEvidence: Public filings or investor materials showing revenue, margin, cash-flow, leverage, and debt-maturity detail by quarter and, ideally, by major business group.
      whyItMatters: Without that bridge, investors cannot test whether acquisition-driven earnings expansion supports the latest public valuation marks.
      diligencePath: Review the Berkshire-related 6-K and subsequent post-IPO filings for a fuller capital-structure and profitability bridge before upgrading the recommendation.
      relatedQuestionRefs: [QV007, QV010]
    - type: private-evidence-only
      severity: material
      topic: post-acquisition-backlash
      missingEvidence: Cohort-level retention, churn, ARPU, and support-quality data for major acquired brands after repricing or workforce reductions.
      whyItMatters: The valuation thesis assumes Bending Spoons can cut and reprice without permanently damaging user behavior or enterprise trust.
      diligencePath: Request brand-level retention and monetization cohorts, or wait for credible public disclosures that show whether post-acquisition backlash is temporary or structural.
      relatedQuestionRefs: [QV006, QV008, QV009]
