schemaVersion: report-v2
artifact: valuation
slug: bending-spoons
runDate: 2026-10-15
company:
  name: Bending Spoons
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence shows a real compounding engine: Bending Spoons raised
    roughly $1.68B at a July 2026 IPO, then secured another $330M from Berkshire
    Hathaway while continuing to buy scaled assets such as Airtable. The same
    evidence also shows that the market is paying ahead of decision-grade public
    disclosure, so the right call remains research-more with strict entry
    discipline rather than a conviction buy.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The investable question is not whether Bending Spoons is interesting, but
      whether the current public price already discounts most of the upside. The
      July 2026 IPO was priced at $29 per share at an implied valuation of about
      $18.4B, IPO-week trading briefly pushed market capitalization above $25B,
      and the October 2026 Berkshire-related rally briefly took the company to
      about $31B on Trending Topics' account. At the same time, the fresh
      $330M private placement was struck at $33 per share, below the prior
      closing price cited by Trending Topics. That mix argues for a
      price-sensitive research-more stance: the business keeps attracting
      credible capital, but the market is already rewarding the story faster
      than public operating disclosure is improving.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV014, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-support
    title: Why the thesis can work
    body: >-
      The pro-valuation case is straightforward. Bending Spoons has kept adding
      financing capacity, says its M&A pipeline remains strong, and continues to
      pursue large software assets after the listing. Berkshire's total
      ownership will reach 4% if the private placement closes, which extends the
      July IPO endorsement with another sizeable check. The Airtable agreement
      also shows management is buying scale that can matter: the target was
      described as roughly $480M of ARR growing more than 20% year over year as
      of June 2026. Sourcery's interview further reinforces that this is not a
      one-off trade but an acquisition system built around roughly 1,000
      potential targets and a 5-10 deal annual cadence. Those facts support
      paying for an acquisition platform, not just a bundle of legacy brands.
    claimRefs: [CV003, CV006, CV007, CV008, CV009]
    tableRefs: [TV002]
  - id: anti-thesis-and-disclosure-gaps
    title: Anti-thesis and disclosure gaps
    body: >-
      The anti-thesis is not that Bending Spoons lacks momentum; it is that the
      public record still leaves too much of the return bridge unproven at this
      valuation. Independent reporting links the model to layoffs, free-tier
      cuts, and recurring customer backlash after several acquisitions, which is
      a real warning for a roll-up that depends on repeated integration and
      repricing. The retained Q2 2026 results page announces the quarter but
      does not expose revenue, margin, cash-flow, or leverage detail in the
      fetched text, so investors still cannot test whether operating
      improvements, financing capacity, and acquisition pace are compounding at
      a rate that justifies the new public mark. That is enough to stop short of
      a buy call today even if the long-term model remains plausible.
    claimRefs: [CV005, CV010, CV011, CV012, CV013]
  - id: scenarios-diligence-and-kill-criteria
    title: Scenarios, diligence asks, and kill criteria
    body: >-
      The cleanest way to frame valuation today is through public market anchors
      rather than a false-precision model. The bear anchor is the $18.4B IPO
      valuation, the base range is the post-listing band between roughly $25B
      and the low-$30B area described in independent coverage, and the bull case
      requires management to prove that fresh capital plus recent large
      acquisitions can expand earnings without reigniting user-trust problems or
      forcing unattractive financing. The next diligence cycle should focus on
      post-IPO filings, the 6-K attached to the Berkshire placement, cash-flow
      and leverage detail, and evidence that Airtable and other large deals are
      integrating without another wave of product backlash. A break below that
      proof bar, not a lack of narrative, is what would invalidate the thesis.
    claimRefs: [CV001, CV003, CV004, CV007, CV012, CV013, CV014, CV015]
    tableRefs: [TV003]
tables:
