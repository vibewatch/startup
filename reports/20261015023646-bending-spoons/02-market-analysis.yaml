      - ["Bending Spoons prospectus", "Mar 2026", "Global", ">500M monthly active users; >9M monthly paying customers", "From 111M / 3M in Dec 2023 to >500M / >9M in Mar 2026", "Aggregated product-level counts across the portfolio", "medium", "Counts may include the same user or customer more than once, so they indicate scale rather than unique penetration"]
