company:
  name: "Bending Spoons"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Bending Spoons is not addressing all software spend; it is targeting a filtered supply of transformable digital businesses that management says exceeds 1,000 targets and nearly $400 billion of 2025 revenue across Europe and North America. Public evidence supports the boundary logic and the buyer mix from consumer apps to enterprise workflows, but the only quantified TAM lens in this worker pool is still company-built, so diligence should focus on how much of that supply stays predictable, retention-rich, and low-CAC enough for the playbook to compound."
sections:
  - id: "market-boundary"
    title: "Market boundary: not generic software TAM, but transformable digital assets"
    body: |
      The cleanest way to size Bending Spoons' market is to define the asset filter before discussing revenue. In the prospectus, management says the relevant universe is a subset of digital businesses, not all software or internet spend: the screen keeps targets with meaningful existing revenue, headquarters in Europe or North America, and monetization models the platform already knows how to rework, namely self-serve subscriptions, sales-led subscriptions, or advertising. That boundary matters because the company is buying installed demand and then changing pricing, product, and cost structure, not funding greenfield product discovery. Independent commentary in Sourcery and Colin Keeley points in the same direction: management prioritizes businesses where platform leverage, revenue scale, and predictability are strong enough that a transformation team can move the economics materially. [CM001, CM002, CM003, CM009]
    claimRefs: ["CM001", "CM002", "CM003", "CM009"]
    tableRefs: ["TM001", "TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-and-adoption"
    title: "Buyer, user, and payer mix spans consumer, prosumer, and enterprise workflows"
    body: |
      The portfolio evidence says this is already a multi-segment market rather than a single app category. The prospectus describes consumer properties such as AOL and Remini, prosumer and creator tools such as WeTransfer and StreamYard, SMB and professional workflows such as Harvest and Evernote, and enterprise-facing platforms such as Brightcove and Vimeo; the Airtable deal pushes that enterprise workflow exposure further with approximately $480 million of ARR and more than 500,000 organizations on the platform. Adoption paths differ with the product: Bending Spoons says 83% of new-customer revenue in Q1 2026 came from organic channels, yet Brightcove is sales-led while Remini depends far more on word of mouth. The result is a heterogeneous market where user counts, payer counts, and budget owners cannot be collapsed into one funnel without losing meaning. [CM004, CM005, CM006, CM007, CM008, CM010]
    claimRefs: ["CM004", "CM005", "CM006", "CM007", "CM008", "CM010"]
    tableRefs: ["TM003"]
  - id: "drivers-and-constraints"
    title: "Growth drivers are platform leverage and enterprise adjacency; constraints are predictability and backlash tolerance"
    body: |
      The main driver behind market attractiveness is not category novelty; it is whether Bending Spoons can apply the same platform repeatedly. The prospectus and the August 2026 results release both say transformation work centers on reorganizing teams, overhauling technology, redesigning interfaces, accelerating product development, and improving marketing and monetization, with AI used both inside products and inside the operating toolchain. Independent sources reinforce that the company wants large revenue bases and forecastable behavior more than rapid pre-close growth, because the transformation cost is relatively fixed while upside scales with the size and durability of the installed business. The biggest constraints flow from the same model: management favors assets that rely less on paid acquisition, and external reporting shows that repricing and workforce reductions can trigger backlash even when reported revenue improves. [CM006, CM009, CM011, CM012]
    claimRefs: ["CM006", "CM009", "CM011", "CM012"]
  - id: "diligence-gaps"
    title: "What remains missing for a decision-grade market view"
    body: |
      The central diligence gap is that public evidence in this pool quantifies the target universe mostly through management's own screen. The prospectus explains the logic and the revenue bands, and independent sources corroborate the acquisition mechanics, but there is no third-party SAM or SOM that isolates how much of this universe is both available for sale and suitable for Bending Spoons' low-paid-acquisition, retention-heavy playbook. A second gap is brand-level budget ownership: portfolio examples show consumer, creator, SMB, and enterprise motions, yet public disclosures still do not break buyer, user, payer, and revenue mix by major product. That means the market is clearly large enough to matter, but not yet cleanly segmented enough to underwrite upside by subcategory without management data. [CM002, CM005, CM010, CM012]
    claimRefs: ["CM002", "CM005", "CM010", "CM012"]
