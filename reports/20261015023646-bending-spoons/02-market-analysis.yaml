figures:
  - id: "FM001"
    title: "Market sizing lens"
    type: "pyramid"
    summary: "The disclosed market lens is a screening sequence that narrows a broad software universe into transformable digital businesses rather than a bottom-up end-user-spend model."
    data:
      nodes:
        - label: "Starting universe"
          value: "Tens of thousands of private and thousands of public businesses"
          note: "Management says the addressable-market study started from a much broader digital-business universe."
          claimRefs: ["CM001", "CM002"]
        - label: "Geography screen"
          value: "Europe or North America headquarters"
          note: "The current focus reflects familiarity with those regions, not a disclosed claim that the model cannot travel elsewhere."
          claimRefs: ["CM001", "CM002"]
        - label: "Revenue screen"
          value: "$50M-$5B estimated annual revenue"
          note: "The company says this is the size range it is currently prioritizing, while expecting larger targets over time."
          claimRefs: ["CM002", "CM009"]
        - label: "Revenue-model screen"
          value: "Self-serve subscriptions, sales-led subscriptions, or advertising"
          note: "The screen excludes businesses that depend heavily on IT services or other human-delivery revenue."
          claimRefs: ["CM001", "CM003"]
        - label: "Qualified target list"
          value: ">1,000 businesses"
          note: "This is management's identified pool of attractive acquisition candidates over the next few years."
          claimRefs: ["CM002", "CM009"]
        - label: "Implied revenue base"
          value: "Nearly $400B aggregate estimated 2025 revenue"
          note: "Useful as a scale signal, but still company-built rather than independently benchmarked."
          claimRefs: ["CM002"]
    approximationNotes: "Layer width shows sequence, not proportional market share; the underlying study mixes criteria and outputs, so the pyramid is a screening lens rather than a mathematically additive TAM stack."
    claimRefs: ["CM001", "CM002", "CM003", "CM009"]
callouts:
  - calloutType: "risk"
    title: "The quantified TAM is mostly management-authored"
    body: "The market clearly looks large enough to matter, but the only hard target-universe math in this pool comes from the prospectus and related company disclosures. Independent sources validate the playbook and the segment expansion, not an external SAM or SOM."
    claimRefs: ["CM002", "CM009", "CM012"]
