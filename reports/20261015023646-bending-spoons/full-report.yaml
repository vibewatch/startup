      - number: '1.2'
        title: Leadership and stakeholder alignment
        blocks:
          - type: paragraph
            body: >
              Leadership remains visibly founder-centric. Luca Ferrari still fronts the company as CEO, Francesco
              Patarnello remains the capital-and-M&A owner, and Matteo Danieli's move from Chief Product Officer to VP
              Product shows that management is willing to reallocate authority inside a meritocratic culture rather than
              preserve titles. The public ownership picture is less complete than the operating story, but the pool is
              good enough to show a 2023 institutional primary round, a July 2026 IPO, and Berkshire Hathaway's later
              top-up as the major externally visible capital anchors. What it does not disclose cleanly is the full
              board roster, committee independence, or a reconciled current cap table.
