companyProfile:
  summary: >-
    Bending Spoons is a Milan-founded, Nasdaq-listed software compounder that buys scaled digital products, rebuilds
    their technology and operating model on a centralized platform, and holds the assets long term. The 2026 IPO and
    subsequent Berkshire follow-on capital gave the company more acquisition firepower, while public evidence now shows
    portfolio-scale recurring revenue and a large installed user base. Even so, the public record still leaves
    product-level economics, debt detail, and brand-level retention only partially disclosed, so the business is easier
    to describe than to underwrite in full.
  foundedDate: '2013-01-01'
  founders:
    - name: Luca Ferrari
      role: CEO and co-founder
      background: Public face of the platform-and-acquisition strategy.
    - name: Francesco Patarnello
      role: Co-founder and Head of M&A
      background: Owns target selection and deal execution.
    - name: Matteo Danieli
      role: Co-founder and VP of Product
      background: Helped build the product organization and internal meritocracy.
