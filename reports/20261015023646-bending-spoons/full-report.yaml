              - CP008
              - CP011
      - number: '3.3'
        title: Durability depends on retention through harsher monetization and harder integrations
        blocks:
          - type: paragraph
            body: >-
              The moat is real only if the portfolio keeps holding users after the transformation playbook gets more
              aggressive. Multiple retained sources tie the strategy to price hikes, free-plan tightening, and large
              workforce cuts after acquisitions, while independent analysis warns that customer willingness to keep
              paying matters more than headcount reduction alone. Competitive risk therefore comes from churn,
              subscription fatigue, and reputational damage just as much as from a direct feature match. Scale also
              changes the risk profile: the AOL carve-out reportedly required months of technically difficult
              re-platforming, and the proposed Airtable transaction still carries regulatory, employee-retention, and
              closing-risk disclosures. Larger enterprise workflow targets can widen the opportunity set, but they also
              make execution mistakes more expensive.
            claimRefs:
              - CP003
              - CP004
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP011
              - CP012
              - CP013
