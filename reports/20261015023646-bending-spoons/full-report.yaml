      - number: '1.3'
        title: Milestones, scale, and pressure points
        blocks:
          - type: paragraph
            body: >
              2026 turned Bending Spoons from a private European compounder into a public acquirer using fresh equity,
              debt capacity, and operating cash flow to pursue larger targets. The July listing was followed by the
              Airtable agreement in August and the Miro agreement in September, while public metrics now span a $1.65
              billion TTM revenue readout from the FT profile and a $704 million Q2 revenue print cited by Global
              Finance. That pace is impressive, but the same independent sources highlight the core frictions:
              acquisition-led growth is not the same as organic growth, repeated layoffs and pricing changes create
              user-trust risk, and leverage remains meaningful enough that later chapters should test whether the
              compounding story still holds when integration complexity rises.
            claimRefs:
              - CO007
