      - number: '3.2'
        title: Differentiation comes from the shared platform and deal engine
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence-backed differentiator is Bending Spoons' shared platform: management and
              third-party reporting describe reusable people, proprietary technologies, data, AI tooling, pricing
              experiments, and operating discipline deployed across acquired products. That shared system matters
              because it is what lets Bending Spoons claim it can pay more than rival bidders and still earn an adequate
              return after closing. The same evidence also suggests unusual distribution leverage for a portfolio
              operator: the filing-based Fortune report says organically acquired customers generated 79% of
              new-customer revenue in 2025 while advertising expense was only 6% of revenue, implying strong brands and
              product-led channels still matter even before a new acquisition is layered onto the platform.
            claimRefs:
