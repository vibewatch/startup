      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE008
      - CE015
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The commercial engine starts with acquired installed bases, then splits into distinct consumer/prosumer and
      enterprise customer surfaces before cash generation funds the next deal cycle.
    data:
      items:
        - label: Acquire proven demand
          actor: Bending Spoons M&A
          touchpoints:
            - >-
              Targets products with existing users, payers, and predictable revenue rather than building greenfield
              demand
            - Airtable closed in September 2026; Miro was announced for Q4 2026 close
          tone: neutral
        - label: Preserve installed base
          actor: Portfolio product teams
          touchpoints:
            - Existing users keep their brand, workflows, data, and subscriptions inside the acquired product
            - Portfolio monthly active user and monthly paying customer totals are aggregate rather than de-duplicated
          tone: neutral
        - label: Split by customer archetype
          actor: Consumer, prosumer, and enterprise buyers
          touchpoints:
            - WeTransfer shows broad audience scale
            - Brightcove shows narrow but higher-value enterprise density
          tone: neutral
        - label: Reprice and rebuild
          actor: Product and monetisation teams
          touchpoints:
            - Free-tier restrictions, pricing changes, and product overhauls aim to raise lifetime value
            - Evernote criticism shows this stage can create user backlash
          tone: risk
        - label: Hold recurring revenue
          actor: Existing subscriber base
          touchpoints:
            - Portfolio net revenue retention stayed in the low-to-mid-90s through Q1 2026
            - Long-tenure subscribers remain a large share of revenue
          tone: positive
        - label: Reinvest into the next asset
          actor: Corporate capital allocator
          touchpoints:
            - Cash generation and financing fund the next acquisition wave
            - Expansion is currently clearest in enterprise workflow software rather than suite cross-sell
          tone: opportunity
    claimRefs:
      - CU001
      - CU005
      - CU007
      - CU009
      - CU010
      - CU013
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Financing, regulatory review, retention backlash, and integration/platform dependence remain the four highest
      residual risk clusters in public evidence.
    data:
      columns:
        - label: Likelihood
          detail: 12-month probability using current public evidence
        - label: Impact
          detail: Downside to revenue approvals flexibility or valuation
        - label: Mitigation maturity
          detail: How developed the public mitigation looks today
        - label: Residual exposure
          detail: Risk remaining after disclosed mitigations
      rows:
        - label: Leveraged acquisition and refinancing risk
          note: Debt service covenants and rate sensitivity matter because acquisition pace remains central to strategy.
          values:
            - label: High
              tone: warning
            - label: High
              tone: critical
            - label: Medium
              tone: neutral
            - label: High
              tone: critical
        - label: Cross-border regulatory and competition review
          note: AOL CFIUS review and Airtable approvals show live rather than hypothetical scrutiny.
          values:
            - label: Medium-high
              tone: warning
            - label: High
              tone: critical
            - label: Medium
              tone: neutral
            - label: High
              tone: critical
        - label: Customer retention after layoffs and monetization changes
          note: Independent reporting points to complaints and user-sensitivity, but public churn data is still thin.
          values:
            - label: High
              tone: warning
            - label: Medium-high
              tone: warning
            - label: Low-medium
              tone: neutral
            - label: High
              tone: critical
        - label: Platform cloud and AI-vendor dependence
          note: Third-party stores processors and infrastructure can directly affect uptime distribution and margins.
          values:
            - label: Medium-high
              tone: warning
            - label: High
              tone: critical
            - label: Medium
              tone: neutral
            - label: Medium-high
              tone: warning
        - label: Privacy and vendor-security incident exposure
          note: >-
            The prospectus already discloses a Vimeo-related vendor incident and says compliance is still evolving
            across jurisdictions.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: critical
            - label: Medium
              tone: neutral
            - label: Medium-high
              tone: warning
        - label: Founder-control governance
          note: >-
            Concentrated voting control can preserve speed, but it also limits external correction if risk appetite
            drifts too far.
          values:
            - label: High
              tone: warning
            - label: Medium-high
              tone: warning
            - label: Low
              tone: neutral
            - label: Medium-high
              tone: warning
    approximationNotes: >-
      Ordinal labels are analyst rankings synthesized from source-backed disclosures and reporting, not modeled
      probabilities.
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR008
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public scale and financing proof support the story, but discount-priced follow-on capital plus sparse operating
      disclosure keep the call cautious.
    data:
      nodes:
        - label: IPO proved demand
          detail: July 2026 IPO raised roughly $1.68B at an implied valuation of about $18.4B.
          tone: positive
        - label: Trading enthusiasm accelerated
          detail: Independent coverage described IPO-week value above $25B and a later Berkshire-day spike to about $31B.
          tone: positive
        - label: Fresh capital extends runway
          detail: Berkshire agreed to invest another $330M through a 10 million share private placement.
          tone: positive
        - label: Acquisition engine remains active
          detail: >-
            Airtable alone was described at about $480M ARR growing more than 20% YoY, while the broader pipeline
            remains large.
          tone: positive
        - label: Price and disclosure still diverge
          detail: >-
            The placement cleared at $33 per share and the retained Q2 page does not expose enough unit economics or
            leverage detail.
          tone: warning
        - label: Recommendation stays research-more
          detail: Underwrite only after fuller public filings or a more forgiving entry point.
          tone: adverse
    approximationNotes: Logic chain uses observed financing and market anchors rather than an inferred proportional weighting model.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV007
      - CV012
      - CV014
      - CV015
