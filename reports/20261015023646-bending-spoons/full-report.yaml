chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >
              The assigned evidence now supports a tighter identity statement than the June refresh context did. Bending
              Spoons was founded in Milan in 2013 and positions itself as a long-term acquirer and operator of digital
              products rather than a conventional venture-backed app studio or private-equity seller. Official materials
              repeatedly describe a cycle of buying scaled products, deeply rebuilding product, technology,
              organization, and monetization, then reinvesting the resulting earnings into more deals. Independent
              coverage broadly accepts that frame, but also warns that the scale narrative is acquisition-led, so later
              chapters should distinguish platform capability from organic product momentum.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO012
              - CO015
