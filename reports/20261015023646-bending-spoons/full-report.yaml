        title: Exhibits
        blocks:
          - type: callout
            title: The main competitive risk is post-close value leakage, not lack of targets
            body: >-
              The retained evidence suggests Bending Spoons' pipeline remains rich, but the harder question is whether
              larger, more enterprise-heavy assets can hold users after pricing changes, free-plan tightening, layoffs,
              and long integrations.
            calloutType: risk
            claimRefs:
              - CP010
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Recurring subscriptions are the core economic engine, but growth is still heavily acquisition-led
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial readthrough is that Bending Spoons already looks more like a scaled
              recurring-revenue portfolio than a speculative app roll-up. Multiple reports tied back to the IPO filing
              put 2025 revenue at $1.31 billion, up 95% year over year, with subscriptions contributing 93% of 2025
              sales and net revenue retention at 95%. Q1 2026 remained subscription-heavy at 84% of revenue and still
              showed more than 500 million monthly active users, while the company separately said it served more than 9
              million monthly paying customers in March 2026. That mix matters because it implies a large installed base
              that can be repriced, retained, and cross-funded over time, even if the company does not disclose
              brand-level gross margin or cohort retention. The important offset is that independent reporting still
              attributes most of the recent step-up in revenue to acquisitions rather than clean same-store organic
              compounding, so investors should treat scale quality as strong but not yet segment-disclosed.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI013
      - number: '4.2'
        title: >-
          Monetization discipline and centralized tooling appear to drive efficiency, but unit economics are still
          partial
        blocks:
          - type: paragraph
            body: >-
              Public signals on sales efficiency are unusually favorable for a company growing this quickly, but they
              are still proxies rather than a full operating model. Fortune's readout of the filing says organically
              acquired customers generated 79% of new-customer revenue in 2025 while advertising expense was only 6% of
              revenue, which suggests customer acquisition is not primarily being bought through heavy paid spend. The
              same source says revenue per employee more than doubled from 2023 to 2025, while official company
              materials describe a centralized platform of people, proprietary technologies, and proprietary data that
              is reused across acquired products. That supports a credible margin path: small integration teams, shared
              tools, pricing changes, and operational simplification can lift economics without needing each brand to
              rebuild a full stack independently. The missing piece is that none of the assigned public sources provide
              product-level CAC, payback, gross margin, support burden, or channel-fee disclosure, so the current
              unit-economics story is still inferential rather than fully underwritten.
            claimRefs:
              - CI003
              - CI007
              - CI008
              - CI009
              - CI014
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI007
              - CI008
              - CI010
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI007
              - CI008
              - CI009
              - CI011
              - CI012
              - CI013
      - number: '4.3'
        title: >-
          Fresh equity has expanded acquisition capacity, but leverage and integration discipline still determine
          capital adequacy
        blocks:
          - type: paragraph
            body: >-
              On funding, the public picture is directionally stronger than it was in the prior report but still not
              complete enough to clear capital-risk questions. Secondary reporting and management interview coverage say
              Bending Spoons raised no meaningful primary equity until 2023, funded acquisitions largely through
              reinvested profits and debt, and then raised roughly $1.68 billion in its July 2026 IPO at an implied
              valuation of about $18.4 billion. In October 2026, Trending Topics reported a further $330 million
              Berkshire Hathaway private placement priced at $33 per share, with management framing the proceeds as
              extra financial flexibility for future acquisitions. The announced Airtable deal shows where that capital
              can go: Bending Spoons agreed to pay a $1.285 billion enterprise value for a business with roughly $480
              million of ARR growing more than 20% year over year. That could deepen enterprise-software mix, but it
              also reinforces that future returns depend on buying well, integrating quickly, and not leaning too hard
              on debt against assets whose user retention can change after repricing.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI015
      - number: '4.4'
        title: 'Financial verdict: quality is better than the disclosure depth'
        blocks:
          - type: paragraph
            body: >-
              The public case for Bending Spoons is financially attractive on three fronts: recurring revenue is high,
              apparent paid-acquisition intensity is low, and fresh post-IPO capital should let management keep buying
              scaled software assets instead of depending on one product cycle. The public case is weaker on the
              underwriting details that would convert that narrative into a conviction-ready margin and runway model.
              The assigned source pool still does not disclose brand-level revenue mix, gross margin, paid CAC, payback,
              customer concentration, lender-by-lender debt maturities, covenant headroom, or unrestricted cash. In
              practice, that means the current verdict is that revenue quality and operating leverage look real, but
              capital intensity and downside protection remain only partially visible. A serious diligence process
              should push immediately from portfolio-level claims to product-level cohorts and a debt/cash bridge before
              underwriting an enduring compounder outcome.
            claimRefs:
              - CI001
              - CI003
              - CI007
              - CI010
              - CI011
              - CI012
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Portfolio economics look stronger than a typical roll-up
            body: >-
              The public file combines scale, recurrence, and apparent efficiency in a way that is uncommon for an
              acquisition-led software story: 93% subscription mix, 95% NRR, low disclosed advertising intensity, and
              improving profit all point to real monetization quality rather than pure M&A optics.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI007
              - CI008
          - type: callout
            title: Capital allocation still carries the core downside
            body: >-
              Fresh equity reduces immediate financing pressure, but the model still breaks if management overpays,
              leans too far into debt, or pushes repricing and free-plan cuts past the point where retention can absorb
              them.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope is broad, but the portfolio is organized around repeatable workflow categories
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows Bending Spoons is no longer a single-app company or even just a mobile-app
              aggregator. The portfolio now spans consumer AI/media utilities, creator and distribution tools,
              knowledge-work software, and enterprise workflow platforms. Fortune reported that ten businesses—AOL,
              Brightcove, Eventbrite, Evernote, Harvest, komoot, Remini, StreamYard, Vimeo, and WeTransfer—generated
              more than 80% of Q1 2026 revenue, which implies management attention and shared tooling are concentrated
              around scaled, already-proven brands rather than experimental bets. The Airtable transaction also matters
              strategically: it extends the portfolio from subscription-heavy consumer and prosumer assets into
              enterprise workflow software where custom apps, data models, and automation become the product surface.
              That breadth is a strength because it gives Bending Spoons many revenue pools to optimize, but it also
              makes brand-by-brand technical diligence harder because the public record still emphasizes the operating
              model more than the detailed product map for each business.
            claimRefs:
              - CE007
              - CE008
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE007
              - CE008
              - CE014
      - number: '5.2'
        title: The core technology asset is the shared transformation platform
        blocks:
          - type: paragraph
            body: >-
              The strongest product-tech evidence is that Bending Spoons treats acquisitions as endpoints of a common
              internal platform rather than as stand-alone subsidiaries. The prospectus defines that platform as people,
              proprietary technologies, and proprietary data, then gives concrete examples: a data infrastructure, a
              user lifetime value predictor, a product experimentation toolkit, 3,000 experiments run in 2025, and 3.8
              billion data points processed per day on average in Q1 2026. Independent reporting then adds the operating
              categories layered on top of that foundation: product analytics, user acquisition, payments, pricing
              experimentation, customer support, recruiting, and organizational design. The product consequence is that
              Bending Spoons appears to build once and reuse often, especially in AI-assisted coding, pricing, support,
              and growth operations. That is a differentiated architecture if it works, because it means new brands can
              be plugged into an existing machine instead of rebuilding commercial and technical capabilities from
              scratch.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE011
              - CE012
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE008
              - CE015
      - number: '5.3'
        title: Deployment maturity is real, but integration remains labor-intensive and product-specific
        blocks:
          - type: paragraph
            body: >-
              The best public evidence on deployment maturity comes from examples where Bending Spoons had to modernize
              or re-platform an acquired product. Official filings and interviews consistently describe deep
              transformations rather than light-touch portfolio ownership: teams reorganize, user interfaces are
              redesigned, pricing is reworked, and technology is overhauled. The AOL carve-out is the clearest
              integration case in the assigned pool, because a Bending Spoons general manager described months of work
              to move AOL from Yahoo's environment onto the Bending Spoons platform. That supports the view that the
              company has real migration capability, but it also shows the operating burden is not abstract. Each major
              brand can carry its own stack, data, customer-support, and security dependencies. Public evidence is good
              enough to conclude the company has a repeatable playbook; it is not good enough to score remaining
              integration debt brand by brand.
            claimRefs:
              - CE001
              - CE009
              - CE010
              - CE014
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE008
              - CE009
              - CE014
              - CE015
      - number: '5.4'
        title: Security, privacy, AI, and vendor exposure are material technology risks
        blocks:
          - type: paragraph
            body: >-
              The prospectus is unusually explicit that the technology stack carries not just execution upside but also
              real control risk. Management highlights privacy, data protection, cybersecurity, intermediary-liability,
              and AI-regulation exposure as material legal and operational issues, and it notes that AI systems can be
              inaccurate, biased, or otherwise unreliable. That matters more in this portfolio than in a narrow product
              company because a shared operating model can also create shared failure modes: a weak vendor, weak control
              process, or weak AI rollout can affect multiple brands at once. The disclosed April 2026 third-party
              analytics-vendor incident affecting Vimeo customer and user data reinforces that point. For underwriting,
              the practical conclusion is that Bending Spoons looks stronger on transformation velocity than on public
              control transparency. The chapter therefore clears the product-tech bar on operating-model evidence, but
              not on public assurance evidence.
            claimRefs:
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform reuse looks like the core moat
            body: >-
              The assigned evidence points to one central thesis: Bending Spoons is not just buying brands, it is
              routing those brands through a common operating system of people, data, experimentation, and AI-assisted
              tooling. That is the clearest source-backed product differentiation in the chapter.
            calloutType: strength
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE006
          - type: callout
            title: Public system visibility is still thinner than the operating story
            body: >-
              The company publicly describes the platform at a high level, but does not provide a product-by-product
              system map, shared-service boundary chart, or public control matrix across the largest acquired brands.
              That limits confidence on remaining integration debt and shared failure modes.
            calloutType: risk
            claimRefs:
              - CE009
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is broad, but it is not one customer archetype
        blocks:
          - type: paragraph
            body: >-
              Bending Spoons is not selling one integrated suite to one buyer persona. The current evidence instead
              points to a portfolio with materially different customer types by product: mass-consumer and prosumer
              subscription apps, creator and collaboration tools, and a growing enterprise workflow layer added through
              large acquisitions. The clearest portfolio-scale proof comes from the prospectus, which says the business
              served over 500 million monthly active users and more than 9 million monthly paying customers in March
              2026, while warning that both figures can double-count the same user or payer across products.
              Product-level examples show why that caveat matters. WeTransfer had 58 million monthly active users and 1
              million monthly paying customers in March 2026, while Brightcove had only about 15,000 monthly active
              users and 1,700 monthly paying customers because it serves large enterprises rather than broad audiences.
              In other words, Bending Spoons owns customer surfaces that range from broad, self-serve subscription
              funnels to far narrower enterprise accounts, so any diligence read should treat aggregate customer counts
              as scale indicators rather than a uniform demand metric.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU007
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU007
              - CU009
              - CU010
              - CU011
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU007
              - CU009
              - CU010
              - CU013
      - number: '6.2'
        title: Durability looks stronger at the portfolio level than at the product level
        blocks:
          - type: paragraph
            body: >-
              The public record is strongest on installed-base durability at the consolidated level. The prospectus
              reports 94% net revenue retention in Q1 2026 after 95% for full-year 2025, alongside a customer-tenure
              profile in which 48% of subscription revenue came from customers with at least five years of tenure and
              28% came from customers with at least ten years of tenure; revenue-weighted average subscriber tenure was
              8.0 years. Those numbers suggest a sticky base, but they do not prove that every major asset has the same
              retention quality, because the filing only discloses a few product-level examples. Customer acquisition
              also looks less dependent on paid demand than many scaled app portfolios: customers acquired through
              organic channels generated 83% of revenue from new customers in Q1 2026, versus 79% in 2023, 76% in 2024,
              and 79% in 2025. That mix matters because Bending Spoons' model depends on preserving recurring demand
              after restructurings and pricing changes, not just buying more revenue through M&A.
            claimRefs:
              - CU005
              - CU006
              - CU008
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU008
      - number: '6.3'
        title: Expansion proof is clearest in enterprise workflow assets, while backlash risk remains product specific
        blocks:
          - type: paragraph
            body: >-
              The freshest public customer proof is concentrated in the enterprise workflow assets Bending Spoons is
              buying rather than in a cross-portfolio selling motion. At announcement, Airtable said more than 500,000
              organizations - including 80% of the Fortune 100 - relied on its platform, while Bending Spoons said ARR
              was approximately $480 million and growing more than 20% year over year. Independent coverage of the
              announced Miro acquisition described an even larger business-customer footprint, with roughly 250,000
              organizations, around 4 million paying users, and more than 750 customers above $100,000 in ARR, though
              that deal had not yet closed. The risk case is that the same playbook that expands earnings can strain
              user trust product by product. The prospectus warns that negative reviews or ratings affecting one product
              can spill over into the broader portfolio, and independent reporting ties that risk to post-acquisition
              layoffs, higher prices, and reduced free plans. Evernote is the best documented example: independent
              coverage says repricing and tighter free usage drew criticism even as Bending Spoons reported 99% average
              net revenue retention for Evernote between Q1 2023 and Q1 2026. That combination suggests the model can
              preserve revenue with a committed base, but it does not eliminate the need to underwrite product-level
              backlash and enterprise-account concentration separately.
            claimRefs:
              - CU003
              - CU009
              - CU010
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU009
              - CU010
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Low portfolio concentration does not remove product-level underwriting
            body: >-
              The filing's "no customer above 1% of revenue" disclosure is a portfolio-level comfort point, but the risk
              work still has to happen at the asset level because enterprise products such as Airtable, Miro,
              Brightcove, and Vimeo are not accompanied by public customer ladders or renewal schedules in this pool.
            calloutType: insight
            claimRefs:
              - CU003
              - CU009
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The current public record supports a high-severity ranking led by financing and regulatory execution, with
              customer-retention and platform-reliability next. The filing says existing and future indebtedness can
              restrict operating flexibility, accelerate in default, and force refinancing on uncertain terms, while
              higher rates can raise acquisition costs and lower expected returns. That matters more because Bending
              Spoons continues to push deal volume after the IPO: the company announced a $1.285 billion Airtable
              transaction with approvals still pending, independent coverage later described roughly $2.64 billion of
              Airtable-plus-Miro enterprise value within five weeks, and Berkshire's $330 million placement was
              explicitly framed as extra financial flexibility for more acquisitions. This is still a coherent
              compounder story, but the thesis breaks quickly if refinancing, approvals, customer retention, or
              third-party platform reliability weaken at the same time.
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR008
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory and legal exposure is now strategic, not incidental
        blocks:
          - type: paragraph
            body: >-
              Cross-border review has already moved from theoretical to active. The prospectus says AOL was voluntarily
              filed with CFIUS in March 2026 and remained under review, while Treasury questions on the March 2026
              Eventbrite acquisition could still force a formal filing. The same filing says Italian Golden Power,
              antitrust, subscription, advertising, privacy, and cybersecurity regimes can impose mitigation, remedies,
              penalties, class actions, or even transaction nullification. Airtable adds another live approval path
              because the announced deal remains subject to regulatory clearances and the company itself lists
              litigation, employee-retention, and management distraction risk around the transaction. Governance
              compounds that exposure because the founders will still control 82.71% of voting power after the IPO,
              leaving outside investors with limited leverage if the risk appetite proves too aggressive.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR013
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR013
              - CR016
      - number: '7.3'
        title: Operational durability depends on retaining quality after deep change
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows a repeatable but sharp-edged operating playbook: replatform products, cut staff,
              change pricing, and rely on a more centralized technical stack. The prospectus warns acquired products may
              arrive with legacy code, undocumented dependencies, technical debt, vendor exposure, and customer-support
              complexity; it also discloses a third-party analytics incident that compromised some Vimeo customer and
              user data in April 2026. Independent reporting adds the user-trust side: critics point to layoffs at
              Evernote, WeTransfer, and Tractive, recurring complaints about higher prices and reduced free plans, and
              Eastern Herald's description of Vimeo's video team being gone while AI handled most pull requests a year
              later. None of that proves product decay, but it does mean retention, support quality, and incident
              frequency are the operational kill metrics to watch.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Capital access and deal sequencing remain the main execution constraint
        blocks:
          - type: paragraph
            body: >-
              The model still depends on repeated access to capital and on integrating large targets without losing
              customer or regulator confidence. The filing says debt service, covenants, and refinancing needs can
              constrain the company exactly when it wants to keep buying; the same document also says a meaningful share
              of distribution, payments, cloud, and AI infrastructure sits with third parties that can change pricing,
              ranking, access, or uptime. Recent evidence points in the same direction. Berkshire's follow-on investment
              was meant to fund further acquisitions, Sourcery says the company has financed acquisitions primarily with
              debt for most of its history, and the post-IPO sequence from Airtable to Miro suggests integration
              concurrency is rising before the market has seen a full public-company operating cycle. Diligence should
              therefore focus on covenant headroom, approval timelines, platform concentration, and brand-level churn
              after major transformations.
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers to monitor now
            body: >-
              The fastest thesis-break paths are a refinancing squeeze or covenant problem before the next large deal, a
              regulator-imposed remedy or delay on AOL, Eventbrite, Airtable, or Miro, a measurable step-down in
              retention after repricing or support changes, or a material outage, security event, or platform-policy
              shift that hits billing or distribution across multiple products.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR009
              - CR013
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The investable question is not whether Bending Spoons is interesting, but whether the current public price
              already discounts most of the upside. The July 2026 IPO was priced at $29 per share at an implied
              valuation of about $18.4B, IPO-week trading briefly pushed market capitalization above $25B, and the
              October 2026 Berkshire-related rally briefly took the company to about $31B on Trending Topics' account.
              At the same time, the fresh $330M private placement was struck at $33 per share, below the prior closing
              price cited by Trending Topics. That mix argues for a price-sensitive research-more stance: the business
              keeps attracting credible capital, but the market is already rewarding the story faster than public
              operating disclosure is improving.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV012
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV012
              - CV014
              - CV015
      - number: '8.2'
        title: Why the thesis can work
        blocks:
          - type: paragraph
            body: >-
              The pro-valuation case is straightforward. Bending Spoons has kept adding financing capacity, says its M&A
              pipeline remains strong, and continues to pursue large software assets after the listing. Berkshire's
              total ownership will reach 4% if the private placement closes, which extends the July IPO endorsement with
              another sizeable check. The Airtable agreement also shows management is buying scale that can matter: the
              target was described as roughly $480M of ARR growing more than 20% year over year as of June 2026.
              Sourcery's interview further reinforces that this is not a one-off trade but an acquisition system built
              around roughly 1,000 potential targets and a 5-10 deal annual cadence. Those facts support paying for an
              acquisition platform, not just a bundle of legacy brands.
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Anti-thesis and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis is not that Bending Spoons lacks momentum; it is that the public record still leaves too
              much of the return bridge unproven at this valuation. Independent reporting links the model to layoffs,
              free-tier cuts, and recurring customer backlash after several acquisitions, which is a real warning for a
              roll-up that depends on repeated integration and repricing. The retained Q2 2026 results page announces
              the quarter but does not expose revenue, margin, cash-flow, or leverage detail in the fetched text, so
              investors still cannot test whether operating improvements, financing capacity, and acquisition pace are
              compounding at a rate that justifies the new public mark. That is enough to stop short of a buy call today
              even if the long-term model remains plausible.
            claimRefs:
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Scenarios, diligence asks, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to frame valuation today is through public market anchors rather than a false-precision
              model. The bear anchor is the $18.4B IPO valuation, the base range is the post-listing band between
              roughly $25B and the low-$30B area described in independent coverage, and the bull case requires
              management to prove that fresh capital plus recent large acquisitions can expand earnings without
              reigniting user-trust problems or forcing unattractive financing. The next diligence cycle should focus on
              post-IPO filings, the 6-K attached to the Berkshire placement, cash-flow and leverage detail, and evidence
              that Airtable and other large deals are integrating without another wave of product backlash. A break
              below that proof bar, not a lack of narrative, is what would invalidate the thesis.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV007
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Public evidence supports following Bending Spoons closely, but not paying for a clean compounding story
              before filings make the return bridge more explicit.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV012
              - CV014
              - CV015
          - type: callout
            title: Financing plus pipeline are real
            body: >-
              A second Berkshire check, an active target pipeline, and continued large acquisitions show that the
              capital-formation side of the model is working.
            calloutType: strength
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV009
          - type: callout
            title: Execution and trust are still the gating variables
            body: >-
              The recurring pattern of layoffs, tighter free plans, and customer backlash means valuation upside depends
              on Bending Spoons proving that its transformations create more value than they destroy.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV014
