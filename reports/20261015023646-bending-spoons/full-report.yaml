  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence describes a compounding loop: buy scaled digital products, replatform and reprice them, monetize
      through subscriptions, and recycle cash plus new capital into additional acquisitions.
    data:
      nodes:
        - label: Established products with installed demand
          value: 500M MAUs / 9M paying customers
          note: March 2026 public scale across the portfolio before any future acquisitions.
        - label: Small transformation teams and shared platform
          note: >-
            Official materials describe reorganizing teams, overhauling technology, redesigning interfaces, and changing
            monetization on a reusable platform.
        - label: Subscription-heavy monetization
          value: 93% FY2025 sales / 84% Q1 2026 revenue
          note: Recurring subscriptions dominate the reported mix.
        - label: Retention plus relatively light paid acquisition
          value: 95% NRR / 79% organically acquired new-customer revenue
          note: >-
            Public proxies suggest most revenue is retained and a large share of new revenue is not bought through heavy
            advertising.
        - label: Operating leverage
          value: $278M 2025 operating profit
          note: Revenue per employee more than doubled from 2023 to 2025.
        - label: Capital recycled into more acquisitions
          value: $1.68B IPO + $330M Berkshire placement
          note: >-
            Management and independent reporting both frame fresh capital as fuel for continued M&A, including the
            announced Airtable deal.
    approximationNotes: >-
      This is a qualitative flow rather than a reconciled waterfall: the assigned public sources describe the
      compounding mechanism, but they do not disclose a product-by-product bridge from customer activity to gross
      profit.
    claimRefs:
      - CI003
      - CI007
      - CI008
      - CI009
      - CI011
      - CI012
      - CI013
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Bending Spoons layers target selection, shared tooling, AI, and portfolio operations into one transformation
      platform.
    data:
      layers:
        - label: Target sourcing and selection
          detail: A high-volume funnel identifies durable digital brands before resources are committed.
          modules:
            - label: Opportunity funnel
              detail: 2,500+ opportunities sourced in 2025, roughly 200 analyzed in depth, and six acquisitions completed.
            - label: Target pipeline
              detail: The prospectus describes more than 1,000 future targets as possible candidates.
        - label: Transformation playbook
          detail: >-
            Post-close work centers on reorganization, technology overhaul, UI redesign, product acceleration, and
            monetization.
          modules:
            - label: Deep transformation
              detail: >-
                Official disclosures describe technology overhauls and ongoing optimizations rather than passive
                ownership.
        - label: Shared proprietary technologies
          detail: Common internal systems are deployed across acquired businesses.
          modules:
            - label: Tooling examples
              detail: Data infrastructure, user lifetime value predictor, and experimentation toolkit.
        - label: Proprietary data and experimentation
          detail: Cross-portfolio telemetry feeds product and operating decisions.
          modules:
            - label: Scale evidence
              detail: 3,000 experiments in 2025 and 3.8 billion data points processed per day on average in Q1 2026.
        - label: AI operating layer
          detail: AI is embedded into internal development and operating workflows.
          modules:
            - label: Internal software development
              detail: >-
                More than 90% of pull requests were authored or co-authored by AI by the end of Q1 2026, with around 70%
                authored by AI alone.
            - label: Reused functions
              detail: Independent reporting ties AI reuse to engineering, pricing, support, hiring, and product analytics.
        - label: Portfolio outputs
          detail: >-
            The platform supports consumer apps, creator/media tools, productivity software, and enterprise workflow
            products.
          outputs:
            - label: Consumer and creator brands
              detail: Remini, Splice, StreamYard, Vimeo, WeTransfer.
            - label: Productivity and workflow brands
              detail: Evernote, Harvest, Airtable.
            - label: Community and media brands
              detail: AOL, Brightcove, Eventbrite, komoot.
    approximationNotes: >-
      This stack is a synthesized operating model from public disclosures; Bending Spoons does not publish a canonical
      architecture diagram tying each shared service to each portfolio brand.
    claimRefs:
