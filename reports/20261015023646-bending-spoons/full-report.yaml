          Sustained post-IPO filings showing earnings conversion and disciplined deal underwriting would strengthen the
          thesis.
      - - Scale thesis
        - >-
          Airtable adds an asset described at about $480M ARR growing more than 20% YoY and fits the company's
          compounding narrative.
        - Evidence that recent large deals integrate without margin or retention damage would improve confidence.
      - - Anti-thesis
        - Independent reporting ties the model to layoffs, free-tier cuts, and customer backlash after acquisitions.
        - Clean cohort retention, churn, or ARPU disclosure by major brand would reduce this concern.
      - - Disclosure gap
        - >-
          The retained Q2 results page does not expose enough revenue, margin, cash-flow, or leverage detail for
          conviction underwriting.
        - >-
          A detailed 6-K or later public filings with debt, dilution, and segment economics would move the call
          positively.
    notes: >-
      Rows mix factual support with explicit evidence thresholds for changing the recommendation; null public
      disclosures are treated as gaps, not as proof.
    claimRefs:
      - CV006
      - CV007
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Fresh capital funds accretive acquisitions and post-IPO filings prove durable earnings expansion.
        - Market sustains or exceeds the roughly $31B trading mark cited after the Berkshire news.
        - Integration execution still has to outrun backlash and financing complexity.
        - Requires new disclosure plus clean execution.
      - - Base
        - Company keeps strategic momentum but public disclosure remains incomplete through the next filing cycle.
        - >-
          Shares orbit the post-listing public marks between the IPO-week >$25B signal and the low-$30B enthusiasm
          range.
        - Narrative stays ahead of evidence and limits multiple expansion.
        - Most consistent with current evidence.
      - - Bear
        - Large integrations disappoint or financing becomes more dilutive or constrained than bulls expect.
        - Valuation compresses toward the $18.4B IPO anchor or other private-placement-clearing levels.
        - User trust, pricing pushback, or weak post-close execution break the compounding story.
        - Material if disclosure or execution slips.
    notes: >-
      Valuation anchors are observed public marks from retained sources, not a discounted-cash-flow or comps-based
      fair-value model.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV007
      - CV014
      - CV015
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Bending Spoons' current profile is the result of a long-running acquisition engine that stepped up sharply in
      2026.
    data:
      items:
        - date: '2013'
          label: Company founded in Milan
          detail: Independent coverage dates the founding to 2013 and frames the company as an Italian software operator.
          tone: neutral
        - date: '2018'
          label: Splice acquisition marked a scale inflection
          detail: Medium describes the GoPro-owned Splice deal as a turning point before larger brand acquisitions.
          tone: positive
        - date: '2021'
          label: Remini acquisition became the modern breakout phase
          detail: Medium says Bending Spoons in its modern form started with the Remini acquisition.
          tone: positive
        - date: '2023'
          label: First primary institutional equity round
          detail: Sourcery names Baillie Gifford, Cox Enterprises, and Durable as the first primary-equity backers.
          tone: positive
        - date: Jan. 2026
          label: AOL acquisition completed
          detail: Official and interview sources place AOL in the 2026 acquisition sequence.
          tone: neutral
        - date: Mar. 2026
          label: Eventbrite acquisition completed
          detail: Official Airtable announcement cites Eventbrite as a March 2026 acquisition.
          tone: neutral
        - date: Jul. 1 2026
          label: Nasdaq IPO
          detail: GFMag says the listing raised $1.68bn at an $18.4bn valuation.
          tone: positive
        - date: Aug. 4 2026
          label: Airtable agreement announced
          detail: Bending Spoons agreed to buy Airtable at a $1.285bn enterprise value.
          tone: positive
        - date: Sep. 10 2026
          label: Miro agreement announced
          detail: >-
            Bending Spoons agreed to buy Miro at a $1.355bn enterprise value with $295mn reinvestment from some
            shareholders.
          tone: positive
        - date: Oct. 2026
          label: Berkshire increased exposure
          detail: Trending Topics says Berkshire added a $330mn private placement on top of its IPO investment.
          tone: positive
    approximationNotes: null
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO009
      - CO010
      - CO016
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The disclosed market lens is a screening sequence that narrows a broad software universe into transformable
      digital businesses rather than a bottom-up end-user-spend model.
    data:
      nodes:
        - label: Starting universe
          value: Tens of thousands of private and thousands of public businesses
          note: Management says the addressable-market study started from a much broader digital-business universe.
          claimRefs:
            - CM001
            - CM002
        - label: Geography screen
          value: Europe or North America headquarters
          note: >-
            The current focus reflects familiarity with those regions, not a disclosed claim that the model cannot
            travel elsewhere.
          claimRefs:
            - CM001
            - CM002
        - label: Revenue screen
          value: $50M-$5B estimated annual revenue
          note: >-
            The company says this is the size range it is currently prioritizing, while expecting larger targets over
            time.
          claimRefs:
            - CM002
            - CM009
        - label: Revenue-model screen
          value: Self-serve subscriptions, sales-led subscriptions, or advertising
          note: The screen excludes businesses that depend heavily on IT services or other human-delivery revenue.
          claimRefs:
            - CM001
            - CM003
        - label: Qualified target list
          value: '>1,000 businesses'
          note: This is management's identified pool of attractive acquisition candidates over the next few years.
          claimRefs:
            - CM002
            - CM009
        - label: Implied revenue base
          value: Nearly $400B aggregate estimated 2025 revenue
          note: Useful as a scale signal, but still company-built rather than independently benchmarked.
          claimRefs:
            - CM002
    approximationNotes: >-
      Layer width shows sequence, not proportional market share; the underlying study mixes criteria and outputs, so the
      pyramid is a screening lens rather than a mathematically additive TAM stack.
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM009
  - id: FP001
