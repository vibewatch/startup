      - ["Enterprise workflow and operations software", "Product, marketing, and operations teams", "Expanding / enterprise entry", "Airtable extends the portfolio into no-code workflow software with large enterprise adoption.", "No public post-close architecture roadmap or shared-service boundary disclosure for Airtable."]
    notes: >-
      Rows summarize public workflow categories rather than a full SKU inventory; public
      evidence is strongest on major brands and weakest on brand-level retention, roadmap,
      and migration detail.
    claimRefs: [CE007, CE008, CE014]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - ["Screen and buy durable digital businesses", "Owners of mature digital assets often face under-monetization or operational drift.", "Bending Spoons runs a large sourcing and underwriting funnel, then applies a shared transformation playbook post-close.", "Acquiry reported 2,500+ opportunities sourced in 2025, ~200 analyzed in depth, and six acquisitions completed.", "Opportunity volume does not show how much integration capacity remains after each close."]
      - ["Improve consumer-subscription apps after acquisition", "Useful products may have strong demand but weak pricing, UX, or experimentation cadence.", "The company applies A/B testing, AI-enabled product work, and subscription optimization to mature apps.", "Acquiry reported that Remini served more than five times as many monthly active users and generated more than nine times as much revenue by 2025 as before the acquisition.", "Public evidence does not quantify backlash, churn, or long-run cohort quality by app."]
      - ["Modernize mature productivity software", "Legacy products can carry tech debt, slow release cycles, and weak monetization.", "Bending Spoons rebuilds core systems, redesigns user experience and monetization, and accelerates product development after takeover.", "The prospectus says it rewrote Remini's codebase, modernized Evernote's technology, and upgraded StreamYard's audio and video quality.", "The filing does not disclose comparable delivery metrics, uptime, or remaining technical debt for every major brand."]
      - ["Run enterprise workflow automation without waiting on engineering", "Large teams need custom apps, shared data models, and automation for operational workflows.", "Airtable adds a no-code database and workflow platform to the portfolio's product surface.", "Bending Spoons' Airtable announcement says more than 500,000 organizations, including 80% of the Fortune 100, run on Airtable.", "The public record still lacks the post-close integration, packaging, and support roadmap."]
    notes: >-
      Benefits are limited to the public metrics or examples disclosed in the assigned
      pool; missing cohort, SLA, and product-level economics data remain unresolved.
    claimRefs: [CE008, CE009, CE014, CE015]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Talent deployment", "Small task forces and mobile teams move across portfolio brands where transformation work is heaviest.", "High talent density and the ability to reallocate teams quickly.", "Scaling the culture and hiring bar becomes harder as the public-company portfolio grows."]
      - ["Shared proprietary technologies", "Core tooling includes data infrastructure, a user lifetime value predictor, and a product experimentation toolkit.", "Acquired products must be integrated deeply enough to adopt the common stack.", "Public evidence does not map which major brands have already adopted which shared systems."]
      - ["Proprietary data and experimentation", "Cross-brand telemetry and experimentation improve pricing, product, and underwriting decisions.", "Consistent instrumentation, privacy-compliant data handling, and reliable vendors.", "Privacy, cybersecurity, and vendor failures can degrade product performance or create multi-brand exposure."]
      - ["AI and automation layer", "AI is used in code generation, product work, marketing, support, and monetization workflows.", "Model quality, governance, and legal rights to the underlying data and outputs.", "Hallucinations, bias, customer backlash, and evolving AI regulation can damage quality or trust."]
    notes: >-
      This table combines official disclosure with independent reporting; Bending Spoons
      does not publish a brand-by-brand system map or a public control matrix for the
      shared stack.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE011, CE012, CE013]
