callouts:
  - calloutType: strength
    title: Platform reuse looks like the core moat
    body: >-
      The assigned evidence points to one central thesis: Bending Spoons is not just buying
      brands, it is routing those brands through a common operating system of people,
      data, experimentation, and AI-assisted tooling. That is the clearest source-backed
      product differentiation in the chapter.
    claimRefs: [CE002, CE003, CE005, CE006]
  - calloutType: risk
    title: Public system visibility is still thinner than the operating story
    body: >-
      The company publicly describes the platform at a high level, but does not provide
      a product-by-product system map, shared-service boundary chart, or public control
      matrix across the largest acquired brands. That limits confidence on remaining
      integration debt and shared failure modes.
    claimRefs: [CE009, CE011, CE012, CE013]
