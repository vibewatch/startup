  evidenceGaps:
    - type: missing-source
      severity: material
      topic: architecture-transparency
      missingEvidence: Product-by-product architecture diagrams, shared-service boundaries, and remaining migration milestones across the largest brands.
      whyItMatters: Without that map, diligence cannot separate a reusable core platform from still-fragmented legacy estates and integration debt.
      diligencePath: Request internal system maps, migration roadmaps, and brand-level ownership matrices for AOL, Evernote, Airtable, Vimeo, and other major products.
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: control-surface
      missingEvidence: Brand-level uptime, security-certification, incident-history, and shared-control disclosures for the common platform and major products.
      whyItMatters: Product quality and multi-brand platform reuse are only underwritten cleanly when the control surface, assurance posture, and operational performance are explicit.
      diligencePath: Request trust-center materials, audit results, major-incident logs, and a shared-control matrix covering first-party and vendor-operated services.
      relatedQuestionRefs: [QE007, QE008]
    - type: private-evidence-only
      severity: minor
      topic: developer-signal
      missingEvidence: First-party developer or practitioner-signal evidence such as public repos, package/download metrics, API-doc usage, or external community adoption.
      whyItMatters: Public practitioner signal would help validate how much of the platform is externally consumed, documented, or battle-tested beyond management narrative.
      diligencePath: Ask for internal engineering productivity dashboards or externally visible API/developer-surface metrics that management is willing to disclose.
      relatedQuestionRefs: [QE008]
