  topStrengths:
    - >-
      Large recurring-revenue base with more than 500 million monthly active users and more than 9 million paying
      customers.
    - Proven buy-rebuild operating model with fresh public-market capital to keep scaling acquisitions.
    - Founder-led execution and a centralized platform that appears to compound operating leverage.
  topRisks:
    - Leverage, refinancing, and capital dependence become more consequential as deal size rises.
    - Layoffs, repricing, and product changes can keep creating user-trust and retention backlash.
    - Product-level economics, debt maturities, and brand-by-brand retention remain thinly disclosed.
  unresolvedGaps:
    - Brand-level revenue mix, gross margin, CAC, payback, and churn remain undisclosed.
    - A full debt-maturity ladder, covenant headroom, and unrestricted cash bridge are still missing.
    - Integration results for Airtable and Miro are too early to underwrite at the product level.
    - Customer-trust recovery after layoffs and repricing changes is still anecdotal rather than cohort-based.
