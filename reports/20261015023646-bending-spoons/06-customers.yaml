        - Custom apps, product operations, marketing operations, and other mission-critical workflows
        - Production customer cohort cited at acquisition announcement
        - More than 500,000 organizations and approximately $480 million ARR growing over 20 percent year over year
        - Company-issued disclosure; no named end-customer list in this pool
      - - Miro organizations and six-figure accounts
        - Enterprise collaboration and whiteboarding
        - Business and enterprise collaboration workflows
        - Production customer cohort cited in independent coverage, but asset was still pending close
        - Around 250,000 organizations, roughly 4 million paying users, and more than 750 customers above $100,000 ARR
        - Metrics came from pre-close coverage and were not yet tied to an integrated Bending Spoons disclosure
      - - WeTransfer professionals and small enterprises
        - Prosumer and SMB file-sharing
        - File transfer and collaboration with audience reach
        - Production installed base
        - 58 million monthly active users and 1 million monthly paying customers in March 2026
        - Cohort is named only at segment level, not as enterprise accounts or reference customers
      - - Brightcove large enterprises
        - Enterprise video
        - Large-enterprise video and communications workflows
        - Production installed base
        - About 15,000 monthly active users and 1,700 monthly paying customers in March 2026
        - Public evidence in this pool does not identify customer names, contract sizes, or renewal dates
    notes: The assigned pool proves real customer cohorts, but not a full named-reference roster across the portfolio; rows therefore mix enterprise-account cohorts and product-level installed-base proof.
