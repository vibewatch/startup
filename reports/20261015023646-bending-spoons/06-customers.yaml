        - Same payer can be counted more than once across products
      - - Portfolio net revenue retention
        - 94 percent in Q1 2026; 95 percent in 2025
        - 2025 to Q1 2026
        - Prospectus
        - Medium
        - Suggests recurring revenue holds up despite restructurings
        - Metric excludes new customer acquisition and is portfolio level rather than product specific
      - - Long-tenure subscriber revenue
        - 48 percent from five-plus-year customers; 28 percent from ten-plus-year customers; 8.0 years revenue-weighted average tenure
        - Q1 2026
        - Prospectus
        - Medium
        - Indicates a meaningful share of revenue comes from older customer relationships
        - Tenure can predate first transaction and is not a continuous-subscription measure
      - - Organic share of new-customer revenue
        - 83 percent in Q1 2026; 79 percent in 2025; 76 percent in 2024; 79 percent in 2023
        - 2023 to Q1 2026
        - Prospectus
