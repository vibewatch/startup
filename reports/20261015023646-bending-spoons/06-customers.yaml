figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: The commercial engine starts with acquired installed bases, then splits into distinct consumer/prosumer and enterprise customer surfaces before cash generation funds the next deal cycle.
    data:
      items:
        - label: Acquire proven demand
          actor: Bending Spoons M&A
          touchpoints:
            - Targets products with existing users, payers, and predictable revenue rather than building greenfield demand
            - Airtable closed in September 2026; Miro was announced for Q4 2026 close
          tone: neutral
        - label: Preserve installed base
          actor: Portfolio product teams
          touchpoints:
            - Existing users keep their brand, workflows, data, and subscriptions inside the acquired product
            - Portfolio monthly active user and monthly paying customer totals are aggregate rather than de-duplicated
          tone: neutral
        - label: Split by customer archetype
          actor: Consumer, prosumer, and enterprise buyers
          touchpoints:
            - WeTransfer shows broad audience scale
            - Brightcove shows narrow but higher-value enterprise density
          tone: neutral
        - label: Reprice and rebuild
          actor: Product and monetisation teams
          touchpoints:
            - Free-tier restrictions, pricing changes, and product overhauls aim to raise lifetime value
            - Evernote criticism shows this stage can create user backlash
          tone: risk
        - label: Hold recurring revenue
          actor: Existing subscriber base
          touchpoints:
            - Portfolio net revenue retention stayed in the low-to-mid-90s through Q1 2026
            - Long-tenure subscribers remain a large share of revenue
          tone: positive
        - label: Reinvest into the next asset
          actor: Corporate capital allocator
          touchpoints:
            - Cash generation and financing fund the next acquisition wave
            - Expansion is currently clearest in enterprise workflow software rather than suite cross-sell
          tone: opportunity
    claimRefs:
      - CU001
      - CU005
      - CU007
      - CU009
      - CU010
      - CU013
callouts:
  - calloutType: insight
    title: Low portfolio concentration does not remove product-level underwriting
    body: >-
      The filing's "no customer above 1% of revenue" disclosure is a portfolio-level comfort point, but the risk work still has to happen at the asset level because enterprise products such as Airtable, Miro, Brightcove, and Vimeo are not accompanied by public customer ladders or renewal schedules in this pool.
    claimRefs:
      - CU003
      - CU009
      - CU010
