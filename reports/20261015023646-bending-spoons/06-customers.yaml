company:
  name: Bending Spoons
chapter:
  number: 6
  title: Customers
  summary: >-
    Bending Spoons already controls a very large but highly heterogeneous installed base: the June 2026 prospectus says the portfolio served over 500 million monthly active users and more than 9 million monthly paying customers in March 2026, while no single customer accounted for more than 1% of Q1 2026 revenue. The evidence is strongest at the portfolio and newly acquired-enterprise level - 94% Q1 2026 net revenue retention, 48% of subscription revenue from customers with at least five years of tenure, and large enterprise surfaces at Airtable and announced Miro - but public evidence still lacks brand-level renewal cohorts, contract ladders, and named production references across most assets.
sections:
  - id: customer-base-shape
    title: Customer base is broad, but it is not one customer archetype
    body: >-
      Bending Spoons is not selling one integrated suite to one buyer persona. The current evidence instead points to a portfolio with materially different customer types by product: mass-consumer and prosumer subscription apps, creator and collaboration tools, and a growing enterprise workflow layer added through large acquisitions. The clearest portfolio-scale proof comes from the prospectus, which says the business served over 500 million monthly active users and more than 9 million monthly paying customers in March 2026, while warning that both figures can double-count the same user or payer across products. Product-level examples show why that caveat matters. WeTransfer had 58 million monthly active users and 1 million monthly paying customers in March 2026, while Brightcove had only about 15,000 monthly active users and 1,700 monthly paying customers because it serves large enterprises rather than broad audiences. In other words, Bending Spoons owns customer surfaces that range from broad, self-serve subscription funnels to far narrower enterprise accounts, so any diligence read should treat aggregate customer counts as scale indicators rather than a uniform demand metric.
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU007
      - CU011
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: durability-and-adoption
    title: Durability looks stronger at the portfolio level than at the product level
    body: >-
      The public record is strongest on installed-base durability at the consolidated level. The prospectus reports 94% net revenue retention in Q1 2026 after 95% for full-year 2025, alongside a customer-tenure profile in which 48% of subscription revenue came from customers with at least five years of tenure and 28% came from customers with at least ten years of tenure; revenue-weighted average subscriber tenure was 8.0 years. Those numbers suggest a sticky base, but they do not prove that every major asset has the same retention quality, because the filing only discloses a few product-level examples. Customer acquisition also looks less dependent on paid demand than many scaled app portfolios: customers acquired through organic channels generated 83% of revenue from new customers in Q1 2026, versus 79% in 2023, 76% in 2024, and 79% in 2025. That mix matters because Bending Spoons' model depends on preserving recurring demand after restructurings and pricing changes, not just buying more revenue through M&A.
    claimRefs:
      - CU005
      - CU006
      - CU008
      - CU013
      - CU014
    tableRefs:
      - TU002
  - id: expansion-proof-and-risk
    title: Expansion proof is clearest in enterprise workflow assets, while backlash risk remains product specific
    body: >-
      The freshest public customer proof is concentrated in the enterprise workflow assets Bending Spoons is buying rather than in a cross-portfolio selling motion. At announcement, Airtable said more than 500,000 organizations - including 80% of the Fortune 100 - relied on its platform, while Bending Spoons said ARR was approximately $480 million and growing more than 20% year over year. Independent coverage of the announced Miro acquisition described an even larger business-customer footprint, with roughly 250,000 organizations, around 4 million paying users, and more than 750 customers above $100,000 in ARR, though that deal had not yet closed. The risk case is that the same playbook that expands earnings can strain user trust product by product. The prospectus warns that negative reviews or ratings affecting one product can spill over into the broader portfolio, and independent reporting ties that risk to post-acquisition layoffs, higher prices, and reduced free plans. Evernote is the best documented example: independent coverage says repricing and tighter free usage drew criticism even as Bending Spoons reported 99% average net revenue retention for Evernote between Q1 2023 and Q1 2026. That combination suggests the model can preserve revenue with a committed base, but it does not eliminate the need to underwrite product-level backlash and enterprise-account concentration separately.
    claimRefs:
      - CU003
      - CU009
      - CU010
      - CU012
      - CU013
      - CU014
    tableRefs:
      - TU003
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Representative products
      - Public scale proof
      - Revenue / strategic value
      - Gap
    rows:
      - - Portfolio-wide installed base
        - Mixed users and payers across consumer subscriptions, prosumer tools, and enterprise software
        - AOL, Brightcove, Eventbrite, Evernote, komoot, Remini, StreamYard, Tractive, Vimeo, WeTransfer
        - Over 500 million monthly active users and more than 9 million monthly paying customers in March 2026
        - Establishes scale and monetized breadth across the roll-up
        - Counts are not de-duplicated across products, so they are not distinct-customer totals
      - - Prosumer file-sharing and creator workflows
        - Professionals, small enterprises, creators, and their audiences
        - WeTransfer, Vimeo, StreamYard
        - WeTransfer had 58 million monthly active users and 1 million monthly paying customers in March 2026
        - High-reach distribution layer that can monetise subscriptions at scale
        - Public sources in this pool do not show contract lengths or cohort retention by brand
      - - Enterprise video and communications
        - Central buyers inside large enterprises with narrower user populations
        - Brightcove, AOL enterprise surfaces
        - Brightcove had about 15,000 monthly active users and 1,700 monthly paying customers in March 2026
        - Indicates meaningful revenue can come from narrow, higher-value enterprise accounts
        - No product-level top-customer or renewal ladder is public in this pool
      - - Enterprise workflow and collaboration
        - Team admins, department leads, operations owners, and enterprise IT buyers
        - Airtable, Miro
        - Airtable reported more than 500,000 organizations including 80% of the Fortune 100; announced Miro metrics point to 250,000 organizations and 4 million paying users
        - Shows Bending Spoons is moving further into large-account workflow software
        - Miro was announced but not yet closed, so its customer base was pipeline context rather than fully integrated ownership
    notes: Public evidence mixes March 2026 portfolio metrics with August-September 2026 acquisition disclosures; treat rows as segment proof, not a common denominator funnel.
    claimRefs:
