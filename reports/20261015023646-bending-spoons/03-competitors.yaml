schemaVersion: report-v2
artifact: competitors
slug: bending-spoons
runDate: 2026-10-15
company:
  name: Bending Spoons
chapter:
  number: 3
  title: Competitors
  summary: >-
    Bending Spoons does not compete like a single-app vendor; the retained evidence
    shows a centralized acquisition-and-transformation platform that spans consumer
    subscriptions, enterprise workflow, and legacy internet carve-outs. The nearest
    public analog is Constellation Software on capital-allocation logic, while
    Airtable and the announced Miro deal show a sharper push into enterprise workflow
    where internal build remains the status-quo substitute and integration risk rises.
sections:
  - id: competitive-landscape
    title: Landscape spans portfolio operators, workflow software, and status-quo substitutes
    body: >-
      The competitive set is broader than "other apps like Evernote." Retained
      reporting repeatedly describes Bending Spoons as a centralized operating
      platform that buys established digital businesses, integrates them into its
      internal systems, and then changes pricing, product, and staffing to improve
      economics. That means buyers and investors should compare it against at least
      three buckets: acquisition-led operators such as Constellation Software,
      enterprise workflow platforms such as Airtable and the announced Miro target,
      and the status quo of building custom workflows internally rather than buying
      packaged software. The competitive posture is therefore portfolio-level and
      capital-allocation-driven, not just a feature race inside one app category.
    claimRefs: [CP001, CP005, CP006, CP007, CP011]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: differentiation-and-buying-criteria
    title: Differentiation comes from the shared platform and deal engine
    body: >-
      The strongest evidence-backed differentiator is Bending Spoons' shared platform:
      management and third-party reporting describe reusable people, proprietary
      technologies, data, AI tooling, pricing experiments, and operating discipline
      deployed across acquired products. That shared system matters because it is what
      lets Bending Spoons claim it can pay more than rival bidders and still earn an
      adequate return after closing. The same evidence also suggests unusual
      distribution leverage for a portfolio operator: the filing-based Fortune report
      says organically acquired customers generated 79% of new-customer revenue in
      2025 while advertising expense was only 6% of revenue, implying strong brands
      and product-led channels still matter even before a new acquisition is layered
      onto the platform.
    claimRefs: [CP008, CP009, CP010, CP012, CP015]
    tableRefs: [TP002]
  - id: durability-and-risks
    title: Durability depends on retention through harsher monetization and harder integrations
    body: >-
      The moat is real only if the portfolio keeps holding users after the
      transformation playbook gets more aggressive. Multiple retained sources tie the
      strategy to price hikes, free-plan tightening, and large workforce cuts after
      acquisitions, while independent analysis warns that customer willingness to keep
      paying matters more than headcount reduction alone. Competitive risk therefore
      comes from churn, subscription fatigue, and reputational damage just as much as
      from a direct feature match. Scale also changes the risk profile: the AOL carve-out
      reportedly required months of technically difficult re-platforming, and the
      proposed Airtable transaction still carries regulatory, employee-retention, and
      closing-risk disclosures. Larger enterprise workflow targets can widen the
      opportunity set, but they also make execution mistakes more expensive.
    claimRefs: [CP003, CP004, CP013, CP014]
    tableRefs: [TP003]
tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor / alternative
      - Category
      - Scale / funding signal
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - ["Constellation Software", "Public software acquirer", "$11.6B 2025 revenue; +15% YoY", "Vertical-market B2B software", "Long-term acquisition compounding with decentralized operating autonomy", "Closer capital-allocation analog than direct product substitute for consumer apps"]
      - ["Airtable", "Enterprise workflow and no-code platform", "~500,000 organizations; ~$480M ARR as of Jun 2026", "Product operations, marketing operations, and workflow teams", "No-code app building plus AI-native workflow automation at enterprise scale", "Signed/closed transaction makes it a portfolio expansion rather than a standing independent rival"]
      - ["Miro", "Enterprise collaboration and workflow platform", "~250,000 organizations; ~4M paying users; ~$600M ARR", "Business and enterprise collaboration buyers", "Large installed base and high enterprise mix in collaborative workflow", "Only an announced transaction in the retained evidence, so competitive impact is still prospective"]
      - ["Internal build", "Status-quo substitute", null, "Teams with engineering capacity and bespoke process needs", "Maximum control over workflow and data model", "Slowest time-to-value and competes directly with Airtable's no-coding / no-engineering-wait proposition"]
    notes: >-
      Rows mix public comparables, announced targets, and substitutes because the
      chapter mission is buyer-choice coverage rather than a list of only current
      standalone rivals. Public scale figures are copied exactly from the retained
      sources and left null where the pool does not provide decision-grade numbers.
    claimRefs: [CP001, CP005, CP006, CP007, CP011]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Bending Spoons platform
      - Constellation Software
      - Airtable / workflow platforms
      - Internal build
    rows:
      - ["Centralized operating platform", "Yes - management describes shared people, proprietary technologies, proprietary data, and AI tooling across acquisitions", "No - retained comparison describes higher autonomy at acquired companies", "Product platform, not multi-asset operating platform", "Depends on the buyer's own engineering stack"]
      - ["Long-term ownership model", "Yes - management says it has never sold a material business and aims to hold forever", "Yes - long-term acquirer framing in retained comparison", "Not applicable; standalone workflow vendor", "Not applicable; the buyer owns what it builds"]
      - ["No-code workflow creation", "Only through acquired products such as Airtable", "Unknown publicly", "Core proposition", "No; requires coding or engineering wait time"]
      - ["Enterprise workflow penetration", "Rising via Airtable and announced Miro transaction", "Focus is vertical-market software, not the same workflow layer", "High - 80% of Fortune 100 and >500,000 organizations for Airtable", "Potentially high but company-specific and not publicly benchmarked"]
      - ["Direct control over bespoke requirements", "Low", "Low", "Medium", "High"]
    notes: >-
      "Unknown publicly" means the assigned source pool does not provide reliable
      evidence for that cell. The matrix compares operating models and buyer tradeoffs,
      not exact feature parity inside every owned product.
    claimRefs: [CP001, CP005, CP006, CP008, CP011]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Alternative
      - Price / contract model
      - Included capabilities
      - Discounts / unknowns
      - Implication
    rows:
      - ["Bending Spoons-managed portfolio", "Mostly subscription revenue; 93% of 2025 sales recurring and 84% of Q1 2026 revenue from subscriptions", "Consumer and productivity apps with monetization and pricing reworked after acquisition", "Retained sources do not provide cross-portfolio list pricing or realized discounting", "Pricing upside exists, but cross-product price comparison is weak without brand-level disclosures"]
      - ["Airtable", "Subscription / ARR model", "No-code workflow database, custom applications, and AI orchestration", "Retained sources disclose ~$480M ARR and growth, not list pricing or discount bands", "Suggests a larger-ticket enterprise workflow motion than most consumer apps in the legacy portfolio"]
      - ["Miro", "Subscription / ARR model", "Visual collaboration and enterprise workflow", "Retained sources disclose enterprise mix and ARR, not price card detail", "If closed, Bending Spoons moves deeper into enterprise contract motions"]
      - ["Internal build", "Internal engineering budget and labor rather than vendor contract", "Tailored workflows and data models", "No public price card; cost is engineering time and opportunity cost", "Can win where control matters more than speed, but it delays deployment and competes against Airtable's no-code proposition"]
    notes: >-
      The assigned pool does not include decision-grade list-price evidence for the
      major owned brands or enterprise targets, so this table compares monetization
      models and disclosed economic signals rather than exact price cards.
    claimRefs: [CP006, CP011, CP012, CP013]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning based on retained evidence: higher x means more centralized
      operating control, while higher y means greater exposure to enterprise workflow
      and mission-critical use cases.
    xAxis:
      label: Operating-model centralization
      min: 1
      max: 5
      lowLabel: decentralized / autonomous
      highLabel: centralized platform
    yAxis:
      label: Enterprise workflow exposure
      min: 1
      max: 5
      lowLabel: low mission-critical workflow depth
      highLabel: high mission-critical workflow depth
    data:
      points:
        - label: Bending Spoons
          x: 5
          y: 4
          detail: Centralized portfolio operator spanning consumer apps, legacy internet, and growing enterprise workflow assets.
          claimRefs: [CP001, CP008]
        - label: Constellation Software
          x: 2
          y: 4
          detail: Acquisition-led comp with stronger decentralization and more vertical-market B2B focus.
          claimRefs: [CP005]
        - label: Airtable
          x: 3
          y: 5
          detail: Enterprise workflow and no-code platform with large organizational penetration.
          claimRefs: [CP006, CP011]
        - label: Miro
          x: 3
          y: 5
          detail: Enterprise collaboration and workflow platform cited in the retained acquisition pipeline evidence.
          claimRefs: [CP007]
        - label: Internal build
          x: 5
          y: 3
          detail: Highest control option, but it requires engineering capacity instead of packaged deployment.
          claimRefs: [CP011]
        - label: Standalone legacy operators
          x: 1
          y: 2
          detail: Single-product owners lack the portfolio-level operating platform Bending Spoons emphasizes.
          claimRefs: [CP001]
    approximationNotes: >-
      Coordinates are ordinal, not measured market shares or benchmark scores. They
      summarize operating-model differences supported by the retained evidence.
    claimRefs: [CP001, CP005, CP006, CP007, CP008, CP011]
callouts:
  - calloutType: risk
    title: The main competitive risk is post-close value leakage, not lack of targets
    body: >-
      The retained evidence suggests Bending Spoons' pipeline remains rich, but the
      harder question is whether larger, more enterprise-heavy assets can hold users
      after pricing changes, free-plan tightening, layoffs, and long integrations.
    claimRefs: [CP010, CP013, CP014]
