  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-comparison
      missingEvidence: Public list prices, contract terms, and discounting patterns for the major owned brands and for Airtable or Miro.
      whyItMatters: Exact pricing evidence is necessary to judge whether Bending Spoons competes primarily through price, packaging, or product differentiation in each category.
      diligencePath: Pull official pricing pages or enterprise procurement documents for the major brands and compare them to product-level usage and retention data.
      relatedQuestionRefs: [QP008]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: retention-by-brand
      missingEvidence: Brand-level retention, churn, and conversion data after price increases, free-plan cuts, or layoffs.
      whyItMatters: The core competitive risk is that the transformation playbook improves short-term economics but weakens long-term user retention.
      diligencePath: Obtain cohort retention, renewal, and price-change studies by major brand, especially Evernote, WeTransfer, Vimeo, and Airtable after closing.
      relatedQuestionRefs: [QP007]
    - type: missing-source
      severity: minor
      topic: post-close-integration-kpis
      missingEvidence: Time-to-integration, product-quality, and employee-retention KPIs for AOL, Airtable, and the announced Miro deal.
      whyItMatters: Competitive durability depends on whether larger and more enterprise-heavy assets can be integrated without breaking user experience or slowing innovation.
      diligencePath: Review future earnings releases, company filings, or management commentary for brand-level integration milestones and attrition metrics.
      relatedQuestionRefs: [QP007]
