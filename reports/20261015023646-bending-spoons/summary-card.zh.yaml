  topStrengths:
    - 经常性收入基础庞大，月活跃用户超过 5 亿，付费客户超过 900 万。
    - “收购—重建”运营模式已经跑通，并获得了新的公开市场资本，可继续扩大收购规模。
    - 创始人主导执行，集中式平台看起来能够持续放大经营杠杆。
  topRisks:
    - 随着交易规模扩大，杠杆、再融资和资本依赖的影响会越来越大。
    - 裁员、重新定价和产品调整仍可能持续引发用户信任与留存反弹。
    - 产品层面的经济性、债务到期结构以及各品牌留存率，披露仍然有限。
  unresolvedGaps:
    - 各品牌收入结构、毛利率、CAC、回收期和流失率仍未披露。
    - 完整的债务到期梯度、契约余量和非受限现金桥接表仍然缺失。
    - Airtable 和 Miro 的整合结果尚处早期，暂时不足以据此判断产品端的投资价值。
    - 裁员和重新定价之后的客户信任修复仍停留在个案叙述，尚未形成基于队列的证据。
