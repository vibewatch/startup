slug: bending-spoons
runDate: 2026-10-15
company:
  name: Bending Spoons
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a software-compounder model with unusual scale and recurring-revenue quality:
    Bending Spoons reached $1.31 billion of 2025 revenue, kept subscriptions at 93% of sales with 95%
    net revenue retention, and then more than doubled Q1 2026 revenue while turning profitable. The same
    sources also show why underwriting still stops short of decision-grade confidence: brand-level CAC,
    payback, gross margin, churn, cash, and debt-maturity detail remain undisclosed even as fresh equity
    capital is earmarked for continued acquisitions.
sections:
  - id: recurring-revenue-base
    title: Recurring subscriptions are the core economic engine, but growth is still heavily acquisition-led
    body: >-
      The strongest public financial readthrough is that Bending Spoons already looks more like a scaled
      recurring-revenue portfolio than a speculative app roll-up. Multiple reports tied back to the IPO filing
      put 2025 revenue at $1.31 billion, up 95% year over year, with subscriptions contributing 93% of 2025
      sales and net revenue retention at 95%. Q1 2026 remained subscription-heavy at 84% of revenue and
      still showed more than 500 million monthly active users, while the company separately said it served
      more than 9 million monthly paying customers in March 2026. That mix matters because it implies a large
      installed base that can be repriced, retained, and cross-funded over time, even if the company does not
      disclose brand-level gross margin or cohort retention. The important offset is that independent reporting
      still attributes most of the recent step-up in revenue to acquisitions rather than clean same-store
      organic compounding, so investors should treat scale quality as strong but not yet segment-disclosed.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006]
    tableRefs: [TI001]
  - id: monetization-and-efficiency
    title: Monetization discipline and centralized tooling appear to drive efficiency, but unit economics are still partial
    body: >-
      Public signals on sales efficiency are unusually favorable for a company growing this quickly, but they
      are still proxies rather than a full operating model. Fortune's readout of the filing says organically
      acquired customers generated 79% of new-customer revenue in 2025 while advertising expense was only 6%
      of revenue, which suggests customer acquisition is not primarily being bought through heavy paid spend.
      The same source says revenue per employee more than doubled from 2023 to 2025, while official company
      materials describe a centralized platform of people, proprietary technologies, and proprietary data that
      is reused across acquired products. That supports a credible margin path: small integration teams,
      shared tools, pricing changes, and operational simplification can lift economics without needing each
      brand to rebuild a full stack independently. The missing piece is that none of the assigned public
      sources provide product-level CAC, payback, gross margin, support burden, or channel-fee disclosure, so
      the current unit-economics story is still inferential rather than fully underwritten.
    claimRefs: [CI003, CI007, CI008, CI009, CI014, CI015]
    tableRefs: [TI002, TI003]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Fresh equity has expanded acquisition capacity, but leverage and integration discipline still determine capital adequacy
    body: >-
      On funding, the public picture is directionally stronger than it was in the prior report but still not
      complete enough to clear capital-risk questions. Secondary reporting and management interview coverage
      say Bending Spoons raised no meaningful primary equity until 2023, funded acquisitions largely through
      reinvested profits and debt, and then raised roughly $1.68 billion in its July 2026 IPO at an implied
      valuation of about $18.4 billion. In October 2026, Trending Topics reported a further $330 million
      Berkshire Hathaway private placement priced at $33 per share, with management framing the proceeds as
      extra financial flexibility for future acquisitions. The announced Airtable deal shows where that capital
      can go: Bending Spoons agreed to pay a $1.285 billion enterprise value for a business with roughly
      $480 million of ARR growing more than 20% year over year. That could deepen enterprise-software mix, but
      it also reinforces that future returns depend on buying well, integrating quickly, and not leaning too
      hard on debt against assets whose user retention can change after repricing.
    claimRefs: [CI010, CI011, CI012, CI013, CI015]
  - id: verdict-and-diligence-blockers
    title: "Financial verdict: quality is better than the disclosure depth"
    body: >-
      The public case for Bending Spoons is financially attractive on three fronts: recurring revenue is high,
      apparent paid-acquisition intensity is low, and fresh post-IPO capital should let management keep buying
      scaled software assets instead of depending on one product cycle. The public case is weaker on the
      underwriting details that would convert that narrative into a conviction-ready margin and runway model.
      The assigned source pool still does not disclose brand-level revenue mix, gross margin, paid CAC,
      payback, customer concentration, lender-by-lender debt maturities, covenant headroom, or unrestricted
      cash. In practice, that means the current verdict is that revenue quality and operating leverage look
      real, but capital intensity and downside protection remain only partially visible. A serious diligence
      process should push immediately from portfolio-level claims to product-level cohorts and a debt/cash
      bridge before underwriting an enduring compounder outcome.
    claimRefs: [CI001, CI003, CI007, CI010, CI011, CI012, CI015]
