      - Quality
      - Diligence ask
    rows:
      - [Portfolio subscriptions, Auto-renewing app and software subscriptions across owned brands, "% of revenue", "93% of 2025 sales; 84% of Q1 2026 revenue", "Corroborated at portfolio level, not by product", "Request brand-level subscription mix, renewal cadence, and gross retention by top products"]
      - [Retention on existing revenue, Expansion and retention within the installed paying base, NRR, "95% in 2025", "Strong portfolio-level signal, but no brand breakout", "Request NRR and gross retention by major brand and cohort vintage"]
      - [Advertising and ancillary monetization, Monetization on audience products outside subscriptions, "% of revenue", "Public revenue share undisclosed; ad expense was 6% of 2025 revenue", "Indirect proxy only", "Request product-level ad revenue, partner fees, and contribution margin by audience product"]
      - [Announced enterprise expansion via Airtable, Enterprise workflow software with ARR economics, ARR / EV, "Airtable at ~$480M ARR growing >20% YoY; announced acquisition at $1.285B EV", "Applies to announced target economics, not disclosed current Bending Spoons mix", "Request pro forma post-close mix, integration timing, and margin assumptions"]
    notes: >-
      Portfolio metrics are public and corroborated, but most rows remain portfolio-level; Airtable reflects
      announced target economics rather than disclosed current Bending Spoons revenue, and undisclosed values
      are unknown rather than zero.
    claimRefs: [CI003, CI004, CI006, CI013]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product or stream
      - Price / unit / contract
      - List vs realized pricing
      - Evidence
      - Implication
    rows:
      - [Portfolio subscriptions, "Recurring subscription contracts across owned products", "Public sources disclose mix, not realized net price", "93% of 2025 sales and 84% of Q1 2026 revenue from subscriptions", "Core monetization is recurring even though product-level pricing ladders are not public"]
      - [Evernote repricing, "~$130/year Personal plan after repricing from ~$80/year", "Secondary-public list pricing; realized churn and discounting undisclosed", "Francesca Tabor profile of post-acquisition pricing changes", "Management is willing to trade user breadth for higher ARPU if committed users stay"]
      - [Remini premium, "~$10/week for unlimited enhancements", "Secondary-public list pricing; attach rate undisclosed", "Francesca Tabor profile of product monetization", "Consumer products can support premium weekly subscription pricing when utility is high"]
      - [Splice full access, "~$5/week subscription", "Secondary-public list pricing; realized attach rate undisclosed", "Francesca Tabor profile of product monetization", "Creator-tool monetization also fits the recurring-subscription playbook"]
    notes: >-
      This table mixes public portfolio-level mix disclosure with secondary-public list-price examples from
      individual products; realized net price, promo cadence, churn, and customer concentration are not
      disclosed in the assigned source pool.
    claimRefs: [CI003, CI004, CI014]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Net revenue retention, "95% for 2025", High, "Shows recurring revenue resilience at portfolio level", "Request gross retention and NRR by top product and customer segment"]
      - [Organically acquired new-customer revenue, "79% of 2025 new-customer revenue", Medium, "Useful public proxy that paid marketing is not carrying all growth", "Request paid CAC, channel mix, and payback by major brand"]
      - [Advertising expense, "6% of 2025 revenue", Medium, "Suggests relatively light paid acquisition intensity", "Request full sales and marketing spend, partner fees, and contribution margins"]
      - [Revenue per employee, "More than doubled from 2023 to 2025", Medium, "Supports operating leverage and platform reuse thesis", "Request headcount by function, compensation burden, and support/service cost by product"]
      - ["Debt ladder, covenants, and unrestricted cash", null, Low, "Without these inputs public evidence cannot fully underwrite runway or refinancing risk", "Request lender-by-lender maturities, covenant headroom, interest cost, and unrestricted cash bridge"]
    notes: >-
      Rows combine disclosed operating proxies with explicit public-data gaps; null means the metric is not
      available in the assigned public source pool, not that the amount is zero or immaterial.
    claimRefs: [CI003, CI007, CI008, CI010, CI012]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence describes a compounding loop: buy scaled digital products, replatform and reprice them,
      monetize through subscriptions, and recycle cash plus new capital into additional acquisitions.
    data:
      nodes:
        - label: Established products with installed demand
          value: 500M MAUs / 9M paying customers
          note: March 2026 public scale across the portfolio before any future acquisitions.
        - label: Small transformation teams and shared platform
          note: Official materials describe reorganizing teams, overhauling technology, redesigning interfaces, and changing monetization on a reusable platform.
        - label: Subscription-heavy monetization
          value: 93% FY2025 sales / 84% Q1 2026 revenue
          note: Recurring subscriptions dominate the reported mix.
        - label: Retention plus relatively light paid acquisition
          value: 95% NRR / 79% organically acquired new-customer revenue
          note: Public proxies suggest most revenue is retained and a large share of new revenue is not bought through heavy advertising.
        - label: Operating leverage
          value: $278M 2025 operating profit
          note: Revenue per employee more than doubled from 2023 to 2025.
        - label: Capital recycled into more acquisitions
          value: $1.68B IPO + $330M Berkshire placement
          note: Management and independent reporting both frame fresh capital as fuel for continued M&A, including the announced Airtable deal.
    approximationNotes: >-
      This is a qualitative flow rather than a reconciled waterfall: the assigned public sources describe the
      compounding mechanism, but they do not disclose a product-by-product bridge from customer activity to
      gross profit.
    claimRefs: [CI003, CI007, CI008, CI009, CI011, CI012, CI013]
callouts:
  - calloutType: insight
    title: Portfolio economics look stronger than a typical roll-up
    body: >-
      The public file combines scale, recurrence, and apparent efficiency in a way that is uncommon for an
      acquisition-led software story: 93% subscription mix, 95% NRR, low disclosed advertising intensity,
      and improving profit all point to real monetization quality rather than pure M&A optics.
    claimRefs: [CI001, CI002, CI003, CI007, CI008]
  - calloutType: risk
    title: Capital allocation still carries the core downside
    body: >-
      Fresh equity reduces immediate financing pressure, but the model still breaks if management overpays,
      leans too far into debt, or pushes repricing and free-plan cuts past the point where retention can
      absorb them.
    claimRefs: [CI010, CI011, CI012, CI015]
