evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: A current board roster, committee membership, and named independent directors.
    whyItMatters: >-
      The chapter can show founder-centric operating control, but cannot yet test formal board independence or committee
      oversight.
    diligencePath: >-
      Pull the F-1 board and committee disclosures or later SEC filings and reconcile them against post-IPO investor
      materials.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      A reconciled lifetime funding history that sizes the 2023 primary round, all meaningful secondaries, and the
      current debt stack.
    whyItMatters: >-
      Without a full capital stack, later valuation and balance-sheet analysis can overstate flexibility or understate
      refinancing risk.
    diligencePath: >-
      Obtain the F-1 capital structure tables, debt footnotes, and any post-IPO placement disclosures in one working
      schedule.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: A precise current consolidated employee count and a location-by-location distribution.
    whyItMatters: >-
      The roll-up thesis depends on talent density and integration capacity, but the assigned pool only supports office
      presence, not exact staffing.
    diligencePath: >-
      Use the F-1, earnings materials, or verified company HR disclosures to reconcile total employees with the office
      footprint.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: independent-market-sizing
    missingEvidence: >-
      An independent third-party SAM or SOM for digital-business compounders, or for the mix of consumer, prosumer, SMB,
      and enterprise software categories Bending Spoons is actually targeting.
    whyItMatters: >-
      The only hard target-universe math in this worker pool is management-built, so valuation and upside are still
      anchored to a company-authored market screen rather than an external benchmark.
    diligencePath: >-
      Ask management to share the underlying target list, screening logic, and any third-party market maps that connect
      portfolio categories to a narrower independently benchmarked SAM or SOM.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: budget-ownership-by-brand
    missingEvidence: >-
      Brand-level buyer, user, payer, and budget-owner splits across the major products, plus product-level revenue mix
      between consumer self-serve, SMB, and enterprise motions.
    whyItMatters: >-
      The public portfolio clearly spans multiple customer types, but without product-level segmentation it is hard to
      underwrite which submarkets drive durable expansion versus one-time repricing.
    diligencePath: >-
      Request product-level revenue mix, enterprise account counts, renewal metrics, and post-close integration plans
      for the main brands, especially Airtable, Brightcove, Vimeo, and Evernote.
    relatedQuestionRefs:
      - QM003
      - QM004
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-comparison
    missingEvidence: Public list prices, contract terms, and discounting patterns for the major owned brands and for Airtable or Miro.
    whyItMatters: >-
      Exact pricing evidence is necessary to judge whether Bending Spoons competes primarily through price, packaging,
      or product differentiation in each category.
    diligencePath: >-
      Pull official pricing pages or enterprise procurement documents for the major brands and compare them to
      product-level usage and retention data.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: retention-by-brand
    missingEvidence: Brand-level retention, churn, and conversion data after price increases, free-plan cuts, or layoffs.
    whyItMatters: >-
      The core competitive risk is that the transformation playbook improves short-term economics but weakens long-term
      user retention.
    diligencePath: >-
      Obtain cohort retention, renewal, and price-change studies by major brand, especially Evernote, WeTransfer, Vimeo,
      and Airtable after closing.
    relatedQuestionRefs:
      - QP007
  - type: missing-source
    severity: minor
    topic: post-close-integration-kpis
    missingEvidence: Time-to-integration, product-quality, and employee-retention KPIs for AOL, Airtable, and the announced Miro deal.
    whyItMatters: >-
      Competitive durability depends on whether larger and more enterprise-heavy assets can be integrated without
      breaking user experience or slowing innovation.
    diligencePath: >-
      Review future earnings releases, company filings, or management commentary for brand-level integration milestones
      and attrition metrics.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Brand-level gross margin, paid CAC, payback, and retention cohorts for the largest acquired products.
    whyItMatters: >-
      Without product-level cohorts, the portfolio-level recurrence story cannot be translated into decision-grade
      margin durability or marketing efficiency.
    diligencePath: Request cohort dashboards and product P&Ls for AOL, Evernote, WeTransfer, Vimeo, and the top consumer apps.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: Lender-by-lender debt maturities, covenant headroom, interest cost, and unrestricted cash balances.
    whyItMatters: >-
      These inputs are required to judge refinancing risk, acquisition capacity, and whether fresh equity actually
      extends runway rather than merely refinancing leverage.
    diligencePath: Request the latest treasury package, debt agreements, and quarterly liquidity bridge tied back to reporting.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: repricing-retention
    missingEvidence: >-
      Product-level churn and retention after major repricing or free-plan reductions, especially at Evernote and
      WeTransfer.
    whyItMatters: >-
      The key downside in the public record is that monetization gains could outrun customer tolerance, but the current
      sources do not show whether retained cohorts offset lost users over time.
    diligencePath: Request product-level price-change analyses, churn cohorts, downgrade flows, and post-change NRR by brand.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: architecture-transparency
    missingEvidence: >-
      Product-by-product architecture diagrams, shared-service boundaries, and remaining migration milestones across the
      largest brands.
    whyItMatters: >-
      Without that map, diligence cannot separate a reusable core platform from still-fragmented legacy estates and
      integration debt.
    diligencePath: >-
      Request internal system maps, migration roadmaps, and brand-level ownership matrices for AOL, Evernote, Airtable,
      Vimeo, and other major products.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: control-surface
    missingEvidence: >-
      Brand-level uptime, security-certification, incident-history, and shared-control disclosures for the common
      platform and major products.
    whyItMatters: >-
      Product quality and multi-brand platform reuse are only underwritten cleanly when the control surface, assurance
      posture, and operational performance are explicit.
