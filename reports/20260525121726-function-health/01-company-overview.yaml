  name: Function Health
chapter:
  number: 1
  title: Company Overview
  summary: |
    Function Health is an Austin, Texas-based direct-to-consumer preventive health
    membership that gives members access to 160+ lab tests for a $499 annual fee,
    using Quest Diagnostics as its lab network and an AI-generated reporting layer
    backed by a contracted physician panel. Founded in 2021 by Mark Hyman MD and a
    co-founder team led by CEO Jonathan Swerdlin, the company closed a $298M Series
    B in November 2025 led by Redpoint Ventures at a $2.5B post-money valuation and
    concurrently launched a "Function Medical Intelligence" platform. It has crossed
    1M members, reported ~$100M ARR, and added body-imaging via the May 2025 Ezra
    acquisition and at-home phlebotomy via the April 2026 Getlabs acquisition.
