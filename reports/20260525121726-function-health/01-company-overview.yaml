sections:
  - id: identity-and-leadership
    title: Identity, Leadership, and Founding Story
    body: |
      Function Health is a private, venture-backed direct-to-consumer preventive health
      membership company headquartered in Austin, Texas and incorporated in 2021. The
      company sells access to a panel of 160+ clinical lab tests for $499 per year and
      pairs the underlying biomarker data with an AI-generated, physician-reviewed
      digital report that members are expected to revisit on a recurring cadence rather
      than as a one-off diagnostic event. The product positioning — "take control of your
      health" — frames preventive lab work as routine consumer infrastructure, much the
      way fitness trackers framed step counts a decade earlier.

      The company has six confirmed co-founders: Mark Hyman MD (Chief Medical Officer and
      public face), Jonathan Swerdlin (CEO), Daniel Swerdlin, Pranitha Patil (COO), Mike
      Nemke, and Seth Weisfeld. Hyman is the brand-defining figure — a New York Times
      bestselling functional-medicine author, the founding director of the Cleveland
      Clinic Center for Functional Medicine, and the company's most cited media voice.
      That centrality creates substantial demand-generation leverage but also concentrates
      key-person risk: a single negative health news cycle about Hyman would have an
      outsized impact on the brand. The operational team around Hyman — the Swerdlin
      brothers and Pranitha Patil — handles platform, growth, and operations and is a
      meaningful diligence question because Function's go-to-market pitch is so closely
      tied to Hyman's personal credibility.

      Function discloses on its own site that it is not itself a clinical laboratory and
      not a medical provider: Quest Diagnostics performs the assays and a contracted
      physician network signs the test orders and reviews the results that the AI report
      surfaces. That disclosure is critical context for the rest of this report — it
      shapes the regulatory perimeter (Function operates around HIPAA and state telehealth
      lab-order rules rather than under CLIA itself), the unit economics (Quest is a
      structural cost-of-goods input), and the durability of the moat (test menu changes
      come from Quest, not Function).
    claimRefs: [CO001, CO002, CO004, CO024, CO027, CO032]
    tableRefs: [TO002]
    figureRefs: [FO002]
  - id: capital-investors-scale
    title: Capital Stack, Investors, and Reported Scale
    body: |
      Function Health's capital history compresses a lot of milestones into a short
      window. After a $3M seed in March 2022 and an additional $6.5M seed extension in
      December 2023 (raised under the company's earlier "Assessment" branding), it
      closed a $53M Series A in June 2024 led by Andreessen Horowitz at a roughly
      $191M post-money valuation. Then in November 2025 — only seventeen months later
      — Redpoint Ventures led a $298M Series B at a $2.5B post-money valuation, a
      roughly 13x mark-up that placed Function firmly in the "decacorn-adjacent"
      preventive-health cohort. Press coverage explicitly tied that round to a
      simultaneous "Function Medical Intelligence" launch, signalling that the
      additional capital is meant to fund AI / data platform investment and further
      acquisitions on top of the core membership.

      The investor base is unusual for a clinical health-tech company because it
      blends conventional Silicon Valley venture (a16z, Redpoint, K5 Global) with a
      large and very visible roster of celebrity and athlete backers — Joel Embiid
      (via Embiid Ventures), Matt Damon, Kevin Hart, Pedro Pascal, Zac Efron, Jay
      Shetty, Blake Griffin, Colin Kaepernick, Jimmy Rollins, Ari Emanuel, Casey
      Means MD, Harpreet Singh Rai (former Oura CEO), and Jeff Dean (Google). That
      mix gives Function unusually deep distribution leverage in entertainment and
      pro sports — visible in the February 2025 NBPA partnership — but also creates
      a fairness-of-disclosure question: an offering boosted by celebrities who hold
      equity needs sharper labeling than one boosted by paid spokespeople.

      The reported scale numbers are the most volatile figures in this chapter and
      should be treated as company-claimed rather than audited. Reporting around
      the November 2025 Series B described Function as having crossed one million
      members and as approaching roughly a $100M annual recurring revenue run rate,
      versus an earlier 2024 baseline of about 100,000 members plus a 200,000-person
      waitlist and three million lab tests run during 2023. The headcount figure
      remains opaque: Wikipedia's infobox cites a pre-scale ~50-employee snapshot
      that is clearly stale, while post-Series B coverage describes aggressive
      hiring without publishing a current number — explicitly flagged as an open
      evidence gap below.
    claimRefs: [CO005, CO007, CO010, CO011, CO026, CO028, CO029, CO031, CO035, CO036]
    tableRefs: [TO001, TO003]
    figureRefs: [FO003]
  - id: milestones-product-extensions
    title: Milestones, Acquisitions, and Partnership Extensions
    body: |
      Function Health has expanded its surface area in two ways: programmatic
      partnerships that put the membership inside other premium consumer experiences,
      and M&A that adds new modalities to the lab-test core. The partnership track
      began in May 2024 with Equinox's $40,000-per-year "Optimize" longevity program,
      where Function provides the underlying lab-testing layer for the high-end gym
      membership. Other 2024-2026 collaborations include Arianna Huffington's Thrive
      Global (AI-driven coaching layered on member results, October 2024), GRAIL's
      Galleri multi-cancer early-detection test as an opt-in add-on (December 2024),
      the National Basketball Players Association (preventive testing for NBA
      players, February 2025), the Thatch employer-benefits marketplace (April 2025),
      a Sweetgreen doctor-designed menu collab (January 2026), and a co-branded
      Erewhon smoothie (February 2026). The "Long Live Moms" Mother's Day 2025
      campaign and recognition as a TIME100 Most Influential Company in 2025 and a
      Fast Company Most Innovative Company in 2024 illustrate how aggressively
      Function is using mainstream consumer and lifestyle channels rather than
      conventional medical-channel marketing.

      The M&A track has moved Function from a single-modality (blood draw) membership
      into a multi-modality preventive platform. The May 5, 2025 acquisition of Ezra,
      the AI full-body MRI scanning startup founded by Emi Gal, gave Function an
      imaging modality directly comparable to Neko Health and Prenuvo. The April 9,
      2026 acquisition of Getlabs added mobile / at-home phlebotomy, converting the
      previously Quest-only collection footprint into a hybrid Quest-plus-home model
      that materially expands addressable customers (older adults, rural members,
      busy executives who refuse to visit a draw center). Both deals reduce
      operational friction for premium members and give Function a sharper unit-
      economics story to tell its Series B investors. They also raise the integration
      complexity bar: Function is now operating a multi-modality clinical-services
      stack rather than a thin software wrapper over Quest.

      The chronology is therefore short but dense: founding (2021), product launch
      and seed (2022), $6.5M seed extension and ramp (2023), Series A and Equinox /
      Thrive partnerships (2024), Ezra acquisition and TIME100 recognition (2025),
      Series B and Function Medical Intelligence launch (late 2025), Sweetgreen and
      Erewhon brand moments (early 2026), and Getlabs M&A (April 2026). Visualised
      together — see FO001 below — the cadence is closer to a high-velocity consumer
      brand than a traditional clinical-services company.
    claimRefs: [CO008, CO009, CO012, CO013, CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO025, CO034]
    tableRefs: [TO004]
    figureRefs: [FO001]
  - id: critique-and-disclosures
    title: Critical Reception and Disclosure Posture
    body: |
      Function Health's rapid mainstream adoption has been mirrored by a small but
      growing body of skeptical coverage. The most prominent piece is Kristen V.
      Brown's January 8, 2026 New York Times Well article framing Function as the
      leading example of the "self-serve blood test" trend; the piece relays clinician
      concerns about false positives, downstream costs from chasing borderline
      findings, and anxiety in healthy testers. Angela Haupt's December 2024 TIME
      first-person review acknowledged the product's appeal but cautioned that broad
      panels can over-flag clinically insignificant biomarker drift. Jonathan Jarry of
      the McGill Office for Science and Society went further in June 2025, arguing
      that the functional-medicine framework Function operates within can act as a
      "pipeline to alt-med" — a critique echoed by The Daily Beast's longer profile
      of Mark Hyman.

      Function's own disclosure posture is more careful than the marketing suggests.
      The FAQ and how-it-works pages explicitly state that Function is not a
      laboratory and not a medical provider; Quest performs the assays, and a
      contracted physician network signs every order and reviews every panel before
      results reach the member. That posture matters for both regulatory exposure
      (Function operates around HIPAA, state telehealth lab-ordering rules, and the
      forthcoming FDA Laboratory Developed Tests framework rather than under CLIA
      itself) and for the user expectation — Function is selling a longitudinal
      member experience and AI-mediated interpretation, not a primary-care
      relationship. Investors should therefore separate the consumer-membership
      thesis (recurring, low-touch, brand-driven) from the clinical-services thesis
      (which has thinner margins, more regulatory risk, and depends materially on the
      Quest relationship).
    claimRefs: [CO006, CO021, CO022, CO023, CO024, CO027, CO030, CO033]
