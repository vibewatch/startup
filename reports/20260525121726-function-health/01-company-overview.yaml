callouts:
  - calloutType: strength
    title: A consumer-grade subscription wrapper over Quest's lab footprint
    body: |
      Function's structural insight is that the bottleneck in US preventive lab testing is not the underlying
      assays — Quest already runs them at scale across 2,000+ patient service centers — but the consumer
      experience around ordering, paying for, and interpreting those tests. By bundling 160+ tests into a single
      $499 / year membership and stacking an AI-generated longitudinal report on top, Function has built a
      consumer subscription business on top of clinical infrastructure that already exists. The Series B price
      tag implies investors are paying primarily for the consumer brand and the data flywheel, not for the
      underlying lab science.
    claimRefs: [CO002, CO003, CO007, CO024, CO033]
  - calloutType: risk
    title: Key-person and clinical-evidence risk are tightly coupled
    body: |
      Mark Hyman is the brand. He is also the most prominent practitioner of functional medicine in the US,
      which leaves Function unusually exposed to two correlated risks: a Hyman-specific media or health event,
      and a broader medical-establishment backlash against functional medicine. The NYT Well piece (Jan 2026)
      and the McGill OSS critique (Jun 2025) suggest that backlash is now coalescing. Series B investors at a
      $2.5B mark are implicitly betting that Function can transition from "Hyman's clinic at scale" to a
      durable, evidence-bearing AI platform before either of those shoes drops.
    claimRefs: [CO021, CO022, CO024, CO027]
  - calloutType: insight
    title: Acquisitions are converting a thin software wrapper into a multi-modality clinic
    body: |
      Ezra (May 2025) added MRI; Getlabs (April 2026) added at-home draws; the Function Medical Intelligence
      launch (Nov 2025) added a vertically branded AI layer. Two years ago Function was effectively a
      consumer-app skin on Quest. Today it is a multi-modality preventive clinic — with the corresponding
      jump in integration risk, regulatory exposure, and operating complexity. Diligence should focus on
      whether the operating team has the depth to run a clinical-services business at this scale.
    claimRefs: [CO006, CO008, CO009, CO029]
