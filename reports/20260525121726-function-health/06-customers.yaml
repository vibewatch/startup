  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention and churn
      missingEvidence: >-
        No public NRR, GRR, monthly churn, or cohort retention data has been disclosed by Function Health.
        The two-cycle annual subscription creates a natural renewal window but actual renewal rates are unknown.
      whyItMatters: >-
        Retention determines LTV, unit economics sustainability, and whether the 1M member count
        represents durable recurring revenue or partially churned-and-replaced cohorts.
      diligencePath: Request cohort retention data, renewal rates by segment, and churn drivers from management.
      relatedQuestionRefs: [QU009, QU010]
    - type: missing-source
      severity: material
      topic: ARPU and discount mix
      missingEvidence: >-
        The ~$100 effective ARPU versus $499 list price implies significant discounting or subsidization
        but the breakdown (promotional, partner-subsidized, free tier) is undisclosed.
      whyItMatters: >-
        Understanding the discount structure is critical to assessing revenue quality, pricing power,
        and whether growth has come at the expense of monetization.
      diligencePath: Request revenue breakdown by pricing tier, partner-subsidized volume, and promotional mix from management.
      relatedQuestionRefs: [QU002, QU024]
    - type: enumeration-incomplete
      severity: minor
      topic: contentRequirements/2 coverage
      missingEvidence: >-
        Only publicly named partnerships and media-reviewed experiences are captured; many enterprise
        or corporate deployments may exist undisclosed.
      whyItMatters: >-
        Additional named customer proof would strengthen confidence in deployment breadth across segments.
      diligencePath: Systematic search for Function Health enterprise case studies and additional partnership announcements.
      relatedTableRefs: [TU003]
      relatedQuestionRefs: [QU008]
    - type: missing-source
      severity: minor
      topic: member acquisition cost
      missingEvidence: >-
        No public data exists on customer acquisition cost (CAC) or marketing spend as a percentage of revenue.
      whyItMatters: >-
        CAC relative to ARPU determines payback period and unit economics viability at scale.
      diligencePath: Request CAC data by channel and blended CAC from management during diligence.
      relatedQuestionRefs: [QU022]
sections:
  - id: SU_SEGMENTS
    title: Customer Segmentation and Buyer Profiles
    order: 1
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU029
      - CU031
      - CU035
    body: |
      Function Health serves five distinct customer segments with varying buyer profiles,
      acquisition channels, and economic characteristics. The core DTC segment consists of
      affluent urban professionals aged 30-55 who self-select into a $499/year membership
      for proactive health monitoring via 160+ lab biomarkers. The Atlantic and Wired both
      characterize this cohort as skewing toward household incomes above $150K, concentrated
      in major metropolitan areas. This segment represents the majority of the 1 million
      member base but likely generates below-list-price revenue due to promotional discounting
      and referral incentives.

      The premium fitness segment emerged via the Equinox Optimize partnership (May 2024),
      which bundles Function Health testing into a $40,000/year longevity membership combining
      personal training, nutrition coaching, and comprehensive lab work. This high-ARPU cohort
      is small (limited by Equinox location count and the extreme price point) but validates
      Function Health as an embedded health infrastructure provider rather than a standalone
      consumer app. The NBPA partnership (February 2025) extends testing to professional NBA
      athletes, serving as a brand credibility play and potential gateway to broader sports
      wellness contracts. Corporate buyers access Function Health through the Thatch marketplace
      (April 2025) and Thrive Global (October 2024), positioning lab testing as an employer-
      funded health benefit. Co-marketing partnerships with Sweetgreen (January 2026) and
      Erewhon (February 2026) generate awareness-funnel brand impressions among wellness-
      adjacent consumers rather than direct subscription revenue.
    tableRefs:
      - TU001
    figureRefs:
      - FU003
  - id: SU_GROWTH
    title: Growth Trajectory and Adoption Metrics
    order: 2
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU033
      - CU034
      - CU036
    body: |
      Function Health's headline growth metric — 1 million members crossed by November 2025 —
      represents one of the fastest scaling trajectories in DTC health. The company simultaneously
      reports ~$100M ARR, yielding an effective ARPU of approximately $100 per member versus the
      $499 list price. This 5x gap implies that a significant fraction of the member base is on
      discounted, partner-subsidized, or free promotional tiers. The mix between full-price
      individual subscribers and subsidized cohorts has not been disclosed and represents a
      critical revenue-quality question for diligence.

      The adoption funnel moves from awareness (driven heavily by Mark Hyman's media presence
      and podcast reach) through a waitlist/sign-up flow, then to a Quest Diagnostics lab visit
      typically completed within two weeks, results delivery in the app within five days, and
      optional physician consultation. The two test cycles per year create a natural annual
      renewal decision point. Galahad's 2026 longevity clinic list positions Function Health
      as the market leader in DTC preventive testing by member volume, ahead of InsideTracker,
      Lifeforce, and other competitors. Growth has been fueled by earned media, celebrity
      endorsement, and strategic partnerships rather than disclosed paid acquisition spending.
    tableRefs:
      - TU002
    figureRefs:
      - FU001
      - FU002
  - id: SU_PROOF
    title: Named Customer Proof and Deployment Evidence
    order: 3
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU030
      - CU035
    body: |
      Named customer proof spans five categories of deployment evidence. The Equinox Optimize
      integration represents the deepest enterprise deployment: Function Health testing is
      embedded as a core pillar of a $40K/year longevity program, with CBS News confirming
      the partnership structure and pricing. The NBPA partnership provides testing to
      professional NBA players as reported by Forbes, representing a brand-validation deployment
      with limited revenue scale but significant credibility value. Thatch marketplace
      integration enables corporate employers to offer Function Health as an employee benefit,
      representing a B2B channel with potential for multi-seat enterprise deals.

      Independent reviewer experiences provide consumer-level proof. CNET found the volume of
      data impressive but wished for more guidance on next steps. Healthline noted comprehensive
      testing that may overwhelm users without medical background. Business Insider characterized
      the service as worthwhile for health-conscious individuals. These reviews collectively
      validate the product delivers on its testing breadth promise while surfacing a consistent
      gap in result actionability — a theme that directly connects to retention risk and the
      value proposition's long-term durability.
    tableRefs:
      - TU003
    figureRefs: []
  - id: SU_RETENTION
    title: Retention, Satisfaction, and Repeat Usage
    order: 4
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU019
      - CU021
    body: |
      Function Health has disclosed no public retention metrics as of May 2026 — no NRR, GRR,
      monthly churn, or cohort retention data exists in the public domain. This is the single
      largest informational gap for diligence on the customer chapter. The subscription model
      provides two test cycles per year, creating a natural annual renewal decision point that
      should generate measurable renewal and churn data internally. Reddit discussions in
      r/functionhealth include members debating renewal decisions, with satisfaction correlating
      to whether individuals had a physician or health coach to contextualize results.

      Trustpilot reviews show a mixed distribution: some users praise the comprehensiveness of
      testing while others cite difficulty interpreting results without dedicated physician
      support. Critically, NPR reported that critics worry Function Health tests can lead to
      unnecessary follow-ups and anxiety for healthy individuals. The New York Times published a
      critical member-experience piece in January 2026 questioning actionable health value from
      mass blood testing. TIME raised over-treatment concerns in December 2024. Consumer Reports
      warned that DTC lab test consumers may not understand what to do with abnormal results.
      These adverse signals collectively suggest a retention-risk narrative tied to actionability
      rather than test quality — members may churn not because testing fails but because results
      do not translate into clear behavior change without additional clinical support.
    tableRefs:
      - TU004
    figureRefs:
      - FU004
  - id: SU_EXPANSION
    title: Expansion Drivers and Concentration Risk
    order: 5
    claimRefs:
      - CU020
      - CU022
      - CU023
      - CU025
      - CU026
      - CU027
      - CU028
    body: |
      Expansion revenue potential comes from three vectors: premium add-on services (Galleri
      multi-cancer detection, Ezra full-body MRI), new distribution channels (corporate HR
      via Thatch, athlete associations beyond NBPA), and co-marketing partnerships that drive
      top-of-funnel awareness (Sweetgreen, Erewhon). The Galleri cancer screening add-on and
      Ezra MRI create meaningful upsell paths that could increase ARPU for engaged members,
      though uptake rates are undisclosed. The Getlabs acquisition (April 2026) adds at-home
      phlebotomy as a convenience improvement that may reduce friction-driven churn.

      Concentration risk manifests in two dimensions. First, customer acquisition depends
      heavily on Mark Hyman's personal brand — his podcast, media appearances, and thought-
      leadership position in functional medicine are central to awareness generation. The Daily
      Beast specifically criticized this brand dependence. Second, Quest Diagnostics operates as
      the sole lab fulfillment partner across 2,000+ locations. A disruption to Quest (pricing
      dispute, capacity constraint, or strategic direction change) would immediately impact
      service delivery for the entire member base. No regulatory or consumer-protection
      complaints have been publicly filed, but the over-testing criticism from NPR, NYT, and
      Consumer Reports represents a reputational and potentially regulatory risk vector.
    tableRefs:
      - TU005
    figureRefs: []
