  name: Function Health
chapter:
  number: 6
  title: Customers
  summary: |
    Function Health has scaled to approximately 1 million members and ~$100M ARR by late
    2025, driven by a DTC subscription model ($499/year for 160+ lab tests) and an
    expanding set of B2B and co-marketing partnerships. Customer segments span longevity-
    curious affluent consumers, premium fitness members (Equinox Optimize at $40K/year),
    professional athletes (NBPA partnership), corporate/HR buyers (Thatch marketplace),
    and wellness-adjacent brand collaborations (Sweetgreen, Erewhon). The effective ARPU
    of ~$100 versus the $499 list price implies significant discounting, partner-subsidized
    cohorts, or free/promotional tiers. No public retention metrics (NRR, GRR, churn) exist,
    and concentration risk centers on Mark Hyman's personal brand and Quest Diagnostics as
    the sole fulfillment partner. Independent customer reviews are mixed — positive on
    breadth of testing but critical on actionability of results and over-testing concerns.
