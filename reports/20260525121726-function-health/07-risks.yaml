        - plannedFigures/dependency-map
  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Function Health ARR and unit economics
      missingEvidence: >-
        No SEC filing, independent audit, or verified financial disclosure confirms the ~$100M ARR claim; all revenue
        figures derive from company statements in press coverage.
      whyItMatters: >-
        Investor valuation of $2.5B depends on revenue trajectory that cannot be independently verified without
        audited financials.
      diligencePath: Request audited financial statements or Series B investor data room access during due diligence.
      relatedQuestionRefs:
        - QR012
        - QR013
    - type: missing-source
      severity: material
      topic: FDA LDT enforcement posture under current administration
      missingEvidence: >-
        No official FDA guidance post-vacatur clarifies whether the agency intends to appeal, seek legislative
        authority, or acquiesce to the E.D. Texas ruling.
      whyItMatters: >-
        The regulatory overhang from potential FDA reassertion is the single largest structural risk for Function
        Health's product architecture.
      diligencePath: Monitor FDA Federal Register notices and Congressional healthcare committee testimony for signals.
      relatedQuestionRefs:
        - QR001
    - type: missing-source
      severity: minor
      topic: Quest Diagnostics contract terms with Function Health
      missingEvidence: >-
        The specific terms, duration, exclusivity, and termination provisions of the Quest-Function Health laboratory
        services agreement are not publicly disclosed.
      whyItMatters: >-
        Contract structure determines the severity of concentration risk; a short-term or terminable-at-will agreement
        would elevate partner dependency risk significantly.
      diligencePath: Request redacted master services agreement during investor due diligence.
      relatedQuestionRefs:
