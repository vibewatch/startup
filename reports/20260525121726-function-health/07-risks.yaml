chapter:
  number: 7
  title: Risks and Red Flags
  summary: |
    Function Health faces a layered risk profile spanning regulatory uncertainty (FDA LDT
    rule vacatur, FTC endorsement exposure, HIPAA data surface), legal liability (over-
    diagnosis class-action exposure, functional-medicine framing), operational concentration
    (single-lab-partner dependency on Quest Diagnostics, Getlabs scheduling reliability,
    AI hallucination in medical interpretation), key-person dependency (Mark Hyman as brand
    anchor, age 65+), financial model fragility (unverified $100M ARR, CAC pressure at DTC
    plateau), and reputational vulnerability (adverse NYT, TIME, McGill, Daily Beast
    coverage; influencer-physician backlash). The most structurally threatening risk is the
    regulatory grey area: the E.D. Texas vacatur of the FDA LDT rule in March 2025 leaves
    Function Health in a jurisdictional limbo where a future administration could reassert
    oversight, while the company's 160-biomarker panel and AI interpretation layer blur
    the line between wellness and medical diagnosis. Adverse press from credible outlets
    documenting over-screening concerns creates a latent reputational trigger that scales
    with membership growth.
