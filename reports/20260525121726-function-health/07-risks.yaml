  claims:
    - id: CR001
      statement: >-
        The FDA finalized a rule in May 2024 requiring premarket review for laboratory developed tests, but the E.D.
        Texas vacated the rule in March 2025, leaving Function Health's 160-biomarker panel in regulatory limbo where a
        future administration could reassert FDA oversight.
      type: third-party-reported
      topic: FDA LDT rule vacatur — regulatory uncertainty
      confidence: high
      freshness: current
      sourceRefs:
        - SR001
        - SR002
      answersQuestionRefs:
        - QR001
    - id: CR002
      statement: >-
        Quest Diagnostics operates under CLIA certification for all laboratory testing conducted on behalf of Function
        Health; CLIA compliance is maintained by Quest, not Function Health, creating regulatory dependency on
        a third-party compliance posture.
      type: observed
      topic: CLIA compliance delegation to Quest
      confidence: high
      freshness: current
      sourceRefs:
        - SR003
        - SR011
      answersQuestionRefs:
        - QR002
