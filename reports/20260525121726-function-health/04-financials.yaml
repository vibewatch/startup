sections:
  - id: revenue-model
    title: "Revenue Model and Streams"
    body: |
      Function Health generates revenue primarily through its annual membership subscription
      priced at $499 per year, which provides access to 160+ lab tests conducted at Quest
      Diagnostics patient service centers nationwide. The company self-reports approximately
      $100M in annual recurring revenue as of late 2025, coinciding with surpassing 1 million
      members. Beyond the core subscription, Function Health has built supplementary revenue
      channels including the Equinox Optimize partnership ($40K per year per member), at-home
      testing via the acquired Getlabs platform, MRI body scanning through the Ezra acquisition,
      and B2B2C distribution partnerships with organizations such as the NBPA, Thatch, Sweetgreen,
      and Erewhon. The Medical Intelligence AI platform launched with the Series B represents a
      potential premium-tier upsell, though pricing for this add-on has not been disclosed. The
      revenue model fundamentally depends on the spread between membership fees collected and the
      per-test costs paid to Quest, which creates a relatively fixed cost structure against variable
      pricing realization.
    claimRefs: [CI001, CI002, CI003, CI008, CI011, CI012, CI013, CI017, CI026, CI028]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-monetization
    title: "Pricing and Monetization Structure"
    body: |
      The core Function Health membership is priced at $499 per year and includes two testing
      rounds annually, each comprising 160+ lab biomarkers processed through Quest Diagnostics.
      This translates to an implied cost to the consumer of roughly $3.12 per individual test,
      substantially below Quest retail pricing for equivalent panels. However, effective ARPU of
      approximately $100 suggests that the vast majority of members pay significantly less than
      the $499 list price. This gap can be attributed to promotional pricing, partner discounts
      through channels like Sweetgreen and Erewhon collaborations, partial-year memberships, and
      corporate wellness programs offering subsidized access. The Getlabs at-home testing
      add-on represents an incremental monetization layer beyond the base membership, with
      convenience fees likely in the $50-100 range per draw. The Equinox Optimize partnership
      at $40K per year represents the highest monetization tier, bundling Function Health testing
      with comprehensive longevity coaching and gym access. No publicly available data confirms
      the distribution of members across pricing tiers or the depth of promotional discounting.
    claimRefs: [CI001, CI007, CI029, CI032, CI035]
    tableRefs: [TI002]
    figureRefs: [FI002]
  - id: unit-economics
    title: "Unit Economics Analysis"
    body: |
      Function Health's unit economics remain largely opaque due to the absence of public
      financial disclosures. The key variables are: revenue per member (effective ARPU of ~$100),
      cost of goods sold per member (estimated lab costs of $70-100 based on Quest requisition
      pricing of $35-50 per draw times two rounds per year), and operating expenses including
      technology platform, physician oversight, customer support, and marketing. At ~$100 ARPU
      with estimated COGS of $70-100, the gross margin on the core subscription could be near
      zero or negative for heavily discounted cohorts. By contrast, list-price members at $499
      would generate healthy gross margins of 60-80%. Comparable DTC health subscription
      companies such as Teladoc report gross margins of 65-70%, while Hims & Hers achieved
      approximately $20 monthly ARPU ($240 annualized) at scale with 70%+ gross margins. The
      critical unknown is what proportion of the 1M member base pays full price versus deeply
      discounted rates, as this determines whether the business generates positive unit
      contribution or subsidizes growth through venture capital.
    claimRefs: [CI007, CI014, CI015, CI016, CI023, CI029, CI032, CI034, CI035]
    tableRefs: [TI003]
    figureRefs: [FI003]
  - id: capital-adequacy
    title: "Capital Adequacy and Runway"
    body: |
      Function Health has raised approximately $360M in total venture funding across four rounds:
      a $3M seed in March 2022, a $6.5M extension in December 2023, a $53M Series A led by a16z
      in June 2024, and the $298M Series B led by Redpoint Ventures in November 2025. The Series
      B valued the company at $2.5B post-money. Assuming pre-Series B cumulative burn of $40-60M
      (covering 2022 through November 2025 operations at escalating spend), post-Series B cash on
      hand is estimated at $250-300M. Monthly burn is not publicly disclosed but is estimated at
      $8-15M based on headcount growth, marketing intensity, and acquisition integration costs for
      Ezra and Getlabs. At these rates, the company has approximately 18-36 months of runway from
      the Series B close, providing a path to either profitability or a subsequent fundraise by
      mid-2027 to early 2028. No debt or venture-debt facilities have been publicly disclosed.
      Planned use of funds includes Medical Intelligence platform development, geographic expansion,
      M&A integration, and continued customer acquisition.
    claimRefs: [CI004, CI005, CI006, CI009, CI019, CI020, CI021, CI022, CI025, CI033]
    tableRefs: [TI004]
    figureRefs: [FI004]
  - id: financial-gaps
    title: "Public Financial Gaps and Diligence Requirements"
    body: |
      The most significant financial diligence gap is the complete absence of audited financial
      statements in any public registry. Function Health is a private company with no SEC filing
      obligations, no S-1 on record, and no equivalent regulatory disclosure. The $100M ARR
      figure traces exclusively to company press statements reproduced across multiple news
      outlets (Healthcare Dive, Endpoints News, TechCrunch, STAT News) but none provide
      independent verification. STAT News specifically noted the self-reported nature of these
      figures. Key private metrics needed for proper financial diligence include: verified ARR
      with cohort decomposition, net revenue retention and churn rates, customer acquisition
      cost by channel, gross margin by product line, and detailed burn-rate breakdown. The
      Barrons and Wall Street Journal coverage characterized the $2.5B valuation as aggressive
      for an unaudited company, and the 25x implied revenue multiple sits at the high end of
      digital health comparables per Rock Health data. Without data-room access, investors
      cannot determine whether the business generates positive unit economics or is growing
      at a loss subsidized by venture capital.
    claimRefs: [CI010, CI027, CI030, CI031, CI036, CI037]
    tableRefs: [TI005]
