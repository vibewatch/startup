company:
  name: Function Health
chapter:
  number: 4
  title: Financials
  summary: |
    Function Health operates a subscription membership model priced at $499 per year
    for 160+ lab tests via Quest Diagnostics, with self-reported metrics of approximately
    1 million members and ~$100M ARR as of late 2025. The company has raised ~$360M
    total across seed through Series B, culminating in a $298M Series B in November
    2025 led by Redpoint at a $2.5B post-money valuation. Effective ARPU appears
    significantly below list price (~$100 vs $499), implying steep discounting, cohort
    mix effects, or partial-year memberships. No audited financials or regulatory filings
    exist in the public domain, making independent verification of revenue claims
    impossible without data-room access.
