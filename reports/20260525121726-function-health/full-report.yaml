            body: |
              Function Health's operational architecture creates concentration risk at multiple layers. Quest
              Diagnostics serves as the sole laboratory partner for all 160+ biomarker tests across approximately
              2,000 Patient Service Centers. This represents extreme single-vendor dependency: Quest processes ~500,000
              lab orders daily across all clients, making Function Health a fractional customer with limited bargaining
              power. A Quest operational disruption, contract renegotiation, or strategic deprioritization would have
