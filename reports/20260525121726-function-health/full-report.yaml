      - number: '2.3'
        title: Demand drivers, adoption constraints, and the buyer journey
        blocks:
          - type: paragraph
            body: |
              The 2024-2026 demand drivers for Function are unusually well aligned. The longevity media wave —
              Mark Hyman, Peter Attia, Andrew Huberman — has converted "monitor when well" from biohacker
              curiosity into a mass-affluent norm. The GLP-1 era has put millions of consumers on weight-loss
              drugs with metabolic side effects, which creates a recurring reason to track biomarkers. The
              high-deductible health plan trend has pushed routine costs to consumers, so an annual $499 outlay
              that replaces a few $200 cash-pay panel orders looks economic. Quest and Labcorp themselves
              building DTC channels validate the demand. The Sweetgreen and Erewhon collaborations in early
              2026 show the wave has crossed from "elite biohacker" to mainstream consumer-brand culture.

              The constraint side is equally clear. The FDA's 2024 Laboratory Developed Test (LDT) rule is
              slowly bringing more lab-developed tests under FDA premarket review — a structural cost that
              will land hardest on Function's add-on, esoteric panels rather than its base offering. HIPAA-grade
              privacy controls and state telehealth lab-order rules vary materially across the 50 states and
              shape what Function can deliver where. Payer coverage remains essentially zero; the broad
              preventive panel is not on the USPSTF "covered preventive service" list. And the clinical-
              evidence critique (NYT Well, McGill OSS) is now strong enough to make HSA / FSA inclusion a real
              policy debate rather than a foregone conclusion.

              Pulled together, the buyer journey from awareness to membership is short — a Hyman podcast or
              celebrity-investor post on Instagram, a partner endorsement (NBPA athlete, Equinox), the $499
              web-funnel signup, the Quest draw appointment, the AI report — and explains the velocity to 1M
              members. The structural risk is that the same brand-driven funnel that scaled fast is dependent
              on continued Hyman / longevity-wave momentum and on the absence of a meaningful policy backlash;
              a downturn on either dimension would compress Function's effective addressable market quickly.
