      - number: '1.2'
        title: Capital Stack, Investors, and Reported Scale
        blocks:
          - type: paragraph
            body: |
              Function Health's capital history compresses a lot of milestones into a short
              window. After a $3M seed in March 2022 and an additional $6.5M seed extension in
              December 2023 (raised under the company's earlier "Assessment" branding), it
              closed a $53M Series A in June 2024 led by Andreessen Horowitz at a roughly
              $191M post-money valuation. Then in November 2025 — only seventeen months later
              — Redpoint Ventures led a $298M Series B at a $2.5B post-money valuation, a
              roughly 13x mark-up that placed Function firmly in the "decacorn-adjacent"
              preventive-health cohort. Press coverage explicitly tied that round to a
              simultaneous "Function Medical Intelligence" launch, signalling that the
              additional capital is meant to fund AI / data platform investment and further
              acquisitions on top of the core membership.

              The investor base is unusual for a clinical health-tech company because it
              blends conventional Silicon Valley venture (a16z, Redpoint, K5 Global) with a
              large and very visible roster of celebrity and athlete backers — Joel Embiid
              (via Embiid Ventures), Matt Damon, Kevin Hart, Pedro Pascal, Zac Efron, Jay
              Shetty, Blake Griffin, Colin Kaepernick, Jimmy Rollins, Ari Emanuel, Casey
              Means MD, Harpreet Singh Rai (former Oura CEO), and Jeff Dean (Google). That
              mix gives Function unusually deep distribution leverage in entertainment and
              pro sports — visible in the February 2025 NBPA partnership — but also creates
              a fairness-of-disclosure question: an offering boosted by celebrities who hold
              equity needs sharper labeling than one boosted by paid spokespeople.

              The reported scale numbers are the most volatile figures in this chapter and
              should be treated as company-claimed rather than audited. Reporting around
              the November 2025 Series B described Function as having crossed one million
              members and as approaching roughly a $100M annual recurring revenue run rate,
              versus an earlier 2024 baseline of about 100,000 members plus a 200,000-person
              waitlist and three million lab tests run during 2023. The headcount figure
              remains opaque: Wikipedia's infobox cites a pre-scale ~50-employee snapshot
              that is clearly stale, while post-Series B coverage describes aggressive
              hiring without publishing a current number — explicitly flagged as an open
              evidence gap below.
