      - number: '5.3'
        title: Trust, Compliance, and Clinical Evidence Gaps
        blocks:
          - type: paragraph
            body: |
              Function Health's compliance model relies primarily on Quest Diagnostics' existing
              regulatory certifications rather than its own clinical licensure. All laboratory
              analysis occurs in Quest's CLIA-certified facilities, and Quest maintains CAP
              accreditation and state-level lab licenses. Function Health itself claims HIPAA
              compliance for member data handling, with encryption at rest and in transit, but
              has not published SOC 2, HITRUST, or other third-party security audit results. The
              FMI AI layer operates without FDA clearance as an advisory tool — a classification
              that depends on maintaining the physician-in-the-loop review step. If FMI were to
              generate recommendations consumed directly by members without physician intermediation,
              this classification could be challenged.

              The most significant product credibility risk is the clinical evidence gap. The New
              York Times (January 2026) reported that Function uses narrower biomarker reference
              ranges than standard clinical laboratories, potentially flagging healthy values as
              abnormal and triggering unnecessary follow-up. TIME coverage raised over-treatment
              concerns for asymptomatic populations receiving comprehensive biomarker panels.
              McGill's Office for Science and Society characterized functional medicine as a
              pipeline to alternative medicine. Health Affairs research notes that consumer wellness
              screening platforms often lack evidence of improved clinical outcomes. The CDC
              emphasizes that effective preventive screening requires evidence-based guidelines with
              proven mortality benefit — a standard that Function's comprehensive panel approach
              has not independently demonstrated.
            claimRefs:
