companyProfile:
  summary: >
    Function Health is a growth-stage DTC preventive-health membership that has translated Mark Hyman's
    longevity-medicine brand into approximately one million members and a self-reported $100M ARR in roughly three
    years, attracting a $298M Series B led by Redpoint Ventures at a $2.5B post-money valuation in November 2025. The
    business pairs an asset-light operating model (Quest does the labs, Getlabs the at-home draws, Ezra the MRI add-on)
    with an AI summarization layer ("Function Medical Intelligence") and a contracted physician panel. The thesis
    depends on durable membership renewal at price points that survive scrutiny of an effective ARPU near $100 versus a
    $499 list price, a defensible clinical posture against adverse press from the NYT Well desk, TIME, and independent
    scientific critics, and a 25x ARR multiple that is far above public DTC health comparables. The investment case is
    real but not yet underwriteable; the recommended posture is track until unit economics, regulatory clarity on
    laboratory- developed tests and FTC endorsement rules, and a second adverse-press cycle are metabolised.
  foundedDate: '2021-01-01'
  productSummary: >
    Function Health sells a $499/year membership that entitles each member to two cycles per year of a 160+ biomarker
    laboratory panel drawn at Quest Diagnostics' 2,000+ patient service centers, plus an AI-generated longitudinal
    report ("Function Medical Intelligence") reviewed by a contracted physician panel. Add-on options launched in
    2025–2026 include the GRAIL Galleri multi-cancer early-detection blood test, MRI body imaging via the Ezra
    subsidiary (acquired May 2025), and at-home phlebotomy via the Getlabs subsidiary (acquired April 2026). The product
    is delivered through a web member portal and an iOS app. Function Health does not operate its own clinical labs and
    relies on Quest's CLIA-certified laboratory network; FMI is positioned as an advisory summarization layer rather
    than a regulated diagnostic device.
