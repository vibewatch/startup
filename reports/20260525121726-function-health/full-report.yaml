      - number: '2.4'
        title: 2026 sizing signals and remaining gaps
        blocks:
          - type: paragraph
            body: |
              The most important 2026 sizing signals all came around the November 2025 Series B. The $100M ARR
              milestone at roughly 1M members implies a ~$100 effective realized ARPU, well below the $499
              list price — strong evidence that promotional pricing, partner-channel discounts (Equinox,
              Thatch employer bundles), and free / discounted memberships (Long Live Moms) are a material part
              of the customer mix. That is normal for a sub-scale consumer brand chasing scale, but it should
              anchor base-case sizing assumptions away from list-price ARPU.

              The $2.5B mark implies investors are pricing Function for a multi-year run from the current
              $100M ARR base. CB Insights' 2026 digital-health data shows longevity / preventive diagnostics
              attracting an outsized share of late-stage capital relative to current revenue, consistent with
              Function's mark but also consistent with category-level overvaluation if mass-market adoption
              does not materialise. The most credible skeptic argument is that the engaged biomarker-tracking
              demand is structurally HNW-concentrated and caps below the most aggressive longevity-investor
              numbers — a risk the bull case mitigates by pointing to GLP-1, Quest / Labcorp DTC validation,
              and the early employer channel.

              The remaining sizing gaps are concrete and addressable: HSA / FSA tax treatment for preventive
              lab memberships (which would lift effective price and unlock employer channels), a reconciled
              US DTC lab segment size across publishers, and a 50-state map of self-requested-lab regulation.
              Each is flagged below as an evidenceGap with a diligence path.
