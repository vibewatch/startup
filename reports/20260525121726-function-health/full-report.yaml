            body: |
              Function Health generates revenue primarily through its annual membership subscription
              priced at $499 per year, which provides access to 160+ lab tests conducted at Quest
              Diagnostics patient service centers nationwide. The company self-reports approximately
              $100M in annual recurring revenue as of late 2025, coinciding with surpassing 1 million
              members. Beyond the core subscription, Function Health has built supplementary revenue
              channels including the Equinox Optimize partnership ($40K per year per member), at-home
              testing via the acquired Getlabs platform, MRI body scanning through the Ezra acquisition,
              and B2B2C distribution partnerships with organizations such as the NBPA, Thatch, Sweetgreen,
              and Erewhon. The Medical Intelligence AI platform launched with the Series B represents a
              potential premium-tier upsell, though pricing for this add-on has not been disclosed. The
              revenue model fundamentally depends on the spread between membership fees collected and the
              per-test costs paid to Quest, which creates a relatively fixed cost structure against variable
              pricing realization.
