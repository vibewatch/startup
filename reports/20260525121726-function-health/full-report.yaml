      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: FDA LDT Reassertion Is the Structural Kill Risk
            body: >-
              The E.D. Texas vacatur of the FDA LDT rule creates a false sense of security. A future administration
              reassertion of oversight authority would require Function Health's entire 160-biomarker panel to undergo
              premarket review — a multi-year process that could force panel reduction or service suspension. This risk
              is unmitigable through company action alone and represents a structural vulnerability in the business
              architecture.
            calloutType: risk
            claimRefs:
              - CR001
              - CR031
          - type: callout
            title: Quest Single-Partner Concentration Is Operationally Existential
            body: >-
              With 100% of laboratory testing dependent on a single vendor (Quest Diagnostics) and an asymmetric
              dependency ratio where Function Health represents a fraction of Quest's volume, any contract disruption
              would have immediate and total service impact. No alternative lab network is in place and building one
              would require 6-12 months minimum.
            calloutType: risk
            claimRefs:
              - CR010
              - CR039
          - type: callout
            title: Independent ARR Verification Required Before Investment
            body: >-
              The ~$100M ARR claim supporting the $2.5B valuation has not been independently audited. The effective ARPU
              of ~$100 vs $499 list price implies heavy promotional pricing. Any investor should require audited
              financials or data room access to verify revenue trajectory before committing capital.
            calloutType: recommendation
            claimRefs:
              - CR015
              - CR016
              - CR017
          - type: callout
            title: Mark Hyman Is Simultaneously the Greatest Asset and Greatest Risk
            body: >-
              Hyman's celebrity-physician status drives organic acquisition that would cost tens of millions to replace
              with paid media. But his age (65+), association with functional medicine (academically criticized), and
              brand-centric positioning create a fragility where a single adverse media cycle could convert the
              company's strongest asset into its primary liability.
            calloutType: insight
            claimRefs:
              - CR013
              - CR014
              - CR030
          - type: callout
            title: Consumer-Initiated Model Provides Partial DOJ/OIG Shield
            body: >-
              This analysis assumes that Function Health's consumer-initiated lab ordering model (where members select
              their own panel) structurally differs from provider-ordered schemes that DOJ and OIG typically investigate
              for fraud. If the physician sign-off layer is found to lack individualized clinical judgment, this
              assumption fails and enforcement exposure increases materially.
            calloutType: assumption
            claimRefs:
              - CR020
              - CR028
              - CR042
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Funding History and Valuation Context
        blocks:
          - type: paragraph
            body: |
              Function Health closed its $298M Series B in November 2025 at a $2.5B post-money valuation,
              led by Redpoint Ventures with participation from existing investors a16z and Founders Fund.
              This followed a $53M Series A in June 2024 at $191M post-money — implying an extraordinary
              13x valuation step-up in just 17 months, driven by revenue growth from near-zero to approximately
              $100M ARR. Total capital raised stands at approximately $360M. The step-up significantly
              exceeds the typical 2-4x healthtech Series A-to-B progression, reflecting investor conviction
              in the growth velocity and category leadership position. Function Health's capital efficiency
              ratio of 3.6x (capital raised to ARR) is reasonable for a high-growth consumer health company,
              though it remains to be seen whether this efficiency holds as the company scales beyond early
              adopters. The $298M provides an estimated 20-36 months of runway at current burn rates,
              sufficient to position for profitability or a subsequent funding event. The 1M+ member base
              at $499/year creates a substantial recurring revenue foundation, though the confirmed ARR
              figure reflects estimates derived from membership counts and pricing rather than audited
              financial disclosures.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV014
              - CV022
              - CV023
          - type: table
            tableRef: TV001
            claimRefs:
              - CV027
              - CV013
              - CV004
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV001
              - CV004
              - CV013
              - CV014
      - number: '8.2'
        title: Comparable Valuation Analysis
        blocks:
          - type: paragraph
            body: |
              Function Health's 25x ARR multiple sits at a significant premium to public comparables.
              Hims & Hers Health (HIMS), the most directly comparable public consumer health subscription
              company, trades at 3-4x EV/Sales on approximately $1.5B revenue — reflecting the multiple
              compression that occurs with scale, public-market scrutiny, and proven unit economics.
              LabCorp, the legacy clinical laboratory benchmark, trades at 1.5-2x on $16B revenue,
              representing the mature-lab valuation floor. Teladoc, once a digital health high-flyer, now
              trades at 1-1.5x after growth deceleration and goodwill impairments. Among private companies,
              the median Series B digital health multiple is 5-10x per Rock Health and SVB 2025/2026 data,
              with the Pitchbook Q1 2026 report indicating median healthtech Series B valuations of 8-12x
              ARR. Function Health's 25x represents approximately 2-3x the category median — a premium
              historically reserved for companies demonstrating 100%+ revenue growth, category leadership,
              and clear paths to 50%+ gross margins. The premium is partially justified by Function Health's
              exceptional growth rate and large addressable market, but remains dependent on margin expansion
              that has not yet been proven at scale. Bain's 2026 healthcare PE report notes that consumer
              health platforms with recurring revenue and 50%+ gross margins command 15-20x ARR in growth
              equity transactions, suggesting Function Health must demonstrate margin improvement to sustain
              its multiple in subsequent rounds.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV029
              - CV031
              - CV032
          - type: table
            tableRef: TV004
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV031
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Scenario Analysis — Bull, Base, and Bear Cases
        blocks:
          - type: paragraph
            body: |
              Three scenarios frame the investment return profile. In the bull case (30% probability),
              Function Health reaches $200M ARR in 18-24 months through continued membership growth,
              ARPU expansion via Ezra MRI and Getlabs add-ons, and gross margin improvement above 50%.
              At 20-25x ARR, this yields an enterprise value of $4-5B — a 1.6-2.0x return on the $2.5B
              entry. The bull case requires sustained 80%+ growth, successful product expansion, and
              resolution of the adverse press cycle. In the base case (45% probability), ARR grows to
              $150M but growth decelerates to 40-50% and the multiple compresses to 15-20x as the company
              approaches Series C or IPO scrutiny, yielding $2.25-3.0B — roughly flat to the entry price.
              In the bear case (25% probability), ARPU remains at $499, churn elevates above 30% due to
              sustained adverse media coverage and competitive pressure, and the multiple compresses to
              10-15x of $100-120M ARR, yielding $1.0-1.5B — a 40-60% loss on entry. The probability-weighted
              expected value across these scenarios is approximately $2.7B, offering thin risk-adjusted upside
              of roughly 8% on the $2.5B entry. This marginality supports the track recommendation: the
              risk-return profile does not compensate adequately for the downside concentration in the bear
              case, particularly given unresolved gross margin and retention questions.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV034
          - type: table
            tableRef: TV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: |
              The investment thesis rests on three pillars: (1) Function Health has achieved rare
              consumer-health product-market fit, evidenced by growth from zero to $100M ARR in under
              two years and 1M+ members; (2) the preventive health testing TAM is large and growing,
              with Deloitte and BCG surveys showing 35-42% of US adults aged 25-54 willing to pay
              $300-500 annually for comprehensive testing; and (3) product optionality from Ezra MRI,
              Getlabs at-home testing, and Medical Intelligence AI creates ARPU expansion paths that
              could double revenue per member. The anti-thesis centers on: (1) the 25x multiple assumes
              growth durability that has not been tested through a full annual renewal cycle at scale;
              (2) gross margins of 40-60% may not support the premium multiple without significant
              operational leverage; (3) adverse academic and press criticism creates ongoing acquisition
              cost headwinds; and (4) competitive entry by incumbents (Quest, LabCorp, Hims) could
              commoditize the offering. The tension between thesis and anti-thesis resolves over the next
              2-3 quarters as retention data, margin trends, and competitive responses become visible.
              The Accenture 2026 digital health vision report's thesis that AI-powered longitudinal health
              platforms command premium valuations from data network effects supports the bull case, but
              this remains forward-looking and unproven for Function Health specifically.
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV024
              - CV025
              - CV033
              - CV036
              - CV037
          - type: table
            tableRef: TV002
            claimRefs:
              - CV009
              - CV017
              - CV025
              - CV033
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV013
              - CV027
      - number: '8.5'
        title: Exit Pathways and Diligence Outlook
        blocks:
          - type: paragraph
            body: |
              Function Health's most likely exit is IPO in 3-5 years if ARR exceeds $300M with sustained
              growth and 50%+ gross margins — comparable to Hims at its IPO with $270M revenue and
              improving unit economics. For a public offering at or above $2.5B, the company would need
              to demonstrate at least $200-250M ARR with declining net losses and clear path to
              profitability. The alternative exit in the bear case is strategic acquisition by Quest
              Diagnostics, LabCorp, or Hims & Hers at 3-5x ARR ($300-500M), representing significant
              loss for Series B investors. Conditions for upgrading from track to buy include two
              consecutive quarters of gross margin above 50%, annual retention above 90%, sustained 60%+
              growth at $150M+ ARR, and resolution of the adverse press narrative. The final diligence
              asks center on gross margin disclosure, cohort retention data, competitive moat evidence,
              and regulatory compliance posture. PwC's 2026 health industries outlook emphasizes that
              venture-backed consumer health companies face increasing pressure to demonstrate unit
              economics by Series C, reinforcing the 12-18 month timeline for Function Health to prove
              its margin thesis. The overall risk-return profile supports monitoring rather than immediate
              investment at the current stretched valuation.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV026
              - CV027
              - CV028
              - CV030
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV005
            claimRefs:
              - CV042
              - CV017
              - CV025
              - CV030
          - type: table
            tableRef: TV006
            claimRefs:
              - CV029
              - CV015
              - CV030
              - CV035
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Stretched multiple requires exceptional execution
            body: >-
              Function Health's 25x ARR multiple is 2-3x the private healthtech median and 6-8x public comparables. This
              premium is justified only if growth exceeds 80% YoY, gross margins expand above 50%, and retention exceeds
              80% annually — none of which have been independently verified.
            calloutType: risk
            claimRefs:
              - CV009
              - CV031
          - type: callout
            title: Probability-weighted return offers thin upside
            body: >-
              At $2.7B expected value versus $2.5B entry, the risk-adjusted return is approximately 8% — insufficient
              compensation for the 25% probability bear case that could result in 50-60% capital loss.
            calloutType: insight
            claimRefs:
              - CV013
              - CV012
          - type: callout
            title: Track pending margin and retention proof
            body: >-
              The recommendation is to track rather than invest at the current $2.5B entry. Upgrade conditions include:
              gross margins above 50% for two quarters, retention above 90%, and sustained 60%+ growth at $150M+ ARR.
            calloutType: recommendation
            claimRefs:
              - CV027
              - CV028
          - type: callout
            title: Exceptional growth velocity validates product-market fit
            body: >-
              Growing from zero to $100M ARR in under two years with 1M+ members at $499/year demonstrates rare consumer
              health product-market fit and creates a substantial recurring revenue base.
            calloutType: strength
            claimRefs:
              - CV004
              - CV034
          - type: callout
            title: Gross margin estimated at 40-60%
            body: >-
              The valuation analysis assumes gross margins of 40-60% based on comparable lab economics and platform
              overhead estimates. Actual margins are not publicly disclosed and could be materially different.
            calloutType: assumption
            claimRefs:
              - CV029
              - CV032
