  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacencies
        blocks:
          - type: paragraph
            body: |
              Function Health sells inside the US clinical laboratory services market — a market that Grand View
              Research and Statista together size at roughly $98 billion in 2024, growing at a 7-9% CAGR through 2030.
              The vast majority of that spend is insurer-billed diagnostic testing ordered by a treating clinician;
              the much smaller, faster-growing wedge that Function actually competes in is the consumer-paid,
              preventive-indication slice — the lab work an individual buys for themselves out-of-pocket because
              they want longitudinal biomarker data, not because a clinician is investigating a complaint.

              The right way to define Function's market is therefore exclusionary first: it does not directly
              compete for insurer-paid testing, hospital-system reference labs, fertility / oncology specialty
              panels, or in-office point-of-care testing. It does compete with the consumer-direct lines that Quest
              Diagnostics (QuestHealth / QuestDirect) and Labcorp (OnDemand) themselves now operate, with at-home
              single-test players like Everlywell, with single-panel longevity-marketed players like InsideTracker,
              with the supplement-plus-test category (Thorne), and with longevity-clinic memberships of various
              depths (Lifeforce, Parsley Health, Fountain Life, Forward, Equinox Optimize). Imaging adjacencies —
              full-body MRI from Neko Health, Prenuvo, and the Ezra unit Function itself acquired in May 2025 —
              now sit inside the membership rather than next to it. CGM (Levels, Dexcom Stelo) and the wider
              "monitor when well" wearables market are demand-shaping adjacencies more than direct substitutes.

              The serious sizing question is therefore not the headline $98B but the size of the consumer-paid,
              preventive-indication wedge: a wedge that has grown rapidly but is still a single-digit share of
              total lab spend. Multiple lenses (Grand View Research, KFF spending data, the ~17-23% of US adults
              Nature Digital Medicine reports as having used at least one DTC lab test) converge on a low-single-
              digit-billion 2024 wedge with a much larger long-run ceiling if Function-style memberships displace
              the per-test purchase model.
