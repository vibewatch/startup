          - type: callout
            title: Quest and Labcorp going direct-to-consumer is the structural medium-term threat
            body: |
              Function's moat is the consumer subscription wrapper, not the lab assays. Quest's QuestHealth /
              QuestDirect and Labcorp's OnDemand businesses are the structural medium-term threat: as the
              incumbents standardise consumer-friendly per-test pricing, the cash-arbitrage that funds
              Function's $499 membership compresses. The differentiator must be the AI report, the longitudinal
              experience, and the brand — not the assay menu Function rents from Quest.
