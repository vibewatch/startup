      - number: '7.5'
        title: Reputational Risks
        blocks:
          - type: paragraph
            body: |
              Function Health faces a convergent reputational risk profile from three credible adverse press vectors.
              The New York Times (January 2026) directly challenged the clinical value proposition, reporting that
              critics warn mass screening of healthy adults generates anxiety without proven mortality benefit. TIME
              and NPR published investigative pieces questioning clinical utility for asymptomatic individuals. McGill
              University's academic critique of functional medicine as a pipeline to alternative medicine directly
              implicates Mark Hyman's clinical philosophy.

              The reputational trigger most likely to cause cascading damage is an AI Medical Intelligence error that
              goes viral — an incorrect cancer risk flagging, missed critical value, or demonstrably wrong health
              recommendation shared on social media. Given Function Health's ~1M member base and the inherent
              statistical likelihood of edge-case AI outputs, the question is not whether such an event will occur
              but when. The company's medical disclaimer limiting liability does not prevent reputational harm. A
              single viral incident could trigger a news cycle combining NYT/TIME-style clinical skepticism with
              concrete patient harm narrative, creating a compound reputational event that impairs organic growth
              and triggers regulatory inquiry. The celebrity-physician backlash pattern — where Hyman's association
              becomes a liability rather than asset — represents the secondary amplification risk.
