      - number: '4.3'
        title: Unit Economics Analysis
        blocks:
          - type: paragraph
            body: |
              Function Health's unit economics remain largely opaque due to the absence of public
              financial disclosures. The key variables are: revenue per member (effective ARPU of ~$100),
              cost of goods sold per member (estimated lab costs of $70-100 based on Quest requisition
              pricing of $35-50 per draw times two rounds per year), and operating expenses including
              technology platform, physician oversight, customer support, and marketing. At ~$100 ARPU
              with estimated COGS of $70-100, the gross margin on the core subscription could be near
              zero or negative for heavily discounted cohorts. By contrast, list-price members at $499
              would generate healthy gross margins of 60-80%. Comparable DTC health subscription
              companies such as Teladoc report gross margins of 65-70%, while Hims & Hers achieved
              approximately $20 monthly ARPU ($240 annualized) at scale with 70%+ gross margins. The
              critical unknown is what proportion of the 1M member base pays full price versus deeply
              discounted rates, as this determines whether the business generates positive unit
              contribution or subsidizes growth through venture capital.
