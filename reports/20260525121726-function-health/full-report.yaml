      - number: '2.2'
        title: Sizing lenses, buyer segments, and willingness-to-pay
        blocks:
          - type: paragraph
            body: |
              A defensible sizing for Function's wedge needs at least three independent lenses. Lens one is
              "consumer share of US lab spend" — applying a 3-6% consumer-paid share to the $98B Grand View base
              gives $3-6B today, much of it captured by Quest and Labcorp DTC rather than by Function. Lens two
              is "Function-style memberships only" — at $500 ARPU, hitting 4-12M paying US members yields a
              $2-6B annual segment, which is our base case. Lens three is "premium longevity ceiling" — the
              Equinox $40K Optimize membership and Fountain Life ~$25K / year program demonstrate that a thin
              HNW slice will pay an order of magnitude more, but the segment caps in the low single-digit
              hundreds of thousands of members.

              The buyer segmentation that sits under those sizings is sharp. The dominant individual segment is
              the mass-affluent, health-engaged 25-55 cohort — the audience that already follows Hyman, Attia,
              Means, or other longevity-media voices and that buys premium gym memberships, wearables, and
              supplements. A premium HNW slice (Equinox Optimize, Fountain Life clients) sits above that. The
              employer-benefit segment is real but still experimental — Thatch and Thrive Global are channel
              partners, but mainstream HR benefits dollars still flow to dental, vision, EAP, and primary care
              networks rather than to Function. The sports / entertainment segment (NBPA, athlete-investors)
              is small but disproportionately important for brand. Payor coverage is essentially zero today
              because insurers do not reimburse the broad preventive panel.

              The willingness-to-pay picture explains both Function's velocity and its ceiling. Equinox proves
              a thin segment will pay $40K. Function proves a much wider segment will pay $499. Per-test
              Everlywell pricing proves that à-la-carte demand is real but caps at a few hundred dollars per
              household per year. The structural insight is that Function's $499 sits at the willingness-to-pay
              "default" point — high enough to fund a real product, low enough to be impulse-bought by an
              engaged consumer after a Hyman podcast — and that explains why it is the model the other DTC
              lab players are now copying.
