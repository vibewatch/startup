  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Member Workflow
        blocks:
          - type: paragraph
            body: |
              Function Health's core product is a $499/year membership providing access to 160+
              lab biomarkers tested semiannually at Quest Diagnostics' 2,000+ CLIA-certified
              patient service centers across the United States. The biomarker panel spans five
              clinical domains: cardiovascular health (lipid panel, ApoB, Lp(a), hs-CRP),
              metabolic health (HbA1c, fasting glucose, insulin), hormones (testosterone, thyroid,
              cortisol), nutrients and vitamins (vitamin D, B12, iron, magnesium), and organ
              function markers (liver enzymes, kidney filtration, complete blood count). Members
              schedule appointments through the iOS app or web portal, visit a Quest PSC for a
              standard venous blood draw, and receive results within 5-7 business days.

              The product has expanded significantly beyond its original blood-testing scope through
              acquisitions and partnerships. Ezra (acquired May 2025) adds AI-powered full-body MRI
              scans covering 13 organs in a 60-minute session. Getlabs (acquired April 2026) provides
              at-home mobile phlebotomy for members who prefer not to visit a Quest PSC. The GRAIL
              Galleri multi-cancer early detection test (added December 2024) screens for 50+ cancer
              types via cell-free DNA methylation patterns at an additional cost of approximately $949.
              The Equinox Optimize partnership integrates Function testing into a $40,000/year premium
              longevity membership. This multi-modality expansion converts Function from a pure
