            body: |
              The core Function Health membership is priced at $499 per year and includes two testing
              rounds annually, each comprising 160+ lab biomarkers processed through Quest Diagnostics.
              This translates to an implied cost to the consumer of roughly $3.12 per individual test,
              substantially below Quest retail pricing for equivalent panels. However, effective ARPU of
              approximately $100 suggests that the vast majority of members pay significantly less than
              the $499 list price. This gap can be attributed to promotional pricing, partner discounts
              through channels like Sweetgreen and Erewhon collaborations, partial-year memberships, and
              corporate wellness programs offering subsidized access. The Getlabs at-home testing
              add-on represents an incremental monetization layer beyond the base membership, with
              convenience fees likely in the $50-100 range per draw. The Equinox Optimize partnership
              at $40K per year represents the highest monetization tier, bundling Function Health testing
              with comprehensive longevity coaching and gym access. No publicly available data confirms
