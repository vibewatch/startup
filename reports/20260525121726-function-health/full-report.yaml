        title: Financial and Competitive Risks
        blocks:
          - type: paragraph
            body: |
              Function Health's $2.5B post-money valuation at approximately $100M ARR implies a 25x revenue
              multiple — aggressive for a subscription health services business and requiring sustained 50%+ annual
              growth to justify. The reported ARR has not been independently audited; the figure derives from company
              statements in press coverage, creating information asymmetry risk. The effective ARPU of ~$100 versus
              $499 list price suggests heavy promotional discounting that may not be sustainable without margin
              compression; withdrawal of promotional pricing could trigger accelerated churn.

              Forward Health's 2024 shutdown demonstrates that well-funded DTC health subscription models face
              existential unit economics risk even with significant venture backing. Rock Health's H2 2025 report
              documents declining DTC health valuations and rising CAC industry-wide. Competitive pressure comes
              from multiple vectors: Hims & Hers ($1B+ revenue) could launch overlapping lab features at lower
              price points; the ACA mandates free insurer coverage for USPSTF A/B-graded preventive services,
              creating overlap with portions of Function Health's panel. Concentrated investor dependency on a16z
              and Redpoint means fund lifecycle pressures could force premature exit timing. The down-round risk
              at Series C is material if growth decelerates below the trajectory implied by the current valuation.
