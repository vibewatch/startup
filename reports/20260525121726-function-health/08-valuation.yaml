company:
  name: Function Health
chapter:
  number: 8
  title: Valuation and Investment Outlook
  summary: |
    Function Health's $2.5B post-money valuation at its November 2025 Series B implies a 25x ARR
    multiple on ~$100M revenue — stretched relative to public comparables (Hims 3-4x, LabCorp 1.5-2x)
    but defensible if 50%+ growth and gross-margin expansion materialise. The bull case ($4-5B at
    $200M ARR in 18-24 months) requires sustained membership growth and Ezra/Getlabs integration
    success. The bear case ($1.0-1.5B) reflects multiple compression to 10-15x on adverse press,
    churn elevation, or ARPU stagnation. Recommendation: track with medium confidence. The valuation
    is stretched, risk is high, and 2-3 quarters of margin and retention proof are needed before the
    risk-adjusted return justifies entry at the current price.
verdict:
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
