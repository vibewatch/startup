sections:
  - id: SV_FUNDING
    title: Funding History and Valuation Context
    body: |
      Function Health closed its $298M Series B in November 2025 at a $2.5B post-money valuation,
      led by Redpoint Ventures with participation from existing investors a16z and Founders Fund.
      This followed a $53M Series A in June 2024 at $191M post-money — implying an extraordinary
      13x valuation step-up in just 17 months, driven by revenue growth from near-zero to approximately
      $100M ARR. Total capital raised stands at approximately $360M. The step-up significantly
      exceeds the typical 2-4x healthtech Series A-to-B progression, reflecting investor conviction
      in the growth velocity and category leadership position. Function Health's capital efficiency
      ratio of 3.6x (capital raised to ARR) is reasonable for a high-growth consumer health company,
      though it remains to be seen whether this efficiency holds as the company scales beyond early
      adopters. The $298M provides an estimated 20-36 months of runway at current burn rates,
      sufficient to position for profitability or a subsequent funding event. The 1M+ member base
      at $499/year creates a substantial recurring revenue foundation, though the confirmed ARR
      figure reflects estimates derived from membership counts and pricing rather than audited
      financial disclosures.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV014
