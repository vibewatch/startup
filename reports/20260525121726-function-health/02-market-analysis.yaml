company:
  name: Function Health
chapter:
  number: 2
  title: Market Analysis
  summary: |
    Function Health competes inside a US clinical laboratory services market that
    Grand View Research sizes at roughly $98B in 2024 with a high-single-digit CAGR
    through 2030. The directly addressable wedge — direct-to-consumer (DTC) lab
    testing, longevity diagnostics, and membership-style preventive health — is
    much smaller but is growing far faster, fueled by Quest/LabCorp opening up
    consumer ordering, payor frustration, GLP-1-driven biomarker tracking, and a
    well-funded longevity media wave. Function's $499 / year all-inclusive
    membership compresses the traditional per-test purchase model and converts a
    small but well-funded high-income consumer segment into recurring revenue.
