callouts:
  - calloutType: insight
    title: Function's market is a fast-growing wedge, not the headline $98B lab market
    body: |
      The directly addressable market is the consumer-paid, preventive-indication slice of US lab spend — a
      single-digit-billion wedge today inside the $98B Grand View base — not the headline lab market. The
      $2.5B Series B mark is a bet on Function and the wedge growing together into the $3-6B base-case
      SAM range by 2030. That is plausible, but it depends on HSA / FSA eligibility, employer-channel
      uptake, and continued longevity-wave momentum — none of which is yet locked in.
    claimRefs: [CM001, CM007, CM029, CM031, CM032]
  - calloutType: assumption
    title: Effective ARPU is below list — sizing must use $100-$250, not $499
    body: |
      The ~$100M ARR cited around the Series B at ~1M members implies a $100 effective realised ARPU —
      five times below the $499 list price. Promotional pricing, partner bundles, and discounted
      memberships explain the gap. Sizing models that use list ARPU will overstate revenue by 2-5x;
      this report's base case uses a $250 ARPU midpoint to bridge today's $100 and a future $500.
    claimRefs: [CM026, CM031, CM033]
  - calloutType: risk
    title: Quest and Labcorp going direct-to-consumer is the structural medium-term threat
    body: |
      Function's moat is the consumer subscription wrapper, not the lab assays. Quest's QuestHealth /
      QuestDirect and Labcorp's OnDemand businesses are the structural medium-term threat: as the
      incumbents standardise consumer-friendly per-test pricing, the cash-arbitrage that funds
      Function's $499 membership compresses. The differentiator must be the AI report, the longitudinal
      experience, and the brand — not the assay menu Function rents from Quest.
    claimRefs: [CM004, CM005, CM023, CM034]
