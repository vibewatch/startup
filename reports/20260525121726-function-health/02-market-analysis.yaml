sections:
  - id: market-definition
    title: Market boundary and adjacencies
    body: |
      Function Health sells inside the US clinical laboratory services market — a market that Grand View
      Research and Statista together size at roughly $98 billion in 2024, growing at a 7-9% CAGR through 2030.
      The vast majority of that spend is insurer-billed diagnostic testing ordered by a treating clinician;
      the much smaller, faster-growing wedge that Function actually competes in is the consumer-paid,
      preventive-indication slice — the lab work an individual buys for themselves out-of-pocket because
      they want longitudinal biomarker data, not because a clinician is investigating a complaint.

      The right way to define Function's market is therefore exclusionary first: it does not directly
      compete for insurer-paid testing, hospital-system reference labs, fertility / oncology specialty
      panels, or in-office point-of-care testing. It does compete with the consumer-direct lines that Quest
      Diagnostics (QuestHealth / QuestDirect) and Labcorp (OnDemand) themselves now operate, with at-home
      single-test players like Everlywell, with single-panel longevity-marketed players like InsideTracker,
      with the supplement-plus-test category (Thorne), and with longevity-clinic memberships of various
      depths (Lifeforce, Parsley Health, Fountain Life, Forward, Equinox Optimize). Imaging adjacencies —
      full-body MRI from Neko Health, Prenuvo, and the Ezra unit Function itself acquired in May 2025 —
      now sit inside the membership rather than next to it. CGM (Levels, Dexcom Stelo) and the wider
      "monitor when well" wearables market are demand-shaping adjacencies more than direct substitutes.

      The serious sizing question is therefore not the headline $98B but the size of the consumer-paid,
      preventive-indication wedge: a wedge that has grown rapidly but is still a single-digit share of
      total lab spend. Multiple lenses (Grand View Research, KFF spending data, the ~17-23% of US adults
      Nature Digital Medicine reports as having used at least one DTC lab test) converge on a low-single-
      digit-billion 2024 wedge with a much larger long-run ceiling if Function-style memberships displace
      the per-test purchase model.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM010, CM012, CM015, CM029]
    tableRefs: [TM001]
    figureRefs: [FM004]
  - id: sizing-and-segments
    title: Sizing lenses, buyer segments, and willingness-to-pay
    body: |
      A defensible sizing for Function's wedge needs at least three independent lenses. Lens one is
      "consumer share of US lab spend" — applying a 3-6% consumer-paid share to the $98B Grand View base
      gives $3-6B today, much of it captured by Quest and Labcorp DTC rather than by Function. Lens two
      is "Function-style memberships only" — at $500 ARPU, hitting 4-12M paying US members yields a
      $2-6B annual segment, which is our base case. Lens three is "premium longevity ceiling" — the
      Equinox $40K Optimize membership and Fountain Life ~$25K / year program demonstrate that a thin
      HNW slice will pay an order of magnitude more, but the segment caps in the low single-digit
      hundreds of thousands of members.

      The buyer segmentation that sits under those sizings is sharp. The dominant individual segment is
      the mass-affluent, health-engaged 25-55 cohort — the audience that already follows Hyman, Attia,
      Means, or other longevity-media voices and that buys premium gym memberships, wearables, and
      supplements. A premium HNW slice (Equinox Optimize, Fountain Life clients) sits above that. The
      employer-benefit segment is real but still experimental — Thatch and Thrive Global are channel
      partners, but mainstream HR benefits dollars still flow to dental, vision, EAP, and primary care
      networks rather than to Function. The sports / entertainment segment (NBPA, athlete-investors)
      is small but disproportionately important for brand. Payor coverage is essentially zero today
      because insurers do not reimburse the broad preventive panel.

      The willingness-to-pay picture explains both Function's velocity and its ceiling. Equinox proves
      a thin segment will pay $40K. Function proves a much wider segment will pay $499. Per-test
      Everlywell pricing proves that à-la-carte demand is real but caps at a few hundred dollars per
      household per year. The structural insight is that Function's $499 sits at the willingness-to-pay
      "default" point — high enough to fund a real product, low enough to be impulse-bought by an
      engaged consumer after a Hyman podcast — and that explains why it is the model the other DTC
      lab players are now copying.
    claimRefs: [CM006, CM007, CM016, CM024, CM031, CM032, CM033, CM034]
    tableRefs: [TM002, TM003]
    figureRefs: [FM001, FM002]
  - id: drivers-and-constraints
    title: Demand drivers, adoption constraints, and the buyer journey
    body: |
      The 2024-2026 demand drivers for Function are unusually well aligned. The longevity media wave —
      Mark Hyman, Peter Attia, Andrew Huberman — has converted "monitor when well" from biohacker
      curiosity into a mass-affluent norm. The GLP-1 era has put millions of consumers on weight-loss
      drugs with metabolic side effects, which creates a recurring reason to track biomarkers. The
      high-deductible health plan trend has pushed routine costs to consumers, so an annual $499 outlay
      that replaces a few $200 cash-pay panel orders looks economic. Quest and Labcorp themselves
      building DTC channels validate the demand. The Sweetgreen and Erewhon collaborations in early
      2026 show the wave has crossed from "elite biohacker" to mainstream consumer-brand culture.

      The constraint side is equally clear. The FDA's 2024 Laboratory Developed Test (LDT) rule is
      slowly bringing more lab-developed tests under FDA premarket review — a structural cost that
      will land hardest on Function's add-on, esoteric panels rather than its base offering. HIPAA-grade
      privacy controls and state telehealth lab-order rules vary materially across the 50 states and
      shape what Function can deliver where. Payer coverage remains essentially zero; the broad
      preventive panel is not on the USPSTF "covered preventive service" list. And the clinical-
      evidence critique (NYT Well, McGill OSS) is now strong enough to make HSA / FSA inclusion a real
      policy debate rather than a foregone conclusion.

      Pulled together, the buyer journey from awareness to membership is short — a Hyman podcast or
      celebrity-investor post on Instagram, a partner endorsement (NBPA athlete, Equinox), the $499
      web-funnel signup, the Quest draw appointment, the AI report — and explains the velocity to 1M
      members. The structural risk is that the same brand-driven funnel that scaled fast is dependent
      on continued Hyman / longevity-wave momentum and on the absence of a meaningful policy backlash;
      a downturn on either dimension would compress Function's effective addressable market quickly.
    claimRefs: [CM008, CM009, CM011, CM013, CM017, CM018, CM019, CM020, CM021, CM022, CM027, CM028, CM030, CM035]
    tableRefs: [TM004]
    figureRefs: [FM003]
  - id: 2026-signals
    title: 2026 sizing signals and remaining gaps
    body: |
      The most important 2026 sizing signals all came around the November 2025 Series B. The $100M ARR
      milestone at roughly 1M members implies a ~$100 effective realized ARPU, well below the $499
      list price — strong evidence that promotional pricing, partner-channel discounts (Equinox,
      Thatch employer bundles), and free / discounted memberships (Long Live Moms) are a material part
      of the customer mix. That is normal for a sub-scale consumer brand chasing scale, but it should
      anchor base-case sizing assumptions away from list-price ARPU.

      The $2.5B mark implies investors are pricing Function for a multi-year run from the current
      $100M ARR base. CB Insights' 2026 digital-health data shows longevity / preventive diagnostics
      attracting an outsized share of late-stage capital relative to current revenue, consistent with
      Function's mark but also consistent with category-level overvaluation if mass-market adoption
      does not materialise. The most credible skeptic argument is that the engaged biomarker-tracking
      demand is structurally HNW-concentrated and caps below the most aggressive longevity-investor
      numbers — a risk the bull case mitigates by pointing to GLP-1, Quest / Labcorp DTC validation,
      and the early employer channel.

      The remaining sizing gaps are concrete and addressable: HSA / FSA tax treatment for preventive
      lab memberships (which would lift effective price and unlock employer channels), a reconciled
      US DTC lab segment size across publishers, and a 50-state map of self-requested-lab regulation.
      Each is flagged below as an evidenceGap with a diligence path.
    claimRefs: [CM014, CM020, CM023, CM025, CM026, CM030]
