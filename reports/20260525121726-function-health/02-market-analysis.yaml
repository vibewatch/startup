  claims:
    - id: CM001
      statement: >-
        Grand View Research sizes the US clinical laboratory services market at roughly $98B in 2024 and projects
        a 7-9% CAGR through 2030, with the consumer-paid wedge growing materially faster than the insurer-paid
        core.
      type: third-party-reported
      topic: US lab market size
      sourceRefs: [SM001, SM002, SM005]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM001]
    - id: CM002
      statement: >-
        Function Health's directly addressable market is the wedge of US clinical-lab spend purchased by
        individuals out-of-pocket (rather than billed through an insurer or employer plan) for preventive
        rather than diagnostic indications.
      type: inferred
      topic: market boundary
      sourceRefs: [SM001, SM003, SM004]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM002]
    - id: CM003
      statement: >-
        At $499 / year for 160+ tests, Function Health compresses a per-test cash purchase that would otherwise
        run roughly $750-$1,500 at Quest's own consumer (QuestDirect) prices for an equivalent panel, creating
        a clear cash-price arbitrage for engaged consumers.
      type: inferred
      topic: pricing arbitrage
      sourceRefs: [SM005, SM011, SM020]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM003]
    - id: CM004
      statement: >-
        Quest Diagnostics (Function's underlying lab) is itself building a direct-to-consumer ordering channel
        (QuestHealth / QuestDirect) — a structural reminder that Function's moat is the consumer subscription
        layer, not access to assays.
      type: observed
      topic: Quest DTC entry
      sourceRefs: [SM005]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM010]
    - id: CM005
      statement: >-
        Labcorp's "OnDemand" line is the parallel consumer-direct channel from Function's second-largest US
        lab counterparty; combined with Quest's offering, the two-incumbent lab oligopoly is now an active
        adjacency rather than a passive supplier.
      type: observed
      topic: Labcorp DTC entry
      sourceRefs: [SM006]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM010]
    - id: CM006
      statement: >-
        The premium longevity segment is anchored by Equinox's $40,000-per-year Optimize program (which uses
        Function Health for its testing layer), implying willingness-to-pay multiples above the $499 Function
        list price within a thin but well-funded HNW segment.
      type: observed
      topic: premium longevity ceiling
      sourceRefs: [SM028]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM014]
    - id: CM007
      statement: >-
        A defensible US-wide sizing for Function's $499 / year preventive lab membership wedge is roughly
        $2-6B at full mainstream adoption (assuming 4-12M paying members at $500 / year average revenue per
        user) — large in absolute terms but a small slice of the $98B US lab market.
      type: estimated
      topic: TAM sizing
