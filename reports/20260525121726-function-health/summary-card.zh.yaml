summary:
  headline: >
    Function Health 把名医 + 明星 DTC 打法在预防健康市场跑成了教科书式启动：不到三年约 100 万会员、自报 $100M ARR， 靠 Mark Hyman 品牌和 Quest Diagnostics
    全国实验室网络支撑。但 $298M Series B 估值 $2.5B（约 25x ARR）， 相对公开 DTC 健康可比公司已偏高；有效 $100 ARPU 与 $499 标价对不上；NYT Well、TIME
    和独立科学批评者的负面报道， 也带来过度诊断、FTC 背书和实验室自建检测（LDT）监管问题。等单位经济性、留存、临床 / 监管姿态更清楚后再继续跟踪。
