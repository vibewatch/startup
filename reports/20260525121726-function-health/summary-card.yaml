summary:
  headline: >
    Function Health has executed a textbook celebrity-physician DTC launch into the preventive-health market — roughly
    one million members and a self-reported $100M ARR in under three years, anchored by Mark Hyman's brand and Quest
    Diagnostics' nationwide lab footprint. The $298M Series B at $2.5B (~25x ARR) is stretched against public DTC-health
    comparables, the effective $100 ARPU is unreconciled against the $499 list price, and adverse press from the NYT
    Well desk, TIME, and independent scientific critics raises overdiagnosis, FTC endorsement, and laboratory-
    developed-test (LDT) regulatory questions. Track until unit economics, retention, and clinical/regulatory posture
    clarify.
