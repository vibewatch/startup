  customerFocus: >
    Direct-to-consumer longevity-curious adults — primarily affluent urban professionals
    paying $499/year out-of-pocket — supplemented by partner-subsidised cohorts including
    Equinox Optimize ($40K/yr fitness members), the National Basketball Players Association
    (professional athletes), Thatch employer-marketplace cohorts, and co-marketing with
    Thrive Global, Sweetgreen, and Erewhon. There is no direct payor or employer-paid
    channel of material scale disclosed.
  businessModel: >
    Annual subscription membership at $499 with self-reported ~1M members and ~$100M ARR,
    asset-light gross margin enabled by reselling Quest Diagnostics laboratory capacity,
    add-on revenue from Galleri / Ezra / Getlabs, and bundled partnership economics through
    Equinox, Thatch, and NBPA cohorts. Function Health does not disclose retention, CAC,
    payback, or contribution-margin metrics; effective ARPU of approximately $100 implies
    substantial discounting or partial-year membership accounting that public evidence
    cannot reconcile.
  stage: Series B — growth-stage DTC preventive health
  fundingStatus: >
    Total disclosed funding approximately $360M across seed ($3M, March 2022), seed
    extension ($6.5M, December 2023), Series A ($53M led by a16z, June 2024, at $191M
    post-money), and Series B ($298M led by Redpoint Ventures, November 19 2025, at
    $2.5B post-money). The $2.5B post-money implies roughly a 25x revenue multiple
    against the company-disclosed $100M ARR figure. No debt or project-finance facilities
    are publicly disclosed.
