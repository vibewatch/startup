  shortDescription: >
    Function Health is an Austin, Texas-based direct-to-consumer preventive-health membership
    that gives consumers access to 160+ lab biomarkers for a $499 annual fee, using Quest
    Diagnostics' national lab network (2,000+ patient service centers) and an AI-generated
    reporting layer ("Function Medical Intelligence") backed by a contracted physician panel.
    Founded in 2021 by Mark Hyman MD and a six-co-founder team led by CEO Jonathan Swerdlin,
    the company closed a $298M Series B in November 2025 led by Redpoint Ventures at a
    $2.5B post-money valuation; total disclosed funding is approximately $360M. The company
    reports ~1M members and ~$100M ARR (both self-disclosed), and has expanded into MRI
    body-imaging via the May 2025 Ezra acquisition and at-home phlebotomy via the April
    2026 Getlabs acquisition.

revision: null

subtitle: "DTC longevity testing at $499/yr — explosive growth and a $100M ARR claim, against a $2.5B price and unresolved clinical, regulatory, and unit-economics gaps"

coverageNotes: >
  Report covers public evidence through May 2026 (run date 2026-05-25). Function Health is
  a private company; no audited financial accounts are publicly available. The $100M ARR
  and 1M member figures are self-reported in trade press around the November 2025 Series B
  announcement and have not been independently verified. Effective ARPU of approximately
  $100 (derived from $100M ARR divided by 1M members) is materially below the $499 list
  price, implying heavy partner-subsidised cohorts (Equinox Optimize, NBPA, Thatch employer
  marketplace), promotional pricing, or partial-year membership accounting that cannot be
  reconciled from public disclosures. Funding chronology is confirmed by tier-one outlets
  (TechCrunch, Bloomberg, Forbes, PitchBook). Adverse evidence (NYT Well 2026-01-08, TIME
  2024-12-04, McGill OSS 2025-06-12, The Daily Beast Hyman review) covers overdiagnosis,
  functional-medicine framing, and Mark Hyman key-person reputational risk. Comparable
  multiples reference Hims & Hers public filings (HIMS), LabCorp, Teladoc, and Rock Health
  / Silicon Valley Bank private-market multiples for H2 2025 / Q1 2026.

