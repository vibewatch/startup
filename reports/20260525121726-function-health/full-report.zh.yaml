      - number: '7.5'
        title: 声誉风险
        blocks:
          - type: paragraph
            body: |
              Function Health 面临三条可信反向媒体线索汇合出的声誉风险。The New York Times（2026 年 1 月）直接
              挑战其临床价值主张，报道称批评者警告，对健康成人做大规模筛查会制造焦虑，却没有已证明的死亡率收益。
              TIME 和 NPR 发布调查文章，质疑无症状个体使用此类服务的临床效用。McGill University 对功能医学作为
              通往替代医学管线的学术批评，也直接牵连 Mark Hyman 的临床理念。

              最可能造成连锁损害的声誉触发器，是一次 AI Medical Intelligence 错误被社交媒体放大——比如错误标记
              癌症风险、漏掉关键数值，或给出明显错误的健康建议。考虑到 Function Health 约 ~1M 的会员基数，以及
              边缘案例 AI 输出在统计上的内在可能性，问题不是这类事件会不会发生，而是什么时候发生。公司的医疗免责声明
              不能阻止声誉伤害。一次病毒式事件就可能触发一轮新闻周期，把 NYT/TIME 式临床怀疑与具体患者伤害叙事合并，
              形成复合声誉事件，削弱自然增长并引发监管问询。名人医生反噬模式——Hyman 的关联从资产变成负债——则是
              第二层放大风险。
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR014
              - CR034
      - number: '7.6'
        title: 展示
        blocks:
          - type: callout
            title: FDA 重新主张 LDT 监管权是结构性致命风险
            body: >-
              Texas 东区法院撤销 FDA LDT 规则，制造了一种虚假的安全感。未来政府如果重新主张监督权，Function Health 整个 160
              项生物标志物面板都必须接受上市前审查——这是一个多年流程，可能迫使面板缩减或服务暂停。公司单靠 自身行动无法缓释这一风险，它是业务架构中的结构性脆弱点。
            calloutType: risk
