      - number: '2.4'
        title: 2026 年规模信号与剩余缺口
        blocks:
          - type: paragraph
            body: >
              最重要的 2026 规模信号都出现在 November 2025 B 轮前后。约 1M 会员对应 $100M ARR 里程碑，意味着约 $100 的有效实现 ARPU，远低于 $499

              标价——这强烈说明促销价格、合作伙伴渠道折扣（Equinox、Thatch 雇主捆绑）以及免费 / 折扣会员（Long Live
              Moms）是客户组合的重要部分。对一个追求规模、尚未达到成熟规模的消费品牌来说，这很正常，但基准情景规模测算应锚定在偏离标价

              ARPU 的水平。


              $2.5B 估值意味着投资人正在按 Function 从当前 $100M ARR 基数继续跑多年的路径定价。CB Insights 2026 数字健康数据显示，相比当前收入，长寿 /
              预防诊断吸引了过高比例的后期资本；这与

              Function 的估值一致，也同样可能说明，如果大众市场采用没有兑现，整个品类存在估值过高。最可信的怀疑论点是，活跃生物标志物追踪需求结构上集中在 HNW 人群，天花板低于最激进长寿投资人的数字——乐观情景则用

              GLP-1、Quest / Labcorp DTC 验证，以及早期雇主渠道来缓解这一风险。


              剩余规模缺口具体且可补：预防实验室会员的 HSA / FSA 税务处理（可提高有效价格并打开雇主渠道）、跨出版商口径统一的美国 DTC 实验室细分市场规模，以及自助申请实验室检测监管的 50

              州地图。下文将逐一列为证据缺口，并给出尽调路径。
            claimRefs:
              - CM014
