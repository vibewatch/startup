      - number: '8.2'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: |
              Function Health 的 25x ARR 倍数相较公开可比公司有明显溢价。Hims & Hers Health（HIMS）是最直接可比的
              公开消费者健康订阅公司，约 $1.5B 收入对应 3-4x EV/Sales——这反映了规模化、公开市场审视和已验证单位经济
              后出现的倍数压缩。LabCorp 是传统临床实验室基准，$16B 收入对应 1.5-2x，代表成熟实验室估值底部。Teladoc
              曾是数字健康高增长公司，如今在增长减速和商誉减值后仅交易于 1-1.5x。私营公司中，根据 Rock Health 和 SVB
              2025/2026 数据，Series B 数字健康公司的中位倍数为 5-10x；Pitchbook Q1 2026 报告显示，健康科技 Series B
              估值中位数为 8-12x ARR。Function Health 的 25x 约为品类中位数的 2-3x——历史上这种溢价通常留给能证明
              100%+ 收入增长、品类领导地位和清晰 50%+ 毛利率路径的公司。Function Health 的超常增长率和大可服务市场
              部分支撑了溢价，但该溢价仍依赖尚未在规模上证明的利润率扩张。Bain 2026 healthcare PE 报告指出，具备经常性
              收入和 50%+ 毛利率的消费者健康平台，在成长股权交易中可拿到 15-20x ARR；这意味着 Function Health 必须
              证明毛利率改善，才能在后续轮次维持其倍数。
