      - number: '5.2'
        title: 技术架构与 AI 平台
        blocks:
          - type: paragraph
            body: |
              Function Health 的技术架构在实验室侧本质上是轻资产——所有样本处理都在 Quest Diagnostics 通过
              CLIA 认证的设施完成——但收购 Ezra 和 Getlabs 之后，资产越来越重。核心数据管线是：会员通过
              Function app 下单检测，Quest 处理样本并通过 API 集成返回结构化实验室数据，Function 的云平台
              将结果写入统一的会员健康记录。随后，Function Medical Intelligence（FMI）AI 层读取原始实验室
              数值和会员历史数据，生成个性化健康摘要、趋势分析和可执行建议。

              2025 年 11 月 Series B 时，FMI 被包装成公司的主要技术差异化来源：它把商品化的 Quest 实验室
              数据转化为自有 AI 生成健康智能，从而支撑 $2.5B 估值。但 Function 尚未公开 FMI 底层模型架构
              （很可能基于第三方 LLM 并做医学微调）、训练数据构成、准确率基准或幻觉率。医生审核环节——由
              签约 MD 在交付会员前审核 AI 生成摘要——既是安全网，也是监管护栏，让 FMI 保持在咨询式决策支持
              分类内，而不是自主诊断设备。Quest 的企业业务解决方案平台提供基于 API 的实验室下单和结果交付
              基础设施，支撑这套集成。Series B 之后，工程团队正在积极扩张，公司招聘页面可见 AI/ML、后端和
              移动端岗位信号。
