      - number: '7.2'
        title: 运营与合作伙伴依赖风险
        blocks:
          - type: paragraph
            body: |
              Function Health 的运营架构在多个层级制造集中风险。Quest Diagnostics 是全部 160+ 项生物标志物检测
              的唯一实验室伙伴，覆盖约 2,000 个患者服务中心。这是极端的单一供应商依赖：Quest 每天
              为所有客户处理约 500,000 份实验室订单，Function Health 只是其中一个占比有限的客户，议价能力有限。
              Quest 一旦运营中断、重新谈判合同或在战略上降低优先级，就会对全服务造成即时影响，而且没有替代实验室
              网络接上。

              2026 年 4 月收购 Getlabs 后，公司引入上门采血运营，天然带有排期和质量一致性风险。跨地域管理移动
              采血员队伍本身运营复杂，收购仍处早期又放大了整合风险。GRAIL Galleri 合作引入了继承责任：Galleri
              的多癌种检测围绕假阳性率本身就有临床争议；无论运营责任归谁，合作产品带来的不良结果都会反映到
              Function Health 品牌上。

              HIPAA 数据暴露面随会员规模直接放大：约 ~1M 会员对应约 160 million 个生物标志物数据点，构成受保护
              健康信息，并分布在多个集成伙伴之间（Quest、GRAIL、Getlabs）。每个合作伙伴集成都形成一条 Business
              Associate Agreement 链，任何一环泄露都会让 Function Health 暴露于监管责任。公司的 SOC 2 认证和
              静态加密主张覆盖了基线安全，但多伙伴表面积会随合作复杂度增加而扩张。AI Medical Intelligence 系统
              又增加了一类新风险：幻觉或错误医学解读可能触发个体患者伤害、监管审查和病毒式声誉事件。
