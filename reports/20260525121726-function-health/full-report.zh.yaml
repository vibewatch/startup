      - number: '5.5'
        title: 展示
        blocks:
          - type: callout
            title: 轻资产实验室模型借力 Quest 现有临床基础设施
            body: |
              Function Health 的结构性优势在于，它不需要自建、认证或运营实验室。Quest Diagnostics 为所有样本
              处理提供 2,000+ 个通过 CLIA 认证的患者服务中心、分析验证、质量控制和监管合规。Function 在其上
              叠加消费者订阅、AI 解读和医生审核，在已经规模化的临床基础设施上做出一个类似软件的高毛利业务。
              这种模型让公司无需按比例投入实验室运营资本开支，就快速扩张到 ~1M 会员。
            calloutType: strength
            claimRefs:
              - CE001
              - CE005
              - CE023
              - CE035
          - type: callout
            title: FMI 缺少已发布准确率数据，且没有 FDA 监督
            body: |
              Function Medical Intelligence 为约 1 million 会员生成临床健康建议，但公司没有公开任何准确率基准、
              幻觉率或临床验证数据。系统以咨询工具分类运作，没有 FDA 许可；这一分类依赖医生审核能持续存在。
              临床场景中的 AI 幻觉可能产出有害建议。NYT 对参考范围的批评和 TIME 对过度治疗的担忧说明，风险
              不是理论问题。尽调应优先获取 FMI 内部表现数据。
            calloutType: risk
            claimRefs:
              - CE004
              - CE013
              - CE014
              - CE024
          - type: callout
            title: 对单一 Quest 供应商的依赖带来集中风险
            body: |
              所有样本采集和实验室分析都流经 Quest Diagnostics。Function Health 没有备用实验室合作伙伴，
              没有独立 CLIA 认证，也没有公开的 Quest 服务中断应急方案。Quest API 宕机、价格重新谈判，或
              Quest 决定推出竞争性消费者产品，都会直接威胁 Function 的核心服务交付。
            calloutType: risk
            claimRefs:
              - CE005
              - CE011
              - CE031
          - type: callout
            title: 收购正在把资产模型从轻推向重
            body: |
              Ezra 需要 MRI 硬件、场地租约和放射科医生网络。Getlabs 需要持证移动采血员和冷链物流。这些收购
              把 Function 从纯软件与品牌玩法，变成拥有物理资产、临床人员和受地理约束服务的运营公司。由此带来
              的整合复杂度和资本需求，已经明显偏离最初的轻资产投资逻辑。
            calloutType: insight
            claimRefs:
              - CE006
              - CE007
              - CE022
          - type: callout
            title: 扩大 AI 自主性前，必须要求 FMI 临床验证数据
            body: |
              在减少医生监督或扩大 FMI 临床范围之前，Function 应委托独立临床验证研究，衡量准确率、幻觉率和
              患者结局影响。发布这些结果可以回应医学批评者指出的核心可信度缺口，并在 FDA 加大临床 AI 工具
              审查时降低监管风险。
            calloutType: recommendation
