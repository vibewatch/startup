          - type: callout
            title: 等待毛利率和留存证明，维持观察
            body: 建议是在当前 $2.5B 进入价下观察，而不是投资。上调条件包括：连续两个季度毛利率超过 50%、留存超过 90%，并在 $150M+ ARR 规模上保持 60%+ 增长。
            calloutType: recommendation
            claimRefs:
              - CV027
              - CV028
          - type: callout
            title: 超常增长速度验证产品市场匹配
            body: 不到两年从零增长到 $100M ARR，并拥有 1M+ 会员、标价 $499/year，说明公司取得了罕见的消费者健康产品市场匹配， 也形成了可观的经常性收入基础。
            calloutType: strength
            claimRefs:
              - CV004
              - CV034
          - type: callout
            title: 毛利率估计为 40-60%
            body: 估值分析基于可比实验室经济模型和平台开销估算，假设毛利率为 40-60%。实际利润率没有公开披露，可能存在重大差异。
            calloutType: assumption
            claimRefs:
              - CV029
              - CV032
