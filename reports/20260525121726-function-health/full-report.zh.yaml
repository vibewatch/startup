        - 收入基数大得多；增长率更低
      - - LabCorp（LH，上市）
        - 收入约 $16B，临床实验室服务
        - 1.5-2x 企业价值 / 销售额
        - 代表成熟实验室对检测业务的估值底部
        - 传统模式；无 DTC；科技溢价很低
      - - Teladoc（TDOC，上市）
        - 收入约 $2.6B，数字健康平台
        - 1-1.5x 企业价值 / 销售额
        - 警示案例：数字健康高峰后倍数压缩
        - 模式不同（远程医疗）；商誉减值拖累
      - - 私有数字健康中位数（Series B）
        - 中位 ARR $20-50M
        - 5-10x 企业价值 / ARR
        - 成长期私有公司的行业基准
        - 样本多元；并非全是订阅；增长差异大
      - - Pitchbook Q1 2026 健康科技中位数（Series B）
        - Series B 健康科技中位数
        - 8-12x ARR
        - Function Health 所处阶段最新私有市场基准
        - 包含非消费者模式；增长较低的样本
    rows_contd: null
    notes: 公开可比公司截至 Q1 2026；私有市场中位数来自 Rock Health H2 2025 和 Pitchbook Q1 2026 报告。Function Health 的 25x 是私有市场中位数的 2-3x。
    enumerationScope:
      coverage: partial
      basis: >-
        Selected public and private comparables relevant to consumer health subscription and clinical lab segments,
        2025-2026 data
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
      - CV031
  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 毛利率失守
        - ARR 达 $150M+ 时 GM 低于 45%
        - 倍数不可持续；向实验室服务 2-3x 压缩
        - 下调至回避；退出持仓
      - - 流失抬升
        - 连续 2 个队列年流失率超过 35%
        - ARR 增长停滞；悲观情景启动
        - 降低持仓规模；观察是否企稳
      - - 监管执法
        - FDA 行动限制检测组合范围，或州牌照被吊销
        - 收入受冲击 + 声誉受损；倍数坍缩
        - 立即退出；问题解决后重新评估
      - - 竞争商品化
        - Quest/LabCorp/Hims 在 12 个月内推出可比产品
        - 定价承压；CAC 膨胀；增长放缓
        - 重新评估护城河逻辑；若份额流失明确则下调
      - - 负面报道持续
        - 6 个月内 >3 家媒体出现重大负面报道，且没有反驳
        - CAC 上升 20-40%；自然增长受损
        - 监控会员获取指标；若 CAC 翻倍则下调
    notes: 否决触发项代表观察建议会转为回避的情形
    claimRefs:
      - CV042
      - CV017
      - CV025
      - CV030
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 按队列拆分毛利率
        - 单会员 COGS 拆分（实验室、采血、平台）
        - 验证 25x 倍数在规模化后是否可持续
        - 要求管理层披露 P&L
      - - 队列留存率
        - 按获客队列拆分 12 个月和 24 个月续费率
        - 悲观情景取决于流失抬升；留存数据可解答
        - 要求提供队列分析，或委托独立调查
      - - 竞争护城河证据
        - 切换成本、数据锁定指标、相对替代方案的 NPS
        - 没有护城河，竞争者入场后 25x 溢价会被侵蚀
        - 会员调查或竞争情报项目
      - - 监管合规姿态
        - FDA LDT 规则影响评估、州牌照状态
        - 监管行动是否决触发项；合规状态未知
        - 法律尽调审查监管文件和律师意见
      - - ARPU 扩张证据
        - Ezra MRI 和 Getlabs 附加项购买率及收入贡献
        - 乐观情景要求 ARPU 超过 $499 基础档继续增长
        - 要求提供附加项采用的产品分析
    notes: 从观察上调至买入建议的优先尽调事项
    claimRefs:
      - CV029
      - CV015
      - CV030
      - CV035
