              - CR001
              - CR031
          - type: callout
            title: Quest 单一伙伴集中在运营上具有生死级影响
            body: >-
              100% 实验室检测依赖单一供应商（Quest Diagnostics），且依赖关系不对称：Function Health 只占 Quest
              业务量的一小部分。任何合同中断都会带来即时且全面的服务影响。目前没有替代实验室网络，搭建一个至少需要 6-12 个月。
