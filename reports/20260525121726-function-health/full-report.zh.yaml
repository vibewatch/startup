  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与会员流程
        blocks:
          - type: paragraph
            body: |
              Function Health 的核心产品是一项 $499/year 会员服务，会员每半年可在 Quest Diagnostics 遍布美国的 2,000+
              个通过 CLIA 认证的患者服务中心检测 160+ 项实验室生物标志物。生物标志物面板覆盖五个临床领域：
              心血管健康（血脂面板、ApoB、Lp(a)、hs-CRP）、代谢健康（HbA1c、空腹血糖、胰岛素）、激素
              （睾酮、甲状腺、皮质醇）、营养素和维生素（维生素 D、B12、铁、镁），以及器官功能指标
              （肝酶、肾小球滤过、全血细胞计数）。会员通过 iOS app 或网页门户预约，到 Quest PSC 接受标准
              静脉采血，并在 5-7 个工作日内收到结果。

              通过收购和合作，产品已经大幅越过最初的血液检测边界。Ezra（2025 年 5 月收购）加入 AI 驱动的
              全身 MRI，一次 60 分钟覆盖 13 个器官。Getlabs（2026 年 4 月收购）为不愿到 Quest PSC 的会员
              提供上门移动采血。GRAIL Galleri 多癌种早筛检测（2024 年 12 月加入）用游离 DNA 甲基化模式筛查
              50+ 种癌症，额外费用约 $949。Equinox Optimize 合作把 Function 检测嵌入 $40,000/year 的高端
              长寿会员服务。这种多模态扩张把 Function 从单纯的血液检测封装层变成综合预防健康平台，但每新增
              一种模态，也会带来各自的整合、监管和运营风险。
