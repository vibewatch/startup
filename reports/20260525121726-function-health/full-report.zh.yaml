      - number: '1.2'
        title: 资本结构、投资方与已报告规模
        blocks:
          - type: paragraph
            body: >
              Function Health 的融资史把大量里程碑压进了很短的窗口。March 2022 完成 $3M 种子轮、December 2023 追加 $6.5M
              种子延伸轮（当时公司仍使用更早的「Assessment」品牌）之后，公司在

              June 2024 完成 Andreessen Horowitz 领投的 $53M A 轮，投后估值约 $191M。仅 17 个月后，November 2025，Redpoint

              Ventures 领投 $298M B 轮，投后估值 $2.5B，约 13x 加价，把 Function 推进「接近十角兽」的预防健康队列。媒体报道明确把该轮融资与「Function

              Medical Intelligence」同步发布绑定，说明新增资本要投向 AI / 数据平台，以及在核心会员业务之上的更多收购。


              对一家临床健康科技公司来说，Function 的投资方组合不太寻常：既有传统 Silicon Valley 风投（a16z、Redpoint、K5 Global），也有大量高可见度的名人和运动员支持者——Joel

              Embiid（通过 Embiid Ventures）、Matt Damon、Kevin Hart、Pedro Pascal、Zac Efron、Jay Shetty、Blake Griffin、Colin

              Kaepernick、Jimmy Rollins、Ari Emanuel、Casey Means MD、Harpreet Singh Rai（前 Oura CEO）和 Jeff
              Dean（Google）。这种组合给 Function

              在娱乐和职业体育圈带来异常深的分发杠杆——February 2025 的 NBPA 合作已经可见——但也带来披露公平性问题：由持股名人推动的产品，比由付费代言人推动的产品更需要清晰标注。


              本章最不稳定的是规模数字，应视为公司口径，而不是经审计数字。围绕 November 2025 B 轮的报道称 Function 已突破 1M 会员，年经常性收入运行率接近约 $100M；对比

              2024 年更早的基线，当时约 100,000 名会员、200,000 人等候名单，2023 年完成 3M 次实验室检测。员工数仍不透明：Wikipedia 信息框引用的是扩张前约 50

              人的明显过时快照；B 轮后的报道只说公司在激进招聘，却没有发布当前人数——下文将明确把这列为开放证据缺口。
