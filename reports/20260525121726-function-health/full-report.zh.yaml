  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻市场
        blocks:
          - type: paragraph
            body: >
              Function Health 销售的市场是美国临床实验室服务市场——Grand View Research 和 Statista 合计估算该市场 2024 年约 $98B，并以 7-9%

              CAGR 增长至 2030。绝大多数支出来自由治疗医生开具、由保险计费的诊断检测；Function
              真正竞争的是更小但增长更快的一块：消费者自费、预防指征的实验室检测——个人为了获得纵向生物标志物数据而自掏腰包购买，并非因为医生正在排查某个主诉。


              因此，定义 Function 市场的正确方式应先做排除：它不直接争夺保险支付检测、医院系统参考实验室、生殖 / 肿瘤专科面板，或诊所内即时检测。它竞争的是 Quest
              Diagnostics（QuestHealth

              / QuestDirect）和 Labcorp（OnDemand）自己正在运营的消费者直达业务、Everlywell 这类上门单项检测玩家、InsideTracker 这类以长寿营销的单面板玩家、Thorne

              这类补充剂加检测品类，以及不同深度的长寿诊所会员（Lifeforce、Parsley Health、Fountain Life、Forward、Equinox Optimize）。影像相邻市场——Neko

              Health、Prenuvo 和 Function 在 May 2025 收购的 Ezra 单元提供的全身 MRI——现在已被放进会员体系内，而不是站在旁边。CGM（Levels、Dexcom
              Stelo）和更宽的「健康时监测」可穿戴市场，更像塑造需求的相邻市场，而非直接替代。


              真正严肃的规模问题不是头部 $98B，而是消费者自费、预防指征这个切片有多大：这个切片增长很快，但在总实验室支出中仍是个位数百分比。多种视角（Grand View

              Research、KFF 支出数据、Nature Digital Medicine 报告约 17-23% 美国成年人至少使用过一次 DTC 实验室检测）都指向 2024 年低个位数十亿美元细分市场；如果

              Function 式会员取代单次检测购买模式，长期天花板会大得多。
