  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争对手队列与 Function 的位置
        blocks:
          - type: paragraph
            body: >
              Function 的竞争对手可以清晰分成 5 个队列。第一类是按项 DTC 实验室队列——Quest 的 QuestHealth / QuestDirect 和 Labcorp 的 OnDemand
              是结构性既有巨头；Everlywell

              是融资最多的纯玩家。第二类是以长寿营销的单面板或会员队列——InsideTracker（算法单面板）、Lifeforce（$129 / 月，含教练）、Thorne（检测 + 补充剂）和 Levels（CGM

              会员）。第三类是功能医学远程医疗会员队列，以 Parsley Health（$199 / 月）为锚。第四类是高端长寿诊所队列——Fountain Life、已倒闭的 Forward，以及 Equinox

              Optimize（$40K / 年，实际上运行在 Function 检测层上）。第五类是影像主导的长寿品牌队列——Neko Health 和 Prenuvo，Ezra 现在已被 Function 吸收。


              Function 的位置不寻常，因为它是美国唯一一个主流玩家，把宽年度面板（160+ markers、重复采血）、签约 MD 开单、AI 生成报告和单一年费打包到 $499

              大众富裕价格点。Quest 和 Labcorp DTC 更便宜地覆盖按项现金需求，但不做捆绑。Lifeforce 和 Parsley 每年收约 $1,500-$2,400，功能组合不同。InsideTracker

              按面板定价，而不是按年。高端诊所贵一个数量级。影像主导品牌补充而非替代实验室层。结果是，Function 占据了「默认年度会员」位置——截至 mid-2026，美国还没有主流竞争对手直接匹配这一组合。
