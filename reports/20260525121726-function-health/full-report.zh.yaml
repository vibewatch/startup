  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: |
              Function Health 处在一个结构上不稳定的监管灰色地带。FDA 在 2024 年 5 月最终敲定规则，要求实验室
              自建检测接受上市前审查，但 Texas 东区法院在 2025 年 3 月撤销了该规则。这造成管辖悬置：Function
              Health 的 160 项生物标志物面板目前没有 FDA 上市前监督，但未来政府可能通过立法行动或上诉成功重新
              主张监管权，进而要求多年合规投入或缩减面板。公司的 AI Medical Intelligence 系统还面临另一层分类
              问题——它到底是临床决策支持（豁免），还是医疗器械软件（需 510(k) 许可）——目前仍未解决。

              Mark Hyman 同时担任联合创始人和临床权威人物，FTC 背书风险因此很实质。2023 年 FTC Endorsement
              Guides 要求清楚披露重大利益关系；Hyman 的临床建议如果隐含推广 Function Health 服务，可能被认定为
              未披露的商业背书。法律责任还延伸到过度诊断主张：USPSTF 明确反对常规筛查面板中的多项生物标志物
              （维生素 D、无症状成人甲状腺功能），从而形成按单项检测计算的责任面。McGill 的学术批评和 Daily
              Beast 报道记录下的功能医学叙事，使公司暴露于集体诉讼风险：消费者若主张公司暗示了证据医学不支持
              的临床收益，诉讼风险就会上升。

              DOJ Healthcare Fraud Strike Force 和 OIG 对高频实验室下单的执法模式带来背景审查风险，尽管
              Function Health 的消费者主动 DTC 模型在结构上不同于由服务提供方下单的欺诈方案。公司的法律免责声明
              和强制仲裁条款能提供部分缓释，但在消费者保护较强的司法辖区可能面临可执行性挑战。CLIA 合规完全委托
              给 Quest Diagnostics，也就是说 Function Health 的监管姿态取决于第三方能否持续保持认证。
