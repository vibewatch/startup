  shortDescription: >
    Function Health is an Austin, Texas-based direct-to-consumer preventive-health membership that gives consumers
    access to 160+ lab biomarkers for a $499 annual fee, using Quest Diagnostics' national lab network (2,000+ patient
    service centers) and an AI-generated reporting layer ("Function Medical Intelligence") backed by a contracted
    physician panel. Founded in 2021 by Mark Hyman MD and a six-co-founder team led by CEO Jonathan Swerdlin, the
    company closed a $298M Series B in November 2025 led by Redpoint Ventures at a $2.5B post-money valuation; total
    disclosed funding is approximately $360M. The company reports ~1M members and ~$100M ARR (both self-disclosed), and
    has expanded into MRI body-imaging via the May 2025 Ezra acquisition and at-home phlebotomy via the April 2026
    Getlabs acquisition.
