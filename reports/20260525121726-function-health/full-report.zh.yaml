      - number: '8.5'
        title: 退出路径与尽调展望
        blocks:
          - type: paragraph
            body: |
              Function Health 最可能的退出路径，是在 3-5 年内 IPO，前提是 ARR 超过 $300M，并保持持续增长和 50%+ 毛利率——
              可类比 Hims IPO 时 $270M 收入和改善中的单位经济。若要以 $2.5B 或更高估值上市，公司需要证明至少 $200-250M
              ARR、净亏损收窄，并有清晰盈利路径。悲观情景下的替代退出，是由 Quest Diagnostics、LabCorp 或 Hims & Hers
              以 3-5x ARR（$300-500M）战略收购，这将让 Series B 投资者遭受显著损失。从观察上调至买入的条件包括：连续两个
              季度毛利率超过 50%、年度留存超过 90%、在 $150M+ ARR 规模上保持 60%+ 增长，以及反向媒体叙事得到解决。最终
              尽调问题集中在毛利率披露、队列留存数据、竞争护城河证据和监管合规姿态。PwC 的 2026 health industries outlook
              强调，风险投资支持的消费者健康公司到 Series C 时会面临越来越大的单位经济证明压力，这进一步强化了 Function
              Health 需要在 12-18 个月内证明毛利率逻辑的时间线。整体风险回报支持继续观察，而不是在当前偏高估值下立即投资。
