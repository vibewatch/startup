      - number: '6.4'
        title: 留存、满意度与重复使用
        blocks:
          - type: paragraph
            body: |
              截至 2026 年 5 月，Function Health 没有披露任何公开留存指标——公共领域没有 NRR、GRR、月流失率
              或队列留存数据。这是客户章节尽调中最大的单一信息缺口。订阅模型每年提供两轮检测，天然形成年度
              续费决策点，内部理应产生可衡量的续费和流失数据。Reddit 的 r/functionhealth 讨论中，会员在争论
              是否续费；满意度与个人是否有医生或健康教练来解释结果相关。

              Trustpilot 评论呈现混合分布：一些用户称赞检测全面，另一些则表示没有专属医生支持时难以解读结果。
              关键在于，NPR 报道称，批评者担心 Function Health 检测会让健康个体接受不必要的后续检查并产生焦虑。
              The New York Times 在 2026 年 1 月发布批评性的会员体验文章，质疑大规模血液检测的可执行健康价值。
              TIME 在 2024 年 12 月提出过度治疗担忧。Consumer Reports 警告，DTC 实验室检测消费者可能不知道如何
              处理异常结果。这些反向信号共同指向一条与可执行性相关的留存风险叙事，而不是检测质量：会员可能
              不是因为检测失败而流失，而是因为没有额外临床支持时，结果无法转化为清晰的行为改变。
