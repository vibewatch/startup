      - number: '7.3'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: |
              Mark Hyman MD 是严重程度最高的单一关键人物风险。他已 65+ 岁，同时担任联合创始人、主要品牌大使和
              临床权威人物。若他离任、出现健康事件或卷入公共争议，Function Health 的营销和可信度定位中最有辨识度
              的人物就会消失。STAT News 报道明确质疑该品牌能否挺过领导层交接。The Daily Beast 和 McGill 对 Hyman
              功能医学理念的批评构成潜在触发器：只要一次高关注媒体周期质疑其临床资质，就可能连锁侵蚀会员信心。

              6 名联合创始人的团队结构会带来协调成本和潜在角色模糊，组织扩张后更明显。Series B 后快速扩员带来
              文化稀释风险和管理带宽约束。公司没有公开披露接班计划，也没有确认一位可替代 Hyman 品牌角色的公开
              医疗权威。这造成结构性脆弱：公司最有价值的营销资产——Hyman 的名人医生权威——也是最大集中风险。
            claimRefs:
              - CR013
              - CR014
              - CR026
