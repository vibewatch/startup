        blocks:
          - type: paragraph
            body: >
              逐项功能矩阵能看出 Function 的捆绑比竞争对手走得更远。Function 在单一会员中列出 160+ 项生物标志物，对比 InsideTracker Ultimate 面板约 110

              项、典型 Everlywell 式上门套件约 50 项，以及 Lifeforce 约 40-60 项经筛选的复测面板。Function 还叠加签约 MD 开单、Quest PSC 网络（2,000+

              个中心）、纵向 app、Function Medical Intelligence（November 2025 发布的 AI 报告层）、MRI 和 Galleri 加购，以及上门采血选项（来自 April

              2026 Getlabs 收购）。InsideTracker 的算法建议历史最长，但没有 MD 开单。Lifeforce 用更小面板搭配真人教练。Parsley 用远程医疗 MD
              时间搭配更小实验室检测。Quest

              / Labcorp DTC 只卖检测，没有壳。Thorne 把检测和补充剂绑定。没有一家在 Function 的价格点把所有维度打包。


              定价深度同样清楚。Function 的 $499 / 年是独特的价格—捆绑点：对每年做 4+ 个面板的会员来说，比按项 DTC 单次检测更便宜；按年比 Lifeforce 或 Parsley

              便宜 3-5x。按经济性看，最接近的替代是 Quest QuestDirect（按项，每项更便宜但没有壳）和 Equinox Optimize（这是 Function 合作伙伴，不是竞争对手）。剩余产品轴——AI

