      - number: '5.3'
        title: 信任、合规与临床证据缺口
        blocks:
          - type: paragraph
            body: |
              Function Health 的合规模型主要借力 Quest Diagnostics 现有监管认证，而不是自己的临床牌照。
              所有实验室分析都在 Quest 通过 CLIA 认证的设施内完成，Quest 还持有 CAP 认可和州级实验室牌照。
              Function Health 自称会员数据处理符合 HIPAA，静态和传输过程均加密，但未发布 SOC 2、HITRUST
              或其他第三方安全审计结果。FMI AI 层作为咨询工具运作，没有 FDA 许可；这一分类依赖医生在环审核
              环节能持续保留。如果 FMI 生成的建议绕过医生中介，直接由会员使用，这一分类可能被挑战。

              最大的产品可信度风险是临床证据缺口。The New York Times（2026 年 1 月）报道，Function 使用的
              生物标志物参考范围比标准临床实验室更窄，可能把健康数值标成异常，并触发不必要的后续检查。TIME
              报道则对无症状人群接受综合生物标志物面板提出过度治疗担忧。McGill 的 Office for Science and
              Society 将功能医学描述为通往替代医学的管线。Health Affairs 研究指出，消费者健康筛查平台往往
              缺少改善临床结局的证据。CDC 强调，有效的预防筛查需要基于证据的指南，并证明能带来死亡率收益；
              Function 的综合面板路径尚未独立证明达到这一标准。
