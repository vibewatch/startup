            title: Mark Hyman 同时是最大资产和最大风险
            body: >-
              Hyman 的名人医生身份推动自然获客，若用付费媒体替代可能要花数千万美元。但他的年龄（65+）、与功能医学的关联
              （受到学术批评）以及以品牌为中心的定位，造成一种脆弱性：一次不利媒体周期就可能把公司最强资产变成主要负债。
