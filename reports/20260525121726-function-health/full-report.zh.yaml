      - number: '8.3'
        title: 情景分析——乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: |
              三个情景框定投资回报轮廓。乐观情景（30% 概率）下，Function Health 在 18-24 个月内通过会员持续增长、
              Ezra MRI 和 Getlabs 附加项推动 ARPU 扩张，以及毛利率提升至 50% 以上，达到 $200M ARR。按 20-25x ARR，
              企业价值为 $4-5B，相对于 $2.5B 进入价回报 1.6-2.0x。乐观情景要求持续 80%+ 增长、产品扩张成功，并化解
              反向媒体周期。基准情景（45% 概率）下，ARR 增至 $150M，但增速降至 40-50%，随着公司接近 Series C 或 IPO
              审视，倍数压缩至 15-20x，对应 $2.25-3.0B——大致与进入价持平。悲观情景（25% 概率）下，ARPU 仍为 $499，
              持续反向媒体报道和竞争压力让流失率升至 30% 以上，倍数压缩到 $100-120M ARR 的 10-15x，对应 $1.0-1.5B——
              较进入价亏损 40-60%。按概率加权，这些情景的期望价值约 $2.7B，相对 $2.5B 进入价仅有约 8% 的风险调整上行。
              这种边际性支持观察建议：风险回报无法充分补偿悲观情景中的下行集中风险，尤其在毛利率和留存问题仍未解决时。
