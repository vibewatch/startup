      - number: '5.4'
        title: 产品路线图与开发走向
        blocks:
          - type: paragraph
            body: |
              Function Health 在 Series B 之后的产品路线图围绕三条线展开：加深 AI 能力、扩展检测模态、拓宽
              地理和渠道覆盖。$298M Series B（2025 年 11 月，由 Redpoint Ventures 领投）为 FMI 持续开发、
              已收购子公司的整合，以及潜在国际扩张提供资金。Fierce Healthcare 报道确认，新增检测模态和扩展
              AI 能力是核心优先事项。

              招聘页面上的工程招聘信号（AI/ML 工程师、后端工程师、移动开发者）显示平台投入正在推进。整合
              难度很高：要把来自 Quest 的实验室结果、Ezra 的 MRI 影像、Galleri 的癌症筛查、Getlabs 的上门
              采血统一进一份连贯的纵向健康记录，需要大量数据工程。公司已经扩张到约 1 million 会员（~$100M
              ARR），验证了消费者需求，但也逼迫公司在不良事件或监管审查倒逼响应之前，提高 AI 层的临床可靠性。
              产品走向显示，Function 正在和时间赛跑：在竞争者或监管者压缩其运营模型之前，先靠 AI 和数据网络
              效应打出可防守的技术护城河。
