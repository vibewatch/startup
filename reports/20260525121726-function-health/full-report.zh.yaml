            body: >
              Function 的护城河耐久性是混合图景。品牌和 Hyman 带来的声量份额，是近期最强护城河：TIME100、Forbes / Fortune / TechCrunch / Modern

              Healthcare 反复报道，以及 Sweetgreen / Erewhon / NBPA / Equinox
              合作，带来了同队列其他玩家无法接近的免费触达。合作伙伴渠道栈带来的分发具有专有性。随着纵向记录积累，切换成本会提高——把会员迁到竞争对手那里，意味着放弃多年趋势记录。数据

              / AI 层（Function Medical Intelligence）在改善，但还不是可防守 IP。Quest 供给是租来的，不是自有的——这是最大的结构性弱点，因为 Quest
              自己也在运营竞争性消费者业务线。


              3 个替代场景值得关注。第一是「来自下方的远程医疗」——Hims & Hers 利用其 GLP-1 用户基础、大众市场品牌和初级保健远程医疗流程，以更低导入价打包 Function

              式实验室会员。第二是「来自上方的超大规模平台」——Amazon（One Medical + Pharmacy + DTC labs）或 Apple Health
              把实验室会员捆进更广的消费者健康会员。第三是「医生开具的定向面板」叙事，任何既有巨头（Quest、Labcorp

              或医院系统）都可以围绕 McGill / NYT 对宽面板假阳性的批评来打。


              值得注意的 2026 年事件包括 Function 自己的 $298M B 轮、估值 $2.5B（Nov 2025，由 Redpoint 领投，并同步发布 Function Medical

              Intelligence）、Quest 持续扩张 QuestHealth、Neko Health 推进美国市场、Function April 2026 收购 Getlabs，以及 Sweetgreen 和
              Erewhon

              合作。所有这些都方向性延展了 Function 在大众富裕会员队列中的领先位置，同时没有解除结构性 Quest 依赖和 Hims 从下方进攻的风险。
