      - number: '8.4'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: |
              投资逻辑立在三根支柱上：(1) Function Health 已经取得罕见的消费者健康产品市场匹配，证据是不到两年从零增长
              到 $100M ARR，并拥有 1M+ 会员；(2) 预防性健康检测总可用市场（TAM）大且仍在增长，Deloitte 和 BCG 调查显示，
              美国 25-54 岁成年人中有 35-42% 愿意每年支付 $300-500 做综合检测；(3) Ezra MRI、Getlabs 上门检测和 Medical
              Intelligence AI 带来的产品可选性，创造了让单会员收入翻倍的 ARPU 扩张路径。反向逻辑集中在：(1) 25x 倍数假设
              增长耐久性成立，但公司尚未经历一次完整的大规模年度续费周期检验；(2) 40-60% 毛利率如果没有显著运营杠杆，未必
              支撑高溢价倍数；(3) 学术界和媒体的反向批评会持续抬高获客成本；(4) Quest、LabCorp、Hims 等在位者进入，可能
              将产品商品化。未来 2-3 个季度，随着留存数据、利润率趋势和竞争回应显现，投资逻辑与反向逻辑之间的张力会得到
              解决。Accenture 2026 digital health vision 报告认为，AI 驱动的纵向健康平台会因数据网络效应获得估值溢价；
              这一观点支撑乐观情景，但对 Function Health 本身仍属前瞻且未验证。
