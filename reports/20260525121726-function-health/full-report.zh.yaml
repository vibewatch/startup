      - number: '6.2'
        title: 增长轨迹与采用指标
        blocks:
          - type: paragraph
            body: |
              Function Health 的头部增长指标——到 2025 年 11 月突破 1 million 会员——是 DTC 健康领域最快的扩张
              轨迹之一。公司同时披露 ~$100M ARR，对应有效 ARPU 约 $100/会员，而标价是 $499。这个 5x 差距意味着，
              会员基数中相当一部分处于折扣、合作伙伴补贴或免费促销层级。全价个人订阅者与补贴队列之间的组合
              尚未披露，是尽调中关键的收入质量问题。

              采用漏斗从认知开始（很大程度由 Mark Hyman 的媒体曝光和播客触达驱动），经过候补名单 / 注册流程，
              再到通常两周内完成的 Quest Diagnostics 实验室到访、五天内在 app 交付结果，以及可选医生咨询。
              每年两轮检测天然形成年度续费决策点。Galahad 的 2026 长寿诊所榜单按会员量将 Function Health
              列为 DTC 预防检测市场领导者，领先 InsideTracker、Lifeforce 和其他竞争者。增长主要来自赢得媒体、
              名人背书和战略合作，而不是已披露的付费获客投放。
