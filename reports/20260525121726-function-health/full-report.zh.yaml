            title: 套在 Quest 实验室网络上的消费级订阅壳
            body: >
              Function 的结构性洞察是，美国预防实验室检测的瓶颈不在底层检测项目——Quest 已经在 2,000+ 个患者服务中心大规模运行这些检测——而在消费者如何开单、付费和解读检测。Function

              把 160+ 项检测打包成每年 $499 的单一会员，再叠加 AI 生成的纵向报告，等于在既有临床基础设施之上搭出消费订阅业务。B
              轮价格标签意味着，投资人主要是在为消费品牌和数据飞轮付钱，而不是为底层实验室科学付钱。
            calloutType: strength
            claimRefs:
              - CO002
              - CO003
              - CO007
              - CO024
              - CO033
          - type: callout
            title: 关键人风险与临床证据风险高度耦合
            body: |
              Mark Hyman 就是品牌。他也是美国最知名的功能医学从业者，这让 Function 异常暴露于两类相互关联的风险：一个是 Hyman 本人的媒体或健康事件，另一个是医学主流对功能医学的更广泛反弹。NYT
              Well 文章（Jan 2026）和 McGill OSS 批评（Jun 2025）显示反弹正在成形。以 $2.5B 估值入场的 B 轮投资人，本质上在押注 Function
              能在任何一只鞋落地之前，从「规模化 Hyman 诊所」转成可持续、有证据支撑的 AI 平台。
            calloutType: risk
