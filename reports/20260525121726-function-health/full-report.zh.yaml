  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买家画像
        blocks:
          - type: paragraph
            body: |
              Function Health 服务五类不同客户，买家画像、获客渠道和经济特征各不相同。核心 DTC 客群是
              30-55 岁的富裕城市专业人士，他们主动选择 $499/year 会员服务，用 160+ 项实验室生物标志物做
              主动健康监测。The Atlantic 和 Wired 都描述称，这一人群偏向家庭收入超过 $150K，集中在主要大都市。
              该客群构成 1 million 会员基数的大多数，但受促销折扣和推荐激励影响，收入很可能低于标价。

              高端健身客群来自 Equinox Optimize 合作（2024 年 5 月）：该合作把 Function Health 检测打包进
              $40,000/year 的长寿会员服务，内容包括私人训练、营养教练和综合实验室检测。这个高 ARPU 队列规模
              不大（受 Equinox 门店数量和极高价格限制），但验证了 Function Health 可作为嵌入式健康基础设施
              提供商，而不只是独立消费者 app。NBPA 合作（2025 年 2 月）把检测扩展到职业 NBA 球员，更多是品牌
              可信度动作，也可能成为更广泛运动健康合同的入口。企业买家通过 Thatch marketplace（2025 年 4 月）
              和 Thrive Global（2024 年 10 月）使用 Function Health，把实验室检测定位为雇主出资的健康福利。
              与 Sweetgreen（2026 年 1 月）和 Erewhon（2026 年 2 月）的联合营销合作，主要在健康生活方式相邻
              消费者中制造认知漏斗品牌曝光，而不是直接贡献订阅收入。
