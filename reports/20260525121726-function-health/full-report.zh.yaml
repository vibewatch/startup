      - number: '1.3'
        title: 里程碑、收购与合作延展
        blocks:
          - type: paragraph
            body: >
              Function Health 用两条线扩大业务表面：把会员嵌入其他高端消费者体验的项目化合作，以及给实验室检测核心新增模态的 M&A。合作线从 May 2024 Equinox 年费 $40,000
              的「Optimize」长寿项目开始，Function

              为这个高端健身房会员项目提供底层实验室检测层。2024–2026 的其他合作包括 Arianna Huffington 的 Thrive Global（在会员结果上叠加 AI 驱动教练，October
              2024）、GRAIL

              的 Galleri 多癌种早筛检测作为可选加购（December 2024）、National Basketball Players Association（为 NBA 球员做预防检测，February
              2025）、Thatch

              雇主福利市场（April 2025）、Sweetgreen 医生设计菜单联名（January 2026），以及 Erewhon 联名冰沙（February 2026）。「Long Live

              Moms」Mother's Day 2025 活动，以及 2025 年入选 TIME100 Most Influential Company、2024 年入选 Fast Company Most
              Innovative

              Company，都说明 Function 正在激进使用主流消费和生活方式渠道，而不是传统医疗渠道营销。


              M&A 线把 Function 从单一模态（抽血）会员推成了多模态预防平台。May 5, 2025 收购 Ezra——由 Emi Gal 创立的 AI 全身 MRI 扫描创业公司——让 Function

              获得了可直接对标 Neko Health 和 Prenuvo 的影像模态。April 9, 2026 收购 Getlabs 增加了移动 / 上门采血，把原本只靠 Quest 的采样网络转成 Quest

              加家庭的混合模型，显著扩大可触达客户（老年人、农村会员、拒绝去采血中心的忙碌高管）。两笔交易都降低高端会员的运营摩擦，也给 Function 一个更锋利的单位经济模型故事，讲给 B

              轮投资人听。但它们也抬高了整合复杂度：Function 现在运营的是多模态临床服务栈，而不是 Quest 之上的薄软件壳。


              因此，这条时间线很短但密度很高：创立（2021）、产品发布和种子轮（2022）、$6.5M 种子延伸轮和爬坡（2023）、A 轮以及 Equinox / Thrive

              合作（2024）、Ezra 收购和 TIME100 认可（2025）、B 轮和 Function Medical Intelligence 发布（late 2025）、Sweetgreen 与 Erewhon

              品牌时刻（early 2026），以及 Getlabs M&A（April 2026）。放在一起看——见下方 FO001——节奏更接近高速度消费品牌，而不是传统临床服务公司。
