        title: 扩张驱动因素与集中风险
        blocks:
          - type: paragraph
            body: |
              扩张收入潜力来自三条路径：高端附加服务（Galleri 多癌种检测、Ezra 全身 MRI）、新分销渠道（通过
              Thatch 进入企业 HR、NBPA 之外的运动员协会），以及推动漏斗顶部认知的联合营销合作（Sweetgreen、
              Erewhon）。Galleri 癌症筛查附加项和 Ezra MRI 创造了有意义的增购路径，可能提高活跃会员 ARPU，
              但使用率没有披露。Getlabs 收购（2026 年 4 月）加入上门采血这一便利性提升，可能降低因摩擦导致的
              流失。

              集中风险有两个维度。第一，客户获取高度依赖 Mark Hyman 的个人品牌——他的播客、媒体露面和功能医学
              思想领袖位置，是认知生成的核心。The Daily Beast 明确批评了这种品牌依赖。第二，Quest Diagnostics
              是唯一实验室履约伙伴，覆盖 2,000+ 个地点。Quest 一旦出现中断（价格争议、产能限制或战略方向变化），
              整个会员基数的服务交付会立刻受影响。目前没有公开提交的监管或消费者保护投诉，但 NPR、NYT 和
              Consumer Reports 对过度检测的批评，构成声誉风险，也可能演化为监管风险。
