          - type: callout
            title: 收购正在把薄软件壳改造成多模态诊所
            body: >
              Ezra（May 2025）增加 MRI；Getlabs（April 2026）增加上门采血；Function Medical Intelligence 发布（Nov 2025）增加垂直品牌化 AI

              层。两年前，Function 基本是 Quest 之上的消费 app
              外皮。今天，它已经是多模态预防诊所——相应的整合风险、监管暴露和运营复杂度也一起跃升。尽调应聚焦运营团队是否有足够深度，在这个规模上经营临床服务业务。
