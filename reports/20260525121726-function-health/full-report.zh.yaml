  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史与估值背景
        blocks:
          - type: paragraph
            body: |
              Function Health 在 2025 年 11 月完成 $298M Series B，投后估值 $2.5B，由 Redpoint Ventures 领投，
              现有投资者 a16z 和 Founders Fund 参投。此前公司在 2024 年 6 月完成 $53M Series A，投后估值 $191M——
              这意味着短短 17 个月估值跃升 13x，驱动力是收入从接近零增长到约 $100M ARR。累计融资约 $360M。本次跃升
              显著高于健康科技 Series A 到 B 常见的 2-4x 进阶，反映投资人对增长速度和品类领导位置的信心。Function
              Health 的资本效率比为 3.6x（累计融资 / ARR），对高增长消费者健康公司而言合理；但公司越过早期采用者之后，
              这种效率能否保持仍有待观察。$298M 按当前烧钱速度估计可提供 20-36 个月现金跑道，足以推动公司走向盈利或
              下一轮融资。1M+ 会员基数按 $499/year 可形成可观的经常性收入基础，但已确认 ARR 数字来自会员数和定价推导，
              而非经审计财务披露。
