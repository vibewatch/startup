      - number: '2.2'
        title: 规模测算视角、买方分群与支付意愿
        blocks:
          - type: paragraph
            body: |
              要给 Function 这个切片做可辩护的规模测算，至少需要 3 个独立视角。视角一是「美国实验室支出的消费者占比」——对 $98B 的 Grand View 基数套用 3-6%
              消费者自费占比，得到今天 $3-6B，其中很大一部分由 Quest 和 Labcorp DTC 捕获，而不是 Function。视角二是「仅 Function 式会员」——按 $500
              ARPU，触达 4-12M 名美国付费会员，对应 $2-6B 年度细分市场，这是本报告的基准情景。视角三是「高端长寿天花板」——Equinox $40K Optimize 会员和 Fountain
              Life 约 $25K / 年项目证明，一小片 HNW 人群愿意多付一个数量级，但该细分市场的会员上限在低个位数十万人。

              支撑这些测算的买方分群很清晰。主导的个人分群是大众富裕、关注健康的 25-55 岁人群——他们已经关注 Hyman、Attia、Means 或其他长寿媒体声音，也购买高端健身房会员、可穿戴设备和补充剂。其上是高端
              HNW 小群体（Equinox Optimize、Fountain Life 客户）。雇主福利分群真实存在，但仍在试验期——Thatch 和 Thrive Global 是渠道合作伙伴，主流 HR
              福利预算仍流向牙科、视力、EAP 和初级保健网络，而不是 Function。体育 / 娱乐分群（NBPA、运动员投资人）规模小，却对品牌不成比例重要。支付方覆盖今天基本为零，因为保险公司不报销宽泛预防面板。

              支付意愿图景同时解释了 Function 的速度和天花板。Equinox 证明一小片人愿意付 $40K。Function 证明更大一群人愿意付 $499。Everlywell
              的单次检测价格证明按项购买需求真实存在，但每户每年上限在几百美元。结构性洞察是 Function 的 $499 正好落在支付意愿的「默认」点：足以支撑一个真实产品，又低到能让一个听完
              Hyman 播客的活跃消费者冲动购买——这解释了为什么其他 DTC 实验室玩家正在复制这一模型。
