      - number: '1.4'
        title: 批评声量与披露姿态
        blocks:
          - type: paragraph
            body: >
              Function Health 快速进入主流，也伴随少量但在增长的怀疑报道。最突出的文章是 Kristen V. Brown January 8, 2026 在 New York Times

              Well 发表的文章，把 Function 描述为「自助血液检测」趋势的代表；文章转述了临床医生对假阳性、追踪边缘发现带来的下游成本，以及健康检测者焦虑的担忧。Angela Haupt December

              2024 在 TIME 的第一人称评测承认产品吸引力，但提醒宽面板会过度标记临床意义很小的生物标志物波动。McGill Office for Science and Society 的 Jonathan

              Jarry 在 June 2025 走得更远，认为 Function 所处的功能医学框架可能成为「通往另类医学的管道」——The Daily Beast 对 Mark Hyman 的长篇侧写也呼应了这一批评。


              Function 自己的披露姿态比营销话术更谨慎。FAQ 和 how-it-works 页面明确说明 Function 不是实验室，也不是医疗服务提供方；Quest
              执行检测，签约医生网络签发每一张检测单，并在结果抵达会员前审核每一个面板。这种定位对监管暴露很关键（Function

              围绕 HIPAA、州远程医疗实验室开单规则，以及即将落地的 FDA Laboratory Developed Tests 框架运营，而不是直接在 CLIA 之下），也影响用户预期——Function
              卖的是纵向会员体验和

              AI 介导的解读，不是初级保健关系。因此，投资人需要把消费者会员逻辑（经常性、低接触、品牌驱动）与临床服务逻辑分开看；后者毛利更薄、监管风险更高，而且严重依赖与 Quest 的关系。
