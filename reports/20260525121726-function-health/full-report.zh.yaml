          - type: callout
            title: 投资前必须独立验证 ARR
            body: 支撑 $2.5B 估值的 ~$100M ARR 主张尚未独立审计。有效 ARPU 约 ~$100，而标价为 $499，意味着促销定价很重。 任何投资者在投入资本前，都应要求经审计财务或数据室访问，以验证收入轨迹。
            calloutType: recommendation
