chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、领导层与创始故事
        blocks:
          - type: paragraph
            body: >
              Function Health 是一家私营、风投支持、直接面向消费者的预防健康会员公司，总部在 Austin, Texas，2021 年注册成立。公司以每年 $499 的价格出售 160+

              项临床实验室检测面板访问权，并把底层生物标志物数据接入由 AI 生成、医生审核的数字报告。会员被引导按固定节奏反复查看报告，而不是把它当作一次性诊断事件。产品定位是「掌控你的健康」，

              把预防性实验室检测包装成日常消费基础设施，类似 10 年前健身追踪器把步数变成基础健康指标。


              公司确认有 6 位联合创始人：Mark Hyman MD（首席医疗官和公众面孔）、Jonathan Swerdlin（CEO）、Daniel Swerdlin、Pranitha

              Patil（COO）、Mike Nemke 和 Seth Weisfeld。Hyman 是定义品牌的人物——New York Times 畅销功能医学作者、Cleveland Clinic

              Center for Functional Medicine 创始主任，也是公司被媒体引用最多的声音。这种中心性带来很强的需求生成杠杆，也集中关键人风险：任何关于 Hyman
              的负面健康新闻周期都会对品牌造成超比例冲击。

              Hyman 周围的运营团队——Swerdlin 兄弟和 Pranitha Patil——负责平台、增长和运营；这本身就是重要尽调问题，因为 Function 的市场进入叙事与 Hyman 的个人可信度绑定得太紧。


              Function 在官网披露，自己既不是临床实验室，也不是医疗服务提供方：Quest Diagnostics 执行检测，签约医生网络签发检测单并审核 AI
              报告呈现给会员的结果。这个披露决定了本报告其余部分的背景——它塑造了监管边界（Function

              围绕 HIPAA 和各州远程医疗实验室开单规则运营，而不是直接落在 CLIA 之下）、单位经济模型（Quest 是结构性的销售成本投入），也决定了护城河耐久性（检测菜单变化来自 Quest，而不是
              Function）。
