      - number: '7.4'
        title: 财务与竞争风险
        blocks:
          - type: paragraph
            body: |
              Function Health 以约 $100M ARR 拿到 $2.5B 投后估值，对应 25x 收入倍数——对订阅健康服务业务而言
              很激进，需要持续 50%+ 年增长才能自洽。披露的 ARR 没有经过独立审计；该数字来自新闻报道中的公司表述，
              形成信息不对称风险。有效 ARPU 约 ~$100，而标价为 $499，说明促销折扣很重；如果没有利润率压缩就难以
              持续，撤回促销价格可能触发流失加速。

              Forward Health 2024 年倒闭说明，即使有大量风险资本支持，资金充足的 DTC 健康订阅模型也会面临生死级
              单位经济风险。Rock Health 的 H2 2025 报告记录了 DTC 健康估值下降和全行业 CAC 上升。竞争压力来自
              多个方向：Hims & Hers（收入 $1B+）可以用更低价格推出重叠实验室功能；ACA 要求保险公司免费覆盖
              USPSTF A/B 评级的预防服务，与 Function Health 面板中的部分项目重叠。投资人集中依赖 a16z 和 Redpoint，
              意味着基金生命周期压力可能迫使过早退出。如果增速降到当前估值隐含轨迹之下，Series C 下轮融资估值下调
              风险很实质。
