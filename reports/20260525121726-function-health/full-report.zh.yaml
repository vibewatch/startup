companyProfile:
  summary: >
    Function Health 是成长阶段的 DTC 预防健康会员服务，把 Mark Hyman 的长寿医学品牌转成约 1M 会员和公司自报 $100M ARR，时间只用了约 3 年；November 2025，公司拿到
    Redpoint Ventures 领投的 $298M B 轮，投后估值 $2.5B。业务用轻资产模型运转：Quest 做实验室检测，Getlabs 做上门采血，Ezra 做 MRI 加购；其上叠一层 AI 摘要（「Function
    Medical Intelligence」）和签约医生小组。投资逻辑取决于几件事能否站住： 会员续费是否足够持久，尤其是在有效 ARPU 接近 $100、标价 $499 的张力下；临床叙事能否顶住 NYT Well、TIME
    和独立科学评论人的负面报道； 以及 25x ARR 倍数能否脱离明显低得多的上市 DTC 健康可比公司而成立。投资机会真实存在，但还不能直接承销；建议先观察，等单位经济模型、实验室开发检测的监管边界、FTC
    背书规则，以及第二轮负面媒体周期被市场消化后再判断。
  foundedDate: '2021-01-01'
  productSummary: >
    Function Health 销售 $499/年会员，每位会员每年可在 Quest Diagnostics 的 2,000+ 个患者服务中心完成两轮 160+ 生物标志物实验室面板检测， 并获得由 AI
    生成、签约医生小组审核的纵向报告（「Function Medical Intelligence」）。2025–2026 推出的加购项包括 GRAIL Galleri 多癌种早筛血液检测、通过 Ezra 子公司（May 2025
    收购）提供的 MRI 身体影像，以及通过 Getlabs 子公司（April 2026 收购）提供的上门采血。产品通过网页会员门户和 iOS app 交付。Function Health 不经营自己的临床实验室，依赖 Quest 的
    CLIA 认证实验室网络；FMI 被定位为咨询式摘要层，而不是受监管诊断设备。
