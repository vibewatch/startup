callouts:
  - calloutType: insight
    title: Function holds the only "$499 / yr, 160+ markers, AI report" bundle in mid-2026
    body: |
      No mainstream US competitor has matched Function's pricing-bundle combination as of mid-2026.
      Quest / Labcorp DTC are per-test, Lifeforce and Parsley are per-month at 3-5x annual cost,
      InsideTracker is per-panel, Thorne couples test and supplements, and the imaging-tier
      competitors are scan-only. That uniqueness explains the brand share-of-voice gap and the
      velocity to 1M members, and is the strongest near-term moat.
    claimRefs: [CP002, CP019, CP022]
  - calloutType: risk
    title: Single-supplier dependence on Quest is the structural moat-weakness
    body: |
      Function rents assays from Quest and resells them inside its subscription wrapper. Quest's own
      consumer line (QuestHealth / QuestDirect) is a structural competitor. Any Quest pricing
      decision, panel exclusivity move, or capacity-allocation change would materially affect
      Function's COGS, panel breadth, and ability to offer at-home draws via Quest mobile services.
      This is the single most important structural risk in the moat stack.
    claimRefs: [CP005, CP020, CP031]
  - calloutType: recommendation
    title: Track Hims & Hers and a possible Amazon / Apple bundling move as the two-year displacement scenarios
    body: |
      The most credible displacement scenarios are "below from telehealth" (Hims & Hers leveraging
      its GLP-1 base) and "above from hyperscaler" (Amazon One Medical + Pharmacy + DTC labs, or
      Apple Health bundling lab memberships). Both are plausible by 2028. Quarterly tracking of
      Hims Investor Relations releases, Amazon-One Medical product announcements, and any Apple
      Health roadmap signals is the highest-leverage competitive-intelligence ask.
    claimRefs: [CP016, CP026]
