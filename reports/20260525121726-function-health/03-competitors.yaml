company:
  name: Function Health
chapter:
  number: 3
  title: Competitors
  summary: |
    Function Health is the brand-share leader inside a crowded but structurally fragmented US
    preventive-lab category. Its principal competitor cohorts are (1) per-test DTC labs (Quest's
    QuestHealth / QuestDirect, Labcorp's OnDemand, Everlywell), (2) longevity-marketed single-panel
    or membership players (InsideTracker, Lifeforce, Thorne, Levels), (3) functional-medicine
    telehealth memberships (Parsley Health), (4) premium longevity clinics (Fountain Life, Forward,
    Equinox Optimize), and (5) imaging-led longevity brands (Neko Health, Prenuvo — partly absorbed
    by Function via Ezra). Function's combined edge is breadth-of-panel-for-the-price, Hyman-led
    brand share-of-voice, and a fast-improving AI report layer. Its principal weaknesses are
    dependence on Quest as the lab counterparty, contracted-MD overhead, and no first-party assay
    moat.
