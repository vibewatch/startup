sections:
  - id: cohorts
    title: Competitor cohorts and Function's position
    body: |
      Function's competitor set splits cleanly into five cohorts. The first is the per-test DTC lab
      cohort — Quest's QuestHealth / QuestDirect and Labcorp's OnDemand are the structural incumbents;
      Everlywell is the most-funded pure-play. The second is the longevity-marketed single-panel or
      membership cohort — InsideTracker (algorithmic single-panel), Lifeforce ($129 / month with a
      coach), Thorne (test + supplements), and Levels (CGM membership). The third is the
      functional-medicine telehealth membership cohort, anchored by Parsley Health ($199 / month).
      The fourth is the premium longevity clinic cohort — Fountain Life, the now-defunct Forward, and
      Equinox Optimize ($40K / year, which actually runs on Function's testing layer). The fifth is
      the imaging-led longevity brand cohort — Neko Health and Prenuvo, with Ezra now absorbed by
      Function.

      Function holds an unusual position because it is the only mainstream US player that bundles a
      broad annual panel (160+ markers, repeated draws), a contracted-MD order, an AI-generated
      report, and a single annual fee at the $499 mass-affluent price point. Quest and Labcorp DTC
      cover the per-test cash demand more cheaply but do not bundle. Lifeforce and Parsley charge
      ~$1,500-$2,400 / year for a different feature mix. InsideTracker prices per panel rather than
      per year. Premium clinics are an order of magnitude more expensive. Imaging-led brands
      complement rather than replace the lab layer. The result is that Function occupies the
      "default annual membership" slot — and as of mid-2026 no mainstream US competitor has matched
      that bundle directly.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP015, CP016, CP022]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: feature-and-pricing
    title: Feature matrix, pricing depth, and product-axis differentiators
    body: |
      A feature-by-feature matrix highlights where Function's bundle reaches further than competitors.
      Function lists 160+ biomarkers in a single membership, vs roughly 110 for InsideTracker's Ultimate
      panel, ~50 for typical Everlywell-style at-home kits, and a curated ~40-60 marker recurring
      panel for Lifeforce. Function pairs this with contracted-MD ordering, the Quest PSC network
      (2,000+ centres), a longitudinal app, Function Medical Intelligence (the AI report layer
      launched November 2025), MRI and Galleri add-ons, and an at-home draw option (from the April
      2026 Getlabs acquisition). InsideTracker has the longest history of algorithmic recommendations
      but no MD ordering. Lifeforce pairs a smaller panel with a human coach. Parsley pairs telehealth
      MD time with smaller labs. Quest / Labcorp DTC sell assays without the wrapper. Thorne couples
      tests with supplements. None bundle all dimensions at Function's price.

      The pricing depth picture is equally clear. Function's $499 / year is a unique price-bundle
      point: cheaper per-test than à-la-carte DTC for a 4+ panel-per-year member, and 3-5x cheaper
      than Lifeforce or Parsley on annual basis. The closest substitutes by economics are Quest
      QuestDirect (per-test, cheaper per test but no wrapper) and Equinox Optimize (which is a
      Function partner, not a competitor). The remaining product axes — AI report quality,
      turnaround time, app polish, longitudinal trending — are where Function still has gaps that
      competitors can target, and where Function Medical Intelligence is the active investment area.
    claimRefs: [CP002, CP003, CP004, CP005, CP006, CP010, CP011, CP013, CP014, CP015, CP022, CP023, CP024, CP025]
    tableRefs: [TP002, TP003]
    figureRefs: [FP002]
  - id: moat-and-risks
    title: Moat durability, displacement scenarios, and 2026 events
    body: |
      The moat-durability picture for Function is mixed. Brand and Hyman-led share-of-voice is the
      strongest near-term moat: TIME100, repeated Forbes / Fortune / TechCrunch / Modern Healthcare
      coverage, and the Sweetgreen / Erewhon / NBPA / Equinox partnerships produce a level of free
      reach that no other player in the cohort approaches. Distribution via the partner-channel
      stack is proprietary. Switching costs accumulate as the longitudinal record grows — moving a
      member to a competitor means giving up their multi-year trend. The data / AI layer
      (Function Medical Intelligence) is improving but not yet defensible IP. Supply via Quest is
      rented rather than owned — the single biggest structural weakness, because Quest itself
      runs a competing consumer line.

      Three displacement scenarios deserve attention. The first is "below from telehealth" — Hims &
      Hers leveraging its GLP-1 user base, mass-market brand, and primary-care telehealth flow to
      bundle a Function-style lab membership at a lower introductory price. The second is "above
      from hyperscaler" — Amazon (One Medical + Pharmacy + DTC labs) or Apple Health bundling lab
      memberships into a broader consumer-health membership. The third is the "physician-ordered
      targeted panel" pitch that any incumbent (Quest, Labcorp, or a hospital system) can run
      around the McGill / NYT critique of broad-panel false positives.

      The 2026 events worth noting are Function's own $298M Series B at $2.5B (Nov 2025, lead by
      Redpoint, with Function Medical Intelligence launched concurrently), Quest's continued
      QuestHealth expansion, Neko Health's US push, Function's April 2026 Getlabs acquisition, and
      the Sweetgreen and Erewhon collaborations. All directionally extend Function's lead in the
      mass-affluent membership cohort, while leaving the structural Quest-dependence and Hims-from-
      below risks intact.
    claimRefs: [CP008, CP009, CP012, CP013, CP016, CP017, CP018, CP019, CP020, CP021, CP026, CP027, CP028, CP029, CP030, CP031, CP032, CP033, CP034, CP035]
    tableRefs: [TP004]
    figureRefs: [FP003]
