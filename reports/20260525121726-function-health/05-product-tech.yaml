callouts:
  - calloutType: strength
    title: Asset-light lab model leverages Quest's existing clinical infrastructure
    body: |
      Function Health's structural advantage is that it does not need to build, certify, or
      operate laboratories. Quest Diagnostics provides 2,000+ CLIA-certified patient service
      centers, analytical validation, quality control, and regulatory compliance for all
      specimen processing. Function layers a consumer subscription, AI interpretation, and
      physician review on top, creating a high-margin software-like business on clinical
      infrastructure that already exists at scale. This model enabled rapid scaling to ~1M
      members without proportional capital expenditure on lab operations.
    claimRefs:
      - CE001
      - CE005
      - CE023
      - CE035
  - calloutType: risk
    title: FMI lacks published accuracy data and operates without FDA oversight
    body: |
      Function Medical Intelligence generates clinical health recommendations consumed by
      approximately 1 million members, yet no accuracy benchmarks, hallucination rates, or
      clinical validation data have been publicly disclosed. The system operates without FDA
      clearance under an advisory-tool classification that depends on maintaining physician
      review. AI hallucination in clinical contexts can produce harmful recommendations.
      The NYT reference-range critique and TIME over-treatment concerns suggest the risk
      is not theoretical. Diligence should prioritize obtaining internal FMI performance data.
    claimRefs:
      - CE004
      - CE013
      - CE014
      - CE024
  - calloutType: risk
    title: Single-vendor Quest dependency creates concentration risk
    body: |
      All specimen collection and laboratory analysis flows through Quest Diagnostics.
      Function Health has no backup lab partner, no independent CLIA certification, and
      no public contingency plan for Quest service disruption. A Quest API outage,
      pricing renegotiation, or competitive decision to launch a competing consumer
      product would directly threaten Function's core service delivery.
    claimRefs:
      - CE005
      - CE011
      - CE031
  - calloutType: insight
    title: Acquisitions are shifting the asset model from light to heavy
    body: |
      Ezra requires MRI hardware, facility leases, and a radiologist network. Getlabs
      requires licensed mobile phlebotomists and cold-chain logistics. These acquisitions
      convert Function from a pure software-and-brand play into an operating company with
      physical assets, clinical staff, and geographically constrained services. The
      resulting integration complexity and capital requirements are a meaningful departure
      from the original asset-light thesis.
    claimRefs:
      - CE006
      - CE007
      - CE022
  - calloutType: recommendation
    title: Require FMI clinical validation data before expanding AI autonomy
    body: |
      Before reducing physician oversight or expanding FMI's clinical scope, Function
      should commission independent clinical validation studies measuring accuracy,
      hallucination rate, and patient outcome impact. Publishing these results would
      address the primary credibility gap identified by medical critics and reduce
      regulatory risk as the FDA increases scrutiny of clinical AI tools.
    claimRefs:
      - CE004
      - CE013
      - CE024
      - CE025
