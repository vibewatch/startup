chapter:
  number: 5
  title: Product and Technology
  summary: |
    Function Health delivers a $499/year membership offering 160+ lab biomarkers processed through
    Quest Diagnostics' 2,000+ CLIA-certified patient service centers, layered with a proprietary
    AI summarizer (Function Medical Intelligence) and physician review. The platform has expanded
    beyond bloodwork via acquisitions of Ezra (full-body MRI) and Getlabs (at-home phlebotomy),
    plus a GRAIL Galleri multi-cancer screening add-on. The iOS app and web portal provide
    longitudinal tracking across semiannual testing cadences. Key technology risks include the
    absence of FDA clearance for FMI, AI hallucination potential in clinical summaries, and
    heavy operational dependence on Quest's lab infrastructure.
