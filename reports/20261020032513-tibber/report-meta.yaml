  topStrengths:
    - Broad household-energy product spanning tariffs, automation, charging, hardware, and grid flexibility.
    - Reported 2025 VPP and smart-charging activity indicates meaningful operating scale.
    - Public case evidence reports customer savings and substantial historical subscription growth.
  topRisks:
    - Current revenue, margins, working-capital needs, cash, burn, and runway are undisclosed.
    - Public evidence does not establish remediation of the reported 2024 customer-data exposure.
    - Realized customer value depends on market pricing, load shifting, and variable trading costs.
    - Device orchestration depends partly on external integration infrastructure across multiple markets.
  unresolvedGaps:
    - Obtain current audited revenue, gross margin, cash flow, working-capital, debt, burn, and runway data.
    - Verify the current cap table, share-class rights, liquidation preferences, and recent transaction terms.
    - Confirm current customer count, retention, churn, concentration, contract duration, and cohort economics.
    - Review the 2024 incident report, regulator correspondence, customer notifications, and remediation testing.
    - Reconcile current market-by-market tariffs, fees, flexibility revenue shares, and regulatory obligations.
