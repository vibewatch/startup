company:
  name: "Tibber"
chapter:
  number: 8
  title: "Valuation"
  summary: >-
    Tibber shows credible operating scale in residential flexibility, but the public
    evidence does not support a current equity value or risk-adjusted return case.
    The recommendation is research-more with high risk and an unknown valuation
    stance until current financials, financing terms, cap-table rights, and security
    remediation are verified.
sections:
  - id: "recommendation-and-thesis"
    title: "Recommendation and investment thesis"
    body: >-
      The decision is research-more, not buy. Tibber has a differentiated
      residential-energy model spanning electricity supply, hardware, automation,
      and flexibility-market income, while investor and partner sources describe
      rising customer adoption, a 33 million kW theoretical virtual-power-plant
      capacity at year-end 2025, and 27 million smart-charging sessions during
      2025. Those indicators establish product use and grid relevance, but they do
      not establish revenue quality, gross margin, cash generation, or an
      investable entry price. The anti-thesis is material: the latest visible
      valuation mark is old, the latest funding evidence is inconsistent across
      market-data sources, customer savings are partner-reported rather than
      independently audited, and a third-party breach database reports a 2024
      exposure involving 50,002 records. Entry should therefore remain contingent
      on primary financial, ownership, and security evidence rather than company
      quality alone.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV013, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: "financing-and-comparable-context"
    title: "Financing, valuation, and comparable context"
    body: >-
      Public financing evidence is insufficient for a current price. Tracxn reports
      $177 million raised across four rounds and identifies the March 2022 Series C
      as the latest round, while the investor announcement identifies Summa Equity
      as lead investor. Accumeo displays a SEK 7.0 billion post-money value and SEK
      872 share price for the Q1 2022 Series C, followed by a SEK 4.6 billion value
      for a Q1 2024 share issuance without a displayed share price. Accumeo also
      states that its round and valuation information comes from news media and
      public sources, so these marks are context, not proof of a current clearing
      price. Tracxn's named competitors provide a strategic screen, but no public
      trading multiple or transaction set in the assigned evidence is sufficiently
      comparable to produce a defensible present valuation range.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV014]
    tableRefs: [TV002]
  - id: "scenario-and-entry-discipline"
    title: "Scenario framework and entry discipline"
    body: >-
      Scenario analysis must be milestone-based because a revenue base, margin
      stack, cash balance, and fully diluted capitalization are unavailable. The
      bull case requires independently verified conversion of Tibber's device and
      charging scale into durable gross profit, plus a current financing price that
      leaves room for target returns after dilution. The base case treats the
      operating indicators as promising but requires audited cohort economics and
      security remediation before underwriting a multiple. The bear case is
      triggered by weak monetization of flexibility, renewed security failures,
      adverse financing terms, or a price anchored to the higher historical mark
      without commensurate financial progress. No scenario receives a numeric
      probability or valuation range because doing so would create false precision;
      the investable output is a set of evidence and price gates.
    claimRefs: [CV004, CV005, CV006, CV007, CV010, CV011, CV013, CV014, CV016]
    tableRefs: [TV003]
  - id: "exit-readiness-and-final-diligence"
    title: "Exit readiness and final diligence"
    body: >-
      Exit readiness is unproven. EquityZen presents Tibber as a private-company
      opportunity but withholds the current valuation, stock price, cap table,
      funding history by share class, and liquidity preferences behind investor
      access. Its generic exit routes are an IPO or acquisition distribution, or a
      later marketplace sale when eligible; neither demonstrates company-specific
      liquidity. Final diligence should obtain audited 2024-2026 statements,
      monthly gross-margin bridges by market and product, cash and working-capital
      needs, bad-debt performance, current fully diluted ownership, debt covenants,
      liquidation preferences, and all secondary or primary transactions since
      Q1 2024. It should also obtain an independent incident report and remediation
      evidence for the reported breach. The thesis breaks if these materials show
      structurally negative contribution economics, punitive senior rights,
      inadequate runway, or unresolved security-control failures.
    claimRefs: [CV008, CV010, CV011, CV013, CV014, CV015, CV016]
tables:
  - id: "TV001"
    title: "Recommendation summary"
    columns: ["Decision field", "Assessment", "Decision implication"]
    rows:
      - ["Recommendation", "Research more", "Do not underwrite an investment until primary financial, ownership, and security evidence is available."]
      - ["Confidence", "Medium on product evidence; low on price", "Treat operating indicators as diligence leads rather than valuation proof."]
      - ["Risk rating", "High", "Require security remediation, margin evidence, and financing-term review before advancing."]
      - ["Valuation stance", "Unknown", "The Q1 2024 SEK 4.6 billion mark is historical and not a current clearing price."]
      - ["Entry discipline", "Evidence- and price-gated", "Set a price only after fully diluted capitalization, preferences, debt, and target-return assumptions are verified."]
    notes: "Assessments use the assigned public evidence through 2026-10-20; no current priced round, audited financial model, or complete capitalization was publicly available."
    claimRefs: [CV010, CV011, CV013, CV014, CV015, CV016]
  - id: "TV002"
    title: "Thesis and anti-thesis"
    columns: ["Lens", "Evidence", "What would change the view"]
    rows:
      - ["Thesis", "A multi-product model can combine subscription fees, hardware, automation, and flexibility-market income.", "Audited segment gross profit and retention would confirm whether the model compounds economically."]
      - ["Thesis", "Investor reporting shows 33 million kW theoretical VPP capacity and 27 million smart-charging sessions in 2025.", "Independent measurement of active devices, dispatch revenue, and customer-level savings would strengthen the case."]
      - ["Anti-thesis", "The visible valuation marks are from 2022 and 2024, with no current public share price or primary transaction terms.", "A current cap table and executed financing or secondary documents would establish an investable price."]
      - ["Anti-thesis", "A third-party breach database reports 50,002 affected records from a 2024 incident.", "An independent forensic report, regulator correspondence, and control-remediation evidence would reduce security uncertainty."]
    notes: "Operating metrics are investor- or partner-reported; valuation marks are third-party market data and are not treated as audited or current transaction evidence."
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV010, CV011, CV013, CV014]
  - id: "TV003"
    title: "Bull, base, and bear scenario framework"
    columns: ["Case", "Required assumptions", "Valuation and return logic", "Key risks", "Probability signal"]
    rows:
      - ["Bull", "VPP and charging scale convert into verified recurring gross profit; security remediation is complete; financing terms are clean.", "Underwrite only at a price that supports the required return after dilution; no public range is defensible yet.", "Execution, regulatory incentives, and multiple compression.", "Unsupported until audited economics and a current term sheet are obtained."]
      - ["Base", "Product adoption persists, but monetization and cash conversion remain to be proven market by market.", "Use a conservative blended retail-and-software framework after segment margins and fully diluted shares are verified.", "Working capital, bad debt, hardware mix, and preference overhang.", "Most consistent with the mixed public record, but not assigned a numeric probability."]
      - ["Bear", "Flexibility revenue underperforms, security controls remain deficient, or new capital carries punitive senior rights.", "Reject an entry anchored to historical valuation marks; downside cannot be bounded without debt and preference terms.", "Down round, dilution, liquidity constraints, and customer trust damage.", "Triggered by failed diligence on economics, capitalization, runway, or breach remediation."]
    notes: "Scenarios intentionally omit numeric probabilities, valuation ranges, and target returns because current revenue, margin, cash, debt, and fully diluted capitalization are not public."
    claimRefs: [CV004, CV005, CV010, CV011, CV013, CV014, CV016]
figures:
