          value: "SEK 4.6bn Q1 2024 mark"
          detail: "Historical market-data context without a displayed current share price."
        - id: "risk-gates"
          label: "Risk gates"
          value: "Economics, terms, security"
          detail: "Audited margins, capitalization rights, and breach remediation remain unresolved."
        - id: "decision"
          label: "Decision"
          value: "Research more"
          detail: "High risk and unknown valuation until evidence and entry-price gates clear."
    approximationNotes: "Values retain source periods and qualifications; the ordered flow does not imply conversion rates or a numeric valuation."
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV010, CV011, CV013, CV015, CV016]
callouts:
  - calloutType: "recommendation"
    title: "Price discipline dominates the decision"
    body: >-
      A strong smart-energy product can still be a poor investment at the wrong
      price or under senior financing terms. Require a current, fully diluted
      capitalization and audited financial model before setting any entry value.
    claimRefs: [CV010, CV011, CV014, CV015, CV016]
  - calloutType: "risk"
    title: "Security evidence is a valuation input"
    body: >-
      The reported 2024 data exposure should affect risk, diligence scope, and
      required return until an independent forensic record confirms scope and
      remediation.
    claimRefs: [CV013, CV016]
