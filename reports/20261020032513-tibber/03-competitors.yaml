      - [Octopus Energy, "Direct digital-retail peer", Unknown, "European smart-tariff and EV households", "Smart tariffs, EV optimization, and smart-home management", "Only an illustrative SetterVC profile is available"]
      - [Rabot Energy, "Direct dynamic-tariff peer", Unknown, "German dynamic-tariff households", "Hourly spot pricing and smart-home optimization", "Only an illustrative SetterVC profile is available"]
      - [1KOMMA5, "Vertically integrated adjacent/direct peer", Unknown, "DACH home-electrification buyers", "Solar, heat pumps, EV charging, tariff, and energy manager bundle", "Only an illustrative SetterVC profile is available"]
      - [Ostrom, "Direct digital-retail peer", Unknown, "German digital-first green-energy households", "App-based dynamic and green electricity tariffs", "Only an illustrative SetterVC profile is available"]
      - ["Incumbent utility, OEM app, or manual control", "Status quo and internal-build substitutes", "Not applicable", "Households or utilities unwilling to adopt a new retail platform", "Existing supplier relationship or device-native controls", "Inferred alternative class; no comparative performance data in the pool"]
    notes: >-
      Competitor descriptions come from SetterVC's expressly illustrative list; its
      scale and funding figures are estimates that may be incomplete, stale,
      erroneous, or revised. Unknown means the assigned evidence did not disclose a
      comparable figure, not that the competitor has none.
