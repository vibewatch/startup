  evidenceGaps:
    - type: missing-source
      severity: material
      topic: competitive-benchmarking
      missingEvidence: Current like-for-like tariffs, realized discounts, contract terms, market shares, and retention for Tibber and each named direct peer.
      whyItMatters: Without comparable commercial data, neither price leadership nor durable customer lock-in can be underwritten.
      diligencePath: Obtain dated tariff sheets by market, cohort retention data, win-loss records, and customer bills normalized for taxes and grid fees.
      relatedQuestionRefs: [QP003, QP005, QP007, QP008]
      relatedTableRefs: [TP001, TP003]
    - type: missing-source
      severity: material
      topic: security-trust
      missingEvidence: An official Tibber notice, regulator record, or second independent source confirming the 2024 breach scope and remediation.
      whyItMatters: A single commercial breach database is insufficient to establish incident scope or residual customer-trust risk.
      diligencePath: Request the incident report and regulator correspondence, then verify affected fields, notification count, root cause, and remediation.
      relatedQuestionRefs: [QP006]
