schemaVersion: "report-v2"
artifact: competitors
slug: tibber
runDate: 2026-10-20
company:
  name: Tibber
chapter:
  number: 3
  title: Competitors
  summary: >-
    Tibber competes in a crowded overlap of dynamic electricity retail, household
    energy software, connected-device orchestration, and emerging grid services.
    Its broad integration layer is the clearest visible differentiator, but public
    evidence does not establish exclusive distribution, durable lock-in, or a
    like-for-like price advantage over direct peers.
sections:
  - id: competitive-landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      Tibber is not competing only with another electricity retailer. The relevant
      set includes digital tariff peers, vertically integrated home-electrification
      vendors, incumbent utilities, device-manufacturer apps, manual scheduling,
      and utility-built orchestration. SetterVC's illustrative list identifies
      Octopus Energy, Rabot Energy, 1KOMMA5, and Ostrom as named European rivals,
      while its own warning says the list may be incomplete, stale, or erroneous.
      The useful distinction is therefore strategic rather than exhaustive:
      Octopus and Rabot overlap most directly in smart tariffs, 1KOMMA5 competes
      through a broader hardware-and-energy bundle, and Ostrom targets the
      digital-first green-tariff buyer. Conventional supply plus manual control is
      a weaker experience but remains a low-switching-cost status quo wherever
      automation savings are uncertain.
    claimRefs: [CP002, CP003, CP015]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-distribution
    title: Capability breadth and distribution power
    body: >-
      Public descriptions consistently place Tibber at the intersection of spot
      electricity, app analytics, and control of EVs, heat pumps, solar equipment,
      and other connected devices. Energify reports more than 45 integrations,
      while Enode says it operates a selected part of the connectivity layer within
      Tibber's broader platform. That supplier relationship can accelerate device
      coverage, but it also means not every integration is proprietary. Competitor
      descriptions show that EV optimization and app-based dynamic tariffs are
      already available elsewhere, while 1KOMMA5 bundles solar, heat pumps, EV
      charging, and an energy manager. Breadth is an advantage; the available
      evidence does not show that breadth is exclusive or inaccessible to a
      well-funded retailer, hardware vendor, or software partner.
    claimRefs: [CP001, CP003, CP010, CP012, CP013, CP015]
    tableRefs: [TP002]
  - id: pricing-and-switching
    title: Pricing, packaging, and switching friction
    body: >-
      The only sufficiently specific current price in the assigned evidence is
      Energify's Swedish listing: a fixed markup of 6 öre per kWh excluding VAT,
      plus variable certificate, balancing, and trading costs. Energify also labels
      the plan as having no lock-in, which lowers contractual friction for adoption
      but also weakens retention as a moat. Comparable public prices, realized
      discounts, and contract terms for Octopus, Rabot, 1KOMMA5, and Ostrom are not
      available in this evidence set, so a price-winner conclusion would be false
      precision. Switching costs appear more behavioral and technical than
      contractual: configured automations and connected devices may create
      convenience, but open interfaces and supplier-supported interoperability can
      also make multi-homing or provider substitution easier.
    claimRefs: [CP009, CP011, CP012, CP013, CP016]
    tableRefs: [TP003]
  - id: moat-and-displacement-risk
    title: Moat durability and displacement risk
    body: >-
      Tibber's defensibility depends on coordinating devices reliably and converting
      that installed connectivity into customer savings and grid value faster than
      rivals can copy the bundle. Enode's case study supports the orchestration
      thesis, but as a supplier-issued account it is not an independent benchmark.
      Historical customer and funding claims indicate capacity to invest, yet they
      do not prove current share, retention, or superior unit economics. The adverse
      record also matters: Heroic reports a 2024 database breach affecting 50,002
      records and exposing names, email addresses, and usernames, while reporting
      that passwords were not exposed. With no corroborating incident source in the
      assigned pool, that allegation should be treated as a specific diligence lead,
      not a settled operational conclusion. Overall, ecosystem execution is a
      plausible moat, but commoditization and trust risks remain material.
    claimRefs: [CP005, CP006, CP007, CP008, CP012, CP014, CP015, CP016]
