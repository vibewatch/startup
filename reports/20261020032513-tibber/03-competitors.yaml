    title: Evidence-bounded capability matrix
    columns:
      - Buying criterion
      - Tibber
      - Octopus Energy
      - Rabot Energy
      - 1KOMMA5
      - Ostrom
    rows:
      - ["Dynamic or spot-linked electricity", "Yes; quarter-hourly spot pricing reported", "Smart tariffs reported", "Hourly spot pricing reported", "Dynamic tariff reported", "Dynamic tariff reported"]
      - ["App analytics or digital control", "Yes; real-time analytics reported", "Smart-home management reported", "Smart-home optimization reported", "Energy manager reported", "App-based offer reported"]
      - ["EV charging optimization", "Yes; connected EV and smart charging described", "Yes; EV optimization described", Unknown, "EV charging bundle described", Unknown]
      - ["Heat pump, solar, or battery orchestration", "Heat pump and solar integrations reported; broader device orchestration described", Unknown, Unknown, "Solar and heat-pump bundle described", Unknown]
      - ["Hardware commerce or bundled installation", "Online smart-device store historically reported", Unknown, Unknown, "Vertically integrated hardware bundle described", Unknown]
      - ["Grid services or VPP direction", "VPP and grid-services capability described", Unknown, Unknown, Unknown, Unknown]
    notes: >-
      Cells report only capabilities explicitly described in the assigned sources;
      Unknown means unsupported by this evidence set. Competitor cells rely on one
      illustrative database profile and are not independent product benchmarks.
    claimRefs: [CP001, CP003, CP010, CP012, CP013]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Alternative
      - Public price or contract model
      - Included capability
      - Discount or unknown
      - Competitive implication
    rows:
      - [Tibber Sweden, "6 öre/kWh fixed markup excluding VAT, plus variable trading costs", "Quarter-hourly pricing, app, and 45+ integrations", "Realized bill, discounts, and variable-cost level unknown", "Transparent list structure, but not proof of lowest total bill"]
      - [Octopus Energy, Unknown, "Smart tariffs, EV optimization, smart-home management", "Price, discount, and contract term unknown", "Capability overlap prevents differentiation by tariff concept alone"]
      - [Rabot Energy, Unknown, "Hourly spot pricing and home optimization", "Price, discount, and contract term unknown", "Direct overlap in Germany raises price pressure"]
      - [1KOMMA5, Unknown, "Tariff plus solar, heat pumps, EV charging, and manager", "Bundle economics and discount unknown", "Broader bundle can shift comparison from tariff to whole-home economics"]
      - [Ostrom, Unknown, "App-based dynamic and green electricity", "Price, discount, and contract term unknown", "Digital-first positioning is not unique to Tibber"]
      - ["Status quo or OEM apps", "Existing utility tariff and device-native software", "Manual or single-device optimization", "Incremental cost and foregone savings unknown", "Low adoption effort can outweigh a richer platform for mainstream users"]
    notes: >-
      Tibber's quoted price is a Swedish list-price description from Energify, not a
      realized customer bill or cross-market price. No like-for-like competitor
      prices were available in the assigned pool; unknown cells are intentional.
    claimRefs: [CP009, CP010, CP011, CP016]
figures:
  - id: FP001
    title: Competitive positioning — ecosystem breadth (X) versus dynamic-retail integration (Y)
    type: quadrant
    summary: >-
      Evidence-backed ordinal placement shows Tibber and 1KOMMA5 as broader bundles,
      while Octopus and Rabot overlap strongly on dynamic retail.
    data:
      points:
        - label: Tibber
          x: 5
          y: 5
          detail: "Broad device integrations combined with quarter-hourly electricity and grid-services direction."
        - label: Octopus Energy
          x: 4
          y: 5
          detail: "Smart tariffs, EV optimization, and smart-home management in the available profile."
        - label: Rabot Energy
          x: 2
          y: 5
          detail: "Hourly spot pricing and smart-home optimization, with broader scope unverified."
        - label: 1KOMMA5
          x: 5
          y: 4
          detail: "Broad solar, heat-pump, EV-charging, tariff, and energy-manager bundle."
        - label: Ostrom
          x: 2
          y: 4
          detail: "App-based dynamic and green tariff, with broader orchestration unverified."
        - label: "Status quo / OEM apps"
          x: 1
          y: 1
          detail: "Existing supplier relationship or single-device controls without a verified integrated platform."
    approximationNotes: >-
      Ordinal 1–5 scores are analyst classifications of capabilities disclosed in
      the assigned sources, not market share, product quality, or measured customer
      outcomes. Unsupported capabilities are not scored as present.
    claimRefs: [CP001, CP003, CP013, CP015]
callouts:
  - calloutType: insight
    title: Breadth is useful, not yet exclusive
    body: >-
      Tibber's integration breadth can improve the household experience, but the
      available evidence also shows overlapping tariffs, device control, and bundled
      electrification from several rivals.
    claimRefs: [CP001, CP003, CP010, CP012, CP015]
  - calloutType: risk
    title: Trust evidence needs independent confirmation
    body: >-
      Heroic's breach record is a concrete adverse signal, but the assigned pool
      contains no regulator notice or second independent report confirming the
      incident scope.
    claimRefs: [CP014]
