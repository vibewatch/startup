schemaVersion: "report-v2"
artifact: customers
slug: tibber
runDate: 2026-10-20
company:
  name: Tibber
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence supports meaningful household adoption across electricity supply,
    connected-device automation, and residential flexibility, with quantified but
    selectively reported customer outcomes. It does not disclose current customer
    count, retention, churn, contracts, concentration, or named end-customer references,
    so durability remains materially under-evidenced.
sections:
  - id: customer-segments
    title: Household buyers broaden into connected-energy participants
    body: >-
      Tibber's publicly visible base begins with households buying electricity and using
      an app to monitor consumption, but the user surface extends to EV owners, smart-home
      users, battery and solar owners, and households participating in grid flexibility.
      AWS historically described electricity customers in Norway, Sweden, and Germany,
      while a current comparison page positions the offer for tech-savvy and active
      electricity users with EVs, heat pumps, solar installations, and smart-home devices.
      Enode describes device connection and price-aware automation as core customer
      behaviors. The evidence therefore points to a consumer payer, multiple household
      users, and grid operators as an indirect flexibility payer, rather than one
      homogeneous electricity-retail segment. The segmentation is strategically useful,
      but none of these sources discloses revenue or margin by segment.
    claimRefs: [CU001, CU003, CU011, CU016]
    tableRefs: [TU001]
  - id: adoption-and-outcomes
    title: Adoption is real, but the strongest scale evidence is dated or selective
    body: >-
      Multiple sources show that Tibber reached material operating scale, although their
      periods and denominators are not comparable. Balderton's investor announcement says
      subscriptions increased from 120,000 to more than 400,000 during 2021. AWS separately
      reported that customer numbers and IoT-device sales were doubling every six months
      and that 33 billion IoT messages moved through the platform in May 2021. More recent
      company material claims access to hundreds of thousands of household devices and
      reports 137,000 MWh processed over one year, including 25,000 MWh shifted. These
      figures demonstrate activity, not a current customer total or retention. Outcome
      evidence is similarly selective: Enode reports top-quartile Smart Charging and Grid
      Rewards cohorts, while AWS repeats Tibber's historical estimate of average bill
      savings. Neither source provides a full-customer denominator or controlled comparison.
    claimRefs: [CU002, CU004, CU005, CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002]
  - id: proof-and-expansion
    title: Device connectivity creates an expansion path, not yet a proven retention curve
    body: >-
      The public record supports a plausible land-and-expand motion from electricity supply
      to device connection, automated charging, rewards, and multi-asset orchestration.
      Enode says it operates a selected portion of Tibber's connectivity layer, which can
      broaden device coverage but also creates a partner dependency. Tibber's own VPP
      narrative adds Grid Rewards as a recurring engagement and monetization mechanism.
      However, the retained sources identify customer cohorts rather than named individual
      or organizational customers, and they do not distinguish pilots from long-lived
      production relationships. The journey figure is consequently an evidence synthesis,
      not a measured funnel: no public conversion rates, step timing, cohort retention, or
      expansion revenue are available. Those omissions prevent a firm conclusion that
      connected-device engagement translates into durable economics.
    claimRefs: [CU007, CU013, CU015, CU016]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-and-trust
    title: Durability and concentration remain the decisive diligence gaps
    body: >-
      No retained source reports NRR, GRR, churn, renewal rates, contract duration,
      satisfaction, cohort retention, top-customer exposure, or customer concentration by
      market. This is especially important because household electricity retail can be
      sensitive to pricing, service reliability, trust, and switching friction. Heroic
      independently reports a November 2024 database breach involving 50,002 records and
      names, email addresses, and usernames; the report says passwords were not exposed,
      but no second retained source corroborates the incident or its remediation. The
      breach evidence therefore identifies a customer-trust risk without establishing its
      impact on churn. Investment diligence should request current cohort data by country
      and product, named references, incident remediation evidence, and revenue
      concentration before treating adoption scale as durable customer quality.
    claimRefs: [CU012, CU014, CU015]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Public scale signal
      - Strategic value
      - Evidence gap
    rows:
      - - Electricity-plan households
        - Household bill payer; household members use the app
        - Dynamic-price supply, usage visibility, and bill management
        - Historically served households in Norway, Sweden, and Germany
        - Entry relationship and recurring household engagement
        - Current customers, revenue, margin, and churn by country are undisclosed
      - - EV and charger owners
        - Household payer; driver is the daily user
        - Price-aware Smart Charging and Grid Rewards
        - Top-quartile outcome examples are reported for the Netherlands and Sweden
        - Frequent automation and an initial flexibility asset
        - Full-cohort adoption, savings distribution, and retention are unavailable
      - - Multi-asset smart homes
        - Household asset owner and app user
        - Coordinate batteries, solar, heat pumps, EVs, and chargers
        - Tibber claims access to hundreds of thousands of household devices
        - Cross-sell and broader flexibility capacity
        - Active homes, attached devices per home, and expansion revenue are unavailable
      - - Grid and flexibility counterparties
        - Grid operator pays Tibber; participating household receives rewards
        - Balance the grid through aggregated residential flexibility
        - Tibber reports 137,000 MWh processed in one year
        - Adds a non-retail monetization path and customer rewards
        - Counterparty mix, take rate, and household reward retention are unavailable
    notes: >-
      Segments synthesize Enode, AWS, Tibber, and Energify descriptions; scale signals
      have different periods and denominators and are not additive.
    claimRefs: [CU001, CU003, CU007, CU008, CU011, CU016]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Reported value
      - Period
      - Source / confidence
      - Implication
      - Missing denominator or caveat
    rows:
      - - Customer subscriptions
        - 120,000 to more than 400,000
        - During 2021
        - Balderton investor announcement / medium
        - Demonstrates rapid historical customer acquisition
        - No current total, market split, cohort definition, or retention
      - - Customer and IoT-device sales growth
        - Doubling every six months
        - Historical AWS case-study period
        - AWS partner case study / medium
        - Indicates early growth across accounts and hardware
        - Start and end counts, exact measurement window, and persistence are absent
      - - Platform activity
        - More than 33 billion AWS IoT Core messages
        - May 2021
        - AWS partner case study / medium
        - Confirms substantial device-data throughput
        - Messages are not customers, active homes, or retained accounts
      - - Residential flexibility activity
        - 137,000 MWh processed; 25,000 MWh shifted
        - One year, ending date not stated in fetched text
        - Tibber company claim / medium
        - Shows operational VPP participation
        - No customer count, device count, geography mix, or independent verification
      - - Smart Charging and Grid Rewards outcomes
        - Up to EUR 821 annual savings in the Netherlands; 50% cheaper charging in Sweden
        - Reporting period not stated in fetched text
        - Enode partner report / medium
        - Provides customer-value evidence for engaged users
        - Both figures cover the top 25% using both features, not the full customer base
    notes: >-
      Values retain each source's metric, period, and denominator; customer, device,
      message, energy, and savings measures are not a common funnel and must not be summed.
    claimRefs: [CU002, CU005, CU006, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / cohort
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - - Netherlands top-quartile Smart Charging and Grid Rewards users
        - EV-owning households
        - Automated charging plus grid-balancing rewards
        - Production use is implied; pilot status is not stated
        - Up to EUR 821 savings per year
        - Partner-reported top-quartile cohort; no sample size or period
      - - Sweden top-quartile Smart Charging and Grid Rewards users
        - EV-owning households
        - Automated charging plus grid-balancing rewards
        - Production use is implied; pilot status is not stated
        - 50% cheaper charging
        - Partner-reported top-quartile cohort; no sample size or period
      - - Norway, Sweden, and Germany electricity households
        - Electricity-plan households
        - Dynamic supply, app monitoring, and connected-home control
        - AWS described an operating service, not a pilot
        - Tibber estimated 20% average bill savings versus previous providers
        - Historical partner case study; no named household, cohort size, or methodology
    notes: >-
      Public sources provide cohorts rather than named end customers; production labels
      reflect source wording and are not independently verified customer references.
    enumerationScope:
      coverage: sample
      basis: >-
        Publicly described customer cohorts and operating markets in the retained source
        set, not a complete customer roster or reference-customer census.
    claimRefs: [CU002, CU003, CU004, CU015]
figures:
  - id: FU001
    title: Customer journey from electricity supply to residential flexibility
    type: journey-map
    summary: >-
      The public evidence implies a six-stage expansion path, but does not provide
      conversion, timing, retention, or revenue metrics between stages.
    data:
      nodes:
        - label: Join electricity plan
          stage: Acquire
          detail: Household starts with dynamic-price electricity and app-based visibility.
          touchpoints:
            - Electricity offer
            - Tibber app
        - label: Connect first device
          stage: Activate
          detail: Household links an EV, charger, meter, thermostat, heat pump, or solar asset.
          touchpoints:
            - Device integration
            - Real-time consumption data
        - label: Automate consumption
          stage: Engage
          detail: Smart Charging or heating shifts usage toward lower-price periods.
          touchpoints:
            - Automation
            - Price signals
        - label: Earn Grid Rewards
          stage: Monetize flexibility
          detail: Participating devices support grid balancing and the household receives rewards.
          touchpoints:
            - Flexibility event
            - Customer reward
        - label: Add household assets
          stage: Expand
          detail: Additional EV, battery, solar, or heat-pump assets widen controllable load.
          touchpoints:
            - Cross-device coverage
            - Multi-asset coordination
        - label: Participate as a flexible home
          stage: Retain and deepen
          detail: Coordinated assets form part of Tibber's residential VPP proposition.
          touchpoints:
            - Residential VPP
            - Grid services
    approximationNotes: >-
      This is an analyst synthesis of described use cases, not a measured funnel; node
      order does not imply observed conversion, retention, timing, or proportional value.
    claimRefs: [CU001, CU007, CU013, CU016]
callouts:
  - calloutType: insight
    title: Expansion thesis
    body: >-
      Device integration and Grid Rewards can deepen engagement beyond commodity
      electricity supply, but public sources do not quantify conversion or expansion revenue.
    claimRefs: [CU002, CU013, CU016]
  - calloutType: risk
    title: Adoption is not retention
    body: >-
      Historical customer growth and current device activity cannot substitute for
      cohort retention, churn, concentration, or trust-remediation evidence.
    claimRefs: [CU005, CU009, CU012, CU014]
