    approximationNotes: >-
      The last four entries are evidence access-date checkpoints, not asserted product launch
      dates. The retained Series C source omitted a publication date, so that financing is
      not placed on the timeline.
    claimRefs: [CO002, CO005, CO008, CO009, CO010, CO011, CO012, CO013]
callouts:
  - calloutType: risk
    title: Reported 2024 data exposure requires corroboration
    body: >-
      Heroic reports 50,002 exposed customer records containing names, email addresses, and
      usernames. Treat the incident as a material diligence lead, not a fully verified loss
      estimate: the assigned pool contains no company notice, regulator decision, forensic
      report, or remediation evidence.
    claimRefs: [CO013]
  - calloutType: insight
    title: Device connectivity is both product proof and dependency
    body: >-
      Enode's account and the independent Home Assistant documentation show that Tibber's
      proposition extends into household device orchestration. They also create a diligence
      question around third-party integration reliability, data permissions, and operational
      ownership across the stack.
    claimRefs: [CO011, CO012]
