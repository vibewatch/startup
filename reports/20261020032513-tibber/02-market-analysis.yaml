callouts:
  - calloutType: "risk"
    title: "Do not capitalize an unsupported broad TAM"
    body: >-
      The relevant underwriting question is how many households can be activated
      and monetized through service fees, devices, and flexibility in Tibber's
      live markets, not the gross value of European electricity consumption.
    claimRefs:
      - "CM002"
      - "CM015"
