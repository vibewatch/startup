  evidenceGaps:
    - type: "missing-source"
      severity: "material"
      topic: "market-sizing"
      missingEvidence: >-
        Current country-level counts for eligible households, dynamic-tariff
        adoption, compatible energy assets, activated Tibber users, flexible MW,
        and monetization rates.
      whyItMatters: >-
        These denominators are required to derive a defensible bottom-up TAM,
        SAM, and SOM without using gross European electricity spend.
      diligencePath: >-
        Obtain country operating dashboards and construct a cohort model using
        regulator tariff data, device-installation data, activation rates, and
        contracted flexibility economics.
      relatedQuestionRefs:
        - "QM002"
      relatedTableRefs:
        - "TM002"
    - type: "private-evidence-only"
      severity: "material"
      topic: "buyer-economics"
      missingEvidence: >-
        Country- and cohort-level acquisition, activation, retention, realized
        savings, and willingness-to-pay data segmented by device type.
      whyItMatters: >-
        Partner examples cannot establish whether savings and engagement extend
        to the median household or support durable customer economics.
      diligencePath: >-
        Review anonymized cohorts and independently recompute savings against
        fixed-rate and manual-control counterfactuals.
    - type: "missing-source"
      severity: "material"
      topic: "flexibility-economics"
      missingEvidence: >-
        Current flexible capacity, market participation by country, gross grid
        revenue, household reward share, and Tibber take rate.
      whyItMatters: >-
        Flexibility is a distinct value pool in the market thesis but cannot be
        valued from device connectivity alone.
      diligencePath: >-
        Inspect grid-service contracts, settlement statements, eligible-device
        counts, dispatch performance, and revenue-sharing terms by market.
