chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Tibber presents itself as a digital energy company rather than a conventional consumption-led utility. Its
              current website describes a household energy ecosystem that connects high-load assets such as cars and
              heating to an app, supports regional fixed and 15-minute dynamic tariffs, automates consumption against
              prices, and pays users for brief charging adjustments through Grid Rewards. Third-party profiles date the
              company to 2016, while EquityZen describes it as a private, pre-IPO business. The model is broader than
              electricity resale: software, device integrations, and a store are part of the proposition. The retained
              evidence does not verify a current headquarters city or a precise present financing stage beyond the
              documented Series C.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO010
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO009
              - CO010
              - CO015
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The founder core remains the clearest public leadership signal. Tibber's own page names Daniel Linden and
              Edgeir Vardal Aksnes as founders and says both brought energy industry experience. Balderton identifies
              Aksnes as co-founder and chief executive, while EquityZen identifies Linden as co-founder and chief
              product officer. That combination suggests founder coverage across commercial leadership and product, but
              the evidence set does not disclose a current board roster, committee structure, ownership control,
              succession arrangements, or material leadership changes. The resulting key-person risk cannot be
              quantified from public evidence and should be resolved through board materials, an organization chart, and
              management references.
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.3'
        title: Financing and stakeholders
        blocks:
          - type: paragraph
            body: >-
              Balderton's announcement identifies a $100 million Series C led by Summa Equity, with Balderton, Eight
              Roads, and Schibsted Ventures described as existing investors; it also records Balderton's earlier
              November 2020 investment. EquityZen separately lists Summa, Schibsted, Altor Equity Partners, Eviny
              Ventures, and Nordea Bank as notable investors. These issuer relationships matter: Balderton is an
              investor and EquityZen is a private-marketplace operator, so neither source is treated as independent
              proof of valuation or financing terms. No allocated source discloses the current fully diluted cap table,
              preference stack, debt, secondaries, total capital raised, or a current priced valuation.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO016
      - number: '1.4'
        title: Scale, operating milestones, and risk
        blocks:
          - type: paragraph
            body: >-
              The strongest scale disclosure is historical: Balderton reported subscriptions increasing from 120,000 to
              more than 400,000 during 2021. Current operating evidence is qualitative rather than corporate-scale
              reporting. Enode says it operates a selected integration layer for Tibber, and Home Assistant documents
              live price, consumption, cost, peak, production, storage, and charging interfaces. On the adverse side,
              Heroic reports that 50,002 customer records containing names, email addresses, and usernames were exposed
              in December 2024; this is a single commercial breach database and needs regulator or company
              corroboration. A nominal 2026 Wipick review was unusable because the fetched text contained only its
