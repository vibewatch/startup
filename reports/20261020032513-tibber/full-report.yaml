  - id: FU001
    title: Customer journey from electricity supply to residential flexibility
    type: journey-map
    summary: >-
      The public evidence implies a six-stage expansion path, but does not provide conversion, timing, retention, or
      revenue metrics between stages.
    data:
      nodes:
        - label: Join electricity plan
          stage: Acquire
          detail: Household starts with dynamic-price electricity and app-based visibility.
          touchpoints:
            - Electricity offer
            - Tibber app
        - label: Connect first device
          stage: Activate
          detail: Household links an EV, charger, meter, thermostat, heat pump, or solar asset.
          touchpoints:
            - Device integration
            - Real-time consumption data
        - label: Automate consumption
          stage: Engage
          detail: Smart Charging or heating shifts usage toward lower-price periods.
          touchpoints:
            - Automation
            - Price signals
        - label: Earn Grid Rewards
          stage: Monetize flexibility
          detail: Participating devices support grid balancing and the household receives rewards.
          touchpoints:
            - Flexibility event
            - Customer reward
        - label: Add household assets
          stage: Expand
          detail: Additional EV, battery, solar, or heat-pump assets widen controllable load.
          touchpoints:
            - Cross-device coverage
            - Multi-asset coordination
        - label: Participate as a flexible home
          stage: Retain and deepen
          detail: Coordinated assets form part of Tibber's residential VPP proposition.
          touchpoints:
            - Residential VPP
            - Grid services
    approximationNotes: >-
      This is an analyst synthesis of described use cases, not a measured funnel; node order does not imply observed
      conversion, retention, timing, or proportional value.
    claimRefs:
      - CU001
      - CU007
      - CU013
      - CU016
  - id: FR001
    title: Residual risk and mitigation-evidence matrix
    type: matrix
    summary: >-
      Qualitative heatmap of downside impact, evidence for likelihood, and publicly visible mitigation maturity; it does
      not assign quantitative probabilities.
    data:
      columns:
        - label: Impact
          detail: Potential downside if the risk materializes
        - label: Likelihood evidence
          detail: Strength of the assigned public evidence
        - label: Mitigation maturity
          detail: Publicly visible controls or fallback evidence
      rows:
        - label: Customer-data exposure
          note: One adverse breach-index report, without authoritative confirmation
          values:
            - label: High
              tone: high
              detail: Customer harm and regulatory consequences are plausible if confirmed
            - label: Limited
              tone: warning
              detail: The source is low reputation and uncorroborated in the assigned pool
            - label: Unknown
              tone: risk
              detail: No incident report or remediation audit was available
        - label: Multi-market compliance
          note: Public sources disagree on the current country footprint
          values:
            - label: High
              tone: high
              detail: Electricity retail is jurisdiction-specific
            - label: Moderate
              tone: warning
              detail: Multi-country activity is visible but license status is not
            - label: Unknown
              tone: risk
              detail: No current license inventory or regulator record was assigned
        - label: App and billing continuity
          note: One app surface covers prices, consumption, contracts, invoices, and devices
          values:
            - label: High
              tone: high
              detail: Outage or error can affect multiple customer workflows
            - label: Structural
              tone: warning
              detail: Product concentration is documented, incident frequency is not
            - label: Partial
              tone: warning
              detail: Troubleshooting exists, but service levels and history do not
        - label: Device-integration dependency
          note: Enode operates a selected part of the integration layer
          values:
            - label: High
              tone: high
              detail: Charging and automation rely on connectivity
            - label: Confirmed
              tone: warning
              detail: Partner dependency is stated directly by Enode and Tibber
            - label: Unknown
              tone: risk
              detail: No concentration, failover, or transition evidence was public
        - label: Retail economics and volatility
          note: Spot pricing and variable trading costs affect realized customer value
          values:
            - label: Medium-high
              tone: high
              detail: Weak savings can impair retention and margins
            - label: Moderate
              tone: warning
              detail: Tariff structure is visible; cohort economics are not
            - label: Unknown
              tone: risk
              detail: Hedging and realized savings distributions were unavailable
        - label: Financing and liquidity
          note: Historical investor participation does not establish current cash availability
          values:
            - label: High
              tone: high
              detail: Liquidity stress can constrain a capital-intensive retailer
            - label: Limited
              tone: warning
              detail: Current valuation and financials were not publicly accessible
            - label: Unknown
              tone: risk
              detail: No current cash, burn, covenants, or financing plan was assigned
    approximationNotes: >-
      Ordinal labels synthesize cited evidence and explicit gaps; they are not probability estimates, audited control
      ratings, or substitutes for regulator, incident, contract, or financial records.
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR010
      - CR012
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The decision moves from operating proof through unresolved price and risk evidence to a research-more
      recommendation.
    data:
      nodes:
        - id: scale
          label: Operating scale
          value: 33m kW theoretical VPP capacity; 27m charging sessions
          detail: Investor-reported 2025 indicators, not audited financial outputs.
        - id: customer-value
          label: Customer value signal
          value: Partner-reported savings
          detail: Useful traction evidence, but not an independent cohort benchmark.
        - id: capital-history
          label: Capital history
          value: $177m reported funding
          detail: Tracxn reports four rounds and a March 2022 latest round.
        - id: price-evidence
          label: Price evidence
          value: SEK 4.6bn Q1 2024 mark
          detail: Historical market-data context without a displayed current share price.
        - id: risk-gates
          label: Risk gates
          value: Economics, terms, security
          detail: Audited margins, capitalization rights, and breach remediation remain unresolved.
        - id: decision
          label: Decision
          value: Research more
          detail: High risk and unknown valuation until evidence and entry-price gates clear.
    approximationNotes: >-
      Values retain source periods and qualifications; the ordered flow does not imply conversion rates or a numeric
      valuation.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
      - CV013
      - CV015
      - CV016
