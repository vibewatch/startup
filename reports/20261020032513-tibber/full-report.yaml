  - id: FM001
    title: Evidence-constrained market sizing layers
    type: pyramid
    summary: >-
      Public evidence narrows from four live countries to monetized household flexibility, but current denominators
      below the operating footprint remain unavailable.
    data:
      items:
        - label: Live national electricity markets
          value: 4
          unit: countries
          detail: Norway, Sweden, Germany, and the Netherlands.
        - label: Historic subscription footprint
          displayValue: '>400,000'
          unit: subscriptions
          detail: Investor-reported Tibber announcement for 2021; not a current figure.
        - label: Dynamic-tariff households
          displayValue: Not quantified
          detail: Country-level eligible household and tariff-adoption denominators are missing.
        - label: Households with compatible devices
          displayValue: Not quantified
          detail: EV, charger, battery, solar, heat-pump, and meter compatibility is not sized.
        - label: Activated automation and rewards users
          displayValue: Not quantified
          detail: Public activation, retention, and cohort counts are unavailable.
        - label: Monetized residential flexibility
          displayValue: Not quantified
          detail: No assigned source discloses flexible MW, market revenue, or take rate.
    approximationNotes: >-
      The layers are an evidence map, not nested populations or a conversion funnel; only the four-country count and
      historical subscription figure are numeric, and all other values remain explicitly unavailable.
    claimRefs:
      - CM001
      - CM007
      - CM009
      - CM012
      - CM015
  - id: FP001
    title: Competitive positioning — ecosystem breadth (X) versus dynamic-retail integration (Y)
    type: quadrant
    summary: >-
      Evidence-backed ordinal placement shows Tibber and 1KOMMA5 as broader bundles, while Octopus and Rabot overlap
      strongly on dynamic retail.
    data:
      points:
        - label: Tibber
          x: 5
          'y': 5
          detail: Broad device integrations combined with quarter-hourly electricity and grid-services direction.
        - label: Octopus Energy
          x: 4
          'y': 5
          detail: Smart tariffs, EV optimization, and smart-home management in the available profile.
        - label: Rabot Energy
          x: 2
          'y': 5
          detail: Hourly spot pricing and smart-home optimization, with broader scope unverified.
        - label: 1KOMMA5
          x: 5
          'y': 4
          detail: Broad solar, heat-pump, EV-charging, tariff, and energy-manager bundle.
        - label: Ostrom
          x: 2
          'y': 4
          detail: App-based dynamic and green tariff, with broader orchestration unverified.
        - label: Status quo / OEM apps
          x: 1
          'y': 1
          detail: Existing supplier relationship or single-device controls without a verified integrated platform.
    approximationNotes: >-
      Ordinal 1–5 scores are analyst classifications of capabilities disclosed in the assigned sources, not market
      share, product quality, or measured customer outcomes. Unsupported capabilities are not scored as present.
    claimRefs:
      - CP001
      - CP003
      - CP013
      - CP015
  - id: FI001
    title: Revenue model bridge from household activity to monetization
    type: flow
    summary: >-
      Household energy activity can create service, hardware, and flexibility receipts, but public sources do not
      disclose the conversion rates or gross-profit contribution of any branch.
    data:
      nodes:
        - id: household
          label: Household energy activity
          detail: Electricity use and connected-device operation create the underlying customer activity.
        - id: commodity
          label: Electricity procurement and billing
          detail: Wholesale or spot energy is reported as passed through without a commodity markup.
        - id: service-fee
          label: Platform service fee
          detail: A recurring customer fee monetizes app and service access.
        - id: hardware
          label: Smart-device purchase
          detail: Chargers, meters, thermostats, and related products create commerce revenue.
        - id: flexibility
          label: Flexible device capacity
          detail: Connected EVs, batteries, and chargers can provide grid-balancing services.
        - id: grid-payment
          label: Grid-operator payment
          detail: Tibber says grid operators pay for balancing activity.
        - id: reward-share
          label: Household reward and Tibber retention
          detail: Receipts are shared with households; the retained take rate is not disclosed.
      edges:
        - from: household
          to: commodity
          label: energy consumed
        - from: household
          to: service-fee
          label: subscription access
        - from: household
          to: hardware
          label: optional purchase
        - from: household
          to: flexibility
          label: device enrollment
        - from: flexibility
          to: grid-payment
          label: balancing service
        - from: grid-payment
          to: reward-share
          label: receipts shared
    approximationNotes: The diagram is qualitative; it does not estimate volumes, conversion rates, revenue shares, or gross margins.
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI008
      - CI011
  - id: FE001
    title: Evidence-bounded product control loop
    type: stack
    summary: >-
      Six layers connect household and market data to device automation, customer experiences, and grid services without
      asserting undisclosed implementation details.
    data:
      layers:
        - label: Energy and household inputs
          modules:
            - Smart-meter consumption data
            - Electricity prices and system conditions
        - label: Edge devices
          modules:
            - Pulse P1 meter reader
            - Bridge battery controller
            - EVs chargers batteries heat pumps and solar
        - label: Connectivity and integrations
          modules:
            - Wi-Fi and Modbus TCP
            - Vendor interfaces
            - Enode-operated selected integration layer
        - label: Tibber control platform
          modules:
            - Price-aware automation
            - Multi-device orchestration
            - Flexibility aggregation
        - label: User and installer surfaces
          modules:
            - Consumer app and analytics
            - Installer app and handover
            - Smart-product ecosystem
        - label: Outcomes and grid services
          modules:
            - Smart Charging
            - Grid Rewards
            - Virtual power plant participation
    approximationNotes: >-
      Conceptual stack assembled from public interface descriptions; layer order is analytical and does not disclose
      Tibber's internal software topology.
