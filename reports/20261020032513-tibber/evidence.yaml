evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, observer rights, committees, delegated authorities, succession plans, and leadership-change
      history.
    whyItMatters: Founder dependence and investor control cannot be assessed without governance and succession evidence.
    diligencePath: Request the board pack, shareholder agreement, organization chart, succession plan, and management references.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: current-scale
    missingEvidence: Current revenue, margin, customer count, employee count, headquarters city, and legal-entity footprint.
    whyItMatters: >-
      Historical subscription growth and product presence do not establish current operating scale or organizational
      capacity.
    diligencePath: Obtain audited accounts, current KPI reporting, payroll records, entity registers, and customer definitions.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financing
    missingEvidence: >-
      Current valuation, total capital raised, fully diluted cap table, preference stack, debt, covenants, and secondary
      transaction terms.
    whyItMatters: >-
      A single round amount cannot establish total funding, cash available, ownership, liquidation economics, or current
      valuation.
    diligencePath: >-
      Request financing documents, cap table, debt schedule, cash balance, and recent primary and secondary transaction
      evidence.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: investors
    missingEvidence: Complete shareholder population, ownership percentages, instruments, board rights, and information rights.
    whyItMatters: Named investors are only a sample and do not reveal control or the economic distribution of outcomes.
    diligencePath: Reconcile the statutory shareholder register to the fully diluted cap table and financing agreements.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: breach
    missingEvidence: >-
      Company notice, regulator record, forensic scope, affected-market breakdown, remediation status, and financial
      impact.
    whyItMatters: >-
      A single commercial breach database establishes a diligence lead but not full incident scope or remediation
      quality.
    diligencePath: >-
      Request incident response records and search competent data-protection authorities for case or notification
      documents.
    relatedQuestionRefs:
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: >-
      Publication date for the Series C and authoritative dates for product launches, market entries, partnerships, and
      regulatory milestones.
    whyItMatters: >-
      Access-date checkpoints show current evidence but cannot substitute for a complete historical milestone
      chronology.
    diligencePath: >-
      Obtain a company event chronology and corroborate each date with archived releases, filings, and regulator
      records.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Current country-level counts for eligible households, dynamic-tariff adoption, compatible energy assets, activated
      Tibber users, flexible MW, and monetization rates.
    whyItMatters: >-
      These denominators are required to derive a defensible bottom-up TAM, SAM, and SOM without using gross European
      electricity spend.
    diligencePath: >-
      Obtain country operating dashboards and construct a cohort model using regulator tariff data, device-installation
      data, activation rates, and contracted flexibility economics.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Country- and cohort-level acquisition, activation, retention, realized savings, and willingness-to-pay data
      segmented by device type.
    whyItMatters: >-
      Partner examples cannot establish whether savings and engagement extend to the median household or support durable
      customer economics.
    diligencePath: >-
      Review anonymized cohorts and independently recompute savings against fixed-rate and manual-control
      counterfactuals.
  - type: missing-source
    severity: material
    topic: flexibility-economics
    missingEvidence: >-
      Current flexible capacity, market participation by country, gross grid revenue, household reward share, and Tibber
      take rate.
    whyItMatters: Flexibility is a distinct value pool in the market thesis but cannot be valued from device connectivity alone.
    diligencePath: >-
      Inspect grid-service contracts, settlement statements, eligible-device counts, dispatch performance, and
      revenue-sharing terms by market.
  - type: missing-source
    severity: material
    topic: competitive-benchmarking
    missingEvidence: >-
      Current like-for-like tariffs, realized discounts, contract terms, market shares, and retention for Tibber and
      each named direct peer.
    whyItMatters: Without comparable commercial data, neither price leadership nor durable customer lock-in can be underwritten.
    diligencePath: >-
      Obtain dated tariff sheets by market, cohort retention data, win-loss records, and customer bills normalized for
      taxes and grid fees.
    relatedQuestionRefs:
      - QP003
      - QP005
      - QP007
      - QP008
    relatedTableRefs:
      - TP001
      - TP003
  - type: missing-source
    severity: material
    topic: security-trust
    missingEvidence: >-
      An official Tibber notice, regulator record, or second independent source confirming the 2024 breach scope and
      remediation.
    whyItMatters: A single commercial breach database is insufficient to establish incident scope or residual customer-trust risk.
    diligencePath: >-
      Request the incident report and regulator correspondence, then verify affected fields, notification count, root
      cause, and remediation.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly cash burn, committed facilities, debt and covenants, base/downside runway,
      planned use of funds, and the next-round trigger.
    whyItMatters: >-
      Without these inputs, neither financing dependency nor the time available to reach contribution-margin milestones
      can be underwritten.
    diligencePath: >-
      Obtain the latest board cash report, 24-month cash forecast, facility agreements, covenant calculations, and
      financing plan, then reconcile them to bank statements and the ledger.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Current recognized revenue, gross margin by stream and country, CAC, payback, churn, working-capital timing, bad
      debt, and VPP gross receipts and customer payouts.
    whyItMatters: >-
      Public descriptions establish revenue mechanisms but cannot show whether growth converts to durable gross profit
      or increases cash requirements.
    diligencePath: >-
      Request monthly cohort economics, market-level management accounts, invoice samples, procurement settlements,
      receivable aging, and VPP settlement statements.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: cybersecurity-cost
    missingEvidence: >-
      Audited remediation spending, insurance recovery, customer churn, regulatory correspondence, and any contingent
      liability associated with the reported 2024 breach.
    whyItMatters: >-
      The event is adverse evidence, but its cash, retention, insurance, and legal consequences cannot be quantified
      from the retained source.
    diligencePath: >-
      Review incident-response invoices, cyber-insurance notices, regulator communications, post-incident churn cohorts,
      and legal-reserve schedules.
  - type: private-evidence-only
    severity: material
    topic: roadmap
    missingEvidence: A dated product roadmap separating committed releases from exploratory integrations and market expansion.
    whyItMatters: Product sequencing and delivery risk cannot be assessed from undated partner language about future services.
    diligencePath: Request the current roadmap, release history, delivery owners, and customer availability by market.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: reliability-security
    missingEvidence: >-
      Independent uptime history, incident postmortems, security certifications, penetration-test scope, and integration
      service levels.
    whyItMatters: >-
      The platform controls household devices and processes sensitive identity and consumption data across partner
      boundaries.
    diligencePath: >-
      Review status history, SOC or ISO materials, penetration-test summaries, incident records, and partner SLAs in the
      data room.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public code, release, package, API documentation, or practitioner-community activity that can evidence engineering
      cadence and developer adoption.
    whyItMatters: >-
      Product pages establish features but do not reveal release quality, integration maintenance burden, or external
      developer engagement.
    diligencePath: >-
      Request API documentation, changelogs, integration deprecation records, release metrics, and developer-support
      volumes.
    relatedQuestionRefs:
      - QE003
      - QE004
  - type: missing-source
    severity: minor
    topic: quantified-outcomes
    missingEvidence: >-
      Sample sizes, eligibility rules, baselines, and calculation methods behind partner-reported charging savings and
      company-reported VPP outputs.
    whyItMatters: The available quantities cannot be generalized across markets or converted into expected customer economics.
    diligencePath: Obtain cohort definitions, raw measurement periods, counterfactual methodology, and third-party validation.
    relatedQuestionRefs:
      - QE007
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named end-customer references with deployment dates, production status, duration, and independently verified
      outcomes.
    whyItMatters: >-
      Cohort-level partner and company claims cannot establish implementation durability or reference quality for
      individual customers.
    diligencePath: >-
      Request three to five reference calls across countries and product combinations, then verify deployment tenure,
      active devices, realized savings, and renewal intent.
    relatedQuestionRefs:
      - QU005
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Current customers, NRR, GRR, churn, renewal rates, contract terms, satisfaction, cohort retention, and revenue
      concentration by country and product.
    whyItMatters: >-
      Adoption and activity metrics do not establish durable revenue, switching behavior, customer quality, or exposure
      to any market or counterparty.
    diligencePath: >-
      Obtain monthly customer and revenue cohorts for at least 36 months, including gross adds, cancellations,
      win-backs, device attachment, and top-counterparty shares.
    relatedQuestionRefs:
      - QU010
  - type: missing-source
    severity: material
    topic: customer-trust
    missingEvidence: >-
      Independent or official corroboration of the reported November 2024 breach, affected population, notification
      scope, root cause, remediation, and churn impact.
    whyItMatters: >-
      A single breach-database source identifies a plausible trust risk but cannot establish incident completeness,
      remediation quality, or customer impact.
    diligencePath: >-
      Request the incident report and customer-notification record, then reconcile them with regulator filings, forensic
      findings, support volumes, and post-incident churn.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: cybersecurity
    missingEvidence: >-
      Authoritative company or regulator confirmation of the reported 2024 incident, including affected jurisdictions,
      notification duties, root cause, containment, and remediation.
    whyItMatters: >-
      The available adverse source is uncorroborated, so incident severity and residual legal exposure cannot be
      underwritten from the public pool.
    diligencePath: >-
      Obtain the incident report, data-protection authority correspondence, customer notices, forensic scope, control
      remediation, and an independent security assessment.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operational-reliability
    missingEvidence: >-
      Market-level uptime, billing-error, failed-automation, device-disconnection, recovery-time, complaint, churn, and
      realized-savings cohorts.
    whyItMatters: >-
      Product breadth and external integrations create operational exposure, but the assigned public evidence does not
      quantify failure frequency, customer impact, or control maturity.
    diligencePath: >-
      Review twelve-month incident logs, service-level reports, support cohorts, billing corrections, integration
      health, postmortems, and net savings after all fees.
    relatedQuestionRefs:
      - QR004
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      A current executed term sheet or secondary trade, fully diluted share count, cap table, liquidation preferences,
      debt terms, and transaction-level price evidence.
    whyItMatters: Without current price and senior-rights data, neither enterprise value nor investor return can be underwritten.
    diligencePath: >-
      Obtain board-approved capitalization records, financing documents, debt agreements, and anonymized executed
      transactions since Q1 2024.
    relatedQuestionRefs:
      - QV004
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: financial-model
    missingEvidence: >-
      Audited revenue, gross margin, contribution margin, cash, burn, working-capital, bad-debt, and retention data by
      market and product.
    whyItMatters: >-
      Operating activity cannot be converted into a defensible valuation multiple or downside case without economic
      outputs.
    diligencePath: >-
      Review audited 2024-2026 financials, monthly management accounts, cohort files, cash forecasts, and market-level
      margin bridges.
    relatedTableRefs:
      - TV002
      - TV003
  - type: missing-source
    severity: material
    topic: security
    missingEvidence: >-
      Independent forensic findings, regulator correspondence, affected-user notices, and control-remediation testing
      for the reported 2024 breach.
    whyItMatters: >-
      A low-reputation breach database is an adverse signal but cannot establish full scope, liability, or remediation
      quality.
    diligencePath: >-
      Request the incident report, penetration-test results, remediation audit, cyber-insurance history, and regulator
      communications.
    relatedTableRefs:
      - TV002
      - TV003
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: >-
      Company-specific IPO readiness, strategic-buyer interest, secondary volumes, transfer restrictions, and investor
      liquidity rights.
    whyItMatters: Generic marketplace exit routes do not establish timing, probability, or realizable proceeds for Tibber investors.
    diligencePath: >-
      Review shareholder agreements, transfer restrictions, board liquidity planning, banker materials, and completed
      secondary transactions.
    relatedQuestionRefs:
      - QV009
