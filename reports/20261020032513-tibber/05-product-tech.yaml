      - [Tibber Bridge, Installer or home-battery owner, Partner-listed controller for supported inverters, Wi-Fi and Modbus TCP link between inverter battery and platform, Supported-inverter coverage certifications and field-failure data are unavailable]
      - [Installer app, Installer, Partner-described guided installation and handover workflow, Project tracking support and customer handoff in one app, Adoption support SLA and error-rate evidence are unavailable]
