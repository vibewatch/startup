  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: roadmap
      missingEvidence: A dated product roadmap separating committed releases from exploratory integrations and market expansion.
      whyItMatters: Product sequencing and delivery risk cannot be assessed from undated partner language about future services.
      diligencePath: Request the current roadmap, release history, delivery owners, and customer availability by market.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: reliability-security
      missingEvidence: Independent uptime history, incident postmortems, security certifications, penetration-test scope, and integration service levels.
      whyItMatters: The platform controls household devices and processes sensitive identity and consumption data across partner boundaries.
      diligencePath: Review status history, SOC or ISO materials, penetration-test summaries, incident records, and partner SLAs in the data room.
      relatedQuestionRefs: [QE004, QE006]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public code, release, package, API documentation, or practitioner-community activity that can evidence engineering cadence and developer adoption.
      whyItMatters: Product pages establish features but do not reveal release quality, integration maintenance burden, or external developer engagement.
      diligencePath: Request API documentation, changelogs, integration deprecation records, release metrics, and developer-support volumes.
      relatedQuestionRefs: [QE003, QE004]
    - type: missing-source
      severity: minor
      topic: quantified-outcomes
      missingEvidence: Sample sizes, eligibility rules, baselines, and calculation methods behind partner-reported charging savings and company-reported VPP outputs.
      whyItMatters: The available quantities cannot be generalized across markets or converted into expected customer economics.
      diligencePath: Obtain cohort definitions, raw measurement periods, counterfactual methodology, and third-party validation.
      relatedQuestionRefs: [QE007]
