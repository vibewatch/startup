company:
  name: Tibber
chapter:
  number: 5
  title: Product & Technology
  summary: Tibber's product is a household energy-control system that joins dynamic electricity pricing, real-time meter data, connected-device automation, and grid-flexibility services. The public evidence supports a commercially deployed product surface and identifiable integration architecture, but independent reliability, security-control, certification, and roadmap evidence remains thin.
sections:
  - id: product-workflow
    title: Product definition and household workflow
    body: >-
      Tibber is best understood as an energy-control workflow rather than a stand-alone utility
      app. Third-party profiles describe a digital electricity supplier whose app exposes usage
      analytics, while partner evidence shows charging automation tied to electricity prices and
      system conditions. The customer journey starts with an electricity account and meter data,
      adds a Pulse or compatible device connection, and then automates flexible loads such as an
      EV or battery. Grid Rewards extends that workflow from bill optimization into compensated
      grid participation. The clearest quantified benefit is partner-reported rather than
      independently audited: Enode cites up to EUR 821 annual savings for the top quartile of
      participating Dutch customers and 50% cheaper charging for Swedish users, without publishing
      sample sizes or calculation methodology.
    claimRefs: [CE001, CE002, CE004, CE008, CE009, CE013]
    tableRefs: [TE002]
  - id: product-surface
    title: Product surface and control-loop architecture
    body: >-
      The product surface spans the consumer app, Pulse meter reader, Bridge battery controller,
      installer tooling, integrations, and VPP services. Libra Energy describes the Bridge as a
      link among an inverter, battery, and Tibber platform using Wi-Fi and Modbus TCP, while Enode
      says it operates a selected part of Tibber's device-integration layer. Those disclosures
      support a layered architecture in which meter and market inputs feed device connectivity,
      platform automation, customer experiences, and grid services. They do not reveal ownership
      boundaries for every connector, control algorithm, or cloud component. Energify's claim of
      more than 45 integrations indicates breadth, but the retained evidence does not establish
      current compatibility, certification, or service levels for each integration.
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE010, CE014]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: deployment-maturity
    title: Deployment maturity and operating dependencies
    body: >-
      Commercial maturity is visible at the feature level: partner pages describe active
      installation workflows, supported inverter connections, Smart Charging, and Grid Rewards,
      and Tibber publishes operating VPP activity. The company says its VPP processed 137,000 MWh
      during one year and shifted 25,000 MWh for grid balancing; these are company-issued operating
      metrics, not an independent benchmark. Deployment nevertheless depends on local market
      access, smart-meter interfaces, device APIs, home connectivity, and partner-operated
      integration capacity. The Bridge listing also says the product is prepared for additional
      services and potential revenue streams, which is directional roadmap evidence rather than a
      dated delivery commitment. Public evidence does not quantify uptime, support response,
      integration failure rates, or installed hardware volumes.
    claimRefs: [CE005, CE006, CE007, CE009, CE015, CE016]
    tableRefs: [TE003]
  - id: differentiation-trust
    title: Differentiation, trust, and technical risk
    body: >-
      Tibber's differentiation appears to come from combining retail electricity, granular prices,
      meter telemetry, broad device control, and flexibility-market participation in one customer
      experience. That combination is more defensible than any single app screen, but it also
      enlarges the operational and trust boundary across household data, device vendors, and grid
      programs. A University of Oslo project specifically flags GDPR, accessibility, and digital-
      divide questions. Separately, Heroic lists a 2024 database exposure involving 50,002 records
      with names, email addresses, and usernames but no passwords; because that listing is a
      commercial breach database rather than a regulator or company incident report, the event and
      remediation status should be independently verified. No retained source establishes security
      certifications, penetration-testing cadence, incident-response controls, or accessibility
      conformance.
    claimRefs: [CE011, CE012, CE013, CE014]
