    notes: Evidence-backed status uses retained company and partner pages; it does not imply independent certification, deployment volume, or service-level verification.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE009, CE016]
  - id: TE002
    title: Household workflow and use cases
    columns: [User job, Prior or manual workflow, Tibber solution, Reported benefit, Limitation]
    rows:
      - [Understand household load, Review bills after consumption, Pulse and app provide real-time meter visibility, Faster feedback on peaks and usage, Requires a compatible meter interface and home connectivity]
      - [Charge an EV economically, Manually schedule charging, Smart Charging follows prices and system conditions, Enode reports up to EUR 821 yearly savings for the top 25% in the Netherlands and 50% cheaper charging in Sweden, Partner-reported figures lack sample size and calculation methodology]
      - [Optimize a home battery, Configure inverter schedules separately, Bridge links supported inverter battery and Tibber control, Charging and discharging target a lower cost per kWh, Economics and reliability depend on compatibility prices and local programs]
      - [Participate in grid balancing, Remain a passive electricity consumer, Grid Rewards coordinates connected flexible assets, Households may earn rewards while supporting the grid, Availability rules reward levels and retention are market-specific and not disclosed]
    notes: Benefits are source-reported and market-specific; no row should be read as a universal customer outcome or guaranteed saving.
    claimRefs: [CE002, CE004, CE008, CE009, CE013, CE015]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Key dependency, Principal risk]
    rows:
      - [Market and meter inputs, Supply prices consumption telemetry and system conditions, Smart-meter interfaces and energy-market data, Data latency completeness and jurisdiction-specific access]
      - [Home-device connectivity, Connect EVs chargers batteries heat pumps and inverters, Vendor APIs plus Wi-Fi and Modbus TCP where applicable, API change device fragmentation and local network failure]
      - [Integration partner layer, Extends coverage for a selected part of connected-device operations, Enode service availability and supported device estate, Third-party concentration and unclear responsibility boundaries]
      - [Automation and orchestration, Schedules devices and aggregates flexibility, Reliable control logic permissions and market rules, Incorrect dispatch customer override and unreported failure rates]
      - [Customer and installer operations, Presents insights guides setup and supports handover, App accessibility support capacity and secure identity controls, Accessibility gaps support load and trust erosion after incidents]
    notes: The architecture is reconstructed from disclosed interfaces and workflows; undisclosed cloud components, control ownership, and resilience mechanisms remain gaps.
    claimRefs: [CE005, CE006, CE007, CE010, CE011, CE012, CE016]
figures:
  - id: FE001
    title: Evidence-bounded product control loop
    type: stack
    summary: Six layers connect household and market data to device automation, customer experiences, and grid services without asserting undisclosed implementation details.
    data:
      layers:
        - label: Energy and household inputs
          modules:
            - Smart-meter consumption data
            - Electricity prices and system conditions
        - label: Edge devices
          modules:
            - Pulse P1 meter reader
            - Bridge battery controller
            - EVs chargers batteries heat pumps and solar
        - label: Connectivity and integrations
          modules:
            - Wi-Fi and Modbus TCP
            - Vendor interfaces
            - Enode-operated selected integration layer
        - label: Tibber control platform
          modules:
            - Price-aware automation
            - Multi-device orchestration
            - Flexibility aggregation
        - label: User and installer surfaces
          modules:
            - Consumer app and analytics
            - Installer app and handover
            - Smart-product ecosystem
        - label: Outcomes and grid services
          modules:
            - Smart Charging
            - Grid Rewards
            - Virtual power plant participation
    approximationNotes: Conceptual stack assembled from public interface descriptions; layer order is analytical and does not disclose Tibber's internal software topology.
    claimRefs: [CE001, CE002, CE003, CE004, CE006, CE007, CE009, CE013, CE014]
callouts:
  - calloutType: strength
    title: Integration breadth is the product
    body: The combined meter, pricing, device, installer, and flexibility surfaces create a broader control loop than a stand-alone electricity app, although integration quality is not independently benchmarked.
    claimRefs: [CE003, CE005, CE007, CE014]
  - calloutType: risk
    title: Trust evidence trails product claims
    body: A reported customer-data exposure and the absence of disclosed security-control evidence make independent incident and control diligence a priority before underwriting platform reliability.
    claimRefs: [CE011, CE012]
