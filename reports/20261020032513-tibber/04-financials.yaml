schemaVersion: "report-v2"
artifact: financials
slug: tibber
runDate: 2026-10-20
company:
  name: Tibber
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a multi-stream model built around electricity pass-through,
    service fees, hardware commerce, and grid-flexibility payments, but it does not expose
    current revenue, margins, cash, burn, or runway. Conflicting third-party pricing records
    and undisclosed VPP economics make revenue quality and capital adequacy material diligence
    blockers rather than underwritable conclusions.
sections:
  - id: revenue-architecture
    title: Revenue architecture and quality
    body: >-
      Tibber's public model is structurally broader than electricity resale. Third-party and
      investor descriptions say the electricity commodity is passed through at wholesale or
      spot cost while a fixed service fee monetizes the app and related operations. Smart-home
      devices sold through the store add transactional revenue, and Tibber's own VPP description
      says grid operators pay for balancing services, with part of those receipts shared with
      participating households. This mix could diversify gross profit away from commodity volume,
      but neither revenue mix nor segment margins are disclosed. The strongest public conclusion
      is therefore about mechanisms, not scale: service, commerce, and flexibility revenues are
      plausible and evidenced, while their contribution, recognition, and durability remain
      unknown. Electricity pass-through also means billed energy value should not be mistaken for
      net revenue, ARR, or gross profit.
    claimRefs: [CI001, CI002, CI007, CI011]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-monetization
    title: Pricing evidence is market-specific and internally inconsistent
    body: >-
      The retained public pricing evidence cannot support a single current price book. Grokipedia
      reports a German fixed fee of EUR 5.99 including VAT as of February 2026, while a low-reputation
      directory lists approximately EUR 3.99 without a clear effective date. A separate Swedish
      comparison page describes a 6 ore per kWh markup excluding VAT plus variable trading costs,
      which differs from the broad no-commodity-markup positioning repeated by other sources.
      These records may reflect country, product, tax, or vintage differences, but the sources do
      not reconcile them. Underwriting should use current official tariffs and realized invoice
      samples by market, not a blended public list price. The same discipline applies to Grid
      Rewards: Tibber discloses a sharing mechanism but not the grid-operator payment, customer
      payout ratio, or retained take rate.
    claimRefs: [CI003, CI004, CI005, CI006, CI007]
    tableRefs: [TI002]
  - id: traction-cost-and-gtm
    title: Traction proxies do not resolve sales efficiency or cost structure
    body: >-
      Public traction is mostly historical or partner-reported. Balderton said subscriptions rose
      from 120,000 to more than 400,000 during 2021, while LeadIQ currently places the workforce in
      a broad 201-500 range. Enode reports strong customer outcomes for connected-device programs,
      including up to EUR 821 annual savings for the top quartile of Dutch customers and 50% cheaper
      charging in Sweden, but this is partner proof rather than independently audited cohort data.
      Tibber also uses referral credits, which demonstrates a customer-acquisition channel but does
      not disclose CAC, conversion, retention, or payback. The operating model necessarily carries
      procurement, billing, licensing, support, software, integration, and device-orchestration
      costs; the retained sources provide no allocation or contribution-margin bridge. A reported
      2024 breach involving 50,002 records adds an adverse diligence item, but no source quantifies
      remediation, insurance, churn, or liability effects.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013]
  - id: capital-adequacy-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      The available capital evidence is not a runway analysis. Accumeo lists a Q1 2024 share
      issuance at a SEK 4.6 billion post-money valuation, but the public excerpt withholds the
      amount raised and transaction terms. A valuation observation is not cash on hand, and a
      financing event does not reveal cash remaining two years later. None of the retained sources
      discloses current revenue, ARR, gross margin, working-capital exposure, bad debt, cash, burn,
      runway, debt, covenants, or next-round triggers. The financial verdict is therefore
      research-more: the model has credible monetization surfaces, but revenue quality, margin
      conversion, capital intensity, and financing dependency cannot be underwritten from the
      assigned public evidence. Management materials should bridge billed electricity volume to
      net revenue and gross profit, then reconcile cash movement by market and product.
    claimRefs: [CI014, CI015, CI016]
    tableRefs: [TI003]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns:
      - Stream
      - Mechanism
      - Unit
      - Public status
      - Quality
      - Diligence ask
    rows:
      - - Electricity supply
        - Wholesale or spot electricity passed through to households
        - kWh billed
        - Reported as no commodity markup by two non-independent descriptions
        - Revenue recognition and gross-versus-net presentation are undisclosed
        - Reconcile billed energy value to recognized net revenue and gross profit by market
      - - Platform service
        - Fixed recurring fee for app and service access
        - Customer-month
        - German fee reported at EUR 5.99 including VAT in February 2026
        - List pricing only; realized price and churn are unavailable
        - Provide realized ARPU, discounts, churn, and cohort gross margin by market
      - - Smart hardware
        - Sale of chargers, thermostats, meters, and related devices
        - Device sold
        - Store activity is reported by investor and third-party sources
        - Volume, attach rate, inventory ownership, and hardware margin are unavailable
        - Provide units, attach rate, returns, inventory turns, and contribution margin
      - - Grid flexibility
        - Grid-operator payments shared with participating households
        - Activated device or flexibility event
        - Tibber describes Grid Rewards as a new revenue stream
        - Payment rate, customer share, and retained take rate are unavailable
        - Provide market-level bids, gross receipts, customer payouts, and net take rate
    notes: >-
      Mechanisms are drawn from retained public sources; no row supplies audited revenue,
      revenue mix, or segment margin, and billed electricity value must not be read as net revenue.
    claimRefs: [CI001, CI002, CI003, CI007]
  - id: TI002
    title: Public pricing and monetization records
    columns:
      - Market or product
      - Public price or mechanism
      - Vintage
      - Evidence limitation
      - Underwriting implication
    rows:
      - - Germany service fee
        - EUR 5.99 per month including 19% VAT
        - February 2026
        - Single low-reputation secondary source
        - Verify against current official tariff and invoices
      - - Germany service fee
        - Approximately EUR 3.99 per month
        - Unspecified
        - Conflicts with the February 2026 secondary record
        - Do not infer realized ARPU from either value
      - - Sweden electricity plan
        - 6 ore per kWh excluding VAT plus variable trading costs
        - Current page; publication date unavailable
        - Independent comparison page, not an official tariff
        - Reconcile market-specific markup with broad no-markup positioning
      - - Grid Rewards
        - Grid-operator receipts shared with households
        - Company page retrieved 2026-10-20
        - Gross payment, payout ratio, and Tibber take rate are undisclosed
        - Treat flexibility economics as unquantified until contract and settlement data are reviewed
    notes: >-
      These are public list-price or mechanism observations from different markets and vintages;
      they are not realized pricing, revenue, or margin and should not be blended.
    claimRefs: [CI003, CI004, CI005, CI006, CI007]
  - id: TI003
    title: Unit economics and capital-adequacy diligence gaps
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Gross margin by stream and market
        - null
        - Unavailable
        - Tests whether service and flexibility economics offset low-margin electricity activity
        - Supply recognized revenue and direct costs by stream, country, and month
      - - CAC and payback by channel
        - null
        - Unavailable
        - Referral credits demonstrate acquisition spend but not efficiency
        - Provide CAC, conversion, incentive cost, churn, and payback by cohort
      - - Working capital and bad debt
        - null
        - Unavailable
        - Energy procurement, billing timing, and customer defaults can create cash needs
        - Provide receivable aging, collateral, procurement settlement timing, and bad-debt history
      - - Cash, burn, and runway
        - null
        - Unavailable
        - Determines financing dependency and timing of the next capital event
        - Provide unrestricted cash, monthly cash burn, committed facilities, and base/downside runway
      - - VPP net take rate
        - null
        - Unavailable
        - Determines whether flexibility is material gross profit or primarily customer pass-through
        - Provide grid receipts, household rewards, settlement costs, and retained revenue by market
    notes: >-
      Null means the metric was not disclosed in the retained assigned evidence, not that the
      value is zero; every row specifies the management evidence required to close the gap.
    claimRefs: [CI011, CI013, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge from household activity to monetization
    type: flow
    summary: >-
      Household energy activity can create service, hardware, and flexibility receipts, but public
      sources do not disclose the conversion rates or gross-profit contribution of any branch.
    data:
      nodes:
        - id: household
          label: Household energy activity
          detail: Electricity use and connected-device operation create the underlying customer activity.
        - id: commodity
          label: Electricity procurement and billing
          detail: Wholesale or spot energy is reported as passed through without a commodity markup.
        - id: service-fee
          label: Platform service fee
          detail: A recurring customer fee monetizes app and service access.
        - id: hardware
          label: Smart-device purchase
          detail: Chargers, meters, thermostats, and related products create commerce revenue.
        - id: flexibility
          label: Flexible device capacity
          detail: Connected EVs, batteries, and chargers can provide grid-balancing services.
        - id: grid-payment
          label: Grid-operator payment
          detail: Tibber says grid operators pay for balancing activity.
        - id: reward-share
          label: Household reward and Tibber retention
          detail: Receipts are shared with households; the retained take rate is not disclosed.
      edges:
        - from: household
          to: commodity
          label: energy consumed
        - from: household
          to: service-fee
          label: subscription access
        - from: household
          to: hardware
          label: optional purchase
        - from: household
          to: flexibility
          label: device enrollment
        - from: flexibility
          to: grid-payment
          label: balancing service
        - from: grid-payment
          to: reward-share
          label: receipts shared
    approximationNotes: >-
      The diagram is qualitative; it does not estimate volumes, conversion rates, revenue shares,
      or gross margins.
    claimRefs: [CI001, CI002, CI007, CI008, CI011]
callouts:
  - calloutType: risk
    title: Current liquidity is not public
    body: >-
      The Q1 2024 valuation record does not disclose proceeds or establish current cash, burn,
      runway, debt capacity, or the timing of another financing.
    claimRefs: [CI014, CI015, CI016]
  - calloutType: recommendation
    title: Underwrite from invoices and cash movement, not public valuation
    body: >-
      Require market-level revenue recognition, gross-margin bridges, working-capital schedules,
      and base/downside cash forecasts before assigning a financial-quality or runway conclusion.
    claimRefs: [CI015, CI016]
