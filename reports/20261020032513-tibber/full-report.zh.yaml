              Tibber 的产品主张依赖软件协调市场价格、家庭用电、合同和联网设备。公司称功能可用性随市场、合同和设备而变，这会造成碎片化的支持面，也使总体产品主张无法替代市场层面的可靠性数据。Business Norway
              称自动化可以把电动车充电和供暖移到更便宜的时段，并引用最高 20 percent 的用电量下降，但推广资料没有队列定义、基线或独立复现。Energify 另行描述按 15
              分钟计的现货价、固定加价和可变交易成本；因此客户价值取决于价格波动、行为和当地电价披露，而不是保证节省。缓释成熟度仍未得到证明。尽调应取得市场层面的正常运行时间、自动化失败率、计费错误率、投诉和流失队列，以及实际节省分布。如果核心队列反复发生高严重度计费或自动化事件，或在计入全部费用后节省消失，客户论点会显著削弱。
