  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与客户数据暴露
        blocks:
          - type: paragraph
            body: >-
              研究池中最强的负面信号，是 Heroic 报告称 2024 年 11 月一次数据库泄露暴露了 50,002 条 Tibber 记录，包括姓名、电子邮件地址和用户名。Heroic
              是信誉较低的商业泄露索引，而不是监管机构或 Tibber 的事件通知，因此这只是尽调线索，并非对事件范围或修复情况的独立验证。尽管如此，潜在暴露仍然重大，因为 Tibber
              自有支持页面称应用可以展示合同、发票、支付信息、联网设备和用电数据。地域范围也尚未确定：Wikipedia 列出挪威、瑞典、德国和荷兰，而更新后的 Business Norway
              资料只列出德国、挪威和瑞典。这一差异可能反映时间或产品范围，但妨碍逐司法辖区进行清晰的许可评估。眼下的缓释测试应以文件为核心：在评估剩余风险前，要求监管机构往来、事件取证、客户通知、隐私控制证据和当前许可证清单。
