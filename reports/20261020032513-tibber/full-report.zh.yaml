      - number: '7.3'
        title: 合作伙伴依赖、财务不透明与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              设备连接并非完全由内部掌握。Enode 称其在 Tibber 更广泛的平台内运营连接和编排层的一部分，而 Enode 引述的 Tibber
              高管强调，可靠连接是充电和自动化在规模化运行时符合预期的必要条件。这构成真实的交易对手和接口依赖，尽管证据没有量化集中度、宕机历史或替代成本。根据
              Wikipedia，更广泛的模式还包括订阅费、硬件和灵活性收入，从而增加执行面和营运资金问题。Balderton 记录了历史投资者参与，但已筹资金不等于当前可用现金；EquityZen
              的公开页面则把当前估值和财务细节留在注册墙后。投资前，应要求当前现金、烧钱、抵押品和对冲需求、坏账敞口、供应商集中度及集成退出计划。论点失效触发器包括：失去关键集成且没有经过测试的备用方案；在交易和支持成本之后持续负单位经济性；契约或流动性压力；或灵活性收入无法抵消其增加的复杂性。
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 投资立场仍取决于尽调
            body: 不要把研究池缺少权威事件、监管、可靠性或财务记录理解为表现良好的证据。在评估网络安全修复、司法辖区合规、合作伙伴韧性或现金跑道前，要求一手文件。
            calloutType: risk
            claimRefs:
              - CR001
              - CR011
              - CR014
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资论点
        blocks:
          - type: paragraph
            body: >-
              决策是继续研究，而不是买入。Tibber 拥有覆盖电力供应、硬件、自动化和灵活性市场收入的差异化住宅能源模式；投资者和合作伙伴资料还描述了客户采用上升、截至 2025 年末 33 million kW
              的理论虚拟电厂容量，以及 2025 年 27 million
              次智能充电会话。这些指标证明了产品使用和电网相关性，但没有证明收入质量、毛利率、现金生成或可投资的入场价格。反方论点同样重大：最新可见估值标记已过时，市场数据来源对最新融资证据说法不一，客户节省额来自合作伙伴而非独立审计，第三方泄露数据库还报告
              2024 年有 50,002 条记录暴露。因此，入场应取决于财务、所有权和安全方面的一手证据，而不能只看公司质量。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: 融资、估值与可比背景
        blocks:
          - type: paragraph
            body: >-
              公开融资证据不足以支持当前价格。Tracxn 报告四轮累计融资 $177 million，并将 2022 年 3 月的 Series C 列为最新轮次；投资者公告则将 Summa Equity
              列为领投方。Accumeo 展示 2022 年第一季度 Series C 的 SEK 7.0 billion 投后估值和 SEK 872 股价，随后列出 2024 年第一季度股份发行的 SEK 4.6
              billion 估值，但未显示股价。Accumeo 还称其轮次和估值信息来自新闻媒体和公开来源，因此这些标记只是背景，不是当前成交价的证明。Tracxn
              列出的竞争者可以用于战略筛选，但研究池中没有公开且足够可比的交易倍数或交易集合，无法产生有说服力的当前估值区间。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.3'
        title: 情景框架与入场纪律
        blocks:
          - type: paragraph
            body: >-
              由于收入基础、利润率结构、现金余额和完全稀释资本化均不可得，情景分析必须以里程碑为基础。乐观情景要求独立验证 Tibber
              将设备和充电规模转化为持久毛利，并且当前融资价格在稀释后仍为目标回报留下空间。基准情景把运营指标视为有希望，但在评估倍数前要求经审计的队列经济性和安全修复。悲观情景由灵活性变现疲弱、安全事件重现、不利融资条款，或价格锚定在更高历史标记而财务进展不相称触发。由于赋予数字概率或估值区间会制造虚假精确度，没有任何情景获得这类数字；可投资输出是一组证据和价格门槛。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV010
              - CV011
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              退出准备度尚未得到证明。EquityZen 将 Tibber 展示为私营公司机会，但把当前估值、股价、股权结构表、按股份类别划分的融资历史和流动性偏好留在投资者访问之后。其泛化的退出路径包括
              IPO、并购分配，或符合条件后在市场平台出售；这些都不能证明公司特有的流动性。最终尽调应取得经审计的 2024-2026
              年报表、按市场和产品划分的月度毛利桥接、现金与营运资金需求、坏账表现、当前完全稀释所有权、债务契约、清算优先权，以及 2024
              年第一季度以来全部老股和新股交易。还应取得针对已报告泄露事件的独立事件报告和修复证据。如果这些材料显示结构性负贡献经济性、惩罚性的优先权、不足的现金跑道或未解决的安全控制失败，投资论点就会失效。
            claimRefs:
              - CV008
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格纪律主导决策
            body: 强大的智能能源产品，在价格错误或处于优先融资条款下，仍可能是糟糕的投资。在设定任何入场价值前，应要求当前完全稀释资本化和经审计的财务模型。
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
          - type: callout
            title: 安全证据是估值输入
            body: 在独立取证记录确认事件范围和修复之前，已报告的 2024 年数据暴露应影响风险、尽调范围和要求回报。
            calloutType: risk
            claimRefs:
              - CV013
              - CV016
