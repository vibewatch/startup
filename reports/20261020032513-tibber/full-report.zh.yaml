              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: 资本充足性与投资判断结论
        blocks:
          - type: paragraph
            body: >-
              可获得的资本证据不是现金跑道分析。Accumeo 列出 2024 年第一季度以 SEK 4.6 billion
              投后估值进行的股份发行，但公开摘录没有披露募资金额和交易条款。估值观察不等于手头现金，融资事件也无法说明两年后的现金余额。保留来源均未披露当前收入、ARR、毛利率、营运资金敞口、坏账、现金、烧钱、现金跑道、债务、契约或下一轮触发条件。因此财务结论是继续研究：模式拥有可信的变现面，但收入质量、利润转化、资本强度和融资依赖无法根据研究池的公开证据进行投资判断。管理层材料应把开票电力规模桥接到净收入和毛利，再按市场和产品核对现金流动。
