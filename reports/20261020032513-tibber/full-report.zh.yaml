      - number: '4.2'
        title: 定价证据因市场而异且彼此不一致
        blocks:
          - type: paragraph
            body: >-
              保留下来的公开定价证据无法支持一套当前统一价格表。Grokipedia 报告称，截至 2026 年 2 月德国固定费用为含 VAT 的 EUR 5.99，而一个信誉较低的目录列出约 EUR
              3.99，但没有清晰生效日期。另一瑞典对比页面描述了每 kWh 6 öre（不含
              VAT）的加价，另加可变交易成本，这与其他来源反复强调的“无商品加价”定位不同。这些记录可能反映国家、产品、税项或时间差异，但来源没有进行调和。投资判断应使用各市场当前的官方电价和实际账单样本，而不是混合公开标价。Grid
              Rewards 也应遵守同样纪律：Tibber 披露了分成机制，但没有披露电网运营商付款额、客户支付比例或自身保留的抽成率。
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
