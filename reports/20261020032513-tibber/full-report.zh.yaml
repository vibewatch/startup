              将设备连接和基于价格的自动化描述为核心客户行为。因此，证据指向的是消费者付费方、多名家庭用户，以及作为间接灵活性付费方的电网运营商，而不是单一同质的电力零售客群。这个分群在战略上有用，但这些来源都没有披露各分部收入或利润率。
