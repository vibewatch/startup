        - VPP 和充电规模转化为经验证的经常性毛利；安全整改完成；融资条款干净。
        - 只有在稀释后价格仍能支持所需回报时才评估投资；目前没有公开且可辩护的价格区间。
        - 执行、监管激励和估值倍数压缩。
        - 在取得经审计的经济数据和当前条款清单前，无法支持。
      - - 中性
        - 产品采用持续，但变现和现金转化仍需逐个市场验证。
        - 在核实分部利润率和完全摊薄股份后，采用保守的零售与软件混合框架。
        - 营运资金、坏账、硬件组合和优先权悬置。
        - 与混杂的公开记录最一致，但未赋予数值概率。
      - - 悲观
        - 灵活性收入表现不佳，安全控制仍有缺陷，或新资本附带惩罚性优先权。
        - 拒绝以历史估值点为锚的入场；没有债务和优先权条款，就无法界定下行空间。
        - 下轮融资、稀释、流动性约束和客户信任受损。
        - 当经济数据、资本结构、资金续航或泄露整改尽调失败时触发。
