      - number: '4.3'
        title: 牵引力代理指标无法解决销售效率或成本结构
        blocks:
          - type: paragraph
            body: >-
              公开牵引力主要来自历史数据或合作伙伴报告。Balderton 称订阅数在 2021 年从 120,000 增至超过 400,000，LeadIQ 则目前将员工规模置于 201-500 的宽泛区间。Enode
              报告联网设备项目带来良好客户结果，包括荷兰最高四分位客户每年最高节省 EUR 821，以及瑞典充电成本降低 50%，但这是合作伙伴证明，不是经独立审计的队列数据。Tibber
              还使用推荐奖励，这说明存在获客渠道，却没有披露 CAC、转化、留存或回本周期。该运营模式必然承担采购、计费、许可、支持、软件、集成和设备编排成本；现有来源没有提供成本分配或贡献利润桥接。一次涉及 50,002
              条记录的 2024 年泄露增加了负面尽调事项，但没有来源量化修复、保险、流失或责任影响。
            claimRefs:
              - CI008
