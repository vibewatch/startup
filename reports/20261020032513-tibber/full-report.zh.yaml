            title: 广度有用，但尚不具排他性
            body: Tibber 的集成广度可以改善家庭体验，但现有证据也显示，多家竞争者都提供重叠的电价、设备控制和电气化组合。
            calloutType: insight
            claimRefs:
              - CP001
              - CP003
              - CP010
              - CP012
              - CP015
