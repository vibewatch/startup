          'y': 1
          detail: 现有供应商关系或单设备控制，尚无经核实的集成平台。
    approximationNotes: 1–5 序数评分是分析师对指定来源所披露能力的分类，不代表市场份额、产品质量或测量得出的客户结果。缺乏支持的能力不计为已具备。
    claimRefs:
      - CP001
      - CP003
      - CP013
      - CP015
  - id: FI001
    title: 从家庭活动到变现的收入模式桥接
    type: flow
    summary: 家庭能源活动可以带来服务、硬件和灵活性收入，但公开来源没有披露任何分支的转化率或毛利贡献。
    data:
      nodes:
        - id: household
          label: 家庭能源活动
          detail: 用电和联网设备运行构成底层客户活动。
        - id: commodity
          label: 电力采购与计费
          detail: 据报道，批发电或现货电力直接传导，不加商品价差。
        - id: service-fee
          label: 平台服务费
          detail: 经常性客户费用将应用和服务访问变现。
        - id: hardware
          label: 智能设备购买
          detail: 充电器、电表、恒温器及相关产品带来商业收入。
        - id: flexibility
          label: 灵活设备容量
          detail: 联网电动车、电池和充电器可以提供电网平衡服务。
        - id: grid-payment
          label: 电网运营商付款
          detail: Tibber 称电网运营商会为平衡活动付费。
        - id: reward-share
          label: 家庭奖励与 Tibber 留存
          detail: 收入与家庭分成；留存抽成率未披露。
      edges:
        - from: household
          to: commodity
          label: 已消耗能源
        - from: household
          to: service-fee
          label: 订阅访问
        - from: household
          to: hardware
          label: 可选购买
        - from: household
          to: flexibility
          label: 设备注册
        - from: flexibility
          to: grid-payment
          label: 平衡服务
        - from: grid-payment
          to: reward-share
          label: 收入分成
    approximationNotes: 该图为定性示意；不估算规模、转化率、收入分成或毛利率。
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI008
      - CI011
  - id: FE001
    title: 受证据约束的产品控制闭环
    type: stack
    summary: 六个层次将家庭和市场数据连接到设备自动化、客户体验和电网服务，但不声称未披露的实现细节。
    data:
      layers:
        - label: 能源与家庭输入
          modules:
            - 智能电表用量数据
            - 电价与系统状况
        - label: 边缘设备
          modules:
            - Pulse P1 电表读取器
            - Bridge 电池控制器
            - 电动车、充电器、电池、热泵和太阳能设备
        - label: 连接与集成
          modules:
            - Wi-Fi 和 Modbus TCP
            - 厂商接口
            - Enode 运营的选定集成层
        - label: Tibber 控制平台
          modules:
            - 价格感知自动化
            - 多设备编排
            - 灵活性聚合
        - label: 用户与安装商界面
          modules:
            - 消费者应用和分析
            - 安装商应用和交付
            - 智能产品生态
        - label: 结果与电网服务
          modules:
            - Smart Charging
            - Grid Rewards
            - 虚拟电厂参与
    approximationNotes: 概念堆栈根据公开接口描述组装；层次顺序是分析框架，不披露 Tibber 的内部软件拓扑。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE006
      - CE007
      - CE009
      - CE013
      - CE014
  - id: FU001
    title: 从供电到住宅灵活性的客户旅程
    type: journey-map
    summary: 公开证据暗示一条六阶段扩展路径，但没有提供阶段之间的转化、时间、留存或收入指标。
    data:
      nodes:
        - label: 加入电力计划
          stage: Acquire
          detail: 家庭从动态电价电力和基于应用的可视化开始。
          touchpoints:
            - Electricity offer
            - Tibber app
        - label: 连接首台设备
          stage: Activate
          detail: 家庭连接电动车、充电器、电表、恒温器、热泵或太阳能资产。
          touchpoints:
            - Device integration
            - Real-time consumption data
        - label: 自动化用能
          stage: Engage
          detail: Smart Charging 或供暖将用量转移到价格较低的时段。
          touchpoints:
            - Automation
            - Price signals
        - label: 获得 Grid Rewards
          stage: Monetize flexibility
          detail: 参与设备支持电网平衡，家庭获得奖励。
          touchpoints:
            - Flexibility event
            - Customer reward
        - label: 增加家庭资产
          stage: Expand
          detail: 增加电动车、电池、太阳能或热泵资产，扩大可控负荷。
          touchpoints:
            - Cross-device coverage
            - Multi-asset coordination
        - label: 作为灵活家庭参与
          stage: Retain and deepen
          detail: 协同资产构成 Tibber 住宅 VPP 方案的一部分。
          touchpoints:
            - Residential VPP
            - Grid services
    approximationNotes: 这是对已描述使用场景的分析师综合，不是测量得出的漏斗；节点顺序不代表观察到的转化、留存、时间或比例价值。
    claimRefs:
      - CU001
      - CU007
      - CU013
      - CU016
  - id: FR001
    title: 剩余风险与缓释证据矩阵
    type: matrix
    summary: 对下行影响、可能性证据和公开可见缓释成熟度的定性热力图；不赋予数值概率。
    data:
      columns:
        - label: 影响
          detail: 风险发生时的潜在下行
        - label: 可能性证据
          detail: 指定公开证据的强度
        - label: 缓释成熟度
          detail: 公开可见的控制措施或替代证据
      rows:
        - label: 客户数据暴露
          note: 一份不利的泄露指数报告，但没有权威确认
          values:
            - label: 高
              tone: high
              detail: 若得到确认，客户损害和监管后果均属可能
            - label: 有限
              tone: warning
              detail: 该来源声誉较低，且在指定来源池中未得到佐证
            - label: Unknown
              tone: risk
              detail: 没有可用的事件报告或整改审计
        - label: 多市场合规
          note: 公开来源对当前国家覆盖范围存在分歧
          values:
            - label: 高
              tone: high
              detail: 电力零售具有司法辖区特异性
            - label: 中等
              tone: warning
              detail: 可见跨国活动，但许可证状态不可见
            - label: Unknown
              tone: risk
              detail: 未指定当前许可证清单或监管机构记录
        - label: 应用与计费连续性
          note: 一个应用界面覆盖价格、用量、合同、发票和设备
          values:
            - label: 高
              tone: high
              detail: 中断或错误可能影响多个客户流程
            - label: 结构性
              tone: warning
              detail: 已记录产品集中度，但未记录事件频率
            - label: 部分
              tone: warning
              detail: 有故障排查，但没有服务水平和历史记录
        - label: 设备集成依赖
          note: Enode 运营集成层的一个选定部分
          values:
            - label: 高
              tone: high
              detail: 充电和自动化依赖连接能力
            - label: 已确认
              tone: warning
              detail: Enode 和 Tibber 直接说明了合作伙伴依赖
            - label: Unknown
              tone: risk
              detail: 没有公开的集中度、故障切换或过渡证据
        - label: 零售经济性与波动
          note: 现货价格和可变交易成本影响客户实际获得的价值
          values:
            - label: 中高
              tone: high
              detail: 节省额偏低会损害留存和利润率
            - label: 中等
              tone: warning
              detail: 电价结构可见，但队列经济性不可见
            - label: Unknown
              tone: risk
              detail: 对冲和实际节省额分布不可得
        - label: 融资与流动性
          note: 历史投资者参与不能证明当前现金可用性
          values:
            - label: 高
              tone: high
              detail: 流动性压力会限制资本密集型零售商
            - label: 有限
              tone: warning
              detail: 当前估值和财务数据无法从公开渠道获得
            - label: Unknown
              tone: risk
              detail: 未指定当前现金、消耗、契约或融资计划
    approximationNotes: 序数标签综合已引用证据和明确缺口；它们不是概率估计、经审计的控制评级，也不能替代监管机构、事件、合同或财务记录。
    claimRefs:
      - CR001
      - CR004
      - CR005
      - CR010
      - CR012
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策从运营证明出发，经过尚未解决的价格和风险证据，最终得出继续研究的建议。
    data:
      nodes:
        - id: scale
          label: 运营规模
          value: 33m kW theoretical VPP capacity; 27m charging sessions
          detail: 投资者报告的 2025 年指标，不是经审计的财务产出。
        - id: customer-value
          label: 客户价值信号
          value: Partner-reported savings
          detail: 有用的增长牵引证据，但不是独立的队列基准。
        - id: capital-history
          label: 资本历史
          value: $177m reported funding
          detail: Tracxn 报告称共有四轮融资，最近一轮为 2022 年 3 月。
        - id: price-evidence
          label: 价格证据
          value: SEK 4.6bn Q1 2024 mark
          detail: 历史市场数据背景，没有展示当前股价。
        - id: risk-gates
          label: 风险门槛
          value: Economics, terms, security
          detail: 经审计利润率、资本化权利和泄露整改仍未解决。
        - id: decision
          label: 决策
          value: Research more
          detail: 在证据和入场价格门槛通过前，风险高且估值未知。
    approximationNotes: 各值保留来源期间和限定条件；有序流程不代表转化率或数值估值。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
