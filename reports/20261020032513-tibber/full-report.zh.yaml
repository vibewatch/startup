chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Tibber 将自己定位为数字能源公司，而不是传统的、以用量为核心的公用事业公司。其当前网站描述了一个家庭能源生态：把汽车、供暖等高负荷资产接入应用，支持区域固定电价和 15
              分钟动态电价，按价格自动调整用电，并通过 Grid Rewards 向用户支付短时充电调整的报酬。第三方资料将公司成立时间追溯至 2016 年，EquityZen 则称其为一家私营、IPO
              前企业。这个模式不只是转售电力：软件、设备集成和商店都属于产品主张的一部分。现有证据无法确认当前总部城市，也无法在已记录的 Series C 之外确认确切的当前融资阶段。
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO010
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO009
              - CO010
              - CO015
      - number: '1.2'
        title: 管理层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人核心仍是最清晰的公开领导层信号。Tibber 自有页面将 Daniel Linden 和 Edgeir Vardal Aksnes 列为创始人，并称两人都具备能源行业经验。Balderton 将
              Aksnes 列为联合创始人兼 CEO，EquityZen 则将 Linden 列为联合创始人兼
              CPO。这个组合说明创始团队覆盖了商业领导和产品职能，但现有证据没有披露当前董事会名单、委员会架构、控制权、继任安排或重大管理层变动。公开证据无法量化由此产生的关键人物风险，应查阅董事会材料、组织架构图，并访谈管理层。
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.3'
        title: 融资与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Balderton 的公告称，$100 million 的 Series C 由 Summa Equity 领投，Balderton、Eight Roads 和 Schibsted Ventures
              为现有投资者；公告还记录了 Balderton 早在 2020 年 11 月的投资。EquityZen 另列出 Summa、Schibsted、Altor Equity Partners、Eviny
              Ventures 和 Nordea Bank 为重要投资者。这些发行方关系很重要：Balderton 是投资者，EquityZen
              是私募市场平台运营方，因此两者都不能被视为估值或融资条款的独立证明。现有来源没有披露当前完全稀释股权结构表、优先股堆叠、债务、老股转让、累计融资总额或当前定价估值。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO007
              - CO008
              - CO016
      - number: '1.4'
        title: 规模、运营里程碑与风险
        blocks:
          - type: paragraph
            body: >-
              最有力的规模披露来自历史数据：Balderton 报告订阅数在 2021 年从 120,000 增至超过 400,000。当前运营证据偏定性，而非企业规模报告。Enode 称其为 Tibber
              运营选定的集成层，Home Assistant 则记录了实时价格、用电量、成本、峰值、发电、储能和充电接口。负面方面，Heroic 报告称 2024 年 12 月有 50,002
              条包含姓名、电子邮件地址和用户名的客户记录暴露；这只是一个商业泄露数据库记录，需要监管机构或公司方面的佐证。名义上的 2026 年 Wipick
              评测无法使用，因为抓取文本只有标题。当前收入、利润率、客户数、员工数以及经独立验证的事件修复情况仍待核实。
            claimRefs:
              - CO009
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO002
              - CO005
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 2024 年数据暴露需要佐证
            body: Heroic 报告称有 50,002 条客户记录暴露，其中包含姓名、电子邮件地址和用户名。应将这一事件视为重要尽调线索，而不是已完全验证的损失估计：研究池中没有公司通知、监管决定、取证报告或修复证据。
            calloutType: risk
            claimRefs:
              - CO013
          - type: callout
            title: 设备连接既是产品证明，也是依赖项
            body: Enode 的客户案例和独立的 Home Assistant 文档表明，Tibber 的产品主张延伸到了家庭设备编排。但这也带来尽调问题：第三方集成是否可靠、数据权限如何管理，以及整条技术栈由谁负责运营。
            calloutType: insight
            claimRefs:
              - CO011
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与价值池
        blocks:
          - type: paragraph
            body: >-
              Tibber 的相关市场小于全部欧洲电力支出，但大于单纯的电力零售。可支持的边界包括：按现货价或与批发价挂钩的价格供应居民电力、固定数字服务费、通过线上商店销售联网家庭硬件，以及聚合家庭灵活性。已有报道显示
              Tibber 活跃于挪威、瑞典、德国和荷兰，这构成当前运营最稳妥的地域边界。监管网络费、强制性收费、公用事业级发电、输电资产和无关的智能家居采购，应从 Tibber
              的可寻址收入池中剔除。传统固定电价方案、手动设备调度和被动用电仍是现状替代方案；Tibber 的现货价模式以预算确定性换取自动化，以及把负荷移到更便宜时段的可能性。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM007
              - CM009
      - number: '2.2'
        title: 受证据约束的市场测算
        blocks:
          - type: paragraph
            body: >-
              研究池中的来源没有提供当前且方法透明的欧洲市场规模、Tibber 四个运营国家的可服务家庭数，或当前客户分母。历史证据显示订阅数在 2021 年从 120,000 增至超过 400,000，但这既不是当前
              SOM，也不是市场规模估计。合作伙伴报告的荷兰参与客户最高四分位每年最高可节省 EUR 821，以及瑞典用户充电成本降低
              50%，说明的是潜在家庭价值，而不是总市场价值。因此，可投资的市场规模应自下而上测算：符合条件的家庭、动态电价渗透率、兼容设备拥有率、激活率和可变现的灵活容量。每个分母都仍是尽调缺口；把未经支持的假设相乘，只会制造虚假的精确度。
            claimRefs:
              - CM008
              - CM012
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM008
              - CM012
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM007
              - CM009
              - CM012
              - CM015
      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              直接付费方是居民电力账户持有人，用户则可能包括电动车车主和通过应用或联网设备互动的其他家庭成员。证据最强的切入点是能够围绕动态电价自动安排充电的电动车车主；相邻客群包括智能家居爱好者、太阳能和电池拥有者、热泵用户，以及愿意接受批发价波动的价格敏感型家庭。采用路径从电价与应用关系开始，经过电表连接，再到一个或多个可控设备、自动优化，最终参与
              Grid Rewards 等灵活性项目。Enode 的合作伙伴资料表明，Tibber 将联网设备作为客户体验的核心层，但研究池没有关于激活、留存和实际节省额的独立证据。
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              家庭电动车、电池、太阳能系统、热泵和动态电价越普及，采用就越容易，因为每一项都会增加可控负荷或资产。随着设备覆盖扩大，这一模式可以从月度服务关系延伸到硬件销售和灵活性收入。同样的设计也带来约束：现货价对优先考虑账单确定性的客户缺乏吸引力，完整功能依赖电表和设备兼容性，且不同品牌和市场之间的互操作性必须稳定。信任同样具有经济意义。第三方泄露数据库报告称，2024
              年有 50,002 条 Tibber
              记录暴露，包括姓名、电子邮件地址和用户名，但不含密码。该事件无法量化流失，却提高了对连接能源账户和家庭设备的平台的尽调要求。因此，在当前渗透率和单位经济性得到独立证明之前，估值应奖励已验证的经常性服务和灵活性经济性，而不是宽泛的能源支出
              TAM。
            claimRefs:
              - CM005
              - CM006
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把缺乏支持的宽泛 TAM 资本化
            body: 真正的投资判断问题是：在 Tibber 的运营市场中，有多少家庭可以通过服务费、设备和灵活性被激活并变现，而不是欧洲电力消费的总价值有多大。
            calloutType: risk
            claimRefs:
              - CM002
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              Tibber 的竞争者不只是另一家电力零售商。相关集合包括数字电价同业、垂直整合的家庭电气化供应商、传统公用事业、设备制造商应用、手动调度和公用事业自建编排系统。SetterVC 的示例名单列出 Octopus
              Energy、Rabot Energy、1KOMMA5 和 Ostrom 等欧洲竞争者，但其自身警告称名单可能不完整、过时或有误。因此，有用的区分应是战略性的，而不是穷尽式的：Octopus 和 Rabot
              在智能电价上最直接重叠，1KOMMA5 通过更宽的硬件与能源组合竞争，Ostrom 则瞄准数字优先的绿色电价买家。在自动化节省额不确定的市场，传统供电加手动控制体验较弱，但仍是切换成本低的现状方案。
            claimRefs:
              - CP002
              - CP003
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP013
              - CP015
      - number: '3.2'
        title: 能力广度与分发能力
        blocks:
          - type: paragraph
            body: >-
              公开描述一致将 Tibber 放在现货电力、应用分析以及电动车、热泵、太阳能设备和其他联网设备控制的交叉点上。Energify 报告其拥有超过 45 个集成，Enode 则称其在 Tibber
              更广泛的平台中运营连接层的一部分。这个供应商关系可以加快设备覆盖，但也意味着并非每个集成都由 Tibber 自有。竞争者资料显示，电动车优化和基于应用的动态电价在其他地方也已存在，1KOMMA5
              则把太阳能、热泵、电动车充电和能源管理器打包在一起。广度是优势，但现有证据没有表明这种广度具有排他性，或是资金充足的零售商、硬件供应商和软件合作伙伴无法复制的。
            claimRefs:
              - CP001
              - CP003
              - CP010
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP010
              - CP012
              - CP013
      - number: '3.3'
        title: 定价、包装与切换摩擦
        blocks:
          - type: paragraph
            body: >-
              研究池中唯一足够具体的当前价格来自 Energify 的瑞典页面：每 kWh 固定加价 6 öre（不含 VAT），另加可变的证书、平衡和交易成本。Energify
              还称该方案没有锁定期，这降低了采用时的合同摩擦，却也削弱了留存护城河。研究池没有 Octopus、Rabot、1KOMMA5 和 Ostrom
              的可比公开价格、实际折扣或合同条款，因此断言谁是价格赢家会制造虚假的精确度。切换成本似乎更多来自行为和技术，而非合同：已配置的自动化和联网设备可能带来便利，但开放接口与供应商支持的互操作性也可能使多平台使用或更换供应商更容易。
            claimRefs:
              - CP009
              - CP011
              - CP012
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP016
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Tibber 的防御力取决于能否可靠协调设备，并比竞争者更快地把已安装的连接转化为客户节省和电网价值。Enode
              的案例支持编排逻辑，但作为供应商发布的资料，它不是独立基准。历史客户和融资主张说明其有投资能力，却不能证明当前份额、留存或更优单位经济性。负面记录同样重要：Heroic 报告称 2024 年发生数据库泄露，影响
              50,002
              条记录并暴露姓名、电子邮件地址和用户名，同时称密码未暴露。研究池没有佐证事件的来源，因此应将该指控视为具体尽调线索，而不是已经确定的运营结论。总体而言，生态系统执行力可能构成护城河，但商品化和信任风险仍然重大。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP012
              - CP014
              - CP015
              - CP016
