            title: 信任证据需要独立确认
            body: Heroic 的泄露记录是具体的负面信号，但研究池中没有监管机构通知或第二份独立报告确认事件范围。
            calloutType: risk
            claimRefs:
              - CP014
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与质量
        blocks:
          - type: paragraph
            body: >-
              Tibber 的公开模式在结构上不只是电力转售。第三方和投资者资料称，电力商品按批发价或现货成本转嫁，而固定服务费将应用及相关运营变现。商店销售的智能家居设备增加交易收入，Tibber 自有 VPP
              描述则称电网运营商会为平衡服务付费，其中部分收入与参与家庭分享。这种组合可能让毛利摆脱对商品销量的依赖，但收入结构和分部利润率均未披露。因此，最可靠的公开结论只涉及机制，而非规模：服务、商业和灵活性收入有合理依据，但它们的贡献、确认方式和持久性仍未知。电力转售还意味着开票能源价值不能当作净收入、ARR
              或毛利。
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI011
