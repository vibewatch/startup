schemaVersion: "report-v2"
artifact: risks
slug: tibber
runDate: 2026-10-20
company:
  name: Tibber
chapter:
  number: 7
  title: Risks
  summary: >-
    The most consequential visible risks are customer-data exposure, app and device-orchestration
    reliability, cross-market compliance, variable retail economics, and dependence on external
    integration infrastructure. Public evidence identifies these exposures but does not establish
    current incident resolution, regulatory posture, service levels, runway, or concentration, so
    the investment posture should remain conditional on primary diligence.
sections:
  - id: regulatory-legal-and-data-risk
    title: Regulatory, legal, and customer-data exposure
    body: >-
      The strongest adverse signal in the assigned evidence is Heroic's report that 50,002 Tibber
      records were exposed in a November 2024 database breach, including names, email addresses,
      and usernames. Heroic is a low-reputation commercial breach index rather than a regulator or
      Tibber incident notice, so this is a diligence lead, not independently verified proof of the
      incident's scope or remediation. The potential exposure is nevertheless material because
      Tibber's own support page says the app can surface contracts, invoices, payment information,
      connected devices, and consumption data. Geographic scope is also unsettled: Wikipedia lists
      Norway, Sweden, Germany, and the Netherlands, while an updated Business Norway profile names
      only Germany, Norway, and Sweden. That discrepancy may reflect timing or product scope, but it
      prevents a clean jurisdiction-by-jurisdiction licensing assessment. The immediate mitigation
      test is documentary: require regulator correspondence, incident forensics, customer notices,
      privacy-control evidence, and a current license inventory before underwriting residual risk.
    claimRefs: [CR001, CR002, CR003, CR004, CR014, CR015, CR016]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: operational-customer-and-model-risk
    title: Operational reliability, customer outcomes, and model sensitivity
    body: >-
      Tibber's proposition depends on software coordinating market prices, household consumption,
      contracts, and connected devices. The company says feature availability varies by market,
      contract, and device, which creates a fragmented support surface and makes aggregate product
      claims poor substitutes for market-level reliability data. Business Norway says automation
      can shift electric-vehicle charging and heating to cheaper periods and cites consumption
      reductions of up to 20 percent, but the promotional profile provides no cohort definition,
      baseline, or independent replication. Energify separately describes quarter-hourly spot
      pricing, a fixed markup, and variable trading costs; this makes customer value sensitive to
      price volatility, behavior, and local tariff disclosure rather than guaranteed savings.
      Mitigation maturity is therefore unproven. Diligence should obtain market-level uptime,
      failed-automation rates, billing-error rates, complaint and churn cohorts, and realized
      savings distributions. A repeated high-severity billing or automation incident, or savings
      that disappear after all fees for core cohorts, would materially weaken the customer thesis.
    claimRefs: [CR003, CR004, CR007, CR008, CR012, CR013]
    tableRefs: [TR002]
  - id: partner-financial-and-thesis-break-risk
    title: Partner dependencies, financial opacity, and thesis-break triggers
    body: >-
      Device connectivity is not wholly internal. Enode says it operates a selected part of the
      connectivity and orchestration layer within Tibber's broader platform, while a Tibber
      executive quoted by Enode emphasizes that reliable connectivity is necessary for charging
      and automation to behave as expected at scale. This creates a real counterparty and interface
      dependency even though the evidence does not quantify concentration, outage history, or
      substitution cost. The broader model also spans subscription fees, hardware, and flexibility
      revenue according to Wikipedia, increasing execution surfaces and working-capital questions.
      Balderton documents historical investor participation, but funding raised is not current cash
      available; EquityZen's public page withholds current valuation and financial details behind
      registration. Before investment, require current cash, burn, collateral and hedging needs,
      bad-debt exposure, vendor concentration, and integration exit plans. Thesis-break triggers
      include loss of a critical integration without a tested fallback, persistent negative unit
      economics after trading and support costs, covenant or liquidity stress, or evidence that
      flexibility revenue cannot offset the complexity it adds.
    claimRefs: [CR005, CR006, CR009, CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk or rule
      - Jurisdiction or scope
      - Evidence status
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - Customer-data breach and privacy obligations
        - Tibber account holders; affected jurisdictions not established
        - Low-reputation breach index reports 50,002 records; no assigned regulator or company notice
        - Credible lead, unverified scope
        - High if confirmed
        - Unknown
        - Material until authoritative scope and remediation are produced
        - Obtain incident report, regulator correspondence, customer notices, and remediation audit
      - - Retail-energy licensing and consumer compliance
        - Norway, Sweden, Germany, and possible Netherlands scope
        - Public sources disagree on current operating footprint
        - Inherent multi-market exposure
        - High
        - Unknown
        - Market-by-market authorization and complaint exposure cannot be rated
        - Reconcile legal entities, licenses, regulator status, tariffs, and complaint records
      - - Pricing and fee disclosure
        - Market-specific dynamic electricity contracts
        - Independent comparison page reports fixed markup plus variable trading costs
        - Ongoing
        - Medium
        - Partial public disclosure
        - Misunderstood volatility or fees can drive complaints and churn
        - Test current terms, invoices, fee presentation, and savings claims in each market
    notes: >-
      Partial enumeration from the assigned public pool; likelihood and severity are qualitative
      diligence assessments, not measured incident probabilities, and no regulator record was available.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly visible data, market-scope, and tariff risks found in the assigned evidence as of
        2026-10-20; it is not a complete jurisdictional legal inventory.
    claimRefs: [CR001, CR002, CR003, CR004, CR012, CR014, CR015, CR016]
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood evidence
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Monitor or trigger
      - Unresolved gap
    rows:
      - - Customer-data compromise or account-targeted phishing
        - One uncorroborated breach-index report
        - High if confirmed
        - Unknown
        - Potential customer harm and regulatory response
        - New notices, regulator action, repeat exposure, or rising support fraud
        - No authoritative incident or remediation evidence
      - - App, billing, or contract-management outage
        - Core app functions include prices, consumption, contracts, invoices, and devices
        - High
        - Unknown
        - A single app surface concentrates multiple customer workflows
        - Availability, billing corrections, complaint volumes, and recovery time
        - No service-level or incident-history data
      - - Device automation behaves incorrectly or is unavailable
        - Features vary by market, contract, and connected device
        - Medium to high
        - Partial troubleshooting guidance
        - Savings and trust depend on compatible devices and reliable automation
        - Failed commands, device disconnects, delayed launches, and support contacts
        - No failed-automation or compatibility cohort metrics
      - - Customer savings fail to cover volatility and fees
        - Promotional savings claim lacks denominator; tariffs include variable trading costs
        - Medium
        - Unclear
        - Churn and complaints if realized savings disappoint
        - Net savings after all fees by market, load profile, and device cohort
        - No independently verified savings distribution
    notes: >-
      Severity is an analyst ranking grounded in the cited product surface and public risk signals;
      null operating rates remain diligence gaps rather than assumed zero incidence.
    claimRefs: [CR001, CR002, CR003, CR004, CR007, CR008, CR012, CR013]
  - id: TR003
    title: Partner, dependency, and financial-model risk register
    columns:
      - Dependency
      - Counterparty or market
      - Role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Device connectivity and orchestration
        - Enode
        - Operates a selected part of Tibber's broader integration layer
        - Not disclosed
        - Interface outage or commercial break degrades smart charging and device coverage
        - High
        - Require tested fallback, data portability, service levels, and transition rights
        - Unknown without dependency map and failover evidence
      - - Wholesale and spot-price exposure
        - Electricity and balancing markets
        - Input price and customer tariff basis
        - Business-model exposure identified; hedging not disclosed
        - Price spikes, trading costs, or imbalance costs erode value
        - High
        - Review hedging, collateral, pass-through, and stress tests
        - Unquantified margin and working-capital sensitivity
      - - Flexibility monetization
        - Grid and system operators
        - One stated revenue stream and customer-reward mechanism
        - Revenue share not disclosed
        - Regulatory, market-access, or performance changes reduce proceeds
        - Medium
        - Validate contracts, qualification rules, performance penalties, and market diversity
        - Strategic upside is visible but current economics are private
      - - Private capital and shareholder liquidity
        - Existing investors and secondary-market participants
        - Historical financing and potential private-share liquidity
        - Current cash, valuation, preferences, and available inventory not public
        - Runway pressure or punitive financing constrains execution
        - High
        - Obtain current cap table, cash, burn, debt, covenants, and financing plan
        - Historical investor support does not establish present liquidity
    notes: >-
      Public pages establish the existence of dependencies and historical investor support, not
      current concentration, cash availability, hedging, contractual protections, or runway.
    claimRefs: [CR005, CR006, CR009, CR010, CR011, CR012, CR013]
figures:
  - id: FR001
    title: Residual risk and mitigation-evidence matrix
    type: matrix
    summary: >-
      Qualitative heatmap of downside impact, evidence for likelihood, and publicly visible
      mitigation maturity; it does not assign quantitative probabilities.
    data:
      columns:
        - label: Impact
          detail: Potential downside if the risk materializes
        - label: Likelihood evidence
          detail: Strength of the assigned public evidence
        - label: Mitigation maturity
          detail: Publicly visible controls or fallback evidence
      rows:
        - label: Customer-data exposure
          note: One adverse breach-index report, without authoritative confirmation
          values:
            - label: High
              tone: high
              detail: Customer harm and regulatory consequences are plausible if confirmed
            - label: Limited
              tone: warning
              detail: The source is low reputation and uncorroborated in the assigned pool
            - label: Unknown
              tone: risk
              detail: No incident report or remediation audit was available
        - label: Multi-market compliance
          note: Public sources disagree on the current country footprint
          values:
            - label: High
              tone: high
              detail: Electricity retail is jurisdiction-specific
            - label: Moderate
              tone: warning
              detail: Multi-country activity is visible but license status is not
            - label: Unknown
              tone: risk
              detail: No current license inventory or regulator record was assigned
        - label: App and billing continuity
          note: One app surface covers prices, consumption, contracts, invoices, and devices
          values:
            - label: High
              tone: high
              detail: Outage or error can affect multiple customer workflows
            - label: Structural
              tone: warning
              detail: Product concentration is documented, incident frequency is not
            - label: Partial
              tone: warning
              detail: Troubleshooting exists, but service levels and history do not
        - label: Device-integration dependency
          note: Enode operates a selected part of the integration layer
          values:
            - label: High
              tone: high
              detail: Charging and automation rely on connectivity
            - label: Confirmed
              tone: warning
              detail: Partner dependency is stated directly by Enode and Tibber
            - label: Unknown
              tone: risk
              detail: No concentration, failover, or transition evidence was public
        - label: Retail economics and volatility
          note: Spot pricing and variable trading costs affect realized customer value
          values:
            - label: Medium-high
              tone: high
              detail: Weak savings can impair retention and margins
            - label: Moderate
              tone: warning
              detail: Tariff structure is visible; cohort economics are not
            - label: Unknown
              tone: risk
              detail: Hedging and realized savings distributions were unavailable
        - label: Financing and liquidity
          note: Historical investor participation does not establish current cash availability
          values:
            - label: High
              tone: high
              detail: Liquidity stress can constrain a capital-intensive retailer
            - label: Limited
              tone: warning
              detail: Current valuation and financials were not publicly accessible
            - label: Unknown
              tone: risk
              detail: No current cash, burn, covenants, or financing plan was assigned
    approximationNotes: >-
      Ordinal labels synthesize cited evidence and explicit gaps; they are not probability estimates,
      audited control ratings, or substitutes for regulator, incident, contract, or financial records.
    claimRefs: [CR001, CR004, CR005, CR010, CR012, CR016]
callouts:
  - calloutType: risk
    title: Investment posture remains diligence-dependent
    body: >-
      Do not interpret the lack of authoritative incident, regulator, reliability, or financial
      records in this pool as evidence of clean performance. Require primary documentation before
      underwriting cyber remediation, jurisdictional compliance, partner resilience, or runway.
    claimRefs: [CR001, CR011, CR014, CR015, CR016]
