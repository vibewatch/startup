- 'id': 'capital-adequacy-comp-calibration'
  'title': 'Capital adequacy remains unverified, so public comps are calibration only'
  'body': |-
    Loft’s public file does not disclose cash on hand, debt, project finance, launch-prepayment obligations, or a runway model. That is the biggest practical underwriting blocker in chapter 4. Management’s language about profitability and business sustainability at least shows that the Series C was not merely opportunistic growth capital; it was also part of the path to a more durable financial profile. Orbitworks adds nuance rather than clarity. More than $100 million of initial JV capital and component commitments for the first ten satellites clearly help with production scale, but that capital sits in a joint-venture context and is not evidence of unrestricted parent-company liquidity. Similarly, DESIR and other sovereign programs show demand and strategic trust, but public contract values do not cleanly translate into Loft revenue or margin.

    That is where public comps are useful, but only as calibration. Planet’s filing shows that space-services arrangements can bundle engineering, launch procurement, ground infrastructure, and operations, while still producing large net losses and capital-intensity warnings. Spire shows a public company that discloses ARR, retention, discounts, and longer sales cycles — exactly the kind of data Loft does not publish. Rocket Lab shows that far larger scale can still coexist with losses and concentrated backlog. Momentus is the opposite end of the range: thin cash, ongoing capital needs, and going-concern pressure. Together those comps bracket the sector, but they do not let an investor infer Loft’s own cash profile by analogy alone.
