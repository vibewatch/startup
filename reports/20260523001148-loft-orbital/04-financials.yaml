- 'id': 'underwriting-limits-adverse-view'
  'title': 'Opacity and execution burden are the main adverse financial view'
  'body': |-
    The adverse case is not that public evidence shows weak demand. It does not. Loft appears to have real customer pull, real program wins, and real investor support. The adverse case is that the company’s public narrative is optimized around execution milestones — six-satellite launches, AI workflows, sovereign programs, production JVs, and platform abstractions — while the core financial disclosure needed for underwriting remains absent. That creates an easy analytical trap: bookings can look like revenue, contract scope can look like backlog quality, and AI mission demos can look like software monetization, even when none of those mappings is disclosed. Management’s sustainability language reinforces the point that the company is still in transition rather than already financially settled.

    Execution burden makes the opacity matter more. Loft is not running a lightweight software model; it is coordinating satellites on the shelf, launch schedules, constellation deployment, sovereign-space programs, and growing on-orbit AI workloads across multiple jurisdictions. That can be a source of moat, but it also raises the cost of being wrong on working capital, hardware margins, and program timing. The correct underwriting stance from public evidence is therefore conservative: treat public comps as calibration, treat bookings and contract values as demand indicators only, and require direct diligence access to revenue schedules, cost structure, cash runway, concentration, and contract economics before turning the story into a model.
