  'title': 'Capital efficiency appears better than many space peers'
  'body': |-
    The pre-Series-C bookings-to-capital ratio above 3.1x is one of the most encouraging public signals in Loft’s file. It suggests standardization and disciplined commercial execution may be working, even though margin and cash conversion are still hidden.
  'claimRefs':
