- id: TP002
  title: Feature / capability matrix
  columns:
  - Buying criterion
  - Loft evidence
  - Stronger or alternate competitor evidence
  - Why it matters
  rows:
  - - Payload / bus abstraction
    - Hub and Cockpit abstract payloads from buses and mission operations
    - Airbus, Sidus, and Spire offer configurable buses or hosted payloads, but with less explicit application-layer abstraction
    - Determines whether the buyer can treat spacecraft as infrastructure instead of as a custom engineering project
  - - On-orbit software deployment
    - Virtual missions plus YAM-6 and YAM-9 let customers deploy software to Loft-owned resources
    - No direct peer in this source pack markets an equally explicit SDK-plus-app-deployment workflow; Planet offers data workflows instead
    - This is Loft's clearest route beyond classic hosted-payload competition
  - - Secure or sovereign mission handling
    - Loft pairs sovereign French wins with a shared-infrastructure and data-control narrative
    - Spire is stronger on explicit encrypted RF handling and GovCloud language; OneWeb is stronger on communications-network security
    - Security-sensitive buyers may choose the provider with the most explicit trust and control posture
  - - Launch control and schedule ownership
    - Loft emphasizes simplification and schedule compression, but not owned launch infrastructure
    - Rocket Lab owns launch sites and cadence; Exolaunch is strong on launch integration and deployment
    - Launch control can absorb the budget before mission-abstraction tools are considered
  - - Downstream outcome ownership
    - Loft sells mission infrastructure rather than a large downstream data or connectivity product
    - Planet owns a data flywheel and analytics platform; OneWeb sells the communications outcome directly
    - When a buyer wants answers or bandwidth, integrated outcome vendors can displace neutral infrastructure
  - - Industrial manufacturing scale
    - Loft public materials emphasize standardization and reuse, not disclosed installed fleet scale at Airbus levels
    - Airbus / OneWeb shows 600-plus-satellite industrial production and ARROW buses with large installed base
    - Industrial scale matters for buyers that care most about proven manufacturing throughput and installed heritage
  notes: This table is a source-pack synthesis rather than a product audit. Competitor evidence reflects what is explicitly stated in retrieved public materials, not a claim that capabilities are identical or directly interchangeable.
