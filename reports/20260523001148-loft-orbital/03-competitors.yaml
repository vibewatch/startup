- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Mission abstraction via Hub and Cockpit
    - Standardized mission layers from Spire, Rocket Lab, and Airbus can narrow differentiation
    - High
    - Prove faster integration, higher reuse, and lower non-recurring engineering than peers on actual contracts
  - - Virtual missions and on-orbit app deployment
    - Outcome vendors or peers can add software layers while buyers skip Loft for data or launch bundles
    - High
    - Quantify repeat software usage, app-deployment attach rate, and customer willingness to pay for the software layer
  - - Sovereign-ready shared infrastructure
    - Large incumbents and national champions can offer more domestic-control content or political comfort
    - Medium
    - Show source-selection wins, local-partner structure, and application or data-control terms in sovereign programs
  - - Schedule compression and simplicity
    - Rocket Lab and Exolaunch can win when launch control or launch integration is the decisive bottleneck
    - High
    - Benchmark contract-close-to-launch time and failed bid reasons versus launch-led rivals
  - - Flexible buyer fit across multiple mission types
    - Planet and OneWeb can pull budgets toward outcomes, while Spire can pull RF-specific missions away
    - Medium
    - Segment pipeline by mission type and identify which workloads truly require Loft's neutral infrastructure layer
  - - Quote-led economics
    - Low pricing transparency and moderate switching costs can compress margins as buyers multi-home
    - High
    - Request win-loss, renewal, discounting, and gross-margin data by mission type before underwriting durability
  notes: Severity reflects how directly each threat can displace Loft from a mission budget using only source-backed competitor strengths; it is not a probability-weighted downside model.
