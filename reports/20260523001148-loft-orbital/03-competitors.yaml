  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Realized contract pricing, discounting, minimum commitments, and gross-margin by mission type for Loft and the closest infrastructure peers.
    whyItMatters: Public pages describe packaging logic but do not show the economics needed to know whether Loft wins on price, performance, or margin structure.
    diligencePath: Request current customer proposals, signed statements of work, and pricing policy by mission class for Loft, then benchmark against direct customer references for Spire, Sidus, and launch-led alternatives.
    relatedQuestionRefs:
    - QP014
    - QP027
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: switching-cost
    missingEvidence: Comparable renewal, win-loss, multi-homing, and deployment-retention data across Loft and adjacent competitors.
    whyItMatters: Without renewal or win-rate evidence, the chapter can describe switching paths but cannot prove whether Loft enjoys durable lock-in or only temporary category fit.
    diligencePath: Ask management for cohort retention, repeat-program rates, and recent competitive win-loss analysis segmented by sovereign, commercial, and software-defined missions.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: private-evidence-only
    severity: minor
    topic: sovereign-selection
    missingEvidence: Program-level source-selection criteria and domestic-content requirements for sovereign buyers comparing Loft against Airbus, Rocket Lab, or Spire.
    whyItMatters: The public sovereign wins show relevance, but they do not fully reveal how much of the buying decision turned on software abstraction versus local-content, security, or industrial-policy requirements.
    diligencePath: Review proposal requirements, local-partner obligations, and security-control matrices for recent sovereign awards before assigning durable competitive advantage to the sovereign narrative alone.
    relatedTableRefs:
    - TP001
    - TP004
