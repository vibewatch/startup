- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company / package
  - Public price / unit / contract model
  - Included capabilities
  - Discount / unknowns
  - Implication
  rows:
  - - Loft physical or virtual missions
    - Custom quote; mission contract or app-deployment engagement; no public list price in retrieved pack
    - Integration, launch procurement, mission ops, or on-orbit application access
    - Realized pricing, discounts, and contract minimums are undisclosed
    - Diligence must rely on direct customer or management evidence, not website price cards
  - - Spire Space Services
    - Public capex-to-opex framing; exact hosted-payload pricing not disclosed
    - Hosted RF payloads, custom builds, encrypted data handling, mission delivery
    - Rates, term length, and bundle mechanics are not public in the retrieved sources
    - Closest public peer to Loft on economic framing, but still quote-led
  - - Planet data platform and satellite services
    - Subscription and usage-based pricing for data; milestone-based satellite-services economics not publicly itemized
    - Data, tasking, analytics platform, and satellite-services arrangements
    - Transparent pricing language is clearest on data platform access, not on bespoke satellite services
    - Planet is the strongest packaging counterexample because it monetizes outcomes as well as infrastructure
  - - Rocket Lab launch and space systems
    - Project-based contracts implied; no public list pricing in retrieved 10-K excerpt
    - Launch, spacecraft, ground services, and on-orbit management
    - Bundle mix and realized pricing are undisclosed
    - Bundling can undercut standalone infrastructure vendors on total program ownership
  - - Eutelsat OneWeb connectivity service
    - Service-contract model; public list pricing absent on retrieved page
    - Network access, terminals, security, support, rapid deployment
    - Bandwidth terms and volume discounts are not public here
    - Substitute when the buyer wants bandwidth and availability rather than a mission stack
  - - Exolaunch integration services
    - Custom launch-integration quote; no public price card in retrieved page
    - Mission management, launch procurement, deployment hardware, integration support
    - Exact economics, discounting, and hardware-only pricing are not public
    - Launch-prep budgets can flow to Exolaunch before Loft competes on in-orbit functionality
  notes: This chapter can compare packaging logic more confidently than realized pricing. The retrieved public materials are mostly quote-led, so unknowns are material rather than cosmetic.
