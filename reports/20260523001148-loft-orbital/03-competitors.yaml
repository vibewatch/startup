chapter:
  number: 3
  title: Competitors
  summary: Loft's closest overlaps are infrastructure-led peers such as Spire, Sidus, and Momentus, but the harder competitive pressure often comes from integrated substitutes and adjacencies such as Planet, Rocket Lab, Airbus/OneWeb, and Exolaunch. Loft is best differentiated where Hub/Cockpit, virtual missions, and sovereign-ready shared infrastructure matter; rivals are stronger where launch control, RF specialization, public scale, data flywheels, or installed base drive the purchase.
sections:
- id: layered-landscape
  title: The competitive set is layered, not a single peer list
  body: 'Loft competes in a layered market rather than in a neat one-to-one hosted-payload bracket. The closest overlap comes from vendors that explicitly sell shared satellite infrastructure or hosted-payload style services, but real budget competition also exits Loft’s lane in several other directions. Planet can satisfy buyers that actually want imagery, tasking, and analytics outcomes more than a neutral mission substrate. OneWeb can satisfy connectivity demand outright. Rocket Lab, Airbus, and Exolaunch can absorb budget on launch control, spacecraft manufacturing, or mission integration before Loft ever enters the room.


    The broader market evidence supports that framing. BryceTech shows that smallsat activity is large, but communications satellites dominate unit volume, which means much of the market sits inside captive or vertically integrated constellations rather than open infrastructure procurement. Novaspace similarly highlights open versus captive structures and separates integrators, launch brokers, and last-mile logistics as distinct layers. Internal build remains a live status-quo alternative for sophisticated government, defense, or constellation buyers that can assemble launch, buses, and operations themselves. Diligence should therefore compare Loft against direct space-infrastructure peers, vertically integrated substitutes, launch and manufacturing adjacencies, and internal build paths rather than against one generic “space services” bucket.'
