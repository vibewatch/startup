tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Loft Orbital
    - Direct benchmark
    - Private; $170M Series C in Jan 2025; scaling to 10+ launches/year
    - Payload owners, sovereign programs, software-first teams
    - Hub/Cockpit abstraction, virtual missions, sovereign-ready framing
    - Private pricing, renewal, and realized economics remain undisclosed
  - - Spire
    - Direct hosted-payload / space-services peer
    - 199+ satellites deployed; 600+ years of LEMUR heritage; ~$0.81B public market cap
    - Government, defense, civil, RF missions
    - Hosted RF payloads, encrypted handling, RF specialization, installed fleet
    - More RF-centric than Loft; less explicit open app-deployment story
  - - Sidus Space
    - Direct smaller bus/ops peer
    - Public micro-cap; 2026 annual report listed; 35,000 sq ft integration facility
    - Government, defense, intelligence, commercial missions
    - Own satellite system plus manufacturing and mission operations
    - Smaller apparent installed base and thinner software-abstraction narrative
  - - Momentus
    - Direct but weaker-capitalized orbital-infrastructure peer
    - Public nano-cap; ~$73.74M market cap; 2026 balance-sheet rebuilding narrative
    - Customers needing buses, transportation, or in-orbit services
    - Broad orbital-infrastructure framing
    - Weaker public scale and confidence signals than Spire or Rocket Lab
  - - Planet
    - Vertically integrated data / space-services substitute
    - Hundreds of satellites; 3,000+ images/day; ~$15.80B public market cap
    - Government and enterprise Earth-data buyers
    - Data flywheel, recurring subscriptions, tasking, satellite services
    - Customers often buy outcomes and platform access, not neutral mission abstraction
  - - Rocket Lab
    - Launch + space-systems adjacency
    - 54 successful orbital missions; 200+ spacecraft; ~$78.57B public market cap
    - Government and commercial smallsat operators
    - Launch control, flight heritage, bundled launch plus spacecraft stack
    - Less explicit software-abstraction or virtual-mission layer than Loft
  - - Airbus
    - Industrial manufacturing incumbent
    - OneWeb-derived production system; ARROW150 flight-proven with 618 satellites on orbit
    - Government and commercial constellation builders
    - Design-for-manufacturing and industrial installed base
    - More platform and manufacturing oriented than application-layer focused
  - - Eutelsat OneWeb
    - Outcome substitute
    - 600+ satellite network with multilayered security
    - Connectivity buyers on land, sea, and air
    - Installed global network and direct communications outcome
    - Not a general hosted-payload or virtual-mission platform
  - - Exolaunch
    - Launch / integration adjacency
    - 100% hardware reliability claim; 95%+ customer reuse claim
    - Smallsat operators needing launch integration and deployment
    - Launcher relationships, mission management, deployment heritage
    - No public evidence of Loft-like virtual mission or app layer
  notes: Rows use public evidence from product pages, filings, and market-cap snapshots. Public market cap is used only as a scale proxy for public peers, not as a direct valuation analog for private Loft.
