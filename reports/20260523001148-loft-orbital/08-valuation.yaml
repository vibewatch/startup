  evidenceGaps:
  - type: missing-source
    severity: material
    topic: sovereign-program-economics
    missingEvidence: Program-level revenue allocation, margin share, and payment milestones for the CNES and DESIR awards.
    whyItMatters: The public file proves sovereign demand but still does not show how much of the program value accrues to Loft or at what profitability.
    diligencePath: Request the signed statements of work, milestone schedule, and revenue-recognition policy for the CNES and DESIR programs.
    relatedQuestionRefs:
    - QV011
  - type: enumeration-incomplete
    severity: minor
    topic: public-comparable-set
    missingEvidence: A cleaner public hosted-payload pure play and an extracted 2025 Spire revenue base that matches the May 2026 market-cap date.
    whyItMatters: The comparable table is directionally useful, but mixed business models and mixed reporting vintages make any precise Loft multiple fragile.
    diligencePath: Refresh the public comp set with the next available hosted-payload peer filings and re-run the market-cap to revenue math on synchronized periods.
    relatedQuestionRefs:
    - QV017
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-conversion-and-margin
    missingEvidence: Recognized revenue, deferred revenue, gross margin, and contract pass-through detail by mission type and by flagship program.
    whyItMatters: Without revenue conversion and margin detail, the difference between a fair low-unicorn mark and an overvalued one cannot be underwritten with high confidence.
    diligencePath: Request audited 2025 and year-to-date 2026 revenue by stream plus gross-margin bridges for EarthDaily, sovereign programs, and virtual missions.
    relatedQuestionRefs:
    - QV021
    - QV029
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-runway
    missingEvidence: Current cash balance, debt, preference stack, liquidation waterfall, and downside runway sensitivity after the Series C.
    whyItMatters: Capital structure and runway determine whether the headline post-money is really investable for new money or heavily encumbered by senior claims.
    diligencePath: Obtain the post-Series-C cap table, term sheet summary, debt schedule, and monthly cash runway model before underwriting any entry.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
