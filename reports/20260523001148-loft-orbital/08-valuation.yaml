- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or signal
  - Transmission to thesis
  - Action implication
  rows:
  - - Bookings do not convert into revenue
    - Private diligence shows weak near-term conversion or heavy pass-through content
    - The fair-value case loses its core economic bridge.
    - Move from track to avoid or demand a much lower entry.
  - - Flagship programs slip materially
    - EarthDaily, CNES, or sovereign follow-ons miss schedule or scope expectations
    - Execution proof weakens and the bull case range compresses quickly.
    - Re-underwrite valuation on slower cadence and lower confidence.
  - - Preference stack is heavy
    - Series C and earlier rounds create meaningful senior overhang over new common-equivalent money
    - Headline post-money stops mapping to actual investor economics.
    - Demand cap-table transparency or step away from the round.
  - - Customer concentration is too high
    - A few programs dominate revenue, backlog, or cash collection
    - Downside asymmetry rises because one slip can reset the whole model.
    - Require concentration haircuts in any underwriting model.
  - - Going-concern-like behavior appears in peers or sector sentiment
    - Space-service public comps re-rate downward on financing stress or weak conversion
    - Private marks can lose support even if Loft executes operationally.
    - Use public-peer stress as a reason to widen required return.
  notes: These are not generic operating risks; they are the specific failure modes that would invalidate a fair-value reading of the current mark.
