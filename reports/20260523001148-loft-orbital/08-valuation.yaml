- id: scenario-range-and-underwriting-stance
  title: The underwriting stance is track and fair until private revenue, margin, and capital data are opened
  body: |-
    The scenario work therefore has to stay explicitly caveated. In a bear case, Loft lands closer to $0.6B to $0.8B if recognized revenue proves materially below annualized contract heuristics, if program delays weaken confidence in constellation execution, or if comp discipline resets toward Spire-like single-digit multiples. In a base case, a range around $0.9B to $1.1B is defensible if current bookings, sovereign awards, and constellation programs translate into roughly $90M to $120M of annual revenue-like scale without establishing software-like margins. A bull case of roughly $1.2B to $1.5B needs more than today's public file: follow-on sovereign wins, clean EarthDaily-style execution, and evidence that AI or virtual missions carry incremental economics rather than only narrative value.

    That range is why the recommendation should remain price-sensitive and diligence-sensitive. The public file supports track, medium confidence, high risk, and fair valuation stance. It does not support a buy call at any price, because the decisive variables remain private: recognized revenue by program, gross margin by stream, cash and runway, cap-table preferences, and the actual conversion of bookings into revenue and cash. The thesis should break if that private diligence shows weak conversion, heavy preference overhang, or slippage in the flagship sovereign and constellation programs that currently do most of the work in the upside narrative.
