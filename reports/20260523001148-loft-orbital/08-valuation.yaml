- id: TV001
  title: Recommendation summary table
  columns:
  - Decision field
  - Current view
  - Decision implication
  rows:
  - - Recommendation
    - track
    - Monitor for private revenue disclosure or a materially better entry rather than underwriting the current mark as obviously cheap.
  - - Confidence
    - medium
    - The direction of the evidence is clear, but the economic engine remains only partially disclosed.
  - - Risk rating
    - high
    - Capital intensity, contract-conversion uncertainty, and preference overhang can all alter realized investor outcomes.
  - - Valuation stance
    - fair
    - The low-unicorn mark is plausible on current evidence, but not discounted enough to absorb major disclosure disappointment.
  - - Entry discipline
    - Prefer low-unicorn pricing with diligence access
    - A sharp buy case needs verified revenue, margin, and cap-table data, not just bookings headlines.
  - - Upgrade trigger
    - Verified revenue conversion plus cleaner capital structure
    - A move from track to buy needs revenue schedules, gross margin, and liquidation-waterfall clarity.
  notes: This is a recommendation on valuation support and underwriting quality, not on whether Loft is a strategically interesting company.
