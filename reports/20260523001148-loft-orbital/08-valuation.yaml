- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Recognized revenue by program
    - Quarterly revenue by EarthDaily, sovereign, rideshare, and virtual-mission streams
    - This is the missing bridge between bookings headlines and valuation support.
    - Request audited 2025 and year-to-date 2026 revenue schedules by program and stream.
  - - Gross margin by stream
    - Cost of revenue split across hardware, launch pass-through, operations, and software layers
    - A fair low-unicorn mark depends on economics, not only on commercial demand.
    - Obtain gross-margin bridge and contract-level contribution margin for flagship programs.
  - - Cash and runway
    - Current cash, debt, burn, and downside runway assumptions
    - Runway determines whether the current mark is durable or just a bridge to the next financing.
    - Review latest balance sheet, debt schedule, and monthly cash model.
  - - Cap-table preferences
    - Liquidation stack, anti-dilution, and senior rights from prior rounds
    - Headline post-money can badly overstate new-money economics if senior claims are heavy.
    - Request post-Series-C cap table and summary of investor rights.
  - - Backlog conversion and cancellations
    - Milestone timing, customer deposits, termination clauses, and collections history
    - Bookings quality is the single biggest unknown in Loft's valuation story.
    - Review top contracts with cancellation and billing terms.
  - - Customer concentration and renewal
    - Share of revenue, backlog, and growth tied to top accounts and sovereign programs
    - A few accounts can make a fair mark look cheap or expensive depending on durability.
    - Ask for top-10 customer mix, renewal history, and concentration stress tests.
  notes: These diligence asks are the minimum package required to move from fair-and-track toward a true priceable underwriting case.
