companyProfile:
  summary: >-
    Loft Orbital is a French-American space infrastructure company founded in January 2017.
    It packages standardized satellite hardware, mission integration, launch, operations,
    and software-defined virtual missions into one platform built around Hub, Cockpit,
    and related compute tooling. Public evidence shows meaningful traction across both
    commercial and sovereign programs, especially EarthDaily's 10-satellite constellation,
    NASA-linked and SDA work through Loft Federal, and French sovereign contracts including
    DESIR. After a $170 million Series C in January 2025, the best-supported public read is
    a roughly $1 billion valuation with about $330 million of lifetime funding, while
    exact revenue, margin, and governance visibility remain limited.
  foundedDate: "2017-01-01"
  founders:
    - name: Pierre-Damien Vaujour
      role: CEO & co-founder
      claimRefs: [CO006]
    - name: Alex Greenberg
      role: COO & co-founder
      claimRefs: [CO006]
  foundingLocation: San Francisco, CA / Toulouse, France
  headquarters: San Francisco, CA / Toulouse, France
  productSummary: >-
    Standardized mission infrastructure spanning physical hosted or turnkey missions and
    software-defined virtual missions. Core surfaces include the Hub universal payload
    interface, Cockpit mission-control software, HubKit integration tooling, and growing
    on-orbit compute and AI infrastructure that lets customers deploy applications without
    building bespoke spacecraft.
  customerFocus: >-
    Governments, national-security and civil-space programs, Earth-observation companies,
    research institutions, and commercial operators that need faster mission deployment,
    constellation execution, or on-orbit software and AI infrastructure.
  businessModel: >-
    Sells end-to-end mission infrastructure—payload integration, launch procurement,
    spacecraft operations, and related platform services—while expanding into software-led
    virtual missions and on-orbit compute or AI workloads on Loft-owned shared infrastructure.
  stage: Series C
  fundingStatus: >-
    $170 million Series C announced in January 2025; the best-supported lifetime funding
    total is about $330 million, while public valuation evidence clusters around roughly
    $955 million to above $1 billion.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO005, CO006, CO008, CO010, CO016, CO017, CO022, CO040, CE005, CE006, CU002, CU027]
summary:
  headline: >-
    Loft Orbital has credible platform, constellation, and sovereign traction, but limited
    financial disclosure and execution dependencies keep the stock of evidence at track,
    not buy, around an approximately $1 billion valuation.
