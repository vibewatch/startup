- id: customer-concentration-and-sovereign-execution
  title: Customer concentration and sovereign-program execution risk
  body: |-
    Public proof of demand is real, but it is concentrated in a way that matters for risk. EarthDaily remains the strongest commercial reference customer because the customer itself describes scope across ten buses, payload integration, launch, and operations, then later confirms Loft is integrating, launching, and operating the ten-satellite system. That is unusually strong validation for a private space company, but it also makes EarthDaily disproportionately important to public perception. If EarthDaily slips, underperforms, or suffers an anomaly, the damage would hit not only near-term execution optics but also Loft’s best commercial reference account.

    Government and sovereign work add stickiness and complexity at the same time. Viasat’s NASA relay demo, SDA NExT participation, CNES’s multi-year EO award, and the French sovereign SAR program all reinforce that Loft can win institutional missions. Yet those programs are execution-heavy, security-heavy, and often long-dated. Loft’s CNES announcement points to a Q4 2026 first satellite and a ten-satellite architecture, while Breaking Defense says the separate sovereign SAR demonstrator is projected for 2029 and notes Loft would not discuss future options. That is a classic sovereign-program pattern: strategic relevance rises before revenue timing and option value are fully transparent. Investors should therefore treat customer diversification as supported, but concentration and sovereign execution risk as still material until private backlog and milestone detail are available.
