- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Launch / manifest concentration
    - Flagship schedule slip count
    - Two successive flagship missions miss target windows by more than one quarter
    - Cut confidence in cadence and reassess backlog conversion
  - - Bus / supply-chain bottleneck
    - Supplier delivery variance
    - Material bus slippage against public EarthDaily / CNES windows
    - Reduce probability of 10+ annual mission execution
  - - Mission failure / warranty exposure
    - Launch loss or major on-orbit anomaly
    - Any flagship mission loss without clearly documented insurance or warranty allocation
    - Pause until liability stack is audited
  - - Customer / sovereign concentration
    - Backlog mix disclosure
    - Evidence one or two programs dominate bookings or cash collection
    - Treat the case as concentration-led, not diversified infrastructure
  - - Export / security non-compliance
    - Authorization or security incident
    - Missed export authorization, accreditation setback, or serious data-handling breach
    - Move to avoid pending compliance remediation
  - - Capital / valuation opacity
    - Fundraising or cash-conversion signal
    - Punitive raise, covenant stress, or inability to evidence path to sustainability
    - Re-rate valuation and require full financial diligence
  notes: These are diligence heuristics rather than public company guidance. They translate the public fact pattern into thresholds an investor can monitor during follow-up work.
