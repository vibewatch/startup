- id: TR001
  title: Regulatory / legal risk register
  enumerationScope:
    coverage: partial
    basis: Covers the main public regulatory and legal surfaces visible in Loft’s current mission mix; private licenses, contract schedules, and security accreditations remain management-only artifacts.
  columns:
  - Rule / issue
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - FCC streamlined small-satellite fit
    - United States
    - Applicable when missions use the <=10 satellite streamlined path
    - Medium
    - High
    - Use specialist licensing counsel and design spectrum plans early
    - Constellation scope or design changes can fall outside the streamlined assumptions
    - Request filing history, waiver use, and per-mission spectrum plan
  - - NOAA remote-sensing licensing
    - United States
    - Potentially applicable where payloads create remote-sensing obligations
    - Medium
    - High
    - Run pre-filing consultation and freeze payload descriptions early
    - Review timing can still move schedules if mission scope changes late
    - Request license matrix by payload and any pending amendments
  - - EAR export-classification and licensing
    - United States / cross-border
    - Live requirement for hardware, software, and technical data transfers
    - High
    - High
    - Classify items, screen end use/end user, and use SNAP-R or exceptions where valid
    - Cross-border payload work or sovereign missions can still trip authorization delays
    - Request ECCN matrix, screening workflow, and outside-counsel memo
  - - ITAR-controlled defense work
    - United States / allied defense
    - Defense-adjacent missions can create State Department handling obligations
    - Medium
    - High
    - Segregate controlled data and maintain trained personnel and records
    - ITAR scope can narrow staffing flexibility and slow collaboration
    - Request commodity-jurisdiction record, training logs, and access-control matrix
  - - Privacy / data-policy obligations
    - Multi-jurisdiction
    - Public policy exists but customer-specific obligations are not public
    - Medium
    - Medium-High
    - Use DPAs, access controls, and clear data-location rules
    - Cross-border analytics and sovereign customers can impose bespoke obligations
    - Request DPA template, incident-notice clauses, and data-residency policy
  - - Sovereign security obligations
    - France / allied sovereign customers
    - French programs explicitly emphasize sovereign data chains and secure operations
    - Medium-High
    - High
    - Use sovereign ground segments and role-based mission partitioning
    - A security or accreditation miss could delay revenue and damage future institutional awards
    - Request accreditation path, subcontractor obligations, and milestone-security gates
  notes: Rows are ordered by likely residual impact on schedule, institutional access, and financing. Public sources identify the control surfaces, but not mission-by-mission license status.
