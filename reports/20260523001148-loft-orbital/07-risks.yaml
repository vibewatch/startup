- id: regulatory-export-control-security
  title: Regulatory, export-control, security, and cyber risk
  body: |-
    Loft’s move toward sovereign, defense-adjacent, and AI-enabled missions raises the regulatory bar. FCC guidance for streamlined small satellites imposes bounding assumptions around system size and mission duration, while NOAA’s remote-sensing process introduces a formal pre-filing and review path that can shift schedules if payload scope changes. Once missions cross borders or involve controlled hardware, software, or technical data, export-control workflows become a real operating constraint rather than a legal footnote. The Office of Space Commerce, BIS, and DDTC materials collectively show that teams must decide whether items fall under EAR or ITAR-style handling, classify them correctly, screen end use and end users, and maintain compliance after authorization.

    Security and cyber risks also matter more than they did when Loft was a simpler hosted-payload operator. The CNES program explicitly relies on a sovereign ground segment for secure control of the data chain, and the YAM-9 article frames Loft’s future around sovereign-ready AI constellations. Meanwhile, the Tailscale case study shows that even internal networking once created friction across a 300-person global organization. That is a useful mitigation story, but it also confirms that basic operational resilience and access control are part of the delivery stack. Public sources show the existence of a data policy and several compliance surfaces; they do not show audit results, classified-program controls, or a detailed export-jurisdiction map. That gap is manageable for a memo, but not dismissible.
  claimRefs:
