  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: launch-provider-concentration
    missingEvidence: Mission-by-mission launch-provider allocation, reserved rideshare slots, pricing protection, and any dedicated launch commitments.
    whyItMatters: Public rideshare economics are visible, but the real exposure depends on how much of Loft’s flagship manifest is tied to one provider and how much schedule flexibility it has contractually.
    diligencePath: Request the 2026 manifest by mission, launch-provider contract summaries, rebooking rights, and launch-insurance schedule.
    relatedQuestionRefs:
    - QR003
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: mission-insurance
    missingEvidence: Master service terms covering launch failure, on-orbit anomaly liability, warranty allocation, and insurance proceeds.
    whyItMatters: The bundled mission model means a single failure can hit cash recovery, customer retention, and reputation at the same time.
    diligencePath: Request sample customer MSAs, launch / in-orbit insurance summary, and post-failure escalation responsibilities.
    relatedQuestionRefs:
    - QR008
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Active customer count, top-program share of bookings and revenue, renewal profile, and backlog concentration by program family.
    whyItMatters: Public proof can show real demand while still masking a business that depends heavily on one or two flagship programs.
    diligencePath: Request customer cohort tables, backlog mix, top-five program exposure, and renewal history by segment.
    relatedQuestionRefs:
    - QR009
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: sovereign-security-controls
    missingEvidence: Security accreditation path, export-jurisdiction decisions, and subcontractor-control matrix for sovereign and defense-adjacent missions.
    whyItMatters: French and defense-related programs can be delayed by compliance or security misses even when the technical spacecraft work is on track.
    diligencePath: Request program security plan, export-control memos, and milestone checklist for sovereign customer acceptance.
    relatedQuestionRefs:
    - QR018
    relatedTableRefs:
    - TR001
