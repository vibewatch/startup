- id: launch-supply-chain-mission-assurance
  title: Launch, supply chain, and mission-assurance risk
  body: |-
    The operational core of Loft’s model is also its first-order risk vector. TechCrunch describes Loft as buying standard satellites from suppliers such as Airbus and LeoStella, then handling payload integration, launch, and ground-segment complexity for customers. That abstraction layer is commercially valuable because customers avoid bespoke spacecraft work, but it means Loft is exposed wherever any upstream element slips. The company’s own Series C post says launch-side progress in the industry did not eliminate satellite-side schedule risk, and the April 2023 Airbus OneWeb order shows Loft still has to actively secure bus supply to keep cadence intact. Orbitworks helps as a mitigation, but the UAE ramp is still early enough that it should be treated as a capacity option, not as de-risked proof.

    The launch side is similar. Loft’s materials reference rideshare programs, and SpaceX’s current rideshare page makes clear that shared-launch economics come with timetable assumptions and rebooking rules rather than guaranteed dedicated control. That is not a criticism of SpaceX specifically; it is the reality of a shared-manifest model. The result is that a payload slip, bus delay, or late integration issue can move from engineering nuisance to commercial risk. Loft’s HubKit testbed is a real mitigation because it pushes debug earlier and aims to remove last-minute surprises. But public materials do not show failure-rate data, insurance allocation, or a detailed split of missions by launch provider, so the residual exposure remains meaningful.
  claimRefs:
