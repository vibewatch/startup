      - number: '7.3'
        title: 客户集中和主权项目执行风险
        blocks:
          - type: paragraph
            body: >-
              需求的公开证明确实存在，但集中方式本身构成风险。EarthDaily 仍是最强的商业参考客户，因为客户自己描述了 10 个卫星平台、载荷集成、发射和运营的范围，随后又确认 Loft 正在集成、发射和运营 10
              星系统。这对私人航天公司是少见的强验证，但也让 EarthDaily 对公开观感异常重要。如果 EarthDaily 延误、表现不及预期或发生异常，损害不只会影响近期执行观感，也会打到 Loft
              最好的商业参考账户。


              政府和主权工作同时带来粘性和复杂性。Viasat 的 NASA 中继演示、SDA NExT 参与、CNES 多年 EO 授标，以及法国主权 SAR 项目，都强化了 Loft
              能赢得机构任务的判断。但这些项目执行重、安全重，且周期往往很长。Loft 的 CNES 公告指向 Q4 2026 首星和 10 星架构；Breaking Defense 称另一项主权 SAR 演示预计在
              2029，并指出 Loft 不愿讨论未来选项。这是典型主权项目模式：战略相关性先上升，收入时点和期权价值却尚未完全透明。因此，在私人待交付订单
              和里程碑细节可得之前，投资人应把客户多元化视为有支撑，但集中度和主权执行风险仍是实质风险。
