      - CV025
      - CV026
      - CV048
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支持的合理基准区间大致围绕当前低端独角兽估值；若转化不及预期，下行空间不小；没有新披露，上行也只是中等。
    approximationNotes: 这些区间来自情景假设下的投资测算，不是目标价，也不是概率预测。
    data:
      items:
