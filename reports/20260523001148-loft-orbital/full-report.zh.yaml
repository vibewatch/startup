      - number: '3.2'
        title: 直接搭载载荷和轨道基础设施同行
        blocks:
          - type: paragraph
            body: >-
              在公开或半公开替代方案中，Spire 是最干净的直接同行，因为它在真实已部署星队和地面网络之上，销售搭载 RF 载荷、定制建造、任务运营、安全数据处理，以及资本开支转运营开支的叙事。Sidus
              也是直接同行，但它更像围绕 LizzieSat 展开的较小制造和运营供应商，而不是软件抽象层。Momentus
              在卫星平台、运输和轨道基础设施上有重叠，但本来源包里的公开材料更强调重建势头和资产负债表健康，而不是展示已规模化的在轨履历。


              这些同行重要，因为它们可以追逐与 Loft 相同的许多政府、国防和商业任务预算。但每家的竞争质感不同。Spire 由 RF 和安全牵引。Sidus 由制造和任务管理牵引。Momentus
              由在轨运输和轨道基础设施牵引。公开描述中，没有一家像 Loft 这样明确把 Hub/Cockpit 抽象、面向开发者的虚拟任务，以及面向 AI
              的在轨软件部署捆在一起。买家若想要的是航天器基础设施之上的简化应用层，而不只是卫星平台、拼车发射或 RF 任务载体，Loft 最有优势。
