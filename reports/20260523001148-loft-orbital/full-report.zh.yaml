  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合是分层的，不是一张单一同业名单
        blocks:
          - type: paragraph
            body: >-
              Loft 所处市场是分层竞争，而不是整齐的一对一搭载载荷赛道。最接近的重叠来自明确销售共享卫星基础设施或搭载载荷式服务的供应商，但真实预算竞争也会从 Loft 的赛道流向其他方向。Planet
              可以满足那些真正需要影像、任务调度和分析结果，而不是中立任务底座的买家。OneWeb 可以直接满足连接需求。Rocket Lab、Airbus 和 Exolaunch 则可能在 Loft
              进入会议室之前，就在发射控制、航天器制造或任务集成上吃掉预算。


              更广泛的市场证据支持这一框架。BryceTech 显示小卫星活动规模很大，但通信卫星主导单位数量，这意味着大量市场位于封闭或垂直整合星座内部，而不是开放基础设施采购。Novaspace
              同样强调开放与封闭结构，并把集成商、发射经纪和最后一公里物流分成不同层级。对有能力自行拼接发射、卫星平台和运营的成熟政府、国防或星座买家来说，内部自建仍是活跃的现状替代方案。因此，尽调应把 Loft
              同直接航天基础设施同行、垂直整合替代方案、发射与制造相邻公司，以及内部自建路径比较，而不是把它放进一个泛泛的「航天服务」桶里。
