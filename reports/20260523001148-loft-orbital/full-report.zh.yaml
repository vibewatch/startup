      - number: '7.4'
        title: 监管、出口管制、安全与网络风险
        blocks:
          - type: paragraph
            body: >-
              Loft 转向主权、国防相关和 AI 赋能任务，抬高了监管门槛。FCC 对简化小卫星的指引，对系统规模和任务期限设定边界假设；NOAA
              的遥感流程引入正式预申报和审查路径，一旦载荷范围变化，进度可能被改写。任务跨境，或涉及受控硬件、软件、技术数据之后，出口管制流程就不再是法律脚注，而是真实运营约束。Office of Space
              Commerce、BIS 和 DDTC 材料合在一起说明，团队必须判断物项属于 EAR 还是 ITAR 式处理，正确分类，筛查最终用途和最终用户，并在授权后持续合规。


              安全和网络风险也比 Loft 还是简单托管载荷运营商时更重要。CNES 项目明确依赖主权地面段，安全控制数据链；YAM-9 文章则把 Loft 的未来放在可支持主权的 AI 星座上。与此同时，Tailscale
              案例研究显示，即便是内部网络，也曾在一个 300
              人全球组织中制造摩擦。这是有用的缓释故事，但也确认了基础运营韧性和访问控制属于交付栈。公开来源显示数据政策和多个合规界面存在；它们没有显示审计结果、涉密项目控制，或详细出口管辖图。这个缺口对备忘录可管理，但不能忽略。
