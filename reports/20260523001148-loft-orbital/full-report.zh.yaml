      - number: '7.2'
        title: 发射、供应链与任务保障风险
        blocks:
          - type: paragraph
            body: >-
              Loft 模式的运营核心，也是它的一阶风险向量。TechCrunch 描述 Loft 从 Airbus、LeoStella
              等供应商购买标准卫星，再替客户处理载荷集成、发射和地面段复杂性。这层抽象有商业价值，因为客户无需做定制航天器工作；但也意味着任何上游环节滑坡，Loft 都会暴露。公司自己的 Series C
              文章称，行业在发射侧的进展并未消除卫星侧进度风险；April 2023 的 Airbus OneWeb 订单也显示，Loft 仍要主动锁定卫星平台供应，才能维持节奏。Orbitworks 是缓释项，但 UAE
              爬坡仍处早期，应视为产能选项，而不是已经去风险的证明。


              发射侧类似。Loft 材料提到拼车项目，而 SpaceX 当前拼车页面清楚显示，共享发射经济性伴随的是时间表假设和改签规则，并非有保障的专用控制权。这不是专门批评
              SpaceX，而是共享发射清单模式的现实。结果是，载荷滑坡、卫星平台延误或后期集成问题，都可能从工程麻烦变成商业风险。Loft 的 HubKit 测试台是真实缓释，因为它把调试
              前移，目标是减少临门一脚的意外。但公开材料没有显示故障率数据、保险分摊，或按发射提供商拆分的详细任务结构，因此剩余暴露仍有意义。
            claimRefs:
