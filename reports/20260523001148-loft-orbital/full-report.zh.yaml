  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: “跟踪”建议来自三者碰撞：真实商业证明、估值合理性，以及收入、利润率、资本结构不透明。
    approximationNotes: 该图映射承销链条，而非任何已发布的数字模型。
    data:
      nodes:
        - id: traction
          label: 真实商业牵引力
          detail: Series C、$500M+ 订单额、EarthDaily 和主权项目显示真实需求。
          tone: positive
        - id: ambiguity
          label: 估值未正式披露
          detail: 公开来源把估值框在低独角兽线附近，而不是确认一个已签署数字。
          tone: warning
        - id: conversion
          label: 收入转化仍不透明
          detail: 没有公开的确认收入、ARR、毛利率或递延收入桥接。
          tone: negative
        - id: comps
          label: 可比公司样本宽且噪音大
          detail: 公开市场的市值 / 收入倍数从约 7x 到超过 100x，离散度很高。
          tone: warning
        - id: stance
          label: 观察 / 合理 / 高风险
          detail: 当前估值看起来说得通，但折价不够，难以抵消未公开经济性数据缺失。
          tone: neutral
        - id: upgrade
          label: 尽调打开经济性后才上调
          detail: 看清收入排期、毛利率、现金跑道和优先股堆叠，才会触发上调。
          tone: positive
      edges:
        - from: traction
          to: ambiguity
        - from: ambiguity
          to: conversion
        - from: conversion
          to: comps
        - from: comps
          to: stance
        - from: stance
          to: upgrade
