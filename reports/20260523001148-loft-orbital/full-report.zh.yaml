  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资历史和资本结构信号真实，但准确投后估值仍模糊
        blocks:
          - type: paragraph
            body: >-
              Loft 的融资故事是公开档案中最强的部分之一。2025 年 1 月 Series C 明确得到佐证，规模 $170 million，由 Tikehau Capital 领投、Axial Partners
              共同领投；多家媒体重复了同一套战略资金用途：提高发射节奏、增加虚拟任务，并扩大 AI 应用生态。公司还提出了一个异常直接的资本效率主张：在本轮之前，只用 $160 million 已融资资本就跨过 $500
              million 累计订单额。这是有用信号，因为它说明，相对已消耗资本，公司有实质商业牵引；在硬件、发射协调和任务运营通常会在规模化前吞下大量资金的行业里，这一点尤其重要。


              分析从总融资转向准确估值和稀释后，资本结构图景就不那么清楚。按 TechCrunch 的算术，Series C 后累计融资约 $330 million；Via Satellite 四舍五入为 $300
              million；Yahoo/Forge 则建模为约 $316 million。估值同样模糊：Sifted 引用直接知情人士称公司已跨过 $1 billion，Yahoo/Forge 估计约 $954
              million。这些数字足够接近，能说明公司接近独角兽规模，但不能在投资测算中互换。公开档案支持的判断是「一家需求真实的大型后期私营公司」，而不是精确投后估值或所有权瀑布。
