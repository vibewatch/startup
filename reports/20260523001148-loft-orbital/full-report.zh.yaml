      - number: '3.3'
        title: 整合型替代方案与发射 / 制造相邻公司
        blocks:
          - type: paragraph
            body: >-
              Loft 也和一批重心位于栈内其他位置的公司竞争。Planet 主要是一家数据和分析公司，但其 10-K
              清楚说明，它也设计客户自有卫星、采购发射、支持地面基础设施并运营任务。当客户真正想要的是影像结果和嵌入式数据平台时，Planet 就成了替代方案。Rocket Lab
              是最清晰的上游相邻公司：它结合了发射节奏、私有发射场、航天器生产和在轨管理。Airbus 和 OneWeb
              展现的是另一种规模：工业卫星制造和已部署通信基础设施可以作为一套经过验证的系统出售，而不是作为中立任务抽象出售。


              Exolaunch 更窄，但仍有战略相关性，因为许多买家会先解决发射集成和部署物流，再解决在轨软件或抽象层。如果这笔上游预算被锁定给一家以发射为中心的供应商，或一家整合发射加航天系统的供应商，Loft
              可能还没在产品功能上正面对比就已经失去项目。结果是，买家的切换不只发生在「类似
              Loft」的供应商之间，也会跨越完全不同的所有权模式：外包任务基础设施、垂直整合数据平台、直接连接网络、捆绑发射加航天器栈，或只做发射集成的专业商。
