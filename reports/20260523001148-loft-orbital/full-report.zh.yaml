  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资轮证据支持低独角兽估值，但无法精确到单点
        blocks:
          - type: paragraph
            body: >-
              Loft 的 January 2025 融资真实且佐证充分：公司、TechCrunch、Via Satellite、GovConWire 和其他媒体都指向由 Tikehau Capital 与 Axial
              Partners 领投的 $170M Series C。更难的问题是，这一轮究竟定了什么价格。Loft 自己不披露投后估值或硬收入数字。独立市场数据来源没有缩小差距，而是在中间分裂：Yahoo/Forge
              模型估算投后估值约 $954.6M，Sifted 则援引直接知情人士报道称 Loft 跨过 $1B 门槛。这足以说明公司站在低独角兽边界附近；但没有管理层材料，无法为单一精确估值辩护。


              同样的模式也出现在累计融资计算和收入披露中。Series C 后公开累计融资总额按媒体不同落在约 $300M 到 $330M，Yahoo/Forge 的 $316.27M 位于中间。Loft
              披露的商业证明强于财务证明：超过 $500M 的累计签约订单额、已售 30
              多颗卫星，以及多年星座和主权项目。但公司仍未发布确认收入、ARR、毛利率、现金或股权结构。这意味着估值讨论必须从模糊性出发，而不是精确性：这是一家真实的后期空间基础设施公司，有可信需求；但承销档案仍缺少把头条估值转成信念所需的私人数字。
