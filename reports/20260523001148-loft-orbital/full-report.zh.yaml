      - number: '5.3'
        title: 计算架构正从纯软件演示走向异构在轨基础设施
        blocks:
          - type: paragraph
            body: >-
              Loft 最重要的产品演进，不再停留在“软件可以在太空运行”的表述，而是开始披露一套带有真实设计取舍的计算架构。YAM-6 验证了软件部署模式；但更关键的技术信号是 YAM-9：Loft 现在称，它在 x86 与
              ARM 上飞行四个联网计算节点，混用 CPU、NVIDIA GPU 和 AI 加速器。相比单盒边缘处理器的说法，这更能证明成熟度。Loft 还称，该平台是 Hub Compute
              的未来演进：一层安全的分布式处理能力，可并行托管多个应用，并面向特定任务的边缘推理，而不是通用轨道数据中心负载。


              CatGPT 和 Inside Loft AI 文章把这幅图从营销表层推到实现线索。Loft 现在公开描述了基于 Linux 的星上系统、在轨 Kubernetes
              集群、微服务驱动的任务控制系统、使用现代网络组件的 SpaceVPN 实验，以及沙盒化工作负载隔离，让多个客户能在共享基础设施上运行软件。AI for Space 业务部门，以及 SmartSat、Little
              Place Labs 等客户演示，说明这些底层能力为什么重要：Loft 想成为政府、主承包商和分析团队部署模型的平台，而不只是把载荷送上天的供应商。因此，技术叙事更像平台，也更可信；只是多数性能证据仍来自
              Loft 自身，而不是外部基准。
