        - 按当前证据，低位独角兽估值说得通，但折扣不足以吸收重大披露不及预期。
      - - 入场纪律
        - 偏好带尽调访问权的低位独角兽定价
        - 要形成鲜明的买入理由，需要验证收入、毛利率和股权结构表数据，而不只是订单新闻标题。
      - - 上调触发器
        - 收入转化经验证，加上更干净的资本结构
        - 从观察转向买入，需要收入排期、毛利率和足够清晰的清算瀑布。
    notes: 本建议评估的是估值支撑和承销质量，不是 Loft 是否具有战略吸引力。
