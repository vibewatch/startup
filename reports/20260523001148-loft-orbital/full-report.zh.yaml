        title: 公开客户证据横跨商业星座、主权项目和软件驱动用户
        blocks:
          - type: paragraph
            body: >-
              公开证据指向四类客户面，而不是一面简单客户标识墙。第一类是商业分析和地球观测公司，它们希望 Loft 吸收航天器集成、发射和运营；EarthDaily 是最清晰的例子，因为其自身公告把 Loft 描述为 10
              个卫星平台和持续运营的主任务伙伴。第二类是政府、国防和民用航天买方，例如 NASA 相关工作、SDA 相关项目和法国主权任务，Loft
              在其中看起来要么是基础设施提供方，要么是联盟牵头方。第三类是使用虚拟任务或在轨 AI 的软件和应用团队，Loft 向他们销售不造专用硬件也能部署代码的能力。第四类是渠道和区域关系——Viasat、Ball 与
              Microsoft、Marlan 与 Orbitworks，以及 Azure 相关开发界面——帮助 Loft 嵌入更大的项目。


              关键细节在于，买方、用户和付款方常常不是同一方。EarthDaily 向 Loft 购买任务基础设施，但 EarthDaily
              自己的终端用户分布在农业、保险、ESG、灾害响应等分析市场。公共部门项目同样分层：机构或主承包商为航天器工作付费，下游运营方和任务用户在栈的其他位置。因此，可见客户集合比直接付费客户数更宽，但仅靠公开材料也更难判断集中度。
