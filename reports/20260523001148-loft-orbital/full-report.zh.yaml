        - 直接基准
        - 私营公司；2025 年 1 月 $170M Series C 轮；正扩至每年 10+ 次发射
        - 载荷所有者、主权项目、软件优先团队
        - Hub/Cockpit 抽象层、虚拟任务、主权就绪叙事
        - 定价、续约和实际经济性仍未披露
      - - Spire
        - 直接托管载荷 / 航天服务同业
        - 已部署 199+ 颗卫星；LEMUR 累计 600+ 年飞行履历；公开市值约 $0.81B
        - 政府、国防、民用、RF 任务
        - 托管 RF 载荷、加密处理、RF 专长、已部署星队
        - 比 Loft 更偏 RF；开放应用部署叙事不如 Loft 明确
      - - Sidus Space
        - 直接小型卫星平台 / 运营同业
        - 上市微盘公司；列有 2026 年年度报告；35,000 sq ft 集成设施
        - 政府、国防、情报、商业任务
        - 自有卫星系统，加上制造和任务运营
        - 显性已部署基础较小，软件抽象叙事较薄
      - - Momentus
        - 直接但资本实力较弱的轨道基础设施同业
        - 上市超微盘公司；市值约 $73.74M；2026 年资产负债表重建叙事
        - 需要卫星平台、运输或在轨服务的客户
