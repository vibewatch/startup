      - number: '4.3'
        title: 单位经济模型代理指标指向资本效率，但经营杠杆仍不透明
        blocks:
          - type: paragraph
            body: >-
              最强的公开单位经济模型代理指标很简单：订单额除以 Series C 前已融资资本。按 Loft 自己的数字，这一比率超过
              3.1x，在行业语境下很亮眼，也解释了为什么管理层和投资人强调资本效率。还有一些通常会影响经营杠杆的规模信号：Loft 称已售出 30 多颗卫星，在 Golden
              集成设施货架上保留数十颗卫星，并正从每年少数几次发射走向 10 次以上，再走向完整星座执行。这些事实意味着，公司至少在某种程度上跑出了标准化采购、可重复集成和可复用运营基础设施，而不是每次都做纯定制工程。


              但公开档案恰好在真实模型需要数字的地方断裂。员工数是 251 对
              300，彼此不一致。没有任何来源披露人均收入、毛利率、质保或故障准备金、发射成本转嫁、回款节奏，或任务运营收入的续约情况。即便是最知名的年化合约粗算——Sifted 披露的 €500 million
              商业合同额除以 5 年平均期限，隐含约 €100 million——也明确不是披露的 ARR 数字。纪律很简单：公开证据支持 Loft 可能比许多航天同行更省资本，但尚不足以支撑对贡献利润率或经营杠杆的硬判断。
