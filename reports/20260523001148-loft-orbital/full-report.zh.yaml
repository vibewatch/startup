companyProfile:
  summary: >-
    Loft Orbital 是一家法美航天基础设施公司，成立于 2017 年 1 月。公司把标准化卫星硬件、任务集成、发射、运营和软件定义虚拟任务打包成一个平台，核心围绕 Hub、Cockpit
    及配套计算工具展开。公开证据显示，公司在商业和主权项目上都有实质牵引，尤其是 EarthDaily 的 10 颗卫星星座、Loft Federal 承接的 NASA 相关和 SDA 工作，以及法国主权合同（包括
    DESIR）。2025 年 1 月完成 $170 million Series C 后，公开资料最能支撑的判断是：公司估值约 $1 billion，累计融资约 $330 million；但收入、利润率和治理可见度仍然有限。
