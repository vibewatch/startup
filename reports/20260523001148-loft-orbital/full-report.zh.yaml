      - number: '2.2'
        title: TAM、SAM、SOM 必须用受限口径，并写清限制
        blocks:
          - type: paragraph
            body: >-
              对 Loft 来说，最好的公开市场规模证据始于外边界，而不是干净的收入 TAM。BryceTech 显示，2024 年发射了近 2,800 颗小卫星，平均质量达到 223 kilograms；Novaspace
              把小卫星市场界定到 500 kilograms，并按商业、民用和国防买家分拆需求。这些数据重要，因为它们确认，在标准化应当有价值的小卫星形态中，实体任务活动充足。但这些数据不能证明所有活动都能由 Loft
              服务。BryceTech 还称，通信卫星占发射多数，这意味着大量体量落在垂直整合星座或其他商业模式里，Loft 并不是天然供应商。


              更清晰的近期口径是已服务体量。仅 EarthDaily 就是 10 颗卫星平台项目，Loft 正在 18 个月内扩张到 20 多颗卫星，管理层称公司正从每年少数几次发射走向 10
              次以上。这些都是当前需求的具体信号，但仍无法换算成公开美元口径的 SAM 或 SOM。SIA、Novaspace 和 FAA
              材料有助于定义周边市场架构，却没有任何可访问摘录单独切出搭载载荷或虚拟任务收入池。实际尽调结论是：Loft 的市场真实且在扩张，但公开来源目前只能支撑受限的项目规模测算框架，不能支撑一页精确、可进模型的 TAM。
