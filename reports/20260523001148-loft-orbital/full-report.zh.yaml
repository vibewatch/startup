      - number: '5.4'
        title: 卫星平台策略和供应链押注接口抽象、工业伙伴与产能扩张
        blocks:
          - type: paragraph
            body: >-
              Loft 的卫星平台策略看起来是：“先标准化接口，再在底层采购或扩张工业产能。” 面向客户的叙事不是单一的内部自研航天器设计，而是借 Hub 实现不绑定卫星平台。最强的公开供应链证据来自 EarthDaily
              2022 的合作伙伴公告：Loft 与 Airbus 签约，由 Airbus 基于 Airbus OneWeb 传承和产线供应卫星平台，Loft
              负责集成、发射、运营和云连接下行支持。这与更大的架构叙事吻合：Loft 把任务层、载荷接口和运营栈握在自己手里，在可行处借力成熟卫星平台制造。


              近期执行信号表明，这套模式正在放大，但伙伴依赖仍在。Loft 的 EarthDaily 更新称，公司正从单个任务转向多星座部署，目标是在 18 个月活动中交付 20 多颗卫星。Golden I&T
              中心增加了美国本土集成产能；Orbitworks 则提供一条 UAE 生产路径，计划每年生产 50 颗 500 kilogram 卫星，并已为首批 10 个航天器锁定组件。与此同时，Airbus 和 OneWeb
              展示了 Loft 正在借力的底座：工业化卫星平台生产、集成供应链，以及大量在轨传承。结论偏正面，但要带上细节。Loft
              通过在卫星平台之上做抽象，确实有可扩张路径；但当前供应商组合、单位经济和长周期单一来源依赖的公开证据，仍比公司关于速度的公开话术薄。
