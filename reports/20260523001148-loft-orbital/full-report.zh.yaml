        - 决定买方能否把航天器当作基础设施，而不是定制工程项目
      - - 在轨软件部署
        - 虚拟任务加上 YAM-6 和 YAM-9，让客户把软件部署到 Loft 拥有的资源上
        - 本来源包中没有直接同业营销同样明确的 SDK + 应用部署工作流；Planet 提供的是数据工作流
        - 这是 Loft 跳出传统托管载荷竞争的最清晰路径
      - - 安全或主权任务处理
        - Loft 将法国主权项目胜利与共享基础设施、数据控制叙事绑定
        - Spire 在明确的加密 RF 处理和 GovCloud 表述上更强；OneWeb 在通信网络安全上更强
        - 对安全敏感的买方可能选择信任和控制姿态最明确的供应商
      - - 发射控制和排期所有权
        - Loft 强调简化和压缩排期，但不拥有发射基础设施
        - Rocket Lab 拥有发射场和发射节奏；Exolaunch 在发射集成和部署上很强
        - 发射控制可能先吃掉预算，任务抽象工具还没进入考虑
      - - 下游结果所有权
        - Loft 卖任务基础设施，而不是大型下游数据或连接产品
        - Planet 拥有数据飞轮和分析平台；OneWeb 直接销售通信结果
        - 买方想要答案或带宽时，垂直整合的结果型供应商可挤掉中立基础设施
      - - 工业制造规模
        - Loft 公开材料强调标准化和复用，没有披露达到 Airbus 水平的已部署星队规模
        - Airbus / OneWeb 展示了 600+ 颗卫星的工业化生产和拥有大规模部署基础的 ARROW 卫星平台
        - 对最看重已验证制造吞吐和部署履历的买方，工业规模很重要
    notes: 本表是来源包综合，不是产品审计。竞争对手证据反映检索到的公开材料明确写了什么，并不等于声称能力相同或可直接互换。
