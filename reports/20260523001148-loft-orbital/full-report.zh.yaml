      - number: '4.2'
        title: 订单额和合同范围显示需求，但不能证明硬收入
        blocks:
          - type: paragraph
            body: >-
              对 Loft 收入模型最有支撑的公开解读是：它销售捆绑式任务基础设施，而不是干净的软件订阅。EarthDaily 2022 年合作伙伴公告是最清晰的例子：Loft 合同覆盖 10
              个卫星平台、载荷集成、发射、航天器运营和云连接下行链路支持。2026 年 4 月 6 颗卫星发射更新延展了这一图景，显示 Loft 正从单个任务走向完整星座，并将在更大的 18 个月、20
              多颗卫星行动中让自有星队翻倍。这些是有意义的商业和运营信号，但它们描述的更多是范围和执行负担，而不是确认收入。$150 million 的客户星座预算不等于 Loft 收入，即便 Loft
              自己披露的订单额指标也是累计、多年期，且没有公开映射到收入确认。


              同样的谨慎也适用于较新的 AI 和虚拟任务叙事。Loft 显然希望投资人和客户把虚拟任务看成更高价值层；公开材料也显示了真实使用：10 多个客户 AI 工作流已经在轨，YAM-9
              是更强的计算架构，SmartSat 野火工作负载则被描述为未来运营服务的概念验证。但公开资料仍没有标价，没有披露虚拟任务与实体任务的收入结构，也没有利润率数据。公开证据支持「Loft
              正在以某种方式，通过实体、运营和 AI 赋能服务变现任务基础设施」。它不支持硬 ARR、确认收入，或 AI 层已经在财务上具有重要性的说法。
