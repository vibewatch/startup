  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Loft 卖的是分层任务平台，不只是搭载载荷舱位
        blocks:
          - type: paragraph
            body: >-
              Loft 公开产品界面现在覆盖两个不同客户入口，但最终仍汇入同一平台。传统客户可以买实体任务，由 Loft 在标准化航天器平台上集成、测试、发射并运营载荷。软件优先客户则可以买虚拟任务，基于 Loft
              的计算、传感和连接栈开发应用，而不必建造硬件。这一分流很重要，因为它改变了比较对象：Loft 不只是搭载载荷供应商，也是面向那些想要在轨答案和软件行为、而不只是卫星平台的客户的类云基础设施层。


              对一家航天基础设施公司来说，Loft 发布的工作流异常明确。Ultimate Edge 给客户提供安全云开发环境和虚拟测试台；应用或载荷上线后，Cockpit
              则提供任务在轨资源的运营界面。官方页面把机载成像器、SDR、CPU、GPU、星间链路和全球地面站访问描述为可复用平台资源。YAM-6 进一步把这套工作流具体化，把卫星描述成第一个支持虚拟任务的节点，并配套
              SDK、文档和 API。Little Place Labs、SmartSat 等公开客户案例强化了一点：这不只是概念页面，Loft 已经在用同一套栈支持海事域感知和野火探测在轨工作负载。
