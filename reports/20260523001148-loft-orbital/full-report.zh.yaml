      - number: '4.4'
        title: 资本充足性仍未验证，公开可比公司只能校准
        blocks:
          - type: paragraph
            body: >-
              Loft 的公开档案没有披露账上现金、债务、项目融资、发射预付款义务或现金跑道模型。这是第四章最大的实际投资测算障碍。管理层关于盈利能力和业务可持续性的表述，至少说明 Series C
              不只是机会主义增长资本；它也是走向更耐久财务画像的一部分。Orbitworks 增加了细节，但没有增加清晰度。初始 JV 资本和前 10 颗卫星组件承诺超过 $100
              million，显然有助于生产规模，但这笔资本处在合资语境中，并不能证明母公司拥有不受限流动性。同样，DESIR 和其他主权项目证明需求和战略信任，但公开合同金额并不能干净转化为 Loft 收入或利润率。


              公开可比公司在这里有用，但只能做校准。Planet 文件显示，航天服务安排可以把工程、发射采购、地面基础设施和运营打包在一起，同时仍产生巨大净亏损和资本强度警示。Spire 展示的是一家会披露
              ARR、留存、折扣和更长销售周期的上市公司——这些正是 Loft 不发布的数据。Rocket Lab 显示，大得多的规模仍可与亏损和集中积压订单并存。Momentus
              则在另一端：现金薄、仍需资本，并承受持续经营压力。这些可比公司合在一起圈出了行业结果范围，但不能让投资人只靠类比推断 Loft 自己的现金画像。
