chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台与地理布局
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital 更像航天基础设施平台，而不是定制卫星制造商。公司官网、技术页面和 2025 年 1 月融资文章都反复强调同一个价值主张：Loft
              负责集成、发射和在轨运营，客户可以把精力放在任务本身，而不是航天器项目。支撑这层抽象的是 Hub（Loft 的通用载荷适配器）和
              Cockpit（任务运营软件）。公司称，借助这两者，它能为多类任务配置标准卫星组件，而不是围绕每个载荷重新设计卫星平台。


              同一批材料也说明 Loft 如何压缩排期风险。公司把 Golden, Colorado 的集成与测试中心，以及 HubKit
              的台架式集成环境，定位成把接口调试前移、把经过飞行验证的基础设施保持在货架上的手段。公开布局信号指向一种法美运营模式，并在 Abu Dhabi 设有额外存在：Loft 在公司和客户材料中列出 San
              Francisco、Golden、Toulouse 和 Abu Dhabi，并称目前在三大洲运营。因此，截至本报告日期，Loft
              呈现为一家全球分布的航天服务公司：平台标准化，面向客户的运营逻辑接近云服务，相比最大化航天器定制，更强调可靠交付速度。
