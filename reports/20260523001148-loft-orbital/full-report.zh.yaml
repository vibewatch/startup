      - number: '8.2'
        title: 公开可比公司可用于校准，但分布太宽，不能制造虚假精确
        blocks:
          - type: paragraph
            body: >-
              这里使用公开可比公司的最好方式，是找区间，而不是机械估值引擎。Loft 处在几个公开类比对象之间，但并不干净匹配任何一家。Spire 有用，因为它也提供托管载荷和任务运营基础设施。Exolaunch
              提供更窄的发射管理邻近性。Planet 和 Rocket Lab 规模大得多，战略资产也更丰富；Momentus 和 Sidus 则代表空间服务版图中更弱或收入更薄的边缘。Novaspace、BryceTech
              和 SIA 的市场结构来源进一步说明：小卫星需求真实存在，但经济价值链横跨制造、服务、地面和发射，Loft 同时参与不止一个格子。


              这种多子行业位置，正是可比公司分布如此宽的原因。按 May 2026 当前市值除以最新可取得年度收入，公开样本从 Spire 约 7x 到 Rocket Lab 超过 130x，Planet 高于
              50x，Momentus、Sidus 等小收入公司也给出失真的倍数。这些是市值 / 收入估计，不是企业价值倍数，报告期也并非完全同步。正确结论不是 Loft
              应该拿中位数或最高值，而是单一尖锐倍数会夸大证据。公开可比公司只能说明，Loft 当前私人估值在宽行业区间内有可行性；对收入转化质量的判断，比电子表格整洁度更重要。
