      - number: '3.4'
        title: Loft 的优势位置
        blocks:
          - type: paragraph
            body: >-
              Loft 最清楚的优势不是绝对卫星数量或公开市场规模，而是抽象层。Hub 和 Cockpit 减少了载荷所有者管理卫星项目的需要；虚拟任务更进一步，让客户不用拥有载荷，也能把软件部署到 Loft
              自有的在轨资源上。YAM-6 让这个故事变得具体，YAM-9 则把它延伸到多节点 AI 环境；Loft 明确称，政府、主承包商和分析公司都可以使用这一环境，同时保留对应用和数据的控制。相比
              Sidus、Exolaunch 或 Airbus 的公开材料，这是更接近软件的主张。


              主权角度进一步加深了这种优势。Loft 的法国主权公告显示，在应用控制、数据控制和国家能力重要的项目里，公司正以合作伙伴和主承包商身份赢得信任。这一姿态有战略意义，因为它让 Loft
              可以向敏感买家推销自己是共享基础设施，而不只是低成本卫星平台或拼车发射选项。对最看重排期压缩、任务抽象和航天硬件之上应用层的买家来说，Loft 的产品表述比规模较小的公开同行更差异化，也比大型整合替代方案更灵活。
