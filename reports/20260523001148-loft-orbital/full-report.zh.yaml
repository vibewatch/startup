      - number: '7.5'
        title: 竞争、资本强度、不透明度和放弃触发条件
        blocks:
          - type: paragraph
            body: >-
              Loft 最被低估的风险不是纯技术，而是在一个资本充足竞品正明显扩张的行业里，资本强度与有限披露叠加。Rocket Lab
              当前航天器页面强调垂直整合、待交付订单、发射集成、任务运营，以及厚重的民用-国防触达。Planet、Spire 和 Rocket Lab
              的公开文件也强调，即便规模化空间企业仍担心合同续约、政府监管、发射失败、财务契约、营运资本和关键人员。市场结构来源进一步显示生态已经拥挤：BryceTech 称 2024 发射了近 2,800
              颗小卫星；Novaspace 称需求可持续性和融资现在需要更严格审查；SIA 的框架显示，竞争横跨服务、制造、地面和发射。


              在这个背景下，Loft 选择不披露收入和估值，会抬高剩余风险。公开市场给空间公司定价的区间已经极大，从 Rocket Lab 的数百亿美元到 Momentus 的数千万美元。这个价差不能证明 Loft
              定价错误，但说明执行失望时，情绪重置会非常残酷。因此，正确的放弃触发条件应是运营性、可监控的：旗舰发射反复延误；EarthDaily 和 CNES
              级项目无法保持节奏；任务失败且保险安排不清；证据显示一两个项目主导签约订单额；或融资事件暴露单位经济弱于宣传。Loft 可能跨过所有门槛；重点是，在管理层能私下证明之前，投资逻辑必须保持有条件。
