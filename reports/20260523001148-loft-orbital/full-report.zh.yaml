      - number: '1.3'
        title: 融资历史、估值模糊性与规模信号
        blocks:
          - type: paragraph
            body: >-
              Loft 公开证据最强的融资事实，是 2025 年 1 月的 Series C：$170 million，由 Tikehau Capital 和 Axial Partners 联合领投。公司称此前已融资 $160
              million；结合 TechCrunch 报道，本轮后累计融资隐含约 $330 million，不过部分行业报道把累计数字四舍五入到 $300 million。披露的 Series C
              投资人组合覆盖法国机构资本、美国风险投资公司和主权财富相关资金，契合 Loft 的跨境布局和政府客户野心。


              估值图景更弱。TechCrunch 引用 PitchBook，称 2021 年 Series B 后投后估值为 $550 million，但 Loft 拒绝披露 Series C 投后数字。Sifted
              报道称，直接知情人士把新估值放在 $1 billion 以上；Yahoo/Forge 私募市场数据则估计约 $954.6
              million。这个冲突很重要：公司显然在讲接近独角兽的规模故事，但准确投后经济账仍未验证。


              运营规模信号比估值信号更强。Loft 称，公司只用 $160 million 的 Series C 前资本就跨过 $500 million 累计订单额，已售出 30 多颗卫星，并在 5 颗已发射卫星上部署超过
              25 个任务。公司还称收入连续多年翻倍，但管理层仍没有给出硬收入数字。员工数同样未解决：2026 年 Tailscale 案例研究称全球团队达到 300 人，Yahoo 的 2026 年简介则列出 251
              名全职员工。
