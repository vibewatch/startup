  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值或信号
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 预订额无法转化为收入
        - 非公开尽调显示近期转化偏弱，或转嫁型内容占比很高
        - 合理估值判断失去核心经济桥梁。
        - 从观察转为回避，或要求低得多的入场价。
      - - 旗舰项目出现重大延期
        - EarthDaily、CNES 或后续主权项目未达到进度或范围预期
        - 执行证据变弱，乐观情景区间会迅速压缩。
        - 按更慢节奏和更低信心重新测算估值。
      - - 优先股堆叠过重
        - Series C 及更早轮次对普通股等价的新资金形成明显优先权悬顶
        - 标题式投后估值不再对应真实投资者经济性。
        - 要求股权结构表透明，否则退出本轮。
      - - 客户集中度过高
        - 少数项目主导收入、积压订单或现金回款
        - 一个项目失误就可能重置整个模型，下行不对称性随之上升。
        - 任何投资测算模型都必须加入集中度折价。
      - - 同行或行业情绪出现类似持续经营压力的信号
        - 航天服务公开可比公司因融资压力或转化偏弱而向下重估
        - 即使 Loft 运营执行到位，私募估值也可能失去支撑。
        - 将公开市场同行压力作为提高要求回报的理由。
    notes: 这些不是泛化经营风险，而是会推翻当前估值合理性解读的具体失效模式。
    claimRefs:
      - CV017
      - CV026
      - CV049
      - CV050
      - CV053
      - CV058
      - CV063
      - CV065
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 按项目划分的已确认收入
        - EarthDaily、主权、拼车发射和虚拟任务业务流的季度收入
        - 这是预订额标题与估值支撑之间缺失的桥梁。
        - 索取按项目和业务流划分的 2025 年经审计收入排期，以及 2026 年截至目前的收入排期。
      - - 按业务流划分的毛利率
        - 按硬件、发射转嫁成本、运营和软件层拆分的收入成本
        - 合理的低独角兽估值取决于经济性，而不只是商业需求。
        - 获取旗舰项目的毛利率桥和合同层面贡献利润率。
      - - 现金和现金跑道
        - 当前现金、债务、烧钱速度和下行情景现金跑道假设
        - 现金跑道决定当前估值是否站得住，还是只是通往下一轮融资的过桥估值。
        - 审阅最新资产负债表、债务明细和月度现金模型。
      - - 股权结构表中的优先权
        - 既有轮次的清算堆叠、反稀释和优先权
        - 如果优先求偿权很重，标题式投后估值会严重高估新资金经济性。
        - 索取 Series C 后股权结构表和投资者权利摘要。
      - - 积压订单转化与取消
        - 里程碑时间、客户定金、终止条款和回款历史
        - 预订额质量是 Loft 估值故事里最大的单一未知数。
        - 审阅包含取消和计费条款的头部合同。
      - - 客户集中度与续约
        - 头部客户和主权项目贡献的收入、积压订单和增长占比
        - 少数客户能让合理估值显得便宜或昂贵，关键取决于持续性。
        - 要求提供前 10 大客户结构、续约历史和集中度压力测试。
    notes: 这些尽调索取项是从“估值合理、继续观察”走向真正可定价投资测算案例所需的最低材料包。
    claimRefs:
      - CV014
      - CV022
      - CV064
      - CV065
