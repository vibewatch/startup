  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 方向
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - 作为太空基础设施公司，Loft 的商业牵引力少见。
        - Series C、$500M+ 订单、EarthDaily 合同范围、CNES 合同和星座执行信号，都显示真实需求。
        - 如果旗舰项目滑坡，或披露后的收入转化偏弱，牵引质量会明显下降。
      - - 投资逻辑
        - 公司看起来比许多硬件同行更省资本。
        - Series C 前 $160M 资本撬动 >$500M 订单，意味着订单 / 资本超过 3.1x。
        - 如果毛利率或营运资本需求吃掉大部分价值，效率信号会变弱。
      - - 反向逻辑
        - 投后估值仍未公开确认。
        - Sifted 称估值 >$1B，Yahoo/Forge 称约 $954.6M；Loft 拒绝确认任一数字。
        - 已签署的股权结构表和轮次文件会很快消除估值歧义。
      - - 反向逻辑
        - 预订额和合同范围可能被误当作已确认收入。
        - EarthDaily 和主权项目证明需求存在，但公开资料仍未披露收入、ARR、毛利率或递延收入。
        - 按业务流划分的经审计收入和积压订单转化数据，才能让尽调从叙事走向模型。
      - - 反向逻辑
        - 可比公司倍数太分散，无法给出一个干净锚点。
        - Spire 静态看约 7x，而 Rocket Lab、Planet、Momentus 和 Sidus 因各自特殊因素显著更高。
        - 更干净的纯托管载荷可比公司组，或 Loft 披露非公开 KPI，才能让可比估值更可靠。
    notes: 反向逻辑指向估值支撑和披露质量，并非否定 Loft 的战略相关性或客户牵引。
    claimRefs:
      - CV006
