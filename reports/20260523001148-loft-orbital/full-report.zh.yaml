      - number: '2.3'
        title: 购买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              Loft
              的买方地图比传统卫星制造商更宽，但也更复杂。对地观测公司可以购买完整任务，同时把数据产品、分析和终端用户关系留在内部。民用机构和国防项目可以为了特定任务结果购买基础设施，而不必拥有整个产业栈。现有卫星运营商若更看重入轨时间，而不是对每个子系统的绝对控制，也可以购买搭载或共享基础设施。虚拟任务还带来一类新买家：软件优先团队和
              AI 开发者。他们想接入已经在轨的传感、计算和连接能力，而不想经历硬件项目。


              这种多样性意味着购买方、用户和付款方经常分离。技术用户可能是任务运营人员或算法开发者，付款方则可能坐在
              R&D、主权项目、对地观测产品或国防预算里。采用通常始于一个团队手里有当下重要的载荷或应用，却没有意愿管理航天器开发、集成、发射采购和长尾运营。从这个意义上说，Loft
              卖的不只是硬件访问，也是在出售组织负担的下降。
