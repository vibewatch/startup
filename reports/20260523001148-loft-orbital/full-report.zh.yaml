              公开定价不透明，让准确经济性很难比较，也因此切换成本看起来是中等，而不是被锁死。成熟买家可以把同一个任务需求重新界定为数据、连接、发射或内部自建。Loft 的护城河只有在公司持续把软件定义任务层、AI
