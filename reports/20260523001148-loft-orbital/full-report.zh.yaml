  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital 的风险画像，与其说由某个生死级缺陷决定，不如说由一组相互耦合的执行依赖塑造。公司自己的 January 2025 融资说明称，2025
              是它预期达到舰队规模的一年；同一来源还称，当前发射清单覆盖 EarthDaily、SDA
              工作和多个拼车项目。这个目标令人印象深刻，但公司也明确表示，行业的卫星侧仍受进度问题困扰，供应商进度往往更像建议而不是承诺。换句话说，Loft
              的头条增长故事本身已经写进了核心风险披露：快速扩张依赖卫星平台、载荷集成、发射名额和伙伴执行同步推进。


              因此，最实质的风险落在四组。第一是发射和供应链集中：Loft 仍依赖外部拼车节奏、外部卫星平台和外部制造爬坡。第二是项目集中：EarthDaily
              仍是最清晰的商业参考，法国主权工作和国防相关项目现在也承载战略权重。第三是合规和安全：随着 Loft 跨政府和跨境伙伴开展业务，遥感许可、FCC 限制、出口管制、ITAR
              相关处理和主权数据隔离都更重要。第四是不透明：TechCrunch 称 Loft 拒绝披露硬收入数字和估值，而 Sifted 报道了独角兽级定价，Loft 也拒绝确认。这个组合让剩余风险高于单看产品故事时的水平。
