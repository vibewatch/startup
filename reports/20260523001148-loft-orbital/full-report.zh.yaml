      - number: '4.5'
        title: 不透明和执行负担，是主要反向财务观点
        blocks:
          - type: paragraph
            body: >-
              反向情景并不是公开证据显示需求疲弱。事实并非如此。Loft 看起来有真实客户拉力、真实项目胜利和真实投资人支持。反向情景在于，公司公开叙事围绕执行里程碑优化——6 颗卫星发射、AI 工作流、主权项目、生产 JV
              和平台抽象——而投资测算需要的核心财务披露仍然缺席。这很容易制造分析陷阱：订单额看起来像收入，合同范围看起来像积压订单质量，AI
              任务演示看起来像软件变现，即便这些映射一个也没有披露。管理层的可持续性措辞进一步说明，公司仍在转型中，而不是财务上已经稳定落地。


              执行负担让不透明更重要。Loft 不是在运行轻量软件模型；它要跨多个司法辖区协调货架上的卫星、发射排期、星座部署、主权航天项目和不断增长的在轨 AI
              工作负载。这可以成为护城河来源，但也会放大营运资本、硬件利润率和项目时点判断错误的成本。基于公开证据，正确的投资测算姿态应当保守：公开可比公司只用于校准；订单额和合同价值只当需求指标；在把故事变成模型前，必须获得收入计划、成本结构、现金跑道、客户集中度和合同经济性的直接尽调访问。
