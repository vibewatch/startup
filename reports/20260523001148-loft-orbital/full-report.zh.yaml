      - number: '1.4'
        title: 客户、合作伙伴与政府项目扩张
        blocks:
          - type: paragraph
            body: >-
              Loft 的公开客户横跨商业、民用和国防买家，这在战略上很重要，因为它说明业务并不依赖单一市场分部。具名合作方包括 NASA、Microsoft、BAE Systems、U.S. Space
              Force、CNES、ESA、EarthDaily、Helsing、Eutelsat 和 Anduril。EarthDaily 项目尤其有信息量：2022 年 EarthDaily 选择 Loft
              担任首席任务伙伴，Loft 的工作范围覆盖卫星平台、集成、发射和运营。到 2026 年 4 月，双方合作推进到 6 颗卫星发射行动；Loft 称这将使其星队翻倍，并纳入一个 18 个月内部署 20
              多颗卫星的更大计划。


              面向政府的工作也在拓宽。Viasat 选择 Loft 参与 NASA 通信服务演示，把持续中继连接加入 Loft 的虚拟任务栈。Loft Federal 与 Ball Aerospace、Microsoft
              共同承担 NExT 角色，显示公司正在把商业基础设施改造给国家安全载荷使用。国际上，Orbitworks 给 Loft 提供了一个 UAE 制造和星座生产支点，初始资本超过 $100
              million，长期目标是每年生产最多 50 颗 500-kilogram 卫星。合起来看，这些项目说明 Loft 正从搭载载荷创业公司，演进为跨多司法辖区的基础设施主承包商，触达商业、国防和主权航天。
            claimRefs:
              - CO022
              - CO023
              - CO024
              - CO025
              - CO026
              - CO027
              - CO028
              - CO035
              - CO044
      - number: '1.5'
        title: 里程碑、AI 路线图与公开风险信号
        blocks:
          - type: paragraph
            body: >-
              2024 年以来，Loft 的里程碑轨迹体现出两个相连的战略动作：扩大星座执行，并把卫星变成 AI 计算基础设施。产品侧，YAM-6 让虚拟任务概念落地，客户可以基于 Loft
              自有的传感、计算和连接资产部署软件。YAM-9 把这一思路推进到更有野心的四节点异构计算架构，目标是为未来 AI 星座做基准测试。2026 年 AI for Space 业务单元和 Altair
              概念合在一起，说明 Loft 试图商业化的不只是航天器访问，而是面向近实时在轨推理的应用层。


              机构项目侧，法国正在成为重要验证点。Loft 赢得了 CNES 支持的对地观测星座合同、多年期 IOD-IOV 协议，以及与 Thales Alenia Space、TEKEVER France 共同承担的
              DESIR 主权 SAR 主承包角色。这些奖项重要，因为它们显示 Loft 获得的信任正在从商业搭载任务扩展到更具主权属性、也更贴近国防的工作。


              警示信号也很明显。公开来源仍未披露董事会结构、准确投后估值或硬性收入运行率。Sifted 报道称，截至 2025 年 1 月，Loft 尚未达到盈亏平衡；Yahoo
              简介也强调了竞争、监管和供应商集中。第一章结论因此是：Loft 已经具备实质平台牵引和主权项目动能，但确切财务质量和治理成熟度仍需要直接尽调。
