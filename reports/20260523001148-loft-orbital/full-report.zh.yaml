      - number: '1.2'
        title: 领导层、关键人依赖与治理可见度
        blocks:
          - type: paragraph
            body: >-
              这组来源里的公开领导层叙事高度围绕创始人展开。Pierre-Damien Vaujour 在公司公告和第三方资料中一直以 CEO 兼联合创始人身份出现，Alex Greenberg 也多次以联合创始人兼 COO
              身份被引用。较新的产品和主权项目披露开始出现其他职能负责人——CTO Pieter Van Duijn 负责 YAM-9 架构，Paul Lasserre 出任新的 AI for Space
              总经理，Emmanuelle Meric 在 DESIR 合同公告中担任 Loft Europe GM——但外部叙事仍然由创始人主导。


              这带来两点尽调含义。第一，公开品牌和客户叙事集中在少数高管身上，尤其是融资、平台战略和法国主权项目。第二，相比 Loft
              的规模和政府敞口，治理披露偏薄。本材料没有披露董事名单、投资人董事权利或独立董事监督结构。对一家同时扩张商业星座、通过 Loft Federal 承接联邦工作，并在法国和 UAE
              推进国家主权项目的公司来说，公开治理细节缺失是真实的尽调缺口，而不是表面瑕疵。
