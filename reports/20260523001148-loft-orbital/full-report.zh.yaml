      - number: '8.3'
        title: 只有签约订单额高效转化为真实收入，Loft 的估值才显得合理
        blocks:
          - type: paragraph
            body: >-
              档案中最强的公开效率信号，仍是 Loft 自己的签约订单额说法。仅用 $160M 的 Series C 前资本换来超过 $500M 的累计签约订单额，意味着签约订单额 / 资本比率超过
              3.1x；对一家硬件和任务都很重的空间公司来说，这很强。这个信号重要，因为它指向真实客户拉力，以及一定程度的产品化。EarthDaily 的 10 个卫星平台合同、April 2026 六星发射和 CNES
              授标，都支撑 Loft 不只是在卖一次性演示。它们显示了捆绑基础设施、任务运营和主权工作的重复模式；如果这些合同能干净转成确认收入和利润率，健康倍数就有理由存在。


              但公开证据仍止步于能让当前估值显得明显有吸引力的数字之前。Sifted 的合同算术可换算成约 €100M 的年化合同价值，但这不是披露的 ARR；即便报道快速增长的来源也说 Loft 隐去了硬收入数字。~$1B
              估值按这套启发式年化合同价值约为 10x，但按累计签约订单额仅约 2x，而后者不是承销倍数，因为签约订单额是累计、多年口径，且可能包含质量较低或转嫁型经济性。Planet
              文件提醒，大型卫星服务合同会让收入确认复杂化，这一点在这里尤其相关。Loft 在转化友好假设下可以显得合理，在弱转化假设下又显得偏紧张，公开记录并不矛盾。
