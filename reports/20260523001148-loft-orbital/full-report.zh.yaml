            body: >-
              反向力量来自规模、已部署基础和专业化。公开市场可比公司让不对称性很明显：Rocket Lab 和 Planet 的市值远高于较小的航天服务公司；Spire 仍明显高于 Momentus，并且有更明确的 RF
              安全专长。凡是发射控制和飞行履历决定采购的场景，Rocket Lab 更强。买家重视历史数据档案、经常性订阅和嵌入式分析流程时，Planet 更强。工业生产可信度和已部署网络规模最重要时，Airbus 和
