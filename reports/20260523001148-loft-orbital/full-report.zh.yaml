  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 使用的最新收入口径
      - 使用的当前市值口径
      - 估计市值 / 收入
      - 参考意义
      - 局限
    rows:
      - - Planet
        - 年报文本披露 FY2026 收入 $307.7M
        - 2026 年 5 月市值 $15.80B
        - ~51.3x
        - 地球观测基础设施公司，合同敞口大且已有公开市场规模。
        - Planet 规模大得多，也已经受益于公开市场稀缺性叙事。
      - - Spire
        - 2025 年 10-K 披露 FY2024 收入 $110.5M
        - 2026 年 5 月市值 $0.81B
        - ~7.3x
        - 托管载荷和任务运营模式，是这一组里最干净的公开市场类比。
        - 收入口径早于 2026 年 5 月市值，业务组合仍不同于 Loft。
      - - Rocket Lab
        - 2026 年 SEC 10-K 披露 FY2025 收入 $601.8M
        - 2026 年 5 月市值 $78.57B
        - ~130.6x
        - 覆盖全栈航天系统和发射业务，且有真实公开市场定价。
        - 规模、产品广度和公开市场热情让估值过高，不能直接作为锚点。
      - - Momentus
        - 2026 年年报文本披露 FY2025 收入 $1.11M
        - 2026 年 5 月市值 $73.74M
        - ~66.4x
        - 可作为下行情景提醒：收入极小的航天服务公司，表观上仍可能显得很贵。
        - 困境微盘股特征让倍数高度不稳定，不能作为 Loft 的核心参照。
      - - Sidus
        - 年报 MD&A 披露 FY2025 收入 ~$3.4M
        - 2026 年 5 月市值 $0.41B
        - 估计 >100x
        - 仅可作为小收入公开航天基础设施公司的边缘特例。
        - 收入数字为近似值，倍数噪声太大，无法锚定 Loft 的估值。
    enumerationScope:
      coverage: partial
      basis: >-
        Selected public-space comparables with accessible market-cap and revenue evidence as of the run; not an
        exhaustive hosted-payload universe.
    notes: 估计市值 / 收入计算使用当前市值和来源集中可获得的最新年度收入；它不是企业价值，期间也未完全匹配，只能用于校准。
