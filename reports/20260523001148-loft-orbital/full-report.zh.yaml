      - number: '2.4'
        title: 采用驱动因素与真实约束
        blocks:
          - type: paragraph
            body: >-
              这个市场最强的采用驱动并非纯财务，而是运营。Loft 反复回到同一个痛点：定制卫星太慢，供应链排期不可靠，许多客户看重可预测性更胜于完美性能调优。标准化接口、可复用卫星平台和 HubKit
              式预集成测试，直接打击这一痛点。AI 和边缘工作负载增加了另一条需求向量，因为 Loft
              卖的不只是一次入轨机会；它在营销的是在轨近实时物体检测、地球感知和自主决策支持。政府主权需求是第三个驱动因素，尤其当客户需要国家能力、国防相关性或对商业基础设施的安全访问时。


              约束同样具体。即使卫星技术上已经准备好，遥感和频谱审批也可能拖慢时间表。出口管制会让跨境制造、发射和载荷集成更复杂。安全敏感买家可能要求加密、GovCloud
              式数据处理或主权产业控制。客户外包部分栈，并不意味着资本强度完全消失。Loft 可能比一些同行更节省资本，但周边环节仍包括制造、发射、地面基础设施和运营；这些环节都会消耗资本，并可能卡住执行。
