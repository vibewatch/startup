      - number: '8.4'
        title: 承销立场应是观察且合理，直到私人收入、毛利率和资本数据打开
        blocks:
          - type: paragraph
            body: >-
              因此，情景工作必须明确带条件。悲观情景下，如果确认收入明显低于年化合同启发值、项目延误削弱市场对星座执行的信心，或可比公司纪律回到 Spire 式个位数倍数，Loft 更接近 $0.6B 到
              $0.8B。基准情景下，如果当前签约订单额、主权授标和星座项目转化成大约 $90M 到 $120M 的年收入式规模，但尚未证明软件式利润率，$0.9B 到 $1.1B 区间可以辩护。约 $1.2B 到 $1.5B
              的乐观情景需要超过今天公开档案的证据：后续主权胜利、EarthDaily 式干净执行，以及 AI 或虚拟任务带来增量经济，而不只是叙事价值。


              这一区间解释了为什么建议应保持价格敏感和尽调敏感。公开档案支持观察、中等信心、高风险和合理估值立场。它不支持不计价格买入，因为决定性变量仍是私有的：按项目确认的收入、按流的毛利率、现金和
              现金跑道、股权结构优先权，以及签约订单额 转成收入和现金的实际情况。如果私人尽调显示转化弱、优先权包袱重，或目前支撑上行叙事的旗舰主权和星座项目滑坡，投资逻辑应当失效。
