      - number: '2.5'
        title: 替代方案与相邻模式
        blocks:
          - type: paragraph
            body: >-
              Loft 的竞争对手不只是其他搭载载荷创业公司。一些替代方案位于上游。Exolaunch 聚焦发射、部署和任务管理。Airbus 代表更传统的制造和星座生产路径。Sidus
              在自有平台下提供多任务卫星平台和运营层。OneWeb 展示了另一种选择：客户可以直接从大型整合网络购买连接，而不是委托定制的传感或软件任务。另一些替代方案位于下游。Planet
              销售地球数据、衍生产品、云工具和自助访问，让许多客户购买结果，而不是购买航天器项目。Spire 把数据业务和航天服务结合起来，后者包括搭载载荷、定制建造和安全任务数据处理。


              这对 Loft 很重要，因为预算可能向多个方向迁移。买家可以把任务基础设施外包给
              Loft，只向更窄的供应商购买发射和部署，向现有网络购买数据或连接，或者与更垂直整合的卫星运营商合作。因此，正确的市场口径不是抽象的「卫星」，而是客户想要任务访问、却不想自己拥有整个产业栈的那部分工作负载。
