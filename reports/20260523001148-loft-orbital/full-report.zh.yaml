  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 交钥匙实体任务
        - 载荷集成、测试、发射采购、任务运营，以及基于成熟卫星平台的可飞行基础设施
        - 在 Loft 栈外完成的运载火箭经济性和定制卫星平台工程
        - 太空运营商、民用机构、地球观测公司、主权项目
        - 当前核心市场
      - - 在共享或成熟卫星平台上托管载荷
        - 载荷托管、接口抽象、任务运营和配套地面连接
        - 客户完全自有的专用航天器项目
        - 想获得入轨能力但不想拥有平台的载荷所有者
        - 当前核心市场
      - - 虚拟任务 / 在轨软件
        - 使用 Loft 自有基础设施上的传感、计算、连接和应用部署能力
        - 仅限地面的 AI 软件和数据中心计算支出
        - 软件优先团队、AI 开发者、现有运营商
        - 高优先级邻近市场，并可扩展新买方
      - - 主权和国防任务基础设施
        - 面向国家安全、主权和政府项目的任务基础设施
        - 商业航天基础设施之外的纯武器系统预算或涉密工业工作
        - 国防部、政府机构、主权总包商、聚焦安全的合作伙伴
        - 重要增长细分市场
      - - 邻近或排除市场池
        - 只有打包进任务交付时，才包括发射邻近部署、数据订阅、连接订阅和地面服务
        - 独立发射收入、下游分析订阅、宽带服务收入，以及纯定制制造
        - 买方因层级而异
        - 对避免夸大 TAM 很重要
    notes: 这个市场边界有意窄于完整卫星经济：它纳入 Loft 明确销售的基础设施层，排除会与发射、定制制造或下游数据订阅重复计算的邻近市场池。
