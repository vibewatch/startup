  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：任务基础设施，而不是整个卫星经济
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital
              最适合放在航天经济中一个较窄但经济意义明确的层级里：服务化任务基础设施。公司主要卖的不是运载火箭、单纯卫星平台，或成品下游地理空间产品。官方页面反复把任务定义为在标准化平台上集成、测试、发射和运营任务，让客户继续专注于载荷、应用或终端用户结果。按这个定义，搭载载荷、交钥匙实体任务和软件优先的虚拟任务都应纳入范围，因为
              Loft 提供的是位于载荷或应用与底层航天器栈之间的抽象层。


              同一逻辑也要求严格排除相邻支出。发射服务商收入、定制航天器工程、宽带订阅和下游分析产品都相邻，但不等同于 Loft 的核心市场。EarthDaily 是最清楚的例子：Loft
              负责卫星平台、集成、发射、运营和云连接基础设施，而 EarthDaily 保留分析和终端客户层。因此，本章用任务基础设施、搭载载荷和虚拟任务预算来衡量 Loft，而不是把卫星、连接或对地观测里的每一美元都算进去。
