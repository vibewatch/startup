      - number: '5.5'
        title: 软件定义运营的差异化最强，但约束和信任证据仍是真问题
        blocks:
          - type: paragraph
            body: >-
              对照公开竞品材料，Loft 的优势不是只有它提供空间基础设施。Airbus、OneWeb 和 Spire 都公开了真实的工业能力或任务服务能力。Loft 最突出的，是明确的软件工作流：YAM-6 的 SDK 和
              API、Ultimate Edge 中的虚拟测试台表述、作为预飞集成产品的 HubKit、作为任务控制平面的 Cockpit，以及围绕 Kubernetes、SpaceVPN 和隔离工作负载的最新披露。Spire
              的页面显示出强 RF 专长、安全设施和 RESTful API；Airbus 与 OneWeb
              则显示工业规模和传承。客户若更看重抽象、应用部署和软硬件混合任务控制，而不是自建卫星平台项目或采购成品连接网络，Loft 的差异化最明显。


              风险面不会因此消失。公开控制措施真实存在，但不完整。Loft 披露了数据政策、GDPR 框架、联系表单数据一年留存、出口管制意识，以及客户工作负载沙盒。监管也会约束平台实际能做什么：遥感系统需要许可；小卫星受
              FCC 对尺寸、寿命、机动性和干扰的限制；出口方仍要处理 ITAR、EAR 和制裁规则。最大缺口不是没有任何控制叙事，而是 Cockpit 或 Ultimate Edge 缺少外部记录的可用性、具名安全认证和详细
              SLA 证据。公开架构细节走在公开信任文件之前，因此尽调应把 Loft 视为技术上有差异化，但运营保障记录仍不足。
