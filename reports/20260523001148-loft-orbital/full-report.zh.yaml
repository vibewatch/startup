      - CV023
      - CV048
      - CV062
      - CV064
      - CV065
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 要支撑约 $1B 估值，所需年收入会随倍数假设大幅摆动；按 Loft 的公开口径推算，只够到支撑区间低端。
    approximationNotes: 所有数值均为以十亿美元计或十亿美元等值占位的估计值；Sifted 的合同启发式估算不是已披露 ARR，只作为比较点展示。
    data:
      items:
        - label: 5x 倍数下支撑约 $1.0B 估值所需收入
          value: 0.2
          detail: 按 5x 倍数，约需 $200M 年收入才能支撑 $1.0B 估值。
          tone: negative
        - label: 8x 倍数下支撑约 $1.0B 估值所需收入
          value: 0.125
          detail: 按 8x 倍数，约需 $125M 年收入。
          tone: warning
        - label: 10x 倍数下支撑约 $1.0B 估值所需收入
          value: 0.1
          detail: 按 10x 倍数，约 $100M 年收入即可提供支撑。
          tone: neutral
        - label: 12x 倍数下支撑约 $1.0B 估值所需收入
          value: 0.083
          detail: 按 12x 倍数，约 $83M 年收入即可提供支撑。
          tone: positive
        - label: Sifted 合同年化启发式估算
          value: 0.1
          detail: 约 €100M 的启发式估算接近 10x 支撑线，但不是已披露 ARR，也不是确认收入。
          tone: warning
    claimRefs:
