  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估计估值区间（十亿美元）
      - 验证信号
      - 关键失效模式
    rows:
      - - 悲观
        - 已确认收入明显低于按经验估算的合同价值，可比估值纪律收紧，旗舰项目延期。
        - 0.6–0.8
        - 非公开尽调显示收入规模低于 $100M，且毛利率偏弱或现金转化缓慢。
        - 投资者发现预订额的真实价值远低于标题式合同总额所暗示。
      - - 基准
        - 预订额转化为约 $90M–$120M 的年化收入规模；执行尚可，但仍没有软件级经济性。
        - 0.9–1.1
        - 项目级收入排期、集中度和利润率数据大体支撑当前低独角兽估值。
        - 公司业务真实，但效率不足以拿到溢价倍数。
      - - 乐观
        - 主权、星座和虚拟任务变现同时复合增长，投资者按高端基础设施给 Loft 定价。
        - 1.2–1.5
        - 后续主权订单、顺利交付的星座，以及可信的高价值软件或 AI 贡献，都体现在数字里。
        - AI 和虚拟任务叙事仍有战略吸引力，但财务贡献无关紧要。
    notes: 这些是投资测算区间，不是目标价；区间明确属于估计，取决于仍未公开的收入转化、毛利质量和资本结构细节。
