summary:
  headline: >-
    Loft Orbital has credible platform, constellation, and sovereign traction, but limited financial disclosure and
    execution dependencies keep the stock of evidence at track, not buy, around an approximately $1 billion valuation.
  overallScore: 6.6
  recommendation: track
