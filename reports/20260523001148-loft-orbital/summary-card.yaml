  topStrengths:
    - >-
      Hub, Cockpit, HubKit, and virtual missions give Loft a real software-defined mission abstraction rather than a
      one-off satellite-integration story.
    - >-
      EarthDaily provides unusually strong commercial proof because the customer itself describes Loft's 10-satellite
      scope across integration, launch, and operations.
    - >-
      French sovereign and CNES-linked wins show Loft can sell beyond commercial hosted payloads into higher-trust
      government programs.
    - >-
      More than $500 million of bookings on $160 million of pre-Series-C capital is a strong public capital-efficiency
      signal for a space company.
    - >-
      Loft's AI and on-orbit compute roadmap expands the buyer set beyond classic payload customers and could deepen
      software-like differentiation if execution holds.
  topRisks:
    - >-
      Recognized revenue, ARR, gross margin, burn, and board-level governance remain largely undisclosed, limiting
      underwriting confidence.
    - >-
      Launch cadence, satellite suppliers, and mission-assurance execution remain external dependencies that can delay
      or impair flagship programs.
    - >-
      Public evidence suggests customer and program concentration may be high around EarthDaily and a small number of
      sovereign or defense programs.
    - >-
      Compliance, export-control, security, and sovereign-data obligations rise as Loft moves deeper into defense and
      AI-enabled missions.
    - >-
      A roughly $1 billion valuation is only fair if bookings convert into durable revenue efficiently and the private
      preference stack is not punitive.
  unresolvedGaps:
    - Recognized revenue, gross margin, cash balance, runway, and bookings-to-revenue conversion by program.
    - Exact post-Series-C valuation, cap-table preferences, and downside dilution terms.
    - Active customer count, renewal and churn data, and top-customer concentration by revenue or bookings.
    - Current headcount, board structure, and broader governance visibility.
    - Mission insurance, warranty allocation, and failure-economics disclosure on major programs.
