callouts:
- calloutType: strength
  title: Standardization plus mission operations is the core moat
  body: Loft’s most defensible claim is not any one satellite but the repeatable operating system around Hub, Cockpit, pre-integrated inventory, and virtual-mission tooling. That combination lets it market cloud-like simplicity to customers who need space outcomes but do not want to own spacecraft complexity.
  claimRefs:
  - CO002
  - CO003
  - CO004
  - CO005
- calloutType: insight
  title: France and EarthDaily are the clearest proof points of category expansion
  body: EarthDaily proves Loft can scale into constellation execution, while the CNES and DESIR awards prove it can cross from commercial hosted missions into sovereign-program prime work. Together they suggest a broader trajectory than a typical hosted-payload provider.
  claimRefs:
  - CO022
  - CO023
  - CO036
  - CO037
  - CO038
  - CO039
- calloutType: risk
  title: Financial quality remains harder to verify than platform traction
  body: Loft has credible public signals on bookings, launches, and customer names, but it still withholds hard revenue, exact headcount, board structure, and definitive post-money valuation. The business may be scaling well, but investors still need direct diligence to judge margin quality and governance discipline.
