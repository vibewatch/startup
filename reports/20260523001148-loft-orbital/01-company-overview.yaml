    severity: material
    topic: governance
    missingEvidence: Current board composition, board observer rights, and investor control provisions.
    whyItMatters: Key-person dependence is high, but public materials in this pack do not show how investors or independent directors oversee management.
    diligencePath: Request the current board deck, cap table governance schedule, and most recent financing documents.
