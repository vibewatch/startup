- id: section-5
  title: Milestones, AI Roadmap, and Public Risk Signals
  body: |-
    Loft’s milestone arc since 2024 shows two linked strategic moves: scaling constellation execution and turning satellites into AI-enabled compute infrastructure. On the product side, YAM-6 made the virtual-mission concept concrete by letting customers deploy software against Loft-owned sensing, compute, and connectivity assets. YAM-9 extends that idea with a more ambitious four-node heterogeneous compute architecture intended to benchmark future AI-enabled constellations. The 2026 AI for Space business unit and the Altair concept together indicate that Loft is trying to commercialize not just spacecraft access, but an application layer for near-real-time orbital inference.

    On the institutional side, France is becoming a major proof point. Loft won a CNES-backed earth-observation constellation contract, a multi-year IOD-IOV agreement, and the DESIR sovereign SAR prime role alongside Thales Alenia Space and TEKEVER France. Those awards matter because they show Loft being trusted with increasingly sovereign and defense-adjacent work rather than only hosted commercial missions.

    The caution flags are also visible. Public sources still do not reveal the board structure, the exact post-money valuation, or hard run-rate revenue. Sifted reported Loft was not yet break-even as of January 2025, and Yahoo’s profile emphasized competition, regulation, and supplier concentration. The chapter-1 takeaway is therefore a company with meaningful platform traction and sovereign momentum, but one whose exact financial quality and governance maturity still require direct diligence.
