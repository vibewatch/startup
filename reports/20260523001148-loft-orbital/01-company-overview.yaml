  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A single run-date headcount from management or audited HR reporting.
    whyItMatters: Current scale is an input to burn, delivery capacity, and integration readiness, but public 2026 sources conflict between 251 FTE and 300 staff.
    diligencePath: Ask management for current FTE, contractor, and geography splits reconciled to payroll or HRIS data.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Revenue, ARR, gross margin, burn, and cash runway for the current fiscal period.
    whyItMatters: Public sources confirm growth rhetoric and bookings but do not provide the hard financial metrics needed to judge sustainability or proximity to profitability.
    diligencePath: Request monthly management accounts, bookings-to-revenue bridge, backlog aging, and cash runway forecast.
