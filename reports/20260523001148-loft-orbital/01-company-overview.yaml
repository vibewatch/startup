company:
  name: Loft Orbital
chapter:
  number: 1
  title: Company Overview
  summary: Loft Orbital is a French-American space infrastructure company founded in January 2017 that standardizes satellite integration, launch, and operations through its Hub/Cockpit platform. Public evidence shows meaningful traction — a $170 million Series C in January 2025, more than $500 million of lifetime bookings, EarthDaily constellation work, and sovereign French contracts — but exact run-rate revenue, current headcount, board structure, and definitive post-money valuation remain unresolved from public sources.
sections:
- id: section-1
  title: Identity, Platform, and Geographic Footprint
  body: |-
    Loft Orbital is best understood as a space-infrastructure platform rather than a bespoke satellite manufacturer. Across its homepage, technology pages, and January 2025 financing post, the company consistently frames its value proposition as handling integration, launch, and on-orbit operations so customers can focus on the mission rather than the spacecraft program. That abstraction layer rests on Hub, Loft’s universal payload adapter, and Cockpit, its mission operations software, which the company says let it configure standard satellite components for many mission types rather than redesign the bus around every payload.

    The same materials also show how Loft is trying to compress schedule risk. Its Golden, Colorado integration and test center, plus HubKit’s bench-top integration environment, are positioned as ways to move interface debugging earlier and keep flight-proven infrastructure on the shelf. Public footprint signals point to a French-American operating model with additional presence in Abu Dhabi: Loft names San Francisco, Golden, Toulouse, and Abu Dhabi across company and customer materials, and says it now operates on three continents. The run-date picture is therefore of a globally distributed space-services company with a standardized platform, a customer-facing cloud-like operating thesis, and a heavier emphasis on reliable delivery speed than on maximum spacecraft customization.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO018
  - CO040
