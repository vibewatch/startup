- id: differentiation-controls-constraints
  title: Differentiation is strongest in software-defined operations, while constraints and trust evidence remain
    real
  body: |-
    Against public rival materials, Loft’s edge is not that it alone offers space infrastructure. Airbus, OneWeb, and Spire all publish real industrial or mission-service capabilities. What stands out in Loft’s pack is the explicit software workflow: SDK and APIs for YAM-6, virtual test-bench language in Ultimate Edge, HubKit as a preflight integration product, Cockpit as the mission-control plane, and newer disclosures around Kubernetes, SpaceVPN, and isolated workloads. Spire’s page shows strong RF specialization, secure facilities, and RESTful APIs; Airbus and OneWeb show industrial scale and heritage. Loft is differentiated where customers value abstraction, application deployment, and mixed hardware-software mission control more than they value owning a bus program or buying a finished connectivity network.

    That does not make the risk surface disappear. Public controls are real but incomplete. Loft discloses a data policy, GDPR framing, one-year retention for contact-form data, export-control awareness, and sandboxing for customer workloads. Regulators also constrain what the platform can do in practice: remote-sensing systems require licensing, small satellites face FCC constraints on size, lifetime, maneuverability, and interference, and exporters must still navigate ITAR, EAR, and sanctions rules. The biggest gap is not the absence of any control story; it is the absence of externally documented uptime, named security certifications, and detailed SLA evidence for Cockpit or Ultimate Edge. Public architecture detail is ahead of public trust documentation, so diligence should treat Loft as technically differentiated but still under-documented on operational assurance.
