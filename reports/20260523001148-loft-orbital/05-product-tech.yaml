  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: bus-supply-chain
    missingEvidence: Current vendor mix, long-lead components, pricing terms, and concentration data behind Loft's
      active bus and spacecraft supply chain.
    whyItMatters: Loft's speed narrative depends on repeatable spacecraft supply; without current supplier concentration
      and lead-time data, execution and margin risk remain under-modeled.
    diligencePath: Request the active supplier map, current bus contracts, long-lead inventory status, and single-source
      mitigation plan for 2026-2028 campaigns.
    relatedQuestionRefs:
    - QE018
    relatedTableRefs:
    - TE003
    - TE005
  - type: missing-source
    severity: material
    topic: reliability-slas
    missingEvidence: Public uptime, latency, MTTR, commissioning-success, and incident-response metrics for Cockpit,
      Ultimate Edge, and related connectivity services.
    whyItMatters: Mission-control and software-runtime reliability are core to Loft's moat, so the absence of platform
      assurance metrics weakens underwriting for enterprise and sovereign deployments.
    diligencePath: Ask for service-level objectives, historical incident reports, commissioning statistics, and
      customer-facing reliability dashboards or assurance packets.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: security-certifications
    missingEvidence: Named external certifications, audit reports, or trust-center artifacts covering Loft's platform
      security controls.
    whyItMatters: Sandboxing and policy language help, but external certifications often determine procurement velocity
      and confidence for shared infrastructure handling sensitive missions.
    diligencePath: Request any SOC 2, ISO 27001, FedRAMP, penetration-test, or equivalent audit artifacts that cover
      Cockpit, Ultimate Edge, and mission-operations environments.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
