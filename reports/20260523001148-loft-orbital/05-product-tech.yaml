  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Loft solution
  - Measurable benefit
  - Limitation
  rows:
  - - Fly a hosted payload quickly
    - Design around a custom spacecraft, integrate late, and manage launch plus ops separately
    - Physical Missions on a standardized Loft platform with Hub and Cockpit
    - Reduces custom spacecraft work and concentrates execution with one provider
    - Public schedule and reliability metrics are not disclosed
  - - Deploy a software-only mission
    - Build hardware, secure launch, and then create edge runtime from scratch
    - Virtual Missions via Ultimate Edge and YAM-series compute resources
    - Avoids hardware ownership and shortens path from model to orbit
    - External developer documentation depth is not publicly shown
  - - De-risk payload integration
    - Discover interface bugs during final spacecraft integration
    - HubKit bench with flight-representative interfaces, logs, and shared procedures
    - Moves interface failures earlier in the schedule
    - No public before/after cycle-time dataset
  - - Run low-latency analytics
    - Downlink raw data first and process later on the ground
    - Onboard AI/ML using compute, sensing, and connectivity resources already in orbit
    - Can transmit compact insight outputs faster than raw imagery
    - Most evidence is from demos, not independent operational scorecards
  - - Support continuous or near-real-time links
    - Wait for ground-station passes and tolerate long data latency
    - Inter-satellite relay and Viasat-backed real-time relay demonstrations
    - Adds connectivity options for time-sensitive TT&C and mission data
    - Coverage, pricing, and SLA terms are not public
  - - Mature sovereign or defense tech in orbit
    - Fund a full custom satellite program for each demonstration
    - Loft-led integration, launch, and operations under CNES and SDA-style frameworks
    - Faster access to flight conditions for sensitive payloads
    - Government qualification details and long-run support terms are not public
  notes: Benefits are limited to what the fetched sources actually describe; missing external performance proof
    remains an explicit diligence gap.
