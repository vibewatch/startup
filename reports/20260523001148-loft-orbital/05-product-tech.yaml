- calloutType: insight
  title: YAM-9 and CatGPT matter because they reveal platform primitives, not just mission demos
  body: |-
    Loft is no longer only saying that AI can run in space. It is now disclosing heterogeneous compute nodes, Kubernetes-based onboard systems, SpaceVPN networking work, and isolated workloads. That is the kind of technical substrate that can compound across future missions and constellations if execution remains reliable.
  claimRefs:
  - CE012
  - CE014
  - CE034
  - CE035
  - CE036
- calloutType: risk
  title: Public trust evidence still lags public architecture detail
  body: |-
    Loft has a real control story—privacy policy, sandboxing, regulatory awareness, and repeatable test tooling—but the public pack still lacks named platform certifications, uptime history, and SLA evidence. For government or enterprise diligence, those omissions matter because they can create procurement friction precisely where Loft wants its shared infrastructure model to feel safest.
