  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Financing history and cap-stack signals are real, but exact post-money remains fuzzy
        blocks:
          - type: paragraph
            body: >-
              Loft’s financing story is one of the strongest public parts of the file. The January 2025 Series C is
              clearly corroborated at $170 million, led by Tikehau Capital with Axial Partners as co-lead, and multiple
              outlets repeat the same strategic use of funds: higher launch cadence, more virtual missions, and a larger
              AI application ecosystem. The company also made an unusually pointed capital-efficiency claim, saying it
              had crossed $500 million of lifetime bookings on only $160 million of capital raised before the round.
              That is a useful signal because it suggests meaningful commercial traction relative to capital consumed,
              especially in a sector where hardware, launch coordination, and mission operations usually absorb large
              sums before scale.


              The cap-stack picture is less crisp once the analysis shifts from gross funding to exact valuation and
              dilution. TechCrunch’s arithmetic implies about $330 million of lifetime funding after the Series C, Via
              Satellite rounded that to $300 million, and Yahoo/Forge modeled roughly $316 million. Valuation is
              similarly fuzzy: Sifted cited direct-knowledge sources saying the company crossed $1 billion, while
              Yahoo/Forge estimated about $954 million. Those numbers are close enough to signal unicorn-adjacent scale,
              but they are not interchangeable for underwriting. The public file supports “large late-stage private
              company with real demand,” not a precise post-money or ownership waterfall.
