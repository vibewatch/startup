      - number: '5.4'
        title: Bus strategy and supply chain rely on abstraction, industrial partners, and growing production capacity
        blocks:
          - type: paragraph
            body: >-
              Loft’s bus strategy appears to be “standardize the interface, then buy or scale industrial capacity
              underneath it.” The customer-facing message is bus agnosticism through Hub rather than a monolithic
              in-house spacecraft design. The strongest public supply-chain evidence comes from EarthDaily’s 2022
              partner release, which says Loft contracted Airbus to supply buses based on Airbus OneWeb heritage and
              production lines while Loft handled integration, launch, operations, and cloud-connected downlink support.
              That fits the broader architecture story: Loft keeps the mission layer, payload interface, and operations
              stack while leaning on proven bus manufacturing where it can.


              Recent execution signals suggest that model is scaling, but still with partner dependence. Loft’s
              EarthDaily update says the company is moving from individual missions toward multi-constellation
              deployment, with more than twenty satellites targeted across an eighteen-month campaign. The Golden I&T
              center adds domestic integration capacity, while Orbitworks adds a separate UAE-based production vector
              with plans for fifty 500 kilogram satellites per year and components already secured for its first ten
              spacecraft. At the same time, Airbus and OneWeb illustrate what Loft is borrowing against: industrialized
              bus production, integrated supply chains, and very large on-orbit heritage. The implication is positive
              but nuanced. Loft has a credible path to scale because it abstracts above the bus, but public evidence on
              current vendor mix, unit economics, and long-lead single-source dependencies is still thinner than the
              company’s public rhetoric about speed.
