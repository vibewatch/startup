      - What would prove it
      - Key failure mode
    rows:
      - - Bear
        - >-
          Recognized revenue lands well below heuristic contract value, comp discipline compresses, and flagship
          programs slip.
        - 0.6 to 0.8
        - Private diligence shows sub-$100M revenue scale with weak gross margin or slow cash conversion.
        - Investors discover bookings are much less valuable than headline contract totals implied.
      - - Base
        - >-
