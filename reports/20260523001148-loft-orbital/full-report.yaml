      - number: '7.5'
        title: Competition, capital intensity, opacity, and no-go triggers
        blocks:
          - type: paragraph
            body: >-
              The most underrated Loft risk is not pure technology; it is the combination of capital intensity and
              limited disclosure in an industry where well-capitalized competitors are visibly scaling. Rocket Lab’s
              current spacecraft page emphasizes vertical integration, backlog, launch integration, mission operations,
              and heavy civil-defense reach. Public filings from Planet, Spire, and Rocket Lab reinforce that even
              scaled space businesses still worry about contract renewals, government regulation, launch failures,
              financial covenants, working capital, and key personnel. Market-structure sources then show how crowded
              the ecosystem has become: BryceTech says nearly 2,800 smallsats launched in 2024, Novaspace says demand
              sustainability and financing now require closer scrutiny, and SIA’s framing shows competition stretches
              across services, manufacturing, ground, and launch.


              Against that backdrop, Loft’s choice to keep revenue and valuation undisclosed increases residual risk.
              The public market already prices space firms across an enormous range, from Rocket Lab’s tens of billions
              to Momentus’s tens of millions. That spread does not prove Loft is mispriced, but it does show how
              brutally sentiment can reset when execution disappoints. The right no-go triggers are therefore
              operational and monitorable: repeated flagship launch slips, failure to keep EarthDaily- and CNES-class
              programs on track, a mission failure without clear insurance clarity, evidence that one or two programs
              dominate bookings, or a financing event that exposes weaker-than-advertised unit economics. Loft may clear
              all of those hurdles; the point is that the investment case should stay conditional until management can
              document them privately.
