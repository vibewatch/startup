      - number: '4.3'
        title: Unit economics proxies suggest capital efficiency, but operating leverage is still opaque
        blocks:
          - type: paragraph
            body: >-
              The strongest public unit-economics proxy is the simple one: bookings divided by capital raised before the
              Series C. On Loft’s own numbers, that ratio exceeded 3.1x, which is impressive in context and helps
              explain why management and investors emphasize capital efficiency. There are also scale signals that
              usually matter for operating leverage: Loft says it sold over 30 satellites, keeps tens of satellites on
              the shelf at its Golden integration facility, and is moving from a handful of launches per year toward
              10-plus and then toward full-constellation execution. Those facts imply some combination of standardized
              procurement, repeatable integration, and reusable operating infrastructure rather than pure bespoke
              engineering every time.


              But the file still breaks at the exact place where a real model needs numbers. Headcount is inconsistent
              at 251 versus 300. No source discloses revenue per employee, gross margin, warranty or failure reserves,
              launch pass-throughs, collection timing, or renewals on mission-operations revenue. Even the best-known
              annualized contract heuristic — roughly €100 million implied by Sifted’s €500 million commercial-contract
              figure and five-year average term — is explicitly not a disclosed ARR number. The discipline point is
              straightforward: public evidence supports a case that Loft may be more capital efficient than many space
              peers, but it does not yet support a hard view on contribution margin or operating leverage.
