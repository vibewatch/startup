      - number: '2.2'
        title: TAM, SAM, and SOM need constrained lenses and explicit caveats
        blocks:
          - type: paragraph
            body: >-
              The best public sizing evidence for Loft starts with outer bounds, not with a clean revenue TAM. BryceTech
              shows that nearly 2,800 smallsats launched in 2024 and that average mass reached 223 kilograms, while
              Novaspace scopes the smallsat market up to 500 kilograms and segments demand across commercial, civil, and
              defense buyers. Those data points matter because they confirm there is ample physical mission activity in
              the smallsat form factor where standardization should matter. But they do not prove that all of that
              activity is serviceable by Loft. BryceTech also says communications satellites are the majority of
              launches, which means a large share of the volume sits in vertically integrated constellations or business
              models where Loft is not the natural provider.


              The cleaner near-term lens is served volume. EarthDaily alone is a ten-bus program, Loft is scaling to
              more than twenty satellites over eighteen months, and management says it is moving from a handful of
              launches per year to 10-plus. Those are concrete signs of current demand, but they still do not convert
              into a public SAM or SOM in dollars. SIA, Novaspace, and FAA materials help define the surrounding market
              architecture, yet none of the accessible extracts isolate a hosted-payload or virtual-mission revenue
              pool. The practical diligence conclusion is that Loft's market is real and expanding, but public sources
              still support only a constrained, program-scale sizing framework rather than a precise bankable TAM slide.
            claimRefs:
