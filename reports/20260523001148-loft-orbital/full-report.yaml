      - number: '8.3'
        title: Loft's mark only looks fair if bookings convert into real revenue efficiently
        blocks:
          - type: paragraph
            body: >-
              The strongest public efficiency signal in the file is still Loft's own bookings claim. More than $500M of
              lifetime bookings on only $160M of pre-Series-C capital implies a bookings-to-capital ratio above 3.1x,
              which is unusually strong for a hardware-and-mission-heavy space company. That signal matters because it
              suggests real customer pull and some degree of productization. EarthDaily's 10-bus contract, the April
              2026 six-satellite launch, and the CNES award all support the idea that Loft is selling more than one-off
              demos. They show recurring patterns of bundled infrastructure, mission operations, and sovereign work that
              could justify a healthy multiple if those contracts convert cleanly into recognized revenue and margin.


              But public evidence still stops short of the numbers that would make the current mark obviously
              attractive. Sifted's contract arithmetic can be translated into roughly €100M of annualized contract
              value, yet that is not a disclosed ARR figure, and even the sources that report fast growth also say Loft
              withheld hard revenue figures. A ~$1B mark would be around 10x on that heuristic annualized contract
              value, but it is only around 2x lifetime bookings, which is not an underwriting multiple because bookings
              are cumulative, multi-year, and can include lower-quality or pass-through economics. Planet's filing
              reminder that large satellite-services contracts complicate revenue recognition is especially relevant
              here. Loft can look fair on conversion-friendly assumptions and stretched on weak-conversion assumptions
              without any contradiction in the public record.
            claimRefs:
              - CV018
