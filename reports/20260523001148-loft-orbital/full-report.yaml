  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Round evidence supports a low-unicorn mark, but not a precise one
        blocks:
          - type: paragraph
            body: >-
              Loft's January 2025 financing is real and well corroborated: the company, TechCrunch, Via Satellite,
              GovConWire, and other outlets all align on a $170M Series C led by Tikehau Capital with Axial Partners.
              The harder question is what, exactly, that round priced. Loft itself would not disclose the post-money
              valuation or hard revenue figures. Independent market-data sources split the difference rather than close
              it: Yahoo/Forge modeled a post-money valuation around $954.6M, while Sifted reported, through
              direct-knowledge sources, that Loft crossed the $1B threshold. That is enough to say the company sits
              around the low-unicorn boundary; it is not enough to defend a single exact mark without management
              materials.


              The same pattern shows up in capital-raised math and in revenue disclosure. Public totals after the Series
              C range from roughly $300M to $330M depending on the outlet, with Yahoo/Forge at $316.27M in between. Loft
              does disclose stronger commercial proof than it does financial proof: over $500M of lifetime bookings,
              more than 30 satellites sold, and multi-year constellation and sovereign programs. But the company still
              does not publish recognized revenue, ARR, gross margin, cash, or cap-table structure. That means the
              valuation conversation has to start from ambiguity, not precision: a real late-stage space-infrastructure
              company with credible demand, but an underwriting file that still lacks the private numbers required to
              turn a headline mark into conviction.
            claimRefs:
              - CV001
