        title: Public customer evidence spans commercial constellations, sovereign programs, and software-led users
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to four customer surfaces rather than one simple logo wall. First are commercial
              analytics and earth-observation companies that want Loft to absorb spacecraft integration, launch, and
              operations; EarthDaily is the clearest example because its own releases describe Loft as the lead mission
              partner for ten buses and ongoing operations. Second are government, defense, and civil-space buyers such
              as NASA-adjacent work, SDA-related programs, and French sovereign missions, where Loft appears either as
              infrastructure provider or consortium lead. Third are software and application teams using virtual
              missions or on-orbit AI, where Loft markets the ability to deploy code without building dedicated
              hardware. Fourth are channel and regional relationships—Viasat, Ball and Microsoft, Marlan and Orbitworks,
              and Azure-linked development surfaces—that help Loft get embedded into larger programs.


              The important nuance is that buyer, user, and payer often differ. EarthDaily pays Loft for mission
              infrastructure while its own end users sit in agriculture, insurance, ESG, disaster response, and other
              analytics markets. Public-sector programs are similarly layered: an agency or prime funds the spacecraft
              work, but downstream operators and mission users sit elsewhere in the stack. That means the visible
              customer set is broader than a simple count of direct paying logos, but it also makes concentration harder
              to judge from public materials alone.
