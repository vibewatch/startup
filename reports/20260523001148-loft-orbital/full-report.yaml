      - number: '5.2'
        title: Integration, testing, and mission operations are built as reusable product layers
        blocks:
          - type: paragraph
            body: >-
              Loft’s strongest technical differentiation is not just that it has satellites in orbit; it is that the
              company has published a fairly coherent preflight-to-operations toolchain. Hub abstracts the
              payload-to-bus interface. HubKit extends that abstraction off spacecraft by letting payload teams plug
              into flight-representative electrical and software interfaces early, using the same logs, procedures, and
              pass-fail scripts Loft later reuses during final integration. The Software & Integration teams page fills
              in the org chart behind that promise: SRE owns cloud reliability and scalability, Cockpit engineers build
              command-and-control tooling, hardware-in-the-loop teams maintain next-generation test benches, and
              customer operations engineers bridge payload interfaces and flight execution.


              That workflow is reinforced by Loft’s SatDevOps doctrine. The company explicitly says it has no separate
              satellite-operations team and instead scales through automation, shared accountability, observability, and
              CI/CD-style practices. The Golden Integration & Test Center adds physical proof that this is meant to be
              repeatable, not artisanal. A 13,000 square foot site with ISO-8 cleanrooms, storage, rework, environmental
              testing, and R&D space is a fulfillment asset, not just a demo lab. Taken together, Hub, HubKit, Cockpit,
              SatDevOps, and the Golden facility describe a technical operating model designed to compress schedule risk
              and absorb mission variety without re-architecting the stack from scratch for each customer.
