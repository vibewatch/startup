  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or signal
      - Transmission to thesis
      - Action implication
    rows:
      - - Bookings do not convert into revenue
        - Private diligence shows weak near-term conversion or heavy pass-through content
        - The fair-value case loses its core economic bridge.
        - Move from track to avoid or demand a much lower entry.
      - - Flagship programs slip materially
        - EarthDaily, CNES, or sovereign follow-ons miss schedule or scope expectations
        - Execution proof weakens and the bull case range compresses quickly.
        - Re-underwrite valuation on slower cadence and lower confidence.
      - - Preference stack is heavy
        - Series C and earlier rounds create meaningful senior overhang over new common-equivalent money
        - Headline post-money stops mapping to actual investor economics.
        - Demand cap-table transparency or step away from the round.
      - - Customer concentration is too high
        - A few programs dominate revenue, backlog, or cash collection
        - Downside asymmetry rises because one slip can reset the whole model.
        - Require concentration haircuts in any underwriting model.
      - - Going-concern-like behavior appears in peers or sector sentiment
        - Space-service public comps re-rate downward on financing stress or weak conversion
        - Private marks can lose support even if Loft executes operationally.
        - Use public-peer stress as a reason to widen required return.
    notes: >-
      These are not generic operating risks; they are the specific failure modes that would invalidate a fair-value
      reading of the current mark.
    claimRefs:
      - CV017
      - CV026
      - CV049
      - CV050
      - CV053
      - CV058
      - CV063
      - CV065
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Recognized revenue by program
        - Quarterly revenue by EarthDaily, sovereign, rideshare, and virtual-mission streams
        - This is the missing bridge between bookings headlines and valuation support.
        - Request audited 2025 and year-to-date 2026 revenue schedules by program and stream.
      - - Gross margin by stream
        - Cost of revenue split across hardware, launch pass-through, operations, and software layers
        - A fair low-unicorn mark depends on economics, not only on commercial demand.
        - Obtain gross-margin bridge and contract-level contribution margin for flagship programs.
      - - Cash and runway
        - Current cash, debt, burn, and downside runway assumptions
        - Runway determines whether the current mark is durable or just a bridge to the next financing.
        - Review latest balance sheet, debt schedule, and monthly cash model.
      - - Cap-table preferences
        - Liquidation stack, anti-dilution, and senior rights from prior rounds
        - Headline post-money can badly overstate new-money economics if senior claims are heavy.
        - Request post-Series-C cap table and summary of investor rights.
      - - Backlog conversion and cancellations
        - Milestone timing, customer deposits, termination clauses, and collections history
        - Bookings quality is the single biggest unknown in Loft's valuation story.
        - Review top contracts with cancellation and billing terms.
      - - Customer concentration and renewal
        - Share of revenue, backlog, and growth tied to top accounts and sovereign programs
        - A few accounts can make a fair mark look cheap or expensive depending on durability.
        - Ask for top-10 customer mix, renewal history, and concentration stress tests.
    notes: >-
      These diligence asks are the minimum package required to move from fair-and-track toward a true priceable
      underwriting case.
    claimRefs:
      - CV014
      - CV022
      - CV064
      - CV065
