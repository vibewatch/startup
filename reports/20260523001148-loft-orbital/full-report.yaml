      - number: '3.2'
        title: Direct hosted-payload and orbital-infrastructure peers
        blocks:
          - type: paragraph
            body: >-
              Among public or semi-public alternatives, Spire is the cleanest direct peer because it markets hosted RF
              payloads, custom builds, mission operations, secure data handling, and a capex-to-opex framing on top of a
              real installed fleet and ground network. Sidus is also a direct peer, but it presents more as a smaller
              manufacturing-and-operations provider anchored around LizzieSat than as a software abstraction layer.
              Momentus overlaps on buses, transportation, and orbital infrastructure, yet the public materials in this
              pack emphasize rebuilding momentum and balance sheet health more than they demonstrate scaled installed
              heritage.


              These peers matter because they can pursue many of the same government, defense, and commercial mission
              budgets as Loft. But the competitive texture is different in each case. Spire is RF- and security-led.
              Sidus is manufacturing- and mission-management-led. Momentus is in-space-transport and
              orbital-infrastructure-led. None of those public descriptions matches Loft’s explicit pairing of
              Hub/Cockpit abstraction, developer-facing virtual missions, and AI-oriented on-orbit software deployment.
              That makes Loft strongest when the buyer wants a simplified application layer on top of spacecraft
              infrastructure rather than only a bus, a rideshare, or an RF mission vehicle.
