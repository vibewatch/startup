      - number: '1.2'
        title: Leadership, Key-Person Dependence, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture in this source pack centers heavily on the founders. Pierre-Damien Vaujour
              appears as CEO and co-founder across company releases and third-party profiles, while Alex Greenberg is
              repeatedly quoted as co-founder and COO. More recent product and sovereign-program disclosures identify
              other functional leaders — CTO Pieter Van Duijn on the YAM-9 architecture, Paul Lasserre as the new AI for
              Space general manager, and Emmanuelle Meric as Loft Europe’s GM on the DESIR contract announcement — but
              the external narrative is still founder-led.


              That has two diligence implications. First, the public brand and customer narrative appear concentrated in
              a small number of executives, especially around fundraising, platform strategy, and French sovereign
              programs. Second, governance disclosure is thin relative to Loft’s scale and government exposure. The
              materials provided here do not disclose the board roster, investor board rights, or independent-director
              oversight structure. For a company that is simultaneously scaling commercial constellations, federal work
              through Loft Federal, and national-sovereignty programs in France and the UAE, the absence of public
              governance detail is a real diligence gap rather than a cosmetic omission.
            claimRefs:
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
      - number: '1.3'
        title: Funding History, Valuation Ambiguity, and Scale Signals
        blocks:
          - type: paragraph
            body: >-
              Loft’s strongest publicly corroborated financing fact is the January 2025 Series C: $170 million co-led by
              Tikehau Capital and Axial Partners. Combining the company’s statement that it had previously raised $160
              million with TechCrunch’s reporting yields an implied lifetime funding total of roughly $330 million after
              the round, although some trade coverage rounded the cumulative number to $300 million. The disclosed
              Series C syndicate mixes French institutional capital, U.S. venture firms, and sovereign-wealth-linked
              money, which fits Loft’s cross-border footprint and government-facing ambitions.


              The valuation picture is weaker. TechCrunch cited PitchBook for a $550 million post-money valuation after
              the 2021 Series B, but Loft refused to disclose a post-money number for the Series C. Sifted reported that
              people with direct knowledge put the new valuation above $1 billion, while Yahoo/Forge private-market data
              estimated roughly $954.6 million. That conflict matters because the company is clearly pitching
              unicorn-adjacent scale, yet the exact post-money economics remain unverified.


              Operational scale signals are stronger than the valuation signal. Loft says it crossed $500 million of
              lifetime bookings on only $160 million of pre-Series-C capital, sold over 30 satellites, and deployed more
              than 25 missions across five launched satellites. It also says revenue doubled over multiple years, but
              management still withheld hard revenue figures. Headcount is similarly unresolved: a 2026 Tailscale case
              study says the team reached 300 worldwide, whereas Yahoo’s 2026 profile lists 251 full-time employees.
