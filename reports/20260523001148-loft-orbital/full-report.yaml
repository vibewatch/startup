      - number: '3.3'
        title: Integrated substitutes and launch/manufacturing adjacencies
        blocks:
          - type: paragraph
            body: >-
              Loft also competes with companies whose center of gravity sits elsewhere in the stack. Planet is mainly a
              data and analytics company, but its 10-K makes clear that it also designs customer-owned satellites,
              procures launches, supports ground infrastructure, and operates missions. That makes Planet a substitute
              whenever the customer really wants imagery outcomes and an embedded data platform. Rocket Lab is the
              clearest upstream adjacency: it combines launch cadence, private launch complexes, spacecraft production,
              and on-orbit management. Airbus and OneWeb show a different form of scale, where industrial satellite
              manufacturing and installed communications infrastructure can be sold as a proven system rather than as
              neutral mission abstraction.


              Exolaunch is narrower, but it is still strategically relevant because many buyers first solve for launch
              integration and deployment logistics before they solve for on-orbit software or abstraction. If that
              upstream budget gets committed to a launch-centric provider or an integrated launch-plus-space-systems
              provider, Loft can lose the program without ever being head-to-head on product features. The result is
              that buyers may switch not only among “Loft-like” vendors, but across entirely different ownership models:
              outsourced mission infrastructure, vertically integrated data platforms, direct connectivity networks,
              bundled launch-plus-spacecraft stacks, or launch-only integration specialists.
