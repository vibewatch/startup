      - number: '3.5'
        title: Where rivals are stronger and what that means for moat durability
        blocks:
          - type: paragraph
            body: >-
              The counterweight is scale, installed base, and specialization. Public-market proxies make the asymmetry
              obvious: Rocket Lab and Planet dwarf the smaller space-services names in market value, while Spire still
              sits materially above Momentus and has a much more explicit RF-security specialization. Rocket Lab is
              stronger wherever launch control and flight heritage decide the purchase. Planet is stronger where the
              buyer values a historical data archive, recurring subscriptions, and embedded analytics workflows. Airbus
              and OneWeb are stronger when industrial production credibility and installed network scale matter most.
              Exolaunch is stronger when the budget is mainly about launch integration rather than on-orbit abstraction.


              Public pricing opacity makes the exact economics hard to compare, and that is why switching costs look
              moderate rather than locked in. Sophisticated buyers can re-scope the same mission need toward data,
              connectivity, launch, or internal build. Loft’s moat therefore looks durable only when the company keeps
              its software-defined mission layer, AI deployment model, and sovereign-ready positioning attached to the
              infrastructure offer. Generic “space services” language is not enough on its own because more public
              players now market standardized, end-to-end, or industrialized mission layers that can commoditize the
              baseline infrastructure story.
