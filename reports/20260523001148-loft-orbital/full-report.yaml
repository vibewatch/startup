  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital’s risk profile is shaped less by a single existential flaw than by a stack of coupled
              execution dependencies. The company’s own January 2025 financing note says 2025 is the year it expects to
              reach fleet scale, and the same source says the current manifest spans EarthDaily, SDA work, and several
              rideshare programs. That ambition is impressive, but the company also explicitly says the satellite side
              of the industry is still plagued by schedule problems and that vendor schedules are often more suggestion
              than commitment. In other words, Loft’s headline growth story already contains the core risk disclosure:
              rapid scale depends on buses, payload integration, launch allocations, and partner execution moving in
              sync.


              The most material risks therefore sit in four clusters. First is launch and supply-chain concentration:
              Loft still depends on external rideshare cadence, external buses, and external manufacturing ramp. Second
              is program concentration: EarthDaily remains the clearest commercial reference, while French sovereign
              work and defense-adjacent programs now carry strategic weight. Third is compliance and security:
              remote-sensing licensing, FCC constraints, export controls, ITAR-adjacent handling, and sovereign data
              segregation all matter more as Loft works across governments and cross-border partnerships. Fourth is
              opacity: TechCrunch says Loft declined to reveal hard revenue figures and valuation, while Sifted reports
              unicorn-level pricing that Loft declined to confirm. That combination makes residual exposure look higher
              than the product story alone would suggest.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR017
              - CR018
