companyProfile:
  summary: >-
    Loft Orbital is a French-American space infrastructure company founded in January 2017. It packages standardized
    satellite hardware, mission integration, launch, operations, and software-defined virtual missions into one platform
    built around Hub, Cockpit, and related compute tooling. Public evidence shows meaningful traction across both
    commercial and sovereign programs, especially EarthDaily's 10-satellite constellation, NASA-linked and SDA work
    through Loft Federal, and French sovereign contracts including DESIR. After a $170 million Series C in January 2025,
    the best-supported public read is a roughly $1 billion valuation with about $330 million of lifetime funding, while
    exact revenue, margin, and governance visibility remain limited.
