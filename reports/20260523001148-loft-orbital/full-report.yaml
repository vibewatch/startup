      - number: '5.3'
        title: The compute architecture is moving from software-only demos to heterogeneous on-orbit infrastructure
        blocks:
          - type: paragraph
            body: >-
              The most important product evolution is Loft’s move from “software can run in space” messaging toward a
              disclosed compute architecture with real design choices. YAM-6 established the software-deployment
              pattern, but YAM-9 is the more consequential technical signal because Loft now says it is flying four
              networked compute nodes with mixed CPUs, NVIDIA GPUs, and AI accelerators across x86 and ARM. That is a
              stronger maturity signal than a single-box edge processor claim. Loft further says the platform is the
              future evolution of Hub Compute: a secure distributed processing layer that can host multiple applications
              in parallel and that is designed for mission-specific edge inference rather than general-purpose orbital
              data-center workloads.


              CatGPT and the Inside Loft AI post extend that picture from marketing surface to implementation clues.
              Loft now publicly describes Linux-based onboard systems, Kubernetes clusters in orbit, a
              microservice-driven mission-control system, SpaceVPN experiments using modern networking components, and
              sandboxed workload isolation so multiple customers can run software on shared infrastructure. The AI for
              Space business unit and customer demos such as SmartSat and Little Place Labs show why those primitives
              matter: Loft wants to be the platform where governments, primes, and analytics teams deploy models, not
              merely the vendor that uplifts payloads. The technical story is therefore becoming more platform-like and
              more credible, even if most performance evidence still comes from Loft itself rather than from external
              benchmarks.
