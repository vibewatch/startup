  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Loft sells a layered mission platform, not just hosted payload seats
        blocks:
          - type: paragraph
            body: >-
              Loft’s public product surface now spans two distinct customer entry points that still converge on one
              platform. Traditional customers can buy physical missions, where Loft integrates, tests, launches, and
              operates payloads on a standardized spacecraft platform. Software-first customers can instead buy virtual
              missions, where they develop applications against Loft’s compute, sensing, and connectivity stack without
              building hardware. That split matters because it changes the comparison set: Loft is not only a
              hosted-payload vendor, but also a cloudlike infrastructure layer for customers that want answers and
              software behavior in orbit rather than just a satellite bus.


              The workflow Loft publishes is unusually explicit for a space-infrastructure company. Ultimate Edge gives
              customers a secure cloud development environment and virtual test bench, while Cockpit provides the
              operational surface to task resources once the application or payload is live. The official pages describe
              onboard imagers, SDRs, CPUs, GPUs, inter-satellite links, and global ground-station access as reusable
              platform resources. YAM-6 then makes that workflow concrete by framing the satellite as the first
              virtual-mission-enabled node, complete with SDK, documentation, and APIs. Public customer examples such as
              Little Place Labs and SmartSat reinforce that this is not only a concept page: Loft is already using the
              same stack to support maritime-domain-awareness and wildfire-detection workloads in orbit.
            claimRefs:
