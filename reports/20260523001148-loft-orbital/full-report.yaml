      - number: '4.2'
        title: Bookings and contract scope show demand, but they do not prove hard revenue
        blocks:
          - type: paragraph
            body: >-
              The most supportable public reading of Loft’s revenue model is that it sells bundled mission
              infrastructure rather than a clean software subscription. EarthDaily’s 2022 partner announcement is the
              clearest example: Loft’s contract covers 10 satellite buses, payload integration, launch, spacecraft
              operations, and cloud-connected downlink support. The April 2026 six-satellite launch update extends that
              picture, showing Loft moving from single missions into full constellations and doubling its fleet within a
              broader 18-month campaign of more than twenty satellites. Those are meaningful commercial and operational
              signals, but they describe scope and execution burden more than they describe recognized revenue. A $150
              million customer constellation budget is not the same as Loft revenue, and even Loft’s own bookings metric
              is cumulative, multi-year, and not mapped publicly to revenue recognition.


              The same caution applies to newer AI and virtual-mission stories. Loft clearly wants investors and
              customers to see virtual missions as a higher-value layer, and public materials show real usage: more than
              ten customer AI workflows on orbit, YAM-9 as a more capable compute architecture, and a SmartSat wildfire
              workload framed as a proof-of-concept for future operational service. But there is still no public list
              price, no disclosed mix of revenue from virtual versus physical missions, and no margin data. Public
              evidence supports “Loft is monetizing mission infrastructure somehow across physical, operational, and
              AI-enabled services.” It does not support hard ARR, recognized revenue, or a claim that the AI layer is
              already financially material.
