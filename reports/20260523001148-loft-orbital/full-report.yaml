  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Direction
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - thesis
        - Loft has rare commercial traction for a space-infrastructure company.
        - >-
          Series C, $500M+ bookings, EarthDaily scope, CNES contract, and constellation execution signals show real
          demand.
        - If flagship programs slip or disclosed revenue conversion proves weak, traction quality falls materially.
      - - thesis
        - The company appears more capital efficient than many hardware peers.
        - '>$500M bookings on $160M pre-Series-C capital implies >3.1x bookings-to-capital.'
        - If margins or working-capital needs consume most of that value, the efficiency signal weakens.
      - - anti-thesis
        - The post-money is still not publicly confirmed.
        - Sifted says >$1B, Yahoo/Forge says about $954.6M, and Loft declined to confirm either number.
        - Executed cap-table and signed round docs would collapse the valuation ambiguity quickly.
      - - anti-thesis
        - Bookings and contract scope can be mistaken for recognized revenue.
        - >-
          EarthDaily and sovereign programs prove demand, but public sources still do not disclose revenue, ARR, gross
          margin, or deferred revenue.
        - Audited revenue by stream and backlog-conversion data would move the file from narrative to model.
      - - anti-thesis
        - Comparable multiples are too dispersed for a single clean mark.
        - >-
          Spire screens near 7x while Rocket Lab, Planet, Momentus, and Sidus screen far higher for idiosyncratic
          reasons.
