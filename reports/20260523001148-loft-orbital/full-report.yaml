      - number: '1.4'
        title: Customers, Partnerships, and Government Program Expansion
        blocks:
          - type: paragraph
            body: >-
              Loft’s public customer set spans commercial, civil, and defense buyers, which is strategically important
              because it suggests the business is not dependent on a single market segment. Named counterparties include
              NASA, Microsoft, BAE Systems, the U.S. Space Force, CNES, ESA, EarthDaily, Helsing, Eutelsat, and Anduril.
              The EarthDaily program is particularly revealing: EarthDaily selected Loft as lead mission partner in
              2022, and Loft’s scope covers satellite buses, integration, launch, and operations. By April 2026 the
              partnership had advanced to a six-satellite launch campaign that Loft said would double its fleet and sit
              inside a broader eighteen-month plan to deploy more than twenty satellites.


              Government-facing work is also widening. Viasat selected Loft for a NASA communications-services
              demonstration that adds persistent relay connectivity to Loft’s virtual-mission stack. Loft Federal’s NExT
              role with Ball Aerospace and Microsoft shows the company adapting commercial infrastructure for
              national-security payloads. Internationally, Orbitworks gives Loft a UAE manufacturing and
              constellation-production beachhead with more than $100 million of initial capital and an eventual target
              of up to fifty 500-kilogram satellites per year. Together these programs suggest Loft is evolving from a
              hosted-payload startup into a multi-jurisdiction infrastructure prime with commercial, defense, and
              sovereign-space touchpoints.
            claimRefs:
              - CO022
              - CO023
              - CO024
              - CO025
              - CO026
              - CO027
              - CO028
              - CO035
