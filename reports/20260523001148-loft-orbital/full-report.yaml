      - number: '8.2'
        title: Public comps are useful calibration, but the spread is too wide for false precision
        blocks:
          - type: paragraph
            body: >-
              The best way to use public comps here is as a range-finder, not a mechanical valuation engine. Loft sits
              between several public analogs but does not match any one of them cleanly. Spire is useful because it also
              offers hosted-payload and mission-operations infrastructure. Exolaunch shows a narrower launch-management
              adjacency. Planet and Rocket Lab are much larger and strategically richer businesses, while Momentus and
              Sidus represent weaker or thinner-revenue edges of the space-services landscape. Market-structure sources
              from Novaspace, BryceTech, and SIA reinforce the point: smallsat demand is real, but the economic value
              chain spans manufacturing, services, ground, and launch, and Loft participates in more than one of those
              boxes at once.


              That multi-subsector position is exactly why the comparable spread is so wide. On current May 2026 market
              caps divided by the latest accessible annual revenue figures, the public set runs from about 7x for Spire
              to more than 130x for Rocket Lab, with Planet above 50x and small-revenue names like Momentus and Sidus
              also producing distorted multiples. These are market-cap-to-revenue estimates, not enterprise-value
              multiples, and the reporting periods are not perfectly synchronized. The right takeaway is not that Loft
              deserves the median or the maximum. The takeaway is that a single sharp multiple would overstate the
              evidence. Public comps say only that Loft's current private mark is plausible inside a wide sector band
              and that judgment about quality of revenue conversion matters more than spreadsheet neatness.
            claimRefs:
