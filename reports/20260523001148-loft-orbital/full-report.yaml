          premium infrastructure.
        - 1.2 to 1.5
        - >-
          Follow-on sovereign wins, clean constellation delivery, and credible high-value software or AI contribution
          appear in the numbers.
        - AI and virtual-mission narrative remains strategically interesting but financially immaterial.
    notes: >-
