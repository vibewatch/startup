  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: mission infrastructure, not the whole satellite economy'
        blocks:
          - type: paragraph
            body: >-
              Loft Orbital fits best inside a narrow but economically meaningful layer of the space economy: mission
              infrastructure sold as a service. The company is not primarily selling launch vehicles, a pure satellite
              bus, or finished downstream geospatial products. Its official pages repeatedly define the job as
              integrating, testing, launching, and operating missions on a standardized platform so the customer can
              stay focused on the payload, the application, or the end-user outcome. That definition pulls hosted
              payloads, turnkey physical missions, and software-first virtual missions into scope because Loft is
              offering the abstraction layer that sits between the payload or application and the underlying spacecraft
              stack.


              The same logic requires discipline on excluded spend. Launch-provider revenue, bespoke spacecraft
              engineering, broadband subscriptions, and downstream analytics products are all adjacent but not identical
              to Loft's core market. EarthDaily is the clearest example: Loft runs buses, integration, launch,
              operations, and cloud-connected infrastructure, while EarthDaily keeps the analytics and end-customer
              layer. That is why this chapter sizes Loft against mission infrastructure, hosted payload, and
              virtual-mission budgets rather than against every dollar spent anywhere in satellites, connectivity, or
              Earth observation.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM008
              - CM010
              - CM018
          - type: table
            tableRef: TM001
