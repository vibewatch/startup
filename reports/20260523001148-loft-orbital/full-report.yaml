      - number: '2.5'
        title: Substitutes and adjacent models
        blocks:
          - type: paragraph
            body: >-
              Loft does not compete only with other hosted-payload startups. Some substitutes sit upstream. Exolaunch
              focuses on launch, deployment, and mission management. Airbus represents a more traditional manufacturing
              and constellation-production path. Sidus offers a multi-mission bus and operations layer under its own
              platform. OneWeb shows how a customer can buy connectivity from a huge integrated network instead of
              commissioning a bespoke sensing or software mission. Other substitutes sit downstream. Planet sells Earth
              data, derived products, cloud tools, and self-service access so that many customers can purchase the
              outcome rather than the spacecraft program. Spire combines data businesses with a space-services offer
              that includes hosted payloads, custom builds, and secure mission data handling.


              This matters for Loft because budgets can migrate in multiple directions. A buyer may outsource mission
              infrastructure to Loft, buy launch and deployment only from a narrower vendor, purchase data or
              connectivity from an existing network, or partner with a more vertically integrated satellite operator.
              The right market lens is therefore not “satellites” in the abstract, but the subset of workloads where
              customers want mission access without owning the whole industrial stack themselves.
            claimRefs:
              - CM035
              - CM036
              - CM037
              - CM038
              - CM039
              - CM040
