  - CU024
- calloutType: risk
  title: Logo breadth is real, but portfolio-quality metrics are mostly absent
  body: The main risk is analytical overreach. Loft clearly has real named customers and partners, but the public pack still lacks active customer count, renewal cohorts, churn, satisfaction metrics, and top-customer share. Without those, breadth of named logos should not be mistaken for breadth of durable, referenceable revenue.
