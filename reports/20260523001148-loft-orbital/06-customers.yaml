- id: TU006
  title: Referenceability and evidence-gap register
  columns:
  - Mentioned customer / program
  - Independent verification status
  - Strongest public proof
  - What remains missing
  - Analytical treatment
  rows:
  - - EarthDaily
    - Strong
    - Customer-authored 2022 contract scope and 2026 launch update
    - Contract value to Loft, renewal terms, and satisfaction metrics
    - Treat as strongest commercial reference customer
  - - Viasat / NASA RTSR
    - Strong-Medium
    - Viasat official release naming Loft in NASA-backed demo
    - Recurring revenue, post-demo follow-on, and end-customer ownership
    - Treat as credible partner-led proof, not yet full durability proof
  - - Ball / Microsoft / SDA NExT
    - Medium
    - Two third-party trade reports confirm program inclusion
    - Loft role, economics, and operational duration after testbed
    - Treat as validated defense-program inclusion with limited customer-quality visibility
  - - CNES / DESIR / IOD-IOV
    - Medium
    - Independent SAR coverage plus Loft official sovereign-program details
    - Consortium economics, exercise milestones, and referenceability from customer side
    - Treat as sovereign trust signal with incomplete economics
  - - QEYSSat / Honeywell
    - Partial
    - CSA proves mission reality while Loft home page names Loft relationship
