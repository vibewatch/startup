callouts:
- calloutType: strength
  title: EarthDaily and sovereign France show Loft can win both commercial and public-sector mission anchors
  body: Loft’s best customer evidence is not a single logo mention. It is the combination of one strong commercial anchor (EarthDaily) and several public-sector or sovereign programs with real external corroboration. That mix suggests Loft’s standardized infrastructure can cross procurement contexts rather than serving only one niche buyer type.
