- id: government-weight-sovereign-programs
  title: When proof quality is weighted, the public customer book skews government and sovereign outside EarthDaily
  body: |-
    Once the public file is weighted by proof strength rather than by raw logo count, the named customer set looks more government-heavy than Loft’s marketing shorthand suggests. EarthDaily is the standout commercial anchor, but most other independently corroborated programs in this pack involve public-sector or sovereign demand: Viasat and NASA relay work, SDA NExT, CNES earth-observation contracting, and the DESIR sovereign SAR demonstrator. Even QEYSSat only partially bridges the gap: the Canadian Space Agency proves the mission is real, while Loft’s own site supplies the Loft-specific relationship.

    That does not mean commercial demand is weak. It means public commercial evidence is narrow. The likely pattern is a mixed portfolio in which analytics companies, defense users, civil agencies, and national-sovereignty programs all buy the same standardized infrastructure for different reasons—speed to orbit, managed operations, secure national capability, or access to onboard compute. The unresolved question is not whether Loft sells to both public and private buyers; it is which few programs dominate economics. On that point, public sources remain thin.
