      note: Customer gets a first mission milestone such as EarthDaily’s initial launch, NASA relay demo preparation, or sovereign demonstrator award.
    - label: Persistent operations
      note: Loft continues operating the mission while the customer focuses on analytics, payload outputs, or national capability objectives.
