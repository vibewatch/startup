- id: named-customer-proof
  title: Named proof is strongest where counterparties describe Loft’s role directly
  body: |-
    EarthDaily is the best public customer proof in Loft’s pack because the customer itself describes both scope and progress. EarthDaily’s 2022 partner announcement says Loft’s contract covers ten satellite buses, payload integration, launch, and spacecraft operations. The 2026 EarthDaily update then says Loft is integrating, launching, and operating the ten-satellite constellation and had already launched the first satellite in 2025 before a planned six-satellite launch. That sequence gives something rare in private-space diligence: named customer, stated scope, executive quote, and repeated execution across years.

    Outside EarthDaily, proof quality becomes more mixed but still meaningful. Viasat independently confirms Loft as the spacecraft partner in a NASA Communications Services Project relay demonstration. Defense trade press independently confirms Ball, Loft Federal, and Microsoft on SDA’s NExT testbed. French sovereign SAR work is independently covered as a real program. But many other names—Helsing, Little Place Labs, SmartSat, Azure-linked virtual missions, SpiderOak, NTT, Agenium, BAE Systems, ESA, and Eutelsat—come from Loft pages or Loft-sourced funding coverage rather than from customer-authored proof of production deployment or renewal.
