    - Validates government-ready infrastructure and classified-adjacent positioning
    - Loft role, margin share, and long-run follow-on are opaque
  - - Sovereign EO and radar programs
    - CNES, DGA, and France 2030-backed programs
    - Defense, intelligence, and civil-space users
    - CNES EO contract, DESIR SAR, IOD-IOV
    - Potentially sticky multiyear strategic programs
    - Economics and milestone schedule are incompletely public
  - - Virtual mission / AI application teams
    - Software groups, AI partners, and research consortia
