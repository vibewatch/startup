- id: durability-concentration-and-evidence-gaps
  title: Durability and concentration are the main unresolved customer-quality questions
  body: |-
    The biggest weakness in chapter 6 is not lack of any proof; it is lack of portfolio-quality metrics. The pack gives no active customer count, no segment split, no GRR or NRR, no renewal rate, no churn, and no top-customer exposure. EarthDaily offers the closest thing to a durable public reference because it spans 2022 partner selection through 2026 deployment milestones, but even there the economic importance to Loft is not public. Government and sovereign work can make concentration worse as well as better: multi-year programs are sticky, yet a few delayed or cancelled awards can swing utilization and cash conversion.

    Public logo breadth therefore should not be mistaken for customer diversification. The right read is that Loft has real named adoption and unusually strong proof for a small number of programs, but the company has not publicly disclosed the cohort, renewal, and concentration data needed to translate that proof into a durable customer-quality score. Any investment memo should treat customer breadth as supported, customer durability as partially supported, and customer concentration as unresolved pending private diligence.
