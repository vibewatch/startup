  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: customer-count-and-concentration
    missingEvidence: Current active paying-customer count, segment split, top-10 customer revenue and backlog share, and any disclosed single-program concentration thresholds.
    whyItMatters: The public file proves some real customers, but without account counts and concentration math it cannot distinguish a diversified platform from a portfolio dominated by a few large programs.
    diligencePath: Request a current customer register, top-10 revenue and backlog table, and segment mix by commercial, government, sovereign, and virtual-mission accounts.
    relatedQuestionRefs:
    - QU014
    - QU021
    relatedTableRefs:
    - TU002
    - TU005
  - type: private-evidence-only
    severity: blocking
    topic: retention-and-renewals
    missingEvidence: GRR, NRR, renewal rates, churn, reference-call policy, and any cohort view by commercial versus government customer segment.
    whyItMatters: Customer quality is ultimately a durability question; without renewal and churn data, the analysis can only score referenceability from isolated program proofs.
    diligencePath: Request contract-renewal schedules, churn reports, renewal cohorts, and any customer-satisfaction or reference-call materials used in sales or board reporting.
    relatedQuestionRefs:
    - QU013
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: logo-verification
    missingEvidence: Independent customer-authored or counterparty-authored proof for the broader logo set including NASA beyond partner channels, Microsoft, BAE Systems, ESA, Eutelsat, Agenium, NTT, Helsing, SmartSat, and Little Place Labs.
    whyItMatters: Marketing logo breadth can overstate portfolio quality if many names are real contacts, pilots, or partners rather than referenceable production customers.
    diligencePath: Ask management for a deployment-stage registry mapping every named logo to role, start date, mission scope, current status, and whether the account can be referenced.
    relatedQuestionRefs:
    - QU009
    - QU010
    - QU025
    relatedTableRefs:
    - TU003
    - TU006
  - type: private-evidence-only
    severity: material
    topic: virtual-mission-monetization
    missingEvidence: Named paying virtual-mission customers, production durations, pricing model, and the conversion rate from demos or developer engagement into recurring contracts.
    whyItMatters: The software-led expansion story is central to Loft’s upside case, but public sources stop at named experiments and workflow counts rather than monetized customer cohorts.
    diligencePath: Request the current virtual-mission pipeline, named paying accounts, contract terms, and a demo-to-production conversion analysis for AI workflows.
    relatedQuestionRefs:
    - QU010
    - QU015
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table coverage
    missingEvidence: An exhaustive, source-backed list of every publicly mentionable customer or program with segment, role, deployment stage, and last verified evidence date.
    whyItMatters: The chapter can only sample the proof surface today, which limits diversification and referenceability analysis across the full named-customer universe.
    diligencePath: Build a customer-proof ledger from management CRM plus approved references, then classify each logo as production, pilot, partner, prospect, or historical.
    relatedQuestionRefs:
    - QU002
    - QU024
    relatedTableRefs:
    - TU003
