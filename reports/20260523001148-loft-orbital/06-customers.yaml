- id: partner-channels-and-referenceability
  title: Partner channels and software surfaces expand reach, but referenceability remains uneven
  body: |-
    Loft’s customer-development story is not only direct sales to mission sponsors. Publicly visible channels show Loft embedding its infrastructure inside larger partner-led motions. Viasat brings Loft into a NASA-backed relay demonstration. Ball and Microsoft bring Loft Federal into SDA’s NExT testbed. Marlan and Orbitworks extend local industrial reach in the UAE. Azure- and developer-oriented virtual-mission pages show Loft trying to turn shared on-orbit compute into a software-led acquisition surface. That structure can be powerful because it lets Loft ride larger primes, cloud ecosystems, and national programs instead of sourcing every account from scratch.

    The tradeoff is referenceability. A partner-led program may validate Loft’s technical role without proving that the ultimate end customer will publicly reference Loft on renewal or expansion. Similarly, a developer or AI-partner page can show funnel creation while leaving conversion opaque. EarthDaily and Viasat give Loft the cleanest public reference set today; the broader virtual-mission and developer surface still looks more like credible top-of-funnel than audited customer-quality proof.
