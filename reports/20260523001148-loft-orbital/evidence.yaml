evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, board observer rights, and investor control provisions.
    whyItMatters: >-
      Key-person dependence is high, but public materials in this pack do not show how investors or independent
      directors oversee management.
    diligencePath: Request the current board deck, cap table governance schedule, and most recent financing documents.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A single run-date headcount from management or audited HR reporting.
    whyItMatters: >-
      Current scale is an input to burn, delivery capacity, and integration readiness, but public 2026 sources conflict
      between 251 FTE and 300 staff.
    diligencePath: Ask management for current FTE, contractor, and geography splits reconciled to payroll or HRIS data.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Revenue, ARR, gross margin, burn, and cash runway for the current fiscal period.
    whyItMatters: >-
      Public sources confirm growth rhetoric and bookings but do not provide the hard financial metrics needed to judge
      sustainability or proximity to profitability.
    diligencePath: Request monthly management accounts, bookings-to-revenue bridge, backlog aging, and cash runway forecast.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      Definitive post-money valuation, security type, and any secondary transaction data from the January 2025
      financing.
    whyItMatters: >-
      Public valuation references conflict between an unconfirmed >$1B narrative and secondary-market estimates around
      $954.6M.
    diligencePath: >-
      Request the Series C closing set, cap table waterfall, and any board materials that summarize primary versus
      secondary pricing.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: tam-sam-caveat
    missingEvidence: >-
      A public source that cleanly quantifies hosted payload, turnkey mission infrastructure, and virtual-mission demand
      in one comparable revenue pool.
    whyItMatters: Without a segmented dollar pool, TAM and SAM remain outer-bound lenses rather than valuation-grade market sizes.
    diligencePath: >-
      Request management's internal market map showing pipeline, bookings, and historical win rates split across
      physical missions, virtual missions, and sovereign programs, then reconcile it against third-party sector totals.
    relatedQuestionRefs:
      - QM009
      - QM026
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-payer-model
    missingEvidence: >-
      Contract values, budget owners, renewal mechanics, and gross-margin differences across Earth observation, defense,
      sovereign, and software-only mission programs.
    whyItMatters: >-
      Public buyer examples show who uses Loft, but not which segments actually drive revenue concentration, pricing
      power, or margin quality.
    diligencePath: >-
      Ask for the top ten contracts by ARR or TCV, the internal owner of each budget, and the share of revenue coming
      from recurring operations versus one-time integration and launch work.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: forecast-segmentation
    missingEvidence: >-
      An accessible public forecast that separates hosted payload and virtual-mission demand from the broader smallsat,
      launch, and satellite-services sectors.
    whyItMatters: >-
      The current source pack can show direction and outer bounds, but not a clean growth curve for Loft's exact
      category.
    diligencePath: >-
      Buy or obtain the full SIA, Bryce, or Novaspace materials that quantify integrator and hosted-services shares, or
      request a banker-quality market study from management.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: virtual-mission-unit-economics
    missingEvidence: Public pricing, attach rates, or workload economics for Loft's virtual-mission and AI-for-Space offerings.
    whyItMatters: >-
      Virtual missions expand the buyer pool conceptually, but investors still need proof that the software layer
      carries attractive repeat economics beyond a compelling demo story.
    diligencePath: >-
      Request cohort data on virtual-mission customers, workload pricing, mission duration, and compute or connectivity
      utilization to see whether software layers improve gross margin and retention.
    relatedQuestionRefs:
      - QM009
      - QM026
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Realized contract pricing, discounting, minimum commitments, and gross-margin by mission type for Loft and the
      closest infrastructure peers.
    whyItMatters: >-
      Public pages describe packaging logic but do not show the economics needed to know whether Loft wins on price,
      performance, or margin structure.
    diligencePath: >-
      Request current customer proposals, signed statements of work, and pricing policy by mission class for Loft, then
      benchmark against direct customer references for Spire, Sidus, and launch-led alternatives.
    relatedQuestionRefs:
      - QP014
      - QP027
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-cost
    missingEvidence: Comparable renewal, win-loss, multi-homing, and deployment-retention data across Loft and adjacent competitors.
    whyItMatters: >-
      Without renewal or win-rate evidence, the chapter can describe switching paths but cannot prove whether Loft
      enjoys durable lock-in or only temporary category fit.
    diligencePath: >-
      Ask management for cohort retention, repeat-program rates, and recent competitive win-loss analysis segmented by
      sovereign, commercial, and software-defined missions.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: minor
    topic: sovereign-selection
    missingEvidence: >-
      Program-level source-selection criteria and domestic-content requirements for sovereign buyers comparing Loft
      against Airbus, Rocket Lab, or Spire.
    whyItMatters: >-
      The public sovereign wins show relevance, but they do not fully reveal how much of the buying decision turned on
      software abstraction versus local-content, security, or industrial-policy requirements.
    diligencePath: >-
      Review proposal requirements, local-partner obligations, and security-control matrices for recent sovereign awards
      before assigning durable competitive advantage to the sovereign narrative alone.
    relatedTableRefs:
      - TP001
      - TP004
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Signed Series C term sheet, cap table, and any secondary-transactions schedule showing the actual post-money
      valuation and dilution waterfall.
    whyItMatters: >-
      Valuation quality affects cap-stack interpretation, return math, and whether the unicorn narrative rests on a true
      priced round or on secondary/private-market vendor extrapolation.
    diligencePath: Request the executed Series C financing documents, updated cap table, and board materials that approved the round.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: blocking
    topic: recognized-revenue
    missingEvidence: >-
      Audited revenue by quarter and by stream, plus backlog-to-revenue conversion schedules that distinguish bookings,
      contracted value, deferred revenue, and recognized revenue.
    whyItMatters: >-
      Without recognized revenue schedules, bookings and contract-value proxies can be mistaken for ARR or current
      revenue, which would distort underwriting materially.
    diligencePath: >-
      Request audited financial statements, revenue-recognition policy memos, and customer-program schedules tying major
      contracts to invoice and recognition timing.
    relatedQuestionRefs:
      - QI007
      - QI027
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Revenue split across physical missions, mission operations, government programs, virtual missions, and any AI
      workload or software component, including realized pricing and discount structures.
    whyItMatters: >-
      The bull case depends on whether higher-margin recurring software and operations revenue is actually material or
      still largely narrative.
    diligencePath: >-
      Request segment-level management accounts, contract archetypes, and a top-20 customer mix by stream, term, and
      renewal status.
    relatedQuestionRefs:
      - QI008
      - QI010
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn
    missingEvidence: >-
      Current cash balance, monthly cash burn, debt or launch-prepayment obligations, covenant packages, and a
      management runway model to breakeven.
    whyItMatters: >-
      A late-stage hardware-and-operations business can look capital efficient on bookings while still facing a
      near-term financing trigger if working capital and launch timing run ahead of collections.
    diligencePath: >-
      Request the latest balance sheet, trailing-12-month cash flow statement, debt schedule, and board-approved
      operating plan with downside runway cases.
    relatedQuestionRefs:
      - QI015
      - QI017
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: bookings-conversion
    missingEvidence: >-
      Program-level cancellation terms, change-order history, acceptance milestones, renewal rates, and customer
      concentration data for the largest contracts.
    whyItMatters: >-
      Large constellation and sovereign awards can create impressive headline value while still converting slowly,
      unevenly, or with material concentration risk.
    diligencePath: >-
      Request the top customer contracts, backlog aging, cancellation clauses, renewal cohorts, and collections history
      by program.
    relatedQuestionRefs:
      - QI004
      - QI011
      - QI020
    relatedTableRefs:
      - TI002
      - TI005
  - type: private-evidence-only
    severity: material
    topic: bus-supply-chain
    missingEvidence: >-
      Current vendor mix, long-lead components, pricing terms, and concentration data behind Loft's active bus and
      spacecraft supply chain.
    whyItMatters: >-
      Loft's speed narrative depends on repeatable spacecraft supply; without current supplier concentration and
      lead-time data, execution and margin risk remain under-modeled.
    diligencePath: >-
      Request the active supplier map, current bus contracts, long-lead inventory status, and single-source mitigation
      plan for 2026-2028 campaigns.
    relatedQuestionRefs:
      - QE018
    relatedTableRefs:
      - TE003
      - TE005
  - type: missing-source
    severity: material
    topic: reliability-slas
    missingEvidence: >-
      Public uptime, latency, MTTR, commissioning-success, and incident-response metrics for Cockpit, Ultimate Edge, and
      related connectivity services.
    whyItMatters: >-
      Mission-control and software-runtime reliability are core to Loft's moat, so the absence of platform assurance
      metrics weakens underwriting for enterprise and sovereign deployments.
    diligencePath: >-
      Ask for service-level objectives, historical incident reports, commissioning statistics, and customer-facing
      reliability dashboards or assurance packets.
    relatedQuestionRefs:
      - QE022
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: security-certifications
    missingEvidence: >-
      Named external certifications, audit reports, or trust-center artifacts covering Loft's platform security
      controls.
    whyItMatters: >-
      Sandboxing and policy language help, but external certifications often determine procurement velocity and
      confidence for shared infrastructure handling sensitive missions.
    diligencePath: >-
      Request any SOC 2, ISO 27001, FedRAMP, penetration-test, or equivalent audit artifacts that cover Cockpit,
      Ultimate Edge, and mission-operations environments.
    relatedQuestionRefs:
      - QE022
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: blocking
    topic: customer-count-and-concentration
    missingEvidence: >-
      Current active paying-customer count, segment split, top-10 customer revenue and backlog share, and any disclosed
      single-program concentration thresholds.
    whyItMatters: >-
      The public file proves some real customers, but without account counts and concentration math it cannot
      distinguish a diversified platform from a portfolio dominated by a few large programs.
    diligencePath: >-
      Request a current customer register, top-10 revenue and backlog table, and segment mix by commercial, government,
      sovereign, and virtual-mission accounts.
    relatedQuestionRefs:
