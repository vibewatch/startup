tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Turnkey physical missions
    - Payload integration, test, launch procurement, mission operations, and flight-ready infrastructure on proven buses
    - Launch vehicle economics and bespoke bus engineering done outside the Loft stack
    - Space operators, civil agencies, Earth-observation firms, sovereign programs
    - Core current market
  - - Hosted payloads on shared or proven buses
    - Payload hosting, interface abstraction, mission ops, and supporting ground connectivity
    - Fully customer-owned dedicated spacecraft programs
    - Payload owners that want orbit access without owning the platform
    - Core current market
  - - Virtual missions / software on orbit
    - Access to sensing, compute, connectivity, and app deployment on Loft-owned infrastructure
    - Terrestrial-only AI software and data-center compute spend
    - Software-first teams, AI developers, existing operators
    - High-priority adjacency with new-buyer expansion
  - - Sovereign and defense mission infrastructure
    - Mission infrastructure for national-security, sovereignty, and government programs
    - Pure weapons-system budgets or classified industrial work outside commercial space infrastructure
    - Defense ministries, agencies, sovereign primes, security-focused partners
    - Important growth segment
  - - Adjacent or excluded pools
    - Launch-adjacent deployment, data subscriptions, connectivity subscriptions, and ground services only when bundled into mission delivery
    - Standalone launch revenue, downstream analytics subscriptions, broadband service revenue, and pure custom manufacturing
    - Buyers vary by layer
    - Important for avoiding overstated TAM
  notes: 'This market boundary is intentionally narrower than the full satellite economy: it includes infrastructure layers Loft explicitly sells and excludes adjacent pools that would double count launch, custom manufacturing, or downstream data subscriptions.'
