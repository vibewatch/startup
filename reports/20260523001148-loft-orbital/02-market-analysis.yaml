- id: buyers-and-budgets
  title: Buyer, user, and payer segments
  body: |-
    Loft's buyer map is broader than a traditional satellite manufacturer's, but it is also more complex. Earth observation companies can buy a full mission while keeping data products, analytics, and end-user relationships in-house. Civil agencies and defense programs can buy infrastructure for a specific mission outcome without wanting to own the entire industrial stack. Existing satellite operators can buy hosted or shared infrastructure when they care more about time-to-orbit than about absolute control over every subsystem. And virtual missions bring in a newer buyer class: software-first teams and AI developers that want access to sensing, compute, and connectivity already in orbit without going through a hardware program.

    That diversity means buyer, user, and payer often split apart. The technical user may be a mission operator or algorithm developer, while the payer sits inside an R&D, sovereign, Earth-observation product, or defense budget. Adoption usually starts when a team has a payload or application that matters now but lacks the appetite to manage spacecraft development, integration, launch procurement, and long-tail operations. In that sense, Loft is selling reduced organizational burden as much as it is selling hardware access.
  claimRefs:
