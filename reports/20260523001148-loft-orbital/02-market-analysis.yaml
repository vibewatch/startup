company:
  name: Loft Orbital
chapter:
  number: 2
  title: Market Analysis
  summary: 'Loft Orbital serves a narrower market than top-down space-economy headlines imply: mission infrastructure spanning hosted payloads, turnkey physical missions, and software-defined virtual missions. Public evidence supports strong demand drivers in schedule compression, AI and edge use cases, and sovereign-space spending, but accessible sources still support only constrained TAM/SAM/SOM lenses rather than a clean public dollar market size.'
sections:
- id: market-boundary
  title: 'Market boundary: mission infrastructure, not the whole satellite economy'
  body: |-
    Loft Orbital fits best inside a narrow but economically meaningful layer of the space economy: mission infrastructure sold as a service. The company is not primarily selling launch vehicles, a pure satellite bus, or finished downstream geospatial products. Its official pages repeatedly define the job as integrating, testing, launching, and operating missions on a standardized platform so the customer can stay focused on the payload, the application, or the end-user outcome. That definition pulls hosted payloads, turnkey physical missions, and software-first virtual missions into scope because Loft is offering the abstraction layer that sits between the payload or application and the underlying spacecraft stack.

    The same logic requires discipline on excluded spend. Launch-provider revenue, bespoke spacecraft engineering, broadband subscriptions, and downstream analytics products are all adjacent but not identical to Loft's core market. EarthDaily is the clearest example: Loft runs buses, integration, launch, operations, and cloud-connected infrastructure, while EarthDaily keeps the analytics and end-customer layer. That is why this chapter sizes Loft against mission infrastructure, hosted payload, and virtual-mission budgets rather than against every dollar spent anywhere in satellites, connectivity, or Earth observation.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM006
  - CM008
  - CM010
  - CM018
  tableRefs:
  - TM001
- id: sizing-lenses
  title: TAM, SAM, and SOM need constrained lenses and explicit caveats
  body: |-
    The best public sizing evidence for Loft starts with outer bounds, not with a clean revenue TAM. BryceTech shows that nearly 2,800 smallsats launched in 2024 and that average mass reached 223 kilograms, while Novaspace scopes the smallsat market up to 500 kilograms and segments demand across commercial, civil, and defense buyers. Those data points matter because they confirm there is ample physical mission activity in the smallsat form factor where standardization should matter. But they do not prove that all of that activity is serviceable by Loft. BryceTech also says communications satellites are the majority of launches, which means a large share of the volume sits in vertically integrated constellations or business models where Loft is not the natural provider.

    The cleaner near-term lens is served volume. EarthDaily alone is a ten-bus program, Loft is scaling to more than twenty satellites over eighteen months, and management says it is moving from a handful of launches per year to 10-plus. Those are concrete signs of current demand, but they still do not convert into a public SAM or SOM in dollars. SIA, Novaspace, and FAA materials help define the surrounding market architecture, yet none of the accessible extracts isolate a hosted-payload or virtual-mission revenue pool. The practical diligence conclusion is that Loft's market is real and expanding, but public sources still support only a constrained, program-scale sizing framework rather than a precise bankable TAM slide.
  claimRefs:
  - CM014
  - CM015
  - CM016
  - CM017
  - CM018
