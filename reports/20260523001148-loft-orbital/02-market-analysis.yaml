- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Schedule compression vs bespoke satellites
    - Positive
    - Current
    - Supports outsourced mission infrastructure when customers cannot tolerate multi-year custom programs
    - Measure average contract win reason and integration-cycle reduction
  - - Standardization and reusable interfaces
    - Positive
    - Current
    - Improves repeatability and lowers NRE burden across missions
    - Request evidence of reuse rates, flight heritage, and payload success by interface generation
  - - AI and edge processing use cases
    - Positive
    - Current
    - Expands the buyer pool from payload owners to software and analytics teams
    - Test whether virtual-mission customers convert into recurring revenue rather than one-off demos
  - - Government sovereignty and security demand
    - Positive
    - Current
    - Raises willingness to pay for trusted infrastructure and sovereign-capability programs
    - Quantify government share of pipeline, security requirements, and domestic-content obligations
  - - Remote sensing and spectrum licensing
    - Negative
    - Current
    - Can delay mission start even when launch access exists
    - Map average NOAA/FCC review times and conditions by mission type
  - - Export controls and cross-border launch rules
    - Negative
    - Current
    - Constrain partner choice, manufacturing flows, and certain launch paths
    - Review ITAR/EAR exposure, payload nationality mix, and any blocked launch options
  - - Security and data-governance requirements
    - Negative
    - Current
    - Push customers toward providers with stronger encryption and sovereign-control options
    - Benchmark Loft against GovCloud, encryption, and classified-mission readiness alternatives
  - - Capital intensity and supply-chain load
    - Negative
    - Current
    - Limits how quickly the category can scale even when demand is real
    - Inspect working-capital needs, inventory turns, and supplier concentration by mission class
  notes: 'Positive drivers and negative constraints coexist: Loft''s market grows because standardization and AI make missions more useful, but regulation, security, and capital intensity still slow conversion from interest into revenue.'
