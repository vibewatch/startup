- id: drivers-and-constraints
  title: Adoption drivers and real constraints
  body: |-
    The strongest adoption drivers in this market are operational rather than purely financial. Loft keeps returning to the same pain point: bespoke satellites are slow, supply-chain schedules are unreliable, and many customers care more about predictability than about perfect performance tuning. Standardized interfaces, reusable buses, and HubKit-style pre-integration testing directly attack that pain. AI and edge workloads add another demand vector because Loft is not only selling a ride to orbit; it is marketing near-real-time object detection, Earth sensing, and autonomous decision support on orbit. Government sovereignty demand adds a third driver, especially when customers want national capability, defense relevance, or secure access to commercial infrastructure.

    The constraints are equally concrete. Remote-sensing and spectrum approvals can drag timelines even when a satellite is technically ready. Export controls complicate cross-border manufacturing, launch, and payload integration. Security-sensitive buyers can demand encryption, GovCloud-style data handling, or sovereign industrial control. And capital intensity never disappears entirely just because the customer outsources part of the stack. Loft may be more capital efficient than some peers, but the surrounding sectors still include manufacturing, launch, ground infrastructure, and operations that all consume capital and can bottleneck execution.
