company:
  name: "Tenex"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "TENEX.AI addresses an AI-assisted managed detection and response opportunity inside the broader security-operations market, with its clearest near-term fit among enterprises already using Google SecOps or Microsoft Sentinel. Published market estimates establish a large category context but do not isolate Tenex's serviceable or obtainable market, while platform dependence, trust, migration effort, and unproven service economics constrain adoption."
sections:
  - id: "market-boundary"
    title: "Market Boundary and Substitutes"
    body: >-
      The investable market is narrower than total cybersecurity spending. TENEX.AI sells an
      AI-native, human-led managed detection and response service that overlays Google SecOps
      or Microsoft Sentinel, combining automated investigation with named-analyst judgment
      [CM001, CM003]. Included spend is therefore managed security operations, MDR, and the
      implementation or operation work required to make supported SIEM environments useful.
      Traditional MDR providers, an internally staffed SOC, and platform-native managed
      offerings are status-quo substitutes; standalone endpoint, identity, firewall, and broad
      cybersecurity software spend should not be counted merely because it shares a security
      budget [CM001, CM013]. Generic enterprise AI consulting is also outside this boundary:
      the unrelated Tenex.co markets AI transformation services rather than MDR [CM015].
      This definition avoids treating every security or AI dollar as addressable revenue.
    claimRefs:
      - "CM001"
      - "CM003"
      - "CM013"
      - "CM015"
    tableRefs:
      - "TM001"
  - id: "sizing-lenses"
    title: "Evidence-Constrained Sizing"
    body: >-
      The assigned evidence supports multiple context lenses, not a defensible Tenex TAM,
      SAM, or SOM. Tech Insider relays a Mordor Intelligence estimate of $14.77 billion for
      global SOC-as-a-service in 2026, rising to $26.93 billion in 2031 at a 12.77% CAGR, and
      separately reports that MDR represented 41.52% of 2025 SOC-as-a-service spend
      [CM006, CM009]. It also relays a broader SOC estimate of $46.07 billion in 2025 with
      8.1% annual growth through 2035 [CM007]. Two much broader 2026 cybersecurity figures,
      more than $520 billion of spending and a $248.28 billion market estimate, use different
      denominators and cannot be reconciled or substituted for Tenex's addressable market
      [CM008]. Geography, supported-platform penetration, pricing, customer mix, win rates,
      and renewal behavior remain unavailable, so a precise SAM or SOM would be invented
      rather than measured [CM010].
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM008"
      - "CM009"
      - "CM010"
    tableRefs:
      - "TM002"
    figureRefs:
      - "FM001"
  - id: "buyers-and-adoption"
    title: "Buyer, User, Payer, and Adoption Path"
    body: >-
      The economic buyer is likely the CISO or security-operations leader, while SOC analysts,
      detection engineers, incident responders, and IT teams are the daily users [CM002].
      SiliconANGLE describes three service editions: an entry package centered on customized
      Google SecOps deployment and training, a managed detection tier, and a round-the-clock
      monitoring and remediation tier [CM002]. This packaging implies a staged adoption path
      from platform implementation to operational outsourcing rather than a single uniform
      purchase. Existing Google SecOps or Microsoft Sentinel customers face the shortest path:
      Tenex says deployments can go live in as few as seven days when those environments and
      onboarding prerequisites already exist, while new SIEM implementations and migrations
      take longer [CM004, CM013]. Reported contracted revenue above $25 million is an early
      demand signal, but it is neither ARR nor evidence of retention, market share, or customer
      concentration [CM005].
    claimRefs:
      - "CM002"
      - "CM004"
      - "CM005"
      - "CM013"
    tableRefs:
      - "TM003"
  - id: "drivers-and-constraints"
    title: "Growth Drivers, Constraints, and Valuation Relevance"
    body: >-
      The core adoption thesis is that automation can investigate more alerts without scaling
      Tier-1 analyst labor linearly. Tenex claims every in-scope alert is investigated, cases
      can be disposition-ready in under one minute, and consequential decisions remain with
      named analysts [CM003]. The company identifies regulatory pressure, expanding attack
      surfaces, security-talent scarcity, EMEA expansion, and deeper partner integrations as
      demand drivers, but these remain issuer claims rather than independently measured market
      adoption [CM014]. Constraints are equally material. Buyers must trust automated evidence
      assembly and human escalation, satisfy audit and data-control requirements, integrate
      with supported platforms, and prove that migration or onboarding produces better outcomes
      than incumbent contracts [CM012, CM013]. Independent profiles also flag the need to prove
      service reliability and unit economics as customer volume grows [CM012]. The $250 million
      Series B is evidence of investor conviction and capacity to expand, not proof of TAM or
      customer-budget conversion [CM016].
    claimRefs:
      - "CM003"
      - "CM012"
      - "CM013"
      - "CM014"
      - "CM016"
