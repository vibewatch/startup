    title: "Dual Platform Concentration and Hyperscaler Channel Squeeze"
    body: "Tenex’s rapid go-to-market execution relies almost exclusively on Google SecOps and Microsoft Sentinel environments CR013, CR014. If Google or Microsoft bundle native agentic automation into baseline enterprise licenses, Tenex faces severe margin compression and disintermediation risk CR010, CR014."
