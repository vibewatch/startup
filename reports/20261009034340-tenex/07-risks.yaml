  - calloutType: "insight"
    title: "The Human Scaling Dilemma in AI-Native Services"
    body: "While marketing emphasizes AI speed and 10x analyst leverage, Tenex is committing $250M largely to hire 250+ human defenders CR007, CR008. If enterprise sales cycles lengthen or churn escalates, fixed professional services payroll will severely pressure cash runway and operating margins CR009, CR016."
