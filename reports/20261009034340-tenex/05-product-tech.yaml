callouts:
  - calloutType: "insight"
    title: "In-Tenant Telemetry vs Data Lake Centralization"
    body: "Tenex differentiates its technical architecture by operating directly on top of customer-owned Google SecOps and Microsoft Sentinel environments. By keeping logs within the client cloud perimeter, Tenex avoids the immense compute, storage, and regulatory egress costs that challenge traditional MDR vendors."
    claimRefs:
      - "CE001"
      - "CE004"
  - calloutType: "risk"
    title: "Hyperscaler Platform Concentration"
    body: "While Tenex lists compatibility with Microsoft Sentinel and AWS, its engineering lineage and marketing proof points are overwhelmingly anchored in Google SecOps and Chronicle. Changes to Google partner terms or native feature parity could materially impact Tenex's competitive moat."
    claimRefs:
      - "CE008"
      - "CE010"
      - "CE013"
