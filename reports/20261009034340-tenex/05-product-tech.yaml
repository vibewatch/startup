chapter:
  number: 5
  title: "Product & Technology"
  summary: "Tenex delivers an AI-native managed detection and response (MDR) platform built around an agentic security operations center (AI SOC) that layers directly over Google SecOps and Microsoft Sentinel. The system investigates telemetry within enterprise SIEM environments and routes consequential decisions to human analysts, though multi-cloud coverage and software-versus-services automation boundaries require ongoing diligence."
sections:
  - id: "architecture-and-operating-model"
    title: "Operating Architecture and Agentic SOC Engine"
    body: "Tenex positions its core offering as an AI-native, human-led security operations center designed to address alert fatigue and analyst capacity limits in enterprise defense. Rather than layering an external data silo or retrofitting heuristic machine learning onto legacy infrastructure, Tenex deploys directly over enterprise telemetry environments, predominantly Google Cloud SecOps and Microsoft Sentinel. In customer environments, specialized artificial intelligence agents execute parallel alert triage, historical contextualization, entity correlation, and threat hunting in under one minute. Crucially, enterprise telemetry remains within the customer's cloud boundary and retention policy, mitigating the compliance friction typical of third-party security data replication. Tenex enforces a human-in-the-loop architectural model where machine agents triage alert volumes while named security analysts retain responsibility for final escalations and containment actions."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "service-packaging-and-deployment"
    title: "Service Delivery Packaging and Cloud Deployment"
    body: "The commercial delivery model spans three distinct service tiers structured around organizational maturity and staffing needs. The foundational tier provides customized implementation of Google SecOps, wherein Tenex detection engineers build automated enrichment playbooks and train client operations personnel. The intermediate tier augments existing internal operations teams with specialized threat intelligence and escalation guidance. The comprehensive tier delivers continuous twenty-four-hour monitoring, autonomous triage, and analyst-led breach remediation. Tenex advertises onboarding timelines as rapid as seven days for customers possessing an operational Google SecOps or Microsoft Sentinel instance, supported by forward-deployed engineers. However, enterprises requiring greenfield SIEM implementations or legacy migration face longer deployment cycles, and multi-cloud architectural parity outside the core Google ecosystem remains subject to diligence."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE002"
  - id: "engineering-methodology-and-risks"
    title: "Engineering Automation, Technical Lineage, and Operational Risk"
    body: "Tenex emphasizes high technical differentiation through its founding engineering pedigree and disciplined software development practices. The company's engineering leadership incorporates alumni from the founding Google Chronicle engineering group, informing its deep coupling to hyper-scalable log architectures. Internally, Tenex governs its software lifecycle through an opinionated agentic engineering harness known as MetaHarness, applying context-as-code principles, machine-checked acceptance criteria, and strict specification boundaries across development workflows. Despite these engineering controls and investor assertions of software-like margin scalability, Tenex faces non-trivial operational dependencies. The platform relies heavily on underlying hyperscaler telemetry platforms and foundation model APIs, and customer diligence must verify true autonomous containment rates versus manual triage bottlenecks in complex enterprise environments."
    claimRefs:
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE003"
