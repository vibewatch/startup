callouts:
  - calloutType: "insight"
    title: "Architectural Divergence: In-Tenant AI vs Centralized Log Lakes"
    body: "The core technical battleground between Tenex and traditional MDR providers lies in data gravity. Legacy MDR vendors mandate forwarding high-volume telemetry to their proprietary cloud repositories, incurring high bandwidth and egress bills. Tenex's in-tenant agentic inspection leverages existing customer investments in Google SecOps or Microsoft Sentinel, transforming the competitive sales dynamic into an overlay rather than a full infrastructure rip-and-replace."
    claimRefs:
      - "CP002"
      - "CP004"
      - "CP009"
  - calloutType: "risk"
    title: "The Hyperscaler Bundling Threat and Competitive Displacement"
    body: "Because Tenex deploys directly over Google SecOps and Microsoft Sentinel, its long-term moat is intrinsically vulnerable to hyperscaler feature evolution. If Google Cloud or Microsoft embed native, fully autonomous alert triage agents directly into enterprise licenses at no additional cost, Tenex's pure-play MDR value proposition will be forced upmarket into complex custom forensics and managed remediation services."
    claimRefs:
      - "CP005"
      - "CP012"
      - "CP013"
