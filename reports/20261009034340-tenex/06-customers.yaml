chapter:
  number: 6
  title: "Customers"
  summary: "TENEX.AI discloses named enterprise references and more than $25 million of contracted revenue, but those signals are mostly company-issued and do not establish customer count, retention, concentration, or production status. The public evidence supports early commercial traction while leaving durability and deployment depth as material diligence gaps."
sections:
  - id: "customer-segments-and-buyers"
    title: "Customer segments and buying paths"
    body: >-
      TENEX.AI targets enterprise security teams that already operate Google SecOps or
      Microsoft Sentinel, positioning its service as an overlay rather than a replacement
      for the customer's SIEM. The practical buyers are therefore organizations able to
      fund security operations, while the day-to-day users are internal SOC teams and the
      named TENEX analysts who own consequential decisions. Public descriptions show
      several buying paths: a customer can keep its SOC and add the agentic layer, share
      operations with TENEX, or extend its operations team. Independent reporting also
      describes an implementation-led entry package and higher tiers that transfer more
      monitoring and remediation work to TENEX. Neither source set discloses the mix of
      customers, pricing, account count, or average contract value by path.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU001"
  - id: "adoption-and-economic-proof"
    title: "Adoption and economic proof"
    body: >-
      The strongest disclosed adoption signal is economic rather than logo count:
      TENEX.AI said it had generated more than $25 million in contracted revenue by March
      2026, and SiliconANGLE explained that metric as the combined value of customer
      contracts. Contracted revenue is not ARR, recognized revenue, collections, or cash,
      so the period, delivery obligations, and recurring share remain unknown. Momentum
      Cyber's transaction deck separately reports $10 million of revenue in less than six
      months and $25 million of total contract value. Those labels should remain separate
      because the source does not reconcile them. A conditional seven-day go-live and
      full in-scope alert processing describe onboarding and usage intensity, but public
      evidence does not show the share of deployments achieving either result.
    claimRefs:
      - "CU003"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-customer-proof"
    title: "Named customer proof"
    body: >-
      TENEX.AI's homepage names Grainger, Payabli, and the Kansas City Chiefs. Grainger is
      presented through a CISO reference concerning faster response and alert scale with
      TENEX Agentic MDR, Google SecOps, and Mandiant. Payabli is associated with rapid
      deployment and scalable detection on Google SecOps, while the Chiefs are described
      as an official cybersecurity partnership covering team-supporting systems. These
      are useful signs of enterprise relevance, but the fetched material is company-issued
      and does not label any entry as a production deployment or pilot. It also omits
      contract value, start date, renewal history, measured baselines, and customer-authored
      methodology. The examples should therefore be treated as named references rather
      than proof of a durable, broadly deployed customer base.
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU013"
    tableRefs:
      - "TU003"
  - id: "durability-and-evidence-quality"
    title: "Durability, concentration, and evidence quality"
    body: >-
      Public evidence does not resolve NRR, GRR, logo churn, renewal rates, contract
      duration, cohort expansion, customer concentration, or channel dependence. Those
      omissions prevent a defensible conclusion about whether the reported contract value
      compounds after initial deployment. The assigned discovery pool also contained
      name-collision results: tenex.co publishes AI-transformation material, and tenex.io
      describes tenant-communication software rather than TENEX.AI cybersecurity
      deployments. Two other allocated pages yielded only a terms notice or publisher
      boilerplate in their fetched text. These records are retained to document why they
      cannot be counted as customer proof. The adverse search returned no assigned result
      URLs, which is an evidence gap rather than evidence that complaints, failed pilots,
      or churn do not exist.
    claimRefs:
      - "CU014"
      - "CU015"
      - "CU016"
