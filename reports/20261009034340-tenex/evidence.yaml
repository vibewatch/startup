evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Confirmed post-money valuation, share price, and preferred stock terms for the March 2026 Series B financing
      round.
    whyItMatters: >-
      The latest known valuation is not publicly disclosed, preventing assessment of dilution and the price paid for the
      reported growth.
    diligencePath: >-
      Review confidential private placement memorandum (PPM), Series B stock purchase agreement, and certificate of
      incorporation.
    relatedQuestionRefs:
      - QO003
      - QO004
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements detailing ARR, GAAP revenue, gross margin breakdown, net revenue retention (NRR), and
      cash burn rate.
    whyItMatters: >-
      Reported $25M in contracted revenue does not reveal recognized annual revenue, recurring subscription proportions,
      or cash collection timelines.
    diligencePath: >-
      Examine management financial presentation, quality of earnings audit, and current income statement and cash flow
      statements.
    relatedQuestionRefs:
      - QO004
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: Full board roster including all independent directors, observer seats, and board committee assignments.
    whyItMatters: >-
      While Chairman Lou Manousos and lead partner Greg Clark are identified, full voting control and minority
      protective provisions remain unknown.
    diligencePath: Request corporate voting agreement, board composition schedule, and investor rights agreement.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: capitalization
    missingEvidence: >-
      Complete capitalization table, round-by-round ownership, board rights, liquidation preferences, and any debt or
      secondary transactions.
    whyItMatters: >-
      Public databases disagree on total disclosed funding, and named investors do not establish the full ownership or
      control structure.
    diligencePath: Reconcile the cap table to signed financing documents, bank receipts, and the latest certificate of incorporation.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-check
    missingEvidence: Authoritative litigation, regulator, outage, and security-incident checks for Tenex and its operating entity.
    whyItMatters: >-
      The assigned search returned no adverse-result URLs, but absence of a result does not prove the absence of an
      incident or proceeding.
    diligencePath: >-
      Run entity-verified court, regulator, breach-notification, and status-page searches, then obtain management
      representations.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: minor
    topic: source-access
    missingEvidence: >-
      The assigned The AI World URL fetched only publisher boilerplate and did not preserve the referenced Tenex article
      body.
    whyItMatters: The source cannot support funding or valuation claims despite a successful HTTP retrieval.
    diligencePath: Replace it in a future research allocation with a usable independent article or archived publisher copy.
  - type: private-evidence-only
    severity: material
    topic: sam-som-gap
    missingEvidence: >-
      Tenex pricing, supported-platform penetration by geography, eligible account count, customer mix, sales win rates,
      and renewal behavior.
    whyItMatters: >-
      Without these inputs, broad SOC-as-a-service and MDR estimates cannot be converted into a defensible serviceable
      or obtainable market.
    diligencePath: >-
      Request management's bottom-up account universe, pricing and pipeline model, then reconcile it to customer cohorts
      and supported-platform installations.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-evidence-gap
    missingEvidence: >-
      Customer count, concentration, contract duration, renewal rates, average contract value, gross margin, and
      compute-plus-analyst cost per account.
    whyItMatters: >-
      Contracted revenue alone does not establish recurring demand quality, obtainable share, retention, or scalable
      service economics.
    diligencePath: >-
      Review the contract cohort schedule, renewal history, gross-margin bridge, and per-customer service-delivery
      workload with finance and operations.
    relatedQuestionRefs:
      - QM003
  - type: missing-source
    severity: material
    topic: head-to-head-pricing
    missingEvidence: >-
      Exact contractual per-seat, per-gigabyte, or pod-level annual pricing metrics for Tenex compared side-by-side with
      Arctic Wolf and ReliaQuest.
    whyItMatters: >-
      Without published pricing schedules, enterprise TCO comparisons rely on aggregate contracted revenue and
      high-level tier descriptions.
    diligencePath: >-
      Review sanitized enterprise procurement proposals, customer contract disclosures, and RFP scorecards during
      partner interviews.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: independent-accuracy-benchmarks
    missingEvidence: >-
      Independent third-party benchmark evaluations validating Tenex's sub-minute triage velocity and >95% false
      positive reduction against commercial autonomous SOC competitors.
    whyItMatters: >-
      Performance metrics remain vendor-reported without public validation by MITRE ATT&CK managed services evaluations
      or independent comparative labs.
    diligencePath: >-
      Obtain customer red-team pilot logs and independent SOC assessment test results comparing mean time to detect and
      resolve across identical threat vectors.
    relatedQuestionRefs:
      - QP006
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Package-level realized pricing, gross margin, delivery labor and cloud costs, CAC, payback, NRR, churn, and
      sales-cycle data.
    whyItMatters: >-
      Without these inputs, investors cannot test whether automation creates durable service margins or merely supports
      faster headcount growth.
    diligencePath: >-
      Obtain monthly package cohorts, invoices, revenue-recognition policy, fully loaded delivery costs, retention
      schedules, pipeline conversion, commissions, and CAC/payback calculations.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue-comparability
    missingEvidence: >-
      A reconciled bridge among the $18 million historical revenue report, more than $25 million contracted revenue, and
      Multiples.vc's $43 million revenue-or-ARR field.
    whyItMatters: >-
      The figures use different periods and denominators and cannot support a growth rate, ARR estimate, or valuation
      multiple without reconciliation.
    diligencePath: >-
      Request audited monthly recognized revenue, ARR, bookings, backlog, collections, and the exact date and definition
      of every externally reported figure.
    relatedQuestionRefs:
      - QI003
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly burn, working capital, debt or credit terms, hiring phasing, committed expansion
      spend, runway, and next-round trigger.
    whyItMatters: >-
      A large financing round does not establish cash still available or the adequacy of capital against an aggressive
      hiring and international expansion plan.
    diligencePath: >-
      Review bank statements, board-approved operating plan, debt documents, monthly cash forecast, hiring plan,
      downside cases, and financing milestones.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: autonomous-containment-efficacy
    missingEvidence: >-
      Third-party benchmark data verifying Tenex's autonomous triage accuracy and false negative rates compared to
      traditional human-only SOC operations.
    whyItMatters: >-
      Claims of 100% alert coverage and >95% false positive reduction originate from company marketing and have not been
      independently tested by public cyber testing labs.
    diligencePath: >-
      Request customer proof-of-concept benchmark telemetry, third-party SOC 2 Type II audit logs, and red team
      engagement performance metrics.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: minor
    topic: multi-cloud-deployment-depth
    missingEvidence: >-
      Architectural documentation detailing feature parity between Google SecOps deployments and Microsoft Sentinel or
      AWS installations.
    whyItMatters: >-
      Tenex's lineage is rooted in Google Chronicle, and non-Google deployments may offer less mature automation or
      longer deployment cycles.
    diligencePath: >-
      Inspect production reference architectures and API connector documentation for AWS and Microsoft Sentinel customer
      environments.
    relatedQuestionRefs:
      - QE006
      - QE007
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Customer count, NRR, GRR, logo churn, renewal rates, contract duration, cohort expansion, and top-customer revenue
      concentration.
    whyItMatters: >-
      Contracted value and named references cannot establish durable expansion or quantify exposure to the loss of a
      large account.
    diligencePath: >-
      Request anonymized customer cohorts, renewal and churn schedules, contract terms, expansion history, and top-10
      concentration from management under NDA.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: adverse-customer-evidence
    missingEvidence: >-
      Independent records of complaints, failed pilots, blocked deployments, churn, service misses, or customer
      concentration.
    whyItMatters: >-
      The assigned pool contains no genuinely adverse customer source, so downside evidence cannot be balanced against
      company-selected references.
    diligencePath: >-
      Obtain customer reference calls including non-advocates, renewal-loss analyses, service-level reports, and
      procurement records outside the current pool.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete roster of active customers with deployment status, start date, contract value, outcomes, and renewal
      history.
    whyItMatters: Three company-selected names cannot establish the size, representativeness, or durability of the customer base.
    diligencePath: Request an anonymized full customer roster and select both advocate and non-advocate accounts for reference calls.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Fully executed enterprise Master Services Agreement (MSA), Service Level Agreement (SLA) penalty terms, and
      customer Data Processing Agreement (DPA) templates for Tenex.ai Inc.
    whyItMatters: >-
      Without inspectable commercial and compliance contracts, enterprise risk exposure and indemnification boundaries
      cannot be verified.
    diligencePath: >-
      Request standard customer commercial contract templates, SOC 2 Type II attestation reports, and DPA addenda
      directly from Tenex legal counsel.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: audited-arr-and-gross-margins
    missingEvidence: >-
      Audited annual recurring revenue (ARR), recognized revenue breakdown, gross margin including token and hosting
      COGS, and GAAP net income.
    whyItMatters: >-
      Without audited ARR and gross margins, it is impossible to verify whether Tenex achieves software gross margins or
      operates as a labor-intensive services firm.
    diligencePath: >-
      Request audited financial statements, GAAP revenue recognition schedules, and gross margin waterfalls during
      private confirmatory diligence.
    relatedQuestionRefs:
      - QV003
    relatedTableRefs:
      - TV001
      - TV003
  - type: missing-source
    severity: material
    topic: cap-table-liquidation-preferences
    missingEvidence: >-
      Official Certificate of Incorporation, cap sheet detailing Series A and Series B liquidation preferences,
      participating rights, and senior note terms.
    whyItMatters: >-
      A $250M cash injection creates substantial downside protection for Series B investors that can disproportionately
      dilute earlier equity holders in moderate exit scenarios.
    diligencePath: Obtain the definitive capitalization table and amended Certificate of Incorporation from company counsel.
    relatedQuestionRefs:
      - QV004
    relatedTableRefs:
      - TV002
  - type: private-evidence-only
    severity: material
    topic: customer-contract-concentration
    missingEvidence: >-
      Customer account count, average contract value (ACV), top-customer concentration percentages, and annual net
      revenue retention (NRR) rates.
    whyItMatters: >-
      Contracted revenue of $25M could be concentrated in a small handful of Fortune 500 contracts, creating extreme
      renewal and churn vulnerability.
    diligencePath: Review customer cohort retention data, logo counts, and master service agreements during management diligence.
    relatedQuestionRefs:
      - QV005
      - QV008
    relatedTableRefs:
      - TV001
