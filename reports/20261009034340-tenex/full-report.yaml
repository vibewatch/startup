chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Origins, and Core Architecture
        blocks:
          - type: paragraph
            body: >-
              TENEX.AI is a managed detection and response provider founded in 2024 by Chief Executive Officer Eric
              Foster and headquartered in Sarasota, Florida [CO002, CO003]. Its public product surfaces describe an
              overlay for Google SecOps and Microsoft Sentinel rather than a replacement for those customer-owned
              environments: software agents perform triage, investigation, correlation, hunting, and response work,
              while named analysts retain consequential decisions [CO006]. TENEX claims that this model investigates
              100% of in-scope alerts and can produce a disposition-ready case in under one minute, compared with its
              stated industry baseline of roughly 10% of alerts reviewed [CO007]. Those performance figures remain
              company-issued assertions; the assigned independent reporting confirms the service model but does not
              provide a controlled benchmark. The official Series B announcement also lists offices in Overland Park,
              San Jose, and Phoenix, while the retained EMEA announcement describes a planned international headquarters
              without naming its location [CO003, CO004].
