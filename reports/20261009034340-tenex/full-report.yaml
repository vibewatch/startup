              - CR006
              - CR008
              - CR011
              - CR013
      - number: '7.3'
        title: Hyperscaler Platform Concentration and Service Delivery Economics
        blocks:
          - type: paragraph
            body: >-
              Tenex’s core value proposition rests upon deploying as an operational overlay inside customer-owned Google
              SecOps or Microsoft Sentinel environments in as few as seven days CR012, CR013. While this design
              minimizes telemetry egress costs and sensor migration friction, it creates heavy counterparty dependency
              on Google Cloud and Microsoft ecosystem roadmaps, co-sell programs, and API interfaces CR013, CR014.
              Entry-level packages explicitly require Tenex engineers to build custom Google SecOps playbooks and
              deliver SIEM enablement training, reflecting consulting-heavy professional services overhead rather than
              pure recurring software economics CR014. From a business model perspective, Crosspoint Capital and Tenex
              leadership argue that AI automation eliminates traditional linear services headcount traps, delivering
              software-like gross margins CR010, CR015. Nonetheless, generating $25M in contracted revenue while
              embarking on a 250+ personnel expansion across North America and EMEA implies substantial payroll
              commitments and operating expenditure burn ahead of realized cash collections CR008, CR009, CR016.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
