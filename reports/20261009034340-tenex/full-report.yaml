        title: Exhibits
        blocks:
          - type: callout
            title: Contracted revenue is not ARR
            body: >-
              The $25 million disclosure is explicitly contracted revenue. It should not be used as recognized revenue,
              ARR, cash collected, or a recurring-revenue denominator without a company reconciliation.
            calloutType: risk
            claimRefs:
              - CI003
              - CI014
          - type: callout
            title: Gate underwriting on a financial data-room bridge
            body: >-
              Require a monthly bridge from bookings and contracted value to recognized revenue and cash, plus
              package-level gross margin, retention, CAC/payback, burn, debt, and runway before assigning confidence to
              revenue quality or capital efficiency.
            calloutType: recommendation
            claimRefs:
              - CI004
              - CI012
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Operating Architecture and Agentic SOC Engine
        blocks:
          - type: paragraph
            body: >-
              Tenex positions its core offering as an AI-native, human-led security operations center designed to
              address alert fatigue and analyst capacity limits in enterprise defense. Rather than layering an external
              data silo or retrofitting heuristic machine learning onto legacy infrastructure, Tenex deploys directly
              over enterprise telemetry environments, predominantly Google Cloud SecOps and Microsoft Sentinel. In
              customer environments, specialized artificial intelligence agents execute parallel alert triage,
              historical contextualization, entity correlation, and threat hunting in under one minute. Crucially,
              enterprise telemetry remains within the customer's cloud boundary and retention policy, mitigating the
              compliance friction typical of third-party security data replication. Tenex enforces a human-in-the-loop
              architectural model where machine agents triage alert volumes while named security analysts retain
              responsibility for final escalations and containment actions.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
