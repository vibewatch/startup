      - number: '5.2'
        title: Service Delivery Packaging and Cloud Deployment
        blocks:
          - type: paragraph
            body: >-
              The commercial delivery model spans three distinct service tiers structured around organizational maturity
              and staffing needs. The foundational tier provides customized implementation of Google SecOps, wherein
              Tenex detection engineers build automated enrichment playbooks and train client operations personnel. The
              intermediate tier augments existing internal operations teams with specialized threat intelligence and
              escalation guidance. The comprehensive tier delivers continuous twenty-four-hour monitoring, autonomous
              triage, and analyst-led breach remediation. Tenex advertises onboarding timelines as rapid as seven days
              for customers possessing an operational Google SecOps or Microsoft Sentinel instance, supported by
              forward-deployed engineers. However, enterprises requiring greenfield SIEM implementations or legacy
              migration face longer deployment cycles, and multi-cloud architectural parity outside the core Google
              ecosystem remains subject to diligence.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE006
              - CE007
              - CE008
      - number: '5.3'
        title: Engineering Automation, Technical Lineage, and Operational Risk
        blocks:
          - type: paragraph
            body: >-
              Tenex emphasizes high technical differentiation through its founding engineering pedigree and disciplined
              software development practices. The company's engineering leadership incorporates alumni from the founding
              Google Chronicle engineering group, informing its deep coupling to hyper-scalable log architectures.
              Internally, Tenex governs its software lifecycle through an opinionated agentic engineering harness known
              as MetaHarness, applying context-as-code principles, machine-checked acceptance criteria, and strict
              specification boundaries across development workflows. Despite these engineering controls and investor
              assertions of software-like margin scalability, Tenex faces non-trivial operational dependencies. The
              platform relies heavily on underlying hyperscaler telemetry platforms and foundation model APIs, and
              customer diligence must verify true autonomous containment rates versus manual triage bottlenecks in
              complex enterprise environments.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE009
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: In-Tenant Telemetry vs Data Lake Centralization
            body: >-
              Tenex differentiates its technical architecture by operating directly on top of customer-owned Google
              SecOps and Microsoft Sentinel environments. By keeping logs within the client cloud perimeter, Tenex
              avoids the immense compute, storage, and regulatory egress costs that challenge traditional MDR vendors.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
          - type: callout
            title: Hyperscaler Platform Concentration
            body: >-
              While Tenex lists compatibility with Microsoft Sentinel and AWS, its engineering lineage and marketing
              proof points are overwhelmingly anchored in Google SecOps and Chronicle. Changes to Google partner terms
              or native feature parity could materially impact Tenex's competitive moat.
            calloutType: risk
            claimRefs:
              - CE008
              - CE010
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying paths
        blocks:
          - type: paragraph
            body: >-
              TENEX.AI targets enterprise security teams that already operate Google SecOps or Microsoft Sentinel,
              positioning its service as an overlay rather than a replacement for the customer's SIEM. The practical
              buyers are therefore organizations able to fund security operations, while the day-to-day users are
              internal SOC teams and the named TENEX analysts who own consequential decisions. Public descriptions show
              several buying paths: a customer can keep its SOC and add the agentic layer, share operations with TENEX,
              or extend its operations team. Independent reporting also describes an implementation-led entry package
              and higher tiers that transfer more monitoring and remediation work to TENEX. Neither source set discloses
              the mix of customers, pricing, account count, or average contract value by path.
            claimRefs:
              - CU001
