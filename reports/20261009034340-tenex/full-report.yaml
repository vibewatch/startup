      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Tenex raised a $250 million Series B in March 2026 and said the proceeds would support more than 250
              hires, EMEA expansion, deeper partnerships, and continued AI research and product investment. That scale
              of financing lowers near-term funding risk in principle, but it does not reveal cash on hand, burn, debt,
              working-capital needs, or runway as of this report date. The planned expansion also adds execution and
              cost risk because engineers, SOC analysts, sales, and customer-success personnel are central to the
              delivery model. The financial verdict is therefore mixed: early contracted demand and a large capital base
              are positive, while revenue comparability, margin durability, capital efficiency, and the next financing
              trigger remain underwriting blockers requiring company data-room evidence.
            claimRefs:
              - CI003
              - CI009
              - CI012
              - CI013
              - CI014
