      - number: '4.2'
        title: Traction and revenue quality
        blocks:
          - type: paragraph
            body: >-
              The strongest current traction disclosure is Tenex's March 2026 statement that contracted revenue exceeded
              $25 million after roughly one year in market; SiliconANGLE independently reported the same
              company-provided definition as the combined value of customer contracts. Earlier reports said revenue
              surpassed $10 million within six months and $18 million by the third operating quarter. A separate
              market-data page records $43 million as March 2026 revenue, but its own methodology says round-linked
              figures may be revenue or ARR and may represent run-rate or LTM values. These figures therefore cannot be
              combined into a clean growth series, and contracted revenue should not be treated as recognized revenue or
              ARR.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI014
      - number: '4.3'
        title: Delivery economics and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The delivery model combines AI agents, customer-owned Google SecOps or Microsoft Sentinel environments,
              named analysts, and in some cases 24x7 human operations. Tenex claims that its platform processes all
              customer alert telemetry in under one minute, reduces false positives by more than 95%, and produces 6.2x
              analyst efficiency. Those operational claims could support attractive labor leverage, but they do not
              disclose gross margin, analyst utilization, infrastructure cost, support burden, implementation cost, or
              incremental headcount per customer. The company and an investor describe unusually strong gross-margin
              potential, yet no percentage or audited basis is public. Sales-cycle length, CAC, payback, NRR, churn, and
              channel economics also remain absent, preventing a defensible unit-economics model.
            claimRefs:
