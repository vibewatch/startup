        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              Tenex monetizes a blend of subscription-like managed security operations and services rather than a pure
              self-serve software product. Public descriptions identify three service editions: an entry package focused
              on configuring Google SecOps and associated playbooks, a mid-tier managed offering, and a comprehensive
              tier with round-the-clock monitoring and remediation. The newer Google AI Threat Defense delivery offer
