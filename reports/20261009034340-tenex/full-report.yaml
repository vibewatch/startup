            body: >-
              TENEX.AI's homepage names Grainger, Payabli, and the Kansas City Chiefs. Grainger is presented through a
              CISO reference concerning faster response and alert scale with TENEX Agentic MDR, Google SecOps, and
              Mandiant. Payabli is associated with rapid deployment and scalable detection on Google SecOps, while the
              Chiefs are described as an official cybersecurity partnership covering team-supporting systems. These are
