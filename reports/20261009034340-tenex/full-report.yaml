      - number: '6.2'
        title: Adoption and economic proof
        blocks:
          - type: paragraph
            body: >-
              The strongest disclosed adoption signal is economic rather than logo count: TENEX.AI said it had generated
              more than $25 million in contracted revenue by March 2026, and SiliconANGLE explained that metric as the
              combined value of customer contracts. Contracted revenue is not ARR, recognized revenue, collections, or
              cash, so the period, delivery obligations, and recurring share remain unknown. Momentum Cyber's
              transaction deck separately reports $10 million of revenue in less than six months and $25 million of
              total contract value. Those labels should remain separate because the source does not reconcile them. A
              conditional seven-day go-live and full in-scope alert processing describe onboarding and usage intensity,
              but public evidence does not show the share of deployments achieving either result.
