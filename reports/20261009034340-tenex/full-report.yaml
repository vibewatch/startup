      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is likely the CISO or security-operations leader, while SOC analysts, detection
              engineers, incident responders, and IT teams are the daily users [CM002]. SiliconANGLE describes three
              service editions: an entry package centered on customized Google SecOps deployment and training, a managed
              detection tier, and a round-the-clock monitoring and remediation tier [CM002]. This packaging implies a
              staged adoption path from platform implementation to operational outsourcing rather than a single uniform
              purchase. Existing Google SecOps or Microsoft Sentinel customers face the shortest path: Tenex says
              deployments can go live in as few as seven days when those environments and onboarding prerequisites
              already exist, while new SIEM implementations and migrations take longer [CM004, CM013]. Reported
              contracted revenue above $25 million is an early demand signal, but it is neither ARR nor evidence of
              retention, market share, or customer concentration [CM005].
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM012
              - CM013
      - number: '2.4'
        title: Growth Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              The core adoption thesis is that automation can investigate more alerts without scaling Tier-1 analyst
              labor linearly. Tenex claims every in-scope alert is investigated, cases can be disposition-ready in under
              one minute, and consequential decisions remain with named analysts [CM003]. The company identifies
              regulatory pressure, expanding attack surfaces, security-talent scarcity, EMEA expansion, and deeper
              partner integrations as demand drivers, but these remain issuer claims rather than independently measured
              market adoption [CM014]. Constraints are equally material. Buyers must trust automated evidence assembly
              and human escalation, satisfy audit and data-control requirements, integrate with supported platforms, and
              prove that migration or onboarding produces better outcomes than incumbent contracts [CM012, CM013].
              Independent profiles also flag the need to prove service reliability and unit economics as customer volume
              grows [CM012]. The $250 million Series B is evidence of investor conviction and capacity to expand, not
              proof of TAM or customer-budget conversion [CM016].
            claimRefs:
              - CM003
              - CM012
              - CM013
              - CM014
              - CM016
