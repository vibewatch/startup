              - CR010
              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual Platform Concentration and Hyperscaler Channel Squeeze
            body: >-
              Tenex’s rapid go-to-market execution relies almost exclusively on Google SecOps and Microsoft Sentinel
              environments CR013, CR014. If Google or Microsoft bundle native agentic automation into baseline
              enterprise licenses, Tenex faces severe margin compression and disintermediation risk CR010, CR014.
            calloutType: risk
            claimRefs:
              - CR010
              - CR013
              - CR014
          - type: callout
            title: The Human Scaling Dilemma in AI-Native Services
            body: >-
              While marketing emphasizes AI speed and 10x analyst leverage, Tenex is committing $250M largely to hire
              250+ human defenders CR007, CR008. If enterprise sales cycles lengthen or churn escalates, fixed
              professional services payroll will severely pressure cash runway and operating margins CR009, CR016.
            calloutType: insight
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Tenex's core investment thesis rests on solving the fundamental structural constraint of the managed
              detection and response (MDR) services industry: traditional human-delivered SOC operations historically
              scaled linearly with headcount, depressing gross margins and making customer expansion capital-intensive
              [CV001, CV003]. By inserting specialized agentic AI to triage, investigate, and correlate 100% of alert
              telemetry in under a minute while preserving human analyst governance on consequential decisions, Tenex
              claims to eliminate incremental headcount per customer and expand operating margins beyond legacy services
              benchmarks [CV002, CV003, CV004]. Early commercial traction is evident in reported contracted revenue
              reaching $25M within one year of market launch, following $10M in revenue achieved in its first six months
              and $18M across three quarters [CV001, CV005, CV006]. The hire of former Charles Schwab CISO Bashar
              Abouseido as President provides executive validation for enterprise buyers seeking regulatory-grade
              security operations [CV007].


              Conversely, the anti-thesis highlights severe information asymmetries and category headwinds that
              challenge private equity valuations [CV008, CV009]. First, Tenex conflates contracted revenue with
              recurring annual revenue (ARR); contracted revenue represents the total cumulative value of signed
              multi-year customer agreements rather than recognized annual software cash flows [CV005, CV010]. Second,
              despite marketing claims of 'better gross margins than traditional software,' Tenex has not published
              audited financial statements disclosing COGS, third-party model inference token costs, or analyst staffing
              ratios [CV003, CV010]. Third, the company remains structurally dependent on underlying SIEM and cloud
              hyperscaler infrastructure—chiefly Google SecOps and Microsoft Sentinel—leaving it exposed to native AI
              automation features released by Google and Microsoft that could disintermediate third-party MDR layers
              [CV002, CV011]. Unverified reports attributing a $1B valuation to the $250M round imply an extreme
              multiple on true recognized ARR, leaving entry investors exposed to substantial down-round and dilution
              risks [CV008, CV012].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV010
              - CV011
      - number: '8.2'
        title: Financing History and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Tenex's financing history exhibits remarkable capital velocity across its first two operational years
              [CV001, CV009]. After coming out of stealth in early 2025, the company announced a $27M Series A round in
              September 2025 led by Crosspoint Capital Partners with participation from Andreessen Horowitz (a16z) and
              Shield Capital, followed by strategic expansion closes involving DeepWork Capital, the Florida Opportunity
              Fund, and DTCP to support EMEA expansion [CV006, CV009, CV013]. In March 2026, Tenex completed an outsized
              $250M Series B funding round again led by Crosspoint Capital Partners, with continued participation from
              a16z and Shield Capital, bringing total disclosed equity funding to $277M [CV001, CV009].


              External news commentary and funding trackers report that the $250M Series B reportedly valued Tenex at
              $1B, although the company's official corporate releases have avoided confirming any post-money valuation
              mark [CV008, CV009, CV012]. At a $1B valuation on $250M of newly raised cash, the post-money ownership
              dilution represents approximately 25%, indicating substantial preference overhang and liquidation priority
              ahead of common shareholders [CV001, CV008]. Evaluating public evidence reveals that while Tenex raised
              $250M in new capital, cash on hand does not equal sustainable enterprise value without verified gross
              margins and positive unit economics [CV003, CV010]. Furthermore, public disclosures omit liquidation
              preference seniority, governance participation rights, and secondary transaction pricing, creating a high
              barrier to independent valuation underwriting [CV009, CV010].
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV009
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
      - number: '8.3'
        title: Scenario Modeling, Comparables, and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              Evaluating Tenex across comparable public and private cybersecurity peers underscores valuation dispersion
              between pure-play SaaS platforms and hybrid managed service providers [CV003, CV009]. Incumbent
              vendor-native platforms like CrowdStrike (Falcon Complete) command high software multiples due to 75%+
              software gross margins, whereas scaled managed detection peers like Arctic Wolf have historically
              navigated services-heavy margin profiles requiring analyst headcount scaling [CV003, CV009]. Tenex's
              positioning as an AI-native MDR provider attempts to capture SaaS multiples on managed services revenue,
              claiming software-like scalability through agentic triage [CV001, CV003].


              Under a bull case scenario, Tenex successfully operationalizes its 250+ technical and sales hires, scales
              its EMEA expansion via DTCP, converts contracted customer commitments into recognized ARR exceeding $60M
              by 2027, and proves that LLM inference costs remain lower than displaced SOC wages, validating a
              $1.2B–$1.8B valuation at a 20x–25x software multiple [CV001, CV006, CV010]. In the base case, Tenex
              achieves steady enterprise adoption with Fortune 500 accounts on Google SecOps and Microsoft Sentinel, but
              blended gross margins stabilize in the 50%–60% range due to complex multi-cloud edge cases, supporting a
              fair value mark of $500M–$750M (10x–12x multiple on recognized revenue), indicating that current entry
              prices are stretched [CV002, CV008, CV011]. In a bear case, hyperscaler native SOC automation erodes
              third-party MDR demand, customer concentration creates revenue volatility, and heavy Series B liquidation
              preferences trigger a down-round or recapitalization below $300M [CV008, CV009, CV010]. Institutional
              investors should maintain a research-more stance and condition capital deployment on audited ARR, cohort
              retention, and verified gross margin waterfalls [CV008, CV010].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Diligence Call: Research-More on Stretched Unverified Valuation'
            body: >-
              While Tenex demonstrates exceptional capital velocity and contracted commercial traction, underwriting an
              equity investment at or near the reported $1B valuation requires auditing recognized ARR, gross margin
              after inference and analyst labor, and liquidation preferences. Investors should withhold buy conviction
              until unit economics are independently corroborated.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV008
              - CV009
              - CV010
