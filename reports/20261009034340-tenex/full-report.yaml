  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Architecture and Regulatory Governance
        blocks:
          - type: paragraph
            body: >-
              Evaluating Tenex requires examining the structural divergence between software-centric investor narratives
              and services-bound operational delivery. The enterprise operates in mission-critical environments spanning
              financial services, healthcare, energy, and critical infrastructure CR001. Operating across these
              regulated sectors exposes Tenex to stringent incident disclosure regimes, data localization obligations,
              and vendor third-party assurance audits CR002. Public documentation for the corporate operating entity
              (Tenex.ai Inc., based in Sarasota, Florida) omits standard customer Data Processing Agreements (DPAs) or
              regulatory compliance certifications such as SOC 2 Type II or ISO 27001 in open web repositories CR003.
              Furthermore, public terms retrieved under the tenex.io domain point to Tenex Middle East FZ LLC, an
              unrelated neighborhood classifieds entity governed by United Arab Emirates law, highlighting the complete
              absence of publicly inspectable enterprise terms of service or master services agreements for Tenex.ai
              Inc. CR004. Consequently, enterprise procurement diligence must verify whether customer telemetry and case
              reasoning comply with sector-specific privacy mandates and whether strict audit trails satisfy
              institutional compliance officers CR002, CR003.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational Failure Modes, Alert Fidelity, and Human Capital Scaling
        blocks:
          - type: paragraph
            body: >-
              Tenex markets a high-efficiency operational posture centered on investigating 100% of ingested telemetry
              in under one minute with an advertised 95%+ false-positive reduction CR005, CR006. The platform pairs
              specialized AI triage agents with named human analysts who retain sole decision authority and
              accountability for escalations CR006, CR007. However, the company is concurrently scaling its workforce by
              adding more than 250 employees across engineering, SOC operations, sales, and customer success CR008,
              following historical headcount growth of 318% year-over-year CR009. This creates an acute organizational
              scaling bottleneck: onboarding hundreds of Tier 2/3 defenders without diluting quality or increasing
              analyst burnout represents a major execution risk CR008, CR010. Moreover, Tenex's roadmap includes
              investing in direct automated actions—such as isolating endpoint threats and purging malicious content
              directly in client environments CR011. In autonomous operational environments, erroneous containment or
              false-positive remediation triggers catastrophic service disruption for enterprise workloads, amplifying
              residual operational liability CR006, CR011.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
