  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than total cybersecurity spending. TENEX.AI sells an AI-native,
              human-led managed detection and response service that overlays Google SecOps or Microsoft Sentinel,
              combining automated investigation with named-analyst judgment [CM001, CM003]. Included spend is therefore
              managed security operations, MDR, and the implementation or operation work required to make supported SIEM
              environments useful. Traditional MDR providers, an internally staffed SOC, and platform-native managed
              offerings are status-quo substitutes; standalone endpoint, identity, firewall, and broad cybersecurity
              software spend should not be counted merely because it shares a security budget [CM001, CM013]. Generic
              enterprise AI consulting is also outside this boundary: the unrelated Tenex.co markets AI transformation
              services rather than MDR [CM015]. This definition avoids treating every security or AI dollar as
              addressable revenue.
            claimRefs:
              - CM001
              - CM003
              - CM013
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM013
              - CM015
      - number: '2.2'
        title: Evidence-Constrained Sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports multiple context lenses, not a defensible Tenex TAM, SAM, or SOM. Tech
              Insider relays a Mordor Intelligence estimate of $14.77 billion for global SOC-as-a-service in 2026,
              rising to $26.93 billion in 2031 at a 12.77% CAGR, and separately reports that MDR represented 41.52% of
              2025 SOC-as-a-service spend [CM006, CM009]. It also relays a broader SOC estimate of $46.07 billion in
              2025 with 8.1% annual growth through 2035 [CM007]. Two much broader 2026 cybersecurity figures, more than
              $520 billion of spending and a $248.28 billion market estimate, use different denominators and cannot be
              reconciled or substituted for Tenex's addressable market [CM008]. Geography, supported-platform
              penetration, pricing, customer mix, win rates, and renewal behavior remain unavailable, so a precise SAM
              or SOM would be invented rather than measured [CM010].
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
