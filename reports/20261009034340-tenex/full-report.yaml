            body: >-
              Public evidence does not resolve NRR, GRR, logo churn, renewal rates, contract duration, cohort expansion,
              customer concentration, or channel dependence. Those omissions prevent a defensible conclusion about
              whether the reported contract value compounds after initial deployment. The assigned discovery pool also
              contained name-collision results: tenex.co publishes AI-transformation material, and tenex.io describes
              tenant-communication software rather than TENEX.AI cybersecurity deployments. Two other allocated pages
              yielded only a terms notice or publisher boilerplate in their fetched text. These records are retained to
