    approximationNotes: 这是定性机制图，不是预测；不推断转化率、时间安排或毛利率数值。
    claimRefs:
      - CI001
      - CI007
      - CI008
      - CI011
      - CI013
  - id: FE001
    title: Tenex 自主遥测处理栈
    type: stack
    summary: 从原始 SIEM 遥测到智能体分诊、丰富、关联、搜寻和人工分析师签字确认的六层处理栈。
    data:
      items:
        - label: 第 6 层：人工事件处置
          detail: 指定 SOC 分析师批准遏制剧本，并对重大升级事件承担法律责任。
        - label: 第 5 层：持续威胁搜寻
          detail: 主动的假设驱动型搜寻智能体查询历史环境遥测，寻找未检测到的异常。
        - label: 第 4 层：案件关联与去重
          detail: 多告警关联引擎将相关 SIEM 告警归并为一份完整的事件记录。
        - label: 第 3 层：自主实体丰富
          detail: 专用上下文构建智能体汇总用户身份、设备状态和同类基线数据。
        - label: 第 2 层：并行告警分诊
          detail: 智能体 AI 流水线在 60 秒内评估 100% 的遥测，并将误报减少 >95%。
        - label: 第 1 层：原地 SIEM 遥测层
          detail: 客户自有的 Google SecOps 或 Microsoft Sentinel 环境，将全部遥测保留在租户边界内。
    approximationNotes: 概念性功能层映射自 Tenex 官方产品规格。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE005
      - CE009
  - id: FU001
    title: 企业客户旅程与扩张面
    type: journey-map
    summary: 公开呈现的旅程从现有 SIEM 延伸至实施和托管运营，但结果与留存证据仍未披露。
    data:
      nodes:
        - label: 现有安全环境
          touchpoints:
            - Active Google SecOps or Microsoft Sentinel deployment
            - Customer-controlled schema and retention
        - label: 运营模式选择
          touchpoints:
            - Keep the SOC
            - Share operations
            - Extend the operations team
        - label: 实施
          touchpoints:
            - Customized deployment
            - Automation playbooks
            - Employee training
        - label: 有条件的入驻
          touchpoints:
            - As-fast-as-seven-day go-live
            - Timely completion of onboarding requirements
        - label: 持续告警运营
          touchpoints:
            - All in-scope alerts investigated
            - Named analyst owns consequential decisions
        - label: 服务扩张
          touchpoints:
            - Advice on emerging threats
            - Round-the-clock monitoring
            - Breach remediation
    approximationNotes: 概念性顺序综合当前公司和独立描述；不代表已观察到的转化率、客户数量或普遍存在的七天部署。
