      - number: '7.3'
        title: 超大规模云厂商平台集中度与服务交付经济
        blocks:
          - type: paragraph
            body: >-
              Tenex 的核心价值主张是在客户自有的 Google SecOps 或 Microsoft Sentinel 环境内部署运营叠加层，最快七天即可完成 CR012, CR013。
              这种设计降低了遥测出口成本和传感器迁移摩擦，却加重了对 Google Cloud 和 Microsoft 生态路线图、联合销售计划及 API 接口的对手方依赖 CR013, CR014。入门套餐明确要求
              Tenex 工程师构建定制 Google SecOps 剧本并提供 SIEM 启用培训，体现的是咨询密集型专业服务开销， 而非纯经常性软件经济 CR014。从商业模式角度看，Crosspoint Capital
              和 Tenex 管理层认为 AI 自动化能消除传统服务业线性人力陷阱， 带来软件式毛利率 CR010, CR015。但在开始扩充北美和 EMEA 的 250+ 人团队时创造 $25M
              合同收入，意味着在真正回款前需要承担大量薪资承诺和 运营烧钱 CR008, CR009, CR016。
