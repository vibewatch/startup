      - number: '4.2'
        title: 牵引力与收入质量
        blocks:
          - type: paragraph
            body: >-
              当前最强的牵引力披露是 Tenex 2026 年 3 月的声明：进入市场约一年后，合同收入超过 $25M；SiliconANGLE 独立报道了同一公司口径，
              将其定义为客户合同的合计价值。更早报道称，六个月内收入超过 $10M，第三个运营季度达到 $18M。另一个市场数据页面记录 2026 年 3 月 收入为 $43M，但其方法说明称，与融资轮次相关的数字可能是收入或
              ARR，也可能是运行率或 LTM 数值。因此，这些数字不能拼成干净的增长序列， 合同收入也不应当作已确认收入或 ARR。
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI014
      - number: '4.3'
        title: 交付经济与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              交付模式结合了 AI 智能体、客户自有的 Google SecOps 或 Microsoft Sentinel 环境、指定分析师，以及部分情况下的 24x7 人工运营。 Tenex
              声称，其平台可在不到一分钟内处理客户全部告警遥测，将误报减少超过 95%，并带来 6.2x 的分析师效率。这些运营主张可能支撑
              有吸引力的劳动杠杆，但没有披露毛利率、分析师利用率、基础设施成本、支持负担、实施成本或每位客户新增员工数。公司和一位投资者描述了
              异常强的毛利率潜力，但公开信息没有百分比或审计依据。销售周期、CAC、回本周期、NRR、流失率和渠道经济也都缺失，无法建立可辩护的单位经济模型。
            claimRefs:
