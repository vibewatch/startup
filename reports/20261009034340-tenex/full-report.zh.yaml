  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、起源与核心架构
        blocks:
          - type: paragraph
            body: >-
              TENEX.AI 是一家成立于 2024 年的托管检测与响应服务商，由 CEO Eric Foster 创立，总部位于佛罗里达州萨拉索塔 [CO002, CO003]。其公开产品页面将服务描述为叠加在
              Google SecOps 和 Microsoft Sentinel 之上的一层，而不是替换客户自有环境： 软件智能体负责分诊、调查、关联、威胁搜寻和响应工作，具决定性影响的决策仍由指定分析师保留
              [CO006]。TENEX 声称，该模式会调查 100% 的范围内告警，并能在不到一分钟内生成可直接定性的案件；其所述行业基准约为仅审查 10% 的告警 [CO007]。这些性能数据仍是
              公司自行发布的主张；指定的独立报道确认了服务模式，但没有提供受控基准。官方 Series B 公告还列出 Overland Park、San Jose 和 Phoenix 办事处，而保留的 EMEA
              公告仅称计划设立国际总部，没有说明地点 [CO003, CO004]。
