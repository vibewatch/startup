  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场小于网络安全总支出。TENEX.AI 销售 AI 原生、人工主导的托管检测与响应服务，叠加在 Google SecOps 或 Microsoft Sentinel
              之上，把自动调查与指定分析师判断结合起来 [CM001, CM003]。因此，纳入的支出应是托管安全运营、MDR，以及让受支持 SIEM 环境真正有用所需 的实施或运营工作。传统 MDR 服务商、内部组建的
              SOC 以及平台原生托管服务都是现状替代方案；独立的终端、身份、防火墙和广义网络安全软件 支出不能仅因同属安全预算就计入 [CM001, CM013]。通用企业 AI 咨询也在边界之外：无关的 Tenex.co
              销售的是 AI 转型服务，而非 MDR [CM015]。这样的定义避免把每一笔安全或 AI 支出都视为可服务收入。
            claimRefs:
              - CM001
              - CM003
              - CM013
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM013
              - CM015
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              指定证据支持多个背景口径，但不足以给出可辩护的 Tenex TAM、SAM 或 SOM。Tech Insider 转述 Mordor Intelligence 的估计： 2026 年全球
              SOC-as-a-service 市场为 $14.77B，2031 年增至 $26.93B，CAGR 为 12.77%；另称 MDR 占 2025 年 SOC-as-a-service 支出的 41.52%
              [CM006, CM009]。它还转述更广义的 SOC 估计：2025 年为 $46.07B，至 2035 年年增长 8.1% [CM007]。 两个更宽泛的 2026 年网络安全数字——超过 $520B
              的支出和 $248.28B 的市场估计——使用不同分母，不能与 Tenex 的可服务市场对账或替代 [CM008]。地域、受支持平台渗透率、定价、客户结构、赢单率和续约行为均不可得，因此精确的 SAM 或 SOM
              会是臆测，而非测量结果 [CM010]。
