      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              经济买方可能是 CISO 或安全运营负责人，而 SOC 分析师、检测工程师、事件响应人员和 IT 团队是日常用户 [CM002]。 SiliconANGLE 描述了三种服务版本：以定制 Google SecOps
              部署和培训为核心的入门套餐、托管检测层，以及全天候监控与修复层 [CM002]。 这种包装暗示了从平台实施到运营外包的分阶段采用路径，而不是一次性、统一的购买。已有 Google SecOps 或
              Microsoft Sentinel 的客户路径最短： Tenex 称，在这些环境和上线前条件已经具备时，部署最快七天即可上线；新的 SIEM 实施和迁移则需要更长时间 [CM004, CM013]。 超过
              $25M 的据报道合同收入是早期需求信号，但既不是 ARR，也不能证明留存、市场份额或客户集中度 [CM005]。
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM012
              - CM013
      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              核心采用逻辑是，自动化可以在不按比例增加一级分析师劳动的情况下调查更多告警。Tenex 声称每个范围内告警都会被调查，案件可在不到一分钟内 准备好定性，具决定性影响的决策仍由指定分析师作出
              [CM003]。公司将监管压力、攻击面扩大、安全人才稀缺、EMEA 扩张和更深的合作伙伴集成 列为需求驱动因素，但这些仍是发行方主张，而非独立测量的市场采用数据
              [CM014]。约束同样重要：买方必须信任自动化证据组装和人工升级， 满足审计与数据控制要求，接入受支持平台，并证明迁移或上线后的结果优于现有合同 [CM012, CM013]。独立简介还指出，随着客户量增长，
              服务可靠性和单位经济仍需证明 [CM012]。$250M Series B 说明投资者信心和扩张能力，但不能证明 TAM 或客户预算转化 [CM016]。
            claimRefs:
              - CM003
              - CM012
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把品类估计资本化为 Tenex TAM
            body: 最接近的公开自上而下代理指标是 SOC-as-a-service，但 Tenex 的受支持平台、地域、服务包装、价格、买方资格和可获得份额都未披露。 已筹融资额和合同收入无法填补这些规模缺口。
            calloutType: risk
            claimRefs:
