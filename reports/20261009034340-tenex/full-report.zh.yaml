      - number: '5.2'
        title: 服务交付包装与云部署
        blocks:
          - type: paragraph
            body: >-
              商业交付模式围绕组织成熟度和人员需求，分为三个不同服务层级。基础层提供定制 Google SecOps 实施，Tenex 检测工程师在其中构建自动化
              丰富剧本并培训客户运营人员。中间层以专门的威胁情报和升级指导增强现有内部运营团队。完整层提供全天候持续监控、自主分诊和分析师主导的 入侵修复。Tenex 宣称，对已有可运营 Google SecOps 或
              Microsoft Sentinel 实例的客户，上线最快七天，并由前置部署工程师支持。 但需要从零实施 SIEM 或迁移旧系统的企业会经历更长部署周期，核心 Google 生态之外的多云架构对等性仍需尽调。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
