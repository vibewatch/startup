  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局架构与替代方案分类
        blocks:
          - type: paragraph
            body: >-
              企业威胁检测与事件响应市场分为四种主要运营模式：传统托管检测与响应（MDR）服务商、自主 AI SOC 平台初创公司、超大规模云厂商 原生 SecOps 套件，以及内部 SOC 工程团队。传统 MDR
              厂商历来依赖专门人员配置，客户扩张需要按比例增加分析师人数，导致服务利润率受限并不得不 抽样告警。相比之下，纯软件 SIEM 和 SOAR
              工具提供灵活的规则配置，却把完整运营负担、告警分诊疲劳和维护开销转嫁给内部安全人员。 Tenex 将自己定位在两种模式之间：营销 AI 原生、人工主导的托管服务，在客户现有 Google SecOps 或
              Microsoft Sentinel 租户内执行自动分诊与调查， 同时由人工分析师完成事件最终定性。然而，Tenex 正面临新兴自主 SOC 厂商的激烈反定位，例如将自主 AI SOC 作为托管 SaaS 推出的
              Pondurance，以及 Sycamore Labs 等智能体治理新进入者；既有厂商也在其客户基础上快速部署自研机器学习分诊智能体。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP007
      - number: '3.2'
        title: 竞争者能力、交付模式与产品包装
        blocks:
          - type: paragraph
            body: >-
              评估竞争替代方案，需要考察面向企业安全买方的底层遥测部署架构、劳动扩张模式和定价机制。传统服务商将外部遥测副本导入集中式自有数据湖， 会承担大量数据出口和存储重复费用；Tenex
              则直接运行在客户自有云基础设施之上。产品包装方面，Tenex 将合作分为三个层级： 入门部署套餐帮助组织配置定制 Google SecOps
              环境和自动化剧本；中间层提供威胁情报建议和分析师支持；完整层提供全天候持续监控及由分析师主导的 入侵修复。相反，其他自主 SOC 服务追求纯 SaaS 订阅或软件加服务混合模式，人工监督程度各不相同。买方必须权衡
              Tenex 的运营承诺与其他架构， 后者可能支持更广泛的多 SIEM 生态或专门的本地遥测管线；尤其当企业买方仍深度投入非 Google、非 Microsoft 的日志体系时，这一点更重要。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: 切换成本、分销动态与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              关键尽调问题是，Tenex 的运营性能优势究竟是可守住的长期护城河，还是短暂的架构先发优势。企业安全运营的切换成本主要来自剧本定制、 环境基线、运营集成，以及 GDPR、DORA、NIS2 和《欧洲 AI
              法案》等框架下的监管合规许可。在市场分销上，Tenex 依靠与超大规模云厂商 （Google Cloud 和 Microsoft）、系统集成商及增值经销商共同销售，将商业配额覆盖扩展到 EMEA
              和北美。然而，对超大规模云厂商平台的依赖 也有两面性：与 Google SecOps 原生对齐，可在不提取遥测的情况下加速七天部署；但 Google 和 Microsoft 有权将原生自动告警分诊直接打包进
              核心企业许可协议。此外，Tenex 的 MetaHarness SDLC 等内部软件交付框架显示出内部自动化纪律，但如果基础模型让所有企业防御者的告警上下文
              生成趋于商品化，它们并不能让面向客户的合同免受竞争者商品化冲击。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP011
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 架构分化：租户内 AI 对集中式日志湖
            body: >-
              Tenex 与传统 MDR 服务商的核心技术战场在于数据引力。传统 MDR 厂商要求把高流量遥测转发到自有云仓库，承担高额带宽和出口费用。 Tenex 的租户内智能体检查利用客户在 Google SecOps 或
              Microsoft Sentinel 上已有的投入，把竞争销售从全面基础设施替换转成叠加式方案。
            calloutType: insight
            claimRefs:
              - CP002
              - CP004
              - CP009
          - type: callout
            title: 超大规模云厂商打包威胁与竞争替代
            body: >-
              Tenex 直接部署在 Google SecOps 和 Microsoft Sentinel 之上，因此其长期护城河天然容易受到超大规模云厂商功能演进的冲击。 如果 Google Cloud 或
              Microsoft 将原生、完全自主的告警分诊智能体直接嵌入企业许可且不另收费，Tenex 的纯 MDR 价值主张就会被迫向上迁移， 转向复杂的定制取证与托管修复服务。
            calloutType: risk
            claimRefs:
              - CP005
              - CP012
              - CP013
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价
        blocks:
          - type: paragraph
            body: >-
              Tenex 将类似订阅的托管安全运营与服务结合变现，而不是纯自助软件产品。公开描述列出三种服务版本：专注于配置 Google SecOps 及相关剧本的
              入门套餐、中档托管方案，以及提供全天候监控和修复的完整层级。较新的 Google AI Threat Defense 交付方案也可单独购买，或集成到 Tenex 的 SOC 和 MDR
              服务中。这支持多种潜在收入来源，但保留来源没有公布套餐价格、计费单位、最低承诺、折扣或实际合同金额。因此，公开可见的是 套餐结构，实际成交价格和收入确认仍未验证。
            claimRefs:
