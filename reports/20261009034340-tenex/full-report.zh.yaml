      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              Tenex 于 2026 年 3 月完成 $250M Series B，并称资金将支持招聘超过 250 人、扩张 EMEA、深化合作伙伴关系，以及持续 AI 研究和产品投入。
              原则上，这样的融资规模降低了近期融资风险，但截至本报告日期，仍无法得知手头现金、烧钱速度、债务、营运资金需求或现金跑道。计划中的扩张还增加 执行和成本风险，因为工程师、SOC
              分析师、销售和客户成功人员都是交付模式的核心。财务结论因此喜忧参半：早期合同需求和大额资本基础是积极因素， 但收入可比性、利润率持久性、资本效率和下一融资触发点仍是需要公司数据室证据的投资判断障碍。
            claimRefs:
              - CI003
              - CI009
              - CI012
              - CI013
              - CI014
