  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险架构与监管治理
        blocks:
          - type: paragraph
            body: >-
              评估 Tenex，需要看清软件中心的投资者叙事与受服务约束的运营交付之间的结构性差异。该企业服务于金融服务、医疗、能源和关键基础设施等 任务关键型环境 CR001。横跨这些受监管行业，使 Tenex
              面临严格的事件披露制度、数据本地化义务和供应商第三方保障审计 CR002。 关于公司运营实体（总部位于佛罗里达州萨拉索塔的 Tenex.ai
              Inc.）的公开文件，没有在开放网络仓库中找到标准客户数据处理协议（DPA）或 SOC 2 Type II、ISO 27001 等监管合规认证 CR003。此外，在 tenex.io 域名下获取的公开条款指向
              Tenex Middle East FZ LLC， 这是一个受阿联酋法律管辖、与本公司无关的社区分类信息实体，凸显 Tenex.ai Inc. 完全缺乏可公开检查的企业服务条款或主服务协议
              CR004。因此，企业采购尽调必须验证客户遥测和案件推理是否符合行业特定隐私要求，以及严格的审计轨迹是否满足机构合规官要求 CR002, CR003。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: 运营失效模式、告警准确性与人力扩张
        blocks:
          - type: paragraph
            body: >-
              Tenex 营销的是高效率运营模式：在不到一分钟内调查 100% 的接入遥测，并宣称误报率下降 95% 以上 CR005, CR006。平台将专门的 AI
              分诊智能体与指定人工分析师结合，后者保留升级事项的唯一决策权和责任 CR006, CR007。然而，公司同时在工程、SOC 运营、销售和客户成功团队 增加超过 250 名员工 CR008，此前员工数也曾同比增长
              318% CR009。这造成了尖锐的组织扩张瓶颈：在不稀释质量或增加分析师倦怠的情况下， 招募数百名二、三级防御人员，是重大执行风险 CR008, CR010。此外，Tenex
              路线图包括投资直接自动化行动，例如在客户环境中隔离终端威胁并 清除恶意内容 CR011。在自主运营环境中，错误遏制或误报修复触发器可能令企业工作负载遭遇灾难性服务中断，放大残余运营责任 CR006, CR011。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
