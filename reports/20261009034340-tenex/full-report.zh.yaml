  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 运营架构与智能体 SOC 引擎
        blocks:
          - type: paragraph
            body: >-
              Tenex 将核心产品定位为 AI 原生、人工主导的安全运营中心，解决企业防御中的告警疲劳和分析师产能限制。Tenex 不搭建外部数据孤岛，
              也不在旧基础设施上改造启发式机器学习，而是直接部署在企业遥测环境之上，主要覆盖 Google Cloud SecOps 和 Microsoft Sentinel。
              在客户环境中，专门的人工智能智能体并行执行告警分诊、历史上下文补充、实体关联和威胁搜寻，耗时不到一分钟。关键是，企业遥测仍留在 客户的云边界和保留政策内，缓解第三方安全数据复制常见的合规摩擦。Tenex
              采用人在回路的架构：机器智能体分诊告警量，指定安全分析师 仍对最终升级和遏制行动负责。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
