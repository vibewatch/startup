  - id: FV001
    title: 建议与估值决策逻辑
    type: flow
    summary: 将运营证明、治理结构和估值证据连接至最终尽调立场的分步决策框架。
    data:
      nodes:
        - id: capital-scale
          label: 资本规模：$250M Series B 与 $277M 已披露股权总额
        - id: operating-traction
          label: 运营牵引力：$25M 合同收入与 318% 增长
        - id: executive-validation
          label: 高管验证：前 Schwab CISO 加入并担任总裁
        - id: valuation-mark
          label: 估值立场：$1B 未经验证的媒体估值标记（倍数偏高）
        - id: information-gaps
          label: 缺口：经审计 ARR、毛利率与股权结构表优先级未披露
        - id: final-recommendation
          label: 建议：继续研究（需审计真实单位经济性）
      edges:
        - from: capital-scale
          to: operating-traction
        - from: operating-traction
          to: executive-validation
        - from: executive-validation
          to: valuation-mark
        - from: valuation-mark
          to: information-gaps
        - from: information-gaps
          to: final-recommendation
    approximationNotes: 流程展示机构尽调中的依赖顺序，而非定量财务计算。
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV008
