  - id: "financing-history-and-valuation-context"
    title: "Financing History and Valuation Context"
    body: "Tenex's financing history exhibits remarkable capital velocity across its first two operational years [CV001, CV009]. After coming out of stealth in early 2025, the company announced a $27M Series A round in September 2025 led by Crosspoint Capital Partners with participation from Andreessen Horowitz (a16z) and Shield Capital, followed by strategic expansion closes involving DeepWork Capital, the Florida Opportunity Fund, and DTCP to support EMEA expansion [CV006, CV009, CV013]. In March 2026, Tenex completed an outsized $250M Series B funding round again led by Crosspoint Capital Partners, with continued participation from a16z and Shield Capital, bringing total disclosed equity funding to $277M [CV001, CV009].\n\nExternal news commentary and funding trackers report that the $250M Series B reportedly valued Tenex at $1B, although the company's official corporate releases have avoided confirming any post-money valuation mark [CV008, CV009, CV012]. At a $1B valuation on $250M of newly raised cash, the post-money ownership dilution represents approximately 25%, indicating substantial preference overhang and liquidation priority ahead of common shareholders [CV001, CV008]. Evaluating public evidence reveals that while Tenex raised $250M in new capital, cash on hand does not equal sustainable enterprise value without verified gross margins and positive unit economics [CV003, CV010]. Furthermore, public disclosures omit liquidation preference seniority, governance participation rights, and secondary transaction pricing, creating a high barrier to independent valuation underwriting [CV009, CV010]."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV006"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV012"
      - "CV013"
    tableRefs:
      - "TV002"
    figureRefs:
      - "FV001"
  - id: "scenario-modeling-and-comparable-set"
    title: "Scenario Modeling, Comparables, and Diligence Path"
    body: "Evaluating Tenex across comparable public and private cybersecurity peers underscores valuation dispersion between pure-play SaaS platforms and hybrid managed service providers [CV003, CV009]. Incumbent vendor-native platforms like CrowdStrike (Falcon Complete) command high software multiples due to 75%+ software gross margins, whereas scaled managed detection peers like Arctic Wolf have historically navigated services-heavy margin profiles requiring analyst headcount scaling [CV003, CV009]. Tenex's positioning as an AI-native MDR provider attempts to capture SaaS multiples on managed services revenue, claiming software-like scalability through agentic triage [CV001, CV003].\n\nUnder a bull case scenario, Tenex successfully operationalizes its 250+ technical and sales hires, scales its EMEA expansion via DTCP, converts contracted customer commitments into recognized ARR exceeding $60M by 2027, and proves that LLM inference costs remain lower than displaced SOC wages, validating a $1.2B–$1.8B valuation at a 20x–25x software multiple [CV001, CV006, CV010]. In the base case, Tenex achieves steady enterprise adoption with Fortune 500 accounts on Google SecOps and Microsoft Sentinel, but blended gross margins stabilize in the 50%–60% range due to complex multi-cloud edge cases, supporting a fair value mark of $500M–$750M (10x–12x multiple on recognized revenue), indicating that current entry prices are stretched [CV002, CV008, CV011]. In a bear case, hyperscaler native SOC automation erodes third-party MDR demand, customer concentration creates revenue volatility, and heavy Series B liquidation preferences trigger a down-round or recapitalization below $300M [CV008, CV009, CV010]. Institutional investors should maintain a research-more stance and condition capital deployment on audited ARR, cohort retention, and verified gross margin waterfalls [CV008, CV010]."
