chapter:
  number: 1
  title: "Company Overview"
  summary: "TENEX.AI is a Sarasota-based, AI-native managed detection and response provider founded by CEO Eric Foster and built around Google SecOps and Microsoft Sentinel environments. It announced a $250 million Series B in March 2026, but retained databases disagree on whether total disclosed funding is $250 million or $277 million; valuation, current headcount, customer count, governance terms, and unit economics remain unresolved."
sections:
  - id: "identity-and-architecture"
    title: "Company Identity, Origins, and Core Architecture"
    body: "TENEX.AI is a managed detection and response provider founded in 2024 by Chief Executive Officer Eric Foster and headquartered in Sarasota, Florida [CO002, CO003]. Its public product surfaces describe an overlay for Google SecOps and Microsoft Sentinel rather than a replacement for those customer-owned environments: software agents perform triage, investigation, correlation, hunting, and response work, while named analysts retain consequential decisions [CO006]. TENEX claims that this model investigates 100% of in-scope alerts and can produce a disposition-ready case in under one minute, compared with its stated industry baseline of roughly 10% of alerts reviewed [CO007]. Those performance figures remain company-issued assertions; the assigned independent reporting confirms the service model but does not provide a controlled benchmark. The official Series B announcement also lists offices in Overland Park, San Jose, and Phoenix, while the retained EMEA announcement describes a planned international headquarters without naming its location [CO003, CO004]."
    claimRefs:
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership, Governance Structure, and Executive Team"
    body: "The retained record identifies Eric Foster as founder and chief executive officer, Bashar Abouseido as president from March 2026, and Elias “Lou” Manousos as chairman [CO002, CO013, CO016]. Foster is the public strategic voice and is described by Venture Capital Tracker as a former Mandiant and Trustwave executive; that concentration makes founder continuity an important diligence issue rather than proof of weak governance [CO002]. Abouseido adds buyer-side operating experience from his prior role as senior vice president and chief information security officer at Charles Schwab [CO013]. TENEX also says its founding engineers came from hyperscalers and leading AI laboratories, while the homepage specifically invokes engineers who built Google Chronicle [CO006]. The available sources do not enumerate the complete board, voting rights, committees, observer seats, or succession arrangements. Investor influence is therefore visible through named financing participants, but formal control cannot be inferred from round leadership alone."
    claimRefs:
      - "CO002"
      - "CO006"
      - "CO013"
      - "CO016"
    tableRefs:
      - "TO002"
      - "TO003"
  - id: "capitalization-and-scale"
    title: "Capitalization History, Financing Structure, and Scale Verification"
    body: "TENEX’s financing record accelerated from a reported $27 million Series A in September 2025 to a $250 million Series B led by Crosspoint Capital Partners on March 31, 2026 [CO001, CO005]. The retained databases conflict on cumulative capital: Startup Fundraising reports $250 million in total disclosed funding, while Venture Capital Tracker reports $277 million in total disclosed equity funding, apparently including the earlier round [CO008, CO009]. The conflict should not be resolved by arithmetic without capitalization documents, and funding raised is not the same as cash currently available. Operating metrics also require careful labels. DTCP reported more than $10 million of revenue within six months and multiple Fortune 500 wins as of December 2025; TENEX later reported more than $25 million of contracted revenue, 318% year-over-year headcount growth, and a plan for more than 250 hires [CO004, CO010, CO011, CO012]. Contracted revenue is neither ARR nor recognized revenue. The latest known valuation is not publicly disclosed, and an independent tracker flags scaled unit economics as still needing proof [CO014, CO015]."
    claimRefs:
      - "CO001"
      - "CO004"
      - "CO005"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO014"
      - "CO015"
    figureRefs:
      - "FO001"
