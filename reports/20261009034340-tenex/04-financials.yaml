company:
  name: "Tenex"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Tenex has credible early commercial momentum, including company-reported contracted revenue
    above $25 million and third-party reports of rapid early revenue growth, but the public record
    does not establish recognized revenue quality, realized pricing, gross margin, retention, burn,
    or runway. The $250 million Series B finances an aggressive hiring and international expansion
    plan; it is funding raised, not evidence of cash still available.
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue model and pricing"
    body: >-
      Tenex monetizes a blend of subscription-like managed security operations and services rather
      than a pure self-serve software product. Public descriptions identify three service editions:
      an entry package focused on configuring Google SecOps and associated playbooks, a mid-tier
      managed offering, and a comprehensive tier with round-the-clock monitoring and remediation.
      The newer Google AI Threat Defense delivery offer can also be bought standalone or integrated
      into Tenex's SOC and MDR services. This supports multiple potential revenue streams, but no
      retained source publishes package prices, billing units, minimum commitments, discounts, or
      realized contract values. Consequently, the public package structure is observable while
      price realization and revenue recognition remain unverified.
    claimRefs: ["CI001", "CI002", "CI007", "CI008", "CI012"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "traction-and-revenue-quality"
    title: "Traction and revenue quality"
    body: >-
      The strongest current traction disclosure is Tenex's March 2026 statement that contracted
      revenue exceeded $25 million after roughly one year in market; SiliconANGLE independently
      reported the same company-provided definition as the combined value of customer contracts.
      Earlier reports said revenue surpassed $10 million within six months and $18 million by the
      third operating quarter. A separate market-data page records $43 million as March 2026
      revenue, but its own methodology says round-linked figures may be revenue or ARR and may
      represent run-rate or LTM values. These figures therefore cannot be combined into a clean
      growth series, and contracted revenue should not be treated as recognized revenue or ARR.
    claimRefs: ["CI003", "CI004", "CI005", "CI006", "CI014"]
  - id: "delivery-economics"
    title: "Delivery economics and sales-efficiency proxies"
    body: >-
      The delivery model combines AI agents, customer-owned Google SecOps or Microsoft Sentinel
      environments, named analysts, and in some cases 24x7 human operations. Tenex claims that its
      platform processes all customer alert telemetry in under one minute, reduces false positives
      by more than 95%, and produces 6.2x analyst efficiency. Those operational claims could support
      attractive labor leverage, but they do not disclose gross margin, analyst utilization,
      infrastructure cost, support burden, implementation cost, or incremental headcount per
      customer. The company and an investor describe unusually strong gross-margin potential, yet
      no percentage or audited basis is public. Sales-cycle length, CAC, payback, NRR, churn, and
      channel economics also remain absent, preventing a defensible unit-economics model.
    claimRefs: ["CI008", "CI010", "CI011", "CI012", "CI013"]
    tableRefs: ["TI003"]
  - id: "capital-adequacy-and-verdict"
    title: "Capital adequacy and financial verdict"
    body: >-
      Tenex raised a $250 million Series B in March 2026 and said the proceeds would support more
      than 250 hires, EMEA expansion, deeper partnerships, and continued AI research and product
      investment. That scale of financing lowers near-term funding risk in principle, but it does
      not reveal cash on hand, burn, debt, working-capital needs, or runway as of this report date.
      The planned expansion also adds execution and cost risk because engineers, SOC analysts,
      sales, and customer-success personnel are central to the delivery model. The financial
      verdict is therefore mixed: early contracted demand and a large capital base are positive,
      while revenue comparability, margin durability, capital efficiency, and the next financing
      trigger remain underwriting blockers requiring company data-room evidence.
    claimRefs: ["CI003", "CI009", "CI012", "CI013", "CI014"]
