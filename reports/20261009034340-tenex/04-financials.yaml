    columns: ["Offering", "Published price", "Contract model", "Included capability", "Discounts or unknowns", "Implication"]
    rows:
      - ["Entry package", null, "Not disclosed", "Google SecOps setup, playbooks, maintenance, and training", "Price, term, and realized discount unavailable", "Cannot estimate implementation margin or conversion to recurring service"]
