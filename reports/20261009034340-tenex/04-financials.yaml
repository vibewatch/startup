callouts:
  - calloutType: "risk"
    title: "Contracted revenue is not ARR"
    body: >-
      The $25 million disclosure is explicitly contracted revenue. It should not be used as
      recognized revenue, ARR, cash collected, or a recurring-revenue denominator without a
      company reconciliation.
    claimRefs: ["CI003", "CI014"]
  - calloutType: "recommendation"
    title: "Gate underwriting on a financial data-room bridge"
    body: >-
      Require a monthly bridge from bookings and contracted value to recognized revenue and cash,
      plus package-level gross margin, retention, CAC/payback, burn, debt, and runway before assigning
      confidence to revenue quality or capital efficiency.
    claimRefs: ["CI004", "CI012", "CI014"]
