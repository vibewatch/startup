      - ["Comprehensive MDR", null, "Not disclosed", "24x7 monitoring, remediation, detection maintenance, and incident reporting", "Response scope, SLA, and overage terms unavailable", "Highest-scope tier may carry the greatest labor and liability exposure"]
    notes: "Null prices mean no list or realized price appeared in the assigned public evidence; package descriptions come from SiliconANGLE's reporting on Tenex's service tiers."
    claimRefs: ["CI002", "CI008", "CI012"]
  - id: "TI003"
    title: "Unit economics and capital-adequacy scorecard"
    columns: ["Metric", "Public value or status", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["Contracted revenue", "Over $25M as of March 2026; company-reported", "Medium", "Signals signed demand but is not recognized revenue or ARR", "Reconcile bookings, contracted revenue, ARR, backlog, and GAAP revenue"]
      - ["Revenue data point", "$43M recorded by Multiples.vc for March 2026", "Low", "Provider says the field may be revenue or ARR and run-rate or LTM", "Provide audited revenue bridge and exact period/denominator"]
      - ["Implied valuation multiple", "23.3x on Multiples.vc's $1B valuation and $43M field", "Low", "Sensitive to the ambiguous denominator and not a margin measure", "Confirm valuation, fully diluted capitalization, and metric definition"]
      - ["Gross margin", "No percentage disclosed", "Low", "Core test of whether AI offsets human service delivery", "Provide gross margin by package and treatment of SOC labor and cloud costs"]
      - ["Retention and sales efficiency", "NRR, churn, CAC, payback, and sales cycle undisclosed", "Low", "Determines durability and cost of growth", "Provide cohort retention, pipeline conversion, CAC, commissions, and payback"]
      - ["Liquidity and runway", "Cash, burn, debt, and runway undisclosed", "Low", "Funding raised does not equal cash available", "Provide monthly cash, burn, working capital, debt terms, hiring plan, and next-round trigger"]
    notes: "Values are not a comparable time series: contracted revenue, the third-party revenue-or-ARR field, valuation, and undisclosed operating metrics use different definitions and denominators."
    claimRefs: ["CI003", "CI004", "CI009", "CI010", "CI012", "CI014"]
