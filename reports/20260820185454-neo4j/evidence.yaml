evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount-gap
    missingEvidence: A verified 2026 employee count by geography and function.
    whyItMatters: Headcount is a leading indicator for burn, hiring discipline, and post-2024 capital efficiency.
    diligencePath: Request current HRIS export or verified LinkedIn/company reconciliation from management.
    relatedQuestionRefs:
      - QO012
  - type: private-evidence-only
    severity: material
    topic: total-raised-and-investor-map
    missingEvidence: A clean round-by-round cap table including any early Series A amount and 2024 security terms.
    whyItMatters: The exact lifetime capital base and preference stack affect dilution and valuation interpretation.
    diligencePath: Request board-approved financing history and current capitalization table.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: 2024-investor
    missingEvidence: Definitive documentation naming the 2024 investor and instrument.
    whyItMatters: Investor identity is part of the qualification event and credibility of the latest valuation signal.
    diligencePath: Obtain the signed term sheet or company-certified press materials for the November 2024 capital event.
    relatedQuestionRefs:
      - QO022
  - type: missing-source
    severity: material
    topic: market-size-primary-sources
    missingEvidence: Directly fetched neutral analyst reports with bottom-up graph market sizing and methodology details.
    whyItMatters: >-
      Public top-down claims are directionally useful but weaker than directly reviewed market reports for underwriting
      market size.
    diligencePath: Obtain Gartner, IDC, Forrester, or specialist market reports directly rather than through vendor quotations.
    relatedQuestionRefs:
      - QM021
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: serviceable-market-share
    missingEvidence: Neo4j revenue split by cloud vs. self-managed and by major workflow vertical.
    whyItMatters: >-
      Without delivery-model and vertical mix, it is hard to convert top-down market stories into a realistic
      serviceable market estimate.
    diligencePath: Request management segmentation by product surface and vertical for the last three fiscal years.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss-data
    missingEvidence: Win/loss rates, realized discounting, and churn by competitor class.
    whyItMatters: >-
      Without those data the chapter can describe competitive structure but cannot quantify where Neo4j actually wins or
      loses economically.
    diligencePath: Request CRM-coded opportunity outcomes and top ten loss reasons by competitor for the last 24 months.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: moderate
    topic: independent-benchmarking
    missingEvidence: Neutral third-party performance or TCO benchmarks across Neo4j, Neptune, TigerGraph, Memgraph, and JanusGraph.
    whyItMatters: Capability and pricing surfaces do not reveal actual production economics or performance under shared workloads.
    diligencePath: Run workload-specific bakeoffs or obtain customer benchmark packets rather than relying on marketing claims.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: cloud-mix-and-margin
    missingEvidence: Revenue mix by cloud vs. self-managed plus gross margin by delivery model.
    whyItMatters: >-
      Those two fields drive almost every valuation, quality, and cash-flow inference for a late-stage infrastructure
      company.
    diligencePath: Request a three-year revenue bridge and gross-margin split by product surface.
    relatedQuestionRefs:
      - QI016
      - QI023
    relatedTableRefs:
      - TI001
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, operating cash flow, and any debt covenant package.
    whyItMatters: >-
      Without those inputs it is impossible to convert “approaching cash-flow positive” into true runway or next-round
      dependency.
    diligencePath: Request monthly cash bridge, forecast, and debt schedule.
    relatedQuestionRefs:
      - QI015
      - QI022
      - QI024
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: moderate
    topic: low-level-architecture-detail
    missingEvidence: >-
      Independent or highly technical documentation on storage internals, scheduler behavior, and exact multi-tenant
      isolation design.
    whyItMatters: >-
      Public materials are sufficient for operating architecture but not for validating every performance or isolation
      claim.
    diligencePath: Request technical architecture review with engineering leadership and detailed design documentation.
    relatedQuestionRefs:
      - QE021
      - QE024
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: new-ai-surface-adoption
    missingEvidence: Production adoption, reliability, and revenue contribution for Aura Agent and MCP Server.
    whyItMatters: These products shape the AI narrative but may still be too early to carry major valuation weight.
