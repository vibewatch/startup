companyProfile:
  summary: Neo4j is the world's most widely deployed graph database company, founded in 2007 and headquartered in San Mateo, California with engineering roots in Malmö, Sweden. The company created the Cypher graph query language, which became the openCypher open standard. Neo4j serves enterprise customers across financial services, healthcare, logistics, and government with its on-premises and AuraDB managed cloud platform. In November 2024, the company raised a $50M growth round from Nordic Capital, confirming a valuation of approximately $2B and reinforcing the company's position as a durable category leader in graph infrastructure.
  foundedDate: '2007-01-01'
  founders:
    - name: Emil Eifrem
      role: CEO / Co-founder
      background: Founder-CEO who has led Neo4j since inception, a prominent advocate for graph databases and the openCypher standard.
      claimRefs: [CO004]
  foundingLocation: Malmö, Sweden
  headquarters: San Mateo, CA (US) with major operations in Malmö, Sweden
  productSummary: Neo4j sells graph database software and cloud-managed services (AuraDB), enabling enterprise customers to model, query, and traverse complex connected data relationships at scale, increasingly used for AI knowledge graphs and fraud detection.
  customerFocus: Enterprise customers in financial services, healthcare, government, logistics, and technology requiring complex relationship traversal at scale.
  businessModel: Commercial software licensing and SaaS subscription revenue for Neo4j Enterprise and AuraDB, supplemented by professional services and training.
  stage: Late-stage private
  fundingStatus: $50M growth round from Nordic Capital in November 2024 at approximately $2B valuation; total raised over $500M including prior rounds from Greenbridge Partners, One Peak Partners, and others.
