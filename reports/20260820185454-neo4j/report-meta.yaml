  topStrengths:
    - Category-defining position as the dominant labeled-property graph database with 250K+ developer community and 18+ years of graph infrastructure investment.
    - Cypher/openCypher standard ownership creates durable ecosystem lock-in similar to SQL's gravity in relational databases.
    - AI-era tailwinds from knowledge graph demand for RAG and LLM grounding are materially accelerating enterprise graph adoption.
    - November 2024 Nordic Capital growth round at ~$2B confirms continued late-stage institutional confidence despite challenging private market conditions.
    - AuraDB managed cloud removes deployment friction and opens a consumption-based recurring revenue stream.
  topRisks:
    - Audited ARR, NRR, cloud mix, and margins not publicly disclosed, limiting underwriting precision.
    - Competitive pressure from AWS Neptune, Azure Cosmos DB, TigerGraph, and vector-graph hybrids targeting overlapping use cases.
    - Open-source community edition competes with commercial product, creating conversion and monetization complexity.
    - Nordic Capital as primary late-stage backer creates limited exit optionality and IPO timing uncertainty.
    - Enterprise sales cycles are long and buyer budgets for graph infrastructure can compress during macro slowdowns.
  unresolvedGaps:
    - Audited annual recurring revenue, net revenue retention, and AuraDB cloud contribution.
    - EBITDA and free cash flow trajectory showing path to profitability.
    - Customer count, logo retention, and top customer concentration.
    - IPO filing timeline and potential investor exit options.
    - Competitive win rates against AWS Neptune and Azure Cosmos DB in enterprise deals.
