chapter:
  number: 2
  title: Market Analysis
  summary: 'Neo4j addresses a real but layered market: a specialized graph-DBMS category inside broader database
    and AI infrastructure budgets, with the highest-confidence opportunity concentrated in connected-data workflows
    such as security, lineage, supply chain, and GraphRAG rather than in generic data storage.'
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Substitutes
  body: |
    Neo4j does not operate in a neatly bounded single-product market. The most defensible core market includes graph database software, managed graph database services, graph analytics, and knowledge-layer tooling sold to organizations whose key problem is relational complexity across data. That is narrower than the entire database market but broader than a pure on-premise database-license category. The fetched evidence supports this layered view. DB-Engines still publishes a distinct graph DBMS ranking, which validates graph databases as a recognized subcategory. At the same time, competitor and adjacent-product pages show that buyers can also solve pieces of the same problem with integrated graph features in a broader database, a zero-ETL graph engine on top of a lakehouse, or a general cloud graph service. That means status-quo substitutes include relational warehouses, search stacks, document systems, and manual ETL-heavy knowledge-management workflows. Neo4j’s real market is therefore defined less by database taxonomy and more by whether connected data is central to the customer’s workflow.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM006
  - CM007
  - CM024
  - CM025
  - CM026
  - CM034
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: buyer-segments
  title: Buyer Segments and Workflow Entry Points
  body: |
    The customer evidence points to a market that is enterprise-led and workflow-specific. Neo4j shows up where the cost of not understanding relationships is high. Intuit uses a knowledge graph to reason over security posture and infrastructure exposure at massive scale. Dun & Bradstreet applies graph to ownership-resolution and compliance workflows that are painfully slow under manual methods. IBM Manta uses Neo4j to support lineage, governance, and cloud-migration reasoning across regulated enterprise data estates. BASF uses graph to optimize supply-chain trade-offs across a globally complex manufacturing network, while Transport for London uses connected-data reasoning for real-time digital-twin and incident-response workflows. Klarna and Uber then widen the picture further: graph is no longer only a data-management choice but also an AI and knowledge-layer choice. The budget owner varies by use case, but the common buyer is usually a large engineering, data, security, or operations team with material pain and the ability to sponsor platform adoption.
  claimRefs:
  - CM011
  - CM012
  - CM013
  - CM014
  - CM015
  - CM016
