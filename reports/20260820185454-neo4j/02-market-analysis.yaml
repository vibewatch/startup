- id: growth-drivers-and-constraints
  title: Growth Drivers, Adoption Triggers, and Constraints
  body: |
    The strongest growth driver in the current evidence set is AI. Neo4j’s recent messaging consistently reframes graph as foundational infrastructure for GraphRAG, agent memory, and explainable AI. Google Cloud and AWS partner materials reinforce that graphs are increasingly entering the market through generative-AI workflows rather than only through classic master-data or fraud programs. Cloud distribution is a second driver. Neo4j’s own release says cloud demand has grown fivefold in three years, and hyperscaler channels shorten procurement cycles for teams that want a managed option. Yet the same evidence shows adoption constraints. Graph remains a specialized tool. Review sites still surface learning-curve, backup, setup, and scaling complaints; enterprise pricing often remains negotiated rather than self-serve; and integrated substitutes from hyperscalers or adjacent platforms can be good enough for some buyers. The market is growing, but it is not frictionless, and Neo4j’s category leadership does not eliminate the need to prove workload fit.
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM021
  - CM022
  - CM023
  - CM028
  - CM029
  - CM030
  - CM031
  tableRefs:
  - TM004
  figureRefs:
  - FM004
- id: sizing-lens
  title: Sizing Lens and Public-Evidence Limits
  body: |
    The fetched sources support directional sizing, not a fully auditable bottom-up TAM. Neo4j’s November 2024 release is the main numeric anchor and frames the broader DBMS opportunity at $110 billion, with graph DBMS growing more than 32.6% annually. Those numbers are useful but should not be treated as neutral independent evidence because the underlying analyst materials were not directly fetched into the run. The cleaner way to think about the market is as a layered pyramid. At the top sits broad data-management and AI-infrastructure adjacency. Beneath that sits the graph database and analytics category visible in DB-Engines and vendor positioning. At the narrowest serviceable layer are the connected-data workflows where graph offers decisive ROI today: security exposure mapping, ownership and fraud analysis, lineage, digital twins, supply-chain decisioning, and agentic knowledge layers. That framing is good enough for competitive and valuation work, but the report should preserve the open question that public evidence still does not disclose exact category revenue splits, deployment counts, or cloud mix.
  claimRefs:
  - CM004
  - CM005
  - CM010
  - CM033
  - CM034
  - CM035
  - CM036
  tableRefs:
  - TM002
  figureRefs:
  - FM002
