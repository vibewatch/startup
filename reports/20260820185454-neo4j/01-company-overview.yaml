  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount-gap
    missingEvidence: A verified 2026 employee count by geography and function.
    whyItMatters: Headcount is a leading indicator for burn, hiring discipline, and post-2024 capital efficiency.
    diligencePath: Request current HRIS export or verified LinkedIn/company reconciliation from management.
    relatedQuestionRefs:
    - QO012
  - type: private-evidence-only
    severity: material
    topic: total-raised-and-investor-map
    missingEvidence: A clean round-by-round cap table including any early Series A amount and 2024 security terms.
    whyItMatters: The exact lifetime capital base and preference stack affect dilution and valuation interpretation.
    diligencePath: Request board-approved financing history and current capitalization table.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO002
    - TO003
  - type: conflicting-data
    severity: material
    topic: 2024-investor
    missingEvidence: Definitive documentation naming the 2024 investor and instrument.
    whyItMatters: Investor identity is part of the qualification event and credibility of the latest valuation signal.
    diligencePath: Obtain the signed term sheet or company-certified press materials for the November 2024 capital
      event.
    relatedQuestionRefs:
    - QO022
