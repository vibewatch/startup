company:
  name: Neo4j
chapter:
  number: 1
  title: Company Overview
  summary: Neo4j is a category-defining graph database company with credible late-stage scale, a broadened graph-intelligence
    product story, and renewed AI momentum, but public evidence is still dominated by company-authored metrics and
    the November 2024 investor identity requires direct confirmation.
sections:
- id: identity-and-scope
  title: Identity, Product Scope, and Category Positioning
  body: |
    Neo4j is best understood as the pioneer that commercialized the property-graph model and then spent the next decade broadening from a single database into a graph-intelligence platform. The current public surface is coherent on the main identity points: prototype work dates back to 2000, the company was formed in Sweden in 2007, and the headquarters story pivots to Silicon Valley after the 2011 move noted on the company timeline. Today the business is no longer just selling self-managed graph database software. It packages a multi-surface offering that includes Neo4j Graph Database, AuraDB managed cloud tiers, graph analytics, vector search, and AI-oriented orchestration. That matters because buyers increasingly evaluate Neo4j less as a niche data store and more as infrastructure for knowledge graphs, GraphRAG, and agentic systems. Third-party signals support that broader positioning: DB-Engines still ranks Neo4j first among graph DBMS products, openCypher credits Neo4j with developing Cypher, and GitHub confirms the continued relevance of its open-source core.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO007
  - CO008
  - CO009
  - CO023
  - CO024
  - CO025
  - CO034
