callouts:
- calloutType: strength
  title: Late-stage scale is real even if disclosure is thin
  body: |
    Neo4j’s public evidence base is unusually strong for a private infrastructure company: $200M ARR, first-place DB-Engines standing, marquee customer proof, and visible hyperscaler distribution all point to genuine category leadership.
  claimRefs:
  - CO012
  - CO021
  - CO023
  - CO029
  - CO030
- calloutType: risk
  title: 2024 investor identity should be confirmed directly
  body: |
    The reviewed public sources point to Noteus Partners rather than Nordic Capital as the investor behind the November 2024 capital event. That does not undermine the valuation signal, but it is material enough to verify before relying on the round as a qualification anchor.
  claimRefs:
  - CO016
  - CO017
  - CO032
- calloutType: risk
  title: The public story is still heavily company-authored
  body: |
    Key metrics such as ARR growth, developer-community scale, and Fortune coverage come primarily from Neo4j’s own releases. That is adequate for screening but not a substitute for audited operating data.
  claimRefs:
