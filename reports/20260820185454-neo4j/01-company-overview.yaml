  - FO003
- id: leadership-and-governance
  title: Leadership, Governance, and Key-Person Dependence
  body: |
    Leadership visibility is unusually concentrated around Emil Eifrem, and that cuts both ways. On the positive side, the company still has a founder-CEO who can credibly claim authorship of the property-graph model and a long history of category evangelism. The leadership page also shows a mature governance scaffold with six executives, seven board members, and three advisors, including board representation from investors such as Patrick Pichette. On the negative side, the same public evidence implies material key-person dependence: Eifrem remains the core strategic narrator across funding, AI, and IPO-readiness messaging. Public governance disclosure is still thinner than what a late-stage investor would want. There is no comprehensive public discussion of board committees, voting thresholds, or secondary ownership concentration. That does not make governance weak, but it does mean diligence should treat the public leadership page as evidence of commercial maturity rather than proof of institutional-grade transparency.
  claimRefs:
  - CO004
  - CO005
  - CO006
  - CO018
  - CO035
  tableRefs:
  - TO002
  - TO003
- id: capital-and-milestones
  title: Capital History, 2024 Repricing, and Strategic Milestones
  body: |
    Neo4j’s capital story breaks into two phases. The first was classic venture scaling: early rounds, an $80 million Series E in 2018, then the 2021 Series F led by Eurazeo at a valuation above $2 billion. The second phase is balance-sheet optimization rather than headline expansion. In November 2024 the company said it had crossed $200 million ARR, doubled ARR over three years, and added $50 million of new capital while reaffirming a roughly $2 billion valuation. The important diligence nuance is investor identity. The reviewed public sources consistently point to Noteus Partners rather than Nordic Capital, so the qualification event should be treated as a $50 million growth-equity top-up with attribution still worth direct confirmation. Operationally, Neo4j has used milestones to support a broadened AI narrative: vector search in 2023, Aura portfolio expansion and ARR scale in 2024, a $100 million internal GenAI investment in 2025, and a 2026 agreement to acquire GraphAware.
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
