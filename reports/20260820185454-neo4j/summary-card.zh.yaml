  topStrengths:
    - Neo4j 仍像是图数据库里清晰的独立品类龙头，DB-Engines 排名领先，企业客户证据也很宽。
    - 平台向托管云、图分析、向量搜索和面向 AI 的知识层工具扩展，路线比较连贯。
    - 相比 2021 年后明显放大的 ARR 基数，约 $2B 的估值背景大体持平，定价纪律强于许多后期私有软件轮。
  topRisks:
    - 毛利率、NRR/GRR、云收入占比、现金、烧钱速度和客户集中度仍未披露，估值信心被压住。
    - 安全公告、2026 年 CVE，以及评论站点里关于大规模运维复杂度的证据，都要求给出实质风险折扣。
    - 最新 AI 界面可能有上行空间，但生产采用和收入转化的证据，仍不如成熟核心数据库和 Aura 业务扎实。
  unresolvedGaps:
    - 公开证据仍拿不到接近审计口径的利润率、留存、集中度和现金披露。
    - Aura Agent 和 MCP Server 的生产采用深度与收入贡献仍不清楚。
    - 头部客户占比、续约日历，以及云与自托管收入结构，都需要直接向管理层尽调。
    - 员工数、董事会层面治理细节和融资条款细节，公开可见度仍然有限。
