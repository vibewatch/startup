summary:
  headline: Neo4j 是真正的品类领导者，企业客户证据扎实，也有可信的 AI 时代上行空间；但在利润率、留存、集中度和 AI 转化指标披露前，当前约 $2B 的估值更像合理，而不是明显便宜。
