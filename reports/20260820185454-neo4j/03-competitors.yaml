callouts:
- calloutType: insight
  title: Neo4j’s main competition is budgetary, not just categorical
  body: |
    The hardest deals are not necessarily lost to another pure graph vendor. They are often narrowed by platform bundles, incumbent database extensions, or AI-context alternatives that change what buyers think they need to purchase.
  claimRefs:
  - CP004
  - CP005
