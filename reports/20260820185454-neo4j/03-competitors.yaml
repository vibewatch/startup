  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss-data
    missingEvidence: Win/loss rates, realized discounting, and churn by competitor class.
    whyItMatters: Without those data the chapter can describe competitive structure but cannot quantify where Neo4j
      actually wins or loses economically.
    diligencePath: Request CRM-coded opportunity outcomes and top ten loss reasons by competitor for the last 24
      months.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: moderate
    topic: independent-benchmarking
    missingEvidence: Neutral third-party performance or TCO benchmarks across Neo4j, Neptune, TigerGraph, Memgraph,
      and JanusGraph.
    whyItMatters: Capability and pricing surfaces do not reveal actual production economics or performance under
      shared workloads.
    diligencePath: Run workload-specific bakeoffs or obtain customer benchmark packets rather than relying on marketing
      claims.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP002
    - TP003
