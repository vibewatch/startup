- id: pricing-distribution-switching
  title: Pricing, Distribution Power, and Switching Costs
  body: |
    Distribution and pricing are where Neo4j’s leadership is most contestable. On one hand, Neo4j benefits from deep category history, a known developer vocabulary, and routes through major hyperscaler channels. On the other hand, those same channels empower strong substitutes with easier budget alignment. Neptune publishes example pricing directly and benefits from AWS procurement inertia. Memgraph’s public pricing and free community entry reduce trial friction. TigerGraph also shows a more explicit usage-based packaging approach than the traditional quote-led enterprise motion many buyers associate with Neo4j. Open-source alternatives such as JanusGraph change the buyer calculus again by lowering apparent software cost while pushing more burden onto the operator. Cypher familiarity does create switching friction in Neo4j’s favor for some workloads, but specialization cuts both ways: when the buyer wants to stay inside an incumbent stack or avoid a dedicated graph platform entirely, the switching-cost logic works against Neo4j.
  claimRefs:
  - CP016
  - CP017
  - CP018
  - CP019
  - CP020
  - CP021
  - CP022
  - CP030
  - CP032
  - CP033
  - CP034
