- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - AI narrative outruns proof
    - AI customer growth without durable production references
    - Two or more quarters of weak enterprise production conversion
    - Discount AI premium in valuation and slow conviction
  - - Security trust breaks
    - Cluster of severe CVEs, breach reports, or repeated outage events
    - Two major public incidents in a short period
    - Escalate diligence and widen risk discount
  - - Pricing / expansion friction
    - Pilot-to-production conversion stalls or discounts spike
    - Materially weak conversion or gross margin compression
    - Re-rate go-to-market quality downward
  - - Disclosure thinness persists into financing event
    - IPO prep continues without margin / retention transparency
    - No clean disclosure package before next financing step
    - Prefer track / research-more stance
  - - Customer concentration surprise
    - Top-customer share proves materially high
    - Single customer or small cluster drives outsized ARR
    - Apply concentration discount and request protections
  notes: Kill criteria are intentionally monitorable rather than generic; each can move underwriting confidence
    quickly.
