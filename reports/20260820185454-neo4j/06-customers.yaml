- id: named-proof
  title: Named Customer Proof and Production Maturity
  body: |
    The quality of Neo4j’s named proof is better than a typical logo wall because several case studies include specific outcome detail. Dun & Bradstreet is especially strong proof: beneficial-ownership investigations that previously took days can be completed in milliseconds. Intuit shows another high-value production deployment, using Neo4j in security workflows tied to a huge customer and event footprint while describing exposure mapping in seconds. BASF validates industrial-scale planning, IBM Manta validates productized lineage software, TfL validates public-sector digital twins, and Klarna plus Uber validate AI-era knowledge-layer and agent workflows. Not every customer story is equally measurable, but collectively they cross the threshold from “recognizable logos” to “credible production-use evidence.” The key nuance is freshness: older enterprise proofs show durability, while newer AI references show that the customer base is still evolving.
  claimRefs:
  - CU006
  - CU007
