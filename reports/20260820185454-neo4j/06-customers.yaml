- id: durability-and-expansion
  title: Durability, Expansion, and Satisfaction Signals
  body: |
    Retention evidence is directionally positive but still incomplete. The clearest public expansion datapoint is Neo4j’s 2025 claim that 56% of its top 100 customers increased their footprint. That is meaningful because it points to expansion inside the installed base rather than purely logo acquisition. The structure of the use cases also helps: customers adopt Neo4j for mission-critical reasoning workflows, which often creates stickier switching dynamics than lightweight point tools. Review evidence broadly supports positive satisfaction, emphasizing product maturity, relationship-query power, documentation, and support. However, the same review corpus also preserves the friction side of the story: licensing complexity, learning curve, backup limitations, and difficulty at large scale. Without public NRR, GRR, or churn data, the right durability verdict is good but not fully quantified.
  claimRefs:
  - CU004
  - CU005
  - CU020
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU032
  tableRefs:
  - TU004
  figureRefs:
  - FU002
  - FU004
- id: concentration-and-friction
  title: Expansion, Concentration Risk, and Remaining Diligence Gaps
  body: |
    The main customer underwriting problem is not insufficient proof of adoption; it is insufficient disclosure about who matters most economically. Neo4j does not publish paid-customer counts, ARR by cohort, renewal rates, or top-customer concentration. As a result, concentration risk cannot be measured directly. The diverse mix of named references argues against an obviously narrow customer base, but that is only partial comfort. Channel and procurement routes through AWS, Azure, and Google also likely shape acquisition and expansion economics, which means some customer growth may be increasingly mediated by hyperscaler ecosystems. That can be a strength because it lowers friction, but it also means channel dependence deserves attention. The final synthesis is favorable on customer proof, moderate on expansion visibility, and weak on concentration precision. That mix supports confidence in product-market fit, but not yet in portfolio-style customer economics or renewal predictability for outside investors evaluating durability and concentration today publicly. A serious diligence process would therefore spend less time asking whether Neo4j has real customers and more time asking which cohorts renew best, which channels produce the healthiest accounts, and whether AI-led customer growth is broad or concentrated.
  claimRefs:
  - CU019
  - CU021
  - CU028
  - CU029
  - CU033
  - CU034
  - CU035
