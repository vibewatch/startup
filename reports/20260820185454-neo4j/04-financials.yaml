- id: cost-structure-and-capital
  title: Cost Structure, Capital Adequacy, and Runway Read-Through
  body: |
    Neo4j looks structurally like a software business, but not a frictionless one. Managed cloud hosting, backup and recovery infrastructure, enterprise support, customer success, security reviews, and solution-engineering labor all likely sit inside the service-delivery cost base. Review evidence around backup complexity and large-scale operations reinforces that implementation and support can be material in demanding deployments. On capital adequacy, the clearest message from 2024 is reassuring but incomplete. Management said the company was on track to become cash-flow positive in coming quarters and simultaneously raised $50 million from Noteus Partners while insisting the business did not need the money to operate. That reads more like balance-sheet fortification and IPO option preservation than distress finance. Still, no public cash balance, burn figure, or debt disclosure was found, so precise runway remains unavailable.
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI018
  - CI019
  - CI020
  - CI021
