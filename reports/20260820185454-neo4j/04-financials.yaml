  - FI004
- id: financial-verdict
  title: Financial Verdict and Underwriting Limits
  body: |
    Financially, Neo4j appears stronger than many private infrastructure companies at the same stage because it has credible ARR scale, a recurring cloud narrative, and a financing event that looked additive rather than defensive. That is the favorable part of the story. The limiting part is that nearly every metric a public-market or crossover investor would want to stress-test remains private: mix, margins, net retention, expansion rates, sales efficiency, customer concentration, and cash balance. As a result, public evidence supports a view of Neo4j as a high-quality late-stage infrastructure asset, but not a fully underwritable one. Valuation should therefore reward scale and category position, yet still discount for disclosure thinness. Any aggressive multiple assumption without direct management data would be relying too much on narrative and too little on operating proof today publicly.
  claimRefs:
  - CI027
  - CI028
  - CI029
  - CI033
  - CI035
  - CI036
