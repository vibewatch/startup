  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观：AI 模块转化良好，云收入结构改善，毛利率证明溢价
        - 借助更高 ARR 和 12x-15x 倍数逻辑，落在 $2.6B-$3.0B+ 区间
        - AI 热度无法变现、安全事件、执行复杂度
        - 有可能，但需要更多证明
      - - 基准：基础设施稳健增长，核心平台强，披露适度改善
        - 接近当前 $2.0B 语境；更多指标出现前，重估空间有限
        - 收入结构 / 毛利率仍不透明，上行被不确定性封顶
        - 从现有证据看最站得住
      - - 悲观：增长质量令人失望，风险事件发生，或融资窗口期披露仍薄
        - 基于公开 ARR 下限，用 6x-9x 倍数逻辑落在 $1.2B-$1.8B 区间
        - 客户集中度或安全事件加剧
        - 足够真实，必须守住纪律
