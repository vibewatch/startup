      - number: '5.4'
        title: 信任、安全、依赖与最终结论
        blocks:
          - type: paragraph
            body: >
              对一家私有基础设施公司而言，Neo4j
              的信任姿态相对强，因为它公开记录了加密、备份、私有网络、密钥管理、角色控制，以及与企业买方相关的多项合规框架。状态页和安全公告页也显示，这是一家运营上严肃的公司，会披露问题，而不是掩盖问题。话虽如此，透明并不等于免疫。安全公告和
              CVE 证明，平台仍需要主动补丁和治理。另一个重要依赖是生态对齐：云伙伴、实施伙伴和开发者工具都是产品故事的一部分，并非外围附属。总体看，产品和技术论证有说服力。Neo4j
              的核心技术成熟，边缘战略跟得上时代；主要尽调问题集中在更新的 AI 包装，以及部分性能声称背后的具体内部机制。换句话说，产品风险更多在前沿能力的证明深度，而不是公司是否仍有真实技术重心。
