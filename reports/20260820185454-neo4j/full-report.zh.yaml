  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序概览
        blocks:
          - type: paragraph
            body: >
              Neo4j
              的风险画像最好理解为一家可信后期基础设施平台的风险组合，而不是脆弱投机公司的风险组合。最高置信度风险不是市场不相关或缺少客户证明，而是软件安全暴露、关键财务和客户指标披露偏薄、大规模运营复杂度，以及公司 AI
              叙事可能跑在最新产品证明基础前面。这些风险重要，因为它们会很快传导到企业信任、续约信心和估值压缩。与此同时，Neo4j
              展示出比许多私有同行更强的公开运营成熟度：有记录的信任控制、状态界面、发布说明、安全公告和具体客户引用。这个组合支持“升高但可管理”的排序判断，而不是二元红旗结论。实际含义是，尽调应关注传导机制和监控阈值，而不是简单收集更长的软件公司通用担忧清单。
