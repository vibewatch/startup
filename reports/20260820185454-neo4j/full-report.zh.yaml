      - number: '8.4'
        title: 退出准备度、打破投资逻辑的触发因素与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              退出可选性真实存在，但前提是披露追上叙事。按管理层描述的口径，Neo4j 看起来具备 IPO 可能： 规模可信、客户验证强，估值语境也没有明显拉伸。但具备 IPO 条件不等于 IPO 准备已经闭环。
              公开市场投资者会要求毛利率、留存、客户集中度和现金数据，而这些仍然缺失。私募投资者也同样需要这些指标。 如果答案积极，即使价格不降，建议也可能明显上调；如果答案偏弱，当前估值会显得吸引力低很多。
              观察项很直接：AI 驱动的客户增长未能转化为持久收入，安全或可靠性事件击穿信任， 或定价 / 实施摩擦阻碍扩张。在这些问题得到回答之前，正确姿态是有兴趣但守纪律， 立场建设性，并在当前公开阶段明确保持估值敏感。
