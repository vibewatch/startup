chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与品类定位
        blocks:
          - type: paragraph
            body: >
              理解 Neo4j，最好把它看成把属性图模型商业化的先行者；过去十多年，公司又从单一数据库扩展为图智能平台。当前公开信息在核心身份上相当一致：原型工作可追溯到 2000 年，公司 2007 年在瑞典成立，2011
              年迁址后，总部叙事转向 Silicon Valley。如今，Neo4j 不再只是销售自托管图数据库软件。它打包了多界面产品，覆盖 Neo4j Graph Database、AuraDB
              托管云分层、图分析、向量搜索和面向 AI 的编排。重要性在于，买方越来越少把 Neo4j 评估为小众数据存储，而是把它看成知识图谱、GraphRAG
              和智能体系统的基础设施。第三方信号也支撑这种更宽定位：DB-Engines 仍把 Neo4j 排在图 DBMS 产品第一，openCypher 认可 Neo4j 开发了 Cypher，GitHub
              也确认其开源核心仍有相关性。
