      - number: '8.2'
        title: 融资语境与入场纪律
        blocks:
          - type: paragraph
            body: >
              本轮尽调里最好的单一估值事实也最简单：Neo4j 在 2024 年公开跨过 $200M ARR， 随后以约 $2B 估值融资大约 $50M。也就是说，公开可验证下限下的入场语境约为 10x ARR。
              单独看，10x 不算明显便宜；但这家公司有真实 AI 顺风、又居于基础设施品类前列，这个倍数也不算明显鲁莽。 时间对比让图景更好看。Neo4j 2021 年估值已超过 $2B，因此 2024 年估值语境大致持平，
              但收入基数大了很多。风险确实有所降低，当前兴趣只由 AI 炒作驱动的担忧也随之减轻。 不过，持平不等于便宜。入场纪律仍应锚定披露能支撑的事实，而不能只因为公司比许多后期私有软件公司更扎实就放松。 因此，即便
              ARR 倍数看似合理，也仍需因收入质量证据缺失而打折，而不只是看收入规模。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV017
