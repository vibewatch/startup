        title: 投资逻辑、反向逻辑与建议
        blocks:
          - type: paragraph
            body: >
              Neo4j 这家公司很容易让人看好，但要高置信度定价并不容易。正面逻辑很扎实： 图数据库品类领导地位、真实的企业客户验证、可信的后期规模，以及顺势延展到 AI 时代的产品叙事。
              反面逻辑不是公司没有实质，而是最终投资判断仍过度依赖公司自述和未披露指标。 这种信息不对称会直接影响建议。业务真实到不能轻易忽视，战略位置也足够重要；
              但透明度还不足以支撑在上一轮公开估值语境下直接买入。因此，基于公开证据，合适结论是观察 / 继续研究： 基本面兴趣为正，置信度中等，风险评级偏高，并保持价格敏感；如果核心私有指标能验证叙事，立场会改善。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV028
