        blocks:
          - type: paragraph
            body: >
              公司的公开牵引显示，收入质量方向上不错。Neo4j ARR 超过 $200M，称三年内云需求增长五倍，并持续引用安全、合规和 AI 中的生产关键企业部署。这些都利好经常性收入耐久性。AWS、Azure 和
              Google 的市场存在，可能提高已经信任这些采购路径的买方的转化效率。但本章很快撞上可见度墙。公开材料没有 NRR、GRR、毛利率、CAC
              回本周期，甚至没有清晰的云与自托管订阅产品组合。MongoDB、Snowflake、Elastic 和 Confluent 等上市公司可比对象说明，Neo4j
              迟早会被拿来对照这种披露标准。相较这个门槛，Neo4j
              仍然指标偏少。正确立场因此是：看好收入质量方向，但对经济性精度保持谨慎。实际看，公司远比早期实验性图厂商更接近规模化私有软件平台；但它仍没有公开判断增长是否高效、黏性是否足够、利润率是否增厚所需的指标。
