      - number: '2.3'
        title: 增长驱动、采用触发点与约束
        blocks:
          - type: paragraph
            body: >
              当前证据集中，最强增长驱动是 AI。Neo4j 近期信息持续把图重新包装为 GraphRAG、智能体记忆和可解释 AI 的基础设施。Google Cloud 和 AWS
              的伙伴材料也强化了这一点：图越来越多通过生成式 AI 工作流进入市场，而不只是通过传统主数据或欺诈项目。云分销是第二个驱动。Neo4j
              自身发布稿称，三年内云需求增长五倍；超大规模云厂商渠道也缩短了想要托管选项的团队的采购周期。但同一组证据也显示采用约束。图仍是一类专门工具。评论网站仍提到学习曲线、备份、部署和扩展问题；企业定价往往仍需谈判，而非完全自助；来自超大规模云厂商或相邻平台的集成替代品对部分买方已经足够好。市场在增长，但并不无摩擦；Neo4j
              的品类领导地位不能免除其证明工作负载适配度的责任。
