      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景与可比公司视角
        blocks:
          - type: paragraph
            body: >
              可比公司组有用，但并不完美。MongoDB 是最直观的公开战略参照，因为它显示开发者数据平台在公开市场能长到多大， 尽管它不是原生图数据库纯玩家。Snowflake、Elastic 和 Confluent
              在这里更适合作为披露和倍数参考框架， 而不是本轮尽调的精确估值输出。因此，情景分析必须明示自身边界。乐观情景要求 Neo4j 把 AI
              相关性转化为持久平台收入，并拿到溢价倍数。基准情景假设公司保持基础设施级的稳健增长， 继续维持品类领导地位，但没有狂热重估。悲观情景则假设透明度和执行质量走向反面：
              转化更弱，安全或运营出问题，并在同一收入基数上承受更低倍数。因此，$1.2B-$3.0B 的公开证据区间很宽，但可以成立，$2.0B 接近中点。
