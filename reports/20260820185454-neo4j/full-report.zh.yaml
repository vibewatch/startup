      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >
              Neo4j 的领导层可见度异常集中在 Emil Eifrem 身上，这一点利弊并存。积极的一面是，公司仍有一位创始人
              CEO，能够可信地声称自己参与开创了属性图模型，并长期为品类布道。领导层页面也显示，公司已有较成熟的治理架构：6 名高管、7 名董事和 3 名顾问，其中包括 Patrick Pichette
              等投资方董事。负面一面是，同一组公开证据也指向实质性的关键人物依赖：无论融资、AI 还是 IPO 准备度叙事，Eifrem
              仍是核心战略讲述者。公开治理披露仍低于后期投资人希望看到的水平。公司没有系统公开董事会委员会、投票门槛或二级所有权集中度。这并不说明治理薄弱，但尽调应把公开领导层页面视为商业成熟度证据，而不是机构级透明度的证明。
