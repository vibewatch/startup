      - number: '1.3'
        title: 融资历史、2024 年重新定价与战略里程碑
        blocks:
          - type: paragraph
            body: >
              Neo4j 的资本故事分成两个阶段。第一阶段是典型风投扩张：早期轮次、2018 年 $80M Series E 轮，以及 2021 年由 Eurazeo 领投、估值超过 $2B 的 Series F
              轮。第二阶段更像资产负债表优化，而不是估值头条扩张。2024 年 11 月，公司称 ARR 已超过 $200M，三年内 ARR 翻倍，并新增 $50M 资本，同时再次确认约 $2B
              估值。关键尽调细节在于投资方身份。已审阅公开来源一致指向 Noteus Partners，而非 Nordic Capital，因此该验证事件应被视为一笔 $50M
              成长股权追加融资，但归因仍值得直接确认。经营上，Neo4j 用一系列里程碑支撑更宽的 AI 叙事：2023 年推出向量搜索，2024 年扩展 Aura 组合并披露 ARR 规模，2025 年内部投入 $100M
              发展 GenAI，2026 年达成收购 GraphAware 的协议。
