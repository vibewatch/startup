        title: 牵引信号与披露缺口
        blocks:
          - type: paragraph
            body: >
              最强的牵引信号是真实的，但它们不等于公司已经可以被完整承销。Neo4j 公开声称 84% 的 Fortune 100 和 58% 的 Fortune 500 使用其产品，提到超过 250,000
              名开发者的生态，并能拿出金融、零售、制药、交通和电信等领域的知名部署。2024
              年发布稿还称，三年内云需求增长五倍，公司正接近现金流转正，这暗示收入质量有可信改善。即便如此，公司概况仍在结构上依赖公司自述数据。公开来源没有提供经审计利润率、可靠的 2026
              年员工数，也没有足够颗粒度把里程碑叙事转成完整经营模型。评论网站还通过部署、扩展和备份复杂度提示了有用的风险。正确综合判断既不是追捧，也不是否定：Neo4j
              看起来是品类领先且战略相关的公司，但几个核心尽调问题仍未关闭；在把公开故事当成投资级事实前，必须先解决这些问题。
