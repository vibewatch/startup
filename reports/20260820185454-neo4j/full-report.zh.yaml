        title: 格局：直接同行、既有厂商与替代品
        blocks:
          - type: paragraph
            body: >
              Neo4j 的竞争不能简化为几家图数据库创业公司。这个格局至少有五类玩家。第一类是 TigerGraph、Memgraph 等直接原生图同行。第二类是 JanusGraph 等自托管开源替代品。第三类是
              Oracle，以及程度较低的 MongoDB 等多模型或既有平台；在这些平台里，图只是众多功能之一。第四类是超大规模云厂商托管替代品，尤其是 AWS Neptune。第五类是 PuppyGraph、Arango
              等更新的零 ETL 或 AI 上下文产品；它们主张，买方无需押注经典独立图数据库，也能获得图式推理。重要性在于，买方关心图分类法的程度，往往低于关心能否以可接受成本和运营负担解决关联数据问题。Neo4j
              仍是该品类参照物，但有效竞争场比单一 DB-Engines 排名暗示的更宽。
