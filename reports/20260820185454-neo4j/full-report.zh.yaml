        - 转化明显疲弱，或毛利率受压
        - 下调商业化质量评级
      - - 融资事件临近时披露仍薄
        - IPO 准备继续推进，但毛利率 / 留存透明度仍不足
        - 下一轮融资动作前没有干净披露包
        - 倾向观察 / 继续研究立场
      - - 客户集中度意外
        - 头部客户占比证实显著偏高
        - 单一客户或少数客户贡献过大的 ARR
        - 施加集中度折价并要求保护条款
    notes: 否决标准刻意设计成可监控，而非泛泛而谈；每一项都能快速改变投资确信度。
