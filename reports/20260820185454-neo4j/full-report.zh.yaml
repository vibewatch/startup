              规模、经常性云叙事，以及一笔看起来是增量而非防守性的融资事件。这是故事中有利的一面。限制在于，公开市场或交叉投资人想要压力测试的几乎所有指标仍是私有口径：产品组合、利润率、净留存、扩张率、销售效率、客户集中度和现金余额。因此，公开证据支持把
