      - number: '3.3'
        title: 定价、分销力与切换成本
        blocks:
          - type: paragraph
            body: >
              分销和定价是 Neo4j 领导地位最容易被挑战的地方。一方面，Neo4j
              受益于深厚品类历史、已被熟悉的开发者词汇，以及通过主要超大规模云厂商渠道触达客户的路径。另一方面，这些渠道也放大了强替代品，而且它们更容易贴合买方预算。Neptune 直接公开示例定价，并受益于 AWS
              采购惯性。Memgraph 的公开定价和免费社区入口降低了试用摩擦。相较许多买方联想到 Neo4j 的传统报价驱动企业销售，TigerGraph 也展示了更明确的按用量包装方式。JanusGraph
              等开源替代品再次改变买方账本：表面软件成本降低，但更多负担转给运营方。Cypher 熟悉度确实会在部分工作负载中为 Neo4j
              创造切换摩擦，但专门化也有两面性：当买方想留在既有栈内，或完全避免专用图平台时，切换成本逻辑反而不利于 Neo4j。
