companyProfile:
  summary: >-
    Neo4j 是一家创立于 Malmö 的图数据库公司，2007 年成立，目前在 San Mateo 和 Malmö 运营。公司把属性图模型商业化，并从核心图数据库扩展为更宽的图智能平台，覆盖 AuraDB
    托管云、图分析、原生向量搜索，以及面向智能体 AI 的工具。公开证据显示，公司已有真实企业级牵引，客户深度覆盖安全、合规、工业规划、数据血缘和 AI 工作负载；融资语境也显示，在 ARR 超过 $200M 后，约 $2B
    的估值被再次确认。核心投资判断缺口不是这家公司是否真实，而是私有口径下的利润率、留存、集中度和 AI 转化能否支撑更积极的投资立场。
