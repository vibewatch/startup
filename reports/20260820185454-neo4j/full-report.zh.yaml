        blocks:
          - type: paragraph
            body: >
              Neo4j 的客户证据偏企业级，并由用例驱动。最强的可见分层是安全与合规、数据治理与血缘、工业规划、数字孪生，以及 AI
              知识层部署。这些不是随意或消费级用例。它们由预算实质、且“理解错关系”代价很高的团队拥有。客户集合在地域和行业上也很宽：金融、工业、软件、交通、制药、电信和公共部门案例都出现了。这种广度重要，因为它降低了
              Neo4j 只是单一工作流小众厂商的风险。与此同时，公开故事仍偏定性而非定量。我们能看到 Neo4j
              落在哪里、客户为什么购买，但看不到头部客户标识之下到底有多少账户、合同或付费团队。因此，按品类看分层信心高；按收入组合看只属中等，因为公开证据没有说明哪些垂直行业或买方类型在经济上最重要。
