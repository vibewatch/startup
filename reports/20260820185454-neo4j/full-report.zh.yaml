  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现界面
        blocks:
          - type: paragraph
            body: >
              Neo4j 的变现模型足够看清方向，但不足以搭建完整经营模型。公开界面显示，其收入设计是分层的。AuraDB
              提供托管云订阅路径，含免费和付费的按用量分层。自托管企业软件和支持仍是第二个收入界面，服务于希望保留控制权、混合部署或更深治理约束的组织。服务、解决方案工程、培训和伙伴影响的工作，更像围绕大型企业部署的赋能层，而非主业。这个组合重要，因为它把产品驱动入口和顾问式企业扩张结合在一起，也带来模糊地带。公开定价能说明开发者如何起步，但不能说明大型合同如何打包、折扣和确认收入。最稳妥的结论是，Neo4j
              具备现代基础设施变现设计，但实际价格中相当一部分仍藏在谈判式企业包装背后。用标价建模时，这个区别很重要，因为它既可能掩盖健康的企业价格获取，也可能掩盖为了扩大云采用而必须给出的激进折扣。
