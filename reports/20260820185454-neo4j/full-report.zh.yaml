      - number: '2.4'
        title: 规模测算视角与公开证据边界
        blocks:
          - type: paragraph
            body: >
              抓取来源支持方向性规模测算，但不足以支撑完全可审计的自下而上 TAM。Neo4j 2024 年 11 月发布稿是主要数字锚点，把更宽的 DBMS 机会表述为 $110B，并称图 DBMS 年增长率超过
              32.6%。这些数字有用，但不应被视为中立独立证据，因为底层分析师材料没有被直接抓取进本次报告。更干净的市场思考方式是一座分层金字塔。最上层是宽泛的数据管理和 AI 基础设施相邻机会；下方是 DB-Engines
              和厂商定位中可见的图数据库与分析品类；最窄、可服务的一层，是图今天能给出决定性 ROI
              的关联数据工作流：安全暴露映射、所有权与欺诈分析、数据血缘、数字孪生、供应链决策，以及智能体知识层。这个框架足够用于竞争和估值工作，但报告仍应保留开放问题：公开证据尚未披露精确的品类收入拆分、部署数量或云收入占比。
