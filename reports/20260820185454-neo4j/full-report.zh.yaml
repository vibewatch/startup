        blocks:
          - type: paragraph
            body: >
              AuraDB 是公开界面上最重要的产品成熟度证明。Aura 材料记录了自动升级、备份、API 级运营、基于角色的安全、私有连接、高可用分层，以及最高 99.95% 的 SLA。Neo4j
              也在用产品包装降低历史采用摩擦。Aura Graph Analytics 免去了许多图分析任务的基础设施部署和专门查询要求，更新的 AI 产品则试图为智能体开发者打包图记忆和检索。发布说明支撑了 Neo4j
              在多产品线上持续发版的判断。它们也显示，公司面对正常平台风险：2026 年 7 月发布包含查询失败和依赖漏洞修复。路线图连贯且新，但买方应区分成熟的数据库加 Aura 核心，以及仍处于更早生命周期的 AI
              相邻界面。这个区分很关键，因为它能防止近期智能体 AI 包装相较更老、更充分验证的图、云和分析层被过度加权；后者仍然产生最强产品信心。
