      - number: '2.2'
        title: 买方分层与工作流入口
        blocks:
          - type: paragraph
            body: >
              客户证据指向一个由企业带动、按工作流切入的市场。哪里不理解关系的成本很高，哪里就会出现 Neo4j。Intuit 用知识图谱在巨大规模下推理安全态势和基础设施暴露。Dun & Bradstreet
              把图用于所有权解析和合规工作流，而这些流程在手工方法下极其缓慢。IBM Manta 用 Neo4j 支撑受监管企业数据资产中的血缘、治理和云迁移推理。BASF
              用图优化全球复杂制造网络里的供应链权衡，Transport for London 则用关联数据推理支撑实时数字孪生和事故响应工作流。Klarna 和 Uber 又进一步拓宽了图景：图不再只是数据管理选择，也成为
              AI 和知识层选择。预算负责人随用例变化，但共同买方通常是大型工程、数据、安全或运营团队；这些团队痛点实质，且有能力推动平台采用。
