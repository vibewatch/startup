              展示了另一个高价值生产部署：在连接庞大客户和事件足迹的安全工作流中使用 Neo4j，并描述可在数秒内完成暴露映射。BASF 验证了工业级规划，IBM Manta 验证了产品化数据血缘软件，TfL
