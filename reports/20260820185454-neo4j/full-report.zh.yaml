  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >
              Neo4j
              并不处在一个边界清晰的单一产品市场。最可辩护的核心市场包括图数据库软件、托管图数据库服务、图分析，以及卖给关系复杂度是关键问题的组织的知识层工具。这个范围窄于整个数据库市场，但宽于纯本地部署数据库授权品类。抓取证据支撑这种分层视角。DB-Engines
              仍发布独立的图 DBMS 排名，说明图数据库是被认可的子品类。与此同时，竞争者和相邻产品页面显示，买方也可以用更宽数据库里的集成图功能、湖仓之上的零 ETL
              图引擎，或通用云图服务来解决同一问题的一部分。因此，现状替代品包括关系型数仓、搜索栈、文档系统，以及依赖大量手工 ETL 的知识管理工作流。Neo4j
              的真实市场由数据库分类决定得更少，由关联数据是否处在客户工作流核心决定得更多。
