            body: >
              客户投资判断的主要问题不是采用证明不足，而是披露不足，无法看清谁在经济上最重要。Neo4j 不披露付费客户数、按队列
              ARR、续约率或头部客户集中度。因此，集中度风险无法直接测量。具名引用组合多元，反驳了客户基础显然狭窄的说法，但只能提供部分安慰。通过 AWS、Azure 和 Google
              的渠道与采购路径，也很可能塑造获客和扩张经济性；这意味着部分客户增长可能越来越多由超大规模云厂商生态中介。这可以成为优势，因为它降低摩擦，但也意味着渠道依赖值得关注。最终综合判断是：客户证明正面，扩张可见度中等，集中度精度较弱。这个组合支持对产品市场契合的信心，但还不足以让外部投资人今天公开判断组合式客户经济或续约可预测性。严肃尽调应少问
              Neo4j 有没有真实客户，多问哪些队列续约最好、哪些渠道产出最健康账户，以及 AI 驱动的客户增长到底广泛还是集中。
