      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 价格比叙事听起来更合理
            body: |
              ARR 更高而 2021 年至 2024 年估值大致持平，这是一个低调但重要的风险降低信号。
            calloutType: insight
            claimRefs:
              - CV007
              - CV008
              - CV009
          - type: callout
            title: 披露仍是卡点
            body: |
              阻碍更强建议的最大因素不是产品疑虑，而是缺少能把平台质量转化为估值信心的私有指标。
            calloutType: risk
            claimRefs:
              - CV002
              - CV004
              - CV021
              - CV033
              - CV040
          - type: callout
            title: AI 转向确实带来期权价值
            body: |
              Neo4j 的 AI 相关性可信到足以影响上行情景，前提是它能转化为持久生产收入，而不只是叙事溢价。
            calloutType: strength
            claimRefs:
