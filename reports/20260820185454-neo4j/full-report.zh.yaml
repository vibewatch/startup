        - 若披露毛利率、NRR 和 AI 转化且数据强劲，判断会增强
      - - ARR 更高但估值持平，说明入场纪律优于追动量的私募轮
        - 若 ARR 下限掩盖差的收入结构或低质量增长，判断会削弱
      - - 客户证明广泛，且嵌入关键任务
        - 若头部客户集中度高，或旗舰客户续约脆弱，判断会削弱
      - - 披露薄限制确信度
        - 若有审计式运营指标和队列数据，判断会改善
      - - 安全和运营复杂度带来真实下行折价
        - 若无事故记录更强、支持指标更好，判断会改善
    notes: 本表把投资逻辑变化直接绑定到公司可以披露或证伪的事实。
