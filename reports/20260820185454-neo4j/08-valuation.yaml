- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - AI growth fails to convert into durable production revenue
    - Strong AI story but weak production or renewal evidence
    - Bull and base cases lose premium support
    - Move stance more cautious or demand lower price
  - - Security / reliability events cluster
    - Multiple severe incidents or public customer trust hits
    - Raises risk discount and slows enterprise adoption
    - Cut multiple assumptions and escalate diligence
  - - Pricing / implementation friction blocks expansion
    - Pilots stall or discounting rises materially
    - Reduces land-and-expand and margin confidence
    - Re-rate GTM quality downward
  - - Disclosure remains thin into next financing or IPO step
    - No clean margin/retention/concentration package
    - Track stance cannot upgrade
    - Avoid underwriting as premium-quality asset
  notes: These are the smallest set of thesis-breakers most likely to change price discipline quickly.
