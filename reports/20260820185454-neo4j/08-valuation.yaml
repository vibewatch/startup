chapter:
  number: 8
  title: Valuation
  summary: 'Neo4j merits a constructive but disciplined valuation stance: the business looks category-leading and
    strategically relevant, yet the current ~$2B context is best treated as fair-to-slightly-full until private
    margin, retention, concentration, and AI-conversion metrics prove the upside more conclusively.'
sections:
- id: thesis-and-call
  title: Investment Thesis, Anti-Thesis, and Recommendation
  body: |
    Neo4j is easy to like as a company and harder to price with high conviction. The positive case is strong: category leadership in graph databases, real enterprise customer proof, credible late-stage scale, and a product story that has expanded naturally into the AI era. The negative case is not that the company lacks substance; it is that too much of the final underwriting still depends on company-authored claims and undisclosed metrics. That asymmetry matters for recommendation. The business looks too real to dismiss and too strategically relevant to ignore, but it is not transparent enough to justify a reflexive buy at the last public valuation context. The right call from public evidence is therefore Track / Research More: positive fundamental interest, medium confidence, elevated risk rating, and a price-sensitive stance that improves if core private metrics confirm the narrative.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV028
  - CV031
  - CV032
  - CV035
  - CV036
  - CV040
