- id: valuation-context
  title: Financing Context and Entry Discipline
  body: |
    The best single valuation fact in the run is also the simplest one: Neo4j publicly crossed $200M ARR in 2024 and then raised roughly $50M at around a $2B valuation. That puts the observable entry context near 10x ARR on the public floor. In isolation, 10x is not obviously cheap, but it is also not obviously reckless for a category-leading infrastructure business with real AI tailwinds. What improves the picture is the time comparison. Neo4j was already above $2B in 2021, so the 2024 valuation context is roughly flat against a much larger revenue base. That implies some real de-risking and reduces the fear that current interest is driven only by AI hype. Still, flat does not equal bargain. Entry discipline should remain anchored to what disclosure can support, not just to the comfort that the company is better grounded than many late private software names. That is why even a seemingly reasonable ARR multiple still needs to be haircut for missing proof on quality of revenue, not merely quantity of revenue.
  claimRefs:
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
  - CV017
  - CV019
  - CV034
  - CV036
  tableRefs:
  - TV004
- id: scenarios-and-comps
  title: Bull / Base / Bear Scenarios and Comparable Lens
  body: |
    The comp set is useful but imperfect. MongoDB is the most intuitively helpful public strategic benchmark because it shows how large a developer-data platform can become in public markets, even though it is not a native graph pure-play. Snowflake, Elastic, and Confluent are more valuable here as disclosure and multiple reference frameworks than as exact valuation outputs from the current run. That means scenario work should be explicit about its limits. The bull case requires Neo4j to turn AI relevance into durable platform revenue and earn a premium multiple. The base case assumes steady infrastructure-quality growth with continued category leadership but no euphoric repricing. The bear case assumes the opposite of transparency and execution quality: weaker conversion, security or operational stumbles, and a lower multiple on the same revenue base. A $1.2B-$3.0B public-evidence range is therefore broad but defensible, with $2.0B sitting near the midpoint.
  claimRefs:
  - CV010
