- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Gross margin and cloud mix
    - Margin split by cloud vs self-managed
    - Core driver of software quality and EV/revenue comfort
    - CFO / finance diligence
  - - NRR / GRR and cohorts
    - Formal retention and expansion tables
    - Needed to convert good customer proof into durable economics
    - RevOps / finance diligence
  - - Top-customer concentration
    - Top-10 ARR and renewal calendar
    - Needed for downside and valuation discount sizing
    - Sales / finance diligence
  - - AI module adoption
    - Production adoption and revenue contribution for newest AI offerings
    - Determines whether AI upside deserves premium weighting
    - Product / GTM diligence
  - - Cash and burn
    - Cash balance, cash flow, and runway plan
    - Needed for financing dependency and exit timing
    - CFO diligence
  notes: These asks are the shortest route from a strong narrative to an investable, priceable late-stage opportunity.
