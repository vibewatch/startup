  topStrengths:
    - >-
      Neo4j still appears to be the clear independent category leader in graph databases, with DB-Engines leadership and
      broad enterprise customer proof.
    - >-
      The platform has expanded coherently into managed cloud, graph analytics, vector search, and AI-oriented
      knowledge-layer tooling.
    - >-
      The roughly flat $2B valuation context versus a much larger ARR base since 2021 suggests more disciplined pricing
      than many late private software rounds.
  topRisks:
    - >-
      Gross margin, NRR/GRR, cloud mix, cash, burn, and customer concentration remain undisclosed, capping valuation
      confidence.
    - >-
      Security advisories, 2026 CVEs, and review-site evidence on large-scale operational complexity require a
      meaningful risk discount.
    - >-
      The newest AI surfaces may deserve upside, but production adoption and revenue conversion are less proven than the
      mature core database and Aura business.
  unresolvedGaps:
