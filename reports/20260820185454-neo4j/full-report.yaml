  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct Peers, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >
              Neo4j’s competition cannot be reduced to a handful of graph-database startups. The landscape has at least
              five classes. First are direct native-graph peers such as TigerGraph and Memgraph. Second are self-managed
              open-source alternatives such as JanusGraph. Third are multimodel or incumbent platforms such as Oracle
              and, to a lesser extent, MongoDB, where graph is one feature among many. Fourth are hyperscaler-managed
              substitutes, especially AWS Neptune. Fifth are newer zero-ETL or AI-context products such as PuppyGraph
              and Arango that argue buyers can obtain graph-style reasoning without committing to a classic stand-alone
              graph database. That matters because the buyer often cares less about graph taxonomy than about solving
              connected-data problems with acceptable cost and operational burden. Neo4j remains the reference point in
              the category, but the effective competitive field is broader than a DB-Engines ranking alone suggests.
            claimRefs:
