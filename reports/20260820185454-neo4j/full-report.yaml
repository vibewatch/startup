      - number: '2.2'
        title: Buyer Segments and Workflow Entry Points
        blocks:
          - type: paragraph
            body: >
              The customer evidence points to a market that is enterprise-led and workflow-specific. Neo4j shows up
              where the cost of not understanding relationships is high. Intuit uses a knowledge graph to reason over
              security posture and infrastructure exposure at massive scale. Dun & Bradstreet applies graph to
              ownership-resolution and compliance workflows that are painfully slow under manual methods. IBM Manta uses
              Neo4j to support lineage, governance, and cloud-migration reasoning across regulated enterprise data
              estates. BASF uses graph to optimize supply-chain trade-offs across a globally complex manufacturing
              network, while Transport for London uses connected-data reasoning for real-time digital-twin and
              incident-response workflows. Klarna and Uber then widen the picture further: graph is no longer only a
              data-management choice but also an AI and knowledge-layer choice. The budget owner varies by use case, but
              the common buyer is usually a large engineering, data, security, or operations team with material pain and
              the ability to sponsor platform adoption.
