      - number: '2.3'
        title: Growth Drivers, Adoption Triggers, and Constraints
        blocks:
          - type: paragraph
            body: >
              The strongest growth driver in the current evidence set is AI. Neo4j’s recent messaging consistently
              reframes graph as foundational infrastructure for GraphRAG, agent memory, and explainable AI. Google Cloud
              and AWS partner materials reinforce that graphs are increasingly entering the market through generative-AI
              workflows rather than only through classic master-data or fraud programs. Cloud distribution is a second
              driver. Neo4j’s own release says cloud demand has grown fivefold in three years, and hyperscaler channels
              shorten procurement cycles for teams that want a managed option. Yet the same evidence shows adoption
              constraints. Graph remains a specialized tool. Review sites still surface learning-curve, backup, setup,
              and scaling complaints; enterprise pricing often remains negotiated rather than self-serve; and integrated
              substitutes from hyperscalers or adjacent platforms can be good enough for some buyers. The market is
              growing, but it is not frictionless, and Neo4j’s category leadership does not eliminate the need to prove
              workload fit.
