  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Ranking Overview
        blocks:
          - type: paragraph
            body: >
              Neo4j’s risk profile is best understood as the risk set of a credible late-stage infrastructure platform
              rather than that of a fragile speculative company. The highest-confidence risks are not market irrelevance
              or lack of customer proof. They are software-security exposure, disclosure thinness on key
              financial/customer metrics, operational complexity at scale, and the possibility that the company’s AI
              narrative outruns the proof base for its newest products. Those risks matter because they can transmit
              quickly into enterprise trust, renewal confidence, and valuation compression. At the same time, Neo4j
              shows more public operational maturity than many private peers: documented trust controls, a status
              surface, release notes, advisories, and concrete customer references. That combination supports a ranked
              view of “elevated but manageable” rather than a binary red flag conclusion. The practical implication is
              that diligence should focus on transmission mechanisms and monitoring thresholds, not simply on collecting
              a longer list of generic software-company worries.
