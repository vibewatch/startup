  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Recommendation
        blocks:
          - type: paragraph
            body: >
              Neo4j is easy to like as a company and harder to price with high conviction. The positive case is strong:
              category leadership in graph databases, real enterprise customer proof, credible late-stage scale, and a
              product story that has expanded naturally into the AI era. The negative case is not that the company lacks
              substance; it is that too much of the final underwriting still depends on company-authored claims and
              undisclosed metrics. That asymmetry matters for recommendation. The business looks too real to dismiss and
              too strategically relevant to ignore, but it is not transparent enough to justify a reflexive buy at the
              last public valuation context. The right call from public evidence is therefore Track / Research More:
              positive fundamental interest, medium confidence, elevated risk rating, and a price-sensitive stance that
              improves if core private metrics confirm the narrative.
            claimRefs:
