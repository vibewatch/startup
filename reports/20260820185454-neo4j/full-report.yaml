  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Surfaces
        blocks:
          - type: paragraph
            body: >
              Neo4j’s monetization model is visible enough to understand direction but not detailed enough to build a
              full operating model. The public surfaces show a layered revenue design. AuraDB provides a managed cloud
              subscription path with free and paid consumption-based tiers. Self-managed enterprise software and support
              remain a second revenue surface for organizations that want control, hybrid deployment, or deeper
              governance constraints. Services, solution engineering, training, and partner-influenced work appear as
              enabling layers around larger enterprise deployments rather than as the primary business. This mix matters
              because it combines product-led entry with consultative enterprise expansion. It also creates ambiguity.
              Public pricing clarifies how a developer can start, but not how larger contracts are packaged, discounted,
              or recognized. The safest conclusion is that Neo4j has a modern infrastructure monetization design, but a
              meaningful part of realized pricing still lives behind negotiated enterprise packaging. That distinction
              matters for any model built from list pricing because it can hide both healthy enterprise price capture
              and aggressive discounting needed to expand cloud adoption.
