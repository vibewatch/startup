      - number: '1.2'
        title: Leadership, Governance, and Key-Person Dependence
        blocks:
          - type: paragraph
            body: >
              Leadership visibility is unusually concentrated around Emil Eifrem, and that cuts both ways. On the
              positive side, the company still has a founder-CEO who can credibly claim authorship of the property-graph
              model and a long history of category evangelism. The leadership page also shows a mature governance
              scaffold with six executives, seven board members, and three advisors, including board representation from
              investors such as Patrick Pichette. On the negative side, the same public evidence implies material
              key-person dependence: Eifrem remains the core strategic narrator across funding, AI, and IPO-readiness
              messaging. Public governance disclosure is still thinner than what a late-stage investor would want. There
              is no comprehensive public discussion of board committees, voting thresholds, or secondary ownership
              concentration. That does not make governance weak, but it does mean diligence should treat the public
              leadership page as evidence of commercial maturity rather than proof of institutional-grade transparency.
