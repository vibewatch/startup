        title: Customer Segmentation and Enterprise Profile
        blocks:
          - type: paragraph
            body: >
              Neo4j’s customer evidence is enterprise-heavy and use-case driven. The strongest visible segments are
              security and compliance, data governance and lineage, industrial planning, digital twins, and AI
              knowledge-layer deployments. These are not casual or consumer-grade use cases. They are owned by teams
              with meaningful budgets and a high cost of getting relationships wrong. The customer set is also
              geographically and vertically broad: finance, industrials, software, transport, pharma, telecom, and
              public-sector examples all appear. That breadth matters because it reduces the risk that Neo4j is a
              single-workflow niche vendor. At the same time, the public story remains more qualitative than
              quantitative. We can see where Neo4j lands and why customers buy it, but not the full denominator of how
              many accounts, contracts, or paying teams sit underneath the headline logos. That means segmentation
              confidence is high in category terms but only moderate in revenue-mix terms, because public evidence does
              not say which verticals or buyer types matter most economically.
