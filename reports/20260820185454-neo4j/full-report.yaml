      - number: '7.3'
        title: Operational, Partner, and Customer Dependency Risk
        blocks:
          - type: paragraph
            body: >
              Operationally, the risk is less about whether Neo4j works and more about where it gets hard. Release notes
              and review evidence show that large-scale deployments, backups, restarts, and operational tuning can
              become painful. Managed service transparency and enterprise controls mitigate part of that burden, but not
              all of it. Partner dependence is also material. Neo4j increasingly rides on hyperscaler channels for
              discovery, deployment, and AI positioning, which helps growth but also creates margin and leverage risk.
              Ecosystem expansion, including GraphAware-related breadth, adds another layer of execution dependency.
              Customer concentration is harder to rank because economic disclosure is thin. The named customer set is
              broad and impressive, but public sources do not say which accounts matter most to ARR. That makes
              dependency risk visible in structure, even if not yet measurable in dollars. Investors should therefore
              treat partner leverage and concentration unknowns as real discount variables during underwriting and
              pricing decisions in practice today.
