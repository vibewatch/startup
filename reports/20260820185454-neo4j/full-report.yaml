  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >
              Neo4j does not operate in a neatly bounded single-product market. The most defensible core market includes
              graph database software, managed graph database services, graph analytics, and knowledge-layer tooling
              sold to organizations whose key problem is relational complexity across data. That is narrower than the
              entire database market but broader than a pure on-premise database-license category. The fetched evidence
              supports this layered view. DB-Engines still publishes a distinct graph DBMS ranking, which validates
              graph databases as a recognized subcategory. At the same time, competitor and adjacent-product pages show
              that buyers can also solve pieces of the same problem with integrated graph features in a broader
              database, a zero-ETL graph engine on top of a lakehouse, or a general cloud graph service. That means
              status-quo substitutes include relational warehouses, search stacks, document systems, and manual
              ETL-heavy knowledge-management workflows. Neo4j’s real market is therefore defined less by database
              taxonomy and more by whether connected data is central to the customer’s workflow.
            claimRefs:
