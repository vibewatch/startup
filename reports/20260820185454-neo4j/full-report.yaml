      - number: '5.2'
        title: Architecture, Modules, and Technical Operating Model
        blocks:
          - type: paragraph
            body: >
              The architecture that can be supported from public evidence is layered but not mysterious. At the base is
              Neo4j’s native graph database, with relationship-aware storage and Cypher as the primary query surface. On
              top of that sit managed cloud operations through AuraDB, then analytics, visualization, and AI-oriented
              capabilities such as vector search, GraphRAG integrations, and the newer agentic-AI surfaces. Neo4j also
              emphasizes Infinigraph, parallel query execution, GraphQL and language-driver support, and deployment
              options spanning self-hosted, hybrid, multi-cloud, and fully managed environments. The important caution
              is that public materials describe capability more than low-level mechanism. They are sufficient to map the
              architecture in operating terms, but not to validate every internal performance or isolation detail. That
              is acceptable for diligence so long as the remaining unknowns are recorded rather than imagined. It also
              means the underwriting focus should stay on observable workflow fit, cloud maturity, and release cadence
              rather than pretending public marketing copy equals a full design review.
