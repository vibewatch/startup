      - number: '7.2'
        title: Legal, Regulatory, Privacy, and Security Risk
        blocks:
          - type: paragraph
            body: >
              The clearest legal or regulatory burden comes from privacy, compliance, and software-security obligations.
              Neo4j’s privacy notice is broad in scope and covers its sites, cloud offering, software offering, and
              community interactions. Aura materials referenced elsewhere in the evidence set also imply HIPAA and other
              compliance-sensitive usage, which raises the cost of trust failures. No major public litigation or
              enforcement event was found in the fetched set, but that absence should be treated cautiously rather than
              celebrated. In contrast, software-security risk is concrete. The security-advisories page shows a
              recurring stream of issues, and 2026-specific CVEs demonstrate that exploitable defects affected Neo4j or
              its related surfaces recently. That pattern is normal for complex infrastructure software, yet still
              material because Neo4j sells into security, compliance, and AI-critical environments where patch
              discipline and disclosure speed matter.
            claimRefs:
