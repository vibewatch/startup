      - number: '1.3'
        title: Capital History, 2024 Repricing, and Strategic Milestones
        blocks:
          - type: paragraph
            body: >
              Neo4j’s capital story breaks into two phases. The first was classic venture scaling: early rounds, an $80
              million Series E in 2018, then the 2021 Series F led by Eurazeo at a valuation above $2 billion. The
              second phase is balance-sheet optimization rather than headline expansion. In November 2024 the company
              said it had crossed $200 million ARR, doubled ARR over three years, and added $50 million of new capital
              while reaffirming a roughly $2 billion valuation. The important diligence nuance is investor identity. The
              reviewed public sources consistently point to Noteus Partners rather than Nordic Capital, so the
              qualification event should be treated as a $50 million growth-equity top-up with attribution still worth
              direct confirmation. Operationally, Neo4j has used milestones to support a broadened AI narrative: vector
              search in 2023, Aura portfolio expansion and ARR scale in 2024, a $100 million internal GenAI investment
              in 2025, and a 2026 agreement to acquire GraphAware.
