  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Scope in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >
              Neo4j is no longer just a graph database SKU. The public product surface now spans the core graph
              database, AuraDB managed cloud, graph analytics, vector search, and an expanding AI layer oriented around
              GraphRAG and agentic systems. That breadth matters because customer proof consistently describes
              workflows, not abstract storage. Intuit uses Neo4j for security knowledge mapping, Dun & Bradstreet for
              ownership and compliance intelligence, IBM Manta for lineage, Klarna for AI assistant context, and
              Transport for London for digital-twin operations. In each case Neo4j is being used as a reasoning
              substrate over connected data rather than as a passive record store. The product definition should
              therefore be framed in workflow terms: a graph-intelligence platform for customers whose key business or
              AI process depends on understanding relationships, paths, and context across connected information.
