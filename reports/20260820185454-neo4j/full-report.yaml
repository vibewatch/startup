      - number: '1.4'
        title: Traction Signals Versus Disclosure Gaps
        blocks:
          - type: paragraph
            body: >
              The strongest traction signals are real, but they are not the same as full underwriteability. Neo4j
              publicly claims use by 84% of the Fortune 100 and 58% of the Fortune 500, cites a 250,000-plus developer
              ecosystem, and can point to recognizable deployments across finance, retail, pharma, transport, and
              telecom. The 2024 release also says cloud demand increased fivefold in three years and the business was
              approaching cash-flow positivity, which suggests a credible shift toward better revenue quality. Even so,
              the company overview remains structurally dependent on company-authored data. Public sources do not
              provide audited margins, reliable 2026 headcount, or enough granularity to convert the milestone narrative
              into a full operating model. Review sites add useful caution by highlighting setup, scaling, and backup
              complexity. The right synthesis is therefore neither hype nor dismissal: Neo4j looks category-leading and
              strategically relevant, but several core diligence asks remain open and must be resolved before treating
              the public story as investment-grade fact.
            claimRefs:
              - CO021
              - CO022
              - CO030
              - CO031
              - CO033
              - CO036
