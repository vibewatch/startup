      - number: '6.4'
        title: Expansion, Concentration Risk, and Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              The main customer underwriting problem is not insufficient proof of adoption; it is insufficient
              disclosure about who matters most economically. Neo4j does not publish paid-customer counts, ARR by
              cohort, renewal rates, or top-customer concentration. As a result, concentration risk cannot be measured
              directly. The diverse mix of named references argues against an obviously narrow customer base, but that
              is only partial comfort. Channel and procurement routes through AWS, Azure, and Google also likely shape
              acquisition and expansion economics, which means some customer growth may be increasingly mediated by
              hyperscaler ecosystems. That can be a strength because it lowers friction, but it also means channel
              dependence deserves attention. The final synthesis is favorable on customer proof, moderate on expansion
              visibility, and weak on concentration precision. That mix supports confidence in product-market fit, but
              not yet in portfolio-style customer economics or renewal predictability for outside investors evaluating
              durability and concentration today publicly. A serious diligence process would therefore spend less time
              asking whether Neo4j has real customers and more time asking which cohorts renew best, which channels
              produce the healthiest accounts, and whether AI-led customer growth is broad or concentrated.
