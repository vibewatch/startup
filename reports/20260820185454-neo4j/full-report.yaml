      - number: '8.3'
        title: Bull / Base / Bear Scenarios and Comparable Lens
        blocks:
          - type: paragraph
            body: >
              The comp set is useful but imperfect. MongoDB is the most intuitively helpful public strategic benchmark
              because it shows how large a developer-data platform can become in public markets, even though it is not a
              native graph pure-play. Snowflake, Elastic, and Confluent are more valuable here as disclosure and
              multiple reference frameworks than as exact valuation outputs from the current run. That means scenario
              work should be explicit about its limits. The bull case requires Neo4j to turn AI relevance into durable
              platform revenue and earn a premium multiple. The base case assumes steady infrastructure-quality growth
              with continued category leadership but no euphoric repricing. The bear case assumes the opposite of
              transparency and execution quality: weaker conversion, security or operational stumbles, and a lower
              multiple on the same revenue base. A $1.2B-$3.0B public-evidence range is therefore broad but defensible,
              with $2.0B sitting near the midpoint.
            claimRefs:
