      - number: '3.2'
        title: Capability Breadth and AI-Era Positioning
        blocks:
          - type: paragraph
            body: >
              Neo4j’s strongest product advantage is breadth. Public materials show a platform that spans core graph
              storage, Aura managed cloud, vector search, analytics, ecosystem tooling, and hyperscaler AI integrations.
              That breadth distinguishes Neo4j from JanusGraph’s more assembly-heavy path, from Memgraph’s real-time and
              lighter-weight posture, and from Neptune or Oracle, which are often evaluated through broader platform
              standardization logic. It also matters in AI-era selling. Neo4j’s GraphRAG and agentic-AI narrative is not
              just marketing copy pasted from a single page: the evidence spans Bedrock integration, broader GenAI
              product expansion, and the cloud/analytics story. Even so, AI positioning is no longer uncontested. Arango
              and PuppyGraph are both framing graph as a context or retrieval layer, which narrows the uniqueness of
              Neo4j’s newer pitch. The net result is not that Neo4j lacks differentiation, but that the source of
              differentiation is moving from pure graph-database maturity toward a broader graph-intelligence stack that
              still needs to keep simplifying adoption and proving AI-era production value.
