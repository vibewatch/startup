      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >
              The best way to describe Neo4j’s competitive position is mature leadership with real but permeable
              defenses. The review set consistently praises Neo4j for exactly the kinds of problems that built the
              category: relationship-heavy queries, flexible connected-data modeling, and performance when the workload
              truly is graph-native. Those are not trivial strengths. However, the same reviews surface recurring
              weaknesses around learning curve, scaling at very large sizes, backup complexity, and pricing friction.
              Those complaints create room for integrated alternatives, simpler developers-first entrants, and platform
              bundles. In other words, Neo4j’s moat is not collapsing, but it is being reframed. It is strongest in
              complex enterprise graph programs where product breadth and accumulated know-how matter. It is weaker
              wherever the graph layer can be absorbed by hyperscalers, document platforms, or lakehouse-adjacent graph
              engines. Public evidence is still insufficient for a hard win-rate model, but it is strong enough to
              conclude that Neo4j is a leader defending a category that is being widened and partially commoditized at
              the edges.
            claimRefs:
