      - number: '2.4'
        title: Sizing Lens and Public-Evidence Limits
        blocks:
          - type: paragraph
            body: >
              The fetched sources support directional sizing, not a fully auditable bottom-up TAM. Neo4j’s November 2024
              release is the main numeric anchor and frames the broader DBMS opportunity at $110 billion, with graph
              DBMS growing more than 32.6% annually. Those numbers are useful but should not be treated as neutral
              independent evidence because the underlying analyst materials were not directly fetched into the run. The
              cleaner way to think about the market is as a layered pyramid. At the top sits broad data-management and
              AI-infrastructure adjacency. Beneath that sits the graph database and analytics category visible in
              DB-Engines and vendor positioning. At the narrowest serviceable layer are the connected-data workflows
              where graph offers decisive ROI today: security exposure mapping, ownership and fraud analysis, lineage,
              digital twins, supply-chain decisioning, and agentic knowledge layers. That framing is good enough for
              competitive and valuation work, but the report should preserve the open question that public evidence
              still does not disclose exact category revenue splits, deployment counts, or cloud mix.
