      - number: '8.4'
        title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Exit optionality is real, but it is contingent on disclosure catching up with the narrative. Neo4j looks
              IPO-able in the sense management describes: scale is credible, customer proof is strong, and the valuation
              context is not obviously stretched. But IPO-ready is not the same as IPO-complete. Public investors will
              want the margin, retention, concentration, and cash data that are still missing. Those same metrics are
              the key diligence asks for a private investor too. Positive answers could upgrade the recommendation
              materially even without a lower price; weak answers would make the current valuation look much less
              attractive. The watch items are straightforward: AI-led customer growth that fails to become durable
              revenue, security or reliability events that puncture trust, or pricing/implementation friction that
              blocks expansion. Until those are answered, the correct posture is interested but disciplined,
              constructive, and explicitly valuation-sensitive at this stage today publicly.
            claimRefs:
