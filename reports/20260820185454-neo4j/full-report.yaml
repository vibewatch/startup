      - number: '4.2'
        title: GTM Motion, Revenue Quality, and Unit-Economics Visibility
        blocks:
          - type: paragraph
            body: >
              The company’s public traction suggests solid revenue quality directionally. Neo4j crossed $200 million in
              ARR, said cloud demand increased fivefold over three years, and continues to cite production-critical
              enterprise deployments across security, compliance, and AI. Those are favorable signals for recurring
              revenue durability. Marketplace presence on AWS, Azure, and Google likely improves conversion efficiency
              for buyers that already trust those procurement routes. Yet the chapter still hits a visibility wall
              quickly. There is no public NRR, GRR, gross margin, CAC payback, or even a clean product mix by cloud
              versus self-managed subscription. Public-company comps such as MongoDB, Snowflake, Elastic, and Confluent
              illustrate the disclosure standard Neo4j will eventually be measured against. Relative to that bar, Neo4j
              remains metric-light. The right stance is therefore positive on revenue quality direction but cautious on
              economic precision. In practical terms, the company looks far closer to a scaled private software platform
              than to an early experimental graph vendor, yet it still withholds the metrics needed to judge whether
