companyProfile:
  summary: >-
    Neo4j is a Malmö-founded graph database company established in 2007 and now operating from San Mateo and Malmö. It
    commercialized the property-graph model and has broadened from a core graph database into a wider graph-intelligence
    platform that includes AuraDB managed cloud, graph analytics, native vector search, and agentic-AI-oriented tooling.
    Public evidence shows real enterprise traction, customer depth across security, compliance, industrial planning,
    lineage, and AI workloads, and a financing context that reaffirmed roughly a $2B valuation after surpassing $200M
    ARR. The main underwriting gap is not whether the company is real; it is whether private margins, retention,
    concentration, and AI conversion justify a more aggressive investment stance.
