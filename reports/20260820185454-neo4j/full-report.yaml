      - number: '8.2'
        title: Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >
              The best single valuation fact in the run is also the simplest one: Neo4j publicly crossed $200M ARR in
              2024 and then raised roughly $50M at around a $2B valuation. That puts the observable entry context near
              10x ARR on the public floor. In isolation, 10x is not obviously cheap, but it is also not obviously
              reckless for a category-leading infrastructure business with real AI tailwinds. What improves the picture
              is the time comparison. Neo4j was already above $2B in 2021, so the 2024 valuation context is roughly flat
              against a much larger revenue base. That implies some real de-risking and reduces the fear that current
              interest is driven only by AI hype. Still, flat does not equal bargain. Entry discipline should remain
              anchored to what disclosure can support, not just to the comfort that the company is better grounded than
              many late private software names. That is why even a seemingly reasonable ARR multiple still needs to be
              haircut for missing proof on quality of revenue, not merely quantity of revenue.
            claimRefs:
              - CV005
              - CV006
