      - number: '7.4'
        title: People, Financial-Model Risk, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              People and financial-model risks are the last major bucket. Founder-key-person dependence is still
              meaningful because Emil Eifrem remains central to external strategy narration, financing posture, and
              category identity. Financial-model risk is even more material: public evidence still lacks gross margin,
              burn, cash balance, customer concentration, and formal retention. That forces outside investors to bridge
              too much with narrative. Capital-market timing adds a further layer. Neo4j appears well capitalized enough
              to be patient, but the path to IPO remains optional rather than committed. The most important thesis-break
              signals are therefore monitorable: AI-customer expansion that fails to translate into durable production
              revenue, a cluster of security or service incidents that dents enterprise trust, or evidence that pricing
              and implementation friction block expansion beyond pilots. Those triggers are specific enough to guide
              diligence and board-level monitoring. They also help separate solvable execution issues from
              thesis-breaking evidence, which is important because Neo4j’s risk story is mostly about confidence
              discounts and control requirements rather than about immediate business failure.
