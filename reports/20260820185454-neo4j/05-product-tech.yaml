chapter:
  number: 5
  title: Product & Technology
  summary: Neo4j now presents as a broad graph-intelligence platform with a mature database and managed-cloud core,
    concrete trust controls, and a coherent AI-era roadmap; the main open product question is not whether the core
    stack works, but how deeply the newest agentic-AI surfaces are adopted in production.
sections:
- id: product-scope
  title: Product Scope in Customer Workflow Terms
  body: |
    Neo4j is no longer just a graph database SKU. The public product surface now spans the core graph database, AuraDB managed cloud, graph analytics, vector search, and an expanding AI layer oriented around GraphRAG and agentic systems. That breadth matters because customer proof consistently describes workflows, not abstract storage. Intuit uses Neo4j for security knowledge mapping, Dun & Bradstreet for ownership and compliance intelligence, IBM Manta for lineage, Klarna for AI assistant context, and Transport for London for digital-twin operations. In each case Neo4j is being used as a reasoning substrate over connected data rather than as a passive record store. The product definition should therefore be framed in workflow terms: a graph-intelligence platform for customers whose key business or AI process depends on understanding relationships, paths, and context across connected information.
  claimRefs:
  - CE001
  - CE002
  - CE018
  - CE019
  - CE032
  - CE036
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE002
- id: architecture-and-modules
  title: Architecture, Modules, and Technical Operating Model
  body: |
    The architecture that can be supported from public evidence is layered but not mysterious. At the base is Neo4j’s native graph database, with relationship-aware storage and Cypher as the primary query surface. On top of that sit managed cloud operations through AuraDB, then analytics, visualization, and AI-oriented capabilities such as vector search, GraphRAG integrations, and the newer agentic-AI surfaces. Neo4j also emphasizes Infinigraph, parallel query execution, GraphQL and language-driver support, and deployment options spanning self-hosted, hybrid, multi-cloud, and fully managed environments. The important caution is that public materials describe capability more than low-level mechanism. They are sufficient to map the architecture in operating terms, but not to validate every internal performance or isolation detail. That is acceptable for diligence so long as the remaining unknowns are recorded rather than imagined. It also means the underwriting focus should stay on observable workflow fit, cloud maturity, and release cadence rather than pretending public marketing copy equals a full design review.
  claimRefs:
  - CE003
  - CE004
  - CE005
  - CE006
  - CE008
  - CE011
  - CE012
  - CE015
  - CE016
  - CE031
  - CE032
