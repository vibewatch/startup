  - TE003
  figureRefs:
  - FE001
  - FE003
- id: deployment-reliability-roadmap
  title: Deployment, Reliability, Support, and Roadmap
  body: |
    AuraDB is the most important product-maturity proof on the public surface. Aura materials document automated upgrades, backups, API-level operations, role-based security, private connectivity, high-availability tiers, and SLAs up to 99.95%. Neo4j is also using product packaging to reduce historical adoption friction. Aura Graph Analytics removes infrastructure setup and specialized query requirements for many graph-analytics tasks, while newer AI products aim to package graph memory and retrieval for agent builders. Release notes support the idea that Neo4j ships continuously across multiple products. They also show that the company faces normal platform risk: July 2026 releases included fixes for query failures and dependency vulnerabilities. The roadmap is coherent and current, but buyers should distinguish between the mature database-plus-Aura core and AI-adjacent surfaces that are still earlier in their life cycle. That distinction is crucial because it prevents recent agentic-AI packaging from being over-weighted relative to the older and more heavily validated graph, cloud, and analytics layers that still generate the strongest product confidence.
  claimRefs:
  - CE007
  - CE009
  - CE010
  - CE013
  - CE014
  - CE020
  - CE023
  - CE026
  - CE027
  - CE033
  - CE034
  tableRefs:
  - TE005
  figureRefs:
  - FE004
- id: trust-and-tech-verdict
  title: Trust, Security, Dependencies, and Final Verdict
  body: |
    Neo4j’s trust posture is comparatively strong for a private infrastructure company because it publicly documents encryption, backup, private networking, key management, role controls, and multiple compliance frameworks relevant to enterprise buyers. Status and advisory pages also show an operationally serious company that discloses issues rather than hiding them. That said, transparency is not immunity. Security advisories and CVEs confirm that the platform still requires active patching and governance. The other important dependency is ecosystem alignment: cloud partners, implementation partners, and developer tooling are part of the product story, not peripheral extras. Overall, the product and technology case is persuasive. Neo4j looks technically mature at its core and strategically contemporary at its edges, with the main diligence questions focused on newer AI packaging and the exact internals behind some performance claims. In other words, the product risk is much more about proof depth at the frontier than about whether the company still has a real technical center of gravity.
  claimRefs:
  - CE017
  - CE021
  - CE022
  - CE024
  - CE025
  - CE028
  - CE029
  - CE030
  - CE035
  - CE036
