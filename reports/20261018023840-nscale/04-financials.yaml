company:
  name: "Nscale"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Nscale's public financial story is a race to turn contracted GPU demand into live, margin-positive capacity:
    the company has disclosed huge contracted value and fresh capital, but current revenue remains small versus
    losses, service-delivery cost, and the infrastructure still awaiting financing or energization.
sections:
  - id: "revenue-model-and-traction"
    title: "Revenue model and public traction"
    body: >-
      Public disclosures describe a two-layer monetization model rather than a single wholesale colocation business.
      Nscale Infrastructure is the core product today, selling dedicated GPU clusters and data-center capacity to
      hyperscalers and frontier-model customers under long-duration take-or-pay contracts. Nscale Cloud sits above
      that installed base, with customers charged by GPU-hour and storage billed separately per gigabyte per month.
      That structure can produce good forward visibility if the capacity is actually delivered, but the public record
      still lacks a segment revenue split, realized price per GPU-hour, or evidence that cloud-layer software and
      services are already material contributors versus the infrastructure layer.
      
      The disclosed traction metrics reinforce that distinction between sold demand and live revenue. As of
      2026-08-31, Nscale reported $103.4 billion of active and contracted TCV and 461,000 active or contracted
      GPUs, yet only about $2.6 billion of TCV and roughly 25,000 GPUs were active. H1 2026 revenue of
      $140.6 million is therefore best read as an early conversion point on a much larger booked pipeline rather
      than proof that the full contracted backlog is already producing cash earnings. The underwriting question is
      not whether demand exists, but how quickly financed, energized capacity turns into recognized revenue.
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI014"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "cost-structure-and-unit-economics"
    title: "Cost structure, working capital, and unit-economics limits"
    body: >-
      The public numbers show scale ambition but not yet public evidence of healthy unit economics. BBAE's review of
      Nscale's filing says H1 2026 cost of revenue excluding depreciation and amortization was $189.6 million against
      $140.6 million of revenue, implying negative gross margin on the disclosed base even before depreciation.
      Reported net loss was $1.02 billion for the half, with a $199.2 million adjusted EBITDA loss. Those figures are
      consistent with a company still front-loading GPU purchases, data-center buildout, and delivery costs ahead of
      steady-state utilization.
      
      Cash flow is also easy to misread. Nscale reported approximately $1.69 billion of operating cash flow in
      H1 2026, but the same source attributes that result to customer prepayments on long-term take-or-pay contracts,
      not to operating profitability. At the same time, investing cash outflow reached approximately $3.29 billion,
      while June cash was about $1.48 billion. Public data therefore supports a view of strong customer pre-funding
      and financing access, but not yet a self-funding operating model. There is also no public CAC, payback, sales
      cycle, or channel-economics disclosure, so underwriting GTM efficiency still depends on management diligence
      rather than external evidence.
    claimRefs: ["CI005", "CI006", "CI007", "CI010", "CI015"]
    tableRefs: ["TI003"]
  - id: "capital-adequacy-and-delivery-dependency"
    title: "Capital adequacy and delivery dependency"
    body: >-
      Nscale has clearly been able to raise capital. CNBC and TNW both reported the March 2026 Series C at a
      $14.6 billion valuation, and public coverage also confirms the February 2026 GPU-backed delayed draw term loan.
      Those financings matter because Nscale's model is capital intensive by design: buying GPUs, building or fitting
      out liquid-cooled campuses, and securing power all happen before the company can recognize most of the future
      contract value already signed. TechFundingNews explicitly frames the debt facility as funding capital expenditure
      tied to signed contracts and customer pipeline rather than purely speculative expansion.
      
      The remaining issue is adequacy, not access. BBAE reports that Nscale had not yet secured binding financing
      commitments needed to perform under the Anthropic agreements as of the filing date, while Bricks & Bytes reports
      that the Loughton campus faced grid-delivery delays severe enough to push Nscale toward on-site power options.
      Together those datapoints suggest revenue conversion still depends on additional financing, power delivery, and
      project execution. The historical funding chronology belongs in Company Overview; the financial takeaway here is
      that fresh equity and debt have reduced near-term funding pressure without eliminating delivery-linked financing
      and infrastructure risk.
    claimRefs: ["CI008", "CI009", "CI011", "CI012", "CI013"]
  - id: "financial-verdict-and-diligence-blockers"
    title: "Financial verdict and diligence blockers"
    body: >-
      The public record supports a qualified verdict. Revenue quality could become strong if long-duration take-or-pay
      contracts convert into active capacity at the expected economics, and customer prepayments partially offset the
      working-capital burden of the buildout. But the current disclosed base still shows a company with modest live
      revenue relative to its booked demand, negative publicly inferable gross margin, heavy customer concentration,
      large capital expenditure needs, and material execution dependencies around financing and power.
      
      That leaves several underwriting blockers unresolved. Public sources do not disclose realized price by product,
      mix between infrastructure and cloud revenue, product-level margins, CAC or payback, customer-specific contract
      protections, debt covenants, collateral triggers, or the exact financing package needed to fulfill the Anthropic
      commitments. Until those data are supplied in diligence, the fair reading is that Nscale has demonstrated demand
      capture and fundraising capacity, but not yet enough public evidence to underwrite margin path, runway durability,
      or valuation support with confidence.
    claimRefs: ["CI003", "CI005", "CI007", "CI010", "CI013", "CI015"]
