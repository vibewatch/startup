callouts:
  - calloutType: "risk"
    title: "Headline backlog is far ahead of live economics"
    body: >-
      Public disclosures show a very large contracted book, but only a small portion is active today. Until more
      capacity is energized and revenue-bearing, TCV works better as a demand indicator than as evidence of current
      earnings power.
    claimRefs: ["CI003", "CI004", "CI005"]
  - calloutType: "insight"
    title: "Liquidity is helped by customers and capital markets, not yet by operating self-funding"
    body: >-
      Customer prepayments, fresh equity, and GPU-backed debt have clearly improved Nscale's financing position, but
      public sources still show large investment needs, customer concentration, and unresolved financing requirements
      for at least part of the contracted pipeline.
    claimRefs: ["CI007", "CI008", "CI009", "CI013"]
