evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: unsupported-operating-metrics
    missingEvidence: Audited revenue, run-rate, gross margin, EBITDA, cash, burn, customer count, and headcount.
    whyItMatters: >-
      These metrics are necessary to judge whether the financing pace is matched by durable operating traction and
      valuation support.
    diligencePath: >-
      Request an audited or board-level KPI pack covering 2025, year-to-date 2026, customer concentration, and current
      employee count.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Microsoft contract economics, utilization commitments, pricing, termination rights, and the size of non-Microsoft
      revenue.
    whyItMatters: >-
      Public narratives imply anchor-demand concentration, but not whether those contracts create durable, diversified
      cash flow.
    diligencePath: Request top-customer schedule, signed contract summaries, and pipeline conversion by site.
    relatedQuestionRefs:
      - QO008
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: debt-financing
    missingEvidence: >-
      Facility documents for the delayed-draw term loan and any later project or equipment debt, including covenant,
      collateral, and maturity detail.
    whyItMatters: Debt structure can materially change downside risk even when equity financing looks abundant.
    diligencePath: Obtain loan agreements, lender presentations, and debt schedule reconciled to current borrowings.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: public-leadership-and-stakeholder-lists
    missingEvidence: A complete org chart, full board-committee structure, and cap-table or counterparty schedule.
    whyItMatters: >-
      The chapter can identify the most visible operators and counterparties, but not complete decision rights or
      concentration from public evidence alone.
    diligencePath: >-
      Request cap-table detail, committee charters, and an internal leadership directory tied to operating
      responsibilities.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: bottom-up-sizing
    missingEvidence: Disclosed pricing, committed utilization, and segment-level contract mix by buyer type.
    whyItMatters: >-
      Without unit pricing and utilization, top-down market size cannot be converted into a defensible SAM, SOM, or
      revenue-quality view.
    diligencePath: >-
      Request cohort-level bookings or backlog, utilization, contract term, and pricing waterfall by hyperscaler,
      enterprise, and sovereign segment.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      Independent proof of who signs and funds non-Microsoft deployments, especially in regulated enterprise or
      government accounts.
    whyItMatters: >-
      Budget ownership determines sales-cycle length, procurement friction, and whether the sovereignty narrative
      translates into repeatable adoption.
    diligencePath: >-
      Collect customer references, procurement notices, case studies, and pilot-to-production conversion data outside
      Microsoft-linked deployments.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: conflicting-data
    severity: minor
    topic: market-sizing-methodology
    missingEvidence: >-
      A comparable methodology that normalizes AI infrastructure, GPU cloud, and sovereign deployment estimates onto one
      denominator.
    whyItMatters: >-
      Different category boundaries can inflate headline TAM without clarifying Nscale's monetizable niche or realistic
      market share.
    diligencePath: >-
      Normalize each market source to a common geography, workload, and revenue basis before using the figures in
      valuation work.
    relatedQuestionRefs:
      - QM002
      - QM008
  - type: private-evidence-only
    severity: material
    topic: public-pricing-comparability
    missingEvidence: >-
      Comparable public net pricing, minimum commits, discount structures, and contract terms for hyperscalers,
      specialist GPU clouds, and sovereign regional providers.
    whyItMatters: >-
      Without apples-to-apples public pricing, the chapter can compare packaging logic but cannot underwrite durable
      price advantage or switching cost from list rates alone.
    diligencePath: >-
      Request current price books, sample order forms, and realized discount ranges from Nscale and at least two peer
      providers.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: feature-and-trust-benchmarking
    missingEvidence: >-
      Independent side-by-side benchmarks on uptime, provisioning speed, compliance posture, and orchestration
      capabilities across Nscale and named peer classes.
    whyItMatters: >-
      Public narrative sources show positioning, but they do not establish whether Nscale's integrated stack is
      materially better on buyer-relevant operating metrics.
    diligencePath: >-
      Gather customer references, independent benchmark reports, and product-security documentation for Nscale and at
      least three competitor classes.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized price per GPU-hour, storage attach rates, discounting, and revenue mix between infrastructure and cloud.
    whyItMatters: >-
      Without realized pricing and segment mix, revenue quality and gross-margin path cannot be underwritten from public
      evidence.
    diligencePath: Request customer cohort pricing, segment P&Ls, and contract schedules by workload and site.
    relatedQuestionRefs:
      - QI001
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: gtm-efficiency
    missingEvidence: CAC, sales cycle, payback period, channel terms, and renewal behavior by customer type.
    whyItMatters: >-
      GTM efficiency determines whether cloud-layer revenue can scale profitably beyond a handful of large
      counterparties.
    diligencePath: Request cohort CAC/payback analysis, booked-to-live conversion by customer, and renewal or expansion data.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: financing-obligations
    missingEvidence: >-
      Debt covenants, collateral triggers, repayment schedules, and the committed financing package required to fulfill
      Anthropic-related delivery.
    whyItMatters: >-
      Capital adequacy cannot be judged confidently without knowing when additional financing is mandatory or what
      events could restrict liquidity.
    diligencePath: Obtain loan agreements, covenant packages, and financing-commitment letters tied to major customer contracts.
    relatedQuestionRefs:
      - QI006
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: facility-level-margins
    missingEvidence: Facility-level utilization, power cost, and contribution margin by major campus.
    whyItMatters: Backlog activation alone is not enough if each site remains margin negative after energization.
    diligencePath: Request site-level build schedule, utilization assumptions, power contracts, and contribution-margin bridges.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer-signal or practitioner proxy such as repos, package telemetry, forum activity, documentation
      usage, or engineer talks tied to Nscale's platform.
    whyItMatters: >-
      Without a developer or practitioner signal, the public record cannot separate branded announcements from actual
      product pull among repeat technical users.
    diligencePath: >-
      Ask management for GitHub or package telemetry, public docs traffic, community participation metrics, or named
      practitioner references that show real platform usage.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: security-compliance
    missingEvidence: >-
      Public trust-center materials, uptime disclosures, certifications, audit reports, or incident reporting that
      verify how Nscale's stated security and governance roles operate in production.
    whyItMatters: >-
      Executive ownership is not the same as a verified control framework, and regulated or sovereign buyers will care
      about auditability as much as raw compute supply.
    diligencePath: >-
      Request SOC or ISO materials, security architecture summaries, customer security addenda, and any public or
      customer-facing status/reporting surfaces.
