  evidenceGaps:
    - type: missing-source
      severity: material
      topic: regulatory-proof-gap
      missingEvidence: Primary regulator, permit, litigation, privacy, and security-certification records covering the UK, Norway, EU, and US footprint.
      whyItMatters: Without primary records, legal and compliance risk is being inferred from governance signals rather than verified through external evidence.
      diligencePath: Request the permit and compliance packet, then search jurisdiction-by-jurisdiction planning, sanctions, privacy, and litigation registries for every live site and government-facing contract.
      relatedQuestionRefs: [QR003, QR008]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: counterparty-concentration
      missingEvidence: Executed Microsoft, NVIDIA, ByteDance, OpenAI, and VAST contracts showing take-or-pay volumes, termination rights, exclusivity, and price floors.
      whyItMatters: Concentration cannot be sized correctly until the investment committee can distinguish committed demand from aspirational pipeline and can read the downside protections.
      diligencePath: Request contract summaries and, at minimum, customer-by-customer exposure, term, ramp, termination, and cure provisions for the top counterparties.
      relatedQuestionRefs: [QR002, QR006]
