company:
  name: Nscale
chapter:
  number: 7
  title: Risks
  summary: >-
    Nscale's highest residual risks are execution risks rather than demand risks:
    the flagship Loughton build is power-constrained into the 2030s, while
    reported backlog and deployment exposure appears concentrated around a small
    set of very large counterparties. Governance staffing and board additions are
    visible mitigants, but public evidence on contract terms, financing
    covenants, regulatory posture, and resilience remains materially thinner than
    the company's capex scale and valuation imply.
sections:
  - id: ranked-risk-stack
    title: Ranked risk stack
    body: >-
      The most important risk is not demand creation but delivery under
      infrastructure constraints. Multiple independent reports say the Loughton
      site needs a 90MW connection and now faces an early-to-mid-2030s grid
      timeline, even though Microsoft is already named as anchor tenant and
      Nscale is exploring on-site power workarounds. That makes the flagship UK
      project a live proof point for whether the company can convert capital and
      customer commitments into energized capacity. The second cluster of risk is
      concentration: public reporting ties major deployments and backlog claims
      to Microsoft and a small group of strategic counterparties. The third
      cluster is financing and execution burden, because large equity raises,
      GPU-backed debt, and aggressive expansion targets increase the cost of any
      schedule slip.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR007, CR013]
    figureRefs: [FR001]
  - id: legal-regulatory-and-governance
    title: Legal, regulatory, and governance risk
    body: >-
      The public evidence in this pool shows governance build-out faster than it
      shows independent regulatory verification. Nscale's leadership page names
      a Chief Legal Officer, General Counsel, and CISO, while March 2026
      reporting says the company also added Sheryl Sandberg, Susan Decker, and
      Nick Clegg to the board and folded the Aker-Nscale joint venture into the
      parent to simplify governance. Those are real mitigation signals for a
      business selling sovereign-AI infrastructure across multiple jurisdictions.
      However, the assigned evidence set does not include regulator filings,
      litigation dockets, privacy attestations, or security certifications that
      independently confirm the company's legal, privacy, export-control, or
      incident posture. That leaves legal/regulatory risk only partially cleared
      in public.
    claimRefs: [CR011, CR012, CR014]
    tableRefs: [TR001]
  - id: delivery-and-operational-risk
    title: Delivery and operational risk
    body: >-
      Delivery risk is elevated because the vertically integrated model links
      power, real estate, GPU supply, cloud operations, and customer delivery
      into one chain. Independent reporting says Loughton is funded, consented,
      and customer-backed, but still cannot energize on the original schedule.
      Partner materials add that Nscale is attempting to scale to 300,000 NVIDIA
      Grace Blackwell GPUs globally and relies on external data-layer partners
      inside the offering, so execution risk is not isolated to one site. Sacra
      explicitly calls out both GPU allocation risk and Nordic power dependence,
      which is directionally consistent with the grid-delay story: Nscale's
      bottlenecks are capacity delivery, hardware availability, and resilience
      proof, not lack of market appetite.
    claimRefs: [CR001, CR003, CR009, CR010, CR013, CR014]
    tableRefs: [TR002]
  - id: counterparty-and-capital-structure
    title: Counterparty concentration and capital-structure risk
    body: >-
      Public reporting suggests Nscale is building with concentrated commercial
      exposure and meaningful leverage. TNW and Tech Funding News both report a
      $2 billion Series C that followed a $1.4 billion GPU-backed delayed-draw
      term loan, while TNW and Sacra tie major deployments to Microsoft across
      Texas, Norway, and Portugal. Lower-confidence research notes go further,
      arguing that backlog and pipeline are heavily weighted toward Microsoft,
      NVIDIA, ByteDance, and OpenAI. Even if the precise backlog numbers need
      diligence, the directional risk is clear: a repricing, delay, or
      termination by one or two hyperscale counterparties could hit utilization,
      debt draw assumptions, and equity value simultaneously. Kill criteria
      should therefore focus on contract durability, covenant headroom, and
      energization milestones rather than on topline fundraising headlines.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR012]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk / issue
      - Jurisdiction
      - Public status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - ["Loughton energization and related power approvals", "United Kingdom", "Planning permission and tenant commitment are public, but grid availability has reportedly slipped into the early/mid-2030s.", "High", "Critical", "Nscale is evaluating on-site generation alternatives and has continued governance build-out.", "High", "Verify grid-connection milestones, any behind-the-meter permitting path, and customer remedies if energization slips again."]
      - ["Sovereign-AI, privacy, and public-sector compliance readiness", "UK / EU / US", "Public governance staffing is visible, but the assigned pool did not include primary compliance or certification records.", "Medium", "High", "Chief Legal Officer, General Counsel, and CISO roles are in place; board expanded in March 2026.", "Medium-High", "Request privacy, export-control, sanctions, public-sector, and security-certification packs for each live geography."]
      - ["Norway project governance and related-party oversight", "Norway", "TNW and Tech Funding News say the Aker-Nscale JV was folded into Nscale to simplify governance while Aker stayed on the board.", "Medium", "High", "JV simplification and additional independent directors should reduce coordination friction.", "Medium", "Review shareholder rights, board committee structure, and related-party controls on Norway projects and financing."]
    notes: >-
      Severity ordering reflects public-source evidence only; absent regulator,
      court, or certification records, unverified legal/compliance items remain
      diligence questions rather than cleared risks.
    enumerationScope:
      coverage: partial
      basis: >-
        Enumerated the legal and regulatory exposures explicitly surfaced across
        the assigned official and independent March-October 2026 sources; no
        regulator, court, or certification registry source was allocated to this
        pool.
    claimRefs: [CR001, CR011, CR012, CR014]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - ["Loughton power delivery delay", "High", "Critical", "Early", "High", "On-site generation is only an explored workaround; the assigned evidence does not show a cleared replacement timeline."]
      - ["GPU allocation or platform-transition slippage", "Medium-High", "High", "Early", "High", "Public materials show aggressive Blackwell scale targets but not binding allocation detail or downside buffers."]
      - ["Nordic power and site concentration", "Medium", "High", "Early", "Medium-High", "Public evidence does not quantify redundancy, outage history, or insurance coverage for hydro-powered sites."]
      - ["Security, uptime, and incident proof gap", "Medium", "High", "Developing", "Medium-High", "The pool shows security leadership but no public SLA history, audit attestation, or incident disclosure set."]
    notes: >-
      This register distinguishes disclosed mitigation intent from verified
      operating proof; "mitigation maturity" stays low where public evidence does
      not show tested redundancy, audit history, or delivery against the risk.
    claimRefs: [CR001, CR003, CR009, CR010, CR011, CR013, CR014]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - ["Anchor customer demand", "Microsoft", "Anchor tenant at Loughton and reported deployment partner in Texas, Norway, and Portugal", "High", "Volume deferral, repricing, or termination would weaken utilization and backlog credibility across multiple sites.", "Critical", "Board/governance build-out and multi-region footprint may widen future customer options.", "High"]
      - ["GPU and core platform supply", "NVIDIA and VAST Data", "Strategic investor / GPU supplier and key data-layer partner", "High", "Allocation shortfalls or platform integration issues slow capacity delivery and product performance.", "High", "Vertical integration and partnership depth improve coordination but do not remove supplier dependence.", "High"]
      - ["Capital, project, and governance counterparties", "Aker, debt financiers, and other large investors", "Board influence, Norway project sponsorship, and capex financing", "Medium-High", "Covenant pressure, delayed draws, or governance friction can slow buildout before assets are cash-generative.", "High", "JV simplification and large recent equity raises provide runway but not covenant transparency.", "Medium-High"]
    notes: >-
      Concentration labels are directional because contract economics,
      termination rights, and counterparty-level revenue shares are not public in
      the assigned evidence set.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR009, CR012, CR013]
