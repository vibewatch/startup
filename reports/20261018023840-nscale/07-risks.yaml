        - label: Governance / regulatory proof gap
          values: ["Medium", "High", "Developing", "Medium-High"]
        - label: Security / resilience proof gap
          values: ["Medium", "High", "Developing", "Medium-High"]
    approximationNotes: >-
      Qualitative bins reflect the cited public evidence rather than audited loss
      history, customer-level churn data, or disclosed covenant thresholds.
    claimRefs: [CR001, CR004, CR005, CR010, CR012, CR013, CR014]
callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      Treat the investment case as broken if Loughton still lacks a financed and
      permitted energization path after the next diligence cycle, if Microsoft-
      linked utilization and termination protections cannot be validated in
      contract form, or if debt covenants subordinate equity upside to asset
      pledges before new sites are cash-generative.
    claimRefs: [CR001, CR004, CR005, CR014]
