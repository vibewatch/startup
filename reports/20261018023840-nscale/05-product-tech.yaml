    rows:
      - ["Stand up dedicated training capacity", "Enterprises and labs need committed GPU supply plus data-center readiness", "Nscale Infrastructure sells dedicated clusters and AI data-center capacity", "Public reporting shows 25,000 active GPUs and a much larger contracted base", "Public evidence does not show per-customer acceptance timing or achieved utilization"]
      - ["Run managed training fine-tuning and inference", "Buyers want managed compute instead of building every layer themselves", "Nscale Cloud is described as the managed layer above infrastructure", "Public narratives explicitly include training fine-tuning and inference", "No public pricing page or SLA detail in the assigned evidence"]
      - ["Build sovereign UK AI capacity", "Governments and regulated buyers want UK-hosted compute with major partners attached", "Stargate UK plus the Loughton campus package sovereign compute with OpenAI Microsoft and NVIDIA", "Public package includes named GPU commitments and UK growth-zone positioning", "Sovereign workload availability still depends on site energization and staged buildout"]
      - ["Move data efficiently across global AI regions", "Large-model operators need the storage and data path to keep GPUs saturated", "VAST partnership adds a data layer intended to optimize efficiency and cross-region access", "Partner evidence claims a unified data layer and observability-enabled operations", "Independent validation of sustained performance is not in the retained evidence"]
    notes: "Benefits are stated only where a source gives a concrete operating signal; missing pricing, SLA, and acceptance data remain open diligence asks rather than assumed product facts."
    claimRefs: [CE002, CE004, CE005, CE007, CE008, CE009]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - ["Power and land control", "Secure energizable sites and long-lived campuses", "Grid access owned or controlled sites and behind-the-meter generation capability", "Campus delivery slips if power arrives after contracted compute demand"]
      - ["Data-center campuses", "House liquid-cooled compute and physical operations", "Construction energization and local approvals", "Active footprint is much smaller than the contracted pipeline"]
      - ["GPU and network fabric", "Provide dedicated training and inference capacity", "NVIDIA supply partner economics and site commissioning", "Sold capacity does not help customers until live GPUs are accepted"]
      - ["Data layer", "Keep GPUs fed and data accessible across regions", "VAST AI Operating System and reference architecture integration", "Public proof is partner-authored rather than benchmarked by independent operators"]
      - ["Orchestration and observability", "Schedule workloads and monitor multi-layer infrastructure", "Internal software plus operating-system/process maturity", "Public documentation is thin so operating reliability is still hard to verify"]
      - ["Cloud and inference services", "Capture higher-value managed usage above bare infrastructure", "Product software breadth plus customer support operations", "Public evidence shows the ambition but not feature-level parity with mature hyperscaler tools"]
      - ["Security and governance control plane", "Manage cyber physical and supply-chain exposure", "Dedicated executive ownership and formal operating controls", "No retained evidence for SOC ISO uptime reporting or public trust-center disclosures"]
    notes: "Architecture is reconstructed from retained official, partner, and independent reporting; it shows the operating stack shape, not verified internal implementation detail."
    claimRefs: [CE001, CE005, CE008, CE009, CE010, CE011, CE012, CE013]
figures:
  - id: FE001
    title: Nscale operating stack from power to managed AI services
    type: stack
    summary: >-
      Public evidence describes Nscale as a layered operating stack in which power and
      campus activation support GPU clusters, data/orchestration layers, and managed AI
      services.
    data:
      layers:
        - label: Power and energy
          detail: Capacity creation begins with controlled sites and power availability.
          modules:
            - 1.37 GW active and contracted power capacity
            - 10 GW line of sight across owned or controlled sites
            - Loughton on-site generation pursuit
          outputs:
            - Campus readiness
            - Delivery timetable
        - label: Data-center campuses
          detail: Physical sites are the substrate for sovereign and enterprise AI service.
          items:
            - Glomfjord Norway footprint
            - Loughton campus
            - Stargate UK sites
          outputs:
            - Active and contracted sites
        - label: GPU and network fabric
          detail: Dedicated AI capacity is sold before a large portion is activated.
          modules:
            - 25,000 active GPUs
            - 461,000 active or contracted GPUs
            - 23,040 planned GB300 GPUs at Loughton
          outputs:
            - Training and inference capacity
        - label: Data layer
          detail: Partnered data services are meant to keep utilization high across regions.
          modules:
            - VAST AI Operating System
            - Unified data layer
          outputs:
            - Cross-region data access
            - GPU efficiency
        - label: Orchestration and observability
          detail: Public materials claim software control above the hardware layer.
          modules:
            - Orchestration software
            - Observability tools
          outputs:
            - Workload scheduling
            - Monitoring
        - label: Managed cloud services
          detail: The top layer is the customer-facing service surface.
          items:
            - Managed training
            - Fine-tuning
            - Inference
          outputs:
            - Enterprise AI workloads
            - Developer access
    approximationNotes: "Stack layers are synthesized from retained public descriptions; ordering reflects operating dependence rather than a claimed reference architecture diagram."
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE011, CE015]
callouts:
  - calloutType: insight
    title: Vertical integration is a real product claim, not just branding
    body: >-
      Multiple retained sources describe a stack that spans campuses, GPUs, data, and
      managed services, which is more expansive than a pure GPU broker story.
    claimRefs: [CE001, CE004, CE008, CE009]
  - calloutType: risk
    title: Product readiness still hinges on activation, not demand
    body: >-
      Public demand indicators are strong, but live infrastructure, power delivery, and a
      few anchor customers still determine whether the product can be delivered at the
      scale already contracted.
    claimRefs: [CE005, CE011, CE012, CE013]
