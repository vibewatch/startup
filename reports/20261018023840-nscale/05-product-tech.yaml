company:
  name: Nscale
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Nscale is selling a vertically integrated AI infrastructure stack that spans power,
    data-center campuses, GPU capacity, data/orchestration layers, and managed cloud
    services, but public evidence still shows far more contracted capacity than live
    infrastructure. Microsoft, OpenAI, NVIDIA, and VAST sharpen the product story,
    while the Loughton power delay, concentration in a few anchor customers, and thin
    public proof on security/compliance surfaces or developer pull leave meaningful
    technical diligence open.
sections:
  - id: offer-and-product-lines
    title: Offer and product lines
    body: >-
      In customer workflow terms, Nscale is not pitching a single software feature; it
      is pitching the infrastructure needed to get AI systems from capacity planning into
      live training, fine-tuning, inference, and ongoing operations. Public company and
      investor descriptions consistently frame the offer as vertically integrated, with
      the company spanning land and power decisions, data-center buildout, GPU supply,
      networking, data services, and orchestration. Independent market commentary also
      describes two commercial surfaces rather than one: Nscale Infrastructure for
      dedicated clusters and AI data-center capacity, and Nscale Cloud for managed
      compute and inference services. That framing matters for diligence because it means
      product maturity has to be judged separately across physical capacity, software
      control plane, and service delivery, rather than assuming one finished cloud
      product with homogeneous economics.
    claimRefs: [CE001, CE002, CE004, CE014]
    tableRefs: [TE001, TE002]
  - id: architecture-and-deployment
    title: Architecture and deployment
    body: >-
      The public architecture story is a layered one. At the bottom are powered or
      planned campuses, including Norway capacity and the announced Loughton and
      Stargate UK programs; above that are GPU clusters and high-performance networking;
      above that are data and orchestration layers; and above that sit managed training,
      fine-tuning, and inference services. Public reporting gives the strongest maturity
      signal on scale rather than on deep technical internals: by late August 2026,
      third-party reporting said Nscale had 25,000 active GPUs against 461,000 active or
      contracted GPUs and five active versus 12 contracted sites. That gap suggests the
      operating stack is real, but a substantial portion of the headline platform still
      depends on converting contracted assets into live service. The VAST partnership and
      planned Anyscale acquisition indicate a deliberate move to thicken the software and
      data layer, not just rent raw GPU capacity.
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: trust-controls-and-dependencies
    title: Trust, controls, and dependencies
    body: >-
      The main product risks are not abstract model-performance claims; they are delivery
      dependencies. Public evidence shows Nscale staffing power, infrastructure, product,
      legal, and security leadership roles, including a CISO responsible for cyber,
      physical, and supply-chain security, which is better than a generic startup page
      with no operating ownership. But the retained evidence does not expose the trust
      center, uptime commitments, certifications, or incident reporting needed to verify
      how those controls work in production. The bigger immediate dependency is physical:
      Loughton is publicized as funded, permitted, and Microsoft-anchored, yet outside
      reporting says the grid connection is late enough that Nscale is now pursuing
      on-site generation. Combined with demand concentration in a few anchor customers,
      the result is a product that is strategically differentiated but still execution-
      sensitive at the campus-activation and customer-ramp layer.
    claimRefs: [CE003, CE010, CE011, CE012, CE013]
