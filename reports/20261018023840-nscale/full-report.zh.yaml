  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局的广度比一对一 GPU 比较更重要
        blocks:
          - type: paragraph
            body: >-
              相关竞争者不只是知名新云厂商。证据显示，Nscale 面对超大规模云厂商、专业 GPU
              云、软件驱动的基础设施对手、可移植软件平台，以及把第三方基础设施与开源编排结合起来的自建替代方案。买方可以用多种方式解决同一个问题：购买打包容量、自建全栈，或保持编排可移植而替换底层基础设施。收购
              Anyscale 让 Nscale 在软件驱动的评估中更具可信度，但并未消除重视可移植性或运营控制、而非单一供应商便利性的客户的替代路径。
