companyProfile:
  summary: >-
    Nscale 是一家总部位于伦敦的 AI 基础设施公司，围绕电力、数据中心、GPU 算力、网络和编排软件搭建垂直整合的全栈。公司以主权 AI
    为定位，同时拥有大额战略融资、长期客户合同，以及不断扩大的产品组合，覆盖专用基础设施和托管云服务。
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: 面向训练、微调和推理工作负载的专用 GPU 基础设施、AI 数据中心容量、托管 AI 云服务、存储和编排软件。
  customerFocus: 企业、政府、超大规模云厂商和前沿 AI 实验室。
  businessModel: 长期 take-or-pay 基础设施合同，叠加按 GPU 小时计费的云服务和存储定价。
  stage: Series C
  fundingStatus: 2026 年 3 月完成 Series C，估值 $14.6B；2026 年另有 GPU 抵押债务和可转换融资披露。
  disclosureProfile: private-disclosed
