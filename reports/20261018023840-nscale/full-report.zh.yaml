  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              公开披露描述的是两层变现模式，而不是单一的批发托管业务。Nscale Infrastructure 是当前核心产品，向超大规模云厂商和前沿模型客户销售专用 GPU 集群及数据中心容量，采用长期
              take-or-pay 合同。Nscale Cloud 位于其上，按 GPU 小时向客户收费，存储则按 GB 每月单独计费。如果容量确实交付，这种结构能带来较强的前向可见性；但公开记录仍缺少分部收入拆分、实现的每
              GPU 小时价格，或足以证明云层软件和服务相对基础设施层已成为重要贡献者的证据。

              已披露的牵引力指标进一步区分了已售需求和实际收入。截至 2026-08-31，Nscale 报告活跃及已签约 TCV 为 $103.4B，活跃或已签约 GPU 为 461,000 个；但其中只有约 $2.6B
              TCV 和约 25,000 个 GPU 已经活跃。因此，2026 年上半年 $140.6M 的收入，更适合看作大型已预订 pipeline
              的早期转化点，而不是完整合同积压已产生现金收益的证明。投资判断的关键不是有没有需求，而是融资到位且完成通电的容量能多快转成确认收入。
