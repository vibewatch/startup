      - number: '4.2'
        title: 成本结构、营运资金与单位经济性边界
        blocks:
          - type: paragraph
            body: >-
              公开数字显示了规模野心，却尚未提供健康单位经济性的公开证据。BBAE 对 Nscale 文件的审阅称，2026 年上半年扣除折旧摊销前的收入成本为 $189.6M，而收入为
              $140.6M；所以即使不计折旧，披露基础上的毛利率也为负。上半年净亏损为 $1.02B，调整后 EBITDA 亏损为 $199.2M。这些数字符合公司仍在稳态利用率形成前，提前大量购买
              GPU、建设数据中心并承担交付成本的情况。

              现金流也容易被误读。Nscale 报告 2026 年上半年经营现金流约为 $1.69B，但同一来源将其归因于长期 take-or-pay 合同的客户预付款，而非经营盈利。同时，投资现金流出约为 $3.29B，6
              月现金约为 $1.48B。因此，公开数据支持“客户预付和融资渠道强”的判断，但尚不能支持自我造血的运营模式。没有公开的 CAC、回收期、销售周期或渠道经济性披露，因此 GTM
              效率的投资判断仍依赖管理层尽调，而非外部证据。
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI010
              - CI015
