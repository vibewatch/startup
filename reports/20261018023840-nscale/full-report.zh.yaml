      - number: '1.3'
        title: 融资轨迹、里程碑与当前执行信号
        blocks:
          - type: paragraph
            body: >-
              Nscale 的融资节奏是公开市场支持最清晰的证据。官方和第三方报道均指向 2026 年 3 月由 Aker ASA 与 8090 Industries 领投的 $2.0B Series C，估值
              $14.6B；广泛的银团还包括 Dell、Nokia 和 NVIDIA 等战略投资者。资料显示此前融资也快速阶梯式上升：2023 年 12 月种子轮、2024 年 12 月 Series A、2025 年 9 月
              Series B，以及 2025 年 10 月 Series C 前 SAFE；后续债务之前，已披露股权融资超过 $3.7B。但融资势头并未消除执行风险。审阅报道称，Loughton
              数据中心项目已有规划许可和约定的 90MW 电网接入，可电力无法及时到位，迫使 Nscale
              寻求现场发电，尽管公司已有融资和客户支持。因此，后续章节应把融资实力视为真实优势，但不能据此认定部署时间、利用率或经济性已经去风险。
