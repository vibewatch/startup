  - id: TV002
    title: 多头论点 / 反论点表
    columns:
      - 视角
      - 当前判断
      - 哪些事实会改变判断
    rows:
      - - 多头论点
        - Nscale 已搭建起垂直整合的 AI 基础设施栈，拥有战略投资者、标杆客户和全球扩张计划。
        - 披露确认收入、利用率和客户多元化情况，证明这套基础设施不只是靠标杆项目变现。
      - - 反论点
        - 公开证据最能支撑融资和叙事定位，却不足以支撑单位经济性或现金创造质量。
        - 提供经审计的收入、毛利率、现金消耗和资本开支披露，让投资者检验经营杠杆。
      - - 上调触发条件
        - 经确认的经营指标加上清晰的可转债条款，会让当前的规模故事更值得纳入投资判断。
        - 发布官方文件或投资者材料，说明收入质量、债务 / 抵押品条款和现实可行的通电时间表。
      - - 下调触发条件
        - 进一步延迟、客户集中或结构化融资压力，可能让当前估值成为下一轮下调的前兆。
        - 任何电力交付延期、利用率疲弱或偏向投资者的转换条款证据，都会让结论转向放弃。
    notes: 本表将保留的来源记录转化为投资判断框架，而非评分模型；没有公开的 EV 或收入倍数可由指定证据推导。
