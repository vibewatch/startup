        title: 展示项
        blocks:
          - type: callout
            title: 已披露合同积压远超实际经济性
            body: 公开披露显示合同账面很大，但如今只有很小一部分已活跃。在更多容量通电并产生收入之前，TCV 更像需求指标，而不是当前盈利能力的证据。
