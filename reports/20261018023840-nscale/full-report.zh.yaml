  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议维持跟踪，因为需求和资本获取的证据强于已披露经济性的证据。
    data:
      nodes:
        - label: 战略需求与支持者证据
          note: C 轮和 2026 年可转债融资显示，投资者仍希望获得敞口。
        - label: 全栈平台叙事
          note: 公司和合作伙伴来源都描述了其对电力、数据中心、算力和软件层的控制。
        - label: 规模信号
          note: 项目储备和 TCV 显示出野心，但不代表已实现的收入质量。
        - label: 执行与集中度风险
          note: Loughton 通电和对标杆交易对手的依赖仍会影响估值。
        - label: 价格支撑测试
          note: 指定证据池更能支撑其相关性和融资获取能力，而不是精确的公允价值上调。
        - label: 建议
          note: 在经济性和融资条款披露前，以偏高立场继续跟踪。
      edges:
        - from: Strategic demand and backer proof
          to: Full-stack platform narrative
          relationship: 融资证明了兴趣，但尚未证明经济性。
        - from: Full-stack platform narrative
          to: Scale signals
          relationship: 平台广度支撑扩张主张。
        - from: Scale signals
          to: Execution and concentration risk
          relationship: 更大的项目放大交付和客户结构风险。
        - from: Execution and concentration risk
          to: Price-support test
          relationship: 风险调整后的投资判断需要更多披露。
        - from: Price-support test
          to: Recommendation
          relationship: 没有经营证明，结论仍是跟踪。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV008
      - CV014
