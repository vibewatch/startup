    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与运营模式
        blocks:
          - type: paragraph
            body: >-
              Nscale 将自己定位为全栈 AI 云平台，而不是单纯出租 GPU 的房东。公司当前材料称，其在专用 GPU 基础设施、面向 AI 的数据中心以及专用能源和电力基础设施之上，提供用于推理、Kubernetes
              和 Slurm 的托管云层；独立资料则称公司总部在伦敦、成立于 2024 年。外部证据最有力的阶段标志是 2026 年 3 月的 Series C：这说明 Nscale 已是 Series C
              后的成长公司，而非仍处于试验阶段的基础设施初创企业。公开足迹也不止一个站点：审阅来源将其运营或容量分布在英国、美国、挪威、葡萄牙和冰岛，公司对外叙事覆盖欧洲、北美和亚洲。即便如此，审阅到的公开记录仍未披露经审计收入、收入
              收入运行率、客户数量或员工人数。
