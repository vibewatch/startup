              - CV015
      - number: '8.4'
        title: 关键门槛是披露，不是更多叙事
        blocks:
          - type: paragraph
            body: >-
              下一步尽调不应是另一项品牌建设公告，而应是运营与融资披露。在接受甚至追平 2026 年 3 月估值的明显上调之前，投资者应索取收入或 ARR
              定义、毛利率和利用率披露、票据转换机制、债务和抵押条款、按合同收入与确认收入划分的客户集中度，以及 Loughton
              通电的最新时间表。由于董事会和高管队伍越来越像上市公司，退出准备度在方向上改善；但当前证据池仍缺少 IPO 状态故事的官方申报证据。电力交付延迟、无法超越 marquee
              交易对手实现多元化，或融资条款把过多价值从新股权转给 pre-IPO 可转换票据持有人，都可能破坏论点。
