      - number: '2.3'
        title: 主权需求和超大规模云溢出拉动采用，但电力与验证形成门槛
        blocks:
          - type: paragraph
            body: >-
              公开记录中最有力的采用逻辑，是主权算力需求、超大规模云溢出需求，以及市场转向全栈托管 AI 平台的共同作用。买方若需要本地控制、大规模 GPU 部署，以及减少基础设施与编排整合工作，Nscale
              的定位最有优势。但限制因素不是 headline TAM，而是交付摩擦。独立报道显示，电网通电已成为英国数据中心项目的门槛，Nscale 的 Loughton
              园区已经暴露在这一约束下。同样重要的是，公开证据仍未披露定价、利用率保证或非 Microsoft
              业务组合，无法把战略需求转成自下而上的市场份额论证。因此，采用时间和估值相关性比广泛市场统计所暗示的更依赖具体路径。
