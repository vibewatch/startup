      - number: '4.3'
        title: 资本充足性与交付依赖
        blocks:
          - type: paragraph
            body: >-
              Nscale 显然具备融资能力。CNBC 和 TNW 均报道 2026 年 3 月 Series C 估值 $14.6B，公开报道也确认了 2026 年 2 月的 GPU
              抵押延迟提款定期贷款。这些融资很关键，因为 Nscale 的模式天生资本密集：购买 GPU、建设或改造液冷园区、 확보电力，都发生在公司确认已签合同的大部分未来合同价值之前。TechFundingNews
              明确将该债务工具描述为用于已签合同和客户 pipeline 相关的资本支出，而非纯粹投机扩张。

              剩下的问题是充足性，而非获取渠道。BBAE 报告称，截至文件日期，Nscale 尚未取得履行 Anthropic 协议所需的具有约束力融资承诺；Bricks & Bytes 则报道，Loughton
              园区电网交付延迟严重，迫使 Nscale
              转向现场供电选项。两项信息共同说明，收入转化仍依赖额外融资、电力交付和项目执行。历史融资时间线属于公司概览；本节的财务结论是，新增股权和债务减轻了近期资金压力，却没有消除与交付挂钩的融资和基础设施风险。
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: 财务结论与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个有条件的结论。如果长期 take-or-pay
              合同按预期经济性转成活跃容量，且客户预付款部分抵消建设带来的营运资金负担，收入质量可能很强。但当前披露基础仍显示：相对已预订需求，实际收入不高；可由公开资料推断的毛利率为负；客户集中度高；资本支出需求大；融资和电力带来重大执行依赖。

              多个投资判断阻塞点仍未解决。公开来源未披露按产品划分的实际价格、基础设施与云收入组合、产品级利润率、CAC 或回收期、客户特定合同保护、债务契约、抵押触发条件，或履行 Anthropic
              承诺所需的确切融资方案。在尽调补齐这些数据前，合理结论是：Nscale 已证明需求获取和融资能力，但尚无足够公开证据自信地判断利润率路径、runway 持久性或估值支撑。
            claimRefs:
              - CI003
              - CI005
              - CI007
              - CI010
              - CI013
              - CI015
