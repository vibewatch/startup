  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开披露展示了从签约需求到活跃容量、确认收入，再到当前已披露的负交付经济性的收入桥接。
    data:
      nodes:
        - label: 签约需求
          summary: $103.4bn of active and contracted TCV and 461,000 active or contracted GPUs as of 2026-08-31.
        - label: 活跃容量
          summary: Only about $2.6bn of TCV and roughly 25,000 GPUs were active.
        - label: 客户预付款
          summary: Take-or-pay contracts can generate cash before the related services are recognized as revenue.
        - label: 确认收入
          summary: H1 2026 revenue was $140.6m.
        - label: 服务交付成本
          summary: Cost of revenue excluding depreciation and amortization was $189.6m in H1 2026.
        - label: 当前毛利润门槛
          summary: >-
            Public data implies negative gross margin on the disclosed base until more capacity activates or economics
            improve.
      edges:
        - from: Contracted demand
          to: Active capacity
          label: 融资、建设、通电和验收集群
        - from: Active capacity
          to: Customer prepayments
          label: 长期照付不议承诺
        - from: Active capacity
          to: Recognized revenue
          label: 交付服务随时间确认
        - from: Recognized revenue
          to: Service-delivery cost
          label: 电力、基础设施和支持成本
        - from: Service-delivery cost
          to: Current gross-profit gate
          label: 当前公开成本基数高于收入
    approximationNotes: 这是基于 2026 年公开快照的概念桥接图；不推断未披露的转换率或未来利润率。
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI007
  - id: FE001
    title: Nscale 从电力到托管式 AI 服务的运营栈
    type: stack
    summary: 公开证据将 Nscale 描述为分层运营栈：电力和园区启用支撑 GPU 集群、数据 / 编排层以及托管式 AI 服务。
    data:
      layers:
        - label: 电力与能源
          detail: 容量建设始于受控站点和可用电力。
          modules:
            - 1.37 GW 活跃和签约电力容量
            - 自有或受控站点合计 10 GW 的可见储备
            - Loughton 现场发电计划
          outputs:
            - 园区就绪
            - 交付时间表
        - label: 数据中心园区
          detail: 物理站点是主权云和企业 AI 服务的底座。
          items:
            - Glomfjord 挪威园区
            - Loughton 园区
            - Stargate 英国站点
          outputs:
            - 活跃和签约站点
        - label: GPU 与网络底座
          detail: 大部分专用 AI 容量尚未启用，就已提前售出。
          modules:
            - 25,000 个活跃 GPU
            - 461,000 个活跃或签约 GPU
            - Loughton 计划部署 23,040 个 GB300 GPU
          outputs:
            - 训练和推理容量
        - label: 数据层
          detail: 合作数据服务旨在维持各地区的高利用率。
          modules:
            - VAST AI Operating System
            - 统一数据层
          outputs:
            - 跨区域数据访问
            - GPU 效率
        - label: 编排与可观测性
          detail: 公开材料称，软件层能够控制硬件之上部分。
          modules:
            - 编排软件
            - 可观测性工具
          outputs:
            - 工作负载调度
            - 监控
        - label: 托管式云服务
          detail: 顶层是面向客户的服务界面。
          items:
            - 托管式训练
            - 微调
            - 推理
          outputs:
            - 企业 AI 工作负载
            - 开发者访问
    approximationNotes: 栈层次综合自保留的公开描述；排序反映运营依赖关系，而不是声称存在某张参考架构图。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE011
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，Nscale 通过主权定位、锚定租户承诺和多园区扩张赢得需求，而不是依靠广泛的自助式采用。
    data:
      items:
        - label: 以主权定位获客
          actor: 政府、受监管企业和研究机构
          phase: 市场进入
          touchpoints:
            - 英国主权、安全和私有 AI 定位
            - 聚焦欧洲的数据驻留和控制叙事
          tone: opportunity
        - label: 锚定租户承诺
          actor: Microsoft 和其他超大型买方
          phase: 建设前需求评估
          touchpoints:
            - Loughton 锚定租户叙事
            - Monarch 最多 1.35GW 的意向书
          tone: opportunity
        - label: 园区预订与铺开
          actor: 超大规模和前沿 AI 工作负载
          phase: 容量分配
          touchpoints:
            - 得州 104,000 个 GB300 GPU 计划
            - 葡萄牙 12,600 个 GB300 GPU 计划
          tone: neutral
        - label: 企业平台接入
          actor: 企业 AI 团队
          phase: 服务交付
          touchpoints:
            - 训练、微调和部署模型
            - 托管式数据、网络和编排栈
          tone: neutral
        - label: 生态证明与交叉销售
          actor: 合作伙伴和标杆项目
          phase: 建立标杆
          touchpoints:
            - VAST Data 合作
            - 与 OpenAI 关联的挪威项目
          tone: opportunity
        - label: 带集中度风险的扩张
          actor: 重复出现的锚定客户
          phase: 多园区扩张
          touchpoints:
            - 同一标杆买方出现在多个园区
            - 电网和通电延迟可能拖慢变现
          tone: risk
    approximationNotes: 各阶段是对多个来源所披露客户动作的分析综合，不是来源作者绘制且带有报告转换率的漏斗。
