      - number: '1.2'
        title: 领导层、治理与利益相关者结构
        blocks:
          - type: paragraph
            body: >-
              公司仍由创始人主导：Josh Payne 继续担任 CEO，也是融资和战略的公开代言人。当前领导层页面显示，财务、运营、基础设施、法律、安全和商业岗位已经明显扩充，这部分缓解了创始人集中度风险；毕竟 Nscale
              正在多个司法辖区、多个技术领域推进资本密集型建设。2026 年治理也趋于成熟。Nscale 宣布 Sheryl Sandberg、Susan Decker 和 Nick Clegg 加入董事会；原董事会已有
              Payne、Rael Nurick、Jacob Leschly 和 Aker CEO Oyvind Eriksen。同时，Aker Nscale 合资企业并入 Nscale，Aker
              仍为重要股东。整体看，公司仍围绕创始人运转，但已逐步纳入资深运营者、政策人士和投资人的关系网络。
