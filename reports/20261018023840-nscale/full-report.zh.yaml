              - CV014
              - CV015
      - number: '8.3'
        title: 正确结论是跟踪，不是买入或放弃
        blocks:
          - type: paragraph
            body: >-
              我的基准情景是跟踪，而不是买入或放弃。直接放弃会忽略 Nscale
              多次吸引大额投资人和战略交易对手；买入则需要证据池中的公开记录尚未提供的运营披露。因此，情景分析应使用已观察到的融资估值作为参考点，而不是假装知道干净的 EV / 收入倍数。悲观情景集中于 Loughton
              通电延迟、marquee 项目和交易对手集中，以及可转换票据带来的优先权或稀释悬置。乐观情景要求把 TCV 和旗舰项目转成多元且已披露的收入，同时保持项目交付和融资条款足够清晰，避免新股权为他人的结构化上行买单。
            claimRefs:
