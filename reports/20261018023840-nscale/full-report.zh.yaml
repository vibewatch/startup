      - number: '8.2'
        title: 特许经营故事强于经济性故事
        blocks:
          - type: paragraph
            body: >-
              可投资的部分很直白：Nscale 已搭建垂直整合的 AI 基础设施叙事，从战略和财务支持者处筹得大额资金，并引入主权 AI 和企业 AI
              中重要的交易对手。公司及合作伙伴材料大体一致地描述了对电力、数据中心、算力、存储、网络和编排的控制；VAST 合作则提供第三方证据，说明平台面向跨洲企业工作负载建设。反论点是，故事的证据强于经济性。TCV
              不是收入，旗舰交易对手不等于多元化需求；一旦通电、利用率或客户集中度停滞，估值叙事会迅速减弱。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV010
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
