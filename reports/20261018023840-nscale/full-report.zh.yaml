        low: 更受供应商绑定
        high: 更由买方控制 / 可多云部署
        description: Ordinal scoring from assigned public evidence only.
        scale: ordinal
      points:
        - label: Nscale
          x: 5
          'y': 3
          detail: 拥有电力、数据中心、算力和软件，但捆绑式交付仍会造成一定锁定。
          claimRefs:
            - CP001
            - CP005
            - CP013
        - label: 现有超大规模云厂商
          x: 2
          'y': 2
          detail: 被列为直接挑战者，但指定证据没有保留可比的所有权或可迁移性细节。
          claimRefs:
            - CP004
        - label: 专业 GPU 云
          x: 2
          'y': 3
          detail: 专注算力的替代方案被列为竞争者，但指定证据显示其基础设施栈整合程度较低。
          claimRefs:
