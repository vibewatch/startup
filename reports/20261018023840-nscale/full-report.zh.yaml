  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：什么才算 Nscale 的市场
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Nscale 参与的是比泛称“云”更窄的 AI 基础设施市场。公司材料一贯描述其覆盖能源、数据中心、GPU 算力和软件的垂直整合方案，同时点名 AI
              原生公司、企业和政府为目标客户。由此，Nscale 所处市场应定义为主权或合规敏感型 AI 基础设施、大规模训练和推理容量，以及运行这些容量所需的编排层，而不是广义企业 SaaS、消费级 AI
              应用或普通托管。公开记录能支持按细分市场判断买方角色，却无法判断合同细节，因此市场边界基本成立，但具体预算决策权仍只有部分证据。
