    title: 多头 / 基准 / 空头情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 多头
        - 2026 年的融资组合转化为多元化客户采用，Loughton 按计划解决供电问题，TCV 转化为已披露的高质量收入。
        - 估值有理由高于 2026 年 3 月的私募估值，最终也可能验证其后期公开市场定位。
        - 执行必须追上叙事；集中度和融资条款也必须保持可控。
        - 需要官方收入披露、顺利通电和清晰的转换机制。
      - - 基准
        - Nscale 仍具战略相关性且资金充足，但投资者仍看不到经审计的收入、利润率和票据条款披露。
        - 2026 年 3 月的 $14.6B 估值仍是最后一个透明锚点；之后的价值信号应因不确定性打折。
        - 交付时间、客户结构和可转债持有人经济利益仍未解决。
        - 最符合当前指定证据池。
      - - 空头
        - 电网延迟、标杆交易对手集中，或偏向投资者的转换条款，会拖慢商业化或迫使估值重定价。
        - 在基本面得到验证前，市场先重估执行和融资风险，估值因此跌破最后一个透明的私募锚点。
        - 通电延迟、多元化不足、债务 / 优先权结构不透明。
        - 不利项目进展或显示新股权处于次位的披露会触发该情景。
    notes: 情景锚定已观察到的融资估值和已披露风险，而不是模型 DCF 或公开市场倍数推演，因为指定证据没有披露收入、利润率或现金流。
