companyProfile:
  summary: >-
    Nscale is a London-based AI infrastructure company building a vertically integrated stack across power, data
    centers, GPU compute, networking, and orchestration software. The company pairs a sovereign-AI positioning with
    large strategic financing, long-duration customer contracts, and an expanding product mix that spans dedicated
    infrastructure and managed cloud services.
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: >-
    Dedicated GPU infrastructure, AI data-center capacity, managed AI cloud services, storage, and orchestration
    software for training, fine-tuning, and inference workloads.
  customerFocus: Enterprises, governments, hyperscalers, and frontier AI labs.
  businessModel: Long-term take-or-pay infrastructure contracts supplemented by GPU-hour cloud services and storage pricing.
  stage: Series C
  fundingStatus: >-
    March 2026 Series C at a $14.6B valuation, with additional GPU-backed debt and convertible financing disclosed in
    2026.
  disclosureProfile: private-disclosed
summary:
  headline: >-
    Nscale has assembled one of Europe's most ambitious AI infrastructure platforms, with sovereign AI positioning,
    elite investors, and Microsoft-anchored demand — but the public record still lacks revenue disclosure, the customer
    base is hyperconcentrated, leverage is rising, and UK planning friction keeps the current $14.6B valuation in
    stretched territory.
