      - ["NVIDIA", "Strategic investor and ecosystem dependency", "Appears in the Series C syndicate and underpins the GPU-centered infrastructure thesis.", "Official round disclosure names NVIDIA among investors; public positioning is heavily GPU-centric.", "Test allocation security, pricing terms, and sensitivity to roadmap or supply shocks."]
