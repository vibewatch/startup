company:
  name: "Nscale"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Nscale is a London-based AI infrastructure company founded in 2024 and positioned around a vertically integrated stack spanning cloud software, GPU compute, data-center capacity, and power. Public evidence confirms extraordinary capital formation - most visibly the March 2026 $2.0 billion Series C at a $14.6 billion valuation - plus a broader leadership and board bench, but it still leaves revenue, customer count, and headcount undisclosed while exposing execution risk in UK power delivery.
sections:
  - id: "identity-and-scope"
    title: "Identity, stage, and operating model"
    body: >-
      Nscale presents itself as a full-stack AI cloud platform rather than a narrow GPU landlord. Its own current materials describe a managed cloud layer for inference, Kubernetes, and Slurm on top of dedicated GPU infrastructure, AI-oriented data centers, and dedicated energy and power infrastructure, while independent profiles describe the company as London-based and founded in 2024. The strongest externally corroborated stage marker is the March 2026 Series C, which frames Nscale as a post-Series-C scale-up rather than a still-experimental infrastructure startup. Public footprint evidence also extends beyond one site: reviewed sources place operations or capacity across the UK, US, Norway, Portugal, and Iceland, with company messaging aimed at Europe, North America, and Asia. Even with that scale narrative, the reviewed public record does not disclose audited revenue, revenue run-rate, customer count, or headcount.
    claimRefs: [CO001, CO002, CO003, CO004, CO009, CO013, CO016]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Leadership, governance, and stakeholder structure"
    body: >-
      The company remains founder-led: Josh Payne is still both CEO and the public face of financing and strategy. That concentration is partly offset by a visibly broader operating bench across finance, operations, infrastructure, legal, security, and commercial roles on the current leadership page, which matters because Nscale is executing a capital-intensive buildout across multiple jurisdictions and technical layers. Governance also appears to have matured in 2026. Nscale announced the addition of Sheryl Sandberg, Susan Decker, and Nick Clegg to a board that already included Payne, Rael Nurick, Jacob Leschly, and Aker chief executive Oyvind Eriksen, and it simultaneously folded the Aker Nscale joint venture into Nscale proper while leaving Aker as a major shareholder. The resulting picture is a company still centered on its founder, but increasingly wrapped in heavyweight operator, policy, and investor relationships.
    claimRefs: [CO005, CO006, CO007, CO008, CO014]
    tableRefs: [TO002, TO003]
  - id: "financing-and-milestones"
    title: "Funding trajectory, milestones, and current execution signal"
    body: >-
      Nscale's financing cadence is the clearest public proof of market backing. Official and third-party reporting align on a March 2026 Series C of $2.0 billion at a $14.6 billion valuation led by Aker ASA and 8090 Industries, with a broad syndicate that included strategic names such as Dell, Nokia, and NVIDIA. Profile sources also point to a rapid stair-step before that round: seed financing in December 2023, Series A in December 2024, Series B in September 2025, and a pre-Series-C SAFE in October 2025, taking disclosed equity funding above $3.7 billion before later debt. That momentum does not remove execution risk. Reviewed reporting says the Loughton data-center project had planning permission and an agreed 90MW grid connection, yet power would not arrive in time, forcing Nscale to pursue on-site generation despite funding and customer backing. Later chapters should therefore treat financing strength as real, but not as proof that deployment timing, utilization, or economics are already de-risked.
    claimRefs: [CO009, CO010, CO011, CO012, CO014, CO015, CO016]
    figureRefs: [FO001]
