callouts:
  - calloutType: "insight"
    title: "Capital access is more visible than operating traction"
    body: "The public record is rich on financing chronology, named investors, and board changes, but materially thinner on revenue conversion, customer diversification, and current utilization."
    claimRefs: [CO009, CO010, CO011, CO012, CO016]
  - calloutType: "risk"
    title: "Execution still hinges on non-financial bottlenecks"
    body: "Loughton shows that financing, planning consent, and anchor demand still do not guarantee energization or on-time delivery for AI infrastructure campuses."
    claimRefs: [CO015]
