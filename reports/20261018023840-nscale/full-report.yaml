      - number: '3.3'
        title: Pricing visibility is strongest at the edge of the stack, while switching power sits in enterprise contracts
        blocks:
          - type: paragraph
            body: >-
              Public price transparency is thin across the competitive field, but the assigned evidence does surface one
              useful signal: Nscale has directory-level list pricing for on-demand GPU rental plus spot capacity, while
              its larger private-cloud and project-finance relationships rely on enterprise contracting that is not
              publicly comparable on a net-price basis. That creates two simultaneous truths. First, Nscale can show
              buyers an accessible entry point for experimentation. Second, the most strategic switching costs are not
              the hourly rates; they sit in multi-year infrastructure commitments, anchor-customer relationships, and
              the operational burden of moving workloads after a platform has been integrated.
