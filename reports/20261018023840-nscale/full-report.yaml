      - number: '2.3'
        title: Adoption is pulled by sovereignty and hyperscaler overflow, but gated by power and proof
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption logic in the public record is a combination of sovereign-compute demand,
              hyperscaler overflow demand, and a market shift toward full-stack managed AI platforms. Nscale's
              positioning is strongest where buyers want local control, large GPU deployments, and less integration work
              across infrastructure and orchestration. At the same time, the limiting factor is not headline TAM but
              delivery friction. Independent reporting shows that grid energization has become a gating issue for UK
              data-center projects, and Nscale's Loughton campus is already exposed to that constraint. Just as
              important, public evidence still does not disclose pricing, utilization guarantees, or non-Microsoft
              segment mix well enough to translate strategic demand into a bottom-up market-share thesis. That makes
              adoption timing and valuation relevance far more path-dependent than the broad market statistics imply.
            claimRefs:
              - CM004
