      - number: '3.2'
        title: Differentiation improved, but it is not exclusive
        blocks:
          - type: paragraph
            body: >-
              Nscale's clearest public differentiation is vertical ownership across power, data centers, GPU compute,
              and software, reinforced by partner messaging and by the stated purpose of the Anyscale acquisition. That
              positions Nscale differently from providers that mainly resell capacity or emphasize only one bottleneck
              such as energy, sovereign hosting, or chip availability. Still, the software layer it is adding is not
              closed in the way an application suite would be: Ray remains open source under PyTorch Foundation
              governance, and Anyscale says its customers will remain free to run workloads on other infrastructure. The
              result is a stronger bundle, not a fully captive ecosystem.
