            title: Sovereignty broadens the buyer surface, but proof still centers on anchor deployments
            body: >-
              Public evidence supports a real sovereign-compute tailwind, yet the clearest disclosed demand still comes
              from a small number of very large counterparties rather than a broad base of named enterprise accounts.
