  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public disclosures show a revenue bridge from contracted demand to active capacity, recognized revenue, and
      currently negative disclosed delivery economics.
    data:
      nodes:
        - label: Contracted demand
          summary: $103.4bn of active and contracted TCV and 461,000 active or contracted GPUs as of 2026-08-31.
        - label: Active capacity
          summary: Only about $2.6bn of TCV and roughly 25,000 GPUs were active.
        - label: Customer prepayments
          summary: Take-or-pay contracts can generate cash before the related services are recognized as revenue.
        - label: Recognized revenue
          summary: H1 2026 revenue was $140.6m.
        - label: Service-delivery cost
          summary: Cost of revenue excluding depreciation and amortization was $189.6m in H1 2026.
        - label: Current gross-profit gate
          summary: >-
            Public data implies negative gross margin on the disclosed base until more capacity activates or economics
            improve.
      edges:
        - from: Contracted demand
          to: Active capacity
          label: Finance, build, energize, and accept clusters
        - from: Active capacity
          to: Customer prepayments
          label: Long-term take-or-pay commitments
        - from: Active capacity
          to: Recognized revenue
          label: Delivered services recognized over time
        - from: Recognized revenue
          to: Service-delivery cost
          label: Power, infrastructure, and support costs
        - from: Service-delivery cost
          to: Current gross-profit gate
          label: Current public cost base exceeds revenue
    approximationNotes: >-
      This is a conceptual bridge using public 2026 snapshots; it does not infer undisclosed conversion rates or future
      margins.
