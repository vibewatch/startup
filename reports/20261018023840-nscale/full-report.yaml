  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what counts as Nscale's market
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to Nscale competing in a narrower slice of AI infrastructure than a generic "cloud"
              label suggests. The company's own materials consistently describe a vertically integrated offer spanning
              energy, data centers, GPU compute, and software, while also naming AI natives, enterprises, and
              governments as intended customers. That framing puts Nscale in a market defined by sovereign or
              compliance-sensitive AI infrastructure, large-scale training and inference capacity, and the orchestration
              layer needed to run that capacity, rather than in broad enterprise SaaS, consumer AI applications, or
              ordinary colocation. The public record also suggests that buyer roles are visible at a segment level but
              not at a contract-detail level, so the boundary is supportable while exact budget authority remains only
              partially evidenced.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
              - CM015
      - number: '2.2'
        title: Sizing lenses show a large market, but not a clean public SAM or SOM
        blocks:
          - type: paragraph
            body: >-
              The addressable market is clearly large, but the public evidence does not yield a single, apples-to-apples
              TAM, SAM, and SOM stack for Nscale. Independent sources instead offer several overlapping lenses: global
              GPU cloud forecasts, broader AI infrastructure forecasts, sovereign-cloud growth rates, and infrastructure
              bottlenecks such as European power demand. Those lenses all point in the same direction - strong
              structural growth - but they measure different denominators and cannot be added together or converted
              directly into Nscale's monetizable near-term share. The most concrete demand proof is not a market report
              but the Microsoft-led deployment footprint and Nscale's own disclosed UK and pipeline capacity, which show
              where the company is actually trying to capture share today.
            claimRefs:
              - CM004
              - CM005
