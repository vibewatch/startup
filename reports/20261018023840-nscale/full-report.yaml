      - number: '3.4'
        title: Moat durability depends as much on execution as on positioning
        blocks:
          - type: paragraph
            body: >-
              The main adverse read is that Nscale's moat can widen in slideware before it widens in operations.
              Independent reporting and financing disclosures show real scale, but they also highlight reliance on
              Microsoft-backed deployments, debt-funded buildout, and energization timelines that can delay competitive
              delivery even after sites are funded and consented. That does not erase the strategic value of owning more
              of the stack; it means the moat remains conditional on bringing capacity online on time and diversifying
              beyond a few high-consequence contracts.
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The acquisition moves the battle up the stack
            body: >-
              Nscale is no longer competing only on access to GPUs and power. By adding Anyscale's orchestration layer,
              it is trying to compete for the workflow that decides where AI training, fine-tuning, and inference run.
            calloutType: insight
            claimRefs:
              - CP002
              - CP005
          - type: callout
            title: Portability and site delivery limit moat inflation
            body: >-
              Open-source Ray governance, customers' ability to run Anyscale anywhere, and visible grid-delivery
              friction at Loughton mean Nscale still has to earn stickiness through execution rather than assume it from
              architecture alone.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Public disclosures describe a two-layer monetization model rather than a single wholesale colocation
              business. Nscale Infrastructure is the core product today, selling dedicated GPU clusters and data-center
              capacity to hyperscalers and frontier-model customers under long-duration take-or-pay contracts. Nscale
              Cloud sits above that installed base, with customers charged by GPU-hour and storage billed separately per
              gigabyte per month. That structure can produce good forward visibility if the capacity is actually
              delivered, but the public record still lacks a segment revenue split, realized price per GPU-hour, or
              evidence that cloud-layer software and services are already material contributors versus the
              infrastructure layer.

              The disclosed traction metrics reinforce that distinction between sold demand and live revenue. As of
              2026-08-31, Nscale reported $103.4 billion of active and contracted TCV and 461,000 active or contracted
              GPUs, yet only about $2.6 billion of TCV and roughly 25,000 GPUs were active. H1 2026 revenue of $140.6
              million is therefore best read as an early conversion point on a much larger booked pipeline rather than
              proof that the full contracted backlog is already producing cash earnings. The underwriting question is
              not whether demand exists, but how quickly financed, energized capacity turns into recognized revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
