      - number: '4.2'
        title: Cost structure, working capital, and unit-economics limits
        blocks:
          - type: paragraph
            body: >-
              The public numbers show scale ambition but not yet public evidence of healthy unit economics. BBAE's
              review of Nscale's filing says H1 2026 cost of revenue excluding depreciation and amortization was $189.6
              million against $140.6 million of revenue, implying negative gross margin on the disclosed base even
              before depreciation. Reported net loss was $1.02 billion for the half, with a $199.2 million adjusted
              EBITDA loss. Those figures are consistent with a company still front-loading GPU purchases, data-center
              buildout, and delivery costs ahead of steady-state utilization.

              Cash flow is also easy to misread. Nscale reported approximately $1.69 billion of operating cash flow in
              H1 2026, but the same source attributes that result to customer prepayments on long-term take-or-pay
              contracts, not to operating profitability. At the same time, investing cash outflow reached approximately
              $3.29 billion, while June cash was about $1.48 billion. Public data therefore supports a view of strong
              customer pre-funding and financing access, but not yet a self-funding operating model. There is also no
              public CAC, payback, sales cycle, or channel-economics disclosure, so underwriting GTM efficiency still
              depends on management diligence rather than external evidence.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI010
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI010
              - CI015
      - number: '4.3'
        title: Capital adequacy and delivery dependency
        blocks:
          - type: paragraph
            body: >-
              Nscale has clearly been able to raise capital. CNBC and TNW both reported the March 2026 Series C at a
              $14.6 billion valuation, and public coverage also confirms the February 2026 GPU-backed delayed draw term
              loan. Those financings matter because Nscale's model is capital intensive by design: buying GPUs, building
              or fitting out liquid-cooled campuses, and securing power all happen before the company can recognize most
              of the future contract value already signed. TechFundingNews explicitly frames the debt facility as
              funding capital expenditure tied to signed contracts and customer pipeline rather than purely speculative
              expansion.

              The remaining issue is adequacy, not access. BBAE reports that Nscale had not yet secured binding
              financing commitments needed to perform under the Anthropic agreements as of the filing date, while Bricks
              & Bytes reports that the Loughton campus faced grid-delivery delays severe enough to push Nscale toward
              on-site power options. Together those datapoints suggest revenue conversion still depends on additional
              financing, power delivery, and project execution. The historical funding chronology belongs in Company
              Overview; the financial takeaway here is that fresh equity and debt have reduced near-term funding
              pressure without eliminating delivery-linked financing and infrastructure risk.
            claimRefs:
              - CI008
              - CI009
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public record supports a qualified verdict. Revenue quality could become strong if long-duration
              take-or-pay contracts convert into active capacity at the expected economics, and customer prepayments
              partially offset the working-capital burden of the buildout. But the current disclosed base still shows a
              company with modest live revenue relative to its booked demand, negative publicly inferable gross margin,
              heavy customer concentration, large capital expenditure needs, and material execution dependencies around
              financing and power.

              That leaves several underwriting blockers unresolved. Public sources do not disclose realized price by
              product, mix between infrastructure and cloud revenue, product-level margins, CAC or payback,
              customer-specific contract protections, debt covenants, collateral triggers, or the exact financing
              package needed to fulfill the Anthropic commitments. Until those data are supplied in diligence, the fair
              reading is that Nscale has demonstrated demand capture and fundraising capacity, but not yet enough public
              evidence to underwrite margin path, runway durability, or valuation support with confidence.
            claimRefs:
              - CI003
              - CI005
              - CI007
              - CI010
              - CI013
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Headline backlog is far ahead of live economics
            body: >-
              Public disclosures show a very large contracted book, but only a small portion is active today. Until more
              capacity is energized and revenue-bearing, TCV works better as a demand indicator than as evidence of
              current earnings power.
            calloutType: risk
            claimRefs:
              - CI003
              - CI004
              - CI005
          - type: callout
            title: Liquidity is helped by customers and capital markets, not yet by operating self-funding
            body: >-
              Customer prepayments, fresh equity, and GPU-backed debt have clearly improved Nscale's financing position,
              but public sources still show large investment needs, customer concentration, and unresolved financing
              requirements for at least part of the contracted pipeline.
            calloutType: insight
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Offer and product lines
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, Nscale is not pitching a single software feature; it is pitching the
              infrastructure needed to get AI systems from capacity planning into live training, fine-tuning, inference,
              and ongoing operations. Public company and investor descriptions consistently frame the offer as
              vertically integrated, with the company spanning land and power decisions, data-center buildout, GPU
              supply, networking, data services, and orchestration. Independent market commentary also describes two
              commercial surfaces rather than one: Nscale Infrastructure for dedicated clusters and AI data-center
              capacity, and Nscale Cloud for managed compute and inference services. That framing matters for diligence
              because it means product maturity has to be judged separately across physical capacity, software control
              plane, and service delivery, rather than assuming one finished cloud product with homogeneous economics.
            claimRefs:
