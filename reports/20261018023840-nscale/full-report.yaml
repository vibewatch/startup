      - number: '1.2'
        title: Leadership, governance, and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              The company remains founder-led: Josh Payne is still both CEO and the public face of financing and
              strategy. That concentration is partly offset by a visibly broader operating bench across finance,
              operations, infrastructure, legal, security, and commercial roles on the current leadership page, which
              matters because Nscale is executing a capital-intensive buildout across multiple jurisdictions and
              technical layers. Governance also appears to have matured in 2026. Nscale announced the addition of Sheryl
              Sandberg, Susan Decker, and Nick Clegg to a board that already included Payne, Rael Nurick, Jacob Leschly,
              and Aker chief executive Oyvind Eriksen, and it simultaneously folded the Aker Nscale joint venture into
              Nscale proper while leaving Aker as a major shareholder. The resulting picture is a company still centered
              on its founder, but increasingly wrapped in heavyweight operator, policy, and investor relationships.
