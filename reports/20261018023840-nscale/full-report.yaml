        title: Exhibits
        blocks:
          - type: callout
            title: Vertical integration is a real product claim, not just branding
            body: >-
              Multiple retained sources describe a stack that spans campuses, GPUs, data, and managed services, which is
              more expansive than a pure GPU broker story.
            calloutType: insight
            claimRefs:
