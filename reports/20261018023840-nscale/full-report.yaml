chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and operating model
        blocks:
          - type: paragraph
            body: >-
              Nscale presents itself as a full-stack AI cloud platform rather than a narrow GPU landlord. Its own
              current materials describe a managed cloud layer for inference, Kubernetes, and Slurm on top of dedicated
              GPU infrastructure, AI-oriented data centers, and dedicated energy and power infrastructure, while
              independent profiles describe the company as London-based and founded in 2024. The strongest externally
              corroborated stage marker is the March 2026 Series C, which frames Nscale as a post-Series-C scale-up
              rather than a still-experimental infrastructure startup. Public footprint evidence also extends beyond one
              site: reviewed sources place operations or capacity across the UK, US, Norway, Portugal, and Iceland, with
              company messaging aimed at Europe, North America, and Asia. Even with that scale narrative, the reviewed
              public record does not disclose audited revenue, revenue run-rate, customer count, or headcount.
