      - number: '1.3'
        title: Funding trajectory, milestones, and current execution signal
        blocks:
          - type: paragraph
            body: >-
              Nscale's financing cadence is the clearest public proof of market backing. Official and third-party
              reporting align on a March 2026 Series C of $2.0 billion at a $14.6 billion valuation led by Aker ASA and
              8090 Industries, with a broad syndicate that included strategic names such as Dell, Nokia, and NVIDIA.
              Profile sources also point to a rapid stair-step before that round: seed financing in December 2023,
              Series A in December 2024, Series B in September 2025, and a pre-Series-C SAFE in October 2025, taking
              disclosed equity funding above $3.7 billion before later debt. That momentum does not remove execution
              risk. Reviewed reporting says the Loughton data-center project had planning permission and an agreed 90MW
              grid connection, yet power would not arrive in time, forcing Nscale to pursue on-site generation despite
              funding and customer backing. Later chapters should therefore treat financing strength as real, but not as
              proof that deployment timing, utilization, or economics are already de-risked.
