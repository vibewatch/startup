      - number: '5.2'
        title: Architecture and deployment
        blocks:
          - type: paragraph
            body: >-
              The public architecture story is a layered one. At the bottom are powered or planned campuses, including
              Norway capacity and the announced Loughton and Stargate UK programs; above that are GPU clusters and
              high-performance networking; above that are data and orchestration layers; and above that sit managed
              training, fine-tuning, and inference services. Public reporting gives the strongest maturity signal on
              scale rather than on deep technical internals: by late August 2026, third-party reporting said Nscale had
              25,000 active GPUs against 461,000 active or contracted GPUs and five active versus 12 contracted sites.
              That gap suggests the operating stack is real, but a substantial portion of the headline platform still
              depends on converting contracted assets into live service. The VAST partnership and planned Anyscale
              acquisition indicate a deliberate move to thicken the software and data layer, not just rent raw GPU
              capacity.
