      - number: '5.3'
        title: Trust, controls, and dependencies
        blocks:
          - type: paragraph
            body: >-
              The main product risks are not abstract model-performance claims; they are delivery dependencies. Public
              evidence shows Nscale staffing power, infrastructure, product, legal, and security leadership roles,
              including a CISO responsible for cyber, physical, and supply-chain security, which is better than a
              generic startup page with no operating ownership. But the retained evidence does not expose the trust
              center, uptime commitments, certifications, or incident reporting needed to verify how those controls work
              in production. The bigger immediate dependency is physical: Loughton is publicized as funded, permitted,
              and Microsoft-anchored, yet outside reporting says the grid connection is late enough that Nscale is now
              pursuing on-site generation. Combined with demand concentration in a few anchor customers, the result is a
              product that is strategically differentiated but still execution- sensitive at the campus-activation and
              customer-ramp layer.
            claimRefs:
              - CE003
              - CE010
              - CE011
              - CE012
              - CE013
