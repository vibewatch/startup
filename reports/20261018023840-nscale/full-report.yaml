  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape breadth matters more than one-to-one GPU comparisons
        blocks:
          - type: paragraph
            body: >-
              The relevant competitor set is broader than named neocloud peers. Assigned evidence places Nscale against
              the hyperscalers, specialist GPU clouds, software-led infrastructure rivals, portable software platforms,
              and internal-build substitutes that pair third-party infrastructure with open-source orchestration. That
              breadth matters because buyers can solve the same job in multiple ways: they can buy bundled capacity,
              assemble their own stack, or keep orchestration portable while moving infrastructure underneath it. The
              acquisition of Anyscale makes Nscale more credible in software-led evaluations, but it does not eliminate
              substitute paths for customers that prioritize portability or operational control over one-vendor
              simplicity.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP011
              - CP014
