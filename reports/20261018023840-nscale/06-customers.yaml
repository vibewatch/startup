callouts:
  - calloutType: strength
    title: Marquee demand exists before broad logo density does
    body: >-
      Microsoft-linked campus demand and OpenAI-linked Norway activity give Nscale unusually
      strong early proof that very large AI buyers will engage with the platform, even though
      the public customer roster is still thin.
    claimRefs:
      - CU002
      - CU005
      - CU006
      - CU008
  - calloutType: risk
    title: Concentration and durability remain under-documented
    body: >-
      The same Microsoft relationship underwrites much of the named proof, while public
      sources do not disclose renewal behavior, customer count, contract structure, or live
      utilization; that makes the customer story strategically valuable but still fragile.
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
