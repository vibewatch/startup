    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence suggests Nscale wins demand through sovereignty-led positioning,
      anchor-tenant commitments, and multi-campus expansion rather than broad self-serve adoption.
    data:
      items:
        - label: Sovereignty-led prospecting
          actor: Governments, regulated enterprises, and research institutions
          phase: Market entry
          touchpoints:
            - UK sovereign, secure, and private AI positioning
            - Europe-focused data residency and control narrative
          tone: opportunity
        - label: Anchor tenant commitment
          actor: Microsoft and other very large buyers
          phase: Pre-build demand underwriting
          touchpoints:
            - Loughton anchor-tenant narrative
            - Monarch LOI for up to 1.35GW
          tone: opportunity
        - label: Campus reservation and rollout
          actor: Hyperscale and frontier-AI workloads
          phase: Capacity allocation
          touchpoints:
            - Texas 104,000 GB300 GPU plan
            - Portugal 12,600 GB300 GPU plan
          tone: neutral
        - label: Enterprise platform onboarding
          actor: Enterprise AI teams
          phase: Service delivery
          touchpoints:
            - Training, fine-tuning, and deploying models
            - Managed data, networking, and orchestration stack
          tone: neutral
        - label: Ecosystem proof and cross-sell
          actor: Partners and flagship projects
          phase: Reference building
          touchpoints:
            - VAST Data partnership
            - OpenAI-linked Norway project
          tone: opportunity
        - label: Expansion with concentration risk
          actor: Repeat anchor accounts
          phase: Multi-campus scale-up
          touchpoints:
            - Same marquee buyer appears across multiple campuses
            - Grid and energization delays can slow monetization
          tone: risk
    approximationNotes: >-
      Stages are analytical synthesis of the disclosed customer motion across sources, not a
      source-authored funnel with reported conversion rates.
