company:
  name: Nscale
chapter:
  number: 6
  title: Customers
  summary: >-
    Nscale's customer evidence is strongest where large anchor relationships are attached
    to specific campuses, especially Microsoft-linked deployments in the UK, Texas, and
    West Virginia plus OpenAI-linked project activity in Norway. The public record still
    does not disclose customer count, renewal behavior, utilization, or contract economics,
    so the chapter reads as proof of demand concentration and pipeline momentum rather than
    proof of durable, diversified production adoption.
sections:
  - id: anchor-demand
    title: Anchor demand is real, but the named customer set is narrow
    body: >-
      Nscale's own positioning is broad: it says it serves AI natives, enterprises, and
      governments, and frames sovereignty as a major buying criterion for UK and European
      customers. In practice, the named customer proof in the reviewed sources is much
      narrower. Independent reporting repeatedly ties Nscale's most visible campuses to
      Microsoft demand, while OpenAI appears in project-level infrastructure narratives
      rather than as a fully described recurring customer account. That creates a split
      between target market breadth and evidenced buyer concentration. The company is
      clearly selling a high-touch, multi-campus infrastructure product for large buyers,
      but the public record does not yet show a deep bench of named production references
      across enterprises, governments, and research institutions.
    claimRefs:
      - CU001
      - CU002
      - CU008
      - CU009
      - CU012
    tableRefs:
      - TU001
    figureRefs:
      - FU001
  - id: deployment-proof
    title: Adoption proof is mostly campus commitments and capacity reservations
    body: >-
      The strongest public adoption signals are site-specific commitments, not broad usage
      cohorts. Nscale disclosed a UK facility in Loughton sized for 50MW initially and up
      to 90MW, while independent reporting connected later campuses to Microsoft-backed
      demand in Texas and to a Microsoft letter of intent at Monarch. Datacenter Frontier
      also tied the portfolio to staged GPU and megawatt figures in Portugal and Texas,
      while Data Center Knowledge linked Nscale to OpenAI's Norway project. Those facts
      show demand credibility for very large AI infrastructure buyers, but they are still
      mostly forward-looking indicators of reserved or planned capacity. They do not show
      active utilization, workload retention, or expansion economics once the campuses are
      operational.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU013
    tableRefs:
      - TU002
      - TU003
  - id: durability-gaps
    title: Durability, diversification, and timing remain the key customer unknowns
    body: >-
      The central diligence problem is not whether Nscale can describe demand; it is
      whether that demand is diversified, durable, and monetized on time. One reviewed
      source explicitly says the pitch materials omitted specific customer traction or case
      studies, and none of the retained public sources disclose customer count, NRR, GRR,
      churn, contract terms, or renewal history. That makes the Microsoft-heavy footprint
      a concentration risk rather than a complete go-to-market proof. The adverse wrinkle
      is execution timing: Bricks & Bytes reported that the funded, consented, Microsoft-
      anchored Loughton project still lacks timely power delivery. If campus energization
      slips, Nscale can have marquee customer demand without the near-term revenue ramp or
      referenceable production outcomes investors would usually want from a durability case.
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public proof
      - Revenue / strategic value
      - Gap
    rows:
      - - Hyperscale anchor tenants
        - Microsoft as buyer / offtake anchor; Nscale delivers campus capacity and managed AI infrastructure
        - Reserve multi-campus GPU and power capacity for large-scale AI workloads
        - Named across Loughton, Texas, and Monarch narratives
        - Highest-visibility demand anchor and likely financing catalyst
        - Contract value, utilization commitments, and termination rights are undisclosed
      - - Frontier-model ecosystem projects
        - OpenAI-linked project participation; exact payer structure not disclosed
        - Sovereign AI and high-density training capacity in Norway
        - OpenAI tied to Stargate Norway reporting
        - Validates relevance to flagship AI workloads
        - Direct recurring-customer economics versus project branding are unclear
      - - Enterprise AI builders
        - Enterprises running training, fine-tuning, and inference workloads
        - Production AI infrastructure with compute, data, networking, and orchestration
        - Nscale and VAST describe enterprise-ready multi-region infrastructure
        - Broadens TAM beyond single hyperscale accounts
        - No named enterprise customer roster or case-study outcomes in retained sources
      - - Sovereign / regulated buyers
        - Governments, research institutions, and sovereignty-sensitive organizations
        - Private and sovereign AI capacity within Europe / UK
        - Nscale's UK announcement and about page emphasize sovereignty
        - Supports differentiated regional positioning
        - No named government deployment or procurement record is cited here
    notes: >-
      Mixes disclosed target segments with named customer proof; blank economics indicate
      that public sources prove demand narratives more clearly than realized customer mix.
    claimRefs:
      - CU001
      - CU002
      - CU008
      - CU009
      - CU012
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - UK site capacity
        - 50MW initial, scalable to 90MW; live target Q4 2026
        - "2025-01-13"
        - Nscale UK press release corroborated by Bricks & Bytes
        - High
        - Shows a concrete Microsoft-linked campus with disclosed physical scale
        - No disclosed reserved utilization, pricing, or ramp profile
      - - Loughton GPU capacity
        - Up to 45,000 NVIDIA GB200 GPUs
        - "2025-01-13"
        - Nscale UK press release corroborated by Bricks & Bytes
        - High
        - Indicates customer-facing delivery ambition at very large scale
        - No disclosure on how many GPUs are actually contracted or deployed
      - - Texas Microsoft campus
        - ~104,000 GB300 GPUs at ~240MW initially, scaling to 1.2GW
        - "2026-04-03"
        - Datacenter Frontier
        - Medium
        - Suggests a land-and-expand model around anchor demand
        - No production date, utilization, or revenue disclosure
      - - Monarch Microsoft LOI
        - Up to 1.35GW of AI compute capacity with deliveries from late 2027
        - "2026-04-03"
        - Datacenter Frontier
        - Medium
        - Strong future demand signal for the US energy-campus strategy
        - LOI terms, conversion risk, and phased economics are undisclosed
      - - Portugal deployment
        - 12,600 GB300 GPUs planned at Start Campus in Sines
        - "2026-04-03"
        - Datacenter Frontier
        - Medium
        - Shows multi-region customer footprint beyond a single campus
        - No named end customer beyond the broader Microsoft relationship
      - - Norway flagship project
        - 100,000-GPU Stargate Norway project with 230MW planned initially
        - "2026-03-09"
        - Data Center Knowledge
        - Medium
        - Demonstrates project relevance to frontier-scale AI demand
        - Direct Nscale revenue share, utilization, and renewal path are not disclosed
    notes: >-
      All rows are disclosed capacity or project signals rather than reported active-customer
      counts; missing denominators highlight where adoption proof stops short of revenue-quality proof.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU013
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Microsoft
        - Hyperscale anchor tenant
        - Loughton UK campus with 50MW initial capacity, scale to 90MW
        - Anchored future production site, not demonstrated live usage
        - Provides marquee tenant proof for UK sovereign AI positioning
        - Terms, live utilization, and revenue contribution are undisclosed
      - - Microsoft
        - Multi-region hyperscale account
        - Texas campus (~104,000 GB300 GPUs) plus Monarch LOI up to 1.35GW
        - Capacity reservation / expansion pathway rather than public workload metrics
        - Suggests Nscale can win repeat campus demand from the same buyer
        - Reinforces concentration on a single named customer
      - - OpenAI
        - Frontier-model ecosystem participant
        - Stargate-branded AI center in Norway
        - Project-level infrastructure association
        - Supports credibility with leading AI workloads
        - Public sources do not show whether OpenAI is a direct, recurring Nscale customer
    notes: >-
      Partial sample of named public proofs only; the table records disclosed deployments and
      relationships, not a complete customer list or proof of recurring production usage.
