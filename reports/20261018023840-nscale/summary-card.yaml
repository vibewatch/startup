  topStrengths:
    - Large contracted demand and financing access support a major buildout.
    - Vertical integration across power, data centers, compute, and software is strategically differentiated.
    - Microsoft, NVIDIA, and other blue-chip counterparties validate the platform's relevance.
  topRisks:
    - Execution and energization delays can prevent backlog from converting into live revenue.
    - Customer concentration and opaque contract economics limit underwriting confidence.
    - Leverage and capex intensity remain high relative to disclosed operating metrics.
  unresolvedGaps:
    - >-
      No audited revenue, ARR, margin, EBITDA, cash, or burn disclosure is public, so valuation support remains
      inferential rather than underwritten.
    - >-
      Microsoft contract terms, utilization guarantees, termination rights, and pricing structure are not public,
      preventing precise sizing of customer concentration and revenue quality.
    - >-
      Debt covenants, collateral triggers, and repayment schedules for the $1.4B DDTL and $790M Norway financing are
      undisclosed.
    - >-
      The final planning and energization path for Loughton remains unresolved, leaving UK sovereign-AI timing and capex
      assumptions exposed.
    - >-
      Evidence of customer diversification beyond Microsoft, BT, and project-level OpenAI involvement remains thin in
      the public record.
