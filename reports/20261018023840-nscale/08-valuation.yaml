  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: The September 2026 convert's discount, valuation cap, seniority, interest, covenants, collateral, and liquidation or preference treatment.
      whyItMatters: These mechanics determine whether new equity is underwriting attractive upside or inheriting subordination and dilution risk.
      diligencePath: Request the note term sheet, cap-table waterfall, and any side letters covering conversion and liquidation outcomes.
      relatedQuestionRefs:
        - QV004
    - type: missing-source
      severity: material
      topic: operating-metrics
      missingEvidence: Audited revenue, ARR definitions, gross margin, EBITDA, cash burn, capex, and utilization disclosure.
      whyItMatters: Without operating metrics, investors cannot test whether the current mark is supported by fundamentals or only by narrative and contracted-value proxies.
      diligencePath: Request the latest audited financial statements, monthly KPI deck, and any official IPO or financing materials that define revenue and margins.
      relatedQuestionRefs:
        - QV005
        - QV006
    - type: missing-source
      severity: material
