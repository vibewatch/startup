figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays at track because proof of demand and capital
      access is stronger than proof of disclosed economics.
    data:
      nodes:
        - label: Strategic demand and backer proof
          note: "Series C and the 2026 convert show investors still want exposure."
        - label: Full-stack platform narrative
          note: "Company and partner sources both describe control across power, data center, compute, and software layers."
        - label: Scale signals
          note: "Project pipeline and TCV suggest ambition, but not realized revenue quality."
        - label: Execution and concentration risk
          note: "Loughton energization and marquee-counterparty dependence are still valuation-sensitive."
        - label: Price-support test
          note: "The assigned pool supports relevance and funding access more strongly than a precise fair-value step-up."
        - label: Recommendation
          note: "Track with a stretched stance until economics and financing terms are disclosed."
      edges:
        - from: Strategic demand and backer proof
          to: Full-stack platform narrative
          relationship: Funding validates interest, not yet economics.
        - from: Full-stack platform narrative
          to: Scale signals
          relationship: Platform breadth supports expansion claims.
        - from: Scale signals
          to: Execution and concentration risk
          relationship: Bigger projects amplify delivery and customer-mix risk.
        - from: Execution and concentration risk
          to: Price-support test
          relationship: Risk-adjusted underwriting demands more disclosure.
        - from: Price-support test
          to: Recommendation
          relationship: Without operating proof, the call remains track.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV008
