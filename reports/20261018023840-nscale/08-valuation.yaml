  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "The 2026 funding stack translates into diversified customer adoption, Loughton power is solved on schedule, and TCV converts into disclosed high-quality revenue.", "Value can justify a step-up above the March 2026 private mark and eventually validate late-stage public-market positioning.", "Execution must catch up to narrative; concentration and financing terms must remain manageable.", "Would require official revenue disclosure, smooth energization, and clean conversion mechanics."]
      - [Base, "Nscale remains strategically relevant and well funded, but investors still lack audited revenue, margin, and note-term disclosure.", "The March 2026 $14.6B mark remains the last transparent anchor; later value signals deserve a discount for uncertainty.", "Delivery timing, customer mix, and convert-holder economics stay unresolved.", "Best matches the current assigned pool."]
      - [Bear, "Grid delays, concentration around marquee counterparties, or investor-favoring conversion terms slow commercialization or force repricing.", "Value falls below the last transparent private mark because the market reprices execution and financing risk before fundamentals are proven.", "Delayed energization, weak diversification, opaque debt/preference stack.", "Triggered by adverse project updates or disclosure that subordinates new equity."]
    notes: >-
      Scenarios anchor on observed financing marks and disclosed risks, not a
      modeled DCF or public-multiple exercise, because the assigned evidence
      does not disclose revenue, margins, or cash flow.
