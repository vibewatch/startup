      - ["Anti-thesis", "Public support is strongest for fundraising and narrative positioning, not for unit economics or cash-generation quality.", "Provide audited revenue, gross margin, burn, and capex disclosures that let investors test operating leverage."]
      - ["Upgrade trigger", "Confirmed operating metrics plus clean convert terms would make the current scale story more underwritable.", "Release official filings or investor materials showing revenue quality, debt/collateral terms, and a realistic energization timeline."]
      - ["Downgrade trigger", "Further delays, concentration, or structured-finance overhang could turn the current mark into a down-round setup.", "Any evidence of slipped power delivery, weak utilization, or investor-favoring conversion terms would push the call toward pass."]
    notes: >-
      This table converts the retained source record into an underwriting
      framework rather than a scored model; no public EV or revenue multiple is
      derivable from the assigned evidence.
