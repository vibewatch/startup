  name: Verkada
chapter:
  number: 1
  title: Company Overview
  summary: Verkada is a San Mateo-based private physical-security technology company founded in 2016. Its strongest disclosed scale markers are a $5.8 billion December 2025 valuation, more than $1 billion in annualized bookings, more than 31,000 customer organizations by March 2026, and more than 2 million deployed devices; audited revenue, exact headcount, ownership, and governance rights remain unavailable or inconsistent.
sections:
  - id: identity-and-operating-model
    title: Identity, operating model, and disclosed scale
    body: |
      Verkada was founded in 2016 and is headquartered in San Mateo, California. It sells an integrated physical-security platform spanning video security, access control, alarms, intercoms, environmental sensors, and visitor or workplace management. The company describes these products as one cloud-based platform, while a third-party profile identifies the business as a developer of enterprise video-surveillance systems. That combination makes the business model hardware-enabled software rather than a pure software subscription: customers deploy Verkada devices and manage them through the vendor's platform.

      Disclosed scale is substantial but mostly company-issued. Verkada said in December 2025 that more than 30,000 organizations used over 2 million devices across 171 countries; a March 2026 company release raised the customer count to more than 31,000. The same release said fiscal-year revenue grew 30% year over year, but did not disclose absolute revenue, ARR, gross margin, or the hardware-versus-subscription mix. Annualized bookings above $1 billion should therefore not be presented as revenue.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO009
      - CO010
      - CO011
      - CO012
    tableRefs:
      - TO001
    figureRefs: []
  - id: leadership-and-governance
    title: Founder leadership and governance visibility
    body: |
      A 2026 investor-club profile names Filip Kaliszan, Benjamin Bercovitz, James Ren, and Hans Robertson as co-founders, and identifies Kaliszan as CEO, Robertson as COO, and Bercovitz as CTO. This concentrates the three most visible operating functions in the founding team and creates a diligence need around succession, delegated authority, and retention. Public evidence in the assigned pool does not establish the current operating role of Ren or provide verified biographies sufficient to make broader founder-market-fit claims.

      Tracxn lists seven active board members, including the four founders and Bill Trenchard, Lak Ananth, Kameron Rezai, and Tim Wilcox. Its page labels all seven "independent board members," a classification that is difficult to reconcile with founder participation and should not be treated as verified independence. The pool also does not disclose voting rights, investor-designated seats, ownership percentages, secondary transactions, or committee composition. Governance quality and economic control therefore remain material private-evidence questions rather than confirmed strengths.
    claimRefs:
      - CO004
      - CO005
    tableRefs:
      - TO002
    figureRefs: []
  - id: capital-and-stakeholders
    title: Capitalization, valuation, and stakeholder map
    body: |
      Capital disclosures are directionally consistent but not fully reconciled. Tracxn reports $757 million raised across 12 rounds, while an August 2026 compiled tear sheet reports more than $756 million across 11 rounds. Both sources support a late-stage, heavily financed private-company profile, but their round counts and totals should remain visibly distinct. The most reliable current valuation marker is Verkada's December 2025 announcement that CapitalG led an investment valuing the company at $5.8 billion, a $1.3 billion increase from the Series E valuation earlier that year.

      The reported investor roster spans early venture, growth capital, and strategic investors. Public profiles name First Round Capital, Next47, Meritech, Sequoia, Felicis, Linse Capital, General Catalyst, CapitalG, and Nvidia, among others. Tracxn reports an undisclosed Series E financing on July 1, 2026 with Nvidia participating, but the assigned evidence does not establish proceeds, valuation, security type, or governance rights for that transaction. A current cap table and financing documents are required before drawing control or dilution conclusions.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO014
    tableRefs:
      - TO003
    figureRefs: []
  - id: trajectory-and-risk-context
    title: Recent trajectory and risk context
    body: |
      The disclosed trajectory shows simultaneous capital, customer, and product expansion. The December 2025 CapitalG investment coincided with annualized bookings above $1 billion. By March 2026, the company reported more than 31,000 customers, 30% year-over-year revenue growth, and new offices in Atlanta, Chicago, Dallas, Los Angeles, and Dubai. In September 2026, an implementation partner described expansion into transportation security, cloud-managed sound, thermal cameras, fire monitoring, and external AI integrations. Because that release analysis comes from a partner offering Verkada services, it is corroborating product evidence rather than an independent benchmark.

      The adverse signal in the pool is a 2026 review aggregator that synthesizes user reviews, practitioner communities, FTC material, and company incident reporting. It identifies recurring cost, proprietary lock-in, cloud dependency, aggressive sales practices, and the 2021 breach and 2024 FTC settlement as buyer diligence issues. This source is useful for issue discovery but does not replace review of the underlying regulatory record, contracts, security audits, renewal terms, or incident documentation.
    claimRefs:
      - CO008
      - CO009
      - CO010
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
    tableRefs: []
    figureRefs:
      - FO001
