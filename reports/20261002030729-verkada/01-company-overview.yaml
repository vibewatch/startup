callouts:
  - calloutType: insight
    title: Bookings are the disclosed scale marker, not revenue
    body: The strongest current commercial disclosure is more than $1 billion in annualized bookings. The assigned evidence does not establish absolute revenue, ARR, gross margin, or cash generation, so the bookings figure should not be converted into those metrics.
    claimRefs:
      - CO009
      - CO012
  - calloutType: risk
    title: Control and security diligence remain open
    body: Public sources do not disclose ownership, voting rights, investor preferences, or board committees, while the adverse review flags lock-in, cost, cloud dependency, and prior security and regulatory events. Primary legal, contractual, and security evidence is required.
    claimRefs:
      - CO005
      - CO016
