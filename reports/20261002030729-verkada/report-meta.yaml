companyProfile:
  summary: >-
    Verkada is a San Mateo-based late-stage private physical-security technology company founded in 2016. It sells a
    cloud-managed platform that spans video security, access control, alarms, intercoms, environmental sensors, and
    visitor management, and it reports more than 31,000 customer organizations, more than 2 million deployed devices,
    and more than $1 billion in annualized bookings. The public record still leaves important gaps in audited
    financials, retention, governance, and ownership structure.
