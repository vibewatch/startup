  topStrengths:
    - Integrated cloud-managed physical-security stack with broad cross-sell potential
    - Demonstrated commercial scale with more than 31,000 customers and more than 2 million devices
    - Strong enterprise field motion and quantified customer expansion cases
  topRisks:
    - Proprietary hardware lock-in and recurring-license dependency can raise switching costs and buyer resistance
    - FTC enforcement, the 2021 breach, and related security perception remain a material reputational overhang
    - Public evidence does not disclose audited revenue, margins, retention, cash runway, or ownership structure
    - Channel conflict and unresolved patent/ITC questions could add operational and import risk
