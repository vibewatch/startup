      - ["Anti-thesis", "Independent review synthesis flags recurring cost, proprietary lock-in, and security-history concerns that can pressure retention and pricing.", "Verified remediation, reference calls, open migration paths, and stable cohorts would reduce downside concern."]
      - ["Price discipline", "A 29% private-mark step-up occurred without public disclosure of ownership, preferences, dilution, or a verified secondary price.", "A clean cap table, liquidation waterfall, and arm's-length common-share indication would make entry value assessable."]
    notes: "The thesis uses company-reported operating scale; the anti-thesis uses an independent review synthesis; neither substitutes for audited financial diligence."
