company:
  name: "Verkada"
chapter:
  number: 8
  title: "Valuation"
  summary: "Verkada's last disclosed $5.8 billion valuation is supported by company-reported scale, including more than $1 billion in annualized bookings, but the assigned public evidence does not establish revenue, ARR, margins, cash flow, ownership, or preference terms. The defensible stance is track/research more: treat the price as stretched and unverified until audited economics and entry terms make a risk-adjusted return calculable."
sections:
  - id: "decision-and-price-discipline"
    title: "Decision and Price Discipline"
    body: "The current recommendation is track/research more, with medium confidence, high risk, and a stretched/unverified valuation stance. Independent and company-issued sources corroborate a $5.8 billion financing mark, while the company says annualized bookings exceeded $1 billion [CV001, CV002]. That is evidence of commercial scale, not evidence of revenue, ARR, cash generation, or a 5.8x revenue multiple. Using the disclosed figures only as a simplified upper-bound calculation produces roughly 5.8x annualized bookings because the denominator is greater than $1 billion [CV013]. Without audited economics, cap-table terms, or a verified secondary price, public evidence cannot support a precise entry range or target return [CV015, CV016]."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV013"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "financing-context-and-evidence-quality"
    title: "Financing Context and Evidence Quality"
    body: "Tracxn reports $757 million raised across 12 rounds and lists a progression from a $4.5 billion post-money mark in December 2024 to $5.8 billion in November 2025 [CV005, CV006]. The latter is about 29% above the earlier mark, but a step-up between private financings does not reveal the security's preferences, dilution, debt seniority, or common-share value [CV014]. Source quality also constrains conviction: the assigned Equitybee page displays unrelated Reddit data rather than usable Verkada transaction detail, and the Silicon Valley Investclub fetch provides a general private-investment risk disclaimer without deal data [CV007, CV008]. These are evidence gaps, not support for a secondary valuation."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV014"
  - id: "thesis-antithesis-and-scenarios"
    title: "Thesis, Anti-Thesis, and Scenarios"
    body: "The thesis is that company-reported scale—more than 30,000 organizations and more than 2 million deployed devices across 171 countries—can support an attractive platform outcome if bookings convert into durable, high-margin recurring revenue [CV003, CV004]. The anti-thesis is that price and switching friction weaken retention or pricing power: an independent review synthesis highlights recurring per-camera licensing costs, proprietary lock-in, and the continuing relevance of the 2021 breach and 2024 FTC settlement [CV009, CV010, CV011]. Accordingly, the scenarios are qualitative. A bull case requires audited conversion and margin proof; the base case preserves the current mark only conditionally; the bear case applies a material discount if customer or security risks impair economics [CV015, CV016]."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV002"
      - "TV003"
  - id: "exit-readiness-and-final-diligence"
    title: "Exit Readiness and Final Diligence"
    body: "Current company-issued pages show ongoing go-to-market activity through EDUCAUSE participation and an ANZ field-marketing role, but those signals do not establish public-market readiness [CV012]. The assigned evidence contains no audited revenue bridge, ARR definition, gross-margin split, retention cohorts, free-cash-flow profile, ownership schedule, liquidation waterfall, or verified common-share transaction [CV016]. Before underwriting an exit, investors should obtain audited statements, cohort retention and expansion, hardware-versus-subscription economics, debt and preference documents, the fully diluted cap table, board and governance materials, and current secondary indications. Thesis-break triggers are verified retention deterioration, margin weakness after hardware costs, unresolved security-control deficiencies, or financing terms that shift downside disproportionately to new capital [CV009, CV010, CV011, CV015]."
    claimRefs:
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV015"
      - "CV016"
