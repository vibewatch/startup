company:
  name: "Verkada"
chapter:
  number: 4
  title: "Financials"
  summary: "Verkada reports more than $1 billion in annualized bookings, while third-party reporting points to approximately $700 million of 2026 revenue and no full-year positive free cash flow until 2027. The evidence supports strong commercial scale and a hardware-plus-recurring-software model, but does not disclose the revenue bridge, gross margin, retention, sales efficiency, cash balance, burn, or runway needed for underwriting."
sections:
  - id: "revenue-model-and-quality"
    title: "Revenue Model and Revenue Quality"
    body: |
      Verkada combines proprietary physical-security devices with a cloud management platform, so the economic model has both hardware and recurring software components. The assigned evidence is clearest for cameras: an independent review reports a recurring camera license and says the hardware does not function as designed without the software, while Verkada describes an integrated hardware-and-cloud platform. That structure can create durable renewal revenue, but it also makes the software stream dependent on continued use of proprietary endpoints. Verkada's reported multi-product adoption among large customers indicates cross-sell potential across cameras, access control, sensors, intercoms, and alarms. Public evidence does not disclose hardware-versus-software revenue mix, realized contract prices, revenue-recognition policy, or gross margin by stream, so annualized bookings should not be treated as revenue or cash.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI006"
      - "CI009"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "pricing-and-gtm-economics"
    title: "Pricing and GTM Economics"
    body: |
      The only specific product price in the assigned evidence is a third-party-reported $219 MSRP for a one-year camera license. The same review cites a practitioner estimate of roughly $200 to $400 per camera per year for licensing and storage, but that anecdotal range is not a verified Verkada contract benchmark. It also reports a list-price increase effective June 5, 2026 without disclosing the magnitude. Verkada's presence at EDUCAUSE with personalized walkthroughs and demos is consistent with a direct, field-assisted enterprise motion, and the company reports broad multi-product adoption. None of the sources provides sales-cycle length, quota productivity, CAC, payback, channel margin, discount bands, or implementation economics. Those omissions prevent a defensible conclusion about sales efficiency despite visible top-line traction.
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI010"
      - "CI016"
    tableRefs:
      - "TI002"
  - id: "traction-and-unit-economics"
    title: "Commercial Traction and Unit-Economics Gaps"
    body: |
      Verkada announced that it had surpassed $1 billion in annualized bookings in December 2025 and had more than 2 million devices deployed across 171 countries at more than 30,000 organizations. Forge, citing The Information, separately reports that Verkada expected about $700 million of 2026 revenue, up about 28% year over year. These are different metrics from different sources: the evidence does not supply a common measurement period, bookings-to-revenue conversion schedule, cancellation assumptions, or accounting policy. The two figures therefore establish scale but not a $300 million deferral, backlog balance, or revenue-quality bridge. Gross margin, hardware COGS, cloud hosting cost, NRR, churn, CAC, payback, working capital, and capex remain unavailable in the assigned public evidence. Each should be treated as an underwriting gap rather than estimated from the reported traction.
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI011"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy and Financial Verdict"
    body: |
      External market data reports $757 million of total funding, while Verkada announced a CapitalG-led investment at a $5.8 billion valuation and said the capital would accelerate AI development. September 2026 private-market price indications ranged from $10.04 to $10.50 per share across Nasdaq Private Market, Public.com, and Forge, but the values use different dates and methodologies and do not establish cash available to the company. Forge also reports that Verkada did not expect full-year positive free cash flow until 2027. That statement is not a burn-rate disclosure and cannot establish runway. The financial verdict is therefore mixed: commercial scale and access to capital are evident, but margin path, cash balance, monthly burn, debt obligations, capex, working capital, and next-round triggers remain private. Investment underwriting should remain conditional on audited statements and a management-provided cash bridge.
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
callouts:
  - calloutType: "risk"
    title: "Bookings Are Not Revenue or Cash"
    body: "The company-issued annualized-bookings milestone and the third-party-reported 2026 revenue forecast are not directly reconcilable from the assigned evidence. A diligence model should not convert their difference into deferred revenue, backlog, gross profit, or cash without the underlying contract and accounting schedules."
    claimRefs:
      - "CI006"
      - "CI008"
      - "CI009"
