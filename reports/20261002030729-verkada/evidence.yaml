evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board-designation rights, committee composition, founder and investor voting rights, ownership
      percentages, and succession arrangements.
    whyItMatters: >-
      Founder concentration and investor protections determine control, key-person exposure, and the ability to approve
      financing or exit decisions.
    diligencePath: >-
      Obtain the current charter, bylaws, voting agreement, investor-rights agreement, board minutes, cap table, and
      executive succession plan.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount-and-locations
    missingEvidence: >-
      A dated employee roster and office list using consistent definitions; assigned profiles report 2,100+, 2,695, and
      2,880 employees.
    whyItMatters: An irreconcilable headcount prevents reliable productivity, operating-expense, and geographic-support analysis.
    diligencePath: >-
      Request payroll headcount by function and geography as of 2026-10-02 and reconcile employees, contractors, open
      roles, and inactive entities.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited revenue, ARR, hardware and subscription mix, gross margin, operating loss, cash balance, debt, burn, and
      runway.
    whyItMatters: Annualized bookings cannot establish revenue quality, profitability, cash burn, or financing capacity.
    diligencePath: >-
      Obtain audited financial statements, revenue-recognition policy, bookings-to-revenue bridge, debt schedule, and
      monthly cash-flow statements.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-history
    missingEvidence: >-
      Primary FTC complaint and settlement, 2021 incident report, current independent security audit, customer contract,
      pricing schedule, and renewal terms.
    whyItMatters: >-
      The assigned adverse source is an aggregator; primary documents are needed to verify scope, remediation, lock-in,
      pricing, and residual security risk.
    diligencePath: >-
      Review the FTC docket and company incident materials, then obtain current SOC reports, penetration-test results,
      order forms, license terms, and customer references.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: arr-vs-hardware-split
    missingEvidence: >-
      Audited financial breakout separating recurring cloud SaaS software revenue from upfront hardware sales and
      multi-year deferred bookings.
    whyItMatters: >-
      Verkada reports surpassing $1 billion in annualized bookings, but the software ARR percentage and hardware margin
      profile fundamentally determine valuation multiples.
    diligencePath: >-
      Review confidential financial filings, secondary market transaction disclosures, or eventual S-1 registration
      statements.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Comparable scale, funding, customer mix, and strategic-direction evidence for Rhombus, Avigilon, Eagle Eye
      Networks, Ubiquiti, Uniview, and Axis.
    whyItMatters: >-
      Without comparable denominators, the profile table cannot distinguish product fit from commercial durability or
      distribution capacity.
    diligencePath: >-
      Request current investor materials, audited customer metrics, product-roadmap briefings, and segment-specific
      customer references from each shortlisted vendor.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Identical-scope, identical-term quotes showing realized hardware, license, storage, support, implementation,
      renewal, and exit costs for each finalist.
    whyItMatters: >-
      Public MSRP and generic licensing descriptions do not establish the buyer's actual lifecycle cost or negotiated
      renewal exposure.
    diligencePath: >-
      Run a structured RFP using the same device count, retention period, integrations, service levels, implementation
      scope, and exit assumptions.
    relatedQuestionRefs:
      - QP003
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: comparative-trust
    missingEvidence: >-
      Independent, current, like-for-like evidence on security controls, incidents, regulatory posture, uptime, and
      remediation across every shortlisted competitor.
    whyItMatters: >-
      The assigned pool is detailed on Verkada's history but cannot support a relative trust ranking when competitor
      cells are missing.
    diligencePath: >-
      Obtain SOC 2 reports, penetration-test summaries, incident disclosures, regulator searches, status history, and
      security reference calls under NDA.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited revenue mix, gross margin, hardware COGS, cloud hosting cost, capex, and working-capital schedules.
    whyItMatters: These inputs determine whether reported growth produces durable software-like gross profit and cash conversion.
    diligencePath: >-
      Request audited statements and management schedules separating hardware, software, services, COGS, capex, and
      working capital.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Sales-cycle length, fully loaded CAC, payback, quota attainment, channel margin, and discount cohorts.
    whyItMatters: Commercial scale cannot establish efficient growth without the cost and timing of customer acquisition.
    diligencePath: Request segment-level funnel, cohort, seller-productivity, CAC, payback, channel, and realized-pricing data.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash, monthly burn, runway, debt facilities, covenants, planned uses, and next-round trigger.
    whyItMatters: Funding raised and private-market prices do not establish cash available or financing dependency.
    diligencePath: Obtain a current balance sheet, 24-month cash forecast, debt schedule, cap table, and downside financing plan.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Official current price books and representative executed customer contracts showing discounts, renewal uplifts,
      and service fees.
    whyItMatters: A third-party list price and one practitioner estimate cannot establish realized pricing or revenue quality.
    diligencePath: Sample current invoices and renewal cohorts by product, customer size, geography, term, and channel.
    relatedQuestionRefs:
      - QI001
      - QI006
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: hardware-bom-and-chipset-sourcing
    missingEvidence: >-
      Audited bill-of-materials cost breakdown, solid-state flash NAND write endurance metrics, and proprietary
      system-on-chip (SoC) supplier agreements for Verkada camera lines.
    whyItMatters: >-
      Without visibility into hardware component costs, flash wear-out curves, and semiconductor supply chain contracts,
      it is difficult to evaluate hardware gross margins and long-term device replacement cycles.
    diligencePath: >-
      Request hardware manufacturing agreements, mean-time-between-failure (MTBF) engineering logs, and warranty
      replacement rate schedules under confidentiality.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Cohort NRR, GRR, logo churn, renewal rates, contract duration, and expansion distributions by segment.
    whyItMatters: >-
      Average first-year spend expansion cannot establish durable retention or reveal whether churn is concentrated in
      smaller accounts.
    diligencePath: >-
      Request board-approved cohort exports and reconcile them to billing records; validate renewal behavior through
      blinded customer reference calls.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer, top-ten, vertical, geographic, and channel-sourced revenue concentration.
    whyItMatters: >-
      A large customer count does not reveal dependency on major enterprise accounts, sectors, regions, or channel
      partners.
    diligencePath: Request revenue and gross-profit concentration schedules by account, vertical, geography, and originating channel.
    relatedQuestionRefs:
      - QU010
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-sample
    missingEvidence: >-
      A complete roster of production customers with deployment scope, start date, outcome methodology, and renewal
      status.
    whyItMatters: >-
      Vendor-selected stories cannot establish fleet-wide outcome quality or the share of references still in
      production.
    diligencePath: >-
      Sample the customer roster independently and conduct reference calls that include expired, downsized, and renewed
      accounts.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: patent-litigation-itc
    missingEvidence: >-
      Non-public settlement terms or ongoing claim construction documents regarding the Motorola Solutions ITC patent
      infringement investigation.
    whyItMatters: >-
      An adverse exclusion order from the ITC could bar import and importation of key camera hardware models into the
      United States.
    diligencePath: >-
      Review public ITC docket filings (Investigation No. 337-TA) and obtain counsel evaluation of asserted video
      analytics patents.
    relatedQuestionRefs:
      - QR008
  - type: private-evidence-only
    severity: material
    topic: audited-economics
    missingEvidence: >-
      Audited revenue, ARR definition and bridge, hardware-versus-subscription mix, gross margin, retention cohorts, and
      free-cash-flow history.
    whyItMatters: >-
      These inputs determine whether annualized bookings convert into durable revenue and cash generation at a price
      that can support venture returns.
    diligencePath: >-
      Request audited statements, KPI definitions, cohort schedules, revenue-quality analysis, and board-approved
      forecasts.
    relatedQuestionRefs:
      - QV002
      - QV005
      - QV007
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Fully diluted ownership, debt schedule, security class, liquidation preferences, anti-dilution provisions, option
      overhang, and prior secondary transaction terms.
    whyItMatters: >-
      Headline post-money valuation does not determine the price, downside protection, or proceeds available to new
      common or preferred capital.
    diligencePath: >-
      Obtain the cap table, charter, financing documents, debt agreements, liquidation waterfall, 409A history, and
      current secondary indications.
    relatedQuestionRefs:
      - QV004
      - QV008
  - type: missing-source
    severity: material
    topic: valuation-comparables
    missingEvidence: >-
      Auditable public-company, private-round, or M&A comparables with aligned revenue definitions, growth, margins, and
      transaction dates.
    whyItMatters: A company-specific financing history alone cannot establish a market-clearing multiple or downside floor.
    diligencePath: >-
      Build a banker-grade comparable set after audited operating metrics establish the correct denominator and
      business-model mix.
    relatedQuestionRefs:
      - QV005
      - QV006
  - type: missing-source
    severity: minor
    topic: secondary-market-source-quality
    missingEvidence: A verified, current arm's-length Verkada secondary transaction price and security-class terms.
    whyItMatters: >-
      The assigned secondary-market pages either contain mismatched content or generic risk language and cannot validate
      liquidity or common-share value.
    diligencePath: >-
      Request broker indications and completed trade evidence, then reconcile the quoted security class with the fully
      diluted cap table.
    relatedQuestionRefs:
      - QV006
