callouts:
  - calloutType: "risk"
    title: "The Zero-Residual Value Dilemma: Hardware as Hostage"
    body: "The core commercial vulnerability of the Verkada platform is its closed operational model: cameras do not support ONVIF or RTSP open standards and become inoperable brick hardware if cloud licensing lapses. Unlike conventional IP cameras that can be redirected to Milestone, Genetec, or local NVRs, Verkada customers face complete capital loss upon contract termination, providing an unsustainable switching barrier that draws intensifying scrutiny from IT procurement and risk committees."
    claimRefs:
      - "CR006"
      - "CR007"
  - calloutType: "insight"
    title: "FTC Injunction as a Double-Edged Governance Barrier"
    body: "While the August 2024 FTC settlement imposed a record $2.95M CAN-SPAM penalty and strict 20-year compliance mandates following the 2021 150,000-camera breach, the resulting rigorous third-party audits and SOC 2 Type 2 certifications now force Verkada to maintain higher data hygiene standards than unscrutinized physical security startups. However, any subsequent administrative lapse or cloud vulnerability could trigger crippling civil contempt penalties."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
      - "CR008"
