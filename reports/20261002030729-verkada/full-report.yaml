  - id: TE002
    title: Physical Security Workflow and Use-Case Comparison
    columns:
      - User Job / Workflow
      - Legacy Infrastructure Workflow
      - Verkada Solution Workflow
      - Measurable Operational Benefit
      - Technical Limitation / Risk
    rows:
      - - Incident Investigation & Video Search
        - Log into local NVR, scrub through hours of linear timeline footage manually across disjointed camera channels
        - >-
          Query Command via AI-powered search (person of interest, clothing color, vehicle plate) across all distributed
          cameras
        - Investigation time reduced from hours/days to minutes using edge metadata and cloud indexing
        - Computer vision accuracy sensitive to camera angle, lighting extremes, and lens obstruction
      - - Multi-Site Building Access Management
        - Manually create and revoke access credentials on disparate local door controllers and PC-based access software
        - >-
          Centralized cloud directory synchronization (Okta, Azure AD) automatically updates permissions across all
          doors
        - Eliminates orphan badges and manual synchronization errors across distributed corporate facilities
        - Door unlock latency subject to mobile Bluetooth handshake speed or edge controller database sync
      - - System Firmware Maintenance & Patching
        - >-
          Schedule on-site technician visits or manual VPN-based firmware uploads per camera and recorder, causing patch
          lag
        - Automated cloud-orchestrated rolling firmware and security patches applied across device fleet simultaneously
        - Zero local IT touch required; immediate remediation of known security vulnerabilities
        - Customer has limited control over patch scheduling; unexpected firmware behavior can disrupt live operations
      - - Perimeter Security & Visual Verification
        - Contact sensors trip alarm; dispatcher calls facility contact blindly without real-time visual context
        - >-
          Intrusion sensor triggers alarm event with linked live camera clips routed instantly to monitoring agents and
          mobile app
        - Drastic reduction in false-alarm police dispatch fees and rapid emergency response dispatch
        - Cellular backup communicator required if local facility broadband is compromised or cut
    notes: Workflows synthesize verified customer deployment feedback from Kinettix, HTS, and practitioner review analyses.
