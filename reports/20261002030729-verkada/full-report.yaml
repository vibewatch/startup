      - number: '3.3'
        title: Pricing, Lock-In, and Distribution
        blocks:
          - type: paragraph
            body: >-
              Price transparency is itself a diligence issue. HTS says pricing is not public and recommends obtaining a
              deployment-specific quote, while Umbrella Security Systems cites a June 2026 U.S. public MSRP overview.
              Umbrella's 100-camera example attributes $119,900 to 100 CD43 cameras and $219,900 to required ten-year
              camera licenses, or a $339,800 subtotal before installation, mounts, switches, UPS, training, viewing
              stations, bandwidth, cloud storage, replacement labor, or exit. This is a list-price scenario, not
              realized customer pricing or a comparison of gross margin. License expiry also raises switching friction:
              Umbrella reports that device and configuration access and alarms are restricted after applicable grace
              periods, even though connected devices may continue recording within retention. Verkada's own event and
              recruiting materials show that it supports distribution through demonstrations, regional campaigns, and
              partner-led programs rather than relying only on direct digital demand.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Durability and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              The moat appears strongest where a buyer values one integrated operating surface and wants minimal local
              administration. Company disclosures also indicate substantial installed scale, but the cited customer,
              device, valuation, and annualized-bookings figures remain company-issued and do not establish retention,
              win rates, or superior unit economics. Durability is weaker where an existing fleet can be retained or a
              capable IT team accepts local management in exchange for lower recurring license exposure. Review evidence
              reinforces both sides: CheckThat reports strong G2 sentiment while identifying cost and proprietary
              lock-in as recurring objections and the 2021 breach and 2024 FTC settlement as continuing trust diligence.
              The investment conclusion is therefore conditional: integration and installed-base switching costs can
              defend accounts, but open-platform migration paths and procurement pressure can erode that defense.
              Comparable renewal quotes, churn, competitive win-loss data, and independently verified security
              comparisons are still required.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A Public MSRP Is Not a Realized Lifecycle Cost
            body: >-
              The $339,800 scenario is useful for exposing the hardware-versus-license mix, but it excludes
              implementation, operations, optional services, discounting, renewal escalation, and exit. Underwriting
              should require comparable vendor quotes with identical device counts, retention, integrations, support,
              and contract terms.
            calloutType: risk
            claimRefs:
              - CP011
              - CP013
          - type: callout
            title: Integration Is Both Product Value and Switching Friction
            body: >-
              A unified operating surface can reduce administration while also making future replacements more
              disruptive. Moat durability therefore depends on whether the operating savings remain greater than
              recurring-license exposure and the value of preserving hardware and supplier choice.
            calloutType: insight
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP009
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Revenue Quality
        blocks:
          - type: paragraph
            body: >
              Verkada combines proprietary physical-security devices with a cloud management platform, so the economic
              model has both hardware and recurring software components. The assigned evidence is clearest for cameras:
              an independent review reports a recurring camera license and says the hardware does not function as
              designed without the software, while Verkada describes an integrated hardware-and-cloud platform. That
              structure can create durable renewal revenue, but it also makes the software stream dependent on continued
              use of proprietary endpoints. Verkada's reported multi-product adoption among large customers indicates
              cross-sell potential across cameras, access control, sensors, intercoms, and alarms. Public evidence does
              not disclose hardware-versus-software revenue mix, realized contract prices, revenue-recognition policy,
              or gross margin by stream, so annualized bookings should not be treated as revenue or cash.
            claimRefs:
