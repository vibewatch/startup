      - number: '1.4'
        title: Recent trajectory and risk context
        blocks:
          - type: paragraph
            body: >
              The disclosed trajectory shows simultaneous capital, customer, and product expansion. The December 2025
              CapitalG investment coincided with annualized bookings above $1 billion. By March 2026, the company
              reported more than 31,000 customers, 30% year-over-year revenue growth, and new offices in Atlanta,
              Chicago, Dallas, Los Angeles, and Dubai. In September 2026, an implementation partner described expansion
              into transportation security, cloud-managed sound, thermal cameras, fire monitoring, and external AI
              integrations. Because that release analysis comes from a partner offering Verkada services, it is
              corroborating product evidence rather than an independent benchmark.


              The adverse signal in the pool is a 2026 review aggregator that synthesizes user reviews, practitioner
              communities, FTC material, and company incident reporting. It identifies recurring cost, proprietary
              lock-in, cloud dependency, aggressive sales practices, and the 2021 breach and 2024 FTC settlement as
              buyer diligence issues. This source is useful for issue discovery but does not replace review of the
              underlying regulatory record, contracts, security audits, renewal terms, or incident documentation.
