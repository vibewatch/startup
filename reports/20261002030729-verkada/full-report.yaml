  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture, Unified Workflow, and Solution Portfolio
        blocks:
          - type: paragraph
            body: >-
              Verkada delivers an integrated physical security and enterprise facilities platform centered on its
              proprietary cloud-based management portal, Verkada Command. Rather than deploying disparate, siloed
              systems for video surveillance, physical access control, building alarms, air quality monitoring, and
              visitor management, the platform standardizes disparate physical endpoints onto a single web browser and
              mobile interface. Field deployments demonstrate that the primary user workflow begins the moment an
              endpoint is connected to power over Ethernet (PoE): devices establish outbound encrypted connections to
              the cloud without requiring port forwarding, on-site recording servers, or virtual private networks
              (VPNs). IT directors and security operators execute daily administrative workflows—including live video
              monitoring, historical video archive search, door lock scheduling, emergency lockdown triggers,
              environmental anomaly investigation, and visitor badge issuance—from a single pane of glass. Across its
              commercial documentation, Verkada segments its hardware and software catalogue into core product lines:
              Video Security (featuring dome, bullet, wedge, fisheye, and multi-sensor cameras), Access Control (door
              controllers, wireless locks, and mobile credentials), Alarms (intrusion sensors, monitoring consoles, and
              wireless panic buttons), Intercoms (video intercom terminals and master stations), Environmental Sensors
              (vape detection, air quality, and noise level monitors), Workplace Tools (visitor kiosks and mailroom
              management), Connectivity Gateways (cellular LTE routers and ruggedized transportation gateways), and
              Sound Systems (network audio players and IP horn speakers). While this comprehensive portfolio streamlines
              facilities operations into an intuitive consumer-like workflow, it establishes a closed operating system
              where physical endpoints cannot function independently of Verkada's software.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
