chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, operating model, and disclosed scale
        blocks:
          - type: paragraph
            body: >
              Verkada was founded in 2016 and is headquartered in San Mateo, California. It sells an integrated
              physical-security platform spanning video security, access control, alarms, intercoms, environmental
              sensors, and visitor or workplace management. The company describes these products as one cloud-based
              platform, while a third-party profile identifies the business as a developer of enterprise
              video-surveillance systems. That combination makes the business model hardware-enabled software rather
              than a pure software subscription: customers deploy Verkada devices and manage them through the vendor's
              platform.


              Disclosed scale is substantial but mostly company-issued. Verkada said in December 2025 that more than
              30,000 organizations used over 2 million devices across 171 countries; a March 2026 company release raised
              the customer count to more than 31,000. The same release said fiscal-year revenue grew 30% year over year,
              but did not disclose absolute revenue, ARR, gross margin, or the hardware-versus-subscription mix.
              Annualized bookings above $1 billion should therefore not be presented as revenue.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO014
      - number: '1.2'
        title: Founder leadership and governance visibility
        blocks:
          - type: paragraph
            body: >
              A 2026 investor-club profile names Filip Kaliszan, Benjamin Bercovitz, James Ren, and Hans Robertson as
              co-founders, and identifies Kaliszan as CEO, Robertson as COO, and Bercovitz as CTO. This concentrates the
              three most visible operating functions in the founding team and creates a diligence need around
              succession, delegated authority, and retention. Public evidence in the assigned pool does not establish
              the current operating role of Ren or provide verified biographies sufficient to make broader
              founder-market-fit claims.


              Tracxn lists seven active board members, including the four founders and Bill Trenchard, Lak Ananth,
              Kameron Rezai, and Tim Wilcox. Its page labels all seven "independent board members," a classification
              that is difficult to reconcile with founder participation and should not be treated as verified
              independence. The pool also does not disclose voting rights, investor-designated seats, ownership
              percentages, secondary transactions, or committee composition. Governance quality and economic control
              therefore remain material private-evidence questions rather than confirmed strengths.
            claimRefs:
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
      - number: '1.3'
        title: Capitalization, valuation, and stakeholder map
        blocks:
          - type: paragraph
            body: >
              Capital disclosures are directionally consistent but not fully reconciled. Tracxn reports $757 million
              raised across 12 rounds, while an August 2026 compiled tear sheet reports more than $756 million across 11
              rounds. Both sources support a late-stage, heavily financed private-company profile, but their round
              counts and totals should remain visibly distinct. The most reliable current valuation marker is Verkada's
              December 2025 announcement that CapitalG led an investment valuing the company at $5.8 billion, a $1.3
              billion increase from the Series E valuation earlier that year.


              The reported investor roster spans early venture, growth capital, and strategic investors. Public profiles
              name First Round Capital, Next47, Meritech, Sequoia, Felicis, Linse Capital, General Catalyst, CapitalG,
              and Nvidia, among others. Tracxn reports an undisclosed Series E financing on July 1, 2026 with Nvidia
              participating, but the assigned evidence does not establish proceeds, valuation, security type, or
              governance rights for that transaction. A current cap table and financing documents are required before
              drawing control or dilution conclusions.
