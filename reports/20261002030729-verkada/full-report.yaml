        title: Commercial Traction and Unit-Economics Gaps
        blocks:
          - type: paragraph
            body: >
              Verkada announced that it had surpassed $1 billion in annualized bookings in December 2025 and had more
              than 2 million devices deployed across 171 countries at more than 30,000 organizations. Forge, citing The
              Information, separately reports that Verkada expected about $700 million of 2026 revenue, up about 28%
              year over year. These are different metrics from different sources: the evidence does not supply a common
              measurement period, bookings-to-revenue conversion schedule, cancellation assumptions, or accounting
              policy. The two figures therefore establish scale but not a $300 million deferral, backlog balance, or
              revenue-quality bridge. Gross margin, hardware COGS, cloud hosting cost, NRR, churn, CAC, payback, working
