      - CE007
      - CE009
  - id: TE003
    title: Technology Architecture and Operating Stack Comparison
    columns:
      - Architecture Layer
      - Verkada Implementation
      - Traditional Open-Platform Alternative
      - Operational Tradeoff
      - Inherent Failure Mode / Diligence Risk
    rows:
      - - Edge Device Hardware
        - Proprietary IP cameras with integrated solid-state storage, secure cryptoprocessors, and hardware acceleration
        - Commodity ONVIF/RTSP IP cameras from multiple manufacturers (Axis, Hanwha, Bosch) connected to local switches
        - Turnkey plug-and-play setup vs flexibility of selecting specialized hardware per location
        - Complete hardware obsolescence if cloud software subscription is discontinued
      - - Local Storage & Compute
        - Distributed edge recording directly on camera flash memory (30–365 days); edge computer vision inference
        - >-
          Centralized on-premises NVR servers, RAID hard drive arrays, or SAN storage appliances requiring climate
          control
        - Eliminates single point of failure in NVR hardware and eliminates server maintenance costs
        - High camera replacement cost if internal solid-state drive reaches write-endurance ceiling
      - - Transport & Networking
        - Outbound-only TLS 1.2+ encrypted tunnels to AWS cloud; steady-state bandwidth of 20–50 kbps per camera
        - High-bandwidth continuous RTSP streaming (2–8 Mbps per camera) across local LAN to on-premise NVR servers
        - Low steady-state WAN utilization vs high local LAN continuous streaming overhead
        - Live viewing and remote export degrade sharply during internet uplink bandwidth saturation
      - - Management & Analytics Plane
        - >-
          Multi-tenant cloud platform (Command) providing centralized web/mobile GUI, automated updates, and global
          search
        - >-
          On-premise VMS software (Milestone, Genetec) hosted on Windows/Linux servers requiring dedicated client
          workstations
        - Accessible from anywhere without VPN vs complete organizational control over data sovereignty
        - Vulnerability to central cloud service outages or vendor-wide credential compromise incidents
    notes: >-
      Comparative parameters derived from Acre Security alternative benchmarks, Kinettix installer guides, and HTS
      architecture documentation.
    claimRefs:
      - CE005
      - CE008
      - CE011
      - CE012
      - CE013
