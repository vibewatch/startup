  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Required assumptions
      - Valuation / return logic
      - Key downside trigger
      - Probability signal
    rows:
      - - Bull
        - >-
          Bookings convert into durable recurring revenue with strong retention, attractive consolidated margins, and
          verified security remediation.
        - >-
          A premium to the $5.8B mark could be defensible, but no numeric range or target return is supportable from
          assigned evidence.
        - Audited conversion or margin data misses the underwriting threshold.
        - Improving only after audited KPI and control verification.
      - - Base
        - Reported scale persists, but economics and security controls remain only partially evidenced.
        - >-
          Anchor at or below the $5.8B last mark subject to investor protections; no precise common-share value is
          available.
        - Term overhang or cohort weakness appears during diligence.
        - Current public evidence most directly supports this conditional case.
      - - Bear
        - >-
          Recurring cost, lock-in, or security concerns translate into weaker retention, discounting, or delayed exit
          readiness.
        - Apply a material discount to the last mark; the evidence does not support a precise downside floor.
        - Verified churn, margin compression, control failure, or punitive senior preferences.
        - Rises if customer references or audited financials confirm the adverse signals.
    notes: >-
      Scenarios are deliberately qualitative because audited revenue, ARR, margins, cash flow, cap-table terms, and
      comparable transaction multiples are unavailable in the assigned evidence.
    claimRefs:
      - CV001
      - CV002
