    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Evidence-based argument
      - What would change the view
    rows:
      - - Thesis
        - >-
          Company-issued evidence reports more than 30,000 organizations, more than 2 million devices, and more than $1B
          in annualized bookings.
        - Audited recurring-revenue growth, retention, gross margin, and cash conversion would strengthen the thesis.
      - - Anti-thesis
        - >-
          Independent review synthesis flags recurring cost, proprietary lock-in, and security-history concerns that can
          pressure retention and pricing.
        - Verified remediation, reference calls, open migration paths, and stable cohorts would reduce downside concern.
      - - Price discipline
        - >-
          A 29% private-mark step-up occurred without public disclosure of ownership, preferences, dilution, or a
          verified secondary price.
        - >-
          A clean cap table, liquidation waterfall, and arm's-length common-share indication would make entry value
          assessable.
