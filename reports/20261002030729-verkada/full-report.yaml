      - number: '4.4'
        title: Capital Adequacy and Financial Verdict
        blocks:
          - type: paragraph
            body: >
              External market data reports $757 million of total funding, while Verkada announced a CapitalG-led
              investment at a $5.8 billion valuation and said the capital would accelerate AI development. September
              2026 private-market price indications ranged from $10.04 to $10.50 per share across Nasdaq Private Market,
              Public.com, and Forge, but the values use different dates and methodologies and do not establish cash
              available to the company. Forge also reports that Verkada did not expect full-year positive free cash flow
              until 2027. That statement is not a burn-rate disclosure and cannot establish runway. The financial
              verdict is therefore mixed: commercial scale and access to capital are evident, but margin path, cash
              balance, monthly burn, debt obligations, capex, working capital, and next-round triggers remain private.
              Investment underwriting should remain conditional on audited statements and a management-provided cash
              bridge.
