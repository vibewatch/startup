callouts:
  - calloutType: "risk"
    title: "Proprietary Architectural Lock-In and Subscription Dependency"
    body: "Verkada delivers superior initial installation and administration velocity by coupling edge hardware directly to its proprietary Command cloud platform. However, this tight integration represents an irreversible architectural commitment. Because Verkada hardware does not expose standard ONVIF or RTSP video streams, cameras cannot be integrated into third-party video management software. If an enterprise allows its recurring per-device software subscription to lapse, the physical camera hardware ceases functioning as designed, forcing a complete rip-and-replace capital expenditure to transition to alternative physical security platforms."
    claimRefs:
      - "CE012"
      - "CE013"
