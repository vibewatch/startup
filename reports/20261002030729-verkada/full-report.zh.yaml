      - number: '6.3'
        title: 具名客户实证与落地效果评估
        blocks:
          - type: paragraph
            body: >-
              Verkada 的客户案例库给出了实打实的具名案例，而非毫无差别的品牌墙。材料称，Signify 在 7 个国家的 30 个分支网点铺开了安防系统；El Centro Regional Medical
              Center 的职场暴力事件减少了 83%；Allstone Quarries 将调查取证效率提升了 98%。其他案例还包括 Trek Bicycle 在 30 分钟内为门店增配了云管音频设备，以及 Prism
              Health 在十年总成本分析中自述节省了 43%
              费用。这些材料确实证明了实际业务流的落地可行性，但终归是厂商精心筛选的片面总结，未披露对照基线、样本规模、测算口径或独立第三方审计数据。评测聚合数据则提供了另一种参考：CheckThat 记录其在 G2 上的
              141 条评价中获得了 4.7/5 的高分，部署简便与多网点统一管理屡获好评；但聚合评价属于二手间接证据，无法替代对客户的直接回访问卷与尽调访谈。
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU012
