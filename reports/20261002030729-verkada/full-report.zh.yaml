      - number: '8.4'
        title: 退出成熟度与最终尽调事项
        blocks:
          - type: paragraph
            body: >-
              公司当前官网页面显示，其参与 EDUCAUSE 并在澳新地区（ANZ）招募现场营销岗位，持续推进 GTM，但这类信号不足以证明公司已具备公开市场上市条件
              [CV012]。所分配证据中，未见经审计的收入过渡表、ARR 定义、毛利率拆分、留存队列、自由现金流状况、股东持股明细、清算分配顺序或经核实的普通股交易
              [CV016]。在评估退出方案前，投资人应获取经审计的财务报表、分队列留存与扩张数据、硬件与订阅各自的经济模型、债务与优先股文件、完全稀释后的股权结构表、董事会及公司治理材料，以及当前老股交易意向。破坏投资逻辑的触发条件包括：经核实的客户留存恶化、扣除硬件成本后毛利率疲软、安全管控缺陷悬而未决，或融资条款将下行风险不成比例地转嫁给新进资本
              [CV009, CV010, CV011, CV015]。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: 附表与图表
        blocks:
          - type: callout
            title: 定价不能脱离条款
            body: $5.8 billion 这一名义估值不足以为新进资本定价。入场判断必须掌握证券类别、清算优先权、稀释程度、持股比例、债务偿还顺位以及经核实的运营分母。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV016
