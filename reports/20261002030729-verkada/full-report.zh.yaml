        title: 补充图表与说明
        blocks:
          - type: callout
            title: 披露的体量指标是预订额，而非收入
            body: 当前最坚实的商业披露为超过 $1 billion 的年化预订额。现有材料未载明绝对收入、ARR、毛利率或造血现金流，因此切勿将预订额指标直接折算为这些财务数据。
            calloutType: insight
