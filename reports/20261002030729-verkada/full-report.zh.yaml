      - number: '7.3'
        title: 渠道摩擦、价格上调与财务可持续性
        blocks:
          - type: paragraph
            body: >-
              Verkada 采取专业系统集成商、认证现场技术人员与直销团队相结合的混合 GTM 模式分销其方案 [CR009, CR010]。然而，工程商社区不断传出关于渠道冲突的抱怨，特别指责 Verkada
              的企业直销代表频繁绕过本地集成商合作伙伴直接促成交易 [CR006, CR010]。在采购环节，从业者论坛充斥着对其激进地推打法、价格缺乏公开透明度需向销售询价、以及强制锁定固定续约周期的多年期合同的指责
              [CR005, CR006]。2026 年 6 月 5 日，Verkada 以 AI 算力、内存、存储及关税支出上涨为由，将旗下 193 款 SKU 的官方标价上调 5% 至 15% [CR006]。尽管依托
              OMNIA R250206 等公共采购框架协议的政府客户可锁定价格至 2028 年 3 月，但商业企业客户面临着每台设备每年 $199 至 $1,799 不等的软件续约年费累加 [CR006]。财务维度上，伴随
              CapitalG 领投，Verkada 估值在 2025 年 12 月攀升至 $5.8B，年化预订额突破 $1B，服务 30,000 家企业客户 [CR011, CR012]。然而，全球业务扩张、硬件制造以及维持
              10 年期产品质保的高资本密集度，一旦遭遇硬件关税攀升或云端算力成本上涨，将带来严重的毛利承压风险 [CR006, CR008, CR013]。
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
