      - number: '6.2'
        title: 采纳深度与增购扩张信号
        blocks:
          - type: paragraph
            body: >-
              最明确的商业信号体现于跨产品线的增购拓展，而非官方公布的留存率。Verkada 2026 年 3 月的公告称，78% 的核心客户使用了至少两条产品线，54% 使用了至少三条，且客户前 12
              个月的平均支出较初期近乎翻倍。这些数字显示其“先落地后增购”（land-and-expand）模式可能有效，但数据皆出自官方口径，“核心客户”缺乏明确界定，平均数亦无法反映不同客户队列的具体分布。此外，Verkada
              针对 10 个市场逾 2,700 名 IT 与物理安防负责人展开的另一项自研问卷调查显示，39% 的受访者仍在试点评估 AI，41% 已在积极使用。该调查反映的是全行业买方的接纳意愿，并非 Verkada
              自身客户的后台真实遥测数据，因此不可解读为产品留存率或已实现的增购业绩。
            claimRefs:
              - CU003
              - CU004
              - CU005
