      - CE005
      - CE007
      - CE009
  - id: TE003
    title: 技术架构与运行技术栈对比
    columns:
      - 架构层级
      - Verkada 实现方式
      - 传统开放平台替代方案
      - 运营权衡
      - 固有失效模式 / 尽调风险
    rows:
      - - 边缘设备硬件
        - 集成固态存储、安全加密处理器与硬件加速的专有 IP 摄像机
        - 接入本地交换机、来自多家厂商（Axis、Hanwha、Bosch）的标准通用 ONVIF/RTSP IP 摄像机
        - 开箱即用的即插即用体验，对比按点位灵活选用专用硬件的灵活性
        - 一旦停订云端软件，硬件将彻底报废
      - - 本地存储与算力
        - 直接在摄像机闪存上完成分布式边缘录像（30–365 天）；运行边缘计算机视觉推理
        - 依赖恒温恒湿机房的本地集中式 NVR 服务器、RAID 硬盘阵列或 SAN 存储设备
        - 消除了 NVR 硬件单点故障风险，省去了服务器运维成本
        - 若内置固态硬盘达到写入寿命极限，摄像机更换成本极高
      - - 网络传输
        - 仅向 AWS 云端发起单向出站 TLS 1.2+ 加密隧道；单台摄像机稳态占用带宽 20–50 kbps
        - 经由本地局域网向本地 NVR 服务器持续传输大带宽 RTSP 视频流（单台摄像机 2–8 Mbps）
        - 极低的稳态 WAN 占用，对比本地局域网持续流传输的高开销
        - 互联网上行带宽饱和时，实时画面预览与远程视频导出质量急剧劣化
      - - 管理与分析控制面
        - 多租户云平台（Command）提供集中式 Web/移动端 GUI、自动更新与全局检索
        - 部署在 Windows/Linux 服务器上的本地 VMS 软件（Milestone、Genetec），且需要专用客户端工作站
        - 无需 VPN 即可随时随地访问，对比机构对数据主权的完全自主掌控
        - 容易受到中心化云服务中断或厂商级凭据泄露事件冲击
    notes: 对比参数取自 Acre Security 替代方案基准评测、Kinettix 安装商指南及 HTS 架构文档。
