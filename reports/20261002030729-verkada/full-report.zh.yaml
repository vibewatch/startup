              tone: critical
            - label: 高
              tone: high
            - label: None
              tone: negative
            - label: 严重
              tone: critical
        - label: FTC同意令与监管禁令
          values:
            - label: 严重
              tone: critical
            - label: 中
              tone: medium
            - label: 中等
              tone: opportunity
            - label: 高
              tone: risk
        - label: 渠道冲突与代理商去中介化
          values:
            - label: 高
              tone: risk
            - label: 高
              tone: high
            - label: 低
              tone: warning
            - label: 高
              tone: risk
        - label: 云端依赖与网络中断
          values:
            - label: 高
              tone: risk
            - label: 中
              tone: medium
            - label: 中等
              tone: opportunity
            - label: 中
              tone: warning
        - label: 供应链与硬件关税成本上升
          values:
            - label: 中
              tone: warning
            - label: 高
              tone: high
            - label: 中等
              tone: opportunity
            - label: 中
              tone: warning
        - label: 高管与销售团队人员流失
          values:
            - label: 中
              tone: warning
            - label: 中
              tone: medium
            - label: 中等
              tone: opportunity
            - label: 中
              tone: warning
    approximationNotes: 各项评估基于对监管机构调查结论、客户评价数据集及渠道调研报告的定性综合归纳。
    claimRefs:
      - CR001
      - CR005
      - CR006
      - CR007
      - CR010
  - id: FV001
    title: 投资建议推演逻辑
    type: flow
    summary: 该定性决策链将公司对外宣称的商业规模与支撑定价及投资回报所需的关键缺失证据区分开来。
    data:
      nodes:
        - id: reported-scale
          label: 宣称的业务规模
          detail: $1B+ 年化预订额与 30,000+ 家客户机构
        - id: private-mark
          label: 一级市场估值标杆
          detail: $5.8B 融资估值
        - id: denominator-check
          label: 分母口径核验
          detail: 预订额不等于会计收入、ARR 或现金流
        - id: downside-evidence
          label: 下行情景证据
          detail: 高额成本、生态锁定与历史安全漏洞隐患
        - id: terms-gap
          label: 投资条款与财务数据缺口
          detail: 缺少经审计的财务数据、股权结构表或优先清算分配顺序
        - id: decision
          label: 观察 / 继续研究
          detail: 估值偏高且缺乏验证支持
      edges:
        - from: reported-scale
          to: private-mark
        - from: private-mark
          to: denominator-check
        - from: denominator-check
          to: downside-evidence
        - from: downside-evidence
          to: terms-gap
        - from: terms-gap
          to: decision
    approximationNotes: 推演序列为定性梳理；并不隐含发生概率、转化率或收入倍数估算。
    claimRefs:
      - CV002
      - CV007
      - CV008
      - CV010
      - CV013
      - CV015
      - CV016
