              - CE006
              - CE011
      - number: '5.2'
        title: 边缘存储架构、运行机制与基础设施依赖
        blocks:
          - type: paragraph
            body: >-
              Verkada 平台的技术核心是一套混合云架构，在边缘硬件与云端服务之间精细划分计算、存储与网络负载。传统的 IP
              视频监控系统通常需要通过局域网将高码率视频流持续传输至集中的网络录像机（NVR）或存储区域网络（SAN），而 Verkada
              摄像机则直接录制到机载固态闪存内。这种边缘存储架构将常态化出站带宽占用压至极低水准，仅保留每台摄像机约 20–50 kbps
              的元数据流，用于心跳上报、云端索引与缩略图生成。只有当授权人员主动调阅实时画面、导出事件录像片段或发起云端备份归档时，全高清视频才会在本地网络传输并上传至云端。本地录像可在机载存储中保存 30 天至 365
              天不等，具体视采购时选配的固态存储规格而定。在云端，Command
              管理后台集中处理统一身份与访问控制（IAM）、多租户权限管控、固件自动推送升级以及计算机视觉索引。不过，这种混合拓扑结构引入了显著的企业级网络依赖。现场安装人员指出，要确保多分支部署稳定运行，必须进行严苛的网络分段、配置专属虚拟局域网（VLAN），并预留充裕的以太网供电（PoE）功率预算以防摄像机欠压跌落。此外，尽管本地缓存能保障断网时摄像机持续录制，但远程监看、云端报警推送与后台配置管理则完全仰赖畅通的公网出站连接。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE005
              - CE007
              - CE009
      - number: '5.3'
        title: 企业级部署、安全治理与架构锁定
        blocks:
          - type: paragraph
            body: >-
              Verkada 系统的企业级部署流程与传统物理安防集成形成鲜明反差。其物理安装彻底省去了配置网络录像机、维护本地操作系统补丁、在防火墙开放入站端口或安装繁琐客户端软件的环节。Kinettix 与
              High-Tech Systems 等专业交付服务商可将精力集中于硬件设备点位安装、综合布线认证，以及借由扫描二维码快速将设备批量接入 Command
              仪表板。面向遍布零售网点、高校园区和医疗网络的多分支企业，这种标准化上线模式大幅压缩了价值兑现周期，仅需极少驻场 IT 人力即可快速交付多栋楼宇。Command
              的安全治理模块集成了企业单点登录（SSO）、基于角色的访问控制（RBAC）、多因素身份验证（MFA）以及针对运维人员调阅录像的自动化审计日志。边缘设备上的静止数据采用 AES-128
              加密防护，广域网传输链路则采用 TLS 1.2 或更高标准加密。尽管运维效率出众，来自 Acre Security、Spiceworks 和 CheckThat.ai
              的技术评测与从业者分析均指出了极其深固的架构切换壁垒。Verkada 硬件终端不支持与第三方视频管理软件互通所必需的开放 ONVIF（开放型网络视频接口论坛）或
              RTSP（实时流传输协议）标准。一旦企业停缴年度软件许可费，物理摄像机硬件将无法按设计预期运转，根本无法改换门庭接入其他平台重新利旧。因此，企业买方必须在开箱即用云管平台带来的显著提效，与长期厂商依赖及刚性订阅开销之间反复权衡。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE008
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: 补充图表与说明
        blocks:
          - type: callout
            title: 私有架构锁定与订阅依赖
            body: >-
              Verkada 将边缘硬件与自研 Command 云平台紧密咬合，实现了极其出色的初期安装与管理响应速度。然而，这种紧密集成也意味着不可逆的架构绑定。由于 Verkada 硬件不开放标准的 ONVIF 或
              RTSP
              视频流，摄像机无法接入第三方视频管理软件。企业一旦任由按台计费的软件订阅失效，物理摄像机硬件将无法按设计预期运行，若想切换至其他安防平台，只能承受推倒重来的彻底重置性资本开支（rip-and-replace）。
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基本盘与细分行业覆盖
        blocks:
          - type: paragraph
            body: >-
              Security Sales & Integration 转载的 Verkada 2026 年 3 月官方公告显示，其客户群突破 31,000 家机构，装机规模覆盖 171 个国家逾 200
              万台在线设备。官方公布的客户案例库提供了更广泛的定性细分画像：具名客户横跨教育、医疗与养老、零售与餐饮、物流、工业园区、体育场馆、政府、酒店及科技企业。由此可见，采购方并非单一的安防负责人。公开案例表明，通常是由物理安防、设施管理、IT
              及运营团队共同联合评审选型，终端使用者则涵盖调查人员、园区管理员直至门禁安保人员。作为对外宣传的标杆案例库，其覆盖广度令人信服，但现有材料并未披露按垂直行业、地理区域、客户规模或收入贡献划分的客户结构。
            claimRefs:
              - CU001
              - CU002
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
