  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    columns:
      - 情景
      - 必要假设前提
      - 估值与回报逻辑
      - 核心下行触发因素
      - 概率信号
    rows:
      - - 乐观
        - 预订额顺利转化为稳定经常性收入，客户留存强劲、综合利润率良好，且安全整改成效得到实质验证。
        - 较最新 $5.8B 估值溢价或有合理依据，但现有资料不足以支撑推导具体数值区间或目标回报率。
        - 经审计的转化率或利润率数据未达投资底线要求。
        - 仅在经审计的 KPI 与内控体系得到证实后，概率方见提升。
      - - 基准
        - 自报业务规模得以维持，但单位经济模型与安全内控仅有部分证据支撑。
        - 以最新 $5.8B 估值或其下方为锚点，且需附带投资人保护条款；无法得出确切的普通股价值。
        - 尽调中暴露出条款包袱或同期群表现疲软。
        - 当前公开证据最为直接地支持这一有条件推断的情景。
      - - 悲观
        - 持续订阅成本、锁定架构或安全隐患引发留存率下滑、降价打折或上市退出筹备受阻。
        - 需对最近一轮估值大幅折价；现有证据无法推算出明确的下行保底线。
        - 证实存在客户流失、利润率承压、内控失效或苛刻的高级优先清算权条款。
        - 若客户背调或审计财务数据证实负面信号，发生概率将上升。
    notes: 鉴于所给资料缺乏经审计的收入、ARR、利润率、现金流、股权结构条款及可比交易倍数，各情景分析审慎采用定性描述。
    claimRefs:
      - CV001
      - CV002
