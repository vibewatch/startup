      - number: '1.4'
        title: 近期业务走向与风险背景
        blocks:
          - type: paragraph
            body: >
              披露的发展轨迹显现出资本、客户与产品线的同步扩张。2025 年 12 月 CapitalG 领投之际，年化预订额突破 $1 billion。到 2026 年 3 月，公司披露客户数突破 31,000
              家，年收入同比增长 30%，并在亚特兰大、芝加哥、达拉斯、洛杉矶及迪拜设立新办公室。2026 年 9 月，一家实施合作伙伴披露其业务进一步延伸至交通安防、云管音频、热成像摄像机、火警监控以及外部 AI
              集成。鉴于该发布分析来自提供 Verkada 服务的合作方，其性质属于辅助佐证的产品证据，并非独立的第三方基准评测。


              材料库中的负面信号来自一家 2026 年的测评聚合网站，该站综合了用户评价、从业者社区讨论、FTC 调查材料及公司安全事件报告。它将持续性成本、私有架构锁定、云端依赖、激进销售手段，以及 2021 年数据泄露和
              2024 年 FTC 和解协议列为买方尽调的核心问题。该信源对发现疑点很有价值，但无法替代对底层监管记录、合同条款、安全审计报告、续约条件及安全事件归档文件的实质审查。
