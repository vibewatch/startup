              月 Nasdaq Private Market、Public.com 及 Forge 等非公开市场的每股参考报价在 $10.04 至 $10.50
              之间，但各平台计价日期与核算方式不一，也无法反映公司账面实际可支配的现金余额。Forge 还报道称，Verkada 预计到 2027 年才能实现全年自由现金流转正。这一表述并非具体的烧钱速度（burn
              rate）披露，无法据此测算资金跑道。因此财务面评估呈现两面性：商业规模与融资通道毋庸置疑，但利润率路径、现金余额、月度烧钱速度、负债义务、资本支出、营运资金以及下轮融资触发条件依然没有公开。投资决策必须以经审计的财务报表及管理层提供的现金流勾稽表为准。
