            title: 控制权与安全性尽调仍待展开
            body: 公开渠道未披露股权、投票权、投资人优先权或董事会专业委员会设置，而负面评测直指厂商锁定、成本负担、云端依赖及既往安全与监管事件。这要求必须获取一手法律、合同与安全合规证据。
            calloutType: risk
