  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、解决方案范畴与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              商业物理安全市场覆盖电子监控系统、物理门禁控制系统（PACS）、环境监控、防盗报警及配套集成服务。以往，企业园区依赖多厂商拼凑的碎片化架构：将 Axis Communications 或 Hanwha
              Vision 等厂商生产的模拟或 IP 摄像机，与本地网络硬盘录像机（NVR）、独立服务器机架及分离的门禁面板连接在一起。Verkada
              打破了这一边界，将自带边缘存储的摄像机硬件、云端门禁控制器、环境传感器与职场对讲机整合为一体化混合云平台，仅凭单一 Web 界面即可统一管理。公司省去本地 NVR
              基础设施、服务器维保合同以及专属客户端软件安装，直接争夺以往流向专业安防系统集成商的 IT 与物理设施预算。然而，这种一体化模式刻意排斥传统开放平台集成，Verkada
              硬件仅能在其自研云环境中运行，迫使客户在开箱即用的简便体验与多厂商模块化灵活性之间做出明确的技术选型取舍。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM008
              - CM010
      - number: '2.2'
        title: 市场规模测算视角与受限的可触达机会
        blocks:
          - type: paragraph
            body: >-
              行业市场测算显示，电子安防基础设施的总体支出极为庞大。据 ResearchAndMarkets 测算，北美物理安全市场规模预计将从 2021 年的 $37.4 billion 增长至 2026 年的 $48.2
              billion，复合年均增长率（CAGR）为
              5.2%；其中视频监控是体量最大的系统板块，服务业务增速最快。在这一广阔的总可用市场（TAM）中，面向现代企业云管物理安全的可服务市场（SAM）明显收窄。若机构在既有开放架构摄像机上沉没成本过高、面临严格的本地物理隔离数据保留指令，或受制于特定合规框架，往往会拒绝封闭生态。Verkada
              的可获取市场（SOM）主要集中于绿地新建项目、分布式多分支商业企业、教育园区及亟需削减 IT 运维开销的区域医疗网络。据公司披露，Verkada 年化预订额已逾 $1 billion，业务遍布 171
              个国家，服务逾 31,000 家客户，在线设备超 200 万台，在中端市场与大型企业新建项目中展现出强劲的 SOM 渗透力。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM010
              - CM011
      - number: '2.3'
        title: 买方分层、预算归属与落地阻力
        blocks:
          - type: paragraph
            body: >-
              商业物理安全的采购决策权出现组织迁移，从传统后勤设施主管转向企业首席信息官（CIO）与首席信息安全官（CISO）。多分支企业、K-12 学区、地方政府与医疗机构日益从企业 IT
              安全、网络带宽占用及自动化合规维度审视物理安全终端。云管部署大幅缩短上线周期并降低日常管理负担，独立研究机构 IDC 的研究也指出，部署该方案的机构 IT
              管理效率显著改善，安全事件调查速度大幅加快。然而，商业依赖与生命周期风险对实际采用形成切实约束。行业安防集成商强调，Verkada
              的私有许可模式带来了尖锐的厂商锁定：机构必须持续强制续费订阅才能维持硬件运转；企业一旦终止云端合同，摄像机便无法改接开放平台视频管理软件（VMS）重新利用。因此，采购团队必须在初期快速交付的便捷与长期架构切换成本之间做出明确权衡。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM012
              - CM013
              - CM015
              - CM016
      - number: '2.4'
        title: 补充图表与说明
        blocks:
          - type: callout
            title: 极简体验与架构依赖的权衡
            body: >-
              Verkada
              的商业拓展速度印证了买方对统一云端体验的强烈需求：客户更青睐这种体验，而不是复杂的本地安防服务器运维。然而，企业客户也承受着沉重的长期锁定：硬件终端无法与专有云许可解耦，多年合同续约之际，厂商掌握了极高的定价话语权。
            calloutType: insight
            claimRefs:
              - CM005
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争全景与买方替代选项
        blocks:
          - type: paragraph
            body: >-
              这一目标市场远不止云管摄像机。从现有证据看，Rhombus 是最直接的同类竞对，同样主打机载存储、云端管理和按单摄授权模式来争取相同买方。Avigilon 面向大型机构提供本地部署的 Unity 系列与云管
              Alta 系列双重选择；Eagle Eye Networks 和 Coram 主打利旧现有摄像机资产。Ubiquiti UniFi Protect 与 Uniview 属于经常性支出更低的替代方案，以本地 NVR
              硬件所有权为核心；而 Axis 搭配第三方 VMS
              则是老牌的开放平台路线。行业现状多为企业自行维护或由集成商打理的摄像机、录像机与门禁混合系统。该路线运维工作较重，但保留了采购选择权。由于比对资料多由集成商或竞对发布，而非独立基准测试，竞品规模、融资额及未证实数据依然是明确的证据缺口。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
            claimRefs:
