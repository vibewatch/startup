      - number: '3.4'
        title: 壁垒持久度与尽调结论
        blocks:
          - type: paragraph
            body: >-
              若买方看重单一整合操作界面且希望尽量免除本地维护，其护城河看似最为稳固。官方披露显示其装机体量庞大，但引用的客户数、设备量、估值和年化预订额皆出自公司单方口径，无法证明留存表现、竞标胜率或优异的单体经济模型。而在现有设备能够利旧、或
              IT 团队具备维护能力且愿以本地管理换取更低经常性许可费用的场景下，护城河持久度明显变弱。评测材料印证了这两面性：CheckThat 报道其在 G2
              上口碑良好，但同时也指出费用昂贵与私有锁定是买方反复提及的抗拒理由，2021 年数据泄露与 2024 年 FTC
              和解协议更是挥之不去的信任尽调疑点。因此，投资结论带有前置条件：一体化整合与既有装机群的切换成本可以守护存量客户，但开放平台迁移路径与采购降本压力会侵蚀这一防线。目前仍需获取具有可比性的续约报价、流失率、竞对竞标得失数据以及经独立验证的安全横评。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: 补充图表与说明
        blocks:
          - type: callout
            title: 公开建议零售价不等于实际全生命周期成本
            body: >-
              $339,800
              的测算模型有助于看清硬件与软件许可费用的配比结构，但未计入实施、日常运维、增选服务、商务折扣、续约涨价及退出迁移等成本。投资评估必须获取相同设备数量、保留时长、系统集成、技术支持及合同条款下的可比厂商真实报价。
            calloutType: risk
            claimRefs:
              - CP011
              - CP013
          - type: callout
            title: 一体化整合既是产品价值也是切换阻力
            body: 统一的管理操作后台能精简运维流程，却也会显著增加日后替换系统的破坏成本。护城河能否持久，取决于节约的运维开销能否长期压过持续的软件许可负担，以及压过保留硬件与供应商选择权所带来的商业价值。
            calloutType: insight
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP009
              - CP012
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与收入质量
        blocks:
          - type: paragraph
            body: >
              Verkada
              将私有物理安全设备与云端管理平台紧密绑定，因此其商业模式同时包含硬件销售与经常性软件收入。现有材料在摄像机业务上的描述最为明确：独立评测指出其收取持续的单摄许可费，并称脱离软件后硬件将无法按设计预期运行；Verkada
              自身也将其定义为软硬一体的云平台。该结构固然能带来持久的续约收入，但也让软件收入流高度依附于专有硬件终端的持续使用。Verkada
              官方披露的大型客户多产品线采纳情况表明，其在摄像机、门禁、传感器、对讲与报警系统之间具备交叉销售潜力。但公开材料未披露软硬件收入构成比例、实际合同签约价、收入确认政策或各业务条线的毛利率，因此绝不能将年化预订额视同已确认收入或到手现金。
