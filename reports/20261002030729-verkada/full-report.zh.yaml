      - number: '3.2'
        title: 产品能力与市场定位
        blocks:
          - type: paragraph
            body: >-
              Verkada
              最鲜明的差异化优势在于原生产品广度：官方与合作方资料均显示，视频安防、门禁控制、传感器、对讲机与报警系统统一收拢在同一套管理后台之下。这种广度对渴望精简管理链路、减少多供应商交接的多分支买方最具吸引力。替代方案主要沿两个维度分化：Rhombus
              较贴近 Verkada 的硬件驱动型云模式；Avigilon 保留了灵活的部署路径选择；Eagle Eye Networks 和 Coram 在旧摄像机利旧能力上得分更高；本地 NVR
              替代品则以让渡开箱即用体验为代价，要求运营方承担更多维护职责。因此，定位图谱依据已披露的架构属性给出分析师自定的序数评分，并非展示实测性能数据。分配的资料中没有任何信源对各厂商的算法准确率、正常运行时间、网络安全控制、实施人工投入或全流程调查响应速度提供过受控的基准测试。
