  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构、统一工作流与解决方案组合
        blocks:
          - type: paragraph
            body: >-
              Verkada 依托自研的云端管理门户 Verkada Command
              构建起一体化物理安全与企业设施管理平台。该平台并未将视频监控、门禁控制、楼宇报警、空气质量监测与访客管理拆分为相互孤立的割裂系统，而是将各异的物理硬件终端统一标准化至同一套网页端与移动端界面。现场部署实践表明，终端设备一旦接入以太网供电（PoE），首要用户工作流即刻启动：设备自动与云端建立出站加密连接，无需端口转发、本地录像服务器或虚拟专用网（VPN）。IT
              主管与安防运维人员均可在单一界面处理日常管理工作流，包括实时监控、历史录像检索、门禁排程、紧急封锁、环境异常排查及访客工牌发放。官方商业资料将软硬件产品库归拢为核心产品线：视频安防（涵盖半球机、枪机、楔形机、鱼眼机及多传感器摄像机）、门禁控制（门禁控制器、无线门锁与手机电子凭据）、报警系统（入侵传感器、监控控制台与无线紧急求助按钮）、对讲系统（可视对讲终端与主控工作站）、环境传感器（电子烟监测、空气质量与噪声分贝监测）、职场工具（访客登记机与收发室管理）、网络网关（蜂窝
              LTE 路由器与工业级车载网关）以及音频系统（网络音频播放器与 IP 号角扬声器）。这套全面的产品矩阵固然将设施管理简化为直观的消费级操作体验，却也建立起一套封闭的操作系统——物理硬件终端完全无法脱离
              Verkada 的软件独立运行。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE006
          - type: figure
            figureRef: FE001
            claimRefs:
