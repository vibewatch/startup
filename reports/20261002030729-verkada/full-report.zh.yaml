    title: 投资假说与反方论点表
    columns:
      - 视角
      - 基于证据的论据
      - 改变观点的潜在条件
    rows:
      - - 看多逻辑
        - 公司官方材料公布了逾 30,000 家客户机构、超过 200 万台设备，以及超过 $1B 的年化预订额。
        - 经审计的经常性收入增速、客户留存率、毛利率及现金转化指标将强化这一逻辑。
      - - 反方论点
        - 独立评测综合分析指出，持续订阅成本、私有架构锁定以及历史安全隐患可能对留存率和定价能力构成压力。
        - 若能证实整改落地、获得满意的客户背景调查、具备开放迁移路径并展现稳定的同期群表现，将缓解对下行风险的担忧。
      - - 估值纪律
        - 私募估值上涨 29% 的同时，并未公开披露持股比例、优先清算权、股权稀释程度或经核实的一级半/二级市场交易价格。
        - 唯有清晰的股权结构表（cap table）、清算优先分配顺序（liquidation waterfall）以及公允的普通股参考价，才能合理评估入场价值。
    notes: 看多论据采用公司自报业务规模；反方论据基于第三方评测综合归纳；二者均无法替代经审计的财务尽调。
