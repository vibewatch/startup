          label: 整体系统市场（视频、门禁、报警、传感器）
          value: 28000
        - id: sam-surveillance
          label: 视频监控系统细分市场（最大系统门类）
          value: 16000
        - id: som-commercial
          label: 商用与机构网络物理安防 SOM
          value: 8000
        - id: som-cloud
          label: 云原生商用与机构安防 SOM
          value: 4500
        - id: realized
          label: Verkada 落地规模：$1B+ 年化预订额
          value: 1000
    approximationNotes: TAM 数据基于 ResearchAndMarkets 对 2026 年北美市场的预测；系统、视频监控和 SOM 各层级反映行业细分测算比例；落地规模代表 Verkada 自报的年化预订额。
    claimRefs:
      - CM006
      - CM008
      - CM010
  - id: FP001
    title: 竞争定位序数评估：设备生态开放度 vs. 原生套件广度
    type: quadrant
    summary: 基于现有证据的序数定位，将各厂商的硬件利旧能力与其原生物理安防套件的广度加以区分展示。
    data:
      xAxis:
        label: 设备生态开放度与摄像头利旧能力（由低到高）
        min: 1
        max: 5
      yAxis:
        label: 原生一体化套件广度（由低到高）
        min: 1
        max: 5
      points:
        - label: Verkada
          x: 1
          'y': 5
          detail: 原生套件覆盖广；所给证据突出其私有硬件深度绑定的特征。
        - label: Rhombus
          x: 2
          'y': 4
          detail: 具备相近的云端管理产品广度，辅以有限的利旧摄像头桥接能力。
        - label: Avigilon
          x: 3
          'y': 4
          detail: 云端与本地部署两条产品线并存，提供更多样化的部署选项。
        - label: Eagle Eye / Brivo
          x: 5
          'y': 3
          detail: 具备广泛的摄像头适配与门禁控制能力，但缺乏统一原生设备技术栈的佐证。
        - label: Coram
          x: 5
          'y': 4
          detail: 公司宣称可在视频、门禁、访客与应急场景中利旧存量摄像头。
        - label: UniFi Protect / Uniview
          x: 2
          'y': 2
          detail: 本地 NVR 替代方案，持续软件许可支出更低，买方拥有更高自主运营权。
    approximationNotes: 各评分为分析师仅根据所给资料给出的 1 到 5 序数分值；并非实测性能、市场份额、安全性或成本基准，信息发布方偏差削弱了数据置信度。
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
      - CP005
      - CP007
      - CP009
  - id: FI001
    title: 商业模式证据流向图
    type: flow
    summary: 严格基于现有证据梳理的业务流向：涵盖企业级直销、硬件交付、持续许可订阅、预订额、确认收入直至未披露的毛利润。
    data:
      nodes:
        - id: buyer
          label: 企业或机构买方
          detail: 定制化产品演示是公开证据中体现销售人员协助拓展的佐证；CAC 与销售周期均未披露。
        - id: hardware
          label: 私有安防硬件
          detail: 摄像头及其余物理安防产品构成了前置硬件销售环节。
        - id: license
          label: 经常性云许可
          detail: 第三方评测报告指出，单摄像头一年期许可官方建议零售价（MSRP）为 $219。
        - id: expansion
          label: 多产品线扩张
          detail: Verkada 称超过 70% 的大型客户使用至少两款产品。
        - id: bookings
          label: 年化预订额
          detail: 公司声称该指标已突破 $1 billion 里程碑；但不等同于会计收入。
        - id: revenue
          label: 已确认收入
          detail: 第三方报道的 2026 年预期收入约为 $700M；公开资料中未见收入确认勾稽过渡表。
        - id: gross-profit
          label: 毛利与自由现金流
          detail: 利润率与现金转化情况未予披露；据报道，全年自由现金流要到 2027 年才可能转正。
    approximationNotes: 仅代表逻辑推演流程。未推算转化率、利润率数值、在手订单余额（backlog balance）或预订额至收入的折算关系。
    claimRefs:
      - CI001
      - CI003
      - CI006
      - CI008
      - CI009
      - CI010
      - CI014
      - CI016
  - id: FE001
    title: Verkada 混合云架构技术栈
    type: stack
    summary: 展示硬件边缘终端、分布式本地存储、加密传输、集中式云服务、企业身份联合认证与最终用户管理应用的六层架构模型。
    data:
      layers:
        - label: 客户端应用与管理界面
          detail: 统一的 Verkada Command 网页端控制台、原生 iOS/Android 移动端应用及专用监控大屏工作站（viewing stations）
        - label: 企业身份与治理层
          detail: SAML 2.0 单点登录（SSO）、SCIM 目录同步配置（Okta、Azure AD）、基于角色的权限控制及审计日志
        - label: 云端Command与计算机视觉引擎
          detail: 多租户云编排、AI 驱动的人员 / 车辆检索、固件自动化滚动更新及云端视频切片归档
        - label: 加密传输与网络网关
          detail: 仅限出站的 TLS 1.2/1.3 加密隧道、低稳态广域网（WAN）带宽占用（20-50 kbps）及可选的蜂窝 LTE 备用连接
        - label: 边缘计算与固态存储
          detail: 摄像头本地视频处理、板载闪存保留周期（30-365 天）、静态数据 AES-128 加密及局域网缓存
        - label: 物理硬件终端
          detail: 专有光学摄像头、门禁控制器、无线门锁、环境空气质量传感器及音频扬声器
    approximationNotes: 各层职责汇总自 Verkada 技术概述文档、HTS 工程总结与 Kinettix 网络部署指南中的公开技术规范。
    claimRefs:
      - CE002
      - CE005
      - CE006
      - CE011
  - id: FU001
    title: 客户采纳与扩张路径
    type: journey-map
    summary: 涵盖从初识、试点、部署到扩张的定性路径，最终进入续约决策环节；此时未披露的留存指标与据报道的生态锁定问题将成为关键实质因素。
    data:
      nodes:
        - id: discover
          label: 初识阶段
          detail: 直销行业展会与渠道合作伙伴推介该统一平台。
          touchpoints:
            - EDUCAUSE demonstration
            - HBS partner engagement
        - id: pilot
          label: 试点
          detail: 采购方测试工作流、权限治理、系统集成以及业务适配度。
          touchpoints:
            - AI feature pilot
            - Site workflow validation
        - id: deploy
          label: 部署
          detail: 摄像头、门禁、音频或其他模块接入客户现场环境。
          touchpoints:
            - Initial product line
            - Administrator onboarding
        - id: operate
          label: 运营
          detail: 用户集中开展事件调查与多分支机构管理。
          touchpoints:
            - Unified interface
            - Remote management
        - id: expand
          label: 扩张
          detail: 增配产品线和扩充网点，提升单客支出与平台绑定深度。
          touchpoints:
            - Two-or-more product adoption
            - First-year spend expansion
        - id: renew
          label: 续约或重新评估
          detail: 采购方权衡运营价值、持续经常性成本与专有硬件生态锁定之间的关系。
          touchpoints:
            - Renewal review
            - Switching-cost assessment
    approximationNotes: 依据指定资料来源综合归纳的定性业务逻辑顺序；并非实测漏斗数据，不包含转化率测算。
    claimRefs:
      - CU003
      - CU004
      - CU011
      - CU012
      - CU013
      - CU016
  - id: FR001
    title: 企业风险评估矩阵
    type: matrix
    summary: 从影响程度、发生概率与缓解措施成熟度三个维度评估Verkada面临的主要风险。
    data:
      columns:
        - 影响程度
        - 发生概率
        - 缓解成熟度
        - 剩余风险等级
      rows:
        - label: 专有生态系统锁定
          values:
