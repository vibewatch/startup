      - number: '1.2'
        title: 创始人领导架构与治理透明度
        blocks:
          - type: paragraph
            body: >
              一份 2026 年投资人俱乐部资料将 Filip Kaliszan、Benjamin Bercovitz、James Ren 与 Hans Robertson 列为联合创始人，并指出 Kaliszan 担任
              CEO、Robertson 担任 COO、Bercovitz 担任 CTO。这使得三个最核心的业务运营职能高度集中于创始团队，也在继任计划、授权机制与关键人才留存上引出尽调诉求。现有公开证据无法确认 Ren
              当前的具体运营角色，也缺乏经过核实的履历来支撑更广泛的“创始人与市场契合度”（founder-market-fit）主张。


              Tracxn 列出了 7 位现任董事会成员，涵盖上述 4 位创始人以及 Bill Trenchard、Lak Ananth、Kameron Rezai 和 Tim Wilcox。该页面将 7
              人全数标注为“独立董事”，这与创始人履职的实际情况明显冲突，绝不能视为经验证的真正独立性。此外，现有材料也未披露投票权归属、投资人指定席位、持股比例、老股交易或各委员会架构。因此，治理质量与实际经济控制权仍属关键的非公开证据疑问，不能当作既定优势。
            claimRefs:
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
      - number: '1.3'
        title: 资本结构、估值与股东图谱
        blocks:
          - type: paragraph
            body: >
              融资数据的公开披露在方向上大体一致，但未完全对齐。Tracxn 记录其经由 12 轮融资累计筹集 $757 million，而一份 2026 年 8 月整理的概览表则记录其经由 11 轮筹集超过 $756
              million。两家数据源都印证了这是一家巨额融资的后期未上市企业，但轮次与累计金额仍需明确区分。当前最可靠的估值锚点是 Verkada 于 2025 年 12 月发布的公告：CapitalG
              领投一轮融资，将公司估值推升至 $5.8 billion，比同年早些时候 Series E 轮估值高出 $1.3 billion。


              据报道，投资机构阵容跨越早期风投、成长期资本与战略投资方。公开资料列出了 First Round Capital、Next47、Meritech、Sequoia、Felicis、Linse
              Capital、General Catalyst、CapitalG 以及 Nvidia 等机构。Tracxn 记录 2026 年 7 月 1 日有一笔未披露具体条款的 Series E 轮融资，Nvidia
              参与其中；但现有证据未载明该笔交易的募资额、估值、证券类型或治理权益。下达控制权或稀释结论前，仍须调阅最新的股权结构表与融资法律文件。
            claimRefs:
              - CO006
