            body: >
              现有材料中唯一具名列出的产品价格，是第三方引用的单台摄像机一年期软件许可 $219 的官方建议零售价。同一篇评测还援引了一位从业者的估算，称单台摄像机每年的软件许可与存储费用大约在 $200 至 $400
              之间，但这属于口头估算，并非经过验证的 Verkada 真实合同基准。该评测还指出公司于 2026 年 6 月 5 日上调了标价，但未透露具体涨幅。Verkada 亮相 EDUCAUSE
