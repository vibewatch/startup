      - number: '3.3'
        title: 定价机制、锁定风险与渠道分销
        blocks:
          - type: paragraph
            body: >-
              价格缺乏透明度本身就是一项尽调疑点。HTS 称其价格未公开，建议按具体部署方案索取报价；Umbrella Security Systems 则援引了 2026 年 6
              月美国公开的建议零售价（MSRP）总览。Umbrella 列举的 100 台摄像机案例中，100 台 CD43 摄像机硬件费用为 $119,900，配套必须购买的十年期单摄软件许可达
              $219,900，在计入安装、支架、交换机、UPS、人员培训、监看工作站、带宽、云端备份存储、更换人工或退出成本前，小计已达
              $339,800。此案例仅反映官方标价测算，不代表客户实际成交价，也不能用来对比毛利率。软件许可到期还会大幅推高切换摩擦：Umbrella
              报道称，宽限期过后，设备与配置访问权限以及报警功能将受限，即便联网设备在数据保留期内或许仍能录像。Verkada
              自身的活动与招聘资料表明，其分销仰赖产品演示、区域推广活动和合作伙伴主导的项目，而非单纯依靠线上直客需求。
