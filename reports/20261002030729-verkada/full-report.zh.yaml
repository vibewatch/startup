      - number: '8.2'
        title: 融资背景与证据质量
        blocks:
          - type: paragraph
            body: >-
              Tracxn 记录其经由 12 轮融资累计募集 $757 million，估值从 2024 年 12 月的投后 $4.5 billion 攀升至 2025 年 11 月的 $5.8 billion [CV005,
              CV006]。后者较前期估值上浮约 29%，但非公开融资轮次间的估值跳升无法反映优先股清算优先权、股权稀释比例、债权受偿顺位或普通股公允价值 [CV014]。信源质量同样削弱了结论的说服力：指派的
              Equitybee 页面充斥着无关的 Reddit 讨论而非切实可用的 Verkada 交易明细，而抓取的 Silicon Valley Investclub
              页面仅提供了泛泛的非公开市场投资风险免责声明，毫无具体交易数据 [CV007, CV008]。这些属于证据缺口，根本无法用作老股交易估值的支撑。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV014
      - number: '8.3'
        title: 投资逻辑、反向逻辑与情景推演
        blocks:
          - type: paragraph
            body: >-
              核心投资逻辑在于，若官方公布的体量——遍布 171 个国家逾 30,000 家机构、超过 200 万台在线设备——所代表的预订额能够顺利转化为持久、高毛利的经常性收入，公司有望成长为极具价值的平台型巨头
              [CV003, CV004]。反向投资逻辑则指出，高昂定价与切换阻力会削弱客户留存率或公司的议价权：第三方综合评测强调了按台计费的持续软件许可成本、私有架构锁定，以及 2021 年安全事件与 2024 年 FTC
              和解协议的深远影响 [CV009, CV010,
              CV011]。因此，情景推演主要基于定性判断：乐观情景必须以经审计的收入转化率与毛利率为凭；基准情景仅有条件地认同当前的估值锚点；悲观情景则假设客户流失或安全风险侵蚀盈利能力，估值须大幅折价 [CV015,
              CV016]。
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
