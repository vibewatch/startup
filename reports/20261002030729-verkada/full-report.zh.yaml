              - CR010
      - number: '7.4'
        title: 补充图表与说明
        blocks:
          - type: callout
            title: 零残值困境：硬件被“绑架”
            body: >-
              Verkada 平台最核心的商业脆弱点在于其封闭的运行架构：摄像机不支持 ONVIF 或 RTSP 开放标准，一旦云端许可断缴，设备便会彻底变砖瘫痪。传统的 IP 摄像机可以随时重定向接入
              Milestone、Genetec 或本地 NVR，而 Verkada 客户在终止合同后将面临前期硬件投入的彻底归零；这种畸形的切换壁垒正引来企业 IT 采购与风控委员会愈发严苛的审视。
            calloutType: risk
            claimRefs:
              - CR006
              - CR007
          - type: callout
            title: FTC 禁令：双刃剑式的治理合规防线
            body: >-
              针对 2021 年 150,000 台摄像机遭入侵事件，2024 年 8 月的 FTC 和解协议开出了破纪录的 $2.95M 反垃圾邮件罚单，并施加了长达 20 年的严苛合规要求；但由此促成的第三方强制审计与
              SOC 2 Type 2 认证，客观上倒逼 Verkada 保持着高于普通物理安防初创公司的数据安全水准。然而，日后任何轻微的内部疏漏或云端漏洞，都可能招致毁灭性的民事藐视法庭重罚。
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR008
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              当前给出的投资建议为观察 / 继续研究，对应中等置信度、高风险评级以及偏高 / 未经证实的估值立场。独立信源与官方公告共同印证了 $5.8 billion 的融资估值锚点，官方亦宣称年化预订额已突破 $1
              billion [CV001, CV002]。这是商业规模的佐证，不能视为确认收入、ARR、造血现金流或 5.8 倍市销率（P/S）的凭据。仅以披露数据做粗略上限测算，因分母超过 $1
              billion，测算出的估值约为年化预订额的 5.8 倍 [CV013]。在缺乏审计财务报表、股权结构表条款或经过验证的老股交易价格的情况下，公开证据无法支撑起精确的入场价格区间或预期投资回报率 [CV015,
              CV016]。
            claimRefs:
              - CV001
              - CV002
              - CV013
              - CV015
              - CV016
