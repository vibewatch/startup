chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、运营模式与披露规模
        blocks:
          - type: paragraph
            body: >
              Verkada 成立于 2016
              年，总部位于加州圣马特奥，销售整合视频安防、门禁控制、报警系统、对讲系统、环境传感器及访客或职场管理的一体化物理安全平台。公司将这些产品统称为统一云端平台，第三方资料则将公司定性为企业视频监控系统开发商。这一产品组合决定其商业模式是硬件驱动型软件，并非纯粹的软件订阅：客户采购并部署
              Verkada 硬件设备，借由官方云平台统一管理。


              公司披露的业务体量可观，但大多出自官方口径。Verkada 于 2025 年 12 月称，其设备覆盖 171 个国家、超过 30,000 家机构、在线设备逾 200 万台；2026 年 3
              月的官方公告将客户数进一步上调至 31,000 家以上。该公告还称财年收入同比增长 30%，却未披露绝对收入、ARR、毛利率或硬件与软件订阅的收入占比。因此，超过 $1 billion
              的年化预订额绝不能等同于确认收入。
            claimRefs:
              - CO001
