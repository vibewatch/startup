callouts:
  - calloutType: "risk"
    title: "A Public MSRP Is Not a Realized Lifecycle Cost"
    body: "The $339,800 scenario is useful for exposing the hardware-versus-license mix, but it excludes implementation, operations, optional services, discounting, renewal escalation, and exit. Underwriting should require comparable vendor quotes with identical device counts, retention, integrations, support, and contract terms."
    claimRefs:
      - "CP011"
      - "CP013"
  - calloutType: "insight"
    title: "Integration Is Both Product Value and Switching Friction"
    body: "A unified operating surface can reduce administration while also making future replacements more disruptive. Moat durability therefore depends on whether the operating savings remain greater than recurring-license exposure and the value of preserving hardware and supplier choice."
    claimRefs:
      - "CP001"
      - "CP003"
      - "CP007"
      - "CP009"
      - "CP012"
