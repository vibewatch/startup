chapter:
  number: 6
  title: "Customers"
  summary: "Verkada reports more than 31,000 customers, more than 2 million online devices, and strong first-year expansion through additional product lines. The public record shows broad vertical reach and several quantified case-study outcomes, but it does not disclose retention, churn, contract duration, or customer concentration."
sections:
  - id: "customer-base-and-segments"
    title: "Customer Base and Segment Coverage"
    body: >-
      Verkada's March 2026 company announcement, republished by Security Sales & Integration,
      put the customer base above 31,000 organizations and the installed footprint above
      2 million online devices across 171 countries. Its own customer-story index supplies
      broader qualitative segmentation: named examples span education, healthcare and aged
      care, retail and restaurants, logistics, industrial sites, sports venues, government,
      hospitality, and technology companies. The buyer is therefore not a single security
      persona. Public examples imply joint evaluation by physical-security, facilities, IT,
      and operations teams, while end users range from investigators and site administrators
      to access-control staff. The breadth is credible as a list of promoted deployments, but
      the supplied evidence does not disclose customer mix by vertical, geography, account
      size, or revenue contribution.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
    tableRefs:
      - "TU001"
  - id: "adoption-and-expansion"
    title: "Adoption and Expansion Signals"
    body: >-
      The clearest commercial signal is cross-product expansion rather than a disclosed
      retention rate. Verkada's March 2026 announcement said 78% of core customers used at
      least two product lines, 54% used at least three, and the average customer nearly
      doubled initial spend during the first 12 months. Those figures suggest an effective
      land-and-expand motion, but they are company-issued, the term "core customer" is not
      defined, and the average does not reveal the distribution across cohorts. A separate
      Verkada-issued survey of more than 2,700 IT and physical-security leaders across ten
      markets found 39% still piloting AI and 41% actively using it. That survey describes
      market adoption attitudes, not usage telemetry from Verkada's own customers, so it
      should not be interpreted as product retention or realized expansion.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU013"
      - "CU014"
      - "CU015"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-customer-proof"
    title: "Named Customer Proof and Outcome Quality"
    body: >-
      Verkada's customer index provides named references rather than an undifferentiated logo
      wall. It says Signify scaled security operations across 30 sites in seven countries, El
      Centro Regional Medical Center reduced workplace-violence incidents by 83%, and
      Allstone Quarries accelerated investigations by 98%. Other entries describe Trek
      Bicycle adding cloud-managed audio to stores in under 30 minutes and Prism Health
      reporting a 43% saving in a ten-year total-cost analysis. These are useful proofs of
      deployed workflows, yet they remain vendor-selected summaries without baselines,
      sample sizes, calculation methods, or independent audits. Review aggregation adds a
      different signal: CheckThat reports a 4.7/5 G2 rating across 141 reviews and recurring
      praise for easy deployment and unified multi-site management, but its aggregation is
      secondary evidence rather than a substitute for direct customer reference calls.
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "durability-and-procurement-risk"
    title: "Durability, Procurement Friction, and Missing Economics"
    body: >-
      Public evidence supports onboarding and expansion, but not durability. No successful
      prefetched source in the assigned pool discloses net revenue retention, gross revenue
      retention, logo churn, renewal rates, contract length, cohort behavior, or customer
      concentration. Those omissions prevent a direct test of whether first-year expansion
      persists and whether reported customer growth is concentrated in a small number of
      large deployments. The adverse review aggregation also identifies recurring buyer
      objections around cost and proprietary lock-in, which can complicate renewal and
      switching decisions even when administrators value the unified interface. Verkada's
      direct EDUCAUSE presence and HBS's partner-led deployment support show more than one
      route to customers, but neither source quantifies channel-sourced revenue or partner
      dependence. Diligence should therefore prioritize cohort exports, top-customer and
      vertical concentration schedules, renewal terms, and blinded reference calls.
    claimRefs:
      - "CU011"
      - "CU016"
callouts:
  - calloutType: "strength"
    title: "Expansion is visible, even without retention disclosure"
    body: "Company-issued figures show broad multi-product adoption and near-doubling of average initial spend in the first 12 months, making installed-account expansion the strongest disclosed customer signal."
    claimRefs:
      - "CU003"
      - "CU004"
  - calloutType: "risk"
    title: "Durability remains unproven"
    body: "Independent review aggregation identifies cost and proprietary lock-in as recurring objections, while the assigned public evidence provides no NRR, GRR, churn, renewal, contract-duration, or concentration data."
    claimRefs:
      - "CU011"
