  topStrengths:
    - M2C 模式从结构上省去批发中间商，让高品质商品能够以低于传统零售的价格出售，也由此形成难以复制的成本架构。
    - FY2025 年收入已确认超过 $1 billion，且自成立以来同比增速一直保持三位数，证明公司在 E 轮入场时已经具备真实的消费者规模。
    - 品类持续扩张，并于 January 2026 进入加拿大，说明平台可以延展并打开增量 TAM，无需改变商业模式。
    - ICONIQ 在多轮融资中持续跟投，说明机构投资者对其经营逻辑有较强认可。
  topRisks:
    - 正在进行的商业外观 / 虚假定价诉讼，可能损害品牌可信度、营销灵活性或退出时点。
    - 公开渠道没有毛利率、COGS、EBITDA、烧钱速度或 NRR 数据，因此 $10.1B 估值更多建立在增长叙事上，而不是可观察的单位经济模型上。
    - 工厂直供模式下，供应商、质量和合规情况不透明，运营失误可能直接转化为客户信任损失。
    - 在 $10.1B 估值下，公司没有披露流动性路径；面向消费公司的 IPO 窗口仍不明朗。
  unresolvedGaps:
    - 经审计的收入、毛利率、贡献毛利率、EBITDA、自由现金流、烧钱速度和现金跑道。
    - 精确的客户数、队列留存、复购率和净收入留存率（NRR）。
    - Mandel v. Last Brand Inc. 的解决情况或重大性量化，以及七个涉案州是否存在其他消费者保护索赔。
    - 供应链可追溯认证（UFLPA、CTPAT）的状态，以及公司对 June 2026 海关执法行政命令的具体暴露程度。
    - IPO 或流动性时间表、股权结构表的优先级、超过 $1.07B 累计融资对应的清算优先权，以及 E 轮中是否包含老股交易或债务成分。
