figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Publicly named milestones show Quince's path from 2018 founding to a 2026 $10.1 billion
      Series E, with legal friction emerging alongside international and category expansion.
    data:
      items:
        - period: "2018"
          label: Company founded in San Francisco
          detail: Forbes and Tech Funding News name Sid Gupta, Zunu Mittal, and Sourabh Mahajan as founders.
          claimRefs: [CO002]
        - period: "2020"
          label: Brand launches out of beta as Quince
          detail: TechCrunch says Quince launched out of beta in 2020, while Teardown says the company rebranded from Last Brand to Quince in June 2020.
          claimRefs: [CO004]
        - period: "Jan 2025"
          label: Prior round establishes a $4.5B benchmark
          detail: TechCrunch and Retail Brew describe a roughly $200 million 2025 round around a $4.5 billion valuation.
          claimRefs: [CO006]
        - period: "Apr 2025"
          label: Tapestry lawsuit opens the branded legal front
          detail: Teardown identifies the Tapestry/Coach trade-dress suit as the first brand-name legal shot at Quince's dupe playbook.
          tone: risk
          claimRefs: [CO013]
        - period: "Jan 2026"
          label: A$AP Rocky collaboration announced
          detail: Retail Dive says Quince announced a tie-up with A$AP Rocky in January 2026.
          claimRefs: [CO010]
        - period: "Jan 2026"
          label: Canada launch marks the first named international market
          detail: TechCrunch and Retail Dive both say Quince expanded into Canada in January 2026.
          claimRefs: [CO009]
        - date: "2026-03-11"
          label: Series E closes at a $10.1B valuation
          detail: TechCrunch, Retail Dive, Forbes, and Tech Funding News all report a $500 million Series E led by Iconiq.
          claimRefs: [CO005]
        - period: "Mar 2026"
          label: Public revenue disclosure crosses the $1B mark
          detail: Independent March 2026 coverage repeats Quince's claim that 2025 revenue topped $1 billion with triple-digit annual growth since founding.
          claimRefs: [CO007]
    claimRefs: [CO002, CO004, CO005, CO006, CO007, CO009, CO010, CO013]
callouts:
  - calloutType: insight
    title: Reusable ground truth is strongest around identity and financing
    body: >-
      The evidence pack is good enough to anchor Quince's founding facts, founder-led operating
      model, 2025-26 valuation step-up, and key milestones, but not strong enough to treat customer
      count, current headcount, cap-table seniority, or audited profitability as settled company
      facts.
    claimRefs: [CO001, CO005, CO014]
  - calloutType: risk
    title: Legal and execution risk is already part of the company story
    body: >-
      The 2026 growth narrative is not cleanly separable from lawsuits, tariff sensitivity, and the
      risk that a founder-concentrated operating system must keep scaling across more categories and
      more factory partners.
    claimRefs: [CO012, CO013]
