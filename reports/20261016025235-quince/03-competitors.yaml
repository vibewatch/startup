    claimRefs: [CP007, CP008, CP009, CP010, CP011, CP013, CP014, CP016]
callouts:
  - calloutType: risk
    title: Execution moat outruns brand moat
    body: >-
      The retained pool supports a real execution moat—factory-direct sourcing, data-led
      merchandising, comparison-driven conversion, and ample capital—but not a clearly
      durable brand moat. If copycat litigation, quality skepticism, or a stronger platform
      response narrow the visible price gap, Quince still faces rivals with better category
      authority, distribution, or shopper trust.
    claimRefs: [CP001, CP004, CP005, CP012, CP014]
