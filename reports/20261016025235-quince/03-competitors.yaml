      - ["Branded cashmere specialist", "White + Warren cashmere crewneck can cost >$400 while Quince offers similar garments for $50 (BoF)", "Specialist can answer with unique design and stronger identity", "Not a perfect SKU-for-SKU materials audit", "Premium brands need non-price differentiation because matching Quince on basics is difficult"]
      - ["Fashion dress dupe", "Reformation dress at $298 versus similar Quince dress at $69.90 (Fast Company)", "Quince turns visible lookalike pricing into a conversion tool", "No retained evidence on returns, fabric equivalence, or realized sell-through", "Competitive pressure is strongest when Quince can frame the purchase as 'good enough' substitution"]
      - ["Home and travel categories", "Quince product pages compare linen sheets with Brooklinen/Serena & Lily and luggage with Away/Monos (Sacra)", "Material specs, warranty language, and direct price comparisons", "Retained pool does not include the live competitor product pages themselves", "Packaging combines price, feature, and trust signals at the exact buying moment"]
    notes: >-
      This is an illustrative SKU-level packaging table built from retained public examples,
      not a complete list-price audit across every category or contract term.
    claimRefs: [CP002, CP003, CP013, CP016]
