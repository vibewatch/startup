companyProfile:
  summary: >-
    Quince is a San Francisco-founded manufacturer-to-consumer retailer that sells premium apparel, home goods,
    accessories, beauty, wellness, and selected adjacent categories through its website and app. Public coverage
    supports a 2018 founding, a 2020 brand launch/out-of-beta milestone, March 2026 funding at a $10.1 billion
    valuation, and company claims of more than $1 billion in revenue, but the public record still does not disclose
    audited profitability, customer count, or cap-table detail.
  foundedDate: '2018-01-01'
  founders:
    - name: Sid Gupta
      role: CEO & Co-founder
      background: >-
        Approximately five years in private equity prior to co-founding Quince; also previously co-founded Lolli and
        Stud.
    - name: Sourabh Mahajan
      role: CTO & Co-founder
      background: Leads the technology infrastructure underlying the M2C operating system at Quince.
    - name: Zunu Mittal
      role: President & Co-founder
      background: Responsible for strategy, product portfolio direction, and investor relations including the Series E financing.
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: >-
    Quince sells premium-quality apparel, home textiles, leather goods, luggage, beauty products, wellness items, and
    adjacent catalog extensions through its owned DTC storefront and mobile app. The business is built around a
    manufacturer-to-consumer model that uses factory-direct sourcing to keep prices materially below conventional
    retail.
  customerFocus: >-
    Value-conscious consumers seeking premium-quality goods without retail intermediary markups; a secondary B2B channel
    serves corporate gifting, hospitality, interior-design trade, and white-label manufacturing clients.
  businessModel: >-
    DTC e-commerce with M2C sourcing: Quince manufactures directly through partner factories, eliminates the wholesale
    layer, and retails at near-manufacturer cost plus a margin. Revenue is recognized from product sales net of
    estimated returns.
  stage: Series E private company — growth stage
