  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Publicly evidenced architecture is an operating stack that runs from demand sensing through factory planning into
      the shopper-facing storefront and returns layer.
    data:
      layers:
        - label: Demand sensing
          detail: Data and AI layer used to forecast demand and identify where the system can scale efficiently.
          items:
            - AI-driven demand forecasting
            - Data and analytics to uncover efficiencies
            - Sales prediction supporting smaller-batch production
        - label: Product and pricing logic
          detail: Category expansion depends on repeated value engineering rather than a single hero SKU.
          items:
            - Factory-direct cost removal
            - Product-page price comparison framing
        - label: Planning and sourcing
          detail: Operating layer that aligns forecasted demand with direct factory relationships.
          items:
            - Real-time production planning
            - Direct factory partnerships
            - Materials verification systems
        - label: Inventory and release control
          detail: Execution layer that keeps launches and inventory tighter than traditional retail.
          items:
            - Weekly SKU / size planning cadence
            - Small-batch test orders before scale-up
            - Inventory targets measured in weeks
            - Limited launches / tighter production cycles
        - label: Quality and partner controls
          detail: >-
            Publicly described safeguards are concentrated in supplier standards rather than customer-visible trust
            tooling.
          items:
            - Workplace safety and wage standards
            - Responsible manufacturing commitments
        - label: Shopper experience
          detail: Consumer-facing retail layer that carries the M2C value proposition into checkout and support.
          items:
            - Cross-category digital storefront
            - Product-page price comparison framing
            - App promotions
            - Free shipping and 365-day returns
    approximationNotes: >-
      This stack summarizes public operating claims; it is not a disclosed systems diagram and should not be read as a
      full internal software architecture.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE010
      - CE012
      - CE015
