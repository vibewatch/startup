  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Quince leads on visible value but still trails the strongest incumbents and specialists on differentiated trust or
      brand moats.
    xAxis:
      label: Relative price accessibility (1 = premium-priced, 5 = strongest low-price anchor)
      min: 1
      max: 5
      description: Ordinal score synthesized from retained pricing examples and value-positioning evidence.
    yAxis:
      label: Relative differentiation / trust moat (1 = weakest, 5 = strongest)
      min: 1
      max: 5
      description: >-
        Ordinal score synthesized from retained evidence on brand distinctiveness, platform trust, or category
        authority.
    data:
      points:
        - label: Quince
          x: 5
          'y': 2
          note: >-
            Factory-direct value and comparison merchandising are strong, but Fast Company and BoF both suggest the
            brand moat is still developing.
        - label: Everlane
          x: 3
          'y': 4
          note: Sacra calls Everlane the conceptual predecessor with a clearer historic transparency-led identity.
        - label: Italic
          x: 4
          'y': 2
          note: Sacra calls Italic the closest model analog, but also says it has not reached Quince's awareness.
        - label: Zara / H&M
          x: 3
          'y': 4
          note: Sacra highlights omnichannel density, traffic, and integrated logistics as durable incumbent assets.
        - label: Amazon Haul
          x: 5
          'y': 3
          note: Sacra says Haul tripled visits and pairs ultra-low prices with Amazon's trust and search traffic.
        - label: Brooklinen / Parachute
          x: 2
          'y': 4
          note: Sacra says specialists can out-credential Quince when buyers want category authority in home.
        - label: Shein / Temu
          x: 5
          'y': 1
          note: Sacra says these platforms reset price anchors but compete from a weaker trust and premium-positioning base.
