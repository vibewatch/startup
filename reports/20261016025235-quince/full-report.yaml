              - CO006
              - CO011
              - CO012
              - CO014
      - number: '1.3'
        title: Scale signals and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              The most defensible scale statement in the current pack is not audited margin or cash flow, but that
              independent March 2026 reporting repeated Quince's claim that 2025 revenue topped $1 billion and that
              growth had remained triple-digit since founding. Public reporting also shows continued category and
              geography expansion: the assortment had moved well beyond the original cashmere-led wedge into home,
              jewelry/accessories, beauty, wellness, and other household categories, and both TechCrunch and Retail Dive
              say Quince expanded into Canada in January 2026. Retail Dive separately notes an A$AP Rocky collaboration
              in the same month, indicating ongoing brand-building experiments. Still, later chapters should treat
              company-wide customer count, directly disclosed headcount, board composition, and audited profitability or
              cash-generation metrics as unresolved inputs rather than established facts, because the assigned public
              sources do not make them verifiable enough for underwriting reuse.
            claimRefs:
              - CO005
              - CO007
              - CO008
              - CO009
              - CO010
              - CO014
      - number: '1.4'
        title: Milestones and adverse context
        blocks:
          - type: paragraph
            body: >-
              The dated timeline is strong enough to anchor later chapters because the same events recur across multiple
              independent sources: founding in 2018, brand launch/out-of-beta in 2020, a 2025 valuation benchmark around
              $4.5 billion, a January 2026 Canada launch, and the March 2026 $500 million Series E. The important
              caution is that these growth milestones arrived in parallel with legal and reputational friction rather
              than in a clean operating vacuum. TechCrunch flags lawsuits from Tapestry, Williams Sonoma, and earlier
              design disputes, Forbes describes ongoing suits over trade dress and comparison marketing, and Teardown
              frames trade policy, quality control, and litigation as the three exposed flanks in the current narrative.
              For a company-overview chapter, that is enough to mark legal and execution risk as a core part of the
              reusable ground truth rather than an isolated later-stage footnote.
            claimRefs:
