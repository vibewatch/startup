chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Public and company-authored sources align on the core identity: Quince is a San Francisco-founded
              direct-to-consumer retailer that uses a manufacturer-to-consumer model to sell apparel, home goods,
              beauty, and adjacent categories at lower prices by cutting out wholesale and storefront intermediaries.
              The strongest reusable company-level ground truth is around the operating model and product scope, not
              audited financials. Quince's own about page frames the pitch around factory-direct pricing and fewer
              supply-chain middlemen, while TechCrunch, Retail Dive, Forbes, and Tech Funding News all describe the same
              M2C logic from independent angles. Independent coverage also supports a 2018 founding and a 2020 brand
              launch/out-of-beta milestone, which makes the company old enough to have passed idea-stage ambiguity but
              still young enough that most later scale claims remain management-shaped rather than filing-grade
              disclosures.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
              - CO009
              - CO014
      - number: '1.2'
        title: Leadership, investors, and control surface
        blocks:
          - type: paragraph
            body: >-
              The public record in this assigned source pack shows Quince as conspicuously founder-led. Forbes,
              EquityZen, and Teardown consistently place Sid Gupta, Zunu Mittal, and Sourabh Mahajan at the center of
              the company as chief executive, president, and technical co-founder roles respectively. That supports a
              later-chapter assumption that strategy, merchandising logic, and operating-system execution remain
              concentrated in the founding team rather than in a visibly institutionalized executive bench. Capital
              formation also looks late-stage rather than venture-experimental: TechCrunch and Retail Brew place a
              roughly $200 million 2025 round around a $4.5 billion valuation, and March 2026 coverage across
              TechCrunch, Retail Dive, Forbes, and Tech Funding News reports a $500 million Series E at $10.1 billion
              led by Iconiq. What is still missing is the actual governance surface behind those rounds—board seats,
              voting control, liquidation preferences, any secondary component, and any debt or credit layering.
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO011
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
