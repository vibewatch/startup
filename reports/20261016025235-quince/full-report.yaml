          The reported $10.1B mark is defensible and can support upside only if later disclosure or liquidity events
          validate a higher quality earnings profile.
        - Execution misses, legal setbacks, or margin leakage.
        - Requires audited margin and cash evidence, not just top-line momentum.
      - - Base
        - Revenue scale is real, but economics remain private and litigation stays unresolved.
        - >-
          The current mark looks roughly fair-to-full; the company quality is evident, but public evidence supports
          limited upside from today's headline valuation.
        - Multiple compression and slower growth normalization.
        - Most consistent with the current public evidence mix.
      - - Bear
        - >-
          Growth normalizes toward older 2024-2025 reference points, legal costs rise, or the Series E stack carries
          heavy preferences.
        - >-
          Effective equity value can fall below the headline 2026 mark and re-test earlier $4.5B-style external
          references.
        - Opaque cap table and inability to prove durable profitability.
        - Triggered by diligence misses or adverse legal developments.
    notes: >-
      Scenario ranges are directional and anchored to reported private marks and external reference points, not to a
      full discounted cash-flow or public-comps model.
    claimRefs:
      - CV003
      - CV005
      - CV008
      - CV010
      - CV011
