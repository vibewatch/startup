        title: Exhibits
        blocks:
          - type: callout
            title: Reusable ground truth is strongest around identity and financing
            body: >-
              The evidence pack is good enough to anchor Quince's founding facts, founder-led operating model, 2025-26
              valuation step-up, and key milestones, but not strong enough to treat customer count, current headcount,
