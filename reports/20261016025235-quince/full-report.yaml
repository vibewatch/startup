        - from: design
          to: factories
          label: Sources directly
        - from: factories
          to: direct-sale
          label: Ships to end customer
        - from: direct-sale
          to: sku-spread
          label: Converts orders into revenue
        - from: sku-spread
          to: operating-gap
          label: Public bridge stops here
    approximationNotes: >-
