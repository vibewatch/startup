  topStrengths:
    - >-
      M2C model structurally eliminates wholesale intermediaries, enabling premium-quality goods at prices that can
      undercut traditional retail and creating a hard-to-replicate cost architecture.
    - >-
      Confirmed >$1 billion in FY2025 top-line revenue with triple-digit YoY growth since launch, validating real
      consumer scale at a Series E entry.
    - >-
      Broad category expansion and January 2026 Canada launch demonstrate platform extensibility and incremental TAM
      without requiring a business-model change.
    - >-
      Repeat-investor support from ICONIQ across multiple rounds suggests strong institutional validation of the
      operating thesis.
  topRisks:
    - >-
      Active trade-dress / deceptive-pricing litigation could impair brand credibility, marketing flexibility, or exit
      timing.
    - >-
      No gross margin, COGS, EBITDA, burn rate, or NRR data is publicly available, so the $10.1B valuation rests on
      growth narrative more than observable unit economics.
    - >-
      Supplier, quality, and compliance opacity inside a factory-direct model can turn operational errors into direct
      customer-trust losses.
    - >-
      No disclosed liquidity path at a $10.1B valuation, and the IPO window for private consumer companies remains
      uncertain.
  unresolvedGaps:
    - Audited revenue, gross margin, contribution margin, EBITDA, free cash flow, burn rate, and cash runway.
    - Precise customer count, cohort retention, repeat-purchase rate, and net revenue retention (NRR).
    - >-
      Resolution or materiality quantification of Mandel v. Last Brand Inc. and any additional consumer-protection
      claims across the seven named states.
    - >-
      Supply-chain traceability certification status (UFLPA, CTPAT) and specific exposure to the June 2026 customs
      enforcement executive order.
    - >-
      IPO or liquidity timeline, cap-table seniority, liquidation preferences on >$1.07B raised, and any secondary or
      debt components of the Series E.
