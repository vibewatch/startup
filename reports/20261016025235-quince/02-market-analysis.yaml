    title: TAM / SAM / SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography / lens
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - Forbes citing Bain
        - "2025"
        - Global personal luxury market
        - $415B
        - null
        - Broad top-down luxury spend lens used as adjacent demand context
        - Medium
        - Not specific to Quince's categories, online channel, or reachable price points
      - - Forbes citing Bain
        - "2025"
        - Global luxury consumer TAM
        - 335M-345M consumers
        - null
        - Buyer-count lens after contraction from 380M consumers in 2019
        - Medium
        - Population lens, not a spend or category-mix lens
      - - Forbes citing Bain
        - "2025"
        - Active-buyer share inside luxury TAM
        - "~40%-45%"
        - null
        - Participation-rate lens on the same broad luxury consumer base
        - Medium
        - Indicates engagement pressure, not Quince-specific conversion
      - - Forbes citing NielsenIQ/GfK/WDL
        - "2030"
        - Gen Z spending power
        - $12T
        - null
        - Cohort spending-power lens for future addressable wallet share
        - Medium
        - Broader consumer spending pool, not apparel/home-specific demand
      - - TechCrunch and Retail Dive
        - "2025-2026"
        - Quince observed scale proof
        - '>$1B top-line revenue'
        - Triple-digit annual growth since founding
        - Company-reported scale signal cited by independent publications
        - High
        - Validates demand but still does not isolate category-level SAM or SOM
      - - Retail Brew
        - "2024"
        - Prior-year company revenue
        - '~$340M'
        - null
        - Independent revenue datapoint for pre-Series-E scale
        - Medium
        - Company-level revenue does not show mix by category, cohort, or geography
    notes: >-
      Rows intentionally mix market value, buyer-count, cohort-spending, and company-scale lenses
      because the assigned pool does not publish a like-for-like Quince TAM/SAM/SOM waterfall;
      null CAGR means the cited source gave no growth rate.
    claimRefs: [CM006, CM007, CM009, CM011, CM012]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Millennial premium-basics shopper
        - Household apparel shopper
        - Same individual or household
        - Household cardholder
        - Social discovery to direct-site purchase of wardrobe staples
        - Household discretionary spend
        - Premium materials at a price that feels materially fair
      - - Gen Z value-conscious shopper
        - Mobile-first shopper
        - Same individual
        - Household discretionary budget or self-funded purchase
        - Social proof, influencer content, and small-batch urgency
        - Personal discretionary spend
        - Transparency, quality signals, and "smart buy" framing
      - - Home and gifting shopper
        - Household purchaser or gift giver
        - Household members or gift recipient
        - Household discretionary budget
        - Catalog expansion from hero apparel into bedding, luggage, and gifts
        - Household discretionary spend
        - Trusted quality at lower markup across adjacent categories
      - - Corporate gifting / branded storefronts
        - Marketing, HR, or procurement lead
        - Employees, prospects, or event recipients
        - Company budget owner
        - Programmatic gifting or branded storefront procurement
        - Marketing or people-ops budget
        - Premium feel without premium unit economics
      - - Trade / hospitality buyer
        - Interior designer or hospitality operator
        - End guest or client
        - Project or operating budget owner
        - Trade sourcing for linens, essentials, or project packages
        - Project procurement or hospitality operating budget
        - Trade pricing plus a broad premium-essentials catalog
    notes: >-
      Buyer, user, and payer roles are synthesized from public product coverage plus quoted B2B
      programs; assigned sources do not disclose segment mix, ACV, or repeat-purchase economics.
    claimRefs: [CM010, CM013, CM014]
