    data:
      items:
        - label: Global personal luxury market
          displayValue: $415B in 2025
          note: Bain figure cited by Forbes; broad adjacent demand context rather than Quince TAM.
          tone: neutral
          claimRefs: [CM006]
        - label: Luxury consumer TAM
          displayValue: 335M-345M consumers
          note: Bain figure cited by Forbes after contraction from 380M consumers in 2019.
          tone: neutral
          claimRefs: [CM007]
        - label: Active-buyer participation
          displayValue: "~40%-45%"
          note: Bain figure cited by Forbes; shows a narrower active-buyer pool inside the luxury TAM.
          tone: risk
          claimRefs: [CM007]
        - label: Gen Z future luxury share
          displayValue: 25%-30% by 2030
          note: Forbes points to cohort mix shifting toward Gen Z even as legacy luxury loses aspirational buyers.
          tone: opportunity
          claimRefs: [CM008]
        - label: Gen Z spending power
          displayValue: $12T by 2030
          note: NielsenIQ/GfK/WDL figure cited by Forbes; broader wallet pool, not Quince-category revenue.
          tone: opportunity
          claimRefs: [CM009]
        - label: Quince observed scale proof
          displayValue: '>$1B top-line revenue'
          note: Independent March 2026 coverage shows the model already scaled, but public sources still do not isolate SAM or SOM.
          tone: positive
          claimRefs: [CM012]
    approximationNotes: >-
      Layers intentionally combine adjacent market-value, buyer-count, cohort, and company-scale
      lenses because the assigned source pool does not disclose a directly comparable Quince
      TAM/SAM/SOM stack. Read top-to-bottom as narrowing decision context, not additive market
      math.
    claimRefs: [CM006, CM007, CM008, CM009, CM012]
