            - Value framing versus higher-priced incumbents
        - title: First purchase
          label: 首次购买
          value: Premium essentials at lower prices
          touchpoints:
            - Apparel-led entry point
            - Manufacturer-to-consumer pricing narrative
        - title: Trust / repeat
          label: 信任 / 复购
          value: Company-claimed returning demand
          touchpoints:
