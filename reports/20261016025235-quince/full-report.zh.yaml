companyProfile:
  summary: >-
    Quince 是一家创立于 San Francisco 的厂商直达消费者零售商，通过网站和 App 销售高端服装、家居用品、配饰、美妆、健康及部分相邻品类。公开报道支持其成立于 2018 年、2020
    年上线品牌并走出测试期、2026 年 3 月以 $10.1B 估值融资，以及公司称收入超过 $1B；但公开记录仍未披露经审计盈利、客户数或股权结构细节。
  foundedDate: '2018-01-01'
  founders:
    - name: Sid Gupta
      role: CEO & 联合创始人
      background: 与他人共同创办 Quince 前，曾在私募股权领域工作约五年；此前还共同创办 Lolli 和 Stud。
    - name: Sourabh Mahajan
      role: CTO & 联合创始人
      background: 负责 Quince M2C 运营系统背后的技术基础设施。
    - name: Zunu Mittal
      role: 总裁 & 联合创始人
      background: 负责战略、产品组合方向和投资者关系，包括 Series E 融资。
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: Quince 通过自有 DTC 门店和移动 App 销售高品质服装、家纺、皮具、行李箱、美妆、健康用品及相邻目录品类。其业务围绕厂商直达消费者模式，以工厂直采把价格压到明显低于传统零售的水平。
  customerFocus: 面向希望购买高品质商品、又不愿承担零售中间商加价的价格敏感型消费者；次要的 B2B 渠道服务企业礼赠、酒店业、室内设计行业和白牌制造客户。
  businessModel: 采用 M2C 采购的 DTC 电商模式：Quince 通过合作工厂直接生产，砍掉批发环节，以接近制造商成本加利润的价格零售。收入按扣除预计退货后的产品销售额确认。
  stage: Series E private company — growth stage
  fundingStatus: >-
    2026 年 3 月由 ICONIQ 领投的 $500M Series E，投后估值 $10.1B；此前包括约 $4.5B 估值下的 $200M Series D、$120M Series C、$77M Series B 和
    $50M Series A。累计已披露融资超过 $1.07B。
