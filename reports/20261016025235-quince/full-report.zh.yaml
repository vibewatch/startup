        - Series E 资金推动国际扩张成功，超过 10 亿美元的收入继续复合增长，且尽调显示利润率和现金效率健康。
        - 报道中的 101 亿美元估值站得住脚；但只有后续披露或流动性事件验证了更高质量的盈利画像，它才支持上行空间。
        - 执行失误、法律受挫或利润率泄漏。
        - 需要经审计的利润率和现金证据，不能只看收入增长动能。
      - - 基准
        - 收入规模真实存在，但经济性仍未公开，诉讼也尚未解决。
        - 当前估值大致合理但已接近上限；公司质量显而易见，但公开证据只支持相对于今天报道估值有限的上行空间。
        - 倍数压缩和增长正常化速度放缓。
        - 与当前公开证据组合最一致。
      - - 悲观
        - 增长向较早的 2024—2025 年参考点回归，法律成本上升，或 Series E 结构附带较重的优先权。
        - 有效股权价值可能低于 2026 年报道估值，并重新测试早期约 $4.5B 的外部参考值。
