  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              指定来源支持把 Quince 看作在线平价奢侈品必需品零售商，而不只是羊绒品牌。独立报道一致将其放在服装、家居、配饰、美妆、健康以及某一报道提到的食品/酒类扩展中；Quince
              的关于页面则把定价引擎定义为去掉中间商的工厂直采系统。因此，相关市场包括材质质量可感知、比价容易的高端非必需消费品类，但不包括经典 Logo
              驱动的奢侈品、百货批发经济或定制化企业采购。实际竞争对象是高端基础款、数字原生 DTC 品牌，以及衣橱和家居更新周期中的替代消费，而不是单纯按品牌信号与整个奢侈品市场竞争。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM013
      - number: '2.2'
        title: 买方分层、用户与预算归属
        blocks:
          - type: paragraph
            body: >-
              公开证据最支持的核心消费者，是希望获得高品质材料和设计感、但对价格敏感的购物者。Retail Brew 明确提到 Gen Z 和年轻千禧一代带来的新需求，Accio 则将主要受众描述为 25—55
              岁、预算敏感的女性。在消费场景中，买方、用户和付款方通常是同一家庭决策者，为服装、床品、行李箱或礼赠做非必需消费。更有差异化的是，Quince 似乎还经营企业礼赠、品牌门店、制服、酒店供应和室内设计师贸易价等
              B2B 路径；即使公开来源没有量化其贡献，这也引入了采购和营销预算作为额外付款池。
            claimRefs:
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM013
              - CM014
      - number: '2.3'
        title: 规模视角与需求驱动
        blocks:
          - type: paragraph
            body: >-
              现有市场规模证据是多视角的，并非整齐的 TAM 到 SAM 瀑布图。Forbes 引用 Bain 数据称，2025 年全球个人奢侈品市场为 $415B，同时显示活跃奢侈品买家自 2019
              年以来收缩。这一收缩很重要，因为它意味着 Quince 并非只是顺着上升潮水增长，而是在迎合消费者转向公平、透明和价格诚信的变化。Forbes 还指出 Gen Z 在未来奢侈品需求中的占比正在上升，Retail
              Brew 则补充了 TikTok 已帮助 Quince 触达这一群体的证据。TechCrunch 和 Retail Dive 随后给出公司规模验证：模式收入已超过
              $1B，说明需求真实，但不能说明按品类或地域划分的可服务剩余市场。TechCrunch 还报道 Quince 于 2026 年 1 月进入 Canada，这是地域覆盖扩张的事实，不是渗透率或市场份额证据。
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM011
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
      - number: '2.4'
        title: 采用约束与未解尽调缺口
        blocks:
          - type: paragraph
            body: >-
              让机会变得清晰的同一批来源，也说明为什么不应过度激进地承销市场。Bain 的收缩数据意味着广义奢侈品买家池并非均匀扩大，因此 Quince 可能更多依赖抢占份额和消费降级，而非单靠品类长期增长。Retail
              Brew 还指出，Quince 必须围绕质量控制、道德标准和速度搭建全球供应链；随着目录和地域扩大，这是真实运营约束。更重要的是，指定资料池没有披露 Quince 的品类收入组合、按 cohort
              划分的复购行为或 B2B 合同渠道规模，因此仅凭现有证据仍无法干净地拆出公开 SAM/SOM。
            claimRefs:
              - CM007
              - CM011
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合与替代类别
        blocks:
          - type: paragraph
            body: >-
              保留的资料指向宽泛的替代集合，而非单一正面竞争者。Sacra 将 Everlane 视为最接近的概念先行者、Italic 视为最接近的模式类比，Zara 和 H&M 视为规模化 incumbents，Shein
              和 Temu 视为价格锚定型颠覆者，Amazon Haul 视为便利性很强的平台威胁，并指出 Brooklinen、Parachute、Mejuri 和 Aurate
              等品类专家仍能在更窄的购买场景中赢得信任。因此 Quince
              面临多条战线：消费者可以转向另一家工厂直采基础款品牌、拥有门店和物流的全球时尚连锁、极低价平台，或品类权威更强的专家品牌。公开资料没有显示“内部自建”在这一品类中是有意义的替代方案，因此当前格局应理解为零售商对零售商、平台对品牌的竞争，而不是软件式的自建替代。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
