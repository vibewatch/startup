              Quince 提供的是数字优先的零售流程，核心是直接购买高端定位的必需品，而非批发分销。官方和独立描述都指向同一客户主张：Quince
              去掉传统零售层，直接从制造商销售，并把范围从羊绒扩展到更广泛的服装、家居、配饰、美妆、食品和旅行相邻品类。重要之处在于，运营模式并非由单一毛衣 SKU
              验证，而是看同一系统能否持续推出相邻品类，同时保持价格透明和可接受的买方信任。指定资料还显示了 App 专属促销、包邮和 365 天退货等购物者支持机制，有助于降低采用摩擦；但公开证据对实际 App
              使用、转化、复购或退货表现指标仍很少。
