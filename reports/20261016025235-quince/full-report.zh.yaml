      - number: '3.4'
        title: 持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              保留资料呈现出的护城河是执行型，而非专有型。Quince 的规模、融资和运营纪律很重要，但独立报道也显示，仿冒诉讼、误导性定价指控和公司自身的“平替”声誉已经成为竞争叙事的一部分。Fast Company
              引用零售分析师和反仿冒创始人的观点称，若 Quince 不形成更强的立场，一个靠复制其他品牌畅销品建立的业务很难长期防守。Brand Panic 给出了更严厉的结论：Quince
              跳过他人的开发成本来获取上行，再用规模化网红分发扩大品类。实际投资判断是，只要价差足够大、消费者仍接受“够用”的替代，Quince 就能继续抢份额；但现有证据尚不足以支持一个能经受更窄价差、质量质疑或
              incumbent 更强回应的持久品牌护城河。
            claimRefs:
              - CP004
              - CP005
              - CP014
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 执行护城河领先于品牌护城河
            body: >-
              保留资料支持真实的执行护城河——工厂直采、数据驱动商品、比价转化和充足资本——但不能支持明确持久的品牌护城河。如果仿冒诉讼、质量质疑或更强的平台回应压窄可见价差，Quince
              仍将面对品类权威、分销或购物者信任更强的竞争者。
