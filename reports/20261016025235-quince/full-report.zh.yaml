              Quince 最强的公开财务论据不是已披露的利润率，而是一套运营机制。官方和第三方来源一致描述 Quince 如何削减采购、仓储、批发和零售加价层，同时利用需求预测、直接工厂关系和小批量生产限制库存风险。DTC
              Dispatch 进一步称其库存周期为 2—4 周，而零售业为 3—6 个月；Forbes 则给出一个具体的产品价差：一件售价 $50 的羊绒衫，生产并交付成本为 $39。这些信号说明 Quince
              可能拥有有吸引力的营运资金和 SKU 经济性，但不能替代合并毛利率、贡献利润率、经退货调整的 ASP 或获客回本周期。因此，公开记录支持效率论点，而不是完整的单位经济模型。
