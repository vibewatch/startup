  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              公开来源中的 Quince
              收入模式很直接：它以厂商直达消费者模式通过自有数字渠道直接销售实物商品，而不是靠订阅、平台抽成或批发分销变现。保留证据支持其覆盖服装、家居、配饰、美妆、健康和相邻扩展品类，但没有披露按品类、地域或客户
              cohort 划分的收入组合。公开牵引力看起来有意义，但仍主要通过媒体报道转述公司口径：多家媒体称 Quince 年收入或营收已超过 $1B，DTC Dispatch 则给出更具体的数字，称 2024 年为
              $340M，2023 年为 $300M。这足以把 Quince 视为已规模化的消费商业，而非早期试验；但在没有经审计净销售额、退货率和品类毛利前，还不足以承销收入质量。
