        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              公开来源和公司自有材料对核心身份的描述一致：Quince 是一家创立于 San Francisco 的 DTC
              零售商，采用厂商直达消费者模式，通过砍掉批发商和门店中间环节，以更低价格销售服装、家居、美妆及相邻品类。当前资料最可靠的公司级事实是运营模式和产品范围，而不是经审计财务数据。Quince
              的关于页面将卖点概括为工厂直采和更少的供应链中间商；TechCrunch、Retail Dive、Forbes 和 Tech Funding News 也从不同角度描述了同一 M2C 逻辑。独立报道还支持其
              2018 年成立、2020 年上线品牌并走出测试期，说明公司已经走过概念阶段，但后续大多数规模说法仍带有管理层口径色彩，而非申报文件级披露。
