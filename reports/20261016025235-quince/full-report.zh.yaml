              融资将用于扩充品类、供应链和技术投资以及国际增长，说明公司仍在部署资本，而不是暂停扩张收割现金。同时，保留的公开证据没有披露期末现金、烧钱速度、现金跑道、营运资金授信或债务义务，因此不能把轮次规模当作现金充足性的替代指标。承销还面临两个额外障碍：TechCrunch
