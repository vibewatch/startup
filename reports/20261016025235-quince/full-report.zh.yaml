          x: 3
          'y': 4
          note: Sacra 强调全渠道密度、流量和一体化物流是成熟巨头的持久资产。
        - label: Amazon Haul
          x: 5
          'y': 3
          note: Sacra 称 Haul 的访问量增长至三倍，并把超低价格与 Amazon 的信任和搜索流量结合起来。
        - label: Brooklinen / Parachute
          x: 2
          'y': 4
          note: Sacra 称，当买家想在家居领域获得品类权威时，专业品牌可以在专业资历上胜过 Quince。
        - label: Shein / Temu
          x: 5
          'y': 1
          note: Sacra 称这些平台重置了价格锚点，但竞争基础是更弱的信任度和高端定位。
    approximationNotes: 这些坐标是根据保留来源池综合出的、有证据支持的序数评分，不是经审计的基准指标。
    claimRefs:
      - CP007
      - CP008
      - CP009
      - CP010
      - CP011
      - CP013
      - CP014
      - CP016
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开来源支持 Quince 收入模式的运作机制以及部分 SKU 层面和库存代理指标，但没有披露合并毛利率桥接表。
    data:
      nodes:
        - id: demand
          label: 需求感知
          summary: Data and demand forecasting guide product selection and batch sizing.
          note: 公开来源描述了机制，但没有披露命中率或群组经济性。
        - id: design
          label: 设计 / 采购控制
          summary: Quince manages design, sourcing, and logistics rather than relying on wholesale intermediaries.
        - id: factories
          label: 工厂直供生产
          summary: Products are produced through direct factory and supplier relationships.
        - id: direct-sale
          label: 数字直销
          summary: Revenue is generated through Quince's website and mobile channels.
        - id: sku-spread
          label: SKU 层面毛利差代理指标
          summary: Forbes reported one sweater example at $39 produce-and-deliver cost and a $50 selling price.
          note: 这是一个产品示例，不是合并毛利率。
        - id: operating-gap
          label: 合并利润率 / 现金缺口
          summary: Public sources do not disclose blended gross margin, CAC/payback, repeat purchase, burn, or runway.
      edges:
        - from: demand
          to: design
          label: 指导选品
        - from: design
          to: factories
          label: 直接采购
        - from: factories
          to: direct-sale
          label: 发货给终端客户
        - from: direct-sale
          to: sku-spread
          label: 将订单转化为收入
        - from: sku-spread
          to: operating-gap
          label: 公开桥接在此处中断
    approximationNotes: 该流程呈现已披露的商业机制和一个 SKU 层面的价格—成本示例；它不是经过建模的公司损益表。
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI006
      - CI010
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据所呈现的架构是一套运营栈：从需求感知开始，经工厂规划，最终连接到面向消费者的店面和退货层。
    data:
      layers:
        - label: 需求感知
          detail: 用于预测需求、识别系统可高效扩张位置的数据与 AI 层。
          items:
            - AI 驱动的需求预测
            - 用数据和分析挖掘效率
            - 支持小批量生产的销量预测
        - label: 产品与定价逻辑
          detail: 品类扩张靠持续的价值工程，而不是依赖单一爆款 SKU。
          items:
            - 工厂直供，去除中间成本
            - 商品页的价格比较框架
        - label: 规划与采购
          detail: 将预测需求与直接工厂关系对齐的运营层。
          items:
            - 实时生产规划
            - 直接工厂合作
            - 材料验证系统
        - label: 库存与发布控制
          detail: 让新品发布和库存水平比传统零售更紧凑的执行层。
          items:
            - 按周进行 SKU / 尺码规划
            - 放量前先下小批量测试订单
            - 以周数衡量库存目标
            - 限量发布 / 更紧凑的生产周期
        - label: 质量与合作伙伴控制
          detail: 公开描述的保障措施集中在供应商标准，而不是消费者可见的信任工具。
          items:
            - 工作场所安全与工资标准
            - 负责任制造承诺
        - label: 消费者体验
          detail: 将 M2C 价值主张带到结账和支持环节的面向消费者零售层。
          items:
            - 跨品类数字店面
            - 商品页的价格比较框架
            - App 促销
            - 免费配送和 365 天退货
    approximationNotes: 该架构栈总结了公开的运营说法；它不是已披露的系统图，也不应被理解为完整的内部软件架构。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE010
      - CE012
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据支持一条围绕价值发现、首次购买、重复信任、品类扩张和地域扩张展开的消费者旅程，但持久性数据仍然缺失。
    data:
      nodes:
        - title: Discovery
