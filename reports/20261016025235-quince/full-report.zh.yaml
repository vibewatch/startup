      - number: '3.2'
        title: Quince 为什么能赢得第一次点击
        blocks:
          - type: paragraph
            body: >-
              保留证据显示，Quince 的优势不只是“更便宜的基础款”。公司和多个独立来源都描述了一个厂商直达消费者系统：砍掉采购、批发和零售费用的多层加价，再用产品页面上的直接并列对比表强化价值主张。TechCrunch
              早期报道显示，这一模式把商品从工厂直接送到客户；Sacra 和 Marketplace
              则描述了一套研究已验证需求、选择熟悉产品模板并在决策点转化需求的商品引擎。实际而言，当购物者已经知道要买哪一类商品、看到明显的标价差距，并愿意把品类熟悉度和对比图表当作足够的信任基础时，Quince
              就能赢得第一次点击。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP012
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP013
              - CP016
      - number: '3.3'
        title: 竞争对手仍拥有更好的资产
        blocks:
          - type: paragraph
            body: >-
              同一批证据也显示竞争对手的明确优势区。Sacra 的竞争框架认为 Zara 和 H&M 拥有更强流量与全渠道密度，Amazon Haul
              在商品化品类中则提供更激进的便利加低价组合。Brooklinen、Parachute、Mejuri 和 Aurate
              等专家品牌，在买方更看重品类信任而不是跨品类性价比时，仍能凭借权威压过综合型品牌。Business of Fashion 补充了战略回应：高端品牌正靠独特设计、精选品类和更难复制的身份来避开直接价格战。换句话说，
              Quince 能赢基础款和熟悉模板，但当产地、工艺、送礼把握度或自有审美比标价更重要时，它并不会自动胜出。
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP013
