evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Directly disclosed customer count, current employee count, gross margin, EBITDA, cash burn, and cash runway.
    whyItMatters: These metrics determine whether the valuation step-up reflects durable economics or only top-line momentum.
    diligencePath: Request a current KPI pack or board deck with audited or CFO-certified operating metrics.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance-and-cap-table
    missingEvidence: >-
      Current board roster, voting control, liquidation preferences, any secondary component of the major rounds, and
      any debt or credit facilities.
    whyItMatters: >-
      Ownership and governance terms determine downside protection, exit optionality, and how much founder concentration
      is balanced by institutional oversight.
    diligencePath: Request the cap table, term sheets, board list, and any credit or warehouse-financing documentation.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: capital-history-completeness
    missingEvidence: A filing-grade reconstruction of lifetime capital raised before and outside the retained 2025-26 round coverage.
    whyItMatters: >-
      Later valuation work should distinguish the latest primary raise from full capital invested and from any secondary
      liquidity.
    diligencePath: Reconcile management's financing history against investor materials and a current cap-table summary.
    relatedQuestionRefs:
      - QO003
  - type: missing-source
    severity: material
    topic: sam-som-sizing
    missingEvidence: >-
      Public category-level revenue mix, regional split, and channel mix needed to convert broad luxury and cohort
      lenses into a defensible Quince SAM or SOM.
    whyItMatters: >-
      Without a reachable-market bridge, valuation and growth underwriting rely on adjacent market proxies rather than
      the serviceable pool Quince can actually capture.
    diligencePath: >-
      Request category revenue mix, regional GMV, new-versus-repeat split, and management's internal market map by
      category and geography.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-economics
    missingEvidence: >-
      Public sources do not disclose cohort retention, repeat-purchase cadence, B2B contract sizes, or budget
      concentration by customer segment.
    whyItMatters: >-
      Those missing unit economics determine whether Quince's observed scale is broad-based market adoption or
      concentrated in a narrower set of cohorts and programs.
    diligencePath: >-
      Obtain cohort tables, repeat-rate by category, B2B pipeline composition, and segment contribution margins from
      management or data room materials.
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: missing-source
    severity: material
    topic: realized-pricing-and-margin
    missingEvidence: Category-level realized prices, return rates, gross margins, and contribution margins versus premium peers.
    whyItMatters: >-
      Visible list-price gaps show substitution pressure, but they do not prove whether Quince's value wedge is
      structurally durable or subsidized by unseen margin tradeoffs.
    diligencePath: >-
      Request management or lender materials with category P&Ls, return-cost cohorts, and realized discounting by major
      category.
    relatedQuestionRefs:
      - QP007
  - type: missing-source
    severity: material
    topic: retention-and-switching-cost
    missingEvidence: >-
      Repeat-purchase, cohort retention, loyalty behavior, and category-level share-of-wallet data versus specialists
      and platform substitutes.
    whyItMatters: >-
      The retained pool explains why buyers click into Quince, but it does not prove whether they stay when a cheaper
      platform or a more trusted specialist is available.
    diligencePath: Request cohort tables, repeat-rate data, post-purchase survey results, and branded-search share by category.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: minor
    topic: internal-build-response
    missingEvidence: >-
      Supplier exclusivity terms, private-label roadmaps, or merchant planning documents from incumbents that show how
      quickly they can copy Quince's assortment economics.
    whyItMatters: >-
      Public category evidence shows retailer and platform substitutes, but private merchant evidence would clarify how
      fast incumbents can reproduce Quince's offer architecture.
    diligencePath: >-
      Interview merchants, sourcing managers, and suppliers; review private-label strategy decks or supplier contracts
      where available.
    relatedQuestionRefs:
      - QP004
  - type: private-evidence-only
    severity: material
    topic: disclosure-gaps
    missingEvidence: Management P&L, gross margin, contribution margin, EBITDA, free cash flow, monthly burn, ending cash, and runway.
    whyItMatters: >-
      Without the core margin and cash view, the latest funding round cannot be translated into a capital-adequacy
      judgment.
    diligencePath: >-
      Request the latest board package or audited financials with monthly cash flow, balance sheet, and category P&L
      detail.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-acquisition
    missingEvidence: >-
      Paid and blended CAC, payback period, repeat-purchase rate, cohort retention, active-customer counts, and return
      behavior.
    whyItMatters: >-
      The public efficiency story depends on repeat demand and acquisition economics, especially for a DTC brand
      operating in a CAC-inflation environment.
    diligencePath: >-
      Request channel-level marketing spend, CAC/payback by cohort, and retention dashboards tied to net revenue after
      returns.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: valuation-data-quality
    missingEvidence: >-
      A reconciled cap table and financing memo showing total primary capital raised, current post-money valuation, and
      whether reported amounts include secondary or debt components.
    whyItMatters: >-
      Secondary databases conflict on Quince's current valuation and total funding, which can distort entry-multiple and
      dilution analysis.
    diligencePath: >-
      Request signed financing documents, board approvals, and investor updates that reconcile the March 2026 round with
      prior financings.
    relatedQuestionRefs:
      - QI003
      - QI006
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Net realized price, discount rate, shipping subsidy, return rate, and landed gross margin by category.
    whyItMatters: >-
      List-price examples and one SKU-level spread do not establish realized monetization quality or blended gross
      profit.
    diligencePath: >-
      Request category price waterfalls from list price to net revenue, including promotions, refunds, fulfillment, and
      returns costs.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Independent developer-signal or practitioner evidence such as a public engineering talk, integration-partner
      technical case study, GitHub or package activity, or a documented API/status surface tied to Quince.
    whyItMatters: >-
      The strongest architecture details in this chapter are company-issued, so diligence cannot independently verify
      how much of forecasting, planning, or support execution is proprietary software versus partner workflow.
    diligencePath: >-
      Request engineering-org materials, integration architecture, and at least one third-party implementation
      reference; if no public developer surface exists, document the substitute proof path explicitly.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: trust-safety
    missingEvidence: >-
      A trust center, status page, certification register, or incident disclosure covering security, privacy, product
      quality, labor audits, or supply-chain traceability.
    whyItMatters: >-
      Public sources document stated standards and materials verification language, but they do not independently verify
      certifications, monitoring cadence, or incident history.
    diligencePath: >-
      Request SOC or ISO scope, supplier-audit summaries, UFLPA or CTPAT traceability materials, and any recall or
      incident reporting available to customers or regulators.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: deployment-metrics
    missingEvidence: >-
      Operational metrics for app adoption, return rates, delivery SLAs, on-time fulfillment, and category-level launch
      performance.
    whyItMatters: >-
      Without service-level and adoption metrics, deployment maturity is inferred from scale claims and storefront
      features rather than proven by reliability or retention data.
    diligencePath: >-
      Request KPI exports for app orders, returns, delivery performance, and launch-to-reorder behavior by major product
      line.
    relatedQuestionRefs:
      - QE004
      - QE008
