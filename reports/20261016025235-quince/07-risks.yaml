        - Medium-high
      - - Late-stage capital providers
        - ICONIQ-led investor syndicate
        - Funds international growth, supply-chain buildout, and platform expansion
        - Medium near term after the Series E, but still important for future optionality
        - Weaker operating proof could force slower growth or a valuation reset in the next financing cycle
        - Medium
