callouts:
  - calloutType: risk
    title: Kill criteria before underwriting this risk stack
    body: >-
      Break the thesis if discovery shows a material injunction or reserve exposure in the Williams-Sonoma or
      Coach matters, if management cannot evidence supplier-traceability and factory-audit controls for core
      categories, or if new regulated categories depend on partners without auditable compliance and service
      controls.
    claimRefs: [CR001, CR004, CR009, CR012]
