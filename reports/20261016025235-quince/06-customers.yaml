        - Discovery through influencer and short-form social content
        - Production
        - ProofStory says Quince's viral content introduced the brand to Gen Z and younger millennials; Forbes independently describes Gen Z as highly value-conscious
        - Cohort conversion, CAC, and retention are not disclosed
      - - Canadian DTC shoppers
        - Cross-border consumer expansion
        - Live e-commerce launch beyond the original U.S. base
        - Production
        - TechCrunch and Retail Dive both report a January 2026 Canada expansion
        - No country-level order, repeat, or profitability data
      - - Aspirational luxury trade-down consumers
