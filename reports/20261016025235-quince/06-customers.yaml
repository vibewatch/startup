        - No disclosed fill rate, stockout rate, or returns rate
    notes: Dates and values are as reported by sources; public evidence is strongest on top-line scale and weakest on cohort durability.
    claimRefs: [CU002, CU004, CU006, CU007, CU008, CU011, CU012]
