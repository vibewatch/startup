  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-metrics
      missingEvidence: Public customer count, repeat-purchase rate, NRR, GRR, churn, and cohort curves.
      whyItMatters: These metrics determine whether Quince's visible top-line growth converts into durable customer economics.
      diligencePath: Request cohort tables by acquisition quarter, repeat-purchase behavior by category, and any board-level retention KPIs.
      relatedQuestionRefs: [QU005]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Named customer case studies, public reviews, or marketplace evidence that ties specific buyers to live usage and outcomes.
      whyItMatters: The chapter can only prove segment-level demand today, not durable advocacy from identifiable customer references.
      diligencePath: Pull first-party customer stories, verified review excerpts, marketplace ratings, and geography-tagged repeat-order evidence.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration-disclosure
      missingEvidence: Geography mix, category mix, app-versus-web mix, and any concentration of demand in hero products or cohorts.
      whyItMatters: Expansion can look healthy while still being dependent on a narrow product wedge or a small number of high-performing segments.
      diligencePath: Request revenue and order mix by country, category, and first-versus-repeat customer, plus top-SKU concentration over time.
