  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: Public NRR, GRR, churn, renewal cadence, task-frequency cohorts, or time-on-device engagement curves after implantation.
      whyItMatters: Without durability metrics, clinical feasibility does not yet translate into evidence of lasting user value or repeatable account quality.
      diligencePath: Request patient- or site-level longitudinal usage cohorts, attrition data, and any post-implant follow-up dashboards used internally.
      relatedQuestionRefs: [QU005]
    - type: private-evidence-only
      severity: material
      topic: reimbursement-procurement
      missingEvidence: Pricing, reimbursement wins, purchasing entity, contract structure, and evidence that hospitals or payers will fund the system post-approval.
      whyItMatters: The current public record supports user need and workflow logic, but it does not show who actually pays or how commercial conversion will happen.
      diligencePath: Ask for payer conversations, reimbursement roadmap, proposed ASP and service model, and any draft hospital procurement or coverage materials.
      relatedQuestionRefs: [QU001, QU008]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: An exhaustive, current roster of implanted users, sites, and whether each proof point is investigational, pilot, or commercial.
      whyItMatters: The chapter can sample strong named proofs, but it cannot quantify concentration, breadth of adoption, or the share of use that has moved beyond trials.
      diligencePath: Request a site-by-site installed-base table with patient counts, program status, activation rate, and any named commercial or payer-backed deployments.
