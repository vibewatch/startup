schemaVersion: "report-v2"
artifact: customers
slug: synchron
runDate: 2026-10-19
company:
  name: Synchron
chapter:
  number: 6
  title: Customers
  summary: >-
    Synchron's customer proof is credible but still early: retained public evidence supports 10 implanted patients,
    a six-patient multi-site COMMAND cohort, and named Apple/Alexa use cases rather than a pure logo page. The
    commercial stack remains pre-revenue and investigational, with no public disclosure of payer wins, pricing,
    retention, or concentration, so adoption quality is stronger than durability proof.
sections:
  - id: current-customer-stack
    title: Who the current customer really is
    body: >-
      Synchron's near-term "customer" is a multi-sided stack rather than a conventional enterprise account list.
      The end user is a person with severe paralysis seeking digital independence, while the operational adopter is
      the implanting clinical site and the future economic buyer is still unresolved between providers and payers.
      Public materials repeatedly frame the product as an everyday assistive interface rather than a hospital-only
      experiment, and third-party coverage reinforces that the company is optimizing for procedures and workflows
      that fit catheter-lab infrastructure. That makes the most credible current customer evidence clinical and
      workflow-oriented, not contractual or revenue-oriented, and it explains why adoption proof is ahead of
      commercial-procurement proof.
    claimRefs: [CU001, CU008, CU009, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Adoption proof is clinical, not commercial yet
    body: >-
      The strongest public adoption signal is that Synchron says 10 patients with paralysis have already received
      the device across studies in the U.S. and Australia, and independent clinical coverage describes a six-patient,
      three-site COMMAND cohort with 12-month safety follow-up. That is materially stronger than a preclinical demo,
      because public sources describe implanted users producing digital motor outputs, completing digital tasks, and
      appearing in named Apple Vision Pro and Amazon Alexa demonstrations. But every retained proof point still sits
      inside clinical or investigational settings; none of the sources document commercial account count, paid site
      conversions, or a repeatable procurement funnel.
    claimRefs: [CU002, CU003, CU004, CU005, CU007]
    tableRefs: [TU002, TU003]
  - id: expansion-loops
    title: Expansion depends on integrations and operator scale-up
    body: >-
      Synchron's clearest expansion loop is not land-and-expand software spend; it is added utility across more
      digital surfaces and a broader set of implanting operators. Apple device support, Alexa demonstrations, and
      business-press descriptions of home-control use cases show how a single implant can become more valuable as
      integrations broaden. At the same time, outside analysis argues that the company is deliberately designing
      around interventional-radiology workflows instead of craniotomy-heavy neurosurgery, which could widen the
      operator base if pivotal data and reimbursement fall into place. That is a plausible scale path, but it is
      still a prospective one because the current user base remains small and trial-led.
    claimRefs: [CU006, CU008, CU009, CU010]
  - id: durability-and-concentration
    title: Durability and concentration risk are still under-evidenced
    body: >-
      The retained sources provide meaningful evidence that implanted users can keep using the system over a
      12-month safety window, but they do not provide the commercial durability metrics an investor would normally
      use to judge retention or concentration. No retained source discloses pricing, reimbursement wins, renewal
      behavior, account concentration, or customer-share by site or channel. Independent sources also underline
      why those missing details matter: Synchron's first-generation system still trades bandwidth for minimally
      invasive deployment, and even the pivotal trial endpoints were still being discussed with the FDA in late
      2024. The result is a customer chapter with solid proof of need and promising adoption mechanics, but a
      still-open diligence file on economic durability.
    claimRefs: [CU004, CU010, CU011, CU012, CU013]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Current proof
      - Strategic value
      - Gap
    rows:
      - - Severe paralysis patients
        - User = patient; economic buyer and payer are not publicly disclosed
        - Communication, cursor control, and device interaction without muscle use
        - 10 implanted patients; six-patient COMMAND cohort; Apple and Alexa demonstrations
        - Core initial demand signal and clinical-evidence base
        - No public pricing, reimbursement, or active-user retention metrics
      - - Implanting clinical sites
        - Adopter = trial hospital teams and investigators; payer remains unclear
        - Implantation, follow-up, and evidence generation
        - COMMAND ran across three U.S. sites under an FDA IDE
        - Bridge from investigational use to pivotal enrollment and referrals
        - No site-by-site throughput, conversion, or utilization data
      - - Caregivers and home support ecosystem
        - User influencer rather than disclosed direct buyer
        - Smart-home control, messaging, video calls, and daily independence
        - Alexa and Apple demonstrations show daily-life use cases beyond a lab screen
        - Strengthens the functional-independence story for future payer discussions
        - No public adherence, session-frequency, or caregiver-engagement data
      - - Platform and channel partners
        - Partner/channel layer; end payer still undisclosed
        - Extend the number of controllable devices and interfaces
        - Apple Switch Control integration and Alexa demonstrations are public
        - Increases utility without requiring a new implant
        - Revenue share, channel economics, and partner dependence are not disclosed
    notes: >-
      Buyer and payer fields stay descriptive because retained public sources show user and workflow proof but not
      pricing, contracting, or reimbursement detail.
    claimRefs: [CU001, CU003, CU006, CU007, CU009, CU011]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source signal
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Implanted users to date
        - 10 patients with paralysis
        - 2025-11
        - Synchron statement repeated in Business Wire and Medical Device Network
        - High
        - Installed-base proof is larger than a one-off prototype case
        - No active-user split, attrition, or upgrade path disclosed
      - - COMMAND enrollment footprint
        - 6 patients across 3 U.S. clinical sites
        - 2024-10
        - Endovascular Today and Clinical Trials Arena
        - Medium
        - Shows multi-site clinical adoption rather than a single-center pilot
        - No referral-to-implant funnel or waitlist data
      - - Safety and continued-use milestone
        - Primary endpoint met with no device-related serious adverse events over 12 months
        - 2024-10
        - Endovascular Today, Clinical Trials Arena, and Citeline
        - Medium
        - Supports continued use and pivotal progression
        - No cohort retention or task-frequency history
      - - Integration-led utility expansion
        - Apple Switch Control integration plus public Alexa and Vision Pro demonstrations
        - 2024-2025
        - Business Wire, Citeline, and Medical Device Network
        - Medium
        - One implant can expand across more daily digital surfaces
        - No disclosed frequency-of-use or feature attach rates
      - - Commercial launch preparation
        - $200M Series D allocated to pivotal trials, launch prep, and team growth
        - 2025-11
        - Medical Device Network, Business Wire, and MedTech Dive
        - Medium
        - Customer growth is still capital-funded and pre-revenue
        - No bookings, pricing, or conversion data
    notes: >-
      Dates reflect the latest retained public statement for each milestone; the final column marks where public
      evidence omits the denominator needed to judge adoption quality.
    claimRefs: [CU002, CU003, CU004, CU006, CU007, CU008, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Named proof
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome shown
      - Limitation
    rows:
      - - COMMAND cohort
        - Severe-paralysis trial users across three U.S. sites
        - Digital motor outputs and a range of digital tasks after implantation
        - Clinical pilot / investigational
        - 12-month safety endpoint met with no device-related serious adverse events
        - Does not prove paid deployment or site-level retention
      - - Amazon Alexa demonstration
        - Individual U.S. patient with paralysis
        - Thought-based control of lights and video calls through Alexa
        - Public demo within the clinical program
        - Named home-control proof beyond a lab-only cursor test
        - Single case; no repeat-use or household-conversion statistics
      - - Apple Vision Pro demonstration
        - Individual ALS patient
        - Thought-based cursor control on Apple Vision Pro
        - Public demo within the clinical program
        - Shows high-visibility ecosystem integration on a consumer device
        - Demonstration does not establish broad payer demand or scaled procurement
    notes: >-
      This is a representative sample of public named-user proof from retained 2024-2025 sources, not a complete
      roster of all implants, sites, or active accounts.
    enumerationScope:
      coverage: sample
      basis: >-
        Rows cover the named public user proofs present in retained 2024-2025 sources; the pool does not provide
        an exhaustive installed-base list or a complete site-by-site user census.
    claimRefs: [CU003, CU004, CU005, CU007]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Synchron's current journey runs from severe-paralysis need and clinical referral into implantation,
      calibration, and then broader utility through Apple and smart-home integrations.
    data:
      items:
        - label: Need and referral identified
          actor: Patient / caregiver
          stage: Need discovery
          touchpoints:
            - Severe paralysis
            - Digital independence need
          note: Public proof starts with paralysis patients rather than broad consumer adoption.
          tone: neutral
        - label: Clinical site qualification
          actor: Investigators / implanting site
          stage: Investigational intake
          touchpoints:
            - COMMAND sites
            - FDA IDE study
          note: Current onboarding is still anchored in named clinical programs and sites.
          tone: neutral
        - label: Implant procedure
          actor: Interventional team
          stage: Implantation
          touchpoints:
            - Jugular-vein delivery
            - ~20 minute median deployment
          note: The workflow is designed around catheter-based delivery rather than open-brain surgery.
          tone: positive
        - label: Calibration and first control
          actor: Patient
          stage: Early use
          touchpoints:
            - 15-20 minute onboarding
            - Digital motor outputs
          note: Early utility is meaningful but still bounded by current performance and training needs.
          tone: neutral
        - label: Daily device utility
          actor: Patient / caregiver
          stage: Ongoing use
          touchpoints:
            - Computer control
            - Messaging
            - Smart-home tasks
          note: Public demonstrations show practical utility beyond a bench prototype.
          tone: positive
        - label: Integration and launch expansion
          actor: Partner ecosystem / commercial team
          stage: Scale path
          touchpoints:
            - Apple devices
            - Alexa
            - Pivotal-trial prep
          note: Commercial scaling still depends on pivotal evidence, reimbursement, and operator expansion.
          tone: risk
    approximationNotes: >-
      Sequence reflects the retained public workflow from referral to use; it is illustrative and does not imply
      measured conversion rates between stages.
    claimRefs: [CU001, CU005, CU006, CU009, CU010, CU013]
callouts:
  - calloutType: strength
    title: Public proof goes beyond logo pages
    body: >-
      Synchron's retained evidence includes implanted-user counts, named trial sites, and concrete Apple/Alexa
      use cases, which is materially stronger than a pre-revenue medtech slide full of unaudited logos.
    claimRefs: [CU002, CU003, CU007]
  - calloutType: risk
    title: Commercial durability evidence still lags clinical proof
    body: >-
      The chapter supports safety, use-case breadth, and launch preparation, but it does not support pricing,
      payer wins, concentration, or contract durability, so the commercial thesis still rests on future execution.
    claimRefs: [CU008, CU011, CU012, CU013]
  - calloutType: insight
    title: The commercial stack matters as much as the implant
    body: >-
      Customer quality here depends on more than brain-signal performance: operator workflow fit, ecosystem
      integrations, reimbursement, and site expansion are the real bridge from clinical enthusiasm to durable demand.
    claimRefs: [CU006, CU009, CU011]
