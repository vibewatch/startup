    claimRefs: [CM004, CM008, CM009]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - ALS with severe upper-limb paralysis
        - Implanting neurovascular center
        - Patient and caregiver
        - Medicare-oriented payer mix plus hospital support
        - Restore texting, cursor control, and communication
        - Neuro-interventional or assistive-tech program
        - Clinical utility beyond safety in daily digital tasks
      - - Spinal cord injury paralysis
        - Specialized implant center or rehab-linked hospital
        - Patient and caregiver
        - Commercial or public payer
        - Restore digital device access and environmental control
        - Rehab or neurotechnology budget owner
        - Reliable home use and independence gains
      - - Stroke-related paralysis expansion
        - Neurology, stroke, or rehab provider network
        - Patient and caregiver
        - Public and private payer with broader population exposure
        - Extend motor-neuroprosthetic use beyond ALS
        - Service-line budget plus payer approval
        - Pivotal data and a credible reimbursement path
      - - Platform and smart-home integration channel
        - Provider deploying the implant into daily workflows
        - Patient using iPad, Vision Pro, Alexa, or smart-home tools
        - Same healthcare payer stack as the implant
        - Translate neural intent into existing device ecosystems
        - Clinical program owner rather than consumer electronics buyer
        - Seamless device control that improves independence
    notes: >-
      Buyer and budget-owner roles are inferred from published commercialization and
      reimbursement commentary; management has not publicly disclosed launch-account
      sequencing or final payer contracts.
    claimRefs: [CM005, CM006, CM010, CM014]
figures:
  - id: FM001
    title: Constrained market-sizing stack for Synchron
    type: pyramid
    summary: >-
      Public evidence supports a narrowing stack from broad paralysis need proxies to the
      small clinically validated cohort behind Synchron's current commercialization case.
    data:
      items:
        - label: Global motor-impairment proxy
          displayValue: 15M people
          detail: >-
            Synchron's official technology page frames need around motor impairment, which
            is broader than the first reimbursable indication.
        - label: Global severe-paralysis proxy
          displayValue: ">30M people"
          detail: >-
            The University of Melbourne cites severe paralysis rather than motor impairment,
            so this is useful context but not a directly comparable denominator.
        - label: Initial U.S. ALS indication lens
          displayValue: 30k-40k candidates
          detail: >-
            Sacra's analyst lens approximates the first commercial use case, but the
            methodology is not published.
        - label: Stroke-expanded U.S. indication lens
          displayValue: 250k-300k candidates
          detail: >-
            Sacra argues stroke could widen the addressable pool materially if the
            indication expands beyond ALS.
        - label: Implanted patients to date
          displayValue: 10 patients
          detail: >-
            Business Wire says Stentrode BCIs have been placed in 10 patients across U.S.
            and Australian clinical trials.
        - label: COMMAND feasibility evidence
          displayValue: 6 patients / 3 sites
          detail: >-
            The current U.S. feasibility base is still a small cohort, which is why pivotal
            protocol design remains commercially decisive.
    approximationNotes: >-
      This stack mixes broad need proxies, analyst indication lenses, and validated trial
      cohorts. Layer order reflects commercialization narrowing rather than conversion or
      market share, and the 30k-40k / 250k-300k lenses are reproduced as published because
      the underlying methodology is not public.
    claimRefs: [CM004, CM007, CM009, CM012]
callouts:
  - calloutType: risk
    title: Coverage, not curiosity, is the gating variable
    body: >-
      Public demand proxies are easy to find, but the real bottleneck is translating
      feasibility data into payer-accepted clinical utility with a disclosed price and a
      public pivotal protocol. Until those pieces are visible, market sizing remains
      directional rather than fully underwritten.
    claimRefs: [CM006, CM012, CM013]
