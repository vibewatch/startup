      - number: '4.2'
        title: 牵引力代理指标与单位经济
        blocks:
          - type: paragraph
            body: >-
              Synchron 仍处于从试验走向上市的过渡期，因此公开牵引力主要是临床和运营信号，而非财务信号。同一发布方的独立报道存在内部矛盾：6 月 9 日文章称已植入 100 名患者，6 月 29 日文章却称超过 30
              名。 更早的 2024 年报道称，COMMAND 可行性试验中 6 名患者达到主要安全终点。 公开来源还提供了若干运营代理指标，包括第一代 16 电极设备、约两小时的临床试验手术，以及与成熟支架制造流程的兼容性。
              这些事实表明其照护路径可能比开颅替代方案更轻，但无法揭示 COGS、植入人工成本、服务负担、中心启动成本或回本周期。 因此，单位经济表是尽调地图，当前植入数量仍需公司直接核实。
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI010
              - CI011
              - CI012
