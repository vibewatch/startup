        - 主要监管把关方
        - 商业化时间取决于把早期 IDE 证据转化为关键性试验设计，再取得市场批准。
        - 要求提供关键性方案、终点共识、PMA 路径和时间表假设。
      - - NIH BRAIN Initiative
        - 公共研究支持方
        - 独立研究报道称 NIH 支持帮助承担了 COMMAND 的成本，这有助于临床可信度，但不必然延伸到后续商业化。
        - 确认非稀释性支持是否延续到后期试验，还是已随可行性工作结束。
      - - 临床中心网络（Mount Sinai / UB / UPMC + Carnegie Mellon 合作）
        - 试验交付合作伙伴
        - 这些中心产生了已披露的美国可行性证据，也可能成为关键性试验中心招募和医生背书的前身。
