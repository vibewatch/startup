      - number: '1.2'
        title: 领导层、治理透明度与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公开领导层信息高度集中在 Tom Oxley 身上。独立临床报道、融资银团材料和行业报道都称他为 CEO 及创始人；无论安全里程碑还是融资策略，他都是反复出现的管理层发声人。
              这呈现出一个由创始人主导的运营模式，但也意味着关键人物依赖，因为指定证据集没有以同等频率披露完整的现任董事会或广泛的高管梯队。 独立行业报道及 Synchron 自己的新闻档案均显示 Kurt Haggstrom
              担任首席商务官；随着公司从可行性数据走向关键性试验和上市准备，这说明商业化已有明确负责人。 Synchron 还在 2025 年宣布 Andy Rasdal 和 Mark Brister
              加入扩大的管理团队，但现有来源仍无法完整观察其治理深度。
            claimRefs:
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO006
      - number: '1.3'
        title: 资金基础、临床规模与里程碑节奏
        blocks:
          - type: paragraph
            body: >-
              当前来源集中，最能说明规模的信号是融资深度，而不是收入。Synchron 在 2025 年 11 月完成 $200 million D 轮融资，累计融资达到 $345 million。 Double Point
              Ventures 领投，参投方包括 ARCH、Khosla、Bezos Expeditions、NTI、METIS 以及多家新投资者。管理层称，这笔资金将用于关键性试验、商业上市准备，以及扩大纽约和圣迭戈的 AI
              与工程团队。 临床方面，独立报道称 COMMAND 研究中有 6 名美国患者达到一年主要安全终点；研究在 3 个临床中心开展，并在 NIH BRAIN Initiative 支持下依据 FDA 批准的 IDE
              运行。 这些都是重要的去风险进展，但商业化时间仍取决于关键性试验设计、报销策略，以及微创架构能否抵消负面行业报道所指出的通道数量限制。
