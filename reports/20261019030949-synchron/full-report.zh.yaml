  - id: TV002
    title: 正论 / 反论表
    columns:
      - 视角
      - 论点
      - 哪些变化会改变判断
    rows:
      - - 正论
        - 临床安全性去风险确实存在，因为 Endovascular Today 报道称，6 名 COMMAND 患者全部达到 12 个月主要安全性终点
        - 如果关键性试验方案、时间表和更大数据集能显示功能结果持久，论据会更有力
      - - 正论
        - 经颈静脉的血管内路径可能比基于开颅的系统更易规模化，因为它适配导管实验室工作流，也减轻操作负担
        - 关于植入吞吐量、培训和中心启动的独立证据，会强化渠道扩张论点
      - - 反论
        - 公开收入、盈利能力和定价数据仍未披露，因此很难用商业证据锚定最新估值
        - 经验证的收入、毛利率、ASP 和资金跑道披露会提升投资判断的可评估性
      - - 反论
        - Sacra 警告称，较少的通道数、信号质量、报销不确定性和 III 类审批风险，可能推迟商业化或压缩商业空间
        - 付款方里程碑、清晰的报销路径，以及无需侵入式升级也能达到足够性能的证据，会降低这一风险
    notes: 论点刻意按里程碑组织，因为指定公开来源没有披露足够经济数据，无法建立完整的价格对基本面模型。
