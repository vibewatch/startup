  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界始于辅助性数字控制，而不是泛化的 BCI TAM
        blocks:
          - type: paragraph
            body: >-
              公开证据把 Synchron 的目标定义为一项具体任务：帮助重度瘫痪患者恢复数字控制和沟通能力。因此，纳入的支出包括植入物、导管手术、解码软件、启用服务，以及让患者使用主流设备和智能家居工具的集成。
              排除项同样重要：消费级神经科技、非医疗增强、Synchron 明确表示当前并非目标的直接语音输出，以及不需要植入接口的通用无障碍软件。
              这一边界很关键，因为最宽泛的瘫痪或行动障碍统计反映的是需求，而不是当前可报销的产品市场。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM010
              - CM011
      - number: '2.2'
        title: 公开市场规模更像受约束的观察窗口，而非完整 TAM-SAM-SOM
        blocks:
          - type: paragraph
            body: >-
              公开数字只能用来勾勒边界。公司相关来源称有 15 million 运动障碍患者和超过 30 million 重度瘫痪患者，但两者对应不同人群，不能相加，也不能当作已验证的市场分母。 Sacra
              提供了最明确的适应症视角：其认为 Synchron 近期聚焦 ALS，可能对应约 30,000 to 40,000 名美国候选患者；若扩展至卒中，候选人群可能扩大至 250,000 to
              300,000，但方法论未公开。 因此，本章可以支持方向和边界逻辑，却无法搭建有明确发布方支持的精确 TAM/SAM/SOM 桥接。
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM007
              - CM009
              - CM012
      - number: '2.3'
        title: 医疗机构与支付方掌握经济入口，患者是最终用户
        blocks:
          - type: paragraph
            body: >-
              Synchron 的买方图谱首先属于医疗体系。最终用户是上肢严重瘫痪患者及其照护者，但经济路径要经过植入中心、康复或神经介入项目，以及判断独立性改善是否值得植入设备和持续软件支持的支付方。
              公开评论反复指出，商业化的关键证明是临床效用，而非新颖性。因此，预算更可能来自医院服务线和支付方覆盖决策，而不是直接消费者需求。 与 Apple、Alexa
              及智能家居工作流的集成强化了价值主张，因为它把收益落在日常设备控制上，而不是抽象的神经科学演示。
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM014
      - number: '2.4'
        title: 采用取决于临床工作流适配，但报销和方案透明度仍限制判断
        blocks:
          - type: paragraph
            body: >-
              Synchron 最强的市场驱动力是手术流程适配：能够沿用现有导管室和介入放射学流程的血管内植入，比以开颅为起点的路径更容易扩大规模。
              但这一优势也伴随真实约束。产品明确在通道数量和信号保真度之间做出取舍；能够把可行性转化为审批证据的关键性试验设计细节尚未公开；公开市场上也没有商业定价或支付方方案。 独立评论还把 BCI
              视为多玩家市场，而非赢家通吃的争夺，因此估值不在于宣称一个巨大而笼统的 TAM，而在于证明一套可持续的瘫痪工作流、一条支付路径和一种可重复的医疗机构部署模式。
            claimRefs:
              - CM003
              - CM006
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 决定性变量是覆盖，而不是好奇心
            body: 公开需求代理指标并不难找到，但真正的瓶颈是把可行性数据转化为支付方接受的临床效用，同时公开价格和关键性试验方案。 在这些信息出现之前，市场规模只能作为方向性判断，尚不足以完成完整投资评估。
            calloutType: risk
            claimRefs:
              - CM006
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场参与者与解决方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争集合不只是“其他 BCI 初创公司”。保留的来源把 Synchron 与 Neuralink、Paradromics、Precision Neuroscience 和 Blackrock
              Neurotech 等直接皮层植入开发商放在一起， 同时也暗示语音、触控和依赖眼动追踪的辅助控制是替代路径。Synchron 的核心主张不是信号保真度最高，而是无需开颅即可恢复数字控制，从而显著降低手术采用门槛。
              这很重要，因为当前买方仍在评估 BCI 能否安全植入、能否借助现有医院工作流扩展，以及能否在真实患者身上验证；只有之后，买方才会细看产品经济性。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP005
              - CP008
