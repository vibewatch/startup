              多个独立来源明确描述了这一取舍：群体级记录和较少的通道数限制指令丰富度，但同一架构也降低了开颅 BCI 系统难以克服的手术负担。 2025 年融资还把产品故事从第一代 Stentrode
              扩展到具体的平台延伸，包括 Apple 的 BCI-HID 工作流、连接消费设备的 Bluetooth 控制路径，以及由扩大的 AI 和工程团队支持的下一代经导管高通道接口。
