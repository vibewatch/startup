      - number: '4.3'
        title: 资金需求与融资依赖
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务证据是近期融资，而不是运营自给。Synchron 在 2025 年 11 月宣布完成 2 亿美元 D 轮融资，累计融资达到 3.45 亿美元； 独立的 2026 年 6 月报道随后称，公司完成
              2.75 亿美元 E 轮融资，累计融资超过 5.75 亿美元。 重要的是，披露的资金用途并非泛泛的资产负债表补充，而是用于加速关键性试验、扩大布鲁克林制造规模，以及建设 PMA 路径所需的临床支持基础设施。
              这说明资金充足性有所改善，但也表明商业化仍依赖公司持续完成昂贵的监管、制造和现场支持里程碑，而不是依靠已经披露的经常性收入。
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI007
              - CI008
              - CI016
      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              财务结论对商业设计持方向性积极态度，但仍不足以支持完整投资评估。Synchron 似乎拥有可扩展的交付模式：植入可沿用标准导管室式流程，避免开颅，并配套软件和支持服务。
              然而，公开证据仍没有提供判断收入质量和利润路径所需的核心指标。主要阻碍包括未披露的定价和报销机制、缺失的收入及毛利率披露，以及指定证据中没有现金消耗或资金续航细节。 Sacra
              的报销警告尤其重要：如果支付方覆盖落后于临床成功，公司可能资金充足，却仍受商业化约束。 下一步应要求管理层披露植入 ASP、收入毛额转净额、支付方路径、单患者支持成本和 E 轮后的现金续航。
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
