  - id: FM001
    title: Synchron 的受限市场规模测算栈
    type: pyramid
    summary: 公开证据支持一条逐步收窄的测算链：从广义瘫痪需求代理指标，收窄到支撑 Synchron 当前商业化判断的小型临床验证队列。
    data:
      items:
        - label: 全球运动障碍代理指标
          displayValue: 15M people
          detail: Synchron 官方技术页面围绕运动障碍定义需求，其范围大于首个可报销适应症。
        - label: 全球严重瘫痪代理指标
          displayValue: '>30M people'
          detail: Melbourne 大学引用的是严重瘫痪而非运动障碍，因此这是有用的背景，但不是可直接比较的分母。
        - label: 美国初始 ALS 适应症视角
          displayValue: 30k-40k candidates
