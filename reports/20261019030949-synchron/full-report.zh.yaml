            - 铂铱电极阵列
          outputs:
            - 群体层面的神经信号
        - label: 植入式中继硬件
          detail: 植入导线与胸部遥测路径
          modules:
            - 血管内植入物引出的导线
            - 胸部接收器 / 发射器
          outputs:
            - 无线信号交接
        - label: 外部解码层
          detail: 将信号转换为点击、滚动和数字化运动输出
          modules:
            - 校准 / 入门流程
            - 解码器软件
          outputs:
            - 光标与指令控制
        - label: 设备与平台集成
          detail: 2025 年公开证实的消费设备控制界面
          modules:
            - Apple BCI-HID
            - Bluetooth 桥接
            - 智能家居接口
          outputs:
            - iPhone / iPad / Vision Pro 访问
        - label: 临床与路线图外层
          detail: 试验性部署与下一代接口项目
          modules:
            - COMMAND / 关键性试验路径
            - AI 解码团队
            - 高通道经导管路线图
          outputs:
            - 商业化准备
    approximationNotes: 公开记录证实了主要层级和集成，但没有提供完整方案、网络安全或下一代规格集合。
    claimRefs:
      - CE001
      - CE003
      - CE007
      - CE008
      - CE011
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Synchron 当前的旅程始于重度瘫痪患者的需求和临床转诊，经过植入、校准，再借助 Apple 和智能家居集成拓展日常用途。
    data:
      items:
        - label: 识别需求并完成转诊
          actor: 患者 / 照护者
          stage: 需求发现
          touchpoints:
            - 重度瘫痪
            - 数字化独立需求
          note: 公开证据从瘫痪患者开始，而不是从广泛消费者采用开始。
          tone: neutral
        - label: 临床中心筛选
          actor: 研究者 / 植入中心
          stage: 试验入组
          touchpoints:
            - COMMAND 中心
            - FDA IDE 研究
          note: 当前入组仍依托已点名的临床项目和中心。
          tone: neutral
        - label: 植入手术
          actor: 介入团队
          stage: 植入
          touchpoints:
            - 颈静脉递送
            - ~20 分钟中位部署时间
          note: 流程围绕导管递送设计，而不是开颅手术。
          tone: positive
        - label: 校准与首次控制
          actor: 患者
          stage: 初期使用
          touchpoints:
            - 15-20 分钟入门
            - 数字化运动输出
          note: 初期用途已经有实际意义，但仍受当前性能和训练需求限制。
          tone: neutral
        - label: 设备日常使用
          actor: 患者 / 照护者
          stage: 持续使用
          touchpoints:
            - 电脑控制
            - 消息发送
            - 智能家居任务
          note: 公开演示显示，其实用价值已经超出实验台原型。
          tone: positive
        - label: 集成与上市扩张
          actor: 合作伙伴生态 / 商业团队
          stage: 扩张路径
          touchpoints:
            - Apple 设备
            - Alexa
            - 关键性试验准备
          note: 商业化扩张仍取决于关键性证据、报销和运营团队扩充。
          tone: risk
    approximationNotes: 顺序体现保留的公开流程，从转诊一直到使用；仅用于说明，不代表各阶段之间已测得转化率。
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU009
      - CU010
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 公开证据显示，报销和关键性试验设计是最高的剩余风险，其次才是产品性能和部署执行。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓解成熟度
        - 剩余暴露
      rows:
        - label: 关键性试验 / PMA 路径
          note: 可行性安全性已有更清晰的证明，但关键性试验设计和时间表仍未明确。
          values:
            - label: 高
              tone: high
            - label: 关键
              tone: critical
            - label: 中
              tone: medium
            - label: 高
              tone: high
        - label: 报销 / 覆盖
          note: 市场准入仍取决于支付方行为，而公开先例很少。
          values:
            - label: 高
              tone: high
            - label: 关键
              tone: critical
            - label: 低
              tone: warning
            - label: 高
              tone: high
        - label: 相对竞争者的信号保真度
          note: 更低的侵入性是优势，但性能上限仍在测试。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 高
              tone: high
        - label: 植入患者基数有限
          note: 安全性和实用性证据仍集中在极少数患者身上。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 中高
              tone: high
        - label: 生态依赖
          note: 已展示的日常用途仍依赖外部平台和集成。
          values:
            - label: 中
              tone: medium
            - label: 中高
              tone: high
            - label: 中
              tone: medium
            - label: 中高
              tone: high
        - label: 融资充足性
          note: 新资金有所帮助，但公开来源没有披露现金消耗、资金可支撑期限或上市成本承受力。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 中高
              tone: high
    claimRefs:
      - CR003
      - CR005
      - CR007
      - CR011
      - CR012
      - CR014
  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 里程碑进展值得继续关注，但当前公开证据不足以支持不考虑价格的投资判断。
    data:
      nodes:
        - id: proof
          label: 临床安全性证明
          note: 6 名 COMMAND 患者达到 12 个月主要安全性终点；各项试验合计已披露 10 例植入
        - id: product
          label: 微创切入点
          note: 颈静脉递送、约 2 小时手术和次日出院是核心差异化
        - id: capital
          label: 新增资本
          note: $200M D 轮和 $345M 累计融资支持关键性试验及后续商业化工作
        - id: price
          label: 较高阶段估值
          note: 公开轮次估值参考指向接近 $1B 的估值，但收入和具体优先权仍未披露
        - id: downside
          label: 核心下行风险核查
          note: 报销、Class III 审批时间，以及相对直接皮层竞争者的较低带宽性能，仍待确认
        - id: decision
          label: 建议
          note: 跟踪 / 中等信心 / 高风险 / 公允估值立场
      edges:
        - from: proof
          to: product
          label: 验证
        - from: product
          to: capital
          label: 支持
        - from: capital
          to: price
          label: 重置预期
        - from: price
          to: downside
          label: 让尽调更关注价格
        - from: downside
          to: decision
          label: 导向
    approximationNotes: 这是定性决策链，而不是加权评分模型，因为现有公开证据没有披露足够的经济数据，无法进行公式化投资判断。
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV008
      - CV010
      - CV011
      - CV013
