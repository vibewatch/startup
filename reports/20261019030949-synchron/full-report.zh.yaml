          - type: paragraph
            body: >-
              Synchron 最有力的估值论据不是短期收入可见性，而是如果临床结果持续成立，这套产品架构可能扩大安装基数。 官方技术页面和 Sacra 都把 Stentrode
              描述为经颈静脉送入、无需开颅的血管内系统，试验手术约两小时，次日出院。 Sacra 还认为，这种方案能够适配标准导管室工作流；在公开证据中，这是最接近适合该模式的可扩展性锚点。 反论点同样清晰：Sacra
              警告，与直接皮层系统相比，Synchron 更少的通道数和较弱的信号质量可能限制性能；同时，III 类审批和报销仍是未解决的瓶颈。 因此，公开证据支持对里程碑敏感的论点，但不支持忽视执行、支付方或性能风险。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 情景应围绕里程碑，而不是虚假的精确度
        blocks:
          - type: paragraph
            body: >-
              本章证据足以支撑情景推演，却撑不起精确估值模型。公开来源确认了最新融资、临床安全性和产品的微创定位，但未披露收入、现金消耗、资金续航、ASP、报销进展或确切的清算优先权结构。
              因此，乐观情景必须假设关键性试验执行顺利且报销取得进展；基准情景必须假设里程碑推进但商业证明仍不完整；悲观情景则必须假设延期并伴随融资压力。
              尽调最需要拿到的是当前股权结构表和优先权条款、收入与现金消耗数据，以及关键性试验和支付方的详细路线图。在这些信息出现之前，公开证据支持严守入场纪律，不支持急于行动。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: 跟踪，不买入：技术和融资里程碑都很重要，但公开证据仍缺乏足够的商业和股权结构透明度，无法有把握地评估最新估值。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV013
          - type: callout
            title: 什么可能打破核心论点
            body: 关键性路径延期、报销牵引力疲弱，或证据显示血管内方案无法跟上高带宽竞争者，都会让当前估值很快显得过高。
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV014
