  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与工作流
        blocks:
          - type: paragraph
            body: >-
              Synchron 的产品不是泛化的“脑 AI”平台；当前公开证据更窄，也更具体。Stentrode 是植入大脑血管、靠近运动皮层的血管内设备，并配套外部控制软件，
              让重度瘫痪患者完成点击、滚动、发短信和操控联网设备等离散数字任务。 官方材料强调患者工作流收益：像导管手术一样送入，而不是开颅；随后患者可在家使用消费级硬件，而不必依赖只在实验室运行的研究装置。
              独立长篇报道进一步说明，这一设计追求的是“够用”的沟通和设备控制，而非精细的运动恢复。 因此，正确的投资评估框架是辅助计算工作流适配和部署负担，而不是单看电极数量。
            claimRefs:
              - CE001
