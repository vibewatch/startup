              - CP006
              - CP007
              - CP008
              - CP012
      - number: '3.2'
        title: 买方取舍、能力与产品组合
        blocks:
          - type: paragraph
            body: >-
              当前公开比较主要围绕工作流适配、信号丰富度和生态集成，而不是透明定价。Synchron 的血管内方案使用介入放射学，而非开颅神经外科；保留的独立分析将其视为重要的规模化优势。 代价是信号丰富度较低：保留来源反复称
              Stentrode 是一套 16 电极、群体级接口，而直接皮层系统追求更多通道和更复杂的解码任务。 Synchron 通过强调设备控制场景、公开的 Apple/Alexa
              演示，以及可以沿现有导管基础设施扩展的医院流程，部分弥补这一差距。 由于保留的竞争对手来源都没有披露公开标价，现实中的公开采购标准仍是手术负担、独立性改善证据和平台兼容性。
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP009
              - CP010
              - CP011
