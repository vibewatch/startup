  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - COMMAND 的安全性转化为成功的关键性试验执行，并且付款方接洽在现金压力重新出现前启动
        - 如果 Synchron 成为第一个规模化的微创 BCI 平台，并凭商业化准备度获得更高的下一轮融资或战略退出参考价，接近 $1B 的入场估值仍可能成立
        - 报销延迟，以及相较高带宽竞争者的性能上限
        - 需要披露关键性试验里程碑、付款方进展，以及商业化正从试验验证走向可重复部署的证据
      - - 基准
        - 临床和技术进展继续，但公开可见的收入和报销证据仍有限
        - 合理判断：当前价格可以用战略稀缺性解释，但尚未称得上明显便宜
        - 投资者等待下一个重大里程碑，上市时间因此拉长
        - 最符合当前证据组合：融资实力、真实的安全性进展，以及缺失的商业化披露
      - - 悲观
        - 关键性试验时间表延后、报销问题仍未解决，或产品性能被更高带宽的替代方案超越
        - 当前估值证明过高，下一轮融资只能按持平或更差的条款完成
        - 倍数压缩、稀释和更慢的采用
        - 触发因素包括试验结果延迟、付款方进展乏力，或证据显示微创便利性无法抵消较低性能
    notes: 情景分析采用定性方式，因为公开证据没有披露建立可信数值估值区间所需的收入、利润率、定价、现金消耗或确切优先权结构输入。
    claimRefs:
