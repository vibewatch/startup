            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP007
              - CP009
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP013
      - number: '3.3'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              Synchron 的护城河在工作流适配、微创进入方式和消费平台合作上，似乎比在绝对解码性能上更稳固。
              如果第一批商业市场奖励更安全的植入和面向瘫痪患者的日常数字控制，这一优势很有吸引力，因为公司已经围绕该论点积累了证据、合作伙伴和投资者支持。
              但如果买方或监管机构开始偏好更高带宽的应用，这一优势就没那么持久；直接皮层竞争者在信号密度和高级控制上仍拥有更强的技术叙事。 近期最大风险是执行：保留来源称关键性终点仍在与 FDA
              讨论，报销逻辑也仍在搭建；如果下一项试验、支付方策略或上市节奏令人失望，而竞争对手继续成熟，Synchron 的领先地位可能收窄。
            claimRefs:
              - CP005
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: Synchron 当前领先的是手术流程，而非纯技术
            body: 保留证据中最强的优势在于，Synchron 同时拥有血管内植入、公开的多患者结果，以及与现有医院工作流的适配。
            calloutType: strength
            claimRefs:
              - CP001
              - CP004
              - CP006
          - type: callout
            title: 高带宽竞争者仍可能重塑买方预期
            body: 如果市场从安全的数字控制转向更丰富的语音、灵巧操作或更高吞吐量应用，直接皮层系统即使当前植入负担更重，也可能重新掌握叙事主导权。
            calloutType: risk
            claimRefs:
              - CP007
              - CP012
              - CP013
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现透明度
        blocks:
          - type: paragraph
            body: >-
              Synchron 的公开材料描述了“设备加软件”的工作流，但没有公开价目表或已确认的收入项目。官方技术页面称 Stentrode 是研究性设备，手术约需两小时，次日即可出院；
              第三方分析则描述了一种可能把植入收入与经常性软件和数据服务结合起来的模式。 这一架构在商业上说得通，因为它与医院手术经济性和植入后的支持服务相匹配；但指定公开来源没有披露标价、实际
              ASP、合同期限、报销代码或收入确认政策。 因此，现有证据支持判断变现结构，而不足以证明当前收入质量。
            claimRefs:
              - CI001
              - CI004
              - CI012
              - CI013
              - CI015
