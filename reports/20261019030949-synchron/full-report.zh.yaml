  - id: TP002
    title: 功能 / 能力矩阵
    columns:
      - 购买标准
      - Synchron
      - 点名的竞争者 / 替代方案
      - 证据支持的含义
    rows:
      - - 植入工作流
        - 经颈静脉进行血管内植入；无需开颅手术
        - 直接皮层同行需要类似开颅手术的植入；替代方案完全不需要植入物
        - Synchron 最大的公开优势是手术负担更低，而非信号密度更高
      - - 信号丰富度
        - 16 电极、群体层面的运动意图解码
        - 直接皮层同行追求更高通道数，以及单神经元或更高带宽信号
        - 如果买方优先考虑精度而非工作流适配度，高性能应用可能更偏好皮层同行
      - - 已披露的临床证明
        - 已披露 6 名患者、12 个月的 COMMAND 安全性数据，以及共 10 次植入
        - 留存的同行报道显示 Neuralink 有两名已植入患者；其他同行在资料池中处于更早阶段，或描述不够完整
        - 就已披露的临床准备度而言，Synchron 领先于留存的公开证据集
      - - 生态集成
        - Apple BCI-HID、Apple Vision Pro、Amazon Alexa、与 NVIDIA 相关联的解码栈
        - 留存来源没有显示点名同行拥有同等具体的消费平台集成
        - Synchron 当前讲出了比同行更完整的分发和设备控制故事
      - - 人员 / 分发适配度
        - 可嵌入导管实验室和介入放射团队
        - 直接皮层同行依赖更专业的神经外科工作流；替代方案依赖残余肌肉 / 眼部控制
        - Synchron 优化的是可部署性和患者可及性，而不是最大带宽
    notes: 单元格只总结留存资料池支持的内容；对于同行未知的产品组合、带宽或集成声明，不根据笼统的 BCI 叙事推断，而是直接省略。
    claimRefs:
      - CP001
      - CP004
      - CP006
      - CP007
      - CP009
      - CP011
  - id: TP003
    title: 定价 / 产品组合比较
