              这降低了眼前的偿付压力，但没有解决两个相互关联的依赖。第一，产品故事仍依赖 Apple、Amazon 和未来连接合作伙伴等外部生态，才能在临床演示之外实现真实世界交互。
              第二，公开来源仍没有披露现金消耗、续航或报销经济性，因此投资者无法判断当前资产负债表是否足以覆盖延迟的 PMA 时间表、上市和持续研发。
