companyProfile:
  summary: >-
    Synchron 是一家血管内脑机接口公司，正在开发 Stentrode。这是一种微创设备，经颈静脉植入，而不是通过开颅手术植入。
    当前公开记录显示，公司已有真实临床进展、不断扩大的植入基数和充足的资金储备；但商业模式、准确的估值机制、报销路径和运营规模仍大体不透明。
  productSummary: 公司销售一种微创植入式 BCI 系统，把想法转化为数字指令，帮助瘫痪患者操作设备。
  customerFocus: 瘫痪及严重运动障碍患者
  businessModel: 医疗器械商业化，等待监管审批和报销落地
  stage: Series D
  fundingStatus: 2025 年 11 月完成 2 亿美元 D 轮融资，累计融资达到 3.45 亿美元
  disclosureProfile: private-disclosed
chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司定位、产品与当前运营状态
        blocks:
          - type: paragraph
            body: >-
              即使在证据受限的情况下，Synchron 的核心定位也十分清晰：公司正在开发 Stentrode，一种经颈静脉送入、无需开颅的血管内脑机接口。
              公司官网和技术页面都把产品定位为帮助瘫痪患者恢复沟通能力、独立性和自主权，同时仍明确称该设备处于研究阶段，仅限临床试验使用。 宣布 2025 年 D
              轮融资的同一批材料显示，公司位于纽约，并在圣迭戈设有工程和研究中心；这足以确认其总部和阶段，即一家处于 D 轮阶段的私营神经科技公司。
              但指定来源集无法支持准确的成立日期、经审计商业收入、当前员工人数或现任董事会名单，因此这些字段应明确保留为待尽调缺口，不应凭记忆或旧报告补齐。
