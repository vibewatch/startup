            body: >-
              对一家私营医疗科技公司而言，公开技术证据异常具体。官方页面、行业报道和 2025 年评述文章描述的架构一致：带 16 个电极的自膨胀镍钛支架记录运动意图信号，
              胸部植入物和导线传递信号，外部软件再把信号转成设备指令。 试验报道还给出了有意义的成熟度指标：COMMAND 在 FDA 批准的 IDE 下纳入 6 名美国患者，12
