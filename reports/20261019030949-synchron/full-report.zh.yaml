        - 该银团为关键性试验准备、上市工作以及 AI 和工程职能扩张提供资金，因此支撑 Synchron 的近期资金续航。
        - 要求提供董事会权利、清算优先权、储备额度，以及任何加码或 pay-to-play 条款。
