  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与报销风险主导剩余下行空间
        blocks:
          - type: paragraph
            body: >-
              最强的公开证据是 Synchron 已跨过重要的可行性里程碑，而不是已经完成商业化去风险。多个来源一致称，COMMAND 的 6 名美国参与者全部达到 12 个月主要安全终点，且没有器械相关严重不良事件；
              Endovascular Today 还称 COMMAND 是首个获 FDA 批准 IDE 的永久植入式 BCI 试验。 这很重要，因为它消除了 Stentrode
              路径最明显的神经安全疑虑。但下一道门槛更难：Citeline 报道称，在 2024 年读出后，Synchron 仍在与 FDA 讨论关键性试验终点； Clinical Trials Arena
              则称下一步是在商业审批前招募大型试验。 因此，Sacra 的下行情景是投资者更合适的框架：即使安全数据令人鼓舞，III 类植入物仍面临漫长的 PMA 路径，支付方覆盖也尚未得到证明。
