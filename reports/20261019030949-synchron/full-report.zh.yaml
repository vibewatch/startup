        - 血管内 BCI
        - 总融资 $345M；迄今已植入 10 名患者
        - 瘫痪 / ALS，并计划扩展至更广泛的运动障碍
        - 无开颅手术；面向 Apple 的设备控制；导管实验室工作流
        - 16 电极、带宽较低的系统；关键终点仍在讨论
      - - Neuralink
        - 直接皮层植入
        - 留存的 2024 年同行报道中有两名已植入患者
        - 高精度植入式控制 / 更广泛的 BCI 抱负
        - 更高带宽的直接皮层记录
        - 开颅手术负担，以及留存来源后来披露的临床时间线
      - - Paradromics
        - 直接皮层高带宽同行
        - 65,000 通道系统；留存的 Sacra 报道显示正在准备临床试验
        - 高带宽神经解码应用
        - 极高通道数设计
        - 留存来源仍显示其处于更早临床阶段，且植入具有侵入性负担
      - - Blackrock Neurotech
        - 具有临床历史的植入领域在位者
        - 留存的 Sacra 报道中有 '>30 名已植入受试者'
        - 辅助性神经假体 / 长期植入式 BCI 工作
        - 在点名同行中留存的临床历史最长
        - 通道数低于新进入者，且需要侵入性皮层植入
      - - Precision Neuroscience
        - 新兴植入领域同行
        - 被列为同行及 iBCI-CC 参与者；留存的公开规模细节有限
        - 塑造面向 FDA 标准的可植入 BCI 项目
        - 与 Synchron 处于同一监管生态
        - 留存资料池没有提供足够的公开产品、定价或规模细节
      - - 现状辅助控制
        - 替代方案 / 非 BCI 访问栈
        - 已部署的辅助技术替代方案；留存的 BCI 来源未量化
        - 仍可依靠触控、语音或眼动追踪输入的患者
        - 无需植入手术
        - 重度瘫痪患者独立性较低，正是 Synchron 试图解决的问题
    notes: 留存的公开来源高度偏向临床和产品定位证据；融资及患者数量仅在明确披露时列出，否则保留未知状态。
