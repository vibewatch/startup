          displayValue: 250k-300k candidates
          detail: Sacra 认为，如果适应症扩展到 ALS 之外，卒中可能显著扩大可触达患者池。
        - label: 截至目前的已植入患者
          displayValue: 10 patients
          detail: Business Wire 称，Stentrode BCI 已在美国和澳大利亚临床试验中植入 10 名患者。
        - label: COMMAND 可行性证据
          displayValue: 6 patients / 3 sites
