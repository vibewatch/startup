company:
  name: "Synchron"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Synchron is an endovascular brain-computer interface company whose Stentrode platform remains
    investigational but has advanced far enough to report six-patient U.S. feasibility data and to
    raise a $200 million Series D. The strongest current evidence supports its minimally invasive
    positioning, named commercialization milestones, and financing depth, while exact founding date,
    valuation, revenue, headcount, reimbursement path, and full governance disclosure remain
    unsupported in the assigned source pool.
sections:
  - id: "corporate-identity"
    title: "Identity, product, and current operating status"
    body: >-
      Synchron's core identity is unusually clear even in a constrained evidence set: the company is
      building the Stentrode, an endovascular brain-computer interface delivered through the jugular
      vein rather than by opening the skull. Its own homepage and technology page both position the
      product around restoring communication, independence, and agency for people living with
      paralysis, and they still describe the device as investigational and limited to clinical-trial
      use. The same financing materials that announced the 2025 Series D place the company in New
      York with an engineering and research hub in San Diego, which is enough to anchor headquarters
      and stage as a private Series D neurotechnology company. What the assigned pool does not
      support is a precise founding date, audited commercial revenue, current headcount, or a current
      board roster, so those fields should remain explicit diligence gaps rather than be backfilled
      from memory or older reports.
    claimRefs: ["CO001", "CO002", "CO003", "CO011", "CO015"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Leadership, governance visibility, and key-person dependence"
    body: >-
      Public leadership visibility is concentrated around Tom Oxley. Independent clinical coverage,
      syndicated financing materials, and trade reporting all identify him as CEO and founder, and
      he is the recurring executive voice on both safety milestones and financing strategy. That
      creates a visible founder-led operating model, but it also implies key-person dependence
      because the assigned evidence set does not expose a full current board or a broad executive
      bench with the same frequency. Kurt Haggstrom appears as chief commercial officer in
      independent trade reporting and in Synchron's own news archive, which is useful because it
      shows named commercialization coverage as the company moves from feasibility data toward
      pivotal trials and launch preparation. Synchron also announced executive expansion in 2025 with
      Andy Rasdal and Mark Brister, but the available pool still leaves governance depth only
      partially observable.
    claimRefs: ["CO004", "CO005", "CO006"]
    tableRefs: ["TO002"]
  - id: "funding-scale-and-milestones"
    title: "Funding base, clinical scale, and milestone cadence"
    body: >-
      The most decision-relevant scale signal in the current pool is financing depth rather than
      revenue. Synchron's November 2025 Series D added $200 million and brought cumulative funding to
      $345 million, with Double Point Ventures leading a syndicate that included ARCH, Khosla,
      Bezos Expeditions, NTI, METIS, and several new investors. Management said that capital would
      fund pivotal trials, commercial launch preparation, and larger AI and engineering operations in
      New York and San Diego. On the clinical side, independent reporting on COMMAND said six U.S.
      patients met the study's one-year primary safety endpoint and that the study operated across
      three clinical sites with NIH BRAIN Initiative support under an FDA-approved IDE. Those are
      material de-risking steps, but commercial timing still depends on pivotal-trial design,
      reimbursement strategy, and whether the lower-invasiveness architecture can offset the channel-
      count limitations highlighted in adverse trade coverage.
    claimRefs: ["CO007", "CO008", "CO009", "CO010", "CO011", "CO012", "CO013", "CO014", "CO015"]
    tableRefs: ["TO003"]
    figureRefs: ["FO001"]
