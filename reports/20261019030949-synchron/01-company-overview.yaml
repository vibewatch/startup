      - ["Kurt Haggstrom", "Chief commercial officer", "Named in independent medtech coverage and in Synchron's official news archive as the commercial lead.", "Adds named commercialization coverage as the company shifts from feasibility evidence toward launch planning and platform partnerships.", "Medium: visible commercialization ownership exists, but the broader public bench remains thin in the assigned pool."]
