  - id: "TO003"
    title: "Stakeholder or investor map"
    columns: ["Stakeholder", "Role", "Control or economic importance", "Diligence ask"]
    rows:
      - ["People with paralysis", "End users and clinical beneficiaries", "They are the entire disclosed user focus across the home, technology, and COMMAND study materials, so product-market fit is still tied to a narrow initial indication.", "Request patient-registry depth, by-indication prioritization, and any pilot-to-commercial funnel data."]
      - ["FDA / IDE-to-pivotal path", "Primary regulatory gatekeeper", "Commercial timing depends on converting early IDE evidence into a pivotal design and then market approval.", "Request pivotal protocol, endpoint agreement, PMA path, and timeline assumptions."]
      - ["NIH BRAIN Initiative", "Public research supporter", "Independent study coverage says NIH support helped underwrite COMMAND, which matters for clinical credibility but not necessarily later commercialization.", "Confirm whether non-dilutive support continues into later-stage trials or ended with feasibility work."]
      - ["Clinical-site network (Mount Sinai / UB / UPMC + Carnegie Mellon collaboration)", "Trial-delivery partners", "These sites generated the disclosed U.S. feasibility evidence and are likely precursors to pivotal-site recruitment and physician referenceability.", "Request site expansion plan, principal investigators, and enrollment-readiness for the pivotal phase."]
      - ["Apple device ecosystem", "Platform / integration partner", "Financing materials and the official news archive both frame Apple compatibility as a commercialization wedge for iPad, iPhone, and Vision Pro control.", "Request commercial terms, exclusivity limits, support obligations, and durability of protocol access."]
      - ["Double Point Ventures-led Series D syndicate", "Lead capital providers", "The syndicate financed pivotal-trial prep, launch work, and expansion of AI and engineering functions, so it underwrites Synchron's near-term runway.", "Request board rights, liquidation preferences, reserve capacity, and any step-up or pay-to-play provisions."]
    notes: "This partial map mixes customers, regulators, trial partners, and investors because the assigned pool provides stronger public signals on counterparties than on formal governance."
    enumerationScope:
      coverage: "partial"
      basis: "Compiled from retained company, financing, and independent clinical sources that explicitly named stakeholders or counterparties relevant to clinical execution and commercialization."
    claimRefs: ["CO002", "CO009", "CO012", "CO013", "CO015"]
