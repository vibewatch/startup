companyProfile:
  summary: >-
    Synchron is an endovascular brain-computer interface company developing the Stentrode, a minimally invasive device
    implanted through the jugular vein rather than open-brain surgery. The current public record supports real clinical
    traction, a growing installed base, and a strong capital runway, but it still leaves the commercial model, exact
    valuation mechanics, reimbursement path, and operating scale largely opaque.
  productSummary: >-
    The company sells a minimally invasive implanted BCI system that translates thought into digital commands for people
    with paralysis.
  customerFocus: People with paralysis and severe motor impairment
  businessModel: Medical-device commercialization, pending regulatory approval and reimbursement
  stage: Series D
  fundingStatus: Raised a $200 million Series D in November 2025, bringing total funding to $345 million
  disclosureProfile: private-disclosed
