callouts:
  - calloutType: risk
    title: Three thesis-break triggers are already visible
    body: >-
      The investment view breaks fastest if the pivotal trial slips or its endpoint framework is
      reset, if a device-related serious adverse event appears in a larger cohort, or if payer
      economics remain too weak to support reimbursed adoption after approval.
    claimRefs:
      - CR008
      - CR010
      - CR014
  - calloutType: insight
    title: Funding buys optionality, not proof
    body: >-
      The Series D gives Synchron room to run the next phase, but the public record still lacks
      the burn, runway, and reimbursement detail needed to prove the current capitalization is
      enough for PMA, launch, and a next-generation roadmap.
    claimRefs:
      - CR009
      - CR010
