  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pivotal-protocol
      missingEvidence: The pivotal protocol, endpoint hierarchy, sample size, enrollment plan, and recent FDA feedback minutes.
      whyItMatters: Approval timing and trial cost cannot be underwritten from six-patient feasibility data alone.
      diligencePath: Request the pivotal protocol package, recent FDA meeting readouts, and the board's trial-governance milestones.
      relatedQuestionRefs:
        - QR002
        - QR008
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: reimbursement-strategy
      missingEvidence: CMS and commercial payer pathway, coding plan, target pricing assumptions, and health-economic support package.
      whyItMatters: Coverage is the difference between a technically valid implant and a scalable reimbursed business.
      diligencePath: Review reimbursement workstream documents, payer-adviser memos, and planned HEOR endpoints for the pivotal study.
      relatedQuestionRefs:
        - QR004
      relatedTableRefs:
        - TR001
        - TR003
    - type: private-evidence-only
      severity: material
      topic: runway-and-burn
      missingEvidence: Current burn rate, cash runway, pivotal-trial budget, launch budget, and downside financing triggers.
      whyItMatters: Series D size alone does not prove Synchron can fund PMA, launch, and next-generation development without dilution or repricing risk.
      diligencePath: Review board materials, monthly cash reporting, milestone budgets, and financing contingency plans.
      relatedQuestionRefs:
        - QR006
      relatedTableRefs:
        - TR003
    - type: missing-source
      severity: minor
      topic: brain-data-governance
