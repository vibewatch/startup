company:
  name: Synchron
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports a **track** recommendation on Synchron: the company has
    raised a fresh $200 million Series D, reached a meaningful clinical safety milestone,
    and still has a differentiated minimally invasive product thesis. The same public
    record does not disclose revenue, unit economics, or the exact preference stack, so
    a nearly $1 billion valuation looks understandable on strategic scarcity but still
    too opaque for a conviction buy before pivotal-trial and reimbursement de-risking.
sections:
  - id: current-call
    title: "Current call: technical proof is real, but the price already assumes commercial conversion"
    body: >-
      The best-supported public view is **track / medium confidence / high risk / fair
      valuation**. Synchron has genuine progress to point to: MobiHealthNews,
      MassDevice, and the company-backed NeuroFounders release all report a $200 million
      Series D that brought total funding to $345 million, while Endovascular Today
      reports that all six COMMAND patients met the primary 12-month safety endpoint.
      That is enough to keep the company investable on milestone progress rather than on
      pure concept. The problem is price sensitivity. Silicon Valley Invest Club lists
      the November 2025 round at nearly $1 billion post-money and also notes that the
      full shareholder register is not public, while Sacra says public revenue and
      profitability figures were not found in available results. Without disclosed
      commercial revenue, payer traction, or preference-stack detail, the public record
      supports watching for the next proof points more than underwriting upside at the
      last marked price.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV013]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: The thesis is a distribution wedge; the anti-thesis is bandwidth, reimbursement, and financing opacity
    body: >-
      Synchron's strongest valuation argument is not near-term revenue visibility; it is
      that the product architecture may widen the install base if clinical results keep
      holding. The official technology page and Sacra both frame Stentrode as an
      endovascular system delivered through the jugular vein rather than through
      craniotomy, with a roughly two-hour trial procedure and next-day discharge. Sacra
      further argues that this approach can fit standard catheter-lab workflows, which is
      the closest thing in the public evidence to a model-appropriate scalability anchor.
      The anti-thesis is equally clear. Sacra warns that Synchron's lower channel count
      and signal quality versus direct cortical systems may cap performance, and it
      separately flags Class III approval and reimbursement as unresolved bottlenecks.
      Public evidence therefore supports a milestone-sensitive thesis, but not one that
      can ignore execution, payer, or performance risk.
    claimRefs: [CV008, CV009, CV010, CV011, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios should be framed around milestones, not false precision
    body: >-
      The chapter evidence is strong enough to support scenario logic, but not strong
      enough to support a precise valuation model. Public sources confirm the latest
      financing, clinical safety, and the product's minimally invasive positioning; they
      do not disclose revenue, burn, cash runway, ASPs, reimbursement progress, or the
      exact liquidation stack. That means a bull case must assume pivotal execution and
      reimbursement progress, a base case must assume milestone progress without clean
      commercial proof, and a bear case must assume delay plus financing pressure. The
      most important diligence asks are the current cap table and preference terms,
      revenue and cash-burn disclosure, and the detailed pivotal-trial plus payer
      roadmap. Until those are visible, public evidence supports entry discipline rather
      than urgency.
    claimRefs: [CV001, CV002, CV004, CV005, CV006, CV011, CV013]
    tableRefs: [TV003]
