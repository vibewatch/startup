  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: Exact post-money valuation, liquidation preferences, anti-dilution terms, board rights, and the current fully diluted cap table.
      whyItMatters: These terms determine whether the latest round's headline valuation is actually investable for a new entrant and how much downside protection incumbents already hold.
      diligencePath: Request the latest financing documents, cap table, and investor-rights schedule in diligence.
      relatedQuestionRefs: [QV001, QV007]
    - type: private-evidence-only
      severity: material
      topic: commercial-economics
      missingEvidence: Revenue, gross margin, ASP or pricing, current cash balance, monthly burn, and runway to pivotal readout.
      whyItMatters: Without core operating metrics, it is impossible to judge whether the latest financing is sufficient or whether another round is likely before commercialization.
      diligencePath: Request a monthly KPI package, management budget, and cash runway bridge through the next regulatory and commercial milestones.
      relatedQuestionRefs: [QV003, QV007]
    - type: private-evidence-only
      severity: material
      topic: reimbursement-and-pivotal
      missingEvidence: Detailed pivotal-trial protocol, site count, enrollment plan, readout timing, and payer or CMS reimbursement workstream evidence.
      whyItMatters: Valuation depends on the speed and credibility of the path from feasibility data to paid commercial adoption.
      diligencePath: Request the pivotal protocol, milestone calendar, and payer-engagement materials with named coding and coverage milestones.
      relatedQuestionRefs: [QV002, QV006]
