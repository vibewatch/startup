  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Argument
      - What would change the view
    rows:
      - [Thesis, "Clinical safety de-risking is real because Endovascular Today reported that all six COMMAND patients met the 12-month primary safety endpoint", "A pivotal protocol with timelines and a larger dataset showing durable functional outcomes would strengthen the case"]
      - [Thesis, "The endovascular jugular-vein approach may scale better than craniotomy-based systems because it fits catheter-lab workflows and reduces procedural burden", "Independent evidence on implant throughput, training, and site activation would strengthen the distribution thesis"]
      - [Anti-thesis, "Public revenue, profitability, and pricing data remain undisclosed so the latest valuation is hard to anchor to commercial proof", "Verified revenue, gross-margin, ASP, and cash-runway disclosure would improve underwritability"]
      - [Anti-thesis, "Sacra warns that lower channel count, signal quality, reimbursement uncertainty, and Class III approval risk could delay or compress commercialization", "Payer milestones, a clear reimbursement path, and evidence that performance is good enough without invasive upgrades would reduce this risk"]
    notes: >-
      Arguments are intentionally milestone-based because the assigned public sources do
      not contain enough disclosed economics for a full price-to-fundamentals model.
    claimRefs: [CV005, CV006, CV008, CV009, CV010, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "COMMAND safety translates into successful pivotal execution and payer engagement begins before cash pressure returns", "The nearly $1B entry can still work if Synchron becomes the first scaled minimally invasive BCI platform and earns a higher next-round or strategic-exit reference on commercial readiness", "Reimbursement delays and performance ceilings versus higher-bandwidth rivals", "Requires disclosed pivotal milestones, payer traction, and evidence that commercialization is moving from trial proof to repeatable deployment"]
      - [Base, "Clinical and technical progress continues but revenue and reimbursement proof stay limited in public view", "Fair stance: current price can be defended as strategic scarcity but not yet as an obvious bargain", "Time-to-market stretches while investors wait for the next major milestone", "Best matches the current evidence mix of financing strength, real safety progress, and missing commercial disclosure"]
      - [Bear, "Pivotal timing slips, reimbursement remains unresolved, or product performance is outpaced by higher-bandwidth alternatives", "The current mark proves too full and the next financing is done on flat or worse terms", "Multiple compression, dilution, and slower adoption", "Triggered by delayed trial readouts, weak payer progress, or evidence that minimally invasive convenience cannot offset lower performance"]
    notes: >-
      Scenarios are qualitative because public evidence does not disclose revenue, margin,
      pricing, cash-burn, or exact preference-stack inputs needed for a defensible
      numerical valuation range.
    claimRefs: [CV001, CV002, CV003, CV005, CV006, CV010, CV011, CV013, CV014]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Milestone progress supports continued attention, but current public evidence does not justify price-insensitive underwriting.
    data:
      nodes:
        - id: proof
          label: Clinical safety proof
          note: Six COMMAND patients met the 12-month primary safety endpoint; 10 total implants have been disclosed across trials
        - id: product
          label: Minimally invasive wedge
          note: Jugular-vein delivery, about a two-hour procedure, and next-day discharge are the core differentiation
        - id: capital
          label: Fresh capital
          note: $200M Series D and $345M total funding support continued pivotal and commercialization work
        - id: price
          label: Rich stage pricing
          note: Public round-mark references point to nearly $1B valuation while revenue and exact preferences remain undisclosed
        - id: downside
          label: Core downside checks
          note: Reimbursement, Class III approval timing, and lower-bandwidth performance versus direct cortical rivals remain open
        - id: decision
          label: Recommendation
          note: Track / medium confidence / high risk / fair valuation stance
      edges:
        - from: proof
          to: product
          label: Validates
        - from: product
          to: capital
          label: Supports
        - from: capital
          to: price
          label: Resets expectations
        - from: price
          to: downside
          label: Makes diligence more price-sensitive
        - from: downside
          to: decision
          label: Leads to
    approximationNotes: >-
      This is a qualitative decision chain rather than a weighted scoring model because
      the assigned public evidence does not disclose enough economics for formulaic
      underwriting.
    claimRefs: [CV001, CV003, CV006, CV008, CV010, CV011, CV013]
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Track, not buy: the technical and financing milestones are meaningful, but public
      evidence still lacks the commercial and cap-table transparency needed to underwrite
      the latest valuation with conviction.
    claimRefs: [CV001, CV003, CV005, CV006, CV013]
  - calloutType: risk
    title: What could break the thesis
    body: >-
      A delayed pivotal path, weak reimbursement traction, or evidence that the
      endovascular trade-off cannot keep up with higher-bandwidth competitors would make
      the current mark look full very quickly.
    claimRefs: [CV010, CV011, CV014]
