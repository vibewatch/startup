      - [Precision Neuroscience, Emerging implant peer, "Named as a peer and iBCI-CC participant; retained public scale details limited", "Implantable BCI programs shaping FDA-facing standards", "Relevant in the same regulatory ecosystem as Synchron", "Retained pool does not provide enough public product, pricing, or scale detail"]
      - ["Status-quo assistive control", "Substitute / non-BCI access stack", "Installed assistive-tech alternative; not quantified in retained BCI sources", "Patients who can still rely on touch, voice, or eye-tracking inputs", "No implant procedure", "Lower independence for severe paralysis is the problem Synchron is trying to solve"]
    notes: >-
      Retained public sources heavily favor clinical and product-positioning
      evidence; funding and patient counts are shown when explicitly disclosed,
      and otherwise unknowns remain unfilled.
    claimRefs: [CP003, CP005, CP008, CP010]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Synchron
      - Named rivals / substitutes
      - Evidence-backed implication
    rows:
      - ["Implantation workflow", "Endovascular via jugular vein; no open-brain surgery", "Direct cortical peers require craniotomy-style placement; substitutes avoid implants entirely", "Synchron's biggest public advantage is lower procedural burden, not superior signal density"]
      - ["Signal richness", "16-electrode, population-level motor-intent decoding", "Direct cortical peers pursue higher channel counts and single-neuron or higher-bandwidth signals", "Higher-performance use cases may favor cortical rivals if buyers prioritize precision over workflow fit"]
      - ["Clinical proof disclosed", "Six-patient 12-month COMMAND safety data and 10 total implants disclosed", "Neuralink had two implanted patients in retained peer coverage; other peers are earlier or less fully described in the pool", "Synchron leads the retained public evidence set on disclosed clinical readiness"]
      - ["Ecosystem integrations", "Apple BCI-HID, Apple Vision Pro, Amazon Alexa, NVIDIA-linked decoding stack", "Retained sources do not show equally concrete consumer-platform integrations for named rivals", "Synchron currently tells a more complete distribution and device-control story than its peers"]
      - ["Workforce / distribution fit", "Can map onto catheter labs and interventional radiology teams", "Direct cortical peers depend on more specialized neurosurgical workflow; substitutes depend on residual muscle/eye control", "Synchron is optimizing for deployability and patient access rather than maximum bandwidth"]
    notes: >-
      Cells summarize only what the retained pool supports; unknown rival
      packaging, bandwidth, or integration claims were left out rather than
      inferred from generic BCI narratives.
    claimRefs: [CP001, CP004, CP006, CP007, CP009, CP011]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Solution path
      - Price/unit/contract model
      - Included capabilities
      - Disclosed caveats / unknowns
      - Implication
    rows:
      - [Synchron Stentrode, "No public list price or contract terms in retained sources", "Implant, neural decoding, device-control workflows, Apple/Alexa integrations", "Investigational / commercialization-prep stage; reimbursement strategy described, not priced", "Current diligence depends on proving clinical utility and reimbursement, not on comparing sticker prices"]
      - ["Direct cortical peers (Neuralink / Paradromics / Blackrock / Precision)", "No public list price or contract terms in retained sources", "Higher-bandwidth implant narrative; exact package varies or is undisclosed", "Most retained peer evidence is clinical-positioning or ecosystem context, not commercialization detail", "Public buyers still compare procedure burden and readiness before negotiated economics"]
      - ["Status-quo assistive stack", "Not comparable from retained BCI pool", "Touch, voice, or eye-tracking-dependent control rather than implanted neural input", "Retained sources do not quantify current contract terms, utilization, or switching economics", "Separate assistive-tech diligence is still required to quantify true substitute pricing pressure"]
    notes: >-
      The retained pool does not contain public price sheets for Synchron or
      named implant rivals, so this table records the absence of disclosed terms
      and the commercial questions that absence leaves open.
    claimRefs: [CP009, CP010, CP011, CP013]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      The retained public evidence places Synchron furthest toward low-friction
      clinical deployment, while direct cortical peers preserve the stronger
      high-bandwidth ceiling.
    data:
      xAxis:
        label: Procedural workflow fit
        min: 1
        max: 5
        lowLabel: craniotomy or specialist burden
        highLabel: existing catheter or assistive workflow
      yAxis:
        label: Public clinical and commercial readiness
        min: 1
        max: 5
        lowLabel: earlier disclosed readiness
        highLabel: multi-patient proof plus commercialization prep
      points:
        - label: Synchron
          x: 4.8
          y: 4.7
          tone: positive
          note: "Endovascular delivery, 10 disclosed implants, COMMAND data, and Apple-facing integrations."
        - label: Neuralink
          x: 1.8
          y: 3.0
          tone: risk
          note: "Higher-bandwidth direct cortical narrative, but retained peer evidence still showed only two implanted patients."
        - label: Paradromics
          x: 1.3
          y: 2.1
          tone: neutral
          note: "65,000-channel promise in retained sources, but earlier clinical readiness and more invasive workflow."
        - label: Blackrock Neurotech
          x: 1.6
          y: 2.8
          tone: neutral
          note: "Longest retained implant history, but older invasive array form factor and lower channel counts than newer entrants."
        - label: Precision Neuroscience
          x: 2.1
          y: 2.5
          tone: neutral
          note: "Relevant FDA-ecosystem peer, but retained pool has limited public detail on commercial progress."
        - label: Status-quo assistive control
          x: 5.0
          y: 3.2
          tone: neutral
          note: "No implant burden, but does not solve the same independence problem once touch, voice, or eye-tracking degrade."
    approximationNotes: >-
      Axis values are ordinal synthesis scores derived from the retained
      evidence on workflow burden and disclosed readiness; they are not market
      shares, performance benchmarks, or inferred conversion rates.
    claimRefs: [CP001, CP005, CP006, CP007, CP008, CP012]
callouts:
  - calloutType: strength
    title: Synchron's current lead is procedural, not purely technical
    body: >-
      The strongest retained evidence advantage is that Synchron can point to
      endovascular implantation, disclosed multi-patient outcomes, and existing
      hospital workflow fit at the same time.
    claimRefs: [CP001, CP004, CP006]
  - calloutType: risk
    title: High-bandwidth rivals can still reset buyer expectations
    body: >-
      If the market shifts from safe digital control toward richer speech,
      dexterity, or higher-throughput applications, direct cortical systems may
      reclaim the narrative despite worse implantation burden today.
    claimRefs: [CP007, CP012, CP013]
