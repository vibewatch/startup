company:
  name: Synchron
chapter:
  number: 3
  title: Competitors
  summary: >-
    Synchron's competitive position currently rests less on raw neural bandwidth
    than on an endovascular delivery model that avoids craniotomy, uses existing
    catheter-lab workflow, and already has multi-patient clinical data plus
    Apple-facing integrations in public view. That lead is still conditional:
    direct cortical rivals keep the higher-resolution performance ceiling, while
    pivotal-trial endpoints, reimbursement, and public pricing remain unresolved.
sections:
  - id: landscape-and-solution-set
    title: Landscape and solution set
    body: >-
      The relevant competitive set is broader than "other BCI startups." The
      retained sources place Synchron against direct cortical implant developers
      such as Neuralink, Paradromics, Precision Neuroscience, and Blackrock
      Neurotech, while also implying a substitute path of voice, touch, and
      eye-tracking-dependent assistive control. Synchron's central claim is not
      that it has the highest-fidelity signal, but that it can restore digital
      control without open-brain surgery and therefore clear a much lower
      procedural adoption barrier. That matters because current buyers are still
      evaluating whether a BCI can be implanted safely, scaled through existing
      hospital workflow, and demonstrated in real patient use before they can
      evaluate fine-grained product economics.
    claimRefs: [CP001, CP003, CP004, CP008]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: buyer-tradeoffs-capabilities-and-packaging
    title: Buyer tradeoffs, capabilities, and packaging
    body: >-
      Public comparison today turns on workflow fit, signal richness, and
      ecosystem integrations rather than transparent pricing. Synchron's
      endovascular approach uses interventional radiology rather than
      craniotomy-based neurosurgery, which the retained independent analysis
      frames as a material scaling advantage. The counterweight is lower signal
      richness: retained sources repeatedly describe the Stentrode as a
      16-electrode, population-level interface versus direct cortical systems
      pursuing much higher channel counts and more sophisticated decoding tasks.
      Synchron partially offsets that gap by emphasizing device-control use
      cases, public Apple/Alexa demonstrations, and a hospital workflow that can
      spread through existing catheter infrastructure. Because none of the
      retained competitor sources discloses public list pricing, the practical
      public buying criteria remain procedure burden, proof of independence
      gains, and platform compatibility.
    claimRefs: [CP002, CP006, CP007, CP009, CP010, CP011]
    tableRefs: [TP002, TP003]
  - id: moat-durability-and-displacement-risk
    title: Moat durability and displacement risk
    body: >-
      Synchron's moat appears more durable in workflow fit, minimally invasive
      access, and consumer-platform partnerships than in absolute decoding
      performance. That is attractive if the first commercial market rewards
      safer implantation and everyday digital control for paralysis, because the
      company has already assembled evidence, partners, and investor support
      around that thesis. It is less durable if buyers or regulators start to
      privilege higher-bandwidth applications, because direct cortical peers
      still own the stronger technical narrative on signal density and advanced
      control. The biggest near-term risk is execution: retained sources say
      pivotal endpoints remain under FDA discussion and reimbursement logic is
      still being built, so Synchron's lead can narrow if the next trial, payer
      strategy, or rollout cadence disappoints while rivals mature.
    claimRefs: [CP005, CP012, CP013, CP014]
