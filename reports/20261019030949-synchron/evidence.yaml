      surgery. Instead, Synchron’s Stentrode is inserted through the jugular vein to the blood vessel that sits near the
      brain’s motor cortex, the part of the brain that controls voluntary movement.
    canonical: SO003
  - id: SP006
    publisher: Clinical Trials Arena
