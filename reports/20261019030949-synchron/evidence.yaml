evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership-and-governance-disclosure
    missingEvidence: >-
      A current board roster, role-specific executive biographies, and a sourced governance map beyond the named leaders
      visible in the assigned pool.
    whyItMatters: >-
      Governance depth and succession risk cannot be judged confidently when public evidence is concentrated around a
      few named executives.
    diligencePath: >-
      Request the current board list, executive bios, committee structure, and org chart from the company or lead
      investor materials.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-valuation
    missingEvidence: >-
      Exact post-money valuation, ownership stakes, liquidation preferences, anti-dilution terms, and any side letters
      tied to the Series D.
    whyItMatters: >-
      The company is clearly financed, but investor economics and dilution sensitivity cannot be assessed from round
      size alone.
    diligencePath: Obtain the Series D term sheet, updated cap table, and board consent package.
  - type: private-evidence-only
    severity: material
    topic: commercial-scale-metrics
    missingEvidence: Revenue, run-rate, headcount, customer or patient funnel metrics, reimbursement progress, and cash runway.
    whyItMatters: Without operating metrics, funding scale can be mistaken for commercial readiness.
    diligencePath: Request monthly KPI packs covering revenue, burn, hiring, trial pipeline, and payer engagement.
  - type: missing-source
    severity: material
    topic: pivotal-trial-protocol
    missingEvidence: >-
      A sourced public protocol covering the pivotal trial's endpoint definitions, enrollment plan, site count, and
      readout timeline.
    whyItMatters: >-
      COMMAND de-risks safety, but valuation and launch timing depend on the pivotal design that bridges feasibility to
      approval.
    diligencePath: >-
      Request the pivotal-trial synopsis, FDA correspondence on endpoints, and trial-registration updates when
      available.
  - type: missing-source
    severity: material
    topic: commercial-price-and-coverage
    missingEvidence: Public pricing, reimbursement coding strategy, and payer sequencing for first-generation Stentrode deployments.
    whyItMatters: >-
      Without price and coverage design, broad need proxies cannot be converted into a defendable SAM, SOM, or payback
      model.
    diligencePath: >-
      Request launch-account assumptions, target coding pathway, and payer-engagement materials from management or
      first-site hospitals.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: pivotal-trial-design
    missingEvidence: >-
      Public pivotal-trial protocol details, including endpoints, enrollment count, site count, follow-up duration, and
      success thresholds.
    whyItMatters: >-
      Those details determine how quickly feasibility data can translate into approval-grade evidence and broader
      provider adoption.
    diligencePath: >-
      Obtain the FDA-facing protocol, clinical-registry listing, or investor materials that specify the pivotal design
      and commercialization timeline.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: conflicting-data
    severity: minor
    topic: population-denominators
    missingEvidence: A single methodology-backed market model that uses one consistent definition of the target paralysis population.
    whyItMatters: >-
      Current public sources mix broad mobility need, severe-paralysis burden, and narrow indication lenses, which can
      overstate precision.
    diligencePath: >-
      Rebuild TAM, SAM, and SOM from diagnosis prevalence, eligibility filters, procedure capacity, and payer
      assumptions using one denominator set.
    relatedQuestionRefs:
      - QM002
  - type: private-evidence-only
    severity: material
    topic: commercialization-timing
    missingEvidence: >-
      Public pivotal-trial endpoint package, reimbursement milestones, and launch sequencing for the first commercial
      indication.
    whyItMatters: >-
      Without those details, public evidence can show lead indicators but cannot prove how durable Synchron's readiness
      advantage really is.
    diligencePath: >-
      Request the pivotal protocol summary, FDA correspondence on endpoint framing, and any payer or CMS workstream
      materials from management.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitor-detail
    missingEvidence: >-
      Official current product, pricing, and clinical-status pages for Paradromics, Precision Neuroscience, and
      Blackrock.
    whyItMatters: >-
      The retained pool names these competitors but does not fully support a cell-by-cell public comparison on
      packaging, roadmap, or deployment.
    diligencePath: >-
      Add current official competitor product and trial-status pages to a follow-on diligence pack and refresh the
      matrix against those direct sources.
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
