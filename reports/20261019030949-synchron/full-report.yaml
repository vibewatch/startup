  - id: FM001
    title: Constrained market-sizing stack for Synchron
    type: pyramid
    summary: >-
      Public evidence supports a narrowing stack from broad paralysis need proxies to the small clinically validated
      cohort behind Synchron's current commercialization case.
    data:
      items:
        - label: Global motor-impairment proxy
          displayValue: 15M people
          detail: >-
            Synchron's official technology page frames need around motor impairment, which is broader than the first
            reimbursable indication.
        - label: Global severe-paralysis proxy
          displayValue: '>30M people'
          detail: >-
            The University of Melbourne cites severe paralysis rather than motor impairment, so this is useful context
            but not a directly comparable denominator.
        - label: Initial U.S. ALS indication lens
          displayValue: 30k-40k candidates
          detail: Sacra's analyst lens approximates the first commercial use case, but the methodology is not published.
        - label: Stroke-expanded U.S. indication lens
          displayValue: 250k-300k candidates
          detail: Sacra argues stroke could widen the addressable pool materially if the indication expands beyond ALS.
        - label: Implanted patients to date
          displayValue: 10 patients
          detail: >-
            Business Wire says Stentrode BCIs have been placed in 10 patients across U.S. and Australian clinical
            trials.
        - label: COMMAND feasibility evidence
          displayValue: 6 patients / 3 sites
          detail: >-
            The current U.S. feasibility base is still a small cohort, which is why pivotal protocol design remains
            commercially decisive.
    approximationNotes: >-
      This stack mixes broad need proxies, analyst indication lenses, and validated trial cohorts. Layer order reflects
      commercialization narrowing rather than conversion or market share, and the 30k-40k / 250k-300k lenses are
      reproduced as published because the underlying methodology is not public.
    claimRefs:
