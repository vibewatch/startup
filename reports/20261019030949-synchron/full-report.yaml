      - number: '1.3'
        title: Funding base, clinical scale, and milestone cadence
        blocks:
          - type: paragraph
            body: >-
              The most decision-relevant scale signal in the current pool is financing depth rather than revenue.
              Synchron's November 2025 Series D added $200 million and brought cumulative funding to $345 million, with
              Double Point Ventures leading a syndicate that included ARCH, Khosla, Bezos Expeditions, NTI, METIS, and
              several new investors. Management said that capital would fund pivotal trials, commercial launch
              preparation, and larger AI and engineering operations in New York and San Diego. On the clinical side,
              independent reporting on COMMAND said six U.S. patients met the study's one-year primary safety endpoint
              and that the study operated across three clinical sites with NIH BRAIN Initiative support under an
              FDA-approved IDE. Those are material de-risking steps, but commercial timing still depends on
              pivotal-trial design, reimbursement strategy, and whether the lower-invasiveness architecture can offset
              the channel- count limitations highlighted in adverse trade coverage.
