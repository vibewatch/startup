              - CM012
      - number: '2.3'
        title: Providers and payers are the economic gatekeepers while patients are the end users
        blocks:
          - type: paragraph
            body: >-
              Synchron's buyer map is healthcare-first. The end users are patients with severe upper-limb paralysis and
              their caregivers, but the economic path runs through implanting centers, rehabilitation or
              neuro-interventional programs, and payers that decide whether improved independence justifies an implanted
              device and ongoing software support. Published commentary repeatedly points to clinical utility, not
              novelty, as the gating proof for commercialization, which means budget ownership is likely to emerge from
              hospital service lines and payer coverage decisions rather than from direct consumer demand. Platform
              integrations with Apple, Alexa, and smart-home workflows strengthen the value proposition because they
              anchor the benefit in daily device control rather than in an abstract neuroscience demo.
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM010
              - CM014
      - number: '2.4'
        title: Adoption hinges on clinical workflow fit, but reimbursement and protocol opacity still cap conviction
        blocks:
          - type: paragraph
            body: >-
              Synchron's strongest market driver is procedural fit: an endovascular implant that can ride existing
              catheter-lab and interventional-radiology workflows is easier to imagine scaling than a craniotomy-first
              pathway. That advantage is balanced by real constraints. The product makes an explicit trade-off on
              channel count and signal fidelity, the pivotal design details that would convert feasibility into approval
              evidence are not public, and no public commercial price or payer playbook exists. Independent commentary
              also treats the BCI category as a multi-player market rather than a winner-take-all land grab, so
              valuation depends less on claiming a giant undifferentiated TAM and more on proving one durable paralysis
              workflow, one payer path, and one repeatable provider deployment model.
            claimRefs:
              - CM003
              - CM006
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coverage, not curiosity, is the gating variable
            body: >-
              Public demand proxies are easy to find, but the real bottleneck is translating feasibility data into
              payer-accepted clinical utility with a disclosed price and a public pivotal protocol. Until those pieces
              are visible, market sizing remains directional rather than fully underwritten.
            calloutType: risk
            claimRefs:
              - CM006
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and solution set
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than "other BCI startups." The retained sources place Synchron
              against direct cortical implant developers such as Neuralink, Paradromics, Precision Neuroscience, and
              Blackrock Neurotech, while also implying a substitute path of voice, touch, and eye-tracking-dependent
              assistive control. Synchron's central claim is not that it has the highest-fidelity signal, but that it
              can restore digital control without open-brain surgery and therefore clear a much lower procedural
              adoption barrier. That matters because current buyers are still evaluating whether a BCI can be implanted
              safely, scaled through existing hospital workflow, and demonstrated in real patient use before they can
              evaluate fine-grained product economics.
