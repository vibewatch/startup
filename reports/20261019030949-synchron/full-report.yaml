  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      The retained public evidence places Synchron furthest toward low-friction clinical deployment, while direct
      cortical peers preserve the stronger high-bandwidth ceiling.
    data:
      xAxis:
        label: Procedural workflow fit
        min: 1
        max: 5
        lowLabel: craniotomy or specialist burden
        highLabel: existing catheter or assistive workflow
      yAxis:
        label: Public clinical and commercial readiness
        min: 1
        max: 5
        lowLabel: earlier disclosed readiness
        highLabel: multi-patient proof plus commercialization prep
      points:
        - label: Synchron
          x: 4.8
          'y': 4.7
          tone: positive
          note: Endovascular delivery, 10 disclosed implants, COMMAND data, and Apple-facing integrations.
        - label: Neuralink
          x: 1.8
          'y': 3
          tone: risk
          note: >-
            Higher-bandwidth direct cortical narrative, but retained peer evidence still showed only two implanted
            patients.
        - label: Paradromics
          x: 1.3
          'y': 2.1
          tone: neutral
          note: 65,000-channel promise in retained sources, but earlier clinical readiness and more invasive workflow.
        - label: Blackrock Neurotech
          x: 1.6
          'y': 2.8
          tone: neutral
          note: >-
            Longest retained implant history, but older invasive array form factor and lower channel counts than newer
            entrants.
        - label: Precision Neuroscience
          x: 2.1
          'y': 2.5
          tone: neutral
          note: Relevant FDA-ecosystem peer, but retained pool has limited public detail on commercial progress.
        - label: Status-quo assistive control
          x: 5
          'y': 3.2
          tone: neutral
          note: >-
            No implant burden, but does not solve the same independence problem once touch, voice, or eye-tracking
            degrade.
    approximationNotes: >-
      Axis values are ordinal synthesis scores derived from the retained evidence on workflow burden and disclosed
      readiness; they are not market shares, performance benchmarks, or inferred conversion rates.
    claimRefs:
      - CP001
      - CP005
      - CP006
      - CP007
      - CP008
      - CP012
