chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and current operating status
        blocks:
          - type: paragraph
            body: >-
              Synchron's core identity is unusually clear even in a constrained evidence set: the company is building
              the Stentrode, an endovascular brain-computer interface delivered through the jugular vein rather than by
              opening the skull. Its own homepage and technology page both position the product around restoring
              communication, independence, and agency for people living with paralysis, and they still describe the
              device as investigational and limited to clinical-trial use. The same financing materials that announced
              the 2025 Series D place the company in New York with an engineering and research hub in San Diego, which
              is enough to anchor headquarters and stage as a private Series D neurotechnology company. What the
              assigned pool does not support is a precise founding date, audited commercial revenue, current headcount,
              or a current board roster, so those fields should remain explicit diligence gaps rather than be backfilled
              from memory or older reports.
