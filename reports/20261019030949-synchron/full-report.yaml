  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The public product stack runs from motor-intent capture inside the vessel to consumer-device integrations, with
      clinical operations and future high-channel roadmap layered around the first-generation implant.
    data:
      layers:
        - label: Patient intent / motor cortex target
          detail: Neural intent signal source for the current assistive-computing workflow
          outputs:
            - Discrete movement-intent patterns
        - label: Stentrode vascular implant
          detail: 16-electrode endovascular scaffold positioned near motor cortex
          modules:
            - Self-expanding nitinol scaffold
            - Platinum-iridium electrode array
          outputs:
            - Population-level neural signals
        - label: Implanted relay hardware
          detail: Implanted lead and chest telemetry path
          modules:
            - Lead from vascular implant
            - Chest receiver / transmitter
          outputs:
            - Wireless signal handoff
        - label: External decoding layer
          detail: Converts signals into clicks, scrolling, and digital motor outputs
          modules:
            - Calibration / onboarding workflow
            - Decoder software
          outputs:
            - Cursor and command control
        - label: Device and platform integrations
          detail: Consumer-device control surfaces evidenced publicly in 2025
          modules:
            - Apple BCI-HID
            - Bluetooth bridge
            - Smart-home interfaces
          outputs:
            - iPhone / iPad / Vision Pro access
        - label: Clinical and roadmap wrapper
          detail: Investigational deployment plus next-generation interface program
          modules:
            - COMMAND / pivotal-trial pathway
            - AI decoding team
            - High-channel transcatheter roadmap
          outputs:
            - Commercialization prep
    approximationNotes: >-
      The public record confirms the major layers and integrations but not a full protocol, cybersecurity, or
      next-generation specification set.
    claimRefs:
      - CE001
      - CE003
      - CE007
      - CE008
      - CE011
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Synchron's current journey runs from severe-paralysis need and clinical referral into implantation, calibration,
      and then broader utility through Apple and smart-home integrations.
    data:
      items:
        - label: Need and referral identified
          actor: Patient / caregiver
          stage: Need discovery
          touchpoints:
