      - number: '1.2'
        title: Leadership, governance visibility, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Public leadership visibility is concentrated around Tom Oxley. Independent clinical coverage, syndicated
              financing materials, and trade reporting all identify him as CEO and founder, and he is the recurring
              executive voice on both safety milestones and financing strategy. That creates a visible founder-led
              operating model, but it also implies key-person dependence because the assigned evidence set does not
              expose a full current board or a broad executive bench with the same frequency. Kurt Haggstrom appears as
              chief commercial officer in independent trade reporting and in Synchron's own news archive, which is
              useful because it shows named commercialization coverage as the company moves from feasibility data toward
              pivotal trials and launch preparation. Synchron also announced executive expansion in 2025 with Andy
              Rasdal and Mark Brister, but the available pool still leaves governance depth only partially observable.
