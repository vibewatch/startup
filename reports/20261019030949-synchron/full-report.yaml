      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Synchron's moat appears more durable in workflow fit, minimally invasive access, and consumer-platform
              partnerships than in absolute decoding performance. That is attractive if the first commercial market
              rewards safer implantation and everyday digital control for paralysis, because the company has already
              assembled evidence, partners, and investor support around that thesis. It is less durable if buyers or
              regulators start to privilege higher-bandwidth applications, because direct cortical peers still own the
              stronger technical narrative on signal density and advanced control. The biggest near-term risk is
              execution: retained sources say pivotal endpoints remain under FDA discussion and reimbursement logic is
              still being built, so Synchron's lead can narrow if the next trial, payer strategy, or rollout cadence
              disappoints while rivals mature.
            claimRefs:
              - CP005
              - CP012
              - CP013
              - CP014
