  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and workflow
        blocks:
          - type: paragraph
            body: >-
              Synchron's delivered product is not a generalized "brain AI" platform; the current public evidence is much
              narrower and more concrete. The Stentrode is an endovascular implant positioned in a brain blood vessel
              near the motor cortex and paired with external control software so people with severe paralysis can
              perform discrete digital tasks such as clicking, scrolling, texting, and navigating connected devices. The
              official surface emphasizes the patient workflow benefit: catheter-style delivery instead of craniotomy,
              followed by home use of consumer hardware rather than a lab-only research rig. Independent long-form
              coverage reinforces that this design is aimed at "good enough" communication and device control, not
              fine-grained motor restoration. The right underwriting frame is therefore assistive-computing workflow fit
              and deployment burden, not raw electrode count alone.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE009
              - CE010
