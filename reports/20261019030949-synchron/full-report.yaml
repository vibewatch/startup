              commercially plausible because it aligns with hospital procedure economics and post-implant support, yet
              the assigned public source pool does not disclose list pricing, realized ASP, contract duration,
              reimbursement codes, or revenue recognition policy. For underwriting, the available evidence is therefore
              about the shape of monetization rather than proof of current revenue quality.
