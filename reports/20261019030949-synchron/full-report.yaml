  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary starts with assistive digital control, not a generic BCI TAM
        blocks:
          - type: paragraph
            body: >-
              Public evidence frames Synchron around a specific job to be done: restoring digital control and
              communication for people with severe paralysis. Included spend therefore sits around the implant, the
              catheter-based procedure, decoding software, onboarding, and the integrations that let patients use
              mainstream devices and smart-home tools. Excluded spend is just as important: consumer neurotech, elective
              enhancement, direct-to-speech ambitions that Synchron says are not the present target, and generic
              accessibility software that does not require an implanted interface. That boundary matters because the
              broadest paralysis or mobility statistics describe need, not a current reimbursable product market.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM010
              - CM011
      - number: '2.2'
        title: Public sizing exists as constrained lenses rather than a clean TAM-SAM-SOM stack
        blocks:
          - type: paragraph
            body: >-
              The available public numbers are useful only as bounding lenses. Company-adjacent sources cite 15 million
              people with motor impairment and over 30 million people with severe paralysis, but those are different
              populations and cannot be added or treated as a validated market denominator. The most explicit
              indication-specific lens comes from Sacra, which argues that Synchron's near-term ALS focus could
              represent roughly 30,000 to 40,000 U.S. candidates and that a stroke expansion could widen that pool to
              250,000 to 300,000, yet the methodology is unpublished. As a result, the chapter can defend directionality
              and boundary logic, but not a precise publisher-backed TAM/SAM/SOM bridge.
            claimRefs:
              - CM004
              - CM007
              - CM008
              - CM009
              - CM012
