        title: Exhibits
        blocks:
          - type: callout
            title: Synchron's current lead is procedural, not purely technical
            body: >-
              The strongest retained evidence advantage is that Synchron can point to endovascular implantation,
              disclosed multi-patient outcomes, and existing hospital workflow fit at the same time.
            calloutType: strength
            claimRefs:
