      - number: '5.2'
        title: Architecture, integration path, and deployment maturity
        blocks:
          - type: paragraph
            body: >-
              Public technical evidence is unusually specific for a private medtech company. The architecture described
              across the official page, trade coverage, and a 2025 review article is consistent: a self-expanding
              nitinol scaffold with 16 electrodes records motor-intent signals, a chest implant and lead relay those
              signals, and external software translates them into device commands. Trial reporting adds meaningful
              maturity markers: COMMAND enrolled six U.S. patients under an FDA-approved IDE, reported no device-related
              serious adverse events through 12 months, and achieved 100% target motor-cortex coverage with a median
              deployment time of 20 minutes. That does not prove commercial reliability, but it does move the product
              beyond concept-demo status into early, repeatable clinical deployment with named integrations and a
              specific operating stack.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE007
              - CE008
              - CE011
