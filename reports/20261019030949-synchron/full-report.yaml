        title: Revenue model and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              Synchron's public materials describe a device-plus-software workflow, but not a disclosed price book or
              recognized revenue line. The official technology page frames Stentrode as an investigational device
              delivered in a roughly two-hour procedure with next-day discharge, while third-party analysis describes a
