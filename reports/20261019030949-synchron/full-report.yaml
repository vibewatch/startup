      - number: '4.3'
        title: Capital needs and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial evidence is recent financing, not operating self-sufficiency. Synchron
              announced a $200 million Series D in November 2025 and said total funding had reached $345 million;
