      - number: '3.2'
        title: Buyer tradeoffs, capabilities, and packaging
        blocks:
          - type: paragraph
            body: >-
              Public comparison today turns on workflow fit, signal richness, and ecosystem integrations rather than
              transparent pricing. Synchron's endovascular approach uses interventional radiology rather than
              craniotomy-based neurosurgery, which the retained independent analysis frames as a material scaling
              advantage. The counterweight is lower signal richness: retained sources repeatedly describe the Stentrode
              as a 16-electrode, population-level interface versus direct cortical systems pursuing much higher channel
              counts and more sophisticated decoding tasks. Synchron partially offsets that gap by emphasizing
              device-control use cases, public Apple/Alexa demonstrations, and a hospital workflow that can spread
              through existing catheter infrastructure. Because none of the retained competitor sources discloses public
              list pricing, the practical public buying criteria remain procedure burden, proof of independence gains,
              and platform compatibility.
