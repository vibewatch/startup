          - type: paragraph
            body: >-
              Because Synchron remains in trial-to-launch transition, public traction proxies are clinical and
              operational rather than financial. Independent coverage from the same publisher is internally
              inconsistent: a June 9 article reported 100 implanted patients, while a June 29 article reported more than
