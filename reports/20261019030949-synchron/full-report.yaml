      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is directionally constructive on commercial design but still incomplete for
              investment underwriting. Synchron appears to have a potentially scalable delivery model because the
              implant uses standard catheter-lab-style workflow, avoids open-brain surgery, and is being paired with
              software and support services; however, public evidence still stops short of the core metrics needed to
              judge revenue quality and margin path. The central blockers are undisclosed pricing and reimbursement
              mechanics, absent revenue and gross-margin disclosure, and no burn or runway detail in the assigned
              evidence. Sacra's reimbursement warning is especially material: if payer coverage lags clinical success,
              the company could remain well funded yet commercially constrained. The next diligence step is
              management-grade disclosure on implant ASP, gross-to-net, payer pathway, support cost per patient, and
              post-Series E cash runway.
