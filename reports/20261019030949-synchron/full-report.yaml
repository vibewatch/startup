              Importantly, the disclosed uses of proceeds are not generic balance-sheet padding: they are tied to
              pivotal-trial acceleration, manufacturing scale-up in Brooklyn, and clinical support infrastructure needed
              for a PMA path. That use-of-funds profile implies capital adequacy has improved, but it also shows
              commercialization still depends on continued execution through expensive regulatory, manufacturing, and
              field-support milestones rather than on already-disclosed recurring revenue.
