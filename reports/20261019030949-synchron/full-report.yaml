  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Milestone progress supports continued attention, but current public evidence does not justify price-insensitive
      underwriting.
    data:
      nodes:
        - id: proof
          label: Clinical safety proof
          note: >-
            Six COMMAND patients met the 12-month primary safety endpoint; 10 total implants have been disclosed across
            trials
        - id: product
          label: Minimally invasive wedge
          note: Jugular-vein delivery, about a two-hour procedure, and next-day discharge are the core differentiation
        - id: capital
          label: Fresh capital
          note: $200M Series D and $345M total funding support continued pivotal and commercialization work
        - id: price
          label: Rich stage pricing
          note: >-
            Public round-mark references point to nearly $1B valuation while revenue and exact preferences remain
            undisclosed
        - id: downside
          label: Core downside checks
          note: >-
            Reimbursement, Class III approval timing, and lower-bandwidth performance versus direct cortical rivals
            remain open
        - id: decision
          label: Recommendation
          note: Track / medium confidence / high risk / fair valuation stance
      edges:
        - from: proof
          to: product
          label: Validates
        - from: product
          to: capital
          label: Supports
        - from: capital
          to: price
          label: Resets expectations
        - from: price
          to: downside
          label: Makes diligence more price-sensitive
        - from: downside
          to: decision
          label: Leads to
    approximationNotes: >-
      This is a qualitative decision chain rather than a weighted scoring model because the assigned public evidence
      does not disclose enough economics for formulaic underwriting.
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV008
      - CV010
      - CV011
      - CV013
