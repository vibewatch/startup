              - CE008
              - CE011
              - CE012
      - number: '5.3'
        title: Differentiation, tradeoffs, and roadmap
        blocks:
          - type: paragraph
            body: >-
              Synchron's differentiation is not that it wins the bandwidth race today; it is that it reframes the
              product around a lower-risk implantation path that can fit existing interventional infrastructure.
              Multiple independent sources make the tradeoff explicit: population-level recording and a small channel
              count constrain command richness, but that same architecture reduces the surgical burden that limits
              adoption of craniotomy-based BCI systems. The 2025 funding round also broadened the product story from the
              first-generation Stentrode to concrete platform extensions, including Apple's BCI-HID workflow, a
              Bluetooth control path into consumer devices, and a next-generation transcatheter high-channel interface
              supported by expanded AI and engineering teams. The roadmap is directionally promising, but the public
              evidence still lacks technical specifications, validation thresholds, and launch timing for the
              higher-channel system.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, safety, compliance, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              On safety and compliance, the public record is strongest on clinical procedure and weakest on software and
              data controls. Synchron's own page explicitly labels the device investigational, and the COMMAND readout
              adds a useful independent signal that the early-feasibility implant was run under an FDA-approved IDE with
              no device-related serious adverse events through one year. That is material evidence for surgical safety
              and regulatory discipline, but it is not a substitute for security diligence. None of the retained public
              sources disclose telemetry encryption, authentication, model-training governance, data retention, breach
              history, or a public developer/support surface for the Apple, Bluetooth, and smart home integrations. For
              a permanently implanted BCI that depends on external software layers, those omissions matter as much as
              the implant itself.
            claimRefs:
              - CE004
              - CE007
              - CE011
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deployment-first product strategy
            body: >-
              Synchron's strongest product signal is not "best decoding"; it is a clinically plausible deployment model
              that fits catheter-based workflow, consumer-device control, and home use sooner than craniotomy-heavy
              rivals.
            calloutType: insight
            claimRefs:
              - CE002
              - CE007
              - CE009
              - CE011
          - type: callout
            title: Software-governance diligence remains open
            body: >-
              Public evidence is good enough to underwrite the implant concept and early clinical workflow, but not the
              security, privacy, and support burden of the external software stack that makes the implant useful.
            calloutType: risk
            claimRefs:
              - CE007
