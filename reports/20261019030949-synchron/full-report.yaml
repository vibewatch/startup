companyProfile:
  summary: >-
    Synchron is an endovascular brain-computer interface company developing the Stentrode, a minimally invasive device
    implanted through the jugular vein rather than open-brain surgery. The current public record supports real clinical
    traction, a growing installed base, and a strong capital runway, but it still leaves the commercial model, exact
    valuation mechanics, reimbursement path, and operating scale largely opaque.
