  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-disclosure
      missingEvidence: Monthly or quarterly recognized revenue, any ARR metric, and a gross-margin bridge by implant, software, and services.
      whyItMatters: Revenue quality and margin path cannot be underwritten from public financing headlines alone.
      diligencePath: Request management financials with revenue composition, recognition policy, and gross-margin detail by product and service line.
      relatedQuestionRefs:
        - QI001
        - QI003
        - QI008
      relatedTableRefs:
        - TI001
        - TI003
    - type: private-evidence-only
      severity: material
      topic: pricing-and-reimbursement
      missingEvidence: Implant ASP, software/support fee structure, reimbursement code path, payer timelines, and expected collection mechanics.
      whyItMatters: Realized pricing and coverage determine cash conversion, adoption velocity, and margin sustainability.
      diligencePath: Request payer strategy deck, reimbursement counsel memo, draft coding path, and any hospital economic models used in launch planning.
      relatedQuestionRefs:
        - QI005
        - QI007
      relatedTableRefs:
        - TI001
        - TI002
    - type: private-evidence-only
      severity: material
      topic: burn-and-runway
      missingEvidence: Current unrestricted cash balance, monthly burn, capitalized manufacturing spend, and downside runway assumptions after the latest financing.
      whyItMatters: Large rounds improve odds of completion, but they do not prove adequate runway through pivotal readout and launch preparation.
      diligencePath: Request board-approved operating plan, cash runway model, and covenant/debt schedule.
      relatedQuestionRefs:
        - QI002
        - QI008
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: material
      topic: sales-efficiency
      missingEvidence: Site activation cost, commercial headcount plan, CAC, payback, channel economics, and field-support staffing assumptions.
      whyItMatters: A minimally invasive procedure can still be commercially inefficient if sales, support, and payer-education costs scale too quickly.
      diligencePath: Request launch model with site count ramp, sales productivity assumptions, and per-patient support burden.
      relatedQuestionRefs:
        - QI004
        - QI008
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: material
      topic: working-capital-and-obligations
      missingEvidence: Inventory policy, supplier payment terms, manufacturing capex schedule, and any equipment financing or debt obligations.
      whyItMatters: Device launches can absorb cash through inventory, tooling, and field support well before revenue scales.
      diligencePath: Request manufacturing plan, supplier agreements summary, and debt or lease schedule tied to the Brooklyn facility expansion.
      relatedQuestionRefs:
        - QI002
        - QI004
        - QI008
      relatedTableRefs:
        - TI003
