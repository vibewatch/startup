company:
  name: Synchron
chapter:
  number: 4
  title: Financials
  summary: Synchron's public financial story is still a commercialization and financing story rather than a disclosed revenue story. Public sources support a minimally invasive implant plus software/service monetization thesis and show substantial fresh capital earmarked for pivotal trials, manufacturing, and launch infrastructure, but they do not disclose realized pricing, revenue, gross margin, or runway.
sections:
  - id: revenue-model-and-monetization-visibility
    title: Revenue model and monetization visibility
    body: >-
      Synchron's public materials describe a device-plus-software workflow, but
      not a disclosed price book or recognized revenue line. The official
      technology page frames Stentrode as an investigational device delivered in
      a roughly two-hour procedure with next-day discharge, while third-party
      analysis describes a model that could combine implant revenue with
      recurring software and data services. That architecture is commercially
      plausible because it aligns with hospital procedure economics and
      post-implant support, yet the assigned public source pool does not
      disclose list pricing, realized ASP, contract duration, reimbursement
      codes, or revenue recognition policy. For underwriting, the available
      evidence is therefore about the shape of monetization rather than proof of
      current revenue quality.
    claimRefs:
      - CI001
      - CI004
      - CI012
      - CI013
      - CI015
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: traction-proxies-and-unit-economics
    title: Traction proxies and unit economics
    body: >-
      Because Synchron remains in trial-to-launch transition, public traction
      proxies are clinical and operational rather than financial. Independent
      coverage from the same publisher is internally inconsistent: a June 9
      article reported 100 implanted patients, while a June 29 article reported
      more than 30. Earlier 2024 coverage described six COMMAND feasibility
      patients meeting the primary safety endpoint. Public sources provide
      operating proxies including a 16-electrode first-generation device, an
      approximately two-hour clinical-trial procedure, and compatibility with
      established stent fabrication workflows. Those facts suggest a care
      pathway that may be lighter than craniotomy-based alternatives, but they
      do not reveal COGS, implant labor cost, service burden, site activation
      cost, or payback. The unit-economics table is therefore a diligence map,
      and the current implant count requires direct company verification.
    claimRefs:
      - CI005
      - CI006
      - CI009
      - CI010
      - CI011
      - CI012
      - CI015
    tableRefs:
      - TI003
  - id: capital-needs-and-financing-dependency
    title: Capital needs and financing dependency
    body: >-
      The strongest public financial evidence is recent financing, not
      operating self-sufficiency. Synchron announced a $200 million Series D in
      November 2025 and said total funding had reached $345 million;
      independent June 2026 coverage then reported a $275 million Series E and
      total funding above $575 million. Importantly, the disclosed uses of
      proceeds are not generic balance-sheet padding: they are tied to
      pivotal-trial acceleration, manufacturing scale-up in Brooklyn, and
      clinical support infrastructure needed for a PMA path. That use-of-funds
      profile implies capital adequacy has improved, but it also shows
      commercialization still depends on continued execution through expensive
      regulatory, manufacturing, and field-support milestones rather than on
      already-disclosed recurring revenue.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI007
      - CI008
      - CI016
  - id: financial-verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >-
      The financial verdict is directionally constructive on commercial design
      but still incomplete for investment underwriting. Synchron appears to
      have a potentially scalable delivery model because the implant uses
      standard catheter-lab-style workflow, avoids open-brain surgery, and is
      being paired with software and support services; however, public evidence
      still stops short of the core metrics needed to judge revenue quality and
      margin path. The central blockers are undisclosed pricing and
      reimbursement mechanics, absent revenue and gross-margin disclosure, and
      no burn or runway detail in the assigned evidence. Sacra's reimbursement
      warning is especially material: if payer coverage lags clinical success,
      the company could remain well funded yet commercially constrained. The
      next diligence step is management-grade disclosure on implant ASP,
      gross-to-net, payer pathway, support cost per patient, and post-Series E
      cash runway.
    claimRefs:
      - CI013
      - CI014
      - CI015
      - CI016
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Public mechanism
      - Current public status
      - Revenue quality read
      - Diligence ask
    rows:
      - - Implant hardware and procedure
        - Device implanted through a catheter-based hospital procedure, then used for hands-free digital control.
        - Investigational; the assigned sources disclose no commercial ASP or contract terms.
        - Core revenue line is plausible, but current realized pricing and recognition remain unverified.
        - Implant ASP, gross-to-net waterfall, capital vs disposable mix, and recognition policy.
      - - External telemetry and software
        - Implant transmits to external hardware/software; third-party analysis describes a recurring software/data loop.
        - Mechanism is described publicly, but no software fee, seat, subscription, or bundle terms are public.
        - Could improve durability beyond one-time device revenue if reimbursement exists.
        - Software pricing, renewal structure, hosting cost, and data-rights terms.
      - - Clinical support infrastructure
        - Company says fresh capital will build the clinical support infrastructure needed for commercial launch.
        - Support capability is being built before approval; no public billing model disclosed.
        - May begin as a cost center before any separately billed service revenue is visible.
        - Per-patient onboarding/support cost and whether hospitals or payers reimburse it.
      - - Reimbursement-driven payment flows
        - Sacra says the reimbursement strategy is tied to functional independence gains and long-term care savings.
        - Strategy is public, but code pathway, payer timing, and patient out-of-pocket exposure are not.
        - Cash conversion risk is dominated by reimbursement rather than list-price disclosure alone.
        - Target codes, payer mix, coverage timeline, and denial assumptions.
    notes: Public sources describe monetization mechanisms and launch build-out; undisclosed pricing fields reflect absence in the assigned source pool, not zero value.
    claimRefs:
      - CI001
      - CI008
      - CI012
      - CI013
      - CI014
      - CI015
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Public price / contract evidence
      - What is disclosed
      - What remains undisclosed
      - Source signal
    rows:
      - - Stentrode implant system
        - null
        - Investigational implant with approximately two-hour clinical-trial procedure and next-day discharge profile.
        - List price, realized hospital ASP, implant consumables, warranty, and gross margin.
        - Official workflow page plus analyst description of procedure burden.
      - - Software / decoding layer
        - null
        - Public evidence supports Bluetooth-enabled device control and a recurring software/data feedback thesis.
        - Subscription fee, bundle structure, usage-based pricing, and renewal economics.
        - Analyst-market-data interpretation rather than a published price sheet.
      - - Reimbursement / payer contract
        - null
        - Public discussion centers on independence gains and long-term care economics.
        - CPT/DRG pathway, payer contracts, timing of coverage, and realized collections.
        - Reimbursement remains strategic narrative rather than disclosed economics.
    notes: Null values mean the assigned public source pool did not disclose a price or contract term; they should not be read as zero.
    claimRefs:
      - CI001
      - CI012
      - CI013
      - CI014
      - CI015
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Latest disclosed financing
        - $275M Series E reported in June 2026 after a $200M Series D in November 2025.
        - Medium
        - Financing is the clearest public runway proxy while revenue disclosure is absent.
        - Cash received, unrestricted cash balance, debt, and pro forma runway after Series E.
      - - Clinical traction proxy
        - Conflicting June 2026 reports from one publisher cite 100 implants and more than 30 implants.
        - Low
        - An unresolved denominator cannot support manufacturing or support-load forecasts.
        - Verified implanted-patient count, active-patient count, monthly implants, site productivity, and attrition.
      - - Procedure burden
        - Approximately two-hour clinical-trial procedure, with most people going home the next day.
        - Medium
        - Procedure intensity influences provider adoption, field-support staffing, and hospital contribution margin.
        - Implant-lab time, physician economics, onboarding labor, and adverse-event reserve assumptions.
      - - First-generation hardware complexity
        - 16-electrode endovascular device using a stent scaffold and subcutaneous telemetry.
        - Medium
        - Hardware and follow-up regimen shape BOM, clinical services cost, and reimbursement positioning.
        - Implant BOM, telemetry replacement cycle, explant cost, and follow-up visit burden.
      - - Revenue / ARR / gross margin
        - null
        - Low
        - Core underwriting cannot judge revenue quality or margin path without this disclosure.
        - Recognized revenue, ARR if any, gross margin bridge, and deferred-revenue policy.
      - - Sales efficiency / CAC payback
        - null
        - Low
        - Site activation and payer education could dominate go-to-market cost in a novel device category.
        - Sales cycle, commercial headcount productivity, CAC, payback, and channel mix.
      - - Cash burn / runway
        - null
        - Low
        - Capital dependence remains the main residual risk even after large private rounds.
        - Monthly burn, cash runway by base/downside case, and next-round trigger.
    notes: Public metrics mix reported financing and operating proxies; null rows mark metrics not disclosed in the assigned public evidence set.
    claimRefs:
      - CI002
      - CI005
      - CI006
      - CI007
      - CI009
      - CI011
      - CI012
      - CI015
      - CI016
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence supports the operational path from patient implantation to a potential reimbursed device-plus-software revenue model, but the payment step remains commercially unpriced in disclosed sources.
    data:
      nodes:
        - label: Candidate identification
          detail: Public sources focus on severe motor-impairment patients in clinical programs rather than disclosed commercial accounts.
          claimRefs:
            - CI005
            - CI009
        - label: Endovascular implant
          detail: Official and analyst sources describe an approximately two-hour, catheter-based implant with next-day discharge.
          claimRefs:
            - CI001
            - CI012
        - label: Neural control workflow
          detail: The system converts motor intent into digital control through the implant, telemetry, and software stack.
          claimRefs:
            - CI001
            - CI012
        - label: Clinical validation and scale-up
          detail: COMMAND results are public, but conflicting June 2026 implant counts require direct verification before capacity planning.
          claimRefs:
            - CI005
            - CI006
            - CI009
            - CI010
        - label: Manufacturing and support build-out
          detail: Fresh financing is earmarked for trial expansion, Brooklyn manufacturing, and clinical support infrastructure.
          claimRefs:
            - CI004
            - CI008
            - CI016
        - label: Reimbursement and realized revenue
          detail: Public sources describe a reimbursement strategy and recurring software thesis, but no price sheet, code path, or realized revenue disclosure.
          claimRefs:
            - CI013
            - CI014
            - CI015
    approximationNotes: This flow maps disclosed operational steps and monetization dependencies; it does not infer conversion rates, unit margins, or realized revenue.
    claimRefs:
      - CI001
      - CI005
      - CI008
      - CI013
      - CI014
      - CI015
callouts:
  - calloutType: insight
    title: Commercial design is visible before commercial economics are visible
    body: Public evidence is strong enough to outline how Synchron could monetize an implant-plus-software workflow, but not strong enough to underwrite what each implanted patient is worth.
    claimRefs:
      - CI001
      - CI012
      - CI013
      - CI015
  - calloutType: risk
    title: Reimbursement remains the key financial swing factor
    body: Even with large recent financings, Synchron's commercial path can remain cash consumptive if payer coverage lags clinical progress or if support costs scale faster than reimbursement.
    claimRefs:
      - CI008
      - CI014
      - CI016
