      - number: '1.4'
        title: Operational Milestones, Technical Track Record, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Quantinuum's operational trajectory is distinguished by consistent validation of its trapped-ion quantum
              computing hardware, paired with material strategic concentration risks. The company achieved consecutive
              industry benchmarks on its H-Series machines, scaling from the 12-qubit System Model H1 in 2020 to the
              System Model H2 in May 2023, which demonstrated non-Abelian anyon braiding and achieved a record quantum
              volume of 33,554,432 (2^25) by September 2025. In joint research with Microsoft, Quantinuum generated four
              reliable logical qubits performing 14,000 error-free experiments, while its commercial Helios platform
              attained an average two-qubit gate fidelity of 99.921%. However, independent diligence underscores
              critical structural vulnerabilities: public investors obtain only 10.2% new voting exposure, while
              Honeywell exercises operational leverage across key ion-trap supply agreements, board governance, and tax
              receivable agreement (TRA) payment obligations. Furthermore, revenue remains concentrated among sovereign
              research agencies, flagship pilot partners, and government grants, leaving broader recurring enterprise
              software adoption unproven relative to the company's multi-billion dollar capital intensity and ongoing
              structural operating losses.
            claimRefs:
              - CO004
              - CO006
              - CO007
              - CO010
              - CO011
              - CO012
              - CO015
