      - number: '7.2'
        title: Governance, Controlled-Company Status, and Honeywell Counterparty Exposure
        blocks:
          - type: paragraph
            body: >-
              Despite becoming a publicly traded entity, Quantinuum remains structurally controlled by Honeywell
              International Inc., which holds approximately 48.1% of combined voting power across Class A and Class B
              shareholdings. Under the governing Stockholder Agreement, Honeywell retains designated director
              appointment privileges and committee veto rights, preventing public Class A shareholders from exerting
              meaningful influence over corporate strategy, capital allocation, or executive leadership. Beyond
              governance control, Quantinuum operates under critical counterparty dependence on Honeywell Aerospace
              (AERO) for the precision micro-fabrication and packaging of its custom ion-trap hardware. The governing
              2026 AERO Strategic Supply and Services Agreement operates under a government-bid-rate-plus-15% cost
              structure with no minimum purchase volume commitments, exposing Quantinuum to margin volatility and
              manufacturing bottlenecks. In addition, AERO retains ownership of critical unit-process and manufacturing
              intellectual property, while Quantinuum incurred $9.4 million of supply prepayments in the first quarter
