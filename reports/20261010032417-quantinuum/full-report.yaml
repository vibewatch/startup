              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: Scenario Modeling and Comparative Valuation
        blocks:
          - type: paragraph
            body: >-
              Evaluating Quantinuum requires contrasting its valuation against peer-group benchmarks and constructing
              rigorous multi-scenario projections. Trapped-ion competitor IonQ currently trades at approximately 48
              times forward 2026 consensus revenue of $268 million, whereas Quantinuum trades at roughly 512 times
              consensus 2026 revenue of $26.5 million. While Quantinuum deserves a premium for superior logical qubit
              fidelity, all-to-all connectivity, and full-stack software integration, a tenfold multiple premium over
              IonQ leaves negligible margin of safety. In our base-case scenario, assuming 67% year-over-year revenue
              growth in 2027 to $44.3 million and a multiple compressing to 100x sales, Quantinuum's market
              capitalization would adjust to approximately $4.44 billion, or $17 per share—representing a 67% decline
              from mid-2026 trading levels. Under a conservative bear case where revenue reaches $37.9 million and
              multiples normalize to IonQ's 48x level, the equity would decline to $1.82 billion or $7 per share. Even
              under an aggressive bull case assuming $46.3 million in 2027 revenue and an elevated 140x multiple, the
              implied market capitalization of $6.48 billion ($25 per share) remains well below the initial public
              offering price, highlighting severe downside skew under present market conditions.
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV010
              - CV011
      - number: '8.4'
        title: Exit Readiness, Downside Catalysts, and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              Quantinuum's completed public listing shifts the primary investment focus from liquidity readiness to
              operating execution and quarterly milestone delivery. Near-term downside catalysts include the expiration
              of standard 180-day lock-up agreements, potential Honeywell block distributions following the planned
              separation of its aerospace business, and quarterly earnings volatility driven by uneven hardware delivery
              schedules. Furthermore, unverified dark web claims by the Incransom ransomware group alleging an
              undisclosed pre-IPO data exfiltration highlight operational cybersecurity and disclosure governance risks
              that require ongoing monitoring. For institutional investors evaluating entry points, thesis-break
              triggers include any schedule slippage on the 2027 Sol system roadmap, stagnation of remaining performance
              obligations below $75 million, or competitor demonstrations of superior logical qubit error correction at
              lower infrastructure cost. Prospective investors should maintain a disciplined diligence path focused on
              obtaining private cohort disclosures, tracking enterprise renewal rates on the Oracle Cloud Infrastructure
              deployment, and awaiting substantial multiple compression before deploying long-term risk capital.
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV009
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Disconnect vs. Operational Scale
            body: >-
              Quantinuum's market capitalization of over $13.5 billion commands a ~500x multiple on trailing sales and
              roughly 512x consensus 2026 revenues. While Helios demonstrates industry-leading trapped-ion fidelity,
              public markets have historically punished deep-tech companies when early multi-hundred-multiple valuations
              encounter sequential revenue lumpiness or delayed commercial inflection.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV010
          - type: callout
            title: Prerequisite Milestones for an Upgrade to Buy
            body: >-
              An upgrade from track to buy requires two demonstrable triggers: first, evidence that enterprise cloud
              distribution via Oracle and Azure converts into predictable recurring ARR with net revenue retention
              exceeding 120%; second, meaningful valuation multiple compression toward 50x–80x forward sales, either
              through stock price de-escalation or rapid revenue acceleration above $100 million annually.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV011
