      - number: '4.2'
        title: Initial Public Offering, Capital Structure, and Contract Dynamics
        blocks:
          - type: paragraph
            body: >-
              On June 5, 2026, Quantinuum completed the largest initial public offering in the history of the quantum
              computing sector, listing its Class A common stock on the Nasdaq Global Market under the ticker symbol
              QNT. The company issued 28,000,000 shares of Class A common stock at an initial public offering price of
              $60.00 per share, generating $1.68 billion in gross proceeds ($1.60 billion in net proceeds prior to
              estimated offering expenses). The transaction was executed via an Up-C organizational structure in which
              Quantinuum Inc. serves as the sole managing member of Quantinuum Holdings LLC, holding approximately 12.6%
              of the economic interest and voting rights, while pre-IPO Continuing Common Unitholders retain the
              remaining 87.4% economic interest. This governance framework preserves majority operational control under
              Honeywell International, which had previously anchored Quantinuum's pre-IPO funding, including an
              approximately $600 million Series B equity round announced in September 2025 at a $10 billion pre-money
              equity valuation alongside strategic investors such as JPMorgan Chase, Mitsui & Co., Amgen, and NVIDIA's
              NVentures arm. Management established formal full-year 2026 revenue guidance of $28.0 million to $32.0
              million, reflecting increasing visibility supported by year-to-date bookings of approximately $81 million
              and an advanced pipeline expected to reach at least $120 million by year-end.
            claimRefs:
              - CI003
              - CI004
              - CI009
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI009
      - number: '4.3'
        title: Cost Structure, R&D Velocity, and Cash Burn Trajectory
        blocks:
          - type: paragraph
            body: >-
              Quantinuum's historical financial results reflect the substantial operating expenditures required to
              develop and scale four concurrent generations of trapped-ion quantum computing hardware (Helios, Sol,
              Apollo, and Lumos). In fiscal year 2025, annual net revenue reached $30.93 million, representing 34.6%
              top-line growth over $22.98 million in FY2024. Simultaneously, cost of revenue declined from $10.81
              million in FY2024 to $4.73 million in FY2025, expanding GAAP gross margin from 52.97% to 84.71%. This
              gross margin expansion highlights software-like marginal delivery economics once hardware infrastructure
              is deployed. However, operating expenses substantially outstripped gross profit: research and development
              expenses expanded from $122.24 million in FY2024 to $165.42 million in FY2025, alongside $18.86 million in
