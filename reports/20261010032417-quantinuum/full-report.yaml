              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: Executive Leadership, Governance, and Parent-Company Ties
        blocks:
          - type: paragraph
            body: >-
              Quantinuum's corporate governance structure reflects an intentional transition from academic founding
              research to industrial-scale commercialization, shaped by continuous parent-company governance from
              Honeywell International Inc. Executive management is led by President and Chief Executive Officer Dr.
              Rajeeb Hazra, an enterprise computing veteran who previously directed technical computing, supercomputing
              architecture, and enterprise cloud initiatives across 25 years at Intel Corporation before serving as
              Senior Vice President at Micron Technology. Financial and commercial functions were significantly
              reinforced ahead of public listing with the appointments of Chief Financial Officer Nitesh Sharan,
              formerly CFO of SoundHound AI and a senior finance leader at Nike and Hewlett-Packard, and Chief
              Commercial Officer Lawrence Stack, who previously directed enterprise sales transformations at Procore
              Technologies and Red Hat. Cambridge Quantum founder Ilyas Khan serves as Chief Product Officer and Vice
              Chair of the Board, stewarding algorithmic development and cryptographic IP. Corporate control remains
              concentrated with Honeywell, which held an initial 54% majority ownership at merger inception and retains
              approximately 48.1% combined voting power post-offering along with statutory rights to nominate up to two
              members to Quantinuum's classified ten-member board of directors.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO005
      - number: '1.3'
        title: Financing History, Valuation Trajectory, and IPO Terms
        blocks:
          - type: paragraph
            body: >-
              Prior to initiating its public offering on Nasdaq, Quantinuum funded intensive hardware development
              through substantial internal sponsor contributions and staged private equity financings. At its November
              2021 inception, Honeywell capitalized the combined entity with nearly $300 million in direct funding
              alongside contributed quantum hardware assets. In January 2024, the company closed a $300 million Series A
              equity financing round at a $5.0 billion pre-money valuation, anchored by JPMorgan Chase with
              participation from Mitsui & Co., Amgen, and Honeywell. During 2025, Quantinuum initiated an equity
              financing round anchored by Honeywell at a $10.0 billion pre-money valuation, which ultimately expanded to
              approximately $800 million total with participation from Quanta Computer, NVIDIA venture arm NVentures,
              QED Investors, and Fidelity International. In June 2026, Quantinuum filed Form S-1/A setting terms to
              offer 26.5 million Class A common shares at a price range of $53 to $55 per share ($54 midpoint),
              generating roughly $1.355 billion in net proceeds contributed to Quantinuum Holdings. At the $54 midpoint
              price across 259.286 million total Common Units, Quantinuum's implied fully exchanged equity valuation
              reaches approximately $14.0 billion, establishing an aggressive scarcity multiple of roughly 453x trailing
              fiscal 2025 revenue ($30.93M).
            claimRefs:
              - CO001
              - CO004
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
