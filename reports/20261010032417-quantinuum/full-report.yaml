  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Valuation, Overhang, and Capitalization Structure Risks
        blocks:
          - type: paragraph
            body: >-
              Quantinuum's transition to the public market establishes a stark disparity between current financial
              performance and capital market valuation. At the $54 midpoint of its June 1 S-1/A filing range, the
              company's fully exchanged equity value reached approximately $14.0 billion against trailing 2025 revenue
              of only $30.931 million, implying an aggressive valuation multiple of roughly 453x trailing sales. This
              leaves public equity holders vulnerable to severe multiple compression if commercial revenue adoption lags
              expectations. In addition, the Up-C corporate capitalization introduces substantial post-offering overhang
              and cash drag: 227.923 million exchangeable Common Units and Class B shares remain held by pre-IPO
              unitholders, alongside 40.697 million reserved shares in the 2026 equity incentive plan and unquantified
              shares issuable under the CHIPS Act Letter of Intent. Furthermore, the Tax Receivable Agreement creates a
              significant long-term cash commitment, obligating the company to distribute 85% of realized cash tax
              benefits—estimated at $2.997 billion under a full-exchange model—to pre-IPO owners, siphoning cash away
              from internal research reinvestment. Trading data on NASDAQ also highlights elevated short-term volatility
              and negative trailing earnings per share.
