chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Hybrid Business Model
        blocks:
          - type: paragraph
            body: >-
              Quantinuum was formed in late November 2021 through the cross-border business combination of Honeywell
              Quantum Solutions, the hardware division of Honeywell International Inc., and Cambridge Quantum Computing,
              a pioneering UK-based quantum software and cryptography company. Operating through dual executive
              headquarters in Broomfield, Colorado and Cambridge, United Kingdom, the organization employs a full-stack
              commercial model spanning trapped-ion quantum charge-coupled device (QCCD) hardware, low-level compilers,
              and domain-specific enterprise software applications. Revenue streams are generated through a hybrid
              commercial framework comprising cloud-based quantum compute access on System Model H1 and H2 hardware,
              on-premises system deployments, professional research agreements, and recurring software licensing for
              specialized tools such as Quantum Origin and the TKET compiler toolkit. For the second quarter of 2026,
              Quantinuum reported revenue of $8.0 million, up 279% year-over-year from cloud, research, and technical
              support engagements, building upon $30.93 million in full-year 2025 revenue. Total corporate headcount has
              expanded from nearly 400 staff members at corporate inception to approximately 700 personnel by mid-2026,
              with technical research and engineering teams comprising the vast majority of the global operating
              workforce.
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO012
              - CO013
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO008
