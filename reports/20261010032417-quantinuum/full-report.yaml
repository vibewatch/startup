            body: >-
              As a developer of dual-use trapped-ion quantum computing hardware and cryptographic technologies,
              Quantinuum faces stringent regulatory, national security, and cross-border trade constraints across the
              United States and the United Kingdom. Proposed non-dilutive government support under the CHIPS Incentives
