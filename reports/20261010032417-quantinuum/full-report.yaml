          Trapped-ion QCCD architecture achieves 99.921% gate fidelity and 48 logical qubits on Helios, leading the
          industry in error correction toward fault-tolerant 2027 Sol and 2029 Apollo systems.
        - >-
          Superconducting architectures (IBM, Google) and photonic platforms receive heavier capital investment;
          trapped-ion gate shuttling speeds remain orders of magnitude slower.
        - >-
          Independent benchmarks showing competing superconducting systems matching Helios logical fidelity, or
          demonstrable commercial speed advantage on client algorithms.
      - - Commercialization & Partnerships
        - >-
          Enterprise cloud integration on OCI and partnerships with JPMorgan Chase, BMW, and Amgen demonstrate
          high-value commercial proof-of-concept demand across finance, pharma, and aerospace.
        - >-
          Trailing revenue of $30.9M in 2025 and lumpy Q1 2026 ($5.24M) show early adoption remains dominated by
          non-recurring pilot grants and hardware leases rather than scaled ARR.
        - >-
          Sustained sequential revenue growth exceeding 50% driven by multi-year recurring InQuanto and Nexus software
          contracts rather than one-off hardware leases.
      - - Valuation & Multiples
        - >-
          Scarcity value as the premier liquid pure-play quantum computing platform backed by Honeywell and Nvidia
          attracts thematic institutional capital and index weighting.
        - >-
          At ~500x sales, current valuation prices in seamless execution through 2030, leaving zero margin of safety for
          roadmap delays, multiple compression, or macro tech pullbacks.
        - >-
          Multiple compression below 60x forward sales or upward revision of 2027 revenue targets above $100M supported
          by enterprise cloud consumption.
      - - Governance & Dilution
        - >-
          Honeywell retains ~48% voting power and deep manufacturing/engineering infrastructure, eliminating near-term
          existential financing and insolvency risk.
        - >-
          Majority parent control disenfranchises minority shareholders, restricts floating liquidity, and exposes
          public stock to overhang from secondary block distributions.
        - >-
          Formal alignment mechanisms such as transparent parent supply-contract pricing, independent board oversight,
          and clear lock-up extension agreements.
