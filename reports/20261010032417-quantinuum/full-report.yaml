      - number: '5.2'
        title: Hardware Maturity & Trapped-Ion QCCD Scaling
        blocks:
          - type: paragraph
            body: >-
              Quantinuum's hardware trajectory reflects steady, multi-generational execution across commercial
              trapped-ion systems, advancing from the System Model H1 introduced in 2020 through the 56-qubit System
              Model H2 to the current flagship Helios platform. In trapped-ion QCCD architectures, ionized ytterbium or
              barium atoms are held in microfabricated radiofrequency surface traps and manipulated using precision
              optical laser pulses. This approach delivers all-to-all qubit connectivity, long coherence times, and
              superior gate fidelities compared to solid-state superconducting circuits. Quantinuum management
              explicitly argues that commercial quantum advantage depends on overall time-to-solution, gate accuracy,
              and physical-to-logical error-correction overhead rather than raw physical qubit counts or clock speeds.
              Helios demonstrates this thesis by achieving 48 logical qubits at a compact 2:1 physical-to-logical
              overhead ratio, drastically reducing the error-correction burden required for fault-tolerant execution.
              The company's public hardware roadmap targets the Sol system in 2027 with up to 100 logical qubits and
              Five Nines gate fidelity, followed by Apollo in 2029 with hundreds of logical qubits and Ten Nines
              fidelity. However, scaling beyond current trap geometries introduces acute physical bottlenecks, including
              ion shuttling latencies across multi-zone racetrack architectures, optical laser routing complexities, and
              cryogenic thermal dissipation limits that remain primary engineering risks for public-market investors.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE008
              - CE009
