        title: Exhibits
        blocks:
          - type: callout
            title: Honeywell Control Overhang and High Valuation Scarcity Premium
            body: >-
              Public investors in Quantinuum acquire only 10.2% new voting and economic interest, while Honeywell
              Entities maintain approximately 48.1% combined voting power alongside structural tax receivable agreement
              (TRA) rights and supply-chain dependencies. At the S-1/A midpoint of $54 per share, the fully exchanged
              valuation of approximately $14.0 billion equates to roughly 453x fiscal 2025 revenue ($30.93M), demanding
              exceptional enterprise revenue acceleration to justify the scarcity premium.
            calloutType: risk
            claimRefs:
              - CO004
