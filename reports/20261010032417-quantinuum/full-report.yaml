              loss deepened to -$199.30 million and GAAP net loss reached -$192.56 million in FY2025, compared to
              -$144.07 million in FY2024. Operational cash flow deteriorated from -$120.91 million in FY2024 to -$160.27
              million in FY2025, while capital expenditures surged 365% from $13.98 million to $65.08 million,
              culminating in an annual free cash flow deficit of -$225.35 million.
