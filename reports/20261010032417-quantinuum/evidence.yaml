evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-metrics-and-segmentation
    missingEvidence: >-
      Audited paying customer count, net revenue retention (NRR) percentage, and gross margins broken down by hardware
      cloud access, on-premises systems, and software subscriptions.
    whyItMatters: >-
      Without segmented customer counts and renewal rates, investors cannot evaluate whether revenue growth reflects
      durable multi-year enterprise adoption or transient pilot contracts.
    diligencePath: >-
      Review subsequent Form 10-Q quarterly reports and request management disclosures during IPO roadshow meetings
      regarding enterprise cohort expansion.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: minor
    topic: stakeholder-cap-table
    missingEvidence: >-
      Exact post-IPO share allocations, vesting schedules, and lockup agreements for non-Honeywell pre-IPO institutional
      investors including Amgen and Mitsui & Co.
    whyItMatters: >-
      Individual institutional holdings determine potential secondary float overhang once statutory underwriter lock-up
      windows expire.
    diligencePath: >-
      Inspect final prospectus filing 424B4 and initial Schedule 13D/G beneficial ownership filings following Nasdaq
      listing completion.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-pricing-and-gross-margin
    missingEvidence: >-
      Detailed revenue breakdown by product line (InQuanto software licenses, cloud hardware compute hours, dedicated
      system deployments) and realized contract unit economics.
    whyItMatters: >-
      Without product-level revenue mix and unit gross margins, evaluating the path from current negative gross profits
      to a sustainable high-margin commercial software model remains speculative.
    diligencePath: >-
      Request customer contract renewal schedules, average annual contract value (ACV) metrics, and gross margin targets
      across cloud and software segments during management diligence.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: unverified-cybersecurity-allegation
    missingEvidence: >-
      Forensic security audit reports, official company disclosure, or regulatory filing confirming or refuting the
      August 2026 incransom ransomware leak site listing.
    whyItMatters: >-
      Allegations of pre-IPO security incidents, even when unconfirmed, create regulatory scrutiny under SEC disclosure
      rules and risk enterprise customer confidence in quantum cloud security.
    diligencePath: >-
      Review subsequent SEC 10-Q filings, request an official statement or third-party forensic attestation regarding
      system integrity, and verify whether intellectual property repositories were affected.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: competitor-commercial-pricing-and-concentration
    missingEvidence: >-
