      - "CU002"

  - calloutType: "insight"
    title: "Hyperscaler Distribution via Oracle Cloud Infrastructure"
    body: "The August 2026 strategic partnership with Oracle represents Quantinuum's primary channel to transition from bespoke on-premises hardware delivery to frictionless enterprise cloud access. Hosting the 98-qubit Helios system directly within an OCI data center allows enterprise developers to integrate trapped-ion QPUs with existing high-performance computing clusters and NVIDIA GPU acceleration without building cryogenic or specialized vacuum facility infrastructure."
    claimRefs:
      - "CU005"
      - "CU006"

