    body: "Quantinuum's top-line revenue exhibits structural concentration in government research counterparties. A single Japanese research institute, RIKEN, represented 60% of fiscal 2025 revenue and 63% of 2024 revenue. In the first quarter of 2026, an unnamed government research institution and the U.S. government together accounted for 71% of total net revenue, exposing commercial quarterly results to government budget appropriations and milestone delivery timings."
    claimRefs:
