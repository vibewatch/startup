chapter:
  number: 6
  title: "Customers"
  summary: "Quantinuum demonstrates proven commercial engagement across marquee automotive, pharmaceutical, and financial enterprises, but faces intense revenue concentration where sovereign research institutes and government entities drive over 70% of quarterly recognized revenue. While commercial adoption is expanding via hyperscaler partnerships like Oracle Cloud Infrastructure, empirical customer retention rates and software subscription renewal metrics remain undisclosed."

sections:
  - id: "customer-segmentation-and-market-structure"
    title: "Customer Base Segmentation and Buyer Economics"
    body: "Quantinuum segments its commercial customer base across four primary buyer archetypes: sovereign and government research institutions, global industrial conglomerates, pharmaceutical and materials discovery laboratories, and financial services firms. Commercial engagements are structured around two distinct monetization models: high-value capital-intensive hardware placements and recurring multi-tenant software subscriptions. Industrial research clients such as BMW Group leverage Quantinuum systems to accelerate quantum materials simulation for electric vehicle battery chemistry, while financial institutions like JPMorganChase utilize trapped-ion hardware for certified quantum randomness generation and cybersecurity protocols. Executive leadership under Chief Commercial Officer Lawrence Stack has aligned sales capacity toward Fortune 500 research divisions and national laboratory programs. Former corporate parent Honeywell continues to serve as an anchor enterprise partner, deploying Quantinuum technology across specialty chemical workflows while retaining significant majority control and strategic commercial governance."
    claimRefs:
      - "CU001"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU011"
      - "CU012"
      - "CU014"
    tableRefs:
      - "TU001"

  - id: "commercial-traction-and-adoption-trajectory"
    title: "Adoption Trajectory, Bookings, and Hardware Placement Volatility"
    body: "Quantinuum's top-line revenue trajectory exhibits substantial lumpiness driven by the timing of discrete system deliveries and multi-year sovereign milestones. For the fiscal year ended December 31, 2025, Quantinuum generated $30.9 million in recognized net revenue alongside $79.3 million in customer contract bookings, expanding from $23.0 million of net revenue in fiscal 2024. However, quarterly comparisons reveal extreme volatility: net revenue contracted from $19.1 million in the first quarter of 2025 to $5.2 million in the first quarter of 2026, alongside a decline in quarterly bookings from $1.9 million to $1.3 million. For the first half of 2026, total recognized revenue fell from $21.2 million to $13.2 million, largely because the prior-year period included a $16.5 million hardware placement. Crucially, Quantinuum does not disclose net retention rates (NRR), gross retention rates (GRR), or customer renewal metrics, leaving empirical contract durability and subscription conversion unverified for diligence purposes."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU010"
    tableRefs:
      - "TU002"

  - id: "named-customer-proof-and-enterprise-outcomes"
    title: "Named Enterprise Deployments and Production Proof Points"
    body: "Publicly verifiable customer deployments demonstrate that Quantinuum's trapped-ion hardware achieves high algorithmic fidelity in enterprise research environments. Japanese national scientific institute RIKEN serves as Quantinuum's flagship commercial hardware deployment partner, integrating an on-premises trapped-ion quantum computer with its supercomputing infrastructure. In automotive manufacturing, BMW Group collaborated with Quantinuum to model lithium-air battery reactions, validating computational advantages over classical molecular simulation techniques. In biotechnology, Amgen deployed Quantinuum algorithms to investigate protein-ligand binding kinetics for therapeutic drug discovery. Energy giant bp collaborated with Quantinuum to model subsurface geological structures for hydrocarbon mapping with reduced compute energy draw. Nevertheless, third-party software review directories lack organic customer testimonials, underscoring that current enterprise customer deployments remain structured as exploratory advanced technology pilots rather than operational production runtimes."
    claimRefs:
      - "CU001"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU003"

  - id: "distribution-expansion-and-concentration-headwinds"
    title: "Channel Expansion, OCI Cloud Distribution, and Concentration Risks"
    body: "To accelerate customer acquisition and bypass physical hardware delivery bottlenecks, Quantinuum established a multi-year cloud distribution partnership with Oracle in August 2026. Under this agreement, Quantinuum's third-generation Helios quantum computer—featuring 98 physical qubits, 48 demonstrated logical qubits, and 99.921% two-qubit gate fidelity—will be hosted inside a U.S. Oracle Cloud Infrastructure data center. This managed OCI quantum service integrates trapped-ion processors directly with high-performance classical compute and NVIDIA GPU clusters, lowering deployment friction for corporate developers. Despite this cloud channel expansion, customer concentration remains acute. In fiscal 2025, RIKEN alone represented 60% of annual net revenue, while in the first quarter of 2026, two government entities contributed 71% of total revenue. Mitigating counterparty dependence and converting cloud trial engagements into commercial recurring revenue represent pivotal hurdles for Quantinuum's post-IPO growth."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
      - "CU006"
      - "CU010"
      - "CU011"
    figureRefs:
      - "FU001"

