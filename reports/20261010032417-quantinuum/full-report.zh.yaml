            body: >-
              Quantinuum 进入公开市场后，当前财务表现与资本市场估值之间出现巨大落差。按 6 月 1 日 S-1/A 申报区间的中点 $54 计算，公司完全交换后的股权价值约为 $14.0 billion，而
