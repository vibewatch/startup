            body: >-
              在硬件系统之外，Quantinuum 维护着广泛的开发者和应用软件层，在大规模容错量子实用化前先创造商业参与。软件组合以 TKET 为核心：它是硬件无关的编译器和电路优化框架，可通过 pytket 使用；另有
