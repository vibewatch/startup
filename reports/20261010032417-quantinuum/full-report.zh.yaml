      - number: '5.4'
        title: 技术障碍、基础设施安全与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              尽管基准成绩突出，Quantinuum 仍面临严重的技术、商业和运营障碍，成为评估其 IPO 前估值时必须先解决的尽调阻塞点。首先，离子阱门的
              物理速度处于毫秒至微秒级，比纳秒级超导量子比特慢数个数量级；如果竞争模态实现可扩展纠错，Quantinuum 的吞吐优势可能减弱。其次，商业披露仍不透明：Nexus 会报告活跃组织数，但 Quantinuum
              没有按软件 ARR、独立许可收入、客户续约率，或软件产品相对于资本密集型硬件时间的毛利率进行分项披露。第三，云托管量子执行带来的基础设施风险正在扩大。2026 年 8 月，威胁情报聚合网站
              Ransomware.live 将 Quantinuum 列为据称遭到 incransom 勒索软件团伙攻击的受害者。尽管没有正式公司确认、监管公开披露或客户通知证实任何运营入侵，这一列名仍提示
              Quantinuum 云连接编排网络和专有客户模拟环境存在脆弱性。尽调必须核实 Quantinuum 的 SOC 2 合规状态、事件响应验证，以及其对 Honeywell 精密制造设施的物理生产依赖。
