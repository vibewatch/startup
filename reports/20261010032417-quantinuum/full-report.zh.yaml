      - number: '2.3'
        title: 企业买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              量子计算的商业采用遵循多层企业采购结构，主要由专业企业研发部门推动，而非一般企业 IT 组织。Hyperion Research 调查显示，超过 80%
              的受访企业正积极增加对内部量子计算能力的投入，主要方式是概念验证合作和云接入协议。Quantinuum 已通过与行业龙头的旗舰商业合作把这条路径落地，包括在能源地下测绘领域与 bp 合作、在汽车材料模拟领域与
              BMW Group 合作，以及在密码安全领域与 JPMorgan Chase 合作。但客户集中度仍然严重：2026 年第二季度，前三大客户贡献了总收入的 71%，仅美国政府就占
              32%。把由拨款补贴的探索性试点转化为多年期、可重复的企业生产合同，仍是商业可持续性的核心上市挑战。
            claimRefs:
              - CM002
              - CM003
              - CM006
              - CM007
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
