      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: Honeywell 控制权悬顶与高估值稀缺性溢价
            body: >-
              Quantinuum 的公众投资者仅取得 10.2% 的新增投票权和经济权益；Honeywell Entities 仍保有约 48.1% 的合计投票权， 并享有结构性税收应收协议（TRA）权利及供应链依赖。按
              S-1/A 的每股 $54 中点价，完全交换估值约 $14.0 billion， 相当于 2025 财年收入（$30.93M）的约 453x，因此必须实现极高的企业收入加速，才能支撑这一稀缺性溢价。
            calloutType: risk
            claimRefs:
              - CO004
              - CO010
              - CO011
              - CO012
              - CO015
          - type: callout
            title: 一体化全栈架构与经验证的技术基准
            body: >-
              Quantinuum 不同于纯量子软件供应商或单一组件硬件初创公司：它把高保真离子阱硬件（System Model H1、H2 和 Helios）与 TKET 编程
              SDK，以及化学和网络安全领域的专用商业应用结合起来。平台已展示超过 99.9% 的双量子比特门 保真度和 33,554,432 的量子体积纪录，并得到 Microsoft、DARPA 等头部伙伴的技术验证。
            calloutType: strength
            claimRefs:
              - CO006
              - CO007
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与经典替代方案
        blocks:
          - type: paragraph
            body: >-
              量子计算市场包括专用硬件基础设施、量子—经典混合中间件，以及用于解决经典超级计算机难以处理问题的垂直应用软件。 纳入的支出包括量子云接入令牌（QCaaS）、专用本地硬件销售、销售型系统租赁，以及 InQuanto
              等面向特定领域的化学 模拟平台。商业边界明确排除通用企业 IT 预算、商品化 x86 和 ARM 服务器基础设施，以及不与量子处理器连接的经典分子
              动力学软件。当前企业需求集中在材料发现、药物分子建模和金融优化等计算密集型工作流。现状替代方案是主要竞争障碍：
              高度优化的经典计算集群、先进图形处理器（GPU）和机器学习近似方法仍在快速进步。因此，商业化取决于能否在生产工作负载 上证明清晰、可验证的量子优势，而不只是合成基准电路。
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM015
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
