            body: >-
              Quantinuum 的收入轨迹因离散系统交付和多年期主权项目里程碑的时间安排而显著波动。截至 2025 年 12 月 31 日的财年，公司确认 净收入 $30.9 million，客户合同订单 $79.3
              million；FY2024 净收入为 $23.0 million。但季度比较更加剧烈：净收入从 2025 年 第一季度的 $19.1 million 降至 2026 年第一季度的 $5.2
              million，季度订单也从 $1.9 million 降至 $1.3 million。2026 年上半年， 确认收入从 $21.2 million 降至 $13.2 million，主要因为上年同期包含一笔
              $16.5 million 的硬件部署。关键是，Quantinuum 没有披露 净留存率（NRR）、总留存率（GRR）或客户续约指标，因此合同持久性和订阅转化仍无法用实际数据验证。
