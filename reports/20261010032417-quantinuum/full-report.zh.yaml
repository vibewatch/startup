      - number: '3.2'
        title: 替代模态与超大规模云厂商生态压力
        blocks:
          - type: paragraph
            body: >-
              除直接离子阱同业外，Quantinuum 还在分散且尚未定型的硬件模态中竞争，包括超导电路、中性原子阵列、光子架构和量子退火机。Rigetti Computing、IBM 和 Alphabet 旗下 Google
              Quantum AI
              推动的超导平台，物理门执行速度比离子穿梭快数个数量级，但超导量子比特的物理门保真度明显更低、串扰更高，因此需要很高的物理到逻辑纠错比例（通常每个逻辑量子比特对应数千个物理量子比特）。Rigetti
              的财务表现说明纯硬件开发商承压有多重：2025 年收入仅 $7.1 million，却录得 $(216.2) million 的 GAAP 净亏损，NISQ 时代超导硬件的商业化障碍仍未消失。D-Wave
              Quantum 走混合路线，2025 年收入 $24.6 million、毛利率 82.6%，主要来自自研量子退火系统，用于组合优化。IBM、Alphabet、Microsoft 和 Amazon
              等科技平台巨头则掌握主导开发者接口、企业云环境和经典 AI 算力网络。超大规模云厂商可以用资产负债表补贴量子研发，并在托管量子云上承载第三方硬件（如 Amazon Braket 和 Azure
              Quantum）；但它们控制客户分发层，可能把后端量子硬件供应商商品化为低毛利基础设施提供商，除非供应商建立直接客户关系。
