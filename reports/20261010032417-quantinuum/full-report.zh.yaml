  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与客户工作流集成
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 提供垂直整合的全栈量子计算架构，目标是把企业计算工作流从经典高性能计算集群迁移到量子—经典混合协处理环境。 商业产品的核心是量子电荷耦合器件（QCCD）离子阱硬件架构，代表产品 Helios
              集成 98 个物理量子比特、支持 48 个逻辑量子比特， 双量子比特门平均保真度达到行业领先的 99.921%。平台通过一体化软件栈抽象复杂的物理控制机制，软件栈包括 Guppy 量子编程语言、 开源 TKET
              优化编译器、InQuanto 计算化学模拟软件包，以及 Quantinuum Nexus 云编排平台。Quantinuum 不在孤立实验室中运营， 而是把平台直接嵌入标准工业设计与工程工作流。2026 年与
              Synopsys、Mitsubishi Electric 达成的战略商业协议也说明了这一点：公司把量子算法和线性求解器直接嵌入成熟的电子设计自动化及计算流体力学软件套件，让工业工程师无需重构原有经典工程工具链，
              就能加速非线性 Navier-Stokes 计算和多相电磁仿真。
