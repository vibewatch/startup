  - id: TV002
    title: 正论 / 反论表
    columns:
      - 支柱
      - 看多论点
      - 看空反论
      - 哪些变化会改变判断
    rows:
      - - 技术护城河与架构
        - Helios 的离子阱 QCCD 架构实现 99.921% 门保真度和 48 个逻辑量子比特，在面向 2027 年具备容错能力的 Sol 和 2029 年 Apollo 系统的纠错方面领先行业。
        - 超导架构（IBM、Google）和光子平台获得更多资本投入；离子阱门传输速度仍慢几个数量级。
        - 独立基准显示竞争性超导系统达到 Helios 的逻辑保真度，或客户算法上出现可证明的商业速度优势。
      - - 商业化与合作伙伴
        - OCI 企业云集成，以及与 JPMorgan Chase、BMW 和 Amgen 的合作，证明金融、制药和航空航天领域存在高价值商业概念验证需求。
        - 2025 年过去 12 个月收入为 $30.9M，2026 年第一季度收入波动明显（$5.24M），说明早期采用仍主要依赖一次性试点拨款和硬件租赁，而非规模化 ARR。
        - 连续季度收入持续增长超过 50%，且由多年期、经常性的 InQuanto 和 Nexus 软件合同驱动，而非一次性硬件租赁。
      - - 估值与倍数
        - 作为 Honeywell 和 Nvidia 支持的头部流动性纯量子计算平台，其稀缺性价值吸引主题型机构资本和指数权重。
        - 当前估值约为销售额的 500 倍，已计入公司顺利执行至 2030 年的预期，路线图延迟、倍数压缩或宏观科技股回调几乎没有安全边际。
        - 远期销售额倍数压缩至 60 倍以下，或企业云消费支撑 2027 年收入目标上调至 $100M 以上。
      - - 治理与稀释
        - Honeywell 保留约 48% 投票权和深厚的制造、工程基础设施，消除了近期致命融资和资不抵债风险。
        - 母公司多数控制权削弱少数股东话语权，限制流通性，并使公开股票承受二级大宗分销的抛售压力。
        - 采用正式的利益对齐机制，例如透明的母公司供应合同定价、独立董事会监督，以及明确的锁定期延长协议。
    notes: 各支柱评估硬件工程、企业销售、公开股权定价和母公司治理的结构性驱动因素。阈值代表重估投资立场的可验证标准。
