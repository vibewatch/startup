      - number: '1.4'
        title: 运营里程碑、技术记录与尽调风险
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 的运营轨迹以离子阱量子计算硬件持续通过验证为特点，但也伴随重大的战略集中风险。公司 H 系列机器 连续达到行业基准：从 2020 年的 12-qubit System Model
              H1，发展到 2023 年 5 月的 System Model H2；后者 展示了非阿贝尔任意子编织，并在 2025 年 9 月实现 33,554,432（2^25）的量子体积纪录。Quantinuum 与
              Microsoft 联合研究时生成了 4 个可靠逻辑量子比特，完成 14,000 次无错误实验；其商用 Helios 平台的双量子比特门平均保真度 达到
              99.921%。但独立尽调也揭示了关键结构性脆弱点：公众投资者新增投票敞口仅 10.2%，而 Honeywell 通过关键离子阱
              供应协议、董事会治理和税收应收协议（TRA）付款义务发挥运营杠杆。此外，收入仍集中于主权科研机构、旗舰试点伙伴和
              政府拨款；相较于公司数十亿美元的资本强度和持续结构性经营亏损，更广泛的企业软件经常性采用仍未经证明。
