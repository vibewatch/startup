            body: >-
              Quantinuum 的商业持久性面临核心投资判断张力：一方面要建立高毛利、可重复的企业软件和云收入，另一方面又处在激进的公开市场估值下。 2026 年 6 月传统 IPO 募集 $1.7 billion
              毛收入，并按假设完全交换股权价值 $14.0 billion 定价后，公司第二季度收入为 $8.00 million （同比增长 279.4%），并给出 2026 全年 $28 million 至 $32
              million 的收入指引。收入加速的同时，Quantinuum 2026 年第二季度 GAAP 净亏损高达 $597 million，其中 $464.59 million
              来自公司重组产生的非现金股票薪酬，调整后 EBITDA 亏损为 $68 million。 截至 2026 年 3 月 31 日，剩余履约义务（RPO）为 $76.8
              million，客户需求高度集中在政府和主权科研机构，如 RIKEN 和美国国家实验室。 商业定价仍以高接触、定制化结构为主，混合专用硬件容量预留、专业研究服务和软件订阅。美国商务部 CHIPS R&D
