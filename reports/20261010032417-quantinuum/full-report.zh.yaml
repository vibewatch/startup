      - number: '2.2'
        title: 市场规模视角：终端用户价值与商业供应商支出
        blocks:
          - type: paragraph
            body: >-
              评估量子计算的总可服务市场，需要区分宏观经济层面的终端用户价值创造与供应商能够直接获取的收入。监管文件引用的 2024 年 BCG Quantum Forecast 预计，量子计算应用到 2030 年可创造 $5
              billion 至 $10 billion 的全球终端用户 运营价值；随着容错架构成熟，到 2040 年将大幅升至 $850 billion。但近期供应商可触达的支出小得多。2026 年， 在第二季度收入
              $8.0 million、同比增长 279% 后，Quantinuum 管理层将全年收入指引上调至 $28 million 至 $32 million。 历史收入对比显示出极端波动：2026 年上半年收入
              $13.2 million，低于上年同期的 $21.2 million，原因是 2025 年初 确认了一笔 $16.5 million
              的销售型硬件租赁。如果在公用规模量子硬件部署前，经典算法优化就解决目标化学问题，市场规模 估计仍面临显著下行风险。
            claimRefs:
