chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与混合商业模式
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 于 2021 年 11 月下旬成立，源于跨境合并：一方是 Honeywell International Inc. 的硬件部门 Honeywell Quantum
              Solutions，另一方是英国量子软件与密码学公司 Cambridge Quantum Computing。公司在 科罗拉多州 Broomfield 与英国 Cambridge
              设有双行政总部，采用覆盖全栈的商业模式，包括离子阱量子电荷耦合器件 （QCCD）硬件、底层编译器和面向行业的企业软件应用。收入来自混合商业框架：在 System Model H1 和 H2
              硬件上提供云端量子计算接入、部署本地系统、专业研究协议，以及 Quantum Origin 和 TKET 编译器工具包等 专用工具的经常性软件许可。2026 年第二季度，Quantinuum 报告收入 $8.0
              million，同比来自云、研究和技术支持 项目的收入增长 279%，并建立在 2025 年全年收入 $30.93 million 的基础上。公司总员工数从成立时近 400 人 增至 2026 年年中约 700
              人，其中技术研究和工程团队占全球运营员工的绝大多数。
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO012
