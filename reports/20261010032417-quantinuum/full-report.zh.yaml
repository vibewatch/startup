      - number: '1.2'
        title: 执行管理、治理与母公司关系
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 的公司治理反映了从学术创始研究向工业化商业化的有意转型，同时持续受到 Honeywell International Inc. 的母公司治理影响。公司由总裁兼首席执行官 Rajeeb
              Hazra 博士领导；他曾在 Intel Corporation 工作 25 年，负责技术计算、超级计算架构和企业云项目，之后担任 Micron Technology 高级副总裁。上市前，公司通过 任命首席财务官
              Nitesh Sharan 和首席商务官 Lawrence Stack 强化了财务与商业职能。Sharan 曾任 SoundHound AI CFO，并在 Nike 和 Hewlett-Packard
              担任高级财务负责人；Stack 此前负责 Procore Technologies 和 Red Hat 的企业销售转型。Cambridge Quantum 创始人 Ilyas Khan
              任首席产品官兼董事会副董事长，负责算法开发和密码学 IP。公司控制权仍集中在 Honeywell 手中：合并成立时 Honeywell 持有 54% 的多数股权，发行后仍保有约 48.1%
              的合计投票权，并依法有权提名 Quantinuum 十人分类董事会中的最多两名成员。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO015
