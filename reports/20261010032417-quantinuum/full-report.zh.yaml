              - CM014
              - CM015
      - number: '2.4'
        title: 采用催化剂、经济障碍与企业信任约束
        blocks:
          - type: paragraph
            body: >-
              量子计算的主要增长催化剂，是人工智能和数据密集型科学工作流不断上升的计算需求；这些需求正受到能耗、内存带宽和互连扩展 等经典物理约束。Quantinuum 通过部署在 Oracle Cloud
              Infrastructure 与 Hewlett Packard Enterprise 超级计算网络上的 混合计算模型应对这一转变，让量子处理器把高保真模拟数据直接提供给经典 AI
              管线。另一方面，采用也面临严峻结构性约束。 由于传统经典模拟工作流已经深度嵌入企业流程，切换成本很高。经济层面上，Quantinuum 第二季度收入为 $8.0 million， 但收入成本达到 $10.3
              million，形成负毛利。此外，企业信任正成为新的运营风险：2026 年 8 月，网络犯罪组织 incransom 发布的未经确认的勒索指控显示，管理敏感客户专有 IP
              的量子基础设施运营商正面临更高的监管、声誉和安全审查。
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 深科技商业化中的收入与 TAM 脱节
            body: >-
              尽管第三方预测到 2040 年终端用户价值最高可达 $850 billion，Quantinuum 的近期收入基础仍低于每年 $35 million。
              投资者应结合客户参与深度、离子阱保真度突破和混合云集成评估公司，而不是看近期 P/S 倍数；后者已超过 500x。
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM012
          - type: callout
            title: 经典仿真与算法反向进展
            body: 经典 AI 架构和专用 GPU 加速的进步，持续压缩近期可以展示量子优势的问题空间。Quantinuum 的可服务市场关键取决于能否在 经典计算替代方案占据目标企业预算前，实现容错逻辑量子比特运行。
            calloutType: risk
            claimRefs:
              - CM008
              - CM010
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接离子阱同业格局：IonQ 与模态基准比较
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 作为垂直整合的离子阱平台，在量子计算领域占据独特技术位置。公开市场中最接近的直接同业是 IonQ；两家公司 都采用离子阱路线，但在公司规模、系统架构和商业轨迹上差异很大。IonQ 于
              2021 年通过 SPAC 上市，2025 年实现 $130.0 million GAAP 收入，是 Quantinuum 2025 年 $30.93 million 收入的四倍以上，显示出更大的商业规模。但
              IonQ 更高的商业 收入伴随大量现金消耗，2025 年调整后 EBITDA 亏损为 $(186.8) million。Quantinuum 的技术差异化则在于二维量子电荷耦合器件
              （QCCD）架构：它让镱离子和钡离子在复杂结点网格中穿梭，实现全连接量子比特。在当前商用旗舰系统 Helios 上，Quantinuum 展示了 8×10⁻⁴
              的双量子比特门物理错误率；管理层称其代表商用量子计算的最高保真度。通过 Helix 容错架构，公司展示了 2.8×10⁻⁴ 的逻辑计算错误率；在没有挑选后选择样本的情况下，相比物理 Clifford 错误率提升
              4.28 倍。IonQ 领先于历史收入， 但 Quantinuum 的投资逻辑在于：量子价值最终取决于计算准确性和求解时间，而不是物理量子比特数量或近期云接入量。
            claimRefs:
