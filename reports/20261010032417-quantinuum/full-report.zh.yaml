      - number: '1.3'
        title: 融资历史、估值轨迹与 IPO 条款
        blocks:
          - type: paragraph
            body: >-
              在 Nasdaq 公开发行前，Quantinuum 依靠主要发起方注资和分阶段私募股权融资推进硬件开发。2021 年 11 月成立时， Honeywell 直接注资近 $300
              million，并投入量子硬件资产。2024 年 1 月，公司完成 $300 million 的 Series A 股权融资，投前估值 $5.0 billion，由 JPMorgan Chase
              领投，Mitsui & Co.、Amgen 和 Honeywell 参与。2025 年， Quantinuum 发起由 Honeywell 主导的股权融资，投前估值 $10.0 billion，最终扩大至总额约
              $800 million，参与方 包括 Quanta Computer、NVIDIA 旗下 NVentures、QED Investors 和 Fidelity International。2026 年 6 月，
              Quantinuum 提交 Form S-1/A，拟以每股 $53 至 $55 的价格区间发行 26.5 million 股 Class A 普通股（中点 $54）， 向 Quantinuum Holdings
              注入约 $1.355 billion 净募集资金。按每股 $54、总计 259.286 million 个 Common Units 计算，Quantinuum 隐含的完全交换股权估值约为 $14.0
              billion，相当于约 453x 2025 财年收入（$30.93M）的激进 稀缺性倍数。
            claimRefs:
              - CO001
              - CO004
              - CO008
              - CO009
              - CO010
