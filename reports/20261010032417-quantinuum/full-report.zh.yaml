              Quantinuum 完成上市后，投资重点从流动性准备转向运营执行和季度里程碑交付。近期下行催化剂包括标准 180 天锁定协议到期、Honeywell
              计划分拆航空航天业务后可能进行的大宗分销，以及硬件交付排期不均带来的季度盈利波动。此外，Incransom 勒索软件组织在暗网发布未经验证的说法，声称发生了未披露的 IPO
              前数据窃取，这凸显了需要持续监控的运营网络安全和披露治理风险。评估入场点的机构投资者应关注，触发投资逻辑失效的因素包括 2027 年 Sol 系统路线图任何进度延误、剩余履约义务停滞在 $75 million
              以下，或竞争者以更低基础设施成本展示出更优的逻辑量子比特纠错能力。潜在投资者应保持严格的尽调路径：获取私有客户群披露，跟踪 Oracle Cloud Infrastructure
              部署的企业续约率，并等待倍数大幅压缩，再投入长期风险资本。
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV007
              - CV009
              - CV013
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 估值与运营规模脱节
            body: >-
              Quantinuum 超过 $13.5 billion 的市值对应过去销售额约 500x 的倍数，也对应 2026 年共识收入约 512x。Helios
              展示了行业领先的离子阱保真度，但历史上，当早期数百倍估值遇到收入连续波动或商业拐点延迟时，公开市场往往会惩罚深科技公司。
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV010
          - type: callout
            title: 升级为买入建议的前置里程碑
            body: >-
              从继续跟踪升级为买入，需要两个可验证的触发条件：第一，有证据表明通过 Oracle 和 Azure 的企业云分发已转化为可预测的经常性 ARR，且净收入留存率超过 120%；第二，远期销售额估值倍数明显压缩至
              50x–80x，可由股价回落或年度收入快速加速至 $100 million 以上实现。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV009
              - CV010
              - CV011
