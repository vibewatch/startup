        - label: 第 4 层：云编排与运行时（Quantinuum Nexus）
          detail: 作业提交、资源调度、混合 HPC—量子协处理和遥测管理。
        - label: 第 5 层：垂直应用平台（InQuanto 与 Quantum Origin）
          detail: 面向计算化学、材料发现和可证明熵的领域专用算法。
        - label: 第 6 层：工业 CAE 与企业集成
          detail: 与 Synopsys EDA 工具、Mitsubishi Electric 仿真套件和 Microsoft Azure 的联合开发桥梁。
