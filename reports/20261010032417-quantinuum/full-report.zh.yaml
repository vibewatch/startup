              评估 Quantinuum，要把它的估值放到同业基准中比较，并建立严谨的多情景预测。离子阱竞争者 IonQ 当前估值约为其 2026 年前瞻共识收入 $268 million 的 48 times，而
              Quantinuum 约为 2026 年共识收入 $26.5 million 的 512 times。Quantinuum 凭借更高的逻辑量子比特保真度、全连接能力和全栈软件集成，理应享有溢价；但相对 IonQ
              高出十倍的倍数几乎没有安全边际。基准情景假设 2027 年收入同比增长 67% 至 $44.3 million，销售额倍数压缩至 100x；这样 Quantinuum 的市值约为 $4.44
