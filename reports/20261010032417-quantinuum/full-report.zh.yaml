        - label: 第 2 层：量子纠错与逻辑量子比特
          detail: 容错 QEC 编码达到 48 个逻辑量子比特，物理量子比特与逻辑量子比特比例为 2:1。
        - label: 第 3 层：编译与优化（TKET 与 Guppy）
