            body: >-
              尽管已成为上市公司，Quantinuum 在结构上仍受 Honeywell International Inc. 控制；Honeywell 持有 Class A 和 Class B 股份合计约 48.1%
              的投票权。根据现行 Stockholder Agreement，Honeywell 保留指定董事任命权和委员会否决权，公开市场 Class A
              股东因此难以实质影响公司战略、资本配置或高管任命。除治理控制外，Quantinuum 在定制离子阱硬件的精密微加工和封装上，也高度依赖 Honeywell Aerospace（AERO）这一关键对手方。现行
