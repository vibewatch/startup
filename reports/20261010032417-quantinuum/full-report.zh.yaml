      - number: '5.2'
        title: 硬件成熟度与离子阱 QCCD 扩展
        blocks:
          - type: paragraph
            body: >-
              Quantinuum 的硬件路线显示商用离子阱系统跨代推进的执行力：从 2020 年推出的 System Model H1，经过 56-qubit System Model H2，走到当前旗舰
              Helios。在离子阱 QCCD 架构中，离子化镱或钡原子被固定在微加工射频表面阱中，再用精密光学激光脉冲操控。相比固态超导电路，这一路线提供全连接量子比特、长相干时间和更高门保真度。Quantinuum
              管理层明确认为，商业量子优势取决于总体求解时间、门准确性和物理到逻辑纠错开销，而不是物理量子比特数量或时钟速度。Helios 以紧凑的 2:1 物理到逻辑开销比例实现 48
              个逻辑量子比特，验证了这一判断，并大幅降低容错执行所需的纠错负担。公司公开硬件路线图计划 2027 年推出最多 100 个逻辑量子比特、具备 Five Nines 门保真度的 Sol，随后在 2029
              年推出拥有数百个逻辑量子比特和 Ten Nines 保真度的 Apollo。但若超出当前阱几何结构，离子在多区域跑道架构中的穿梭延迟、光学激光路由复杂度和低温热耗散上限都会形成尖锐的物理瓶颈，仍是
              公开市场投资者最主要的工程风险。
            claimRefs:
