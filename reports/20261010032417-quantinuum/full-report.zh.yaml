      - number: '3.3'
        title: 分发护城河、云中介与生态合作
        blocks:
          - type: paragraph
            body: >-
              为抵御云中介风险并建立可防守的客户锁定，Quantinuum 正围绕 Nexus 平台和战略云伙伴推进激进的软件与企业集成策略。2026 年第二季度，公司宣布与 Oracle 达成行业首个将 Helios
              直接部署在 Oracle Cloud Infrastructure（OCI）AI 数据中心内的战略合作。 这项集成不再要求客户通过专用或割裂的科学门户访问量子硬件，而是让企业开发者在 OCI
              原生计算、网络、存储、身份和治理框架旁边 调用量子—经典混合工作负载。同时，公司与 HPE 建立战略合作，把离子阱量子加速接入高性能计算（HPC）集群和 AI 超级计算机。 软件业务上，自研 Quantinuum
              Nexus 平台的客户组织从 180 家增至超过 200 家，活跃开发者达到 1,000 人；2024 年 8 月至 2026 年 8 月，年度作业提交量增加 10 倍。Quantinuum 支持
              Guppy、NVIDIA CUDA-Q 和 Microsoft Q# 之间的互操作性， 希望在应用层建立高切换成本，让企业工作流持续绑定于其全栈软件和编译器生态。
