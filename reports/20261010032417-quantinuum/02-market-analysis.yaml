    rows:
      - - Quantum Cloud Infrastructure (QCaaS)
        - Cloud-based access to physical trapped-ion quantum computers, API compute tokens, hybrid HPC integrations
        - On-premises classical server hardware, standard commodity cloud compute (x86/ARM CPU/GPU)
        - Enterprise CIO, Head of HPC, VP of Advanced Research
        - Core near-term revenue driver via OCI, Azure, and AWS partnerships
      - - Quantum Chemistry & Materials Software
        - Annual software subscriptions (InQuanto), domain-specific algorithm libraries, simulation tooling
        - Off-the-shelf molecular dynamics packages relying purely on classical density functional theory
        - Head of Computational Chemistry, VP of R&D in pharma/materials
        - High-margin recurring revenue stream with enterprise workflow lock-in
      - - Dedicated Quantum Hardware & Leases
        - Turnkey on-premises system sales, sales-type leases, dedicated cryo/optical support maintenance
        - Standard data center facilities, electrical cooling infrastructure, building leases
        - National laboratories, sovereign defense agencies, sovereign wealth research centers
        - Generates high headline contract cash but creates severe revenue lumpiness
      - - Cybersecurity & Cryptographic Applications
        - Quantum-generated random number tokens, post-quantum cryptography migration consulting, quantum key software
        - Standard legacy TLS/SSL certificates, corporate endpoint antivirus software
        - Chief Information Security Officer (CISO), Head of Infrastructure Security
        - Long-term defensive moat against classical decryption threats
    notes: Spend boundaries distinguish specialized quantum hardware access and vertical algorithmic software from commodity classical high-performance computing infrastructure.
