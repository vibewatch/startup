callouts:
  - calloutType: insight
    title: The Revenue-to-TAM Disconnect in Deep Tech Commercialization
    body: While third-party forecasts project up to $850 billion in end-user value by 2040, Quantinuum's near-term revenue base remains under $35 million annually. Investors must evaluate the company through customer engagement depth, trapped-ion fidelity breakthroughs, and hybrid cloud integration rather than near-term P/S multiples, which exceed 500x.
    claimRefs:
      - CM001
      - CM004
      - CM012
  - calloutType: risk
    title: Classical Emulation and Algorithmic Counter-Advances
    body: Advances in classical AI architectures and specialized GPU acceleration continue to compress the problem space where near-term quantum advantage can be demonstrated. Quantinuum's addressable market depends critically on achieving fault-tolerant logical qubit operations before classical computing workarounds capture target enterprise budgets.
    claimRefs:
      - CM008
      - CM010
      - CM011
