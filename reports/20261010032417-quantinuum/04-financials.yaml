company:
  name: "Quantinuum"
chapter:
  number: 4
  title: "Financials"
  summary: "Quantinuum completed a landmark $1.7 billion traditional IPO in June 2026, boosting liquid cash reserves to $2.1 billion to fund multi-year R&D across four trapped-ion quantum computing generations. However, top-line commercial scale remains early ($30.93 million in FY2025 revenue; $8.0 million in Q2 2026), annual operating cash burn reached -$160.27 million in FY2025 (-$225.35 million free cash flow deficit), and customer concentration is acute, with Japanese research institute RIKEN generating roughly 60% of FY2025 revenue."
sections:
  - id: "revenue-streams-and-pricing-mechanics"
    title: "Commercial Revenue Streams, Monetization Architecture, and Pricing Mechanics"
    body: "Quantinuum operates a multi-tiered commercial model spanning on-premises quantum hardware deployments, cloud-based quantum computing infrastructure, specialized enterprise software licenses, and collaborative research partnerships. In the cloud domain, the company provides quantum computing capacity via its native Quantinuum Nexus platform as well as third-party cloud hyperscalers including Amazon Braket and Microsoft Azure Quantum, charging customers on a per-circuit, per-minute, or enterprise subscription basis. For enterprise software, Quantinuum commercializes specialized computational packages such as InQuanto, targeted at chemical simulation, materials discovery, and molecular property characterization in collaboration with industrial leaders such as BMW Group and Honeywell. On-premises hardware deployments represent capital-intensive transactions, typified by the delivery of high-fidelity trapped-ion systems to anchor international research facilities. In the second quarter of 2026, Quantinuum demonstrated accelerating commercial traction with quarterly revenue expanding 279% year-over-year to $8.0 million, compared to $2.0 million in the prior-year period. However, customer concentration remains a critical risk factor: in fiscal year 2025, approximately 60% of total revenue was derived from a single customer, Japanese research institute RIKEN, creating acute sensitivity to project completion timelines and renewal cadence."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI008"
      - "CI012"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "ipo-capitalization-and-contract-structure"
    title: "Initial Public Offering, Capital Structure, and Contract Dynamics"
    body: "On June 5, 2026, Quantinuum completed the largest initial public offering in the history of the quantum computing sector, listing its Class A common stock on the Nasdaq Global Market under the ticker symbol QNT. The company issued 28,000,000 shares of Class A common stock at an initial public offering price of $60.00 per share, generating $1.68 billion in gross proceeds ($1.60 billion in net proceeds prior to estimated offering expenses). The transaction was executed via an Up-C organizational structure in which Quantinuum Inc. serves as the sole managing member of Quantinuum Holdings LLC, holding approximately 12.6% of the economic interest and voting rights, while pre-IPO Continuing Common Unitholders retain the remaining 87.4% economic interest. This governance framework preserves majority operational control under Honeywell International, which had previously anchored Quantinuum's pre-IPO funding, including an approximately $600 million Series B equity round announced in September 2025 at a $10 billion pre-money equity valuation alongside strategic investors such as JPMorgan Chase, Mitsui & Co., Amgen, and NVIDIA's NVentures arm. Management established formal full-year 2026 revenue guidance of $28.0 million to $32.0 million, reflecting increasing visibility supported by year-to-date bookings of approximately $81 million and an advanced pipeline expected to reach at least $120 million by year-end."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI009"
      - "CI014"
    tableRefs:
      - "TI002"
  - id: "cost-structure-and-cash-burn-trajectory"
    title: "Cost Structure, R&D Velocity, and Cash Burn Trajectory"
    body: "Quantinuum's historical financial results reflect the substantial operating expenditures required to develop and scale four concurrent generations of trapped-ion quantum computing hardware (Helios, Sol, Apollo, and Lumos). In fiscal year 2025, annual net revenue reached $30.93 million, representing 34.6% top-line growth over $22.98 million in FY2024. Simultaneously, cost of revenue declined from $10.81 million in FY2024 to $4.73 million in FY2025, expanding GAAP gross margin from 52.97% to 84.71%. This gross margin expansion highlights software-like marginal delivery economics once hardware infrastructure is deployed. However, operating expenses substantially outstripped gross profit: research and development expenses expanded from $122.24 million in FY2024 to $165.42 million in FY2025, alongside $18.86 million in sales and marketing and $29.86 million in general and administrative expenses. Consequently, operating loss deepened to -$199.30 million and GAAP net loss reached -$192.56 million in FY2025, compared to -$144.07 million in FY2024. Operational cash flow deteriorated from -$120.91 million in FY2024 to -$160.27 million in FY2025, while capital expenditures surged 365% from $13.98 million to $65.08 million, culminating in an annual free cash flow deficit of -$225.35 million."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI011"
    tableRefs:
      - "TI003"
  - id: "unit-economics-and-underwriting-verdict"
    title: "Unit Economics, Peer Benchmarking, and Underwriting Diligence Verdict"
    body: "From an institutional underwriting perspective, Quantinuum presents a bifurcated investment profile defined by an exceptional balance sheet buffer paired with early-stage commercial unit economics. Bolstered by $1.68 billion in gross IPO proceeds, the company held $2.1 billion in cash, cash equivalents, and short-term investments as of June 30, 2026. This capital reservoir provides an estimated five to seven years of operating runway at current cash consumption rates, insulating Quantinuum from near-term refinancing risk as it works toward launching its 100-logical-qubit Sol system in 2027 and its fault-tolerant Apollo architecture in 2029. Nevertheless, commercial scale lags behind direct trapped-ion rival IonQ, whose first-quarter 2026 revenue of $64.7 million exceeded Quantinuum's two-year historical revenue total ($53.91 million across FY2024 and FY2025). Furthermore, critical underwriting inputs—including system-level bill of materials, per-customer acquisition costs, hardware average selling prices, and recurring software renewal rates—remain undisclosed private data. With 60% of FY2025 revenue concentrated in a single anchor customer (RIKEN), underwriters must require contract-level transparency into backlog conversion schedules and commercial hardware margins before treating current valuation multiples as sustainable."
    claimRefs:
      - "CI010"
      - "CI012"
      - "CI013"
