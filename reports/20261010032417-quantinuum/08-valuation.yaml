callouts:
  - calloutType: "risk"
    title: "Valuation Disconnect vs. Operational Scale"
    body: "Quantinuum's market capitalization of over $13.5 billion commands a ~500x multiple on trailing sales and roughly 512x consensus 2026 revenues. While Helios demonstrates industry-leading trapped-ion fidelity, public markets have historically punished deep-tech companies when early multi-hundred-multiple valuations encounter sequential revenue lumpiness or delayed commercial inflection."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV010"

  - calloutType: "recommendation"
    title: "Prerequisite Milestones for an Upgrade to Buy"
    body: "An upgrade from track to buy requires two demonstrable triggers: first, evidence that enterprise cloud distribution via Oracle and Azure converts into predictable recurring ARR with net revenue retention exceeding 120%; second, meaningful valuation multiple compression toward 50x–80x forward sales, either through stock price de-escalation or rapid revenue acceleration above $100 million annually."
    claimRefs:
      - "CV007"
      - "CV009"
      - "CV010"
      - "CV011"

