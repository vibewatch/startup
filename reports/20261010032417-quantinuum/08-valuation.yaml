  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Core Assumptions"
      - "2027E Revenue & Multiple"
      - "Implied Market Cap & Share Price"
      - "Key Risks & Downside Triggers"
      - "Probability Signal"
    rows:
      - - "Bull Case"
        - "Helios commercial adoption accelerates via OCI; enterprise chemistry (InQuanto) scales ARR; Sol system on-track for 2027; revenue reaches high consensus."
        - "$46.3M revenue at 140x forward P/S"
        - "$6.48B market cap (~$25 per share)"
        - "Timeline slip on Sol 100-logical-qubit milestone; enterprise procurement delays; multiple contraction."
        - "20% — Contingent on commercial cloud scaling and flawless hardware roadmap execution."
      - - "Base Case"
        - "Moderate cloud adoption; pilot conversions continue at steady pace; software revenue grows 67% YoY; multiple compresses from extreme levels toward peer group premium."
        - "$44.3M revenue at 100x forward P/S"
        - "$4.44B market cap (~$17 per share)"
        - "Revenue lumpiness; broader tech multiple re-rating; Honeywell aerospace spin-off distractions."
        - "55% — Reflects gradual enterprise adoption against demanding public valuation backdrop."
      - - "Bear Case"
        - "Enterprise pilot fatigue; revenue falls to lower-end consensus ($37.9M); multiple compresses to IonQ peer level (~48x); unverified breach claims or governance issues impact sentiment."
        - "$37.9M revenue at 48x forward P/S"
        - "$1.82B market cap (~$7 per share)"
        - "Severe multiple compression; parent selling overhang; hardware commoditization by hyperscalers."
        - "25% — Significant downside risk if valuation multiples converge with broader quantum peer group."
    notes: "Projections assume 261 million diluted Class A shares outstanding post-IPO. Revenue estimates and valuation multiple benchmarks derived from Wall Street consensus forecasts and IonQ comparative multiples."
    claimRefs:
