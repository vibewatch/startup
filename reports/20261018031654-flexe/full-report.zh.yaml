      - number: '1.4'
        title: 规模信号、里程碑与尽调边界
        blocks:
          - type: paragraph
            body: >-
              当前公开规模信号有用，但并不一致。Flexe 声称有 3,000+ 个活跃仓库、605M+ 平方英尺可用产能，平均上线时间少于 30 天。Dealroom 将 156 名员工分布在四个国家，Tracxn
              的关联法律实体记录则显示截至 2024 年 12 月 31 日有 167 名员工； 这些由供应商定义的数量不能直接比较。Flexe 的案例研究索引为已命名用例提供了结果证据，但没有给出当前客户分母。标题为
              “Why Flexe Failed: Market Collapse”的不利页面虽已抓取，但正文只有标题，无法支持搜索预览中的更强说法。因此，收入、
              活跃客户数、独立验证的网络产能和当前员工规模仍是明确的尽调缺口。
