            body: >-
              公开规模信号具有方向性意义，但仍不足以纳入投资判断。Flexe 声称有 3,000+ 个仓库、800+ 家运营商、605M+ 平方英尺和 少于 30
              天的上线时间，说明网络广度和企业服务准备度。外部估算网站将年收入置于 $91.1M 至 $97.1M，但其中一个页面明确称 收入来源未记录，另一个页面将该数字标为估计值。公司发布的案例研究补充了客户结果证据，包括
              Lull 将交付时间缩短 51%、 FedEx 成本降低 30% 的说法，但没有披露合同金额或 Flexe 的利润率。CompWorth 还估算人均收入为 $327.9K，但这只是代理指标，
              因为公开来源仍未披露毛利率、贡献利润率、获客成本回本周期、留存率或各服务线盈利能力。结果是规模信号可信，但单位经济性透明度不足。
