      - number: '3.2'
        title: Flexe 以网络广度和编排能力竞争，替代方案则专注于控制力或履约方式
        blocks:
          - type: paragraph
            body: >-
              Flexe 的公开定位强调大型多节点网络、一对多集成和受管理的运营层，而不是由客户拥有实体仓库。官方页面描述了 800 多家 运营商、3,000 多个地点、API/EDI/XML
              连接，以及专门的物流分析师控制塔。当买方需要溢出产能、全渠道配送，或需要在多个 第三方站点之上使用单一编排层时，这套方案更有优势。证据池中的替代方案则侧重另一端：Saltbox 和 Portal
              Warehousing 聚焦私人套间和直接设施访问；Forthmatch 将 ShipBob、Flowspace 和 Flexport 放入外包履约候选名单，评估重点转向零售与
              包裹工作流、入站物流协调和库存布局，而不只是按需溢出仓储。
