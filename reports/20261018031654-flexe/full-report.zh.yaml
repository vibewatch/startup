      - number: '2.3'
        title: 采用驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              采用驱动因素清晰且具体：更快启动网络、将仓储支出变为可变成本、应对季节性峰值的溢出产能，以及次日送达或更低包裹成本
              等服务水平结果。当需求波动使长期租约或自建仓库难以计入投资判断时，买方价值主张最强。估值也必须重视约束面。Teardown 的悲观情景并不是仓储需求太小，而是 Amazon、自有网络的 3PL
              和资金更充足的平台可能挤压灵活仓储的利润，前者控制更多环节，或者后者能更激进地补贴灵活性。所以 Flexe 的有效市场小于标题所示的物流支出：它依赖那些重视速度、地理选择和集成，
              足以为中立编排层付费的企业买方，而不是默认选择现有承运商、3PL 或自建方案。在公开证据明确哪些买方会因此续约并扩容之前， 估值逻辑更多依赖品类前景，而不是经过验证的可服务市场。
            claimRefs:
              - CM005
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 品类很大，但可服务市场更窄
            body: 公开记录支持大型物流和按需仓储品类，但 Flexe 的可投资市场更窄：那些足够看重速度、灵活性和编排能力，愿意放弃固定租约 或自建仓库的多节点品牌。
            calloutType: insight
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM015
          - type: callout
            title: 品类增长不保证利润捕获
            body: 支持大品类的同一批来源也凸显了采用约束：Amazon、大型 3PL 和技术驱动的履约竞争者可能压低价格，或凭借对更多实体网络 的控制赢得买方。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 买方的真实选择不只是“另一个市场”
        blocks:
          - type: paragraph
            body: >-
              指定证据中的竞争集合分成三种买方任务，而不是一份单一的同类公司名单。Flexe 自有页面将公司定位于面向中型和大型供应链的
              灵活仓储基础设施、配送、履约和产能管理。相比之下，备选方案指南将自主管理的仓库套件与外包履约网络分开，并提醒买方： 适合季节性仓储的供应商，未必适合日常包裹履约或 B2B 路由指南合规。这一区分很重要：买方将
              Flexe 与 Saltbox 或 Portal Warehousing 比较时，通常是在选择运营控制力和透明的入门定价；将 Flexe 与 Flowspace、ShipBob 或 Flexport 比较时，通常
              是在不同的外包履约和配送模式中做选择。
            claimRefs:
              - CP001
              - CP006
              - CP009
              - CP010
              - CP011
