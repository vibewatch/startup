            body: >-
              投资逻辑仍有真实支撑：Flexe 继续将自己呈现为轻资产网络，拥有 800+ 家运营商、3,000+ 个地点、交易式定价和数周内上线的说法，
              这些都符合可扩展仓储赋能平台的特征，而非重资产运营商。这很重要，因为只要利润率、留存和利用率保持强劲，灵活网络模式就能支撑 溢价收入倍数。反向逻辑是，当前公开证据没有足够精确地展示这些经济性证明。GetLatka
              引用 2024 年收入 $91.1M 以及 2025 年 底员工数 201 人，但也标明收入来源未记录，削弱了投资判断的可信度。同时，Dealroom 展示了广泛的投资者集合，却只给出参考性持股，
              因此稀释、清算优先权和控制权仍不透明。LATKA 还将 ShipMonk、ShipBob 和 Flowspace 列为运营可比公司，但表格提供的是收入数字，
              而非标准化增长率、利润率或估值倍数。因此，情景框架必须围绕一个问题：在获得当前利润率、优先权和可比倍数数据后，2022 年价格 还能否得到支撑。
            claimRefs:
              - CV004
              - CV005
