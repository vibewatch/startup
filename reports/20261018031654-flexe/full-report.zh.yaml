      - number: '8.3'
        title: 尽调问题与投资逻辑破坏触发条件
        blocks:
          - type: paragraph
            body: >-
              最终决策应取决于能否改变价格判断信心，而不是底层业务是否有趣。第一项尽调要求是当前股权结构表和优先股摘要，因为隐藏投资者 和非公开优先权可能在不改变企业价值的情况下，显著改变普通股结果。第二项要求是覆盖
              2025-2026
              年收入、毛利率、贡献利润率、留存和队列健康度的运营桥接表，因为经济性过时或疲弱会迫使估值相对已知估值打折。第三项要求是获得实时价格发现：内部人主导的新股轮或真实的老股交易意向都可能提供这一信号，因为
              UpMarket 和 Forge 都警告私人市场流动性有限，价格信号可能偏离旧轮次估值。 融资下轮、留存疲弱或利润率压缩的证据将触发投资逻辑破坏；当前增长和利润率证明，加上更清晰的优先股堆叠，则会触发正向重估。
            claimRefs:
              - CV006
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 等待公开价格追上当前证明
            body: Flexe 看起来仍是一家在运营的轻资产物流平台，但在没有新的价格发现、当前利润率数据和透明的优先股堆叠前，指定证据不足以支持 相对 2022 年独角兽基准溢价买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV010
              - CV011
              - CV012
