    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Flexe 成立于 2013 年，总部位于西雅图。公司将产品描述为灵活仓储基础设施：企业获得可变仓储产能和运营服务， 同时使用 Flexe
              的技术协调库存、订单和仓库工作流。这一定位比单纯的物业市场更具体。Flexe 称，单次集成即可接入美国和 加拿大 800 多家仓储运营商；其当前主页则宣传超过 3,000
              个按需仓库。独立行业评论也将这一模式描述为把仓储空间从 自有或租赁基础设施转化为可变产能，但这些评论并未独立审计 Flexe 当前的网络数量。
