        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开证据无法充分厘清当前资本状况。FundedIQ 的累计融资额为 $187M，LATKA 为 $211.9M，CompWorth 为 $263M；逐轮融资
              时间线属于公司概况，本章则将这一分歧视为前瞻性投资判断的输入质量问题。差异大到不能忽视，因为融资额不等于可用现金， 而且没有任何追踪机构披露当前流动性。员工数代理指标也指向更精简的组织：LATKA 称 2025
              年 11 月有 201 人，Dealroom 的公开主页显示 156 人，CompWorth 则报告同比下降 45%。这些信号可能反映烧钱控制、需求压力或测量差异。在缺乏公开现金、
              会计亏损、现金消耗、债务或营运资金披露的情况下，下一次融资触发条件仍是未解的尽调事项。
