        - from: service
          to: margin
          label: 投资评估仍取决于未披露的利润率数据
    approximationNotes: 该流程仅描述公开的商业逻辑；不是量化的利润率瀑布。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI006
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据将 Flexe 描述为一个编排技术栈，结合市场情报工具、统一集成层、执行软件、第三方运营商网络，以及人工运营控制塔。
    data:
      layers:
        - label: 买方工作流与方案设计
          summary: Project goals, projected volumes, and workflow requirements determine the starting program.
          modules:
            - label: 项目目标
            - label: 预计交易量
            - label: 工作流要求
          outputs:
            - label: Program selection
              context: Distribution, fulfillment, capacity, or Discover
        - label: 发现与市场情报
          summary: Self-serve tools surface space, pricing, and market context before commitment.
          modules:
            - label: Warehouse Marketplace
            - label: Discover
            - label: Spot Warehousing Index
            - label: ROI Calculator
          outputs:
            - label: Site shortlist and rate context
        - label: 集成控制平面
          summary: Flexe advertises one integration path into the network with multiple transport options.
          modules:
            - label: API
            - label: EDI
            - label: XML
            - label: CSV 备用方案
          outputs:
            - label: Cross-network data exchange
        - label: 执行应用
          summary: The platform combines inventory, order, and warehouse management with analytics.
          modules:
            - label: IMS / WMS / OMS
            - label: 报告
            - label: KPI 监控
            - label: 风险缓释
          outputs:
            - label: Daily warehouse operations
        - label: 运营商网络
          summary: Third-party operators provide the physical storage and fulfillment capacity.
          modules:
            - label: 800+ 家运营商
            - label: 3,000+ 个地点
            - label: 履约
            - label: 配送
          outputs:
            - label: Capacity activation
        - label: 服务与治理
          summary: A human control tower handles onboarding, support, KPI reviews, audits, and escalation.
          modules:
            - label: 物流分析师
            - label: 现场访问
            - label: 库存审计
            - label: 责任规则
          outputs:
            - label: Service governance
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE007
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据支持一条从容量触发到网络扩张的六阶段路径，但留存和集中度仍未量化。
    data:
      items:
        - label: 容量触发
          detail: 需求波动、季节性库存、供应中断或区域测试，都会产生短期仓储需求。
          touchpoints:
            - 季节性高峰
            - 库存过剩
            - 市场进入测试
        - label: 容量发现
          detail: 发货方在承诺前搜索地点、能力、市场费率和空置率信号。
          touchpoints:
            - Flexe Discover
            - Spot Warehousing Index
            - 运营商搜索
        - label: 方案设计
          detail: 项目目标、预期交易量和工作流要求决定拟议网络。
          touchpoints:
            - 物流分析师
            - 地点与能力匹配
            - 交易型定价
        - label: 系统连接
          detail: 客户用 API、EDI、XML 或手动共享 CSV 接入。
          touchpoints:
            - API
            - EDI 或 XML
            - CSV
        - label: 上线与运营
          detail: Flexe 宣传平均上线时间少于 30 天，并监控整个网络的运营商表现。
          touchpoints:
            - 客户接入
            - 库存跟踪
            - 质量指标
        - label: 扩张或释放容量
          detail: 客户可以随需求变化增加或移除节点，而不必再签订多年租约。
          touchpoints:
            - 新增地点
            - 新使用场景
            - 释放容量
          note: 公开证据未量化续约、NRR 或按队列划分的扩张。
    approximationNotes: 这些阶段综合了有证据支持的运营顺序；不是测量得到的转化漏斗，也不暗示任何转化率。
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 即使考虑到网站层面可见的缓释措施，运营商质量差异、市场敏感性和资本结构不透明仍是残余严重性最高的风险。
    data:
      columns:
        - label: 可能性
          detail: 基于保留的公开证据判断的残余可能性。
        - label: 影响
          detail: 风险兑现后的下行严重程度。
        - label: 缓释成熟度
          detail: 有公开证据支持的缓释质量，而非管理层意图。
        - label: 残余严重性
          detail: 可见缓释措施之后的投资评估担忧。
      rows:
        - label: 运营商质量差异
          note: 分散的第三方执行是该模式的核心。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 高
              tone: high
        - label: 不可抗力库存责任
          note: 尽管运营商有保险，客户责任豁免条款仍然存在。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 高
              tone: high
        - label: 企业需求放缓
          note: 反向证据将 2024 年缩编与需求走弱及竞争联系起来。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 低-中
              tone: warning
            - label: 高
              tone: high
        - label: 利润率收缩 / 伙伴成本上涨
          note: 外部 SWOT 提到合作伙伴劳动力和房地产成本压力。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 低-中
              tone: warning
            - label: 高
              tone: high
        - label: 资本结构不透明
          note: 公开股权结构表信息和当前融资条款仍不完整。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 低
              tone: medium
            - label: 高
              tone: high
        - label: 公开数据不一致
          note: 员工数与业务连续性的第三方记录相互冲突。
          values:
            - label: 中
              tone: medium
            - label: 中-高
              tone: high
            - label: 低
              tone: medium
            - label: 中-高
              tone: high
    approximationNotes: 定性热力图综合了保留的来源表述；它是排序辅助工具，不是概率模型。
    claimRefs:
      - CR005
      - CR006
      - CR012
      - CR013
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 当前运营证明可见，但价格发现和结构证据不完整，因此建议仍为观察。
    data:
      nodes:
        - id: scale
          label: 运营规模仍然可见
          detail: 官方材料继续引用 800+ 家运营商和 3,000+ 个地点。
          tone: positive
        - id: model
          label: 轻资产模式仍具吸引力
          detail: 交易型容量、无需客户承担 CapEx，以及数周内上线的部署速度，支持快速商业化。
          tone: positive
        - id: anchor
          label: 公开估值锚点已过时
          detail: 公开价格证据仍集中在 2022 年 Series D / 独角兽估值标记。
          tone: warning
        - id: quality
          label: 当前证明质量参差不齐
          detail: 虽有收入和员工数数据点，但关键经济指标仍未得到公开验证。
          tone: warning
        - id: structure
          label: 流动性和优先股压力仍不清楚
          detail: 老股交易平台强调流动性不足，公开股权结构表数据也只是指示性的。
          tone: adverse
        - id: call
          label: 推荐：观察
          detail: 只有在审阅新一轮融资条款、实时价格和当前单位经济模型后，才应推进。
          tone: adverse
      edges:
        - from: scale
          to: model
          label: 支持投资逻辑
        - from: model
          to: anchor
          label: 但不会重置价格
        - from: anchor
          to: quality
          label: 需要当前证明
        - from: quality
          to: structure
          label: 以及更高透明度
        - from: structure
          to: call
          label: 因此入场保持纪律
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
