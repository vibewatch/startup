      - number: '3.3'
        title: 定价透明度和运营控制是竞争者最容易替代 Flexe 的领域
        blocks:
          - type: paragraph
            body: >-
              公开定价是 Flexe 对外比较中最薄弱的一环。Flexe 宣传交易式或按需付费的经济性，以及不签长期租约，但指定证据池没有提供 可比用例的公开价目表。Toolradar 和 Saltbox
              都称买方仍需直接联系或获取定制报价；两份替代方案指南也建议逐设施、同口径索取 报价，因为网络层面的描述无法确定某一账户的商业条款或服务承诺。同一批证据还显示出控制权取舍：Flexe 的 FAQ 称进入设施
              必须提前协调，而 Saltbox 将“随时进场”的套间访问作为差异化卖点。这使 Flexe 对希望获得可预测入门成本和直接仓库控制的 小型运营商更难评估。
            claimRefs:
              - CP003
              - CP005
              - CP008
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP007
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Flexe 的护城河是情境性的，而非普适的
        blocks:
          - type: paragraph
            body: >-
              在指定证据范围内，当买方重视企业级网络广度、集中式集成和 Spot Warehousing Index 等市场情报产品时，Flexe 的护城河
              最强。单一设施或共享仓储替代方案很难复制这些能力。当买方的首要问题是小面积仓库、直接库存访问或透明入门定价时，护城河 就弱得多，因为这正是 Saltbox 等替代方案直接对 Flexe
              展开定位的地方。结果是，Flexe 在复杂、弹性产能需求中具备持久 位置；但在市场低端，决策更关乎简单的空间、劳动力和价格，而非编排能力，因此仍面临可信的商品化风险。
            claimRefs:
              - CP002
              - CP006
              - CP012
              - CP014
      - number: '3.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 透明的入门定价是低端替代方案攻击 Flexe 的切口
            body: 指定证据中最强的替代信号，并不是存在比 Flexe 更好的企业网络，而是为希望直接进入仓库、并依据公开入门价格做预算的 运营商提供更简单的价值主张。
            calloutType: risk
            claimRefs:
