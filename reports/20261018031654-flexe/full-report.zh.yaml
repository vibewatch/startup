  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 2025-2026 年收入增长保持强劲，利润率健康，留存持久，且新一轮融资提供可信的价格发现。
        - 没有公开区间可供支持；只能依据拟议证券价格、完全摊薄后的持股比例和目标回报退出计算来评估。
        - 需要证明轻资产网络能转化为持久的经济效益，而不只是扩大覆盖范围。
        - 需要新的融资文件或可信的独立老股成交价。
      - - 基准
        - 公司仍在运营且具备商业相关性，但当前经济表现和股权结构表条款仍有部分不透明。
        - 在当前利润率、留存和优先权得到验证前，入场应相对 2022 年估值保持折价纪律。
        - 过时的估值、低迷的流动性和隐藏的优先权条款，至多只能让上行空间与风险保持平衡。
        - 与当前证据集合最为匹配。
      - - 悲观
        - 增长放缓、客户集中度恶化、利润率收缩，或被迫流动性事件暴露出优先股压力。
        - 可能需要大幅下调估值的融资轮或深度老股折价，才能补偿执行和结构风险。
        - 薄弱的经济表现可能迅速推翻平台溢价逻辑。
        - 不利的流动性条款、下调估值的融资证据或当前队列表现不佳，都会发出这一信号。
    notes: 情景区间仅作方向性参考，因为现有公开证据没有提供足够的当前输入，无法完成完整的 DCF 或公开可比公司桥接。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV010
      - CV011
      - CV012
