  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方工作流
        blocks:
          - type: paragraph
            body: >-
              核心市场边界是灵活仓储基础设施：短期仓储、配送和履约可以快速启用、按交易付费，并由共享软件层统一管理，而不是依赖专用租赁建筑。Flexe
              的官方定位明确强调轻资产、按需付费，并旨在避免长期仓储承诺带来的固定成本负担。因此，公司归入仓储服务，而非纯供应链软件，与 IncFact 的 NAICS 49311
              分类一致。最相关的买方是需要北美各地仓储产能、履约覆盖或溢出保障的物流或供应链团队；实际用户包括货主、仓库运营商，以及在单一集成工作流中工作的 Flexe 自有物流分析师。公开客户
              案例表明，现状替代方案并不是“任何物流软件”，而是租赁空间、零散的 3PL 合作关系和临时旺季应对方案的组合。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM007
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM014
      - number: '2.2'
        title: 规模测算视角及其实际证明范围
        blocks:
          - type: paragraph
            body: >-
              证据支持多个有用的规模测算视角，但不足以构成数学上严谨的 TAM-SAM-SOM 链条。Teardown 引用的数据显示，2025 年按需 仓储市场约为 $147.8B，2035 年将增至约
              $504.7B；它还将更广义的美国 3PL 市场置于 2025 年约 $323B，其中增值仓储和 配送占支出最大部分。这些估计说明 Flexe 正在进入一个庞大品类，但不能直接与 Flexe
              自身运营指标互换。Flexe 的公司公开 证据更受限：3,000+ 个仓库、800+ 家运营商、605M+ 平方英尺产能，以及当前 Spot Warehousing Index 的每托盘 $13.35、
              全国平均空置率 4.2% 和高需求强度。这些数字可用来说明可触达的网络广度和实时市场监测，但不是自下而上的可服务收入测算。 因此，公开记录支持方向性的市场判断，而非经过核对的支出模型。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
