    title: "Track until public pricing catches up with current proof"
    body: >-
      Flexe still looks like a live, asset-light logistics platform, but the assigned evidence does
      not justify paying up against a 2022 unicorn benchmark without fresh price discovery, current
      margin data, and a transparent preference stack.
    claimRefs: [CV001, CV003, CV010, CV011, CV012]
