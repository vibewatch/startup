      - [Risk rating, High, "Liquidity, preference, and margin uncertainty can change realized entry returns."]
      - [Valuation stance, Stretched at the last known public mark, "Treat the 2022 unicorn valuation as a ceiling reference until refreshed."]
      - [Target-return posture, Not supportable from public data yet, "Require fresh financing or live secondary indications before setting return hurdles."]
    notes: "Illustrative decision framing anchored to public evidence available on 2026-10-18; not a mark-to-market valuation."
    claimRefs: [CV001, CV002, CV003, CV010, CV011, CV012]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Lens, Thesis, Anti-thesis, What would change the view]
    rows:
      - ["Business model", "Asset-light network with 800+ operators and 3,000+ locations can scale without owning warehouses.", "Network breadth alone does not show durable unit economics or pricing power.", "Current margin, utilization, and retention data that show the model compounds efficiently."]
      - ["Commercial traction", "Company materials still show active go-to-market motion, market-index publishing, and launch-in-weeks claims.", "These are company-controlled proofs and do not reveal customer concentration or churn.", "Independent customer references, cohort retention, and concentration data."]
      - ["Revenue signal", "Public compilations indicate Flexe reached $91.1M in 2024 revenue.", "The same compilation says the revenue source is not recorded, limiting confidence.", "Audited or management-certified 2025-2026 revenue bridge and gross margin disclosures."]
      - ["Capital structure", "Dealroom still shows a meaningful investor base behind the company.", "Public ownership percentages are indicative and some investors are hidden, so preference overhang is unclear.", "Current cap table, board composition, and preferred terms."]
      - ["Entry price", "A fresh primary round or credible secondary clearing price could reset conviction quickly.", "Current public price evidence still references 2022 and both secondary platforms emphasize illiquidity and uncertainty.", "Live broker indications, tender materials, or a new insider-led financing."]
      - ["Comparable set", "LATKA lists ShipMonk, ShipBob, and Flowspace alongside Flexe as warehouse-management-software peers.", "The table does not normalize revenue periods, growth, margins, business mix, or valuation multiples.", "A dated, methodologically consistent comp set matched to Flexe's revenue model."]
    notes: "Thesis rows combine company-issued operating claims with independent market-data caveats; current public evidence is insufficient for a full comp-based valuation."
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - ["Bull", "2025-2026 revenue growth remains strong, margins are healthy, retention is durable, and a fresh round supplies credible price discovery.", "No public range is supportable; underwrite only from the proposed security price, fully diluted ownership, and target-return exit math.", "Requires proof that the asset-light network converts into durable economics, not just footprint.", "Would need fresh financing documents or credible independent secondary clears."]
      - ["Base", "Company is still operating and commercially relevant, but current economics and cap-table terms remain partially opaque.", "Entry should be disciplined to a discount versus the 2022 mark until current margins, retention, and preferences are verified.", "Stale marks, muted liquidity, and hidden preference terms keep upside/risk skew balanced at best.", "Best fits the current evidence set."]
      - ["Bear", "Growth slowed, customer concentration worsened, margins compressed, or a forced liquidity event exposed preference overhang.", "A material down-round or deep secondary discount would likely be required to compensate for execution and structure risk.", "Weak economics could invalidate the platform-premium thesis quickly.", "Would be signaled by adverse liquidity terms, down-round evidence, or poor current cohorts."]
    notes: "Scenario ranges are directional because assigned public evidence does not provide enough current inputs for a full DCF or public-comps bridge."
    claimRefs: [CV001, CV002, CV003, CV004, CV006, CV010, CV011, CV012]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: "The recommendation stays at track because current operating proof is visible but price discovery and structure evidence are incomplete."
    data:
      nodes:
        - id: scale
          label: "Operating scale still visible"
          detail: "Official materials continue to cite 800+ operators and 3,000+ locations."
          tone: positive
        - id: model
          label: "Asset-light model still attractive"
          detail: "Transactional capacity, no customer CapEx, and launch-in-weeks deployment support commercialization speed."
          tone: positive
        - id: anchor
          label: "Public valuation anchor is stale"
          detail: "Public price evidence still centers on the 2022 Series D / unicorn mark."
          tone: warning
        - id: quality
          label: "Current proof quality is mixed"
          detail: "Revenue and headcount datapoints exist, but key economics remain unverified in public."
          tone: warning
        - id: structure
          label: "Liquidity and preference overhang remain unclear"
          detail: "Secondary platforms stress illiquidity, and public cap-table data is only indicative."
          tone: adverse
        - id: call
          label: "Recommendation: track"
          detail: "Advance only after fresh round terms, live pricing, and current unit economics are reviewed."
          tone: adverse
      edges:
        - from: scale
          to: model
          label: "supports thesis"
        - from: model
          to: anchor
          label: "but does not reset price"
        - from: anchor
          to: quality
          label: "needs current proof"
        - from: quality
          to: structure
          label: "and better transparency"
        - from: structure
          to: call
          label: "so entry stays disciplined"
    claimRefs: [CV001, CV003, CV007, CV008, CV010, CV011, CV012]
callouts:
