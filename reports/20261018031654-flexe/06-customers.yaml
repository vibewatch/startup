        and retention cohorts by customer segment.
      whyItMatters: >-
        Initial deployments can be short-lived projects; retention evidence is
        necessary to distinguish recurring expansion from episodic capacity use.
      diligencePath: >-
        Request account-level retention cohorts, renewal schedules, contract
        durations, and expansion revenue by product and customer segment.
      relatedQuestionRefs: [QU009]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
