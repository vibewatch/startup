        - Not established by retained text
        - Flexe claims 51% lower delivery time and 30% lower FedEx costs
        - Company-issued outcome without customer-side corroboration
      - - DeFili
        - Ecommerce fulfillment
        - Fast ecommerce fulfillment
        - Not established by retained text
        - Named official case study
        - Retained listing gives no quantified outcome, scope, or date
      - - Mantoria
        - Cross-border warehousing
        - On-demand warehousing across borders
        - Not established by retained text
        - Named official case study
        - Retained listing gives no quantified outcome, scope, or date
      - - Innovel
        - Retail logistics partner
        - Partnership positioned for growth
        - Not established by retained text
        - Named official case study
        - Retained listing gives no quantified outcome, scope, or date
      - - Walmart, Staples, and Procter & Gamble
        - Large retail and consumer enterprises
        - Platform use reported by Logistics Navigators
        - Not established by retained text
        - Independent article names the companies as users
        - No customer-side confirmation, current scope, or outcome is supplied
    notes: >-
      This is a sample of public names in the retained evidence, not a complete
      customer list. Production status is left unknown unless the fetched text
      expressly establishes it; outcome claims remain attributed to their issuer.
    enumerationScope:
      coverage: sample
      basis: >-
        Publicly named customers and partners visible in the assigned prefetched
        sources reviewed on 2026-10-18, excluding unsupported logo-only inference.
    claimRefs: [CU008, CU009, CU010, CU011]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence supports a six-stage path from a capacity trigger through
      network expansion, while retention and concentration remain unquantified.
    data:
      items:
        - label: Capacity trigger
          detail: Demand volatility, seasonal inventory, a disruption, or a regional test creates a short-term warehousing need.
          touchpoints:
            - seasonal peak
            - excess inventory
            - market-entry test
        - label: Capacity discovery
          detail: Shippers search location, capability, market rates, and vacancy signals before committing.
          touchpoints:
            - Flexe Discover
            - Spot Warehousing Index
            - operator search
        - label: Solution design
          detail: Project goals, expected volumes, and workflow requirements determine the proposed network.
          touchpoints:
            - logistics analyst
            - site and capability match
            - transactional pricing
        - label: Systems connection
          detail: The customer connects through API, EDI, XML, or manual CSV sharing.
          touchpoints:
            - API
            - EDI or XML
            - CSV
        - label: Launch and operate
          detail: Flexe advertises sub-30-day average go-live and monitors operator performance across the network.
          touchpoints:
            - onboarding
            - inventory tracking
            - quality metrics
        - label: Expand or release capacity
          detail: Customers can add or remove nodes as demand changes instead of signing another multi-year lease.
          touchpoints:
            - additional locations
            - new use cases
            - capacity release
          note: Public evidence does not quantify renewal, NRR, or expansion by cohort.
    approximationNotes: >-
      The stages synthesize the supported operating sequence; they are not a
      measured conversion funnel, and no conversion rates are implied.
    claimRefs: [CU003, CU004, CU005, CU006, CU013]
callouts:
  - calloutType: strength
    title: Credible adoption surfaces without a disclosed customer denominator
    body: >-
      Network scale, implementation speed, and named examples make Flexe's initial
      enterprise use case tangible, but none of those measures states how many
      customers are active or how much revenue they represent.
    claimRefs: [CU001, CU005, CU008, CU012, CU016]
  - calloutType: risk
    title: Operational breadth raises execution and procurement diligence
    body: >-
      A distributed operator base requires consistent controls, while integration
      work, unpublished pricing, geographic limits, and a reported headcount decline
      warrant customer-reference checks before underwriting expansion.
    claimRefs: [CU006, CU007, CU015]
