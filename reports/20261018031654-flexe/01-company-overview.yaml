schemaVersion: report-v2
artifact: company-overview
slug: flexe
runDate: 2026-10-18
company:
  name: Flexe
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Flexe is a Seattle-founded flexible warehousing platform that says one technology integration
    connects enterprises to 800+ operators and 3,000+ warehouse locations in the United States and
    Canada. Third-party profiles preserve the 2022 Series D and $1B valuation marker, but current
    revenue, customer count, fully reconciled headcount, ownership, and financing terms remain gaps.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Flexe was founded in 2013 and is headquartered in Seattle. The company describes its product
      as flexible warehousing infrastructure: enterprises obtain variable warehouse capacity and
      operating services while using Flexe's technology to coordinate inventory, orders, and
      warehouse workflows. That positioning is more specific than a simple property marketplace.
      Flexe says a single integration opens access to more than 800 warehouse operators across the
      United States and Canada, while its current homepage advertises more than 3,000 on-demand
      warehouses. Independent industry commentary similarly describes the model as converting
      warehouse space from owned or leased infrastructure into variable capacity, although that
      commentary does not independently audit Flexe's current network counts.
    claimRefs: [CO001, CO002, CO003, CO004, CO014]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance visibility
    body: >-
      The assigned evidence identifies Francis Duong and Karl Siebrecht as co-founders and continues
      to identify Siebrecht as chief executive. Public governance evidence is less reliable.
      Tracxn displays an 11-person current board list, but the list includes multiple variants of the
      Mike Galgon name and therefore should not be treated as a clean count of unique directors
      without primary records. Dealroom separately reports 15 investors on the cap table while
      warning that some investors are hidden and that displayed ownership percentages are
      indicative. Founder continuity is therefore visible, but current director identities,
      committee assignments, voting control, liquidation preferences, and succession depth require
      company documents.
    claimRefs: [CO005, CO006, CO011, CO012]
    tableRefs: [TO002]
  - id: financing-and-stakeholders
    title: Financing and stakeholder context
    body: >-
      Tracxn classifies Flexe as Series D and reports $330M raised across seven rounds. Its public
      financing table identifies a $119M Series D on July 6, 2022 at a $1B post-money valuation,
      led by BlackRock and Madrona, with Prologis, Redpoint Ventures, T. Rowe Price, Tiger Global,
      and Activate Capital participating. These are third-party database figures rather than
      company filings, and the assigned pool does not establish later financing, debt, secondary
      transactions, cash availability, or current ownership percentages. The $330M funding figure
      must not be read as cash on hand, and the 2022 valuation must not be presented as a current
      fair-value mark.
    claimRefs: [CO007, CO008, CO009, CO010, CO012]
    tableRefs: [TO003]
  - id: scale-signals-and-diligence-boundary
    title: Scale signals, milestones, and diligence boundary
    body: >-
      Current public scale signals are useful but uneven. Flexe claims 3,000+ active warehouses,
      605M+ square feet of available capacity, and average go-live in under 30 days. Dealroom maps
      156 employees across four countries, while Tracxn's linked legal-entity record shows 167
      employees as of December 31, 2024; those provider-defined counts are not directly comparable.
      Flexe's case-study index offers outcome evidence for named use cases, but not a current
      customer denominator. An adverse page titled "Why Flexe Failed: Market Collapse" was fetched,
      yet its retrieved body contains only the headline and cannot support the stronger claims in
      the search preview. Revenue, active customers, independently verified network capacity, and
      current workforce therefore remain explicit diligence gaps.
    claimRefs: [CO004, CO013, CO015, CO016]
    figureRefs: [FO001]
