      - [Stage, "Series D", "2026-10-18 access", medium, "Third-party database classification."]
      - [Total funding, "$330M across seven rounds", "2026-10-18 access", medium, "Third-party database figure; not cash available."]
      - [Latest disclosed valuation, "$1B post-money", "2022-07-06", medium, "No current fair-value mark in the assigned evidence."]
      - [Warehouse network, "3,000+ warehouses and 605M+ square feet", "2026-10-18 access", medium, "Company-issued; not independently audited here."]
      - [Operator network, "800+ operators in the U.S. and Canada", "2026-10-18 access", medium, "Company-issued; operator activity is not independently verified."]
      - [Workforce, "156 mapped by Dealroom; 167 in Tracxn legal-entity record", "2024-12-31 / current access", low, "Different definitions and dates prevent reconciliation."]
      - [Revenue or run-rate, null, null, low, "No supportable value in the assigned evidence."]
      - [Active customer count, null, null, low, "Case studies do not establish a customer denominator."]
    notes: >-
      Values preserve each publisher's metric, date, and qualification; null means the assigned
      prefetched evidence did not support a defensible quantity.
    claimRefs: [CO001, CO002, CO003, CO004, CO007, CO008, CO010, CO013]
