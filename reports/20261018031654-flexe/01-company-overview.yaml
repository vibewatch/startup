    title: Public evidence establishes identity, not current economics
    body: >-
      The assigned pool supports Flexe's identity, product model, and historical financing, but it
      does not support current revenue, customer count, cash availability, definitive ownership,
      financing preferences, or an independently reconciled workforce figure.
    claimRefs: [CO008, CO010, CO011, CO012, CO013]
