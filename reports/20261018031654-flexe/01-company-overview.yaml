    notes: >-
      This is a partial public enumeration: Dealroom confirms that founder information exists but
      hides it on the public view, and no primary board roster or management biographies were
      available in the assigned pool.
    enumerationScope:
      coverage: partial
      basis: >-
        Public founder, CEO, and board references in the assigned Tracxn and Dealroom profiles;
        undisclosed executives and unverified director identities are excluded.
    claimRefs: [CO001, CO005, CO006, CO011, CO012]
  - id: TO003
    title: Stakeholder or investor map
    columns: [Stakeholder, Public role, Economic or control importance, Evidence boundary, Diligence ask]
    rows:
      - [BlackRock, "Series D lead", "Lead investor in the $119M round", "Tracxn financing table", "Confirm security terms, ownership, and governance rights."]
      - [Madrona, "Series D lead", "Lead investor with potential governance influence", "Tracxn financing table", "Confirm board representation and reserve strategy."]
      - [Prologis, "Series D participant", "Strategic logistics investor", "Tracxn financing table", "Separate investment rights from any commercial relationship."]
      - [Redpoint Ventures, "Series D participant and earlier investor", "Longstanding financial stakeholder", "Tracxn investor records", "Confirm current ownership and pro-rata rights."]
      - [T. Rowe Price, "Series D participant and 2020 Series C lead", "Late-stage financial stakeholder", "Tracxn financing table", "Confirm security seniority and liquidity expectations."]
    notes: >-
      The map covers visible named investors only; Dealroom says some cap-table investors are
      hidden, and neither source supplies definitive current ownership percentages or control rights.
    enumerationScope:
      coverage: partial
      basis: >-
        Named participants visible in the assigned Tracxn financing table, cross-checked against
        Dealroom's statement that the public cap table contains hidden investors.
    claimRefs: [CO009, CO012]
