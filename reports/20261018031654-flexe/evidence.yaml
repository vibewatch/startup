evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current director roster, committee assignments, ownership percentages, voting rights, and liquidation preferences.
    whyItMatters: Governance and security terms determine control, downside protection, and financing flexibility.
    diligencePath: >-
      Request the current cap table, charter, investor-rights agreement, board roster, and board minutes from
      management.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: economics
    missingEvidence: Current revenue, revenue run-rate, gross margin, contribution margin, cash balance, debt, and runway.
    whyItMatters: Funding raised is not cash available, and historical valuation cannot establish current operating health.
    diligencePath: >-
      Obtain audited financials, monthly management accounts, debt schedules, and the latest board-approved operating
      plan.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A dated management headcount by employment type, function, and geography.
    whyItMatters: Provider-defined workforce counts use different dates and cannot establish current staffing or restructuring.
    diligencePath: Request a current human-resources roster and reconcile it to payroll and contractor records.
    relatedQuestionRefs:
      - QO006
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: Current active-customer count, named customer roster, concentration, retention, and contract duration.
    whyItMatters: Selected case studies do not supply the denominator needed to assess repeatable enterprise adoption.
    diligencePath: Request cohort retention, customer concentration, active-site counts, and customer-reference calls.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholders
    missingEvidence: A complete list of current investors and their economic and governance rights.
    whyItMatters: Dealroom explicitly hides some investors, so the public stakeholder map is necessarily partial.
    diligencePath: Reconcile the definitive capitalization table with all financing and secondary-transfer documents.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Independent bottom-up spend or shipment-volume data that maps Flexe's target verticals, geographies, and contract
      durations to a serviceable market.
    whyItMatters: >-
      Without a denominator aligned to actual buyer fit, headline logistics or warehousing TAM figures can overstate
      valuation upside.
    diligencePath: >-
      Request customer mix, ACV, utilization, and revenue by use case and geography, then reconcile those with
      third-party industrial leasing and 3PL datasets.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-map
    missingEvidence: >-
      Win-rate, sales-cycle, and budget-owner evidence showing whether logistics, ecommerce, or procurement teams
      actually control expansion decisions.
    whyItMatters: >-
      Buyer authority determines whether Flexe can expand beyond overflow projects into repeatable network-standard
      infrastructure.
    diligencePath: >-
      Ask management for cohort case studies that include buyer title, ACV, implementation scope, and renewal or
      expansion behavior by segment.
    relatedQuestionRefs:
      - QM002
      - QM006
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Facility-level quotes, minimum commitments, and SLA penalty terms for Flexe, Flowspace, ShipBob, and Flexport on
      the same order profile.
    whyItMatters: >-
      Without like-for-like commercial terms, the public comparison can describe packaging but cannot underwrite
      realized cost or switching economics.
    diligencePath: >-
      Run an RFP using the same storage, inbound, parcel, and B2B order assumptions across the shortlisted providers and
      compare the resulting proposals line by line.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: substitute-classes
    missingEvidence: >-
      Additional source-backed profiles for enterprise incumbents and other marketplace-style overflow competitors
      beyond the names explicitly present in the assigned pool.
    whyItMatters: >-
      The chapter can classify the main buyer jobs but cannot claim that the named competitor list is exhaustive for
      enterprise overflow warehousing.
    diligencePath: >-
      Add prefetched direct sources for the missing enterprise rivals, then expand the profile table only where the
      evidence supports like-for-like comparison.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Customer contract pricing waterfalls, fee schedules, minimums, rebates, and service-line mix.
    whyItMatters: >-
      Realized pricing determines revenue quality, gross margin potential, and whether usage volatility is a feature or
      a risk.
    diligencePath: Request current standard order forms, three anonymized customer contracts, and realized pricing by product line.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, contribution margin, CAC payback, retention, and service-line profitability.
    whyItMatters: >-
      These metrics determine whether Flexe's scale signals translate into durable economics or merely high-throughput
      operations.
    diligencePath: Obtain a management KPI pack with gross margin by service line, contribution margin cohorts, CAC payback, and NRR.
    relatedQuestionRefs:
      - QI003
      - QI005
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: capital-structure
    missingEvidence: Primary financing chronology, cap table, and reconciliation of total capital raised.
    whyItMatters: >-
      Public tracker disagreement is large enough to distort dilution, cash runway, and the interpretation of the latest
      financing.
    diligencePath: Reconcile board-approved financing history against signed round documents and the current cap table.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: Current cash balance, monthly burn, debt facilities, working-capital profile, and next-round trigger.
    whyItMatters: Capital adequacy cannot be inferred from stale funding events or headcount proxies alone.
    diligencePath: Request the latest balance sheet, cash flow statement, debt schedule, and 12-month operating plan.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: technical-documentation
    missingEvidence: Public API documentation, schema examples, release notes, or architecture documentation for the Flexe platform.
    whyItMatters: >-
      Without implementation-level artifacts, investors can verify the product surface and workflow claims but cannot
      judge integration depth, change-management rigor, or platform extensibility.
    diligencePath: >-
      Request an architecture walkthrough, API docs, sample payloads, and version/change-log evidence from the product
      and engineering teams.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: security-compliance
    missingEvidence: >-
      Formal security or privacy attestations such as SOC 2, ISO 27001, penetration-test summaries, or public
      incident/postmortem history.
    whyItMatters: >-
      The current evidence set shows operational controls and liability language, but it does not establish formal
      trust, safety, privacy, or security maturity.
    diligencePath: >-
      Obtain the security packet, certification letters, uptime history, and any incident-response or privacy-governance
      documentation.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: minor
    topic: case-study-denominators
    missingEvidence: >-
      Dated full case studies with customer identity, baseline volumes, measurement period, and calculation method for
      the listed outcome metrics.
    whyItMatters: >-
      Headline improvements are directionally helpful, but without denominators they cannot be generalized to forecast
      average customer value creation.
    diligencePath: >-
      Request full case-study decks or reference calls covering at least one fulfillment deployment and one
      network-optimization deployment.
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: NRR, GRR, gross and logo churn, renewal cadence, average contract term, and retention cohorts by customer segment.
    whyItMatters: >-
      Initial deployments can be short-lived projects; retention evidence is necessary to distinguish recurring
      expansion from episodic capacity use.
    diligencePath: >-
      Request account-level retention cohorts, renewal schedules, contract durations, and expansion revenue by product
      and customer segment.
    relatedQuestionRefs:
      - QU009
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-1, top-5, and top-10 customer revenue shares, active customer count, account-level expansion, and
      named-customer contract values.
    whyItMatters: >-
      Named logos and network volume cannot show whether revenue is diversified or dependent on a small number of large
      enterprise programs.
    diligencePath: >-
      Obtain a customer revenue bridge, concentration schedule, cohort expansion table, and current contract status for
      the largest named accounts.
    relatedQuestionRefs:
      - QU010
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-coverage
    missingEvidence: >-
      A complete, current list of production customers with start date, active locations, service line, deployment
      status, and customer-confirmed outcome.
    whyItMatters: >-
      The public sample cannot distinguish active production accounts from historical, limited-scope, or pilot
      relationships.
    diligencePath: >-
      Reconcile management's current customer roster to contracts, invoices, usage records, and direct customer
      references.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Current top-customer revenue share, retention, renewal, and partner-channel concentration cuts.
    whyItMatters: Concentration could turn a demand slowdown or operator issue into a materially worse revenue or margin outcome.
    diligencePath: >-
      Request a current customer concentration table, cohort retention metrics, and top-10 customer exposure from
      finance.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: compliance-and-litigation
    missingEvidence: Independent regulator, court, security, privacy, insurance, or certification documents confirming current posture.
    whyItMatters: Without primary compliance evidence, operator-quality and liability assurances remain mostly company-asserted.
    diligencePath: >-
      Run regulator and court searches, then request SOC, privacy, compliance, and insurance materials plus claims
      history.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: conflicting-data
    severity: material
    topic: capital-structure-and-scale
    missingEvidence: A reconciled cap table, board list, liquidation preferences, and finance-approved headcount plus funding history.
    whyItMatters: Pricing a late-stage logistics platform requires confidence in runway, control, and current operating scale.
    diligencePath: >-
      Request current financing documents, board materials, and a finance-approved KPI pack that reconciles external
      data points.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR001
      - TR003
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: Current cap table, board composition, liquidation preferences, and any 2025-2026 financing or tender documents.
    whyItMatters: >-
      Preference overhang and control rights can materially change common-equity outcomes even if enterprise value looks
      unchanged.
    diligencePath: >-
      Request the latest charter, investor rights summary, board roster, and any recent tender or financing materials
      from management or lead investors.
    relatedQuestionRefs:
      - QV004
      - QV007
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: 2025-2026 revenue bridge, gross margin, contribution margin, retention, and customer concentration data.
    whyItMatters: >-
      Without current unit economics, the 2022 valuation anchor cannot be translated into a defensible present-day entry
      multiple.
    diligencePath: Request monthly management reporting, cohort analysis, and audited or board-level KPI packs for 2025-2026.
    relatedQuestionRefs:
      - QV003
      - QV007
  - type: missing-source
    severity: material
    topic: secondary-liquidity
    missingEvidence: Live secondary indications, a fresh primary round, or comparable current transaction terms.
    whyItMatters: >-
      Entry discipline depends on executable price discovery rather than historical marks that secondary platforms
      themselves qualify heavily.
    diligencePath: >-
      Request current broker indications, recent tender documents, or the latest insider-led financing terms before
      underwriting a return case.
    relatedQuestionRefs:
      - QV001
      - QV002
      - QV005
      - QV008
  - type: missing-source
    severity: minor
    topic: comparable-benchmark
    missingEvidence: A normalized public/private comp sheet matched to asset-light logistics software and warehousing-enablement peers.
    whyItMatters: >-
      Without a comp bridge, the report can frame price discipline directionally but cannot defend a precise valuation
      range.
    diligencePath: >-
      Build a comp set using management-selected peers plus current private-market transactions with normalized growth
      and margin context.
    relatedQuestionRefs:
      - QV007
