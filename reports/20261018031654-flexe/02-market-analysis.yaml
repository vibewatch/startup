      - ["Ecommerce fulfillment", "Pick/pack/ship and near-customer fulfillment capacity", "Marketplace demand generation and owned last-mile networks", "Ecommerce operations, fulfillment, finance", "Important adoption wedge where speed and flexibility matter most"]
      - ["Capacity search and market intelligence", "Spot space search, savings estimation, vacancy and rate benchmarking", "Broker-only lease negotiation without workflow technology", "Network design, procurement, logistics planning", "Explains how Discover and SWI support adoption before a full network commitment"]
    notes: >-
      Combines official product descriptions with independent category classification; rows
      describe workflow boundaries rather than a counted market census.
    claimRefs: [CM001, CM004, CM006, CM007, CM010, CM011]
  - id: TM002
    title: TAM / SAM / SOM or sizing lens table
    columns:
      - Publisher / lens
      - Year
      - Geography
      - Value
      - CAGR / share
      - Methodology / denominator
      - Confidence
      - Limitation
    rows:
      - ["Teardown citing Precedence Research", 2025, "Global", "$147.8B", "~13% CAGR to 2035", "On-demand warehousing category estimate", "Medium", "Publisher-cited third-party estimate; not a Flexe-specific serviceable market"]
      - ["Teardown citing Armstrong & Associates", "2024-2025", "U.S.", "$323B", "~49% warehousing/distribution share of 2024 3PL spend", "Broader U.S. third-party logistics spend pool", "Medium", "Much broader than Flexe's actual product scope and buyer fit"]
      - ["Flexe homepage capacity lens", 2026, "North America", "605M+ sqft", null, "Marketed available capacity across network", "High", "Capacity is not revenue and does not isolate contracted utilization"]
      - ["Flexe network footprint", 2026, "U.S. and Canada", "3,000+ warehouses / 800+ operators", null, "Marketed supply-side footprint", "High", "Counts locations/operators, not spend or buyer penetration"]
      - ["Flexe Spot Warehousing Index snapshot", 2026, "U.S.", "$13.35 per pallet; 4.2% vacancy", "High demand intensity", "Current market benchmark for spot warehousing", "High", "Operating benchmark, not TAM or contracted Flexe revenue"]
    notes: >-
      Lenses mix external market estimates with Flexe's own capacity and benchmark metrics;
      they are directional and not additive into a single SAM/SOM stack.
    claimRefs: [CM006, CM007, CM008, CM009]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - ["High-growth and enterprise brands", "Supply-chain or operations leader", "Shipper operations team", "Central logistics budget", "Multi-node warehousing and distribution rollout", "VP supply chain / COO", "Need to launch capacity quickly without a lease"]
      - ["Ecommerce fulfillment teams", "Ecommerce or fulfillment lead", "Fulfillment managers", "Fulfillment or digital commerce budget", "Near-customer pick/pack/ship", "Head of fulfillment", "Promise faster delivery without building a DC footprint"]
      - ["Peak or overflow planners", "Network planning / procurement", "Warehouse and inventory planners", "Operations / procurement", "Seasonal peaks, excess inventory, short-term storage", "Logistics finance or procurement", "Demand volatility makes fixed commitments inefficient"]
      - ["Warehouse operators in Flexe's network", "Operator management", "Warehouse staff using the platform", "Operator operating budget", "Inventory, order, and warehouse execution inside the shared system", "Operator GM / site leadership", "Need demand access and standardized workflow tooling"]
    notes: >-
      Buyer, user, and payer roles are inferred from official product, FAQ, and fulfillment
      language; public sources do not disclose close-rate or ACV by buyer persona.
    claimRefs: [CM002, CM003, CM004, CM005, CM014]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Broad-to-constrained lenses show a large logistics spend backdrop, but the public
      evidence narrows to Flexe's own network capacity markers rather than a verified SAM.
    data:
      items:
        - label: Broad logistics spend pool
          displayValue: "~$323B U.S. 3PL market (2025)"
          note: Teardown cites Armstrong & Associates for the broader market denominator.
          tone: neutral
        - label: Warehousing-heavy share of 3PL spend
          displayValue: "~49% of 2024 3PL spend"
          note: Value-added warehousing and distribution is cited as the largest 3PL segment.
          tone: neutral
        - label: On-demand warehousing category estimate
          displayValue: "~$147.8B market in 2025"
          note: Teardown cites Precedence Research for the category estimate and ~13% CAGR to 2035.
          tone: neutral
        - label: Flexe marketed available capacity
          displayValue: "605M+ sqft"
          note: Company capacity marker for the current network footprint.
          tone: opportunity
        - label: Flexe active warehouse footprint
          displayValue: "3,000+ warehouses"
          note: Publicly marketed footprint across the network.
          tone: opportunity
        - label: Flexe operator base
          displayValue: "800+ warehouse operators"
          note: Supply-side participation marker rather than a revenue denominator.
          tone: opportunity
    approximationNotes: >-
      Ordered from broad external market lenses to Flexe-specific capacity markers; layers use
      different denominators and units, so they should not be summed or read as a strict TAM/SAM/SOM equation.
    claimRefs: [CM006, CM008, CM009, CM015]
callouts:
  - calloutType: insight
    title: Large category, narrower serviceable market
    body: >-
      The public record supports a large logistics and on-demand warehousing category, but
      Flexe's investable market is narrower: multi-node brands that value speed, flexibility,
      and orchestration enough to avoid fixed leases or owned build-outs.
    claimRefs: [CM004, CM008, CM009, CM015]
  - calloutType: risk
    title: Category growth does not guarantee margin capture
    body: >-
      The same sources that support a large category also highlight the adoption constraint:
      Amazon, large 3PLs, and tech-enabled fulfillment rivals can force pricing pressure or
      win the buyer by controlling more of the physical network.
    claimRefs: [CM012, CM013]
