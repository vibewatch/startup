  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: Independent bottom-up spend or shipment-volume data that maps Flexe's target verticals, geographies, and contract durations to a serviceable market.
      whyItMatters: Without a denominator aligned to actual buyer fit, headline logistics or warehousing TAM figures can overstate valuation upside.
      diligencePath: Request customer mix, ACV, utilization, and revenue by use case and geography, then reconcile those with third-party industrial leasing and 3PL datasets.
      relatedQuestionRefs: [QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-map
      missingEvidence: Win-rate, sales-cycle, and budget-owner evidence showing whether logistics, ecommerce, or procurement teams actually control expansion decisions.
      whyItMatters: Buyer authority determines whether Flexe can expand beyond overflow projects into repeatable network-standard infrastructure.
      diligencePath: Ask management for cohort case studies that include buyer title, ACV, implementation scope, and renewal or expansion behavior by segment.
      relatedQuestionRefs: [QM002, QM006]
      relatedTableRefs: [TM003]
