          note: Third-party records conflict on headcount and business continuity.
          values:
            - label: Medium
              tone: medium
            - label: Medium-High
              tone: high
            - label: Low
              tone: medium
            - label: Medium-High
              tone: high
    approximationNotes: >-
      Qualitative heatmap synthesized from retained source language; it is a prioritization aid,
      not a probability model.
    claimRefs: [CR005, CR006, CR012, CR013, CR015]
callouts:
  - calloutType: risk
    title: Kill criteria before underwriting
    body: >-
      Stop short of price work if management cannot produce current operator-performance
      dashboards, current customer concentration and retention cuts, signed insurance/compliance
      materials, and a reconciled cap table plus funding history. Those items determine whether
      Flexe's asset-light story is resilient or simply opaque.
    claimRefs: [CR003, CR004, CR008, CR010, CR012]
  - calloutType: insight
    title: What would reduce residual risk fastest
    body: >-
      The cleanest de-riskers are primary evidence rather than new marketing claims: current
      warehouse-operator SLA trends, claims history, customer concentration by revenue, and
      board-approved financing or runway materials. If those support the website narrative,
      several current high risks likely fall to medium.
    claimRefs: [CR003, CR004, CR013, CR014]
