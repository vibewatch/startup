      - ["Inventory-loss carve-outs in force-majeure scenarios", "Medium", "High", "Medium", "High", "Need contract review plus insurance evidence by operator tier"]
      - ["Enterprise integration and onboarding complexity", "Medium", "Medium", "Medium", "Medium", "Need implementation timelines, failed deployment rates, and reference calls"]
      - ["Demand normalization and partner-cost inflation", "Medium", "High", "Low-Medium", "High", "Need current utilization, contribution margin, and pricing power evidence"]
    notes: >-
      Residual ratings reflect a mix of company-stated mitigations and adverse third-party risk
      cues; there is no independent public SLA or incident dataset in the retained evidence.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - ["Warehouse operator network", "3PL / warehouse operators", "Capacity, labor, service delivery", "High operational dependency", "Service inconsistency, insurance disputes, or cost inflation degrade customer experience", "High", "Platform monitoring, site visits, partner vetting, and operator insurance", "High"]
      - ["Enterprise shipper demand", "Large shippers / retailers", "Volume and revenue quality", "Unknown customer concentration", "Demand slowdown or delayed enterprise wins weaken utilization and revenue quality", "High", "Case studies, ROI framing, flexible pricing, and the 80/20 hedge narrative", "Medium-High"]
      - ["Capital providers and future financing", "Existing investors / new capital", "Runway and strategic flexibility", "Public financing visibility is partial", "If growth or margins disappoint, valuation reset or financing friction could constrain options", "Medium-High", "Past venture backing and the asset-light model reduce fixed-asset burden", "Medium-High"]
    notes: >-
      Concentration and residual exposure are directional because retained public sources do not
      disclose customer concentration, operator concentration, covenant terms, or preference stack.
    claimRefs: [CR005, CR006, CR007, CR008, CR010, CR014, CR015]
