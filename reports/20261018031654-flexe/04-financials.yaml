  evidenceGaps:
    - type: missing-source
      severity: material
      topic: realized-pricing
      missingEvidence: Customer contract pricing waterfalls, fee schedules, minimums, rebates, and service-line mix.
      whyItMatters: Realized pricing determines revenue quality, gross margin potential, and whether usage volatility is a feature or a risk.
      diligencePath: Request current standard order forms, three anonymized customer contracts, and realized pricing by product line.
      relatedQuestionRefs: [QI001, QI002]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin, contribution margin, CAC payback, retention, and service-line profitability.
      whyItMatters: These metrics determine whether Flexe's scale signals translate into durable economics or merely high-throughput operations.
      diligencePath: Obtain a management KPI pack with gross margin by service line, contribution margin cohorts, CAC payback, and NRR.
      relatedQuestionRefs: [QI003, QI005]
      relatedTableRefs: [TI003]
    - type: conflicting-data
      severity: material
      topic: capital-structure
      missingEvidence: Primary financing chronology, cap table, and reconciliation of total capital raised.
      whyItMatters: Public tracker disagreement is large enough to distort dilution, cash runway, and the interpretation of the latest financing.
      diligencePath: Reconcile board-approved financing history against signed round documents and the current cap table.
      relatedQuestionRefs: [QI006, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: liquidity
      missingEvidence: Current cash balance, monthly burn, debt facilities, working-capital profile, and next-round trigger.
      whyItMatters: Capital adequacy cannot be inferred from stale funding events or headcount proxies alone.
      diligencePath: Request the latest balance sheet, cash flow statement, debt schedule, and 12-month operating plan.
      relatedQuestionRefs: [QI008]
