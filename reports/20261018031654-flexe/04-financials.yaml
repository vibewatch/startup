  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / signal
      - Public price / unit
      - What it indicates
      - Limitation
      - Source posture
    rows:
      - [Spot Warehousing Index, "$13.35 / pallet", Company publishes a current benchmark for short-term spot warehousing, Benchmark is not realized Flexe revenue or realized customer pricing, Company-controlled benchmark]
      - [Flexible warehousing infrastructure, Transactional pricing / pay only for what is used, Variable-cost selling motion versus fixed leased square footage, No public contract schedule or minimum commitment terms, Company-controlled description]
      - [Fulfillment solution, Pay per unit not per square foot, Revenue can scale with handled volume instead of facility footprint, "Public sources do not disclose fees, rebates, or penalties", Company-controlled description]
      - [Commercial commitment profile, Zero long-term commitments / no fixed-term agreements, Lowers customer lock-in and makes demand more usage-sensitive, "Churn, retention, and renewal structure are not public", Company-controlled description]
    notes: This table captures list-model pricing signals and market benchmarks only; none of these rows proves realized take rate, gross margin, or contract economics.
    enumerationScope:
      coverage: partial
      basis: Pricing language and benchmark values visible on retained company-controlled pages, not customer contracts.
    claimRefs: [CI001, CI002, CI003, CI006]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Annual revenue estimate, "$91.1M (LATKA Dec 2024, source not recorded) to $97.1M (CompWorth estimate)", Medium, Anchors scale but not audited revenue quality, Audited 2024 and 2025 revenue plus mix bridge]
      - [Revenue per employee proxy, "$327.9K estimate", Low, Rough operating-leverage signal, Actual gross margin and opex by function]
      - [Aggregate funding reported by trackers, "$187M to $263M, with a third estimate at $211.9M", Low, Funding raised is not cash available and the disagreement weakens runway analysis, Board-approved financing chronology and cap table]
      - [Current headcount proxy, "156 mapped employees (Dealroom) vs 201 employees (LATKA Nov 2025); CompWorth reports a 45% annual decline", Low, "Can indicate burn control, demand pressure, or measurement differences", Monthly headcount and restructuring history]
      - [Gross margin / CAC payback / NRR / cash runway, Undisclosed publicly, Low, Core underwriting metrics remain missing, "Service-line margin stack, retention, CAC payback, cash balance, burn, and debt"]
    notes: Public third-party metrics are estimates or tracker readings rather than audited company disclosures; undisclosed rows are explicit diligence blockers rather than assumed zeros.
    enumerationScope:
      coverage: partial
      basis: Public estimate pages and company-owned surfaces retained in this chapter; no management data room inputs are included.
    claimRefs: [CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence supports a usage-based logistics revenue loop, but not the margin or take-rate detail needed to underwrite it.
    data:
      nodes:
        - id: demand
          label: Demand variability
          detail: Seasonal peaks, overflow inventory, and regional expansion create short-duration warehouse demand.
          tone: neutral
        - id: discover
          label: Discover + SWI
          detail: Flexe publishes search, cost-estimation, and benchmark tools, including a $13.35 per-pallet SWI signal.
          tone: neutral
        - id: network
          label: 800+ operator network
          detail: Customers search across 3,000+ locations and contract against available capacity instead of fixed owned sites.
          tone: positive
        - id: usage
          label: Transactional spend
          detail: Pay-as-you-go and no-long-term-commitment terms turn storage and fulfillment usage into revenue events.
          tone: positive
        - id: service
          label: Platform + logistics team
          detail: API, EDI, XML, reporting, and day-to-day orchestration add software and service value around the network.
          tone: neutral
        - id: margin
          label: Revenue quality unknown
          detail: Public sources show scale and list pricing, but realized take rate, gross margin, retention, and cash efficiency remain undisclosed.
          tone: risk
      edges:
        - from: demand
          to: discover
          label: Estimate where short-term capacity is needed
        - from: discover
          to: network
          label: Search benchmarked capacity and operators
        - from: network
          to: usage
          label: Convert matched capacity into usage-based charges
        - from: usage
          to: service
          label: Add execution, reporting, and support layers
        - from: service
          to: margin
          label: Underwriting still depends on undisclosed margin data
    approximationNotes: The flow describes the public commercial logic only; it is not a quantified margin waterfall.
    claimRefs: [CI001, CI002, CI003, CI004, CI006, CI014]
