      - ["Saltbox", "Co-warehousing / managed small-suite alternative", "11+ U.S. locations", "Growth-stage ecommerce brands that want direct control of their own suite", "Private suites, daily carrier pickups, on-demand labor, and entry memberships from $99/month", "Smaller footprint and SMB orientation make it an incomplete substitute for enterprise multi-node orchestration"]
      - ["Portal Warehousing", "Small-suite warehouse substitute", "7 U.S. cities", "Operators needing turnkey 100-4,000 sq. ft. space", "Private units, offices, docks, and published entry pricing from $995/month", "Geography and service model are much narrower than Flexe's enterprise network claims"]
      - ["Flowspace", "Outsourced fulfillment network", "150+ U.S. and Canada centers", "Brands needing mixed DTC and B2B fulfillment", "Relevant when the brief mixes consumer and wholesale flows", "Assigned evidence does not provide public pricing or proof that it solves self-managed storage use cases"]
      - ["ShipBob", "Outsourced ecommerce fulfillment", "Network scale not quantified in assigned pool", "Standard ecommerce fulfillment comparison set", "Relevant for parcel fulfillment and order-management workflows", "Not evidenced in the pool as a direct answer for seasonal storage or warehouse control"]
      - ["Flexport", "Broader logistics plus fulfillment", "Network scale not quantified in assigned pool", "Buyers coordinating inbound logistics with fulfillment", "Useful when the warehouse decision is tied to freight and inbound coordination", "Assigned evidence does not show that it matches Flexe on elastic overflow capacity"]
    notes: >-
      Partial landscape based only on successful prefetched URLs assigned to this chapter; rows
      compare the most explicitly named alternatives in those sources, and "not quantified"
      means the assigned pool did not provide a source-backed public number.
    enumerationScope:
      coverage: partial
      basis: >-
        Limited to alternatives and competitor classes explicitly named in the assigned
        prefetched sources for the 2026-10-18 run, rather than an exhaustive industry census.
    claimRefs: [CP001, CP002, CP006, CP007, CP009, CP010, CP011, CP012, CP015]
