    rows:
      - ["Direct warehouse access", "Coordinated in advance through Flexe logistics team", "Members can walk into their suite anytime", "Unknown in assigned pool", "Unknown in assigned pool", "Private warehouse unit model implies direct operator access", "Flexe trades hands-on control for managed network operations"]
      - ["Network breadth", "800+ operators and 3,000+ locations", "11+ locations", "150+ centers", "Unknown in assigned pool", "7 cities", "Flexe leads on breadth within the assigned evidence"]
      - ["Integration / orchestration", "API, EDI, or XML single integration plus WMS/OMS/IMS", "Not presented as a network orchestration layer", "Fulfillment provider shortlist only", "Fulfillment and inventory software noted", "Not presented as orchestration software", "Flexe differentiates most clearly when integration and multi-site control matter"]
      - ["Primary job to be done", "Elastic warehousing, distribution, and fulfillment across third-party operators", "Private suite plus optional labor and shipping support", "Mixed DTC and B2B outsourced fulfillment", "Standard ecommerce fulfillment", "Turnkey small warehouse space", "The real comparison depends on whether the buyer wants a network, a 3PL, or a private suite"]
      - ["Pricing transparency", "Transactional model claimed, but no public comparable quote", "Membership access from $99/month and warehouse ranges disclosed", "Custom quote requested", "Custom quote requested", "Starts from $995/month", "Transparent entry pricing is stronger among small-suite substitutes than among network providers"]
      - ["Best-fit customer size", "Mid-market and enterprise brands", "Growth-stage ecommerce founders and smaller operators", "Mixed channel brands", "Ecommerce brands", "Small warehouse users", "Saltbox and Portal undercut Flexe at the low end rather than matching it feature for feature"]
    notes: >-
      Cells marked "unknown" mean the assigned source pool did not contain supportable public
      evidence for that exact criterion; matrix judgments compare what the sources explicitly
      describe rather than inferring missing capabilities.
    claimRefs: [CP002, CP004, CP005, CP007, CP008, CP010, CP011, CP012, CP013, CP014]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Provider
      - Public pricing signal
      - Contract / packaging signal
      - Included capability signal
      - Key unknown or implication
    rows:
      - ["Flexe", "No public like-for-like price in assigned pool; custom contact required", "Pay-as-you-go / transactional and no long-term commitments", "Distribution, inventory, fulfillment, and spot-capacity data", "Commercial fit still requires an account-specific quote and facility assignment"]
      - ["Saltbox", "Access plans from $99/month; suite sizes and services described publicly", "Monthly billing and no long-term lease required", "Private suites, offices, on-demand labor, pickups, shipping support", "Much clearer entry pricing, but tailored to smaller self-managed operations"]
      - ["Portal Warehousing", "Starts from $995/month", "Turnkey small-space package", "Units, offices, docks, carrier pickups", "Useful benchmark for small-space transparency, not for enterprise network economics"]
      - ["Flowspace", "Request facility, channel, integration, and peak-volume terms", "Proposal-driven", "DTC and B2B fulfillment with warehouse and order software", "The pool supports relevance, not an apples-to-apples price comparison"]
      - ["ShipBob", "Custom quote requested", "Proposal-driven", "Ecommerce fulfillment and inventory distribution", "Assigned evidence does not support whether its economics beat Flexe for overflow storage"]
      - ["Flexport", "Proposal for routes, inventory, and delivery requirements", "Proposal-driven", "Fulfillment within a wider logistics offering", "Potentially stronger when freight and inbound coordination matter, but the pool provides no public price proof"]
    notes: >-
      This is a public-signal comparison, not a realized-cost benchmark; every third-party guide
      in the assigned evidence recommends like-for-like quoting because provider descriptions do
      not establish actual account pricing, minimums, or SLA penalties.
    claimRefs: [CP003, CP007, CP010, CP011, CP012, CP013]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Evidence-backed ordinal map showing where Flexe sits between high-breadth outsourced
      networks and high-control small-suite substitutes.
    data:
      xAxis:
        label: Operational control / warehouse access
        min: 1
        max: 5
        low: Outsourced or indirect control
        high: Hands-on or private-suite control
        description: Ordinal score derived from cited public service descriptions.
        scale: ordinal
      yAxis:
        label: Scope breadth / network reach
        min: 1
        max: 5
        low: Narrow local footprint
        high: Broad multi-node network
        description: Ordinal score derived from cited public scale and use-case claims.
        scale: ordinal
      points:
        - label: Flexe
          x: 2
          y: 5
          detail: Managed access model with 800+ operators, 3,000+ locations, and centralized orchestration.
        - label: Saltbox
          x: 5
          y: 2
          detail: Private suite control and transparent entry pricing for smaller ecommerce operators.
        - label: Portal Warehousing
          x: 5
          y: 2
          detail: Turnkey 100-4,000 sq. ft. suites with published entry pricing in seven cities.
        - label: Flowspace
          x: 2
          y: 4
          detail: Outsourced DTC and B2B fulfillment alternative with broader network logic than co-warehousing.
        - label: ShipBob
          x: 2
          y: 4
          detail: Standard ecommerce fulfillment network in the outsourced-3PL comparison set.
        - label: Flexport
          x: 2
          y: 4
          detail: Broader logistics-plus-fulfillment option when inbound coordination matters.
    approximationNotes: >-
      Ordinal positions synthesize cited public descriptions of facility access, network breadth,
      and service scope; they are comparative heuristics, not measured benchmark scores.
    claimRefs: [CP002, CP005, CP007, CP008, CP009, CP010, CP011, CP014]
callouts:
  - calloutType: risk
    title: Transparent entry pricing is where lower-end substitutes attack
    body: >-
      The strongest displacement signal in the assigned evidence is not a better enterprise
      network than Flexe's; it is a simpler value proposition for operators that want a
      warehouse they can access directly and budget from public entry prices.
    claimRefs: [CP008, CP012, CP014]
  - calloutType: insight
    title: Fulfillment rivals and co-warehousing rivals solve different buyer jobs
    body: >-
      Flowspace, ShipBob, and Flexport matter when the buyer wants outsourced fulfillment or
      inbound-logistics coordination, while Saltbox and Portal Warehousing matter when the buyer
      wants direct control over a smaller physical footprint.
    claimRefs: [CP009, CP010, CP011]
