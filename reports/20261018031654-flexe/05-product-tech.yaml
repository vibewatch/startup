callouts:
  - calloutType: "strength"
    title: "Asset-light orchestration is the clearest product edge"
    body: "Flexe's strongest public differentiation is packaging network capacity, integration, and operating support into a variable-cost alternative to fixed warehousing rather than competing as an owned-asset operator."
    claimRefs: ["CE001", "CE003", "CE004", "CE005"]
  - calloutType: "risk"
    title: "Technical proof remains shallow for underwriting"
    body: "Public evidence shows what Flexe says the platform does, but not the implementation depth an investor would want around API maturity, uptime history, security attestations, or release cadence."
    claimRefs: ["CE012"]
