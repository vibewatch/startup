    columns:
      - "Module / product line"
      - "Primary user"
      - "Status / maturity"
      - "Differentiation"
      - "Diligence gap"
    rows:
      - ["Flexible Warehousing Infrastructure", "Enterprise supply-chain and logistics teams", "Commercial / flagship offer", "Asset-light access to 3,000+ warehouses with pay-as-you-go economics and no long-term commitment", "Need customer cohort data on implementation time, repeat usage, and realized savings"]
      - ["Discover", "Network planners and logistics managers", "Commercial / self-serve surface", "Search, pricing, ROI estimation, and market-intelligence workflow before committing to a solution", "No public usage, conversion, or accuracy metrics for the search and pricing tools"]
      - ["Fulfillment", "eCommerce and omnichannel operators", "Commercial / named solution page", "Single integration, WMS/OMS/IMS positioning, and dedicated analyst support for fulfillment execution", "No public SLA, pick-pack error rate, or on-time shipment distribution"]
      - ["Distribution / Capacity", "Shippers needing overflow, peak, or network reconfiguration", "Commercial / named solution family", "Uses third-party operator network to add or remove nodes without CapEx or long leases", "No public facility-level capability map, operator mix, or onboarding failure data"]
    notes: "Public product-surface synthesis; rows describe marketed modules, not independently audited SKU usage or deployment share."
    claimRefs: ["CE001", "CE004", "CE005", "CE006"]
  - id: "TE002"
    title: "Workflow / use-case table"
    columns:
      - "User job"
      - "Current workflow pain"
      - "Flexe solution"
      - "Measurable benefit"
      - "Limitation"
    rows:
      - ["Handle seasonal or overflow inventory", "Fixed leases and broker-led spot searches leave capacity mismatched to demand", "On-demand warehouse capacity with transactional pricing and a large operator network", "Ability to add or remove warehouse locations without fixed-term agreements", "No public distribution of realized savings or ramp-failure rates"]
      - ["Launch or expand eCommerce fulfillment", "Building owned or tightly contracted nodes takes time and capital", "Dedicated fulfillment program with one integration and managed operations", "Lull teaser claims 51% faster delivery and 30% lower FedEx costs", "Company-issued teaser; no dated baseline, volume context, or method disclosed on the listing page"]
      - ["Improve delivery promise and geographic reach", "Inventory positioned too far from end customers increases transit time and abandonment", "Flexible multi-node warehousing and fulfillment placement", "Skincare teaser claims 90% next-day delivery and 25% lower cart abandonment", "Customer is unnamed on the hub page and broader replication data is absent"]
      - ["Research markets before a long-term commitment", "Static lease comps and manual RFPs are slow and hard to compare", "Discover, ROI calculator, and Spot Warehousing Index for search, pricing, and market context", "Faster site shortlist and directional rate context before network changes", "No public evidence on forecast accuracy, usage penetration, or downstream win rate"]
    notes: "Measurable benefits are mostly company-issued teaser claims and should be treated as directional until dated case-study details are produced."
    claimRefs: ["CE001", "CE005", "CE006", "CE008"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process"
      - "Role"
      - "Publicly described components"
      - "Key dependency"
      - "Risk"
    rows:
      - ["Integration control plane", "Move shipper and operator data into a standardized workflow", "API, EDI, XML, and CSV/manual data-sharing options", "Customer system-of-record quality and mapping discipline", "Public sources do not show API docs, schemas, or change-management practices"]
      - ["Core Flexe platform", "Coordinate day-to-day inventory, order, and warehouse execution", "Inventory, order, and warehouse management plus analytics and reporting", "Stable shared data model across warehouses and programs", "Public evidence is high-level and does not verify architecture depth or release discipline"]
      - ["Market-intelligence layer", "Inform network design and short-term warehousing decisions", "Discover, Spot Warehousing Index, ROI calculator, market insights", "Proprietary bid data and third-party market inputs", "Methodology and predictive accuracy are not disclosed in public evidence"]
      - ["Operator network", "Execute storage, fulfillment, and distribution in physical facilities", "800+ operators, 3,000+ locations, capability matching", "Warehouse capacity availability and operator execution quality", "Facility-level performance heterogeneity is not quantified publicly"]
      - ["Service and governance layer", "Onboard, troubleshoot, escalate issues, and standardize operations", "Dedicated Logistics Analyst, KPI tracking, service-level management, site visits, audits, liability rules", "Operational staffing depth and playbooks", "Support quality appears central to the model but is not independently benchmarked"]
    notes: "Architecture is reconstructed from product surfaces and third-party catalogs; this is an operating-model view, not a verified system diagram."
    claimRefs: ["CE003", "CE004", "CE006", "CE007", "CE009", "CE012"]
