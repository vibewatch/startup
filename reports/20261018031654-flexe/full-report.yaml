  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              The core market boundary is flexible warehousing infrastructure: short-duration storage, distribution, and
              fulfillment that can be turned on quickly, paid for transactionally, and managed through a shared software
              layer instead of a dedicated leased building. Flexe's official positioning is explicit that the offer is
              asset-light, pay-as-you-go, and designed to avoid the fixed-cost burden of long-term warehouse
              commitments. That places the company inside warehousing services rather than pure supply-chain software,
              which is consistent with IncFact's NAICS 49311 classification. The most relevant buyer is a logistics or
              supply-chain team that needs capacity, fulfillment reach, or overflow coverage across North America; the
              operational users include shippers, warehouse operators, and Flexe's own logistics analysts inside a
              single integration workflow. Public customer proof points suggest that the status-quo substitute is not
              "any logistics software," but a combination of leased space, fragmented 3PL relationships, and ad hoc
              peak-season workarounds.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM007
              - CM010
              - CM011
          - type: table
            tableRef: TM003
