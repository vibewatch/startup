chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Flexe was founded in 2013 and is headquartered in Seattle. The company describes its product as flexible
              warehousing infrastructure: enterprises obtain variable warehouse capacity and operating services while
              using Flexe's technology to coordinate inventory, orders, and warehouse workflows. That positioning is
              more specific than a simple property marketplace. Flexe says a single integration opens access to more
              than 800 warehouse operators across the United States and Canada, while its current homepage advertises
              more than 3,000 on-demand warehouses. Independent industry commentary similarly describes the model as
              converting warehouse space from owned or leased infrastructure into variable capacity, although that
              commentary does not independently audit Flexe's current network counts.
