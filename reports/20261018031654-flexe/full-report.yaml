  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise shippers are the stated target, but the demand denominator is opaque
        blocks:
          - type: paragraph
            body: >-
              Flexe explicitly targets high-growth and enterprise companies and identifies retail, consumer goods, food
              and beverage, and industrial and manufacturing as served industries. The customer proposition is built
              around variable capacity: companies can add space for seasonal peaks, excess inventory, regional tests, or
              disruptions without committing to another long-term lease. Public material names logistics leaders and
              shippers as users, but it does not disclose who signs each type of contract, segment-level revenue, or the
              number of active accounts. Dealroom's web-traffic estimate is concentrated in the United States and
              Canada, yet website traffic is only an audience proxy and cannot establish the geographic mix of paying
              customers.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU014
