  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence supports a six-stage path from a capacity trigger through network expansion, while retention and
      concentration remain unquantified.
    data:
      items:
        - label: Capacity trigger
          detail: >-
            Demand volatility, seasonal inventory, a disruption, or a regional test creates a short-term warehousing
            need.
          touchpoints:
            - seasonal peak
            - excess inventory
            - market-entry test
        - label: Capacity discovery
          detail: Shippers search location, capability, market rates, and vacancy signals before committing.
          touchpoints:
            - Flexe Discover
            - Spot Warehousing Index
            - operator search
        - label: Solution design
          detail: Project goals, expected volumes, and workflow requirements determine the proposed network.
          touchpoints:
            - logistics analyst
            - site and capability match
            - transactional pricing
        - label: Systems connection
          detail: The customer connects through API, EDI, XML, or manual CSV sharing.
          touchpoints:
            - API
            - EDI or XML
            - CSV
        - label: Launch and operate
          detail: Flexe advertises sub-30-day average go-live and monitors operator performance across the network.
          touchpoints:
            - onboarding
            - inventory tracking
            - quality metrics
        - label: Expand or release capacity
          detail: Customers can add or remove nodes as demand changes instead of signing another multi-year lease.
          touchpoints:
            - additional locations
            - new use cases
            - capacity release
          note: Public evidence does not quantify renewal, NRR, or expansion by cohort.
    approximationNotes: >-
      The stages synthesize the supported operating sequence; they are not a measured conversion funnel, and no
      conversion rates are implied.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
      - CU013
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual severity stays highest in operator-quality variance, market sensitivity, and capital-structure opacity
      even after visible website-level mitigations.
    data:
      columns:
        - label: Likelihood
          detail: Residual likelihood based on retained public evidence.
        - label: Impact
          detail: Downside severity if the risk crystallizes.
        - label: Mitigation maturity
          detail: Publicly evidenced mitigation quality, not management intent.
        - label: Residual severity
          detail: Underwriting concern after visible mitigations.
      rows:
        - label: Operator-quality variance
          note: Distributed third-party execution is central to the model.
          values:
            - label: High
              tone: high
            - label: High
              tone: high
            - label: Medium
              tone: medium
            - label: High
              tone: high
        - label: Force-majeure inventory liability
          note: Customer liability carve-out survives despite operator insurance.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Medium
              tone: medium
            - label: High
              tone: high
        - label: Enterprise demand slowdown
          note: Adverse narrative ties 2024 downsizing to softer demand and competition.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Low-Medium
              tone: warning
            - label: High
              tone: high
        - label: Margin compression / partner cost inflation
          note: External SWOT cites partner labor and real-estate cost pressure.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Low-Medium
              tone: warning
            - label: High
              tone: high
        - label: Capital-structure opacity
          note: Public cap-table visibility and current financing terms remain partial.
          values:
            - label: Medium
              tone: medium
            - label: High
              tone: high
            - label: Low
              tone: medium
            - label: High
              tone: high
        - label: Public-data inconsistency
          note: Third-party records conflict on headcount and business continuity.
          values:
            - label: Medium
              tone: medium
            - label: Medium-High
              tone: high
            - label: Low
              tone: medium
            - label: Medium-High
              tone: high
    approximationNotes: >-
      Qualitative heatmap synthesized from retained source language; it is a prioritization aid, not a probability
      model.
    claimRefs:
      - CR005
      - CR006
      - CR012
      - CR013
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays at track because current operating proof is visible but price discovery and structure
      evidence are incomplete.
    data:
      nodes:
        - id: scale
          label: Operating scale still visible
          detail: Official materials continue to cite 800+ operators and 3,000+ locations.
          tone: positive
        - id: model
          label: Asset-light model still attractive
          detail: Transactional capacity, no customer CapEx, and launch-in-weeks deployment support commercialization speed.
          tone: positive
        - id: anchor
          label: Public valuation anchor is stale
          detail: Public price evidence still centers on the 2022 Series D / unicorn mark.
          tone: warning
        - id: quality
          label: Current proof quality is mixed
          detail: Revenue and headcount datapoints exist, but key economics remain unverified in public.
          tone: warning
        - id: structure
          label: Liquidity and preference overhang remain unclear
          detail: Secondary platforms stress illiquidity, and public cap-table data is only indicative.
          tone: adverse
        - id: call
          label: 'Recommendation: track'
          detail: Advance only after fresh round terms, live pricing, and current unit economics are reviewed.
          tone: adverse
      edges:
        - from: scale
          to: model
          label: supports thesis
        - from: model
          to: anchor
          label: but does not reset price
        - from: anchor
          to: quality
          label: needs current proof
        - from: quality
          to: structure
          label: and better transparency
        - from: structure
          to: call
          label: so entry stays disciplined
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
