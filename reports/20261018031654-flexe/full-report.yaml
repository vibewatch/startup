      - number: '6.2'
        title: Network breadth and implementation speed support tactical adoption
        blocks:
          - type: paragraph
            body: >-
              The clearest current adoption surface is supply-side breadth rather than a disclosed customer count. Flexe
              says shippers can search more than 800 operators and 3,000 locations and advertises average go-live in
              under 30 days. A secondary business breakdown reports that the platform handled more than 14 million
              orders and supported more than 3,000 new fulfillment nodes in 2022, but those historical figures are not
              corroborated by a primary customer source in the assigned evidence. The single-integration model supports
              repeat deployment across nodes, while the Spot Warehousing Index gives buyers a market-timing input.
              Together these features make first use and network expansion plausible; they do not reveal utilization,
              repeat purchase, or account-level growth.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU012
              - CU013
