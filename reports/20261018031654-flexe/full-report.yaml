      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The current capital picture is materially underdetermined by public evidence. Aggregate funding totals
              range from $187M at FundedIQ to $211.9M at LATKA and $263M at CompWorth; the round-by-round chronology
              belongs in Company Overview, while this chapter treats the disagreement as an input-quality problem for
              forward underwriting. Those differences are too large to ignore because funding raised is not cash
              available and none of the trackers discloses current liquidity. Headcount proxies also point to a leaner
              organization: LATKA cites 201 employees in November 2025, Dealroom maps 156 employees on its public
              profile, and CompWorth reports a 45% year-over-year decline. These signals could reflect burn control,
              demand pressure, or measurement differences. Without public cash, accounting loss, cash burn, debt, or
              working-capital disclosure, the next financing trigger remains an unanswered diligence item.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The public case for Flexe is strongest on model clarity and network scale: the company clearly markets a
              transactional, flexible-capacity offer and independent trackers still place the business at meaningful
              revenue scale. The weakest areas are the ones that matter most to an investment case: realized pricing,
              service-line gross margin, customer economics, and current liquidity. Conflicting third-party funding
              totals and thin adverse evidence do not prove distress, but they do show that the public record is noisy
              enough that capital adequacy cannot be inferred safely. Financially, the business reads as potentially
              valuable but not publicly underwritable without primary diligence on margins, cash, and financing history.
            claimRefs:
              - CI003
              - CI007
              - CI008
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Flexe's public positioning is centered on flexible warehousing as a workflow and cost model rather than on
              a single software SKU. The homepage and FAQ both frame the offer as asset-light access to 3,000+
              warehouses with pay-as-you-go economics and no long-term commitments, while the broader solutions surface
              breaks that offer into distribution, fulfillment, capacity, and Discover/market-intelligence entry points.
              That matters because it suggests Flexe sells a bundled operating model: warehousing capacity,
              orchestration software, and managed logistics       support. Third-party profiles and a teardown broadly
              echo that market position, but they do not replace the need for customer-level proof on actual deployment
              breadth by segment or use case.
