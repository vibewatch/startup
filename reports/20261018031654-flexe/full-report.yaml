      - number: '3.2'
        title: >-
          Flexe competes on network breadth and orchestration, while alternatives specialize around control or
          fulfillment motion
        blocks:
          - type: paragraph
            body: >-
              Flexe's public positioning emphasizes a large multi-node network, one-to-many integrations, and a managed
              operating layer rather than physical warehouse ownership by the customer. The official pages describe
              800-plus operators, 3,000-plus locations, API/EDI/XML connectivity, and a dedicated logistics-analyst
              control tower. That package compares well when the buyer needs overflow capacity, omnichannel
              distribution, or a single orchestration layer across multiple third-party sites. The substitutes
              highlighted in the pool lean the other way: Saltbox and Portal Warehousing focus on private suites and
              direct facility access, while Forthmatch places ShipBob, Flowspace, and Flexport into an outsourced
              fulfillment shortlist where the evaluation turns on retail and parcel workflows, inbound logistics
              coordination, and inventory placement rather than on-demand overflow warehousing alone.
