        title: Public traction proxies and unit-economics limits
        blocks:
          - type: paragraph
            body: >-
              Public scale signals are directionally meaningful but still weak for underwriting. Flexe claims 3,000+
              warehouses, 800+ operators, 605M+ square feet, and sub-30-day go-live time, which indicates broad network
              breadth and enterprise readiness. External estimate sites place annual revenue around $91.1M to $97.1M,
              but one page explicitly says its revenue source is not recorded and another labels its figure an estimate.
              Company-issued case studies add customer-outcome evidence, including a claim that Lull reduced delivery
              times by 51% and FedEx costs by 30%, but they do not disclose contract value or Flexe's margin. CompWorth
              also estimates revenue per employee at $327.9K, yet that is only a proxy because public sources still do
              not disclose gross margin, contribution margin, CAC payback, retention, or service-line profitability. The
              result is a credible scale signal with insufficient unit-economics transparency.
