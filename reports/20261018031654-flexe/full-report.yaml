  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Broad-to-constrained lenses show a large logistics spend backdrop, but the public evidence narrows to Flexe's own
      network capacity markers rather than a verified SAM.
    data:
      items:
        - label: Broad logistics spend pool
          displayValue: ~$323B U.S. 3PL market (2025)
          note: Teardown cites Armstrong & Associates for the broader market denominator.
          tone: neutral
        - label: Warehousing-heavy share of 3PL spend
          displayValue: ~49% of 2024 3PL spend
          note: Value-added warehousing and distribution is cited as the largest 3PL segment.
          tone: neutral
        - label: On-demand warehousing category estimate
          displayValue: ~$147.8B market in 2025
          note: Teardown cites Precedence Research for the category estimate and ~13% CAGR to 2035.
          tone: neutral
        - label: Flexe marketed available capacity
          displayValue: 605M+ sqft
          note: Company capacity marker for the current network footprint.
          tone: opportunity
        - label: Flexe active warehouse footprint
          displayValue: 3,000+ warehouses
          note: Publicly marketed footprint across the network.
          tone: opportunity
        - label: Flexe operator base
          displayValue: 800+ warehouse operators
          note: Supply-side participation marker rather than a revenue denominator.
          tone: opportunity
    approximationNotes: >-
      Ordered from broad external market lenses to Flexe-specific capacity markers; layers use different denominators
      and units, so they should not be summed or read as a strict TAM/SAM/SOM equation.
