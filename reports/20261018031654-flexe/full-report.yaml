      - CM006
      - CM008
      - CM009
      - CM015
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Evidence-backed ordinal map showing where Flexe sits between high-breadth outsourced networks and high-control
      small-suite substitutes.
    data:
      xAxis:
        label: Operational control / warehouse access
        min: 1
        max: 5
        low: Outsourced or indirect control
        high: Hands-on or private-suite control
        description: Ordinal score derived from cited public service descriptions.
        scale: ordinal
      yAxis:
        label: Scope breadth / network reach
        min: 1
        max: 5
        low: Narrow local footprint
        high: Broad multi-node network
        description: Ordinal score derived from cited public scale and use-case claims.
        scale: ordinal
      points:
        - label: Flexe
          x: 2
          'y': 5
          detail: Managed access model with 800+ operators, 3,000+ locations, and centralized orchestration.
        - label: Saltbox
          x: 5
          'y': 2
          detail: Private suite control and transparent entry pricing for smaller ecommerce operators.
        - label: Portal Warehousing
          x: 5
          'y': 2
          detail: Turnkey 100-4,000 sq. ft. suites with published entry pricing in seven cities.
        - label: Flowspace
          x: 2
          'y': 4
          detail: Outsourced DTC and B2B fulfillment alternative with broader network logic than co-warehousing.
        - label: ShipBob
          x: 2
          'y': 4
          detail: Standard ecommerce fulfillment network in the outsourced-3PL comparison set.
        - label: Flexport
          x: 2
          'y': 4
          detail: Broader logistics-plus-fulfillment option when inbound coordination matters.
    approximationNotes: >-
      Ordinal positions synthesize cited public descriptions of facility access, network breadth, and service scope;
      they are comparative heuristics, not measured benchmark scores.
    claimRefs:
      - CP002
      - CP005
      - CP007
      - CP008
      - CP009
      - CP010
      - CP011
      - CP014
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a usage-based logistics revenue loop, but not the margin or take-rate detail needed to
      underwrite it.
    data:
      nodes:
        - id: demand
          label: Demand variability
          detail: Seasonal peaks, overflow inventory, and regional expansion create short-duration warehouse demand.
          tone: neutral
        - id: discover
          label: Discover + SWI
          detail: Flexe publishes search, cost-estimation, and benchmark tools, including a $13.35 per-pallet SWI signal.
          tone: neutral
        - id: network
          label: 800+ operator network
          detail: >-
            Customers search across 3,000+ locations and contract against available capacity instead of fixed owned
            sites.
          tone: positive
        - id: usage
          label: Transactional spend
          detail: Pay-as-you-go and no-long-term-commitment terms turn storage and fulfillment usage into revenue events.
          tone: positive
        - id: service
          label: Platform + logistics team
          detail: API, EDI, XML, reporting, and day-to-day orchestration add software and service value around the network.
          tone: neutral
        - id: margin
          label: Revenue quality unknown
          detail: >-
            Public sources show scale and list pricing, but realized take rate, gross margin, retention, and cash
            efficiency remain undisclosed.
          tone: risk
      edges:
        - from: demand
          to: discover
          label: Estimate where short-term capacity is needed
        - from: discover
          to: network
          label: Search benchmarked capacity and operators
        - from: network
          to: usage
          label: Convert matched capacity into usage-based charges
        - from: usage
          to: service
          label: Add execution, reporting, and support layers
        - from: service
          to: margin
          label: Underwriting still depends on undisclosed margin data
    approximationNotes: The flow describes the public commercial logic only; it is not a quantified margin waterfall.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI006
      - CI014
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence describes Flexe as an orchestration stack that combines market-intelligence tools, a single
      integration layer, execution software, a third-party operator network, and a human operations/control tower.
    data:
      layers:
        - label: Buyer workflow and solution design
          summary: Project goals, projected volumes, and workflow requirements determine the starting program.
          modules:
            - label: Project goals
            - label: Projected volumes
            - label: Workflow requirements
          outputs:
            - label: Program selection
              context: Distribution, fulfillment, capacity, or Discover
        - label: Discovery and market intelligence
          summary: Self-serve tools surface space, pricing, and market context before commitment.
          modules:
            - label: Warehouse Marketplace
            - label: Discover
            - label: Spot Warehousing Index
            - label: ROI Calculator
          outputs:
            - label: Site shortlist and rate context
        - label: Integration control plane
          summary: Flexe advertises one integration path into the network with multiple transport options.
          modules:
            - label: API
            - label: EDI
            - label: XML
            - label: CSV fallback
          outputs:
            - label: Cross-network data exchange
        - label: Execution applications
          summary: The platform combines inventory, order, and warehouse management with analytics.
          modules:
            - label: IMS / WMS / OMS
            - label: Reporting
            - label: KPI monitoring
            - label: Risk mitigation
          outputs:
            - label: Daily warehouse operations
        - label: Operator network
          summary: Third-party operators provide the physical storage and fulfillment capacity.
          modules:
            - label: 800+ operators
            - label: 3,000+ locations
            - label: Fulfillment
            - label: Distribution
          outputs:
            - label: Capacity activation
        - label: Service and governance
          summary: A human control tower handles onboarding, support, KPI reviews, audits, and escalation.
          modules:
            - label: Logistics Analyst
            - label: Site visits
            - label: Inventory audits
            - label: Liability rules
          outputs:
