              - CM003
              - CM004
              - CM005
              - CM014
      - number: '2.2'
        title: Sizing lenses and what they actually prove
        blocks:
          - type: paragraph
            body: >-
              The evidence supports several useful sizing lenses, but not a mathematically clean TAM-to-SAM-to-SOM
              stack. Teardown cites a roughly $147.8 billion 2025 on-demand warehousing market growing to about $504.7
              billion by 2035, and also places the broader U.S. 3PL market around $323 billion in 2025 with value-added
              warehousing and distribution as the largest slice of spend. Those estimates show that Flexe is pursuing a
              large category, but they are not directly interchangeable with Flexe's own operating metrics. Flexe's
              public company evidence is more constrained: 3,000+ warehouses, 800+ operators, 605M+ square feet of
              capacity, and a current Spot Warehousing Index snapshot of $13.35 per pallet, 4.2% average national
              vacancy, and high demand intensity. Those figures are useful for showing accessible network breadth and
              live market instrumentation, but they are not a bottom-up measure of serviceable revenue. The public
              record therefore supports a directional market case, not a reconciled spend model.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM006
              - CM008
              - CM009
              - CM015
      - number: '2.3'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption drivers are visible and concrete: faster network launch, variable rather than fixed warehouse
              spend, overflow capacity for seasonal peaks, and service-level outcomes such as next-day delivery or lower
              parcel costs. The buyer value proposition is strongest where demand volatility makes a long lease or owned
              build-out expensive to underwrite. The constraint side matters just as much for valuation. Teardown's bear
              case is not that warehousing demand is small; it is that flexible warehousing can be margin-compressed by
              Amazon, owned-network 3PLs, and better-capitalized platforms that either control more of the stack or can
              subsidize flexibility more aggressively. That means Flexe's effective market is narrower than headline
              logistics spend: it depends on enterprise buyers who value speed, geographic optionality, and integration
              enough to pay for a neutral orchestration layer rather than defaulting to an incumbent carrier, 3PL, or
              self-build. Until public evidence isolates which buyers renew and expand on that basis, the valuation case
              relies more on category promise than on a verified serviceable market.
            claimRefs:
              - CM005
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Large category, narrower serviceable market
            body: >-
              The public record supports a large logistics and on-demand warehousing category, but Flexe's investable
              market is narrower: multi-node brands that value speed, flexibility, and orchestration enough to avoid
              fixed leases or owned build-outs.
            calloutType: insight
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM015
          - type: callout
            title: Category growth does not guarantee margin capture
            body: >-
              The same sources that support a large category also highlight the adoption constraint: Amazon, large 3PLs,
              and tech-enabled fulfillment rivals can force pricing pressure or win the buyer by controlling more of the
              physical network.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The buyer's real choice set is broader than "another marketplace"
        blocks:
          - type: paragraph
            body: >-
              The competitive set in the assigned evidence splits into three buyer jobs rather than one monolithic peer
              list. Flexe's own surfaces position the company around flexible warehousing infrastructure, distribution,
              fulfillment, and capacity management for mid-market and enterprise supply chains. In contrast, the
              alternative guides in the pool separate self-managed warehouse suites from outsourced fulfillment networks
              and warn that a provider that works for seasonal storage may not be the right fit for day-to-day parcel
              fulfillment or B2B routing-guide compliance. That distinction matters because a buyer comparing Flexe
              against Saltbox or Portal Warehousing is usually choosing operational control and transparent entry
              pricing, while a buyer comparing Flexe against Flowspace, ShipBob, or Flexport is usually choosing among
              different outsourced fulfillment and distribution models.
            claimRefs:
              - CP001
              - CP006
              - CP009
              - CP010
              - CP011
