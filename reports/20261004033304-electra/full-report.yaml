  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Primary Ironmaking Alternatives
        blocks:
          - type: paragraph
            body: >-
              Electra operates in the clean ironmaking and decarbonized steel input sector, where its low-temperature
              electrochemical process seeks to displace conventional carbon-intensive reduction pathways. The primary
              status-quo substitute for primary ironmaking remains the integrated blast furnace-basic oxygen furnace
              (BF-BOF) route, which depends heavily on metallurgical coal and accounts for the vast majority of global
              virgin iron units. Adjacent commercial substitutes include natural gas-based Direct Reduced Iron (DRI)
              paired with Electric Arc Furnaces (EAF), which is expanding rapidly in regions with access to affordable
              gas or planned green hydrogen infrastructure. Electra's core technological differentiation centers on
              processing lower-grade commercial iron ores at temperatures below 100 degrees Celsius using renewable
              electricity, bypassing high-grade pellet requirements and direct thermal combustion. However, commercial
              adoption must overcome severe switching barriers, including incumbent capital lock-in in existing steel
              mills, capital intensity for new electrowinning facilities, and long-term customer qualification cycles.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
