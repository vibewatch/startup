      - number: '4.3'
        title: Unit Economics, Delivery Cost Drivers, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Evaluating unit economics for pre-commercial materials processors requires isolating fixed facility
              carrying costs from variable feedstock and processing reagents. Feedstock supply security represents the
              single largest variable cost driver; long-term agreements covering 100% of required mineral feedstocks
              over multi-year ramp-up horizons, such as commitments with global suppliers like Glencore, represent
              prospective commitments exceeding $500 million in contained metal value. However, realized processing
              margins remain completely unverified prior to continuous-throughput industrial demonstration. In parallel,
              capital markets and search pools frequently conflate distinct entities operating under the Electra
              name—including Electra Battery Materials Corporation (NASDAQ: ELBM), Electra AI / Electra Vehicles
              (merging with Iron Horse Acquisition II Corp.), Electra.aero (hybrid-electric aviation), Electra Therm
              (geothermal ORC systems), and Trek/Electra bicycles. For institutional underwriters, this identity overlap
              creates material diligence friction, obscuring private company financials and demanding strict entity
              separation. The absence of audited standalone unit economics, combined with substantial debt service
              obligations and reliance on capital markets, establishes financial viability as a primary underwriting
              blocker.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
