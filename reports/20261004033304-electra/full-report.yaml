      - number: '4.2'
        title: Capital Structure, Liquidity Runway, and Financing Dependencies
        blocks:
          - type: paragraph
            body: >-
              Electra operates under an intensive capital deployment model where liquidity adequacy is heavily dependent
              on public-sector grants, reimbursable government facilities, and debt-equity hybrid instruments.
              Industrial refining and metallurgical facilities require substantial capital outlay before cash generation
              can commence. In the North American critical mineral and battery refining sector, development entities
              demonstrate that project budgets frequently exceed US$73 million (approximately $100 million) for baseline
              facility construction, supported by combinations of sovereign funding agreements—including programs from
              the Government of Canada under the Strategic Response Fund and Invest Ontario—and secured credit
              facilities. As demonstrated in financial disclosures from development-stage refiners, cash balances are
              actively consumed by construction capital expenditure, with six-month operating and investing cash
              outflows reaching $7.79 million and $7.63 million respectively. Liquidity reserves of $35.87 million and
              debt carrying values exceeding $42.64 million with payment-in-kind interest rates up to 11.125% illustrate
              the extreme financing dependency of pre-commercial processing assets, where covenant restrictions mandate
              ongoing capital raising to prevent liquidity shortfall.
