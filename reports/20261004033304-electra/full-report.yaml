      - number: '1.2'
        title: Organizational Leadership, Governance, and Ecosystem Boundaries
        blocks:
          - type: paragraph
            body: >-
              Since its 2020 incorporation, Electra's multidisciplinary team has grown to encompass specialized
              industrial engineers, operations executives, and commercial leaders drawn from mining, metallurgy,
              manufacturing, and advanced technology sectors. While Electra's public operational surfaces deliberately
              avoid enumerating named individual executives, board directors, or committee mandates, the team's
              operational scope spans metallurgical ore extraction, electrochemical refining, industrial facility
              construction, and process safety at commercial scale. Concurrently, diligence across broader industrial
              news reveals multiple other active corporate entities operating under the Electra brand. Specifically,
              Electra Vehicles, Inc. focuses on AI-driven battery management software and adaptive controls; Electra
              Battery Materials Corporation (NASDAQ: ELBM) operates as a Canadian public corporation developing cobalt
              sulfate refining and black mass recycling; Go-Electra manages commercial European electric vehicle
              fast-charging infrastructure; and Trek/Electra manufactures consumer electric bicycles. Maintaining
              rigorous verification boundaries prevents conflating ElectraSteel's low-temperature electrochemical
              ironmaking with external software platforms or mining public equity issuances.
