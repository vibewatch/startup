      - number: '6.4'
        title: Durability and concentration remain private-evidence questions
        blocks:
          - type: paragraph
            body: >-
              No target-specific source in the assigned pool reports NRR, GRR, churn, renewal, contract duration, repeat
              purchase, satisfaction, customer concentration, channel dependence, or procurement conversion. That
              absence in the reviewed material is not proof that Electra has no pilots or agreements; it means those
              relationships cannot be underwritten from this evidence set. The central customer risk is therefore
              evidentiary: investors cannot distinguish exploratory interest from qualification, paid pilot, binding
              purchase commitment, or recurring production use. Diligence should obtain a legal-entity-matched contract
              register, customer-confirmed qualification results, shipment records, pricing and volume obligations,
              termination rights, renewal history, and top-counterparty exposure before assigning commercial traction or
              durability.
