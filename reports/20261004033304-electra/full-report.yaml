              - CM011
              - CM012
              - CM013
          - type: callout
            title: Ore Feedstock Flexibility as the Definitive Economic Moat
            body: >-
              Electra's primary differentiation lies in processing lower-grade iron ores that shaft-furnace DRI
              technologies cannot accept. Conventional shaft furnaces require premium 67%+ Fe pellets, which command
              steep market premiums and face global supply shortages; unlocking commercial-grade ores provides a
              fundamental feedstock cost advantage.
            calloutType: insight
            claimRefs:
