  - id: FE001
    title: Electra Electrochemical Process Architecture Stack
    type: stack
    summary: >-
      Integrated operating layers spanning raw ore preparation, hydrometallurgical leaching, electrochemical deposition,
      co-product recovery, and automation.
    data:
      layers:
        - label: 'Layer 1: Feedstock Preparation'
          detail: Accepts commercial and low-grade ores (35–45% Fe); mechanical sizing and slurrying.
        - label: 'Layer 2: Hydrometallurgical Leaching'
          detail: Low-temperature (<100°C) liquid chemical dissolution of iron oxide and gangue minerals.
        - label: 'Layer 3: Electrochemical Electrowinning'
          detail: Cathodic deposition of 99% pure clean iron plates powered by renewable electricity.
        - label: 'Layer 4: Mineral Co-product Recovery'
          detail: Sequential precipitation and separation of alumina, silica, and manganese streams.
        - label: 'Layer 5: Closed-Loop Automation & Control'
          detail: Industrial distributed control, electrolyte recycling, and chemical containment systems.
        - label: 'Layer 6: Industrial Customer Integration'
          detail: Direct charging of clean iron plates into secondary Electric Arc Furnaces for flat steel.
    approximationNotes: >-
      Conceptual representation of Electra's six-stage electrochemical operating model based on electra.earth
      disclosures.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE006
