    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Legal Structure
        blocks:
          - type: paragraph
            body: >-
              Electra operates under the registered legal entity ElectraSteel, Inc., maintaining its corporate
              headquarters at 6400 Lookout Road, Suite 200, in Boulder, Colorado. The enterprise was founded in 2020 by
              an industrial group united in the mission of expanding the supply of critical physical materials and
              utilizing ores that conventional thermal extraction methods abandon. Operating commercially and publicly
              under the brand Electra (and the primary domain electra.earth), the venture focuses on producing
              high-purity clean iron (99% pure) suitable for Electric Arc Furnace (EAF) steelmaking, as well as refining
              accompanying mineral co-products such as alumina, silica, and manganese without relying on traditional
              fossil-fired blast furnace emissions. Establishing strict corporate entity disambiguation is necessary for
              all subsequent operational and investment diligence, as multiple unrelated commercial ventures operate
              simultaneously under the Electra trade name across electric vehicle charging networks, automotive battery
              analytics software, and public critical minerals refining corporations.
