    rows:
      - - Virgin Iron Production for Flat Steel
        - Blast Furnace-Basic Oxygen Furnace (BF-BOF) using metallurgical coal at ~1,600°C
        - Hydrometallurgical dissolution and low-temp electrowinning powered by renewables
        - Eliminates process CO2 emissions; produces 99% pure metallic iron plates
        - High electrical power dependency; requires access to continuous low-cost green grid
      - - Low-Grade Ore Processing
        - Beneficiation and pelletization restricted to high-grade ores (>67% Fe) for shaft DRI
        - Direct chemical leaching capable of treating ores with 35–45% Fe and high gangue
        - Expands usable mineral reserves; eliminates pelletizing heat requirements
        - Higher chemical reagent consumption and acid handling volume per ton of iron
      - - Ore Gangue Waste Management
        - Tailings dams and slag accumulation creating long-term environmental liabilities
        - Selective extraction and recovery of alumina, silica, and manganese minerals
        - Recovers commercial co-products and reduces total solid waste disposal volume
        - Downstream separation complexity and chemical recycling circuit stability
      - - Secondary EAF Feedstock Dilution
        - Purchasing scarce prime scrap or high-cost imported pig iron / hot briquetted iron
        - Feeding clean iron plates directly into EAF charging buckets with scrap
        - Dilutes copper/tin tramp residuals to unlock high-grade automotive sheet production
        - Melting kinetics and slag foaming behavior of clean iron plates in commercial EAFs
    notes: >-
      Workflow comparison based on electra.earth technical literature and industrial ironmaking benchmarks;
      pilot-to-commercial scale kinetics remain subject to demonstration.
