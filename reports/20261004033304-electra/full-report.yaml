            title: Severe Entity Disambiguation and Financial Data Obfuscation
            body: >-
              Public domain data pools and syndicated news feeds consistently conflate multiple distinct entities
              branded as Electra—including clean-iron developer ElectraSteel (electra.earth), public refiner Electra
              Battery Materials (ELBM), SPAC-target Electra AI (AIBR), aerospace developer Electra.aero, and waste-heat
              developer Electra Therm. Underwriters must reject cross-entity financial assertions and demand
              primary-source verified financial statements.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
          - type: callout
            title: Pre-Commercial Capital Gaps Dominate Underwriting Verdict
            body: >-
              With zero verified commercial revenues and major capital outlays required to scale industrial processing
              facilities, Electra's forward financial standing is dictated entirely by external capital availability,
              government loan disbursements, and debt covenants rather than operating cash flow.
            calloutType: insight
            claimRefs:
