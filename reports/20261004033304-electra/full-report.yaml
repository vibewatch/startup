  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Sizing Lenses, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The addressable market boundary for Electra is precisely situated at the intersection of primary iron ore
              reduction, Electric Arc Furnace (EAF) feedstocks, and industrial byproduct recovery. Steelmaking
              historically accounts for approximately 7-8% of global greenhouse gas emissions, primarily generated by
              blast furnace-basic oxygen furnace (BF-BOF) routes that rely heavily on metallurgical coke for chemical
              reduction. Direct Reduced Iron (DRI) technologies provide an alternative pathway, but conventional shaft
              furnaces (such as Midrex and Energiron) require high-grade DR-grade iron ore pellets with iron content
              typically exceeding 67%. Electra’s core market opportunity is unlocking the vast reserves of commercial
              ores with lower iron content that traditional direct reduction methods reject. Rather than competing as an
              end-to-end steelmaker, Electra operates as a merchant supplier of 99% pure clean iron feedstock for EAF
              operators, while concurrently recovering co-products including alumina, silica, and manganese from process
              tailings. Status-quo substitutes include existing blast furnaces, natural-gas-fired shaft furnaces,
              emerging green hydrogen DRI facilities, and merchant direct-reduced hot briquetted iron (HBI). Commercial
              adoption is heavily dependent on the willingness of steel producers to integrate electrochemical iron
              pellets or plates into their existing electric melt shops without compromising slag chemistry or
              electrical efficiency.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
