      - number: '3.2'
        title: Alternative Technology Pathways and Entity Ambiguity
        blocks:
          - type: paragraph
            body: >-
              Alternative clean iron and critical mineral startups compete across distinct thermodynamic regimes,
              ranging from high-temperature molten oxide electrolysis to hydrogen direct reduction and
              hydrometallurgical processing. Direct peers in novel clean iron development include Boston Metal, which
              utilizes high-temperature molten oxide electrolysis, and Midrex or Tenova HYL in commercial gaseous direct
              reduction. In parallel, market intelligence and competitive data aggregators frequently conflate
              ElectraSteel (Electra.earth) with unrelated entities, including European EV charging operator Electra,
              TSX-V/NASDAQ-listed Electra Battery Materials Corporation (ELBM), Electra Ltd UK in construction services,
              and New Zealand electricity distributor Electra. These naming collisions distort third-party automated
              deal sourcing and equity screens, confusing battery chemical refining contracts or charging point
              deployments with clean ironmaking progress.
