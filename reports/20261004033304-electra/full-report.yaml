      - number: '2.2'
        title: Buyer Segmentation, Budget Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics in primary iron reduction are governed by blast furnace operators, mini-mill electric
              arc furnace steelmakers, and industrial material distributors. Electric arc furnace operators represent
              the primary near-term addressable segment because mini-mills require low-residual virgin metallic iron
              units to dilute copper, tin, and other tramp elements in obsolete scrap when manufacturing
              high-specification flat-rolled automotive and electrical steels. In these enterprises, budget ownership
              resides with raw materials procurement directors and chief operations officers, with multi-year capital
              commitment approvals from executive investment committees. Steel producers evaluate potential suppliers
              against rigid delivery schedules, consistent chemical purity, moisture tolerances, and physical handling
              durability. Greenfield adoption is inherently constrained by conservative operational culture; introducing
              an unproven merchant iron material into a commercial melt shop creates risks of catastrophic refractory
              damage, tap-to-tap cycle delays, and unpredictable slag foaming. Consequently, steelmakers mandate
              multi-stage qualification protocols spanning bench-scale testing, multi-ton trial heats, and extended
              pilot campaigns before negotiating long-term binding supply contracts or committing to capital expenditure
              for dedicated receipt infrastructure.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Macro Drivers, Entity Disambiguation, and Industry Adoption Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              The adoption of electrochemical clean iron is propelled by regulatory decarbonization mandates, corporate
              scope 1 and scope 2 emission reduction commitments, and carbon border adjustment mechanisms such as the
              European Union CBAM. Electric arc furnace steelmakers are under mounting pressure from automotive original
              equipment manufacturers and consumer goods brands to deliver verified low-embodied-carbon steel grades.
              Nevertheless, commercialization faces severe headwinds, beginning with high electricity intensity and grid
              interconnection delays. Operating electrochemical iron reduction at scale demands massive, uninterrupted
              supplies of low-cost clean electricity, rendering plant siting and power purchase agreements critical
              gating factors. Furthermore, diligence in this market is complicated by significant industry entity
              confusion: market intelligence databases and newsfeeds routinely conflate Boulder-based clean iron
              producer ElectraSteel, Inc. with public EV battery software developer ELECTRA AI (which entered into a
              $250 million SPAC merger with Iron Horse Acquisition II Corp.), Canadian mineral refiner Electra Battery
              Materials Corp. (building a cobalt sulfate refinery in Ontario with Glencore feedstock), Israeli
              infrastructure conglomerate Electra Ltd. (TASE: ELTR), and European EV charging network Electra (which
              raised €304 million led by PGGM). Rigorous market analysis requires strictly disambiguating these
              unrelated balance sheets, executive teams, and target markets to isolate the underlying operational
              realities of clean iron production.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
