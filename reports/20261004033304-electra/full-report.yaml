  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Mechanisms, and Offtake Commitments
        blocks:
          - type: paragraph
            body: >-
              Electra's core business model is structured around the conversion of mineral feedstock and unrefined ores
              into high-value critical industrial inputs, including battery-grade materials and clean metallurgical
              products. The company's commercial monetization model relies on long-term industrial supply agreements and
              volume offtake arrangements rather than software-style subscriptions or transactional spot retail. For
              industrial refiners and materials processors in the critical mineral sector, recognized commercial
              revenues depend directly on plant commissioning, physical product delivery, and customer qualification
              protocols. Across comparable commercial contracts in the materials refining ecosystem, such as updated
              binding supply terms executed with major battery cell manufacturers like LG Energy Solution, offtake
              commitments typically lock in volume shares—such as approximately 60% of planned production through
              multi-year agreements spanning 2029 with extensions to 2032—while pricing formulas track volatile global
              metal benchmarks with negotiated processing premiums. Prior to physical commissioning and commercial
              delivery, realized commercial revenue across operations remains zero, making forward revenue visibility
              contingent on capital execution and binding customer qualification.
            claimRefs:
