            title: Entity Disambiguation and Capital Contamination in Diligence Feeds
            body: >-
              Automated financial feeds frequently conflate Boulder-based clean iron developer ElectraSteel, Inc. with
              public EV battery software platform ELECTRA AI, Toronto critical mineral refiner Electra Battery Materials
              Corp., Israeli contractor Electra Ltd., and European charging network Electra. Diligence models must
              isolate Electra's electrochemical iron process from these unrelated corporate entities.
            calloutType: risk
            claimRefs:
