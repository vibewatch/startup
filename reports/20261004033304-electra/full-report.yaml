      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Chemical Selectivity Decouples Ironmaking from High-Grade Pellet Scarcity
            body: >-
              The central breakthrough of Electra's electrochemical architecture is its ability to bypass the stringent
              ore grading constraints that bottleneck traditional Direct Reduced Iron (DRI) technologies. While
              hydrogen-based shaft furnaces demand premium DRI-grade pellets (>67% Fe with less than 2% combined silica
              and alumina), Electra's hydrometallurgical leaching functions across low-grade ores down to 35% iron
              content. This capability allows steelmakers to process domestic deposits and mining tailings, expanding
              usable ore supply by millions of tons and shielding production from scarce merchant pellet premiums.
            calloutType: insight
            claimRefs:
              - CE001
              - CE003
              - CE005
          - type: callout
            title: Diligence Complexity Arising from Industrial Name Collisions
            body: >-
              Public records and capital markets exhibit high brand collision around the 'Electra' name. Investors must
              separate ElectraSteel, Inc. (Boulder, CO-based private clean iron producer, electra.earth) from Electra
              Battery Materials Corp. (TSX-V/NASDAQ: ELBM, Ontario cobalt sulfate refinery), Electra.aero
              (hybrid-electric aviation developer), and consumer mobility entities subject to CPSC safety recalls.
              Conflating public battery refinery announcements, federal EV grants, or aircraft contracts with Electra's
              ironmaking operations represents a material diligence failure.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Potential buyers are visible; actual customers are not
        blocks:
          - type: paragraph
            body: >-
              Electra's official site presents a materials proposition rather than a documented customer roster. It says
              the process produces high-purity iron plus alumina, silica, and manganese, and describes the iron as an
              input for Electric Arc Furnace steel, batteries, and magnets. Those use cases imply potential buyer groups
              in steelmaking and advanced-material supply chains, but they do not establish who buys, pays for, or
              currently uses Electra's output. The fetched homepage names no customer, partner, pilot, shipment,
              geography, account count, or revenue band. Accordingly, the segmentation below is a product-to-user
              hypothesis, not an observed customer mix, and strategic value cannot yet be tied to revenue or production
              deployment.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU003
              - CU006
      - number: '6.2'
        title: The public record does not establish adoption
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption signal in the assigned pool is still a product specification: Electra claims 99%
              pure iron and identifies downstream applications. The same fetched official material provides no
              active-use count, repeat order, qualified location, utilization rate, commercial shipment, or dated
              deployment milestone. This distinction matters because a use case is not a customer, and a product claim
              is not evidence of production acceptance. The evidence therefore supports only the top of a possible
              industrial qualification journey. Every later step—from sample testing through a binding offtake and
              repeat purchasing—remains unverified in this chapter's allocated material and should be tested in the data
              room.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU013
              - CU016
