      - number: '3.3'
        title: Switching Costs, Commercial Qualification, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Pricing and packaging dynamics in primary iron units are dictated by global commodity pricing benchmarks
              (such as 62% Fe iron ore fines and pig iron/hot briquetted iron indices), adjusted for impurity discounts,
              logistics, and carbon compliance penalties. Steelmakers operating EAFs require high-purity iron inputs to
              dilute tramp elements from post-consumer steel scrap, creating a premium for clean virgin iron. Electra
              claims its electrochemical approach delivers 99% pure iron while extracting valorized mineral byproducts
              like alumina, silica, and manganese, potentially offsetting operating costs. However, establishing durable
              pricing power requires multi-thousand-ton commercial demonstrations and binding offtake agreements.
              Capital lock-in among incumbent steel producers and the commodity nature of merchant iron create elevated
              displacement risks if incumbent suppliers successfully decarbonize with gas-to-hydrogen DRI retrofits.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Technological Feedstock Flexibility Provides Core Moat
            body: >-
              Electra's primary competitive advantage over hydrogen DRI is its stated capability to process iron ores
              with iron content as low as commercial ores without requiring beneficiation into premium DR-grade pellets,
              expanding the available feedstock base.
            calloutType: insight
            claimRefs:
              - CP002
              - CP004
          - type: callout
            title: Incumbent Capital Lock-in and Transition Friction
            body: >-
              Integrated steelmakers maintain multi-decade capital cycles in blast furnace infrastructure, making
              greenfield electrowinning adoption slow without regulatory carbon penalties or direct government project
              subsidies.
            calloutType: risk
            claimRefs:
