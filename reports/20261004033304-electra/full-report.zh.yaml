  - id: FM001
    title: 市场规模层级与可行潜在市场客群
    type: pyramid
    summary: 概念性市场规模层级，对比全球生铁总需求、高纯电弧炉（EAF）潜在细分市场以及初期商业化产能。
    data:
      items:
        - label: 全球原生生铁总产量
          detail: 涵盖长流程高炉及直接还原设施的全球原生铁还原总量
          value: 1400
          unit: Mt/year
        - label: 全球电弧炉粗钢产量
          detail: 全球电弧炉生产所需的废钢与原生金属料粗钢总产出
          value: 550
          unit: Mt/year
        - label: 电弧炉原生金属料需求
          detail: 废钢炼钢过程中用于稀释残留杂质的直接还原铁（DRI）与热压块铁（HBI）
          value: 120
          unit: Mt/year
        - label: 商品级直接还原铁市场
          detail: 跨国贸易或独立生厂商与区域短流程钢厂之间交易的商品级 DRI 和 HBI
          value: 30
          unit: Mt/year
        - label: 低碳 DRI 目标市场
          detail: 满足绿钢溢价需求的近零排放铁还原潜在目标市场
          value: 5
          unit: Mt/year
        - label: 商业化示范规模
          detail: 清洁电化学商品铁装置的初期商业化落地目标
          value: 1
          unit: Mt/year
    approximationNotes: 基准数量级基于全球生铁冶炼产出与电弧炉原生金属料需求估算；Electra 产能仅代表商业愿景。
    claimRefs:
      - CM001
      - CM003
