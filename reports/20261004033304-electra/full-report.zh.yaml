      - number: '4.2'
        title: 资本结构、流动性跑道与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Electra
              属于重资本投入模式，流动性充裕度高度依赖公共部门补贴、政府偿还型授信以及股债混合工具。工业精炼与冶金设施在产生现金流之前需要巨额资本开支。在北美关键矿物与电池精炼领域，开发主体的基线设施建设预算往往超过
              US$73 million（约 $100 million），由主权资助协议（包括加拿大政府战略响应基金与 Invest Ontario
              项目）及有担保信贷工具共同支持。开发期精炼企业的财务披露显示，工程建设资本开支正在快速消耗现金储备，6 个月的经营与投资现金流出分别达 $7.79 million 和 $7.63 million。$35.87
              million 的流动性储备，加上账面价值超过 $42.64 million、实物支付（PIK）利率高达 11.125%
              的债务，凸显出商业化前期加工资产极强的融资依赖性；债务契约限制更是要求其持续融资以防流动性枯竭。
