  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、规模测算维度与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Electra 的目标市场边界精准落在原生铁矿石还原、电弧炉（EAF）原料与工业副产品回收的交汇点。炼钢行业历来占全球温室气体排放的约
              7-8%，主要源自严重依赖冶金焦进行化学还原的高炉-转炉（BF-BOF）长流程路线。直接还原铁（DRI）技术提供了替代路径，但传统竖炉（如 Midrex 和
              Energiron）需要高品位直接还原级铁矿球团，铁含量通常超过 67%。Electra 的核心市场机遇在于盘活传统直接还原工艺无法利用的海量低品位商品矿石资源。Electra 并非端到端炼钢厂，而是作为 99%
              纯铁原料的独立商业供应商面向 EAF 钢厂供货，同时从工艺尾矿中回收氧化铝、二氧化硅及锰等联产品。现有替代方案包括传统高炉、天然气竖炉、新兴绿氢 DRI
              设施，以及商业化直接还原热压块铁（HBI）。商业化落地的关键，在于钢厂是否愿意在不破坏炉渣化学成分或电力效率的前提下，将电化学铁球团或铁板引入现有的电炉炼钢车间。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
