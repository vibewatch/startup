  - id: FE001
    title: Electra 电化学工艺架构分层栈
    type: stack
    summary: 贯穿原矿制备、湿法浸出、电化学沉积、副产品回收及自动化的综合运营分层架构。
    data:
      layers:
        - label: 第 1 层：原料制备
          detail: 可吃进商业及低品位铁矿石（35–45% Fe）；进行机械分级与矿浆制备。
        - label: 第 2 层：湿法冶金浸出
          detail: 在低温（<100°C）下以液体化学药剂溶解氧化铁及脉石矿物。
        - label: 第 3 层：电化学电积
          detail: 由可再生电力驱动，阴极电沉积析出 99% 纯净清洁铁板。
        - label: 第 4 层：伴生矿副产品回收
          detail: 依序沉淀分离氧化铝、二氧化硅及二氧化锰副产物料流。
        - label: 第 5 层：闭环自动化与过程控制
          detail: 工业分布式控制（DCS）、电解液循环回收及化学品防泄漏密闭系统。
        - label: 第 6 层：工业客户集成
          detail: 将清洁铁板直接装入下游短流程电弧炉，用于生产板材钢。
    approximationNotes: 基于 electra.earth 官方披露，概念性呈现 Electra 六阶段电化学运营模型。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE006
