      - number: '2.2'
        title: 买家分层、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              原生铁还原领域的采购格局由高炉钢厂、短流程电弧炉钢厂以及工业材料分销商主导。电弧炉钢厂是近期的核心目标客群：短流程钢厂在生产高规格汽车板和电工钢等平轧材时，需要低杂质的原生金属铁来稀释废钢中的铜、锡等混入元素。此类企业的预算归属于原材料采购总监与首席运营官，跨年度资本承诺则须经执行投资委员会批准。钢厂评估潜在供应商时，考核指标极为严苛，涵盖交货时间表、化学纯度稳定性、水分容差以及物理搬运耐损度。新建项目的技术采纳天然受制于保守的生产文化；在商业熔炼车间贸然引入尚未经验证的外购铁原料，可能引发耐火材料严重损毁、出钢周期延长以及炉渣起泡不可控等灾难性风险。因此，钢厂在商讨长期具约束力的供应合同或为专用受料设施投入资本支出前，会严格执行包含实验室台架测试、数吨级试炼炉以及长周期试点运行在内的多阶段准入认证流程。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: 宏观驱动因素、实体混淆甄别与行业落地瓶颈
        blocks:
          - type: paragraph
            body: >-
              监管层面的脱碳法规、企业自身的 Scope 1 和 Scope 2 减排承诺，以及欧盟 CBAM
              等碳边境调节机制，共同推动了电化学清洁铁的采纳需求。汽车主机厂和消费品品牌要求供应经核验的低隐含碳钢材，给电弧炉钢厂带来了与日俱增的减排压力。然而商业化落地面临严重阻力，首当其冲的便是极高的用电强度与电网接入延迟。规模化运行电化学铁还原需要持续、充沛且廉价的清洁电力供应，使得工厂选址与购电协议（PPA）成为关键卡点。此外，严重的行业实体混淆进一步增加了尽调难度：市场情报数据库和新闻流常将位于
              Boulder 的清洁铁开发商 ElectraSteel, Inc. 与其他实体混同——包括通过 $250 million SPAC 与 Iron Horse Acquisition II Corp.
              合并上市的电动汽车电池软件商 ELECTRA AI、在安大略省利用 Glencore 原料建设硫酸钴精炼厂的加拿大矿物精炼商 Electra Battery Materials Corp.、以色列基建集团
              Electra Ltd.（TASE: ELTR），以及由 PGGM 领投 €304 million 融资的欧洲电动汽车充电网络
              Electra。严谨的市场分析必须严格厘清这些彼此独立的资产负债表、管理团队及目标市场，从而聚焦于清洁铁生产本身的实际运营状况。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
