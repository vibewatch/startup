      - number: '5.3'
        title: 工业工作流、落地风险与企业实体甄别
        blocks:
          - type: paragraph
            body: >-
              评估 Electra 的商业就绪度，需要将其产出接入既有炼钢和矿物精炼工作流，同时审慎区分以“Electra”商号运营的上市企业实体。在目标炼钢工作流中，清洁铁板省去了烧结和高炉环节，直接与回收废钢一同加入
              EAF 料篮 [CE002, CE003]。只要上游电积槽使用清洁电力，这便能消除原生炼铁的 Scope 1 和 Scope 2 碳排放
              [CE001]。但独立尽调发现，公开企业申报与新闻报道中存在严重的实体混淆：多家互不隶属的公司均以“Electra”命名，包括多伦多关键矿物与电池材料精炼商 Electra Battery Materials
              Corp.（TSX-V: ELBM / NASDAQ: ELBM）[CE008, CE010]、混合动力飞机开发商 Electra.aero [CE011]、电力公用工程软件 Electra Power Line
              Design [CE012]，以及金融软件提供商 Electra Information Systems（已被 Gresham Technologies
              收购）[CE013]。公开监管安全文件还记录了因机械部件缺陷对以 Trek/Electra 品牌销售的消费级电动自行车实施的产品召回 [CE009]。因此，投资人必须将位于 Boulder 的
              ElectraSteel, Inc. 自研清洁铁技术（electra.earth）与上市矿产精炼商或出行开发商严格剥离 [CE007, CE008,
              CE011]。尚未解决的尽调重点在于获取经核验的试点通量数据、电积槽连续运行工时，以及商业化工厂资本开支基准 [CE003, CE008]。
