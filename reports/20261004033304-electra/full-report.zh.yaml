  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规、环境许可与法定架构
        blocks:
          - type: paragraph
            body: >-
              Electra 以 ElectraSteel, Inc. 这一法人实体开展商业运营，官方企业运营中心位于科罗拉多州
              Boulder。推进电化学清洁铁的商业化必须应对严苛的环境保护法规，包括联邦《清洁空气法》（Clean Air Act）与《清洁水法》（Clean Water
              Act）标准，以及科罗拉多州当地的工业许可框架。线上使用条款将科罗拉多州 Boulder 县定为排他性司法管辖区，并包含标准的责任限制条款，将企业赔偿上限限定为 100
              美元。然而，全面铺开商业化精炼部署，需要通过全面的《国家环境政策法》（NEPA）审查与当地工业规划许可，而这些目前尚未公开申报。对消费品安全登记信息的尽调查询显示，Hyena 为 Trek Bicycle
              Corporation 制造的挂有 Electra 品牌的电动自行车曾有历史召回记录，但证实 ElectraSteel 的工业清洁炼铁业务没有任何产品召回或安全执法记录。
            claimRefs:
