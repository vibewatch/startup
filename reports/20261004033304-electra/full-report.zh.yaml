      - number: '4.3'
        title: 单体经济效益、交付成本驱动因素与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              评估商业化前期材料加工企业的单体经济效益，必须将固定设施持有成本与可变原料及加工试剂成本区分开来。原料供应保障是最大的可变成本驱动项；覆盖多年产能爬坡期 100% 所需矿物原料的长期协议（例如与 Glencore
              等全球供应商的合作承诺），对应内含金属价值预计超过 $500 million。但在完成连续通量工业验证之前，实际加工利润率仍完全未经验证。与此同时，资本市场与搜索池常将名为 Electra 的不同主体混淆——包括
              Electra Battery Materials Corporation（NASDAQ: ELBM）、Electra AI / Electra Vehicles（正与 Iron Horse
              Acquisition II Corp. 合并）、Electra.aero（混合动力航空）、Electra Therm（地热 ORC 系统）以及 Trek/Electra
              自行车。对机构投资方而言，这种身份重叠造成了实质性尽调阻碍，遮蔽了私营公司的财务真实面貌，必须严格剥离主体。缺乏经审计的独立单体经济模型，加之沉重的偿债义务和对资本市场的依赖，使财务可行性成为投资评估的核心卡点。
