      - number: '5.2'
        title: 产品产出矩阵与技术差异化
        blocks:
          - type: paragraph
            body: >-
              Electra 规划的商业化产出涵盖两大类别：高纯金属铁产品与精炼工业矿物联产品。主要产品为 99% 纯度的清洁铁板或压块，专为短流程电炉钢厂定制为原生铁原料 [CE002,
              CE003]。通过用清洁铁替代废钢或基于煤炭的生铁，EAF 钢厂能生产高规格的汽车板和电工钢平轧材，而此前这类钢种需要原生铁原料来稀释铜、锡、镍等混入残留元素
              [CE002]。副产物流包括沉淀电池级氧化铝、用于工业建筑的精制二氧化硅以及锰精矿 [CE001, CE004]。相比单一产品的球团厂或传统竖炉，这种联产能力构筑了差异化的收入结构与成本对冲优势 [CE004,
              CE005]。然而，技术差异化受制于严苛的能量平衡与试剂循环效率：电化学溶解与电积天然属于高耗电工艺，必须持续获得廉价可再生电力，方能维系相比化石能源制氢 DRI 的运营成本竞争力 [CE001,
              CE003]。此外，工业化落地还需要完备的环境安全防护，以防止化学品泄漏、维持酸液与溶剂的闭环封存，并确保湿法冶炼环境符合职业健康与安全标准 [CE006, CE007]。
            claimRefs:
