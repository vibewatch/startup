        title: 图表
        blocks:
          - type: callout
            title: 尽调信息流中的实体混淆与资本数据干扰
            body: >-
              自动化金融数据流常将位于 Boulder 的清洁铁开发商 ElectraSteel, Inc. 与电动汽车电池软件平台 ELECTRA AI、多伦多关键矿物精炼商 Electra Battery
              Materials Corp.、以色列承包商 Electra Ltd. 以及欧洲充电网络 Electra 混为一谈。尽调模型必须将 Electra 的电化学炼铁工艺与这些不相关的公司实体彻底剥离。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
