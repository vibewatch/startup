  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工艺架构与电化学运行机制
        blocks:
          - type: paragraph
            body: >-
              Electra 打造了一套电化学精炼平台，旨在不经高碳冶炼直接从原矿及低品位铁矿石中提取清洁铁与矿物联产品。传统原生炼钢依赖以冶金煤为燃料的约 1,600°C
              高炉作业，每生产一吨铁水大约排放两吨二氧化碳。相比之下，Electra 的化学浸出与电积架构在低温（100°C 以下）湿法环境下溶解矿石中的氧化铁，随后完全由可再生电力驱动电化学分离 [CE001,
              CE003]。阴极反应沉积出元素纯度达 99% 的固体金属铁板，经机械剥离后可直接入料电弧炉（EAF）或用于下游粉末冶金 [CE002]。Electra
              化学路径的核心结构性差异在于原料灵活性：传统直接还原铁（DRI）竖炉需要严格限制二氧化硅和氧化铝含量的高品位球团矿（Fe >67%），而 Electra 的湿法冶金工艺可接纳含铁量低至 35–45%
              的低品位矿石，以及传统钢厂作为尾矿丢弃的高脉石矿石 [CE003, CE005]。此外，Electra
              的工艺流程能从同批矿石中回收高价值矿物副产品，分离出氧化铝、二氧化硅及锰物流，提升了每采一吨矿的有效材料回收率 [CE001,
              CE004]。试点规模的运营监控依托工业过程自动化、分布式控制系统以及连续化学传感，以动态平衡电解液 pH 值、电流密度与槽电压 [CE006]。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
