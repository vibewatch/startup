          - type: callout
            title: 矿石原料灵活性构成决定性经济护城河
            body: Electra 的核心差异化优势在于能够处理竖炉 DRI 技术无法消纳的低品位铁矿石。传统竖炉依赖含铁量 67%+ 的高溢价优质球团矿，此类矿石面临全球性供应短缺；盘活普通商品级矿石带来了根本性的原料成本优势。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与原生炼铁替代路线
        blocks:
          - type: paragraph
            body: >-
              Electra
              所处的清洁炼铁与脱碳钢铁原料赛道，正试图通过低温电化学工艺替代传统高碳还原路径。原生炼铁最主要的传统替代路径仍是高炉-转炉（BF-BOF）长流程，严重依赖冶金煤，占据全球绝大部分原生铁产量。邻近的商业替代方案为天然气基直接还原铁（DRI）搭配电弧炉（EAF），目前在气价低廉或规划有绿氢基建的地区快速扩张。Electra
              的核心技术差异化在于利用可再生电力在 100
              摄氏度以下处理低品位普通铁矿石，绕开了对高品位球团矿的硬性要求和直接热燃烧过程。但商业化落地必须攻克巨大的转换壁垒，包括现有钢厂沉淀的重资产锁定效应、新建电积设施的高资本开支，以及漫长的客户认证周期。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
