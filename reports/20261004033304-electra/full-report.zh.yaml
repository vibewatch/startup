    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司法人身份、成立背景与法定架构
        blocks:
          - type: paragraph
            body: >-
              Electra 的法定注册实体为 ElectraSteel, Inc.，总部设在科罗拉多州 Boulder 的 6400 Lookout Road, Suite 200。公司于 2020
              年由一个产业团队创立，旨在扩大关键实物原料供应，并盘活传统热法冶炼弃用的矿石。公司以 Electra 品牌（主域名为
              electra.earth）对外开展业务，专注于生产适用于电弧炉（EAF）炼钢的高纯度清洁铁（纯度
              99%），并提纯氧化铝、二氧化硅及锰等矿物联产品，无需承受传统化石燃料高炉的碳排放。后续所有运营与投资尽调都必须严格区分公司实体：在电动汽车充电网络、汽车电池分析软件以及公开上市的关键矿物精炼企业中，同时存在数家使用
              Electra 商号的不相关商业实体。
            claimRefs:
              - CO001
