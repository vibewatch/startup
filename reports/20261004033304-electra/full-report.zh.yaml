      - number: '5.4'
        title: 图表
        blocks:
          - type: callout
            title: 化学选择性助炼铁摆脱对高品位球团矿稀缺性的依赖
            body: >-
              Electra 电化学架构的核心突破在于绕开了制约传统直接还原铁（DRI）技术的苛刻矿石品位限制。氢基竖炉需要优质 DRI 级球团矿（Fe >67%，二氧化硅和氧化铝合计低于 2%），而 Electra
              的湿法冶金浸出工艺可处理含铁量低至 35% 的低品位矿石。这一能力使钢厂得以利用本土矿藏与矿山尾矿，释放数百万吨可用矿石供应，并保护生产免受高价外购球团矿溢价冲击。
            calloutType: insight
