figures:
  - id: FO001
    title: Electra 公司创立与生态系统发展时间线
    type: timeline
    summary: Electra 公司创立历程，以及广义 Electra 品牌生态同期在清洁经济领域的关键里程碑演进。
    data:
      items:
        - label: Electra 成立
          date: '2020-01-01'
          detail: Electra 于 2020 年创立，使命是利用化学与电能扩大关键材料供应。
          tone: positive
        - label: 确立使用条款
          date: '2025-03-24'
