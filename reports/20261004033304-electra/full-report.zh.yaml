      - number: '1.2'
        title: 组织架构、治理与生态边界
        blocks:
          - type: paragraph
            body: >-
              自 2020 年成立以来，Electra 组建了一支跨学科团队，汇集来自采矿、冶金、制造及前沿技术领域的专业工程技术人员、运营高管与商业负责人。尽管 Electra
              的公开渠道未列出具体高管姓名、董事会成员或委员会职责，但团队的运营范围已覆盖冶金矿石提取、电化学精炼、工业设施建设以及商业化规模下的工艺安全。与此同时，对更广泛行业动态的尽调整理出多家以 Electra
              为品牌活跃的公司：其中，Electra Vehicles, Inc. 主营 AI 驱动的电池管理软件与自适应控制；Electra Battery Materials Corporation（NASDAQ:
              ELBM）是一家加拿大上市公司，开发硫酸钴精炼与黑粉回收；Go-Electra 运营欧洲商用电动汽车快充网络；Trek/Electra 则生产消费级电动自行车。厘清这些核验边界，可避免将 ElectraSteel
              的低温电化学炼铁与外部软件平台或矿业上市公司的股权发行混为一谈。
