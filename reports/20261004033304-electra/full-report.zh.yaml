      - number: '8.2'
        title: 股权结构、清算优先权与融资架构
        blocks:
          - type: paragraph
            body: >-
              来自 Forge Global 的私募市场情报显示，根据公司提交的公司注册证书（COI），Electra（ElectraSteel, Inc.）于 2025 年 1 月完成了 Series B
              轮融资，预估投后估值为 $481.4 million。该 Series B 轮股票发行价为每股 $58.62，已发行 2,397,494 股，另有一笔每股 $46.90 的 Series B-1 批次（已发行
              850,361 股），对应累计披露融资金额为 $208.67 million。两个 Series B 批次均设有标准的高级 1.0x 非参与型清算优先权结构，无累积股息负担，亦无参与型股权积压。Tracxn
              估计，截至 2026 年，公司通过股权与债权融资累计获得 $299 million（含风险债与联邦拨款），据其报告截至 2026 年 7 月在职员工人数为 199 人。但老股流动性依然受限，交易量极小，公开市场对
              Electra 股权也缺乏独立的价格发现机制。因此，在获得独立股权融资轮次或商业债务契约确认之前，审慎的投资纪律要求对私募老股估值保持谨慎。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.3'
        title: 情景分析、可比同业与尽调诉求
        blocks:
          - type: paragraph
            body: >-
              为确立严谨的投资边界，我们把 Electra 放进乐观、基准与悲观三种运营情景中审视。在乐观情景下，Electra 成功验证商业化规模的试点通量，与一线钢厂（如 Nucor 或
              POSCO）敲定多年期具约束力的包销协议，并获得联邦拨款或美国能源部（DOE）贷款项目办公室的支持以降低资本成本，商业化工厂投产后支撑超过 $1.0 billion 的企业估值。在基准情景下，Electra
              达成了技术里程碑，但面临资本开支超支与工期延误，需要以 $400M 至 $500M
              的公允估值进行过桥融资，带来适度稀释。在悲观情景下，扩产瓶颈、缺乏竞争力的上网电价或绿钢绿色溢价回落，导致融资延期与降估值重组，将股权估值压缩至 $250M 以下。对比工业冶金与电池材料同业（如上市精炼商
              Electra Battery Materials
              Corp，据报道尽管获得加拿大政府资助，仍披露了严重的持续经营不确定性与资金困境），凸显出商业化前期工业加工资产固有的巨大流动性风险。在做出任何资本承诺之前，具体的尽调诉求必须聚焦于第三方工程验证、具约束力的客户采购订单以及现金跑道核验。
            claimRefs:
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
