      - number: '3.3'
        title: 转换成本、商业准入与护城河持久度
        blocks:
          - type: paragraph
            body: >-
              原生铁原料的定价与销售模式取决于全球大宗商品定价基准（如 62% 品位铁矿粉及生铁 /
              热压块铁指数），并根据杂质扣价、物流费用以及碳合规成本予以调整。运营电弧炉的钢厂需要高纯铁原料来稀释回收废钢中的有害杂质元素，从而为清洁原生铁带来了溢价空间。据 Electra 称，其电化学方法可产出 99%
              纯铁，同时提取氧化铝、二氧化硅及锰等有价值的矿物副产品，有望抵消部分运营成本。但要形成持久的定价权，必须完成数千吨级的商业化验证并锁定具约束力的包销协议。现有钢厂沉淀的重资产锁定，加上外购铁的大宗商品属性，意味着一旦现有供应商通过“天然气转氢气”DRI
              改造成功实现脱碳，Electra 将面临更高的被替代风险。
            claimRefs:
