            title: 原料灵活性构成核心技术护城河
            body: Electra 相比氢基 DRI 的核心竞争优势，在于其自述具备处理普通商品级低品位铁矿石的能力，无需选矿升级为高溢价的 DR 级球团矿，从而拓宽了原料来源。
            calloutType: insight
