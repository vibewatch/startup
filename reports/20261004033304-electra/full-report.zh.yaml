        title: 图表
        blocks:
          - type: callout
            title: 具约束力的包销协议与技术数据明确前，维持“继续研究”立场
            body: >-
              Electra
              自研的电化学提取技术为钢铁脱碳开辟了极具前景的路径，并得到顶级气候投资机构背书；但示范工厂缺少公开运营数据，且尚未落地具约束力的商业包销合同，现阶段无法直接给出“买入”建议。潜在投资人应持续跟进商业化里程碑，索取经审计的单体经济模型，并坚持分批次注资的投资纪律。
            calloutType: recommendation
