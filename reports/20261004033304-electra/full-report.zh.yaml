      - number: '3.2'
        title: 替代技术路线与实体混淆
        blocks:
          - type: paragraph
            body: >-
              清洁铁与关键矿物初创公司在不同的热力学路线上展开竞争，覆盖高温熔融氧化物电解、氢气直接还原以及湿法冶金工艺。新型清洁炼铁领域的直接同业包括采用高温熔融氧化物电解的 Boston
              Metal，以及在气基商业化直接还原领域占据主导的 Midrex 和 Tenova HYL。与此同时，市场情报与竞品数据聚合平台常将
              ElectraSteel（Electra.earth）与不相关实体混淆，包括欧洲电动汽车充电运营商 Electra、多伦多创业板 / 纳斯达克上市的 Electra Battery Materials
              Corporation（ELBM）、从事建筑服务的 Electra Ltd UK，以及新西兰配电公司
              Electra。这些重名干扰了第三方的自动化项目挖掘与股权筛选，将电池化学品精炼合同或充电桩铺设进度误当成清洁炼铁的业务进展。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
