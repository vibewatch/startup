  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价机制与包销承诺
        blocks:
          - type: paragraph
            body: >-
              Electra
              的核心商业模式围绕将矿物原料与未精炼矿石转化为高价值关键工业原料展开，涵盖电池级材料与清洁冶金产品。公司的商业变现主要依托长期工业供应协议与批量包销安排，而非软件订阅或现货散单零售。在关键矿物领域的工业精炼与材料加工环节，商业收入确认直接挂钩工厂投产、实物交付与客户准入认证。参考材料精炼生态中的可比商业合同（如与主流电池电芯制造商
              LG Energy Solution 签订的最新具约束力供应条款），包销承诺通常锁定一定产能份额（如跨越 2029 年并可顺延至 2032 年的多年期协议锁定约 60%
              规划产能），定价公式则跟随全球波动剧烈的金属基准价，并附加协议加工费。在工厂实质投产和实现商业交付之前，公司整体的实际商业收入仍为零，未来收入的可预见性完全取决于资金落地与具约束力的客户认证。
