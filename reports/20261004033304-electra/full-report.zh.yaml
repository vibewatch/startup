      - number: '7.3'
        title: 合作伙伴依赖、原料安全与客户集中度
        blocks:
          - type: paragraph
            body: >-
              Electra 的商业化逻辑取决于与运营电弧炉的北美钢厂的深度绑定，包括已公布的战略合作伙伴 Nucor 和 POSCO。由于这些合作方是商用清洁铁的核心需求渠道，Electra
              面临极高的交易对手集中度风险。关键在于，公开披露与官方声明中目前缺乏经核验的、具约束力的“照付不议”（take-or-pay）采购订单，或明确约定交付里程碑及保底价格的长期包销合同。若钢厂遭遇周期性利润率承压，或放缓采购高溢价绿色铁原料的节奏，Electra
              的商业收入爬坡将遭受重创。在供应端，尽管 Electra 处理低品位矿石的能力缓解了对稀缺高品位磁铁矿矿床的依赖，但从矿山口到未来精炼厂的区域物流与铁路运输经济性仍未经验证。
            claimRefs:
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
      - number: '7.4'
        title: 实体混淆甄别、资本结构与投资逻辑破灭诱因
        blocks:
          - type: paragraph
            body: >-
              评估 Electra 时面临的一大独特尽调挑战，在于资本市场、监管机构及行业媒体中普遍存在的企业重名现象。深入的企业排查发现了数家共享 Electra 字号的不相关实体，包括在安大略省建设钴精炼厂的多伦多
              Electra Battery Materials Corp.、正与 Iron Horse Acquisition II Corp. 合并的汽车软件商 Electra Vehicles、法国电动汽车快充运营商
              Electra，以及肿瘤生物科技公司 Electra Therapeutics。开展尽调的分析师必须审慎核实监管申报、财务指标及高管声明，防止将无关实体的信息误扣至 ElectraSteel,
              Inc.。ElectraSteel
              核心投资逻辑破灭的诱因包括：未能获批数百兆瓦级的公用事业电网接入、试点连续运行期间电极老化问题无法解决，或在下一个融资周期内无法将与钢厂的非约束性合作转化为具约束力的商业包销合同。
            claimRefs:
              - CR014
              - CR015
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 资本密集度与商业化设施扩产门槛
            body: 将电化学炼铁从试点批次推向商业化工厂产能，需要数亿美元的资本开支、确定的公用事业电网接入，以及经核验的持续稳定运行时间，而这些仅凭公开申报文件无法得到证实。
            calloutType: risk
            claimRefs:
              - CR005
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、立场与决策框架
        blocks:
          - type: paragraph
            body: >-
              Electra 的投资逻辑聚焦于商业化一套低温电化学工艺：利用可再生电力将低品位铁矿石转化为 99% 纯铁，绕开化石燃料高炉，为电弧炉（EAF）钢厂打通直接脱碳路径。其战略定位得到了顶级机构与产业资本的背书，包括
              Breakthrough Energy Ventures、Amazon 的 Climate Pledge Fund、Temasek、Capricorn Investment Group 以及 BHP
              Ventures。然而反向逻辑同样充分：Electra 尚未公布经审计的商业化工厂通量、单体生产经济模型或具约束力的包销承诺。关键在于，严谨的尽调必须将 ElectraSteel, Inc. 与共享
              Electra 名称的多家商业及上市主体彻底剥离——包括 Electra Battery Materials Corporation（NASDAQ: ELBM）、Electra
              Vehicles、Go-Electra 以及 Trek 旗下的 Electra
              自行车业务。鉴于公司未公开披露收入，亦缺乏经确认的试点运营数据，在试点通量、客户合同及明确的商业化融资结构得到验证之前，我们维持“继续研究”的投资建议、高风险评级与未知估值立场。
            claimRefs:
