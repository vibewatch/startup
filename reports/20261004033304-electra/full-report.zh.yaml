  - id: FV001
    title: 投资建议决策与尽调推进逻辑路径
    type: flow
    summary: 串联技术实证、市场风险与估值变量，最终推导得出尽调建议的决策逻辑链。
    data:
      nodes:
        - label: 1. 核心技术实证
          tone: positive
        - label: 2. 战略财团背书支持
          tone: positive
        - label: 3. 商业落地与资本风险
          tone: risk
        - label: 4. 估值与流动性评估
          tone: warning
        - label: 5. 投资建议：继续研究
          tone: neutral
        - label: 6. 核心尽调触发条件
          tone: opportunity
      edges:
        - from: 1. Core Technology Proof
          to: 2. Strategic Syndicate Support
          label: 吸引顶级投资方
        - from: 2. Strategic Syndicate Support
          to: 3. Commercial Execution & Capital Risks
          label: 面临规模化瓶颈
        - from: 3. Commercial Execution & Capital Risks
          to: 4. Valuation & Liquidity Assessment
          label: 传导至估值风险
        - from: 4. Valuation & Liquidity Assessment
          to: '5. Recommendation: Research-More'
          label: 决定最终投资立场
        - from: '5. Recommendation: Research-More'
          to: 6. Key Diligence Triggers
          label: 明确下阶段行动
    approximationNotes: 流程图展示决定投资判断的线性关卡序列。
