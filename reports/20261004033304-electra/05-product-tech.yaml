  title: "Product & Technology"
  summary: "Electra operates a proprietary electrochemical hydrometallurgical and electrowinning process to convert commercial and lower-grade iron ores into 99% pure clean iron at low temperatures using renewable electricity and zero carbon monoxide emissions. However, diligence confirms extensive corporate naming fragmentation across industrial electrification sectors, underscoring that verified multi-ton commercial demonstration throughput, pilot operating unit metrics, and production economics remain active diligence gaps."
sections:
  - id: "process-architecture-and-operating-mechanism"
    title: "Process Architecture and Electrochemical Operating Mechanism"
    body: "Electra operates an electrochemical refining platform designed to extract clean iron and mineral co-products directly from raw and low-grade iron ores without carbon-intensive smelting. Conventional primary steelmaking relies on blast furnaces operating at approximately 1,600°C fueled by metallurgical coal, emitting roughly two tons of carbon dioxide per ton of liquid iron produced. In contrast, Electra's chemical leaching and electrowinning architecture dissolves iron oxide from ores at low temperatures (below 100°C) using liquid chemistry, followed by electrochemical separation powered entirely by renewable electricity [CE001, CE003]. The cathode reaction deposits solid metallic iron plates reaching 99% elemental purity, which are mechanically stripped and suitable for direct charging into Electric Arc Furnaces (EAF) or downstream powder metallurgy applications [CE002]. A core structural differentiator of Electra's chemical pathway is feedstock flexibility: conventional direct reduced iron (DRI) shaft furnaces require high-grade pellet ores (>67% Fe) with strict silica and alumina limits, whereas Electra's hydrometallurgical process accepts low-grade ores (down to 35–45% Fe) and ores with high gangue content that traditional steelmakers leave behind as tailings [CE003, CE005]. Furthermore, Electra's flow-sheet recovers valuable mineral by-products from the same ore volume, including separated alumina, silica, and manganese streams, improving the effective material recovery yield per ton mined [CE001, CE004]. Operational monitoring at pilot scale relies on industrial process automation, distributed control systems, and continuous chemical sensing to balance electrolyte pH, current density, and cell voltage [CE006]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
