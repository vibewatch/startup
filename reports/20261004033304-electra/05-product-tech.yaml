callouts:
  - calloutType: "insight"
    title: "Chemical Selectivity Decouples Ironmaking from High-Grade Pellet Scarcity"
    body: "The central breakthrough of Electra's electrochemical architecture is its ability to bypass the stringent ore grading constraints that bottleneck traditional Direct Reduced Iron (DRI) technologies. While hydrogen-based shaft furnaces demand premium DRI-grade pellets (>67% Fe with less than 2% combined silica and alumina), Electra's hydrometallurgical leaching functions across low-grade ores down to 35% iron content. This capability allows steelmakers to process domestic deposits and mining tailings, expanding usable ore supply by millions of tons and shielding production from scarce merchant pellet premiums."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE005"
  - calloutType: "risk"
    title: "Diligence Complexity Arising from Industrial Name Collisions"
    body: "Public records and capital markets exhibit high brand collision around the 'Electra' name. Investors must separate ElectraSteel, Inc. (Boulder, CO-based private clean iron producer, electra.earth) from Electra Battery Materials Corp. (TSX-V/NASDAQ: ELBM, Ontario cobalt sulfate refinery), Electra.aero (hybrid-electric aviation developer), and consumer mobility entities subject to CPSC safety recalls. Conflating public battery refinery announcements, federal EV grants, or aircraft contracts with Electra's ironmaking operations represents a material diligence failure."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
