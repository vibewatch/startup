  - id: "industrial-use-cases-and-entity-fragmentation"
    title: "Industrial Workflows, Implementation Risks, and Corporate Disambiguation"
    body: "Evaluating Electra's commercial readiness requires integrating its output into existing steelmaking and mineral refining workflows, while carefully disambiguating public corporate entities operating under the 'Electra' trade name. In the target steelmaking workflow, clean iron plates bypass the sintering and blast furnace steps, integrating directly into EAF charging buckets alongside recycled steel scrap [CE002, CE003]. This eliminates Scope 1 and Scope 2 emissions from primary ironmaking, provided the upstream electrowinning cells run on clean power [CE001]. However, independent diligence reveals severe entity fragmentation across public corporate filings and news records: multiple unaffiliated companies operate as 'Electra', including Toronto-based critical minerals and battery materials refiner Electra Battery Materials Corp. (TSX-V: ELBM / NASDAQ: ELBM) [CE008, CE010], aviation hybrid-electric aircraft developer Electra.aero [CE011], utility engineering software Electra Power Line Design [CE012], and financial software provider Electra Information Systems (acquired by Gresham Technologies) [CE013]. Public regulatory safety filings also record product recalls for consumer electric bicycles sold under the Trek/Electra brand due to mechanical component defects [CE009]. Consequently, investors must rigorously separate ElectraSteel, Inc.'s proprietary Boulder-based clean iron technology (electra.earth) from public mining refiners or mobility developers [CE007, CE008, CE011]. Unresolved diligence priorities center on obtaining verified pilot throughput data, continuous cell operating hours, and commercial plant capex benchmarks [CE003, CE008]."
