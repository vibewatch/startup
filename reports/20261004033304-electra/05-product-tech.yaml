  - id: "product-matrix-and-technical-differentiation"
    title: "Product Output Matrix and Technical Differentiation"
    body: "Electra's planned commercial outputs span two distinct categories: high-purity metallic iron products and refined industrial mineral co-products. The primary product is 99% pure clean iron plates or briquettes, specifically formulated as virgin iron unit feedstock for secondary electric steelmakers [CE002, CE003]. By substituting clean iron for scrap or coal-based pig iron, EAF steelmakers can produce high-specification flat-rolled automotive and electrical steels that otherwise require virgin iron units to dilute tramp residual elements (such as copper, tin, and nickel) [CE002]. Secondary output streams comprise precipitated battery-grade alumina, refined silica for industrial construction applications, and manganese concentrates [CE001, CE004]. This co-production capability establishes a differentiated revenue and cost-offset profile compared to single-product pelletizers or traditional shaft furnaces [CE004, CE005]. Nevertheless, technical differentiation is governed by strict energy balance and reagent recycling efficiency: electrochemical dissolution and electrowinning are inherently electricity-intensive processes, requiring continuous access to low-cost renewable power to maintain competitive operating costs against fossil-based hydrogen DRI [CE001, CE003]. In addition, industrial deployment requires robust environmental safeguards to prevent chemical leaks, maintain closed-loop acid and solvent containment, and ensure compliance with occupational safety standards in hydrometallurgical processing environments [CE006, CE007]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
