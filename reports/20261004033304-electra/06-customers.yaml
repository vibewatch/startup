chapter:
  number: 6
  title: "Customers"
  summary: "Electra's public site defines plausible industrial users for its high-purity iron and mineral products, but the assigned evidence does not identify a target-company customer, deployment, contract, adoption metric, retention measure, or concentration disclosure. Most customer-search results concern unrelated businesses named Electra, so commercial validation remains a material diligence gap rather than proof of traction."
sections:
  - id: "target-users"
    title: "Potential buyers are visible; actual customers are not"
    body: >-
      Electra's official site presents a materials proposition rather than a documented
      customer roster. It says the process produces high-purity iron plus alumina, silica,
      and manganese, and describes the iron as an input for Electric Arc Furnace steel,
      batteries, and magnets. Those use cases imply potential buyer groups in steelmaking
      and advanced-material supply chains, but they do not establish who buys, pays for, or
      currently uses Electra's output. The fetched homepage names no customer, partner,
      pilot, shipment, geography, account count, or revenue band. Accordingly, the
      segmentation below is a product-to-user hypothesis, not an observed customer mix,
      and strategic value cannot yet be tied to revenue or production deployment.
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU006"
    tableRefs:
      - "TU001"
  - id: "adoption-proof"
    title: "The public record does not establish adoption"
    body: >-
      The strongest adoption signal in the assigned pool is still a product specification:
      Electra claims 99% pure iron and identifies downstream applications. The same fetched
      official material provides no active-use count, repeat order, qualified location,
      utilization rate, commercial shipment, or dated deployment milestone. This distinction
      matters because a use case is not a customer, and a product claim is not evidence of
      production acceptance. The evidence therefore supports only the top of a possible
      industrial qualification journey. Every later step—from sample testing through a
      binding offtake and repeat purchasing—remains unverified in this chapter's allocated
      material and should be tested in the data room.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU013"
      - "CU016"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-proof"
    title: "Name collisions are not customer references"
    body: >-
      The assigned searches returned several apparently specific relationships, but entity
      review excludes them from ElectraSteel customer proof. Electra Battery Materials
      Corporation is a Canadian battery-materials refiner whose filing and press coverage
      discuss LG Energy Solution and Glencore. ELECTRA AI's paid release concerns battery
      intelligence for Omega Seiki Mobility. Veeam's case study concerns an Israeli
      construction and infrastructure group. The CPSC result concerns Trek and Electra
      electric bicycles. These records are useful only as disambiguation controls: none
      evidences a customer, pilot, shipment, renewal, or commercial outcome for the
      Boulder-based ElectraSteel entity identified in the official terms.
    claimRefs:
      - "CU001"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
    tableRefs:
      - "TU003"
  - id: "durability-and-concentration"
    title: "Durability and concentration remain private-evidence questions"
    body: >-
      No target-specific source in the assigned pool reports NRR, GRR, churn, renewal,
      contract duration, repeat purchase, satisfaction, customer concentration, channel
      dependence, or procurement conversion. That absence in the reviewed material is not
      proof that Electra has no pilots or agreements; it means those relationships cannot be
      underwritten from this evidence set. The central customer risk is therefore evidentiary:
      investors cannot distinguish exploratory interest from qualification, paid pilot,
      binding purchase commitment, or recurring production use. Diligence should obtain a
      legal-entity-matched contract register, customer-confirmed qualification results,
      shipment records, pricing and volume obligations, termination rights, renewal history,
      and top-counterparty exposure before assigning commercial traction or durability.
    claimRefs:
      - "CU014"
      - "CU015"
      - "CU016"
