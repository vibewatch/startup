companyProfile:
  summary: >-
    ElectraSteel, Inc. (brand Electra) is a Boulder-based clean-iron developer founded in 2020 that uses electrochemical
    low-temperature processing to convert lower-grade ore into 99% pure iron and mineral co-products. The company is
    aimed at Electric Arc Furnace steelmakers and adjacent industrial materials buyers, but its operating model remains
    pre-commercial and its private disclosures leave key financial and customer terms unresolved.
  foundedDate: '2020-01-01'
  foundingLocation: Boulder, Colorado, USA
  headquarters: Boulder, Colorado, USA
  productSummary: >-
    Low-temperature electrochemical production of 99% pure clean iron plus alumina, silica, and manganese co-products
    from lower-grade ore.
  customerFocus: Electric Arc Furnace steelmakers and adjacent battery, magnet, and industrial materials buyers
  businessModel: Long-term industrial offtake and mineral co-product sales, with no verified public commercial revenue yet
  stage: Series B
