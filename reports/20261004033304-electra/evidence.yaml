evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: Audited balance sheet, post-money Series B valuation documentation, and verified cash runway figures.
    whyItMatters: >-
      Essential for financial solvency modeling and evaluating runway against capital-intensive clean-iron commercial
      plant buildout.
    diligencePath: Request confidential disclosure from Electra management or verified lead institutional venture investors.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: Itemized executive officer roster, board of directors committee composition, and equity allocation schedules.
    whyItMatters: Identifies key-person dependencies and executive leadership retention through long-cycle industrial demonstration.
    diligencePath: >-
      Review corporate charter filings with Colorado Secretary of State or request an executive organization chart under
      NDA.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Complete investor syndicate ownership schedule, shareholder voting agreements, and strategic partner offtake
      terms.
    whyItMatters: Determines corporate control, liquidation preferences, and commercial adoption commitments from major steelmakers.
    diligencePath: Review capitalization table and major customer Memoranda of Understanding in virtual data room.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: demonstration-scale-throughput
    missingEvidence: >-
      Audited third-party verification of continuous clean-iron production throughput, electrical consumption per metric
      ton, and chemical purity at multi-ton commercial demonstration scale.
    whyItMatters: >-
      Without independent operating data, merchant iron sizing and adoption forecasts remain speculative and reliant on
      company-disclosed laboratory benchmarks.
    diligencePath: >-
      Review engineering logs and third-party technical advisor reports from Electra's commercial demonstration facility
      pilot runs.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: clean-iron-cost-benchmarks
    missingEvidence: >-
      Third-party audited levelized cost per ton comparison between Electra electrowinning, green hydrogen DRI, and
      BF-BOF.
    whyItMatters: >-
      Direct commercial adoption by steelmakers hinges on the total cost of delivered iron units inclusive of
      electricity and capital depreciation.
    diligencePath: Request customer pilot economic models and FEED study engineering outputs under NDA.
    relatedQuestionRefs:
      - QP001
      - QP005
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pilot-throughput-verification
    missingEvidence: >-
      Third-party audited pilot plant operating metrics, including continuous operating hours, cell current efficiency
      (%), specific energy consumption (kWh/t iron), and daily throughput tonnage.
    whyItMatters: >-
      Electrochemical ironmaking unit economics and commercial viability against traditional blast furnace and gas-based
      DRI routes depend directly on cell energy efficiency and electrode durability.
    diligencePath: >-
      Request engineering run logs, electrolyte sampling data, and independent technical expert reviews from Electra's
      Boulder demonstration facility under non-disclosure agreement.
    relatedQuestionRefs:
      - QE001
      - QE004
      - QE005
  - type: missing-source
    severity: material
    topic: co-product-market-economics
    missingEvidence: >-
      Purity assay reports and economic recovery models for precipitated alumina, silica, and manganese co-product
      streams.
    whyItMatters: >-
      If co-product mineral streams cannot meet buyer chemical specifications, their disposal represents a cost
      liability rather than an economic credit against ironmaking expenses.
    diligencePath: >-
      Request customer assay verification certificates, precipitation flowsheets, and draft commercial offtake contracts
      for mineral co-products.
    relatedQuestionRefs:
      - QE002
      - QE003
  - type: conflicting-data
    severity: minor
    topic: corporate-naming-disambiguation
    missingEvidence: >-
      Confirmation of trademark boundaries and public communication protocols separating ElectraSteel, Inc. from public
      mining and aviation entities named Electra.
    whyItMatters: >-
      Public news aggregators, retail investors, and automated diligence scanners frequently conflate Electra's clean
      iron operations with ELBM stock announcements and aviation contracts.
    diligencePath: >-
      Review Electra's USPTO trademark registrations, brand licensing agreements, and corporate filings to establish
      legal entity isolation.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A legal-entity-matched customer and prospect register showing stage, buyer, use case, geography, volume, and
      commercial status.
    whyItMatters: Without target-company attribution, lookalike announcements can be mistaken for Electra customer traction.
    diligencePath: Obtain the CRM export and contract register, then confirm a sample directly with named counterparties.
    relatedQuestionRefs:
      - QU002
      - QU003
      - QU006
    relatedTableRefs:
      - TU002
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Complete target-company inventory of qualifications, pilots, deployments, shipments, purchase orders, and binding
      offtakes.
    whyItMatters: The public pool cannot distinguish early interest from production adoption or recurring demand.
    diligencePath: Reconcile management's pipeline to signed agreements, invoices, shipment records, and customer confirmations.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Customer cohorts, repeat-order history, renewal and termination records, contract duration, GRR, NRR, churn, and
      satisfaction data.
    whyItMatters: Durability cannot be assessed from product-use claims or unverified prospect interest.
    diligencePath: Review cohort-level orders and contracts and interview counterparties about qualification and renewal decisions.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Revenue, contracted volume, pipeline value, and dependency by customer, channel, and counterparty.
    whyItMatters: A small number of industrial counterparties could dominate commercialization, financing, and procurement timing.
    diligencePath: >-
      Request top-counterparty schedules with committed versus non-binding volume, conditions, cancellation rights, and
      expected timing.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: minor
    topic: adverse-search
    missingEvidence: Target-specific independent evidence on complaints, failed pilots, cancelled qualifications, or customer disputes.
    whyItMatters: >-
      The adverse result in the assigned pool is a bicycle-brand collision and cannot establish either presence or
      absence of ElectraSteel customer problems.
    diligencePath: >-
      In a future authorized search allocation, use the ElectraSteel legal name and named counterparties in adverse and
      procurement-record queries.
    relatedQuestionRefs:
      - QU007
  - type: private-evidence-only
    severity: material
    topic: Binding offtake agreements
    missingEvidence: >-
      Confirmed execution terms, pricing formulas, and minimum volume purchase obligations for commercial iron offtake
      with steelmakers.
    whyItMatters: >-
      Without binding offtake agreements, commercial facility project financing cannot be secured and revenue forecasts
      remain speculative.
    diligencePath: >-
      Request confidential customer bilateral master sales agreements and offtake term sheets during management
      diligence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR003
  - type: enumeration-incomplete
    severity: material
    topic: Regulatory / legal risk register
    missingEvidence: >-
      Comprehensive environmental impact statement, air permits, and local zoning approvals for Electra's
      commercial-scale iron refining facility.
    whyItMatters: >-
      Permitting delays and localized community opposition represent primary schedule-slip risks for capital-intensive
      industrial facilities.
    diligencePath: >-
      Obtain environmental site assessment reports, state regulatory pre-filing correspondence, and legal permitting
      roadmap from company counsel.
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Third-party audited plant operating metrics including kWh electricity consumed per ton of iron produced,
      electrolyte recovery rates, and net production cost.
    whyItMatters: >-
      Without verified unit economics and energy consumption metrics, commercial competitiveness against traditional
      blast furnace and DRI routes cannot be confirmed.
    diligencePath: >-
      Request confidential pilot plant technical diligence reports, mass-balance sheets, and FEED study engineering data
      under non-disclosure agreement.
    relatedQuestionRefs:
      - QV007
