callouts:
  - calloutType: risk
    title: "Top Risk: ASRA + Export Controls Create a Compounding Western Market Closure Scenario"
    body: >-
      If ASRA passes and BIS tightens AI chip export restrictions simultaneously, Agilink
      faces a scenario in which US federal procurement is banned, enterprise procurement
      self-regulates to the same constraint, and the AI inference hardware required for
      international product configurations faces a licence barrier. Neither risk is individually
      fatal, but their convergence — both plausible within a 12-18 month horizon given current
      legislative momentum — could effectively close the Western addressable market before
      Agilink builds durable revenue outside Agibot's domestic ecosystem.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004

  - calloutType: risk
    title: "Structural Risk: Agibot Dependency Makes Agilink's Independence Thesis Untested"
    body: >-
      Agilink's investment case rests on independence from Agibot: its own capital, sales
      motion, and product roadmap. However, at incorporation Agibot held 80% equity, Deng
      Taihua (Agibot's chairman) was Agilink's legal representative, and Agilink's data and
      talent pipeline originated in Agibot's robotics division. No reviewed source confirms
      a transition of these dependencies to arm's-length terms. Until Agilink discloses a
      data-licensing agreement, an independent board, and a customer base beyond Agibot's
      deployment ecosystem, the independence thesis is a stated roadmap — not a confirmed
      operational reality.
    claimRefs:
      - CR034
      - CR035
      - CR037

  - calloutType: insight
    title: "Evidence Gap: No Disclosed Safety Certification Path Creates Persistent Product Liability Ambiguity"
    body: >-
      OSHA has no specific standards for robotics. ISO 10218-1 was withdrawn. ISO/TS 15066
      does not address multi-DOF dexterous hands. Hill Dickinson's 2026 legal analysis frames
      the resulting liability question — manufacturer vs. operator vs. AI provider — as
      currently unsettled. Without a disclosed safety certification roadmap, any Agilink
      deployment in a G7 jurisdiction carries open-ended product liability exposure that
      investors and enterprise customers cannot currently price. This is a pre-investment
      diligence ask, not merely a monitoring item.
    claimRefs:
      - CR007
      - CR008
      - CR015

