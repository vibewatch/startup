  - id: operational-and-dependency-risk
    title: Operational, Dependency, and Financial Risk
    body: >-
      Agilink's most structurally concentrated risk is its relationship with parent Agibot.
      Public corporate registry summaries confirm that Agibot retained approximately 80% of
      Agilink at incorporation on January 14, 2026, with Agibot chairman and CEO Deng Taihua
      as legal representative. Four external funding rounds have diluted Agibot's position,
      but the exact post-dilution ownership is not publicly disclosed. The implications are
      material: Agilink's R&D talent, manufacturing capacity, data-collection infrastructure
      (via Agibot's 10,000+ deployed robots), and early revenue channel all run through the
      parent. An Agibot governance failure, capital event, or strategic pivot would directly
      impair Agilink's continuity.

      The investor base amplifies state-adjacent concentration risk. Yicai Global confirmed
      that Agibot's investor roster includes BYD, SAIC Motor, BAIC Group, JD.com, and
      Tencent. Agilink's own syndicate includes SAIC Financial Holdings and Joyson Electronics
      (both strategic, publicly listed industrial investors). State-owned enterprise exposure
      at this level creates CFIUS-analogous scrutiny risk for any contemplated US or European
      secondary transaction, and it introduces the possibility that commercial decisions at
      Agilink could be subject to state-enterprise governance considerations.

      Supply-chain risk is compounded by BIS export controls on advanced computing ICs.
      While the specific embedded inference chipsets in OmniHand are not publicly named,
      Agilink's AI-driven tactile control loop requires inference hardware that may fall
      within EAR restrictions. If domestic Chinese semiconductor alternatives cannot
      match performance thresholds, Agilink faces either technical regression or licence
      dependency for international product configurations.

      Financially, Agilink's valuation exceeds $1 billion against a revenue proxy of
      50-200 million RMB (~$7-27 million USD), implying a speculative multiple consistent
      with investor pricing-in of future scale and software optionality. Goldman Sachs
      identified 15-20% annual production cost reduction as the viability threshold for
      robotics hardware economics. Without disclosed gross margin, burn rate, or working
      capital data, residual financial risk cannot be quantified. The IFR has noted that
      traditional industrial robots remain faster and more reliable for repetitive precision
      tasks than humanoids, raising the risk that the addressable market for dexterous
      hands in conventional industrial automation is narrower than the total robotics market
      implies. Crunchbase placed Agilink's May 2026 unicorn step-up in a cohort of five
      Chinese robotics unicorns in a single month, suggesting potential valuation
      cluster-formation risk if sector sentiment reverses.
