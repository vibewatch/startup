              - CP033
              - CP034
          - type: callout
            title: RobotEra XHAND1 Direct-Drive 架构获得顶级技术客户背书
            body: >-
              RobotEra 的全 direct-drive XHAND1 声称“行业首创”，并已被 Boston Dynamics、NVIDIA 和 Apple
              作为硬件采用——这三家是全球机器人生态中技术要求最高、最能赋予可信度的客户之一。截至 2026 年 6 月，Agilink 的腱绳驱动 OmniHand 3 Ultra-T
              尚未发布可比的独立客户验证。这种第三方技术可信度的不对称，是 Agilink 企业定位近期最实质的竞争风险。
            calloutType: risk
