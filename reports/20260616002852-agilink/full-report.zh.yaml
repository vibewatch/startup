      - number: '1.4'
        title: 产品栈、出货规模与里程碑
        blocks:
          - type: paragraph
            body: >-
              Agilink 的商业化逻辑建立在两个相连主张上：它从 Agibot 手部单元继承了可信产品基础，并且已经把该基础放大到远超实验室体量。公司和媒体材料称，团队在 2025
              年量产了多款手部产品，拆分前季度销量已达数千。公开产品引用显示，OmniHand 2025 是一款紧凑型 16-DoF 手，具备 10 个主动和 6 个被动自由度，重量低于 500 克，支持 CANFD 连接和
              ROS 2，并有 400 多个触觉感知点；OmniHand Pro 2025 升级到 19 个总 DoF，定位工业操作，价格更高。APC 2026 随后发布 OmniHand 3 Ultra-T，Agibot
              将其描述为 22+3 DoF 腱绳驱动旗舰，具备 3D 触觉感知、掌心相机、低于 0.3 秒响应和 10:1 负载自重比。到 2026 年 5 月，Pandaily、Gasgoo、Humanoids Daily
              等媒体报道称，累计交付超过 8,000 只灵巧手和 10,000 个夹爪，用例覆盖工业自动化、物流、服务机器人和特种作业。即便如此，公开披露仍缺少
              ASP、毛利率、故障率、质保条款和客户集中度，因此出货标题应被视为规模证据，而不是可持续经济性的证明。
