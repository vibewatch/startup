            body: >-
              Ultra-T 的 10:1 负载重量比、低于 0.3 秒响应时间和「全手 3D 触觉传感」，只来自 Agibot 的 APC 2026
              新闻稿，没有独立复现、客户确认或披露测试协议。机器人硬件发布常常无法在独立评估中达到宣传规格。投资者和集成商应在第三方验证出现前，把 Ultra-T 数字视为愿景性目标。
