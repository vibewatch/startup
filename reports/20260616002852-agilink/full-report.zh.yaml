      - number: '3.3'
        title: 中国商用灵巧手竞争对手
        blocks:
          - type: paragraph
            body: >-
              RobotEra（北京，2023 年 8 月成立）是 Agilink 在中国商用细分中最直接的竞争挑战。其 XHAND1 提供 12 个主动 DOF，标价 $14,000，重量 1.1 kg，尺寸
              191×94×47 mm，握力能力 25 kg，集成触觉和力感知，并采用齿轮驱动力控关节架构。关键在于，RobotEra 公开把 XHAND1 的全 direct-drive 架构定位为“行业首创”，且在
              Agilink 宣布拆分之前，Boston Dynamics、NVIDIA 和 Apple 已采用该硬件——这三家是机器人领域技术要求最高的客户之一。RobotEra 2026 年 4 月合计超过 $200
              million 的融资（由物流巨头 SF Group 领投，IDG Capital、Hillhouse、Sequoia China 和 CICC Capital 参投），以及与 China Post 和 SF
              Express 合作在 10 多个物流中心同时部署机器人，凸显其生态的资金实力和真实落地牵引。RobotEra 于 2026 年 Q2 启动千台级交付，并预计年化增长 300%。Inspire
              Robots（北京因时机器人科技有限公司，2016 年成立）主要面向中国国内工业市场制造精密微型伺服执行器和灵巧手。产品组合包括 RH56 家族（BFX、DFX、E2、F1）和 EG2 系列夹爪。截至 2026
              年 6 月，英文产品文档无法通过直接 URL 抓取访问，限制了独立国际尽调；所有规格和定价信息仅有中文。Inspire Robots 是中国 humanoid integrators 广泛引用的 OEM
              部件供应商，意味着它供应由其他公司贴牌的手——这使其既是 Agilink 相邻领域的竞争者，也可能是供应商。Fourier Intelligence（上海，2015 年成立）提供 GR-2 humanoid，总计
              53 个自由度，包括每只手 12 DOF 和每只手 6 个阵列式触觉传感器。完整 GR-2 系统价格约 $100,000+，因此不是直接按单手价格竞争的对手；但其 SoftBank 背书（累计融资
              $200M+、估值 $800M+、员工 800+、2025 年出货 500+ 台）以及医疗康复和工业制造双重重点，会对企业客户获取形成有意义的渠道冲突。Unitree Robotics（杭州）于 2026 年 4
              月推出 R1 双臂 humanoid，起价 $3,930（¥26,900），成为市场上成本最低的完整机器人操作平台。R1 支持可替换末端执行器，包括二指、三指和五指灵巧手，并支持手臂组件 15 至 31 个可配置
              DOF。Unitree 报告 2025 年收入增长 335.4%，humanoid 业务成为最大收入板块；公司已向上海 STAR Market 递交最高 ¥4.2 billion 的 IPO 申请。
