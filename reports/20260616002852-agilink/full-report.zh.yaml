      三层金字塔展示全球人形机器人 TAM、中国灵巧手 SAM 代理值，以及基于当前产品范围和授权模式估算的 Agilink 近期 SOM。
    data:
      nodes:
        - id: tam
          label: 全球人形机器人硬件 TAM
          value: $2.92B–$15.26B (2025); $15.26B–$38B (2030–2035)
          level: 1
        - id: sam
          label: 中国灵巧手 SAM（代理：中国子市场 × 10–15% 手部成本占比）
          value: $40M–$60M (2025); $280M–$420M (2030) — unvalidated proxy estimate
          level: 2
        - id: som
          label: Agilink SOM（近期，作者基于公开数据估算）
          value: Undisclosed; bounded by Agibot platform share and licensing pipeline
          level: 3
    approximationNotes: |
      SAM 和 SOM 是作者推导的代理估算；没有独立分析师覆盖单独的灵巧手市场。SAM = 中国人形机器人市场 × 假设末端执行器占比 10–15%（未验证）。SOM 为定性判断；Agilink 未披露收入目标或单位销量。
