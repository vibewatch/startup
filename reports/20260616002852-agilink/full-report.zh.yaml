      - number: '8.2'
        title: 可比估值组：全系统、部件层与中国市场
        blocks:
          - type: paragraph
            body: >-
              为 Agilink 构建相关可比组，必须拆成三层：西方全系统人形机器人、中国全系统人形机器人，以及中国部件层供应商。每一层的收入画像、战略逻辑和市场折价都不同。

              西方全系统组（Figure AI、Apptronik、Agility Robotics、1X Technologies）估值分散很大，从 Agility 的 $1.75 billion 到 Figure AI 的
              $39 billion。Figure AI 2025 年 9 月 Series C——由 Parkway Venture Capital 领投，Sacra 档案确认 post-money 估值超过 $39
              billion——是单一投资人标记驱动的异常值，二级市场参与有限，不能作为可靠的行业锚。Apptronik 2026 年 2 月的 $5 billion 估值（公司官方新闻稿；SEC Form D 印证了相关
              Series A Special Purpose Vehicle）由更广泛财团支持，战略投资人包括 Google DeepMind、Mercedes-Benz、John Deere 和 Qatar
              Investment Authority。Agility Robotics 在 Series C 后约 $1.75 billion post-money，按总融资规模看是最接近 Agilink
              的结构性可比，但其部署记录（GXO/Amazon Fulfillment）和全系统产品范围，使它只能部分类比。

              中国市场里，Unitree 是唯一有公开申报收入数据的公司：2025 年收入超过 17 亿元人民币（$235 million），同比增长 335%，净利润超过 6 亿元人民币（$83
              million），支撑其拟募资 $580 million 的上交所科创板 IPO。Unitree 隐含的 IPO 阶段倍数（按募资额相对于科创板先例估算，为 2025 年收入的
              8–12x）为行业倍数提供了最扎实的下限。Agibot（Agilink 母公司）在 2025 年 8 月 LG/Mirae Asset 轮按 Pandaily 报道 pre-money 估值超过人民币 70
              亿元（约 $960 million），Tracxn 则引用了更近期的 $6.4 billion 估计。部件层里，Tianji 2026 年 5 月的 $1.5 billion Series B，是 Agilink
              自身融资轮最相关的结构性可比。
