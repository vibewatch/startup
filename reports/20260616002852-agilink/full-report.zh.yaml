  - id: TV006
    title: 最终尽调清单
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 责任人 / 尽调路径
    rows:
      - - 收入和毛利率
        - 任何期间都未披露 ASP 组合、总收入、毛利率或烧钱速度
        - 没有可核验收入基底，无法承销 $1B 标记；37–100x 倍数带有投机性
        - 向领投方（Hillhouse）索取管理账；调取 CSRC 登记中的任何自愿披露
      - - 股权结构和轮次条款
        - 四轮融资的投前估值与投后估值；清算优先级；反稀释条款；员工期权池
        - 无法定价入场稀释，也无法评估降价轮场景下的保护
        - 直接询问 CFO / 法律顾问；查询 CSRC 国家企业信用信息公示系统
      - - 客户集中度（关联方与外部）
        - 未拆分来自 Agibot（关联方）与独立客户的收入
        - 决定护城河是真实存在，还是依赖持股 80% 的母公司渠道
        - 访谈非 Agibot 客户；要求分部报告
      - - IP 归属和 Agibot 授权条款
        - 手部相关专利和设计权；从 Agibot 承继 IP 的授权条款
        - Agibot 持股 80% 不等于独占 IP；授权终止是结构性风险
        - 专利律师审查 CNIPA 申请；合同尽调 IP 转让与授权
      - - 相对 Agibot 的竞争定价（关联方转移定价）
        - 出售给 Agibot 的灵巧手按市场价，还是低于市场的转移价格？
        - 转移定价操纵会人为抬高 Agilink 表观单位经济性
        - CFO 访谈；未来任何申报文件中的关联方披露；对标 Tianji 定价
      - - 可比运营指标基准
        - Unitree IPO 招股书（SSE 披露，2026）包含唯一公开可得的中国人形机器人运营指标
        - 为工业规模下单位经济性的真实水平提供最扎实的底部
        - 获取并分析 Unitree SSE 招股书（sse.com.cn）；与 IPO 分析师交叉核验
    notes: 尽调清单按对当前估值的重要性排序。第 1 和第 2 项会阻断当前阶段的任何资本承诺。
    claimRefs:
      - CV004
      - CV005
      - CV027
      - CV029
  - id: TV007
    title: 估值框架比较
    columns:
      - 框架
      - 最适用阶段 / 公司类型
      - 主要驱动因素
      - Agilink 代理值
      - 适用性评级
    rows:
      - - 收入倍数（P/S）
        - 已披露收入的硬件初创公司
        - 远期收入 5–15x
        - ~37–100x 隐含累计倍数（投机性）
        - 低——未披露收入
      - - 单位出货代理值
        - 早期、预收入硬件公司
        - ASP × 销量 × 估算利润率
        - $1B / 8K 台 = 每台已交付产品隐含 $125K
        - 中——仅作方向判断；出货量未经审计
      - - 平台 / AI 期权价值
        - AI 软件和基础模型公司
        - 生态杠杆；可防守的数据集和模型护城河
        - 授权平台变现后可达 20–50x
        - 高度理想化；尚未成为商业产品
      - - 可比私募轮次基准
        - 同阶段 VC 市场基准
        - 同赛道、同地域、同融资规模的近期可比公司
        - $1B 与中国组件层 B–C 轮区间相符（Tianji：$1.5B）
        - 中——在无收入数据下，这是最可用的锚
      - - 收购方战略价值
        - M&A 场景；技术收购
        - 对 NVIDIA、Tesla、Agibot 或 OEM 等效收购方而言，自有灵巧操作栈的价值
        - 难以估算；战略溢价真实存在但无法量化
        - 牛市情形下为高；没有披露 IP 目录则无法核验
      - - 相对全系统人形机器人的折价
        - 组件供应商对比全系统
        - 全系统集成商享有整机溢价；灵巧手约为 6 个主要子系统之一
        - 按全系统可比公司 10–15% 计，相对 Agility/Apptronik 隐含 $0.3–1.2B 公允区间
        - 中——结构性可用；受 Agilink 跨 OEM 潜力限制
    notes: 各框架并不互斥。本轮周期里的投资人标记混合了平台期权价值和可比基准，而不是收入倍数。表格只是比较视角，不是混合估值模型。
    claimRefs:
      - CV019
      - CV020
      - CV025
      - CV026
      - CV030
      - CV031
