      - number: '4.5'
        title: 资本充足性与烧钱节奏
        blocks:
          - type: paragraph
            body: >-
              Agilink 密集融资，不到五个月完成四轮。这种节奏即便按中国科技行业标准也不寻常，既反映制造扩产经济性的紧迫性，也反映投资人希望在竞争壁垒关闭前抢占灵巧手品类。此阶段硬件初创公司的烧钱速度通常为每月
              $500,000–$3 million，主要由工程团队薪酬、制造资本开支、部件采购和研发驱动。Agilink 计划资金用途（据公司口径来源）包括：开发可靠的通用灵巧执行平台、扩大规模化生产和交付能力、建设全栈
              AI 模型 / 数据能力。三条线都吃资本。

              Agilink 未披露现金余额、月度烧钱速度、债务融资额度或 runway。按估算累计融资额（基于至少三轮「数亿元」融资，可能 >5 亿元人民币），并假设硬件初创公司月烧钱 1,500 万–4,000
              万元人民币（按制造密集型研发放大），第四轮完成时（2026 年 5 月）的 runway 约为 12–36 个月。下限意味着 2027
              年底前资金需求会加速到来；上限假设运营精简且预收款回款强。下一轮触发点更可能绑定产线规模、新产品发布里程碑（OmniHand 3 放量）和潜在国际市场进入，而非盈利。公司没有披露债务或项目融资安排。

              资本充足性的关键风险在于，收入代理值转化为已收现金的速度。如果 Agibot 生态既是主要股东又是主导客户，来自母公司的贸易应收款可能累积，但外部现金流入并未加速。公开披露没有量化这种关联方动态。Joyson
              Electronics、SAIC Financial Holdings 和 Longcheer Technology 都是战略投资者，也都代表潜在未来客户；这在一定程度上扩大了潜在直接客户群、缓解集中风险，但
              Agilink 与这些投资者之间尚无公开确认的商业协议。
