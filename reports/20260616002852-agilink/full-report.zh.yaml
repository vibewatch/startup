      - number: '8.5'
        title: 战略溢价与折价因素：中国、治理与部件层
        blocks:
          - type: paragraph
            body: >-
              Agilink 估值受四类系统性溢价 / 折价因素影响；这些因素不能简单相互抵消，必须合并权衡。

              第一，相比同等西方市场估值，中国来源资产要承受地缘政治折价。American Security Robotics Act（两党参议院法案，2026 年 3 月）明确瞄准中国人形机器人厂商，BIS 对先进计算 IC
              的出口管制也会给任何内嵌 AI 推理处理器的部件制造供应链摩擦。Unitree 的 pre-IPO 讨论显示，在基本面相当时，中国 A 股科创板机器人公司相较美国 VC 标记折价 30–50%。在 Agilink
              这个阶段，中国第十五个五年规划匹配度和国内供应链成本优势会部分抵消这项折价。

              第二，应给出关联方治理折价。Agibot 在 Agilink 设立时保留约 80% 股权，Deng Taihua（Agibot
              董事长）担任法定代表人。缺少独立董事会、披露的优先权结构或少数股东保护契约，意味着外部少数股东的治理救济有限。这一风险类似早期 Unitree 和 UBTECH
              的治理画像——二者在科创板上市前都需要完成治理整改。

              第三，相比全系统人形机器人估值，部件层结构性折价适用。以 Agilink 当前硬件优先阶段看，适用市场是完整人形机器人系统价值的 10–15%（灵巧手是五六个主要子系统之一）。只有当 Agilink 建立跨
              OEM 供货关系，且任何单一全系统玩家都无法内部复制时，末端执行器专精带来的战略溢价才会释放。

              第四，先发溢价真实存在，但很脆弱。没有其他中国灵巧手厂商能以低于 10,000 元人民币的价格，在这种形态下出货 8,000 多只带触觉反馈的单元。Unitree 数字争议（5,500 台 vs 5,168
              台，未验证）说明，全行业口径都未经审计；Agilink 的数字也有同样提示。如果溢价真实，就必须靠 IP 申请、制造护城河和专有训练数据守住——这些从外部都无法公开验证。
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
