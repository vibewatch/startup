        title: 身份、拆分背景与商业模式
        blocks:
          - type: paragraph
            body: >-
              Agilink（临界点 AGILINK）是 2026 年 1 月从 Agibot 操作业务中拆出的独立灵巧手公司。多家中文媒体引用的工商登记信息显示，上海临界点创新智能科技有限公司于 2026-01-14
              在上海成立，法定代表人为邓泰华，Agibot 成立时持股 80%。媒体和 Agibot 官方材料的公开定位一致：Agilink 聚焦灵巧末端执行器，而不是完整 humanoid robots，向具身
              AI、工业自动化、物流、服务机器人和科研流程销售五指手、高端操作模块和配套夹爪。创始人兼 CEO 熊坤对多家媒体表示，拆出手部业务，是为了支持持续 R&D、打开 Agibot
              生态之外的外部销售，并加快工程驱动的规模化生产。该商业模式意味着收入先来自硬件，之后才是围绕灵巧操作模型和数据集的软件、数据工具机会；不过，收入拆分、定价架构或经常性服务披露均未发布。
