      - number: '7.5'
        title: 缓释措施、监测指标与终止标准
        blocks:
          - type: paragraph
            body: >-
              Agilink 有几项结构性缓释因素，能部分抵消风险堆叠。MIIT 委员会参与（Peng Zhihui 担任副主席）让 Agibot
              生态公司能提前看到标准制定方向，降低中国侧合规的监管意外。四轮融资节奏——包括来自汽车、电子和互联网行业的战略投资人——提供了多条资本路径，即便单一投资人退出也不至于断档。Longcheer Technology
              已确认 99.9% 成功率，虽然只限一个现场，但给投资人提供了可引用的近期商业可信度样本。

              但地缘政治风险的缓释成熟度很低。已审阅来源没有披露任何针对 ASRA 通过、EU AI Act 合规工程，或内嵌芯片 BIS 许可证采购的应急方案。面向海外企业客户的中国 NI Law
              数据主权问题，也没有披露架构回应。这些都是实质性尽调事项。

              投资论点恶化的可监测触发因素包括：（1）ASRA 走出委员会或签署成法——这会关闭美国联邦采购，并很可能引发政府以外企业买家的寒蝉效应；（2）Unitree IPO 形成行业市值基准，暗示 Agilink
              的收入倍数应更低；（3）任何披露的灵巧手生产环境产品安全事故；（4）Agibot 科创板 IPO 文件披露 Agilink 持股低于 40%，意味着稀释可能让母公司激励错位；（5）BIS 将 Agilink
              或其芯片供应商加入 Entity List，或发布更严格的 IC 规则。

              投资论点的终止标准是：Agilink 失去主要渠道（Agibot 崩溃或切断灵巧手供应协议）；任何 G7
              司法辖区出现重大产品责任判决，并确立自主操作中制造商责任先例；或中国政府从人形机器人部件撤回补贴，触发单位经济模型反转。
