      - number: '3.4'
        title: 相邻末端执行器系统与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Dexterity AI（美国）代表最成熟的 physical-AI 末端执行器系统替代方案；它竞争的不是手部形态，而是结果。其 “Foresight” world model 已在 Fortune 50
              企业客户的生产环境中训练超过 1 亿次自主动作。Dexterity 已在日本 Sagawa Express 的卡车装载作业中部署 Mech superhumanoid，并与 Beckhoff USA 集成
              EtherCAT 标准自动化。借助 NVIDIA TensorRT 和定制 CUDA kernels 实现的 17× 推理加速，使 safety-rated physical AI
              达到实验室组装手无法匹配的性能水平。Dexterity 的战略位置是 software-and-service-first：它不是靠卖一只手与 Agilink
              竞争，而是销售完整操作结果——在任务定义清晰且量大的垂直场景中，实际绕开了独立手市场。RightHand Robotics（2014 年成立，2018 年 12 月完成 $23M Series B）销售
              RightPick 3 piece-picking system，最高每小时 1,200 次抓取，具备 Level 4 autonomy 和超过 99% 的抓取准确率，可处理最高 2 kg
              物品。RightPick 已部署于 PALTAC Japan（500,000 sq ft，consumer packaged goods）和 Apologistics
              Netherlands（pharma，AS/RS），并与 UR5e/UR10e cobot arms 集成；它不是拟人手，而是任务专用 picking effector。对物流买方而言，RightPick 3
              用更少 DOF 和成熟软件层确定性解决
              piece-picking，完全消除了灵巧手需求。多数制造和物流买方的现状替代方案仍是人工劳动加固定自动化（输送系统、真空吸附、刚性双爪夹爪）。灵巧手要跨过的门槛，不只是跑赢某个竞争对手的手；它必须在半结构化环境中跑赢人工灵活性加真空末端执行器的组合经济性，这要求高可靠性，也要求多数运营商的单元成本低于约
              $10,000。
