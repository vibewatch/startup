            title: 美国采购立法可能把 Agilink 挡在西方企业预算之外
            body: >-
              2026 年 3
              月，美国立法者提出法案，拟禁止政府采购中国制造机器人。虽然政府合同只占可服务市场的一小部分，但立法措辞通常会外溢到国防主承包商和受监管行业供应链。对一家制造和公司基地都在上海的公司而言，这是结构性市场准入约束；Shadow
              Robot（英国）和 RightHand Robotics（美国）等竞争对手不面对同样限制。
