  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: Agilink 的 $1 Billion 独角兽标记：背景与证据质量
        blocks:
          - type: paragraph
            body: >-
              Agilink 于 2026 年 5 月跨过独角兽门槛；自 2026-01-14 设立以来完成第四轮融资后，据报估值超过 $1 billion。唯一直接确认 $1 billion 数字的英文一手来源，是
              Crunchbase News 2026 年 6 月 1 日文章，文中写道：「上海的 Agilink 自 1 月从 Agibot 拆分以来已完成四轮融资，并达到 $1 billion
              估值。」该文没有说明轮次规模、pre-money 还是 post-money 口径，也没有列出第四轮投资人。多家中文商业媒体（行业媒体、Pedaily 类媒体）在 2026 年 5 月 19–20
              日窗口期报道了同一估值跃升，印证 Crunchbase 说法，但没有任何一家发布经审计数据。

              这种证据画像——投资人报道的独角兽，却无收入披露——在 2025–2026 年机器人融资潮中很常见。当时全球投入 $14 billion，仅中国就投入 $5.6
              billion，但对当期经济模型的基本面承销很有限。Agilink 四轮融资速度（五个月成为独角兽）在灵巧手部件子赛道没有直接先例，不过与机器人手臂类比中的 Tianji
              时间线相比更有利。投资人阵容——Hillhouse Venture、BlueRun、Baidu Ventures、Yunfeng Capital、SAIC Financial Holdings、Joyson
              Electronics 和 C Capital——按中国 VC 标准质量很高，更符合抢份额优先的竞赛姿态，而不是回报纪律优先。由于没有公开说明 pre/post-money 区分，任何进入价格分析都必须把 $1
              billion 视为方向性标记，并根据轮次规模留出 ±20% 的模糊带。
