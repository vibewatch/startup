      - number: '8.7'
        title: 附录
        blocks:
          - type: callout
            title: $1 Billion 下，Pre/Post-Money 模糊性很关键
            body: >-
              Crunchbase 这个 Agilink $1 billion 估值的一手来源，没有说明采用 pre-money 还是 post-money
              口径。如果第四轮募资数亿元人民币（与此前轮次一致），pre-money 解读会意味着 post-money 标记为 $1.2–1.5 billion；而 post-money 读法下，$1 billion
              会意味着领投方有效进入溢价更小。这一模糊性会影响任何二级投资人的稀释计算，必须在尽调中厘清。
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
          - type: callout
            title: Titanji 可比对象比 Figure AI 更相关
            body: >-
              机器人媒体通常把中国灵巧手公司拿来对标 Figure AI（$39 billion）或 Apptronik（$5 billion）。对 Agilink 来说，结构上更合适的可比对象是 Tianji（$1.5
              billion，2026 年 5 月 Series B），这是一家中国部件层机器人手臂供应商，从 Hillhouse 和 Meituan 融资 $147 million，并拥有来自 45 家 OEM 客户的
              10,000 多台积压订单。Agilink 的 $1 billion 估值较 Tianji 可比对象折价 33%，尽管处在差异化产品细分中；这与 Agilink 更早阶段、更短运营历史相一致。
            calloutType: insight
            claimRefs:
              - CV033
              - CV040
          - type: callout
            title: 出货数量未经审计
            body: >-
              本章引用的所有产量数字——Agilink 的 8,000 多只灵巧手和 10,000 多个夹爪，以及用作行业锚的 Unitree/Agibot 出货数量——均由公司自行报告，未经独立审计。2026 年 3 月
              Unitree 与 Agibot 出货量争议说明，把自报数字当作已验证数据存在风险。因此，所有收入代理计算、收入倍数和单位经济模型推断，都是带有重大不确定区间的估计。
            calloutType: assumption
            claimRefs:
              - CV035
              - CV036
