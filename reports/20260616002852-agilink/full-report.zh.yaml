              Agilink 的投资逻辑建立在脱离 Agibot 的独立性之上：自有资本、销售动作和产品路线图。但设立时 Agibot 持有 80% 股权，Deng Taihua（Agibot 董事长）担任 Agilink
              法定代表人，Agilink 的数据和人才管线也来自 Agibot 机器人事业部。已审阅来源没有确认这些依赖已转为公平交易条款。Agilink 披露数据授权协议、独立董事会，以及 Agibot
