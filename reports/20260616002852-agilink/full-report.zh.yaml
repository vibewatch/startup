      - number: '5.3'
        title: 软件栈——SDK、CANFD、ROS 2 与 AI 平台
        blocks:
          - type: paragraph
            body: >-
              Agibot（母公司）在 GitHub 以 Mulan PSL v2 许可证开源 OmniHand 2025 SDK。SDK 提供 Python 3.10+ 绑定和 C++
              API，覆盖关节位置、力矩、速度和触觉控制模式。官方唯一支持的操作系统是 Ubuntu 22.04（x86_64），并使用 CMake 3.24+ 和 gcc 11.4+。预编译 Python
              wheel（omnihand_2025_py-0.8.0）简化安装。CANFD 通信通过 ZLG USBCANFD 系列适配器完成（推荐 USBCANFD-100U-mini、USBCANFD-100U 或
              USBCANFD-200U）。仅支持 Ubuntu、仅支持 x86 的约束，把部署限制在工作站或服务器场景；公司没有记录 ARM-SoC、嵌入式或边缘部署路径。

              OmniHand 2025 和 Pro 2025 SDK 均包含 URDF 模型，可集成进仿真环境（Genie Sim 3.0、NVIDIA Isaac Sim），并提供 ROS 2
              驱动包，接入更广泛的机器人中间件生态。SDK 提供五种控制模式——Position/Angle（P-A）、Torque、Hybrid P+Torque（PtA）、Velocity 和
              Tactile——足以支持遥操作和自主闭环操作。

              平台层面，Agibot 的 Genie Studio 提供全栈开发环境，覆盖数据采集、基础模型训练（支持 RDT、Pi0、OpenVLA、GR00T 以及 AgiBot 自有 Go-1
              模型）、仿真和一键部署。Genie Studio 处理来自多个机器人本体和末端执行器的跨设备数据采集；Agibot 称新场景微调周期为 48 GPU-days。托管在
              HuggingFace（agibot-world 组织）的 AgiBot World 被描述为一个包含 1M+ 条轨迹、覆盖五个真实世界领域 217 项任务的数据集；该数据集使用带视觉触觉传感器和 6-DoF
              灵巧手的硬件，与 OmniHand 产品族一致。截至报告运行日期，Agilink 或 Agibot 尚未公开 SDK 生命周期、版本节奏和长期维护承诺。
