      - number: '4.4'
        title: 基于出货量的收入代理值与牵引力缺口
        blocks:
          - type: paragraph
            body: >-
              Agilink 公开披露的唯一定量牵引力指标是出货量：据 Pandaily、Gasgoo、Humanoidsdaily 和 Agibot 自有材料，截至约 2026 年 5 月 19 日，已交付 8,000+
              只灵巧手和 10,000+ 只夹爪。同期约 1,000 台交付设备在零售仓、药房和工厂以 8 小时连续班次运行，提供了粗略利用率信号。

              可基于这些出货量构造收入代理值。OmniHand 2025（O10）单价为 9,800 元人民币。如果全部 8,000 只手都按这一 ASP 底价售出，累计收入约 7,840 万元人民币（约 $10.7
              million）。但真实数字有多重不确定性。第一，产品组合包括 OmniHand Pro 2025（企业定价，ASP 未知，可能为 30,000–80,000 元人民币或更高）。第二，部分灵巧手可能在
              Agibot 生态内部生产并转移，采用内部转移价格，而非外部商业 ASP。第三，夹爪（10,000+ 只）ASP 低于灵巧手，可能每只 2,000–5,000 元人民币。若按 50% O10、ASP 9,800
              元人民币，30% Pro、ASP 30,000 元人民币，20% 旧款 / 内部转移、ASP 5,000 元人民币测算，平均手部 ASP 约 17,000 元人民币，对应累计灵巧手收入接近 1.36
              亿元人民币（约 $18.6 million）。再加上 10,000 只夹爪、每只估算 3,000 元人民币，可新增 3,000 万元人民币。由此得到粗略累计收入区间 5,000 万–2 亿元人民币（$7–27
              million），且对 Pro 占比假设高度敏感。所有估算都必须附带一个限制：拆分前转移和关联方销售未必代表公平市场收入。

              关键问题是，Agilink 没有独立客户收入数据，没有应收账款披露，也没有公开经审计财务报表。出货量本身也只见于公司同向媒体和行业数据库；没有独立审计或第三方验证发布。客户集中度（多少流向 Agibot
              自有机器人、多少卖给外部买家）、退货 / 故障率、保修义务和递延收入处理等证据缺口，对投资判断都很重要。
