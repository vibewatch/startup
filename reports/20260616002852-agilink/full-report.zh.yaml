      - number: '3.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 商用灵巧手中最锋利的性价比优势
            body: >-
              OmniHand O10 标价 $3,775，比 Allegro Hand V4 的 $24,500 低 85%，同时匹配 Allegro 的 16 DOF，并增加 Allegro 完全没有的触觉感知。截至
              2026 年 6 月，没有 peer-reviewed 对比存在，但价格差足够大，使学术和商业买方面临真实的成本收益权衡：除非 Shadow 或 Allegro 的品牌资产是采购门槛，否则 Agilink
              在纯经济性上胜出。
            calloutType: strength
