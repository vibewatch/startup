      - number: '8.3'
        title: 估值框架：硬件、平台与战略期权方法
        blocks:
          - type: paragraph
            body: >-
              Agilink 这个阶段的硬件公司，可用四个框架估值：收入倍数（P/S）、单位出货代理价值、平台 / 软件期权价值，以及收购方战略价值。收入未披露时，没有一个框架能给出稳定锚点。

              传统硬件 P/S 倍数需要知道收入。按出货代理估算——约 8,000 只灵巧手，混合 ASP 为 9,800–30,000 元人民币，意味着累计收入约 7,800 万至 2.4 亿元人民币（$10–33
              million USD）。在 $1 billion 估值标记下，隐含收入倍数为累计收款的 37–100x，远高于 Series C 阶段硬件创业公司常见的 5–15x
              前瞻收入区间。这个差距并不自动构成否定：Goldman Sachs 指出，2025 年以来私人机器人估值主要由数据飞轮、制造规模和部署证明驱动，而非当期经济模型。IDC 预测到 2030 年人形机器人出货量超过
              510,000 台、CAGR 95%，为前瞻 TAM 论证提供了分母。

              平台 / 软件期权价值视角更宽容。如果 Agilink 成功把专有操作数据集和 AI 模型授权变现给第三方 OEM——按 Xiong Kun
              的说法，这是已陈述但尚未商业化的路线图事项——适用倍数会从硬件（5–15x）转向 AI 平台（20–50x 前瞻收入）。Morgan Stanley 的部件供应商分析特别指出 Inovance 和
              Leaderdrive 是机器人供应链最早受益于盈利的公司，验证了部件层论点。对收购方战略价值而言，拥有专有灵巧手栈、8,000 多个在场单元和 3D 触觉感知的护城河是真实存在的，但没有披露 IP
              登记和毛利率，就无法量化。
