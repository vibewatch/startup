        - Agilink 披露管理账目或向监管机构申报
      - - 泡沫退潮中的组件价格压缩风险
        - NDRC 2026：“速度与泡沫”；150+ 竞争者；Goldman Sachs 2026 将预期重置到近期现实
        - Unitree IPO 证明公开市场胃口；人形机器人 TAM 比熊市情景更快兑现
    notes: 第 1–4 行是支持投资的论点；第 5–6 行是按风险加权的反方论点。各行不按概率排序。
