      - number: '2.5'
        title: 采用约束、缺口与负面信号
        blocks:
          - type: paragraph
            body: >
              多个结构性约束压低增长前景，也构成 Agilink 市场渗透的实质风险。


              竞争密度和整合风险：中国 NDRC 于 2026 年明确警告“高度重复产品”，并指出中国现有 150 多家 humanoid robot 公司。政府正从普惠补贴转向选择性支持，类似 2018–2022 年 EV
              行业整合。Agilink 作为 2026 年 1 月新拆出的公司，必须在预期整合把可存活生态玩家从 150+ 压缩到少数几家之前，建立差异化位置。


              能力不成熟和试点到量产缺口：Morgan Stanley 调查数据（2026）显示，只有 23% 的中国 C-suite 受访者满意当前 humanoid robot
              产品，主要短板是灵巧度和功能。sim-to-real 缺口仍未解决：Goldman Sachs 中国调查数据和 IDC 均报告，机器人 AI 准确率从仿真中的 80–90% 降至真实场景中的 50%
              以下——该失败率使工业部署在精密制造中不可靠。灵巧手需要机器人任何子系统中最高保真的触觉和力反馈，因此最暴露于能力缺口。


              地缘政治市场排除：参议员 Cotton 和 Schumer 于 2026 年 3 月提出 American Security Robotics Act（ASRA），众议员 Stefanik
              也提出配套众议院法案，拟禁止美国联邦政府采购中国制造的 humanoid robots。Agibot 和 Unitree 被明确点名。即便法案未通过，它也会对美国企业客户形成采购寒蝉效应——类似 DJI
              企业无人机和 Huawei 电信先例——可能实际关闭美国联邦政府市场，并减少国防相邻和关键基础设施制造领域的采用。


              IFR 技术怀疑：International Federation of Robotics 于 2026 年 5 月判断，“作为通用 humanoid
              工厂助手或进入私人家庭的大规模采用，在近中期不会发生。”传统工业机器人在重复性精密任务中更快、更简单、更可靠，仍会是高速制造的骨干。Goldman Sachs 2026 年 1
              月中国调查确认了这一方向性转向：行业已从“通用想象”转向安防巡逻、酒店导览和简单物流分拣等窄用例中的“专用落地”。商业规模的通用灵巧操作仍需 1–3 年。


              成本上限约束：Morgan Stanley 调查中 92% 受访者提到的 $28K 单机成本门槛（200,000 元人民币），目前低于多数商用 humanoid platforms 的实际售价，更不用说
              Agilink 手部组件。达到该价格点需要持续每年 15–20% 的降本——Goldman Sachs 已建模这一轨迹，但其取决于供应链成熟和规模效应，尚未得到保证。
            claimRefs:
