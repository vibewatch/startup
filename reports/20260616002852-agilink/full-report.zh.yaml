      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              Agilink 处在两层买方结构中。主 go-to-market 渠道里，humanoid robot integrators（Agibot、Unitree、UBTECH、Fourier，以及 Figure AI
              或 Apptronik 等潜在未来客户）是 Agilink OmniHand 单元的直接买方；他们把手嵌入自家平台，并承担采购风险。次级渠道里，Agilink 的授权模式可以从围绕 Agilink
              软件栈和控制接口自研硬件的 integrators 处获得收入——这是一条独立 B2B 收入流，可降低对单元硬件的依赖。


              最积极部署带操作需求 humanoid robots 的终端用户包括：（1）汽车 OEM 制造：UBTECH Walker S2 已确认交付 BYD、Geely、FAW-Volkswagen、Dongfeng
              Liuzhou Motor 和 Foxconn。预算所有者是工厂工程或制造运营负责人，典型评估周期为 6–18 个月，ROI 锚定在降低劳动力成本。（2）3C 电子制造：Agibot G2 部署于
              Longcheer Technology 平板生产设施，据报吞吐量为 310 台 / 小时，成功率
              99.9%+；该细分重视精度、速度和快速产品换型。（3）物流与仓储：集装箱搬运、码垛和物品分拣任务，客户要求机器人在中国当前劳动力成本下达到约 50% 人工产能，以实现 2
              年回本。（4）服务：酒店、零售导览和餐饮服务——灵巧度要求较低，但部署量大、能带来可见度。


              Morgan Stanley AlphaWise 对中国 C-suite 高管的调查（2026）发现，62% 可能在三年内采用 humanoid robots，但只有 23%
              对当前产品表示满意，理由是灵巧度、功能和价格存在缺口。关键价格上限是 200,000 元人民币（约 $28K USD），低于该水平时，92% 受访者认为广泛采用可行。这给制造商制造了明确的单位经济性倒逼：要达到
              $28K 价格点，既需要硬件降本，也需要软件效率提升，才能在规模化时跑通经济性。


              预算所有权呈现一致模式：humanoid 单元的资本开支由制造工程或自动化运营团队控制，ROI 要求来自 CFO 或工厂运营领导层。试点项目通常先由创新或数字化转型预算赞助，之后才进入 capex 线路，形成
              12–24 个月的试点到量产缺口，限制近期收入确认。Agilink 获 Crunchbase 确认的 $1B 估值，以及自 2026 年 1 月拆分以来的四轮融资，使其有能力为这段 runway
              供血，但试点转化仍是关键收入风险。
