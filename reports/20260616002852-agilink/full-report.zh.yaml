          - type: callout
            title: 所有 OmniHand 版本均无公开可靠性或 MTBF 数据
            body: >-
              尽管报告累计交付 8,000+ 只手，Agilink 和 Agibot 未披露任何 OmniHand 版本的故障率、平均无故障时间、保修条款或更换周期数据。OmniPicker 3 夹爪获得 1,000,000
