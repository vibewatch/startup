        - 以低于 $1B 的条件战略收购 Agilink 剩余股权，或宣布内部制造 OmniHand 等效产品
        - 独立股权价值坍塌；少数股东回报路径被切断
        - 立即退出，或硬性拒绝新增资本投入
      - - 行业倍数压缩
        - Unitree SSE IPO 表现低于 2025 年收入 10x，或 Figure AI 二级市场跌破 $10B
        - 投资人给预收入机器人公司的溢价系统性退潮
        - 持有；降低敞口；重定价入场纪律
      - - 关键人物离职
        - Xiong Kun 离开，90 天内没有指定继任者
        - 技术路线图可信度受损；LP 沟通风险上升
        - 大幅下调信心；重新尽调继任安排
      - - BIS 对嵌入式芯片实施出口管制
        - OmniHand 推理处理器被确认归入 BIS 适用分类
        - 国际市场实质关闭；只剩中国单一市场论点
        - 降低总仓位；按中国单一市场估值底部重新评估
      - - E 轮前仍未披露收入
        - 到 2026 日历年结束仍无公开财务 KPI
        - 估值无法核验；重复信息不足下入场的风险
