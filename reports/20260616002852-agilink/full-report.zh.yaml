      - number: '4.2'
        title: 资本形成与投资人结构
        blocks:
          - type: paragraph
            body: >-
              2026 年 1 月至 5 月，Agilink 连续完成四轮融资，节奏异常快；SCMP 分析师 Wu Meimei（ITJuzi）称其在仿人机器人部件赛道「前所未有」。前两轮在 2026 年 1 月底前完成，由
              Hillhouse Venture 和 BlueRun Ventures（BRV）领投。第三轮于 2026 年 2 月 10–11 日宣布，融资数亿元人民币，领投方是一家大型互联网公司，参投方包括 Baidu
              Ventures、Yunfeng Capital（Yunfeng Fund LP）、C Capital、Synstellation Capital、Joyson Electronics（Ningbo Joyson
              Electronic Corp.）、Hangzhou Longqi Scientific Investment（Longcheer Technology）、SAIC Motor Financial
              Holdings、BRV Partners，以及老股东 Hillhouse 和 BlueRun。C Capital 也在官网单独确认投资，并把 Agilink 定位为具身智能关键部件公司。第四轮于 2026 年
              5 月交割，再融资数亿元人民币；披露投资方包括 Baidu Ventures、Yunfeng Capital、SAIC Financial Holdings 和 Hillhouse Capital。

              据 SCMP、Reuters、Humanoidsdaily 以及多家中文商业媒体报道，第四轮后公司估值越过 10
              亿美元（独角兽门槛）。公司没有公开披露累计融资总额；不过四轮中至少三轮被描述为「数亿元人民币」或更大规模，合计金额合理推测已超过 5 亿元人民币（约 $68
              million），且可能高得多。由于收入代理值本身不确定（见第 4 节），估值 / 估算收入倍数高度依赖假设。

              需要把 Agilink 的融资与母公司 Agibot 的融资区分开。Agibot 在 2024–2025 年另行融资约 $225 million 等值资金，并正在推进 STAR Market
              IPO。Agilink 设立时，Agibot 持股约 80%，但之后四轮外部融资带来的稀释幅度没有量化。战略投资者阵容包括 SAIC Financial Holdings、Joyson
              Electronics、Longcheer Technology，说明汽车和电子供应链深度参与者押注灵巧手会成为下一代产线的标准部件。SAIC 和 Joyson
              都是上市制造商，提前锁定优先供应关系有明确战略逻辑。Joyson 自身 2025 年年报（提交至 CSRC 指定信披平台）确认其向「新兴智能体供应链」战略扩张，与投资 Agilink 的姿态一致。
