  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: OmniHand 产品族与定位
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Agilink 仍通过母公司 agibot.com 店铺和域名运营，对外提供 OmniHand 品牌下三档产品，另有配套夹爪线。OmniHand 2025——市场名称为「Agile
              Edition」——是可及的入门档，面向交互式服务机器人、研究实验室和教育场景。它拥有 16 个总自由度（10 个主动、6 个被动）、重量 ≤500 g、外形尺寸 180×85×38.5
              mm，设计上可适配标准仿人机器人腕部接口和协作机器人臂，不需要结构加强。其发布价为 ¥9,800（约 $1,350 USD），被广泛称为首个跌破 ¥10,000 价位的高 DoF
              灵巧手，扩大了研究和开发者市场的可及性。Botonly 经销商标价约为 $4,420 USD，反映国际加价。

              OmniHand Pro 2025 是工业档，拥有 19 个 DoF（12 个主动、7 个被动）、重量 ≤750 g，并凭借电机 + 丝杆传动实现显著更高的 35 kg 负载能力（掌心向上）。Pro
              搭载多模态传感：3 轴指尖力、1 轴掌心力，以及 150+ 个触觉点，灵敏度 0.01 N，比基础款细一个数量级。humanoid.guide 标价 $12,700
              USD；它以能力对标价格高得多的研究级灵巧手，同时仍远低于 Shadow Dexterous Hand 等平台的六位数价格。

              OmniHand 3 Ultra-T 于 2026 年 4 月 17 日在 Agibot 2026 Partner Conference（APC 2026）发布。公司称其采用腱驱动方案，拥有 22+3 个
              DoF，重量仅 500 g——与入门款 OmniHand 2025 相同，尽管主动自由度超过后者两倍。除 Ultra-T 外，公司还发布了 OmniHand 3 Lite（加固高冲击版本）和 OmniPicker
              3（工业夹爪，140 N 力、1,000,000 次循环耐久）。Ultra-T 尚未披露商业上市日期；所有已发布规格均来自 Agibot 新闻稿，未被评测方、客户或第三方基准独立验证。
