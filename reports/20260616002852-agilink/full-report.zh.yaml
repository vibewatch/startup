      - number: '3.5'
        title: 差异化、切换成本与负面竞争分析
        blocks:
          - type: paragraph
            body: >-
              Agilink 的核心性价比优势很具体：OmniHand O10 标价 $3,775（来自 humanoid.guide），而 Allegro Hand V4 为 $24,500——在 DOF 相当或更高（16
              vs. 16）且集成 Allegro 完全缺失的触觉感知的情况下，折价 85%。OmniHand Pro（O12）标价 $12,700，具备 19 DOF 和 35 kg 握力，能力曲线位置介于
              XHAND1（$14,000，12 DOF）和 Shadow Robot 之间。在旗舰层级，OmniHand 3 Ultra-T 具备 22+3 DOF、3D 触觉、掌心相机和低于 0.3 秒响应，是截至
              2026 年 6 月中国公开记录中最先进的腱绳驱动手。软件锁定是最粘的护城河。Agilink 的 Genie Studio 开发者平台提供端到端数据采集、一键部署、仿真和数字孪生，以及 9 大类材料、180+
              种产品类型。它支持主流 foundation models（RDT、Pi0、OpenVLA、GR00T），并宣称相对单 GPU 推理带来 2–3× 性能提升。开源中间件 AimRT（v1.7.0，2026 年 4
              月）在 Agibot 和 Agilink 部署中提供 ROS2 Jazzy 支持、zenoh、gRPC 和 MQTT。一旦 integrator 在 Genie Studio
              上搭建流程，迁移到竞争对手就需要重新训练数据采集管线、重新验证传感器校准，并重写部署代码——即便在早期体量下，这种切换成本也很实质。Agilink 竞争位置的主要负面发现有三点。第一，RobotEra
              XHAND1 的 direct-drive 架构已被 Boston Dynamics 和 NVIDIA 采用为硬件，这个竞争信号说明 direct-drive 路线已被技术可信客户验证，而 Agilink
              尚未公开类似客户引用。第二，Unitree R1 完整系统价格 $3,930 会制造认知问题：想要灵巧操作的买方，可以用大致等于 Agilink 单只手价格的预算买到完整机器人平台。第三，美国立法者于 2026
              年 3 月提出法案，拟禁止政府采购中国制造机器人，直接限制 Agilink 进入西方最大企业和政府机器人预算池。该地缘政治逆风同样适用于 RobotEra 和其他中国竞争者，但 Agilink 相比
              Fourier Intelligence 的 SoftBank-backed 西方存在，国际销售基础设施更弱，因此影响更重。切换成本和锁定有利于 Agibot 生态 integrators（使用 Genie
              Studio 和 AimRT），但把 Agilink 集成进非 Agibot 平台的第三方 OEM，相比开源替代品（LEAP Hand、ROS-native Allegro）面临更明显迁移成本。研究买方可以
              multi-home，但生产部署中操作复杂，因此更利好 incumbents。
