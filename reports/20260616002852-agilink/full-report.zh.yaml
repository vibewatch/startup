      - number: '4.6'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Agilink 的财务画像有吸引力，但高度不透明。收入架构说得通，硬件定价策略也明显为放量牺牲短期毛利，符合先铺装机量、再通过软件、数据和升级周期扩张的 land-and-expand
              模型。基于出货量的收入代理值（截至 2026 年 5 月累计 $7–27 million）合理，但完全建立在无法独立验证的假设上，因为公司没有任何经审计财务披露。

              即便采用乐观假设，估值 / 估算收入比也意味着超过 40x 远期收入的高度投机倍数。只有一种逻辑能支撑它：Agilink
              可能成为全球仿人机器人行业的主导灵巧手供应商，而这个赛道已被中国政府规划者明确瞄准，尽管他们也警示了泡沫风险。NDRC 2025 年警告称，150
              多家机器人公司因重复产品面临「速度与泡沫」风险；这一警告直接适用于中国灵巧手细分市场，至少五家资金充足的公司（LingXin、Linkerbot、XHAND、Shadow 等）都在争夺同一批机器人平台集成机会。

              财务尽调阻断项很严峻：没有经审计收入，没有毛利率披露，没有烧钱速度，没有股权结构表，没有客户集中度分析，也没有独立董事会。母公司 Agibot 在设立时控制约 80%
              股权，引发对转移定价安排、治理独立性和客户合同潜在利益冲突的合理担忧。投资者基础包括战略产业方（SAIC、Joyson、Longcheer），它们与 Agilink 的商业关系会让公平交易分析更加复杂。在
              Agilink 提交公开发行申请或向投资者披露财务之前，其财务故事主要仍是市场位置押注，而不是可承保的投资。
