companyProfile:
  summary: >-
    Agilink（临界点 AGILINK）是一家位于上海的灵巧机器人手公司，2026 年 1 月从 Agibot 操作业务中拆分出来。公司销售分层 OmniHand 产品组合，覆盖 OmniHand 2025、OmniHand Pro
    2025 和旗舰 OmniHand 3 系列，并提供配套夹爪，面向具身 AI OEM、工业自动化用户、物流场景和科研客户。公开报道称，Agilink 在不到五个月内完成四轮融资，到 2026 年 5 月估值超过 US$1
    billion，并已出货超过 8,000 只灵巧手和 10,000 个夹爪。上行逻辑在于：它在人形机器人技术栈中战略重要的部件层，罕见地很早跑出了规模；下行风险则是，几乎所有商业、财务和治理细节仍依赖稀疏且由母公司中介的披露。
