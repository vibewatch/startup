            body: >-
              Agilink 成立后融资节奏异常快。Pedaily 于 2026-01-26 报道，公司已完成两轮融资，由 Hillhouse Venture 和 BlueRun Ventures
              领投，并计划追加一轮战略融资。2026-02-10，多家媒体报道新一轮数亿元融资由一家大型互联网公司领投，Baidu Ventures、Yunfeng Capital、Synstellation
              Capital、Joyson Electronics、Longcheer Technology、SAIC Financial Holdings 等战略与财务投资人参投；老股东 BlueRun 和
              Hillhouse 据称加码。到 2026-05-19 和 2026-05-20，Reuters-equivalent 中文商业报道、行业媒体和英文摘要对下一次估值跃升给出趋同说法：Agilink
              已完成又一轮数亿元融资，估值超过 US$1
              billion，成立不到五个月即成为独角兽。公开记录没有给出的信息同样重要。未有已审阅来源披露累计融资总额、每股价格、董事会权利、员工期权池、债务融资或任何老股转让。因此，融资故事在动能和投资人质量上很强，但在股权结构细节和承保基本面上仍然很薄。
