      - number: '2.4'
        title: 增长驱动因素与政策顺风
        blocks:
          - type: paragraph
            body: >
              五个结构性驱动因素支撑 Agilink 所在市场的近中期增长机会。


              第一，中国“十五五”规划（2026–2030）明确把机器人放在现代产业体系核心，并将机器人划入国家战略优先级最高层级。IFR 于 2026 年 5 月确认，下级行业和区域规划必须与该框架对齐，这意味着到 2030
              年政府采购和补贴支持将持续。中国已经拥有全球最大的工业机器人装机基数——约 200 万台，是日本的 4.5 倍，并占全球年度工业机器人安装量的 54%。


              第二，中国工业机器人国产供应商份额从 2020 年的 30% 升至 2024 年的 57%，验证了结构性进口替代趋势；政府正主动把该趋势延伸到 humanoid
              robots。这创造了一个受保护的国内需求池，Agilink 这样的中国末端执行器供应商拥有优先进入权。


              第三，灵巧操作瓶颈可以说是制约 humanoid robot 商业部署的最大单一技术约束。Agibot 联合创始人彭志辉——同时也是中国 MIIT
              人形机器人标准化技术委员会副主任——表示，“人类擅长但传统自动化难以胜任的高价值任务中近 80%”依赖尚未标准化的触觉感知。Agilink 专注这一瓶颈，使其处在 humanoid 生态的关键路径供应商位置。


              第四，中国 MIIT 于 2026 年 2
              月发布首个人形机器人和具身智能国家标准体系，覆盖六大支柱，包括“肢体及部件”和“安全与伦理”。标准化降低协调成本，推动模块化，并形成稳定接口定义；这比集成式全栈制造商更有利于 purpose-built
              部件供应商。


              第五，VC 融资浪潮规模空前：全球机器人 startup 在 2025 年融资创纪录达到 $14B，高于 2024 年的 $8.2B；仅截至 2026 年 5 月中旬，中国公司融资已达
              $5.6B。这些资本正流向生态公司，包括会成为 Agilink 直接客户的 integrators。Unitree 的 $580M IPO（SSE，2026 年 3 月）及其收入同比增长 335% 至
              $235M，验证中国 humanoid 细分已进入商业规模。工厂 cobots 从首个商业版本到批量销售可行用了 7–10 年；humanoid robot ecosystems 迭代更快（每代 6–8
              个月，而早期 cobots 以年计），暗示采用曲线会被压缩。
