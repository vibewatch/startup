  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与替代品
        blocks:
          - type: paragraph
            body: >
              Agilink 的核心市场是灵巧机器人手和智能末端执行器细分：多指、传感器丰富的操作模块，面向 humanoid platforms、移动操作臂和可替换 cobot
              附件。市场边界包括硬件（手或末端执行器单元）、嵌入式触觉 / 力感知、专有控制软件，以及支撑 in-context learning 的配套数据采集管线。Agilink 的授权模式把边界进一步扩展到第三方
              humanoid integrators 嵌入 OmniHand 平台后支付的 royalties。


              Agilink 当前市场不包括：没有嵌入式 AI 或触觉感知的传统单轴或双爪气动 / 电动夹爪（Schunk、SMC、Festo
              所覆盖的工业自动化夹爪市场）；为刚性治具上重复任务设计的固定臂工业机器人末端执行器；操作需求不需要多指灵巧度的巡检机器人、清洁机器人和服务机器人；以及人工检验或装配服务。


              灵巧末端执行器的主要需求拉动来自 humanoid robot platforms 的快速扩张。由于没有独立分析师报告把灵巧机器人手子市场作为离散类别覆盖，市场规模只能借更广义的 humanoid
              hardware market 作为代理，并假设末端执行器占总平台成本约 10–15%（该估计未被独立验证）。这种结构性依赖意味着，Agilink 的收入机会绑定在 humanoid robots
              在制造、物流和服务垂直场景中的采用速度上。


              Agilink 替代的主要现状方案是：（1）cobot 机械臂上的标准工业夹爪，需要按任务重新配置；（2）传统自动化无法经济覆盖的操作环节中的人工手部劳动；（3）3C 电子装配中按每个产品 SKU
              重新定制的末端执行器。相邻竞争动态包括 soft-robotics 夹爪公司（Soft Robotics、Festo Bionic）、加入自有末端执行器的 cobot 厂商（Universal
              Robots、Franka Robotics），以及在 Agilink 从 Agibot 拆分后已开始开发的其他中国灵巧手进入者。


              更广义 humanoid 市场的分析师估计差异显著，这反映的是真实范围分歧，而不是简单预测错误。Goldman Sachs 口径是 “humanoid robot hardware
              revenue”，MarketsandMarkets 则覆盖 “humanoid robot market”，包含部分软件价值。IDC 用出货量和 ASP 隐含收入来框定机会。这些方法差异意味着，2025 年
              $2.92B–$6B 区间和 2035 年 $15.26B–$38B 区间不能按同口径比较；它们应被理解为对重叠现象的不同观察镜头，而不是单一共识估计。
