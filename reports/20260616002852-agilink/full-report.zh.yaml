  - id: FE001
    title: OmniHand 产品架构 — 从硬件到平台的技术栈
    type: stack
    layout: standard
    summary: 三层栈从物理机械，经传感和驱动，到软件与 AI 平台，展示 OmniHand 硬件层如何接入 Agibot 开发生态。
    data:
      layers:
        - label: AI / 数据平台
          detail: Genie Studio（训练、仿真、部署）、AgiBot World（1M+ 轨迹数据集）和 GO-2 操作基础模型，为基于 OmniHand 的系统提供 AI 和数据底座。
          items:
            - Genie Studio（训练、仿真、部署）
            - AgiBot World（1M+ 轨迹数据集）
            - GO-2 操作基础模型
        - label: 中间件 / 集成
          detail: >-
            ROS 2 驱动（兼容 Humble/Jazzy）、AimRT 开源中间件（ROS 2、zenoh、gRPC）和用于仿真的 URDF 模型（Genie Sim 3.0、Isaac Sim），把 OmniHand
            硬件接到机器人技术栈。
          items:
            - ROS 2 驱动（兼容 Humble/Jazzy）
            - AimRT 开源中间件（ROS 2、zenoh、gRPC）
            - 用于仿真的 URDF 模型（Genie Sim 3.0、Isaac Sim）
        - label: SDK / 控制
          detail: OmniHand SDK（Python 3.10+ / C++；Ubuntu 22.04）提供五种控制模式，通过 CANFD 以 1 kHz 通信，并要求使用 ZLG USBCANFD 适配器。
          items:
            - OmniHand SDK（Python 3.10+ / C++；Ubuntu 22.04 环境）
            - 控制模式：P-A、Torque、Hybrid PtA、Velocity、Tactile
            - CANFD 总线 1 kHz（需 ZLG USBCANFD 适配器）
        - label: 传感与驱动
          detail: 触觉阵列（O10 为 400+ 点，O12 为 150+ 多模态点，Ultra-T 宣称全手 3D）、电机驱动主动 DoF，以及集成掌心相机（仅 Ultra-T，未验证）构成传感和驱动层。
          items:
            - 触觉阵列（O10：400+ 点；O12：150+ 多模态点；Ultra-T：宣称全手 3D）
            - 主动 DoF 驱动（O10：电机 + 齿轮；O12：电机 + 丝杆；Ultra-T：腱绳）
            - 集成掌心相机（仅 OmniHand 3 Ultra-T，未验证）
        - label: 机械结构
          detail: 五指仿人布局配可对掌拇指，PA 尼龙和硅胶结构，加上不同版本的腕部接口，为操作提供物理底座。
          items:
            - 五指仿人布局（可对掌拇指）
            - PA 尼龙 + 硅胶材料结构
            - 腕部接口（O10：180 mm 长度；O12：207 mm；Ultra-T：55 deg 俯仰 / 40 deg 偏航）
    approximationNotes: 层级边界为分析划分；具体组件来自官方产品页、GitHub SDK 和 Genie Studio 文档。Ultra-T 层级项标记为已发布但未验证。
