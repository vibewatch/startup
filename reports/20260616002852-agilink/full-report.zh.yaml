  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与定价层级
        blocks:
          - type: paragraph
            body: >-
              Agilink 的收入模式以硬件为先：公司向具身 AI
              训练、工业自动化、物流、服务机器人和科研流程销售灵巧机器人手、高端操作模块和配套夹爪。公开信息中没有订阅、软件许可或经常性服务产品的定价，因此硬件单位经济性是当前收入估计唯一有意义的杠杆。

              来源最精确的价格点是 OmniHand 2025（O10）9,800 元人民币（约 $1,350 USD）；Agibot 和独立分销商确认，这是首款价格低于 10,000 元人民币的高自由度灵巧手。第三方经销商
              Botonly 截至 2026 年 6 月将 O10 标价 $4,420 USD，显示非中国大陆渠道存在显著加价，但 Agibot 供应链给出的标价仍是 9,800 元人民币。面向工业制造和物流的
              OmniHand Pro 2025 仅接受企业询价，因此该层级没有公开 ASP。2026 年 4 月 APC 2026 发布的 OmniHand 3 系列（Ultra-T、Lite、OmniPicker
              3）没有确认定价；Lite 被描述为“激进定价”，符合市场份额优先姿态。

              Agilink 创始人熊坤把市场分成三段：入门级 6–10 DoF 手，价格数千至 30,000 元人民币；中端 11–17 DoF 手，价格 50,000–100,000+ 元人民币；高端旗舰 20+ DoF
              手，价格 200,000+ 元人民币（竞争者包括 Shadow、Tesla 和 Sharpa）。OmniHand 2025 以 9,800
              元人民币落在中端细分底部，并大幅低于该区间——这是有意定位，用来拿下科研和首次部署市场。更早的商用灵巧手起价 $10,000（约 73,000 元人民币），最高到 $200,000，意味着 Agilink 入门
              ASP 相比此前市场下降 7x–150x。

              两条补充收入流在战略层面被披露，但缺少定价或已实现收入数据：向母公司 Agibot 供应手和夹爪，用于 Agibot 品牌机器人集成（内部 / 关联方渠道）；以及销售给具身 AI 数据采集流程，由高 DoF
              手生成更丰富训练数据。第三条潜在收入流——与 OmniHand 操作数据集绑定的 AI 模型和数据集授权——被熊坤列为 2026 年路线图事项，但尚未成为商业产品。若要确认企业授权收入，需要披露 ASP
              和合同细节；这些公开信息目前不存在。
