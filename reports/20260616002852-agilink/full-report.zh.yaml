      - number: '7.6'
        title: 附录
        blocks:
          - type: callout
            title: 顶层风险：ASRA 与出口管制叠加，可能形成西方市场关闭情景
            body: >-
              如果 ASRA 通过，同时 BIS 收紧 AI 芯片出口限制，Agilink 将面对一种情景：美国联邦采购被禁止，企业采购自我约束到同一标准，国际产品配置所需的 AI
              推理硬件又遇到许可证壁垒。单看任何一个风险都不致命，但二者汇合——以当前立法势头看，12–18 个月内都具有现实可能——可能在 Agilink 建立 Agibot
              国内生态之外的持久收入前，实质性关闭西方可服务市场。
