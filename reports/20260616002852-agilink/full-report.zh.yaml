        title: 领导层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              对一家刚独立的机器人硬件公司而言，Agilink 公开呈现的领导层格外集中。Agilink 的运营门面是熊坤；他从 Agibot 牵头拆分，并在 2026 年 2
              月媒体采访中解释产品层级、商业化重点和独立理由。同一批采访还提到，他曾任职于 Tencent Robotics X、IDEA Research Institute 和 Inovance，并于 2024 年 11
              月加入 Agibot，分拆前负责灵巧手业务。但法律控制权似乎仍系在母公司生态上：中国媒体引用的公开工商摘要将 Agibot 董事长兼 CEO 邓泰华列为法定代表人，且 Agibot
              在公司成立时仍是控股股东。两者放在一起看，Agilink
              在融资和产品路线图上有运营自主权，但启动时尚不具备完全独立的治理画像。未有已审阅来源披露独立董事会、外部董事、创始人股权拆分、清算优先权条款或继任安排。灵巧手技术复杂，熊坤又是对外沟通核心，关键人风险较为实质。
