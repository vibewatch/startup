      - number: '4.3'
        title: 单位经济模型与硬件成本结构
        blocks:
          - type: paragraph
            body: >-
              Agilink 或 Agibot 均未公开披露任何灵巧手产品的毛利率、销售成本或单台盈利数据。本节所有单位经济模型分析均为估算或推断，并已相应标注。

              中国中端灵巧机器人手的物料清单（BOM）大致可以按行业分析师估算拆分：驱动电机占 BOM 成本 30–40%，传感器和电子器件（触觉阵列、PCB、MCU、边缘处理）占 20–30%，结构材料（注塑 PA /
              硅胶加铝合金）占 20–25%，线缆和齿轮占 5–10%，装配与人工占 5–15%。若 ASP 为 9,800 元人民币，且毛利率为 30–55%，这些比例意味着单台材料成本约 4,000–7,000
              元人民币。30–55% 的毛利率符合硬件初创公司常见水平，但 9,800 元人民币的激进入门定价——公司描述为扩大可及性而非最大化利润——可能压缩毛利。中国灵巧手厂商受益于本土微型电机（规模采购时每个
              $10–$30）和注塑件供应链，西方竞争者很难以同等成本获得。

              Agilink 的一个关键经济性差异来自自研电机和关键材料部件；Xiong Kun 称这是成本控制和「核心定价权」的基础。垂直整合降低了对第三方执行器供应商的依赖，而执行器往往是 BOM
              中最大单项成本。Agilink 还可借助母公司 10,000 台生产里程碑积累的 Agibot 供应链基础设施和制造规模，进一步压低边际成本。上述因素合起来说明，Agilink
              维持竞争性定价的时间可能比独立初创公司更长，但精确单台成本和产能数据仍未公开。

              营运资本压力不小：硬件制造需要库存融资、部件采购提前期和产线资本开支。初创公司若在约 12 个月内从发布前爬坡到 8,000+ 台，意味着大量库存融资和产线投入，与其快速融资节奏一致。来自
              Agibot（关联方买家）的客户预付款会减轻营运资本压力，但规模未知。
