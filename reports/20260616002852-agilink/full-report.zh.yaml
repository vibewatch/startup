      - number: '7.4'
        title: 运营、依赖与财务风险
        blocks:
          - type: paragraph
            body: >-
              Agilink 最结构性的集中风险，是它与母公司 Agibot 的关系。公开工商登记摘要确认，Agibot 在 Agilink 于 2026 年 1 月 14 日设立时持有约 80% 股权，Agibot 董事长兼
              CEO Deng Taihua 担任法定代表人。四轮外部融资已稀释 Agibot 持股，但稀释后的确切所有权并未公开。影响很实质：Agilink 的研发人才、制造产能、数据采集基础设施（来自 Agibot
              已部署的 10,000 多台机器人）以及早期收入渠道，都经由母公司流入。Agibot 若出现治理失灵、资本事件或战略转向，Agilink 的持续经营会直接受损。

              投资人结构进一步放大了国家邻近型集中风险。Yicai Global 确认，Agibot 的投资人名单包括 BYD、SAIC Motor、BAIC Group、JD.com 和 Tencent。Agilink
              自身的财团包括 SAIC Financial Holdings 和 Joyson Electronics（二者均为战略型上市产业投资人）。这种程度的国企敞口，会让任何拟议中的美国或欧洲二级交易面临类似 CFIUS
              的审查风险，也意味着 Agilink 的商业决策可能受国企治理考量影响。

              供应链风险又被 BIS 对先进计算 IC 的出口管制放大。OmniHand 内嵌推理芯片组的具体型号未公开，但 Agilink 的 AI 驱动触觉控制闭环需要推理硬件，可能落入 EAR
              限制。如果中国国产半导体替代品达不到性能阈值，Agilink 的国际产品配置要么技术倒退，要么依赖许可证。

              财务上，Agilink 估值已超过 $1 billion，而收入代理仅为 5,000 万至 2 亿元人民币（约 $7–27 million
              USD），对应的投机倍数说明投资人已把未来规模和软件可选性计入价格。Goldman Sachs 将年化生产成本下降 15–20%
              视为机器人硬件经济模型跑通的门槛。在毛利率、烧钱速度或营运资本数据未披露前，剩余财务风险无法量化。IFR
              指出，在重复性精密任务上，传统工业机器人仍比人形机器人更快、更可靠；这提高了一个风险：常规工业自动化中灵巧手的可服务市场，可能窄于整体机器人市场所暗示的空间。Crunchbase 将 Agilink 2026 年
              5 月迈入独角兽的事件放在同月五家中国机器人独角兽的队列中，说明一旦行业情绪逆转，可能出现估值集群形成后的回撤风险。
