      - number: '8.6'
        title: 投资建议、终止标准与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，置信度中等，风险评级高，估值立场偏紧。偏紧不等于绝对意义上的高估——投资人基础、融资速度和灵巧手 TAM 论点都可信——而是说，当前公开证据不足以让人有把握地承销 $1 billion
              进入价格。「偏紧」和「合理」的区别取决于三项披露：经审计收入、包含 pre/post-money 说明的股权结构明细，以及至少一个外部（非 Agibot）客户证明。

              若出现以下情况，建议可上调为买入：（a）Agilink 向 CSRC 提交财务文件，或以其他方式披露收入，且增速与出货代理一致；（b）后一轮融资由新的机构投资人按高于 $1.5 billion
              定价，确认估值标记；或（c）Agibot 科创板 IPO S-1 披露单独验证 Agilink 收入贡献。若出现以下情况，应下调为回避：（a）Agibot 重新整合灵巧手供应链，或以低于 $1 billion
              条件收购 Agilink；（b）BIS 对 OmniHand 使用的内嵌推理芯片组实施出口管制；或（c）Agilink 下一轮融资为
              down-round。终止标准表记录了七个带具体阈值的触发因素。尽调要求表列出按当前估值投入资本前必须取得的六项最低证据。
