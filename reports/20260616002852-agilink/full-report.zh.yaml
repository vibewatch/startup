      - number: '2.2'
        title: 市场规模——TAM、SAM 与多组分析师口径
        blocks:
          - type: paragraph
            body: >
              公开可访问的独立研究报告中，没有一份把灵巧机器人手或末端执行器子市场作为离散类别覆盖。本章所有测算都借更广义的 humanoid robot hardware market 作为代理，并将 Agilink
              可服务部分估算为中国占比和假设末端执行器成本比例的函数。


              Goldman Sachs Research（2024）给出最常被引用的机构估计：基准情形下，10–15 年（约到 2035E）humanoid hardware TAM 至少为 $6 billion；中位情形到
              2035 年为 $38 billion；蓝天情形最高可达 $154 billion——前提是产品设计、可负担性、技术成熟度和公众接受度等障碍被完全克服。GS 报告将工厂场景的经济可行性校准在 2025–2028
              年，将消费场景校准在 2030–2035 年，并要求生产成本每年大约下降 15–20%。ARK Invest 另行估算 humanoid 劳动力替代带来的经济价值为 $24T——这是 GDP
              影响口径，不是硬件收入，不能与 GS 数字混同。


              MarketsandMarkets（2026 年 4 月 / 6 月）测算全球 humanoid robot market 2025 年为 $2.92B，到 2030 年增至 $15.26B，CAGR 为
              39.2%。中国子市场预计为 $0.40B（2025）→ $2.80B（2030），CAGR 为 47.6%，使中国成为增长最快的国家市场。Grand View Research 在付费 URL
              上提供了另一组估计；头部数字量级一致，但具体范围不同。


              IDC（2026 年 5 月）用单位出货量框定机会：2025 年全球出货 18,000 台 humanoid robots，到 2030 年增长至 510,000+ 台，CAGR 约 95%。按 $28K
              单价门槛（Morgan Stanley 买方价格上限）计算，这意味着到 2030 年收入下限约为 $14B，大体与 MarketsandMarkets 估计一致。若按当前约 $100K 的平均售价计算，到
              2030 年隐含收入将超过 $51B，高于 Goldman Sachs 中位情形。IDC 明确指出，中国厂商约占 2025 年出货量的 95%。


              对 Agilink 的受限 SAM 估计：套用中国子市场份额（2025 年 $0.40B → 2030 年 $2.80B），并假设末端执行器占总平台价值的 10–15%，可得到指示性 SAM：约
              $40M–$60M（2025）增长至约 $280M–$420M（2030）——由于缺少独立市场数据，不确定性很高。任何独立分析师报告都未佐证该估计，因此只能把它当作规划代理。
