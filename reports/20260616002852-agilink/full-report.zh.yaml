  - id: TE003
    title: 技术与运营架构层
    columns:
      - 层级 / 组件
      - 系统角色
      - 关键依赖
      - 风险 / 缺口
    rows:
      - - 机械结构（PA + 硅胶）
        - 手指、手掌和腕部实体结构；容纳执行器和传感器
        - 供应商级 PA12 尼龙，以及指尖用 EcoFlex / 硅胶
        - 材料国产与进口占比未披露；硅胶在反复受力下的耐久性未量化
      - - 执行机构（电机 + 齿轮 / 电机 + 丝杆）
        - 驱动 10–12 个主动 DoF；产生指尖力
        - 电机供应商未披露；齿轮和丝杆质量决定重复精度
        - 存在单一电机来源风险；Pro 的 0.02 mm 重复精度仅由公司验证
      - - 腱绳传动（OmniHand 3）
        - 通过绕过滑轮的柔性腱绳，把电机扭矩传到手指关节
        - 腱绳材料、走线和预张紧质量
        - 腱绳磨损和寿命未公开测试；更换周期未披露
      - - 触觉传感器阵列
        - 检测接触力、剪切力和滑移事件，用于闭环控制
        - 传感器厂商和集成接口未披露
        - 400 点（O10）和 150 点（O12）密度远低于人手触觉分辨率；Ultra-T 声称「全 3D」，但未给出规格
      - - CANFD 通信（1 kHz）
        - 控制器与灵巧手之间的实时关节指令 / 反馈回路
        - ZLG USBCANFD 适配器（USB-to-CANFD 桥接）；依赖单一厂商
        - ZLG 专用驱动可能限制主机可移植性；未记录备用方案
      - - OmniHand SDK（Python / C++）
        - 面向位置、力矩、速度、混合控制和触觉控制的开发者 API
        - Ubuntu 22.04 x86_64；CMake 3.24+；Mulan PSL v2 开源许可证
        - 不支持 ARM / 边缘部署；SDK 0.8.0 版本显示成熟度仍在 1.0 之前
      - - ROS 2 驱动
        - 面向科研和工业机器人栈的中间件集成
        - 通过 AimRT 中间件兼容 ROS 2 Humble / Jazzy
        - ROS 2 版本兼容矩阵未发布；驱动生命周期承诺未披露
    notes: 层级描述综合自官方产品页、GitHub SDK 文档和 robotscanada.com 技术指南。依赖和风险评估是基于行业常规的分析师推断；我们未审阅内部供应链或组件审计材料。
