      - number: '5.4'
        title: 部署证据与用例验证
        blocks:
          - type: paragraph
            body: >-
              与多数早期硬件拆分公司相比，OmniHand 产品族的商业部署证据更充分。Agibot 将发布价 ¥9,800 的 OmniHand 2025 描述为首个低于 ¥10,000 的高 DoF 手；它被纳入
              AgiBot World 训练数据集，后者覆盖工厂、物流、家庭、酒店和商业五个真实世界领域，至少间接证明其在数据采集工作流中被反复功能性使用。

              OmniHand Pro 2025 最强的部署证据来自 G2 工业仿人机器人发布活动：配备 OmniHand Pro 的 G2 执行了物流包裹分拣（不同尺寸、形状和材料）和精密装配任务（RAM
              模块插入、安全带锁芯装配）。这些并非经典意义上的受控演示：它们处理的是未排序的混合 SKU 包裹，而不是预先分好的相同物体。Agibot 还报告两条产品线累计交付超过 8,000 只灵巧手，公司 2026 年 3
              月达到 10,000 台机器人里程碑则覆盖完整产品组合。没有客户具名案例、部署规模细节或现场故障数据发布，因此难以评估复购率或真实世界可靠性。

              Robotera 的 XHAND1（12 DoF、$14,000）是直接产品市场竞争者，同样面向仿人机器人集成。Carnegie Mellon 的 LEAP Hand（16 DoF、$2,000、舵机驱动、约 2
              kg 载荷）代表开源研究可及档——载荷和传感能力明显较弱，但价格约为 OmniHand 2025 的一半，并且已有学术引用基础（LEAP Hand 论文发表于 RSS 2023）。Allegro Hand
              V4（Wonik Robotics）是成熟研究标准，拥有 16 DoF 和丰富 ROS 生态，但价格 $15,000+，机械能力弱于 OmniHand Pro。Fourier GR-2 集成 12-DoF
              手（每只手 6 个阵列式触觉传感器），Shadow Dexterous Hand 仍是实验室金标准，24 DoF、价格约 $130,000+。Agilink 的 OmniHand Pro 在中端价位上以 35
              kg 负载能力超过所有具名替代品，但尚无第三方对比基准。
