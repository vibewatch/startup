      - number: '7.3'
        title: 竞争压力、价格压缩与市场集中风险
        blocks:
          - type: paragraph
            body: >-
              Agilink 身处中国机器人生态里增速最快、也最拥挤的赛道。Humanoids Daily 报道称，中国目前有 150 多家人形机器人公司；中国国家发改委也在 2026
              年直接警告行业存在「高度重复产品」以及「速度和泡沫」问题，说明北京可能从普惠式补贴转向选择性支持。政策一旦转向，后来者和单一产品公司承压最大。

              竞争最尖锐的地方在价格。Agilink 创始人 Xiong Kun 将 OmniHand 2025 定价为 9,800 元人民币（约 $1,350 USD），有意压低中端价格带。但 Morgan Stanley
              发现，92% 的中国企业买家要求单机成本低于 20 万元，才会大规模采用——这个门槛要由整套人形机器人系统跨过去，而不是单只灵巧手。也就是说，Agilink
              的可服务市场同样被可负担性天花板卡住。与此同时，Unitree 于 2026 年 3 月在上交所科创板提交 IPO，拟募资 $580 million、即 42.02 亿元人民币，并披露 2025 年收入超过 17
              亿元人民币（同比增长 335%）、净利润超过 6 亿元人民币。Unitree 已在规模下跑出盈利，这是 Agilink 必须对标的基准；其公开披露也会加速投资人审视其他中国机器人公司。

              UBTECH 2025 年来自汽车和物流买方板块的订单簿超过 8 亿元人民币，证明全系统竞争者可以拿下 Agilink 同样瞄准的高价值制造客户。Goldman Sachs 2026
              年对中国人形机器人厂商的调研指出，行业正从「通用想象」转向狭窄场景里的「专用落地」——安防巡逻、展厅导览、简单物流；通用型灵巧操作距离商业可行仍有 1–3 年。这意味着 Agilink 面向第三方 OEM
              销售独立灵巧手的 TAM，可能比当前估值所暗示的时间点更晚兑现。

              知识产权风险方面，灵巧手硬件一旦物料清单和电机 / 腱绳驱动架构披露，竞争者就能按成本复刻。Agibot 在 GitHub 托管 OmniHand-2025 SDK，会加速开源竞争侵蚀。Goldman Sachs
              的硬件估值框架把数据飞轮（专有操作数据集）和软件栈视为主要长期护城河——Agilink 已把二者列为 2026 年路线图事项，但尚未商业化。
