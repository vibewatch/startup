      - number: '8.4'
        title: 情景分析：牛市、基准与熊市估值路径
        blocks:
          - type: paragraph
            body: >-
              到 2028 年，三种情景圈定了 Agilink 可支撑股权价值的范围；关键变量是授权平台多快兑现，以及人形机器人市场能否维持当前投资人情绪。

              牛市情景假设 Agilink 向 10 家或更多外部 OEM 客户授权，到 2027 年年交付量超过 100,000 单元，并把其操作数据集转化为面向全球机器人制造商的经常性 AI 模型订阅。在这些假设下，每年
              $150–300 million 收入、35–45% 毛利率，可按 20–30x 前瞻收入倍数支撑 $3–8 billion 估值，与 Apptronik 的溢价以及 Goldman Sachs
              对中国机器人龙头的平台价值框架一致。中国政策顺风会放大这一情景——IFR 确认，中国第十五个五年规划把机器人置于国家战略核心，截至 2024 年国内供应商份额为 57%。

              基准情景假设当前 $1 billion 标记在 2026–2027 年大致稳定：公司推进硬件规模化，从 Agibot 供应渠道和两到三家外部客户获得收入，但因 AI 模型成熟度缺口推迟授权平台。按每年
              20,000–50,000 单元计算，基于出货的收入为 $27–135 million USD（混合 ASP 9,800 元人民币，折算美元），在没有重大竞争者冲击的前提下，可用传统硬件倍数支撑 $800
              million 至 $1.5 billion 估值。这个基准情景与 Unitree 2025 年收入轨迹作为行业地板相一致。

              熊市情景出现在几种情况下：机器人估值泡沫消退，Agibot 决定重新整合灵巧手供应链，或 sim-to-real 准确率缺口拖慢商业化——IDC 报告显示，准确率从仿真中的 80–90% 跌到真实部署中的低于
              50%。下行周期里，部件供应商的倍数压缩最快，因为全系统 OEM 会把部件内制以收回利润。在这一情景中，NDRC 对「高度重复产品」和 150 多家竞争者的警告会抹掉溢价，把估值压缩到 $100–400
              million 的困境硬件倍数。
