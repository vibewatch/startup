      - number: '3.2'
        title: 西方 research-grade incumbents 与开源挑战者
        blocks:
          - type: paragraph
            body: >-
              Shadow Robot Company（伦敦，1987 年成立）在 research-grade 灵巧手中拥有主导品牌；其 Shadow Dexterous Hand 提供 24 个自由度——截至 2026 年
              6 月，这是公开记录中 DOF 最高的商业产品——并在 Humanoid Index 上获得 8/10 readiness rating。Shadow Robot
              是机器人操作论文中的事实引用标准；顶尖大学实验室采购经理通常会把任何新手与 Shadow 对标。这个品牌护城河很耐久，因为它会自我强化：每篇引用 Shadow
              的论文都会延续规格词汇和隐含采购先例。不过，Shadow 系统价格较高，限制其只能进入资源充足的学术实验室和长周期研究项目；在讲究单位经济性的商业生产部署中，它并不竞争。Allegro Hand V4（Wonik
              Robotics，韩国）提供 16 DOF，标价 $24,500，重量约 1.1 至 1.2 kg，没有触觉或力感知，采用带扭矩控制的 DC
              电机。它广泛用于学术操作研究，但面对中国商用替代品时，性价比偏弱；后者如今能以更低成本提供相当或更高 DOF，并带触觉感知。LEAP Hand（CMU，RSS 2023
              发表）是研究细分中最具颠覆性的开源竞争者。论文展示它可用现成零件在四小时内组装，成本 $2,000，采用 MIT licensing，提供 Python、C++ 和 ROS/ROS2 API，查询频率最高 500
              Hz；在 RSS 2023 论文报告的所有基准实验中，它表现优于 Allegro Hand，而成本仅为后者的八分之一。对于主要标准是低成本数据采集吞吐量的学术买方，LEAP Hand 为任何低于 $15,000
              的商业产品提供了可信替代。
