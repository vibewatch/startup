  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 地缘政治与监管风险
        blocks:
          - type: paragraph
            body: >-
              Agilink 的中国背景带来集中的地缘政治风险，横跨美国立法、多边出口管制和欧洲产品安全法。2026 年 3 月 26 日，美国参议员 Tom Cotton 和 Chuck Schumer 提出
              American Security Robotics Act（ASRA），这是一项两党法案，拟禁止美国联邦政府机构购买或运营中国公司制造的仿人机器人。US News and World Report
              报道称，Agibot 和 Unitree 在法案文本中被明确点名，众议员 Stefanik 也提出了配套众议院法案。法案尚未通过，但两党联署以及 DJI / Huawei
              等中国硬件禁令先例，会对企业采购形成可信的寒蝉效应，尤其是在美国国防相关制造场景。

              ASRA 之外，Bureau of Industry and Security（BIS）在 2025 年 1 月发布先进计算 IC 规则，限制向总部位于 Country Group
              D:5（包括中国）的实体出口高端芯片。BIS 官网确认，BIS 已将 Authorized IC Designer 时间线延长至 2026 年 12 月 31 日。Agilink 灵巧手内置 AI
              推理处理器，但具体分类没有公开披露；因此，限制只能表述为「可能受」EAR 管制，而非已确认。若 Agilink 的嵌入式推理芯片组出口需要 BIS 许可证，国际订单的供应链连续性将面临结构性不确定。

              EU AI Act（Regulation 2024/1689，2026 年 8 月生效）将作为关键基础设施安全部件使用的 AI 系统归为高风险，要求在进入欧盟市场前完成合格评定、CE 标志和 NIST
              对齐文档。在欧盟成员国产线上运行的灵巧手明确落入这一分类。Hill Dickinson 对仿人机器人法律的 2026 年分析还指出，GDPR 下的数据隐私——尤其是生物识别传感和云端触觉数据存储——是
              Agilink 尚未公开处理的额外合规维度。

              中国国内，MIIT 于 2026 年 2 月发布首个国家级仿人机器人标准体系。Agibot 联合创始人 Peng Zhihui 与 Unitree 的 Wang Xingxing 一同担任 MIIT
              标准技术委员会副主任。这一位置让 Agibot / Agilink 能影响标准制定，但也带来监管俘获风险：如果 Agibot 关联规格嵌入专有接口，竞争对手可能发现标准本身成了护城河；反过来，Agilink
              的竞争者也可能提出标准滥用异议，拖慢 Agilink 自身合规路径。

              OSHA 已确认没有面向机器人行业的具体安全标准，ISO 10218-1:2011（工业机器人安全）也已正式撤销，尚无面向仿人机器人或灵巧手的替代标准。ISO/TS 15066:2016
              覆盖协作机器人，但没有处理多 DoF 灵巧手的力限制或故障模式。这一监管缺口既造成产品责任模糊，也给任何随后引入标准的司法辖区带来先行者认证风险。
