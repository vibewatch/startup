      - number: '7.2'
        title: 产品质量、安全标准缺口与可靠性风险
        blocks:
          - type: paragraph
            body: >-
              Agilink 的核心产品风险，是 IDC 和 Goldman Sachs 在 2026 年指出的行业首要技术瓶颈：sim-to-real 精度坍塌。IDC 2026 年 5 月商业化报告明确称，「仿真环境中
              80-90% 的准确率，在真实场景中常常跌破 50%」；Taibo Financial 对 Goldman Sachs 2026 年 1
              月中国调查的译文也佐证这一点，并补充称「大规模、高质量真实数据采集所需时间限制部署速度」。对于灵巧手产品，触觉传感和操作精度是核心价值主张，真实世界准确率 50%
              或更低是品类层面的可信度风险，不只是产品工程问题。

              唯一独立记录的生产部署位于 Longcheer Technology 南昌工厂，嵌入 OmniHand 的 Agibot G2 机器人报告达到 310 UPH 和 99.9% 成功率。Interesting
              Engineering 确认了这一部署，但指出它是在受控条件下的单一场址；能否扩展到多工厂、多班次、多产品制造环境仍未验证。Morgan Stanley 针对中国企业买家的 AlphaWise
              调查（Humanoids Daily，2026 年报道）发现，受访 C-suite 中只有 23% 对当前仿人机器人产品满意，灵巧度和功能是主要抱怨——这是当前一代灵巧手市场接受度脆弱的直接证据。

              另一个并行担忧是，Agilink 的产量声明未经审计。Humanoids Daily 报道称，「该行业生产数字未审计，无法独立验证」，并引用 Agibot（5,168 台）与 Unitree（5,500 台）围绕
              2025 年仿人机器人出货冠军的公开争议。如果母公司 Agibot 自己的出货数据都存在争议，Agilink 来自 Agibot 来源材料的 8,000+ 累计灵巧手交付声明也同样难以独立佐证。

              安全标准方面，OSHA 已确认机器人行业没有具体 OSHA 标准。历史上的工业机器人安全参考 ISO 10218-1:2011 已撤销。ISO/TS
              15066:2016（协作机器人）存在，但它是技术规范，不是强制标准，也不覆盖灵巧多 DoF 手。NIST 的 AI 风险框架推动 AI 系统的测量科学和基于风险的治理，但没有约束力。三层缺失——没有 OSHA
              规则、没有现行 ISO 标准、没有强制 NIST 要求——意味着 Agilink 面向的市场中，手部相关工伤的产品责任会依据一般产品责任法诉讼，而不是行业专属合规框架，损害赔偿暴露不可预测。
