      - number: '5.5'
        title: 差异化、技术风险与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Agilink 的核心技术差异化论点包括：（1）三档硬件梯度，在同一生态中覆盖研究价格到工业能力；（2）量产血统——OmniHand 2025 在拆分前已由 Agibot
              商业供货，相比纸面阶段竞争者具备制造成熟度优势；（3）通过 Genie Studio 和 AgiBot World 集成 AI
              训练基础设施，形成闭环数据飞轮，理论上可随时间改善操作策略；（4）在认可度较高的中国开源许可证下开源 SDK，降低学术和 OEM 客户集成摩擦。

              与这些优势相对，本章指出五项重大技术风险。第一，OmniHand 3 Ultra-T 的旗舰规格——10:1 负载重量比、低于 0.3 秒响应、全手 3D 触觉——完全依赖 Agibot 的 APC 2026
              新闻稿，没有独立复现、客户引述或详细测试协议；机器人硬件中的超常声明，经常无法在独立评估中以完整精度复现。第二，相比生物密度，各档触觉传感成熟度有限：人手约有 17,000+ 个机械感受器，而 OmniHand
              2025 为 400 点（可选）、Pro 为 150 点阵列；Ultra-T 的全手 3D 声明缺少量化规格。第三，SDK 锁定 Ubuntu 22.04 x86_64，未记录 ARM / edge
              路径，会给使用 Raspberry Pi、NVIDIA Jetson 或 Qualcomm 硬件的机器人团队带来集成摩擦。第四，任何 OmniHand 版本都没有公开 MTBF、耐久循环次数（类似
              OmniPicker 3 的 1,000,000 次循环评级）、保修条款或现场故障率数据，使部件寿命和总拥有成本无法分析。第五，agilink.cn 域名未投入运营，产品仍托管在
              agibot.com，引发关于品牌独立性、IP 归属以及拆分时具体转移了哪些 IP 的问题；这些对任何授权、赔偿或收购情景都很重要。
