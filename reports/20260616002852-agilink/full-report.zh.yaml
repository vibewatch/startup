      - number: '2.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 没有可用的独立灵巧手市场规模测算
            body: >
              截至 2026 年 6 月，没有独立分析师报告发布灵巧机器人手或智能末端执行器子细分的独立市场规模。本章所有规模测算都以更广义的 humanoid robot hardware market
              为代理，并假设末端执行器成本占比为 10–15%——该估计未被独立验证。投资人和收购方应把 SAM 数字仅作为规划脚手架，而不是已验证市场数据。
            calloutType: risk
            claimRefs:
              - CM038
          - type: callout
            title: Goldman Sachs 2026 年转向：从通用走向专用应用
            body: >
              Goldman Sachs 2026 年 1 月中国行业调查显示，humanoid robot
              行业的商业重心已从“通用想象”——什么都能做的机器人——根本转向安防巡逻、酒店导览和简单物流分拣等窄用例中的“专用落地”。这一变化直接利好
              Agilink，因为在仍需精细操作的复杂任务应用里，专业灵巧手正是高价值部件；但主导近期部署的更简单用例并不需要先进灵巧手。这同时创造机会（Agilink 卡在高端、难解细分）和风险（近期出货量可能小于整体
              humanoid 出货数字暗示的规模）。
            calloutType: insight
            claimRefs:
              - CM035
          - type: callout
            title: 关键假设：末端执行器占 humanoid platform 成本 10–15%
            body: >
              Agilink 灵巧手细分的 SAM 估计，使用的是末端执行器占完整 humanoid platform 价值 10–15% 的成本份额。该假设未被任何分析师报告独立验证。实际份额可能更高（Agilink 的高端
              multi-DOF 手），也可能更低（集成手平台中，手部成本摊入整机）。尽调应索取 Agilink 披露的 BOM 拆分，或中国供应商可比部件成本文件。
            calloutType: assumption
            claimRefs:
              - CM003
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >-
              Agilink 面对的竞争地形，比单纯用灵巧手视角看到的替代方案更宽。买方——humanoid OEM
              integrators、研究实验室、物流运营商和企业自动化团队——可以用五种方式解决同一操作任务：（1）高端西方 research-grade hand（Shadow Robot Dexterous
              Hand、Allegro Hand V4），优先考虑已发布规格和生态引用；（2）学术开源平台（LEAP Hand、CMU 2023），用商业打磨换取接近零的采购成本；（3）中国商用独立手（RobotEra
              XHAND1、Inspire Robots RH56 系列），靠 direct-drive 耐久性或价格竞争；（4）手与平台不可分割的 humanoid OEM 捆绑（Fourier
              GR-2、带可替换末端执行器的 Unitree R1）；或（5）物流末端执行器系统（RightHand RightPick 3、Dexterity AI Mech），把硬件和软件打包给 piece-picking
              等单一垂直任务，完全绕开通用手市场。Agilink 位于类别（3）和（4）的交叉点：它从 Agibot 的 humanoid hardware 中拆出，但把手作为独立产品销售给第三方 OEM
              和研究人员。今天在中国市场，这一位置独特——Inspire Robots 主要卖向国内工业渠道，面向国际的文档有限；RobotEra 的 XHAND1 则深度绑定 STAR1 humanoid
              生态。不过，该位置也让 Agilink 从上下两侧都暴露于替代：上方是资金充足的 incumbents（Shadow Robot 在西方企业买方中的品牌资产），下方是超低价进入者（LEAP Hand 或
              Unitree R1 捆绑系统，总价低于 Agilink 独立手标价）。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
