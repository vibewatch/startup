      - number: '5.2'
        title: 硬件架构——驱动、传感与机械设计
        blocks:
          - type: paragraph
            body: >-
              OmniHand 2025 和 Pro 2025 都采用连杆机构传动，每个主动自由度由独立电机驱动。基础款使用电机 + 齿轮；Pro 使用电机 + 丝杆，以 250 g
              重量代价换来更高负载能力。两者都采用五指仿生布局——四指加可对握拇指——其运动学足够接近人手，可在标准面向人类的工装中执行工具操作任务。

              OmniHand 2025 的六个被动 DoF
              采用差动耦合：腱力会在所有接触到物体的指段间自然分布，贴合物体几何形状，无需控制器指定每个关节角度。这种欠驱动降低控制复杂度，并提高对不规则物体的抓取可靠性。对于需要精度的关节——拇指对握和食指远端指骨——独立驱动自由度提供了捏取硬币或
              USB 接头等小物体所需的准确性。

              OmniHand 3 Ultra-T 对全部 22 个主动手指 DoF 采用全腱驱动架构，并配有独立 3-DoF 腕部（55° 俯仰、40°
              偏航）。腱驱动通过柔性腱绕滑轮传递驱动力，而非在每个关节放置电机，因此可把更多 DoF 塞进更轻的手中。公司声称 10:1 负载重量比（500 g 手部，最高 5 kg 有效载荷）对 25-DoF
              设计来说非常突出；尚无独立第三方测试验证这一比例，低于 0.3 秒的整手响应时间声明同样没有披露测试协议。

              OmniHand 产品线的触觉传感呈现清晰代际演进。OmniHand 2025（带触觉选项）使用 400+ 个力敏接触点，分辨率 0.1 N，覆盖 0–20 N 感知范围。Pro 升级到多模态方案：3
              轴指尖力传感（捕捉法向压力和切向剪切力）、1 轴掌心力，以及 150+ 个总触点，分辨率 0.01 N，范围 0–50 N，最大无损力 1000 N。Ultra-T 声称具备「全手 3D
              触觉传感」和集成掌心摄像头，但这一代没有公开触觉点数量、分辨率或感知范围。作为参照，人手掌面和手指约有 17,000+ 个机械感受器，这意味着即便 Pro 捕获的接触信息也只是生物密度的一小部分。
