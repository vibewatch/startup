evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Revenue, ARR, ASP, and gross-margin data for Agilink's hand and gripper lines.
    whyItMatters: Shipment counts alone do not establish quality of demand or hardware economics.
    diligencePath: Request management financials, product-level ASPs, and gross-margin bridge by product family.
    relatedQuestionRefs:
      - QO007
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, founder equity split, option pool, and investor rights.
    whyItMatters: The company was spun out of a parent and raised four rounds quickly, so control terms matter.
    diligencePath: Request cap table, board observer/seat rights, and spinout transfer agreements.
    relatedQuestionRefs:
      - QO010
      - QO017
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: Precise lifetime capital raised and whether any debt or secondaries were used alongside equity rounds.
    whyItMatters: Valuation interpretation depends on dilution, leverage, and preferred-share stack.
    diligencePath: Obtain financing timeline from counsel or management with round size, instrument type, and post-money.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: customer-base
    missingEvidence: Named customers, repeat-order rate, warranty claims, and concentration by end-market.
    whyItMatters: >-
      The shipment headline is more meaningful if it reflects diversified, sticky buyers rather than internal or pilot
      demand.
    diligencePath: Request customer list, cohort retention, and channel mix for Agibot vs third-party buyers.
    relatedQuestionRefs:
      - QO018
      - QO024
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: blocking
    topic: market sizing gap
