- calloutType: assumption
  title: OmniHand Is Treated as the Dexterous Component in All G2 Deployments
  body: 'This chapter attributes G2 robot deployments as OmniHand demand because OmniHand is explicitly described as the dexterous manipulation system for the G2 Series in the CES 2026 press release and is the sole dexterous end-effector shown in G2 product materials. However, Agilink''s exact contribution (IP licensing, hardware supply, shared R&D, or other arrangement) to the G2 platform is not contractually disclosed. The assumption that all G2 deployments = OmniHand demand may overstate Agilink''s independent revenue if OmniHand is co-developed with Agibot teams.

    '
  claimRefs:
  - CU031
  - CU040
