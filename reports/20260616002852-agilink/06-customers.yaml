- id: standalone-omnihand-channel
  title: Standalone OmniHand Channel and Third-Party Market
  body: 'No publicly documented evidence identifies any third-party OEM, university research lab, or system integrator purchasing OmniHand as a standalone dexterous hand product directly from Agilink, separate from the bundled Agibot G2 robot. Agibot''s "Powered by AGIBOT" customization program (disclosed at CES 2026) allows partners to configure robot hardware and software, implying a channel through which OmniHand could reach third-party robotics platforms, but no confirmed OEM customer for this route has been publicly named. Agilink''s e-commerce listing on store.agibot.com.cn and retailer pages (Botonly, Robots Canada) suggest retail availability, but sales volume and customer identities are unknown. Pandaily reported Agilink shipped over 8,000 dexterous hands by early 2026, but the article text was inaccessible; this figure—if accurate—would imply a significant standalone channel beyond the ~3,000 G2 units estimated in the fleet at that time, yet the sourcing gap prevents reliance on
    this metric. The comparable competitor ecosystem provides context: RobotEra (XHAND1) has disclosed logistics deployments at 10+ centers through China Post and SF Group, and RightHand Robotics has named PALTAC (Japan) and Apologistics (Netherlands) as production customers. Both demonstrate the customer-disclosure bar that Agilink has not yet cleared for its standalone hand segment.

    '
  claimRefs:
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
