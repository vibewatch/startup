chapter:
  number: 6
  title: Customers
  summary: 'Agilink''s customer universe is almost entirely mediated through parent Agibot''s full-robot deployments; Longcheer Technology (Nanchang, Jiangxi) is the sole publicly named, production-scale customer with independently corroborated metrics (310 UPH, 99.9%+ success rate). A further twelve named enterprise deployments (HT-Tech, Intel, SAIC-GM, Damon, Anta, Guangzhou Metro, etc.) are cited exclusively in Agibot''s own APC 2026 "Seven Solutions" marketing material with no independent press releases. No publicly documented evidence of any third-party OEM purchasing OmniHand as a standalone product from Agilink exists, and Agilink''s revenue attribution within the Agibot ecosystem remains entirely undisclosed.

    '
sections:
- id: customer-base-and-deployment-landscape
  title: Customer Base and Deployment Landscape
  body: 'Agilink''s go-to-market is inseparable from parent Agibot''s full-stack robot platform. The OmniHand dexterous hand is embedded as the standard manipulation end-effector in every Agibot G2 Series industrial humanoid; as of March 2026, Agibot has shipped 10,000 cumulative humanoid units across 17 countries, with 5,100 units shipped in 2025 alone (Omdia, cited by Humanoid Index, ranking Agibot #1 globally by volume). Agibot''s eight declared commercial application categories span industrial manufacturing, logistics sorting, retail guidance, hospitality, security patrol, data collection, research, and cleaning. Each deployment implicitly incorporates OmniHand''s tactile-driven manipulation capability, yet Agilink''s standalone revenue, unit pricing to Agibot, and third-party hand sales remain entirely undisclosed. The only confirmed external customer with production-level metrics is Longcheer Technology, a global smart- device ODM manufacturer. An additional twelve named enterprise
    accounts appear in Agibot''s APC 2026 "Seven Solutions" press material (HT-Tech, Intel, SAIC-GM, FULIN Precision, Damon, Xiaonan Intelligence, Anta, Haidilao, Guangzhou Metro, Digital China, State Grid, Hongqiao Airport), but none have independently confirmed their Agibot relationships through their own press releases. International partners (Genting Malaysia, Hyperscale Data, Singtel, SIR Spa, Whale Cloud) were announced at APC 2026 and APC Hong Kong 2026 but have not progressed to documented production deployments as of this run date.

    '
