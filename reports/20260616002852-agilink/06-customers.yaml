- id: TU005
  title: Expansion and Concentration Risk Register
  columns:
  - Risk / Driver
  - Type
  - Impact
  - Diligence Path
  rows:
  - - Single named production customer (Longcheer) dominates verifiable evidence
    - Customer concentration
    - High — entire external deployment story rests on one account
    - Identify and independently verify at least 2 additional production customers; request reference calls
  - - Agilink revenue = Agibot transfer pricing (captive supply)
    - Parent-company dependency
    - High — Agilink's standalone financials and arm's-length pricing are unknown
    - Request Agilink standalone P&L; confirm transfer pricing methodology and audit independence
  - - No standalone OmniHand OEM customers identified publicly
    - Market development risk
    - High — third-party hand market may not exist yet at scale
    - Monitor Agilink channel announcements; search academic and distributor references for OmniHand purchasing
  - - American Security Robotics Act (US federal procurement ban proposal)
    - Geopolitical / regulatory risk
    - Medium-High — would block US government customers and may deter US enterprise pipeline
    - Monitor bill progression; assess enterprise vs. government customer split in North America plan
  - - Intel and SAIC-GM named without independent confirmation
    - Disclosure credibility risk
    - Medium — if these accounts are mis-attributed or pilot-only, headline customer list is overstated
    - Request Intel or SAIC-GM press releases or legal/contract references confirming relationship
  - - '"World''s first" consumer electronics deployment claim'
    - Marketing credibility risk
    - Medium — Agility Robotics (Amazon) and Figure AI (BMW) preceded Agibot in similar factory environments
    - Verify qualifier scope ("precision electronics at mass-production scale") and whether competitors' earlier deployments meet the same standard
  notes: 'Impact ratings are diligence assessments, not market predictions. "High" indicates the risk materially affects standalone Agilink valuation or customer pipeline sizing. Mitigation actions are ordered by immediacy of information need.

