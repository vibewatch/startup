- id: named-account-evidence
  title: 'Named Account Evidence: Agibot-Embedded Deployments'
  body: 'Longcheer Technology is Agilink/Agibot''s flagship production-scale customer. Agibot G2 robots—equipped with OmniHand—were deployed at Longcheer''s tablet assembly plant (MMIT stations) in Nanchang, Jiangxi, completing integration in 36 hours via the Genie Sim 3.0 digital twin platform after a four-month project ramp. Independently corroborated metrics include 310 UPH throughput, a 99.9%+ motion success rate, and 2,283 error-free tasks in an 8-hour continuous run; the system supports 24/7 operation with downtime loss below 4%. Li Long, General Manager of Longcheer''s Robotics Division, provided a named quote in the official PRNewswire press release. Agibot targets scaling to 100 robots at Longcheer by Q3 2026. Beyond Longcheer, the APC 2026 "Seven Solutions" presentation named additional deployments: HT-Tech (up to 1M chips/day at <0.001% drop rate), Intel (100,000 chips/day), SAIC-GM (battery cell handling, sub-second latency), FULIN Precision (container transport), Damon (70%
    of human-level sorting throughput, 99% second-pass), Xiaonan Intelligence (435 items/hour, 50% labor cost reduction), Anta stores (20% foot-traffic uplift), Haidilao restaurants, Guangzhou Metro (13% cost reduction, 80% self-service resolution), and State Grid (multi-fold inspection efficiency gain). Every metric in the paragraph above beyond Longcheer originates solely from Agibot''s own marketing material; no independent customer-authored press release corroborates any of these deployments.

    '
