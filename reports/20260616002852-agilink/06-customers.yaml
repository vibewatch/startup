- id: concentration-dependency-and-disclosure-risks
  title: Concentration, Dependency, and Disclosure Risks
  body: 'Customer concentration risk is acute: Longcheer Technology is the only production-scale named customer for whom independent evidence exists, making Agilink''s demonstrated external demand effectively a single-account story. Structural parent-company dependency is the deeper risk: all identified deployments are for Agibot''s full G2/A2 robots, and Agilink''s revenue, transfer pricing, and arm''s-length relationship with Agibot are entirely undisclosed. If Agilink is primarily a captive supplier to Agibot—as the evidence suggests— its customer base is not truly independent and its valuation premium as a standalone spinout depends on future third-party demand that has not yet materialized publicly. Geopolitical exposure adds a second-order risk: the American Security Robotics Act (introduced by senators Cotton and Schumer, March 2026) would prohibit US federal government procurement of humanoid robots made by Chinese firms, and Unitree''s contested shipment claims signal credibility
    risk for the entire sector''s volume-based marketing. Additionally, Agibot''s claim to a "world''s first" large-scale embodied AI deployment in consumer electronics manufacturing carries a narrow qualifier (precision electronics at production scale) that may not survive scrutiny given comparable factory pilots by Agility Robotics at Amazon and Figure AI at BMW''s Spartanburg plant.

    '
