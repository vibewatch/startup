  - CU002
  - CU004
  - CU008
- calloutType: risk
  title: All Named Customers Except Longcheer Are Unverified
  body: 'The twelve additional named customers from the Seven Solutions presentation (including Intel, SAIC-GM, and State Grid) have not issued any independent press releases, customer case studies, or quotes confirming an Agibot relationship. Presenting these as confirmed deployments overstates the validated customer base. At least three of these accounts (Intel, SAIC-GM, Anta Sports) are well-resourced enough to publish independent announcements if deployments were material, which makes the absence of independent confirmation a meaningful signal.

    '
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU016
  - CU039
- calloutType: risk
  title: Agilink Has No Documented Standalone OEM Customer Base
  body: 'As a dexterous-hand spinout, Agilink''s investment thesis depends on building an independent customer base of third-party robot OEMs and research institutions that buy OmniHand outside the Agibot full-robot stack. As of June 2026, zero public evidence of such customers exists. The OmniHand product listings on Agibot''s store and third-party retailers do not disclose who is buying. Pandaily''s "8,000+ hands shipped" headline—if accurate—would imply a standalone channel, but the article text is inaccessible and cannot be relied upon for diligence purposes.

    '
