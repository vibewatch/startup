      - number: '5.2'
        title: Hardware architecture — actuation, sensing, and mechanical design
        blocks:
          - type: paragraph
            body: >-
              The OmniHand 2025 and Pro 2025 both use linkage-mechanism transmissions with independently driven motors
              per active degree of freedom. For the base model the drive is motor + gear; for the Pro, it is motor +
              screw rod, which enables the higher load capacity at the cost of a 250 g weight penalty. Both adopt a
              five-finger anthropomorphic layout — four fingers plus an opposable thumb — that mirrors human hand
              kinematics closely enough for the hands to perform tools-manipulation tasks across standard human-oriented
              fixtures.

              The six passive DoF in the OmniHand 2025 are differentially coupled: tendon force distributes naturally
              across all finger segments in contact, conforming to object geometry without requiring the controller to
              specify every joint angle. This underactuation reduces control complexity and improves grasp reliability
              on irregular objects. For joints requiring precision — thumb opposition and index distal phalanx —
              independently driven degrees of freedom provide the accuracy needed for pinch grasps of small objects such
              as coins or USB connectors.

              The OmniHand 3 Ultra-T adopts a full tendon-driven architecture for all 22 active finger DoF, with a
              separate 3-DoF wrist (55° pitch, 40° yaw). Tendon drive allows packing more DoF into a lighter hand by
              routing actuation through flexible tendons over pulleys rather than placing motors at each joint. The
              claimed 10:1 load-to-weight ratio (500 g hand, up to 5 kg payload) is extraordinary for a 25-DoF design;
              no independent third-party test of this ratio has been published, and the sub-0.3-second full-hand
              response time claim similarly lacks a disclosed test protocol.

              Tactile sensing across the OmniHand line follows a clear generational progression. The OmniHand 2025 (with
              tactile option) uses 400+ force-sensitive contact points at 0.1 N resolution covering a 0–20 N sensing
              range. The Pro model advances to a multi-modal approach: 3-axis fingertip force sensing (capturing both
              normal pressure and tangential shear forces), 1-axis palm force, and 150+ total points at 0.01 N
              resolution over a 0–50 N range, with a 1000 N maximum non-destructive force. The Ultra-T claims "full-hand
              3D tactile sensing" and an integrated palm camera, but no tactile point counts, resolutions, or sensing
              ranges have been published for this generation. For context, the human hand contains roughly 17,000+
              mechanoreceptors across the palm and fingers, meaning even the Pro model captures contact information at a
              small fraction of biological density.
