  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Geopolitical and Regulatory Risk
        blocks:
          - type: paragraph
            body: >-
              Agilink's Chinese origin creates a concentrated geopolitical risk profile that spans US legislative
              action, multilateral export controls, and European product-safety law. On March 26, 2026, US Senators Tom
              Cotton and Chuck Schumer introduced the American Security Robotics Act (ASRA), a bipartisan bill that
              would ban US federal government agencies from buying or operating humanoid robots made by Chinese firms.
              US News and World Report reported that Agibot and Unitree were explicitly named in the bill's language,
              with a companion House bill introduced by Representative Stefanik. The bill has not yet passed, but the
              bipartisan sponsorship and the DJI/Huawei precedents for Chinese hardware bans create a credible chilling
              effect on enterprise procurement, particularly in US defence- adjacent manufacturing.

              Beyond ASRA, the Bureau of Industry and Security (BIS) issued an advanced computing IC rule in January
              2025 restricting exports of high-end chips to entities headquartered in Country Group D:5 (which includes
              China). BIS extended the Authorized IC Designer timeline until December 31, 2026, as confirmed on the BIS
              official website. Agilink's dexterous hands embed AI inference processors whose specific classification is
              not publicly disclosed; the restriction is therefore framed as "likely subject to" EAR controls rather
              than confirmed. If Agilink's embedded inference chipsets require a BIS licence for export, supply chain
              continuity for international orders faces structural uncertainty.

              The EU AI Act (Regulation 2024/1689, effective August 2026) classifies AI systems used as safety
              components in critical infrastructure as high-risk, requiring conformity assessment, CE marking, and
              NIST-aligned documentation before EU market entry. Dexterous hands operating on production lines in EU
              member states fall squarely within this classification. Hill Dickinson's legal analysis of humanoid robot
              law (2026) identifies data privacy under GDPR — particularly biometric sensing and cloud-side tactile data
              storage — as an additional compliance dimension that Agilink has not publicly addressed.

              Domestically, China's MIIT published the first national humanoid-robot standard system in February 2026.
              Agibot's co-founder Peng Zhihui sits on the MIIT Standards Technical Committee as deputy chair alongside
              Unitree's Wang Xingxing. While this positioning gives Agibot/Agilink influence over standard-setting, it
              also creates regulatory capture risk: if Agibot-affiliated specifications embed proprietary interfaces,
              competitors may find the standards themselves act as a moat — or, conversely, Agilink's competitors may
              raise standards-abuse objections that slow Agilink's own compliance path.

              OSHA has confirmed it has no specific safety standards for the robotics industry, and ISO 10218-1:2011
              (industrial robot safety) was formally withdrawn without a humanoid- or dexterous-hand-specific
              replacement. ISO/TS 15066:2016 covers collaborative robots but does not address force limits or failure
              modes for multi-DOF dexterous hands. This regulatory gap creates both product-liability ambiguity and a
              first-mover certification risk for any jurisdiction that subsequently introduces standards.
