  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Architecture and Pricing Tiers
        blocks:
          - type: paragraph
            body: >-
              Agilink's revenue model is hardware-first: the company sells dexterous robotic hands, higher-end
              manipulation modules, and complementary grippers into embodied-AI training, industrial automation,
              logistics, service robotics, and research workflows. There is no public pricing for a subscription,
              software licence, or recurring services offering, making hardware unit economics the only meaningful lever
              for a current revenue estimate.

              The most precisely sourced price point is the OmniHand 2025 (O10) at 9,800 RMB (approximately $1,350 USD),
              which Agibot and independent distributors confirm is the first high-degree-of-freedom dexterous hand
              priced under 10,000 RMB. Third-party reseller Botonly lists the O10 at $4,420 USD as of June 2026,
              suggesting a significant mark-up in non-mainland channels, but the list price from Agibot's supply chain
              remains 9,800 RMB. The OmniHand Pro 2025, which targets industrial manufacturing and logistics, is
              available only on enterprise quotation, meaning no public ASP exists for that tier. The OmniHand 3 series
              (Ultra-T, Lite, OmniPicker 3), announced at APC 2026 in April, has no confirmed pricing; the Lite is
              described as "aggressively priced," consistent with a market-share-first posture.

              Agilink's founder Xiong Kun has described the market in three segments: entry-level 6–10 DoF hands at
              several thousand to 30,000 RMB, mid-range 11–17 DoF hands at 50,000–100,000+ RMB, and high-end flagship
              20+ DoF hands at 200,000+ RMB (where competitors include Shadow, Tesla, and Sharpa). The OmniHand 2025 at
              9,800 RMB sits at the bottom of the mid-range segment, undercutting it substantially — a deliberate
              positioning to capture the research and first-deployment market. Earlier commercial dexterous hands
              started at $10,000 (≈73,000 RMB) and reached $200,000, meaning Agilink's entry ASP is a 7x–150x reduction
              versus the prior market.

              Two supplementary revenue streams are disclosed at the strategic level but lack pricing or realized
              revenue data: supply of hands and grippers to parent Agibot for Agibot-brand robot integration (an
              internal/related-party channel), and sales into embodied-AI data-collection workflows where high-DoF hands
              generate richer training data. A third potential stream — AI model and dataset licensing tied to OmniHand
              manipulation datasets — was flagged by Xiong Kun as a 2026 roadmap item but is not yet a commercial
              product. Recognition of enterprise licensing revenue would require disclosed ASPs and contract details
              that do not exist publicly.
