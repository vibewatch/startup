      - number: '7.2'
        title: Product Quality, Safety Standards Gap, and Reliability Risk
        blocks:
          - type: paragraph
            body: >-
              Agilink's core product risk is the sim-to-real accuracy collapse that IDC and Goldman Sachs identified as
              the sector's foremost technical bottleneck in 2026. IDC's May 2026 commercialisation report states
              explicitly that "accuracy of 80-90% in simulated environments often drops below 50% in real scenarios," a
              finding corroborated by the Taibo Financial translation of the Goldman Sachs January 2026 China survey
              which adds that "time required for large-scale, high-quality real data collection limits deployment
              speed." For a dexterous hand product, where tactile sensing and manipulation precision are the primary
              value proposition, a 50%-or-below real-world accuracy floor is a category-level credibility risk, not just
              a product-engineering one.

              The sole independently documented production deployment is at Longcheer Technology's Nanchang plant, where
              Agibot G2 robots embedding OmniHand achieved a reported 99.9% success rate at 310 UPH. Interesting
              Engineering confirmed this deployment but noted it was a single site under controlled conditions;
              scalability to multi-facility, multi-shift, multi-product manufacturing environments remains unverified.
              Morgan Stanley's AlphaWise survey of Chinese enterprise buyers (reported by Humanoids Daily, 2026) found
              only 23% of surveyed C-suites satisfied with current humanoid products, with dexterity and functionality
              as the primary complaints — direct evidence that market acceptance of current-generation dexterous hands
              is fragile.

              A parallel concern is that Agilink's production claims are unaudited. Humanoids Daily reported that
              "production figures in this industry are not audited and cannot be independently verified," citing the
              public dispute between Agibot (5,168 units) and Unitree (5,500 units) over 2025 humanoid shipment
              leadership. If parent Agibot's own shipment data is contested, Agilink's 8,000+ cumulative hand deliveries
              claim — derived from Agibot-sourced materials — is similarly difficult to independently corroborate.

              On safety standards, OSHA has confirmed there are no specific OSHA standards for the robotics industry.
              ISO 10218-1:2011, the historic industrial robot safety reference, was withdrawn. ISO/TS 15066:2016
              (collaborative robots) exists but is a technical specification, not a mandatory standard, and does not
              cover dexterous multi-DOF hands. NIST's AI risk framework promotes measurement science and risk-based
              governance for AI systems but is non-binding. This three-layer absence — no OSHA rule, no current ISO
              standard, no binding NIST mandate — means Agilink sells into markets where product liability for a
              hand-related workplace injury would be litigated under general product liability law rather than a
              sector-specific compliance framework, creating unpredictable damage exposure.
