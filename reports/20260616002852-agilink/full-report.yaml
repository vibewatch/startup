  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: OmniHand product family and positioning
        blocks:
          - type: paragraph
            body: >-
              Agilink (operating under its parent's agibot.com storefront and domain as of June 2026) offers three
              product tiers under the OmniHand brand, plus a companion gripper line. The OmniHand 2025 — marketed as the
              "Agile Edition" — is the accessible entry tier targeting interactive service robotics, research labs, and
              education. With 16 total degrees of freedom (10 active, 6 passive), a ≤500 g weight, and a 180×85×38.5 mm
              form factor, it is designed to fit standard humanoid wrist interfaces and collaborative robot arms without
              structural reinforcement. Its launch price of ¥9,800 (approximately $1,350 USD) was widely described as
              the first high-DoF dexterous hand to break below the ¥10,000 price point, expanding the accessible
              research and developer market. Botonly's distributor listing put it at ~$4,420 USD, reflecting
              international markup.

              The OmniHand Pro 2025 is the industrial tier, with 19 DoF (12 active, 7 passive), ≤750 g weight, and a
              dramatically higher 35 kg load capacity (palm up) enabled by its motor + screw rod drivetrain. The Pro
              carries multi-modal sensing: 3-axis fingertip force, 1-axis palm force, and 150+ tactile points at 0.01 N
              sensitivity — an order of magnitude finer than the base model. At $12,700 USD per humanoid.guide, it
              competes on capability against research-grade hands costing far more, while remaining far below the
              six-figure price of platforms such as the Shadow Dexterous Hand.

              The OmniHand 3 Ultra-T was announced on April 17, 2026 at Agibot's 2026 Partner Conference (APC 2026). It
              claims 22+3 DoF in a tendon-driven package weighing only 500 g — the same as the entry OmniHand 2025,
              despite having more than twice the active degrees of freedom. Alongside the Ultra-T, the company also
              announced OmniHand 3 Lite (ruggedized, high-impact variant) and OmniPicker 3 (industrial gripper, 140 N
              force, 1,000,000-cycle durability). No commercial availability date for the Ultra-T has been disclosed;
              all announced specifications originate from the Agibot press release and have not been independently
              verified by reviewers, customers, or third-party benchmarks.
