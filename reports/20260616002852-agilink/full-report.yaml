      - number: '7.5'
        title: Mitigations, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Agilink has several structural mitigations that partially offset the risk stack. MIIT committee
              participation (Peng Zhihui as deputy chair) gives Agibot-ecosystem companies advance visibility on
              standard-setting, which reduces regulatory surprise for China-side compliance. The four-round funding
              cadence — including strategic investors from the automotive, electronics, and internet sectors — provides
              multiple capital paths even if any single investor withdraws. Longcheer Technology's confirmed 99.9%
              success rate, while limited to one site, provides a reference proof that investors can cite for near- term
              commercial credibility.

              However, the mitigation maturity on geopolitical risk is low. No reviewed source discloses any contingency
              plan for ASRA passage, EU AI Act conformity engineering, or BIS licence procurement for embedded chips.
              The China NI Law data-sovereignty issue has no disclosed architecture response for foreign enterprise
              customers. These are material diligence items.

              Monitorable triggers for investment thesis deterioration include: (1) ASRA advancing out of committee or
              signed into law — this would close US federal procurement and likely trigger enterprise-buyer chilling
              beyond government; (2) Unitree's IPO establishing a sector market cap that implies a lower revenue
              multiple for Agilink; (3) any disclosed product safety incident involving a dexterous hand in a production
              environment; (4) Agibot's STAR Market IPO filing disclosing Agilink ownership below 40%, implying dilution
              that may mis-align parent incentives; (5) BIS adding Agilink or its chip suppliers to the Entity List or
              issuing a more restrictive IC rule.

              Kill criteria for the investment thesis are: Agilink loses its primary channel (Agibot collapses or severs
              the hand supply agreement); a major product liability judgment in any G7 jurisdiction establishes
              precedent for manufacturer liability for autonomous manipulation; or the Chinese government's subsidy
              programme is withdrawn from humanoid components, triggering a unit economics reversal.
