      - number: '4.6'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Agilink presents a compelling but highly opaque financial profile. The revenue architecture is coherent
              and the hardware pricing strategy is designed for volume at the expense of near-term margin — consistent
              with a land-and-expand model where installed base drives future software, data, and upgrade cycles. The
              shipment-based revenue proxy ($7–27 million USD cumulative by May 2026) is plausible but built on
              assumptions that cannot be independently verified given the absence of any audited financial disclosure.

              The valuation-to-estimated-revenue ratio implies a highly speculative multiple in excess of 40x forward
              revenue even on optimistic assumptions, justified only by the strategic optionality of becoming the
              dominant dexterous hand supplier to the global humanoid robotics industry — a sector that Chinese
              government planners have explicitly targeted, even while warning of bubble risk. The NDRC's 2025 warning
              that more than 150 robotics companies risk "speed and bubbles" through repetitive products is directly
              applicable to the Chinese dexterous hand segment, where at least five well-funded companies (LingXin,
              Linkerbot, XHAND, Shadow, and others) compete for the same robotic platform integrations.

              The financial diligence blockers are severe: no audited revenue, no gross margin disclosure, no burn rate,
              no cap table, no customer concentration analysis, and no independent board. Parent Agibot controls
              approximately 80% of equity at formation, raising legitimate concerns about transfer-pricing arrangements,
              governance independence, and potential conflicts of interest in customer contracts. The investor base
              includes strategic industrials (SAIC, Joyson, Longcheer) whose commercial relationships with Agilink
              create additional complexity for arm's-length analysis. Until Agilink files for a public offering or
              provides investor-level financial disclosure, the financial case remains primarily a market-positioning
              bet rather than an underwriteable investment.
            claimRefs:
              - CI010
              - CI011
              - CI024
