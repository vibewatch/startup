      - number: '4.4'
        title: Shipment-Based Revenue Proxy and Traction Gaps
        blocks:
          - type: paragraph
            body: >-
              Agilink's only public quantitative traction metrics are shipment counts: 8,000+ dexterous hands and
              10,000+ grippers delivered by approximately May 19, 2026, per Pandaily, Gasgoo, Humanoidsdaily, and
              Agibot's own materials. Approximately 1,000 of the delivered units were actively operating in 8-hour
              continuous shifts in retail warehouses, pharmacies, and factories at the same date, providing a crude
              utilization signal.

              From these shipment counts, a revenue proxy can be constructed. The OmniHand 2025 (O10) is priced at 9,800
              RMB per unit. If all 8,000 hands were sold at this floor ASP, cumulative revenue would be approximately
              78.4 million RMB (~$10.7 million USD). However, several factors make the true figure uncertain. First, the
              product mix includes OmniHand Pro 2025 units (enterprise pricing, unknown ASP, probably 30,000–80,000 RMB
              or higher). Second, some hands were produced and transferred within the Agibot ecosystem at internal
              transfer pricing rather than external commercial ASPs. Third, gripper units (10,000+) carry a lower ASP
              than hands, perhaps 2,000–5,000 RMB each. A blended scenario using 50% O10 at 9,800 RMB, 30% Pro at 30,000
              RMB, and 20% legacy/internal transfer at 5,000 RMB produces an average hand ASP of roughly 17,000 RMB,
              implying cumulative hand revenue near 136 million RMB (~$18.6 million). Adding 10,000 grippers at an
              estimated 3,000 RMB each adds another 30 million RMB. This gives a rough cumulative revenue range of
              50–200 million RMB ($7–27 million USD) with substantial sensitivity to the Pro mix assumption. All these
              estimates carry the caveat that pre-spinout transfers and related-party sales may not represent
              arm's-length market revenue.

              Critically, no independent customer revenue data, no accounts receivable disclosure, and no public audited
              financials exist for Agilink. The shipment figure itself has been reported only through company-aligned
              media and industry databases — no independent audit or third-party verification has been published.
              Evidence gaps around customer concentration (what share goes to Agibot's own robots vs. external buyers),
              return/failure rates, warranty obligations, and deferred-revenue treatment are all material for
              underwriting purposes.
