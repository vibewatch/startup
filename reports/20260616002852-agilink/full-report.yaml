      - number: '5.5'
        title: Differentiation, technical risks, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Agilink's primary technical differentiation arguments are: (1) a three-tier hardware ladder covering
              research-price to industrial-capability in a single ecosystem; (2) mass-production ancestry — the OmniHand
              2025 was commercially available at Agibot before the spinout, giving the product line a manufacturing
              maturity advantage over paper-stage competitors; (3) integrated AI training infrastructure via Genie
              Studio and AgiBot World, creating a closed-loop data flywheel that should improve manipulation policies
              over time; and (4) open-source SDKs under a recognized Chinese open-source license, lowering integration
              friction for academic and OEM customers.

              Against these strengths, the chapter surfaces five material technical risks. First, the OmniHand 3
              Ultra-T's flagship specifications — 10:1 load-weight ratio, sub-0.3-second response, full-hand 3D tactile
              — rest entirely on Agibot's APC 2026 press release without any independent replication, customer quote, or
              detailed test protocol; extraordinary claims in robotics hardware routinely fail to reproduce at full
              fidelity in independent evaluation. Second, tactile sensing maturity across all tiers is limited relative
              to biological density: the human hand has ~17,000+ mechanoreceptors versus OmniHand 2025's 400-point
              (optional) and Pro's 150-point arrays; the Ultra-T's full-hand 3D claim lacks quantitative specification.
              Third, the SDK is locked to Ubuntu 22.04 x86_64 with no documented ARM/edge path, creating an integration
              friction for robotics teams running Raspberry Pi, NVIDIA Jetson, or Qualcomm hardware. Fourth, no
              published MTBF, durability cycle count (analogous to the OmniPicker 3's 1,000,000-cycle rating), warranty
              terms, or field failure rate data exist for any OmniHand variant, making component lifetime and total cost
              of ownership analysis impossible. Fifth, the absence of an operational agilink.cn domain and continued
              product hosting at agibot.com raises questions about brand independence, IP attribution, and what specific
              IP transferred with the spinout — material for any licensing, indemnification, or acquisition scenario.
            claimRefs:
