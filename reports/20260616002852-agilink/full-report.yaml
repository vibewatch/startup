      - number: '4.3'
        title: Unit Economics and Hardware Cost Structure
        blocks:
          - type: paragraph
            body: >-
              No gross margin, cost of goods sold, or unit-level profitability data has been publicly disclosed by
              Agilink or Agibot for any dexterous hand product. All unit-economics analysis here is estimated or
              inferred and labeled accordingly.

              Dexterous robotic hands in the Chinese mid-range segment carry a bill of materials (BOM) that industry
              analysts estimate divides roughly as follows: actuation motors account for 30–40% of BOM cost, sensors and
              electronics (tactile arrays, PCBs, MCUs, and edge processing) for 20–30%, structural materials
              (injection-molded PA/silicone plus aluminum alloys) for 20–25%, cables and gears for 5–10%, and assembly
              and labor for 5–15%. At a 9,800 RMB ASP, these percentages imply a per-unit material cost in the range of
              4,000–7,000 RMB if gross margin is 30–55%. A 30–55% gross margin would be consistent with hardware startup
              norms, though aggressive market-entry pricing at 9,800 RMB — which is described as designed to broaden
              access rather than maximize margin — may compress this. Chinese dexterous hand makers benefit from
              domestic supply chains for micro-motors ($10–$30 per motor in volume) and injection-molded parts, which
              are unavailable at equivalent cost to Western competitors.

              A distinguishing economics factor is Agilink's self-developed motors and key material components, cited by
              Xiong Kun as the basis for cost control and "core pricing power." Vertical integration reduces dependence
              on third-party actuator suppliers, which can represent the single largest BOM line. Access to Agibot's
              supply chain infrastructure and manufacturing scale from the parent's 10,000-unit production milestone
              further lowers marginal cost. These factors together suggest Agilink can sustain competitive pricing
              longer than a standalone startup, but exact cost-per-unit and manufacturing capacity figures remain
              privately held.

              Working capital implications are significant: hardware manufacturing requires inventory financing,
              component procurement lead times, and assembly line capex. A startup scaling from pre-launch to 8,000+
              units in roughly 12 months implies substantial inventory financing and production-line investment,
              consistent with the rapid capital-raising cadence. Customer advance payments from Agibot (as a
              related-party buyer) would reduce working capital strain, but the magnitude is unknown.
            claimRefs:
