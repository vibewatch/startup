      - number: '1.4'
        title: Product stack, shipment scale, and milestones
        blocks:
          - type: paragraph
            body: >-
              Agilink's commercialization case rests on two linked claims: it inherited a credible product base from
              Agibot's hand unit, and it already scaled that base well beyond lab volume. Company and media materials
              say the team mass-produced multiple hand products during 2025, with quarterly sales in the thousands even
              before the spinout. Public product references identify OmniHand 2025 as a compact 16-DoF hand with 10
              active and 6 passive degrees of freedom, sub-500 gram weight, CANFD connectivity, ROS 2 support, and
