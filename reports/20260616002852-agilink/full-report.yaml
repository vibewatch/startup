        title: Funding history, ownership, and unicorn step-up
        blocks:
          - type: paragraph
            body: >-
              Agilink raised capital at an unusually fast cadence after incorporation. Pedaily reported on 2026-01-26
              that the company had already completed two financings led by Hillhouse Venture and BlueRun Ventures and
              was planning an additional strategic round. On 2026-02-10, multiple outlets reported a new
              several-hundred-million-yuan round led by a major internet company, with Baidu Ventures, Yunfeng Capital,
              Synstellation Capital, Joyson Electronics, Longcheer Technology, SAIC Financial Holdings, and other
              strategic and financial investors participating; legacy backers BlueRun and Hillhouse reportedly increased
              their positions. By 2026-05-19 and 2026-05-20, Reuters-equivalent Chinese business coverage, sector media,
              and English-language summaries converged on the next step-up: Agilink had completed a further
              several-hundred-million-yuan round and its valuation had surpassed US$1 billion, making it a unicorn less
              than five months after incorporation. What the public record does not provide is equally important. No
              reviewed source disclosed total lifetime capital raised, price per share, board rights, employee option
              pool, debt facilities, or any secondary sales. The funding story is therefore strong on momentum and
              investor quality but still thin on cap-table detail and underwriting fundamentals.
