      - number: '8.6'
        title: Investment Recommendation, Kill Criteria, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more at medium confidence, with a high risk rating and a stretched
              valuation stance. The stretched designation does not mean overvalued in absolute terms — the investor
              base, velocity, and dexterous hand TAM thesis are all credible — but means that the current public
              evidence base is insufficient to underwrite a $1 billion entry with conviction. The difference between
              "stretched" and "fair" hinges on three disclosures: audited revenue, cap-table detail including
              pre/post-money specification, and at least one external (non-Agibot) customer reference.

              The recommendation would upgrade to buy if: (a) Agilink files financials with CSRC or otherwise discloses
              revenue showing growth consistent with the shipment proxy, (b) a subsequent round is priced above $1.5
              billion by a new institutional investor, confirming the mark, or (c) Agibot's STAR Market IPO S-1
              disclosure separately validates the Agilink revenue contribution. It would downgrade to avoid if: (a)
              Agibot reintegrates the hand supply chain or acquires Agilink at below-$1 billion terms, (b) BIS applies
              export control to the embedded inference chipsets used in OmniHand, or (c) the next Agilink round is a
              down-round. The kill criteria table documents seven triggers with specific thresholds. The diligence asks
              table captures the six minimum evidence items required before capital commitment at current valuation.
            claimRefs:
              - CV001
