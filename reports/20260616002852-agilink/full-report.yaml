      - number: '4.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Undisclosed financials and NDRC bubble risk create compounding uncertainty
            body: >-
              Agilink has no publicly disclosed revenue, gross margin, burn rate, or cap table. The investor base is
              institutional but has not imposed public reporting obligations. Simultaneously, China's NDRC warned in
              2025 that 150+ humanoid robot companies — many building similar products — risked "bubbles" and
              "repetitive-clone" market dynamics. A capital-efficiency correction in the Chinese robotics sector could
              impair Agilink's ability to raise a fifth round at its $1B+ valuation, especially if revenue traction from
              external customers (outside the Agibot ecosystem) does not materialize at scale.
            calloutType: risk
            claimRefs:
              - CI024
