      - number: '8.3'
        title: Valuation Frameworks — Hardware, Platform, and Strategic-Option Methodologies
        blocks:
          - type: paragraph
            body: >-
              Hardware companies at Agilink's stage can be valued through four frameworks: revenue multiples (P/S),
              unit-shipment proxy value, platform/software option-value, and acquirer strategic value. None of these
              produces a stable anchor when revenue is undisclosed.

              A conventional hardware P/S multiple requires knowing revenue. The shipment-based proxy — approximately
              8,000 dexterous hands at a blended ASP of 9,800–30,000 RMB suggests cumulative revenue of roughly 78–240
              million RMB ($10–33 million USD). At a $1 billion mark, the implied revenue multiple is 37–100x cumulative
              receipts, far outside the 5–15x forward-revenue range typical for hardware startups at Series C stage.
              This gap is not automatically disqualifying: Goldman Sachs notes that private robotics valuations since
              2025 have been driven primarily by data flywheel, manufacturing scale, and deployment proof rather than
              current-period economics. The IDC forecast of 510,000+ humanoid units by 2030 at 95% CAGR provides the
              denominator for a forward-looking TAM argument.

              A platform/software option-value lens is more forgiving. If Agilink successfully monetises its proprietary
              manipulation dataset and AI-model licensing to third-party OEMs — a stated but not yet commercial roadmap
              item per Xiong Kun — the applicable multiple shifts from hardware (5–15x) toward AI platform (20–50x
              forward revenue). Morgan Stanley's component-supplier analysis specifically identifies Inovance and
              Leaderdrive as earliest profitability beneficiaries of the robotics supply chain, validating the
              component-layer thesis. For acquirer strategic value, the moat for a proprietary dexterous hand stack with
              8,000+ units in the field and 3D tactile sensing is real, though unquantifiable without disclosed IP
              registry and gross margin.
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
