      - number: '8.5'
        title: Strategic Premium and Discount Factors — China, Governance, and Component Tier
        blocks:
          - type: paragraph
            body: >-
              Agilink's valuation is subject to four systematic premium/discount factors that do not cancel out cleanly
              and must be weighed together.

              First, a China-origin geopolitical discount applies relative to equivalent Western-market valuations. The
              American Security Robotics Act (bipartisan Senate bill, March 2026) explicitly targets Chinese humanoid
              robot makers, and BIS export controls on advanced computing ICs create supply chain friction for any
              component embedding AI inference processors. Unitree's pre-IPO discussions suggest Chinese A-share STAR
              Market listings for robotics companies trade at 30–50% discounts to US VC marks on equivalent
              fundamentals. At Agilink's stage, this discount is partially offset by China's 15th Five-Year Plan
              alignment and domestic supply chain cost advantage.

              Second, a related-party governance discount is warranted. Agibot retains approximately 80% of Agilink at
              incorporation, and Deng Taihua (Agibot chairman) serves as legal representative. The absence of an
              independent board, disclosed preference structure, or minority protection covenant means external minority
              investors have limited governance recourse. This risk mirrors the governance profile of early Unitree and
              UBTECH pre-IPO — both required governance remediation before STAR Market listing.

              Third, a component-tier structural discount applies versus full-system humanoid valuations. At Agilink's
              current hardware-first stage, the applicable market is 10–15% of the full humanoid system value (the
              dexterous hand is one of five or six major subsystems). The strategic premium for end-effector
              specialization only unlocks if Agilink achieves cross-OEM supply relationships that no single full-system
              player can replicate internally.

              Fourth, a first-mover premium is real but fragile. No other Chinese dexterous hand maker has shipped
              8,000+ units with tactile feedback in this form factor at sub-10,000 RMB. The Unitree numbers dispute
              (5,500 vs 5,168 units, unverified) demonstrates that sector-wide claims are not audited; Agilink's figures
              carry the same caveat. If the premium is real, it must be defended through IP filings, manufacturing moat,
              and proprietary training data — none of which are publicly verifiable from the outside.
            claimRefs:
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV035
              - CV036
              - CV037
