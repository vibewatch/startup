              - CI035
          - type: callout
            title: Revenue proxy assumes no material transfer-pricing distortion
            body: >-
              The shipment-based revenue proxy (50–200M RMB cumulative) assumes that the 8,000+ delivered hands and
              10,000+ grippers were sold at or near the confirmed list price of 9,800 RMB (O10). If a material fraction
              of shipments were internal Agibot transfers at cost or sub-market transfer prices, realized external
              revenue could be significantly below this range. The related-party revenue risk is the single largest
              uncertainty in the financial model and requires a related-party transaction disclosure to resolve.
