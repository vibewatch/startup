    Agilink (临界点 AGILINK) is a Shanghai-based dexterous robotic hand company that was spun out of Agibot's manipulation
    business in January 2026. The company sells a tiered OmniHand portfolio spanning the OmniHand 2025, OmniHand Pro
    2025, and OmniHand 3 flagship line, alongside complementary grippers aimed at embodied-AI OEMs, industrial
