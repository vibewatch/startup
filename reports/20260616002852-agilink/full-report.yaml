      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: No Standalone Dexterous Hand Market Sizing Available
            body: >
              No independent analyst report as of June 2026 publishes a standalone market size for the dexterous robotic
              hand or intelligent end-effector sub-segment. All sizing in this chapter proxies from the broader humanoid
              robot hardware market with an assumed 10–15% end-effector cost share—an estimate that is not independently
              validated. Investors and acquirers should treat the SAM figures as planning scaffolding only, not verified
              market data.
            calloutType: risk
            claimRefs:
              - CM038
          - type: callout
            title: 'Goldman Sachs 2026 Pivot: From Universal to Dedicated Applications'
            body: >
              Goldman Sachs' January 2026 China industry survey revealed that the humanoid robot sector has
              fundamentally pivoted its commercial focus from "universal imagination"—robots that can do anything— to
              "dedicated landing" in narrow use cases such as security patrols, hotel guidance, and simple logistics
              sorting. This shift directly benefits Agilink, whose specialized dexterous hand is a high-value component
              precisely in the remaining complex-task applications that require fine manipulation—while the easier use
              cases that dominate near-term deployment do NOT require advanced dexterous hands. This creates both an
              opportunity (Agilink is positioned in the premium, hard-to-solve segment) and a risk (near-term volume may
              be smaller than the overall humanoid shipment figures suggest).
            calloutType: insight
            claimRefs:
              - CM035
          - type: callout
            title: 'Key Assumption: End-Effector Represents 10–15% of Humanoid Platform Cost'
            body: >
              The SAM estimate for Agilink's dexterous hand segment is derived using a 10–15% end-effector cost share of
              full humanoid platform value. This assumption is not independently validated by any analyst report. The
              actual share may be higher (Agilink's premium multi-DOF hand) or lower (integrated-hand platforms where
              the hand cost is amortized across the body). Diligence should seek Agilink's disclosed BOM breakdown or
              comparable component-cost filings from Chinese suppliers.
            calloutType: assumption
            claimRefs:
              - CM003
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Categorization
        blocks:
          - type: paragraph
            body: >-
              The competitive terrain for Agilink spans a wider set of alternatives than a purely dexterous-hand lens
              suggests. Buyers — humanoid OEM integrators, research labs, logistics operators, and enterprise automation
              teams — can solve the same manipulation job five different ways: (1) a premium Western research-grade hand
              (Shadow Robot Dexterous Hand, Allegro Hand V4) that prioritizes published specs and ecosystem citations;
              (2) an academic open-source platform (LEAP Hand, CMU 2023) that trades commercial polish for near-zero
              procurement cost; (3) a Chinese commercial standalone hand (RobotEra XHAND1, Inspire Robots RH56 series)
              that competes on direct-drive durability or price; (4) a humanoid OEM bundle in which the hand is
              inseparable from the platform (Fourier GR-2, Unitree R1 with swappable end effectors); or (5) a logistics
              end-effector system (RightHand RightPick 3, Dexterity AI Mech) that packages hardware and software for a
              single vertical task such as piece-picking, bypassing the general-purpose hand market entirely. Agilink
              sits at the intersection of categories (3) and (4): it spun out of Agibot's humanoid hardware but markets
              its hands as standalone products to third-party OEMs and researchers. This position is unique in the
              Chinese market today — Inspire Robots sells primarily into domestic industrial channels with limited
              international-facing documentation, while RobotEra's XHAND1 is deeply tied to the STAR1 humanoid
              ecosystem. However, this position also exposes Agilink to substitution from both sides: well-funded
              incumbents above (Shadow Robot brand equity with Western enterprise buyers) and ultra-low-price entrants
              below (LEAP Hand or Unitree R1 bundled system at a total price below Agilink's standalone hand list).
