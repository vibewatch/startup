      - number: '4.2'
        title: Capital Formation and Investor Structure
        blocks:
          - type: paragraph
            body: >-
              Agilink completed four funding rounds between January and May 2026 — an exceptional cadence that SCMP
              analyst Wu Meimei (ITJuzi) described as "unprecedented in the humanoid component sector." The first two
              rounds, completed before the end of January 2026, were led by Hillhouse Venture and BlueRun Ventures
              (BRV). The third round, announced February 10–11, 2026, raised several hundred million yuan from a
              syndicate led by a major internet company, with participation from Baidu Ventures, Yunfeng Capital
              (Yunfeng Fund LP), C Capital, Synstellation Capital, Joyson Electronics (Ningbo Joyson Electronic Corp.),
              Hangzhou Longqi Scientific Investment (Longcheer Technology), SAIC Motor Financial Holdings, BRV Partners,
              and returning investors Hillhouse and BlueRun. C Capital separately confirmed the investment on its own
              website, describing Agilink as a key embodied-intelligence component play. The fourth round, closing in
              May 2026, raised additional several hundred million yuan; the disclosed investors include Baidu Ventures,
              Yunfeng Capital, SAIC Financial Holdings, and Hillhouse Capital.

              The valuation crossed $1 billion USD (unicorn threshold) after the fourth round, per reporting by SCMP,
              Reuters, Humanoidsdaily, and multiple Chinese business outlets. No total lifetime capital raised figure
              has been publicly disclosed; however, with at least three of four rounds described as "several hundred
              million yuan" or larger, the aggregate is plausibly above 500 million RMB (~$68 million) and may be
              substantially higher. The implied valuation-to-estimated-revenue multiple is highly speculative given the
              revenue proxy uncertainty (discussed in Section 4).

              It is important to distinguish Agilink capital from Agibot (parent) capital. Agibot has separately raised
              approximately $225 million equivalent in its own funding rounds (2024–2025) and is pursuing a STAR Market
              IPO. Agibot retained approximately 80% of Agilink at incorporation, though subsequent dilution from four
              external rounds is unquantified. The strategic investor base — including SAIC Financial Holdings, Joyson
              Electronics, and Longcheer Technology — reflects deep automotive and electronics supply-chain participants
              betting that dexterous hands become standard components in next-generation assembly lines. SAIC and Joyson
              are both publicly listed manufacturers with strategic rationale to secure early preferential supply
              relationships. Joyson's own 2025 annual report (filed with the CSRC-mandated disclosure platform) confirms
              strategic expansion into the "emerging intelligent body supply chain," consistent with its Agilink
              investment posture.
