      - number: '3.4'
        title: Adjacent End-Effector Systems and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Dexterity AI (US) represents the most mature physical-AI end-effector system alternative, competing not on
              hand form factor but on outcomes. Its "Foresight" world model has trained on over 100 million autonomous
              actions deployed in production with Fortune 50 enterprise customers. Dexterity has deployed its Mech
              superhumanoid for truck-loading operations with Sagawa Express in Japan and integrated with Beckhoff USA
              for EtherCAT-standard automation. A 17× inference speedup using NVIDIA TensorRT and custom CUDA kernels
              enables safety-rated physical AI at a performance level that lab-assembled hands cannot match. Dexterity's
              strategic position is software-and-service-first: it competes with Agilink not by selling a hand, but by
              selling a complete manipulation outcome — effectively disintermediating the standalone hand market in
              verticals where the task is well-defined and volume is high. RightHand Robotics (founded 2014, $23M Series
              B closed December 2018) markets the RightPick 3 piece-picking system delivering up to 1,200 picks per hour
              with Level 4 autonomy and greater than 99% pick accuracy, handling items up to 2 kg. Deployed at PALTAC
              Japan (500,000 sq ft, consumer packaged goods) and Apologistics Netherlands (pharma, AS/RS), RightPick
              integrates with UR5e/UR10e cobot arms and is not an anthropomorphic hand — it is a task-specific picking
              effector. For logistics buyers, RightPick 3 eliminates the need for a dexterous hand entirely by solving
              piece-picking deterministically with fewer DOF and a well-proven software layer. The status-quo
              alternative for most manufacturing and logistics buyers remains human labor supplemented by fixed
              automation (conveyor systems, vacuum suction, rigid two-jaw grippers). The bar for a dexterous hand is not
              just to outperform a competitor's hand; it must outperform the combined economics of human flexibility
              plus vacuum end effectors in semi-structured environments, which requires both high reliability and a
              per-unit cost below roughly $10,000 for most operators.
            claimRefs:
              - CP026
              - CP027
              - CP028
              - CP029
              - CP030
              - CP031
