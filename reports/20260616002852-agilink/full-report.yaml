              cumulative deliveries above 8,000 dexterous hands and 10,000 grippers, with use cases spanning industrial
              automation, logistics, service robotics, and special operations. Even so, public disclosure still omits
              ASPs, gross margin, failure rates, warranty terms, and customer concentration, so the shipment headline
              should be viewed as scale evidence rather than proof of durable economics.
