  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Agilink's $1 Billion Unicorn Mark — Context and Evidence Quality
        blocks:
          - type: paragraph
            body: >-
              Agilink crossed the unicorn threshold in May 2026, reaching a reported valuation above $1 billion after
              completing its fourth financing round since incorporating on 2026-01-14. The only English-language primary
              source directly confirming the $1 billion figure is a Crunchbase News article dated June 1, 2026, which
              states: "Shanghai-based Agilink has raised four funding rounds since it was spun out of Agibot in January,
              and reached a valuation of $1 billion." The article does not specify round size, pre-money versus
              post-money convention, or investors for the fourth round. Multiple Chinese business media outlets (sector
              press, Pedaily equivalents) reported the same valuation step-up in the May 19–20, 2026 window,
              corroborating the Crunchbase account, but none published audited data.

              This evidentiary profile — investor-reported unicorn with no revenue disclosure — is structurally common
              across the 2025–2026 robotics funding wave, in which $14 billion globally and $5.6 billion in China alone
              were deployed with minimal fundamental underwriting of current-period economics. Agilink's four-round
              velocity (five months to unicorn) has no direct precedent in the dexterous-hand component subsector,
              though it compares favourably to Tianji's timeline in the robot-arm analogue. The investor base —
              Hillhouse Venture, BlueRun, Baidu Ventures, Yunfeng Capital, SAIC Financial Holdings, Joyson Electronics,
              and C Capital — is high quality by Chinese VC standards, consistent with a market-share-first race posture
              rather than a return-discipline posture. The absence of a publicly stated pre/post-money distinction means
              that any entry price analysis must treat the $1 billion as a directional mark subject to a ±20% ambiguity
              band depending on round size.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV016
              - CV017
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
