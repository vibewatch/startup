    rows:
      - - Industrial logistics / parcel sorting
        - Human pickers or fixed gripper changeover by parcel type
        - OmniHand Pro on G2 mobile manipulator; single end-effector handles diverse SKUs without changeover
        - G2+OmniHand Pro demonstrated live mixed-parcel sorting at 2025 G2 launch
        - No disclosed throughput rate, error rate, or multi-shift reliability data
      - - Precision assembly (electronics, automotive)
        - Human operators for RAM insertion, seatbelt cylinder, fine-pitch parts
        - OmniHand Pro 0.02 mm repeatability and 20 N tip force for component handling
        - RAM module insertion and seatbelt lock assembly demonstrated at G2 launch event
        - No disclosed cycle time, defect rate, or comparison with human operator speed
      - - Interactive service / HRI (human–robot interaction)
        - Dedicated service robot hands without tactile feedback or safety design
        - OmniHand 2025 with anti-pinch design and back-of-hand touch sensing
        - "AgiBot A2 demos: unpacking, pouring, handover, gestures reported; no user study data"
        - No formal HRI safety certification disclosed (e.g., ISO/TS 15066 cobot standards)
      - - Embodied AI training / research
        - Expensive research-grade hands ($14K–$130K+) limiting dataset scale
        - OmniHand 2025 at ¥9,800 enables large-scale teleoperation data collection; AgiBot World uses it
        - "AgiBot World: 1M+ trajectories, 217 tasks; OmniHand hardware used across dataset"
        - Academic community access requires import logistics and CANFD adapter procurement
      - - University and education labs
        - Allegro V4 (~$15K) or LEAP Hand ($2K, limited payload) as the accessible options
        - OmniHand 2025 at ¥9,800 / ~$4,420 with open SDK bridges gap between LEAP and Pro
        - Comparable DoF to Allegro at ~30% of price; SDK less mature than Allegro's decade of ROS support
        - No academic-specific licensing, simulation pre-integration pack, or educational discount announced
    notes: >-
      Deployment evidence is based on company demonstrations, product announcements, and published
      dataset documentation. No independent customer validation, field reliability reports, or
      throughput benchmarks have been publicly disclosed.
