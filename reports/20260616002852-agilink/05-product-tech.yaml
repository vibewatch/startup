  - id: TE003
    title: Technology and operating architecture layers
    columns:
      - Layer / component
      - Role in system
      - Key dependency
      - Risk / gap
    rows:
      - - Mechanical structure (PA + silicone)
        - Physical fingers, palm, and wrist; houses actuators and sensors
        - Supplier-grade PA12 nylon and EcoFlex/silicone for fingertips
        - No disclosed domestic vs import split for materials; silicone durability under repeated stress unquantified
      - - Actuation (motor + gear / motor + screw rod)
        - Drives 10–12 active DoF; generates fingertip force
        - Motor supplier undisclosed; gear and screw rod quality determines repeatability
        - Sole-source motor risk; 0.02 mm repeatability for Pro validated only by company
      - - Tendon transmission (OmniHand 3)
        - Routes motor torque to finger joints via flexible tendons over pulleys
        - Tendon material, routing, and pre-tensioning quality
        - Tendon wear and longevity untested publicly; no disclosed replacement cycle
      - - Tactile sensor array
        - Detects contact force, shear, and slip events for closed-loop control
        - Sensor manufacturer and integration interface not disclosed
        - 400-point (O10) and 150-point (O12) density far below human tactile resolution; Ultra-T claims "full 3D" without spec
      - - CANFD communication (1 kHz)
        - Real-time joint command / feedback loop between controller and hand
        - ZLG USBCANFD adapter (USB-to-CANFD bridge); single-vendor dependency
        - ZLG-specific driver may limit host computer portability; no documented fallback
      - - OmniHand SDK (Python / C++)
        - Developer API for position, torque, velocity, hybrid, and tactile control
        - Ubuntu 22.04 x86_64; CMake 3.24+; Mulan PSL v2 open-source license
        - ARM/edge deployment not supported; SDK version 0.8.0 suggests pre-1.0 maturity
      - - ROS 2 driver
        - Middleware integration for research and industrial robotics stacks
        - ROS 2 Humble/Jazzy compatibility via AimRT middleware
        - ROS 2 version compatibility matrix not published; driver lifecycle commitment undisclosed
    notes: >-
      Layer descriptions are synthesized from official product pages, GitHub SDK documentation, and
      the robotscanada.com technical guide. Dependency and risk assessments are analyst inferences
      based on industry norms; no internal supply chain or component audit has been reviewed.
