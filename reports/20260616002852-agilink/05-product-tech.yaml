callouts:
  - calloutType: strength
    title: Three-tier hardware ladder at price-disrupting points
    body: >-
      The OmniHand family spans research-accessible (¥9,800), industrial-capable ($12,700), and
      next-generation flagship (announced, price TBD) in a single vendor ecosystem with shared
      SDK, URDF, and ROS 2 tooling. This breadth makes Agilink a viable single-source supplier for
      customers ranging from university labs to manufacturing integrators.
    claimRefs:
      - CE001
      - CE009
      - CE017
      - CE027
      - CE028

  - calloutType: risk
    title: OmniHand 3 Ultra-T specs are unverified company claims
    body: >-
      The 10:1 load-to-weight ratio, sub-0.3-second response time, and "full-hand 3D tactile sensing"
      for the Ultra-T rest solely on Agibot's APC 2026 press release without independent replication,
      customer confirmation, or disclosed test protocol. Robotics hardware announcements frequently
      fail to achieve advertised specs under independent evaluation. Investors and integrators should
      treat Ultra-T figures as aspirational until third-party validation is available.
    claimRefs:
      - CE017
      - CE018
      - CE019
      - CE020
      - CE022

  - calloutType: risk
    title: No published reliability or MTBF data for any OmniHand variant
    body: >-
      Despite reporting 8,000+ cumulative hand deliveries, Agilink and Agibot have not disclosed
      failure rates, mean time between failures, warranty terms, or replacement cycle data for any
      OmniHand variant. The OmniPicker 3 gripper was given a 1,000,000-cycle durability rating,
      but no equivalent figure exists for the dexterous hands. This gap makes component lifetime and
      total cost of ownership analysis speculative.
    claimRefs:
      - CE042
      - CE043

  - calloutType: insight
    title: SDK platform constraint could limit addressable market
    body: >-
      Locking the OmniHand SDK to Ubuntu 22.04 x86_64 excludes customers running robot controllers
      on ARM SoCs (NVIDIA Jetson, Raspberry Pi CM4) or Windows-based industrial automation stacks.
      Edge deployment — where the robot itself controls the hand without a tethered workstation —
      requires an ARM port that is not currently documented. Alleviating this constraint would
      materially expand the addressable developer base.
    claimRefs:
      - CE023
      - CE040

