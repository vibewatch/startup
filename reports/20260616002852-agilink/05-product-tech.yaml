  evidenceGaps:
    - type: missing-source
      severity: material
      topic: OmniHand 3 Ultra-T verification
      missingEvidence: >-
        Independent third-party testing of OmniHand 3 Ultra-T specifications including the 10:1
        load-to-weight ratio, sub-0.3-second response time, and full-hand 3D tactile sensing density.
      whyItMatters: >-
        All OmniHand 3 Ultra-T specifications come solely from an Agibot press release. Without
        independent validation, investors and integrators cannot assess the degree to which announced
        specs will be achieved in shipping hardware.
      diligencePath: >-
        Request pre-production samples from Agilink; commission independent lab evaluation of load,
        response, and tactile specs; seek customer reference when Ultra-T ships.
      relatedQuestionRefs:
        - QE006
        - QE016
        - QE025

    - type: missing-source
      severity: material
      topic: reliability gap
      missingEvidence: >-
        MTBF, cycle durability, warranty terms, or any field failure rate data for OmniHand 2025
        and Pro 2025 after 8,000+ units shipped.
      whyItMatters: >-
        Without durability data, total cost of ownership calculation is impossible, and the 8,000+
        unit shipment figure cannot be used to infer robustness without knowing return rates.
      diligencePath: >-
        Request internal failure/return rate data from Agilink; survey early enterprise customers
        (Agibot G2 deployments) for field performance; benchmark against OmniPicker 3's 1M-cycle rating.
      relatedQuestionRefs:
        - QE017
        - QE024

    - type: missing-source
      severity: material
      topic: SDK lifecycle
      missingEvidence: >-
        OmniHand SDK versioning roadmap, long-term support commitment, and ARM/edge deployment plan.
      whyItMatters: >-
        SDK version 0.8.0 pre-1.0 status with Ubuntu-only support limits customer adoption. Without
        a lifecycle commitment, integrators face risk of breaking changes or abandonment.
      diligencePath: >-
        Engage Agilink product team for SDK roadmap; request ARM (Jetson) porting timeline; evaluate
        whether ROS 2 driver is maintained in Agibot ecosystem or community-contributed.
      relatedQuestionRefs:
        - QE007
        - QE009
        - QE019
        - QE023

    - type: missing-source
      severity: minor
      topic: IP and brand migration
      missingEvidence: >-
        Timeline and plan for migrating OmniHand product pages and support resources from agibot.com
        to an independent Agilink domain, and disclosure of which IP was formally assigned to Agilink.
      whyItMatters: >-
        The absence of an independent Agilink domain and the continued use of agibot.com raise legal
        and operational questions about IP boundaries, indemnification, and customer support continuity
        if the parent-spinout relationship changes.
      diligencePath: >-
        Request IP assignment schedule from Agilink; review intercompany IP license agreement;
        monitor agilink.cn for operational status.
      relatedQuestionRefs:
        - QE020
        - QE024

    - type: missing-source
      severity: minor
      topic: safety certifications
      missingEvidence: >-
        Any product safety certifications (CE, UL, ISO/TS 15066 for collaborative robot safety,
        or equivalent Chinese GB standards) for OmniHand 2025 or Pro 2025.
      whyItMatters: >-
        Certification is a prerequisite for deployment in regulated industrial settings (especially
        EU markets) and for human-robot interaction scenarios where the anti-pinch design claim
        requires safety-standard backing.
      diligencePath: >-
        Request certification documentation from Agilink; check CNCA (China National Certification
        and Accreditation Administration) database; verify anti-pinch design against ISO/TS 15066.
      relatedQuestionRefs:
        - QE024

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TE002 (hardware spec comparison) contains cells marked as company claims or reference values
      for biological and announced-only hardware (human hand, Ultra-T); notes field is populated
      explaining this clearly. No further acknowledgment needed beyond what is stated in notes.
