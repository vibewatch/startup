figures:
  - id: FE001
    title: OmniHand product architecture — hardware-to-platform stack
    type: stack
    layout: standard
    summary: >-
      Three-tier stack from physical mechanics through sensing and actuation to software and AI
      platform, showing how OmniHand hardware layers connect to the Agibot developer ecosystem.
    data:
      layers:
        - label: AI / Data Platform
          detail: Genie Studio (training, sim, deployment), AgiBot World (1M+ trajectory dataset), and GO-2 manipulation foundation model provide the AI and data foundation for OmniHand-based systems.
          items:
            - Genie Studio (training, sim, deployment)
            - AgiBot World (1M+ trajectory dataset)
            - GO-2 manipulation foundation model
        - label: Middleware / Integration
          detail: ROS 2 driver (Humble/Jazzy compatible), AimRT open-source middleware (ROS 2, zenoh, gRPC), and URDF models for simulation (Genie Sim 3.0, Isaac Sim) bridge OmniHand hardware to robot stacks.
          items:
            - ROS 2 driver (Humble/Jazzy compatible)
            - AimRT open-source middleware (ROS 2, zenoh, gRPC)
            - URDF models for simulation (Genie Sim 3.0, Isaac Sim)
        - label: SDK / Control
          detail: OmniHand SDK (Python 3.10+ / C++; Ubuntu 22.04) provides five control modes and communicates over CANFD at 1 kHz, requiring a ZLG USBCANFD adapter.
          items:
            - "OmniHand SDK (Python 3.10+ / C++; Ubuntu 22.04)"
            - "Control modes: P-A, Torque, Hybrid PtA, Velocity, Tactile"
            - "CANFD bus at 1 kHz (ZLG USBCANFD adapter required)"
        - label: Sensing & Actuation
          detail: Tactile arrays (400+ pts on O10, 150+ multi-modal on O12, full 3D claimed for Ultra-T), motor-driven active DoF, and an integrated palm camera (Ultra-T only, unverified) form the sensing and actuation layer.
          items:
            - "Tactile array (O10: 400+ pts; O12: 150+ pts multi-modal; Ultra-T: full 3D claimed)"
            - "Active DoF actuation (O10: motor+gear; O12: motor+screw rod; Ultra-T: tendon)"
            - "Integrated palm camera (OmniHand 3 Ultra-T only, unverified)"
        - label: Mechanical Structure
          detail: Five-finger anthropomorphic layout with opposable thumb, PA nylon and silicone construction, and variant-specific wrist interfaces provide the physical foundation for manipulation.
          items:
            - "5-finger anthropomorphic layout (opposable thumb)"
            - PA nylon + silicone material construction
            - "Wrist interface (O10: 180 mm length; O12: 207 mm; Ultra-T: 55 deg pitch / 40 deg yaw)"
