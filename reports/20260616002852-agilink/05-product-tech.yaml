  - id: deployment-use-cases
    title: Deployment evidence and use-case validation
    body: >-
      Commercial deployment evidence for the OmniHand family is more developed than most early-stage
      hardware spinouts. The OmniHand 2025 (¥9,800 launch price) was described by Agibot as the first
      high-DoF hand below ¥10,000, and its inclusion in the AgiBot World training dataset — which
      covers five real-world domains across factory, logistics, home, hotel, and commercial scenarios —
      provides at least indirect evidence of repeated functional use in data-collection workflows.

      The OmniHand Pro 2025's strongest deployment evidence comes from the G2 industrial humanoid
      launch event, at which the G2 equipped with OmniHand Pro performed logistics parcel sorting
      (diverse sizes, shapes, and materials) and precision assembly tasks (RAM module insertion,
      seatbelt lock cylinder assembly). These are not controlled demonstrations in the classic sense:
      they involve unordered mixed-SKU parcels rather than pre-sorted identical objects. Agibot
      also reports combined cumulative deliveries exceeding 8,000 dexterous hands across both lines,
      and the company's 10,000-robot milestone in March 2026 spans its full product portfolio.
      No customer-named case studies, deployment scale specifics, or field failure data have been
      published, limiting the ability to assess repeat-purchase rates or real-world reliability.

      The XHAND1 from Robotera (12 DoF, $14,000) is a direct product-market competitor targeting
      similar humanoid integration. The LEAP Hand from Carnegie Mellon (16 DoF, $2,000, servo-driven,
      ~2 kg payload) represents the open-source, research-access tier — significantly less capable
      in payload and sensing, but at roughly half the OmniHand 2025's price and with an established
      academic citation base (LEAP Hand paper published at RSS 2023). Allegro Hand V4 (Wonik Robotics)
      is the established research standard with 16 DoF, rich ROS ecosystem, but priced at $15,000+
      and less mechanically capable than the OmniHand Pro. The Fourier GR-2 integrates 12-DoF hands
      (6 array-type tactile sensors per hand), while Shadow Dexterous Hand remains the laboratory
      gold standard at 24 DoF and ~$130,000+. Agilink's OmniHand Pro outperforms all named
      alternatives on load capacity (35 kg) at a mid-market price point, but no third-party
      comparison benchmark has been conducted.
