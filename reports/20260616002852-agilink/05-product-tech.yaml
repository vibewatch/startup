  - id: software-sdk-stack
    title: Software stack — SDK, CANFD, ROS 2, and AI platform
    body: >-
      Agibot (the parent company) open-sources the OmniHand 2025 SDK on GitHub under the
      Mulan PSL v2 license. The SDK provides Python 3.10+ bindings and C++ APIs for joint
      position, torque, velocity, and tactile control modes. The only officially supported operating
      system is Ubuntu 22.04 (x86_64), using CMake 3.24+ and gcc 11.4+. A pre-compiled Python
      wheel (omnihand_2025_py-0.8.0) simplifies installation. CANFD communication goes through
      ZLG USBCANFD series adapters (recommended: USBCANFD-100U-mini, USBCANFD-100U, or
      USBCANFD-200U). The Ubuntu-only, x86-only constraint limits deployment to workstation or
      server contexts; no ARM-SoC, embedded, or edge deployment path is documented.

      Both OmniHand 2025 and Pro 2025 SDKs include URDF models for integration into simulation
      environments (Genie Sim 3.0, NVIDIA Isaac Sim), and ROS 2 driver packages for integration
      with the broader robotics middleware ecosystem. The five control modes available via SDK —
      Position/Angle (P-A), Torque, Hybrid P+Torque (PtA), Velocity, and Tactile — provide the
      flexibility required for both teleoperation and autonomous closed-loop manipulation.

      At the platform layer, Agibot's Genie Studio provides a full-stack development environment
      covering data collection, foundation model training (supporting RDT, Pi0, OpenVLA, GR00T,
      and AgiBot's own Go-1 model), simulation, and one-click deployment. The Genie Studio handles
      cross-device data collection from multiple robot bodies and end effectors, with Agibot
      claiming 48 GPU-days as a fine-tuning horizon for new scenarios. AgiBot World, hosted on
      HuggingFace (agibot-world organization), is described as a dataset of 1M+ trajectories
      across 217 tasks in five real-world domains; the dataset employs hardware with visual-tactile
      sensors and 6-DoF dexterous hands consistent with the OmniHand family. SDK lifecycle,
      versioning cadence, and long-term maintenance commitments have not been publicly disclosed
      by Agilink or Agibot as of the run date.
