figures:
  - id: FI001
    title: Agilink Revenue Model Bridge
    type: flow
    layout: wide
    summary: >-
      Customer activity converts into hardware revenue through a tiered product funnel; software and data
      streams remain roadmap items only in mid-2026.
    data:
      nodes:
        - id: research-edu
          label: Research and education buyers
          detail: University labs and AI researchers buy O10 at 9,800 RMB; open SDK lowers integration barrier.
          tone: positive
        - id: embodied-ai
          label: Embodied-AI integrators
          detail: Companies building humanoid robots integrate hands as standard end-effectors.
          tone: positive
        - id: industrial
          label: Industrial and logistics operators
          detail: Warehouse, pharmacy, and factory deployments; ~1,000 units in 8-hour shifts by May 2026.
          tone: positive
        - id: agibot-internal
          label: Agibot internal supply channel
          detail: Related-party transfers to parent; transfer pricing vs. market ASP gap is unquantified.
          tone: warning
        - id: hardware-revenue
          label: Hardware revenue pool
          detail: Per-unit sales of hands (9,800 RMB floor) plus grippers; mix-dependent blended ASP.
          tone: positive
        - id: cogs
          label: Materials and manufacturing cost
          detail: Estimated BOM 40–70% of ASP; actuators are largest BOM line; self-developed motors reduce cost.
          tone: warning
        - id: gross-profit
          label: Gross profit (estimated, undisclosed)
          detail: No margin data public; estimated 30–55% consistent with hardware norms at this stage.
          tone: neutral
        - id: software-future
          label: Future software and dataset licensing
          detail: AI manipulation models and datasets flagged by Xiong Kun for 2026; not yet commercial.
          tone: neutral
      edges:
        - from: research-edu
          to: hardware-revenue
        - from: embodied-ai
          to: hardware-revenue
        - from: industrial
          to: hardware-revenue
        - from: agibot-internal
          to: hardware-revenue
        - from: hardware-revenue
          to: cogs
        - from: hardware-revenue
          to: gross-profit
        - from: gross-profit
          to: software-future
    approximationNotes: >-
      Gross profit node is estimated; all financial values except the O10 list price of 9,800 RMB are
      undisclosed and based on industry benchmarks.
    claimRefs:
      - CI013
      - CI022
      - CI025
      - CI026

  - id: FI002
    title: Agilink Unit Economics Bridge
    type: flow
    layout: standard
    summary: >-
      Evidence supports ASP at the top of the funnel and strategic cost advantages mid-funnel; unit
      economics break down below gross profit where no public data exists.
    data:
      nodes:
        - id: asp
          label: List ASP — O10 (9,800 RMB / ~$1,350)
          detail: Confirmed by robotscanada.com and Agibot distribution channels; first sub-10K RMB high-DoF hand.
          tone: positive
        - id: bom-actuators
          label: Actuator motors (~30–40% BOM)
          detail: Largest cost driver; Agilink self-develops key motors, reducing dependence on third parties.
          tone: neutral
        - id: bom-sensors
          label: Sensors and electronics (~20–30% BOM)
          detail: Tactile arrays, MCUs, edge processing; 400+ tactile points on O10.
          tone: neutral
        - id: bom-structure
          label: Structure and assembly (~25–35% BOM)
          detail: PA+silicone moulding, aluminum alloys, labor; scale drives down unit assembly cost.
          tone: neutral
        - id: gross-margin
          label: Estimated gross margin (30–55%)
          detail: No disclosure; consistent with Chinese hardware startup range; aggressive pricing may compress.
          tone: warning
        - id: opex-rd
          label: R&D and engineering expense (undisclosed)
          detail: AI model development, new product lines (OmniHand 3 series); capitalization policy unknown.
          tone: warning
        - id: operating-loss
          label: Operating result (estimated loss)
          detail: Scale-up phase; hardware startup at this stage typically runs an operating loss.
          tone: warning
      edges:
        - from: asp
          to: bom-actuators
        - from: asp
          to: bom-sensors
        - from: asp
          to: bom-structure
        - from: bom-actuators
          to: gross-margin
        - from: bom-sensors
          to: gross-margin
        - from: bom-structure
          to: gross-margin
        - from: gross-margin
          to: opex-rd
        - from: opex-rd
          to: operating-loss
    approximationNotes: >-
      All nodes below ASP are estimated. No audited financials exist. BOM percentages are industry-benchmark
      ranges for Chinese dexterous hand hardware at the 9,800 RMB price tier.
    claimRefs:
