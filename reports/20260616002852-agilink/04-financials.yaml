callouts:
  - calloutType: risk
    title: Undisclosed financials and NDRC bubble risk create compounding uncertainty
    body: >-
      Agilink has no publicly disclosed revenue, gross margin, burn rate, or cap table. The investor base
      is institutional but has not imposed public reporting obligations. Simultaneously, China's NDRC warned
      in 2025 that 150+ humanoid robot companies — many building similar products — risked "bubbles" and
      "repetitive-clone" market dynamics. A capital-efficiency correction in the Chinese robotics sector could
      impair Agilink's ability to raise a fifth round at its $1B+ valuation, especially if revenue traction
      from external customers (outside the Agibot ecosystem) does not materialize at scale.
    claimRefs:
      - CI024
      - CI030
      - CI031
      - CI035

  - calloutType: assumption
    title: Revenue proxy assumes no material transfer-pricing distortion
    body: >-
      The shipment-based revenue proxy (50–200M RMB cumulative) assumes that the 8,000+ delivered hands
      and 10,000+ grippers were sold at or near the confirmed list price of 9,800 RMB (O10). If a material
      fraction of shipments were internal Agibot transfers at cost or sub-market transfer prices, realized
      external revenue could be significantly below this range. The related-party revenue risk is the single
      largest uncertainty in the financial model and requires a related-party transaction disclosure to resolve.
    claimRefs:
      - CI022
      - CI023
      - CI036

