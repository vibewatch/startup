  - id: capital-adequacy-burn-dynamics
    title: Capital Adequacy and Burn Dynamics
    body: >-
      Agilink raised capital in rapid succession, completing four financing rounds in under five months. This cadence — unusual even by Chinese tech standards — reflects both the urgency of manufacturing scale-up economics and investor appetite to own the dexterous hand category before competitive barriers close. Hardware startup burn rates at this stage typically range from $500,000 to $3 million per month, driven by engineering salaries, manufacturing capex, component procurement, and R&D. Agilink's planned use of funds (per company-claimed sources) encompasses: reliable general-purpose dexterous actuation platform development, mass production and delivery capacity expansion, and full-stack AI model/data development. All three workstreams are capital-intensive.

      No cash balance, monthly burn rate, debt facility, or runway figure has been disclosed by Agilink. Given the estimated aggregate raised (likely >500 million RMB based on at least three "hundreds of millions" rounds), and assuming a hardware startup burn rate of 15–40 million RMB per month (scaled for manufacturing-intensive R&D), runway at time of the fourth round (May 2026) would be in the 12–36 month range. The lower bound would accelerate capital needs before end of 2027, and the upper bound assumes lean operations with high advance-payment collection. The next-round trigger is likely tied to production-line scale, new product launch milestones (OmniHand 3 volumes), and potential international market entry, rather than profitability. Debt or project finance facilities have not been disclosed.

      A key capital adequacy risk is the pace at which the revenue proxy translates to collected cash. If the Agibot ecosystem is both primary shareholder and dominant customer, trade receivables from the parent could build without accelerating external cash inflow. This related-party dynamic remains unquantified in public disclosures. The fact that Joyson Electronics, SAIC Financial Holdings, and Longcheer Technology are strategic investors — all of whom represent potential future customers — partially offsets concentration risk by enlarging the potential direct customer base, but no confirmed commercial agreements between Agilink and these investors have been publicly disclosed.
