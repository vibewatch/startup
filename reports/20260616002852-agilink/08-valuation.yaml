  - id: valuation-comps
    title: Comparable Valuation Set — Full-System, Component-Tier, and Chinese Market
    body: >-
      Constructing a relevant comparable set for Agilink requires separating three tiers:
      full-system Western humanoid robots, full-system Chinese humanoid robots, and Chinese
      component-tier suppliers. Each tier carries different revenue profiles, strategic
      rationales, and market discounts.

      The Western full-system cohort (Figure AI, Apptronik, Agility Robotics, 1X Technologies)
      exhibits wide valuation dispersion, from Agility's $1.75 billion to Figure AI's
      $39 billion. Figure AI's September 2025 Series C — led by Parkway Venture Capital at a
      post-money valuation the Sacra profile confirms exceeded $39 billion — is an outlier
      driven by a single-investor mark with limited secondary market participation and not a
      reliable sector anchor. Apptronik's $5 billion at February 2026 (official company press
      release; SEC Form D corroborates a related Series A Special Purpose Vehicle) is more
      broadly syndicated with strategic investors including Google DeepMind, Mercedes-Benz,
      John Deere, and the Qatar Investment Authority. Agility Robotics, at approximately
      $1.75 billion post-money after its Series C, provides the closest structural comparable
      to Agilink by total-raise size, though its deployment track record (GXO/Amazon Fulfillment)
      and full-system product scope make it only a partial analogue.

      In the Chinese market, Unitree is the only company with publicly filed revenue data:
      2025 revenue exceeding 1.7 billion RMB ($235 million) at 335% YoY growth and net profit
      over 600 million RMB ($83 million), supporting its planned $580 million SSE STAR Market
      IPO. Unitree's implied IPO-stage multiple (estimated 8–12x 2025 revenue based on IPO
      raise relative to STAR Market precedents) provides the most grounded floor for sector
      multiples. Agibot (Agilink's parent) carried a pre-money valuation exceeding CNY 7 billion
      (~$960 million) at its August 2025 LG/Mirae Asset round per Pandaily, with Tracxn citing
      a more recent $6.4 billion estimate. At component tier, Tianji's $1.5 billion Series B in
      May 2026 is the most relevant structural comp for Agilink's own financing round.
