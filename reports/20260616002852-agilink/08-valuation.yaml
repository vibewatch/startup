  - id: scenario-analysis
    title: Scenario Analysis — Bull, Base, and Bear Valuation Paths
    body: >-
      Three scenarios bracket the range of supportable equity values for Agilink by 2028,
      with the key variable being how quickly the licensing platform materialises and whether
      the humanoid robotics market sustains current investor sentiment.

      The bull case posits Agilink licensing to 10 or more external OEM customers, reaching
      annual deliveries of 100,000+ units by 2027, and converting its manipulation dataset into
      a recurring AI-model subscription offered to robot makers globally. Under these assumptions,
      revenue of $150–300 million per year at 35–45% gross margin supports a $3–8 billion
      valuation on 20–30x forward revenue multiples, consistent with Apptronik's premium and
      Goldman Sachs' platform-value framework for Chinese robotics leaders. The China policy
      tailwind — IFR confirms China's 15th Five-Year Plan centres robotics at national strategy,
      with 57% domestic supplier share as of 2024 — amplifies this case.

      The base case holds the current $1 billion mark roughly stable through 2026–2027 as the
      company executes on hardware scale, secures revenue from the Agibot supply channel and
      two to three external customers, but delays the licensing platform due to AI model maturity
      gaps. At 20,000–50,000 units per year, shipment-based revenue of $27–135 million USD
      (blended 9,800 RMB ASP, USD conversion) supports an $800 million to $1.5 billion
      valuation on conventional hardware multiples, assuming no major competitor disruption.
      This base case is consistent with Unitree's 2025 revenue trajectory as the sector floor.

      The bear case arises if the robotics valuation bubble deflates, Agibot decides to
      reintegrate the dexterous hand supply chain, or the sim-to-real accuracy gap — which
      IDC reports drops from 80–90% in simulation to below 50% in real deployments — stalls
      commercialisation. Component suppliers face the fastest multiple compression in a down
      cycle, as full-system OEMs internalize margin by bringing components in-house. In this
      scenario, the NDRC's warning against "highly repetitive products" and 150+ competitors
      eliminates the premium, compressing valuation to $100–400 million on distressed hardware
      multiples.
