chapter:
  number: 8
  title: Valuation
  summary: >-
    Agilink's reported >$1 billion unicorn valuation in May 2026 is real in investor-mark terms
    but entirely unsupported by disclosed revenue. A shipment-based proxy implies cumulative
    receipts of roughly $10–27 million USD, placing the implied multiple at 37–100x cumulative
    revenue — a figure that can only be justified by pricing in platform optionality, Agibot
    ecosystem leverage, and the component-tier strategic premium from the dexterous hand supply
    scarcity thesis. Comparable analysis anchors Agilink's $1B in the lower decile of a heavily
    inflated peer set led by Figure AI's $39B outlier. The base-case valuation is defensible
    only if licensing revenue materialises and revenue disclosure follows; without both, the
    current mark is speculative and the recommendation is research-more.

sections:
  - id: agilink-unicorn-context
    title: Agilink's $1 Billion Unicorn Mark — Context and Evidence Quality
    body: >-
      Agilink crossed the unicorn threshold in May 2026, reaching a reported valuation above
      $1 billion after completing its fourth financing round since incorporating on 2026-01-14.
      The only English-language primary source directly confirming the $1 billion figure is a
      Crunchbase News article dated June 1, 2026, which states: "Shanghai-based Agilink has
      raised four funding rounds since it was spun out of Agibot in January, and reached a
      valuation of $1 billion." The article does not specify round size, pre-money versus
      post-money convention, or investors for the fourth round. Multiple Chinese business media
      outlets (sector press, Pedaily equivalents) reported the same valuation step-up in the
      May 19–20, 2026 window, corroborating the Crunchbase account, but none published
      audited data.

      This evidentiary profile — investor-reported unicorn with no revenue disclosure — is
      structurally common across the 2025–2026 robotics funding wave, in which $14 billion
      globally and $5.6 billion in China alone were deployed with minimal fundamental
      underwriting of current-period economics. Agilink's four-round velocity (five months to
      unicorn) has no direct precedent in the dexterous-hand component subsector, though it
      compares favourably to Tianji's timeline in the robot-arm analogue. The investor base —
      Hillhouse Venture, BlueRun, Baidu Ventures, Yunfeng Capital, SAIC Financial Holdings,
      Joyson Electronics, and C Capital — is high quality by Chinese VC standards, consistent
      with a market-share-first race posture rather than a return-discipline posture. The
      absence of a publicly stated pre/post-money distinction means that any entry price
      analysis must treat the $1 billion as a directional mark subject to a ±20% ambiguity
      band depending on round size.
