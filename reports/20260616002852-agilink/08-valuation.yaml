callouts:
  - calloutType: risk
    title: Pre/Post-Money Ambiguity Is Material at $1 Billion
    body: >-
      The Crunchbase primary source for Agilink's $1 billion valuation does not specify
      pre-money or post-money convention. If the fourth round raised several hundred million
      yuan (consistent with prior rounds), a pre-money reading would imply a post-money mark
      of $1.2–1.5 billion, whereas a post-money reading of $1 billion would imply a smaller
      effective entry premium for the lead investor. This ambiguity affects the dilution
      calculation for any secondary investor and must be resolved in diligence.
    claimRefs:
      - CV004
      - CV005

  - calloutType: insight
    title: Titanji Comp Is More Relevant Than Figure AI
    body: >-
      The robotics media typically benchmarks Chinese dexterous hand companies against Figure AI
      ($39 billion) or Apptronik ($5 billion). For Agilink, the more structurally appropriate
      comparable is Tianji ($1.5 billion, May 2026 Series B), a Chinese component-tier robot-arm
      supplier that raised $147 million from Hillhouse and Meituan at a backlog of 10,000+ units
      from 45 OEM customers. Agilink's $1 billion valuation is a 33% discount to Tianji's comp
      despite being in a differentiated product niche, which is consistent with Agilink's earlier
      stage and shorter operating history.
    claimRefs:
      - CV033
      - CV040

  - calloutType: assumption
    title: Shipment Count Is Unaudited
    body: >-
      All production figures cited in this chapter — 8,000+ dexterous hands and 10,000+
      grippers from Agilink, and the Unitree/Agibot shipment counts used as sector anchors —
      are company-reported and not independently audited. The Unitree versus Agibot shipment
      dispute in March 2026 illustrates the risk of treating self-reported numbers as verified.
      All revenue proxy calculations, revenue multiples, and unit-economics inferences are
      therefore estimates with material uncertainty bands.
    claimRefs:
      - CV035
      - CV036

