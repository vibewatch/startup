companyProfile:
  summary: Agilink (临界点 AGILINK) is a Shanghai-based dexterous robotic hand company that was spun out of Agibot's manipulation business in January 2026. The company sells a tiered OmniHand portfolio spanning the OmniHand 2025, OmniHand Pro 2025, and OmniHand 3 flagship line, alongside complementary grippers aimed at embodied-AI OEMs, industrial automation users, logistics scenarios, and research buyers. Public reporting says Agilink completed four financing rounds in under five months, reached a valuation above US$1 billion by May 2026, and shipped more than 8,000 dexterous hands and 10,000 grippers. The upside case is unusual early scale in a strategically important component layer of the humanoid-robotics stack; the downside is that nearly all commercial, financial, and governance detail still depends on sparse, parent-mediated disclosure.
  foundedDate: '2026-01-14'
  founders:
  - name: Xiong Kun
    role: Founder and CEO
    background: Former Tencent Robotics X, IDEA Research Institute, and Inovance executive who joined Agibot in November 2024 to lead the dexterous-hand business before the spinout.
