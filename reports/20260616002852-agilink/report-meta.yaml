  productSummary: Tiered dexterous robotic hands and grippers, led by OmniHand 2025, OmniHand Pro 2025, and OmniHand 3 Ultra-T, with product positioning across research, industrial manipulation, logistics, service robotics, and embodied-AI OEM integration.
  customerFocus: Embodied-AI OEMs, industrial manufacturers, logistics operators, research labs, and service-robotics integrators; publicly named third-party proof is sparse outside parent-linked deployments.
  businessModel: Hardware-first sales of dexterous hands and grippers, with emerging optionality around manipulation datasets, SDK tooling, and model/software attach revenue.
  stage: Series A+ private
  fundingStatus: Four rounds were reported between January and May 2026, culminating in a May 2026 valuation above US$1 billion with backing from Hillhouse Venture, BlueRun, Baidu Ventures, Yunfeng Capital, SAIC Financial Holdings, Joyson Electronics, Longcheer, C Capital, and others.
