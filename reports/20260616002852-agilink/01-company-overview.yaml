company:
  name: Agilink
chapter:
  number: 1
  title: Company Overview
  summary: Agilink (临界点 AGILINK) is a Shanghai-based dexterous robotic hand company incorporated on 2026-01-14 after being spun out from Agibot's hand business. Public reporting across January-May 2026 says the company completed four financings in under five months, reached a valuation above $1 billion in May 2026, and shipped more than 8,000 dexterous hands plus 10,000 grippers. The public record supports strong early commercialization and investor demand, but revenue, governance, customer concentration, and precise cap-table details remain undisclosed.
sections:
- id: identity-business-model
  title: Identity, spinout context, and business model
  body: 'Agilink (临界点 AGILINK) is the independent dexterous-hand company spun out of Agibot''s manipulation business in January 2026. Corporate registry details cited by multiple Chinese outlets indicate that Shanghai Linjiedian Innovation Intelligent Technology Co., Ltd. was incorporated on 2026-01-14 in Shanghai, with Deng Taihua as legal representative and Agibot retaining an 80% shareholding at formation. Public positioning is consistent across media and official Agibot materials: Agilink focuses narrowly on dexterous end-effectors rather than full humanoid robots, selling five-finger hands, higher-end manipulation modules, and complementary grippers into embodied-AI, industrial automation, logistics, service-robotics, and research workflows. Founder and CEO Xiong Kun told multiple outlets that the reason for carving out the hand unit was to fund sustained R&D, open external sales beyond the Agibot ecosystem, and accelerate engineering-led scale production. That business model implies
    hardware revenue first, followed by software and data-tooling opportunities around dexterous manipulation models and datasets; however, no revenue split, pricing architecture, or recurring-services disclosure has been published.'
