- id: products-scale-milestones
  title: Product stack, shipment scale, and milestones
  body: 'Agilink''s commercialization case rests on two linked claims: it inherited a credible product base from Agibot''s hand unit, and it already scaled that base well beyond lab volume. Company and media materials say the team mass-produced multiple hand products during 2025, with quarterly sales in the thousands even before the spinout. Public product references identify OmniHand 2025 as a compact 16-DoF hand with 10 active and 6 passive degrees of freedom, sub-500 gram weight, CANFD connectivity, ROS 2 support, and 400-plus tactile sensing points; OmniHand Pro 2025 moves up to 19 total DoF, industrial manipulation positioning, and higher price. APC 2026 then introduced OmniHand 3 Ultra-T, which Agibot described as a 22+3 DoF tendon-driven flagship with 3D tactile sensing, palm camera, sub-0.3 second response, and 10:1 load-to-weight ratio. By May 2026, Pandaily, Gasgoo, Humanoids Daily, and other outlets reported cumulative deliveries above 8,000 dexterous hands and 10,000 grippers,
    with use cases spanning industrial automation, logistics, service robotics, and special operations. Even so, public disclosure still omits ASPs, gross margin, failure rates, warranty terms, and customer concentration, so the shipment headline should be viewed as scale evidence rather than proof of durable economics.'
