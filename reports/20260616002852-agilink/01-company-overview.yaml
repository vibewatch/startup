callouts:
- calloutType: strength
  title: Fastest signal is commercialization, not just prototype quality
  body: Agilink was able to pair a January 2026 legal spinout with immediate financing, inherited product lines, and public shipment claims in the thousands. That combination is rare for a dexterous-hand startup and supports the view that the company began life with real factory and ecosystem leverage rather than a blank-sheet lab asset.
  claimRefs:
  - CO019
  - CO024
  - CO029
  - CO030
- calloutType: risk
  title: Public disclosure is still shallow for a unicorn-label hardware company
  body: The company has not publicly disclosed revenue, pricing architecture at scale, cap-table economics, board composition, or customer concentration. That means the unicorn step-up reflects investor conviction and shipment momentum more than outside-verifiable unit economics.
