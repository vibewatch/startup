- id: leadership-governance
  title: Leadership, governance, and key-person dependence
  body: 'The public leadership picture is unusually concentrated for a newly independent robotics hardware company. The operating face of Agilink is Xiong Kun, who led the spinout from Agibot and is quoted in February 2026 media interviews explaining product tiers, commercialization priorities, and the rationale for independence. Those same interviews describe his prior roles at Tencent Robotics X, IDEA Research Institute, and Inovance, and note that he joined Agibot in November 2024 to run the dexterous-hand business before the separation. Legal control, however, still appears tied to the parent ecosystem: public registry summaries cited by Chinese media name Deng Taihua, Agibot''s chairman and CEO, as legal representative, while Agibot remained the dominant shareholder at incorporation. That combination suggests Agilink had operational autonomy for fundraising and product roadmap decisions but not a fully independent governance profile at launch. No reviewed source disclosed an independent
    board, outside directors, founder share split, liquidation preference terms, or succession structure. Given the technical complexity of dexterous hands and the centrality of Xiong Kun in external communications, key-person risk is material.'
