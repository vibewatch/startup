- id: chinese-commercial-competitors
  title: Chinese Commercial Dexterous Hand Competitors
  body: >-
    RobotEra (Beijing, founded August 2023) poses the most direct competitive challenge to Agilink in the Chinese commercial segment. Its XHAND1 offers 12 active DOF at a list price of $14,000, weighing 1.1 kg with dimensions of 191×94×47 mm, 25 kg grip force capability, integrated tactile and force sensing, and a gear-driven force-controlled joint architecture. Crucially, RobotEra publicly positioned XHAND1's full direct-drive architecture as the "first of its kind in the industry," and this claim was validated by hardware adoption from Boston Dynamics, NVIDIA, and Apple — three of the most technically demanding customers in robotics — before Agilink's spinout announcement. RobotEra's April 2026 raises totaling over $200 million (led by logistics giant SF Group, with IDG Capital, Hillhouse, Sequoia China, and CICC Capital) and simultaneous deployment of robots across more than 10 logistics centers in cooperation with China Post and SF Express underline both the financial strength and real-world traction of its ecosystem. RobotEra initiated thousand-unit deliveries in Q2 2026 and projects annualized growth of 300%.
    Inspire Robots (Beijing Yinshi Robot Technology Co., founded 2016) manufactures precision micro-servo actuators and dexterous hands primarily for the Chinese domestic industrial market. Its product portfolio includes the RH56 family (BFX, DFX, E2, F1) and EG2 series grippers. English-language product documentation was inaccessible via direct URL fetch as of June 2026, limiting independent international diligence; all specification and pricing information is available only in Chinese. Inspire Robots is a widely cited OEM component supplier for Chinese humanoid integrators, meaning it supplies hands that other companies brand — making it both a competitor and potential supplier in Agilink's adjacency.
    Fourier Intelligence (Shanghai, founded 2015) offers the GR-2 humanoid with 53 total degrees of freedom, including 12 DOF per hand and 6 array-type tactile sensors per hand. At an approximate price of $100,000-plus for the full GR-2 system, it is not a direct per-hand price competitor, but its SoftBank backing ($200M+ raised, $800M+ valuation, 800+ employees, 500+ units shipped in 2025) and its dual focus on healthcare rehabilitation and industrial manufacturing represent meaningful channel conflict for enterprise customer acquisition.
    Unitree Robotics (Hangzhou) introduced the R1 dual-arm humanoid in April 2026 at a starting price of $3,930 (¥26,900), making it the lowest-cost complete robotic manipulation platform on the market. The R1 supports swappable end effectors including two-, three-, and five-finger dexterous hands, and it supports 15 to 31 configurable DOF for the arm assembly. Unitree reported 335.4% revenue growth in 2025 with the humanoid business becoming its largest revenue segment, and the company has filed for an IPO on the Shanghai STAR Market for up to ¥4.2 billion.
