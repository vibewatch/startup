chapter:
  number: 3
  title: Competitors
  summary: Agilink's dexterous-hand market spans five distinct competitive categories — Western research incumbents (Shadow Robot, Allegro), open-source academic platforms (LEAP Hand), Chinese commercial peers (RobotEra XHAND1, Inspire Robots, Fourier FFTAI), platform-integrated OEM hands (Unitree R1), and adjacent logistics end-effector systems (RightHand Robotics, Dexterity AI). Agilink's OmniHand O10 undercuts the nearest commercial benchmark (Allegro V4) by ~85% on price while matching or exceeding DOF, and its Agibot parent ecosystem provides unique SDK depth, but RobotEra XHAND1's all-direct-drive validated by Boston Dynamics and NVIDIA — plus Unitree R1's sub-$4,000 combined system price — represent the sharpest threats to Agilink's price-performance narrative and channel reach.

sections:
- id: landscape-and-categorization
  title: Competitive Landscape and Categorization
  body: >-
    The competitive terrain for Agilink spans a wider set of alternatives than a purely dexterous-hand lens suggests. Buyers — humanoid OEM integrators, research labs, logistics operators, and enterprise automation teams — can solve the same manipulation job five different ways: (1) a premium Western research-grade hand (Shadow Robot Dexterous Hand, Allegro Hand V4) that prioritizes published specs and ecosystem citations; (2) an academic open-source platform (LEAP Hand, CMU 2023) that trades commercial polish for near-zero procurement cost; (3) a Chinese commercial standalone hand (RobotEra XHAND1, Inspire Robots RH56 series) that competes on direct-drive durability or price; (4) a humanoid OEM bundle in which the hand is inseparable from the platform (Fourier GR-2, Unitree R1 with swappable end effectors); or (5) a logistics end-effector system (RightHand RightPick 3, Dexterity AI Mech) that packages hardware and software for a single vertical task such as piece-picking, bypassing the general-purpose hand market entirely.
    Agilink sits at the intersection of categories (3) and (4): it spun out of Agibot's humanoid hardware but markets its hands as standalone products to third-party OEMs and researchers. This position is unique in the Chinese market today — Inspire Robots sells primarily into domestic industrial channels with limited international-facing documentation, while RobotEra's XHAND1 is deeply tied to the STAR1 humanoid ecosystem. However, this position also exposes Agilink to substitution from both sides: well-funded incumbents above (Shadow Robot brand equity with Western enterprise buyers) and ultra-low-price entrants below (LEAP Hand or Unitree R1 bundled system at a total price below Agilink's standalone hand list).
