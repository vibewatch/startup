  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: xhand1-vs-omnihand-benchmark
    missingEvidence: "No published head-to-head manipulation benchmark comparing OmniHand 3 Ultra-T tendon-driven performance against RobotEra XHAND1 direct-drive at equivalent task complexity, cycle counts, and failure modes."
    whyItMatters: "Without an independent benchmark, enterprise buyers cannot objectively evaluate Agilink's claim of superior dexterity against a competitor that has earned Boston Dynamics and NVIDIA hardware adoption validation."
    diligencePath: "Commission or identify an independent robotics benchmarking lab (e.g., CMU, MIT CSAIL, or an accredited industrial testing body) to run standardized manipulation tasks on both platforms and publish results."
    relatedQuestionRefs:
    - QP021

  - type: missing-source
    severity: material
    topic: dexterity-ai-100m-validation
    missingEvidence: "No independent third-party corroboration of Dexterity AI's claim of over 100 million autonomous decisions deployed in production; all evidence comes from company-authored blog posts."
    whyItMatters: "If the 100M actions claim is unverified, Dexterity AI's threat to the large-enterprise logistics segment may be overstated, potentially making it a less direct substitution risk for Agilink than assessed."
    diligencePath: "Request Dexterity AI's enterprise case studies with named customers and auditable throughput data; check analyst coverage from ABI Research or Interact Analysis for Dexterity AI deployment verification."
    relatedQuestionRefs:
    - QP012

  - type: missing-source
    severity: material
    topic: agilink-channel-concentration-risk
    missingEvidence: "No public disclosure of what share of Agilink's revenues or design-wins come from non-Agibot platforms; without this breakdown, channel concentration risk versus independently distributed competitors (Shadow Robot, RobotEra) cannot be assessed."
    whyItMatters: "If Agilink's customer base is 80%+ Agibot-internal, then Agibot corporate decisions (pricing, product roadmap, distribution) effectively control Agilink's revenue trajectory, undermining its 'independent' positioning."
    diligencePath: "Request from Agilink a breakdown of design-win pipeline by third-party OEM vs. Agibot platforms; interview 3-5 non-Agibot integrators about their evaluation of OmniHand versus XHAND1 or Allegro."
    relatedQuestionRefs:
    - QP016

  - type: private-evidence-only
    severity: material
    topic: sdk-lock-in-comparison
    missingEvidence: "No public developer community data (GitHub stars, API call volume, SDK adoption by non-Agibot integrators) to verify that Genie Studio creates meaningful switching costs for third-party OEMs versus open-source (LEAP Hand MIT, ROS2-native Allegro)."
    whyItMatters: "SDK lock-in is Agilink's stated secondary moat; if developers can replicate Genie Studio's core functions with open-source tools in 2-4 weeks, the moat is shallow and Agilink's retention advantage disappears."
    diligencePath: "Audit GitHub repositories citing Genie Studio or AimRT APIs; count integrator references at APC 2026 partner network; survey 5-10 third-party OEM teams on their SDK migration cost estimates."
    relatedQuestionRefs:
    - QP024

  - type: enumeration-incomplete
    severity: minor
    topic: emerging-chinese-hand-vendors
    missingEvidence: "The competitor landscape may omit emerging Chinese dexterous hand startups founded in 2024-2026 that have not yet published English-language product documentation or announced funding publicly."
    whyItMatters: "The Chinese embodied AI market saw multiple simultaneous spinouts in early 2026; a comprehensive enumeration requires Chinese-language search coverage beyond what is accessible through English-language sources."
    diligencePath: "Conduct Mandarin-language database searches (天眼查, 启信宝, 企查查) for companies incorporating with business scope covering 灵巧手 (dexterous hand) in 2024-2026; cross-reference with 36Kr and Pedaily coverage."
