- id: TP004
  title: Moat Durability and Competitive Risk Register
  columns:
  - Moat Claim
  - Competitive Threat
  - Severity
  - Mitigation / Diligence Ask
  rows:
  - - Price-performance leadership (OmniHand O10 at $3,775 vs. Allegro at $24,500)
    - Unitree R1 system at $3,930 undercuts standalone-hand value proposition for budget-conscious buyers
    - High
    - Verify whether Unitree R1 hand option is priced separately; track Unitree's SDK completeness for third-party OEM use
  - - SDK and data-platform lock-in (Genie Studio, AimRT)
    - Open-source alternatives (LEAP Hand + ROS2) and Agibot-agnostic competitors (XHAND1 with Boston Dynamics validation) reduce perceived switching cost
    - Medium
    - Audit Genie Studio third-party integrations; measure API migration friction for non-Agibot robot bodies
  - - Agibot parent scale (10,000+ units, APC 2026 partner network)
    - RobotEra has matched scale trajectory with $200M+ raised, 1,000-unit Q2 2026 deliveries, and SF Group logistics deployment
    - High
    - Compare unit delivery cadence quarterly; track whether Agilink's external (non-Agibot) customer base diversifies
  - - Technical differentiation (22+3 DOF OmniHand 3 Ultra-T, 3D tactile, palm camera)
    - RobotEra's direct-drive architecture validated by top-tier tech customers; no published head-to-head benchmark between OmniHand 3 and XHAND1
    - Medium
    - Commission independent manipulation benchmark study; publish XHAND1 vs. OmniHand head-to-head results
  - - Chinese cost structure and manufacturing scale
    - U.S. legislative proposals to ban Chinese robot procurement from government buyers (introduced March 2026) limit addressable market in highest-value Western procurement segments
    - Medium-High
    - Monitor U.S. NDAA and proposed Chinese robot procurement restrictions; assess whether Taiwanese or South Korean manufacturing partnerships could address compliance requirements
