callouts:
- calloutType: strength
  title: Sharpest Price-Performance Advantage in Commercial Dexterous Hands
  body: >-
    OmniHand O10 lists at $3,775 — 85% below Allegro Hand V4's $24,500 — while matching Allegro's 16 DOF and adding tactile sensing Allegro lacks entirely. No peer-reviewed comparison exists as of June 2026, but the pricing gap is large enough that academic and commercial buyers face a genuine cost-benefit calculus in which Agilink wins on pure economics unless Shadow or Allegro brand equity is a procurement gate.
  claimRefs:
  - CP033
  - CP034

- calloutType: risk
  title: RobotEra XHAND1 Direct-Drive Architecture Endorsed by Top-Tier Technical Customers
  body: >-
    RobotEra's all-direct-drive XHAND1 claims "first of its kind in the industry" and has been adopted as hardware by Boston Dynamics, NVIDIA, and Apple — three of the most technically demanding and credibility-conferring customers in the global robotics ecosystem. Agilink's tendon-driven OmniHand 3 Ultra-T has no comparable independent customer validation published as of June 2026. This asymmetry in third-party technical credibility is the most material near-term competitive risk to Agilink's enterprise positioning.
  claimRefs:
  - CP016
  - CP017
  - CP039

- calloutType: risk
  title: U.S. Procurement Legislation May Lock Agilink Out of Western Enterprise Budgets
  body: >-
    In March 2026, U.S. lawmakers introduced a bill to ban government procurement of Chinese-manufactured robots. While government contracts represent only a fraction of the addressable market, legislative language typically cascades to defense-prime and regulated-industry supply chains. For a company whose entire manufacturing and corporate base is in Shanghai, this represents a structural market-access constraint that competitors like Shadow Robot (UK) and RightHand Robotics (US) do not face.
  claimRefs:
  - CP040
  - CP041

- calloutType: insight
  title: Platform Bundling Is the Fastest Path to Commoditizing Standalone Hands
  body: >-
    The most dangerous competitive dynamic for Agilink is not a better standalone hand, but OEM bundling. As Unitree, Fourier, and RobotEra integrate proprietary hands into their humanoid platforms and price the full system at or below Agilink's standalone hand price, the total addressable market for independent dexterous-hand companies shrinks. Agilink must establish third-party OEM design-wins (non-Agibot platforms) and API-level lock-in to prevent becoming a captive supplier to a single platform ecosystem.
  claimRefs:
  - CP003
  - CP004
  - CP042

