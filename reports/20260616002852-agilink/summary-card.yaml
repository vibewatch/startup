  topStrengths:
    - >-
      Publicly reported shipment scale of 8,000+ dexterous hands and 10,000+ grippers by May 2026 is unusually high for
      a newly independent end-effector startup.
    - >-
      Agilink benefits from Agibot ecosystem leverage plus a top-tier Chinese investor set spanning Hillhouse, BlueRun,
      Baidu Ventures, Yunfeng, SAIC Financial Holdings, and industrial partners.
    - >-
      The OmniHand ladder covers low-cost to flagship tiers and combines hardware, SDK, tactile sensing, and future
      dataset/model optionality.
  topRisks:
    - >-
      No public revenue, margin, board, cap-table, or customer-concentration disclosure exists to support the unicorn
      valuation with fundamentals.
    - >-
      Customer proof is still heavily mediated through parent Agibot deployments, with limited standalone third-party
      proof of external OmniHand demand.
    - >-
      Export-control, procurement-ban, and sector-bubble risks could compress both market access and valuation faster
      than current investors expect.
  unresolvedGaps:
    - Verified revenue, gross margin, ASP, and repeat-order data by OmniHand and gripper product family.
    - >-
      Customer list, parent-versus-third-party mix, and concentration of shipment volume across Agibot internal programs
      versus external buyers.
    - >-
      Cap table, board composition, investor rights, and transfer-pricing or IP-sharing arrangements between Agilink and
      Agibot.
    - >-
      Independent reliability, durability, and safety validation for OmniHand 3 and production-scale deployments beyond
      Longcheer-linked evidence.
