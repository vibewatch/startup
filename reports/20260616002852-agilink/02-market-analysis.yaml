- id: buyer-segmentation
  title: Buyer, User, and Payer Segmentation
  body: 'Agilink operates in a two-tier buyer structure. In the primary go-to-market channel, humanoid robot integrators (Agibot, Unitree, UBTECH, Fourier, and potential future customers such as Figure AI or Apptronik) are the direct buyers of Agilink''s OmniHand units; they embed the hand into their platforms and carry procurement risk. In the secondary channel, Agilink''s licensing model enables revenue from integrators who build their own hardware around Agilink''s software stack and control interface—a distinct B2B revenue stream that reduces unit-hardware dependency.


    End-user segments most actively deploying humanoid robots with manipulation requirements include: (1) Automotive OEM manufacturing: UBTECH Walker S2 units confirmed delivered to BYD, Geely, FAW-Volkswagen, Dongfeng Liuzhou Motor, and Foxconn. Budget owners are plant engineering or manufacturing operations leads, with typical evaluation cycles of 6–18 months and ROI anchored on labor cost reduction. (2) 3C electronics manufacturing: Agibot''s G2 deployed at Longcheer Technology''s tablet production facility with a reported 310 units/hour throughput and 99.9%+ success rate; this segment values precision, speed, and rapid product changeover. (3) Logistics and warehouse: container handling, palletizing, and item-sorting tasks where customers require robots to achieve approximately 50% of human worker capacity for a 2-year payback period at current labor rates in China. (4) Service: hospitality, retail guidance, and food service—lower dexterity requirements but high-volume, visibility-driving
    deployments.


    A Morgan Stanley AlphaWise survey of Chinese C-suite executives (2026) found that 62% are likely to adopt humanoid robots within three years—but only 23% expressed satisfaction with current products, citing dexterity, functionality, and price gaps. The critical price ceiling is 200,000 yuan (~$28K USD), below which 92% of respondents see widespread adoption as feasible. This creates a clear unit-economics forcing function for manufacturers: reaching the $28K price point requires both hardware cost reductions and software-efficiency gains to make the economics viable at scale.


    Budget ownership follows a consistent pattern: capital expenditure for humanoid units is controlled by manufacturing engineering or automation operations teams, while the ROI mandate comes from CFO or plant operations leadership. Pilot programs are typically sponsored by innovation or digital transformation budgets before graduating to capex lines, creating a 12–24 month pilot-to-production gap that constrains near-term revenue recognition. Agilink''s Crunchbase-confirmed $1B valuation and four funding rounds since its January 2026 spin-out position it to fund this runway, but pilot conversion remains the key revenue risk.

    '
