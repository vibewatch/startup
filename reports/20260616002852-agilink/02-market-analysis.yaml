    whyItMatters: 'If committee participation creates de facto standards that advantage Agilink hands over competing designs, it could be a durable competitive moat; if not, it is a governance optics benefit only.

      '
    diligencePath: 'Review published MIIT draft standards documents; analyze the "limbs and components" pillar for interface specifications; consult Chinese IP and antitrust counsel on standards capture risk.

      '
