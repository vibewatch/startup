callouts:
- calloutType: risk
  title: No Standalone Dexterous Hand Market Sizing Available
  body: 'No independent analyst report as of June 2026 publishes a standalone market size for the dexterous robotic hand or intelligent end-effector sub-segment. All sizing in this chapter proxies from the broader humanoid robot hardware market with an assumed 10–15% end-effector cost share—an estimate that is not independently validated. Investors and acquirers should treat the SAM figures as planning scaffolding only, not verified market data.

    '
  claimRefs:
  - CM038
- calloutType: insight
  title: 'Goldman Sachs 2026 Pivot: From Universal to Dedicated Applications'
  body: 'Goldman Sachs'' January 2026 China industry survey revealed that the humanoid robot sector has fundamentally pivoted its commercial focus from "universal imagination"—robots that can do anything— to "dedicated landing" in narrow use cases such as security patrols, hotel guidance, and simple logistics sorting. This shift directly benefits Agilink, whose specialized dexterous hand is a high-value component precisely in the remaining complex-task applications that require fine manipulation—while the easier use cases that dominate near-term deployment do NOT require advanced dexterous hands. This creates both an opportunity (Agilink is positioned in the premium, hard-to-solve segment) and a risk (near-term volume may be smaller than the overall humanoid shipment figures suggest).

    '
  claimRefs:
  - CM035
- calloutType: assumption
  title: 'Key Assumption: End-Effector Represents 10–15% of Humanoid Platform Cost'
  body: 'The SAM estimate for Agilink''s dexterous hand segment is derived using a 10–15% end-effector cost share of full humanoid platform value. This assumption is not independently validated by any analyst report. The actual share may be higher (Agilink''s premium multi-DOF hand) or lower (integrated-hand platforms where the hand cost is amortized across the body). Diligence should seek Agilink''s disclosed BOM breakdown or comparable component-cost filings from Chinese suppliers.

    '
  claimRefs:
  - CM003
