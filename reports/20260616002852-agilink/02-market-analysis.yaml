    missingEvidence: 'A standalone market research report covering the dexterous robotic hand or intelligent end-effector market as a discrete category, with separate sizing from the broader humanoid robot market, published by any tier-1 analyst (IDC, IHS Markit, Goldman Sachs, MnM).

      '
    whyItMatters: 'Without a standalone sizing, Agilink''s SAM cannot be independently validated; all current estimates are proxy-based with unvalidated assumptions (10–15% end-effector cost share), which materially affects market attractiveness and competitive positioning analysis.

      '
    diligencePath: 'Commission a custom market sizing study; review Agilink''s investor deck for any internal SAM estimate; cross-reference component-cost data from Unitree or Agibot public IPO filings if they disclose BOM breakdowns.

      '
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: material
    topic: market sizing gap
    missingEvidence: 'Agilink''s internal BOM breakdown disclosing the dexterous hand unit''s cost as a percentage of total platform cost, enabling validation of the assumed 10–15% end-effector cost share.

      '
    whyItMatters: 'The SAM proxy calculation is anchored on this assumption; if the actual share is 5% or 30%, the SAM estimate changes by 2–3x, which affects competitive intensity and revenue potential.

      '
    diligencePath: 'Request BOM disclosure in due diligence; compare against Agilink OmniHand pricing vs. full humanoid ASPs of comparable platforms; consult Agibot''s investor documentation.

      '
    relatedQuestionRefs:
    - QM021
  - type: private-evidence-only
    severity: material
    topic: data quality
    missingEvidence: 'Third-party audited shipment verification for Chinese humanoid robot makers, including Agibot and by extension Agilink, to validate claimed production volumes and end-effector attach rates.

      '
    whyItMatters: 'The "numbers war" between Unitree and Agibot demonstrates that no standardized, audited count exists; if Agilink''s hand unit volumes are equally unverifiable, the market size evidence base is weaker than it appears.

      '
    diligencePath: 'Request production records and customer purchase orders in due diligence; cross-reference with Chinese customs export data; engage an industrial supply chain audit firm.

      '
    relatedQuestionRefs:
