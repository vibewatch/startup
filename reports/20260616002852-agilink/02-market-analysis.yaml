- id: growth-drivers
  title: Growth Drivers and Policy Tailwinds
  body: 'Five structural drivers underpin the near-to-medium term growth opportunity for Agilink''s market.


    First, China''s 15th Five-Year Plan (2026–2030) explicitly positions robotics at the core of its modern industrial system, allocating robotics to the highest tier of national strategic priority. The IFR confirmed in May 2026 that subordinate sectoral and regional plans are mandated to align with this framework, implying sustained government procurement and subsidy support through 2030. China already operates the world''s largest installed base of industrial robots—approximately 2 million units, 4.5 times Japan—and accounted for 54% of annual global industrial robot installations.


    Second, China''s domestic supplier share in industrial robots rose from 30% in 2020 to 57% in 2024, validating a structural import-substitution trend that the government is actively extending to humanoid robots. This creates a protected domestic demand pool where Chinese end-effector suppliers like Agilink have preferential access.


    Third, the dexterous-manipulation bottleneck is arguably the single largest technical constraint on humanoid robot commercial deployment. Agibot''s co-founder Peng Zhihui—also a deputy director of China''s MIIT Standardization Technical Committee for Humanoid Robots—stated that "nearly 80% of high-value tasks where humans excel but traditional automation struggles" depend on tactile sensing that is not yet standardized. Agilink''s specialized focus on this bottleneck positions it as a critical-path supplier in the humanoid ecosystem.


    Fourth, China''s MIIT published its first national standard system for humanoid robots and embodied intelligence in February 2026, covering six pillars including "limbs and components" and "safety and ethics." Standardization reduces coordination costs, promotes modularization, and creates a stable interface definition that favors purpose-built component suppliers over integrated full-stack manufacturers.


    Fifth, the VC funding wave is unprecedented in scale: global robotics startups raised a record $14B in 2025, up from $8.2B in 2024, with China-based companies raising $5.6B through mid-May 2026 alone. This capital is flowing to ecosystem companies—including integrators who become Agilink''s direct customers. Unitree''s $580M IPO (SSE, March 2026) and its 335% YoY revenue growth to $235M validate that the Chinese humanoid segment has reached commercial scale. Factory cobots reached batch-sale viability 7–10 years after first commercial versions; humanoid robot ecosystems are on a faster iteration cycle (6–8 months per generation vs. years for early cobots), suggesting a compressed adoption curve.

    '
