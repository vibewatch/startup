- id: market-sizing
  title: Market Sizing — TAM, SAM, and Multiple Analyst Lenses
  body: 'No publicly accessible standalone research report covers the dexterous robotic hand or end-effector sub-market as a discrete category. All sizing in this chapter uses the broader humanoid robot hardware market as a proxy, with Agilink''s serviceable portion estimated as a function of China''s share and an assumed end-effector cost percentage.


    Goldman Sachs Research (2024) provides the most widely cited institutional estimate: a base-case humanoid hardware TAM of at least $6 billion over 10–15 years (by ~2035E), a mid-scenario of $38 billion by 2035, and a blue-sky scenario of up to $154 billion—conditional on fully overcoming hurdles in product design, affordability, technology maturity, and public acceptance. The GS note calibrates economic viability for factory settings at 2025–2028 and consumer settings at 2030–2035, requiring roughly 15–20% annual production-cost reductions. ARK Invest separately estimates $24T in economic value from humanoid labor displacement—a measure of GDP impact, not hardware revenue, which must not be conflated with the GS figure.


    MarketsandMarkets (April/June 2026) sizes the global humanoid robot market at $2.92B in 2025, growing to $15.26B by 2030 at a 39.2% CAGR. The China sub-market is projected at $0.40B (2025) → $2.80B (2030) at a 47.6% CAGR, making China the fastest-growing national segment. Grand View Research provides an alternative estimate at a paywalled URL; the top-line figure is consistent in order of magnitude but varies in exact scope.


    IDC (May 2026) frames the opportunity in unit shipments: 18,000 humanoid robots shipped globally in 2025, growing to 510,000+ units by 2030 at a ~95% CAGR. At a $28K unit threshold (the Morgan Stanley buyer price ceiling), this implies a floor-revenue of approximately $14B by 2030—broadly consistent with the MarketsandMarkets estimate. At current average selling prices of ~$100K per unit, the implied revenue would exceed $51B by 2030, exceeding Goldman Sachs'' mid-scenario. IDC explicitly notes that Chinese vendors account for approximately 95% of 2025 shipments.


    For a constrained SAM estimate for Agilink: applying the China sub-market share ($0.40B in 2025 → $2.80B in 2030) and an assumed 10–15% end-effector share of total platform value yields an indicative SAM of ~$40M–$60M (2025) growing to ~$280M–$420M (2030)—subject to significant uncertainty given the lack of standalone market data. This estimate is not corroborated by any independent analyst report and should be treated as a planning proxy only.

    '
