    - name: Vianney Vaute
      role: 联合创始人
      background: 早期初创团队核心成员
      claimRefs:
        - CO001
  foundingLocation: Paris, France
  headquarters: Paris, France
  productSummary: 翻新电子产品交易平台，配备质保、售后支持与商家信任风控机制
  customerFocus: 寻求翻新设备的个人消费者与小型企业采购方
  businessModel: 交易平台佣金结合增值服务费与保障服务费
  stage: late-stage private
  fundingStatus: 历经多轮融资累计募集超 $1 billion，最新获广泛引用的估值为 $5.7 billion
