companyProfile:
  summary: Back Market 是一家由创始人掌舵的后期翻新电子产品交易平台，依托交易佣金、增值服务与信任基础设施实现商业变现。公开证据仍支撑其品类领先地位，但鉴于当前信息披露程度参差不齐，对其业务规模、利润率与估值水平宜保持审慎审视。
  foundedDate: '2014-01-01'
  founders:
    - name: Thibaud Hug de Larauze
      role: 联合创始人兼 CEO
      background: 自创立起掌舵公司的产品与交易平台运营专家
      claimRefs:
        - CO001
    - name: Quentin Le Brouster
      role: 联合创始人
      background: 早期初创团队核心成员
      claimRefs:
