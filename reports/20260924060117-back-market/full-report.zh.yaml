        title: 风险概览
        blocks:
          - type: paragraph
            body: >-
              全面梳理法律、监管、运营、技术、财务、合作伙伴、客户及执行风险，明确应对措施与否决标准（kill
              criteria）。按严重度对风险进行排序，涵盖发生概率、影响程度、缓解措施成熟度、残留风险敞口以及投资含义。最强公开信号显示，《how back market scales mobile faster, and
              drives ...》与《back market plugs into google cloud》两份材料共同构成本章风险叙事的支撑依据。《how back market scales mobile
