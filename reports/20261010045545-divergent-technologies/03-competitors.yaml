callouts:
  - calloutType: "strength"
    title: "Integrated Platform Architecture Overcomes Equipment Sales Bottlenecks"
    body: "Unlike traditional 3D printer OEMs that sell standalone machines and leave complex qualification, software tuning, and assembly to the customer, Divergent's factory-as-a-service model delivers completed, certified sub-assemblies. By integrating custom in-house Monolith One printers, proprietary alloys, and automated robotic assembly into DAPS, Divergent eliminates capex friction for defense primes."
    claimRefs:
      - "CP003"
      - "CP004"
      - "CP009"
      - "CP010"
  - calloutType: "risk"
    title: "Entrenched Defense Prime Qualification Creates Multi-Year Friction"
    body: "Although Divergent has demonstrated dramatic 80% part-count reductions with Raytheon and expanded relationships with Lockheed Martin and General Atomics, aerospace-grade certification for mission-critical flight hardware remains a protracted process. Competing against decades-old flight-proven casting supply chains requires extensive empirical testing and rigorous qualification."
    claimRefs:
      - "CP008"
      - "CP010"
      - "CP011"
