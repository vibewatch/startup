    title: "National Security Ownership Scrutiny and CFIUS Precedent"
    body: "Divergent's strategic buyout of Chinese shareholders—including Apollo Future Mobility, Horizons Ventures, and Shanghai Alliance Investment—was an essential prerequisite for securing U.S. defense prime subcontracts. While eliminating Chinese equity holders mitigates direct CFIUS intervention, lingering supply chain scrutiny and past board ties necessitate ongoing diligence into historical intellectual property provenance."
    claimRefs:
      - "CR001"
      - "CR002"
  - calloutType: "insight"
    title: "Subcontractor Wedge Versus Prime Disruption Dynamics"
    body: "By explicitly positioning the Divergent Adaptive Production System as common manufacturing infrastructure rather than developing proprietary weapon systems, Divergent avoids direct competition with defense primes like RTX and Lockheed Martin. However, this creates extreme customer concentration and exposes Divergent's margin profile to the primes' procurement cycles and congressional appropriation timing."
    claimRefs:
      - "CR004"
      - "CR010"
      - "CR013"

