callouts:
  - calloutType: "strength"
    title: "Integrated platform plus disclosed production ambition"
    body: "DAPS combines design, additive production, and automated assembly, while the announced Long Beach buildout would materially expand physical capacity. The strategic strength is integration; the diligence requirement is proving utilization, qualified yield, and repeat-program economics."
    claimRefs:
      - "CO003"
      - "CO012"
      - "CO013"
  - calloutType: "risk"
    title: "Governance and operating-system visibility lag the capital plan"
    body: "Leadership listings conflict across sources, the board and control structure are not public in the assigned pool, and a current job posting describes core planning and data-governance processes that are still being built. These are execution and key-person diligence issues, not evidence of failure."
    claimRefs:
      - "CO014"
      - "CO015"
      - "CO016"
