company:
  name: "Divergent Technologies"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Divergent is a 2014-founded, Torrance-based advanced-manufacturing company whose DAPS platform combines software-led design, metal additive manufacturing, and automated assembly. The September 2025 Series E supplied $250 million of equity and $40 million of debt at a reported $2.3 billion valuation, while a major 2026 factory expansion demonstrates ambition to move from program wins into scaled production; private-company financials, current headcount, exact customer count, board composition, and ownership remain material diligence gaps."
sections:
  - id: "identity-and-operating-model"
    title: "Identity and operating model"
    body: |-
      Divergent Technologies was founded in 2014 and is headquartered in Torrance, California. Its core product is not a stand-alone printer or design tool: the Divergent Adaptive Production System (DAPS) combines software-led design, metal additive manufacturing, and automated assembly into an end-to-end production workflow. That integration positions the company as both a manufacturing-technology platform and an operating supplier of finished structures for automotive, aerospace, and defense programs. The available evidence supports a late-stage private-company profile, but it does not establish a recurring software revenue model or a clean split between platform economics, engineering work, and manufactured-product revenue. Investors should therefore treat descriptions of DAPS as evidence of the production model, not as evidence that the company has software-like margins or recurring revenue.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "capitalization-and-scale"
    title: "Capitalization and scale"
    body: |-
      Divergent's latest disclosed financing was a September 2025 Series E totaling $290 million at a reported $2.3 billion valuation. The financing comprised $250 million of equity and $40 million of debt and was led by Rochefort Asset Management, so the headline round size should not be treated as either pure equity raised or cash still available. A June 2026 company release said cumulative capital raised exceeded $1 billion; EquityZen displayed $1.1 billion, a compatible but not independently audited tracker figure. The company also reported more than fivefold revenue growth in 2025 and more than 600 unique parts across industries, but no reliable absolute revenue, gross margin, cash-burn, runway, or customer-concentration figure appears in the assigned evidence. These omissions materially limit assessment of valuation support and financing durability.
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO003"
  - id: "leadership-governance-and-execution"
    title: "Leadership, governance, and execution"
    body: |-
      Current company and secondary reporting identify Lukas Czinger as co-founder, president, and chief executive officer and Kevin Czinger as founder and executive chairman. EquityZen instead lists Kevin Czinger as chief executive officer and Ursula Ster as chief financial officer, creating a role-vintage conflict that should be resolved against a current company organization chart and board record. Public evidence in the assigned pool does not identify the full board, voting control, committee structure, succession provisions, or key-person protections. A 2026 business-operations posting also says Divergent is building and improving SIOP, data governance, budgeting, and capital-approval processes in a fast-changing environment with imperfect data. That is a reasonable scaling signal, but also an execution risk as factory capacity and defense-program commitments expand.
    claimRefs:
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO002"
  - id: "milestones-and-forward-capacity"
    title: "Milestones and forward capacity"
    body: |-
      The chronology shows a company that moved from a 2014 automotive-oriented launch into aerospace and defense work in 2022, then raised successive strategic and institutional capital before announcing a much larger production footprint. Divergent said its June 2026 Long Beach facility would add 430,000 square feet, house 64 additional Monolith One printers over 24 months, and expand total factory presence beyond 550,000 square feet. Those are forward deployment plans and company claims, not proof of installed output, utilization, qualified yield, or contracted demand. The investment case therefore depends on conversion of named programs and design wins into repeat production while new equipment, quality systems, workforce, and planning processes ramp together. The timeline preserves the disclosed sequence without implying that every capacity target has already been achieved.
    claimRefs:
      - "CO001"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO010"
      - "CO011"
      - "CO013"
      - "CO016"
    figureRefs:
      - "FO001"
