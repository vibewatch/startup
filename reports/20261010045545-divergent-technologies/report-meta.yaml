companyProfile:
  summary: >-
    Divergent Technologies is a 2014-founded, Torrance-based advanced manufacturing company that combines software-led
    generative design, metal additive manufacturing, and automated assembly through its Divergent Adaptive Production
    System (DAPS). The company has shifted from luxury automotive programs toward aerospace and defense, where it now
    reports contracts with dozens of customers including General Atomics, Lockheed Martin, Raytheon, and Triumph Group.
    Its recent expansion plans and capital raises show real commercial traction, but the business remains private,
    capital-intensive, and only partially transparent on revenue quality, margin structure, and customer concentration.
  foundedDate: '2014-01-01'
