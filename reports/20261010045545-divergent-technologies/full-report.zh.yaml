  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与建议综合
        blocks:
          - type: paragraph
            body: >-
              Divergent Technologies 以其专有的 Divergent Adaptive Production
              System（DAPS）为核心，讲述了一套颇具说服力的工业转型故事：将人工智能生成式设计、工业金属 3D
              打印与无需夹具的机器人装配结合起来。核心投资逻辑在于，公司正从定制豪华超跑转向高优先级的美国国防与航空航天生产项目。与 General Atomics、Lockheed Martin、Raytheon
              等主要国防主承包商的合作，已经验证了制造周期的大幅缩短；现代化机体组件的零件数量减少了 80%。此外，Rochefort Asset Management 在美国国防部 Small Business
              Investment Company Critical Technology（SBICCT）计划下提供官方支持，也凸显了 Divergent 与美国将主权制造能力本土化、现代化这一国家目标的一致性。


              但反向投资逻辑集中在极高估值倍数、资本密集度，以及缺乏经审计的盈利数据。Divergent 于 2025 年 9 月完成 Series E 融资，投后估值为 $2.3 billion；随后，2026 年 7
              月二级市场报价对应的隐含估值达到 $3.37 billion。相比之下，专业制造业分析师质疑：Divergent 的预计收入基数在近期扩张前低于 $10
              million，是否足以支撑数十亿美元的企业价值。Forge Global、EquityZen
              等平台的二级市场流动性受限，资本因此被锁定。在技术能力亮眼、但私人市场定价已处高位且毛利率未披露之间权衡后，我们给出继续观察建议：估值判断为昂贵，信心中等，风险评级高。
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
