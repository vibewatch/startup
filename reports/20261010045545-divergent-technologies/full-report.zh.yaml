    rows:
      - - 防务工业转型
        - DAPS 解决国防部供应链的关键瓶颈，并赢得 Raytheon、Lockheed Martin 和 General Atomics 的合同
        - 防务采购推进缓慢、批次不均，且在进入大批量连续生产前往往要经历漫长的资格认证周期
        - 主承包商生产项目被取消或延迟多年
      - - 数字制造护城河
        - 软件定义的生成式设计和无夹具机器人装配省掉了工装资本开支，并将零件数量削减 80%
        - 怀疑者指出，金属 3D 打印和机器人装配都是标准技术，尚未证明具备结构性 IP 保护
        - 第三方验证显示，竞争对手的增材制造平台无需 DAPS 也能实现同等的零件整合
      - - 收入与扩张速度
        - 管理层报告 2025 年收入同比增长 5 倍，并新增 200+ 个航空航天零件号
        - 收入绝对基数仍未披露，估计低于 $10M，对应极高市销率
        - 截至 FY2026，披露的经审计年度收入未能超过 $25M
      - - 资本化与融资
        - 在 Rochefort 和 SBICCT 的强力国家安全支持下，累计融资 $939M 至 $1.46B
        - Series E 债务规模可观（$40M，早期另有 $47M），加上高额工厂资本开支，导致持续现金消耗高企
        - 在低于 $1.5B 估值下进行紧急下轮融资或结构化资本重组的必要性
    notes: 对技术可防御性、采购周期和资本要求这几组分歧核心论点的评估。
