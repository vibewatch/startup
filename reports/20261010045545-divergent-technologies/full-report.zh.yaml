  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将 Divergent 的技术验证和市场顺风与估值倍数、现金消耗强度串联起来，推导出跟踪建议。
    approximationNotes: 反映截至 2026 年 10 月投资委员会多维度准入门槛的定性推进。
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV008
      - CV010
      - CV014
    data:
      nodes:
        - id: tech-proof
          label: 1. 规模与生产证明：已生产 600+ 个零件，Raytheon 零件数量减少 80%
        - id: defense-tailwind
          label: 2. 市场机会：国家安全支持，以及声称 2025 年收入增长 5 倍
        - id: capital-intensity
          label: 3. 财务摩擦：融资 $1B+、工厂资本开支和持续债务义务
        - id: valuation-multiple
          label: 4. 定价纪律：$2.3B-$3.37B 估值较公开可比公司溢价显著（3.7x-6.1x）
        - id: preference-overhang
          label: 5. 下行保护：多层清算优先权和有限的二级市场流动性
        - id: track-decision
          label: 6. 投资立场：跟踪——等待经审计的毛利率验证和有折价的入场价格
      edges:
        - from: tech-proof
          to: defense-tailwind
          label: 推动
        - from: defense-tailwind
          to: capital-intensity
          label: 要求
        - from: capital-intensity
          to: valuation-multiple
          label: 抬高
        - from: valuation-multiple
          to: preference-overhang
          label: 叠加
        - from: preference-overhang
          to: track-decision
          label: 决定
