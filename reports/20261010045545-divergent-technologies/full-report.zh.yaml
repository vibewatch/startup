              [CM004]。该设施将容纳 64 台自有 Monolith One 多激光打印机，设计年产超过 30,000 架导弹机身或 60,000 个弹头外壳，对应每年 $350 million 至 $500
              million 的部件出货产能上限 [CM004, CM005]。Divergent 报告称，2025 年收入运行率为 $72.3 million，此前收入同比增长 5x，说明其已切入初期国防和汽车订单
              [CM008]。但要达到完整的可服务可获取规模，仍取决于国防主承包商多年期采购合同能否把原型资格认证订单转化为高频重复采购订单 [CM003]。
