    title: 产品架构图
    type: stack
    summary: 展示 Divergent 自适应生产系统（DAPS）从生成式数字工程到经过认证的结构装配的分层架构。
    data:
      layers:
        - label: 第 1 层：生成式设计与算法优化
          detail: AI 驱动的拓扑优化软件，将边界约束、热剖面和机械载荷转化为有机晶格及实体几何结构。
        - label: 第 2 层：数字制造执行与仿真
          detail: 基于 TypeScript、Node.js 和 Manufacturo MES 搭建的全栈数字控制平面，将 CAD 刀路与实时流程监控整合起来。
        - label: 第 3 层：激光粉末床熔融（LPBF）增材打印
          detail: 工业金属 3D 打印使用高功率多激光阵列，逐层熔合专有航空级合金粉末。
        - label: 第 4 层：热处理与自动除粉
          detail: 通过受控热应力消除循环、自动排粉和表面处理，为打印节点装配做准备。
        - label: 第 5 层：无夹具机器人装配与胶接
          detail: 多轴工业机器人协同作业，自动完成零件对齐、精密结构胶施加和连接。
        - label: 第 6 层：集成计量与质量认证
          detail: 将计算机视觉和激光计量扫描结合出口管制下的可追溯记录，用于防务飞行资格认证。
    approximationNotes: 基于公开专利文件和防务合作公告对 DAPS 生产阶段的概念性呈现。
    claimRefs:
      - CE001
      - CE002
      - CE007
      - CE009
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从最初导入 CAD 参数到全规模自动化生产的端到端客户推进过程。
    data:
      nodes:
        - label: 初次接洽
          actor: Defense & Automotive OEMs
          touchpoints:
            - Requirements definition with weight and envelope parameters
            - Exploratory technical evaluation of legacy component geometry
          outcome: Qualification of DAPS feasibility without customer blueprint disclosure
        - label: 生成式工程
          actor: Divergent Design Systems
          touchpoints:
            - AI-driven structural optimization and lattice generation
            - Automated structural simulation and finite element analysis
          outcome: Optimized digital part design achieving up to 80% part consolidation
        - label: 快速原型
          actor: Skunk Works & Defense Primes
          touchpoints:
            - Direct 3D printing of functional test hardware
            - Rapid design iteration cycles completed within days
          outcome: Flight-ready prototype demonstration such as Replicator in under 12 months
        - label: 测试与验证
          actor: Prime Program Integrators
          touchpoints:
            - Structural load, environmental, and flight qualification testing
            - Supplier quality audit and DoD compliance review
          outcome: Verification of mechanical performance against traditional forgings
        - label: 批量生产签约
          actor: Procurement & Defense Department
          touchpoints:
            - Framework agreement or second-source production contract
            - Integration into prime supply chain for multiyear programs
          outcome: Qualified production award such as Tomahawk cruise missile midbody
        - label: 工厂规模扩张
          actor: Divergent Production Operations
          touchpoints:
            - Scheduling production runs across modular Monolith One printer cells
            - Expansion into new multi-customer facilities like Long Beach Factory 2
          outcome: Eightfold capacity ramp and expansion into multi-program part catalogs
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU006
      - CU007
      - CU009
      - CU010
      - CU012
