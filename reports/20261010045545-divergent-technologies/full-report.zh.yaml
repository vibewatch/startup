              评估 Divergent 的可服务市场，必须把自上而下的增材制造宏观预测，与国防合同支撑的实际运营规模区分开来 [CM008]。第三方研究常把全球工业金属增材制造市场估算为约 $12
              billion；Divergent 的近期可服务市场则受精密国防与航空航天结构件约束，这是覆盖西方国防主承包商、规模约 $3.5 billion 的年度细分市场 [CM003,
