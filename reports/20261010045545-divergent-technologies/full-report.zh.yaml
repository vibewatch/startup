        - 到 2027 年收入增至 $40M-$60M；合同制造与工程服务并行；毛利率维持在约 30-35%
        - 估值维持在 $2.0B-$2.5B，回报持平或温和增长（市销率从 30x-40x 向可比公司压缩）
        - 工厂扩张持续延期，或 Tier-1 汽车 / 防务客户集中度下降
      - - 悲观情景
        - 25%（偏高）
        - 收入停滞在 $25M 以下；高额现金消耗耗尽 Series E 资金；3D 打印机和机器人折旧负担沉重
        - 在结构化资本重组中，估值压缩至 $800M-$1.2B（市销率低于 10x）；普通股受损
        - 防务预算重新排序，或市场出现更低成本的金属增材制造工厂方案
    notes: 评估运营里程碑和市场倍数下经风险调整的回报图景的三年情景模型。
