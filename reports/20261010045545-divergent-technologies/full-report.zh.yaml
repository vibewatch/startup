        - 年收入持续增长 3 倍以上；Raytheon 和 Lockheed 的防务连续生产订单落地；软件平台利润率超过 50%
        - 在成功 IPO 或战略防务收购下，估值达到 $5.0B-$7.0B（远期收入的 15x-20x）
        - 防务原型合同无法转化为纳入多年预算的采购项目
      - - 基准情景
