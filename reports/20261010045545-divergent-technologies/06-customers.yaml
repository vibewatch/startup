callouts:
  - calloutType: "insight"
    title: "Defense Production Pivot Overcoming Luxury Auto Volume Ceilings"
    body: "While Divergent originated in luxury automotive partnerships with Aston Martin and McLaren, automotive deployments face inherent volume constraints from boutique supercar production runs. The strategic pivot to aerospace and defense primes like Lockheed Martin and Raytheon expands Divergent's addressable unit economics into high-margin, recurring defense hardware where digital agility directly solves national defense industrial base bottlenecks."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU011"
      - "CU012"
  - calloutType: "risk"
    title: "Prototype-to-Production Conversion Friction in Defense Programs"
    body: "Rapid prototyping milestones, such as delivering the Skunk Works Replicator drone in under 12 months, demonstrate impressive technical agility but do not guarantee recurring production revenue. Lockheed Martin's explicit confirmation that Replicator remains an uncommitted prototype highlights the substantial defense procurement hurdle between initial technology demonstrations and multi-year program-of-record production awards."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU014"
