chapter:
  number: 6
  title: "Customers"
  summary: "Divergent's commercial customer base has shifted from boutique automotive OEMs toward major defense primes including Lockheed Martin and Raytheon. While aerospace part numbers grew to over six hundred across dozens of contracts driving reported fivefold revenue growth in 2025, defense adoption remains concentrated in prototype demonstrators and early-stage second-source awards without disclosed cohort retention metrics."
sections:
  - id: "customer-segmentation-and-commercial-scale"
    title: "Customer Base Segmentation & Multi-Industry Adoption"
    body: "Divergent's commercial adoption spans two primary industry verticals: high-performance automotive OEMs and aerospace and defense contractors. In the automotive vertical, Divergent established its foundational commercial footprint by supplying generative chassis, suspension, and structural components to boutique hypercar manufacturers, including Aston Martin, Bugatti, and McLaren. While these automotive programs established early technical validation and generated over thirty customer programs by 2022, their addressable production volume remains constrained by limited supercar build schedules. In response, Divergent initiated an aggressive strategic pivot toward defense and aerospace primes starting in 2022 with General Atomics, rapidly expanding into contracts with Lockheed Martin, Raytheon, and Triumph Group to capture larger recurring component volumes."
    tableRefs:
      - "TU001"
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU011"
      - "CU012"
  - id: "adoption-trajectory-and-sku-velocity"
    title: "Adoption Trajectory & Production SKU Velocity"
    body: "Divergent's customer adoption trajectory exhibits accelerating SKU velocity and expanding technical scope across active customer accounts. Early automotive engagements typically focused on isolated structural subassemblies, but subsequent aerospace contracts have expanded from individual sustainment parts to full mission-critical airframe structures. During the first half of 2025 alone, Divergent introduced over two hundred new aerospace and defense part numbers, pushing its active multi-industry catalog beyond six hundred qualified unique components. This expansion across defense primes helped drive a reported fivefold revenue increase in 2025, supported by management expectations that aerospace contracts will generate seventy percent of company revenue over the next three years, compared to thirty percent from commercial automotive."
    tableRefs:
      - "TU002"
    claimRefs:
      - "CU004"
      - "CU005"
      - "CU010"
      - "CU012"
  - id: "named-defense-and-commercial-proof"
    title: "Named Defense & Commercial Deployment Proof"
    body: "Publicly verified deployments demonstrate Divergent's progression from experimental components to flight-ready defense prototypes and qualified second-source awards. In commercial automotive, McLaren adopted 3D-printed suspension assemblies for its W1 supercar, demonstrating production-grade qualification in extreme mechanical environments. In aerospace and defense, Lockheed Martin's Skunk Works leveraged Divergent's Adaptive Production System to design and manufacture the Replicator unmanned aerial system prototype in under twelve months, following a twenty-five million dollar strategic investment in 2024. Additionally, RTX's Raytheon contracted Divergent as a qualified second source for Tomahawk cruise missile midbody structures, following collaborative airframe engineering that reduced component part counts by eighty percent."
    tableRefs:
      - "TU003"
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU013"
  - id: "procurement-integration-and-concentration-risks"
    title: "Procurement Integration & Customer Concentration Risks"
    body: "Despite accelerating customer adoption, Divergent faces significant structural risks surrounding procurement cycles, customer concentration, and prototype conversion. Defense acquisition frameworks impose lengthy qualification and appropriation timelines; for instance, while Divergent is under contract for Tomahawk midbody manufacturing, full-scale procurement remains contingent on future congressional budget allocations. Furthermore, rapid prototyping successes do not guarantee production awards: Lockheed Martin explicitly characterized the Replicator drone as an early-stage demonstrator that has not been selected for program-of-record production. Because Divergent does not publicly disclose cohort retention rates, contract churn metrics, or top-customer revenue concentration, private-market investors cannot independently verify the durability or recurrence of its customer revenue base."
    figureRefs:
      - "FU001"
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU006"
      - "CU007"
      - "CU009"
      - "CU012"
      - "CU014"
