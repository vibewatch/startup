        title: Adoption Trajectory & Production SKU Velocity
        blocks:
          - type: paragraph
            body: >-
              Divergent's customer adoption trajectory exhibits accelerating SKU velocity and expanding technical scope
              across active customer accounts. Early automotive engagements typically focused on isolated structural
              subassemblies, but subsequent aerospace contracts have expanded from individual sustainment parts to full
              mission-critical airframe structures. During the first half of 2025 alone, Divergent introduced over two
              hundred new aerospace and defense part numbers, pushing its active multi-industry catalog beyond six
              hundred qualified unique components. This expansion across defense primes helped drive a reported fivefold
              revenue increase in 2025, supported by management expectations that aerospace contracts will generate
              seventy percent of company revenue over the next three years, compared to thirty percent from commercial
