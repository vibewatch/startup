      - number: '5.2'
        title: Customer Workflows and Defense Demonstration Programs
        blocks:
          - type: paragraph
            body: >-
              DAPS alters customer development workflows by eliminating traditional blueprint-constrained fabrication
              [CE011]. When partnering with Divergent, defense and aerospace customers provide high-level mechanical
              boundary constraints, volume envelopes, and operational load cases rather than predefined structural
              drawings [CE011]. Divergent's generative software computes optimized organic geometry and lightweight
              lattice structures directly from these parameters [CE002, CE011]. The operational efficacy of this
              workflow has been demonstrated across major prime contractor collaborations [CE003, CE004]. For Raytheon
              Naval Power, Divergent reengineered a legacy naval effector airframe without requiring original tooling or
              existing supply chain infrastructure, reducing total component count by 80% and delivering flight-ready
              hardware in under five months [CE003]. Similarly, working with Lockheed Martin Skunk Works, Divergent
              advanced a nine-foot wingspan uncrewed aircraft system from initial concept to first-article prototype in
              less than twelve months [CE004]. However, while these demonstration projects validate development
              velocity, Divergent's facility utilization remains heavily concentrated in defense programs, exposing
              operations to federal appropriation schedules and prime contract timing [CE012].
