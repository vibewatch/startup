      - number: '1.4'
        title: Milestones and forward capacity
        blocks:
          - type: paragraph
            body: >-
              The chronology shows a company that moved from a 2014 automotive-oriented launch into aerospace and
              defense work in 2022, then raised successive strategic and institutional capital before announcing a much
              larger production footprint. Divergent said its June 2026 Long Beach facility would add 430,000 square
              feet, house 64 additional Monolith One printers over 24 months, and expand total factory presence beyond
              550,000 square feet. Those are forward deployment plans and company claims, not proof of installed output,
              utilization, qualified yield, or contracted demand. The investment case therefore depends on conversion of
              named programs and design wins into repeat production while new equipment, quality systems, workforce, and
              planning processes ramp together. The timeline preserves the disclosed sequence without implying that
              every capacity target has already been achieved.
