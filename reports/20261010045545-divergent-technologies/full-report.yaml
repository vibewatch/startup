              - CO007
              - CO008
              - CO009
              - CO010
              - CO012
      - number: '1.2'
        title: Capitalization and scale
        blocks:
          - type: paragraph
            body: >-
              Divergent's latest disclosed financing was a September 2025 Series E totaling $290 million at a reported
              $2.3 billion valuation. The financing comprised $250 million of equity and $40 million of debt and was led
              by Rochefort Asset Management, so the headline round size should not be treated as either pure equity
              raised or cash still available. A June 2026 company release said cumulative capital raised exceeded $1
              billion; EquityZen displayed $1.1 billion, a compatible but not independently audited tracker figure. The
              company also reported more than fivefold revenue growth in 2025 and more than 600 unique parts across
              industries, but no reliable absolute revenue, gross margin, cash-burn, runway, or customer-concentration
              figure appears in the assigned evidence. These omissions materially limit assessment of valuation support
              and financing durability.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
