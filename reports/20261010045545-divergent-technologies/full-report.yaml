  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance, CFIUS Scrutiny, and National Security Requirements
        blocks:
          - type: paragraph
            body: >-
              Divergent's strategic pivot from automotive hypercars to aerospace and defense hardware required a
              decisive restructuring of its ownership and governance architecture. Because defense prime contractors and
              the Pentagon enforce stringent national security vetting, Divergent executed a complete buyout of its
              Chinese shareholders, including Apollo Future Mobility, Horizons Ventures, and state-owned Shanghai
              Alliance Investment. Concurrently, former Goldman Sachs president John Thornton stepped down from the
              board to eliminate perceived foreign influence channels. However, operating as a defense supplier
              introduces continuous regulatory friction under International Traffic in Arms Regulations (ITAR) and
              emerging Cybersecurity Maturity Model Certification (CMMC) standards. Although eliminating foreign
              ownership successfully cleared immediate Committee on Foreign Investment in the United States (CFIUS)
              intervention, Divergent remains exposed to rigorous export controls, technical data isolation mandates,
              and intellectual property custody audits across its California facilities.
            claimRefs:
              - CR001
              - CR002
              - CR012
          - type: table
            tableRef: TR001
