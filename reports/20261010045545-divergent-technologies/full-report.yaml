            body: >-
              Despite accelerating customer adoption, Divergent faces significant structural risks surrounding
              procurement cycles, customer concentration, and prototype conversion. Defense acquisition frameworks
              impose lengthy qualification and appropriation timelines; for instance, while Divergent is under contract
              for Tomahawk midbody manufacturing, full-scale procurement remains contingent on future congressional
              budget allocations. Furthermore, rapid prototyping successes do not guarantee production awards: Lockheed
              Martin explicitly characterized the Replicator drone as an early-stage demonstrator that has not been
              selected for program-of-record production. Because Divergent does not publicly disclose cohort retention
