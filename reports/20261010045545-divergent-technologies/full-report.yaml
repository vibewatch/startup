        title: Geopolitical Emulation, Capital Intensity, and Diligence Priorities
        blocks:
          - type: paragraph
            body: >-
              Beyond immediate customer and factory execution risks, Divergent confronts broader strategic and financial
              headwinds. China's state-directed military-civil fusion apparatus is aggressively prioritizing industrial
              additive manufacturing, with state aviation conglomerates like Aero Engine Corp. of China demonstrating
              3D-printed engine components. While Divergent currently maintains platform leadership, sovereign
              competitors unconstrained by private venture return hurdles could erode its technological lead through
              sheer capital scale. Financially, Divergent has raised over $1 billion, including a $290 million Series E
              round in late 2025 at a $2.3 billion valuation. However, with reported 2025 revenue of $72.3 million and
              undisclosed operating losses, unit economics and capital expenditure intensity remain major diligence
              blind spots. Furthermore, co-founders Kevin and Lukas Czinger personally hold hundreds of patents,
              concentrating critical IP and executive control within family leadership.
