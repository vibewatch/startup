  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Multi-Industry Adoption
        blocks:
          - type: paragraph
            body: >-
              Divergent's commercial adoption spans two primary industry verticals: high-performance automotive OEMs and
              aerospace and defense contractors. In the automotive vertical, Divergent established its foundational
              commercial footprint by supplying generative chassis, suspension, and structural components to boutique
              hypercar manufacturers, including Aston Martin, Bugatti, and McLaren. While these automotive programs
              established early technical validation and generated over thirty customer programs by 2022, their
              addressable production volume remains constrained by limited supercar build schedules. In response,
              Divergent initiated an aggressive strategic pivot toward defense and aerospace primes starting in 2022
              with General Atomics, rapidly expanding into contracts with Lockheed Martin, Raytheon, and Triumph Group
              to capture larger recurring component volumes.
