      - number: '7.3'
        title: Defense Prime Concentration, Subcontractor Margins, and Legislative Budget Dependencies
        blocks:
          - type: paragraph
            body: >-
              Divergent has deliberately avoided building proprietary weapon systems, adopting a neutral infrastructure
              positioning akin to an advanced manufacturing foundry servicing legacy defense primes. While this prevents
              direct head-to-head competition with giants like RTX, Lockheed Martin, and Northrop Grumman, it locks
              Divergent into a highly subordinate subcontractor tier. Customer concentration is severe: key production
              contracts, such as supplying the Tomahawk cruise missile midbody structure for Raytheon, depend entirely
              on prime program allocation and congressional budget cycles. A finalized multiyear contract for the
              Tomahawk midbody remains contingent on congressional passage of the fiscal 2027 defense budget.
              Additionally, Divergent has committed substantial political capital, spending $350,000 on defense lobbying
              and hiring former congressional aides to secure line items like the $139 million Civil Reserve
              Manufacturing Network. Any shift in legislative priorities or prime in-sourcing threatens major revenue
              pipelines.
            claimRefs:
