            title: National Security Ownership Scrutiny and CFIUS Precedent
            body: >-
              Divergent's strategic buyout of Chinese shareholders—including Apollo Future Mobility, Horizons Ventures,
              and Shanghai Alliance Investment—was an essential prerequisite for securing U.S. defense prime
              subcontracts. While eliminating Chinese equity holders mitigates direct CFIUS intervention, lingering
