chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Divergent Technologies was founded in 2014 and is headquartered in Torrance, California. Its core product
              is not a stand-alone printer or design tool: the Divergent Adaptive Production System (DAPS) combines
              software-led design, metal additive manufacturing, and automated assembly into an end-to-end production
              workflow. That integration positions the company as both a manufacturing-technology platform and an
              operating supplier of finished structures for automotive, aerospace, and defense programs. The available
              evidence supports a late-stage private-company profile, but it does not establish a recurring software
              revenue model or a clean split between platform economics, engineering work, and manufactured-product
              revenue. Investors should therefore treat descriptions of DAPS as evidence of the production model, not as
              evidence that the company has software-like margins or recurring revenue.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
