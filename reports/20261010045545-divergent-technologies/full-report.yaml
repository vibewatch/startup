      - number: '5.3'
        title: Production Architecture and Digital Operating Model
        blocks:
          - type: paragraph
            body: >-
              The DAPS operating model establishes a continuous digital thread extending from initial algorithmic design
              down to physical part assembly [CE001]. The physical production layer relies on industrial metal additive
              manufacturing utilizing laser powder bed fusion (LPBF) [CE002]. Pre-heated powdered metal layers are fused
              by high-power laser beams in controlled build chambers to synthesize complex structural components and
              internal lattice geometries that cannot be manufactured through conventional subtractive machining or
              casting [CE002]. Once additive sintering finishes, structural nodes undergo thermal treatment and
              automated depowdering before entering automated robotic assembly cells [CE006]. Divergent eliminates
              physical assembly jigs and fixtures by deploying multi-axis industrial robots that execute optical
              alignment and precision structural adhesive bonding [CE006]. The coordinating software control plane is
              developed in-house using modern web and backend technologies, specifically TypeScript and Node.js,
              combined with relational and NoSQL data stores to manage machine telemetry, build jobs, and component
              genealogy [CE007]. This multi-tiered production architecture is protected by an extensive intellectual
              property portfolio spanning more than 500 patent applications filed and over 130 patents granted [CE009].
            claimRefs:
