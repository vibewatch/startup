      - number: '7.2'
        title: Operational Scaling, Monolith One Reliability, and Production Yield Risks
        blocks:
          - type: paragraph
            body: >-
              The core technical promise of the Divergent Adaptive Production System (DAPS) is tool-free agility,
              utilizing proprietary generative design software, powder bed fusion 3D printing, and automated robotic
              assembly to eliminate dedicated hard tooling. However, scaling this platform from high-margin luxury
              hypercar components to high-rate munitions hardware introduces unproven operational failure modes.
              Divergent's upcoming Long Beach Factory 2 plans to operate 64 custom Monolith One metal 3D printers to
              produce up to 30,000 missile airframes or 60,000 warhead casings annually. In mission-critical munitions,
              microscopic metallurgy voids, powder quality inconsistency, or laser thermal gradient anomalies can result
              in catastrophic structural failure under extreme flight stress. Furthermore, maintaining custom-built
              in-house printers without an external equipment vendor ecosystem concentrates maintenance downtime, spare
              parts logistics, and calibration drift risk entirely inside Divergent's operations.
            claimRefs:
              - CR006
              - CR007
              - CR011
          - type: table
            tableRef: TR002
