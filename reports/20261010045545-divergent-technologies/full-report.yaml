              - CO012
      - number: '1.3'
        title: Leadership, governance, and execution
        blocks:
          - type: paragraph
            body: >-
              Current company and secondary reporting identify Lukas Czinger as co-founder, president, and chief
              executive officer and Kevin Czinger as founder and executive chairman. EquityZen instead lists Kevin
              Czinger as chief executive officer and Ursula Ster as chief financial officer, creating a role-vintage
              conflict that should be resolved against a current company organization chart and board record. Public
              evidence in the assigned pool does not identify the full board, voting control, committee structure,
              succession provisions, or key-person protections. A 2026 business-operations posting also says Divergent
              is building and improving SIOP, data governance, budgeting, and capital-approval processes in a
              fast-changing environment with imperfect data. That is a reasonable scaling signal, but also an execution
              risk as factory capacity and defense-program commitments expand.
