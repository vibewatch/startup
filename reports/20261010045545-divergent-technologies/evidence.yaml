evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Audited or management-certified absolute revenue, recurring-revenue mix, gross margin, cash burn, runway, current
      employee count, exact customer count, and customer concentration.
    whyItMatters: >-
      Growth rates, funding raised, job-board ranges, and tracker estimates cannot establish operating scale, capital
      efficiency, or the durability of the reported valuation.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, cash and debt schedules, payroll roster,
      customer master, backlog, and concentration analysis through the latest closed month.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board and committee roster, voting control, ownership percentages, preference stack, reserved matters,
      succession plan, and key-person protections.
    whyItMatters: >-
      Founder-family leadership, conflicting public titles, and more than $1 billion of reported financing make decision
      rights and leadership continuity central to underwriting.
    diligencePath: >-
      Obtain the current cap table, charter and bylaws, voting agreements, investor-rights agreements, board minutes,
      committee charters, employment agreements, and succession materials.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: stakeholders
    missingEvidence: >-
      Complete Series E investor allocation, debt counterparties and terms, current ownership, board rights, and
      customer-level contract economics.
    whyItMatters: >-
      The visible stakeholder sample cannot establish dilution, control, covenant pressure, refinancing risk, or
      concentration of program revenue.
    diligencePath: >-
      Reconcile the financing ledger to bank statements and legal documents, then obtain a customer-by-customer contract
      and revenue schedule with qualification and production status.
    relatedQuestionRefs:
      - QO008
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-composition
    missingEvidence: >-
      Audited financial breakdown distinguishing recurring serial production revenue from non-recurring engineering
      (NRE), prototyping fees, and software licensing.
    whyItMatters: >-
      Valuation multiples and addressable market penetration depend heavily on whether revenue represents sticky
      high-margin unit production off-take or lumpy R&D services.
    diligencePath: >-
      Request confidential customer contract schedules, backlog reports, and unit volume accounting during pre-IPO data
      room diligence.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: defense-production-run-rates
    missingEvidence: >-
      Verified unit delivery schedules and DoD airworthiness sign-off documentation for Tomahawk cruise missile midbody
      components.
    whyItMatters: >-
      Determines whether Factory 2 production targets of 30,000 airframes translate into near-term cash flow or remain
      contingent on congressional appropriations and multi-year testing.
    diligencePath: >-
      Audit RTX Raytheon subcontract delivery milestones and Pentagon fiscal year 2027 procurement budget
      authorizations.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: diligence-gaps
    missingEvidence: >-
      Audited unit-level production cost, recurring maintenance cost, and gross margin breakdown comparing Divergent
      DAPS components directly against high-rate industrial castings across major defense programs.
    whyItMatters: >-
      Without independent per-unit production economics, investors cannot verify whether Divergent's
      factory-as-a-service model achieves structural cost parity against entrenched foundries or relies on subsidized
      development contracts.
    diligencePath: >-
      Request program-level unit economics, bill-of-materials comparisons, and realized gross margins on repeat defense
      procurement contracts under non-disclosure agreement.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      List and realized pricing, discount schedules, contract units, acceptance milestones, and revenue-recognition
      policy.
    whyItMatters: >-
      Without pricing and recognition evidence, reported growth cannot be translated into recurring revenue quality or
      gross margin.
    diligencePath: >-
      Request contract templates, anonymized invoices, the revenue-recognition memo, and price-volume-mix bridges for
      the largest programs.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: conflicting-data
    severity: material
    topic: cumulative-funding
    missingEvidence: >-
      A reconciled capitalization table separating equity proceeds, debt principal, secondary transactions, and undrawn
      facilities.
    whyItMatters: Conflicting cumulative-funding totals prevent a reliable view of dilution, leverage, and capital consumed.
    diligencePath: >-
      Reconcile board-approved financings to bank statements, debt schedules, and the fully diluted capitalization
      table.
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin, utilization, yield, scrap, rework, working capital, CAC, sales cycle, and contribution margin by
      program maturity.
    whyItMatters: >-
      These metrics determine whether software-defined manufacturing creates scalable margins or remains
      capital-intensive project delivery.
    diligencePath: Review audited segment economics and production cohorts from prototype through repeat-rate manufacturing.
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash, monthly burn, debt service, covenants, committed capex, and a 24-month operating forecast.
