          detail: "AI-driven topology optimization software that translates boundary constraints, thermal profiles, and mechanical loads into organic lattice and solid geometry."
        - label: "Layer 2: Digital Manufacturing Execution & Simulation"
          detail: "Full-stack digital control plane built on TypeScript, Node.js, and Manufacturo MES integrating CAD toolpaths with real-time process monitoring."
        - label: "Layer 3: Laser Powder Bed Fusion (LPBF) Additive Printing"
          detail: "Industrial metal 3D printing utilizing high-power multi-laser arrays to fuse proprietary aerospace-grade alloy powders layer by layer."
        - label: "Layer 4: Thermal Treatment & Automated Depowdering"
          detail: "Controlled thermal stress-relief cycles, automated powder evacuation, and surface finishing to prepare printed nodes for assembly."
        - label: "Layer 5: Fixtureless Robotic Assembly & Adhesive Bonding"
          detail: "Coordinated multi-axis industrial robots executing automated part alignment, precision structural adhesive dispensing, and automated joinery."
        - label: "Layer 6: Integrated Metrology & Quality Certification"
          detail: "Computer vision and laser metrology scanning combined with export-controlled traceability records for defense flight qualification."
