callouts:
  - calloutType: recommendation
    title: Price Discipline Dictates Track Stance
    body: >-
      While Divergent's technical validation in defense aerostructures is undeniable, investing at current private
      valuation marks ($2.3B to $3.37B) leaves minimal margin of safety without audited financial statements confirming
      gross margin defensibility.
    claimRefs:
      - CV001
      - CV014
  - calloutType: risk
    title: Liquidation Preference and Multiple Compression Risk
    body: >-
      Senior Series F liquidation preferences coupled with peer multiples trading at 3.7x to 6.1x revenue expose junior
      equity to substantial compression risk in the event of revenue plateaus or exit multiples reverting to industrial
      norms.
    claimRefs:
      - CV007
      - CV010
