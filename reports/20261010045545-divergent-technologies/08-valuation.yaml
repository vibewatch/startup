          DAPS solves critical DoD supply chain bottlenecks, winning contracts with Raytheon, Lockheed Martin, and
          General Atomics
        - >-
          Defense procurement is slow-moving, lumpy, and prone to lengthy qualification cycles before high-volume serial
          production
        - Cancellation or multi-year delay of prime contractor production programs
      - - Digital Manufacturing Moat
        - >-
          Software-defined generative design and robotic fixtureless assembly eliminate tooling capex and cut part
          counts by 80%
        - >-
          Skeptics note metal 3D printing and robotic assembly are standard technologies without proven structural IP
          protection
        - Third-party validation proving rival AM platforms achieve equal part consolidation without DAPS
      - - Revenue & Scaling Velocity
        - Management reports 5x year-over-year revenue growth in 2025 and 200+ new aerospace part numbers introduced
        - >-
          Absolute baseline revenue remains undisclosed and estimated under $10M, implying an extreme price-to-sales
          multiple
        - Disclosed audited annual revenue failing to exceed $25M by FY2026
      - - Capitalization & Funding
        - Backed by $939M to $1.46B in total funding with strong national security sponsorship via Rochefort and SBICCT
        - Substantial debt ($40M in Series E, $47M earlier) and heavy facility capex create high ongoing cash burn
        - Necessity of an emergency down-round or structured recapitalization under $1.5B valuation
    notes: Evaluation of divergent core theses across technology defensibility, procurement cycles, and capital requirements.
    claimRefs:
