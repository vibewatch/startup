      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability Signal
      - Core Operating Assumptions
      - Valuation / Return Logic
      - Downside Risk & Trigger
    rows:
      - - Bull Case
        - 20% (Low)
        - >-
          Sustained 3x+ annual revenue growth; serial defense production awards from Raytheon & Lockheed; software
          platform margins >50%
        - Valuation reaches $5.0B-$7.0B at successful IPO or strategic defense buyout (15x-20x forward sales)
        - Failure to convert prototype defense contracts into multi-year budgeted procurement line items
      - - Base Case
        - 55% (Moderate)
        - >-
          Revenue scales to $40M-$60M by 2027; blend of contract manufacturing and engineering; gross margins remain
          around 30-35%
        - >-
          Valuation holds at $2.0B-$2.5B, yielding flat or modest returns (30x-40x sales multiple compression toward
          peers)
        - Extended factory expansion delays or customer concentration loss among Tier-1 automotive/defense clients
      - - Bear Case
        - 25% (Elevated)
        - >-
          Revenue plateau under $25M; high cash burn exhausts Series E proceeds; heavy depreciation on 3D printers and
          robots
        - Valuation compresses to $800M-$1.2B in structured recapitalization (sub-10x sales); common equity impaired
        - Defense budget reprioritization or competing lower-cost metal AM factory offerings emerge
    notes: >-
