callouts:
  - calloutType: "insight"
    title: "Dual-Market Elasticity: Defense Production Urgency vs. Luxury Auto Prestige"
    body: "Divergent's strategic pivot from boutique luxury hypercars to defense munitions infrastructure reflects market boundary realities. While automotive OEMs use DAPS for low-volume, mass-optimized structural lightweighting, defense buyers face acute industrial base shortages, making high-rate missile and drone structures an 80% demand driver for new factory capacity."
    claimRefs:
      - "CM001"
      - "CM003"
      - "CM006"
      - "CM007"
  - calloutType: "risk"
    title: "Defense Qualification Lead Times and Capital Lock-In"
    body: "Additive manufacturing in Tier 1 aerospace programs requires multi-year airworthiness validation and extensive metallurgical characterization under AFRL and DoD frameworks. Until platforms like the Tomahawk and KC-135 achieve full airworthiness certification, production volume remains subject to testing delays and budget appropriation cycles."
    claimRefs:
      - "CM003"
      - "CM011"
      - "CM013"
      - "CM014"
