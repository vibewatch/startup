  - id: TI002
    title: Pricing and monetization disclosure
    columns: [Pricing element, Public value, Interpretation, Diligence request]
    rows:
      - [List price, null, "No retained source provides a public price list", "Obtain SKU or program price cards and quote-to-contract conversion"]
      - [Realized contract price, null, "Customer-specific pricing and discounts are unavailable", "Provide anonymized invoices by part, program, and production stage"]
      - [Recognition and payment terms, null, "Milestone, acceptance, prepayment, and warranty terms are unavailable", "Provide revenue-recognition memo, deferred revenue, and receivables aging"]
    notes: >-
      Null means the metric was not disclosed in the eight retained sources; it does not
      prove that no internal pricing or contract policy exists.
    claimRefs: [CI004, CI016]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - ["2025 revenue growth", ">5x year over year, company-reported", Medium, "Signals demand acceleration but not scale or profitability", "Provide audited 2024 and 2025 revenue by program and customer"]
      - ["2025 absolute revenue", "$72.3M from a low-transparency aggregator", Low, "Needed to interpret the growth multiple and valuation", "Reconcile to audited revenue; do not classify as ARR without contract evidence"]
      - [Gross margin, null, Unavailable, "Tests whether production scale converts into attractive economics", "Provide gross margin by automotive, aerospace/defense, and program maturity"]
      - [Factory utilization and yield, null, Unavailable, "Drives absorption of printer, robot, facility, energy, and quality costs", "Provide machine utilization, yield, scrap, rework, and throughput"]
      - [CAC and payback, null, Unavailable, "Long qualification cycles can consume capital before production revenue", "Provide sales-cycle cohorts, bid cost, win rate, and contribution payback"]
      - [Working capital, null, Unavailable, "Materials, WIP, receivables, and acceptance milestones may absorb cash", "Provide inventory turns, DSO, deposits, and milestone billing schedule"]
      - [Cash burn and runway, null, Unavailable, "Determines financing dependency and timing of the next round", "Provide closing cash, monthly net burn, debt service, covenants, and 24-month forecast"]
    notes: >-
      Values are public claims or evidence gaps, not modeled estimates. Funding raised is
      not cash available, and accounting revenue is not ARR or cash flow.
    claimRefs: [CI005, CI010, CI013, CI014, CI015, CI016]
