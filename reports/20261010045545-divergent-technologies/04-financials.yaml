        - label: Generative design
          detail: "DAPS converts requirements into optimized component designs."
        - label: Additive manufacturing
          detail: "Parts are printed with application-specific alloys."
        - label: Robotic assembly
          detail: "Software-defined assembly combines printed nodes into larger structures."
        - label: Qualified deliverable
          detail: "Output may range from sustainment parts to full airframe systems."
        - label: Contract revenue
          detail: "Unit, milestone, acceptance, and realized pricing are not publicly disclosed."
        - label: Gross profit
          detail: "Material, labor, utilization, yield, and program-margin data are not publicly disclosed."
    approximationNotes: >-
      Conceptual operating sequence based on retained sources; it is not a quantified
      funnel, forecast, or representation of revenue recognition.
    claimRefs: [CI001, CI010, CI011, CI016]
