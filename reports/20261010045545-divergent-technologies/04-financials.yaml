company:
  name: Divergent Technologies
chapter:
  number: 4
  title: Financials
  summary: >-
    Divergent reported more than fivefold revenue growth in 2025 and raised $290 million
    of equity and debt, but the public record does not disclose audited revenue, pricing,
    gross margin, cash burn, runway, or contract concentration. The underwriting case
    therefore depends on private evidence that growth converts into repeat production
    economics rather than capital-intensive project work.
sections:
  - id: revenue-model-and-quality
    title: Revenue model and revenue quality
    body: >-
      Divergent appears to monetize an integrated design-and-production service rather
      than a disclosed software subscription. Customers provide performance requirements;
      Divergent uses DAPS to design components and then manufactures hardware through
      additive production and robotic assembly. The company says it has contracts with
      dozens of aerospace and defense customers, spanning individual sustainment parts
      through full airframe systems. Management also expects aerospace to represent about
      70% of revenue over the next three years, with automotive contributing about 30%.
      Those disclosures point to a mix of engineering, qualification, part production,
      and assembly economics, but they do not establish how contracts are priced or when
      revenue is recognized. Reported 2025 revenue growth of more than fivefold is a
      meaningful demand signal, yet it is a growth multiple without a verified starting
      base. One low-transparency aggregator reports $72.3 million of 2025 revenue, but the
      figure is not corroborated by the other retained sources and should not be treated
      as ARR or audited revenue.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI013]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: operating-economics-and-margin-path
    title: Operating economics and margin path
    body: >-
      The economic promise is reduced design-specific tooling and a continuous digital
      thread from design through production. A manufacturing-software partner says DAPS
      can eliminate upfront capex for customers, but that statement concerns the customer
      value proposition; it does not show that Divergent itself is asset-light. Divergent
      still designs software, develops printers, sources alloys, operates robotic assembly,
      integrates bills of materials, and manages factory data and quality workflows.
      These activities create potentially valuable process integration while also implying
      fixed labor, equipment, facility, material, energy, qualification, and working-capital
      burdens. A reported 450-person workforce is another scale proxy, not an expense
      disclosure. Public sources provide no gross margin, utilization, scrap, yield,
      inventory cycle, contract-level contribution margin, CAC, sales cycle, or payback
      data. The resulting margin thesis is plausible but unproven: software-defined
      changeovers and lower tooling needs could improve economics, while low utilization,
      qualification delays, or customer-specific engineering could preserve project-like
      margins.
    claimRefs: [CI010, CI011, CI014, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      The September 2025 financing supplied $250 million of equity and $40 million of debt,
      and management said the proceeds would expand manufacturing capacity, hiring, and
      new product development. That is evidence of financing access and a capital-intensive
      scale plan, not evidence of cash presently available: the retained record does not
      disclose closing cash, current burn, runway, debt pricing, covenants, repayment
      schedule, or project-finance obligations. Total-capital estimates also conflict.
      Tracxn reports $828 million over 11 rounds, while EquityZen displays $1.1 billion
      and a company-sourced Los Angeles Times item says more than $1 billion. Differences
      may reflect timing and whether debt is counted, so none should be substituted for a
      reconciled capitalization schedule. The principal adverse source questions whether
      the valuation and financing eligibility align with undisclosed revenue and process
      economics. Financially, Divergent merits credit for demand momentum and capital
      access, but revenue quality, margin scalability, and capital adequacy remain
      ununderwritable until management supplies audited financials, a contract cohort,
      unit economics, and a 24-month liquidity bridge.
    claimRefs: [CI006, CI007, CI008, CI009, CI012, CI015, CI016]
callouts:
  - calloutType: risk
    title: Financing is not runway
    body: >-
      The $290 million Series E combined equity and debt and was earmarked for capacity
      and product expansion. Without closing cash, burn, covenant, and repayment data,
      funding raised cannot be treated as cash available or translated into runway.
    claimRefs: [CI006, CI007, CI015]
