    {
      "id": "working-capital-unit-economics-and-control-history",
      "title": "Working capital, unit economics, and control history",
      "body": "The historical SEC file is especially useful because it exposes the mechanics behind the revenue line. It says the company maintained about a 30-day raw-material-to-sales cycle, relied heavily on distributors, and had concentrated customers and suppliers. The five largest customers represented 40% of 2010 sales, while the three largest suppliers represented 61% of raw-material purchases. Bills receivable and bills payable were active parts of working-capital management, and discounted bills receivable subject to reimbursement reached about USD 9.2 million at 2010 year-end. Those features matter because they describe a business whose economics can be sensitive to raw-material volatility, channel bargaining power, and trade-finance plumbing. In other words, even before looking at today's degradables story, the legacy financial model already looked like a working-capital- and execution-sensitive industrial business rather than a simple commodity spread trade.\n\nThe adverse side is equally important. The SEC enforcement release means investors cannot treat historical financial controls as a solved problem by default. Related-party disclosure failures, books-and-records weaknesses, and an off-balance-sheet cash account are not minor technicalities for a capital-intensive industrial company. Even if today’s operations are much larger and more sophisticated, that history raises the burden of proof around current controls, related-party dealings, and cash management.",
      "claimRefs": [
        "CI014",
        "CI016",
        "CI017",
        "CI019",
        "CI020",
        "CI033"
      ],
      "tableRefs": [
        "TI003"
      ],
