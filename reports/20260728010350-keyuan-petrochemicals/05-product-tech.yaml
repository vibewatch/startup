      "id": "manufacturing-architecture-and-dependencies",
      "title": "Manufacturing architecture and dependencies",
      "body": "The historical SEC filing and the current Ningbo profile together describe a real industrial process stack. The filing points to petrochemical production capacity, storage and loading infrastructure, and a 70,000 MT SBS facility, while Chemical HR describes more than twenty units at the Ningbo base, ranging from pretreatment and cracking to aromatics extraction and PSA hydrogen. That architecture matters because it explains why Keyuan’s differentiation claim is not primarily software, patents-on-paper, or branding; it is plant configuration, feedstock handling, and the ability to route material across multiple lines.\n\nBackward integration is the other core dependency. 36Kr says Keyuan’s Guangxi ABS and supporting project was designed to internalize styrene and butadiene supply and reduce costs by about 20%. CCFGroup’s write-up on Changhong’s PBAT chain shows a similar logic in degradables: run resin, modified materials, and finished bags in one chain to take conversion cost out of the system. This gives Keyuan a plausible industrial advantage if it can actually connect the petrochemical side and degradables side economically. But it also means the business is deeply dependent on feedstock access, plant execution, and capex discipline. The product is inseparable from the process that makes it.",
      "claimRefs": [
        "CE010",
