  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 真实工业规模叠加独角兽级融资通道，说明这家公司有实体底盘，不只是愿景故事。
        - 如果披露收入或客户重要性被证明夸大，论点会迅速变弱。
      - - 可降解材料的政策顺风，给传统石化之外创造了选择权。
        - 如果政策驱动需求无法转化成有利润的采用，这份选择权就应打折。
      - - 对比披露收入和上市可比公司的销售倍数，当前估值并不极端。
        - 如果隐性债务、优先权悬挂或薄弱利润率浮出水面，同一估值可能转为没有吸引力。
      - - 客户证明包括具名全球买家和较广企业客户群。
        - 如果这些关系并非当前有效、可重复，或不能直接归因于 Keyuan，叙事就应重新定价。
    notes: 本论点有意保持平衡：公开上行空间存在，但每个正面点都有合理的稀释或披露反证。
