    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、工业足迹与商业模式
        blocks:
          - type: paragraph
            body: >-
              当前最强的身份信号不是英文创业公司页面，而是宁波媒体、公司提交的简介材料和行业目录之间的相互印证。China Daily 的宁波报道在 2026 Hurun Global Unicorn Index 中把
              Keyuan Petrochemicals 识别为一家总部在宁波、估值 7.5 billion yuan
              的民营公司，并且连续第二年上榜。这个排名落在更宽的集团结构之上，而不是一个干净单一的法律实体。Chemical HR 和 Baidu Baike 都把 Keyuan Holding
              描述为一家大型民营集团，聚焦精细化工、热塑性弹性体、工程塑料和生物降解材料；其中 Ningbo Keyuan Jinghua 运营公司成立于 2007 年 4 月，控股公司本身成立于 2016 年 10
              月。尽调中的实际读法是，投资人押注的是一个起源于宁波、法律历史分层的工业平台，而不是一家 2025 年新成立的绿色材料初创公司。


              运营上，这个集团读起来仍是一个从石化制造平台向更绿色材料延展的公司，而不是纯粹的生物塑料专门厂商。Chemical HR 称，宁波基地运行二十多套流程装置，采用重油和燃料油裂解，年处理量超过 3 million
              tons。同一批简介材料把集团放在多个国内基地之中，包括宁波、嵊州和防城港；Baidu Baike 还补充了贺州和 2026
              年茂名丙烯酸项目。终端市场证据也指向宽泛的工业客户组合：公开描述提到化工、印染、医药、食品、精密电子、光学，以及电子制造中的工业清洗剂用途。结论是，这是一家纵向一体化的化工平台，带有先进材料相邻业务，而不是范围狭窄的单一产品公司。
