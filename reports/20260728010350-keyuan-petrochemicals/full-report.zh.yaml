  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 熊市
        - 收入质量弱于媒体报道暗示；利润率压力接近表现疲弱的上市同业；治理折价加深
        - 在更低有效收入基数上套用更低工业倍数，对应 RMB 4.0B-5.5B 区间
        - 披露冲击、烧钱、供给过剩、集中度
        - 如果尽调发现债务或控制问题，概率信号会变得重要
      - - 基准
        - 披露收入方向上真实；没有新的治理冲击；当前价格大体跟随工业可比公司，但带质量折价
        - 区间 RMB 7.0B-9.0B，中心接近当前公开估值标记
        - 仍暴露于利润率疲弱和不透明
        - 最符合当前公开证据
      - - 牛市
        - Keyuan 证明盈利质量更好、客户耐久性更强，并用更干净披露支撑可信的可降解材料增长
        - 在质量改善和更高特种材料倍数支撑下，对应 RMB 10.0B-12.5B 区间
        - 需要执行和披露升级
        - 可能发生，但公开证据还不足以让它占主导
    notes: 情景区间是分析师基于公开估值标记、披露收入和上市可比公司倍数做出的判断；不是管理层指引。
