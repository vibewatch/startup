  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局和直接可比公司
        blocks:
          - type: paragraph
            body: >-
              尽调的第一个错误，是把 Keyuan 看成只和一种对手竞争。公开来源指向至少四类竞争者。第一类是 PLA 专门厂商集群，这里以 Zhejiang Hisun 和 Jindan
              为代表，竞争围绕树脂牌号、应用范围、认证和产品适配深度展开。第二类是 PBAT 和可降解薄膜产能集群，Changhong 和 Blue Ridge Tunhe
              展示了显著规模和面向加工商的产品组合。第三类是巨型多元化既有企业集群，Kingfa 是最清楚的例子：它可以把生物降解材料作为更大材料关系中的一个产品项销售。第四类是 BBCA
              代表的更宽生物制造平台路径，生物材料嵌在更大的生化和工业生态中。


              Keyuan 本身很难塞进任何单一桶里。36Kr 简介仍把它描述为一家依靠后向一体化和规模经济的精细化工与 ABS/SBS 导向一体化公司，而不是纯粹的 PLA 专门厂商。这意味着，当成本一体化以及薄膜 /
              袋类或工业材料应用重要时，Keyuan 的直接重叠最强；当高度依赖认证的 PLA
              细分场景更重要时，重叠更弱。因此，市场会奖励那些按应用、市场路径和成本结构来绘制重叠的投资人，而不是只看哪些公司一起出现在生物塑料市场公司列表上。
