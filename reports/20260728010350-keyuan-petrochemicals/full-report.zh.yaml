  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐结论从真实规模和政策支持出发，经过披露和风险折扣后，落到继续研究，而不是买入结论。
    claimRefs:
      - CV002
      - CV006
      - CV016
      - CV018
      - CV030
      - CV031
      - CV033
    data:
      nodes:
        - label: 真实规模和融资证据
          description: 收入历史和 2025-2026 年估值锚点显示实质经营体量。
        - label: 政策与市场可选性
          description: 可降解材料增长和一体化材料广度创造上行路径。
        - label: 披露与治理折扣
          description: SEC 历史、透明度不足和当前资产负债表可见度弱，压低确信度。
        - label: 可比公司区间
          description: 公开同业给出合理支撑，但不是明显便宜。
        - label: 建议：继续研究
          description: 继续尽调，但还不能有把握地接受当前估值。
      edges:
        - from: Real scale and financing proof
          to: Comparable-company bracket
          label: 工业倍数支撑
        - from: Policy and market optionality
          to: Comparable-company bracket
          label: 上行叙事
        - from: Disclosure and governance discount
          to: Comparable-company bracket
          label: 质量折扣
        - from: Comparable-company bracket
          to: 'Recommendation: research-more'
          label: 合理但不便宜
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 仅用公开数据做的简单敏感性显示，收入基数和质量倍数假设一变，价值会很快摆动。
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV027
      - CV028
      - CV029
    data:
      items:
        - label: RMB 7.6B 收入 @ 0.5x 工业悲观倍数
          value: 3.8
          detail: 如果披露和利润率质量偏弱，这是近似下行情形。
        - label: RMB 7.6B 收入 @ 0.9x 混合基准倍数
          value: 6.8
          detail: 采用“工业倍数 + 质量折扣”框架的低端基准看法。
        - label: RMB 8.5B 收入 @ 0.95x 当前估值逻辑
          value: 8.1
          detail: 如果收入基数大体真实，接近 2025 年融资轮锚点。
        - label: RMB 11.1B 收入 @ 0.7x 峰值收入逻辑
          value: 7.8
          detail: 如果 2022 年规模有代表性，大致匹配当前公开估值。
        - label: RMB 8.5B 收入 @ 1.3x 质量改善倍数
          value: 11.1
          detail: 需要利润率更干净，披露也优于当前公开数据。
        - label: RMB 11.1B 收入 @ 1.1x 特种工业高端倍数
          value: 12.2
          detail: 如果收入质量和可降解材料落地得到证明，这是乐观情形。
    approximationNotes: 这些值以十亿元人民币计，来自分析师搭建的简单公开倍数情景，不是管理层指引或 DCF 输出。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 仅基于公开信息的估值结果，会把当前 7.5-8.0B RMB 估值圈在区间内，而不是明确推翻。
