  - id: TV005
    title: 打破论点的终止触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 控制或关联方问题复发
        - 可信证据显示当前控制缺陷仍未解决
        - 击穿对所有披露财务和客户说法的信任
        - 转为回避 / 停止按上市可比公司定价
      - - 项目烧钱但没有采用
        - 大额资本开支或借款上升，却没有客户 / 利润率证明
        - 把增长故事变成融资风险故事
        - 按熊市情景重新定价，并收紧尽调
      - - 同业利润率持续受压
        - 上市同业数据恶化，但 Keyuan 仍要求独角兽定价
        - 压缩可接受的可比倍数区间
        - 将估值立场从合理下调为偏高
      - - 客户证明不及预期
        - 具名证明无法对应到当前活跃关系或现场
        - 直接削弱需求质量论点
        - 继续推进前要求账户级证据
      - - 安全或合规事件
        - 重大工厂事件或认证失败
        - 同时打击运营、客户、监管和融资
        - 立即重审论点，并重置下行情景
    notes: 这些触发项把宽泛的尽调不确定性转化成具体投资决策规则。
