          low: 4
          base: 4.8
          high: 5.5
          unit: RMB B
          note: 收入质量更弱、治理折扣更重，商品化倍数压缩更强
        - label: 基准情形价值
          low: 7
          base: 8
          high: 9
          unit: RMB B
          note: 如果收入基数和工业相关性大体成立，当前公开估值大致合理
        - label: 乐观情形价值
          low: 10
          base: 11.2
          high: 12.5
