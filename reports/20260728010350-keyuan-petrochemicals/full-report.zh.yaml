      - number: '7.2'
        title: 运营、依赖和财务风险
        blocks:
          - type: paragraph
            body: >-
              运营模式本身带来显著风险。Chemical HR 描述了二十多套流程装置和大型加工足迹；SEC
              文件显示，业务有营运资金敏感的转换周期，客户和供应商集中。这不是低固定成本的轻资产业务，而是原料、吞吐、维护和融资相互作用的工业系统。因此，停机、成本飙升或项目延期可能同时冲击生产、毛利和流动性。Changhong
              2026 年分析是一个有用的公开代理指标，展示这种情况在更大生态中会是什么样子：毛利压力、改造导致的停产、经营现金流为负、财务费用上升，以及明确的安全生产风险。


              依赖风险会叠加问题。历史上，头部客户和供应商集中，销售高度依赖分销商，新的增长似乎与大项目和新资本相连。政策依赖、资本方依赖和原料依赖相互叠加。一体化可以缓释部分原料风险并改善成本位置，但如果规模化不及预期，同样的一体化也会放大项目和融资风险。结果是一门在错误时点任何一项依赖断裂时，下行会快速级联的业务。
