  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构和优先权堆栈
        - 2024-2025 年各轮的准确条款、稀释、优先权和老股转让
        - 需要判断股权价值是否真等同于对外宣称估值
        - 向管理层索取法律文件和股权结构包
      - - 当前现金 / 债务 / 现金跑道
        - 资金余额、债务到期表、契约条款、项目义务
        - 需要判断当前价格是否藏有融资风险
        - 索取资金和贷款方资料包
      - - 客户耐久性
        - NRR、流失率、复购、当前头部客户、现场地图
        - 需要判断收入质量能否支撑当前估值标记
        - 索取销售和客户运营资料包
      - - 产品线利润率桥
        - 按化学品、ABS/TPE、可降解材料和关联公司拆分的毛利率与 EBITDA
        - 需要判断最好的增长领域是否也创造价值
        - 索取产品族 P&L 桥
      - - 治理整改状态
        - 当前内控、关联方政策、董事会监督
        - 需要判断 SEC 时期的伤疤是历史遗留，还是仍有结构性影响
        - 索取治理和审计材料
      - - 项目采用证明
        - 下游加工商认证、合同，以及可降解材料产线爬坡证据
        - 需要从故事走向可用于投资测算的运营证明
        - 索取项目 PMO 和客户认证资料包
    notes: 这些问题是把建议上调到「继续研究」之上所需的最低信息集。
