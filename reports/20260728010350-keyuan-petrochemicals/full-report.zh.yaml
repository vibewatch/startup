  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和公开规模
        blocks:
          - type: paragraph
            body: >-
              保留来源支持一个宽泛的收入模式图景，但不足以拼出完全勾稽的当前财务包。历史 SEC
              文件显示，公司围绕石化产品销售运转，有书面销售协议，按交付确认收入，定价锚定市场条件，而不是经常性订阅式合同。同一份文件称，多数历史客户预付款，核心客户可以获得信用；86%
              的销售通过贸易公司型分销商流出。这种结构符合交易型工业业务：物流、原料和市场时点比软件式锁定经常性收入更重要。


              近期第三方报道大幅升级了规模故事。36Kr 和 OFweek 报告收入为 2020 年 RMB 8.555 billion、2021 年 4.847 billion、2022 年 11.125
              billion、2023 年前三季度 5.703 billion，2023 年毛利率 18.7%。这些数字有分量，但仍是媒体中介化信息，而不是当前经审计的集团披露。审慎读法是，Keyuan
              具备真实工业收入规模，但投资人不应把这等同于当前分部组合、收入质量或逐项盈利能力的干净披露。
