  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Keyuan 最重的剩余风险集中在历史治理、危化运营、资本强度以及客户 / 供应商不透明。
    claimRefs:
      - CR001
      - CR007
      - CR013
      - CR020
      - CR027
      - CR040
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 历史治理 / 关联方风险
          values:
            - label: 中
              tone: warning
              detail: 历史事实已经成立，即便当前状态未知。
            - label: 极高
              tone: negative
              detail: 可能迅速摧毁信任、融资和退出选项。
            - label: 公开证据弱
              tone: risk
              detail: 当前母公司层面几乎没有公开的缓释证据。
            - label: 高
              tone: negative
              detail: 当前控制未验证前，剩余暴露仍高。
        - label: 危化运营 / 安全风险
          values:
            - label: 中
              tone: warning
              detail: 复杂装置和危险投入品带来不可忽视的事故概率。
            - label: 高
              tone: negative
              detail: 一次严重事故就可能同时冲击人员、生产和监管。
            - label: 中
              tone: neutral
              detail: 工业运营方通常有例行机制，但 Keyuan 特定的公开 KPI 可见度弱。
            - label: 高
              tone: negative
              detail: 没有事故数据，剩余暴露仍高。
        - label: 资本强度与项目风险
          values:
            - label: 中高
              tone: warning
              detail: 生态代理证据里已经能看到大型项目和借款。
            - label: 高
              tone: negative
              detail: 项目执行失误可能在收入或利润率被证明前先吃掉现金。
            - label: 中低
              tone: warning
              detail: 留存资料没有公开母公司层面的持续运营控制包。
            - label: 高
              tone: negative
              detail: 现金和资本开支控制看清前，剩余严重度偏高。
        - label: 客户 / 供应商集中度不透明
          values:
            - label: 中高
              tone: warning
              detail: 历史集中度和经销商依赖有明确证据。
            - label: 高
              tone: negative
              detail: 失去一个关键渠道或供应商就可能大幅牵动业绩。
            - label: 低
              tone: risk
              detail: 当前多元化证据未公开。
            - label: 高
              tone: negative
              detail: 当前组合弄清前，剩余暴露仍高。
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要风险大多只通过少数工业卡点传导到收入、利润率、融资和估值。
    claimRefs:
      - CR015
      - CR019
      - CR023
      - CR024
      - CR034
      - CR035
      - CR039
    data:
      nodes:
        - id: governance
          label: 治理 / 控制薄弱
          detail: 关联方或控制失效会削弱信任和报告。
          tone: risk
        - id: operations
          label: 工厂 / 工艺中断
          detail: 停产、安全事件或改造延误会伤害吞吐。
          tone: risk
        - id: margin
          label: 利润率压缩
          detail: 供给过剩、原材料成本或准入失败会侵蚀经济性。
          tone: risk
        - id: customers
          label: 客户和渠道信心
          detail: 渠道不透明或集中度会削弱需求韧性。
          tone: risk
        - id: financing
          label: 融资通道
          detail: 如果信任或利润率转弱，债务、新一轮融资和契约都会变难。
          tone: risk
        - id: valuation
          label: 估值与可退出性
          detail: 压力下，倍数压缩和结构性条款会迅速恶化。
          tone: risk
      edges:
        - from: governance
          to: financing
          label: 信任和尽调失效
        - from: operations
          to: margin
          label: 良率和停机冲击经济性
        - from: margin
          to: financing
          label: 现金消耗和契约压力
        - from: customers
          to: margin
          label: 销量流失或定价转弱
        - from: financing
          to: valuation
          label: 降价轮或稀释风险
        - from: margin
          to: valuation
          label: 倍数压缩
        - from: operations
          to: customers
          label: 服务和质量中断
    approximationNotes: 图关注因果风险流，不是法律所有权或会计结构。
