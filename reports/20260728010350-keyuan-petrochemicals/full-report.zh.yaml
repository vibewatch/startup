      - number: '3.3'
        title: 定价、分销和切换成本
        blocks:
          - type: paragraph
            body: >-
              公开价格数据稀少，这本身就是一个竞争事实。保留来源中最强的直接披露来自历史 Keyuan，其 SEC
              文件称，销售主要通过分销商走，合同按订单签，定价跟随市场条件，而不是固定长期合同。这说明至少部分市场更像工业采购，而不像粘性企业软件：客户可以多方采购，加工商可以比较报价，价格或供应可得性会迅速转移销量。


              但价格不是全部。Hisun 和 Jindan 等 PLA 专门厂商仍能通过牌号深度、认证和应用 know-how 制造摩擦。Tunhe 可通过化学宽度和覆盖多种相邻材料需求的能力制造摩擦。Kingfa
              可通过关系捆绑和公司规模制造摩擦。Keyuan 可能的防线又不同：后向一体化、石化原料控制，以及用同一平台服务相邻
              ABS/TPE/工业材料需求的能力。买方在大宗薄膜牌号中的切换速度，可能快于在认证要求更高的模塑或特种应用中。因此，“切换成本”在这里不是一个全市场常数；它会随树脂族和使用场景显著变化。
