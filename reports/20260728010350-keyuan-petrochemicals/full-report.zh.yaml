  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Keyuan 的产品架构叠加上游原料处理、工艺化学、树脂 / 弹性体产出、可降解相关转化，以及下游工业应用。
    claimRefs:
      - CE001
      - CE002
      - CE010
      - CE012
      - CE014
      - CE016
      - CE017
    data:
      layers:
        - label: 下游应用层
          detail: 电子清洗、轮胎 / 鞋材输入、包装薄膜和袋类、注塑及模塑制品、农膜替代等使用场景。
          tone: positive
        - label: 树脂和产品族层
          detail: 精细化学品、溶剂、清洗剂、SBS / TPE、ABS 相关材料、工程塑料和可降解相邻产出。
          tone: positive
        - label: 改性与转化层
          detail: 可降解链条越过基础树脂后，PBAT 改性和成品袋转化变得重要。
          tone: neutral
        - label: 工艺单元层
          detail: 裂解、萃取、分离、加氢和配套石化单元把原料转成可用中间体和产品。
          tone: neutral
        - label: 原料与供应层
          detail: 重油、燃料油、苯乙烯、丁二烯等上游输入驱动成本和质量经济性。
          tone: neutral
    approximationNotes: 该架构合并了 Keyuan 直接证据和生态可降解证据，因为公开来源对一体化平台的描述，比对单一当前产品表层级的描述更清晰。
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: Keyuan 的产品嵌入工业流程：先有材料或清洗需求，再经过加工商或工厂认证，最后落到工艺或产品性能。
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE015
    data:
      nodes:
        - label: 工业流程或材料需求
          detail: 工厂需要适配现有产线的清洗化学品、弹性体输入或可降解材料。
        - label: 材料认证
          detail: 买方检查性能、应用类别和合规适配，确认是否适合目标工艺。
        - label: 供应与转化匹配
          detail: 供应商必须稳定交付材料，同时支撑加工商或工厂的工艺经济性。
        - label: 生产部署
          detail: 材料进入电子清洗、轮胎 / 鞋材、袋膜、模塑或农业应用。
        - label: 性能与复购
          detail: 复购或放量前，结果要按良率、安全、合规和成本来判断。
      edges:
        - from: Industrial process or material need
          to: Material qualification
          label: 规格与使用场景适配
        - from: Material qualification
          to: Supply and conversion match
          label: 价格 + 性能 + 可得性
        - from: Supply and conversion match
          to: Production deployment
          label: 合格材料进入产线
        - from: Production deployment
          to: Performance and reorder
          label: 良率 + 合规 + 经济性
    approximationNotes: 这是从留存来源抽象出的通用工业工作流，不是某个客户 SOP 的直接记录。
  - id: FE003
