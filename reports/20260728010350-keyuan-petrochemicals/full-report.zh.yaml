      - number: '1.3'
        title: 里程碑、规模信号和历史遗留风险
        blocks:
          - type: paragraph
            body: >-
              最强的公开规模信号是真实的，但不如一份打磨过的独角兽路演材料那么干净。36Kr 和 OFweek 将非常大的收入数字归因于 Keyuan Jinghua：2020 年 85.55 billion
              yuan、2021 年 48.47 billion、2022 年 111.25 billion、2023 年前三季度 57.03 billion；同时披露 2023 年毛利率为 18.7%，具名客户包括
              Bridgestone、Adidas 和超过 50 家 Fortune Global 500 企业。如果这些数字方向上可靠，Keyuan 的规模已经远超早期初创公司，也解释了为什么后期资本愿意支持 8.0
              billion yuan 的估值。同时，本次没有找到当前集团层面保留的经审计财务包，也没有干净的公开员工数、债务或合并董事会披露。因此，本报告把收入和客户规模视为强信号，但仍是第三方中介化证据，而不是审计确定性。


              历史遗留风险更具体。SEC 2013 年执法公告指控美国上市的 Keyuan 载体及前 CFO Aichun Li 存在未披露关联方交易、账簿和记录缺陷、内部控制失效，以及使用表外现金账户；最终公司支付 1
              million dollar 罚款，CFO 支付 25 thousand dollar
              罚款并和解。现代独角兽故事强调生物降解塑料和先进材料，并不意味着这段负面历史可以被忽略。它不能证明当下存在不当行为，但确实抬高了对治理、关联方往来、项目融资和披露纪律的尽调门槛。利好对冲在于，中国政策体系通过
              NDRC 和 SAMR 行动，对生物降解塑料的支持明显增强，而 Keyuan 关联方如 Changhong 已经投产 PBAT
              产能。因此，公司概览整体是一幅混合图景：产业上重要，财务上有吸引力，契合政策，但仍背着历史披露伤疤；同时，在成长股权投资人最需要精确度的地方，当下透明度仍不足。
