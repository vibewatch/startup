      - number: '1.2'
        title: 资本历史、控制人和上市关联方
        blocks:
          - type: paragraph
            body: >-
              公司当前的独角兽估值建立在一条融资阶梯上，但这条阶梯只部分清理了一个相当复杂的资本市场旧账。36Kr 报道称，Keyuan 最早在 2010 年通过与 Silver Pearl 反向并购进入美国市场，随后在
              2017 年将美国上市载体私有化，2019 年尝试与 Renzhi Shares 进行 10.3 billion yuan 的 A 股借壳交易，之后转向多步私募融资。同一篇 36Kr 报道称，Keyuan 于
              2019 年底启动市场化融资，2020 年 4 月从 Guangxi Guofu Innovation Fund 获得 B 轮，2020 年 8 月从 Zhejiang Fuzhe Capital 和
              Shenzhen Xinghe Holdings 获得 B+ 轮，2024 年 3 月从 Shanghai Yongzheng 获得估值 7.0 billion yuan 的 C 轮，并在 2025 年 2 月从
              Shanghai Fosun High-Tech 获得估值 8.0 billion yuan 的 D 轮首次交割。DoNews 和 Eastmoney 都印证了 D 轮标题和估值上调，因此 2025–2026
              年的独角兽叙事具备合理支撑，即便完整股权表和优先权结构仍未公开。


              但控制权和治理远没有融资年表那么透明。2010 年 SEC 文件在历史运营结构中识别了创始人 / 控制人 Tao Chunfeng、Wang Jicun 和 Chen
              Peijun。后续公开材料更清楚强调关联上市实体，尤其是 Ningbo Changhong Polymer 和 Zhejiang Changhong
              Biomaterials，却没有同等披露当前集团董事会、委员会结构或合并层面的决策权。问题在于，许多关于当前生物降解材料战略的公开证据来自 Changhong 关联方披露，而不是来自 Keyuan
              独立的投资者关系界面。投资人能看到资本阶梯和产业方向；但仍看不到一套清晰、当前、集团层面的治理材料，无法判断决策架构。
