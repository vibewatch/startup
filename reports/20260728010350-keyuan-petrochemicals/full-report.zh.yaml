companyProfile:
  summary: >-
    Keyuan Petrochemicals 是一家总部在宁波的民营工业材料平台，公开业务足迹覆盖精细化工、热塑性弹性体、与 ABS
    相连的上游一体化，以及借助关联资产推进的生物降解塑料扩张。保留证据支持其真实规模：数十亿元人民币报告收入历史、大型流程工业基础设施、触达全球买家的具名客户证据，以及多轮机构融资，最终在 2025 年由 Fosun 支持的 D
    轮完成首次交割。投资判断的难点不是这家公司是否存在业务，而是在当前估值下，治理旧伤、资本强度和母公司层面披露不足尚未解决，投资人能否充分信任这门生意的质量。
  foundingLocation: Ningbo, Zhejiang Province, China
  headquarters: Ningbo, Zhejiang Province, China
  productSummary: Keyuan 销售一套一体化产品组合：精细化学品、工业清洗剂、SBS/TPE 和 ABS 相关材料，以及与可降解材料相邻的产品；服务工业制造和下游加工流程，而不是直接面向终端消费者。
  customerFocus: 工业制造商、贸易公司型分销商、下游加工渠道，以及轮胎、鞋履、电子清洗、包装和农膜等下游行业。
  businessModel: 资本密集型 B2B 制造和材料供应模式，增长靠装置吞吐、原料一体化、渠道关系和应用认证拉动，而不是靠软件式经常性合同。
  stage: Series D
  fundingStatus: 公开可见融资从 2019 年市场化融资，经 B 轮、B+ 轮和 C 轮，推进到 2025 年 2 月由 Shanghai Fosun High-Tech 支持、估值 8.0 billion yuan 的 D 轮首次交割。
