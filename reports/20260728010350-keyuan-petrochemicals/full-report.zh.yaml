      - number: '4.3'
        title: 融资、关联方财务压力和结论
        blocks:
          - type: paragraph
            body: >-
              Keyuan 的资本历史显示公司反复获得资金，但公开披露水平还不足以让外部人干净判断当前资金是否充足。历史 SEC 文件记录了 2010 年春季约 USD 26.2 million 融资，以及 2010 年 9
              月 USD 20.25 million 融资。较新的媒体报道把失败的 2019 年 A 股借壳尝试，串到后续 A/B/B+/C/D 轮私募融资，并最终在 2025 年 2 月由 Fosun 支持、估值 RMB
              8.0 billion 的 D 轮首次交割。这足以证明持续融资能力；但不足以证明当前账上现金、月度消耗或契约余量。


              关联方证据补上了部分图景，也让风险更尖锐。Changhong 2025
              年分析显示，收入增长同时转为亏损，经营现金流为负，且因项目投资和营运资金借款导致财务费用明显上升。投资人应该预期，这正是规模化工业材料平台会出现的模式：真实资产和增长雄心并存，但融资强度、毛利压力和执行风险也并存。因此，公开财务结论是平衡但谨慎的。Keyuan
              可能有足够产业实质吸引资本并追求增长，但公开数据在现金、债务和当前单线经济性上仍过于不完整，投资人很难有把握地为业务定价。这足以写成一份警示性尽调备忘录，但不足以支撑高确信投资判断。
