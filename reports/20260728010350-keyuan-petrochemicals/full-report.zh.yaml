  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格背景与可比公司视角
        blocks:
          - type: paragraph
            body: >-
              对一家私营工业企业来说，当前公开价格背景异常清楚。China Daily 称 Keyuan 在胡润 2026 榜单中估值 75 亿元人民币；36Kr、DoNews 和 Eastmoney 都指向 2025 年 2
              月 D 轮首关的 80 亿元人民币估值。表面看，相对于已披露收入基数，这些估值锚点并不离谱：按 36Kr 收入数据，2022 年收入对应约 0.7x 销售额，按 2023 年年化 run-rate 则约
              1.0x。这不是软件倍数，更接近工业材料倍数。


              但可比组必须谨慎处理。Kingfa 是规模龙头，销售额倍数低于 1x，披露强得多；Hisun 和 Jindan 是体量更小的生物材料专业公司，交易倍数大约为 1.7x-1.9x 销售额；Changhong
              是最接近、且与生态相关的风险可比公司，尽管利润率弱、自由现金流为负，销售额倍数却更高。由此得出的结论不是 Keyuan
              应拿最高可比倍数，而是当前价格只有在投资者接受工业材料风险，并相信已披露收入和客户证明大体真实时才站得住。一旦任一前提变弱，可比论证会很快从支撑项变成惩罚项，因为上市同业已经说明，市场给不透明、带杠杆的材料公司留下的估值余地很小。
