      - number: '8.2'
        title: 投资逻辑、反向逻辑与情景区间
        blocks:
          - type: paragraph
            body: >-
              乐观叙事很直接。Keyuan 看起来确有工业规模、多条产品线、触达具名全球买家的客户相关性，以及可降解材料上的真实政策顺风。如果 2022-2023 年收入标记方向正确，且
              ABS/TPE/原料一体化确实支撑成本位置，那么当前区间附近的估值并不荒唐。市场无需相信 Keyuan 是无瑕的高溢价科技资产，75-80 亿元人民币也能说得通。


              反向逻辑同样强。公开数字可以看上去过关，但质量仍可能令人失望。SEC 案件、历史上分销占比较高的销售结构、当前股权结构细节缺位、母公司层面现金和债务 covenant 数据缺失，以及生态内利润率 /
              现金流承压证据，都指向谨慎。因此，情景区间比点估值更重要。熊市情景假设工业倍数压缩、披露薄弱持续；基准情景假设当前估值锚点大致公允；牛市情景则要求更好的披露、更干净的利润率，并证明可降解材料叙事能转化为持久、质量更高的盈利。
