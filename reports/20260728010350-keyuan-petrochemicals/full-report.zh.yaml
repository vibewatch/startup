        blocks:
          - type: paragraph
            body: >-
              最强的具名客户证据集中在一组媒体来源的说法中。36Kr 称 Keyuan 主要客户包括 Bridgestone、Adidas 和超过 50 家 Fortune Global 500 企业；OFweek
              重复了同一客户表述。这足够重要，应该保留在报告中，因为它指向真实终端市场适配，并且至少部分打入全球工业和消费供应链品牌。但这不等于有客户案例、工厂部署说明，或带有量化结果的直接参考账户。最合适的描述是“可信但偏薄”。


              因此，采用情况必须通过代理指标推断。历史 SEC
              披露显示，公司有重复订单规划、主要客户年度调查，以及很高的分销商占比。来自同业和标准机构的产品应用证据显示，可降解材料需求在商业上真实的地方包括购物袋、垃圾袋、农用地膜、模塑餐具、涂覆、纤维和各类下游加工流程。BBCA
              和 Star River 进一步展示了更丰富的下游证据可以是什么样子——官方指定供应商引用、客户案例或明确的应用价值页面。对照这个同业基准，Keyuan
              的客户证据足以否定“需求是虚构的”这种说法，但不足以确认当前客户基础到底有多深、多粘、多元。
