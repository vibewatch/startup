  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管和政策风险
        blocks:
          - type: paragraph
            body: >-
              最高置信度的法律风险是历史 SEC 执法案件。SEC
              指控的不是狭窄的技术性申报失误，而是未披露关联方交易、账簿和记录缺陷、内部控制崩塌，以及表外现金账户。这段历史重要，因为它改变了尽调中其他所有事项的基准线。除非管理层证明，投资人不能简单假设当前报告、现金管理和关联方纪律都是干净的。2010–2011
              年 SEC 时代记录还显示调查和退市压力；36Kr 又补充了后来失败的 A 股借壳尝试。这些事实都不能证明当下存在不当行为，但合在一起，会提高治理和披露在典型材料成长故事中应占的权重。


              政策风险是第二个主要法律监管问题。可降解材料叙事并不完全由市场拉动；它深受 NDRC、SAMR、MIIT
              和行业标识指引塑造。标准收紧、采购规则偏向合规产品时，这会创造上行；但它也让执行依赖监管、执法和标准合规。简而言之，Keyuan
              的增长假设部分是被监管塑造出来的，因此一次政策摇摆或合规失误，就可能很快伤害需求和投资人信心。
