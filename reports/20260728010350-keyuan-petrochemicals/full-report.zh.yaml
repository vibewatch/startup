  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层和采购结构
        blocks:
          - type: paragraph
            body: >-
              公开记录指向一个更工业、更由渠道中介的客户基础，而不是一个以 logo 展示为主的客户基础。Chemical HR 称，Keyuan 产品用于化工、印染、医药、食品、精密电子和光学。历史 SEC
              文件把这幅图描得更清楚：Keyuan 主要客户是长三角和珠三角的下游石化制造商和分销商。这一区分很重要：一部分“客户”是直接把 Keyuan 产品作为投入品的制造商，另一些则是中介关系的分销商。


              因此，采购结构看起来是分层的。在传统石化和弹性体用途中，买方可能是贸易公司或采购团队；用户是工厂、下游加工商或制造商；付款方仍可能位于价值链更下游。在可降解材料相关应用中，来自 Hisun、BBCA 和
              Tunhe 的公开基准页面展示了这种结构如何演化：包装加工商、农膜渠道、模塑制品制造商、纺织用户和出口目录都成为可能的客户类别。这不能证明 Keyuan
              今天服务每一类客户，但定义了投资人应该检验的采购地图。它也说明，如果 Keyuan 希望以材料平台叙事吸引成长资本，最终需要比今天可见内容更明确的客户界面。
