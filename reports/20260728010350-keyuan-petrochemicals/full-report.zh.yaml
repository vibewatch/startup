        - 施加集中度折价，并要求直客数据
      - - 供给过剩压缩利润率
        - PBAT / 生物材料利润率明显走弱
        - 公开或管理层数据表明毛利率持续侵蚀
        - 下调估值倍数，并收紧融资条款
      - - 安全或合规事件
        - 发生严重工厂事故或重大合规失误
        - 重大事故、停产、召回或标准测试未通过
        - 将论点重评为运营风险事件，而不是短期噪音
    notes: 这些终止标准把复杂工业风险翻译成可监测的投资触发项。
