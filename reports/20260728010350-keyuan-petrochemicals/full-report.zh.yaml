      - number: '2.3'
        title: 买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图很实际，也很工业。监管机构和标准机构定义应用类别，但直接经济买方通常是下游加工商、处理商或
              OEM，而不是家庭消费者。购物袋和垃圾袋的相关链条从树脂供应商到薄膜生产商，再到制袋加工商，最后到品牌零售商、市政机构或废弃物服务运营商。农用地膜看重农艺标准和地方执行，但商业决策路径仍穿过薄膜生产商、农资渠道和组织化种植者。注塑餐具或容器中，加工商和
              OEM 是用户及规格制定者，餐厅、餐饮服务分销商或品牌方则在更下游成为实际付款方。Hisun 的应用页面直接在树脂供应商层面列出注塑、吹塑、挤出、热成型、薄膜 / 涂覆和无纺等使用场景，让这个模式变得可见。


              这一点重要，因为采用不是纯消费者偏好市场。买方在监管合规、材料性能、加工经济性和认证风险之间权衡。CCFGroup 对 Changhong 的报道在这里尤其有用：它强调的不只是 PBAT 树脂，还有改性 PBAT
              产品和成品可降解袋，说明价值沿链条分配，也说明一体化玩家可以把转换成本从系统中拿掉。Keyuan
              自身关于原料一体化和降本的公开叙事与这个逻辑一致。因此，实际采用漏斗从政策和标准开始，进入加工商认证和采购，最后才到达下游品牌或机构采购。市场份额靠供应安全、可用产品牌号和面向加工商的成本经济性赢下，而不只是靠宏大的可持续叙事。
