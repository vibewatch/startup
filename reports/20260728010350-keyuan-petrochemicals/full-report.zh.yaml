  - id: FP002
    title: 工作流替代 / 多供应商地图
    type: matrix
    layout: wide
    summary: 该矩阵关注可能的客户切入方式和切换姿态，而不是重复 TP002 表的功能宽度。它展示同行更可能在哪些地方靠替代、捆绑或应用深度取胜。
    data:
      columns:
        - 典型切入方式
        - 高认证门槛细分场景强度
        - 大宗薄膜 / 袋类销量强度
        - 交叉销售 / 捆绑能力
        - 潜在客户多供应商风险
      rows:
        - label: Keyuan
          values:
            - label: 一体化工业供应商
              tone: neutral
              detail: 靠成本、原料逻辑和相邻 ABS/TPE 客户关系切入。
            - label: 中
              tone: neutral
              detail: 公开证据中的牌号深度弱于 PLA 专业厂商。
            - label: 高
              tone: positive
              detail: 后向一体化适配规模化薄膜和袋类经济性。
            - label: 中
              tone: neutral
              detail: 能把可降解材料与传统材料线连接起来。
            - label: 高
              tone: warning
              detail: 经销商式工业渠道可以支撑客户多供应商采购。
        - label: Hisun
          values:
            - label: 应用专业厂商
              tone: positive
              detail: 靠 PLA 牌号深度和可见应用页面竞争。
            - label: 高
              tone: positive
              detail: 专业细分场景里，认证和应用适配很关键。
            - label: 低-中
              tone: neutral
              detail: 公开证据中，以销量驱动的 PBAT 规模不明显。
            - label: 低
              tone: neutral
              detail: 组合窄于多元化龙头。
            - label: 中
              tone: warning
              detail: 规格重叠时，客户仍会按价格比较专业厂商。
        - label: Jindan
          values:
            - label: 上游丙交酯专业厂商
              tone: positive
              detail: 靠丙交酯到 PLA 链条和牌号多样性取胜。
            - label: 高
              tone: positive
              detail: 面向应用的 PLA SKU 带来认证深度。
            - label: 低
              tone: neutral
              detail: 公开证据更偏 PLA，而不是大规模 PBAT。
            - label: 低
              tone: neutral
              detail: 广泛交叉销售能力不如 Kingfa 或 Tunhe 明显。
            - label: 中
              tone: warning
              detail: 若客户认为 PLA 牌号可替代，就可以多源采购。
        - label: BBCA
          values:
            - label: 生物制造平台
              tone: neutral
              detail: 通过更广的生物材料生态和 R&D 品牌切入。
            - label: 中
              tone: neutral
              detail: 生物材料创新可见，但细化牌号证明较薄。
            - label: Unknown
              tone: warning
              detail: 公开证据未清楚披露 PBAT 销量强度。
            - label: 中
              tone: neutral
              detail: 平台结构能支撑更宽的客户对话。
            - label: 中
              tone: warning
              detail: 公开资料看不到客户账户层面的重叠。
        - label: Tunhe
          values:
            - label: 宽化学品类供应商
              tone: positive
              detail: 靠多种相邻化学品和可降解薄膜材料取胜。
            - label: 中
              tone: neutral
              detail: 宽于纯 PLA 专业厂商，但认证驱动特征不那么明显。
            - label: 高
              tone: positive
              detail: PBAT 及相关薄膜材料是核心公开用例。
            - label: 高
              tone: positive
              detail: 化学品跨度宽，支撑交叉销售。
            - label: 中
              tone: warning
              detail: 宽度有帮助，但大宗品细分市场仍可多供应商采购。
        - label: Kingfa
          values:
            - label: 规模龙头 / 捆绑销售方
              tone: positive
              detail: 可能通过更大的多材料客户关系切入。
            - label: 中
              tone: neutral
              detail: 并非以狭窄专业厂商形象对外宣传，但仍有生物材料深度。
            - label: 高
              tone: positive
              detail: 规模让大宗销量竞争更可信。
            - label: 很高
              tone: positive
              detail: 广组合和客户覆盖让捆绑成为真实威胁。
            - label: 中
              tone: warning
              detail: 捆绑能力降低流失，但部分买方仍可拆分采购量。
        - label: Changhong
          values:
            - label: PBAT 项目规模专业厂商
              tone: positive
              detail: 凭已投运 PBAT 规模和面向加工商的袋类逻辑切入。
            - label: 低-中
              tone: neutral
              detail: 公开证据对规模的支撑强于对高认证门槛细分场景的支撑。
            - label: 高
              tone: positive
              detail: 120kt 投运和 600kt 规划指向销量导向。
            - label: 中
              tone: neutral
              detail: 可受益于更广的 Keyuan 生态联系。
            - label: 中-高
              tone: warning
              detail: PBAT 薄膜牌号客户仍可能按价格和可得性比较。
    approximationNotes: 定性矩阵来自留存的公开定位证据。它描述获客姿态和潜在部署模式，而不是原始功能强度。
    claimRefs:
      - CP023
      - CP025
      - CP026
      - CP027
      - CP028
      - CP029
      - CP030
      - CP031
      - CP034
      - CP035
      - CP036
  - id: FP003
    title: 护城河 / 就绪度 KPI
    type: kpi
    layout: standard
    summary: 公开证据支持差异化竞争者原型，而不是单一主导护城河模板。
    data:
      items:
        - label: Keyuan 优势
          value: Integration + ABS/TPE adjacency
          detail: 最强公开优势看起来来自结构，而非品牌。
        - label: Hisun 优势
          value: PLA depth + certifications
          detail: 聚焦型专业厂商，牌号和应用可见。
        - label: Jindan 优势
          value: Lactide → PLA chain
          detail: 以上游路线切入 PLA 专业化。
        - label: BBCA 优势
          value: Bio-manufacturing platform
          detail: 更广工业生态，而非单一聚合物细分。
        - label: Tunhe 优势
          value: Chemistry breadth
          detail: PBAT/PBS/PBT/BDO/TPEE 覆盖多条工业路线。
        - label: Kingfa 优势
          value: Scale + account breadth
          detail: 多元化龙头，营收基数大得多。
        - label: 主要行业风险
          value: Commoditizing PBAT capacity
          detail: 在需求放缓之前，产能竞赛就可能先挤压利润率。
        - label: 主要尽调缺口
          value: Pricing visibility
          detail: 同行整体的公开 ASP 和折扣数据仍稀疏。
    approximationNotes: KPI 值是战略速记，不是数字排名。
    claimRefs:
