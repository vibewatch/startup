        - from: material_qualification
          to: converter_economics
        - from: converter_economics
          to: integrated_costdown
        - from: integrated_costdown
          to: downstream_order
        - from: policy_pull
          to: downstream_order
    approximationNotes: 该流程把价值链抽象成关键决策瓶颈，用来判断需求能否变成有利润的销量。
