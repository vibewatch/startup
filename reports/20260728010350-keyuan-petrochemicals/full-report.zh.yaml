      - number: '6.3'
        title: 耐久性、扩张和集中风险
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开客户故事中最弱的一环。SEC 文件称，Keyuan 按订单签采购合同，严重依赖分销商，并有明显集中度：2010 年前五大客户贡献 40% 销售额，2009 年则为
              71%。这不意味着当前业务同样集中，但说明公司历史上能够容忍何种客户风险结构。也就是说，即便业务此后显著增长，一部分终端客户可见度仍可能被中间商遮住。


              扩张上行存在，但仍更多是主题性而非已被证明。若 36Kr/OFweek 的说法方向准确，Bridgestone 和 Adidas
              暗示了进入轮胎、鞋履和品牌消费材料供应链的路径。电子清洗指向另一条路径。政策支持的可降解应用则在包装和农膜中创造更多可选项。然而，本次没有保留来源披露当前客户数、活跃站点、NRR、GRR、流失、续约率或合同期限。正确的尽调视角是，Keyuan
              显然拥有真实工业客户和可信扩张地图，但开放网络证据太薄，无法有把握地判断粘性或集中度改善。这一限制很重要，因为估值、融资结构和下行韧性都取决于这些关系能否可靠复现。
