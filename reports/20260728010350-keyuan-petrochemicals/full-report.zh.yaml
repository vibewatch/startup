      - number: '7.3'
        title: 缓释因素、披露缺口与否决条件
        blocks:
          - type: paragraph
            body: >-
              公开记录确实显示出一些缓释抓手。政策支持是真实的，流程一体化也可能有价值，竞争对手还证明，标准、认证和面向具体应用的产品开发能撑起更有韧性的市场位置。但这些只能部分缓释风险，因为最核心、仍未解开的风险是信息不透明。Hisun
              等上市同业披露诉讼、担保、年报、等级清单和 TDS 文件。BBCA 及相邻生物材料公司也把产品成熟度转化为可见的案例、奖项和应用故事。Keyuan 目前还没有给投资者同等的安心感。


              问题在于，披露薄并不是表面瑕疵。它直接决定投资者能否足够早地监控终止条件。如果当前关联方控制仍显混乱，如果可降解项目持续消耗现金却无法证明需求和利润率，或者供应商 /
              客户集中度仍结构性偏高，投资逻辑就应大幅弱化。因此，公开证据足以画出一张当前有效的风险图，也足以支撑高风险评级，但还不足以闭合最重要缓释措施的验证链。正因如此，本报告把信息缺口本身列为一线风险，而不是文书问题。管理层打开数据室之前，几项最重要的缓释因素仍只是前提假设，还不是经过验证的控制、审计数据，也不是能经受严肃长线投资者硬尽调的管理层陈述。
