  - id: FM004
    title: 采用漏斗 / 价值链地图
    type: flow
    layout: wide
    summary: 可降解材料的采用从政策认可开始，进入加工商认证、降本和下游采购；垂直一体化能减少摩擦。
    data:
      nodes:
        - id: policy_pull
          label: 政策拉动
          detail: 控塑规则和农膜推广创造底层需求。
        - id: material_qualification
          label: 材料认证
          detail: 标准、认证和应用测试决定加工商能否采用。
        - id: converter_economics
          label: 加工商经济性
          detail: 树脂成本、加工表现和可得性决定替代是否可行。
        - id: integrated_costdown
          label: 一体化降本
          detail: Changhong / Keyuan 等玩家靠上中游一体化守住利润率。
        - id: downstream_order
          label: 下游订单转化
          detail: 合规和成本可接受后，品牌、机构或经销商才会下采购订单。
      edges:
