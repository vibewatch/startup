  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围和客户任务
        blocks:
          - type: paragraph
            body: >-
              Keyuan 公开材料没有描述一个整洁的单一旗舰产品。它们描述的是一个工业平台，横跨清洗化学、弹性体 / 树脂供应和更绿色材料替代，解决多种客户任务。Chemical HR
              称，集团覆盖精细化工、热塑性弹性体、生物降解塑料和工程塑料；36Kr 和 DoNews 还补充了高等级溶剂、清洗剂、燃料油基精细化工产品等具体产品信号。放到工作流里看，Keyuan
              卖给的是需要流程化学品、特种树脂和适配制造线材料的工业买方，而不是购买品牌成品的终端消费者。


              同一批证据也显示，不同产品族的公开清晰度并不相同。最强的 Keyuan 具体证明落在工业清洗剂、石化加工、SBS/ABS 相关材料，以及可降解材料扩张这个大方向。最弱的证明落在 SKU
              层面。本次没有保留来源展示实时 Keyuan 牌号清单、可下载产品数据表库，或可与 PLA 专门厂商相比的产品性能看板。因此，投资人应该把 Keyuan
              的产品故事读成“可信的工业宽度，但当前产品表透明度有限”，而不是“应用牌号完全有文档支撑的专门厂商”。
