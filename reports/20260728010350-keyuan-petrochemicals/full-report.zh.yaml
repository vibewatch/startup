  - id: FI004
    title: 资本强度 / 现金流地图
    type: flow
    layout: wide
    summary: 资本强度通过融资轮次、项目 capex、借款增长，以及上市关联公司经营现金流转负的压力体现出来。
    data:
      nodes:
