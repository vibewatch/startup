  - id: FM003
    title: 买方 / 细分市场地图
    type: flow
    layout: wide
    summary: 经济买方通常是加工商或 OEM，下游品牌或机构在链条后段付款，政策则在早期塑造准入条件。
    data:
      nodes:
        - id: policy
          label: 政策 / 标准门槛
          detail: NDRC、MIIT 和 SAMR 设定使用场景合法性和应用标准。
        - id: resin
          label: 树脂供应商
          detail: PBAT / PLA / 一体化树脂制造商提供合格牌号和供应保障。
        - id: converter
          label: 加工商 / 处理商
          detail: 薄膜、袋类、涂层、模塑或无纺布加工商通常是直接买方。
        - id: brand
          label: 品牌 / 机构
          detail: 零售商、市政部门、种植者或餐饮服务运营商在下游为合规产品买单。
        - id: user
          label: 终端使用
          detail: 包装、农业、模塑制品或纤维应用是验证性能的环节。
      edges:
        - from: policy
          to: resin
        - from: resin
          to: converter
        - from: converter
          to: brand
        - from: brand
          to: user
        - from: policy
          to: brand
    approximationNotes: 该流程展示商业影响力，而非合同相对方关系，也不是每个场景通用的采购顺序。
