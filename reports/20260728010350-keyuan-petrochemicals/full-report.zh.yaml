      - number: '5.2'
        title: 制造架构和依赖
        blocks:
          - type: paragraph
            body: >-
              历史 SEC 文件和当前宁波简介一起描述了一套真实的工业流程栈。文件指向石化产能、储运装卸基础设施，以及一座 70,000 MT SBS 装置；Chemical HR
              则描述宁波基地二十多套装置，从预处理和裂解到芳烃抽提和 PSA 制氢。这个架构重要，因为它解释了为什么 Keyuan
              的差异化主张主要不是软件、纸面专利或品牌，而是工厂配置、原料处理，以及在多条产线之间调度物料的能力。


              后向一体化是另一项核心依赖。36Kr 称，Keyuan 的广西 ABS 及配套项目旨在内化 styrene 和 butadiene 供应，并把成本降低约 20%。CCFGroup 对 Changhong PBAT
              链条的报道显示，可降解材料中也有类似逻辑：把树脂、改性材料和成品袋放在一条链上运行，从系统中拿掉转换成本。如果 Keyuan
              真的能把石化侧和可降解材料侧在经济性上接起来，这会给它一个可信的工业优势。但这也意味着，公司深度依赖原料获取、工厂执行和资本开支纪律。产品离不开制造它的流程。
