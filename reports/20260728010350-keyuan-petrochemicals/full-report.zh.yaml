      - number: '2.2'
        title: 规模测算视角和产能现实
        blocks:
          - type: paragraph
            body: >-
              最好的公开规模证据来自产能和梯队，而不是干净的收入 TAM 算术。Qianzhan 2025 年摘要称，PLA 和 PBAT 合计占中国生物降解塑料产能超过 80%；PBS 占 13.1%；PBAT 产能从
              2021 年约 340 thousand tons，加速到 2022 年 640 thousand tons、2023 年 1.37 million
              tons。这些数据同时确认了需求牵引和品类核心风险：即便监管仍支持，产能扩张速度也足以让市场偏向供给过剩。竞争者方面，Kingfa 以约 15% 领跑 PBAT 份额，Changhong High-Tech 和
              Blue Ridge Tunhe 约为 9%；PLA 领先者是 Jindan 和 BBCA，产能在 100 thousand tons 以上，其后是 Hisun 等约 50-thousand-ton 梯队。


              这会影响投资人如何框定 Keyuan 的机会。产能视角说明市场真实、政策托底，并且大到足以容纳多个规模玩家。但这个视角本身并不告诉我们实际价格、毛利韧性，或 Keyuan 能赢下哪些子赛道。Hisun 官方披露和
              BPI 产品清单展示了比保留 Keyuan 来源更成熟的 PLA 应用和认证栈；Changhong 的 PBAT 项目也比任何公开 Keyuan 独立市场材料更清楚地呈现成本链条。因此，Keyuan
              的正确市场视角必须受约束：它处在一个快速放大但竞争日益激烈的国内供给建设周期中，空间足以容纳认真玩家，但证据不足以支撑一个简单的自上而下 TAM 到份额故事。
