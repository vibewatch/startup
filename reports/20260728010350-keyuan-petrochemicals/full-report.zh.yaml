  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和 Keyuan 真正可计入的范围
        blocks:
          - type: paragraph
            body: >-
              尽调用的相关市场，应该比“所有可持续材料”更窄，也比“某一家石化工厂销售 PBAT”更宽。保留的政策和行业来源显示，至少有三块机会区相互重叠。第一块是中国的生物降解塑料替代推进，PBAT 和 PLA
              主导当前产能，购物袋、垃圾袋、农用地膜、涂覆、注塑餐具和发泡等应用获得监管明确认可。第二块是面向下游加工商的材料市场，覆盖薄膜、涂覆、吹塑、注塑和无纺 /
              纤维应用，买方是包装加工商、工业加工企业和采购团队，而不是零售终端消费者。第三块是 Keyuan 自身的一体化特种化学品基地，SBS、ABS 以及相邻热塑性和石化业务可以与可降解材料扩张共享原料、客户和降本逻辑。


              哪些范围应该排除？证据不足以支持把整个全球循环材料市场、一般塑料需求或所有 PLA 终端用途都算作 Keyuan 的可服务市场。Hisun 网站显示 PLA 能触达 3D
              打印和特种热成型等差异化应用类别，但保留的 Keyuan 具体记录在工业化学、一体化树脂、薄膜和袋类经济性、下游加工商关系上更强，在特种消费 PLA
              应用上更弱。因此，最站得住脚的边界是“中国为中心的生物降解塑料及相邻特种材料需求，Keyuan 可借助石化一体化、膜 / 袋应用和工业客户关系撬动”，而不是包罗万象的全球可持续材料 TAM。
