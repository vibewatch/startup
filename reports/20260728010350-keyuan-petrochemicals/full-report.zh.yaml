      - CP020
      - CP027
      - CP028
      - CP029
      - CP031
      - CP034
      - CP035
  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: 历史公开证据显示，交易型工业收入模型从原料采购流向生产、经销商为主的销售、交付和现金回款。
    data:
      nodes:
        - id: feedstock
          label: 原料采购
          description: 重油、燃料油等原材料驱动成本基础和价格敏感度。
        - id: processing
          label: 工业加工
          description: 一体化化学品、ABS/SBS/TPE 和可降解相邻生产把原料转成可销售产品。
        - id: channel
          label: 经销商 / 直销渠道
          description: 历史上 Keyuan 主要通过贸易公司经销商销售，也有部分工业直销。
        - id: delivery
          label: 交付与风险转移
          description: 历史收入在交付且所有权和风险转移时确认。
        - id: cash
          label: 现金回款 / 票据融资
          description: 多数客户预付款，但应收票据和偿付风险仍占用营运资本。
      edges:
        - from: feedstock
          to: processing
        - from: processing
          to: channel
        - from: channel
          to: delivery
        - from: delivery
          to: cash
    approximationNotes: 这主要基于历史 SEC 披露，仍需用当前业务组合验证。
    claimRefs:
      - CI012
      - CI013
      - CI015
      - CI018
      - CI019
  - id: FI002
    title: 单位经济性桥
    type: flow
    layout: standard
    summary: 公开单位经济性证据显示，利润率更受原料、渠道组合、集中度和融资结构牵引，而不是简单的销量增长。
    data:
      nodes:
        - id: input
          label: 原材料成本
          description: 原料波动和供应商集中度塑造利润率。
        - id: conversion
          label: 转化效率
          description: 30-day 周期和一体化工厂运转顺畅时，可守住经济性。
        - id: channel_mix
          label: 渠道与付款组合
          description: 经销商占比、预付款和信用例外影响营运资本。
        - id: finance_tools
          label: 应收 / 应付票据
          description: 贸易融资工具提高灵活性，也增加流动性机制。
        - id: margin
          label: 毛利率与现金转化
          description: 披露的利润率信号必须与实际产品线经济性对齐。
      edges:
        - from: input
          to: conversion
        - from: conversion
          to: channel_mix
        - from: channel_mix
          to: finance_tools
        - from: finance_tools
          to: margin
    approximationNotes: 定性处理，因为当前产品级利润率未公开披露。
    claimRefs:
      - CI014
      - CI016
      - CI017
      - CI019
      - CI020
      - CI032
      - CI035
