      - number: '3.4'
        title: 护城河韧性和商品化风险
        blocks:
          - type: paragraph
            body: >-
              这个行业最重要的竞争张力，在产品牌号防御力和产能驱动的商品化之间。防御力一侧，Hisun 和 Jindan 表明，应用级 PLA 专长、认证可见度和有针对性的树脂族仍然重要。产能驱动一侧，Qianzhan 的
              PBAT 份额数据和 Changhong 风险分析指向一个市场：越来越多产能会追逐相似的袋类和薄膜需求，即便环保政策仍支持，毛利也会被压缩。Tunhe 的化学宽度和 Keyuan
              的原料一体化逻辑，都试图用结构性成本优势而不是纯差异化来解决这个问题。


              因此，Keyuan
              的护城河不太可能是经典软件式切换护城河。它更可能是一条混合工业护城河：原料经济性、一体化工厂设计、连接石化和可降解材料的能力，以及选择性应用能力。这在部分客户分层中可以耐久；但如果业务滑向差异不大的 PBAT
              放量，太多玩家都能提出相似主张，护城河就会变薄。竞争结论因此是平衡的：仍有值得防守的细分机会，但 Keyuan 必须证明自己不只是拥挤赛道里的又一个产能建设项目。
