      - number: '8.3'
        title: 建议与尽调要求
        blocks:
          - type: paragraph
            body: >-
              仅基于公开信息，建议不应直接给出买入。公司真实到不该忽视，但也不透明到无法有把握定价。重要的是，当前并不是估值已明显补偿信息缺口的情形；公开估值已经处在一个区间，投资者若要按今天的标题价格出资，需要事实支撑，而不能只靠合理性。合适的中间立场是公允估值：如果收入基数和工业逻辑成立，75-80
              亿元人民币可能合理；但当前披露不足，使债务、治理或客户持久性出现意外时没有安全边际。因此，继续研究比回避更合适，因为这个故事仍有足够的工业和政策实质，值得做更深尽调。


              什么会改变判断？母公司层面清晰披露现金和债务、股权结构和优先权条款透明、客户留存证据、当前产品线利润率，都可能上调建议。相反，任何新的控制薄弱迹象、项目烧钱却没有市场吸收，或当前客户证明比标题暗示的更浅，都会把立场推向回避。换句话说，今天的
              Keyuan 不是否定项，但对全球公开市场投资者来说，也不是干净的肯定项。
