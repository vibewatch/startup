        title: 营运资金、单位经济性和控制历史
        blocks:
          - type: paragraph
            body: >-
              历史 SEC 文件特别有用，因为它把收入线背后的机制暴露出来。文件称，公司保持约 30-day 的原料到销售周期，严重依赖分销商，客户和供应商集中。2010 年前五大客户贡献 40% 销售额，前三大供应商贡献
              61% 原料采购额。应收票据和应付票据是营运资金管理的活跃组成部分，2010 年末需承担追索偿还责任的已贴现应收票据约 USD 9.2
              million。这些特征重要，因为它们描述的是一门对原料波动、渠道议价权和贸易融资管道敏感的生意。换句话说，即使先不看今天的可降解材料故事，遗留财务模型也已经更像一门营运资金和执行敏感的工业业务，而不是简单的大宗品价差交易。


              负面一侧同样重要。SEC
              执法公告意味着，投资人不能默认历史财务控制问题已经解决。关联方披露失败、账簿和记录薄弱，以及表外现金账户，对资本密集型工业公司来说都不是小技术瑕疵。即便今天的运营规模更大、更成熟，这段历史也会抬高对当前控制、关联方往来和现金管理的举证要求。
