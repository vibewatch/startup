      - number: '2.4'
        title: 增长驱动、约束和仍未知的部分
        blocks:
          - type: paragraph
            body: >-
              需求逻辑足够真实，但还没强到可以无视执行风险。显而易见的增长驱动包括国家限塑政策、农膜替代、更广泛的标准化，以及大型既有企业建设专门生物材料平台的意愿。NDRC、SAMR 和 MIIT
              都指向同一方向：生物降解和生物基材料仍是中国工业与环保政策框架内获得战略支持的品类。竞争者行为也强化了这一点。Hisun 持续披露产能和应用；Kingfa 把生物降解塑料视为主要产品族；Changhong
              已经投产 PBAT 产能，并规划了大得多的产业园。


              约束同样重要。Changhong 2026 年分析提示了 PBAT
              供给过剩风险、原料成本波动、政策执行风险、项目延误和盈利压缩。公开价格披露也很弱。保留来源在品类、产能和政策架构上很强，但在实际销售价格、产品级贡献利润率，以及 Keyuan 可捕获的确切 SAM 和 SOM
              上很弱。这意味着市场只有通过情景视角才可投资：政策支持和下游加工商需求创造增长空间，而大宗品敞口和产能竞赛让销量增速快于利润的概率真实存在。严肃投资人应该保留这些矛盾，而不是把它们压成一页漂亮的 CAGR
              幻灯片。
