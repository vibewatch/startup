      "id": "growth-drivers-constraints-and-what-is-still-unknown",
      "title": "Growth drivers, constraints, and what is still unknown",
      "body": "The demand case is strong enough to be real but not strong enough to ignore execution risk. The obvious growth drivers are national anti-plastic policy, agricultural-film substitution, broader standardization, and the willingness of larger incumbents to build dedicated biomaterial platforms. NDRC, SAMR, and MIIT all point in the same direction: biodegradable and bio-based materials remain strategically supported categories inside China’s industrial and environmental policy framework. Competitor behavior reinforces that point. Hisun continues to disclose capacity and applications; Kingfa treats biodegradable plastics as a major product family; Changhong has already commissioned PBAT capacity and mapped out a much larger industrial park.\n\nThe constraint case is equally important. Changhong’s 2026 analysis flags oversupply risk in PBAT, raw-material cost volatility, policy-execution risk, project delays, and profitability compression. Public pricing is also weakly disclosed. The retained sources are excellent on categories, capacity, and policy architecture, but poor on realized selling prices, product-level contribution margins, or the exact SAM and SOM that Keyuan can capture. That means the market is investable only through a scenario lens: policy support and converter demand create room for growth, while commodity exposure and capacity races create a real chance that volume expands faster than profits. A serious investor should preserve those contradictions instead of turning them into a single neat CAGR slide.",
