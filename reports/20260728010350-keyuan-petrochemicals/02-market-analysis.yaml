      "id": "market-boundary-and-relevant-opportunity",
      "title": "Market boundary and what actually counts for Keyuan",
      "body": "For diligence purposes, Keyuan’s relevant market should be defined more narrowly than “all sustainable materials” and more broadly than “one petrochemical plant sells PBAT.” The retained policy and industry sources show at least three overlapping opportunity zones. First is China’s biodegradable-plastics substitution push, where PBAT and PLA dominate current capacity and where applications such as shopping bags, garbage bags, agricultural mulch film, coating, injection-molded tableware, and foam are explicitly recognized by regulators. Second is the converter-facing materials market around films, coating, blow molding, injection molding, and nonwoven/fiber applications, where buyers are packaging converters, industrial processors, and procurement teams rather than retail end consumers. Third is Keyuan’s own integrated specialty-chemicals base, where SBS, ABS, and adjacent thermoplastic and petrochemical businesses can share feedstocks, customers, and cost-down logic with degradable-material expansion.\n\nWhat should be excluded? The evidence does not justify using the whole global circular-materials market, general plastics demand, or every PLA end use as Keyuan’s addressable market. Hisun’s site shows that PLA reaches differentiated application categories such as 3D printing and specialty thermoforming, but the retained Keyuan-specific record is stronger on industrial chemistry, integrated resins, film-and-bag economics, and downstream converter relationships than on specialty consumer PLA applications. The most defensible boundary is therefore “China-centered biodegradable plastics and adjacent specialty-material demand where Keyuan can leverage petrochemical integration, film/bag applications, and industrial customer relationships,” not a catch-all global sustainability TAM.",
