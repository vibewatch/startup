    {
      "id": "sizing-lenses-and-capacity-reality",
      "title": "Sizing lenses and capacity reality",
      "body": "The best public sizing evidence is capacity-based and tier-based rather than clean revenue TAM math. Qianzhan’s 2025 summary says PLA and PBAT together represent more than 80% of China’s biodegradable-plastics capacity, with PBS at 13.1% and PBAT capacity accelerating from roughly 340 thousand tons in 2021 to 640 thousand tons in 2022 and 1.37 million tons in 2023. Those data points confirm both demand traction and the central risk of the category: capacity is racing ahead quickly enough that the market can become supply-heavy even while regulation remains supportive. On the competitor side, Kingfa led PBAT share at around 15%, while Changhong High-Tech and Blue Ridge Tunhe were around 9%, and PLA leadership sat with Jindan and BBCA above 100 thousand tons, followed by players like Hisun around the 50-thousand-ton tier.\n\nThat matters for how investors should frame Keyuan’s opportunity. A capacity lens tells us the market is real, policy-backed, and large enough to support multiple scale players. It does not, however, by itself tell us realized price, margin durability, or which subsegments Keyuan can win. Hisun’s official disclosures and BPI product listings show a more mature PLA application and certification stack than the retained Keyuan sources do, while Changhong’s PBAT project gives clearer cost-chain visibility than any public Keyuan standalone market deck. The right market lens for Keyuan is therefore constrained: it sits inside a fast-scaling but increasingly competitive domestic supply build-out, with enough room for a serious player but not enough evidence to underwrite a simplistic top-down TAM-to-share story.",
