    "number": 2,
    "title": "Market Analysis",
    "summary": "Keyuan’s market is not one monolithic “green materials” TAM but a set of adjacent China-centered specialty-material markets led by PBAT and PLA substitution, petrochemical-cost competition, and converter-led application economics. Public evidence supports a strong policy tailwind and rapidly expanding capacity, but it also shows oversupply and pricing-opacity risk, making capacity-based and application-based sizing more defensible than broad revenue TAM claims."
