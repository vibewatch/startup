companyProfile:
  summary: >-
    Keyuan Petrochemicals is a Ningbo-based private industrial materials platform whose public footprint spans fine
    chemicals, thermoplastic elastomers, ABS-linked upstream integration, and biodegradable-plastics expansion through
    affiliated assets. Retained evidence supports real scale: multi-billion-renminbi reported revenue history, large
    process infrastructure, named customer proof that reaches global buyers, and repeated institutional financing
    culminating in a 2025 Fosun-backed D-round first close. The underwriting challenge is not whether a business exists,
    but whether investors can trust the quality of that business enough at the current price when governance scars,
    capital intensity, and current parent-level disclosure remain unresolved.
  foundingLocation: Ningbo, Zhejiang Province, China
