  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Keyuan’s heaviest residual risks cluster around legacy governance, hazardous operations, capital intensity, and
      customer/supplier opacity.
    claimRefs:
      - CR001
      - CR007
      - CR013
      - CR020
      - CR027
      - CR040
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Legacy governance / related-party risk
          values:
            - label: medium
              tone: warning
              detail: Historical fact pattern is proven, even if current state is unknown.
            - label: critical
              tone: negative
              detail: Could destroy trust, financing, and exit options quickly.
            - label: weak-public
              tone: risk
              detail: Little current parent-level evidence of mitigations is public.
            - label: high
              tone: negative
              detail: Residual exposure stays elevated until current controls are verified.
        - label: Hazardous-operations / safety risk
          values:
            - label: medium
              tone: warning
              detail: Complex units and hazardous inputs create non-trivial incident probability.
            - label: high
              tone: negative
              detail: One serious incident can hit people, production, and regulators at once.
            - label: medium
              tone: neutral
              detail: Industrial operators have routines, but Keyuan-specific public KPI visibility is weak.
            - label: high
              tone: negative
              detail: Residual exposure remains high without incident data.
        - label: Capital-intensity and project risk
          values:
            - label: medium-high
              tone: warning
              detail: Large projects and borrowing are already visible in the ecosystem proxy.
            - label: high
              tone: negative
              detail: Mis-executed projects can absorb cash before proving revenue or margin.
            - label: low-medium
              tone: warning
              detail: No public parent-level run-rate control pack is retained.
            - label: high
              tone: negative
              detail: Residual severity is elevated until cash and capex controls are visible.
        - label: Customer / supplier concentration opacity
          values:
            - label: medium-high
              tone: warning
              detail: Historical concentration and distributor dependence are explicit.
            - label: high
              tone: negative
              detail: Loss of one key channel or supplier could move results sharply.
            - label: low
              tone: risk
              detail: Current diversification evidence is not public.
            - label: high
              tone: negative
              detail: Residual exposure remains high until current mix is known.
