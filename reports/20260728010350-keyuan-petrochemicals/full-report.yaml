        title: Revenue model and public scale
        blocks:
          - type: paragraph
            body: >-
              The retained source set supports a broad revenue-model picture but not a fully reconciled current
              financial pack. Historical SEC filings show a business built around petrochemical product sales with
              written sales agreements, delivery-based revenue recognition, and pricing anchored to market conditions
              rather than to recurring subscription-style contracts. The same filing says most historical customers paid
              in advance, although core customers could receive credit, and that 86% of sales flowed through
              trading-company distributors. That structure is consistent with a transactional industrial business where
              logistics, feedstock, and market timing matter more than software-style locked-in recurring revenue.


              Recent third-party coverage upgrades the scale story dramatically. 36Kr and OFweek report revenue of RMB
              8.555 billion in 2020, 4.847 billion in 2021, 11.125 billion in 2022, and 5.703 billion for the first
              three quarters of 2023, with a 2023 gross margin of 18.7%. Those are meaningful numbers, but they remain
              media-mediated rather than current audited group disclosures. The prudent read is that Keyuan has real
              industrial revenue scale, but investors should not mistake that for clean disclosure on current segment
              mix, revenue quality, or line-by-line profitability.
