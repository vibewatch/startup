          detail: Buyer checks performance, application class, and compliance fit for the intended process.
        - label: Supply and conversion match
          detail: Supplier must deliver consistent material while supporting converter or plant process economics.
        - label: Production deployment
          detail: >-
            Material is run through electronics cleaning, tire / footwear, bag film, molding, or agricultural
            applications.
        - label: Performance and reorder
          detail: Outcome is judged on yield, safety, compliance, and cost before repeat orders or scale-up.
      edges:
        - from: Industrial process or material need
          to: Material qualification
          label: specification and use-case fit
        - from: Material qualification
          to: Supply and conversion match
          label: price + performance + availability
        - from: Supply and conversion match
          to: Production deployment
          label: qualified material into line
        - from: Production deployment
          to: Performance and reorder
          label: yield + compliance + economics
    approximationNotes: This is a generalized industrial workflow derived from retained sources, not a single documented customer SOP.
