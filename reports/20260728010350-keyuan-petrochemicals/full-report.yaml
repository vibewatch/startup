      - number: '7.3'
        title: Mitigations, disclosure gaps, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The public record does show some mitigation levers. Policy support is real, process integration can be
              valuable, and competitors demonstrate that standards, certifications, and application-specific product
              development can produce more resilient market positions. But those are only partial mitigants because the
              central unresolved risk is opacity. Listed peers such as Hisun publish disclosure surfaces covering
              litigation, guarantees, annual reports, grade lists, and TDS files. BBCA and adjacent biomaterials players
              also turn product maturity into visible case studies, awards, and application stories. Keyuan does not
              currently give investors the same comfort.


              That matters because disclosure thinness is not cosmetic. It directly affects whether investors can
              monitor kill criteria early enough. The thesis should weaken sharply if current related-party controls
              still look messy, if degradables projects consume cash without proving uptake and margin, or if supplier /
              customer concentration remains structurally high. The public evidence is therefore enough to establish a
              live risk map and enough to justify a high risk rating, but not enough to close the loop on the most
              important mitigations. That is why this report treats information gaps themselves as a top-tier risk
              rather than a housekeeping issue. Until management opens the data room, several of the most important
              mitigants remain assumptions rather than validated controls, audited data, and management representations
              that can survive hard diligence scrutiny from serious long-term investors.
