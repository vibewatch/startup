  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price context and comparable-company lens
        blocks:
          - type: paragraph
            body: >-
              The current public price context is unusually clear for a private industrial company. China Daily says
              Keyuan was worth 7.5 billion yuan in Hurun’s 2026 list, while 36Kr, DoNews, and Eastmoney all point to an
              8.0 billion yuan valuation in the February 2025 D-round first close. On the surface, those marks do not
              look wildly aggressive relative to the reported revenue base: 36Kr’s revenue figures imply something
              around 0.7x sales on 2022 revenue or roughly 1.0x on an annualized 2023 run-rate. That is not a software
              multiple. It is closer to an industrial materials multiple.


              But the comp set has to be handled carefully. Kingfa is the scale incumbent with a sub-1x sales ratio and
              much stronger disclosure, Hisun and Jindan are smaller biomaterials specialists trading around roughly
              1.7x-1.9x sales, and Changhong is the closest ecosystem-linked risk comp but trades at a higher sales
              ratio despite weak margins and negative free cash flow. The lesson is not that Keyuan deserves the highest
              comp multiple; it is that the current price can be defended only if investors accept industrial-materials
              risk and believe the reported revenue and customer proof are broadly real. If either of those premises
              weakens, the comp argument shifts quickly from supportive to punitive because public peers already show
              how little margin the market gives opaque, leveraged materials names.
            claimRefs:
              - CV001
              - CV002
              - CV004
