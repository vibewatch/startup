  - id: FO001
    title: Company snapshot logic
    type: flow
    layout: wide
    summary: >-
      Keyuan links legacy petrochemical assets, multi-base operations, affiliate biodegradable-material expansion, and a
      refreshed late-stage financing story.
    data:
      nodes:
        - id: n1
          label: Ningbo industrial root
          description: Operating lineage starts from the Ningbo petrochemical base rather than from a new venture shell.
        - id: n2
          label: Diversified chemicals platform
          description: >-
            Fine chemicals, TPE, engineering plastics, and biodegradable materials sit inside one broader industrial
            group.
        - id: n3
          label: Multi-base manufacturing footprint
          description: Ningbo, Shengzhou, Fangchenggang, Hezhou, and new project sites create national industrial reach.
