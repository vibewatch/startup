              it explains why Keyuan’s differentiation claim is not primarily software, patents-on-paper, or branding;
              it is plant configuration, feedstock handling, and the ability to route material across multiple lines.


              Backward integration is the other core dependency. 36Kr says Keyuan’s Guangxi ABS and supporting project
              was designed to internalize styrene and butadiene supply and reduce costs by about 20%. CCFGroup’s
              write-up on Changhong’s PBAT chain shows a similar logic in degradables: run resin, modified materials,
              and finished bags in one chain to take conversion cost out of the system. This gives Keyuan a plausible
              industrial advantage if it can actually connect the petrochemical side and degradables side economically.
              But it also means the business is deeply dependent on feedstock access, plant execution, and capex
