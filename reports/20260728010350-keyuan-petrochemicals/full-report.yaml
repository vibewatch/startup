              tolerated. It also means some end-customer visibility may remain obscured by intermediaries even if the
              business has grown materially since then.


              Expansion upside exists, but it is still more thematic than demonstrated. Bridgestone and Adidas, if the
              36Kr/OFweek claim is directionally accurate, imply pathways into tire, footwear, and branded
              consumer-material supply chains. Electronics cleaning points to another path. Policy-backed degradable
              applications create more optionality in packaging and agricultural film. Yet no retained source disclosed
              current customer count, active sites, NRR, GRR, churn, renewal rate, or contract duration. The right
              diligence view is that Keyuan clearly has real industrial customers and a plausible expansion map, but the
              open-web evidence is too thin to underwrite stickiness or concentration relief with confidence. That is a
