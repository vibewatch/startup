      - number: '7.2'
        title: Operational, dependency, and financial risk
        blocks:
          - type: paragraph
            body: >-
              The operating model itself adds significant risk. Chemical HR describes more than twenty process units and
              a large processing footprint, while the SEC file shows a working-capital-sensitive conversion cycle and
              concentrated customers and suppliers. This is not a low-fixed-cost asset-light business; it is an
              industrial system where feedstock, throughput, maintenance, and financing all interact. That means an
              outage, cost spike, or delayed project can hit production, margin, and liquidity at the same time.
              Changhong’s 2026 analysis is a useful public proxy for how this can look inside the broader ecosystem:
              margin pressure, retrofit-driven downtime, negative operating cash flow, higher finance expense, and
              explicit safety-production risk.


              Dependency risk compounds the problem. Historically, top customers and suppliers were concentrated, sales
              were distributor-heavy, and new growth appears linked to large projects and new capital. Policy
              dependence, capital-provider dependence, and raw-material dependence all sit on top of one another.
              Integration can mitigate some feedstock risk and improve cost position, but the same integration also
              amplifies project and financing risk if scale-up underperforms. The result is a business whose downside
              can cascade quickly if any one of those dependencies breaks at the wrong moment.
