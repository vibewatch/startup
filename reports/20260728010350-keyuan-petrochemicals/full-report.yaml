  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and direct peer set
        blocks:
          - type: paragraph
            body: >-
              The first diligence mistake would be to treat Keyuan as competing against only one kind of rival. Public
              sources point to at least four competitor categories. One is the PLA specialist cluster, represented here
              by Zhejiang Hisun and Jindan, where the competitive game revolves around resin grades, application range,
              certification, and product-fit depth. A second is the PBAT and degradable-film capacity cluster, where
              Changhong and Blue Ridge Tunhe show significant scale and converter-facing product portfolios. A third is
              the giant diversified-incumbent cluster, with Kingfa as the clearest example: a company that can sell
              biodegradable materials as one line item inside a much larger materials relationship. A fourth is the
              broader bio-manufacturing platform approach represented by BBCA, where biomaterials sit inside a larger
              biochemical and industrial ecosystem.


              Keyuan itself is awkward to place inside any single bucket. The 36Kr profile still describes it as an
              integrated fine-chemicals and ABS/SBS-oriented company using backward integration and scale economics, not
              as a pure-play PLA specialist. That means Keyuan’s direct overlap is strongest where cost integration and
              film/bag or industrial-material applications matter, and weaker where certification-heavy PLA niches
              matter more. The market therefore rewards investors who map overlap by application, route-to-market, and
              cost structure—not by who happens to appear together on a bioplastics market-companies list.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP024
              - CP036
