  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, regulatory, and policy risk
        blocks:
          - type: paragraph
            body: >-
              The highest-confidence legal risk is the historical SEC enforcement case. The SEC did not allege a narrow
              technical filing slip; it alleged undisclosed related-party transactions, books-and-records failures,
              internal-control breakdowns, and an off-balance-sheet cash account. That history matters because it
              changes the baseline for everything else in diligence. An investor cannot simply assume that current
              reporting, cash management, and related-party discipline are clean unless management proves it. The
              2010-2011 SEC-era record also shows investigation and delisting pressure, while 36Kr adds a later failed
              A-share backdoor attempt. None of those facts proves present-day misconduct, but together they raise the
              probability that governance and disclosure deserve heavier weighting than in a typical materials-growth
              story.


              Policy risk is the second major legal-regulatory issue. The degradables narrative is not purely
              market-pulled; it is heavily shaped by NDRC, SAMR, MIIT, and industry labeling guidance. That creates
              upside when standards tighten and purchasing rules favor compliant products, but it also creates execution
              dependence on regulation, enforcement, and standards compliance. In short: Keyuan’s growth thesis is
              partly regulated into existence, which means a policy wobble or compliance miss can damage both demand and
              investor confidence quickly.
