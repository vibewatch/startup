  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying structure
        blocks:
          - type: paragraph
            body: >-
              The public record points to a customer base that is more industrial and channel-mediated than
              logo-forward. Chemical HR says Keyuan’s products are used in chemicals, dyeing, pharmaceuticals, food,
              precision electronics, and optics. The historical SEC filing sharpens that picture by saying Keyuan’s main
              customers were downstream petrochemical manufacturers and distributors in the Yangtze River Delta and
              Pearl River Delta. That is an important distinction: some “customers” are direct manufacturers using
              Keyuan products as inputs, while many others are distributors that intermediate the relationship.


              The buying structure therefore looks layered. In legacy petrochemical and elastomer use cases, the buyer
              may be a trading company or procurement team; the user is a plant, converter, or manufacturer; and the
              payer can still sit further downstream in the value chain. In degradables-linked applications, public
              benchmark pages from Hisun, BBCA, and Tunhe show how this evolves: packaging converters, agricultural-film
              channels, molded-product manufacturers, textile users, and export catalogs all become plausible customer
              classes. That does not prove Keyuan serves each one today, but it does define the buying map any investor
              should test. It also suggests that if Keyuan wants to attract growth capital on a materials-platform
              narrative, it will eventually need a more explicit customer-surface than the one visible today.
