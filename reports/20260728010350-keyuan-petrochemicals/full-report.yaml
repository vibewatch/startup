      - number: '1.2'
        title: Capital history, controllers, and listed-affiliate links
        blocks:
          - type: paragraph
            body: >-
              The company’s present unicorn valuation rests on a financing ladder that only partially cleans up an
              unusually messy capital-markets backstory. 36Kr reports that Keyuan first entered U.S. markets through a
              2010 reverse merger with Silver Pearl, later privatized the U.S.-listed vehicle in 2017, attempted a 10.3
              billion yuan A-share backdoor transaction with Renzhi Shares in 2019, and then shifted into multi-step
              private fundraising. The same 36Kr account says Keyuan launched market-oriented financing in late 2019,
              raised a B round from Guangxi Guofu Innovation Fund in April 2020, a B+ round from Zhejiang Fuzhe Capital
              and Shenzhen Xinghe Holdings in August 2020, a 7.0 billion yuan C round from Shanghai Yongzheng in March
              2024, and then an 8.0 billion yuan D-round first close from Shanghai Fosun High-Tech in February 2025.
              DoNews and Eastmoney both corroborate the D-round headline and valuation step-up, which makes the
              2025-2026 unicorn narrative reasonably supportable even if the full cap table and preference stack remain
              private.


              Control and governance, however, are much less transparent than the financing chronology. The 2010 SEC
              filing identifies founders/controllers Tao Chunfeng, Wang Jicun, and Chen Peijun in the historical
              operating structure. Later public material emphasizes affiliated listed entities—especially Ningbo
              Changhong Polymer and Zhejiang Changhong Biomaterials—more clearly than it discloses a current group
              board, committee structure, or consolidated decision rights. That matters because much of the public
              evidence for current biodegradable-materials strategy flows through Changhong affiliate disclosures rather
              than through a standalone Keyuan investor-relations surface. Investors can see the capital ladder and
              industrial direction; they still cannot see a clean, current governance pack for the group-level decision
              architecture.
