      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is practical and industrial. Regulators and standards bodies define the application classes,
              but the immediate economic buyer is usually a converter, processor, or OEM rather than a household
              consumer. For shopping bags and garbage bags, the relevant chain runs from resin supplier to film producer
              to bag converter to branded retailer, municipality, or waste-service operator. For agricultural mulch
              film, agronomic standards and local implementation matter, but the commercial decision path still runs
              through film producers, agricultural-input channels, and organized growers. For injection-molded tableware
              or containers, converters and OEMs are the users and specifiers, while restaurants, food-service
              distributors, or brand owners become the effective payers further downstream. Hisun’s application pages
              make this pattern visible by listing categories such as injection, blow molding, extrusion, thermoforming,
              film/coating, and nonwoven use cases directly at the resin-supplier level.


              This matters because adoption is not a pure consumer-preference market. Buyers are balancing regulatory
              compliance, material performance, converter economics, and certification risk. CCFGroup’s Changhong
              write-up is especially useful here: it emphasizes not just PBAT resin but modified PBAT products and
              finished degradable bags, highlighting that value accrues across the chain and that integrated players can
              remove conversion cost from the system. Keyuan’s own public narrative of raw-material integration and cost
              reduction aligns with that logic. The practical adoption funnel therefore starts with policy and
              standards, moves into converter qualification and procurement, and only then reaches downstream brand or
              institutional purchasing. Market share is won through supply security, usable product grades, and
              cost-to-converter economics, not just through a broad sustainability narrative.
