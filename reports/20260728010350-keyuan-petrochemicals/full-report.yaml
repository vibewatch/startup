            body: >-
              Keyuan’s public materials do not describe a neat, single flagship product. Instead they describe an
              industrial platform that solves multiple customer jobs across cleaning chemistry, elastomer/resin supply,
              and greener material substitution. Chemical HR says the group spans fine chemicals, thermoplastic
              elastomers, biodegradable plastics, and engineering plastics, while 36Kr and DoNews add specific product
              signals such as high-grade solvents, cleaning agents, and fuel-oil-based fine-chemical products. In
              workflow terms, that means Keyuan is selling to industrial buyers who need process chemicals, specialty
              resins, and materials that fit manufacturing lines—not to end consumers buying a branded finished product.


              The same evidence also shows that public clarity differs by product family. The strongest Keyuan-specific
              proof sits around industrial cleaners, petrochemical processing, SBS/ABS-linked materials, and the broad
              idea of degradables expansion. The weakest proof sits at the SKU level. No retained source exposed a live
              Keyuan grade list, downloadable product datasheet library, or product-performance dashboard comparable to
              what PLA specialists show. Investors should therefore read Keyuan’s product story as “credible industrial
              breadth with limited current product-sheet transparency,” not as “fully documented application-grade
