      - number: '8.3'
        title: Recommendation and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The public-only recommendation should stop short of a buy call. The company is too real to ignore, but
              also too opaque to price with conviction. Importantly, this is not a case where the valuation clearly
              compensates for missing information; the public mark already sits in the part of the range where investors
              need facts, not just plausibility, to justify committing capital at today's headline price. A fair
              valuation stance is the right middle ground: the 7.5-8.0 billion yuan mark may be reasonable if the
              revenue base and industrial logic hold, but the lack of current disclosure leaves no margin of safety for
              surprises on debt, governance, or customer durability. Research-more therefore fits better than avoid,
              because the story still has enough industrial and policy substance to justify deeper work.


              What would change the view? Clear parent-level cash and debt disclosure, cap-table and preference
              transparency, customer-retention evidence, and current product-line margins could all move the
              recommendation upward. Conversely, any sign of renewed control weakness, project cash burn without market
              uptake, or evidence that current customer proof is shallower than the headline implies would push the
              stance toward avoid. In other words, Keyuan today is not a no, but it is not a clean yes either for public
              investors globally.
