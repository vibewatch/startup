            body: >-
              Keyuan’s capital history shows repeated access to funding, but not yet a public disclosure level that
              supports a clean view of current adequacy. The historical SEC filing records approximately USD 26.2
              million raised in spring 2010 and USD 20.25 million in September 2010. More recent media coverage maps a
              sequence from the failed 2019 A-share backdoor attempt into later A/B/B+/C/D private financing,
              culminating in a February 2025 Fosun-backed D-round first close at an RMB 8.0 billion valuation. That is
              enough to establish continued financing access. It is not enough to establish current cash on hand,
              monthly burn, or covenant headroom.


              Affiliate evidence fills part of the picture and sharpens the risk. Changhong’s 2025 analysis shows
              revenue growth paired with a swing to loss, negative operating cash flow, and materially higher finance
              expense because of project investment and working-capital borrowing. That is exactly the kind of pattern
              an investor should expect in a scale-up industrial materials platform: real assets and growth ambitions,
              but also financing intensity, margin pressure, and execution risk. The public financial verdict is
              therefore balanced but cautious. Keyuan likely has enough industrial substance to attract capital and
              pursue growth, yet public data remain too incomplete on cash, debt, and current line economics for
              investors to price the business with confidence. That is enough for a cautionary diligence memo, but not
