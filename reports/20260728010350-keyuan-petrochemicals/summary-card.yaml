  topStrengths:
    - >-
      Public sources support real industrial scale: multi-base operations, significant reported revenue, and a customer
      narrative that reaches named global buyers rather than only anonymous domestic demand.
    - >-
      Keyuan’s platform combines fine chemicals, elastomer and ABS integration, and degradables-linked optionality,
      giving it more strategic breadth than a single-product biomaterials startup.
    - >-
      The current public valuation range of 7.5-8.0 billion yuan is not obviously extreme against the reported revenue
      base and sits within a plausible public-comps bracket for industrial materials businesses.
  topRisks:
    - >-
      Legacy governance scars from the SEC case materially raise the diligence burden on current related-party,
      cash-control, and disclosure quality questions.
    - >-
      The business is capital intensive and hazardous-operations heavy, so project delays, safety events, or financing
      strain could transmit into margin, liquidity, and valuation quickly.
    - >-
      Current parent-level disclosure on cash, debt, cap table, customer durability, and product-line economics is too
      thin to support conviction underwriting at the current mark.
  unresolvedGaps:
    - >-
      Current cap table, liquidation preferences, and dilution structure from the 2024-2025 financing rounds remain
      undisclosed in retained public sources.
    - >-
      Current parent-level cash, debt, covenant, and project-finance obligations are not publicly visible enough to
      underwrite downside resilience.
    - >-
      Public sources do not disclose current customer count, retention behavior, or top-account concentration for the
      present private-company perimeter.
    - >-
      Keyuan does not publicly expose the product-grade, quality, and plant KPI package that would let engineers or
      investors validate operational quality directly.
