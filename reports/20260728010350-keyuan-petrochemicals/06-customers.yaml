    {
      "id": "durability-expansion-and-concentration-risk",
      "title": "Durability, expansion, and concentration risk",
      "body": "Durability is the weakest link in the public customer story. The SEC filing says Keyuan entered purchase contracts on an order-to-order basis, relied heavily on distributors, and had meaningful concentration—40% of 2010 sales from the top five customers, up from 71% in 2009. That does not mean the current business is equally concentrated, but it does show what sort of customer-risk structure the company historically tolerated. It also means some end-customer visibility may remain obscured by intermediaries even if the business has grown materially since then.\n\nExpansion upside exists, but it is still more thematic than demonstrated. Bridgestone and Adidas, if the 36Kr/OFweek claim is directionally accurate, imply pathways into tire, footwear, and branded consumer-material supply chains. Electronics cleaning points to another path. Policy-backed degradable applications create more optionality in packaging and agricultural film. Yet no retained source disclosed current customer count, active sites, NRR, GRR, churn, renewal rate, or contract duration. The right diligence view is that Keyuan clearly has real industrial customers and a plausible expansion map, but the open-web evidence is too thin to underwrite stickiness or concentration relief with confidence. That is a meaningful limitation because valuation, financing structure, and downside resilience all depend on whether these relationships recur reliably.",
