    {
      "id": "named-customer-proof-and-adoption-proxies",
      "title": "Named customer proof and adoption proxies",
      "body": "The strongest named customer proof is concentrated in one media-sourced claim set. 36Kr says Keyuan’s main customers include Bridgestone, Adidas, and more than 50 Fortune Global 500 enterprises; OFweek repeats the same customer statement. That is meaningful enough to keep in the report because it indicates real end-market fit and at least some penetration of global industrial and consumer-supply-chain names. But it is not the same thing as having customer case studies, plant deployment notes, or direct reference accounts with quantified outcomes. The evidence is best described as “credible but thin.”\n\nAdoption must therefore be inferred through proxies. Historical SEC disclosure shows repeat order planning, annual surveys of major customers, and a high distributor share. Product-application evidence from peers and standards bodies shows where degradable-material demand is commercially real: shopping bags, garbage bags, agricultural mulch film, molded tableware, coatings, fibers, and various converter workflows. BBCA and Star River go further by showing what richer downstream proof can look like—official designated-supplier references, customer cases, or explicit application-value pages. Against that peer benchmark, Keyuan’s customer proof is enough to reject the idea that demand is fictional, but not enough to confirm how deep, sticky, or diversified the current base really is.",
