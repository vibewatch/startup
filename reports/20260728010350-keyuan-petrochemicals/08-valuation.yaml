    {
      "id": "thesis-antithesis-and-scenario-range",
      "title": "Thesis, anti-thesis, and scenario range",
      "body": "The bullish side of the story is straightforward. Keyuan appears to have real industrial scale, multiple product lines, customer relevance that reaches named global buyers, and genuine policy tailwinds in degradables. If the 2022-2023 revenue markers are directionally accurate and if ABS/TPE/feedstock integration really supports cost position, then a valuation around the current range is not absurd. The market does not need to believe Keyuan is a pristine premium tech asset for 7.5-8.0 billion yuan to make sense.\n\nThe anti-thesis is equally strong. Public numbers can look acceptable while quality still disappoints. The SEC case, distribution-heavy historical sales structure, absent current cap-table detail, missing parent-level cash and covenant data, and ecosystem evidence of margin / cash-flow stress all argue for caution. That is why the scenario range matters more than the point estimate. The bear case assumes industrial multiple compression and weak disclosure persistence; the base case assumes today’s marks are roughly fair; the bull case requires better disclosure, cleaner margins, and evidence that the degradables narrative translates into durable, higher-quality earnings.",
