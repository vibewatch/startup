evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-governance
    missingEvidence: >-
      Current group board roster, committee structure, observer rights, and any related-party policy pack for Keyuan
      Holding / Keyuan Jinghua.
    whyItMatters: >-
      The SEC history makes current governance quality a central underwriting issue, and affiliate disclosures are not a
      substitute for parent-level governance visibility.
    diligencePath: >-
      Request the latest board deck, shareholder agreement summary, related-party policy, and current cap-table /
      board-rights schedule from management.
    relatedQuestionRefs:
      - QO015
      - QO024
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-headcount
    missingEvidence: A dated, group-level employee count split by operating company, plant, and function.
    whyItMatters: >-
      Headcount is a core scale and execution metric, especially for a manufacturing-heavy business claiming
      unicorn-level maturity.
    diligencePath: >-
      Request the latest HR census or payroll summary and reconcile it with plant, R&D, and listed-affiliate staffing
      disclosures.
    relatedQuestionRefs:
      - QO016
  - type: private-evidence-only
    severity: blocking
    topic: debt-and-project-finance
    missingEvidence: >-
      Current debt balances, maturity ladders, covenants, project-finance obligations, guarantees, and off-balance-sheet
      arrangements across the group.
    whyItMatters: >-
      The group is capital intensive, and affiliate analysis already points to rising borrowing and project spend; clean
      underwriting is impossible without a financing map.
    diligencePath: >-
      Obtain the latest lender list, guarantee matrix, debt schedule, covenant package, and project-finance
      sources-and-uses model.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: entity-continuity
    missingEvidence: >-
      A management-certified chronology reconciling the 2007 subsidiary, 2016 holding-company formation, U.S.-listed
      vehicle, privatization, and current unicorn entity perimeter.
    whyItMatters: >-
      The report can infer operating lineage, but investment documentation must show exactly which legal entities map
      into the current financed company and what liabilities travelled with them.
    diligencePath: >-
      Request a legal-entity chart with historical transactions, mergers, asset transfers, and shareholder changes from
      2007 to the latest financing round.
    relatedQuestionRefs:
      - QO002
      - QO020
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: realized-pricing-and-margin
    missingEvidence: >-
      Current realized ASPs, converter economics, and contribution margins for PBAT, PLA, or modified biodegradable
      products relevant to Keyuan.
    whyItMatters: >-
      Capacity growth alone cannot support valuation or market-share underwriting if prices and gross margins are
      collapsing under oversupply.
    diligencePath: >-
      Request current price lists, realized ASP history, gross-margin bridge by product family, and customer
      qualification win/loss data.
    relatedQuestionRefs:
      - QM022
      - QM025
  - type: conflicting-data
    severity: material
    topic: market-size-vs-profit-pool
    missingEvidence: >-
      A reconciled model connecting published capacity to actual domestic demand, utilization, and margin pool across
      PBAT and PLA.
    whyItMatters: >-
      The public record shows strong supply growth but not whether profitable demand is keeping pace; this is the
      central contradiction in the market case.
    diligencePath: >-
      Build a bottoms-up utilization model using plant run-rates, converter demand, and realized-price bands; validate
      with management and third-party channel checks.
    relatedQuestionRefs:
      - QM021
      - QM024
      - QM025
  - type: private-evidence-only
    severity: material
    topic: export-vs-domestic-demand
    missingEvidence: Keyuan-specific and segment-specific split between domestic policy-driven demand and export-led demand.
    whyItMatters: >-
      A market driven mainly by domestic policy compliance behaves differently from one with diversified export pull and
      can carry different pricing power and policy sensitivity.
    diligencePath: >-
      Request revenue mix by geography and application plus export customer list; reconcile with converter-channel
      interviews.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: material
    topic: public-pricing-comparison
    missingEvidence: >-
      Current competitor price lists, discount structures, contract lengths, and win/loss pricing data across Keyuan,
      Hisun, Jindan, BBCA, Tunhe, Kingfa, and Changhong.
    whyItMatters: >-
      Without pricing and discount visibility, it is impossible to know whether a claimed moat actually protects margin
      or merely supports volume.
    diligencePath: >-
      Request quoted price history, gross-margin by product family, and customer-bid data from management and channel
      checks.
    relatedQuestionRefs:
      - QP013
      - QP023
  - type: private-evidence-only
    severity: material
    topic: application-level-overlap
    missingEvidence: >-
      A customer-level competitor map showing where Keyuan wins, loses, or coexists by application and converter
      account.
    whyItMatters: >-
      Public capacity and product pages show who can compete, but not where they actually overlap in live account
      coverage.
    diligencePath: Build an account map from CRM exports, top-50 customers, and lost-deal history by resin family and application.
    relatedQuestionRefs:
      - QP024
      - QP021
  - type: conflicting-data
    severity: material
    topic: commoditization-vs-differentiation
    missingEvidence: >-
      Application-level evidence on whether qualification-sensitive segments maintain pricing power despite PBAT
      capacity growth.
    whyItMatters: >-
      The key strategic question is whether the industry is becoming a commodity capacity race or retaining specialty
      niches; public sources support both views but do not resolve the mix.
    diligencePath: >-
      Interview converters and analyze product-level margins by grade, certification burden, and customer switching
      frequency.
    relatedQuestionRefs:
      - QP019
      - QP020
      - QP025
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-and-runway
    missingEvidence: Current cash, restricted cash, monthly burn, and runway by entity and project.
    whyItMatters: >-
      No industrial underwriting can be completed without a live liquidity bridge, especially for a capital-intensive
      business still expanding capacity.
    diligencePath: Request the latest treasury pack, monthly cash bridge, and 18-month runway forecast.
    relatedQuestionRefs:
      - QI021
      - QI022
  - type: private-evidence-only
    severity: blocking
    topic: debt-and-covenants
    missingEvidence: Current debt balances, lenders, guarantees, covenants, and project-finance obligations.
    whyItMatters: Borrowing-driven growth can shift equity risk dramatically if guarantees or covenant constraints are hidden.
    diligencePath: Request full debt schedule, guarantee matrix, project SPV list, and covenant package.
    relatedQuestionRefs:
      - QI024
  - type: missing-source
    severity: material
    topic: current-product-pricing
    missingEvidence: >-
      Current realized prices, rebates, and gross margins for Keyuan product families including degradables and ABS/TPE
      lines.
    whyItMatters: >-
      Without product-level price and margin visibility, revenue scale alone cannot support valuation or
      investment-return expectations.
    diligencePath: Request price waterfalls, gross-margin bridges, and product-family P&L by month or quarter.
    relatedQuestionRefs:
      - QI023
  - type: missing-source
    severity: material
    topic: keyuan-grade-level-detail
    missingEvidence: >-
      Current Keyuan product datasheets, grade lists, test results, and SKU-specific application notes for elastomers,
      ABS-linked products, and degradables.
    whyItMatters: >-
      Without grade-level documentation, technical diligence cannot verify whether Keyuan competes as a specialist
      product company or only as a broad industrial platform.
    diligencePath: >-
      Request the current product catalog, technical datasheets, certificate pack, and top-10 commercial grades with
      application notes.
    relatedQuestionRefs:
      - QE023
  - type: private-evidence-only
    severity: material
    topic: plant-quality-and-safety-kpis
    missingEvidence: >-
      Current plant uptime, defect rates, emissions, safety incidents, quality rejects, and customer qualification
      metrics.
    whyItMatters: >-
      Technical credibility in industrial materials depends on repeatability and safety, not just on process
      descriptions or capex stories.
    diligencePath: Request monthly plant KPI dashboards, safety logs, and customer quality-approval records by product family.
    relatedQuestionRefs:
      - QE024
  - type: private-evidence-only
    severity: material
    topic: keyuan-degradables-roadmap
    missingEvidence: >-
      A stand-alone roadmap for Keyuan’s own biodegradable materials lines, including which products are in pilot,
      commercial, or expansion stage.
    whyItMatters: Affiliate PBAT execution is not the same as knowing what Keyuan itself sells today or plans to sell next.
    diligencePath: >-
      Request the degradables business roadmap, current commercial SKUs, customer qualification status, and capex plan
      for each line.
    relatedQuestionRefs:
      - QE019
  - type: missing-source
    severity: material
    topic: current-account-list
    missingEvidence: A dated list of current top customers, active sites, and product lines supplied to each account.
    whyItMatters: >-
      Without current account detail, the report cannot distinguish legacy customer proof from ongoing commercial
      traction.
    diligencePath: Request the top-20 customer list, site map, and last-12-month shipment summary by product family.
    relatedQuestionRefs:
      - QU021
      - QU022
  - type: private-evidence-only
    severity: material
    topic: retention-and-renewal
    missingEvidence: NRR, GRR, churn, renewal rates, contract terms, and repeat-order rates by product line.
    whyItMatters: >-
      Customer relevance is not the same as customer durability; sticky industrial relationships deserve different
      valuation treatment than transactional spot business.
    diligencePath: Request retention cohorts, repeat-purchase rates, and contract-length data for top customer groups.
    relatedQuestionRefs:
      - QU013
      - QU014
  - type: conflicting-data
    severity: material
    topic: logo-proof-vs-channel-opacity
