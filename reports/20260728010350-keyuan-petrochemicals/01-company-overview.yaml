    {
      "id": "milestones-scale-and-legacy-risk",
      "title": "Milestones, scale signals, and legacy risk",
      "body": "The strongest public scale signals are real, but they are not as clean as a polished unicorn deck would imply. 36Kr and OFweek attribute very large revenue numbers to Keyuan Jinghua—85.55 billion yuan in 2020, 48.47 billion in 2021, 111.25 billion in 2022, and 57.03 billion in the first three quarters of 2023—alongside a 2023 gross margin of 18.7% and named customers including Bridgestone, Adidas, and more than 50 Fortune Global 500 enterprises. Those numbers, if directionally reliable, place Keyuan far beyond early-stage startup scale and help explain why late-stage capital was willing to fund an 8.0 billion yuan mark. At the same time, no retained current group-level audited financial pack was found, and there is no clean public headcount, debt, or consolidated board disclosure. The report therefore treats revenue and customer scale as strong but third-party-mediated evidence, not as audited certainty.\n\nThe legacy-risk side is more concrete. The SEC’s 2013 enforcement release accused the U.S.-listed Keyuan vehicle and former CFO Aichun Li of undisclosed related-party transactions, books-and-records failures, internal-control failures, and use of an off-balance-sheet cash account, eventually settling for a 1 million dollar company penalty and a 25 thousand dollar CFO penalty. That adverse history should not be ignored simply because the modern unicorn story emphasizes biodegradable plastics and advanced materials. It does not prove present-day misconduct, but it does raise the bar for diligence on governance, related-party dealings, project financing, and disclosure discipline. The favorable counterweight is that China’s policy system has become materially more supportive of biodegradable plastics through NDRC and SAMR actions, while Keyuan-linked affiliates such as Changhong have already commissioned PBAT capacity. The overall company overview is therefore a mixed picture: industrially significant, financially interesting, policy-aligned, and still burdened by a legacy disclosure scar plus current opacity where a growth-equity investor would want precision.",
