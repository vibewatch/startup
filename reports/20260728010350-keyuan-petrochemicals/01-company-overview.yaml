  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Keyuan Petrochemicals is a Ningbo-based private chemicals and advanced-materials group whose 2025 Fosun-backed D-round first close and 2026 Hurun ranking support an approximately RMB 7.5-8.0 billion unicorn valuation. The public record points to a 2007 operating-company origin, a 2016 holding-company formation, and a complicated capital-markets history that includes a U.S. reverse merger, a 2013 SEC enforcement action, an unsuccessful 2019 A-share backdoor attempt, and later financing into biodegradable-plastics and specialty-materials expansion."
  },
  "sections": [
    {
      "id": "identity-footprint-and-business-model",
      "title": "Identity, industrial footprint, and business model",
      "body": "The strongest current identity signal is not an English-language startup page but a triangulation across Ningbo media, company-submitted profile material, and sector directories. China Daily’s Ningbo coverage of the 2026 Hurun Global Unicorn Index identifies Keyuan Petrochemicals as a Ningbo-based private company valued at 7.5 billion yuan and appearing on the list for the second consecutive year. That ranking sits on top of a broader group structure rather than a single clean legal entity. Chemical HR and Baidu Baike both describe Keyuan Holding as a large private group focused on fine chemicals, thermoplastic elastomers, engineering plastics, and biodegradable materials, with the Ningbo Keyuan Jinghua operating company established in April 2007 and the holding company itself formed in October 2016. The practical diligence read is therefore that investors are underwriting a Ningbo-origin industrial platform with layered legal history, not a freshly created 2025 green-materials startup.\n\nOperationally, the group still reads as a petrochemical-manufacturing platform that has expanded into greener materials rather than a pure-play bioplastics specialist. Chemical HR says the Ningbo site runs more than twenty process units, uses heavy-oil and fuel-oil cracking, and processes more than three million tons annually. Those same profile materials place the group across multiple domestic bases, including Ningbo, Shengzhou, and Fangchenggang, while Baidu Baike adds Hezhou and a 2026 acrylic-acid project in Maoming. End-market evidence also points to a broad industrial-customer mix: public descriptions mention chemicals, dyeing, pharmaceuticals, food, precision electronics, optics, and industrial-cleaner use in electronics manufacturing. The result is a vertically integrated chemicals platform with advanced-materials adjacencies, not a narrowly scoped one-product company.",
