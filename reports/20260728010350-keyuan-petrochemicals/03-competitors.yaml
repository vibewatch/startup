      "id": "pricing-distribution-and-switching-costs",
      "title": "Pricing, distribution, and switching costs",
      "body": "Public pricing data are sparse, which is itself a competitive fact. The strongest direct disclosure in the retained source set comes from historical Keyuan, whose SEC filing says sales were largely routed through distributors, contracts were order-to-order, and pricing tracked market conditions rather than fixed long-term contracts. That suggests at least part of the market behaves more like industrial procurement than like sticky enterprise software: customers can multi-home, converters can compare offers, and price or supply availability can move volume quickly.\n\nBut price is not the whole story. PLA specialists such as Hisun and Jindan can still create friction through grade depth, certification, and application know-how. Tunhe can create friction through chemistry breadth and its ability to cover several adjacent material needs. Kingfa can create friction through relationship bundling and corporate scale. Keyuan’s likely defense is a different one again: backward integration, petrochemical feedstock control, and the ability to serve adjacent ABS/TPE/industrial-material demand from a common platform. Buyers may switch faster in commodity film grades than in qualification-heavy molded or specialty applications, so “switching cost” is not one market-wide constant here; it varies meaningfully by resin family and use case.",
