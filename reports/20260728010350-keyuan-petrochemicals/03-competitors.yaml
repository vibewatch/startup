      "id": "peer-profiles-and-capability-comparison",
      "title": "Peer profiles and capability comparison",
      "body": "Hisun and Jindan exemplify what focused PLA competition looks like. Hisun’s site and BPI listing emphasize a dedicated PLA identity, multiple application routes, visible capacity, and certification-ready product families. Jindan’s BPI page shows another route: upstream lactide strength and a roadmap to 100–150kt of lactide and PLA capacity, paired with grades for film, injection, and blow molding. Those companies compete by making the customer believe they understand grade-level application problems better than a broader petrochemical player does.\n\nKingfa, BBCA, Blue Ridge Tunhe, and Changhong represent other competitive archetypes. Kingfa is the scale incumbent: a very large materials company with a dedicated biomaterials unit and revenue scale that dwarfs most domestic private peers. BBCA is a platform competitor that combines biomaterials with R&D, bio-manufacturing, and global marketing systems. Tunhe is the chemistry-breadth player: it shows BDO, PBT, PET, PBAT, PBS, and TPEE under one industrial umbrella, reaching agriculture, packaging, automotive, and electronics applications. Changhong is the closest ecosystem benchmark because its 120kt operating PBAT line and larger 600kt project show how fast a Keyuan-linked platform can expand. The competitive question is not simply “who else makes biodegradable plastic,” but “which business model is best matched to the customer problem Keyuan is trying to solve.”",
