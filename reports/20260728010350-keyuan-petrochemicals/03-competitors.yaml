    {
      "id": "moat-durability-and-commoditization-risk",
      "title": "Moat durability and commoditization risk",
      "body": "The sector’s most important competitive tension is between product-grade defensibility and capacity-led commoditization. On the defensibility side, Hisun and Jindan suggest that application-grade PLA expertise, certification visibility, and targeted resin families can still matter. On the capacity-led side, Qianzhan’s PBAT-share data and Changhong’s risk analysis point toward a market where more and more capacity can chase similar bag and film demand, compressing margin even as environmental policy remains supportive. Tunhe’s chemistry breadth and Keyuan’s feedstock-integration logic both attempt to solve that problem through structural cost advantage rather than pure differentiation.\n\nThis means Keyuan’s moat is unlikely to be a classic software-style switching moat. It is more likely to be a mixed industrial moat: feedstock economics, integrated plant design, ability to bridge petrochemicals and degradables, and selective application competence. That can be durable in some customer segments, but it is less durable if the business drifts into undifferentiated PBAT volume where too many players can make similar claims. The competitive verdict is therefore balanced: there are still niches worth defending, but the burden is on Keyuan to prove it has more than just another capacity build in a crowded field.",
