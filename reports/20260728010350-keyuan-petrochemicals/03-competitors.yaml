    "number": 3,
    "title": "Competitors",
    "summary": "Keyuan competes in a layered field rather than against one clean peer set. PLA specialists such as Hisun and Jindan compete on grade depth and application breadth; diversified incumbents such as Kingfa compete on scale and account coverage; Blue Ridge Tunhe and Changhong show strong PBAT and chemistry-integration logic; and BBCA competes from a broader bio-manufacturing platform. The result is a market that is partly niche-defensible and partly drifting toward capacity-led commoditization."
