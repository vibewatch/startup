  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: >-
        Public repository activity, SDK release cadence, package downloads, issue response,
        contributor counts, or practitioner-community usage tied to RunPod.
      whyItMatters: >-
        A developer-cloud moat depends on integration quality and ecosystem durability,
        which user-count and investor-issued deployment metrics do not independently prove.
      diligencePath: >-
        Obtain the official SDK and CLI repository list, then review twelve months of
        releases, contributors, issue resolution, package downloads, and breaking changes.
      relatedQuestionRefs: [QE008]
    - type: private-evidence-only
      severity: material
      topic: reliability-and-security
      missingEvidence: >-
        Independent uptime history, incident and recovery records, penetration-test results,
        current SOC report, BAA and DPA terms, subprocessor list, and deployment-specific
        control coverage.
      whyItMatters: >-
        Company claims vary by region and deployment model, while regulated and
        mission-critical workloads depend on the exact contractual and technical scope.
      diligencePath: >-
        Request the trust-center diligence package and twelve months of status and incident
        records, then map each control and SLA exclusion to every intended product and region.
    - type: private-evidence-only
      severity: material
      topic: architecture-and-performance
      missingEvidence: >-
        Scheduler design, capacity-source mix, cluster topology, storage durability,
        workload benchmarks, failover mechanics, recovery objectives, and utilization data.
      whyItMatters: >-
        Catalog size, list pricing, and aggregate request counts do not establish available
        capacity, performance consistency, or recovery behavior for a specific workload.
      diligencePath: >-
        Run a paid proof of concept across target regions and products using representative
        images, datasets, concurrency, interruption, node-failure, and recovery tests.
