      - [Clusters, "Teams running distributed training or large-batch inference", "Official site says 200+ simultaneous GPUs with InfiniBand", "Multi-node capacity inside the same developer platform", "Obtain topology, reservation, job-recovery, utilization, and benchmark evidence"]
      - [Network volumes, "Teams retaining checkpoints, weights, and agent state", "Official and review sources describe persistent network storage", "Shared state across compute lifecycles", "Verify durability, encryption, backup, throughput, egress, and deletion guarantees"]
    notes: >-
      Statuses are based on current company claims and June-October 2026 third-party
      descriptions; no row establishes independently audited performance or availability.
