      - Limitation
    rows:
      - ["Prototype or fine-tune a model", "Local hardware lacks sufficient VRAM or capacity", "Launch a persistent Pod with a chosen GPU", "Median time to first workload is company-reported below one hour", "No independent success-time distribution or capacity-fill rate"]
      - ["Serve bursty inference", "Always-on GPUs create idle cost", "Deploy a Serverless worker that scales to zero", "More than 20 billion processed inference requests are investor-reported", "No independent latency, error-rate, or tail-performance benchmark"]
      - ["Run distributed training", "Single-node capacity and networking constrain the job", "Use Clusters with multi-GPU capacity and InfiniBand", "Official site states support for 200+ simultaneous GPUs", "No assigned multi-node scaling-efficiency or failure-recovery benchmark"]
      - ["Move from experiment to production", "Separate vendors add migration and operating overhead", "Use Pods, Serverless, and Clusters under one platform", "Third-party analysis describes a full-lifecycle interface", "API portability, support boundaries, and production migration outcomes are undisclosed"]
    notes: >-
      Benefits are mapped to public product descriptions and company-reported operating
      metrics; missing denominators and independent benchmarks are stated explicitly.
    claimRefs: [CE002, CE011, CE012, CE015]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Role
      - Public evidence
      - Dependency
      - Risk
    rows:
      - ["Developer interface and API", "Provision and manage workloads", "Self-serve platform and single-interface workflow", "Control-plane availability and API compatibility", "No public API reliability or version-support evidence in the assigned pool"]
      - ["Orchestration and queueing", "Autoscale and distribute Serverless jobs", "Company claims zero-to-thousands scaling and managed queues", "Scheduler, image loading, regional capacity, and failover", "Company-issued latency and scale claims lack independent testing"]
      - ["GPU compute fabric", "Run persistent, interruptible, and distributed workloads", "30 GPU types tracked by GPUs.io; company claims 31 global regions", "GPU supply, host quality, networking, and topology", "Tracker observed offerings in 12 regions, using a narrower catalog basis"]
      - ["Storage and state", "Persist checkpoints, weights, and agent memory", "Official and review sources describe network volumes", "Storage durability, encryption, throughput, and lifecycle controls", "No independent durability or recovery evidence"]
      - ["Trust and compliance", "Support regulated and enterprise workloads", "Company claims SOC 2 Type II, HIPAA, GDPR, and enterprise SLA options", "Deployment model, region, contract, subprocessors, and control scope", "Current audit artifacts and coverage matrix are not public in the assigned evidence"]
    notes: >-
      Architecture is limited to publicly described layers; undisclosed internals,
      control ownership, capacity sources, and recovery mechanisms are not inferred.
    claimRefs: [CE003, CE004, CE007, CE009, CE010]
figures:
