    title: Product architecture by operating layer
    type: stack
    summary: >-
      RunPod connects developer workflows to three compute products, orchestration,
      capacity, persistence, and enterprise controls; each lower layer introduces a
      separate diligence dependency.
    data:
      layers:
        - label: Developer workflows
          items: ["Experiment and fine-tune", "Serve inference", "Train at cluster scale"]
          detail: "Workloads move from development to production without an intended vendor change."
        - label: Product modes
          items: [Pods, Serverless, Clusters]
          detail: "Persistent, autoscaling, and distributed compute modes address different demand shapes."
        - label: Platform orchestration
          items: ["API and dashboard", "Job queue", "Autoscaling and failover"]
          detail: "The managed control plane abstracts provisioning and workload distribution."
        - label: Compute capacity
          items: ["Reserved capacity", "Spot capacity", "Broad GPU catalog"]
          detail: "Availability and performance depend on GPU supply, region, and deployment model."
        - label: Data plane
          items: ["Network volumes", "Model weights", "Checkpoints and agent state"]
          detail: "Persistent state supports movement across compute lifecycles."
        - label: Trust and operations
          items: ["Compliance controls", "SLA and support", "Monitoring and incident response"]
          detail: "Enterprise assurances require contract-, region-, and product-specific verification."
    approximationNotes: >-
      This is a functional stack assembled from public descriptions, not a claim about
      RunPod's undisclosed internal topology or control-plane implementation.
    claimRefs: [CE001, CE009, CE011, CE015]
