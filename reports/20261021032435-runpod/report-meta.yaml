companyProfile:
  summary: >-
    Founded in 2022 by Zhen Lu and Pardeep Singh, RunPod operates a developer-focused GPU cloud spanning persistent
    Pods, autoscaling Serverless endpoints, distributed Clusters, and network storage. The platform reports rapid
    adoption and revenue growth, but remains a private company with limited disclosure of audited financials, customer
    economics, governance, and operating reliability.
