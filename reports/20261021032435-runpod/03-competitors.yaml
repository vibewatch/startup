  evidenceGaps:
    - type: missing-source
      severity: material
      topic: enterprise-trust
      missingEvidence: Independent uptime, SLA attainment, compliance-scope, and large-cluster performance evidence for RunPod.
      whyItMatters: These factors determine whether RunPod can displace enterprise GPU clouds rather than remain a developer-oriented alternative.
      diligencePath: Obtain audit reports, SLA performance history, incident records, and normalized NCCL or workload benchmarks from comparable production deployments.
      relatedQuestionRefs: [QP007]
    - type: stale
      severity: material
      topic: pricing
      missingEvidence: Live October 2026 quotes normalized for region, availability, storage, egress, commitment, and service level.
      whyItMatters: GPU spot and on-demand prices can change quickly, making May observations unsuitable for current procurement decisions.
      diligencePath: Request same-day quotes from RunPod, Vast.ai, Lambda, CoreWeave, and hyperscaler alternatives for identical workload specifications.
      relatedQuestionRefs: [QP002]
      relatedTableRefs: [TP003]
    - type: enumeration-incomplete
      severity: minor
      topic: competitor-scale
      missingEvidence: Current funding, revenue, installed capacity, and customer scale for each named competitor.
      whyItMatters: Product comparisons alone do not establish which competitors can sustain price competition or secure scarce GPU supply.
      diligencePath: Review competitor filings, financing announcements, capacity disclosures, and customer procurement records.
      relatedQuestionRefs: [QP001]
      relatedTableRefs: [TP001]
