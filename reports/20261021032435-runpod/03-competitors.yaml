    claimRefs: [CP004, CP005, CP006, CP007]
figures:
  - id: FP001
    title: Competitive positioning by infrastructure control and operating model
    type: quadrant
    summary: >-
      Analyst-authored ordinal placement shows how RunPod bridges raw GPU control and
      managed deployment, while specialists occupy clearer price, enterprise, or API niches.
    data:
      points:
        - label: RunPod
          x: 4
          y: 4
          detail: "Broad control with Pods, Serverless, and Clusters; medium operating abstraction"
        - label: Vast.ai
          x: 5
          y: 5
          detail: "Maximum marketplace control and price flexibility; higher host variance"
        - label: Lambda
          x: 4
          y: 2
          detail: "Managed datacenter compute oriented to stable and multi-node workloads"
        - label: CoreWeave
          x: 3
          y: 2
          detail: "Enterprise reserved capacity and networking orientation"
        - label: Together AI
          x: 1
          y: 3
          detail: "High abstraction through hosted model APIs"
        - label: Hyperscalers
          x: 3
          y: 1
          detail: "Integrated enterprise controls with higher cost and procurement weight"
    approximationNotes: >-
      Ordinal analyst scoring only: x runs from managed API abstraction (1) to direct
      infrastructure control (5); y runs from enterprise control-plane emphasis (1)
      to price and deployment flexibility (5). It is not a performance benchmark.
    claimRefs: [CP001, CP008, CP015, CP016]
callouts:
  - calloutType: risk
    title: Independent enterprise proof remains the key competitive gap
    body: >-
      Current RunPod materials claim stronger cluster, compliance, and SLA capabilities
      than an earlier partner review described, but the assigned pool contains no
      independent uptime, audit-scope, or multi-node benchmark that reconciles the change.
    claimRefs: [CP010, CP011, CP012]
