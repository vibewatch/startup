evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: company-profile
    missingEvidence: >-
      Current legal domicile, employee count, active and paying customer counts, customer concentration, and geographic
      revenue mix.
    whyItMatters: >-
      These fields determine operating scale, concentration risk, legal jurisdiction, and the reliability of headline
      adoption claims.
    diligencePath: >-
      Obtain the certificate of incorporation, current HR roster, and anonymized customer cohort and
      revenue-concentration schedules.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-governance
    missingEvidence: >-
      Complete executive and board rosters, biographies, ownership, voting rights, investor preferences, and founder
      succession arrangements.
    whyItMatters: >-
      Publicly named leaders do not establish functional depth, board independence, control, dilution, or key-person
      mitigation.
    diligencePath: >-
      Review the capitalization table, charter, voting agreements, board minutes, executive employment agreements, and
      succession plans.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: funding-and-financials
    missingEvidence: >-
      Debt, credit facilities, secondaries, financing fees, cash balance, burn, runway, audited revenue, gross margin,
      and ARR reconciliation.
    whyItMatters: >-
      Funding raised cannot establish liquidity, and company-reported ARR cannot establish recognized revenue,
      profitability, or cash generation.
    diligencePath: >-
      Obtain financing documents, bank and debt statements, audited financials, monthly management accounts, and
      customer-level ARR-to-revenue bridges.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: infrastructure-limitations
    missingEvidence: >-
      Product- and region-specific uptime history, incident logs, SLA terms, certification scope, interconnect
      specifications, and independent audit reports.
    whyItMatters: >-
      Current company claims may describe enterprise Clusters or Secure Cloud while independent cautions may apply to
      Community Cloud or older Pods.
    diligencePath: >-
      Review executed enterprise contracts, status and incident exports, SOC 2 and ISO reports, architecture documents,
      and region-level service measurements.
    relatedQuestionRefs:
      - QO007
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent, methodologically transparent estimate of AI GPU cloud spend segmented by workload, geography,
      deployment model, and buyer, plus Runpod revenue by those same segments.
    whyItMatters: >-
      Without a comparable denominator and company revenue split, platform users, requests, SKUs, and regions cannot
      establish TAM, SAM, SOM, market share, or a defensible growth-rate assumption.
    diligencePath: >-
      Obtain independent analyst or public-company market data and reconcile it to management revenue cohorts, capacity
      utilization, retention, pricing, and competitive win-loss records.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      Customer-level procurement records identifying economic buyers, budget owners, contract size, sales cycle,
      workload migration path, and renewal behavior.
    whyItMatters: >-
      Functional user personas do not show whether Runpod can move from self-serve developer spend into durable
      enterprise infrastructure budgets.
    diligencePath: >-
      Review anonymized customer cohorts and interview buyers across self-serve, startup, and enterprise segments using
      a consistent procurement questionnaire.
    relatedQuestionRefs:
      - QM003
  - type: missing-source
    severity: material
    topic: independent-performance
    missingEvidence: >-
      Workload-matched independent benchmarks for cold start, throughput, availability, storage, network performance,
      and total cost across Runpod and relevant alternatives.
    whyItMatters: >-
      Adoption and valuation depend on delivered workload economics, while current public evidence is dominated by
      company claims, affiliate reviews, and competitor-authored comparisons.
    diligencePath: >-
      Commission repeatable benchmarks using representative model sizes, regions, concurrency levels, and failure
      conditions, then reconcile results to invoices.
    relatedQuestionRefs:
      - QM006
      - QM007
  - type: missing-source
    severity: material
    topic: enterprise-trust
    missingEvidence: Independent uptime, SLA attainment, compliance-scope, and large-cluster performance evidence for RunPod.
    whyItMatters: >-
      These factors determine whether RunPod can displace enterprise GPU clouds rather than remain a developer-oriented
      alternative.
    diligencePath: >-
      Obtain audit reports, SLA performance history, incident records, and normalized NCCL or workload benchmarks from
      comparable production deployments.
    relatedQuestionRefs:
      - QP007
  - type: stale
    severity: material
    topic: pricing
    missingEvidence: Live October 2026 quotes normalized for region, availability, storage, egress, commitment, and service level.
    whyItMatters: >-
      GPU spot and on-demand prices can change quickly, making May observations unsuitable for current procurement
      decisions.
    diligencePath: >-
      Request same-day quotes from RunPod, Vast.ai, Lambda, CoreWeave, and hyperscaler alternatives for identical
      workload specifications.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-scale
    missingEvidence: Current funding, revenue, installed capacity, and customer scale for each named competitor.
    whyItMatters: >-
      Product comparisons alone do not establish which competitors can sustain price competition or secure scarce GPU
      supply.
    diligencePath: Review competitor filings, financing announcements, capacity disclosures, and customer procurement records.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin and contribution margin by Pods, Serverless, storage, GPU class, region, and capacity source.
    whyItMatters: >-
      Revenue growth cannot be translated into economic value without the direct infrastructure, partner, power,
      networking, support, and idle-capacity costs.
    diligencePath: >-
      Obtain monthly product-level revenue and cost-of-revenue schedules, utilization data, capacity contracts, and a
      management margin bridge.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Cash balance, monthly burn, debt, leases, GPU-capacity commitments, working-capital terms, and management runway
      forecast.
    whyItMatters: >-
      The announced financing amount does not establish cash available or the timing and size of the next funding
      requirement.
    diligencePath: >-
      Review bank statements, closing documents, debt and lease schedules, board-approved budgets, and a 24-month
      monthly liquidity model.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Recognized revenue, ARR definition, customer concentration, gross retention, cohort expansion, contract duration,
      discounts, credits, and bad-debt history.
    whyItMatters: Public run-rate, ARR, and usage metrics cannot establish durable revenue quality or customer-level dependency.
    diligencePath: >-
      Reconcile billing records to audited revenue and inspect customer cohorts, top-account contracts, churn, credits,
      and collections.
    relatedQuestionRefs:
      - QI002
      - QI003
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public repository activity, SDK release cadence, package downloads, issue response, contributor counts, or
      practitioner-community usage tied to RunPod.
    whyItMatters: >-
      A developer-cloud moat depends on integration quality and ecosystem durability, which user-count and
      investor-issued deployment metrics do not independently prove.
    diligencePath: >-
      Obtain the official SDK and CLI repository list, then review twelve months of releases, contributors, issue
      resolution, package downloads, and breaking changes.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: reliability-and-security
    missingEvidence: >-
      Independent uptime history, incident and recovery records, penetration-test results, current SOC report, BAA and
      DPA terms, subprocessor list, and deployment-specific control coverage.
    whyItMatters: >-
      Company claims vary by region and deployment model, while regulated and mission-critical workloads depend on the
      exact contractual and technical scope.
    diligencePath: >-
      Request the trust-center diligence package and twelve months of status and incident records, then map each control
      and SLA exclusion to every intended product and region.
  - type: private-evidence-only
    severity: material
    topic: architecture-and-performance
    missingEvidence: >-
      Scheduler design, capacity-source mix, cluster topology, storage durability, workload benchmarks, failover
      mechanics, recovery objectives, and utilization data.
    whyItMatters: >-
      Catalog size, list pricing, and aggregate request counts do not establish available capacity, performance
      consistency, or recovery behavior for a specific workload.
    diligencePath: >-
      Run a paid proof of concept across target regions and products using representative images, datasets, concurrency,
      interruption, node-failure, and recovery tests.
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Customer-level NRR, GRR, logo and revenue churn, renewal cohorts, contract duration, and paid-status definitions.
    whyItMatters: >-
      Without revenue and logo cohorts, the reported return-to-build rate cannot establish durable recurring customer
      behavior.
    diligencePath: >-
      Request monthly logo and revenue cohort files for the last 24 months, reconcile them to billed revenue, and sample
      executed renewals.
    relatedQuestionRefs:
      - QU004
      - QU008
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-1, top-5, and top-10 customer revenue concentration plus partner, channel, and geographic mix.
    whyItMatters: A large developer count can coexist with material dependence on a small number of high-usage production accounts.
    diligencePath: >-
      Obtain anonymized account-level revenue by month, identify related entities, and test concentration before and
      after credits.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: enterprise-controls
    missingEvidence: >-
      Executed enterprise SLA terms, eligible services and regions, historical attainment, credits, compliance reports,
      and data-residency scope.
    whyItMatters: >-
      Current company claims and a June affiliate review point in different directions on regulated and SLA-sensitive
      customer fit.
    diligencePath: >-
      Review the Trust Center package, SOC 2 report, BAA and DPA, then sample enterprise contracts and twelve months of
      SLA performance.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer
    missingEvidence: >-
