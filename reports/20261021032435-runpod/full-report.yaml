  - id: FM001
    title: Evidence-constrained addressability filters
    type: pyramid
    summary: >-
      A qualitative sequence for narrowing broad AI-compute demand to workloads that match Runpod; layer order reflects
      applicability filters, not market magnitude.
    data:
      items:
        - label: Broad AI and compute demand
          value: No retained market total
          detail: Includes spend that may never require rented GPUs.
        - label: GPU-intensive workloads
          value: Training, fine-tuning, inference, and batch compute
          detail: Excludes CPU-only orchestration and ordinary application hosting.
        - label: Rent-versus-own decision
          value: On-demand or metered capacity
          detail: Applies where flexibility outweighs owned-hardware economics.
        - label: Control-versus-managed-API decision
          value: Customer-selected hardware, containers, and models
          detail: Excludes buyers satisfied by black-box model APIs.
        - label: Runpod product-mode fit
          value: Pods, Serverless, or Clusters
          detail: The workload must match persistence, latency, scale, and interruption needs.
        - label: Obtainable workload
          value: Unmeasured
          detail: Requires competitive win rates, capacity, retention, pricing, and budget evidence not in the assigned pool.
    approximationNotes: >-
      Conceptual filtering sequence only; it is not a value-proportional TAM/SAM/SOM pyramid and does not imply
      conversion rates or nested dollar amounts.
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM011
      - CM012
  - id: FP001
    title: Competitive positioning by infrastructure control and operating model
    type: quadrant
    summary: >-
      Analyst-authored ordinal placement shows how RunPod bridges raw GPU control and managed deployment, while
      specialists occupy clearer price, enterprise, or API niches.
    data:
      points:
        - label: RunPod
          x: 4
          'y': 4
          detail: Broad control with Pods, Serverless, and Clusters; medium operating abstraction
        - label: Vast.ai
          x: 5
          'y': 5
          detail: Maximum marketplace control and price flexibility; higher host variance
        - label: Lambda
          x: 4
          'y': 2
          detail: Managed datacenter compute oriented to stable and multi-node workloads
        - label: CoreWeave
          x: 3
          'y': 2
          detail: Enterprise reserved capacity and networking orientation
        - label: Together AI
          x: 1
          'y': 3
          detail: High abstraction through hosted model APIs
        - label: Hyperscalers
          x: 3
          'y': 1
          detail: Integrated enterprise controls with higher cost and procurement weight
    approximationNotes: >-
      Ordinal analyst scoring only: x runs from managed API abstraction (1) to direct infrastructure control (5); y runs
      from enterprise control-plane emphasis (1) to price and deployment flexibility (5). It is not a performance
      benchmark.
    claimRefs:
      - CP001
      - CP008
      - CP015
      - CP016
  - id: FI001
    title: Revenue model bridge from developer access to recurring usage
    type: flow
    summary: >-
      A conceptual sequence showing how low-friction access can convert metered workloads into recurring revenue without
      implying conversion rates or gross profit.
    data:
      nodes:
        - id: self-serve-access
          label: Self-serve access
          detail: Transparent pricing and no commitment minimums reduce initial procurement friction.
        - id: first-workload
          label: First workload
          detail: Developers choose persistent Pods or autoscaling Serverless execution.
        - id: metered-compute
          label: Metered compute
          detail: Runtime is billed by minute for Pods or active second for Serverless.
        - id: persistent-storage
          label: Persistent storage
          detail: Network volumes add a separately priced retention layer.
        - id: usage-expansion
          label: Usage expansion
          detail: RunPod reported 120% net dollar retention in January 2026.
        - id: recurring-revenue
          label: Recurring revenue
          detail: >-
            RunPod reported more than $120M ARR; a later profile reported an approximately $240M annualized revenue run
            rate.
    approximationNotes: Conceptual ordering only; no conversion rate, revenue mix, gross margin, or cumulative bridge is inferred.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI007
      - CI008
      - CI009
  - id: FE001
    title: Product architecture by operating layer
    type: stack
    summary: >-
      RunPod connects developer workflows to three compute products, orchestration, capacity, persistence, and
      enterprise controls; each lower layer introduces a separate diligence dependency.
    data:
      layers:
        - label: Developer workflows
          items:
            - Experiment and fine-tune
            - Serve inference
            - Train at cluster scale
          detail: Workloads move from development to production without an intended vendor change.
        - label: Product modes
          items:
            - Pods
            - Serverless
            - Clusters
          detail: Persistent, autoscaling, and distributed compute modes address different demand shapes.
        - label: Platform orchestration
          items:
            - API and dashboard
            - Job queue
            - Autoscaling and failover
          detail: The managed control plane abstracts provisioning and workload distribution.
        - label: Compute capacity
          items:
            - Reserved capacity
            - Spot capacity
            - Broad GPU catalog
          detail: Availability and performance depend on GPU supply, region, and deployment model.
        - label: Data plane
          items:
            - Network volumes
            - Model weights
            - Checkpoints and agent state
          detail: Persistent state supports movement across compute lifecycles.
        - label: Trust and operations
          items:
            - Compliance controls
            - SLA and support
            - Monitoring and incident response
          detail: Enterprise assurances require contract-, region-, and product-specific verification.
    approximationNotes: >-
      This is a functional stack assembled from public descriptions, not a claim about RunPod's undisclosed internal
      topology or control-plane implementation.
    claimRefs:
      - CE001
      - CE009
      - CE011
      - CE015
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence supports a path from self-serve discovery to repeat building, but paid renewal and account
      expansion remain unmeasured.
    data:
