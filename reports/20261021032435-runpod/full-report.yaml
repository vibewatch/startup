              - CU010
              - CU012
              - CU016
      - number: '6.3'
        title: Named proof demonstrates real workloads, not a complete customer census
        blocks:
          - type: paragraph
            body: >-
              Deep Cogito is the strongest named production reference in the allocated evidence: its chief executive
              said a small team trained the Cogito v1 model family entirely on RunPod in 75 days. RunPod's homepage also
              carries a Botto testimonial linking migration to better GPU resources and lower cost. A separate OpenAI
              Model Craft Challenge infrastructure partnership demonstrates ecosystem credibility and a compute-credit
              deployment, but it should not be counted as a customer contract. Together these references show credible
              use across model training, creative generation, and developer programs. They do not establish contract
              values, renewal, gross retention, or customer concentration, and two of the three disclosures sit on
              company- or investor-controlled surfaces. The proof set is therefore useful for workload verification but
              weak for underwriting revenue durability.
            claimRefs:
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU005
      - number: '6.4'
        title: Retention and concentration remain the decisive diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not disclose NRR, GRR, logo churn, contract length, enterprise revenue share,
              top-customer exposure, or channel dependence. The reported 85% return-to-build metric is directionally
              positive, yet it cannot be translated into retention without a time window, denominator, paid-status
              definition, and cohort construction. Customer durability also depends on operational fit. One independent
              review warns that teams without container and MLOps maturity may find RunPod too low-level, while an
              affiliate review last reviewed in June 2026 characterized strict uptime, compliance, and regulated-data
              use as weak fits. RunPod's current homepage now claims broader compliance and enterprise SLA coverage,
              creating a diligence need to verify the applicable region, deployment model, contract, and remedy rather
              than treating either marketing or an older review as conclusive. Investment underwriting should request
              customer-level cohorts and executed contract evidence before assigning value to expansion or low
              concentration.
            claimRefs:
              - CU010
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Credible production-workload references
            body: >-
              Deep Cogito's completed training program and Botto's migration testimonial show that RunPod is used for
              more than short-lived experimentation, although neither disclosure provides contract economics.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
          - type: callout
            title: Retention is not yet underwritable
            body: >-
              The 85% return-to-build disclosure lacks a cohort window, paid-status definition, and revenue denominator,
              while NRR, GRR, churn, contract duration, and concentration remain private.
            calloutType: risk
            claimRefs:
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment implication
        blocks:
          - type: paragraph
            body: >-
              The highest residual exposures are production reliability, compliance scope, GPU-capacity dependency, and
              financial opacity. Independent reviews describe boot failures, crashes, continued billing during
              unsuccessful runs, variable Community Cloud hardware, fluctuating GPU availability, and cold-start
              latency, while company materials advertise failover, broad uptime, and stronger enterprise commitments.
              That tension matters more than either side alone: RunPod appears to have built credible mitigations, but
              the assigned evidence does not contain provider-level incident logs or contractual remedy schedules that
              would demonstrate their realized effectiveness. The $100 million 2026 growth investment reduces immediate
              financing pressure, yet funding raised is not cash available and does not disclose burn, gross margin, or
              runway. The investment case therefore depends on converting public claims into auditable operating
              evidence before underwriting production-critical adoption.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR009
              - CR010
              - CR013
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
