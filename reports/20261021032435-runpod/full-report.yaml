  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue traction is strong, but metric reconciliation is required
        blocks:
          - type: paragraph
            body: >-
              RunPod's January 2026 release reported that ARR had surpassed $120 million, revenue had grown 90% year
              over year, and net dollar retention had reached 120%. Those company-issued indicators point to meaningful
              recurring usage and expansion within existing accounts, but they are not audited financial statements. By
              June, AI Engineer described an approximately $240 million annualized revenue run rate rather than ARR.
              That later metric may indicate rapid growth, but the denominator, measurement date, and
              revenue-recognition basis are not disclosed, so it should not be substituted for ARR without management
              reconciliation. Company and investor releases also reported more than one million developers and over 20
              billion cumulative Serverless inference requests; these are activity indicators, not revenue or margin
              measures.
            claimRefs:
              - CI001
