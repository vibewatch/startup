  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative prioritization shows reliability, compliance scope, capacity concentration, financial visibility, and
      platform-scale blast radius as the most consequential residual exposures.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Production availability
          values:
            - label: Medium
              detail: Recurring review complaints and secondhand incident counts lack a common denominator
            - label: High
              detail: Failed production workloads can affect customer continuity, state, and billing
            - label: Developing
              detail: Failover and enterprise SLAs are claimed but historical attainment is unavailable
            - label: High
              detail: Contract and incident evidence remains a pre-close condition
        - label: Community interruption
          values:
            - label: High
              detail: Interruption and host variability are inherent to the lower-cost tier
            - label: Medium
              detail: Checkpointable workloads can recover, but stateful workloads may not
            - label: Productized
              detail: Secure and reserved alternatives plus checkpointing are available
            - label: Medium
              detail: Residual exposure depends on workload placement discipline
        - label: Security and compliance scope
          values:
            - label: Unknown
              detail: No primary incident or audit evidence was assigned
            - label: Critical
              detail: A control-scope mismatch could block regulated workloads
            - label: Developing
              detail: ISO, SOC 2, HIPAA, GDPR, SSO, and governance are company claims
            - label: High
              detail: Audit artifacts and regional coverage must be verified
        - label: GPU capacity concentration
          values:
            - label: Medium
              detail: Reviews say popular GPU availability varies by region and demand
            - label: High
              detail: Capacity gaps can delay training or impair inference economics
            - label: Limited visibility
              detail: Multiple SKUs and regions help, but supplier contracts are undisclosed
            - label: High
              detail: Provider-level shares and fallback performance remain unknown
        - label: Financial runway and unit economics
          values:
            - label: Unknown
              detail: Cash, burn, gross margin, and runway are not disclosed in the assigned pool
            - label: High
              detail: Infrastructure commitments can be capital intensive
            - label: Funded
              detail: A $100 million growth investment was announced in June 2026
            - label: High
              detail: Financing does not substitute for a reconciled cash and obligation schedule
        - label: Platform-scale blast radius
          values:
            - label: Medium
              detail: The company-reported user and request scale increases control-plane stakes
            - label: High
              detail: Shared orchestration or identity failures could affect many workloads
            - label: Emerging
              detail: Governance, SSO, cost controls, and named support are being added
            - label: Medium-High
              detail: Deployment success is reported by an investor rather than independently audited
    approximationNotes: >-
      Ordinal labels are analyst assessments grounded in the cited claims, not measured probabilities or benchmark
      thresholds; unknown denotes missing evidence rather than low risk.
    claimRefs:
