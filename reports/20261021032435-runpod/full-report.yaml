      - CR003
      - CR004
      - CR006
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: A qualitative chain from financing and adoption evidence to a diligence-gated recommendation.
    data:
      nodes:
        - id: round-anchor
          label: $1.0B financing anchor
          detail: RunPod and Summit announced a $100M growth investment.
        - id: adoption-proof
          label: Large company-reported usage
          detail: 1M+ developers, 20B+ requests, and 85% return-to-build are issuer claims.
        - id: price-proof
          label: Independent price advantage
          detail: RunPod was cheaper on 7 of 7 shared on-demand GPUs versus CoreWeave.
        - id: economics-gap
          label: Economics remain unverified
          detail: Margin, retention, burn, runway, debt, and capacity commitments are absent.
        - id: entry-gate
          label: Price discipline
          detail: Do not underwrite above the round mark without proportionate verified progress.
        - id: recommendation
          label: Research more
          detail: Require private financial, contractual, compliance, and cohort diligence.
    approximationNotes: >-
      Qualitative sequence only; node order expresses decision logic and does not assign numeric weights, probabilities,
      or conversion rates.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV009
      - CV013
      - CV016
