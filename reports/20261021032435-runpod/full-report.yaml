      - number: '6.2'
        title: Adoption is large, while cohort definitions remain opaque
        blocks:
          - type: paragraph
            body: >-
              June 2026 investor materials reported more than one million developers and more than 20 billion cumulative
              Serverless inference requests. The same disclosure reported a median of under one hour from sign-up to
              first workload, first-try success above 90%, and an 85% return-to-build rate among developers who deploy.
              These are useful activation and repeat-use signals, but the publisher did not define the observation
              window, eligible cohort, paid conversion, or whether "come back to build more" represents renewal.
              RunPod's September workload report covered 1.2 million users observed from April 2025 through August 2026
              and explicitly warned that units vary by finding and are not representative of all AI workloads. The
              report's claim that agent-created resources rose from 12% to 24% of revenue in one month suggests a new
              expansion surface, but the short comparison window is not evidence of durable retention.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
