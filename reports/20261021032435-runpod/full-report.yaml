      - number: '4.2'
        title: Metered consumption lowers adoption friction and exposes price pressure
        blocks:
          - type: paragraph
            body: >-
              Public evidence describes a consumption model rather than a fixed-seat subscription. Pods are billed while
              running, Serverless workers are billed for active execution, and persistent storage is priced separately.
              RunPod also promotes per-second pricing and no commitment minimums, which can shorten procurement and
              align spend with bursty AI workloads. The same flexibility makes revenue sensitive to utilization, GPU
              availability, idle-time management, and customer optimization. Independent October pricing snapshots show
              that price position depends on the comparison set: GPU Economy found RunPod cheaper than CoreWeave across
              seven shared on-demand GPUs, while GPUs.io found Vast.ai cheaper across 18 of 19 shared models. Realized
              discounts, support terms, region mix, and workload performance remain unknown.
            claimRefs:
