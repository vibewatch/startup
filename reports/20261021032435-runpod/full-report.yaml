    summary: RunPod moved from a 2022 developer-cloud launch to growth financing and company-reported nine-figure ARR in 2026.
    data:
      items:
        - date: '2022'
          label: RunPod launches
          detail: Independent profiles date launch to 2022 and identify Zhen Lu and Pardeep Singh as co-founders.
          tone: neutral
          claimRefs:
            - CO002
        - date: 2024-05
          label: Seed round
          detail: Sacra reports a $20 million seed round co-led by Intel Capital and Dell Technologies Capital.
          tone: positive
          claimRefs:
            - CO005
        - date: '2026-01-20'
          label: $120 million ARR announcement
          detail: RunPod's press index says the platform surpassed $120 million ARR.
          tone: positive
          claimRefs:
            - CO010
        - date: '2026-06-24'
          label: Growth financing and unicorn valuation
          detail: RunPod and Summit announce a $100 million growth investment at a $1.0 billion valuation.
          tone: positive
          claimRefs:
            - CO007
        - date: '2026-06-24'
          label: Developer and workload scale
          detail: >-
            Company-linked disclosures cite more than one million developers and over 20 billion cumulative Serverless
            requests.
          tone: positive
          claimRefs:
            - CO009
        - date: 2026-09
          label: Independent annualized-revenue estimate
          detail: Sacra estimates $325 million in annualized revenue for September 2026.
          tone: neutral
          claimRefs:
            - CO012
        - date: '2026-09-24'
          label: Enterprise platform expansion
          detail: RunPod announces new governance controls and ISO 27001 certification while expanding enterprise positioning.
          tone: positive
          claimRefs:
            - CO016
        - date: '2026-10-13'
