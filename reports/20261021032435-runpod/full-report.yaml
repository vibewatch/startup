  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Runpod's defensible market boundary is narrower than "AI infrastructure." Its core market is rented AI
              compute for builders who need control of hardware, containers, and deployment behavior without purchasing
              and operating a GPU estate. Persistent Pods, autoscaling Serverless endpoints, and multi-GPU Clusters
              cover development, training, fine-tuning, inference, and distributed runs; public model endpoints are an
              adjacent managed-access offer rather than the same product. Relevant substitutes include hyperscaler GPU
              instances, first-party GPU clouds, marketplace capacity, owned hardware, and fully managed model APIs. CPU
              sandboxes are outside the core boundary when orchestration or code execution calls a model hosted
              elsewhere and no accelerator sits in the critical path. This segmentation prevents general cloud or API
              spend from inflating the addressable market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM011
              - CM012
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports platform-scale indicators, not a market-size estimate. Runpod's
              company-issued Fall 2026 analysis covers 1.2 million users observed from April 1, 2025 through August 31,
              2026, while explicitly warning that its denominators vary and its findings are not representative of
              workloads on hyperscalers, private clusters, AI labs, or sovereign infrastructure. Summit Partners
              separately reports more than 20 billion cumulative Serverless inference requests, but this is an
              investor-issued operating metric rather than industry demand. Product breadth of more than 30 GPU SKUs
              across 31 regions indicates supply reach, not market value. No retained source supplies a methodologically
              comparable TAM, SAM, CAGR, or share denominator, so a precise dollar opportunity or obtainable share would
              be false precision.
            claimRefs:
              - CM001
              - CM006
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM006
              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The principal users are AI developers, machine-learning engineers, researchers, and startup infrastructure
              teams; the likely payer is the engineering or platform organization whose budget would otherwise fund
              cloud GPUs, model APIs, or owned hardware. Adoption can begin with a short Pod experiment, advance to
              fine-tuning or a long-running workload, and then move to Serverless or Clusters as traffic or model scale
              grows. Per-second billing, no stated commitment minimum, and scaling toward zero reduce the procurement
              threshold for bursty work. The economic trigger is workload fit: model size, VRAM, availability, latency,
              concurrency, storage, and duty cycle determine whether a lower hourly rate actually produces a lower bill.
              Public evidence does not disclose who signs enterprise contracts or how budget ownership varies by
              customer size.
            claimRefs:
              - CM003
              - CM011
              - CM012
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM009
              - CM011
              - CM012
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by scarcity and by developers' efforts to extract more useful work from each GPU.
              Runpod reports a 31% increase in B200 list prices from January through August 2026, rising quantization
              use as model size increases, hybrid deployments that combine local weights with frontier APIs, and
              agent-created resources reaching 24% of company revenue versus 12% one month earlier. These are
              company-platform observations, not independent market benchmarks, but they imply a shift from
              undifferentiated accelerator rental toward orchestration, workload matching, and automated provisioning.
              Constraints remain material: hardware availability, cold-start physics, workload-dependent concurrency,
              idle-instance leakage, variable support experiences, and limited independent performance data. Valuation
              should therefore reward proven usage and product breadth while discounting any top-down market multiple
              that assumes all AI compute spend is serviceable or that company telemetry represents the broader market.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform telemetry is not an industry denominator
            body: >-
              Runpod's usage report provides valuable current behavior data, but its own methodology states that
              findings describe Runpod activity and are not representative of all AI workloads.
            calloutType: risk
            claimRefs:
              - CM006
          - type: callout
            title: Underwrite from workload economics, not generic AI TAM
            body: >-
              Diligence should segment revenue and retention by Pods, Serverless, and Clusters, then test utilization,
              gross margin, capacity access, and competitive win rates before applying a market-growth multiple.
            calloutType: recommendation
            claimRefs:
