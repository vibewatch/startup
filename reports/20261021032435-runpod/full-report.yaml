      - number: '1.3'
        title: Financing, valuation, and operating scale
        blocks:
          - type: paragraph
            body: >-
              Sacra reports a $20 million May 2024 seed round co-led by Intel Capital and Dell Technologies Capital
              after approximately $2 million of earlier funding. RunPod and Summit Partners later announced a $100
              million growth investment in June 2026 at a $1.0 billion valuation. Adding those disclosed records implies
              at least $122 million raised, but that arithmetic is not cash available and does not capture debt,
              secondaries, fees, or any undisclosed transactions. Scale accelerated during 2026: company-linked sources
              reported more than one million developers and over 20 billion cumulative Serverless requests by June.
              Revenue evidence is directional, not audited: RunPod said ARR rose from $120 million in January to more
              than $325 million in October, while Sacra separately estimated $325 million in annualized revenue in
              September.
            claimRefs:
              - CO005
