    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              RunPod is a developer-focused AI infrastructure platform that lets users rent containerized GPU capacity
              rather than buy and operate hardware. Its current product architecture spans persistent Pods, autoscaling
              Serverless endpoints, and multi-GPU Clusters, covering experimentation, training, fine-tuning, and
              inference. Company materials claim more than 30 GPU SKUs and 31 global regions; those are platform
              disclosures rather than independently audited capacity figures. Independent profile evidence dates the
              launch to 2022 and identifies repurposed cryptocurrency-mining hardware as the origin. The retained
              evidence does not establish a legal headquarters, so the chapter does not promote a directory location
              into a verified corporate domicile.
            claimRefs:
