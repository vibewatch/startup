              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: Milestones and evidence tensions
        blocks:
          - type: paragraph
            body: >-
              The milestone sequence shows a rapid transition from a developer GPU rental product to a venture-backed
              platform with enterprise positioning. That trajectory is supported mainly by company, investor, and
              profile disclosures rather than filings. Independent reviews identify meaningful tradeoffs: variability in
              community-node reliability, limitations in pod-level multi-node networking, and weaker fit for regulated
              or SLA-dependent workloads. Current RunPod materials now claim InfiniBand-enabled Clusters and stronger
              compliance and service levels, creating a scope-and-vintage tension rather than a clean contradiction:
              reviews may describe community Pods or an earlier product, while current claims may apply only to Secure
              Cloud, Clusters, or enterprise contracts. Contract-level SLA, certification, incident, and
              regional-coverage evidence is required to resolve the distinction.
            claimRefs:
