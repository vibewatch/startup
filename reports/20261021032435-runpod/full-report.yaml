            - Pods
          detail: Investor disclosure reports a median of under one hour from sign-up to a running workload.
        - label: Experiment and train
          actor: ML engineer or research team
          touchpoints:
            - Persistent Pods
            - Network storage
          detail: Named evidence includes Deep Cogito's completed model-training program.
        - label: Deploy inference
          actor: AI startup platform team
          touchpoints:
            - Serverless endpoints
            - Autoscaling workers
          detail: The platform reports more than 20 billion cumulative Serverless requests.
        - label: Operate at production scale
          actor: Application team
          touchpoints:
            - Burst capacity
            - Monitoring
          detail: A company-hosted testimonial reports scaling a live application beyond 1,000 requests per second.
        - label: Return and expand
          actor: Deployed developer
          touchpoints:
