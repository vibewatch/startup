      - number: '4.3'
        title: New financing extends capacity, but does not establish runway
        blocks:
          - type: paragraph
            body: >-
              RunPod announced a $100 million growth investment in June 2026 at a reported $1.0 billion valuation. The
              company said the proceeds would fund platform and developer-experience investment, team expansion across
              engineering and developer relations, and broader global access. This is evidence of financing access and
              an intended spending plan, not evidence of cash currently available after closing costs, prior
              obligations, or subsequent deployment. None of the retained sources provides gross margin, cash balance,
              burn rate, or runway. Capital adequacy therefore cannot be assessed without management financials,
              GPU-capacity commitments, debt or lease obligations, working-capital terms, and a monthly liquidity
              forecast.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: 'Financial verdict: attractive growth signals, incomplete underwriting'
        blocks:
          - type: paragraph
            body: >-
              The strongest public signals are rapid recurring-revenue growth, reported customer expansion, high
              platform activity, and a low-friction metered model. Revenue quality nevertheless depends on workload
              persistence, capacity availability, pricing discipline, and whether gross profit survives GPU, power,
              networking, storage, support, and partner costs. External pricing comparisons show both a favorable
              position against CoreWeave and an unfavorable raw-price position against Vast.ai, implying that RunPod
              must defend a managed-platform premium rather than win every workload on price. Investment underwriting
              should remain conditional on a revenue bridge from billed usage to recognized revenue, cohort retention by
              segment, gross margin by product, customer concentration, committed-capacity economics, and a cash-runway
              model.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI010
              - CI011
              - CI016
