      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              RunPod's defensibility appears to rest on developer distribution, a broad GPU catalog, and a workflow that
              spans experimentation through production rather than on exclusive hardware. The investor-issued
              announcement of a $100 million growth investment and more than one million developers supports scale, but
              it is not independent proof of retention or service quality. Adverse evidence is more concrete around
              capacity variability and multi-node suitability: third-party comparisons report spiky Community Cloud
              availability and favor Lambda for larger InfiniBand training jobs, while RunPod now claims clusters of
              more than 200 GPUs with InfiniBand. That tension makes independently measured uptime, cluster throughput,
              support response, and compliance scope the decisive diligence items.
            claimRefs:
              - CP009
              - CP010
