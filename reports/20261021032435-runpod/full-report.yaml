      - number: '3.3'
        title: Pricing and packaging evidence
        blocks:
          - type: paragraph
            body: >-
              Published May 2026 comparisons put RunPod Community between Vast.ai's lowest marketplace offers and
              Lambda's managed datacenter pricing. For example, one comparison listed RTX 4090 capacity at $0.34 per
              hour on RunPod versus $0.27-$0.36 on Vast.ai, while A100 80 GB pricing was $1.64 on RunPod, $0.67-$1.89 on
              Vast.ai, and $2.49 on Lambda. These are dated observations, not October quotes: availability, region, host
              quality, storage, interruption risk, and workload duration can dominate the headline rate. RunPod's
              serverless scale-to-zero model also makes hourly comparisons incomplete for intermittent inference.
            claimRefs:
