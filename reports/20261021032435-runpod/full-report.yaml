              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and positioning
        blocks:
          - type: paragraph
            body: >-
              The relevant market is wider than hourly GPU rental. Direct alternatives include Lambda and Hyperstack for
              managed instances, Vast.ai for marketplace capacity, CoreWeave for enterprise-scale reserved
              infrastructure, and Modal or Baseten for serverless endpoints. Together AI competes by removing GPU
              management entirely, while hyperscalers and internal infrastructure remain substitutes when integrated
              identity, governance, procurement, or control outweigh price. RunPod differentiates by combining
              persistent compute, serverless endpoints, and clusters in one developer-facing platform. The positioning
              map is therefore an ordinal workload-fit view, not an independently measured performance ranking.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP016
