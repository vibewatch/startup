        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              The $100 million growth investment improves financing capacity, but public evidence does not disclose
              closing proceeds, existing cash, burn, debt, capacity commitments, or post-financing runway.
            calloutType: risk
            claimRefs:
              - CI012
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflows
        blocks:
          - type: paragraph
            body: >-
              RunPod's product is organized around three compute modes rather than a single GPU rental SKU. Pods provide
              persistent, container-based environments for development, fine-tuning, and long-running jobs; Serverless
              packages a worker image behind an autoscaling endpoint for bursty inference; and Clusters target multi-GPU
              training and large-batch inference. Network volumes provide the persistent state needed to move
              checkpoints and model weights across compute lifecycles. This gives a developer a plausible path from
              experiment to production without changing vendors, which is the central product differentiation claimed by
              both RunPod and outside coverage. The workflow is most compelling when demand changes shape over time: a
              team can validate on a Pod, deploy variable traffic on Serverless, and reserve clustered capacity for
              distributed training. The principal diligence issue is not whether these modules exist, but whether their
              handoffs, billing boundaries, and support obligations remain predictable at production scale.
            claimRefs:
              - CE001
              - CE005
              - CE009
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE011
              - CE012
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE009
              - CE011
              - CE015
      - number: '5.2'
        title: Operating architecture and maturity signals
        blocks:
          - type: paragraph
            body: >-
              The visible architecture is a managed control plane over a broad GPU catalog, regional capacity, queueing
              and autoscaling, persistent storage, and multiple compute modes. RunPod says Serverless can scale from
              zero to thousands of workers with sub-200 millisecond cold starts, while its investor announcement reports
              more than 20 billion inference requests, a median time to first workload below one hour, first-try
              deployment success above 90%, and an 85% return rate among developers who deploy. These are useful
              maturity indicators but remain company- or investor-issued operating metrics without disclosed
              methodology, cohort definitions, or independent audit. Current catalog trackers corroborate breadth and
              price competitiveness: GPUs.io listed 30 GPU types and 25 configurations, while GPUEconomy found RunPod
              cheaper on all seven on-demand GPUs shared with CoreWeave on October 21, 2026. Catalog breadth and pricing
              do not, however, prove capacity availability, throughput, interconnect quality, or workload-level
              reliability.
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE008
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE007
              - CE009
              - CE010
      - number: '5.3'
        title: Trust, reliability, and technical diligence
        blocks:
          - type: paragraph
            body: >-
              RunPod states that it is SOC 2 Type II certified, HIPAA and GDPR compliant, and offers enterprise
              agreements with a 99.99% uptime SLA, dedicated capacity, and tailored terms. The same official page
              cautions that compliance coverage can vary by region and deployment model. That qualification matters
              because the product spans different compute modes and capacity sources. A June 2026 commercial review had
              still rated RunPod weak for production uptime guarantees and poor for regulated or sensitive data,
              indicating either a subsequent enterprise-product expansion or a scope difference that cannot be resolved
              from the assigned evidence. Before underwriting regulated or mission-critical use, diligence should obtain
              the current SOC report, BAA and DPA templates, SLA exclusions, subprocessor and data-residency lists,
              incident history, recovery objectives, and separate control matrices for Serverless, Pods, Clusters,
              Secure Cloud, and any community capacity. No assigned source provides an independently measured uptime
              series, security-test result, or public package/repository activity signal.
            claimRefs:
              - CE004
              - CE006
              - CE010
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: One platform spans distinct workload shapes
            body: >-
              Persistent development, bursty inference, and distributed training are exposed as separate products but
              share one vendor and GPU catalog, reducing replatforming friction if the operational handoffs work as
              claimed.
            calloutType: strength
            claimRefs:
              - CE001
              - CE009
              - CE015
          - type: callout
            title: Enterprise controls require scope-level verification
            body: >-
              Certification and SLA claims are company-issued, explicitly vary by deployment model or region, and are
              not accompanied in the assigned evidence by independent uptime, incident, recovery, or control-testing
              data.
            calloutType: risk
            claimRefs:
              - CE004
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: A broad developer funnel, with limited commercial segmentation
        blocks:
          - type: paragraph
            body: >-
              RunPod's public customer surface spans self-paying independent developers, small AI teams, production
              inference startups, open-model builders, and enterprise-oriented workloads. Independent reviews
              consistently place the platform between low-cost marketplaces and hyperscalers: developers receive more
              control than a closed model API and less operational burden than raw GPU rentals. RunPod's own product
              design reinforces that breadth through Pods for experimentation, Serverless for variable production
              traffic, and Clusters for larger training jobs. The breadth is strategically useful because one account
              can support a customer's progression from experiment to production, but public evidence does not disclose
              revenue by segment, buyer type, geography, company size, or workload. More than one million developers is
              therefore a top-of-funnel scale indicator, not a count of paying enterprises or retained production
              customers.
            claimRefs:
              - CU001
