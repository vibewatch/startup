  topStrengths:
    - 公司自报 ARR 在 2026 年 10 月超过 $325 million；独立估算显示，9 月年化收入为 $325 million。
    - 超过 100 万名开发者和累计超过 20 billion 次 Serverless 请求，说明平台已有较大规模的采用。
    - Pods、Serverless 和 Clusters 覆盖了较完整的开发者工作流；当前价格快照显示，在共享按需 GPU 上，RunPod 价格优于 CoreWeave。
  topRisks:
    - 毛利率、贡献毛利率、现金消耗、现金跑道、债务和基础设施承诺均未公开披露。
    - 独立评测指出，不同层级在可靠性、GPU 可用性、冷启动和失败工作负载计费方面存在问题。
    - 合规认证、SLA 范围、事故记录和控制有效性，仍需按产品和地区核验一手文件。
    - 客户集中度、付费转化率、流失率、合同期限和 cohort 留存数据仍不可得。
  unresolvedGaps:
    - 获取经审计或管理层认证的收入、ARR 对账、产品层面毛利率、现金、消耗、债务、产能承诺和现金跑道数据。
    - 核验客户层面的 NRR、GRR、流失率、付费转化率、合同期限、企业客户占比和头部账户集中度。
    - 检查 uptime 和事故记录、SLA 达成情况及补救措施、当前审计材料、合规范围和各地区控制覆盖情况。
    - 审阅股权结构表、清算优先权、投票权、完整董事会名单和创始人继任安排。
    - 采用口径匹配的收入定义、利润率、资本密集度、稀释情况和经核验的交易证据，建立可比估值和退出分析。
