callouts:
  - calloutType: "recommendation"
    title: "Price-sensitive conclusion"
    body: >-
      Treat $1.0 billion as a financing reference, not a validated fair value.
      Progress to underwriting only after private evidence supports revenue quality,
      margins, retention, capital needs, preferences, and a credible exit return.
    claimRefs: [CV001, CV016]
