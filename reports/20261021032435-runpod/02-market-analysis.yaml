figures:
  - id: FM001
    title: Evidence-constrained addressability filters
    type: pyramid
    summary: >-
      A qualitative sequence for narrowing broad AI-compute demand to workloads that
      match Runpod; layer order reflects applicability filters, not market magnitude.
    data:
      items:
        - label: Broad AI and compute demand
          value: "No retained market total"
          detail: "Includes spend that may never require rented GPUs."
        - label: GPU-intensive workloads
          value: "Training, fine-tuning, inference, and batch compute"
          detail: "Excludes CPU-only orchestration and ordinary application hosting."
        - label: Rent-versus-own decision
          value: "On-demand or metered capacity"
          detail: "Applies where flexibility outweighs owned-hardware economics."
        - label: Control-versus-managed-API decision
          value: "Customer-selected hardware, containers, and models"
          detail: "Excludes buyers satisfied by black-box model APIs."
        - label: Runpod product-mode fit
          value: "Pods, Serverless, or Clusters"
          detail: "The workload must match persistence, latency, scale, and interruption needs."
        - label: Obtainable workload
          value: "Unmeasured"
          detail: "Requires competitive win rates, capacity, retention, pricing, and budget evidence not in the assigned pool."
    approximationNotes: >-
      Conceptual filtering sequence only; it is not a value-proportional TAM/SAM/SOM
      pyramid and does not imply conversion rates or nested dollar amounts.
    claimRefs: [CM003, CM004, CM005, CM011, CM012]
callouts:
  - calloutType: risk
    title: Platform telemetry is not an industry denominator
    body: >-
      Runpod's usage report provides valuable current behavior data, but its own
      methodology states that findings describe Runpod activity and are not
      representative of all AI workloads.
    claimRefs: [CM006]
  - calloutType: recommendation
    title: Underwrite from workload economics, not generic AI TAM
    body: >-
      Diligence should segment revenue and retention by Pods, Serverless, and Clusters,
      then test utilization, gross margin, capacity access, and competitive win rates
      before applying a market-growth multiple.
    claimRefs: [CM001, CM012, CM013]
