  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        An independent, methodologically transparent estimate of AI GPU cloud spend
        segmented by workload, geography, deployment model, and buyer, plus Runpod
        revenue by those same segments.
      whyItMatters: >-
        Without a comparable denominator and company revenue split, platform users,
        requests, SKUs, and regions cannot establish TAM, SAM, SOM, market share, or a
        defensible growth-rate assumption.
      diligencePath: >-
        Obtain independent analyst or public-company market data and reconcile it to
        management revenue cohorts, capacity utilization, retention, pricing, and
        competitive win-loss records.
      relatedQuestionRefs: [QM002]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-budget-ownership
      missingEvidence: >-
        Customer-level procurement records identifying economic buyers, budget owners,
        contract size, sales cycle, workload migration path, and renewal behavior.
      whyItMatters: >-
        Functional user personas do not show whether Runpod can move from self-serve
        developer spend into durable enterprise infrastructure budgets.
      diligencePath: >-
        Review anonymized customer cohorts and interview buyers across self-serve,
        startup, and enterprise segments using a consistent procurement questionnaire.
      relatedQuestionRefs: [QM003]
    - type: missing-source
      severity: material
      topic: independent-performance
      missingEvidence: >-
        Workload-matched independent benchmarks for cold start, throughput,
        availability, storage, network performance, and total cost across Runpod and
        relevant alternatives.
      whyItMatters: >-
        Adoption and valuation depend on delivered workload economics, while current
        public evidence is dominated by company claims, affiliate reviews, and
        competitor-authored comparisons.
      diligencePath: >-
        Commission repeatable benchmarks using representative model sizes, regions,
        concurrency levels, and failure conditions, then reconcile results to invoices.
      relatedQuestionRefs: [QM006, QM007]
