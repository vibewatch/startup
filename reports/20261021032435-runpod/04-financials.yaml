company:
  name: "RunPod"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    RunPod reported $120 million of ARR in January 2026, 90% year-over-year
    revenue growth, and 120% net dollar retention, while a June third-party
    profile described an approximately $240 million annualized revenue run rate.
    The metered, no-commitment model shows strong usage expansion but leaves
    gross margin, cash burn, runway, customer concentration, and realized unit
    economics unavailable for underwriting.
sections:
  - id: "revenue-traction-and-quality"
    title: "Revenue traction is strong, but metric reconciliation is required"
    body: >-
      RunPod's January 2026 release reported that ARR had surpassed $120
      million, revenue had grown 90% year over year, and net dollar retention
      had reached 120%. Those company-issued indicators point to meaningful
      recurring usage and expansion within existing accounts, but they are not
      audited financial statements. By June, AI Engineer described an
      approximately $240 million annualized revenue run rate rather than ARR.
      That later metric may indicate rapid growth, but the denominator,
      measurement date, and revenue-recognition basis are not disclosed, so it
      should not be substituted for ARR without management reconciliation.
      Company and investor releases also reported more than one million
      developers and over 20 billion cumulative Serverless inference requests;
      these are activity indicators, not revenue or margin measures.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI015"
    tableRefs:
      - "TI003"
  - id: "monetization-and-price-position"
    title: "Metered consumption lowers adoption friction and exposes price pressure"
    body: >-
      Public evidence describes a consumption model rather than a fixed-seat
      subscription. Pods are billed while running, Serverless workers are
      billed for active execution, and persistent storage is priced
      separately. RunPod also promotes per-second pricing and no commitment
      minimums, which can shorten procurement and align spend with bursty AI
      workloads. The same flexibility makes revenue sensitive to utilization,
      GPU availability, idle-time management, and customer optimization.
      Independent October pricing snapshots show that price position depends
      on the comparison set: GPU Economy found RunPod cheaper than CoreWeave
      across seven shared on-demand GPUs, while GPUs.io found Vast.ai cheaper
      across 18 of 19 shared models. Realized discounts, support terms, region
      mix, and workload performance remain unknown.
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy"
    title: "New financing extends capacity, but does not establish runway"
    body: >-
      RunPod announced a $100 million growth investment in June 2026 at a
      reported $1.0 billion valuation. The company said the proceeds would fund
      platform and developer-experience investment, team expansion across
      engineering and developer relations, and broader global access. This is
      evidence of financing access and an intended spending plan, not evidence
      of cash currently available after closing costs, prior obligations, or
      subsequent deployment. None of the retained sources provides gross
      margin, cash balance, burn rate, or runway. Capital adequacy therefore
      cannot be assessed without management financials, GPU-capacity
      commitments, debt or lease obligations, working-capital terms, and a
      monthly liquidity forecast.
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI016"
  - id: "financial-verdict"
    title: "Financial verdict: attractive growth signals, incomplete underwriting"
    body: >-
      The strongest public signals are rapid recurring-revenue growth, reported
      customer expansion, high platform activity, and a low-friction metered
      model. Revenue quality nevertheless depends on workload persistence,
      capacity availability, pricing discipline, and whether gross profit
      survives GPU, power, networking, storage, support, and partner costs.
      External pricing comparisons show both a favorable position against
      CoreWeave and an unfavorable raw-price position against Vast.ai, implying
      that RunPod must defend a managed-platform premium rather than win every
      workload on price. Investment underwriting should remain conditional on
      a revenue bridge from billed usage to recognized revenue, cohort
      retention by segment, gross margin by product, customer concentration,
      committed-capacity economics, and a cash-runway model.
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI004"
      - "CI010"
      - "CI011"
      - "CI016"
