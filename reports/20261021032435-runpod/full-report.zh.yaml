    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              RunPod 是面向开发者的 AI 基础设施平台，让用户租用容器化 GPU 容量，而不是购买和运营硬件。当前产品架构覆盖持久型 Pods、自动扩缩容 Serverless 端点和多 GPU
              Clusters，支持试验、训练、微调和推理。公司材料声称拥有超过 30 个 GPU SKU、覆盖 31 个全球地区；这些是平台披露，并非独立审计的容量数据。独立简介将其上线时间追溯至 2022
              年，并指出改造加密货币挖矿硬件是其起点。现有证据无法确认法定总部，因此本章不会把目录中的地点升级为已核实的公司注册地。
