      - number: '3.4'
        title: 护城河韧性与替代风险
        blocks:
          - type: paragraph
            body: >-
              RunPod 的防御力似乎来自开发者分发、广泛的 GPU 目录，以及覆盖从试验到生产的工作流，而不是独占硬件。投资人发布的公告提到一笔 $100 million 成长投资和超过 one million
              名开发者，说明规模已形成，但这不是留存或服务质量的独立证明。更具体的反向证据集中在容量波动和多节点适配性：第三方比较称 Community Cloud 可用性波动明显，并更倾向于用 Lambda 承载大型
              InfiniBand 训练任务；RunPod 当前则声称 Clusters 支持超过 200 GPUs 和 InfiniBand。这样的张力意味着，独立测量的
              uptime、集群吞吐、支持响应和合规范围都是关键尽调项目。
            claimRefs:
