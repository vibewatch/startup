  - id: TV002
    title: 正反论点
    columns:
      - 立场
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 正论
        - 开发者采用可支撑持久的自助分发优势。
        - RunPod 报告称有 1M+ 名开发者，且 85% 的部署开发者会回访。
        - 独立队列留存和付费客户转化低于预期。
      - - 正论
        - 广泛供给和有竞争力的按需价格，有望赢得价格敏感型 AI 工作负载。
        - RunPod 宣称提供 30 多种 GPU SKU；GPU Economy 发现，在双方共有的 7 种型号中，RunPod 的价格均低于 CoreWeave。
        - 把可用性、支持、网络和存储纳入比较后，同等服务价格将失去优势。
      - - 反论
        - 更低的公开标价可能掩盖较弱的利润率或资本效率。
        - 保留的公开来源未能证明毛利率、现金消耗、资金续航或容量义务。
        - 经审计的单位经济性显示贡献利润可持续、承诺可控。
      - - 反论
        - 企业就绪度可能落后于客户要求。
        - 6 月的一次评审提出 SLA 和受监管数据方面的限制；RunPod 目前对合规和 SLA 作出更强的声明。
        - 最新第三方鉴证、SLA 历史记录和受监管客户案例能够解释并弥合这一差距。
    notes: 公司报告的使用量和合规声明不视为独立验证；企业就绪度一行反映了随时间变化的证据冲突。
    claimRefs:
