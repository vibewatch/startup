        title: 按量消费降低采用摩擦，也暴露价格压力
        blocks:
          - type: paragraph
            body: >-
              公开证据描述的是消费模式，而不是固定席位订阅。Pods 在运行期间计费，Serverless 工作进程按实际执行计费，持久型存储单独定价。RunPod
              还主打按秒计费和无最低承诺，这既能缩短采购流程，也能让支出匹配突发型 AI 工作负载。但同样的灵活性也让收入对利用率、GPU 可用性、闲置管理和客户优化更敏感。10
              月的独立价格快照显示，价格位置取决于比较对象：GPU Economy 发现 RunPod 在 7 款共同的按需 GPU 上都比 CoreWeave 便宜；GPUs.io 则发现 Vast.ai 在 19
              款共同型号中的 18 款更便宜。实际折扣、支持条款、地区组合和工作负载性能仍未知。
