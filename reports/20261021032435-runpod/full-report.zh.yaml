  - id: TV001
    title: 建议总结
    columns:
      - 决策字段
      - 当前判断
      - 证据基础
      - 投资含义
    rows:
      - - 建议
        - 继续研究
        - $1.0B 融资估值标记已公开，但核心经济性尚不明确。
        - 仅凭公开证据不应给出买入建议。
      - - 置信度
        - 中
        - 轮次条款得到公司和投资者确认；运营指标大多是公司口径或二手报道
        - 在作出投资判断前，要求提供源文件和群体数据。
      - - 风险评级
        - 中高
        - 定价竞争、基础设施经济性和企业就绪度证据仍不完整。
        - 设置明确的财务、容量和合规交割条件。
      - - 估值判断
        - 高于本轮估值的部分尚无法判断
        - 最新有证据支撑的锚点为 $1.0B；一则二手来源称其约为已报告 ARR 的 4 倍。
        - 除非经核实的经营经济性已有改善，否则优先按该估值或更低价格进入。
      - - 回报 / 持有 / 退出
        - 缺乏公开证据支撑
        - 据报道存在收购兴趣，但细节不足以确定估值、时间或退出所得。
        - 只有在获得条款、稀释、优先权和退出证据后，才建模回报。
    notes: 决策区间以 2026 年 6 月融资估值为参考，而非经审计的内在价值；未根据未披露的私营公司指标推导精确回报区间。
