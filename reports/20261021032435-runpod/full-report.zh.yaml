      - number: '3.3'
        title: 定价与套餐证据
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月公布的比较显示，RunPod Community 的价格位于 Vast.ai 最低市场报价和 Lambda 托管数据中心价格之间。例如，一项比较将 RTX 4090 容量列为 RunPod
              $0.34 /小时，Vast.ai 为 $0.27-$0.36 /小时；A100 80 GB 的价格则是 RunPod $1.64、Vast.ai $0.67-$1.89、Lambda $2.49
              /小时。这些是有日期的观察，不是 10 月报价；可用性、地区、主机质量、存储、中断风险和工作负载时长都可能压过表面费率。RunPod 的 Serverless 缩容至零模式，也使按小时比较无法完整反映间歇性推理。
            claimRefs:
              - CP004
