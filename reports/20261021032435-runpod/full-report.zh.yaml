              个月的供应商级 uptime 和事故数据与各项合同 SLO 对账，检查 SLA 积分和除外条款，核验审计范围与日期，按运营方和地区梳理关键 GPU
              供给，并将现金与月度烧钱和已承诺基础设施支出对账。论点失效触发器包括管理层无法提供这些记录、合同服务水平反复违约且未补救、发生重大安全事件却没有补救证据、关键 SKU
              容量丧失且没有经过测试的替代方案，或融资计划不足以支撑合同义务。这些是尽调条件，不是对任何事件已经发生的断言。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
              - CR015
              - CR016
      - number: '7.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 可靠性证据必须按层级区分
            body: Community Cloud 中断、Secure Cloud 性能、Serverless 行为和企业合同 uptime 不应混成一个平台整体可靠性统计。
            calloutType: risk
            claimRefs:
              - CR002
              - CR004
              - CR005
          - type: callout
            title: 把一手证据设为交割前条件
            body: 在判断任务关键型企业扩张前，应要求审计材料、事故日志、SLA 达成情况、供应商集中度和经过核对的现金消耗表。
            calloutType: recommendation
            claimRefs:
              - CR010
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              建议是“继续研究”，置信度中等，风险评级为中高。RunPod 和 Summit Partners 宣布一笔 $100 million 成长投资，估值为 $1.0 billion；Indexed.vc
              记录两轮融资合计 $120 million。这些事实确立了当前融资参考点，不是经过独立检验的内在价值。ValueAdd 将该轮描述为其报告的 $240 million ARR 的约四倍，但官方融资公告没有披露这一
              ARR，不能把它当作经审计收入。在私下尽调核实经常性收入质量、毛利率、队列留存、基础设施承诺、烧钱速度、现金跑道、债务和清算优先权前，入场价格应锚定在 2026 年 6
              月这一轮估值或其下方。公开证据不足以确定目标回报、持有期或精确估值区间。
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV011
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
              - CV013
              - CV016
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在已观察到的融资支持和公司报告的平台使用量上，而不是已披露的盈利能力上。RunPod 称平台用户超过 one million，Serverless 已处理超过 20 billion
              次推理请求，部署开发者中有 85% 会回来继续构建；当前官网还宣传超过 30 个 GPU SKU、覆盖 31 个地区。独立方面，GPU Economy 发现 2026 年 10 月 21 日 RunPod 在 7
              款共同 GPU 上的按需费率低于 CoreWeave。反论点是，价格优势可以与较弱的单位经济性并存；OpenSourcesAI 指出，当唯一变量是原始 GPU 小时成本时，Vast.ai
              可能更便宜。该评测还提出企业 SLA 和受监管数据方面的局限，而 RunPod 当前又声称具备合规认证和企业 99.99% SLA。时间与发布方不一致，要求进行当前的独立核验，不能假定任一说法已经解决问题。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.3'
        title: 情景、可比公司与退出准备度
        blocks:
          - type: paragraph
            body: >-
              最新的 $1.0 billion 融资估值，是现有来源中唯一有直接证据支持的当前估值锚点。ValueAdd 将 RunPod 与 CoreWeave、Lambda、Crusoe 和 Together AI
              放在一起比较，但没有提供完整可比的公开交易倍数、利润率、资本强度或收入定义。GPU Economy 提供的是与 CoreWeave
              的运营价格比较，不是企业价值基准。因此，悲观、基准和乐观情景应围绕该轮估值表达为决策区间，而不是制造虚假的精确点估计。VFF 报告称 RunPod 拒绝过未具体说明的收购要约；ValueAdd 给出超过 $500
              million 的金额，但公司公告没有佐证。这说明可能存在战略兴趣，却不能支持退出底价、时间假设或目标回报。
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              估值决策应要求月度 ARR 与确认收入桥接表、Pods 和 Serverless
              分产品毛利率、利用率与闲置容量经济性、客户和开发者队列留存、集中度、已签署容量承诺、债务与租赁义务、现金跑道、资本表优先权以及董事会批准的预测。商业尽调应在匹配服务水平下复现 GPU
              价格比较，并检验较低挂牌价格在加入支持、存储、网络、可用性和预留容量调整后是否仍然成立。如果经核实的经常性收入明显低于报告的年化水平、留存或贡献毛利较弱、容量义务造成融资压力、当前合规和 SLA
              声明无法证实，或拟议入场价格高于最新一轮却没有相称的运营改善证据，投资论点就会失效。
            claimRefs:
              - CV005
              - CV009
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 把 $1.0 billion 当作融资参考点，而不是经过验证的公允价值。只有在私人证据支持收入质量、利润率、留存、资本需求、优先权和可信退出回报后，才推进投资判断。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV016
