        title: 新融资扩大容量，但不能证明现金跑道
        blocks:
          - type: paragraph
            body: >-
              RunPod 宣布 2026 年 6 月获得 $100 million 成长投资，外部报道的估值为 $1.0
              billion。公司表示，资金将用于平台和开发者体验投入、扩大工程与开发者关系团队，以及拓展全球覆盖。这说明融资渠道和计划中的支出方向，但不能证明扣除交割成本、既有义务或后续部署后仍有可用现金。现有来源没有提供毛利率、现金余额、烧钱速度或现金跑道。没有管理层财务数据、GPU
