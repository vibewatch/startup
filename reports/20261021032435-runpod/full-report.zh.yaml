      - number: '5.3'
        title: 信任、可靠性与技术尽调
        blocks:
          - type: paragraph
            body: >-
              RunPod 表示已获得 SOC 2 Type II 认证、符合 HIPAA 和 GDPR，并提供包含 99.99% uptime
              SLA、专用容量和定制条款的企业协议。同一官方页面也提醒，合规覆盖范围可能随地区和部署模式变化。这一点很重要，因为产品横跨不同算力模式和容量来源。2026 年 6 月的一份商业评测仍认为 RunPod 生产
              uptime 保证较弱，对受监管或敏感数据的适配性较差；这可能意味着后来推出了企业产品，也可能只是范围不同，现有证据无法解决。对受监管或任务关键型用途进行投资判断前，应取得最新 SOC 报告、BAA 和 DPA
              模板、SLA 除外条款、子处理方和数据驻留清单、事故历史、恢复目标，以及针对 Serverless、Pods、Clusters、Secure Cloud 和任何社区容量的独立控制矩阵。现有证据没有提供独立测量的
              uptime 序列、安全测试结果或公开的软件包 / 代码库活动信号。
            claimRefs:
              - CE004
              - CE006
              - CE010
