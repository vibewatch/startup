      - CV003
      - CV004
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV016
  - id: TV003
    title: 乐观、基准和悲观决策情景
    columns:
      - 情景
      - 经营假设
      - 估值 / 回报区间
      - 概率信号
      - 下行或上行触发因素
    rows:
      - - 乐观
        - 已报告的使用量转化为持久的付费留存；价格优势与强劲利润率并存；企业相关声称得到独立验证。
        - 只有在经营表现获得相称且经核实的改善后，估值才支持高于 $1.0B；没有公开证据能支撑上限。
        - 在审阅经审计 ARR、利润率、留存和承诺前，不分配概率。
        - 独立指标确认增长质量和可信的退出路径。
      - - 基准
        - 平台使用量和定价仍具竞争力，但经济性和企业级证据仍不完整。
        - 约等于或低于 $1.0B 的本轮估值；没有公开证据能支撑区间宽度。
        - 与当前混合证据集最为一致，但尚未量化。
        - 私下尽调补齐财务和合同缺口，同时不削弱已报告的规模。
      - - 悲观
        - 已报告的年化收入高估了可持续的经常性经济性，利润率偏薄，或容量与合规约束拖慢增长。
        - 低于 $1.0B；没有公开证据能支撑估值下限，据报道的收购兴趣也不是估值下限。
        - 若财务披露、留存或企业验证令人失望，概率上升。
        - 贡献利润率偏弱、留存不佳、融资压力，或 SLA / 合规验证失败。
    notes: 这些是围绕最新融资估值的定性决策区间，而非概率加权估值；私营公司的财务和股权结构表证据均缺失，无法得出精确区间或目标回报。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV009
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
