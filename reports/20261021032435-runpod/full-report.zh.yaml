      - number: '4.4'
        title: 财务结论：增长信号有吸引力，但投资判断信息不完整
        blocks:
          - type: paragraph
            body: >-
              最强的公开信号包括经常性收入快速增长、据报道的客户扩张、较高的平台活动，以及低摩擦的按量计费模式。但收入质量取决于工作负载是否持续、容量是否可用、定价是否有纪律，以及毛利能否覆盖
              GPU、电力、网络、存储、支持和合作方成本。外部价格比较同时显示 RunPod 相对 CoreWeave 有利、相对 Vast.ai 的原始价格不利；RunPod
              因而必须守住托管平台溢价，而不是在每类工作负载上都靠低价取胜。投资判断应以这些条件为前提：从计费使用量到确认收入的桥接表、按细分市场划分的客户留存、按产品划分的毛利率、客户集中度、承诺容量的经济性，以及现金跑道模型。
