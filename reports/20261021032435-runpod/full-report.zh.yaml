      - number: '3.2'
        title: 能力、分发与信任标准
        blocks:
          - type: paragraph
            body: >-
              RunPod 已有最强公开证据支持的能力，是让自定义容器、持久型 Pods 和自动扩缩容 Serverless
              连续衔接。官方材料描述了基于队列和负载均衡的端点、缩容至零、预热工作进程、按秒计费，以及更完整的集群产品。这样的广度让工作负载从开发转向推理时无需跨平台迁移。代价是，专业竞争对手仍有更清晰的优势：Lambda
              擅长托管多节点训练，Vast.ai 提供更低的市场价格底线，Together AI 抽象了模型 API，超大规模云则拥有成熟的企业控制平面。由于现有证据没有覆盖所有供应商的标准化基准，这些比较只能说明方向。
