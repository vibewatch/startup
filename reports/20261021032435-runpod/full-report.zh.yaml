              联合创始人 Zhen Lu 和 Pardeep Singh 仍分别担任 CEO 和 CTO，是公开可见的产品与技术负责人。RunPod 于 2026 年 10 月宣布 Brian Erickson 出任
              CFO，在 6 月成长轮之后补充财务领导层。Summit Partners 董事总经理 Michael Medici
