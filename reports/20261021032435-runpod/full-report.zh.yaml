            - Serverless
            - Clusters
          detail: 持久化、自动扩缩容和分布式计算模式分别应对不同需求形态。
        - label: 平台编排
          items:
            - API 与控制台
            - 作业队列
            - 自动扩缩容与故障转移
          detail: 托管控制平面将资源配置和工作负载分发抽象化。
        - label: 计算容量
          items:
            - 预留容量
            - 竞价容量
            - 广泛的 GPU 目录
          detail: 可用性和性能取决于 GPU 供给、区域和部署模式。
        - label: 数据平面
          items:
            - 网络卷
            - 模型权重
            - 检查点与 Agent 状态
          detail: 持久化状态支持跨计算生命周期迁移。
        - label: 信任与运营
          items:
            - 合规控制
            - SLA 与支持
            - 监控与事件响应
          detail: 企业级保障需要按合同、区域和产品分别验证。
    approximationNotes: 这是根据公开描述拼出的功能栈，并非声称 RunPod 未披露的内部拓扑或控制平面实现。
    claimRefs:
      - CE001
      - CE009
      - CE011
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据支持从自助发现到重复构建的路径，但付费续约和账户扩张仍未量化。
    data:
      items:
        - label: 自助发现
          actor: 独立开发者或小型 AI 团队
          touchpoints:
            - 透明的使用定价
            - 广泛的 GPU 目录
          detail: 独立评测将偶发的高显存工作负载列为核心切入用例。
        - label: 首个工作负载
          actor: 新开发者
          touchpoints:
            - 模板
            - Pods
          detail: 投资者披露称，从注册到工作负载运行的中位时间不到一小时。
        - label: 实验与训练
          actor: ML 工程师或研究团队
          touchpoints:
            - 持久化 Pods
            - 网络存储
          detail: 具名证据包括 Deep Cogito 已完成的模型训练项目。
        - label: 部署推理
          actor: AI 初创公司平台团队
          touchpoints:
            - Serverless 端点
            - 自动扩缩容工作进程
          detail: 平台报告 Serverless 请求累计超过 200 亿次。
        - label: 以生产规模运营
          actor: 应用团队
          touchpoints:
            - 突发容量
            - 监控
          detail: 公司托管的客户证言称，一款在线应用已扩展到每秒超过 1,000 个请求。
        - label: 回访与扩张
          actor: 已部署的开发者
          touchpoints:
            - 额外工作负载
            - Agent 配置的资源
          detail: RunPod 报告称 85% 的部署开发者会回访，但样本窗口和付费状态未披露。
    approximationNotes: 有序阶段综合了观察到的客户路径；这不是经测量的漏斗，也不代表阶段间的转化率。
    claimRefs:
      - CU002
      - CU004
      - CU007
      - CU008
      - CU009
      - CU010
      - CU012
      - CU016
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 定性排序显示，可靠性、合规范围、容量集中度、财务可见性和平台规模级影响半径是最重要的剩余暴露。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 生产可用性
          values:
            - label: 中
              detail: 反复出现的评测投诉和二手事件数量缺乏共同分母
            - label: 高
              detail: 生产工作负载失败会影响客户业务连续性、状态和计费
            - label: 发展中
              detail: 公司声称具备故障转移和企业 SLA，但没有历史达标记录
            - label: 高
              detail: 合同和事件证据仍是交割前条件
        - label: 社区中断
          values:
            - label: 高
              detail: 中断和主机波动是低成本层固有的风险
            - label: 中
              detail: 可创建检查点的工作负载可以恢复，但有状态工作负载未必可以
            - label: 产品化
              detail: 可提供安全、预留型替代方案和检查点机制
            - label: 中
              detail: 剩余暴露取决于工作负载部署纪律
        - label: 安全与合规范围
          values:
            - label: Unknown
              detail: 指定材料中没有一手事件或审计证据
            - label: 关键
              detail: 控制范围不匹配可能阻断受监管工作负载
            - label: 发展中
              detail: ISO、SOC 2、HIPAA、GDPR、SSO 和治理均为公司声明
            - label: 高
              detail: 必须验证审计材料和区域覆盖范围
        - label: GPU 容量集中度
          values:
            - label: 中
              detail: 评测称热门 GPU 的可用性随区域和需求变化
            - label: 高
              detail: 容量缺口可能延迟训练或损害推理经济性
            - label: 可见性有限
              detail: 多种 SKU 和区域有帮助，但供应商合同未披露
            - label: 高
              detail: 供应商层面的份额和备用性能仍未知
        - label: 资金续航与单位经济性
          values:
            - label: Unknown
              detail: 指定证据池未披露现金、消耗、毛利率和资金续航
            - label: 高
              detail: 基础设施承诺可能需要大量资本
            - label: 已获融资
              detail: 2026 年 6 月宣布获得 1 亿美元增长投资
            - label: 高
              detail: 融资不能替代经核对的现金和义务明细表
        - label: 平台规模级影响半径
          values:
            - label: 中
              detail: 公司报告的用户和请求规模提高了控制平面的风险敞口
            - label: 高
              detail: 共享编排或身份系统故障可能影响大量工作负载
            - label: 初步形成
              detail: 治理、SSO、成本控制和专属支持正在增加
            - label: 中高
              detail: 部署成功由投资者报告，而非经独立审计
    approximationNotes: 序数标签是基于引用声明的分析师判断，而非测量概率或基准阈值；“未知”表示证据缺失，不代表低风险。
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR006
      - CR009
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 从融资和采用证据推导经尽调门槛约束的建议。
    data:
      nodes:
        - id: round-anchor
          label: $1.0B 融资锚点
          detail: RunPod 与 Summit 宣布获得 $100M 增长投资。
        - id: adoption-proof
          label: 公司报告的大规模使用量
          detail: 1M+ 开发者、20B+ 请求和 85% 回访构建率均为披露方声明。
        - id: price-proof
          label: 独立验证的价格优势
          detail: 在双方共有的 7 种按需 GPU 中，RunPod 的价格均低于 CoreWeave。
        - id: economics-gap
          label: 经济性仍未验证
          detail: 利润率、留存、现金消耗、资金续航、债务和容量承诺均缺失。
        - id: entry-gate
          label: 价格纪律
          detail: 若没有相称且经核实的进展，不要按高于本轮估值的价格评估投资。
        - id: recommendation
          label: 继续研究
          detail: 要求开展私下财务、合同、合规和用户队列尽调。
    approximationNotes: 仅为定性顺序；节点顺序表达决策逻辑，不赋予数值权重、概率或转化率。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV009
      - CV013
      - CV016
