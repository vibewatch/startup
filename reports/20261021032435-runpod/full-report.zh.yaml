      - number: '2.2'
        title: 受证据约束的市场测算
        blocks:
          - type: paragraph
            body: >-
              现有证据支持的是平台规模指标，而不是市场规模估算。Runpod 发布的 2026 年秋季分析覆盖 1.2 million 名用户，观察期为 2025 年 4 月 1 日至 2026 年 8 月 31
              日；报告明确提醒，分母会随发现项变化，结果也不代表超大规模云、私有集群、AI 实验室或主权基础设施上的工作负载。Summit Partners 另称累计 Serverless 推理请求超过 20
              billion，但这属于投资人发布的运营指标，不是行业需求。超过 30 个 GPU SKU 覆盖 31 个地区，说明供给触达范围，不代表市场价值。现有来源没有提供方法可比的 TAM、SAM、CAGR
              或份额分母，因此给出精确美元机会或可获得份额会制造虚假精确。
            claimRefs:
              - CM001
              - CM006
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM006
              - CM016
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              主要用户是 AI 开发者、机器学习工程师、研究人员和初创公司基础设施团队；潜在付款方是工程或平台部门，其预算原本可能用于云 GPU、模型 API 或自有硬件。客户可以先做短期 Pod
              试验，再转向微调或长时工作负载，随着流量或模型规模增长，继续使用 Serverless 或
              Clusters。按秒计费、没有明确的最低承诺，以及可缩容至零，降低了突发型工作的采购门槛。真正的经济触发因素是工作负载适配度：模型规模、显存、可用性、延迟、并发、存储和运行周期共同决定较低的小时费率是否真的带来更低账单。公开证据没有说明谁签署企业合同，也没有说明预算归属如何随客户规模变化。
            claimRefs:
              - CM003
              - CM011
              - CM012
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM009
              - CM011
              - CM012
              - CM015
      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              需求一方面受供给稀缺推动，另一方面来自开发者对每块 GPU 提取更多有效产出的努力。Runpod 报告称，B200 列表价格从 1 月到 2026 年 8 月上涨
              31%；模型越大，量化使用越多；混合部署把本地权重与前沿 API 结合；代理创建的资源占公司收入的比例已达 24%，高于一个月前的
              12%。这些是公司平台观察，不是独立市场基准，但指向一个变化：市场可能从同质化加速器租赁，转向编排、工作负载匹配和自动化供给。约束仍然明显，包括硬件可用性、冷启动的物理限制、依赖工作负载的并发、闲置实例损耗、支持体验不一，以及独立性能数据有限。因此，估值应奖励已验证的使用量和产品广度，同时对假定全部
              AI 算力支出都可服务、或公司遥测数据代表整个市场的自上而下市场倍数打折。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
      - number: '2.5'
        title: 图表与要点
        blocks:
          - type: callout
            title: 平台遥测不是行业分母
            body: Runpod 的使用量报告提供了有价值的当前行为数据，但其方法论明确说明，结果描述的是 RunPod 活动，并不代表全部 AI 工作负载。
            calloutType: risk
            claimRefs:
              - CM006
          - type: callout
            title: 按工作负载经济性评估，而不是套用泛 AI TAM
            body: 尽调应按 Pods、Serverless 和 Clusters 拆分收入与留存，再检验利用率、毛利率、容量获取和竞争胜率，然后才应用市场增长倍数。
            calloutType: recommendation
            claimRefs:
              - CM001
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合与定位
        blocks:
          - type: paragraph
            body: >-
              相关市场不止是按小时出租 GPU。直接替代方案包括提供托管实例的 Lambda 和 Hyperstack、提供市场容量的 Vast.ai、提供企业级预留基础设施的 CoreWeave，以及提供
              Serverless 端点的 Modal 或 Baseten。Together AI 通过完全移除 GPU
              管理参与竞争；当集成身份、治理、采购或控制权比价格更重要时，超大规模云和内部基础设施仍是替代方案。RunPod 的差异化在于把持久型算力、Serverless 端点和 Clusters
              放在同一个面向开发者的平台上。因此，这张定位图是按工作负载适配度排列的序位视图，不是独立测得的性能排名。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP016
