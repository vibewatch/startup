  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              RunPod 可守住的市场边界比“AI 基础设施”更窄。核心市场是租用 AI 算力：开发者无需购买和运营 GPU 资产，也能控制硬件、容器和部署行为。持久型 Pods、自动扩缩容 Serverless 端点和多
              GPU Clusters 覆盖开发、训练、微调、推理和分布式运行；公开模型端点属于相邻的托管访问服务，不是同一产品。相关替代方案包括超大规模云厂商 GPU 实例、第一方 GPU 云、市场容量、自有硬件和全托管模型
              API。当编排或代码执行调用外部托管模型、关键路径上没有加速器时，纯 CPU 沙盒不在核心边界内。这样的切分可避免把泛云支出或 API 支出虚高计入可服务市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
