  - id: FM001
    title: 受证据约束的可触达性筛选
    type: pyramid
    summary: 将广泛的 AI 计算需求逐层收窄到与 Runpod 匹配的工作负载；层级顺序代表适用性筛选，而非市场规模。
    data:
      items:
        - label: 广泛的 AI 与计算需求
          value: No retained market total
          detail: 包括可能永远不需要租用 GPU 的支出。
        - label: GPU 密集型工作负载
          value: Training, fine-tuning, inference, and batch compute
          detail: 排除仅使用 CPU 的编排和普通应用托管。
        - label: 租用还是自有
          value: On-demand or metered capacity
          detail: 适用于灵活性胜过自有硬件经济性的场景。
        - label: 控制权还是托管 API
          value: Customer-selected hardware, containers, and models
          detail: 排除满足于黑盒模型 API 的买家。
        - label: Runpod 产品模式匹配
          value: Pods, Serverless, or Clusters
          detail: 工作负载必须匹配持久性、延迟、规模和中断需求。
        - label: 可获得的工作负载
          value: Unmeasured
          detail: 需要竞争性赢单率、容量、留存、定价和预算证据，但指定证据池中没有这些材料。
    approximationNotes: 仅为概念性筛选顺序；不是按价值比例绘制的 TAM / SAM / SOM 金字塔，也不代表转化率或层层嵌套的美元金额。
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM011
      - CM012
  - id: FP001
    title: 按基础设施控制权与运营模式划分的竞争定位
    type: quadrant
    summary: 分析师编制的序数定位显示，RunPod 连接了原始 GPU 控制与托管部署，而专业厂商则分别占据更明确的价格、企业或 API 利基市场。
    data:
      points:
        - label: RunPod
          x: 4
          'y': 4
          detail: 通过 Pods、Serverless 和 Clusters 提供广泛控制；运营抽象程度中等
        - label: Vast.ai
          x: 5
          'y': 5
          detail: 市场控制权和价格灵活性最高；主机差异更大
        - label: Lambda
          x: 4
          'y': 2
          detail: 面向稳定及多节点工作负载的托管数据中心计算
        - label: CoreWeave
          x: 3
          'y': 2
          detail: 聚焦企业预留容量与网络
        - label: Together AI
          x: 1
          'y': 3
          detail: 通过托管模型 API 实现高层抽象
        - label: 超大规模云厂商
          x: 3
          'y': 1
          detail: 企业控制一体化，但成本和采购负担更高
    approximationNotes: 仅为分析师的序数评分：x 轴从托管 API 抽象（1）到直接基础设施控制（5）；y 轴从企业控制平面侧重（1）到价格和部署灵活性（5）。这不是性能基准。
    claimRefs:
      - CP001
      - CP008
      - CP015
      - CP016
  - id: FI001
    title: 从开发者接入到经常性收入的链路
    type: flow
    summary: 概念性展示低摩擦接入如何将按量计费工作负载转化为经常性收入，但不代表转化率或毛利。
    data:
      nodes:
        - id: self-serve-access
          label: 自助接入
          detail: 透明定价且无最低承诺额，降低初始采购摩擦。
        - id: first-workload
          label: 首个工作负载
          detail: 开发者选择持久化 Pods 或自动扩缩容的 Serverless 执行。
        - id: metered-compute
          label: 按量计费计算
          detail: Pods 按分钟计费，Serverless 按活跃秒计费。
        - id: persistent-storage
          label: 持久化存储
          detail: 网络卷增加单独计价的持久化层。
        - id: usage-expansion
          label: 使用量扩张
          detail: RunPod 报告称，2026 年 1 月净美元留存率为 120%。
        - id: recurring-revenue
          label: 经常性收入
          detail: RunPod 报告 ARR 超过 $120M；后续一篇资料报告其年化收入运行率约为 $240M。
    approximationNotes: 仅为概念性顺序；不推导转化率、收入结构、毛利率或累计桥接。
    claimRefs:
      - CI001
