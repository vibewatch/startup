      - number: '1.4'
        title: 里程碑与证据张力
        blocks:
          - type: paragraph
            body: >-
              里程碑序列显示，RunPod 已从开发者 GPU 租赁产品快速转向获得风险投资支持、面向企业的平台。该轨迹主要由公司、投资人和产品简介披露支持，而非监管申报。独立评测指出了明显取舍：社区节点可靠性波动、Pod
              层面的多节点网络能力有限，以及对受监管或依赖 SLA 的工作负载适配性较弱。RunPod 当前材料又声称 Clusters 支持
              InfiniBand，并具备更强的合规性和服务水平，这形成的是范围与版本差异，而非简单矛盾：评测可能描述社区 Pods 或早期产品，当前声明则可能只适用于 Secure Cloud、Clusters
              或企业合同。要厘清差异，还需要合同层面的 SLA、认证、事故和地区覆盖证据。
            claimRefs:
              - CO015
              - CO016
