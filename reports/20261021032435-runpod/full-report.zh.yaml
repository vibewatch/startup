  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品形态与客户工作流
        blocks:
          - type: paragraph
            body: >-
              RunPod 的产品围绕三种算力模式组织，而不是单一 GPU 租赁 SKU。Pods 提供持久型、基于容器的环境，支持开发、微调和长时任务；Serverless
              把工作进程镜像放在自动扩缩容端点后面，支持突发型推理；Clusters 则面向多 GPU
              训练和大批量推理。网络卷提供持久状态，让检查点和模型权重能够跨算力生命周期迁移。开发者因此可以在不更换供应商的情况下，从试验走到生产；这是 RunPod
              和外部报道都强调的核心产品差异化。当需求形态随时间变化时，这条路径最有吸引力：团队可以在 Pod 上验证，在 Serverless
              上承载波动流量，再为分布式训练预留集群容量。关键尽调问题不是这些模块是否存在，而是它们之间的衔接、计费边界和支持义务在生产规模下是否仍然可预期。
            claimRefs:
              - CE001
              - CE005
              - CE009
              - CE015
