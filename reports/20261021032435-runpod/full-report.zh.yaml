      - number: '1.3'
        title: 融资、估值与运营规模
        blocks:
          - type: paragraph
            body: >-
              Sacra 报告称，2024 年 5 月有一笔 $20 million 种子轮融资，由 Intel Capital 和 Dell Technologies Capital 共同领投，此前还有约 $2
              million 的早期融资。RunPod 和 Summit Partners 随后宣布，2026 年 6 月完成一笔 $100 million 成长投资，对应 $1.0 billion
              估值。把这些已披露记录相加，推算融资至少为 $122 million；但这不是可用现金，也未涵盖债务、老股交易、费用或任何未披露交易。规模在 2026 年加速：公司关联来源称，截至 6 月开发者超过 one
              million，累计 Serverless 请求超过 20 billion。收入证据只能说明方向，且未经审计：RunPod 表示 ARR 从 1 月的 $120 million 增长到 10 月的超过 $325
              million；Sacra 则单独估算 9 月年化收入为 $325 million。
            claimRefs:
              - CO005
