figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence supports a path from self-serve discovery to repeat building, but paid renewal and
      account expansion remain unmeasured.
    data:
      items:
        - label: Self-serve discovery
          actor: "Independent developer or small AI team"
          touchpoints:
            - "Transparent usage pricing"
            - "Broad GPU catalog"
          detail: "Independent reviews identify occasional high-VRAM work as a core entry use case."
        - label: First workload
          actor: "New developer"
          touchpoints:
            - "Templates"
            - "Pods"
          detail: "Investor disclosure reports a median of under one hour from sign-up to a running workload."
        - label: Experiment and train
          actor: "ML engineer or research team"
          touchpoints:
            - "Persistent Pods"
            - "Network storage"
          detail: "Named evidence includes Deep Cogito's completed model-training program."
        - label: Deploy inference
          actor: "AI startup platform team"
          touchpoints:
            - "Serverless endpoints"
            - "Autoscaling workers"
          detail: "The platform reports more than 20 billion cumulative Serverless requests."
        - label: Operate at production scale
          actor: "Application team"
          touchpoints:
            - "Burst capacity"
            - "Monitoring"
          detail: "A company-hosted testimonial reports scaling a live application beyond 1,000 requests per second."
        - label: Return and expand
          actor: "Deployed developer"
          touchpoints:
            - "Additional workloads"
            - "Agent-provisioned resources"
          detail: "RunPod reports 85% of deploying developers return, but the cohort window and paid status are undisclosed."
    approximationNotes: >-
      Ordered stages synthesize the observed customer path; they are not a measured funnel and do not imply
      conversion rates between stages.
    claimRefs: [CU002, CU004, CU007, CU008, CU009, CU010, CU012, CU016]
callouts:
  - calloutType: strength
    title: Credible production-workload references
    body: >-
      Deep Cogito's completed training program and Botto's migration testimonial show that RunPod is used
      for more than short-lived experimentation, although neither disclosure provides contract economics.
    claimRefs: [CU003, CU004]
  - calloutType: risk
    title: Retention is not yet underwritable
    body: >-
      The 85% return-to-build disclosure lacks a cohort window, paid-status definition, and revenue
      denominator, while NRR, GRR, churn, contract duration, and concentration remain private.
    claimRefs: [CU010]
