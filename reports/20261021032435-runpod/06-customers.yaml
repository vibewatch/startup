  name: RunPod
chapter:
  number: 6
  title: Customers
  summary: >-
    RunPod shows substantial developer adoption, production-workload references, and company-reported
    repeat deployment, but the evidence is weighted toward company and investor disclosures rather than
    independently measured customer cohorts. Public NRR, GRR, churn, contract duration, enterprise mix,
    and customer concentration remain material diligence gaps.
sections:
  - id: customer-segments
    title: A broad developer funnel, with limited commercial segmentation
    body: >-
      RunPod's public customer surface spans self-paying independent developers, small AI teams,
      production inference startups, open-model builders, and enterprise-oriented workloads. Independent
      reviews consistently place the platform between low-cost marketplaces and hyperscalers: developers
      receive more control than a closed model API and less operational burden than raw GPU rentals.
      RunPod's own product design reinforces that breadth through Pods for experimentation, Serverless for
      variable production traffic, and Clusters for larger training jobs. The breadth is strategically
      useful because one account can support a customer's progression from experiment to production, but
      public evidence does not disclose revenue by segment, buyer type, geography, company size, or
      workload. More than one million developers is therefore a top-of-funnel scale indicator, not a
      count of paying enterprises or retained production customers.
    claimRefs: [CU001, CU002, CU006, CU014, CU016]
    tableRefs: [TU001]
  - id: adoption-and-expansion
    title: Adoption is large, while cohort definitions remain opaque
    body: >-
      June 2026 investor materials reported more than one million developers and more than 20 billion
      cumulative Serverless inference requests. The same disclosure reported a median of under one hour
      from sign-up to first workload, first-try success above 90%, and an 85% return-to-build rate among
      developers who deploy. These are useful activation and repeat-use signals, but the publisher did not
      define the observation window, eligible cohort, paid conversion, or whether "come back to build
      more" represents renewal. RunPod's September workload report covered 1.2 million users observed from
      April 2025 through August 2026 and explicitly warned that units vary by finding and are not
      representative of all AI workloads. The report's claim that agent-created resources rose from 12%
      to 24% of revenue in one month suggests a new expansion surface, but the short comparison window is
      not evidence of durable retention.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU011, CU012]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof
    title: Named proof demonstrates real workloads, not a complete customer census
    body: >-
      Deep Cogito is the strongest named production reference in the allocated evidence: its chief
      executive said a small team trained the Cogito v1 model family entirely on RunPod in 75 days.
      RunPod's homepage also carries a Botto testimonial linking migration to better GPU resources and
      lower cost. A separate OpenAI Model Craft Challenge infrastructure partnership demonstrates
      ecosystem credibility and a compute-credit deployment, but it should not be counted as a customer
      contract. Together these references show credible use across model training, creative generation,
      and developer programs. They do not establish contract values, renewal, gross retention, or
      customer concentration, and two of the three disclosures sit on company- or investor-controlled
      surfaces. The proof set is therefore useful for workload verification but weak for underwriting
      revenue durability.
    claimRefs: [CU003, CU004, CU005]
    tableRefs: [TU003]
  - id: durability-and-diligence
    title: Retention and concentration remain the decisive diligence gaps
    body: >-
      Public evidence does not disclose NRR, GRR, logo churn, contract length, enterprise revenue share,
      top-customer exposure, or channel dependence. The reported 85% return-to-build metric is directionally
      positive, yet it cannot be translated into retention without a time window, denominator, paid-status
      definition, and cohort construction. Customer durability also depends on operational fit. One
      independent review warns that teams without container and MLOps maturity may find RunPod too
      low-level, while an affiliate review last reviewed in June 2026 characterized strict uptime,
      compliance, and regulated-data use as weak fits. RunPod's current homepage now claims broader
      compliance and enterprise SLA coverage, creating a diligence need to verify the applicable region,
      deployment model, contract, and remedy rather than treating either marketing or an older review as
      conclusive. Investment underwriting should request customer-level cohorts and executed contract
      evidence before assigning value to expansion or low concentration.
    claimRefs: [CU010, CU014, CU015, CU016]
