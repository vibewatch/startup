company:
  name: RunPod
chapter:
  number: 7
  title: Risks
  summary: >-
    RunPod's principal investability risk is not lack of demand but whether a rapidly scaled, multi-tier GPU cloud can deliver enterprise-grade reliability, security scope, capacity, and financial discipline consistently. Public evidence shows meaningful mitigations, including enterprise controls, certifications, reserved capacity, and fresh growth capital, but primary incident records, audit artifacts, supplier concentration, contractual remedies, and cash-runway data remain unavailable.
sections:
  - id: risk-ranking
    title: Risk ranking and investment implication
    body: >-
      The highest residual exposures are production reliability, compliance scope, GPU-capacity dependency, and financial opacity. Independent reviews describe boot failures, crashes, continued billing during unsuccessful runs, variable Community Cloud hardware, fluctuating GPU availability, and cold-start latency, while company materials advertise failover, broad uptime, and stronger enterprise commitments. That tension matters more than either side alone: RunPod appears to have built credible mitigations, but the assigned evidence does not contain provider-level incident logs or contractual remedy schedules that would demonstrate their realized effectiveness. The $100 million 2026 growth investment reduces immediate financing pressure, yet funding raised is not cash available and does not disclose burn, gross margin, or runway. The investment case therefore depends on converting public claims into auditable operating evidence before underwriting production-critical adoption.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR009
      - CR010
      - CR013
      - CR014
      - CR016
    figureRefs:
      - FR001
  - id: regulatory-legal
    title: Regulatory, legal, and security posture
    body: >-
      RunPod's September 2026 enterprise announcement adds governance controls, SSO/SAML, group management, cost-center billing, and an ISO/IEC 27001 claim; its own site also claims SOC 2 Type II status and HIPAA and GDPR support, with coverage varying by region and deployment model. These are relevant mitigants, not independent verification. A commercially affiliated review last assessed in June characterized RunPod as weak for regulated environments and enterprise SLAs, but that view predates the September control announcement and may be stale. The resulting risk is evidence scope rather than a demonstrated violation: the pool contains no certificates, audit periods, penetration-test results, regulator records, court dockets, breach notices, or customer contracts. Absence of those records in the assigned pool does not establish absence of incidents, disputes, or enforcement.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR016
    tableRefs:
      - TR001
  - id: operational-dependencies
    title: Operational and partner dependencies
    body: >-
      RunPod supports persistent Pods, Serverless endpoints, and distributed Clusters, so execution risk spans instance provisioning, storage durability, queueing, model startup, and multi-region capacity. Community Cloud deliberately trades cost for interruption and third-party-host variability; Secure Cloud and enterprise reserved capacity mitigate that tradeoff at higher cost and with product-specific commitments. Independent reviews also flag fluctuating availability for popular GPU types and meaningful cold starts for large models. Those issues do not prove systemic failure, but they create customer-visible risk where workloads are latency-sensitive, stateful, or difficult to checkpoint. The platform's scale compounds the potential blast radius: an independent profile reports company-disclosed adoption above one million developers and more than 20 billion cumulative Serverless requests, making incident containment and transparent status reporting investment-critical controls.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR012
      - CR013
      - CR014
      - CR015
    tableRefs:
      - TR002
      - TR003
  - id: mitigations-kill-criteria
    title: Mitigations, monitoring, and thesis-break triggers
    body: >-
      Public mitigations include failover claims, enterprise SLAs, reserved or dedicated capacity, identity and billing controls, certifications, persistent storage, and product separation between interruptible and higher-reliability tiers. The underwriting question is whether these controls operate as represented. Pre-close monitoring should reconcile twelve months of provider-level uptime and incident data to each contracted SLO, inspect SLA credits and exclusions, verify audit scope and dates, map critical GPU supply by operator and region, and reconcile cash to monthly burn and committed infrastructure spend. Thesis-break triggers are management's inability to produce those records, repeated uncured breaches of contracted service levels, a material security event without evidenced remediation, loss of capacity for critical SKUs without a tested fallback, or a financing plan that cannot support contracted obligations. These are diligence conditions, not claims that any event has occurred.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR009
      - CR010
      - CR011
      - CR015
      - CR016
tables:
