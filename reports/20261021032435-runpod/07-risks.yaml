        - Fund platform expansion and add investor board representation
        - Unknown
        - Expansion commitments outpace available cash or constrain strategic flexibility
        - Medium
        - Reported $100 million growth investment
        - Funding raised does not establish current cash, burn, runway, or infrastructure obligations
    notes: >-
