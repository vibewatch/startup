    title: Regulatory / legal risk register
    columns:
      - Rule, license, or case
      - Jurisdiction
      - Status
      - Likelihood
      - Severity
      - Mitigation
      - Residual exposure
      - Diligence path
    rows:
      - - Data security, privacy, and compliance representations
        - Multi-jurisdiction
        - Company claims ISO/IEC 27001, SOC 2 Type II, HIPAA support, and GDPR support; scope varies by deployment
        - Medium
        - High
        - Enterprise governance, SSO/SAML, network isolation, BAAs, and DPAs are publicly described
        - Certification scope, audit periods, exceptions, and incident history were not independently inspected
        - Obtain certificates, SOC report bridge letters, BAA/DPA forms, control exceptions, and regional scope
      - - Availability and SLA representations
        - Contractual; global service regions
        - Public site claims 99.9% uptime and a 99.99% enterprise SLA, while reviews describe tier-specific variability
        - Medium
        - High
        - Failover, reserved capacity, dedicated capacity, and enterprise agreements
        - Product-level exclusions, credit remedies, measurement windows, and historical attainment are undisclosed
        - Review sample MSAs and SLAs, credits, exclusions, status history, and twelve months of attained SLOs
      - - Usage billing and failed-job disputes
        - Commercial and consumer contract terms
        - Reviews describe continued billing during failed runs; the official site highlights guidance on failed-job billing
        - Medium
        - Medium
        - Billing Explorer, cost-center tagging, alerts, and post-paid enterprise invoicing
        - Refund standards, dispute rates, and automated failed-job credits are not disclosed
        - Inspect terms, refund policy, support tickets, billing adjustments, and complaint trends by product tier
    notes: >-
      Partial risk enumeration from the assigned eight-source pool as of 2026-10-21; likelihood and severity are analyst assessments, company certifications and SLAs are unverified claims, and null legal-event evidence is not proof of absence.
    enumerationScope:
      coverage: partial
      basis: >-
        Three issue classes evidenced in the assigned source pool as of 2026-10-21, not an exhaustive court, regulator, or contract registry review.
