        - High
        - Secure Cloud, reserved capacity, checkpointing, and external backups
        - Operator quality, concentration, and eviction statistics are not public
      - - Data-center and GPU supply
        - Undisclosed facilities, lessors, and hardware channels
        - Secure capacity across GPU types and regions
        - Unknown
        - Scarce high-end SKUs force delays, substitutions, or premium pricing
        - High
        - Multi-region catalog, alternate SKUs, dedicated capacity, and enterprise reservations
        - Contract duration, take-or-pay exposure, and provider-level capacity shares are undisclosed
      - - Growth capital and board governance
