  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Pod boot, crash, storage, or billing failure
        - Medium
        - High
        - Developing; company claims failover and enterprise uptime commitments
        - Production interruption, state loss, and charges during unsuccessful workloads
        - Provider-level incident frequency, duration, affected workloads, and credit outcomes
      - - Community Cloud interruption and hardware variance
        - High by product design
        - Medium
        - Productized; workloads can move to Secure Cloud, reserved capacity, or checkpointed Spot usage
        - Higher-cost tiers may be required for production workloads
        - Host concentration, hardware verification, eviction frequency, and successful recovery rate
      - - GPU availability and large-model cold starts
        - Medium
        - Medium
        - Productized but company-claimed; multiple SKUs, regions, autoscaling, and FlashBoot
        - Latency-sensitive services may miss objectives or require costly warm capacity
        - SKU-by-region fill rates, cold-start percentiles, and tested fallback behavior
      - - Security-control or compliance-scope mismatch
        - Unknown
        - Critical
        - Developing; certifications and enterprise controls are publicly claimed
        - A control may not cover the selected region, provider, product, or regulated workload
        - Current audit artifacts, exceptions, subprocessor map, penetration tests, and material incident history
    notes: >-
      Failure modes combine independent review evidence with company-stated mitigations; qualitative likelihood and severity are not measured incident probabilities, and unavailable denominators remain explicit diligence gaps.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
