  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financial-opacity
      missingEvidence: Current cash balance, gross margin, monthly cash burn, working-capital profile, committed capacity obligations, and runway.
      whyItMatters: Funding raised and valuation do not establish liquidity, infrastructure economics, or the ability to sustain enterprise commitments.
      diligencePath: Reconcile bank statements, board-approved budgets, monthly management accounts, infrastructure contracts, and a downside cash forecast.
      relatedQuestionRefs:
        - QR004
      relatedTableRefs:
        - TR003
    - type: missing-source
      severity: material
      topic: regulatory-legal-risk-register
      missingEvidence: Primary court, regulator, sanctions, recall, and confirmed security-incident records tied to RunPod and its operating entities.
      whyItMatters: The assigned pool cannot establish whether legal, enforcement, or breach events exist, and absence of a cited incident is not proof of absence.
      diligencePath: Search named legal entities in court and regulator databases, review breach notices, and obtain management litigation and incident schedules.
      relatedQuestionRefs:
        - QR010
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: compliance
      missingEvidence: ISO certificate scope, SOC 2 report and bridge letter, audit exceptions, BAA and DPA templates, subprocessor inventory, and regional control coverage.
      whyItMatters: Public certification claims may not cover every product, host, region, or regulated workload represented to customers.
      diligencePath: Inspect current audit artifacts and exceptions with counsel and security specialists, then map controls to each product and deployment tier.
      relatedQuestionRefs:
        - QR001
        - QR007
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: material
      topic: operating-evidence
      missingEvidence: Provider-level uptime, incident duration, affected workload counts, SLA credits, refund rates, capacity fill rates, cold-start percentiles, and supplier concentration.
      whyItMatters: Review evidence establishes failure modes but not their population frequency, economic impact, or mitigation effectiveness.
      diligencePath: Obtain twelve months of raw service metrics and incident postmortems, reconcile them to status reporting and contracts, and segment results by product and provider.
      relatedQuestionRefs:
        - QR002
        - QR003
        - QR008
        - QR009
      relatedTableRefs:
