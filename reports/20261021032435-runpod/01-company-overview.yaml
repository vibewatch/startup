        jurisdiction, and the reliability of headline adoption claims.
      diligencePath: >-
        Obtain the certificate of incorporation, current HR roster, and
        anonymized customer cohort and revenue-concentration schedules.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO001]
    - type: enumeration-incomplete
      severity: material
      topic: leadership-and-governance
      missingEvidence: >-
        Complete executive and board rosters, biographies, ownership, voting
        rights, investor preferences, and founder succession arrangements.
      whyItMatters: >-
        Publicly named leaders do not establish functional depth, board
        independence, control, dilution, or key-person mitigation.
      diligencePath: >-
        Review the capitalization table, charter, voting agreements, board
        minutes, executive employment agreements, and succession plans.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO002, TO003]
    - type: private-evidence-only
      severity: material
      topic: funding-and-financials
      missingEvidence: >-
        Debt, credit facilities, secondaries, financing fees, cash balance,
        burn, runway, audited revenue, gross margin, and ARR reconciliation.
      whyItMatters: >-
        Funding raised cannot establish liquidity, and company-reported ARR
        cannot establish recognized revenue, profitability, or cash generation.
      diligencePath: >-
        Obtain financing documents, bank and debt statements, audited financials,
        monthly management accounts, and customer-level ARR-to-revenue bridges.
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO001, TO003]
    - type: conflicting-data
      severity: material
      topic: infrastructure-limitations
      missingEvidence: >-
        Product- and region-specific uptime history, incident logs, SLA terms,
        certification scope, interconnect specifications, and independent audit
        reports.
      whyItMatters: >-
        Current company claims may describe enterprise Clusters or Secure Cloud
        while independent cautions may apply to Community Cloud or older Pods.
      diligencePath: >-
        Review executed enterprise contracts, status and incident exports,
        SOC 2 and ISO reports, architecture documents, and region-level service
        measurements.
      relatedQuestionRefs: [QO007]
