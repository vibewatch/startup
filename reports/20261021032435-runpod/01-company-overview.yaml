callouts:
  - calloutType: risk
    title: Scope matters when reconciling infrastructure claims
    body: >-
      Independent reviews describe community-node, networking, compliance, and
      SLA limitations, while current company materials describe enterprise
      Clusters, certifications, and stronger service levels; diligence should
      test which claims apply to each product, region, and contract tier.
    claimRefs: [CO015, CO016]
