      layers:
        - label: 机构参与者
          detail: 银行、主经纪商、执行银行、对冲基金、真实资金管理机构和机构投资者，是公开识别出的用户或交易对手。
        - label: 资本市场与投资组合优化
          detail: 两项现有业务分别解决融资、资本、资产负债表和投资组合资源方面的挑战。
        - label: 外汇更新合约与结算工作流
          detail: 公司材料描述了如何自动化参与者之间的更新合约，以及结算敞口优化。
        - label: 已清算与未清算协调
          detail: 对 LCH 的连接被描述为：将优化后的交易放入已清算和未清算市场之间最合适的位置。
        - label: 第三方与内部集成
          detail: 公司发布的职位重发信息指向供应商系统、API、数据模型，以及与内部平台的直通式连接。
        - label: 拟议证券借贷扩展
          detail: eSecLending 交易将增加一个机构资产所有者网络，但仍取决于交割完成和集成进度。
    approximationNotes: 概念化运营模型汇总自公开描述；不代表已部署的基础设施、数据流、安全边界或实施顺序。
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: 机构客户从接入到多边优化的旅程图
    type: journey-map
    summary: 展示全球金融机构的端到端客户生命周期，从双边痛点评估推进到多边算法执行和多资产扩张。
    data:
      items:
        - label: 1. 识别资本约束
          description: 银行交易台识别资产负债表约束、SA-CCR 敞口或初始保证金拖累。
          touchpoints:
            - 风险与监管资本评估
            - 借助 Capitolis 分析工具进行投资组合诊断
        - label: 2. 接入双边工作流
          description: 机构客户通过 API 或 STP 连接接入 Capitolis 工作流引擎。
          touchpoints:
            - 直通式处理（STP）配置
            - 更新合约与消息协议对接
        - label: 3. 协作规划周期
          description: Capitolis 协调参与交易商和买方交易对手开展多实体优化运行。
          touchpoints:
            - 执行排期与参数设置
            - 双边交易资格验证
        - label: 4. 算法多边执行
          description: 专有算法计算网络中的最优交易压缩和更新合约组合。
          touchpoints:
            - 多边净额结算与压缩运行
            - 自动化交易后更新合约处理
        - label: 5. 释放资本与资源
          description: 参与者实现名义本金总额削减、监管资本释放和 ROE 改善。
          touchpoints:
            - RWA 与杠杆率优化
            - 初始保证金削减验证
        - label: 6. 平台扩张与相邻市场
          description: 客户扩展至证券借贷（eSecLending）和 Capital Marketplace 资产负债表融资。
          touchpoints:
            - 跨资产融资与证券借贷
            - 机构资产所有者网络集成
    approximationNotes: 工作流阶段综合了已记录的产品能力、客户奖项引用和机构接入流程；具体执行时间因交易对手基础设施而异。
    claimRefs:
      - CU009
      - CU010
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 评估监管、运营、合作伙伴和财务敞口等核心类别的严重性与剩余风险。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解措施成熟度
        - 剩余严重性
      rows:
        - label: eSecLending 系统与工作流集成
          values:
            - 高
            - 高
            - 发展中
            - label: 高
              tone: negative
        - label: 一级银行交易对手集中度
          values:
            - 高
            - 高
            - 已建立
            - label: 中
              tone: neutral
        - label: 监管再平衡与 SBSD 审查
          values:
            - 中
            - 高
            - 已建立
            - label: 中
              tone: neutral
        - label: 债务融资偿付与契约合规
          values:
            - 中
            - 高
            - 中等
            - label: 中
              tone: neutral
        - label: 算法模型与净额结算执行错误
          values:
            - 中
            - 高
            - 已建立
            - label: 低
              tone: positive
        - label: 跨境实体监管合规
          values:
            - 低
            - 中
            - 已建立
            - label: 低
              tone: positive
    approximationNotes: 可能性和影响等级综合了监管披露、信贷协议及分析师评估，属于定性判断。
    claimRefs:
      - CR001
      - CR005
      - CR007
      - CR008
      - CR013
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 经核实的战略支持并不足以直接推动投资；在核查经济性和交易证据缺口后，结论收敛为继续研究。
    data:
      nodes:
        - id: financing-proof
          label: $120M Series E，估值 $1.9B
          detail: 当前私募市场价格标记已得到核实。
        - id: strategic-proof
          label: 战略银行支持
          detail: 提升相关性，但与客户和交易对手存在重叠。
        - id: expansion-proof
          label: eSecLending 扩张
          detail: 增添了一条合理的证券借贷增长路径。
        - id: economics-gap
          label: 经济性未披露
          detail: 收入、盈利能力、现金流和目标经济性仍不可得。
        - id: risk-adjustment
          label: 杠杆与整合风险
          detail: 债务和并购执行情况削弱了对最新估值标记的信心。
        - id: decision
          label: 继续研究
          detail: 只有在证据改善或价格提供下行保护后，才考虑投资。
    approximationNotes: 这是定性的决策链，不赋予权重或概率，也不推算转化率或数值估值。
    claimRefs:
      - CV013
      - CV014
      - CV016
