        title: 公司里程碑、并购扩张与运营规模
        blocks:
          - type: paragraph
            body: >-
              Capitolis 成立于 2017 年，历经 A、B、C 轮融资，并于 2022 年 3 月以 $1.6 billion Series D 跻身独角兽。2022 年底重组使员工减少 37 人至 124 人；到
