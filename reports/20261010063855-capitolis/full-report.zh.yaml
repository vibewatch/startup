  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管监督、牌照与司法辖区地位
        blocks:
          - type: paragraph
            body: >-
              Capitolis 处于涵盖 SEC、CFTC 及国际资本市场监管机构的复杂全球监管架构中。Capitolis Liquid Global Markets LLC 是注册的基于证券的掉期交易商，须遵守
              Exchange Act Rule 18a-1 和 18a-7 的资本充足性、风险管理及合规官要求。2023 年 3 月，SEC
              交易与市场部门发布不采取行动救济，允许公司将首个年度财务和风险报告并入第二财年。公开监管文件显示，该实体没有审慎银行监管机构，也未注册为传统经纪交易商，并依据 Rule 18a-4
              的法定豁免免于客户隔离要求。Capitolis Partners 的交易后再平衡和基差风险缓释受 CFTC 关于 SEF 注册的不采取行动救济约束。公司虽以受 NFA 监督的介绍经纪商身份在 CFTC
              注册，但监管重新解释可能迫使其转为完整注册 SEF。公开记录截至 2026 年 10 月未显示正式制裁或执法行动，但跨境监管许可对维持国际交易网络至关重要。
