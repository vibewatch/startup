  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、核心类别与支出分类
        blocks:
          - type: paragraph
            body: >-
              机构金融资源管理（FRM）和资本优化市场涵盖交易后风险削减服务（PTRRS）、多边衍生品压缩、交易更新工作流和证券融资资产负债表中介。Capitolis 的两大支柱是 Portfolio Optimization
              和 Capital Marketplace。可触达支出包括 SA-CCR、Basel 杠杆率、信用中介费及机构维持衍生品和证券库存的运营成本，不包括前台执行佣金、普通零售清算和双边托管费。公司以自动化 SaaS
              网络取代双边人工流程，运行多边优化以压缩总名义敞口。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
      - number: '2.2'
        title: 可触达市场规模、TAM/SAM/SOM 视角与分析约束
        blocks:
          - type: paragraph
            body: >-
              市场规模需要多重视角，而不是单一推测数字。全球外汇市场日均成交额超过 $6.6 trillion；资本市场科技及交易后优化软件的年度可触达支出估计为 $12B 至 $18B；自动化多边更新、SA-CCR
              压缩和代理证券借贷工具对应 $1.5B 至 $2.5B 年度费用池。Capitolis
              通过订阅费、优化运行费和交易量挂钩的中介收益变现。由于银行将资本费用分散吸收在内部资产负债表科目中，公开披露很少单独列出相关第三方软件预算。
            claimRefs:
              - CM003
