      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              这笔融资主要服务于收购，不能作为纯粹的有机增长基准。Capitolis 将股权融资与约 $100 million 债务搭配，并把资金包投向 eSecLending；据报道，该公司的 $200 million
              全现金收购价相对于新增资本并不小。独立评论来源计算，新估值仅比 2022 年估值高约
              19%；四年涨幅有限，单凭这一点不能证明创造了价值。管理层称债务成本更低，并预计会产生可观现金流，但这些前瞻性表述不能替代契约、偿债记录、经审计收益或标的层面的收入数据。因此，若入场价等于或高于上一轮估值，必须先核实整合经济性和净收入留存率。折价买入能提高下行保护，但现有证据不足以支持精确的折价或回报门槛。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: 情景、退出准备度与论点失效测试
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求 eSecLending 带来经常性证券借贷收入和资产所有者关系，同时 Capitolis
              将银行支持转化为多元化商业需求。基准情景假设交易会扩大平台，但在经审计的经济数据公开前，估值仍锚定在最新一轮私募融资附近。悲观情景是整合或杠杆未达预期：客户与投资人高度重合、披露薄弱，进一步放大再融资或下轮融资风险。一个汇总数据集中的上市公司
              IPO 先例显示，市销率约为 0.99x 至 13.5x；但公司和上市年份各不相同，在缺少当前收入分母的情况下，这一区间不适合用来给 Capitolis
              定价。因此，退出准备度尚未得到证明。投资前，应取得经审计财务报表、客户队列留存、客户集中度、债务文件、优先权条款和收购会计衔接表。整合计划落空、契约压力、战略银行流失，或无法提供经审计的经济数据，都应构成论点失效。
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
