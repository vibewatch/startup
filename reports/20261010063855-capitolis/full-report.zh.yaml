      - number: '2.3'
        title: 买方分层、预算归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              一级全球系统重要性银行的主要买方是 FRM 负责人、资金主管和交易台全球负责人，他们按资本周转、杠杆率减负和监管资本回报率评估软件。运营用户包括交易后团队、中台支持和抵押品管理专家；预算通常归公司资金部、COO
              或共享市场基础设施。资产管理人和养老金客户则由首席投资官及证券借贷负责人代表，目标是在不扩大交易对手风险的情况下释放投资组合收益。采购周期通常为 9 至 18 个月，受信息安全、信用评估和核心银行集成影响。
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 结构性增长驱动、监管催化剂与采用约束
        blocks:
          - type: paragraph
            body: >-
              SA-CCR 全球落地、UMR 逐步实施、Basel III/IV 杠杆率收紧、利率波动和融资成本上升，共同推动 Capitolis 的优化套件。2026 年 6 月 18 日，CFTC 就 PTRRS
              发布不采取行动救济函，豁免美国市场参与者在非市场风险压缩运行期间的部分清算、交易场所注册和实时报告要求。采用仍受高切换成本、多边协调惯性以及核心银行架构集成复杂性的约束。
            claimRefs:
              - CM003
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 关键展项
        blocks:
          - type: callout
            title: CFTC PTRRS 不采取行动救济带来的监管顺风
            body: >-
              2026 年 6 月 CFTC 救济函为美国交易后风险削减服务提供监管明确性，使 Capitolis 等 PTRRS 提供商可在无需注册 SEF
              的情况下运行优化，并免除合资格运行的部分清算和实时报告要求，从而降低监管摩擦并加快银行参与。
            calloutType: insight
            claimRefs:
              - CM012
              - CM013
          - type: callout
            title: 多租户协调惯性与机构切换摩擦
            body: 多边资本优化的根本约束是网络协调。压缩衍生品名义金额或运行自动化更新，需要多家竞争性一级机构同步参与并达成算法共识；关键交易商不加入时，网络收益会非线性下降，双边人工流程仍是可靠备选。
            calloutType: risk
            claimRefs:
              - CM002
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场分类与竞争格局
        blocks:
          - type: paragraph
            body: >-
              Capitolis 位于资本资源优化、交易后 OTC
              衍生品更新和机构证券融资的交叉点。竞争者分为传统集合证券借贷的全球托管银行、聚焦利率互换和已清算衍生品的交易所压缩工具，以及双边人工处理这一现状模式。Capitolis
              不是传统双边经纪商，而是连接执行银行、主经纪商和机构资产所有者的多边技术网络，用于消除重复敞口并优化稀缺资产负债表容量。
