chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、核心使命与运营模式
        blocks:
          - type: paragraph
            body: >-
              Capitolis Inc. 是一家成立于 2017
              年、总部位于纽约的企业级资本市场科技平台，并在伦敦和特拉维夫设有工程及运营中心。公司作为专业市场基础设施运营，旨在消除全球银行网络中的系统性资本瓶颈。依托自有计算架构，Capitolis 提供 Portfolio
              Optimization 和 Capital Marketplace 两项相互衔接的解决方案：前者在不改变底层经济敞口的情况下，以多边方式完成外汇及利率衍生品平仓、压缩和 SA-CCR
              资本要求削减；后者连接受监管资产负债表约束的一级发起银行与寻求资产收益的机构配置者。公司已有 100 多家全球知名金融机构作为活跃网络参与者。
            claimRefs:
              - CO001
              - CO006
              - CO010
