  - id: TV002
    title: 论点与反论点
    columns:
      - 观察角度
      - 有证据支持的论点
      - 哪些信息会改变判断
    rows:
      - - 论点
        - 主要银行为 E 轮融资提供资金，支持其战略相关性
        - 若有证据显示银行集中度低且商业使用具有复购性，论点会更有力
      - - 论点
        - eSecLending 能将平台拓展至证券借贷和资产所有者
        - 经验证的目标收入、留存率和集成里程碑会强化这一论点
      - - 反论点
        - 客户投资者可能让资本支持看起来比实际更独立
        - 独立赢得客户以及良好的群组留存会削弱这一担忧
      - - 反论点
        - 在经济性仍不透明时，债务和收购集成增加了下行风险
        - 契约余量、经审计的现金创造和已实现的协同计划会削弱这一担忧
    notes: 表格将已验证的交易事实与分析含义分开；要求中的改变判断证据并不代表已经实现的结果。
    claimRefs:
      - CV003
      - CV008
      - CV009
      - CV010
      - CV014
      - CV015
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 概率信号
      - 下行或上行触发因素
    rows:
      - - 乐观
        - eSecLending 增加经常性收入；集成留住资产所有者；银行需求趋于多元
        - 只有在经审计的增长和现金转化得到证明后，$1.9B 以上的估值才站得住
        - 公开数据无法量化；应关注经审计的加速增长和广泛客户留存
        - 上行：经验证的目标经济性和持续正现金流
      - - 基准
        - 平台扩大，但披露和集成证据逐步到位
        - 将 $1.9B 轮融资作为参考标尺，而非内在价值；要求增加披露或让价
        - 与已验证的融资事实和未解决的财务缺口最一致
        - 只有在收入、利润率、留存率和契约证据经审计后才重新定价
      - - 悲观
        - 集成延误、杠杆收紧，或战略银行需求减弱
        - 价值应大幅低于上一轮估值；无法支持精确底价
        - 关注契约余量、客户投资者流失和错过的集成里程碑
        - 论点破裂：契约压力、战略银行流失，或没有可审计的经济性
    notes: 由于公开来源没有提供公司整体收入、盈利能力、现金流、债务条款或优先权结构数据，情景仅为有条件的定性判断；未推断概率百分比或精确估值区间。
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV008
      - CV010
      - CV011
      - CV013
      - CV015
      - CV016
