  - id: FM001
    title: 资本资源优化可寻址规模层级
    type: pyramid
    summary: 分层规模模型展示从宏观资本摩擦到专业化自动优化支出的可寻址漏斗。
    data:
      items:
        - label: 宏观衍生品与外汇敞口（名义 TAM 基础）
          value: $6.6T+ daily
          detail: 全球场外外汇交易额和数万亿美元级衍生品总敞口，构成结构性的资产负债表需求。
        - label: 隐含监管资本计提（经济 TAM）
          value: $45B - $60B
          detail: 在 SA-CCR 和 Basel 标准下，全球监管资本计提以及交易商银行库存面临的流动性储备摩擦。
        - label: 资本市场交易后 IT 支出（企业 SAM）
          value: $12B - $18B
          detail: 全球一级银行和区域性金融机构每年在企业 IT 及专业交易后风险管理软件上的支出。
        - label: 核心金融资源管理软件
          value: $4.0B - $6.5B
          detail: 交易后软件中的细分领域，专门面向资产负债表优化、监管报告和抵押品再平衡。
        - label: 目标多边优化池（SOM）
          value: $1.5B - $2.5B
          detail: 面向自动化多边压缩、外汇更新合约和代理证券借贷流程的目标可寻址费用池。
        - label: 近期扩张空间（证券融资）
          value: $500M - $800M
          detail: eSecLending 集成后，随着交易后代理证券借贷业务扩张释放的近期可寻址费用收入。
    approximationNotes: 市场规模各层代表基于全球银行资产负债表资本配置和专业交易后软件支出的概念化分析区间。
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM008
  - id: FP001
    title: 资本市场优化与借贷基础设施的竞争定位
    type: quadrant
    summary: 将资本市场替代方案置于工作流自动化和机构资产覆盖两个维度上。
    data:
      points:
        - label: Capitolis（核心平台）
          x: 4.5
          'y': 3.5
          detail: 衍生品压缩和外汇更新合约自动化程度高，资产类别覆盖持续扩大。
        - label: eSecLending
          x: 3.5
          'y': 4.5
          detail: 深耕机构资产所有者（可借出资产 $1.3T），专注于拍卖式借贷。
        - label: Capitolis-eSecLending 合并实体
          x: 4.8
          'y': 4.8
          detail: 将自动化多边资源优化与机构证券融资结合在一起的整合实体。
        - label: 托管银行（State Street / BNY）
          x: 2.5
          'y': 4.8
          detail: 机构资产基础庞大，但依赖传统的集合借贷和双边托管工作流。
        - label: 交易所公用事业（Quantile / TriOptima）
          x: 4.2
          'y': 2.8
          detail: 算法压缩效率高，但主要集中于已清算和场外利率衍生品。
        - label: 连续联结结算（CLS）
          x: 3.8
          'y': 2.2
          detail: 符合条件货币 PvP 结算的权威 FMU，但缺少结算前敞口削减能力。
        - label: 手工双边工作流
          x: 1.2
          'y': 1.5
          detail: 依赖双边电子表格、邮件更新合约和手工对账的传统现状执行方式。
    approximationNotes: 坐标反映定性尽调定位，评分范围为 1.0 至 5.0；X 轴代表工作流自动化和多边效率，Y 轴代表机构资产类别覆盖及客户广度。
    claimRefs:
      - CP001
      - CP002
      - CP004
      - CP005
      - CP007
      - CP013
