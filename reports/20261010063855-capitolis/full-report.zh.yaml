companyProfile:
  summary: >-
    Capitolis 是一家总部位于纽约的资本市场科技公司，为全球银行、交易商和机构资产所有者提供投资组合优化及资本市场基础设施。公司成立于 2017
    年，在纽约、伦敦和特拉维夫运营，并围绕可缓解资产负债表和资本约束的工作流产品，建立了覆盖 100 多家金融机构的战略网络。2026 年 10 月的融资及收购 eSecLending
    将平台拓展至证券借贷，但公司仍未披露经审计的收入、ARR 和现金流。
