              是公司五年内第四次重大收购，带来并购后整合挑战。证券借贷依赖精确的抵押品管理、自动召回、公司行动调整及持续交易对手敞口跟踪；平台整合或数据模型不兼容可能引发对账断裂、执行失败或延迟结算。自动化压缩和优化算法也存在模型风险，错误相关性假设可能集中基差风险或掩盖次级交易对手敞口。独立行业记录显示，公司在纽约、特拉维夫和伦敦的员工规模估计为
              101 至 250 人，工程能力须在算法开发与收购平台维护之间平衡。
