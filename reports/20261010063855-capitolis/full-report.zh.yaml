        title: 资本化历程、战略投资者联盟与资产负债表结构
        blocks:
          - type: paragraph
            body: >-
              Capitolis 已获得超过 $456 million 的公开披露股权资本及结构化信贷。2026 年 10 月，公司完成 $220 million 资本方案，包括以 $1.9 billion 投后估值完成的
              $120 million Series E 股权融资和 $100 million 债务额度。Citi 领投，Bank of America、Nomura、Tradeweb Markets、Barclays、BNP
              Paribas、J.P. Morgan、State Street 和 UBS 参与；债务由 First Citizens Innovation Banking、Hercules Capital 和
              Pinegrove Venture Partners 提供。CEO Gil Mandelzis 称债务资本成本更低，资金将用于重大外延扩张。
