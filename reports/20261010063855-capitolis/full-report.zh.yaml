        title: 创始团队、管理层与治理结构
        blocks:
          - type: paragraph
            body: >-
              Capitolis 于 2017 年由 Gil Mandelzis、Tom Glocer 和 Igor Teleshevsky 创立。Gil Mandelzis 曾任 ICAP 旗下 EBS BrokerTec
              CEO 并创办 Traiana；Tom Glocer 曾任 Thomson Reuters CEO；Igor Teleshevsky 自始负责工程架构。管理团队还包括 Okan Pekin、Murugan
              Manickam、Jon Gizzie 和 Ashwath Bhat，覆盖金融资源优化、资产负债表工程、监管压力测试和电子交易基础设施等专长。
            claimRefs:
              - CO002
              - CO009
