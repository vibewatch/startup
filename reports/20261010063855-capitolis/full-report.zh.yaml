      - number: '3.3'
        title: 商业包装与收费结构
        blocks:
          - type: paragraph
            body: >-
              交易后金融基础设施的商业条款通常不公开，也没有公开价目表或标准 SaaS 分层。Capitolis
              通过订阅承诺加按处理量或量化资本减负计算的浮动费用变现；外汇更新平台按完成的更新票据或转移的总名义金额收取处理费。eSecLending
              按绩效分成，保留拍卖产生的总借贷利差中协商比例。多系统集成、法律文件和交易对手开户使客户切换成本很高。
