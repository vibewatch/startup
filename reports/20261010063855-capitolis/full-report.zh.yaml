        title: 平台能力与技术差异化
        blocks:
          - type: paragraph
            body: >-
              Capitolis 以专门执行架构实现衍生品优化和证券借贷差异化。其外汇平台连接主经纪商、执行交易商和买方管理人，自动执行期权更新及交易台转移；投资组合优化则运行多边压缩，提前减少总名义金额和交易对手敞口。收购
              eSecLending 后，公司进入代理证券借贷，为受益所有人提供隔离、拍卖驱动的借贷计划，替代混合托管池。
