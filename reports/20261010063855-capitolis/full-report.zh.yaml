          detail: 位于 NY/TLV/LDN 的专业金融工程团队，以及漫长的银行销售周期
        - id: cash-flow-servicing
          label: 净现金流与偿债义务
          detail: 目标为实现正经营现金流，为 $100M 债务融资和持续运营提供支持
      edges:
        - from: institutional-network
