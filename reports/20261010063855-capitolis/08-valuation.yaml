  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: acquisition
      missingEvidence: >-
        Audited eSecLending revenue, margin, retention, purchase accounting, and
        integration targets are not publicly available.
      whyItMatters: >-
        These metrics determine whether the reported $200 million price and
        acquisition financing create or destroy value.
      diligencePath: >-
        Obtain the purchase agreement, quality-of-earnings report, audited target
        financials, customer cohorts, and board-approved integration plan.
      relatedQuestionRefs: [QV003]
      relatedTableRefs: [TV002, TV003]
    - type: missing-source
      severity: material
      topic: comparables
      missingEvidence: >-
        Current operating metrics and like-for-like trading or transaction
        multiples for a directly comparable capital-markets software cohort are
        unavailable in the assigned public evidence.
      whyItMatters: >-
        Historical IPO sales multiples span incompatible companies and vintages
        and cannot establish a defensible Capitolis valuation range.
      diligencePath: >-
        Build a banker-reviewed comparable set using current revenue mix, growth,
        margins, recurring-revenue share, and transaction-date multiples.
      relatedQuestionRefs: [QV006]
      relatedTableRefs: [TV003]
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: >-
        Debt pricing, covenants, maturity, liquidation preferences, ownership,
        and fully diluted capitalization are not publicly disclosed.
      whyItMatters: >-
        These terms determine downside protection, dilution, control, and the
        return available to a new investor at the headline valuation.
      diligencePath: >-
        Review executed credit agreements, the charter, investor-rights
        agreements, capitalization table, option pool, and waterfall model.
      relatedQuestionRefs: [QV002, QV010]
      relatedTableRefs: [TV001, TV003]
