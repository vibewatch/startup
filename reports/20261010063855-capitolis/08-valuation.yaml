schemaVersion: "report-v2"
artifact: valuation
slug: capitolis
runDate: 2026-10-10
company:
  name: Capitolis
chapter:
  number: 8
  title: Valuation
  summary: >-
    Capitolis' October 2026 Series E establishes a $1.9 billion private-market
    reference point, but public evidence does not disclose company-wide revenue,
    profitability, debt terms, or acquired-business economics. The appropriate
    stance is research more: strategic backing and the eSecLending expansion are
    constructive, while price discipline must reflect integration, leverage, and
    customer-investor concentration.
sections:
  - id: investment-decision
    title: Investment decision and evidence boundary
    body: >-
      The public record supports a research-more recommendation, not a buy at the
      latest mark. The October financing confirms a $120 million Series E at a
      $1.9 billion valuation, and the participation of major banks indicates that
      strategically important market participants are willing to commit capital.
      That is useful validation of relevance, but several investors are also
      counterparties or customers, so their participation is not independent
      evidence of durable retention, unit economics, or stand-alone enterprise
      value. Public sources do not disclose company-wide revenue, ARR, GAAP
      profitability, cash burn, or free cash flow. Without those denominators, a
      revenue multiple, discounted-cash-flow value, or target return would create
      false precision. The underwriting risk is therefore high even though the
      operating signal is constructive: investors can verify the transaction,
      but not whether the $1.9 billion price offers an adequate margin of safety.
    claimRefs: [CV001, CV006, CV009, CV010, CV013, CV014]
    tableRefs: [TV001, TV002]
  - id: financing-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      The financing is acquisition-oriented rather than a clean organic-growth
      benchmark. Capitolis paired equity with approximately $100 million of debt
      while directing the package toward eSecLending, whose reported $200 million
      all-cash purchase price is material relative to the new capital. An
      independent commentary source calculates that the new mark is only about
      19% above the 2022 valuation, which is modest over four years and does not
      by itself demonstrate value creation. Management says debt is cheaper and
      expects meaningful cash flow, but those forward statements are not a
      substitute for covenants, debt service, audited earnings, or target-level
      revenue. Entry at or above the last-round mark should therefore require
      verified integration economics and net retention. A discount to that mark
      would improve downside protection, but the evidence does not support a
      precise discount or return threshold.
    claimRefs: [CV002, CV003, CV004, CV005, CV008, CV015, CV016]
    figureRefs: [FV001]
  - id: scenarios-and-exit-readiness
    title: Scenarios, exit readiness, and thesis-break tests
    body: >-
      The bull case requires eSecLending to add recurring securities-lending
      revenue and asset-owner relationships while Capitolis converts bank backing
      into diversified commercial demand. The base case assumes the transaction
      broadens the platform but that valuation remains anchored near the latest
      private round until audited economics become visible. The bear case is an
      integration or leverage shortfall in which customer-investor concentration
      and weak disclosure compound refinancing or down-round risk. Public-company
      IPO precedents span roughly 0.99x to 13.5x sales in one compiled dataset,
      but the different companies and vintages make that range unsuitable for
      pricing Capitolis without a current revenue denominator. Exit readiness is
      therefore unproven. Before investment, obtain audited financials, cohort
      retention, customer concentration, debt documents, preference terms, and a
      purchase-accounting bridge. A missed integration plan, covenant pressure,
      strategic-bank churn, or inability to produce audited economics should
      break the thesis.
    claimRefs: [CV007, CV008, CV010, CV011, CV012, CV013, CV015, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision field, Current judgment, Evidence boundary, Decision implication]
    rows:
      - [Recommendation, "Research more", "Transaction terms are public; operating economics are not", "Do not underwrite a buy from public evidence alone"]
      - [Confidence, Medium, "Multiple sources confirm the financing, but several syndicate the company release", "Require primary data-room evidence before commitment"]
      - [Risk rating, High underwriting risk, "Debt-funded acquisition and integration metrics are undisclosed", "Size no position before covenant and integration review"]
      - [Valuation stance, "Price-sensitive at the $1.9B mark", "No public revenue or cash-flow denominator supports a defensible multiple", "Prefer a discount or substantially better disclosure"]
      - [Exit readiness, Unproven, "Private financing validates access to capital, not IPO or M&A readiness", "Test audit quality, governance, and buyer or listing comparables"]
    notes: >-
      Judgments use the October 2026 financing as the only current price marker;
      no revenue multiple or target return is calculated because public financial
      denominators and preference terms are unavailable.
    claimRefs: [CV001, CV002, CV006, CV009, CV013, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-supported argument, What would change the view]
    rows:
      - [Thesis, "Major banks funded the Series E, supporting strategic relevance", "Evidence of low bank concentration and repeat commercial usage would strengthen the thesis"]
      - [Thesis, "eSecLending can extend the platform into securities lending and asset owners", "Verified target revenue, retention, and integration milestones would strengthen the thesis"]
      - [Anti-thesis, "Customer-investors may make capital backing look more independent than it is", "Independent customer wins and cohort retention would weaken this concern"]
      - [Anti-thesis, "Debt and acquisition integration add downside while economics remain opaque", "Covenant headroom, audited cash generation, and an achieved synergy plan would weaken this concern"]
    notes: >-
      The table separates verified transaction facts from analytical implications;
      requested change-of-view evidence is not represented as an achieved result.
    claimRefs: [CV003, CV008, CV009, CV010, CV014, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Explicit assumptions, Valuation and return logic, Probability signal, Downside or upside trigger]
    rows:
      - [Bull, "eSecLending adds recurring revenue; integration retains asset owners; bank demand diversifies", "Above the $1.9B mark is supportable only after audited growth and cash conversion are demonstrated", "Not quantifiable from public data; look for audited acceleration and broad customer retention", "Upside: verified target economics and sustained positive cash flow"]
      - [Base, "Platform broadens, but disclosure and integration evidence arrive gradually", "Use the $1.9B round as a reference mark, not intrinsic value; demand a disclosure or price concession", "Most consistent with the verified financing and unresolved financial gaps", "Re-rate only after audited revenue, margin, retention, and covenant evidence"]
      - [Bear, "Integration slips, leverage tightens, or strategic-bank demand weakens", "Value should fall materially below the last-round mark; no precise floor is supportable", "Watch covenant headroom, customer-investor churn, and missed integration milestones", "Thesis break: covenant pressure, strategic-bank churn, or no auditable economics"]
    notes: >-
      Scenarios are conditional and qualitative because public sources do not
      provide company-wide revenue, profitability, cash flow, debt terms, or
      preference-stack data; no probability percentage or precise valuation range
      is inferred.
    claimRefs: [CV004, CV006, CV007, CV008, CV010, CV011, CV013, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Verified strategic backing narrows to a research-more decision after
      testing the missing economic and transaction evidence.
    data:
      nodes:
        - id: financing-proof
          label: "$120M Series E at $1.9B"
          detail: Current private-market price marker is verified.
        - id: strategic-proof
          label: Strategic-bank backing
          detail: Supports relevance but overlaps with customers and counterparties.
        - id: expansion-proof
          label: eSecLending expansion
          detail: Adds a plausible securities-lending growth path.
        - id: economics-gap
          label: Economics undisclosed
          detail: Revenue, profitability, cash flow, and target economics remain unavailable.
        - id: risk-adjustment
          label: Leverage and integration risk
          detail: Debt and acquisition execution reduce confidence at the latest mark.
        - id: decision
          label: Research more
          detail: Invest only after evidence improves or price supplies downside protection.
    approximationNotes: >-
      This is a qualitative decision chain; it does not assign weights,
      probabilities, inferred conversion rates, or a numeric valuation.
    claimRefs: [CV013, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Research more before pricing an entry
    body: >-
      Treat $1.9 billion as a financing reference, not independently established
      intrinsic value. Require audited company and target economics, debt and
      preference terms, customer concentration, and integration milestones.
    claimRefs: [CV001, CV006, CV013, CV016]
