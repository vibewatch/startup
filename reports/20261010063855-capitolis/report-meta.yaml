  topStrengths:
    - Deep workflow integration with tier-one banks creates high switching costs and commercial relevance.
    - Strategic bank investors validate the platform's importance to large market participants.
    - Expansion into securities lending could widen the addressable workflow surface.
  topRisks:
    - Audited revenue, ARR, and cash-flow disclosure remain private, limiting valuation confidence.
    - The acquisition-funded structure adds leverage and integration risk.
    - Customer-investor concentration makes strategic backing less independent than it appears.
  unresolvedGaps:
