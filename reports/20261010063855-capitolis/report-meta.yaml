companyProfile:
  summary: "Capitolis is a New York-based capital-markets technology company that provides portfolio optimization and capital marketplace infrastructure to global banks, dealers, and institutional asset owners. Founded in 2017, the company operates across New York, London, and Tel Aviv, and it has built a strategic network of more than 100 financial institutions around workflow products that reduce balance-sheet and capital constraints. The October 2026 financing and eSecLending acquisition broaden the platform into securities lending, but the company still withholds audited revenue, ARR, and cash-flow disclosure."
