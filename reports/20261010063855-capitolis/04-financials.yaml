company:
  name: "Capitolis"
chapter:
  number: 4
  title: "Financials"
  summary: "Capitolis operates a capital-markets software and financial resource optimization platform serving tier-one global investment banks and institutional asset owners. While top-line revenue and unit economics remain strictly private, a reported 65% year-over-year revenue growth in 2026 and an October 2026 $220 million debt-and-equity financing round at a $1.9 billion post-money valuation highlight accelerating scale alongside substantial balance sheet leverage from $100 million in newly incurred venture debt backing its $200 million all-cash acquisition of eSecLending."
sections:
  - id: "revenue-streams-and-pricing-architecture"
    title: "Revenue Model, Pricing Mechanics, and Commercial Monetization"
    body: "Capitolis generates revenue by addressing structural balance sheet, capital adequacy, and liquidity constraints across global financial institutions through two primary business engines: Portfolio Optimization and Capital Marketplace. The Portfolio Optimization engine automates multi-lateral trade compression, FX options novation, unwinds, and Standardized Approach for Counterparty Credit Risk (SA-CCR) exposure reductions. In this segment, the platform functions under a financial resource optimization software model, monetizing either via contracted platform SaaS subscription tiers or volume-linked transaction fees calculated on compressed notional exposure and optimized trade volume. The Capital Marketplace connects capital-constrained global tier-one banks with alternative capital providers and institutional investors, earning structured arrangement and agency execution spread fees on capital deployed against high-grade credit and equity assets. Commercial pricing terms remain bespoke and confidential, customized according to client trading book complexity, counterparty density, and bilateral netting efficiency rather than published rate cards."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "unit-economics-and-cost-structure"
    title: "Cost Structure Dynamics and Service Delivery Economics"
    body: "The cost structure of Capitolis reflects a hybrid architecture combining cloud-native financial algorithm execution with intensive institutional relationship management. Cost of goods sold (COGS) comprises secure cloud computing infrastructure (AWS/Azure) required to execute complex mathematical optimization runs across millions of cleared and uncleared derivative contracts, regulatory data feeds, and specialized post-trade operations. Operating expenditures are dominated by elite quantitative engineering talent across New York, Tel Aviv, and London, complemented by senior capital markets sales professionals required to navigate multi-month bank risk and procurement cycles. While gross margins for its software workflows likely exceed traditional software-as-a-service baselines (estimated at 70% to 80%), overall contribution margins are diluted by high customer acquisition costs (CAC) driven by lengthy institutional proof-of-concept stages and regulatory audits. Furthermore, the all-cash acquisition of eSecLending introduces operational servicing costs associated with agency securities lending administration, custodian connectivity, and collateral monitoring."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-leverage-analysis"
    title: "Capital Adequacy, Cash Burn, and Debt Financing Dependencies"
    body: "Capitolis reached a $1.9 billion post-money valuation following its October 2026 financing round of $220 million, comprising $120 million in Series E equity led by Citi and $100 million in debt facilities provided by First Citizens Innovation Banking, Hercules Capital, and Pinegrove Venture Partners. Total equity capital raised to date surpasses $450 million (with third-party trackers recording total aggregate funding between $456 million and $473.7 million). The deliberate addition of $100 million in venture debt represents a pivotal shift in corporate financing strategy. Founder and CEO Gil Mandelzis explicitly stated that debt was chosen over equity due to its lower cost of capital, asserting that the combined business will soon start generating significant positive cash flow and tens of millions of dollars in revenue from eSecLending in the coming year. However, deploying $200 million in cash for eSecLending alongside debt service obligations creates material liquidity and debt covenant dependencies that require rapid execution and synergy realization."
    claimRefs:
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
  - id: "financial-diligence-verdict"
    title: "Financial Verdict, Reporting Gaps, and Underwriting Blockers"
    body: "From an institutional underwriting perspective, Capitolis exhibits extraordinary shareholder quality, boasting direct strategic equity participation from ten of the world's most prominent financial institutions, including Citi, J.P. Morgan, Bank of America, Barclays, BNP Paribas, Nomura, State Street, UBS, and Tradeweb. Secondary private share structures reflect a $5.46 Series E common/voting share price with standard 1.0x non-participating liquidation preferences. Nevertheless, Capitolis maintains complete confidentiality over its core audited financial metrics: net revenue, gross margin, operating EBITDA, net revenue retention (NRR), customer lifetime value (LTV), and cash burn rate remain entirely undisclosed to the public. The primary diligence blockers center on verifying the organic trajectory of its legacy optimization software relative to the acquired revenue base of eSecLending, and confirming that cash generation from operations can adequately amortize $100 million in senior debt without necessitating future dilutive equity recapitalizations."
    claimRefs:
      - "CI014"
      - "CI015"
      - "CI016"
