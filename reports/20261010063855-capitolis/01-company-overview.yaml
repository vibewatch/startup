chapter:
  number: 1
  title: "Company Overview"
  summary: "Capitolis is a New York-based financial technology company providing capital marketplace and portfolio optimization infrastructure for over 100 global financial institutions. Founded in 2017, the company reached a $1.9 billion post-money valuation in October 2026 via a $220 million financing package ($120 million Series E equity led by Citi alongside $100 million in debt) to finance its $200 million acquisition of securities lending provider eSecLending."
sections:
  - id: "company-identity-and-operating-model"
    title: "Company Identity, Core Mission, and Operating Model"
    body: "Capitolis Inc. is an enterprise capital-markets technology platform founded in 2017 and headquartered in New York City, maintaining secondary engineering and operational centers in London and Tel Aviv. The institution operates as specialized market infrastructure designed to eliminate systemic capital bottlenecks across global banking networks. Through its proprietary computational architecture, Capitolis provides two interconnected operational solutions: Portfolio Optimization and Capital Marketplace. The Portfolio Optimization engine multilateralizes derivative contract unwinds, compression, and SA-CCR capital requirement reductions across foreign exchange and rates desks without altering underlying economic exposures. Concurrently, Capital Marketplace connects tier-one originating banks constrained by regulatory balance-sheet limits with institutional asset allocators seeking asset yield. The company currently counts more than 100 of the world's most prominent financial institutions as active network participants, establishing deep operational embeddedness across global tier-one broker-dealers."
    claimRefs:
      - CO001
      - CO006
      - CO010
    tableRefs:
      - TO001
    figureRefs: []
  - id: "founding-leadership-and-governance"
    title: "Founding Pedigree, Executive Leadership, and Governance Structure"
    body: "Capitolis was established in 2017 by seasoned capital-markets executives Gil Mandelzis, Tom Glocer, and Igor Teleshevsky. Chief Executive Officer Gil Mandelzis previously served as CEO of EBS BrokerTec within ICAP and founded Traiana, a leading post-trade and risk-mitigation platform acquired by ICAP, creating an exceptional pedigree in building mission-critical interbank workflows. Executive Chairman Tom Glocer brings governance authority as the former CEO of Thomson Reuters, while Co-Founder Igor Teleshevsky led engineering architecture from inception. The operational management team has been augmented with senior tier-one banking talent, including President Okan Pekin, Chief Technology Officer Murugan Manickam, Head of Financial Resource Management Jon Gizzie, and Chief Financial Officer Ashwath Bhat. The executive apparatus reflects deep domain specialization in financial resource optimization, balance-sheet engineering, regulatory stress testing, and electronic transaction infrastructure."
    claimRefs:
      - CO002
      - CO009
    tableRefs:
      - TO002
    figureRefs: []
  - id: "capitalization-investors-and-syndicate"
    title: "Capitalization History, Strategic Syndicate, and Balance Sheet Structure"
    body: "Capitolis has executed a highly strategic institutional capitalization program, accumulating more than $456 million in disclosed equity capital alongside structured credit. In October 2026, the company completed a $220 million capital package consisting of a $120 million Series E equity round at a $1.9 billion post-money valuation and a $100 million debt financing facility. Existing lead investor Citi anchored the equity tranche, joined by new strategic investors Bank of America, Nomura, and Tradeweb Markets, alongside longstanding consortium partners Barclays, BNP Paribas, J.P. Morgan, State Street, and UBS. Debt financing was structured through First Citizens Innovation Banking, Hercules Capital, and Pinegrove Venture Partners. CEO Gil Mandelzis explicitly defended the hybrid equity-debt architecture, indicating that debt offered a lower cost of capital ahead of near-term positive operating cash generation, with capital directed to fund major inorganic expansion."
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO008
      - CO012
    tableRefs:
      - TO003
    figureRefs: []
  - id: "corporate-milestones-and-scale-trajectory"
    title: "Corporate Milestones, M&A Expansion, and Operating Scale"
    body: "The strategic trajectory of Capitolis highlights rapid platform maturation punctuated by targeted market expansion and operational adjustments. Founded in 2017, the firm advanced through Series A, B, and C rounds before reaching unicorn status with a $1.6 billion Series D in March 2022. Following macroeconomic headwinds in late 2022 that prompted a restructuring and headcount reduction of 37 personnel down to 124 employees, Capitolis successfully stabilized its operating model, expanding past 200 professionals by late 2026. The milestone October 2026 financing facilitated an agreement to acquire independent securities lending leader eSecLending for $200 million in all-cash consideration. While the acquisition substantially expands the firm's client perimeter to institutional asset owners, Capitolis continues to maintain strict private-company confidentiality regarding audited GAAP revenue and ARR figures, leaving headline run-rate projections dependent on diligence verification."
    claimRefs:
      - CO007
      - CO011
      - CO013
      - CO014
    tableRefs: []
    figureRefs:
      - FO001
