callouts:
  - calloutType: "insight"
    title: "Regulatory Tailwinds from CFTC PTRRS No-Action Relief"
    body: "The June 2026 CFTC no-action relief letter establishes critical regulatory clarity for post-trade risk reduction services in the United States. By confirming that PTRRS providers like Capitolis can operate optimization runs without registration as swap execution facilities (SEFs) and exempting qualifying runs from standard clearing and real-time reporting mandates, regulatory friction has substantially decreased. This harmonizes U.S. operations with established European frameworks and directly accelerates multi-tenant bank participation."
    claimRefs:
      - "CM012"
      - "CM013"
  - calloutType: "risk"
    title: "Multi-Tenant Coordination Inertia and Institutional Switching Friction"
    body: "A fundamental operational constraint in multilateral capital optimization is network coordination. Compressing derivatives notionals or executing automated novation runs requires synchronous participation and algorithmic consensus across numerous competing Tier-1 institutions. If key dealer counterparties fail to join an optimization cycle, network benefits drop non-linearly, leaving bilateral manual processes as a resilient fallback."
    claimRefs:
      - "CM002"
      - "CM015"
