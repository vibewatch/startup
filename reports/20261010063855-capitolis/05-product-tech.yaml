company:
  name: "Capitolis"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Capitolis publicly presents a networked financial-resource platform built around Capital Marketplace, Portfolio Optimization, FX novations, and settlement optimization. The proposed eSecLending acquisition would extend that operating surface into securities lending, but the allocated evidence does not disclose a technical integration plan, current service levels, or independently verified security controls."
sections:
  - id: "product-surface"
    title: "Product Surface and User Jobs"
    body: "The public product surface is organized around institutional funding, capital, and balance-sheet workflows rather than a conventional self-serve software suite. Independent reporting and the syndicated company release identify Capital Marketplace and Portfolio Optimization as the existing businesses, while Capitolis's own archive describes FX novations and settlement optimization as operational services for banks, executing firms, prime brokers, hedge funds, and real-money managers. In workflow terms, the product coordinates multiple institutions to remove unnecessary positions, reduce settlement exposure, or transfer FX option obligations. This evidence supports a networked operating model, but it does not establish the underlying code architecture, deployment topology, pricing, or contractual service levels."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE009"
    tableRefs:
      - "TE001"
    figureRefs: []
  - id: "workflow-and-maturity"
    title: "Workflow Automation and Maturity Signals"
    body: "The strongest maturity signals are production-use claims in Capitolis's own archive. The company says its novations platform automates a previously manual process, that participant response times had fallen by more than half, and that agency novation can preserve anonymity. The same archive reports more than 81,000 novated trades and more than $9 trillion of reduced notional at the time of the underlying 2023 release. A separate company post describes a nine-bank proof of concept connecting Capitolis optimization with LCH FX Smart Clearing and reports a 42% network yield of total funding costs. These are useful scale and workflow indicators, but they remain company-issued and are not current service-level or reliability statistics."
    claimRefs:
      - "CE002"
      - "CE003"
      - "CE005"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE002"
    figureRefs: []
  - id: "operating-architecture"
    title: "Public Operating Architecture and Dependencies"
    body: "Available evidence supports an operating architecture, not a verified software-stack diagram. The workflow begins with participating institutions and their portfolios, applies novation or optimization logic, coordinates outcomes across a network, and can connect optimized trades to cleared or uncleared markets through LCH. A company-authored job description reposted on Canapi's board also indicates that Capitolis relies on third-party capital-markets software and seeks integrations between those tools and an in-house platform, with APIs, data models, and straight-through processing named as relevant skills. That recruiting evidence is directional rather than proof of deployed components, vendor names, data protocols, or production controls, so the architecture exhibit deliberately avoids inventing those details."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "expansion-and-control-gaps"
    title: "Securities-Lending Expansion and Control Gaps"
    body: "The proposed eSecLending transaction is the main roadmap signal in the assigned evidence. It would add an institutional asset-owner network and securities-lending capabilities, but Quasa reports that the transaction remains subject to closing conditions and that eSecLending (Europe) Limited is excluded while expected to continue providing services. That boundary creates a visible post-close dependency even before technical integration is considered. The assigned sources disclose no migration sequence, compatibility design, uptime targets, security certifications, privacy controls, incident history, or status metrics. Developer-signal coverage is also weak: the allocated candidates are job-board or aggregator pages, including pages with generic or mismatched content, not repositories, package registries, documentation, or practitioner forums. Those omissions are diligence gaps, not evidence that controls or developer assets do not exist."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
    tableRefs: []
    figureRefs: []
