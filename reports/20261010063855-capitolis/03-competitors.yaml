callouts:
  - calloutType: risk
    title: "Post-Merger Integration and Client Conflict Risks"
    body: "The acquisition of eSecLending adds operational complexity across collateral management, legal agreements, and real-time trade recalls. Because eSecLending's beneficial owner clients value agent independence and strict data barriers, Capitolis must ensure that platform integration does not create perceived conflicts of interest with its dealer bank shareholders or introduce execution vulnerabilities."
    claimRefs:
      - CP007
      - CP008
      - CP010
  - calloutType: strength
    title: "Strategic Moat via Bank Consortium Alignment"
    body: "Capitolis' shareholder roster includes premier dealer institutions such as Citi, Bank of America, Barclays, BNP Paribas, J.P. Morgan, Nomura, State Street, and UBS. By aligning equity ownership with platform network participation, Capitolis creates high structural switching barriers and defense against incumbent exchange utilities."
    claimRefs:
      - CP009
      - CP010

