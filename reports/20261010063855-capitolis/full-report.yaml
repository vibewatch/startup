  - id: FP001
    title: 'Competitive Positioning: Capital Markets Optimization and Lending Infrastructure'
    type: quadrant
    summary: Positions capital markets alternatives across workflow automation and institutional asset coverage.
    data:
      points:
        - label: Capitolis (Core Platform)
          x: 4.5
          'y': 3.5
