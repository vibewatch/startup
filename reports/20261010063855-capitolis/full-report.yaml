  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Core Categories, and Spend Taxonomy
        blocks:
          - type: paragraph
            body: >-
              The institutional financial resource management (FRM) and capital optimization market spans post-trade
              risk reduction services (PTRRS), multilateral derivatives compression, trade novation workflows, and
              securities finance balance sheet intermediation. Capitolis structures its addressable market across two
              core operating pillars: Portfolio Optimization and Capital Marketplace. The boundary of addressable
              institutional spend is defined by the direct regulatory capital charges (such as the Standardized Approach
              for Counterparty Credit Risk, or SA-CCR, and Basel leverage ratios), credit intermediation fees, and
              operational costs that global Tier-1 and Tier-2 investment banks, institutional asset managers, and hedge
              funds incur to maintain derivatives and securities inventory. Excluded from this boundary are front-office
              execution commissions, vanilla retail brokerage clearing, and bilateral physical custody fees. Status-quo
              substitutes have historically comprised bilateral netting agreements, manual voice-broker novation chains,
              and balance sheet hoarding by dealer banks. By establishing an automated SaaS network, Capitolis converts
              bilateral, manual post-trade interventions into programmatic, multilateral optimization runs that
              eliminate non-market risk and compress gross notional exposure.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
      - number: '2.2'
        title: Addressable Market Sizing, TAM/SAM/SOM Lenses, and Analytical Constraints
        blocks:
          - type: paragraph
            body: >-
              Evaluating the total addressable market for post-trade risk reduction and financial resource optimization
              requires multi-lens analysis rather than a single speculative top-line figure. At the broadest macro layer
              (TAM Lens 1), global OTC derivatives and currency markets represent vast notional exposures, with the
              global foreign exchange market alone averaging over $6.6 trillion in daily turnover. Across cleared and
              uncleared derivatives in FX, interest rate swaps, and credit, dealer banks allocate billions of dollars in
              regulatory capital reserves and liquidity buffers to support counterparty exposures. At the service and
              software layer (SAM Lens 2), global capital markets technology and post-trade optimization software
              command an estimated $12B to $18B addressable annual spend across Tier-1 and regional dealer banks, market
              infrastructure operators, and institutional asset owners. Within this pool, the serviceable obtainable
              market (SOM Lens 3), representing automated multilateral novation, SA-CCR compression, and agency
              securities lending workflow tools, constitutes a $1.5B to $2.5B annual addressable fee pool. Capitolis
              captures revenue via platform subscription fees, transaction-based optimization run fees, and
              volume-linked intermediation economics. Sizing this market carries inherent private-market analytical
              limitations: because top-tier dealer banks absorb capital charges internally across distributed balance
              sheet line items, explicit third-party software budgets for post-trade resource optimization are rarely
              published as distinct line items in public statutory disclosures.
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Adoption of capital optimization platforms is governed by specialized institutional buyer personas across
              the financial ecosystem. The primary buyer within Tier-1 global systemically important banks (G-SIBs) is
              the Head of Financial Resource Management (FRM), alongside Treasury heads and Global Heads of Trading
              Desks (FX, Rates, Macro). These executives evaluate software based on capital velocity, leverage ratio
              relief, and return on regulatory capital (RORC). Operational users comprise post-trade operations teams,
              middle-office trade support, and collateral management specialists who execute novation files and
              reconcile margin. Budget ownership typically sits within central Corporate Treasury, Chief Operating
              Officer (COO) allocations, or shared markets infrastructure capital expenditure. Conversely, institutional
              asset managers and pension fund clients are represented by Chief Investment Officers and Heads of
              Securities Lending, whose adoption trigger is unlocking incremental yield on long portfolios without
              expanding balance sheet counterparty risk. Procurement cycles in this enterprise Tier-1 domain are
              prolonged, commonly spanning 9 to 18 months due to rigorous information security reviews, counterparty
              credit assessments, and core banking integration requirements across secure API gateways and enterprise
              microservices.
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Structural Growth Drivers, Regulatory Catalysts, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Market demand for Capitolis' optimization suite is propelled by a confluence of regulatory, macroeconomic,
              and capital-efficiency catalysts. Key regulatory drivers include the global rollout of SA-CCR, the
              phase-in of Uncleared Margin Rules (UMR), and the tightening of Basel III/IV supplementary leverage
              ratios, which penalize banks for un-netted gross notional derivative positions and high counterparty
              credit exposures. Regulatory relief has emerged as an accelerator: on June 18, 2026, the U.S. Commodity
              Futures Trading Commission (CFTC) issued a landmark no-action relief letter for post-trade risk reduction
              services (PTRRS), granting U.S. market participants exemptions from certain derivatives clearing,
              execution venue registration, and real-time reporting requirements during non-market risk compression
              runs. This action harmonized U.S. standards with existing UK and EU regulatory frameworks. Concurrently,
              interest rate volatility and rising cost of funding have elevated balance sheet efficiency to a
              board-level priority. Offsetting these drivers are formidable adoption constraints: high switching costs,
              multi-lateral coordination inertia (an optimization run requires simultaneous participation of multiple
              peer banks), and the technical complexity of integrating core banking architectures with strict regulatory
              privacy, audit, and resilience standards.
            claimRefs:
              - CM003
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Tailwinds from CFTC PTRRS No-Action Relief
            body: >-
              The June 2026 CFTC no-action relief letter establishes critical regulatory clarity for post-trade risk
              reduction services in the United States. By confirming that PTRRS providers like Capitolis can operate
              optimization runs without registration as swap execution facilities (SEFs) and exempting qualifying runs
              from standard clearing and real-time reporting mandates, regulatory friction has substantially decreased.
              This harmonizes U.S. operations with established European frameworks and directly accelerates multi-tenant
              bank participation.
            calloutType: insight
            claimRefs:
              - CM012
              - CM013
          - type: callout
            title: Multi-Tenant Coordination Inertia and Institutional Switching Friction
            body: >-
              A fundamental operational constraint in multilateral capital optimization is network coordination.
              Compressing derivatives notionals or executing automated novation runs requires synchronous participation
              and algorithmic consensus across numerous competing Tier-1 institutions. If key dealer counterparties fail
              to join an optimization cycle, network benefits drop non-linearly, leaving bilateral manual processes as a
              resilient fallback.
            calloutType: risk
            claimRefs:
              - CM002
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Market Taxonomy and Competitive Landscape
        blocks:
          - type: paragraph
            body: >-
              Capitolis operates at the intersection of capital resource optimization, post-trade OTC derivatives
              novation, and institutional securities finance. In institutional capital markets, banks and asset managers
              face intense balance sheet and capital constraints driven by regulatory frameworks such as SA-CCR and
              Basel III Endgame rules. The competitive field divides into three distinct categories: incumbent global
              custodian banks operating traditional pooled securities lending programs, exchange-backed portfolio
              compression utilities concentrating on interest rate swaps and cleared derivatives, and the status-quo
              operating model of bilateral manual processing. Rather than acting as a traditional bilateral broker,
              Capitolis functions as a multilateral technology network that connects executing banks, prime brokers, and
              institutional asset owners to eliminate redundant exposures and optimize scarce balance sheet capacity.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP010
              - CP011
          - type: table
            tableRef: TP001
