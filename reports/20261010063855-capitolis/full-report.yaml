  - id: TV001
    title: Recommendation summary
    columns:
      - Decision field
      - Current judgment
      - Evidence boundary
      - Decision implication
    rows:
      - - Recommendation
        - Research more
        - Transaction terms are public; operating economics are not
        - Do not underwrite a buy from public evidence alone
      - - Confidence
        - Medium
        - Multiple sources confirm the financing, but several syndicate the company release
        - Require primary data-room evidence before commitment
      - - Risk rating
        - High underwriting risk
        - Debt-funded acquisition and integration metrics are undisclosed
        - Size no position before covenant and integration review
      - - Valuation stance
        - Price-sensitive at the $1.9B mark
        - No public revenue or cash-flow denominator supports a defensible multiple
        - Prefer a discount or substantially better disclosure
      - - Exit readiness
        - Unproven
        - Private financing validates access to capital, not IPO or M&A readiness
        - Test audit quality, governance, and buyer or listing comparables
    notes: >-
      Judgments use the October 2026 financing as the only current price marker; no revenue multiple or target return is
      calculated because public financial denominators and preference terms are unavailable.
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV009
      - CV013
      - CV015
      - CV016
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-supported argument
      - What would change the view
    rows:
      - - Thesis
        - Major banks funded the Series E, supporting strategic relevance
        - Evidence of low bank concentration and repeat commercial usage would strengthen the thesis
      - - Thesis
        - eSecLending can extend the platform into securities lending and asset owners
        - Verified target revenue, retention, and integration milestones would strengthen the thesis
      - - Anti-thesis
        - Customer-investors may make capital backing look more independent than it is
        - Independent customer wins and cohort retention would weaken this concern
      - - Anti-thesis
        - Debt and acquisition integration add downside while economics remain opaque
        - Covenant headroom, audited cash generation, and an achieved synergy plan would weaken this concern
    notes: >-
      The table separates verified transaction facts from analytical implications; requested change-of-view evidence is
      not represented as an achieved result.
    claimRefs:
