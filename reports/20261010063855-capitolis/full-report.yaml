      - number: '1.4'
        title: Corporate Milestones, M&A Expansion, and Operating Scale
        blocks:
          - type: paragraph
            body: >-
              The strategic trajectory of Capitolis highlights rapid platform maturation punctuated by targeted market
              expansion and operational adjustments. Founded in 2017, the firm advanced through Series A, B, and C
              rounds before reaching unicorn status with a $1.6 billion Series D in March 2022. Following macroeconomic
              headwinds in late 2022 that prompted a restructuring and headcount reduction of 37 personnel down to 124
              employees, Capitolis successfully stabilized its operating model, expanding past 200 professionals by late
              2026. The milestone October 2026 financing facilitated an agreement to acquire independent securities
              lending leader eSecLending for $200 million in all-cash consideration. While the acquisition substantially
              expands the firm's client perimeter to institutional asset owners, Capitolis continues to maintain strict
              private-company confidentiality regarding audited GAAP revenue and ARR figures, leaving headline run-rate
              projections dependent on diligence verification.
