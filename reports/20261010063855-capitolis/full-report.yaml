            balance sheet demand.
        - label: Implied Regulatory Capital Charges (Economic TAM)
          value: $45B - $60B
          detail: >-
            Global regulatory capital charges and liquidity reserve friction across dealer bank inventory under SA-CCR
            and Basel standards.
        - label: Capital Markets Post-Trade IT Spend (Enterprise SAM)
          value: $12B - $18B
          detail: >-
            Annual enterprise IT and specialized post-trade risk management software spend across global Tier-1 and
            regional financial institutions.
        - label: Core Financial Resource Management Software
          value: $4.0B - $6.5B
          detail: >-
            Sub-segment of post-trade software targeted specifically at balance sheet optimization, regulatory
            reporting, and collateral rebalancing.
        - label: Target Multilateral Optimization Pool (SOM)
          value: $1.5B - $2.5B
          detail: >-
            Target addressable fee pool for automated multilateral compression, FX novations, and agency securities
            lending workflows.
        - label: Near-Term Expansion Horizon (Securities Finance)
