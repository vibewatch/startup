      - CV015
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Probability signal
      - Downside or upside trigger
    rows:
      - - Bull
        - eSecLending adds recurring revenue; integration retains asset owners; bank demand diversifies
        - Above the $1.9B mark is supportable only after audited growth and cash conversion are demonstrated
        - Not quantifiable from public data; look for audited acceleration and broad customer retention
        - 'Upside: verified target economics and sustained positive cash flow'
      - - Base
        - Platform broadens, but disclosure and integration evidence arrive gradually
        - Use the $1.9B round as a reference mark, not intrinsic value; demand a disclosure or price concession
        - Most consistent with the verified financing and unresolved financial gaps
        - Re-rate only after audited revenue, margin, retention, and covenant evidence
      - - Bear
        - Integration slips, leverage tightens, or strategic-bank demand weakens
        - Value should fall materially below the last-round mark; no precise floor is supportable
        - Watch covenant headroom, customer-investor churn, and missed integration milestones
        - 'Thesis break: covenant pressure, strategic-bank churn, or no auditable economics'
    notes: >-
      Scenarios are conditional and qualitative because public sources do not provide company-wide revenue,
      profitability, cash flow, debt terms, or preference-stack data; no probability percentage or precise valuation
      range is inferred.
    claimRefs:
