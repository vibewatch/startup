chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Core Mission, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Capitolis Inc. is an enterprise capital-markets technology platform founded in 2017 and headquartered in
              New York City, maintaining secondary engineering and operational centers in London and Tel Aviv. The
              institution operates as specialized market infrastructure designed to eliminate systemic capital
              bottlenecks across global banking networks. Through its proprietary computational architecture, Capitolis
              provides two interconnected operational solutions: Portfolio Optimization and Capital Marketplace. The
              Portfolio Optimization engine multilateralizes derivative contract unwinds, compression, and SA-CCR
              capital requirement reductions across foreign exchange and rates desks without altering underlying
              economic exposures. Concurrently, Capital Marketplace connects tier-one originating banks constrained by
              regulatory balance-sheet limits with institutional asset allocators seeking asset yield. The company
              currently counts more than 100 of the world's most prominent financial institutions as active network
              participants, establishing deep operational embeddedness across global tier-one broker-dealers.
            claimRefs:
              - CO001
              - CO006
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO006
