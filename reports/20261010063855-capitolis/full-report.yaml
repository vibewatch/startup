              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP010
              - CP011
      - number: '3.2'
        title: Platform Capabilities and Technical Differentiation
        blocks:
          - type: paragraph
            body: >-
              Capitolis differentiates across derivatives optimization and securities lending through specialized
              execution architecture. In foreign exchange, Capitolis provides an automated multilateral novation
              platform connecting prime brokers, executing dealers, and buy-side managers to execute options novations
              and desk transfers. This contrasts with traditional manual workflows that rely on bilateral emails, legal
              confirmations, and spreadsheet reconciliation. For portfolio optimization, Capitolis executes multilateral
              compression runs that reduce gross notional and counterparty credit exposures in advance, providing
              essential risk mitigation for currencies and scenarios not covered by Continuous Linked Settlement
              payment-versus-payment windows. With the acquisition of eSecLending, Capitolis expands its footprint into
              agency securities lending, providing beneficial owners with segregated, auction-driven lending programs as
              an alternative to commingled custodian pools.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP007
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP010
      - number: '3.3'
        title: Commercial Packaging and Fee Structures
        blocks:
          - type: paragraph
            body: >-
              Commercial structures across post-trade financial infrastructure remain private and relationship-driven,
              with no public rate cards or standard SaaS tiering. Capitolis monetizes its Portfolio Optimization suite
              via subscription commitments combined with variable fees calculated on processed volume or quantified
              capital relief, such as reductions in SA-CCR effective notional. Its FX novations platform assesses
              processing fees per completed novation ticket or gross notional transferred. In securities lending,
              eSecLending operates on a performance-based fee-split model, retaining a negotiated percentage of the
              gross lending spread generated through auction execution. While this structure aligns vendor revenue with
              client yield, institutional buyers face significant switching costs due to multi-system integration, legal
              documentation, and counterparty credit onboarding.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP014
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Adverse Risks
        blocks:
          - type: paragraph
            body: >-
              Capitolis defends its market position through a dual-layered moat combining proprietary multilateral
              network effects with strategic equity alignment from tier-1 dealer banks. Eight major global
              banks—including Citi, Bank of America, Barclays, BNP Paribas, J.P. Morgan, Nomura, State Street, and
              UBS—participate as both active platform counterparties and strategic shareholders. Furthermore,
              partnership with Tradeweb Markets accelerates distribution into electronic fixed income and repo channels.
              However, significant adverse risks persist around post-merger execution. Integrating eSecLending requires
              maintaining data integrity, strict counterparty confidentiality, and operational resilience across
              continuously shifting collateral obligations. Asset owners demand independent governance to ensure their
              lending strategies are not subordinated to dealer bank shareholder interests, while European operations
              remain outside the acquisition perimeter.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP007
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Post-Merger Integration and Client Conflict Risks
            body: >-
              The acquisition of eSecLending adds operational complexity across collateral management, legal agreements,
              and real-time trade recalls. Because eSecLending's beneficial owner clients value agent independence and
              strict data barriers, Capitolis must ensure that platform integration does not create perceived conflicts
              of interest with its dealer bank shareholders or introduce execution vulnerabilities.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP010
          - type: callout
            title: Strategic Moat via Bank Consortium Alignment
            body: >-
              Capitolis' shareholder roster includes premier dealer institutions such as Citi, Bank of America,
              Barclays, BNP Paribas, J.P. Morgan, Nomura, State Street, and UBS. By aligning equity ownership with
              platform network participation, Capitolis creates high structural switching barriers and defense against
              incumbent exchange utilities.
            calloutType: strength
            claimRefs:
              - CP009
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Mechanics, and Commercial Monetization
        blocks:
          - type: paragraph
            body: >-
              Capitolis generates revenue by addressing structural balance sheet, capital adequacy, and liquidity
              constraints across global financial institutions through two primary business engines: Portfolio
              Optimization and Capital Marketplace. The Portfolio Optimization engine automates multi-lateral trade
              compression, FX options novation, unwinds, and Standardized Approach for Counterparty Credit Risk (SA-CCR)
              exposure reductions. In this segment, the platform functions under a financial resource optimization
              software model, monetizing either via contracted platform SaaS subscription tiers or volume-linked
              transaction fees calculated on compressed notional exposure and optimized trade volume. The Capital
              Marketplace connects capital-constrained global tier-one banks with alternative capital providers and
              institutional investors, earning structured arrangement and agency execution spread fees on capital
              deployed against high-grade credit and equity assets. Commercial pricing terms remain bespoke and
              confidential, customized according to client trading book complexity, counterparty density, and bilateral
              netting efficiency rather than published rate cards.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI004
              - CI007
      - number: '4.2'
        title: Cost Structure Dynamics and Service Delivery Economics
        blocks:
          - type: paragraph
            body: >-
              The cost structure of Capitolis reflects a hybrid architecture combining cloud-native financial algorithm
              execution with intensive institutional relationship management. Cost of goods sold (COGS) comprises secure
              cloud computing infrastructure (AWS/Azure) required to execute complex mathematical optimization runs
              across millions of cleared and uncleared derivative contracts, regulatory data feeds, and specialized
              post-trade operations. Operating expenditures are dominated by elite quantitative engineering talent
              across New York, Tel Aviv, and London, complemented by senior capital markets sales professionals required
              to navigate multi-month bank risk and procurement cycles. While gross margins for its software workflows
              likely exceed traditional software-as-a-service baselines (estimated at 70% to 80%), overall contribution
              margins are diluted by high customer acquisition costs (CAC) driven by lengthy institutional
              proof-of-concept stages and regulatory audits. Furthermore, the all-cash acquisition of eSecLending
              introduces operational servicing costs associated with agency securities lending administration, custodian
              connectivity, and collateral monitoring.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI011
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI007
              - CI011
              - CI012
      - number: '4.3'
        title: Capital Adequacy, Cash Burn, and Debt Financing Dependencies
        blocks:
          - type: paragraph
            body: >-
              Capitolis reached a $1.9 billion post-money valuation following its October 2026 financing round of $220
              million, comprising $120 million in Series E equity led by Citi and $100 million in debt facilities
              provided by First Citizens Innovation Banking, Hercules Capital, and Pinegrove Venture Partners. Total
              equity capital raised to date surpasses $450 million (with third-party trackers recording total aggregate
              funding between $456 million and $473.7 million). The deliberate addition of $100 million in venture debt
              represents a pivotal shift in corporate financing strategy. Founder and CEO Gil Mandelzis explicitly
              stated that debt was chosen over equity due to its lower cost of capital, asserting that the combined
              business will soon start generating significant positive cash flow and tens of millions of dollars in
              revenue from eSecLending in the coming year. However, deploying $200 million in cash for eSecLending
              alongside debt service obligations creates material liquidity and debt covenant dependencies that require
              rapid execution and synergy realization.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Financial Verdict, Reporting Gaps, and Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              From an institutional underwriting perspective, Capitolis exhibits extraordinary shareholder quality,
              boasting direct strategic equity participation from ten of the world's most prominent financial
              institutions, including Citi, J.P. Morgan, Bank of America, Barclays, BNP Paribas, Nomura, State Street,
              UBS, and Tradeweb. Secondary private share structures reflect a $5.46 Series E common/voting share price
              with standard 1.0x non-participating liquidation preferences. Nevertheless, Capitolis maintains complete
              confidentiality over its core audited financial metrics: net revenue, gross margin, operating EBITDA, net
              revenue retention (NRR), customer lifetime value (LTV), and cash burn rate remain entirely undisclosed to
              the public. The primary diligence blockers center on verifying the organic trajectory of its legacy
              optimization software relative to the acquired revenue base of eSecLending, and confirming that cash
              generation from operations can adequately amortize $100 million in senior debt without necessitating
              future dilutive equity recapitalizations.
            claimRefs:
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Debt Amortization Pressure Post eSecLending Acquisition
            body: >-
              Capitolis took on $100 million in debt financing alongside $120 million in Series E equity to fund its
              $200 million all-cash acquisition of eSecLending. While CEO Gil Mandelzis noted that debt avoids equity
              dilution and cited anticipated near-term positive cash flow, servicing a nine-figure debt load introduces
              strict debt covenant scrutiny, fixed interest service overhead, and elevated refinancing risk if
              integration stalls.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI013
          - type: callout
            title: Strategic Equity Alignment as Commercial Distribution Engine
            body: >-
              Capitolis has engineered unprecedented capitalization alignment by converting its primary customer base
              into strategic shareholders. With Citi, J.P. Morgan, Bank of America, Barclays, BNP Paribas, Nomura, State
              Street, and UBS participating in its equity syndicate, the company effectively locks in the tier-one
              dealers whose multi-lateral participation is required to generate network effects in trade compression.
            calloutType: insight
            claimRefs:
              - CI009
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and User Jobs
        blocks:
          - type: paragraph
            body: >-
              The public product surface is organized around institutional funding, capital, and balance-sheet workflows
              rather than a conventional self-serve software suite. Independent reporting and the syndicated company
              release identify Capital Marketplace and Portfolio Optimization as the existing businesses, while
              Capitolis's own archive describes FX novations and settlement optimization as operational services for
              banks, executing firms, prime brokers, hedge funds, and real-money managers. In workflow terms, the
              product coordinates multiple institutions to remove unnecessary positions, reduce settlement exposure, or
              transfer FX option obligations. This evidence supports a networked operating model, but it does not
              establish the underlying code architecture, deployment topology, pricing, or contractual service levels.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE009
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE008
              - CE009
              - CE010
      - number: '5.2'
        title: Workflow Automation and Maturity Signals
        blocks:
          - type: paragraph
            body: >-
              The strongest maturity signals are production-use claims in Capitolis's own archive. The company says its
              novations platform automates a previously manual process, that participant response times had fallen by
              more than half, and that agency novation can preserve anonymity. The same archive reports more than 81,000
              novated trades and more than $9 trillion of reduced notional at the time of the underlying 2023 release. A
              separate company post describes a nine-bank proof of concept connecting Capitolis optimization with LCH FX
              Smart Clearing and reports a 42% network yield of total funding costs. These are useful scale and workflow
              indicators, but they remain company-issued and are not current service-level or reliability statistics.
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE009
              - CE011
      - number: '5.3'
        title: Public Operating Architecture and Dependencies
        blocks:
          - type: paragraph
            body: >-
              Available evidence supports an operating architecture, not a verified software-stack diagram. The workflow
              begins with participating institutions and their portfolios, applies novation or optimization logic,
              coordinates outcomes across a network, and can connect optimized trades to cleared or uncleared markets
              through LCH. A company-authored job description reposted on Canapi's board also indicates that Capitolis
              relies on third-party capital-markets software and seeks integrations between those tools and an in-house
              platform, with APIs, data models, and straight-through processing named as relevant skills. That
              recruiting evidence is directional rather than proof of deployed components, vendor names, data protocols,
              or production controls, so the architecture exhibit deliberately avoids inventing those details.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE013
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
