      - - Equity Sponsor & Flow Concentration
        - Top Global Tier-1 Banks (Citi, J.P. Morgan, BofA, etc.)
        - Strategic shareholders, primary customers, and liquidity providers
        - High (8 Tier-1 banks dominate platform volume)
        - Consortium defection or internalization of optimization algorithms
        - High
        - Multi-dealer equity consortium aligns competing bank interests
        - Medium
      - - Acquisition Debt Facilities
        - First Citizens Innovation Banking, Hercules, Pinegrove
        - Senior and venture debt lenders ($100M total debt)
        - Moderate (3 specialized growth lenders)
        - Covenant breach or acceleration upon marketplace volume slump
        - High
        - Staged equity co-investment and anticipated near-term positive cash flows
        - Medium
      - - Secured Financing Network
        - 20 Gates Management Platform Network
        - U.S. secured financing client relationships and bank network
        - Moderate (established North American institutional base)
        - Client attrition during integration into Capital Marketplace
        - Medium
        - Transferred veteran management and 15-year operational track record
        - Low
      - - Derivatives Settlement Infrastructure
        - Clearinghouses & Custodians (DTCC, LCH, CLS)
        - Trade capture, netting confirmation, and margin settlement
        - High (market utility dependence)
        - Operational desynchronization during peak volatility events
        - Medium
        - API standardization and multi-asset novation protocols
        - Low
    notes: >-
      Evaluates systemic counterparty and partner concentration across equity shareholders, credit lenders, and market
      infrastructure.
