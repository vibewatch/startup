              - CO012
      - number: '1.2'
        title: Founding Pedigree, Executive Leadership, and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              Capitolis was established in 2017 by seasoned capital-markets executives Gil Mandelzis, Tom Glocer, and
              Igor Teleshevsky. Chief Executive Officer Gil Mandelzis previously served as CEO of EBS BrokerTec within
              ICAP and founded Traiana, a leading post-trade and risk-mitigation platform acquired by ICAP, creating an
              exceptional pedigree in building mission-critical interbank workflows. Executive Chairman Tom Glocer
              brings governance authority as the former CEO of Thomson Reuters, while Co-Founder Igor Teleshevsky led
              engineering architecture from inception. The operational management team has been augmented with senior
              tier-one banking talent, including President Okan Pekin, Chief Technology Officer Murugan Manickam, Head
              of Financial Resource Management Jon Gizzie, and Chief Financial Officer Ashwath Bhat. The executive
              apparatus reflects deep domain specialization in financial resource optimization, balance-sheet
              engineering, regulatory stress testing, and electronic transaction infrastructure.
            claimRefs:
              - CO002
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO006
              - CO009
      - number: '1.3'
        title: Capitalization History, Strategic Syndicate, and Balance Sheet Structure
        blocks:
          - type: paragraph
            body: >-
              Capitolis has executed a highly strategic institutional capitalization program, accumulating more than
              $456 million in disclosed equity capital alongside structured credit. In October 2026, the company
              completed a $220 million capital package consisting of a $120 million Series E equity round at a $1.9
              billion post-money valuation and a $100 million debt financing facility. Existing lead investor Citi
              anchored the equity tranche, joined by new strategic investors Bank of America, Nomura, and Tradeweb
              Markets, alongside longstanding consortium partners Barclays, BNP Paribas, J.P. Morgan, State Street, and
              UBS. Debt financing was structured through First Citizens Innovation Banking, Hercules Capital, and
              Pinegrove Venture Partners. CEO Gil Mandelzis explicitly defended the hybrid equity-debt architecture,
              indicating that debt offered a lower cost of capital ahead of near-term positive operating cash
              generation, with capital directed to fund major inorganic expansion.
