        - label: Combined Capitolis-eSecLending
          x: 4.8
          'y': 4.8
          detail: >-
            Integrated entity combining automated multilateral resource optimization with institutional securities
            finance.
        - label: Custodian Banks (State Street / BNY)
          x: 2.5
          'y': 4.8
          detail: Massive institutional asset base but reliant on traditional pooled lending and bilateral custody workflows.
        - label: Exchange Utilities (Quantile / TriOptima)
          x: 4.2
