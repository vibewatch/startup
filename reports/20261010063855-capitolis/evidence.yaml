evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited GAAP income statements, annual recurring revenue (ARR), net revenue retention, and gross margins.
    whyItMatters: >-
      Without audited financial statements or GAAP revenue disclosure, unit economics, gross burn rate, and valuation
      multiples cannot be independently verified.
    diligencePath: >-
      Request confidential historical financial statements, ARR bridge, and auditor reports under an institutional
      non-disclosure agreement.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: Comprehensive organizational chart, unvested equity holdings, and executive employment agreements.
    whyItMatters: >-
      Partial coverage of the executive team leaves key-person dependency, equity vesting schedules, and retention terms
      unverified.
    diligencePath: >-
      Review management compensation committee documents, cap table details, and executive employment contracts during
      formal diligence.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Complete cap table detailing share classes, liquidation preferences, voting control agreements, and debt
      covenants.
    whyItMatters: >-
      Disclosed investors do not reveal precise equity ownership percentages, debt amortization covenants, or
      preferential distribution waterfalls.
    diligencePath: Obtain fully diluted capitalization table and credit agreement credit facility agreements from lead legal counsel.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: bank-internal-spend
    missingEvidence: >-
      Disclosed bank-by-bank software and consulting expenditures dedicated specifically to post-trade capital and
      liquidity optimization.
    whyItMatters: >-
      Without segmented public bank spending disclosures, bottom-up software TAM sizing must rely on vendor
      triangulation and high-level enterprise IT benchmarks.
    diligencePath: >-
      Review future procurement vendor RFPs, specialist benchmarking surveys (e.g. Expand/BCG), and investor disclosures
      from peer market infrastructure operators.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Publicly disclosed fee schedules, basis-point fee splits, and minimum commitment schedules for post-trade
      compression and securities lending agent services.
    whyItMatters: >-
      Institutional capital markets optimization services operate under privately negotiated commercial agreements,
      preventing independent verification of unit margin realization and customer price dispersion.
    diligencePath: >-
      Review bilateral customer master service agreements, rate cards, and auction fee-split contracts during
      institutional diligence.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited financial statements detailing annual net GAAP revenue, gross margin, operating EBITDA, and net income.
    whyItMatters: Essential for independently underwriting valuation multiples and assessing operational profitability.
    diligencePath: Request audited financial statements and quarterly board packs under standard institutional NDA.
    relatedQuestionRefs:
      - QI002
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: debt-covenants
    missingEvidence: Terms, coupon rates, amortization schedules, and financial covenants for the $100 million venture debt facility.
    whyItMatters: Directly determines ongoing debt servicing liquidity drain and downside default risk.
    diligencePath: >-
      Review credit agreements executed with First Citizens Innovation Banking, Hercules Capital, and Pinegrove Venture
      Partners.
    relatedQuestionRefs:
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: minor
    topic: unit-economics-benchmarks
    missingEvidence: >-
      Net revenue retention (NRR), customer lifetime value (LTV), CAC payback periods, and revenue breakdown by client
      tier.
    whyItMatters: Evaluates organic software expansion efficiency versus reliance on M&A-driven inorganic growth.
    diligencePath: Obtain historical client retention cohorts and sales efficiency metrics during management diligence.
    relatedQuestionRefs:
      - QI002
      - QI004
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: reliability-and-support
    missingEvidence: >-
      Current uptime, latency, failure-rate, recovery-time, support-response, and production-capacity evidence is not
      available in the assigned pool.
    whyItMatters: >-
      Historical transaction volumes and proof-of-concept results do not establish present reliability for
      time-sensitive institutional workflows.
    diligencePath: >-
      Request current service-level agreements, status history, incident postmortems, capacity tests, and customer
      support performance for each production module.
    relatedQuestionRefs:
      - QE005
  - type: private-evidence-only
    severity: blocking
    topic: trust-controls
    missingEvidence: >-
      Current security certifications, audit scope, privacy controls, model governance, incident response, business
      continuity, and disaster-recovery testing are not evidenced.
    whyItMatters: >-
      The platform coordinates sensitive institutional portfolios and multi-party workflows, so control failure could
      create operational, confidentiality, and regulatory exposure.
    diligencePath: >-
      Obtain current SOC reports or equivalent audits, penetration-test summaries, data-flow and access-control
      diagrams, incident logs, model validation, and business-continuity test results.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: developer-signal-gap
    missingEvidence: >-
      No repository, package registry, technical documentation, practitioner-community discussion, or quantitative
      developer activity metric appears in the assigned pool.
    whyItMatters: >-
      Job reposts indicate integration needs but cannot demonstrate engineering velocity, software quality, API
      adoption, or ecosystem depth.
    diligencePath: >-
      Request API and integration documentation and seek named implementation engineers or customers who can discuss
      onboarding, releases, and operational tooling.
    relatedQuestionRefs:
      - QE010
  - type: private-evidence-only
    severity: material
    topic: integration-gap
    missingEvidence: >-
      The proposed eSecLending integration plan, system boundaries, migration milestones, service dependencies, and
      ownership of the excluded European entity are not disclosed.
    whyItMatters: >-
      The acquisition thesis depends on combining an asset-owner network with Capitolis workflows without disrupting
      regulated or operationally sensitive services.
    diligencePath: >-
      Review closing conditions, transition-service agreements, architecture and data-migration plans, integration
      milestones, control ownership, and customer-consent requirements.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: >-
      Audited Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and logo churn figures across Capitolis' bank
      and asset manager cohorts.
    whyItMatters: >-
      Without cohort retention data, long-term customer lifetime value and product stickiness cannot be independently
      evaluated.
    diligencePath: >-
      Request historical SaaS renewal schedules, net retention summaries by tier-1 bank client, and multi-year contract
      churn history during confirmatory diligence.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Comprehensive non-investor client roster and individual volume contribution data across Capitolis' trading
      network.
    whyItMatters: >-
      Most public customer references are also strategic equity investors, obscuring the platform's adoption depth among
      independent commercial clients.
    diligencePath: >-
      Obtain an anonymized client billing schedule showing volume and ARR distribution across investor vs non-investor
      institutions.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-disclosures-and-capital-adequacy
    missingEvidence: >-
      Audited capital adequacy ratios and detailed balance-sheet disclosures for Capitolis Liquid Global Markets LLC
      under SBSD requirements.
    whyItMatters: >-
      Determines whether regulatory capital reserves are adequate to absorb counterparty defaults during stressed market
      volatility.
    diligencePath: >-
