  - type: conflicting-data
    severity: minor
    topic: operational-headcount-discrepancy
    missingEvidence: Precise employee census distinguishing core engineering from operations and eSecLending acquired personnel.
    whyItMatters: Clarifies actual operational capacity and key-person retention following multiple corporate acquisitions.
    diligencePath: Review post-merger organizational charts and payroll summaries during confirmatory diligence.
  - type: private-evidence-only
    severity: material
    topic: debt-covenant-terms
