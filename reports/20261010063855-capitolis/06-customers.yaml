figures:
  - id: FU001
    title: 'Customer Journey Map: Institutional Onboarding to Multilateral Optimization'
    type: journey-map
    summary: End-to-end customer lifecycle for global financial institutions, progressing from bilateral pain assessment to multilateral algorithmic execution and multi-asset expansion.
    data:
      items:
        - label: 1. Capital Constraint Identification
          description: Bank trading desks identify balance sheet constraints, SA-CCR exposure, or initial margin drag.
          touchpoints:
            - Risk and regulatory capital assessment
            - Portfolio diagnostic with Capitolis analytics
        - label: 2. Bilateral Workflow Integration
          description: Institutional clients establish connectivity to Capitolis workflow engines via API or STP links.
          touchpoints:
            - Straight-through processing (STP) configuration
            - Novation and messaging protocol alignment
        - label: 3. Collaborative Cycle Planning
          description: Capitolis coordinates multi-entity optimization runs with participating dealer and buyside counterparties.
          touchpoints:
            - Execution scheduling and parameter setup
            - Bilateral trade eligibility validation
        - label: 4. Algorithmic Multilateral Execution
          description: Proprietary algorithms compute optimal trade compression and novation sets across the network.
          touchpoints:
            - Multilateral netting and compression runs
            - Automated post-trade novation processing
        - label: 5. Capital Relief & Resource Unlocking
          description: Participants realize gross notional reduction, regulatory capital relief, and improved ROE.
          touchpoints:
            - RWA and leverage ratio optimization
            - Initial margin reduction verification
        - label: 6. Platform Expansion & Market Adjacencies
          description: Clients expand into securities lending (eSecLending) and Capital Marketplace balance-sheet financing.
          touchpoints:
            - Cross-asset financing and securities lending
            - Institutional asset owner network integration
    approximationNotes: Workflow phases synthesize documented product capabilities, client award citations, and institutional onboarding sequences; exact execution timing varies by counterparty infrastructure.
    claimRefs:
      - CU009
      - CU010
      - CU012
callouts:
  - calloutType: insight
    title: Strategic Shareholder Network as Dual Customer Moat and Governance Challenge
    body: Capitolis' core customer base includes many of the world's most influential investment banks—including Citi, Bank of America, J.P. Morgan, Barclays, and UBS—who also participate as strategic equity investors. While this alignment ensures deep co-development and committed transaction flow, it also creates significant customer concentration and governance sensitivity, where commercial expansion depends on balancing the competing priorities of major dealer counterparties.
    claimRefs:
      - CU005
      - CU007
