chapter:
  number: 6
  title: Customers
  summary: Capitolis delivers portfolio optimization and financial resource management software to a tier-1 customer base concentrated among global systemically important banks, prime brokers, and institutional asset managers. The company has converted core bank users into strategic equity investors, establishing high switching barriers and deep workflow integration while exposing operations to significant customer concentration and regulatory compliance overhead.
sections:
  - id: customer-segmentation-and-target-profiles
    title: Customer Base Segmentation and Value Proposition
    body: Capitolis segments its customer base primarily into global Tier-1 investment banks, regional commercial banks, institutional asset owners, and non-bank financial intermediaries. Tier-1 global institutions represent both the core revenue driver and the principal volume anchor for the platform, utilizing Capitolis to compress trading portfolios, manage standardized counterparty risk, and optimize regulatory capital consumption. With the announced acquisition of eSecLending in September 2026, Capitolis is actively expanding its customer reach to institutional asset owners—including public pension systems, insurance companies, and sovereign wealth funds—who participate in securities financing and lending programs. Buyer personas across these institutions typically center on heads of capital optimization, treasurers, and global heads of trading, who measure platform value by risk-weighted asset (RWA) reduction and balance sheet relief.
    claimRefs:
      - CU001
      - CU002
      - CU011
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-network-scale
    title: Adoption Trajectory and Financial Network Scale
    body: 'Adoption of Capitolis software is governed by multilateral network effects: the utility of compression and novation algorithms increases non-linearly with each participating bank desk and counterparty connection. Following the 2022 rollout of its multilateral SA-CCR optimization service, Capitolis secured adoption across 12 of the world''s largest investment banks and has cumulatively optimized trillions of dollars in gross notional trading exposure. Institutional adoption has deepened across foreign exchange, rates, and structured equity products, driven by the mandate to comply with uncleared margin rules and Basel III capital constraints without sacrificing market-making capacity. Growth has been reinforced by continuous product co-development with market participants, leading to industry recognition including Euromoney''s World''s Best FX Solution for Client Service in 2026.'
    claimRefs:
      - CU003
      - CU004
      - CU009
      - CU010
    tableRefs:
      - TU002
    figureRefs:
      - FU001
  - id: named-institutional-deployments
    title: Named Institutional Deployments and Commercial Proof
    body: Publicly confirmed production deployments demonstrate Capitolis' penetration of the global banking hierarchy. Key institutional participants include Citi, Bank of America, Nomura, Barclays, BNP Paribas, J.P. Morgan, State Street, and UBS. Uniquely in financial enterprise software, many of Capitolis' primary customer counterparties are also strategic equity shareholders who participated in the company's $120 million Series E round in October 2026, led by Citi. These institutions deploy Capitolis' novation engines, multilateral netting algorithms, and capital marketplace capabilities directly into their core trading workflows, validating enterprise readiness, regulatory auditability, and execution security at institutional scale.
    claimRefs:
      - CU005
      - CU006
      - CU012
    tableRefs:
      - TU003
  - id: retention-expansion-and-concentration-risks
    title: Durability, Expansion Mechanics, and Concentration Exposure
    body: 'While Capitolis benefits from exceptionally high gross retention due to the prohibitive operational costs of unwinding multi-bank optimization workflows, the company faces material structural vulnerabilities. Client concentration is acute: because global derivatives and repo markets are dominated by fewer than twenty global systemically important banks, revenue and volume are heavily dependent on a tightly knit consortium of counterparties. Furthermore, Capitolis'' operational model requires complex regulatory positioning, exemplified by the registration of an SEC security-based swap dealer (SBSD), Capitolis Liquid Global Markets, which introduces heightened compliance costs, reporting scrutiny, and supervisory capital obligations compared to pure-play software vendors. Although the eSecLending transaction adds tens of millions of dollars in near-term revenue and diversifies the network into asset owners, client concentration among top dealer desks remains a defining strategic vulnerability.'
    claimRefs:
      - CU007
      - CU008
      - CU013
      - CU014
