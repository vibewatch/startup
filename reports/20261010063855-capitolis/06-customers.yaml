  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: Audited Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and logo churn figures across Capitolis' bank and asset manager cohorts.
      whyItMatters: Without cohort retention data, long-term customer lifetime value and product stickiness cannot be independently evaluated.
      diligencePath: Request historical SaaS renewal schedules, net retention summaries by tier-1 bank client, and multi-year contract churn history during confirmatory diligence.
      relatedQuestionRefs:
        - QU007
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Comprehensive non-investor client roster and individual volume contribution data across Capitolis' trading network.
      whyItMatters: Most public customer references are also strategic equity investors, obscuring the platform's adoption depth among independent commercial clients.
      diligencePath: Obtain an anonymized client billing schedule showing volume and ARR distribution across investor vs non-investor institutions.
      relatedTableRefs:
        - TU003
