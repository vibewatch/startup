  topStrengths:
    - >-
      Real field proof across Community First!, Wolf Ranch, Fort Bliss, and NASA-linked programs reduces pure
      technology-risk concerns.
    - >-
      Differentiated construction stack spans robotics, software, materials, and design workflows rather than a single
      showcase printer.
    - >-
      Government work has become a meaningful second demand lane, with more than $360M of cumulative contract signal
      publicly cited.
    - Titan gives ICON a plausible path from ICON-led showcase projects toward external builder enablement.
    - >-
      ICC-ES wall-system evaluation and Army validation support the case that the core system can meet real-world
      construction requirements.
  topRisks:
    - >-
      The 2025 layoffs plus a smaller, valuation-undisclosed Series C look more like a commercialization reset than a
      fully de-risked scaling round.
    - >-
      Public evidence still lacks revenue, gross margin, cash runway, and final round terms, preventing clean
      underwriting.
    - No named external Titan customer or delivered builder-owned system is public ahead of planned 2027 deliveries.
    - >-
      Civilian scale-up still faces code, inspection, and approval bottlenecks while modular and off-site competitors
      attack similar use cases.
    - Market-rate Wolf Ranch pricing and limited affordability proof weaken the broad housing-crisis narrative.
  unresolvedGaps:
    - >-
      Final Series C terms, including post-money valuation, final close size, preferences, and ownership/control
      changes.
    - 2024-2026 revenue split across direct builds, government work, and builder-platform sales.
    - Gross margin, cash conversion, and runway by revenue stream.
    - Titan pipeline details, including reservations, conversion rate, ASP, service attach, and deployment calendar.
    - Customer count, retention, repeat-order cadence, and concentration outside flagship programs.
