- id: TV005
  title: Thesis-break and risk triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Down-round evidence
    - Final Series C or next financing is disclosed at a flat or lower valuation versus the 2022 anchor.
    - Confirms that the old ~$2B mark did not hold through the reset period.
    - Rebase underwriting to the bear range and revisit all private-mark assumptions.
  - - Additional restructuring
    - New material layoffs or project retrenchment after the 2025 reset.
    - Signals that the prior cost reset was insufficient and may imply weaker demand or liquidity than expected.
    - Increase risk weighting and demand runway evidence before proceeding.
  - - Titan conversion miss
    - Reservations do not convert into delivered builder systems on the promised timeline.
    - Undercuts the main argument for platform-like upside versus contractor-style valuation.
    - Remove bull-case weighting until conversion data improves.
  - - Government economics disappoint
    - Army or NASA programs fail to translate into healthy margin or reliable cash collection.
    - Weakens the claim that government work materially supports valuation downside protection.
    - Treat contract headlines as proof-of-concept only, not value support.
  - - Disclosure remains stalled
    - Management still withholds revenue, gross margin, cash runway, and cap-table terms in the next diligence cycle.
    - Keeps valuation anchored in story risk rather than operating evidence.
    - Maintain track / research-more stance rather than paying for upside optionality.
  notes: Each trigger is monitorable and tied directly to whether the current base case should hold.
  claimRefs:
  - CV006
  - CV008
  - CV031
  - CV032
  - CV036
  - CV038
  - CV043
  - CV044
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Diligence path
  rows:
  - - Final Series C terms
    - Post-money valuation, final close size, liquidation preferences, ownership change, and board rights.
    - Resolves whether 2025 was an up-round, bridge, flat round, or reset.
    - Obtain financing documents, cap table, and board materials.
  - - Revenue by stream
    - 2024-2026 revenue split across direct builds, government work, and builder-platform sales.
    - Required to decide whether ICON deserves contractor, industrial-tech, or software-adjacent framing.
    - Request monthly revenue bridge and backlog conversion file.
  - - Gross margin and cash conversion
    - Margin by stream, working-capital intensity, collections timing, and contribution margin for Titan deployments.
    - Determines whether strategic traction actually supports valuation rather than just headline relevance.
    - Review project-level P&Ls and contract billing schedules.
  - - Titan pipeline
    - Reservation count, conversion rate, system ASP, service attach, deployment timing, and churn/cancellation terms.
    - This is the main variable separating the bull case from the base and bear cases.
    - Request builder funnel, signed orders, and deployment calendar.
  - - Cash and runway
    - Current cash balance, monthly burn, base/downside runway, and covenant or facility constraints.
    - The financing question cannot be answered from round headlines alone.
    - Obtain cash bridge and board-approved operating plan.
  - - Contract economics
    - Wolf Ranch, Army, and NASA scope, revenue recognition, margin, and follow-on pipeline.
    - Converts large project headlines into real valuation evidence.
    - Request project economics summary and remaining performance obligations.
  notes: These diligence asks are intentionally concrete because the public record is insufficient for firm underwriting on its own.
