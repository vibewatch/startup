- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - June 2026 public value / status
  - Relevance to ICON
  - Limitation
  enumerationScope:
    coverage: partial
    basis: Covers the most decision-useful public comparables for ICON's 2026 valuation framing across homebuilders, specialty construction, and AEC software. It is not an exhaustive list of all listed construction or industrial-automation companies.
  rows:
  - - Lennar
    - About $22.28B market cap
    - Strategic homebuilder comp and direct partner/investor context through LENx and Wolf Ranch.
    - Mature public homebuilder economics and disclosure are far stronger than ICON's.
  - - NVR
    - About $16.68B market cap
    - High-quality public homebuilder anchor for what scaled residential execution looks like.
    - NVR is a pure public builder, not a venture-backed robotics platform story.
  - - TopBuild
    - About $11.30B market cap
    - Specialty building-products and installation comp for construction-adjacent execution value.
    - Less relevant to robotics/software optionality and more exposed to conventional installation economics.
  - - Installed Building Products
    - About $5.32B market cap
    - Lower-end specialty construction comp that helps bracket how large $2B would be in public-market context.
    - Still a mature listed operator with real disclosures and a different business model.
  - - Trimble
    - About $12.63B market cap
    - Useful construction-productivity and building-tech comp for software/tooling adjacency.
    - Much broader, more diversified, and financially transparent than ICON.
  - - Autodesk
    - About $48.55B market cap
    - AEC software leader showing the public market value available to scaled design/building-tech platforms.
    - The software mix and maturity are far cleaner than ICON's capital-intensive hybrid model.
  notes: These comparables are for scale and framing only. They should not be treated as direct private-market equivalence because ICON lacks public revenue, margin, and cash data.
