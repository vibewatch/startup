schemaVersion: report-v2
artifact: valuation
slug: icon
runDate: '2026-06-07'
company:
  name: ICON
chapter:
  number: 8
  title: Valuation
  summary: >-
    ICON's last public valuation anchor is still the roughly $2 billion mark tied to the February 2022
    $185 million extension of its 2021 Series B. The next public financing signal was much weaker:
    a $56 million February 2025 Series C first close, with up to $75 million planned, disclosed
    without a new valuation and arriving just after a 114-person layoff. Public comparables across
    homebuilders, specialty building-product companies, and construction software show that a $2 billion
    private valuation is not impossible in absolute dollars, but it would still equal a meaningful slice
    of mature public operators that publish revenue, margin, and earnings data that ICON does not.
    Government contracts, Wolf Ranch, and Lennar alignment preserve real strategic option value, yet no
    public source here discloses current revenue, gross margin, profitability, runway, or final 2025 round
    terms. The most defensible view is therefore price-sensitive and skeptical: treat the old ~$2 billion
    mark as stretched and uncertain rather than as a current fact, with a broad base-case underwriting
    range around $1.2 billion-$1.8 billion and only a bullish scenario supporting or exceeding the old mark.
sections:
- id: financing-context-and-why-the-old-2b-mark-is-no-longer-enough
  title: Financing context and why the old ~$2B mark is no longer enough
  body: |
    ICON's last public valuation anchor remains the February 2022 financing context, not a fresh 2025 or
    2026 price discovery event. The 2021 Series B was officially announced at $207 million, and later
    reporting described a February 2022 $185 million extension that pushed the company toward a valuation
    "approaching $2 billion" and about $451 million of cumulative equity. That matters because the next
    financing datapoint looked materially softer. In February 2025, ICON disclosed only a $56 million
    Series C first close, with up to $75 million planned, and declined to say whether the round was up,
    flat, or down. The company and its coverage framed the use of proceeds around Phoenix, multi-story
    construction, and getting the robotic platform into builders' hands rather than around clean financial
    scale or profitability. Coming immediately after a 114-person layoff, that combination reads as a real
    caution signal. It does not prove distress because reputable repeat investors still funded the company,
    but it does weaken any attempt to carry the 2022 near-$2 billion valuation forward uncritically into
    2026.
