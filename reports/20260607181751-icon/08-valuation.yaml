- id: traction-proof-bear-base-bull-framing-and-entry-discipline
  title: Traction proof, bear/base/bull framing, and entry discipline
  body: |
    The strongest argument against an outright bearish valuation reset is that ICON still has real strategic
    proof points. Wolf Ranch gives the company a flagship Lennar-linked deployment at 100 homes, and the
    public record also shows a $62.8 million Army production contract plus a $57.2 million NASA SBIR Phase
    III award running through 2028. Those datapoints support non-trivial strategic value and help explain
    why insiders continued to back the company in 2025. But they still fall short of proving durable
    economics. Wolf Ranch prices are end-homebuyer values, not ICON-recognized revenue; the printed shell
    is only part of the finished home; and government contract headlines do not reveal margin, cash
    conversion, or recurrence. That is why the scenario analysis should stay broad. A bear case of roughly
    $0.8 billion-$1.2 billion fits a bridge-like or down-round interpretation. A base case of roughly
    $1.2 billion-$1.8 billion fits continued strategic relevance without proof that the 2022 mark still
    holds. A bull case of roughly $1.8 billion-$2.4 billion requires Titan and Phoenix to convert from
    narrative to builder adoption without a fresh reset signal. Entry discipline should therefore sit below
    the old ~$2 billion anchor, not above it.
