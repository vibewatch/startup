- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Valuation range
  - Key assumptions
  - Main failure mode
  rows:
  - - Bear
    - 30%
    - $0.8B-$1.2B
    - 2025 round is effectively bridge/reset capital; no clean up-round emerges; Titan conversion is slow; financing dependence remains visible.
    - Public or private evidence reveals flat/down-round terms, weak adoption, or further restructuring.
  - - Base
    - 50%
    - $1.2B-$1.8B
    - Lennar and government proof points retain strategic value, but public financial disclosure remains thin and the old ~$2B mark is not fully sustained.
    - The company cannot show revenue quality, margin improvement, or strong builder conversion.
  - - Bull
    - 20%
    - $1.8B-$2.4B
    - Titan/Phoenix begin converting into real builder deployments, repeat sponsor support continues, and no new reset signal appears.
    - Platform commercialization slips, forcing another weakly signaled financing.
  - - Probability-weighted central estimate
    - 100%
    - approx. $1.4B-$1.7B
    - Weighted toward the base case because strategic proof remains real but public financial proof remains absent.
    - Overpaying near or above $2B before disclosure improves leaves limited margin of safety.
  notes: Ranges are broad analyst estimates intended to preserve uncertainty, not to imply a precise mark-to-model output.
