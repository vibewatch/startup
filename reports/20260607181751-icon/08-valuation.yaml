tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Decision implication
  rows:
  - - Recommendation
    - Track / research-more; do not underwrite as a clean buy at the old ~$2B mark.
    - Wait for fresh valuation discovery or materially better financial disclosure.
  - - Valuation stance
    - Stretched / uncertain at ~$2B; expensive above it.
    - The old 2022 anchor should be treated as historical context, not as a current fact.
  - - Confidence
    - Medium
    - Public evidence is directionally strong on round quality and strategic traction, but weak on financial proof.
  - - Risk rating
    - High
    - Layoffs, valuation opacity, and limited operating disclosure create meaningful downside to mark-to-model assumptions.
  - - Last hard public valuation context
    - February 2022 extension said to value ICON at "approaching $2B."
    - This is still the best public anchor, but it predates the 2025 reset.
  - - Best underwriting range
    - Rough base case of $1.2B-$1.8B.
    - Offers a more conservative starting point until revenue, margin, and round-term evidence improves.
  - - Upgrade trigger
    - Fresh financing at or above prior mark, plus credible Titan builder conversion and margin disclosure.
    - Would make a $2B+ valuation materially easier to defend.
  - - Primary downside trigger
    - Flat/down round disclosure, more layoffs, or failure to convert platform narrative into delivered systems.
    - Could shift the case toward the bear range below $1.2B.
  notes: The recommendation is explicitly price-sensitive and evidence-sensitive rather than a broad company-quality verdict.
