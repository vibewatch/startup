      - number: '2.5'
        title: Diligence gaps and underwriting implications
        blocks:
          - type: paragraph
            body: >-
              Two cautions should stay attached to ICON's market narrative. First, market need is real but adoption
              proof is still early. Harvard shows affordability stress remains severe even as rents softened, and the
              strongest non-ICON demand examples in the pack are pilots, university programs, and municipal
              collaborations rather than many independent builders placing repeat production orders. Second, the
              prepared official data sources are not yet sufficient for tight underwriting. The Census
              construction-spending and housing-start URLs in this pack are landing pages rather than directly cited
              tables, several HUD or archived pages did not yield usable text, and the prepared materials do not include
              a current military-construction budget document that would size defense demand with confidence. That means
              the cleanest current framing is: housing undersupply and labor/productivity issues explain why the problem
              matters, third-party 3D-printing market reports define only a narrow technology TAM, and investors still
              need direct diligence on code cycle, unit economics, installed base, repeatability, and budget authority
              before treating the market as fully proven.
            claimRefs:
              - CM006
              - CM020
              - CM021
              - CM039
              - CM040
              - CM041
              - CM042
