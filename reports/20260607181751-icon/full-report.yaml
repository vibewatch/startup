  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Hybrid revenue model, public pricing signals, and sales motion
        blocks:
          - type: paragraph
            body: >-
              ICON should be underwritten as a hybrid construction-technology company, not as a pure homebuilder and not
              as a software company with clean recurring metrics. Official company pages say ICON both designs and
              builds architecture and equips builders with technology to build better, faster, and at lower cost. The
              March 2026 Titan launch makes that hybrid model explicit: ICON is now selling an integrated program that
              includes robotics, software, materials, architecture, training, and ongoing service, supported by
              deposits, financing options, and early-2027 delivery timing. At the same time, the company still says it
              will directly design and build selected residential, hospitality, affordable-housing, and Department of
              Defense projects. Public price points exist, but they are mostly marketing or list signals rather than
              realized economics. Titan is marketed at roughly $20 per square foot for multi-story wall systems, while
              KVUE reported Phoenix pricing from 2024 at $25 per square foot for wall systems and $80 per square foot
              for foundation and roof. Wolf Ranch home sale prices show end-market demand, but those are homebuyer
              prices rather than ICON-recognized revenue.
