            title: Code cycle and substitute methods can slow commercial scale-up
            body: >-
              NIST and ICC activity shows progress, but the standards stack is still catching up. At the same time,
              modular and other automation-heavy approaches can solve similar builder pain without requiring
              printed-concrete permitting, which may limit how fast ICON converts broad need into spend.
            calloutType: risk
            claimRefs:
