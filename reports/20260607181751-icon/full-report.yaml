      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer map relevant to ICON is broader than a generic homebuilder list. The most visible demand in the
              supplied pack comes from affordable-housing sponsors, resilience-oriented pilot programs, universities,
              and local governments trying to solve a housing or disaster problem, not from homeowners directly shopping
              for a printer-built house. Virginia Tech's grant-backed 3D4VA project is explicitly framed around more
              affordable homes; Kentucky's Floodbuster 1 connects printed concrete to faster, cheaper,
              disaster-resilient housing; LSU frames the technology around affordable housing, hurricane recovery, and
              coastal protection; and Forbes reports 2026 city-level collaboration with local jurisdictions to deliver
              lower-cost housing supply. Those examples imply multiple payer archetypes: private builders using
              preconstruction and operations budgets, public bodies or housing authorities using grants or
              subsidy-backed procurement, and mission-driven coalitions financing pilots. The users include engineers,
              construction managers, materials teams, and inspectors who have to qualify mixes, structural performance,
              and code compliance before residents or agencies ever take occupancy.
