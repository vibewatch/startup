  - id: FV004
    title: Investment KPIs - IC scoring matrix
    type: kpi
    notes: IC-style scoring on a 1-5 scale (1 = weak, 5 = strong) based only on public evidence available at the run date.
    data:
      items:
        - label: Market opportunity
          score: 4
          detail: >-
            Housing undersupply and construction automation demand remain real, but they are sector tailwinds rather
            than valuation proof.
        - label: Proof of product-market fit
          score: 3
          detail: >-
            Wolf Ranch, Army, NASA, and Lennar show meaningful traction, but repeatable platform conversion is still
            unproven publicly.
        - label: Strategic moat
          score: 3
          detail: >-
            Builder relationships, materials/robotics IP, and government credibility matter, yet none is translated into
            disclosed financial moat metrics.
        - label: Unit economics
          score: 1
          detail: >-
            No public revenue, gross margin, profitability, or cash conversion data support a high-confidence valuation
            method.
        - label: Risk profile
          score: 2
          detail: Layoffs, capital intensity, and round-opacity make downside scenarios real.
        - label: Valuation support
          score: 2
          detail: The old ~$2B anchor is historical; current evidence better supports a discounted base range.
        - label: Evidence quality
          score: 1
          detail: Final round terms, runway, and operating metrics remain missing from the public record.
    claimRefs:
      - CV020
      - CV021
      - CV023
      - CV028
      - CV030
      - CV032
      - CV036
      - CV040
      - CV043
