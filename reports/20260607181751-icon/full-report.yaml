        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The best-supported verdict is that ICON may be building toward a more attractive platform model, but
              public evidence is still too sparse to say that the transition has produced durable, high-quality revenue.
              The positive side of the case is real: government contracts are with credible counterparties, Titan shows
              a clearer equipment-and-service commercialization path than earlier showcase projects alone, and repeat
              investors were willing to support the company after a difficult reset. The negative side is just as real.
              Revenue, gross margin, profitability, backlog, and customer counts remain private; the post-2025 valuation
              is undisclosed; and contract values such as Wolf Ranch home prices, the Army barracks award, and NASA's
              lunar work cannot be treated as recognized revenue without scope and margin detail. Investors should
              therefore underwrite ICON today as a capital-intensive industrial-tech business with mixed project,
              contract, and emerging platform economics rather than as a mature recurring-revenue company. The diligence
              focus should shift from headline project novelty to stream-by-stream revenue recognition, project margin,
              cash runway, round terms, and whether Titan reservations convert into real delivered systems on schedule.
