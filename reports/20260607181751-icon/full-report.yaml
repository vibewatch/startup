      - number: '7.3'
        title: Cost, affordability, and occupancy friction show why the value story is not fully proven
        blocks:
          - type: paragraph
            body: >-
              ICON’s marketing case is that robotic construction can cut labor, move faster, and lower cost. The
              available public evidence does not yet show that this has translated into broadly market-clearing
              affordable housing. Titan’s headline metric is around $20 per square foot for wall systems and up to 40%
              below conventional wall-system averages, but that is not the same as delivered-home economics. The
              clearest market-rate residential proof, Wolf Ranch, is priced around $450,000 to $600,000, and public
              sales signals still sit around one quarter of the 100 homes sold. New Atlas directly says widespread
              affordable U.S. housing has not yet emerged from 3D printing, while Mueller is a useful but small
              affordability proof point. There are also practical frictions that keep the chapter honest: Fast Company
              reports thick walls can weaken wireless signal, and Community First! coverage says human crews still
              complete roofs, doors, and other finish work after the shell is printed. The underwriting lesson is that
              shell efficiency has not yet proven whole-home affordability or frictionless occupancy.
            claimRefs:
              - CR008
