        title: 'Platform stack: proven Vulcan base, Titan commercialization, and Phoenix roadmap'
        blocks:
          - type: paragraph
            body: >-
              ICON's product is no longer best described as a single printer. The public surface now spans a
              design-build business, field-proven robotic construction systems, a materials stack, and a commercial
              package aimed at outside builders. The strongest proof remains on Vulcan. Partner and project sources tie
              Vulcan I to the first fully permitted U.S. 3D-printed home at SXSW 2018, while Community First!, House
              Zero, and Wolf Ranch all list Vulcan variants as the printer actually used in real projects. That makes
              Vulcan the mature fielded system in the reviewed pack. Titan is different: it is the first clearly
              packaged external-buyer offer. ICON markets Titan as a full technosystem that includes the printer, pump,
              BuildOS software, training, service, and warranty rather than a bare machine sale. Phoenix sits one step
              farther out. ICON presented it in 2024 as the bigger multi-story automation roadmap, but public evidence
              still centers on a demo structure and announced economics rather than completed customer deployments. The
              practical diligence read is therefore a staged stack: Vulcan proves execution, Titan monetizes that
              learning for builders, and Phoenix represents the more ambitious automation destination.
