      - number: '8.2'
        title: Public comparables, sector tailwinds, and the limits of relative framing
        blocks:
          - type: paragraph
            body: |
              Public comparables can only frame ICON's valuation directionally because the business is neither a pure
              homebuilder nor a clean public-software analogue. Still, they are useful guardrails. As of early June
              2026, Lennar's market cap was about $22.3 billion, NVR about $16.7 billion, TopBuild about $11.3
              billion, Installed Building Products about $5.3 billion, Trimble about $12.6 billion, and Autodesk
              about $48.6 billion. A hypothetical $2 billion ICON mark would therefore represent only a small share
              of large public leaders, but it would still amount to a non-trivial fraction of seasoned listed
              construction and AEC businesses with far better financial disclosure. The broader sector narrative is
              not fictional. McKinsey's modular-construction framing points to the long-running investor appeal of
              shifting construction from bespoke projects toward productized systems, Mordor projects rapid growth in
              the construction 3D-printing market through 2031, and Freddie Mac still estimates a U.S. housing supply
              shortfall in the millions of units. Those tailwinds help explain why ICON attracted premium capital.
              They do not, however, prove that ICON has achieved software-like margins, builder-platform repeatability,
              or a 2026 valuation that still merits the old near-$2 billion anchor.
