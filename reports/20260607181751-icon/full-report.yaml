      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest market drivers for ICON's category are structural, not cyclical. Housing undersupply and
              affordability pressure create a large problem budget, and BLS plus McKinsey show why automation is
              attractive: U.S. construction employment remains large but tight, job openings remain elevated, and
              McKinsey argues both that labor shortages matter and that long-run construction productivity has barely
              improved. NIST adds that additive construction can complement the workforce and remove formwork, while
              Mordor explicitly cites government funding for printed affordable housing and labor-cost reduction as
              forecast drivers. The adoption constraints are just as important. NIST says standards development has not
              kept pace, and Construction Dive reports that ICC is still formalizing wall standards while lagging code
              adoption has historically slowed commercial uptake. Even if those barriers ease, ICON still competes
              against substitutes such as modular or off-site construction, which McKinsey expects could account for 15
              to 20 percent of new building construction by 2030, and against other automation paths such as MIT's
              printed-plastic structural elements. In other words, ICON is chasing a productivity and delivery budget,
              not a protected 3D-printing budget.
            claimRefs:
