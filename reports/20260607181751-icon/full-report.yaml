      - number: '2.2'
        title: Evidence-constrained sizing rather than a single TAM claim
        blocks:
          - type: paragraph
            body: >-
              The chapter evidence supports multiple sizing lenses, not one clean TAM. On the broad-problem side,
              Freddie Mac still sees a 3.7 million unit housing shortage, NAHB estimates a 1.2 million unit metro
              vacancy-restoration gap, and NLIHC reports a 7.2 million unit shortage of affordable rental homes for
              extremely low-income renters. Those figures establish that the end-market pain is large. On the
              narrow-technology side, published 3D-construction market estimates are materially inconsistent. Mordor
              pegs the 2026 market at USD 3.34 billion with 35.6 percent CAGR through 2031, while Fortune Business
              Insights shows a USD 5.35 billion 2026 figure and a very aggressive 82.81 percent CAGR to 2034. That
              spread is too wide to underwrite as if it were a settled consensus. The more defensible view is to treat
              housing shortage and affordability data as the demand backdrop, treat third-party 3D-printing TAMs as a
              narrow adoption proxy, and acknowledge that a true ICON SAM or SOM still needs non-public evidence on
              installed base, pricing, backlog, and repeat deployments.
