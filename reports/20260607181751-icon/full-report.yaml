      - number: '3.5'
        title: Durability, switching costs, and underwriting implications
        blocks:
          - type: paragraph
            body: >-
              ICON’s moat is therefore only partly about owning a printer. Direct rivals differ materially by
              architecture, materials strategy, and operating model, which means the buyer’s switching costs sit in
              qualification work rather than in brand loyalty alone. A team that has already validated local concrete
              with a gantry system faces a different migration path than one trained around a mobile printer with
              proprietary blends, and both differ again from a factory-built wall or modular workflow. Pricing opacity
              makes the underwriting job harder: public sources reveal very little apples-to-apples price transparency,
              so comparison is mostly about contract model, included scope, and whether the buyer wants equipment,
              materials, services, or turnkey delivery. The strongest current pressure on ICON appears to be COBOD on
              direct deployment credibility and modular or factory-built substitutes on budget capture. The main
              diligence ask is current win-loss evidence, installed base, repeat builder customers, and realized unit
              economics against those weighted rivals.
