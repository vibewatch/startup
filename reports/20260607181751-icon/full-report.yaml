  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and which rivals matter now
        blocks:
          - type: paragraph
            body: >-
              ICON should not be benchmarked only against a handful of famous 3D-printed-house brands. The real decision
              set for a developer, builder, or public sponsor includes direct concrete-printing system vendors, adjacent
              envelope or automation players, and substitutes such as modular or manufactured housing that attack the
              same labor, schedule, and cost problem. Public market maps remain fragmented: analyst and trade-list
              sources still name many players rather than a single category winner. But the evidence quality is uneven.
              COBOD has the strongest direct-peer proof in this pack because it combines official installed-base claims
              with a recent multifamily social-housing reference. Harbinger and Clayton matter even though they are
              substitutes, because factory-based or manufactured delivery can capture the same affordability and
              throughput budget. That weighting matters more than counting logos, since some names remain easy to list
              but harder to validate as live scaled threats.
