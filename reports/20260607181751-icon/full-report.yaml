              The founder record is strongest around Jason Ballard, Alex Le Roux, and Evan Loomis. 3Dnatives and Forbes
              Home both name the trio as founders, while official ICON releases consistently present Ballard as
              co-founder and CEO. Le Roux is the clearest publicly named technical co-founder and CTO in the reviewed
              pack. Public leadership visibility expands in 2025-2026 with Will Hurd first appearing as a board member
              in TechCrunch’s February 2025 fundraising coverage and then as president of the new ICON Prime government
              division in April 2026. Governance visibility remains incomplete, however. ICON’s 2021 Series B
              announcement added Norwest’s Jeff Crowe to the board, but public sources still do not disclose a full
              current board roster, committee structure, or broader cap-table control rights. That keeps key-person
