        title: Funding history, stage, and unsupported core metrics
        blocks:
          - type: paragraph
            body: >-
              Public funding evidence shows a business that is still venture-backed and growth-stage rather than a
              mature self-funded industrial company. The cleanest anchor is the official August 2021 Series B
              announcement: $207 million led by Norwest, with total funding since launch reaching $266 million. Later
              TechCrunch reporting framed February 2022 as a $185 million Series B extension and said the valuation was
              approaching $2 billion, so round-accounting should be treated carefully. The February 2025 Series C first
              close added $56 million, with up to $75 million planned, and lifted total raised above $500 million, but
              ICON declined to disclose the new valuation. Public operating metrics are materially thinner than the
              financing history. There is no canonical public revenue figure, no supported current customer-account
              total, and no precise run-date headcount beyond layoff-era signals of less than 400 pre-cut employees and
              about 200 employees in February 2025.
