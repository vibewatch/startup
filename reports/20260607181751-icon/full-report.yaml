      - number: '3.3'
        title: Weakened or stale rivals should stay in the chapter, but not at full weight
        blocks:
          - type: paragraph
            body: >-
              The evidence around Mighty Buildings and Contour Crafting is exactly where this chapter should resist
              smoothing over ambiguity. Mighty still appears in market maps, but the current accessible company surface
              in this pack is centered on the Mighty Wall System, a factory-made wall product, not on a richly
              documented pipeline of new on-site printer deployments. That does not prove exit, but it does argue
              against treating Mighty as a clear frontline direct benchmark without additional diligence. Contour
              Crafting looks even staler from the current pack. The prepared homepage and newsroom URLs did not yield
              readable content on run date, so there is no fresh official proof here of active projects, customers, or
              current product posture. Both companies belong in the competitor chapter because investors will still hear
              the names, but they should be weighted as adverse evidence on category churn and proof gaps rather than as
