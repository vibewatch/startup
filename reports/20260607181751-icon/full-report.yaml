  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      How regulatory delay, weak affordability translation, and the commercialization reset can compound into financing
      pressure.
    data:
      nodes:
        - id: R1
          label: Code / inspection lag
          detail: Civilian approval and qualification take longer than printer marketing suggests.
          tone: risk
        - id: R2
          label: Qualification burden
          detail: Materials testing, documentation, and local engineering work expand the deployment cycle.
          tone: risk
        - id: R3
          label: Fewer scalable civilian deployments
          detail: Proof remains concentrated in a few flagships instead of broad repeat adoption.
          tone: risk
        - id: R4
          label: Affordability gap
          detail: Wall-cost claims do not translate cleanly into broadly affordable delivered homes.
          tone: risk
        - id: R5
          label: Slower builder orders
          detail: Outside builders delay purchase until economics and approvals are clearer.
          tone: risk
        - id: R6
          label: Layoffs / GTM reset
          detail: ICON restructures to prioritize Phoenix/Titan and external builders.
          tone: risk
        - id: R7
          label: Margin and runway pressure
          detail: Hardware, service, training, and direct-build obligations keep the cost base high.
          tone: risk
        - id: R8
          label: Need for new capital or weaker terms
          detail: Opaque valuation or further cuts become more likely if scale stays slow.
          tone: risk
        - id: R9
          label: Government validation
          detail: Army/NASA wins partially offset existential technology doubt.
          tone: positive
        - id: R10
          label: Modular substitute pressure
          detail: Developers can choose mature off-site methods with clearer predictability.
          tone: risk
      edges:
        - from: R1
          to: R2
          label: creates
        - from: R2
          to: R3
          label: slows
        - from: R4
          to: R5
          label: discourages
        - from: R3
          to: R5
          label: constrains
        - from: R5
          to: R7
          label: pressures
        - from: R6
          to: R7
          label: adds
        - from: R7
          to: R8
          label: raises
        - from: R10
          to: R5
          label: competes for
        - from: R9
          to: R8
          label: partially offsets
        - from: R9
          to: R3
          label: partially mitigates
    claimRefs:
      - CR021
      - CR022
      - CR028
      - CR031
      - CR033
      - CR040
      - CR044
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Critical external dependencies shaping whether ICON can convert its reference projects into repeatable builder
      adoption.
    data:
      nodes:
        - id: D1
          label: ICON commercialization
          detail: Phoenix / Titan / direct-build / government portfolio.
          tone: neutral
        - id: D2
          label: ICC / NIST standards
          detail: Framework for documented, testable code pathways.
          tone: neutral
        - id: D3
          label: Local AHJs / inspectors
          detail: Final local permit and sign-off gate for civilian deployments.
          tone: risk
        - id: D4
          label: External builders / developers
          detail: Needed to turn Titan into repeat private-market demand.
          tone: risk
        - id: D5
          label: Army / NASA / ICON Prime
          detail: Highest-credibility proof and possible backlog channel.
          tone: positive
        - id: D6
          label: Material / process qualification
          detail: Testing, documentation, and engineering proof around the integrated stack.
          tone: risk
        - id: D7
          label: Housing-finance ecosystem
          detail: Lenders, insurers, and buyer underwriting norms for printed homes.
          tone: risk
        - id: D8
          label: Modular / off-site substitutes
