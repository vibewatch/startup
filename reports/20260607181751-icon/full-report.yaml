  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Risk overview: the problem is commercialization friction, not lack of technical proof'
        blocks:
          - type: paragraph
            body: >-
              ICON now looks like a company with meaningful proof points but an unfinished route to mainstream scale.
              The strongest public evidence says the technology works well enough to win demanding reference projects:
              Army barracks cleared updated UFC standards, NASA continues to fund lunar construction work, Community
              First! has repeated supportive-housing deployment, and Wolf Ranch is a real 100-home neighborhood rather
              than a one-off demo. The risk is what comes next. Commercial 3D printing is still described as flat
              because the bottlenecks live in code approval, material qualification, inspection, and the translation
              from a printed shell to an occupied building. Those frictions slow civilian deployment, keep proof
              concentrated in a few flagships, and force ICON to finance an expensive pivot toward selling Titan and
              Phoenix to outside builders before public evidence of customer-owned deployments exists. That is why the
              highest-severity risks in this chapter are interactive: regulatory delay worsens adoption, adoption
              weakness strains financing, and financing pressure raises execution risk during the go-to-market reset.
            claimRefs:
              - CR006
              - CR021
