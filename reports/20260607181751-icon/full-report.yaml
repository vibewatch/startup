      - number: '4.2'
        title: Cost structure, margin path, and missing traction disclosures
        blocks:
          - type: paragraph
            body: >-
              The public record gives a plausible map of ICON's cost structure but not the numbers required to model it.
              The business appears to carry three expensive layers at once: robotics and materials R&D, manufacturing or
              systems build-out, and field delivery for direct projects and government work. That helps explain why
              public traction signals such as completed homes, barracks, and flagship communities cannot be converted
              into profitability claims. Official 2026 materials say ICON has completed more than 240 to 245 homes and
              structures and has partners positioned to build hundreds more, but there is still no disclosed revenue,
              ARR, customer count, backlog conversion, gross margin, CAC, payback, or cash conversion cycle. The layoffs
              sharpen the cost-base question. TechCrunch reported fewer than 400 employees before the January 2025
              reduction, while February 2025 coverage said the company had about 200 employees after the cut. That
              implies a substantial reset in labor expense and operating scope, but not necessarily a solved margin
              problem. Army and Texas military sources support the idea that robotic construction can reduce labor
              requirements and compress timelines, yet no source in this pack discloses whether those gains translate
              into attractive project margins for ICON itself.
