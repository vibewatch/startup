      - number: '8.4'
        title: Recommendation, diligence blockers, and exit readiness
        blocks:
          - type: paragraph
            body: |
              The valuation call should be skeptical but not dismissive. ICON still appears to have meaningful
              option value: strategic builder ties, government-backed programs, a credible industrialized-construction
              narrative, and repeat investor support. Even so, the company does not presently disclose the inputs
              needed to defend a firm 2026 price. No public source here provides current revenue, gross margin,
              profitability, backlog conversion, cash runway, or the final Series C valuation and terms. In that
              context, a traditional buy recommendation would amount to underwriting the story rather than the facts.
              The cleaner stance is track or research-more with medium confidence and high risk. Exit readiness also
              appears limited: a near-term IPO case is weak because public peers disclose far more operating detail,
              while a strategic transaction or another private round seems more plausible than a fully de-risked public
              listing. The main diligence work should focus on final Series C documents, stream-level revenue and
              gross margin, Titan reservations and conversion, cash runway, and contract economics for Wolf Ranch,
              Army, and NASA work. Those items are also the key thesis-break monitors.
