      - number: '6.3'
        title: 'Durability: repeat deployment exists, but formal retention disclosure is absent'
        blocks:
          - type: paragraph
            body: >-
              This chapter has enough evidence to show repeat use, but not enough to prove durable customer economics.
              The public record does not disclose customer count, NRR, GRR, churn, contract length, segment mix, or
              renewal history. That means the analyst must use weaker proxies. Community First! is a genuine
              repeat-deployment story because the same mission owner appears across multiple years and structures. Fort
              Bliss is another useful proxy because the Army moved from opening the first compliant barracks to awarding
              a larger follow-on production program. NASA also suggests relationship durability, but its value lies in
              sustained R&D sponsorship rather than a transparent recurring-revenue model. Wolf Ranch has a different
              limitation: there are consumer-adoption signals, including public pricing and reported sales, yet there is
              no public proof that the same residential developer stack has already replicated the neighborhood
              elsewhere. Titan is the biggest durability gap of all. The product clearly creates a prospective buyer
              class, but the reviewed pack does not name any customer, any delivered system, or any repeat-order
              evidence. Investors should therefore treat ICON’s current customer chapter as strong on reference-account
              proof and weak on retention accounting.
            claimRefs:
              - CU028
              - CU029
              - CU032
