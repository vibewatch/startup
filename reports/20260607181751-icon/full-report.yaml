chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and company formation
        blocks:
          - type: paragraph
            body: >-
              ICON presents itself as a builder of “architecture for humanity” and a technology provider for builders,
              not just a niche printer OEM. Its homepage says the company designs and builds architecture while
              equipping builders with technology to build better, faster, and at lower cost, and multiple independent
              sources place the business in Austin, Texas. The public founding story is consistent across TechCrunch and
              3Dnatives: ICON was founded in late 2017 and came to market during SXSW in March 2018 with the first
              permitted 3D-printed home in the United States. That launch matters because it frames the company’s
              identity as both a robotics platform and a housing-delivery operator from inception. Public materials do
              not provide a richer legal-entity or office-footprint disclosure than the Austin base and homepage footer
              naming ICON Technology, Inc.
