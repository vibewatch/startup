      - number: '3.4'
        title: Modular and manufactured substitutes can capture the same buyer budget
        blocks:
          - type: paragraph
            body: >-
              The substitute side may be at least as important as the direct-printer side. Harbinger, reached from the
              prepared Factory_OS URLs, frames its model around industrializing multifamily delivery inside a
              manufacturing facility and integrating development, design, manufacturing, and construction. That is a
              direct attack on the same predictability and labor problem ICON is trying to solve, but without requiring
              a buyer to adopt site-based concrete printing. McKinsey strengthens the substitute case by showing modular
              is already a broad global category with more than 700 companies across 50-plus countries, and Urban Land
              adds the practical buyer pitch: modular can save six to eight weeks on a two-year project while improving
              predictability and factory quality. Clayton broadens the threat further as a major manufactured or modular
              housing brand, even though the direct page in this pack is light on operating detail. The key implication
              is that ICON is competing for productivity budgets, not for an isolated “3D printing” line item.
