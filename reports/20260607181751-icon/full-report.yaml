      - number: '1.5'
        title: Adverse events, execution pressure, and the 2026 commercialization pivot
        blocks:
          - type: paragraph
            body: >-
              The clearest adverse signal in the reviewed pack is the January 2025 reduction in force. TechCrunch, KVUE,
              and Fabbaloo all report that 114 employees were cut, with company explanations centering on “realigning”
              the team around Phoenix and getting the technology into builders’ hands. That matters because it signals a
              strategic pivot away from labor-heavy self-execution toward a more platformized commercialization model.
              The March 2026 Titan launch formalized that pivot by offering builders an integrated system, training,
              financing support, and early-2027 delivery timing, while KVUE said Phoenix could cut printing costs
              materially. At the same time, official 2026 releases highlight more than $360 million of government
              contracts and 240-plus completed homes and infrastructure projects, suggesting ICON still has significant
              external validation. The underwriting problem is that public disclosures remain thin exactly where
              investors would want fresh clarity most: valuation, revenue, customer count, and precise current headcount
              after the layoffs.
