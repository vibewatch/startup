  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              ICON should not be analyzed as if it sells into all residential construction spend. The broad backdrop is
              a structurally undersupplied U.S. housing market, but ICON's economically relevant market is much
              narrower: automated additive-construction systems, materials, engineering support, and deployment
              workflows used on projects where schedule compression, labor scarcity, affordability, or resilience
              justify changing the build method. Freddie Mac, NAHB, and CRS all point to persistent supply constraint,
              which explains why faster construction methods matter, but those shortage figures are demand context
              rather than direct printer revenue. The included spend is therefore concentrated around robotic
              wall-printing or shell-delivery workflows, mix and materials qualification, structural and code
              validation, and the training or operating model needed to deliver repetitive low-rise projects. Excluded
              spend includes land, entitlement, mortgage finance, finishes, MEP systems, and the vast majority of
              ordinary site-built homebuilding. The main substitutes are not only traditional concrete or stick-built
              methods but also modular and off-site industrialization paths that attack the same cost, schedule, and
              labor problem without requiring printed concrete.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
