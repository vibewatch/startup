companyProfile:
  summary: >-
    ICON is an Austin-based private construction-technology company founded in late 2017 that built early proof through
    self-developed and partner-led 3D-printed housing projects, then expanded into government programs and a
    commercialization push that sells integrated robotic construction systems to outside builders. Its strongest public
    proof points are Community First!, Wolf Ranch, Fort Bliss, and NASA-linked work, while the current underwriting
    debate centers on whether Titan and Phoenix can convert those flagship deployments into a repeatable platform
    business.
  foundedDate: '2017-12-01'
  founders:
    - name: Jason Ballard
      role: Co-founder, CEO
      background: Public face of ICON across financing, product, and government announcements.
      claimRefs:
        - CO005
    - name: Alex Le Roux
      role: Co-founder, CTO
      background: Technical co-founder publicly identified with ICON's construction-printing technology stack.
      claimRefs:
        - CO006
    - name: Evan Loomis
      role: Co-founder
      background: >-
        Founding team member cited in overview coverage, though his current operating scope is lightly disclosed
        publicly.
      claimRefs:
        - CO004
  foundingLocation: Austin, TX, USA
  headquarters: Austin, TX, USA
  productSummary: >-
    ICON sells a construction platform spanning robotic printers, software, materials, and design/build workflows.
    Vulcan is the proven field system behind flagship housing and military deployments, Titan is the direct-to-builder
    integrated system entering commercial rollout, and Phoenix is the newer multi-story roadmap layered on top of
    selected direct projects and government work.
  customerFocus: >-
    Mission-driven housing operators, residential developers and homebuilders, defense and space-agency programs, and
    prospective third-party builders buying integrated construction systems.
  businessModel: >-
    Hybrid hardware-plus-services model that still includes selected direct projects and government contracts while
    pushing toward outside-builder commercialization of Titan and Phoenix with software, materials, training, and
    ongoing service attached.
  stage: Series C
  fundingStatus: >-
