            body: >-
              The prepared source pack shows the clearest current adoption signals in affordable-housing pilots,
              city-led collaborations, and resilience-oriented programs. Those segments appear more willing to sponsor
              experimentation than the average private builder, which matters for near-term SAM prioritization.
