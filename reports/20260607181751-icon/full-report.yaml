            title: Real market pain exists even before narrow 3D-printing TAM debates
            body: >-
              The strongest support for ICON's opportunity is not a headline TAM report but the alignment of large
              housing deficits, affordability pressure, and labor/productivity constraints. Those forces create a real
              problem budget for alternative construction methods even if the narrow printed-construction market is
              still small.
            calloutType: strength
            claimRefs:
