      - number: '7.2'
        title: Regulatory, code, and certification bottlenecks remain the central scaling risk
        blocks:
          - type: paragraph
            body: >-
              The most important non-company-specific risk is still the slow regulatory and inspection path for
              3D-printed construction. Construction Dive’s Buro Happold interview is explicit that the main culprit is
              the building code itself, not lack of printing capability. That fits the broader evidence set. ICC was
              still developing dedicated 3D concrete wall guidance in early 2025. NIST’s updated standard and 2025
              workshop report both emphasize that additive construction still needs disciplined documentation, materials
              testing, structural-integrity standards, safety protocols, and closer code alignment. Two academic risk
              papers then rank missing codes, approval delays, labor scarcity, and design-knowledge gaps among the most
              severe sector risks. ICON has a meaningful mitigation here—Army barracks and NASA work prove the company
              can clear serious institutional thresholds—but those are not a blanket substitute for civilian permits,
              lender comfort, local inspectors, or repetitive builder approvals. For ICON’s current deployment model,
              regulatory risk is therefore not abstract category noise; it is the gate between showcase proof and
              repeatable external-builder adoption.
            claimRefs:
              - CR014
