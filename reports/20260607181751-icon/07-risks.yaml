    - Commercial support burden could exceed current team capacity.
    - Request first-customer list, uptime/SLA commitments, and escalation metrics once systems ship.
  - - Occupancy frictions can surface after structural success
    - Fast Company reports wireless-signal issues in thick-wall homes, showing that small usability problems can appear even after structural goals are met.
    - Medium
    - Medium
