- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Why it matters
  - Action implication
  rows:
  - - Civilian code bottleneck
    - Permitted, inspected civilian Titan deployments
    - No new civilian code-ready external deployment by the time 2027 deliveries begin
    - Would indicate the platform is still trapped in flagship-mode rather than repeatable commercialization.
    - Treat as thesis-break or require a much lower valuation and milestone-based financing.
  - - Commercialization gap
    - Named external Titan customers
    - No named buyer, signed order, or delivered customer-owned system visible as deliveries approach
    - Suggests outside-builder demand is weaker than launch messaging implies.
    - Re-underwrite as a project business, not a scalable platform sale story.
  - - Economics gap
    - Delivered-home cost and buyer clearing price
    - Wall-cost claims fail to translate into clearly better all-in economics versus modular or conventional alternatives
    - Would undermine the affordability and margin thesis simultaneously.
    - Reduce conviction sharply unless ICON can show differentiated non-price value with repeat orders.
  - - Financing stress
    - Public staffing and financing signals
    - Another large layoff, emergency financing, or down-round-like opacity
    - Would show that the 2025 reset did not restore capital efficiency.
    - Pause investment or insist on runway and covenant transparency before proceeding.
  - - Adoption concentration
    - Share of visible wins coming from government or a handful of flagship partners
    - Government and flagship partner-led work continue to dominate while private builder adoption stays thin
    - Can create a misleading sense of scale and resilience.
    - Value the company on concentrated-channel durability, not on broad housing-platform assumptions.
  - - Occupancy and quality friction
    - Post-occupancy issues and finish-trade dependence
    - Usability issues or long finish cycles remain common even after printing succeeds
    - Indicates the printer is not yet the same as a smooth end-to-end product.
    - Require resident satisfaction, warranty, and cycle-time evidence before underwriting premium growth.
  notes: The triggers are intentionally monitorable so the risk chapter feeds directly into an invest / wait / walk decision.
