callouts:
- calloutType: risk
  title: Code lag is the clearest non-company-specific threat
  body: The best public evidence does not say 3D printing fails technically; it says code approval, inspection, and qualification still slow commercial adoption. That distinction matters because it makes execution timing—not only engineering—the key risk to underwriting.
  claimRefs:
  - CR014
  - CR015
  - CR018
  - CR020
- calloutType: risk
  title: Affordability still has not fully shown up in market outcomes
  body: Titan’s wall-cost claims are ambitious, but Wolf Ranch still clears at market-rate prices and public sell-through remains limited. Mueller is directionally helpful, yet too small to settle the broader housing-economics question.
  claimRefs:
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR041
- calloutType: risk
  title: The 2025 layoff looks like a commercialization reset, not a finished scaling story
  body: The company cut staff, emphasized Phoenix and external builders, and then still needed new capital for Phoenix with no disclosed valuation. That combination should be read as a higher execution bar for the next phase, not as evidence the model is already de-risked.
  claimRefs:
  - CR001
  - CR002
  - CR005
  - CR006
  - CR031
- calloutType: strength
  title: Army, NASA, and real housing projects keep the downside from being purely theoretical
  body: ICON has enough real deployment proof to avoid a “science project” verdict. The problem is converting that credibility into repeatable, civilian, outside-builder adoption at economics that look compelling against substitutes.
  claimRefs:
  - CR021
  - CR023
  - CR033
  - CR039
