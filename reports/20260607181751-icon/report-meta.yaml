summary:
  headline: ICON has real technical and deployment proof, but the public record is still too thin to justify paying anywhere near the old ~$2B mark with confidence after layoffs and a much smaller, valuation-undisclosed Series C.
  overallScore: 5.4
  recommendation: research-more
