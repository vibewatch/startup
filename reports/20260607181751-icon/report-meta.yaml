  foundingLocation: Austin, TX, USA
  headquarters: Austin, TX, USA
  productSummary: ICON sells a construction platform spanning robotic printers, software, materials, and design/build workflows. Vulcan is the proven field system behind flagship housing and military deployments, Titan is the direct-to-builder integrated system entering commercial rollout, and Phoenix is the newer multi-story roadmap layered on top of selected direct projects and government work.
  customerFocus: Mission-driven housing operators, residential developers and homebuilders, defense and space-agency programs, and prospective third-party builders buying integrated construction systems.
  businessModel: Hybrid hardware-plus-services model that still includes selected direct projects and government contracts while pushing toward outside-builder commercialization of Titan and Phoenix with software, materials, training, and ongoing service attached.
  stage: Series C
  fundingStatus: February 2025 Series C first close of $56M, with up to $75M planned and lifetime funding above $500M, but no new valuation disclosed after the previously reported near-$2B 2022 financing context.
