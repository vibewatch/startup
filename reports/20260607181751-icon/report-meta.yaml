companyProfile:
  summary: ICON is an Austin-based private construction-technology company founded in late 2017 that built early proof through self-developed and partner-led 3D-printed housing projects, then expanded into government programs and a commercialization push that sells integrated robotic construction systems to outside builders. Its strongest public proof points are Community First!, Wolf Ranch, Fort Bliss, and NASA-linked work, while the current underwriting debate centers on whether Titan and Phoenix can convert those flagship deployments into a repeatable platform business.
  foundedDate: '2017-12-01'
