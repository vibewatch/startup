coverageNotes: Public evidence as of 2026-06-07 supports ICON's real deployment history, government work, and the February 2025 $56M Series C first close, but private-company disclosure limits leave revenue, gross margin, customer count, cash runway, and final round terms undisclosed. The January 2025 layoff affected 114 employees, implying a workforce reduction of more than 25% before the qualifying Series C, and the last public valuation anchor of roughly $2B dates to the 2022 extension and may now be stale.
