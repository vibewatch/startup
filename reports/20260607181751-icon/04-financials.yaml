tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit / pricing basis
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Design-build residential and hospitality projects
    - ICON directly designs and builds selected homes or structures for customers and partners.
    - Project contract value; home or community scope
    - Active project surface remains visible, but project revenue is not publicly disclosed.
    - Medium — revenue can be meaningful but is likely lumpy and labor-intensive.
    - Request project-by-project revenue, gross margin, and repeat-customer mix.
  - - Builder technology system sales (Titan)
    - Integrated robotics, software, materials, architecture, training, and support sold to builders.
    - $5,000 reservation deposit plus undisclosed system ASP and support fees
    - Reservations open in 2026; training expected Q3 2026; first deliveries targeted for early 2027.
    - Medium to high if support and software attach, but conversion is unproven publicly.
    - Request signed reservations, conversion funnel, realized ASP, and support attach rates.
  - - Government barracks construction
    - Contracted construction revenue recognized against defense milestones or deliveries.
    - Contract award / milestone billing
    - $62.8M Fort Bliss production contract for 10 barracks.
    - High counterparty quality but likely milestone-based and working-capital heavy.
    - Provide percent-complete revenue recognition, billing terms, and project margin.
  - - Government and space R&D contracts
    - SBIR or other agency-funded development work tied to robotics and construction systems.
    - Contract milestones / reimbursable work
    - $57.2M NASA Phase III award through 2028; company claims >$360M cumulative government contracts.
    - High counterparty quality, but not proof of repeatable commercial product revenue.
    - Disclose remaining performance obligations, funded backlog, and cash collection timing.
  - - Bundled materials, software, architecture, training, and service
    - Follow-on monetization layered into Titan and project programs rather than separately priced.
    - Mostly bundled; standalone pricing not public
    - Commercially visible in Titan program descriptions, but no standalone revenue split is public.
    - Medium — this could become the higher-margin layer, but evidence is incomplete.
    - Break out software, service, materials, and architecture revenue by stream.
  notes: Rows distinguish direct project revenue, system/program revenue, and government contract work. Public values are contract, list-price, or program-status signals and should not be treated as recognized revenue without stream-level disclosures.
