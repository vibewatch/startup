- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on analysis
  - Current public status
  - Exact diligence path
  rows:
  - - Revenue / ARR by stream
    - Prevents testing scale, growth, and capital efficiency.
    - Not publicly disclosed.
    - Obtain monthly revenue bridge split across direct projects, government contracts, and Titan-related sales.
  - - Gross margin and cost stack
    - Blocks comparison of contractor economics versus platform economics.
    - Not publicly disclosed.
    - Request gross margin by stream plus labor, materials, manufacturing, and support-cost splits.
  - - Customer count, reservations, and funded backlog
    - Blocks evaluation of demand durability and forecast conversion.
    - Not publicly disclosed.
    - Request signed-customer list, reservation funnel, backlog aging, and cancellation terms.
  - - Cash, burn, and runway
    - Makes financing dependency impossible to size.
    - Not publicly disclosed.
    - Request 24-month cash flow, current cash balance, monthly burn, and base/downside runway.
  - - Final Series C size, valuation, and terms
    - Blocks dilution, governance, and mark-to-market analysis.
    - First close disclosed; valuation and full terms undisclosed.
