callouts:
- calloutType: risk
  title: Layoffs plus a smaller, valuation-undisclosed Series C make the financing story cautionary
  body: A 114-person layoff in January 2025 followed by only a $56 million first close, after far larger 2021-2022 financing context, is a real warning sign. The evidence does not prove distress, but it does point more toward reset or bridge financing than a clean, de-risked growth round.
  claimRefs:
  - CI011
  - CI013
  - CI014
  - CI036
  - CI039
- calloutType: insight
  title: Government contracts are the strongest public revenue-style proof, but they are not the same as recurring software revenue
  body: The Army and NASA contracts are with credible counterparties and show funded demand, which matters more than a generic pilot. But contract value alone does not answer revenue recognition, cash timing, or gross-margin quality, so investors should treat these as strong demand signals rather than proof of SaaS-like economics.
  claimRefs:
  - CI022
  - CI023
  - CI046
  - CI047
- calloutType: recommendation
  title: Underwrite ICON as a mixed project-platform business until Titan converts into disclosed delivered systems
  body: The company narrative is moving toward builder enablement and potentially better-margin software-plus-service economics, but public evidence still shows a business carrying project execution, government work, and platform build-out simultaneously. The key diligence job is to isolate stream-level revenue, margin, and cash contribution rather than assume the platform model is already proven.
  claimRefs:
  - CI015
  - CI025
  - CI031
  - CI041
  - CI045
