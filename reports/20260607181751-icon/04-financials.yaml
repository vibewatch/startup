- id: capital-history-adequacy-and-round-interpretation
  title: Capital history, adequacy, and what the 2025 round implies
  body: 'The funding chronology matters here mainly as context for capital adequacy. Officially, ICON announced a $207 million Series B in August 2021 led by Norwest, with total funding reaching $266 million and a strategic investor list that included 8VC and LENx. Later reporting described February 2022 as a $185 million Series B extension at a valuation approaching $2 billion. By February 2025, ICON disclosed only a $56 million Series C first close, albeit with up to $75 million planned and the backing of Norwest, Tiger Global, and repeat insiders. The company would not disclose the new valuation. That sequence is the chapter''s main financial caution: a materially smaller, first-close-sized round arrived just weeks after a 114-person layoff and after much larger prior financing context. That does not prove distress, because repeat investors still funded the company and the new capital was tied to Phoenix and builder enablement. But it does make the round look more bridge-like or reset-like
    than a clean new growth chapter. Public cash, burn, runway, round completion, and term-sheet protections remain unavailable, so the forward adequacy judgment is necessarily indirect.'
