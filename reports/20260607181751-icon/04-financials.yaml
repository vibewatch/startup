  - - Contract economics for Army, NASA, Wolf Ranch, and Titan
    - Blocks conversion of contract or home-price headlines into real revenue and margin.
    - Only contract values, project counts, or end-home prices are public.
    - Provide contract scope, revenue-recognition method, gross margin, and cash collection schedule per program.
