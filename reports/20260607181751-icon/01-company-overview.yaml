callouts:
- calloutType: strength
  title: Government and off-world contracts differentiate ICON from pure housing startups
  body: NASA’s CHAPEA and lunar-construction work, the Fort Bliss barracks program, and the April 2026 ICON Prime launch show that ICON has built a second credibility lane beyond residential housing. That matters because it broadens the company’s demand base and creates more defensible proof points than consumer-housing pilots alone.
  claimRefs:
  - CO035
  - CO036
  - CO037
  - CO038
- calloutType: risk
  title: The 2025 layoffs make the platform pivot a live execution risk, not a theory
  body: Cutting 114 employees while reorienting toward Phoenix and Titan suggests ICON is still searching for the right operating model between builder-of-record execution and technology licensing. Public investors can see the strategic direction, but not yet the revenue conversion, valuation reset, or stabilized headcount that would de-risk it.
  claimRefs:
  - CO020
  - CO023
  - CO024
  - CO025
  - CO026
  - CO040
  - CO044
  - CO046
- calloutType: insight
  title: Later diligence should treat housing milestones as proof points and Titan/Prime as the current thesis
  body: Community First!, House Zero, and Wolf Ranch still matter because they prove the technology in the field, but the newest evidence suggests the live company thesis is commercialization through builder tools and government programs. Underwriting should therefore separate legacy showcase projects from the forward-looking revenue model.
  claimRefs:
  - CO027
  - CO029
  - CO031
  - CO040
