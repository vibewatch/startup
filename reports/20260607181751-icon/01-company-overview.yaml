company:
  name: ICON
chapter:
  number: 1
  title: Company Overview
  summary: ICON is an Austin-based private construction-technology company founded in late 2017 that moved from proving 3D-printed housing through self-developed projects into selling robotic construction systems to builders and government customers. Public evidence supports a $207 million 2021 Series B, a $56 million Series C first close in February 2025 that pushed lifetime funding above $500 million, and milestone programs spanning the first permitted U.S. 3D-printed home, Community First! Village, Wolf Ranch, NASA CHAPEA, and U.S. Army barracks. The main diligence caveats are missing public disclosure on current valuation, revenue, customer count, precise run-date headcount, and the full governance/cap-table structure after the January 2025 layoffs.
sections:
- id: identity-and-founding
  title: Identity, headquarters, and company formation
  body: 'ICON presents itself as a builder of “architecture for humanity” and a technology provider for builders, not just a niche printer OEM. Its homepage says the company designs and builds architecture while equipping builders with technology to build better, faster, and at lower cost, and multiple independent sources place the business in Austin, Texas. The public founding story is consistent across TechCrunch and 3Dnatives: ICON was founded in late 2017 and came to market during SXSW in March 2018 with the first permitted 3D-printed home in the United States. That launch matters because it frames the company’s identity as both a robotics platform and a housing-delivery operator from inception. Public materials do not provide a richer legal-entity or office-footprint disclosure than the Austin base and homepage footer naming ICON Technology, Inc.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO007
