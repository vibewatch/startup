- id: milestones-and-projects
  title: Milestones across housing, partnerships, and off-world programs
  body: 'ICON’s public milestones span social housing, market-rate housing, government construction, and space-related R&D. Community First! Village in Austin shows multi-year deployment depth: the official project page spans 2019-2026 and 117 structures for residents emerging from chronic homelessness. House Zero in 2022 served as a design-forward demonstration project in Austin, while Wolf Ranch became the company’s flagship mainstream-housing proof point: official materials describe it as the world’s first 100-home 3D-printed community, and Reuters-linked coverage says printing began in November 2022. NASA and defense milestones widen the story beyond residential construction. ICON’s 2021 Mars Dune Alpha announcement and NASA’s 2025 lunar-construction award tie the company to CHAPEA and lunar-surface infrastructure, while the U.S. Army’s $62.8 million Fort Bliss barracks contract and April 2026 ICON Prime launch demonstrate that government work is now central to the company narrative.'
