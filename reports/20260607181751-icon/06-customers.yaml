  evidenceGaps:
  - type: missing-source
    severity: material
    topic: east-17th
    missingEvidence: A distinct current source showing East 17th Street residences, its buyer or deployment owner, and what role ICON actually played.
    whyItMatters: Without a direct source, East 17th cannot be counted as current named customer proof on the same footing as Community First!, Wolf Ranch, Fort Bliss, or Mueller.
    diligencePath: Fetch an official project page, developer page, or credible local report that identifies the site, the customer or owner, the project scope, and whether the URL still resolves directly rather than redirecting to the generic projects index.
    relatedQuestionRefs:
    - QU012
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Customer count, NRR, GRR, churn, renewal dates, contract duration, and satisfaction data by segment.
    whyItMatters: Reference deployments can look impressive while still failing to generate durable repeat economics; without retention data the chapter cannot separate logo quality from revenue quality.
    diligencePath: Request cohort retention and expansion tables by government, nonprofit, residential, and platform segments, then reconcile them to named public proof points.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: titan-customers
    missingEvidence: Named Titan reservation holders, delivered systems, support SLAs, uptime data, and repeat-order evidence.
    whyItMatters: The builder-platform thesis is central to ICON's expansion story, but public evidence currently stops before real customer conversion can be measured.
    diligencePath: Request Titan reservation funnel, signed orders, delivery schedule, first-customer references, and service metrics for every system handed to external builders.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue or bookings mix by customer segment plus top-customer concentration and government share of total demand.
    whyItMatters: A small set of flagship deployments can dominate the narrative while masking a narrow underlying revenue base.
    diligencePath: Request bookings and revenue split by government, nonprofit, residential, and builder-platform channels, along with top-5 customer share and backlog concentration.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU005
