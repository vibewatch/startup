company:
  name: ICON
chapter:
  number: 6
  title: Customers
summary: ICON's best customer proof is concentrated in repeat supportive-housing and government reference deployments rather than in a broad installed base of external builders. Community First! and Fort Bliss show the strongest repeat-use signals, Wolf Ranch provides visible market-rate homebuyer adoption but not mass affordability, and NASA broadens the sponsor set without proving terrestrial housing repeatability. Titan creates a promising future buyer class, yet the public pack still lacks named external platform customers, retention metrics, and revenue-mix disclosure.
runDate: '2026-06-07'
sections:
- id: segmenting-buyer-types-and-reference-accounts
  title: 'Customer map: the buyer, deployment owner, and end-buyer are often different entities'
  body: 'ICON does not have one simple customer archetype. The reviewed pack points to four buckets that matter for underwriting: government and space-agency sponsors, nonprofit and mission-driven housing operators, market-rate residential developers and retail homebuyers, and prospective external builders for Titan. The nuance is that those roles often split across the same project. At Community First! Village, Mobile Loaves & Fishes is the mission owner and site operator, Lennar Foundation is a philanthropic expansion partner, and residents are beneficiaries rather than direct purchasers. At Wolf Ranch, the important commercial layer is the developer and homebuilder stack, with retail buyers validating whether printed homes can clear the market at standard suburban price points. Fort Bliss is the cleanest case of a true institutional customer and deployment owner. NASA is different again: its value is as a technically demanding sponsor and contract counterparty, not as proof of repeat
    terrestrial housing demand. Titan then opens a fifth surface only prospectively: outside builders as future system buyers. The right read is therefore role-specific. Customer proof is strongest where a named external counterparty owns the site, budget, or program; it is weakest where ICON is mainly showcasing its own build capability.'
