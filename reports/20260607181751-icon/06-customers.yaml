- id: deployment-proof-and-adoption-trajectory
  title: 'Named proof: repeat supportive housing and government awards are stronger than generic logo presence'
  body: 'The most convincing adoption evidence comes from places where ICON moved beyond a first print. Community First! is the strongest nonprofit proof point because the official page lists 117 structures across a 2019-2026 window, while trade coverage says the current phase adds 100 printed homes with the Lennar Foundation. That is not just a conceptual rendering; it is repeat deployment with a named mission owner and expanding site footprint, even though the public pack still lacks a firm completion date. Government proof is nearly as strong. Fort Bliss opened the Defense Department’s first UFC-compliant 3D-printed barracks in 2025 and then advanced to a $62.8 million follow-on for 10 more barracks, with Army coverage describing multiple printers working simultaneously. Wolf Ranch is important for a different reason: it shows a 100-home, market-rate neighborhood with visible buyer interest and public pricing, but that adoption still looks like premium or mainstream suburban housing rather
    than low-cost housing disruption. Mueller adds an early affordable-housing signal with three low-income homes under construction, but it remains much smaller than Community First! or Wolf Ranch. NASA broadens the customer set, yet it should be framed as high-value sponsorship and contract work rather than proof of repeat homebuilder sales.'
