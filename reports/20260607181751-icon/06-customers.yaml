- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / risk
  - Why it matters
  - Current evidence
  - Impact if true
  - Diligence path
  rows:
  - - Government concentration
    - Army and NASA proof are the clearest scaled external signals
    - ICON Prime says government contracts now exceed $360M
    - Could support growth but increase concentration to procurement cycles
    - Request backlog and revenue mix by government vs civilian customers
  - - Community First! concentration
    - Supportive-housing narrative relies heavily on one flagship operator
    - 117 structures plus 100-home expansion
    - A slowdown would materially weaken the social-housing proof set
    - Request additional nonprofit or municipal deployments
  - - Wolf Ranch dependence
    - Market-rate proof is dominated by one flagship neighborhood
    - 100 homes plus public pricing and reported sales
    - If replication stalls, mainstream-homebuilder thesis remains thin
    - Request repeat-community pipeline and homebuilder references
  - - Titan platform transition
    - Outside builders could diversify revenue beyond ICON-led builds
    - Launch page plus layoff coverage show strategic priority
    - Could improve scalability if conversions happen
    - Request named reservations, conversion, and delivery status
  - - Affordability mismatch
    - Printed homes may still clear at mid-market prices rather than mass-affordable levels
    - Wolf Ranch $450k-$600k versus Mueller affordable homes at $195k
    - Limits breadth of end-buyer TAM narrative
    - Request all-in cost stack by use case
  - - Missing retention and customer-count data
    - Without renewal metrics, logo quality may overstate revenue durability
    - No public NRR, GRR, churn, or customer-count disclosure
    - Raises underwriting uncertainty even if deployments are real
    - Request cohort retention and top-customer share
  - - Homebuyer financing friction
    - Mortgage incentives imply financing still needs support for buyers of printed homes
    - ICON newsroom says Wells Fargo offers a 50-bps lender credit to qualified ICON buyers
    - Suggests homebuyer acquisition still benefits from financing assistance
    - Request mortgage-conversion, buyer qualification, and cancellation data
  notes: The risk table separates channel-expansion upside from concentration and disclosure gaps so the chapter does not over-credit flagship deployments.
