      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              ICON 所在品类最强的市场驱动因素是结构性的，而不是周期性的。住房供给不足和可负担性压力创造了巨大的问题预算；BLS 与 McKinsey
              则说明自动化为什么有吸引力：美国建筑就业规模仍大但紧张，职位空缺仍高，McKinsey 还指出劳动力短缺很重要，长期建筑生产率几乎没有改善。NIST 补充称，增材建造可以补充劳动力并省掉模板；Mordor
              也明确把政府对打印可负担住房的资金支持和劳动力成本下降列为预测驱动因素。采用约束同样重要。NIST 称标准制定没有跟上，Construction Dive 报道 ICC
              仍在正式化墙体标准，而规范采纳滞后过去一直拖慢商业采用。即便这些障碍缓解，ICON 仍要与模块化或场外建造等替代方案竞争；McKinsey 预计到 2030 年，模块化或场外建造可能占新增建筑施工的 15% 到
              20%，同时还要面对 MIT 打印塑料结构件等其他自动化路径。换句话说，ICON 追逐的是生产率和交付预算，而不是受保护的 3D 打印预算。
