      - number: '2.2'
        title: 基于证据约束的测算，而非单一 TAM 口径
        blocks:
          - type: paragraph
            body: >-
              本章证据支持多种测算视角，而不是一个干净的 TAM。广义问题侧，Freddie Mac 仍认为住房缺口为 3.7 million 套，NAHB 估算都市区空置率修复缺口为 1.2 million 套，NLIHC
              报告极低收入租户的可负担租赁住房缺口为 7.2 million 套。这些数字证明终端市场痛点很大。窄技术侧，公开的 3D 建造市场估算差异显著。Mordor 估计 2026 年市场为 USD 3.34
              billion，2031 年前 CAGR 为 35.6%；Fortune Business Insights 则给出 2026 年 USD 5.35 billion，并预测到 2034 年 CAGR 高达
              82.81%。这个跨度太宽，不能当作已形成共识来承销。更稳妥的看法是：把住房短缺和可负担性数据当作需求背景，把第三方 3D 打印 TAM 当作窄口径采用代理，并承认真正的 ICON SAM 或 SOM
              仍需要装机基数、定价、积压订单和重复部署等非公开证据。
