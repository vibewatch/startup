            body: >-
              最有说服力的采用证据，来自 ICON 超越首次打印的地方。Community First! 是最强的非营利验证点，因为官方页面列出 2019-2026 年期间 117 个结构，行业报道也称当前阶段在 Lennar
              Foundation 支持下新增 100 个打印住宅。这不只是概念渲染，而是有具名使命所有者和持续扩张场地足迹的重复部署，尽管公开材料仍缺少确定完工日期。政府验证几乎同样强。Fort Bliss 在 2025
              年开放 Department of Defense 首个符合 UFC 的 3D 打印兵营，随后推进到 $62.8 million 的 10 个后续兵营项目，陆军报道还描述了多台打印机同时作业。Wolf Ranch
              重要性不同：它展示了一个 100 户、市场价社区，具有可见买方兴趣和公开定价；但这种采用看起来仍是高端或主流郊区住房，而非低成本住房颠覆。Mueller
              提供了一个早期可负担住房信号，三套低收入住宅正在建设中，但规模远小于 Community First! 或 Wolf Ranch。NASA
              拓宽了客户集合，但应被框定为高价值赞助和合同工作，而不是重复房屋建造商销售的证据。
