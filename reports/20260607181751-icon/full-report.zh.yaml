      - number: '7.5'
        title: 即使打印机能工作，替代方案、集中度和依赖项也可能挡住规模化
        blocks:
          - type: paragraph
            body: >-
              ICON 不是只和其他 3D 打印公司竞争。更重要的经济挑战，可能来自模块化和其他场外施工方法的替代竞争，它们已经在卖给同一类买方承诺：交付更快、可预测性更高、劳动强度更低。McKinsey
              将模块化描述为一个大型全球行业，50 多个国家有 700 多家公司；Urban Land 称模块化可在 24 个月项目上节省六到八周，同时提升可预测性和工厂质量。对 ICON
              来说，这是严肃标杆，因为公司仍依赖地方有管辖权机构、材料 / 工艺认证、尚未公开具名的外部建造商，以及一个尚未清晰把墙体成本说法转化为主流可负担需求的融资生态。政府和社会住房胜利是有用缓释，ICON Prime
              也可能加深积压订单，但它们也有风险：把可见成功叙事集中在采购重或伙伴主导渠道。结果是一家公司有真实证明和真实动能，但围绕监管者、建造商、资本和渠道组合，仍有不小依赖风险。
