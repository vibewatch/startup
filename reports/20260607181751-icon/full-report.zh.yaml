  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              不能把 ICON 当作面向全部住宅建造支出的公司来分析。大背景是美国住房市场长期供给不足，但 ICON
              真正相关的经济市场窄得多：自动化增材建造系统、材料、工程支持，以及在工期压缩、劳动力短缺、可负担性或韧性足以支撑更换建造方式的项目中使用的部署工作流。Freddie Mac、NAHB 和 CRS
              都指向持续供给约束，这解释了为什么更快的建造方法重要；但这些缺口数字是需求背景，不是直接的打印机收入。纳入支出因此集中在机器人墙体打印或壳体交付工作流、配比和材料认证、结构与规范验证，以及交付重复性低层项目所需的培训或运营模型。排除支出包括土地、许可、按揭融资、内装、MEP
              系统，以及绝大多数普通现场建造住宅。主要替代方案不只是传统混凝土或木结构建造，也包括模块化和场外工业化路径；这些路径同样解决成本、工期和劳动力问题，却不要求使用打印混凝土。
