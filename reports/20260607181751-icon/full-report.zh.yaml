      - number: '8.4'
        title: 建议、尽调阻碍和退出准备度
        blocks:
          - type: paragraph
            body: |
              估值判断应保持怀疑，但不应直接否定。ICON 看起来仍有有意义的期权价值：战略建造商关系、政府支持项目、可信的工业化建筑叙事，以及重复投资人支持。即便如此，公司目前没有披露支撑
              2026 年确定价格所需的输入项。这里没有任何公开来源给出当前收入、毛利率、盈利能力、积压订单转化、现金跑道，或最终 Series C
              估值和条款。在这种语境下，传统买入建议等于承保故事，而不是承保事实。更干净的立场是观察或继续研究，中等信心、高风险。退出准备度也有限：近期 IPO
              论据较弱，因为公开同行披露的运营细节多得多；战略交易或另一轮私募融资，似乎比一个完全去风险的公开上市更现实。主要尽调应聚焦最终 Series C
              文件、业务线收入和毛利率、Titan 预订与转化、现金跑道，以及 Wolf Ranch、Army 和 NASA 项目的合同经济性。这些也是投资逻辑破裂的关键监测项。
