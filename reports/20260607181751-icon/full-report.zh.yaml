  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台栈：已验证的 Vulcan 基座、Titan 商业化与 Phoenix 路线图
        blocks:
          - type: paragraph
            body: >-
              ICON 的产品已经不能再概括为一台打印机。公开信息现在覆盖设计建造业务、经过现场验证的机器人建造系统、材料栈，以及面向外部建造商的商业套装。最强验证仍在 Vulcan。合作伙伴和项目来源把 Vulcan I 与
              2018 年 SXSW 上美国首个完全获许可的 3D 打印住宅联系起来；Community First!、House Zero 和 Wolf Ranch 也都列出真实项目中实际使用的是 Vulcan
              变体。因此，在本次审阅材料中，Vulcan 是成熟的现场部署系统。Titan 不同：它是第一个包装清晰的外部买方产品。ICON 把 Titan 定位为完整技术系统，包含打印机、泵、BuildOS
              软件、培训、服务和保修，而不是裸机销售。Phoenix 更远一步。ICON 在 2024
              年把它作为更大的多层自动化路线图推出，但公开证据仍集中在演示结构和已公布经济性，而不是已完成的客户部署。因此，实用的尽调读法是分阶段的栈：Vulcan 证明执行，Titan 把这些经验卖给建造商，Phoenix
              则代表更雄心勃勃的自动化终点。
