        title: 资本历史、充足性与 2025 年融资透露的信息
        blocks:
          - type: paragraph
            body: >-
              融资时间线在这里主要影响资本充足性判断。官方口径下，ICON 于 2021 年 8 月宣布由 Norwest 领投 $207 million Series B，累计融资达到 $266
              million，战略投资者包括 8VC 和 LENx。后续报道把 2022 年 2 月描述为估值接近 $2 billion 的 $185 million Series B 延展轮。到 2025 年 2
              月，ICON 只披露了 $56 million Series C 首次交割，尽管计划最高融资 $75 million，并获得 Norwest、Tiger Global
              和重复内部投资者支持。公司没有披露新估值。这一序列是本章的主要财务提醒：在更大规模的 2021-2022 年融资背景之后，一个规模明显更小、类似首次交割的轮次，在 114
              人裁员后数周到来。这不能证明困境，因为重复投资人仍然出资，新资本也与 Phoenix
              和建造商赋能绑定。但它确实让这轮融资看起来更像过桥或重置，而不是干净的新增长章节。公开现金、烧钱速度、现金跑道、轮次完成情况和条款保护都不可得，因此对未来充足性的判断必然是间接的。
