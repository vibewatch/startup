  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 混合收入模式、公开定价信号与销售路径
        blocks:
          - type: paragraph
            body: >-
              应把 ICON 按混合型建造科技公司来承销，而不是纯房屋建造商，也不是拥有干净经常性指标的软件公司。公司官方页面称，ICON 既设计并建造建筑，也为建造商提供技术，让他们以更好、更快、更低成本的方式建造。2026
              年 3 月 Titan 发布让这种混合模式变得明确：ICON 正在销售一个一体化项目，包含机器人、软件、材料、建筑设计、培训和持续服务，并由订金、融资选项和 2027
              年初交付时间支撑。与此同时，公司仍称将直接设计并建造部分住宅、酒店、可负担住房和 Department of Defense 项目。公开价格点存在，但大多是营销或标价信号，而不是已实现经济性。Titan
              的多层墙体系统营销价格约为每平方英尺 $20；KVUE 报道的 2024 年 Phoenix 定价为墙体系统每平方英尺 $25、地基和屋顶每平方英尺 $80。Wolf Ranch
              住宅售价显示终端市场需求，但那是购房者价格，不是 ICON 确认的收入。
