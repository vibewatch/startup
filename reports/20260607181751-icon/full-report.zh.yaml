      - number: '5.4'
        title: 约束、路线图张力与仍未证明的部分
        blocks:
          - type: paragraph
            body: >-
              主要承销问题不是 ICON 是否有令人印象深刻的技术演示，而是这些验证中有多少能转成可复制、可对外销售的生产经济性。公开来源支持公司确实在转向为建造商提供装备。围绕 2025 年 Series C
              的行业报道称，Phoenix 正优先面向建造商；Titan 则在 2026 年把这个投资逻辑变成明确市场产品。但同一行业报道也称 ICON
              并未退出直接建造，这意味着运营模型是混合的，而不是干净的轻资产转型。成本证据也需要同样的细腻度。Titan 和 Phoenix
              给出了具体墙体系统价格点和时间主张，但公开材料没有披露经审计的全口径住宅成本、按项目类型划分的利润率、下游工种瓶颈或检查周期吞吐量。合规证据在墙体系统层面有意义，陆军来源也显示设施符合更新标准；但材料仍没有量化
              ICON 能多稳定地把打印速度转成规模化完整建筑交付。正确的尽调姿态是：对技术广度建设性看待，对单位经济性、可复制性以及平台销售超过 ICON 主导执行的速度保持谨慎。
