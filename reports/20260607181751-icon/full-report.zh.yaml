      - number: '4.4'
        title: 财务结论与承销障碍
        blocks:
          - type: paragraph
            body: >-
              证据支撑度最高的结论是：ICON 可能正在走向更有吸引力的平台模型，但公开证据仍太少，无法判断这一转型已经产出持久、高质量收入。正面论据真实存在：政府合同的交易对手可信；相比早期展示项目，Titan
              展示出更清晰的设备加服务商业化路径；经历艰难重置后，重复投资人仍愿意支持公司。负面同样真实。收入、毛利率、盈利能力、积压订单和客户数仍未公开；2025 年后的估值未披露；Wolf Ranch
              住宅价格、陆军兵营合同和 NASA 月面项目等合同价值，在缺少范围和利润率细节时，不能视作已确认收入。因此，投资人今天应把 ICON
              承销为资本密集型工业科技公司，经济性混合了项目、合同和新兴平台收入，而不是成熟的经常性收入公司。尽调重点应从头条项目新奇性，转向分收入流确认、项目利润率、现金跑道、轮次条款，以及 Titan
              预订能否按计划转化为真实交付系统。
