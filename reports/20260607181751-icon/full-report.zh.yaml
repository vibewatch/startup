      - number: '7.2'
        title: 监管、规范和认证瓶颈仍是核心规模化风险
        blocks:
          - type: paragraph
            body: >-
              最重要的非公司特定风险，仍是 3D 打印建筑缓慢的监管和检查路径。Construction Dive 对 Buro Happold
              的采访说得很直白：主因是建筑规范本身，不是打印能力不足。这与更广泛证据一致。ICC 到 2025 年初仍在制定专门的 3D 混凝土墙体指南。NIST 更新后的标准和 2025
              年研讨会报告都强调，增材建造仍需要严格文档、材料测试、结构完整性标准、安全协议，以及更贴近规范。两篇学术风险论文随后把规范缺失、审批延误、劳动力稀缺和设计知识缺口列为最严重行业风险。ICON
              在这里有实质缓释——Army 营房和 NASA 工作证明公司能跨过严肃机构门槛——但这些不能一揽子替代民用许可、贷款方接受度、地方检查员或重复的建造商审批。对 ICON
              当前部署模型而言，监管风险因此不是抽象分类噪音；它是展示性证明通向可重复外部建造商采用之间的闸门。
