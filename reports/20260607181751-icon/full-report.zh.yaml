            body: >-
              公开记录能勾勒 ICON 成本结构的大致图谱，但缺少建模所需的数字。公司似乎同时背着三层昂贵支出：机器人与材料
              R&D、制造或系统搭建，以及自营项目和政府项目的现场交付。这解释了为什么已完工住宅、兵营和旗舰社区等公开牵引力信号，不能直接转成盈利能力判断。2026 年官方材料称，ICON 已完成超过 240 到 245
              个住宅和构筑物，并有合作伙伴准备再建数百个；但公司仍未披露收入、ARR、客户数、积压订单转化、毛利率、CAC、回本周期或现金转换周期。裁员让成本基数问题更尖锐。TechCrunch 报道 2025 年 1
              月裁员前员工少于 400 人，2025 年 2 月报道则称裁员后约 200 人。这意味着劳动力费用和运营范围经历了重大重置，但不一定意味着利润率问题已解决。陆军和 Texas
              军方来源支持机器人建造可以降低劳动力需求、压缩工期的判断，但本材料没有任何来源披露这些收益是否转化为 ICON 自身有吸引力的项目利润率。
