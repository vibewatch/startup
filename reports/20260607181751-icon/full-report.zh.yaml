      - number: '5.2'
        title: 材料、规范接受度与控制层
        blocks:
          - type: paragraph
            body: >-
              ICON 的技术差异化，在公开来源跳出泛泛营销语言的地方最强。ICC-ES 评估报告是最清晰的第三方技术锚点：它依据多个 IBC 和 IRC 版本评估 ICON 3D 打印混凝土墙体系统，点名 Vulcan
              2.5 系列打印机，列出 Lavacrete 和 CarbonX 系列材料，并说明工地 28 天抗压强度门槛至少为 2,500 psi。这给本章提供了具体的规范与质量骨架。产品侧，Titan
              页面最清楚地解释了控制层。BuildOS 被描述为把建筑意图转换为工具路径，同时协调机器人、材料流、环境输入、事件监控、故障排查和服务支持。此后公开软件细节迅速减少。CODEX 和 Vitruvius 作为设计与
              AI 规划层可见，但本次审阅材料没有提供 API、安全架构或生产使用的深度公开文档。CarbonX 也需要谨慎表述：来源支持 ICON 推出低碳可打印配方，并引用 MIT Concrete
              Sustainability Hub 白皮书；但多数详细生命周期主张仍来自公司发布材料，而不是逐项目独立测量。
