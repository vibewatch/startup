  - id: FV002
    title: ICON $2B 账面估值占上市可比公司市值的比例
    type: bar
    notes: 仅作方向性框架。这些数值展示，若 ICON 估值为 $2B，相当于所选上市可比公司 June 2026 市值的多大比例。
    data:
