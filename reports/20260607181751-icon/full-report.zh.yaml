  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 ICON 的相关性
    rows:
      - - 核心增材低层建筑
        - 打印机或机器人系统、可打印材料、工程支持、QA、操作员培训、部署服务
        - 土地、融资、规划审批、装修、机电管线（MEP）、大部分总包范围
        - 使用项目资本和运营预算的量产建造商、开发商或总包商（GC）
        - 最贴近 ICON 的 Titan / Phoenix 式商业化逻辑
      - - 可负担住房交付
        - 靠系统交付重复住宅或小型结构的外壳，适用于看重可负担目标的项目
        - 与施工方法无关的广义住房补贴池
        - 住房非营利组织、公共资助方、赠款支持的交付团队
        - 相关性高，因为公共可负担需求很大，打印施工被定位为降本
      - - 韧性 / 灾后恢复住房
        - 快速部署、韧性墙体系统、面向劳动力困难环境的自动化
        - 与实体重建方法无关的一般应急援助
        - 州或地方恢复机构、慈善资金、韧性项目
        - 相关，因为试点强调更快、更坚固、维护更低的结构
      - - 政府 / 公共工程结构
        - 用于营房、市政结构或公共设施的采购，这些场景可采用重复混凝土墙体工作流
        - 自动化施工之外的全部国防或公共工程预算
        - 机构采购办公室或公共主管部门
        - 对 ICON 具有战略重要性，但从该来源包看不能直接量化
      - - 广义住宅建造问题空间
        - 住房需求、可负担租赁短缺、施工吞吐约束
        - 不是直接打印机 TAM
        - 家庭、租户、城市、建造商、政策制定者
        - 设置需求背景，但夸大 ICON 近期能变现的范围
      - - 现状替代方案及邻近领域
        - 传统现场建造、板材化、模块化，以及其他解决成本或工期问题的自动化程度较高流程
        - N/A
        - 同上买方
        - 这些替代方案争夺同一笔生产率和交付预算
    notes: 各行把广义住房问题，与自动化增材建造及其替代方案直接相关的更窄支出区分开。
