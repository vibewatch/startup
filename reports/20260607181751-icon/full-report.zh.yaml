  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 住房供给不足和可负担租赁短缺
        - 增长驱动因素
        - 当前 / 结构性
        - 缺口或难以负担的住房单位以百万计，持续推动更快、更便宜的交付方式
        - 追问哪些细分市场真能为新建造方法付费，而不只是表达需求
      - - 劳动力紧张和生产率疲弱
        - 增长驱动因素
        - 当前 / 结构性
        - 劳动力稀缺、产出提升乏力时，建商有动力测试自动化
        - 索取 ICON 项目层面的节省用工和吞吐量数据
      - - 政府资助 3D 打印可负担住房
        - 增长驱动因素
        - 当前 / 中期
        - 公共或使命驱动项目可能先于纯私营买家赞助试点
        - 将赠款支持的试点与可自我维持的商业需求拆开看
      - - 韧性和灾后恢复场景
        - 增长驱动因素
        - 当前 / 中期
        - 3D 打印混凝土的定位是在困难环境中更快、更坚固地重建
        - 验证韧性买家在首批试点后是否复购
      - - 规范和许可滞后
        - 约束
        - 当前 / 结构性
        - 商业化需要标准、测试和本地工程签字认可
        - 梳理审批周期、工程例外，以及谁承担许可风险
      - - 标准仍在追赶
        - 约束
        - 当前 / 结构性
        - NIST 和 ICC 的动作显示进展，但市场尚未常态化
        - 验证哪些司法辖区或认证方已经接受这套工作流
      - - 模块化、场外建造等替代路径
        - 约束
        - 当前 / 新兴
        - 买家可以不采用 3D 混凝土打印，也解决同样的用工或工期问题
        - 不要只对比传统木结构，应拿 ICON 与模块化或板式建造经济性做基准
      - - 公开 SOM 可见度弱
        - 约束
        - 当前
        - 外部数据看不到 ICON 装机基础、积压订单或复购率
        - 索取已安装系统、利用率、积压订单、定价和复购客户数据
    notes: 关键在时间：问题对应的预算很大，但采用仍取决于规范周期、采购路径，以及 ICON 确实优于替代方法的证据。
