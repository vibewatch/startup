      - number: '8.2'
        title: 公开可比公司、行业顺风和相对估值框架的边界
        blocks:
          - type: paragraph
            body: |
              公开可比公司只能为 ICON 估值提供方向性框架，因为它既不是纯住宅建造商，也不是干净的上市软件类比。不过，它们仍是有用护栏。截至 2026 年 6 月初，Lennar
              市值约 $22.3 billion，NVR 约 $16.7 billion，TopBuild 约 $11.3
              billion，Installed Building Products 约 $5.3 billion，Trimble 约 $12.6
              billion，Autodesk 约 $48.6 billion。假设 ICON 估值为 $2 billion，只占大型上市龙头很小一部分，但相对于披露远充分得多、已经成熟上市的建筑和
              AEC 公司，仍是不小比例。更大的行业叙事并非虚构。McKinsey 的模块化建筑框架指向长期投资人吸引力：把建筑从定制项目转向产品化系统；Mordor
              预计建筑 3D 打印市场到 2031 年快速增长；Freddie Mac 仍估计美国住房供给缺口以百万套计。这些顺风解释了 ICON
              为什么能吸引高价资本。它们并不能证明 ICON 已获得软件式利润率、建造商平台可重复性，或 2026 年估值仍配得上旧有接近 $2 billion 的锚点。
