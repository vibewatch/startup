  - id: TI001
    title: 收入来源表
    columns:
      - 来源
      - 机制
      - 单位 / 定价基础
      - 当前价值 / 状态
      - 收入质量
      - 尽调要求
    rows:
      - - 住宅和酒店项目设计建造
        - ICON 直接为客户和合作伙伴设计并建造部分住宅或建筑。
        - 项目合同金额；住宅或社区范围
        - 仍能看到活跃项目露出，但项目收入没有公开披露。
        - 中——收入可能可观，但大概率不连续且劳动密集。
        - 索取逐项目收入、毛利率和复购客户结构。
      - - 面向建造商的技术系统销售（Titan）
        - 向建造商销售集成机器人、软件、材料、建筑设计、培训和支持。
        - $5,000 预订押金，加未披露的系统 ASP 和支持费
        - 2026 年开放预订；预计 2026 年 Q3 培训；首批交付目标是 2027 年初。
        - 若支持和软件能附着，收入质量中到高；但公开层面尚未证明转化。
        - 索取已签预订、转化漏斗、实际 ASP 和支持附着率。
      - - 政府营房建设
        - 按国防里程碑或交付确认合同建设收入。
        - 合同授予 / 里程碑计费
        - Fort Bliss 10 栋营房生产合同 $62.8M。
        - 交易对手质量高，但大概率按里程碑确认，且占用较多营运资本。
        - 提供完工百分比收入确认、计费条款和项目毛利率。
      - - 政府和航天研发合同
        - SBIR 或其他机构资助的开发工作，绑定机器人和建筑系统。
        - 合同里程碑 / 可报销工作
        - NASA Phase III 授予 $57.2M，覆盖至 2028 年；公司称累计政府合同 >$360M。
        - 交易对手质量高，但不能证明商业产品收入可重复。
        - 披露剩余履约义务、已获资金支持的积压订单和回款时点。
      - - 打包材料、软件、建筑设计、培训和服务
        - 后续变现叠加在 Titan 和项目计划里，而非单独定价。
        - 多数打包；单独定价未公开
        - Titan 项目描述里能看到商业化信号，但未公开单独收入拆分。
        - 中——这一层可能成为更高毛利来源，但证据仍不完整。
        - 按来源拆分软件、服务、材料和建筑设计收入。
    notes: 各行区分直接项目收入、系统 / 项目收入和政府合同工作。公开数值是合同、标价或项目状态信号；没有来源级披露前，不应视为已确认收入。
