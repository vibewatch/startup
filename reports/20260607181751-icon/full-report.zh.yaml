      - CR040
      - CR041
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 监管延迟、可负担性转化乏力和商业化调整如何叠加成融资压力。
    data:
      nodes:
        - id: R1
          label: 规范 / 检查滞后
          detail: 民用审批和资质认定耗时，比打印机营销说法更长。
          tone: risk
        - id: R2
          label: 资质认定负担
          detail: 材料测试、文档和地方工程工作会拉长部署周期。
          tone: risk
        - id: R3
          label: 可规模化民用部署减少
          detail: 验证仍集中在少数旗舰项目，而不是广泛重复采用。
          tone: risk
        - id: R4
          label: 可负担性缺口
          detail: 墙体成本说法无法顺畅转化为广泛可负担的交付住宅。
          tone: risk
        - id: R5
          label: 建商订单放慢
          detail: 外部建商会等到经济性和审批更清楚之后再购买。
          tone: risk
        - id: R6
          label: 裁员 / GTM 调整
          detail: ICON 重组，优先推进 Phoenix/Titan 和外部建商。
          tone: risk
        - id: R7
          label: 毛利与现金跑道压力
          detail: 硬件、服务、培训和直接建造义务让成本基座保持高位。
          tone: risk
        - id: R8
          label: 需要新资本或接受更弱条款
          detail: 如果规模化仍然缓慢，估值不透明或进一步裁员会更可能出现。
          tone: risk
        - id: R9
          label: 政府验证
          detail: Army/NASA 项目部分缓解了对技术能否成立的根本疑虑。
          tone: positive
        - id: R10
          label: 模块化替代压力
          detail: 开发商可以选择更成熟的异地建造方法，结果更可预测。
          tone: risk
      edges:
        - from: R1
          to: R2
          label: 造成
        - from: R2
          to: R3
          label: 拖慢
        - from: R4
          to: R5
          label: 抑制
        - from: R3
          to: R5
          label: 限制
        - from: R5
          to: R7
          label: 施压
        - from: R6
          to: R7
          label: 增加
        - from: R7
          to: R8
          label: 抬高
        - from: R10
          to: R5
          label: 争夺
        - from: R9
          to: R8
          label: 部分抵消
        - from: R9
          to: R3
          label: 部分缓解
    claimRefs:
      - CR021
      - CR022
      - CR028
      - CR031
      - CR033
      - CR040
      - CR044
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 关键外部依赖，左右 ICON 能否把标杆项目转成建筑商可重复采用的模式。
    data:
      nodes:
        - id: D1
          label: ICON 商业化
          detail: Phoenix / Titan / 直接建造 / 政府项目组合。
          tone: neutral
        - id: D2
          label: ICC / NIST 标准
          detail: 为有文档、可测试的建筑规范路径提供框架。
          tone: neutral
        - id: D3
          label: 地方 AHJ / 检查员
          detail: 民用部署最终要过地方许可和签字放行。
          tone: risk
        - id: D4
          label: 外部建筑商 / 开发商
          detail: Titan 要转成私人市场的重复需求，需要这类主体买单。
          tone: risk
        - id: D5
          label: 陆军 / NASA / ICON Prime
          detail: 最高可信度的验证，也是潜在订单储备渠道。
          tone: positive
        - id: D6
          label: 材料 / 工艺认证
          detail: 围绕集成技术栈的测试、文档和工程验证。
          tone: risk
        - id: D7
          label: 住房金融生态
          detail: 贷款方、保险方以及买方围绕打印住宅的核保 / 授信规则。
          tone: risk
        - id: D8
          label: 模块化 / 异地建造替代方案
          detail: 争夺同一项目预算的其他工业化建造方法。
          tone: risk
      edges:
        - from: D2
          to: D3
          label: 提供依据
        - from: D2
          to: D6
          label: 指引
        - from: D6
          to: D3
          label: 支持其审批
        - from: D3
          to: D1
          label: 放行或阻断
        - from: D4
          to: D1
          label: 购买 / 部署
        - from: D5
          to: D1
          label: 验证并资助
        - from: D7
          to: D4
          label: 为其促成项目
        - from: D8
          to: D4
          label: 争夺
    claimRefs:
      - CR022
      - CR028
      - CR033
      - CR035
      - CR042
  - id: FV001
    title: 推荐逻辑
    type: flow
    notes: 从融资信号和战略验证，到估值立场与投资建议的推导链。
    data:
      nodes:
        - id: n1
          label: 据称 2022 年延期轮对 ICON 的估值接近 $2B (CV002)
        - id: n2
          label: 2025 年 Series C 首次关账仅 $56M，估值未披露 (CV004, CV006)
        - id: n3
          label: 裁员 114 人并重置团队规模 (CV009, CV010)
        - id: n4
          label: Lennar / Wolf Ranch 提供战略验证 (CV023, CV030)
        - id: n5
          label: 陆军和 NASA 形成政府侧验证点 (CV028, CV029)
        - id: n6
          label: 上市可比标的仍是数十亿美元市值，但披露完整 (CV013-CV017)
        - id: n7
          label: 没有公开收入、利润率、盈利能力或现金跑道数据 (CV032)
        - id: n8
          label: 过桥 / 重置风险压过了简单延续旧账面估值的逻辑 (CV036)
        - id: n9
          label: 基准估值区间 $1.2B-$1.8B (CV040)
        - id: n10
          label: 投资建议：观察 / 继续研究；~$2B 估值偏高且不确定 (CV043)
      edges:
        - - n1
          - n8
        - - n2
