        title: 耐久性：重复部署存在，但正式留存披露缺席
        blocks:
          - type: paragraph
            body: >-
              本章证据足以显示重复使用，但不足以证明持久的客户经济性。公开记录没有披露客户数、NRR、GRR、流失率、合同期限、细分组合或续约历史。这意味着分析师必须使用更弱的代理指标。Community First!
              是真实的重复部署故事，因为同一使命所有者横跨多年和多个结构反复出现。Fort Bliss 也是有用代理，因为陆军从开放首个合规兵营，推进到授予更大的后续生产项目。NASA 也暗示关系耐久，但其价值在于持续 R&D
              赞助，而不是透明的经常性收入模型。Wolf Ranch 的限制不同：那里有消费者采用信号，包括公开定价和报道销售；但没有公开证据证明同一住宅开发商栈已经在其他地方复制该社区。Titan
              是最大的耐久性缺口。这个产品显然创造了一个前瞻性买方类别，但本次审阅材料没有点名任何客户、任何已交付系统或任何重复订单证据。因此，投资人应把 ICON 当前客户章节视为参考账户验证强、留存会计弱。
