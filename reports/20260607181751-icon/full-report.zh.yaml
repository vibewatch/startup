      - number: '1.3'
        title: 融资历史、阶段与缺失的核心指标
        blocks:
          - type: paragraph
            body: >-
              公开融资证据显示，ICON 仍是一家风险资本支持的成长阶段公司，而不是成熟的自筹资金工业公司。最干净的锚点是 2021 年 8 月官方 Series B 公告：Norwest 领投 $207
              million，公司成立以来累计融资达到 $266 million。后续 TechCrunch 把 2022 年 2 月描述为 $185 million 的 Series B 延展轮，并称估值接近 $2
              billion，因此轮次口径需要谨慎处理。2025 年 2 月 Series C 首次交割新增 $56 million，计划最高 $75 million，并把累计融资推至 $500 million 以上，但
              ICON 拒绝披露新估值。公开运营指标比融资历史薄得多：没有权威公开收入数字，没有可支撑的当前客户账户总数；除裁员时期信号外，也没有精确的截至取数日员工数——裁员前员工少于 400 人，2025 年 2 月约
