        - 但这仍相当于披露远好得多的成熟上市公司的一大部分。
        - 当前收入、利润率和现金数据会让相对估值更干净。
      - - 推荐
        - 战略期权价值让 ICON 仍值得作为可投标的观察。
        - 证据质量太薄，撑不起乐观确定性。
        - 经验证的估值事件，或数据室级别的财务披露，是解锁点。
