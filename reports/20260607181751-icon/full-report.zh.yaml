  - id: TV005
    title: 投资逻辑失效与风险触发表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 下轮证据
        - 最终 Series C 或下一轮融资披露估值较 2022 年锚点持平或更低。
        - 证实原先约 $2B 估值在重置期没有守住。
        - 将承销假设重置到悲观区间，并重审所有私募市场估值假设。
      - - 进一步重组
        - 2025 年重置后再出现重大裁员或项目收缩。
        - 说明此前成本重置不足，也可能意味着需求或流动性弱于预期。
        - 提高风险权重，推进前要求现金跑道证据。
      - - Titan 转化落空
        - 预订未按承诺时间转化为已交付的房建商系统。
        - 削弱平台式上行相对承包商式估值的核心论点。
        - 在转化数据改善前，移除乐观情景权重。
      - - 政府项目经济性不及预期
        - Army 或 NASA 项目未能转化为健康毛利或可靠回款。
        - 削弱政府项目能为估值下行保护提供实质支撑的说法。
        - 只把合同新闻视为概念验证，不视为价值支撑。
      - - 披露继续停滞
        - 下一轮尽调中，管理层仍不披露收入、毛利率、现金跑道和股权结构条款。
        - 估值继续锚定故事风险，而不是经营证据。
        - 维持观察 / 继续研究立场，不为上行期权付费。
    notes: 每个触发因素都可监测，并直接对应当前基准情景是否还能成立。
    claimRefs:
      - CV006
      - CV008
      - CV031
      - CV032
      - CV036
      - CV038
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 最终 Series C 条款
        - 投后估值、最终关闭规模、清算优先权、所有权变化和董事会权利。
        - 判断 2025 年到底是上行轮、过桥、平轮还是重置。
        - 获取融资文件、股权结构表和董事会材料。
      - - 按收入流拆分的收入
        - 2024-2026 年收入在直接建造、政府项目和房建商平台销售之间的拆分。
        - 这是判断 ICON 应按承包商、工业科技还是软件邻近框架定价的前提。
        - 索取月度收入桥和积压订单转化文件。
      - - 毛利率与现金转化
        - 各收入流毛利率、营运资本强度、回款节奏，以及 Titan 部署的贡献毛利。
        - 判断战略牵引是否真的支撑估值，而不只是新闻热度。
        - 审阅项目级 P&L 和合同开票计划。
      - - Titan 管线
        - 预订量、转化率、系统 ASP、服务挂载、部署时间，以及流失 / 取消条款。
        - 这是区分乐观情景与基准、悲观情景的核心变量。
        - 索取房建商漏斗、已签订单和部署日历。
      - - 现金与现金跑道
        - 当前现金余额、月度烧钱速度、基准 / 下行现金跑道，以及契约或授信约束。
        - 仅凭融资新闻无法回答融资质量问题。
        - 获取现金桥和董事会批准的经营计划。
      - - 合同经济性
        - Wolf Ranch、Army 和 NASA 项目的范围、收入确认、毛利率和后续管线。
        - 把大型项目新闻转化为真实估值证据。
        - 索取项目经济性摘要和剩余履约义务。
    notes: 这些尽调问题刻意写得具体，因为仅靠公开记录还不足以做出扎实承销。
    claimRefs:
      - CV025
      - CV028
      - CV029
      - CV031
      - CV032
      - CV033
      - CV044
