      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              与 ICON 相关的买方图谱，比普通房屋建造商名单更宽。所给材料中最可见的需求，来自可负担住房发起方、韧性导向试点、大学，以及试图解决住房或灾害问题的地方政府，而不是直接购买打印住宅的个人业主。Virginia
              Tech 的拨款支持 3D4VA 项目明确围绕更可负担住房展开；Kentucky 的 Floodbuster 1 把打印混凝土与更快、更便宜、更抗灾的住房联系起来；LSU
              从可负担住房、飓风恢复和海岸保护角度描述这项技术；Forbes 报道 2026
              年城市层面与地方辖区合作，交付更低成本的住房供给。这些案例意味着多个付款方原型：用前期建造和运营预算的私人建造商，用拨款或补贴采购的公共机构或住房管理部门，以及为试点融资的使命驱动型联盟。用户包括工程师、施工经理、材料团队和检查员；在居民或机构入住前，他们必须认证配比、结构表现和规范合规。
