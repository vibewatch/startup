      - number: '7.4'
        title: ICON 转向外部商业化后，资本效率和执行风险上升
        blocks:
          - type: paragraph
            body: >-
              裁员重要，不只是负面标题，也因为它让当前运营转型变得可见。公开记录和多家媒体报道都指向 114 名受影响员工；TechCrunch 与 KVUE 称公司重新聚焦
              Phoenix，并把技术交到建造商手中。仅这一点就意味着战略重置。后续 $56 million Series C 让这个判断更尖锐：公司仍需要融资，估值未披露，3DPrint.com 称资金将主要支持
              Phoenix。与此同时，ICON 正在把 Titan 作为捆绑产品营销，涵盖软件、材料、培训、支持和质保；但公开证据仍没有显示具名外部 Titan 客户或已交付的客户自有系统。实际看，ICON
              现在似乎在同时管理直接建造的旗舰项目、政府扩张和外部建造商平台发布。这条路能走通，但显著抬高了执行门槛，因为公司不再只是证明自己能打印；它还必须证明外部建造商可以可重复地采用、认证、融资并运营这套系统。
