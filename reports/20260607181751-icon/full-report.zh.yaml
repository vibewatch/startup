  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户图谱：买方、部署所有者与终端买方往往不是同一实体
        blocks:
          - type: paragraph
            body: >-
              ICON 没有单一简单的客户原型。本次审阅材料指向四个对承销重要的桶：政府和航天机构发起方、非营利和使命驱动型住房运营方、市场价住宅开发商和零售购房者，以及 Titan
              的潜在外部建造商。细微之处在于，同一项目中这些角色往往会拆分。Community First! Village 中，Mobile Loaves & Fishes 是使命所有者和场地运营方，Lennar
              Foundation 是慈善扩张伙伴，居民是受益者而非直接购买者。Wolf Ranch 中，重要商业层是开发商和房屋建造商栈，零售买方则验证打印住宅能否以标准郊区价格点通过市场。Fort Bliss
              是真正机构客户和部署所有者最干净的案例。NASA 又不同：它的价值在于技术要求很高的发起方和合同交易对手，而不是重复地面住宅需求的证据。Titan
              随后只是前瞻性地打开第五类客户界面：外部建造商成为未来系统买方。正确读法因此必须按角色拆分。若具名外部交易对手拥有场地、预算或项目，客户验证最强；若 ICON 主要是在展示自己的建造能力，客户验证最弱。
