  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景：旧有约 $2B 标记为何已不够
        blocks:
          - type: paragraph
            body: |
              ICON 最后一个公开估值锚点，仍是 2022 年 2 月融资语境，而不是新的 2025 或
              2026 年价格发现事件。2021 年 Series B 官方公布规模为 $207 million；后续报道描述了
              2022 年 2 月一笔 $185 million 延期融资，把公司推向“接近 $2 billion”的估值和约
              $451 million 的累计股权融资。这个差异重要，因为下一个融资数据点明显更弱。2025 年 2
              月，ICON 只披露了 $56 million Series C 首次交割，计划最高 $75 million，并拒绝说明该轮是上行轮、平轮还是下行轮。公司及相关报道将资金用途放在
              Phoenix、多层建筑、把机器人平台交到建造商手中，而不是清晰财务规模或盈利能力。紧接 114
              人裁员之后，这个组合读起来是实质谨慎信号。它不能证明困境，因为有声誉的重复投资人仍然出资，但它确实削弱了任何把 2022 年接近 $2 billion
              的估值不加批判延续到 2026 年的尝试。
