companyProfile:
  summary: >-
    ICON 是一家总部位于 Austin 的私营建造科技公司，成立于 2017 年底。公司先靠自研和伙伴主导的 3D
    打印住房项目跑出早期验证，随后进入政府项目，并推动商业化：把一体化机器人建造系统卖给外部建造商。公开证据中最有分量的是 Community First!、Wolf Ranch、Fort Bliss 和 NASA
    相关项目；当前承销争议在于，Titan 和 Phoenix 能否把这些旗舰部署转成可复制的平台型业务。
  foundedDate: '2017-12-01'
  founders:
    - name: Jason Ballard
      role: 联合创始人、CEO
      background: ICON 在融资、产品和政府公告中的公开代表人物。
      claimRefs:
        - CO005
    - name: Alex Le Roux
      role: 联合创始人、CTO
      background: 公开资料中与 ICON 建造打印技术栈绑定最清晰的技术联合创始人。
