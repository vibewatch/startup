      - number: '8.3'
        title: 牵引力证明、悲观 / 基准 / 乐观情景和入场纪律
        blocks:
          - type: paragraph
            body: |
              最能反驳彻底悲观估值重置的理由，是 ICON 仍有真实战略证明点。Wolf Ranch 给了公司一个与 Lennar 相关联的 100 套住宅旗舰部署，公开记录还显示一份
              $62.8 million Army 生产合同，以及一项持续到 2028 年的 $57.2 million NASA SBIR
              Phase III 奖项。这些数据点支撑了不小的战略价值，也解释了为什么内部人在 2025
              年继续支持公司。但它们仍不足以证明持久经济性。Wolf Ranch
              价格是最终购房者价值，不是 ICON 确认收入；打印外壳只是成品住宅的一部分；政府合同标题没有揭示利润率、现金转换或复购。因此，情景分析应保持宽区间。大约
              $0.8 billion-$1.2 billion 的悲观情景，符合桥接轮或下轮解读。大约
              $1.2 billion-$1.8 billion 的基准情景，符合战略相关性延续、但缺乏 2022 年估值仍成立的证明。大约
              $1.8 billion-$2.4 billion 的乐观情景，要求 Titan 和 Phoenix
              从叙事转化为建造商采用，并且没有新的重置信号。因此，入场纪律应低于旧有约 $2 billion 锚点，而不是高于它。
