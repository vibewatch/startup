              2025 年 2 月融资报道中以董事身份出现，随后在 2026 年 4 月出任新设政府部门 ICON Prime 的总裁。不过，治理可见度仍不完整。ICON 2021 年 Series B 公告把 Norwest
              的 Jeff Crowe 加入董事会，但公开来源仍未披露完整的现任董事名单、委员会结构或更广泛的股权结构控制权。因此，关键人依赖仍集中在 Ballard 身上，外部董事影响力也缺少文件支撑。
