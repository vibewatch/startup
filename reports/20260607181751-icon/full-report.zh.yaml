      - number: '2.5'
        title: 尽调缺口与承销影响
        blocks:
          - type: paragraph
            body: >-
              ICON 的市场叙事需要始终附带两点提醒。第一，市场需求真实，但采用验证仍早。Harvard 显示，即便租金走软，可负担性压力仍严重；材料中最强的非 ICON
              需求案例是试点、大学项目和市政合作，而不是大量独立建造商反复下达生产订单。第二，准备好的官方数据源还不足以支撑严格承销。材料中的 Census 建筑支出和新屋开工 URL 是落地页，不是可直接引用的表格；多个
              HUD 或存档页面没有产出可用文本；准备材料也没有包含当前军事建造预算文件，无法有信心地测算国防需求。这意味着当前最干净的表述是：住房供给不足与劳动力 / 生产率问题解释了这个问题为什么重要，第三方 3D
              打印市场报告只定义了窄技术 TAM；在把市场视为完全被验证之前，投资人仍需要围绕规范周期、单位经济性、装机基数、可复制性和预算授权做直接尽调。
