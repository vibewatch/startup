      - number: '5.3'
        title: 部署验证：技术真正跑通的地方
        blocks:
          - type: paragraph
            body: >-
              ICON 的成熟度论据，更多来自项目多样性，而不是公开基准仪表盘。Community First! Village 显示多年重复部署，而不是一次性演示；官方列出 2019-2026 年期间 117
              个结构。House Zero 证明系统能支撑建筑师主导的高端住宅设计，而不只适用于朴素的低成本住房。Wolf Ranch 对主流生产相关性最重要：官方页面、CNBC、Fast Company 和 Forbes
              都把它描述为旗舰 100 户社区，也把它视为打印混凝土能从新奇技术进入分区开发工作流的证据。NASA 进一步拓宽技术边界。Mars Dune Alpha 把 ICON 下一代 Vulcan 工作与
              1,700-square-foot CHAPEA 栖息地相连；NASA 月面建造合同则显示，公司获得资金把平台适配到地外基础设施。国防项目如今同样重要。Bastrop 和 Camp Swift
              展示了早期兵营规模结构；Fort Bliss 则把公司推进到符合 Department of Defense 标准的兵营，并拿到生产规模后续项目。合在一起，这些项目不能证明无瑕疵的可复制性，但确实显示 ICON
              系统已经在人道主义、定制、分区、类太空和军事场景中跑通过。
