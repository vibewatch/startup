      - number: '7.3'
        title: 成本、可负担性和入住摩擦说明价值叙事尚未完全验证
        blocks:
          - type: paragraph
            body: >-
              ICON 的营销说法是，机器人施工能减少人工、加快速度、降低成本。现有公开证据还没有显示这一点已经转化为能被广泛市场接受的可负担住房。Titan 的头号指标是墙体系统约 $20 per square
              foot，最高比传统墙体系统平均水平低 40%，但这不等于交付住宅经济性。最清晰的市场价住宅证明 Wolf Ranch，定价约 $450,000 到 $600,000；公开销售信号仍停在 100
              套中约四分之一售出。New Atlas 直接说，美国广泛可负担住房尚未从 3D 打印中出现；Mueller 是有用但很小的可负担性证明点。还有一些现实摩擦让这一章更克制：Fast Company
              报道厚墙可能削弱无线信号，Community First! 报道称外壳打印后仍由人工团队完成屋顶、门和其他收尾工作。投资判断得到的教训是，外壳效率尚未证明整屋可负担，也未证明入住无摩擦。
