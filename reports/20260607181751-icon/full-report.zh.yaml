  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与公司成立
        blocks:
          - type: paragraph
            body: >-
              ICON 把自己定位为「为人类而建筑」的建造者，也定位为面向建造商的技术提供方，而不只是小众打印机 OEM。公司官网称，ICON
              既设计并建造建筑，也为建造商提供技术，让他们以更好、更快、更低成本的方式建造；多家独立来源也把公司所在地指向 Texas 州 Austin。公开创立叙事在 TechCrunch 和 3Dnatives
              之间保持一致：ICON 成立于 2017 年底，并于 2018 年 3 月在 SXSW 推出美国首个获许可的 3D 打印住宅。这个发布节点很关键，因为它从一开始就把 ICON
              的身份框定为机器人平台和住房交付运营方。除了 Austin 基地和官网页脚中的 ICON Technology, Inc. 之外，公开材料没有给出更完整的法律实体或办公地点披露。
