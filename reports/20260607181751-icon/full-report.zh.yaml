  - id: FV003
    title: 估值 / 回报区间 - 悲观 / 基准 / 乐观
    type: range
    notes: 以 USD billions 为单位的宽估值区间，目的是保留不确定性，而不是暗示精确测算。
    data:
      items:
        - label: 悲观（30%）
          low: 0.8
          value: 1
          high: 1.2
          unit: $B
        - label: 基准（50%）
          low: 1.2
          value: 1.5
          high: 1.8
          unit: $B
        - label: 乐观（20%）
          low: 1.8
          value: 2.1
          high: 2.4
          unit: $B
        - label: PW 中心值
          low: 1.4
          value: 1.55
          high: 1.7
          unit: $B
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
      - CV043
  - id: FV004
    title: 投资 KPI - IC 评分矩阵
    type: kpi
    notes: 仅基于运行日可得公开证据，按 IC 风格用 1-5 分打分（1 = 弱，5 = 强）。
    data:
      items:
        - label: 市场机会
          score: 4
          detail: 住房供给不足和建筑自动化需求仍然真实存在，但它们只是行业顺风，不是估值证明。
        - label: 产品市场契合度验证
          score: 3
          detail: Wolf Ranch、陆军、NASA 和 Lennar 显示 ICON 已取得实质进展，但平台化转化能否重复跑通，公开证据仍未证明。
        - label: 战略护城河
          score: 3
          detail: 建筑商关系、材料 / 机器人 IP 和政府可信度都重要，但没有一项转化成已披露的财务护城河指标。
        - label: 单位经济模型
          score: 1
          detail: 公开收入、毛利率、盈利能力和现金转化数据都缺失，难以支撑高置信度的估值方法。
        - label: 风险画像
          score: 2
          detail: 裁员、资本密集度和融资轮次不透明，让下行情景真实存在。
        - label: 估值支撑
          score: 2
          detail: 旧的 ~$2B 锚点已经是历史；现有证据更支持打折后的基准区间。
        - label: 证据质量
          score: 1
          detail: 最终轮次条款、现金跑道和经营指标仍未出现在公开记录中。
    claimRefs:
      - CV020
      - CV021
      - CV023
      - CV028
      - CV030
      - CV032
      - CV036
      - CV040
      - CV043
