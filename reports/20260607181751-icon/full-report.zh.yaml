      - - 战略建商验证
        - Lennar 投资了 ICON，并在高度可见的 Wolf Ranch 部署中合作。
        - 战略验证不等于证明独立经济性可盈利、可重复。
        - 建商转化指标、重复订单和部署利润率会强化投资逻辑。
      - - 政府项目
        - Army 和 NASA 的授标显示交易对手可信，技术相关性可延续多年。
        - 合同标题看不出毛利率、现金回款，或类似软件的经常性收入质量。
        - 合同级经济性和积压订单到收入的转化会厘清价值。
      - - 行业顺风
        - 住房供给不足和工业化建造趋势仍支撑长期需求。
