  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览：问题在商业化摩擦，而不是技术证明不足
        blocks:
          - type: paragraph
            body: >-
              ICON 现在像一家有重要证明点、但通向主流规模的路径尚未补完的公司。最强公开证据说明技术足以拿下要求严苛的参考项目：Army 营房通过更新后的 UFC 标准，NASA 继续资助月球建造工作，Community
              First! 反复落地支持性住房，Wolf Ranch 是真实的 100 套住宅社区，而非一次性演示。风险在下一步。商业 3D
              打印仍被描述为增长平淡，因为瓶颈在规范审批、材料认证、检查，以及从打印外壳转成可入住建筑。那些摩擦拖慢民用部署，让证明集中在少数旗舰项目，也迫使 ICON 在尚无客户自有部署公开证据之前，融资推动向外部建造商销售
              Titan 和 Phoenix 的昂贵转向。因此，本章最高严重度风险相互咬合：监管延迟削弱采用，采用乏力拉紧融资，融资压力又在 商业化打法重置期抬高执行风险。
