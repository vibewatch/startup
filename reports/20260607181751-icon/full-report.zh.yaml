      - number: '6.4'
        title: 扩张路径：政府广度真实存在，但集中度和买方摩擦仍是主要风险
        blocks:
          - type: paragraph
            body: >-
              ICON 的下一章客户叙事可能宽得多，但今天仍高度依赖少数旗舰部署。政府扩张是最清晰的放大路径。ICON Prime 称政府合同如今超过 $360 million，Fort Bliss 和 Camp Swift
              也显示防务项目不是单一孤立实验。非营利和可负担住房扩张也存在，但仍集中在 Austin 地区参考项目。市场价证明仍几乎全押在 Wolf Ranch；当地披露价格说明，3D
              打印还没有明显转化为大众可负担的独栋住宅。平台叙事更早。若 ICON 想获得更多可复用的外部客户，Titan 是正确战略动作，但公开证据仍停在发布材料、预订和未来交付时间表。反向信号很重要。TechCrunch
              和 KVUE 记录了一次 114 人裁员，原因与优先推进 Phoenix、把技术交到建造商手中有关；这意味着商业化动作仍在重置，而不是已经去风险。实际结论是建设性但谨慎：ICON
              有足够参考客户证明相关性，但客户集中、采购摩擦和续约数据缺失，仍限制对客户耐久性的信心。还有一个较小但仍相关的披露问题是档案可见性：预置的 East 17th Street 和 Chicon House
              路径如今跳到通用项目索引，旧住宅客户证明更难作为一个独立的当前参考账户核验。
