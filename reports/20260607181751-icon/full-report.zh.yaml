            body: >-
              本次审阅材料中最清晰的负面信号，是 2025 年 1 月裁员。TechCrunch、KVUE 和 Fabbaloo 都报道称公司裁撤 114 名员工，公司的解释集中在围绕
              Phoenix「重新调整」团队，并把技术交到建造商手中。这个信号重要，因为它意味着战略从劳动力密集的自营执行，转向更平台化的商业模式。2026 年 3 月 Titan 发布把这个转向正式化：ICON
              向建造商提供一体化系统、培训、融资支持，并给出 2027 年初交付时间；KVUE 还称 Phoenix 可能大幅降低打印成本。与此同时，2026 年官方新闻稿强调公司拥有超过 $360 million
              的政府合同，并已完成 240 多个住宅和基础设施项目，说明 ICON 仍有显著外部背书。承销问题在于，投资人最需要新清晰度的地方——估值、收入、客户数、裁员后的精确当前员工数——公开披露仍很薄。
