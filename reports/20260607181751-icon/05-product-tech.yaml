- id: materials-code-and-control-layer
  title: Materials, code acceptance, and the control layer
  body: 'ICON''s technical differentiation is strongest where public sources move beyond generic marketing language. The ICC-ES evaluation report is the clearest third-party technical anchor: it evaluates ICON 3D-printed concrete wall systems against multiple IBC and IRC versions, names the Vulcan 2.5 series printer, lists Lavacrete and CarbonX-family materials, and states a 28-day compressive-strength threshold of at least 2,500 psi at the jobsite. That gives the chapter a concrete code-and-quality backbone. On the product side, the Titan page provides the clearest explanation of the control layer. BuildOS is described as converting architectural intent into tool paths while coordinating robotics, material flow, environmental inputs, event monitoring, troubleshooting, and service support. Public software detail drops off quickly after that. CODEX and Vitruvius are visible as design and AI-planning layers, but the reviewed pack does not provide deep public documentation on APIs, security
    architecture, or production usage. CarbonX also needs careful framing: the sources support that ICON launched a low-carbon printable formula and cited an MIT Concrete Sustainability Hub white paper, but most detailed lifecycle claims still come through company-issued materials rather than independent project-by-project measurement.'
