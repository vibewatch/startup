tables:
- id: TE001
  title: Product Module / Asset Matrix
  description: Publicly visible ICON product layers and their maturity as of 2026-06-07.
  columns:
  - Module / asset
  - Primary buyer / user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Vulcan
    - ICON internal print teams; government and housing project operators
    - Field-proven system
    - Most public deployment proof across Community First!, House Zero, Wolf Ranch, Mars Dune Alpha, and early barracks work
    - Public pack does not provide a current standalone commercial datasheet or broad external installed-base count
  - - Titan
    - Outside builders, developers, and government-oriented construction teams
    - Commercial launch announced; deliveries start 2027
    - Bundles printer, pump, BuildOS, training, service, and warranty into a direct buyer offer
    - Buyer adoption, uptime, and repeat-order data are not yet public
  - - Phoenix
    - ICON-led projects and future multi-story builder programs
    - Announced roadmap / prototype
    - Targets full-building enclosures including foundations and roofs, with lower operator count and faster setup
    - Reviewed pack shows a demo structure and pricing claims, not finished customer deployments
  - - Lavacrete / CarbonX material family
    - ICON print operations and qualified project teams
    - Fielded wall-system material family with code-evaluation evidence
    - Named mixes and performance thresholds appear in ICC-ES ESR-4652; CarbonX adds low-carbon positioning
    - Independent, project-level lifecycle and cost data remain thin
  - - BuildOS
    - Printer operators, field supervisors, ICON support staff
    - Publicly described operating platform
    - Coordinates tool paths, material flow, monitoring, live support, and troubleshooting instead of leaving operations to manual printer control
    - No public API docs, cybersecurity architecture, or uptime history in the reviewed pack
  - - CODEX / Vitruvius
    - Builders, developers, architects, and future home buyers
    - Early-stage design and AI layer
    - Links ready-to-print designs and AI-assisted planning to construction workflows
    - Public usage metrics, customer adoption, and permit-ready output quality are not disclosed
  notes: Rows separate fielded systems from commercialization and roadmap layers; maturity judgments are based only on the reviewed public pack.
