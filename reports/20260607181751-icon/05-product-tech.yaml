  evidenceGaps:
  - type: missing-source
    severity: material
    topic: phoenix-maturity
    missingEvidence: Independent or customer-side evidence of finished Phoenix deployments, uptime, print quality, and operator performance.
    whyItMatters: Phoenix is central to ICON's multi-story automation story, so lack of field proof limits confidence in the roadmap.
    diligencePath: Request customer references, completed project dossiers, and commissioning data for the first Phoenix deployments.
    relatedQuestionRefs:
    - QE008
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: material
    topic: carbonx
    missingEvidence: Direct access to the MIT Concrete Sustainability Hub white paper and independent project-level carbon accounting for CarbonX deployments.
    whyItMatters: Low-carbon differentiation is important to ICON's technical moat but is still supported mostly by company-issued framing in this pack.
    diligencePath: Obtain the cited white paper, third-party LCA assumptions, and project-specific embodied-carbon calculations.
    relatedQuestionRefs:
    - QE014
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: economics-gap
    missingEvidence: Audited all-in project economics, print-to-completion cycle times, and margin data across multiple ICON deployments.
    whyItMatters: Wall-system price points alone are insufficient to underwrite whether ICON truly delivers lower total installed cost at scale.
    diligencePath: Ask management for project P&Ls, cost bridges, and variance by community, military, and custom-home deployment type.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE002
    - TE005
  - type: private-evidence-only
    severity: material
    topic: repeatability-gap
    missingEvidence: Metrics for inspection-cycle times, downstream trade bottlenecks, rework rates, and print-to-occupancy conversion across projects.
    whyItMatters: Printer speed can overstate real throughput if inspections, cores, MEP, or finishes dominate the critical path.
    diligencePath: Request operational dashboards for inspection lead times, punch-list incidence, and average days from print completion to occupancy.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: freshness
    severity: material
    topic: maturity
    missingEvidence: Fresh public evidence of finished multi-story buildings delivered with Titan or Phoenix under normal commercial conditions.
    whyItMatters: ICON's strategic narrative increasingly depends on multi-story capability, so roadmap claims need current field proof.
    diligencePath: Track 2026-2027 Titan customer announcements, permitting records, and occupied multi-story completions.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
