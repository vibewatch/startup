- id: TE003
  title: Technology / Operating Architecture Table
  description: Publicly visible architecture layers of the ICON product system.
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Design layer (custom architecture + CODEX)
    - Supplies buildable designs and starting points for developments
    - Needs architect participation, site-specific adaptation, and permitting workflows
    - Catalog depth does not guarantee fast approval or broad buyer fit
  - - AI planning layer (Vitruvius)
    - Aims to automate design iteration, plans, budgets, and schedules
    - Depends on codified construction know-how and valid local constraints
    - Public maturity is roadmap-heavy and permit-grade output is not yet independently verified
  - - Print orchestration layer (BuildOS)
    - Turns designs into tool paths and coordinates robotics, material flow, monitoring, and support
    - Depends on accurate site setup, sensors, operators, and remote support
    - Software transparency is thin versus the importance of this control layer
  - - Robotic hardware layer (Vulcan / Titan / Phoenix)
    - Executes extrusion and enclosure construction in the field
    - Depends on transport, setup, terrain, labor, and hardware reliability
    - Hardware scaling risk rises sharply moving from single-story proof to multi-story production
  - - Material and pumping layer (Lavacrete / CarbonX + mixer + pump)
    - Delivers printable concrete with required workability and structural performance
    - Depends on mix consistency, weather, jobsite QA, and supply chain
    - Low-carbon and cost claims can degrade if field conditions vary materially
  - - Structural completion and support layer
    - Handles reinforcement, inspections, grouted cores, repairs, training, maintenance, and warranty
    - Depends on code officials, partner trades, and ICON field-service capacity
    - Full-building throughput can bottleneck outside the printer itself
  notes: This table models the public operating stack customers and project partners can actually observe.
