- id: constraints-roadmap-and-open-questions
  title: Constraints, roadmap tension, and what still is not proven
  body: The main underwriting issue is not whether ICON has impressive technical demos; it is how much of that proof converts into repeatable, externally saleable production economics. Public sources support a real commercialization shift toward equipping builders. Trade coverage around the 2025 Series C said Phoenix was being prioritized for builders, and Titan turned that thesis into an explicit market offer in 2026. But the same trade coverage also said ICON was not stepping away from direct construction, which implies a hybrid operating model rather than a clean asset-light transition. Cost evidence needs the same nuance. Titan and Phoenix provide concrete wall-system price points and time claims, but public materials do not disclose audited all-in home costs, margin by project type, downstream trade bottlenecks, or inspection-cycle throughput. Compliance evidence is meaningful at the wall-system level, and Army sources show facilities meeting updated standards, yet the pack still does
    not quantify how consistently ICON can move from printer speed to full building delivery at scale. The right diligence posture is constructive on technical breadth and cautious on unit economics, repeatability, and the pace at which platform sales can overtake ICON-led execution.
