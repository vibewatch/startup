- id: deployment-proof-and-maturity-signals
  title: 'Deployment proof: where the tech has actually worked'
  body: 'ICON''s maturity case is built from project diversity more than from published benchmark dashboards. Community First! Village shows repeat deployment over years rather than a one-off demo, with 117 structures listed across a 2019-2026 window. House Zero proves the system can support architect-led, premium residential design instead of only austere low-cost housing. Wolf Ranch matters most for mainstream production relevance: the official page, CNBC, Fast Company, and Forbes all frame it as the flagship 100-home neighborhood and as evidence that printed concrete can move beyond novelty into a subdivision workflow. NASA broadens the technical envelope further. Mars Dune Alpha links ICON''s next-generation Vulcan work to a 1,700-square-foot CHAPEA habitat, while NASA''s lunar-construction contract shows the company being funded to adapt the platform toward off-world infrastructure. Defense work is now equally important. Bastrop and Camp Swift showed early barracks-scale structures,
    and Fort Bliss moved the company into Department of Defense-compliant barracks with production-scale follow-on work. Together these projects do not prove flawless repeatability, but they do show that ICON''s systems have worked across humanitarian, custom, subdivision, space-analog, and military contexts.'
