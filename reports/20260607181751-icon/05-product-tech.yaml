- id: TE004
  title: Trust / Quality / Compliance Table
  description: Publicly visible quality controls and where disclosure remains incomplete.
  columns:
  - Control / certification / quality metric
  - Status
  - Scope
  - Gap
  rows:
  - - ICC-ES ESR-4652 wall-system evaluation
    - Publicly available
    - ICON 3D-printed concrete wall systems
    - Applies to wall systems, not every full-building operational variable
  - - IBC / IRC compliance coverage
    - Explicitly listed in ESR-4652
    - 2024, 2021, and 2018 code cycles for structural, physical, and durability evaluation
    - Does not by itself prove local inspector throughput or universal jurisdictional acceptance
  - - Qualified printer and materials list
    - Explicitly listed in ESR-4652
    - Vulcan Printer Model 2.5 series with Lavacrete 4.0/5.0/6.0/7.0 and CarbonX naming
    - Public pack does not provide a broad third-party comparison against peer material systems
  - - 28-day compressive strength threshold
    - Explicitly listed in ESR-4652
    - Average 2,500 psi or higher after placement at the jobsite
    - The pack does not publish broad field variance or failure-rate data
  - - DoD UFC-compliant printed barracks
    - Publicly stated by Army sources
    - Fort Bliss barracks under updated Unified Facilities Criteria for additive facilities
    - Military success does not automatically remove commercial permitting friction
  - - Training, maintenance, and warranty support
    - Publicly described on Titan page
    - Two-week training, on-site support, scheduled service, and 3-year warranty
    - No public SLA-style response metrics or uptime disclosures were found for the software-enabled support model
  notes: Quality evidence is meaningful but still narrower than a full industrial reliability dossier.
