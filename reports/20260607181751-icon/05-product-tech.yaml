- id: TE002
  title: Workflow / Use-Case Table
  description: How ICON technology maps to concrete deployment jobs rather than abstract printer capability.
  columns:
  - User job
  - Current workflow / setting
  - ICON solution
  - Measurable benefit
  - Limitation
  rows:
  - - Deliver permanent supportive housing
    - Mission-driven housing development at Community First! Village
    - Vulcan-based repetitive structure printing over multiple years
    - 117 listed structures create repeat-deployment evidence
    - Public pack does not disclose finished unit economics or maintenance outcomes by structure type
  - - Build a design-forward custom residence
    - Architect-led premium home with high design expectations
    - House Zero uses ICON wall systems while preserving custom architecture
    - Shows that additive construction can support premium design, not just austere shelters
    - One showcase home does not prove broad repeatability for custom projects
  - - Scale a subdivision
    - Production-style neighborhood delivery at Wolf Ranch
    - Vulcan-based printing for 100 homes with multiple floor plans and elevations
    - Best public proof that ICON can operate inside mainstream homebuilding cadence
    - All-in cost, sales velocity, and builder margin are still not disclosed publicly
  - - Construct a Mars analog or lunar-relevant habitat
    - NASA CHAPEA and Artemis-adjacent R&D
    - Next-gen Vulcan and Olympus-linked development for Mars Dune Alpha and lunar infrastructure
    - Demonstrates technical portability beyond Earth-bound housing
    - Space-adjacent success does not automatically translate to terrestrial margin or throughput
  - - Provide resilient military housing
    - Bastrop / Camp Swift training barracks and Fort Bliss barracks
    - Printed barracks with Army, TMD, USACE, and DoD stakeholders
    - Government users validate durability, standards integration, and project scale
    - Government work may be procurement-heavy and not representative of civilian deployment economics
  - - Equip third-party builders directly
    - Builder rollout under Titan and Phoenix commercialization thesis
    - Integrated printer + software + training + service package
    - Could reduce ICON labor intensity if external operators adopt the system
    - Public evidence is still too early to know whether platform sales will dominate over ICON-led execution
  notes: Workflow rows emphasize what the technology is actually being asked to do in the field.
