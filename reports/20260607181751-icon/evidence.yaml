evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: snapshot-kpi-table
    missingEvidence: Run-rate revenue, current customer-account count, and exact employee headcount as of 2026-06-07.
    whyItMatters: These are canonical underwriting metrics for efficiency, valuation, and scale but remain publicly unsupported.
    diligencePath: >-
      Request monthly revenue, booked backlog, active customer/account definitions, and current employee census from
      management.
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: A complete current board roster, committee structure, and broader named executive team.
    whyItMatters: >-
      Without the full governance bench it is difficult to judge key-person dependence, oversight quality, and
      succession planning.
    diligencePath: Request board list, governance documents, executive org chart, and board-observer rights summary.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: Current cap table, exact ownership percentages, liquidation preferences, and board-right allocations.
    whyItMatters: Stakeholder influence and dilution economics cannot be fully underwritten from public sources alone.
    diligencePath: Request the latest capitalization table, financing documents, and investor-rights agreement.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: milestone-table
    missingEvidence: >-
      Direct fetched source pages for East 17th residences, Chicon house, and a canonical first-home newsroom post were
      not in the supplied source pack.
    whyItMatters: Those pages could sharpen chronology completeness and project continuity across early Austin deployments.
    diligencePath: Fetch the missing official project/newsroom URLs and add dated claims if they materially change the chronology.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: defense-demand
    missingEvidence: >-
      A current military construction or military housing budget document tying present appropriations to additive or
      automated construction demand.
    whyItMatters: >-
      Defense is strategically relevant to ICON, but without a current budget anchor this chapter cannot size that
      segment credibly.
    diligencePath: >-
      Fetch FY2026/FY2027 military construction budget justifications, Army or DoD housing program documents, and any
      public procurement notices specific to additive construction.
    relatedQuestionRefs:
      - QM021
  - type: access-blocked
    severity: material
    topic: construction-activity
    missingEvidence: Run-date official construction-spending and housing-start tables or API extracts rather than landing pages.
    whyItMatters: >-
      Precise activity data would improve the bridge from broad housing need to current construction throughput and
      timing.
    diligencePath: >-
      Pull the specific Census release tables or API series behind construction spending and new residential
      construction for the months nearest 2026-06-07.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
