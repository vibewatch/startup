callouts:
- calloutType: strength
  title: Direct competition is real, not hypothetical
  body: COBOD’s installed-base claims and recent multifamily proof show ICON is not operating in an empty field. The underwriting
    question is therefore not whether direct rivals exist, but whether ICON wins often enough against them on deployment speed,
    economics, and builder trust.
  claimRefs:
  - CP002
  - CP003
  - CP006
  - CP008
- calloutType: risk
  title: Substitutes may matter as much as direct printer rivals
  body: Harbinger, Clayton, and the broader modular ecosystem compete for the same housing-throughput budget with more mature
    factory and financing narratives. ICON can lose the buyer problem even when it beats another printer company.
  claimRefs:
  - CP026
  - CP027
  - CP028
  - CP029
