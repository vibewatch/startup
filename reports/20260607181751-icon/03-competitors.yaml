  - - XtreeE
    - International equipment provider
    - Equipped companies and research centers across multiple regions
    - Industrial partners, research centers, bespoke construction workflows
    - Multi-material modular robotics and end-to-end software stack
    - End-customer production scale is less visible than platform footprint
  - - CyBe
    - International systems-and-materials provider
    - Claims 10+ years of building automation experience
    - Builders seeking integrated hardware, software, and materials
