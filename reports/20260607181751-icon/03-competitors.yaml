  - - Contour Crafting
    - Stale legacy direct-peer reference
    - Prepared homepage and newsroom URLs unreadable on run date
    - Historically cited construction-printing audiences
    - Brand still recognized by investors as an early category pioneer
    - Current live project and product proof is unavailable in this pack
