  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-universe
    missingEvidence: An exhaustive current installed-base and active-project census across the full global 3D construction
      printing vendor set.
    whyItMatters: The landscape table is intentionally weighted toward the peers and substitutes most relevant to ICON, but
      investors should know that the global long tail is broader than the selected rows.
    diligencePath: Compile a fuller census from current market databases, vendor announcements, and dated project disclosures,
      then separate live deployments from historical or inactive names.
    relatedTableRefs:
    - TP001
  - type: access-blocked
    severity: material
    topic: mighty-current-status
    missingEvidence: A direct readable source confirming whether Mighty Buildings shut down, sold assets, or merely pivoted
      from house printing toward wall systems.
    whyItMatters: That distinction determines whether Mighty is still a live operating rival, an adjacent technology licensor,
      or mostly a historical signal of category stress.
    diligencePath: Fetch archived or alternative coverage, court or restructuring records, and any current company statement
      clarifying the post-2023 operating outcome.
    relatedQuestionRefs:
    - QP015
  - type: private-evidence-only
    severity: material
    topic: clayton-scale
    missingEvidence: Direct public operating data from Clayton on current unit volume, factory count, or modular-specific
      output relevant to this chapter.
    whyItMatters: Clayton clearly represents substitute pressure, but this pack does not let the chapter size that pressure
      with the same precision used for direct printer peers.
    diligencePath: Pull parent-company filings, Clayton corporate materials, or credible industry coverage with dated unit,
      factory, and channel metrics.
    relatedQuestionRefs:
    - QP020
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Comparable current pricing or realized contract terms for ICON, COBOD, Apis, Mighty, Harbinger, and Clayton
      substitute economics.
    whyItMatters: Without comparable pricing or realized project economics, the pricing table is directional and cannot by
      itself support a strong margin or affordability conclusion.
    diligencePath: Request quotes, procurement awards, customer contracts, or management commentary on system ASP, materials
      attach, and turnkey project pricing.
    relatedTableRefs:
    - TP003
