- id: weakened-or-stale-rivals
  title: Weakened or stale rivals should stay in the chapter, but not at full weight
  body: The evidence around Mighty Buildings and Contour Crafting is exactly where this chapter should resist smoothing over
    ambiguity. Mighty still appears in market maps, but the current accessible company surface in this pack is centered on
    the Mighty Wall System, a factory-made wall product, not on a richly documented pipeline of new on-site printer deployments.
    That does not prove exit, but it does argue against treating Mighty as a clear frontline direct benchmark without additional
    diligence. Contour Crafting looks even staler from the current pack. The prepared homepage and newsroom URLs did not yield
    readable content on run date, so there is no fresh official proof here of active projects, customers, or current product
    posture. Both companies belong in the competitor chapter because investors will still hear the names, but they should
    be weighted as adverse evidence on category churn and proof gaps rather than as clean, live comparables to ICON’s present
    thesis.
  claimRefs:
  - CP015
  - CP016
  - CP017
  - CP018
  - CP019
  - CP036
- id: modular-and-manufactured-substitutes
  title: Modular and manufactured substitutes can capture the same buyer budget
  body: 'The substitute side may be at least as important as the direct-printer side. Harbinger, reached from the prepared
    Factory_OS URLs, frames its model around industrializing multifamily delivery inside a manufacturing facility and integrating
    development, design, manufacturing, and construction. That is a direct attack on the same predictability and labor problem
    ICON is trying to solve, but without requiring a buyer to adopt site-based concrete printing. McKinsey strengthens the
    substitute case by showing modular is already a broad global category with more than 700 companies across 50-plus countries,
    and Urban Land adds the practical buyer pitch: modular can save six to eight weeks on a two-year project while improving
    predictability and factory quality. Clayton broadens the threat further as a major manufactured or modular housing brand,
    even though the direct page in this pack is light on operating detail. The key implication is that ICON is competing for
    productivity budgets, not for an isolated “3D printing” line item.'
