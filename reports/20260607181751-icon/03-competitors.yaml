- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence-backed rationale
  - Mitigation / diligence ask
  rows:
  - - Direct 3D-printing leadership
    - COBOD deployment scale
    - High
    - COBOD has the clearest current installed-base and multifamily proof in the supplied pack.
    - Request ICON win-loss data versus COBOD by project type and geography
  - - Novel construction method advantage
    - Modular and factory-built substitutes
    - High
    - Modular competitors solve the same schedule and affordability problem with a more mature financing and factory narrative.
    - Quantify how often ICON wins against modular versus against other printers
  - - Regulatory and engineering know-how
    - Peers can also shape code pathways
    - Medium
    - Apis Cor’s code-testing history shows standards work is not unique to ICON.
    - Request current code approvals, engineering partners, and exclusivity where any exist
  - - Workflow stickiness
    - Material and process switching remains possible
    - Medium
    - Lock-in appears to come from qualification and training more than from a software-style network effect.
    - Measure retraining cost, material requalification time, and site-ops changeover burden
  - - Category mindshare
    - Historic names can distort weighting
    - Medium
    - Mighty and Contour still surface in competitor talk tracks even though current proof is thin or stale.
    - Keep competitor weighting tied to fresh proof, not historical brand awareness
  - - Opaque economics
    - Private pricing and backlog hide true pressure
    - Medium
    - Most peers do not disclose public list pricing or realized unit economics.
    - Request comparable quotes, backlog, and repeat-customer data before underwriting durable margin advantage
  notes: Severity ratings are qualitative underwriting judgments based on the evidence pack as of 2026-06-07, not numerical
    market-share forecasts.
