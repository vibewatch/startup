  - CM002
  - CM004
  - CM029
  - CM030
  - CM031
  - CM042
- calloutType: risk
  title: Code cycle and substitute methods can slow commercial scale-up
  body: NIST and ICC activity shows progress, but the standards stack is still catching up. At the same time, modular and other automation-heavy approaches can solve similar builder pain without requiring printed-concrete permitting, which may limit how fast ICON converts broad need into spend.
  claimRefs:
  - CM032
  - CM034
  - CM035
  - CM036
  - CM037
  - CM038
