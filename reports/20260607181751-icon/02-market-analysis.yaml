- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Housing undersupply and affordable-rental shortage
    - Growth driver
    - Current / structural
    - Millions of missing or unaffordable units keep pressure on faster and cheaper delivery methods
    - Ask which subsegments can actually pay for a new build method versus only expressing need
  - - Labor tightness and weak productivity
    - Growth driver
    - Current / structural
    - Builders have incentive to test automation when labor is scarce and output gains are weak
    - Request ICON project-level labor savings and throughput data
  - - Government funding for printed affordable housing
    - Growth driver
    - Current / medium term
    - Public or mission-driven programs can sponsor pilots before purely private buyers do
    - Separate grant-backed pilots from self-sustaining commercial demand
  - - Resilience and disaster-recovery use cases
    - Growth driver
    - Current / medium term
    - Printed concrete is positioned around stronger and faster rebuilding in difficult environments
    - Verify whether resilience buyers repeat orders after first pilots
  - - Code and permitting lag
    - Constraint
    - Current / structural
    - Commercialization requires standards, testing, and local engineering sign-off
    - Map approval time, engineering exceptions, and who bears permitting risk
  - - Standards still catching up
    - Constraint
    - Current / structural
    - NIST and ICC activity shows progress, but the market is not yet normalized
    - Verify which jurisdictions or certifiers already accept the workflow
  - - Substitute paths such as modular and off-site
    - Constraint
    - Current / emerging
    - Buyers can solve the same labor or schedule problem without adopting 3D concrete printing
    - Benchmark ICON against modular or panelized economics, not only against stick-built
  - - Weak public SOM visibility
    - Constraint
    - Current
    - External data does not reveal ICON installed base, backlog, or repeat-order rates
    - Request installed systems, utilization, backlog, pricing, and repeat-customer data
  notes: 'The key issue is timing: the problem budget is large, but adoption still depends on code cycle, procurement path, and proof that ICON beats substitute methods.'
