- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to ICON
  rows:
  - - Core additive low-rise construction
    - Printer or robotic system, printable materials, engineering support, QA, operator training, deployment services
    - Land, financing, entitlement, finishes, MEP, most general contracting scope
    - Production builder, developer, or GC using project capital and operations budgets
    - Closest fit to ICON's Titan/Phoenix style commercialization thesis
  - - Affordable-housing delivery
    - System-enabled shell delivery for repetitive homes or small structures where affordability targets matter
    - Broad housing subsidy pool not tied to construction method
    - Housing nonprofit, public sponsor, grant-backed delivery team
    - High relevance because public affordability need is large and printed construction is marketed as cost-saving
  - - Resilience / disaster-recovery housing
    - Rapid deployment, resilient wall systems, automation for difficult labor environments
    - General emergency aid unrelated to physical reconstruction method
    - State or local recovery bodies, philanthropy, resilience programs
    - Relevant because pilots emphasize faster, stronger, lower-maintenance structures
  - - Government / public works structures
    - Procurement for barracks, civic structures, or public facilities that can use repetitive concrete-wall workflows
    - Entire defense or public-works budget outside automation-enabled construction
    - Agency procurement office or public authority
    - Strategically important for ICON but not directly sizeable from this source pack
  - - Broad homebuilding problem space
    - Housing need, affordable-rental shortage, construction throughput constraints
    - Not a direct printer TAM
    - Households, renters, cities, builders, policymakers
    - Sets the demand backdrop but overstates what ICON can monetize near term
  - - Status-quo substitutes and adjacencies
    - Conventional site-built, panelized, modular, and other automation-heavy workflows solving cost or schedule
    - N/A
    - Same buyers as above
    - These alternatives compete for the same productivity and delivery budget
  notes: Rows separate the broad housing problem from the narrower spend directly relevant to automated additive construction and its substitutes.
