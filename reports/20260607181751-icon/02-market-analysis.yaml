  evidenceGaps:
  - type: missing-source
    severity: material
    topic: defense-demand
    missingEvidence: A current military construction or military housing budget document tying present appropriations to additive or automated construction demand.
    whyItMatters: Defense is strategically relevant to ICON, but without a current budget anchor this chapter cannot size that segment credibly.
    diligencePath: Fetch FY2026/FY2027 military construction budget justifications, Army or DoD housing program documents, and any public procurement notices specific to additive construction.
    relatedQuestionRefs:
    - QM021
  - type: access-blocked
    severity: material
    topic: construction-activity
    missingEvidence: Run-date official construction-spending and housing-start tables or API extracts rather than landing pages.
    whyItMatters: Precise activity data would improve the bridge from broad housing need to current construction throughput and timing.
    diligencePath: Pull the specific Census release tables or API series behind construction spending and new residential construction for the months nearest 2026-06-07.
    relatedQuestionRefs:
    - QM022
  - type: private-evidence-only
    severity: material
    topic: icon-som
    missingEvidence: ICON installed-base counts, system pricing, backlog, customer concentration, and repeat-order data.
    whyItMatters: Without commercial operating data, any public SOM estimate risks overstating current adoption and monetization.
    diligencePath: Request pipeline, backlog, utilization, pricing, and repeat-customer metrics in diligence or data room materials.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: material
    topic: 3d-market-sizing
    missingEvidence: Comparable market definitions and bottom-up vendor revenue builds behind the conflicting analyst TAM estimates.
    whyItMatters: The difference between cited 2026 market estimates is wide enough to alter valuation narratives and capital-allocation assumptions.
    diligencePath: Request analyst methodology notes or reconstruct a bottoms-up market model from disclosed vendor revenue, printer deployments, and recurring materials/software spend.
    relatedQuestionRefs:
    - QM008
    relatedTableRefs:
    - TM002
