- id: TM002
  title: TAM/SAM/SOM or sizing lens table
  columns:
  - Publisher / lens
  - Year
  - Geography
  - Value
  - CAGR / growth signal
  - Methodology
  - Confidence
  - Key limitation
  rows:
  - - Freddie Mac housing shortage lens
    - 2026 publication
    - United States
    - 3.7 million missing units
    - Structural shortage still measured in millions
    - Housing stock versus household formation and latent demand
    - high
    - Problem-size lens, not printer revenue
  - - NAHB vacancy-restoration lens
    - 2026 publication / 2024 base
    - U.S. metro markets
    - 1.2 million additional units needed
    - Baseline adjustment could occur between 2026 and 2030
    - Vacancy-rate normalization analysis
    - medium
    - Covers metro vacancy gap, not total national market
  - - NLIHC affordable-rental lens
    - '2026'
    - United States
    - 7.2 million affordable and available rental homes short
    - Only 35 homes per 100 extremely low-income renters
    - Affordable-availability gap for ELI renter households
    - high
    - Measures social need, not addressable revenue
  - - St. Louis Fed permit-capacity lens
    - 2026 publication / 2024 data
    - United States
    - 4.3 permits per 1,000 people
    - 35% below 1960-2000 average
    - Per-capita permit analysis
    - high
    - Capacity lens, not market spend
  - - Mordor 3D printing construction market
    - '2026'
    - Global
    - USD 3.34B in 2026; USD 15.29B in 2031
    - 35.60% CAGR (2026-2031)
    - Top-down analyst market sizing with regional splits
    - medium
    - Definition of market boundary is narrower than broad construction automation
  - - Fortune 3D construction printer market
    - '2026'
    - Global
    - USD 5.35B in 2026; USD 666.69B in 2034
    - 82.81% CAGR to 2034
    - Top-down analyst market sizing focused on printer category
    - low
    - Very aggressive forecast and not reconcilable with the Mordor base case
  - - BLS labor-capacity lens
    - '2026'
    - United States
    - 8.337M employees; 270k job openings
    - Current labor tightness
    - Official labor market snapshot for construction sector
    - high
    - Shows capacity pressure, not direct spend or units
  notes: This table intentionally mixes demand, capacity, and technology-market lenses because no single public dataset provides a defensible ICON TAM/SAM/SOM stack.
