    whyItMatters: >-
      Third-party market datasets remain sparse, making competitor and adoption comparisons noisier than in mature
      automation categories.
    diligencePath: Supplement open-web research with paid industry trackers or channel checks.
    relatedQuestionRefs:
      - QM009
      - QM017
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: Dogotix price-performance gap
    missingEvidence: >-
      Dogotix list pricing, deployment bundle, service model, and real-world cost-performance case studies versus major
      peers.
    whyItMatters: >-
      Without public price-performance evidence, Dogotix is harder to compare credibly against lower-priced Chinese
      rivals or service-led U.S. peers.
    diligencePath: Request pricing architecture, pilot economics, and unit cost targets from management.
    relatedQuestionRefs:
