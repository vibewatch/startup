evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: standalone-governance
    missingEvidence: >-
      Dogotix board composition, delegated management roster, investor board rights, and post-closing governance
      package.
    whyItMatters: >-
      Governance concentration is material because Dogotix is already valued in the multi-billion-dollar range and
      minority investors are relying on contractual protections.
    diligencePath: Request the shareholders agreement, board roster, reserved-matters schedule, and post-closing organization chart.
    relatedQuestionRefs:
      - QO006
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Verified standalone headcount for Dogotix and functional split across R&D, manufacturing, and commercial roles.
    whyItMatters: >-
      Headcount is a core maturity and operating-capacity indicator, especially for a robotics company targeting mass
      production within months.
    diligencePath: Obtain HR census, hiring plan, and org chart from management.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: blocking
    topic: commercial-orders
    missingEvidence: Signed customer orders, backlog, customer count, and unit deployment status outside XPeng-controlled venues.
    whyItMatters: >-
      A $6.3 billion implied valuation is hard to underwrite without independent evidence of demand beyond internal
      pilots and staged rollouts.
    diligencePath: Request contracted backlog, pipeline by customer, deployment references, and realized pricing data.
    relatedQuestionRefs:
      - QO022
      - QO026
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Standalone revenue, margin, capex, and cash-use metrics for Dogotix operations.
    whyItMatters: >-
      The filings disclose losses and liabilities but not enough detail to judge whether commercialization can close the
      gap to break-even.
    diligencePath: Review management accounts, budget, factory ramp plan, and financing model used for the round.
    relatedQuestionRefs:
      - QO013
      - QO024
    relatedTableRefs: []
  - type: private-evidence-only
    severity: material
    topic: Dogotix SOM
    missingEvidence: >-
      Segment-level pipeline, pilot count, realized pricing, service attach, and customer conversion data for Dogotix
      external commercialization.
    whyItMatters: >-
      Without actual conversion and pricing data, the difference between visionary TAM and reachable SOM remains too
      wide for precise underwriting.
    diligencePath: Request pipeline by segment, pilot-to-order conversion, pricing schedule, and 2027 deployment plan.
    relatedQuestionRefs:
      - QM022
      - QM023
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: humanoid market estimates
    missingEvidence: >-
      A reconciled explanation for why published 2035 humanoid market estimates range from single-digit billions to more
      than $150 billion.
    whyItMatters: Scenario dispersion materially affects how much value can be assigned to Dogotix for future growth optionality.
    diligencePath: >-
      Normalize publisher methodologies by included layers, geography, and time horizon before using them in investment
      materials.
    relatedQuestionRefs:
      - QM019
      - QM024
      - QM026
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer economics
    missingEvidence: >-
      Segment-specific ROI thresholds, procurement owners, deployment support costs, and service model details for
      retail, campus, and industrial buyers.
    whyItMatters: >-
      Adoption will stall if Dogotix cannot prove a repeatable economic win against labor or narrower automation
      alternatives.
    diligencePath: Obtain pilot KPI dashboards and buyer interviews across each target vertical.
    relatedQuestionRefs:
      - QM013
      - QM014
      - QM025
    relatedTableRefs:
      - TM003
      - TM004
