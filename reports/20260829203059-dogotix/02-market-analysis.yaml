- id: reachable-som-and-diligence-gaps
  title: Reachable SOM and Diligence Gaps
  body: 'A useful Dogotix market view therefore needs three layers. The outer layer is the headline humanoid TAM supplied by bullish research houses and sell-side strategists. The middle layer is a nearer-term SAM built around structured enterprise workflows in manufacturing-adjacent campuses, logistics, inspection, security, and customer-facing service. The innermost layer is Dogotix''s realistic SOM over the next one to three years, which is likely limited to XPeng-controlled venues plus a small set of external lighthouse accounts willing to pilot a still-maturing platform. Public evidence is not yet detailed enough to quantify that SOM with high confidence, because Dogotix has not disclosed realized pricing, segment conversion rates, service attach, or customer concentration. Even so, the buyer map suggests a rational path: use captive parent-company environments to collect data and de-risk reliability, then expand into enterprise segments where brownfield fit and labor economics are
    most favorable. If Dogotix attempts to leap directly from showcase demos to broad multi-vertical deployment, the market looks bigger than it really is; if it sequences entry through high-friction but structured enterprise tasks, the opportunity is smaller near term but more credible.'
