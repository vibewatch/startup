- id: adoption-drivers-and-constraints
  title: Adoption Drivers and Binding Constraints
  body: 'The demand drivers behind humanoid adoption are real. IFR and Bain both emphasize labor shortages, demographic aging, productivity pressure, and the appeal of automation in dirty, dull, dangerous, and difficult tasks. MarketsandMarkets, Precedence, and Morgan Stanley add that advances in AI, mobility, vision, actuators, batteries, and foundation models are improving the addressable task set. For Dogotix specifically, XPeng argues that automotive-grade manufacturing, on-device AI chips, and large-scale data loops create an unusually strong commercialization platform. Yet the constraints are just as important. Bain says leaders should experiment now but not yet deploy significant capital; Morgan Stanley notes that home adoption requires another decade of progress and major price declines; Goldman explicitly ties the upper-end TAM to overcoming hurdles in product design, use case, affordability, and public acceptance. Dogotix also faces its own constraints: no public customer backlog,
    limited field-proof data, geopolitical restrictions on Chinese robots, and unresolved security or privacy concerns that matter more for close-proximity human interaction than for fenced-off industrial automation. The market is promising precisely because it is not yet settled.'
