- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Labor shortages and aging populations
    - Positive
    - Now through 2030s
    - Supports enterprise willingness to test physical automation
    - Which target segments face the sharpest labor pain?
  - - Brownfield fit of humanoids in human-built spaces
    - Positive
    - Near term
    - Reduces retrofit capex versus purpose-built automation
    - Can IRON perform safely in uncontrolled real-world environments?
  - - AI, dexterity, and model improvements
    - Positive
    - Near to medium term
    - Expands task range and learning speed
    - How much autonomy is on-device versus teleoperation?
  - - High capex and unclear ROI
    - Negative
    - Near term
    - Slows scaled purchasing outside pilots
    - What is realized payback versus human labor or AMRs?
  - - Safety, privacy, and social acceptance
    - Negative
    - Near to medium term
    - Can block close-proximity deployments in stores and public venues
    - What certifications, incident rates, and privacy controls exist?
  - - Geopolitical controls on Chinese robots
    - Negative
    - Current
    - Limits export TAM and raises compliance costs
    - Which markets remain open for 2027 overseas rollout?
  - - Lack of public customer backlog
    - Negative
    - Current
    - Makes top-down TAM look more accessible than it is
    - How many paid pilots or signed orders exist by segment?
  notes: Market drivers are real, but each one has a matching commercialization constraint. The market should be evaluated as a paced adoption curve rather than a straight-line TAM capture story.
