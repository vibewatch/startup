- id: sizing-lenses-and-market-dispersion
  title: Sizing Lenses and Why TAM Headlines Mislead
  body: Public market-size estimates for humanoid robotics are directionally bullish but numerically inconsistent. Goldman Sachs offers a cautious base case of at least $6 billion in 10 to 15 years and a blue-sky scenario of up to $154 billion by 2035 if design, use-case, affordability, and public-acceptance barriers are solved. Precedence Research estimates a 2026 market of about $2.16 billion growing to $8.78 billion by 2035, while MarketsandMarkets models a much larger 2026 base of $5.41 billion and a $50.27 billion 2035 outcome. Morgan Stanley is even more expansive, sketching a $5 trillion 2050 scenario with roughly one billion humanoids globally and most units used for repetitive industrial and commercial work. These are not just different numbers; they are different conceptual frames. Some are near-term commercialization forecasts, some are long-range technology adoption scenarios, and some blur hardware, software, and services. The right read-through for Dogotix is that the outer
    bound is very large, but the credible 2027-2030 serviceable market is much smaller and concentrated in enterprises willing to fund pilots, tolerate iteration, and extract value from brownfield deployment.
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM014
