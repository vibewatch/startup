- id: capital-adequacy-and-financing-dependency
  title: Capital Adequacy and Financing Dependency
  body: |
    On pure liquidity, Dogotix looks strong. The business has secured more than $900 million of immediate commitments and may add another $15 million from an additional investor plus up to $500 million of executive-warrant exercises later. XPeng remains controlling shareholder and still had RMB40.48 billion of cash, restricted cash, investments, and deposits at June 30, 2026. That means Dogotix does not face the same immediate capital-access risk as a thinner startup. But financing dependency has not disappeared; it has only been pushed outward. The robotics business remains loss-making, mass production still lies ahead, and the capital uses listed in the filing—R&D, training, data, facilities, commercialization, and working capital—are exactly the categories that absorb cash before revenue matures. Investors also received redemption rights tied to a qualified IPO within seven years, which effectively sets a long-dated but real financing milestone. Dogotix therefore has ample runway for the next stage of build-out, but it is still being financed into proof rather than harvesting already proven economics.
  claimRefs:
  - CI029
  - CI030
  - CI031
  - CI032
  - CI033
  - CI034
  - CI035
  - CI036
