- id: gtm-and-sales-efficiency-proxies
  title: GTM Motion and Sales-Efficiency Proxies
  body: |
    Dogotix's near-term GTM motion appears far more controlled than broad-based. Public reporting consistently says the first deployments are planned for XPeng stores and campuses before wider commercial deliveries in 2027. That matters financially because an internal proving ground can reduce early customer-acquisition friction, compress implementation cycles, and generate data without immediately depending on third-party procurement. But it also weakens external read-through on sales efficiency. There is no public CAC, payback, conversion rate, pipeline coverage, or lighthouse-account disclosure. The best proxy is that XPeng already operates a nationwide retail and service footprint and is explicitly using those venues to validate IRON before wider commercialization. In other words, Dogotix may have an unusually cheap first channel because the parent subsidizes access, yet that does not prove repeatable sales efficiency in independent enterprise markets. Underwriting should separate internal incubation economics from true external customer acquisition.
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  tableRefs: []
  figureRefs: []
- id: cost-structure-and-unit-economics
  title: Cost Structure, Capex, and Unit Economics
  body: |
    Dogotix's cost stack is visible mostly by implication. XPeng's August announcement says financing proceeds will be used for hardware and software R&D, physical-AI model training, high-quality data collection, full-chain mass-production-base construction, and global commercialization. That implies a cost structure spanning specialized components, compute, model training infrastructure, factory build-out, quality systems, and field support. Product disclosures add additional clues. IRON uses three in-house Turing chips, high-degree-of-freedom hands, and anthropomorphic hardware, all of which likely create an expensive initial bill of materials before scale learning lowers cost. At the same time, XPeng argues that its automotive-grade supply chain and manufacturing capabilities should improve yield and cost discipline relative to startup-only peers. Public evidence does not yet support a bottom-up unit-economics model, but it does support directional conclusions: Dogotix is capital intensive, benefits from parent-company manufacturing leverage, and will require much higher shipment volume before gross margin quality can be judged. The absence of disclosed list price or realized pricing is the single biggest hole in the current financial underwriting picture.
  claimRefs:
  - CI014
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
