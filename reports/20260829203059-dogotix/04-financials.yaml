company:
  name: Dogotix
chapter:
  number: 4
  title: Financials
  summary: Dogotix is one of the best-capitalized humanoid programs in China, but the public record still describes a financially pre-proof business. The filing package discloses $900 million of immediate equity financing, widening robotics losses, and net liabilities, while leaving revenue, pricing, customer concentration, and unit economics largely opaque; that makes capital adequacy easier to support than revenue quality.
sections:
- id: revenue-model-and-monetization
  title: Revenue Model and Monetization Logic
  body: |
    Public evidence does not yet show Dogotix as a mature revenue business; it shows a financing story that presumes future hardware, software, and service monetization. XPeng's public comments and independent coverage imply three revenue layers. First is hardware revenue from IRON and other robot platforms. Second is a software or upgrade layer. CnEVPost reports management saying hardware sales plus software-upgrade revenue could make each robot's lifetime gross profit contribution materially higher than the automotive business. Third is deployment, support, and commercialization work attached to enterprise rollout, although those services are not separately broken out in current public disclosures. What is still missing is the most important revenue-quality evidence: price cards, contract structure, warranty terms, service attach, recognition policy, and segment mix. Unlike a pure software company, Dogotix must absorb heavy hardware cost and support burden before recurring economics become visible. Investors should therefore treat the revenue model as plausible but not yet evidenced by standalone disclosed revenue, backlog, ARR, or customer-usage disclosures.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  tableRefs:
  - TI001
  - TI002
  figureRefs:
