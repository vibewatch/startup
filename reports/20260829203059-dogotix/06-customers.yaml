company:
  name: Dogotix
chapter:
  number: 6
  title: Customers
  summary: Dogotix's customer story is strategically interesting but still commercially thin. The clearest public evidence points to XPeng itself as the first buyer, user, and proving ground across stores, campuses, and factory environments, while named third-party customers, retention metrics, and production-scale customer references remain undisclosed. That makes adoption logic plausible but customer durability, concentration, and repeatability unresolved.
sections:
- id: customer-segmentation-and-wedge
  title: Customer Base Segmentation and the Initial Wedge
  body: |
    Dogotix's early customer map is easiest to understand by separating the initial captive user from later external customers. The first buyer, payer, and operational design partner appears to be XPeng itself. Public reporting says IRON will first be deployed inside XPeng stores, campuses, and related controlled environments, with factory and assembly-line testing also reported during 2026. That makes the first customer segment an internal one: XPeng retail operations, XPeng campus operations, and XPeng manufacturing or service environments. Beyond that, the likely external customer segments are retail operators, logistics environments, inspection or security operators, and enterprise campuses that benefit from human-form-factor automation in brownfield spaces. In other words, Dogotix's initial wedge is not a broad horizontal robot launch. It is an internal-to-external adoption ladder where XPeng subsidizes the first proof points and external customers only arrive after product, safety, and support risks are reduced. This creates a rational commercialization sequence, but it also means public customer evidence today is more about the plausibility of adoption than about already proven external demand.
  claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007]
  tableRefs: [TU001]
  figureRefs: [FU001]
- id: named-customer-proof
  title: Named Customer Proof Is Mostly Internal
  body: |
    The most important fact about Dogotix customer proof is that it is named but mostly internal. Public sources repeatedly point to XPeng stores, showrooms, campuses, and factory lines as the first environments where IRON will operate or is already being tested. Those are valuable proof surfaces because they provide real workflows, human interaction, and operational data. However, they do not provide the same commercialization evidence as third-party customers signing production contracts. No reviewed source named an external commercial customer, a government procurement award, or a third-party enterprise deployment already in production as of the report date. The strongest interpretation is therefore cautious but not dismissive. Dogotix has clearer named deployment surfaces than many concept-stage robot companies because XPeng can name its own venues and operations. Yet the market still lacks independent customer references, contract evidence, multi-site rollouts, or public ROI statements from non-XPeng operators. Internal proof is useful, but it is not the same as product-market proof.
  claimRefs: [CU008, CU009, CU010, CU011, CU012, CU013, CU014, CU015]
  tableRefs: [TU003]
  figureRefs: [FU003]
- id: adoption-trajectory-and-funnel
  title: Adoption Trajectory and Deployment Funnel
  body: |
    Dogotix's adoption trajectory appears to run through a staged deployment funnel rather than a wide-open go-to-market motion. The sequence supported by public reporting is: internal testing and pilot production in Guangzhou, use in XPeng factories or assembly-related environments, rollout into XPeng showrooms or stores for customer-facing tasks, and only later broader commercialization in China and overseas. That sequence makes economic and product sense because customer-facing robots need real-world exposure before large external accounts will trust them. The problem is that the public funnel lacks denominators. Dogotix has not disclosed how many pilot sites are active, how many robots are in testing, what fraction of pilots convert to production use, or how many external prospects are in evaluation. Investors therefore need to distinguish between a well-structured customer journey and a measured adoption curve. The first exists in public evidence; the second does not. The current public record is enough to support a credible deployment narrative, but not enough to quantify market pull.
  claimRefs: [CU016, CU017, CU018, CU019, CU020, CU021, CU022]
  tableRefs: [TU002]
  figureRefs: [FU002]
- id: retention-and-durability-signals
  title: Retention, Repeat Usage, and Durability Signals
  body: |
    Dogotix has almost no direct public retention evidence because the business is still pre-scale. No public source disclosed contract length, renewal rate, NRR, GRR, repeat-purchase behavior, or CSAT. The best durability signals are structural rather than numeric. First, XPeng-controlled deployments imply a lower risk of abrupt early churn while the product is still being refined. Second, a robot platform that becomes embedded in store operations, campus workflows, or factory processes could create meaningful switching costs through operator training, data loops, and integration effort. Third, the absence of external customer disclosures means investors cannot tell whether the company is hiding early failures or simply has not reached that stage yet. The correct diligence posture is to treat retention as unproven. There is a plausible path to durability if Dogotix succeeds in converting internal pilot surfaces into repeatable external workflows, but the public record does not yet show that conversion happening in measurable form.
  claimRefs: [CU023, CU024, CU025, CU026, CU027, CU028]
  tableRefs: [TU004]
  figureRefs: [FU004]
- id: expansion-and-concentration-risk
  title: Expansion Potential and Concentration Risk
  body: |
    Customer concentration risk is extreme today because the first customer surface is overwhelmingly XPeng-related. If Dogotix underperforms in XPeng stores, campuses, or factory use, its first and strongest proof engine weakens immediately. The positive side of that concentration is speed: XPeng can give Dogotix a controlled deployment network, a national retail footprint, and internal operational environments where new robots can be tested without waiting for slow outside procurement. The negative side is read-through. A company can look commercially active while still lacking third-party willingness to pay. Expansion logic exists—move from internal sites to lighthouse enterprise customers in retail, logistics, inspection, and security—but every step of that logic is still ahead of the company in public evidence. The right question is not whether Dogotix has a possible land-and-expand path. It does. The right question is whether XPeng-origin demand can turn into diversified external customer demand before valuation expectations outrun adoption reality.
  claimRefs: [CU029, CU030, CU031, CU032, CU033, CU034, CU035, CU036]
  tableRefs: [TU005]
  figureRefs: []
