  topStrengths:
    - XPeng 在制造、芯片、资本和落地场景上给 Dogotix 的优势，多数人形机器人创业公司拿不到。
    - 以当前阶段看，公司融资底座较厚，能争取时间把证据跑出来，而不是立刻陷入生存压力。
    - 产品边界不止一个人形机器人 SKU，而是延伸到更宽的具身 AI 机器人平台。
