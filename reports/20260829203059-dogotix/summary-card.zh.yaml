    - Dogotix 的定价高于若干公开商业化证据更强、估值更低的同行，安全边际很薄。
    - XPeng 在资本、渠道、治理和首批客户暴露上仍高度集中。
    - 面向共享空间部署的安全、隐私、网络安全和合规文件，在公开记录中仍过薄。
