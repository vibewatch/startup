        title: 资本充足度与融资依赖
        blocks:
          - type: paragraph
            body: >
              单看流动性，Dogotix 很强。公司已获得超过 $900 million 的即时承诺，另可能来自一名额外投资者的 $15 million，以及未来最高 $500 million 的高管认股权证行权。XPeng
              仍是控股股东，截至 2026 年 6 月 30 日仍有 RMB40.48 billion 现金、受限现金、投资和存款。这意味着 Dogotix
              不面临薄弱创业公司那种即时资本获取风险。但融资依赖并未消失，只是被推到更远处。机器人业务仍在亏损，量产尚未到来，文件列出的资金用途——研发、训练、数据、设施、商业化和营运资金——正是收入成熟前最吞现金的类别。投资者还获得了与七年内合格
              IPO 挂钩的赎回权，这实际上设定了一个时间较长但真实存在的融资里程碑。因此，Dogotix 具备支持下一阶段建设的充足跑道，但资金支撑的仍是证明阶段，而不是收割已被证明的经济性。
