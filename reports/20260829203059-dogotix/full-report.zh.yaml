      - number: '1.2'
        title: 领导层、控制权与治理
        blocks:
          - type: paragraph
            body: >-
              领导层证据在控制权上强，在完整治理上弱。较可靠的是，He Xiaopeng 仍是最终运营牵头人：他在 2026 年 6 月称会亲自兼任机器人业务 CEO，8 月融资文件又显示 He 及联席总裁 Brian Gu
              控制的实体与机构投资者一同出资。对一个被 XPeng 越来越多纳入「Physical AI」身份的业务来说，这组合意味着罕见的创始人级强背书。围绕 6 月重组的报道还称，汽车、制造、测试和通用智能职能约
              1,000 名员工被调动，并在机器人中心下设九个二级部门。仍稀薄的是 Dogotix 独立董事会构成、He
              以下的授权边界、除已披露赎回权外的少数股东保护，以及剥离运营完成后真正管理该单元的团队梯队。尽调含义直接：Dogotix
              现在吃到母公司直接关注和决策速度红利，但也背着高度集中的关键人物风险和治理不透明；在一个已按数十亿美元定价的业务上，这些风险很实质。
