      - number: '6.4'
        title: 留存、重复使用与耐久信号
        blocks:
          - type: paragraph
            body: >
              Dogotix 几乎没有直接的公开留存证据，因为业务仍处在规模化前。没有公开来源披露合同期限、续约率、净留存率（NRR）、总留存率（GRR）、复购行为或
              CSAT。最好的耐久信号是结构性的，而不是数字性的。第一，XPeng
              控制的部署意味着产品仍在打磨时，早期突然流失的风险较低。第二，一旦机器人平台嵌入门店运营、园区工作流或工厂流程，就可能通过操作员培训、数据闭环和集成投入形成有意义的切换成本。第三，缺少外部客户披露意味着投资者无法判断，公司是在隐藏早期失败，还是只是尚未走到那个阶段。正确尽调姿态是把留存视为未证明。如果
              Dogotix 能把内部试点场景转化为可重复的外部工作流，确有一条通向耐久性的路径；但公开记录尚未显示这种转化以可衡量形式发生。
