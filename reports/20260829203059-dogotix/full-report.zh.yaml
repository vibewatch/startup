  - id: TV005
    title: 击穿投资逻辑与退出触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 外部客户证据没有出现
        - 到 2027 年中仍没有具名的非 XPeng 生产客户
        - Dogotix 仍停留在项目模式，而不是经过验证的平台模式
        - 下调上行权重，并要求明显更好的入场条款
      - - 制造证据延后
        - 2026 年底目标窗口内没有产量扩大的可信证据
        - 削弱相对小型同业享受溢价估值的主要理由
        - 将估值基准下调至悲观情景
      - - 铺开过程中出现安全或隐私问题
        - 任何与部署相关的重大事故、召回或正式投诉
        - 会同时伤害客户信任和合规姿态
        - 在根因和补救方案明确前，暂停可投性判断
      - - 融资压力压过产品证据
        - 客户牵引力可见前，IPO 或赎回路径成为核心叙事
        - 说明资本结构在牵引价值创造，而不是反映价值创造
        - 大幅提高下行情景权重
      - - 地缘政治限制收紧
        - 政策或采购规则进一步收窄海外采用和退出路径
        - 支持相对美国同业更大的折价
        - 下调终值倍数假设和公开退出信心
    notes: 这些是可监控事件，会把不确定性转化为决策变化；它们不是泛泛风险。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV046
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 独立收入质量
        - 按产品、客户类型，以及关联方 / 第三方组合拆分的收入桥接
        - 区分真实市场拉力和母公司赞助式部署
        - CFO 材料包 / 董事会材料
      - - 股权结构表与下行结构
        - 清算优先权、反稀释、认股权证经济性和完整分配瀑布
        - 判断公平企业价值是否仍对应缺乏吸引力的股权
        - 融资文件法律尽调
      - - 客户真实性
        - 具名外部客户、试点到生产转化，以及复购证据
        - 商业化证据是「观察」和「投资」之间最缺的输入
        - 销售管线审阅和客户访谈
      - - 制造与可靠性
        - 产量、良率、在线率、服务负担和现场故障指标
        - 验证 2026 年底和 2027 年说法在运营上是否可信
        - 运营尽调和工厂审阅
      - - 合规与支持准备度
        - 面向共享空间部署的安全、隐私、安保和现场支持方案
        - 大客户和公开市场投资人会直接审查这些控制
        - 合规审查和客户实施文件
    notes: 最终尽调刻意收窄。Dogotix 不需要再讲十套叙事；它需要在最直接支撑估值的少数输入上拿出证据。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV045
