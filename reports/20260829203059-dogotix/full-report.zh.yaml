      - number: '3.3'
        title: 能力、定价与渠道对比
        blocks:
          - type: paragraph
            body: >-
              Dogotix 公开宣传的最强差异化，不是公布价格或披露装机量，而是 XPeng 带来的制造、芯片和内部部署场景。XPeng 声称通过三颗 Turing 芯片实现端侧推理，具备汽车级制造纪律，并通过 XPeng
              门店和园区进行可控的初始落地。特别是面对仍缺少工业级母公司的风投支持企业，这些优势有分量。但竞争比较恰恰在真实买家最关心的地方变难。Unitree 公开的产品和出货背景更可见；AgiBot
              在生产里程碑上的公开证据更强；Figure 和 Apptronik 围绕平台成熟度与伙伴部署的市场叙事更强；Agility 的仓储切口最清晰。Dogotix 未公开定价，买方和投资者因此无法将性价比同
              Unitree 的较低公开价格，或美国机器人常用的服务 / 试点模式对标。渠道同样有双面性：XPeng
              控制的场地是强大的自有验证场，但并不等同于广泛独立渠道，也不等同于一串第三方企业部署名单。从竞争角度看，Dogotix 赞助方异常强，但仍有一部分不透明。
