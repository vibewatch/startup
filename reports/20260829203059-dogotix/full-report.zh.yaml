      - number: '1.5'
        title: 里程碑、商业化路径与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              Dogotix 近期商业化叙事由一串窄但可行的里程碑支撑。XPeng 称 IRON 在 2025 年末发布，2026 年进入量产冲刺，目标是在 2026 年底前开始量产，月产量超过 1,000
              台。公开报道显示，首批部署会先进入 XPeng 自有门店和园区，之后在 2027
              年面向中国及海外的零售和服务业客户销售。先内部再外部的节奏偏保守，但战略上合理：公司能在可控环境里收集数据、验证可靠性，并在更大规模第三方承诺前打磨人机交互模型。与此同时，公开证据仍明显不完整：没有披露独立客户数，没有经审计的商业订单积压，没有公开的
              Dogotix 董事会名单，也没有经独立验证的员工数、生产良率或实际单位经济性。分析师认可独立估值基准和 XPeng 资产负债表压力下降，但支持性报道也承认，量产执行和真实商业订单将决定 $6.3 billion
              隐含价值能否转化为持久企业价值。换句话说，Dogotix 现在有资本和能见度；证明还要自己挣。
