  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层与初始切口
        blocks:
          - type: paragraph
            body: >
              Dogotix 的早期客户图谱，最容易通过区分初始自有用户和后续外部客户来理解。第一个买方、付款方和运营设计伙伴似乎就是 XPeng 自己。公开报道称，IRON 将先部署在 XPeng
              门店、园区及配套受控环境，2026 年也有工厂和装配线测试报道。这让第一类客户成为内部客户：XPeng 零售运营、XPeng 园区运营，以及 XPeng
              制造或服务环境。往外看，可能的外部客户细分包括零售运营商、物流环境、巡检或安防运营商，以及在存量空间中受益于类人形态自动化的企业园区。换句话说，Dogotix
              的初始切口不是横向铺开的机器人发布，而是一架从内部到外部的采用梯子：XPeng
              补贴最早的证明点，外部客户要等产品、安全和支持风险下降后才会到来。这创造了理性的商业化顺序，但也意味着今天的公开客户证据更多是在证明采用的可能性，而不是已经验证外部需求。
