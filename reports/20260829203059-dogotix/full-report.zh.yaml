      - number: '4.2'
        title: 市场拓展打法与销售效率代理指标
        blocks:
          - type: paragraph
            body: >
              Dogotix 近期市场拓展打法看起来更受控，而不是全面铺开。公开报道持续称，首批部署计划进入 XPeng 门店和园区，再在 2027
              年扩大商业交付。财务上这很重要，因为内部验证场能降低早期获客摩擦、压缩实施周期，并在不立刻依赖第三方采购的情况下生成数据。但它也削弱了外部市场对销售效率的读数。公开信息没有
              CAC、回本周期、转化率、管道覆盖率或灯塔客户披露。最好的代理指标是，XPeng 已经运营全国性零售和服务网络，并明确使用这些场地在更广泛商业化前验证 IRON。换句话说，母公司提供场地和触达，Dogotix
              的第一渠道成本可能异常低；但这并不能证明其在独立企业市场具备可复制销售效率。承销应把内部孵化经济性与真实外部获客分开看。
