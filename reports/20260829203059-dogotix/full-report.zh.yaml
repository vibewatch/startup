  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险概览
        blocks:
          - type: paragraph
            body: >
              Dogotix
              应被视为高风险商业化项目，而不是已经去风险的机器人运营商。第一，证据不对称：公开材料显示融资强、战略背书强、路线图激进，但第三方部署、可靠性、认证、支持运营和外部客户留存披露有限。第二，风险耦合。制造爬坡延迟不只会影响出货，还会削弱客户信任、拉长现金消耗，并把融资压力提前。第三，敞口集中。XPeng
              同时是 Dogotix 的母公司、第一渠道、第一验证场、可能的制造骨干，也是战略可信度的主要来源。这种一致性带来速度，也带来系统性依赖。最后，Dogotix 正进入一个对
              AI、数据、安全和先进技术出口越来越不宽容的监管环境。公司或许有穿越这些风险的路径，但当前公开证据不足以支持低风险判断。
