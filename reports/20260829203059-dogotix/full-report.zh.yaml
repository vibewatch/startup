      - number: '8.3'
        title: 可比公司集合，以及 Dogotix 为何看起来比证据更贵
        blocks:
          - type: paragraph
            body: >
              Dogotix 应该对标与里程碑阶段匹配的机器人参照，而不是成熟软件公司，也不是单个轰动的人形机器人异值标的。最相关的下沿锚是 Unitree。公开的 2025-2026 年报道显示，Unitree 在收入超过
              RMB 1 billion、C 轮后估值高于 RMB 12 billion 后进入 IPO 筹备，约合 $1.6-$1.7 billion。这个估值远低于
              Dogotix，但公开商业化证据更强：真实收入、已发布定价和更广的市场可得性。


              最相关的中档私营锚是 Apptronik。Apptronik 2026 年 2 月延伸轮把 Series A 总融资推至超过 $935 million，外部报道给出的估值约 $5
              billion。Apptronik 还公开点名了与 Mercedes-Benz、GXO Logistics 和 Jabil 的商业协议。Dogotix 拥有比 Apptronik 更强的母公司工业基础，但
              Apptronik 向市场提供了更干净的独立公司融资履历，以及更明确的合作伙伴证明。


              Figure 是设定市场情绪的上沿，不是市场出清价。Figure 官方披露超过 $1 billion 的 Series C 资本，投后估值 $39
              billion，但即便友好的分析人士也认为，这个标记高度依赖未来执行，而不是当期收入。上市公司和二级市场锚点仍然稀缺；UBTech 约 HK$42 billion 市值和 13x
              以上销售倍数提供了有用背景，但更广行业仍主要按私募融资、叙事领先和预期制造里程碑定价。在这个背景下，Dogotix $6.3 billion 的估值并非非理性，但已经走在自身公开证据前面。
