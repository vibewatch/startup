      - number: '5.4'
        title: 差异化、制造杠杆与关键依赖
        blocks:
          - type: paragraph
            body: >
              Dogotix 最清晰的技术差异化不是某个单点规格，而是汽车级制造、自研芯片、具身 AI 数据闭环和母公司运营基础设施的组合。很少有人形机器人项目能同时声称这四点。XPeng 的 Physical AI
              叙事意味着，同一企业生态里同时开发车辆、芯片、AI
              系统和机器人。这可能在部件采购、测试纪律、质量控制和制造爬坡上形成真实优势。与此同时，产品仍依赖少数关键使能条件：先进芯片、执行器和灵巧手表现、高质量训练数据、安全部署场景，以及 Dogotix
              尚未详细描述的现场支持组织。平台野心越强，Dogotix 同时暴露在硬件、软件、制造和支持瓶颈下的程度就越高。公司的招聘模式是正面的开发者信号，但不能替代独立产品基准或公开集成文档。
