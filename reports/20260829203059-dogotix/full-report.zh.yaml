      - number: '8.2'
        title: 融资背景、入场纪律与投资者真正买到的东西
        blocks:
          - type: paragraph
            body: >
              核心估值事实很清楚：Dogotix 2026 年 8 月融资把公司定在约 $6.3 billion 交易后估值，扣除新资金和员工池假设前约 $5.0
              billion。更重要的投资判断问题是，这个价格到底买到了什么。公开申报摘要显示，这笔交易是围绕一个仍然运营年轻、亏损且处于转型中的业务做剥离融资。XPeng 仍是控股股东，Dogotix
              仍依赖划转人员和资产，最清晰的商业路径也仍从母公司生态内开始。


              因此，不能把这笔估值当作成熟独立运营公司的估值。Dogotix 披露了 2024 和 2025 年机器人业务亏损，以及截至 2026 年 3 月 31
              日的净负债；同一套申报材料仍把关键投资判断输入留在私域：除已披露投资者保护之外的清算顺位细节、单位经济性、外部收入和复购数据。XPeng
              自身现金状况降低了短期资金压力，融资也实质延长了达成证明的时间。但强母公司流动性本身并不能支撑 Dogotix 股权价值，它主要买来时间。


              入场纪律因此应按里程碑，而不是按倍数。投资者买到的不是一家已经披露经常性收入的业务，而是一个情景：XPeng 的物理 AI 技术栈、制造基础和分发场景，能把 Dogotix
              推过普通人形机器人创业公司容易卡住的点。这个情景可能成立，但它仍是前瞻性投资逻辑，不是当前基本面逻辑。
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV013
