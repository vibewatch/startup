      - number: '2.2'
        title: 规模测算视角，以及 TAM 标题为何会误导
        blocks:
          - type: paragraph
            body: >-
              人形机器人公开市场规模估计方向上偏乐观，数字却不一致。Goldman Sachs 给出谨慎基准情景：10 到 15 年内至少 $6 billion；若设计、用例、可负担性和公众接受度障碍被解决，到 2035
              年的蓝天情景可达 $154 billion。Precedence Research 估计 2026 年市场约 $2.16 billion，2035 年增至 $8.78
              billion；MarketsandMarkets 则建模出更大的 2026 年基数 $5.41 billion，以及 2035 年 $50.27 billion 的结果。Morgan Stanley
              更激进，勾勒出 2050 年 $5 trillion 的情景，全球约 1 billion
              台人形机器人，大多数用于重复性的工业和商业工作。这些不仅是数字不同，而是概念框架不同：有些是近期商业化预测，有些是远期技术采用情景，有些把硬件、软件和服务混在一起。映射到
              Dogotix，结论是外沿空间很大，但可信的 2027-2030 年可服务市场小得多，集中在愿意资助试点、容忍迭代，并能从存量环境部署中提取价值的企业。
