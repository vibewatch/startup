      - number: '5.5'
        title: 信任、安全性、信息安全、隐私与质量控制
        blocks:
          - type: paragraph
            body: >
              公开安全与信任信号存在，但仍主要由公司自己提供。官方描述强调全封闭柔性晶格结构、软触或面向人机交互的设计选择，以及汽车级制造纪律。这些设计意图值得肯定。不过，公开记录尚未显示机器人专用认证包、第三方安全审计、公开信息安全架构、漏洞披露计划、面向摄像头和麦克风的隐私治理包，或机器人专用事故历史。这个缺口对
              Dogotix 更重要；IRON 明确定位于面客和共享空间，而不是只在物理隔离后运行的纯工业机器人。投资者因此应区分安全设计主张和由独立证据支撑的安全治理。产品方向上可能设计得不错，但信任仍取决于尚未发布的证明。
