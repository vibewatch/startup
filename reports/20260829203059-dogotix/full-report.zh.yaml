  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现逻辑
        blocks:
          - type: paragraph
            body: >
              公开证据还没有显示 Dogotix 是成熟收入业务；它展示的是一个押注未来硬件、软件和服务变现的融资故事。XPeng 公开表态和独立报道暗示三层收入。第一层是 IRON
              及其他机器人平台的硬件收入。第二层是软件或升级收入。CnEVPost
              报道管理层称，硬件销售加软件升级收入，可能让每台机器人的生命周期毛利贡献显著高于汽车业务。第三层是伴随企业落地的部署、支持和商业化工作，但当前公开披露没有单独拆出这些服务。真正缺失的是最重要的收入质量证据：价格表、合同结构、保修条款、服务附加率、收入确认政策和细分组合。不同于纯软件公司，Dogotix
              必须先消化沉重的硬件成本和支持负担，周期性收入经济性才会显现。因此，投资者应把收入模型视为合理但尚未由独立披露收入、积压订单、年经常性收入（ARR）或客户使用数据证明。
