  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              对 Dogotix
              而言，相关市场不是「所有机器人」，甚至不是理论上的整个人形机器人宇宙。可投资边界更窄：近期支出来自能在为人类建造的环境中运行，并以很少存量改造执行服务、物流、园区、巡检、安防或轻工业任务的通用或半通用机器人。XPeng
              披露强化了这一定义。Dogotix 正是围绕人形、双足、四足和履带式机器人被剥离；XPeng 的汽车、robotaxi、飞行汽车和芯片业务留在边界之外。因此，本章应把 Dogotix 视为参与具身 AI
              自动化，而不是整个 Physical AI 的代理。主要替代方案仍是现有人力、固定式工业机械臂、AMRs/AGVs 和任务专用服务机器人。Bain 与 IFR
              都明确指出，人形机器人真正有意思的时刻，是能在既有环境中工作，使用与人类相同的工具或通道，并在不大改基础设施的情况下降低用工依赖。Dogotix 的市场相关性因此取决于，Dogotix
              的机器人能否在高摩擦实体工作流中优于或补充这些更窄的替代方案。
