      - number: '3.2'
        title: 主要竞争者画像
        blocks:
          - type: paragraph
            body: >-
              在中国同行中，Unitree 是最危险的参照，因为它把量产可信度、低公开定价和异常可见的商业规模结合在一起。Humanoid Index 描述其为 2016 年成立的杭州公司，拥有超过 1,000
              名员工，2025 年出货超过 5,500 台，并计划以约 $7 billion 估值 IPO。AgiBot 同样重要，因为它把高出货量、制造动能和更年轻快速扩张的画像结合起来；Humanoid Index 与
              Humanoids Daily 称其 2025 年出货 5,100 台，之后达到 10,000 台门槛，作为规模领先证明。UBTech
              在创业速度上弱一些，但在企业、教育和上市公司可信度上更重要。中国以外，Figure 是最强的 AI 与品牌参照，拥有 BMW 部署叙事和人形机器人领域最高的披露估值。Apptronik
              是商业化同类公司，因为它结合了 Apollo、RaaS 姿态、大额融资和制造合作伙伴。Agility 估值规模较小，但因聚焦物流工作流和商业仓库部署而重要。Dogotix
              处在这些集群之间：资本和母公司深度具备世界级观感，但外部市场证明仍薄于最强中国领导者，也不如最知名美国叙事那样有独立文件支撑。
