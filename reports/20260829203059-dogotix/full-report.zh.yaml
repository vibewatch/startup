      - number: '8.5'
        title: 退出准备度、打穿投资逻辑的触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              Dogotix
              最可信的退出路径，是未来在中国内地或香港市场上市，或上市前在一级市场重估，而不是近期全球战略出售。公司的注册地、母公司控制，以及围绕中国来源先进机器人的政策敏感度上升，都让高溢价西方战略退出不如可比美国机器人公司可靠。这并不消除退出选择权，但支持相较最受追捧的美国人形机器人公司给出结构性折价。


              如果 Dogotix 拿出一小组具体证明，建议会改善：具名非 XPeng 生产客户；制造产出和可靠性披露，显示 2026-2027
              年爬坡真实；收入或单位经济性桥梁；更清晰的合规、隐私、安全和现场支持组合。这些事项重要，因为它们会把故事从赞助方背书的可能性，转成可独立判断的企业价值。


              如果 Dogotix 到 2027 年中仍没有可见外部商业化，产出和部署目标无解释滑坡，铺开期间出现安全或隐私事件，或 IPO /
              赎回压力开始替代产品驱动的价值创造，投资逻辑会明显变弱。因此，尽调议程很直接：证明客户真实，证明制造真实，证明经济性，证明下行结构。
