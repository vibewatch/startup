          - type: paragraph
            body: >
              运营风险是最可能打穿投资逻辑的一类。Dogotix
              正从技术演示和内部试点，走向客户面前或运营环境中的高频真实部署。这会打开多种失败路径。展厅、园区或工厂里的一次安全事故，可能把声誉损害放大到事发地点之外。量产爬坡落空，会同时削弱商业化时间表和投资者信心。现场可靠性薄弱尤其伤，因为人形机器人本来就面临
              ROI
              和支持负担的质疑。网络安全和隐私风险也不轻：任何带摄像头、麦克风和软件更新的联网机器人平台，都会扩大攻击面。公开记录给出了令人鼓舞的设计意图信号，但在故障率、安全测试、支持工具或事件响应准备度上，独立证据很少。上述缺口补上之前，运营假设应保持保守。
