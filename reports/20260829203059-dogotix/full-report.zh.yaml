        - Dogotix 定价远高于这个公开商业化证据更强的同业
        - 收入基数和产品组合不同于 Dogotix 仍以内部优先的策略
      - - Apptronik
        - ~$5.0B，2026 年私募轮背景
        - 公开样本中，当前最接近的后期私有人形机器人估值锚
        - Dogotix 估值 $6.3B，但独立客户披露更弱，看起来更贵
        - Apptronik 位于美国，享有更干净的地缘政治和退出背景
      - - Figure AI
        - $39B Series C 后估值
        - 品类情绪上限
        - Dogotix 远比这个异常值便宜，但 Figure 不能证明应把极端乐观当基准
        - 相对披露收入，Figure 本身看起来很大程度由叙事定价
      - - UBTech Robotics
        - HK$41.97B 市值 / 基于 2026 年公开报价数据的 13.72x 销售倍数
        - 中国上市人形机器人与机器人基准，带有公开市场纪律
        - 尽管披露薄得多，Dogotix 已接近一个公开基准的价格区间
        - 公开市场估值每天波动，且产品组合比 Dogotix 更宽
      - - AgiBot
        - 中国私募规模基准；以出货叙事和 IPO 目标驱动
        - 显示中国具身 AI 龙头能多快因制造势头被重估
        - Dogotix 处在同一个热情周期，不能忽视中国出货和成本基准
        - 公开证据在生产叙事上强于经审计经济性
      - - Agility Robotics
        - 聚焦物流与仓储的人形机器人参照
        - 用例聚焦显示另一条价值路径：靠狭窄场景的部署证据
        - Dogotix 仍需证明，通用性在市场上是否胜过更窄切口
        - 当前公开估值证据比 Figure、Unitree 或 Apptronik 更薄
    notes: 这张表用于搭建决策框架，不是机械地按市场价格等值换算。地域、产品组合和披露标准不同，因此判断 Dogotix 时，既要看绝对估值，也要看相对证据质量。
