      - number: '4.3'
        title: 成本结构、资本开支与单位经济性
        blocks:
          - type: paragraph
            body: >
              Dogotix 的成本栈主要通过披露用途间接可见。XPeng 8 月公告称，融资所得将用于硬件和软件研发、Physical AI
              模型训练、高质量数据采集、全链条量产基地建设以及全球商业化。也就是说，成本结构横跨专用部件、算力、模型训练基础设施、工厂建设、质量体系和现场支持。产品披露提供了更多线索。IRON 使用三颗自研 Turing
              芯片、高自由度灵巧手和拟人化硬件，规模学习降低成本前，初始物料清单很可能昂贵。与此同时，XPeng
              认为汽车级供应链和制造能力应能相对纯创业公司同业提升良率和成本纪律。公开证据尚不足以支撑自下而上的单位经济模型，但足以给出方向性结论：Dogotix
              资本开支重，受益于母公司制造杠杆，还需要高得多的出货量才能判断毛利率质量。未披露标价或实际成交价，是当前财务承销图景中最大的洞。
