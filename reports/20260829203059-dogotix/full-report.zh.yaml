      - number: '6.5'
        title: 扩张潜力与集中风险
        blocks:
          - type: paragraph
            body: >
              今天客户集中风险极高，因为第一批客户场景几乎完全与 XPeng 相关。如果 Dogotix 在 XPeng 门店、园区或工厂用途中的表现不及预期，它最早也最强的证明引擎会立刻削弱。集中度的正面是速度：XPeng
              能给 Dogotix
              一个可控部署网络、全国性零售网点，以及不用等待缓慢外部采购就能测试新机器人的内部运营环境。负面是外推性。一家公司看起来可以很活跃，却仍缺乏第三方付费意愿。扩张逻辑存在——从内部场地走向零售、物流、巡检和安防领域的灯塔企业客户——但公开证据显示，这条逻辑的每一步都还在前面。正确问题不是
              Dogotix 是否可能走先落地再扩张的路径；它有。正确问题是，在估值预期跑过采用现实之前，源自 XPeng 的需求能否转化为多元外部客户需求。
