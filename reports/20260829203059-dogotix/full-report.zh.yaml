      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Dogotix 的买方图谱更像企业市场，而不是消费市场，即便机器人外形高度拟人。第一个买方事实上是 XPeng：公开报道称 IRON 将先进入 XPeng
              门店和园区，让母公司同时成为内部设计伙伴和初始验证场。往外看，最可能的早期细分包括工业园区和物流场景、园区安防与巡检运营方、寻求面客自动化的零售和服务场所，以及一些劳动力成本让自动化经济性更容易成立的国际市场。在这些场景中，买单方通常是企业运营、设施或自动化预算；终端用户则是一线员工、场地经理或客服团队。Bain
              分析和 Morgan Stanley 预测都指向重复、结构化的商业工作是最早的商业切口，而不是广泛家庭采用。Dogotix
              自身披露的用例——零售、工业园区、智能家居、物流、电力巡检和安防——也意味着多个买方画像，而非单一总可用市场（TAM）。承销难点在于，Dogotix 尚未公开证明哪些细分转化最快，或产生最好的生命周期经济性。
