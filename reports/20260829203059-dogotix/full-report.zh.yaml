      - number: '2.4'
        title: 采用驱动因素与硬约束
        blocks:
          - type: paragraph
            body: >-
              人形机器人采用背后的需求驱动是真实的。IFR 和 Bain 都强调劳动力短缺、人口老龄化、生产率压力，以及自动化处理脏、枯燥、危险、困难任务的吸引力。MarketsandMarkets、Precedence 和
              Morgan Stanley 又补充，AI、移动能力、视觉、执行器、电池和基础模型的进步，正在扩大可覆盖任务集。具体到 Dogotix，XPeng 认为汽车级制造、端侧 AI
              芯片和大规模数据闭环拼出了一套异常强的商业化平台。但约束同样关键。Bain 认为领导者现在应试验，但还不应投入大量资本；Morgan Stanley 提醒，家庭采用还需要十年进步和大幅降价；Goldman
              明确把高端 TAM 与克服产品设计、用例、可负担性和公众接受度障碍绑定。Dogotix
              自己也有约束：没有公开客户积压订单，现场验证数据有限，中国机器人面临地缘政治限制，安防、隐私等未解决问题在近距离人机交互中比在封闭式工业自动化中更重要。市场有吸引力，正因为它尚未定型。
