      - number: '1.4'
        title: 融资、估值与资产负债表现实
        blocks:
          - type: paragraph
            body: >-
              对一个刚外部化的机器人资产来说，融资结构披露得异常充分。XPeng 文件与多家独立报道都指向约 $900 million 的即时承诺：外部投资者 $600 million，XPeng 全资子公司 XPeng
              Dogotix $200 million，He Xiaopeng 和 Brian Gu 控制的实体 $100 million。相同文件框架还允许另一名投资者按同等条款追加最多 $15
              million，并授予认股权证，让高管载体未来可再认购 $500 million。标题估值为交易前 $5.0 billion；若 2026 年股权激励计划全部使用，交易后估值约 $6.3
              billion。XPeng 持股将从 100% 降至交割时约 81.97%，完全摊薄后约 68.41%，但仍并表。估值不低，而对应业务的管理账目仍是早期亏损：2024 年净亏损 RMB87
              million，2025 年净亏损 RMB369 million，截至 2026 年 3 月 31 日净负债约 RMB447 million。结论是，Dogotix
              融得到钱，也有战略背书，但经济性仍在证明前，必须靠未来商业化撑住价格。
