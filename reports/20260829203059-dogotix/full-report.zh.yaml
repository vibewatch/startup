              披露的进展指标大多是运营指标，不是财务指标。XPeng 称 Dogotix 目标是在 2026 年底量产，先部署于自有门店和园区，并在 2027
              年向中国及海外市场扩大交付。产品页面和第三方文章描述了越来越有野心的硬件里程碑，但那不等于已确认收入。机器人业务最清晰的公开财务指标反而是文件包中的负面指标：2024 年未经审计净亏损 RMB87
              million，2025 年净亏损 RMB369 million，截至 2026 年 3 月 31 日净负债约 RMB447 million。母公司层面，XPeng 报告 2026 年 Q2 收入
              RMB19.74 billion、毛利率 20.7%、现金头寸 RMB40.48 billion、净亏损 RMB1.34 billion；这些数字重要，是因为它们显示 Dogotix 所处的资产负债表背景，而不是
