      - number: '5.3'
        title: 部署、集成、可靠性与路线图
        blocks:
          - type: paragraph
            body: >
              部署故事比可靠性故事更可见。Dogotix 和 XPeng 公开目标是在 2026 年底量产，先部署到 XPeng 自有场地，并在 2027 年在中国及海外扩大商业化。独立报道还指向 2026
              年广州的试生产或试制活动。这一顺序作为落地计划可信，因为它从自有场地起步，公司能控制运营、数据采集和迭代速度。但它不能被误读为平台已经在现场大规模验证。公开信息没有运行时间历史，没有公布 MTBF
              或维护间隔数据，没有面向第三方集成商的部署手册，也没有客户撰写的可靠性案例。路线图因此更适合被理解为分阶段成熟路径：2026 年内部试点和试生产，2027
              年初始商业部署；只有当公司证明真实负载下的可靠性、可支持性和安全人机交互后，才可能走向更广泛的多垂类采用。
