  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流定义产品
        blocks:
          - type: paragraph
            body: >
              Dogotix 更适合被理解为机器人平台公司，而非一次单设备发布。XPeng 2026 年 8 月公告把剥离范围定义为人形、双足、四足和履带式机器人，以及配套软硬件栈、数据和商业化体系。从工作流看，旗舰 IRON
              人形机器人定位于在为人类建造的空间中受益于类人形态的任务：迎宾、导航、导览服务、物流支持、巡检、巡逻和部分轻工业流程。公开材料反复把 XPeng
              自有门店和园区描述为首个验证场，意味着客户工作流先从受控环境开始，再进入更广泛的企业部署。这一点重要，因为 Dogotix
              并不是承诺上市时交付通用家用机器人；它承诺的是把机器人塞进相对结构化的商业空间，那里已有基础设施和人类工具。IRON 之外的更宽产品范围也有战略意义：Dogotix 可追求多形态具身 AI
              收入机会，而不是依赖单一人形 SKU。
