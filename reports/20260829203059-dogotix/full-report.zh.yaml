chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、范围与剥离结构
        blocks:
          - type: paragraph
            body: >-
              Dogotix 更像 XPeng Group 正在外部化的人形机器人业务，而不是从零起步的创业公司。最清晰的一手证据来自 2026 年 8 月 24 日 Dogotix 股份购买协议：XPeng
              在香港和美国监管文件中披露，并在自家公告中呼应。材料显示，XPeng 预计用 18 个月把主要与机器人业务相关的资产、知识产权、人员、系统及其他运营资源剥离进 Dogotix。剥离不包括 XPeng
              的汽车、robotaxi、飞行汽车、芯片和其他 Physical AI 业务；这让 Dogotix 聚焦通用机器人和机器人系统，而不是承接 XPeng 的全部可选项。公开描述也把 Dogotix
              的范围定义得比单一人形机器人更宽：业务覆盖人形、双足、四足、履带式机器人，以及围绕这些平台的授权和商业化。因此，Dogotix
              在战略上更接近机器人平台子公司，而不是单品实验室项目；但独立法律边界、人员边界和资产边界，要等剥离完成、交割后披露更细时才会完全清楚。
