            body: >
              Dogotix 有平台级依赖风险，因为几项核心依赖都压在同一个支持方身上。XPeng
              提供资本、首批部署网络、制造杠杆和创始人级投入。任何一项变弱，其他依赖也更难托住。额外依赖还包括先进芯片、执行器和灵巧操作性能、具身数据采集、监管接受度，以及尚未公开描述的现场支持组织。人员风险同样高。He
