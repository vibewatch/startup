  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              Dogotix 获得观察建议，信心为中，风险评级为高。这个建议不是判定公司弱，而是认为当前价格已经要求投资者为公开证据尚未完全证明的里程碑付费。投资逻辑最强的部分是战略质地。Dogotix 继承了 XPeng
              的制造纪律、自研芯片和自主系统栈、创始人级投入，以及通过 XPeng 门店、园区和运营体系受控铺开的路径。在许多人形机器人公司还要同时拼产品、资本和客户场景的行业里，这些优势是真实的。


              反向逻辑在于估值支撑。Dogotix 面向外部投资者时，投前估值约 $5.0 billion，交易后估值约 $6.3
              billion，但公开证据仍未显示独立收入、外部客户数、积压订单、已实现单位经济性，或成熟的合规与支持组合。公开记录还显示，名义融资额中只有 $600 million 是独立外部资本，其余来自 XPeng
              和高管平台。这个结构不否定融资轮本身，但相比完全由第三方定价的融资，名义估值作为纯市场信号更弱。


              实际含义是，Dogotix 应被视为价格敏感的观察名单标的。如果它开始把 XPeng 内部试验场转成具名外部客户，发布更清晰的制造和部署指标，并证明 2026-2027
              年商业化目标是真实目标而不是愿景，建议可以很快改善。在此之前，最符合证据的立场是跟踪，而不是追高。
