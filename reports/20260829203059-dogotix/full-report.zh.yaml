      - number: '2.5'
        title: 可触达 SOM 与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              一个有用的 Dogotix
              市场视图需要三层。最外层是研究机构和卖方策略师给出的标题性人形机器人总可用市场（TAM）。中间层是更近期的可服务市场（SAM），围绕制造邻近园区、物流、巡检、安防和面客服务中的结构化企业工作流。最内层是
              Dogotix 未来一到三年的现实可获取市场（SOM），很可能只限于 XPeng 控制的场所，以及少量愿意试点仍在成熟中的平台的外部灯塔客户。公开证据还不够细，无法以高置信度量化该 SOM，因为 Dogotix
              未披露实际定价、细分转化率、服务附加率或客户集中度。即便如此，买方图谱仍指向一条理性路径：先利用母公司自有场景收集数据、降低可靠性风险，再进入存量环境适配度和用工经济性最有利的企业细分。如果 Dogotix
              试图从展示演示直接跳到多垂类大规模部署，市场会显得比现实更大；如果按高摩擦但结构化的企业任务排序进入，短期机会更小，却更可信。
