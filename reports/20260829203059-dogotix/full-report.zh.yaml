      - number: '7.2'
        title: 监管、法律、隐私与出口管制风险
        blocks:
          - type: paragraph
            body: >
              即使今天还没有 Dogotix 专属执法事件，监管风险也已经实质存在。人形机器人进入与人共处空间，会牵出产品安全、工作场所安全、隐私和 AI 治理问题，复杂度高于围栏后的工业机器人。如果 Dogotix
              按公开说法在 2027 年尝试走出中国商业化，还会暴露在跨境风险中。EU AI Act、不断扩张的州级和国际隐私制度，以及美国围绕先进芯片和 AI 相关技术的出口管制审查，都会制造潜在摩擦。核心问题不是
              Dogotix
              已经违规；公开证据没有显示这一点。问题在于，公司还没有发布机器人专属的认证、隐私、安全和合规组合，让外部投资者有把握降低这些风险折价。融资结构还叠加了一层法律和财务压力：投资者赎回权与七年内完成合格 IPO
              绑定，如果商业化滞后，合同义务会在经营上变得重要。
