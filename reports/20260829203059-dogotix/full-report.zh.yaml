      - number: '3.4'
        title: 护城河耐久性、切换成本与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Dogotix 的护城河主张真实存在，但多半是中等耐久，而不是永久。XPeng 的全栈芯片、AI
              模型和制造体系有价值，因为很少有人形机器人创业公司同时控制汽车级硬件运营。母公司的自有渠道也提供数据采集和低摩擦迭代场，再去做更广泛的外部销售。但竞争对手有强反制。Unitree
              的规模和定价从低端威胁商品化；AgiBot 的生产动能和工厂证据在执行证明上压制 Dogotix；Figure 和 Apptronik 在 AI 叙事、平台伙伴和投资者注意力上构成威胁；Agility
              在用例专注度上构成威胁。品类切换成本仍相对低，因为多数客户还处在试点或早期部署阶段，标准也未稳定。真正的锁定效应来自集成、工作流调优、服务支持和部署数据积累，而不是品牌本身。因此，如果 Dogotix
              快速证明可靠性和 ROI，仍能拿份额；但不能假设今天的资本领先或母公司光环会长期决定胜负。
