        title: 具名客户证明主要来自内部
        blocks:
          - type: paragraph
            body: >
              Dogotix 客户证明最重要的事实是：有名称，但多数是内部名称。公开来源反复指向 XPeng 门店、展厅、园区和工厂产线，称这些是 IRON
              将运行或已经测试的首批环境。这些证明场景有价值，因为它们提供真实工作流、人机交互和运营数据。不过，它们不能提供第三方客户签署量产合同那样的商业化证据。截至报告日期，已审阅来源没有点名外部商业客户、政府采购中标，或已经投产的第三方企业部署。因此，最强解读是谨慎但不否定。由于
              XPeng 可以点名自有场所和运营，Dogotix 比很多概念阶段机器人公司有更清晰的具名部署场景。但市场仍缺少独立客户引用、合同证据、多站点铺开，或非 XPeng 运营方公开 ROI
              声明。内部证明有用，但不等于产品市场证明。
