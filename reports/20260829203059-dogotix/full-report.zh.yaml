  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Dogotix 至少在三个重叠竞技场竞争。第一是中国商业人形机器人竞赛，Unitree 和 AgiBot 的公开出货规模最强，UBTech
              则提供更偏企业和公开市场的参照。第二是全球关注的风险资本支持人形机器人队列，以 Figure、Apptronik 和 Agility 为代表；即使大规模出货量尚未可见，AI
              集成、合作伙伴部署和资本形成也会塑造市场认知。第三是真实采购决策中最重要的替代集合：人力、固定式工业自动化、AMRs/AGVs 和其他更窄的服务机器人。Dogotix
              披露的范围覆盖人形、四足和履带系统，比单一人形机器人创业公司有更宽的产品相邻性；但初始商业切口仍要同时对抗机器人原生同行和既有自动化堆栈。市场足够早，商业就绪度、支持基础设施和数据闭环比任何单一规格表更重要。因此，Dogotix
              的竞争姿态应定义为资本很强、证明中等，而不是简单的「资金充足」。
