        title: 财务判断与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              财务上，Dogotix 最容易被承销为一个有母公司背书的商业化期权，而不是一家收入质量已经验证的公司。正向逻辑很清楚：公司吸引了顶级资本，享受母公司供应链和制造杠杆，并能先使用 XPeng
              内部场景测试部署，再扩大落地。负向逻辑同样清楚：没有公开独立收入基数，没有披露定价，没有公开客户积压订单，没有经验证的支持成本结构，也只能有限看到软件或服务收入会如何叠加在硬件销售上。披露的亏损和负债说明
              Dogotix 仍处在投入期。正确的尽调姿态，是把资本充足度和经济性分开。资本充足度今天相对强。经济性、客户质量和利润率路径仍未解决，应当被视为门槛型尽调事项，而不是可假设的未来事实。
