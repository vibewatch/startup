      - number: '6.3'
        title: 采用轨迹与部署漏斗
        blocks:
          - type: paragraph
            body: >
              Dogotix 的采用轨迹似乎要经过分阶段部署漏斗，而不是全面铺开的市场拓展打法。公开报道支持的顺序是：广州内部测试和试生产，进入 XPeng 工厂或装配环境，在 XPeng
              展厅或门店承担面客任务，之后才在中国及海外更广泛商业化。这个顺序在经济和产品上都说得通，因为面客机器人需要真实世界暴露，才会赢得大型外部账户信任。问题是公开漏斗缺少分母。Dogotix
              没有披露活跃试点站点数量、测试中机器人数量、试点转为生产使用的比例，或有多少外部潜在客户在评估。投资者因此需要区分结构良好的客户旅程和可测量的采用曲线。前者存在于公开证据中；后者不存在。当前公开记录足以支撑可信的部署叙事，但不足以量化市场拉力。
