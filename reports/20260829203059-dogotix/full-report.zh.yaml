      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >
              从公开证据评估 Dogotix，情景分析是唯一严谨方法，因为公司尚未披露传统内在价值模型所需的运营指标。乐观情景假设，2026 年底制造目标变得可见且真实，XPeng 关联试点在 2027
              年转化为具名第三方部署，Dogotix 证明其机器人能在可控支持负担下产出有用工作。在这种情况下，当前估值可以扩张，因为公司看起来不再像孵化中的承诺，而更像有异常强工业背书的规模化具身 AI 平台。


              基准情景假设，Dogotix
              确实推进了技术和制造，但证据仍主要留在内部，市场继续因为关联方商业化、经济性披露稀疏和地缘政治不确定性而打折。在这条路径下，今天的价格大致合理到略偏高，投资者回报更多取决于后续证明，而不是立刻估值重估。


              悲观情景不是破产，而是证明进度滑坡。如果制造规模、外部客户转化，或安全和合规准备在 2027 年及之后仍滞后，Dogotix
              可能被重新定价，更像一个融资充裕的项目，而不是高信念增长平台。由于公开证据在收入质量和下行保护上很薄，当前估值在乐观情景之外只留下有限安全边际。
