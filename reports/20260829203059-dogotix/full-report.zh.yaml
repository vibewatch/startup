      - number: '5.2'
        title: 架构、控制栈与运营模型
        blocks:
          - type: paragraph
            body: >
              公开证据支持 Dogotix 具备可识别的全栈架构，尽管精确技术文档仍薄。XPeng 官方材料描述了一套覆盖机器人本体、大脑、小脑、数据和基础设施的栈。结合官方材料和可信二手梳理，IRON
              与拟人化机械设计、灵巧手、多颗 Turing 芯片带来的端侧 AI
              算力、视觉主导感知，以及用数据和仿真训练的身体控制算法相关。多份技术梳理强调晶格式内部结构、全身控制、受强化学习启发的运动能力和操作研究；招聘页面也说明 Dogotix 或 XPeng
              正在积极招聘全身控制、灵巧操作、强化学习和具身智能岗位。正确解读不是 Dogotix 已向公众完整记录一套可量产的自主栈，而是有足够一致的信号表明，公司在构建自有具身 AI
              栈，并非只是把通用机器人硬件与外包软件拼接起来。仍未验证的是经基准测试的任务成功率、控制延迟、边缘 / 云端分工、安全故障处理，以及面向外部集成商的 SDK 或 API 成熟度。
