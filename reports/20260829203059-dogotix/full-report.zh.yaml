      - number: '7.5'
        title: 财务 / 模型风险、缓释因素与终止标准
        blocks:
          - type: paragraph
            body: >
              财务风险不是马上资不抵债，而是公司能否在义务和预期追上来之前，把大额资本转成可验证证据。公开披露显示，机器人业务亏损、净负债，研发、数据、设施和商业化还需要重投入；如果七年内没有完成合格
              IPO，投资者还拥有合同赎回权。也就是说，Dogotix 的融资买来的是验证窗口，还不是可持续经济性。缓释因素确实存在：这一轮规模大，XPeng
              资本仍充足，公司也能利用内部部署场景，比纯创业公司学得更快。但缓释措施的成熟度仍只是中等，而非已经被证明。投资者应盯住具体触发点：经验证的外部客户增加、可靠的现场表现、与人共处空间部署的合规准备证据、符合路线图的制造产出，以及
              IPO 或赎回压力是在逼近还是推远的任何信号。
            claimRefs:
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
