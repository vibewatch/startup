    layout: compact
    summary: 截至 2026-08-29，对 Dogotix 估值组合做投委会式打分：一边看战略质量，一边看证据质量。
    data:
      items:
        - label: 市场与品类重要性
          score: 8
          detail: 人形机器人仍是战略优先级很高的品类，资本充足，政策关注也高
        - label: 产品与技术潜力
          score: 7
          detail: XPeng 的 IRON 技术栈和物理 AI 布局有可信度，但关键风险还没完全打掉
        - label: 客户验证
          score: 3
          detail: 先在内部落地是真的；外部付费客户披露仍薄
        - label: 经济性可见度
          score: 2
          detail: 公开记录里没有独立收入和利润率，也没有把单位经济模型讲清
        - label: 融资能力
          score: 8
          detail: 以当前阶段看，公司拿钱渠道和母公司支持都不寻常
        - label: 治理与下行结构
          score: 4
          detail: 控制权和已披露保护条款确实存在，但完整下行经济性仍不透明
        - label: $6.3B 估值支撑
          score: 4
          detail: 行业背景能解释这个价格；当前独立证据还不足以完全支撑它
        - label: 综合评分
          value: 5.1
          score: null
          detail: 密切跟踪；不要默认当前估值能自证合理
    approximationNotes: 评分采用 1-10 分制，是分析师综合本章证据后的判断，不是公司披露的 KPI。
