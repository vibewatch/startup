      - number: '1.3'
        title: 产品、技术与运营画像
        blocks:
          - type: paragraph
            body: >-
              Dogotix 的公开旗舰产品是 IRON 人形机器人，XPeng 材料强调拟人化设计、端侧智能，以及汽车式安全和制造纪律。2026 年 8 月融资公告把 IRON 描述为 AI
              驱动、高度类人的通用平台，背后是一套覆盖机器人本体、「大脑」、「小脑」、数据和基础设施的全栈软硬件。XPeng 产品材料和媒体报道给出更具体参数：IRON 有 76 个身体自由度、每只手 21
              个自由度，采用全封闭柔性晶格结构以提升外观和安全性，并搭载三颗自研 Turing AI 芯片，合计 2,250 TOPS。XPeng
              称这套算力让机器人无需远程遥操作即可自主完成复杂任务，但自主性仍需要独立现场验证。同样重要的是，Dogotix
              并不只被定义为人形机器人项目。管理层和媒体反复提到面向智能家居、物流、电力巡检和安防的四足及履带式机器人。更宽的组合说明，Dogotix 目标是商业化一整套具身 AI 平台，而不是完全押注一次人形机器人发布周期。
