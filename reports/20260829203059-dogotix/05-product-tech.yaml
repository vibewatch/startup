- id: architecture-and-operating-model
  title: Architecture, Control Stack, and Operating Model
  body: |
    Public evidence supports a recognizably full-stack architecture even if the exact technical documentation remains thin. XPeng's official materials describe a stack covering the robot body, brain, cerebellum, data, and infrastructure. Across official and credible secondary summaries, IRON is associated with anthropomorphic mechanical design, dexterous hands, on-device AI compute through multiple Turing chips, vision-led perception, and body-control algorithms trained with data and simulation. Several technical summaries emphasize a lattice-like internal structure, whole-body control, reinforcement-learning-informed locomotion, and manipulation research; recruiting pages reinforce that Dogotix or XPeng is actively hiring for whole-body control, dexterous manipulation, reinforcement learning, and embodied intelligence roles. The right interpretation is not that Dogotix has fully documented a production-ready autonomous stack to the public. It is that there is enough consistent signal to conclude the company is building its own embodied-AI stack rather than merely integrating commodity robot hardware with outsourced software. What remains unverified are benchmarked task-success rates, control latency, edge/cloud split, safety fault handling, and SDK or API maturity for external integrators.
  claimRefs:
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
