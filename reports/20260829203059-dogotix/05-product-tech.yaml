- id: differentiation-and-dependencies
  title: Differentiation, Manufacturing Leverage, and Critical Dependencies
  body: |
    Dogotix's clearest technical differentiation is not one isolated spec; it is the combination of automotive-grade manufacturing, in-house chips, embodied-AI data loops, and parent-company operating infrastructure. Few humanoid programs can claim all four at once. XPeng's Physical AI framing suggests the same enterprise is developing vehicles, chips, AI systems, and robots inside a shared industrial ecosystem. That could create real advantages in component sourcing, testing discipline, quality control, and manufacturing scale-up. At the same time, the product remains dependent on a small number of critical enablers: advanced chips, actuation and dexterous-hand performance, high-quality training data, safe deployment surfaces, and a field-support organization that Dogotix has not yet described in detail. The stronger the platform ambition, the more exposed Dogotix becomes to execution bottlenecks across hardware, software, manufacturing, and support simultaneously. The company's recruitment pattern is positive developer-signal evidence, but it is not a substitute for independent product benchmarks or public integration documentation.
  claimRefs:
  - CE023
  - CE024
  - CE025
  - CE026
