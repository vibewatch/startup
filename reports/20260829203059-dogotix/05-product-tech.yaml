  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: product-reliability
    missingEvidence: Uptime history, MTBF, maintenance intervals, failure modes, and service burden from real deployments.
    whyItMatters: A humanoid roadmap is not investable at scale without evidence that the platform can operate reliably in commercial environments.
    diligencePath: Request deployment KPI dashboards, field failure logs, maintenance protocols, and customer support staffing plans.
    relatedQuestionRefs: [QE011, QE016, QE025]
    relatedTableRefs: [TE004, TE005]
  - type: private-evidence-only
    severity: material
    topic: external-integration-readiness
    missingEvidence: SDK, API, integration documentation, update model, and support model for third-party customers.
    whyItMatters: A platform ambition without external integration readiness limits speed of commercialization outside XPeng-controlled environments.
    diligencePath: Review partner docs, sample integration kits, security model, and support SLAs.
    relatedQuestionRefs: [QE008, QE015]
    relatedTableRefs: [TE003]
  - type: private-evidence-only
    severity: material
    topic: trust-and-compliance
    missingEvidence: Robot-specific certification package, security testing, privacy governance, and third-party safety audit evidence.
    whyItMatters: Customer-facing robots face higher safety and trust expectations than lab or factory-only systems.
    diligencePath: Request certifications, audit reports, privacy controls, red-team findings, and incident response playbooks.
    relatedQuestionRefs: [QE018, QE019, QE020, QE024]
    relatedTableRefs: [TE004]
  - type: private-evidence-only
    severity: material
    topic: portfolio-definition
    missingEvidence: Detailed SKU list, performance envelopes, and deployment proof for quadruped and tracked robots within Dogotix scope.
    whyItMatters: Broader platform scope may matter strategically, but investors should know whether those categories are real near-term products or only optionality.
    diligencePath: Request product roadmap, bill of materials status, pilot list, and commercialization plan by robot form factor.
    relatedQuestionRefs: [QE001, QE003]
    relatedTableRefs: [TE001]
