  figureRefs: []
- id: trust-safety-and-compliance
  title: Trust, Safety, Security, Privacy, and Quality Controls
  body: |
    Public safety and trust signals exist, but they are still mostly company-authored. Official descriptions emphasize a fully enclosed flexible lattice structure, soft-touch or human-interaction-oriented design choices, and automotive-grade manufacturing discipline. Those are encouraging design intents. However, the public record does not yet show a robot-specific certification package, third-party safety audit, published security architecture, vulnerability disclosure program, privacy governance package for cameras and microphones, or robot-specific incident history. This gap matters more for Dogotix than it would for a purely industrial robot that operates behind physical barriers, because IRON is explicitly being positioned for customer-facing and shared-space environments. Investors should therefore distinguish design-for-safety claims from independently evidenced safety governance. The product may be directionally well designed, but trust still depends on proof that has not yet been published.
