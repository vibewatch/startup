- id: deployment-reliability-and-roadmap
  title: Deployment, Integration, Reliability, and Roadmap
  body: |
    The deployment story is more visible than the reliability story. Dogotix and XPeng publicly target end-2026 mass production with early deployment in XPeng-owned venues and broader 2027 commercialization in China and overseas. Independent coverage also points to pilot-production or trial-production activity in Guangzhou during 2026. That sequence is credible as a rollout plan because it starts with captive sites where the company controls operations, data collection, and iteration speed. But it should not be mistaken for evidence that the platform is field-proven at scale. There is no public uptime history, no published MTBF or maintenance interval data, no documented deployment playbook for third-party integrators, and no customer-authored reliability case study. The roadmap is therefore best read as a staged maturity path: internal pilots and trial production in 2026, initial commercial deployments in 2027, and wider multi-vertical adoption only if the company proves reliability, supportability, and safe human interaction under real workloads.
  claimRefs:
  - CE016
  - CE017
  - CE018
