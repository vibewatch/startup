    - Dogotix has unusual industrial leverage for such an early-stage humanoid company
  - - What blocks a buy call
    - No standalone revenue, customer-count, pricing, or unit-economics disclosure
    - Investors are still underwriting milestones rather than current business fundamentals
  - - Most likely path to upgrade
    - Named external customers plus output and economics disclosure
    - Proof, not narrative, is what can turn a track call into an investable one
  notes: The recommendation is explicitly price-sensitive. Better proof or a better entry price could improve the call without changing Dogotix's strategic quality.
