- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence today
  - What would change the view
  rows:
  - - XPeng inheritance is a real moat input
    - Manufacturing, chips, founder sponsorship, and deployment surfaces are all stronger than at a typical startup
    - Would strengthen further with third-party proof that XPeng assets translate into customer outcomes
  - - Capital base is unusually large
    - More than $900M of initial subscriptions creates real runway into proof
    - Would weaken if most progress still depends on new capital or if redemption pressure rises
  - - Current mark assumes future proof
    - Revenue, backlog, pricing, and support economics are still undisclosed
    - Would improve with a revenue bridge and external customer cohort evidence
  - - Unitree shows a lower-priced proof anchor
    - Unitree disclosed revenue and IPO-prep valuation at a materially lower level
    - Would matter less if Dogotix demonstrates materially better economics or commercial depth
  - - Apptronik shows a closer private valuation anchor
    - Apptronik is near the same valuation range with clearer public partner and deployment signals
    - Dogotix can close the gap by publishing equivalent customer and deployment detail
  - - Figure is a sentiment ceiling, not a fair-value floor
    - Figure's $39B mark is category-defining but too extreme to use as a default peer anchor
    - Would matter more only if Dogotix begins to look like a frontier AI platform, not just a robot carve-out
  notes: The table is designed to separate company quality from valuation support; the two are not the same.
  claimRefs: [CV004, CV009, CV015, CV016, CV021, CV022, CV023, CV024, CV045]
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation range
  - Probability signal
  - Investor implication
  rows:
