- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Public or private anchor
  - Why it matters
  - What it says about Dogotix
  - Limitation
  enumerationScope:
    coverage: partial
    basis: The table focuses on the most decision-useful humanoid valuation references visible in the current public evidence set rather than every robotics company in the sector.
  rows:
  - - Unitree Robotics
    - '>$1.6B post-Series C / IPO prep'
    - Lower-price China comp with public revenue and product-availability evidence
    - Dogotix is priced far above a peer with stronger public commercialization proof
    - Revenue base and product mix are different from Dogotix's still-internal-first strategy
  - - Apptronik
    - '~$5.0B private round context in 2026'
    - Closest current late-private humanoid valuation anchor in the public set
    - Dogotix at $6.3B looks richer despite weaker standalone customer disclosure
    - Apptronik is U.S.-based and benefits from a cleaner geopolitical and exit backdrop
  - - Figure AI
    - '$39B Series C post-money'
    - Sentiment-setting upper bound for the category
    - Dogotix is far cheaper than the outlier, but Figure does not justify using extreme optimism as a baseline
    - Figure itself appears heavily narrative-priced relative to disclosed revenue
  - - UBTech Robotics
    - 'HK$41.97B market cap / 13.72x sales on 2026 public quote data'
    - Listed China humanoid and robotics benchmark with public-market discipline
    - Dogotix is already priced in the neighborhood of a public benchmark despite much thinner disclosure
    - Public-market marks move daily and reflect a broader product mix than Dogotix
  - - AgiBot
    - 'Private China scale benchmark; shipment-led narrative and IPO ambition'
    - Shows how fast Chinese embodied-AI leaders are being repriced on manufacturing momentum
    - Dogotix competes in the same enthusiasm cycle and cannot ignore China shipment and cost benchmarks
    - Public evidence is stronger on production narrative than on audited economics
  - - Agility Robotics
    - 'Focused logistics and warehouse humanoid reference'
    - Use-case focus shows an alternative route to value through narrow deployment proof
    - Dogotix still needs to prove whether generality beats a narrower wedge in the market
    - Current public valuation evidence is thinner than for Figure, Unitree, or Apptronik
  notes: This table is for decision framing, not mechanical mark-to-market equivalence. Different geographies, product mixes, and disclosure standards mean Dogotix should be judged on relative proof quality as much as on absolute valuation.
  claimRefs: [CV015, CV016, CV020, CV021, CV022, CV023, CV024, CV025, CV026, CV027, CV028, CV029, CV046]
- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - External customer proof does not emerge
    - No named non-XPeng production customer by mid-2027
    - Keeps Dogotix in project mode rather than validated platform mode
    - Cut upside weighting and demand materially better entry terms
  - - Manufacturing proof slips
    - No credible evidence that output scaled through the end-2026 target window
    - Weakens the main justification for premium valuation versus smaller peers
    - Rebase valuation toward bear case
  - - Safety or privacy issue appears in rollout
    - Any material incident, recall, or formal complaint tied to deployment
    - Can damage customer trust and compliance posture simultaneously
    - Pause investability until root cause and remediation are clear
  - - Financing pressure becomes more important than product proof
    - IPO or redemption path becomes the central narrative before customer traction is visible
    - Suggests capital structure is pulling value creation rather than reflecting it
    - Increase downside weighting sharply
  - - Geopolitical restrictions tighten
    - Policy or procurement rules further narrow foreign adoption and exit pathways
    - Supports a larger discount versus U.S. peers
    - Reduce terminal-multiple assumptions and public-exit confidence
  notes: These are monitorable events that convert uncertainty into a decision change; they are not generic risks.
  claimRefs: [CV038, CV039, CV040, CV046]
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Standalone revenue quality
    - Revenue bridge by product, customer type, and related-party versus third-party mix
    - Distinguishes real market pull from parent-sponsored deployment
    - CFO package / board materials
  - - Cap table and downside structure
    - Liquidation preferences, anti-dilution, warrant economics, and full waterfall
    - Determines whether a fair enterprise value is still unattractive equity
    - Legal diligence on financing documents
  - - Customer reality
    - Named external customers, pilot-to-production conversion, and repeat-order evidence
    - Commercial proof is the main missing input between track and invest
    - Sales pipeline review and reference calls
  - - Manufacturing and reliability
    - Output, yield, uptime, service-burden, and field-failure metrics
    - Confirms whether end-2026 and 2027 claims are operationally credible
    - Operations diligence and plant review
  - - Compliance and support readiness
    - Safety, privacy, security, and field-support package for shared-space deployment
    - Large customers and public investors will underwrite these controls directly
    - Compliance review and customer implementation documents
  notes: Final diligence is intentionally narrow. Dogotix does not need ten more narratives; it needs proof on the few inputs that most directly drive valuation support.
  claimRefs: [CV039, CV040, CV041, CV045]
