      - number: '8.2'
        title: Financing Context, Entry Discipline, and What Investors Are Really Buying
        blocks:
          - type: paragraph
            body: >
              The central valuation fact is clear: Dogotix's August 2026 financing frames the company at about $6.3
              billion post-transaction and about $5.0 billion before the new money and employee-pool assumptions. The
              more important underwriting question is what that price actually buys. Public filing summaries show that
              the transaction is a carve-out financing around a business that is still operationally young, lossmaking,
              and in transition. XPeng remains the controlling shareholder, Dogotix remains dependent on transferred
              people and assets, and the most visible commercial path still starts inside the parent ecosystem.


              This means the valuation cannot be treated as if it were attached to a mature, standalone operating
              company. Dogotix disclosed 2024 and 2025 robotics losses plus net liabilities as of March 31, 2026, while
              the same filing package leaves key underwriting inputs private: liquidation waterfall detail beyond
              disclosed investor protections, unit economics, external revenue, and repeat-order data. XPeng's own cash
              position reduces near-term solvency pressure, and the financing meaningfully extends the time available to
              reach proof. But strong parent liquidity does not by itself justify Dogotix equity value. It mostly buys
              time.


              Entry discipline should therefore be milestone-based rather than multiple-based. Investors are not paying
              for a business with disclosed recurring revenue; they are paying for a scenario in which XPeng's
              physical-AI stack, manufacturing base, and distribution surfaces accelerate Dogotix past the point where
              ordinary humanoid startups stall. That can work, but it is still a forward-looking thesis rather than a
              current-fundamentals one.
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV013
              - CV014
              - CV017
              - CV018
              - CV019
              - CV043
              - CV044
