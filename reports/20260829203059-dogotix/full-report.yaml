chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Scope, and Carve-Out Structure
        blocks:
          - type: paragraph
            body: >-
              Dogotix is best understood not as a clean-sheet startup but as XPeng Group's humanoid-robotics business
              being externalized into a separately financed operating entity. The clearest primary-source evidence is
              the August 24, 2026 Dogotix Share Purchase Agreement disclosed through XPeng's Hong Kong and U.S. filings
              and echoed in XPeng's own announcement. Those materials show that XPeng is carving out assets,
              intellectual property, personnel, systems, and other operating resources tied primarily to its robotics
              business into Dogotix over an expected 18-month transition window. The carve-out excludes XPeng's
              automotive, robotaxi, flying-car, chip, and other Physical AI businesses, which matters because it keeps
              Dogotix focused on general-purpose robots and robotic systems rather than broad XPeng optionality. Public
              descriptions also define Dogotix's scope more widely than just one humanoid: the business covers humanoid,
              bipedal, quadrupedal, and tracked robots plus the licensing and commercialization around them. That
              breadth makes Dogotix strategically closer to a robotics platform subsidiary than to a single-product lab
              project, but the precise standalone legal, personnel, and asset perimeter will only become fully visible
              once the carve-out is completed and more detailed post-closing disclosures appear.
