  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Thesis, and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              Dogotix earns a TRACK recommendation with medium confidence and a high risk rating. The recommendation is
              not a verdict that the company is weak; it is a judgment that the current price already asks investors to
              pay for milestones that the public evidence has not yet fully proven. The strongest part of the thesis is
              strategic quality. Dogotix inherits XPeng's manufacturing discipline, in-house chip and autonomy stack,
              founder-level attention, and a controlled rollout path through XPeng stores, campuses, and operations. In
              a sector where many humanoid companies are still trying to assemble product, capital, and customer context
              at the same time, those are real advantages.


              The anti-thesis is valuation support. Dogotix was introduced to outside investors at roughly $5.0 billion
              pre-money and about $6.3 billion post-transaction even though public evidence still does not show
              standalone revenue, external customer count, backlog, realized unit economics, or a mature compliance and
              support package. The public record also shows that only $600 million of the headline financing is
              independent outside capital; the rest comes from XPeng and executive vehicles. That structure does not
              invalidate the round, but it does make the headline number a weaker clean-market signal than a fully
              third-party priced raise would have been.


              The practical implication is that Dogotix should be viewed as a price-sensitive follow list name. If it
              begins to convert XPeng's internal proving grounds into named external customers, publishes clearer
              manufacturing and deployment metrics, and demonstrates that 2026-2027 commercialization targets are real
              rather than aspirational, the recommendation can improve quickly. Until then, the most evidence-based
              stance is to track rather than chase.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
