  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >
              Dogotix is best understood as a robotics platform company rather than a single-device launch. XPeng's
              August 2026 announcement defines the carve-out around humanoid, bipedal, quadruped, and tracked robots
              together with the supporting hardware-software stack, data, and commercialization machinery. In workflow
              terms, the flagship IRON humanoid is positioned for tasks that benefit from a human-like form factor
              inside human-built spaces: greeting, navigation, guided service, logistics support, inspection, patrol,
              and selected light-industrial workflows. Public materials repeatedly frame XPeng's own stores and campuses
              as the first proving ground, which implies a customer workflow beginning in controlled environments before
              broader enterprise rollout. That matters because Dogotix is not promising a general household robot at
              launch; it is promising a robot that can be inserted into relatively structured commercial spaces where
              existing infrastructure and human tools already exist. The broader product scope beyond IRON matters
              strategically because it suggests Dogotix can pursue multi-form-factor embodied-AI revenue opportunities
              instead of depending on one humanoid SKU.
