            body: >
              Dogotix has almost no direct public retention evidence because the business is still pre-scale. No public
              source disclosed contract length, renewal rate, NRR, GRR, repeat-purchase behavior, or CSAT. The best
              durability signals are structural rather than numeric. First, XPeng-controlled deployments imply a lower
              risk of abrupt early churn while the product is still being refined. Second, a robot platform that becomes
              embedded in store operations, campus workflows, or factory processes could create meaningful switching
              costs through operator training, data loops, and integration effort. Third, the absence of external
              customer disclosures means investors cannot tell whether the company is hiding early failures or simply
              has not reached that stage yet. The correct diligence posture is to treat retention as unproven. There is
