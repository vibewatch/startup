      - number: '4.2'
        title: GTM Motion and Sales-Efficiency Proxies
        blocks:
          - type: paragraph
            body: >
              Dogotix's near-term GTM motion appears far more controlled than broad-based. Public reporting consistently
              says the first deployments are planned for XPeng stores and campuses before wider commercial deliveries in
              2027. That matters financially because an internal proving ground can reduce early customer-acquisition
              friction, compress implementation cycles, and generate data without immediately depending on third-party
              procurement. But it also weakens external read-through on sales efficiency. There is no public CAC,
              payback, conversion rate, pipeline coverage, or lighthouse-account disclosure. The best proxy is that
              XPeng already operates a nationwide retail and service footprint and is explicitly using those venues to
              validate IRON before wider commercialization. In other words, Dogotix may have an unusually cheap first
              channel because the parent subsidizes access, yet that does not prove repeatable sales efficiency in
              independent enterprise markets. Underwriting should separate internal incubation economics from true
              external customer acquisition.
