      - number: '1.2'
        title: Leadership, Control, and Governance
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence is strong on control and weak on full governance. What is well supported is that He
              Xiaopeng remains the ultimate operating sponsor: he said in June 2026 that he would personally assume the
              additional role of robotics-business CEO, and August financing documents show entities controlled by He
              and co-president Brian Gu investing alongside institutional backers. That combination signals unusually
              tight founder-level sponsorship for a business that XPeng increasingly frames as central to its broader
              "Physical AI" identity. Coverage around the June reorganization also describes a mobilization of roughly
              1,000 employees across automotive, manufacturing, testing, and general-intelligence functions, plus the
              creation of nine second-tier departments inside the robotics center. What remains thin is Dogotix's
              standalone board composition, delegated authority below He, minority-investor protections beyond the
              headline redemption rights, and the eventual management bench that will run the unit once the carve-out is
              operationally complete. For diligence, the implication is straightforward: Dogotix currently benefits from
              direct parent-company attention and decision velocity, but it also carries concentrated key-person risk
              and governance opacity that are unusually material for a business already priced at multi-billion-dollar
              scale.
