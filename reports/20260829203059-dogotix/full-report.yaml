      - number: '4.6'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >
              Financially, Dogotix is easiest to underwrite as a sponsored option on commercialization rather than as a
              business with verified revenue quality. The positive case is straightforward: the company has attracted
              top-tier capital, enjoys parent-company supply-chain and manufacturing leverage, and can use XPeng's
              internal venues to test deployments before broader rollout. The negative case is equally straightforward:
              no public standalone revenue base, no disclosed pricing, no public customer backlog, no verified
              support-cost structure, and only limited visibility into how software or service revenue will layer onto
              hardware sales. The disclosed losses and liabilities make clear that Dogotix is still in its investment
              phase. The right diligence posture is therefore to separate capital adequacy from economics. Capital
              adequacy is relatively strong today. Economics, customer quality, and margin path are still unresolved and
              should be treated as gating diligence items rather than assumable future truths.
