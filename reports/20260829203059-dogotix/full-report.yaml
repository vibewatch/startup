  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and the Initial Wedge
        blocks:
          - type: paragraph
            body: >
              Dogotix's early customer map is easiest to understand by separating the initial captive user from later
              external customers. The first buyer, payer, and operational design partner appears to be XPeng itself.
              Public reporting says IRON will first be deployed inside XPeng stores, campuses, and related controlled
              environments, with factory and assembly-line testing also reported during 2026. That makes the first
              customer segment an internal one: XPeng retail operations, XPeng campus operations, and XPeng
              manufacturing or service environments. Beyond that, the likely external customer segments are retail
              operators, logistics environments, inspection or security operators, and enterprise campuses that benefit
              from human-form-factor automation in brownfield spaces. In other words, Dogotix's initial wedge is not a
              broad horizontal robot launch. It is an internal-to-external adoption ladder where XPeng subsidizes the
              first proof points and external customers only arrive after product, safety, and support risks are
              reduced. This creates a rational commercialization sequence, but it also means public customer evidence
              today is more about the plausibility of adoption than about already proven external demand.
