      - number: '7.4'
        title: Partner, Dependency, People, and Customer Risk
        blocks:
          - type: paragraph
            body: >
              Dogotix has platform-level dependency risk because several core dependencies sit on top of the same
              sponsor. XPeng provides capital, the first deployment network, manufacturing leverage, and founder-level
              attention. If any one of those weakens, the others become harder to rely on. Additional dependencies
              include advanced chips, actuation and dexterity performance, embodied-data collection, regulatory
              acceptance, and a field-support organization that is not yet publicly described. People risk is also high.
              He Xiaopeng's visible sponsorship is a positive signal, but it also underscores key-person concentration
              and limited public visibility into the broader management bench. Customer dependency compounds this
              further: the first and strongest customer surface is internal to XPeng, which means customer concentration
              and related-party optics are meaningful. This is an unusually interlocked company at an unusually early
              stage for its valuation.
