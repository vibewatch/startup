            body: >
              Public safety and trust signals exist, but they are still mostly company-authored. Official descriptions
              emphasize a fully enclosed flexible lattice structure, soft-touch or human-interaction-oriented design
              choices, and automotive-grade manufacturing discipline. Those are encouraging design intents. However, the
              public record does not yet show a robot-specific certification package, third-party safety audit,
