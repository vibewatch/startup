            body: >
              The disclosed traction metrics are mostly operational, not financial. XPeng says Dogotix targets end-2026
              mass production and initial deployment in its own stores and campuses, with broader 2027 deliveries to
              China and overseas markets. Product pages and third-party writeups describe increasingly ambitious
              hardware milestones, but that does not equal recognized revenue. The clearest public financial metrics for
              the robotics business are actually the adverse ones in the filing package: unaudited net losses of RMB87
              million in 2024 and RMB369 million in 2025, plus net liabilities of about RMB447 million as of March 31,
              2026. At the parent level, XPeng reported Q2 2026 revenue of RMB19.74 billion, gross margin of 20.7%, cash
