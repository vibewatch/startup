      - number: '1.5'
        title: Milestones, Commercial Path, and Remaining Gaps
        blocks:
          - type: paragraph
            body: >-
              Dogotix's near-term commercial story is built around a narrow but plausible sequence of milestones. XPeng
              says IRON was unveiled in late 2025, entered a mass-production sprint in 2026, and is targeted to begin
              mass production by the end of 2026 with monthly output above 1,000 units. Public coverage indicates that
              first deployments will start inside XPeng's own stores and campuses before broader 2027 sales to retail
              and service-industry customers in China and overseas. That internal-first rollout is strategically
              conservative because it creates a controlled environment for collecting data, proving reliability, and
              refining the human-robot interaction model before larger third-party commitments. At the same time, public
              evidence remains meaningfully incomplete. There is no disclosed standalone customer count, no audited
              commercial-order backlog, no public Dogotix board roster, and no independently verified data on headcount,
              production yield, or realized unit economics. Analysts have welcomed the independent valuation benchmark
              and the reduced burden on XPeng's balance sheet, but even supportive coverage acknowledges that production
              execution and actual commercial orders will determine whether the $6.3 billion implied value translates
              into durable enterprise value. In other words, Dogotix now has capital and visibility; it still has to
              earn proof.
