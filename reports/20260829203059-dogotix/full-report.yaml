      - number: '2.5'
        title: Reachable SOM and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              A useful Dogotix market view therefore needs three layers. The outer layer is the headline humanoid TAM
              supplied by bullish research houses and sell-side strategists. The middle layer is a nearer-term SAM built
              around structured enterprise workflows in manufacturing-adjacent campuses, logistics, inspection,
              security, and customer-facing service. The innermost layer is Dogotix's realistic SOM over the next one to
              three years, which is likely limited to XPeng-controlled venues plus a small set of external lighthouse
              accounts willing to pilot a still-maturing platform. Public evidence is not yet detailed enough to
              quantify that SOM with high confidence, because Dogotix has not disclosed realized pricing, segment
              conversion rates, service attach, or customer concentration. Even so, the buyer map suggests a rational
              path: use captive parent-company environments to collect data and de-risk reliability, then expand into
              enterprise segments where brownfield fit and labor economics are most favorable. If Dogotix attempts to
              leap directly from showcase demos to broad multi-vertical deployment, the market looks bigger than it
              really is; if it sequences entry through high-friction but structured enterprise tasks, the opportunity is
              smaller near term but more credible.
            claimRefs:
              - CM012
              - CM015
              - CM020
              - CM021
              - CM031
              - CM032
              - CM033
              - CM034
              - CM035
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape Overview and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Dogotix competes in at least three overlapping arenas. The first is China's commercial humanoid race,
              where Unitree and AgiBot have the strongest publicly visible shipment scale and where UBTech offers a more
              enterprise- and public-market-oriented benchmark. The second is the globally watched venture-backed
              humanoid cohort led by Figure, Apptronik, and Agility, where AI integration, partner deployments, and
              capital formation shape perception even before large shipment volumes are visible. The third is the
              substitute set that matters most in real buying decisions: human labor, fixed industrial automation,
              AMRs/AGVs, and other narrower service robots. Dogotix's disclosed scope across humanoid, quadruped, and
              tracked systems gives it broader product adjacency than a single-humanoid startup, but its initial
              commercial wedge still competes against both robotics-native peers and existing automation stacks. The
              market is early enough that commercial readiness, support infrastructure, and data loops matter more than
              any one spec sheet. That is why Dogotix's competitive posture should be framed as capital-strong but
              proof-moderate rather than simply "well funded."
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
