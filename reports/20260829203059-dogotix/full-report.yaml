      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Dogotix's buyer map is more enterprise-like than consumer-like, even if the robot form factor is highly
              anthropomorphic. The first buyer is effectively XPeng itself: public reporting says IRON will start inside
              XPeng stores and campuses, making the parent both an internal design partner and the initial proving
              ground. Beyond that, the most plausible early segments are industrial campuses and logistics environments,
              campus-security and inspection operators, retail and service venues seeking customer-facing automation,
              and selected international markets where labor costs make automation economics easier to justify. In those
              settings, the buyer and payer are typically enterprise operations, facilities, or automation budgets,
              while end users are front-line workers, site managers, or customer-service teams. Bain's analysis and
              Morgan Stanley's forecast both point toward repetitive, structured commercial work as the earliest
              commercial wedge, not broad household adoption. Dogotix's own disclosed use cases—retail, industrial
              campuses, smart home, logistics, power inspection, and security—also imply multiple buyer personas rather
              than one monolithic TAM. The underwriting challenge is that Dogotix has not yet publicly shown which of
              those segments convert fastest or generate the best lifetime economics.
