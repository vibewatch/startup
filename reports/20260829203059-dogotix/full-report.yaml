      - number: '4.3'
        title: Cost Structure, Capex, and Unit Economics
        blocks:
          - type: paragraph
            body: >
              Dogotix's cost stack is visible mostly by implication. XPeng's August announcement says financing proceeds
              will be used for hardware and software R&D, physical-AI model training, high-quality data collection,
              full-chain mass-production-base construction, and global commercialization. That implies a cost structure
              spanning specialized components, compute, model training infrastructure, factory build-out, quality
              systems, and field support. Product disclosures add additional clues. IRON uses three in-house Turing
              chips, high-degree-of-freedom hands, and anthropomorphic hardware, all of which likely create an expensive
              initial bill of materials before scale learning lowers cost. At the same time, XPeng argues that its
              automotive-grade supply chain and manufacturing capabilities should improve yield and cost discipline
              relative to startup-only peers. Public evidence does not yet support a bottom-up unit-economics model, but
              it does support directional conclusions: Dogotix is capital intensive, benefits from parent-company
              manufacturing leverage, and will require much higher shipment volume before gross margin quality can be
              judged. The absence of disclosed list price or realized pricing is the single biggest hole in the current
              financial underwriting picture.
