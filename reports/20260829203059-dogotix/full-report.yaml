              - CR035
      - number: '7.3'
        title: Operational, Quality, Reliability, and Security Risk
        blocks:
          - type: paragraph
            body: >
              Operational risk is the most immediate thesis-break category. Dogotix is trying to move from technical
              demonstration and internal pilots to high-frequency real-world deployment in customer-facing or
              operational environments. That creates multiple failure modes. A safety incident in a showroom, campus, or
              factory environment could trigger reputational damage well beyond the affected site. A manufacturing ramp
              miss would undercut both commercialization timing and investor confidence. Weak field reliability would be
              especially damaging because humanoid robots already face skepticism on ROI and support burden.
              Cybersecurity and privacy are also nontrivial risks because any connected robot platform with cameras,
              microphones, and software updates expands the attack surface. The public record provides encouraging
              design-intent signals, but very little independent evidence on failure rates, security testing, support
              tooling, or incident response readiness. Until those gaps are closed, operational underwriting should stay
              conservative.
            claimRefs:
              - CR018
              - CR019
              - CR020
              - CR021
