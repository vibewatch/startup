  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Logic
        blocks:
          - type: paragraph
            body: >
              Public evidence does not yet show Dogotix as a mature revenue business; it shows a financing story that
              presumes future hardware, software, and service monetization. XPeng's public comments and independent
              coverage imply three revenue layers. First is hardware revenue from IRON and other robot platforms. Second
              is a software or upgrade layer. CnEVPost reports management saying hardware sales plus software-upgrade
              revenue could make each robot's lifetime gross profit contribution materially higher than the automotive
              business. Third is deployment, support, and commercialization work attached to enterprise rollout,
              although those services are not separately broken out in current public disclosures. What is still missing
              is the most important revenue-quality evidence: price cards, contract structure, warranty terms, service
              attach, recognition policy, and segment mix. Unlike a pure software company, Dogotix must absorb heavy
              hardware cost and support burden before recurring economics become visible. Investors should therefore
              treat the revenue model as plausible but not yet evidenced by standalone disclosed revenue, backlog, ARR,
              or customer-usage disclosures.
