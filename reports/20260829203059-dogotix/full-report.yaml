            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
      - number: '8.5'
        title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >
              The most credible exit path for Dogotix is a later China or Hong Kong market listing, or a private-market
              re-rating ahead of one, rather than a near-term global strategic sale. The company's domicile,
              parent-company control, and the increasing policy sensitivity around Chinese-origin advanced robots make a
              premium Western strategic exit less dependable than for a comparable U.S. robotics company. That does not
              remove exit optionality, but it does support a structural discount versus the most celebrated U.S.
              humanoid names.


              The recommendation would improve if Dogotix supplies a small set of concrete proofs: named non-XPeng
              production customers, manufacturing-output and reliability disclosure that shows the 2026-2027 ramp is
              real, a revenue or unit-economics bridge, and a clearer compliance, privacy, safety, and field-support
              package. Those items matter because they would convert the story from sponsor-backed possibility into
              independently underwritable enterprise value.


              The thesis would weaken materially if Dogotix reaches mid-2027 without visible external commercialization,
              if output and deployment targets slip without explanation, if safety or privacy incidents emerge during
              rollout, or if IPO or redemption pressure begins to substitute for product-led value creation. The
              diligence agenda is therefore straightforward: prove customer reality, prove manufacturing reality, prove
              economics, and prove downside structure.
            claimRefs:
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
              - CV046
