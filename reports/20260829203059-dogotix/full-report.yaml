      - number: '7.5'
        title: Financial / Model Risk, Mitigations, and Kill Criteria
        blocks:
          - type: paragraph
            body: >
              Financial risk is not about immediate insolvency; it is about whether the company can convert large
              amounts of capital into proof before obligations and expectations catch up. Public disclosures show
              robotics losses, net liabilities, heavy expected spend on R&D, data, facilities, and commercialization,
              plus contractual redemption rights if a qualified IPO is not achieved in seven years. That means Dogotix
              is financed into proof, not yet into durable economics. The mitigating factors are real: the round is
              large, XPeng remains well capitalized, and the company can use internal deployment surfaces to learn
              faster than a pure startup could. But mitigation maturity still looks intermediate rather than proven.
              Investors should watch for concrete triggers: verified external customer additions, reliable field
              performance, evidence of compliance readiness for shared-space deployment, manufacturing output that
              matches the roadmap, and any sign that IPO-or-redemption pressure is moving closer rather than farther
              away.
