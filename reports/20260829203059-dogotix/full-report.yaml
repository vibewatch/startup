      - number: '8.3'
        title: Comparable Set and Why Dogotix Looks Richer Than Its Proof
        blocks:
          - type: paragraph
            body: >
              Dogotix should be valued against milestone-appropriate robotics references, not against mature software
              companies or against a single sensational humanoid outlier. The most relevant lower anchor is Unitree.
              Public 2025-2026 coverage indicates that Unitree entered IPO preparation after surpassing RMB 1 billion of
              revenue and reaching a post-Series C valuation above RMB 12 billion, or about $1.6-$1.7 billion. That is a
              much lower valuation than Dogotix's, but it comes with stronger public commercialization evidence: real
              revenue, published pricing, and broader market availability.


              The most relevant mid-tier private anchor is Apptronik. Apptronik's February 2026 extension round brought
              total Series A financing to more than $935 million and external reporting placed the company around a $5
              billion valuation. Apptronik also has publicly named commercial agreements with Mercedes-Benz, GXO
              Logistics, and Jabil. Dogotix benefits from a stronger parent industrial base than Apptronik, but
              Apptronik has offered the market a cleaner independent-company funding history and more explicit partner
              proof.


              Figure is the sentiment-setting upper bound, not the clearing price. Figure officially disclosed more than
              $1 billion of Series C capital at a $39 billion post-money valuation, but even sympathetic analysts
              describe that mark as heavily dependent on future execution rather than present revenue. Public-company
              and public-market anchors are still scarce; UBTech's roughly HK$42 billion market cap and 13x-plus sales
              ratio are useful context, but the broader sector remains priced mainly on private rounds, narrative
              leadership, and expected manufacturing milestones. Against that backdrop, Dogotix's $6.3 billion mark is
              not irrational, but it is ahead of its own public proof.
            claimRefs:
              - CV015
              - CV016
              - CV020
              - CV021
              - CV022
              - CV023
