      - number: '1.4'
        title: Funding, Valuation, and Balance-Sheet Reality
        blocks:
          - type: paragraph
            body: >-
              The financing structure is unusually well disclosed for a newly externalized robotics asset. XPeng's
              filings and multiple independent reports align on roughly $900 million of immediate commitments, broken
              into $600 million from outside investors, $200 million from XPeng's wholly owned subsidiary XPeng Dogotix,
              and $100 million from entities controlled by He Xiaopeng and Brian Gu. The same filing framework also
              allows up to $15 million from an additional investor on the same terms and warrants that could let the
              executive vehicles subscribe for another $500 million later. The headline valuation is a $5.0 billion
              pre-transaction value and about $6.3 billion post-transaction value assuming full utilization of the 2026
              equity incentive plan; XPeng would fall from 100% ownership to about 81.97% on closing and to about 68.41%
              under the fully diluted scenario while still consolidating the business. That valuation is large, but it
              is being attached to an operation whose disclosed management accounts show early-stage losses: net losses
              of RMB87 million in 2024 and RMB369 million in 2025, plus net liabilities of about RMB447 million as of
              March 31, 2026. The result is a business that is clearly financeable and strategically sponsored, yet
              still economically pre-proof and dependent on future commercialization to justify the price.
