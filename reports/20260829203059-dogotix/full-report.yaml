      - number: '6.3'
        title: Adoption Trajectory and Deployment Funnel
        blocks:
          - type: paragraph
            body: >
              Dogotix's adoption trajectory appears to run through a staged deployment funnel rather than a wide-open
              go-to-market motion. The sequence supported by public reporting is: internal testing and pilot production
              in Guangzhou, use in XPeng factories or assembly-related environments, rollout into XPeng showrooms or
              stores for customer-facing tasks, and only later broader commercialization in China and overseas. That
              sequence makes economic and product sense because customer-facing robots need real-world exposure before
