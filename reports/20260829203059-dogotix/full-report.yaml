  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              For Dogotix, the relevant market is not "all robotics" and not even the entire theoretical humanoid
              universe. The investable boundary is narrower: near-term spend on general-purpose or semi-general-purpose
              robots that can operate inside human-built environments and perform service, logistics, campus,
              inspection, security, or light industrial tasks with minimal brownfield retrofit. XPeng's disclosures
              reinforce that framing. Dogotix is being carved out specifically around humanoid, bipedal, quadrupedal,
              and tracked robots, while XPeng's automotive, robotaxi, flying-car, and chip businesses remain outside the
              perimeter. That means the chapter should treat Dogotix as participating in embodied-AI automation, not as
              a proxy for all Physical AI. The main substitutes are still status-quo human labor, fixed industrial arms,
              AMRs/AGVs, and task-specific service robots. Bain and IFR both make clear that humanoids become
              interesting precisely when they can work in existing environments, use the same tools or pathways as
              humans, and reduce labor dependence without major infrastructure change. Dogotix's market relevance
              therefore depends on whether its robots can outperform or complement these narrower alternatives in
              high-friction physical workflows.
