      - number: '7.2'
        title: Regulatory, Legal, Privacy, and Export-Control Risk
        blocks:
          - type: paragraph
            body: >
              Regulatory risk is material even without a Dogotix-specific enforcement event today. Shared-space humanoid
              deployment raises product-safety, workplace-safety, privacy, and AI-governance questions that are more
              complex than those facing industrial robots behind barriers. Dogotix also faces cross-border exposure if
              it tries to commercialize outside China in 2027 as publicly suggested. The EU AI Act, expanding state and
              international privacy regimes, and U.S. export-control scrutiny around advanced chips and AI-adjacent
              technologies all create potential friction. The core issue is not that Dogotix is already in violation;
              there is no public evidence of that. The issue is that the company has not yet published the kind of
              robot-specific certification, privacy, security, and compliance package that would let outside investors
              discount these risks confidently. Financing structure also adds a legal-financial layer: investor
              redemption rights tied to a qualified IPO within seven years create a contractual obligation that can
              become operationally important if commercialization lags.
