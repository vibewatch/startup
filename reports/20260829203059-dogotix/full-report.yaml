            body: >
              Public evidence supports a recognizably full-stack architecture even if the exact technical documentation
              remains thin. XPeng's official materials describe a stack covering the robot body, brain, cerebellum,
              data, and infrastructure. Across official and credible secondary summaries, IRON is associated with
              anthropomorphic mechanical design, dexterous hands, on-device AI compute through multiple Turing chips,
