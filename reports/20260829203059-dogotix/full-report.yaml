      - number: '1.3'
        title: Product, Technology, and Operating Profile
        blocks:
          - type: paragraph
            body: >-
              Dogotix's flagship product is the IRON humanoid robot, and XPeng's own materials emphasize anthropomorphic
              design, on-device intelligence, and automotive-style safety and manufacturing discipline. The August 2026
              financing announcement describes IRON as an AI-driven, highly human-like general-purpose platform backed
              by a full-stack hardware-software stack covering the robot body, the "brain," the "cerebellum," data, and
              infrastructure. XPeng's product materials and press coverage add more concrete specifications: IRON is
              described with 76 body degrees of freedom, 21 degrees of freedom per hand, a fully enclosed flexible
              lattice structure meant to improve both appearance and safety, and three in-house Turing AI chips
              delivering a combined 2,250 TOPS. XPeng claims that this compute stack lets the robot complete complex
              tasks autonomously without remote teleoperation, although that autonomy claim still deserves independent
              field validation. Just as important, Dogotix is not framed only as a humanoid effort. Management and media
              coverage repeatedly mention quadruped and tracked robots for smart home, logistics, power inspection, and
              security use cases. That broader portfolio matters because it suggests Dogotix is meant to commercialize a
              full embodied-AI platform rather than depend entirely on one humanoid launch cycle.
