  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >
              Dogotix should be treated as a high-risk commercialization program rather than a de-risked robotics
              operator. The first reason is evidence asymmetry: public materials show strong funding, strong strategic
              sponsorship, and an ambitious roadmap, but only limited disclosure on third-party deployments,
              reliability, certification, support operations, and external customer retention. The second reason is risk
              coupling. A delay in manufacturing scale-up does not only hit shipments; it can also weaken customer
              trust, stretch cash burn, and bring financing pressure forward. The third reason is exposure
              concentration. XPeng is simultaneously Dogotix's parent, first channel, first proving ground, likely
              manufacturing backbone, and a major source of strategic credibility. That alignment creates speed but also
              systemic dependency. Finally, Dogotix is entering a regulatory environment that is becoming less forgiving
              on AI, data, safety, and advanced technology exports. The company may have a path through these risks, but
              the current public evidence does not justify a low-risk posture.
