      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >
              Scenario analysis is the only disciplined way to evaluate Dogotix from public evidence because the company
              has not disclosed the operating metrics needed for a conventional intrinsic-value model. The bull case
              assumes that the end-2026 manufacturing goal becomes visibly real, XPeng-linked pilots translate into
              named third-party deployments in 2027, and Dogotix proves that its robot can deliver useful work with
              manageable support burden. In that case, the current valuation can expand because the company would look
              less like an incubated promise and more like a scaled embodied-AI platform with unusually strong
              industrial backing.


              The base case assumes that Dogotix does make technical and manufacturing progress, but the proof remains
              mostly internal and the market continues to apply a discount for related-party commercialization, sparse
              economics disclosure, and geopolitical uncertainty. Under that path, today's price is roughly fair to
              slightly stretched, and investor returns depend more on later proof than on immediate re-rating.


              The bear case is not insolvency; it is proof slippage. If manufacturing scale, external customer
              conversion, or safety and compliance readiness lag into or beyond 2027, Dogotix could be repriced more
              like a richly funded project than a high-conviction growth platform. Because public evidence is thin on
              revenue quality and downside protections, the current mark leaves only a modest margin of safety outside
              the bull case.
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
          - type: table
            tableRef: TV003
            claimRefs:
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
          - type: figure
