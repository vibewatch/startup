companyProfile:
  summary: Dogotix is XPeng's newly externalized humanoid robotics business, financed in August 2026 as a separately capitalized but still parent-controlled operation. Public evidence supports a broader embodied-AI platform scope beyond only the IRON humanoid, with commercial ambitions spanning retail, campuses, logistics, inspection, and security workflows. The company's biggest strengths are XPeng-derived manufacturing, chips, and rollout surfaces; its biggest weakness is that external customer, revenue, and unit-economics proof still lag the multi-billion-dollar valuation.
  foundedDate: '2026-08-24'
  founders:
    - name: He Xiaopeng
      role: XPeng founder, chairman, and robotics-business CEO sponsor
      background: XPeng's founder-chairman who publicly took on the robotics-business CEO role in 2026 and remains the central strategic sponsor of Dogotix.
      claimRefs: [CO018, CO021]
  foundingLocation: Guangzhou, China
  headquarters: Guangzhou, China
  productSummary: Dogotix's flagship public product is the IRON humanoid, but the carve-out scope also includes bipedal, quadrupedal, and tracked robots plus the associated embodied-AI stack across body, brain, cerebellum, data, and infrastructure.
  customerFocus: Public customer proof is currently concentrated inside XPeng's own ecosystem, with stores, campuses, and factory-related environments acting as the first proving grounds before broader external commercialization.
  businessModel: Mixed robotics model built around hardware commercialization, deployment and integration work, and longer-term software, data, and support value if Dogotix can convert internal pilots into repeat external demand.
  stage: private, post-Series A carve-out
  fundingStatus: Dogotix announced more than $900M of initial financing in August 2026 at a $5.0B pre-money and roughly $6.3B post-transaction valuation, with about $600M from outside investors and XPeng retaining control after closing.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO011, CO012, CO015, CO018, CO025, CO033, CO034, CU006, CV001, CV005, CV042]
