  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: safety-and-certification
    missingEvidence: Robot-specific certification package, safety audits, incident-response plan, and deployment SOPs for shared-space operation.
    whyItMatters: Shared-space deployment is one of the biggest differentiators and one of the biggest downside vectors.
    diligencePath: Request certification documents, audit reports, safety cases, and post-incident playbooks.
    relatedQuestionRefs: [QR006, QR011, QR012, QR015]
    relatedTableRefs: [TR001, TR002]
  - type: private-evidence-only
    severity: material
    topic: privacy-and-security-governance
    missingEvidence: Data-governance architecture, retention and consent rules, security testing results, and disclosure program.
    whyItMatters: Connected robots in customer-facing settings create governance exposure before they create scale revenue.
    diligencePath: Review privacy impact assessments, red-team or pen-test summaries, logging policies, and disclosure workflow.
    relatedQuestionRefs: [QR008, QR015, QR016]
    relatedTableRefs: [TR001, TR002]
  - type: private-evidence-only
    severity: material
    topic: external-proof-and-support
    missingEvidence: Non-XPeng production customers, support-organization design, SLAs, and field reliability dashboards.
    whyItMatters: The current public story is still too internally anchored to prove repeatable external commercialization.
    diligencePath: Request customer references, support staffing, uptime data, and maintenance logs.
    relatedQuestionRefs: [QR014, QR019, QR030]
    relatedTableRefs: [TR002, TR003, TR004]
  - type: private-evidence-only
    severity: material
    topic: financing-contingency
    missingEvidence: Detailed path from current financing to qualified IPO or other liquidity without triggering redemption stress.
    whyItMatters: Redemption rights and capital intensity can turn long-dated governance terms into near-term financing pressure if progress slips.
    diligencePath: Review financing model, legal triggers, downside scenarios, and board contingency planning.
    relatedQuestionRefs: [QR010, QR023, QR027, QR028]
    relatedTableRefs: [TR001, TR005]
