chapter:
  number: 3
  title: Competitors
  summary: Dogotix enters humanoid robotics with exceptional capitalization and XPeng manufacturing support, but it faces stronger public proof from Unitree and AgiBot in China and stronger AI narrative or platform partnerships from U.S. peers such as Figure, Apptronik, and Agility. The competitive question is not whether Dogotix belongs in the top tier of funded players—it does—but whether its lack of public pricing and limited external customer proof leave it behind the leaders on commercialization readiness.
sections:
- id: landscape-overview
  title: Landscape Overview and Status-Quo Alternatives
  body: 'Dogotix competes in at least three overlapping arenas. The first is China''s commercial humanoid race, where Unitree and AgiBot have the strongest publicly visible shipment scale and where UBTech offers a more enterprise- and public-market-oriented benchmark. The second is the globally watched venture-backed humanoid cohort led by Figure, Apptronik, and Agility, where AI integration, partner deployments, and capital formation shape perception even before large shipment volumes are visible. The third is the substitute set that matters most in real buying decisions: human labor, fixed industrial automation, AMRs/AGVs, and other narrower service robots. Dogotix''s disclosed scope across humanoid, quadruped, and tracked systems gives it broader product adjacency than a single-humanoid startup, but its initial commercial wedge still competes against both robotics-native peers and existing automation stacks. The market is early enough that commercial readiness, support infrastructure,
    and data loops matter more than any one spec sheet. That is why Dogotix''s competitive posture should be framed as capital-strong but proof-moderate rather than simply "well funded."'
