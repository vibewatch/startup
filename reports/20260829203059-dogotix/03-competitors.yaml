- id: competitor-profiles
  title: Key Competitor Profiles
  body: 'Among Chinese peers, Unitree is the most dangerous benchmark because it combines mass-production credibility, low published pricing, and unusually visible commercial scale. Humanoid Index describes it as a 2016 Hangzhou company with 1,000-plus employees, 5,500-plus units shipped in 2025, and a planned IPO around $7 billion. AgiBot is similarly important because it couples high shipment volume and manufacturing momentum with a younger, fast-scaling profile; Humanoid Index and Humanoids Daily describe 5,100 units shipped in 2025 and a later 10,000-unit threshold as proof of scale leadership. UBTech matters less on startup velocity and more on enterprise, education, and public-company credibility. Outside China, Figure represents the strongest AI-and-brand benchmark, with a BMW deployment story and the highest disclosed valuation in humanoid robotics. Apptronik matters as a commercialization peer because it combines Apollo, a RaaS posture, and large capital raises with manufacturing
    partnerships. Agility is smaller in valuation terms but important because it has focused on logistics workflows and commercial warehouse deployment. Dogotix sits between these clusters: it has capital and parent-company depth that look world-class, but its external market proof is still thinner than the strongest Chinese leaders and less independently documented than the best-known U.S. narratives.'
