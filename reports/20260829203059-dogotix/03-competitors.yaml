- id: moat-durability-and-risk
  title: Moat Durability, Switching Costs, and Competitive Risk
  body: Dogotix's moat claims are real but mostly medium-durability rather than permanent. XPeng's full-stack chips, AI models, and manufacturing system are valuable because few humanoid startups also control automotive-scale hardware operations. The captive parent channel also offers data collection and a low-friction place to iterate before broad external sales. But competitors have powerful counters. Unitree's scale and pricing threaten commoditization from below; AgiBot's production momentum and factory evidence threaten Dogotix on execution proof; Figure and Apptronik threaten on AI narrative, platform partnerships, and investor attention; Agility threatens on use-case specificity. Switching costs across the category are still relatively low because most customers are in pilot or early deployment phases and standards are unsettled. Real lock-in, where it exists, comes from integration, workflow tuning, service support, and the accumulation of deployment data—not from brand alone. That
    means Dogotix can still win share if it proves reliability and ROI quickly, but it cannot assume that today's capital lead or parent-company prestige will stay decisive for long.
