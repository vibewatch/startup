  title: Pricing / packaging comparison
  columns:
  - Company
  - Published price / model
  - Included capability signal
  - Unknowns / discount opacity
  - Implication
  rows:
  - - Dogotix
    - Not publicly disclosed
    - General-purpose humanoid with on-device AI and captive initial rollout
    - List price, service model, and deployment bundle undisclosed
    - Hard for market to benchmark ROI versus peers
  - - Unitree
    - Public low-end humanoid pricing visible on product pages
    - High-volume commercial hardware positioning
    - Enterprise discounting not fully public
    - Creates commoditization pressure from below
  - - AgiBot
    - Public funding and shipment data clearer than price card
    - Manufacturing-oriented humanoid portfolio
    - Exact customer contract pricing still limited
    - Scale proof offsets some price opacity
  - - UBTech
    - Solution-led rather than startup price-card narrative
    - Enterprise and education orientation
    - Contract pricing opaque
    - Competes more on enterprise trust than sticker price
  - - Figure / Apptronik / Agility
    - Pilot, partner, or service-led models dominate public narrative
    - Partner deployments and workflow-specific pitches
    - Exact list pricing generally opaque
    - Dogotix is not alone in price opacity, but peers offset it with more partner proof
  notes: The main signal is not that peers all publish clean price cards; it is that Dogotix lacks an alternative public benchmarking anchor such as broad third-party deployment proof.
