  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Dogotix price-performance gap
    missingEvidence: Dogotix list pricing, deployment bundle, service model, and real-world cost-performance case studies versus major peers.
    whyItMatters: Without public price-performance evidence, Dogotix is harder to compare credibly against lower-priced Chinese rivals or service-led U.S. peers.
    diligencePath: Request pricing architecture, pilot economics, and unit cost targets from management.
    relatedQuestionRefs:
    - QP012
    - QP020
    - QP023
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: Dogotix external customer proof
    missingEvidence: Named third-party deployments, production customers, renewal evidence, and external service performance metrics.
    whyItMatters: Competitively, Dogotix needs independent proof that captive XPeng venues convert into broader enterprise demand.
    diligencePath: Obtain lighthouse customer references, deployment KPIs, and support metrics.
    relatedQuestionRefs:
    - QP011
    - QP022
    relatedTableRefs:
    - TP001
    - TP004
  - type: conflicting-data
    severity: minor
    topic: tracker-based competitor metrics
    missingEvidence: Standardized cross-vendor shipment and funding methodology across humanoid tracker sources.
    whyItMatters: Cross-competitor comparisons can overstate precision because trackers and media outlets measure different things.
    diligencePath: Normalize competitor metrics using original filings, official releases, and common definitions before using them in IC materials.
    relatedQuestionRefs:
    - QP024
    - QP025
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: switching-cost evidence
    missingEvidence: Customer interviews or deployment evidence showing actual integration lock-in, retraining cost, and workflow switching barriers.
    whyItMatters: Moat durability depends on whether customers become operationally sticky after deployment or continue to multi-home across vendors.
    diligencePath: Interview pilot customers and integrators on migration cost, retraining burden, and support dependence.
    relatedQuestionRefs:
    - QP016
    - QP017
    relatedTableRefs:
    - TP004
