- id: capability-pricing-and-distribution
  title: Capability, Pricing, and Distribution Comparison
  body: 'Dogotix''s strongest publicly advertised differentiators are not a published price or a disclosed installed base but XPeng-derived manufacturing, chips, and internal deployment surfaces. XPeng claims on-device inference through three Turing chips, automotive-grade manufacturing discipline, and a controlled initial rollout through XPeng stores and campuses. Those are meaningful advantages, especially against venture-backed companies that still lack industrial-scale parents. Yet competitive comparison becomes harder precisely where real buyers care most. Unitree publishes far more visible product and shipment context; AgiBot has stronger public evidence on production milestones; Figure and Apptronik have stronger market narratives around platform maturity and partner deployments; Agility has the clearest warehouse-focused wedge. Dogotix''s pricing is not publicly disclosed, which means buyers and investors cannot benchmark cost-performance against Unitree''s lower published price
    points or against U.S. robots pitched through service or pilot models. Distribution is similarly mixed: XPeng-controlled venues are a powerful captive proving ground, but they are not the same as a broad independent channel or a list of third-party enterprise deployments. In competitive terms, Dogotix is unusually well sponsored but still partially opaque.'
