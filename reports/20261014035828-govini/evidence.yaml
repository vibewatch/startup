evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding-total
    missingEvidence: A company cap table and complete financing schedule reconciling the $150M, $170M, and $174.5M totals.
    whyItMatters: >-
      Total capital, ownership, dilution, and investor rights cannot be assessed reliably from incompatible aggregator
      coverage.
    diligencePath: Request the fully diluted cap table, stock purchase documents, financing ledger, and cash receipts by round.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Verified customer count, exact current headcount, transaction valuation, recognized revenue, retention, and
      customer concentration.
    whyItMatters: >-
      ARR and contract access do not establish revenue quality, operating leverage, or dependence on a small number of
      programs.
    diligencePath: >-
      Obtain audited financials, ARR bridge, customer cohort schedule, contract-level revenue, HR roster, and the Bain
      transaction documents.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: enumeration-incomplete
    severity: material
    topic: governance-and-stakeholders
    missingEvidence: >-
      Complete leadership roster, board composition, cap table, investor rights, customer list, and post-incident
      governance review.
    whyItMatters: >-
      The public leadership and stakeholder tables cannot establish control, succession depth, concentration, or
      remediation quality.
    diligencePath: >-
      Request board minutes, committee charters, organization chart, cap table, customer register, and incident-response
      materials.
    relatedQuestionRefs:
      - QO002
      - QO003
      - QO006
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: >-
      Publicly verifiable standard pricing schedules, seat-based license fees, and net retention metrics for Ark
      deployments.
    whyItMatters: >-
      Without disclosed contract unit pricing and renewal rates, precise bottom-up serviceable obtainable market
      calculations and recurring SaaS margin durability cannot be validated independently.
    diligencePath: >-
      Review unredacted task orders under the Army IDIQ, inspect GSA schedule price lists if filed, and interview
      defense procurement contracting officers.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: program-level-adoption
    missingEvidence: >-
      Granular breakdown of active seat utilization and conversion rates from enterprise IDIQ contract ceilings to
      deployed operational workflows across individual military services.
    whyItMatters: >-
      Broad agency-wide contract ceilings (such as the DoW-wide IDIQ) indicate procurement accessibility but do not
      measure actual user adoption density across program offices.
    diligencePath: Request program-of-record deployment audits and seat utilization metrics during direct sponsor diligence.
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-and-discounting-transparency
    missingEvidence: >-
      Audited schedule of realized enterprise discount schedules and per-seat tiering volume breaks across DoD service
      branches.
    whyItMatters: >-
      While list pricing of ~$150,000/seat is observed in public Navy contracts, realized discounting across
      multi-hundred-seat DoD enterprise deployments directly governs gross margins and ARR expansion velocity.
    diligencePath: Request confidential contract pricing exhibits and renewal schedules during management diligence sessions.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-margins
    missingEvidence: Audited GAAP gross margins, hosting and data pipeline COGS, and customer acquisition cost (CAC) payback periods.
    whyItMatters: >-
      Without verified margin structure, it is impossible to validate whether enterprise defense contracts yield
