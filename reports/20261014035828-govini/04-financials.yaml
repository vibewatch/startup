callouts:
  - calloutType: insight
    title: B2G SaaS Seat Pricing and Revenue Quality
    body: Govini demonstrates software-grade pricing power with reported contract benchmarks near $150,000 per seat annually, positioning Ark as mission-critical infrastructure rather than commodity business intelligence. However, the lack of customer retention metrics leaves expansion durability unverified.
    claimRefs:
      - CI004
      - CI005
      - CI015
  - calloutType: risk
    title: Contract Vehicle Ceilings versus Realized Revenue
    body: While headline contract vehicles such as the $919 million OUSW A&S BPA and 5-year Army IDIQ provide substantial procurement runway, USASpending.gov recorded approximately $52 million in FY2025 federal prime contracts. Underwriters must distinguish between multi-year ceiling capacity and actual annual task order conversion.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
