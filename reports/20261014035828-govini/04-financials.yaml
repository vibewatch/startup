artifact: financials
slug: govini
runDate: "2026-10-14"
company:
  name: Govini
chapter:
  number: 4
  title: Financials
  summary: Govini surpassed $100 million in ARR in October 2025 backed by a $150 million growth investment from Bain Capital and expansive defense procurement vehicles, but private-market opacity surrounding gross margins, customer retention, and unit-level conversion limits financial underwriting.
sections:
  - id: revenue-streams-and-pricing-model
    title: Revenue Streams and Subscription Pricing Model
    body: Govini monetizes its Ark decision-analytics platform primarily through multi-year enterprise software subscriptions sold directly to Department of Defense components, civilian national security agencies, and major defense contractors. Operating under a B2G Software-as-a-Service model, the company replaces legacy manual workflows and fragmented spreadsheets with automated, role-specific data applications spanning supply chain illuminations and logistics readiness. Third-party research indicates that Ark seat pricing commands premium enterprise benchmarks, with a notable U.S. Navy deployment for 81 seats valued at $12.15 million, reflecting approximately $150,000 per seat annually for full platform access. In addition to direct prime contracts, Govini distributes Ark via commercial cloud channels such as the AWS Marketplace, lowering administrative friction for federal buyers. This tiered SaaS structure delivers mission-critical workflow stickiness across nine defense acquisition domains, creating a dependable base of recurring subscription commitments.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI012
      - CI013
    tableRefs:
      - TI001
  - id: procurement-vehicles-and-sales-efficiency
    title: Federal Procurement Vehicles and GTM Efficiency
    body: Govini's go-to-market motion relies on high-leverage federal contracting vehicles that compress sales cycles and enable enterprise-wide acquisition without continuous recompetes. A foundational commercial asset is the 10-year, $919 million government-wide supply chain risk illumination blanket purchase agreement (BPA) sponsored by the Office of the Under Secretary of Defense for Acquisition and Sustainment (OUSW A&S). Complementing this BPA, the U.S. Army Contracting Command awarded Govini a single-award, five-year Indefinite Delivery/Indefinite Quantity (IDIQ) contract, establishing pre-negotiated terms for Department of War components to order Ark applications. Federal spending records compiled via USASpending.gov show Poplicus Inc. (d/b/a Govini) secured 26 prime federal contracts totaling approximately $52 million in fiscal year 2025, bringing cumulative contract wins since 2021 to 107 awards valued at over $255 million. These institutional vehicles serve as powerful distribution moats, dramatically lowering customer acquisition friction across defense program offices.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
    tableRefs:
      - TI002
  - id: unit-economics-and-cost-structure
    title: Cost Structure Drivers and Unit Economics Underwriting
    body: Govini delivers software in highly regulated FedRAMP High and Impact Level 5 (IL5) secure cloud environments across military departments. The company's service delivery cost structure is driven by cloud infrastructure hosting, ongoing curation of its proprietary National Security Knowledge Graph, and cleared technical personnel managing specialized data ingestions. While reported contract pricing of roughly $150,000 per annual seat implies favorable top-line unit contribution, Govini does not publicly disclose GAAP gross margins, customer acquisition cost (CAC), net revenue retention (NRR), or contract renewal rates. The absence of audited disclosures leaves key unit economics unconfirmed, particularly regarding whether software gross margins achieve standard SaaS benchmarks of 75% or higher, or whether substantial ongoing cleared engineering and integration services compress operational profitability. For institutional underwriting, the conversion velocity from pre-negotiated contract ceilings into active, recurring paid seats remains an essential diligence gap.
    claimRefs:
      - CI004
      - CI005
      - CI013
      - CI015
    figureRefs:
      - FI001
    tableRefs:
      - TI003
  - id: capital-adequacy-and-financial-verdict
    title: Capital Adequacy, Governance Stance, and Diligence Verdict
    body: Govini entered late 2025 in a position of robust balance sheet liquidity following a $150 million growth equity investment led by Bain Capital Tech Opportunities, which established an implied post-money valuation between $1.0 billion and $1.25 billion (a 10.0x multiple on $100 million ARR). Lifetime private capital raised reached roughly $170 million to $174.5 million, providing substantial runway to expand AI engineering teams and pull forward product roadmaps without near-term financing dependency. However, governance and headline stability faced disruption in November 2025 when founder Eric Gillespie was arrested and charged with four felonies, prompting immediate board termination. While Govini's institutional momentum, DoD-wide contract vehicles, and $100 million ARR milestone confirm solid product-market fit, conviction remains bounded by missing disclosures on renewal cohorts, account concentration, and underlying cash burn.
    claimRefs:
      - CI001
      - CI002
      - CI010
      - CI011
      - CI014
      - CI015
