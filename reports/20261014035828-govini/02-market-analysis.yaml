callouts:
  - calloutType: "insight"
    title: "The Impact Level 5 Security Moat as a Market Boundary"
    body: "In the defense acquisition software sector, regulatory and security accreditations act as an impenetrable market boundary rather than merely compliance overhead. Govini's Impact Level 5 Provisional Authorization (IL5 PA) from DISA, sponsored by the U.S. Navy, and FedRAMP High authorization permit the Ark platform to ingest Controlled Unclassified Information alongside commercial supply chain and vendor data inside a single security perimeter. Commercial procurement platforms lacking IL5 PA cannot legally execute these workflows, creating an addressable market insulated from commercial SaaS competitors."
    claimRefs:
      - "CM001"
      - "CM003"
  - calloutType: "risk"
    title: "Executive Governance Shock and Key-Person Transition"
    body: "In November 2025, Govini terminated founder and executive chairman Eric Gillespie following criminal felony charges. While the company acted swiftly to remove Gillespie from governance and confirmed he had no access to classified data, such high-profile leadership disruption poses reputational risk when navigating sensitive defense procurement reviews, even as operational execution continues under CEO Tara Murphy Dougherty."
    claimRefs:
      - "CM013"
