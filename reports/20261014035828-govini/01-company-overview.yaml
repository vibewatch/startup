callouts:
  - calloutType: strength
    title: Scale evidence crossed a meaningful threshold
    body: >-
      A $150 million institutional investment, company-reported ARR above $100 million,
      and a five-year acquisition vehicle collectively indicate material commercial
      traction, although they do not reveal revenue quality or funded contract value.
    claimRefs: [CO006, CO010, CO012]
  - calloutType: risk
    title: Governance remediation needs primary verification
    body: >-
      The founder's arrest and immediate removal create a diligence requirement around
      board oversight, customer notifications, security reviews, and residual influence.
    claimRefs: [CO014]
