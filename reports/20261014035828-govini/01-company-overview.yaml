artifact: company-overview
slug: govini
runDate: 2026-10-14
company:
  name: Govini
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Govini is an Arlington-based defense-acquisition software company whose Ark platform
    reached a company-reported $100 million-plus ARR milestone in 2025 and attracted a
    $150 million Bain Capital growth investment. The scale signal is meaningful, but
    conflicting third-party funding totals, undisclosed customer and valuation evidence,
    and the founder's 2025 termination after felony charges constrain confidence.
sections:
  - id: identity-and-business-model
    title: Identity, product, and operating model
    body: >-
      Govini was founded in 2011 and is identified by two current company-data profiles as
      headquartered in Arlington, Virginia. Its core product is Ark, which Govini describes
      as a suite of AI-enabled applications built on integrated government and commercial
      data for defense-acquisition workflows spanning supply chain, production, logistics,
      sustainment, science and technology, and modernization. The available evidence points
      to a federal enterprise-software model rather than a transactional data product:
      recurring revenue is paired with government contract vehicles that allow defense
      components to acquire the platform. Public sources do not disclose pricing, contract
      utilization, or the mix between software subscriptions and implementation support, so
      the durability and software quality of reported ARR remain diligence questions rather
      than established facts.
    claimRefs: [CO001, CO004, CO005, CO012, CO013]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Eric Gillespie founded Govini, while Tara Murphy Dougherty is identified as chief
      executive in both an independent company profile and company releases. That separation
      had existed before the most serious governance event in the reviewed record: Federal
      News Network reported that Gillespie was arrested and charged with four felonies, and
      that Govini's board terminated him from the organization and board on November 12,
      2025. The immediate termination reduced ongoing formal authority, but it also exposes
      key-person, reputation, security-culture, and board-oversight questions that cannot be
      resolved from the public record. Current board composition, investor protective rights,
      succession depth below the CEO, and any customer or clearance review triggered by the
      event were not disclosed in the assigned evidence.
    claimRefs: [CO002, CO003, CO014]
    tableRefs: [TO002]
  - id: capitalization-and-scale
    title: Capitalization, commercial scale, and stakeholders
    body: >-
      The clearest financing event is the $150 million growth investment led by Bain Capital
      in October 2025, corroborated by Govini's release and two independent company-data
      profiles. Total capital raised is not settled: FundedIQ reports $150 million across one
      recorded round, Tracxn reports $170 million across two rounds, and SetterVC estimates
      $174.5 million across three rounds. These figures should not be blended because their
      round coverage differs. Commercial momentum is stronger but still mostly privately
      reported: Govini announced that ARR exceeded $100 million, while Federal News Network
      reported 26 fiscal-2025 government contracts worth about $52 million and 107 awards
      worth more than $255 million since 2021. ARR is not accounting revenue, and neither the
      award figures nor contract ceilings establish recognized revenue, cash generation, or
      customer concentration.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011, CO015, CO016]
    tableRefs: [TO003]
  - id: milestones-and-diligence-implications
    title: Milestones and diligence implications
    body: >-
      Govini's trajectory combines a long operating history with a sharp 2025 scale-up:
      third-party records place early financing in 2013 and 2015, the company broadened Ark's
      positioning across the acquisition lifecycle, the Army announced a five-year IDIQ
      vehicle, and Bain supplied growth capital as the company crossed its reported ARR
      threshold. The founder's removal one month later is the principal adverse milestone
      and makes governance verification a first-order diligence workstream. The assigned
      evidence supports product breadth and access to federal procurement channels, but not
      customer count, active-seat adoption, retention, gross margin, exact valuation, or
      current fully diluted ownership. Investment conclusions should therefore treat scale
      as credible directional evidence while reserving judgment on revenue quality,
      concentration, and governance remediation until primary diligence materials are
      supplied.
    claimRefs: [CO001, CO005, CO006, CO009, CO010, CO012, CO014, CO015, CO016]
    figureRefs: [FO001]
