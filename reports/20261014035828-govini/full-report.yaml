      - number: '4.2'
        title: Federal Procurement Vehicles and GTM Efficiency
        blocks:
          - type: paragraph
            body: >-
              Govini's go-to-market motion relies on high-leverage federal contracting vehicles that compress sales
              cycles and enable enterprise-wide acquisition without continuous recompetes. A foundational commercial
              asset is the 10-year, $919 million government-wide supply chain risk illumination blanket purchase
              agreement (BPA) sponsored by the Office of the Under Secretary of Defense for Acquisition and Sustainment
              (OUSW A&S). Complementing this BPA, the U.S. Army Contracting Command awarded Govini a single-award,
              five-year Indefinite Delivery/Indefinite Quantity (IDIQ) contract, establishing pre-negotiated terms for
              Department of War components to order Ark applications. Federal spending records compiled via
              USASpending.gov show Poplicus Inc. (d/b/a Govini) secured 26 prime federal contracts totaling
              approximately $52 million in fiscal year 2025, bringing cumulative contract wins since 2021 to 107 awards
              valued at over $255 million. These institutional vehicles serve as powerful distribution moats,
              dramatically lowering customer acquisition friction across defense program offices.
