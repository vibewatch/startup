  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Definition, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Govini defines its addressable operational market around defense acquisition decision intelligence,
              explicitly separating its product envelope from generic commercial ERP systems and civilian procurement
              suites. In contrast to back-office enterprise suites like Deltek or IFS that manage general accounting and
              compliance, Govini's Ark platform functions as an operational decision system across six core acquisition
              lifecycle pillars: Supply Chain, Science & Technology, Production, Sustainment, Logistics, and
              Modernization. Ark integrates proprietary commercial vendor data with Controlled Unclassified Information
              and classified-adjacent government datasets inside an Impact Level 5 Provisional Authorization
              environment. This high-watermark security architecture creates an insurmountable compliance moat against
              commercial procurement software vendors that lack DISA IL5 clearance. Within the defense ecosystem,
              status-quo alternatives consist primarily of fragmented spreadsheets, disconnected program office
              databases, and bespoke consulting engagements from federal systems integrators such as Booz Allen Hamilton
              or Leidos. While broad enterprise data platforms like Palantir Technologies operate across federal defense
              environments, Govini maintains distinct category positioning by embedding domain-specific acquisition
              logic, national security knowledge graphs, and pre-packaged program workflows directly into the software
              interface.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
      - number: '2.2'
        title: 'Addressable Market Sizing Lenses: From Topline Defense Spend to Serviceable SOM'
        blocks:
          - type: paragraph
            body: >-
              Sizing the defense acquisition software market requires decomposing the top-level U.S. defense budget
              across appropriations, enterprise IT outlays, and specialized software accounts. While the aggregate U.S.
              national defense authorization exceeds $850 billion annually, the relevant software opportunity is
              concentrated within weapon system Procurement, Research, Development, Test & Evaluation (RDT&E), and
              Operation & Maintenance (O&M) accounts exceeding $400 billion. Within this base, total defense IT, cloud,
              and data analytics expenditures represent an estimated $15 billion to $20 billion annually. Constraining
              this envelope further to dedicated acquisition decision intelligence, supply chain illumination, and
              readiness analytics yields an addressable market of $3.5 billion to $5.0 billion. The serviceable
              addressable market (SAM) for platforms carrying required IL5 Provisional Authorization and FedRAMP High
              certifications is estimated between $1.2 billion and $1.8 billion. Govini has established a demonstrated
              serviceable obtainable market (SOM) footprint by surpassing $100 million in ARR, underpinned by a 5-year
              Department of War single-award IDIQ from Army Contracting Command and a $150 million growth equity
              investment led by Bain Capital. Public federal spending records from USASpending.gov confirm 26 prime
              contract actions worth $52 million in fiscal 2025 alone, corroborating rapid conversion of enterprise
              contract ceilings into realized recurring defense revenue.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM015
      - number: '2.3'
        title: Buyer Segmentation, Workflow Ownership, and Procurement Pathways
        blocks:
          - type: paragraph
            body: >-
              Govini's buyer landscape spans Program Executive Officers (PEOs), service sustainment commands, defense
              agencies, and tier-one defense industrial base primes. Acquisition leadership within military services
              represents the primary buyer persona, leveraging Ark to model industrial base surge capacity and monitor
              prime contractor delivery schedules. At the operational command level, sustainment and logistics leaders
              utilize Ark for predictive resupply planning and parts obsolescence management. In military exercises, Ark
              demonstrated significant operational velocity, reducing resupply planning time by 97% from 36 hours to 1
              hour and cutting risk-to-resolution cycles from 4 hours to 15 minutes during the Army's Project
              Convergence Capstone 5. Procurement pathways are heavily institutionalized: the primary procurement
              mechanism is a 5-year single-award Indefinite Delivery/Indefinite Quantity contract awarded by Army
              Contracting Command, enabling Department of War components to execute task orders without standalone
              sole-source justifications. In addition, Govini leverages the AWS Marketplace to facilitate streamlined
              federal procurement and maintains a 2026 Visionary Strategic Partnership with the National Defense
              Industrial Association (NDIA) to align software capabilities with broader defense acquisition reform
              mandates.
            claimRefs:
              - CM002
              - CM004
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Structural Growth Drivers, Governance Headwinds, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption of automated acquisition software is propelled by acute geopolitical tensions and defense
              industrial base vulnerabilities. Findings from Govini's 2025 National Security Scorecard indicate that the
              U.S. defense industrial base faces profound surge capacity deficits, critical mineral supply bottlenecks,
              and pervasive supplier opacity across weapons programs. These structural pressures incentivize defense
              leadership to replace manual tracking methods with automated risk illumination platforms. Nevertheless,
              Govini confronts significant adoption constraints. Defense software sales remain tethered to the
              multi-year Planning, Programming, Budgeting, and Execution (PPBE) cycle, which can delay contract ramp
              timelines. Furthermore, Govini maintains a strict custom-quoted pricing model without published
              subscription tiers or disclosed net revenue retention metrics, obscuring unit-level software margins and
              expansion dynamics. Governance dynamics also present qualitative risks: in November 2025, Govini's board
              terminated founder and executive chairman Eric Gillespie following criminal felony charges. Although
              Govini confirmed that Gillespie had been separated from executive operations years prior and possessed no
              access to classified environments, managing institutional reputation remains critical when negotiating
              enterprise defense renewals.
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Impact Level 5 Security Moat as a Market Boundary
            body: >-
              In the defense acquisition software sector, regulatory and security accreditations act as an impenetrable
              market boundary rather than merely compliance overhead. Govini's Impact Level 5 Provisional Authorization
              (IL5 PA) from DISA, sponsored by the U.S. Navy, and FedRAMP High authorization permit the Ark platform to
              ingest Controlled Unclassified Information alongside commercial supply chain and vendor data inside a
              single security perimeter. Commercial procurement platforms lacking IL5 PA cannot legally execute these
              workflows, creating an addressable market insulated from commercial SaaS competitors.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
          - type: callout
            title: Executive Governance Shock and Key-Person Transition
            body: >-
              In November 2025, Govini terminated founder and executive chairman Eric Gillespie following criminal
              felony charges. While the company acted swiftly to remove Gillespie from governance and confirmed he had
              no access to classified data, such high-profile leadership disruption poses reputational risk when
              navigating sensitive defense procurement reviews, even as operational execution continues under CEO Tara
              Murphy Dougherty.
            calloutType: risk
            claimRefs:
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              The defense acquisition intelligence market spans dedicated AI platforms, massive enterprise data
              incumbents, government-built software engines, and entrenched manual processes. Govini (rebranded as Air
              in late 2026) operates as a specialized defense acquisition software provider, delivering its proprietary
              Ark platform to DoD components. While enterprise data giant Palantir competes for broader DoD data
              analytics through vehicles like its $10 billion Army enterprise contract, its general-purpose Foundry and
              AIP platforms require extensive customization compared to Govini's purpose-built acquisition workflows.
              Internal government tools such as Platform One focus heavily on secure DevSecOps software delivery rather
              than pre-integrated commercial supplier risk or industrial base mapping. Traditional systems integrators
              like Booz Allen Hamilton and Leidos package analytics within large labor-intensive professional services
              contracts, offering bespoke engineering rather than repeatable SaaS products. Crucially, the most
              widespread status-quo substitute remains disconnected spreadsheets and manual market research, which
              perpetuate opaque supply chains and multi-year resolution delays. Govini's primary competitive advantage
              lies in providing an out-of-the-box vertical software solution specifically tailored to defense
              acquisition professionals.
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP008
              - CP009
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
