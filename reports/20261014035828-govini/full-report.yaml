      - number: '5.3'
        title: Deployment Traction, Field Outcomes, and GTM Scalability
        blocks:
          - type: paragraph
            body: >
              Govini delivers Ark via enterprise subscriptions paired with embedded deployment analysts who assist
              military program managers in structuring custom queries and establishing data pipelines. While detailed
              program-of-record metrics are classified, Govini has demonstrated quantified operational outcomes in
              structured military exercises. During the U.S. Army's Project Convergence Capstone 5 (PCC5), the Ark
              Logistics application accelerated tactical resupply planning from 36 hours down to 1 hour—a 97% reduction
              in coordination overhead—while reducing supply chain risk-to-resolution cycles from 4 hours to 15 minutes.
              To facilitate broad adoption across military departments, the U.S. Army Contracting Command awarded Govini
              a five-year single-award Indefinite Delivery/Indefinite Quantity (IDIQ) contract vehicle in October 2025.
              This contract functions as a Department-wide acquisition pathway, enabling defense agencies to license Ark
              without standalone procurement competitions, supplemented by availability on the AWS Marketplace.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE012
          - type: table
            tableRef: TE002
