      - number: '3.2'
        title: 'Core Differentiation: The National Security Knowledge Graph Moat'
        blocks:
          - type: paragraph
            body: >-
              Govini's competitive differentiation centers on its proprietary National Security Knowledge Graph, which
              connects disparate government procurement records with multi-tier commercial supplier and market data.
              Rather than requiring DoD customers to architect an ontology from scratch—a common hurdle with horizontal
              data platforms like Palantir—Ark arrives pre-configured with six role-specific applications spanning
              Supply Chain, Science & Technology, Production, Sustainment, Logistics, and Modernization. In operational
              deployments, this architectural specialization produces tangible cycle-time compression. For example,
              during Navy submarine maintenance operations, Ark resolved 40 obsolescence cases in two months, achieving
              a 95% reduction in case resolution time compared to the historical four-year manual baseline. Furthermore,
              Ark holds extensive defense accreditations including FedRAMP High and Authority to Operate (ATO) approvals
              across the Army, Navy, and Space Force, establishing formidable regulatory barriers to entry. A material
              functional limitation is Govini's absence of mobile applications and strictly defense-focused design,
              which restricts its utility in commercial markets and limits access to CAC-secured desktop browsers.
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: Switching Costs, Procurement Vehicles, and Enterprise Lock-In
        blocks:
          - type: paragraph
            body: >-
              Customer lock-in within defense acquisition software is driven by multi-year procurement vehicles and deep
              programmatic embedding. Govini has established single-award Indefinite Delivery/Indefinite Quantity (IDIQ)
              contracts with the U.S. Army and a $41.55 million sole-source firm-fixed-price contract with the U.S. Navy
              extending Ark SaaS capability through September 2029 under 10 U.S. Code 3204. These sole-source awards
              reflect significant institutional switching costs: once a military department integrates Ark's automated
              supplier illumination into nuclear triad sustainment or munitions readiness workflows, displacing the
              incumbent requires extensive justification, contract re-solicitation, and workflow retraining. Govini
              monetizes Ark through multi-year B2B SaaS seat licenses, with contract benchmarks such as the Navy's
              81-seat award reflecting annual pricing of approximately $150,000 per seat. This premium per-seat price
              point delivers high annual contract values (ACVs) and propelled the company past $100 million in ARR,
              supported by growth capital from Bain Capital. While listing on the AWS Marketplace simplifies procurement
              pathways, enterprise-wide discounting terms remain undisclosed.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP007
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP006
              - CP007
              - CP013
      - number: '3.4'
        title: Displacement Risks, Key-Person Exposure, and Incumbent Countermeasures
        blocks:
          - type: paragraph
            body: >-
              Despite its rapid expansion to unicorn scale, Govini faces material competitive and governance headwinds.
              The most severe acute disruption occurred in November 2025, when founder and executive chairman Eric
              Gillespie was arrested on four felony charges involving unlawful contact with a minor. The board moved
              immediately to terminate Gillespie, emphasizing his separation from operational roles and lack of
              classified access, which successfully insulated existing DoD contracts from termination. On the commercial
              front, Govini remains vulnerable to enterprise budget consolidation by defense behemoths like Palantir,
              whose multi-billion-dollar Army contracts allow them to offer broad analytics capabilities under existing
              contract ceilings. Additionally, traditional systems integrators frequently attempt to bundle custom
              supply-chain illumination tools into broader IT modernization programs. Govini's late-2026 rebranding from
              Govini to Air also introduces short-term friction in federal procurement listings like SAM.gov, where
              procurement officers and teaming partners must navigate dual-name track records during recompetes.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sole-Source Position and Mission Integration
            body: >-
              Govini's recurring sole-source contract awards—including the $41.55M Navy contract through 2029 and
              Army-wide IDIQ—demonstrate high institutional switching costs and mission-critical embedding across Navy
              nuclear deterrence and Army sustainment programs.
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
          - type: callout
            title: Key-Person and Governance Exposure
            body: >-
              The November 2025 felony indictment and immediate termination of founder Eric Gillespie created headline
              risk and potential governance disruption, though customer operational reliance and rapid board action
              mitigated contract cancellation.
            calloutType: risk
            claimRefs:
