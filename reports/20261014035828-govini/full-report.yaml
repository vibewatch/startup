      - number: '5.4'
        title: Security Authorization Moat and Executive Governance Risks
        blocks:
          - type: paragraph
            body: >
              Govini's primary competitive barrier to entry is its rigorous cybersecurity and regulatory compliance
              posture. Ark is accredited with FedRAMP High authorization and holds a DISA Impact Level 5 Provisional
              Authorization (IL5 PA) sponsored by the U.S. Navy. Combined with service-level Authorizations to Operate
              (ATOs) from the Army, Navy, and Space Force, this security boundary legally permits Ark to ingest and fuse
              Controlled Unclassified Information and National Security Systems data alongside commercial market feeds.
              Commercial analytics vendors lacking IL5 authorization cannot replicate this data union without manual
              extraction to unclassified networks. However, Govini faces material organizational risks following the
              November 2025 arrest of founder and executive chairman Eric Gillespie on felony charges. Although Govini's
              Board of Directors acted immediately to terminate Gillespie and confirmed he held no access to classified
              networks, defense customer relationships require spotless governance integrity, making executive stability
              an enduring diligence consideration.
            claimRefs:
              - CE006
              - CE007
              - CE011
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Impact Level 5 Security Authorization as a Defensive Moat
            body: >-
              Govini's DISA Impact Level 5 Provisional Authorization (IL5 PA) sponsored by the U.S. Navy and FedRAMP
              High authorization create a formidable regulatory and technical barrier to entry. This dual accreditation
              allows Ark to ingest Controlled Unclassified Information and National Security Systems data directly
              alongside commercial supply chain intelligence within a single accredited boundary, an operational
              prerequisite that generic commercial data platforms cannot satisfy without protracted accreditation
              cycles.
            calloutType: strength
            claimRefs:
              - CE006
              - CE007
          - type: callout
            title: Executive Governance Turmoil and Reputational Contagion
            body: >-
              The November 2025 arrest and subsequent felony charges against founder Eric Gillespie introduced
              significant governance and reputational risk. Although Govini promptly terminated Gillespie and clarified
              that he had transitioned out of executive management nearly a decade prior with no access to classified
              information, defense acquisition programs remain highly sensitive to leadership integrity and reputational
              scrutiny.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation & Buyer Personas
        blocks:
          - type: paragraph
            body: >-
              Govini concentrates its commercial activity entirely within the national security establishment,
              purposefully foregoing civilian enterprise procurement to focus on defense acquisition leaders, Program
              Executive Officers, and sustainment commands. Its core customer base encompasses all military departments
              of the United States Armed Forces—including the Army, Navy, Air Force, Marine Corps, Space Force, and
              Coast Guard—alongside central defense agencies such as the Defense Logistics Agency and Defense
              Information Systems Agency. Unlike administrative procurement tools deployed for clerical tasks, Govini's
              Ark platform targets senior operational buyers tasked with navigating industrial base fragilities and
              accelerating frontline readiness under severe geopolitical time pressure. Enterprise adoption is mediated
              through high-touch configuration of mission-aligned Application Hubs, where Govini analysts partner
              directly with program offices to embed custom risk indicators into operational workflows.
