      - number: '6.3'
        title: Named Military Deployments & Validated Outcomes
        blocks:
          - type: paragraph
            body: >-
              Operational proof for Govini's software centers on verified production deployments across frontline
              military services rather than uncommitted marketing relationships. The U.S. Army, Navy, and Space Force
              each granted Ark formal Authority to Operate credentials in 2025, validating the platform's security
              boundary and enabling live integration of Controlled Unclassified Information and National Security
              Systems data under DISA Impact Level 5 authorization. Measurable operational outcomes have been documented
              in live military trials: during the U.S. Army's Project Convergence Capstone 5 exercises, Ark's Logistics
              application reduced contested resupply planning cycles from 36 hours to one hour and accelerated
              risk-to-resolution workflows from four hours down to 15 minutes. Major multi-year commitments, including
              long-term sustainment support for the Air Force Minuteman III strategic deterrent program and high-value
              Navy per-seat licensing, attest to deep technical integration into core defense programs of record.
