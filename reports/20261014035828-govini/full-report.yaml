      - number: '4.3'
        title: Cost Structure Drivers and Unit Economics Underwriting
        blocks:
          - type: paragraph
            body: >-
              Govini delivers software in highly regulated FedRAMP High and Impact Level 5 (IL5) secure cloud
              environments across military departments. The company's service delivery cost structure is driven by cloud
              infrastructure hosting, ongoing curation of its proprietary National Security Knowledge Graph, and cleared
              technical personnel managing specialized data ingestions. While reported contract pricing of roughly
              $150,000 per annual seat implies favorable top-line unit contribution, Govini does not publicly disclose
              GAAP gross margins, customer acquisition cost (CAC), net revenue retention (NRR), or contract renewal
              rates. The absence of audited disclosures leaves key unit economics unconfirmed, particularly regarding
              whether software gross margins achieve standard SaaS benchmarks of 75% or higher, or whether substantial
              ongoing cleared engineering and integration services compress operational profitability. For institutional
              underwriting, the conversion velocity from pre-negotiated contract ceilings into active, recurring paid
              seats remains an essential diligence gap.
