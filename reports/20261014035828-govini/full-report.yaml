  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Functional Module Architecture
        blocks:
          - type: paragraph
            body: >
              Govini builds and commercializes Ark, an enterprise decision platform designed to transition defense
              acquisition from manual, disconnected administrative workflows to AI-enabled, continuous data analysis.
              Historically, military procurement and lifecycle management have relied on static spreadsheets, paper
              requirements documents, and fragmented databases that impede program acceleration. Ark provides a single
              operational environment comprising six mission-aligned applications: Supply Chain, Science & Technology,
              Production, Sustainment, Logistics, and Modernization. Each module targets critical friction points across
              the Department of Defense (DoD) acquisition lifecycle, illuminating vendor vulnerabilities, R&D
              positioning, manufacturing capacity, and lifecycle obsolescence. On top of these core applications, Govini
              configures Application Hubs that tailor guided workflows and custom risk indicators to the specific
              operational mandates of program executive offices, sustainment commands, and combatant components.
            claimRefs:
              - CE001
              - CE002
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
      - number: '5.2'
        title: Data Integration, Knowledge Graph, and Technology Stack
        blocks:
          - type: paragraph
            body: >
              The core technical differentiation of Ark lies in its ability to synthesize heterogeneous commercial
              datasets—including corporate ownership hierarchies, supply chain linkages, and financial filings—with
              authoritative government program records and Controlled Unclassified Information (CUI). This integration
              is orchestrated by Govini's proprietary National Security Knowledge Graph, which models complex
              interdependencies between prime defense contractors, lower-tier component suppliers, and fielded weapon
              platforms. The underlying software infrastructure leverages Neo4j graph databases, SPARQL semantic query
              endpoints, and Protégé ontology management, coupled with Apache Spark clusters and PostgreSQL for
              high-throughput batch and relational processing. Govini's application tier is developed using Python,
              Java, Spring Boot, Quarkus, TypeScript, and React, deployed across Kubernetes clusters spanning a
              multi-cloud footprint on AWS, GCP, and Azure. Recent technical engineering efforts emphasize multi-agent
              orchestration frameworks, LLM integrations, and automated evaluation pipelines to scale decision support.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE003
