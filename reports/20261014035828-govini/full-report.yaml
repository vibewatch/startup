      - number: '1.3'
        title: Capitalization, commercial scale, and stakeholders
        blocks:
          - type: paragraph
            body: >-
              The clearest financing event is the $150 million growth investment led by Bain Capital in October 2025,
              corroborated by Govini's release and two independent company-data profiles. Total capital raised is not
              settled: FundedIQ reports $150 million across one recorded round, Tracxn reports $170 million across two
              rounds, and SetterVC estimates $174.5 million across three rounds. These figures should not be blended
              because their round coverage differs. Commercial momentum is stronger but still mostly privately reported:
              Govini announced that ARR exceeded $100 million, while Federal News Network reported 26 fiscal-2025
              government contracts worth about $52 million and 107 awards worth more than $255 million since 2021. ARR
