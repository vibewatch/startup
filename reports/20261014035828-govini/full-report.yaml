  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Compliance Exposures
        blocks:
          - type: paragraph
            body: >-
              Govini operates under stringent Department of Defense security and compliance mandates, where maintaining
              accreditation forms both a core operational requirement and an essential barrier to entry. The company
              achieved DoD Impact Level 5 (IL5) provisional authorization and multi-service Authorities to Operate
              across the Army and Space Force, permitting the integration of Controlled Unclassified Information into
              its Ark platform. However, the organization experienced acute governance disruption in November 2025 when
              founder Eric Gillespie was arrested on four state felony charges in Pennsylvania. The board responded
              immediately by terminating Gillespie from all corporate roles and confirming he held no security
              clearances or classified data access. While immediate operational containment succeeded, long-term defense
              customer relationships require rigorous diligence into board oversight, ongoing compliance reviews, and
              isolation protocols.
