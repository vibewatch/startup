            body: >-
              Operational execution at Govini centers on maintaining high-availability software across secure federal
              cloud environments while ensuring that Ark's analytical outputs maintain high decision integrity. Govini's
              2025 National Security Scorecard demonstrated substantial analytical depth by identifying systemic
              vulnerabilities across U.S. defense industrial base supply chains, notably foreign component dependencies
              and opaque tier-2/3 supplier networks. Maintaining continuous monitoring for FedRAMP High and DISA IL5
              accreditations requires substantial engineering overhead, continuous vulnerability remediation, and
              cleared personnel retention in competitive defense corridors. Operational failure modes include potential
              data drift in machine-assisted supply chain illumination, cleared engineering talent attrition, and
