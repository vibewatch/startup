      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Eric Gillespie founded Govini, while Tara Murphy Dougherty is identified as chief executive in both an
              independent company profile and company releases. That separation had existed before the most serious
              governance event in the reviewed record: Federal News Network reported that Gillespie was arrested and
              charged with four felonies, and that Govini's board terminated him from the organization and board on
              November 12, 2025. The immediate termination reduced ongoing formal authority, but it also exposes
              key-person, reputation, security-culture, and board-oversight questions that cannot be resolved from the
              public record. Current board composition, investor protective rights, succession depth below the CEO, and
              any customer or clearance review triggered by the event were not disclosed in the assigned evidence.
            claimRefs:
              - CO002
              - CO003
              - CO014
