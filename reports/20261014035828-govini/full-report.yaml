            body: >-
              While Govini has surpassed $100M ARR on the back of 107 federal awards worth over $255M since 2021, the
              company faces two interconnected customer risks: near-total revenue concentration within the Department of
              Defense, and zero public disclosure of customer retention, net revenue retention (NRR), or seat
              utilization cohorts. Investors must evaluate the risk that contract ceilings do not translate into
