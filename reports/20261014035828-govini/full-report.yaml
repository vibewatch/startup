      - number: '6.2'
        title: Adoption Trajectory & Contract Expansion Scale
        blocks:
          - type: paragraph
            body: >-
              Govini's contracting footprint demonstrates substantial expansion velocity across the federal ecosystem,
              culminating in an announced milestone of surpassing $100 million in annual recurring revenue in late 2025
              alongside a $150 million growth investment from Bain Capital. Public procurement records verify that
              Govini secured 26 prime federal contracts worth approximately $52 million in fiscal year 2025 alone,
              contributing to a cumulative track record of 107 awards totaling more than $255 million since 2021.
              Commercial expansion is catalyzed by centralized procurement channels, notably a five-year single-award
              Indefinite Delivery/Indefinite Quantity contract awarded by Army Contracting Command and participation in
              a $919 million supply chain illumination vehicle. External industry recognition reflects this adoption
              momentum, with Govini advancing 79 places to rank #18 on the 2026 NatSec100 index co-produced by Silicon
              Valley Defense Group and J.P. Morgan.
