chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Govini was founded in 2011 and is identified by two current company-data profiles as headquartered in
              Arlington, Virginia. Its core product is Ark, which Govini describes as a suite of AI-enabled applications
              built on integrated government and commercial data for defense-acquisition workflows spanning supply
              chain, production, logistics, sustainment, science and technology, and modernization. The available
              evidence points to a federal enterprise-software model rather than a transactional data product: recurring
              revenue is paired with government contract vehicles that allow defense components to acquire the platform.
              Public sources do not disclose pricing, contract utilization, or the mix between software subscriptions
              and implementation support, so the durability and software quality of reported ARR remain diligence
              questions rather than established facts.
            claimRefs:
              - CO001
