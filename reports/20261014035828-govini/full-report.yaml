            title: High Security Authorizations as an Enterprise Customer Moat
            body: >-
              Govini's combination of DISA Impact Level 5 Provisional Authorization, FedRAMP High certification, and
              service-level ATOs across the Army, Navy, and Space Force creates an exceptionally high barrier to entry.
              In defense acquisition, commercial vendors without IL5 authorization cannot legally join Controlled
              Unclassified Information and National Security Systems data with commercial supplier intelligence,
              cementing Ark as an indispensable institutional system of record.
            calloutType: strength
