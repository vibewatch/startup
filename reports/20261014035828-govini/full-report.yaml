        title: Financial Model, Capital Intensity, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Govini operates a B2B government SaaS business model pricing multi-year software licenses at approximately
              $150,000 per seat annually, crossing $100 million in ARR prior to securing a $150 million growth
              investment from Bain Capital Tech Opportunities in October 2025. While this capital injection provides
              balance sheet resilience, the company's valuation thesis rests on converting broad multi-year IDIQ access
              into sustained, expanding paid user seats across defense program offices. Key thesis-break triggers
              include potential task-order slowdowns under the Army IDIQ, encroachment by Palantir into specialized
              acquisition workflows, margin erosion driven by compliance and cloud infrastructure overhead, or secondary
              reputational contagion stemming from founder legal proceedings. Core diligence must verify seat-level
