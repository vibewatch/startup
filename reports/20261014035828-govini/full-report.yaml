            title: 'Investment Recommendation: Buy with Rigorous Pricing Discipline'
            body: >-
              Govini demonstrates compelling fundamentals as a defense-tech category leader with $100M ARR and
              sole-source federal procurement vehicles. While governance and concentration risks require a high risk
              rating, the company's valuation is judged fair at current multiples.
