  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Subscription Pricing Model
        blocks:
          - type: paragraph
            body: >-
              Govini monetizes its Ark decision-analytics platform primarily through multi-year enterprise software
              subscriptions sold directly to Department of Defense components, civilian national security agencies, and
              major defense contractors. Operating under a B2G Software-as-a-Service model, the company replaces legacy
              manual workflows and fragmented spreadsheets with automated, role-specific data applications spanning
              supply chain illuminations and logistics readiness. Third-party research indicates that Ark seat pricing
              commands premium enterprise benchmarks, with a notable U.S. Navy deployment for 81 seats valued at $12.15
              million, reflecting approximately $150,000 per seat annually for full platform access. In addition to
              direct prime contracts, Govini distributes Ark via commercial cloud channels such as the AWS Marketplace,
              lowering administrative friction for federal buyers. This tiered SaaS structure delivers mission-critical
              workflow stickiness across nine defense acquisition domains, creating a dependable base of recurring
              subscription commitments.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI012
