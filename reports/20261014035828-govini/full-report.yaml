      - number: '6.4'
        title: Retention Durability, Procurement Friction & Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Despite strong top-line contract awards, Govini displays notable vulnerability to customer concentration
              and disclosure opacity. The Department of Defense accounts for the vast preponderance of company revenue,
              leaving the business heavily exposed to congressional appropriations cycles, Continuing Resolutions, and
              federal acquisition timing friction. Furthermore, Govini maintains strict confidentiality regarding
              underlying SaaS efficiency metrics: neither net revenue retention, gross revenue retention, nor logo churn
              rates are disclosed in public materials. While multi-year contract ceilings such as the Army IDIQ reduce
              transactional friction, they do not guarantee committed task order drawdowns or reveal actual seat
              utilization across fielded military commands. Assessing customer durability therefore requires rigorous
              ongoing verification of contract renewal mechanics and task order conversion ratios.
            claimRefs:
