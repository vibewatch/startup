      - number: '2.4'
        title: 结构性增长驱动、治理阻力与采用约束
        blocks:
          - type: paragraph
            body: >-
              地缘政治紧张和国防工业基础脆弱性，正在推动自动化采购软件的采用。Govini 的 2025 National Security Scorecard
              指出，美国国防工业基础存在严重增产能力缺口、关键矿产供应瓶颈，以及武器项目普遍缺乏供应商透明度。这些结构性压力促使国防领导层用自动化风险可视化平台替代人工追踪。不过，Govini
              也面临显著采用约束。国防软件销售仍受多年期规划、计划、预算和执行（PPBE）周期牵制，合同扩张可能因此延迟。此外，Govini
              坚持严格的定制报价模式，没有公布订阅层级，也没有披露净收入留存指标，导致单位软件毛利和扩张动力不透明。治理也带来定性风险：2025 年 11 月，Govini 董事会在创始人兼执行董事长 Eric
              Gillespie 被控刑事重罪后将其解职。虽然 Govini 确认 Gillespie 多年前已脱离执行运营，且无权进入机密环境，但公司在谈判国防企业续约时仍必须处理机构声誉。
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM010
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: Impact Level 5 安全壁垒构成市场边界
            body: >-
              在国防采购软件行业，监管和安全认证构成不可穿透的市场边界，而不只是合规成本。由美国海军赞助、DISA 授予 Govini 的 Impact Level 5 临时授权（IL5 PA），以及 FedRAMP High
              授权，让 Ark 能在单一安全边界内把受控非机密信息与商业供应链和供应商数据合并处理。缺少 IL5 PA 的商业采购平台无法合法执行这些流程，因此形成了受商业 SaaS 竞争者保护的可服务市场。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
          - type: callout
            title: 高管治理冲击与关键人物交接
            body: >-
              2025 年 11 月，Govini 在创始人兼执行董事长 Eric Gillespie 被控刑事重罪后将其解职。公司迅速将 Gillespie
              移出治理层，并确认其无法接触机密数据；但如此高调的领导层动荡，仍会在公司应对敏感国防采购审查时带来声誉风险，即便 CEO Tara Murphy Dougherty 继续负责运营执行。
            calloutType: risk
            claimRefs:
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：直接同行、现有厂商与替代方案
        blocks:
          - type: paragraph
            body: >-
              国防采购智能市场涵盖专用 AI 平台、大型企业数据现有厂商、政府自建软件引擎和根深蒂固的人工流程。Govini（2026 年末更名为 Air）是一家专门的国防采购软件供应商，为国防部各部门提供专有 Ark
              平台。Palantir 通过其 $10B 陆军企业合同等渠道争夺更广泛的国防部数据分析业务；相比之下，其通用 Foundry 和 AIP 平台需要大量定制，而 Govini
              的采购流程是开箱即用的。Platform One 等政府内部工具主要聚焦安全 DevSecOps 软件交付，而不是预整合的商业供应商风险或国防工业基础映射。Booz Allen Hamilton 和 Leidos
              等传统系统集成商，通常把分析能力打包进大型、劳动密集型专业服务合同，提供定制工程而非可复制 SaaS
              产品。最普遍的现状替代方案仍是互不连接的电子表格和人工市场研究，它们让供应链保持不透明，并延续多年期解决周期。Govini 的主要竞争优势，是为国防采购人员提供专门定制、开箱即用的垂直软件解决方案。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP008
              - CP009
