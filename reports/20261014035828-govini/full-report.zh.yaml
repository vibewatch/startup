  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与功能模块架构
        blocks:
          - type: paragraph
            body: >
              Govini 构建并商业化 Ark，这是一个企业决策平台，旨在把国防采购从人工、割裂的行政流程转为 AI
              驱动的持续数据分析。过去，军方采购和生命周期管理依赖静态电子表格、纸质需求文档和割裂数据库，阻碍项目加速。Ark
              提供单一运营环境，包含六个与任务对应的应用：供应链、科学与技术、生产、保障、物流和现代化。每个模块都针对国防部（DoD）采购生命周期中的关键摩擦点，揭示供应商脆弱性、研发定位、制造能力和生命周期淘汰风险。在这些核心应用之上，Govini
              还配置 Application Hubs，根据项目执行办公室、保障司令部和作战部门的具体运营要求，定制引导式流程和风险指标。
            claimRefs:
              - CE001
