      - number: '5.2'
        title: 数据整合、知识图谱与技术栈
        blocks:
          - type: paragraph
            body: >
              Ark 的核心技术差异化在于，能够把异构商业数据集——包括企业所有权层级、供应链关联和财务申报——与权威政府项目记录及受控非机密信息（CUI）合成起来。这一整合由 Govini 专有的 National
              Security Knowledge Graph 编排，用来建模国防主承包商、低层级零部件供应商和已部署武器平台之间的复杂依赖。底层软件基础设施使用 Neo4j 图数据库、SPARQL 语义查询端点和
              Protégé 本体管理，并结合 Apache Spark 集群和 PostgreSQL，进行高吞吐批处理和关系处理。Govini 应用层使用 Python、Java、Spring
              Boot、Quarkus、TypeScript 和 React 开发，部署在跨 AWS、GCP 和 Azure 多云环境的 Kubernetes 集群中。近期技术工程重点包括多智能体编排框架、LLM
              集成和自动化评估流水线，以扩大决策支持能力。
