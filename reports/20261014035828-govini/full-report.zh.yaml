      - number: '3.2'
        title: 核心差异化：国家安全知识图谱壁垒
        blocks:
          - type: paragraph
            body: >-
              Govini 的竞争差异化集中在其专有 National Security Knowledge Graph：它把分散的政府采购记录与多层商业供应商及市场数据连接起来。与要求国防部客户从零搭建本体的横向数据平台（如
              Palantir）不同，Ark 预先配置了六个角色专用应用，覆盖供应链、科学与技术、生产、保障、物流和现代化。在实际部署中，这种架构专用化带来了可量化的周期压缩。例如，在海军潜艇维护作业中，Ark 两个月内解决
              40 个淘汰案例；与历史上四年的人工基线相比，案例解决时间缩短 95%。此外，Ark 还拥有 FedRAMP High 以及陆军、海军和太空军的运行授权（ATO），形成强大的监管进入壁垒。一个重要功能限制是
              Govini 没有移动应用，且设计严格聚焦国防市场，这限制了其在商业市场的用途，也限制了对 CAC 保护桌面浏览器的访问。
