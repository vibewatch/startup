  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类定义与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Govini 将可服务的运营市场定义为国防采购决策智能，并明确把自身产品范围与通用商业 ERP 和民用采购套件区分开来。Deltek 或 IFS 等后台企业套件主要处理通用会计和合规；相比之下，Govini 的
              Ark 平台覆盖六个核心采购生命周期支柱：供应链、科学与技术、生产、保障、物流和现代化，充当运营决策系统。Ark 在 Impact Level 5
              临时授权环境中，把专有商业供应商数据与受控非机密信息及接近机密级别的政府数据整合起来。这一高标准安全架构构成了商业采购软件供应商难以逾越的合规壁垒，因为它们没有 DISA IL5
              许可。在国防生态中，现状替代方案主要是割裂的电子表格、互不连接的项目办公室数据库，以及 Booz Allen Hamilton 或 Leidos 等联邦系统集成商提供的定制咨询。Palantir
              Technologies 等横向企业数据平台同样活跃于联邦国防环境，但 Govini 通过把领域专用采购逻辑、国家安全知识图谱和预打包项目流程直接嵌入软件界面，保持了独特的品类定位。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
      - number: '2.2'
        title: 可服务市场规模口径：从国防总支出到可获取市场
        blocks:
          - type: paragraph
            body: >-
              要估算国防采购软件市场，需要把美国国防预算顶层规模拆解为拨款、企业 IT 支出和专业软件账户。美国国防授权总额每年超过
              $850B，但相关软件机会集中在武器系统采购、研发测试评估（RDT&E）和运营维护（O&M）账户，这些账户合计超过 $400B。在此基础上，国防 IT、云和数据分析总支出估计每年为 $15B 至
              $20B。再将范围收窄至专门的采购决策智能、供应链可视化和战备分析，可得 $3.5B 至 $5.0B 的可服务市场。具备 IL5 临时授权和 FedRAMP High
              认证的平台，其可服务可获取市场（SAM）估计为 $1.2B 至 $1.8B。Govini 已通过 ARR 超过 $100M 建立了可证明的可获取市场（SOM）足迹，背后是陆军合同司令部授予的五年期国防部单一授予
              IDIQ 合同，以及 Bain Capital 领投的 $150M 成长股权投资。USASpending.gov 的联邦支出记录确认，Govini 仅在 2025 财年就获得 26 份主合同、金额
              $52M，说明企业合同上限正快速转化为已实现的国防经常性收入。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM014
              - CM015
