        title: 公司身份、产品与运营模式
        blocks:
          - type: paragraph
            body: >-
              Govini 成立于 2011 年，两份近期公司资料都将其总部列为 Virginia 州 Arlington。公司的核心产品是 Ark；Govini 将其描述为一套建立在政府与商业数据整合之上的 AI
              应用，覆盖供应链、生产、物流、保障、科学与技术及现代化等国防采购流程。现有证据更支持联邦企业软件模式，而非一次性交易数据产品：经常性收入与政府合同渠道相结合，让国防部门能够采购该平台。公开资料没有披露定价、合同使用率，或软件订阅与实施支持的收入占比，因此已报告
              ARR 的持久性和软件质量仍是待核实的尽调问题，而非已证实事实。
