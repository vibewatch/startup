      - number: '2.3'
        title: 买方细分、流程归属与采购路径
        blocks:
          - type: paragraph
            body: >-
              Govini 的买方覆盖项目执行官（PEO）、军种保障司令部、国防机构和一级国防工业基础主承包商。军种采购领导层是主要买方画像，借助 Ark
              建模国防工业基础的增产能力，并监控主承包商交付进度。在作战指挥层，保障和物流负责人用 Ark 规划预测性补给并管理零部件淘汰。在军事演习中，Ark 展示了明显的运营提速：Project Convergence
              Capstone 5 期间，补给规划时间从 36 小时降至 1 小时，缩短 97%；风险到解决周期从 4 小时降至 15 分钟。采购路径高度制度化：主要机制是陆军合同司令部授予的五年期单一授予无限交付 /
              无限数量（IDIQ）合同，让国防部各部门下达任务订单时无需单独提出单一来源理由。此外，Govini 还利用 AWS Marketplace 简化联邦采购，并与 National Defense
              Industrial Association（NDIA）维持 2026 Visionary Strategic Partnership，使软件能力与更广泛的国防采购改革要求保持一致。
            claimRefs:
              - CM002
