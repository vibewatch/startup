      - number: '3.3'
        title: 转换成本、采购渠道与企业锁定
        blocks:
          - type: paragraph
            body: >-
              国防采购软件的客户锁定，来自多年期采购渠道和深度项目嵌入。Govini 已与美国陆军签订单一授予 IDIQ 合同，并与美国海军签订 $41.55M 单一来源固定总价合同；后者依据《美国法典》第 10 编第
              3204 条，将 Ark SaaS 能力延续至 2029 年 9 月。这些单一来源授予意味着机构转换成本很高：一旦某军种把 Ark
              的自动化供应商可视化嵌入核三位一体保障或弹药战备流程，替换现有系统就需要大量论证、重新招标和流程再培训。Govini 通过多年期 B2B SaaS 席位许可实现 Ark 变现；例如，海军 81
              席合同对应每席每年约 $150,000 的定价。这样的高席位价格带来较高年度合同价值（ACV），推动公司 ARR 超过 $100M，并得到 Bain Capital 成长资本支持。AWS Marketplace
