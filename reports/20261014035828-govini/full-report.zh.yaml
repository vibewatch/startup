  - id: FM001
    title: 受限国防采购软件市场规模金字塔
    type: pyramid
    summary: 这套分层规模框架从国防总支出一路映射到 Govini 的可服务市场和已证明的 $100M+ ARR 规模。
    data:
      items:
        - label: 美国国防总支出
          value: $850B+
          detail: 覆盖军种、国防机构和涉密项目的国防支出总额
        - label: 采购、RDT&E 与 O&M 基准
          value: $400B+
          detail: 可触达的国防拨款，用于武器系统开发、生产和舰队维护
        - label: 国防软件与分析支出
          value: $15B-$20B
          detail: DoD 的联邦企业软件、云基础设施和数据分析支出
        - label: 采购决策智能（TAM）
          value: $3.5B-$5.0B
          detail: 用于采购全生命周期、供应链可视化和战备分析的专用软件支出
        - label: 高安全级别国防决策软件（SAM）
          value: $1.2B-$1.8B
          detail: 需要 IL5 临时授权和 FedRAMP High 安全控制的采购软件
        - label: Govini 已证明规模（SOM / 合同基础）
          value: $100M+ ARR
          detail: ARR 里程碑超过 $100M，拥有覆盖 DoW 的 5 年陆军 IDIQ 合同和 Bain Capital 成长资金支持
    approximationNotes: 各规模层级源自公开国防预算科目、联邦 IT 估算和 Govini 的 ARR 披露。SAM 反映严格的 IL5 授权边界。
