      - number: '5.4'
        title: 安全授权壁垒与高管治理风险
        blocks:
          - type: paragraph
            body: >
              Govini 的主要竞争壁垒，是其严格的网络安全和监管合规姿态。Ark 获得 FedRAMP High 授权，并持有由美国海军赞助的 DISA Impact Level 5 临时授权（IL5
              PA）。再加上陆军、海军和太空军的服务级运行授权（ATO），这一安全边界依法允许 Ark 在商业市场数据流旁边接入并融合受控非机密信息和国家安全系统数据。没有 IL5
              授权的商业分析供应商，无法复制这种数据合并，除非先人工提取到非机密网络。不过，2025 年 11 月创始人兼执行董事长 Eric Gillespie 因重罪指控被捕后，Govini 面临实质组织风险。虽然
              Govini 董事会立即将 Gillespie 解职，并确认他无法接触机密网络，但国防客户关系要求治理完整性无瑕，因此高管稳定性仍是持续的尽调考量。
            claimRefs:
