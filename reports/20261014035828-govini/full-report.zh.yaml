  - id: FI001
    title: Govini Ark 收入与运营转化桥
    type: flow
    summary: 这张顺序流程图展示联邦国防现代化重点如何转化为预竞标合同载体、订阅席位采用、ARR 和毛运营盈余。
    approximationNotes: 顺序转化阶段基于已报道的企业合同结构和 SaaS 交付模式；确切运营利润率属于未披露的私有指标。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI013
    data:
      nodes:
        - id: n1
          label: 联邦国防预算与采购重点
          detail: DoD 采购项目在各军种之间分配现代化和供应链可视化资金。
        - id: n2
          label: 企业合同载体（IDIQ 与 BPA）
          detail: $919M GSA/OUSW A&S BPA 和 5 年陆军 IDIQ，在整个 Department of War 建立预竞标采购渠道。
        - id: n3
          label: 机构与项目办公室部署 Ark
          detail: 采购官员和后勤人员在九个核心任务领域部署 Ark，其中包括供应链和保障。
        - id: n4
          label: 年度 SaaS 席位与订阅许可
          detail: 项目部署转化为多年期经常性许可，隐含的年度基准价格约为每席位 $150,000。
        - id: n5
          label: 经常性软件 ARR 生成（$100M+）
          detail: 截至 2025 年 10 月，机构席位的累计部署推动 Govini ARR 超过 $100M。
        - id: n6
          label: 云托管与持证知识图谱 COGS
          detail: 交付需要安全的 FedRAMP High / IL5 云托管，以及专有 National Security Knowledge Graph 数据维护。
        - id: n7
          label: 毛运营盈余与再投资
          detail: 软件较高的毛利率，加上 Bain 的 $150M 成长资本，为 AI 加速开发和国防工程扩张提供资金。
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Govini Ark 国防采购平台的六层架构栈，从合规基础设施一直延伸到面向任务的应用。
    data:
      layers:
        - label: 任务应用层
          detail: 六个核心应用：供应链、科学与技术、生产、保障、物流和现代化。
        - label: 工作流与应用中心
          detail: 面向具体项目的配置，组合引导式工作流、自定义任务风险指标和基于角色的视图。
        - label: 分析与智能代理层
          detail: 决策支持算法、多智能体评估框架、LLM 集成和自动化补给建模。
        - label: 数据整合与图谱骨干
          detail: 通过 Neo4j、SPARQL 和 Protégé 本体，将商业数据与 DoD 记录融合进 National Security Knowledge Graph。
        - label: 分布式处理与存储层
          detail: 通过 Apache Spark 和 PostgreSQL 编排高吞吐数据摄取与转换管道。
        - label: 安全、合规与基础设施底座
          detail: 通过 Kubernetes 在 AWS、GCP 和 Azure 上运行取得 FedRAMP High 与 DISA IL5 PA 认证的容器化微服务。
    approximationNotes: 这是根据 DISA IL5 文档、Govini Ark 产品规格和公开技术招聘披露推断出的概念架构栈。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE006
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 国防客户从初始授权走向企业级扩张的采用路径。
    approximationNotes: 根据已发布的 ATO 要求和 IDIQ 合同机制，展示概括性的国防客户上线生命周期。
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU011
      - CU014
    data:
      items:
        - label: 阶段 1：安全授权
          touchpoints:
            - 海军支持的 DISA IL5 临时授权
            - FedRAMP High 影响环境上线
          detail: 基础合规到位后，平台即可摄取 CUI 和 NSS 数据
        - label: 阶段 2：军种级 ATO 签发
          touchpoints:
            - 陆军、海军和太空军分别授予 ATO
            - 任务环境安全边界验证
          detail: 针对具体部门的运营许可，使实时数据馈送得以上线
        - label: 阶段 3：运营演练测试
          touchpoints:
            - Project Convergence Capstone 5 后勤试验
            - 联合演习工作流与补给测试
          detail: 实证显示补给规划速度提升 97%
        - label: 阶段 4：企业合同载体启用
          touchpoints:
            - 陆军合同司令部 5 年单一授标 IDIQ
            - OUSW A&S $919M SCRIPTS 载体准入
          detail: 简化采购机制，减少单独重新竞标摩擦
        - label: 阶段 5：应用中心协作配置
          touchpoints:
            - 与 Govini 国防专家协作搭建工作流
            - 针对项目办公室任务定制风险指标
          detail: 深度协作式部署，将具体采购项目投入运营
        - label: 阶段 6：跨军种扩张与互认
          touchpoints:
            - 扩展到联合项目办公室和 PEO
            - 按企业级定价结构扩大席位许可
          detail: 跨军种互认推动业务拓展至最初军种赞助范围之外
