callouts:
  - calloutType: "strength"
    title: "High Security Authorizations as an Enterprise Customer Moat"
    body: "Govini's combination of DISA Impact Level 5 Provisional Authorization, FedRAMP High certification, and service-level ATOs across the Army, Navy, and Space Force creates an exceptionally high barrier to entry. In defense acquisition, commercial vendors without IL5 authorization cannot legally join Controlled Unclassified Information and National Security Systems data with commercial supplier intelligence, cementing Ark as an indispensable institutional system of record."
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU006"
  - calloutType: "risk"
    title: "Severe Customer Concentration and Absence of Retention Transparency"
    body: "While Govini has surpassed $100M ARR on the back of 107 federal awards worth over $255M since 2021, the company faces two interconnected customer risks: near-total revenue concentration within the Department of Defense, and zero public disclosure of customer retention, net revenue retention (NRR), or seat utilization cohorts. Investors must evaluate the risk that contract ceilings do not translate into sustained multi-year seat renewals."
    claimRefs:
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU012"
      - "CU013"
