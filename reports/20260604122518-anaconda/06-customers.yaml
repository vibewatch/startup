callouts:
- calloutType: strength
  title: Regulated-production proof is real, not just logo-based
  body: Zempler, Vantage West, and the major European financial institution all describe live governed workflows with concrete operational outcomes. That is materially stronger evidence than a simple customer-logo wall and suggests Anaconda can become embedded in high-stakes production environments.
  claimRefs:
  - CU013
  - CU014
  - CU017
  - CU018
  - CU019
- calloutType: risk
  title: Retention and concentration remain the biggest commercial blind spots
  body: Public sources say almost nothing about NRR, churn, contract terms, or top-customer exposure. Anaconda may have broad reach, but outside observers still cannot tell whether revenue quality is driven by durable expansion or by a wide but shallow installed base.
  claimRefs:
  - CU029
  - CU030
  - CU034
- calloutType: risk
  title: Licensing enforcement could narrow the academic and open-source funnel
  body: The 200-plus employee licensing rule improves monetization discipline but has clearly triggered migration planning in research communities. That creates a non-trivial risk that one historical source of Anaconda mindshare becomes less sticky exactly when the company is trying to convert broad adoption into enterprise revenue.
  claimRefs:
  - CU036
  - CU037
  - CU038
  - CU039
  - CU040
