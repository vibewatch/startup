chapter:
  number: 6
  title: Customers
  summary: Anaconda has credible production adoption across regulated banks, industrial engineering teams, and academic researchers, with strong named proof from Zempler, Vantage West, a major European financial institution, Moog, and McGill. Public scale claims are very large—47M+ to 50M+ users, 250K+ organizations, and 10K+ large enterprises—but retention, exact customer concentration, and paid-account mix remain undisclosed. Expansion is visible through tiered plans, partner channels, and workflow expansion inside regulated accounts, while the 200-plus employee licensing rule introduces real procurement and retention friction in research-heavy segments.
sections:
- id: customer-base-segmentation
  title: Customer base segmentation
  body: |-
    Anaconda's visible customer base is best understood as a layered stack of payer and governance profiles rather than as one uniform enterprise segment. At the bottom is a large free user surface—students, individual practitioners, proof-of-concept builders, and researchers—who use Anaconda for package management, notebooks, and quick experimentation. Above that is the Starter tier, where a team lead becomes the economic buyer and pays for collaboration and storage. At the high-value end, Business and Enterprise buyers are usually IT, security, analytics, or platform leaders who care about access control, curated packages, SSO, vulnerability management, and governed deployment. That enterprise motion is especially visible in financial services, where Vantage West, Zempler, Entercard, and the unnamed European financial institution all bought Anaconda to solve security-and-governance bottlenecks rather than to access Python alone.

    Public proof also shows that Anaconda's user surface is broader than financial services. Moog uses it in aerospace engineering workflows, McGill uses it for reproducible AI drug discovery, SLB positions it inside engineering simulation, and Hyperbound uses it in an AI-native startup context. Geography is likewise broader than one home market: the strongest named references span the U.S., Canada, the U.K., the Nordics, and Europe. That said, the best-documented proof clusters in regulated and technically sophisticated accounts, so the public mix likely over-represents segments where governance is the most urgent and where buyers are willing to talk publicly about risk reduction.
