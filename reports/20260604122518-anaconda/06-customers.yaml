figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Public plan design and named deployments imply a journey from individual experimentation into governed enterprise rollout, with a distinct procurement gate at larger organizations.
  data:
    items:
    - label: Individual discovery
      detail: A student, researcher, analyst, or developer starts with Free because it is easy to install, has thousands of packages, and fits proof-of-concept work.
      touchpoints:
      - Anaconda Distribution
      - Free plan
      - Package install and notebooks
    - label: Team standardization
      detail: A small team graduates to Starter when shared storage, collaboration, and lightweight workspace controls become necessary.
      touchpoints:
      - Starter $15/user/month
      - Team workspace controls
      - Training and collaboration
    - label: Security / procurement review
      detail: In larger organizations, IT or security reviews package provenance, access controls, and the 200-plus employee licensing threshold before broader rollout.
      touchpoints:
      - Business license requirement
      - Package Security Manager
      - Security and legal review
    - label: Production deployment
      detail: Regulated or mission-critical users deploy governed environments with SSO, curated packages, audit trails, and integration into model or engineering workflows.
      touchpoints:
      - SSO and access control
      - Curated repos
      - DevSecOps / model-governance integration
    - label: Expansion and renewal
      detail: Accounts add seats, broader use cases, or partner support, while licensing ambiguity or practitioner friction can slow renewal in research-heavy or bottom-up segments.
      touchpoints:
      - '>15 seats routed to Sales'
      - Reseller support
      - Renewal / compliance review
