- id: expansion-channel-and-concentration-risk
  title: Expansion, channel, and concentration risk
  body: |-
    Anaconda's public materials imply a credible land-and-expand motion. Free and Starter plans let individuals or small teams begin without a heavy sales process, then Business and Enterprise packaging monetize the moment governance, SSO, private repositories, or larger seat counts become necessary. The clearest expansion pattern appears in regulated accounts: Zempler moved from a need for safe package usage into broader fraud, credit-risk, and AML workflows; the major European institution moved from legacy statistical tooling into large-scale model governance; and Anaconda's partner materials show that resellers can help with procurement and tier-1 support once deployments become larger or more international.

    The main risks sit on concentration and friction. Publicly visible proof is weighted toward financial services and other technically demanding workflows, so outside observers still cannot tell how diversified paid demand truly is. Top-customer concentration, contract terms, and renewal timing are undisclosed. In addition, Anaconda's 200-plus employee licensing rule clearly adds procurement friction and has triggered adverse reactions in academia and open-source communities, where some institutions have explored or recommended alternatives such as Miniforge and conda-forge. That does not negate the enterprise monetization logic, but it does mean Anaconda may be trading some historical grassroots stickiness for higher-intent enterprise conversion. Investors should read the customer story as strong on governed production proof, solid on expansion architecture, and still incomplete on concentration and retention evidence.
