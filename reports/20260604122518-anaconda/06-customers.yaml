- id: FU004
  title: Regulated-account procurement and expansion flow
  type: flow
  layout: wide
  summary: The most evidenced customer motion is inside regulated accounts where security review and procurement are a visible expansion gate.
  data:
    nodes:
    - id: need
      label: Need for governed Python
      detail: Security, compliance, and model-governance demands make unmanaged open-source use untenable.
    - id: pilot
      label: Pilot or limited team use
      detail: A team starts with existing pockets of Anaconda use or a small governed rollout.
    - id: review
      label: Security / legal / procurement review
      detail: The 200-plus employee rule, SSO, package provenance, and data-location requirements are evaluated.
    - id: prod
      label: Production rollout
      detail: SSO, curated repos, audit trails, and integrated workflows move into production environments.
    - id: expand
      label: Use-case expansion
      detail: Accounts broaden from one model or team into fraud, credit, AML, engineering, or broader AI workloads.
    - id: renew
      label: Renewal / channel decision
      detail: Accounts renew directly or via partners, while research-heavy segments may reassess due to licensing or practitioner friction.
    edges:
    - from: need
      to: pilot
      label: initial evaluation
    - from: pilot
      to: review
      label: policy and budget gate
    - from: review
      to: prod
      label: approval and deployment
    - from: prod
      to: expand
      label: prove value and add workflows
    - from: expand
      to: renew
      label: scale seats / channels / term
