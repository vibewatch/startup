- id: TU006
  title: Licensing and procurement friction table
  columns:
  - Friction point
  - Public evidence
  - Affected customer segment
  - Why it matters
  - Current visibility
  rows:
  - - 200+ employee threshold
    - Organizations with 200+ employees or contractors require paid Business licensing
    - Corporate, government, nonprofit, and large research institutions
    - Moves many prospects from free or implicit usage into procurement review
    - Official and current
  - - Seat cap before sales process
    - Business purchasing information points users above 15 seats to Sales for custom pricing
    - Growing teams and enterprise departments
    - Introduces contracting overhead precisely when grassroots usage starts to scale
    - Official and current
  - - Research exemption ambiguity
    - Pricing says research institutions may qualify; legal pages refer to special considerations; communities still discuss compliance risk
    - Universities, nonprofits, hospital-research users
    - Ambiguity can freeze or delay renewals, expansions, or defaults-channel use
    - Mixed and still debated
  - - Community migration response
    - CaRCC, SunPy, and Scientific Python all published or linked transition guidance toward non-Anaconda channels
    - Academic and OSS-heavy practitioners
    - Alternative channels reduce defaults-channel stickiness and top-of-funnel monetization leverage
    - Independent and adverse
  - - Legal-enforcement signal
    - The Register reported legal notices and an HPC repository rollback at Mass General Brigham
    - Institutional shared-compute environments
    - Raises perceived switching and compliance risk for multi-user research environments
    - Independent and adverse
  - - Usability complaints
    - Review sites highlight slow startup, heavy installs, and dependency issues
    - Individual practitioners and small teams
    - Poor grassroots sentiment can raise the cost of internal expansion even when enterprise controls are strong
    - Independent and current
  notes: This extra table isolates non-product procurement friction because it is a material customer-acquisition and retention consideration for Anaconda specifically.
