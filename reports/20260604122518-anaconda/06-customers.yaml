- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Public evidence
  - Likely impact
  - Diligence path
  rows:
  - - Free to Starter to Business tiering
    - Official plans step from free individual use to paid team and governed enterprise use
    - Supports classic land-and-expand motion from practitioner adoption into budgeted team accounts
    - Request conversion funnel from free installs to Starter and Business
  - - Self-serve to sales-assisted seat expansion
    - Business self-serve appears capped at 15 seats; larger deployments move to sales
    - Large accounts can expand revenue materially but procurement friction rises
    - Request average seat growth after first paid purchase
  - - Workflow expansion inside regulated accounts
    - Zempler expanded governed Python from fraud into credit risk and AML; the financial-services roundup shows broader model-governance use cases
    - Cross-sell potential extends beyond a single model or notebook workflow
    - Request module / capability attach by top vertical
  - - Partner-assisted distribution
    - Resellers and services partners can sell and support Package Security Manager
    - Can extend reach geographically, but some customer experience may depend on partners
    - Request partner-sourced ARR and top-partner concentration
  - - Public proof concentrated in financial services
    - Most detailed named references are banks, credit unions, lenders, or credit-risk users
    - Vertical concentration can help ICP clarity but increases exposure to one procurement environment
    - Request ARR by industry and share from financial services
  - - Opaque top-customer exposure
    - Public sources do not disclose top-10 customer concentration or ACV distribution
    - Loss of one large regulated deployment could be material, but magnitude is untestable from public sources
    - Request top-10 customers as percent of ARR and renewal schedule
  - - Licensing friction in academia and nonprofits
    - Research communities formed transition working groups and advised alternative channels
    - Open-source-heavy segments may contract even if enterprise monetization rises
    - Measure institution-level churn or repo-usage decline since 2024
  - - Practitioner performance complaints
    - Review sites mention bulky installs, slow startup, and environment problems
    - Bottom-up champions may be less likely to recommend org-wide rollout if usability degrades
    - Track support tickets and review sentiment by version cohort
  notes: Expansion rows combine official pricing architecture, case-study use cases, partner pages, and adverse community evidence; quantitative concentration data remains undisclosed.
