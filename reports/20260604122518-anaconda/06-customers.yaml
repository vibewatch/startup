  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: retention-metrics
    missingEvidence: NRR, GRR, churn, renewal rates, contract-length mix, and cohort retention by plan tier and vertical.
    whyItMatters: Without retention data, public customer proof cannot be translated into durable revenue quality or expansion efficiency.
    diligencePath: Request the last eight quarters of NRR, GRR, logo retention, average contract term, and renewal schedule segmented by Free-to-paid conversion, Starter, Business, and Enterprise cohorts.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer share of ARR, ACV distribution, and renewal calendar for the largest regulated accounts.
    whyItMatters: The public proof set is narrow and concentrated in regulated accounts, so a single large-customer loss could be material even though the exact exposure is unknown.
    diligencePath: Request top-10 customer ARR concentration, ACV histogram, and the next 24 months of renewal dates for customers above a defined revenue threshold.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: paid-customer-mix
    missingEvidence: Exact paid-account mix by geography, vertical, and plan tier, including how many organizations are active paying customers rather than free users or dormant historical downloads.
    whyItMatters: Public scale claims are very large, but they do not reveal where paid demand is concentrated or how much of the footprint sits in high-value regulated accounts.
    diligencePath: Request active paying accounts by plan, region, industry, and seat band, plus definitions for “organization,” “large enterprise,” and “user.”
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU001
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A fuller list of referenceable paying customers, including win date, deployment stage, seat count, renewal status, and whether each logo is current.
    whyItMatters: The public named-customer set is strong but small relative to Anaconda's claimed scale, so it may not represent the broader customer base or current renewal quality.
    diligencePath: Request a current customer-reference list with deployment status, contract size band, and permission to validate 8-10 references directly.
    relatedQuestionRefs:
    - QU024
    - QU027
    relatedTableRefs:
    - TU003
