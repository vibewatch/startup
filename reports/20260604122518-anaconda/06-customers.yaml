- id: named-customer-proof
  title: Named customer proof and reference quality
  body: |-
    Anaconda's named customer proof is materially stronger than a typical developer-platform logo page because several accounts disclose production context, quantified outcomes, and buyer-level rationale. Zempler Bank is the cleanest commercial reference: the company says Anaconda underpins fraud, credit-risk, and AML workflows and helped reduce fraud by more than 90 percent while keeping customer complaints limited. Vantage West is also strong because the reference is not just about Python convenience; it ties Anaconda directly to regulated package governance, annual NCUA examinations, and an easier steady-state security posture. The unnamed European financial institution is less useful as a logo, but very useful as a depth signal because it discloses 300 active modelers and 500 projects.

    Outside financial services, Moog and McGill prove that Anaconda also supports complex practitioner workflows with quantified outcomes. Moog describes a production engineering automation use case that cut analysis time by more than 75 percent. McGill describes not only reproducibility benefits but a high-visibility AI drug-discovery workflow that reduced environment-setup time dramatically and supported publishable research. Reference quality drops where Anaconda publishes only thinner narratives, as in Hyperbound or SLB, because those pages show customer relevance but not the same depth of production evidence. Overall, named proof quality is good for a software infrastructure vendor, but still concentrated in a small number of current, company-published case studies.
