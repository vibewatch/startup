  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: free-to-paid-conversion
      missingEvidence: "Anaconda does not publicly disclose paid customer count, paid seat count, conversion from 50M+ free users, or retention by cohort."
      whyItMatters: "Without conversion and retention data, it is impossible to know whether Anaconda's brand reach translates into durable commercial moat or mostly unpaid awareness."
      diligencePath: "Request cohort conversion, paid seat growth, churn reasons, and renewal retention segmented by individual, team, and regulated-enterprise customers."
      relatedQuestionRefs: [QP025]
      relatedTableRefs: [TP004]
    - type: missing-source
      severity: material
      topic: enterprise-price-transparency
      missingEvidence: "Accessible public sources did not expose a clean Anaconda business or enterprise list price for seats, workspaces, or package-governance tiers."
      whyItMatters: "Price transparency affects win-rate analysis against Posit, AWS, Google, and OSS substitutes, especially where lighter tools are free or usage-based."
      diligencePath: "Collect current sales quotes, standard discount bands, and sample contracts for Business and Enterprise tiers; compare to Posit named-user pricing and cloud notebook spend."
      relatedQuestionRefs: [QP024]
      relatedTableRefs: [TP003]
    - type: conflicting-data
      severity: minor
      topic: category-definition-noise
      missingEvidence: "Technographic market-share sources classify Anaconda in a very broad category that also contains tools like pandas, Spark, SageMaker, and Vertex AI."
      whyItMatters: "Category noise makes third-party share and competitor-set data unreliable for precise market sizing or share-based moat claims."
      diligencePath: "Treat technographic share data as directional only and validate the true competitive set through win/loss logs, procurement alternatives, and buyer interviews."
      relatedQuestionRefs: [QP026]
      relatedTableRefs: [TP001]
