callouts:
  - calloutType: strength
    title: Governance is the part of Anaconda that is hardest to replace
    body: >
      Free tools can reproduce notebooking and local environments, but Anaconda's commercial value is more durable in curated packages, CVE-aware governance, directory-linked controls, and repeatable deployment across cloud, on-prem, and air-gapped estates.
    claimRefs: [CP003, CP005, CP006, CP033, CP037]

  - calloutType: risk
    title: Posit is the closest direct enterprise peer
    body: >
      Posit competes on the same control plane that matters to serious data teams: centrally managed workbenches, governed Python/R repositories, publishing, auditability, and support. It is a more direct enterprise comparison than notebook-only tools.
    claimRefs: [CP009, CP010, CP011, CP012]

  - calloutType: risk
    title: Cloud incumbents can win without matching conda feature-for-feature
    body: >
      Databricks, SageMaker, and Colab only need to make integrated notebooking, identity, and data access good enough to shrink the budget left for a separate environment-management platform.
    claimRefs: [CP014, CP018, CP021, CP036, CP039]

  - calloutType: risk
    title: Open-source substitutes already create real churn pressure
    body: >
      Review sites repeatedly show the same pattern: users value Anaconda's convenience, but many complain about heaviness, stale packages, and resource use, and at least some buyers think free open-source tools already satisfy the job.
    claimRefs: [CP028, CP029, CP030, CP038, CP044]

