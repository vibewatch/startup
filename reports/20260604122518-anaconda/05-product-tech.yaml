- id: architecture-deployment-and-integrations
  title: Architecture, deployment model, and integrations
  body: |-
    The public operating model has four visible layers. First is the package and environment substrate: conda, repo.anaconda.com, anaconda.org, and the broader conda ecosystem. Second is the governance/control layer in Anaconda Platform Cloud, where organizations manage channels, policies, identities, environment logging, and audit trails. Third is the user-facing execution layer: Navigator and Desktop on local machines, Notebooks in the browser, and AI Catalyst across local, Desktop, CLI, or AWS-backed deployment paths. Fourth is the partner runtime layer, where Anaconda injects governed package or model flows into systems customers already use, especially Databricks and Microsoft surfaces.

    The Databricks documentation is unusually concrete for Anaconda. It shows a custom-container pattern using Databricks Container Services, Miniconda bootstrapping, conda-token authentication, strict channel priority, and a virtual organization channel under repo.anaconda.cloud. That matters because it turns Anaconda from a passive package source into an active part of production runtime assembly. The Microsoft side is also strategically important: Azure licensing terms, the older Azure partnership announcement, and Microsoft's own Python in Excel materials all show Anaconda distribution assets embedded in broader partner workflows rather than used only through standalone Anaconda interfaces. AI Catalyst adds a newer deployment lane on top of that stack, centered on curated model catalogs, controlled inference, AI BOMs, and self-hosted VPC deployment. Public architecture is specific enough to understand the control surfaces and dependencies, but still thinner than a true internal engineering blueprint; tenant-isolation design, service topology, and formal uptime boundaries remain only partially exposed.
