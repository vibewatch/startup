- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Status
  - Scope
  - Gap / risk
  rows:
  - - Encryption in storage and transit
    - Publicly stated
    - Disk, database, webhooks, APIs, and HTTPS/TLS traffic
    - No public key-management architecture or regional data-path detail
  - - Security testing and baseline controls
    - Publicly stated
    - Annual third-party pen tests, full-disk encryption, VPNs, password managers, 2FA
    - Control language is clear, but external audit detail is not public
  - - ISO 27001 and supplier certification
    - Publicly stated
    - Anaconda certification plus ISO/SOC2 supplier requirement
    - Certification scope and audit cadence are summary-level publicly
  - - Enterprise SSO and provisioning
    - Publicly documented
    - OpenID, SAML, SCIM, automated provisioning/deprovisioning for qualifying customers
    - Requires Business or Custom plan and at least five licensed members
  - - Audit logs
    - Limited early access
    - Org-level events, filters, export, and API access
    - Early-access status suggests capability depth or availability may still be evolving
  - - Environment logging and CVE scanning
    - Publicly documented
    - Registered machines, package logs, CVE views, and admin-policy checks
    - Public docs do not quantify scan freshness SLAs or false-positive handling metrics
  - - Desktop / distro reliability signals
    - Mixed
    - Installer hardening landed, but Qt issues and OS support cutoffs remain public
    - Desktop polish still lags the maturity of the packaging/governance story
  notes: This table mixes control assertions and public quality signals because buyer diligence must assess both formal compliance posture and day-two operating reality.
