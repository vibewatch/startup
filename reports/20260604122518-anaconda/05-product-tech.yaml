  - - Anaconda Platform (Cloud)
    - Platform admins, security teams, enterprise developers
    - Cloud control plane
    - Publicly documented
    - Channels, policies, org management, vulnerability tracking, environment logging, and APIs
    - SKU packaging versus Core and AI Platform naming still feels in flux publicly
  - - AI Catalyst
    - Enterprise AI developers and platform teams
    - AWS-backed plus local and self-hosted access paths
    - Launched in late 2025
    - Curated model catalog, AI BOMs, risk profiles, controlled inference, and VPC deployment
