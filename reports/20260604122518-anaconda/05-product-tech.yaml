  evidenceGaps:
  - type: missing-source
    severity: material
    topic: commercial-packaging
    missingEvidence: A public, side-by-side pricing and entitlement matrix that cleanly separates Anaconda Core, Platform Cloud, AI Catalyst, Desktop, Navigator, and Notebooks.
    whyItMatters: Without a clean public packaging matrix, investors cannot tell which controls are included in base platform seats versus which require separate products or partner deployments.
    diligencePath: Request current packaging, pricing, and SKU-boundary collateral from sales or product operations, including seat minimums and deployment prerequisites.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE001
  - type: missing-source
    severity: material
    topic: reliability-transparency
    missingEvidence: Public SLA, status-history, and tenant-isolation documentation for Anaconda Platform Cloud and AI Catalyst.
    whyItMatters: Security and audit features are documented, but regulated buyers also need hard uptime, incident, and multi-tenant isolation evidence before treating the platform as fully de-risked.
    diligencePath: Request trust-center materials, status-history exports, architecture diagrams, and contractual SLA language under NDA from security or solutions engineering.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: enterprise-adoption
    missingEvidence: Named customer references for self-hosted, VPC, air-gapped, or Databricks-integrated deployments at production scale.
    whyItMatters: The product story depends on deployment and governance claims working in real enterprise environments, but public evidence still skews toward vendor-authored capability descriptions.
    diligencePath: Ask for customer architecture reviews, deployment reference calls, and implementation metrics segmented by self-hosted, cloud, and partner-runtime use cases.
