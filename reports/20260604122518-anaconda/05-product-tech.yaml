- id: trust-security-compliance-and-roadmap
  title: Trust, safety, compliance, support, and roadmap
  body: |-
    Trust and control are the most explicit parts of Anaconda's public message. The security and compliance page discloses encryption at rest and in transit, annual third-party penetration testing, 2FA, employee background checks, ISO 27001 certification, and supplier certification requirements. Platform docs add enterprise SSO over SAML or OpenID, optional SCIM-based provisioning, audit logs for organization events, and local-environment logging plus CVE scanning. Together, those materials support a real enterprise-governance story rather than a purely marketing-level “secure by default” slogan. The Microsoft and Databricks integrations reinforce that story because both revolve around approved packages, provenance, policies, and auditable runtime assembly.

    Reliability and support are credible but not fully transparent. The product surface clearly includes documentation, support-ticket flows, professional-services language, audit export APIs, and environment-scanning tools, but public material is lighter on hard SLA numbers, status history, and tenant-isolation architecture than on control language. That makes this a trust posture that looks procurement-friendly yet still diligence-worthy for large regulated buyers. Roadmap visibility is comparatively strong: the 2026 webinar and strategy blog point to more AI models, SageMaker support, secure pip install, continued self-hosted/VPC paths, and further integration of Core with AI Catalyst. The result is a product/technology story with strong momentum and strong governance framing, but one that still needs deeper private diligence on packaging boundaries, customer-scale operating metrics, and cloud-service reliability commitments before an investor should treat the platform claims as fully de-risked.
