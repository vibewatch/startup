- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow friction
  - Anaconda solution
  - Measurable benefit
  - Limitation
  rows:
  - - Get Python and core AI/data packages running fast
    - Manual installs, compiler issues, and environment drift
    - Distribution plus conda environments
    - Faster onboarding with pre-integrated packages and environment isolation
    - Package breadth is public; exact security or support guarantees by tier are less explicit
  - - Manage packages and apps without CLI
    - Terminal-first workflows slow less-technical users
    - Navigator GUI
    - Package search, install, app launch, and channel changes from one desktop surface
    - Known GUI compatibility issues still appear in release notes
  - - Start notebook work without local setup
    - Installing Jupyter and matching dependencies is tedious
    - Anaconda Notebooks
    - Browser launch with runtime choice, storage, Assistant help, and shareable Panel apps
    - Public materials are lighter on enterprise governance detail than on individual productivity
  - - Control open-source package risk across an organization
    - Teams pull from inconsistent channels and inherit unmanaged CVE exposure
    - Anaconda Platform Cloud
    - Central channels, policy filters, vulnerability tracking, and environment logging
    - Public docs do not fully expose SLA, tenant isolation, or status-history detail
  - - Run governed Python inside partner platforms
    - Databricks and Microsoft workflows otherwise require manual package governance
    - Databricks integration and Python in Excel/Azure packaging
    - Curated packages reach runtime and spreadsheet workflows with provenance and security controls
    - Partner paths add deployment complexity and make commercial responsibility boundaries harder to see
  - - Move from model experimentation to controlled enterprise AI deployment
    - Model selection, inference security, and governance reviews add weeks or months
    - AI Catalyst
    - Curated model catalog, BOMs, risk profiles, CPU/GPU flexibility, and VPC options
    - Need independent proof of production outcomes and scale under enterprise workloads
  notes: Benefits are directional because public material is richer on workflow mechanics than on audited customer outcome metrics.
