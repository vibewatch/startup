  claims:
    - { id: CV001, statement: "Anaconda said in July 2025 that it raised over $150M in Series C funding led by Insight Partners with participation from Mubadala Capital and that it was operating profitably above $150M ARR.", type: company-claimed, topic: round-arr, sourceRefs: [SV001, SV002, SV003], confidence: high, freshness: recent, answersQuestionRefs: [QV001, QV016, QV026] }
    - { id: CV002, statement: "Anaconda's official materials say it has over 21 billion downloads, more than 50 million users, more than 10,000 large enterprises, and usage by 95% of the Fortune 500.", type: company-claimed, topic: scale, sourceRefs: [SV001, SV008], confidence: high, freshness: recent, answersQuestionRefs: [QV004, QV016, QV021] }
    - { id: CV003, statement: "The company said the new capital would fund product development, strategic acquisitions, international expansion, and liquidity options for current and former employees.", type: company-claimed, topic: use-of-proceeds, sourceRefs: [SV001, SV005], confidence: medium, freshness: recent, answersQuestionRefs: [QV020] }
    - { id: CV004, statement: "Independent coverage and databases place Anaconda's 2025 Series C valuation at about $1.5B.", type: third-party-reported, topic: valuation, sourceRefs: [SV003, SV004, SV006, SV007], confidence: medium, freshness: recent, answersQuestionRefs: [QV002, QV026] }
    - { id: CV005, statement: "A reported $1.5B valuation on more than $150M ARR implies roughly a 10x ARR multiple.", type: estimated, topic: valuation, sourceRefs: [SV001, SV004, SV006], confidence: medium, freshness: recent, answersQuestionRefs: [QV003, QV015] }
    - { id: CV006, statement: "Anaconda launched the Anaconda AI Platform in May 2025 as a unified open-source AI platform centered on security, governance, and deployment.", type: company-claimed, topic: product-expansion, sourceRefs: [SV008, SV003], confidence: medium, freshness: recent, answersQuestionRefs: [QV005, QV016] }
    - { id: CV007, statement: "Company and investor materials position Anaconda as moving beyond package management toward a comprehensive model hub and governed AI workflow layer for enterprise Python.", type: company-claimed, topic: product-expansion, sourceRefs: [SV001, SV002, SV008], confidence: medium, freshness: recent, answersQuestionRefs: [QV005, QV016] }
    - { id: CV008, statement: "Anaconda's pricing page lists Starter at $15 per user per month, Business at $50 per user per month, and custom enterprise pricing beyond that.", type: company-claimed, topic: pricing-licensing, sourceRefs: [SV009], confidence: medium, freshness: current, answersQuestionRefs: [QV006, QV021] }
    - { id: CV009, statement: "Anaconda's official pricing note says organizations with 200 or more employees or contractors require a paid Business license, with separate handling for some academic and nonprofit research cases.", type: company-claimed, topic: pricing-licensing, sourceRefs: [SV009, SV029, SV030], confidence: high, freshness: current, answersQuestionRefs: [QV006, QV021, QV022] }
    - { id: CV010, statement: "Anaconda Core is marketed around 4,000+ vetted Python packages, auditable environments, reproducible deployment, and no vendor lock-in across cloud and on-prem infrastructure.", type: company-claimed, topic: platform-moat, sourceRefs: [SV010], confidence: medium, freshness: current, answersQuestionRefs: [QV021] }
    - { id: CV011, statement: "Anaconda said in its AI Platform launch announcement that customer count had quadrupled to more than one million in the prior year.", type: company-claimed, topic: scale, sourceRefs: [SV008], confidence: medium, freshness: recent, answersQuestionRefs: [QV004, QV016] }
    - { id: CV012, statement: "Precedence Research estimates the global data science platform market at $175.15B in 2025 and about $762.06B by 2035, implying a 15.84% CAGR.", type: third-party-reported, topic: market-growth, sourceRefs: [SV011], confidence: medium, freshness: current, answersQuestionRefs: [QV007] }
    - { id: CV013, statement: "Technavio estimates the data science platform market will increase by $707.84B at a 33.1% CAGR from 2025 to 2030.", type: third-party-reported, topic: market-growth, sourceRefs: [SV012], confidence: medium, freshness: current, answersQuestionRefs: [QV007] }
    - { id: CV014, statement: "Independent market reports agree that the category is large and fast-growing, but they disagree sharply on absolute size and pace, so TAM supports relevance more than precise valuation math.", type: inferred, topic: market-growth, sourceRefs: [SV011, SV012], confidence: medium, freshness: current, answersQuestionRefs: [QV008, QV017] }
    - { id: CV015, statement: "Reuters-syndicated coverage framed the Series C as arriving amid increased competition in enterprise AI software.", type: third-party-reported, topic: competition, sourceRefs: [SV004], confidence: medium, freshness: recent, answersQuestionRefs: [QV017, QV025] }
    - { id: CV016, statement: "Databricks said in December 2025 that it was raising more than $4B at a $134B valuation on a $4.8B revenue run-rate, above 55% year-over-year growth, and above 140% net retention.", type: third-party-reported, topic: comparable-band, sourceRefs: [SV025], confidence: medium, freshness: recent, answersQuestionRefs: [QV014, QV016] }
    - { id: CV017, statement: "Databricks' disclosed financing implies roughly a 27.9x run-rate multiple, far above Anaconda's reported ~10x ARR multiple.", type: estimated, topic: comparable-band, sourceRefs: [SV025, SV001, SV004], confidence: medium, freshness: recent, answersQuestionRefs: [QV014, QV015] }
    - { id: CV018, statement: "Atlassian traded at about $25.76B market cap and $6.19B TTM revenue in early June 2026, or roughly 4.2x revenue.", type: third-party-reported, topic: comparable-band, sourceRefs: [SV013, SV014], confidence: medium, freshness: current, answersQuestionRefs: [QV010, QV015] }
    - { id: CV019, statement: "GitLab traded at about $5.22B market cap and $0.95B TTM revenue in early June 2026, or roughly 5.5x revenue.", type: third-party-reported, topic: comparable-band, sourceRefs: [SV016, SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV011, QV015] }
    - { id: CV020, statement: "Datadog traded at about $89.10B market cap and $3.67B TTM revenue in early June 2026, or roughly 24.3x revenue.", type: third-party-reported, topic: comparable-band, sourceRefs: [SV019, SV020], confidence: medium, freshness: current, answersQuestionRefs: [QV012, QV015] }
    - { id: CV021, statement: "Asana traded at about $1.89B market cap and $0.79B TTM revenue in early June 2026, or roughly 2.4x revenue.", type: third-party-reported, topic: comparable-band, sourceRefs: [SV022, SV023], confidence: medium, freshness: current, answersQuestionRefs: [QV013, QV015] }
    - { id: CV022, statement: "Anaconda's reported ~10x ARR multiple sits above mature public software names such as Atlassian, GitLab, and Asana but below premium AI and data-platform leaders such as Databricks and Datadog.", type: inferred, topic: comparable-band, sourceRefs: [SV001, SV004, SV013, SV014, SV016, SV017, SV019, SV020, SV022, SV023, SV025], confidence: medium, freshness: current, answersQuestionRefs: [QV009, QV015, QV026] }
    - { id: CV023, statement: "Because the public comparable band ranges from about 2x to nearly 28x revenue, Anaconda's fair value depends more on growth durability and unit-economics quality than on any single peer multiple.", type: inferred, topic: comparable-band, sourceRefs: [SV013, SV014, SV016, SV017, SV019, SV020, SV022, SV023, SV025], confidence: medium, freshness: current, answersQuestionRefs: [QV009, QV015] }
    - { id: CV024, statement: "The public evidence reviewed discloses ARR and profitability, but not audited financial statements, gross margin, NRR, customer concentration, or exact round terms.", type: inferred, topic: disclosure-gap, sourceRefs: [SV001, SV003, SV004, SV006, SV007], confidence: medium, freshness: current, answersQuestionRefs: [QV018, QV026, QV029] }
    - { id: CV025, statement: "Reuters-syndicated reporting said Anaconda did not immediately respond to a request for comment on its valuation, so price support relies on secondary reporting rather than company confirmation.", type: third-party-reported, topic: disclosure-gap, sourceRefs: [SV004], confidence: medium, freshness: recent, answersQuestionRefs: [QV018, QV026] }
    - { id: CV026, statement: "GetLatka estimates Anaconda at $290.6M total funding, $1.5B valuation, and roughly 572 employees by late 2025.", type: third-party-reported, topic: funding-overhang, sourceRefs: [SV006], confidence: low, freshness: recent, answersQuestionRefs: [QV019] }
    - { id: CV027, statement: "Tracxn reports Anaconda at $210M total funding, $1.5B valuation, roughly 571 employees, and identifies Databricks, Altair, and QlikTech as leading competitors.", type: third-party-reported, topic: funding-overhang, sourceRefs: [SV007], confidence: low, freshness: current, answersQuestionRefs: [QV019] }
    - { id: CV028, statement: "Because major data vendors disagree on cumulative capital raised by roughly $80M, public database evidence alone cannot resolve the dilution or liquidation-preference overhang.", type: inferred, topic: funding-overhang, sourceRefs: [SV006, SV007], confidence: medium, freshness: current, answersQuestionRefs: [QV019, QV018, QV029] }
