  researchQuestions:
    - { id: QV001, question: "What July 2025 financing facts did Anaconda itself disclose about amount raised, lead investors, and ARR?", type: verification, targets: [contentRequirements/2], status: answered }
    - { id: QV002, question: "What valuation do independent reports assign to Anaconda's 2025 Series C?", type: verification, targets: [contentRequirements/2], status: answered }
    - { id: QV003, question: "What implied ARR multiple does the reported valuation create on the disclosed ARR base?", type: quantification, targets: [contentRequirements/2], status: answered }
    - { id: QV004, question: "What operating-scale evidence exists across users, enterprises, and Fortune 500 penetration?", type: quantification, targets: [contentRequirements/0], status: answered }
    - { id: QV005, question: "What product transition beyond package management is management selling to justify higher strategic value?", type: mechanism, targets: [contentRequirements/0], status: answered }
    - { id: QV006, question: "What official pricing and licensing structure monetizes enterprise adoption?", type: verification, targets: [contentRequirements/2], status: answered }
    - { id: QV007, question: "What market-growth outlook do independent data science platform reports project for 2025-2035 or 2025-2030?", type: quantification, targets: [contentRequirements/0], status: answered }
    - { id: QV008, question: "How divergent are TAM estimates across market reports, and what does that mean for underwriting valuation?", type: adverse, targets: [contentRequirements/0], status: answered }
    - { id: QV009, question: "Which disclosed public or private software companies best bound Anaconda's valuation read-through?", type: comparison, targets: [contentRequirements/4], status: answered }
    - { id: QV010, question: "What public multiple does Atlassian trade at in June 2026?", type: quantification, targets: [contentRequirements/4], status: answered }
    - { id: QV011, question: "What public multiple does GitLab trade at in June 2026?", type: quantification, targets: [contentRequirements/4], status: answered }
    - { id: QV012, question: "What public multiple does Datadog trade at in June 2026?", type: quantification, targets: [contentRequirements/4], status: answered }
    - { id: QV013, question: "What public multiple does Asana trade at in June 2026?", type: quantification, targets: [contentRequirements/4], status: answered }
