  evidenceGaps:
    - type: missing-source
      severity: material
      topic: cap-table-preference-stack
      missingEvidence: Exact post-money valuation, share count, class-by-class liquidation preferences, and a primary-versus-secondary split for the 2025 Series C.
      whyItMatters: Headline valuation can overstate real equity value if preferences, seniority, or large secondary components are hiding in the round structure.
      diligencePath: Request the signed term sheet, cap table, and waterfall model from finance and counsel.
      relatedQuestionRefs: [QV019, QV027]
    - type: private-evidence-only
      severity: material
      topic: unit-economics-and-retention
      missingEvidence: Audited ARR bridge, gross margin, NRR, logo churn, free-cash-flow profile, and customer concentration by segment.
      whyItMatters: These metrics determine whether Anaconda deserves an AI-platform premium or should trade closer to mature tooling multiples.
      diligencePath: Review audited statements, board metrics deck, and cohort analysis in the data room.
      relatedQuestionRefs: [QV018, QV023, QV024, QV029]
    - type: conflicting-data
      severity: material
      topic: historical-capital-raised
      missingEvidence: Company-confirmed financing history reconciling the large differences between public databases on total capital raised.
      whyItMatters: Preference-overhang analysis is unreliable if public sources disagree materially on how much preferred capital already sits above new money.
      diligencePath: Obtain a management-certified financing history and match it to the cap table.
      relatedQuestionRefs: [QV019]
    - type: stale
      severity: material
      topic: licensing-impact-by-segment
      missingEvidence: Retention, churn, and conversion data showing the net revenue effect of the 2024-2026 licensing and enforcement changes across research, SMB, and enterprise cohorts.
      whyItMatters: The anti-thesis is materially stronger if monetization is shrinking the ecosystem faster than it is converting high-value users.
      diligencePath: Request segment-level renewal and expansion data, plus support and channel migration analysis.
      relatedQuestionRefs: [QV022, QV017]
    - type: private-evidence-only
      severity: material
      topic: exit-readiness
      missingEvidence: Audited financials, governance-readiness materials, and banker-style positioning on likely strategic buyers or IPO readiness.
      whyItMatters: Exit timing and achievable return multiples depend on whether the company can support a clean strategic or public-market process.
      diligencePath: Review audit status, governance checklist, and banker or board materials on exit planning.
      relatedQuestionRefs: [QV028, QV029]
    - type: enumeration-incomplete
      severity: minor
      topic: comparable-set-coverage
      missingEvidence: Fresh disclosed revenue and valuation data for nearer private peers such as Dataiku, Domino Data Lab, and H2O.ai.
      whyItMatters: The current comparable table is decision-useful, but broader peer coverage could refine where Anaconda belongs within the software and AI-platform band.
      diligencePath: Expand the comp set once newer private financing or M&A disclosures surface.
      relatedTableRefs: [TV004]
