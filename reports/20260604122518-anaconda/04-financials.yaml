  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: lifetime-funding
    missingEvidence: A reconciled round-by-round funding schedule tied to the legal entity and post-money capitalization.
    whyItMatters: Third-party databases disagree materially on lifetime capital raised, which blocks precise dilution, cash-efficiency, and financing-history analysis.
    diligencePath: Request the cap table plus a financing ledger that reconciles every round, debt instrument, and secondary or liquidity component.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: revenue-range-precision
    missingEvidence: Audited or management-certified revenue, ARR, billings, and customer-count bridges that tie public claims to the actual P&L.
    whyItMatters: Wide third-party revenue ranges and mixed denominator traction claims are not precise enough for underwriting or valuation work.
    diligencePath: Request monthly recurring revenue, annualized recurring revenue, billings, and a user-to-paid-account reconciliation for the last eight quarters.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash on hand, monthly net burn, liquidity forecast, and any debt or covenant schedule after the 2025 round.
    whyItMatters: Without cash and burn, the next-round trigger, downside financing risk, and runway months cannot be assessed.
    diligencePath: Request the latest balance sheet, twelve months of monthly cash burn, and the board’s runway model under base and downside cases.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin-services-mix
    missingEvidence: Gross margin by stream, services revenue share, professional-services margin, and AI-inference cost as a share of COGS.
    whyItMatters: The central margin-path question cannot be answered numerically from public sources, especially as Anaconda expands from package governance into model-serving workflows.
    diligencePath: Request a stream-by-stream gross-margin bridge plus a forecast for compute and support costs tied to AI Platform and AI Catalyst adoption.
    relatedQuestionRefs:
    - QI027
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: sales-efficiency-stack
    missingEvidence: CAC, sales-cycle length, pipeline conversion, net revenue retention, gross retention, and payback by channel or segment.
    whyItMatters: Public ARR and profitability are encouraging, but they do not reveal whether enterprise growth is efficient, durable, or increasingly costly to sustain.
    diligencePath: Request the sales KPI deck with CAC, payback, NRR, churn, ACV, and cycle times split by direct, partner, and self-serve motions.
    relatedQuestionRefs:
    - QI028
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: revenue-recognition-policy
    missingEvidence: Formal revenue-recognition policy, deferred-revenue roll-forward, and any remaining performance obligation disclosure or management equivalent.
    whyItMatters: A mixed cloud, self-hosted, and support-backed offering set creates recognition complexity that directly affects revenue quality and comparability.
    diligencePath: Request the controller’s revenue-recognition memo and deferred-revenue schedule by product and contract type.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI001
    - TI005
