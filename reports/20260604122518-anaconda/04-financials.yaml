- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Current value or status
  - Confidence
  - Implication
  - Diligence ask
  rows:
  - - 2025 Series C financing
    - Over $150M
    - High
    - Meaningful fresh capital materially reduces near-term funding pressure
    - Request closing memo and post-money cap table
  - - Supportable valuation
    - ~$1.5B
    - High
    - Sets current financing benchmark for any next-round or liquidity analysis
    - Request board-approved valuation materials and last 409A context
  - - Profitability / scale anchor
    - Profitable with >$150M ARR
    - Medium
    - Improves capital adequacy signal even without cash disclosure
    - Request audited revenue, EBITDA, and cash flow
  - - Planned use of funds
    - AI features, acquisitions, global expansion, employee liquidity
    - High
    - Capital is earmarked for growth rather than just maintenance
    - Request capital-allocation plan by bucket
  - - Cash on hand
    - null
    - Low
    - Current liquidity cannot be underwritten publicly
    - Request most recent balance sheet and treasury position
  - - Monthly burn
    - null
    - Low
    - Cannot compute runway or downside scenario resilience
    - Request trailing 12-month monthly net burn
  - - Runway months
    - null
    - Low
    - Next-round timing is unknowable without cash and burn
    - Request board runway model and scenario plan
  - - Historical SEC filing anchor
    - $2.6M Form D fully sold in 2021; revenue range declined to disclose
    - High
    - Shows a history of financing plus long-standing disclosure restraint
    - Request full financing timeline and investor schedule
  - - Historical debt signal
    - $10M conventional debt in 2015 per Tracxn; no current debt publicly disclosed
    - Medium
    - Debt is part of the history, but current obligations remain unclear
    - Request debt facilities, covenants, and any security interests
  - - Lifetime capital raised
    - $210M-$290.6M public range depending on source
    - Medium
    - Database disagreement blocks precise dilution and cash-efficiency analysis
    - Request reconciled round-by-round financing ledger
  notes: Public capital adequacy is directionally positive because the company says it is profitable and freshly funded, but exact liquidity and leverage remain undisclosed.
