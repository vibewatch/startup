tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value or status
  - Quality
  - Diligence ask
  rows:
  - - Free/open-source funnel
    - Free personal, academic, nonprofit, and small-company access seeds future paid conversion
    - User / organization
    - Active top-of-funnel; monetization indirect
    - Low direct revenue quality but strong acquisition engine
    - Request free-to-paid conversion by segment and cohort
  - - Starter subscriptions
    - Self-serve collaboration plan
    - $15 per user per month
    - Public list price; self-serve only up to 15 seats
    - High recurring pricing transparency, low realized ASP visibility
    - Request monthly vs annual mix and discounting
  - - Business subscriptions
    - Governance and security plan with premium repository and notebooks
    - $50 per user per month
    - Public list price; >200-employee organizations require Business licensing
    - High recurring quality, better feature-driven upsell
    - Request renewal, seat expansion, and net retention by account size
  - - Custom enterprise / self-hosted contracts
    - Negotiated contracts for large teams, on-prem, air-gapped, or broader deployment needs
    - Contract / license
    - Contact-sales path; pricing undisclosed
    - Medium-high quality but realization opaque
    - Request ACV, term length, and subscription-versus-service split
  - - Enterprise-scale compute surcharges
    - Additional payment for HPC, serverless, and burst-compute usage patterns
    - Usage / infrastructure
    - Required by terms for enterprise-scale patterns
    - Medium quality because it monetizes heavy usage but is non-transparent
    - Request rate card and gross-margin profile for scaled deployments
  - - Implementation, support, and partner-led deployment
    - Higher-touch setup, policy configuration, support, and possible OEM or partner-assisted delivery
    - Project / annual support
    - Supportable from docs and partner routes, but revenue not disclosed
    - Medium quality and likely lower margin than software subscriptions
    - Request services revenue share and support attach rate
  notes: Public evidence supports the monetization architecture and list pricing, but not the realized mix between self-serve, enterprise, and services revenue.
