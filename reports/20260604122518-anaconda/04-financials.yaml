- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  - Current public proxy
  - Severity
  rows:
  - - Paid-customer count and paid mix
    - Cannot reconcile users, organizations, enterprises, and customers into revenue quality
    - Request metric tree linking free users, active organizations, paying accounts, and enterprise customers
    - Official surfaces cite 10K enterprises, 250K organizations, and >1M customers
    - Material
  - - Realized ASP and discounts
    - List pricing does not reveal enterprise monetization quality or contraction risk
    - Request gross-to-net waterfall by tier and by direct vs partner channel
    - $15 Starter and $50 Business list prices; custom enterprise pricing not public
    - Material
  - - Gross margin and services margin
    - Blocks underwriting of contribution margin and AI-compute impact
    - Request gross margin by stream, services attach, and AI-inference COGS
    - Only directional software-like cost drivers are public
    - Blocking
  - - CAC, payback, NRR, churn, sales cycle
    - Sales efficiency and revenue durability cannot be modeled
    - Request cohort metrics, funnel conversion, and payback by segment/channel
    - ARR-per-employee and profitability are only proxies
    - Blocking
  - - Cash, burn, runway, and current debt
    - Cannot set next-round trigger or downside financing risk
    - Request monthly burn, cash bridge, runway model, and debt schedule
    - Fresh funding + profitability only directionally reduce risk
    - Blocking
  - - Revenue-recognition policy and deferred revenue
    - Public revenue quality cannot be mapped to accounting reality
    - Request revenue-recognition memo, deferred-revenue roll-forward, and services-recognition policy
    - Cloud/on-prem/custom deployment mix suggests multiple recognition patterns
    - Material
  - - Historical funding reconciliation
    - Conflicting totals undermine cap-table and capital-efficiency analysis
    - Request round-by-round financing schedule reconciled to legal entities
    - Public databases disagree on lifetime capital by more than $80M
    - Material
  notes: The key blocker is not lack of top-line traction; it is the absence of the private operating data needed to turn public scale signals into an investable underwrite.
