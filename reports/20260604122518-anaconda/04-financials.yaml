- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value or null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR
    - '>$150M as of Jul 2025'
    - High
    - Establishes real recurring scale and narrows financing risk
    - Request GAAP revenue, ARR bridge, and billings by product
  - - Profitability status
    - Profitable (company-claimed)
    - Medium
    - Suggests the business is not burning aggressively at current scale
    - Request EBITDA, operating income, and cash-flow statement
  - - Headcount
    - 571-576 employees in 2026 trackers
    - Medium
    - Key denominator for efficiency proxies and burn sensitivity
    - Request fully loaded headcount by function
  - - ARR per employee
    - ~$260K
    - Medium
    - Directional sales-efficiency proxy for infrastructure software
    - Request quota-carrying rep count and ARR per sales head
  - - Large enterprise count
    - '>10,000'
    - High
    - Shows enterprise penetration if the definition is consistent
    - Request paid enterprise account count and average seats per enterprise
  - - Broader organization/customer counts
    - 250K+ organizations; >1M customers; 50M users
    - Medium
    - Shows funnel size but also denominator ambiguity
    - Request a reconciled metric tree separating users, organizations, and paying customers
  - - Independent install-base proxy
    - 1,360+ companies on 6sense
    - Low
    - Provides an external lower bound on identifiable installations
    - Request customer logos or paid-customer count by segment
  - - ARR per large-enterprise floor
    - ~$15K implied by Sacra math
    - Low
    - Flags possible concentration of monetization in a subset of the enterprise base
    - Request ARR distribution by cohort and top-decile accounts
  - - CAC / payback
    - null
    - Low
    - Direct view into efficiency of the enterprise GTM engine is absent
    - Request fully loaded CAC, payback, and pipeline conversion by channel
  - - NRR / churn
    - null
    - Low
    - Most important recurring-revenue quality metric is undisclosed
    - Request NRR, gross retention, and cohort churn
  - - Gross margin / services mix
    - null
    - Low
    - Required to judge contribution margin and scalability of newer AI products
    - Request gross margin by stream and professional-services share of revenue
  notes: Public metrics are mostly traction proxies; the core SaaS unit-economics stack remains private.
