      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              The current executive bench is clearly disclosed even though the full board is not. Anaconda’s leadership
              pages list David DeSanto as chief executive officer, Jane Kim as co-president and chief commercial
              officer, Laura Sellers as co-president and chief product and technology officer, Peter Wang as chief AI
              and innovation officer and co-founder, Vanessa Macllwaine as chief people officer, and Megan Niedermeyer
              as chief legal officer. The major leadership change is the October 2025 appointment of DeSanto, a former
              GitLab chief product officer, as CEO and member of the board. That change appears material because a
              February 2024 IBM collaboration announcement still quoted Barry Libert as chief executive, implying a
              deliberate shift from an earlier leadership era into a more enterprise-software operating posture.
              Governance visibility is thinner than leadership visibility: official company sources name George Mathew
              of Insight Partners as a board director and confirm that DeSanto joined the board, but they do not publish
              a full roster of directors, committee structure, or investor control rights. Peter Wang remains a
              meaningful key-person dependency because he is both co-founder and the public face of the company’s
              product and open-source positioning, while DeSanto and the expanded executive team are now responsible for
              commercial execution, product scale, and legal/governance discipline.
