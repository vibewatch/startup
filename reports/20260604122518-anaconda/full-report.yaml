chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and business model
        blocks:
          - type: paragraph
            body: >-
              Anaconda was founded in 2012 by Peter Wang and Travis Oliphant, and current company materials position it
              as the trusted foundation for AI-native development. Official financing and leadership materials
              consistently place the company in Austin, Texas, while Tracxn classifies it as a private Series C company.
              The company’s product footprint has broadened materially from the historic Anaconda Distribution into a
              wider platform stack that includes package and environment management through Conda, the Anaconda Platform
              for secure and governed enterprise AI development, and cloud or self-hosted deployment options. That
              expansion matters because the business model is no longer just about free downloads: Anaconda monetizes
              repository access, governance, security, and deployment controls for organizations that need
              enterprise-grade open source management. Its own licensing pages make that monetization explicit by
              requiring paid business licensing for organizations above the 200 employee or contractor threshold unless
              they qualify for an exception. Scale signals remain mostly company-claimed but are substantial: the
              company says it has more than 50 million users, over 21 billion downloads, more than 10,000
              large-enterprise users, and penetration into 95% of the Fortune 500. Those metrics support the view that
              Anaconda already has global distribution gravity, even if the public materials do not convert that reach
              into a disclosed paying-customer figure.
