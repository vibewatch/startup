  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Anaconda sits between upstream Python package ecosystems, enterprise infrastructure, and substitute workflow
      platforms, so dependency risk is both technical and commercial.
    data:
      nodes:
        - id: core
          label: Anaconda platform
          description: Curated packages, notebooks, governance, AI features, and custom deployments.
        - id: pypi
          label: PyPI / open-source maintainers
          description: Upstream package ecosystem and security incident surface.
        - id: dbx
          label: Databricks
          description: Native integration and go-to-market partner for enterprise AI workflows.
        - id: cloud
          label: Cloud / orchestration
          description: AWS-linked infrastructure, S3, Kubernetes, and customer-selected hosting patterns.
        - id: alts
          label: Workflow substitutes
          description: uv, VS Code, PyPA tooling, SageMaker, and other adjacent platforms.
        - id: cust
          label: Enterprise customer
          description: Buyer seeking security, governance, reproducibility, and deployment speed.
      edges:
        - from: pypi
          to: core
        - from: dbx
          to: core
        - from: cloud
          to: core
        - from: alts
          to: cust
        - from: core
          to: cust
        - from: dbx
          to: cust
