  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view
        blocks:
          - type: paragraph
            body: >-
              Severity ranking matters here because Anaconda’s public profile mixes strong mitigants with a
              still-fragile proof of differentiation. The highest-severity risk is a supply-chain trust event: the
              company sells curated Python packages and secure governance, yet the Python ecosystem remains under active
              attack, PyPI continues to publish supply-chain incident reports, and OpenCVE shows Anaconda-controlled
              build and installer components suffered material flaws in 2024-2026. Second is AI and privacy compliance
              drift as the company broadens from package management into the AI Platform while the EU AI Act, DOJ
              bulk-data-transfer rule, and state privacy / AI mandates add governance overhead. Third is platform
              substitution: Databricks, SageMaker, VS Code, uv, and direct PyPA tooling all give buyers plausible ways
              to unbundle parts of the stack. Fourth is commercial friction from public license thresholds, seat gates,
              repricing, and limited baseline customer recourse. Fresh capital reduces insolvency risk, but it does not
              eliminate execution, margin, or retention risk if the premium governance story fails to hold.
