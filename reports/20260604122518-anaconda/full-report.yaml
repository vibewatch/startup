  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Anaconda's market boundary is best defined as governed Python and open-source data-science tooling for
              enterprise AI workflows. The company's own materials describe AI platforms for open-source data science
              and machine learning, while its paid offer bundles a secure package repository, team governance controls,
              browser notebooks, and a cloud-hosted development environment rather than storage, ETL, or model-training
              infrastructure. That means the included spend is package curation, environment management,
              notebook/workbench tooling, access control, vulnerability management, and adjacent enablement for teams
              that build with Python.

              Important adjacent categories sit nearby but should not be counted as Anaconda revenue opportunity without
              a narrower bridge. Databricks, SageMaker, and Azure Machine Learning bundle data access, training,
              deployment, governance, and observability inside broader cloud or lakehouse contracts. Jupyter, VS Code,
              Colab, PyPI plus pip, and other Conda channels serve as the status-quo open-source path for many users.
              Posit Package Manager, Posit Workbench, JFrog Artifactory, and Sonatype Nexus also cover parts of the same
              repository-governance and team-environment job. For this chapter, broad data science platform spend is
              context; the core addressable wedge is governed Python package and notebook workflows where compliance and
              reproducibility matter.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
