        - Mitigation maturity
        - Residual severity
      rows:
        - label: Supply-chain compromise
          values:
            - label: high
              tone: negative
              detail: PyPI incidents, registry abuse, and conda-build CVEs show a live attack surface.
            - label: critical
              tone: negative
              detail: A trust failure would hit the product’s core differentiation.
            - label: medium
              tone: warning
              detail: Curation, scanning, and security controls help but do not eliminate upstream risk.
            - label: high
              tone: negative
              detail: Residual exposure stays high until incident cadence and containment speed are proven.
        - label: AI / privacy compliance drift
          values:
            - label: medium-high
              tone: warning
              detail: EU AI Act and US privacy obligations are moving during product expansion.
            - label: high
              tone: negative
              detail: Compliance gaps could block regulated deployments or raise enterprise-sales friction.
            - label: medium
              tone: warning
              detail: Public policy pages and custom deployment options exist, but detailed mappings are not public.
            - label: high
              tone: warning
              detail: Residual risk remains elevated until subprocessor and control evidence is clearer.
        - label: Commercial-license friction
          values:
            - label: high
              tone: warning
              detail: Audit rights, renewal repricing, and seat gates are already embedded in public terms.
            - label: moderate-high
              tone: warning
              detail: This is more likely to slow expansion than to create existential risk.
            - label: medium
              tone: neutral
              detail: Clear packaging helps, and large customers can move to Custom plans.
            - label: medium-high
              tone: warning
              detail: Residual exposure depends on whether growth comes from product pull or enforcement mechanics.
        - label: Platform substitution
          values:
            - label: high
              tone: negative
              detail: uv, VS Code, SageMaker, Databricks, and direct PyPA tooling all attack pieces of the stack.
            - label: high
              tone: negative
              detail: Substitution can compress pricing even if market demand remains strong.
            - label: low-medium
              tone: warning
              detail: Security curation and governance are differentiators, but many adjacent features are table stakes.
            - label: high
              tone: negative
              detail: Residual severity is high until Anaconda proves durable enterprise attachment beyond package access.
        - label: Execution / support scaling
          values:
            - label: medium
              tone: warning
              detail: New capital, leadership changes, and broader scope raise coordination risk.
            - label: moderate-high
              tone: warning
              detail: Execution misses would weaken valuation support rather than threaten immediate liquidity.
            - label: medium
              tone: neutral
              detail: Profitability and fresh capital provide some cushion.
            - label: medium
              tone: warning
              detail: Public support and unit-economics detail are still too thin for full comfort.
    approximationNotes: null
