      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Several forces support continued demand for Anaconda's category. Python remains deeply embedded in data
              analysis and machine learning workflows, while Anaconda's own 2025 survey says 87% of respondents are
              using AI as much or more than last year. Survey and documentation evidence also shows that developers
              already mix PyPI, private indexes, internal mirrors, notebooks, and cloud training platforms, which makes
              governance and reproducibility increasingly important as teams move from experimentation to production.
              Public market reports add another tailwind by highlighting the importance of large enterprises and
              governed deployments rather than purely hobbyist usage.

              The constraint set is just as important. Free and bundled substitutes are abundant, so Anaconda cannot
              rely on notebook usage alone to force monetization. Trust and security are also double-edged: malware
              reporting and package-security workflows increase the need for curated repositories, but they also raise
              the proof burden on vendors that claim to make open source safer. Bundled cloud suites can absorb the
              spend inside existing data or cloud contracts, and standard PyPI-compatible repository alternatives from
              Posit, JFrog, and Sonatype reduce switching costs for buyers that only need package governance. Relative
              to cloud infrastructure vendors, Anaconda's software-led offer is less capital-intensive to deliver, but
              that also means differentiation must come from workflow depth, compliance trust, and distribution rather
              than proprietary compute economics.
