  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The main risks transmit through a small set of shared channels: trust in curated packages, compliance credibility,
      enterprise conversion, and valuation support.
    data:
      nodes:
        - id: n1
          label: Upstream package compromise
          description: Malware, compromised maintainers, or vulnerable build tooling enter the trusted workflow.
        - id: n2
          label: AI / privacy compliance burden
          description: EU AI Act, DOJ data-transfer, and state privacy requirements expand operating obligations.
        - id: n3
          label: Enterprise trust
          description: Security review results, legal comfort, and operational confidence.
        - id: n4
          label: Sales-cycle / deployment friction
          description: Procurement, architecture review, and implementation complexity.
        - id: n5
          label: Expansion / retention quality
          description: Seat growth, custom-plan adoption, and renewal durability.
        - id: n6
          label: Margin / support burden
          description: Security operations, hosting choices, premium support, and professional services load.
        - id: n7
          label: Valuation support
          description: Whether AI-platform positioning can sustain premium pricing and investor conviction.
      edges:
        - from: n1
          to: n3
        - from: n1
          to: n6
        - from: n2
          to: n3
        - from: n2
          to: n4
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n4
          to: n6
        - from: n5
          to: n7
        - from: n6
          to: n7
