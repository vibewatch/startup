      - number: '7.2'
        title: Regulatory, legal, and licensing risk
        blocks:
          - type: paragraph
            body: >-
              Public legal materials show a business that is explicit about monetization and risk transfer. For-profit
              organizations with more than 200 employees need paid Business licensing, Anaconda may verify user counts
              and true up overages, fees are non-refundable, prices can change at renewal, and account access can be
              suspended or terminated broadly. At the same time, the legal baseline places important limits on customer
              recourse: AI outputs are provided “as is,” AI features may rely on third-party services, customers bear
              broad indemnity duties, and Anaconda’s aggregate liability is capped at the prior twelve months of fees.
              None of that is unusual for modern software vendors, but it matters more here because Anaconda is now
              pitching regulated-industry and mission-critical AI use cases. On the regulatory side, the EU AI Act’s
              GPAI and transparency timelines, the DOJ bulk-data-transfer rule, and expanding state privacy enforcement
              all raise the compliance bar for any enterprise AI platform handling sensitive data or AI-assisted
              workflows. The company has mitigants—privacy notice, custom deployment options, and security
              documentation—but public evidence stops short of named subprocessors, detailed control mappings, or
              negotiated enterprise protections.
