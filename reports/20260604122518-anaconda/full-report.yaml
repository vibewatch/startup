      - number: '3.2'
        title: 'Direct peer and incumbent platforms: Posit, Databricks, SageMaker, and Colab'
        blocks:
          - type: paragraph
            body: >
              Posit is the closest like-for-like enterprise alternative because it competes on the same control plane
              that matters to regulated data-science teams: managed R/Python development environments, governed package
              repositories, publishing, authentication, auditability, and support. Posit Workbench is explicitly sold as
              a way to move users off unmanaged local laptops and onto centrally managed infrastructure, while Posit
              Package Manager adds curated CRAN/PyPI sources, vulnerability blocking, AI-assistant governance, and
              air-gapped deployment. Posit's pricing page makes the GTM contrast clear: commercial packaging is
              structured around named users and repository limits, not per-download pricing, which can be attractive for
              larger centralized teams.


              Databricks and SageMaker are more dangerous distribution competitors than perfect product matches.
              Databricks is much larger in enterprise reach, with 20,000+ organizations and 70% of the Fortune 500 on
              the platform, plus a $10 billion Series J announced at a $62 billion valuation in late 2024. It prices
              infrastructure pay-as-you-go and already sits next to governed data, analytics, and AI workloads, so it
              can absorb notebook and environment demand into an existing data-platform relationship. SageMaker uses the
              same pattern from the AWS side: Unified Studio combines serverless notebooks, governance, cataloging, and
              a built-in AI agent, while AWS pricing stays consumption-based and free-tier friendly for initial notebook
              use.


              Google Colab Enterprise is a narrower but real adjacent threat. Official positioning emphasizes browser
              notebooks, collaboration, IAM-secured workspaces, and Google Cloud / Vertex AI integration. Even where
              Colab is not the system of record for enterprise package governance, it is often the easiest notebook
              front end for teams already committed to Google Cloud. In competitive terms, that means Anaconda has to
              win the governance-and-reproducibility conversation, not just the notebook conversation, because cloud
              incumbents can underwrite collaboration and data proximity from surrounding platform budgets.
