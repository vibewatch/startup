      - number: '6.2'
        title: Adoption trajectory and deployment scale
        blocks:
          - type: paragraph
            body: >-
              Public adoption data for Anaconda is abundant at the top of the funnel and thin at the paying-account
              layer. Company surfaces claim 47M+ to 50M+ users, 250K+ organizations, 21B+ downloads, 10K+ large
              enterprises, and 90-95% Fortune 500 penetration. Those numbers clearly signal enormous reach, but they do
              not tell investors how much of that footprint is active, paid, or strategically important. In other words,
              Anaconda has strong evidence of ubiquity, not equally strong evidence of monetized depth across that
              ubiquity.


              The clearest bottom-of-funnel adoption evidence comes from named deployments. The major European financial
              institution case study discloses 500 projects and 300 active modelers within 18 months, showing that once
              Anaconda clears governance hurdles it can spread widely inside a single enterprise. Review surfaces
              provide a different but useful signal: GetApp's 86 verified reviews suggest sustained practitioner usage,
              while 6sense's category view implies the company is relevant but not overwhelming versus broader
              data-science and machine-learning tooling. The resulting picture is a business with very broad discovery
              and awareness, real enterprise adoption inside at least some regulated accounts, and unresolved ambiguity
              about exactly how many of those millions of users become durable paid customers.
