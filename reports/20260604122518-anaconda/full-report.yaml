      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Anaconda's users span a much broader population than its likely payers. Individual learners, researchers,
              and practitioners can satisfy many workflows with Jupyter, VS Code, Colab, PyPI, and Conda without
              purchasing a governed commercial platform. Departmental data-science and ML teams become the first
              plausible economic buyers when notebook collaboration, reproducibility, curated packages, and access
              management matter across a team. In larger or regulated organizations, the payer shifts upward again:
              platform engineering, IT, or security teams care about policy enforcement, vulnerability blocking, SSO,
              auditability, and controlled distribution across many users.

              Public enterprise-platform pages reinforce that this is a multi-role purchase rather than a
              single-developer upsell. Azure Machine Learning explicitly targets data scientists, ML engineers,
              application developers, and platform developers. Posit frames centralized, governed environments as the
              alternative to unmanaged local setups, and Posit Package Manager frames package governance as a
              coordinated layer across the data-science lifecycle. The most plausible adoption path for Anaconda
              therefore starts with open-source Python usage, graduates to team notebooks and curated packages when
              workflows become shared, and only later reaches centralized budget owners once security and compliance
              requirements justify a broader rollout. Cloud-first teams may instead route the spend into Databricks,
              SageMaker, or Azure contracts.
