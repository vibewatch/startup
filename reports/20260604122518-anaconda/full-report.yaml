          - type: callout
            title: The whole bull case rests on conversion quality, not community reach
            body: >-
              Fifty million users and broad Fortune 500 adoption are powerful assets, but they only justify upside if
              the new AI Platform and governance layer turn that reach into durable, high-value enterprise expansion. If
              conversions lag while migrations rise, the multiple should compress rather than expand.
            calloutType: assumption
            claimRefs:
