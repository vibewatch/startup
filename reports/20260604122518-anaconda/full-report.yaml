            body: >-
              The financing context is constructive but incomplete. The July 2025 Series C brought in more than $150M
              from Insight Partners and Mubadala Capital, with stated uses including product development, acquisitions,
              international expansion, and employee liquidity. That last detail matters because it suggests the round
              may have mixed primary and secondary objectives; meanwhile third-party data vendors disagree on cumulative
              capital raised, leaving the preference stack opaque. Comparables argue for caution rather than panic.
              Databricks and Datadog show that AI/data platforms with strong growth and retention can command 24x-28x
              revenue. Atlassian, GitLab, and Asana show the other side of the range at roughly 2x-6x. Anaconda's
              reported ~10x ARR multiple therefore lands in the middle: above mature collaboration and DevOps software,
              below elite AI-infrastructure leaders. That placement is plausibly defensible if Anaconda's security and
              governance layer converts its installed base into durable enterprise spend, but public materials do not
              yet reveal the unit-economics evidence that would justify paying a premium with confidence. The comp set
