  - id: TV004
    title: Comparable valuation table
    enumerationScope:
      coverage: partial
      basis: >-
        This set intentionally covers the six most decision-useful public or private valuation anchors for this chapter:
        Anaconda itself, one premium private AI-data ceiling comp, and four disclosed public software comps. Coverage is
        partial because closer private peers such as Dataiku, Domino Data Lab, or H2O.ai do not all disclose fresh
        enough pricing and revenue data to support clean same-date multiple analysis.
    columns:
      - Comparable
      - Metric
      - Multiple / valuation / status
      - Relevance
      - Limitation
    rows:
      - - Anaconda (reported 2025 Series C)
        - '>$150M ARR and reported ~$1.5B valuation'
        - ~10x ARR
        - Direct subject company and current pricing reference
        - Valuation is secondarily reported and round terms are undisclosed.
      - - Databricks (Series L 2025)
        - $134B valuation on $4.8B revenue run-rate
        - ~27.9x run-rate
        - High-end AI/data platform ceiling for a scaled category leader
        - Much larger scale with disclosed >140% NRR and stronger revenue momentum than Anaconda.
      - - Datadog (public 2026)
        - $89.1B market cap and $3.67B TTM revenue
        - ~24.3x revenue
        - Premium public data-infrastructure multiple showing what elite growth and retention can command
        - Observability is not a direct Python-packaging analog and Datadog is far more transparent.
      - - GitLab (public 2026)
        - $5.22B market cap and $0.95B TTM revenue
        - ~5.5x revenue
        - Developer workflow and tooling reference closer to Anaconda's historic distribution roots
        - DevOps platform exposure is different from AI package governance and model management.
      - - Atlassian (public 2026)
        - $25.76B market cap and $6.19B TTM revenue
        - ~4.2x revenue
        - Mature enterprise software floor for a trusted workflow vendor with broad installed base
        - Scale and maturity are far beyond Anaconda and AI exposure is less central.
      - - Asana (public 2026)
        - $1.89B market cap and $0.79B TTM revenue
        - ~2.4x revenue
        - Lower-bound workflow SaaS multiple showing how slower-growth software gets priced
        - Product adjacency is weak and Asana is not an AI infrastructure business.
    notes: >-
      Market-cap and revenue figures are approximate June 2026 read-throughs from disclosed public-market data. The
      table is designed to bracket the multiple range, not to claim that any one comp is a direct plug-and- play analog
      for Anaconda. Public-company 10-K filings are included in the evidence set to highlight that these comps offer
      much stronger disclosure than Anaconda's private file set.
