  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Anaconda has enough real signal to stay on the shortlist. The company says it is profitable at more than
              $150M ARR, claims 50M users, 10,000+ large enterprises, and 95% of Fortune 500 penetration, and has
              repositioned from a Python distribution into a governed AI platform. Those are not trivial assets. But the
              investment decision is still price-sensitive. Anaconda itself did not disclose the Series C valuation, and
              Reuters-syndicated coverage said the company declined to comment on price even as outside reports pegged
              the round at about $1.5B. At that level the business is being valued at roughly 10x current ARR: not
              unreasonable for an AI infrastructure asset, but not obviously cheap relative to more mature software
              peers either. Because public evidence still lacks audited financials, gross margin, NRR, customer
              concentration, and exact round terms, the disciplined call is track rather than buy. Investors should
              treat the round price as a real signal of demand, not as definitive proof of fair value. The view improves
              only if diligence shows high-quality enterprise retention, clean preference structure, and measurable
              AI-platform upsell beyond the historic distribution business.
