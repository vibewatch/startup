  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Factor
      - Direction
      - Why now
      - Implication for Anaconda
      - Diligence ask
    rows:
      - - AI usage growth among data teams
        - Driver
        - 87% of Anaconda survey respondents are using AI as much or more than last year
        - More teams need governed Python and AI workflows
        - Verify whether this converts into paid platform expansion
      - - Persistent Python data-science adoption
        - Driver
        - Python still anchors data analysis and ML workflows in survey evidence
        - Large user base keeps the funnel relevant
        - Measure how much of this base prefers Conda versus pure pip workflows
      - - Package-security pressure
        - Driver
        - Malware reporting, CVE tracking, and curated repositories are now normal procurement concerns
        - Governance features can justify enterprise spend
        - Request retention and win-rate data in regulated accounts
      - - Large-enterprise and on-prem demand
        - Driver
        - Public market reports highlight large enterprises and on-prem deployments
        - Best-paying segment is likely governed enterprise teams
        - Test vertical mix and deal sizes by regulated sector
      - - Free substitute stack
        - Constraint
        - Jupyter, VS Code, Colab, PyPI, and Conda solve early-stage needs cheaply
        - Limits willingness to pay for notebook UX alone
        - Quantify free-to-paid conversion and trigger points
      - - Cloud-suite bundling
        - Constraint
        - Databricks, SageMaker, and Azure ML bundle adjacent jobs under existing contracts
        - Anaconda must win as a better governed Python layer, not just a notebook layer
        - Measure displacement versus coexistence in cloud-heavy accounts
      - - Repository alternatives
        - Constraint
        - Posit, JFrog, and Sonatype offer governance with standard package-manager flows
        - Switching cost may be lower than management hopes
        - Compare repository attach rates versus broader platform attach rates
      - - Trust and proof burden
        - Constraint
        - Security-sensitive buyers need evidence that governance claims reduce risk
        - Sales cycles depend on trust, auditability, and policy fit
        - Request security certifications, blocked-package metrics, and incident history
      - - Multi-role budget ownership
        - Constraint
        - Users, data leaders, IT, and security may all influence the purchase
        - Longer cycles and shared budgets can slow adoption
        - Map who signs and who vetoes by segment
      - - Lower capital intensity than infra suites
        - Constraint / driver
        - Software-led delivery lowers capex barriers but also lowers structural moats
        - Differentiation must come from workflow depth and trust
        - Test whether margins or retention offset easier entry
    notes: >-
      This table mixes demand-side drivers with adoption constraints because the same governance features that create
      need also lengthen enterprise buying cycles.
