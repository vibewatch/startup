      - number: '2.5'
        title: Sizing gaps, contradictions, and unresolved diligence asks
        blocks:
          - type: paragraph
            body: >-
              The main diligence issue is not whether a market exists, but how much of the public TAM is genuinely
              reachable by Anaconda's commercial offer. Public market estimates span from $73.46 billion to $203.53
              billion for 2026 and imply materially different growth rates through 2030-2035. Those figures almost
              certainly aggregate broader analytics, lakehouse, MLOps, and cloud-platform budgets that do not map
              cleanly to governed Python package management and notebook workflows. They are useful as outer bounds, not
              as a pricing or penetration model.

              The second gap is monetization. Public evidence supports that Anaconda has meaningful observed usage, but
              it does not disclose paid-seat counts, ARR, enterprise conversion rates, or the split between free and
              paid tiers. Public product pages name Free, Starter, Business, and Enterprise plans, yet they do not
              expose enough pricing detail to model spend by segment. Budget ownership is also only partially observable
              from product positioning rather than procurement records. The right next step for an investor is to
              reconcile broad market narratives with private evidence on paid penetration, regulated-industry mix, and
              the share of customers buying Anaconda specifically for repository governance versus notebook convenience.
            claimRefs:
              - CM014
              - CM015
              - CM022
              - CM039
              - CM040
              - CM041
              - CM042
