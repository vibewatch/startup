  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Anaconda's recommendation flows from real scale and monetization assets, through disclosure and licensing risks,
      into a track / research-more decision.
    data:
      nodes:
        - id: A
          label: '>$150M ARR + profitable'
          detail: Real operating scale exists, not just AI narrative.
          tone: positive
        - id: B
          label: 50M users / 10,000+ enterprises
          detail: Installed-base reach and customer proof are meaningful.
          tone: positive
        - id: C
          label: AI platform + governance monetization
          detail: Higher-value control-plane thesis can raise ARPU if attach works.
          tone: positive
        - id: D
          label: Licensing + churn risk
          detail: Research and open-source-heavy users can migrate to Miniforge or conda-forge.
          tone: risk
        - id: E
          label: Opaque terms and economics
          detail: Gross margin, NRR, concentration, and preference stack remain undisclosed.
          tone: risk
        - id: F
          label: track / research-more
          detail: Treat the reported ~$1.5B price as a ceiling for diligence, not a green light.
          tone: risk
      edges:
        - from: A
          to: B
          label: supports
        - from: B
          to: C
          label: enables
        - from: C
          to: D
          label: must outrun
        - from: D
          to: E
          label: amplifies
        - from: E
          to: F
          label: therefore
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV009
      - CV024
      - CV030
      - CV035
      - CV043
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      The valuation is most sensitive to two things public evidence cannot yet settle cleanly: ARR growth after the
      Series C and the multiple investors will pay for a governed AI-platform story.
    data:
      items:
        - label: 5x on $170M ARR
          value: 0.85
          unit: $B
          detail: Bearish software-tooling outcome with weak attach and muted growth.
          tone: risk
        - label: 7x on $185M ARR
          value: 1.3
          unit: $B
          detail: Low end of a base case if the platform helps but does not re-rate the story.
          tone: neutral
        - label: Reported round
          value: 1.5
          unit: $B
          detail: Secondary-reported 2025 reference point.
          tone: neutral
        - label: 9x on $220M ARR
          value: 1.98
          unit: $B
          detail: Upper base case with steady enterprise expansion.
          tone: neutral
        - label: 12x on $260M ARR
          value: 3.12
          unit: $B
          detail: Bull case where AI-platform monetization looks durable and premium-worthy.
          tone: positive
      xAxis: Scenario
      yAxis: Valuation ($B)
