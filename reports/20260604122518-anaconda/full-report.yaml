      - number: '6.4'
        title: Retention, durability, and satisfaction
        blocks:
          - type: paragraph
            body: >-
              Public retention visibility is the weakest part of Anaconda's customer story. None of the reviewed
              official surfaces, customer case studies, or third-party review pages disclose NRR, GRR, churn, renewal
              rates, or contract-length distributions. That means durability has to be inferred rather than verified.
              The best proxies come from regulated deployments where Anaconda becomes part of security, package
              provenance, audit trails, and model-governance workflows. Once a bank or credit union has embedded curated
              repositories, SSO, vulnerability controls, and production model-delivery practices into daily work,
              switching away is likely non-trivial.


              Satisfaction evidence is directionally positive but mixed. GetApp reviews are strong on overall sentiment,
              while TrustRadius reviews confirm that users value multi-version environment management and server-side
              deployments. At the same time, third-party complaints are consistent enough to matter: users describe
              bulky installs, slow startup, high RAM consumption, dependency-download failures, and occasional broken
              environments. That tension matters because Anaconda sells both top-down governance and bottom-up
              practitioner productivity. If administrator value is strong but everyday practitioner experience weakens,
              expansion can slow even without visible logo churn. The result is a customer-durability story that looks
              plausible in regulated production environments but remains impossible to quantify from public data alone.
