  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model, pricing architecture, and recognition quality
        blocks:
          - type: paragraph
            body: >-
              Anaconda’s public surfaces support a recurring software revenue model that starts with a broad free and
              open-source funnel and monetizes organizational governance, security, and enterprise deployment needs.
              Official pricing shows Starter at $15 per user per month and Business at $50 per user per month, while the
              Business Plan page says buyers can self-serve only up to 15 seats and that organizations with more than
              200 employees need a Business license. The terms go further by calling out additional payment for
              enterprise-scale HPC and serverless usage, which means pricing is not just seat-based but can also reflect
              deployment intensity. Sacra’s analysis fits that picture: product-led adoption creates familiarity, then
              larger teams, regulated buyers, and self-hosted requirements shift the motion to custom contracts. That is
              a favorable revenue-quality setup because the upsell drivers are recurring governance and compliance needs
              rather than one-off experimentation. The main public weakness is recognition quality. Anaconda offers
              cloud, on-premises, self-hosted, and support-heavy enterprise implementations, but it does not disclose a
              GAAP revenue-recognition policy, deferred revenue, or the split between subscription and services revenue.
