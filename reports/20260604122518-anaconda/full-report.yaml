        title: Exhibits
        blocks:
          - type: callout
            title: Governed Python remains a real enterprise wedge
            body: >-
              Even though the broad TAM is fuzzy, the combination of large-enterprise demand, on-prem governance needs,
              Python workflow persistence, and rising package-security pressure supports a durable niche for curated
              repositories and controlled workbench tooling.
            calloutType: strength
