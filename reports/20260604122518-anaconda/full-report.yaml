      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is promising but not yet clean. Anaconda looks more like a future strategic-sale or
              delayed-IPO candidate than an asset ready for immediate price clearing. The strategic case is intuitive: a
              profitable Python and AI distribution layer with deep enterprise reach could be valuable to cloud, data,
              security, or developer-platform buyers, especially if the company proves that governance and curation
              translate into recurring high-margin spend. But the file set needed for a real process is still
              incomplete. Investors need audited financials, precise cap-table and liquidation-preference data, cohort
              retention, customer concentration, AI-platform attach and expansion metrics, and quantified evidence that
              licensing enforcement is improving monetization faster than it is encouraging substitution. Without those
              materials the right hold assumption is 4-6 years and the right posture is conditional rather than
              aggressive. Thesis-break events are straightforward: a financing at or below roughly $1.3B, evidence that
              research and enterprise users are churning faster than Anaconda can convert them, failure of AI- platform
              upsell, or proof that ARR is not compounding beyond the current disclosed level.
            claimRefs:
              - CV024
