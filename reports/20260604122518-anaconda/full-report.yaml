  - id: TP001
    title: Competitor profile table
    columns:
      - Vendor
      - Category
      - Scale / funding
      - Target customer
      - Product scope
      - Pricing signal
      - Strategic direction / limitation
    rows:
      - - Posit Team
        - Direct peer
        - Founded 2009; independent Public Benefit Corporation / Certified B Corp
        - Regulated and centralized Python/R data teams
        - Workbench + Package Manager + Connect for governed development, publishing, and package control
        - Commercial named-user packaging with Basic / Enhanced / Advanced tiers
        - >-
          Closest direct governed alternative; strongest in centralized enterprise data-science operations, but less
          associated with free mass adoption than Anaconda
      - - Databricks
        - Adjacent incumbent
        - $10B Series J announced at $62B valuation in Dec. 2024; 20,000+ organizations; 70% of Fortune 500
        - Enterprise data, analytics, and AI buyers already standardized on lakehouse infrastructure
        - Unified data/AI platform, governance, notebooks, SQL, ML and app development
        - Pay-as-you-go, per-second usage, free trial + pricing quote
        - Huge procurement and data-gravity advantage; weaker as a pure Python package-governance specialist
      - - Amazon SageMaker Unified Studio
        - Adjacent incumbent
        - AWS-backed platform; free tier plus service-level consumption pricing
        - AWS-native enterprises and platform teams
        - Serverless notebooks, catalog, governance, data processing, model development, AI agents
        - Pay-as-you-go across notebooks, catalog, and related AWS services
        - Strong governance and procurement leverage; pricing is modular and can become complex across services
      - - Google Colab Enterprise
        - Adjacent substitute / likely entrant
        - Google / Vertex AI distribution; paid services pricing surface
        - Education, experimentation, and Google Cloud teams wanting collaborative notebooks
        - Browser notebooks, collaboration, code generation, IAM-secured workspaces, Vertex AI integration
        - Free + paid services; enterprise monetization flows through Google Cloud / Vertex AI
        - Very easy notebook on-ramp, but weak public evidence of deep package-governance depth versus Anaconda or Posit
      - - VS Code + Jupyter stack
        - Status quo substitute
        - Microsoft distribution plus free extension ecosystem
        - Developers and analysts comfortable assembling their own environment stack
        - Editor, Jupyter notebooks, extensions, profile templates, venv / requirements workflow
        - Free software; buyer pays with setup, support, and cloud choices elsewhere
        - Extremely strong distribution; no native curated repository or policy layer by default
