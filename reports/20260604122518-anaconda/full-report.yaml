  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Anaconda's current product is better understood as a workflow stack than as a single Python download. For
              an individual user, the entry point is still Distribution: a local installer that brings conda, Navigator,
              and a large pre-integrated package base together so environment setup, package install, and application
              launch happen inside one managed toolchain instead of through ad hoc pip plus local-system wrangling.
              Navigator then adds a desktop control surface for non-CLI package, environment, and channel management,
              while Desktop extends that same local workflow into model discovery and local inference. For browser-first
              work, Notebooks provides hosted Jupyter runtimes, package-ready environments, and shareable outputs,
              including Panel apps.


              For enterprise teams, the workflow broadens from local productivity into governed software supply.
              Platform Cloud sits in the middle as the organization control plane: channels, groups, policies, package
              vetting, auditability, and vulnerability tracking. AI Platform and AI Catalyst then reposition the company
              from “Python distribution vendor” toward a governed AI-development foundation where package sourcing,
              identity controls, environment reproducibility, and model governance are meant to live together. The
              customer workflow therefore runs from choosing a local or browser surface, to pulling approved packages
              and models, to developing inside managed environments, to sharing or deploying into partner runtimes such
              as Databricks, Azure services, or Excel. Public materials support that broader thesis, but the exact
              commercial handoff between Core, Platform, Desktop, Navigator, Notebooks, and AI Catalyst remains less
              explicit than the product messaging.
