        title: Exhibits
        blocks:
          - type: callout
            title: Installed base plus profitable ARR creates real platform leverage
            body: >-
              Anaconda is unusual among OSS-adjacent AI infrastructure companies in publicly claiming both a massive
              distribution footprint and profitability with more than $150M of ARR. That combination suggests it is not
              merely popular with developers; it has already translated part of that reach into enterprise revenue and
              now has capital to extend the platform further.
