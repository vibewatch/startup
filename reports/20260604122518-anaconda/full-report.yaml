  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Reset financing
        - Any primary financing or priced secondary around or below roughly $1.3B
        - Signals that investors do not view the 2025 round as durable and forces a new comp anchor
        - Re-underwrite from the new price immediately and treat the old round as stale.
      - - ARR does not compound
        - ARR fails to move meaningfully above the current disclosed >$150M level by the next financing cycle
        - Breaks the premium-multiple thesis because the company would look mature before proving elite economics
        - Move the case toward avoid or demand a steep discount.
      - - Licensing backlash becomes churn
        - >-
          More institutions or enterprise accounts migrate core workflows to Miniforge or conda-forge and renewal
          quality weakens
        - >-
          Undermines the monetization thesis by proving that enforcement is shrinking the funnel faster than it raises
          ARPU
        - Cut size, slow process, or walk unless conversion data offsets the losses.
      - - AI-platform attach disappoints
        - New AI Platform usage remains low or expansion revenue is minimal in enterprise cohorts
        - >-
          Collapses the argument that Anaconda deserves a higher-value workflow and governance multiple versus classic
          tooling peers
        - Value the business closer to mature software comps rather than AI leaders.
      - - Economics look ordinary
        - Gross margin, NRR, or concentration data fail to show software-like quality
        - Removes the main justification for paying around 10x ARR
        - Re-rate toward 5x-7x and avoid full-price entry.
      - - Preference stack is heavy
        - Seniority, liquidation preferences, or secondary-heavy structuring materially reduce new-money upside
        - Means headline valuation overstates actual equity value to common and late investors
        - Insist on structure, discount, or no-investment.
    notes: >-
      These are price-moving triggers, not abstract worries. Each row identifies a threshold that should cause a real
      change in underwriting, negotiation posture, or willingness to continue.
    claimRefs:
      - CV028
      - CV029
      - CV033
      - CV035
      - CV039
      - CV040
      - CV041
      - CV045
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Cap table and waterfall
        - >-
          Exact post-money valuation, share classes, liquidation preferences, seniority, and primary versus secondary
          split of the Series C
        - Determines whether headline price equals real economic value for new investors
        - CFO pack plus counsel-reviewed cap table and waterfall model.
      - - Unit economics
        - Audited ARR bridge, gross margin, NRR, logo churn, and free-cash-flow profile
        - Converts a plausible AI story into a defensible valuation framework
        - Finance team, auditor materials, and cohort dashboards.
      - - Customer concentration
        - Top-customer and top-segment exposure plus renewal behavior of the largest enterprise cohorts
        - Tests whether 10,000+ enterprise count translates into diversified and durable revenue
        - Revenue operations and board reporting extracts.
      - - AI-platform monetization
        - Attach rates, net expansion, pricing realization, and logo wins attributable to the 2025 platform launch
        - Tells investors whether the higher-value platform thesis is real or just narrative
        - Product analytics, sales pipeline, and cohort expansion review.
      - - Licensing impact
        - >-
          Migration, churn, and conversion data by academic, research, SMB, and regulated-enterprise segments since the
          2024-2026 policy changes
        - Measures whether enforcement is creating net monetization or damaging the funnel
        - Customer-success analysis plus channel and support tickets.
      - - Exit readiness
        - Audited statements, governance readiness, and banker-style materials for strategic or IPO pathways
        - Necessary to judge timing, realistic buyer set, and hold period
        - CEO/CFO diligence session and data-room readiness checklist.
    notes: >-
      These are the minimum asks required to convert Anaconda from a compelling narrative to an underwritable priced
      opportunity. Without them the right stance remains conditional.
    claimRefs:
      - CV024
      - CV028
      - CV029
