  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Key risks
    rows:
      - - Bull
        - >-
          ARR reaches roughly $250M-$300M by 2028; AI-platform attach and enterprise governance upsell work; retention
          looks software-like; licensing churn is contained.
        - >-
          10x-12x exit multiple implies about $2.5B-$3.6B. From a ~$1.5B reported entry this is about 1.7x-2.4x gross
          before preference effects.
        - >-
          20%-25% — requires evidence that Anaconda becomes a genuine AI control plane rather than a packaging vendor
          with AI branding.
        - >-
          Competition from Databricks or cloud platforms, weak attach of the new platform, or poor retention can cap the
          upside quickly.
      - - Base
        - >-
          ARR grows to roughly $180M-$220M; the company remains profitable; security and governance monetization helps
          but does not dramatically re-rate the business.
        - >-
          7x-9x implies roughly $1.3B-$2.0B. At the reported round this is near capital preservation rather than
          venture-style upside.
        - >-
          50%-55% — this is the best fit with disclosed evidence: real ARR, real enterprise reach, but incomplete
          economics and mixed pricing risk.
        - >-
          Limited upside at last-round pricing, opaque preferences, and uncertain customer concentration remain the main
          constraints.
      - - Bear
        - >-
          ARR stalls near $140M-$170M; defaults-channel licensing drives more substitution; AI-platform attach
          disappoints; competition absorbs budget.
        - 5x-7x implies about $0.7B-$1.2B and points to a markdown or weak secondary outcome versus the reported round.
        - >-
          25%-30% — not the base case, but institution-led migrations and pricing friction make it credible rather than
          remote.
        - >-
          Channel substitution, community backlash, margin compression, and a flat or down financing would compound
          downside.
    notes: >-
      These are scenario-underwriting ranges, not a DCF. They use ARR and multiple assumptions because public evidence
      gives enough information to bracket revenue-scale and market comparables, but not enough to run a precise
      margin-based intrinsic model.
