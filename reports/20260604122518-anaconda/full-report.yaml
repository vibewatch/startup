      - number: '1.3'
        title: Funding history, investors, and public scale metrics
        blocks:
          - type: paragraph
            body: >-
              Anaconda’s July 2025 Series C is the anchor financing event for the current company profile. Official
              company, investor, and Business Wire materials all say the company raised more than $150 million led by
              Insight Partners with participation from Mubadala Capital, and that the business was profitable with more
              than $150 million in ARR as of July 2025. Third-party coverage from CRN, Economic Times, and Tracxn adds
              the market-value overlay that the raise was completed at roughly a $1.5 billion valuation. The wider
              funding history is less crisp. Tracxn reports about $210 million raised across 16 rounds, including a $24
              million Series A led by General Catalyst and BuildGroup in 2015, a 2015 venture-debt round from SVB, and a
              2021 Series B that included Snowflake. TipRanks, by contrast, only surfaces the latest $150 million round
              in its visible summary, so lifetime funding should be treated as database-derived rather than
              company-disclosed. The company also said the Series C would fund new AI features, acquisitions, and global
              expansion while providing liquidity options for current and former employees, but the exact secondary
              component is not public. Scale metrics are directionally strong but still mixed in quality: users,
              downloads, enterprise penetration, and ARR are company claims, valuation is a third-party report, and
              headcount is only externally estimated at roughly 571 to 576 employees in spring 2026. Public materials do
              not disclose paying-customer count, gross margin, net retention, or office footprint beyond Austin.
