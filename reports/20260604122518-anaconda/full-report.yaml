      - number: '4.2'
        title: GTM motion and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows a hybrid PLG-to-enterprise motion rather than a classic top-down software sales
              model. Anaconda keeps a massive open-source and educational funnel, then monetizes when teams need
              governance, premium repositories, notebooks compute, or broader organizational compliance. The Databricks
              partnership strengthens that motion by embedding Anaconda’s curated package distribution natively inside
              Databricks Runtime and by explicitly routing activation through account teams and partner leads, which
              looks like a co-sell lever for larger accounts. On the traction side, management disclosed more than $150
              million of ARR, profitability, more than 10,000 large enterprises, 50 million users, and 21 billion
              downloads in July 2025. Yet the company’s own surfaces also cite 250,000-plus organizations and,
              separately, more than one million customers, so the public denominator shifts between users,
              organizations, enterprises, and customers. That makes the paid-customer base hard to isolate even though
              the top-line funnel is clearly enormous. Using the disclosed ARR and current headcount trackers produces
              an ARR-per-employee proxy around $260,000, which is respectable for infrastructure software. But CAC,
              payback, NRR, realized ASP, and sales-cycle duration remain undisclosed, so sales efficiency can only be
              proxied rather than underwritten.
