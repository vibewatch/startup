      - number: '7.4'
        title: Financial, model, and execution risk
        blocks:
          - type: paragraph
            body: >-
              The financial picture is better than many late-stage AI infrastructure companies: Anaconda says it raised
              more than $150 million in July 2025, operates profitably, and surpassed $150 million in ARR. That lowers
              near-term financing risk, but it also raises the standard for what must be proven next. Public evidence
              suggests the company is trying to move from broad Python distribution utility into a deeper enterprise AI
              platform spanning secure packages, notebooks, governance, AI assistance, and custom infrastructure. That
              plan brings execution risk because it expands simultaneously across product surface, leadership bandwidth,
              partnerships, and deployment complexity. The pricing architecture also suggests a potentially lumpy growth
              model: self-serve purchasing tops out at 15 seats, large regulated customers are steered toward Custom
              plans, and public pages do not disclose enough about gross margin, customer concentration, or support
              burden to test whether governance-heavy revenue scales efficiently. For investors, that means the thesis
              should break not on abstract “competition” but on measurable failures: security incidents that damage
              trust, enterprise accounts that resist expansion because pricing or support feels heavy, or management’s
              inability to produce subprocessor, SLA, concentration, and margin data that supports a premium valuation.
