      - number: '1.4'
        title: Milestones, partnerships, and adverse developments
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company widening from distribution into governed enterprise AI. Tracxn
              records early funding in 2013 and 2015, but the more strategic inflections are the public operating
              milestones from 2024 onward. In February 2024, Anaconda expanded its IBM watsonx.ai collaboration,
              bringing its repository and security controls into enterprise generative AI workflows. In 2024 the company
              also entered a visible adverse period around licensing and IP: CDOTrends reported backlash from academic
              and nonprofit users after Anaconda tightened and enforced licensing terms for larger organizations, and
              CourtListener shows Anaconda filing a copyright infringement complaint against Intel in August 2024. On
              the product side, May 2025 brought the launch of the Anaconda AI Platform, which repositioned the company
              from package management toward a unified open-source AI platform with governance and deployment controls.
              By mid-2025, company materials also referenced a Databricks partnership, extending channel and workflow
              reach into a major enterprise data platform. The July 2025 Series C financed that expansion, and the
              October 2025 CEO transition put a public-company software operator in charge. The April 2026 acquisition
              of Outerbounds then added Metaflow-based orchestration and experiment-management capabilities, pushing
              Anaconda closer to an end-to-end AI-native development stack. As of the run date, the Intel litigation
              remained unresolved but stayed, with settlement status reports continuing in 2026; no reviewed source
              surfaced layoffs or public regulatory sanctions.
