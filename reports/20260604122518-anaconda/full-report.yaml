      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Treat the reported round as a ceiling for diligence, not a floor for entry
            body: >-
              The 2025 financing proves external demand and probably reflects information outsiders do not yet have, but
              public evidence still does not validate paying the same price without term-sheet visibility, audited unit
              economics, and clearer evidence that licensing enforcement expands revenue faster than it narrows the
              funnel.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV024
              - CV025
              - CV041
