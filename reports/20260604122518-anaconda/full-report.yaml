      - number: '2.2'
        title: TAM, SAM, and evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public analyst reports agree that the broad data science platform market is large, but they disagree
              sharply on its size and growth path. Precedence Research places the market at $175.15 billion in 2025 and
              $203.53 billion in 2026, reaching $762.06 billion by 2035 at a 15.84% CAGR. Technavio instead frames the
              opportunity as $707.84 billion of incremental growth from 2025 to 2030 at a 33.1% CAGR, while Business
              Research Insights places the 2026 market at just $73.46 billion. Those gaps are too large to treat as
              interchangeable; they almost certainly reflect different category boundaries, segment mixes, and included
              workflow layers.

              A more useful serviceability lens comes from the parts of the market that look closest to Anaconda's
              job-to-be-done. Technavio says the on-premises segment alone was worth $118.21 billion in 2024, and
              Precedence says large enterprises led the category in 2025. That is directionally consistent with
              Anaconda's emphasis on governed environments, CVE tracking, and controlled distribution. A second
              non-revenue lens comes from Python workflow usage: the Python ecosystem remains large, PyPI holds 40.7 TB
              of release files, and survey data shows Python users install from PyPI, private indexes, internal mirrors,
              and Conda channels. A third lens is observed footprint: 6sense reports more than 1,360 companies using
              Anaconda as a data-science and machine-learning tool in 2026, but that should be treated as directional
              usage evidence rather than a monetized customer bridge.
