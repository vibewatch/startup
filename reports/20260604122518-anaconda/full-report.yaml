      - number: '8.3'
        title: Bull, base, and bear range with downside triggers
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis turns less on headline TAM and more on conversion quality. The bull case assumes
              Anaconda successfully monetizes the shift from package management to governed AI workflows, keeps
              enterprise customers expanding despite licensing friction, and grows ARR into the $250M-$300M range with
              software-like retention. In that case a 10x-12x exit multiple can support roughly $2.5B-$3.6B of value.
              The base case is more conservative: ARR reaches roughly $180M-$220M, governance monetization works but not
              dramatically, and the market pays 7x-9x. That brackets value around $1.3B-$2.0B — near the reported round,
              which means limited upside for new investors at the last price. The bear case is not exotic. If
              defaults-channel licensing pushes more research and developer workflows toward Miniforge/conda-forge, if
              cloud and data-platform competitors absorb budget, or if AI-platform attach stays weak, the business could
              remain around current ARR with a 5x-7x multiple and a $0.7B-$1.2B value. That asymmetry drives entry
              discipline: new money should prefer sub-$1.3B pricing or downside protection rather than chase the 2025
              reference mark.
            claimRefs:
              - CV015
