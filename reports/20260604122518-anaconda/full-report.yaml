            title: Commercialization friction remains the clearest public red flag
            body: >-
              The visible downside of Anaconda's strategy is that monetizing a beloved open-source entry point can
              alienate parts of the community. Licensing enforcement against larger organizations and the Intel
              litigation both show that the company is willing to use pricing and IP controls more aggressively, which
              can create reputational drag even if enterprise economics improve.
