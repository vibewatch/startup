              million in July 2025, was already profitable, and planned to invest the proceeds into AI features,
              acquisitions, global expansion, and employee liquidity. That combination reduces immediate financing
              dependency and suggests the next round is more likely to fund expansion or M&A than to plug an existential
              cash shortfall. Even so, the public underwrite is still incomplete. No reviewed source disclosed cash on
              hand, monthly burn, runway months, or current debt obligations. The 2021 SEC Form D is useful because it
              confirms a historical financing event and shows that Anaconda declined to disclose revenue range in the
              filing, but it does not solve present-day cash visibility. Third-party databases also disagree on lifetime
              capital raised, ranging from about $210 million to $290.6 million, which means even the funding history
              needs reconciliation before any precise dilution or capital-efficiency analysis. Add the licensing
              backlash from universities and other institutions, and the financial verdict becomes balanced: revenue
