  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      The wide range reflects real franchise value, but also the fact that the public file set still cannot cleanly
      distinguish premium AI-platform economics from mature-tooling economics.
    data:
      items:
        - label: Bear
          low: 0.7
          mid: 0.95
          high: 1.2
          displayValue: $0.7B-$1.2B
          detail: Licensing-driven substitution and weak attach prevent meaningful re-rating.
          tone: risk
        - label: Base
          low: 1.3
          mid: 1.6
          high: 2
          displayValue: $1.3B-$2.0B
          detail: Moderate growth leaves fair value close to the reported round.
          tone: neutral
        - label: Bull
          low: 2.5
          mid: 3
          high: 3.6
          displayValue: $2.5B-$3.6B
          detail: Governed AI-workflow monetization works and customers expand cleanly.
          tone: positive
        - label: Preferred entry
          low: 1.1
          mid: 1.2
          high: 1.3
          displayValue: $1.1B-$1.3B
          detail: Zone where current uncertainty is better compensated for a new investor.
          tone: positive
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: >-
      The scorecard shows why Anaconda is investable in principle but not yet aggressively underwritable at the reported
      2025 price.
    data:
      items:
        - label: Reported valuation
          value: $1.5B
          detail: Secondary-reported 2025 Series C mark.
          tone: neutral
        - label: ARR
          value: '>$150M'
          detail: Officially disclosed as of July 2025; company also says it is profitable.
          tone: positive
        - label: Implied ARR multiple
          value: ~10x
          detail: Middle of the comp band rather than obviously cheap.
          tone: neutral
        - label: Large enterprises
          value: 10,000+
          detail: Useful enterprise proof if revenue concentration is reasonable.
          tone: positive
        - label: Users
          value: 50M
          detail: Massive reach, but conversion quality still matters more than user count.
          tone: positive
        - label: Business plan price
          value: $50/user/mo
          detail: Shows explicit enterprise monetization path for governance and security.
          tone: neutral
        - label: Historical capital
          value: $210M-$290.6M
          detail: Data vendors disagree, leaving preference overhang unresolved.
          tone: risk
        - label: IC posture
          value: track
          detail: Real company, incomplete price validation.
          tone: risk
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV009
