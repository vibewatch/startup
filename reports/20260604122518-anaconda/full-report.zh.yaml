      - number: '4.3'
        title: 成本结构、利润率路径和资本强度
        blocks:
          - type: paragraph
            body: >-
              Anaconda 仍然像一家可能拥有不错毛利率的软件公司，但交付模式不是零成本。Business Plan 页面强调高级仓库、云 notebook、更高算力、CVE 精选、token 化访问和多种部署选项；AI
              Platform 和 AI Catalyst 发布又加入治理、日志、模型基准、安全推理，以及 CPU/GPU
              部署。这些功能合起来意味着，成本栈主要由仓库托管、存储与计算、安全精选、模型推理资源、环境管理和企业支持构成。结构上仍应好于硬件或服务重的模式，也没有公开迹象显示库存或项目融资强度；但新 AI
              功能可能带来比原始软件包分发业务更高的可变计算成本。同一批公开材料还暗示存在服务交付拖累，因为本地、隔离网络和受监管部署通常需要更高接触度的上线和策略配置。因此，利润率路径只能给方向性判断，不能给数字：经常性治理软件长期应能支撑健康利润率，但毛利率和服务利润率均未披露，向模型治理迁移也引入了一个公开投资人通常会要求单独拆出的新成本中心。
