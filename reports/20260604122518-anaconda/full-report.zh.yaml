  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 因素
      - 方向
      - 为什么是现在
      - 对 Anaconda 的影响
      - 尽调追问
    rows:
      - - 数据团队 AI 使用增长
        - 驱动因素
        - 87% 的 Anaconda 调研受访者使用 AI 的程度不低于去年
        - 更多团队需要受治理的 Python 和 AI 工作流
        - 核实这是否转化为付费平台扩张
      - - Python 数据科学采用持续存在
        - 驱动因素
        - 调研证据显示，Python 仍是数据分析和 ML 工作流的锚点
        - 大用户基础让漏斗仍然有效
        - 衡量该基础中有多少用户偏好 Conda，而不是纯 pip 工作流
      - - 软件包安全压力
        - 驱动因素
        - 恶意软件报告、CVE 跟踪和精选仓库已成为采购中的常规关注点
        - 治理功能可以支撑企业支出
        - 要求提供受监管客户的留存率与赢单率数据
      - - 大企业与本地部署需求
        - 驱动因素
        - 公开市场报告强调大型企业和本地部署
        - 最能付费的细分市场可能是受治理企业团队
        - 按受监管行业测试垂直构成与客单价
      - - 免费替代工具栈
        - 约束
        - Jupyter、VS Code、Colab、PyPI 和 Conda 能低成本解决早期需求
        - 限制单靠 notebook UX 收费的意愿
        - 量化免费转付费转化率与触发点
      - - 云套件捆绑
        - 约束
        - Databricks、SageMaker 和 Azure ML 在既有合同下捆绑相邻任务
        - Anaconda 必须以更好的受治理 Python 层取胜，而不只是 notebook 层
        - 衡量在重度云客户中是替代还是共存
      - - 仓库替代方案
        - 约束
        - Posit、JFrog 和 Sonatype 以标准包管理器流程提供治理
        - 切换成本可能低于管理层预期
        - 比较仓库附加率与更广平台附加率
      - - 信任与举证负担
        - 约束
        - 对安全敏感的采购方需要证据证明治理主张能降低风险
        - 销售周期取决于信任、可审计性与策略匹配
        - 要求提供安全认证、已拦截包指标和事故历史
      - - 多角色预算归属
        - 约束
        - 用户、数据负责人、IT 和安全都可能影响采购
        - 更长周期与共享预算会拖慢采用
        - 按细分市场梳理谁签字、谁否决
      - - 资本强度低于基础设施套件
        - 约束 / 驱动因素
        - 软件交付降低了资本开支门槛，但也降低结构性护城河
        - 差异化必须来自工作流深度与信任
        - 测试利润率或留存能否抵消更容易进入的影响
    notes: 本表同时放入需求侧驱动因素和采用约束，因为同一套治理功能既创造需求，也拉长企业采购周期。
