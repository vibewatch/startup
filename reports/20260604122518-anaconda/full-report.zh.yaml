  - id: TP004
    title: 护城河韧性 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 威胁为何可信
      - 缓释措施 / 尽调追问
    rows:
      - - 经过筛选和安全评估的包仓库
        - Posit 和云厂商在已批准包和制品周边加入治理
        - 高
        - Posit 明确主推精选仓库、漏洞拦截、MCP assistant 治理和隔离环境交付；SageMaker 和 Databricks 则在更宽的平台层营销治理能力
        - 按监管行业索取赢 / 输数据，并逐项对比 Posit、AWS、Databricks 的认证覆盖
      - - 基于 Conda 的环境可复现性
        - uv、Poetry、venv、pip freeze 和 PyPI 让本地可复现性变得便宜
        - 高
        - uv、Poetry、VS Code 和 PyPA 官方文档显示，不靠 Anaconda 也能获得锁文件、隔离、依赖导出和发布能力
        - 衡量有多少付费客户依赖精选二进制包 / 治理，而不只是本地环境便利性
      - - Notebook 便利性
        - Jupyter、Colab、SageMaker 和 Databricks 让 notebook UX 商品化
        - 中
        - 各家竞品都提供浏览器 notebook 或 notebook 工作流；单靠 notebook 已不是持久差异点
        - 跟踪 Anaconda Notebooks 对付费治理销售的附加率，不要把 notebook 使用量直接当成护城河
      - - 企业信任姿态
        - 云厂商把 IAM、治理和采购杠杆同周边支出打包
        - 高
        - SageMaker 和 Colab 借 AWS / Google 身份体系和平台控制承接信任；Databricks 则切入既有数据平台预算
        - 记录 Anaconda 在云厂商已标准化的客户中仍能赢单的场景和原因
      - - 庞大的免费用户漏斗顶端
        - 免费用户可转向更轻的 OSS 组合，且没有付费切换成本
        - 高
        - Gartner、G2 和 TrustRadius 都呈现了对臃肿、包陈旧或免费替代方案已够用的抱怨
        - 索取免费转付费转化率、按用户画像划分的流失率，以及输给免费工具的原因
      - - 跨平台部署弹性
        - 合作伙伴与竞品重叠，限制独占性
        - 中
        - Posit 集成 AWS、Databricks、Snowflake 和 Kubernetes，证明买方可以混用控制平面，而不是统一到一家
        - 梳理哪些场景中 Anaconda 是控制平面，哪些只是更大平台资产中的便利层
    notes: 严重性衡量的是竞争表面在 1 到 3 年内替代付费 Anaconda 工作流的可能性，而非各竞品整体质量。
