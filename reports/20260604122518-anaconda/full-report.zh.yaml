      - number: '3.3'
        title: 替代方案、切换成本、多栖使用、分发权力和伙伴入口
        blocks:
          - type: paragraph
            body: >
              Anaconda 的现状替代方案不是「什么都不做」，而是自己拼一套 Python 栈。VS Code 加 Jupyter 扩展已经能给用户 notebook、精选扩展包、虚拟环境和依赖导出流程。Jupyter
              本身支持 40+ 种语言、可插拔认证、面向数千用户的集中部署，以及适配 Kubernetes 的扩展。Poetry 增加可重复 lockfile、依赖解析和发布。uv
              进一步加大替代威胁，它把自己定位成一个超快单一工具，可以替代 pip、pip-tools、pipx、poetry、pyenv、twine 和 virtualenv，同时加入 lockfile 和 Python
              版本管理。PyPI 和 Python Packaging User Guide 把这个生态的模块化基线讲得很明确。


              工作流高度模块化，所以切换成本中等，而不是结构性锁定。评论显示，团队已经在 Anaconda、Jupyter Notebook、VS Code、PyCharm、Docker 和 RStudio
              之间多栖使用。用户看重 Anaconda，因为它缩短配置时间、解决依赖冲突并集中常用工具；但同一批评论也展示了离开路径：如果软件包新鲜度、UI 速度或内存占用令人失望，用户可以剥离到更轻量组件，而不放弃
              Python。真正更难重建的，不是 notebook 或虚拟环境本身，而是带治理的仓库、CVE 阻断、企业 SSO、目录同步，以及跨隔离网络或混合基础设施的一致部署。


              伙伴入口有利有弊。Posit 公开与 Databricks、AWS、Snowflake 和 Kubernetes 集成。这让 Posit
              成为直接竞争者，也证明胜出的控制平面可能不是绑定单一软件包格式的那一个，而是能横跨多云和数据平台的那一个。对 Anaconda
              来说，最强防线是继续做开源软件包和可复现环境之上的可信治理层；最弱防线则是任何可被免费编辑器、开放 notebook 或 lockfile 驱动软件包管理器替换的功能。
