      - number: '7.4'
        title: 财务、模式与执行风险
        blocks:
          - type: paragraph
            body: >-
              相比许多后期 AI 基础设施公司，Anaconda 的财务图像更好：公司称 2025 年 7 月融资超过 $150M，已经盈利，ARR 超过
              $150M。这降低了近期融资风险，但也抬高了下一阶段必须证明的门槛。公开证据显示，公司正试图从广泛的 Python 发行工具，转向更深的企业 AI 平台，覆盖安全包、notebook、治理、AI
              辅助和定制基础设施。这一计划带来执行风险，因为它同时扩张产品面、管理层带宽、伙伴关系和部署复杂度。定价架构也暗示增长可能更不平滑：自助购买最多 15 个席位，大型受监管客户被引向 Custom
              方案；公开页面没有披露足够的毛利率、客户集中度或支持负担，无法检验治理密集型收入能否高效扩张。对投资人而言，投资逻辑不应因抽象的「竞争」而破裂，而应看可衡量的失败：损害信任的安全事件、企业账户因定价或支持过重而拒绝扩张，或管理层无法提供支撑高估值的分包处理方、SLA、集中度和利润率数据。
