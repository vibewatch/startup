      - number: '1.4'
        title: 里程碑、合作关系和反向进展
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司正从发行版走向带治理的企业 AI。Tracxn 记录了 2013 年和 2015 年的早期融资，但更有战略意义的拐点来自 2024 年之后的公开运营里程碑。2024 年 2
              月，Anaconda 扩大与 IBM watsonx.ai 的合作，把自己的仓库和安全控制带入企业生成式 AI 工作流。2024 年，公司也在授权和 IP 上进入一个可见的反向阶段：CDOTrends
              报道称，Anaconda 收紧并执行面向较大组织的授权条款后，学术和非营利用户出现反弹；CourtListener 显示 Anaconda 于 2024 年 8 月对 Intel
              提起版权侵权诉讼。产品侧，2025 年 5 月 Anaconda AI Platform 发布，公司定位从软件包管理转向统一的开源 AI 平台，带治理和部署控制。到 2025 年中，公司材料还提到
              Databricks 合作，把渠道和工作流触达延伸进一个重要的企业数据平台。2025 年 7 月 Series C 为这轮扩张提供资金，2025 年 10 月的 CEO
              交接则让一位上市公司软件运营者掌舵。2026 年 4 月收购 Outerbounds 后，公司又加入基于 Metaflow 的编排和实验管理能力，把 Anaconda 推得更接近端到端 AI
              原生开发栈。截至本报告运行日，Intel 诉讼仍未解决但已中止，2026 年仍在提交和解状态报告；审阅来源没有发现裁员或公开监管处罚。
