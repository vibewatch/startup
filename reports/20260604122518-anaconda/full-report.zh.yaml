  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              Anaconda 可见的客户基础，更适合看成一层层付款方和治理画像的组合，而不是单一企业客户段。最底层是庞大的免费用户面：学生、个人从业者、概念验证搭建者和研究人员，用 Anaconda 管包、跑
              notebook、快速实验。再上一层是 Starter tier，团队负责人变成经济买方，为协作和存储付费。高价值端的 Business 和 Enterprise 买方，通常是
              IT、安全、分析或平台负责人，他们关心访问控制、筛选包、SSO、漏洞管理和受治理部署。金融服务业里这条企业销售路径尤其清楚：Vantage
              West、Zempler、Entercard，以及未具名的欧洲金融机构，购买 Anaconda 不是为了单纯使用 Python，而是为了解决安全和治理瓶颈。


              公开证据也显示，Anaconda 的用户面不止金融服务。Moog 把它用在航空航天工程工作流里，McGill 用它支持可复现的 AI 药物发现，SLB 将其放进工程仿真场景，Hyperbound 则体现了 AI
              原生创业公司的用法。地域也不局限于一个本土市场：最强的具名案例横跨美国、加拿大、英国、北欧和欧洲。话虽如此，记录最完整的证据仍集中在受监管、技术复杂度高的账户，因此公开样本很可能高估了治理需求最迫切、也愿意公开谈风险降低的细分市场。
