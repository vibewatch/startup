      - number: '7.2'
        title: 监管、法律与许可风险
        blocks:
          - type: paragraph
            body: >-
              公开法律材料显示，这家公司对变现和风险转移说得很明确。员工超过 200 人的营利组织需要购买 Business 许可，Anaconda
              可以核验用户数并追缴超额费用；费用不可退，续约时价格可变，账户访问也可能被广泛暂停或终止。与此同时，法律基线对客户救济设置了重要限制：AI 输出按「as is」提供，AI
              功能可能依赖第三方服务，客户承担广泛赔偿义务，Anaconda 的累计责任上限为此前十二个月费用。对现代软件供应商而言这些并不罕见，但 Anaconda 正在面向受监管行业和关键任务 AI
              用例销售，因此影响更大。监管侧，EU AI Act 的 GPAI 和透明度时间表、DOJ 大宗数据传输规则，以及不断扩张的州级隐私执法，都抬高了任何处理敏感数据或 AI 辅助工作流的企业 AI
              平台合规门槛。公司有缓释因素——隐私通知、定制部署选项和安全文档——但公开证据没有给到具名分包处理方、详细控制映射或谈判后的企业保护条款。
