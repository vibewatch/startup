      - number: '6.3'
        title: 具名客户证据与参考质量
        blocks:
          - type: paragraph
            body: >-
              Anaconda 的具名客户证据明显强过典型开发者平台的客户标识页，因为多个账户披露了生产场景、量化结果和买方层面的采购逻辑。Zempler Bank 是最干净的商业参考：公司称 Anaconda
              支撑欺诈、信用风险和 AML 工作流，帮助欺诈减少超过 90%，同时把客户投诉控制住。Vantage West 也很强，因为这个案例不只是 Python 便利性；它把 Anaconda 直接和受监管包治理、年度
              NCUA 检查、更容易维持的安全状态连在一起。未具名的欧洲金融机构作为客户标识用处较小，但作为深度信号很有用，因为它披露了 300 名活跃建模人员和 500 个项目。


              在金融服务之外，Moog 和 McGill 证明 Anaconda 也能支撑复杂从业者工作流，并带来量化结果。Moog 描述了一个生产工程自动化用例，把分析时间减少超过 75%。McGill
              不只强调可复现性收益，还展示了一个高能见度的 AI 药物发现工作流：环境配置时间大幅缩短，并支撑了可发表研究。到了 Hyperbound 或 SLB
              这类较薄叙事，参考质量会下降，因为这些页面证明客户相关性，却没有同等深度的生产证据。总体看，作为软件基础设施供应商，具名证据质量不错，但仍集中在少数当前由公司发布的案例研究里。
