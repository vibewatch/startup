      - number: '8.3'
        title: 牛市、基准、熊市区间与下行触发因素
        blocks:
          - type: paragraph
            body: >-
              情景分析的关键不在标题 TAM，而在转化质量。牛市情形假设 Anaconda 成功把包管理向受治理 AI 工作流的迁移变现，企业客户即便面临许可摩擦仍继续扩张，ARR 增至 $250M-$300M
              区间，并具备软件式留存。在这种情况下，10x-12x 退出倍数可支撑约 $2.5B-$3.6B 的价值。基准情形更保守：ARR 达到约 $180M-$220M，治理变现有效但不剧烈，市场支付
              7x-9x。对应价值约 $1.3B-$2.0B——接近报道轮次，这意味着新投资人按上一轮价格进入，上行有限。熊市情形并不极端。如果 defaults-channel 许可把更多研究和开发者工作流推向
              Miniforge / conda-forge，如果云和数据平台竞争者吸收预算，或者 AI 平台附加率仍弱，公司可能停留在当前 ARR 附近，倍数只有 5x-7x，价值
              $0.7B-$1.2B。这种不对称决定了入场纪律：新钱应偏好低于 $1.3B 的定价或下行保护，而不是追逐 2025 年参考价格。
