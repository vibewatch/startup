      - number: '2.5'
        title: 测算缺口、矛盾和待解决尽调问题
        blocks:
          - type: paragraph
            body: >-
              主要尽调问题不是有没有市场，而是公开 TAM 中到底有多少能被 Anaconda 的商业产品真正触达。公开市场估计中，2026 年规模从 $73.46 billion 到 $203.53 billion
              不等，并暗示到 2030-2035 年的增长率差异很大。这些数字几乎肯定聚合了更广的分析、lakehouse、MLOps 和云平台预算，无法干净映射到带治理的 Python 软件包管理与 notebook
              工作流。它们适合作为外边界，不适合作为定价或渗透模型。

              第二个缺口是变现。公开证据支持 Anaconda 拥有有意义的可观察使用，但公司没有披露付费席位数、ARR、企业转化率，也没有披露免费层与付费层的拆分。公开产品页面列出 Free、Starter、Business
              和 Enterprise
              计划，但价格细节不足以按细分市场建模支出。预算归属也只能从产品定位中部分观察，而不是来自采购记录。投资人下一步应把广义市场叙事与私有证据对齐：付费渗透率、受监管行业占比，以及客户到底是因为仓库治理还是
              notebook 便利性购买 Anaconda。
