  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 扩张驱动 / 集中度风险
      - 公开证据
      - 可能影响
      - 尽调路径
    rows:
      - - Free 到 Starter 再到 Business 的层级
        - 官方方案从免费个人使用，逐级走向付费团队和受治理企业使用
        - 支持典型先落地再扩张路径：先由一线使用者采用，再进入有预算的团队账户
        - 索取从免费安装到 Starter 和 Business 的转化漏斗
      - - 从自助服务到销售协助的席位扩张
        - Business 自助购买似乎上限为 15 个席位；更大部署转入销售流程
        - 大客户能显著扩大收入，但采购摩擦也会上升
        - 索取首次付费购买后的平均席位增长
      - - 受监管账户内的工作流扩张
        - Zempler 将受治理 Python 从欺诈扩展到信用风险和 AML；金融服务汇总展示了更广的模型治理用例
        - 交叉销售潜力不止于单一模型或 notebook 工作流
        - 按头部垂直行业索取模块 / 能力挂载率
      - - 合作伙伴辅助分销
        - 经销商和服务合作伙伴可以销售并支持 Package Security Manager
        - 能扩大地域覆盖，但部分客户体验可能取决于合作伙伴
        - 索取合作伙伴贡献 ARR 和头部合作伙伴集中度
      - - 公开证据集中在金融服务
        - 最详细的具名引用多为银行、信用合作社、贷款机构或信用风险用户
        - 垂直集中度能让 ICP 更清晰，但也增加对单一采购环境的暴露
        - 索取按行业拆分的 ARR 以及金融服务占比
      - - 头部客户暴露不透明
        - 公开来源未披露前 10 大客户集中度或 ACV 分布
        - 流失一个大型受监管部署可能影响重大，但公开来源无法测试幅度
        - 索取前 10 大客户占 ARR 百分比和续约时间表
      - - 学术界和非营利机构的许可摩擦
        - 研究社区组建迁移工作组，并建议使用替代渠道
        - 即便企业变现上升，开源权重高的客群也可能收缩
        - 衡量 2024 年以来机构级流失或存储库使用下降
      - - 一线使用者的性能投诉
        - 评论网站提到安装包臃肿、启动慢和环境问题
        - 如果可用性变差，自下而上的拥护者可能更不愿推荐全组织推出
        - 按版本队列跟踪支持工单和评论情绪
    notes: 扩张行综合了官方定价架构、案例研究用例、合作伙伴页面和反向社区证据；量化集中度数据仍未披露。
