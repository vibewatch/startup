  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域和替代方案
        blocks:
          - type: paragraph
            body: >-
              Anaconda 的市场边界，最好定义为面向企业 AI 工作流的带治理 Python 与开源数据科学工具。公司自己的材料描述的是开源数据科学和机器学习的 AI
              平台；付费产品打包的是安全软件包仓库、团队治理控制、浏览器 notebook 和云托管开发环境，而不是存储、ETL 或模型训练基础设施。因此，应该纳入的支出包括软件包精选、环境管理、notebook /
              工作台工具、访问控制、漏洞管理，以及服务 Python 构建团队的相邻赋能。

              重要相邻品类离得很近，但没有更窄的桥接前，不应算作 Anaconda 的收入机会。Databricks、SageMaker 和 Azure Machine Learning
              把数据访问、训练、部署、治理和可观测性打包进更宽的云或 lakehouse 合同。Jupyter、VS Code、Colab、PyPI 加 pip，以及其他 Conda
              channel，仍是许多用户默认的开源路径。Posit Package Manager、Posit Workbench、JFrog Artifactory 和 Sonatype Nexus
              也覆盖了同一仓库治理和团队环境工作的一部分。本章里，广义数据科学平台支出只是背景；核心可触达切口，是合规和可复现性重要时的带治理 Python 软件包与 notebook 工作流。
