  - id: TI003
    title: 单位经济表
    columns:
      - 指标
      - 数值或空值
      - 置信度
      - 重要性
      - 尽调追问
    rows:
      - - 年经常性收入（ARR）
        - '>$150M，截至 2025 年 7 月'
        - 高
        - 证明经常性收入已有真实规模，也缩小融资风险
        - 索取 GAAP 收入、ARR 桥接表和按产品拆分的开票额
      - - 盈利状态
        - 已盈利（公司称）
        - 中
        - 说明当前规模下业务没有激进烧钱
        - 索取 EBITDA、营业利润和现金流量表
      - - 员工数
        - 2026 年追踪器显示 571-576 名员工
        - 中
        - 效率代理指标和烧钱敏感性的关键分母
        - 索取按职能拆分的全成本员工数
      - - 人均 ARR
        - ~$260K
        - 中
        - 基础设施软件销售效率的方向性代理指标
        - 索取承担配额销售代表数和每名销售人员 ARR
      - - 大型企业数
        - '>10,000'
        - 高
        - 若定义一致，可显示企业渗透率
        - 索取付费企业账户数和每家企业平均席位数
      - - 更广义组织 / 客户数
        - 250K+ 个组织；>1M 客户；50M 用户
        - 中
        - 显示漏斗规模，但分母定义也含混
        - 索取一棵对账指标树，区分用户、组织和付费客户
      - - 独立安装基数代理指标
        - 6sense 上有 1,360+ 家公司
        - 低
        - 给出可识别安装量的外部下限
        - 索取客户 logo 或按细分拆分的付费客户数
