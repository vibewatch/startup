  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 改变判断的证据
    rows:
      - - 一家盈利、ARR >$150M、拥有 10,000+ 大型企业客户且触达 95% Fortune 500 的公司，产品市场匹配度足以支撑严肃尽调。
        - 审计后的毛利率和 NRR 数据，将确认这种规模究竟质量够高，还是只是覆盖面广但渗透浅。
      - - 新的 AI Platform 和模型中心叙事，能把 Anaconda 从发行版扩展到更具战略价值、受治理的企业 AI 工作流。
        - 展示新平台在受监管账号中的附加率、扩张收入和安全驱动的追加销售。
      - - 报道的 ~10x ARR 倍数低于 Databricks、Datadog 式 AI 溢价；如果增长质量真实，当前价格并不明显是泡沫级别。
        - 证明企业留存、扩张和平台使用趋势更像高溢价 AI 基础设施，而不是成熟工具。
      - - 反论点是估值仍只来自二手披露，公开文件集太薄，不足以支持激进承销。
        - 公司确认的轮次条款加审计报表，会实质缩小价格支撑缺口。
      - - 反论点是许可变现可能把研究和重度开源用户更快推向 Miniforge 或 conda-forge，而不是带来付费转化。
        - 若群组证据显示企业转化和续约足以抵消迁移，会削弱这个下行情景。
      - - 反论点是股权结构和优先权栈可能比表面估值暗示的更苛刻。
        - 清晰的清算瀑布、有限优先顺位和温和的二级份额，会实质改善普通股经济性。
    notes: 每一行都把市场、产品、客户、竞争、财务和风险证据连接到具体投资判断。右栏显示真正会改变建议的尽调结果或价格变化。
