  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Anaconda 有足够真实信号，值得留在候选名单上。公司称自己在超过 $150M ARR 时已经盈利，声称拥有 50M 用户、10,000+ 大型企业和 95% 的 Fortune 500 渗透率，并从
              Python 发行版重新定位为受治理 AI 平台。这些资产并不轻。但投资决策仍对价格敏感。Anaconda 自己没有披露 Series C 估值；Reuters 转发的报道也称，即使外部报道把该轮估值指向约
              $1.5B，公司仍拒绝评论价格。在这个水平上，公司大约以当前 ARR 的 10x 估值融资：对 AI
              基础设施资产而言并非不合理，但相对更成熟的软件同行也谈不上明显便宜。由于公开证据仍缺少审计财务、毛利率、NRR、客户集中度和精确轮次条款，纪律性的结论是跟踪，而不是买入。投资人应把轮次价格视为真实需求信号，而不是公平价值的决定性证明。只有尽调显示高质量企业留存、干净优先权结构，以及历史发行版业务之外可衡量的
              AI 平台增购，观点才会改善。
