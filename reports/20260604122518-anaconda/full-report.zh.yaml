  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接同业、在位厂商、相邻玩家、替代方案与现状
        blocks:
          - type: paragraph
            body: >
              Anaconda 的竞争集合异常宽，因为买方任务本身是一组打包需求：获取可信 Python 软件包、创建可复现环境、运行 notebook、跨团队协作，并满足企业治理。没有单一对手覆盖每一层。Posit
              是最直接同业，因为它组合了带治理的 Python/R 软件包仓库、集中管理的工作台、发布能力和商业支持。Databricks、Amazon SageMaker Unified Studio 和 Google
              Colab Enterprise 是相邻在位者，它们把编码环境放在带治理的数据和 AI 基础设施旁边，从而吸收 notebook 和开发支出。Microsoft 则从编辑器层进攻，路径包括 VS
              Code、Jupyter 扩展、虚拟环境和 Azure 联动工作流。


              替代集合更大。Jupyter、JupyterHub、VS Code、PyPI、Poetry、uv 和 Python Packaging Authority 工作流合在一起，不付平台捆绑费用也能复刻
              Anaconda 的很多开发者价值。Conda 本身仍是 Anaconda 的强项，但这也意味着公司面对的不只是封闭供应商，还要同开放标准和模块化工具竞争。评论证据强化了这一点：买方一直称赞环境隔离、捆绑软件包和
              notebook 便利性，但也抱怨安装包重、软件包陈旧、占用 RAM、UI 迟缓。这些抱怨很重要，因为它们会把用户推向更轻量的替代方案。


              因此，尽调时应把竞争对手分成七个实用类别：直接治理型同业（Posit）、云在位者（Databricks、SageMaker、Colab Enterprise）、现状编辑器加 notebook（VS Code +
              Jupyter）、软件包管理器替代品（uv、Poetry、PyPI/pip）、内部自建栈，以及已经掌握周边工作流的大型平台可能进入。外部技术图谱数据噪音足够大，恰好证明品类边界很松：6sense 把
              Anaconda 与 pandas、Apache Spark、Amazon SageMaker、Vertex AI 等都归在一起；这对重叠映射有方向性帮助，但不能用来精确承保市场份额。
