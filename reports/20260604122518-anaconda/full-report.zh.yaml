      - number: '7.3'
        title: 运营、产品安全与依赖风险
        blocks:
          - type: paragraph
            body: >-
              运营风险直接来自产品架构和定位。Anaconda 主张，筛选仓库和受治理包管理能降低软件供应链暴露；公司也用年度渗透测试、加密控制、SOC 2 Type 2
              认证，以及付费方案里的包安全功能支撑这个说法。即便如此，剩余暴露仍难以忽视。Python 生态仍是高容量威胁面：PyPI 继续警告拼写抢注、依赖混淆和恶意软件；其 2026
              年事件报告记录了流行包中的凭据窃取恶意软件；Sonatype 的 2026 年数据也显示，注册表正越来越多被当作滥用分发平台。Anaconda 自身在 conda-build、installer 和 Dask
              相关组件上也有直接漏洞历史。商业风险和技术风险绑在一起，因为企业买方越来越可以选择相邻替代，而不是接受摩擦：Databricks 和 SageMaker 提供受治理 AI 栈，VS Code 是主流
              notebook 环境，uv 加 PyPA 工具让包和环境管理更快、更模块化。评论数据还给出实际警示：卡顿、RAM 占用、部署摩擦和支持滞后，仍可能削弱大型账户扩张。
