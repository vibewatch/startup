  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要风险通过少数共同通道传导：精选包信任、合规可信度、企业转化和估值支撑。
    data:
      nodes:
        - id: n1
          label: 上游包受损
          description: 恶意软件、受损维护者或有漏洞的构建工具进入可信工作流。
        - id: n2
          label: AI / 隐私合规负担
          description: EU AI Act、DOJ 数据传输和州隐私要求扩大运营义务。
        - id: n3
          label: 企业信任
          description: 安全审查结果、法务舒适度和运营信心。
        - id: n4
          label: 销售周期 / 部署摩擦
          description: 采购、架构审查和实施复杂度。
        - id: n5
          label: 扩张 / 留存质量
          description: 席位增长、定制套餐采用和续约韧性。
        - id: n6
          label: 毛利 / 支持负担
          description: 安全运营、托管选择、高级支持和专业服务负载。
        - id: n7
          label: 估值支撑
          description: AI 平台定位能否撑住溢价定价和投资者信心。
      edges:
        - from: n1
          to: n3
        - from: n1
          to: n6
        - from: n2
          to: n3
        - from: n2
          to: n4
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n4
          to: n6
        - from: n5
          to: n7
        - from: n6
          to: n7
    approximationNotes: null
    claimRefs:
      - CR011
      - CR013
      - CR016
      - CR021
      - CR028
      - CR037
      - CR039
      - CR041
      - CR044
      - CR045
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Anaconda 夹在上游 Python 包生态、企业基础设施和替代工作流平台之间，因此依赖风险既是技术问题，也是商业问题。
    data:
      nodes:
        - id: core
          label: Anaconda 平台
          description: 精选包、笔记本环境、治理、AI 功能和定制部署。
        - id: pypi
          label: PyPI / 开源维护者
          description: 上游包生态和安全事件暴露面。
        - id: dbx
          label: Databricks
          description: 企业 AI 工作流的原生集成和市场进入合作伙伴。
        - id: cloud
          label: 云 / 编排
          description: AWS 关联基础设施、S3、Kubernetes 和客户自选托管模式。
        - id: alts
          label: 工作流替代品
          description: uv、VS Code、PyPA 工具、SageMaker 和其他相邻平台。
        - id: cust
          label: 企业客户
          description: 追求安全、治理、可复现性和部署速度的买方。
      edges:
        - from: pypi
          to: core
        - from: dbx
          to: core
        - from: cloud
          to: core
        - from: alts
          to: cust
        - from: core
          to: cust
        - from: dbx
          to: cust
    approximationNotes: null
    claimRefs:
      - CR013
      - CR020
      - CR021
      - CR029
      - CR030
      - CR031
      - CR032
      - CR033
      - CR034
      - CR044
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: Anaconda 的建议判断从真实规模和变现资产出发，穿过披露与授权风险，最终落在观察 / 继续研究。
    data:
      nodes:
        - id: A
          label: '>$150M ARR + 已盈利'
          detail: 公司有真实运营规模，不只是 AI 叙事。
          tone: positive
        - id: B
          label: 50M 用户 / 10,000+ 家企业
          detail: 装机基础的触达和客户证据都有分量。
          tone: positive
        - id: C
          label: AI 平台 + 治理变现
          detail: 如果附加销售跑通，更高价值的控制平面逻辑可以抬高 ARPU。
          tone: positive
        - id: D
          label: 授权 + 流失风险
          detail: 研究和开源使用占比高的用户可以迁移到 Miniforge 或 conda-forge。
          tone: risk
        - id: E
          label: 条款与经济性不透明
          detail: 毛利率、NRR、集中度和优先股堆叠仍未披露。
          tone: risk
        - id: F
          label: 观察 / 继续研究
          detail: 把据报道约 $1.5B 的价格当作尽调上限，而不是绿灯。
          tone: risk
      edges:
        - from: A
          to: B
          label: 支撑
        - from: B
          to: C
          label: 使其成为可能
        - from: C
          to: D
          label: 必须跑赢
        - from: D
          to: E
          label: 放大
        - from: E
          to: F
          label: 因此
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV009
      - CV024
      - CV030
      - CV035
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 估值最敏感的两件事，公开证据尚无法清楚回答：Series C 之后的 ARR 增长，以及投资者愿意为受治理 AI 平台故事支付的倍数。
    data:
      items:
        - label: $170M ARR 的 5x
          value: 0.85
          unit: $B
          detail: 偏悲观的软件工具结局：附加销售弱，增长低迷。
          tone: risk
        - label: $185M ARR 的 7x
          value: 1.3
          unit: $B
          detail: 如果平台有帮助但不足以重估故事，这是基准情景下沿。
          tone: neutral
        - label: 据报道融资轮
          value: 1.5
          unit: $B
          detail: 老股交易报道给出的 2025 年参考点。
          tone: neutral
        - label: $220M ARR 的 9x
          value: 1.98
          unit: $B
          detail: 企业端稳步扩张时的基准情景上沿。
          tone: neutral
        - label: $260M ARR 的 12x
          value: 3.12
          unit: $B
          detail: 乐观情景：AI 平台变现看起来持久，且值得溢价。
          tone: positive
      xAxis: 情景
      yAxis: 估值（$B）
    claimRefs:
      - CV005
      - CV022
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 区间很宽，反映了真实的特许经营价值；但公开文件仍无法把高溢价 AI 平台经济性和成熟工具经济性清楚区分开。
    data:
      items:
        - label: 悲观
          low: 0.7
          mid: 0.95
          high: 1.2
          displayValue: $0.7B-$1.2B
          detail: 授权驱动的替代和弱附加销售，阻止有意义的重估。
          tone: risk
        - label: 基准
          low: 1.3
          mid: 1.6
          high: 2
          displayValue: $1.3B-$2.0B
          detail: 中等增长让公允价值接近据报道融资轮。
          tone: neutral
        - label: 乐观
          low: 2.5
          mid: 3
          high: 3.6
          displayValue: $2.5B-$3.6B
          detail: 受治理 AI 工作流变现跑通，客户扩张也顺畅。
          tone: positive
        - label: 优先入场
          low: 1.1
          mid: 1.2
          high: 1.3
          displayValue: $1.1B-$1.3B
          detail: 对新投资者而言，当前不确定性能得到更好补偿的区间。
          tone: positive
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 这张计分卡说明，Anaconda 原则上可投，但以据报道的 2025 年价格，还不足以激进承销。
    data:
      items:
        - label: 据报道估值
          value: $1.5B
          detail: 老股交易报道给出的 2025 年 Series C 标记。
          tone: neutral
        - label: ARR
          value: '>$150M'
          detail: 截至 2025 年 7 月的官方披露；公司也称已盈利。
          tone: positive
        - label: 隐含 ARR 倍数
          value: ~10x
          detail: 位于可比公司区间中段，并非明显便宜。
          tone: neutral
        - label: 大型企业
          value: 10,000+
          detail: 如果收入集中度合理，这是有用的企业端证据。
          tone: positive
        - label: 用户
          value: 50M
          detail: 触达巨大，但转化质量仍比用户数更重要。
          tone: positive
        - label: Business 套餐价格
          value: $50/user/mo
          detail: 展示治理和安全的明确企业变现路径。
          tone: neutral
        - label: 历史资本
          value: $210M-$290.6M
          detail: 数据供应商口径不一致，优先股悬顶仍未解决。
          tone: risk
        - label: 投委会姿态
          value: track
          detail: 真实公司，价格验证不完整。
          tone: risk
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV008
      - CV009
      - CV026
      - CV027
      - CV028
      - CV043
