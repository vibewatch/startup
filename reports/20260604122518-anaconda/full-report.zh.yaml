      - number: '2.2'
        title: TAM、SAM 和受证据约束的测算视角
        blocks:
          - type: paragraph
            body: >-
              公开分析师报告都同意广义数据科学平台市场很大，但对规模和增长路径分歧很尖锐。Precedence Research 认为市场 2025 年为 $175.15 billion、2026 年为 $203.53
              billion，并会以 15.84% CAGR 到 2035 年达到 $762.06 billion。Technavio 则把机会定义为 2025 到 2030 年 $707.84 billion
              的增量增长，CAGR 为 33.1%；Business Research Insights 则认为 2026 年市场只有 $73.46
              billion。这些差距大到不能互换使用；它们几乎肯定反映了不同的品类边界、细分组合和纳入的工作流层。

              更有用的可服务性视角，来自市场中最接近 Anaconda 任务的部分。Technavio 称，仅本地部署细分在 2024 年就价值 $118.21 billion；Precedence 称大型企业在 2025
              年引领该品类。这与 Anaconda 对受治理环境、CVE 跟踪和受控分发的强调方向一致。第二个非收入视角来自 Python 工作流使用：Python 生态仍然庞大，PyPI 拥有 40.7 TB
              发布文件，调研数据显示 Python 用户会从 PyPI、私有索引、内部镜像和 Conda channel 安装。第三个视角是观测到的足迹：6sense 报告称 2026 年有超过 1,360 家公司把
              Anaconda 用作数据科学和机器学习工具，但这应被视为方向性使用证据，而不是已变现客户的桥接。
