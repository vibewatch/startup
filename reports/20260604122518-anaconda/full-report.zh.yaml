            title: 把报道轮次当作尽调天花板，而不是入场地板
            body: 2025 年融资证明外部需求真实存在，也很可能反映了外部观察者尚未掌握的信息；但如果看不到条款清单、审计后的单位经济，以及许可执行让收入扩张快于漏斗收窄的更清楚证据，公开材料仍无法支持按同一价格买入。
            calloutType: recommendation
