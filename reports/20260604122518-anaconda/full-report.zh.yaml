  - id: TV005
    title: 打破投资论点与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 融资重置
        - 任何一级融资或定价二级交易在约 $1.3B 或以下
        - 表明投资者并不认为 2025 年轮次站得住，并迫使可比锚点重设
        - 立即按新价格重新承销，并把旧轮次视为过期。
      - - ARR 未复合增长
        - 到下一轮融资周期，ARR 未能显著高于当前披露的 >$150M 水平
        - 打破溢价倍数论点，因为公司会在证明顶级经济性之前就显得成熟
        - 把案例推向回避，或要求大幅折价。
      - - 许可反弹转化为流失
        - 更多机构或企业账号将核心工作流迁往 Miniforge 或 conda-forge，续约质量走弱
        - 证明强制执行收缩漏斗的速度快于 ARPU 提升，从而削弱变现论点
        - 缩小仓位、放慢流程，或在转化数据无法抵消损失时退出。
      - - AI Platform 附加不及预期
        - 企业客户群组中，新 AI Platform 使用率仍低，或扩张收入很少
        - 击穿 Anaconda 相比传统工具同业应获得更高价值工作流和治理倍数的论点
        - 按更接近成熟软件可比公司的口径估值，而不是按 AI 领军公司估值。
      - - 经济性显得普通
        - 毛利率、NRR 或集中度数据未能显示软件式质量
        - 拿掉支付约 10x ARR 的主要理由
        - 重估到 5x-7x，并回避全价入场。
      - - 优先权栈沉重
        - 优先顺位、清算优先权或二级占比过高的结构，实质削弱新资金上行
        - 意味着表面估值夸大了普通股和后期投资者的真实股权价值
        - 坚持结构保护、折价，或不投。
    notes: 这些是会移动价格的触发项，不是抽象担忧。每行都给出一个阈值，触发后应真正改变承销、谈判姿态或继续推进的意愿。
    claimRefs:
      - CV028
      - CV029
      - CV033
      - CV035
      - CV039
      - CV040
      - CV041
      - CV045
      - CV046
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 股权结构和清算瀑布
        - Series C 的准确投后估值、股份类别、清算优先权、优先顺位，以及一级 / 二级拆分
        - 判断表面价格是否等于新投资者的真实经济价值
        - CFO 材料包，加律师审阅的股权结构表和清算瀑布模型。
      - - 单位经济
        - 审计后的 ARR 桥接表、毛利率、NRR、客户数流失和自由现金流画像
        - 把看似合理的 AI 故事转成可辩护的估值框架
        - 财务团队、审计材料和群组看板。
      - - 客户集中度
        - 最大客户和重点客群敞口，以及最大企业客户群组的续约行为
        - 检验 10,000+ 企业数量是否转化为分散且持久的收入
        - 收入运营和董事会报告摘录。
      - - AI Platform 变现
        - 2025 年平台发布带来的附加率、净扩张、价格实现和新客户赢单
        - 告诉投资者更高价值的平台论点是真实，还是只是叙事
        - 产品分析、销售管线和群组扩张复盘。
      - - 许可影响
        - 自 2024-2026 年政策变化以来，按学术、研究、SMB 和受监管企业分段的迁移、流失和转化数据
        - 衡量强制执行是在创造净变现，还是在伤害漏斗
        - 客户成功分析，加渠道和支持工单。
      - - 退出准备度
        - 审计报表、治理准备度，以及面向战略出售或 IPO 路径的投行式材料
        - 判断时点、现实买家集合和持有期所必需
        - CEO/CFO 尽调会和数据室准备清单。
    notes: 这些是把 Anaconda 从动人叙事转成可承销定价机会所需的最低问题清单。没有这些，正确立场仍应保持有条件。
    claimRefs:
      - CV024
      - CV028
      - CV029
      - CV035
      - CV044
      - CV045
      - CV047
