      - number: '1.3'
        title: 融资历史、投资人和公开规模指标
        blocks:
          - type: paragraph
            body: >-
              Anaconda 2025 年 7 月的 Series C 是当前公司画像里的锚定融资事件。公司、投资人和 Business Wire 的官方材料都称，公司由 Insight Partners
              领投、Mubadala Capital 参投，募资超过 $150 million；截至 2025 年 7 月，公司已经盈利，ARR 超过 $150 million。CRN、Economic Times 和
              Tracxn 的第三方报道进一步补上市场价值口径：本轮以约 $1.5 billion 估值完成。更早的融资历史没有这么清晰。Tracxn 报告称公司累计约 $210 million、跨 16 轮融资，包括
              2015 年由 General Catalyst 和 BuildGroup 领投的 $24 million Series A、2015 年来自 SVB 的 venture-debt 轮，以及 2021 年包含
              Snowflake 的 Series B。相比之下，TipRanks 可见摘要只显示最新的 $150 million 轮次，因此累计融资额应视为数据库推导，而非公司披露。公司还表示 Series C 将投入新
              AI 功能、收购和全球扩张，并为现任和前员工提供流动性选项，但具体老股部分并未公开。规模指标方向上强，但质量仍参差：用户、下载量、企业渗透和 ARR 都是公司口径，估值来自第三方报道，员工数只是外部在 2026
              年春季估计的约 571 到 576 人。公开材料没有披露付费客户数、毛利率、净留存，或 Austin 之外的办公地点。
