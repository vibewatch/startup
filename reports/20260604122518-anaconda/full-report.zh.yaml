        - 安全公告、CVE 信息流、客户事件通知
        - Anaconda 精选工具或主要上游包发生高严重性入侵，并在被遏制前进入企业工作流
        - 暂停承销判断，直到事件响应质量、客户影响和仓库加固控制得到验证。
      - - AI / 隐私合规偏离
        - EU AI Act、DOJ / 州隐私更新、客户尽调资料包
        - 管理层无法拿出 AI 透明度、数据传输尽调和第三方 AI 处理的最新控制映射
        - 假设受监管行业增长放慢、合规运营支出升高；降低估值容忍度。
      - - 商业摩擦与扩张拖累
        - 续约数据、采购反馈、合同周期
        - 有证据显示审计权、定价不透明或按席位设门槛，实质性拖慢 16+ 席位账号的转化或扩张
        - 把 ARR 质量视为弱于表面增长，承销前要求更清晰的净留存证据。
      - - 对外部平台的伙伴依赖
        - Databricks 伙伴关系表现、云架构尽调
        - Databricks 未能带来有意义的销售管线 / 使用量，或安全托管经济性实质恶化
        - 降低对商业化杠杆的信心，并假设直销和实施成本更高。
      - - 支持 / 可靠性可扩展性
        - 支持 KPI、事件日志、客户访谈
        - 尽管 Business / Custom 被采用，支持解决时间仍恶化，或大型环境稳定性投诉持续
        - 下调企业扩张假设，并在模型中加入更高服务负担或流失风险。
      - - 单位经济不透明
        - 围绕毛利率、集中度和部署成本对管理层尽调
        - 尽调后毛利率、支持负担和集中度数据仍不可得
        - 不要仅凭治理定位就承销溢价倍数扩张；保持保守建议。
    notes: 这些否决标准是与估值挂钩、可监控的尽调检查点，不是泛泛的战略观察。
