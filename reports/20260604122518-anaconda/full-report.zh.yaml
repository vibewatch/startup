      - number: '6.4'
        title: 留存、耐久性与满意度
        blocks:
          - type: paragraph
            body: >-
              公开留存能见度是 Anaconda 客户故事里最弱的一环。已审阅的官方页面、客户案例和第三方评论页，都没有披露
              NRR、GRR、流失、续约率或合同期限分布。因此，耐久性只能推断，不能验证。最好的替代指标来自受监管部署：一旦银行或信用社把筛选仓库、SSO、漏洞控制和生产模型交付实践嵌入日常工作，迁出成本很可能不低。


              满意度证据方向上正面，但并不单一。GetApp 评论的整体情绪较强，TrustRadius
              评论也确认用户重视多版本环境管理和服务器端部署。与此同时，第三方抱怨足够一致，必须纳入判断：用户提到安装包臃肿、启动慢、RAM 占用高、依赖下载失败，以及偶发环境损坏。这种张力很重要，因为 Anaconda
              同时销售自上而下的治理和自下而上的从业者生产力。管理员价值强、日常从业者体验转弱时，即使看不到客户流失，扩张也可能变慢。结论是：在受监管生产环境里，客户耐久性看起来合理；但仅靠公开数据，仍无法量化。
