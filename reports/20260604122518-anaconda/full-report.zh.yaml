      - number: '8.2'
        title: 融资背景与可比公司集合
        blocks:
          - type: paragraph
            body: >-
              融资背景正面，但不完整。2025 年 7 月 Series C 从 Insight Partners 和 Mubadala Capital 获得超过
              $150M，公司称用途包括产品开发、收购、国际扩张和员工流动性。最后一点很重要，因为它暗示该轮可能同时有一级和二级目标；同时第三方数据供应商对累计融资额意见不一，优先权结构仍不透明。可比公司给出的结论是谨慎，而不是恐慌。Databricks
              和 Datadog 说明，增长和留存强的 AI / 数据平台可以拿到 24x-28x 收入倍数。Atlassian、GitLab 和 Asana 展示了区间另一端，大约 2x-6x。Anaconda 报道中的约
              10x ARR 倍数落在中间：高于成熟协作和 DevOps 软件，低于顶级 AI 基础设施领导者。如果 Anaconda
              的安全和治理层能把安装基础转成耐久企业支出，这个位置可以辩护；但公开材料还没有给出足以让投资人有信心支付溢价的单位经济证据。可比集合是合理性区间，不是价格自证。
