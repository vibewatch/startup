      - number: '5.2'
        title: 架构、部署模式和集成
        blocks:
          - type: paragraph
            body: >-
              公开运营模型有四个可见层。第一层是软件包和环境底座：conda、repo.anaconda.com、anaconda.org，以及更广的 conda 生态。第二层是 Anaconda Platform Cloud
              中的治理 / 控制层，组织在这里管理 channel、策略、身份、环境日志和审计轨迹。第三层是面向用户的执行层：本地机器上的 Navigator 和 Desktop、浏览器里的
              Notebooks，以及跨本地、Desktop、CLI 或 AWS 支持部署路径的 AI Catalyst。第四层是合作伙伴运行时层，Anaconda 把带治理的软件包或模型流注入客户已经使用的系统，尤其是
              Databricks 和 Microsoft 界面。


              Databricks 文档对 Anaconda 来说异常具体。它展示了一个自定义容器模式：使用 Databricks Container Services、Miniconda 启动、conda-token
              认证、严格 channel 优先级，以及 repo.anaconda.cloud 下的虚拟组织 channel。这很重要，因为它把 Anaconda
              从被动软件包来源变成生产运行时组装里的主动部件。Microsoft 侧也有战略意义：Azure 授权条款、较早的 Azure 合作公告，以及 Microsoft 自己的 Python in Excel
              材料，都显示 Anaconda 发行资产被嵌入更广的伙伴工作流，而不是只通过独立 Anaconda 界面使用。AI Catalyst 在这套栈上增加一条更新的部署通道，围绕精选模型目录、受控推理、AI BOM
              和自托管 VPC 部署。公开架构已经具体到足以理解控制界面和依赖关系，但仍比真正的内部工程蓝图薄；租户隔离设计、服务拓扑和正式 uptime 边界只露出一部分。
