      - number: '2.3'
        title: 买方、用户、付款方和采用路径
        blocks:
          - type: paragraph
            body: >-
              Anaconda 的用户范围远大于可能付款方。个人学习者、研究人员和从业者，用 Jupyter、VS Code、Colab、PyPI 和 Conda 就能完成许多工作流，不必购买带治理的商业平台。当
              notebook 协作、可复现性、精选软件包和访问管理在团队层面变得重要时，部门级数据科学和 ML 团队才成为第一批可能的经济买方。组织更大或受监管时，付款方会再次上移：平台工程、IT
              或安全团队关心的是策略执行、漏洞阻断、SSO、可审计性，以及跨大量用户的受控分发。

              公开企业平台页面也说明，这是一笔多角色采购，而不是单开发者增购。Azure Machine Learning 明确面向数据科学家、ML 工程师、应用开发者和平台开发者。Posit
              把集中、受治理环境定位成非托管本地配置的替代方案，Posit Package Manager 则把软件包治理定位成贯穿数据科学生命周期的协同层。因此，Anaconda 最合理的采用路径是从开源 Python
              使用开始；工作流共享后升级到团队 notebook 和精选软件包；安全和合规要求足以支撑更广部署时，再进入集中预算负责人。云优先团队则可能把这笔支出导入 Databricks、SageMaker 或 Azure
              合同。
