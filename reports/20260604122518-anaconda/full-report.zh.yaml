      - number: '4.2'
        title: GTM 动作和销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，公司采用混合的 PLG 到企业销售动作，而不是经典自上而下软件销售模型。Anaconda 保留巨大的开源和教育漏斗，随后在团队需要治理、高级仓库、notebook
              算力或更广组织合规时变现。Databricks 合作强化了这一动作：Anaconda 的精选软件包分发被原生嵌入 Databricks
              Runtime，并明确通过客户团队和合作伙伴线索激活，看起来像面向大客户的共同销售杠杆。牵引力方面，管理层在 2025 年 7 月披露 ARR 超过 $150 million、盈利、超过 10,000
              家大型企业、50 million 用户和 21 billion 次下载。但公司自己的界面还引用 250,000+
              个组织，另处又称超过一百万客户，所以公开分母在用户、组织、企业和客户之间切换。即便顶层漏斗显然巨大，付费客户基础也难以拆出来。用披露的 ARR 和当前员工数追踪器测算，ARR / 员工约为
              $260,000，对于基础设施软件算不错。但 CAC、回本周期、NRR、实际 ASP 和销售周期时长都未披露，销售效率只能用代理指标估，而不能承保。
