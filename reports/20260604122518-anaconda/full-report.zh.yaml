          - type: callout
            title: 整个牛市逻辑押注转化质量，而不是社区覆盖
            body: 五千万用户和广泛 Fortune 500 采用是强资产，但只有当新的 AI Platform 和治理层把覆盖面转成耐久、高价值企业扩张时，它们才支撑上行。如果转化滞后、迁移上升，倍数应该压缩，而不是扩张。
            calloutType: assumption
