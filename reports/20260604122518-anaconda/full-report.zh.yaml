  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        This set intentionally covers the six most decision-useful public or private valuation anchors for this chapter:
        Anaconda itself, one premium private AI-data ceiling comp, and four disclosed public software comps. Coverage is
        partial because closer private peers such as Dataiku, Domino Data Lab, or H2O.ai do not all disclose fresh
        enough pricing and revenue data to support clean same-date multiple analysis.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限性
    rows:
      - - Anaconda（报道的 2025 Series C）
        - '>$150M ARR，报道估值 ~$1.5B'
        - ~10x ARR
        - 标的公司本身，也是当前定价参照
        - 估值来自二手报道，轮次条款未披露。
      - - Databricks（Series L 2025）
        - 基于 $4.8B 年化收入的 $134B 估值
        - ~27.9x 年化收入
        - 规模化品类龙头的高端 AI / 数据平台天花板
        - 规模大得多，披露 >140% NRR，收入动能强于 Anaconda。
      - - Datadog（2026 年上市公司）
        - $89.1B 市值，$3.67B TTM 收入
        - ~24.3x 收入
        - 高溢价上市数据基础设施倍数，显示顶级增长和留存可支撑的定价
        - 可观测性不是 Python 包管理的直接类似物，且 Datadog 透明得多。
      - - GitLab（2026 年上市公司）
        - $5.22B 市值，$0.95B TTM 收入
        - ~5.5x 收入
        - 开发者工作流和工具参考，更接近 Anaconda 历史发行版根基
        - DevOps 平台敞口不同于 AI 包治理和模型管理。
      - - Atlassian（2026 年上市公司）
        - $25.76B 市值，$6.19B TTM 收入
        - ~4.2x 收入
        - 成熟企业软件估值下限，代表有广泛装机基础的可信工作流供应商
        - 规模和成熟度远超 Anaconda，AI 敞口也不那么核心。
      - - Asana（2026 年上市公司）
        - $1.89B 市值，$0.79B TTM 收入
        - ~2.4x 收入
        - 下限工作流 SaaS 倍数，显示低增长软件如何定价
        - 产品邻近性弱，Asana 不是 AI 基础设施业务。
    notes: >-
      市值和收入数字是截至 2026 年 6 月公开市场数据的近似读数。这张表用于框住倍数区间， 不主张任何一个可比对象都能直接套用到 Anaconda。证据集纳入上市公司 10-K，是为了突出这些可比公司披露明显强于
      Anaconda 的私人文件集。
