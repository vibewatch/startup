  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价架构和确认质量
        blocks:
          - type: paragraph
            body: >-
              Anaconda 的公开界面支持一种经常性软件收入模式：先用广泛的免费和开源漏斗获客，再围绕组织治理、安全和企业部署需求变现。官方定价显示 Starter 为每用户每月 $15，Business 为每用户每月
              $50；Business Plan 页面称，买方最多只能自助购买 15 个席位，超过 200 名员工的组织需要 Business 授权。条款进一步点出，企业级 HPC 和 serverless
              使用需要额外付费，说明定价不只是按席位，也会反映部署强度。Sacra
              的分析与这个图景一致：产品主导采用先建立熟悉度，随后更大团队、受监管买方和自托管需求会把销售动作推向定制合同。收入质量因此偏有利，因为增购驱动来自经常性治理和合规需求，而不是一次性实验。主要公开弱点是收入确认质量。Anaconda
              提供云、本地、自托管和支持较重的企业实施，但没有披露 GAAP 收入确认政策、递延收入，或订阅收入与服务收入的拆分。
