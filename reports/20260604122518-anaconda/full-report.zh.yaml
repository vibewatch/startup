      - number: '8.4'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出准备度有希望，但还不干净。Anaconda 更像未来战略出售或延迟 IPO 候选，而不是能立即清价的资产。战略逻辑直观：一个盈利的 Python 和 AI
              发行层，拥有深度企业覆盖；如果公司证明治理和筛选能转化为经常性高毛利支出，它可能对云、数据、安全或开发者平台买方有价值。但真正交易流程所需的文件集仍不完整。投资人需要审计财务、精确股权结构表和清算优先权数据、cohort
              留存、客户集中度、AI 平台附加率与扩张指标，以及量化证据，证明许可执行提高变现的速度快于它鼓励替代的速度。没有这些材料，合理持有假设是 4-6 年，姿态应是有条件而非激进。打破投资逻辑的事件很直接：以约
              $1.3B 或更低估值融资；证据显示研究和企业用户流失快于 Anaconda 转化他们；AI 平台增购失败；或者 ARR 没有超越当前披露水平继续复合增长。
