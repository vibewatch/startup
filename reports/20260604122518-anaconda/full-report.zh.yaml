      - number: '1.2'
        title: 创始人、领导层和治理
        blocks:
          - type: paragraph
            body: >-
              当前高管班底披露清楚，但完整董事会并未公开。Anaconda 的领导层页面列出 David DeSanto 为首席执行官，Jane Kim 为联席总裁兼首席商务官，Laura Sellers
              为联席总裁兼首席产品与技术官，Peter Wang 为首席 AI 与创新官兼联合创始人，Vanessa Macllwaine 为首席人力官，Megan Niedermeyer 为首席法务官。最重要的领导层变化是
              2025 年 10 月任命前 GitLab 首席产品官 DeSanto 为 CEO 并进入董事会。这一变化看起来重要，因为 2024 年 2 月 IBM 合作公告引用的 CEO 仍是 Barry
              Libert，说明公司有意从上一阶段领导层切换到更偏企业软件的运营姿态。治理透明度弱于领导层透明度：官方公司来源点名 Insight Partners 的 George Mathew 为董事，并确认
              DeSanto 进入董事会，但没有公布完整董事名单、委员会结构或投资人控制权。Peter Wang 仍是重要关键人依赖，因为他既是联合创始人，也是公司产品与开源定位的公开代表；DeSanto
              和扩大的高管团队则负责商业执行、产品规模化，以及法律 / 治理纪律。
