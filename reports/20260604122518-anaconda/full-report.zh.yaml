        - 按细分和队列索取免费转付费转化率
      - - Starter 订阅
        - 自助协作套餐
        - $15 每用户每月
        - 公开标价；自助服务仅限最多 15 个席位
        - 经常性定价透明度高，但实际 ASP 可见度低
        - 索取月付 vs 年付组合和折扣
      - - Business 订阅
        - 含高级仓库和 notebook 的治理与安全套餐
        - $50 每用户每月
        - 公开标价；员工数 >200 的组织需购买 Business 许可
        - 经常性收入质量高，功能驱动的增购更强
        - 索取续约、席位扩张和按账户规模拆分的净留存
      - - 自定义企业 / 自托管合同
        - 面向大团队、本地部署、隔离环境或更广部署需求的协商合同
        - 合同 / 许可证
        - 联系销售路径；价格未披露
        - 质量中高，但实际变现不透明
        - 索取 ACV、期限长度，以及订阅与服务拆分
      - - 企业级计算附加费
        - HPC、serverless 和突发计算使用模式需额外付费
        - 用量 / 基础设施
        - 条款要求企业级模式付费
        - 质量中等：能变现重度用量，但不透明
        - 索取费率表和大规模部署的毛利率画像
      - - 实施、支持和合作伙伴主导部署
        - 更高接触度的设置、策略配置、支持，以及可能的 OEM 或合作伙伴辅助交付
        - 项目 / 年度支持
        - 文档和合作伙伴路径可支撑，但收入未披露
        - 质量中等，利润率可能低于软件订阅
        - 索取服务收入占比和支持附加率
    notes: 公开证据支持变现架构和标价，但不支持拆分自助、企业和服务收入的实际组合。
