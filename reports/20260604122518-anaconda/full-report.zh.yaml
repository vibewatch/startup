            body: >-
              最强的资本充足性证据既新且正面：Anaconda 称自己 2025 年 7 月融资超过 $150 million，当时已经盈利，并计划把募资投入 AI
              功能、收购、全球扩张和员工流动性。这个组合降低了近期融资依赖，也暗示下一轮更可能为扩张或 M&A
              融资，而不是填补生存性现金缺口。即便如此，公开承保仍不完整。审阅来源没有披露在手现金、月烧钱、跑道月数或当前债务义务。2021 年 SEC Form D 有用，因为它确认了一次历史融资事件，并显示
              Anaconda 在文件中拒绝披露收入区间；但它解决不了当前现金透明度。第三方数据库也对累计融资额意见不一，从约 $210 million 到 $290.6 million
              不等，意味着在做任何精确稀释或资本效率分析前，连融资历史都需要对账。再加上大学和其他机构对授权调整的反弹，财务结论变得平衡：收入质量看起来好过纯按量计费的 AI
