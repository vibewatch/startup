  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序视图
        blocks:
          - type: paragraph
            body: >-
              这里必须按严重性排序，因为 Anaconda 的公开画像同时有强缓释因素，也有仍显脆弱的差异化证据。最高严重性风险是供应链信任事件：公司销售筛选过的 Python 包和安全治理，但 Python
              生态仍在持续被攻击，PyPI 继续发布供应链事件报告，OpenCVE 也显示 Anaconda 控制的构建和安装器组件在 2024-2026 年出现过实质漏洞。第二是 AI 和隐私合规漂移：公司从包管理扩展到
              AI Platform，同时 EU AI Act、DOJ 大宗数据传输规则、州级隐私 / AI 要求都在增加治理负担。第三是平台替代：Databricks、SageMaker、VS Code、uv 和直接
              PyPA 工具，都让买方有理由拆开这套栈。第四是商业摩擦，来自公开许可门槛、席位门槛、重定价和有限的基线客户救济。新资本降低了破产风险，但如果高端治理故事站不住，它无法消除执行、利润率或留存风险。
