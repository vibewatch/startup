      - number: '6.5'
        title: 扩张、渠道与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Anaconda 的公开材料暗示了一条可信的先落地再扩张路径。免费和 Starter 方案让个人或小团队无需沉重销售流程就能起步；当治理、SSO、私有仓库或更大席位数变成必需时，Business 和
              Enterprise 包装开始变现。最清楚的扩张模式出现在受监管账户里：Zempler 从安全用包需求扩到更广的欺诈、信用风险和 AML 工作流；大型欧洲机构从传统统计工具转向大规模模型治理；Anaconda
              的伙伴材料也显示，部署变大或跨国之后，经销商可以帮助采购和一级支持。


              主要风险在集中度和摩擦。公开可见证据偏向金融服务和其他技术要求高的工作流，外部观察者仍无法判断付费需求到底有多分散。头部客户集中度、合同条款和续约节奏都未披露。此外，Anaconda 的 200
              人以上员工许可规则明显增加采购摩擦，并在学术和开源社区引发负面反应；一些机构已研究或推荐 Miniforge、conda-forge 等替代方案。这并不推翻企业变现逻辑，但意味着 Anaconda
              可能正在用部分历史草根粘性，交换意图更高的企业转化。投资人应把客户故事读成：受治理生产证据强，扩张架构扎实；集中度和留存证据仍不完整。
