  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 厂商
      - 公开入口
      - 计量 / 合同模型
      - 包含能力
      - 公开量化线索
      - 未知项 / 折扣风险
      - 含义
    rows:
      - - Anaconda
        - 面向个人的免费发行版；员工 / 承包商超过 200 人的组织需要付费商业许可
        - 商业 / 企业客户分层
        - 安全软件包仓库、notebook、治理工具、云托管开发环境
        - 定价页列出 4,000+ 个包；下载页显示 50M+ 用户和 8,000+ 个包
        - 可访问官方文本中未捕捉到公开数字席位价格
        - 免费漏斗顶部很强，但企业定价透明度弱于轻量 OSS 替代品
      - - Posit Team
        - Basic / Enhanced / Advanced 套餐
        - 具名用户 + 仓库 / 部署规模
        - Workbench、Connect、Package Manager
        - Basic 支持最多 10 名开发者 / 50 名查看者 / 3 个仓库；Enhanced 最多 100 名开发者 / 500 名查看者 / 10 个仓库；Advanced 不限
        - 抓取文本未显示精确美元金额
        - 商业套餐明示且集中，便于企业横向比较
      - - Databricks
        - 免费试用 / 询价
        - 按量付费，精确到秒；可签承诺用量合同
        - 覆盖数据、分析、AI 的平台服务
        - 无前期费用；按秒计量
        - SKU 细节取决于各云价目表和折扣
        - 对已有数据平台预算的买方很友好，但比席位制工具更难比较
      - - SageMaker Unified Studio
        - 免费层 + AWS 账号
        - 按服务用量付费
        - Unified Studio、notebook、目录、AI 智能体及周边 AWS 服务
        - 前 2 个月 sc.t3.medium notebook 免费层 250 小时；Data Agent $0.04/credit；Catalog 请求前 4k 免费，之后 $10/100k
        - 实际支出取决于挂接的 AWS 服务和工作负载组合
        - 低摩擦入口加模块化扩展，让 AWS 不必另签平台合同也能吸收预算
      - - Google Colab
        - 免费版 + 付费服务定价页
        - 付费服务 / 绑定 Google Cloud 的企业变现
        - 协作式 notebook、AI 辅助、Vertex AI 集成
        - 可访问的官方页面确认存在付费服务定价
        - 可访问文本未披露具体套餐金额
        - 作为 notebook 楔子很强，即便治理深度没那么明确
      - - VS Code + Jupyter / OSS
        - 免费
        - 无平台费；用户自行选择云 / 基础设施
        - 编辑器、notebook UX、扩展、requirements 导出、虚拟环境
        - 软件本身免费
        - 买方仍需支付支持、算力和集成开销
        - 替代本地 Anaconda 工作流的最低成本路径；对治理最不预设立场
      - - uv、Poetry 与 PyPI
        - 免费
        - 开源工具 + 公共包索引
        - 锁文件、依赖管理、发布、Python 版本管理
        - 无许可证费
        - 企业策略、漏洞拦截和审计必须另行叠加
        - 对 Anaconda 本地设置层的价格压力最大，因为替代成本接近零
    notes: 定价比较刻意先看模式，因为抓取的来源文本里，多家厂商没有公开简单的席位标价。若无法取得精确标价，表格记录变现逻辑，而不是猜测美元金额。
