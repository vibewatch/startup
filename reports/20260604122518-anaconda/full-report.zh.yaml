      - number: '5.4'
        title: 信任、安全、合规、支持和路线图
        blocks:
          - type: paragraph
            body: >-
              信任和控制是 Anaconda 公开信息中最明确的部分。安全与合规页面披露了静态和传输中加密、年度第三方渗透测试、2FA、员工背景调查、ISO 27001 认证和供应商认证要求。Platform
              文档进一步加入基于 SAML 或 OpenID 的企业 SSO、可选 SCIM provisioning、组织事件审计日志，以及本地环境日志加 CVE
              扫描。合起来看，这些材料支撑的是真实企业治理故事，而不是纯营销层面的「默认安全」口号。Microsoft 和 Databricks 集成强化了这一故事，因为两者都围绕已批准软件包、来源、策略和可审计运行时组装。


              可靠性和支持可信，但不完全透明。产品界面显然包括文档、支持工单流程、专业服务语言、审计导出 API 和环境扫描工具；但相比控制话术，公开材料在硬 SLA
              数字、状态历史和租户隔离架构上更轻。这让它看起来对采购友好，但对大型受监管买方仍值得尽调。路线图透明度相对强：2026 年网络研讨会 和战略博客指向更多 AI 模型、SageMaker 支持、安全 pip
              install、持续自托管 / VPC 路径，以及 Core 与 AI Catalyst 的进一步集成。最终，这是一个动能强、治理叙事也强的产品 /
              技术故事；但在投资人把平台主张视为充分去风险前，仍需要对打包边界、客户规模化运营指标和云服务可靠性承诺做更深私有尽调。
