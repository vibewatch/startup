        - 索取连接免费用户、活跃组织、付费账户和企业客户的指标树
        - 官方资料引用 10K 家企业、250K 个组织和 >1M 客户
        - 重大
      - - 实际 ASP 和折扣
        - 标价无法揭示企业变现质量或收缩风险
        - 索取按层级、直销 vs 渠道拆分的标价到净收入瀑布表
        - $15 Starter 和 $50 Business 标价；自定义企业定价未公开
        - 重大
      - - 毛利率和服务利润率
        - 阻碍对贡献毛利率和 AI 计算影响的承销判断
        - 要求按收入流拆分毛利率、服务附加率和 AI 推理 COGS
        - 公开信息只有方向性的软件式成本驱动因素
        - 阻断
      - - CAC、回本周期、NRR、流失率、销售周期
        - 无法建模销售效率和收入耐久性
        - 要求提供按细分市场 / 渠道拆分的队列指标、漏斗转化和回本周期
        - 人均 ARR 和盈利能力只能作为代理指标
        - 阻断
      - - 现金、烧钱速度、现金跑道和当前债务
        - 无法设定下一轮融资触发点或下行情景融资风险
        - 要求提供月度烧钱、现金桥、现金跑道模型和债务偿还表
        - 新融资和盈利能力只能方向性降低风险
        - 阻断
      - - 收入确认政策和递延收入
        - 公开收入质量无法映射到会计现实
        - 要求提供收入确认备忘录、递延收入滚动表和服务确认政策
        - 云端 / 本地 / 定制部署组合表明可能存在多种确认模式
        - 重大
      - - 历史融资对账
        - 相互冲突的融资总额削弱股权结构表和资本效率分析
        - 要求提供逐轮融资明细，并与法律实体对齐
        - 公开数据库对累计融资的差异超过 $80M
        - 重大
    notes: 核心阻碍不是缺少收入牵引，而是缺少私有运营数据；没有这些数据，公开规模信号无法转成可投资的承销判断。
