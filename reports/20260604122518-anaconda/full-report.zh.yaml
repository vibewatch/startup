chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品和商业模式
        blocks:
          - type: paragraph
            body: >-
              Anaconda 由 Peter Wang 和 Travis Oliphant 于 2012 年创立；公司当前材料把它定位为 AI 原生开发的可信底座。官方融资和领导层材料都持续显示公司位于 Texas 州
              Austin，Tracxn 则把它归类为私营 Series C 公司。产品版图已经明显从历史上的 Anaconda Distribution 扩到更宽的平台栈：通过 Conda 做软件包和环境管理，借
              Anaconda Platform 支撑安全、带治理的企业 AI
              开发，并提供云端或自托管部署选项。这一扩张很重要，因为商业模式已经不只是靠免费下载做规模：需要企业级开源管理的组织，会为仓库访问、治理、安全和部署控制付费。它自己的授权页面把这种变现讲得很清楚：员工或承包商超过
              200 人的组织，除非符合例外条件，否则必须购买付费 Business 授权。规模信号大多仍是公司口径，但体量可观：公司称拥有超过 50 million 用户、超过 21 billion 次下载、超过
              10,000 个大型企业用户，并进入 95% 的 Fortune 500。即使公开材料没有把这类触达换算成披露的付费客户数，这些指标仍支持一个判断：Anaconda 已经具备全球分发引力。
