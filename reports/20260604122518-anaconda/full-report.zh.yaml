  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 乐观
        - 到 2028 年 ARR 约达 $250M-$300M；AI Platform 附加和企业治理追加销售跑通；留存呈软件化；许可流失受控。
        - 10x-12x 退出倍数意味着约 $2.5B-$3.6B。从报道 ~$1.5B 入场价看，优先权影响前毛回报约 1.7x-2.4x。
        - 20%-25% —— 需要证据证明 Anaconda 成为真正的 AI 控制平面，而不是披着 AI 品牌的包管理供应商。
        - 来自 Databricks 或云平台的竞争、新平台附加偏弱，或留存不佳，都可能迅速封顶上行。
      - - 基准
        - ARR 增至约 $180M-$220M；公司保持盈利；安全和治理变现有帮助，但不足以让业务大幅重估。
        - 7x-9x 意味着约 $1.3B-$2.0B。按报道轮次看，这更接近保本，而不是风投式上行。
        - 50%-55% —— 最符合已披露证据：ARR 真实、企业触达真实，但经济性不完整，且定价风险混杂。
        - 上一轮价格下上行有限、优先权不透明、客户集中度不确定，仍是主要约束。
      - - 悲观
        - ARR 停滞在 $140M-$170M 附近；defaults 渠道许可推动更多替代；AI Platform 附加不及预期；竞争吸走预算。
        - 5x-7x 意味着约 $0.7B-$1.2B，相对报道轮次指向减记或偏弱二级结果。
        - 25%-30% —— 不是基准情形，但机构主导的迁移和定价摩擦让它可信，而非遥远。
        - 渠道替代、社区反弹、利润率压缩，以及持平或下调融资，会叠加放大下行。
    notes: 这些是情景承销区间，不是 DCF。之所以使用 ARR 和倍数假设，是因为公开证据足以框住收入规模和市场可比公司， 但不足以跑出精确的基于利润率的内在价值模型。
