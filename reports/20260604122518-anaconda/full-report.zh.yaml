  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和客户工作流
        blocks:
          - type: paragraph
            body: >-
              Anaconda 当前产品更应被理解为一套工作流栈，而不是单个 Python 下载。对个人用户来说，入口仍是 Distribution：一个本地安装器，把 conda、Navigator
              和大量预集成软件包基底打包在一起，让环境配置、软件包安装和应用启动都在一条受管理工具链里完成，而不是靠临时拼接 pip 和本地系统折腾。Navigator 随后提供桌面控制界面，用于非 CLI 的软件包、环境和
              channel 管理；Desktop 则把同一本地工作流延伸到模型发现和本地推理。浏览器优先工作中，Notebooks 提供托管 Jupyter runtime、预装软件包环境和可分享输出，包括 Panel
              app。


              对企业团队来说，工作流从本地生产力扩到受治理的软件供应。Platform Cloud 位于中间，作为组织控制平面：channel、group、policy、软件包审查、可审计性和漏洞跟踪。AI Platform
              和 AI Catalyst 则把公司从「Python 发行版供应商」重新定位为带治理的 AI
              开发底座，软件包来源、身份控制、环境可复现性和模型治理都应放在一起。客户工作流因此从选择本地或浏览器界面开始，到拉取已批准软件包和模型，再到在受管理环境中开发，最后分享到或部署进合作伙伴运行时，例如
              Databricks、Azure 服务或 Excel。公开材料支持这条更宽的逻辑，但 Core、Platform、Desktop、Navigator、Notebooks 和 AI Catalyst
              之间的确切商业交接，仍没有产品信息本身讲得清楚。
