            - label: 中高
              tone: warning
              detail: 剩余敞口取决于增长来自产品拉力，还是授权执行机制。
        - label: 平台替代
          values:
            - label: 高
              tone: negative
              detail: uv、VS Code、SageMaker、Databricks 和直接使用 PyPA 工具，都在攻击这个栈的不同部分。
            - label: 高
              tone: negative
              detail: 即便市场需求仍强，替代品也可能压缩定价。
            - label: 中低
              tone: warning
              detail: 安全精选和治理是差异化，但许多相邻功能已是标配。
            - label: 高
              tone: negative
              detail: 在 Anaconda 证明包访问之外的企业粘性足够持久之前，剩余严重性仍高。
        - label: 执行 / 支持扩张
          values:
            - label: 中
              tone: warning
              detail: 新资本、领导层变化和更广的业务范围会抬高协同风险。
            - label: 中高
              tone: warning
              detail: 执行失误会削弱估值支撑，而不是威胁短期流动性。
            - label: 中
              tone: neutral
              detail: 盈利能力和新资本提供了一定缓冲。
            - label: 中
              tone: warning
              detail: 公开支持和单位经济细节仍太薄，无法让人完全放心。
    approximationNotes: null
    claimRefs:
      - CR006
      - CR007
      - CR011
