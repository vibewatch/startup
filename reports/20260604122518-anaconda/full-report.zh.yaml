      - number: '2.4'
        title: 增长驱动因素和采用约束
        blocks:
          - type: paragraph
            body: >-
              几股力量支撑 Anaconda 所在品类继续有需求。Python 仍深度嵌入数据分析和机器学习工作流；Anaconda 自己的 2025 年调研称，87% 的受访者使用 AI
              的强度不低于去年。调研和文档证据也显示，开发者已经混用 PyPI、私有索引、内部镜像、notebook
              和云训练平台；团队从实验走向生产后，治理和可复现性会越来越重要。公开市场报告还提供另一股顺风：它们强调大型企业和受治理部署，而不是纯爱好者使用。

              约束同样重要。免费和捆绑替代方案很多，Anaconda 不能只靠 notebook
              使用来强迫变现。信任和安全也是双刃剑：恶意软件报告和软件包安全工作流提升了对精选仓库的需求，但也提高了供应商证明开源更安全的门槛。捆绑云套件可以把支出吸进既有数据或云合同；来自 Posit、JFrog 和
              Sonatype 的标准 PyPI 兼容仓库替代方案，则降低了只需要软件包治理的买方切换成本。相对云基础设施厂商，Anaconda
              的软件主导产品交付时资本强度更低；但这也意味着，差异化必须来自工作流深度、合规信任和分发，而不是专有算力经济性。
