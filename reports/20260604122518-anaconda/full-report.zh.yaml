      - number: '6.2'
        title: 采用轨迹与部署规模
        blocks:
          - type: paragraph
            body: >-
              Anaconda 的公开采用数据，在漏斗顶部很充足，在付费账户层却很薄。公司页面声称拥有 47M+ 到 50M+ 用户、250K+ 组织、21B+ 下载、10K+ 大型企业，以及 90-95% 的 Fortune
              500 渗透率。这些数字清楚说明覆盖面巨大，但不能告诉投资人其中多少是活跃、付费或具有战略价值的使用。换句话说，Anaconda 对「无处不在」有强证据，对这种覆盖面里的变现深度却没有同等强证据。


              最清楚的漏斗底部采用证据来自具名部署。大型欧洲金融机构案例披露，18 个月内落地 500 个项目、300 名活跃建模人员，说明 Anaconda
              一旦越过治理门槛，就能在单个企业内部铺开。评论平台提供了另一种有用信号：GetApp 的 86 条验证评论说明从业者持续使用；6sense
              的品类视角则暗示，相比更宽的数据科学和机器学习工具，公司有相关性但并非压倒性存在。整体图像是：发现和认知面很宽，在至少部分受监管账户里有真实企业采用；但数千万用户里到底有多少能变成耐久付费客户，公开材料仍说不清。
