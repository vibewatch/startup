- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Supply-chain trust failure
    - Security advisories, CVE feeds, customer incident notices
    - A high-severity compromise in Anaconda-curated tooling or a major upstream package enters enterprise workflows before containment
    - Pause underwriting until incident-response quality, customer impact, and repository-hardening controls are validated.
  - - AI / privacy compliance drift
    - EU AI Act, DOJ/state privacy updates, customer diligence packets
    - Management cannot show current control mappings for AI transparency, data-transfer diligence, and third-party AI processing
    - Assume slower regulated-industry growth and higher compliance opex; lower valuation tolerance.
  - - Commercial friction and expansion drag
    - Renewal data, procurement feedback, contract-cycle timing
    - Evidence that audit rights, pricing opacity, or seat-gating materially slow conversion or expansion in 16+ seat accounts
    - Treat ARR quality as weaker than headline growth and demand clearer net-retention evidence before underwriting.
  - - Partner dependence on external platforms
    - Databricks partnership performance, cloud architecture diligence
    - Databricks fails to drive meaningful pipeline / usage, or secure hosting economics deteriorate materially
    - Reduce conviction in go-to-market leverage and assume heavier direct-sales and implementation costs.
  - - Support / reliability scalability
    - Support KPIs, incident logs, customer references
    - Support resolution times worsen or large-environment stability complaints persist despite Business / Custom adoption
    - Discount enterprise expansion assumptions and model higher services burden or churn risk.
  - - Opaque unit economics
    - Management diligence on gross margin, concentration, and deployment cost
    - Gross margin, support burden, and concentration data remain unavailable after diligence
    - Do not underwrite premium multiple expansion from governance positioning alone; keep recommendation conservative.
  notes: These kill criteria are designed to be monitorable diligence checkpoints tied to valuation, not generic strategic observations.
