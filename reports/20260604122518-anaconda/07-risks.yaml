chapter:
  number: 7
  title: Risks
  summary: Anaconda's main underwritten risk is not near-term liquidity—its July 2025 Series C and claimed profitability reduce that—but whether a curated Python distribution can keep trust, pricing power, and governance relevance as enterprise AI buyers demand both stronger controls and more deployment flexibility. Public mitigants are real (SOC 2 Type 2, annual penetration testing, curated repositories, on-prem options, and the Databricks partnership), but residual exposure stays high because Anaconda has recent CVE history, depends on a hostile Python supply chain, faces low-switching-cost alternatives like uv, VS Code, SageMaker, and Databricks, and does not publicly disclose enough SLA, concentration, or subprocessor detail to fully underwrite expansion in regulated accounts.
