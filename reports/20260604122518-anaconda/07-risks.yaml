    - medium-high
    - Weak baseline recourse can elongate enterprise sales cycles and shift implementation cost to sales engineering and legal teams
    - Request the standard Business and Custom MSA / SLA, indemnity carve-outs, and examples of negotiated liability increases for regulated buyers.
  - - Cross-border sensitive-data and privacy-law exposure
