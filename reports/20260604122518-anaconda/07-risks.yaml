  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: subprocessors-and-ai-processors
    missingEvidence: Named subprocessors, AI processors, regional hosting locations, and transfer-assessment materials from the trust center.
    whyItMatters: Without named vendors and regional controls, it is difficult to underwrite concentration, cross-border exposure, and customer diligence friction for sensitive deployments.
    diligencePath: Request current subprocessor list, trust-center export, and regional architecture overview under NDA.
    relatedQuestionRefs:
    - QR004
    - QR026
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: sla-and-incident-response
    missingEvidence: Standard Business and Custom SLA language, RTO/RPO commitments, incident-postmortem examples, and customer notification procedures.
    whyItMatters: Mission-critical AI and regulated buyers will care more about operational recourse than about marketing-level security claims.
    diligencePath: Request standard SLA / support policy, past postmortems, and uptime history for cloud and managed deployments.
    relatedQuestionRefs:
    - QR027
  - type: private-evidence-only
    severity: blocking
    topic: arr-quality-and-license-enforcement
    missingEvidence: ARR bridge showing what portion of growth comes from >200-employee license enforcement, net-new seats, custom deployments, and attach from AI Platform modules.
    whyItMatters: Investors need to distinguish durable product-led expansion from revenue that depends on contractual enforcement or one-time true-ups.
    diligencePath: Request ARR waterfall, renewal cohorts, and expansion attribution by plan and customer size.
    relatedQuestionRefs:
    - QR028
  - type: private-evidence-only
    severity: blocking
    topic: customer-and-channel-concentration
    missingEvidence: Top-customer, top-vertical, and channel concentration plus dependency on Databricks or specific regulated sectors.
    whyItMatters: Concentration risk can materially change the underwriting of a premium multiple even when aggregate ARR looks healthy.
    diligencePath: Request customer concentration schedule, regulated-vertical mix, and channel-sourced pipeline / ARR metrics.
    relatedQuestionRefs:
    - QR029
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics-and-support-burden
    missingEvidence: Gross margin, hosting cost, secure-mirroring cost, premium-support load, and professional-services intensity by plan and deployment model.
    whyItMatters: Without unit economics, it is impossible to know whether governance-heavy Custom revenue expands value or simply adds delivery burden.
    diligencePath: Request gross-margin bridge, support staffing ratios, and cost-to-serve analysis for Business versus Custom / on-prem accounts.
    relatedQuestionRefs:
    - QR030
