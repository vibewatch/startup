  evidenceGaps:
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: Public board roster, committee structure, and investor governance rights.
      whyItMatters: Leadership is visible, but governance and control dynamics remain opaque for a private company at Series C stage.
      diligencePath: Request board materials, investor rights agreements, and current cap-table governance summary from management.
      relatedQuestionRefs: [QO007]
      relatedTableRefs: [TO002, TO003]
    - type: conflicting-data
      severity: material
      topic: total-raised
      missingEvidence: A definitive company-issued lifetime funding history that reconciles Tracxn's $210M total with TipRanks' visible $150M summary.
      whyItMatters: Total capital raised is a cover metric and affects dilution, runway interpretation, and historical funding efficiency analysis.
      diligencePath: Obtain management cap-table history or an authoritative database export that includes every primary, secondary, debt, and grant event.
      relatedQuestionRefs: [QO012, QO014]
      relatedTableRefs: [TO001, TO003]
    - type: private-evidence-only
      severity: material
      topic: monetization-metrics
      missingEvidence: Paying-customer count, gross margin, NRR, and a revenue bridge beyond the company-stated ARR point estimate.
      whyItMatters: Installed-base claims do not reveal conversion efficiency, quality of revenue, or resilience of enterprise economics.
      diligencePath: Request customer-count, retention, and margin dashboards or audited board materials under NDA.
      relatedQuestionRefs: [QO013, QO017]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: minor
      topic: locations
      missingEvidence: Exact office count and geographic workforce distribution beyond Austin headquarters.
      whyItMatters: Location footprint matters for hiring concentration, go-to-market coverage, and operational resilience, but is not currently public.
      diligencePath: Request office list, remote-work mix, and employee-by-geo breakdown from HR or facilities.
      relatedQuestionRefs: [QO022]
      relatedTableRefs: [TO001]
    - type: enumeration-incomplete
      severity: minor
      topic: milestone-table
      missingEvidence: Exact dates and any omitted internal milestones for partnership rollout, pricing-policy implementation, and other non-press events not visible in the public record.
      whyItMatters: The chronology is sufficient to ship, but some milestone rows remain month-level or reconstructed from secondary evidence rather than complete internal reporting.
      diligencePath: Request the internal corporate timeline or board chronology used for financing, partnership, and litigation tracking.
      relatedQuestionRefs: [QO021]
      relatedTableRefs: [TO004]
