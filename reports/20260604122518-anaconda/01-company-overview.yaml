callouts:
  - calloutType: strength
    title: Installed base plus profitable ARR creates real platform leverage
    body: >-
      Anaconda is unusual among OSS-adjacent AI infrastructure companies in publicly claiming both a
      massive distribution footprint and profitability with more than $150M of ARR. That combination
      suggests it is not merely popular with developers; it has already translated part of that reach
      into enterprise revenue and now has capital to extend the platform further.
    claimRefs: [CO006, CO007, CO019, CO020]
  - calloutType: risk
    title: Commercialization friction remains the clearest public red flag
    body: >-
      The visible downside of Anaconda's strategy is that monetizing a beloved open-source entry point
      can alienate parts of the community. Licensing enforcement against larger organizations and the
      Intel litigation both show that the company is willing to use pricing and IP controls more
      aggressively, which can create reputational drag even if enterprise economics improve.
    claimRefs: [CO005, CO037, CO038, CO039, CO043]
