slug: anaconda
runDate: '2026-06-04'
company:
  name: Anaconda
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Anaconda is an Austin-based private Series C company founded in 2012 that has expanded from the
    best-known Python distribution into a governed enterprise AI platform. Official July 2025 funding
    materials said the company raised more than $150M, was profitable with over $150M of ARR, and
    served 50M users with 21B downloads, while third-party databases put post-money valuation around
    $1.5B and lifetime funding near $210M. Leadership turned over in late 2025 with David DeSanto
    replacing prior CEO Barry Libert, and the April 2026 acquisition of Outerbounds pushed Anaconda
    further toward end-to-end AI-native development.
sections:
  - id: identity-and-business-model
    title: Identity, product, and business model
    body: >-
      Anaconda was founded in 2012 by Peter Wang and Travis Oliphant, and current company materials
      position it as the trusted foundation for AI-native development. Official financing and
      leadership materials consistently place the company in Austin, Texas, while Tracxn classifies
      it as a private Series C company. The company’s product footprint has broadened materially from
      the historic Anaconda Distribution into a wider platform stack that includes package and
      environment management through Conda, the Anaconda Platform for secure and governed enterprise
      AI development, and cloud or self-hosted deployment options. That expansion matters because the
      business model is no longer just about free downloads: Anaconda monetizes repository access,
      governance, security, and deployment controls for organizations that need enterprise-grade open
      source management. Its own licensing pages make that monetization explicit by requiring paid
      business licensing for organizations above the 200 employee or contractor threshold unless they
      qualify for an exception. Scale signals remain mostly company-claimed but are substantial: the
      company says it has more than 50 million users, over 21 billion downloads, more than 10,000
      large-enterprise users, and penetration into 95% of the Fortune 500. Those metrics support the
      view that Anaconda already has global distribution gravity, even if the public materials do not
      convert that reach into a disclosed paying-customer figure.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO009, CO042]
    figureRefs: [FO002]
  - id: leadership-and-governance
    title: Founders, leadership, and governance
    body: >-
      The current executive bench is clearly disclosed even though the full board is not. Anaconda’s
      leadership pages list David DeSanto as chief executive officer, Jane Kim as co-president and
      chief commercial officer, Laura Sellers as co-president and chief product and technology
      officer, Peter Wang as chief AI and innovation officer and co-founder, Vanessa Macllwaine as
      chief people officer, and Megan Niedermeyer as chief legal officer. The major leadership change
      is the October 2025 appointment of DeSanto, a former GitLab chief product officer, as CEO and
      member of the board. That change appears material because a February 2024 IBM collaboration
      announcement still quoted Barry Libert as chief executive, implying a deliberate shift from an
      earlier leadership era into a more enterprise-software operating posture. Governance visibility
      is thinner than leadership visibility: official company sources name George Mathew of Insight
      Partners as a board director and confirm that DeSanto joined the board, but they do not publish
      a full roster of directors, committee structure, or investor control rights. Peter Wang remains
      a meaningful key-person dependency because he is both co-founder and the public face of the
      company’s product and open-source positioning, while DeSanto and the expanded executive team are
      now responsible for commercial execution, product scale, and legal/governance discipline.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015, CO016, CO017, CO018, CO046]
    tableRefs: [TO002]
  - id: funding-investors-and-scale
    title: Funding history, investors, and public scale metrics
    body: >-
      Anaconda’s July 2025 Series C is the anchor financing event for the current company profile.
      Official company, investor, and Business Wire materials all say the company raised more than
      $150 million led by Insight Partners with participation from Mubadala Capital, and that the
      business was profitable with more than $150 million in ARR as of July 2025. Third-party
      coverage from CRN, Economic Times, and Tracxn adds the market-value overlay that the raise was
      completed at roughly a $1.5 billion valuation. The wider funding history is less crisp. Tracxn
      reports about $210 million raised across 16 rounds, including a $24 million Series A led by
      General Catalyst and BuildGroup in 2015, a 2015 venture-debt round from SVB, and a 2021 Series
      B that included Snowflake. TipRanks, by contrast, only surfaces the latest $150 million round in
      its visible summary, so lifetime funding should be treated as database-derived rather than
      company-disclosed. The company also said the Series C would fund new AI features, acquisitions,
      and global expansion while providing liquidity options for current and former employees, but the
      exact secondary component is not public. Scale metrics are directionally strong but still mixed
      in quality: users, downloads, enterprise penetration, and ARR are company claims, valuation is a
      third-party report, and headcount is only externally estimated at roughly 571 to 576 employees
      in spring 2026. Public materials do not disclose paying-customer count, gross margin, net
      retention, or office footprint beyond Austin.
    claimRefs: [CO019, CO020, CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO035, CO036, CO047]
    tableRefs: [TO001, TO003]
    figureRefs: [FO003]
  - id: milestones-partnerships-and-adverse
    title: Milestones, partnerships, and adverse developments
    body: >-
      The milestone record shows a company widening from distribution into governed enterprise AI.
      Tracxn records early funding in 2013 and 2015, but the more strategic inflections are the public
      operating milestones from 2024 onward. In February 2024, Anaconda expanded its IBM watsonx.ai
      collaboration, bringing its repository and security controls into enterprise generative AI
      workflows. In 2024 the company also entered a visible adverse period around licensing and IP:
      CDOTrends reported backlash from academic and nonprofit users after Anaconda tightened and
      enforced licensing terms for larger organizations, and CourtListener shows Anaconda filing a
      copyright infringement complaint against Intel in August 2024. On the product side, May 2025
      brought the launch of the Anaconda AI Platform, which repositioned the company from package
      management toward a unified open-source AI platform with governance and deployment controls. By
      mid-2025, company materials also referenced a Databricks partnership, extending channel and
      workflow reach into a major enterprise data platform. The July 2025 Series C financed that
      expansion, and the October 2025 CEO transition put a public-company software operator in charge.
      The April 2026 acquisition of Outerbounds then added Metaflow-based orchestration and
      experiment-management capabilities, pushing Anaconda closer to an end-to-end AI-native
      development stack. As of the run date, the Intel litigation remained unresolved but stayed,
      with settlement status reports continuing in 2026; no reviewed source surfaced layoffs or public
      regulatory sanctions.
    claimRefs: [CO028, CO029, CO030, CO031, CO032, CO033, CO034, CO037, CO038, CO039, CO040, CO041, CO044, CO045, CO048]
    tableRefs: [TO004]
    figureRefs: [FO001]
