callouts:
  - calloutType: strength
    title: "Governed Python remains a real enterprise wedge"
    body: "Even though the broad TAM is fuzzy, the combination of large-enterprise demand, on-prem governance needs, Python workflow persistence, and rising package-security pressure supports a durable niche for curated repositories and controlled workbench tooling."
    claimRefs: [CM012, CM013, CM017, CM034, CM037]
  - calloutType: risk
    title: "Popularity does not automatically translate into paid SOM"
    body: "Anaconda's biggest risk in market analysis is confusing Python usage with monetizable platform spend. Free notebooks, bundled cloud suites, and repository alternatives mean the company must prove differentiated governance and trust rather than assume broad developer adoption converts into enterprise revenue."
    claimRefs: [CM022, CM029, CM035, CM036, CM039, CM040]

