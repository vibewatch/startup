      - number: '1.3'
        title: Financing history, expansion milestones, and open risks
        blocks:
          - type: paragraph
            body: >-
              The latest disclosed financing in the assigned evidence is a $100 million Series D reported in April 2022
              at a $2.6 billion valuation. That is a historical transaction mark, not evidence of a current valuation or
              cash balance. Total capital raised, secondaries, debt facilities, runway, and acquisition consideration
              remain unavailable. Subsequent expansion has relied visibly on acquisitions: Oz Forensics and Trully.AI
              were announced in 2024, OwnID's passkey business supported U.S. entry in 2025, and a later account
              described ten acquisitions since founding.

              The acquisition program broadens liveness, anti-spoofing, passkey, and geographic capabilities, but
              undisclosed purchase prices and integration costs prevent an assessment of capital efficiency. Adverse
              evidence is also limited but not absent: Biometric Update's company page lists a June 2026 dispute in
              which Unico accused an Experian subsidiary of “freeloading” face-biometric verifications. The assigned
              source does not disclose the pleadings, forum, remedy sought, or financial exposure. This event should
              therefore be treated as a live diligence item rather than as a resolved liability or proof of wrongdoing
              by either party.
