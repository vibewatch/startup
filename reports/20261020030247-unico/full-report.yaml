              - CO013
      - number: '1.2'
        title: Leadership, governance, and key-person exposure
        blocks:
          - type: paragraph
            body: >-
              Founder Diego Martins was still identified as chief executive and the public voice of the 2026 global
              expansion. The founding group also included Rui Jordao and Paulo Alencastro, but the assigned sources do
              not establish their current operating or governance roles. In support of international expansion, Unico
              recruited leaders with backgrounds at Google, Meta, Apple, P&G, Hotmart, EBANX, and EY. This roster
              signals an effort to add deepfake, design, commercialization, and finance expertise, yet the available
              reporting does not consistently state exact current titles, reporting lines, tenure, equity, or decision
              rights.

              Governance visibility is similarly incomplete. Goldman Sachs led the 2022 Series D and was reported to
              receive a board seat, while SoftBank and General Atlantic participated as existing investors. No assigned
              source provides a complete current board roster, ownership table, voting arrangement, founder stake, or
              post-acquisition integration structure. The founder-CEO's central role in strategy and external messaging
              therefore creates plausible key-person exposure, but the degree of control cannot be quantified without
              primary corporate records.
            claimRefs:
              - CO001
              - CO009
              - CO012
