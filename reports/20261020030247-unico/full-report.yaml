      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The strongest evidenced buyer concentrations are banks, large retailers, betting operators, and other
              enterprises exposed to remote onboarding and transaction fraud. Consumers are the verified users, but the
              enterprise typically pays through fraud, risk, compliance, payments, security, or trust-and-safety
              budgets. Adoption starts with a high-loss or regulated workflow, integrates identity decisions into an
              existing transaction path, and can expand into repeat authentication and adjacent fraud controls. Brazil's
              high bank-account penetration and Pix usage lower the digital-access barrier, but they do not establish
              enterprise willingness to pay or Unico's obtainable share.
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
              - CM011
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM005
              - CM007
              - CM008
              - CM013
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints, and timing
        blocks:
          - type: paragraph
            body: >-
              Company-reported first-quarter 2026 indicators point to demand momentum: identity verification volume
              increased 84% year over year, international revenue increased 130%, and Mexico transaction volume
              increased 204% quarter over quarter. These are Unico metrics, not independent market-growth estimates.
              Structural drivers include AI-enabled impersonation, dense digital-payment usage, cross-border expansion,
              and new age-assurance obligations. Constraints are equally material: sensitive biometric data requires
              strong privacy controls and high availability, fraud persists even on mature rails, regulation remains in
              implementation, and integrations create switching costs. Adoption should therefore be modeled workflow by
              workflow, not as an immediate conversion of the broad category forecast.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: International activity is the clearest current demand signal
            body: >-
              Unico reported 84% year-over-year verification-volume growth, 130% international revenue growth, and 204%
              quarter-over-quarter Mexico transaction growth in the first quarter of 2026. These indicators support
              product demand but do not independently measure category growth.
            calloutType: strength
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: callout
            title: The public market-size bridge is incomplete
            body: >-
              The available category forecast, population adoption, business participation, identities, clients, and
              transaction counts have incompatible denominators. A valuation model should not turn them into revenue
              opportunity without pricing, eligible-workload, conversion, and retention evidence.
            calloutType: risk
            claimRefs:
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer choice
        blocks:
          - type: paragraph
            body: >-
              The buyer landscape is wider than a list of biometric startups. Unico competes directly with Brazilian
              identity-verification vendors, with Serasa Experian's expanding authentication and fraud portfolio, and
              indirectly with internal bank builds and legacy document-review workflows. Unico's official surface spans
              onboarding, non-document checks, fraud-risk detection, multi-account prevention, continuous
              authentication, age verification, data verification, and card-not-present verification. That breadth is
              reinforced by reported transaction scale, but the evidence is asymmetric: public competitor detail is
              concentrated on Serasa's acquisitions, while Certta and internal-build economics remain thin. Accordingly,
              the profile table treats internal build and manual review as required buyer alternatives rather than
              pretending they are directly comparable vendors.
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP015
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP009
              - CP010
              - CP015
              - CP016
      - number: '3.2'
        title: Capability breadth and distribution power
        blocks:
          - type: paragraph
            body: >-
              Unico's strongest observable position is the combination of a broad workflow surface, high reported
              verification volume, and acquired specialist capabilities. Google Cloud's partner case says the platform
              processes 1.5 billion identity verifications annually, while independent reporting ties Oz Forensics and
              Trully to liveness, anti-spoofing, and regional expansion and ties OwnID to passkey authentication. The
              same evidence also shows that some operating advantage comes from cloud and data-platform execution:
              Google says a migration reallocated half of maintenance resources. Serasa's potential advantage is
              different—distribution and portfolio assembly through idwall and ClearSale. The positioning map therefore
              uses explicit ordinal scores, not market-share estimates, and marks internal-build and status-quo
              coordinates as provisional where evidence is absent.
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP008
              - CP009
              - CP010
              - CP012
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP011
              - CP013
              - CP015
              - CP016
      - number: '3.3'
        title: Pricing, switching, and lock-in
        blocks:
          - type: paragraph
            body: >-
              No retained source provides comparable public list prices, unit prices, or contract terms across Unico,
              Serasa/idwall, ClearSale, and Certta. The clearest pricing signal is adverse rather than contractual:
              Pipeline reported that customers told Unico they had begun testing Serasa after its product quality
              improved and it offered much lower prices. That does not establish realized price levels or durable churn,
              but it shows that buyers can at least trial an alternative and that price can overcome perceived quality
              gaps. Conversely, Unico's network scale and sensitive-data infrastructure may raise operational switching
              costs. Neither effect is quantified, so procurement files, cohort retention, multi-homing rates,
              implementation effort, and renewal discounting remain necessary to distinguish true lock-in from incumbent
              inertia.
            claimRefs:
              - CP004
              - CP006
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP014
              - CP015
      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The moat is plausible but contested. Product expansion into age verification, liveness, passkeys, and
              orchestration makes Unico harder to replace with a single point solution, and international transaction
              and revenue growth suggest the platform can travel beyond Brazil. Yet those advantages are not protected
              by a disclosed independent benchmark of accuracy, bias, false accepts, false rejects, or total cost.
              Pipeline also reported Unico's allegation that Serasa, ClearSale, and an intermediary improperly used its
              biometric system; the same article records Serasa's categorical denial. The dispute may indicate valuable
              proprietary data and network effects, but it also exposes governance, channel-control, and evidentiary
              risk. Until the litigation and technical benchmarking are resolved, scale should be treated as a lead—not
              proof of an unassailable moat.
            claimRefs:
              - CP003
              - CP007
              - CP008
              - CP009
              - CP010
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale plus breadth is the clearest competitive edge
            body: >-
              The retained evidence combines 1.5 billion annual verifications with a product surface extending from
              onboarding through continuous authentication, age checks, liveness, and passkeys; no peer in this source
              set has comparable disclosed breadth and scale.
            calloutType: strength
            claimRefs:
              - CP001
              - CP004
              - CP009
              - CP010
          - type: callout
            title: Distribution and price pressure can erode the lead
            body: >-
              Serasa's acquisition strategy and reported lower-price offers show a credible route to buyer trials, while
              the disputed data-access allegations make channel control and defensibility harder to underwrite.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization visibility
        blocks:
          - type: paragraph
            body: >-
              Public materials position IDCloud and IDPay as self-operated identity and payment-authentication products,
              with verification, liveness, fraud detection, and orchestration forming the delivered service. This
              supports an enterprise platform model whose economic activity is tied to identity and payment workflows,
              but the retained evidence does not disclose whether contracts are priced per verification, by volume tier,
              by platform subscription, by outcome, or through a blended structure. It also does not disclose contract
              duration, minimum commitments, discounts, revenue recognition, or revenue mix. Public transaction counts
              are therefore operating-scale indicators, not revenue, ARR, or a basis for estimating realized price.
            claimRefs:
              - CI002
              - CI003
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI002
              - CI003
              - CI006
              - CI016
