chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and operating scale
        blocks:
          - type: paragraph
            body: >-
              Unico began in Brazil in 2007 as Acesso Digital and evolved from document digitization into biometric
              identity verification and cloud-based fraud orchestration. The company opened a global headquarters in
              Menlo Park in 2026, but reporting based on an interview with its engineering leadership says the main
              software-development organization remains in Brazil. This creates a two-center operating model: commercial
              and executive expansion is increasingly U.S.-oriented, while core engineering capability remains
              concentrated in the original market.

              The strongest current scale disclosures are company-issued rather than audited. Unico says it performs
              more than 1.2 billion identity checks annually, serves more than 400 companies, and operates in more than
              20 countries. A Google Cloud customer case study instead states 1.5 billion annual identity verifications
              and 170 million identities secured. The difference may reflect timing, scope, or metric definition, but
              neither source provides a reconciliation. Revenue, recurring revenue, customer concentration, and
              headcount are not disclosed in the assigned evidence, so these should not be inferred from transaction
              volume or identity counts.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO013
