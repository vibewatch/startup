              - CI007
              - CI008
              - CI016
      - number: '4.2'
        title: Traction signals do not reconcile to revenue quality
        blocks:
          - type: paragraph
            body: >-
              Unico's current website reports more than 150 million transactions processed per month, more than 1.2
              billion authentications in the prior year, and more than 170 million unique faces across more than 21
              countries. An independent industry listing also reports 84% year-over-year identity-verification volume
              growth in the first quarter of 2026, while an analyst index states that IDCloud had more than 400
              enterprise clients in 2025. Those signals indicate meaningful activity and enterprise adoption, but the
              public figures use different periods and labels. Google Cloud's 1.5 billion annual-verification figure and
              Unico's separate annual and monthly figures cannot be reconciled into precise growth, retention, or
              monetization without definitions for billable events, duplicates, product mix, and reporting windows.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI009
              - CI010
              - CI011
      - number: '4.3'
        title: Cost leverage is visible only through a narrow infrastructure proxy
        blocks:
          - type: paragraph
            body: >-
              The strongest public cost signal is a Google Cloud case study stating that Unico reduced platform
              maintenance resources by 50% and reallocated half of engineering capacity from maintenance to strategic
              work after migrating data workloads. That is evidence of infrastructure operating leverage, not evidence
              of company-wide gross margin, cloud cost per verification, or cash savings. At the same time, Unico's
              global-headquarters move and acquisitions in Mexico, the UAE, and the United States indicate continued
              expansion demands. The purchase prices for Oz Forensics and Trully.AI were not disclosed, so neither
              acquisition cash use nor integration costs can be quantified. Current cash, debt, burn, runway, capex, and
              working-capital requirements remain absent.
            claimRefs:
              - CI008
              - CI012
              - CI013
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI012
              - CI013
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a business with large transaction activity, enterprise adoption, and at least one
              concrete engineering-efficiency improvement, but it does not establish revenue quality or self-funded
              expansion. A reported Brazilian identity-verification transaction for idwall at about five times revenue
              is useful only as an unconfirmed peer-market reference, not a current Unico valuation or pricing multiple.
              Serpro's reported biometric infrastructure also shows that a government-backed substitute can operate at
              very large scale and serve public and private clients, creating potential distribution and pricing
              pressure. Underwriting should remain conditional on audited financials, cohort economics, contract data,
              and a sources-and-uses bridge for acquisitions and international expansion.
            claimRefs:
              - CI001
              - CI006
              - CI008
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is not a substitute for financial disclosure
            body: >-
              Public volume, client, and infrastructure-efficiency signals are encouraging, but they cannot establish
              realized pricing, recurring revenue, gross margin, burn, or runway. Large-scale public biometric
              infrastructure also creates a credible substitution and pricing-pressure risk.
            calloutType: risk
            claimRefs:
              - CI003
              - CI006
              - CI008
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflows
        blocks:
          - type: paragraph
            body: >-
              Unico's clearest product proof is tied to specific transaction workflows rather than a generic identity
              platform. IDPay scans a buyer's face, links the identity to the taxpayer identifier used in the purchase
              and asks the card issuer to confirm ownership; Fast Company reported more than $400 million of recovered
              purchases and approval rates above 90% for Banco Neon cards, although the article does not disclose
              observation windows or transaction denominators. The wider portfolio includes Check for biometric
              authentication, IDCloud for identity and fraud orchestration, OwnID for passwordless login, and acquired
              liveness, anti-spoofing and regional verification capabilities. Public evidence therefore supports a
              multi-product workflow suite, but not a uniform maturity level across every module.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE008
              - CE010
              - CE014
          - type: table
            tableRef: TE001
