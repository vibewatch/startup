              - CE013
              - CE015
              - CE016
      - number: '5.2'
        title: Operating architecture and deployment maturity
        blocks:
          - type: paragraph
            body: >-
              The most concrete architecture disclosure comes from Google Cloud, whose supplier case study says Unico
              moved analytical workloads from Databricks to BigQuery while using Cloud Spanner for transactional
              identity checks, Datastream for change-data capture and Dataform for governance and CI/CD. The same case
              study reports 1.5 billion identity verifications annually and a reallocation of 50% of engineering
              capacity from maintenance to capability building; those are supplier-published customer results, not
              independently audited benchmarks. This design suggests separation between high-availability transactional
              checks and analytical/modeling workloads, but the public record does not expose service-level objectives,
              failover tests, regional data-residency choices or a complete integration contract.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE010
              - CE012
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE007
              - CE008
              - CE010
              - CE012
              - CE013
      - number: '5.3'
        title: Build-versus-buy expansion and differentiation
        blocks:
          - type: paragraph
            body: >-
              Unico's differentiation is partly native network scale and partly acquired capability. Specialist
              reporting says Oz Forensics software had already been incorporated before its acquisition and identifies
              proprietary technology as the rationale, while the Trully.AI purchase added a Mexico-focused verification
              footprint. The later OwnID acquisition added passkeys, biometric login, magic links and login analytics;
              CTech reported approximately 3.5 million OwnID verifications per month at acquisition. This sequence can
              accelerate breadth across onboarding, transaction authentication and account access, but it also creates
              integration risk: the assigned evidence does not show common APIs, shared policy engines, migration
              completion, release cadence or whether acquired models have been normalized to one quality standard.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.4'
        title: Trust controls, regulatory exposure and technical verdict
        blocks:
          - type: paragraph
            body: >-
              Public control evidence is meaningful but incomplete. Google Cloud describes policy tags, granular access
              controls and governance tooling around sensitive facial-biometry and identity-document data. Separately,
              Brazil's ANPD is developing age-assurance guidance that specifically addresses facial estimation and
              document verification, making privacy, proportionality and child-protection implementation a moving
              product requirement rather than a static compliance badge. Biometric Update's company feed records 2026
              product activity around age verification, AI-management certification and authentication orchestration,
              but headlines do not establish certification scope or production effectiveness. The technical verdict is
              therefore cautiously positive on breadth and disclosed scale, while model accuracy, demographic bias,
              spoof resistance, incident history, uptime and developer adoption remain material evidence gaps.
            claimRefs:
              - CE013
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is disclosed more clearly than model quality
            body: >-
              Public sources provide transaction-scale and workflow metrics, but the assigned evidence does not provide
              independent false-accept, false-reject, demographic-bias or spoof-resistance benchmarks for the models
              that underpin those workflows.
            calloutType: risk
            claimRefs:
              - CE011
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base, buyers, and use cases
        blocks:
          - type: paragraph
            body: >-
              Unico's clearest customer evidence is segment-level rather than account-level. Its newsroom says the
              platform serves nine of Brazil's ten largest retailers, four of the five largest banks, and eight of the
              ten largest betting companies. These are meaningful enterprise-penetration claims across fraud-sensitive
              verticals, but they remain company-issued and omit customer names, contract scope, production status, and
              revenue contribution. The operating buyer is therefore best characterized as a regulated or
              high-transaction enterprise, with fraud, risk, payments, and digital-channel teams as likely users rather
              than a single horizontal software persona. A 2025 profile also reported more than 400 enterprise clients
              on IDCloud, but its methodology and definition of an active client are not disclosed. Public evidence
              supports a broad enterprise footprint; it does not support a precise active-customer count or payer mix.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU012
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU012
              - CU015
      - number: '6.2'
        title: Adoption trajectory and expansion motion
        blocks:
          - type: paragraph
            body: >-
              Reported usage has expanded materially, although the available metrics are not a clean cohort because
              definitions and periods differ. Two 2022 reports put volume at about 25 million identity-authentication
              transactions per month. Veja later reported more than 608 million transactions in a year and a management
              expectation of 1.8 billion by year-end. Unico's current newsroom states approximately one billion
              authentications per year, while Google Cloud's case study states 1.5 billion identity verifications
              annually across 170 million identities. The direction is consistent with higher usage, but authentication,
              verification, and processed-transaction measures should not be treated as identical. Management describes
              the expansion loop as moving from onboarding into repeated transaction validation, which increases usage
              frequency inside existing financial accounts. Acquired customer bases can add geographic reach, but do not
              establish retention after integration.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU005
              - CU010
              - CU013
              - CU014
              - CU015
      - number: '6.3'
        title: Customer proof, durability, and concentration
        blocks:
          - type: paragraph
            body: >-
              The retained evidence is strong on aggregate scale and weak on account-level durability. Google Cloud
              reports that Unico prevented an estimated US$5 billion in potential fraud in 2025, while Unico reports
              R$3.2 billion in fraud prevented or no longer lost in 2024. These outcomes use different currencies,
              periods, and attribution methods, so they should remain separate rather than be combined into a trend. No
              retained source supplies a named Unico end customer with contract dates, production scope, independently
              measured outcomes, NRR, GRR, churn, renewal rates, contract length, or top-customer revenue share. The
              official penetration ratios could indicate category leadership, but they may also imply concentration in a
              finite set of large Brazilian accounts. A 2026 legal-dispute headline involving an Experian subsidiary
              adds diligence relevance because unresolved IP or verification disputes can affect enterprise procurement,
              but the profile excerpt does not establish customer loss or deployment failure.
            claimRefs:
              - CU010
              - CU011
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Durability remains the central customer diligence gap
            body: >-
              Aggregate usage and cohort penetration do not substitute for NRR, GRR, churn, contract duration, named
              production references, or top-customer revenue share. Investment underwriting should treat durability and
              concentration as unverified until customer-level data are supplied.
            calloutType: risk
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Public reporting describes civil and criminal proceedings under seal arising from Unico's allegations
              against Serasa Experian, including a reported search and seizure. The underlying court record is not
              available in the assigned evidence, so neither liability nor the eventual remedy can be established. The
              reported scale is material but still allegation-stage: a plaintiff-hired expert allegedly identified at
              least 1.4 million irregular transactions, while Unico estimated that queries could involve as many as 22
              million Brazilians. Serasa denied the allegations and said the secrecy of the proceeding had prevented it
              from seeing the details. This combination creates high residual legal, privacy, competitive, and
              reputational exposure until docket documents, regulator correspondence, and independently validated
              forensic findings are reviewed. Expansion across more than 20 countries compounds the compliance burden,
              but the public pool does not establish jurisdiction-by-jurisdiction licensing or privacy status.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
      - number: '7.2'
        title: Operational, security, and model risk
        blocks:
          - type: paragraph
            body: >-
              Unico handles sensitive facial-biometric and identity-document data at large scale, making segregation,
              authorization, availability, and auditability core controls rather than back-office concerns. Reporting on
              the Serasa dispute alleges that access intended exclusively for Banco do Brasil may have been used through
              an intermediary for other traffic; this is unproven, but it identifies the control boundary that diligence
              must test. Google Cloud's case study documents BigQuery as the analytical core and Cloud Spanner for
              highly available transaction checks, which provides evidence of architecture and privacy controls while
              also revealing concentration in one cloud ecosystem. Public scale figures are not directly comparable:
              Unico says approximately one billion authentications per year, the World Economic Forum profile says more
              than three billion, and Google reports 1.5 billion identity verifications. Different issuers, metric
              names, and likely periods prevent treating these as one reconciled throughput series.
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.3'
        title: Expansion, integration, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              The current strategy layers international expansion, new leadership, and acquired technology onto a system
              already serving regulated customers. Biometric Update describes a two-year expansion involving
              acquisitions in Mexico, the UAE, and the United States, while its 2024 transaction coverage says the
              purchase prices for Oz Forensics and Trully.AI were undisclosed. Those deals add liveness, anti-spoofing,
              passkey, and regional capabilities, but the assigned evidence does not disclose integration costs,
              consolidated service levels, inherited liabilities, or post-acquisition retention. An independent industry
              profile reports more than 400 enterprise IDCloud clients in 2025, and Unico claims deep penetration among
              large Brazilian banks, retailers, and betting companies; neither source discloses revenue concentration or
              contractual durability. The result is a credible scaling story paired with unresolved customer, partner,
              acquisition, and execution concentration.
            claimRefs:
              - CR007
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR007
              - CR011
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Investment controls and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Risk cannot be underwritten from public evidence alone. A finance leader and senior product, strategy,
              design, and marketing hires are company-reported mitigants for global execution, while Google documents
              privacy tags, granular access controls, observability, and managed availability tooling. Those controls do
              not resolve the sealed litigation, prove model accuracy or demographic performance, establish the absence
              of incidents, or quantify acquisition economics and liquidity. Investment progression should therefore
              require primary legal documents, an independent forensic review of access paths and data segregation,
              audited security and model-quality evidence, customer-concentration schedules, and current cash, debt,
              burn, and working-capital data. Thesis-break events include an injunction or enforcement action that
              restricts biometric processing, inability to reconcile access logs, a material control failure involving
              sensitive data, failure to provide customer-concentration evidence, or financing needs that cannot be
              supported by disclosed liquidity.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR011
              - CR012
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR011
              - CR012
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary investment blocker
            body: >-
              The sealed Serasa matter cannot be sized from public reporting: transaction and affected-person figures
              are allegations, while liability, remedies, reserves, and regulator posture remain unavailable.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Evidence required before underwriting residual risk
            body: >-
              Require primary legal documents, independent access-control forensics, resilience and model-quality
              audits, concentration schedules, and current audited liquidity data before treating the visible
              mitigations as sufficient.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR011
              - CR012
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a track/research-more decision rather than an investable price today. The positive
              case is real operating reach: third-party and partner-hosted sources describe more than 1.5 billion annual
              identity checks, roughly 165 million users, and a reported 84% year-over-year increase in first-quarter
              2026 identity-verification volume. The limiting fact is valuation freshness. The $2.6 billion Series D
              mark dates to April 2022, while later acquisitions disclose no transaction values and the assigned
              evidence supplies no current revenue, ARR, margin, cash, debt, ownership, or preference terms. A high risk
              rating is appropriate because unresolved litigation allegations concern the integrity and economic value
              of biometric infrastructure central to the thesis. Entry discipline should therefore be tied to evidence,
              not to the stale headline valuation.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV008
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and strategic optionality
        blocks:
          - type: paragraph
            body: >-
              The thesis combines network scale, a difficult identity-and-fraud problem, and expansion by acquisition.
              Unico has moved beyond a single domestic product footprint: evidence points to a Silicon Valley
              headquarters, entry into Argentina through Valida, and earlier purchases of Oz Forensics and Trully.AI. A
              Google Cloud case study also reports a 50% reduction in platform-maintenance resources, a useful but
              company-influenced signal that scale may improve engineering leverage. The anti-thesis is equally
              material. Acquisition prices are undisclosed, so investors cannot judge capital allocation; a large user
              or verification count is not revenue or retention; and allegations involving biometric queries create
              legal, competitive, privacy, and reputational uncertainty. The view would improve only with audited
              economics, retention and concentration data, integration reporting, and a verified legal-status update.
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario framework and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              A conventional revenue-multiple valuation is not defensible from the assigned public record because the
              denominator is missing. The nearest private-market reference is the 2022 Series D, while the 2024 and 2026
              acquisitions demonstrate strategic activity but provide no transaction prices and therefore are not
              valuation comparables. Public-company and precedent-transaction multiples are also absent from the
              assigned pool. The scenario framework consequently uses conditional bands around the stale $2.6 billion
              mark rather than invented point estimates. The bull case requires audited growth, durable retention,
              improving unit economics, and clean legal resolution; the base case requires a material price discount or
              investor protections until those facts are verified; the bear case assumes a down-round outcome if
              expansion costs, litigation, or weak monetization offset volume growth. No evidence-based target IRR or
              hold period can be calculated without entry price, ownership, dilution, and exit assumptions.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              International headquarters and repeated acquisitions indicate strategic ambition, but they do not
              establish IPO readiness, buyer interest, or a realizable exit value. Before underwriting, diligence should
              obtain audited 2025-2026 financials, a current capitalization table and preference waterfall, primary
              transaction documents for acquisitions, customer retention and concentration cohorts, and counsel's
              current assessment of the Serasa dispute. The decision can move toward invest only if a current price
              produces the required return after dilution and if operating evidence converts verification growth into
              durable revenue and cash generation. Thesis-break triggers are a down round without compensating
              protections, acquisition-related impairment or cash strain, material customer loss, adverse legal
              findings, or evidence that biometric-data governance weakens customer trust. A credible exit plan must
              identify likely strategic buyers or IPO prerequisites and reconcile them with ownership, preferences, and
              a supportable hold period.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price is the gating variable
            body: >-
              Strong scale evidence does not convert a four-year-old private valuation into a current entry price. Hold
              the company on a watchlist until a current mark and auditable economics support ownership-adjusted return
              underwriting.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV016
          - type: callout
            title: Litigation is not yet an outcome
            body: >-
              Reports describe serious allegations and a proceeding under seal, while Serasa denies the accusation.
              Underwrite a range of outcomes and seek primary documents rather than treating either side's position as
              an adjudicated fact.
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
              - CV015
