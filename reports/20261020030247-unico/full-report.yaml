figures:
  - id: FO001
    title: Unico company and expansion milestones
    type: timeline
    summary: >-
      The company progressed from Brazilian document digitization to biometric identity infrastructure, then accelerated
      international expansion through financing and acquisitions.
    data:
      items:
        - date: '2007'
          label: Founded as Acesso Digital
          detail: Diego Martins, Rui Jordao, and Paulo Alencastro founded the company in Brazil.
          tone: neutral
        - date: '2016'
          label: Pivot to identity verification
          detail: An independent profile dates the launch of biometric authentication product Unico Check to this pivot.
          tone: positive
        - date: '2020'
          label: General Atlantic backing
          detail: >-
            An independent profile records General Atlantic backing as Unico scaled in Brazilian financial and retail
            markets.
          tone: positive
        - date: 2022-04
          label: Series D financing
          detail: Goldman Sachs led a $100 million round reported at a $2.6 billion valuation.
          tone: positive
        - date: '2023'
          label: IDCloud launch
          detail: Unico launched a cloud-native identity-verification and fraud-orchestration platform.
          tone: positive
        - date: 2024-09
          label: Oz Forensics and Trully.AI acquisitions
          detail: Acquisitions expanded deepfake-fraud capability and Unico's Mexican footprint.
          tone: positive
        - date: 2025-09
          label: OwnID passkey acquisition
          detail: The acquired passkey business supported entry into the United States.
          tone: positive
        - date: 2026-04
          label: Menlo Park global headquarters
          detail: Unico opened its new global headquarters as part of a wider international push.
          tone: positive
        - date: 2026-06
          label: Experian-related dispute surfaces
          detail: Biometric Update listed Unico's accusation involving a competitor's use of face-biometric verifications.
          tone: negative
    approximationNotes: >-
      Years and months follow the precision available in the assigned sources; the timeline does not imply that
      undisclosed financing, integration, or legal events did not occur.
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO008
      - CO009
      - CO010
      - CO011
      - CO014
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: A qualitative evidence stack separates broad digital reach from Unico-specific activity and obtainable revenue.
    data:
      items:
        - label: Broad category forecast
          displayValue: More than $50B by 2034
          detail: Global digital-identity projection cited by Unico; methodology not disclosed.
          claimRefs:
            - CM014
        - label: Brazil digital access
          displayValue: 96.4% banked in 2024
          detail: Digital readiness indicator, not an identity-verification spending pool.
          claimRefs:
            - CM011
        - label: Active payment population
          displayValue: 142M Pix users in April 2026
          detail: About 93% of Brazilian adults initiated at least one Pix transaction.
          claimRefs:
            - CM009
        - label: Business transaction surface
          displayValue: 12M Pix-receiving businesses
          detail: Potential workflow surface; not a count of Unico prospects or customers.
          claimRefs:
            - CM010
        - label: Unico network activity
          displayValue: 170M identities; 1.5B annual checks
          detail: Partner and company-reported reach with different denominators.
          claimRefs:
            - CM006
        - label: Current expansion momentum
          displayValue: 84% volume growth; 130% international revenue growth
          detail: First-quarter 2026 company-reported indicators, not category growth rates.
          claimRefs:
            - CM003
            - CM004
            - CM005
        - label: Obtainable revenue
          displayValue: Not publicly derivable
          detail: Pricing, eligible workload, conversion, retention, and segment mix are undisclosed.
          claimRefs:
            - CM016
    approximationNotes: >-
      Layers are ordered from broad context to company-specific evidence and do not use proportional widths. The values
      are non-comparable and do not constitute a numeric TAM-to-SOM conversion.
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM006
      - CM009
      - CM010
      - CM011
      - CM014
      - CM016
  - id: FP001
    title: 'Competitive positioning: capability breadth versus distribution leverage'
    type: quadrant
    summary: >-
      Evidence-backed ordinal positioning highlights Unico's documented breadth and Serasa's distribution-led response
      while preserving major evidence gaps.
    data:
      xAxis:
        label: Documented capability breadth (1 low, 5 high)
        min: 1
        max: 5
      yAxis:
        label: Distribution or embedded-workflow leverage (1 low, 5 high)
        min: 1
        max: 5
      points:
        - label: Unico
          x: 5
          'y': 5
          note: Broad official surface, reported network scale, and acquired specialist capabilities.
        - label: Serasa + idwall
          x: 4
          'y': 5
          note: Identity and fraud portfolio added to an incumbent distribution base; no market-share estimate.
        - label: Serasa + ClearSale
          x: 4
          'y': 5
          note: >-
            Fraud portfolio and bank-facing access are visible, but the disputed-use allegations prevent a clean
            capability conclusion.
        - label: Certta / CAF
          x: 2
          'y': 2
          note: Named regional peer with insufficient retained product and scale evidence.
        - label: Internal build
          x: 3
          'y': 1
          note: Provisional alternative-class coordinate; no retained build-cost or performance benchmark.
        - label: Manual status quo
          x: 1
          'y': 3
          note: Provisional alternative-class coordinate; embedded workflow may persist despite unbenchmarked capability.
    approximationNotes: >-
      Scores are analyst ordinal judgments from 1 to 5, not measured market share, accuracy, or revenue. Internal-build
      and manual-status-quo coordinates are provisional and explicitly tied to evidence gaps.
    claimRefs:
      - CP002
      - CP011
      - CP013
      - CP015
      - CP016
  - id: FI001
    title: Revenue model bridge with unresolved economic links
    type: flow
    summary: >-
      Public evidence supports the operating path from customer activity to identity processing, but not the pricing,
      revenue-recognition, or gross-profit links.
    data:
      nodes:
        - id: customer-activity
          label: Customer onboarding or payment activity
          detail: Enterprise workflows create identity-verification demand.
        - id: identity-event
          label: Identity or payment-authentication event
          detail: Unico reports authentication and transaction volumes, not billable events.
        - id: platform-processing
          label: IDCloud or IDPay processing
          detail: Verification, liveness, fraud detection, and orchestration are delivered.
        - id: risk-outcome
          label: Verification or fraud outcome
          detail: Customer value is reported through conversion and fraud-prevention claims.
        - id: billing-event
          label: Billing event
          detail: Unit, tier, commitment, and discount structure are not publicly disclosed.
        - id: recognized-revenue
          label: Recognized revenue
          detail: Revenue amount, mix, timing, and ARR are unavailable.
        - id: gross-profit
          label: Gross profit
          detail: Gross margin and service-delivery cost per event are unavailable.
      edges:
        - from: customer-activity
          to: identity-event
        - from: identity-event
          to: platform-processing
        - from: platform-processing
          to: risk-outcome
        - from: platform-processing
          to: billing-event
        - from: billing-event
          to: recognized-revenue
        - from: recognized-revenue
          to: gross-profit
    approximationNotes: The sequence is an analytical operating model; it does not estimate prices, revenue, conversion rates, or margins.
    claimRefs:
      - CI002
      - CI003
      - CI007
      - CI008
      - CI016
