  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than all cybersecurity or all digital identity spending. Unico's
              evidenced scope begins where an enterprise must establish that a person is real and entitled to perform a
              digital action: onboarding, recurring authentication, payment authorization, fraud-risk orchestration, and
              age assurance. It includes liveness, anti-spoofing, passkeys, and identity-risk signals when they are sold
              as part of that decision. It excludes payment-rail economics, general data infrastructure, and unrelated
              document-management spend. Status-quo substitutes include manual review, document-only checks, one-time
              KYC, passwords, and internal fraud rules; the evidence pool does not quantify their spend or displacement
              rate.
            claimRefs:
              - CM001
              - CM007
              - CM013
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM007
              - CM013
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The available figures are useful demand markers but are not interchangeable market sizes. A reported
              projection above $50 billion by 2034 describes a broad global digital-identity category without a
              disclosed methodology. Brazil's 142 million active Pix users and 12 million business recipients show a
              large digital-transaction surface, while Unico's 170 million identities, more than 400 enterprise clients,
              and 1.5 billion annual checks describe company reach or workload. None supplies price, eligible workload,
              win rate, or addressable spend. Accordingly, the analysis does not convert users, businesses, identities,
              or transactions into revenue TAM, SAM, or SOM.
            claimRefs:
              - CM002
              - CM006
              - CM009
              - CM010
              - CM011
              - CM014
              - CM016
