  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "competitor-pricing"
      missingEvidence: "Comparable price lists, enterprise proposals, unit definitions, discounts, minimum commitments, and realized contract values for Unico and named competitors."
      whyItMatters: "Without comparable pricing, the reported lower-price pressure cannot be translated into win-rate, margin, or displacement risk."
      diligencePath: "Obtain recent competitive procurement files and normalize quotes by verification type, volume tier, SLA, geography, and contract term."
      relatedQuestionRefs: [QP004]
      relatedTableRefs: [TP003]
    - type: "missing-source"
      severity: "material"
      topic: "internal-build-benchmark"
      missingEvidence: "Independent build-versus-buy benchmarks for bank identity systems, including engineering cost, model performance, integration time, and governance burden."
      whyItMatters: "Internal build may cap vendor pricing and weaken lock-in, but the retained sources do not quantify that substitute."
      diligencePath: "Interview bank identity leaders and review architecture, staffing, implementation, and total-cost data for at least three internal deployments."
      relatedQuestionRefs: [QP009]
    - type: "missing-source"
      severity: "material"
      topic: "independent-performance"
      missingEvidence: "Independent, like-for-like testing of false accepts, false rejects, demographic bias, spoof resilience, latency, uptime, and privacy controls across Unico and competitors."
      whyItMatters: "Vendor claims and product breadth do not establish superior trust or performance."
      diligencePath: "Commission a controlled benchmark using the same attack set, demographic cohorts, devices, thresholds, and operating conditions."
      relatedQuestionRefs: [QP008, QP010]
    - type: "conflicting-data"
      severity: "material"
      topic: "serasa-litigation"
      missingEvidence: "Public court records, forensic reports, transaction-level methodology, procedural status, and an adjudicated resolution of the Unico-Serasa allegations."
      whyItMatters: "The dispute could indicate a defensible data advantage, a channel-control weakness, or neither; the current public record contains allegation and denial."
      diligencePath: "Obtain authorized pleadings and expert reports, then validate chain of custody and alleged query attribution with independent counsel and forensic specialists."
      relatedQuestionRefs: [QP005, QP006, QP010]
