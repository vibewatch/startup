    title: "Competitive landscape and alternative profiles"
    columns:
      - "Alternative"
      - "Category"
      - "Observable scale or capital signal"
      - "Target buyer"
      - "Differentiation"
      - "Evidence limitation"
    rows:
      - ["Unico", "Direct identity and fraud platform", "1.5B annual identity verifications in Google Cloud partner case", "Banks, fintechs, retailers, digital platforms", "Broad onboarding-to-continuous-authentication surface plus acquired liveness and passkeys", "Scale and product performance are not independently benchmarked"]
      - ["Serasa Experian + idwall", "Incumbent/direct platform", "Reported acquisition price approximately R$450M; not confirmed by the companies", "Brazilian enterprises and consumers", "Credit-data distribution plus identity, risk, onboarding, and fraud tools", "CADE approval was pending at publication; standalone product and pricing detail unavailable"]
      - ["Serasa Experian + ClearSale", "Incumbent fraud platform", "Scale not quantified in retained evidence", "Financial institutions and digital commerce", "Fraud portfolio and incumbent distribution", "Competitive-access allegations are disputed and the underlying proceeding is secret"]
      - ["Certta (formerly CAF)", "Direct regional peer", "No scale or funding metric in retained evidence", "Brazilian digital-identity buyers", "Dedicated identity and fraud focus", "Only a market-watch mention was retained"]
      - ["Internal enterprise build", "Substitute", "Unknown", "Large regulated enterprises with data and ML teams", "Control over policy, data, and workflow integration", "No retained cost, accuracy, or time-to-build benchmark"]
      - ["Manual or document-led status quo", "Status-quo substitute", "Unknown", "Organizations with lower digital volume or legacy processes", "Avoids a new vendor contract", "No retained performance or loss-rate comparison"]
    notes: >-
      Partial landscape based only on the assigned source set; acquisition prices,
      company-reported scale, and provisional substitute descriptions are not
      equivalent measures, and unknown fields are not inferred.
    claimRefs: [CP001, CP002, CP004, CP009, CP010, CP015, CP016]
  - id: "TP002"
    title: "Feature and capability evidence matrix"
    columns:
      - "Buying criterion"
      - "Unico"
      - "Serasa/idwall/ClearSale"
      - "Certta"
      - "Internal build"
      - "Manual status quo"
    rows:
      - ["Identity verification and onboarding", "Documented on official product surface", "idwall documented in identity verification and onboarding", "Digital-identity focus reported; detail unknown", "Possible; retained evidence does not benchmark", "Partial; performance unknown"]
      - ["Liveness and deepfake defense", "Documented through Oz Forensics acquisition", "Unknown in retained source set", "Unknown", "Possible; build burden unknown", "No retained evidence"]
      - ["Passkeys/passwordless authentication", "Documented through OwnID passkey acquisition", "Unknown", "Unknown", "Possible; evidence unavailable", "No"]
      - ["Age verification", "Company claims 99.98% adult-confirmation accuracy and 2.5-second processing", "Unknown", "Unknown", "Possible; evidence unavailable", "Manual review possible; accuracy unknown"]
      - ["Fraud orchestration", "IDCloud described as self-operated identity and fraud orchestration", "Serasa says idwall strengthens authentication and fraud prevention", "Unknown", "Custom orchestration possible; cost unknown", "Limited"]
      - ["Network scale", "Google Cloud case states 1.5B identity verifications annually", "Unknown", "Unknown", "Enterprise-local only", "Not a network"]
      - ["Public trust and compliance proof", "Official privacy-by-design claims; current release feed includes ISO 42001", "Unknown in retained source set", "Unknown", "Enterprise-specific controls", "Unknown"]
    notes: >-
      "Documented" means present in the retained source set, not independently
      benchmarked superiority. Unknown cells are intentionally left unsupported;
      Unico accuracy and speed are company claims.
    claimRefs: [CP001, CP004, CP005, CP007, CP008, CP009, CP010, CP012, CP015]
  - id: "TP003"
    title: "Pricing and packaging comparison"
    columns:
      - "Alternative"
      - "Public price or unit"
      - "Observed packaging"
      - "Discount or realization evidence"
      - "Competitive implication"
    rows:
      - ["Unico", "Not disclosed in retained evidence", "Modular sign-up, continuous-authentication, regional, and fraud use cases", "No realized pricing or discount data", "Breadth may support bundling, but price competitiveness is unproven"]
      - ["Serasa/idwall", "Not disclosed in retained evidence", "Authentication, fraud prevention, identity verification, risk, and onboarding", "Pipeline reports much lower pricing was offered to some customers; amount unknown", "Incumbent can use price and portfolio breadth to win trials"]
      - ["Serasa/ClearSale", "Not disclosed in retained evidence", "Fraud and identification portfolio", "No contract evidence", "Portfolio bundling is plausible but unquantified"]
      - ["Certta", "Not disclosed in retained evidence", "Digital identity and fraud focus; package detail unknown", "No evidence", "Cannot compare without procurement data"]
      - ["Internal build", "No benchmark", "Custom workflow and policy controls", "No build-versus-buy model", "May appeal to large banks but implementation economics are unknown"]
      - ["Manual status quo", "No benchmark", "Human or document-led review", "No loss, labor, or abandonment-cost evidence", "Avoids vendor fees but may carry hidden operating and fraud costs"]
    notes: >-
      No apples-to-apples public pricing was retained. The sole directional price
      signal is reported customer feedback in an active, disputed competitive
      context and must not be read as a market quote.
    claimRefs: [CP001, CP014, CP015]
figures:
  - id: "FP001"
    title: "Competitive positioning: capability breadth versus distribution leverage"
    type: "quadrant"
    summary: >-
      Evidence-backed ordinal positioning highlights Unico's documented breadth and
      Serasa's distribution-led response while preserving major evidence gaps.
    data:
      xAxis:
        label: "Documented capability breadth (1 low, 5 high)"
        min: 1
        max: 5
      yAxis:
        label: "Distribution or embedded-workflow leverage (1 low, 5 high)"
        min: 1
        max: 5
      points:
        - label: "Unico"
          x: 5
          y: 5
          note: "Broad official surface, reported network scale, and acquired specialist capabilities."
        - label: "Serasa + idwall"
          x: 4
          y: 5
          note: "Identity and fraud portfolio added to an incumbent distribution base; no market-share estimate."
        - label: "Serasa + ClearSale"
          x: 4
          y: 5
          note: "Fraud portfolio and bank-facing access are visible, but the disputed-use allegations prevent a clean capability conclusion."
        - label: "Certta / CAF"
          x: 2
          y: 2
          note: "Named regional peer with insufficient retained product and scale evidence."
        - label: "Internal build"
          x: 3
          y: 1
          note: "Provisional alternative-class coordinate; no retained build-cost or performance benchmark."
        - label: "Manual status quo"
          x: 1
          y: 3
          note: "Provisional alternative-class coordinate; embedded workflow may persist despite unbenchmarked capability."
    approximationNotes: >-
      Scores are analyst ordinal judgments from 1 to 5, not measured market share,
      accuracy, or revenue. Internal-build and manual-status-quo coordinates are
      provisional and explicitly tied to evidence gaps.
    claimRefs: [CP002, CP011, CP013, CP015, CP016]
callouts:
  - calloutType: "strength"
    title: "Scale plus breadth is the clearest competitive edge"
    body: >-
      The retained evidence combines 1.5 billion annual verifications with a product
      surface extending from onboarding through continuous authentication, age
      checks, liveness, and passkeys; no peer in this source set has comparable
      disclosed breadth and scale.
    claimRefs: [CP001, CP004, CP009, CP010]
  - calloutType: "risk"
    title: "Distribution and price pressure can erode the lead"
    body: >-
      Serasa's acquisition strategy and reported lower-price offers show a credible
      route to buyer trials, while the disputed data-access allegations make channel
      control and defensibility harder to underwrite.
    claimRefs: [CP013, CP014, CP015]
