  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: >-
        Public API documentation, SDK or package activity, release notes, status history and
        practitioner-community evidence tied to Unico integrations.
      whyItMatters: >-
        Without a developer surface, integration effort, release cadence and external technical
        adoption cannot be assessed.
      diligencePath: >-
        Request API and SDK documentation, twelve months of changelog and status history, and
        integration references from customer engineering teams.
      relatedQuestionRefs: [QE009]
      relatedTableRefs: [TE001, TE003]
    - type: private-evidence-only
      severity: material
      topic: biometric-model-quality
      missingEvidence: >-
        Independent false-accept, false-reject, demographic-bias, liveness and spoof-resistance
        benchmarks for current production model versions.
      whyItMatters: >-
        Transaction scale and marketing claims do not establish identity-model quality across
        populations, devices and attack conditions.
      diligencePath: >-
        Obtain third-party lab reports, production cohort metrics by demographic and device, red
        team results, model cards and remediation thresholds.
      relatedQuestionRefs: [QE010]
      relatedTableRefs: [TE001, TE003]
    - type: private-evidence-only
      severity: material
      topic: platform-reliability
      missingEvidence: >-
        Contractual uptime, latency, recovery objectives, incident history, regional failover
        tests and module-level deployment coverage.
      whyItMatters: >-
        Supplier architecture descriptions do not show whether high-volume identity workflows
        meet customer service levels during failures.
      diligencePath: >-
        Review production SLAs, twelve months of incident and latency data, disaster-recovery
        evidence and architecture diagrams for representative deployments.
      relatedTableRefs: [TE002, TE003]
    - type: missing-source
      severity: minor
      topic: certification-scope
      missingEvidence: >-
        The ISO/IEC 42001 certificate, certification body, covered legal entities, product
        boundaries and surveillance-audit dates.
      whyItMatters: >-
        A publication headline establishes reported certification activity but not its scope or
        applicability to every product module.
      diligencePath: >-
        Obtain the certificate and statement of applicability directly from the certification
        body and map its scope to production services.
