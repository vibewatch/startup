schemaVersion: "report-v2"
artifact: product-tech
slug: unico
runDate: 2026-10-20
company:
  name: Unico
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Unico's public product surface spans biometric identity verification, payment-card
    authentication, fraud orchestration, passwordless login, liveness and age assurance.
    Supplier and specialist reporting show a scaled cloud data plane and an acquisition-led
    expansion of capabilities, but independent model-quality, bias, uptime and integration
    evidence remains insufficient for technical underwriting.
sections:
  - id: product-workflows
    title: Product surface and customer workflows
    body: >-
      Unico's clearest product proof is tied to specific transaction workflows rather than a
      generic identity platform. IDPay scans a buyer's face, links the identity to the taxpayer
      identifier used in the purchase and asks the card issuer to confirm ownership; Fast
      Company reported more than $400 million of recovered purchases and approval rates above
      90% for Banco Neon cards, although the article does not disclose observation windows or
      transaction denominators. The wider portfolio includes Check for biometric
      authentication, IDCloud for identity and fraud orchestration, OwnID for passwordless
      login, and acquired liveness, anti-spoofing and regional verification capabilities.
      Public evidence therefore supports a multi-product workflow suite, but not a uniform
      maturity level across every module.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE008, CE010, CE014]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Operating architecture and deployment maturity
    body: >-
      The most concrete architecture disclosure comes from Google Cloud, whose supplier case
      study says Unico moved analytical workloads from Databricks to BigQuery while using Cloud
      Spanner for transactional identity checks, Datastream for change-data capture and
      Dataform for governance and CI/CD. The same case study reports 1.5 billion identity
      verifications annually and a reallocation of 50% of engineering capacity from maintenance
      to capability building; those are supplier-published customer results, not independently
      audited benchmarks. This design suggests separation between high-availability
      transactional checks and analytical/modeling workloads, but the public record does not
      expose service-level objectives, failover tests, regional data-residency choices or a
      complete integration contract.
    claimRefs: [CE010, CE011, CE012, CE013]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: build-buy-differentiation
    title: Build-versus-buy expansion and differentiation
    body: >-
      Unico's differentiation is partly native network scale and partly acquired capability.
      Specialist reporting says Oz Forensics software had already been incorporated before its
      acquisition and identifies proprietary technology as the rationale, while the Trully.AI
      purchase added a Mexico-focused verification footprint. The later OwnID acquisition added
      passkeys, biometric login, magic links and login analytics; CTech reported approximately
      3.5 million OwnID verifications per month at acquisition. This sequence can accelerate
      breadth across onboarding, transaction authentication and account access, but it also
      creates integration risk: the assigned evidence does not show common APIs, shared policy
      engines, migration completion, release cadence or whether acquired models have been
      normalized to one quality standard.
    claimRefs: [CE006, CE007, CE008, CE009]
  - id: trust-controls-and-verdict
    title: Trust controls, regulatory exposure and technical verdict
    body: >-
      Public control evidence is meaningful but incomplete. Google Cloud describes policy tags,
      granular access controls and governance tooling around sensitive facial-biometry and
      identity-document data. Separately, Brazil's ANPD is developing age-assurance guidance
      that specifically addresses facial estimation and document verification, making privacy,
      proportionality and child-protection implementation a moving product requirement rather
      than a static compliance badge. Biometric Update's company feed records 2026 product
      activity around age verification, AI-management certification and authentication
      orchestration, but headlines do not establish certification scope or production
      effectiveness. The technical verdict is therefore cautiously positive on breadth and
      disclosed scale, while model accuracy, demographic bias, spoof resistance, incident
      history, uptime and developer adoption remain material evidence gaps.
    claimRefs: [CE013, CE015, CE016]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns:
      - Module or asset
      - Primary user and job
      - Public maturity evidence
      - Differentiation
      - Material diligence gap
    rows:
      - - Unico Check
        - Enterprise risk teams; biometric authentication
        - Described in 2024 specialist reporting as a major revenue-generating product
        - Established facial-recognition authentication surface
        - Current volume, model version, accuracy and customer-level retention
      - - Unico IDPay
        - Merchants, card issuers and online buyers; authenticate card ownership
        - Launched in May 2023 with externally reported merchant and issuer outcomes
        - Connects facial identity and taxpayer identifier to issuer confirmation
        - Audited outcome cohorts, false rejects and chargeback observation period
      - - Unico IDCloud
        - Enterprise identity and fraud teams; orchestrate verification
        - Third-party index dates launch to 2023 and describes cloud-native deployment
        - Self-operated identity and fraud orchestration
        - Public API contract, release history, uptime and independently verified client count
      - - OwnID by Unico
        - Product and security teams; passwordless registration and login
        - Acquired in September 2025; approximately 3.5 million verifications per month reported
        - Passkeys, biometric login, magic links and login analytics
        - Integration status, migration roadmap and post-acquisition service levels
      - - Oz Forensics capability
        - Fraud teams; liveness, anti-spoofing and deepfake defense
        - Acquired in September 2024 after some software was already incorporated
        - Proprietary liveness and deepfake technology
        - Independent benchmark results and model-governance harmonization
      - - Trully by Unico
        - Mexican fintechs; regional identity verification
        - Acquired in September 2024 with about 30 clients reported at acquisition
        - Local market presence and verification workflow
        - Current customer count, geographic data handling and integration completion
      - - Age-verification capability
        - Digital-service providers; age assurance
        - Specialist feed records a Brazilian launch in April 2026
        - Extends identity tooling into regulated age-assurance workflows
        - Accuracy by age band, consent design and alignment with final ANPD guidance
    notes: >-
      Public-evidence snapshot through 2026-10-20; maturity labels reflect reported launches or
      acquisitions, not audited production readiness, and undisclosed fields are stated as gaps.
    claimRefs: [CE001, CE005, CE006, CE007, CE008, CE009, CE010, CE015, CE016]
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Prior friction
      - Unico workflow
      - Publicly reported benefit
      - Limitation
    rows:
      - - Approve an online card purchase
        - Merchant cannot establish that buyer owns the card
        - Face scan plus taxpayer-identifier match and issuer confirmation through IDPay
        - More than $400 million in purchases reportedly recovered
        - No transaction denominator or measurement window disclosed
      - - Improve issuer approval
        - Digital-bank cards may be rejected by merchant verification systems
        - IDPay confirms cardholder identity with the issuer
        - Banco Neon card approval reportedly rose above 90%
        - Baseline, sample size and sustained period were not published
      - - Enter a website or application without a password
        - Password friction and abandonment during registration or login
        - OwnID uses passkeys, biometric identification or magic links
        - Approximately 3.5 million verifications per month reported at acquisition
        - Post-acquisition conversion and security outcomes are not public
      - - Analyze identity and fraud data
        - Cluster maintenance and specialist Spark or Scala access constrained teams
        - BigQuery, Spanner, Datastream and Dataform support transactional and analytical work
        - Supplier case study reports 50% of engineering capacity reallocated from maintenance
        - Result is supplier-published and lacks an independent cost or reliability baseline
      - - Apply age assurance
        - Providers need mechanisms compatible with child-protection duties
        - Product feed records an age-verification launch as ANPD develops detailed guidance
        - Regulatory process clarifies that facial estimation and documents are relevant methods
        - Final requirements and Unico-specific effectiveness evidence remain unavailable
    notes: >-
      Benefits preserve each source's metric name and qualification; reported outcomes are not
      normalized into a common funnel because populations and time bases differ.
    claimRefs: [CE001, CE002, CE004, CE008, CE009, CE012, CE013, CE015, CE016]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Disclosed role
      - Dependency
      - Risk or missing proof
    rows:
      - - Customer workflow layer
        - Onboarding, card authentication, passwordless login and age assurance
        - Merchant, issuer and application integrations
        - Integration specifications and deployment effort are not public
      - - Identity and fraud orchestration
        - IDCloud coordinates verification and fraud decisions
        - Self-operated product plus acquired modules
        - Common policy model, API versioning and migration status are undisclosed
      - - Biometric verification
        - Facial identity matching for onboarding and transaction authentication
        - Sensitive facial and identity-document data
        - Independent accuracy, bias and false-reject evidence is unavailable
      - - Liveness and anti-spoofing
        - Deepfake and presentation-attack defense
        - Oz Forensics technology and model integration
        - No assigned independent benchmark or red-team result
      - - Transactional data plane
        - High-availability identity checks
        - Google Cloud Spanner and strict service-level requirements
        - Actual SLA, regional failover and incident performance are not disclosed
      - - Analytics and governance plane
        - Ingestion, analytics, modeling, PII controls and CI/CD
        - BigQuery, Datastream, Dataform and Google Cloud policy tags
        - Supplier concentration, cost curve and control-audit scope are not public
    notes: >-
      Architecture is a synthesis of disclosed Google Cloud components and product reporting,
      not a complete production topology or an assertion that every module uses every component.
    claimRefs: [CE006, CE007, CE010, CE012, CE013]
