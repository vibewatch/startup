callouts:
  - calloutType: risk
    title: Scale is disclosed more clearly than model quality
    body: >-
      Public sources provide transaction-scale and workflow metrics, but the assigned evidence
      does not provide independent false-accept, false-reject, demographic-bias or spoof-resistance
      benchmarks for the models that underpin those workflows.
    claimRefs: [CE011, CE014, CE015]
