evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current audited revenue, ARR, profitability, cash, debt, total capital raised, and acquisition consideration.
    whyItMatters: >-
      These figures are necessary to separate operating scale from financial durability and to refresh the 2022
      valuation mark.
    diligencePath: >-
      Request audited 2024-2026 statements, capitalization tables, debt schedules, acquisition agreements, and board
      valuation materials.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete current executive team, board roster, ownership percentages, voting rights, and succession plan.
    whyItMatters: Publicly named recruits do not establish who controls strategy, risk oversight, or founder succession.
    diligencePath: >-
      Obtain the current organization chart, board minutes, shareholder agreement, and fully diluted capitalization
      table.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: verification-volume
    missingEvidence: >-
      A reconciled definition and common measurement period for the 1.2 billion and 1.5 billion annual verification
      figures.
    whyItMatters: Different populations or periods could materially change the interpretation of product scale and unit economics.
    diligencePath: >-
      Request monthly transaction logs and definitions separating checks, authentications, identities, faces, and
      billable events.
    relatedQuestionRefs:
