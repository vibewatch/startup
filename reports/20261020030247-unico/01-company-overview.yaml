company:
  name: Unico
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Unico is a Brazil-founded identity-verification and fraud-prevention company that
    moved its global headquarters to Menlo Park in 2026 while retaining its principal
    engineering base in Brazil. It has credible operating scale and an active
    acquisition-led expansion strategy, but its latest disclosed financing and valuation
    remain the $100 million Series D and $2.6 billion mark reported in 2022, while current
    revenue, total capital raised, headcount, debt, governance rights, and the impact of
    the Experian-related dispute remain undisclosed.
sections:
  - id: identity-and-scale
    title: Identity, footprint, and operating scale
    body: >-
      Unico began in Brazil in 2007 as Acesso Digital and evolved from document
      digitization into biometric identity verification and cloud-based fraud
      orchestration. The company opened a global headquarters in Menlo Park in 2026, but
      reporting based on an interview with its engineering leadership says the main
      software-development organization remains in Brazil. This creates a two-center
      operating model: commercial and executive expansion is increasingly U.S.-oriented,
      while core engineering capability remains concentrated in the original market.

      The strongest current scale disclosures are company-issued rather than audited.
      Unico says it performs more than 1.2 billion identity checks annually, serves more
      than 400 companies, and operates in more than 20 countries. A Google Cloud customer
      case study instead states 1.5 billion annual identity verifications and 170 million
      identities secured. The difference may reflect timing, scope, or metric definition,
      but neither source provides a reconciliation. Revenue, recurring revenue, customer
      concentration, and headcount are not disclosed in the assigned evidence, so these
      should not be inferred from transaction volume or identity counts.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO013]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person exposure
    body: >-
      Founder Diego Martins was still identified as chief executive and the public voice
      of the 2026 global expansion. The founding group also included Rui Jordao and Paulo
      Alencastro, but the assigned sources do not establish their current operating or
      governance roles. In support of international expansion, Unico recruited leaders
      with backgrounds at Google, Meta, Apple, P&G, Hotmart, EBANX, and EY. This roster
      signals an effort to add deepfake, design, commercialization, and finance expertise,
      yet the available reporting does not consistently state exact current titles,
      reporting lines, tenure, equity, or decision rights.

      Governance visibility is similarly incomplete. Goldman Sachs led the 2022 Series D
      and was reported to receive a board seat, while SoftBank and General Atlantic
      participated as existing investors. No assigned source provides a complete current
      board roster, ownership table, voting arrangement, founder stake, or post-acquisition
      integration structure. The founder-CEO's central role in strategy and external
      messaging therefore creates plausible key-person exposure, but the degree of
      control cannot be quantified without primary corporate records.
    claimRefs: [CO001, CO009, CO012]
    tableRefs: [TO002, TO003]
  - id: financing-expansion-and-risk
    title: Financing history, expansion milestones, and open risks
    body: >-
      The latest disclosed financing in the assigned evidence is a $100 million Series D
      reported in April 2022 at a $2.6 billion valuation. That is a historical transaction
      mark, not evidence of a current valuation or cash balance. Total capital raised,
      secondaries, debt facilities, runway, and acquisition consideration remain
      unavailable. Subsequent expansion has relied visibly on acquisitions: Oz Forensics
      and Trully.AI were announced in 2024, OwnID's passkey business supported U.S. entry
      in 2025, and a later account described ten acquisitions since founding.

      The acquisition program broadens liveness, anti-spoofing, passkey, and geographic
      capabilities, but undisclosed purchase prices and integration costs prevent an
      assessment of capital efficiency. Adverse evidence is also limited but not absent:
      Biometric Update's company page lists a June 2026 dispute in which Unico accused an
      Experian subsidiary of “freeloading” face-biometric verifications. The assigned
      source does not disclose the pleadings, forum, remedy sought, or financial exposure.
      This event should therefore be treated as a live diligence item rather than as a
      resolved liability or proof of wrongdoing by either party.
    claimRefs: [CO008, CO009, CO010, CO011, CO014, CO015, CO016]
    figureRefs: [FO001]
