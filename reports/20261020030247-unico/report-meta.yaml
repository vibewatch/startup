companyProfile:
  summary: >-
    Founded in Brazil in 2007 as Acesso Digital, Unico has developed into an enterprise digital-identity and
    fraud-prevention platform. It opened a global headquarters in Menlo Park in 2026 while retaining its principal
    software development organization in Brazil. Public disclosures indicate substantial verification volume, more than
    400 enterprise customers, and operations in more than 20 countries, but these scale indicators are not audited
    financial results.
