  topStrengths:
    - >-
      Substantial reported operating scale, including more than 1.2 billion annual identity checks and more than 400
      enterprise customers.
    - >-
      Broad identity, payment-authentication, liveness, and fraud-orchestration capabilities reinforced through
      acquisitions.
    - International reach across more than 20 countries and evidence of improved platform-maintenance efficiency.
  topRisks:
    - >-
      Sealed civil and criminal proceedings involving disputed biometric queries leave legal, privacy, competitive, and
      reputational exposure unresolved.
    - >-
      Current revenue, ARR, margins, cash, debt, burn, retention, customer concentration, and ownership terms are not
      publicly disclosed.
    - >-
      The April 2022 valuation is stale, while undisclosed acquisition costs and international expansion create
      unquantified capital and integration risk.
  unresolvedGaps:
    - >-
      Audited 2025-2026 revenue, ARR, gross margin, retention, cash, debt, burn, working-capital, and
      acquisition-integration costs.
    - >-
      A current fully diluted capitalization table, investor preferences, debt seniority, and a fresh primary or
      secondary valuation mark.
    - >-
      Primary court filings, procedural status, regulator involvement, counsel's outcome range, and quantified exposure
      for the Serasa-related dispute.
    - >-
      Customer retention and concentration cohorts, contract duration, realized pricing, and a reconciliation of
      authentication and verification metrics.
    - Current exit comparables, strategic-buyer evidence, IPO prerequisites, and a management-supported exit timetable.
