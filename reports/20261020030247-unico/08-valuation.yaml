          label: Scale proof
          detail: "More than 1.5B annual verifications and about 165M users are reported."
        - id: momentum
          label: Operating signal
          detail: "Reported Q1 2026 verification volume grew 84% year over year."
        - id: leverage
          label: Efficiency signal
          detail: "A partner case study reports 50% fewer platform-maintenance resources."
        - id: expansion
          label: Strategic expansion
          detail: "Silicon Valley headquarters and acquisitions broaden geographic and product scope."
        - id: uncertainty
          label: Price and risk gap
          detail: "The valuation mark is from 2022; transaction terms, current economics, and legal outcomes are unresolved."
        - id: decision
          label: Track / research more
          detail: "Reopen only with a current price, audited economics, cap-table terms, and legal clarity."
    approximationNotes: "Qualitative decision sequence only; node order does not imply numeric weight, probability, or conversion."
    claimRefs: [CV002, CV004, CV005, CV006, CV007, CV008, CV009, CV011, CV013, CV016]
callouts:
  - calloutType: recommendation
    title: Price is the gating variable
    body: >-
      Strong scale evidence does not convert a four-year-old private valuation into a current entry
      price. Hold the company on a watchlist until a current mark and auditable economics support
      ownership-adjusted return underwriting.
    claimRefs: [CV002, CV004, CV016]
  - calloutType: risk
    title: Litigation is not yet an outcome
    body: >-
      Reports describe serious allegations and a proceeding under seal, while Serasa denies the
      accusation. Underwrite a range of outcomes and seek primary documents rather than treating
      either side's position as an adjudicated fact.
    claimRefs: [CV013, CV014, CV015]
