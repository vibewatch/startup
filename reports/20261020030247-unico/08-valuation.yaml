      - [Confidence, "Medium", "Scale and expansion are visible; current economics and transaction terms are not.", "Require primary financial and ownership evidence before underwriting."]
      - [Risk rating, "High", "Biometric-data litigation allegations are unresolved and the proceeding is under seal.", "Apply a legal and governance diligence condition."]
      - [Valuation stance, "Stale and unsupported for a 2026 entry", "$2.6B Series D valuation in April 2022; later acquisition prices are undisclosed.", "Use the 2022 mark only as a historical anchor."]
      - [Decision implication, "Evidence-gated watchlist", "No current ARR, revenue, margin, cash, debt, dilution, or preference data in the assigned pool.", "Reopen after audited financials, a current mark, and cap-table review."]
    notes: "Assessments use only the assigned public evidence through 2026-10-20; missing financial and ownership fields are diligence gaps, not zero values."
    claimRefs: [CV002, CV004, CV007, CV008, CV013, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence-backed argument, What would change the view]
    rows:
      - [Thesis, "More than 1.5B annual verifications and about 165M users indicate substantial network reach.", "Audited revenue, retention, and cohort evidence showing that scale monetizes durably."]
      - [Thesis, "Acquisitions and a Silicon Valley headquarters create geographic and product optionality.", "Integration KPIs, disclosed purchase economics, and evidence of U.S. enterprise conversion."]
      - [Anti-thesis, "The 2022 valuation is stale and acquisition terms are undisclosed.", "A current primary financing or secondary mark plus a fully diluted capitalization table."]
      - [Anti-thesis, "Civil and criminal proceedings under seal create legal, privacy, competitive, and reputational uncertainty.", "Primary court documents, counsel analysis, regulator status, and a quantified range of outcomes."]
    notes: "Scale metrics are not treated as revenue; expansion actions are not treated as proof of successful integration or exit readiness."
    claimRefs: [CV002, CV004, CV005, CV007, CV008, CV009, CV010, CV013, CV014, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Assumptions, Valuation and return logic, Key risks, Probability signal, Downside trigger]
    rows:
      - [Bull, "Audited growth and retention validate volume signals; integrations deliver leverage; legal issues resolve without material harm.", "A price above the stale $2.6B mark is considered only if forward economics and exit evidence independently justify it.", "International execution and multiple compression.", "Not assessable from public data; requires audited KPIs and a current term sheet.", "Growth fails to translate into revenue or cash generation."]
      - [Base, "Scale persists, but financial disclosure and legal visibility remain limited.", "Require a material discount to any current seller mark or investor protections; no numeric range is defensible publicly.", "Dilution, preference overhang, and integration cost.", "Most consistent with the mixed assigned evidence.", "A current mark remains near or above 2022 pricing without stronger economics."]
      - [Bear, "Expansion consumes cash, monetization lags verification growth, or litigation damages trust and economics.", "Down-round territory below the 2022 mark; preserve capital unless downside protection is unusually strong.", "Legal liability, customer loss, weak unit economics, and financing need.", "Plausible but unquantifiable without financial and legal primary evidence.", "Adverse legal finding, customer loss, covenant stress, or emergency financing."]
    notes: "Scenario bands are conditional relative to the April 2022 $2.6B financing mark; no probability percentages, target IRR, or absolute 2026 range are estimated."
    claimRefs: [CV002, CV004, CV006, CV007, CV008, CV010, CV011, CV013, CV014, CV015, CV016]
