company:
  name: Unico
chapter:
  number: 8
  title: Valuation
  summary: >-
    Unico shows substantial identity-verification scale and continued international expansion, but
    the only disclosed valuation anchor in the assigned evidence is the April 2022 Series D at
    $2.6 billion. The recommendation is therefore track/research more, with high risk and no
    price-backed entry until current financial, cap-table, and litigation evidence is available.
sections:
  - id: decision
    title: Decision and price discipline
    body: >-
      The evidence supports a track/research-more decision rather than an investable price today.
      The positive case is real operating reach: third-party and partner-hosted sources describe
      more than 1.5 billion annual identity checks, roughly 165 million users, and a reported 84%
      year-over-year increase in first-quarter 2026 identity-verification volume. The limiting fact
      is valuation freshness. The $2.6 billion Series D mark dates to April 2022, while later
      acquisitions disclose no transaction values and the assigned evidence supplies no current
      revenue, ARR, margin, cash, debt, ownership, or preference terms. A high risk rating is
      appropriate because unresolved litigation allegations concern the integrity and economic
      value of biometric infrastructure central to the thesis. Entry discipline should therefore
      be tied to evidence, not to the stale headline valuation.
    claimRefs: [CV002, CV004, CV005, CV006, CV007, CV008, CV013, CV014, CV015, CV016]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and strategic optionality
    body: >-
      The thesis combines network scale, a difficult identity-and-fraud problem, and expansion by
      acquisition. Unico has moved beyond a single domestic product footprint: evidence points to
      a Silicon Valley headquarters, entry into Argentina through Valida, and earlier purchases of
      Oz Forensics and Trully.AI. A Google Cloud case study also reports a 50% reduction in
      platform-maintenance resources, a useful but company-influenced signal that scale may improve
      engineering leverage. The anti-thesis is equally material. Acquisition prices are undisclosed,
      so investors cannot judge capital allocation; a large user or verification count is not
      revenue or retention; and allegations involving biometric queries create legal, competitive,
      privacy, and reputational uncertainty. The view would improve only with audited economics,
      retention and concentration data, integration reporting, and a verified legal-status update.
    claimRefs: [CV004, CV005, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV002]
  - id: scenarios
    title: Scenario framework and comparable evidence
    body: >-
      A conventional revenue-multiple valuation is not defensible from the assigned public record
      because the denominator is missing. The nearest private-market reference is the 2022 Series D,
      while the 2024 and 2026 acquisitions demonstrate strategic activity but provide no transaction
      prices and therefore are not valuation comparables. Public-company and precedent-transaction
      multiples are also absent from the assigned pool. The scenario framework consequently uses
      conditional bands around the stale $2.6 billion mark rather than invented point estimates.
      The bull case requires audited growth, durable retention, improving unit economics, and clean
      legal resolution; the base case requires a material price discount or investor protections
      until those facts are verified; the bear case assumes a down-round outcome if expansion costs,
      litigation, or weak monetization offset volume growth. No evidence-based target IRR or hold
      period can be calculated without entry price, ownership, dilution, and exit assumptions.
    claimRefs: [CV001, CV002, CV006, CV007, CV008, CV010, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      International headquarters and repeated acquisitions indicate strategic ambition, but they do
      not establish IPO readiness, buyer interest, or a realizable exit value. Before underwriting,
      diligence should obtain audited 2025-2026 financials, a current capitalization table and
      preference waterfall, primary transaction documents for acquisitions, customer retention and
      concentration cohorts, and counsel's current assessment of the Serasa dispute. The decision
      can move toward invest only if a current price produces the required return after dilution and
      if operating evidence converts verification growth into durable revenue and cash generation.
      Thesis-break triggers are a down round without compensating protections, acquisition-related
      impairment or cash strain, material customer loss, adverse legal findings, or evidence that
      biometric-data governance weakens customer trust. A credible exit plan must identify likely
      strategic buyers or IPO prerequisites and reconcile them with ownership, preferences, and a
      supportable hold period.
    claimRefs: [CV003, CV004, CV006, CV007, CV008, CV009, CV011, CV012, CV013, CV014, CV015, CV016]
    figureRefs: [FV001]
