schemaVersion: "report-v2"
artifact: customers
slug: unico
runDate: 2026-10-20
company:
  name: Unico
chapter:
  number: 6
  title: Customers
  summary: >-
    Unico shows broad penetration in large Brazilian banks, retailers, and betting
    companies, while reported verification volume has risen from roughly 25 million
    monthly transactions in 2022 to 1.5 billion annually in a current Google Cloud
    case study. The evidence demonstrates usage scale and expansion into transaction
    authentication, but does not disclose named end customers, retention, contract
    duration, or revenue concentration.
sections:
  - id: customer-base-and-buyers
    title: Customer base, buyers, and use cases
    body: >-
      Unico's clearest customer evidence is segment-level rather than account-level.
      Its newsroom says the platform serves nine of Brazil's ten largest retailers,
      four of the five largest banks, and eight of the ten largest betting companies.
      These are meaningful enterprise-penetration claims across fraud-sensitive
      verticals, but they remain company-issued and omit customer names, contract
      scope, production status, and revenue contribution. The operating buyer is
      therefore best characterized as a regulated or high-transaction enterprise,
      with fraud, risk, payments, and digital-channel teams as likely users rather
      than a single horizontal software persona. A 2025 profile also reported more
      than 400 enterprise clients on IDCloud, but its methodology and definition of
      an active client are not disclosed. Public evidence supports a broad
      enterprise footprint; it does not support a precise active-customer count or
      payer mix.
    claimRefs: [CU001, CU002, CU003, CU012, CU015]
    tableRefs: [TU001]
  - id: adoption-and-expansion
    title: Adoption trajectory and expansion motion
    body: >-
      Reported usage has expanded materially, although the available metrics are not
      a clean cohort because definitions and periods differ. Two 2022 reports put
      volume at about 25 million identity-authentication transactions per month.
      Veja later reported more than 608 million transactions in a year and a
      management expectation of 1.8 billion by year-end. Unico's current newsroom
      states approximately one billion authentications per year, while Google
      Cloud's case study states 1.5 billion identity verifications annually across
      170 million identities. The direction is consistent with higher usage, but
      authentication, verification, and processed-transaction measures should not
      be treated as identical. Management describes the expansion loop as moving
      from onboarding into repeated transaction validation, which increases usage
      frequency inside existing financial accounts. Acquired customer bases can
      add geographic reach, but do not establish retention after integration.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU009, CU013, CU014, CU015]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: proof-durability-and-concentration
    title: Customer proof, durability, and concentration
    body: >-
      The retained evidence is strong on aggregate scale and weak on account-level
      durability. Google Cloud reports that Unico prevented an estimated US$5
      billion in potential fraud in 2025, while Unico reports R$3.2 billion in fraud
      prevented or no longer lost in 2024. These outcomes use different currencies,
      periods, and attribution methods, so they should remain separate rather than
      be combined into a trend. No retained source supplies a named Unico end
      customer with contract dates, production scope, independently measured
      outcomes, NRR, GRR, churn, renewal rates, contract length, or top-customer
      revenue share. The official penetration ratios could indicate category
      leadership, but they may also imply concentration in a finite set of large
      Brazilian accounts. A 2026 legal-dispute headline involving an Experian
      subsidiary adds diligence relevance because unresolved IP or verification
      disputes can affect enterprise procurement, but the profile excerpt does not
      establish customer loss or deployment failure.
    claimRefs: [CU010, CU011, CU016]
    tableRefs: [TU003]
