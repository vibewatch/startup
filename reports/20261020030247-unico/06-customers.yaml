      - ["Unnamed 9 of 10 largest Brazilian retailers", "Retail", "Identity and payment-related verification", "Not disclosed", "Cohort penetration claimed by Unico", "No named reference, contract detail, or independently measured result"]
      - ["Unnamed 8 of 10 largest Brazilian betting companies", "Betting", "Identity verification for a regulated digital channel", "Not disclosed", "Cohort penetration claimed by Unico", "No named reference, usage metric, or renewal evidence"]
    notes: "Sample is limited to the three customer cohorts explicitly disclosed on Unico's newsroom; it is not a list of named end customers."
    enumerationScope:
