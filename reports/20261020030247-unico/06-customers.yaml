    type: journey-map
    summary: "The evidence-supported path runs from enterprise onboarding to recurring transaction checks and geographic expansion, with retention still unverified."
    data:
      items:
        - label: "Target regulated enterprise"
          detail: "Banks, retailers, betting operators, and fintech-oriented identity workflows."
          touchpoints: ["Fraud and risk teams", "Payments and digital channels"]
        - label: "Initial identity onboarding"
          detail: "Facial-biometric verification establishes the first deployed use case."
          touchpoints: ["Customer onboarding", "Account opening"]
        - label: "Transaction authentication"
          detail: "Management says usage expanded into payments, credit, transfers, and repeat in-app activity."
          touchpoints: ["Payments", "High-value transfers", "Credit requests"]
        - label: "Scaled annual verification"
          detail: "Google Cloud reports 1.5 billion annual verifications across 170 million identities."
          touchpoints: ["Identity checks", "Fraud analysis"]
        - label: "Outcome proof"
          detail: "Google Cloud reports an estimated US$5 billion in potential fraud prevented in 2025."
          touchpoints: ["Loss avoidance", "Risk operations"]
        - label: "Geographic expansion"
          detail: "Acquisitions added reported customer bases in adjacent international markets, but retention is undisclosed."
          touchpoints: ["Mexico", "Middle East", "United States"]
    approximationNotes: "This is an evidence sequence, not a conversion funnel; no stage conversion, retention, or expansion rate is inferred."
    claimRefs: [CU005, CU010, CU013, CU014, CU015]
callouts:
  - calloutType: risk
    title: Durability remains the central customer diligence gap
    body: >-
      Aggregate usage and cohort penetration do not substitute for NRR, GRR,
      churn, contract duration, named production references, or top-customer
      revenue share. Investment underwriting should treat durability and
      concentration as unverified until customer-level data are supplied.
    claimRefs: [CU001, CU002, CU003, CU005, CU012]
