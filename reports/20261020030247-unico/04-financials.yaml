artifact: financials
slug: unico
runDate: 2026-10-20
company:
  name: Unico
chapter:
  number: 4
  title: Financials
  summary: >-
    Unico discloses substantial identity-verification activity and customer-value signals, but
    not the realized pricing, revenue, margins, cash, burn, debt, or acquisition spending needed
    to underwrite those signals. The financial case therefore rests on scale and operating
    leverage proxies while capital adequacy and revenue quality remain material diligence gaps.
sections:
  - id: revenue-model
    title: Revenue model and monetization visibility
    body: >-
      Public materials position IDCloud and IDPay as self-operated identity and payment-authentication
      products, with verification, liveness, fraud detection, and orchestration forming the delivered
      service. This supports an enterprise platform model whose economic activity is tied to identity
      and payment workflows, but the retained evidence does not disclose whether contracts are priced
      per verification, by volume tier, by platform subscription, by outcome, or through a blended
      structure. It also does not disclose contract duration, minimum commitments, discounts, revenue
      recognition, or revenue mix. Public transaction counts are therefore operating-scale indicators,
      not revenue, ARR, or a basis for estimating realized price.
    claimRefs: [CI002, CI003, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-revenue-quality
    title: Traction signals do not reconcile to revenue quality
    body: >-
      Unico's current website reports more than 150 million transactions processed per month, more
      than 1.2 billion authentications in the prior year, and more than 170 million unique faces
      across more than 21 countries. An independent industry listing also reports 84% year-over-year
      identity-verification volume growth in the first quarter of 2026, while an analyst index states
      that IDCloud had more than 400 enterprise clients in 2025. Those signals indicate meaningful
      activity and enterprise adoption, but the public figures use different periods and labels.
      Google Cloud's 1.5 billion annual-verification figure and Unico's separate annual and monthly
      figures cannot be reconciled into precise growth, retention, or monetization without definitions
      for billable events, duplicates, product mix, and reporting windows.
    claimRefs: [CI003, CI004, CI005, CI006, CI007, CI009, CI010, CI011]
  - id: cost-structure-and-capital
    title: Cost leverage is visible only through a narrow infrastructure proxy
    body: >-
      The strongest public cost signal is a Google Cloud case study stating that Unico reduced platform
      maintenance resources by 50% and reallocated half of engineering capacity from maintenance to
      strategic work after migrating data workloads. That is evidence of infrastructure operating
      leverage, not evidence of company-wide gross margin, cloud cost per verification, or cash savings.
      At the same time, Unico's global-headquarters move and acquisitions in Mexico, the UAE, and the
      United States indicate continued expansion demands. The purchase prices for Oz Forensics and
      Trully.AI were not disclosed, so neither acquisition cash use nor integration costs can be
      quantified. Current cash, debt, burn, runway, capex, and working-capital requirements remain absent.
    claimRefs: [CI008, CI012, CI013, CI016]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      The evidence supports a business with large transaction activity, enterprise adoption, and at
      least one concrete engineering-efficiency improvement, but it does not establish revenue quality
      or self-funded expansion. A reported Brazilian identity-verification transaction for idwall at
      about five times revenue is useful only as an unconfirmed peer-market reference, not a current
      Unico valuation or pricing multiple. Serpro's reported biometric infrastructure also shows that
      a government-backed substitute can operate at very large scale and serve public and private
      clients, creating potential distribution and pricing pressure. Underwriting should remain
      conditional on audited financials, cohort economics, contract data, and a sources-and-uses bridge
      for acquisitions and international expansion.
    claimRefs: [CI001, CI006, CI008, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and disclosure quality
    columns: [Stream, Mechanism, Public unit or status, Revenue quality, Diligence ask]
    rows:
      - [IDCloud identity verification, "Verification, liveness, and fraud orchestration", "150M+ transactions per month claimed; billing unit undisclosed", "Activity is not revenue or ARR", "Provide realized price per billable event, volume tiers, and product revenue"]
      - [IDPay payment authentication, "Facial biometrics and liveness used to validate buyer and card ownership", "No product-level volume or price retained", "Revenue mix and loss-allocation terms are unknown", "Provide contracts, attach rate, fraud-loss allocation, and net revenue"]
      - [Fraud-detection capabilities, "Network monitoring and real-time anomaly detection within IDCloud", "No stand-alone pricing disclosed", "Could support premium packaging, but no evidence establishes it", "Provide SKU packaging, discounting, and cross-sell contribution"]
      - [International enterprise deployment, "IDCloud contracts across an expanding geographic footprint", "400+ enterprise clients reported for 2025 by an analyst index", "Customer count lacks ACV, retention, and concentration", "Provide ARR by geography, ACV distribution, GRR, NRR, and top-customer share"]
    notes: "Public operating and product signals only; no retained source discloses realized pricing, recognized revenue, revenue mix, or ARR."
    claimRefs: [CI002, CI003, CI006, CI016]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Item, Public price or unit, What is known, What is not known]
    rows:
      - [IDCloud enterprise contract, null, "Product processes identity-verification and fraud workflows", "List price, realized price, minimum commitment, discounting, and renewal terms"]
      - [IDPay contract, null, "Product authenticates buyer identity and card ownership", "Transaction fee, platform fee, loss-sharing, and issuer economics"]
      - [Reported activity, "150M+ transactions per month", "Company-reported processing scale", "Billable-event definition, paid share, mix, and revenue conversion"]
      - [Peer transaction reference, "Approximately 5x revenue", "Reported but unconfirmed idwall acquisition multiple", "Unico comparability, metric period, margin profile, and current applicability"]
    notes: "Null means no public price was found in the retained evidence; the idwall multiple is an unconfirmed peer transaction reference, not Unico pricing or valuation."
    claimRefs: [CI002, CI003, CI014, CI016]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Realized revenue per verification, null, Low, "Converts activity into revenue and tests pricing durability", "Provide billable volumes and net revenue by product and customer cohort"]
      - [Gross margin and cloud cost per verification, null, Low, "Determines whether scale creates operating leverage", "Provide gross margin bridge and infrastructure cost per verification"]
      - [Platform-maintenance efficiency, "50% fewer maintenance resources; 50% of engineering capacity reallocated", Medium, "Narrow evidence of infrastructure leverage", "Quantify cash savings, total cloud spend, and company-wide margin effect"]
      - ["CAC, sales cycle, and payback", null, Low, "Tests enterprise GTM efficiency and international expansion cost", "Provide CAC, sales cycle, payback, win rate, and channel economics by geography"]
      - ["Cash, debt, burn, and runway", null, Low, "Determines financing dependency and next-round timing", "Provide audited cash flow, debt schedule, monthly burn, working capital, and acquisition integration costs"]
    notes: "Null means the metric is not disclosed in the retained public evidence; the efficiency figure is a Google Cloud case-study result and is not a company-wide margin measure."
    claimRefs: [CI008, CI012, CI013, CI016]
figures:
  - id: FI001
    title: Revenue model bridge with unresolved economic links
    type: flow
    summary: "Public evidence supports the operating path from customer activity to identity processing, but not the pricing, revenue-recognition, or gross-profit links."
    data:
      nodes:
        - id: customer-activity
          label: Customer onboarding or payment activity
          detail: "Enterprise workflows create identity-verification demand."
        - id: identity-event
          label: Identity or payment-authentication event
          detail: "Unico reports authentication and transaction volumes, not billable events."
        - id: platform-processing
          label: IDCloud or IDPay processing
          detail: "Verification, liveness, fraud detection, and orchestration are delivered."
        - id: risk-outcome
          label: Verification or fraud outcome
          detail: "Customer value is reported through conversion and fraud-prevention claims."
        - id: billing-event
          label: Billing event
          detail: "Unit, tier, commitment, and discount structure are not publicly disclosed."
        - id: recognized-revenue
          label: Recognized revenue
          detail: "Revenue amount, mix, timing, and ARR are unavailable."
        - id: gross-profit
          label: Gross profit
          detail: "Gross margin and service-delivery cost per event are unavailable."
      edges:
        - from: customer-activity
          to: identity-event
        - from: identity-event
          to: platform-processing
        - from: platform-processing
          to: risk-outcome
        - from: platform-processing
          to: billing-event
        - from: billing-event
          to: recognized-revenue
        - from: recognized-revenue
          to: gross-profit
    approximationNotes: "The sequence is an analytical operating model; it does not estimate prices, revenue, conversion rates, or margins."
    claimRefs: [CI002, CI003, CI007, CI008, CI016]
callouts:
  - calloutType: risk
    title: Scale is not a substitute for financial disclosure
    body: >-
      Public volume, client, and infrastructure-efficiency signals are encouraging, but they cannot
      establish realized pricing, recurring revenue, gross margin, burn, or runway. Large-scale public
      biometric infrastructure also creates a credible substitution and pricing-pressure risk.
    claimRefs: [CI003, CI006, CI008, CI015, CI016]
