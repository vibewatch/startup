    title: Partner and dependency risk register
    columns:
      - Rank
      - Dependency
      - Counterparty or cohort
      - Role
      - Failure scenario
      - Severity
      - Mitigation and residual exposure
    rows:
      - - 1
        - Cloud data and transaction platform
        - Google Cloud
        - BigQuery analytics and Cloud Spanner transactional availability
        - Regional outage, service degradation, commercial change, or control misconfiguration
        - High
        - Managed services and observability are documented; portability and tested failover are not
      - - 2
        - Authorized channel access
        - Skill Tecnologia and bank-linked access path alleged in reporting
        - Access to Unico services for a specified bank operation
        - Credentials or routing used beyond authorized scope
        - High
        - Investigation is reported; preventive controls and independent findings are unavailable
      - - 3
        - Acquired product capabilities
        - Trully, Oz Forensics, and OwnID assets
        - Regional identity, liveness, anti-spoofing, and passkey capabilities
        - Integration delay, inherited liability, talent loss, or fragmented controls
        - Medium-high
        - Portfolio expansion is visible; integration economics and service-level evidence are not
      - - 4
        - Large regulated customer base
        - Major Brazilian banks, retailers, and betting companies
        - Transaction volume, reference value, and distribution
        - Procurement loss, concentration shock, or sector-specific enforcement
        - High
        - Broad segment penetration is claimed; revenue concentration, renewals, and contract terms are unavailable
    notes: >-
      Dependency scope combines independent reporting, a partner case study, an
      industry profile, and company claims; no source supplies customer revenue
      shares, contractual protections, or cloud recovery test results.
    claimRefs: [CR005, CR007, CR011, CR013, CR014, CR015, CR016]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Qualitative residual exposure after the mitigations visible in the assigned
      public evidence, with every rating requiring the stated diligence gate.
    data:
      columns:
        - Risk
        - Likelihood
        - Impact
        - Residual severity
        - Investment gate
      rows:
        - label: Sealed legal dispute
          note: Outcome and remedies are not established by public reporting.
          values:
            - Serasa litigation
            - High that proceedings continue
            - High
            - High
            - Primary docket, forensic report, reserves, and counsel assessment
        - label: Biometric-data segregation
          note: Ratings reflect reported allegations, not a finding of wrongdoing.
          values:
            - Cross-client access control
            - Medium-high
            - High
            - High
            - Independent log reconciliation and data-flow audit
        - label: Cloud concentration
          note: Architecture is partner-reported; resilience tests are unavailable.
          values:
            - Google Cloud dependency
            - Medium
            - High
            - Medium-high
            - Recovery objectives, failover evidence, and portability plan
        - label: Model quality and spoofing
          note: No independent performance results were present in the assigned pool.
          values:
            - Biometric model performance
            - Unknown
            - High
            - High uncertainty
            - Segmented false-accept, false-reject, bias, and red-team results
        - label: Acquisition integration
          note: Deal values and integration economics are not publicly disclosed.
          values:
            - Multi-asset integration
            - Medium
            - Medium-high
            - Medium-high
            - Cohort retention, control mapping, costs, and synergy realization
        - label: Financial capacity
          note: Funding raised is not treated as cash available.
          values:
            - Liquidity and capital intensity
            - Unknown
            - High
            - High uncertainty
            - Audited cash, debt, burn, working capital, and acquisition costs
    approximationNotes: >-
      Qualitative matrix only; likelihood and impact are not numeric probabilities,
      and unknown evidence is not scored as low risk.
    claimRefs: [CR001, CR003, CR005, CR011, CR012, CR014, CR016]
callouts:
  - calloutType: risk
    title: Primary investment blocker
    body: >-
      The sealed Serasa matter cannot be sized from public reporting: transaction
      and affected-person figures are allegations, while liability, remedies,
      reserves, and regulator posture remain unavailable.
    claimRefs: [CR001, CR002, CR003, CR004]
  - calloutType: recommendation
    title: Evidence required before underwriting residual risk
    body: >-
      Require primary legal documents, independent access-control forensics,
      resilience and model-quality audits, concentration schedules, and current
      audited liquidity data before treating the visible mitigations as sufficient.
    claimRefs: [CR005, CR011, CR012, CR014, CR016]
