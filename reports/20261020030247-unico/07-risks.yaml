  evidenceGaps:
    - type: missing-source
      severity: material
      topic: serasa-litigation
      missingEvidence: >-
        Primary pleadings, court orders, independent forensic reports, claimed
        damages, insurance coverage, reserves, and regulator correspondence.
      whyItMatters: >-
        Public reporting establishes an active dispute but cannot determine
        liability, remedy range, operational restrictions, or cash exposure.
      diligencePath: >-
        Obtain the sealed materials through company counsel under NDA and commission
        independent legal and forensic review with a written exposure range.
      relatedQuestionRefs: [QR001]
      relatedTableRefs: [TR001]
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-register
      missingEvidence: >-
        A complete jurisdiction-by-jurisdiction inventory of licenses, privacy roles,
        data residency, investigations, litigation, and regulatory correspondence.
      whyItMatters: >-
        Operations in more than 20 countries create obligations that cannot be
        assessed from the limited public sources retained for this chapter.
      diligencePath: >-
        Request the compliance register, local counsel opinions, regulator log, DPA
        inventory, and a management certification that all material matters are listed.
      relatedQuestionRefs: [QR003]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: financial-capacity
      missingEvidence: >-
        Audited current cash, debt, burn, working capital, acquisition costs,
        integration spending, contingent liabilities, and financing commitments.
      whyItMatters: >-
        Funding history and undisclosed deal values do not establish cash available
        or the capacity to absorb legal and integration costs.
      diligencePath: >-
        Review audited statements, monthly management accounts, debt and preference
        schedules, board budgets, bank statements, and acquisition purchase accounting.
      relatedQuestionRefs: [QR008]
    - type: private-evidence-only
      severity: material
      topic: operational-assurance
      missingEvidence: >-
        Independent security audit, incident history, recovery tests, access-log
        reconciliation, and biometric false-accept, false-reject, bias, and red-team results.
      whyItMatters: >-
        Public architecture descriptions show controls but do not prove their
        effectiveness, resilience, or model performance across user cohorts.
      diligencePath: >-
        Commission an independent security and model-risk review and inspect raw test
        results, remediation tickets, incident reports, and failover exercise evidence.
      relatedQuestionRefs: [QR004, QR005, QR009, QR010]
