artifact: risks
slug: unico
runDate: 2026-10-20
company:
  name: Unico
chapter:
  number: 7
  title: Risks
  summary: >-
    The highest visible risk is an unresolved, sealed civil-and-criminal dispute
    involving alleged unauthorized biometric queries, while the broad processing
    footprint, cloud dependence, acquisitions, and international expansion enlarge
    the operational and regulatory surface. Public evidence does not quantify legal
    remedies, incident history, model-quality outcomes, customer concentration, or
    current liquidity, so investment readiness depends on private diligence rather
    than assuming those exposures are contained.
sections:
  - id: legal-regulatory-exposure
    title: Legal and regulatory exposure
    body: >-
      Public reporting describes civil and criminal proceedings under seal arising
      from Unico's allegations against Serasa Experian, including a reported search
      and seizure. The underlying court record is not available in the assigned
      evidence, so neither liability nor the eventual remedy can be established.
      The reported scale is material but still allegation-stage: a plaintiff-hired
      expert allegedly identified at least 1.4 million irregular transactions, while
      Unico estimated that queries could involve as many as 22 million Brazilians.
      Serasa denied the allegations and said the secrecy of the proceeding had
      prevented it from seeing the details. This combination creates high residual
      legal, privacy, competitive, and reputational exposure until docket documents,
      regulator correspondence, and independently validated forensic findings are
      reviewed. Expansion across more than 20 countries compounds the compliance
      burden, but the public pool does not establish jurisdiction-by-jurisdiction
      licensing or privacy status.
    claimRefs: [CR001, CR002, CR003, CR004, CR008]
    tableRefs: [TR001]
  - id: operational-security-and-model-risk
    title: Operational, security, and model risk
    body: >-
      Unico handles sensitive facial-biometric and identity-document data at large
      scale, making segregation, authorization, availability, and auditability core
      controls rather than back-office concerns. Reporting on the Serasa dispute
      alleges that access intended exclusively for Banco do Brasil may have been
      used through an intermediary for other traffic; this is unproven, but it
      identifies the control boundary that diligence must test. Google Cloud's case
      study documents BigQuery as the analytical core and Cloud Spanner for highly
      available transaction checks, which provides evidence of architecture and
      privacy controls while also revealing concentration in one cloud ecosystem.
      Public scale figures are not directly comparable: Unico says approximately
      one billion authentications per year, the World Economic Forum profile says
      more than three billion, and Google reports 1.5 billion identity verifications.
      Different issuers, metric names, and likely periods prevent treating these as
      one reconciled throughput series.
    claimRefs: [CR005, CR006, CR009, CR010, CR011, CR012]
    tableRefs: [TR002]
  - id: expansion-integration-and-dependencies
    title: Expansion, integration, and dependency risk
    body: >-
      The current strategy layers international expansion, new leadership, and
      acquired technology onto a system already serving regulated customers.
      Biometric Update describes a two-year expansion involving acquisitions in
      Mexico, the UAE, and the United States, while its 2024 transaction coverage
      says the purchase prices for Oz Forensics and Trully.AI were undisclosed.
      Those deals add liveness, anti-spoofing, passkey, and regional capabilities,
      but the assigned evidence does not disclose integration costs, consolidated
      service levels, inherited liabilities, or post-acquisition retention. An
      independent industry profile reports more than 400 enterprise IDCloud clients
      in 2025, and Unico claims deep penetration among large Brazilian banks,
      retailers, and betting companies; neither source discloses revenue
      concentration or contractual durability. The result is a credible scaling
      story paired with unresolved customer, partner, acquisition, and execution
      concentration.
    claimRefs: [CR007, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
  - id: investment-controls-and-kill-criteria
    title: Investment controls and thesis-break triggers
    body: >-
      Risk cannot be underwritten from public evidence alone. A finance leader and
      senior product, strategy, design, and marketing hires are company-reported
      mitigants for global execution, while Google documents privacy tags,
      granular access controls, observability, and managed availability tooling.
      Those controls do not resolve the sealed litigation, prove model accuracy or
      demographic performance, establish the absence of incidents, or quantify
      acquisition economics and liquidity. Investment progression should therefore
      require primary legal documents, an independent forensic review of access
      paths and data segregation, audited security and model-quality evidence,
      customer-concentration schedules, and current cash, debt, burn, and
      working-capital data. Thesis-break events include an injunction or enforcement
      action that restricts biometric processing, inability to reconcile access
      logs, a material control failure involving sensitive data, failure to provide
      customer-concentration evidence, or financing needs that cannot be supported
      by disclosed liquidity.
    claimRefs: [CR001, CR003, CR004, CR005, CR011, CR012, CR014, CR016]
    figureRefs: [FR001]
