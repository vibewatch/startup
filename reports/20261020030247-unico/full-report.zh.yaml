  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管暴露
        blocks:
          - type: paragraph
            body: >-
              公开报道描述了因 Unico 指控 Serasa Experian
              而产生的保密民事和刑事程序，其中包括据报道的搜查和扣押。指定证据没有底层法院记录，因此无法确定责任或最终救济。报道中的规模很大，但仍处于指控阶段：原告聘请的专家据称发现至少 140 万笔异常交易，而 Unico
              估计相关查询可能涉及多达 2,200 万名巴西人。Serasa
              否认指控，并称程序保密使其无法看到细节。在审阅案卷文件、监管机构往来和独立验证的取证结果前，这一组合会带来较高的剩余法律、隐私、竞争和声誉暴露。业务覆盖 20
              多个国家也加重了合规负担，但公开资料不足以证明逐司法辖区的许可或隐私状态。
            claimRefs:
