  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 假设
      - 估值与回报逻辑
      - 关键风险
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 经审计的增长和留存验证业务量信号；整合带来杠杆；法律问题得到解决且不造成重大损害。
        - 只有在前瞻性经济性和退出证据分别能够支持的情况下，才考虑高于过时 $2.6B 估值锚点的价格。
        - 国际执行和倍数压缩。
        - 公开数据无法评估；需要经审计的 KPI 和当前条款清单。
        - 增长未能转化为收入或现金生成。
      - - 基准
        - 规模延续，但财务披露和法律透明度仍然有限。
        - 要求相对于任何当前卖方估值有实质性折价，或要求投资者保护；公开信息不足以支持数字区间。
        - 稀释、优先权悬垂和整合成本。
        - 与已分配的混合证据最一致。
        - 当前估值仍接近或高于 2022 年定价，但经济性没有明显改善。
      - - 悲观
        - 扩张消耗现金、变现落后于核验增长，或诉讼损害信任和经济性。
        - 2022 年估值以下的下轮融资区间；除非下行保护异常有力，否则保留资本。
        - 法律责任、客户流失、单位经济性疲弱和融资需求。
        - 可能发生，但没有财务和法律一手证据无法量化。
        - 不利的法律裁决、客户流失、契约压力或紧急融资。
    notes: 情景区间均以 2022 年 4 月 $2.6B 融资估值为条件基准；未估计概率百分比、目标 IRR 或 2026 年绝对区间。
