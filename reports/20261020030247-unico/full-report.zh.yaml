      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              有最强证据支持的买方集中在银行、大型零售商、博彩运营商，以及其他面临远程开户和交易欺诈的企业。消费者是被核验用户，但企业通常通过欺诈、风险、合规、支付、安全或信任与安全预算付费。采用通常从损失高或受监管的工作流开始，把身份决策接入既有交易路径，再扩展到重复认证和相邻的反欺诈控制。巴西较高的银行账户渗透率和
              Pix 使用率降低了数字接入门槛，但不能证明企业愿意付费或 Unico 能获得多少份额。
