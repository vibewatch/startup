      - number: '3.2'
        title: 能力广度与分销能力
        blocks:
          - type: paragraph
            body: >-
              Unico 可观察到的最强位置，是广泛的工作流覆盖、较高的披露核验量和通过收购获得的专业能力组合。Google Cloud 的合作伙伴案例称，平台每年处理 15 亿次身份核验；独立报道将 Oz Forensics
              和 Trully 与活体检测、反欺诈攻击和区域扩张联系起来，将 OwnID 与 passkey 认证联系起来。同一组证据还显示，部分运营优势来自云和数据平台执行：Google
              称一次迁移使维护资源的一半得到重新分配。Serasa 的潜在优势则不同——通过 idwall 和 ClearSale
              实现分销和产品组合整合。因此，定位图使用明确的序数评分，而不是市场份额估计；在缺乏证据处，内部自建和现状方案的坐标标为暂定。
