      - number: '3.3'
        title: 定价、切换与锁定
        blocks:
          - type: paragraph
            body: >-
              没有保留来源提供 Unico、Serasa/idwall、ClearSale 和 Certta 之间可比的公开标价、单价或合同条款。最清晰的定价信号不是合同条款，而是不利反馈：Pipeline 报道称，客户告诉
              Unico，他们在 Serasa 产品质量改善且价格大幅降低后开始测试 Serasa。这不能证明实际价格水平或持久流失，但说明买方至少可以试用替代方案，价格也可能克服其感知的质量差距。反过来，Unico
              的网络规模和敏感数据基础设施可能提高运营切换成本。两种效果都没有量化，因此仍需采购文件、客户群留存、多归属率、实施投入和续约折扣信息，才能区分真正的锁定与现有供应商惯性。
            claimRefs:
