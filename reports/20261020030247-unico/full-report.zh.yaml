  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与买方选择
        blocks:
          - type: paragraph
            body: >-
              买方视野不只是生物识别初创公司名单。Unico 直接与巴西身份核验供应商竞争，也与不断扩展认证和反欺诈产品组合的 Serasa Experian
              竞争；间接替代者则包括银行内部自建系统和传统文件审核工作流。Unico
              官方产品覆盖开户、非文件核验、欺诈风险检测、多账户防范、持续认证、年龄核验、数据核验和无卡交易核验。报道中的交易规模强化了这种广度，但证据并不对称：公开竞争者信息主要集中于 Serasa 的收购，而 Certta
              和内部自建的经济性仍很薄弱。因此，画像表将内部自建和人工审核视为买方必须考虑的替代方案，而不是假装它们是可直接比较的供应商。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP015
              - CP016
