chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、覆盖范围与运营规模
        blocks:
          - type: paragraph
            body: >-
              Unico 于 2007 年在巴西以 Acesso Digital 起步，从文件数字化逐步转向生物识别身份核验和云端反欺诈编排。公司于 2026 年在 Menlo Park
              开设全球总部，但基于工程领导层访谈的报道称，主要软件开发组织仍在巴西。公司因此形成双中心运营模式：商业和高管扩张日益面向美国，而核心工程能力仍集中在最初市场。

              目前最有力的规模披露来自公司自身，而非审计数据。Unico 称其每年完成超过 12 亿次身份核验、服务超过 400 家公司，并在 20 多个国家运营。Google Cloud 的客户案例则称，平台每年完成 15
              亿次身份验证，并保护 1.7 亿个身份。差异可能来自时间、范围或指标定义，但两份来源都没有给出核对方法。现有证据未披露收入、经常性收入、客户集中度或员工人数，因此不能从交易量或身份数量反推这些指标。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO013
