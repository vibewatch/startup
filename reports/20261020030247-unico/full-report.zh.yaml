            title: 首要投资阻碍
            body: 公开报道无法量化保密的 Serasa 事项：交易量和受影响人数仍是指控，责任、救济、准备金和监管态度均不可得。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: 判断剩余风险前所需证据
            body: 在认为现有可见缓释措施足够之前，应要求原始法律文件、独立访问控制取证、韧性和模型质量审计、集中度明细以及当前经审计的流动性数据。
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR011
              - CR012
