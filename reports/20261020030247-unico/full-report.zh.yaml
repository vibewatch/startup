  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场比全部网络安全支出或全部数字身份支出更窄。Unico
              已有证据支持的范围始于企业必须确认某人真实存在且有权执行数字动作的场景：开户、持续认证、支付授权、欺诈风险编排和年龄保证。当活体检测、反欺诈攻击、passkey
              和身份风险信号作为该决策的一部分销售时，也纳入其中。支付轨道经济、通用数据基础设施和无关的文档管理支出则被排除。现状替代方案包括人工审核、仅核验文件、一次性
              KYC、密码和内部反欺诈规则；证据池没有量化这些方案的支出或替代率。
            claimRefs:
