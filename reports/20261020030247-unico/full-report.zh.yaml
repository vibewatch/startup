              Forensics 和 Trully.AI 的购买价格未披露。这些交易增加了活体检测、反欺诈攻击、passkey
              和区域能力，但指定证据没有披露整合成本、合并后的服务水平、承接的负债或收购后的留存。一份独立行业画像称，IDCloud 在 2025 年拥有超过 400 家企业客户，Unico
