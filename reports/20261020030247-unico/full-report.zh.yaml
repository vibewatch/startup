        title: 成本杠杆只能从狭窄的基础设施代理指标中看到
        blocks:
          - type: paragraph
            body: >-
              最强的公开成本信号来自 Google Cloud 客户案例：数据工作负载迁移后，Unico 将平台维护资源减少
              50%，并把一半工程产能从维护转向战略工作。这证明了基础设施运营杠杆，不代表全公司毛利率、每次核验的云成本或现金节省。同时，全球总部迁移以及在墨西哥、阿联酋和美国的收购表明扩张仍在持续。Oz Forensics
              和 Trully.AI 的购买价格未披露，因此无法量化收购现金支出或整合成本。当前现金、债务、消耗、跑道、资本开支和营运资金需求仍缺乏数据。
