      - number: '4.2'
        title: 业务牵引信号无法与收入质量核对
        blocks:
          - type: paragraph
            body: >-
              Unico 当前网站称，公司每月处理超过 1.5 亿笔交易、上一年完成超过 12 亿次认证，并在 21 个以上国家拥有超过 1.7 亿张独特人脸。一个独立行业目录还报告，2026 年第一季度身份核验量同比增长
              84%；一份分析师指数称，IDCloud 在 2025 年拥有超过 400
              家企业客户。这些信号显示活动量和企业采用度都不低，但公开数字使用了不同期间和标签。若没有对可计费事件、重复记录、产品组合和统计窗口的定义，就无法将 Google Cloud 披露的每年 15 亿次核验与
              Unico 分别披露的年度、月度数字核对成精确的增长、留存或变现数据。
