  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与价格纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持“跟踪/继续研究”，而不是今天就给出可投资价格。正面因素是真实的运营覆盖：第三方和合作伙伴托管来源描述了每年超过 15 亿次身份核验、约 1.65 亿用户，以及 2026 年第一季度身份核验量同比增长
              84%。限制因素是估值缺乏新鲜度。26 亿美元的 D 轮估值停留在 2022 年 4
              月，后续收购没有披露交易价值，指定证据也没有提供当前收入、ARR、利润率、现金、债务、所有权或优先权条款。由于未解决的诉讼指控涉及论点核心生物识别基础设施的完整性和经济价值，给予高风险评级是合适的。因此，入场纪律应绑定证据，而不是过时的标题估值。
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV008
              - CV013
              - CV015
              - CV016
      - number: '8.2'
        title: 投资论点、反论点与战略期权
        blocks:
          - type: paragraph
            body: >-
              投资论点结合了网络规模、棘手的身份与欺诈问题，以及通过收购扩张。Unico 已走出单一的国内产品覆盖：证据指向硅谷总部、通过 Valida 进入阿根廷，以及此前收购 Oz Forensics 和
              Trully.AI。Google Cloud 案例还报告平台维护资源减少
              50%，这是一个有公司影响因素、但有用的信号，说明规模可能改善工程杠杆。反论点同样重要。收购价格未披露，投资者无法判断资本配置；庞大的用户或核验数量不是收入或留存；涉及生物识别查询的指控带来法律、竞争、隐私和声誉不确定性。只有取得经审计的经济性、留存与集中度数据、整合报告以及经核实的法律状态更新后，观点才会改善。
            claimRefs:
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: 情景框架与可比证据
        blocks:
          - type: paragraph
            body: >-
              由于缺少分母，依据指定公开记录无法为传统收入倍数估值辩护。最近的私募市场参考是 2022 年 D 轮；2024 年和 2026
              年的收购证明了战略活动，但没有交易价格，因此不能作为估值可比。指定证据池也没有上市公司或先例交易倍数。因此，              情景框架以过时的 26
              亿美元估值使用有条件区间，而不是臆造点估计。乐观情景要求经审计的增长、持久留存、改善的单位经济性和清晰的法律结局；基准情景要求在这些事实核实前给予大幅价格折扣或投资者保护；悲观情景假设扩张成本、诉讼或变现疲软抵消交易量增长，最终出现下轮融资。没有入场价格、所有权、稀释和退出假设，无法计算基于证据的目标
              IRR 或持有期。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调要求与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              国际总部和反复收购显示出战略雄心，但不能证明 IPO 准备度、买方兴趣或可实现的退出价值。在投资判断前，尽调应取得经审计的 2025-2026
              年财务数据、当前资本化表和优先权瀑布、收购的原始交易文件、客户留存与集中度客户群数据，以及律师对 Serasa
              争议的当前评估。只有当当前价格在稀释后仍能产生所需回报，且运营证据将核验增长转化为持久收入和现金生成时，决策才可转向投资。论点破坏触发器包括没有补偿性保护的下轮融资、与收购有关的减值或现金压力、重大客户流失、不利法律发现，或生物识别数据治理削弱客户信任的证据。可信的退出计划必须确定可能的战略买家或
              IPO 前置条件，并与所有权、优先权和可支撑的持有期相互核对。
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
