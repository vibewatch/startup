      - number: '5.3'
        title: 自建与收购扩张及差异化
        blocks:
          - type: paragraph
            body: >-
              Unico 的差异化一部分来自原生网络规模，一部分来自收购能力。专业报道称，Oz Forensics 软件在收购前已经被纳入系统，并将专有技术列为收购理由；Trully.AI
              的收购增加了面向墨西哥的核验覆盖。之后收购 OwnID 又增加了 passkey、生物识别登录、magic link 和登录分析；CTech 报道称，收购时 OwnID 每月约完成 350
              万次核验。这一系列交易可以加速开户、交易认证和账户访问方面的能力扩展，但也带来整合风险：指定证据没有显示统一 API、共享策略引擎、迁移完成情况、发布节奏，或被收购模型是否已统一到同一质量标准。
