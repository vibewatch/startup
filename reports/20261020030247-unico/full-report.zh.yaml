            body: >-
              Unico 最清晰的产品证明来自具体交易工作流，而不是泛化的身份平台。IDPay 扫描买方人脸，将身份与交易中使用的纳税人识别号关联，再要求发卡行确认所有权；Fast Company 报道称，Banco Neon
              卡的追回购买金额超过 4 亿美元、批准率超过 90%，但文章没有披露观察窗口或交易分母。更广泛的产品组合包括用于生物识别认证的 Check、用于身份和欺诈编排的 IDCloud、用于无密码登录的
              OwnID，以及收购获得的活体检测、反欺诈攻击和区域核验能力。因此，公开证据支持一个多产品工作流套件，但不能证明所有模块成熟度一致。
