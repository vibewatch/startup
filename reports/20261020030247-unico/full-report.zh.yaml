      - number: '2.4'
        title: 增长驱动、约束与时点
        blocks:
          - type: paragraph
            body: >-
              公司披露的 2026 年第一季度指标指向需求动能：身份核验量同比增长 84%，国际收入增长 130%，墨西哥交易量环比增长 204%。这些是 Unico 自身指标，不是独立的市场增长估计。结构性驱动因素包括 AI
              驱动的冒充、密集的数字支付使用、跨境扩张和新的年龄保证义务。约束同样重要：敏感生物识别数据需要严格的隐私控制和高可用性，成熟支付轨道上仍会发生欺诈，监管仍在落地，整合会带来切换成本。因此，应按工作流逐一建模采用，而不是把广义类别预测直接换算为即时转化。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM012
              - CM013
              - CM015
