        title: 信任控制、监管暴露与技术结论
        blocks:
          - type: paragraph
            body: >-
              公开控制证据有价值，但并不完整。Google Cloud 描述了围绕敏感人脸生物识别和身份文件数据的政策标签、细粒度访问控制和治理工具。另一方面，巴西 ANPD
              正在制定年龄保证指引，专门涉及人脸估计和文件核验，使隐私、相称性和儿童保护的落地成为持续变化的产品要求，而不是静态合规徽章。Biometric Update 的公司动态记录了 2026 年围绕年龄核验、AI
              管理认证和认证编排的产品活动，但标题不能证明认证范围或生产效果。因此，技术结论对产品广度和披露规模持谨慎正面态度，但模型准确率、人口偏差、反欺诈攻击能力、事故历史、正常运行时间和开发者采用度仍是重要证据缺口。
