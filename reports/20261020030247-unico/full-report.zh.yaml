figures:
  - id: FO001
    title: Unico 公司与扩张里程碑
    type: timeline
    summary: 公司从巴西的文件数字化起步，发展到生物识别身份基础设施，随后借助融资和收购加速国际扩张。
    data:
      items:
        - date: '2007'
          label: 以 Acesso Digital 创立
          detail: Diego Martins、Rui Jordao 和 Paulo Alencastro 在巴西创立了公司。
          tone: neutral
        - date: '2016'
          label: 转向身份核验
          detail: 一份独立行业画像将生物识别认证产品 Unico Check 的推出时间追溯到这次转型。
          tone: positive
        - date: '2020'
          label: General Atlantic 投资
          detail: 一份独立行业画像记录了 General Atlantic 在 Unico 拓展巴西金融和零售市场期间提供支持。
          tone: positive
        - date: 2022-04
          label: Series D 融资
          detail: Goldman Sachs 领投了一轮 $100 million 融资，据报道估值为 $2.6 billion。
          tone: positive
        - date: '2023'
          label: IDCloud 发布
          detail: Unico 发布了云原生身份核验与欺诈编排平台。
          tone: positive
        - date: 2024-09
          label: 收购 Oz Forensics 和 Trully.AI
          detail: 收购扩大了深度伪造欺诈能力，并拓展了 Unico 在墨西哥的业务版图。
          tone: positive
        - date: 2025-09
          label: 收购 OwnID 通行密钥业务
          detail: 被收购的通行密钥业务支持 Unico 进入美国。
          tone: positive
        - date: 2026-04
          label: Menlo Park 全球总部
          detail: Unico 开设新的全球总部，作为更广泛国际扩张的一部分。
          tone: positive
        - date: 2026-06
          label: 与 Experian 相关的争议浮现
          detail: Biometric Update 列出了 Unico 关于竞争对手使用面部生物识别核验的指控。
          tone: negative
    approximationNotes: 年月精度遵循指定来源能够提供的精度；时间线不表示未披露的融资、整合或法律事件没有发生。
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO008
      - CO009
      - CO010
      - CO011
      - CO014
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 定性证据链将广泛数字触达与 Unico 特定业务活动和可获得收入区分开来。
    data:
      items:
        - label: 广义品类预测
          displayValue: More than $50B by 2034
          detail: Unico 引用的全球数字身份预测；方法未公开。
          claimRefs:
            - CM014
        - label: 巴西数字接入
          displayValue: 96.4% banked in 2024
          detail: 数字化准备度指标，不是身份核验支出池。
          claimRefs:
            - CM011
        - label: 活跃支付人群
          displayValue: 142M Pix users in April 2026
          detail: 约 93% 的巴西成年人至少发起过一笔 Pix 交易。
          claimRefs:
            - CM009
        - label: 商业交易触点
          displayValue: 12M Pix-receiving businesses
          detail: 潜在工作流范围；不是 Unico 潜在客户或客户数量。
          claimRefs:
            - CM010
        - label: Unico 网络活动
          displayValue: 170M identities; 1.5B annual checks
          detail: 合作伙伴和公司披露的触达规模，分母各不相同。
          claimRefs:
            - CM006
        - label: 当前扩张势头
          displayValue: 84% volume growth; 130% international revenue growth
          detail: 公司披露的 2026 年第一季度指标，不是品类增长率。
          claimRefs:
            - CM003
            - CM004
            - CM005
        - label: 可获得收入
          displayValue: Not publicly derivable
          detail: 定价、合格工作量、转化、留存和细分市场组合均未公开。
          claimRefs:
            - CM016
    approximationNotes: 各层从广泛背景排到公司特定证据，宽度不代表比例。各数值不可比较，也不构成从 TAM 到 SOM 的数值换算。
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM006
      - CM009
      - CM010
      - CM011
      - CM014
      - CM016
  - id: FP001
    title: 竞争定位：能力广度与分销杠杆
    type: quadrant
    summary: 有证据支持的序数定位凸显 Unico 已有记录的能力广度，以及 Serasa 以分销为主导的应对，同时保留重大证据缺口。
    data:
      xAxis:
        label: 已记录的能力广度（1 低，5 高）
        min: 1
        max: 5
      yAxis:
        label: 分销或嵌入式工作流杠杆（1 低，5 高）
        min: 1
        max: 5
      points:
        - label: Unico
          x: 5
          'y': 5
          note: 官方业务覆盖广泛，网络规模有报道支持，并具备收购而来的专业能力。
        - label: Serasa + idwall
          x: 4
          'y': 5
          note: 在既有分销基础上加入身份和欺诈产品组合；没有市场份额估计。
        - label: Serasa + ClearSale
          x: 4
          'y': 5
          note: 欺诈产品组合和面向银行的访问渠道可见，但争议性使用指控使能力判断无法直接下结论。
        - label: Certta / CAF
          x: 2
          'y': 2
          note: 被点名的区域同行，但留存的产品和规模证据不足。
        - label: 内部自建
          x: 3
          'y': 1
          note: 暂定的替代方案坐标；没有留存的建设成本或性能基准。
        - label: 手工现状
          x: 1
          'y': 3
          note: 暂定的替代方案坐标；尽管能力未经基准测试，嵌入式工作流仍可能持续。
    approximationNotes: 分数是分析师从 1 到 5 作出的序数判断，不是经过测量的市场份额、准确率或收入。内部自建和手工现状坐标为暂定值，并明确受证据缺口约束。
    claimRefs:
      - CP002
      - CP011
      - CP013
      - CP015
      - CP016
  - id: FI001
    title: 收入模型桥接：经济链路仍有缺口
    type: flow
    summary: 公开证据支持从客户活动到身份处理的运营路径，但定价、收入确认和毛利链路仍无证据支持。
    data:
      nodes:
        - id: customer-activity
          label: 客户开户或支付活动
          detail: 企业工作流产生身份核验需求。
        - id: identity-event
          label: 身份或支付认证事件
          detail: Unico 报告了认证和交易量，但没有说明可计费事件数量。
        - id: platform-processing
          label: IDCloud 或 IDPay 处理
          detail: 提供核验、活体检测、欺诈识别和编排能力。
        - id: risk-outcome
          label: 核验或欺诈结果
          detail: 客户价值通过转化和防欺诈主张体现。
        - id: billing-event
          label: 计费事件
          detail: 单价、层级、承诺量和折扣结构未公开。
        - id: recognized-revenue
          label: 已确认收入
          detail: 收入金额、组合、确认时间和 ARR 均不可得。
        - id: gross-profit
          label: 毛利
          detail: 毛利率和每次事件的服务交付成本不可得。
      edges:
        - from: customer-activity
          to: identity-event
        - from: identity-event
          to: platform-processing
        - from: platform-processing
          to: risk-outcome
        - from: platform-processing
          to: billing-event
        - from: billing-event
          to: recognized-revenue
        - from: recognized-revenue
          to: gross-profit
    approximationNotes: 该序列是分析性的运营模型；不估算价格、收入、转化率或利润率。
    claimRefs:
      - CI002
      - CI003
      - CI007
      - CI008
      - CI016
  - id: FE001
    title: 公开披露的产品与技术栈
    type: stack
    summary: 这是一个概念性技术栈，将客户工作流与已披露的编排、核验、云数据和治理组件连接起来。
    data:
      layers:
        - label: 客户工作流
          modules:
            - 开户
            - 卡支付认证
            - 无密码登录
            - 年龄核验
        - label: 产品体验
          modules:
            - Unico Check
            - Unico IDPay
            - OwnID（由 Unico 提供）
        - label: 身份与欺诈编排
          modules:
            - Unico IDCloud
            - 策略与决策工作流
        - label: 核验控制
          modules:
            - 面部生物识别
            - 活体检测与反欺骗
            - 文件核验
        - label: 交易与分析数据
          modules:
            - Cloud Spanner
            - BigQuery
            - Datastream
        - label: 数据治理与交付
          modules:
            - 策略标签与细粒度访问控制
            - Dataform 治理与 CI/CD
            - 工作负载可观测性
    approximationNotes: 对公开披露的概念性综合；层级顺序用于分析，不声称存在完整的生产拓扑、所有模块均已部署或任何性能基准。
    claimRefs:
      - CE001
      - CE007
      - CE008
      - CE010
      - CE012
      - CE013
  - id: FU001
    title: 客户采用与扩张路径
    type: journey-map
    summary: 有证据支持的路径从企业开户延伸到持续交易核验和地域扩张，但留存情况仍未验证。
    data:
      items:
        - label: 目标受监管企业
          detail: 银行、零售商、博彩运营商，以及面向金融科技的身份工作流。
          touchpoints:
            - 欺诈与风险团队
            - 支付与数字渠道
        - label: 初始身份开户
          detail: 面部生物识别核验构成首个已部署用例。
          touchpoints:
            - 客户开户
            - 开立账户
        - label: 交易认证
          detail: 管理层称，使用范围已扩展到支付、信贷、转账和应用内重复活动。
          touchpoints:
            - 支付
            - 大额转账
            - 信贷申请
        - label: 规模化年度核验
          detail: Google Cloud 报告每年在 170 million 个身份上完成 1.5 billion 次核验。
          touchpoints:
            - 身份核验
            - 欺诈分析
        - label: 结果证明
          detail: Google Cloud 报告称，2025 年预计避免了 US$5 billion 的潜在欺诈损失。
          touchpoints:
            - 避免损失
            - 风险运营
        - label: 地域扩张
          detail: 收购为邻近国际市场带来了据报道已有的客户群，但留存情况未公开。
          touchpoints:
            - 墨西哥
            - 中东
            - 美国
    approximationNotes: 这是证据序列，不是转化漏斗；没有推断任何阶段转化率、留存率或扩张率。
    claimRefs:
      - CU005
      - CU010
      - CU013
      - CU014
      - CU015
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 展示指定公开证据中可见的缓解措施实施后的定性剩余暴露；每项评级都需要经过列明的尽调门槛。
    data:
      columns:
        - 风险
        - 可能性
        - 影响
        - 剩余严重程度
        - 投资门槛
      rows:
        - label: 保密审理中的法律争议
          note: 公开报道尚未确定结果和救济措施。
          values:
            - Serasa 诉讼
            - 诉讼继续进行的可能性高
            - 高
            - 高
            - 一手案卷、取证报告、准备金和律师评估
        - label: 生物识别数据隔离
          note: 评级反映报道中的指控，不代表已认定存在不当行为。
          values:
            - 跨客户访问控制
            - 中高
            - 高
            - 高
            - 独立日志核对和数据流审计
        - label: 云集中度
          note: 架构由合作伙伴披露；韧性测试不可得。
          values:
            - 对 Google Cloud 的依赖
            - 中
            - 高
            - 中高
            - 恢复目标、故障切换证据和可迁移方案
        - label: 模型质量与欺骗攻击
          note: 分配到的资料池中没有独立性能结果。
          values:
            - 生物识别模型性能
            - Unknown
            - 高
            - 高度不确定
            - 分项误接受、误拒绝、偏差和红队测试结果
        - label: 收购整合
          note: 交易金额和整合经济性尚未公开披露。
          values:
            - 多资产整合
            - 中
            - 中高
            - 中高
            - Cohort 留存、控制映射、成本和协同效应兑现
        - label: 财务能力
          note: 已募集资金不等同于可用现金。
          values:
            - 流动性与资本密集度
            - Unknown
            - 高
            - 高度不确定
            - 经审计的现金、债务、烧钱速度、营运资金和收购成本
    approximationNotes: 仅为定性矩阵；可能性和影响并非数值概率，未知证据也不按低风险计分。
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR011
      - CR012
      - CR014
      - CR016
  - id: FV001
    title: 从证据到决策的建议逻辑
    type: flow
    summary: 该流程将经营证据与缺失的价格输入、决策门槛分开。
    data:
      nodes:
        - id: scale
          label: 规模证据
          detail: 据报道，年验证量超过 15 亿次，用户约 1.65 亿。
        - id: momentum
          label: 经营信号
          detail: 据报道，2026 年第一季度验证量同比增长 84%。
        - id: leverage
          label: 效率信号
          detail: 一项合作伙伴案例研究称，平台维护所需资源减少了 50%。
        - id: expansion
          label: 战略扩张
          detail: 硅谷总部和多笔收购扩大了地域覆盖与产品范围。
        - id: uncertainty
          label: 价格与风险缺口
          detail: 估值口径来自 2022 年；交易条款、当前经济性和法律结果仍未厘清。
        - id: decision
          label: 跟踪 / 继续研究
          detail: 只有拿到当前价格、经审计的经济数据、股权表条款和明确的法律结论后，才重新推进。
    approximationNotes: 仅为定性决策流程；节点顺序不代表数值权重、概率或转化率。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV011
      - CV013
      - CV016
