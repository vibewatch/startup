        title: 财务结论与投资判断阻碍
        blocks:
          - type: paragraph
            body: >-
              证据支持这样一家公司：交易活动量大、企业采用度高，并且至少有一项具体的工程效率改善；但证据不能证明收入质量或自筹扩张能力。据报道，巴西身份核验公司 idwall
              的一笔交易按约五倍收入作价；这只能作为未确认的同业市场参考，不能作为 Unico 当前估值或定价倍数。Serpro
              报道中的生物识别基础设施也显示，政府支持的替代方案可以达到极大规模并服务公共及私营客户，带来潜在的分销和价格压力。投资判断应以经审计财务数据、客户群经济性、合同数据，以及收购和国际扩张的资金来源与用途桥接为前提。
