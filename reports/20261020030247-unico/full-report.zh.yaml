              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格是闸门变量
            body: 强劲的规模证据不能把四年前的私营公司估值变成当前入场价格。在当前估值和可审计经济性能够支持按所有权调整的回报投资判断前，应将公司保留在观察名单上。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV004
              - CV016
          - type: callout
            title: 诉讼尚未形成结果
            body: 报道描述了严重指控和一项保密程序，而 Serasa 否认指控。应对结果区间进行投资判断，并寻求原始文件，而不是把任一方立场当作已经裁决的事实。
            calloutType: risk
            claimRefs:
              - CV013
              - CV014
