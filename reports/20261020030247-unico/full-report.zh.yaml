      - number: '3.4'
        title: 护城河持久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              护城河有合理性，但也存在争议。产品扩展到年龄核验、活体检测、passkey 和编排，使 Unico
              更难被单点方案替代；国际交易和收入增长也表明平台可能走出巴西。但这些优势没有独立披露的准确率、偏差、误接受、误拒绝或总成本基准来保护。Pipeline 还报道了 Unico
              的指控：Serasa、ClearSale 和一家中间方不当使用其生物识别系统；同一篇文章记录了 Serasa
              的全面否认。这场争议可能显示其拥有有价值的专有数据和网络效应，也暴露出治理、渠道控制和证据风险。在诉讼和技术基准得到解决前，应把规模视为线索，而不是不可攻破护城河的证明。
