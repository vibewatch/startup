      - number: '1.3'
        title: 融资历史、扩张里程碑与未决风险
        blocks:
          - type: paragraph
            body: >-
              指定证据中最近披露的融资是 2022 年 4 月完成的 1 亿美元 D 轮，估值为 26
              亿美元。这是历史交易估值，不代表当前估值或现金余额。累计融资额、老股转让、债务安排、现金跑道和收购对价仍不可得。后续扩张明显依赖收购：Oz Forensics 和 Trully.AI 于 2024
              年宣布被收购，OwnID 的 passkey 业务于 2025 年支持其进入美国市场，后续一则报道称公司自成立以来已完成十次收购。

              收购计划扩大了活体检测、反欺诈攻击、passkey 和地域能力，但未披露的购买价格和整合成本使资本效率无法评估。反向证据有限却并非不存在：Biometric Update 的公司页面列出一宗 2026 年 6
              月的争议，Unico 指控 Experian
              子公司“搭便车”使用人脸生物识别核验。指定来源没有披露诉状、审理机构、请求的救济或财务暴露。因此，这一事件应视为仍在进行的尽调事项，而不是已解决的负债或任一方存在不当行为的证明。
