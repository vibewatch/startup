              - CO013
      - number: '1.2'
        title: 领导层、治理与关键人物暴露
        blocks:
          - type: paragraph
            body: >-
              创始人 Diego Martins 仍被认定为 CEO，也是 2026 年全球扩张的公开发言人。创始团队还包括 Rui Jordao 和 Paulo
              Alencastro，但指定来源没有确定他们当前的运营或治理职务。为支持国际扩张，Unico 招募了拥有 Google、Meta、Apple、P&G、Hotmart、EBANX 和 EY
              背景的领导者。这套阵容显示公司试图补强深度伪造、设计、商业化和财务能力，但现有报道并未持续披露准确职衔、汇报关系、任期、股权或决策权。

              治理透明度同样不足。据报道，Goldman Sachs 领投 2022 年 D 轮并获得董事会席位，SoftBank 和 General Atlantic
              则以现有投资者身份参与。指定来源没有提供完整的现任董事会名单、股权表、投票安排、创始人持股或收购后的整合架构。因此，创始人兼 CEO
              在战略和对外沟通中的核心地位确实带来合理的关键人物暴露，但没有公司原始记录，无法量化其控制程度。
            claimRefs:
