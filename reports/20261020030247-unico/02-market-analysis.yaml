schemaVersion: report-v2
artifact: market-analysis
slug: unico
runDate: 2026-10-20
company:
  name: Unico
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Unico addresses identity verification, transaction authentication, fraud prevention,
    and emerging age-assurance workflows in a digitally mature Brazilian market, with
    current company-reported growth concentrated in international expansion. Public
    evidence supports strong usage and adoption proxies, but not a defensible
    revenue-based TAM, SAM, or SOM.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The investable market is narrower than all cybersecurity or all digital identity
      spending. Unico's evidenced scope begins where an enterprise must establish that a
      person is real and entitled to perform a digital action: onboarding, recurring
      authentication, payment authorization, fraud-risk orchestration, and age assurance.
      It includes liveness, anti-spoofing, passkeys, and identity-risk signals when they
      are sold as part of that decision. It excludes payment-rail economics, general data
      infrastructure, and unrelated document-management spend. Status-quo substitutes
      include manual review, document-only checks, one-time KYC, passwords, and internal
      fraud rules; the evidence pool does not quantify their spend or displacement rate.
    claimRefs: [CM001, CM007, CM013, CM015]
    tableRefs: [TM001]
  - id: evidence-constrained-sizing
    title: Evidence-constrained sizing
    body: >-
      The available figures are useful demand markers but are not interchangeable market
      sizes. A reported projection above $50 billion by 2034 describes a broad global
      digital-identity category without a disclosed methodology. Brazil's 142 million
      active Pix users and 12 million business recipients show a large digital-transaction
      surface, while Unico's 170 million identities, more than 400 enterprise clients, and
      1.5 billion annual checks describe company reach or workload. None supplies price,
      eligible workload, win rate, or addressable spend. Accordingly, the analysis does
      not convert users, businesses, identities, or transactions into revenue TAM, SAM,
      or SOM.
    claimRefs: [CM002, CM006, CM009, CM010, CM011, CM014, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, and adoption path
    body: >-
      The strongest evidenced buyer concentrations are banks, large retailers, betting
      operators, and other enterprises exposed to remote onboarding and transaction
      fraud. Consumers are the verified users, but the enterprise typically pays through
      fraud, risk, compliance, payments, security, or trust-and-safety budgets. Adoption
      starts with a high-loss or regulated workflow, integrates identity decisions into
      an existing transaction path, and can expand into repeat authentication and adjacent
      fraud controls. Brazil's high bank-account penetration and Pix usage lower the
      digital-access barrier, but they do not establish enterprise willingness to pay or
      Unico's obtainable share.
    claimRefs: [CM001, CM008, CM009, CM010, CM011, CM015]
    tableRefs: [TM003]
  - id: drivers-constraints-and-timing
    title: Growth drivers, constraints, and timing
    body: >-
      Company-reported first-quarter 2026 indicators point to demand momentum: identity
      verification volume increased 84% year over year, international revenue increased
      130%, and Mexico transaction volume increased 204% quarter over quarter. These are
      Unico metrics, not independent market-growth estimates. Structural drivers include
      AI-enabled impersonation, dense digital-payment usage, cross-border expansion, and
      new age-assurance obligations. Constraints are equally material: sensitive biometric
      data requires strong privacy controls and high availability, fraud persists even on
      mature rails, regulation remains in implementation, and integrations create
      switching costs. Adoption should therefore be modeled workflow by workflow, not as
      an immediate conversion of the broad category forecast.
    claimRefs: [CM003, CM004, CM005, CM012, CM013, CM015]
