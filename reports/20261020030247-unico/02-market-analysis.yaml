    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - [Banks and fintechs, "Fraud, risk, compliance, or digital banking leader", "Account applicant or transacting customer", Financial institution, "Onboarding and high-risk transaction authentication", "Fraud / risk / compliance", "Account takeover, synthetic identity, or regulatory control gap"]
      - [Large retailers and ecommerce, "Payments or fraud leader", Shopper, Merchant, "Checkout identity and card-ownership validation", "Payments / loss prevention", "Chargebacks, account abuse, or conversion pressure"]
      - [Betting and gaming, "Compliance or fraud leader", Player, Operator, "Identity, age, and transaction checks", "Compliance / trust and safety", "Age assurance and fraud exposure"]
      - [Child-accessible digital services, "Trust-and-safety or compliance leader", "Child, adolescent, or guardian", Platform operator, "Age estimation or documentary age verification", "Trust and safety / compliance", "ECA Digital implementation and ANPD guidance"]
      - [Cross-border enterprises, "Regional fraud or security leader", "Remote customer or workforce user", Enterprise, "Localized identity and fraud decisions", "Security / fraud operations", "Expansion into Mexico, the United States, and other markets"]
      - [Smaller Brazilian businesses, "Founder, operations, or risk owner", Customer, Business, "Self-service identity verification through a channel", "Operations / fraud", "Need for lower-friction access to enterprise identity infrastructure"]
    notes: >-
      Segment presence is source-backed, while buyer titles and budget ownership are
      analytical inferences; procurement authority, sales-cycle length, and budget size
      remain private-evidence gaps.
    claimRefs: [CM001, CM005, CM007, CM008, CM013, CM015]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      A qualitative evidence stack separates broad digital reach from Unico-specific
      activity and obtainable revenue.
    data:
      items:
        - label: Broad category forecast
          displayValue: "More than $50B by 2034"
          detail: "Global digital-identity projection cited by Unico; methodology not disclosed."
          claimRefs: [CM014]
        - label: Brazil digital access
          displayValue: "96.4% banked in 2024"
          detail: "Digital readiness indicator, not an identity-verification spending pool."
          claimRefs: [CM011]
        - label: Active payment population
          displayValue: "142M Pix users in April 2026"
          detail: "About 93% of Brazilian adults initiated at least one Pix transaction."
          claimRefs: [CM009]
        - label: Business transaction surface
          displayValue: "12M Pix-receiving businesses"
          detail: "Potential workflow surface; not a count of Unico prospects or customers."
          claimRefs: [CM010]
        - label: Unico network activity
          displayValue: "170M identities; 1.5B annual checks"
          detail: "Partner and company-reported reach with different denominators."
          claimRefs: [CM006]
        - label: Current expansion momentum
          displayValue: "84% volume growth; 130% international revenue growth"
          detail: "First-quarter 2026 company-reported indicators, not category growth rates."
          claimRefs: [CM003, CM004, CM005]
        - label: Obtainable revenue
          displayValue: "Not publicly derivable"
          detail: "Pricing, eligible workload, conversion, retention, and segment mix are undisclosed."
          claimRefs: [CM016]
    approximationNotes: >-
      Layers are ordered from broad context to company-specific evidence and do not use
      proportional widths. The values are non-comparable and do not constitute a numeric
      TAM-to-SOM conversion.
    claimRefs: [CM003, CM004, CM005, CM006, CM009, CM010, CM011, CM014, CM016]
callouts:
  - calloutType: strength
    title: International activity is the clearest current demand signal
    body: >-
      Unico reported 84% year-over-year verification-volume growth, 130% international
      revenue growth, and 204% quarter-over-quarter Mexico transaction growth in the first
      quarter of 2026. These indicators support product demand but do not independently
      measure category growth.
    claimRefs: [CM003, CM004, CM005]
  - calloutType: risk
    title: The public market-size bridge is incomplete
    body: >-
      The available category forecast, population adoption, business participation,
      identities, clients, and transaction counts have incompatible denominators. A
      valuation model should not turn them into revenue opportunity without pricing,
      eligible-workload, conversion, and retention evidence.
    claimRefs: [CM014, CM016]
