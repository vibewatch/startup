      - [Age assurance, "Facial age estimation and document verification for age-gated access", "General content moderation and child-safety tooling", "Compliance or trust-and-safety owner", "Emerging regulated adjacency"]
      - [Identity-enabled commerce, "Cardholder identity and ownership verification at checkout", "The underlying payment rail and merchant acquiring", "Merchant fraud or payments organization", "Adjacent transaction workflow"]
      - [Cloud data infrastructure, "Only the identity application and decisioning layer", "Warehousing, databases, and generic observability", "Technology organization", "Supplier layer rather than addressable identity spend"]
    notes: >-
      Scope is an analytical boundary derived from the retained product, partner, and
      regulatory sources; budget ownership is inferred and requires customer-level
      procurement validation.
    claimRefs: [CM001, CM007, CM013, CM015]
  - id: TM002
