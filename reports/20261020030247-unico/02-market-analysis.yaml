    columns:
      - Lens
      - Publisher
      - Period / geography
      - Value
      - Methodology
      - Confidence
      - Limitation
    rows:
      - ["Broad digital-identity category", "Biometric Update, reporting Unico's cited projection", "2034 / global", "More than $50B", "Underlying forecast methodology not disclosed in the fetched article", Low, "Broader than Unico's evidenced sellable scope"]
      - [Active digital-payment population, Mobile Time citing Banco Central do Brasil, "April 2026 / Brazil", "142M people; about 93% of adults", "People initiating at least one Pix transaction", Medium, "Adoption denominator, not spend or identity-verification demand"]
      - [Business digital-payment surface, Mobile Time citing Banco Central do Brasil, "April 2026 / Brazil", "12M businesses receiving Pix", "Businesses receiving instant payments", Medium, "Potential entity universe, not verified buyers"]
      - [Enterprise customer base, Embedded Finance Index, "2025 / not specified", "More than 400 IDCloud enterprise clients", "Third-party profile statement", Low, "No segment mix, contract value, or active-client definition"]
      - [Identity network reach, Google Cloud customer case, "Current page / global", "170M identities", "Partner case-study statement", Medium, "Population metric; not annual users or paying customers"]
      - [Verification workload, "Google Cloud and Biometric Update", "2025 or annual / global", "1.5B identity verifications or checks", "Partner case and company-reported activity", Medium, "Transaction count; not unique people, revenue, or market size"]
    notes: >-
      Values use different units, populations, periods, and issuers and must not be added
      or converted into TAM/SAM/SOM; no public price, eligible-workload, or win-rate bridge
      was available.
    claimRefs: [CM002, CM006, CM009, CM010, CM011, CM014, CM016]
