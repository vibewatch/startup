company:
  name: "Rappi"
chapter:
  number: 3
  title: "Competitors"
  summary: "Rappi competes with global delivery platforms, strong regional operators, and adjacent logistics networks, but the available evidence supports only an ordinal comparison rather than market-share or pricing leadership. Its best-documented differentiation is breadth across services plus merchant analytics and integration tooling; the durability of that advantage remains unproven because comparable rival capabilities, realized pricing, exclusivity, and multi-homing data are not public in the assigned evidence."
sections:
  - id: "landscape-and-alternatives"
    title: "Landscape, Direct Peers, and Substitutes"
    body: |
      The competitive set is broader than restaurant delivery. Independent directories consistently identify Uber Eats and iFood as direct peers, while a separate regional directory identifies PedidosYa as a direct competitor in Uruguay, Argentina, and Chile [CP001, CP002]. Tracxn uses a wider global peer set—DoorDash, Glovo, and Delivery Hero—showing that the comparison changes with the geographic and corporate lens [CP003]. Rappi itself is presented as a multi-vertical service spanning food, grocery, pharmacy, other retail, payments, and travel, and Statista describes operations across nine Latin American countries and more than 400 cities [CP004, CP005]. Adjacent pressure also matters: Mercado Envíos can substitute for parts of Rappi's retail-logistics proposition, while JOKR is listed against rapid grocery delivery [CP012]. The evidence does not establish that every named platform overlaps in every country, so the profile table treats the landscape as a partial, evidence-bounded sample rather than an exhaustive market map.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP004"
      - "CP005"
      - "CP012"
    tableRefs:
      - "TP001"
    figureRefs:
      - "FP001"
  - id: "capability-and-distribution"
    title: "Capability, Merchant Workflow, and Distribution"
    body: |
      Rappi's strongest documented capability evidence concerns the merchant side of the network. RappiOne exposes performance metrics by country, city, category, manufacturer, and brand, while the restaurant API covers menus, orders, schedules, stock availability, and webhooks [CP006, CP008]. A 2021 engineering account described 15 restaurant-domain squads working across the customer app, restaurant onboarding, advertising, operations, and partner self-service, which demonstrates historical organizational investment but not current staffing or superior execution [CP009]. These tools can deepen operational integration because merchants connect catalogs and order workflows to Rappi; however, the public documentation contains no exclusivity term or switching-cost measurement [CP013]. The assigned evidence also lacks equivalent official product and developer documentation from Uber Eats, iFood, and PedidosYa. Accordingly, the capability matrix marks unsupported rival cells as unknown rather than assuming parity or inferiority, and it distinguishes documented functionality from competitive proof.
    claimRefs:
      - "CP006"
      - "CP008"
      - "CP009"
      - "CP013"
    tableRefs:
      - "TP002"
  - id: "pricing-scale-and-moat"
    title: "Pricing, Scale Signals, and Moat Durability"
    body: |
      Public scale signals show substantial capital behind the category but do not reveal operating liquidity or market share. Tracxn reports that Rappi raised $2.46 billion over 15 rounds and records a $25 million Series F in September 2025; these are financing amounts, not cash available [CP010]. The same source profiles iFood as a Brazil-based food-and-grocery platform with $592 million of funding, while other independent sources place Uber Eats and PedidosYa in Rappi's direct set [CP001, CP002, CP011]. On pricing, the clearest primary evidence is merchant-facing: RappiOne provides a three-month trial, followed by a privately agreed subscription charge that is separate from the Rappi marketplace commission [CP007]. Secondary descriptions also identify RappiPrime as a monthly subscription with delivery and discount benefits [CP016]. No assigned source provides comparable current fees, merchant take rates, discount depth, or contract terms for the major rivals. The defensible conclusion is therefore narrow: breadth and integration create potential retention levers, but the evidence cannot establish lock-in, pricing power, or a durable moat [CP013, CP014].
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP007"
      - "CP010"
      - "CP011"
      - "CP013"
      - "CP014"
      - "CP016"
    tableRefs:
      - "TP003"
