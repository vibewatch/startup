callouts:
  - calloutType: "risk"
    title: "Moat evidence is incomplete"
    body: "Rappi's merchant integrations and multi-service breadth are documented, but the assigned sources do not quantify exclusivity, consumer or courier multi-homing, retention lift, competitor pricing, or realized switching costs. Those omissions prevent a high-confidence durability conclusion."
    claimRefs:
      - "CP013"
      - "CP014"
