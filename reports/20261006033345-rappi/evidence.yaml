evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: parent-level-financials
    missingEvidence: >-
      Audited consolidated parent-level income statements, balance sheets, and cash flow statements for FY2024–2025
      across all nine Latin American operating countries.
    whyItMatters: >-
      While Colombia operations disclose statutory net income through Superintendencia de Sociedades, parent-level group
      profitability, cash burn, and international vertical contributions remain unknown.
    diligencePath: >-
      Review public S-1 registration statement once filed with the SEC or request audited parent financials from
      management during diligence.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-governance
    missingEvidence: >-
      Fully diluted cap table, shareholder voting agreements, and senior liquidation preference tiers across Series Seed
      through Series F.
    whyItMatters: >-
      Understanding downside protection, liquidation priority, and founder voting control is critical for underwriting
      equity valuation and secondary transactions.
    diligencePath: Request confidential cap table waterfall and shareholder rights agreement under NDA from Rappi investor relations.
    relatedQuestionRefs:
      - QO010
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: Comprehensive roster of regional country managers, corporate vice presidents, and board committee members.
    whyItMatters: >-
      Full organizational visibility ensures diligence can evaluate key-person dependencies across non-Colombian
      operating jurisdictions.
    diligencePath: >-
      Cross-reference local corporate registry filings in Mexico and Brazil and conduct direct management team
      interviews.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Exact equity ownership percentages, debt repayment covenants, and secondary transfer restrictions for all
      institutional holders.
    whyItMatters: >-
      Enables precise calculation of dilution, debt service obligations, and overhang on potential IPO share lockup
      expirations.
    diligencePath: >-
      Request complete capitalization table schedule and credit facility agreements from lead underwriter or company
      counsel.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-financials-gmv
    missingEvidence: >-
      Audited parent-level income statement, gross merchandise value (GMV), and revenue breakdown by country and
      business segment for FY2024-2025.
    whyItMatters: >-
      Without audited financial disclosures, market sizing and platform take rate calculations rely on executive
      commentary and outside-in digital traffic estimates.
    diligencePath: >-
      Review Rappi's eventual Form S-1 / F-1 SEC registration statement prior to public listing, or request confidential
      audited disclosures during secondary transactions.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Current country-specific consumer fees, merchant commission schedules, discount depth, and realized contract rates
      for Rappi, Uber Eats, iFood, and PedidosYa.
    whyItMatters: >-
      Without like-for-like prices and denominators, the analysis cannot distinguish sustainable pricing power from
      promotion-funded volume.
    diligencePath: >-
      Collect dated mystery-shop baskets and executed merchant contracts in matched cities, normalizing taxes, delivery
      distance, basket size, and promotional credits.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: material
    topic: multi-homing-and-lock-in
    missingEvidence: >-
      Consumer, courier, and merchant multi-homing rates plus retention cohorts attributable to RappiPrime, RappiOne,
      and API integrations.
    whyItMatters: >-
      The durability of network effects depends on whether documented tooling changes retention or merely makes
      participation easier on multiple platforms.
    diligencePath: >-
      Request cohort retention, exclusive-supply share, API-connected merchant churn, and courier overlap data by
      country and compare them with matched competitor cohorts.
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-profile-table
    missingEvidence: >-
      An exhaustive country-by-country roster of direct platforms, retailer-owned delivery, merchant direct ordering,
      and internal logistics alternatives.
    whyItMatters: The sampled landscape may omit local leaders or status-quo substitutes that are material in individual cities.
    diligencePath: >-
      Build a city-level competitor census from official app availability, merchant panels, and current
      transaction-share data.
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
    topic: liquidity
    missingEvidence: Current unrestricted cash, monthly cash flow, burn, capex, debt service, covenant headroom, and downside runway.
    whyItMatters: >-
      Funding raised and positive EBITDA do not establish available cash or the ability to service secured debt through
      a downside case.
    diligencePath: >-
      Obtain the latest monthly balance sheet, cash-flow statement, treasury schedule, debt agreement, covenant
      certificate, and board-approved operating plan.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Gross margin, contribution margin, courier and incentive cost per order, CAC, retention, purchase frequency, and
      payback by country and vertical.
    whyItMatters: >-
      Public revenue growth and adjusted EBITDA cannot show whether mature cohorts or individual markets create durable
      cash contribution.
    diligencePath: >-
      Request monthly cohort and order-level unit-economics exports reconciled to the general ledger for FY2024 through
      the latest month.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue-basis
    missingEvidence: >-
      Audited consolidated revenue by year with a bridge among GMV, gross billings, net revenue, run-rate revenue, LTM
      revenue, and segment eliminations.
    whyItMatters: >-
      The repeated $856 million figure is attached to different periods and may represent an estimate rather than a
      consistent accounting measure.
    diligencePath: >-
