company:
  name: Rappi
chapter:
  number: 1
  title: Company Overview
  summary: Rappi is a Latin American super-app platform spanning on-demand delivery, merchant commerce, and financial services across nine countries. Following nearly a decade of venture-backed expansion that raised over $2.4 billion, the company reached statutory profitability in Colombia in 2024 and 2025 while navigating governance changes, debt facilities, and a strategic alliance with Amazon.
sections:
  - id: corporate-identity-and-business-model
    title: Corporate Identity and Multi-Vertical Super-App Model
    body: Rappi was established in Bogotá, Colombia in 2015 by entrepreneurs Simón Borrero, Sebastián Mejía, and Felipe Villamarín, initially operating as an on-demand delivery platform for neighborhood merchants and consumers. Over a decade of aggressive execution, the enterprise expanded beyond food delivery into a comprehensive regional super-app incorporating grocery logistics, pharmacy orders, e-commerce fulfillment, and financial services through RappiPay and RappiCard. The platform currently operates across nine Latin American nations—including Colombia, Mexico, Brazil, Argentina, Chile, Peru, Uruguay, Ecuador, and Costa Rica—covering more than 400 metropolitan cities. Commercial operations are administered by RAPPI S.A.S., which coordinates developer APIs, merchant store onboarding, and the RappiOne analytics platform for enterprise brand allies. Statutory filings in Colombia demonstrate that domestic operations generated 767,316 million Colombian pesos ($236.55 million USD) in 2025 revenue, reflecting substantial monetization across core delivery and financial verticals.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO010
      - CO011
    tableRefs:
      - TO001
  - id: leadership-and-corporate-governance
    title: Founders, Leadership Structure, and Governance Evolution
    body: The core founding trio—Simón Borrero (Chief Executive Officer), Sebastián Mejía, and Felipe Villamarín—guided Rappi through multiple hypergrowth cycles following their incubation at Y Combinator in 2016. In 2024, the enterprise marked an important corporate governance milestone when Sebastián Mejía stepped down from his executive role as operational president after nearly ten years, transitioning into a non-executive stewardship role on the Board of Directors. Domestic geographic management is anchored by country heads such as Matías Laks, CEO of Rappi Colombia, who oversees operational scale exceeding eight million monthly deliveries. Engineering execution is structured into specialized functional business units; for example, the restaurant engineering vertical encompasses over 140 technical personnel and 15 agile squads directed by VP of Engineering Facundo Viale. Major institutional capital partners hold formal board representation, notably SoftBank Investment Advisers managing partner Jeffrey Housenbold, ensuring institutional alignment across global growth initiatives.
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO006
    tableRefs:
      - TO002
  - id: capitalization-investors-and-debt-structure
    title: Capitalization History, Institutional Investors, and Debt Facilities
    body: Rappi is among the most heavily capitalized private technology startups in Latin America, having raised approximately $2.46 billion in total funding across 15 financing rounds. The company made history in September 2018 when a Series D round led by DST Global propelled its post-money valuation past $1.0 billion, establishing Rappi as Colombia's first technology unicorn. Institutional capitalization accelerated dramatically in April 2019 when Japan's SoftBank Group Corp committed $1.0 billion through an equal split between its SoftBank Vision Fund and newly created Latin America Innovation Fund. High-profile early and growth syndicate investors include Sequoia Capital, Andreessen Horowitz, Delivery Hero, and Y Combinator. Recent capital actions demonstrate a shift toward structured liquidity and commercial alignment, marked by a $100 million conventional debt facility arranged with Banco Santander in August 2025 and a $25 million Series F convertible transaction with Amazon in September 2025.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
    tableRefs:
      - TO003
  - id: scale-metrics-and-financial-turning-point
    title: Operating Scale, Regional Footprint, and Financial Turning Point
    body: "Following nearly a decade dominated by aggressive geographic expansion and substantial cash burn, Rappi achieved a pivotal financial inflection point in its domestic market. Filings compiled by Colombia's Superintendencia de Sociedades reveal that Rappi registered positive net income for two consecutive operating periods: generating a net profit of 97,250 million Colombian pesos in 2024, followed by 210,176 million pesos ($64.82 million USD) in 2025, representing an annual profit expansion of 116%. This turnaround stands in stark contrast to its historical capital deployment, where accumulated losses had mounted to 1.2 trillion Colombian pesos ($369.99 million USD) against 1.8 trillion pesos in cumulative revenue through 2023. While third-party market intelligence estimates Rappi's global run-rate revenue at roughly $1.3 billion ARR with an employee footprint between 12,600 and 14,849 personnel, consolidated parent-level audited financials covering Mexican and Brazilian subsidiaries remain undisclosed private records."
    claimRefs:
      - CO010
      - CO011
      - CO012
      - CO013
  - id: strategic-milestones-partnerships-and-risks
    title: Corporate Milestones, Strategic Alliances, and Operational Headwinds
    body: Rappi's evolution from a scrappy courier app in 2015 to a diversified Latin American platform has been punctuated by major commercial partnerships and persistent operating complexities. In September 2025, the company entered a high-profile strategic relationship with Amazon to explore integrating last-mile parcel logistics with Rappi's courier network and evaluating mutual subscription bundling between Rappi Prime and Amazon Prime. Nonetheless, scaling rapid on-demand logistics introduces critical operational bottlenecks. Rappi's agile fleet is inherently structured around motorcycle and bicycle couriers handling small restaurant orders and groceries, creating capacity constraints for larger retail parcels. Concurrently, public reports highlight service friction regarding customer support response times and delivery accuracy, while labor regulators across Latin America increasingly scrutinize the independent contractor status of tens of thousands of gig couriers, creating prospective cost pressures.
    claimRefs:
      - CO001
      - CO006
      - CO007
      - CO010
      - CO014
      - CO015
    figureRefs:
      - FO001
