callouts:
  - calloutType: insight
    title: Pivot from Subsidized Hypergrowth to Local Unit Profitability
    body: Rappi's audited Colombian filings demonstrate an inflection from historical cash burn (1.2 trillion COP in accumulated losses through 2023) to consecutive net profits of 97.25B COP in 2024 and 210.18B COP in 2025. However, consolidated parent-level financials covering Mexico, Brazil, and other regional operations remain private and undisclosed.
    claimRefs:
      - CO010
      - CO011
      - CO012
  - calloutType: risk
    title: Labor Regulation and Courier Network Bottlenecks
    body: Rappi's agile gig-economy courier model faces mounting regulatory headwinds across Latin American jurisdictions debating mandatory benefits and formal employee classification. In parallel, strategic expansion with partners like Amazon tests courier capacity optimized strictly for small-parcel delivery.
    claimRefs:
      - CO014
      - CO015
