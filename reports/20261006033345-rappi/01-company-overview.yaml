  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: parent-level-financials
      missingEvidence: Audited consolidated parent-level income statements, balance sheets, and cash flow statements for FY2024–2025 across all nine Latin American operating countries.
      whyItMatters: While Colombia operations disclose statutory net income through Superintendencia de Sociedades, parent-level group profitability, cash burn, and international vertical contributions remain unknown.
      diligencePath: Review public S-1 registration statement once filed with the SEC or request audited parent financials from management during diligence.
      relatedQuestionRefs:
        - QO009
    - type: private-evidence-only
      severity: material
      topic: cap-table-and-governance
      missingEvidence: Fully diluted cap table, shareholder voting agreements, and senior liquidation preference tiers across Series Seed through Series F.
      whyItMatters: Understanding downside protection, liquidation priority, and founder voting control is critical for underwriting equity valuation and secondary transactions.
      diligencePath: Request confidential cap table waterfall and shareholder rights agreement under NDA from Rappi investor relations.
      relatedQuestionRefs:
        - QO010
    - type: enumeration-incomplete
      severity: minor
      topic: leadership-and-founder-table
      missingEvidence: Comprehensive roster of regional country managers, corporate vice presidents, and board committee members.
      whyItMatters: Full organizational visibility ensures diligence can evaluate key-person dependencies across non-Colombian operating jurisdictions.
      diligencePath: Cross-reference local corporate registry filings in Mexico and Brazil and conduct direct management team interviews.
      relatedTableRefs:
        - TO002
    - type: enumeration-incomplete
      severity: minor
      topic: stakeholder-or-investor-map
