figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Rappi 自 2015 年成立至 2026 年的重要公司、融资、产品与治理里程碑。
    claimRefs:
      - CO001
      - CO006
      - CO007
      - CO010
      - CO014
      - CO015
    data:
      items:
        - label: 在波哥大成立
          date: '2015'
          detail: Simón Borrero、Sebastián Mejía 和 Felipe Villamarín 在哥伦比亚创办 Rappi，提供按需快递与饮品配送服务。
          tone: positive
        - label: Y Combinator 加速
          date: '2016'
          detail: Rappi 参加 Y Combinator W16 批次，获得 Sequoia Capital 和 Andreessen Horowitz 的早期硅谷风险投资支持。
          tone: positive
        - label: 哥伦比亚首家独角兽
          date: 2018-09
          detail: Rappi 完成 DST Global 领投的 Series D 轮融资，估值超过 $1.0B，成为哥伦比亚首家科技独角兽。
          tone: positive
        - label: SoftBank $1B 投资
          date: 2019-04
          detail: SoftBank 通过 Innovation Fund 和 Vision Fund 承诺投资 $1B；Jeffrey Housenbold 加入董事会。
          tone: positive
        - label: 金融科技与多垂直扩张
          date: 2020–2021
          detail: 推出 RappiPay 金融服务和 RappiOne B2B 分析平台；业务覆盖 9 个拉美国家和 400+ 座城市。
          tone: neutral
        - label: 治理转变与创始人交接
          date: '2024'
          detail: 联合创始人 Sebastián Mejía 任职近十年后卸任运营总裁，转任董事会成员。
          tone: warning
        - label: 哥伦比亚转向盈利
          date: 2024–2025
          detail: Rappi 报告称其在哥伦比亚连续实现年度净利润：2024 年为 97.25B COP，2025 年为 210.18B COP（$64.8M USD）。
          tone: positive
        - label: Amazon 合作与债务融资
          date: '2025'
          detail: 2025 年 8 月从 Santander 获得 $100M 债务额度，并于 2025 年 9 月获得 Amazon $25M 战略支持。
          tone: positive
        - label: 零工劳动审查与快递员瓶颈
          date: 2025–2026
          detail: 区域政府加强对零工快递员劳动保护的审查；配送模式扩大大件包裹物流时面临挑战。
          tone: adverse
  - id: FM001
    title: 可触达市场与运营规模分层金字塔
    type: pyramid
    summary: 从拉美城市食品与零售总支出，到活跃平台用户及快递基础设施的分层规模。
    data:
      items:
        - label: 拉美零售食品与饮品总支出
          value: $150B+ Latin American macro retail food/grocery universe
        - label: 可服务数字按需支出（SAM）
          value: Urban metropolitan population across 9 operating countries
        - label: Rappi 平台地理覆盖
          value: 400+ cities in Colombia, Mexico, Brazil, Argentina, Chile, Peru, etc.
        - label: 活跃平台用户基础
          value: 35M+ registered active consumer accounts
        - label: 履约基础设施
          value: 350,000 delivery riders and tens of thousands of merchant allies
        - label: 平台变现抽成
          value: Commission take rates, delivery fees, and RappiOne subscription rental
    approximationNotes: 表示概念性的市场获取层级，将宏观地理覆盖与运营平台指标结合。
