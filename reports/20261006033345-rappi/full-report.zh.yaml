      - number: '8.2'
        title: 资本化结构、二级市场定价与入场纪律
        blocks:
          - type: paragraph
            body: >
              Rappi 15 轮累计融资 $2.46B，包括两轮种子轮、三轮早期股权轮、七轮后期股权轮和三笔常规债务融资。机构股权支持者包括 SoftBank（2019 年 4 月领投 $1B Series E）、DST
              Global（2018 年 9 月领投 $220M Series D）、Delivery Hero（2018 年 4 月领投 $185M Series C）、Andreessen Horowitz、Sequoia
              Capital，以及 T. Rowe Price（2021 年 7 月领投 $500M Series F，投后估值 $5.25B）。2025 年 8 月，Rappi 从 Banco Santander 和
              Kirkoswald Capital Partners 获得 $100M、期限 4 年的优先担保信贷，用于再融资和营运资金；此前还有 2022 年 3 月 $145M、2022 年 10 月 $112M
              的债务融资。


              Nasdaq Private Market（NPM）二级市场数据和私募市场估计显示，截至 2026 年 9 月，指示性交易价格约为每股 $19.83–$19.89，对应企业股权估值约 $1.7B 至
              $2.0B。这比 $5.25B 的优先股 headline mark 压缩 62% 至 68%。由于优先股堆叠通常保证 Series E 和 F 投资者先于普通股或二级股获得 1x
              不参与或参与式资本回报，若最终上市或出售交易低于 $2.5B，二级买方可能面临全部损失或严重次级化。严格的入场纪律要求避免以超过 trailing GMV 或未经验证净收入 2.0x
              的价格作出一级承诺，并要求完整的股权表瀑布可见性。
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: 情景分析、同业倍数与尽调核验
        blocks:
          - type: paragraph
            body: >
              估值情景在截至 2028 年末的 24 个月周期内，模拟三条截然不同的经营轨迹。乐观情景（概率 25%）假设 Amazon Now
              在墨西哥和巴西的杂货物流顺利落地，推动高毛利零售媒体广告业务（RappiAds）占净收入超过 15%，EBITDA 持续为正且年化超过 $100M，并以净收入 3.0 倍成功赴美 IPO（企业价值
              $2.8B–$3.5B）。基准情景（概率 50%）预计区域温和增长；巴西市场仍受 iFood 挤压利润，Rappi 已承诺在 2028 年前投入 R$1.4B；公司可能延迟上市，或以净收入 1.5–2.0
              倍进行折价交叉轮融资（企业价值 $1.6B–$2.1B），与当前二级市场交易标记大致一致。


              悲观情景（概率 25%）反映存量配送运营商加剧竞争反击、拉美各国货币汇率波动、巴西扩张亏损以及金融科技资产减值。在这一情景中，企业价值压缩至 $1.0B
              以下，普通股权益价值归零，初级优先股层级落到高级债务和优先清算层级之下。尽调核验应优先取得母公司经审计财务报表，审阅 Banorte 为 RappiCard Mexico 提供的 $50M 剥离安排条款，检查
              RappiPay Colombia 的监管资产负债表，并确认 $100M Santander 融资项下的债务契约是否完全合规。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 资本纪律：完成 S-1 核验前暂缓新增资本
            body: >-
              机构投资者不应认购未定价的一级融资，也不应按反映 2021 年 $5.25B 峰值的价格认购二级股权。二级市场观察到的 65%
              折价（$1.7B–$2.0B），是市场对拉美平台执行力、区域货币逆风和优先权悬置进行理性定价的结果。应持续跟踪 Rappi，直到 SEC S-1 披露核验合并经审计数据。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV014
          - type: callout
            title: 高级优先股堆叠与债务压顶
            body: >-
              累计 $357M 的债务融资中，包括 2025 年 8 月 Santander 和 Kirkoswald 提供的 $100M 高级担保贷款；再加上 $2.1B+
              的累计优先股风险资本，次级股东面临严重的次序劣后风险。任何低于 $2.5B 的退出交易，都可能让普通股股东和次级期权池几乎拿不到价值。
            calloutType: risk
            claimRefs:
              - CV005
              - CV008
              - CV010
              - CV015
