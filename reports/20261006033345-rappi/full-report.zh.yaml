            body: >-
              平台技术架构覆盖面向消费者的客户端应用、专用商户门户和后端整合引擎。对零售合作方，Rappi 提供 Integrations Manager 和相关 Developer
              Portals，用于技术支持、管理配置凭证和监控订单生命周期的 webhook 事件。为在需求高峰维持吞吐，Rappi 对接入方施加严格的运营绩效标准：商户 webhook 监听器和轮询客户端必须保持至少 98%
              的 API 请求成功率，并将轮询请求间隔至少拉开 45 秒，否则可能被撤销访问权限或从平台下架。除自有网页和移动界面外，第三方开发者还创建了命令行工具和 Model Context Protocol
              服务器，把外部 AI 助手及客户端脚本接入 Rappi 的目录和订单 API，凸显市场对可编程平台访问的需求。
