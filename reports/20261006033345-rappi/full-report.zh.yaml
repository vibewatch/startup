chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与多垂直超级应用模式
        blocks:
          - type: paragraph
            body: >-
              Rappi 由 Simón Borrero、Sebastián Mejía 和 Felipe Villamarín 于 2015 年在哥伦比亚 Bogotá
              创立，最初为社区商户和消费者提供即时配送平台。经过十多年激进执行，公司从餐饮配送扩展为区域超级应用，通过 RappiPay 和 RappiCard
              覆盖杂货物流、药房订单、电商履约和金融服务。平台目前运营于九个拉丁美洲国家——哥伦比亚、墨西哥、巴西、阿根廷、智利、秘鲁、乌拉圭、厄瓜多尔和哥斯达黎加——覆盖 400 多座大都会城市。商业运营由 RAPPI
              S.A.S. 管理，负责协调开发者 API、商户门店接入，以及面向企业品牌合作方的 RappiOne 分析平台。哥伦比亚法定报表显示，国内业务 2025 年收入为 767,316 million
              Colombian pesos（$236.55 million USD），核心配送和金融垂直业务已实现可观变现。
