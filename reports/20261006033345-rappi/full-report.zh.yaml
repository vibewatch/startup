              - CI008
      - number: '4.4'
        title: 资本充足性与财务结论
        blocks:
          - type: paragraph
            body: >-
              尽管融资渠道有迹象，资本充足性仍未解决。Tracxn 和 Sacra 均报告 2025 年 8 月有 $100 million 债务融资；Sacra
              将其描述为期限四年的优先担保融资，用于再融资和营运资金。另有第三方画像称 Rappi 将全部利润再投资，因此从调整后盈利到流动性的转换尤其重要。指定的 Nasdaq Private Market
              和招聘页面在保留文本中没有提供可用的 Rappi 专属价格、人员或财务指标，无法填补估值或成本基础缺口。因此财务结论是有条件的：多元收入流和报告中的正 EBITDA
              令人鼓舞，但债务、再投资和激进的运营复杂性，使审计报表、现金、消耗、契约余量和分部贡献利润率成为投资评估前提。
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI015
              - CI016
      - number: '4.5'
        title: 证据表
        blocks:
          - type: callout
            title: 盈利不等于流动性
            body: 报告中的正 EBITDA 和利润全部再投资，并不能揭示现金生成、偿债、营运资金需求或 runway；$100 million 债务融资进一步提高了现金流和契约审查的重要性。
            calloutType: risk
            claimRefs:
