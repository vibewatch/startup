      - number: '7.2'
        title: 运营可靠性、合作方摩擦与工程执行
        blocks:
          - type: paragraph
            body: >-
              Rappi 多边市场的运营完整性依赖零售合作方、配送物流和核心平台微服务之间紧密耦合的整合触点。Rappi 官方 Developer Portal
              揭示了订单生命周期机制固有的技术脆弱性。商户合作方只有严格的四分钟 SLA 窗口来接受或拒绝新订单，超时后 Rappi
              自动系统会触发不可逆的订单取消。此外，每笔订单只能处理一次；对已经处理或已超时的订单再次接受或拒绝，会触发无法恢复的系统错误。订单事件必须通过轮询端点查询，而访问令牌固定每 7
              天过期，因此数千个商户系统需要持续自动刷新凭证。当合作方因 SKU 不匹配、价格差异或缺少配料而拒单时，履约链条会中断并损害消费者留存。从工程和组织角度看，技术领导层的历史反思描述了规模化挑战：超过 140
              名工程师组成的 15 个小组需要在没有银弹的情况下处理遗留工作、速度瓶颈和基础设施可靠性。持续在快速上市与平台稳定之间平衡，使商户不满、客户流失和高峰期运营中断始终存在。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
