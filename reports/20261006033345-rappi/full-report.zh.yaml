      - number: '1.3'
        title: 资本化历程、机构投资者与债务融资
        blocks:
          - type: paragraph
            body: >-
              Rappi 是拉丁美洲资本最充足的私营科技初创企业之一，15 轮融资累计约 $2.46 billion。2018 年 9 月，由 DST Global 领投的 Series D 将其投后估值推过 $1.0
              billion，使 Rappi 成为哥伦比亚首家科技独角兽。2019 年 4 月，日本 SoftBank Group Corp 承诺投入 $1.0 billion，由 SoftBank Vision Fund
              和新设的 Latin America Innovation Fund 平分，机构资本化随之大幅提速。早期和成长期银团投资者还包括 Sequoia Capital、Andreessen
              Horowitz、Delivery Hero 和 Y Combinator。近期资本动作转向结构化流动性和商业协同：2025 年 8 月与 Banco Santander 安排 $100 million
              常规债务融资，2025 年 9 月又与 Amazon 完成 $25 million Series F 可转债交易。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
