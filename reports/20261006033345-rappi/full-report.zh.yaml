  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律敞口
        blocks:
          - type: paragraph
            body: >-
              Rappi 在九个拉丁美洲司法辖区运营，面临涵盖金融科技、反垄断合规、消费者保护和商户合同的复杂且不断变化的监管环境。最严重且已确认的监管执法涉及墨西哥国家反垄断委员会（CNA）：CNA 因未经授权的企业集中，对
              Grupo Financiero Banorte 和 Rappi 处以 MX$19.9 million（约 US$1.1 million）罚款。CNA 认定，双方执行了 2020 年 7 月 20
              日的联盟协议，设立了 RappiCard 背后的 Tarjetas del Futuro 合资企业，并在强制反垄断审批前赋予 Banorte 干预 Rappi 信用卡管理的运营权。虽然 Banorte 后来在
              2025 年 4 月获准以 US$50 million 收购 Rappi 剩余 44.28% 股权，并签订 15 年排他协议，但这项先例凸显了合资结构的严重执行风险。除反垄断处罚外，Rappi
              还面临商户合作方条款带来的法律敞口。由 Rappi S.A.S. 和 Rappi Inc. 管理的 RappiOne Ally Platform Terms and Conditions
              施加严格的单方面责任限制：Rappi 明确免除因平台停机或不可用造成的间接或直接损害责任，不保证连续 24 小时运行，并将自动目录重新分类导致的数据准确性风险转嫁给合作方。这些条款会与商业合作方产生摩擦，使
              Rappi 面临拉丁美洲消费者及商业监管机构的商业诉讼和审查。
