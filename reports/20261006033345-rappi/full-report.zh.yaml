  - id: FI001
    title: 从活动到利润的证据桥
    type: flow
    summary: 概念性桥接图将已观察到的变现机制，与达到毛利和现金流所需的私有输入区分开来。
    data:
      nodes:
        - id: activity
          label: 消费者与商户活动
          detail: Rappi 商户工具可见订单、销售额、频次、平均客单价及 SKU 指标。
        - id: transaction-revenue
          label: 交易收入
          detail: 商户佣金和客户配送费区间为估计值；实际抽成率未知。
        - id: recurring-and-media
          label: 订阅、广告与数据费用
          detail: Prime 与广告组合为估计值；RappiOne 有官方订阅机制，但价格未披露。
        - id: reported-revenue
          label: 已报告或估计收入
          detail: $856M 出现在两个第三方数据集中，但期间和会计口径尚未确定。
        - id: variable-costs
          label: 配送与服务成本
          detail: 快递员报酬、激励、退款、支付损失及商户支持成本尚无公开量化数据。
        - id: fixed-costs
          label: 技术与多市场运营
          detail: API、可靠性、国家集成、工程及监管义务构成可观察但未量化的成本层。
        - id: profit-and-cash
          label: 毛利、EBITDA 与现金流
          detail: 正 EBITDA 为管理层报告；毛利率、现金转化、烧钱速度和现金续航仍属私有信息。
    approximationNotes: 仅为概念性顺序；节点顺序不代表量化转化率、共同分母或经审计的会计确认。
    claimRefs:
      - CI011
      - CI012
      - CI016
  - id: FE001
    title: Rappi 多层运营架构栈
    type: stack
    summary: Rappi 运营架构的结构视图，涵盖客户端呈现、合作伙伴集成、ML 编排、持久化、云基础设施及可观测性。
    data:
      layers:
        - label: 客户体验层
          detail: 每两周分阶段发布的 iOS 和 Android 移动应用、消费者 Web 门户、购物车管理、本地化产品搜索及地址路由
        - label: 合作伙伴与 API 集成层
          detail: Developer Portal REST API、Webhook 分发、菜单目录同步、Integrations Manager 诊断，以及强制执行的 98% 请求可靠性标准
        - label: ML 与数据平台层
          detail: 基于 Kubernetes 的专有 RappiFlow Airflow 编排、JupyterHub 实验集群、跨小队特征库及实体向量嵌入
        - label: 数据持久化与交易层
          detail: Amazon RDS 关系数据库集群、Amazon DocumentDB 文档存储，以及用于合作伙伴配置和订单状态的分布式缓存
        - label: 云计算与容器底座
          detail: 1,000+ 个分布式微服务和 15,000+ 个活跃容器，通过 Amazon ECS 和 Kubernetes 集群在 AWS 区域可用区中编排
        - label: 企业可观测性与事故响应
          detail: Splunk Observability Cloud、Splunk APM 和 Splunk On-Call 自动移动寻呼监控 6,000 台主机，并提供低于 2 秒的垂直负载告警
    approximationNotes: 架构层抽象自 Rappi 在工程和基础设施案例研究中披露的生产微服务拓扑。
    claimRefs:
      - CE002
      - CE006
      - CE009
      - CE010
      - CE011
      - CE013
  - id: FU001
    title: 客户与商户扩张旅程
    type: journey-map
    summary: 有证据支持的消费者到商户闭环六阶段地图；留存与集中度明确列为尽调缺口。
    data:
      nodes:
        - label: 消费者发现
          description: 用户接触食品、杂货、药房、购物、旅行、支付及银行服务入口。
          touchpoints:
            - Country storefront
            - Mobile app
        - label: 消费者下单
          description: 消费者选择商户或服务，创造市场需求。
          touchpoints:
            - Restaurant
            - Commerce
            - Fintech
        - label: 餐厅入驻
          description: 未注册餐厅可以进入可选择国家的 Rappi Aliados 注册路径。
          touchpoints:
            - Rappi Aliados
            - Country selection
        - label: 商户运营
          description: 餐饮领域团队支持客户应用、入驻、广告、运营及合作伙伴自助服务。
          touchpoints:
            - RappiAds
            - Operations
            - Self-service tools
        - label: RappiOne 分析
          description: 已订阅的盟友可以查看地理位置、品类、品牌、用户、订单、频次、客单价、SKU 及配送指标。
          touchpoints:
            - Three-month trial
            - Performance dashboard
        - label: 扩张或流失
          description: 指标可以为商户决策提供依据，但公开证据没有量化续约、留存、 集中度或流失。
          touchpoints:
            - Sales decision
            - Retention gap
            - Concentration gap
    approximationNotes: 该顺序综合已记录的服务入口与能力；不代表转化率、所有用户都会沿此路径推进，或留存率已有实测。
