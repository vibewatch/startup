      - number: '1.4'
        title: 运营规模、区域版图与财务转折点
        blocks:
          - type: paragraph
            body: >-
              在近十年激进扩张和大量现金消耗之后，Rappi 在本土市场迎来关键财务拐点。哥伦比亚 Superintendencia de Sociedades 汇编的报表显示，公司连续两个经营期实现正净利润：2024
              年净利润 97,250 million Colombian pesos，2025 年增至 210,176 million pesos（$64.82 million USD），同比增长
              116%。这一转折与历史资本投入形成鲜明对比：截至 2023 年，累计亏损已达 1.2 trillion Colombian pesos（$369.99 million USD），而累计收入为 1.8
              trillion pesos。第三方市场情报估计其全球年化收入约为 $1.3 billion ARR，员工规模在 12,600 至 14,849
              人之间；但覆盖墨西哥和巴西子公司的合并母公司审计财务报表仍属于未披露的私有记录。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.5'
        title: 公司里程碑、战略联盟与运营阻力
        blocks:
          - type: paragraph
            body: >-
              Rappi 从 2015 年灵活的配送应用成长为多元化拉美平台，期间既有重要商业合作，也持续面临运营复杂性。2025 年 9 月，公司与 Amazon 建立高调的战略关系，探索把末端包裹物流接入 Rappi
              配送网络，并评估 Rappi Prime 与 Amazon Prime 的双向订阅捆绑。然而，快速扩张即时物流会带来关键运营瓶颈。Rappi
              的灵活运力本就围绕摩托车和自行车配送员处理小型餐饮订单及杂货，因此承载大型零售包裹的能力受限。同时，公开报道指出客服响应时间和配送准确性存在服务摩擦；拉丁美洲各地劳工监管机构也日益审查数万名零工配送员的独立承包商身份，可能推高成本。
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO010
              - CO014
              - CO015
