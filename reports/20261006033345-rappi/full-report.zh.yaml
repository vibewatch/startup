              - CM012
      - number: '2.3'
        title: 三方市场动态与买方细分
        blocks:
          - type: paragraph
            body: >-
              Rappi
              的市场模式通过三方生态运行：消费者（终端用户）、商业合作方（餐厅、杂货商和消费品牌）及独立配送员。消费者细分聚焦重视配送速度和无摩擦便利性的中高收入城市居民，覆盖餐饮、杂货和药房。商业合作方从多门店企业餐饮连锁和消费包装商品（CPG）制造商，延伸至社区独立零售商。CPG
              品牌通过 RappiOne 等专业 B2B 产品接入平台，品牌经理可按城市和品类获得绩效分析并购买赞助展示。商户通过开发者 API
              和商户管理门户直接接入库存及订单路由流程；独立配送员则在本地化收入激励下提供灵活劳动力。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: 采用顺风、监管瓶颈与结构性阻力
        blocks:
          - type: paragraph
            body: >-
              智能手机普及、城市密度、算法路由优化，以及对 Fountain9 等 AI 供应链技术的战略投入，共同推动市场采用。但 Rappi
              扩张也遭遇明显的结构性阻力。拉美各国政府，尤其是哥伦比亚和巴西，已提出立法方案，拟把零工经济配送员从独立承包商重新认定为正式雇员。强制正式雇佣、最低时薪和社会保障缴款，将从根本上推高每单配送成本，挑战低劳动力成本的平台经济模型。同时，关键市场竞争分散——巴西由
              iFood 主导、墨西哥有 Uber Eats——会引发促销折扣并限制佣金扩张，迫使平台在消费者留存和单元贡献利润率之间取舍。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 证据表
        blocks:
          - type: callout
            title: 劳工重新分类风险威胁单元经济
            body: 哥伦比亚和巴西围绕零工劳动者重新分类的立法讨论，对 Rappi 的低劳动力成本商业模式构成结构性威胁，并可能强制支付最低工资和社会保障缴款。
            calloutType: risk
            claimRefs:
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图、直接同业与替代方案
        blocks:
          - type: paragraph
            body: >-
              竞争集合并不止于餐饮配送。独立目录一贯将 Uber Eats 和 iFood 列为直接同业；另一家区域目录则把 PedidosYa 列为乌拉圭、阿根廷和智利的直接竞争者 [CP001, CP002]。Tracxn
              使用更宽的全球同业集合——DoorDash、Glovo 和 Delivery Hero——说明比较结果会随地域和公司口径变化 [CP003]。Rappi
              本身被定义为覆盖餐饮、杂货、药房、其他零售、支付和旅行的多垂直服务；Statista 描述其在九个拉美国家、400 多座城市运营 [CP004, CP005]。相邻压力同样重要：Mercado Envíos
              可替代 Rappi 部分零售物流主张，JOKR 则被列入即时杂货配送竞争者 [CP012]。证据并未证明每个被点名的平台在每个国家都重叠，因此画像表将其视为有证据边界的部分样本，而非穷尽性的市场地图。
            claimRefs:
