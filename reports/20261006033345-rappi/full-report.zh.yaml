            title: 以经审计财务证据作为投资评估闸门
            body: 在给出可融资估值前，要求提供经审计的合并报表、收入定义桥接、按国家和垂直业务拆分的贡献利润率、单元经济队列、当前现金和消耗，以及完整债务协议。
            calloutType: recommendation
