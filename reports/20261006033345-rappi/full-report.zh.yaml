            body: >-
              Rappi 的底层运营模式运行在 Amazon Web Services 基础设施上，从集中式零售配送服务扩展为跨 Amazon Elastic Container Service 和 Kubernetes
              集群运行的分布式微服务生态。为缩短预测功能的上市时间，Rappi 数据组织建立了多层 Machine Learning Platform，包括运行于 Kubernetes、带自有插件的 Airflow 发行版
              RappiFlow，以及云托管 JupyterHub 环境和集中式向量嵌入库，把商品、订单、用户和门店等实体映射为统一向量表示。工程团队采用跨职能矩阵结构，把餐厅、接入和 RappiAds
