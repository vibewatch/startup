      - number: '4.2'
        title: 增长势头与收入质量
        blocks:
          - type: paragraph
            body: >-
              最强的公开收入数字仍是估计值，且会计口径不清。Sacra 估计 2023 年收入 $856 million，较 2022 年增长 37%。Multiples 同样记录 $856 million，并将其与 2025
              年 9 月融资并列，但说明此类数字通常是年化收入或报告期 LTM；因此不能证明 Rappi 在 2025 年恰好实现 $856 million 收入。两份独立画像报告管理层称 2025 年连续四个季度
              EBITDA 为正，同时表示利润全部再投资。EBITDA 不等于自由现金流；公开记录没有与审计收入、毛利、股权激励、营运资本、资本开支、利息、税项或合并净利润的调节表。
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
              - CI009
      - number: '4.3'
        title: 成本结构与单元经济
        blocks:
          - type: paragraph
            body: >-
              公开运营证据能识别成本驱动因素，却无法量化贡献利润率。Rappi 的餐厅 API 在各国域名下管理菜单、订单、商品可用性、门店、排期和 webhooks，意味着持续承担整合、可靠性和多市场支持成本。2021
              年公司工程文章称 Restaurants 工程部门有超过 140 人和 15
              个小组，并明确跟踪基础设施成本及故障潜在损失；这只是固定技术层有一定规模的历史证据，不是当前人员估计。劳工监管是重大下行风险：EquityZen
              警告，雇员重新分类可能增加工资和社保义务。在缺少每单配送成本、激励、退款、支付损失、暗店占用、客服成本及各国毛利的情况下，利润率路径和销售效率都无法独立检验。
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
