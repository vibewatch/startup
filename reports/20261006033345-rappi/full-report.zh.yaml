      - number: '7.4'
        title: 证据表
        blocks:
          - type: callout
            title: 拉美扩张中的结构性反垄断治理风险
            body: >-
              墨西哥 CNA 对 Banorte 和 Rappi 处以 MX$19.9 million 罚款，表明拉美反垄断监管机构不会把数字合资企业简单视作营销联盟。在法定审批前对信用卡运营施加实际控制，导致 Rappi 和
              Banorte 受到监管处罚，也可能成为其他审查超级应用合作的区域反垄断机构的先例。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: 不对称合作方条款造成潜在商户流失风险
            body: >-
              Rappi 的官方 RappiOne 条款在法律上使公司免受停机损害、目录重新分类错误和服务中断的责任。但这一法律防线与商业合作方形成明显运营张力：合作方须遵守严格的 4 分钟订单接受
              SLA，订单还会自动取消，竞争者可能利用这种摩擦挖走高交易量餐厅伙伴。
            calloutType: insight
            claimRefs:
              - CR006
              - CR008
              - CR009
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、立场与建议框架
        blocks:
          - type: paragraph
            body: >
              Rappi 是拉丁美洲主要的多垂直超级应用，在九个区域市场整合餐饮配送、依托暗店和 Amazon Now 合作的即时杂货，以及 RappiPay
              和合作方信用卡等自有金融科技产品。乐观情景建立在高城市密度、多品类交叉销售的复合增长（成熟队列每月交易最多 11 次），以及自行车和摩托车车队带来的结构性配送成本效率（约为 GMV 的 10%，而发达市场同业为
              14–32%）。不过，投资建议受限于“跟踪”，置信度中等、风险评级高；相对于未经验证的私营收入和清算优先权悬置，估值立场偏“透支”。


              私募股权轮次在 T. Rowe Price 领投的 2021 年 7 月 Series F 融资后，曾按 $5.25B 为公司定价；Amazon 又在 2025 年 9 月提供 $25M
              扩展轮。但二级交易信号和市场可比公司暗示估值大幅折价 60% 至 68%，交易区间为 $1.7B 至 $2.0B。若按最近一次优先股 headline price 附近入场，下行风险很大，因为早期投资者在
              $2.46B 总融资（含 $357M 债务融资）中持有大量高级清算优先权。在没有 SEC S-1 注册声明或 FY2024–FY2025
              母公司层面合并审计损益表的情况下，依据未经验证的管理层数字承销股权敞口，将违背基本安全边际原则。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
