  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Rappi
              是覆盖九个拉丁美洲国家的即时多垂直消费者超级应用，提供餐厅餐食、超市杂货、药房必需品、电商商品、旅行预订和数字金融产品。消费者可搜索本地库存、自定义商品、管理实时购物车、设置配送员小费，并通过自动地址解析发起移动结账。商户合作方可配置目录可用性、同步零售门店菜单，并通过网页管理门户或程序化
              REST API 处理新订单。外部社区工具和逆向工程客户端界面显示，目录发现、购物车修改、结账预览和订单跟踪等核心交互遵循标准化 REST 端点。但平台韧性仍与商户响应高度耦合，需要用整合标准惩罚合作方软件故障。
