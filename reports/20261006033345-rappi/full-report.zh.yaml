  - id: FP001
    title: 基于现有证据的序数竞争定位
    type: quadrant
    summary: 各点采用三级序数评估：x 代表有证据支持的拉美覆盖范围，y 代表有证据支持的服务广度；两者都不是市场份额或业绩评分。
    data:
      points:
        - label: Rappi
          x: 3
          'y': 3
          detail: 覆盖九个国家；已有记录显示其提供多垂直消费者与商户工具。
        - label: Uber Eats
          x: 2
          'y': 1
          detail: 已记录直接相关性，但缺乏量化的区域覆盖及更广泛范围信息。
        - label: iFood
          x: 1
          'y': 2
          detail: 指定证据中的巴西食品与杂货平台。
        - label: PedidosYa
          x: 2
          'y': 2
          detail: 在三个点名国家与食品、杂货和药房业务范围重叠。
        - label: Mercado Envíos
          x: 2
          'y': 2
          detail: 区域包裹网络，以及相邻的杂货或超市物流替代方案。
        - label: JOKR
          x: 1
          'y': 1
          detail: 与 Rappi 对比列出的即时零售专业平台；更广泛的重叠范围未量化。
    approximationNotes: 序数值是对引用范围的分析编码，不代表实测市场份额、质量、定价或财务表现。竞争对手资料缺失会压低证据评分，不应解读为产品不存在。
