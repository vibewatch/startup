            body: >-
              每月在 250 座拉丁美洲城市处理超过 8.8 million orders，需要持续运营可见性。面对告警耗时数分钟、诊断耗时数小时的旧遥测瓶颈，Rappi 在 1,000+ 个微服务、6,000 个云主机和
              15,000 个活跃容器上整合 Splunk Observability Cloud。这套可观测性体系将平均修复时间缩短超过 90%，支撑疫情高峰期 300%
              的订单激增，并通过移动自动告警为值班工程师提供实时事故上下文。尽管韧性提升，Rappi 仍有结构性技术依赖：核心运营高度依赖 AWS
              云托管，移动应用崩溃或网关延迟尖峰会直接威胁订单转化、商户合作方满意度和交易收入。
