      - number: '3.2'
        title: 能力、商户工作流与分发
        blocks:
          - type: paragraph
            body: >-
              Rappi 最强的已记录能力证据集中在网络的商户侧。RappiOne 按国家、城市、品类、制造商和品牌提供绩效指标；餐厅 API 覆盖菜单、订单、排期、库存可用性和 webhooks [CP006,
              CP008]。2021 年的一篇工程记录描述了 15 个餐厅领域小组，负责客户应用、餐厅接入、广告、运营和合作伙伴自助服务，这证明过去的组织投入，但不能证明当前人员规模或执行优越性
              [CP009]。这些工具可加深运营整合，因为商户把目录和订单流程接入 Rappi；然而，公开文档没有排他性条款或转换成本测量 [CP013]。现有证据也缺少 Uber Eats、iFood 和 PedidosYa
              同等的官方产品与开发者文档。因此，能力矩阵将缺乏支持的竞争者单元标为未知，而不是假定相当或更弱，并区分已记录功能与竞争证明。
