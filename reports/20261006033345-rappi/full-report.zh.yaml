            title: 从补贴式高速增长转向本地单元盈利
            body: >-
              Rappi 的哥伦比亚审计报表显示，公司从截至 2023 年累计亏损 1.2 trillion COP 的历史现金消耗，转向 2024 年 97.25B COP、2025 年 210.18B COP
              的连续净利润。但覆盖墨西哥、巴西及其他区域业务的合并母公司财务报表仍为私有且未披露。
