      - number: '1.2'
        title: 创始人、领导层结构与治理演进
        blocks:
          - type: paragraph
            body: >-
              核心创始三人组——CEO Simón Borrero、Sebastián Mejía 和 Felipe Villamarín——在 2016 年进入 Y Combinator 后，带领 Rappi
              经历多轮高速增长。2024 年，Sebastián Mejía 在任职近十年后辞去运营总裁这一高管职务，转为董事会中的非执行治理角色，成为公司治理的重要节点。国内地域管理由各国负责人主导，例如 Rappi
              Colombia CEO Matías Laks 负责每月超过 800 万单的运营规模。工程执行按专业职能业务单元组织；餐饮工程垂直有超过 140 名技术人员和 15 个敏捷小组，由工程副总裁 Facundo
              Viale 领导。主要机构资本合作方也在董事会拥有正式席位，例如 SoftBank Investment Advisers 管理合伙人 Jeffrey
              Housenbold，从而确保全球增长计划与机构投资者保持一致。
            claimRefs:
