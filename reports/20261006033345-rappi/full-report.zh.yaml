  - id: TV003
    title: 情景估值矩阵与敏感性分析
    columns:
      - 情景
      - 概率
      - 隐含净收入倍数
      - 隐含企业价值（USD M）
      - 核心运营假设
      - 主要下行触发因素与尽调要求
    rows:
      - - 乐观情景
        - 25%
        - 3.0x–3.5x
        - 2,800–3,500
        - Amazon Now 合作扩展至巴西 / 墨西哥；零售广告达到净收入的 15%+；EBITDA 持续 >$100M
        - 验证广告收入增长、Amazon 合同留存及公司利润率转化
      - - 基准情景
        - 50%
        - 1.7x–2.2x
        - 1,600–2,100
        - 配送业务温和增长；巴西攻势限制集团 EBITDA；IPO 按当前二级市场价格（$19.89/sh）定价
        - 检查二级股票成交深度、员工期权池稀释及优先股悬置
      - - 悲观情景
        - 25%
        - 0.8x–1.2x
        - 750–1,100
        - iFood 以零佣金对等策略守住巴西市场；汇率贬值；金融科技监管资本金要求；债务重组
        - 审计高级债务契约（Santander $100M 贷款）、现金续航及前置仓固定资产利用率
    notes: 情景估值按未来 24 个月退出期限建模；收入倍数参考私募可比公司及 DoorDash/Grab 公开基准，并应用于估计净抽成收入。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
