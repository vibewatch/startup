      - number: '3.3'
        title: 定价、规模信号与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              公开规模信号显示品类背后有大量资本，但无法揭示运营流动性或市场份额。Tracxn 报告 Rappi 15 轮累计融资 $2.46 billion，并记录 2025 年 9 月的 $25 million
              Series F；这些是融资金额，不是可用现金 [CP010]。同一来源将 iFood 描述为总部在巴西的餐饮和杂货平台，融资 $592 million；其他独立来源则把 Uber Eats 和
              PedidosYa 列入 Rappi 的直接竞争者 [CP001, CP002, CP011]。定价方面，最清晰的一手证据面向商户：RappiOne 提供三个月试用，之后收取私下约定的订阅费，该费用独立于
              Rappi 市场佣金 [CP007]。二手描述还将 RappiPrime 定义为按月订阅，提供配送和折扣权益
              [CP016]。现有来源没有为主要竞争者提供可比的当前费用、商户抽佣、折扣深度或合同条款。因此，稳妥结论只能到这里：覆盖广度和整合能力可能形成留存杠杆，但证据无法证明锁定效应、定价权或持久护城河 [CP013,
              CP014]。
