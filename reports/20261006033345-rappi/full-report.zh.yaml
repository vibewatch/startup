  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类架构与可触达支出
        blocks:
          - type: paragraph
            body: >-
              拉丁美洲即时配送和超级应用生态构成数十亿美元的交易环境，把城市消费者、商户和配送员连接起来。Rappi 的商业范围包括五个主要运营板块：餐饮配送、杂货和便利品即时零售（包括 Turbo 10
              分钟履约）、药房和个人必需品、综合零售电商，以及 RappiPay 和 RappiBank
              旗下的金融服务。在拉美人口密集的大都会区，可触达支出既包括可选的餐饮订单，也包括刚性的每周杂货和家庭采购。但即时配送直接获得的只是数字撮合费（商户抽佣和客户配送附加费），而非全部商品交易总额（GMV）。非正式社区商业、商户电话直订和线下零售采购仍是拉美家庭消费的绝大部分，也是现状替代方案。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
      - number: '2.2'
        title: 市场规模视角与受约束的可触达机会
        blocks:
          - type: paragraph
            body: >-
              估算拉美即时配送平台的可触达市场，必须区分零售杂货和餐饮总支出、数字化渗透率以及可服务捕获额。Rappi 运营的九个市场每年零售食品和饮料支出超过 $150
              billion，但线上配送渗透率仍集中在一线和二线大都市。Statista 及第三方行业追踪机构估计，拉美线上餐饮配送用户群正向区域成熟度扩张；然而，私营平台信息不透明，无法审计确认母公司层面的
              GMV。第三方基准显示，Rappi 在 400+ 座城市产生了可观年交易量，触达 35 million 平台用户，并在哥伦比亚取得超过 50% 的市场份额。相比之下，巴西的老牌平台 iFood
              仍占据品类领导地位，将 Rappi 的可服务可触达市场（SAM）限制在拥有可支配收入和数字支付工具的城市智能手机用户群。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
