      - number: '7.3'
        title: 合作方集中与平台依赖
        blocks:
          - type: paragraph
            body: >-
              Rappi 轻资产超级应用模式高度依赖金融承销、云基础设施和企业数据分析领域的战略交易对手。金融服务中，Rappi 将其在墨西哥 RappiCard 的 44.28% 股权出售给 Banorte，作价 US$50
              million，使自身从拥有共同治理权的股权所有者转为受 15 年商业协议约束的独家获客渠道。这一结构把墨西哥信贷获客集中到单一银行合作方，使 Rappi
              暴露于交易对手决策不利或银行风险偏好变化。基础设施层面，Rappi 高吞吐交易骨干托管于 Amazon Web Services（AWS），在多个区域部署 Amazon DocumentDB、Amazon
              EC2、Amazon RDS 和 Amazon ECS 等服务。AWS
              区域可用性任何下降都会直接威胁订单路由和实时配送调度。同样，在软件和供应链执行层，现代自动补货框架显示，自主规划和订货系统可能因重规划循环中的陈旧证据、剩余交付期错配及供应商 API
              断连而失败。供应商可见性不完整或反馈延迟时，需要确定性校验关卡和人工升级路径，避免代价高昂的采购错误。云基础设施或商户整合管线一旦失败，Rappi 将承担大量残余财务和运营敞口。
            claimRefs:
