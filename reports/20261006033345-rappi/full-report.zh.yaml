  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Rappi 似乎从同一商业网络的多个层次变现，而不是依靠一份经常性软件合同。Sacra 估计，商户佣金占 2023 年收入的 75%，广告占 13%，Prime 订阅占 10%，电商占
              2%；这些是分析师估计，不是审计披露。Sacra 还估计商户佣金为订单价值的 10%–30%，客户配送费为 5%–15%，不能把它们当作实际抽佣率。Rappi 自有的 RappiOne
              条款增加了商业数据订阅：合作方试用三个月，随后支付协商金额和平台使用佣金，且叠加于底层市场佣金之上。RappiOne 提供销售额、订单、频率、平均客单价、渠道和 SKU
              指标，说明商户数据与测量能力可能深化变现，但公开资料没有实际价格或收入贡献。
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI010
              - CI011
