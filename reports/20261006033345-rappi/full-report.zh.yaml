  - id: FV001
    title: 建议决策逻辑链
    type: flow
    summary: 将运营规模、财务不透明度和二级市场估值折价与“持续跟踪”建议相联系的决策流程。
    data:
      nodes:
        - id: scale
          label: 拉丁美洲多垂直领域超级应用规模（9 个国家，累计融资 $2.46B）
        - id: operations
          label: 据报道连续四个季度实现运营 EBITDA 盈利并与亚马逊建立物流合作关系
        - id: uncertainty
          label: 缺少经审计的合并母公司财务报表和 S-1 注册声明
        - id: preference-overhang
          label: 高级优先股堆叠（$2.1B+ 优先股及 $357M 债务均优先于普通股）
        - id: valuation-gap
          label: 估值脱节：$5.25B 优先股估值标记与 $1.7B–$2.0B 二级市场清算指示之间的差异
        - id: recommendation
          label: 最终立场：在等待提交 S-1、完整清算瀑布和经审计报表期间持续跟踪
      edges:
        - from: scale
          to: operations
        - from: operations
          to: uncertainty
        - from: uncertainty
          to: preference-overhang
        - from: preference-overhang
          to: valuation-gap
        - from: valuation-gap
          to: recommendation
    approximationNotes: 基于公开市场和二级市场尽调标准的分析性决策层级。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV006
      - CV010
      - CV014
