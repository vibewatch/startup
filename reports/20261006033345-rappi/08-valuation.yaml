callouts:
  - calloutType: "recommendation"
    title: "Capital Discipline: Defer Primary Capital Until S-1 Verification"
    body: "Prospective institutional investors should avoid subscribing to unpriced primary financing or secondary equity at marks reflecting the 2021 $5.25B peak. The 65% discount observed on secondary venues ($1.7B–$2.0B) reflects rational market pricing for Latin American platform execution, regional currency headwinds, and preference overhang. Track Rappi until an SEC S-1 disclosure validates consolidated audited numbers."
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV006"
      - "CV014"
  - calloutType: "risk"
    title: "Senior Preference Stack and Debt Overhang"
    body: "With $357M in cumulative debt facilities—including a $100M senior secured loan from Santander and Kirkoswald in August 2025—plus $2.1B+ in cumulative preferred venture capital, junior equity holders face severe subordination risk. Any exit transaction below $2.5B threatens to return little to no value to common shareholders and junior option pools."
    claimRefs:
      - "CV005"
      - "CV008"
      - "CV010"
      - "CV015"
