chapter:
  number: 8
  title: "Valuation"
  summary: "Rappi's headline private valuation marks ($5.25B Series F in July 2021) diverge sharply from unverified peer multiples and secondary-market clearing prices ($1.7B–$2.0B implied range). With positive operating EBITDA reported across four consecutive quarters but unverified audited consolidated statements and significant debt obligations ($100M senior secured facility from Santander and Kirkoswald in August 2025), a disciplined 'track' stance is recommended pending S-1 disclosure."
sections:
  - id: "investment-thesis-and-recommendation"
    title: "Investment Thesis, Stance, and Recommendation Framework"
    body: |
      Rappi represents Latin America's primary multi-vertical super-app, integrating restaurant delivery, quick-commerce groceries via dark stores and its Amazon Now partnership, and proprietary fintech offerings including RappiPay and partner credit cards across nine regional markets. The bull case rests on high urban density, compounding multi-category cross-selling where mature cohorts transact up to 11 times per month, and structural delivery cost efficiencies of approximately 10% of GMV using bike and motorcycle fleets compared to 14–32% for developed-market peers. However, the investment recommendation is constrained to 'track' with medium confidence and a high risk rating, reflecting a 'stretched' valuation stance relative to unverified private revenue and liquidation preference overhang.

      While private equity rounds benchmarked the company at $5.25B following its July 2021 Series F financing led by T. Rowe Price and subsequent $25M extension from Amazon in September 2025, secondary trading signals and marketplace comparables imply a stark valuation haircut of 60% to 68%, trading between $1.7B and $2.0B. Entry at or near the last preferred headline price carries severe downside risk because earlier investors hold substantial senior liquidation preferences from $2.46B in total financing rounds, including $357M in debt facilities. In the absence of an SEC S-1 registration statement or audited parent-level consolidated P&L statements for FY2024–FY2025, underwriting equity exposure on unverified management figures would violate fundamental margin-of-safety principles.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "financing-history-and-valuation-discipline"
    title: "Capitalization Structure, Secondary Marks, and Entry Discipline"
    body: |
      Rappi has raised $2.46B across 15 funding rounds, encompassing two seed rounds, three early-stage equity rounds, seven late-stage equity rounds, and three conventional debt facilities. Institutional equity backers include SoftBank ($1B Series E lead in April 2019), DST Global ($220M Series D lead in September 2018), Delivery Hero ($185M Series C lead in April 2018), Andreessen Horowitz, Sequoia Capital, and T. Rowe Price ($500M Series F lead in July 2021 at a $5.25B post-money valuation). In August 2025, Rappi secured a $100M 4-year senior secured credit facility from Banco Santander and Kirkoswald Capital Partners for refinancing and working capital, following prior debt facilities of $145M in March 2022 and $112M in October 2022.

      Secondary marketplace data from Nasdaq Private Market (NPM) and private market estimates indicate indicative transaction prices around $19.83–$19.89 per share as of September 2026, implying an enterprise equity valuation of approximately $1.7B to $2.0B. This represents a 62% to 68% compression from the $5.25B preferred headline mark. Because preference stacks typically guarantee 1x non-participating or participating return of capital to Series E and F investors before common or secondary equity participates, secondary buyers face total loss or severe subordination if an eventual public listing or trade sale clears below $2.5B. Strict entry discipline dictates avoiding primary commitments above 2.0x trailing GMV or unverified net revenue, and demanding full cap-table waterfall visibility.
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
    tableRefs:
      - "TV002"
  - id: "scenario-analysis-and-diligence-path"
    title: "Scenario Analysis, Peer Multiples, and Diligence Verification"
    body: |
      Valuation scenarios model three distinct operational trajectories over a 24-month horizon through late 2028. The Bull case (25% probability) assumes successful execution of the Amazon Now grocery logistics rollout in Mexico and Brazil, scaling high-margin retail media advertising (RappiAds) to exceed 15% of net revenues, sustained positive EBITDA exceeding $100M annually, and a successful US IPO at 3.0x net revenue ($2.8B–$3.5B enterprise value). The Base case (50% probability) anticipates moderate regional growth, continuing margin pressure from iFood in Brazil where Rappi committed R$1.4B through 2028, and a delayed public offering or down-round crossover round at 1.5x–2.0x net revenue ($1.6B–$2.1B enterprise value), aligning closely with current secondary trading marks.

      The Bear case (25% probability) reflects intensifying competitive retaliation from incumbent delivery operators, foreign exchange volatility across Latin American currencies, losses in Brazilian expansion, and fintech asset impairment. In this downside scenario, enterprise value compresses below $1.0B, wiping out common share equity value and junior preferred tranches beneath the senior debt and preferred liquidation stack. Diligence verification must prioritize obtaining audited parent entity financial statements, reviewing the Banorte $50M carve-out terms for RappiCard Mexico, inspecting RappiPay Colombia regulatory balance sheets, and confirming exact debt covenant compliance under the $100M Santander facility.
    claimRefs:
