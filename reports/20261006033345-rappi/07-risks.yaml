  title: "Risks"
  summary: "Rappi faces material structural exposures across antitrust enforcement in its fintech joint ventures, partner-merchant operational friction and legal terms, organizational overhead, and retail supply-chain orchestration dependencies. These vulnerabilities require strict monitoring of regulatory concentration filings, ally SLAs, and governance thresholds prior to public market entry."
sections:
  - id: "regulatory-legal-risk"
    title: "Regulatory and Legal Exposures"
    body: "Rappi operates across nine Latin American jurisdictions with complex, evolving regulatory environments spanning fintech, antitrust compliance, consumer protection, and merchant contracting. The most acute confirmed regulatory enforcement action involves Mexico's National Antitrust Commission (CNA), which sanctioned Grupo Financiero Banorte and Rappi with a fine of MX$19.9 million (approximately US$1.1 million) over an unauthorized business concentration. The CNA determined that the parties executed their July 20, 2020 alliance agreement—establishing the Tarjetas del Futuro venture behind RappiCard—granting Banorte operational intervention rights in Rappi's credit card management before mandatory antitrust clearance. While Banorte subsequently obtained clearance to acquire Rappi's remaining 44.28% stake in April 2025 for US$50 million with a 15-year exclusivity agreement, the precedent highlights severe execution risk in joint-venture structuring. Beyond antitrust penalties, Rappi's legal exposure extends to partner merchant terms. The RappiOne Ally Platform Terms and Conditions (administered by Rappi S.A.S. and Rappi Inc.) impose strict unilateral liability limitations: Rappi explicitly disclaims liability for indirect or direct damages resulting from platform downtime or unavailability, disclaims guarantees of continuous 24-hour operation, and shifts data accuracy risks arising from automated catalog re-categorization to the ally. These terms create friction with commercial partners and expose Rappi to commercial litigation and regulatory scrutiny across Latin American consumer and commerce authorities."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR009"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "operational-quality-security-risk"
    title: "Operational Reliability, Partner Friction, and Engineering Execution"
    body: "Operational integrity across Rappi's multi-sided marketplace depends on tightly coupled integration touchpoints between retail allies, delivery logistics, and core platform microservices. Rappi's official Developer Portal reveals substantial technical vulnerabilities inherent in its order-lifecycle mechanics. Merchant allies are constrained to an inflexible four-minute SLA window to accept or reject incoming orders before Rappi's automated systems trigger an irreversible order cancellation due to timeout. Furthermore, orders can only be processed once; any attempt to accept or reject an already-processed or timed-out order triggers an unrecoverable system error. Order events must be queried via polling endpoints, while access tokens expire on a rigid 7-day schedule, requiring continuous automated credential refresh cycles across thousands of merchant systems. When allies reject orders due to SKU mismatches, pricing discrepancies, or missing toppings, fulfillment cycles break down and degrade consumer retention. From an engineering and organizational perspective, historical reflections from technical leadership describe scaling challenges where engineering teams of over 140 personnel across 15 squads must navigate carryover, velocity bottlenecks, and infrastructure reliability without silver-bullet solutions. The continuous need to balance rapid time-to-market against platform stability creates ongoing vulnerability to merchant dissatisfaction, customer churn, and operational outages across peak operating windows."
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR010"
      - "CR011"
    tableRefs:
      - "TR002"
  - id: "partner-platform-dependencies"
    title: "Partner Concentration and Platform Dependencies"
    body: "Rappi's asset-light super-app model relies heavily on strategic counterparties across financial underwriting, cloud infrastructure, and enterprise data analytics. In financial services, the dissolution and sale of Rappi's 44.28% stake in RappiCard Mexico to Banorte for US$50 million transforms Rappi from an equity owner with co-governance rights into an exclusive origination channel subject to a 15-year commercial agreement. This structure concentrates Mexican credit origination around a single banking partner, leaving Rappi vulnerable to adverse counterparty decisions or changes in banking appetite. On the infrastructure tier, Rappi's high-throughput transactional backbone is hosted on Amazon Web Services (AWS), utilizing services such as Amazon DocumentDB, Amazon EC2, Amazon RDS, and Amazon ECS across multiple regional deployments. Any degradation in AWS regional availability directly threatens order routing and real-time courier dispatch. Similarly, on the software and supply chain execution layer, modern automated replenishment frameworks demonstrate that autonomous planning and ordering systems risk failure from stale evidence in replan loops, residual lead-time mismatches, and supplier API disconnects. Incomplete supplier visibility or delayed feedback requires deterministic verification gates and human escalation paths to prevent costly procurement errors. If cloud infrastructure or merchant integration pipelines fail, Rappi bears substantial residual financial and operational exposure."
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR003"
