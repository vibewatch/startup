callouts:
  - calloutType: "risk"
    title: "Structural Antitrust Governance Risk in LatAm Expansion"
    body: "The MX$19.9 million fine imposed on Banorte and Rappi by Mexico's CNA establishes that antitrust regulators in Latin America will not treat joint digital ventures as simple marketing alliances. By exerting functional control over credit card operations prior to statutory clearance, Rappi and Banorte incurred regulatory sanctions that could serve as precedent for other regional antitrust authorities scrutinizing super-app partnerships."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
  - calloutType: "insight"
    title: "Asymmetric Partner Terms Create Latent Merchant Churn Vulnerability"
    body: "Rappi's official RappiOne terms legally insulate the company from downtime damages, catalog re-categorization inaccuracies, and service interruptions. However, this legal defense creates significant operational tension with commercial allies who face a strict 4-minute order acceptance SLA and automatic cancellations, driving friction that competitors can exploit to poach high-volume restaurant partners."
    claimRefs:
      - "CR006"
      - "CR008"
      - "CR009"
