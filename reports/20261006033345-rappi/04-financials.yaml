    columns: [Offer, Public price or unit, List versus realized, Discounts or unknowns, Underwriting implication]
    rows:
      - [RappiOne subscription, "Negotiated amount after a three-month trial", "Contract structure only", "Price, renewal, minimum term, and churn undisclosed", "Cannot model recurring data-services revenue"]
      - [RappiOne platform commission, "Negotiated commission", "Contract structure only", "Separate from marketplace commission; rate undisclosed", "Potentially adds merchant monetization but risks double-charging pressure"]
      - [Merchant marketplace, "Estimated 10%–30% of order value", "Analyst estimate rather than verified realized take rate", "Country, category, enterprise discounts, refunds, and taxes unknown", "Revenue sensitivity to mix and competition is high"]
      - [Consumer delivery, "Estimated 5%–15%", "Analyst estimate rather than verified realized fee", "Prime benefits, promotions, distance, and courier economics unknown", "Gross transaction value does not translate directly into revenue or contribution"]
      - [Advertising and Prime, "Estimated 13% and 10% of 2023 revenue, respectively", "Mix estimate; no public price card or realized ARPU", "Campaign pricing, membership discounts, and allocation policy unknown", "Higher-margin mix thesis cannot be audited"]
    notes: "The table separates official contract mechanics from third-party estimates; no public evidence establishes realized pricing or accounting recognition."
    claimRefs: [CI001, CI002, CI004, CI010]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue, "$856M estimated for 2023; also recorded beside a September 2025 round", Medium, "The repeated number may mix historical, run-rate, and LTM bases", "Audited FY2023–FY2025 revenue with perimeter and recognition policy"]
      - [EBITDA, "Management claim of four consecutive positive quarters during 2025", Medium, "Signals operating progress but does not establish cash generation", "Monthly adjusted-to-GAAP bridge, stock compensation, leases, and one-offs"]
      - [Gross margin and contribution margin, "Not public", Low, "Core delivery, incentives, refunds, payment losses, and fulfillment costs cannot be separated", "Gross profit and contribution per order by country and vertical"]
      - ["CAC, payback, and retention", "Not public", Low, "Reported growth cannot be tested for sales-efficiency or promotion dependence", "Cohort frequency, retention, CAC, incentive spend, and payback by acquisition channel"]
      - [Debt financing, "$100M reported in August 2025; Sacra says four-year senior secured facility", Medium, "Refinancing and working-capital debt create covenant and liquidity obligations", "Credit agreement, interest rate, security, covenants, amortization, and current headroom"]
      - ["Cash, burn, and runway", "Not public", Low, "Funding raised and positive EBITDA are not cash available", "Current unrestricted cash, monthly cash flow, capex, debt service, and downside runway"]
    notes: "All figures are third-party reported or estimated; unavailable metrics remain explicit diligence requests rather than modeled values."
    claimRefs: [CI003, CI005, CI006, CI007, CI008]
