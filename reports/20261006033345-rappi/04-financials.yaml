        - id: variable-costs
          label: Delivery and service costs
          detail: "Courier payouts, incentives, refunds, payment losses, and merchant support are not publicly quantified."
        - id: fixed-costs
          label: Technology and multi-market operations
          detail: "APIs, reliability, country integrations, engineering, and regulatory obligations form an observable but unquantified cost layer."
        - id: profit-and-cash
          label: Gross profit, EBITDA, and cash flow
          detail: "Positive EBITDA is management-reported; gross margin, cash conversion, burn, and runway remain private."
    approximationNotes: "Conceptual sequence only; node order does not imply quantified conversion rates, common denominators, or audited accounting recognition."
    claimRefs: [CI011, CI012, CI016]
callouts:
  - calloutType: risk
    title: Profitability is not liquidity
    body: >-
      Reported positive EBITDA and full profit reinvestment do not reveal cash generation, debt service,
      working-capital needs, or runway; the $100 million debt facility increases the importance of a
      cash-flow and covenant review.
    claimRefs: [CI007, CI008, CI009, CI016]
  - calloutType: recommendation
    title: Gate underwriting on audited financial evidence
    body: >-
      Require audited consolidated statements, a revenue-definition bridge, country and vertical
      contribution margins, unit-economics cohorts, current cash and burn, and the complete debt
      agreement before assigning a financeable valuation.
    claimRefs: [CI005, CI006, CI008, CI016]
