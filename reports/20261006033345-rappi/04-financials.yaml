slug: rappi
runDate: "2026-10-06"
company:
  name: Rappi
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence suggests a diversified transaction, advertising, subscription, and data-services
    model, while third-party estimates place revenue at roughly $856 million and report positive EBITDA
    during 2025. Those signals are not an underwriting-grade financial record: revenue basis, gross
    margin, cash, burn, runway, CAC/payback, country economics, and segment profitability remain private.
sections:
  - id: revenue-model-and-monetization
    title: Revenue model and monetization
    body: >-
      Rappi appears to monetize several layers of the same commerce network rather than one recurring
      software contract. Sacra estimates merchant commissions at 75% of 2023 revenue, advertising at
      13%, Prime subscriptions at 10%, and e-commerce at 2%; these are analyst estimates, not audited
      disclosures. It also estimates merchant commissions of 10%–30% of order value and customer
      delivery fees of 5%–15%, which should not be treated as realized take rate. Rappi's own RappiOne
      terms add a business-data subscription: allies receive a three-month trial, then pay a negotiated
      amount and a platform-use commission in addition to the underlying marketplace commission.
      RappiOne exposes sales, order, frequency, average-ticket, channel, and SKU metrics, suggesting
      merchant data and measurement can deepen monetization, but no public realized price or revenue
      contribution is available.
    claimRefs: [CI001, CI002, CI004, CI010, CI011]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-revenue-quality
    title: Traction and revenue quality
    body: >-
      The strongest public revenue number is still an estimate with an unclear accounting perimeter.
      Sacra estimates $856 million of 2023 revenue, up 37% from 2022. Multiples also records $856 million
      alongside a September 2025 financing, but says such figures are typically run-rate revenue or
      reported LTM; that convention does not establish that Rappi generated exactly $856 million in
      2025. Two independent profiles report management's claim of four consecutive positive-EBITDA
      quarters during 2025, while also saying profits were being fully reinvested. EBITDA is not free
      cash flow, and the public record provides no reconciliation to audited revenue, gross profit,
      stock compensation, working capital, capex, interest, taxes, or consolidated net income.
    claimRefs: [CI003, CI005, CI006, CI007, CI009]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      Public operating evidence identifies cost drivers but does not quantify contribution margin.
      Rappi's restaurant APIs manage menus, orders, item availability, stores, schedules, and webhooks
      across country-specific domains, implying ongoing integration, reliability, and multi-market
      support expense. A 2021 company engineering post described more than 140 people and 15 squads in
      the Restaurants engineering unit and explicitly tracked infrastructure cost and potential losses
      from failures; this is historical evidence of a meaningful fixed technology layer, not a current
      headcount estimate. Labor regulation is a material downside: EquityZen warns that employee
      classification could add wages and social-security obligations. Without courier cost per order,
      incentives, refunds, payment losses, dark-store occupancy, support costs, and country-level gross
      profit, neither the margin path nor sales efficiency can be independently tested.
    claimRefs: [CI012, CI013, CI014, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Capital adequacy remains unresolved despite signs of financing access. Tracxn and Sacra both
      report a $100 million debt financing in August 2025; Sacra describes a four-year senior secured
      facility for refinancing and working capital. Separately, third-party profiles say Rappi was
      reinvesting all profit, which makes the conversion from adjusted profitability to liquidity
      especially important. The assigned Nasdaq Private Market and careers pages yielded no usable
      Rappi-specific price, staffing, or financial metric in their retained text, so they cannot close
      the valuation or cost-base gaps. The financial verdict is therefore conditional: multiple revenue
      streams and reported positive EBITDA are encouraging, but debt, reinvestment, and aggressive
      operating complexity make audited statements, cash, burn, covenant headroom, and segment
      contribution margins prerequisites to underwriting.
    claimRefs: [CI007, CI008, CI009, CI015, CI016]
