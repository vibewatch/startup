company:
  name: "Rappi"
chapter:
  number: 6
  title: "Customers"
  summary: "Rappi's public storefronts claim more than 40,000 merchant allies across nine countries, while a third-party guide claims more than 30 million active users without disclosing a definition or methodology. Public evidence supports a multi-sided consumer, merchant, brand, and fintech footprint, but it does not establish current retention, cohort durability, customer concentration, or named-customer outcomes."
sections:
  - id: "customer-segments"
    title: "A multi-sided customer base with uneven public measurement"
    body: >-
      Rappi addresses consumers seeking food, grocery, pharmacy, shopping, travel, payment, and banking services, while restaurants and other merchants use the platform for demand generation and fulfillment. Its current Argentina, Mexico, and Colombia storefronts each claim that more than 40,000 allies across nine countries work with Rappi and tell merchants they can reach millions of users through immediate logistics; these are company-issued marketing claims, not audited active-account counts. Rappi also maintains a country-selectable restaurant onboarding portal, and its RappiOne terms define a separate subscription analytics product for commercial allies. The resulting customer architecture spans consumer users and payers, restaurants, retail or CPG brands, and fintech users, but public materials do not disclose revenue mix, active-account definitions, or segment-level economics.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory"
    title: "Adoption signals are broad but not cohort-comparable"
    body: >-
      The available adoption figures mix different populations and vintages. Verto claims more than 30 million active users across nine countries in 2026, but the article does not disclose whether "active" means monthly transacting users, registered accounts, or another denominator. Wikipedia reports that Rappi worked with more than 250,000 businesses in August 2020, whereas current country storefronts advertise more than 40,000 allies across nine countries; the figures should not be trended because "businesses" and "allies" may cover different populations. The same secondary source reports 300,000 RappiBank savings-account customers and, in Colombia, around 750,000 RappiPay users and more than 120,000 distributed credit cards, but those figures are not dated consistently on the page. EMARKETER identifies shifting 2026 regional food-delivery purchasing behavior, yet its accessible topic page supplies no Rappi-specific cohort metric.
    claimRefs:
      - "CU002"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU016"
    tableRefs:
      - "TU002"
  - id: "named-merchant-proof"
    title: "Named storefront presence is not outcome proof"
    body: >-
      Rappi's country storefronts provide current, named merchandising evidence: the Argentina page lists McDonald's, Burger King, and KFC among ten "most chosen" brands; the Mexico page lists Little Caesars, McDonald's, and Starbucks; and the Colombia page lists McDonald's, El Corral, and Juan Valdez Café. This shows that named brands are presented to users on live ordering surfaces, but the pages do not disclose contract status, exclusivity, order volume, revenue, retention, or customer outcomes. Accordingly, the table below classifies production status as unverified rather than inferring a deployment from a logo or ranking. It is a geographic sample of displayed merchants, not an exhaustive customer census or evidence that any listed brand is a retained enterprise customer.
    claimRefs:
      - "CU014"
      - "CU015"
    tableRefs:
      - "TU003"
  - id: "durability-and-expansion"
    title: "Merchant analytics can support expansion, but durability remains unproven"
    body: >-
      RappiOne creates a plausible merchant expansion loop by exposing metrics by country, city, category, manufacturer, and brand, including user and order growth, purchase frequency, average ticket, SKU, sales-channel participation, and delivery percentages. Rappi's 2021 engineering account also described five restaurant-domain groups and 15 squads covering the customer app, restaurant onboarding, RappiAds, operations, and partner self-service tools. Those capabilities may deepen merchant engagement, but the legal terms warn that automated recategorization can create metric differences and do not guarantee permanent service availability. Separately, SWOTAnalysis.com characterizes service quality as inconsistent and customer and courier churn as high under competitive pressure, without publishing supporting methodology. No retained source provides NRR, GRR, renewal, contract length, cohort curves, Prime retention, or top-customer concentration, so durability and dependency risk remain material diligence gaps.
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU014"
    figureRefs:
      - "FU001"
