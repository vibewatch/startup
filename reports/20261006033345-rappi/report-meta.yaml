companyProfile:
  summary: >-
    Rappi is a Latin American multi-vertical super-app founded in Bogotá in 2015 that combines on-demand delivery,
    merchant tools, quick commerce, and consumer finance across nine countries. The company has matured from hypergrowth
    to a more capital-disciplined posture, with statutory profitability reported in Colombia in 2024 and 2025, while
    consolidated audited parent financials and a public filing remain outstanding.
