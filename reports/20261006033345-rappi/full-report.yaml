  - id: TV001
    title: Recommendation and Valuation Stance Summary
    columns:
      - Decision Dimension
      - Assessment / Rating
      - Core Thesis / Evidence Anchor
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - Super-app operational scale balanced by unverified audited financials and secondary price disconnect
        - Maintain watch list status; defer equity commitment until S-1 filing
      - - Confidence
        - Medium
        - Verified $2.46B funding history and secondary pricing benchmarks, but opaque audited parent P&L
        - Limit underwriting exposure; require verifiable audited financial statements
      - - Risk Rating
        - High
        - Intense competition from iFood in Brazil, FX exposure, and $357M total debt financing
        - Apply high discount rate (18–22%) and downside structural liquidation protection
      - - Valuation Stance
        - Stretched
        - July 2021 Series F post-money mark of $5.25B sits ~65% above secondary transactions ($1.7B–$2.0B)
        - Reject primary rounds at last preferred valuation; seek steep secondary discounts
      - - Target Return / Hurdle
        - 25%+ IRR
        - Targeting >2.5x MOIC on base-case entry at secondary valuation levels (<$1.8B)
        - Entry justified only at significant discount to last preferred round
      - - Exit Readiness
        - Early-to-Mid
        - CEO announced evaluating late 2026 IPO window, but S-1 remains unfiled as of Q4 2026
        - Monitor SEC EDGAR filings and formal investment bank underwriting syndicate
    notes: >-
      Ratings synthesized from documented financing history ($2.46B across 15 rounds), secondary market indications from
      Nasdaq Private Market, and unverified private market revenue estimates.
