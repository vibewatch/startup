  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Stance, and Recommendation Framework
        blocks:
          - type: paragraph
            body: >
              Rappi represents Latin America's primary multi-vertical super-app, integrating restaurant delivery,
              quick-commerce groceries via dark stores and its Amazon Now partnership, and proprietary fintech offerings
              including RappiPay and partner credit cards across nine regional markets. The bull case rests on high
              urban density, compounding multi-category cross-selling where mature cohorts transact up to 11 times per
              month, and structural delivery cost efficiencies of approximately 10% of GMV using bike and motorcycle
              fleets compared to 14–32% for developed-market peers. However, the investment recommendation is
              constrained to 'track' with medium confidence and a high risk rating, reflecting a 'stretched' valuation
              stance relative to unverified private revenue and liquidation preference overhang.


              While private equity rounds benchmarked the company at $5.25B following its July 2021 Series F financing
              led by T. Rowe Price and subsequent $25M extension from Amazon in September 2025, secondary trading
              signals and marketplace comparables imply a stark valuation haircut of 60% to 68%, trading between $1.7B
              and $2.0B. Entry at or near the last preferred headline price carries severe downside risk because earlier
              investors hold substantial senior liquidation preferences from $2.46B in total financing rounds, including
              $357M in debt facilities. In the absence of an SEC S-1 registration statement or audited parent-level
              consolidated P&L statements for FY2024–FY2025, underwriting equity exposure on unverified management
              figures would violate fundamental margin-of-safety principles.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: figure
            figureRef: FV001
            claimRefs:
