      - number: '7.3'
        title: Partner Concentration and Platform Dependencies
        blocks:
          - type: paragraph
            body: >-
              Rappi's asset-light super-app model relies heavily on strategic counterparties across financial
              underwriting, cloud infrastructure, and enterprise data analytics. In financial services, the dissolution
              and sale of Rappi's 44.28% stake in RappiCard Mexico to Banorte for US$50 million transforms Rappi from an
              equity owner with co-governance rights into an exclusive origination channel subject to a 15-year
              commercial agreement. This structure concentrates Mexican credit origination around a single banking
              partner, leaving Rappi vulnerable to adverse counterparty decisions or changes in banking appetite. On the
              infrastructure tier, Rappi's high-throughput transactional backbone is hosted on Amazon Web Services
              (AWS), utilizing services such as Amazon DocumentDB, Amazon EC2, Amazon RDS, and Amazon ECS across
              multiple regional deployments. Any degradation in AWS regional availability directly threatens order
              routing and real-time courier dispatch. Similarly, on the software and supply chain execution layer,
              modern automated replenishment frameworks demonstrate that autonomous planning and ordering systems risk
              failure from stale evidence in replan loops, residual lead-time mismatches, and supplier API disconnects.
              Incomplete supplier visibility or delayed feedback requires deterministic verification gates and human
              escalation paths to prevent costly procurement errors. If cloud infrastructure or merchant integration
              pipelines fail, Rappi bears substantial residual financial and operational exposure.
            claimRefs:
              - CR003
              - CR004
              - CR012
              - CR013
              - CR014
              - CR015
