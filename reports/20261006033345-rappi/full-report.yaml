  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Exposures
        blocks:
          - type: paragraph
            body: >-
              Rappi operates across nine Latin American jurisdictions with complex, evolving regulatory environments
              spanning fintech, antitrust compliance, consumer protection, and merchant contracting. The most acute
              confirmed regulatory enforcement action involves Mexico's National Antitrust Commission (CNA), which
              sanctioned Grupo Financiero Banorte and Rappi with a fine of MX$19.9 million (approximately US$1.1
              million) over an unauthorized business concentration. The CNA determined that the parties executed their
              July 20, 2020 alliance agreement—establishing the Tarjetas del Futuro venture behind RappiCard—granting
              Banorte operational intervention rights in Rappi's credit card management before mandatory antitrust
              clearance. While Banorte subsequently obtained clearance to acquire Rappi's remaining 44.28% stake in
              April 2025 for US$50 million with a 15-year exclusivity agreement, the precedent highlights severe
              execution risk in joint-venture structuring. Beyond antitrust penalties, Rappi's legal exposure extends to
              partner merchant terms. The RappiOne Ally Platform Terms and Conditions (administered by Rappi S.A.S. and
              Rappi Inc.) impose strict unilateral liability limitations: Rappi explicitly disclaims liability for
              indirect or direct damages resulting from platform downtime or unavailability, disclaims guarantees of
              continuous 24-hour operation, and shifts data accuracy risks arising from automated catalog
              re-categorization to the ally. These terms create friction with commercial partners and expose Rappi to
              commercial litigation and regulatory scrutiny across Latin American consumer and commerce authorities.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR009
