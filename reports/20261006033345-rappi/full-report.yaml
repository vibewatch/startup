      - number: '6.2'
        title: Adoption signals are broad but not cohort-comparable
        blocks:
          - type: paragraph
            body: >-
              The available adoption figures mix different populations and vintages. Verto claims more than 30 million
              active users across nine countries in 2026, but the article does not disclose whether "active" means
              monthly transacting users, registered accounts, or another denominator. Wikipedia reports that Rappi
              worked with more than 250,000 businesses in August 2020, whereas current country storefronts advertise
              more than 40,000 allies across nine countries; the figures should not be trended because "businesses" and
              "allies" may cover different populations. The same secondary source reports 300,000 RappiBank
              savings-account customers and, in Colombia, around 750,000 RappiPay users and more than 120,000
              distributed credit cards, but those figures are not dated consistently on the page. EMARKETER identifies
              shifting 2026 regional food-delivery purchasing behavior, yet its accessible topic page supplies no
