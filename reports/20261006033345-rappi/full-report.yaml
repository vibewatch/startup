      - CP001
      - CP002
      - CP004
      - CP005
      - CP012
      - CP014
  - id: FI001
    title: Activity-to-profit evidence bridge
    type: flow
    summary: >-
      A conceptual bridge separates observed monetization mechanisms from the private inputs needed to reach gross
      profit and cash flow.
    data:
      nodes:
        - id: activity
          label: Consumer and merchant activity
          detail: Orders, sales, frequency, average ticket, and SKU metrics are visible in Rappi's merchant tooling.
        - id: transaction-revenue
          label: Transaction revenue
          detail: Estimated merchant commission and customer delivery-fee ranges; realized take rate is unavailable.
        - id: recurring-and-media
          label: Subscription, advertising, and data fees
          detail: >-
            Prime and advertising mix are estimated; RappiOne has official subscription mechanics but undisclosed
            pricing.
        - id: reported-revenue
          label: Reported or estimated revenue
          detail: $856M appears in two third-party datasets with an unresolved period and accounting basis.
        - id: variable-costs
          label: Delivery and service costs
          detail: Courier payouts, incentives, refunds, payment losses, and merchant support are not publicly quantified.
        - id: fixed-costs
          label: Technology and multi-market operations
          detail: >-
            APIs, reliability, country integrations, engineering, and regulatory obligations form an observable but
            unquantified cost layer.
        - id: profit-and-cash
          label: Gross profit, EBITDA, and cash flow
          detail: Positive EBITDA is management-reported; gross margin, cash conversion, burn, and runway remain private.
    approximationNotes: >-
      Conceptual sequence only; node order does not imply quantified conversion rates, common denominators, or audited
      accounting recognition.
    claimRefs:
      - CI011
      - CI012
      - CI016
  - id: FE001
    title: Rappi Multi-Tier Operating Architecture Stack
    type: stack
    summary: >-
      Structural view of Rappi's operating architecture spanning client presentation, partner integration, ML
      orchestration, persistence, cloud infrastructure, and observability.
    data:
      layers:
        - label: Client Experience Layer
          detail: >-
            Bi-weekly phased release iOS and Android mobile apps, consumer web portal, cart management, localized
            product search, and address routing
        - label: Partner & API Integration Layer
          detail: >-
            Developer Portal REST APIs, webhook dispatch, menu catalog sync, Integrations Manager diagnostics, and
            enforced 98% request reliability standards
        - label: ML & Data Platform Layer
          detail: >-
            Proprietary RappiFlow Airflow orchestration on Kubernetes, JupyterHub experimentation clusters, cross-squad
            feature store, and entity vector embeddings
        - label: Data Persistence & Transaction Layer
          detail: >-
            Amazon RDS relational database clusters, Amazon DocumentDB document stores, and distributed caching for
            partner configuration and order status
        - label: Cloud Compute & Container Fabric
          detail: >-
            1,000+ distributed microservices and 15,000+ active containers orchestrated via Amazon ECS and Kubernetes
            clusters across AWS regional availability zones
        - label: Enterprise Observability & Incident Response
          detail: >-
            Splunk Observability Cloud, Splunk APM, and Splunk On-Call automated mobile paging monitoring 6,000 hosts
            with sub-2s vertical load alerting
    approximationNotes: >-
      Architectural layers abstract Rappi's disclosed production microservice topology across engineering and
      infrastructure case studies.
    claimRefs:
