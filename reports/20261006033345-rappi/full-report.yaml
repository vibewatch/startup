      - number: '8.2'
        title: Capitalization Structure, Secondary Marks, and Entry Discipline
        blocks:
          - type: paragraph
            body: >
              Rappi has raised $2.46B across 15 funding rounds, encompassing two seed rounds, three early-stage equity
              rounds, seven late-stage equity rounds, and three conventional debt facilities. Institutional equity
              backers include SoftBank ($1B Series E lead in April 2019), DST Global ($220M Series D lead in September
              2018), Delivery Hero ($185M Series C lead in April 2018), Andreessen Horowitz, Sequoia Capital, and T.
              Rowe Price ($500M Series F lead in July 2021 at a $5.25B post-money valuation). In August 2025, Rappi
              secured a $100M 4-year senior secured credit facility from Banco Santander and Kirkoswald Capital Partners
              for refinancing and working capital, following prior debt facilities of $145M in March 2022 and $112M in
              October 2022.


              Secondary marketplace data from Nasdaq Private Market (NPM) and private market estimates indicate
              indicative transaction prices around $19.83–$19.89 per share as of September 2026, implying an enterprise
              equity valuation of approximately $1.7B to $2.0B. This represents a 62% to 68% compression from the $5.25B
              preferred headline mark. Because preference stacks typically guarantee 1x non-participating or
              participating return of capital to Series E and F investors before common or secondary equity
              participates, secondary buyers face total loss or severe subordination if an eventual public listing or
              trade sale clears below $2.5B. Strict entry discipline dictates avoiding primary commitments above 2.0x
              trailing GMV or unverified net revenue, and demanding full cap-table waterfall visibility.
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenario Analysis, Peer Multiples, and Diligence Verification
        blocks:
          - type: paragraph
            body: >
              Valuation scenarios model three distinct operational trajectories over a 24-month horizon through late
              2028. The Bull case (25% probability) assumes successful execution of the Amazon Now grocery logistics
              rollout in Mexico and Brazil, scaling high-margin retail media advertising (RappiAds) to exceed 15% of net
              revenues, sustained positive EBITDA exceeding $100M annually, and a successful US IPO at 3.0x net revenue
              ($2.8B–$3.5B enterprise value). The Base case (50% probability) anticipates moderate regional growth,
              continuing margin pressure from iFood in Brazil where Rappi committed R$1.4B through 2028, and a delayed
              public offering or down-round crossover round at 1.5x–2.0x net revenue ($1.6B–$2.1B enterprise value),
              aligning closely with current secondary trading marks.


              The Bear case (25% probability) reflects intensifying competitive retaliation from incumbent delivery
              operators, foreign exchange volatility across Latin American currencies, losses in Brazilian expansion,
              and fintech asset impairment. In this downside scenario, enterprise value compresses below $1.0B, wiping
              out common share equity value and junior preferred tranches beneath the senior debt and preferred
              liquidation stack. Diligence verification must prioritize obtaining audited parent entity financial
              statements, reviewing the Banorte $50M carve-out terms for RappiCard Mexico, inspecting RappiPay Colombia
              regulatory balance sheets, and confirming exact debt covenant compliance under the $100M Santander
              facility.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Capital Discipline: Defer Primary Capital Until S-1 Verification'
            body: >-
              Prospective institutional investors should avoid subscribing to unpriced primary financing or secondary
              equity at marks reflecting the 2021 $5.25B peak. The 65% discount observed on secondary venues
              ($1.7B–$2.0B) reflects rational market pricing for Latin American platform execution, regional currency
              headwinds, and preference overhang. Track Rappi until an SEC S-1 disclosure validates consolidated audited
              numbers.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV014
          - type: callout
            title: Senior Preference Stack and Debt Overhang
            body: >-
              With $357M in cumulative debt facilities—including a $100M senior secured loan from Santander and
              Kirkoswald in August 2025—plus $2.1B+ in cumulative preferred venture capital, junior equity holders face
              severe subordination risk. Any exit transaction below $2.5B threatens to return little to no value to
              common shareholders and junior option pools.
            calloutType: risk
            claimRefs:
              - CV005
              - CV008
              - CV010
              - CV015
