      - number: '5.3'
        title: Distributed Architecture and Machine Learning Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Rappi's underlying operating model runs on Amazon Web Services infrastructure, scaling from a centralized
              retail delivery service into a distributed microservices ecosystem running across Amazon Elastic Container
              Service and Kubernetes clusters. To reduce time-to-market for predictive features, Rappi's data
              organization instituted a multi-layer Machine Learning Platform composed of RappiFlow—an Airflow
              distribution with proprietary plugins running on Kubernetes—alongside cloud-hosted JupyterHub environments
              and centralized vector embedding repositories that map entities such as products, orders, users, and
              stores into unified vector representations. Engineering teams are organized in a cross-functional matrix
              structure combining specialized domain squads (such as restaurants, onboarding, and RappiAds) with core
              disciplines across analytics, data science, and infrastructure engineering, ensuring rapid delivery across
              regional headquarters.
            claimRefs:
