chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Multi-Vertical Super-App Model
        blocks:
          - type: paragraph
            body: >-
              Rappi was established in Bogotá, Colombia in 2015 by entrepreneurs Simón Borrero, Sebastián Mejía, and
              Felipe Villamarín, initially operating as an on-demand delivery platform for neighborhood merchants and
              consumers. Over a decade of aggressive execution, the enterprise expanded beyond food delivery into a
              comprehensive regional super-app incorporating grocery logistics, pharmacy orders, e-commerce fulfillment,
              and financial services through RappiPay and RappiCard. The platform currently operates across nine Latin
              American nations—including Colombia, Mexico, Brazil, Argentina, Chile, Peru, Uruguay, Ecuador, and Costa
              Rica—covering more than 400 metropolitan cities. Commercial operations are administered by RAPPI S.A.S.,
              which coordinates developer APIs, merchant store onboarding, and the RappiOne analytics platform for
              enterprise brand allies. Statutory filings in Colombia demonstrate that domestic operations generated
              767,316 million Colombian pesos ($236.55 million USD) in 2025 revenue, reflecting substantial monetization
              across core delivery and financial verticals.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO010
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO008
              - CO009
              - CO010
              - CO011
              - CO013
      - number: '1.2'
        title: Founders, Leadership Structure, and Governance Evolution
        blocks:
          - type: paragraph
            body: >-
              The core founding trio—Simón Borrero (Chief Executive Officer), Sebastián Mejía, and Felipe
              Villamarín—guided Rappi through multiple hypergrowth cycles following their incubation at Y Combinator in
              2016. In 2024, the enterprise marked an important corporate governance milestone when Sebastián Mejía
              stepped down from his executive role as operational president after nearly ten years, transitioning into a
              non-executive stewardship role on the Board of Directors. Domestic geographic management is anchored by
              country heads such as Matías Laks, CEO of Rappi Colombia, who oversees operational scale exceeding eight
              million monthly deliveries. Engineering execution is structured into specialized functional business
              units; for example, the restaurant engineering vertical encompasses over 140 technical personnel and 15
              agile squads directed by VP of Engineering Facundo Viale. Major institutional capital partners hold formal
              board representation, notably SoftBank Investment Advisers managing partner Jeffrey Housenbold, ensuring
              institutional alignment across global growth initiatives.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
      - number: '1.3'
        title: Capitalization History, Institutional Investors, and Debt Facilities
        blocks:
          - type: paragraph
            body: >-
              Rappi is among the most heavily capitalized private technology startups in Latin America, having raised
              approximately $2.46 billion in total funding across 15 financing rounds. The company made history in
              September 2018 when a Series D round led by DST Global propelled its post-money valuation past $1.0
              billion, establishing Rappi as Colombia's first technology unicorn. Institutional capitalization
              accelerated dramatically in April 2019 when Japan's SoftBank Group Corp committed $1.0 billion through an
              equal split between its SoftBank Vision Fund and newly created Latin America Innovation Fund. High-profile
              early and growth syndicate investors include Sequoia Capital, Andreessen Horowitz, Delivery Hero, and Y
              Combinator. Recent capital actions demonstrate a shift toward structured liquidity and commercial
              alignment, marked by a $100 million conventional debt facility arranged with Banco Santander in August
              2025 and a $25 million Series F convertible transaction with Amazon in September 2025.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO014
      - number: '1.4'
        title: Operating Scale, Regional Footprint, and Financial Turning Point
        blocks:
          - type: paragraph
            body: >-
              Following nearly a decade dominated by aggressive geographic expansion and substantial cash burn, Rappi
              achieved a pivotal financial inflection point in its domestic market. Filings compiled by Colombia's
              Superintendencia de Sociedades reveal that Rappi registered positive net income for two consecutive
              operating periods: generating a net profit of 97,250 million Colombian pesos in 2024, followed by 210,176
              million pesos ($64.82 million USD) in 2025, representing an annual profit expansion of 116%. This
              turnaround stands in stark contrast to its historical capital deployment, where accumulated losses had
              mounted to 1.2 trillion Colombian pesos ($369.99 million USD) against 1.8 trillion pesos in cumulative
              revenue through 2023. While third-party market intelligence estimates Rappi's global run-rate revenue at
              roughly $1.3 billion ARR with an employee footprint between 12,600 and 14,849 personnel, consolidated
              parent-level audited financials covering Mexican and Brazilian subsidiaries remain undisclosed private
              records.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.5'
        title: Corporate Milestones, Strategic Alliances, and Operational Headwinds
        blocks:
          - type: paragraph
            body: >-
              Rappi's evolution from a scrappy courier app in 2015 to a diversified Latin American platform has been
              punctuated by major commercial partnerships and persistent operating complexities. In September 2025, the
              company entered a high-profile strategic relationship with Amazon to explore integrating last-mile parcel
              logistics with Rappi's courier network and evaluating mutual subscription bundling between Rappi Prime and
              Amazon Prime. Nonetheless, scaling rapid on-demand logistics introduces critical operational bottlenecks.
              Rappi's agile fleet is inherently structured around motorcycle and bicycle couriers handling small
              restaurant orders and groceries, creating capacity constraints for larger retail parcels. Concurrently,
              public reports highlight service friction regarding customer support response times and delivery accuracy,
              while labor regulators across Latin America increasingly scrutinize the independent contractor status of
              tens of thousands of gig couriers, creating prospective cost pressures.
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO010
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO010
              - CO014
              - CO015
      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Pivot from Subsidized Hypergrowth to Local Unit Profitability
            body: >-
              Rappi's audited Colombian filings demonstrate an inflection from historical cash burn (1.2 trillion COP in
              accumulated losses through 2023) to consecutive net profits of 97.25B COP in 2024 and 210.18B COP in 2025.
              However, consolidated parent-level financials covering Mexico, Brazil, and other regional operations
              remain private and undisclosed.
            calloutType: insight
            claimRefs:
              - CO010
              - CO011
              - CO012
          - type: callout
            title: Labor Regulation and Courier Network Bottlenecks
            body: >-
              Rappi's agile gig-economy courier model faces mounting regulatory headwinds across Latin American
              jurisdictions debating mandatory benefits and formal employee classification. In parallel, strategic
              expansion with partners like Amazon tests courier capacity optimized strictly for small-parcel delivery.
            calloutType: risk
            claimRefs:
              - CO014
              - CO015
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Architecture, and Addressable Spend
        blocks:
          - type: paragraph
            body: >-
              The Latin American on-demand delivery and super-app ecosystem represents a multi-billion dollar
              transaction environment connecting urban consumers with merchants and couriers. Rappi's commercial scope
              encompasses five primary operating segments: restaurant food delivery, grocery and convenience quick
              commerce (including Turbo 10-minute fulfillment), pharmacy and personal essentials, general retail
              e-commerce, and financial services under RappiPay and RappiBank. In Latin America's densely populated
              metropolitan areas, the addressable spend spans both discretionary food ordering and nondiscretionary
              weekly grocery and household procurement. However, direct on-demand delivery captures only a digital
              facilitation fee (merchant take rates and customer delivery surcharges) rather than the entirety of gross
              merchandise volume (GMV). Status-quo alternatives include informal neighborhood commerce, direct merchant
              phone ordering, and physical retail errands, which still represent the vast majority of Latin American
              household consumption.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
      - number: '2.2'
        title: Market Sizing Lenses and Constrained Addressable Opportunity
        blocks:
          - type: paragraph
            body: >-
              Sizing the addressable market for Latin American on-demand platforms requires distinguishing between total
              retail grocery and restaurant spending, digital penetration, and serviceable capture. Total retail food
              and beverage spend across Rappi's nine operating markets exceeds $150 billion annually, yet online
              delivery penetration remains concentrated in Tier-1 and Tier-2 metropolitan centers. Statista and
              third-party industry trackers estimate Latin America's online food delivery user base expanding toward
              regional maturity, but private platform opacity prevents an audited parent-level GMV confirmation.
              Third-party benchmarks indicate Rappi generated substantial annual transaction volume across 400+ cities,
              reaching 35 million platform users and commanding over 50% market share in Colombia. In contrast, in
              Brazil, incumbent iFood retains dominant category leadership, constraining Rappi's serviceable addressable
              market (SAM) to urban smartphone cohorts with disposable income and digital payment instruments.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM011
              - CM012
      - number: '2.3'
        title: Tripartite Marketplace Dynamics and Buyer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Rappi's marketplace model operates via a tripartite ecosystem comprising consumers (end users), commercial
              allies (restaurants, grocers, and consumer brands), and independent couriers. Consumer segmentation
              centers on middle-to-high-income urban dwellers prioritizing delivery speed and friction-free convenience
              across meals, groceries, and pharmacy. Commercial allies range from enterprise multi-location restaurant
              chains and consumer packaged goods (CPG) manufacturers to independent neighborhood retailers. CPG brands
              interact with the platform through specialized B2B offerings such as RappiOne, where brand managers
              license performance analytics and sponsored placement across cities and categories. Merchants integrate
              directly into inventory and order routing workflows through developer APIs and merchant management
              portals, while independent couriers provide flexible labor capacity subject to localized earnings
              incentives.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Adoption Tailwinds, Regulatory Bottlenecks, and Structural Headwinds
        blocks:
          - type: paragraph
            body: >-
              Market adoption is propelled by smartphone ubiquity, urban density, algorithmic routing optimization, and
              strategic investments in AI supply-chain technology such as Fountain9. However, Rappi's expansion
              encounters acute structural headwinds. Governments across Latin America, notably in Colombia and Brazil,
              have advanced legislative proposals seeking to reclassify gig-economy couriers from independent
              contractors to formal employees. Mandating formal employment status, minimum hourly wages, and social
              security contributions would fundamentally increase unit delivery costs, challenging low-labor-cost
              platform economics. Concurrently, competitive fragmentation in key geographies—such as iFood's dominance
              in Brazil and Uber Eats' presence in Mexico—induces promotional discounting and limits commission
              expansion, requiring platforms to balance consumer retention with unit contribution margins.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Labor Reclassification Risk Threatens Unit Economics
            body: >-
              Legislative debates in Colombia and Brazil targeting gig worker reclassification represent a structural
              threat to Rappi's low-labor-cost business model, with potential mandates for minimum wage and social
              security contributions.
            calloutType: risk
            claimRefs:
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, Direct Peers, and Substitutes
        blocks:
          - type: paragraph
            body: >
              The competitive set is broader than restaurant delivery. Independent directories consistently identify
              Uber Eats and iFood as direct peers, while a separate regional directory identifies PedidosYa as a direct
              competitor in Uruguay, Argentina, and Chile [CP001, CP002]. Tracxn uses a wider global peer set—DoorDash,
              Glovo, and Delivery Hero—showing that the comparison changes with the geographic and corporate lens
              [CP003]. Rappi itself is presented as a multi-vertical service spanning food, grocery, pharmacy, other
              retail, payments, and travel, and Statista describes operations across nine Latin American countries and
              more than 400 cities [CP004, CP005]. Adjacent pressure also matters: Mercado Envíos can substitute for
              parts of Rappi's retail-logistics proposition, while JOKR is listed against rapid grocery delivery
              [CP012]. The evidence does not establish that every named platform overlaps in every country, so the
              profile table treats the landscape as a partial, evidence-bounded sample rather than an exhaustive market
              map.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP010
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP012
              - CP014
      - number: '3.2'
        title: Capability, Merchant Workflow, and Distribution
        blocks:
          - type: paragraph
            body: >
              Rappi's strongest documented capability evidence concerns the merchant side of the network. RappiOne
              exposes performance metrics by country, city, category, manufacturer, and brand, while the restaurant API
              covers menus, orders, schedules, stock availability, and webhooks [CP006, CP008]. A 2021 engineering
              account described 15 restaurant-domain squads working across the customer app, restaurant onboarding,
              advertising, operations, and partner self-service, which demonstrates historical organizational investment
              but not current staffing or superior execution [CP009]. These tools can deepen operational integration
              because merchants connect catalogs and order workflows to Rappi; however, the public documentation
              contains no exclusivity term or switching-cost measurement [CP013]. The assigned evidence also lacks
              equivalent official product and developer documentation from Uber Eats, iFood, and PedidosYa. Accordingly,
              the capability matrix marks unsupported rival cells as unknown rather than assuming parity or inferiority,
              and it distinguishes documented functionality from competitive proof.
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP008
              - CP011
      - number: '3.3'
        title: Pricing, Scale Signals, and Moat Durability
        blocks:
          - type: paragraph
            body: >
              Public scale signals show substantial capital behind the category but do not reveal operating liquidity or
              market share. Tracxn reports that Rappi raised $2.46 billion over 15 rounds and records a $25 million
              Series F in September 2025; these are financing amounts, not cash available [CP010]. The same source
              profiles iFood as a Brazil-based food-and-grocery platform with $592 million of funding, while other
              independent sources place Uber Eats and PedidosYa in Rappi's direct set [CP001, CP002, CP011]. On pricing,
              the clearest primary evidence is merchant-facing: RappiOne provides a three-month trial, followed by a
              privately agreed subscription charge that is separate from the Rappi marketplace commission [CP007].
              Secondary descriptions also identify RappiPrime as a monthly subscription with delivery and discount
              benefits [CP016]. No assigned source provides comparable current fees, merchant take rates, discount
              depth, or contract terms for the major rivals. The defensible conclusion is therefore narrow: breadth and
              integration create potential retention levers, but the evidence cannot establish lock-in, pricing power,
              or a durable moat [CP013, CP014].
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP010
              - CP011
              - CP013
              - CP014
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Moat evidence is incomplete
            body: >-
              Rappi's merchant integrations and multi-service breadth are documented, but the assigned sources do not
              quantify exclusivity, consumer or courier multi-homing, retention lift, competitor pricing, or realized
              switching costs. Those omissions prevent a high-confidence durability conclusion.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Rappi appears to monetize several layers of the same commerce network rather than one recurring software
              contract. Sacra estimates merchant commissions at 75% of 2023 revenue, advertising at 13%, Prime
              subscriptions at 10%, and e-commerce at 2%; these are analyst estimates, not audited disclosures. It also
              estimates merchant commissions of 10%–30% of order value and customer delivery fees of 5%–15%, which
              should not be treated as realized take rate. Rappi's own RappiOne terms add a business-data subscription:
              allies receive a three-month trial, then pay a negotiated amount and a platform-use commission in addition
              to the underlying marketplace commission. RappiOne exposes sales, order, frequency, average-ticket,
              channel, and SKU metrics, suggesting merchant data and measurement can deepen monetization, but no public
              realized price or revenue contribution is available.
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI010
              - CI011
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI011
              - CI012
              - CI016
      - number: '4.2'
        title: Traction and revenue quality
        blocks:
          - type: paragraph
            body: >-
              The strongest public revenue number is still an estimate with an unclear accounting perimeter. Sacra
              estimates $856 million of 2023 revenue, up 37% from 2022. Multiples also records $856 million alongside a
              September 2025 financing, but says such figures are typically run-rate revenue or reported LTM; that
              convention does not establish that Rappi generated exactly $856 million in 2025. Two independent profiles
              report management's claim of four consecutive positive-EBITDA quarters during 2025, while also saying
              profits were being fully reinvested. EBITDA is not free cash flow, and the public record provides no
              reconciliation to audited revenue, gross profit, stock compensation, working capital, capex, interest,
              taxes, or consolidated net income.
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
              - CI009
      - number: '4.3'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              Public operating evidence identifies cost drivers but does not quantify contribution margin. Rappi's
              restaurant APIs manage menus, orders, item availability, stores, schedules, and webhooks across
              country-specific domains, implying ongoing integration, reliability, and multi-market support expense. A
              2021 company engineering post described more than 140 people and 15 squads in the Restaurants engineering
              unit and explicitly tracked infrastructure cost and potential losses from failures; this is historical
              evidence of a meaningful fixed technology layer, not a current headcount estimate. Labor regulation is a
              material downside: EquityZen warns that employee classification could add wages and social-security
              obligations. Without courier cost per order, incentives, refunds, payment losses, dark-store occupancy,
              support costs, and country-level gross profit, neither the margin path nor sales efficiency can be
              independently tested.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI007
              - CI008
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Capital adequacy remains unresolved despite signs of financing access. Tracxn and Sacra both report a $100
              million debt financing in August 2025; Sacra describes a four-year senior secured facility for refinancing
              and working capital. Separately, third-party profiles say Rappi was reinvesting all profit, which makes
              the conversion from adjusted profitability to liquidity especially important. The assigned Nasdaq Private
              Market and careers pages yielded no usable Rappi-specific price, staffing, or financial metric in their
              retained text, so they cannot close the valuation or cost-base gaps. The financial verdict is therefore
              conditional: multiple revenue streams and reported positive EBITDA are encouraging, but debt,
              reinvestment, and aggressive operating complexity make audited statements, cash, burn, covenant headroom,
              and segment contribution margins prerequisites to underwriting.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Profitability is not liquidity
            body: >-
              Reported positive EBITDA and full profit reinvestment do not reveal cash generation, debt service,
              working-capital needs, or runway; the $100 million debt facility increases the importance of a cash-flow
              and covenant review.
            calloutType: risk
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI016
          - type: callout
            title: Gate underwriting on audited financial evidence
            body: >-
              Require audited consolidated statements, a revenue-definition bridge, country and vertical contribution
              margins, unit-economics cohorts, current cash and burn, and the complete debt agreement before assigning a
              financeable valuation.
            calloutType: recommendation
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflows
        blocks:
          - type: paragraph
            body: >-
              Rappi delivers an on-demand multi-vertical consumer Super-App spanning restaurant meals, supermarket
              groceries, pharmacy essentials, e-commerce merchandise, travel bookings, and digital financial products
              across nine Latin American nations. In customer workflow terms, consumers search localized inventories,
              customize item selections, manage real-time carts, configure courier gratuities, and initiate mobile
              checkout flows backed by automated address resolution. Merchant allies configure catalog availability,
              synchronize retail store menus, and process incoming order requests either through web management portals
              or programmatic REST APIs. External community tooling and reverse-engineered client interfaces illustrate
              that core interactions follow standardized REST endpoints for catalog discovery, cart modification,
              checkout preview, and order tracking. However, platform resilience remains strictly coupled to merchant
              responsiveness, requiring integration standards that penalize partner software failures.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE004
              - CE006
              - CE013
              - CE014
      - number: '5.2'
        title: Platform Modules, Merchant Surfaces, and Developer Ecosystem
        blocks:
          - type: paragraph
            body: >-
              The platform's technical architecture spans consumer-facing client applications, dedicated merchant
              portals, and backend integration engines. For retail partners, Rappi provides the Integrations Manager and
              allied Developer Portals to facilitate technical support, manage configuration credentials, and monitor
              webhook events for order lifecycles. To maintain platform throughput during peak demand windows, Rappi
              imposes rigorous operational performance standards on integrated partners: merchant webhook listeners and
              polling clients must maintain at least a 98% API request success rate and space polling requests by at
              least 45 seconds to avoid access revocation or de-listing. Beyond proprietary web and mobile interfaces,
              third-party developer initiatives have created command-line utilities and Model Context Protocol servers
              to bridge external AI assistants and client scripts with Rappi's catalog and order APIs, underscoring
              community demand for programmable platform access.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
