  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration
      - Failure Scenario
      - Severity
      - Mitigation
      - Residual Exposure
    rows:
      - - Banking Partner & Capital Underwriter
        - Grupo Financiero Banorte
        - Credit card balance sheet, regulatory umbrella, and underwriting
        - Exclusive (Mexico)
        - Counterparty alters underwriting standards, cuts marketing support, or terminates 15-year alliance
        - Critical
