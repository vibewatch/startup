      - number: '7.2'
        title: Operational Reliability, Partner Friction, and Engineering Execution
        blocks:
          - type: paragraph
            body: >-
              Operational integrity across Rappi's multi-sided marketplace depends on tightly coupled integration
              touchpoints between retail allies, delivery logistics, and core platform microservices. Rappi's official
              Developer Portal reveals substantial technical vulnerabilities inherent in its order-lifecycle mechanics.
              Merchant allies are constrained to an inflexible four-minute SLA window to accept or reject incoming
              orders before Rappi's automated systems trigger an irreversible order cancellation due to timeout.
              Furthermore, orders can only be processed once; any attempt to accept or reject an already-processed or
              timed-out order triggers an unrecoverable system error. Order events must be queried via polling
              endpoints, while access tokens expire on a rigid 7-day schedule, requiring continuous automated credential
              refresh cycles across thousands of merchant systems. When allies reject orders due to SKU mismatches,
              pricing discrepancies, or missing toppings, fulfillment cycles break down and degrade consumer retention.
              From an engineering and organizational perspective, historical reflections from technical leadership
              describe scaling challenges where engineering teams of over 140 personnel across 15 squads must navigate
              carryover, velocity bottlenecks, and infrastructure reliability without silver-bullet solutions. The
              continuous need to balance rapid time-to-market against platform stability creates ongoing vulnerability
              to merchant dissatisfaction, customer churn, and operational outages across peak operating windows.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
