  - id: FP001
    title: Ordinal Competitive Positioning from Available Evidence
    type: quadrant
    summary: >-
      Points use a three-level ordinal assessment: x represents evidenced Latin American footprint and y represents
      evidenced service breadth; they are not market-share or performance scores.
    data:
      points:
        - label: Rappi
          x: 3
          'y': 3
          detail: Nine-country footprint; multi-vertical consumer and merchant tooling documented.
        - label: Uber Eats
          x: 2
          'y': 1
          detail: Direct relevance is documented, but quantified regional footprint and broader scope are unavailable.
        - label: iFood
          x: 1
          'y': 2
          detail: Brazil-based food-and-grocery platform in the assigned evidence.
        - label: PedidosYa
          x: 2
          'y': 2
          detail: Overlap in three named countries with food, grocery, and pharmacy scope.
        - label: Mercado Envíos
          x: 2
          'y': 2
          detail: Regional parcel network and adjacent grocery or supermarket logistics substitute.
        - label: JOKR
          x: 1
          'y': 1
          detail: Quick-commerce specialist listed against Rappi; broader overlap is unquantified.
    approximationNotes: >-
      Ordinal values are analytical encodings of cited scope, not measured market share, quality, pricing, or financial
      performance. Missing competitor documentation depresses evidentiary scores and should not be read as product
      absence.
