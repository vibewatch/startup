figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Key corporate, financing, product, and governance milestones for Rappi from its 2015 founding through 2026.
    claimRefs:
      - CO001
      - CO006
      - CO007
      - CO010
      - CO014
      - CO015
    data:
      items:
        - label: Founding in Bogotá
          date: '2015'
          detail: >-
            Simón Borrero, Sebastián Mejía, and Felipe Villamarín launch Rappi in Colombia as an on-demand courier and
            beverage delivery service.
          tone: positive
        - label: Y Combinator Acceleration
          date: '2016'
          detail: >-
            Rappi participates in the Y Combinator W16 batch, securing early Silicon Valley venture backing from Sequoia
            Capital and Andreessen Horowitz.
          tone: positive
        - label: First Colombian Unicorn
          date: 2018-09
          detail: >-
            Rappi raises Series D round led by DST Global, surpassing a $1.0B valuation to become Colombia's first
            technology unicorn.
          tone: positive
        - label: SoftBank $1 Billion Investment
          date: 2019-04
          detail: >-
            SoftBank commits $1B from its Innovation Fund and Vision Fund; Jeffrey Housenbold joins the Board of
            Directors.
          tone: positive
        - label: Fintech & Multi-Vertical Expansion
          date: 2020–2021
          detail: >-
            Rolls out RappiPay financial services and RappiOne B2B analytics platform; footprint spans 9 Latin American
            countries and 400+ cities.
          tone: neutral
        - label: Governance Shift & Founder Transition
          date: '2024'
          detail: >-
            Co-founder Sebastián Mejía steps down as operational president after nearly a decade, transitioning to the
            Board of Directors.
          tone: warning
        - label: Inflection to Profitability in Colombia
          date: 2024–2025
          detail: >-
            Rappi reports consecutive annual net profits in Colombia: 97.25B COP in 2024 and 210.18B COP ($64.8M USD) in
            2025.
          tone: positive
        - label: Amazon Partnership & Debt Financing
          date: '2025'
          detail: >-
            Secures $100M debt facility from Santander in August 2025 and $25M strategic backing from Amazon in
            September 2025.
          tone: positive
        - label: Gig Labor Scrutiny & Courier Bottlenecks
          date: 2025–2026
          detail: >-
            Regional governments heighten scrutiny over gig-courier labor protections; delivery model faces challenges
            scaling bulky package logistics.
          tone: adverse
  - id: FM001
    title: Addressable market and operating scale sizing pyramid
    type: pyramid
    summary: >-
