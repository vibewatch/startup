      - number: '5.4'
        title: Observability, Scalability, and Technical Operational Dependencies
        blocks:
          - type: paragraph
            body: >-
              Processing over 8.8 million monthly orders across 250 Latin American cities requires continuous
              operational visibility. Facing legacy telemetry bottlenecks that took minutes to alert and hours to
              diagnose, Rappi integrated Splunk Observability Cloud across its fleet of 1,000+ microservices, 6,000
              cloud hosts, and 15,000 active containers. This observability fabric reduced mean time to resolution by
              more than 90%, supported a 300% order surge during peak pandemic demand, and provided real-time incident
              context via automated mobile alerting for on-call engineers. Despite these resilience gains, Rappi faces
              structural technical dependencies: core operations rely heavily on AWS cloud hosting, and mobile
              application crashes or gateway latency spikes directly threaten order conversion, merchant partner
              satisfaction, and transactional revenue.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strict Merchant SLA Risk and Asymmetric Integration Vulnerability
            body: >-
              Rappi's Developer Portal standards explicitly mandate that partner API integrations maintain a 98% request
              success rate, with non-compliant merchants facing immediate API revocation or delisting from the consumer
              application. While this protects customer ordering experience, it creates operational fragility for
              regional restaurants and retailers with limited technical development resources.
            calloutType: risk
            claimRefs:
              - CE006
              - CE007
          - type: callout
            title: Microservices Complexity Mitigated by Enterprise Real-Time Observability
            body: >-
              Operating 1,000+ microservices and 15,000+ containers across 9 countries created severe debugging
              bottlenecks prior to 2019, with legacy APM alerts taking minutes and fixes requiring hours. Rappi's
              deployment of Splunk Observability Cloud reduced MTTR by over 90%, proving that real-time unified
              telemetry is essential to sustaining hyper-growth delivery platforms.
            calloutType: insight
            claimRefs:
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: A multi-sided customer base with uneven public measurement
        blocks:
          - type: paragraph
            body: >-
              Rappi addresses consumers seeking food, grocery, pharmacy, shopping, travel, payment, and banking
              services, while restaurants and other merchants use the platform for demand generation and fulfillment.
              Its current Argentina, Mexico, and Colombia storefronts each claim that more than 40,000 allies across
              nine countries work with Rappi and tell merchants they can reach millions of users through immediate
              logistics; these are company-issued marketing claims, not audited active-account counts. Rappi also
              maintains a country-selectable restaurant onboarding portal, and its RappiOne terms define a separate
              subscription analytics product for commercial allies. The resulting customer architecture spans consumer
              users and payers, restaurants, retail or CPG brands, and fintech users, but public materials do not
              disclose revenue mix, active-account definitions, or segment-level economics.
