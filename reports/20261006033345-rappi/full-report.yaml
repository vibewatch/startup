        - Total dependence on single bank partner for Mexican card distribution
      - - Cloud Infrastructure Provider
        - Amazon Web Services (AWS)
        - Core hosting, database (DocumentDB/RDS), and container compute (EC2/ECS)
        - Single-cloud concentration
        - Regional AWS outage impairs real-time order matching and checkout
        - High
        - Multi-AZ deployments and microservices architecture across Latin American clusters
        - Switching costs and infrastructure downtime vulnerability during peak load
      - - Merchant Integration Partners
        - Enterprise Restaurant & Grocery Allies
        - Catalog supply, order fulfillment, and local stock availability
        - Fragmented across key brands
        - Allies reject platform terms, unpublish menus, or fail 4-minute acceptance SLA
        - Medium
        - Dedicated RappiOne portal, self-service tools, and custom POS integration APIs
        - Margin leakage and merchant churn to competing delivery aggregators
      - - Algorithmic Decisioning & Replenishment Systems
        - Automated Inventory / Supply Engines
        - Stock calculation, replenishment suggestions, and supplier PO generation
        - Internal / Vendor stack
        - Replan loops execute on stale evidence or residual mismatch, generating phantom orders
        - Medium
        - Deterministic validation gates, arithmetic guardrails, and human-in-the-loop escalation
        - Stockouts or excess inventory commitments if validation gates are bypassed
    notes: Ordered by severity. Assesses counterparty risk across capital partners, cloud providers, and retail allies.
