chapter:
  number: 5
  title: "Product & Technology"
  summary: "Rappi operates a high-throughput multi-sided marketplace platform managing over 1,000 microservices, 6,000 hosts, and 15,000 containers across Amazon Web Services. Its core operating model coordinates consumers, merchant partners, and courier delivery networks via proprietary machine learning pipelines, unified integration portals, and strict partner API service-level agreements."

sections:
  - id: "product-definition-and-workflows"
    title: "Product Definition and Customer Workflows"
    body: "Rappi delivers an on-demand multi-vertical consumer Super-App spanning restaurant meals, supermarket groceries, pharmacy essentials, e-commerce merchandise, travel bookings, and digital financial products across nine Latin American nations. In customer workflow terms, consumers search localized inventories, customize item selections, manage real-time carts, configure courier gratuities, and initiate mobile checkout flows backed by automated address resolution. Merchant allies configure catalog availability, synchronize retail store menus, and process incoming order requests either through web management portals or programmatic REST APIs. External community tooling and reverse-engineered client interfaces illustrate that core interactions follow standardized REST endpoints for catalog discovery, cart modification, checkout preview, and order tracking. However, platform resilience remains strictly coupled to merchant responsiveness, requiring integration standards that penalize partner software failures."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE002"

  - id: "module-and-platform-portfolio"
    title: "Platform Modules, Merchant Surfaces, and Developer Ecosystem"
    body: "The platform's technical architecture spans consumer-facing client applications, dedicated merchant portals, and backend integration engines. For retail partners, Rappi provides the Integrations Manager and allied Developer Portals to facilitate technical support, manage configuration credentials, and monitor webhook events for order lifecycles. To maintain platform throughput during peak demand windows, Rappi imposes rigorous operational performance standards on integrated partners: merchant webhook listeners and polling clients must maintain at least a 98% API request success rate and space polling requests by at least 45 seconds to avoid access revocation or de-listing. Beyond proprietary web and mobile interfaces, third-party developer initiatives have created command-line utilities and Model Context Protocol servers to bridge external AI assistants and client scripts with Rappi's catalog and order APIs, underscoring community demand for programmable platform access."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE001"

  - id: "architecture-and-operating-model"
    title: "Distributed Architecture and Machine Learning Infrastructure"
    body: "Rappi's underlying operating model runs on Amazon Web Services infrastructure, scaling from a centralized retail delivery service into a distributed microservices ecosystem running across Amazon Elastic Container Service and Kubernetes clusters. To reduce time-to-market for predictive features, Rappi's data organization instituted a multi-layer Machine Learning Platform composed of RappiFlow—an Airflow distribution with proprietary plugins running on Kubernetes—alongside cloud-hosted JupyterHub environments and centralized vector embedding repositories that map entities such as products, orders, users, and stores into unified vector representations. Engineering teams are organized in a cross-functional matrix structure combining specialized domain squads (such as restaurants, onboarding, and RappiAds) with core disciplines across analytics, data science, and infrastructure engineering, ensuring rapid delivery across regional headquarters."
    claimRefs:
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"

  - id: "observability-reliability-and-risks"
    title: "Observability, Scalability, and Technical Operational Dependencies"
    body: "Processing over 8.8 million monthly orders across 250 Latin American cities requires continuous operational visibility. Facing legacy telemetry bottlenecks that took minutes to alert and hours to diagnose, Rappi integrated Splunk Observability Cloud across its fleet of 1,000+ microservices, 6,000 cloud hosts, and 15,000 active containers. This observability fabric reduced mean time to resolution by more than 90%, supported a 300% order surge during peak pandemic demand, and provided real-time incident context via automated mobile alerting for on-call engineers. Despite these resilience gains, Rappi faces structural technical dependencies: core operations rely heavily on AWS cloud hosting, and mobile application crashes or gateway latency spikes directly threaten order conversion, merchant partner satisfaction, and transactional revenue."
    claimRefs:
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"

