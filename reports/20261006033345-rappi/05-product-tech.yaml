callouts:
  - calloutType: "risk"
    title: "Strict Merchant SLA Risk and Asymmetric Integration Vulnerability"
    body: "Rappi's Developer Portal standards explicitly mandate that partner API integrations maintain a 98% request success rate, with non-compliant merchants facing immediate API revocation or delisting from the consumer application. While this protects customer ordering experience, it creates operational fragility for regional restaurants and retailers with limited technical development resources."
    claimRefs:
      - "CE006"
      - "CE007"

  - calloutType: "insight"
    title: "Microservices Complexity Mitigated by Enterprise Real-Time Observability"
    body: "Operating 1,000+ microservices and 15,000+ containers across 9 countries created severe debugging bottlenecks prior to 2019, with legacy APM alerts taking minutes and fixes requiring hours. Rappi's deployment of Splunk Observability Cloud reduced MTTR by over 90%, proving that real-time unified telemetry is essential to sustaining hyper-growth delivery platforms."
    claimRefs:
      - "CE013"
      - "CE014"

