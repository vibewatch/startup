callouts:
  - calloutType: strength
    title: "Gokin's credible wedge"
    body: "The combination of large reported wafer capacity, global coverage and a BC module portfolio gives Gokin a plausible differentiated position beyond a pure commodity-wafer story."
    claimRefs: [CP002, CP006]
  - calloutType: risk
    title: "Scale is not yet a durable moat"
    body: "The assigned evidence does not establish Gokin's realized pricing, profitability, customer concentration, independent bankability score or BC yield advantage, while listed peers face the same industry-wide margin pressure."
    claimRefs: [CP009, CP013, CP015]
