schemaVersion: "report-v2"
artifact: financials
slug: gokin-solar
runDate: 2026-10-23
company:
  name: Gokin Solar
chapter:
  number: 4
  title: Financials
  summary: >-
    Gokin Solar discloses meaningful manufacturing scale and company-reported
    operating revenue above CNY20 billion for 2023, but the retained public
    evidence does not expose audited revenue mix, realized pricing, gross margin,
    cash, burn, debt, or working-capital quality. Historical funding and shipment
    claims therefore establish scale, not current liquidity or investable unit
    economics.
sections:
  - id: revenue-architecture
    title: Revenue architecture is industrial, diversified, and poorly quantified
    body: >-
      Gokin Solar describes three operating segments: monocrystalline silicon
      ingots and wafers, photovoltaic modules, and photovoltaic solar farms. That
      points to a manufacturing-and-project revenue model rather than recurring
      software economics, with revenue likely tied to physical volume, realized
      selling prices, product mix, delivery terms, and any project ownership or
      disposal model. The company website reports more than CNY20 billion of
      operating revenue in 2023, but labels its profile data as of the first
      quarter of 2025 and provides no audited statement, segment split, revenue
      recognition policy, or reconciliation to cash collection in the retained
      evidence. The headline is a traction marker, not ARR and not a current
      revenue run rate. Underwriting should separate wafers, modules, and solar
      farms because their pricing, capital cycles, warranty exposure, and cash
      conversion can differ materially.
    claimRefs: [CI001, CI002]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: commercial-scale
    title: Product and channel evidence shows throughput, not realized pricing
    body: >-
      Public operating evidence is strongest on physical scale. One third-party
      profile reports annual capacity of 100 GW of monocrystalline silicon rods,
      80 GW of wafers, and 16 GW of modules, while pv magazine reported that
      Gokin ended 2024 with 80 GW of ingot-and-wafer capacity and 4 GW of module
      capacity. The different vintages and scopes prevent a clean utilization
      inference. Gokin later claimed cumulative module shipments above 10 GW
      since its first module rolled off the line in October 2023, a top-two
      global wafer shipment position, more than 2,900 global partners, and
      business across more than 30 countries and regions. Those are company
      claims rather than audited sales records. They indicate distribution reach
      and shipment activity, but do not disclose customer concentration,
      contracted backlog, channel fees, distributor sell-through, sales cycle,
      CAC, or collections.
    claimRefs: [CI003, CI004, CI005, CI006, CI007, CI008]
  - id: pricing-and-unit-economics
    title: Product specifications define the sold unit, but not its economics
    body: >-
      The retained sources define module outputs but disclose no list or realized
      prices. pv magazine reports BC modules from 480 W to 780 W and efficiencies
      up to 24.8%; a Gokin datasheet hosted by Scribd describes a 570 W to 600 W
      TOPCon bifacial module with efficiency up to 23.2%. These specifications
      help identify the commercial unit, not revenue per watt or gross profit per
      module. Warranty terms also create a long-duration cost tail: the
      datasheet states a 15-year product warranty and 30-year linear power
      warranty, with 1% first-year and 0.4% annual degradation limits. No retained
      source quantifies warranty reserves, silicon and silver input costs, yield,
      utilization, freight, rebates, inventory ageing, receivables, or route-level
      gross margins. A promotional competitor article reports that JA Solar still
      recorded losses in the first quarter of 2026 despite year-on-year
      improvement after a sector downturn; this is competitor context, not an
      independent benchmark for Gokin.
    claimRefs: [CI009, CI010, CI011, CI015]
    tableRefs: [TI002, TI003]
  - id: capital-adequacy
    title: Historical funding does not establish current runway
    body: >-
      Tracxn reports that Gokin raised $624 million across two rounds, while
      Caplight's public page identifies Series A and Series B events but leaves
      amounts and valuations undisclosed. Tracxn dates the latest round to August
      1, 2022 and hides its amount on the public page. These records are useful
      chronology checks, but funding raised is not cash available in October
      2026. The retained evidence contains no current cash balance, monthly burn,
      operating cash flow, debt schedule, covenant package, guarantees, pledged
      assets, project-finance obligations, or next-round trigger. An assigned
      HKEX title-search page for public peer GCL Technology returned "No matches
      found" at access time; that access result is not evidence that filings or
      obligations do not exist. The financial verdict is therefore scale-positive
      but underwriting-negative: revenue quality, margin path, and capital
      adequacy remain unverified until management supplies audited statements and
      a current liquidity bridge.
    claimRefs: [CI012, CI013, CI014, CI016]
callouts:
  - calloutType: risk
    title: Scale evidence is not cash-flow evidence
    body: >-
      Public revenue, capacity, shipment, and funding figures do not reveal
      realized pricing, margins, cash conversion, leverage, or runway; audited
      statements and a current debt-and-liquidity bridge are gating diligence
      items.
    claimRefs: [CI002, CI004, CI006, CI012]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns:
      - Stream
      - Mechanism
      - Public unit or status
      - Revenue quality
      - Diligence ask
    rows:
      - - Monocrystalline silicon ingots and wafers
        - Manufacturing and sale of physical products
        - "Third-party profile: 100 GW rod and 80 GW wafer annual capacity; period not stated"
        - "Volume and utilization are not revenue, price, margin, or cash collection"
        - "Audited volume, realized CNY/W pricing, utilization, yield, customer concentration, and receivables"
      - - Photovoltaic modules
        - Manufacturing and sale through direct or channel relationships
        - "4 GW module capacity at end-2024; company claims cumulative shipments above 10 GW by September 2026"
        - "Shipment evidence is stronger than pricing or margin evidence; warranty tail is material"
        - "SKU-level shipments, realized ASP, rebates, channel fees, gross margin, backlog, and warranty reserve"
      - - Photovoltaic solar farms
        - "Project development, ownership, sale, or power revenue mechanism is not disclosed"
        - "Official site identifies the segment; no financial value or unit is public"
        - "Recognition, capital commitment, and recurring versus disposal revenue are unknown"
        - "Project roster, ownership share, MW status, capex, financing, contracted tariff, and cash distributions"
    notes: >-
      Sources are an official company profile and retained third-party reporting;
      capacities and shipments use their stated periods, while null economics are
      explicit public-evidence gaps rather than estimates.
    claimRefs: [CI001, CI002, CI004, CI005, CI006]
  - id: TI002
    title: Product specification versus monetization disclosure
    columns:
      - Product or application
      - Rated output
      - Disclosed technical value
      - Price or contract disclosure
      - Underwriting implication
    rows:
      - - BC residential module
        - "480 W to 500 W"
        - "23.5% to 24.5% efficiency"
        - "No list price, realized ASP, discount, or contract term in retained evidence"
        - "Cannot convert product performance into revenue or gross profit"
      - - BC commercial and industrial module
        - "650 W to 670 W"
        - "24.1% to 24.8% efficiency"
        - "No list price, realized ASP, discount, or contract term in retained evidence"
        - "Customer value proposition is visible; monetization is not"
      - - BC utility-scale module
        - "760 W to 780 W"
        - "23.7% to 24.3% efficiency"
        - "No list price, realized ASP, discount, or contract term in retained evidence"
        - "Balance-of-system claims require customer-level economic validation"
      - - TOPCon bifacial module
        - "570 W to 600 W"
        - "Up to 23.2% efficiency; 15-year product and 30-year linear power warranties"
        - "No list price, realized ASP, discount, or contract term in retained evidence"
        - "Long warranty duration should be reconciled to reserves and field-failure data"
    notes: >-
      Rated outputs and efficiencies are product specifications, not prices,
      realized revenue, market share, or independently verified lifetime yield.
    claimRefs: [CI009, CI010, CI011]
  - id: TI003
    title: Unit economics and capital-adequacy diligence matrix
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Operating revenue
        - "Company reports more than CNY20 billion for 2023"
        - Medium
        - "Establishes historical scale but not current revenue, mix, recognition, or cash conversion"
        - "Audited 2023-2025 statements and 2026 year-to-date segment bridge"
      - - Gross margin and contribution margin
        - "Unavailable in retained public evidence"
        - Low
        - "Core test of resilience to wafer and module price compression"
        - "Gross margin by wafer, TOPCon module, BC module, and solar-farm activity"
      - - Sales efficiency
        - "CAC, sales cycle, channel take rate, and payback unavailable"
        - Low
        - "Determines whether global reach produces economic customer acquisition"
        - "Pipeline conversion, sales-cycle cohorts, direct versus distributor economics, and bad-debt history"
      - - Warranty and degradation obligation
        - "15-year product warranty; 30-year linear power warranty; 1% first-year and 0.4% annual degradation limits"
        - Medium
        - "Creates a long-tail service and reserve exposure"
        - "Warranty reserve methodology, claims cohorts, field-failure rates, and insurance recoveries"
      - - External equity funding
        - "Tracxn reports $624 million across two rounds; latest public-page round dated August 1, 2022"
        - Medium
        - "Historical financing capacity does not establish current liquidity"
        - "Cap table, cash uses by round, current unrestricted cash, preferences, and dilution waterfall"
      - - Cash, burn, debt, and working capital
        - "Unavailable in retained public evidence"
        - Low
        - "Capital-intensive manufacturing can consume cash through capex, inventory, and receivables"
        - "Monthly cash bridge, debt and covenant schedule, capex commitments, inventory ageing, DSO, pledges, and guarantees"
    notes: >-
      Values preserve source currencies and dates; unavailable fields are not
      modeled, and historical funding raised is explicitly not treated as cash on
      hand or runway.
    claimRefs: [CI002, CI011, CI012, CI013, CI014, CI015, CI016]
