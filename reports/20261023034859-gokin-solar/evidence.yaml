evidenceGaps:
  - type: missing-source
    severity: material
    topic: disclosure
    missingEvidence: Audited 2024-2025 financial statements, cash-flow statements, debt schedules and covenant terms.
    whyItMatters: Reported revenue, capacity and funding do not establish profitability, liquidity or equity value.
    diligencePath: Obtain management accounts, audited statements, lender schedules and working-capital ageing under NDA.
    relatedQuestionRefs:
      - QO002
      - QO004
      - QO008
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete cap table, investor rights, board composition, related-party arrangements and listing-readiness workplan.
    whyItMatters: Headline funding and valuation can differ materially from common-equity value and control.
    diligencePath: Request the latest cap table, financing documents, board minutes, governance checklist and IPO counsel status.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO009
      - QO010
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: Leadership and founder table
    missingEvidence: Complete executive, board, independent-director and succession roster.
    whyItMatters: The public roster is partial and may understate key-person or governance concentration.
    diligencePath: Obtain the current organization chart, board register, biographies and succession coverage.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: IPO
    missingEvidence: Independent confirmation of whether the Shenzhen IPO plan has resumed, been abandoned or changed venue.
    whyItMatters: Listing timing affects liquidity, governance expectations and valuation framing.
    diligencePath: Verify status with company counsel, exchange filings and current investor communications.
    relatedQuestionRefs:
      - QO008
      - QO009
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: Audited segment revenue, utilization, realized ASP, customer concentration, and geography-level shipment data.
    whyItMatters: >-
      Without these denominators, global capacity and shipment claims cannot be translated into Gokin's SAM, SOM,
      margin, or pricing-power estimate.
    diligencePath: >-
      Request audited 2024–2026 segment financials, capacity utilization, ASP bridge, customer concentration, and
      shipment-by-region schedules.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: material
    topic: capacity
    missingEvidence: >-
      Reconciliation of the 80 GW company profile capacity, the 100 GW bankability-announcement capacity, and the 4 GW
      versus 7 GW module capacity/shipments figures.
    whyItMatters: >-
      The differing periods and metric definitions can materially change the implied market position and operating
      leverage.
    diligencePath: >-
      Obtain a dated capacity and shipment reconciliation distinguishing nameplate capacity, operating capacity, and
      shipments.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: buyer-segments
    missingEvidence: >-
      Named customer references and project-level procurement or financing evidence by residential, C&I, utility, and
      cell-manufacturer segment.
    whyItMatters: >-
      Product specifications show intended use cases but do not prove conversion, retention, or budget ownership in each
      segment.
    diligencePath: >-
      Collect customer references, tender awards, warranty claims, channel sell-through, and project-finance acceptance
      by segment.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Comparable realized ASPs, discounts, contract terms and gross margins for Gokin and its major peers.
    whyItMatters: >-
      Without realized economics, technology differentiation cannot be translated into a defensible premium, margin path
      or moat.
    diligencePath: >-
      Request route-level management accounts, customer contracts, ASP waterfalls, yield data and warranty-reserve
      schedules, then benchmark them against listed peers.
    relatedQuestionRefs:
      - QP005
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: bankability
    missingEvidence: Independent bankability score details, lender acceptance and customer retention by region.
    whyItMatters: Scale and product specifications do not establish financing acceptance or repeat purchasing.
    diligencePath: >-
      Obtain the complete PV ModuleTech assessment, lender references, project-level approvals and customer cohort or
      renewal evidence.
    relatedQuestionRefs:
      - QP006
      - QP009
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: competitors
    missingEvidence: A complete current list of regional module suppliers, internal-build options and procurement substitutes.
    whyItMatters: >-
      Assigned sources emphasize global leaders and named specialists but cannot exhaustively enumerate every regional
      competitor.
    diligencePath: >-
      Run a geography-by-geography procurement and tender review covering China, Europe, the Middle East, Latin America
      and Asia-Pacific.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: blocking
