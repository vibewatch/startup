      - [Residential generation, Select a high-output rooftop module, GK-3-54HGFb, 480-500 W and 23.5-24.5% reported efficiency, No independent energy-yield dataset]
      - [C&I rooftop generation, Fit higher-power modules to commercial roofs, GK-3-72HGF, 650-670 W and 24.1-24.8% reported efficiency, Site-specific loading and degradation remain unverified]
      - [Utility-scale generation, Reduce module and mounting count per MW, GK-4-78HGBD, Claimed BOS benefit from 760-780 W format, No project-level BOS or LCOE evidence in pool]
      - ["Global project procurement", "Qualify supplier and product risk", "Certifications, lab qualification, and distributor channels", "Supports procurement diligence", "No audited warranty-claim or delivery-performance series"]
    notes: Use-case benefits are limited to source-reported specifications and described procurement signals; no realized customer outcome is inferred.
    claimRefs: [CE002, CE003, CE004, CE014, CE015]
  - id: TE003
    title: Technology / operating architecture
    columns: [Layer / process / component, Role, Dependency, Risk]
    rows:
      - ["Silicon ingot production", "Produce monocrystalline feedstock", "Power, equipment, and upstream materials", "Capacity may not equal utilization or competitive cost"]
      - [Silicon wafer production, Supply cells and internal module operations, Ingot quality and slicing process, Yield and defect metrics are not disclosed]
      - ["BC cell and module route", "Convert wafer technology into high-efficiency modules", "Cell process, silver use, encapsulation, and equipment", "Ramp and cost claims require independent validation"]
      - [Module qualification, Test environmental and mechanical resilience, TÜV Rheinland and CPVT testing relationships, Certificates do not prove long-term field performance]
      - ["Global delivery and solutions", "Serve projects through distributors and regional channels", "Logistics, installers, and local service", "Delivery quality and warranty execution are not quantified"]
    notes: Architecture is an analytical synthesis of described business segments and reported product/testing relationships; it is not a disclosed internal system diagram.
    claimRefs: [CE006, CE009, CE014, CE015, CE016]
figures:
  - id: FE001
    title: Gokin Solar product architecture
    type: stack
    summary: Gokin's disclosed product stack runs from monocrystalline materials through BC module manufacturing to project-facing solutions.
    data:
      layers:
        - label: Upstream materials
          detail: Silicon ingot and wafer production provides the disclosed upstream foundation.
          items:
            - label: Monocrystalline silicon ingots
              detail: Reported 100 GW annual capacity in the current company profile.
            - label: Monocrystalline silicon wafers
              detail: Reported 100 GW annual capacity and more than 200 GW cumulative shipments in company-issued material.
        - label: Cell and module technology
          detail: BC cells and high-efficiency module formats form the principal downstream product route.
          items:
            - label: BC cell route
              detail: Rear-side busbar architecture is described as increasing active light-receiving area.
            - label: High-efficiency modules
              detail: Residential, C&I, and utility formats are reported across the 480-780 W range.
        - label: Qualification and delivery
          detail: Testing relationships and global channels support qualification and deployment.
          items:
            - label: Environmental testing
              detail: Reported TÜV Rheinland extended-stress and snow-load certificates.
            - label: Global channels
              detail: Company and industry sources describe multi-country delivery and distributor relationships.
        - label: Solutions
          detail: Project-facing applications extend the product surface beyond module manufacturing.
          items:
            - label: Utility-scale applications
              detail: Dual-glass BC module is positioned for large-scale projects.
            - label: Project development and investment
              detail: Listed as a business segment, but commercial scope and economics are not disclosed.
        - label: Customer enablement
          detail: Regional channels and service relationships support product adoption.
          items:
            - label: Distributor relationships
              detail: PV Tech reports a strategic partnership with Australian distributor OSW.
            - label: Localized service
              detail: Company materials describe multi-country service coverage, without service-level metrics.
        - label: Sustainability evidence
          detail: Environmental claims require documented measurement and verification.
          items:
            - label: Environmental testing
              detail: Product qualification includes stress, snow-load, and laboratory testing signals.
            - label: Carbon-neutrality methodology
              detail: ISO 14068-1 provides a general verification framework, not Gokin-specific certification.
    claimRefs: [CE001, CE006, CE009, CE014, CE016]
callouts:
  - calloutType: strength
    title: BC commercialization is a real product milestone
    body: The evidence supports mass-produced, globally delivered BC modules rather than a purely laboratory roadmap, with third-party reporting describing three product formats and a strategic BC cooperation.
    claimRefs: [CE007, CE009, CE010]
  - calloutType: risk
    title: Reliability evidence is qualification-heavy, not field-heavy
    body: Certifications and stress tests address defined conditions, but the assigned pool does not provide independent long-term yield, failure-rate, warranty-claims, or cybersecurity evidence.
    claimRefs: [CE014, CE015, CE017]
