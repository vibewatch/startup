company:
  name: Gokin Solar
chapter:
  number: 5
  title: Product & Technology
  summary: Gokin Solar has a vertically integrated PV offer spanning silicon ingots and wafers, high-efficiency modules, and project solutions. Current evidence supports meaningful BC module commercialization and manufacturing scale, but independent validation of reliability, security, and roadmap execution remains limited.
sections:
  - id: product-and-workflow
    title: Product and customer workflow
    body: >-
      Gokin's product surface is a physical PV supply chain rather than a software platform. Its public description covers monocrystalline silicon ingots and wafers, high-efficiency modules, and broader solar solutions, while an industry directory describes the chain as ingots/wafers, cells, modules, and project development and investment. That lets a customer source upstream wafer material or a finished module, but the evidence does not establish that every stage is sold as a bundled contract or that project-development services are material to revenue. The module workflow is clear at a high level: a buyer selects a module format for residential, C&I, or utility use, integrates it into a 1,500 V DC system, and relies on warranty and environmental-resilience specifications for deployment. Product-level outcomes are mostly rated specifications rather than independently measured field performance, so diligence should separate nameplate efficiency from delivered energy yield and warranty realization.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture, manufacturing, and maturity
    body: >-
      The operating architecture has three practical layers: upstream monocrystalline ingot and wafer production, module cell-interconnection and packaging, and downstream solutions or project deployment. Gokin's own current profile states 100 GW annual ingot capacity, 100 GW wafer capacity, and 16 GW module capacity across four production bases, while an independent PV publication reported 80 GW of ingot-and-wafer capacity and 4 GW of module capacity at the end of 2024. These are not directly comparable periods or definitions, but together they show a rapid expansion of module capacity from a smaller 2024 base. The strongest maturity signal is commercialization: independent reporting describes three BC products and a 2025 launch, and a partner report says Gokin had mass production and global delivery of BC modules. The partner report also says only three enterprises had GW-level stable BC mass production and commercial delivery, but that industry characterization is not a substitute for audited yield, uptime, or field data.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE011]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-controls
    title: Differentiation, controls, and diligence risk
    body: >-
      Gokin's differentiation is concentrated in manufacturing scale, wafer supply, and the BC route rather than a disclosed software or proprietary data moat. The BC design moves busbars to the rear and is described as increasing active light-receiving area by around 1.1%; the manufacturer also claims up to 30 W more output than similar-size TOPCon modules. Those are company-attributed product claims reported by PV Magazine, not independent benchmark results. A market-data profile says Gokin uses digital and smart manufacturing platforms, but it supplies no implementation detail or operating metrics. The control evidence is more concrete for physical qualification: PV Tech reports TÜV Rheinland certificates for extended stress, non-uniform snow-load testing, and laboratory qualification, plus a CPVT empirical solar-farm cooperation. Gokin's public surface also lists an energy-efficiency certification announcement and testing projects, but the assigned evidence does not establish cybersecurity controls, privacy practices, recall history, warranty-claim rates, or a dated product roadmap. Bankability inclusion is a useful external signal, yet the related company-issued report explicitly says transparency and product performance still need strengthening.
    claimRefs: [CE012, CE013, CE014, CE015, CE016, CE017]
