callouts:
  - calloutType: strength
    title: Industrial scale with a credible technology pivot
    body: "The assigned evidence supports a fast transition from large-format wafers into BC modules, with reported capacity, shipments, named partners and global reach. The scale signal is strong, although several metrics remain company- or industry-reported rather than audited."
    claimRefs: [CO002, CO003, CO005, CO014, CO015]
  - calloutType: risk
    title: Disclosure and founder-dependence risk
    body: "Current audited financials, cash flow, debt terms, full cap table, customer concentration and listing readiness remain unresolved. Public coverage also places substantial strategic weight on Xu Zhiqun, making succession and governance diligence material."
    claimRefs: [CO011, CO012, CO017, CO018]
