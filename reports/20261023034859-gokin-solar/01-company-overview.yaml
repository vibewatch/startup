company:
  name: Gokin Solar
chapter:
  number: 1
  title: Company Overview
  summary: Gokin Solar is a privately held Chinese photovoltaic manufacturer founded in 2019 that scaled rapidly from large-format silicon wafers into back-contact modules. The evidence supports substantial manufacturing scale, funding and partner traction, but audited financials, current capital structure and governance-readiness details remain insufficiently disclosed for a fully verified investment view.
sections:
  - id: identity-and-scale
    title: Identity, product scope, and operating scale
    body: "Gokin Solar was founded in 2019 and is headquartered in Zhuhai, China. Its stated business combines research and manufacturing of large-format photovoltaic silicon wafers with a newer module business, including back-contact products. The company website reports more than 6,000 employees in 2024, more than CNY20 billion of operating revenue in 2023, 504 granted patents, and more than 2,900 global partners; those figures are company-reported and the site labels the snapshot as data through the first quarter of 2025. A syndicated company release published by SolarQuarter says Gokin had 100 GW of annual wafer capacity, cumulative wafer shipments above 200 GW, and shipments to more than 30 countries and regions. These figures indicate industrial scale, but the sources do not provide audited statements, revenue recognition policy, utilization, customer concentration, or a reconciled definition of partners. The strongest current identity signal is therefore scale with material disclosure limits rather than a fully verified financial profile."
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-capital
    title: Leadership, funding, and governance signals
    body: "The evidence consistently identifies Xu Zhiqun as founder and chairman, with prior senior operating experience at JinkoSolar described by Chinese business coverage, while Tracxn identifies Allen Zihan Xu as co-founder and Xu Zhiqun as CEO. Gokin was incubated with IDG Capital and Zhuhai Huafa Group, and 2022 financing coverage describes a CNY2.5 billion, approximately USD362 million Series B led by China International Capital Corporation with several strategic and financial participants. Tracxn separately reports USD624 million across two rounds, but its displayed round fields are partially masked and should not be treated as a complete cap table or cash-available figure. The leadership evidence also points to a founder-centered operating model: Sohu describes Xu as playing a pivotal role, while the same article reports 2025 senior-management changes and says the IPO plan was stalled. This combination supports strong founder-market fit and capital access, but it leaves key-person dependence, board independence, preference rights, debt, pledges and listing readiness as open diligence items."
    claimRefs: [CO007, CO009, CO010, CO011, CO012]
    tableRefs: [TO002, TO003]
  - id: milestones-and-open-gaps
    title: Milestones, partnerships, and unresolved diligence
    body: "Gokin's trajectory shows unusually fast execution: the company moved from founding and government-supported project agreements to rapid wafer capacity build-out, later expanded into modules, and then pursued BC technology and global channels. Its 2024 AIKO agreement covers wafer, cell and module coordination, while 2025-2026 coverage describes BC module shipments, bankability-rating inclusion and discussions with CGN New Energy. These are meaningful commercial and technology signals, but many are company statements or industry reports rather than audited performance evidence. The adverse picture is not a documented failure event; it is an evidence gap. The assigned sources do not establish current audited revenue, cash flow, debt covenants, complete ownership, customer concentration, or whether the planned Shenzhen listing has resumed. Investors should therefore treat capacity, shipment, valuation and partner figures as source-specific observations with different denominators and dates, not as interchangeable proof of cash generation or equity value."
    claimRefs: [CO013, CO014, CO015, CO016, CO017, CO018]
    figureRefs: [FO001]
