  evidenceGaps:
    - type: missing-source
      severity: material
      topic: litigation
      missingEvidence: A company-specific litigation, enforcement and IP search with usable case-level results.
      whyItMatters: The accessible court portal was under maintenance and cannot establish either litigation exposure or its absence.
      diligencePath: Obtain counsel confirmation and search results from Chinese and destination-market court and regulator databases.
      relatedQuestionRefs: [QR002, QR003]
      relatedTableRefs: [TR002]
    - type: private-evidence-only
      severity: material
      topic: financial-model
      missingEvidence: Audited statements, cash-flow detail, debt, covenant, preference, pledge and guarantee schedules.
      whyItMatters: Public funding and valuation figures do not quantify liquidity, downside, dilution or common-equity value.
      diligencePath: Request audited financials, lender confirmations, cap table and financing agreements under NDA.
      relatedQuestionRefs: [QR006]
    - type: enumeration-incomplete
      severity: material
      topic: customers
      missingEvidence: Top-customer revenue, backlog, geography, receivables ageing and sell-through by account.
      whyItMatters: Named customers and country coverage do not establish concentration or durable production use.
      diligencePath: Request customer concentration schedules, contracts, backlog and independent customer references.
      relatedQuestionRefs: [QR004]
    - type: stale
      severity: material
      topic: quality
      missingEvidence: Current independent warranty, claims, defect, recall and field-performance statistics.
      whyItMatters: Product specifications and company certifications do not establish realized reliability across shipped fleets.
      diligencePath: Obtain warranty-claim cohorts, returns, failure analysis and third-party bankability or insurance records.
      relatedQuestionRefs: [QR005, QR008]
