callouts:
  - calloutType: risk
    title: Thesis-break trigger
    body: Treat the thesis as impaired if audited cash flow shows sustained negative operating cash generation alongside falling wafer or module prices, if a major destination market imposes a material trade remedy, or if independently verified quality or warranty data shows recurring failure rates above contracted thresholds.
    claimRefs: [CR001, CR005, CR009, CR012]
  - calloutType: assumption
    title: Evidence boundary
    body: Company capacity, shipment, partner and certification figures are retained as company-claimed unless an independent source supports them; no public source in this pool establishes current customer concentration, litigation clearance, audited margins or financing covenants.
    claimRefs: [CR008, CR009, CR010, CR011, CR012, CR013]
