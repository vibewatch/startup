company:
  name: Gokin Solar
chapter:
  number: 7
  title: Risks
  summary: Gokin Solar has meaningful manufacturing scale and a broadening module footprint, but its risk profile remains exposed to PV price cycles, trade-remedy regimes, execution claims that are primarily company-reported, and limited public legal and financial disclosure.
sections:
  - id: risk-priorities
    title: Ranked risk priorities
    body: Gokin Solar's principal exposure is cyclical rather than purely technological. PVTIME describes 2024 as a year of supply-demand imbalance, capacity expansion and relentless price competition across silicon, wafers, cells and modules, while its wafer account says N-type G10L wafer prices fell 49.18% to 1.04 yuan per piece by December. TrendForce's 2026-10-21 snapshot still records wafer averages of RMB 1.00 for N-type M10, RMB 1.13 for N-type G12 and RMB 1.02 for N-type 210R, so the business remains sensitive to small price changes at large volumes. Gokin's own profile reports RMB 20+ billion of 2023 operating revenue and 6,000+ employees in 2024, increasing the operating leverage of any utilization or margin shock. The near-term investment implication is to underwrite resilience and cash conversion, not capacity claims alone.
    claimRefs: [CR001, CR002, CR003, CR004, CR014]
    tableRefs: [TR001]
  - id: regulatory-trade
    title: Regulatory and legal exposure
    body: The public record supports a live trade-policy risk, but not a company-specific finding of unlawful conduct. The U.S. Customs and Border Protection trade-remedies page lists repeated 2024-2026 notices concerning China's technology-transfer, intellectual-property and innovation measures, including a notice dated 9/2/2026. The WTO portal explains that members may impose anti-dumping or countervailing measures only after an investigation and warns that its information may be incomplete when members have not supplied reports. These sources support a monitoring requirement for product classification, origin, tariffs, exclusions and customer-country remedies; they do not prove that Gokin itself is subject to a particular order. The Chinese judgments portal was accessible but displayed a maintenance notice rather than a company-specific case result, so litigation status remains an evidence gap rather than a clean bill of health.
    claimRefs: [CR005, CR006, CR007]
    tableRefs: [TR002]
  - id: operating-dependencies
    title: Operating, partner and financial-model dependencies
    body: Gokin's operating thesis depends on converting upstream wafer scale into reliable downstream shipments while navigating technology transitions and buyer scrutiny. A PV Magazine report says the company reported 80 GW of ingot and wafer capacity and 4 GW of module capacity by the end of 2024; a later company release reports more than 10 GW of cumulative module shipments and a 30-country footprint, but these are company-issued claims and are not audited shipment or customer-retention data. Dealroom identifies JinkoSolar and Shuangliang as global clients and describes a vertically integrated model, while Multiples reports a private-company valuation of $1.5 billion in April 2022; neither source establishes current customer concentration, receivables quality, covenant headroom or route-level margins. The diligence priority is therefore plant-level utilization, warranty and quality data, customer-level sell-through, and independently verified cash-flow and financing schedules.
    claimRefs: [CR008, CR009, CR010, CR011]
    tableRefs: [TR003]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: Ranked risk register
    columns: [Risk, Likelihood, Impact, Mitigation maturity, Residual exposure, Investment implication]
    rows:
      - [PV price and oversupply cycle, high, high, partial, high, Require downside cases using current wafer and module prices]
      - [Capacity and utilization mismatch, medium, high, early, high, Verify plant-level utilization and cash conversion]
      - ["Technology transition and product obsolescence", medium, high, partial, medium-high, "Test N-type and BC yield, warranty and demand evidence"]
      - ["Disclosure and financing opacity", high, high, low, high, "Require audited statements, debt schedules and cap-table terms"]
    notes: Risk rankings synthesize the cited source facts and are analytical judgments; likelihood, mitigation maturity and residual exposure require management evidence not present in the public pool.
    claimRefs: [CR001, CR002, CR003, CR004, CR010, CR011]
  - id: TR002
    title: Regulatory / legal risk register
    columns: [Rule or case, Jurisdiction, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - ["China technology-transfer and IP trade remedies", United States, "Repeated 2019-2026 notices", medium, high, "Product classification and origin controls", medium-high, "Obtain SKU-level tariff and exclusion analysis"]
      - ["Anti-dumping or countervailing investigations", "WTO members", "Investigation required before measures", medium, high, "Monitor customer-country proceedings", medium-high, "Screen all destination markets and contracts"]
      - ["Company-specific litigation", China, "Not established from accessible portal", unknown, high, "Legal-register confirmation", high, "Obtain counsel letter and court-search results"]
      - ["Product safety, certification or warranty dispute", Global, "Public product claims only", unknown, medium-high, "Independent certification and claims testing", medium, "Obtain warranty-claim and recall history"]
    notes: The WTO source states that its data may be incomplete; the court portal returned a maintenance notice. Unknown status is retained rather than treated as no incident.
    enumerationScope:
      coverage: partial
      basis: Public trade-remedy and court-portal pages available to this refresh as of 2026-10-23
    claimRefs: [CR005, CR006, CR007, CR012]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Diligence ask]
    rows:
      - ["Global customer demand", "JinkoSolar and other industrial buyers", "Order deferral or concentration shock", high, "Multi-market module and wafer portfolio", high, "Obtain top-10 customer revenue and backlog"]
      - ["Raw-material and wafer pricing", "Upstream PV chain", "Input-price reversal compresses spreads", high, "Contract and inventory controls", high, "Review purchase commitments and ageing"]
      - ["Trade and logistics access", "Customer-country customs and trade-remedy regimes", "Tariff or exclusion change blocks shipments", high, "Origin and compliance program", medium-high, "Map route-level exposure by country"]
      - ["Capital providers and private financing", "Investors and lenders", "Refinancing or covenant stress during down-cycle", high, "Financing diversification", high, "Obtain debt, pledge, guarantee and preference schedules"]
    notes: Counterparty names and financing context are sourced from public profiles; concentration, contract terms and covenant status are not disclosed in the assigned evidence.
    claimRefs: [CR008, CR010, CR011, CR013]
