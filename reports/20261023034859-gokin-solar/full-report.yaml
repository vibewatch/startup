  - id: FI001
    title: Revenue model bridge with undisclosed conversion economics
    type: flow
    summary: >-
      Public evidence traces assets and products into global distribution, but does not quantify the conversion from
      physical activity to revenue or gross profit.
    data:
      nodes:
        - id: manufacturing-capacity
          label: Manufacturing capacity
          detail: Reported rod, wafer, and module capacity; utilization is not public
        - id: wafers
          label: Ingot and wafer output
          detail: Physical products with company-claimed top-two global wafer shipment position
        - id: modules
          label: TOPCon and BC modules
          detail: Product outputs span multiple residential, C&I, and utility applications
        - id: channels
          label: Global routes to market
          detail: Company claims 2,900+ partners and coverage across 30+ countries and regions
        - id: deliveries
          label: Customer deliveries
          detail: Company claims cumulative module shipments above 10 GW
        - id: economics
          label: Revenue and gross profit
          detail: Realized price, mix, recognition, margin, and cash conversion are undisclosed
      edges:
        - from: manufacturing-capacity
          to: wafers
          label: Production
        - from: wafers
          to: modules
          label: Internal conversion or external wafer sale; mix undisclosed
        - from: modules
          to: channels
          label: Direct and channel split undisclosed
        - from: channels
          to: deliveries
          label: Contract and sell-through terms undisclosed
        - from: deliveries
          to: economics
          label: Price, revenue recognition, and margin conversion undisclosed
    approximationNotes: Conceptual commercial sequence only; no conversion rate, revenue mix, pricing, utilization, or margin is inferred.
    claimRefs:
