chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating scale
        blocks:
          - type: paragraph
            body: >-
              Gokin Solar was founded in 2019 and is headquartered in Zhuhai, China. Its stated business combines
              research and manufacturing of large-format photovoltaic silicon wafers with a newer module business,
              including back-contact products. The company website reports more than 6,000 employees in 2024, more than
              CNY20 billion of operating revenue in 2023, 504 granted patents, and more than 2,900 global partners;
              those figures are company-reported and the site labels the snapshot as data through the first quarter of
              2025. A syndicated company release published by SolarQuarter says Gokin had 100 GW of annual wafer
              capacity, cumulative wafer shipments above 200 GW, and shipments to more than 30 countries and regions.
              These figures indicate industrial scale, but the sources do not provide audited statements, revenue
              recognition policy, utilization, customer concentration, or a reconciled definition of partners. The
              strongest current identity signal is therefore scale with material disclosure limits rather than a fully
              verified financial profile.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
