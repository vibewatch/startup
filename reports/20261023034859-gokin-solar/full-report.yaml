      - number: '1.2'
        title: Leadership, funding, and governance signals
        blocks:
          - type: paragraph
            body: >-
              The evidence consistently identifies Xu Zhiqun as founder and chairman, with prior senior operating
              experience at JinkoSolar described by Chinese business coverage, while Tracxn identifies Allen Zihan Xu as
              co-founder and Xu Zhiqun as CEO. Gokin was incubated with IDG Capital and Zhuhai Huafa Group, and 2022
              financing coverage describes a CNY2.5 billion, approximately USD362 million Series B led by China
              International Capital Corporation with several strategic and financial participants. Tracxn separately
              reports USD624 million across two rounds, but its displayed round fields are partially masked and should
              not be treated as a complete cap table or cash-available figure. The leadership evidence also points to a
              founder-centered operating model: Sohu describes Xu as playing a pivotal role, while the same article
              reports 2025 senior-management changes and says the IPO plan was stalled. This combination supports strong
              founder-market fit and capital access, but it leaves key-person dependence, board independence, preference
              rights, debt, pledges and listing readiness as open diligence items.
