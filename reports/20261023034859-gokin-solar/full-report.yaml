      - number: '5.3'
        title: Differentiation, controls, and diligence risk
        blocks:
          - type: paragraph
            body: >-
              Gokin's differentiation is concentrated in manufacturing scale, wafer supply, and the BC route rather than
              a disclosed software or proprietary data moat. The BC design moves busbars to the rear and is described as
              increasing active light-receiving area by around 1.1%; the manufacturer also claims up to 30 W more output
              than similar-size TOPCon modules. Those are company-attributed product claims reported by PV Magazine, not
              independent benchmark results. A market-data profile says Gokin uses digital and smart manufacturing
              platforms, but it supplies no implementation detail or operating metrics. The control evidence is more
              concrete for physical qualification: PV Tech reports TÜV Rheinland certificates for extended stress,
              non-uniform snow-load testing, and laboratory qualification, plus a CPVT empirical solar-farm cooperation.
              Gokin's public surface also lists an energy-efficiency certification announcement and testing projects,
              but the assigned evidence does not establish cybersecurity controls, privacy practices, recall history,
              warranty-claim rates, or a dated product roadmap. Bankability inclusion is a useful external signal, yet
              the related company-issued report explicitly says transparency and product performance still need
              strengthening.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
              - CE017
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: BC commercialization is a real product milestone
            body: >-
              The evidence supports mass-produced, globally delivered BC modules rather than a purely laboratory
              roadmap, with third-party reporting describing three product formats and a strategic BC cooperation.
            calloutType: strength
            claimRefs:
              - CE007
              - CE009
              - CE010
          - type: callout
            title: Reliability evidence is qualification-heavy, not field-heavy
            body: >-
              Certifications and stress tests address defined conditions, but the assigned pool does not provide
              independent long-term yield, failure-rate, warranty-claims, or cybersecurity evidence.
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
              - CE017
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              Gokin addresses multiple buyers rather than one homogeneous customer base. Its module lineup spans
              residential, commercial and industrial, and utility-scale applications, while its established wafer
              business serves manufacturers farther upstream. Management's 2026 market framing pairs premium all-black
              back-contact modules with European residential demand and positions cost-competitive TOPCon products for
              Southeast Asia and Latin America. Local distributors, installers, EPCs, system integrators, and
              centralized utility procurers therefore sit at different points in the buying chain. This breadth creates
              several routes to market, but the assigned evidence does not disclose segment revenue, unique customer
              counts, payer mix, contract length, or gross margin by channel.
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU007
      - number: '6.2'
        title: Adoption trajectory and scale signals
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption signals are physical throughput and geographic reach, not recurring customer
              economics. In a July 2026 interview, Gokin's sales vice president said the company served customers in
              more than 40 countries and regions and had shipped over 90 GW of wafers in the prior year. An April 2026
              company update separately reported more than 7 GW of module shipments in 2025 and coverage across more
              than 30 countries and regions. Those figures indicate that the module operation has moved beyond a
              laboratory or single-market launch. They do not reveal how many active accounts generated the volume,
              whether distributors sold through inventory, or whether orders repeated.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU012
              - CU014
      - number: '6.3'
        title: Named procurement and channel proof
        blocks:
          - type: paragraph
            body: >-
              CGN New Energy is the clearest named commercial reference in the pool. SolarBytes reports that Gokin
              secured 1.2 GW in CGN's 2026 centralized module-procurement pool after an earlier 1.5 GW award in 2025. In
              Spain, Interempresas and PV Europe report a distribution partnership with Master Battery, whose nationwide
              network is intended to provide stock, technical support, and service to installers, EPCs, and system
              integrators. A Gokin-issued release syndicated by TaiyangNews also announces an OSW distribution
              partnership for Australia. These relationships validate access to consequential channels, but procurement
              qualification and partnership announcements are not evidence of completed delivery, realized revenue,
              end-customer outcomes, or renewal.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Service durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Gokin reports operating mechanisms that could support durable relationships: eight regional service
              interfaces, a measured onboarding process, and complaint handling linked to rapid response and corrective
              action. Its 2025 ESG report says first-pass onboarding success reached 100% and the complaint rate fell
              70% from 2023, while reported satisfaction was 96.8%, below 98% in 2024 but above 95% in 2023. These
              metrics are company-issued and lack definitions, sample sizes, and independent assurance specific to
              customer performance. More importantly, no public NRR, GRR, churn, renewal, top-customer share,
              receivables ageing, distributor sell-through, or account-level margin is available. Geographic breadth
              should not be treated as proof of economic diversification.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU004
              - CU007
              - CU009
              - CU010
              - CU011
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial reach extends beyond product announcements
            body: >-
              The evidence includes scaled wafer and module shipments, CGN procurement awards, and named distribution
              channels in Spain and Australia.
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU008
              - CU009
              - CU011
          - type: callout
            title: Customer durability remains unverified
            body: >-
              Public sources do not establish delivered-versus-awarded volume, repeat ordering, channel sell-through,
              account profitability, or concentration.
            calloutType: risk
            claimRefs:
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk priorities
        blocks:
          - type: paragraph
            body: >-
              Gokin Solar's principal exposure is cyclical rather than purely technological. PVTIME describes 2024 as a
              year of supply-demand imbalance, capacity expansion and relentless price competition across silicon,
              wafers, cells and modules, while its wafer account says N-type G10L wafer prices fell 49.18% to 1.04 yuan
              per piece by December. TrendForce's 2026-10-21 snapshot still records wafer averages of RMB 1.00 for
              N-type M10, RMB 1.13 for N-type G12 and RMB 1.02 for N-type 210R, so the business remains sensitive to
              small price changes at large volumes. Gokin's own profile reports RMB 20+ billion of 2023 operating
              revenue and 6,000+ employees in 2024, increasing the operating leverage of any utilization or margin
              shock. The near-term investment implication is to underwrite resilience and cash conversion, not capacity
              claims alone.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR010
              - CR011
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The public record supports a live trade-policy risk, but not a company-specific finding of unlawful
              conduct. The U.S. Customs and Border Protection trade-remedies page lists repeated 2024-2026 notices
              concerning China's technology-transfer, intellectual-property and innovation measures, including a notice
              dated 9/2/2026. The WTO portal explains that members may impose anti-dumping or countervailing measures
              only after an investigation and warns that its information may be incomplete when members have not
              supplied reports. These sources support a monitoring requirement for product classification, origin,
              tariffs, exclusions and customer-country remedies; they do not prove that Gokin itself is subject to a
              particular order. The Chinese judgments portal was accessible but displayed a maintenance notice rather
              than a company-specific case result, so litigation status remains an evidence gap rather than a clean bill
              of health.
            claimRefs:
              - CR005
              - CR006
              - CR007
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
      - number: '7.3'
        title: Operating, partner and financial-model dependencies
        blocks:
          - type: paragraph
            body: >-
              Gokin's operating thesis depends on converting upstream wafer scale into reliable downstream shipments
              while navigating technology transitions and buyer scrutiny. A PV Magazine report says the company reported
              80 GW of ingot and wafer capacity and 4 GW of module capacity by the end of 2024; a later company release
              reports more than 10 GW of cumulative module shipments and a 30-country footprint, but these are
              company-issued claims and are not audited shipment or customer-retention data. Dealroom identifies
              JinkoSolar and Shuangliang as global clients and describes a vertically integrated model, while Multiples
              reports a private-company valuation of $1.5 billion in April 2022; neither source establishes current
              customer concentration, receivables quality, covenant headroom or route-level margins. The diligence
              priority is therefore plant-level utilization, warranty and quality data, customer-level sell-through, and
              independently verified cash-flow and financing schedules.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR008
              - CR011
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat the thesis as impaired if audited cash flow shows sustained negative operating cash generation
              alongside falling wafer or module prices, if a major destination market imposes a material trade remedy,
              or if independently verified quality or warranty data shows recurring failure rates above contracted
              thresholds.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR012
          - type: callout
            title: Evidence boundary
            body: >-
              Company capacity, shipment, partner and certification figures are retained as company-claimed unless an
              independent source supports them; no public source in this pool establishes current customer
              concentration, litigation clearance, audited margins or financing covenants.
            calloutType: assumption
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and valuation evidence
        blocks:
          - type: paragraph
            body: >-
              Gokin's public evidence supports a real operating platform, not a fully underwritten equity story. The
              company describes CNY20+ billion of operating revenue in 2023 and, in an April 2026 release, 100GW of
              annual wafer capacity and more than 200GW of cumulative shipments; independent industry coverage reported
              80GW of ingot-and-wafer capacity and 4GW of module capacity by the end of 2024. Those figures are not
              directly comparable because they use different dates, business scopes, and issuers. A registry reports a
              $2.9 billion 2023 valuation, while Tracxn reports $624 million across two rounds and labels the latest
              round Series B. Neither record discloses enough current post-money, fully diluted, preference, or debt
              information to establish common-equity value. The recommendation is therefore track/research-more, with
              medium-low confidence and high risk until audited statements, cap-table terms, and cash-generation
              evidence are obtained.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is based on scale, technology transition, and route-to-market proof: Gokin reports
              large wafer capacity and shipments, says it entered the Q1 2026 PV ModuleTech Bankability Ratings, and has
              launched BC modules across residential, commercial, industrial, and utility formats; a company-issued 2025
              distribution release also identifies its first official distributor in Spain. The anti-thesis is that
              scale may not translate into attractive common-equity returns in a stressed PV cycle. Yahoo Finance shows
              JA Solar at CNY22.77 billion market capitalization and 1.12 times enterprise value to revenue, alongside
              negative trailing profit margin, declining quarterly revenue, and debt above cash; Trina Solar traded just
              above its 52-week low on the run date. These are downside and reference signals, not direct Gokin
              valuations. Entry should require a reconciled cap table, preference and pledge review, audited cash flow,
              inventory and receivables aging, and a margin bridge by wafer, module, and project businesses.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Scenarios, exit readiness, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              A numeric valuation range cannot be responsibly calculated from the assigned public evidence because the
              CNY20+ billion revenue claim is unaudited in the retained record and no current share price, fully diluted
              share count, preference stack, debt schedule, or route-level earnings is available. The scenario framework
              therefore uses qualitative probability signals and identifies the evidence that would move the call rather
              than inventing a valuation range, target return, or hold period. The bull case requires sustained shipment
              scale, bankability conversion into financed projects, and audited cash generation; the base case assumes
              Gokin remains operationally credible but valuation remains opaque; the bear case assumes PV price and
              margin pressure, capital-structure overhang, or commercialization underperformance. Exit readiness should
              be judged by current IPO-preparation evidence, governance and disclosure readiness, and a financing path
              that does not rely on the unverified 2023 registry mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.4'
        title: Thesis-break triggers and decision gates
        blocks:
          - type: paragraph
            body: >-
              The decision should move toward investable only if management supplies audited 2024-2025 financial
              statements, cash-flow detail, debt and covenant schedules, and a cap table that explains the reported
              funding and valuation records. A thesis break would be a material inability to reconcile capacity,
              shipments, and revenue; preference, pledge, guarantee, or related-party terms that materially impair
              common equity; persistent negative route-level contribution margins; or failure to convert international
              expansion and bankability progress into contracted, collectible sales. A credible exit path also requires
              current documentation for IPO preparation, governance controls, and listing milestones rather than the
              historical planning statement retained from Tracxn. Until those tests are passed, the evidence supports
              monitoring and targeted diligence rather than a price-insensitive commitment.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The mark is not yet investable
            body: >-
              Public records expose valuation and funding signals but not the reconciled terms needed to price common
              equity.
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV016
          - type: callout
            title: Peer stress is a downside signal
            body: >-
              JA Solar and Trina Solar market data are sector-risk references, not proxies for Gokin's undisclosed
              financials.
            calloutType: assumption
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
