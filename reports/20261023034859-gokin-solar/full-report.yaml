      - number: '5.2'
        title: Architecture, manufacturing, and maturity
        blocks:
          - type: paragraph
            body: >-
              The operating architecture has three practical layers: upstream monocrystalline ingot and wafer
              production, module cell-interconnection and packaging, and downstream solutions or project deployment.
              Gokin's own current profile states 100 GW annual ingot capacity, 100 GW wafer capacity, and 16 GW module
              capacity across four production bases, while an independent PV publication reported 80 GW of
              ingot-and-wafer capacity and 4 GW of module capacity at the end of 2024. These are not directly comparable
              periods or definitions, but together they show a rapid expansion of module capacity from a smaller 2024
              base. The strongest maturity signal is commercialization: independent reporting describes three BC
              products and a 2025 launch, and a partner report says Gokin had mass production and global delivery of BC
              modules. The partner report also says only three enterprises had GW-level stable BC mass production and
              commercial delivery, but that industry characterization is not a substitute for audited yield, uptime, or
              field data.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
