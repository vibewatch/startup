      - number: '1.3'
        title: Milestones, partnerships, and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              Gokin's trajectory shows unusually fast execution: the company moved from founding and
              government-supported project agreements to rapid wafer capacity build-out, later expanded into modules,
              and then pursued BC technology and global channels. Its 2024 AIKO agreement covers wafer, cell and module
              coordination, while 2025-2026 coverage describes BC module shipments, bankability-rating inclusion and
              discussions with CGN New Energy. These are meaningful commercial and technology signals, but many are
              company statements or industry reports rather than audited performance evidence. The adverse picture is
              not a documented failure event; it is an evidence gap. The assigned sources do not establish current
              audited revenue, cash flow, debt covenants, complete ownership, customer concentration, or whether the
              planned Shenzhen listing has resumed. Investors should therefore treat capacity, shipment, valuation and
              partner figures as source-specific observations with different denominators and dates, not as
