  topStrengths:
    - Reported wafer and module scale with a credible transition into back-contact products.
    - Named strategic, utility, distributor, and international channel evidence.
    - Broadening product and geographic footprint creates optionality beyond a pure commodity-wafer position.
  topRisks:
    - Audited financial statements, cash flow, debt schedules, and margin bridges remain unavailable.
    - >-
      Customer concentration, sell-through, receivables quality, and route-level economics are not independently
      verified.
    - Capital-structure, listing-readiness, governance, and founder-dependence risks remain material.
    - Solar oversupply, pricing pressure, trade policy, and utilization stress can erode returns despite capacity scale.
  unresolvedGaps:
