companyProfile:
  summary: >-
    Gokin Solar is a privately held Chinese photovoltaic manufacturer founded in 2019 and headquartered in Zhuhai. It
    has expanded from large-format silicon wafers into back-contact modules, with reported manufacturing scale, global
    shipments, strategic partners, and utility-channel evidence. The public record does not yet provide audited
    financial statements, complete capital-structure terms, customer concentration, or dependable cash-conversion
    evidence.
