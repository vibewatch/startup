company:
  name: Gokin Solar
chapter:
  number: 6
  title: Customers
  summary: Gokin shows scaled upstream adoption, a large named utility procurement relationship, and new module-distribution channels in Europe and Australia. The public record remains materially weaker on delivered-versus-awarded volume, retention, distributor sell-through, account economics, and customer concentration.
sections:
  - id: customer-segments
    title: Customer segments and buying motion
    body: >-
      Gokin addresses multiple buyers rather than one homogeneous customer base. Its module lineup spans residential, commercial and industrial, and utility-scale applications, while its established wafer business serves manufacturers farther upstream. Management's 2026 market framing pairs premium all-black back-contact modules with European residential demand and positions cost-competitive TOPCon products for Southeast Asia and Latin America. Local distributors, installers, EPCs, system integrators, and centralized utility procurers therefore sit at different points in the buying chain. This breadth creates several routes to market, but the assigned evidence does not disclose segment revenue, unique customer counts, payer mix, contract length, or gross margin by channel.
    claimRefs: [CU001, CU002, CU006, CU016]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and scale signals
    body: >-
      The strongest adoption signals are physical throughput and geographic reach, not recurring customer economics. In a July 2026 interview, Gokin's sales vice president said the company served customers in more than 40 countries and regions and had shipped over 90 GW of wafers in the prior year. An April 2026 company update separately reported more than 7 GW of module shipments in 2025 and coverage across more than 30 countries and regions. Those figures indicate that the module operation has moved beyond a laboratory or single-market launch. They do not reveal how many active accounts generated the volume, whether distributors sold through inventory, or whether orders repeated.
    claimRefs: [CU003, CU004, CU005, CU016]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named procurement and channel proof
    body: >-
      CGN New Energy is the clearest named commercial reference in the pool. SolarBytes reports that Gokin secured 1.2 GW in CGN's 2026 centralized module-procurement pool after an earlier 1.5 GW award in 2025. In Spain, Interempresas and PV Europe report a distribution partnership with Master Battery, whose nationwide network is intended to provide stock, technical support, and service to installers, EPCs, and system integrators. A Gokin-issued release syndicated by TaiyangNews also announces an OSW distribution partnership for Australia. These relationships validate access to consequential channels, but procurement qualification and partnership announcements are not evidence of completed delivery, realized revenue, end-customer outcomes, or renewal.
    claimRefs: [CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU003]
  - id: durability-and-risk
    title: Service durability, expansion, and concentration
    body: >-
      Gokin reports operating mechanisms that could support durable relationships: eight regional service interfaces, a measured onboarding process, and complaint handling linked to rapid response and corrective action. Its 2025 ESG report says first-pass onboarding success reached 100% and the complaint rate fell 70% from 2023, while reported satisfaction was 96.8%, below 98% in 2024 but above 95% in 2023. These metrics are company-issued and lack definitions, sample sizes, and independent assurance specific to customer performance. More importantly, no public NRR, GRR, churn, renewal, top-customer share, receivables ageing, distributor sell-through, or account-level margin is available. Geographic breadth should not be treated as proof of economic diversification.
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
    figureRefs: [FU001]
callouts:
  - calloutType: strength
    title: Commercial reach extends beyond product announcements
    body: The evidence includes scaled wafer and module shipments, CGN procurement awards, and named distribution channels in Spain and Australia.
    claimRefs: [CU004, CU005, CU007, CU008, CU009, CU011]
  - calloutType: risk
    title: Customer durability remains unverified
    body: Public sources do not establish delivered-versus-awarded volume, repeat ordering, channel sell-through, account profitability, or concentration.
    claimRefs: [CU016]
