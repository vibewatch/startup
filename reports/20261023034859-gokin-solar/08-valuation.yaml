company:
  name: Gokin Solar
chapter:
  number: 8
  title: Valuation
  summary: "Gokin has evidence of substantial manufacturing scale, external financing history, and expanding module distribution, but the public record does not provide an auditable current equity value, cap table, or route-level profitability. The appropriate stance is track/research-more rather than buy: valuation discipline should be anchored to audited financials, capital-structure diligence, and stressed public-peer signals."
sections:
  - id: investment-call
    title: Investment call and valuation evidence
    body: Gokin's public evidence supports a real operating platform, not a fully underwritten equity story. The company describes CNY20+ billion of operating revenue in 2023 and, in an April 2026 release, 100GW of annual wafer capacity and more than 200GW of cumulative shipments; independent industry coverage reported 80GW of ingot-and-wafer capacity and 4GW of module capacity by the end of 2024. Those figures are not directly comparable because they use different dates, business scopes, and issuers. A registry reports a $2.9 billion 2023 valuation, while Tracxn reports $624 million across two rounds and labels the latest round Series B. Neither record discloses enough current post-money, fully diluted, preference, or debt information to establish common-equity value. The recommendation is therefore track/research-more, with medium-low confidence and high risk until audited statements, cap-table terms, and cash-generation evidence are obtained.
    claimRefs: [CV001, CV002, CV003, CV005, CV006, CV007, CV016]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and entry discipline
    body: "The positive thesis is based on scale, technology transition, and route-to-market proof: Gokin reports large wafer capacity and shipments, says it entered the Q1 2026 PV ModuleTech Bankability Ratings, and has launched BC modules across residential, commercial, industrial, and utility formats; a company-issued 2025 distribution release also identifies its first official distributor in Spain. The anti-thesis is that scale may not translate into attractive common-equity returns in a stressed PV cycle. Yahoo Finance shows JA Solar at CNY22.77 billion market capitalization and 1.12 times enterprise value to revenue, alongside negative trailing profit margin, declining quarterly revenue, and debt above cash; Trina Solar traded just above its 52-week low on the run date. These are downside and reference signals, not direct Gokin valuations. Entry should require a reconciled cap table, preference and pledge review, audited cash flow, inventory and receivables aging, and a margin bridge by wafer, module, and project businesses."
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV002]
  - id: scenarios-and-diligence
    title: Scenarios, exit readiness, and diligence gates
    body: A numeric valuation range cannot be responsibly calculated from the assigned public evidence because the CNY20+ billion revenue claim is unaudited in the retained record and no current share price, fully diluted share count, preference stack, debt schedule, or route-level earnings is available. The scenario framework therefore uses qualitative probability signals and identifies the evidence that would move the call rather than inventing a valuation range, target return, or hold period. The bull case requires sustained shipment scale, bankability conversion into financed projects, and audited cash generation; the base case assumes Gokin remains operationally credible but valuation remains opaque; the bear case assumes PV price and margin pressure, capital-structure overhang, or commercialization underperformance. Exit readiness should be judged by current IPO-preparation evidence, governance and disclosure readiness, and a financing path that does not rely on the unverified 2023 registry mark.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV009, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: decision-gates
    title: Thesis-break triggers and decision gates
    body: The decision should move toward investable only if management supplies audited 2024-2025 financial statements, cash-flow detail, debt and covenant schedules, and a cap table that explains the reported funding and valuation records. A thesis break would be a material inability to reconcile capacity, shipments, and revenue; preference, pledge, guarantee, or related-party terms that materially impair common equity; persistent negative route-level contribution margins; or failure to convert international expansion and bankability progress into contracted, collectible sales. A credible exit path also requires current documentation for IPO preparation, governance controls, and listing milestones rather than the historical planning statement retained from Tracxn. Until those tests are passed, the evidence supports monitoring and targeted diligence rather than a price-insensitive commitment.
    claimRefs: [CV002, CV004, CV005, CV006, CV007, CV008, CV009, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, "Track / research-more", "Scale and market activity are documented, but current equity value is not auditable from public evidence.", "Do not issue a buy call before financial and cap-table diligence."]
      - [Confidence, "Medium-low", "Funding and valuation records are incomplete and several operating figures are company-reported.", "Require primary financial evidence before increasing conviction."]
      - [Risk rating, "High", "PV-cycle margin pressure, capital intensity, and opaque capital structure are material downside risks.", "Use staged diligence and explicit thesis-break triggers."]
      - [Valuation stance, "Unverified / price-sensitive", "A $2.9B 2023 registry mark exists, but current terms, revenue quality, and common-equity rights are undisclosed.", "Price only after reconciling valuation, dilution, preferences, and debt."]
    notes: Public sources mix company claims, database records, and market-data snapshots; no row should be read as an audited valuation conclusion.
    claimRefs: [CV001, CV002, CV003, CV005, CV012, CV013, CV014, CV015, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Current implication]
    rows:
      - ["Operating-scale thesis", "Company reports CNY20+ billion 2023 operating revenue and 100GW annual wafer capacity; industry coverage reports 80GW wafer and 4GW module capacity by end-2024.", "Audited statements reconcile revenue, capacity, utilization, and cash conversion.", "Positive operating proof, not yet proof of equity returns."]
      - ["Technology and bankability thesis", "BC modules are reported from 480W to 780W and up to 24.8% efficiency; Gokin says it entered Q1 2026 PV ModuleTech Bankability Ratings.", "Independent rating detail and financed-project adoption demonstrate durable bankability.", "Supports product relevance and potential demand."]
      - ["Valuation anti-thesis", "Registry records $2.9B valuation in 2023, while Tracxn reports $624M funding and no disclosed round terms.", "Signed financing documents and cap table reconcile the marks.", "Headline valuation is a diligence item, not a usable entry price."]
      - ["Public-peer valuation reference", "Yahoo Finance displays JA Solar at CNY22.77B market capitalization and 1.12x enterprise value to revenue.", "Gokin supplies audited, same-period revenue, debt, cash, and profitability for a like-for-like comparison.", "The peer multiple is context only; it cannot price Gokin on the current record."]
      - ["Cycle and balance-sheet anti-thesis", "JA Solar data show -37.40% quarterly revenue growth, -10.98% trailing profit margin, CNY24.96B cash, and CNY49.53B debt; Trina Solar closed just above its 52-week low.", "Gokin demonstrates resilient margins, working-capital control, and manageable leverage through the cycle.", "Public-peer stress argues for conservative multiples and downside tests."]
    notes: Public-peer rows preserve the providers' displayed periods and currencies; they are sector downside signals, not claims about Gokin's own financial statements.
    claimRefs: [CV001, CV002, CV003, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Thesis-break or diligence trigger]
    rows:
      - [Bull, "Audited revenue and cash flow validate scale; BC shipments and international distribution convert into durable, collectible demand; capital structure is clean.", "A numeric range is not supportable yet; re-underwrite on audited earnings and an appropriate PV-cycle multiple.", "Low-to-moderate until primary evidence is supplied.", "No reconciliation of capacity, shipments, revenue, or common-equity rights."]
      - [Base, "Gokin remains a scaled private PV manufacturer with mixed wafer, module, and project exposure; disclosure remains incomplete.", "Track without assigning a precise mark; preserve entry discipline and seek downside protection.", "Most supportable from current evidence.", "Continued absence of audited statements, cap table, and route-level margins."]
      - [Bear, "PV pricing and margins compress; working capital or leverage rises; stated bankability and expansion do not produce profitable sell-through.", "Avoid commitment or require a materially lower, structured entry with preference and downside protections.", "Material risk signal, supported by stressed public-peer data but not quantified for Gokin.", "Negative cash conversion, adverse preference terms, or commercialization failure."]
      - [Research-more, "Management provides financing documents, audited accounts, customer concentration, inventory aging, and IPO-readiness evidence.", "Recalculate enterprise-to-revenue or earnings-based valuation only after metric definitions and periods are reconciled.", "Immediate next step.", "Evidence package remains private-only or internally inconsistent."]
    notes: Scenario values are intentionally qualitative because public evidence does not support a defensible current valuation range, probability percentage, or target return.
    claimRefs: [CV005, CV006, CV008, CV009, CV012, CV013, CV014, CV015, CV016]
