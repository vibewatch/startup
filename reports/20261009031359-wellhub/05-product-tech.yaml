  title: "Product & Technology"
  summary: "Wellhub delivers a dual-sided enterprise wellness marketplace connecting corporate employers to physical and digital wellbeing providers through a unified multi-tier subscription. The platform combines self-service partner acquisition, multi-tenant B2B benefits administration, and conversational AI recommendation infrastructure, while facing integration complexity across legacy and acquired systems."
sections:
  - id: "product-definition-and-modular-footprint"
    title: "Product Architecture & Modular Subscription Architecture"
    body: "Wellhub operates a two-sided enterprise wellbeing platform that transforms fragmented fitness, therapy, mindfulness, nutrition, and sleep services into a unified employee benefit. For corporate clients, Wellhub provides an employer management portal allowing HR organizations to deploy wellness benefits in under 30 days, automate eligibility verification, and manage annual corporate subsidies calibrated to workforce headcount. Employees receive an authenticated mobile application that unlocks tiered subscriptions spanning onsite fitness centers, boutique studios, and digital wellness applications across 18 countries with cross-border international access. The platform's modular structure standardizes partner access across Starter+, Silver, Gold, and premium tiers, replacing disparate wellness reimbursements with a centralized digital wallet and check-in mechanism. However, significant architectural variation exists across regional operating hubs, where legacy Gympass integrations coexist with recently acquired European networks such as Fitprime and Urban Sports Club."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "technical-operating-model-and-infrastructure"
    title: "Technical Architecture, Integration Pipeline & Engineering Model"
    body: "The core technology stack of Wellhub combines modern distributed microservices and micro-frontend architectures with legacy backend services and third-party SaaS systems. The supplier-facing ecosystem utilizes a modular frontend built on React, TanStack, and TypeScript, backed by Kotlin and Java microservices deployed on Amazon Web Services (AWS) infrastructure. Partner acquisition and onboarding rely on GrowthBook for telemetry, feature-flagging, and parallel conversion A/B testing, integrated into core commercial workflows managed in Salesforce. On the corporate integrations and professional services side, Wellhub engineering maintains an extensive pipeline of client-specific connectors executing thousands of requests per second. The backend relies on Node.js, TypeScript, and AWS serverless Lambda functions paired with relational PostgreSQL and MySQL databases, alongside NoSQL data stores including DynamoDB and MongoDB. An active technical migration is currently consolidating over 50 disparate connector pipelines into a modern, standardized runtime environment, exposing integration risks during client data transformations."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE002"
  - id: "operational-workflows-and-use-cases"
    title: "Operational Workflows, Internationalization & AI Innovation"
    body: "Wellhub's operational engine manages the full lifecycle of enterprise benefits delivery, partner check-ins, and multi-region content localization. In January 2026, the company launched Wellhub AI in beta, a conversational digital coach providing personalized workout routines, studio recommendations, and schedule coordination across partner verticals. This intelligence layer complements international check-in capabilities that enable cross-border facility booking across a partner network spanning nearly 100,000 locations globally. To sustain rapid international expansion across Latin America, North America, and Europe, Wellhub deployed the Phrase localization platform, training custom language models on corporate translation memories. This automated content pipeline increased multilingual marketing and product throughput by 77% year-over-year to over 5.2 million words while cutting localization costs by 70% and removing coordination bottlenecks. Despite these technological advances, partner churn, pricing friction, and network variability across independent gym operators remain key operational vulnerabilities."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
      - "CE016"
    tableRefs:
      - "TE003"
