chapter:
  number: 7
  title: "Risks"
  summary: "Wellhub's principal evidenced exposures arise from dependence on third-party providers, contractual discretion over service availability, a beta AI expansion, and outcome claims whose disclosed support is largely internal. Public evidence does not establish incident frequency, regulatory history, partner retention, or unit economics, so those items remain diligence gates rather than quantified conclusions."
sections:
  - id: "risk-ranking-and-evidence-boundary"
    title: "Risk Ranking and Evidence Boundary"
    body: "The highest residual risks are provider-network continuity, operating-model opacity, and product-governance execution. Wellhub reports a platform spanning more than 5 million subscribers, nearly 40,000 corporate clients, almost 100,000 partners, and 18 countries, while its current homepage describes an even broader network of 110,000-plus gyms and studios, 3,800 virtual trainers, and more than 90 apps [CR007, CR009]. That scale raises the consequence of provider removals, booking disruption, or inconsistent local coverage, but the assigned evidence does not disclose actual outage frequency or partner concentration. Legal and regulatory severity is therefore ranked from the operative terms and disclosed product scope, not from an assumed incident record. The heatmap separates evidenced exposure from unverified frequency, and the legal register is explicitly partial because no regulator, court, certification, or enforcement inventory was available in the assigned pool [CR001, CR002, CR003, CR004, CR005, CR015]."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR007"
      - "CR009"
      - "CR015"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "legal-operational-and-product-governance"
    title: "Legal, Operational, and Product-Governance Exposure"
    body: "Wellhub's terms place delivery, quality, integrity, and regulatory compliance of provider services on each third-party provider and allow provider offerings to change, while Wellhub reserves broad rights to modify or discontinue platform features [CR002, CR003]. Those provisions reduce contractual commitments but do not remove reputational or enterprise-renewal exposure when a member cannot access a facility or digital service. The same terms use arbitration and class-action waivers where permitted, warn that wellness information is not medical advice, and acknowledge inherent physical risks [CR004, CR005]. Product risk expands with Wellhub AI: the company describes a beta conversational coach that recommends routines and guidance across fitness, mindfulness, therapy, nutrition, and sleep, yet the assigned evidence supplies no model-governance, privacy-impact, clinical-safety, or incident documentation [CR006]. A Brazil-based platform-team job repost and Wellhub's flexible-work description indicate distributed delivery, but neither source proves elevated attrition or reliability problems; those remain monitoring questions rather than findings [CR014]."
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR014"
    tableRefs:
      - "TR002"
  - id: "partner-economics-model-risk-and-kill-criteria"
    title: "Partner Economics, Model Risk, and Kill Criteria"
    body: "The model depends on both employer sponsorship and employee subscriptions: Wellhub says companies pay annual fees based on team size while employees select monthly plans [CR008]. Company-issued UK advertorial evidence reports that every surveyed operator saw stronger local competition, 82% faced rising acquisition costs, 74% said corporate wellness platforms reached otherwise inaccessible demographics, and more than 93% of member visits were incremental [CR011, CR012]. These figures suggest both value and bargaining tension, but they do not disclose sample size, payout terms, partner churn, or Wellhub gross margin. Built In's unreviewed AI-generated page flags partner churn, pricing sensitivity, and reliance on company-reported metrics, but its own disclaimer prevents treating those themes as verified events [CR013]. Outcome evidence also needs caution: Wellhub attributes healthcare-cost and turnover claims to internal studies, including one Brazilian client and a three-client retention study [CR010]. Investment kill criteria should therefore be tied to verified deterioration in partner retention, service levels, AI governance, or independently reconciled economics—not to unsupported precision [CR016]."
    claimRefs:
      - "CR008"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR016"
    tableRefs:
      - "TR003"
