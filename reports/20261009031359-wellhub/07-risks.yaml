callouts:
  - calloutType: "risk"
    title: "Do not infer safety from public silence"
    body: "The assigned evidence contains terms, promotional pages, a supplier advertorial, an AI-generated third-party summary, and job materials—not a complete incident, litigation, enforcement, security, or partner-retention record. Absence of such records in this pool is an evidence gap and cannot support a no-incident conclusion [CR013, CR015]."
    claimRefs:
      - "CR013"
      - "CR015"
  - calloutType: "recommendation"
    title: "Thesis-break monitoring"
    body: "Escalate or break the thesis if diligence identifies sustained provider churn in priority markets, repeated material service failures, unsafe or non-compliant AI behavior, or economics that cannot reconcile employer and employee receipts with provider payouts and support costs [CR016]."
    claimRefs:
      - "CR016"
