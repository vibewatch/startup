  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层、ICP 定义与双利益相关方购买动态
        blocks:
          - type: paragraph
            body: >-
              Wellhub 采用双利益相关方 B2B2C 市场进入结构，把经济上的企业买方与日常消费者订阅者分开。组织层面的理想客户画像（ICP）聚焦跨国企业、分布式大型雇主，以及拥有 1,000 至超过 100,000
              名员工、希望在不同办公和一线地点统一管理员工健康福利的中型市场组织。企业买方主要是首席人力资源官、福利副总裁和全面薪酬高管；他们按符合条件的员工人数签订年度合同，用统一网络替代单点健康方案的行政负担。在这一企业安排下，客户补贴平台使用权并可在不到
              30 天内上线项目；员工则选择并自行支付月度套餐，在 18 个运营国家使用涵盖健身、正念、疗愈、营养和睡眠的实体健身房、精品工作室及数字健康应用。


              在供给和网络侧，客户采用由健身及健康运营商的商业伙伴关系强化。Wellhub 建立标准化的 0-to-1 市场进入手册，利用 AI 提示词工程和 Salesforce
              工作流谈判商业条款、扩大北美和拉美供给版图并获取净节省。商业客户团队建模伙伴收益，跟踪流量、转化和每伙伴收入以维持网络覆盖。但双利益相关方架构天然带来定价矛盾：企业买方要求可量化的医疗成本下降和离职率降低，终端员工则衡量个人订阅是否负担得起；平台调价遇到订阅者抵触或本地设施覆盖缺口时，风险随之上升。
            claimRefs:
