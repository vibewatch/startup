      - number: '7.4'
        title: 展示
        blocks:
          - type: callout
            title: 不要从公开沉默推断安全
            body: >-
              指定证据包括条款、推广页面、供应商广告式文章、AI 生成的第三方摘要和招聘材料，但不是完整的事故、诉讼、执法、安全或伙伴留存记录。证据池中没有这些记录只是证据缺口，不能支持“没有事故”的结论 [CR013,
              CR015]。
            calloutType: risk
            claimRefs:
              - CR013
              - CR015
          - type: callout
            title: 投资论点破裂监测
            body: 若尽调发现重点市场供应商持续流失、重大服务故障反复发生、不安全或不合规的 AI 行为，或经济性无法把雇主及员工收入与供应商结算和支持成本核对一致，应升级风险或打破投资论点 [CR016]。
            calloutType: recommendation
            claimRefs:
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Wellhub 的投资论点建立在其占主导地位的多边企业健康福利护城河上。平台拥有近 40,000 家企业客户、超过 5 million 名员工订阅用户，可在 18 个国家接入 100,000
              个健身、正念、疗愈、营养和睡眠伙伴，累计签到已超过 10 亿次 [CV001, CV002, CV003]。雇主支付年度企业使用费，员工购买分层月度订阅；相比传统企业健康项目，员工注册量高出 3x 至
              5x，从而支撑经常性收入 [CV003, CV004]。网络规模会自我强化：伙伴结算额 2025 年同比增长 107%，巩固了 Anytime Fitness 等大型健身连锁及 Urban Sports Club
              等欧洲聚合商的留存 [CV002, CV005, CV006]。反论点则强调结构性利润率不清晰和倍数风险。Wellhub 的 SaaS
              加福利市场双重模式需要向实体健身房运营商支付大额结算，毛利率因此远低于纯软件基准 [CV005, CV006]。行业观察警告伙伴流失、运营商利润摩擦和会员套餐敏感性；关键运营指标仍是公司自报、未经独立审计
              [CV007, CV008]。按高于 10x ARR 的隐含二级倍数计价时，任何并购后整合摩擦或企业续约放缓，都可能让投资者面临大幅下轮融资或倍数压缩风险 [CV008, CV009]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: 建议、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              我们给予 Wellhub “Track”建议、偏高的估值立场和高风险评级 [CV010]。在后期私募市场，Wellhub 股权通过 UpMarket、Forge Global 等二级平台交易，合格投资者可接触
              IPO 前股份，但受优先购买权、流动性折价和严格转让限制约束 [CV011, CV012]。最近一轮经验证的机构定价融资是 2023 年 8 月的 Series F，融资 $85M、投后估值 $2.4B（每股
              $33.81）；随后 Forge Global 记录了 2024 年 12 月的 $150M Series F-1，每股 $39.00，投后估值 $3.29B [CV005,
              CV013]。二级市场评论曾将私募估值推高至 $4.2B，但独立经纪商明确确认，这类高估值没有得到两家独立且信誉良好的来源验证 [CV012]。在缺少经验证审计毛利率、NRR 披露，或能区分 SaaS
              平台费与代收代付伙伴结算的单位经济数据时，以两位数倍数购买二级股份，安全边际不足 [CV008, CV012, CV013]。
            claimRefs:
              - CV005
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
