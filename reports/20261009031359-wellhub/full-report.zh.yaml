        title: 能力、分发与战略方向
        blocks:
          - type: paragraph
            body: >-
              Wellhub 当前官方页面描述其拥有 110,000+ 家健身房和工作室、3,800 名虚拟教练及 90+ 个健康应用。2026 年 1 月的发布加入了测试版 AI
              教练和跨境签到；公司招聘信息则显示，它正在法国和比荷卢投入伙伴营销、网络增长及伙伴满意度。这些信号说明，供给密度和企业分发比功能对等更重要。ClassPass 提供另一种实体使用权模式；Vantage Fit
              强调原生应用互动、透明定价和奖励。信任比较仍不完整：Vantage Fit 自称符合 HIPAA 和 SOC 2，但指定证据池既没有底层审计文件，也没有可比的 Wellhub 认证证据。
