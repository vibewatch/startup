      - number: '1.3'
        title: 资本化历程、企业牵引力与运营摩擦
        blocks:
          - type: paragraph
            body: >-
              Wellhub 的资产负债表和资本化轨迹，显示机构资本在多个市场周期中持续提供审慎支持。公司在已披露轮次中累计获得 $605 million 机构级首轮资本，最终于 2023 年 8 月由 EQT Growth
              领投、Neuberger Berman 参与完成 $85 million Series F；General Atlantic 和 Moore Strategic Ventures 同期购买二级股份，形成 $2.4
              billion 的投后估值基准。PM Insights 等独立私募二级市场情报平台及二级交易记录显示，私下交易持续进行，二级估值最高升至 $4.2
              billion；但二级估值反映的是流动性有限的私募成交价，并非经审计的股权融资轮次或新增首轮现金。商业牵引方面，SaaS 市场情报报告显示，截至 2025 年 9 月 ARR 达到 $319
              million，背后是近 40,000 家企业雇主客户和超过 5 million 名员工订阅用户。2025 年，参与合作的健身房和工作室运营商获得的网络结算额全球增长
              107%，美国翻倍，受企业客户扩张和企业健康福利投入推动。但激进扩张也暴露出运营逆风：独立雇主洞察和伙伴评论指出，伙伴收入分成持续引发摩擦；精品运营商反对聚合商经济模式，导致区域伙伴流失；套餐涨价引起会员抵触；同时，公司还必须持续整合
              Fitprime、Urban Sports Club 等区域收购标的。
