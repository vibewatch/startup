            body: >-
              Wellhub 核心技术栈把现代分布式微服务和微前端架构，与旧后端服务及第三方 SaaS 系统结合。面向供应商的生态采用 React、TanStack 和 TypeScript 构建模块化前端，后端是部署在
              Amazon Web Services（AWS）上的 Kotlin 和 Java 微服务。伙伴获取和接入依靠 GrowthBook 做遥测、功能开关及并行转化 A/B 测试，并接入 Salesforce
              管理的商业工作流。在企业集成和专业服务侧，Wellhub 工程团队维护大量客户专用连接器，每秒处理数千次请求。后端使用 Node.js、TypeScript 和 AWS 无服务器 Lambda 函数，配合
              PostgreSQL、MySQL 关系数据库以及 DynamoDB、MongoDB 等 NoSQL 存储。目前正在进行的技术迁移把 50
              多条分散连接器管线合并到现代标准化运行环境，客户数据转换期间因此暴露出集成风险。
