        - 40,000 家企业客户和 5M+ 员工订阅用户形成较高转换壁垒
        - 预算收紧、可选健康福利受影响时，企业续约会变脆弱
        - 核实多年企业留存率和超过 110% 的净收入留存率
      - - 合作伙伴生态
        - 覆盖 18 个国家的 100,000+ 家合作伙伴；2025 年全球合作伙伴分成增长 107%
        - 聚合平台摩擦：健身房和精品工作室运营方承受利润率压缩并出现流失
