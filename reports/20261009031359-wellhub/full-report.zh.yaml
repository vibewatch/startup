      - number: '1.4'
        title: 展示
        blocks:
          - type: callout
            title: 2024 年更名与服务模态扩展的战略影响
            body: >-
              2024 年 5 月从 Gympass 更名为 Wellhub，标志着公司从纯健身房使用权聚合商转向一体化企业福利平台。Wellhub
              将正念（Headspace）、数字营养、睡眠疗愈和实体健身房使用权打包进一项雇主赞助的套餐，扩大了企业 HR 部门可支配的采购预算；与单一模态健康项目相比，员工注册量提高了 3-5x。
            calloutType: insight
            claimRefs:
              - CO002
              - CO005
              - CO006
          - type: callout
            title: 伙伴经济性与二级估值脆弱性
            body: >-
              Wellhub 报告称 2025 年运营商结算额翻倍，但独立职场和健身运营商评论显示，伙伴利润率和定价透明度持续存在矛盾。此外，二级市场将公司估值推至 $4.2B
              的信号尚未得到经审计的首轮融资验证；若核心大都市市场增长放缓或伙伴流失加剧，估值可能承压。
            calloutType: risk
            claimRefs:
