      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              最明显的护城河是实体供给、雇主分发和广泛健康福利组合的结合。纯软件挑战者更容易复制挑战或教练功能，却难以复制密集的本地健身房使用权；反过来，数字功能和不透明的企业定价保护较弱。伙伴营销岗位也说明，网络质量需要持续的本地投入，不能只当作被动数据资产。反向证据方向上重要但力度有限：CheckThat.ai
              报告反复出现的客服和计费问题，并给出 G2 客服 6.4/10 的评分，但抓取文本没有底层评论集。现有 Reddit
              页面只是社区介绍，不能作为可用的情绪证据。因此，伙伴流失、排他性、结算经济性和多归属仍是重要尽调缺口。
            claimRefs:
              - CP011
              - CP014
              - CP016
