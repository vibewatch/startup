      - number: '8.3'
        title: 情景建模、可比公司与尽调要求
        blocks:
          - type: paragraph
            body: >-
              对 Wellhub 评估三种多年退出情景，可以看清在二级市场高点入场的下行风险并不对称 [CV014]。在乐观情景下，Wellhub 依靠国际扩张、企业 AI 教练变现和稳定的合作伙伴分成，将企业 ARR 做到
              $500M 以上；这支持 8.0x 至 10.0x 的公开市场 IPO 倍数，带来超过 $4.5B 的可观回报 [CV002, CV003, CV014]。基准情景下，ARR 温和增长至
              $400M-$450M，但 HR 福利和平台技术领域的公开市场可比公司（如 HealthEquity、Gym Group 或消费聚合平台） 把退出倍数压到 ARR 的 6.0x-7.5x，股权价值落在 $2.7B
              至 $3.3B，回报相对近期二级交易大致持平 [CV005, CV013, CV014]。悲观情景下，合作伙伴利润率争议、企业员工流失，以及整合 Fitprime 和 Urban Sports Club
              带来的执行拖累会压缩毛利率、放缓增长，估值可能下修至 $1.8B-$2.2B（ARR 的 4.5x-5.0x） [CV006, CV007, CV008,
              CV014]。在投入资金前，应优先核实经审计的合并毛利率、企业 NRR 队列，以及二级 股份类别的清算优先权顺位 [CV008, CV013, CV015]。
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
          - type: table
