              Starter+、Silver、Gold 及高级套餐的伙伴使用权，用集中式数字钱包和签到机制取代分散的健康报销。不过，各区域运营中心仍有明显架构差异：旧 Gympass 集成与 Fitprime、Urban
              Sports Club 等近期收购的欧洲网络并存。
