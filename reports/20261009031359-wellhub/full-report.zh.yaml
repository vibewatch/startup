              2026 年运营商调查还发现，已有企业健康平台合作关系的受访者中，76% 将渠道收入描述为新增，而非从现有会员转移；方法说明明确指出，伙伴比较只是描述性结果，并非受控试验。同一调查也显示成本压力：11 个国家
