      - number: '3.3'
        title: 定价与套餐
        blocks:
          - type: paragraph
            body: >-
              Wellhub 采用双付费结构：公司按团队规模和投入水平支付年度企业费用，员工选择并支付月度套餐。公开员工菜单有 11 档，从免费 Digital 套餐到 $344.99 的 Diamond
              套餐，但指定证据未披露雇主价格。Wellhub 自己的对比将 ClassPass 定义为可变积分产品，将 Wellhub 定义为全包式每日使用订阅。Vantage Fit 对比页称其收费为每用户每月固定
              $1、无最低人数，同时称 Wellhub 的雇主价格需协商且未公开。由于两份比较均由供应商撰写，它们能说明套餐设计，却不能独立证明实际合同成本或更高价值。
