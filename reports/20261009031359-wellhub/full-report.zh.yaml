              当前官方页面称 Wellhub 提供 11 种员工套餐，从零美元 Digital 套餐到每月 $344.99 的 Diamond 套餐；还称员工套餐最高可比直营会员便宜
              50%，且无注册或取消费用。这些是标价和套餐宣传，不是实际收入数据。雇主价格仍按报价确定，公开机制只有一项与团队规模挂钩的年度费用。近 40,000 家企业客户和超过 5 million
