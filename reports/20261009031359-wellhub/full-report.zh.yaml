      - number: '2.3'
        title: 买方分层、预算归属与采用机制
        blocks:
          - type: paragraph
            body: >-
              Wellhub 的双付费模式需要穿过两阶段采购和采用漏斗。经济买方通常是首席人力资源官、全面薪酬副总裁或福利总监；61%
              的组织从医疗福利预算为健康项目提供资金，财务部门因此拥有重要监督权。企业采购主要由人才留存诉求和医疗支出上升触发：85% 的 HR 负责人认为健康项目对留住顶尖人才至关重要。雇主接入平均不到 30
              天后，员工成为第二层订阅者，可在 11 个价位中选择，从免费数字访问到每月 $344.99 的豪华俱乐部使用权。一个关键采用动力是非会员转化：61% 至 65% 的新 Wellhub
              订阅用户在注册前没有商业健身俱乐部会员，说明平台创造了真实需求，而不只是承接折扣。
            claimRefs:
              - CM006
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM006
              - CM010
              - CM012
              - CM013
      - number: '2.4'
        title: 增长催化剂、结构性约束与尽调风险
        blocks:
          - type: paragraph
            body: >-
              市场扩张有三项主要顺风：企业福利整合、用对话式 AI 教练在 100,000 个伙伴地点个性化引导会员，以及服务混合办公人群的跨国签到。但长期市场韧性仍受采用约束和结构性风险支配。供应商调查显示，30% 的 HR
              组织将实施成本高列为主要障碍，30% 认为员工参与度低，另有 26%
              难以衡量效果。聚合商经济性还需要精细平衡：独立行业报告持续提示伙伴流失、运营商利润率压缩和定价摩擦风险；若健身房认为结算率侵蚀收入，或核心雇主参与指标主要依赖未经审计的公司披露，风险会进一步放大。
            claimRefs:
              - CM003
              - CM007
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 双付费模式把市场容量扩展到直接健身房补贴之外
            body: Wellhub 将企业使用费与员工自愿共付结合，双付费结构从根本上扩大了市场覆盖。平台吸引了此前没有活跃健身房会员的 61% 至 65% 订阅用户，为健身房运营商带来新增客户，同时不蚕食其标准直营零售价。
            calloutType: insight
            claimRefs:
              - CM006
              - CM011
              - CM013
          - type: callout
            title: 聚合商利润挤压与供给侧伙伴敏感性
            body: 雇主需求强劲，但市场聚合商天然面临企业折扣预期与健身伙伴留存之间的矛盾。行业信号显示，若健身房结算经济性恶化，运营商流失、价格调整和局部网络缺口仍会持续威胁订阅用户留存。
            calloutType: risk
            claimRefs:
              - CM012
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与解决任务的方式
        blocks:
          - type: paragraph
            body: >-
              Wellhub 跨多个品类竞争。指定证据中最接近其使用权模式的是 ClassPass，后者按积分使用，而 Wellhub 按日签到订阅。Vantage Fit
              是软件优先的互动替代方案，提供挑战和奖励，声称覆盖更多国家，但不补贴实体健身房使用。单品类健康应用、直营健身房会员、雇主津贴和内部项目即使无法提供完整组合，仍然是替代品。因此，竞争版图应按买方目标组织，而不是罗列单一同业。指定证据池缺少大多数替代方案的融资和可靠规模披露，故标记为未知，而非估算值。
            claimRefs:
              - CP002
