        title: 企业采用轨迹、已验证客户案例与行业广度
        blocks:
          - type: paragraph
            body: >-
              Wellhub 已具备企业商业规模：企业客户从早期增长阶段的 10,000 家，增至 2024 年末的 22,000 家，并在 2026 年达到近 40,000 家，同时拥有超过 5 million
              名付费员工订阅者。公开披露和技术画像情报数据库确认，其客户覆盖 21 个行业，主要集中在零售、银行与金融服务、医疗保健和专业服务，分布于所追踪的 195
              个国家。已记录的企业案例显示关系持久且能国际化部署：Banco Santander 于 2018 年达成全球协议，将 Wellhub 作为 BeHealthy HR
              健康项目的一部分部署到国际市场，把会员使用权纳入全球供应商治理。2023 年，Amazon 与 Wellhub 签约，为其巴西圣保罗的员工及家属实施健康会员服务，把健身和心理健康纳入企业福利目录。


              2025 和 2026 年主要雇主群体的客户势头仍在延续。Activision Blizzard 于 2025 年部署 Wellhub，将其作为企业会员管理平台交付 HR 管理的员工健康福利；区域医疗系统 Lee
              Health 于 2026 年 7 月接入 Wellhub，覆盖 18,000 名医疗员工。主动买方意向跟踪还发现，大型机构雇主正在评估 Wellhub，包括代表 53,000 名医护人员的 Sutter
              Health。为加速企业采用并缓解健康福利高峰期的企业预算摩擦，Wellhub 为新雇主推出免费起步的商业接入模式，并提供覆盖近 100,000
              个伙伴节点的国际签到。尽管拥有这些知名企业客户，公开客户名单明显由供应商筛选，续约率和账户级合同价值仍未披露。
