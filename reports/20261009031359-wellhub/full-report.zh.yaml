chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营版图与战略演进
        blocks:
          - type: paragraph
            body: >-
              Cesar Carvalho 与联合创始人于 2012 年在巴西圣保罗创立 Gympass。公司最初面向消费者销售健身房通行证，随后彻底转向企业 B2B
              健康福利订阅模式。总部位于纽约，同时在巴西、欧洲和拉美保留主要工程与运营中心；2024 年 5 月，公司从 Gympass 更名为
              Wellhub，标志着业务从实体健身房聚合扩展为覆盖健身、正念、疗愈、营养和睡眠的综合多模态健康平台。Wellhub 在 18
              个国家运营，为企业客户提供一项补贴式员工福利订阅，让员工分层使用商业健身设施、精品工作室、虚拟私人教练和数字健康应用。其模式依靠为健身运营商和数字健康伙伴带来增量客流；公司披露，超过 90% 到访合作设施的
              Wellhub 用户都是首次到访，从而缓解运营商对蚕食直营会员的担忧。网络签到量从 2022 年的 1 亿次增长十倍，到 2026 年初累计超过 10 亿次；50+
              个与设施管理及预约系统（CMS）的直接集成降低了使用摩擦并提升利用率。
