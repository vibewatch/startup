        title: 收入架构与确认边界
        blocks:
          - type: paragraph
            body: >-
              Wellhub 公开披露两层变现：雇主按团队规模支付年度企业费用，符合条件的员工选择月度订阅。由此形成经常性合同和订阅机制，但已审阅来源未披露实际收入组合、雇主平均合同价值、订阅用户
              ARPU、折扣、退款，或报告收入是按伙伴结算前还是结算后列示。成本端与活动挂钩：Wellhub 称伙伴收入直接取决于会员签到；其在 2026 年联合发布的公告称，2025 年美国总结算额接近翻倍，全球增长
              107%。因此，该架构可以带来有吸引力的经常性需求，却未必有软件式利润率；利用率上升既增加互动证据，也增加结算支出。只有取得经审计的收入确认政策和结算安排，才能判断收入质量或毛利转化。
