      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 建议依据：私募市场脱节下维持观望
            body: >-
              Wellhub 是定义品类的企业健康福利聚合平台，已展现全球规模，但当前 $3.29B 至 $4.2B 的二级市场价格没有给投资者留下安全边际。除非公司发布经审计的财务报表，确认毛利率高于
              50%、净收入留存率高于 105%，否则投资者应继续场外观望（观望）。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV008
              - CV010
              - CV012
              - CV013
          - type: callout
            title: 二级市场流动性与估值验证风险
            body: >-
              UpMarket、Forge 等平台提供的 IPO
              前股份流动性极差；公司优先购买权条款也限制转让，且缺少两家独立、信誉良好的来源对估值进行共识验证。如果公开市场退出倍数重新锚定传统福利管理可比公司，投资者可能面临下轮融资式的价格重估。
            calloutType: risk
            claimRefs:
              - CV008
              - CV011
              - CV012
              - CV013
