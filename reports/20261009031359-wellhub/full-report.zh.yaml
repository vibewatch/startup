      - number: '1.2'
        title: 高管团队、治理结构与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Wellhub 的管理层以联合创始人兼 CEO Cesar Carvalho 为核心。自 2012 年创立以来，他一直负责公司战略、美洲及 EMEA
              地区扩张和多次商业模式转型，在组织内拥有显著的战略决策权与文化影响力，构成创始人主导型后期风险投资企业常见的关键人物依赖。不过，日常运营和区域扩张已分散给资深职能副总裁及区域总经理。公司的治理和资本配置深受机构成长型股权投资者影响；这些投资者持有董事会席位和重要少数股权，主导者是
              2023 年 8 月领投 Series F 的 EQT Growth，另有长期支持者 General Atlantic 和 Moore Strategic Ventures。2024 年 5 月，Wellhub
              与 AVADO 建立结构化人才和 HR 发展合作，以提升商业及运营团队的高管能力和职能培训。随着员工数增长，组织成熟度和财务纪律也在提升；截至 2025 年末，公司约有 1,965 名员工，负责企业客户管理、覆盖
              100,000 个合作节点的伙伴关系，以及 18 个运营司法辖区的本地化合规。
