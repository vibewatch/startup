              - CO015
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、支出分类与相邻品类
        blocks:
          - type: paragraph
            body: >-
              企业健康福利行业已从地方健身房会员补贴、企业补贴健身设施、独立冥想应用等零散单点方案，演变为统一的企业健康基础设施。Wellhub
              将可服务市场界定为雇主出资的预防性健康服务和员工付费的健康订阅，明确排除临床疾病治疗、强制职业健康安全合规以及面向消费者的健身俱乐部零售会费。在这个边界内，支出分为两类：按年收取的雇主平台使用费，覆盖全体员工的参与资格；以及员工按月支付的分层订阅费，补贴实体健身房、精品工作室和数字健康应用的使用。该市场紧邻企业健康保险公司、第三方福利管理机构和传统健身俱乐部连锁，Wellhub
              是需求聚合商，而非医疗服务商或设施运营商。
            claimRefs:
              - CM001
              - CM006
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM008
              - CM009
              - CM010
      - number: '2.2'
        title: 市场规模、TAM/SAM/SOM 约束与收入兑现
        blocks:
          - type: paragraph
            body: >-
              自上而下的行业估算预计，全球企业健康福利市场近期将超过 $100 billion；推动因素包括美国雇主医疗成本上升至每名员工每年接近 $16,000，以及管理层逐渐认识到 70%
              的慢性医疗负担可以预防。但尽调必须把这一宏观总量收窄到多模态企业聚合网络的可服务市场。Wellhub 的可服务机会覆盖 18 个运营国家中寻求统一健康福利管理的企业雇主；收购 Urban Sports Club
              后欧洲市场整合进一步扩大了版图，合并后超过 34,500 家企业客户和 83,000 个合作伙伴。到 2025 年末，Wellhub 已实现的可获取市场体现为超过 5 million 名活跃付费订阅用户和约
              $319 million 年化收入，使其成为所追踪 134 家企业健康软件供应商中的规模领先者。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
              - CM014
