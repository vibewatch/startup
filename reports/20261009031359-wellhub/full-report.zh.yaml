    summary: 把企业网络规模与二级市场定价现实放在一起，推导出“跟踪”建议的决策路径。
    data:
      nodes:
        - id: scale
          label: 企业规模
          detail: 40k 企业客户、5M+ 订阅用户、100k 合作伙伴和 1B 次签到，足以确立明确的市场领先地位。
        - id: monetization
          label: 双重变现
          detail: 年度企业费用加上按月收取的员工订阅费，带来经常性 ARR，并推动合作伙伴分成增长 107%。
        - id: uncertainty
          label: 财务不透明
          detail: 毛利率、企业 NRR 和真实现金消耗仍未披露，也未经独立审计验证。
        - id: valuation-mark
          label: 二级市场估值
          detail: 二级市场交易对应 $3.29B-$4.2B 估值；按未经验证的软件经济性计，相当于 10.3x-13.2x ARR。
        - id: stance
          label: 立场偏乐观
          detail: 入场定价体现出高度乐观预期，却没有为运营或整合环节的波折留下安全边际。
        - id: decision
          label: 跟踪建议
          detail: 先跟踪非公开市场价格，等待经审计的财务披露，再投入资本。
      edges:
        - from: scale
          to: monetization
        - from: monetization
          to: uncertainty
        - from: uncertainty
          to: valuation-mark
        - from: valuation-mark
          to: stance
        - from: stance
          to: decision
    approximationNotes: 流程图梳理了决定投资立场的定性与定量证据链。
