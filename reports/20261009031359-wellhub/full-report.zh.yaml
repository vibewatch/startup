  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键运营假设
      - 估值倍数与逻辑
      - 隐含估值
      - 下行触发因素与风险
    rows:
      - - 乐观情景（25% 概率）
        - ARR 增长至 $550M+；毛利率 >50%；NRR >115%；AI 教练推动直接变现
        - 9.0x-10.0x EV/ARR，反映市场领先规模和软件般的毛利率特征
        - $4.95B - $5.50B
        - 企业健康预算削减；关键健身连锁退出或去中介化
      - - 基准情景（50% 概率）
        - ARR 增长至 $420M-$450M；毛利率维持在 35%-40%；NRR 稳定在 100%-105%
        - 6.5x-7.5x EV/ARR，与混合型市场和福利管理同业一致
        - $2.73B - $3.38B
        - 二级市场倍数压缩；IPO 市场对低毛利福利聚合平台打折
      - - 悲观情景（25% 概率）
        - ARR 放缓至 $350M；合作伙伴利润压力加剧；企业客户流失
        - 4.5x-5.0x EV/ARR，反映低毛利服务聚合业务经济性和缺乏 GAAP 盈利
        - $1.58B - $1.75B
        - 运营方强烈反弹；折价融资；员工二级市场清算带来悬而未决的抛售压力
    notes: 情景模型以最新披露的 ARR（$319M）、Series F/F-1 估值基准（$2.4B-$3.29B）和可比市场退出倍数校准。
