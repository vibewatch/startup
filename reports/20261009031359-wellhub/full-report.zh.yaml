      - number: '6.3'
        title: 生命周期个性化、用户转化与留存承保风险
        blocks:
          - type: paragraph
            body: >-
              传统实体健身房会员可从订阅者弃用中获利，而 Wellhub 的企业价值主张依赖员工持续使用。为推动行为改变，Wellhub 部署 Braze 客户互动编排平台，构建 1 至 120
              天的多阶段自动化用户旅程。平台利用应用内调查回答和行为产品数据（包括瑜伽、HIIT、冥想等训练搜索）触发个性化邮件、推送和应用内推荐。这种高度个性化的生命周期沟通让用户注册量增至 3 倍（3X
              increase），点击率最高达 70%，并带来 25% 的新增订阅收入流增长。2026 年 1 月，Wellhub 以测试版 Wellhub AI 扩展该基础设施，加入对话式 AI
              教练，为用户推荐个性化计划、导航伙伴地点并支持多品类习惯养成。


              尽管互动指标积极，独立投资评估仍显示客户留存和收入持久性存在重大风险。第三方职场和行业分析指出，Wellhub
              虽有强大的规模领先地位，但仍反复面临工作室及伙伴流失、利润率压力和聚合商报销率摩擦。在若干市场，套餐涨价和会员层级重组已引发订阅者价值投诉及局部流失风险。此外，企业投资评估受限于缺少独立验证的留存指标：NRR、GRR、ACV
              和队列存活率均未披露。由于营销标题依赖自报 ROI 和汇总调查指标，企业投资方无法独立验证长期续约经济性。
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: 展示
        blocks:
          - type: callout
            title: 双利益相关方留存脆弱性与定价敏感性
            body: >-
              Wellhub 的双利益相关方模式带来叠加的留存脆弱性。企业客户按符合条件的员工人数签订年度合同，但员工互动决定持续感知价值。Wellhub
              调整订阅价格或出现局部伙伴流失时，员工抵触可能降低参与度。若企业福利管理员发现参与度走弱，或员工对伙伴使用权的投诉增加，年度雇主合同续约就会面临更高的取消和缩减范围风险。
            calloutType: risk
            claimRefs:
              - CU004
              - CU013
          - type: callout
            title: 缺少经审计的净收入留存与队列透明度
            body: >-
              尽管 Wellhub 报告近 40,000 家企业客户和 5 million 名订阅用户，公司没有披露经审计的 NRR、GRR 或 CAC 回收期。企业客户从 2024 年末的 22,000 家大幅增至 2026
              年近 40,000 家，部分由欧洲收购（Fitprime 和 Urban Sports Club）加速。没有经审计的队列披露，私募股权和成长型投资评估团队无法核实有机客户扩张与收购客户数量的区别。
            calloutType: insight
            claimRefs:
              - CU009
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与证据边界
        blocks:
          - type: paragraph
            body: >-
              最高的剩余风险是供应商网络连续性、运营模式不透明和产品治理执行。Wellhub 报告平台覆盖超过 5 million 名订阅用户、近 40,000 家企业客户、近 100,000 个伙伴和 18
              个国家；当前主页还描述了更广泛的网络：110,000+ 家健身房和工作室、3,800 名虚拟教练及 90+ 个应用 [CR007,
              CR009]。如此规模放大了供应商下架、预约中断或本地覆盖不一致的后果，但指定证据没有披露实际中断频率或伙伴集中度。因此，法律和监管严重性依据有效条款及已披露产品范围排序，而不是假定存在事故记录。热力图把有证据的暴露与未经验证的频率分开；由于指定证据池没有监管机构、法院、认证或执法清单，法律登记表明确只是部分记录
              [CR001, CR002, CR003, CR004, CR005, CR015]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
