            body: >-
              Tracxn 报告七轮融资累计 $605 million，并确认 2023 年 8 月 23 日完成 $85 million Series
              F。这些历史融资额不是当前现金；已审阅证据没有现金余额、债务安排、净烧钱、现金
              runway、收购对价或下一轮融资触发条件。把累计融资当流动性会严重高估资本充足性。因此，财务故事有吸引力，但尚不足以支撑投资判断：两种经常性付费机制、较大的披露分发规模和上升的签到量说明需求引擎可信；然而与活动挂钩的结算和运营商获客压力让利润路径仍未厘清。投资决策前，管理层应提供经审计的收入确认、雇主及订阅用户队列、结算总额到净额的核对、CAC
              与回收期、毛利率、NRR、营运资金需求、现金、债务、烧钱及并购后整合桥接表。在此之前，任何精确的收入、利润率、现金消耗或 runway 估算都缺乏依据。
