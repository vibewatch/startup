      - number: '7.2'
        title: 法律、运营与产品治理暴露
        blocks:
          - type: paragraph
            body: >-
              Wellhub 条款把供应商服务的交付、质量、完整性和监管合规交由各第三方供应商负责，并允许供应商改变服务；Wellhub 则保留修改或停止平台功能的广泛权利 [CR002,
              CR003]。这些条款减少合同承诺，但会员无法使用设施或数字服务时，并不能消除声誉和企业续约风险。同一条款在允许的情况下采用仲裁和集体诉讼弃权，警告健康信息不是医疗建议，并承认固有的身体风险 [CR004,
              CR005]。Wellhub AI 进一步扩大产品风险：公司称测试版对话式教练可覆盖健身、正念、疗愈、营养和睡眠，并推荐相应计划与指导，但指定证据没有模型治理、隐私影响、临床安全或事故文件
              [CR006]。巴西平台团队的招聘转发和 Wellhub 的弹性工作描述显示交付团队分布式运营，但两者都不能证明离职率上升或可靠性问题；这些仍是监测问题，而非结论 [CR014]。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR006
              - CR007
              - CR014
      - number: '7.3'
        title: 伙伴经济性、模型风险与止损标准
        blocks:
          - type: paragraph
            body: >-
              该模式同时依赖雇主赞助和员工订阅：Wellhub 称公司按团队规模支付年度费用，员工选择月度套餐 [CR008]。公司发布的英国广告式证据称，每一名受访运营商都看到本地竞争加剧，82% 面临获客成本上升，74%
              认为企业健康平台触达了原本无法触达的人群，且超过 93% 的会员访问是增量访问 [CR011, CR012]。这些数字同时暗示价值和议价矛盾，却没有披露样本量、结算条款、伙伴流失或 Wellhub
              毛利率。Built In 未经审阅的 AI 生成页面提示伙伴流失、定价敏感性以及对公司自报指标的依赖，但其免责声明不允许把这些主题当作已验证事件 [CR013]。结果证据也需谨慎：Wellhub
              将医疗成本和离职率相关主张归因于内部研究，包括一家巴西客户和一项三客户留存研究 [CR010]。因此，投资止损标准应绑定于已验证的伙伴留存、服务水平、AI 治理或经独立核对的经济性恶化，而不是没有依据的精确数字
              [CR016]。
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
