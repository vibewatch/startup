chapter:
  number: 1
  title: "Company Overview"
  summary: "Wellhub (formerly Gympass) is a late-stage corporate wellness platform founded in 2012 in São Paulo and headquartered in New York, connecting nearly 40,000 corporate clients and over 5 million employee subscribers to a global network of 100,000 wellness partners across 18 countries. The company has raised over $605 million in equity funding, including an $85 million Series F led by EQT Growth at a $2.4 billion valuation in August 2023, while generating $319 million in ARR with positive cash flow dynamics and expanding modality breadth into mental health, nutrition, and AI-enabled engagement."
sections:
  - id: "corporate-identity-and-evolution"
    title: "Corporate Identity, Operating Footprint, and Strategic Evolution"
    body: "Wellhub was founded in 2012 in São Paulo, Brazil, by Cesar Carvalho and co-founders as Gympass, originally operating as a consumer-facing gym pass before pivoting entirely to an enterprise B2B corporate wellbeing subscription model. Headquartered in New York City while retaining major engineering and operational hubs in Brazil, Europe, and Latin America, the company rebranded from Gympass to Wellhub in May 2024 to signify its evolution from physical gym aggregation to a holistic multi-modality wellbeing platform spanning fitness, mindfulness, therapy, nutrition, and sleep. Operating across 18 countries, Wellhub provides corporate clients with a single subsidized employee benefit subscription that grants tiered access to commercial fitness facilities, boutique studios, virtual personal trainers, and digital health applications. The operating model relies on driving incremental foot traffic to fitness operators and digital health partners; company disclosures emphasize that over 90% of Wellhub users visiting a participating partner facility are first-time visitors, mitigating operator fears of cannibalizing direct retail memberships. Network check-ins experienced ten-fold expansion from 100 million in 2022 to over 1 billion cumulative check-ins by early 2026, supported by 50+ direct integrations into facility management and booking systems (CMS) that reduce access friction and boost utilization."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "leadership-governance-and-talent"
    title: "Executive Leadership, Governance Structure, and Key-Person Dependency"
    body: "Executive leadership at Wellhub is anchored by Co-Founder and Chief Executive Officer Cesar Carvalho, who has directed corporate strategy, geographic expansion across the Americas and EMEA, and multiple business model transitions since inception in 2012. Carvalho maintains significant strategic authority and cultural influence across the organization, representing a key-person dependency common to founder-led late-stage venture-backed enterprises, though day-to-day operations and regional expansions are distributed across tenured functional vice presidents and regional general managers. The company's corporate governance and capital allocation framework is heavily shaped by institutional growth equity sponsors who hold board representation and significant minority equity stakes, led by EQT Growth following its August 2023 Series F lead investment, alongside longstanding institutional backers General Atlantic and Moore Strategic Ventures. In May 2024, Wellhub initiated a structured talent and HR development partnership with AVADO to enhance executive capabilities and functional workforce training across its commercial and operational teams. Organizational maturity and financial discipline have expanded alongside headcount, which stood at approximately 1,965 employees as of late 2025, supporting enterprise client management, corporate partner relationships across 100,000 partner nodes, and localized compliance in 18 operating jurisdictions."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO002"
  - id: "capitalization-scale-and-market-traction"
    title: "Capitalization History, Enterprise Traction, and Operational Friction"
    body: "Wellhub's balance sheet and capitalization trajectory reflect disciplined institutional backing across multiple market cycles. The company has raised $605 million in institutional primary capital across disclosed funding rounds, culminating in an $85 million Series F round in August 2023 led by EQT Growth with participation from Neuberger Berman, alongside secondary share purchases by General Atlantic and Moore Strategic Ventures, establishing a post-money valuation benchmark of $2.4 billion. Independent private secondary market intelligence platforms, including PM Insights and secondary trades, tracked ongoing private transaction activity and elevated secondary marks up to $4.2 billion; however, secondary valuations reflect illiquid private clearing prices rather than audited equity rounds or primary cash infusions. On commercial traction, annual recurring revenue (ARR) reached $319 million as of September 2025 according to SaaS market intelligence reports, underpinned by nearly 40,000 corporate employer clients and over 5 million employee subscribers. Network payouts to participating gym and studio operators grew 107% globally and doubled in the United States in 2025, driven by corporate client expansion and corporate wellness investments. However, aggressive expansion has surfaced operational headwinds: independent employer insights and partner commentary highlight ongoing friction regarding partner revenue shares, regional partner churn where boutique operators push back against aggregator economics, plan pricing adjustments that prompt member resistance, and the continuous requirement to integrate regional acquisitions such as Fitprime and Urban Sports Club."
    claimRefs:
      - "CO009"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
