callouts:
  - calloutType: "insight"
    title: "Strategic Impact of the 2024 Rebrand and Modality Broadening"
    body: "The transition from Gympass to Wellhub in May 2024 represented a fundamental pivot from a pure gym-access aggregator into an integrated corporate benefits platform. By bundling mindfulness (Headspace), digital nutrition, sleep therapy, and physical gym access into one employer-sponsored tier, Wellhub increased its addressable procurement budget within enterprise HR departments while driving 3-5x higher employee enrollment compared to single-modality wellness programs."
    claimRefs:
      - "CO002"
      - "CO005"
      - "CO006"
  - calloutType: "risk"
    title: "Partner Economics and Secondary Valuation Fragility"
    body: "While Wellhub reports doubling operator payouts in 2025, independent workplace and fitness operator commentary reveals persistent tension regarding partner margins and pricing transparency. Furthermore, secondary market indicators pricing the company up to $4.2B remain unverified by primary audited funding rounds, creating potential valuation overhang should growth decelerate or partner churn accelerate in core metropolitan markets."
    claimRefs:
      - "CO014"
      - "CO015"
      - "CO016"
