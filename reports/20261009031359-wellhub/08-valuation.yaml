      - "CV010"
      - "CV012"
      - "CV013"
  - calloutType: "risk"
    title: "Secondary Market Liquidity and Valuation Verification Risks"
    body: "Pre-IPO shares offered on platforms like UpMarket and Forge carry acute illiquidity, transfer restrictions under corporate right-of-first-refusal clauses, and lack consensus valuation verification from two independent reputable sources. Investors face potential down-round repricing if public market exit multiples re-anchor toward traditional benefits administration peers."
    claimRefs:
