    title: "Recommendation Rationale: Track Stance Amid Private Market Disconnect"
    body: "Wellhub is a category-defining corporate wellness aggregator with demonstrated global scale, but current secondary prices between $3.29B and $4.2B leave zero margin of safety for investors. Investors should remain on the sidelines (Track) until the company releases audited financial statements confirming gross margins above 50% and net revenue retention above 105%."
