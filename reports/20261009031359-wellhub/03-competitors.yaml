    title: "Physical supply is the hardest visible asset to copy"
    body: "Wellhub's company-reported network breadth and international access create a distribution advantage over app-only engagement products, although the evidence does not establish local density or exclusivity."
    claimRefs:
      - "CP002"
      - "CP006"
      - "CP016"
