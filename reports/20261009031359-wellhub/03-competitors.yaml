chapter:
  number: 3
  title: "Competitors"
  summary: "Wellhub's defensible edge is the breadth of its physical-partner network combined with a multi-category subscription and enterprise distribution. That position is not absolute: ClassPass contests access economics, Vantage Fit contests engagement and price transparency, and public evidence does not establish partner exclusivity, switching costs, or independently verified service quality."
sections:
  - id: "landscape-and-alternatives"
    title: "Landscape and Ways to Solve the Job"
    body: >-
      Wellhub competes across more than one category. Its closest access-model comparison in the
      assigned evidence is ClassPass, whose credits contrast with Wellhub's daily-check-in
      subscriptions. Vantage Fit represents a software-first engagement alternative with
      challenges, rewards, and a much broader claimed country footprint, but without subsidized
      physical gym access. Single-category wellness applications, direct gym memberships, an
      employer stipend, and an internal program remain substitutes even when they do not match the
      full bundle. The evidence therefore supports a landscape organized by the buyer's objective
      rather than a single peer list. Funding and reliable scale disclosures for most alternatives
      are absent from the assigned pool and are marked unknown rather than estimated.
    claimRefs:
      - "CP002"
      - "CP004"
      - "CP007"
      - "CP009"
      - "CP010"
      - "CP013"
    tableRefs:
      - "TP001"
  - id: "capability-and-distribution"
    title: "Capability, Distribution, and Strategic Direction"
    body: >-
      Wellhub's current official surface describes 110,000-plus gyms and studios, 3,800 virtual
      trainers, and more than 90 wellness apps. Its January 2026 release adds a beta AI coach and
      cross-border check-ins, while a company-issued job posting shows active investment in partner
      marketing, network growth, and partner satisfaction in France and Benelux. Those signals make
      supply density and enterprise distribution more important than feature parity alone.
      ClassPass offers another physical-access model, while Vantage Fit emphasizes app-native
      engagement, transparent pricing, and rewards. Trust comparisons remain incomplete: Vantage
      Fit labels itself HIPAA and SOC 2 compliant, but the assigned pool contains neither underlying
      audit documents nor comparable Wellhub certification evidence.
    claimRefs:
      - "CP002"
      - "CP005"
      - "CP006"
      - "CP008"
      - "CP010"
      - "CP011"
      - "CP012"
    tableRefs:
      - "TP002"
    figureRefs:
      - "FP001"
  - id: "pricing-and-packaging"
    title: "Pricing and Packaging"
    body: >-
      Wellhub uses a dual-payer structure: companies pay an annual corporate fee based on team size
      and investment level, while participating employees choose and pay for monthly plans. The
      public employee menu spans eleven tiers from a free Digital plan to a $344.99 Diamond plan,
      but employer pricing is not disclosed in the assigned evidence. Wellhub's own comparison
      frames ClassPass as a variable-credit product and Wellhub as an all-inclusive daily-access
      subscription. Vantage Fit's comparison page claims a flat $1 per user per month with no
      minimum, while describing Wellhub employer pricing as negotiated and unpublished. Because
      both comparisons are vendor-authored, they clarify packaging but do not independently prove
      realized contract cost or superior value.
    claimRefs:
      - "CP001"
      - "CP003"
      - "CP007"
      - "CP008"
      - "CP009"
    tableRefs:
      - "TP003"
  - id: "moat-and-displacement-risk"
    title: "Moat Durability and Displacement Risk"
    body: >-
      The strongest visible moat is the combination of physical supply, employer distribution, and
      a broad wellness bundle. A software-only challenger can reproduce challenges or coaching more
      readily than it can reproduce dense local gym access; conversely, digital features and opaque
      corporate pricing provide weaker protection. The partner-marketing role also shows that
      network quality requires continuous local investment rather than operating as a passive data
      asset. Adverse evidence is directionally important but weak: CheckThat.ai reports recurring
      support and billing concerns and a 6.4/10 G2 support score, yet it does not provide the
      underlying review set in the fetched text. The available Reddit page is only a community
      description, not usable sentiment evidence. Partner churn, exclusivity, payout economics, and
      multi-homing therefore remain material diligence gaps.
    claimRefs:
      - "CP011"
      - "CP014"
      - "CP016"
