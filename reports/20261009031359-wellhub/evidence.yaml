evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-metrics
    missingEvidence: Audited gross margin percentage, net revenue retention (NRR), and GAAP operating income statements.
    whyItMatters: >-
      Gross margin determines whether Wellhub achieves high-margin software economics or operates as a capital-intensive
      fitness aggregator.
    diligencePath: Review confidential financial disclosure schedules, audited financial statements, or S-1 IPO registration filings.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: executive-roster-enumeration
    missingEvidence: >-
      Full C-suite executive roster covering Chief Technology Officer, Chief Product Officer, and Regional Managing
      Directors.
    whyItMatters: Validates technical execution depth and regional management bench behind CEO Cesar Carvalho.
    diligencePath: Obtain formal executive organization chart directly from company HR or investor presentation deck.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Granular independent bottom-up analysis isolating multi-modality corporate aggregator addressable spend from
      broader employer healthcare insurance benefits and direct gym subsidies.
    whyItMatters: >-
      Broad macro projections ($100B+) group clinical prevention and medical health plans together with discretionary
      fitness benefits, obscuring true serviceable addressable market boundaries.
    diligencePath: >-
      Acquire enterprise customer cohort procurement data separating annual platform access fees from employee payroll
      deduction copays across enterprise tiers.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: marketplace-risks
    missingEvidence: >-
      Independent longitudinal gym operator partner retention data, payout rate schedules, and localized network
      coverage churn metrics.
    whyItMatters: >-
      Aggregator platform durability depends on maintaining equitable payout economics with fitness club operators to
      prevent supply-side network attrition.
    diligencePath: >-
      Survey regional fitness and boutique studio franchise partners regarding net revenue margins and member retention
      before and after joining the Wellhub network.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: partner-economics
    missingEvidence: >-
      Partner payout formulas, exclusivity provisions, multi-homing rates, local network density, and partner churn by
      market.
    whyItMatters: These data determine whether the physical network is a durable moat or a costly, non-exclusive aggregation layer.
    diligencePath: >-
      Request partner contract samples, payout and churn cohorts, exclusivity schedules, and city-level supply and
      utilization data.
    relatedQuestionRefs:
      - QP005
  - type: missing-source
    severity: material
    topic: trust-and-compliance
    missingEvidence: >-
      Underlying SOC 2 or comparable audit reports, HIPAA scope documentation, privacy controls, regulatory history, and
      directly sourced review data for each vendor.
    whyItMatters: >-
      Vendor labels and secondary complaint summaries cannot establish control effectiveness, incident history, or
      service quality.
    diligencePath: >-
      Obtain audit reports and regulatory disclosures from each vendor, then sample source reviews directly with dates
      and denominators.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: competitor-economics
    missingEvidence: >-
      Direct competitor funding, current enterprise pricing, active-client counts, retention, engagement, and realized
      contract economics on comparable periods and denominators.
    whyItMatters: >-
      Without normalized economics and adoption data, the chapter can compare packaging but cannot rank competitive
      strength or price-performance.
    diligencePath: >-
      Collect direct vendor proposals, filings or investor disclosures, independent customer references, and
      cohort-level utilization reports.
    relatedQuestionRefs:
      - QP002
      - QP004
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, debt and lease obligations, monthly net burn, acquisition consideration, covenants, and
      management runway scenarios.
    whyItMatters: >-
      Cumulative funding raised cannot establish cash available, financing dependency, or the timing of a future capital
      requirement.
    diligencePath: >-
      Request the latest balance sheet, debt schedule, monthly cash-flow history, board budget, and base/downside runway
      model under NDA.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited gross margin, partner payout schedules, CAC by channel, sales-cycle distribution, payback, contribution
      margin, NRR, and customer concentration.
    whyItMatters: >-
      Public scale and activity measures do not show whether incremental enrollment and check-ins create positive
      contribution economics.
    diligencePath: >-
      Obtain audited statements plus employer, subscriber, and partner cohorts reconciled to recognized revenue and
      direct costs.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: revenue-recognition
    missingEvidence: >-
