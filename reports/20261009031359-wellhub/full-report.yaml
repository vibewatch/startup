      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Architectural Shift: From Gym Aggregator to Unified Wellness Operating System'
            body: >-
              Wellhub's technology trajectory reflects an architectural evolution from a regional gym aggregator into an
              enterprise wellbeing platform. By deploying Phrase Custom AI for global content velocity, integrating
              conversational coaching through Wellhub AI, and standardizing over 50 client connectors onto modern AWS
              infrastructure, Wellhub has deepened its technological moat against point-solution competitors.
            calloutType: insight
            claimRefs:
              - CE007
              - CE009
              - CE012
              - CE014
          - type: callout
            title: Supplier Margin Pressures and Post-Acquisition Integration Friction
            body: >-
              While Wellhub's marketplace scale creates strong network effects, its technical infrastructure must absorb
              substantial complexity from inorganic growth. Managing acquisitions like Fitprime and Urban Sports Club
              introduces fragmented legacy codebases and partner management pipelines, increasing technical debt while
              partner friction regarding compensation models poses ongoing network stability risks.
            calloutType: risk
            claimRefs:
              - CE008
