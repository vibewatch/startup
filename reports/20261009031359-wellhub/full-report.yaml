  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture & Modular Subscription Architecture
        blocks:
          - type: paragraph
            body: >-
              Wellhub operates a two-sided enterprise wellbeing platform that transforms fragmented fitness, therapy,
              mindfulness, nutrition, and sleep services into a unified employee benefit. For corporate clients, Wellhub
              provides an employer management portal allowing HR organizations to deploy wellness benefits in under 30
              days, automate eligibility verification, and manage annual corporate subsidies calibrated to workforce
              headcount. Employees receive an authenticated mobile application that unlocks tiered subscriptions
              spanning onsite fitness centers, boutique studios, and digital wellness applications across 18 countries
              with cross-border international access. The platform's modular structure standardizes partner access
              across Starter+, Silver, Gold, and premium tiers, replacing disparate wellness reimbursements with a
              centralized digital wallet and check-in mechanism. However, significant architectural variation exists
              across regional operating hubs, where legacy Gympass integrations coexist with recently acquired European
              networks such as Fitprime and Urban Sports Club.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
