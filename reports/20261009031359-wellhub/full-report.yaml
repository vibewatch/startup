      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Mechanics
        blocks:
          - type: paragraph
            body: >-
              Wellhub's dual-payer model requires navigating a two-stage procurement and adoption funnel. The economic
              buyer is typically the Chief Human Resources Officer, Vice President of Total Rewards, or Benefits
              Director, with finance departments exerting substantial oversight as 61% of organizations fund wellness
              initiatives through healthcare benefits allocations. Enterprise purchase decisions are triggered by talent
              retention priorities—where 85% of HR leaders view wellness programs as vital for retaining top
              performers—and rising healthcare expenditure. Following employer onboarding, which averages under 30 days,
              individual employees become secondary subscribers, selecting from 11 pricing tiers ranging from free
              digital access to $344.99 per month for luxury club access. A critical adoption dynamic is non-member
              conversion: 61% to 65% of new Wellhub subscribers did not hold a commercial health club membership prior
              to enrollment, demonstrating genuine demand creation rather than mere discount capture.
            claimRefs:
              - CM006
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
