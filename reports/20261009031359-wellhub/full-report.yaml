              - CR014
      - number: '7.3'
        title: Partner Economics, Model Risk, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              The model depends on both employer sponsorship and employee subscriptions: Wellhub says companies pay
              annual fees based on team size while employees select monthly plans [CR008]. Company-issued UK advertorial
              evidence reports that every surveyed operator saw stronger local competition, 82% faced rising acquisition
              costs, 74% said corporate wellness platforms reached otherwise inaccessible demographics, and more than
              93% of member visits were incremental [CR011, CR012]. These figures suggest both value and bargaining
              tension, but they do not disclose sample size, payout terms, partner churn, or Wellhub gross margin. Built
              In's unreviewed AI-generated page flags partner churn, pricing sensitivity, and reliance on
              company-reported metrics, but its own disclaimer prevents treating those themes as verified events
              [CR013]. Outcome evidence also needs caution: Wellhub attributes healthcare-cost and turnover claims to
              internal studies, including one Brazilian client and a three-client retention study [CR010]. Investment
              kill criteria should therefore be tied to verified deterioration in partner retention, service levels, AI
              governance, or independently reconciled economics—not to unsupported precision [CR016].
            claimRefs:
              - CR008
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
