      - number: '6.2'
        title: Enterprise Adoption Trajectory, Verified Customer Proof, and Industry Breadth
        blocks:
          - type: paragraph
            body: >-
              Wellhub exhibits enterprise commercial scale, expanding its corporate client base from 10,000 corporate
              employers during early growth to 22,000 clients at year-end 2024 and reaching nearly 40,000 corporate
              clients by 2026 alongside more than 5 million paying employee subscribers. Public disclosures and
              technographic intelligence databases verify customer adoption across 21 diverse industry verticals,
              heavily concentrated within Retail, Banking and Financial Services, Healthcare, and Professional Services
              across 195 tracked countries. Documented enterprise references demonstrate long-term relationship
              durability and international rollouts: Banco Santander established a global agreement in 2018 to deploy
              Wellhub across international markets as part of its BeHealthy HR wellbeing programme, embedding membership
              access into global vendor governance. In 2023, Amazon contracted Wellhub to implement wellbeing
              memberships for its employee population and families in São Paulo, Brazil, expanding its corporate
              benefits catalog to include fitness and mental health services.


              Customer momentum continued into 2025 and 2026 across major employer groups. Activision Blizzard deployed
              Wellhub in 2025 as its enterprise membership management platform to deliver HR-managed employee wellbeing
              benefits, while regional healthcare system Lee Health onboarded Wellhub in July 2026 to cover 18,000
              healthcare employees. Furthermore, active buyer intent tracking identifies large institutional employers
              actively evaluating Wellhub, including Sutter Health representing 53,000 healthcare workers. To accelerate
              enterprise adoption and address corporate budget friction during peak wellness enrollment periods, Wellhub
              introduced a free-to-start commercial onboarding model for new employers alongside international check-ins
              spanning nearly 100,000 partner nodes. Despite these prominent enterprise logos, public customer lists are
              disproportionately vendor-curated, leaving renewal rates and account-level contract values undisclosed.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU012
          - type: table
