      - number: '7.2'
        title: Legal, Operational, and Product-Governance Exposure
        blocks:
          - type: paragraph
            body: >-
              Wellhub's terms place delivery, quality, integrity, and regulatory compliance of provider services on each
              third-party provider and allow provider offerings to change, while Wellhub reserves broad rights to modify
              or discontinue platform features [CR002, CR003]. Those provisions reduce contractual commitments but do
              not remove reputational or enterprise-renewal exposure when a member cannot access a facility or digital
              service. The same terms use arbitration and class-action waivers where permitted, warn that wellness
              information is not medical advice, and acknowledge inherent physical risks [CR004, CR005]. Product risk
              expands with Wellhub AI: the company describes a beta conversational coach that recommends routines and
              guidance across fitness, mindfulness, therapy, nutrition, and sleep, yet the assigned evidence supplies no
              model-governance, privacy-impact, clinical-safety, or incident documentation [CR006]. A Brazil-based
              platform-team job repost and Wellhub's flexible-work description indicate distributed delivery, but
              neither source proves elevated attrition or reliability problems; those remain monitoring questions rather
              than findings [CR014].
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR014
          - type: table
