      - number: '5.2'
        title: Technical Architecture, Integration Pipeline & Engineering Model
        blocks:
          - type: paragraph
            body: >-
              The core technology stack of Wellhub combines modern distributed microservices and micro-frontend
              architectures with legacy backend services and third-party SaaS systems. The supplier-facing ecosystem
              utilizes a modular frontend built on React, TanStack, and TypeScript, backed by Kotlin and Java
              microservices deployed on Amazon Web Services (AWS) infrastructure. Partner acquisition and onboarding
              rely on GrowthBook for telemetry, feature-flagging, and parallel conversion A/B testing, integrated into
              core commercial workflows managed in Salesforce. On the corporate integrations and professional services
              side, Wellhub engineering maintains an extensive pipeline of client-specific connectors executing
              thousands of requests per second. The backend relies on Node.js, TypeScript, and AWS serverless Lambda
              functions paired with relational PostgreSQL and MySQL databases, alongside NoSQL data stores including
              DynamoDB and MongoDB. An active technical migration is currently consolidating over 50 disparate connector
              pipelines into a modern, standardized runtime environment, exposing integration risks during client data
              transformations.
