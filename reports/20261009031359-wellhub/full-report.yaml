              - CI004
      - number: '4.3'
        title: Traction Does Not Resolve Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Public operating indicators show scale but are not substitutes for financial statements. A Wellhub-issued
              release syndicated by Fitt Insider reported growth from 100 million check-ins in 2022 to 1 billion in
              2025. Wellhub's 2026 operator survey also found that 76% of respondents already partnered with a corporate
              wellness platform described channel revenue as new rather than shifted from existing members; the
              methodology explicitly says partner comparisons were descriptive, not a controlled trial. Cost pressure is
              visible in the same survey: 82% of 662 owners across 11 countries said customer-acquisition costs
              increased in 2026. A separate 2025 Wellhub survey of more than 600 operators already using wellness
              platforms reported stronger profitability and retention, but that selected population cannot establish
              Wellhub's own margins. These data support network value and demand generation, not CAC, payback,
              contribution margin, or cohort profitability.
            claimRefs:
              - CI008
              - CI010
              - CI011
              - CI012
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI010
              - CI016
      - number: '4.4'
        title: Capital Adequacy and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              Tracxn reports $605 million of total funding across seven rounds and identifies an $85 million Series F
              dated August 23, 2023. Those historical financing amounts are not current cash, and the reviewed evidence
              supplies no cash balance, debt schedule, net burn, runway, acquisition consideration, or next-round
              trigger. Treating cumulative funding as liquidity would materially overstate capital adequacy. The
              financial case is therefore promising but not underwritable: two recurring payment mechanisms, large
              reported distribution, and rising check-ins indicate a credible demand engine, while activity-linked
              payouts and operator acquisition pressure leave the margin path unresolved. Before an investment decision,
              management should provide audited revenue recognition, employer and subscriber cohorts, gross-to-net
              payout reconciliation, CAC and payback, gross margin, NRR, working-capital requirements, cash, debt, burn,
              and a post-acquisition integration bridge. Until then, no precise revenue, margin, cash-burn, or runway
              estimate is supportable.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Utilization is both traction and cost exposure
            body: >-
              Check-in growth and rising partner payouts validate usage, but they do not reveal contribution margin.
              Operator acquisition costs and low-confidence third-party warnings about partner churn and pricing
              sensitivity make the undisclosed payout curve a central diligence item.
            calloutType: risk
            claimRefs:
              - CI007
              - CI008
              - CI011
              - CI015
