              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not infer safety from public silence
            body: >-
              The assigned evidence contains terms, promotional pages, a supplier advertorial, an AI-generated
              third-party summary, and job materials—not a complete incident, litigation, enforcement, security, or
              partner-retention record. Absence of such records in this pool is an evidence gap and cannot support a
              no-incident conclusion [CR013, CR015].
            calloutType: risk
            claimRefs:
              - CR013
              - CR015
          - type: callout
            title: Thesis-break monitoring
            body: >-
              Escalate or break the thesis if diligence identifies sustained provider churn in priority markets,
              repeated material service failures, unsafe or non-compliant AI behavior, or economics that cannot
              reconcile employer and employee receipts with provider payouts and support costs [CR016].
            calloutType: recommendation
            claimRefs:
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Wellhub centers on its dominant multi-sided corporate wellness moat. With nearly
              40,000 corporate clients, over 5 million employee subscribers, and access to 100,000 fitness, mindfulness,
              therapy, nutrition, and sleep partners across 18 countries, the platform has surpassed 1 billion check-ins
              [CV001, CV002, CV003]. Employers pay an annual corporate access fee while employees purchase tiered
              monthly subscriptions, generating recurring revenue backed by 3x to 5x higher enrollment than traditional
              corporate wellness programs [CV003, CV004]. Network scale is self-reinforcing: partner payouts grew 107%
              year-over-year in 2025, cementing retention across major gym chains such as Anytime Fitness and European
              aggregators like Urban Sports Club [CV002, CV005, CV006]. Conversely, the core anti-thesis highlights
              structural margin ambiguity and multiple risk. Wellhub's dual SaaS-and-benefits marketplace model requires
              substantial payouts to physical gym operators, capping gross margins well below pure software benchmarks
              [CV005, CV006]. Industry observations warn of partner churn, operator margin friction, and member plan
              sensitivity, while key operational performance metrics remain company-reported without independent audit
              [CV007, CV008]. At implied secondary multiples above 10x ARR, any post-acquisition integration friction or
              deceleration in enterprise renewals exposes investors to steep down-round or multiple compression risks
              [CV008, CV009].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: Recommendation, Risk Rating, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              We assign Wellhub a Track recommendation with a Stretched valuation stance and a High risk rating [CV010].
              In late-stage private markets, Wellhub's equity trades via secondary platforms including UpMarket and
              Forge Global, where accredited investors access pre-IPO shares subject to right of first refusal,
              illiquidity discounts, and strict transfer limits [CV011, CV012]. The most recent verified institutional
              pricing round was the August 2023 Series F, which raised $85M at a $2.4B post-money valuation ($33.81 per
              share), followed by Forge Global's documented December 2024 Series F-1 round of $150M at $39.00 per share
              for a $3.29B post-money valuation [CV005, CV013]. Secondary market commentary has floated private
              valuations as high as $4.2B, but independent brokerages explicitly confirm that such elevated valuations
              lack verification from two independent reputable sources [CV012]. Without verified audited gross margin
              figures, net revenue retention (NRR) disclosures, or unit economic data separating SaaS platform fees from
              pass-through partner payouts, paying a double-digit multiple on secondary shares offers insufficient
              margin of safety [CV008, CV012, CV013].
            claimRefs:
              - CV005
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario Modeling, Comps, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Wellhub across three multi-year exit scenarios illuminates the asymmetric downside of entering
              at peak secondary marks [CV014]. In the Bull case, Wellhub scales enterprise ARR beyond $500M through
              international expansion, enterprise AI coach monetization, and stable partner payout splits, justifying a
              public market IPO multiple of 8.0x to 10.0x and delivering an attractive return above $4.5B [CV002, CV003,
              CV014]. In the Base case, ARR expands moderately to $400M-$450M, but public market comps in HR benefits
              and marketplace technology (such as HealthEquity, Gym Group, or consumer aggregators) compress exit
              multiples to 6.0x-7.5x ARR, resulting in an equity value of $2.7B to $3.3B and approximately flat returns
              relative to recent secondary transactions [CV005, CV013, CV014]. In the Bear case, partner margin
              disputes, corporate employee churn, and execution drag from combining Fitprime and Urban Sports Club
              compress gross margins and decelerate growth, triggering a down-round valuation toward $1.8B-$2.2B
              (4.5x-5.0x ARR) [CV006, CV007, CV008, CV014]. Priority diligence asks require verifying audited
              consolidated gross margins, enterprise NRR cohorts, and secondary share class liquidation preference
              seniority before capital commitment [CV008, CV013, CV015].
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation Rationale: Track Stance Amid Private Market Disconnect'
            body: >-
              Wellhub is a category-defining corporate wellness aggregator with demonstrated global scale, but current
              secondary prices between $3.29B and $4.2B leave zero margin of safety for investors. Investors should
              remain on the sidelines (Track) until the company releases audited financial statements confirming gross
              margins above 50% and net revenue retention above 105%.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV008
              - CV010
              - CV012
              - CV013
          - type: callout
            title: Secondary Market Liquidity and Valuation Verification Risks
            body: >-
              Pre-IPO shares offered on platforms like UpMarket and Forge carry acute illiquidity, transfer restrictions
              under corporate right-of-first-refusal clauses, and lack consensus valuation verification from two
              independent reputable sources. Investors face potential down-round repricing if public market exit
              multiples re-anchor toward traditional benefits administration peers.
            calloutType: risk
            claimRefs:
              - CV008
              - CV011
              - CV012
              - CV013
