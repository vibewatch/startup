chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Footprint, and Strategic Evolution
        blocks:
          - type: paragraph
            body: >-
              Wellhub was founded in 2012 in São Paulo, Brazil, by Cesar Carvalho and co-founders as Gympass, originally
              operating as a consumer-facing gym pass before pivoting entirely to an enterprise B2B corporate wellbeing
              subscription model. Headquartered in New York City while retaining major engineering and operational hubs
              in Brazil, Europe, and Latin America, the company rebranded from Gympass to Wellhub in May 2024 to signify
              its evolution from physical gym aggregation to a holistic multi-modality wellbeing platform spanning
              fitness, mindfulness, therapy, nutrition, and sleep. Operating across 18 countries, Wellhub provides
              corporate clients with a single subsidized employee benefit subscription that grants tiered access to
              commercial fitness facilities, boutique studios, virtual personal trainers, and digital health
              applications. The operating model relies on driving incremental foot traffic to fitness operators and
              digital health partners; company disclosures emphasize that over 90% of Wellhub users visiting a
              participating partner facility are first-time visitors, mitigating operator fears of cannibalizing direct
              retail memberships. Network check-ins experienced ten-fold expansion from 100 million in 2022 to over 1
              billion cumulative check-ins by early 2026, supported by 50+ direct integrations into facility management
              and booking systems (CMS) that reduce access friction and boost utilization.
