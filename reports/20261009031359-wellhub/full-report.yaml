            title: Public comparisons are issuer-biased
            body: >-
              The clearest ClassPass comparison is issued by Wellhub and the clearest Vantage Fit comparison is issued
              by Vantage Fit; neither should be treated as an independent benchmark of price, engagement, or service
              quality.
            calloutType: risk
            claimRefs:
