  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Architecture and Recognition Limits
        blocks:
          - type: paragraph
            body: >-
              Wellhub publicly identifies two monetization layers. Employers pay an annual corporate fee based on team
              size, and eligible employees choose a monthly subscription plan. This creates recurring contract and
              subscription mechanisms, but the reviewed sources do not disclose the realized mix, average employer
              contract value, subscriber ARPU, discounts, refunds, or whether reported revenue is presented gross or net
              of partner payouts. The cost side is activity-linked: Wellhub says partner revenue is directly linked to
              member check-ins, while its syndicated 2026 release reported that 2025 gross payouts nearly doubled in the
              United States and rose 107% globally. The architecture can therefore produce attractive recurring demand
              without necessarily producing software-like margins; utilization increases both engagement evidence and
              payout exposure. Audited recognition policies and payout schedules are required before assigning revenue
              quality or gross-profit conversion.
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI009
              - CI016
