      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Impact of the 2024 Rebrand and Modality Broadening
            body: >-
              The transition from Gympass to Wellhub in May 2024 represented a fundamental pivot from a pure gym-access
              aggregator into an integrated corporate benefits platform. By bundling mindfulness (Headspace), digital
              nutrition, sleep therapy, and physical gym access into one employer-sponsored tier, Wellhub increased its
              addressable procurement budget within enterprise HR departments while driving 3-5x higher employee
              enrollment compared to single-modality wellness programs.
            calloutType: insight
            claimRefs:
              - CO002
              - CO005
              - CO006
          - type: callout
            title: Partner Economics and Secondary Valuation Fragility
            body: >-
              While Wellhub reports doubling operator payouts in 2025, independent workplace and fitness operator
              commentary reveals persistent tension regarding partner margins and pricing transparency. Furthermore,
              secondary market indicators pricing the company up to $4.2B remain unverified by primary audited funding
              rounds, creating potential valuation overhang should growth decelerate or partner churn accelerate in core
              metropolitan markets.
            calloutType: risk
            claimRefs:
              - CO014
              - CO015
              - CO016
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Spend Taxonomy, and Category Adjacencies
        blocks:
          - type: paragraph
            body: >-
              The corporate wellbeing sector has evolved from fragmented point solutions—such as localized gym
              membership stipends, subsidized corporate fitness facilities, and standalone meditation apps—into unified
              enterprise health infrastructure. Wellhub defines its addressable market boundary around employer-funded
              preventative health and employee-paid wellness subscriptions, specifically excluding clinical disease
              treatment, mandatory occupational health and safety compliance, and direct-to-consumer health club retail
              dues. Within this boundary, spend is bifurcated into annual employer platform access fees, which grant
              eligibility across the entire workforce, and tiered monthly employee-paid subscriptions that provide
              subsidized access to physical gyms, boutique studios, and digital wellness applications. The market
              directly borders enterprise health insurance carriers, third-party benefits administrators, and
              traditional health club chains, serving as a demand aggregator rather than a healthcare provider or
              facility operator.
            claimRefs:
              - CM001
              - CM006
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM008
              - CM009
              - CM010
      - number: '2.2'
        title: Market Sizing, TAM/SAM/SOM Constraints, and Revenue Realization
        blocks:
          - type: paragraph
            body: >-
              Top-down industry estimates project the global corporate wellness market to exceed $100 billion in the
              near term, propelled by escalating employer healthcare costs that approach $16,000 per employee annually
              in the United States and growing executive recognition that 70% of chronic healthcare burdens are
              preventable. However, diligence requires constraining this broad macro figure to the serviceable
              addressable market for multi-modality corporate aggregator networks. Wellhub's addressable opportunity
              spans enterprise employers seeking consolidated wellness benefit administration across 18 operating
              countries, further augmented by European consolidation following the acquisition of Urban Sports Club,
              which expanded the combined footprint to over 34,500 corporate clients and 83,000 partners. Wellhub's
              realized serviceable obtainable market reflects over 5 million active paid subscribers and approximately
              $319 million in annual run-rate revenue as of late 2025, positioning it as the scale leader among 134
              tracked corporate wellness software providers.
            claimRefs:
              - CM002
