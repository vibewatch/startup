              - CM013
      - number: '2.4'
        title: Growth Catalysts, Structural Constraints, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Market expansion is catalyzed by three principal tailwinds: enterprise benefits consolidation, the
              introduction of conversational AI coaching to personalize member navigation across 100,000 partner
              locations, and international cross-border check-ins catering to hybrid workforces. Nevertheless,
              significant adoption constraints and structural risks govern long-term market durability. Vendor surveys
              indicate that 30% of HR organizations cite high implementation costs and 30% report low employee
              engagement as primary barriers to wellness program success, while 26% struggle with impact measurement.
              Furthermore, aggregator economics require delicate equilibrium: independent industry reports highlight
              ongoing risks of partner churn, operator margin compression, and pricing friction, particularly if gyms
              perceive payout rates as dilutive or if headline employer engagement metrics rely predominantly on
              unaudited company disclosures.
            claimRefs:
              - CM003
              - CM007
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Payer Model Expands Market Capacity Beyond Direct Gym Subsidies
            body: >-
              Wellhub's dual-payer structure—combining corporate access fees with voluntary employee
              copays—fundamentally expands market reach. By onboarding 61% to 65% of subscribers who previously had no
              active gym membership, the platform delivers net-new customer acquisition to gym operators without
              cannibalizing their standard direct retail pricing.
            calloutType: insight
            claimRefs:
              - CM006
              - CM011
              - CM013
          - type: callout
            title: Aggregator Margin Squeeze and Supply-Side Partner Sensitivity
            body: >-
              While employer demand is strong, marketplace aggregators face inherent tension between corporate discount
              expectations and fitness partner retention. Industry signals highlight that operator churn, pricing
              adjustments, and localized network gaps remain ongoing risks that could destabilize subscriber retention
              if gym payout economics deteriorate.
            calloutType: risk
            claimRefs:
              - CM012
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Ways to Solve the Job
        blocks:
          - type: paragraph
            body: >-
              Wellhub competes across more than one category. Its closest access-model comparison in the assigned
              evidence is ClassPass, whose credits contrast with Wellhub's daily-check-in subscriptions. Vantage Fit
              represents a software-first engagement alternative with challenges, rewards, and a much broader claimed
              country footprint, but without subsidized physical gym access. Single-category wellness applications,
              direct gym memberships, an employer stipend, and an internal program remain substitutes even when they do
              not match the full bundle. The evidence therefore supports a landscape organized by the buyer's objective
              rather than a single peer list. Funding and reliable scale disclosures for most alternatives are absent
              from the assigned pool and are marked unknown rather than estimated.
