        title: Capability, Distribution, and Strategic Direction
        blocks:
          - type: paragraph
            body: >-
              Wellhub's current official surface describes 110,000-plus gyms and studios, 3,800 virtual trainers, and
              more than 90 wellness apps. Its January 2026 release adds a beta AI coach and cross-border check-ins,
              while a company-issued job posting shows active investment in partner marketing, network growth, and
              partner satisfaction in France and Benelux. Those signals make supply density and enterprise distribution
