      - number: '3.4'
        title: Moat Durability and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              The strongest visible moat is the combination of physical supply, employer distribution, and a broad
              wellness bundle. A software-only challenger can reproduce challenges or coaching more readily than it can
              reproduce dense local gym access; conversely, digital features and opaque corporate pricing provide weaker
              protection. The partner-marketing role also shows that network quality requires continuous local
              investment rather than operating as a passive data asset. Adverse evidence is directionally important but
              weak: CheckThat.ai reports recurring support and billing concerns and a 6.4/10 G2 support score, yet it
              does not provide the underlying review set in the fetched text. The available Reddit page is only a
              community description, not usable sentiment evidence. Partner churn, exclusivity, payout economics, and
              multi-homing therefore remain material diligence gaps.
            claimRefs:
              - CP011
              - CP014
              - CP016
