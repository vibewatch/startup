      - number: '3.3'
        title: Pricing and Packaging
        blocks:
          - type: paragraph
            body: >-
              Wellhub uses a dual-payer structure: companies pay an annual corporate fee based on team size and
              investment level, while participating employees choose and pay for monthly plans. The public employee menu
              spans eleven tiers from a free Digital plan to a $344.99 Diamond plan, but employer pricing is not
              disclosed in the assigned evidence. Wellhub's own comparison frames ClassPass as a variable-credit product
              and Wellhub as an all-inclusive daily-access subscription. Vantage Fit's comparison page claims a flat $1
              per user per month with no minimum, while describing Wellhub employer pricing as negotiated and
              unpublished. Because both comparisons are vendor-authored, they clarify packaging but do not independently
              prove realized contract cost or superior value.
