    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Operating Assumptions
      - Valuation Multiple & Logic
      - Implied Valuation
      - Downside Triggers & Risks
    rows:
      - - Bull Case (25% Prob)
        - ARR scales to $550M+; gross margin >50%; NRR >115%; AI coach drives direct monetization
        - 9.0x-10.0x EV/ARR reflecting market-leading scale and software-like gross margin profile
        - $4.95B - $5.50B
        - Enterprise wellness budget cutbacks; key gym chain defection or disintermediation
      - - Base Case (50% Prob)
        - ARR expands to $420M-$450M; gross margins remain at 35%-40%; stable 100%-105% NRR
        - 6.5x-7.5x EV/ARR aligned with hybrid marketplace and benefits administration peers
        - $2.73B - $3.38B
        - Secondary multiple compression; IPO market discounts lower-margin benefits aggregators
      - - Bear Case (25% Prob)
        - ARR decelerates to $350M; partner margin pressure intensifies; corporate client churn
        - 4.5x-5.0x EV/ARR reflecting low-margin service aggregator economics and lack of GAAP profit
        - $1.58B - $1.75B
        - Severe operator backlash; down-round financing; employee secondary liquidation overhang
