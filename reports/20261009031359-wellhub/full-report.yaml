      - number: '4.2'
        title: Pricing and Go-to-Market Proxies
        blocks:
          - type: paragraph
            body: >-
              The current official surface says Wellhub offers 11 employee plans, ranging from a zero-dollar Digital
              plan to a $344.99 monthly Diamond plan. It also claims employee plans can cost up to 50% less than direct
              memberships and carry no enrollment or cancellation fees. These are list-price and packaging claims, not
              realized revenue data. Employer pricing remains quote-based: the only public mechanism is an annual fee
              tied to team size. Nearly 40,000 corporate clients and more than 5 million subscribers indicate broad
              distribution, but neither count establishes sales efficiency. The pool contains no CAC, sales-cycle
              distribution, commission structure, pipeline conversion, logo retention, or CAC-payback disclosure. The
              relevant diligence test is whether employer fees and employee plan revenue cover acquisition expense and
              utilization-linked partner payments after discounts, rather than whether the platform can quote a large
              installed base.
            claimRefs:
              - CI001
              - CI002
              - CI003
