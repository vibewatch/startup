  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation, ICP Definitions, and Dual-Stakeholder Buying Dynamics
        blocks:
          - type: paragraph
            body: >-
              Wellhub executes a dual-stakeholder B2B2C go-to-market structure that decouples the economic enterprise
              buyer from the day-to-day consumer subscriber. At the organizational level, Wellhub's Ideal Customer
              Profile (ICP) centers on multinational enterprises, distributed large-scale employers, and mid-market
              organizations with 1,000 to over 100,000 employees seeking consolidated employee wellbeing solutions
              across diverse office and field geographies. Corporate buyers—principally Chief Human Resources Officers,
              VP Benefits leaders, and Total Rewards executives—contract annually based on eligible employee headcount
              to replace administrative burdens of point wellness solutions with a unified network. Under this
              enterprise arrangement, corporate clients subsidize platform access and achieve program deployment in
              under 30 days, while individual employees select and self-fund monthly subscription tiers that grant
              physical access to gyms, boutique studios, and digital wellness applications spanning fitness,
              mindfulness, therapy, nutrition, and sleep across 18 operating countries.


              On the supply and network side, customer adoption is fundamentally reinforced by commercial partnerships
              with fitness and wellness operators. Wellhub builds standardized 0-to-1 go-to-market playbooks and
              utilizes AI prompt engineering and Salesforce workflows to negotiate commercial deal mechanics, expand
              supply footprints across North America and Latin America, and capture net savings. Commercial account
              teams model partner yield and track traffic, conversion, and revenue per partner to maintain network
              coverage. However, the dual-stakeholder architecture introduces inherent pricing tension: corporate buyers
              demand measurable healthcare cost reduction and reduced turnover, while end-user employees evaluate
              personal subscription affordability, creating risk when platform pricing adjustments encounter subscriber
              resistance or local facility coverage gaps.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
