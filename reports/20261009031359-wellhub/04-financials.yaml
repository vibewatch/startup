chapter:
  number: 4
  title: "Financials"
  summary: "Wellhub publicly describes two payer layers—an annual employer fee and monthly employee subscriptions—while activity-based partner payouts form a material cost mechanism. Scale and engagement indicators are substantial, but revenue recognition, gross margin, retention, cash, burn, runway, and debt remain unavailable in the assigned public evidence, preventing a complete underwriting of revenue quality or capital adequacy."
sections:
  - id: "revenue-architecture"
    title: "Revenue Architecture and Recognition Limits"
    body: >-
      Wellhub publicly identifies two monetization layers. Employers pay an annual corporate fee based
      on team size, and eligible employees choose a monthly subscription plan. This creates recurring
      contract and subscription mechanisms, but the reviewed sources do not disclose the realized mix,
      average employer contract value, subscriber ARPU, discounts, refunds, or whether reported revenue
      is presented gross or net of partner payouts. The cost side is activity-linked: Wellhub says partner
      revenue is directly linked to member check-ins, while its syndicated 2026 release reported that
      2025 gross payouts nearly doubled in the United States and rose 107% globally. The architecture can
      therefore produce attractive recurring demand without necessarily producing software-like margins;
      utilization increases both engagement evidence and payout exposure. Audited recognition policies
      and payout schedules are required before assigning revenue quality or gross-profit conversion.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI007"
      - "CI009"
      - "CI016"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "pricing-and-gtm"
    title: "Pricing and Go-to-Market Proxies"
    body: >-
      The current official surface says Wellhub offers 11 employee plans, ranging from a zero-dollar
      Digital plan to a $344.99 monthly Diamond plan. It also claims employee plans can cost up to 50%
      less than direct memberships and carry no enrollment or cancellation fees. These are list-price
      and packaging claims, not realized revenue data. Employer pricing remains quote-based: the only
      public mechanism is an annual fee tied to team size. Nearly 40,000 corporate clients and more than
      5 million subscribers indicate broad distribution, but neither count establishes sales efficiency.
      The pool contains no CAC, sales-cycle distribution, commission structure, pipeline conversion,
      logo retention, or CAC-payback disclosure. The relevant diligence test is whether employer fees
      and employee plan revenue cover acquisition expense and utilization-linked partner payments after
      discounts, rather than whether the platform can quote a large installed base.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI016"
    tableRefs:
      - "TI002"
  - id: "traction-and-unit-economics"
    title: "Traction Does Not Resolve Unit Economics"
    body: >-
      Public operating indicators show scale but are not substitutes for financial statements. A
      Wellhub-issued release syndicated by Fitt Insider reported growth from 100 million check-ins in
      2022 to 1 billion in 2025. Wellhub's 2026 operator survey also found that 76% of respondents already
      partnered with a corporate wellness platform described channel revenue as new rather than shifted
      from existing members; the methodology explicitly says partner comparisons were descriptive, not
      a controlled trial. Cost pressure is visible in the same survey: 82% of 662 owners across 11
      countries said customer-acquisition costs increased in 2026. A separate 2025 Wellhub survey of
      more than 600 operators already using wellness platforms reported stronger profitability and
      retention, but that selected population cannot establish Wellhub's own margins. These data support
      network value and demand generation, not CAC, payback, contribution margin, or cohort profitability.
    claimRefs:
      - "CI008"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI016"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy and Financial Verdict"
    body: >-
      Tracxn reports $605 million of total funding across seven rounds and identifies an $85 million
      Series F dated August 23, 2023. Those historical financing amounts are not current cash, and the
      reviewed evidence supplies no cash balance, debt schedule, net burn, runway, acquisition
      consideration, or next-round trigger. Treating cumulative funding as liquidity would materially
      overstate capital adequacy. The financial case is therefore promising but not underwritable:
      two recurring payment mechanisms, large reported distribution, and rising check-ins indicate a
      credible demand engine, while activity-linked payouts and operator acquisition pressure leave the
      margin path unresolved. Before an investment decision, management should provide audited revenue
      recognition, employer and subscriber cohorts, gross-to-net payout reconciliation, CAC and payback,
      gross margin, NRR, working-capital requirements, cash, debt, burn, and a post-acquisition integration
      bridge. Until then, no precise revenue, margin, cash-burn, or runway estimate is supportable.
    claimRefs:
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
callouts:
  - calloutType: "risk"
    title: "Utilization is both traction and cost exposure"
    body: >-
      Check-in growth and rising partner payouts validate usage, but they do not reveal contribution
      margin. Operator acquisition costs and low-confidence third-party warnings about partner churn and
      pricing sensitivity make the undisclosed payout curve a central diligence item.
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI011"
      - "CI015"
      - "CI016"
