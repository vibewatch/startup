callouts:
  - calloutType: "risk"
    title: "Dual-Stakeholder Retention Vulnerability and Pricing Sensitivity"
    claimRefs:
      - "CU004"
      - "CU013"
    body: "Wellhub's dual-stakeholder model introduces compound retention vulnerabilities. Corporate clients contract annually based on eligible employee headcount, yet employee engagement determines ongoing perceived value. When Wellhub implements subscription price adjustments or experiences localized partner churn, employee resistance can degrade participation. If corporate benefit administrators observe softening participation or rising employee complaints regarding partner access, annual employer contract renewals face heightened cancellation and down-scoping risk."
  - calloutType: "insight"
    title: "Lack of Audited Net Revenue Retention and Cohort Transparency"
    claimRefs:
      - "CU009"
      - "CU014"
    body: "Despite reporting nearly 40,000 corporate clients and 5 million subscribers, Wellhub does not disclose audited Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or customer acquisition cost (CAC) payback periods. The substantial increase in corporate clients from 22,000 in late 2024 to nearly 40,000 in 2026 was accelerated by European acquisitions (Fitprime and Urban Sports Club). Private equity and growth underwriting teams cannot verify organic customer expansion versus acquired client volume without audited cohort disclosures."
