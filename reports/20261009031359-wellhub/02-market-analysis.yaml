callouts:
  - calloutType: "insight"
    title: "Dual-Payer Model Expands Market Capacity Beyond Direct Gym Subsidies"
    body: "Wellhub's dual-payer structure—combining corporate access fees with voluntary employee copays—fundamentally expands market reach. By onboarding 61% to 65% of subscribers who previously had no active gym membership, the platform delivers net-new customer acquisition to gym operators without cannibalizing their standard direct retail pricing."
    claimRefs:
      - "CM006"
      - "CM011"
      - "CM013"
  - calloutType: "risk"
    title: "Aggregator Margin Squeeze and Supply-Side Partner Sensitivity"
    body: "While employer demand is strong, marketplace aggregators face inherent tension between corporate discount expectations and fitness partner retention. Industry signals highlight that operator churn, pricing adjustments, and localized network gaps remain ongoing risks that could destabilize subscriber retention if gym payout economics deteriorate."
    claimRefs:
      - "CM012"
      - "CM015"
