      - Category
      - Public scale or funding evidence
      - Target or job
      - Differentiation signal
      - Limitation
    rows:
      - [Dream Games, "Direct subject company", "Royal Match: company claims >$3B lifetime revenue and nearly 300M downloads; no audited comparison", "Mass-market mobile puzzle players", "Two-title Royal portfolio, polish, and free access with optional Virtual Items", "No comparable retention, UA-cost, or title-level contribution data"]
      - [King, "Direct incumbent", "Unknown in assigned evidence", "Casual and match-3 players", "Named as a major rival; Dream Games hired a former King marketing executive", "No retained King first-party product, price, or scale source"]
      - [Playrix, "Direct incumbent", "Unknown in assigned evidence", "Casual and match-3 players", "Homescapes is named as a direct rivalry reference", "No retained Playrix first-party product, price, or scale source"]
      - [Zynga, "Adjacent mobile-game publisher", "Unknown in assigned evidence", "Broad mobile-game audience", "Named as a major mobile-gaming player by AskCyborg", "Single low-reputation comparison source; product overlap not quantified"]
      - ["TikTok, Netflix, YouTube, films, and social media", "Attention substitutes", "Not comparable in assigned evidence", "Leisure time and screen attention", "Different content formats can satisfy the same entertainment job", "Cross-category economics and engagement are not comparable"]
      - ["No-spend or multi-game status quo", "Status quo", "Not applicable", "Free entertainment without commitment", "Dream Games says its services may be used free of charge", "No observed switching or multi-homing data"]
      - ["Internal development or a new publisher", "Likely entrant route", "Unknown in assigned evidence", "Creation of a competing mobile title", "Digital distribution allows entry, but one analysis flags user-acquisition cost as a scale barrier", "No named entrant, launch economics, or probability estimate"]
    notes: >-
      Partial landscape using only assigned prefetched evidence as of 2026-10-03;
      company-reported scale is labeled, and unknown cells are not estimates.
    claimRefs: [CP001, CP004, CP007, CP008, CP009, CP010, CP011, CP014, CP016]
  - id: TP002
    title: Capability and trust matrix
    columns:
      - Buying or engagement criterion
      - Dream Games
      - King
      - Playrix
      - Attention substitutes
      - Evidence qualification
    rows:
      - ["Portfolio breadth", "Royal Match and Royal Kingdom", "Unknown", "Unknown", "Many formats by category", "Only Dream Games' portfolio is verified from an official source"]
      - ["Core experience", "Puzzle games with Royal characters and settings", "Unknown", "Homescapes named by a third party", "Video, social feeds, film, and streaming", "Competitor functionality is not documented in the assigned pool"]
      - ["Monetization", "Free access; optional paid Virtual Items", "Unknown", "Unknown", "Varies and is not compared", "Dream Games model is official; competitor cells are gaps"]
      - ["Advertising posture", "Company intends cost-free, ad-free service, with possible limited ad-supported tests", "Unknown", "Unknown", "Not compared", "Policy describes intent, not observed ad frequency"]
      - ["Distribution and payments", "Device and authorized marketplaces process optional-item payments", "Unknown", "Unknown", "Platform-dependent by service", "No comparative channel terms are available"]
      - ["Trust and consumer terms", "Age rules, marketplace refunds, arbitration provisions, and regional exceptions are published", "Unknown", "Unknown", "Unknown", "Publication does not establish superior compliance or customer outcomes"]
      - ["Organizational capability", "Official careers page says staff work across the full product lifecycle", "Unknown", "Unknown", "Not comparable", "A capability signal, not a productivity benchmark"]
    notes: >-
      Matrix is intentionally asymmetric because the assigned pool contains official Dream
      Games materials but no first-party King or Playrix documentation.
    claimRefs: [CP001, CP002, CP003, CP009, CP011, CP013, CP016]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Offer or competitor
      - Price or unit
      - Contract or payment model
      - Included capability
      - Unknowns
      - Competitive implication
    rows:
      - ["Dream Games base service", "Free of charge", "Consumer access under Terms of Service", "Access to puzzle games and game-related features", "Observed payer conversion and realized revenue per user", "Low entry friction supports trial and multi-homing"]
      - ["Dream Games Virtual Items", "Optional fee; no item-level list price in assigned evidence", "Marketplace-processed digital purchase", "In-game items, coins, events, or challenges", "SKU prices, discounts, refund incidence, and payer mix", "Marketplace control constrains direct payment ownership"]
      - ["Dream Games advertising", "No charge; generally no advertisements", "Possible time-bounded ad-supported testing", "Core service access", "Test frequency, eligible users, and ad revenue", "Ad-light positioning may differentiate experience but is not quantified"]
      - [King, "Unknown", "Unknown", "Unknown", "List prices, bundles, subscriptions, ads, and realized pricing", "No pricing comparison is supportable"]
      - [Playrix, "Unknown", "Unknown", "Unknown", "List prices, bundles, subscriptions, ads, and realized pricing", "No pricing comparison is supportable"]
      - ["Cross-category substitutes", "Unknown and mixed", "Advertising, subscription, transaction, or free models may apply", "Entertainment and attention", "Comparable unit and consumption basis", "Consumer alternatives can compete even without comparable packaging"]
    notes: >-
      Dream Games terms establish the model but not SKU-level prices or realized economics;
      all competitor pricing fields remain explicit diligence gaps.
    claimRefs: [CP002, CP003, CP007, CP011, CP016]
figures:
  - id: FP001
    title: Evidence-constrained competitive positioning map
    type: quadrant
    summary: >-
      Ordinal placement distinguishes direct gameplay rivals from broad attention
      substitutes and shows how much assigned evidence supports each placement.
    data:
      points:
        - label: Dream Games
          x: 5
          y: 5
          detail: "Direct match-3 subject; official portfolio and terms plus multiple third-party sources"
        - label: King
          x: 5
          y: 3
          detail: "Direct rival named by two third-party sources; no retained first-party comparison"
        - label: Playrix
          x: 5
          y: 2
          detail: "Direct rival named by one adverse analytical source; first-party evidence absent"
        - label: Zynga
          x: 4
          y: 1
          detail: "Adjacent mobile-game rival named by one low-reputation source"
        - label: Social media
          x: 1
          y: 3
          detail: "Broad attention substitute reported as part of Dream Games' competitive set"
        - label: Film and streaming
          x: 1
          y: 3
          detail: "Broad entertainment substitute, not a like-for-like product comparison"
    approximationNotes: >-
      Ordinal x scores represent proximity to the mobile-puzzle job (1 broad attention
      substitute, 5 direct puzzle rival); y scores represent assigned-evidence depth
      (1 single weak mention, 5 official plus multiple sources), not market share or quality.
    claimRefs: [CP001, CP007, CP008, CP009, CP011, CP016]
callouts:
  - calloutType: strength
    title: Visible differentiation is product-led
    body: >-
      Dream Games combines a focused Royal portfolio, free entry, optional in-game
      monetization, and an organization that says employees work across the product lifecycle.
    claimRefs: [CP001, CP002, CP003, CP013]
  - calloutType: risk
    title: Low switching friction makes the moat conditional
    body: >-
      Direct puzzle rivals and broad attention substitutes remain one tap away; no assigned
      source supplies comparative retention, acquisition cost, or multi-homing evidence.
    claimRefs: [CP009, CP010, CP011, CP016]
