callouts:
  - calloutType: "risk"
    title: "Extreme Platform Concentration and Monetization OMR Risk"
    body: "Dream Games' entire consumer business model depends on third-party mobile storefronts—principally Apple and Google—for discovery, software installation, and payment processing. Changes in platform distribution terms, fee structures, or privacy tracking directly impact customer acquisition economics."
    claimRefs:
      - "CU013"
  - calloutType: "insight"
    title: "Pure In-App Purchase Monetization Preserves Premium Player Experience"
    body: "Unlike casual gaming peers that monetize non-paying users through pervasive interstitial video ads, Dream Games offers its core games on an ad-free basis, relying exclusively on Virtual Items. This focus protects gameplay flow and brand perception, driving higher long-term player retention."
    claimRefs:
      - "CU011"
      - "CU012"
