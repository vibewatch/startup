chapter:
  number: 6
  title: "Customers"
  summary: "Dream Games engages a global mass-market consumer player base across Royal Match and Royal Kingdom, converting non-paying mobile puzzle players into in-app purchasing customers through frictionless progression and virtual coin purchases. However, revenue concentration is heavily weighted toward a tiny paying player cohort and centralized mobile app stores, while enforceable arbitration clauses and class action waivers mitigate legal exposure from monetization disputes."
sections:
  - id: "customer-segmentation-and-demographics"
    title: "Customer Segmentation and Demographic Profile"
    body: "Dream Games operates in the global mobile interactive entertainment sector, developing free-to-play match-3 puzzle titles designed for enduring casual engagement. The company's customer base is strictly business-to-consumer (B2C), consisting of mobile gamers playing on iOS, Android, and supported third-party app stores. Management explicitly positions its titles as universal entertainment designed to attract mass audiences across all regions, cultures, genders, and age groups, placing Dream Games in direct competition not only with rival mobile game publishers like King and Playrix, but also with mainstream streaming video and social media platforms for consumer leisure time. Within this broad player base, Dream Games segments users into non-paying casual players who generate network engagement and organic virality, and monetized paying players who purchase in-game Virtual Items to accelerate puzzle progression. Official terms of service restrict access to users aged 13 and older, requiring parental consent and supervision for teenaged minors aged 13 to 17, while barring children aged 12 and under entirely. Dream Games does not serve enterprise B2B clients, though third-party intelligence providers identify B2B integration points primarily across enterprise marketing technology vendors, analytics providers, and user acquisition ad networks supporting live operations."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-franchise-expansion"
    title: "Player Adoption Trajectory and Franchise Expansion"
    body: "Dream Games' player adoption trajectory began with the global launch of Royal Match in March 2021, where players solve match-3 puzzles to assist King Robert in decorating his castle. In its first eight months, Royal Match rapidly scaled into one of the most played mobile titles globally, securing millions of dedicated daily active users and consistently ranking among the top 10 highest-grossing mobile games in tier-one consumer markets including the United States and the United Kingdom. Early venture investors noted that Royal Match exceeded commercial expectations, achieving top-three grossing status in key markets within three years of release. In November 2024, Dream Games launched its second major title, Royal Kingdom, expanding the franchise IP to include King Richard, Winston, Duke, and the Dark King. Both titles drive continuous customer engagement through multi-thousand-level progression systems, live events, and team mechanics. Despite widespread player adoption and multi-billion-dollar cumulative consumer spend, Dream Games does not publicly disclose precise operational customer metrics—such as exact Daily Active Users (DAU), Monthly Active Users (MAU), average revenue per daily active user (ARPDAU), or customer acquisition costs (CAC)—leaving verified adoption disclosures limited to broad milestone announcements and app store grossing ranks."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "monetization-retention-and-concentration-risks"
    title: "Monetization Mechanics, Customer Durability, and Platform Concentration Risks"
    body: "Dream Games monetizes its consumer audience primarily through in-app purchases (IAP) of Virtual Items, specifically in-game virtual coins, extra moves, and functional puzzle boosters. Under company terms of service, games are offered on a cost-free basis without mandatory subscription fees or disruptive third-party video advertisements, although Dream Games reserves the legal right to test discrete ad-supported versions. Virtual Items convey no real-world monetary value, cannot be redeemed or traded between players, and are strictly non-refundable once purchased, except where mandated by statutory withdrawal rights in regions such as the European Economic Area. Because core gameplay is accessible without payment, paying conversion rates in casual match-3 titles are typically low single-digit percentages, concentrating financial revenue among high-spending consumer cohorts (often termed 'whales'). Furthermore, commercial transactions are entirely concentrated through centralized digital application marketplaces—principally Apple App Store, Google Play Store, Samsung Galaxy Store, Amazon, Huawei AppGallery, and Xsolla. These platform intermediaries retain ultimate control over payment processing, refund handling, distribution terms, and platform commissions. To insulate against consumer legal disputes, Dream Games enforces mandatory individual binding arbitration under the Federal Arbitration Act (FAA) administered by the American Arbitration Association (AAA) or National Arbitration and Mediation (NAM), accompanied by strict class action waivers that specifically exclude pre-existing litigation pending in US courts as of November 11, 2024."
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
