callouts:
  - calloutType: "insight"
    title: "The Ad-Free Casual Gaming Technical Moat"
    body: "Unlike typical free-to-play mobile puzzle competitors that saturate gameplay with interstitial and rewarded video advertising SDKs, Dream Games standardizes on an ad-free client runtime [CE004]. This architectural simplicity eliminates third-party ad network latency, crash vectors, and privacy tracking compliance burdens, enabling exceptional frame rates and uninterrupted puzzle flow [CE002, CE004, CE009]."
    claimRefs:
      - "CE002"
      - "CE004"
      - "CE009"
  - calloutType: "risk"
    title: "Telemetry and Live-Ops Concentration on Mobile App Stores"
    body: "Dream Games' entire distribution, client deployment, and monetization infrastructure depends on native mobile application stores managed by Apple and Google [CE004, CE010]. Changes to store platform policies, commission fee structures, or in-app purchasing mechanics represent direct technical and financial exposure that cannot be mitigated through external web distribution [CE010, CE011]."
    claimRefs:
      - "CE004"
      - "CE010"
      - "CE011"
