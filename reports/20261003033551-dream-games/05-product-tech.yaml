chapter:
  number: 5
  title: "Product & Technology"
  summary: "Dream Games operates a focused mobile gaming portfolio anchored by Royal Match and Royal Kingdom, combining match-3 puzzle mechanics with meta-progression decorating and narrative loops. The studio pairs native mobile game client engineering with a data-driven backend telemetry stack centered on Apache Kafka, AWS, Prometheus, and Looker to continuously run A/B testing and live operations without relying on in-game third-party advertising."
sections:
  - id: "portfolio-mechanics"
    title: "Game Portfolio and Core Gameplay Loop Architecture"
    body: "Dream Games delivers casual mobile entertainment organized around two commercial titles: its flagship puzzle title Royal Match and its November 2024 follow-up title Royal Kingdom [CE001, CE003]. In Royal Match, players solve sequential match-3 tile puzzles to earn stars and coins, which are immediately reinvested into castle renovation storylines featuring King Robert, Winston, and Duke [CE001, CE002]. Royal Kingdom broadens the universe into kingdom exploration, Kingdom building, and narrative combat mechanics pitting King Richard against the Dark King [CE001, CE003]. The company deliberately avoids third-party advertising in its core game downloads, creating an uninterrupted gameplay loop funded entirely through voluntary in-app purchases of virtual currency and booster items [CE004, CE005]. This focus on premium visual polish, tactile responsiveness, and rapid puzzle execution serves as the foundational user retention driver across its titles [CE002, CE006]."
    tableRefs:
      - "TE001"
  - id: "platform-telemetry"
    title: "Technology Infrastructure, Telemetry, and Live Operations"
    body: "The operating architecture supporting Dream Games relies on high-throughput data pipelines and cloud infrastructure designed to support hundreds of millions of player events in real time [CE007, CE008]. Independent technical stack profiles indicate the studio deploys Apache Kafka for high-scale event streaming, Amazon Web Services (AWS) for cloud infrastructure hosting, Prometheus for real-time systems monitoring, and Looker for business intelligence and analytics dashboards [CE007]. Product specialists, studio engineers, and game artists collaborate closely to execute structured A/B tests and statistical analyses on player progression data to refine puzzle difficulty curves and optimize live-event cadences [CE008]. On the corporate web surface, external development partners built a specialized Webflow CMS platform integrated directly with Lever applicant tracking software (ATS) to scale technical recruitment [CE009]."
    tableRefs:
      - "TE002"
    figureRefs:
      - "FE001"
  - id: "governance-compliance"
    title: "Platform Governance, Virtual Economies, and Operational Risks"
    body: "The commercial and technical sustainability of Dream Games hinges on maintaining secure, compliant virtual economies and scalable live operations across global app store platforms [CE004, CE010]. Under official Terms of Service updated in March 2026, Dream Games retains full legal ownership over all virtual items and in-game coins, granting players only a conditional, non-transferable, and revocable license for personal entertainment [CE010]. While the platform intentionally operates without in-game ads, terms reserve the capability to test discrete ad-supported distributions [CE004]. Operational and diligence risks include substantial dependency on Apple App Store and Google Play billing mechanisms, vulnerability of proprietary puzzle level design to algorithmic copycats, and private technical opacity regarding proprietary matchmaking or server-side anti-cheat infrastructure [CE011, CE012]."
    tableRefs:
      - "TE003"
