    body: "We recommend a Conditional Buy for Dream Games based on its world-class monetization metrics and proven ability to build market-dominating mobile puzzle games. However, prospective capital allocators must condition final funding on thorough review of audited financial records and covenant terms tied to the $1.25B debt package provided by Blackstone."
