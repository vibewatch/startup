company:
  name: "Dream Games"
chapter:
  number: 8
  title: "Valuation"
  summary: "Dream Games has demonstrated elite monetization and capital efficiency through Royal Match and Royal Kingdom, reaching a $2.75B Series C valuation in 2022 before initiating a $2.5B recapitalization with CVC and Blackstone in 2025 targeting a $5B valuation. While the company's operating leverage is world-class, unverified financial statements, debt overhang from private credit, and single-genre execution risk warrant a conditional buy recommendation."
sections:
  - id: "investment-thesis-and-anti-thesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "The core investment thesis for Dream Games rests on its proven ability to build global category-defining casual mobile puzzle franchises that deliver exceptional capital efficiency. Dream Games launched its debut title Royal Match in 2021 and scaled it into the global top puzzle game by revenue, outperforming legacy leaders like King's Candy Crush Saga by 35 percent in Net IAP revenue in 2024. In November 2024, the studio expanded its portfolio by launching Royal Kingdom, creating a broader Royal universe that demonstrates multi-title execution capability rather than pure one-hit-wonder dynamics. Furthermore, Dream Games has historically raised modest equity capital relative to its revenue generation, securing $468M across six funding rounds while establishing world-class user retention. However, the anti-thesis highlights critical structural vulnerabilities. Dream Games operates as a private company without publicly disclosed audited financial statements, EBITDA margins, or unit-level user acquisition metrics. The company faces high single-genre concentration in Match-3 casual puzzles and operates in an intensely competitive mobile ecosystem where platform privacy changes and player fatigue can degrade long-term franchise economics."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV008"
      - "CV011"
    tableRefs:
      - "TV002"
  - id: "capitalization-and-valuation-context"
    title: "Capitalization Structure and Transaction Context"
    body: "Dream Games was historically valued at $2.75B following its $255M Series C round in January 2022, which was led by Index Ventures alongside Makers Fund, IVP, BlackRock, Kora, and Balderton Capital. In May 2025, Dream Games announced a major strategic recapitalization with CVC Capital Partners acting as its sole equity partner, alongside debt financing provided by funds managed by Blackstone and other institutional credit lenders. Market reports indicate that the transaction was structured to raise $2.5B total, split between $1.25B in equity and $1.25B in private debt, providing liquidity for initial venture capital investors to exit while founders retained approximately 70 percent ownership at an implied enterprise valuation approaching $5B. This recapitalization materially alters Dream Games' risk profile by introducing substantial debt service obligations and changing corporate governance. Incoming investors must weigh the company's strong cash generation against potential preference overhang, debt covenants, and the lack of transparent public disclosure regarding exact equity dilution."
    claimRefs:
      - "CV001"
      - "CV006"
      - "CV007"
      - "CV009"
      - "CV010"
      - "CV012"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "scenario-modeling-and-diligence"
    title: "Scenario Analysis, Diligence Priorities, and Exit Pathways"
    body: "Evaluating Dream Games requires balancing the exceptional monetization velocity of Royal Match and Royal Kingdom against the structural opacity of private studio operations and newly added debt leverage. Under our Base Case, Royal Match sustains its category leadership while Royal Kingdom scales predictably, supporting an implied valuation range of $4.5B to $5.5B with high free cash flow generation that comfortably services debt. In the Bull Case, Royal Kingdom achieves breakout scale comparable to Royal Match and international expansion drives annualized gross bookings well above $2.0B, justifying a $6.5B to $8.0B valuation at exit. Conversely, the Bear Case models rapid multiple compression, heightened user acquisition costs, and debt service pressure resulting in a compressed valuation of $2.5B to $3.5B. Consequently, our recommendation is a price-sensitive Conditional Buy. Final investment commitment depends on securing audited financial statements confirming net margins, verifying private credit covenants with Blackstone, and confirming sustainable LTV-to-CPI ratios across both primary titles."
    claimRefs:
      - "CV003"
      - "CV008"
      - "CV009"
      - "CV012"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV003"
