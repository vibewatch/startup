        - "Royal Match maintains top-3 grossing; Royal Kingdom scales past $500M annual run-rate; operating margin exceeds 35%."
        - "$6.5B - $8.0B"
        - "Aggressive user acquisition bidding wars or major app store fee regulatory changes."
        - "25%"
      - - "Base Case"
        - "Royal Match remains stable with moderate decay; Royal Kingdom provides steady incremental revenue; debt is serviced smoothly."
        - "$4.5B - $5.5B"
        - "Moderate UA cost inflation and plateauing user engagement in tier-one Western markets."
        - "55%"
      - - "Bear Case"
        - "Rapid engagement decay in Royal Match; Royal Kingdom fails to scale; $1.25B debt creates severe liquidity and covenant pressure."
        - "$2.5B - $3.5B"
        - "Platform policy shocks, algorithmic attribution degradation, or execution failure in live operations."
        - "20%"
    notes: "Scenario valuations reflect forward revenue multiples between 2.5x and 5.0x applied to estimated gross revenue net of app store fees."
