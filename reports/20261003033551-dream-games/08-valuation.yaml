        - "Recapitalization introduces $1.25B in private debt financing from Blackstone that imposes fixed debt service burden."
        - "Negative free cash flow post debt service or covenant default under private credit agreements."
    notes: "Thesis drivers compare reported operational scale from AppMagic and industry releases against structural private studio risks."
