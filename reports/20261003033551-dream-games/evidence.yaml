evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-audits-and-ebitda
    missingEvidence: >-
      Dream Games has never disclosed audited financial statements, GAAP operating margins, EBITDA, or net income
      breakdown.
    whyItMatters: >-
      Without audited financial disclosures, investor assessments of cash flow sustainability and unit economics rely
      entirely on gross IAP estimates.
    diligencePath: >-
      Request audited financial statements, tax filings, and management accounting reports during formal data room
      diligence with CVC and company management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: pe-transaction-equity-valuation
    missingEvidence: >-
      Official purchase price, enterprise equity valuation, and debt-to-equity leverage ratios for the May 2025 CVC
      transaction remain confidential.
    whyItMatters: >-
      Secondary estimates of $5.0B enterprise valuation cannot be confirmed without disclosed transaction documentation
      or cap table confirmation.
    diligencePath: >-
      Review definitive purchase agreement, Blackstone credit facility terms, and post-closing cap table in investor
      data room.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited annual financial statements disclosing exact net revenue, EBITDA margins, and platform fee deductions for
      Dream Games.
    whyItMatters: >-
      External third-party platforms report an expansive revenue estimate band ($1B-$10B) which limits precise financial
      benchmarking.
    diligencePath: >-
      Request confidential audited financials, management accounts, and platform reconciliation statements during formal
      data room diligence.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: user-acquisition-economics
    missingEvidence: Granular cost-per-install (CPI), customer acquisition cost (CAC), and organic-to-paid player ratio data.
    whyItMatters: >-
      Rising post-IDFA user acquisition expenses directly dictate net marketing payback periods and unit-level return on
      ad spend.
    diligencePath: Conduct cohort analysis on historical marketing spend by channel and inspect blended versus paid LTV curves.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: material
    topic: competitor-profiles
    missingEvidence: >-
      Current first-party and independent scale, funding, audience, product-roadmap, and strategic-direction evidence
      for King, Playrix, Zynga, and likely entrants.
    whyItMatters: >-
      Without comparable denominators, the landscape cannot establish relative market position or whether Dream Games is
      gaining ground.
    diligencePath: >-
      Obtain current publisher filings or owner disclosures, app-intelligence extracts, official product documentation,
      and consistent download and revenue estimates.
    relatedQuestionRefs:
      - QP002
      - QP009
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: >-
      SKU-level prices, realized payer spend, discounts, payer conversion, retention cohorts, acquisition cost, and
      contribution margin on a consistent title and period basis.
    whyItMatters: >-
      Free entry and optional purchases do not establish monetization quality or an acquisition advantage relative to
      direct rivals.
    diligencePath: >-
      Request title-level cohort exports, marketplace price books, UA spend by channel, payer segmentation, and
      reconciliations to management accounts.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: alternative-landscape
    missingEvidence: >-
      A complete current roster of direct puzzle publishers, emerging titles, regional competitors, and cross-category
      attention substitutes.
    whyItMatters: >-
      The retained set is representative rather than exhaustive and may omit a fast-growing entrant or region-specific
      threat.
    diligencePath: >-
      Commission a current genre-level app-store and audience-overlap screen using one consistent geography, platform,
      and trailing-period definition.
    relatedQuestionRefs:
      - QP001
      - QP009
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: trust-and-regulatory-comparison
    missingEvidence: >-
      Comparable competitor consumer terms, enforcement history, platform-policy exposure, refund outcomes, and
      child-safety controls.
    whyItMatters: >-
      Dream Games' published terms alone cannot establish superior trust or lower regulatory risk than competing
      services.
    diligencePath: >-
      Review current rival terms, regulator records, platform enforcement notices, and customer-support outcome data
      with counsel.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited income statements, cash-flow statements, balance sheets, title-level net revenue, gross margin, EBITDA,
      cash, burn, and runway.
    whyItMatters: >-
      Third-party player-spend estimates cannot establish profitability, liquidity, or the conversion of gross billings
      into cash.
    diligencePath: >-
      Obtain audited financials, monthly management accounts, bank statements, store settlement reports, and a bridge
      from gross billings to net revenue.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      CPI, CAC, ROAS, payer conversion, cohort retention, LTV, payback, platform commissions, refunds, and title-level
      contribution margin.
    whyItMatters: Revenue scale can coexist with weak cash economics when acquisition and platform costs are high.
    diligencePath: >-
      Review monthly cohort files by channel, geography, title, and acquisition vintage and reconcile them to
      marketplace cash receipts.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: debt-obligations
    missingEvidence: >-
      Debt principal, lender allocation, interest rate, maturity, amortization, covenants, security, restricted cash,
      and permitted distributions.
    whyItMatters: >-
      The disclosed leveraged transaction may create fixed claims on cash flow and limit reinvestment even if gross
      player spend remains strong.
    diligencePath: >-
      Obtain executed credit agreements, covenant compliance certificates, closing funds flow, current debt schedule,
      and downside covenant model.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: revenue-estimates
    missingEvidence: >-
      A common definition and measurement date reconciling Udonis and InvestGame title-level revenue estimates with
      Dream Games' accounting records.
    whyItMatters: >-
      Differing dates and gross-versus-net conventions can materially change growth, concentration, and valuation
      conclusions.
    diligencePath: >-
      Reconcile App Store and Google Play statements, third-party estimates, refunds, taxes, and platform fees to
      audited title-level revenue.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: client-architecture
    missingEvidence: >-
      Technical documentation covering the internal mobile game engine architecture, rendering pipeline, and native
      mobile framework details
    whyItMatters: >-
      Determines whether Dream Games maintains proprietary client-side IP or relies standard commercial game development
      engines like Unity or Unreal
    diligencePath: Request architecture design records and source code licenses during technical management diligence
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
