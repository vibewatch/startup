    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: user-metrics
    missingEvidence: >-
      Audited operational player statistics including exact Daily Active Users (DAU), Monthly Active Users (MAU),
      average revenue per daily active user (ARPDAU), and paying user conversion rate.
    whyItMatters: >-
      Without exact DAU and conversion data, diligence cannot independently measure player churn, cohort retention
      curves, or reliance on extreme paying whale players.
    diligencePath: >-
      Request private cohort analysis, retention telemetry (Day 1, Day 7, Day 30), and paying conversion curves from
      management data room.
  - type: missing-source
    severity: minor
    topic: marketing-economics
    missingEvidence: >-
      Exact customer acquisition costs (CAC), blended cost-per-install (CPI), and organic download ratios across key
      geographical markets.
    whyItMatters: >-
      Understanding user acquisition unit economics is critical to evaluating the durability and capital efficiency of
      Royal Match and Royal Kingdom growth.
    diligencePath: Obtain marketing performance reports, ad network attribution spend by platform, and payback period schedules.
  - type: stale
    severity: material
    topic: transaction-status
    missingEvidence: >-
      Current confirmation of whether the CVC transaction closed, together with the resulting ownership, board rights,
      debt quantum, pricing, maturity, and covenants.
    whyItMatters: >-
      The capital structure and sponsor-control profile cannot be underwritten from an announcement that described a
      future, approval-dependent closing.
    diligencePath: >-
      Obtain executed closing documents, current cap table, credit agreements, covenant certificates, and legal
      confirmation from the company and transaction counsel.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR001
      - TR003
  - type: private-evidence-only
    severity: material
    topic: user-acquisition-economics
    missingEvidence: >-
      Current CPI, payer conversion, title- and country-level LTV, cohort retention, organic acquisition share, marginal
      ROAS, and cash payback.
    whyItMatters: A historical plan to scale acquisition does not establish that current paid growth is efficient or financeable.
    diligencePath: >-
      Review monthly acquisition cohorts and reconcile channel invoices, attributed installs, payer revenue, refunds,
      and contribution margin to finance records.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal-risk-register
    missingEvidence: >-
      Independent regulator, court, consumer-complaint, app-store enforcement, and security-incident records across the
      jurisdictions where the games operate.
    whyItMatters: >-
      Company policies describe intended controls but do not establish whether incidents, investigations, claims, or
      enforcement actions occurred.
    diligencePath: >-
      Commission jurisdiction-specific legal searches, regulator checks, app-store account review, complaint analysis,
      and a security-incident representation from management.
    relatedTableRefs:
