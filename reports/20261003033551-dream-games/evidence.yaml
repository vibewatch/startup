    keyQuote: >-
      Dream Games, the developer and publisher of globally renowned mobile games Royal Match and Royal Kingdom, today
      announced a strategic investment from CVC, a leading global alternative asset management firm, as its sole equity
      partner. The transaction will provide liquidity to Dream Games' initial venture capital partners who will exit
      after over five years, and initiates a strategic partnership with CVC as its new equity partner to help further
      accelerate the Company’s continued global leadership in mobile games. Funds managed by Blackstone, and other
      investors will provide debt financing as part of the transaction.
