      - number: '1.2'
        title: Executive Leadership, Key-Person Dependence, and Governance
        blocks:
          - type: paragraph
            body: >-
              Dream Games is steered by co-founder and Chief Executive Officer Soner Aydemir, who maintains direct
              operational oversight over game design, studio culture, and product roadmaps. To support transatlantic
              commercial expansion and international talent acquisition following the rapid growth of Royal Match, the
              company recruited former King Global Head of Marketing Richard Hocking as Chief Marketing Officer and
              seasoned human resources leader Anju Sethi (formerly of King and Google) as Chief People Officer in March
              2023, both based in London. While the founding cohort provides exceptional domain expertise in casual
              puzzle architecture, Dream Games displays material key-person dependency on Aydemir and the core founding
              cadre. Governance and board dynamics have historically been anchored by venture capital sponsors including
              Index Ventures partner Stephane Kurgan, alongside Balderton Capital and Makers Fund.
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO008
              - CO009
