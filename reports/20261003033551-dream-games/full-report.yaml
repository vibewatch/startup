      - number: '3.3'
        title: Distribution power, switching, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Distribution is simultaneously broad and intermediated. Dream Games' terms name Apple, Google, Samsung,
              Amazon, Huawei, and Xsolla processes and state that paid Virtual Items are processed by the relevant
              marketplace. This provides reach but leaves payment and refund touchpoints partly controlled by platforms.
              A low-reputation analytical source characterizes player switching costs as zero because free-to-play
              alternatives are plentiful; that directional conclusion is plausible, but the assigned pool contains no
              observed churn or multi-homing study. Dream Games has also recruited senior talent from King, illustrating
              that specialist marketing and people capabilities can move between competitors rather than remaining
              permanently locked in.
            claimRefs:
              - CP003
              - CP010
              - CP012
              - CP014
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The strongest public moat case combines Royal intellectual property, product polish, a repeatable
              development organization, and capital for additional titles. CVC says the strategy is to expand the Royal
              universe and develop new games, while Financier Worldwide relays the company's claim of more than $3
              billion in Royal Match lifetime revenue from nearly 300 million downloads. Neither statement establishes
              durable retention or economical acquisition. The adverse case is sharper: Playrix and King compete for the
              same puzzle audience, cross-category services compete for time, and low switching friction limits lock-in.
              Underwriting should therefore treat the moat as execution- and distribution-dependent until cohort,
              acquisition-cost, and title-level contribution evidence is supplied.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP009
              - CP010
