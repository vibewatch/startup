      - number: '3.2'
        title: Product, capability, and monetization comparison
        blocks:
          - type: paragraph
            body: >-
              Dream Games' official surface shows a two-title Royal portfolio: Royal Match and Royal Kingdom. Its terms
              describe free access, generally without advertising, alongside optional paid Virtual Items distributed
              through device or authorized marketplaces. That is a clear product and packaging proposition, but it is
              not a price benchmark: no assigned source discloses item-level list prices, realized spend, payer
              conversion, retention, or comparable competitor packages. Third-party sources attribute Dream Games'
              position to quality and user experience, while the company emphasizes end-to-end product ownership. Those
              signals support a capability thesis, not proof that the advantage produces superior unit economics.
