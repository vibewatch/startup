  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Analytical Lens
      - Core Thesis Argument
      - Anti-Thesis Risk
      - Pivot Condition and Thesis-Break Trigger
    rows:
      - - Market Dominance
        - >-
          Royal Match outperformed Candy Crush Saga by 35% in Net IAP revenue in 2024, demonstrating industry-leading
          monetization.
        - >-
          Mobile casual puzzle genre is saturated and dependent on paid user acquisition channels vulnerable to platform
          privacy shifts.
        - Sustained sequential monthly decline in active player base or 25% drop in top-grossing rank.
      - - Portfolio Diversification
        - >-
          Royal Kingdom soft launched in 2023 and globally rolled out in Nov 2024, proving multi-title franchise
          expansion.
        - Second title may cannibalize Royal Match audience rather than generating genuinely incremental paying users.
        - Failure of Royal Kingdom to reach top-50 grossing status within 12 months post-global launch.
      - - Capital Efficiency
        - >-
          Raised only $468M total equity to achieve multibillion-dollar cumulative gross revenue across millions of
          active players.
        - >-
          Recapitalization introduces $1.25B in private debt financing from Blackstone that imposes fixed debt service
          burden.
        - Negative free cash flow post debt service or covenant default under private credit agreements.
    notes: >-
      Thesis drivers compare reported operational scale from AppMagic and industry releases against structural private
      studio risks.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV008
      - CV009
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Operating Scenario
      - Key Operational Assumptions
      - Implied Valuation Range
      - Downside Triggers and Risk Signals
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Royal Match maintains top-3 grossing; Royal Kingdom scales past $500M annual run-rate; operating margin
          exceeds 35%.
        - $6.5B - $8.0B
        - Aggressive user acquisition bidding wars or major app store fee regulatory changes.
        - 25%
      - - Base Case
        - >-
          Royal Match remains stable with moderate decay; Royal Kingdom provides steady incremental revenue; debt is
          serviced smoothly.
        - $4.5B - $5.5B
        - Moderate UA cost inflation and plateauing user engagement in tier-one Western markets.
        - 55%
      - - Bear Case
        - >-
          Rapid engagement decay in Royal Match; Royal Kingdom fails to scale; $1.25B debt creates severe liquidity and
          covenant pressure.
        - $2.5B - $3.5B
        - Platform policy shocks, algorithmic attribution degradation, or execution failure in live operations.
        - 20%
    notes: >-
      Scenario valuations reflect forward revenue multiples between 2.5x and 5.0x applied to estimated gross revenue net
      of app store fees.
    claimRefs:
      - CV003
      - CV008
      - CV009
      - CV012
      - CV014
figures:
  - id: FO001
    title: Dream Games Corporate and Commercial Milestones
    type: timeline
    summary: >-
      Key corporate, financing, product launch, and organizational milestones from founding in 2019 through sponsor
      transition in 2025.
    data:
      items:
        - label: '2019-12-15: Company Founding in Istanbul'
          detail: >-
            Five ex-Peak Games executives establish Dream Games with a focus on engineering excellence and
            Pixar-inspired craft.
          tone: positive
        - label: '2021-03-01: Global Launch of Royal Match'
          detail: >-
            Dream Games launches its debut casual puzzle title globally, quickly entering top-grossing charts across the
            US and UK.
          tone: positive
        - label: '2021-06-30: Series B Unicorn Valuation ($1.0B)'
          detail: >-
            Secures $155M Series B funding led by Index Ventures, attaining unicorn status within three months of global
            launch.
          tone: positive
        - label: '2022-01-19: Series C Mega-Round ($2.75B Valuation)'
          detail: Raises $255M in Series C financing led by Index Ventures, doubling valuation in six months to reach $2.75B.
          tone: positive
        - label: '2023-03-20: International Expansion to London'
          detail: Opens first overseas corporate office in central London and hires CMO Richard Hocking and CPO Anju Sethi.
          tone: neutral
        - label: '2024-11-01: Global Launch of Royal Kingdom'
          detail: Releases second franchise title expanding the Royal universe with King Richard and the Dark King narrative.
          tone: positive
        - label: '2025-01-22: Secondary Platform Profiling (Forge Global)'
          detail: >-
            Pre-IPO profile cataloged on Forge Global secondary marketplace, noting limited liquidity and undisclosed
            valuation.
          tone: neutral
        - label: '2025-05-01: Strategic Buyout Investment by CVC & Blackstone'
          detail: >-
            Announces strategic buyout investment by CVC as sole equity partner with Blackstone debt financing, enabling
            venture exit.
          tone: positive
    approximationNotes: Milestone dates derived from corporate announcements and press releases. CVC closing date scheduled for Q3 2025.
