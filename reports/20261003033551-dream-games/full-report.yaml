chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding Roots, and Global Footprint
        blocks:
          - type: paragraph
            body: >-
              Dream Games (legally Dream Games Dijital Teknolojiler A.Ş.) was founded in Istanbul, Turkey in 2019 by
              five mobile gaming industry veterans: Soner Aydemir (CEO), Ikbal Namli, Hakan Saglam, Eren Sengul, and
              Serdar Yilmaz. The founding team emerged from Peak Games with a focused philosophy to combine engineering
              rigor and artistic craftsmanship in casual mobile gaming, explicitly modeling their iterative studio
              approach on Pixar's animation philosophy. Headquartered in the Torun Center in Istanbul's Şişli district,
              Dream Games expanded its international footprint in March 2023 by opening its first overseas corporate
              office in central London, UK, positioning senior marketing and people leadership close to global talent
              and creative partners.
            claimRefs:
