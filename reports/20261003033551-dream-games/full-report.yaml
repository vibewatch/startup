      - number: '5.3'
        title: Platform Governance, Virtual Economies, and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              The commercial and technical sustainability of Dream Games hinges on maintaining secure, compliant virtual
              economies and scalable live operations across global app store platforms [CE004, CE010]. Under official
              Terms of Service updated in March 2026, Dream Games retains full legal ownership over all virtual items
              and in-game coins, granting players only a conditional, non-transferable, and revocable license for
              personal entertainment [CE010]. While the platform intentionally operates without in-game ads, terms
              reserve the capability to test discrete ad-supported distributions [CE004]. Operational and diligence
              risks include substantial dependency on Apple App Store and Google Play billing mechanisms, vulnerability
              of proprietary puzzle level design to algorithmic copycats, and private technical opacity regarding
              proprietary matchmaking or server-side anti-cheat infrastructure [CE011, CE012].
            claimRefs: []
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE008
              - CE011
              - CE012
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Ad-Free Casual Gaming Technical Moat
            body: >-
              Unlike typical free-to-play mobile puzzle competitors that saturate gameplay with interstitial and
              rewarded video advertising SDKs, Dream Games standardizes on an ad-free client runtime [CE004]. This
              architectural simplicity eliminates third-party ad network latency, crash vectors, and privacy tracking
              compliance burdens, enabling exceptional frame rates and uninterrupted puzzle flow [CE002, CE004, CE009].
            calloutType: insight
            claimRefs:
              - CE002
              - CE004
              - CE009
          - type: callout
            title: Telemetry and Live-Ops Concentration on Mobile App Stores
            body: >-
              Dream Games' entire distribution, client deployment, and monetization infrastructure depends on native
              mobile application stores managed by Apple and Google [CE004, CE010]. Changes to store platform policies,
              commission fee structures, or in-app purchasing mechanics represent direct technical and financial
              exposure that cannot be mitigated through external web distribution [CE010, CE011].
            calloutType: risk
            claimRefs:
              - CE004
              - CE010
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Demographic Profile
        blocks:
          - type: paragraph
            body: >-
              Dream Games operates in the global mobile interactive entertainment sector, developing free-to-play
              match-3 puzzle titles designed for enduring casual engagement. The company's customer base is strictly
              business-to-consumer (B2C), consisting of mobile gamers playing on iOS, Android, and supported third-party
              app stores. Management explicitly positions its titles as universal entertainment designed to attract mass
              audiences across all regions, cultures, genders, and age groups, placing Dream Games in direct competition
              not only with rival mobile game publishers like King and Playrix, but also with mainstream streaming video
              and social media platforms for consumer leisure time. Within this broad player base, Dream Games segments
              users into non-paying casual players who generate network engagement and organic virality, and monetized
              paying players who purchase in-game Virtual Items to accelerate puzzle progression. Official terms of
              service restrict access to users aged 13 and older, requiring parental consent and supervision for
              teenaged minors aged 13 to 17, while barring children aged 12 and under entirely. Dream Games does not
              serve enterprise B2B clients, though third-party intelligence providers identify B2B integration points
              primarily across enterprise marketing technology vendors, analytics providers, and user acquisition ad
              networks supporting live operations.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU011
              - CU012
              - CU013
      - number: '6.2'
        title: Player Adoption Trajectory and Franchise Expansion
        blocks:
          - type: paragraph
            body: >-
              Dream Games' player adoption trajectory began with the global launch of Royal Match in March 2021, where
              players solve match-3 puzzles to assist King Robert in decorating his castle. In its first eight months,
              Royal Match rapidly scaled into one of the most played mobile titles globally, securing millions of
              dedicated daily active users and consistently ranking among the top 10 highest-grossing mobile games in
              tier-one consumer markets including the United States and the United Kingdom. Early venture investors
              noted that Royal Match exceeded commercial expectations, achieving top-three grossing status in key
              markets within three years of release. In November 2024, Dream Games launched its second major title,
              Royal Kingdom, expanding the franchise IP to include King Richard, Winston, Duke, and the Dark King. Both
              titles drive continuous customer engagement through multi-thousand-level progression systems, live events,
              and team mechanics. Despite widespread player adoption and multi-billion-dollar cumulative consumer spend,
              Dream Games does not publicly disclose precise operational customer metrics—such as exact Daily Active
              Users (DAU), Monthly Active Users (MAU), average revenue per daily active user (ARPDAU), or customer
              acquisition costs (CAC)—leaving verified adoption disclosures limited to broad milestone announcements and
              app store grossing ranks.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU011
              - CU012
      - number: '6.3'
        title: Monetization Mechanics, Customer Durability, and Platform Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Dream Games monetizes its consumer audience primarily through in-app purchases (IAP) of Virtual Items,
              specifically in-game virtual coins, extra moves, and functional puzzle boosters. Under company terms of
              service, games are offered on a cost-free basis without mandatory subscription fees or disruptive
              third-party video advertisements, although Dream Games reserves the legal right to test discrete
              ad-supported versions. Virtual Items convey no real-world monetary value, cannot be redeemed or traded
              between players, and are strictly non-refundable once purchased, except where mandated by statutory
              withdrawal rights in regions such as the European Economic Area. Because core gameplay is accessible
              without payment, paying conversion rates in casual match-3 titles are typically low single-digit
              percentages, concentrating financial revenue among high-spending consumer cohorts (often termed 'whales').
              Furthermore, commercial transactions are entirely concentrated through centralized digital application
              marketplaces—principally Apple App Store, Google Play Store, Samsung Galaxy Store, Amazon, Huawei
              AppGallery, and Xsolla. These platform intermediaries retain ultimate control over payment processing,
              refund handling, distribution terms, and platform commissions. To insulate against consumer legal
              disputes, Dream Games enforces mandatory individual binding arbitration under the Federal Arbitration Act
              (FAA) administered by the American Arbitration Association (AAA) or National Arbitration and Mediation
              (NAM), accompanied by strict class action waivers that specifically exclude pre-existing litigation
              pending in US courts as of November 11, 2024.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
              - CU010
              - CU013
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Extreme Platform Concentration and Monetization OMR Risk
            body: >-
              Dream Games' entire consumer business model depends on third-party mobile storefronts—principally Apple
              and Google—for discovery, software installation, and payment processing. Changes in platform distribution
              terms, fee structures, or privacy tracking directly impact customer acquisition economics.
            calloutType: risk
            claimRefs:
              - CU013
          - type: callout
            title: Pure In-App Purchase Monetization Preserves Premium Player Experience
            body: >-
              Unlike casual gaming peers that monetize non-paying users through pervasive interstitial video ads, Dream
              Games offers its core games on an ad-free basis, relying exclusively on Virtual Items. This focus protects
              gameplay flow and brand perception, driving higher long-term player retention.
            calloutType: insight
            claimRefs:
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Ranking and Decision Frame
        blocks:
          - type: paragraph
            body: >-
              The leading exposure is execution concentration: Dream Games' own catalog lists Royal Match and Royal
              Kingdom, while CVC calls Royal Kingdom the company's second mobile game and describes Royal Match as the
              global number-one puzzle game by revenue. That evidence supports a high-impact portfolio-concentration
              risk, but it does not quantify revenue split, title-level profitability, or durability. The next tier
              combines privacy and minor-protection obligations with marketplace, ad-tech, cloud, sponsor, and debt
              dependencies. Likelihood labels below are analyst assessments of exposure, not observed incident rates.
              The investment case should remain conditional until management supplies title-level economics,
              operational-control evidence, current financing documents, and independent legal and security checks.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR016
