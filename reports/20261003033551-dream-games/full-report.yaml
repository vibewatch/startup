  - id: TR003
    title: Partner / Dependency Risk Register
    columns:
      - Dependency
      - Counterparty
      - Role
      - Concentration Evidence
      - Failure Scenario
      - Severity
      - Mitigation / Monitor
      - Residual Exposure
    rows:
      - - Marketplace payment and refund interfaces
        - Apple, Google, Samsung, Amazon, Huawei, and Xsolla
        - Purchase-withdrawal and refund workflow
        - Multiple named providers, but provider shares are not disclosed
        - Policy change, account restriction, or refund friction impairs monetization or customer trust
        - High
        - Track revenue mix, store status, rejection notices, refund rate, and chargebacks by provider
        - Diversification cannot be assessed without platform-level revenue and acquisition data
      - - Equity sponsorship and debt financing
        - CVC; Blackstone-managed funds and other debt investors
        - Sole equity partnership and transaction debt
        - CVC described itself as the new sole equity partner
        - Covenants, debt service, or sponsor priorities constrain investment in product and acquisition
        - High
        - Confirm closing; review debt schedule, covenants, liquidity, preferences, and board rights
        - Announcement omits debt quantum, pricing, maturity, covenants, and current completion status
      - - Advertising and service-provider data processing
        - Unnamed service providers and AdTech providers
        - IT, support, analytics, advertising, attribution, and market research
        - Provider list and spend concentration are not disclosed
        - Provider failure or noncompliance interrupts services or creates privacy liability
        - High
        - Review vendor inventory, subprocessors, audit rights, business-continuity tests, and exit plans
        - Company controls do not establish independent provider-control effectiveness
      - - Paid user-acquisition execution
        - Advertising platforms and internal acquisition team
        - Scale and geographic expansion
        - A third-party article reports the $155 million Series B was intended to scale acquisition in Asia
        - Rising acquisition cost or weak payback compresses title economics
        - High
        - Track CPI, payer conversion, cohort LTV, payback, organic share, and marginal ROAS by title and country
        - Current spend, channel mix, LTV, CPI, and payback are absent from the assigned evidence
    notes: >-
      Rows identify dependencies supported by the assigned sources, not measured concentration percentages. Severity is
      an analyst assessment; platform shares, vendor contracts, financing terms, and acquisition economics remain
      diligence gaps.
    claimRefs:
      - CR005
      - CR007
      - CR010
      - CR011
      - CR012
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision Parameter
      - Assessment Stance
      - Supporting Evidence and Strategic Implication
    rows:
      - - Recommendation
        - Conditional Buy
        - >-
          Contingent on confirming positive net operating cash flow, sustainable user acquisition ROI, and manageable
          debt covenants under the CVC recapitalization.
      - - Confidence
        - Medium
        - >-
