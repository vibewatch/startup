  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Game Portfolio and Core Gameplay Loop Architecture
        blocks:
          - type: paragraph
            body: >-
              Dream Games delivers casual mobile entertainment organized around two commercial titles: its flagship
              puzzle title Royal Match and its November 2024 follow-up title Royal Kingdom [CE001, CE003]. In Royal
              Match, players solve sequential match-3 tile puzzles to earn stars and coins, which are immediately
              reinvested into castle renovation storylines featuring King Robert, Winston, and Duke [CE001, CE002].
              Royal Kingdom broadens the universe into kingdom exploration, Kingdom building, and narrative combat
              mechanics pitting King Richard against the Dark King [CE001, CE003]. The company deliberately avoids
              third-party advertising in its core game downloads, creating an uninterrupted gameplay loop funded
              entirely through voluntary in-app purchases of virtual currency and booster items [CE004, CE005]. This
              focus on premium visual polish, tactile responsiveness, and rapid puzzle execution serves as the
              foundational user retention driver across its titles [CE002, CE006].
            claimRefs: []
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE009
              - CE010
      - number: '5.2'
        title: Technology Infrastructure, Telemetry, and Live Operations
        blocks:
          - type: paragraph
            body: >-
              The operating architecture supporting Dream Games relies on high-throughput data pipelines and cloud
              infrastructure designed to support hundreds of millions of player events in real time [CE007, CE008].
              Independent technical stack profiles indicate the studio deploys Apache Kafka for high-scale event
              streaming, Amazon Web Services (AWS) for cloud infrastructure hosting, Prometheus for real-time systems
              monitoring, and Looker for business intelligence and analytics dashboards [CE007]. Product specialists,
              studio engineers, and game artists collaborate closely to execute structured A/B tests and statistical
              analyses on player progression data to refine puzzle difficulty curves and optimize live-event cadences
              [CE008]. On the corporate web surface, external development partners built a specialized Webflow CMS
              platform integrated directly with Lever applicant tracking software (ATS) to scale technical recruitment
              [CE009].
            claimRefs: []
          - type: table
            tableRef: TE002
            claimRefs:
