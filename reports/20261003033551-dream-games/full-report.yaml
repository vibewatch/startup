      - - Exit Timeline
        - 3 to 5 Years
        - >-
          Expected realization via public equity listing or strategic sale to major entertainment conglomerate following
          CVC transaction closing.
    notes: >-
      Assessment parameters synthesize verified funding milestones, public market gaming transaction multiples, and
      reported recapitalization details.
