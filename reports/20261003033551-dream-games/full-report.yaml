              - CR010
              - CR011
              - CR012
      - number: '7.3'
        title: Operational, Security, and Talent Exposure
        blocks:
          - type: paragraph
            body: >-
              Public evidence identifies components rather than control performance. LeadIQ lists Amazon Web Services,
              Apache Kafka, Prometheus, and Looker in the technology stack, but the assigned pool provides no
              architecture, redundancy, recovery-time, incident, or service-level data. Dream Games' security policy
              names firewalls, encryption, internal protocols, and processor agreements, while expressly withholding any
              guarantee of complete security. Human-capital evidence is similarly directional: Clay identifies
              co-founder Soner Aydemir as chief executive, and the careers page says employees participate across the
              full development lifecycle. Those facts justify diligence on key-person, specialist retention, segregation
              of duties, and disaster recovery, but not claims that a single cloud region, named executive, or specific
              system is a proven point of failure.
            claimRefs:
              - CR008
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR008
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Platform, Capital, and Growth Dependencies
        blocks:
          - type: paragraph
            body: >-
              The operating model has several external choke points. Dream Games' terms direct purchase-withdrawal or
              refund activity through Apple, Google, Samsung, Amazon, Huawei, and Xsolla interfaces, and its privacy
              policy describes reliance on service and ad-tech providers. Separately, CVC announced itself as the new
              sole equity partner, with Blackstone-managed funds and other investors providing debt financing; the
              announcement said closing remained subject to customary approvals and was expected in the third quarter of
              2025. The assigned pool does not confirm the later closing status or disclose debt quantum and covenants.
              ERAI Turkey also reports that a prior $155 million round was intended to scale user acquisition in Asia,
              making current acquisition efficiency, platform mix, and payback a central unresolved underwriting issue.
            claimRefs:
              - CR005
              - CR007
              - CR010
              - CR011
              - CR012
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR007
              - CR010
              - CR011
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No recorded incident in this pool is not proof of no incident
            body: >-
              The assigned evidence includes company policies and commercial profiles, not a complete regulator, court,
              security-incident, or app-store enforcement record. Legal and security diligence should therefore test the
              gap directly rather than treating source silence as a clean history.
            calloutType: risk
            claimRefs:
              - CR008
          - type: callout
            title: Monitorable thesis-break triggers
            body: >-
              Pause or reprice the investment if diligence reveals unresolved transaction completion, restrictive debt
              covenants, material privacy or minor-safety failures, app-store access restrictions, repeated
              service-recovery misses, or title-level economics showing that Royal Kingdom cannot reduce Royal Match
              dependence.
            calloutType: recommendation
            claimRefs:
              - CR004
              - CR011
              - CR012
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Dream Games rests on its proven ability to build global category-defining
              casual mobile puzzle franchises that deliver exceptional capital efficiency. Dream Games launched its
              debut title Royal Match in 2021 and scaled it into the global top puzzle game by revenue, outperforming
              legacy leaders like King's Candy Crush Saga by 35 percent in Net IAP revenue in 2024. In November 2024,
              the studio expanded its portfolio by launching Royal Kingdom, creating a broader Royal universe that
              demonstrates multi-title execution capability rather than pure one-hit-wonder dynamics. Furthermore, Dream
              Games has historically raised modest equity capital relative to its revenue generation, securing $468M
              across six funding rounds while establishing world-class user retention. However, the anti-thesis
              highlights critical structural vulnerabilities. Dream Games operates as a private company without publicly
              disclosed audited financial statements, EBITDA margins, or unit-level user acquisition metrics. The
              company faces high single-genre concentration in Match-3 casual puzzles and operates in an intensely
              competitive mobile ecosystem where platform privacy changes and player fatigue can degrade long-term
              franchise economics.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
      - number: '8.2'
        title: Capitalization Structure and Transaction Context
        blocks:
          - type: paragraph
            body: >-
              Dream Games was historically valued at $2.75B following its $255M Series C round in January 2022, which
              was led by Index Ventures alongside Makers Fund, IVP, BlackRock, Kora, and Balderton Capital. In May 2025,
              Dream Games announced a major strategic recapitalization with CVC Capital Partners acting as its sole
              equity partner, alongside debt financing provided by funds managed by Blackstone and other institutional
              credit lenders. Market reports indicate that the transaction was structured to raise $2.5B total, split
              between $1.25B in equity and $1.25B in private debt, providing liquidity for initial venture capital
              investors to exit while founders retained approximately 70 percent ownership at an implied enterprise
              valuation approaching $5B. This recapitalization materially alters Dream Games' risk profile by
              introducing substantial debt service obligations and changing corporate governance. Incoming investors
              must weigh the company's strong cash generation against potential preference overhang, debt covenants, and
              the lack of transparent public disclosure regarding exact equity dilution.
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV012
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV009
              - CV010
              - CV015
      - number: '8.3'
        title: Scenario Analysis, Diligence Priorities, and Exit Pathways
        blocks:
          - type: paragraph
            body: >-
              Evaluating Dream Games requires balancing the exceptional monetization velocity of Royal Match and Royal
              Kingdom against the structural opacity of private studio operations and newly added debt leverage. Under
              our Base Case, Royal Match sustains its category leadership while Royal Kingdom scales predictably,
              supporting an implied valuation range of $4.5B to $5.5B with high free cash flow generation that
              comfortably services debt. In the Bull Case, Royal Kingdom achieves breakout scale comparable to Royal
              Match and international expansion drives annualized gross bookings well above $2.0B, justifying a $6.5B to
              $8.0B valuation at exit. Conversely, the Bear Case models rapid multiple compression, heightened user
              acquisition costs, and debt service pressure resulting in a compressed valuation of $2.5B to $3.5B.
              Consequently, our recommendation is a price-sensitive Conditional Buy. Final investment commitment depends
              on securing audited financial statements confirming net margins, verifying private credit covenants with
              Blackstone, and confirming sustainable LTV-to-CPI ratios across both primary titles.
            claimRefs:
              - CV003
              - CV008
              - CV009
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV008
              - CV009
              - CV012
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Conditional Buy Investment Stance
            body: >-
              We recommend a Conditional Buy for Dream Games based on its world-class monetization metrics and proven
              ability to build market-dominating mobile puzzle games. However, prospective capital allocators must
              condition final funding on thorough review of audited financial records and covenant terms tied to the
              $1.25B debt package provided by Blackstone.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV009
              - CV015
          - type: callout
            title: Private Credit Debt Overhang
            body: >-
              The planned May 2025 recapitalization introducing $1.25B in private debt alongside CVC's equity investment
              creates a structural fixed-obligation burden that shifts Dream Games from a debt-free growth startup into
              a leveraged sponsor-backed asset.
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
