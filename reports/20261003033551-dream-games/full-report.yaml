      - number: '7.2'
        title: Regulatory, Legal, and Consumer Exposure
        blocks:
          - type: paragraph
            body: >-
              Dream Games' March 2026 privacy policy describes collection of gameplay, payment, device, advertising,
              approximate-location, commercial, and inferred-interest data, plus disclosures to service providers and
              advertising-technology providers. It also states that some laws may characterize advertising-provider
              disclosures as data sales. The company publishes opt-out, deletion, security, and parental-control
              mechanisms, and both its privacy policy and terms bar children aged 12 and under while requiring guardian
              permission for older minors. These controls reduce, but do not eliminate, exposure: the company expressly
              says internet transmission cannot be guaranteed fully secure. No assigned source establishes a breach,
              enforcement action, or lawsuit; that absence is an evidence gap rather than proof that none exists.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
