              - CO006
              - CO007
              - CO009
      - number: '1.3'
        title: Capitalization Trajectory, Sponsor Transitions, and Strategic Milestones
        blocks:
          - type: paragraph
            body: >-
              Dream Games achieved unprecedented capital velocity in European mobile gaming, raising $255M in a Series C
              round led by Index Ventures in January 2022 that valued the company at $2.75B and brought total venture
              funding to $468M. In May 2025, global alternative asset manager CVC announced a definitive strategic
              investment as sole equity partner to fund the studio's next expansion phase and provide full liquidity to
              initial venture capital partners exiting after more than five years. The transaction was structured with
              debt financing provided by funds managed by Blackstone and other credit investors, with Goldman Sachs
              International advising Dream Games and PJT Partners advising CVC. Third-party private market intelligence
              trackers report that total funding reached approximately $3.0B following secondary and recapitalization
              rounds, though private secondary marketplace Forge Global notes that formal pre-IPO valuation and
              transactional share pricing remain undisclosed.
            claimRefs:
