      - number: '4.2'
        title: Public traction is large but estimate-dependent
        blocks:
          - type: paragraph
            body: >-
              Independent industry sources indicate a very large mobile-game franchise, but the published figures are
              third-party estimates rather than audited company financials. Udonis estimates $1.4 billion of 2024 gross
              revenue and attributes $3.9 billion of lifetime revenue to Royal Match versus more than $100 million to
              Royal Kingdom. InvestGame separately reported 327 million Royal Match downloads and $3.1 billion of
              revenue by February 2025, while Royal Kingdom had 13 million downloads and $33 million since its April
              2023 soft launch. Differences in date, gross-versus-net convention, and source methodology prevent
              treating these numbers as a reconciled income statement. RevenueMemo's report that Royal Match represented
              around 95% of 2025 earnings sharpens the concentration risk: Royal Kingdom is evidence of a second
              product, but not yet evidence of diversified economics.
            claimRefs:
              - CI006
              - CI007
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI009
              - CI012
              - CI014
              - CI015
      - number: '4.3'
        title: Scale depends on paid distribution and internal production
        blocks:
          - type: paragraph
            body: >-
              The available evidence describes a performance-marketing-led go-to-market motion. Udonis says Royal Match
              acquisition used Facebook, Instagram, YouTube, and TikTok at scale, while Royal Kingdom added
              celebrity-backed brand campaigns. That identifies channels and likely variable acquisition spend, but it
              does not disclose CPI, payer conversion, cohort retention, LTV, ROAS, CAC payback, or the share of spend
              capitalized versus expensed. The official careers page says employees participate across the full game
              development lifecycle, indicating an internal production and live-operations cost base, while marketplace
              processing implies an additional distribution deduction before net receipts. Public download and
              player-spend estimates show scale, not sales efficiency. Without cohort economics and platform-fee data,
              neither contribution margin nor the durability of acquisition spend can be underwritten.
            claimRefs:
              - CI004
              - CI008
              - CI010
              - CI011
              - CI016
      - number: '4.4'
        title: Financing adds capacity and leverage, not transparent runway
        blocks:
          - type: paragraph
            body: >-
              The financing record demonstrates access to capital but not cash available for operations. InvestGame
              reported a contemplated $2.5 billion transaction split equally between debt and equity to buy out
              investors, with founders expected to retain 70%. CVC later announced a strategic investment that would
              provide liquidity to initial venture investors and include debt financing from Blackstone-managed funds
              and others. Tracxn reports $468 million of total funding and an undisclosed conventional-debt round dated
              May 2025. These are transaction and funding figures, not evidence of ending cash, free cash flow, or
              runway. The financial verdict is therefore mixed: estimated player spend and two active titles signal a
              powerful monetization engine, but title concentration, unquantified acquisition costs, unknown platform
              deductions, debt-service opacity, and the absence of audited margins or cash-flow data are decisive
              diligence blockers.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI006
              - CI009
