  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Dream Games' own terms describe a free-to-play model: users can access the games without charge, while
              optional virtual items are the disclosed paid mechanism. The company says its services are intended to be
              free of advertising, although it reserves the right to test ad-supported versions for limited periods.
              Payments are handled by authorized device or online marketplaces rather than by Dream Games itself. This
              supports a consumer-IAP revenue model, not subscription ARR, and it leaves realized item pricing, payer
              conversion, refund rates, taxes, platform commissions, geographic mix, and revenue-recognition policy
              undisclosed. The official games page lists Royal Match and Royal Kingdom, making title-level player
              activity the starting point for the revenue bridge. No public evidence in the assigned pool supports a
              recurring-revenue characterization or a precise net-revenue conversion from gross player spend.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
