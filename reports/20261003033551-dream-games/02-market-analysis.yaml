callouts:
  - calloutType: "insight"
    title: "Premium Player Experience as a Strategic Market Moat"
    body: "Dream Games' decision to completely omit in-game advertisements from Royal Match and Royal Kingdom represents a high-conviction product strategy that directly expands its addressable audience. By eliminating interruptive video ads and forced banners, Dream Games delivers a seamless entertainment experience that enhances long-term player retention and elevates organic word-of-mouth adoption across mass-market demographics."
    claimRefs:
      - "CM002"
      - "CM005"
      - "CM015"

  - calloutType: "risk"
    title: "Platform Dependence and Post-IDFA Acquisition Headwinds"
    body: "Because Dream Games monetizes exclusively through in-app microtransactions on mobile operating systems, the business remains structurally exposed to Apple and Google platform commission policies and privacy frameworks. Rising acquisition costs in casual gaming require exceptional creative performance and sustained live-ops innovation to preserve positive return on ad spend."
    claimRefs:
      - "CM003"
      - "CM006"
      - "CM016"

