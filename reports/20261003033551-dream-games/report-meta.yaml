  topStrengths:
    - Royal Match and Royal Kingdom demonstrate world-class puzzle-game monetization and global scale.
    - The company has multiple independent indications of strong investor appetite and access to capital.
    - Public policies and product materials show a functioning operational and compliance baseline.
  topRisks:
    - Revenue and operating concentration remain heavily tied to a narrow Royal puzzle-game universe.
    - Audited financials, margins, cash, burn, and debt covenants are still not publicly disclosed.
    - Platform, privacy, and sponsor-financing dependencies add execution and leverage risk.
  unresolvedGaps:
