company:
  name: "Dream Games"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in Istanbul in 2019 by five former Peak Games executives, Dream Games built Royal Match into a global puzzle juggernaut, achieving a $2.75B Series C valuation in 2022 and expanding to London. In May 2025, private equity sponsor CVC agreed to a major strategic investment alongside Blackstone debt financing to provide liquidity to early venture backers, while unaudited private tracker estimates indicate significant scale amidst persistent corporate opacity."
sections:
  - id: "corporate-identity-and-foundations"
    title: "Corporate Identity, Founding Roots, and Global Footprint"
    body: "Dream Games (legally Dream Games Dijital Teknolojiler A.Ş.) was founded in Istanbul, Turkey in 2019 by five mobile gaming industry veterans: Soner Aydemir (CEO), Ikbal Namli, Hakan Saglam, Eren Sengul, and Serdar Yilmaz. The founding team emerged from Peak Games with a focused philosophy to combine engineering rigor and artistic craftsmanship in casual mobile gaming, explicitly modeling their iterative studio approach on Pixar's animation philosophy. Headquartered in the Torun Center in Istanbul's Şişli district, Dream Games expanded its international footprint in March 2023 by opening its first overseas corporate office in central London, UK, positioning senior marketing and people leadership close to global talent and creative partners."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO008"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Key-Person Dependence, and Governance"
    body: "Dream Games is steered by co-founder and Chief Executive Officer Soner Aydemir, who maintains direct operational oversight over game design, studio culture, and product roadmaps. To support transatlantic commercial expansion and international talent acquisition following the rapid growth of Royal Match, the company recruited former King Global Head of Marketing Richard Hocking as Chief Marketing Officer and seasoned human resources leader Anju Sethi (formerly of King and Google) as Chief People Officer in March 2023, both based in London. While the founding cohort provides exceptional domain expertise in casual puzzle architecture, Dream Games displays material key-person dependency on Aydemir and the core founding cadre. Governance and board dynamics have historically been anchored by venture capital sponsors including Index Ventures partner Stephane Kurgan, alongside Balderton Capital and Makers Fund."
    claimRefs:
      - "CO001"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "capitalization-ownership-and-milestones"
    title: "Capitalization Trajectory, Sponsor Transitions, and Strategic Milestones"
    body: "Dream Games achieved unprecedented capital velocity in European mobile gaming, raising $255M in a Series C round led by Index Ventures in January 2022 that valued the company at $2.75B and brought total venture funding to $468M. In May 2025, global alternative asset manager CVC announced a definitive strategic investment as sole equity partner to fund the studio's next expansion phase and provide full liquidity to initial venture capital partners exiting after more than five years. The transaction was structured with debt financing provided by funds managed by Blackstone and other credit investors, with Goldman Sachs International advising Dream Games and PJT Partners advising CVC. Third-party private market intelligence trackers report that total funding reached approximately $3.0B following secondary and recapitalization rounds, though private secondary marketplace Forge Global notes that formal pre-IPO valuation and transactional share pricing remain undisclosed."
    claimRefs:
      - "CO008"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
