      - number: '6.3'
        title: 变现机制、客户黏性韧性与平台集中度风险
        blocks:
          - type: paragraph
            body: >-
              Dream Games
              主要靠虚拟道具的应用内购买（IAP）向消费者变现，包括游戏代币、额外消除步数与功能道具。依据服务条款，游戏免费提供，不收取强制订阅费用，亦不插入干扰性第三方视频广告，但公司保留在小范围内测试带广告版本的权利。虚拟道具不具备现实货币价值，无法在玩家间转让或兑现，购买后严格不支持退款，欧洲经济区等法定撤回权适用的地区除外。由于核心玩法完全免费，休闲三消游戏的付费转化率通常处于低个位数百分比，财务收入高度依赖高额付费玩家（常称“大R”或“鲸鱼用户”）。此外，商业交易完全借由中心化应用市场开展，主要包括
              Apple App Store、Google Play Store、Samsung Galaxy Store、Amazon、Huawei AppGallery 及
              Xsolla。上述平台中介牢牢把控着支付流转、退款处置、分发规则与平台佣金。为防范消费者维权，Dream Games
              援引《联邦仲裁法》（FAA），强制推行由美国仲裁协会（AAA）或全国仲裁与调解机构（NAM）主持的个人有约束力仲裁，并设立严格的集体诉讼豁免条款，且明确排除了截至 2024 年 11 月 11
              日已在美国法院立案的存量诉讼。
