            body: >-
              现有证据勾勒出一条以效果广告为主导的市场推广路径。Udonis 指出 Royal Match 大规模借助 Facebook、Instagram、YouTube 和 TikTok 获客，Royal Kingdom
              则补充了名人代言的品牌宣发。这揭示了推广渠道以及很可能产生的浮动买量支出，但未披露 CPI、付费转化率、用户队列留存、LTV、ROAS、CAC
              回本周期，亦未说明营销支出资本化与费用化的比例。官方招聘主页提到员工参与游戏全生命周期研发，暗示了内部自研与在线运营成本基数，而应用商店扣款意味着在获得净收入前还需扣除分发成本。公开的下载量与玩家充值预估只能体现业务规模，不能代表获客效率。若无用户队列数据与平台费率支撑，边际贡献率以及买量投放的持久性都无法计入投资判断。
