      - number: '2.4'
        title: 结构性增长驱动力、分发阻力与宏观约束
        blocks:
          - type: paragraph
            body: >-
              Dream Games 的市场扩张与估值韧性，同时受到强劲的结构性顺风与严苛的平台及监管制约。在增长端，公司受惠于全球智能手机普及、消费者对精品手游付费意愿上升，以及自有 IP 从 Royal Match 向
              Royal Kingdom 的战略延伸。此外，公司同步推进组织扩张——在伊斯坦布尔总部之外设立伦敦市中心办公室，吸纳来自 King 和 Google
              的核心高管，增强了国际化营销与在线运营实力。反之，严重的结构性阻力压制着用户获取与利润实现。Apple 与 Google 平台应用商店抽取所有内购 15% 至 30% 的渠道分成，直接削弱毛利。与此同时，iOS
              与 Android 在后 IDFA
              时代的隐私新政永久性推高了获客成本，并削弱了定向投放效率，迫使公司必须维持庞大的效果广告预算以稳住畅销榜前列位置。最后，西方司法管辖区对随机数字抽取机制及手游消费者权益的监管审查日益严格，推高了合规复杂度，要求变现设计保持克制并随时警惕法律风险。
            claimRefs:
              - CM003
              - CM006
              - CM010
              - CM014
              - CM016
      - number: '2.5'
        title: 图表展示
        blocks:
          - type: callout
            title: 以高品质玩家体验构建战略护城河
            body: >-
              Dream Games 在 Royal Match 与 Royal Kingdom
              中彻底摒弃游戏内广告，是一项坚决的产品战略，直接拓宽了受众基本盘。通过消除打断游戏节奏的插屏视频与强制横幅广告，公司提供了无缝衔接的娱乐体验，增强了长线玩家留存，并在大众客群中撬动更多自然口碑传播。
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
              - CM015
          - type: callout
            title: 平台依赖度与后 IDFA 获客逆风
            body: >-
              由于 Dream Games 完全依靠移动操作系统上的应用内微交易变现，其业务在结构上始终暴露在 Apple 与 Google
              的平台佣金政策和隐私框架之下。休闲手游获客成本走高，要求素材创意表现出色并持续推进在线运营创新，才能维持正向的广告支出回报率（ROAS）。
            calloutType: risk
            claimRefs:
              - CM003
              - CM006
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争范围远超三消工作室的范畴。独立分析汇总将 King、Playrix 和 Zynga 列为直接或邻接的移动游戏竞品，而历史报道指出，Dream Games
              自身还将影视与社交媒体视为竞争对手。因此任何免费娱乐选择——包括完全不花一分钱——都构成了既有替代方案，因为 Dream Games
              声明其服务可免费体验。已有证据无法支撑按收入、受众、融资额或市场份额给出全景排序。因此下文只勾勒出一幅局部图谱：纳入了具名竞品，未有支撑的规模字段维持“未知”，并将自主内部研发归为发行方入局路径，而非消费者的购买替代项。
