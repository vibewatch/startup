      - number: '3.3'
        title: 分发话语权、切换壁垒与多平台并行
        blocks:
          - type: paragraph
            body: >-
              分发渠道覆盖面广，但高度依赖中介。Dream Games 条款列明了 Apple、Google、Samsung、Amazon、Huawei 与 Xsolla
              的交易流程，并声明付费虚拟道具均由相应商城处理。这保障了触达范围，却使支付与退款触点部分受控于平台。某低权重分析机构认为玩家切换成本几乎为零，因为免费替代品极其充裕；该定性判断符合常理，但所给材料中缺少关于流失率或多端并行的实证研究。Dream
              Games 曾从 King 挖角高管，也说明营销与人才层面的专业壁垒会在对手间流动，并非铁板一块。
