              等顶级风投机构支持下经历五年超高速增长后，早期风投财团获得全额流动性退出。以私募股权赞助机构 CVC 及 Blackstone
              提供的债务融资取代早期风投支持方，表明公司重心转向经营现金流优化与游戏矩阵扩张，而非短期公开市场上市。
