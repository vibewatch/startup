  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    columns:
      - 经营情景
      - 核心经营假设
      - 隐含估值区间
      - 下行情景触发点与风险信号
      - 概率信号
    rows:
      - - 乐观情景
        - Royal Match 稳居畅销榜前 3；Royal Kingdom 年收入运行率突破 $500M；营业利润率超过 35%。
        - $6.5B - $8.0B
        - 激烈的买量竞价战，或应用商店分成费率遭遇重大监管变动。
        - 25%
      - - 基准情景
        - Royal Match 保持平稳但温和衰退；Royal Kingdom 贡献稳定的增量收入；债务偿还平稳有序。
        - $4.5B - $5.5B
        - 西方一线市场的买量成本温和上涨，用户参与度进入平台期。
        - 55%
      - - 悲观情景
        - Royal Match 用户参与度快速衰退；Royal Kingdom 无法做大规模；$1.25B 债务带来严峻的流动性与契约压力。
        - $2.5B - $3.5B
        - 平台政策冲击、算法归因失准，或长线内容运营（live ops）执行受挫。
        - 20%
    notes: 各情景估值反映了在扣除应用商店分成后的预估总流水基础上，采用 2.5x 至 5.0x 的远期收入倍数计算。
