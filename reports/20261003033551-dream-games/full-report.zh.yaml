        - 缺少平台层面的收入与获客数据，无法评估分散化程度
      - - 股权赞助与债权融资
        - CVC；Blackstone 旗下基金及其他债权投资机构
        - 独家股权合伙与交易债务
        - CVC 自称是新成立的独家股权合作伙伴
        - 债务契约、还本付息或赞助机构的诉求，可能限制产品开发与买量投入
        - 高
        - 确认交割进展；核查债务偿还计划、债务契约、流动性、清算优先权及董事会权利
        - 公告未披露债务总额、定价、到期日、契约条款及当前交割状态
      - - 广告与服务提供商数据处理
        - 未具名的服务商及广告技术（AdTech）服务商
        - IT、客户支持、数据分析、广告投放、归因分析及市场研究
        - 未披露服务商清单及采购支出集中度
        - 服务商故障或违规可能导致服务中断，或引发隐私合规法律责任
        - 高
        - 核查供应商清单、次级处理方、审计权利、业务连续性测试及退出预案
        - 公司自身的控制措施不能证明第三方服务商控制机制的有效性
      - - 付费买量获客执行
        - 广告平台与内部买量团队
        - 扩大规模与拓展地域市场
        - 据第三方文章报道，$155 million Series B 融资旨在扩大亚洲市场的买量规模
        - 买量成本上升或回本周期拉长，会挤压单款产品的经济模型
        - 高
        - 分产品和国家跟踪 CPI、付费转化率、队列 LTV、回本周期、自然量占比及边际 ROAS
        - 指定证据中缺少当前买量支出、渠道结构、LTV、CPI 及回本周期数据
    notes: 各行仅列出指定来源所支持的依赖项，并非实测的集中度百分比。严重程度属分析师判断；平台份额、供应商合同、融资条款及买量经济模型仍属尽调缺口。
    claimRefs:
      - CR005
      - CR007
      - CR010
      - CR011
      - CR012
  - id: TV001
    title: 投资建议汇总表
    columns:
      - 决策参数
      - 评估立场
      - 支撑证据与战略影响
    rows:
      - - 投资建议
        - 有条件买入
        - 前提是确认其经营活动净现金流为正、买量获客 ROI 可持续，且 CVC 资本重组方案下的债务契约在可控范围内。
      - - 置信度
        - 中
        - 有经过验证的头部应用畅销榜流水数据与一线机构背书作为支撑，但受限于未公开且未经证实的财务披露。
      - - 风险评级
        - 中
        - 主要风险源于商业变现高度集中于三消休闲益智品类、私募信贷债务负担，以及不断演变的平台隐私法规。
      - - 估值立场
        - 合理
        - 相较上市游戏同行，上一轮股权投后估值 $2.75B 与资本重组估值 $5.0B，契合其品类领先的商业化变现能力。
      - - 退出周期
        - 3 至 5 年
        - 预期在 CVC 交易交割后，通过公开发行上市或出售给大型娱乐传媒集团实现退出。
    notes: 评估参数综合了经核实的融资里程碑、公开市场游戏交易倍数及据报道的资本重组细节。
