            body: >-
              Dream Games
              在官方服务条款中设定了极为严苛的合同保护条款，强制要求具有约束力的个人仲裁、严格禁止集体诉讼，并保留虚拟道具及不可退款虚拟代币的全部所有权。叠加热衷核心创始团队的关键人物高度集中以及非公开财务披露的模糊性，投资者在财务审计、买量投放利润空间及消费者诉讼风险敞口上面临持续的尽职调查缺口。
