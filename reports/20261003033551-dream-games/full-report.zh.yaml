  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与决策框架
        blocks:
          - type: paragraph
            body: >-
              最核心的风险敞口是产品执行的单一集中：Dream Games 官方产品名录仅有 Royal Match 与 Royal Kingdom，CVC 亦称 Royal Kingdom 为公司第二款手游，并将 Royal
              Match
              定性为全球收入第一的益智游戏。这印证了影响重大的产品线集中风险，但并未量化各产品收入占比、单款盈利能力或长效持久度。下一梯队风险交织了隐私与未成年人保护合规义务，以及对应用商店、广告技术服务商、云基础设施、赞助机构与债务工具的深度依赖。下述发生概率标签为分析师对风险暴露的主观判断，并非既往事故统计率。在管理层补齐单款产品经济模型、内部管控实据、当前融资法律文件及独立法务与安全核查报告前，投资判断应保持审慎的有条件立场。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR008
              - CR010
              - CR012
              - CR013
              - CR016
      - number: '7.2'
        title: 监管、法律及消费者诉讼风险敞口
        blocks:
          - type: paragraph
            body: >-
              Dream Games 于 2026 年 3
              月更新的隐私政策显示，公司收集玩家游玩、支付、设备、广告、大致位置、商业交易及推断兴趣等数据，并向服务提供商与广告技术商开放披露。政策亦注明，部分法律或将向广告商共享信息定性为“数据出售”。公司公布了退出机制、数据删除、安全防护及家长控制措施；隐私条款与用户协议均明令禁止
              12
              岁及以下儿童游玩，并要求大龄未成年人取得监护人授权。这些措施降低了风险，但未能根除隐患：公司明确强调无法保证网络传输绝对安全。目前材料未记录到任何违规泄露、监管执法或诉讼案件；这种缺失属于证据缺口，并不能直接反推其历史记录绝对清白。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR012
