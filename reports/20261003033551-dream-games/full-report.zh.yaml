  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现机制
        blocks:
          - type: paragraph
            body: >-
              Dream Games
              自身条款呈现的是典型免费游戏模式：用户无需掏钱即可游玩，自选购买虚拟道具是唯一披露的付费路径。公司表示其服务旨在保持无广告，但保留在限定周期内测试广告版本的权利。支付环节由授权设备或线上应用商店承接，而非由
              Dream Games 自主结算。这支撑的是消费者端 IAP 收入模型，而非订阅制 ARR；实际道具定价、付费转化率、退款率、税收、平台佣金、区域构成与收入确认会计政策均未披露。官方游戏专区仅列出 Royal
              Match 和 Royal Kingdom，单款游戏的玩家活跃度构成了收入测算的起点。已有材料中没有支持经常性收入定性的公开证据，也无法准确把玩家总流水折算为净收入。
