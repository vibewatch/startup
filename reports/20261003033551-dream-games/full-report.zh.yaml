      - number: '7.3'
        title: 运营、安全与人才风险敞口
        blocks:
          - type: paragraph
            body: >-
              公开材料仅能辨识技术组件，无法评估实际控制成效。LeadIQ 在技术栈中列举了 Amazon Web Services、Apache Kafka、Prometheus 与
              Looker，但已有资料并未提供系统架构、多重冗余、故障恢复时长、历史事故或服务等级协议（SLA）数据。Dream Games
              的安全政策列举了防火墙、加密技术、内部规程及数据处理协议，同时也明确不对绝对安全性做任何背书。人才层面的证据同样偏向定性：Clay 记录联合创始人 Soner Aydemir
              担任首席执行官，招聘主页强调员工参与端到端全周期研发。这些事实表明有必要对关键人物依赖、专家留任、职责分离与容灾机制展开尽职调查，但不能据此声称某个云区域、特定高管或某套系统存在既成单点故障。
            claimRefs:
              - CR008
              - CR013
              - CR014
              - CR015
