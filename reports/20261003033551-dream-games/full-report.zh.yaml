  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分群与受众画像
        blocks:
          - type: paragraph
            body: >-
              Dream Games 扎根全球移动互动娱乐市场，开发面向长线休闲陪伴的免费三消益智游戏。公司客户群体是纯粹的 B2C 终端消费者，即在 iOS、Android
              及所支持第三方应用商店上的手游玩家。管理层明确将旗下游戏定位于大众娱乐产品，旨在打破地域、文化、性别与年龄界限吸纳广泛受众；这让公司不仅与 King、Playrix
              等移动游戏发行商争抢玩家，也与主流流媒体视频及社交平台瓜分闲暇时间。在这一庞大受众中，Dream Games
              将用户分层为贡献活跃度与自然裂变的免费休闲玩家，以及购买虚拟道具加快闯关节奏的付费玩家。官方服务条款将准入门槛设定为 13 岁及以上，13 至 17 岁未成年人须获得父母许可与监管，12
              岁及以下儿童则完全被排除在外。Dream Games 并不服务企业级 B2B 客户，但第三方机构指出，其 B2B 对接点主要涵盖支持日常在线运营的营销技术工具、数据分析平台及买量广告网络。
            claimRefs:
              - CU001
