  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Dream Games 的核心投资逻辑立足于其打造全球标杆级休闲益智游戏矩阵的实力，且展现出极高的资本使用效率。公司于 2021 年推出首款游戏 Royal
              Match，随后将其推上全球流水第一的益智手游王座，2024 年在内购净收入上领先老牌霸主 King 的 Candy Crush Saga 达 35%。2024 年 11 月，工作室上线 Royal
              Kingdom 扩充产品线，构筑起更宏大的 Royal 宇宙，证明其具备多产品连续交付能力，而非昙花一现的“一击爆款”。不仅如此，相较其惊人的吸金体量，Dream Games
              历史股权融资相当克制，历经六轮融资仅吸纳 $468M，并沉淀出世界顶尖的用户留存水准。然而，反向逻辑指出了致命的结构性脆弱点：公司保持非上市状态，未公开披露经审计财报、EBITDA
              利润率或单客买量指标。业务高度依赖三消单一赛道，深处白热化竞争的手游生态，平台隐私改版及玩家玩法疲惫都可能动摇其长期商业壁垒。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
      - number: '8.2'
        title: 资本结构与交易背景
        blocks:
          - type: paragraph
            body: >-
              2022 年 1 月完成由 Index Ventures 领投，Makers Fund、IVP、BlackRock、Kora 及 Balderton Capital 跟投的 $255M Series C
              轮融资后，Dream Games 历史估值定格在 $2.75B。2025 年 5 月，Dream Games 宣布开展重大战略资本重组，CVC Capital Partners 作为独家股权投资方入局，并搭配
              Blackstone 旗下基金及其他机构信贷方提供的债务融资。市场报道显示，该交易拟筹集总额 $2.5B 资金，股权 $1.25B 与私募债 $1.25B
              各占一半，在早期风投投资人借此全额退出的同时，创始团队在近 $5B 的隐含企业价值下预计保留约 70% 股份。本轮资本重组引入了沉重的偿债义务并重构了治理格局，实质上改变了 Dream Games
              的风险特征。新进投资者必须审慎权衡其强劲的造血能力，与潜在优先权压顶、债务限制契约以及股权稀释细节缺乏透明披露之间的利弊。
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV009
              - CV012
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV009
              - CV010
              - CV015
      - number: '8.3'
        title: 情景分析、尽调重点与退出路径
        blocks:
          - type: paragraph
            body: >-
              评估 Dream Games 需要在 Royal Match 和 Royal Kingdom 惊人的吸金速度，与未上市工作室的底层不透明度及新增债务杠杆之间寻找平衡。在基准情景下，Royal Match
              维持品类领跑优势，Royal Kingdom 稳健放量，支撑起 $4.5B 至 $5.5B 的隐含估值区间，高额自由现金流可从容覆盖利息偿还。在乐观情景下，Royal Kingdom
              迎来比肩前作的爆发式跃升，全球化拓圈推动年化总流水突破 $2.0B，支撑退出时享有 $6.5B 至 $8.0B 的估值。相反在悲观情景下，估值乘数迅速承压回落、买量获客成本高涨且偿债压力剧增，估值将被压缩至
              $2.5B 至 $3.5B。因此，我们维持对价格敏感的“有条件买入”建议。最终投资决断取决于：取得经审计财报以证实净利率、核实与 Blackstone 签署的私募债权契约条款，并验证两款主力产品具备可持续的
              LTV/CPI 比率。
            claimRefs:
              - CV003
              - CV008
              - CV009
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV008
              - CV009
              - CV012
              - CV014
      - number: '8.4'
        title: 图表展示
        blocks:
          - type: callout
            title: “有条件买入”投资评级立场
            body: >-
              基于出色的变现指标以及打造统治级移动益智手游的成熟能力，我们对 Dream Games 给出“有条件买入”评级。然而，潜在出资人必须将最终投资绑定在严谨审阅经审计财报，以及彻底核查 Blackstone 所提供
              $1.25B 债务包的相关契约条款之上。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV009
              - CV015
          - type: callout
            title: 私募信贷债务压顶风险
            body: >-
              拟于 2025 年 5 月落地的资本重组在引入 CVC 股权投资的同时增添了 $1.25B 私募债，带来了刚性的固定偿债负担，使得 Dream Games
              从一家无负债的成长型创业公司转变为依赖杠杆的赞助机构被投资产。
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
