    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、创立渊源与全球布局
        blocks:
          - type: paragraph
            body: >-
              Dream Games（法定注册名为 Dream Games Dijital Teknolojiler A.Ş.）于 2019 年在土耳其伊斯坦布尔创立，五位联合创始人均为移动游戏行业资深人士：Soner
              Aydemir（CEO）、Ikbal Namli、Hakan Saglam、Eren Sengul 和 Serdar Yilmaz。创始团队脱胎于 Peak
              Games，明确提出将工程严谨性与艺术工艺融入休闲手游，并在工作室迭代开发模式上直接借鉴 Pixar 的动画创作哲学。公司总部设在伊斯坦布尔希什利区（Şişli）的 Torun Center，2023 年 3
              月在英国伦敦市中心开设首家海外办公室，将市场与人力核心高管直接派驻在贴近全球人才与创意合作伙伴的枢纽。
            claimRefs:
