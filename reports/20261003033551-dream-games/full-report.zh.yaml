      - number: '1.2'
        title: 核心管理层、关键人物依赖与公司治理
        blocks:
          - type: paragraph
            body: >-
              Dream Games 由联合创始人兼首席执行官 Soner Aydemir 掌舵，他对游戏设计、工作室文化和产品路线图保持直接业务把控。随着 Royal Match
              迅速爆发，为推进跨大西洋商业扩张并吸纳全球人才，公司于 2023 年 3 月招募前 King 全球营销主管 Richard Hocking 担任首席营销官，并引入前 King 及 Google 资深人力主管
              Anju Sethi 出任首席人才官，两人均常驻伦敦。尽管创始团队深谙休闲益智架构，Dream Games 对 Aydemir
              及核心创始团队仍存在实质性关键人物依赖。公司治理与董事会运作历来由风险投资赞助机构把持，核心成员包括 Index Ventures 合伙人 Stephane Kurgan，以及 Balderton Capital
              和 Makers Fund。
