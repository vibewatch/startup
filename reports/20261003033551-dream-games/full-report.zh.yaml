      - number: '6.2'
        title: 玩家增长轨迹与系列矩阵扩张
        blocks:
          - type: paragraph
            body: >-
              Dream Games 的用户爆发始于 2021 年 3 月 Royal Match 全球上线，玩家在游戏中消除解谜协助 King Robert 修葺城堡。上线仅 8 个月，Royal Match
              便迅速跻身全球最热门的手游之列，沉淀了数百万高黏性日活用户，并在美国、英国等核心消费市场的移动游戏畅销榜上稳居前十。早期风投资本指出，Royal Match
              的商业回报超出预期，上线三年内即在关键市场冲入畅销榜前三。2024 年 11 月，Dream Games 推出第二款主打产品 Royal Kingdom，将 IP 宇宙延展至 King
              Richard、Winston、Duke 与 Dark King。两款产品皆通过包含数千关卡的推进系统、在线活动与公会机制维系用户黏性。尽管用户普及度极广且累计消费达数十亿美元，Dream Games
