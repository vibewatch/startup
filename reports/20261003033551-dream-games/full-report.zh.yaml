  - id: TV002
    title: 投资逻辑与反向逻辑对照表
    columns:
      - 分析视角
      - 核心投资逻辑
      - 反向逻辑风险
      - 逻辑逆转条件与证伪触发点
    rows:
      - - 市场主导地位
        - Royal Match 在 2024 年净应用内购（Net IAP）收入上超出 Candy Crush Saga 35%，展现出行业领先的变现能力。
        - 移动休闲益智品类已趋饱和，且高度依赖付费买量渠道，易受平台隐私政策调整冲击。
        - 活跃玩家规模出现连续月度环比下滑，或在畅销榜排名下跌 25%。
      - - 产品矩阵多元化
        - Royal Kingdom 于 2023 年试水测试（soft launch），并于 2024 年 11 月全球上线，验证了多产品系列化扩张能力。
        - 第二款产品可能蚕食 Royal Match 现有受众，而非带来真正的增量付费用户。
        - 全球上线后 12 个月内，Royal Kingdom 未能跻身畅销榜前 50 名。
      - - 资本效率
        - 仅以 $468M 累计股权融资，就在数百万活跃玩家中跑出数十亿美元的累计总流水。
        - 资本重组引入了 Blackstone 提供的 $1.25B 私募债权融资，带来了固定的还本付息负担。
        - 还本付息后自由现金流转负，或触犯私募信贷协议中的债务契约。
    notes: 投资逻辑驱动因素对比了 AppMagic 与行业公开发布所报道的运营规模，以及未上市游戏工作室面临的结构性风险。
