        title: 股本演进历程、赞助机构转换与战略里程碑
        blocks:
          - type: paragraph
            body: >-
              Dream Games 在欧洲手游赛道展现出前所未见的资本吸纳速度：2022 年 1 月完成由 Index Ventures 领投的 $255M Series C 轮融资，公司估值达
              $2.75B，累计风险投资总额升至 $468M。2025 年 5 月，全球另类资产管理机构 CVC
              宣布作为独家股权投资方达成战略投资协议，既为工作室下一阶段扩张提供资金，也为持股超过五年的早期风险投资方提供全额退出流动性。该交易搭配了 Blackstone
              旗下基金及其他信贷投资机构提供的债务融资；Goldman Sachs International 担任 Dream Games 财务顾问，PJT Partners 担任 CVC
              顾问。第三方私募情报机构称，老股转让与资本重组后累计融资金额达约 $3.0B，但私募老股交易平台 Forge Global 指出，正式的 IPO 前估值与实际交易每股价格仍未披露。
