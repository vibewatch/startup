      - number: '7.4'
        title: 平台、资本与增长依赖风险
        blocks:
          - type: paragraph
            body: >-
              该运营模式存在多处外部卡点。Dream Games 服务条款将订单撤销或退款诉求全部导流至 Apple、Google、Samsung、Amazon、Huawei 及 Xsolla
              等平台接口，隐私政策也披露了对各类技术服务商与广告技术平台的深度依赖。资本端，CVC 宣布出任独家股权合作方，Blackstone 旗下基金及其他投资方提供债权融资；该公告表示交易尚待常规监管批准，预计于
              2025 年第三季度交割。已有材料既未核实最终交割进展，也未披露债务总额与限制性契约细节。ERAI Turkey 另报道称，此前一轮 $155M
              融资旨在扩大亚洲买量规模，这使得眼下的获客效率、渠道结构与回本表现成为评估投资决策时最核心的未决疑点。
