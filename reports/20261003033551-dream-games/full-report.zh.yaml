        title: 图表展示
        blocks:
          - type: callout
            title: 所给材料未见违规记录并不等同于从未发生违规
            body: 所分配的证据仅包含公司制度与商业概况，并非涵盖监管机构、司法裁判、安全事故或应用商店处罚的完整记录。法律与安全尽职调查应直接核验这一缺口，绝不能将材料的沉默等同于清白无虞。
