figures:
  - id: FO001
    title: Dream Games 关键企业发展与商业里程碑
    type: timeline
    summary: 从 2019 年创立到 2025 年赞助机构变更期间，企业在融资、产品上线与组织发展维度的关键里程碑。
    data:
      items:
        - label: '2019-12-15: 公司在伊斯坦布尔创立'
          detail: 五位前 Peak Games 高管创立 Dream Games，专注于工程卓越性与 Pixar 风格的匠心工艺。
          tone: positive
        - label: '2021-03-01: Royal Match 全球上线'
          detail: Dream Games 首款休闲益智游戏在全球上线，迅速打入美英两国畅销榜前列。
          tone: positive
        - label: '2021-06-30: Series B 独角兽估值（$1.0B）'
          detail: 拿下由 Index Ventures 领投的 $155M Series B 融资，在全球上线仅三个月内便跻身独角兽行列。
          tone: positive
        - label: '2022-01-19: Series C 超大轮次融资（估值 $2.75B）'
          detail: 完成由 Index Ventures 领投的 $255M Series C 融资，估值在六个月内翻倍达到 $2.75B。
          tone: positive
        - label: '2023-03-20: 国际化扩张至伦敦'
          detail: 在伦敦市中心开设首家海外办公室，并聘请 CMO Richard Hocking 与 CPO Anju Sethi。
          tone: neutral
        - label: '2024-11-01: Royal Kingdom 全球上线'
          detail: 推出系列第二款游戏，以 King Richard 与 Dark King 叙事拓展 Royal 宇宙。
          tone: positive
        - label: '2025-01-22: 老股交易平台建档（Forge Global）'
          detail: Forge Global 老股交易市场上建立了该公司的 Pre-IPO 档案，注明流动性有限且未公开估值。
          tone: neutral
        - label: '2025-05-01: CVC 与 Blackstone 战略并购投资'
          detail: 宣布由 CVC 作为独家股权合作伙伴并配合 Blackstone 债权融资进行战略并购投资，实现早期风投机构退出。
          tone: positive
    approximationNotes: 里程碑日期来自公司公告与新闻通稿。CVC 交易交割预定于 2025 年 Q3。
