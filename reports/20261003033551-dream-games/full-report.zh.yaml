  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可触达支出与闲暇时间替代品
        blocks:
          - type: paragraph
            body: >-
              界定 Dream Games 的潜在市场，必须区分休闲益智手游内部直接面向消费者的内购支出与外围数字娱乐生态。Dream Games
              研发并发行休闲益智移动游戏，主打三消与王室叙事推进细分品类。核心变现边界涵盖面向消费者的数字化微交易，包括通过主流应用商店购买的消耗型代币、额外消除步数、体力及城堡装饰推进道具。该边界明确排除了数字广告支出、周边衍生品授权以及主机或
              PC 平台游戏支出，因为 Dream Games 坚持采用不插播第三方广告的纯净应用模式，优先保障高品质用户体验。抢夺消费者闲暇时间时，Dream Games
              的竞争视线超越了直接的移动益智竞品，延伸至流媒体视频、社交网络和超休闲游戏等数字娱乐平台。益智机制需要玩家主动集中注意力并进行高频短平快对局，因此能抢占消费者原本流向短视频或剧集内容的日常碎片时间。整套商业模式完全建立在将免费用户转化为自选小额付费玩家之上，操作阻力、视觉流畅感与关卡数值平衡成为决定钱包份额的关键。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
