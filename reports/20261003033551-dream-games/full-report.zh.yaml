      - number: '5.2'
        title: 技术基础设施、遥测体系与在线运营
        blocks:
          - type: paragraph
            body: >-
              支撑 Dream Games 的底层架构依赖高吞吐数据管道与云基础设施，设计之初即旨在实时处理数以亿计的玩家事件 [CE007, CE008]。独立技术栈资料显示，工作室采用 Apache Kafka
              承载大规模事件流，依托 Amazon Web Services (AWS) 托管云基础设施，利用 Prometheus 实施系统实时监控，并借助 Looker 搭建商业智能与分析看板
              [CE007]。产品人员、研发工程师与游戏美术紧密协作，基于玩家通关数据执行结构化 A/B 测试与统计分析，持续调优消除难度曲线并优化线上活动节奏 [CE008]。至于企业官网，外部开发伙伴搭建了专门的
              Webflow CMS 平台，直连 Lever 招聘管理系统（ATS）以支撑技术招募扩张 [CE009]。
