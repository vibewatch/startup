      - number: '2.2'
        title: 市场规模测算、多维测算视角与估值基准
        blocks:
          - type: paragraph
            body: >-
              评估 Dream Games 的市场空间需要交叉比对多重分析视角，而非依赖单一缺乏约束的顶层总盘估计。宏观上看，全球 iOS 与 Android 生态的移动游戏软件市场每年代表着超过 $90B 至 $100B
              的可触达消费者支出池。在这一宏观范畴内，休闲益智及三消赛道构成可服务市场（SAM），全球每年产生的应用内购买收入在 $10B 至 $15B 之间。Dream Games 凭借 Royal Match
              证明了吃下该市场的能力：该产品位列全球内购净收入第一的益智游戏，2024 年预估净收入运行率达
              $1.46B，并在美国和英国等核心西方市场稳居畅销榜前三。然而，不同二级分析机构的测算存在巨大估算偏差，也受限于未上市公司信息披露。第三方数据平台 LeadIQ 截至 2026 年 8 月给出的 Dream
              Games 年收入预估区间宽达 $1B 至 $10B；企业估值基准也从 2022 年 1 月 Series C 确立的 $2.75B 历史基线，延伸至 CVC 2025 年战略投资透露的约 $5B
              私募资本重组指标。这一差距表明，顶尖益智手游虽能支撑数十亿美元企业估值，但缺少发行商审计披露，实际可获取市场的渗透率依然难以厘清。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.3'
        title: 玩家分群、付费经济学与预算归属
        blocks:
          - type: paragraph
            body: >-
              休闲手游的商业引擎依赖高度不对称的行为漏斗，玩家画像、可支配预算分配及对局习惯共同决定长期变现。与企业级 B2B 软件由采购主管通过既定流程调拨企业预算不同，移动游戏直接面向个人消费者的自主支配钱包。Dream
              Games
              的玩家画像极宽，覆盖各个地理区域、文化背景、性别和年龄层的泛大众，并不向传统硬核玩家倾斜。在庞大客群内部，绝大多数日活用户完全免费游玩，靠核心消除解谜与城堡修缮机制获取娱乐体验，无需花钱。经济价值高度集中在极少数忠实付费玩家与高频发烧友身上，他们购买消耗型道具、活动入场券和复活礼包以越过陡峭的难度关卡。转化触发点遵循行为进阶心理学：随着解谜难度提高，加上
              Royal
              世界观引入竞技社交活动与王国营建，玩家更倾向自发进行微交易。预算持有者、终端用户与付费方三者合一，即通过手机应用商店支付通道下单的个人消费者。长线付费留存高度仰赖持续的在线运营节奏、新颖的关卡机制，以及玩家对解谜算法公平性的认可。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
