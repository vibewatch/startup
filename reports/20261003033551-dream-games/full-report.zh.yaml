      - number: '3.2'
        title: 产品、能力与变现模式对比
        blocks:
          - type: paragraph
            body: >-
              Dream Games 官方公开矩阵包含两款 Royal 系列产品：Royal Match 与 Royal
              Kingdom。其条款规定用户可免费访问、通常不插播广告，并通过设备或授权商城销售自选付费虚拟道具。这是一套清晰的产品与包装策略，但构不成定价基准：既有资料均未披露单个道具挂牌价、实际单客支出、付费转化率、留存率或竞品的可比礼包。第三方消息源将
              Dream Games 的地位归因于品质与用户体验，公司自身则强调端到端产品掌控力。这些信号支持其能力维度的投资逻辑，但尚无法证明该优势转化为了更优越的单位经济模型。
