              若尽调发现下述情况，应暂停投资或重新定价：交易交割遇阻、债务契约严苛、存在实质性隐私或未成年人安全违规、遭遇应用商城下架限制、运维恢复反复失准，或单款游戏经济效益表明 Royal Kingdom 无法有效分担对
