  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 游戏产品矩阵与核心玩法循环架构
        blocks:
          - type: paragraph
            body: >-
              Dream Games 的休闲手游业务主要依靠两款商业化产品：旗舰益智产品 Royal Match 以及 2024 年 11 月推出的后续作品 Royal Kingdom [CE001, CE003]。在
              Royal Match 中，玩家通过闯关三消拼图赚取星星与金币，随即投入以 King Robert、Winston 与 Duke 为主角的城堡修缮故事线 [CE001, CE002]。Royal Kingdom
              将这一宇宙拓展至王国探索、王国建造，以及 King Richard 对抗 Dark King 的叙事战斗机制 [CE001,
              CE003]。公司在核心游戏下载版本中特意摒弃了第三方广告，打造出完全依靠玩家自主购买虚拟代币与关卡道具支撑的无干扰游玩闭环 [CE004,
              CE005]。对顶级视觉表现、灵敏触觉反馈及干脆消除节奏的打磨，构成了各款游戏维系玩家留存的基石 [CE002, CE006]。
