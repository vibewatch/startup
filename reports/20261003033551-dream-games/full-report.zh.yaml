            body: >-
              融资记录展现了公司的资本运作能力，却无法证实其实际可用于日常经营的可用现金。InvestGame 曾报道一项意向金额为 $2.5B 的交易，采用股债各半形式收购老股东股权，预计创始人保留 70% 股份。CVC
              随后宣布推进战略投资，为早期风投投资人提供退出流动性，并搭配了 Blackstone 等机构管理的债务融资。Tracxn 显示累计融资总额为 $468M，并在 2025 年 5
              月完成了一笔金额未披露的常规债务融资。这些属于交易与筹资层面的数字，无法证明期末现金余额、自由现金流或现金跑道。因此财务层面的定论悲喜交织：估算出的玩家充值流水与两款在运游戏反映出强劲的变现能力，但单款游戏过度集中、买量成本未予量化、平台分成比例不明、偿债负担不透明，外加缺少审计利润率与现金流数据，构成了决定性的尽职调查障碍。
