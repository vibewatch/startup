      - number: '3.4'
        title: 护城河韧性与替代风险
        blocks:
          - type: paragraph
            body: >-
              公开层面上最强有力的护城河逻辑，结合了 Royal 系列 IP、极致产品打磨、可复制的研发机制以及储备新产品的充足资金。CVC 表示后续战略是拓展 Royal 宇宙并开发新游；Financier
              Worldwide 则引述公司口径称，Royal Match 凭借近 3 亿次下载获得了超过 $3B 的终身总流水。这两项陈述均无法证实留存具备长期韧性或获客成本足够经济。反向逻辑则更显尖锐：Playrix 与
              King 在同一益智受众池中同台竞技，跨赛道平台争抢注意力，低切换阻力削弱了锁定效应。因此在补足用户队列、获客成本及单款游戏贡献利润的证据之前，评估该护城河时应将其视为高度依赖执行与分发的动态能力。
