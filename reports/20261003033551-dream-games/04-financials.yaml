schemaVersion: "report-v2"
artifact: financials
slug: dream-games
runDate: 2026-10-03
company:
  name: Dream Games
chapter:
  number: 4
  title: Financials
  summary: >-
    Dream Games monetizes free-to-play mobile games through optional paid virtual
    items, while third-party estimates point to exceptional gross player spend
    and continued heavy concentration in Royal Match. The public record does not
    disclose audited revenue, platform commissions, user-acquisition returns,
    margins, cash, burn, runway, or debt terms, so revenue quality and capital
    adequacy remain material underwriting gaps.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Dream Games' own terms describe a free-to-play model: users can access the
      games without charge, while optional virtual items are the disclosed paid
      mechanism. The company says its services are intended to be free of
      advertising, although it reserves the right to test ad-supported versions
      for limited periods. Payments are handled by authorized device or online
      marketplaces rather than by Dream Games itself. This supports a
      consumer-IAP revenue model, not subscription ARR, and it leaves realized
      item pricing, payer conversion, refund rates, taxes, platform commissions,
      geographic mix, and revenue-recognition policy undisclosed. The official
      games page lists Royal Match and Royal Kingdom, making title-level player
      activity the starting point for the revenue bridge. No public evidence in
      the assigned pool supports a recurring-revenue characterization or a
      precise net-revenue conversion from gross player spend.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-concentration
    title: Public traction is large but estimate-dependent
    body: >-
      Independent industry sources indicate a very large mobile-game franchise,
      but the published figures are third-party estimates rather than audited
      company financials. Udonis estimates $1.4 billion of 2024 gross revenue and
      attributes $3.9 billion of lifetime revenue to Royal Match versus more than
      $100 million to Royal Kingdom. InvestGame separately reported 327 million
      Royal Match downloads and $3.1 billion of revenue by February 2025, while
      Royal Kingdom had 13 million downloads and $33 million since its April 2023
      soft launch. Differences in date, gross-versus-net convention, and source
      methodology prevent treating these numbers as a reconciled income
      statement. RevenueMemo's report that Royal Match represented around 95% of
      2025 earnings sharpens the concentration risk: Royal Kingdom is evidence of
      a second product, but not yet evidence of diversified economics.
    claimRefs: [CI006, CI007, CI009, CI010, CI011]
    tableRefs: [TI003]
  - id: go-to-market-and-cost-base
    title: Scale depends on paid distribution and internal production
    body: >-
      The available evidence describes a performance-marketing-led go-to-market
      motion. Udonis says Royal Match acquisition used Facebook, Instagram,
      YouTube, and TikTok at scale, while Royal Kingdom added celebrity-backed
      brand campaigns. That identifies channels and likely variable acquisition
      spend, but it does not disclose CPI, payer conversion, cohort retention,
      LTV, ROAS, CAC payback, or the share of spend capitalized versus expensed.
      The official careers page says employees participate across the full game
      development lifecycle, indicating an internal production and live-operations
      cost base, while marketplace processing implies an additional distribution
      deduction before net receipts. Public download and player-spend estimates
      show scale, not sales efficiency. Without cohort economics and platform-fee
      data, neither contribution margin nor the durability of acquisition spend
      can be underwritten.
    claimRefs: [CI004, CI008, CI010, CI011, CI016]
  - id: capital-adequacy-and-verdict
    title: Financing adds capacity and leverage, not transparent runway
    body: >-
      The financing record demonstrates access to capital but not cash available
      for operations. InvestGame reported a contemplated $2.5 billion transaction
      split equally between debt and equity to buy out investors, with founders
      expected to retain 70%. CVC later announced a strategic investment that
      would provide liquidity to initial venture investors and include debt
      financing from Blackstone-managed funds and others. Tracxn reports $468
      million of total funding and an undisclosed conventional-debt round dated
      May 2025. These are transaction and funding figures, not evidence of ending
      cash, free cash flow, or runway. The financial verdict is therefore mixed:
      estimated player spend and two active titles signal a powerful monetization
      engine, but title concentration, unquantified acquisition costs, unknown
      platform deductions, debt-service opacity, and the absence of audited
      margins or cash-flow data are decisive diligence blockers.
    claimRefs: [CI012, CI013, CI014, CI015, CI006, CI009]
callouts:
  - calloutType: risk
    title: Gross player spend is not audited company revenue
    body: >-
      The cited revenue figures come from third-party market estimates with
      differing dates and conventions. They should not be substituted for audited
      net revenue, gross margin, EBITDA, operating cash flow, or cash balances.
    claimRefs: [CI006, CI007, CI010, CI011]
tables:
  - id: TI001
    title: Revenue streams and recognition questions
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value or status
      - Revenue quality
      - Diligence ask
    rows:
      - - Paid virtual items
        - Optional in-game coins, items, and services
        - Transaction
        - Offered for a fee; price points and payer mix undisclosed
        - Consumable digital purchase; no recurring contract shown
        - SKU ledger, payer conversion, refunds, taxes, and recognition policy
      - - Free game access
        - Users can play without buying virtual items
        - Active player
        - Free access is explicitly permitted
        - Supports acquisition and engagement but is not revenue
        - DAU/MAU, retention cohorts, and free-to-paid conversion
      - - Advertising tests
        - Time-limited ad-supported versions may be tested
        - Impression or campaign
        - Possible, but not described as the intended base model
        - Experimental and unquantified
        - Ad revenue, fill rate, geography, duration, and current availability
      - - Marketplace settlement
        - Authorized marketplaces process paid-item transactions
        - Net remittance
        - Payment processing is external to Dream Games
        - Gross player spend must be reduced by fees, taxes, and refunds
        - Store statements and reconciliation from billings to recognized revenue
    notes: >-
      Official terms establish mechanisms but not realized prices or accounting;
      null economics remain explicit diligence requests rather than estimates.
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization disclosure
    columns:
      - Offer
      - Price or contract basis
      - List versus realized pricing
      - Discounts or unknowns
      - Source-backed implication
    rows:
      - - Core game access
        - Free
        - Official access condition
        - Regional availability and acquisition cost are unknown
        - Monetization depends on a subset of players or experimental ads
      - - Virtual items
        - Optional fee through an authorized marketplace
        - No public item-level price list retained
        - Bundles, promotions, payer tiers, refunds, and taxes are unknown
        - Transactional IAP; not ARR
      - - Ad-supported version
        - Potential limited-period test
        - No current rate card or ad-load disclosure
        - Availability, fill, CPM, and revenue share are unknown
        - Do not model advertising as a proven recurring stream
      - - Refunds and withdrawal
        - Marketplace and statutory rules apply
        - Realized net receipts are not disclosed
        - Refund incidence and chargebacks are unknown
        - Gross billings cannot be equated with recognized revenue
    notes: >-
      Pricing coverage is partial because the assigned evidence contains terms of
      service but no retained in-game SKU catalog, transaction data, or contracts.
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI003
    title: Unit-economics and capital-adequacy ledger
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - 2024 gross revenue estimate
        - "$1.4B, Udonis estimate"
        - Medium; unaudited third-party estimate
        - Establishes scale but not net revenue or margin
        - Reconcile to audited revenue and store statements
      - - Lifetime title revenue mix
        - "Royal Match $3.9B; Royal Kingdom >$100M, Udonis estimate"
        - Medium; methodology not disclosed in retained text
        - Indicates severe title concentration
        - Monthly title-level gross and net bookings
      - - Royal Match concentration
        - "Around 95% of 2025 earnings, RevenueMemo report"
        - Medium; denominator and methodology require confirmation
        - A title shock could dominate company performance
        - Audited title-level revenue and contribution profit
      - - User-acquisition efficiency
        - null
        - Unavailable
        - Paid distribution can consume a large share of player spend
        - CPI, ROAS, LTV, retention, payer conversion, and payback by cohort
      - - Gross margin and platform deductions
        - null
        - Unavailable
        - Converts estimated spend into contribution economics
        - Store commissions, taxes, refunds, hosting, and live-ops costs
      - - Cash, burn, and runway
        - null
        - Unavailable
        - Determines self-funding capacity and next-round timing
        - Latest cash balance, monthly free cash flow, budget, and downside runway
      - - Debt principal, rate, and covenants
        - Debt financing disclosed; terms not public
        - Medium on existence; low on quantum and obligations
        - Leverage can constrain reinvestment and distributions
        - Credit agreements, amortization, interest, covenants, and security
    notes: >-
      Revenue values are attributed third-party gross or player-spend estimates,
      not audited accounts; null means the assigned public evidence did not
      disclose the metric.
    claimRefs: [CI006, CI007, CI009, CI012, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge from play to company economics
    type: flow
    summary: >-
      Public evidence supports the commercial sequence, but not the deductions
      required to bridge gross player spend to contribution profit.
    data:
      nodes:
        - id: free-access
          label: Free mobile game access
          value: "Royal Match and Royal Kingdom"
          detail: Players can use the games without buying virtual items.
        - id: engagement
          label: Engagement and live content
          value: "Public cohort metrics unavailable"
          detail: Retention and payer conversion determine monetization quality.
        - id: virtual-items
          label: Optional paid virtual items
          value: "Prices undisclosed"
          detail: In-game coins, items, and services are the disclosed paid mechanism.
        - id: marketplace
          label: Marketplace checkout
          value: "External processing"
          detail: Authorized marketplaces process payments.
        - id: gross-spend
          label: Gross player-spend estimate
          value: "$1.4B for 2024"
          detail: Udonis estimate; not audited company revenue.
        - id: deductions
          label: Fees, taxes, refunds, and acquisition
          value: "Unavailable"
          detail: Public evidence does not quantify these deductions.
        - id: contribution
          label: Net revenue and contribution profit
          value: "Unavailable"
          detail: Audited revenue, gross margin, and cash conversion are diligence asks.
    approximationNotes: >-
      The $1.4B node is a third-party 2024 gross-revenue estimate; no arithmetic
      bridge or implied margin is calculated because the necessary deductions are
      unavailable.
    claimRefs: [CI002, CI003, CI005, CI006, CI008]
