  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: audited-financials
      missingEvidence: >-
        Audited income statements, cash-flow statements, balance sheets, title-level
        net revenue, gross margin, EBITDA, cash, burn, and runway.
      whyItMatters: >-
        Third-party player-spend estimates cannot establish profitability,
        liquidity, or the conversion of gross billings into cash.
      diligencePath: >-
        Obtain audited financials, monthly management accounts, bank statements,
        store settlement reports, and a bridge from gross billings to net revenue.
      relatedQuestionRefs: [QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: >-
        CPI, CAC, ROAS, payer conversion, cohort retention, LTV, payback,
        platform commissions, refunds, and title-level contribution margin.
      whyItMatters: >-
        Revenue scale can coexist with weak cash economics when acquisition and
        platform costs are high.
      diligencePath: >-
        Review monthly cohort files by channel, geography, title, and acquisition
        vintage and reconcile them to marketplace cash receipts.
      relatedQuestionRefs: [QI005, QI006, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: debt-obligations
      missingEvidence: >-
        Debt principal, lender allocation, interest rate, maturity, amortization,
        covenants, security, restricted cash, and permitted distributions.
      whyItMatters: >-
        The disclosed leveraged transaction may create fixed claims on cash flow
        and limit reinvestment even if gross player spend remains strong.
      diligencePath: >-
        Obtain executed credit agreements, covenant compliance certificates,
        closing funds flow, current debt schedule, and downside covenant model.
      relatedQuestionRefs: [QI007, QI008]
      relatedTableRefs: [TI003]
    - type: conflicting-data
      severity: material
      topic: revenue-estimates
      missingEvidence: >-
        A common definition and measurement date reconciling Udonis and InvestGame
        title-level revenue estimates with Dream Games' accounting records.
      whyItMatters: >-
        Differing dates and gross-versus-net conventions can materially change
        growth, concentration, and valuation conclusions.
      diligencePath: >-
        Reconcile App Store and Google Play statements, third-party estimates,
        refunds, taxes, and platform fees to audited title-level revenue.
      relatedQuestionRefs: [QI003, QI004, QI008]
      relatedTableRefs: [TI003]
