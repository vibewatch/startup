company:
  name: "Dream Games"
chapter:
  number: 7
  title: "Risks"
  summary: "Dream Games' highest-evidence risks are concentration in one Royal puzzle-game universe and layered dependence on app marketplaces, ad-tech and cloud providers, and a new equity-and-debt financing structure. Public policies describe privacy, security, minor-protection, and marketplace controls, but the assigned evidence does not establish incident history, unit economics, transaction completion, debt terms, or quantified revenue concentration."
sections:
  - id: "risk-ranking-and-decision-frame"
    title: "Risk Ranking and Decision Frame"
    body: >-
      The leading exposure is execution concentration: Dream Games' own catalog lists Royal Match and Royal Kingdom, while CVC calls Royal Kingdom the company's second mobile game and describes Royal Match as the global number-one puzzle game by revenue. That evidence supports a high-impact portfolio-concentration risk, but it does not quantify revenue split, title-level profitability, or durability. The next tier combines privacy and minor-protection obligations with marketplace, ad-tech, cloud, sponsor, and debt dependencies. Likelihood labels below are analyst assessments of exposure, not observed incident rates. The investment case should remain conditional until management supplies title-level economics, operational-control evidence, current financing documents, and independent legal and security checks.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR016"
    figureRefs:
      - "FR001"
  - id: "regulatory-legal-and-consumer-exposure"
    title: "Regulatory, Legal, and Consumer Exposure"
    body: >-
      Dream Games' March 2026 privacy policy describes collection of gameplay, payment, device, advertising, approximate-location, commercial, and inferred-interest data, plus disclosures to service providers and advertising-technology providers. It also states that some laws may characterize advertising-provider disclosures as data sales. The company publishes opt-out, deletion, security, and parental-control mechanisms, and both its privacy policy and terms bar children aged 12 and under while requiring guardian permission for older minors. These controls reduce, but do not eliminate, exposure: the company expressly says internet transmission cannot be guaranteed fully secure. No assigned source establishes a breach, enforcement action, or lawsuit; that absence is an evidence gap rather than proof that none exists.
    claimRefs:
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR012"
    tableRefs:
      - "TR001"
  - id: "operational-security-and-talent-exposure"
    title: "Operational, Security, and Talent Exposure"
    body: >-
      Public evidence identifies components rather than control performance. LeadIQ lists Amazon Web Services, Apache Kafka, Prometheus, and Looker in the technology stack, but the assigned pool provides no architecture, redundancy, recovery-time, incident, or service-level data. Dream Games' security policy names firewalls, encryption, internal protocols, and processor agreements, while expressly withholding any guarantee of complete security. Human-capital evidence is similarly directional: Clay identifies co-founder Soner Aydemir as chief executive, and the careers page says employees participate across the full development lifecycle. Those facts justify diligence on key-person, specialist retention, segregation of duties, and disaster recovery, but not claims that a single cloud region, named executive, or specific system is a proven point of failure.
    claimRefs:
      - "CR008"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR002"
  - id: "platform-capital-and-growth-dependencies"
    title: "Platform, Capital, and Growth Dependencies"
    body: >-
      The operating model has several external choke points. Dream Games' terms direct purchase-withdrawal or refund activity through Apple, Google, Samsung, Amazon, Huawei, and Xsolla interfaces, and its privacy policy describes reliance on service and ad-tech providers. Separately, CVC announced itself as the new sole equity partner, with Blackstone-managed funds and other investors providing debt financing; the announcement said closing remained subject to customary approvals and was expected in the third quarter of 2025. The assigned pool does not confirm the later closing status or disclose debt quantum and covenants. ERAI Turkey also reports that a prior $155 million round was intended to scale user acquisition in Asia, making current acquisition efficiency, platform mix, and payback a central unresolved underwriting issue.
    claimRefs:
      - "CR005"
      - "CR007"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR016"
    tableRefs:
      - "TR003"
