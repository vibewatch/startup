callouts:
  - calloutType: "risk"
    title: "No recorded incident in this pool is not proof of no incident"
    body: "The assigned evidence includes company policies and commercial profiles, not a complete regulator, court, security-incident, or app-store enforcement record. Legal and security diligence should therefore test the gap directly rather than treating source silence as a clean history."
    claimRefs:
      - "CR008"
  - calloutType: "recommendation"
    title: "Monitorable thesis-break triggers"
    body: "Pause or reprice the investment if diligence reveals unresolved transaction completion, restrictive debt covenants, material privacy or minor-safety failures, app-store access restrictions, repeated service-recovery misses, or title-level economics showing that Royal Kingdom cannot reduce Royal Match dependence."
    claimRefs:
      - "CR004"
      - "CR011"
      - "CR012"
      - "CR016"
