companyProfile:
  summary: >-
    Xpeng AeroHT is XPeng's Guangzhou-based flying-car division building the modular Land Aircraft Carrier and related
    low-altitude mobility aircraft. The company is clearly beyond concept-stage theater, with factory buildout,
    certification milestones, and visible order interest, but it remains a pre-delivery business with opaque economics,
    no disclosed current revenue, and a still-conditional path to commercial operations.
  foundingLocation: Guangzhou, China
  headquarters: Guangzhou, China
  productSummary: >-
    Modular Land Aircraft Carrier ground-plus-air flying-car system, plus the longer-range A868 product line under
    development.
  founders:
    - name: Zhao Deli
      role: Founder and president
      background: Leads the Land Aircraft Carrier program and manufacturing build-out.
  customerFocus: >-
    Affluent early adopters, special-use operators, and overseas channel partners able to absorb premium pricing and
    certification risk.
  businessModel: >-
