figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Publicly observable demand moves from awareness and demos into pre-orders and distributor agreements, with delivery still gated by certification.
    data:
      items:
        - label: Awareness
          tone: neutral
          actor: Prospective early adopters
          channel: Airshow and media coverage
          touchpoints:
            - Public manned demos and Airshow China visibility
            - Official "Flying Lifestyle" branding
        - label: Trial / experience
          tone: neutral
          actor: Prospective private buyers
          channel: Company experience surfaces
          touchpoints:
            - Official site says "5 Types of Flying Camp Nationwide"
            - Experience funnel is visible before delivered units
        - label: Pre-sale / intent
          tone: positive
          actor: China-first early buyers
          channel: Pre-sales and intent orders
          touchpoints:
            - 3,000 intent orders reported by Jan 2025
            - Pre-sales tied to public demonstrations
        - label: Distributor expansion
          tone: positive
          actor: Middle East channel partners
          channel: Bulk-order agreements
          touchpoints:
            - 600-order first Middle East batch
            - Ali & Sons, Almana, AlSayer, and CGCC UAE named
        - label: Certification and factory gate
          tone: risk
          actor: AeroHT and regulators
          channel: CAAC certification and manufacturing readiness
          touchpoints:
            - Production certificate application accepted
            - Airworthiness and operating approvals still needed
        - label: Delivered-use proof
          tone: risk
          actor: End customers and investors
          channel: Post-delivery operating data
          touchpoints:
            - No public retention, renewal, or active-use cohort data in assigned evidence
            - Demand is ahead of verified recurring usage
    approximationNotes: >-
      Stages describe observed commercialization steps from the assigned evidence; they do
      not imply conversion rates.
    claimRefs: [CU003, CU004, CU007, CU009, CU010, CU013]
callouts:
  - calloutType: strength
    title: Demand proof is better than logo proof
    body: >-
      The order book is still pre-fulfillment, but AeroHT has public intent-order counts
      and named overseas counterparties rather than relying only on unnamed customer
      logos.
    claimRefs: [CU004, CU009, CU010]
  - calloutType: risk
    title: The missing durability data is the real underwriting gap
    body: >-
      Public sources do not show renewals, cancellations, utilization, or cohort
      behavior, so current customer evidence is better treated as pipeline quality than
      as recurring-demand proof.
    claimRefs: [CU011, CU013]
