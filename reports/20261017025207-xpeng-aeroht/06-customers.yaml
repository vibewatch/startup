  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: Public NRR, GRR, churn, renewal, utilization, or cohort data for delivered customers.
      whyItMatters: Without durability data, the order book cannot be underwritten as recurring adoption.
      diligencePath: Request customer cohort, cancellation, renewal, and active-use metrics from management or reference customers.
      relatedQuestionRefs: [QU005]
    - type: private-evidence-only
      severity: material
      topic: order-conversion
      missingEvidence: Deposit terms, cancellation rights, and paid-versus-nonbinding split within the 7,000 cumulative orders.
      whyItMatters: Conversion quality determines whether headline orders represent revenue visibility or marketing demand.
      diligencePath: Obtain order-book waterfall by deposit status, contract form, customer geography, and expected delivery year.
      relatedQuestionRefs: [QU003, QU008]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: Customer concentration by geography, distributor, and end-customer type after the named Middle East batch.
      whyItMatters: A concentrated channel or geography can magnify regulatory or execution shocks.
      diligencePath: Ask for top-customer and top-channel concentration, partner economics, and regional pipeline mix.
      relatedQuestionRefs: [QU008]
      relatedTableRefs: [TU003]
    - type: conflicting-data
