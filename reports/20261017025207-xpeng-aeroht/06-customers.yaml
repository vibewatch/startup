        - Included in company-stated 600-order batch
        - No unit split, deposit status, or operating proof disclosed
      - - Almana Group
        - Qatar distributor / channel partner
        - Part of first Middle East flying-car order batch
        - Order agreement, not delivered fleet
        - Included in company-stated 600-order batch
        - No unit split, deposit status, or operating proof disclosed
      - - AlSayer Group
        - Kuwait distributor / channel partner
        - Part of first Middle East flying-car order batch
        - Order agreement, not delivered fleet
        - Included in company-stated 600-order batch
        - No unit split, deposit status, or operating proof disclosed
      - - Chinese General Chamber of Commerce UAE
        - UAE business association / channel-linked counterparty
        - Part of first Middle East flying-car order batch
        - Order agreement, not delivered fleet
        - Included in company-stated 600-order batch
        - End-customer identity and usage intent not disclosed
    notes: >-
      This is a partial enumeration of named counterparties disclosed in one company-
      stated order announcement; it is stronger than anonymous logos but still not proof
      of delivered production deployment.
