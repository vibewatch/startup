      Values are copied as disclosed in assigned sources; they are not normalized into a
      delivered-customer metric, and missing denominators reflect absent deposit,
      conversion, or active-use data.
    claimRefs: [CU004, CU005, CU006, CU007, CU009, CU010, CU013]
