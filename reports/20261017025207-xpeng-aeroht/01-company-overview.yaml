figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Public milestones show a shift from concept unveiling to factory and
      certification execution, but the path to paid commercial operations
      remains incomplete.
    data:
      items:
        - date: "2013"
          label: Origin of AeroHT program
          detail: Public reporting traces the business back to 2013.
          tone: neutral
        - date: "2020"
          label: Formal establishment under XPeng
          detail: CnEVPost says the unit was officially established in 2020 as a majority-owned XPeng technology division in Guangzhou.
          tone: neutral
        - date: "2021-10"
          label: Series A funding anchor
          detail: Third-party reports place Series A at more than $500 million with a pre-money valuation above $1 billion.
          tone: positive
        - date: "2023-10-24"
          label: Modular flying-car path unveiled
          detail: XPeng Tech Day publicly set out the modular flying-car development path.
          tone: positive
        - date: "2024-03-21"
          label: Type-certificate application accepted
          detail: The X3-F air module's TC application was accepted and later moved into compliance determination.
          tone: positive
        - date: "2024-08-05"
          label: Series B1 announced
          detail: AeroHT announced $150 million in B1 funding and launched the B2 round.
          tone: positive
        - date: "2024-10"
          label: Guangzhou plant construction began
          detail: Public reporting tied the new facility to 10,000-unit annual planned capacity.
          tone: positive
        - date: "2025-05-09"
          label: Production-certificate application accepted
          detail: CAAC accepted the production-certificate application for the Land Aircraft Carrier air module.
          tone: positive
        - date: "2025-07-15"
          label: Series B completed and factory topped out
          detail: CnEVPost reported the full $250 million Series B close and said the factory was topped out for Q4 2025 completion.
          tone: positive
        - date: "2025-10-12"
          label: Aridge rebrand and overseas order claims
          detail: The company unveiled the Aridge brand in Dubai and claimed a first Middle East batch of 600 orders plus 7,000 cumulative orders.
          tone: warning
    claimRefs: [CO001, CO004, CO006, CO007, CO010, CO011, CO014, CO016]
