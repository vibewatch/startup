      - ["He Xiaopeng", "Chairman-level sponsor", "Acts as public champion for financing and factory milestones", "Funding and plant updates are attributed directly to He Xiaopeng in recent reporting", "Clarify formal governance rights, vetoes, and succession planning."]
      - ["Series A investors", "Historic equity backers", "October 2021 financing provided the first disclosed >$500 million external capital base", "Third-party reports anchor the Series A amount and valuation but not the investor roster", "Obtain named investors, board rights, liquidation preferences, and follow-on participation."]
