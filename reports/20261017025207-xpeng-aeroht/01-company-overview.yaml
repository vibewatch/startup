      - ["He Xiaopeng", "XPeng chairman and public AeroHT sponsor", "Parent-company chairman who publicly communicates financing and factory progress", "Connects AeroHT to XPeng capital, manufacturing credibility, and strategic direction", "High; group sponsorship and capital access appear closely linked to He and XPeng control."]
      - ["Du Chao", "First CFO", "Former Deutsche Bank banker with overseas IPO and cross-border M&A experience", "Adds capital-markets and public-listing readiness capability that AeroHT previously lacked in public reporting", "Medium; finance bench depth beyond Du is not visible in the public record."]
      - ["Qiu Mingquan", "Vice-president", "Senior executive quoted on adoption timing for modular flying cars", "Provides operating voice on commercialization cadence and realistic deployment constraints", "Medium; public evidence shows role visibility but not full remit or succession depth."]
    notes: >-
      Publicly named leadership only; this is not a full board or org-chart
      disclosure and should not be treated as exhaustive governance evidence.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly named executives and spokespeople visible in the assigned
