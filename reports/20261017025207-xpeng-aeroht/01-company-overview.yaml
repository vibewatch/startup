company:
  name: Xpeng AeroHT
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Xpeng AeroHT is XPeng's Guangzhou-based flying-car division, building the
    modular Land Aircraft Carrier around a 2026 mass-production target rather
    than current commercial revenue. Public evidence supports meaningful factory,
    certification, and financing progress, but the refreshed underwriting still
    depends on undisclosed valuation terms, unverified order quality, and CAAC
    approvals that extend beyond today's production-certificate milestone.
sections:
  - id: identity-and-product
    title: Identity and product scope
    body: >-
      Public reporting continues to describe Xpeng AeroHT as a Guangzhou-based,
      majority-XPeng flying-car unit that originated in 2013 and was formally
      established in 2020. The canonical product for later chapters is the Land
      Aircraft Carrier: a modular system pairing a road-going ground module with
      a detachable eVTOL air module, first positioned publicly at XPeng's
      October 2023 tech day. That positioning matters because later commercial
      claims should be read as pre-delivery scale-up, not as proof of current
      operating revenue or delivered customer fleets. Even the strongest recent
      public evidence is about capacity, certification, and orders-in-queue
      rather than recognized sales or disclosed unit economics.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person dependence
    body: >-
      Leadership visibility is concentrated around founder-president Zhao Deli,
      XPeng chairman He Xiaopeng, and newly appointed CFO Du Chao. That gives
      the business clear automotive, capital-markets, and founder sponsorship,
      but it also highlights concentration risk: the public record still does
      not expose a full board roster, minority protections, or the practical
      boundary between AeroHT and XPeng group control. The refreshed evidence is
      therefore good enough to map executive accountability and stakeholder
      influence, but not good enough to treat governance as independently
      diligenced.
    claimRefs: [CO002, CO012, CO013, CO016]
    tableRefs: [TO002, TO003]
  - id: capital-and-scale
    title: Capital base and scale indicators
    body: >-
      The clearest refreshed scale signal is financing plus factory ambition,
      not realized output. CnEVPost reported a completed $250 million Series B
      in July 2025 after the August 2024 B1 round, while older reporting still
      anchors the October 2021 Series A at more than $500 million and a
      pre-money valuation above $1 billion. Management has also kept repeating a
      price target below RMB 2 million and a plant design capacity of 10,000
      units annually. Those are useful benchmarks for later valuation work, but
      they remain target-state indicators: refreshed public sources still do not
      disclose revenue, gross margin, headcount, or an updated post-Series-B
      valuation mark.
    claimRefs: [CO006, CO008, CO009, CO010, CO011]
  - id: milestones-and-open-risks
    title: Milestones and open execution risks
    body: >-
      The milestone pattern is encouraging but still conditional. The production
      base has been topped out, the air module's production-certificate
      application has been accepted, and public timelines still point to 2026
      deliveries. At the same time, Electrek notes that commercial charging
      operations still need further CAAC approvals, and the newest branding and
      order headlines come from company-claimed statements rather than audited
      disclosures. In other words, Xpeng AeroHT has moved beyond concept-stage
      theater, but the remaining certification path, order quality, and funding
      transparency still define the diligence edge.
    claimRefs: [CO007, CO008, CO014, CO015, CO016]
    figureRefs: [FO001]
