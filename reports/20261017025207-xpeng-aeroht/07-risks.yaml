company:
  name: Xpeng AeroHT
chapter:
  number: 7
  title: Risks
  summary: >-
    AeroHT's top residual risk is still regulatory sequencing: public evidence shows progress on
    type and production certification, but commercial service still depends on further CAAC
    approvals and the delivery target has already slipped from 2025 Q4 to 2026. Manufacturing
    proof and fresh financing improve credibility, yet current evidence still reflects pilot-line,
    partner-led scenario deployments and process mitigations rather than externally validated
    in-service reliability, deposit conversion, or unit-economics proof.
sections:
  - id: certification-gating
    title: Certification remains the gating risk to commercialization
    body: >-
      The clearest thesis-break risk is that AeroHT still has not shown a straight line from
      certification progress to revenue-generating operations. EVMagz said the X3-F air module's
      type-certificate process had advanced to compliance confirmation by May 2025, and both
      EVMagz and Electrek reported that the production-certificate application had been accepted.
      That is genuine progress, but the same coverage says commercial operations still require an
      Airworthiness Certificate and an Air Operator Certificate from CAAC. Delivery guidance has
      also moved: a January 2024 company release cited 2025 Q4 deliveries, while later independent
      coverage pointed to 2026. That combination makes certification timing, not product concept,
      the main gating variable for the investment case.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: manufacturing-ramp
    title: Factory milestones help, but scaled-output proof is still early
    body: >-
      AeroHT has moved beyond renderings and trade-show demos, yet the public record is still
      closer to industrial preparation than full-rate production. EVMagz said the mass-production
      plant was 70% complete in May 2025 with full completion expected in Q4 2025, and Gasgoo
      later reported that five Land Aircraft Carrier units had rolled off the trial production
      line. Gasgoo also described a roughly 120,000-square-meter factory and a design goal of one
      aircraft every 30 minutes at full capacity. Those are meaningful milestones, but they remain
      company-linked execution claims rather than audited proof of sustained throughput, yield, or
      field reliability, so operational ramp risk stays high until repeated customer deliveries and
      support performance become public.
    claimRefs: [CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: dependency-and-model-risk
    title: Deployment depends on external partners, policy venues, and patient capital
    body: >-
      AeroHT's rollout is not a pure product sale; it depends on ecosystems that the company does
      not fully control. TropicalHainan said Hainan scenario rollout relies on agreements with more
      than 40 campsites and a multi-year buildout plan, while Gasgoo said Haixinsha Tech Island
      operations are being co-built with Guangzhou City Investment Group and CEPREI. Financing also
      remains part of the operating thesis: Urban Air Mobility News reported a USD 250 million
      Series B tied to accelerating production, and New Atlas cited RMB 6 billion of bank credit
      from four banks. Those supports reduce near-term execution pressure, but they also mean
      partner alignment, local policy support, and capital-market follow-through are material
      dependencies rather than background conditions.
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
  - id: mitigations-and-kill-criteria
    title: Visible mitigations are real, but kill criteria should stay measurable
    body: >-
      The public mitigation story is credible but still process-heavy. TropicalHainan highlighted
      full-redundancy safety systems, Vertical's company-issued launch release said the electric
      propulsion system meets single-point-failure safety requirements, and China Daily described a
      plant traceability system intended to track components through final assembly. Those measures
      matter, but they are not substitutes for public reliability, revenue, or conversion data.
      Investors should treat the thesis as broken if CAAC sequencing extends beyond the company's
      2026 delivery window, if pilot-line output fails to translate into repeatable commercial
      deliveries, if scenario partners do not convert into real paid utilization, or if AeroHT
      cannot disclose deposits, unit economics, and working-capital needs for the Land Aircraft
      Carrier program.
    claimRefs: [CR003, CR006, CR014, CR015, CR016]
