slug: xpeng-aeroht
runDate: "2026-10-17"
company:
  name: Xpeng AeroHT
chapter:
  number: 8
  title: Valuation
  summary: >-
    Xpeng AeroHT has more underwriting evidence than a typical pre-delivery eVTOL program:
    it has public 2026 delivery guidance, visible factory and certification milestones,
    additional financing, and company-reported order signals. The decisive missing inputs are
    still price-setting ones — no fresh post-money valuation, no disclosed preference stack,
    and no public revenue or deposit-conversion data — so the evidence supports a track call
    rather than underwriting a round blindly.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: |-
      The public record supports a **track** recommendation with **medium confidence**, a **high**
      risk rating, and an **unknown** valuation stance. The positive side of the file is real:
      AeroHT still guides to 2026 deliveries at a sub-RMB2 million list price, has advanced its
      certification work, and has kept funding and factory buildout moving. The problem is that
      the decision-critical underwriting inputs remain undisclosed. The reviewed financing
      summaries discuss dollars raised, not the post-money mark, security type, or liquidation
      preference stack, so there is no defensible target return or hold-period underwriting case
      from public evidence alone.
      
      Because the disclosure set is still milestone-heavy rather than financial, the right entry
      discipline is to wait for one of two things: either a fresh priced round with plain-vanilla
      terms and updated operating KPIs, or a later commercial-readiness point where certification,
      deposit conversion, and production throughput are observable enough to underwrite execution
      risk directly. Until then, the most supportable stance is that AeroHT may be strategically
      interesting, but not yet priceable.
    claimRefs: [CV001, CV004, CV005, CV009, CV010, CV011, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: evidence-for-and-against-underwriting
    title: Evidence for and against underwriting
    body: |-
      The pro-underwriting case is based on execution proof, not financial proof. China Daily,
      Airframer, and Gasgoo each point to real manufacturing progress: a Guangzhou base sized for
      more than 10,000 annual units, structural completion of the main shops, and trial-production
      milestones around the power system and plant. Order signals have also become stronger over
      time, moving from 2,000 cited orders in late 2024 to a later company-linked claim of 7,000
      cumulative orders and a first 600-unit Middle East batch. Those datapoints matter because
      they suggest AeroHT is building supply, channel, and customer interest in parallel.
      
      The anti-thesis is that none of those public datapoints closes the core underwriting gap.
      Commercial operations still require additional CAAC approvals, the schedule has already
      slipped from earlier guidance, and the order figures are not paired with deposit conversion,
      cancellation, ASP realization, or gross-margin disclosure. In other words, public evidence
      supports commercialization momentum, but not yet investable price certainty.
    claimRefs: [CV002, CV005, CV006, CV007, CV008, CV012, CV013]
    tableRefs: [TV002]
  - id: scenario-frame-and-comparable-discipline
    title: Scenario frame and comparable discipline
    body: |-
      A conventional revenue-multiple framework is not supportable because AeroHT still does not
      disclose revenue, margin, or unit-economics data in the reviewed sources. The more
      appropriate public frame is milestone-based: what has the company proven on certification,
      manufacturing readiness, financing continuity, and customer pull, and what external
      reference points exist for adjacent aircraft pricing or ecosystem support? On that basis,
      the public evidence supports a staged view rather than a single fair-value point.
      
      The useful external references in this source pack are limited but directionally helpful.
      New Atlas cites EHang's $410,000 international EH216-S list price as a public aircraft
      pricing reference and separately describes substantial Guangzhou/Guangdong low-altitude
      policy support through 2026. Those references help validate that AeroHT is building inside
      a funded ecosystem and may not be absurdly priced at the product level, but they still do
      not substitute for a current equity mark or preference analysis at the company level.
    claimRefs: [CV001, CV010, CV011, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: final-diligence-asks-and-thesis-breakers
    title: Final diligence asks and thesis-breakers
    body: |-
      The next diligence pass should focus on closing the variables that actually move the
      investment call. First, AeroHT needs to provide the latest financing documents or a fresh
      board-approved valuation mark, including security type, liquidation preferences, and any
      XPeng-related rights that could subordinate new money. Second, management should disclose a
      simple commercialization funnel: orders, deposits, cancellations, conversion to signed
      purchase contracts, expected delivery cadence, and gross-margin expectations on both the air
      and ground modules. Third, the company should supply a dated certification tracker showing
      what remains after the type-certificate and production-certificate milestones.
      
      The thesis breaks if any of three things happen: the 2026 delivery target slips again, the
      next round is priced as a markup without new proof on conversion or approvals, or the
      eventual cap-table terms introduce enough preference or structured downside to absorb most of
      the upside from a first commercial launch. Any of those would confirm that the current
      public narrative is ahead of the investable reality.
    claimRefs: [CV002, CV004, CV005, CV011, CV013]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Recommendation
      - Confidence
      - Risk rating
      - Valuation stance
      - Decision implication
    rows:
      - [track, medium, high, unknown, "Wait for a fresh priced round or equivalent valuation mark plus updated certification and conversion evidence before underwriting."]
    notes: >-
      Public evidence supports milestone progress but not a defendable equity valuation range,
      target return, or hold-period case because post-money terms and operating KPIs remain
      undisclosed.
    claimRefs: [CV001, CV005, CV010, CV011]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Argument
      - Evidence anchor
      - What would change the view
    rows:
      - [Thesis, "Factory buildout is tangible.", "Guangzhou manufacturing plans target >10,000 annual units, with major shop completion and trial-production milestones already reported.", "A slip in plant completion, throughput readiness, or supplier readiness would weaken this pillar."]
      - [Thesis, "Financing momentum is still present.", "Public reporting shows a $250 million Series B and a later nearly $200 million equity round that pushed total equity financing to roughly $1 billion.", "A structured round with heavy preferences or insider-only support would make the capital story less constructive."]
      - [Thesis, "Customer interest is building.", "Publicly cited order signals progressed from 2,000 orders in late 2024 to a later company-linked 7,000 cumulative figure and a first 600-unit Middle East batch.", "Low deposit conversion, high cancellations, or reseller-heavy orders would reduce underwriting weight."]
      - [Anti-thesis, "Commercial readiness is not complete.", "Paid operations still require additional CAAC approvals beyond the type- and production-certificate milestones already cited.", "A dated path to Airworthiness Certificate and Air Operator Certificate would reduce this risk."]
      - [Anti-thesis, "The schedule has already moved once.", "2026 commercialization guidance reflects a delay from earlier 2025 expectations.", "On-time prototype, certification, and delivery milestones through 2026 would offset the delay concern."]
      - [Anti-thesis, "The round is not priceable from public data.", "Reviewed round summaries disclose capital raised but not the post-money valuation, security type, or preference overhang.", "A fresh priced round or audited board mark with plain-vanilla terms would materially improve the call."]
    notes: >-
      The thesis rows summarize underwriting positives; the anti-thesis rows isolate what would
      most directly change the recommendation if public disclosure improves.
    claimRefs: [CV002, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "2026 deliveries start on schedule, CAAC commercialization approvals clear on time, and order conversion proves real demand.", "Only then would a premium to the latest primary price be defensible, and only after that primary price is actually disclosed.", "Certification timing, yield ramp, and channel quality remain the gating risks.", "Would require new disclosure on approvals, conversion, and round terms."]
      - [Base, "Factory and financing momentum continue, but public KPI disclosure remains incomplete while commercialization is still in rollout.", "The most supportable stance is flat-to-disciplined entry relative to the latest disclosed primary round once that round's actual valuation and preferences are available.", "Opacity on cap table, margins, and delivery cadence keeps the return case constrained.", "Best match to today's evidence set."]
      - [Bear, "Another schedule slip, weak order conversion, or preference-heavy financing arrives before scaled deliveries.", "Fair value moves into down-round or structured-financing territory, and new money would need strong downside protection.", "Execution misses, approval slippage, and financing asymmetry are the downside triggers.", "Becomes likely if 2026 milestones move or disclosure quality worsens."]
    notes: >-
      This scenario table is intentionally qualitative because the reviewed source pack does not
      disclose a current equity valuation, revenue base, or margin profile sufficient for a
      numeric enterprise-value range.
    claimRefs: [CV001, CV002, CV005, CV008, CV010, CV011, CV014, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Manufacturing and demand signals are improving, but certification and pricing opacity still dominate the decision path.
    data:
      nodes:
        - id: policy
          label: Policy tailwind
          detail: Guangdong and Guangzhou continue funding low-altitude-economy buildout through 2026.
        - id: execution
          label: Factory and capital proof
          detail: Public sources show 10,000-unit manufacturing ambition plus roughly $1 billion of cumulative equity financing.
        - id: demand
          label: Early order signal
          detail: Company-linked disclosures cite 2,000 orders by late 2024 and 7,000 cumulative orders by late 2025.
        - id: readiness
          label: Commercialization gates remain
          detail: Paid operations still need additional CAAC approvals, and the schedule has already slipped once.
          tone: warning
        - id: pricing
          label: No fresh equity mark
          detail: Reviewed financing summaries disclose dollars raised, not post-money valuation or preference terms.
          tone: warning
        - id: call
          label: Recommendation = track
          detail: Re-underwrite after fresh valuation disclosure and cleaner proof on certification and conversion.
      edges:
        - from: policy
          to: execution
          label: Ecosystem support helps scale supply
        - from: execution
          to: demand
          label: Buildout supports customer story
        - from: demand
          to: readiness
          label: Orders still depend on approvals
        - from: readiness
          to: pricing
          label: Execution risk limits price confidence
        - from: pricing
          to: call
          label: Missing terms keep the call on hold
    claimRefs: [CV002, CV005, CV006, CV010, CV011, CV012, CV013, CV014, CV015]
callouts:
  - calloutType: recommendation
    title: Public-evidence call
    body: >-
      Track the company, but do not underwrite a round from public evidence alone until the next
      financing discloses an actual price and terms or AeroHT discloses enough operating KPIs to
      underwrite commercialization risk directly.
    claimRefs: [CV005, CV010, CV011]
  - calloutType: risk
    title: What could still break the equity case
    body: >-
      The biggest downside is not lack of ambition; it is that valuation opacity, approval timing,
      and order-conversion quality can each erase upside before outside investors ever see a clean
      commercial launch.
    claimRefs: [CV002, CV005, CV011, CV013]
