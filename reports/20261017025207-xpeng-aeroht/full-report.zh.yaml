  - id: TV002
    title: 正论 / 反论表
    columns:
      - 视角
      - 论点
      - 证据锚点
      - 哪些变化会改变判断
    rows:
      - - 正论
        - 工厂建设是看得见的进展。
        - 广州制造计划目标是年产 >10,000 台，主要车间完工和试生产里程碑均已有报道。
        - 若工厂完工、产能准备度或供应商准备度延期，这一支柱就会减弱。
      - - 正论
        - 融资势头仍在。
        - 公开报道显示，公司完成 $250 million B 轮融资，之后又完成近 $200 million 股权融资，使股权融资总额达到约 $1 billion。
        - 若融资附带大量优先权，或仅由内部人士支持，资本故事就不再那么积极。
      - - 正论
        - 客户兴趣正在积累。
        - 公开引用的订单信号从 2024 年末的 2,000 个订单，增长到之后与公司相关的累计 7,000 个订单，以及首批 600 台中东订单。
        - 定金转化率低、取消率高或订单主要来自经销商，都会降低投资判断权重。
      - - 反论
        - 商业化准备尚未完成。
        - 除已引用的型号合格证和生产许可证里程碑外，付费运营仍需额外的 CAAC 审批。
        - 若能给出适航证和航空运营人许可证的带日期路径，这一风险会下降。
      - - 反论
        - 时间表已经调整过一次。
        - 2026 年商业化指引反映出，相比早先预计的 2025 年有所延迟。
        - 若 2026 年原型机、认证和交付里程碑按时完成，将抵消延期担忧。
      - - 反论
        - 公开数据无法支持本轮定价。
        - 已审阅的融资摘要披露了募资额，但没有披露投后估值、证券类型或优先权负担。
        - 新一轮定价融资，或条款简单且经审计的董事会估值，将显著改善判断。
    notes: 正论各行总结投资判断中的积极因素；反论各行聚焦于公开披露改善后最可能直接改变建议的因素。
