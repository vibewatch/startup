  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 模块化产品定义与用户流程
        blocks:
          - type: paragraph
            body: >-
              AeroHT 展示的不是通用空中出租车服务，而是一款双模块产品：六轮地面车辆负责携带、收纳、充电并重新对接可折叠 eVTOL
              空中模块。这个设计将客户流程从机场存放和拖运改成驾车前往起飞地点，地面模块同时充当交通平台和充电资产。公开材料也明确了易用性主张：单杆手动操控、自动航线支持、返航辅助，以及地面模块充满电后最多飞行六次。             
              产品叙事最有力之处，是公司能拿出一体化硬件和控制系统的证据；最薄弱之处，则是续航、载荷、调度可靠性和维护间隔仍缺少公开现场数据。
