              - CV016
      - number: '8.4'
        title: 最终尽调要求与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              下一轮尽调应聚焦真正会改变投资判断的变量。第一，AeroHT 需要提供最新融资文件或新的董事会批准估值，包括证券类型、清算优先权，以及任何可能使新资金劣后的 XPeng
              相关权利。第二，管理层应披露一条简单的商业化漏斗：订单、定金、取消、转为已签采购合同的比例、预期交付节奏，以及空中和地面模块的毛利率预期。第三，公司应提供带日期的认证跟踪表，说明型号证书和生产许可证里程碑之后还剩什么。


              如果出现三种情况中的任何一种，论点就会被破坏：2026
              年交付目标再次推迟；下一轮在没有转化或审批新证明的情况下以加价估值定价；或最终资本表条款引入足够的优先权或结构化下行，使首次商业化带来的大部分上行空间被吸收。任何一种情况都将确认，当前公开叙事领先于可投资现实。
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV011
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 公开证据结论
            body: 继续跟踪这家公司，但在下一轮融资披露实际价格和条款，或 AeroHT 披露足够运营 KPI、能够直接评估商业化风险之前，不要仅凭公开证据评估一轮融资。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV010
              - CV011
          - type: callout
            title: 仍可能破坏股权逻辑的因素
            body: 最大下行风险不是缺乏雄心，而是估值不透明、审批时间和订单转化质量中的任何一项，都可能在外部投资者看到清晰的商业化之前抹去上行空间。
            calloutType: risk
            claimRefs:
              - CV002
              - CV005
              - CV011
              - CV013
