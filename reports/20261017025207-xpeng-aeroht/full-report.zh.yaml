  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：相邻空中交通与现有道路交通
        blocks:
          - type: paragraph
            body: >-
              指定证据显示，这是一个分散的竞争领域，而不是一份清晰的直接竞品名单。AeroHT 的 Land Aircraft Carrier 将六轮地面模块与可拆卸双座 eVTOL
              结合，处在高端电动车与个人飞行器之间的混合品类。最明确的替代品，一边是 Tesla Model Y、Model 3、Cybertruck 及支持 FSD 的电动车体系等现有高端车辆，另一边是 EHang
              AAV、Atea 混合电动飞行器和 Valkyrie 私人飞行器等相邻个人航空产品。这一点很重要：富裕买家不只是在“AeroHT
              还是另一辆飞行汽车”之间选择；他们可以继续使用成熟电动车、购买独立飞行器，或等待品类稳定。AeroHT 打造新品类的雄心真实存在，但实际竞争集合比直接 eVTOL 品牌更广。
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP008
              - CP013
