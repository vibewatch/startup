    及相关低空交通飞行器。公司显然已经走出概念展示阶段：工厂建设、认证节点和可见的订单兴趣均已出现；但它仍处于交付前阶段，经济模型不透明，当前收入未披露，商业运营路径也仍取决于后续条件。
