        title: 公司身份与产品范围
        blocks:
          - type: paragraph
            body: >-
              公开报道仍将 Xpeng AeroHT 描述为一家总部位于广州、由 XPeng 控股的飞行汽车部门，2013 年起步并于 2020 年正式成立。后文的核心产品是 Land Aircraft
              Carrier：将公路行驶的地面模块与可拆卸 eVTOL 空中模块结合的模块化系统，最早在 XPeng 2023 年 10
              月科技日公开亮相。这个定位很重要：后续商业化说法应理解为交付前的扩张，而不是当前运营收入或已交付客户车队的证明。近期最强的公开证据仍集中于产能、认证和排队订单，而非确认销售额或披露的单位经济性。
