  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界比政策叙事更窄
        blocks:
          - type: paragraph
            body: >-
              中国低空经济的宏大叙事明显大于 AeroHT
              近期可投资的市场。广东和广州正在投入推动品类级政策，但公司销售的仍是模块化飞行器加汽车产品，初期用途受指定运营区域、基础设施建设和航空认证约束。如今实际的评估边界，是政策大框架内的高端低空交通细分市场，而不是城市地面交通或大众汽车需求的普遍替代品。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs: []
      - number: '2.2'
        title: 可以用代理口径估算，但没有经审计的品类规模
        blocks:
          - type: paragraph
            body: >-
              指定来源支持多种规模口径，但分母各不相同。政策规划描述宽泛的低空经济；AeroHT
              的生产计划定义更窄的公司供给上限；声称的订单数因定金、取消和买方构成未披露，只能作为粗略需求信号。合起来看，只要认证和转化率保持，这一细分市场足够大；但单一笼统的 TAM 标题会夸大评估精度。
