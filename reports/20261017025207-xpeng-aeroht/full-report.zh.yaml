              身上。这为业务带来清晰的汽车、资本市场和创始人支持，但也凸显集中风险：公开记录仍没有完整董事会名单、少数股东保护措施，或 AeroHT 与 XPeng
              集团控制之间的实际边界。因此，更新后的证据足以勾勒高管责任和利益相关方影响，却不足以把治理视为已独立完成尽调。
