      - number: '1.3'
        title: 资本基础与规模指标
        blocks:
          - type: paragraph
            body: >-
              最新的规模信号最清楚地体现在融资和工厂规划，而不是实际产出。CnEVPost 报道称，公司在 2024 年 8 月 B1 轮之后于 2025 年 7 月完成 $250m B 轮融资；较早报道仍将 2021 年
              10 月 A 轮金额锚定在 $500m 以上，投前估值超过 $1b。管理层也持续重复低于 2m 元人民币的价格目标和年产 10,000
              辆的工厂设计产能。这些可作为后续估值工作的基准，但仍是目标状态指标：更新后的公开来源仍未披露收入、毛利率、员工数或更新后的 B 轮投后估值。
            claimRefs:
              - CO006
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.4'
        title: 里程碑与未解决的执行风险
        blocks:
          - type: paragraph
            body: >-
              里程碑进展令人鼓舞，但仍取决于后续条件。生产基地已封顶，空中模块的生产许可证申请已获受理，公开时间表仍指向 2026 年交付。与此同时，Electrek 指出，商业载客运营仍需获得 CAAC
              的进一步批准，最新品牌和订单消息也来自公司自述，而非审计披露。换句话说，Xpeng AeroHT 已走出概念展示阶段，但剩余认证路径、订单质量和融资透明度仍是尽调的关键边界。
