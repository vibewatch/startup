  - id: FE001
    title: 陆地航母控制与生产栈
    type: stack
    summary: 该产品把道路载体、自动对接系统、eVTOL 机体、飞行软件和航空式工厂控制整合进一套运营栈。
    data:
      layers:
        - label: 用户任务层
          detail: 公开流程从驾车前往起飞地点开始，随后执行短程低空任务并重新对接，而不是长期依赖机场基地。
          outputs:
            - 驾车前往起飞地点
            - 执行低空任务
            - 重新对接并继续公路行驶
        - label: 地面模块层
          detail: 一辆六轮 800V 增程式车辆负责承载、存放并为飞行器充电，同时保留公司关于日常驾驶能力的主张。
          modules:
            - 5.5m x 2m x 2m 地面模块
            - 后轮转向
            - 移动充电接口
        - label: 对接与操控层
          detail: 自动分离、旋翼折叠、起落架展开和重新连接，是系统集成的核心差异点。
          modules:
            - 机载分离 / 重连系统
            - 14 个执行器
            - 高精度泊车与运动协调
        - label: 空中模块层
          detail: 飞行器采用可折叠双涵道六旋翼布局、碳纤维结构和全景双座座舱。
          modules:
            - 双涵道六旋翼设计
            - 碳纤维机身和螺旋桨
            - 270 度座舱
        - label: 飞行软件与安全层
          detail: 手动和自主模式建立在冗余飞控、导航、边界保护及辅助着陆功能之上。
          modules:
            - 单杆操控
            - 三重冗余电传飞行
            - 电子围栏与自动返航
        - label: 认证与工厂层
          detail: 商业化仍取决于 CAAC 证书推进，以及能够按规模复现获批设计的工厂和质量体系。
          modules:
            - TC 符合性认定
            - PC 申请受理
            - 可追溯生产体系及宣称的 10,000 台产能
    approximationNotes: null
    claimRefs:
