            - 公开载人演示与中国航展曝光
            - 官方“Flying Lifestyle”品牌
        - label: 试用 / 体验
          tone: neutral
          actor: 潜在私人买家
          channel: 公司体验场景
          touchpoints:
            - 官网称“全国 5 类飞行营地”
            - 交付车辆前已能看到体验漏斗
        - label: 预售 / 意向
          tone: positive
          actor: 中国优先的早期买家
          channel: 预售与意向订单
          touchpoints:
            - 截至 2025 年 1 月报道有 3,000 个意向订单
            - 预售与公开演示相联系
        - label: 经销商扩张
          tone: positive
          actor: 中东渠道合作伙伴
          channel: 批量订单协议
          touchpoints:
            - 中东首批 600 台订单
            - 点名 Ali & Sons、Almana、AlSayer 和 CGCC UAE
        - label: 认证与工厂关口
          tone: risk
          actor: AeroHT 与监管机构
          channel: CAAC 认证与制造准备
          touchpoints:
            - 生产许可证申请获受理
            - 仍需适航和运营批准
        - label: 交付使用证明
          tone: risk
          actor: 终端客户与投资者
          channel: 交付后的运营数据
          touchpoints:
            - 指定证据中没有公开留存、续购或活跃使用群组数据
            - 需求领先于已验证的持续使用
    approximationNotes: 各阶段描述指定证据中观察到的商业化步骤；不代表转化率。
    claimRefs:
      - CU003
      - CU004
      - CU007
      - CU009
      - CU010
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险敞口最高的地方，仍是交付时点取决于审批或新生态，而非已被商业化重复验证。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 剩余敞口
      rows:
        - label: CAAC 认证顺序
          values:
            - label: 高
              tone: high
              note: 型号和生产进展可见，但仍有后续审批。
            - label: 严重
              tone: critical
              note: 商业上市时点仍取决于适航证和运营人证。
            - label: 中
              tone: medium
              note: 公开缓释措施更多显示流程进展，而非有日期的放行。
            - label: 高
              tone: high
              note: 顺序延误会直接冲击交付和变现。
        - label: 交付时点可信度
          values:
            - label: 高
              tone: high
              note: 公开指引已从 2025 年第四季度推迟到 2026 年。
            - label: 高
              tone: high
              note: 再次延期会削弱市场对执行规划的信心。
            - label: 中
              tone: medium
              note: 工厂和测试里程碑有所帮助，但没有填平排期缺口。
            - label: 高
              tone: high
              note: 市场仍缺少证据证明新目标足够保守。
        - label: 工厂爬坡与质量
          values:
            - label: 中
              tone: medium
              note: 有试生产线证据，但持续吞吐仍未得到证明。
            - label: 高
              tone: high
              note: 产量、良率或质保未达预期都会延迟商业化。
            - label: 中
              tone: medium
              note: 可追溯性和新设施可见，但没有现场指标。
            - label: 高
              tone: high
              note: 在公开重复交付前，工业化风险仍然偏高。
        - label: 场地与伙伴依赖
          values:
            - label: 高
              tone: high
              note: 早期使用场景依赖营地和公共部门场地。
            - label: 中
              tone: medium
              note: 伙伴受挫会减缓部署覆盖，而不是影响产品存在本身。
            - label: 中
              tone: medium
              note: AeroHT 有多个具名伙伴，但没有广泛的独立需求证明。
            - label: 高
              tone: high
              note: 在付费使用超出演示并实现规模化前，利用率风险仍高。
        - label: 资本密集度与资金续航
          values:
            - label: 中
              tone: medium
              note: 近期融资和银行授信缓解了眼前压力。
            - label: 高
              tone: high
              note: 工厂完工和商业化仍需要耐心资本。
            - label: 中
              tone: medium
              note: 资金支持可见，但当前烧钱速度和营运资金需求并未披露。
            - label: 高
              tone: high
              note: 缺少收入和定金数据，使模型风险维持高位。
        - label: 高端定价下的需求转化
          values:
            - label: 中
              tone: medium
              note: 有公开目标价格，但没有转化和定金数据。
            - label: 高
              tone: high
              note: 需求疲弱会损害制造利用率和资本效率。
            - label: 低
              tone: low
              note: 公开缓释措施主要是传播放话，而不是披露订单质量。
            - label: 高
              tone: high
              note: 在预售转化为交付车辆前，投资判断仍属推测。
    claimRefs:
      - CR003
      - CR006
      - CR012
      - CR014
      - CR015
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 制造和需求信号正在改善，但认证和定价透明度仍主导决策路径。
    data:
      nodes:
        - id: policy
          label: 政策顺风
          detail: 广东和广州持续为低空经济建设提供资金支持，延续至 2026 年。
        - id: execution
          label: 工厂与资本证明
          detail: 公开来源显示，公司有 10,000 台产能目标，累计股权融资约 $1 billion。
        - id: demand
          label: 早期订单信号
          detail: 公司相关披露称，截至 2024 年末有 2,000 个订单，截至 2025 年末累计订单达 7,000 个。
        - id: readiness
          label: 商业化关口仍在
          detail: 付费运营仍需额外的 CAAC 审批，且排期已经延期过一次。
          tone: warning
        - id: pricing
          label: 没有新的股权估值锚点
          detail: 审阅过的融资摘要披露了募资金额，但没有投后估值或优先权条款。
          tone: warning
        - id: call
          label: 建议 = 跟踪
          detail: 待新的估值披露，以及认证和转化有更清晰证据后重新评估投资判断。
      edges:
        - from: policy
          to: execution
          label: 生态支持有助于扩大供给
        - from: execution
          to: demand
          label: 建设进度支撑客户故事
        - from: demand
          to: readiness
          label: 订单仍取决于审批
        - from: readiness
          to: pricing
          label: 执行风险限制价格信心
        - from: pricing
          to: call
          label: 条款缺失使结论暂缓
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
