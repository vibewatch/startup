              - CM014
      - number: '2.3'
        title: 早期采用者指向富裕车主与运营商主导的体验
        blocks:
          - type: paragraph
            body: >-
              买方证据首先指向高收入、可选消费型买家，以及能在获批区域将短途体验式飞行变现的运营商。现有证据还不能说明 AeroHT
              是日常通勤或大众运输产品。更有支撑的采用路径是富裕车主兼运营商、旅游和演示合作伙伴、特殊用途车队及出口分销商；这些客户能承受高客单价和狭窄的运营边界，等待品类标准化以及审批和基础设施跟上。
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
          - type: table
            tableRef: TM003
            claimRefs: []
      - number: '2.4'
        title: 认证时间与证据缺口仍决定市场逻辑
        blocks:
          - type: paragraph
            body: >-
              市场的核心问题不是 AeroHT
              能否吸引注意力，而是热点兴趣能否在有意义的时间表内转化为可变现运营。电池和运营取舍塑造了模块化产品，公开报道仍显示审批未完成、使用场景受限，订单质量和客群构成也披露不完整。因此，投资判断只能建立在边界清晰、明确标注限定条件的代理口径上，不能依赖清晰发布的
              SAM、可辩护的近期 SOM 或订单支撑的收入预测。
