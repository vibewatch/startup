      - number: '3.2'
        title: 能力与价格对比更凸显新颖性而非简单易用
        blocks:
          - type: paragraph
            body: >-
              公开价格把 AeroHT 放在特种车辆区间，而非大众交通赛道。多个来源将 Land Aircraft Carrier 的价格集中在 200 万元人民币以下，约 $280000 至 $300000
              美元；相邻报道则以数千笔预售或意向订单描述需求，而非已交付车队规模。这种组合指向富裕早期用户、爱好者和少数机构特殊场景，而非日常通勤者。相比高端电动车替代品，AeroHT
              提供差异化的多模态体验，但买方也要承担航空准备度、存放、培训和本地运营限制。相比相邻飞行器，AeroHT 受益于地面模块和 XPeng
              关联产品的熟悉度；但现有证据不足以证明各替代方案在价格或服务打包上足够透明，因而不能声称具有持久的价值优势。
