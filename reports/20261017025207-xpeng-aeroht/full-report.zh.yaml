  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 2026 年按计划开始交付，CAAC 商业化审批按时通过，订单转化证明需求真实存在。
        - 只有在那之后，才有理由对最新一轮一级市场价格给予溢价；而且前提是该一级市场价格确实已经披露。
        - 认证时间、良率爬坡和渠道质量仍是决定性风险。
        - 需要新增审批、转化和融资条款披露。
      - - 基准
        - 工厂和融资势头延续，但商业化仍在落地，公开 KPI 披露依然不完整。
        - 一旦最新披露的一级市场融资轮的实际估值和优先权可得，最有依据的立场是相对该轮采取持平至克制的进入策略。
        - 股权结构表、利润率和交付节奏不透明，回报判断因此受限。
        - 最符合当前证据集。
      - - 看跌
        - 在规模化交付前再次延期、订单转化疲弱，或出现偏好性强的融资。
        - 公允价值跌入下轮融资或结构化融资区间，新资金需要很强的下行保护。
        - 执行未达预期、审批延期和融资不对称是下行触发因素。
        - 如果 2026 年里程碑延期或披露质量恶化，该情景就可能出现。
    notes: 这张情景表有意采用定性表达，因为审阅过的资料没有披露当前股权估值、收入基数或足以支持数值化企业价值区间的利润率情况。
    claimRefs:
