              - CP013
      - number: '3.3'
        title: 持久性取决于认证、制造与买方教育
        blocks:
          - type: paragraph
            body: >-
              这个领域最强的护城河信号来自执行，而不是锁定机制。AeroHT
              已取得重要认证里程碑并推进工厂建设，相比概念阶段的交通项目更显得认真。但同一批证据也显示，认证尚未完成，商业运营仍需额外批准，不同来源的公开交付时间也出现变动。现有厂商和替代品不必在模块化设计上击败
              AeroHT；只要 AeroHT
              错过交付窗口、无法把意向订单转成可执行的审批，或这款同时涉及道路所有权和航空合规的产品遭遇市场教育阻力，竞争对手就能胜出。因此，竞争姿态有潜力，但还没有强到能阻止买家同时选择高端电动车、相邻飞行器或后来进入的低空产品。
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 差异化来自架构，而不只是外观
            body: 模块化的道路加空中组合，比单独的 eVTOL 叙事更鲜明，也让 AeroHT 能同时对抗高端电动车的便利性和飞行器的新颖性。
            calloutType: strength
            claimRefs:
              - CP001
              - CP010
          - type: callout
            title: 执行延误是核心替代风险
            body: 公开证据仍显示需要额外审批、交付时间在变化，实际成交价格也没有解决；因此，相邻飞行器和成熟电动车替代品只要更容易购买和使用，就可能胜出。
            calloutType: risk
            claimRefs:
              - CP003
              - CP009
              - CP011
              - CP012
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与需求代理指标
        blocks:
          - type: paragraph
            body: >-
              公开证据仍将 AeroHT 描述为交付前的车辆项目，而不是已有经常性或确认收入的业务。最清晰的变现信号是 Land Aircraft Carrier 低于 2m
              万元人民币的目标标价，历史上预计先在中国预售，再完成认证交付。需求证据存在，但主要来自公司声称：2024 年签约近 60 个飞行汽车营地，随后又称海外协议覆盖 7,000 辆累计订单中的首批 600
              辆。这些数字可能说明商业兴趣，但指定来源未披露定金、取消权、分销商利润或收入确认政策，因此应视为管线，而不是已入账收入。
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
              - CI006
              - CI008
              - CI009
              - CI013
