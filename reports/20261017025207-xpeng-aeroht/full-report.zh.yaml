  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开记录支持 **跟踪** 建议，**中等置信度**、**高**风险评级和**未知**估值判断。积极面是真实存在的：AeroHT 仍指引 2026 年交付，标价低于 200
              万元人民币，认证工作持续推进，融资和工厂建设也在继续。问题是，决定投资的关键评估输入仍未披露。审阅过的融资摘要谈的是募资金额，而不是投后估值、证券类型或优先股堆叠，因此仅凭公开证据无法建立可辩护的目标回报或持有期评估案例。


              由于披露仍以里程碑为主而非财务数据，正确的入场纪律是等待两件事之一：出现条款标准且带有最新运营 KPI
              的新定价轮，或进入更晚的商业准备阶段，认证、定金转化和生产吞吐量已足够可观察，可以直接评估执行风险。在此之前，最有支撑的判断是：AeroHT 可能具有战略吸引力，但尚未能定价。
