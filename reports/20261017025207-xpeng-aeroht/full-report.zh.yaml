      - number: '4.3'
        title: 投资评估视角与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              本章支持谨慎的财务判断：AeroHT
              已筹集大量资本并建立可信的工业里程碑，但公开记录仍不足以评估收入质量、利润率路径或现金跑道。最有支撑的近期模型是，工厂完工且认证通过后，定金或渠道预订转化为一次性硬件销售。仍有几个评估问题未解决：标价能否经受折扣、量产爬坡前还需多少营运资本和模具支出，以及当前订单声称是否由现金定金支持，还是主要只是无约束兴趣。在管理层披露实际
              ASP、单位利润、消耗和流动性前，应把该项目视为依赖执行且对融资敏感，而非自我造血。
            claimRefs:
              - CI004
              - CI009
              - CI013
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
