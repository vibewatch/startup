        title: 展示
        blocks:
          - type: callout
            title: 政策 TAM 不等于可投资需求
            body: 省级低空经济叙事足以吸引资本和合作伙伴，但有证据支持的近期市场要小得多：是在完整商业审批扩大品类之前，能够从获批场地实际飞行的买家和运营商。
