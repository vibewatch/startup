      - number: '4.2'
        title: 资本密集度与上市门槛
        blocks:
          - type: paragraph
            body: >-
              从财务上看，AeroHT 更像资本密集型制造项目的启动，而不是软件公司的规模化故事。China Daily 和后续行业报道将项目与广州一座约 180,000 平方米的专用场地联系起来，设计年产能为 10,000
              辆；Airframer 和 Electrek 则称截至 2025 年年中工厂仅完成约
              70%。产品本身包含增程式地面模块、独立空中模块、安全系统和航空级可追溯性，意味着物料清单更重、验证工作也比普通汽车投产更多。即使型号认证和生产许可证取得进展，付费商业运营仍需 CAAC
              额外批准，因此工厂完工和认证仍是从当前融资走向产生现金的交付之间的主要门槛。
            claimRefs:
              - CI003
              - CI007
              - CI010
              - CI011
              - CI012
              - CI014
