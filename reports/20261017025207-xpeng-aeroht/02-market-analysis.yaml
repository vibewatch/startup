company:
  name: Xpeng AeroHT
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Xpeng AeroHT benefits from a very large, policy-backed Chinese low-altitude
    economy narrative, but the monetizable near-term market evidenced in the
    assigned pool is much narrower: ultra-premium buyer cohorts and operator-led
    tourism or special-use deployments that can tolerate certification,
    infrastructure, and range constraints. Public support is strong enough to
    build proxy sizing lenses from policy targets, plant capacity, and claimed
    orders, but not to defend an independently audited China consumer-eVTOL
    TAM/SAM.
sections:
  - id: market-boundary
    title: Market boundary is narrower than the policy story
    body: >-
      The broad Chinese low-altitude economy narrative is materially larger than
      AeroHT's investable near-term market. Guangdong and Guangzhou are spending
      against a category-level policy push, but the company is still selling a
      modular aircraft-plus-car product whose first use cases are bounded by
      designated operating zones, infrastructure buildout, and aviation
      certification. The practical underwriting boundary today is therefore a
      premium, low-altitude mobility niche inside the wider policy envelope,
      not a general replacement for urban ground transport or mass-market
      vehicle demand.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Proxy sizing is possible, but audited category sizing is not
    body: >-
      The assigned sources support multiple sizing lenses, but each has a
      different denominator. Policy plans describe a broad low-altitude economy;
      AeroHT's own production plan defines a much narrower company-side supply
      ceiling; and claimed order counts offer only a rough demand signal because
      deposits, cancellations, and buyer mix are undisclosed. Taken together,
      these lenses show a large enough niche to matter if certification and
      conversion hold, while also showing why a single generic TAM headline
      would overstate underwriting precision.
    claimRefs: [CM001, CM002, CM007, CM008, CM009, CM010, CM013, CM014]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-map
    title: Early adoption points to affluent owners and operator-led experiences
    body: >-
      The buyer evidence points first to high-income discretionary purchasers
      and operators that can monetize short, experience-led flights in approved
      areas. AeroHT is not yet evidenced as a daily-commute or mass-transport
      product. Instead, the best-supported adoption path runs through wealthy
      owner-operators, tourism and demonstration partners, special-use fleets,
      and export distributors that can absorb a high ticket price and a narrow
      operational envelope while the category standardizes and while approvals
      and infrastructure continue to catch up.
    claimRefs: [CM003, CM005, CM006, CM007, CM008, CM012]
    tableRefs: [TM003]
  - id: constraints-and-gaps
    title: Certification timing and evidence gaps still govern the market case
    body: >-
      The core market question is not whether AeroHT can attract attention, but
      whether headline interest converts into monetizable operations on a useful
      timetable. Battery and operational tradeoffs shaped the modular product
      itself, and published coverage still points to unresolved approvals,
      constrained use cases, and incomplete disclosure around order quality and
      segment mix. That keeps the market case investable only through bounded,
      explicitly qualified proxy lenses rather than through a clean published
      SAM, a defensible near-term SOM, or an order-backed revenue forecast.
    claimRefs: [CM004, CM007, CM010, CM011, CM012, CM014]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Guangdong low-altitude economy
        - Provincial low-altitude aviation, infrastructure, services, and enabling industry
        - Broader Chinese aviation, conventional autos, and general urban mobility outside low-altitude use cases
        - Provincial and municipal governments, operators, and category participants
        - Useful top-down policy envelope, but too broad to use as AeroHT TAM
      - - Personal modular flying vehicle
        - Ultra-premium purchases of the Land Aircraft Carrier hardware
        - Mass-market passenger-car budgets and generic commuter spending
        - Affluent owner-operators paying from discretionary mobility or recreation budgets
        - Best fit for near-term AeroHT revenue evidence
      - - Tourism / demonstration operations
        - Scenic-zone, flight-park, and outdoor-recreation flights plus demo infrastructure
        - Daily commuting networks and dense urban air-taxi operations
        - Operators funding capex or partnerships for short, designated-route experiences
        - Supported by rollout-zone and Qingdao partnership evidence
      - - Emergency / special-use operations
        - Emergency-response and mission-specific low-altitude flights in approved areas
        - Broad municipal transit replacement or scheduled airline economics
        - Agencies or specialized operators with mission-led budgets
        - Plausible adjacent niche, but not yet disclosed as core revenue mix
    notes: >-
      Included spend reflects reachable early-market use cases in the assigned
      evidence, not the full economic output of China's low-altitude economy.
  - id: TM002
    title: TAM / SAM / SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - China Daily
        - "2024"
        - Guangdong
        - ">300 billion yuan by 2026"
        - n/a
        - Provincial action-plan target for the low-altitude economy
        - medium
        - Category-wide policy goal, not AeroHT-specific demand
      - - New Atlas
        - "2024"
        - Guangzhou
        - 10 billion yuan public investment and 100+ take-off / landing points by end-2026
        - n/a
        - Municipal infrastructure and ecosystem buildout lens
        - medium
        - Enabling spend supports adoption but is not company revenue
      - - China Daily + EV.com
        - 2024-2026
        - Guangzhou
        - 10,000 units annual plant capacity
        - n/a
        - Company-side supply ceiling for the first smart-manufacturing base
        - medium
        - Capacity is not proof of sell-through
      - - EV.com + China Daily
        - 2024-2026
        - Guangzhou
        - ">20 billion yuan implied annual GMV at full capacity"
        - n/a
        - Derived as 10,000 units multiplied by the public sub-2-million-yuan price anchor
        - medium
        - Derived proxy; not audited revenue, and ignores discounts, timing, and mix
      - - Moomoo + EV.com
        - "2025"
        - Global / Middle East
        - "~14 billion yuan implied GMV if 7,000 claimed orders convert"
        - n/a
        - Derived as claimed cumulative orders multiplied by the public sub-2-million-yuan price anchor
        - low
        - Order quality, deposits, and cancellations are undisclosed
    notes: >-
      Derived rows convert public unit counts into yuan using the recent
      sub-2-million-yuan target price; they are non-audited proxy lenses rather
      than TAM or revenue disclosures.
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Affluent owner-operator
        - High-net-worth consumer
        - Individual pilot / leisure user
        - Self-funded purchase
        - Recreational or prestige-led short flights from approved sites
        - Household discretionary mobility / recreation budget
        - Certification clarity plus access to usable flight parks or private zones
      - - Tourism or flight-park operator
        - Scenic-zone or outdoor-recreation operator
        - Tourists or demo riders
        - Operator capex budget
        - Short experiential flights and demonstrations in designated areas
        - General manager or asset owner
        - Local infrastructure tie-ups and operating approvals
      - - Emergency / special-use operator
        - Agency or contracted specialist operator
        - Rescue, inspection, or mission crews
        - Public-service or enterprise mission budget
        - Mission-specific low-altitude response in approved geographies
        - Agency procurement or operating head
        - Mission fit plus approved airspace and safety procedures
      - - Overseas distributor / channel partner
        - Regional distributor or import partner
        - End customers or local experience operators
        - Distributor inventory or partnership budget
        - Bulk orders ahead of local launch and channel development
        - Regional channel principal
        - Market-entry timing, homologation, and demonstrable demand
    notes: >-
      Public evidence does not disclose actual segment mix, so the table maps
      the most visible early workflows rather than a verified revenue split.
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The strongest public market lenses run from broad category policy support
      down to AeroHT-specific price, capacity, and order proxies.
    data:
      items:
        - label: Guangdong low-altitude economy policy pool
          displayValue: ">300bn yuan by 2026"
          detail: Provincial category target; useful as a ceiling, not as AeroHT TAM.
          tone: neutral
        - label: Guangzhou infrastructure buildout
          displayValue: 10bn yuan investment; 100+ take-off / landing points
          detail: Enabling municipal spend expected by end-2026.
          tone: neutral
        - label: AeroHT first-factory capacity
          displayValue: 10,000 units per year
          detail: Company-side supply ceiling for the first manufacturing base.
          tone: neutral
        - label: Public target price
          displayValue: <=2m yuan per unit (~$280k)
          detail: Recent public pricing anchor for the Land Aircraft Carrier.
          tone: neutral
        - label: Implied plant GMV at price ceiling
          displayValue: ">20bn yuan per year"
          detail: 10,000 units multiplied by the public price anchor.
          tone: neutral
        - label: Claimed cumulative orders
          displayValue: 7,000 units (~14bn yuan at price ceiling)
          detail: Company-linked order claim with undisclosed conversion quality.
          tone: risk
    approximationNotes: >-
      Layers are non-additive sizing lenses, not a cumulative funnel. Derived
      yuan figures multiply public unit counts by the recent public price anchor
      and should not be read as audited revenue, TAM, or order-backed cash.
    claimRefs: [CM001, CM002, CM007, CM008, CM009, CM010, CM014]
callouts:
  - calloutType: insight
    title: Policy TAM is not the same as investable demand
    body: >-
      The provincial low-altitude story is large enough to attract capital and
      partnerships, but the evidence-backed near-term market is the much smaller
      group of buyers and operators who can actually fly from approved sites
      before full commercial approvals broaden the category.
    claimRefs: [CM001, CM002, CM003, CM011]
  - calloutType: risk
    title: The visible order book is still low-quality underwriting evidence
    body: >-
      Claimed orders help prove interest, but the public record still lacks
      deposit levels, cancellation rates, and operator-versus-consumer mix, so
      order-based revenue conversion remains a material diligence gap.
    claimRefs: [CM007, CM010, CM014]
