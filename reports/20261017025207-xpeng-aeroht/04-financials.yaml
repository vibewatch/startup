schemaVersion: report-v2
artifact: financials
slug: xpeng-aeroht
runDate: 2026-10-17
company:
  name: Xpeng AeroHT
chapter:
  number: 4
  title: Financials
  summary: >-
    XPeng AeroHT's public financial story is still a funded hardware ramp rather
    than a disclosed operating model: management and trade press point to a
    sub-RMB 2 million list-price target, a completed USD 250 million Series B
    after a USD 150 million B1 round, and a Guangzhou factory designed for
    10,000 units of annual capacity. What remains missing for underwriting is
    realized revenue, gross margin, cash runway, and the conversion quality of
    orders and pre-sales before 2026 deliveries and remaining aviation approvals.
sections:
  - id: revenue-model-and-demand
    title: Revenue model and demand proxies
    body: >-
      Public evidence still frames AeroHT as a pre-delivery vehicle program rather
      than a business with reported recurring or recognized revenue. The clearest
      monetization signal is a headline target price below RMB 2 million for the
      Land Aircraft Carrier, with pre-sales historically expected in China before
      certified deliveries. Demand evidence exists, but it is mostly company-claimed:
      nearly 60 flying-car camps signed in 2024 and a later statement that overseas
      agreements covered a first batch of 600 units within 7,000 cumulative orders.
      Those numbers may indicate commercial interest, yet public sources in this
      worker pool do not disclose deposits, cancellation rights, distributor margins,
      or revenue-recognition policy, so they should be treated as pipeline rather than
      booked revenue.
    claimRefs: [CI001, CI002, CI004, CI005, CI006, CI008, CI009, CI013]
    tableRefs: [TI001, TI002]
  - id: capital-intensity-and-launch-gating
    title: Capital intensity and launch gating
    body: >-
      Financially, AeroHT looks more like a capital-intensive manufacturing launch
      than a software-style scale story. China Daily and later trade coverage tie
      the program to a dedicated Guangzhou site of roughly 180,000 square meters,
      designed for 10,000 units of annual capacity, while Airframer and Electrek
      describe the plant as only about 70% complete by mid-2025. The product itself
      combines a range-extended ground module, a separate air module, safety systems,
      and aviation-quality traceability, all of which imply a heavier bill of
      materials and more validation work than a standard auto rollout. Even after
      type and production-certificate progress, paid commercial operations still
      require additional CAAC approvals, so factory completion and certification remain
      the main gates between current funding and cash-generating deliveries.
    claimRefs: [CI003, CI007, CI010, CI011, CI012, CI014]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: underwriting-view-and-gaps
    title: Underwriting view and diligence blockers
    body: >-
      The chapter supports a cautious financial view: AeroHT has raised material
      capital and built credible industrial milestones, but the public record is
      still insufficient to underwrite revenue quality, margin path, or runway. The
      best-supported near-term model is deposits or channel reservations converting
      into one-off hardware sales once the plant is complete and certifications clear.
      That leaves several underwriting questions unresolved: whether list pricing
      survives discounts, how much working capital and tooling spend remain before
      ramp, and whether current order claims are backed by cash deposits or mainly
      nonbinding interest. Until management discloses realized ASP, unit margin,
      burn, and liquidity, the program should be treated as execution-dependent and
      financing-sensitive rather than self-funding.
    claimRefs: [CI004, CI009, CI013, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Current value / status
      - Evidence quality
      - Diligence ask
    rows:
      - - Land Aircraft Carrier vehicle sale
        - Direct sale of the combined ground module plus air module after certified handover
        - Headline target price below RMB 2 million; deliveries still targeted for 2026
        - Company target price, not realized ASP or recognized revenue
        - Provide preorder terms, deposit schedule, and revenue-recognition policy for first deliveries
      - - China pre-sales / deposits
        - Reservation or deposit collection ahead of final delivery
        - Pre-sales were expected from Q4 2024, but current public coverage still frames deliveries as a 2026 objective
        - Timing shifted and no deposit amount or refund terms are public
        - Disclose deposits collected, cancellation rights, and conversion of reservations into firm contracts
      - - Experience / infrastructure network
        - Flying camps and compliant flying spaces that can stimulate demand and product demos
        - Nearly 60 camps signed by 2024
        - Commercial monetization model is not disclosed
        - Show camp economics, partner revenue share, and expected utilization
      - - Overseas distributor pipeline
        - Middle East channel agreements and bulk orders
        - 600-unit first batch and 7,000 cumulative orders were claimed in a company statement repost
        - Pipeline quality is low until deposits, cancellations, and delivery timing are disclosed
        - Provide signed contract structure, deposits, cancellation clauses, and channel margin terms
    notes: Company-claimed orders, camps, and pre-sales timing are pipeline indicators rather than recognized revenue; no public source in this pool discloses realized ASP or revenue policy.
    claimRefs: [CI004, CI006, CI007, CI008, CI009, CI013]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Public price signal
      - What it represents
      - Unknowns
      - Source
    rows:
      - - Land Aircraft Carrier list target
        - < RMB 2 million (~USD279k)
        - Company headline target for the combined product
        - Realized ASP, taxes, options, distributor discounts, and financing terms are not disclosed
        - Company statement cited in trade press
      - - Independent package estimate
        - ~USD400k total
        - New Atlas estimate combining the ground module and air module
        - Not company guidance and may not reflect China list pricing or launch configuration
        - New Atlas
      - - Overseas / channel economics
        - null
        - Potentially separate economics for distributor-led or demo-heavy sales
        - No public reseller margin, service attach, or deposit structure is disclosed
        - No public source in assigned pool
    notes: Null means the assigned public evidence does not disclose a usable price or contract term; independent package estimates should not be treated as realized pricing guidance.
    claimRefs: [CI004, CI005, CI009]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value / proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Manufacturing throughput proxy
        - 10,000-unit annual plant capacity; one aircraft every 30 minutes at full capacity was later claimed
        - Medium
        - Sets an upper bound for revenue scale but says nothing about utilization or yield
        - Provide ramp curve, utilization assumptions, and scrap / rework expectations
      - - Plant completion / capex proxy
        - 180,000 sqm site; about 70% complete by mid-2025 with Q4 2025 completion target
        - Medium
        - Factory completion is a prerequisite for deliveries and cash conversion
        - Provide remaining capex budget, tooling spend, and supplier prepayment schedule
      - - Certification dependency
        - Type and production-certificate progress achieved, but Airworthiness and Air Operator certificates are still required for paid operations
        - Medium
        - Delays can defer launch revenue and add compliance cost
        - Provide certification critical path, test budget, and contingency timing
      - - Gross margin / CAC / working capital / burn
        - null
        - Low
        - Without these metrics the chapter cannot underwrite margin path, sales efficiency, or runway
        - Share cohort gross margin, sales efficiency, inventory turns, deposit conversion, and monthly net cash burn
    notes: Null means the assigned public sources do not disclose the metric; proxies here are operational milestones, not management guidance on profitability.
    claimRefs: [CI010, CI011, CI012, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence implies cash conversion starts only when orders become certified deliveries from the new factory.
    data:
      nodes:
        - id: prospect
          label: Prospective buyer / channel partner
          summary: Demand is signaled through pre-sales, camps, and overseas agreements.
          note: Orders and camps are company-claimed and not disclosed as recognized revenue.
        - id: reservation
          label: Pre-order / deposit
          summary: Revenue quality depends on whether orders carry cash deposits and enforceable terms.
          note: No public deposit schedule or cancellation policy is disclosed.
        - id: factory
          label: Factory completion
          summary: The Guangzhou site is the gating manufacturing asset for the ramp.
          note: 10,000-unit design capacity does not prove near-term throughput.
        - id: certification
          label: Certification stack
          summary: Type and production work advance the launch, but additional operating approvals remain.
          note: Paid operations still need Airworthiness and Air Operator certificates.
        - id: delivery
          label: Certified delivery
          summary: Cash conversion likely begins only when certified units can be handed over.
          note: 2026 remains the public delivery target.
        - id: gross-profit
          label: Gross profit realization
          summary: Margin outcome depends on BOM, service, and channel costs that are still undisclosed.
          note: Public evidence is insufficient to underwrite steady-state economics.
      edges:
        - from: prospect
          to: reservation
          label: reserves demand
        - from: reservation
          to: factory
          label: must match build slots
        - from: factory
          to: certification
          label: production system review
        - from: certification
          to: delivery
          label: permits handover / use
        - from: delivery
          to: gross-profit
          label: recognize revenue and service cost
    approximationNotes: Revenue timing is inferred from disclosed pre-sales, factory, and certification milestones because the company has not published a public revenue-recognition policy.
    claimRefs: [CI004, CI007, CI010, CI011, CI012, CI013, CI015]
callouts:
  - calloutType: risk
    title: Revenue visibility remains pre-delivery
    body: Public traction indicators are still reservations, camps, and distributor announcements rather than disclosed delivered units or recognized revenue, while certification and plant completion still gate the 2026 launch path.
    claimRefs: [CI007, CI008, CI009, CI012, CI013]
  - calloutType: insight
    title: Capital has funded capability buildout more than disclosed operating leverage
    body: The disclosed equity rounds, factory buildout, and certification work show real program momentum, but public evidence still says little about realized margin, working capital needs, or liquidity after the current ramp.
    claimRefs: [CI001, CI002, CI010, CI011, CI014, CI016]
