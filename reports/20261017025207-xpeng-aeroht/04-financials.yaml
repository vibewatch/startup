  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin by vehicle, bill-of-materials breakdown, service burden, sales efficiency, and working-capital metrics for the launch cohort.
      whyItMatters: Without these data points the report cannot underwrite contribution margin, cash conversion, or whether list pricing can support the launch plan.
      diligencePath: Request cohort-level margin bridges, deposit conversion by channel, inventory turns, and monthly sales / service cost data from management.
    - type: private-evidence-only
      severity: blocking
      topic: runway
      missingEvidence: Cash balance, monthly burn, debt facilities or guarantees, remaining factory capex, and the trigger for the next financing round.
      whyItMatters: Capital adequacy is central to judging whether AeroHT can complete certification and ramp without another dilutive or structured financing event.
      diligencePath: Obtain the latest board or lender package covering liquidity, capex remaining, covenant headroom, and financing plan through first deliveries.
    - type: missing-source
      severity: material
      topic: order-pipeline
      missingEvidence: Binding contract terms behind the claimed 600-order Middle East batch and the reported 7,000 cumulative orders, including deposits and cancellation clauses.
      whyItMatters: Pipeline optics can overstate demand if orders are nonbinding, lightly funded, or distributor inventory rather than end-customer commitments.
      diligencePath: Ask for representative distributor agreements, deposit receipts, cancellation terms, and channel margin schedules for the announced order book.
