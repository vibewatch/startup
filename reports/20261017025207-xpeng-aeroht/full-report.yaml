      - number: '4.2'
        title: Capital intensity and launch gating
        blocks:
          - type: paragraph
            body: >-
              Financially, AeroHT looks more like a capital-intensive manufacturing launch than a software-style scale
              story. China Daily and later trade coverage tie the program to a dedicated Guangzhou site of roughly
              180,000 square meters, designed for 10,000 units of annual capacity, while Airframer and Electrek describe
              the plant as only about 70% complete by mid-2025. The product itself combines a range-extended ground
              module, a separate air module, safety systems, and aviation-quality traceability, all of which imply a
              heavier bill of materials and more validation work than a standard auto rollout. Even after type and
              production-certificate progress, paid commercial operations still require additional CAAC approvals, so
              factory completion and certification remain the main gates between current funding and cash-generating
              deliveries.
