  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Modular product definition and user workflow
        blocks:
          - type: paragraph
            body: >-
              AeroHT is not presenting a generic air-taxi service; it is shipping a two-module product in which a
              six-wheel ground vehicle carries, stores, recharges, and re-docks a foldable eVTOL air module. That design
              matters because it reframes the customer workflow from airport storage and towing toward drive-to-site
              operation, with the ground module doubling as a mobility platform and charging asset. Public materials
              also make the usability thesis explicit: AeroHT describes single-stick manual control, autonomous-route
              support, return-to-home assistance, and up to six flights per full ground-module charge. The product story
              is therefore strongest where the company can point to integrated hardware and control systems, and weakest
              where it still lacks public field data on endurance, payload, dispatch reliability, and maintenance
              intervals.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE012
