      - number: '3.2'
        title: Capability and pricing comparison favor novelty over simplicity
        blocks:
          - type: paragraph
            body: >-
              Publicly disclosed pricing places AeroHT in a specialty-vehicle bracket rather than a mass-market
              transportation lane. Multiple sources cluster the Land Aircraft Carrier at under CNY2 million, roughly
              $280,000 to $300,000, while adjacent coverage frames demand around thousands of pre-orders or intent
              orders rather than delivered fleet scale. That combination suggests a buyer profile centered on affluent
              early adopters, enthusiasts, and selected institutional edge cases instead of everyday commuters. Relative
              to premium EV substitutes, AeroHT offers a differentiated multimodal experience, but it also asks buyers
              to underwrite aviation readiness, storage, training, and local-operating constraints. Relative to adjacent
              aircraft, AeroHT benefits from the road module and XPeng-linked product familiarity, yet the evidence pool
              does not establish pricing or service-packaging transparency across alternatives well enough to claim a
              durable value advantage.
