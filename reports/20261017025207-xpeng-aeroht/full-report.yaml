        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is concentrated around founder-president Zhao Deli, XPeng chairman He Xiaopeng, and
              newly appointed CFO Du Chao. That gives the business clear automotive, capital-markets, and founder
              sponsorship, but it also highlights concentration risk: the public record still does not expose a full
              board roster, minority protections, or the practical boundary between AeroHT and XPeng group control. The
              refreshed evidence is therefore good enough to map executive accountability and stakeholder influence, but
              not good enough to treat governance as independently diligenced.
