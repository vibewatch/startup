  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and demand proxies
        blocks:
          - type: paragraph
            body: >-
              Public evidence still frames AeroHT as a pre-delivery vehicle program rather than a business with reported
              recurring or recognized revenue. The clearest monetization signal is a headline target price below RMB 2
              million for the Land Aircraft Carrier, with pre-sales historically expected in China before certified
              deliveries. Demand evidence exists, but it is mostly company-claimed: nearly 60 flying-car camps signed in
              2024 and a later statement that overseas agreements covered a first batch of 600 units within 7,000
              cumulative orders. Those numbers may indicate commercial interest, yet public sources in this worker pool
              do not disclose deposits, cancellation rights, distributor margins, or revenue-recognition policy, so they
              should be treated as pipeline rather than booked revenue.
