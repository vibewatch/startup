  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence implies cash conversion starts only when orders become certified deliveries from the new factory.
    data:
      nodes:
        - id: prospect
          label: Prospective buyer / channel partner
          summary: Demand is signaled through pre-sales, camps, and overseas agreements.
          note: Orders and camps are company-claimed and not disclosed as recognized revenue.
        - id: reservation
          label: Pre-order / deposit
          summary: Revenue quality depends on whether orders carry cash deposits and enforceable terms.
          note: No public deposit schedule or cancellation policy is disclosed.
        - id: factory
          label: Factory completion
          summary: The Guangzhou site is the gating manufacturing asset for the ramp.
          note: 10,000-unit design capacity does not prove near-term throughput.
        - id: certification
          label: Certification stack
          summary: Type and production work advance the launch, but additional operating approvals remain.
          note: Paid operations still need Airworthiness and Air Operator certificates.
        - id: delivery
          label: Certified delivery
          summary: Cash conversion likely begins only when certified units can be handed over.
          note: 2026 remains the public delivery target.
        - id: gross-profit
          label: Gross profit realization
          summary: Margin outcome depends on BOM, service, and channel costs that are still undisclosed.
          note: Public evidence is insufficient to underwrite steady-state economics.
      edges:
        - from: prospect
          to: reservation
          label: reserves demand
        - from: reservation
          to: factory
          label: must match build slots
        - from: factory
          to: certification
          label: production system review
        - from: certification
          to: delivery
          label: permits handover / use
        - from: delivery
          to: gross-profit
          label: recognize revenue and service cost
    approximationNotes: >-
      Revenue timing is inferred from disclosed pre-sales, factory, and certification milestones because the company has
      not published a public revenue-recognition policy.
    claimRefs:
      - CI004
      - CI007
      - CI010
      - CI011
      - CI012
      - CI013
      - CI015
  - id: FE001
    title: Land Aircraft Carrier control and production stack
    type: stack
    summary: >-
      The product combines a road-going carrier, automated docking system, eVTOL airframe, flight software, and
      aviation-style factory controls in a single operating stack.
    data:
      layers:
        - label: User mission layer
          detail: >-
            The public workflow starts with road transport to a launch site, followed by a short low-altitude mission
            and re-docking rather than permanent airport basing.
          outputs:
            - Drive to launch site
            - Fly low-altitude mission
            - Re-dock and continue on road
        - label: Ground module layer
          detail: >-
            A six-wheel 800V range-extender vehicle carries, stores, and recharges the aircraft while preserving
            everyday drivability claims.
          modules:
            - 5.5m x 2m x 2m ground module
            - Rear-wheel steering
            - Mobile recharge interface
        - label: Docking and handling layer
          detail: >-
            Automatic separation, rotor folding, landing-gear deployment, and reconnection are the core
            systems-integration differentiators.
          modules:
            - Onboard separation / reconnection system
            - 14 actuators
            - High-precision parking and motion coordination
        - label: Air module layer
          detail: >-
            The air vehicle uses a foldable dual-duct six-rotor layout, carbon-fiber structure, and a panoramic two-seat
            cockpit.
          modules:
            - Dual-duct six-rotor design
            - Carbon-fiber body and propellers
            - 270-degree cockpit
        - label: Flight software and safety layer
          detail: >-
            Manual and autonomous modes sit on top of redundant flight control, navigation, boundary protection, and
            assisted landing features.
          modules:
            - Single-stick control
            - Triple-redundancy fly-by-wire
            - Electronic fencing and return-to-home
        - label: Certification and factory layer
          detail: >-
            Commercialization still depends on CAAC certificate progression and a plant / quality system that can
            reproduce the approved design at scale.
          modules:
            - TC compliance determination
            - PC application acceptance
            - Traceable production system and claimed 10,000-unit capacity
    approximationNotes: null
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE006
      - CE010
      - CE011
