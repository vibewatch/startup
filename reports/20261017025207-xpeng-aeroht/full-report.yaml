      - number: '4.3'
        title: Underwriting view and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The chapter supports a cautious financial view: AeroHT has raised material capital and built credible
              industrial milestones, but the public record is still insufficient to underwrite revenue quality, margin
              path, or runway. The best-supported near-term model is deposits or channel reservations converting into
              one-off hardware sales once the plant is complete and certifications clear. That leaves several
              underwriting questions unresolved: whether list pricing survives discounts, how much working capital and
              tooling spend remain before ramp, and whether current order claims are backed by cash deposits or mainly
              nonbinding interest. Until management discloses realized ASP, unit margin, burn, and liquidity, the
              program should be treated as execution-dependent and financing-sensitive rather than self-funding.
