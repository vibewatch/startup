      - number: '3.3'
        title: Durability depends on certification, manufacturing, and buyer education
        blocks:
          - type: paragraph
            body: >-
              The strongest moat signals in this pool are execution signals, not lock-in mechanics. AeroHT has
              progressed through notable certification milestones and plant build-out, which helps establish seriousness
              relative to concept-stage mobility projects. However, the same evidence also shows that certification is
              not complete, commercial operations still require additional approvals, and public delivery timing has
              shifted across sources. That means incumbents and substitutes do not need to beat AeroHT on modular
              design; they can win if AeroHT misses delivery windows, fails to translate intent orders into usable
              approvals, or encounters market-education friction for a product that combines road ownership with
              aircraft compliance. The competitive posture is therefore promising but not yet defensible in a way that
              would prevent buyers from multi-homing into premium EVs, adjacent aircraft, or later low-altitude
              entrants.
