              - CM009
              - CM010
              - CM014
      - number: '2.3'
        title: Early adoption points to affluent owners and operator-led experiences
        blocks:
          - type: paragraph
            body: >-
              The buyer evidence points first to high-income discretionary purchasers and operators that can monetize
              short, experience-led flights in approved areas. AeroHT is not yet evidenced as a daily-commute or
              mass-transport product. Instead, the best-supported adoption path runs through wealthy owner-operators,
              tourism and demonstration partners, special-use fleets, and export distributors that can absorb a high
              ticket price and a narrow operational envelope while the category standardizes and while approvals and
              infrastructure continue to catch up.
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
          - type: table
            tableRef: TM003
            claimRefs: []
      - number: '2.4'
        title: Certification timing and evidence gaps still govern the market case
        blocks:
          - type: paragraph
            body: >-
              The core market question is not whether AeroHT can attract attention, but whether headline interest
              converts into monetizable operations on a useful timetable. Battery and operational tradeoffs shaped the
              modular product itself, and published coverage still points to unresolved approvals, constrained use
              cases, and incomplete disclosure around order quality and segment mix. That keeps the market case
              investable only through bounded, explicitly qualified proxy lenses rather than through a clean published
              SAM, a defensible near-term SOM, or an order-backed revenue forecast.
            claimRefs:
              - CM004
              - CM007
              - CM010
              - CM011
              - CM012
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Policy TAM is not the same as investable demand
            body: >-
              The provincial low-altitude story is large enough to attract capital and partnerships, but the
              evidence-backed near-term market is the much smaller group of buyers and operators who can actually fly
              from approved sites before full commercial approvals broaden the category.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM011
          - type: callout
            title: The visible order book is still low-quality underwriting evidence
            body: >-
              Claimed orders help prove interest, but the public record still lacks deposit levels, cancellation rates,
              and operator-versus-consumer mix, so order-based revenue conversion remains a material diligence gap.
            calloutType: risk
            claimRefs:
