        title: Capital base and scale indicators
        blocks:
          - type: paragraph
            body: >-
              The clearest refreshed scale signal is financing plus factory ambition, not realized output. CnEVPost
              reported a completed $250 million Series B in July 2025 after the August 2024 B1 round, while older
              reporting still anchors the October 2021 Series A at more than $500 million and a pre-money valuation
              above $1 billion. Management has also kept repeating a price target below RMB 2 million and a plant design
              capacity of 10,000 units annually. Those are useful benchmarks for later valuation work, but they remain
              target-state indicators: refreshed public sources still do not disclose revenue, gross margin, headcount,
              or an updated post-Series-B valuation mark.
            claimRefs:
              - CO006
              - CO008
              - CO009
              - CO010
              - CO011
      - number: '1.4'
        title: Milestones and open execution risks
        blocks:
          - type: paragraph
            body: >-
              The milestone pattern is encouraging but still conditional. The production base has been topped out, the
              air module's production-certificate application has been accepted, and public timelines still point to
              2026 deliveries. At the same time, Electrek notes that commercial charging operations still need further
              CAAC approvals, and the newest branding and order headlines come from company-claimed statements rather
              than audited disclosures. In other words, Xpeng AeroHT has moved beyond concept-stage theater, but the
              remaining certification path, order quality, and funding transparency still define the diligence edge.
            claimRefs:
