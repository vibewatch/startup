  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal map of buyer practicality versus near-term air-mobility readiness using only evidence-backed alternatives
      named in the assigned source pool.
    data:
      xAxis:
        label: Buyer practicality
        min: 1
        max: 5
        low: Specialized enthusiast use
        high: Broad everyday utility
        description: Ordinal synthesis from pricing, operating complexity, and use-case breadth
        scale: ordinal
      yAxis:
        label: Near-term air-mobility readiness
        min: 1
        max: 5
        low: No air capability
        high: Publicly signaled near-term aircraft delivery path
        description: Ordinal synthesis from named aircraft capability and reported delivery progress
        scale: ordinal
      points:
        - label: AeroHT Land Aircraft Carrier
          x: 4
          'y': 4
          detail: Combines road practicality with the strongest near-term public delivery path in this pool.
        - label: Tesla Model Y / status-quo EV
          x: 5
          'y': 1
          detail: Highest practical utility for ordinary transport, but no air-mobility capability.
        - label: XPeng X2 lineage
          x: 2
          'y': 3
          detail: Aircraft-first predecessor without the integrated road module.
        - label: EHang AAV
          x: 2
          'y': 3
          detail: Named adjacent aircraft option for buyers who want air access before road integration.
        - label: Atea hybrid-electric aircraft
          x: 2
          'y': 2
          detail: Adjacent aircraft alternative with less evidence in this assigned pool.
        - label: Valkyrie private aircraft
          x: 2
          'y': 2
          detail: Private-aircraft alternative for buyers who can substitute away from category creation risk.
    approximationNotes: >-
      Axes use ordinal 1-5 scores synthesized from cited public evidence on utility, disclosed pricing context, and
      reported readiness; they are not measured market shares, performance benchmarks, or independently verified
      conversion rates.
    claimRefs:
