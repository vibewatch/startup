  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary is narrower than the policy story
        blocks:
          - type: paragraph
            body: >-
              The broad Chinese low-altitude economy narrative is materially larger than AeroHT's investable near-term
              market. Guangdong and Guangzhou are spending against a category-level policy push, but the company is
              still selling a modular aircraft-plus-car product whose first use cases are bounded by designated
              operating zones, infrastructure buildout, and aviation certification. The practical underwriting boundary
              today is therefore a premium, low-altitude mobility niche inside the wider policy envelope, not a general
              replacement for urban ground transport or mass-market vehicle demand.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs: []
      - number: '2.2'
        title: Proxy sizing is possible, but audited category sizing is not
        blocks:
          - type: paragraph
            body: >-
              The assigned sources support multiple sizing lenses, but each has a different denominator. Policy plans
              describe a broad low-altitude economy; AeroHT's own production plan defines a much narrower company-side
              supply ceiling; and claimed order counts offer only a rough demand signal because deposits, cancellations,
              and buyer mix are undisclosed. Taken together, these lenses show a large enough niche to matter if
              certification and conversion hold, while also showing why a single generic TAM headline would overstate
              underwriting precision.
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs: []
