              - CP004
              - CP007
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is architectural, not just cosmetic
            body: >-
              The modular road-plus-air package gives AeroHT a sharper story than a stand-alone eVTOL pitch and helps it
              compete against both premium EV convenience and aircraft novelty.
            calloutType: strength
