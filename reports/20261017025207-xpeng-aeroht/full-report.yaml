  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: adjacent air mobility plus status-quo road transport'
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence set points to a fragmented competitive field rather than one clean direct-peer list.
              AeroHT's Land Aircraft Carrier is differentiated by combining a six-wheeled ground module with a
              detachable two-seat eVTOL, which puts it in a hybrid category between premium EVs and personal aircraft.
              The clearest substitutes in this pool are status-quo premium vehicles such as Tesla's Model Y, Model 3,
              Cybertruck, and FSD-enabled EV stack on one side, and adjacent personal-aircraft options such as the EHang
              AAV, Atea hybrid-electric aircraft, and Valkyrie private aircraft on the other. That matters because
              wealthy buyers are not deciding only between "AeroHT or another flying car"; they can stay on-road with a
              mature EV, buy a stand-alone aircraft, or wait for the category to stabilize. AeroHT's category creation
              ambition is real, but the practical competitive set is broader than direct eVTOL branding.
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP008
              - CP013
