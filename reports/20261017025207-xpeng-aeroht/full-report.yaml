      - number: '5.2'
        title: Architecture, factory system, and certification path
        blocks:
          - type: paragraph
            body: >-
              The technology stack combines automotive-scale packaging with aviation control and quality requirements.
              AeroHT's product overview describes an onboard separation-and-reconnection system, redundant propulsion,
              power, communication, and flight-control layers, and a manufacturing model that keeps core component
              development and production in house. That stack is paired with a Guangzhou base the company and China
              Daily describe as a dedicated flying-car plant with an initial 180,000 square meter footprint, a claimed
              10,000-unit annual capacity, and full traceability through the production flow. Public maturity is no
              longer purely conceptual: the X3-F air module's production-certificate application has been accepted and
              type certification work is in compliance determination, although the latest independent milestone
              reporting still frames the program as pre-commercial rather than certified for paid operations.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE009
              - CE010
              - CE011
      - number: '5.3'
        title: Differentiation, rollout, and remaining technical risk
        blocks:
          - type: paragraph
            body: >-
              AeroHT's clearest differentiation is operational rather than purely aerodynamic: the company is pairing a
              road-legal carrier, automated docking, assisted flight controls, and a purpose-built plant so the flying
              module can be treated like a deployed accessory instead of a standalone aircraft that always depends on
              airport infrastructure. That helps explain why the company emphasizes flight camps, leisure travel, and
              public-service scenarios rather than dense urban air-taxi economics. The residual risks are equally clear
              from the public record. Remaining CAAC approvals still stand between milestone acceptance and paid flight
              operations, while the newest product-line and overseas-order claims are company-stated rather than
              independently underwritten. For diligence, the largest product-tech gaps are verified operating data,
              cyber/privacy controls, and any public practitioner signal showing how operators or integrators will
              support the system after launch.
            claimRefs:
              - CE001
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE005
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Modular integration is the real product moat
            body: >-
              AeroHT's strongest public differentiation is the integration problem it is trying to solve: a road-legal
              carrier, a foldable eVTOL, automated docking, and assisted flight controls packaged into one operator
              workflow.
            calloutType: strength
            claimRefs:
