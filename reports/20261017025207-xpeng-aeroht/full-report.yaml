chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product scope
        blocks:
          - type: paragraph
            body: >-
              Public reporting continues to describe Xpeng AeroHT as a Guangzhou-based, majority-XPeng flying-car unit
              that originated in 2013 and was formally established in 2020. The canonical product for later chapters is
              the Land Aircraft Carrier: a modular system pairing a road-going ground module with a detachable eVTOL air
              module, first positioned publicly at XPeng's October 2023 tech day. That positioning matters because later
              commercial claims should be read as pre-delivery scale-up, not as proof of current operating revenue or
              delivered customer fleets. Even the strongest recent public evidence is about capacity, certification, and
              orders-in-queue rather than recognized sales or disclosed unit economics.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
