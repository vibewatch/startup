        title: Named counterparties are visible, but only through company-stated order news
        blocks:
          - type: paragraph
            body: >-
              AeroHT's clearest named-customer proof is overseas channel expansion rather than fielded end users. The
              assigned pool includes a company-stated announcement that Ali & Sons Group, Almana Group, AlSayer Group,
              and the Chinese General Chamber of Commerce UAE signed the first Middle East batch of 600 flying-car
              orders, within a broader company-stated cumulative order count of 7,000 units. That is more concrete than
              anonymous logo pages, but it still stops short of showing deposits, per-counterparty splits, delivered
              units, or referenceable production use cases. The evidence supports real commercial interest; it does not
              yet prove durable post-delivery adoption.
            claimRefs:
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
      - number: '6.4'
        title: Durability, conversion quality, and concentration remain the key customer risks
        blocks:
          - type: paragraph
            body: >-
              The central diligence issue is not whether AeroHT can attract attention; it is whether the disclosed order
              pipeline converts into delivered, repeatedly used aircraft with acceptable concentration risk. Public
              sources still leave major blanks on deposit terms, cancellations, contract length, customer economics,
              renewal behavior, and geographic mix beyond China plus a single Middle East expansion cluster.
              Manufacturing and certification milestones also remain on the critical path, so customer figures today are
              better treated as demand indicators than as evidence of durable installed-base revenue.
            claimRefs:
              - CU007
              - CU011
              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand proof is better than logo proof
            body: >-
              The order book is still pre-fulfillment, but AeroHT has public intent-order counts and named overseas
              counterparties rather than relying only on unnamed customer logos.
            calloutType: strength
            claimRefs:
              - CU004
              - CU009
              - CU010
          - type: callout
            title: The missing durability data is the real underwriting gap
            body: >-
              Public sources do not show renewals, cancellations, utilization, or cohort behavior, so current customer
              evidence is better treated as pipeline quality than as recurring-demand proof.
            calloutType: risk
            claimRefs:
              - CU011
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Certification remains the gating risk to commercialization
        blocks:
          - type: paragraph
            body: >-
              The clearest thesis-break risk is that AeroHT still has not shown a straight line from certification
              progress to revenue-generating operations. EVMagz said the X3-F air module's type-certificate process had
              advanced to compliance confirmation by May 2025, and both EVMagz and Electrek reported that the
              production-certificate application had been accepted. That is genuine progress, but the same coverage says
              commercial operations still require an Airworthiness Certificate and an Air Operator Certificate from
              CAAC. Delivery guidance has also moved: a January 2024 company release cited 2025 Q4 deliveries, while
              later independent coverage pointed to 2026. That combination makes certification timing, not product
              concept, the main gating variable for the investment case.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR006
              - CR012
              - CR014
              - CR015
      - number: '7.2'
        title: Factory milestones help, but scaled-output proof is still early
        blocks:
          - type: paragraph
            body: >-
              AeroHT has moved beyond renderings and trade-show demos, yet the public record is still closer to
              industrial preparation than full-rate production. EVMagz said the mass-production plant was 70% complete
              in May 2025 with full completion expected in Q4 2025, and Gasgoo later reported that five Land Aircraft
              Carrier units had rolled off the trial production line. Gasgoo also described a roughly
              120,000-square-meter factory and a design goal of one aircraft every 30 minutes at full capacity. Those
              are meaningful milestones, but they remain company-linked execution claims rather than audited proof of
              sustained throughput, yield, or field reliability, so operational ramp risk stays high until repeated
              customer deliveries and support performance become public.
            claimRefs:
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR016
      - number: '7.3'
        title: Deployment depends on external partners, policy venues, and patient capital
        blocks:
          - type: paragraph
            body: >-
              AeroHT's rollout is not a pure product sale; it depends on ecosystems that the company does not fully
              control. TropicalHainan said Hainan scenario rollout relies on agreements with more than 40 campsites and
              a multi-year buildout plan, while Gasgoo said Haixinsha Tech Island operations are being co-built with
              Guangzhou City Investment Group and CEPREI. Financing also remains part of the operating thesis: Urban Air
              Mobility News reported a USD 250 million Series B tied to accelerating production, and New Atlas cited RMB
              6 billion of bank credit from four banks. Those supports reduce near-term execution pressure, but they
              also mean partner alignment, local policy support, and capital-market follow-through are material
              dependencies rather than background conditions.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Visible mitigations are real, but kill criteria should stay measurable
        blocks:
          - type: paragraph
            body: >-
              The public mitigation story is credible but still process-heavy. TropicalHainan highlighted
              full-redundancy safety systems, Vertical's company-issued launch release said the electric propulsion
              system meets single-point-failure safety requirements, and China Daily described a plant traceability
              system intended to track components through final assembly. Those measures matter, but they are not
              substitutes for public reliability, revenue, or conversion data. Investors should treat the thesis as
              broken if CAAC sequencing extends beyond the company's 2026 delivery window, if pilot-line output fails to
              translate into repeatable commercial deliveries, if scenario partners do not convert into real paid
              utilization, or if AeroHT cannot disclose deposits, unit economics, and working-capital needs for the Land
              Aircraft Carrier program.
            claimRefs:
              - CR003
              - CR006
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Certification delay is the clearest thesis-break trigger
            body: >-
              Public evidence shows progress, but AeroHT still needs post-production CAAC approvals before paid
              operations can begin, and delivery timing has already moved once.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR006
          - type: callout
            title: Factory readiness should be judged by delivered units, not facility rhetoric
            body: >-
              Trial-line milestones and capital support are constructive, yet the public record still lacks sustained
              throughput, yield, warranty, or conversion data that would turn process progress into an investable
              operating proof point.
            calloutType: assumption
            claimRefs:
              - CR008
              - CR009
              - CR012
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: |-
              The public record supports a **track** recommendation with **medium confidence**, a **high**
              risk rating, and an **unknown** valuation stance. The positive side of the file is real:
              AeroHT still guides to 2026 deliveries at a sub-RMB2 million list price, has advanced its
              certification work, and has kept funding and factory buildout moving. The problem is that
              the decision-critical underwriting inputs remain undisclosed. The reviewed financing
              summaries discuss dollars raised, not the post-money mark, security type, or liquidation
              preference stack, so there is no defensible target return or hold-period underwriting case
              from public evidence alone.

              Because the disclosure set is still milestone-heavy rather than financial, the right entry
              discipline is to wait for one of two things: either a fresh priced round with plain-vanilla
              terms and updated operating KPIs, or a later commercial-readiness point where certification,
              deposit conversion, and production throughput are observable enough to underwrite execution
              risk directly. Until then, the most supportable stance is that AeroHT may be strategically
              interesting, but not yet priceable.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Evidence for and against underwriting
        blocks:
          - type: paragraph
            body: |-
              The pro-underwriting case is based on execution proof, not financial proof. China Daily,
              Airframer, and Gasgoo each point to real manufacturing progress: a Guangzhou base sized for
              more than 10,000 annual units, structural completion of the main shops, and trial-production
              milestones around the power system and plant. Order signals have also become stronger over
              time, moving from 2,000 cited orders in late 2024 to a later company-linked claim of 7,000
              cumulative orders and a first 600-unit Middle East batch. Those datapoints matter because
              they suggest AeroHT is building supply, channel, and customer interest in parallel.

              The anti-thesis is that none of those public datapoints closes the core underwriting gap.
              Commercial operations still require additional CAAC approvals, the schedule has already
              slipped from earlier guidance, and the order figures are not paired with deposit conversion,
              cancellation, ASP realization, or gross-margin disclosure. In other words, public evidence
              supports commercialization momentum, but not yet investable price certainty.
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario frame and comparable discipline
        blocks:
          - type: paragraph
            body: |-
              A conventional revenue-multiple framework is not supportable because AeroHT still does not
              disclose revenue, margin, or unit-economics data in the reviewed sources. The more
              appropriate public frame is milestone-based: what has the company proven on certification,
              manufacturing readiness, financing continuity, and customer pull, and what external
              reference points exist for adjacent aircraft pricing or ecosystem support? On that basis,
              the public evidence supports a staged view rather than a single fair-value point.

              The useful external references in this source pack are limited but directionally helpful.
              New Atlas cites EHang's $410,000 international EH216-S list price as a public aircraft
              pricing reference and separately describes substantial Guangzhou/Guangdong low-altitude
              policy support through 2026. Those references help validate that AeroHT is building inside
              a funded ecosystem and may not be absurdly priced at the product level, but they still do
              not substitute for a current equity mark or preference analysis at the company level.
            claimRefs:
              - CV001
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV008
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: |-
              The next diligence pass should focus on closing the variables that actually move the
              investment call. First, AeroHT needs to provide the latest financing documents or a fresh
              board-approved valuation mark, including security type, liquidation preferences, and any
              XPeng-related rights that could subordinate new money. Second, management should disclose a
              simple commercialization funnel: orders, deposits, cancellations, conversion to signed
              purchase contracts, expected delivery cadence, and gross-margin expectations on both the air
              and ground modules. Third, the company should supply a dated certification tracker showing
              what remains after the type-certificate and production-certificate milestones.

              The thesis breaks if any of three things happen: the 2026 delivery target slips again, the
              next round is priced as a markup without new proof on conversion or approvals, or the
              eventual cap-table terms introduce enough preference or structured downside to absorb most of
              the upside from a first commercial launch. Any of those would confirm that the current
              public narrative is ahead of the investable reality.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV011
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public-evidence call
            body: >-
              Track the company, but do not underwrite a round from public evidence alone until the next financing
              discloses an actual price and terms or AeroHT discloses enough operating KPIs to underwrite
              commercialization risk directly.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV010
              - CV011
          - type: callout
            title: What could still break the equity case
            body: >-
              The biggest downside is not lack of ambition; it is that valuation opacity, approval timing, and
              order-conversion quality can each erase upside before outside investors ever see a clean commercial
              launch.
            calloutType: risk
            claimRefs:
              - CV002
              - CV005
              - CV011
              - CV013
