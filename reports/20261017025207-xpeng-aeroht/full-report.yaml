  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Residual exposure stays highest where delivery timing still depends on approvals or new ecosystems rather than
      proven commercial repetition.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: CAAC certification sequence
          values:
            - label: High
              tone: high
              note: Type and production progress are visible, but further approvals remain.
            - label: Critical
              tone: critical
              note: Commercial launch timing still depends on Airworthiness and Air Operator Certificates.
            - label: Medium
              tone: medium
              note: Public mitigations show process progress more than dated clearance.
            - label: High
              tone: high
              note: A sequencing delay would directly hit deliveries and monetization.
        - label: Delivery-timing credibility
          values:
            - label: High
              tone: high
              note: Public guidance already moved from 2025 Q4 to 2026.
            - label: High
              tone: high
              note: Another slip would weaken confidence in execution planning.
            - label: Medium
              tone: medium
              note: Factory and testing milestones help, but do not close the schedule gap.
            - label: High
              tone: high
              note: The market still lacks evidence that the new target is conservative.
        - label: Factory ramp and quality
          values:
            - label: Medium
              tone: medium
              note: Trial-line evidence exists, but sustained throughput is still unproven.
            - label: High
              tone: high
              note: Output, yield, or warranty misses would delay commercialization.
            - label: Medium
              tone: medium
              note: Traceability and new facilities are visible, but field metrics are not.
            - label: High
              tone: high
              note: Industrialization risk remains elevated until repeat deliveries are public.
        - label: Venue and partner dependence
          values:
            - label: High
              tone: high
              note: Early usage scenarios rely on campsites and public-sector venues.
            - label: Medium
              tone: medium
              note: A partner setback would slow deployment breadth more than product existence.
            - label: Medium
              tone: medium
              note: AeroHT has multiple named partners, but not broad independent demand proof.
            - label: High
              tone: high
              note: Utilization risk remains high until paid usage scales beyond demonstrations.
        - label: Capital intensity and runway
          values:
            - label: Medium
              tone: medium
              note: Recent financing and bank credit reduce immediate pressure.
            - label: High
              tone: high
              note: Factory completion and commercialization still require patient capital.
            - label: Medium
              tone: medium
              note: Funding support is visible, but current burn and working-capital needs are not.
            - label: High
              tone: high
              note: Missing revenue and deposit data keeps model risk elevated.
        - label: Demand conversion at premium pricing
          values:
            - label: Medium
              tone: medium
              note: Public target pricing exists, but conversion and deposit data do not.
            - label: High
              tone: high
              note: Weak uptake would impair manufacturing utilization and capital efficiency.
            - label: Low
              tone: low
              note: Public mitigation is mostly messaging rather than disclosed order quality.
            - label: High
              tone: high
              note: Underwriting remains speculative until pre-sales convert into delivered units.
