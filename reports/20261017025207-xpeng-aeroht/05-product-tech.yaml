schemaVersion: report-v2
artifact: product-tech
slug: xpeng-aeroht
runDate: 2026-10-17
company:
  name: Xpeng AeroHT
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Xpeng AeroHT's public product record is unusually concrete for a consumer
    eVTOL concept: the Land Aircraft Carrier is described as a modular
    ground-plus-air system with explicit docking, recharge, and flight-control
    architecture, plus a dedicated Guangzhou factory and ongoing CAAC
    certificate work. The maturity gap is that public evidence still leans
    heavily on company disclosures and milestone reporting rather than audited
    performance, cyber/privacy controls, or independent operator-ecosystem
    evidence.
sections:
  - id: modular-product-definition
    title: Modular product definition and user workflow
    body: >-
      AeroHT is not presenting a generic air-taxi service; it is shipping a
      two-module product in which a six-wheel ground vehicle carries, stores,
      recharges, and re-docks a foldable eVTOL air module. That design matters
      because it reframes the customer workflow from airport storage and towing
      toward drive-to-site operation, with the ground module doubling as a
      mobility platform and charging asset. Public materials also make the
      usability thesis explicit: AeroHT describes single-stick manual control,
      autonomous-route support, return-to-home assistance, and up to six flights
      per full ground-module charge. The product story is therefore strongest
      where the company can point to integrated hardware and control systems,
      and weakest where it still lacks public field data on endurance, payload,
      dispatch reliability, and maintenance intervals.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE012]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: architecture-factory-and-certification
    title: Architecture, factory system, and certification path
    body: >-
      The technology stack combines automotive-scale packaging with aviation
      control and quality requirements. AeroHT's product overview describes an
      onboard separation-and-reconnection system, redundant propulsion, power,
      communication, and flight-control layers, and a manufacturing model that
      keeps core component development and production in house. That stack is
      paired with a Guangzhou base the company and China Daily describe as a
      dedicated flying-car plant with an initial 180,000 square meter footprint,
      a claimed 10,000-unit annual capacity, and full traceability through the
      production flow. Public maturity is no longer purely conceptual: the X3-F
      air module's production-certificate application has been accepted and type
      certification work is in compliance determination, although the latest
      independent milestone reporting still frames the program as pre-commercial
      rather than certified for paid operations.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE011]
    tableRefs: [TE003]
  - id: differentiation-rollout-and-remaining-risk
    title: Differentiation, rollout, and remaining technical risk
    body: >-
      AeroHT's clearest differentiation is operational rather than purely
      aerodynamic: the company is pairing a road-legal carrier, automated
      docking, assisted flight controls, and a purpose-built plant so the flying
      module can be treated like a deployed accessory instead of a standalone
      aircraft that always depends on airport infrastructure. That helps explain
      why the company emphasizes flight camps, leisure travel, and public-service
      scenarios rather than dense urban air-taxi economics. The residual risks
      are equally clear from the public record. Remaining CAAC approvals still
      stand between milestone acceptance and paid flight operations, while the
      newest product-line and overseas-order claims are company-stated rather
      than independently underwritten. For diligence, the largest product-tech
      gaps are verified operating data, cyber/privacy controls, and any public
      practitioner signal showing how operators or integrators will support the
      system after launch.
    claimRefs: [CE001, CE010, CE011, CE012, CE013, CE014]
    tableRefs: [TE002]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Current maturity / status
      - Differentiation
      - Diligence gap
    rows:
      - - Land Aircraft Carrier ground module
        - Owner-operator / pilot
        - Publicly specified launch architecture; 2026 delivery target remains company-guided
        - 6x6, three-axle 800V range-extender platform that stores and recharges the air module
        - No audited curb weight, payload, or realized range data
      - - Air module eVTOL
        - Pilot + passenger
        - TC compliance work ongoing and PC application accepted
        - Foldable dual-duct six-rotor aircraft with manual and autonomous modes
        - No public endurance, payload, noise, or dispatch-reliability dataset
      - - Autonomous separation / reconnection system
        - Operator / maintenance crew
        - Demonstrated and specified in company materials
        - One-click deployment, docking, and storage workflow instead of airport towing
        - No public failure-rate, service-interval, or field-maintenance evidence
      - - Guangzhou flying-car manufacturing base
        - AeroHT manufacturing operations
        - Plant build and ramp disclosed; volume still unproven publicly
        - 180,000 sqm first phase with claimed 10,000-unit annual capacity and traceability system
        - No third-party validation of throughput, yield, or supplier readiness
      - - A868 hybrid long-range product line
        - Future long-distance low-altitude user
        - Under development and announced in 2025
        - Extends portfolio beyond the modular Land Aircraft Carrier toward longer-range use cases
        - No public prototype, certification path, or bill-of-materials disclosure
    notes: >-
      Rows mix company specifications, milestone reporting, and low-confidence
      pipeline disclosures; diligence gaps mark product data not found in the
      assigned prefetched pool.
    claimRefs: [CE001, CE002, CE003, CE004, CE008, CE010, CE013]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - AeroHT solution
      - Measurable benefit
      - Limitation
    rows:
      - - Reach a remote launch site without special storage
        - Tow or base aircraft at airports / dedicated pads
        - Drive the ground module to site, then deploy and recharge the air module on location
        - ">1000 km CLTC ground range claimed; up to six flights per full charge"
        - Specific launch-site requirements and turnaround times are not public
      - - Perform low-altitude leisure or exploration flights
        - Traditional pilot training and aircraft handling
        - Single-stick control plus route planning, return-to-home, and assisted landing
        - Lower stated operating complexity for owner-operators
        - Public training standard, incident-rate, and software-assurance evidence is absent
      - - Support emergency / obstacle-crossing public-service scenarios
        - Helicopter or purpose-built special-mission aircraft
        - Company positions the modular system for medevac, rescue, and response use cases
        - ">130 signed flight-camp agreements claimed, with >200 targeted by year-end"
        - No public mission logs, signed service contracts, or response-time proof
      - - Open overseas low-altitude distribution
        - Country-by-country eVTOL launches with local partners
        - Rebranded Aridge identity plus Middle East distributor agreements around Dubai launch
        - First overseas manned public demonstration and 600-order claim
        - Orders and 2027 timing are company-stated rather than independently verified
    notes: >-
      Benefits and limitations are synthesized from the cited sources; public
      evidence supports the workflow concept better than realized deployment
      performance.
    claimRefs: [CE003, CE005, CE011, CE012, CE013, CE014]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Key dependency
      - Risk
    rows:
      - - Ground energy platform
        - Stores, transports, and recharges the air module while preserving road mobility
        - 800V silicon-carbide range-extension platform, three-axle packaging, rear-wheel steering
        - No public verified real-world range or recharge duty-cycle evidence
      - - Docking and separation control
        - Automates release, folding, landing-gear deployment, and reconnection
        - Eight control modules, 14 actuators, and high-precision parking / motion coordination
        - No public MTBF, field-repair, or debris-ingestion data
      - - Flight control and navigation
        - Enables manual and autonomous flight modes with protected envelopes
        - Single-stick UX, auto route planning, return-to-home, environmental sensing, electronic fencing
        - No public software-assurance, cyber-hardening, or remote-update disclosure
      - - Airframe and safety systems
        - Provides lift, survivability, and degraded-mode behavior
        - Carbon-fiber structure plus dual-redundant propulsion / power / communications and triple-redundant flight control
        - Public safety claims are company-authored and lack certified payload / noise / crashworthiness readouts
      - - Factory and certification system
        - Converts design into repeatable production and approved operating hardware
        - Guangzhou base, aviation-style traceability, TC compliance determination, PC application acceptance
        - Paid commercial operations still depend on remaining approvals and successful plant ramp
    notes: >-
      This table separates public architecture facts from the unproven operating
      metrics investors would still need before underwriting scale, reliability,
      or software assurance.
    claimRefs: [CE003, CE005, CE006, CE009, CE010, CE011]
figures:
  - id: FE001
    title: Land Aircraft Carrier control and production stack
    type: stack
    summary: >-
      The product combines a road-going carrier, automated docking system,
      eVTOL airframe, flight software, and aviation-style factory controls in a
      single operating stack.
    data:
      layers:
        - label: User mission layer
          detail: >-
            The public workflow starts with road transport to a launch site,
            followed by a short low-altitude mission and re-docking rather than
            permanent airport basing.
          outputs:
            - Drive to launch site
            - Fly low-altitude mission
            - Re-dock and continue on road
        - label: Ground module layer
          detail: >-
            A six-wheel 800V range-extender vehicle carries, stores, and
            recharges the aircraft while preserving everyday drivability claims.
          modules:
            - 5.5m x 2m x 2m ground module
            - Rear-wheel steering
            - Mobile recharge interface
        - label: Docking and handling layer
          detail: >-
            Automatic separation, rotor folding, landing-gear deployment, and
            reconnection are the core systems-integration differentiators.
          modules:
            - Onboard separation / reconnection system
            - 14 actuators
            - High-precision parking and motion coordination
        - label: Air module layer
          detail: >-
            The air vehicle uses a foldable dual-duct six-rotor layout,
            carbon-fiber structure, and a panoramic two-seat cockpit.
          modules:
            - Dual-duct six-rotor design
            - Carbon-fiber body and propellers
            - 270-degree cockpit
        - label: Flight software and safety layer
          detail: >-
            Manual and autonomous modes sit on top of redundant flight control,
            navigation, boundary protection, and assisted landing features.
          modules:
            - Single-stick control
            - Triple-redundancy fly-by-wire
            - Electronic fencing and return-to-home
        - label: Certification and factory layer
          detail: >-
            Commercialization still depends on CAAC certificate progression and
            a plant / quality system that can reproduce the approved design at
            scale.
          modules:
            - TC compliance determination
            - PC application acceptance
            - Traceable production system and claimed 10,000-unit capacity
    approximationNotes: null
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE010, CE011]
callouts:
  - calloutType: strength
    title: Modular integration is the real product moat
    body: >-
      AeroHT's strongest public differentiation is the integration problem it is
      trying to solve: a road-legal carrier, a foldable eVTOL, automated
      docking, and assisted flight controls packaged into one operator workflow.
    claimRefs: [CE001, CE003, CE005]
  - calloutType: risk
    title: Technical progress is ahead of commercialization proof
    body: >-
      Public evidence shows manufacturing and certification movement, but the
      latest milestone record still leaves paid operations contingent on
      remaining CAAC approvals and a plant ramp that has not yet been publicly
      proven at full throughput.
    claimRefs: [CE010, CE011]
