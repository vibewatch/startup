evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance
    missingEvidence: Full board composition, reporting lines, and any minority-governance protections at AeroHT.
    whyItMatters: Governance concentration and related-party dependence cannot be assessed from named executives alone.
    diligencePath: Request the current board roster, shareholder agreement, and management org chart from the company.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: valuation-terms
    missingEvidence: Named Series B investors, post-money valuation, dilution, liquidation preferences, and any IPO bank mandates.
    whyItMatters: >-
      Capital structure and refreshed valuation are central to underwriting control, downside protection, and
      mark-to-market expectations.
    diligencePath: Obtain the latest cap table, financing documents, and any board materials tied to fundraising or IPO preparation.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Revenue, gross margin, delivered-customer count, deposit conversion, and headcount disclosures.
    whyItMatters: Factory and order claims do not demonstrate commercial quality or financial readiness.
    diligencePath: Request monthly operating dashboards, order-to-deposit cohorts, and audited management accounts.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: access-blocked
    severity: material
    topic: regulatory-readiness
    missingEvidence: A dated CAAC path showing remaining airworthiness and operator approvals, plus any special conditions still open.
    whyItMatters: Production-certificate progress alone does not authorize paid commercial operations.
    diligencePath: >-
      Ask management for the certification workplan and corroborate it against regulator documentation or formal
      notices.
    relatedQuestionRefs:
      - QO007
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: >-
      Binding status, deposits, cancellation rights, and economics for the claimed Middle East orders and any
      undisclosed financing counterparties.
    whyItMatters: Claimed order quantity can overstate traction if agreements are non-binding or lightly funded.
    diligencePath: Request signed channel agreements, order-book aging, and investor lists with rights attached.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: independent-market-sizing
    missingEvidence: >-
      An independent China consumer-eVTOL or modular-flying-vehicle TAM/SAM study with geography, buyer segment, and
      methodology.
    whyItMatters: >-
      Without an external category denominator, market size has to be inferred from policy and company proxies that can
      overstate near-term demand.
    diligencePath: >-
      Obtain a paid analyst market study or regulator-backed category dataset that isolates consumer and operator demand
      for low-altitude personal aircraft in China.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: order-quality
    missingEvidence: >-
      Deposit levels, refundability, cancellations, and operator-versus-consumer split behind the claimed 7,000
      cumulative orders.
    whyItMatters: >-
      Orderbook quality determines whether the visible demand lens can support revenue conversion or financing
      assumptions.
    diligencePath: >-
      Request a cohort view of preorder contracts, deposits collected, cancellations, and signed operator or distributor
      agreements by geography.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: stale
    severity: material
    topic: commercial-approval-timeline
    missingEvidence: >-
      Current status for remaining CAAC airworthiness and operating approvals beyond the accepted production-certificate
      application.
    whyItMatters: >-
      Certification timing governs when early buyer interest can convert into legal, recurring operations and when the
      market broadens beyond demos.
    diligencePath: Re-check the latest CAAC, company, and independent trade-reporting updates immediately before publication.
    relatedQuestionRefs:
      - QM005
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized contract terms, deposit economics, financing offers, and after-sales service commitments for the Land
      Aircraft Carrier.
    whyItMatters: >-
      Without realized commercial terms, the chapter can compare list-price positioning but cannot underwrite pricing
      power or switching economics.
    diligencePath: >-
      Obtain dealer, preorder, or financing documentation from AeroHT or channel partners and reconcile it against
      public list-price claims.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: timeline-risk
    missingEvidence: >-
      A current official schedule that reconciles 2026 launch narratives with the later 2027 delivery expectation in
      Venture Atlas.
    whyItMatters: Delivery timing is central to whether AeroHT reaches buyers before substitutes or later entrants absorb demand.
    diligencePath: >-
      Request the latest official certification and delivery milestone schedule, including dependencies on type
      approval, airworthiness, and operator approvals.
    relatedQuestionRefs:
      - QP006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin by vehicle, bill-of-materials breakdown, service burden, sales efficiency, and working-capital
      metrics for the launch cohort.
    whyItMatters: >-
      Without these data points the report cannot underwrite contribution margin, cash conversion, or whether list
      pricing can support the launch plan.
    diligencePath: >-
      Request cohort-level margin bridges, deposit conversion by channel, inventory turns, and monthly sales / service
      cost data from management.
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: >-
      Cash balance, monthly burn, debt facilities or guarantees, remaining factory capex, and the trigger for the next
      financing round.
    whyItMatters: >-
      Capital adequacy is central to judging whether AeroHT can complete certification and ramp without another dilutive
      or structured financing event.
    diligencePath: >-
      Obtain the latest board or lender package covering liquidity, capex remaining, covenant headroom, and financing
      plan through first deliveries.
  - type: missing-source
    severity: material
    topic: order-pipeline
    missingEvidence: >-
      Binding contract terms behind the claimed 600-order Middle East batch and the reported 7,000 cumulative orders,
      including deposits and cancellation clauses.
    whyItMatters: >-
      Pipeline optics can overstate demand if orders are nonbinding, lightly funded, or distributor inventory rather
      than end-customer commitments.
    diligencePath: >-
      Ask for representative distributor agreements, deposit receipts, cancellation terms, and channel margin schedules
      for the announced order book.
  - type: missing-source
    severity: material
    topic: practitioner-ecosystem
    missingEvidence: >-
      Public developer-signal or practitioner-community proxy showing operator, maintainer, or integrator activity
      around the platform
    whyItMatters: >-
      Post-launch support maturity is hard to judge without outside evidence that operators or technical partners are
      already engaging with the system
    diligencePath: >-
      Request operator-training materials, partner integration case studies, recruiting signals, or practitioner forums
      tied to AeroHT / Aridge deployments
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: cyber-privacy-controls
    missingEvidence: >-
      Public cybersecurity, privacy, secure-update, and incident-response documentation for the connected vehicle and
      flight-control stack
    whyItMatters: >-
      The product joins automotive, flight, and remote-control surfaces, so missing cyber/privacy disclosures leave a
      material trust and safety blind spot
    diligencePath: >-
      Request trust-center documentation, secure software lifecycle evidence, penetration-test summaries, and
      regulator/customer security questionnaires
  - type: private-evidence-only
    severity: material
    topic: certified-performance
    missingEvidence: >-
      Verified endurance, payload, noise, dispatch-reliability, and maintenance-interval data for the air module in real
      operating conditions
    whyItMatters: >-
      Public design claims are stronger than public operating data, which limits underwriting of reliability,
