      - number: '4.2'
        title: 定价机制与公开披露业务指标
        blocks:
          - type: paragraph
            body: >-
              香港官方服务页面未公布固定的运费价目表，而是引导用户前往 App
              查询，并提示费用会随路况、订单密度、运力充裕度、通行费、附加费及订单明细变更而动态浮动。官方条款同样允许收取加急优先费与附加服务费，且要求下单时即时支付。这些仅属标价规则，无法证明实际收益率、边际贡献或客户真实付费意愿。第三方网站
              Built In 称其 2025 年营收达 US$2.14 billion、履约完单量为 1.03 billion
              单，但该页面同时标注数据由主流大模型生成，未必反映真实核实信息。因此，上述数字仅能视作参考价值极弱的方向性信号。该数值登记为营收而非 ARR，且现有留存证据中未见任何 ARR 勾稽关系或经常性收入分母。
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI009
              - CI015
