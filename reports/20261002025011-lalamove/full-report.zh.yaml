      - number: '6.4'
        title: 重点图表
        blocks:
          - type: callout
            title: 双轨客户机制：散客即时撮合 vs 企业级系统对接
            body: >
              Lalamove 的客户群呈现深度分化：一端是承受动态调价波动的大量散单散客，另一端则是追求供应链确定性与自动化的大型企业伙伴。平台战略扩张的胜负手，取决于能否将偶发性发货的中小企业商户，转化为借助 API
              系统直连的结构化企业账户，以此对冲散客端天然的高流失率。
            calloutType: insight
            claimRefs:
              - CU003
              - CU008
              - CU013
          - type: callout
            title: 平台免责条款与履约纠纷敞口
            body: >
              东南亚、欧洲与美国适用的标准服务条款均推卸承运人责任，规定货运契约仅存在于发货人与独立承运伙伴之间。这种法律防火墙固然让平台免于承担运输途中货物灭失赔偿，却直接给要求投保与刚性 SLA
              履约兜底的企业级大客户招采设置了门槛。
            calloutType: risk
            claimRefs:
              - CU004
              - CU014
              - CU015
  - number: 7
    title: 核心风险
    sections:
      - number: '7.1'
        title: 监管与法律合规风险：用工定性、平台免责与跨法域分歧
        blocks:
          - type: paragraph
            body: >-
              Lalamove 将其交易网络定性为信息撮合平台，以私人承运协议撮合用户与独立第三方运力，在美、马、菲等主要市场均明文免除承运人责任。在美国，Lalamove (Delaware) Technology LLC
              依据《联邦仲裁法》与 New Era ADR 规则强制推行个人独立仲裁及集体诉讼弃权条款，同时将累计合同责任上限死死锁在订单金额的三倍或 USD 200（以较低者为准）。在东南亚运营子公司（如 Lalamove
              Malaysia Sdn Bhd 与 Lalamove Philippines,
              Inc.），合同同样将司机定性为第三方独立私人承运人，彻底剥离雇员属性。然而，各司法辖区持续收紧针对零工用工定性的法律框架与监管督查，持续瓦解免责条款筑起的防火墙，使平台始终暴露于用工定性违规诉讼与法定劳动福利索赔主张的法律风险之下。
            claimRefs:
