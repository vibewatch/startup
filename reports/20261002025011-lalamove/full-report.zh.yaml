        blocks:
          - type: paragraph
            body: >-
              Lalamove 以货主端 Delivery App 与司机端 Driver App
              作为即时撮合服务的核心交互界面。香港产品页面显示，平台支持极速订单撮合、收件人端实时可视化轨迹追踪，以及从小件步行、摩托车到面包车乃至 9
              吨货车的丰富车型；该页面同时注明预估运费受路况、发单峰值、运力密度、通行费及附加费影响浮动。在菲律宾，下单流程还集成了货到付款（COD）、票据代办、往返行程、等候时长、代购代付及协助装卸等增值选项。这些功能将业务链条延伸至单纯点对点运输之外，但具体可用性与上限因各区域市场和车型而异，并非全球统一的标准化
              SKU。公开证据中并未披露增值服务渗透率、任务完单率或量化的客户满意度成果。
