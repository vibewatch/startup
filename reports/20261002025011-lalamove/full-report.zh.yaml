              归集的数据池包含产品条款、技术博客与招聘信号，但未见公开的运行状态历史、SLO
              承诺、安全合规认证、故障记录、渗透测试报告或独立第三方产品基准评测。此类记录在证据库中的缺失属于证据缺口，并不直接等于内控全然缺位或系统从未发生过故障。
