        - 公开上市反复推迟与招股书失效，给一级市场投资人带来流动性悬顶风险。
        - 更新财务披露后正式向 HKEX 重新递表并获监管批复。
    notes: 投资驱动逻辑将已验证的平台运力规模与平台风险披露及司机责任免责条款做了对比平衡。
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV011
      - CV014
  - id: TV003
    title: Lalamove 情景分析：乐观、基准与悲观情景
    columns:
      - 情景
      - 运营与财务假设
      - 估值倍数与逻辑
      - 隐含估值
      - 下行触发因素与催化剂
    rows:
      - - 乐观情景
        - 顺利完成 HKEX IPO，海外收入占比突破 30%，维持两位数稳健增长。
        - 8.0x-10.0x EV/Revenue 倍数，对标全球顶尖数字基础设施平台。
        - $9.0B - $11.0B
        - 面对本土超级应用未能保住市占率；资本市场监管审批延期。
      - - 基准情景
        - 收入温和扩张，司机补贴克制投放，部分海外市场实现盈利。
        - 4.5x-6.5x EV/Revenue 倍数，对标 Full Truck Alliance 等上市物流可比公司。
        - $5.0B - $7.0B
        - 价格战导致利润率受压；承运合规带来运营开销上升。
      - - 悲观情景
        - 公开上市停滞，司机用工性质强制重分类，重点城市市占率流失。
        - 2.0x-3.5x EV/Revenue 倍数，反映承压物流撮合经纪业务估值倍数。
        - $2.5B - $4.0B
        - 强制为司机缴纳法定员工福利；平台遭遇严厉监管处罚或停业整顿。
    notes: 情景估值基于上市公司可比交易区间与监管走向测算隐含企业价值。
    claimRefs:
      - CV003
      - CV008
      - CV010
      - CV012
      - CV015
      - CV016
figures:
  - id: FO001
    title: 核心企业里程碑与战略融资时间线（2013-2026）
    type: timeline
    summary: 自创立至 2026 年的企业演进、融资轮次、海外扩张及监管挑战历史沿革。
    data:
      items:
        - date: 2013-12
          label: 创立 EasyVan
          detail: 周胜馥（Chow Shing-Yuk）在香港创立公司，旨在用移动应用撮合改造分散的货车货运物流。
          claimRefs:
            - CO001
            - CO007
        - date: 2014-06
          label: 更名 Lalamove 并进军区域市场
          detail: 为推进区域扩张，由 EasyVan 更名为 Lalamove，先后在新加坡、曼谷和台北开展运营。
          claimRefs:
            - CO002
        - date: 2019-02
          label: Series D 轮融资与跻身独角兽
          detail: 完成 $300 million Series D 轮融资，以超 $1 billion 估值正式跻身独角兽行列。
          claimRefs:
            - CO010
        - date: 2019-08
          label: 进军拉丁美洲市场
          detail: 业务版图由亚洲拓展至拉美，在圣保罗、里约热内卢和墨西哥城搭建货运网络。
          claimRefs:
            - CO003
        - date: 2020-11
          label: 遭遇印度市场监管禁令
          detail: 印度政府以国家安全与数据隐私为由封禁包括 Lalamove 在内的 43 款应用，印度业务被迫关停。
          claimRefs:
            - CO015
        - date: 2020-12
          label: Series E 轮融资（$515M）
          detail: 获得由 Sequoia Capital China、Hillhouse 和 Shunwei 领投的 $515 million Series E 轮融资，用于发力中国下沉市场。
          claimRefs:
            - CO010
        - date: 2021-07
          label: 转战香港筹备 IPO
          detail: 在境外上市监管收紧背景下，考虑将原定 $1 billion 赴美上市计划转向香港。
          claimRefs:
            - CO012
        - date: 2022-01
          label: 遭中国大陆交通监管部门约谈
          detail: 因货运资质合规、计价规则及平台扩张问题，遭上海及国家交通运输监管部门约谈。
          claimRefs:
            - CO016
        - date: 2025-06
          label: 推出「多拉汽车」（DuoLa Auto）新能源项目
          detail: 携手长安凯程（Changan Kaicene）联合推出「多拉汽车」（DuoLa Auto）纯电微卡项目，定向供应货运车辆。
          claimRefs:
            - CO003
        - date: 2026-07
          label: 携手 EY 达成低空经济战略合作
          detail: 与安永香港（EY）结成战略联盟，探索新兴低空经济领域中的企业运输物流方案。
          claimRefs:
            - CO005
    approximationNotes: 时间线事件基于各区域报告期内已核实的企业备案、新闻报道与公司官方公告整理。
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO005
      - CO007
      - CO010
      - CO012
      - CO015
      - CO016
  - id: FM001
    title: 市场规模层级架构：从宏观公路货运到聚焦同城即时货运
    type: pyramid
    summary: 公路物流市场从宏观公路货运到聚焦同城即时配送的层级拆解。
