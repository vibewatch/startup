      - number: '8.3'
        title: 情景推演、退出路径与尽调准绳
        blocks:
          - type: paragraph
            body: >-
              机构资金评估 Lalatech Holdings 的入局契机，须建立囊括乐观、基准与悲观三种经营结局的概率情景模型。乐观情景下，港交所重新递表获批或海外上市破局、东南亚与拉美利润率加速释放，叠加 B2B
              企业级客群统治力持续巩固，支撑起 $9.0B 至 $11.0B 的股权估值。基准情景下，有序推进 IPO 对应较为理性的 4.5 倍至 6.5 倍历史市销率估值区间，股权估值落于 $5.0B 至
              $7.0B，反映了经零工合规成本折价后的双边网络公用事业价值。悲观情景则推演了极端下行情境：司机劳动用工定性从严执法、平台抽佣遭遇行政限价，或上市进程无休止搁浅，平台估值将被大幅挤压至 $2.5B 至
              $4.0B，迫使公司不得不接受惩罚性流血下轮融资或高稀释性可转债搭桥资金。因此，机构投资取态维持 Track，鉴于 FY2022 之后经审计财报绝对缺失，且司机伙伴劳动定性监管悬而未决，置信度定为 Medium。
            claimRefs:
              - CV009
              - CV013
              - CV015
              - CV016
