  - id: FI001
    title: 收入模型拆解链条
    type: flow
    summary: 这套合同履约流程区分了货主付款、司机报酬和平台费用；毛利如何推导，目前仍未披露。
    data:
      nodes:
        - id: order
          label: 客户下单
          detail: 用户选择所需服务与车型需求。
        - id: quote
          label: 动态报价
          detail: 运费可能受路况、订单量、运力供给、路桥费、附加费和订单明细影响。
        - id: payment
          label: 客户付款
          detail: 订单生成后需即时结算，支持电子钱包或其他付款方式。
        - id: fulfillment
          label: 独立伙伴履约
          detail: 官方服务条款明确，运输服务由配送伙伴直接提供，而非 Lalamove。
        - id: driver-economics
          label: 司机报酬
          detail: 运费视为支付给运力伙伴；平台补贴与促销优惠券可作运费补充。
        - id: company-fees
          label: Lalamove 平台抽成与服务费
          detail: 菲律宾条款明确列示了应向 Lalamove 支付的便利费与综合管理费。
        - id: gross-profit
          label: 毛利润
          detail: 实际变现率、营销折扣、退款、支付通道成本和主营业务成本结构均未公开披露。
    approximationNotes: 这只是合同权利义务的概念流程；未测算收入、平台交易总额、变现率或毛利润。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI006
      - CI007
      - CI008
  - id: FE001
    title: 已公开的产品与技术架构栈
    type: stack
    summary: 基于可查公开信源梳理的技术栈，自用户与司机端界面贯穿至公司披露的通信、流计算、数据底座及集群运维层。
    data:
      items:
        - label: 用户与司机端交互界面
          detail: 货主端 App、司机端 App 及网页端承载下单预约、运力撮合与轨迹跟踪流程。
        - label: 业务与调度撮合层
          detail: 平台连接货主与独立运力伙伴，并根据区域市场套用车型与服务规则。
        - label: 消息通信网关
          detail: 全渠道 API 与模板后台为内部团队统一调度推送、SMS 短信与电子邮件。
        - label: 流式计算引擎
          detail: 依托 YARN 与 Kubernetes，Apache Flink 承载公司公开的实时分析、反欺诈与 LBS 业务负载。
        - label: 数据底座平台
          detail: Kafka 与 HBase 并存，正借助局部更新与变更日志向 Apache Paimon 推进数据架构迁移。
        - label: 集群运维管控
          detail: Autopilot 与 Kubernetes 控制面在既定窗口内管理作业调度、迁移、容灾恢复与资源弹性伸缩。
    approximationNotes: 各层顺序系对公开披露组件的分析性归纳，并非完整企业架构或经核实的数据流向图。
    claimRefs:
      - CE001
      - CE004
      - CE008
      - CE009
      - CE011
      - CE013
      - CE014
  - id: FU001
    title: Lalamove 客户旅程与全生命周期架构
    type: journey-map
    summary: 展示不同层级用户从获客导入、撮合履约到售后服务和业务扩张的完整流程。
    data:
      items:
        - label: 账户注册
          stage: 导入与报价
          description: 游客试算报价或手机验证注册账户
          touchpoints:
            - App 下载与手机号注册
            - SMS OTP 验证码核验与个人资料创建
        - label: 货物评估
          stage: 导入与报价
          description: 可选 AI 辅助包裹拍照评估与推荐适配合适车型
          touchpoints:
            - AI 货物拍照识别
            - 辅助车型尺寸建议
        - label: 报价与下单
          stage: 导入与报价
          description: 基于距离的费用计算与动态加价确认
          touchpoints:
            - 输入起送与目的地地址
            - 动态计价预估测算
        - label: 订单匹配
          stage: 订单派发与撮合
          description: 结合路线优化向独立司机伙伴算法广播推单
          touchpoints:
            - 平台自动化订单广播
            - 司机抢单接单，双方建立民事承运关系
        - label: 运输在途追踪
          stage: 订单派发与撮合
          description: 实时配送进度监控与司乘协同沟通
          touchpoints:
            - GPS 实时定位配送追踪
            - App 内货主司机即时通信
        - label: 履约交付与签收凭据
          stage: 履约交付与交接
          description: 线下提货、运输在途与目的地点位拍照签收
          touchpoints:
            - 货主确认货物包装
            - 电子签名或拍照签收凭据
        - label: 大客户深度拓展
          stage: 企业级大客户拓展
          description: 升级至企业授信看板、API 系统对接与多式联运方案
          touchpoints:
            - 开通 Lalamove for Business 企业版
            - 部门级用额授权分配
            - API 自动化发单与调度集成
    approximationNotes: 呈现个人及企业账户层级的标准化用户操作动线。
    claimRefs:
      - CU001
      - CU003
      - CU009
      - CU010
  - id: FR001
    title: 风险发生概率与严重程度评估矩阵
    type: matrix
    summary: 依发生概率与冲击烈度对核心法律合规、日常运营、网络安全及合作伙伴风险排布归类。
    approximationNotes: 评估基于平台服务条款、车联网遥测披露及网络安全行业基准做定性评级。
    claimRefs:
      - CR001
      - CR007
      - CR008
      - CR010
      - CR014
      - CR015
    data:
      columns:
        - 发生概率
        - 冲击严重程度
        - 残余风险敞口
        - 缓解现状
        - 投资逻辑冲击
      rows:
        - label: 零工身份误分类与道路运输承运资质风险
          values:
            - 中
            - 严重
            - 高
            - 私营承运合同条款与个体仲裁协议约束
            - 毛利率承压与商业模式被迫重组
        - label: 移动端 API 安全漏洞
          values:
            - 中
            - 严重
            - 高
            - 后端 TLS 加密、基于角色的权限访问控制与 SSL 证书签名
            - 品牌声誉受损、监管罚款与平台下架整顿
        - label: 车联网遥测与地理位置隐私合规
          values:
            - 高
            - 高
            - 中
            - 跨司法管辖区明示授权同意与本地化隐私政策
            - 招致监管审查并限制轨迹遥测数据的运营使用
        - label: 第三方支付处理机构宕机故障
          values:
            - 中
            - 高
            - 中
            - 接入多通道电子支付网关与现金托底兜底
            - 短期平台交易总额下滑与商户摩擦
        - label: 承运车队供给不足与司机流失
          values:
            - 高
            - 高
            - 中
            - 动态计价算法与弹性车型配置
            - 履约交付延迟、订单取消率走高与市占率流失
        - label: 货物受损与平台兜底保障缺位
          values:
            - 高
            - 中
            - 低
            - 格式条款将包装防损与安全责任完全转嫁给托运方
            - 引发商户纠纷并削弱高客单价货主的品牌信任
  - id: FV001
    title: Lalamove 投资建议决策逻辑与估值框架
    type: flow
    summary: 贯穿平台规模、监管风险与估值倍数的递进分析逻辑，最终导向「保持跟踪」建议。
    data:
      nodes:
        - id: scale-assessment
          label: 平台规模与双边流动性
          description: 覆盖 400+ 座城市的同城货运撮合龙头地位，拥有多梯队运力车型。
        - id: governance-check
          label: 监管摩擦与劳务合规
          description: 承运责任免责条款和司机独立承包商身份正面临司法与监管审查。
        - id: financial-opacity
          label: 财务数据披露断层
          description: 缺失 2022 年后合规经审计账目，削弱了精准估值建模依据。
        - id: multiple-evaluation
          label: 估值倍数校准对标
          description: 2021 年 Series F 轮 $10.0B 估值高位远超二级市场已压缩的物流可比倍数。
        - id: scenario-weighting
          label: 概率加权情景测算
          description: 测算基准情景 $5.0B 至 $7.0B 估值区间对比悲观下行底线。
        - id: stance-synthesis
          label: 最终投资立场
          description: 维持估值偏高判定，在上市招股书获核实前给予「保持跟踪」建议。
      edges:
        - source: scale-assessment
          target: governance-check
        - source: governance-check
          target: financial-opacity
        - source: financial-opacity
          target: multiple-evaluation
        - source: multiple-evaluation
          target: scenario-weighting
        - source: scenario-weighting
          target: stance-synthesis
    approximationNotes: 流程架构展现了指导机构投资组合入局的定性决策层级。
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV009
      - CV013
      - CV015
