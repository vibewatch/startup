      - number: '3.3'
        title: 定价机制、多栖并用与护城河韧性
        blocks:
          - type: paragraph
            body: >-
              即时物流平台的运价由动态基础车型起步价，结合实时订单量、路网拥堵程度、运力供给充裕度以及高速通行费等浮动附加费综合决定。Lalamove
              属于撮合中介而非公共承运人，运输责任与履约执行风险在合同中全额划归独立司机伙伴。尽管第三方市场观点认为 Lalamove
              凭借低于外卖平台的抽佣率换取了更高司机留存，但司机与企业货主的转移成本本质上依然极低。司机伙伴普遍在 GogoX 和 Grab 等竞对平台间“多栖”接单以压榨车辆闲置率；商业货主则同时备有多个配送 App
              规避高峰期动态溢价。主要的竞争风险集中在即时货运撮合的同质化通道化、激进竞对掀起的价格战压低抽佣，以及发展中枢纽市场针对零工用工身份日趋严密的监管审查。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
