      - number: '7.3'
        title: 生态与平台依赖风险：第三方支付机构、外部车队与调度掣肘
        blocks:
          - type: paragraph
            body: >-
              Lalamove
              的撮合机制深度依赖独立承运车队、个体司机伙伴、外部支付网关及云基础设施供应商。其服务条款明文免除破损、易腐或温控货物的承运兜底责任，把货物物理受损风险与包装完好责任全数划归用户与承运司机。此外，企业级账户与商用车队引入了多层交易对手依赖：企业管理员负责把控子账号权限，平台底层则仰仗第三方电子支付服务商与合规
              PCI-DSS 支付网关。一旦第三方支付通道出现宕机故障，抑或司机运力发生大规模流失断档，交易结算与线下履约将即刻停摆，平台自身缺乏自营实体运力作为容灾冗余。
