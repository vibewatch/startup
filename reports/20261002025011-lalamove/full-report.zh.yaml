  - number: 8
    title: 估值研判
    sections:
      - number: '8.1'
        title: 核心投资逻辑与反向反思（Anti-Thesis）
        blocks:
          - type: paragraph
            body: >-
              挂在 Lalatech Holdings 旗下的 Lalamove，已构筑起亚洲体量最大的同城即时物流与配送平台，连接着超 800
              万活跃平台用户与遍布亚洲及拉美的独立司机网络。核心做多逻辑立足于其在核心特大城市沉淀的货运撮合流动性、顶尖的算法车辆调度能力，以及在东南亚、拉美乃至近期进军中东的激进国际扩张版图。它汇聚从两轮车到 9
              吨重型商用货车的离散多元车型，把极度分散碎片化的同城货运市场，重塑为中小企业与大型物流客户即时可用的基础设施。相反，核心做空逻辑直指其严峻的结构性死穴：极高的用工定性政策监管敞口、面对 Grab
              等资金雄厚的多业态超级应用的正面肉搏，以及香港 IPO 招股书失效后悬而未决的股权流动性枯竭。此外，Lalamove
              坚持推行免除承运人责任的轻资产撮合机制，将车辆维保、履约与商业风险全额转嫁给独立承包商司机，在各大核心市场招致不绝于耳的劳工监管问责。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV011
              - CV014
