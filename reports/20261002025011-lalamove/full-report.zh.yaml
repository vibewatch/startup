      - number: '4.4'
        title: 财务最终研判与投资底线阻碍
        blocks:
          - type: paragraph
            body: >-
              营收质量仍未获证实。公开条款确立了若干计费机制，但缺乏判断收入持续性所必需的会计呈现方式、实际变现率、退款损耗、促销折让冲减、客户集中度以及地域收入构成。利润率走势的不确定性更高，因为现有评估证据中唯一的负面信号仅源于明确未获验证的
              AI
              生成文本。CAC（获客成本）、回收期、销售周期、运力利用率及渠道经济学等公开数据的缺失，导致外界无法可靠评估运营效率。更重要的是，累计融资金额是融资流量指标，不是期末现金余额；没有经审计的最新财报和资金流动勾稽表，就无法推导现金跑道。审慎的投资判断应将该商业模式视为可行，但把单位经济模型和资金充足度列为尚未解决的重大尽调疑点。
            claimRefs:
              - CI002
              - CI010
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 历史融资并不等于现金跑道
            body: 留存数据详细记录了历史融资轮次及 2022 年筹划的募资，但均未提供当前现金余额、财务现金消耗率或负债情况。缺乏载明基准日的资产负债表与现金流勾稽表，任何现金跑道结论都站不住脚。
            calloutType: risk
            claimRefs:
