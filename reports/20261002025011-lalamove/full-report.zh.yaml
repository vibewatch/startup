      - number: '1.3'
        title: 融资历史、估值锚点与运营规模指标
        blocks:
          - type: paragraph
            body: >-
              2019 年 2 月完成 $300 million D 轮融资后，Lalamove 跻身独角兽行列；2020 年 12 月拿下 Sequoia Capital China 领投、Hillhouse Capital
              与 Shunwei Capital 跟投的 $515 million E 轮融资，加速向中国下沉城市渗透。2021 至 2022 年，公司继续寻求私募股权融资并权衡上市路径，曾评估以约 $10 billion
              目标估值募集 $500 million；受跨境数据安全审查趋紧影响，上市规划也由赴美秘密递表转为转道香港联交所 IPO。运营规模上，月活跃用户与活跃司机从 2020 年末的 7.2 million 和
              480,000，扩张至公司口径宣称的超 8 million 用户与多达 15 million 注册司机。可是，包括过去 12
              个月年化营收、毛利率拆分及净现金消耗在内的完整审计财务数据均未公开，近期公开申报文件也未能核实。
            claimRefs:
