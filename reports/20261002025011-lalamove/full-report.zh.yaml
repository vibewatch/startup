      - number: '6.3'
        title: 留存动态、集中度隐患与客群摩擦
        blocks:
          - type: paragraph
            body: >
              Lalamove
              即时撮合市场的用户留存存在结构性摩擦，根源在于平台单边动态加价、免除运输损毁兜底责任，以及大客户框架协议之外完全缺乏长周期运量锁定承诺。标准用户协议规定，计费将随实时供需平衡、路况拥堵及运力分布动态波动，导致散客经常遭遇无法预期的临时加价。此外，条款明文规定包装若无法承受颠簸冲击，货物受损由货主负全责，而平台方对司机伙伴的履约疏漏或途中丢件一概免责。


              运力生态的恶化同样体现在司机业务纠纷与零工身份定性监管上，直接动摇了终端商户对网络履约稳定性的信任。在部分成熟市场，司机抗议抽成比例与派单算法所触发的集体停运事件时有发生，致使履约链条断裂，加剧了商户向同城竞品网络流失。另外，Lalamove
              采取开放式撮合架构，从未公开披露客户群留存指标（如净金额留存率 NRR 或毛金额留存率 GRR），导致客户集中度与实际壁垒深度成为未量化的尽调盲区。
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
