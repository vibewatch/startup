              - CU008
      - number: '6.2'
        title: 渗透路径、大客户拓展与技术融合
        blocks:
          - type: paragraph
            body: >
              平台渗透已从大中华区与东南亚的核心特大城市，纵深拓展至 EMEA 与美洲的国际区域枢纽，依托包括 Lalamove Netherlands B.V.、Lalamove (UK) Technology
              Limited 与 Lalamove (Delaware) Technology LLC 在内的本地化全资子公司展业。大型企业客户的引入日益侧重于跨行业供应链升级改造，典型范式包括与 Ernst & Young
              签署低空经济战略合作备忘录，探索打造融入无人机的立体城市低空物流网络。


              为提升交付效率与下单转化率，Lalamove
              在客户端交互界面嵌入了机器学习与计算机视觉算法工具。用户上传货物照片即可获得辅助性的算法车型推荐；系统底层调度算法则负责基于距离的动态路径规划与车队匹配。与此同步，企业端运力调度积极推动绿色电动化转型，2024
              年在中国大陆，新能源面包车（NEV）完单量已占全部面包车订单的约 60%，切中了大型企业减少 Scope 3 碳排放的硬性指标。
