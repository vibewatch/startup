            claimRefs:
              - CI001
              - CI005
              - CI006
      - number: '4.3'
        title: 成本结构、单位经济模型与资金依赖度
        blocks:
          - type: paragraph
            body: >-
              合同架构表明，由于依靠独立司机伙伴提供配送服务，平台避免了自营车队的重资本重折旧，但这并不等于整体资金需求低。菲律宾司机条款指明，平台须承担订单补贴与优惠券支出，使得维持双边流动性与促销费用成为直接的成本压力。Built
              In 的负面综合摘要称其毛利率下滑、净利润同比由盈转亏后趋于企稳；鉴于该网页内容未经审核且由 AI 生成，这一走势必须等待招股书或审计报告证实。历史融资金额绝不能等同于当下账面可用现金：Lalamove 曾披露
              2016 年完成 US$10 million 融资，Bloomberg 报道其 2022 年曾考虑募资 US$500 million，Tracxn 当前记录其 10 轮融资累计进账 US$2.28
              billion。但没有任何公开材料披露其 2026 年现金余额、会计口径的现金消耗速度、现金跑道、负债总额、营运资金或资本开支。
            claimRefs:
              - CI007
              - CI008
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
