      - number: '3.2'
        title: 能力架构与履约机制
        blocks:
          - type: paragraph
            body: >-
              Lalamove 将自身运营架构搭建为软件驱动的双边撮合市场，以私人承运合同连接货主商户与独立车主。相较两轮外卖配送平台，其核心产品壁垒在于载重能力的广阔弹性——上至 9 吨重型商用货车承载的 3,500
              公斤重载货物，下至轻便快递文件，均能自动完成货品类别匹配。平台免责条款声明，算法自动推荐车型仅属决策辅助工具，不作承运适配度的兜底保证。为做深企业端粘性并抵御通用型配送应用的侵蚀，Lalamove
              针对全渠道商贸系统提供企业级 API，并用 Lalamove Rewards 等结构化激励提高商户黏性。在马来西亚等区域扩张支点，Lalamove
              还接入数字金融与统一商业平台等中小企业生态，争取稳定企业客户留存。
            claimRefs:
              - CP006
              - CP007
              - CP008
