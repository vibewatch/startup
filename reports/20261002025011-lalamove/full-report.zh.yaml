      - number: '1.2'
        title: 核心管理层、治理架构与管理团队延续性
        blocks:
          - type: paragraph
            body: >-
              集团由斯坦福大学毕业生、前职业扑克选手周胜馥（Chow Shing-Yuk / Shing Chow）创立，他至今兼任董事长、总裁兼 CEO。高管团队保持核心层稳定，同时补充了首席运营官 Paul
              Loo、接替早期财务主管的首席财务官 Chen Guoji，以及司机运营总监 Gary
              Hui。战略资本配置、全球扩张规划及上市筹备均高度依赖创始人周胜馥一人，关键人风险显著。尽管管理层维持了跨区域业务增长，治理架构仍须持续应对跨境监管、司机关系以及中国大陆与海外市场双品牌运营带来的法务与业务摩擦。
            claimRefs:
              - CO007
              - CO008
