      - number: '5.2'
        title: 流式计算、数据中台与通信架构
        blocks:
          - type: paragraph
            body: >-
              关于架构底层最详实的证据，来自阿里云 2025 年基于 Lalamove 数据工程师在 Flink Forward Asia 大会上演讲所撰写的技术专文。据披露，其峰值计算节点超 500 个、Vcores 达
              8,000 核，双区域集群运行着数千个流式计算任务，并在实时分析、反欺诈风控与 LBS 定位服务中做到了秒级延迟。该平台在 Hadoop YARN 与 Kubernetes 上统筹任务调度，自研了定制化
              Flink SQL 环境，支持 SQL 或 JAR 包提交、血缘追踪、UDF、压力测试、监控、日志与告警。Lalamove 官方还提及内部自研的 Autopilot 系统，用于任务运维调控与弹性伸缩，且已向
              Apache Paimon 迁移以降低流式 Join 与维表关联合并时的复杂度与状态负担。另一篇 Lalamove 技术博客则介绍了统筹 App
              推送、短信与邮件分发全渠道网关。不过，所有技术成熟度宣称均出自公司或其工程师自述，缺乏独立的生产环境专项审计。
