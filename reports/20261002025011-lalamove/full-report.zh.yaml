      - number: '7.2'
        title: 运营、车联网车机感知与跨国数据合规风险
        blocks:
          - type: paragraph
            body: >-
              跨亚洲、拉美与 EMEA 运营庞大物流网络，让 Lalamove
              暴露于持续放大的网络安全、车联网遥测数据治理与数据合规风险之中。根据平台隐私政策，公司实时抓取司机端海量的传感器与定位遥测数据，包括接单配送全周期内手机加速度计与陀螺仪等运动传感器读数、完单后的 GPS
              定位轨迹、设备调度运行状态指标，以及人脸识别核身图像。针对物流类 App 软件架构的独立分析指出，超过 60% 的物流移动端安全漏洞起因于未受妥善保护的
              API，暴露出多租户派单调度后台底层的脆弱性。面对各扩张区域的分布式运营规模与监管合规门槛，Lalamove 组建了专门的全球数据工程团队，负责管控分布式数据链路、应急事件响应与隐私安全合规。
