            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV007
              - CV011
              - CV014
      - number: '8.2'
        title: 融资历程与估值标定校准
        blocks:
          - type: paragraph
            body: >-
              Lalamove 连续完成多轮后期融资，私募资本迅速累积。其 10 至 11 轮公开融资累计获得 $2.28 billion 至 $2.3 billion 股权投资，背后集结了 Hillhouse
              Capital、HongShan、Shunwei Capital、MindWorks Capital 与 Yolo Investments 等一线机构。公司估值高点出现在 2021 年 1 月，完成 $1.3
              billion F 轮融资，投后估值直冲 $10.0 billion；随后在 2021 年 12 月由 Yolo Investments 领投完成 F 轮追投，并在 2022 年筹划探讨规模达 $500
              million 的 pre-IPO 轮融资。然而，老股二级转让成交情报与公开市场同业重估信号均显示，2021 年流动性顶峰时期的一级市场估值背负着不可持续的高市销率倍数。港股与美股上市的对标物流平台——如
              Full Truck Alliance、JD Logistics 以及本地同城直接竞品 GoGoX——在 2022 至 2026 年间遭遇持续的估值乘数腰斩，证明在缺乏可查验的审计营收爆发式增长支撑下，一级市场
              $10 billion 的虚高估值标价早已脱离当前二级市场的定价纪律。
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV008
              - CV010
