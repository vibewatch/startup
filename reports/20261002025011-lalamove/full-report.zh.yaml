      - number: '8.4'
        title: 重点图表
        blocks:
          - type: callout
            title: 机构投资研判：维持 Track 评级
            body: >-
              Lalamove 固然是同城即时物流赛道难以替代的网络级资产，但当前一级市场账面估值反映的是 2021
              年流动性顶峰幻象，而非经审计的经营真实面。机构投资者理应保持跟进跟踪，在考虑老股转让受让前，必须要求调阅获权威审计确认的财务业绩凭证。
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV009
              - CV013
          - type: callout
            title: 平台劳工与监管合规脆弱性
            body: >-
              Lalamove
              利润率表现的核心底牌，是全盘免除承运人责任的轻资产独立承包商模式。一旦监管强力介入，强制要求兜底零工最低社保福利、推行集体协商机制，或直接将平台界定为商用运输承运商，都会直接重创平台抽佣变现率，并大幅侵蚀其造血现金流。
            calloutType: risk
            claimRefs:
              - CV005
              - CV007
              - CV015
