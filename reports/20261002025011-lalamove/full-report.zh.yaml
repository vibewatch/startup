      - number: '2.2'
        title: 客群画像、业务流切入与预算归属
        blocks:
          - type: paragraph
            body: >-
              Lalamove 的需求端划分为两大核心客群：商用中小企业（SMEs）与单次交易型个人消费者。在马来西亚等成熟区域市场，疫情催化的习惯转变使每月使用即时配送至少 5 次的高频用户激增
              277%，即时货运由此沉淀为常态化运营流程，不再只是应急手段。中小企业买家涵盖批发商贸、餐饮、汽配及电商商户。企业客户的物流预算通常归店长、运营主管或采购负责人管辖，核心诉求是规避自置车辆折旧与专职司机刚性薪酬。企业级方案提供合并开票、自动化履约结账的
              API 接入，以及集中化多点配载路线规划。相比之下，个人消费者主要发起偶发性居民搬家、大件家具配送与紧急个人跑腿，在移动端 App 按单即时自费结算。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM011
              - CM012
      - number: '2.3'
        title: 结构性增长驱动力、监管红线与渗透瓶颈
        blocks:
          - type: paragraph
            body: >-
              零售数字化转型、全渠道智慧零售普及，以及从两轮车到 9 吨大货车等多车型弹性城市配送需求的激增，共同推高了平台的渗透势头。然而，结构性摩擦与市场天花板也拖慢了扩张步伐。法律属性上，Lalamove
              严格将自身定位为中立的信息技术服务平台，绝非公共承运人或运输雇主。依照马来西亚与菲律宾等地的标准服务条款，运输责任与运营风险全部由独立司机伙伴在私人承运合同下承担。供给端变现上，平台高度依赖司机分级会员费（中国大陆每月介于
              CNY 99 至 CNY 699 不等，外加不可退押金）及单笔订单抽佣。司机留存敏感度、各城市货车限行管制、波动油价，以及统筹货物长宽高、重量、搬运上楼距离与车辆营运资质的算法定价复杂度，共同钳制了业务扩张。
            claimRefs:
              - CM008
              - CM009
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: 重点图表
        blocks:
          - type: callout
            title: 结构性边界：信息撮合平台 vs 公共承运人
            body: >-
              法律上，Lalamove
              严格将自身定位为信息撮合平台，不承担公共承运人责任，运输风险由私人承运合同下的独立司机伙伴承担。这套轻资产模式省去了车辆折旧负担，帮助业务快速跨地域扩张，但也让公司直接面对司机身份认定和平台收费公平性的监管压力。
            calloutType: insight
            claimRefs:
              - CM008
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争态势与市场阵营划分
        blocks:
          - type: paragraph
            body: >-
              亚洲与拉美市场的同城物流及即时配送呈现多元运营模式分立格局，并非铁板一块。Lalamove 面临四大不同阵营替代方案的竞争：即时超级应用、电商末端专业快递网络、传统计划性货运商，以及企业商户自建车队。虽然
              Grab 和 Gojek 等消费级出行超级平台已借助两轮车队切入近距小件快递和外卖配送，Lalamove 仍靠多车型运力调度建立起差异化壁垒，车型横跨摩托车、客运面包车、5.5 吨货车及 9
              吨商用大型货车。相比之下，Ninja Van 与 J&T Express
              等区域电商包裹物流网络深耕轴辐式分拣与小件次日达，而非点对点即时派单。在企业客群中，传统货运代理和线下的传统货车黄牛依托账期信贷支持与熟人司机关系，依然是根深蒂固的替代选项，导致商户在多个平台间“多栖”并用（multi-homing）成为普遍常态。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
