      - number: '3.4'
        title: 重点图表
        blocks:
          - type: callout
            title: 多车型护城河 vs 消费级超级应用跨界蚕食
            body: >-
              网约车超级应用固然坐拥极高的消费者认知度与高频交互，但其运力结构受限于两轮摩托车与标准家用轿车。Lalamove 的防御纵深建构在商用面包车、5.5 吨货车及 9
              吨重型卡车织就的运力底盘上，直击大宗批发、跨区搬家及工业级 B2B 货运诉求——超级应用若不从根本上重构司机准入和调度分发逻辑，绝难切入这一市场。
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP007
          - type: callout
            title: 多栖接单不对称性与承运伙伴跳单脱媒
            body: >-
              Lalamove 仅扮演撮合中介而非用人雇主，导致承运伙伴缺乏平台忠诚度。高密度城市核心区的司机频繁在多个 App
              间交叉接单；一旦与货主建立初次联系，极易转入线下私下长期合作，绕开平台抽佣，直接压制了平台的长期定价权。
            calloutType: risk
            claimRefs:
              - CP012
