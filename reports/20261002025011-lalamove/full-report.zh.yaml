  - number: 6
    title: 客户与需求分析
    sections:
      - number: '6.1'
        title: 客户细分与多层级用户架构
        blocks:
          - type: paragraph
            body: >
              Lalamove 的客户生态覆盖三大需求层级：用于个人点对点转运或偶发搬家的个人消费者；依赖弹性同城履约的中小企业（SME）商户；以及依托定制化 API
              接口与专属物流方案的大型企业客户。借助从步行人手、两轮摩托车延伸至 9 吨商用大型货车的梯级车型配置，Lalamove 在其所有运营版图内，既能接下微型跑腿即时速递，亦能承接大宗重载干线货运。


              企业与商业客户可在专属合作协议下使用进阶平台功能，涵盖企业数字化账期授信、集中开票、基于角色的多部门权限管控以及自动化工作流调度派单。普通消费者在移动端 App
              按单即时下单，企业客户则直接接入物流调度控制台。然而，各司法辖区的平台条款均明确免除公共承运人责任，并规定所有线下运输服务都由终端用户与独立车主直接签订私人承运合同。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
