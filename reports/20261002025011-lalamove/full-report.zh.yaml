chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业架构、业务版图与商业模式
        blocks:
          - type: paragraph
            body: >-
              Lalamove 于 2013 年 12 月在香港以 EasyVan 之名创立，2014 年完成品牌更名，全球业务挂在控股公司 Lalatech Holdings 旗下，在中国大陆则以 Huolala
              品牌运营。作为技术驱动的同城即时物流撮合平台，它连接个人消费者、企业商户与各级车型独立司机伙伴，车型囊括两轮摩托车、标准面包车，乃至 5.5 吨与 9 吨商用货车。公司业务覆盖东亚、东南亚、南亚、拉美及 EMEA
              区域的 14 至 16 个市场、超 400 座城市，营收主要来自算法动态订单撮合费、基于车型与里程的配送运费、司机端会员费以及抽佣。Lalamove Philippines, Inc. 与 Lalamove
              Malaysia Sdn Bhd 等本地运营主体负责各区域准入，并依严格条款将配送司机界定为第三方独立承包商，而非正式在册雇员。
            claimRefs:
