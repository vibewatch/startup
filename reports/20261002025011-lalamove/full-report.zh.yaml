  - number: 4
    title: 财务分析
    sections:
      - number: '4.1'
        title: 营收模式与会计确认边界
        blocks:
          - type: paragraph
            body: >-
              Lalamove 的公开条款将自身定位为撮合平台而非自营车队承运商。在马来西亚，公司声明平台仅负责连接用户与独立司机伙伴，运输服务并非由 Lalamove
              提供。在菲律宾，向客户收取的总费用中包含划归配送伙伴的款项，而平台增值服务费与行政管理费则作为自有收入归属
              Lalamove。这种划分关乎营收确认口径：客户交易流水总额（GMV）、司机实际收入与公司报表营收绝不能混为一谈。某商业软件服务商提及该赛道典型的司机抽佣比例约为 15% 至 20%，但该测算既非
              Lalamove 经审计的官方披露，亦无独立行业基准佐证，绝不能视作已实现的综合变现率（take rate）。合同上虽设优先调度费与附加增值费，但平台与司机之间的分成比例未见公开。
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI008
