      - number: '1.4'
        title: 监管阻力、地缘封禁与劳工争议
        blocks:
          - type: paragraph
            body: >-
              Lalamove 快速的全球扩张在主要运营地遭遇严峻监管与地缘摩擦。2020 年 11 月，印度政府以国家网络安全和国防安全为由封禁包括 Lalamove 在内的 43
              款移动应用，骤然终止该平台在印度的资本布局与商业运营。在中国大陆，交通主管部门与上海市交运部门于 2022 年 1 月集中约谈 Lalamove
              及同业竞品，重点督促整改客车载货、激进扩张、算法定价规则不透明及司机端会员费变相上涨等问题。此外，在东南亚和拉美市场，Lalamove
              通过格式条款将司机明确界定为独立承包商，要求司机全权承担承运责任，把车辆维保和日常运营风险直接转给司机伙伴。
            claimRefs:
              - CO015
              - CO016
              - CO006
      - number: '1.5'
        title: 重点图表
        blocks:
          - type: callout
            title: 双品牌架构与全球业务分层
            body: >-
              Lalamove 采取清晰的双轨运营策略：在中国大陆（其订单量与 GMV 最大的核心基本盘）以 Huolala 品牌展业，在东南亚、拉美及 EMEA 地区则启用 Lalamove
              品牌。这套架构将区域市场动态、获客节奏及监管沟通界面有效隔离，统一归入控股母公司 Lalatech Holdings 旗下。
            calloutType: insight
            claimRefs:
              - CO001
              - CO003
          - type: callout
            title: 监管摩擦与独立承包商用工脆弱性
            body: 平台运营面临结构性用工与合规风险。海外市场协议严格界定司机为独立承包商；中国大陆交通主管部门则频频审查司机收费机制与货运规范，持续给平台规模化扩张带来合规隐患。
            calloutType: risk
            claimRefs:
              - CO006
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、测算视角与现状替代品
        blocks:
          - type: paragraph
            body: >-
              即时物流的目标市场横跨同城公路货运、城市即时配送与计划性 B2B 商贸分销。以中国为代表的主要新兴市场，传统公路货运体量超 CNY 5,000 billion (USD 700 billion)，Bain
              测算全国拥有超 500 万辆重卡与 1400 万辆小型面包车。但 Lalamove 切入的核心盘是同城即时物流，仅中国单一大盘估值即达约 CNY 1,200 billion (USD 168
              billion)。其业务边界明确界定为依托摩托车、面包车及中轻型货车（如 5.5 吨和 9
              吨商用车）提供的即时点对点配送、大件零售分销、居民搬家及中小企业进补货。长途跨省整车干线（FTL）、冷链海运物流，以及重资产轴辐式快递分拨网络，则基本不在其即时模型辐射范围内。现有替代方案包括线下的路边货车黄牛中介、零售商户自建车队，以及传统第三方物流（3PL）公司——后者的定班运转节奏根本无法满足当日达或
              四小时内极速交付的诉求。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
