company:
  name: "Lalamove"
chapter:
  number: 4
  title: "Financials"
  summary: "Lalamove's current terms support a transaction-led platform model with variable delivery charges, company-retained convenience and administrative fees in the Philippines, and independent delivery partners. Public evidence does not disclose current cash, accounting cash burn, runway, audited unit economics, or realized take rates, so historical funding and weak third-party operating figures cannot establish capital adequacy."
sections:
  - id: "revenue-model"
    title: "Revenue model and recognition boundary"
    body: |-
      Lalamove's public terms describe a marketplace rather than a carrier-operated fleet. In Malaysia, the company says its platform connects users with independent driver partners and that the transport service is not provided by Lalamove. In the Philippines, customer charges include amounts deemed paid to delivery partners, while convenience and administrative fees are payable to Lalamove for its own account. This distinction matters for revenue recognition: gross customer charges, driver earnings, and company revenue are not interchangeable. A commercial software vendor describes a typical 15%-20% driver commission, but that estimate is neither an audited Lalamove disclosure nor independently benchmarked and should not be used as a realized take rate. Priority and add-on fees are contractually available, but their split between Lalamove and drivers is not disclosed.
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI008"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "pricing-and-traction"
    title: "Pricing mechanics and public traction"
    body: |-
      The Hong Kong service page does not publish a durable price list; it directs users to the app and says fares vary with traffic, order volume, driver availability, tolls, surcharges, and order-detail changes. Official terms likewise permit priority and add-on fees and require payment when an order is placed. These are list-price mechanics, not evidence of realized yield, contribution margin, or customer willingness to pay. A Built In page claims US$2.14 billion of 2025 revenue and 1.03 billion fulfilled orders, but the same page says its insights are generated from popular-LLM responses and may not reflect verified company information. Those figures are therefore weak directional signals only. The amount is labeled revenue, not ARR, and the retained evidence provides no ARR bridge or recurring-revenue denominator.
    claimRefs:
      - "CI001"
      - "CI005"
      - "CI006"
      - "CI009"
      - "CI015"
    tableRefs:
      - "TI002"
  - id: "costs-and-capital"
    title: "Cost structure, unit economics, and capital dependency"
    body: |-
      The contractual structure suggests lower owned-fleet capital intensity because independent partners provide delivery services, but it does not prove low total capital needs. Philippine driver terms identify order subsidies and promotional coupons funded by Lalamove, making marketplace liquidity and promotion expense explicit cost pressures. An adverse Built In synthesis says gross margin declined and profit fell year over year before stabilizing; because the page is unreviewed AI-generated content, that direction needs prospectus or audited-statement confirmation. Historical financing also cannot be treated as cash available today: Lalamove reported a US$10 million round in 2016, Bloomberg reported consideration of a US$500 million raise in 2022, and Tracxn currently reports US$2.28 billion raised across ten rounds. None discloses the 2026 cash balance, accounting cash burn, runway, debt, working capital, or capex.
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
    tableRefs:
      - "TI003"
  - id: "financial-verdict"
    title: "Financial verdict and underwriting blockers"
    body: |-
      Revenue quality remains unproven. Public terms establish several charging mechanisms, but not the accounting presentation, realized take rate, refund burden, promotional netting, customer concentration, or geographic revenue mix needed to judge durability. Margin progression is even less certain because the only current adverse signal in the assigned evidence is an explicitly unverified AI synthesis. The absence of public CAC, payback, sales-cycle, utilization, and channel-economics data prevents a credible efficiency assessment. Most importantly, cumulative funding is a financing-flow measure, not a cash balance; it cannot support a runway conclusion without current audited statements and a capital bridge. The appropriate underwriting stance is therefore to treat the revenue model as plausible but unit economics and capital adequacy as open, material diligence items.
    claimRefs:
      - "CI002"
      - "CI010"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
