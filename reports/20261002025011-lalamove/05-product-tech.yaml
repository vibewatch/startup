    title: "Assurance evidence is materially incomplete"
    body: "The assigned pool contains product terms, engineering narratives, and hiring signals, but no public status history, service-level objective, security certification, incident record, penetration-test result, or independent product benchmark. Absence of those records in the pool is an evidence gap, not proof that controls or incidents are absent."
