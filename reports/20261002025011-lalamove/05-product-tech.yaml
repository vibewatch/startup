company:
  name: "Lalamove"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Lalamove's disclosed product is a two-sided delivery platform spanning customer and driver applications, real-time tracking, multiple vehicle classes, and market-specific logistics add-ons. The strongest technical disclosure is a Lalamove-engineer presentation describing a hybrid Apache Flink estate of more than 500 nodes and 8,000 Vcores at peak; however, performance, security, availability, and product-outcome evidence remains company-issued rather than independently benchmarked."
sections:
  - id: "product-and-workflow"
    title: "Product Surfaces and Delivery Workflow"
    body: "Lalamove presents a customer Delivery App and a Driver App as the core interfaces for an on-demand matching service. The Hong Kong product page describes immediate order matching, receiver-visible real-time tracking, and vehicle choices from walkers and motorcycles to vans and 9-ton trucks; the same page states that displayed fares can vary with traffic, order volume, driver availability, tolls, and surcharges. In the Philippines, the booking workflow also exposes optional services such as cash-on-delivery, document handling, round trips, waiting time, purchase assistance, and loading help. These capabilities broaden the workflow beyond point-to-point transport, but availability and limits are market- and vehicle-specific rather than a single globally uniform SKU. The public evidence does not disclose attach rates, task-completion rates, or measured customer outcomes."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
    tableRefs:
      - "TE001"
      - "TE002"
    figureRefs: []
  - id: "operating-architecture"
    title: "Streaming, Data, and Communication Architecture"
    body: "The deepest architecture evidence comes from a 2025 Alibaba Cloud article based on a Flink Forward Asia presentation by Lalamove data engineers. It reports more than 500 computing nodes and 8,000 Vcores at peak, thousands of streaming jobs in two regional clusters, and second-level latency for real-time analytics, anti-fraud monitoring, and location-based services. The disclosed platform schedules workloads across Hadoop YARN and Kubernetes, offers a customized Flink SQL environment, and supports SQL or JAR submission, lineage, user-defined functions, stress testing, monitoring, logging, and alerting. Lalamove also describes an internal Autopilot for controlled job operations and autoscaling, plus a migration toward Apache Paimon to reduce the complexity and state burden of streaming and lookup joins. A separate Lalamove engineering narrative describes an omnichannel gateway that centralizes push, SMS, and email orchestration. All of these maturity claims originate with the company or its engineers and lack an independent production audit."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
      - "CE013"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "quality-trust-and-roadmap"
    title: "Quality, Trust, and Roadmap Evidence"
    body: "Current recruiting material is useful as developer-signal, but not as proof that every listed practice is deployed. An iOS role names Swift, Objective-C, UIKit or SwiftUI, MVC or MVVM, unit testing, documentation, performance optimization, and optional Fastlane or CI/CD experience. A Lalamove-authored QA posting says the team tests mobile and web products plus backend interfaces, while seeking familiarity with multi-data-center deployments and canary releases. The terms provide a more conservative boundary: services may be interrupted or contain errors, AI-enabled vehicle suggestions are assistive and non-binding, and users remain responsible for final vehicle selection. No assigned source supplies uptime history, service-level objectives, security certifications, penetration-test results, privacy-control audits, or incident metrics. Those omissions prevent a high-confidence reliability or security assessment despite evidence of formal testing roles and operational tooling."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE014"
      - "CE015"
    tableRefs: []
    figureRefs: []
  - id: "differentiation-and-readiness"
    title: "Differentiation and Technical Readiness"
    body: "The defensible technical asset appears to be operating know-how at delivery-marketplace scale: a two-sided workflow, regional vehicle and service configuration, large streaming infrastructure, internal resource automation, and centralized communications. The evidence supports complexity and scale, but not superiority over competing dispatch platforms because the pool contains no independent latency, fill-rate, routing-quality, fraud-loss, cost-per-order, or app-stability comparison. The proposed drone-linked enterprise service illustrates roadmap ambition rather than current product maturity. Reporting on the EY memorandum says the concept could connect aerial deliveries to Lalamove's ground network and business-system integrations, but no pilot, launch schedule, customer, or division of delivery stages had been announced. Technical diligence should therefore value demonstrated platform operations separately from unverified differentiation and exploratory roadmap options."
    claimRefs:
      - "CE007"
      - "CE009"
      - "CE010"
      - "CE013"
      - "CE016"
    tableRefs: []
    figureRefs: []
