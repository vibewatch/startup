    title: "Structural Boundary: Information Platform vs Common Carrier"
    body: "Lalamove legally positions itself strictly as an information matching platform, disclaiming common carrier liability and leaving transport risks to independent driver-partners under private carriage contracts. This asset-light model enables rapid geographic scalability without vehicle depreciation, but exposes the business to regulatory pushback surrounding driver classification and platform fee fairness."
