      - number: '4.2'
        title: Pricing mechanics and public traction
        blocks:
          - type: paragraph
            body: >-
              The Hong Kong service page does not publish a durable price list; it directs users to the app and says
              fares vary with traffic, order volume, driver availability, tolls, surcharges, and order-detail changes.
              Official terms likewise permit priority and add-on fees and require payment when an order is placed. These
              are list-price mechanics, not evidence of realized yield, contribution margin, or customer willingness to
              pay. A Built In page claims US$2.14 billion of 2025 revenue and 1.03 billion fulfilled orders, but the
              same page says its insights are generated from popular-LLM responses and may not reflect verified company
              information. Those figures are therefore weak directional signals only. The amount is labeled revenue, not
              ARR, and the retained evidence provides no ARR bridge or recurring-revenue denominator.
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI009
