      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Management Continuity
        blocks:
          - type: paragraph
            body: >-
              The group was founded by Stanford University graduate and former professional poker player Chow Shing-Yuk
              (also known as Shing Chow), who continues to serve as Chairman, President, and Chief Executive Officer.
              Executive governance features corporate stability at the top executive tier alongside strategic
              operational additions, including Chief Operating Officer Paul Loo, Chief Financial Officer Chen Guoji (who
              succeeded earlier finance leadership), and Director of Driver Operations Gary Hui. Key-person dependency
              on founder Shing Chow remains acute across strategic capital allocation, global expansion initiatives, and
              ongoing public listing preparations. While executive management has preserved platform growth across
              diverse geographic theaters, corporate governance continues to manage legal and operational tensions
              inherent in cross-border platform regulation, driver partner relations, and dual-brand operations across
              Mainland China and international markets.
            claimRefs:
