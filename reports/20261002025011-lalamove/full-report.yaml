  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      The contractual flow separates customer charges, driver compensation, company fees, and the currently undisclosed
      gross-profit bridge.
    data:
      nodes:
        - id: order
          label: Customer order
          detail: User selects service and vehicle requirements.
        - id: quote
          label: Dynamic quote
          detail: Traffic, volume, partner availability, tolls, surcharges, and order details can affect fare.
        - id: payment
          label: Customer payment
          detail: Charge is due when the order is placed through wallet or another payment method.
        - id: fulfillment
          label: Independent-partner fulfillment
          detail: Official terms state that delivery partners, not Lalamove, provide the transport service.
        - id: driver-economics
          label: Driver compensation
          detail: Delivery charges are deemed paid to partners; subsidies and promotional coupons can supplement fares.
        - id: company-fees
          label: Lalamove fee revenue
          detail: Philippine terms identify convenience and administrative fees payable to Lalamove.
        - id: gross-profit
          label: Gross profit
          detail: >-
            Realized take rate, promotions, refunds, payment costs, and cost-of-revenue bridge are not publicly
            disclosed.
    approximationNotes: >-
      Conceptual contractual flow only; it does not estimate revenue, gross transaction value, take rate, or gross
      profit.
