      - number: '3.3'
        title: Pricing Mechanics, Multi-Homing & Moat Resilience
        blocks:
          - type: paragraph
            body: >-
              Pricing across on-demand logistics marketplaces is governed by dynamic baseline vehicle rates combined
              with variable surcharges reflecting real-time order volume, road traffic congestion, delivery partner
              availability, and applicable highway tolls. Because Lalamove operates as a marketplace intermediary rather
              than a common carrier, transportation liabilities and operational execution risks are contractually
              assigned directly to independent driver partners. While third-party market commentary has suggested
              Lalamove achieves superior driver retention through lower commission take-rates compared to food-delivery
              platforms, switching costs for both drivers and corporate shippers remain inherently low. Driver-partners
              routinely multi-home across competing matching platforms like GogoX and Grab to maximize vehicle
              utilization, while commercial shippers maintain redundant courier applications to circumvent peak surge
              pricing. Adverse competitive risks center on commoditization of spot delivery matching, potential
              commission compression from aggressive platform rivals, and regulatory scrutiny over gig-worker
              classification in developing metropolitan markets.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Multi-Vehicle Moat vs Consumer Super-App Encroachment
            body: >-
              While ride-hailing super-apps boast massive consumer brand recognition and high-frequency engagement,
              their fleet architecture is overwhelmingly constrained to two-wheel motorbikes and standard passenger
              sedans. Lalamove's operational defense rests in its entrenched network of commercial vans, 5.5-ton trucks,
              and 9-ton heavy lorries, which directly address wholesale, relocation, and industrial B2B delivery needs
              that super-apps cannot accommodate without fundamentally altering driver onboarding and dispatch logic.
            calloutType: insight
            claimRefs:
              - CP001
              - CP002
              - CP007
          - type: callout
            title: Multi-Homing Asymmetry and Carrier Partner Disintermediation
            body: >-
              Because Lalamove operates strictly as a matching intermediary rather than an employer, carrier partners
              maintain minimal platform allegiance. Drivers in dense urban hubs frequently multi-home across multiple
              apps or negotiate direct offline recurring arrangements with merchants once initial contact is
              established, bypassing platform commission fees and capping long-term pricing power.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and recognition boundary
        blocks:
          - type: paragraph
            body: >-
              Lalamove's public terms describe a marketplace rather than a carrier-operated fleet. In Malaysia, the
              company says its platform connects users with independent driver partners and that the transport service
              is not provided by Lalamove. In the Philippines, customer charges include amounts deemed paid to delivery
              partners, while convenience and administrative fees are payable to Lalamove for its own account. This
              distinction matters for revenue recognition: gross customer charges, driver earnings, and company revenue
              are not interchangeable. A commercial software vendor describes a typical 15%-20% driver commission, but
              that estimate is neither an audited Lalamove disclosure nor independently benchmarked and should not be
              used as a realized take rate. Priority and add-on fees are contractually available, but their split
              between Lalamove and drivers is not disclosed.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI008
