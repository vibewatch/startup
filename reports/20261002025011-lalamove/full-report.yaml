      - number: '4.3'
        title: Cost structure, unit economics, and capital dependency
        blocks:
          - type: paragraph
            body: >-
              The contractual structure suggests lower owned-fleet capital intensity because independent partners
              provide delivery services, but it does not prove low total capital needs. Philippine driver terms identify
              order subsidies and promotional coupons funded by Lalamove, making marketplace liquidity and promotion
              expense explicit cost pressures. An adverse Built In synthesis says gross margin declined and profit fell
              year over year before stabilizing; because the page is unreviewed AI-generated content, that direction
              needs prospectus or audited-statement confirmation. Historical financing also cannot be treated as cash
              available today: Lalamove reported a US$10 million round in 2016, Bloomberg reported consideration of a
              US$500 million raise in 2022, and Tracxn currently reports US$2.28 billion raised across ten rounds. None
              discloses the 2026 cash balance, accounting cash burn, runway, debt, working capital, or capex.
            claimRefs:
              - CI007
              - CI008
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Revenue quality remains unproven. Public terms establish several charging mechanisms, but not the
              accounting presentation, realized take rate, refund burden, promotional netting, customer concentration,
              or geographic revenue mix needed to judge durability. Margin progression is even less certain because the
              only current adverse signal in the assigned evidence is an explicitly unverified AI synthesis. The absence
              of public CAC, payback, sales-cycle, utilization, and channel-economics data prevents a credible
              efficiency assessment. Most importantly, cumulative funding is a financing-flow measure, not a cash
              balance; it cannot support a runway conclusion without current audited statements and a capital bridge.
              The appropriate underwriting stance is therefore to treat the revenue model as plausible but unit
              economics and capital adequacy as open, material diligence items.
            claimRefs:
              - CI002
              - CI010
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding is not runway
            body: >-
              The retained sources describe historical rounds and a contemplated 2022 raise, but none provides current
              cash, accounting cash burn, or debt. No runway conclusion is supportable without a dated balance sheet and
              cash-flow bridge.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surfaces and Delivery Workflow
        blocks:
          - type: paragraph
            body: >-
              Lalamove presents a customer Delivery App and a Driver App as the core interfaces for an on-demand
              matching service. The Hong Kong product page describes immediate order matching, receiver-visible
              real-time tracking, and vehicle choices from walkers and motorcycles to vans and 9-ton trucks; the same
              page states that displayed fares can vary with traffic, order volume, driver availability, tolls, and
              surcharges. In the Philippines, the booking workflow also exposes optional services such as
              cash-on-delivery, document handling, round trips, waiting time, purchase assistance, and loading help.
              These capabilities broaden the workflow beyond point-to-point transport, but availability and limits are
              market- and vehicle-specific rather than a single globally uniform SKU. The public evidence does not
              disclose attach rates, task-completion rates, or measured customer outcomes.
            claimRefs:
