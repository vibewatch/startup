  - id: FU001
    title: Lalamove Customer Journey and Lifecycle Architecture
    type: journey-map
    summary: Visualizes customer acquisition, fulfillment matching, support, and expansion surfaces across user tiers.
    data:
      items:
        - label: Account Registration
          stage: Onboarding & Quotation
          description: Guest quotes or registered account setup with mobile authentication
          touchpoints:
            - App download and mobile registration
            - SMS OTP verification and profile creation
        - label: Cargo Assessment
          stage: Onboarding & Quotation
          description: Optional AI-assisted parcel photo assessment and vehicle recommendation
          touchpoints:
            - AI parcel photo capture
            - Auxiliary vehicle size suggestion
        - label: Quotation & Booking
          stage: Onboarding & Quotation
          description: Distance-based pricing calculation and dynamic fee confirmation
          touchpoints:
            - Pickup and drop-off address entry
            - Dynamic pricing estimate calculation
        - label: Order Matching
          stage: Order Dispatch & Matching
          description: Algorithmic broadcast to independent driver partners with route optimization
          touchpoints:
            - Automated platform order broadcast
            - Driver acceptance and private carriage formation
        - label: In-Transit Tracking
          stage: Order Dispatch & Matching
          description: Real-time delivery progress and driver coordination
          touchpoints:
            - Real-time GPS delivery tracking
            - In-app driver-shipper messaging
        - label: Fulfillment & Proof
          stage: Fulfillment & Hand-Off
          description: Physical pickup, transit, and photo proof of delivery at destination
          touchpoints:
            - Cargo packaging verification by shipper
            - Digital signature or photo proof of delivery
        - label: Enterprise Expansion
          stage: Enterprise Expansion
          description: Migration to corporate credit dashboards, API integrations, and multi-modal logistics
          touchpoints:
            - Lalamove for Business enrollment
            - Departmental credit allocation
            - API dispatch workflow automation
    approximationNotes: Represents standard user workflows across consumer and business account tiers.
