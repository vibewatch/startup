chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Lalamove, originally launched as EasyVan in Hong Kong in December 2013 and subsequently rebranded in 2014,
              operates globally under holding company Lalatech Holdings and conducts business as Huolala across Mainland
              China. The platform functions as a technology-driven on-demand intra-city logistics marketplace connecting
              individual consumers and commercial enterprise merchants with independent driver partners operating
              diverse vehicle classes, ranging from two-wheel motorcycles and standard passenger vans to 5.5-ton and
              9-ton commercial trucks. Operating across more than 400 cities in 14 to 16 global markets spanning East
              Asia, Southeast Asia, South Asia, Latin America, and the EMEA region, the company generates revenue
              primarily through dynamic algorithmic order matching fees, customer delivery tariffs based on vehicle type
              and mileage, driver platform membership tiers, and commission arrangements. Local operating subsidiaries,
              including Lalamove Philippines, Inc. and Lalamove Malaysia Sdn Bhd, govern regional access and enforce
              strict terms designating delivery drivers as third-party independent contractors rather than payroll
              employees.
            claimRefs:
              - CO001
              - CO002
