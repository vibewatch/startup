      - number: '5.3'
        title: Quality, Trust, and Roadmap Evidence
        blocks:
          - type: paragraph
            body: >-
              Current recruiting material is useful as developer-signal, but not as proof that every listed practice is
              deployed. An iOS role names Swift, Objective-C, UIKit or SwiftUI, MVC or MVVM, unit testing,
              documentation, performance optimization, and optional Fastlane or CI/CD experience. A Lalamove-authored QA
              posting says the team tests mobile and web products plus backend interfaces, while seeking familiarity
              with multi-data-center deployments and canary releases. The terms provide a more conservative boundary:
              services may be interrupted or contain errors, AI-enabled vehicle suggestions are assistive and
              non-binding, and users remain responsible for final vehicle selection. No assigned source supplies uptime
              history, service-level objectives, security certifications, penetration-test results, privacy-control
              audits, or incident metrics. Those omissions prevent a high-confidence reliability or security assessment
              despite evidence of formal testing roles and operational tooling.
            claimRefs:
