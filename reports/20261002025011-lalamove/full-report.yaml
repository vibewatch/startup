            body: >-
              The deepest architecture evidence comes from a 2025 Alibaba Cloud article based on a Flink Forward Asia
              presentation by Lalamove data engineers. It reports more than 500 computing nodes and 8,000 Vcores at
              peak, thousands of streaming jobs in two regional clusters, and second-level latency for real-time
              analytics, anti-fraud monitoring, and location-based services. The disclosed platform schedules workloads
              across Hadoop YARN and Kubernetes, offers a customized Flink SQL environment, and supports SQL or JAR
