      - number: '3.2'
        title: Capability Architecture & Delivery Mechanics
        blocks:
          - type: paragraph
            body: >-
              Lalamove structures its operating model as a software-mediated two-sided marketplace connecting commercial
              shippers with independent vehicle operators under private contracts of carriage. The platform's core
              functional differentiator against two-wheel food delivery platforms is its vehicle payload versatility,
              accommodating shipments from small courier envelopes up to 3,500-kilogram cargo loads on 9-ton commercial
              trucks with automated cargo category matching. Platform disclaimers establish that automated vehicle
              recommendation algorithms operate strictly as decision-support tools without operational guarantees of
              carriage suitability. To drive enterprise engagement and defensibility against generic courier apps,
              Lalamove provides enterprise API integrations for unified commerce platforms alongside structured merchant
              loyalty incentives such as the Lalamove Rewards program. Furthermore, in regional expansion hubs such as
              Malaysia, Lalamove integrates with SME ecosystem initiatives including digital finance and unified
              commerce platforms to anchor enterprise customer retention.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
