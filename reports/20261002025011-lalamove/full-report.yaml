      - number: '1.3'
        title: Financing History, Valuation Benchmarks, and Operational Scale Metrics
        blocks:
          - type: paragraph
            body: >-
              Lalamove established early unicorn status in February 2019 following a $300 million Series D financing
              round, later securing $515 million in Series E funding in December 2020 led by Sequoia Capital China with
              participation from Hillhouse Capital and Shunwei Capital to extend logistics penetration into lower-tier
              Chinese municipalities. By 2021 and 2022, the company pursued further private financing rounds and weighed
              public listing paths, evaluating a potential $500 million capital raise at a target valuation of roughly
              $10 billion while shifting initial ambitions from a confidential US listing to a Hong Kong Stock Exchange
              initial public offering amid heightened cross-border data security rules. Operational scale expanded from
              7.2 million monthly active users and 480,000 active drivers in late 2020 to company statements and
              disclosures citing over 8 million users and a registered pool of up to 15 million drivers. However,
              comprehensive audited financial metrics, including trailing annual revenue run-rates, gross margin splits,
              and net cash burn, remain private disclosures without recent public filing verification.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
