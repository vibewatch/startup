  - id: FE001
    title: Disclosed Product and Technology Stack
    type: stack
    summary: >-
      A source-bounded stack from customer and driver interfaces through company-reported communications, streaming,
      data, and cluster operations.
    data:
      items:
        - label: Customer and driver interfaces
          detail: Delivery App, Driver App, and web access expose booking, matching, and tracking workflows.
        - label: Service and matching layer
          detail: >-
            The platform connects users with independent driver partners and applies market-specific vehicle and service
            rules.
        - label: Communication gateway
          detail: An omnichannel API and template portal orchestrate push, SMS, and email for internal teams.
        - label: Streaming compute
          detail: >-
            Apache Flink runs company-reported real-time analytics, anti-fraud, and location-based workloads across YARN
            and Kubernetes.
        - label: Data platform
          detail: Kafka and HBase coexist with an ongoing Apache Paimon migration using partial updates and changelogs.
        - label: Cluster operations
          detail: >-
            Autopilot and Kubernetes controls manage job operations, migration, recovery, and resource scaling within
            defined windows.
    approximationNotes: >-
      The layer order is an analytical presentation of disclosed components, not a complete company architecture or
      verified data-flow diagram.
