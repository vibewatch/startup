  - id: FR001
    title: Risk Severity and Likelihood Evaluation Matrix
    type: matrix
    summary: Matrix mapping top legal, operational, cybersecurity, and partner risks by likelihood and impact severity.
    approximationNotes: >-
      Evaluations reflect qualitative risk ratings derived from platform terms of service, telematics disclosures, and
      industry cybersecurity benchmarks.
    claimRefs:
      - CR001
      - CR007
      - CR008
      - CR010
      - CR014
      - CR015
    data:
      columns:
        - Likelihood
        - Impact Severity
        - Residual Exposure
        - Mitigation Status
        - Thesis Impact
      rows:
        - label: Gig-Worker Misclassification & Carrier Licensing
          values:
            - Medium
            - Critical
            - High
            - Contractual private carriage terms and individual arbitration agreements
            - Margin compression and operating model restructuring
        - label: Mobile API Security Vulnerabilities
          values:
            - Medium
            - Critical
            - High
            - Backend TLS encryption, role-based access control, and SSL certificate signing
            - Brand damage, regulatory fines, and platform suspension
        - label: Telematics and Location Privacy Compliance
          values:
            - High
            - High
            - Medium
            - Explicit multi-jurisdictional consent disclosures and localized privacy policies
            - Regulatory scrutiny and operational limitations on tracking telemetry
        - label: Third-Party Payment Processor Outages
          values:
            - Medium
            - High
            - Medium
            - Multi-channel electronic gateways and cash settlement fallback
            - Temporary gross transaction volume reduction and merchant friction
        - label: Carrier Fleet Supply Shortfalls and Churn
          values:
            - High
            - High
            - Medium
            - Variable pricing algorithms and flexible vehicle categories
            - Fulfillment delays, order cancellations, and lost market share
        - label: Cargo Damage and Absence of Platform Protection
          values:
            - High
            - Medium
            - Low
            - Strict terms shifting packaging and protection liability entirely to users
            - Merchant disputes and brand trust erosion among high-value shippers
  - id: FV001
    title: Lalamove Recommendation Decision Logic and Valuation Framework
    type: flow
    summary: >-
      Sequential analytical logic tracing platform scale, regulatory risks, and valuation multiples to a Track
      recommendation.
    data:
      nodes:
        - id: scale-assessment
          label: Platform Scale & Liquidity
          description: Dominant intra-city delivery matching across 400+ cities and multi-tier vehicle fleets.
        - id: governance-check
          label: Regulatory & Labor Friction
          description: Carrier liability disclaimers and driver independent contractor status face legal scrutiny.
        - id: financial-opacity
          label: Financial Disclosure Gap
          description: Absence of certified post-2022 audited accounts impairs precision modeling.
        - id: multiple-evaluation
          label: Valuation Multiple Calibration
          description: 2021 Series F peak at $10.0B exceeds compressed public logistics comparable multiples.
        - id: scenario-weighting
          label: Probabilistic Scenario Weighting
          description: Modeling base-case valuation range of $5.0B to $7.0B versus bear downside.
        - id: stance-synthesis
          label: Final Investment Stance
          description: Stretched valuation stance and Track recommendation pending verified IPO filing.
      edges:
        - source: scale-assessment
          target: governance-check
        - source: governance-check
          target: financial-opacity
        - source: financial-opacity
          target: multiple-evaluation
        - source: multiple-evaluation
          target: scenario-weighting
        - source: scenario-weighting
          target: stance-synthesis
    approximationNotes: Flow architecture models the qualitative decision hierarchy guiding institutional portfolio entry.
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV009
      - CV013
      - CV015
