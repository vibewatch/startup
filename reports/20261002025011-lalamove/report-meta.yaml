  topStrengths:
    - Large and durable on-demand logistics network across multiple regions and vehicle classes.
    - Asset-light marketplace model supported by independent driver partners rather than an owned fleet.
    - Multiple monetization levers through delivery tariffs, platform fees, and ancillary charges.
  topRisks:
    - Audited post-2022 financials, current cash, and runway remain undisclosed.
