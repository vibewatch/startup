callouts:
  - calloutType: "insight"
    title: "Dual-Brand Architecture and Global Enterprise Segmentation"
    body: "Lalamove maintains a strategic operational duality: operating as Huolala in Mainland China (its largest market by volume and GMV) while deploying the Lalamove brand across Southeast Asia, Latin America, and EMEA. This structure compartmentalizes regional market dynamics, customer acquisition, and regulatory interfaces under holding umbrella Lalatech Holdings."
    claimRefs:
      - "CO001"
      - "CO003"
  - calloutType: "risk"
    title: "Regulatory Friction and Independent Contractor Labor Vulnerabilities"
    body: "Platform operations face structural labor and regulatory exposure. Across international markets, driver terms strictly assert independent contractor status, while municipal and ministerial transport authorities in Mainland China have repeatedly scrutinized driver fees and freight practices, presenting ongoing compliance risks to platform scalability."
    claimRefs:
      - "CO006"
      - "CO016"
