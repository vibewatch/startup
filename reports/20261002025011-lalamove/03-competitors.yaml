callouts:
  - calloutType: "insight"
    title: "The Multi-Vehicle Moat vs Consumer Super-App Encroachment"
    body: "While ride-hailing super-apps boast massive consumer brand recognition and high-frequency engagement, their fleet architecture is overwhelmingly constrained to two-wheel motorbikes and standard passenger sedans. Lalamove's operational defense rests in its entrenched network of commercial vans, 5.5-ton trucks, and 9-ton heavy lorries, which directly address wholesale, relocation, and industrial B2B delivery needs that super-apps cannot accommodate without fundamentally altering driver onboarding and dispatch logic."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP007"
  - calloutType: "risk"
    title: "Multi-Homing Asymmetry and Carrier Partner Disintermediation"
    body: "Because Lalamove operates strictly as a matching intermediary rather than an employer, carrier partners maintain minimal platform allegiance. Drivers in dense urban hubs frequently multi-home across multiple apps or negotiate direct offline recurring arrangements with merchants once initial contact is established, bypassing platform commission fees and capping long-term pricing power."
    claimRefs:
      - "CP012"
      - "CP013"
      - "CP014"
