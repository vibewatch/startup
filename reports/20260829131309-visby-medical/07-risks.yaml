- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk category
  - Mitigation in place
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - OTC adoption
    - Authorized product, partner distribution, telehealth integration
    - Sell-through versus breadth of channel footprint
    - Persistent weak demand despite broad availability
    - Downgrade growth case and assume new capital is needed
  - - Regulatory / post-market
    - FDA authorization plus validation record
    - Complaint, MDR, warning, or labeling issue
    - Material FDA action, field correction, or recall
    - Treat as thesis-break until root cause and remediation are proven
  - - Manufacturing quality
    - San Jose facility investment and scale-up work
    - Yield, supply, or fulfillment slippage
    - Evidence of recurring batch failure or inability to supply demand
    - Assume gross-margin and brand damage, not just short delay
  - - Funding / valuation
    - Series F capital and large historical capital base
    - Need for additional financing before launch proof
    - Capital raise required before demand durability or margin path is shown
    - Reset valuation stance and downside expectations
  - - Competition
    - First-mover OTC authorization and brand novelty
    - Incumbent launches or lower-price alternatives
    - Roche-like or other well-funded competitor enters adjacent or OTC lane aggressively
    - Assume pricing pressure and higher CAC
  - - Data / privacy
    - Policies, cloud partner, and service-provider controls
    - Security incident or partner-side data event
    - Material breach of STI or respiratory result data
    - Assume regulatory scrutiny and lasting reputational damage
  notes: Triggers are designed to be observable from future public reporting or diligence materials; several require management disclosure because public unit economics and post-market data are not yet available.
