- id: mitigations-and-kill-criteria
  title: Mitigations and kill criteria
  body: 'The case is not uninvestable, but the mitigations that exist today are mostly enabling conditions rather than proof that the end market is already durable. FDA authorization, partner distribution, telehealth integration, and continued manufacturing investment all reduce some early commercialization friction. None of them, however, substitutes for repeat purchase, reimbursement, gross margin, or low-cost scale. That is why the right monitoring framework is event driven. Positive signals would include clean post-market performance, evidence that OTC sell-through matches the breadth of distribution, follow-on assay clearances that broaden the revenue base, and proof that the company can avoid raising capital again before those milestones are established. Negative signals are easier to define and should be treated as thesis-break risks: a quality event or recall, an inability to replace paused clinical revenue with consumer demand, material partner churn in telehealth or ecommerce,
    failure to win new authorizations on time, or a cheaper incumbent-led competitive entry that compresses price before reimbursement expands. Those are the indicators that would change the investment conclusion fastest.'
