- id: competitive-and-people-execution-risk
  title: Competitive and people/execution risk
  body: Visby's regulatory first-mover position should not be confused with long-term insulation. Roche already has cleared and CLIA-waived molecular STI assays for institutional settings, and Cepheid's public menu shows broad coverage across CT/NG, Trichomonas, influenza, and SARS-CoV-2. That means nearly every adjacent expansion area Visby wants to pursue already has better-resourced molecular incumbents with installed workflow surfaces. Internally, the operating challenge is also bigger than adding demand generation. The company is moving from clinician-led point-of-care selling toward consumer ecommerce, telehealth conversion, support operations, and delivery-partner orchestration. Public biographies still concentrate external trust in founder-CEO Adam de la Zerda and CMO Gary Schoolnik, while the 2025 board refresh explicitly added manufacturing and cost-efficiency expertise. That is a rational move, but it also signals that scaling a consumer diagnostics business remains a live execution
    problem. The public record shows strong medtech and clinical credentials, yet it does not show a long public track record of national consumer-diagnostics scaling across the visible leadership group.
