company:
  name: Visby Medical
chapter:
  number: 7
  title: Risks
  summary: 'Visby Medical''s risk profile is dominated by category novelty and execution concentration rather than by a lack of technical ambition. The core downside stack is an interlocking one: a first-of-category OTC PCR product still faces evolving FDA expectations, the company appears to manufacture from a single San Jose site, the commercial model now depends on cloud, telehealth, and channel partners, and the June 2025 valuation leaves little room for a slow OTC ramp given only lightly disclosed revenue. First-mover status and strong partners are real mitigants, but the thesis can still break quickly if quality, adoption, reimbursement, or competitor timing goes wrong.'
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: Visby's current lead product is not entering a mature reimbursement or enforcement lane; it is helping define one. The strongest de-risking fact is that FDA did authorize the first home test for chlamydia, gonorrhea, and trichomoniasis and the first OTC PCR sexual-health product, but that same novelty creates underwriting uncertainty. Future assays for respiratory infections, sore throat, urinary tract infection, and other common illnesses still need their own submissions, so the existing authorization does not collapse the regulatory burden across the whole roadmap. The De Novo classification also cuts both ways. It validates the category and strengthens Visby's first-mover narrative, yet it also means later entrants will not face the exact same first-in-category burden. Legal exposure extends beyond accuracy. Visby's own privacy and terms pages show that the workflow spans websites, apps, devices, lab analyses, service providers, care handoff, and arbitration-sensitive consumer
    interactions. For a home STI product, that makes privacy, breach response, labeling discipline, and post-market signal management part of the core regulatory case, not adjacent compliance work.
  claimRefs:
