  headquarters: San Jose, California, USA
  productSummary: Visby Medical sells instrument-free single-use PCR diagnostic tests for sexually transmitted infections and respiratory infections, available both at home (OTC) and at the point of care in clinical settings.
  customerFocus: Women seeking private at-home STI testing; urgent care and physician offices (POC clinical, currently paused); telehealth and e-commerce platform partners; public health distribution channels.
  businessModel: Disposable test cartridge sales at ~$149.99 per test (B2C OTC) and clinical per-test pricing (~$150) through professional channels (paused). Revenue flows through DTC, e-commerce partners, clinical distributors, and on-demand delivery partnerships.
  stage: Late-stage private
