  topStrengths:
  - First and only FDA-authorized OTC PCR test for STIs (De Novo March 2025) and first OTC at-home multi-viral PCR test (FDA July 2026); category-defining regulatory position.
  - Instrument-free single-use disposable form factor is a genuine technical moat backed by 12+ years and $487M of development investment.
  - Strong distribution network (DoorDash, Everlywell, Quest, LabCorp, Wisp, RAINN) and Google Cloud infrastructure already in place for consumer scale.
  topRisks:
  - No audited financials, confirmed revenue, or consumer adoption metrics; revenue multiple of ~28x on estimated $35M is very high for a medical device company.
  - Single manufacturing site in San Jose creates concentration risk; OTC consumer market development is unproven at scale with $149.99/test price point.
  - Pausing clinical POC sales creates a revenue gap and potential for larger incumbents (Abbott, Roche, Cepheid) to strengthen position while Visby transitions.
  unresolvedGaps:
  - Confirmed revenue, gross margins, and path to profitability with audited financials.
  - "Consumer adoption metrics: units sold, repeat purchase rate, customer acquisition cost, and conversion from partner platforms."
  - "Men's STI test and respiratory OTC pipeline: FDA clearance timeline and commercial launch plan."
  - Insurance reimbursement strategy and CPT code coverage progress for OTC molecular tests.
