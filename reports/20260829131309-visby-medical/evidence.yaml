evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership table completeness
    missingEvidence: >-
      A complete current org chart and employment status confirmation for all vice-presidents beyond the named public
      roster.
    whyItMatters: >-
      Key-person concentration, succession planning, and execution depth depend on whether the public list matches the
      operating bench.
    diligencePath: >-
      Request the latest org chart and executive-bio packet from management and compare it against the public leadership
      page.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: investor map completeness
    missingEvidence: >-
      The exact post-Series F cap table, board rights, liquidation preferences, and any secondary transactions remain
      undisclosed.
    whyItMatters: >-
      Control mechanics and liquidation stack details shape governance, exit economics, and downside protection for new
      investors.
    diligencePath: Request the post-Series F financing documents, cap table, and board observer rights schedule during diligence.
    relatedQuestionRefs:
      - QO020
      - QO029
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: exact operating scale
    missingEvidence: A company-confirmed 2026 revenue figure and exact current employee count are not public.
    whyItMatters: >-
      Valuation support, burn analysis, and launch-readiness assessment all depend on a firmer view of current
      commercial scale.
    diligencePath: >-
      Ask management for the latest monthly revenue run-rate, audited or board-reported annual revenue, and exact
      employee count by function.
    relatedQuestionRefs:
      - QO022
      - QO029
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: point-of-care restart timing
    missingEvidence: >-
      Management has not publicly disclosed the trigger conditions, timing, or economics for resuming paused clinical
      point-of-care sales.
    whyItMatters: >-
      The value of the clinical channel depends on whether the pause is a short tactical detour or a deeper go-to-market
      reset.
    diligencePath: >-
      Request a board or budget presentation showing the channel roadmap, restart criteria, and expected contribution by
      channel.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: public-health-channel
    missingEvidence: Named public health department deployments procurement contracts or volume commitments for Visby products.
    whyItMatters: >-
      Without named public-sector buyers the B2G channel remains more strategic possibility than evidenced current
      revenue lane.
    diligencePath: Request public-sector customer references pilot summaries or procurement records from management.
    relatedQuestionRefs:
      - QM014
  - type: missing-source
    severity: material
    topic: reimbursement
    missingEvidence: Published payer policies or claims data showing routine reimbursement for OTC molecular STI testing.
    whyItMatters: >-
      Reimbursement would materially widen the reachable population beyond self-pay early adopters and reduce price
      friction.
    diligencePath: Review payer medical-policy databases coding guidance and channel-partner reimbursement data.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: otc-sell-through
    missingEvidence: >-
      Cohort retention reorder rate unit sales pharmacy velocity and channel-level gross margin for the OTC women's STI
      product.
    whyItMatters: >-
      These metrics are necessary to move from broad TAM language to a defensible near-term SOM and contribution-margin
      view.
    diligencePath: Request sell-through dashboards partner reports and by-channel unit economics from management.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: minor
    topic: pipeline-expansion
    missingEvidence: >-
      Regulatory timing launch sequencing and payer assumptions for the men's sexual health test and OTC respiratory
      rollout.
    whyItMatters: >-
      Those launches could expand Visby's serviceable market but timing uncertainty limits how much expansion should be
      underwritten today.
    diligencePath: Request regulatory correspondence launch plans and forecast assumptions for the men's and respiratory products.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: instrument-economics
    missingEvidence: >-
      Public instrument price cards, service contracts, and realized cartridge economics for Cepheid, Abbott, Roche, and
      BioFire in comparable care settings.
    whyItMatters: >-
      Exact equipment economics determine whether Visby's consumer price premium is offset by lower capital intensity or
      whether clinic buyers still favor installed systems.
    diligencePath: >-
      Request reseller quotes, distributor contracts, or procurement records from clinics using GeneXpert, ID NOW, cobas
      liat, and FilmArray.
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: otc-sell-through-vs-competition
    missingEvidence: >-
      Sell-through, reorder, CAC, and conversion data showing how Visby performs against labs, telehealth substitutes,
      and adjacent home-molecular entrants in the field.
    whyItMatters: >-
      Without real cohort and conversion data, it is difficult to know whether the moat is translating into durable
      commercial share or only first-purchase novelty.
    diligencePath: >-
      Request channel dashboards from Everlywell, Quest, Optum, and management with repeat purchase, fulfillment, and
      telehealth conversion metrics.
  - type: private-evidence-only
    severity: minor
    topic: incumbent-otc-roadmaps
    missingEvidence: >-
      Internal roadmaps or market-intelligence evidence showing whether Abbott, Roche, Cepheid, or BioFire are actively
      building or piloting OTC molecular sexual-health products.
    whyItMatters: >-
      The durability of Visby's lead depends partly on how quickly scaled incumbents decide to pursue the same category
      with stronger channels and reimbursement experience.
    diligencePath: >-
      Ask management and channel partners for competitive-intelligence briefs and monitor new FDA submissions and
      industry conference disclosures.
  - type: missing-source
    severity: material
    topic: reimbursement-economics
    missingEvidence: Published payer policies, claims acceptance data, and reimbursed claim examples for the OTC women's test.
    whyItMatters: >-
      Without payer evidence, the reachable market remains constrained by self-pay willingness rather than purely by
      clinical need.
    diligencePath: Review payer medical-policy databases, claims files, and any reimbursement pilots or channel-partner billing data.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Current and historical gross margin by product family, plus a unit-level COGS waterfall and yield data.
    whyItMatters: Margin is the central determinant of whether Visby's disposable PCR model can scale into attractive economics.
    diligencePath: >-
      Request management reporting on gross margin, bill of materials, manufacturing yield, scrap, freight, and partner
      fees.
    relatedQuestionRefs:
      - QI016
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: burn-runway
    missingEvidence: Latest cash balance, monthly burn, inventory build requirements, and board-approved operating plan.
    whyItMatters: Public runway estimates remain scenario-based until actual cash and burn data are reviewed.
    diligencePath: Request the latest board package, cash waterfall, cash forecast, and any debt or covenant schedules.
    relatedQuestionRefs:
      - QI023
      - QI024
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: net-pricing-and-cohorts
    missingEvidence: By-channel realized ASP, marketplace take rates, return rates, repeat purchase cohorts, CAC, and payback.
    whyItMatters: List pricing and launch breadth do not show whether the consumer engine compounds or destroys margin as it scales.
    diligencePath: Request channel-level sales dashboards, retention cohorts, promotion data, and marketplace settlement statements.
    relatedQuestionRefs:
      - QI008
      - QI011
    relatedTableRefs:
      - TI001
      - TI002
  - type: access-blocked
    severity: minor
    topic: tracker-corroboration
    missingEvidence: >-
      Accessible third-party tracker exports from Compworth and TexAu or equivalent alternatives with transparent
      methodology.
    whyItMatters: >-
      Tracker inconsistency already weakens confidence in public revenue and headcount triangulation, and blocked pages
      reduce comparison depth further.
    diligencePath: >-
      Obtain exported tracker snapshots directly or replace them with accessible analyst databases that show methodology
      and revision history.
    relatedQuestionRefs:
      - QI012
      - QI013
      - QI027
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: Manufacturing yield, cartridge cost, and line throughput remain undisclosed
    missingEvidence: >-
      Public sources describe fully automated manufacturing and future cost reduction, but they do not disclose scrap
      rates, yields, capacity per line, or unit economics by SKU.
    whyItMatters: >-
      For a disposable molecular-diagnostics company, cost-down curve and manufacturing throughput are central to gross
      margin durability and ability to support lower-price channels.
    diligencePath: >-
      Request line-capacity, yield, scrap, throughput, and COGS trend data by product generation plus contingency plans
      for demand spikes.
    relatedQuestionRefs:
      - QE010
      - QE018
      - QE022
  - type: private-evidence-only
    severity: material
    topic: Detailed cloud-security and privacy architecture is not publicly inspectable
    missingEvidence: >-
      The public record supports secure access, confidential results, and Google Cloud infrastructure, but it does not
      expose HIPAA architecture, audit posture, encryption design, or incident-response commitments.
    whyItMatters: >-
      The app is part of the regulated care workflow for OTC products, so security and privacy failures could damage
      brand trust and attract regulatory scrutiny.
    diligencePath: >-
      Request HIPAA program details, vendor list, audit reports, data-retention policy, and security architecture for
      app, result storage, and telehealth handoff.
    relatedQuestionRefs:
      - QE017
      - QE021
      - QE025
  - type: private-evidence-only
    severity: material
    topic: Supplier redundancy for disposable PCR components and power accessories is not public
    missingEvidence: >-
      The public materials do not identify critical microfluidic, reagent, plastics, electronics, or adapter suppliers
      or whether qualified second sources exist.
    whyItMatters: >-
      Single-source inputs could create stockout risk precisely when Visby is trying to scale both seasonal respiratory
      demand and consumer OTC adoption.
    diligencePath: Request supplier concentration map, dual-source status, safety-stock policy, and component lead-time assumptions.
    relatedQuestionRefs:
      - QE010
      - QE016
  - type: missing-source
    severity: minor
    topic: Public sell-through and activation metrics for the OTC channel remain sparse
    missingEvidence: >-
      Public sources show the app, channel partners, and product launches, but not unit sales, app activations,
      completion rates, or telehealth conversion by channel.
    whyItMatters: >-
      Without adoption telemetry it is difficult to determine whether category-first regulatory wins are translating
      into efficient, repeatable consumer demand.
    diligencePath: >-
      Request sell-through, app-activation, completion, positivity, and telehealth-conversion data by DTC, partner, and
      clinical channel.
    relatedQuestionRefs:
      - QE013
      - QE020
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete list of active OTC distribution partners, active clinical accounts carried through the transition, and
      any large retail or pharmacy shelf placements.
    whyItMatters: >-
      Public proof is currently a partial roster of named partners and two clinical testimonials, which is enough to
      verify channel activation but not enough to map full customer breadth.
    diligencePath: >-
      Request an internal partner roster by channel, launch date, and status; ask for the active clinical account list
      at the time of the 2025 pivot.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-count
    missingEvidence: Total customers, total tests sold, and any disclosed household or platform-specific volume metrics.
    whyItMatters: Without a denominator, channel breadth cannot be converted into adoption scale or customer acquisition efficiency.
    diligencePath: Request monthly OTC order volume, shipped tests, and active households by channel since launch.
    relatedQuestionRefs:
      - QU022
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
