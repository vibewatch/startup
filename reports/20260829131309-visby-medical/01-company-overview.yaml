- id: capital-scale-and-channel-footprint
  title: Capital, Scale, and Channel Footprint
  body: |-
    Visby has required venture-scale capital to build and clear its disposable-PCR platform. Public market-data sources trace financing from a $16M Series B in 2015 through a $9.52M extension, a $101M Series C in 2019, a $70M Series D in 2020, and a $100M Series E plus $35M extension in 2022, supplemented by BARDA and NIH grant funding. The June 2025 Series F then added $55M, expandable to $65M, at a reported $1B valuation and brought Catalio into the lead position. Taken together, the public record supports the view of Visby as a heavily capitalized diagnostics company rather than a lightly funded kit brand.

    Scale visibility is much weaker than financing visibility. Third-party profiles estimate roughly 200 employees and about $35M of current revenue, but those numbers are not company-confirmed. What is more visible is channel breadth. Optum Now, Everlywell, and Fisher Scientific pages show external distribution surfaces, while company materials name additional channels including Quest Diagnostics, LabCorp, Wisp, DoorDash, GoPuff, and RAINN. That combination suggests real go-to-market reach, but not yet the level of audited commercial disclosure that would remove diligence risk.
