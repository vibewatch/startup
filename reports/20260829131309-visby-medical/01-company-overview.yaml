company:
  name: Visby Medical
chapter:
  number: 1
  title: Company Overview
  summary: Visby Medical is a San Jose molecular-diagnostics company founded in December 2012 as Click Diagnostics by Adam de la Zerda and rebranded in March 2020. Its defining asset is an instrument-free, palm-sized disposable PCR device that integrates sample preparation, amplification, and detection into a single-use unit that can deliver results in under 30 minutes for women's sexual-health and respiratory testing. By June 2025 the company had raised roughly $487M including grants, added Catalio-backed capital at a reported $1B valuation, and then pivoted its commercial emphasis toward OTC and at-home PCR distribution while keeping a path back to point-of-care sales. The main public diligence gaps are exact current revenue, exact current headcount, and the detailed post-Series F governance and economic terms.
