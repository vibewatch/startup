- id: product-architecture-and-regulatory-moat
  title: Product Architecture and Regulatory Moat
  body: |-
    Visby's product architecture is the core reason the company stands out in molecular diagnostics. Instead of pairing cartridges with a benchtop analyzer, the company packages PCR chemistry and workflow into a single-use disposable, reducing instrument deployment friction in clinics and making a consumer workflow plausible. The women's sexual-health portfolio now spans both clinical and OTC use, while the respiratory portfolio remains clinically important and has expanded into an at-home flu/COVID-19 product. Public materials consistently emphasize the same three product attributes: laboratory-grade PCR, no separate analyzer, and results in under 30 minutes.

    The regulatory path is equally important. The company's sequence of milestones runs from a September 2020 COVID EUA to 2021 and 2023 women's-test clearances, a December 2022 respiratory EUA, a February 2025 respiratory 510(k) and CLIA waiver, a March 2025 De Novo for the OTC women's test, and a July 2026 clearance for an at-home multi-viral PCR. That pattern creates a real moat: Visby is not simply claiming future OTC molecular testing leadership; it already has the FDA milestones that make the category credible.
