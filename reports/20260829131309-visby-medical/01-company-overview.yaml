sections:
- id: identity-founding-and-operating-profile
  title: Identity, Founding, and Operating Profile
  body: |-
    Visby Medical is best understood as a molecular-diagnostics platform company whose commercial story now bridges both clinical point-of-care and direct-to-consumer testing. The company was incorporated in December 2012 as Click Diagnostics by Adam de la Zerda, kept San Jose, California as its operating center, and later rebranded to Visby Medical in March 2020. The historical continuity matters because it links the pre-COVID technical platform to the later COVID and sexual-health commercialization arc rather than treating the current company as a fresh launch.

    The mission statement is unusually specific: management says it wants to revolutionize infectious-disease diagnosis by empowering physicians and patients to test anywhere and anytime with laboratory accuracy. That mission maps directly onto the product format. Visby's hallmark device is a palm-sized disposable PCR system that integrates sample preparation, amplification, and detection without a separate analyzer and returns results in under 30 minutes. The company also maintains dual digital surfaces — a clinical point-of-care site and a consumer commerce workflow — which reinforces the view that the business is not abandoning provider channels altogether even as OTC demand now sets the pace.
