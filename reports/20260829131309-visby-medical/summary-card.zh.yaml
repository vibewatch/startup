  headline: Visby Medical 正在定义分子诊断新品类，在 OTC PCR 检测上握有真实的 FDA 先发监管优势；但以约 $35M 估计收入支撑 $1B 估值，必须先拿出强有力的消费者采用证据，才值得高确信度承销。
