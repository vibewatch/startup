  topStrengths:
    - 首个且唯一获 FDA 授权的 OTC STI PCR 检测（2025 年 3 月 De Novo），也是首个 OTC 居家多病毒 PCR 检测（FDA 2026 年 7 月）；监管位置定义品类。
    - 无仪器、一次性耗材形态是真技术护城河，背后有 12+ 年和 $487M 研发投入撑着。
    - 分销网络已经铺开（DoorDash、Everlywell、Quest、LabCorp、Wisp、RAINN），Google Cloud 基础设施也已就位，可承接消费者规模化。
  topRisks:
    - 缺少审计财务、确认收入和消费者采用指标；按估计 $35M 收入算约 28x 收入倍数，对医疗器械公司来说很高。
    - San Jose 单一制造基地带来集中度风险；每次检测 $149.99 的价格点下，OTC 消费者市场还没有跑出规模化证明。
    - 暂停临床 POC 销售会拉出收入空档；Visby 转型期间，更大的在位者（Abbott、Roche、Cepheid）可能趁机加固位置。
  unresolvedGaps:
    - 经审计财务中的确认收入、毛利率和盈利路径。
    - 消费者采用指标：销量、复购率、获客成本，以及来自合作平台的转化。
    - 男性 STI 检测和呼吸道 OTC 管线：FDA 批准时间表与商业发布计划。
    - OTC 分子检测的保险报销策略和 CPT 代码覆盖进展。
