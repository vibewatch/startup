  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: A complete list of active OTC distribution partners, active clinical accounts carried through the transition, and any large retail or pharmacy shelf placements.
    whyItMatters: Public proof is currently a partial roster of named partners and two clinical testimonials, which is enough to verify channel activation but not enough to map full customer breadth.
    diligencePath: Request an internal partner roster by channel, launch date, and status; ask for the active clinical account list at the time of the 2025 pivot.
    relatedQuestionRefs:
    - QU003
    - QU004
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: customer-count
