- id: adoption-trajectory-and-traction-evidence
  title: Adoption trajectory and traction evidence
  body: 'Visby has disclosed far more evidence of channel activation than of customer volume. The clearest traction milestone is the national July 2025 launch of the women''s at-home STI test through direct-to-consumer and partner channels. Public sources then show a steady broadening of access: Everlywell listing the product on its diagnostics marketplace, Optum Now merchandising it with no-insurance-needed language and online-care integration, DoorDash and DashMart offering fast local delivery, Gopuff powering direct delivery from Visby.com, Quest adding the test to questhealth.com in November 2025, and Labcorp OnDemand joining in early 2026. Delivery evidence is unusually concrete for a medtech product: official launch materials described initial same-day service in ten major metros, while 360Dx reported 500 zip codes through DashMart. What is missing is the denominator. Visby has not published total customers, total tests sold, repeat-purchase rate, telehealth conversion rate, or any
    platform-by-platform sell-through, so the public record supports breadth of availability rather than scale of adoption.'
