- id: retention-repeat-usage-and-durability
  title: Retention, repeat usage, and durability
  body: 'Durability is the weakest part of Visby''s public customer evidence. No reviewed source disclosed net revenue retention, gross revenue retention, reorder frequency, renewal rates, subscriber counts, or repeat usage by channel. That matters because STI testing is often episodic rather than naturally subscription-like: one consumer may urgently need the product once, while another may repeat because of follow-up screening, new partners, or recurring concern. The company clearly tries to improve completion and satisfaction by combining private app-based results, telehealth, and fast delivery, and official product reviews emphasize discretion and ease of use. An independent review from EasySTD also praised speed and privacy, but flagged limited infection scope, women-only design, and relatively high self-pay cost. Those caveats make it hard to infer repeat behavior from product excitement alone. For now, the public record supports a plausible customer experience advantage, but not proof
    that first purchases convert into durable cohorts or low churn relationships.'
