- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk type
  - Description
  - Severity
  - Mitigation
  rows:
  - - Platform concentration
    - Near-term OTC reach depends on a relatively small set of intermediaries including Optum Now, Everlywell, Quest, Labcorp, DoorDash, and GoPuff.
    - High
    - Broaden into additional retailers, pharmacy shelves, and advocacy channels while disclosing partner mix more transparently
  - - Metric opacity
    - No public customer count, reorder rate, or partner revenue mix makes it impossible to quantify concentration or lifetime value.
    - High
    - Provide cohort, channel-mix, and repeat-purchase disclosure in future updates or financing materials
  - - Clinical channel contraction
    - Pausing new clinical point-of-care sales narrows near-term customer diversity even though the product had validated use cases in urgent care and women's health clinics.
    - High
    - Re-enter professional POC after OTC scale-up or preserve reseller relationships for restart
  - - Channel price variance
    - Observed pricing ranges from Visby's $149.99 list to a $250 GoPuff listing, which could affect conversion and brand trust.
    - Medium
    - Tighten MAP, promotions, and merchandising consistency across partners
  - - Portfolio concentration
    - Current commercial momentum rests on one flagship women's OTC STI test.
    - Medium
    - Use the respiratory launch and men's sexual health pipeline to deepen partner wallet share and reduce single-SKU dependence
  - - Diversification offset
    - Multiple partner types—telehealth, diagnostics marketplaces, delivery apps, advocacy organizations, and legacy clinical distributors—reduce dependence on one account.
    - Medium positive
    - Continue widening partner roster while measuring true CAC and margin by channel
  - - Digital affiliate acquisition
    - Visby actively recruits affiliates to promote the OTC test on websites, social channels, and digital platforms for commission.
    - Medium positive
    - Could diversify acquisition beyond marketplaces if affiliate CAC is controlled and disclosures remain compliant
  notes: Severity is a judgment about commercial exposure, not a legal or safety rating. The table mixes downside concentration risks with the main mitigation vectors visible in public sources.
