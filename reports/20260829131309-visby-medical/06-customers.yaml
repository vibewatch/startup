- id: named-customer-and-partnership-proof
  title: Named customers and partnership proof
  body: 'Named proof exists in two different forms. On the partner side, Visby now has direct evidence of third-party merchandising through Everlywell, Optum Now, DoorDash, Gopuff, Quest, Labcorp, and Fisher Scientific, with additional official references to Wisp, RAINN, and Ovia Health. These names matter because they move Visby beyond a single-company webstore and indicate real willingness by established healthcare or commerce intermediaries to carry the product. On the legacy clinical side, the best public named-customer proof remains testimonial rather than volume-based. Dr. Denise Sweeney of Associates in Women''s Healthcare described the test as a game changer because patients can self-collect and get answers in the same visit, while Lamont Tyler of CareNow Urgent Care said rapid and accurate results usually keep door-to-discharge time under one hour. A Johns Hopkins emergency department study adds outcome-oriented credibility by showing materially faster results and better antibiotic
    stewardship versus standard send-out testing. Together these sources validate product usefulness, but they still do not disclose how many paying sites or recurring consumer households Visby has actually converted. Visby''s Safe Access Program adds especially concrete non-commercial partner proof: the company says RAINN phase-one distribution already covered 1,000 kits across 20 partner programs in 17 states. That does not resolve revenue questions, but it does show the platform can be adapted to access-focused channels as well as commercial ones.'
