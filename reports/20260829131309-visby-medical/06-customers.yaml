company:
  name: Visby Medical
chapter:
  number: 6
  title: Customers
  summary: 'Visby''s customer story is now primarily a consumer OTC diagnostics story wrapped in a B2B2C distribution mesh, not a scaled clinical diagnostics franchise. Public proof is strongest at the channel level—live listings and partner announcements across Everlywell, Optum Now, Quest, Labcorp, DoorDash, and Gopuff—plus legacy clinical testimonials from women''s health and urgent care practices. The main gap is durability: Visby has not publicly disclosed customer counts, repeat purchase, cohort retention, or partner concentration, so investors can verify reach but not yet customer lifetime value.'
sections:
- id: customer-segments-and-buyer-profiles
  title: Customer segments and buyer profiles
  body: 'Visby''s current customer base is best segmented into three layers. First is the direct consumer: women using the company''s at-home sexual health PCR test, which is sold as a self-pay, privacy-oriented diagnostic with app-based results and same-day telehealth follow-up if positive. The strongest public evidence points to younger adults and reproductive-age women as the most relevant demand pool because the test is sold to users 14 and older, many infections are asymptomatic, and CDC-linked epidemiology cited by Visby shows a large burden among younger age cohorts. Second is the B2B2C distribution layer: telehealth, digital diagnostics, and instant-commerce partners such as Everlywell, Optum Now, Quest, Labcorp, DoorDash, and Gopuff that lower friction between suspicion, purchase, result, and treatment. Third is the legacy clinical layer of urgent care centers, women''s health practices, physician offices, and other CLIA-waived settings that historically valued the same-visit workflow
    of the point-of-care test, but that has become strategically secondary after the OTC pivot.'
