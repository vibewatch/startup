- id: customer-acquisition-strategy-and-concentration-risk
  title: Customer acquisition strategy and concentration risk
  body: 'Visby''s acquisition strategy appears to treat diagnosis, distribution, and treatment coordination as one integrated consumer workflow. The company markets privacy, speed, and same-day action rather than a commodity lab test, then uses partners to remove operational friction: instant-commerce for delivery, telehealth for post-result care, and digital marketplaces for discovery. That design likely improves conversion for symptomatic or anxious users who value urgency, but it also shifts customer concentration risk away from a single large clinical account and toward a relatively small set of platforms and intermediaries. The positive side is diversification across multiple partners rather than dependence on one storefront. The negative side is that Visby has not disclosed revenue mix by partner, so investors cannot tell whether one or two channels dominate economics. The July 2025 pause of clinical point-of-care sales compounds that uncertainty by reducing near-term channel diversity
    even though legacy clinical testimonials were strong. Expansion into respiratory testing and a men''s sexual health product may eventually deepen wallet share with current partners, but today the customer model remains concentrated around one flagship OTC SKU. Visby is also experimenting with lower-cost digital acquisition: its affiliate-signup page explicitly recruits websites, social channels, and digital platforms to promote the product for commission, while its FAQ and app pages are built to reduce onboarding friction for users who may be anxious, exposed, or asymptomatic.'
