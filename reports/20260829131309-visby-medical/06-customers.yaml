    - Digital diagnostics platform
    - Consumer storefront and telehealth-connected sales channel
    - Live product listing plus Julia Cheek quote that Everlywell is breaking down stigma, access, and time barriers by launching Visby on Everlywell.com
    - Demonstrates third-party confidence and broad consumer discovery reach
  - - Optum Now
    - Telehealth / commerce platform
    - Partner storefront with online care positioning
    - Optum Now page lists the product at $149.99, says online care visit is included with positive test, and states no insurance is needed
    - Shows care coordination is part of the purchase experience, not a separate referral
  - - Quest Diagnostics / QuestHealth
    - Consumer-initiated diagnostics platform
    - Executed contract and live consumer listing
    - 360Dx reported an executed contract; Visby later said QuestHealth added the test in November 2025
    - Adds national healthcare-brand distribution and consumer trust
  - - Labcorp OnDemand / Ovia Health
    - Consumer diagnostics and employer-health distribution
    - Live listing plus planned extension through women's health app and employer/plan channels
    - Visby said the test is available via Labcorp OnDemand and that Ovia Health would also offer it to employer and health plan partners
    - Suggests distribution can extend beyond pure e-commerce into sponsored health populations
  - - DoorDash / DashMart
    - Instant-commerce platform
    - Same-day local delivery channel
    - Visby launch materials cited ten major metros; 360Dx said DashMart offered the product in 500 zip codes
    - Supports impulse and urgency-driven purchase behavior
  - - GoPuff
    - Instant-commerce platform
    - Delivery partner and direct-fulfillment engine for Visby.com orders
    - Official launch materials said GoPuff powers deliveries from Visby.com; product listing advertises delivery as fast as 15 minutes in covered areas
    - Improves convenience and could reduce abandonment for urgent buyers
  - - RAINN Safe Access Program
    - Advocacy and survivor-support channel
    - Partner distribution through RAINN service-provider network
    - Visby says phase one distributed 1,000 kits across 20 partner programs in 17 states
    - Shows mission-driven distribution beyond standard retail and telehealth channels
  - - Associates in Women's Healthcare
    - Clinical women's health practice
    - Named point-of-care user
    - 'Dr. Denise Sweeney: “The Visby Sexual Health Test has been a game changer for us.”'
    - Confirms workflow fit and patient-experience value in women's health settings
