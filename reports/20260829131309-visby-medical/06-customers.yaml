    - Urgent care network
    - Named point-of-care user
    - Lamont Tyler said rapid and accurate results usually kept door-to-discharge time under one hour
    - Validates speed-sensitive urgent-care use case even though sales were later paused
  notes: Named proof is strongest for distribution partners and qualitative clinical testimonials. Public sources still do not disclose the full clinical account list, transaction counts, or renewal behavior by partner.
