- calloutType: risk
  title: Clinical pause raises near-term concentration risk
  body: Legacy clinical testimonials show real workflow value in urgent care and women's health settings, yet Visby temporarily paused new clinical point-of-care sales to focus on OTC. That decision may be strategically rational, but it narrows near-term customer diversity around one flagship consumer SKU and a handful of intermediaries.
