      - number: '3.2'
        title: Direct competitors and closest alternatives
        blocks:
          - type: paragraph
            body: >-
              The closest direct comparison depends on the buyer and care setting. For clinic-based sexual-health
              testing, Roche is the sharpest overlap because its January 2025 STI clearances brought chlamydia,
              gonorrhea, and mycoplasma genitalium onto a fast, CLIA-waived point-of-care PCR platform. Cepheid remains
              an important benchmark because Xpert CT/NG addresses the same pathogens and supports same-visit clinical
              action, but it still relies on a GeneXpert instrument and a longer time to result. Abbott ID NOW is faster
              on respiratory assays and has deep point-of-care placement, yet the reviewed menu centers on flu,
              COVID-19, RSV, and strep rather than STI testing. On the home-molecular side, Aptitude is the most
              credible consumer-side adjacency because it already has authorized home and point-of-care molecular
              respiratory testing, while Scout and Detect show how smaller developers are trying to remove the same
              speed-versus-accuracy tradeoff with portable molecular workflows. OraSure is best understood as a
              sexual-health adjacency with OTC and CLIA-waived infectious-disease distribution muscle, not as a direct
              PCR peer today.
