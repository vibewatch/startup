        title: Unit economics and cost structure
        blocks:
          - type: paragraph
            body: >-
              Public evidence on Visby's unit economics is directional, not complete. The company and its backers
              repeatedly signal that manufacturability and automation are central to the business model: the 2023
              second-generation point-of-care product was described as improving manufacturability and reliability, Mark
              Medlen said the company could move to fully automated lines, and Chuck Alpuche said Visby must streamline
              manufacturing and drive down unit costs. Those are encouraging indicators because a single-use PCR device
              has to absorb assay chemistry, plastics, packaging, quality control, and distribution inside each unit
              sold. Yet the same evidence also shows the problem has not already been solved. Independent commentary
              still frames gross margins as under pressure until COGS come down, and no public source reviewed here
              disclosed a current gross-margin figure, channel mix, or contribution margin. The best public traction
              proxies are therefore blunt ones: Growjo's ~$35M revenue estimate, employee counts around 180-194, and the
              implied revenue-per-employee range of roughly $180k-$194k. Those numbers suggest commercialization is
              real, but still far from the asset-light economics that would justify ignoring manufacturing execution
              risk.
