      - number: '2.5'
        title: Constraints and adoption barriers
        blocks:
          - type: paragraph
            body: >-
              The same evidence also shows why Visby's opportunity should not be treated as frictionless. The clearest
              barrier is price. At US$149.99, the flagship women's OTC test is a premium self-pay product, so adoption
              requires buyers to place a high value on privacy, speed, and PCR-grade confidence. Reimbursement is still
              immature in the public record; the company emphasizes FSA and HSA eligibility rather than routine payer
              coverage, which suggests mass-market expansion may lag clinical validity. A second barrier is market
              novelty. De Novo and first-of-category wins help category creation, but they also mean payer pathways,
              pharmacist education, and normalized consumer purchasing behavior are still forming. Third, the company's
              own commercial pivot is a caution signal: 360Dx reported that Visby paused some clinical point-of-care
              sales efforts to focus on OTC, implying limited organizational bandwidth and the need to choose between
              channels. Finally, public data is not yet rich enough to size Visby's true near-term obtainable market
              because unit sell-through, reorder behavior, and government or retail channel productivity are
              undisclosed.
            claimRefs:
              - CM018
