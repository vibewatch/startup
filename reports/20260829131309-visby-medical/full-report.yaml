companyProfile:
  summary: >-
    Visby Medical (originally Click Diagnostics) is a San Jose, California-based molecular diagnostics company founded
    in December 2012 by Adam de la Zerda, PhD. The company invented the world's first instrument-free, single-use PCR
    platform that delivers lab-quality results in under 30 minutes from the palm of a user's hand. After more than a
    decade developing and validating its disposable PCR chip technology, Visby achieved a landmark March 2025 FDA De
    Novo authorization for the first-ever OTC at-home PCR test for sexually transmitted infections, followed by FDA
    clearance for an at-home Flu/COVID-19 PCR test in July 2026. The company raised a $55M Series F in June 2025 at a $1
    billion valuation and has pivoted its commercial focus entirely to the consumer OTC diagnostics market, distributing
    through partners including DoorDash, Everlywell, Quest Diagnostics, LabCorp, Wisp, and RAINN with telehealth
    integration via Google Cloud and Optum Now.
  foundedDate: '2012-12-01'
  founders:
    - name: Adam de la Zerda, PhD
      role: Founder & CEO
      background: >-
        Israeli-born associate professor at Stanford School of Medicine; conceived the instrument-free PCR concept at
        Artiman Ventures ~2010; has led the company since founding; key-person dependency.
      claimRefs:
        - CO010
        - CO011
    - name: Greg Loney
