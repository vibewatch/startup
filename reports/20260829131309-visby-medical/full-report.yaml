      - number: '4.2'
        title: Pricing and reimbursement dynamics
        blocks:
          - type: paragraph
            body: >-
              The company's public pricing posture is unusually clear on list price and unusually opaque on realized
              price. Visby and reseller pages show the women's OTC test at $149.99, with HSA/FSA eligibility and
              same-day telehealth for positive results, but they do not disclose reseller take rates, couponing,
              refunds, or the percentage of customers who actually monetize through each channel. Management's framing
              to 360Dx is that roughly $150 is a discount versus urgent-care or emergency-department pathways once
              copays, transportation, collection, and lab handling are considered, and it is also roughly comparable to
              lab fee schedules. That positioning helps explain why the company can attempt a premium self-pay strategy
              despite entering a stigmatized category. The harder question is reimbursement. Across the reviewed
              sources, Visby emphasizes self-pay convenience, telehealth, and tax-advantaged HSA/FSA usage rather than
              routine insurer reimbursement for the OTC product. That leaves price elasticity, payer acceptance, and
              realized net revenue per box as key diligence areas instead of solved economics.
