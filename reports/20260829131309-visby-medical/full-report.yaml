    title: Growth drivers and constraints table
    columns:
      - Factor
      - Type
      - Mechanism
      - Severity
      - Implication
    rows:
      - - High STI burden
        - Driver
        - Millions of annual cases and a young-skewing burden sustain baseline screening demand.
        - High
        - Keeps category need structurally present
      - - Privacy and stigma
        - Driver
        - At-home testing reduces embarrassment clinic friction and delay for asymptomatic users.
        - High
        - Favors discreet OTC workflows over status quo
      - - Post-pandemic home-testing acceptance
        - Driver
        - Consumers are more willing to trust app-guided diagnostics and telehealth follow-up than before COVID-19.
        - Medium-High
        - Improves adoption for home PCR
      - - FDA category creation
        - Driver
        - De Novo and follow-on clearances reduce regulatory novelty for future OTC molecular products.
        - Medium-High
        - Supports portfolio expansion and investor confidence
      - - Antimicrobial resistance
        - Driver
        - Greater need for accurate early diagnosis increases the value of molecular sensitivity.
        - Medium
        - Supports premium positioning for PCR
      - - US$149.99 self-pay price
        - Constraint
        - Out-of-pocket pricing narrows the reachable audience to users willing to pay for speed and privacy.
        - High
        - May slow mainstream penetration
      - - Reimbursement uncertainty
        - Constraint
        - Lack of routine payer coverage reduces affordability and channel willingness.
        - High
        - Limits broad-based adoption and payer-led growth
      - - Channel focus trade-off
        - Constraint
        - Company resources appear concentrated on OTC rather than simultaneous scaling of all point-of-care lanes.
        - Medium-High
        - May defer value realization in clinical POC
      - - Sparse public sell-through data
        - Constraint
        - Limited disclosure on reorder and conversion makes SOM harder to underwrite.
        - Medium
        - Raises diligence burden on commercial traction
    notes: Severity rates near-term effect on adoption speed and valuation rather than long-run scientific importance.
