  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Visby combines awareness, fast fulfillment, app-based result reading, and same-day treatment routing into one
      consumer workflow.
    data:
      nodes:
        - id: trigger
          label: Trigger
          detail: Symptoms, exposure anxiety, or routine concern prompt a user to seek a fast and private answer.
        - id: channel
          label: Discovery channel
          detail: User encounters the test through Visby.com, Everlywell, Optum Now, Quest, DoorDash, or GoPuff.
        - id: purchase
          label: Purchase and delivery
          detail: Self-pay purchase at roughly $149.99 list price, with same-day or rapid delivery in covered markets.
        - id: sample
          label: Self-collection
          detail: User collects a vaginal swab and runs the single-use PCR device at home.
        - id: result
          label: Private digital result
          detail: Visby app reads and displays the result securely in about 30 minutes.
        - id: care
          label: Same-day care
          detail: >-
            Positive users can connect to telehealth and obtain next-step treatment guidance or a prescription when
            appropriate.
        - id: followup
          label: Follow-up / repeat / referral
          detail: >-
            Potential outcomes include treatment completion, future rescreening, household word-of-mouth, or partner
            re-engagement through the same channels.
