      - number: '1.2'
        title: Founders, Executives, and Governance
        blocks:
          - type: paragraph
            body: >-
              Founder centrality is a defining governance feature. Adam de la Zerda remains founder and CEO, and his
              Stanford affiliation gives the company a scientifically credible public face. Greg Loney anchors the
              technical side as co-founder and CTO, while Gary Schoolnik brings infectious-disease authority as chief
              medical officer. That trio ties Visby's scientific premise, engineering execution, and clinical
              credibility closely to a small founding-era bench, which creates both focus and key-person concentration.


              The broader operating team is visible but not fully transparent. Public sources confirm Mark Medlen in
              operations, Elizabeth Lingenfelter across quality, regulatory, and clinical affairs, Chris Weaver in
              commercial operations, William Meyer in finance, and Joseph Patterson in manufacturing. Governance also
              widened in June 2025 when Catalio's Isaac Ro joined as board observer and Chuck Alpuche joined as an
              independent director. Those additions suggest a maturing board around the same time as the Series F, but
              public disclosures still do not show the complete org chart or board-control mechanics, so later diligence
              should treat the visible roster as confirmed but incomplete.
