      - number: '2.3'
        title: Buyer segments and purchasing dynamics
        blocks:
          - type: paragraph
            body: >-
              Visby's most immediate buyer is the privacy-seeking female consumer who either has symptoms or wants a
              rapid answer without scheduling a clinic visit. In that workflow, the buyer, user, and payer are
              effectively the same person, and the value proposition is speed, discretion, and the ability to move from
              result to treatment from home. Telehealth platforms and ecommerce partners are therefore not side
              channels; they are part of the productized buying journey because they reduce friction between symptom
              recognition, test purchase, result interpretation, and prescription access. Clinical point-of-care buyers
              are different. Hospitals, urgent care centers, and physician offices care more about workflow fit,
              reimbursement, and staff simplicity than about consumer branding. That divergence helps explain why Visby
              has leaned harder into OTC despite still possessing point-of-care assets. Public health departments and
              pharmacy-led distribution remain plausible scaling channels, but the current public record is stronger on
              consumer and telehealth distribution than on named government procurement or broad retail shelf velocity.
