      - number: '8.5'
        title: Thesis-break conditions and monitoring
        blocks:
          - type: paragraph
            body: >-
              The most important discipline for a prospective investor is to turn the Visby story into measurable gates.
              Positive signals would include public proof of steady OTC sell-through, evidence that reorder or
              partner-attach behavior is improving, additional clearances that widen the menu, and credible signs that
              unit economics are moving in the right direction. Negative signals are equally clear: a need to raise
              capital again before consumer demand is established, a stalled reimbursement pathway, a visible decline in
              channel support, or any quality event that undermines the promise of lab-grade results at home. Cap-table
              opacity also matters more here than at many software companies because a flat $1 billion mark after years
              of capital raises can hide meaningful liquidation preference overhang. The chapter's final stance is
              therefore not anti-Visby; it is anti-false-precision. The company may yet earn a premium multiple, but the
              public record still lacks the revenue quality, gross-margin visibility, and adoption metrics that would
              justify taking the current valuation at face value. Deep-dive work should focus on economics and
              conversion, not on technology storytelling.
