      - number: '8.3'
        title: Comparable framework and market upside
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis is useful for Visby only if treated as a range-setting exercise rather than a precise
              mark-to-market method. The most relevant public and transaction references split into two groups. The
              first group contains molecular-diagnostics transactions such as Cepheid, BioFire, and Mesa Biotech. Those
              deals show that strategic buyers have historically paid mid-single-digit revenue multiples for scaled
              molecular assets, with Mesa reaching a double-digit multiple during the COVID-era demand spike. The second
              group contains consumer-diagnostics and health-platform references such as Everlywell and Lucira. Those
              cases show that consumer access, channel breadth, and reimbursement friction can drive valuations sharply
              in both directions. Lucira is especially important because it demonstrates that FDA-cleared OTC PCR is not
              by itself enough to produce durable value creation. Against that backdrop, Visby's upside argument rests
              on market expansion more than on near-term comparable support. Published market work points to an at-home
              STI category of roughly $3.0 billion in 2025 growing toward $5.9 billion by 2033, while point-of-care
              molecular diagnostics is projected to grow from about $4.3 billion in 2025 to $7.09 billion by 2030. That
              is plenty of demand surface, but Visby still has to prove it can capture it profitably.
            claimRefs:
