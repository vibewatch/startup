      - number: '2.2'
        title: Market size and growth projections
        blocks:
          - type: paragraph
            body: >-
              On the most defensible top-down lens, MarketsandMarkets places global point-of-care molecular diagnostics
              at US$4.30 billion in 2025 and US$7.09 billion by 2030, while Future Market Insights gives a somewhat
              larger long-dated frame of US$5.3 billion in 2025, US$5.8 billion in 2026, and US$15.1 billion by 2036.
              Those two sources differ in vintage and horizon, but both support a durable 10% growth profile for rapid
              molecular testing. Grand View Research provides the narrower consumer lens, estimating at-home STI testing
              at roughly US$1.2-1.42 billion in 2024, around US$3.0 billion in 2025, and about US$5.9 billion by 2033,
              though that methodology could not be reviewed directly during this run because the page returned a 403 bot
              challenge. North America appears to represent roughly 40-45% of the key markets Visby cares about, which
              makes the U.S. the natural launch geography. Respiratory testing adds a second home-use lane, but the
              evidence suggests it should be viewed as adjacency and option value rather than cleanly additive near-term
              TAM.
