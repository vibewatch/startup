              send-out testing. Together these sources validate product usefulness, but they still do not disclose how
              many paying sites or recurring consumer households Visby has actually converted. Visby's Safe Access
              Program adds especially concrete non-commercial partner proof: the company says RAINN phase-one
              distribution already covered 1,000 kits across 20 partner programs in 17 states. That does not resolve
