      - number: '2.4'
        title: Growth drivers and secular tailwinds
        blocks:
          - type: paragraph
            body: >-
              Several secular drivers support Visby's market thesis. The first is disease burden: U.S. reported STI
              counts still run in the low millions annually, trichomoniasis remains highly prevalent, and WHO continues
              to describe more than one million curable STIs being acquired every day globally. The second is the
              mismatch between traditional care pathways and user preference. Many infections are asymptomatic, stigma
              remains meaningful, and consumers increasingly want private, self-directed testing that does not require a
              lab trip or a delayed mail-in result. Third, the pandemic normalized home diagnostics and made consumers
              far more willing to trust app-guided testing and follow-up telehealth. Fourth, FDA action matters. Visby's
              2025 De Novo for home sexual-health PCR and its 2026 respiratory home-PCR clearance demonstrate that
              regulators are now willing to define and expand an OTC molecular category. Finally, antimicrobial
              resistance and the clinical value of early treatment reinforce the argument that higher-sensitivity
              testing can justify a premium over less accurate alternatives when speed affects outcomes.
