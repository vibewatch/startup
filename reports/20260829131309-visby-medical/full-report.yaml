  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization strategy
        blocks:
          - type: paragraph
            body: >-
              Visby Medical's financial story is no longer centered on a classic clinician-sold diagnostics cartridge.
              The company has moved its commercial center of gravity toward direct-to-consumer and partner-mediated
              sales of the Women's Sexual Health Test, while leaving open the option to reintroduce a professional
              point-of-care lane after OTC scale is established. The strongest public evidence for current monetization
              is the live $149.99 product page on visby.com, corroborated by marketplace listings and company statements
              that the test launched through major consumer channels beginning in mid-2025. Revenue therefore appears to
              start with a one-time self-pay test purchase, while telehealth and prescription routing function as
              conversion support rather than as separately disclosed recurring revenue lines. That matters because it
              makes Visby financially closer to a consumer medtech test-and-care workflow than to a pure software
              subscription business. At the same time, the clinical product base has not disappeared entirely: Fisher
              still lists the professional sexual-health SKU, and management told 360Dx that clinical sales were paused
              rather than permanently shut down.
