  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: >-
      Visby scores well on category creation and product proof, but much worse on evidence quality and entry discipline
      at the current mark.
    data:
      items:
        - label: Market opportunity
          value: 8 / 10
          detail: Large STI and point-of-care molecular markets support a real upside envelope.
        - label: Regulatory / product proof
          value: 8 / 10
          detail: Multiple FDA clearances and De Novo leadership reduce pure science risk.
        - label: Distribution / workflow
          value: 7 / 10
          detail: Google Cloud, Optum, Everlywell, Quest, and Labcorp broaden access.
        - label: Economics visibility
          value: 4 / 10
          detail: Revenue quality, gross margin, and reimbursement proof remain sparse.
        - label: Competitive moat
          value: 6 / 10
          detail: First-mover status and know-how help, but large incumbents can still respond.
        - label: Financing asymmetry
          value: 4 / 10
          detail: Flat valuation since 2022 and opaque preferences reduce comfort.
        - label: Valuation discipline
          value: 4 / 10
          detail: Current price requires more proof than public evidence currently provides.
    approximationNotes: Scores are chapter-level judgment calls anchored to cited evidence and intended for investment-committee triage.
