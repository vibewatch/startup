      - number: '7.3'
        title: Partner, dependency, and financial risk
        blocks:
          - type: paragraph
            body: >-
              Visby's at-home workflow is not a pure product sale. Google Cloud sits underneath result delivery, Optum
              Now anchors care routing, and outside commerce or distribution surfaces such as Everlywell and Fisher
              Scientific expand reach. Those partnerships are strengths, but they also mean outages, deprioritization,
              changed economics, or termination by third parties can degrade the customer experience without any assay
              failure. Respiratory expansion carries its own dependency because public releases tie development support
              to BARDA-backed funding. Financially, the asymmetry between capital consumed and revenue disclosed is
              stark. Public sources support roughly $487 million of capital raised and a June 2025 valuation marker near
              $1 billion, while current revenue remains an unaudited third-party estimate around the mid tens of
              millions of dollars. That mismatch matters because it compresses tolerance for a slow OTC ramp. At $149.99
              per test, Visby is asking consumers to self-pay for speed, privacy, and PCR-grade confidence before
              routine reimbursement norms are visible, so adoption risk and financing risk are linked rather than
              separate problems.
