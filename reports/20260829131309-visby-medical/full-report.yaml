  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Visby’s architecture is a layered PCR system in which disposable assay hardware, a simple powered runtime, digital
      readout, and partner care rails form one integrated product.
    approximationNotes: >-
      The figure stays at the public product-system level because Visby does not disclose detailed microfluidic
      geometry, cloud services, or firmware internals.
    data:
      layers:
        - label: User and specimen layer
          detail: >-
            Female vaginal swabs, respiratory samples, and prospective male urine samples enter the platform through
            use-case-specific collection flows.
          items:
            - Self-collected vaginal swab
            - Clinical respiratory sample
            - Prospective male urine sample
        - label: Single-use disposable assay layer
          detail: A sealed disposable test contains the chemistry and test-specific biological logic for each menu item.
          items:
            - Preloaded reagents
            - Single-use cartridge
            - Menu-specific assay design
        - label: Miniaturized PCR runtime
          detail: The powered device executes Visby’s palm-sized 40-cycle PCR workflow without a conventional analyzer.
          items:
            - External power adapter
            - Thermal cycling
            - Under-30-minute runtime
        - label: Detection and result layer
          detail: >-
            Clinical products emphasize immediate onsite interpretation; home products add synchronized endpoint and
            app-mediated result delivery.
          items:
            - Point-of-care result availability
            - Endpoint PCR / lateral-flow logic
            - App result display
        - label: Digital care layer
          detail: >-
            The mobile app adds guidance, secure result access, telehealth connection, and future AI-driven reminders or
            education.
          items:
            - Google Cloud app
            - Telehealth connection
            - Result sharing
            - Gemini / Vertex AI roadmap
        - label: Scaling and governance layer
          detail: >-
            Automated manufacturing, BARDA-backed respiratory development, and FDA / CLIA pathways determine how fast
            the platform can expand.
          items:
            - San Jose automated manufacturing
            - BARDA support
            - Product-by-product FDA path
