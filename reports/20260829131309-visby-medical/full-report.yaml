  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Component
      - Description
      - Function
      - Dependency
      - Risk
    rows:
      - - Sample collection + disposable cartridge
        - Single-use swab-and-cartridge workflow with sealed consumable chemistry.
        - Starts assay and contains test-specific reagents / microfluidics.
        - Reliable consumables manufacturing and shelf-stable chemistry
        - Any cartridge defect directly destroys test yield because there is no reusable instrument buffer
      - - PCR thermal engine + small power adapter
        - Powered device runs the assay but is not positioned as a capital analyzer.
        - Enables miniaturized thermal cycling in home or clinic settings.
        - Accessory availability and qualified electronics supply
        - Power or accessory shortage could halt otherwise-ready cartridges
      - - Miniaturized 40-cycle PCR core
        - Palm-sized molecular-amplification architecture reused across STI and respiratory products.
        - Produces lab-grade molecular amplification fast enough for near-patient use.
        - Protected know-how, assay design, manufacturing precision
        - Scale economics may lag central-lab PCR until volume rises
      - - Detection and result-readout layer
        - >-
          Clinical products emphasize immediate onsite interpretation; home products add endpoint PCR plus
          lateral-flow/app synchronization.
        - Turns assay chemistry into actionable result output.
        - Companion software, UX design, and validation of result interpretation
        - Misread or poorly synchronized output would damage trust
      - - Google Cloud app + telehealth rail
        - Companion mobile app provides guided workflow, result display, and care routing.
        - Connects the physical test to digital care and future AI features.
        - Google Cloud, app stores, telehealth partners
        - Outage, policy change, or partner failure could break the home-care loop
      - - Automated San Jose manufacturing
        - State-of-the-art automated production line for disposable PCR devices.
        - Supports scaling, manufacturability, and cost-down ambitions.
        - Single-site operations and precision microfluidic manufacturing
        - A site interruption or low yield would constrain all product lines simultaneously
      - - Regulatory + quality system
        - Separate FDA paths and CLIA determinations by product line.
        - Determines what can be sold, where, and for whom.
        - FDA review cycles, labeling, and postmarket quality management
        - Each new assay must clear its own regulatory bottleneck
    notes: >-
      This is an operating-model architecture synthesized from public product and launch materials, not an internal
      circuit-level or cloud-service diagram.
