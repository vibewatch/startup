      - number: '7.2'
        title: Operational and quality risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, the chapter's most important risk is concentration. Public evidence points to San Jose as
              both the corporate center and the named manufacturing site supporting full-scale automated production,
              while this evidence set does not reveal a second qualified site. That leaves Visby exposed to a classic
              single-facility problem: a quality excursion, equipment issue, labor disruption, component shortage, or
              recall would not just trim utilization; it could interrupt the whole OTC launch. The risk is amplified by
              the product design. Visby sells a palm-sized single-use PCR device, so manufacturing precision sits inside
              every disposable test rather than in a reusable reader supported by cheap consumables. The company has
              spent years trying to scale capacity, with tenfold production language appearing in both 2020 and 2022
              coverage, which suggests the challenge is structural rather than cosmetic. Finally, 360Dx's report that
              Visby paused clinical sales raises the operational stakes further because it reduces the practical
              fallback if the OTC ramp encounters yield, quality, or demand problems.
