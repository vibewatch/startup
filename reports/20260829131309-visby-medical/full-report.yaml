  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape overview
        blocks:
          - type: paragraph
            body: >-
              Visby Medical no longer sits in one clean competitive box. Since the company paused new clinical
              point-of-care sales to concentrate on over-the-counter home testing, the most relevant near-term
              battlefield is consumer molecular diagnostics, not the entire hospital PCR market. That shift matters
              because Visby now competes simultaneously against three distinct groups: home-use molecular challengers
              such as Aptitude, Scout, Detect, and adjacent OraSure offerings; instrument-based point-of-care incumbents
              such as Cepheid, Abbott, and Roche; and status-quo central-lab workflows from Labcorp and Quest. BioFire
              matters less as a direct shelf-level rival and more as evidence of what sophisticated buyers can already
              get in institutional settings if breadth matters more than portability. The company still owns a
              meaningful first-mover position because the FDA identified Visby as the first home test for chlamydia,
              gonorrhea, and trichomoniasis, but that lead now has to be defended with workflow, channel access, and
              manufacturing execution rather than science alone.
