  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Visby's current lead product is not entering a mature reimbursement or enforcement lane; it is helping
              define one. The strongest de-risking fact is that FDA did authorize the first home test for chlamydia,
              gonorrhea, and trichomoniasis and the first OTC PCR sexual-health product, but that same novelty creates
              underwriting uncertainty. Future assays for respiratory infections, sore throat, urinary tract infection,
              and other common illnesses still need their own submissions, so the existing authorization does not
              collapse the regulatory burden across the whole roadmap. The De Novo classification also cuts both ways.
              It validates the category and strengthens Visby's first-mover narrative, yet it also means later entrants
              will not face the exact same first-in-category burden. Legal exposure extends beyond accuracy. Visby's own
              privacy and terms pages show that the workflow spans websites, apps, devices, lab analyses, service
              providers, care handoff, and arbitration-sensitive consumer interactions. For a home STI product, that
              makes privacy, breach response, labeling discipline, and post-market signal management part of the core
              regulatory case, not adjacent compliance work.
