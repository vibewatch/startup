  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation turns on the gap between authentic platform promise and still-thin public proof on economics
      and adoption.
    data:
      nodes:
        - id: category
          label: Category-first OTC PCR
          detail: FDA-authorized first OTC PCR sexual-health test creates strategic differentiation.
        - id: pipeline
          label: Pipeline / second clearance
          detail: Respiratory OTC clearance and men's STI submission create option value beyond one SKU.
        - id: proofgap
          label: Proof gap
          detail: Revenue, repeat demand, gross margin, and reimbursement remain only lightly disclosed.
        - id: pricing
          label: Price friction
          detail: The visible offer remains around $149.99, which can cap mainstream adoption.
        - id: valuation
          label: Current mark
          detail: ~$1B valuation against ~$35M tracker-estimated revenue implies a very rich multiple.
        - id: decision
          label: Recommendation
          detail: Conditional interest / track until metrics justify the price or entry terms improve.
      edges:
        - from: category
          to: pipeline
        - from: pipeline
          to: valuation
        - from: proofgap
          to: valuation
        - from: pricing
          to: proofgap
        - from: valuation
          to: decision
    approximationNotes: >-
      This figure compresses the chapter logic into decision gates rather than depicting a literal corporate process
      map.
    claimRefs:
