  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform technology and architecture
        blocks:
          - type: paragraph
            body: >-
              Visby Medical’s central technical asset is not a single assay but a miniaturized PCR platform that
              compresses core molecular-diagnostics functions into a palm-sized disposable. Public product and corporate
              pages consistently describe a single-use, instrument-free architecture with prepackaged chemistry and a
              small powered device that eliminates the need for a benchtop analyzer, service contract, or ongoing
              maintenance. The platform is explicitly framed as a 40-cycle PCR system, yet it still returns answers in
              under 30 minutes and can multiplex across more than one pathogen, which is the core reason the same base
              architecture can serve both sexual-health and respiratory workflows. The technology is therefore best
              understood as an integrated stack: specimen handling, sealed disposable chemistry, thermal cycling,
              readout, and then either a clinical or consumer interface. Table TE003 breaks that stack into operating
              layers, while Figure FE001 shows how the assay layer, digital layer, and manufacturing backbone fit
              together as one system rather than disconnected products.
