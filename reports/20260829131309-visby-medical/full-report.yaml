      - number: '1.5'
        title: Strategic Pivot, Milestones, and Open Gaps
        blocks:
          - type: paragraph
            body: >-
              The most important strategic change in the current record is the 2025 pivot toward OTC and at-home
              testing. Independent reporting says Visby paused clinical point-of-care sales so it could focus resources
              on the consumer launch, while commercial leadership stressed that the retreat from the provider channel
              was temporary rather than permanent. The Google Cloud-supported app and telehealth workflow show why
              management made that trade: OTC delivery is not just a packaging change, but a higher-touch digital
              service model that can convert a positive result into same-day guidance and treatment access.


              This pivot is occurring against a favorable demand backdrop. HIV.gov's summary of CDC's 2024 STI data
              underscores the persistent burden that makes fast, private STI testing commercially relevant. At the same
              time, the company-overview record still has material blind spots: no exact current revenue, no exact
              current headcount, no public cap-table mechanics, and no detailed roadmap for when point-of-care selling
              restarts. The milestone arc is clearly positive, but the diligence burden now shifts from proving
              technical novelty to proving repeatable commercial economics and channel durability.
