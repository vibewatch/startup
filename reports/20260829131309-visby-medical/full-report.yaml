  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market definition and boundaries
        blocks:
          - type: paragraph
            body: >-
              Visby Medical should not be analyzed as a generic diagnostics company. The company now sits at the
              intersection of three specific spending pools: consumer-purchased at-home STI testing, near-patient
              clinical molecular diagnostics, and emerging at-home respiratory PCR. The cleanest boundary is not every
              dollar ever spent on sexually transmitted disease diagnostics or respiratory testing, because those
              broader categories include centralized lab PCR, physician visits, send-out specimen handling, and other
              workflows that Visby does not capture directly. Instead, the relevant market is the spend on rapid
              molecular testing performed either by the consumer at home or by clinicians at the point of care, plus the
              enabling digital-care workflow that turns a result into treatment. This boundary matters because some
              third-party estimates refer to technology categories, while others refer to site-of-care or consumer
              channels. If those numbers are added together without adjustment, the result double-counts overlapping
              assay categories and makes Visby's opportunity look larger and cleaner than the evidence supports.
            claimRefs:
