summary:
  headline: >-
    Visby Medical is a category-defining molecular diagnostics company with real first-mover FDA regulatory advantages
    in OTC PCR testing, but a $1B valuation against only ~$35M estimated revenue demands strong consumer adoption
    evidence before it can be underwritten with high conviction.
