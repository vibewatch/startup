    title: 估值敏感性
    type: bar
    layout: wide
    summary: 收入验证和可接受倍数的小幅变化，会让隐含股权价值出现很大变化。
    data:
      items:
        - label: $50M 按 2x
          value: 100
          unit: USD M
        - label: $50M 按 3x
          value: 150
          unit: USD M
        - label: $125M 按 4x
          value: 500
          unit: USD M
        - label: $125M 按 5x
          value: 625
          unit: USD M
        - label: $295M 按 5x
          value: 1475
          unit: USD M
        - label: $375M 按 6x
          value: 2250
          unit: USD M
    approximationNotes: 收入点结合了基于跟踪器的当前收入、情景收入区间，以及乐观情景使用的终局 STI 市场份额 5% 视角。
