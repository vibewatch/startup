  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现策略
        blocks:
          - type: paragraph
            body: >-
              Visby Medical 的财务叙事不再围绕传统的“面向临床医生销售诊断耗材”展开。公司已经把商业重心移向 Women's Sexual Health Test
              的直接面向消费者销售和伙伴中介销售，同时保留一个选项：等 OTC 规模建立后，再重新引入专业现场即时检测通道。当前变现最强的公开证据，是 visby.com 上实时 $149.99
              的产品页面；市场列表和公司声明也印证，该检测自 2025 年中起在主要消费者渠道发布。因此，收入看起来始于一次性自费检测购买，远程医疗和处方流转则充当转化支持，而不是已单独披露的经常性收入线。这一点很重要，因为
              Visby 在财务上更接近消费者医疗科技的“检测加护理”流程，而不是纯软件订阅业务。同时，临床产品基础并未完全消失：Fisher 仍列出专业性健康 SKU，管理层也告诉
              360Dx，临床销售是暂停，而不是永久关闭。
