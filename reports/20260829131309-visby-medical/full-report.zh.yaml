      - number: '4.5'
        title: 财务缺口与承销含义
        blocks:
          - type: paragraph
            body: >-
              承销问题不在于 Visby 是否有可信技术或真实消费者需求，而在于公司能否在下一个融资窗口比科学本身更重要之前，证明财务效率。本次未找到经审计公开财务数据，最关键的运营指标仍未披露：准确 2026
              年收入、渠道组合、实际
              ASP、毛利率、账上现金、月度烧钱速度、复购率、退货和支付方回款。一些外部追踪器本身无法访问或数据不一致，也降低了单一第三方快照的可信度。因此，尽调只能依赖情景分析。一个合理的公开基准情景是：一家 180-194
              人、仍有研发和发布支出的医疗科技制造商，每年烧钱数千万美元；这会让 $55M-$65M 轮融资更像 15-18
              个月的运营现金跑道，而不是通往盈利的完整桥梁。如果这一框架方向正确，投资逻辑就取决于下一周期的三个联动证明：OTC
              终端动销、自动化带来的单位成本下降，以及呼吸道检测形成第二条居家收入线。没有这些证明，相对今天公开指标，约 $1B 估值意味着极高的前瞻要求。
