      - number: '4.3'
        title: 单元经济与成本结构
        blocks:
          - type: paragraph
            body: >-
              关于 Visby 单元经济的公开证据只有方向性，并不完整。公司及其支持者反复强调，可制造性和自动化是商业模型的核心：2023 年第二代现场即时检测产品据称提升了可制造性和可靠性，Mark Medlen
              称公司可以转向全自动产线，Chuck Alpuche 称 Visby 必须精简制造并压低单位成本。这些是正向信号，因为一次性 PCR
              设备必须把检测化学、塑料件、包装、质控和分发成本都装进每个售出单元里。但同一组证据也说明，问题尚未解决。独立评论仍把毛利率描述为在 COGS
              下降前承压；本次审阅的公开来源没有披露当前毛利率、渠道组合或贡献利润。最好的公开经营进展替代指标 因此相当粗：Growjo 的约 $35M 收入估计、约 180-194 名员工，以及由此隐含的每员工收入约
              $180k-$194k。这些数字说明商业化真实存在，但距离那种足以忽略制造执行风险的轻资产经济性还很远。
