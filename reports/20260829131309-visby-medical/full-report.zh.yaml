      - number: '5.2'
        title: 产品组合与监管状态
        blocks:
          - type: paragraph
            body: >-
              Visby 现在已经有一条清晰的产品阶梯，而不是单一产品故事。历史基础是 2021 年第一代女性性健康现场即时检测，随后是 2023 年 Gen 2 临床版本，后者简化了操作，并向全自动制造推进。2025
              年，产品组合因两项不同监管胜利而拓宽：2025 年 2 月呼吸道临床产品获得 510(k) 许可和 CLIA 豁免；2025 年 3 月居家女性性健康 OTC 产品获得 De
              Novo，并为任何适应症创建了首个居家 OTC PCR 分类。2026 年 7 月，Visby 增加首个用于甲型流感、乙型流感和 SARS-CoV-2 的 OTC 多病毒居家
              PCR。下一步公开动作是男性性健康提交，咽喉痛、UTI 和 AI 辅助指导仍处于开发阶段。表 TE001 列出可见产品和渠道，图 FE004
              按产品线给成熟度打分，让已获授权、正在发布和管线资产之间的差别变得明确，而不是靠读者推断。
