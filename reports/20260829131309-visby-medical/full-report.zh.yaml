  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Visby Medical 已不再落在一个干净的竞争框里。公司暂停新的临床即时检测销售、转而集中做 OTC 居家检测后，短期最重要的战场是消费者分子诊断，而不是整个医院 PCR 市场。这个转向很重要，因为
              Visby 现在同时面对三类对手：Aptitude、Scout、Detect 以及相邻的 OraSure 产品等居家分子挑战者；Cepheid、Abbott 和 Roche 等基于仪器的现场即时检测既有企业；以及
              Labcorp 和 Quest 代表的集中实验室现状流程。BioFire 作为直接货架层面的对手意义较小，更像一个证据：如果成熟买方更看重菜单广度而不是便携性，他们在机构场景里已经能买到高端多重检测流程。FDA
              将 Visby 认定为首个衣原体、淋病和滴虫病居家检测，公司仍拥有有意义的先发位置；但这份领先现在必须靠流程、渠道准入和制造执行来防守，而不能只靠科学本身。
