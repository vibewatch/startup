              Visby 披露的渠道启动证据，远多于客户规模证据。最清楚的经营进展里程碑，是 2025 年 7 月女性居家 STI 检测在 DTC 和合作伙伴渠道全国发布。随后公开来源显示，触达面持续拓宽：Everlywell
              将该产品列入其诊断市场，Optum Now 以无需保险和在线护理集成进行陈列，DoorDash 与 DashMart 提供快速本地配送，Gopuff 为 Visby.com 提供直接配送，Quest 于 2025
              年 11 月把检测加入 questhealth.com，Labcorp OnDemand 于 2026 年初加入。对一款医疗科技产品而言，配送证据异常具体：官方发布材料称首批当日服务覆盖十个主要都市区，360Dx
              则报道借 DashMart 覆盖 500 个邮编。缺失的是分母。Visby 尚未公布总客户数、总检测销量、复购率、远程医疗转化率或任何分平台 终端动销，因此公开记录支持的是可获得性广度，而不是采用规模。
