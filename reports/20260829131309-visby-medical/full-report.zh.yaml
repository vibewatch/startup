chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立与运营画像
        blocks:
          - type: paragraph
            body: >-
              Visby Medical 更适合被理解为一家分子诊断平台公司；它的商业叙事如今同时跨在临床即时检测和直接面向消费者检测两条线上。公司由 Adam de la Zerda 于 2012 年 12 月以 Click
              Diagnostics 名义注册成立，运营中心一直放在加州圣何塞，后来在 2020 年 3 月更名为 Visby Medical。历史连续性很关键：它把 COVID 前的技术平台，与后来 COVID
              和性健康商业化路径连在了一起，而不是把今天的公司当成一次全新发布。


              公司的使命表述异常具体：管理层称，希望让医生和患者能够随时随地以实验室准确度检测，从而重塑感染病诊断。这一使命直接落到产品形态上。Visby 的标志性设备是一套掌心大小的一次性 PCR
              系统，把样本制备、扩增和检测整合在一起，不需要单独分析仪，并在不到 30 分钟内返回结果。公司也同时维护两套数字触点——临床即时检测网站和消费者购买流程——这强化了一个判断：即便 OTC
              需求现在决定节奏，公司也并未彻底放弃医疗服务方渠道。
