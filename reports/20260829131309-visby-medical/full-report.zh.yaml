      - number: '7.5'
        title: 缓释措施和否决条件
        blocks:
          - type: paragraph
            body: >-
              这个案子并非不能投，但今天已经存在的缓释措施，大多只是使能条件，而不是终端市场已经耐久的证明。FDA
              授权、伙伴分发、远程医疗整合和持续制造投入，都降低了一些早期商业化摩擦。但它们都不能替代复购、报销、毛利率或低成本规模。因此，正确的监测框架应该由事件驱动。正面信号包括：上市后表现干净，OTC
              终端动销与分发广度匹配，后续检测获批并拓宽收入基础，以及公司能在这些里程碑确立前避免再次融资。负面信号更容易定义，也应视为打破投资逻辑的风险：质量事件或召回，无法用消费者需求替代已暂停的临床收入，远程医疗或电商伙伴出现实质流失，未能按时拿到新授权，或由在位大厂带头的更低价竞争在报销扩大前压缩价格。这些指标会最快改变投资结论。
