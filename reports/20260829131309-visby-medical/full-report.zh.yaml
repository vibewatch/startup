  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台技术与架构
        blocks:
          - type: paragraph
            body: >-
              Visby Medical 的核心技术资产不是单一检测项目，而是一个微型化 PCR
              平台，把分子诊断的核心功能压缩进掌心大小的一次性设备里。公开产品页和公司页面一致描述了一种一次性、无仪器架构：预封装化学试剂和小型供电设备结合，免去台式分析仪、服务合同和持续维护。公开材料明确称平台是
              40-cycle PCR 系统，但仍能在不到 30
              分钟内给出答案，并可对多个病原体做多重检测；这正是同一底层架构能同时服务性健康和呼吸道流程的核心原因。因此，这项技术最好被理解为一套整合栈：样本处理、密封一次性化学反应、热循环、读数，然后接入临床或消费者界面。表
              TE003 将这套栈拆成运营层，图 FE001 则展示检测层、数字层和制造骨干如何组合成一个系统，而不是彼此割裂的产品。
