  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议和投资逻辑
        blocks:
          - type: paragraph
            body: >-
              Visby Medical 值得认真关注，因为它在诊断领域做成了一件很难的事：先开创并拿下首个 FDA 授权的非处方 PCR 性健康品类，又在呼吸道检测上拿到第二个居家 PCR
              批准。这个组合带来真实的期权价值。一家公司如果有新产品、多项 FDA 批准、BARDA 支持的开发历史和有意义的渠道合作，只要执行守得住，就有可能长成一个大的消费诊断平台。问题在价格。公开证据仍指向约 $1B
              的当前估值，而当前收入只能从第三方追踪器看到大约 $35M，隐含收入倍数接近
              28.6x。按这个进入点，投资人买的不是已经验证的规模，而是未来采用、未来报销和未来制造杠杆。因此建议是有条件关注，而不是照价接受。Visby
              足够强，值得留在短名单上；但在终端动销、复购需求、毛利率或优先股堆叠出现公开证据前，当前估值已经把很大一部分上行空间资本化了。
