      - number: '2.4'
        title: 增长驱动因素与长期顺风
        blocks:
          - type: paragraph
            body: >-
              几个长期驱动因素支撑 Visby 的市场逻辑。第一是疾病负担：美国每年报告的 STI 数量仍在低百万级，滴虫病仍高度流行，WHO 也持续称全球每天新增超过一百万例可治愈
              STI。第二是传统诊疗路径与用户偏好错位。许多感染没有症状，污名仍然明显，消费者越来越想要私密、自主、不必跑实验室，也不用等待邮寄结果的检测。第三，疫情让居家诊断常态化，也让消费者更愿意信任
              应用引导的检测和后续远程医疗。第四，FDA 行动很重要。Visby 2025 年居家性健康 PCR 的 De Novo，以及 2026 年呼吸道居家 PCR 许可，说明监管方现在愿意定义并扩展 OTC
              分子检测品类。最后，抗菌药物耐药性和早期治疗的临床价值强化了一个论点：当速度影响结果时，敏感性更高的检测有理由相对准确性较低的替代方案收取溢价。
