      - number: '7.3'
        title: 合作伙伴、依赖和财务风险
        blocks:
          - type: paragraph
            body: >-
              Visby 的居家流程不是单纯卖产品。Google Cloud 托住结果交付，Optum Now 锚定就医路径，Everlywell、Fisher Scientific
              等外部商业或分发触点扩大触达。这些合作是优势，但也意味着第三方宕机、降优先级、改变经济条款或终止合作，即使检测本身没有失败，也会拖累客户体验。呼吸道扩张也有自己的依赖，因为公开发布把开发支持与 BARDA
              支持的资金绑定在一起。从财务看，已消耗资本和已披露收入之间的非对称很刺眼。公开来源支持大约 $487M 融资额，以及 2025 年 6 月接近 $1B
              的估值标记；而当前收入仍只是未经审计的第三方估计，大约在数千万美元中段。这个错配很关键，因为它压缩了市场对缓慢 OTC 爬坡的容忍度。每次检测 $149.99，Visby
              要求消费者在常规报销规则清晰之前，先为速度、隐私和 PCR 级信心自费，因此采用风险和融资风险不是两个彼此独立的问题。
