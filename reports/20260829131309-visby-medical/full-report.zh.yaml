      - number: '8.2'
        title: 估值框架和融资背景
        blocks:
          - type: paragraph
            body: >-
              看 Visby，合适的估值视角既不是纯医疗科技硬件，也不是纯消费者互联网，而是一个混合型诊断平台：有一次性设备经济性、受监管产品风险和消费者获客不确定性。公开融资记录锚定了讨论。Visby 2025 年 6 月
              F 轮融资据报道约 $55M，可扩至 $65M，估值 $1B；Tracxn 则把 2022 年 E 轮放在同一估值水平。这意味着尽管公司在监管和产品上有真实进展，估值标记约三年基本持平。在 2022
              年后的诊断市场里，持平好过下调，但这也说明 OTC
              突破后，这一轮并没有把公司重新向上定价。主要原因很可能是证据质量。收入仍是追踪器估计，不是公司披露；报销仍更像迹象，而非已被证明；可见的消费者产品，在伙伴渠道上仍依赖 $149.99
              的自费价格点。既然当前估值是拿轻度验证的收入来衡量，承保负担就应该压在运营证明上，而不能只靠叙事动能。
