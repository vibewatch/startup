            body: >-
              点名证明有两种形式。合作伙伴侧，Visby 现在已有借 Everlywell、Optum Now、DoorDash、Gopuff、Quest、Labcorp 和 Fisher Scientific
              开展第三方陈列的直接证据，并且官方还提到 Wisp、RAINN 和 Ovia Health。这些名字很重要，因为它们把 Visby
              从单一公司官网商店推进到更成熟的医疗或商业中介，说明这些渠道确实愿意承载该产品。历史临床侧，最好的公开点名客户证明仍是证言，而不是销量数据。Associates in Women's Healthcare 的
              Denise Sweeney 医生称该检测能改变就诊流程，因为患者可以自行采样，并在同次就诊内得到答案；CareNow Urgent Care 的 Lamont Tyler
              表示，快速且准确的结果通常让从进门到出院的时间保持在一小时以内。一项 Johns Hopkins
              急诊科研究又增加了以结果为导向的可信度：相较标准送检，它显示结果显著更快，抗生素管理更好。合在一起，这些来源验证了产品有用性，但仍没有披露 Visby 实际转化了多少付费站点或经常性消费者家庭。Visby 的
              Safe Access Program 提供了尤其具体的非商业合作伙伴证明：公司称 RAINN 第一阶段分发已覆盖 17 个州 20 个合作项目的 1,000
              套试剂盒。这没有解决收入问题，但说明平台既可适配侧重可及性的 渠道，也可适配商业渠道。
