      - number: '3.2'
        title: 直接竞争者与最接近的替代方案
        blocks:
          - type: paragraph
            body: >-
              最接近的直接对标取决于买方和诊疗场景。面向诊所的性健康检测中，Roche 重合度最高，因为其 2025 年 1 月 STI 许可把衣原体、淋病和生殖支原体带到一个快速、CLIA 豁免的现场即时 PCR
              平台上。Cepheid 仍是重要标杆，因为 Xpert CT/NG 覆盖同一组病原体，并支持同次就诊内采取临床行动，但它仍依赖 GeneXpert 仪器，出结果时间也更长。Abbott ID NOW
              在呼吸道检测上更快，且已深度进入现场即时检测场景；不过已审阅菜单集中在流感、COVID-19、RSV 和链球菌，而不是 STI 检测。在居家分子侧，Aptitude
              是消费者侧最可信的相邻公司，因为它已经拥有获授权的居家和现场即时分子呼吸道检测；Scout 和 Detect 则展示了小型开发者如何用便携分子流程去消除同一个速度与准确性取舍。OraSure 更应被理解为拥有
              OTC 与 CLIA 豁免感染病分发能力的性健康相邻玩家，而不是今天的直接 PCR 同类。
