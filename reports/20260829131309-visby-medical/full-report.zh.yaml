      - number: '1.3'
        title: 产品架构与监管护城河
        blocks:
          - type: paragraph
            body: >-
              产品架构是 Visby 在分子诊断中脱颖而出的核心原因。公司没有把试剂盒与台式分析仪配套，而是把 PCR
              化学反应和流程封装进一次性耗材里，降低诊所部署仪器的摩擦，也让消费者流程变得可行。女性性健康组合如今覆盖临床和 OTC 两种用途，呼吸道产品组合仍具临床重要性，并已扩展到居家 Flu/COVID-19
              产品。公开材料反复强调同样三个产品属性：实验室级 PCR、无需单独分析仪、30 分钟内出结果。


              监管路径同样关键。公司的里程碑从 2020 年 9 月 COVID EUA 开始，接着是 2021 年和 2023 年女性检测许可、2022 年 12 月呼吸道 EUA、2025 年 2 月呼吸道 510(k)
              与 CLIA 豁免、2025 年 3 月 OTC 女性检测 De Novo，以及 2026 年 7 月居家多病毒 PCR 许可。这个序列形成了真实护城河：Visby 并不只是宣称未来会领导 OTC
              分子检测；它已经拿到让这个品类可信的 FDA 里程碑。
