      - number: '7.2'
        title: 运营和质量风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，本章最重要的风险是集中度。公开证据显示，San Jose 既是公司中心，也是支持全规模自动化生产的具名制造地点；这组证据没有显示第二个合格场地。Visby
              因此暴露在典型的单设施风险下：质量偏差、设备问题、劳工中断、组件短缺或召回，不只是压低利用率，还可能打断整个 OTC 发布。产品设计放大了这项风险。Visby 销售的是掌心大小、一次性使用的 PCR
              设备，制造精度嵌在每一支一次性检测里，而不是放在可重复使用的读取器上，再配廉价耗材。公司多年都在尝试扩产，2020 年和 2022
              年的报道里都出现过十倍产能的表述，这说明挑战更像结构性问题，而不是表面问题。最后，360Dx 报道 Visby 暂停了临床销售，进一步抬高了运营风险；如果 OTC
              爬坡遇到良率、质量或需求问题，公司可用的现实退路会更少。
