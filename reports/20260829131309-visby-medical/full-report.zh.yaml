      - number: '3.3'
        title: 既有巨头威胁与相邻玩家
        blocks:
          - type: paragraph
            body: >-
              Visby 最大的长期风险，不是另一家创业公司照抄产品手册，而是大型既有企业认为 OTC 分子品类的商业吸引力足够高，于是带着更强的分发杠杆下场。Abbott、Roche 和 Cepheid
              已经拥有可信的分子品牌、监管团队、装机仪器和临床关系。BioFire 展示了同一问题的另一种版本：当医院更看重菜单广度和病原体覆盖，而不是便携性时，它们已经会购买高价多重检测流程。Mordor
              Intelligence 的公司列表进一步说明，Visby 旁边是一个重量级 PCR 生态，而不是空白地带。这不会让 Visby
              变得无关紧要；但它意味着，公司不能假设率先进入家庭场景，就会在既有企业注意到该品类后自动转化为持久统治力。临床销售的暂时暂停，也增加了专业客户在 Visby 专注消费者渠道建设期间转向其他标准方案的风险。
