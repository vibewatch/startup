      - number: '8.5'
        title: 打破投资逻辑的条件和监测
        blocks:
          - type: paragraph
            body: >-
              潜在投资人最重要的纪律，是把 Visby 故事拆成可衡量的关口。正面信号包括：公开证明 OTC 终端动销
              稳定，复购或伙伴附着行为改善，更多获批扩大菜单，以及单位经济性朝正确方向移动的可信迹象。负面信号同样清楚：在消费者需求确立前又需要融资，报销路径停滞，渠道支持出现可见下滑，或任何破坏「居家获得实验室级结果」承诺的质量事件。股权结构表不透明在这里也比很多软件公司更重要，因为多年融资后估值标记仍持平在
              $1B，可能藏着有意义的清算优先权悬置。本章最终立场并不是反对
              Visby，而是反对虚假的精确。公司未来仍可能挣到溢价倍数，但公开记录仍缺少收入质量、毛利率能见度和采用指标，无法支撑按表面值接受当前估值。深度尽调应该盯经济性和转化，而不是技术故事。
