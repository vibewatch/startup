        title: 融资历史与资金充足性
        blocks:
          - type: paragraph
            body: >-
              即使不重述“公司概况”里的完整融资时间线，财务部分也已经可以得出一个明确结论：Visby 是一家资本密集型诊断公司，需要反复股权融资和非稀释性资金来继续扩张。2022 年 3 月官方 Series E
              公告称，超过 $100M 将用于把月产量从数万份提升到数十万份，并扩展检测菜单；2022 年 6 月扩展轮又增加 $35M，用于类似的规模化和管线目标。2025 年 6 月融资随后增加约 $55M，并有可能达到
              $65M，专门用于加速居家女性 STI 检测的发布和分发。与此同时，BARDA、NIH 和 CARB-X
              资金支持了呼吸道和抗菌药物耐药项目，说明政府和使命驱动型资本一直是风险股权的重要补充。累计资本图景取决于观察口径：Tracxn 报告融资为 $386M，Calcalistech 报告含资助金为
              $487M。无论哪种口径，融资规模相对有限的公开收入估计都非常大，意味着这门生意仍需要高利用率、更低 COGS 和成功的新产品发布，才能让前期资本显得有效率。
