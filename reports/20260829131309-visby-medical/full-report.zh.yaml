  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与买方画像
        blocks:
          - type: paragraph
            body: >-
              Visby 当前客户群最好拆成三层。第一层是直接消费者：使用公司居家性健康 PCR 检测的女性。该产品定位为自费、重隐私的诊断，提供
              应用结果；若结果为阳性，还接入当日远程医疗跟进。最强的公开证据指向年轻成年人和育龄女性，这是最重要的需求池，因为检测面向 14 岁及以上用户销售，许多感染没有症状，而 Visby 引用的 CDC
              流行病学数据显示，年轻年龄段负担很大。第二层是 B2B2C 分发层：Everlywell、Optum Now、Quest、Labcorp、DoorDash、Gopuff
              等远程医疗、数字诊断和即时商务伙伴，降低从怀疑、购买、结果到治疗之间的摩擦。第三层是历史临床层，包括急诊护理中心、女性健康诊所、医生诊所和其他 CLIA
              豁免场景；这些客户过去看重现场即时检测在同次就诊内完成流程的价值，但在 OTC 转向后已经降为战略次要位置。
