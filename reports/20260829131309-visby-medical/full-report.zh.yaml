      - number: '2.5'
        title: 约束与采用壁垒
        blocks:
          - type: paragraph
            body: >-
              同一组证据也说明，不能把 Visby 的机会看成没有摩擦。最清楚的壁垒是价格。旗舰女性 OTC 检测定价 US$149.99，是一款高价自费产品；要让用户采用，买方必须高度重视隐私、速度和 PCR
              级信心。公开记录中的报销机制仍不成熟；公司强调 FSA 和 HSA 资格，而不是常规保险覆盖，这意味着大众市场扩张可能落后于临床有效性。第二个壁垒是市场新颖性。De Novo
              和品类首创胜利有助于创建品类，但也意味着支付路径、药师教育和常态化消费者购买行为仍在形成。第三，公司自己的商业转向也是一个警示信号：360Dx 报道 Visby 暂停了部分临床即时检测销售，以聚焦
              OTC，暗示组织带宽有限，且需要在渠道之间做取舍。最后，公开数据仍不足以测算 Visby 真正短期可获取的市场，因为单位终端动销、复购行为、政府或零售渠道产出都未披露。
