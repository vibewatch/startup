  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐结论取决于真实的平台潜力，与经济性和采用率公开证据仍薄弱之间的落差。
    data:
      nodes:
        - id: category
          label: 品类首个 OTC PCR
          detail: FDA 授权的首个 OTC PCR 性健康检测，带来战略差异化。
        - id: pipeline
          label: 管线 / 第二项获批
          detail: 呼吸道 OTC 获批和男性 STI 提交，让单一 SKU 之外出现期权价值。
        - id: proofgap
          label: 证据缺口
          detail: 收入、重复需求、毛利率和报销仍只有轻量披露。
        - id: pricing
          label: 价格摩擦
          detail: 可见报价仍在约 $149.99，可能限制主流采用。
        - id: valuation
          label: 当前估值
          detail: 约 $1B 估值对应约 $35M 跟踪器估算收入，意味着倍数很高。
        - id: decision
          label: 推荐
          detail: 有条件关注 / 跟踪，直到指标支撑价格，或入场条款改善。
      edges:
        - from: category
          to: pipeline
        - from: pipeline
          to: valuation
        - from: proofgap
          to: valuation
        - from: pricing
          to: proofgap
        - from: valuation
          to: decision
    approximationNotes: 该图把章节逻辑压缩为决策关口，而不是描绘字面上的公司流程图。
