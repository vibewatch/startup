      - number: '8.3'
        title: 可比框架和市场上行
        blocks:
          - type: paragraph
            body: >-
              可比分析对 Visby 有用，但前提是把它当成设定区间的工具，而不是精确的盯市方法。最相关的上市公司和交易参照可分两组。第一组是 Cepheid、BioFire、Mesa Biotech
              等分子诊断交易。这些交易显示，战略买家过去会为已规模化的分子资产支付中个位数收入倍数；在 COVID 时代需求激增时，Mesa 达到过两位数倍数。第二组是 Everlywell、Lucira
              等消费诊断和健康平台参照。这些案例显示，消费者可及性、渠道广度和报销摩擦会把估值大幅推向两个方向。Lucira 尤其重要，因为它证明 FDA 批准的 OTC PCR
              本身不足以创造持久价值。在这个背景下，Visby 的上行论点更多依赖市场扩张，而不是近期可比支持。已发布市场研究指向的居家 STI 品类，约从 2025 年 $3.0B 增长到 2033 年
              $5.9B；即时分子诊断预计从 2025 年约 $4.3B 增长到 2030 年 $7.09B。需求面足够大，但 Visby 仍必须证明自己能以有利润的方式捕获它。
