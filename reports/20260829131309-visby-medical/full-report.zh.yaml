      - number: '1.2'
        title: 创始人、高管与治理
        blocks:
          - type: paragraph
            body: >-
              创始人中心性是 Visby 治理结构的一个突出特征。Adam de la Zerda 仍担任创始人兼 CEO，他的 Stanford 背景为公司提供了有科学可信度的公众面孔。Greg Loney 作为联合创始人兼
              CTO 支撑技术侧，Gary Schoolnik 作为首席医疗官带来感染病权威。这个三人组合把 Visby 的科学前提、工程落地和临床可信度，紧密系在创立期的一小组核心人物身上；好处是聚焦，风险是关键人物集中。


              更广泛的运营团队可见，但透明度仍不完整。公开资料确认 Mark Medlen 负责运营，Elizabeth Lingenfelter 负责质量、监管和临床事务，Chris Weaver
              负责商业运营，William Meyer 负责财务，Joseph Patterson 负责制造。治理层也在 2025 年 6 月扩容：Catalio 的 Isaac Ro 加入董事会观察员席位，Chuck
              Alpuche 加入成为独立董事。这些增补说明，Series F 前后董事会正在走向成熟；但公开披露仍没有完整组织架构或董事会控制机制，因此后续尽调应把现有名单视为已确认但不完整。
