      claimRefs:
        - CO012
  foundingLocation: San Jose, California, USA
  headquarters: San Jose, California, USA
  productSummary: Visby Medical 销售用于性传播感染和呼吸道感染的无仪器一次性 PCR 诊断检测，既可在家中（OTC）使用，也可在临床场景做现场即时检测。
  customerFocus: 寻求私密居家 STI 检测的女性；急诊护理和医生诊所（POC 临床，目前暂停）；远程医疗和电商平台合作伙伴；公共卫生分发渠道。
  businessModel: 靠一次性检测盒销售变现：B2C OTC 每次检测约 $149.99，专业渠道临床单次检测价格约 $150（已暂停）。收入来自 DTC、电商合作伙伴、临床分销商和按需配送合作。
  stage: Late-stage private
