  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              不应把 Visby Medical 当成一家泛化诊断公司来分析。公司现在位于三个具体支出池的交叉点：消费者自费购买的居家 STI 检测、患者身边临床分子诊断，以及新兴的居家呼吸道
              PCR。最干净的边界，并不是性传播疾病诊断或呼吸道检测的全部支出，因为这些更宽的类别包含集中实验室 PCR、医生就诊、送检样本处理以及 Visby
              不能直接捕获的其他流程。更匹配的市场，是消费者在家或临床医生在即时检测点完成的快速分子检测支出，加上把结果转化为治疗的数字医疗流程。这个边界很重要，因为一些第三方估计指向技术类别，另一些指向诊疗地点或消费者渠道。如果不加调整就把这些数字相加，会重复计算重叠的检测类别，并把
              Visby 的机会看得比证据支持的更大、更干净。
