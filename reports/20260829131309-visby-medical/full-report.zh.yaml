  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 组件
      - 描述
      - 功能
      - 依赖
      - 风险
    rows:
      - - 样本采集 + 一次性 cartridge
        - 单次使用的拭子与 cartridge 工作流，耗材内封装化学体系。
        - 启动 assay，并容纳检测专属试剂 / 微流控。
        - 可靠的耗材制造和货架稳定的化学体系
        - 没有可复用仪器做缓冲，任何 cartridge 缺陷都会直接打掉检测良率
      - - PCR 热循环引擎 + 小型电源适配器
        - 供电设备运行 assay，但定位不是资本设备分析仪。
        - 让小型化热循环可在家用或临床场景跑起来。
        - 配件可用性和合格电子供应
        - 电源或配件短缺可能让已备好的 cartridges 停摆
      - - 小型化 40-cycle PCR 核心
        - 掌上分子扩增架构，在 STI 和呼吸产品中复用。
        - 以足够快的速度产出实验室级分子扩增结果，适合近患者使用。
        - 受保护 know-how、assay 设计、制造精度
        - 规模经济可能要等放量后才追上中心实验室 PCR
      - - 检测与结果读出层
        - 临床产品强调现场即时解读；家用产品加入终点 PCR 以及侧向层析 / app 同步。
        - 把 assay 化学结果转成可行动的输出。
        - 配套软件、UX 设计和结果解读验证
        - 误读或同步不佳会伤害信任
      - - Google Cloud app + 远程医疗通路
        - 配套移动 app 提供引导式工作流、结果展示和护理分流。
        - 把实体检测连接到数字护理和未来 AI 功能。
        - Google Cloud、应用商店、远程医疗合作伙伴
        - 宕机、政策变化或合作伙伴失效，可能打断居家护理闭环
      - - San Jose 自动化制造
        - 面向一次性 PCR 设备的先进自动化产线。
        - 支撑放量、可制造性和降本目标。
        - 单一站点运营和精密微流控制造
        - 站点中断或低良率会同时掣肘所有产品线
      - - 监管 + 质量体系
        - 按产品线分开的 FDA 路径和 CLIA 判定。
        - 决定能卖什么、在哪里卖、卖给谁。
        - FDA 审评周期、标签和上市后质量管理
        - 每个新 assay 都必须打穿自己的监管瓶颈
    notes: 这是一张基于公开产品和上市材料综合出的运营模式架构表，不是内部电路级或云服务图。
