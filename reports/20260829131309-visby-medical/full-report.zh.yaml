  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据集支持很宽的区间；当前 $1B 估值高于基准情景，也远高于悲观情景。
    data:
      items:
        - label: 悲观情景
          low: 100
          high: 150
          unit: USD M
        - label: 基准情景
          low: 400
          high: 750
          unit: USD M
        - label: 乐观情景
          low: 1500
          high: 2300
          unit: USD M
    approximationNotes: 区间代表当前证据下可能出现的企业价值或股权结果，不是正式的折现现金流输出。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Visby 在品类创建和产品验证上得分不错，但按当前估值看，证据质量和入场纪律明显更弱。
    data:
      items:
        - label: 市场机会
          value: 8 / 10
          detail: 大型 STI 和即时分子检测市场，支撑真实的上行空间。
        - label: 监管 / 产品验证
          value: 8 / 10
          detail: 多项 FDA 获批和 De Novo 领先地位，降低纯科学风险。
        - label: 分销 / 工作流
          value: 7 / 10
          detail: Google Cloud、Optum、Everlywell、Quest 和 Labcorp 拓宽访问入口。
        - label: 经济性可见度
          value: 4 / 10
          detail: 收入质量、毛利率和报销证明仍然稀少。
        - label: 竞争护城河
          value: 6 / 10
          detail: 先发地位和技术诀窍有帮助，但大型既有玩家仍能回应。
        - label: 融资不对称
          value: 4 / 10
          detail: 2022 年以来估值持平，优先权条款不透明，削弱投资信心。
        - label: 估值纪律
          value: 4 / 10
          detail: 当前价格要求更强的证据支撑，而目前公开证据还不够。
    approximationNotes: 评分按章节给出，锚定已引用证据，供投资委员会初筛。
    claimRefs:
      - CV004
      - CV009
      - CV010
      - CV018
      - CV021
      - CV022
      - CV024
      - CV039
      - CV041
      - CV042
