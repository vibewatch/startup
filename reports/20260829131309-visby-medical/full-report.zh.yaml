  - id: TM001
    title: 市场定义表
    columns:
      - 市场细分
      - 定义
      - Visby 相关性
      - 估算（2025）
      - 置信度
    rows:
      - - 家用 OTC STI 检测
        - 消费者自购、在家完成的 STI 检测，覆盖设备端出结果和整合护理流程。
        - 女性 OTC PCR 获批并上市后，当前主打品类。
        - 全球 ~US$3.0B
        - 低-中
      - - 临床 POC 分子诊断
        - 医院、医生办公室、诊所和急症护理场景中的近患者分子检测。
        - Visby 传统平台的核心品类，对呼吸道和未来临床工作流仍有意义。
        - 全球 US$4.3B
        - 中
      - - 家用呼吸道 PCR
        - 消费者在家操作的呼吸道病原体分子检测，如流感和 COVID-19。
        - Visby 2026 年家用流感 / COVID PCR 获准后新打开的相邻市场。
        - 公开资料没有干净的 2025 年独立数字
        - 低
      - - 远程医疗赋能的诊断工作流
        - 家用检测购买后接入线上问诊、结果解读、处方和就医分流。
        - 它更像 Visby 的采用助推器，不是独立检测项目 TAM。
        - 2030 年远程医疗 US$140B（相邻）
        - 低-中
      - - 更广义 STI 诊断
        - 实验室、诊室和中心化诊断支出，超出纯家庭检测。
        - 可作背景参考，但口径过宽，未经调整不能当作 Visby 的主 TAM。
        - 显著大于家庭检测细分市场
        - 低
    notes: 定义先拆开检测技术和护理地点，避免把有重叠的分析师估算机械相加。
