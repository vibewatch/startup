      - number: '2.3'
        title: 买方分层与购买动态
        blocks:
          - type: paragraph
            body: >-
              Visby
              最直接的买方，是重视隐私、可能有症状或想快速得到答案、又不愿预约诊所就诊的女性消费者。在这个流程里，买方、使用者和支付者实际上是同一个人，价值主张是速度、隐私，以及能够从家中完成从结果到治疗的转化。因此，远程医疗平台和电商合作伙伴并不是边缘渠道；它们是产品化购买旅程的一部分，因为它们降低了从识别症状、购买检测、解读结果到拿到处方之间的摩擦。临床即时检测买方则不同。医院、急诊护理中心和医生诊所更关心流程适配、报销和员工操作简便性，而不是消费者品牌。这种差异有助于解释，为什么
              Visby 虽然仍拥有即时检测资产，却更用力押注 OTC。公共卫生部门和药房主导分发仍是可能的放量渠道，但当前公开记录对消费者和远程医疗分发的支撑更强，对已点名的政府采购或广泛零售货架动销的支撑较弱。
