  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Visby 当前的主打产品并不是切入一条成熟的报销或执法路径，而是在参与定义这条路径。最能降风险的事实是，FDA 确实批准了首个面向衣原体、淋病和滴虫的居家检测，以及首个 OTC PCR
              性健康产品；但正是这份新颖性，也带来了承保不确定性。未来面向呼吸道感染、咽喉痛、尿路感染和其他常见疾病的检测项目，仍要各自提交申请，所以既有授权不能一把抹平整条路线图的监管负担。De Novo
              分类也有两面性：它验证了这个品类，强化了 Visby 的先发叙事；但后来的进入者不会再面对完全相同的首创品类负担。法律风险也不止准确性。Visby
              自己的隐私和条款页面显示，这套流程横跨网站、App、设备、实验室分析、服务商、就医转接，以及对仲裁敏感的消费者互动。居家 STI
              产品里，隐私、泄露响应、标签纪律和上市后信号管理都属于核心监管命题，而不是外围合规工作。
