      - number: '8.4'
        title: 情景分析：乐观、基准和悲观
        blocks:
          - type: paragraph
            body: >-
              Visby 的乐观情景很容易解释，即便还没有被证明。如果女性 STI 检测建立起耐久的消费者品类，如果男性版本获批，如果呼吸道作为第二条 OTC 产品线跑出规模，并且制造经济性改善，Visby
              就能从单次发布故事，变成更广的居家分子平台。只按市场数学，拿下所引终局居家 STI 市场 5% 份额，就等于在加入呼吸道或相邻检测前先有约 $295M 收入。因此，平台级乐观情景可以在 5-6x 收入倍数下支撑约
              $1.5B 到 $2.3B。基准情景没那么慷慨，而且在这组证据里更可信：到 2028 年收入只到 $100M 到 $150M，报销仍然零散，新产品有贡献但不足以彻底改造模型。按 4-5x 收入，价值只有约
              $400M 到 $750M。悲观情景严厉但合理。如果 $149.99 价格点让需求停留在小众，如果报销始终没有拓宽，或者更大的诊断玩家压低价格，Visby 可能只是一个 $50M 收入公司，只配 2-3x
              销售额，价值约 $100M 到 $150M。换句话说，当前下行比眼前上行更容易看见。
