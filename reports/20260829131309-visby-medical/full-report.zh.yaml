      - - 股权结构表、清算优先权和投资者权利
        - 多年融资后估值持平，可能掩盖沉重优先权悬挂
        - 高
        - 在 NDA 下取得股权结构表、章程、附函和最新融资文件
      - - 呼吸道产品上市表现和男性 STI 时间表
        - 上行情景不只靠一个 SKU
        - 高
        - 索取监管日程、生产计划、上市 KPI 和渠道承诺
      - - 备用制造与召回准备计划
        - 单一场地或质量风险摧毁股权价值的速度可能快过需求落空
        - 中高
        - 核查应急产能、QA 升级、供应商集中度和保险覆盖
    notes: 每项待核实事项都连着一个估值变量，对投资建议的影响可能超过再补一轮高层叙事。
    claimRefs:
      - CV018
      - CV019
      - CV021
      - CV023
      - CV035
      - CV041
      - CV042
