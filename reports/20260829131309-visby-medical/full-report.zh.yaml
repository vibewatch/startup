      - number: '2.2'
        title: 市场规模与增长预测
        blocks:
          - type: paragraph
            body: >-
              在最可辩护的自上而下口径下，MarketsandMarkets 估计全球现场即时分子诊断市场为 2025 年 US$4.30 billion、2030 年 US$7.09 billion；Future
              Market Insights 给出的长期框架更大，为 2025 年 US$5.3 billion、2026 年 US$5.8 billion、2036 年 US$15.1
              billion。两家机构的数据批次和预测期限不同，但都支持快速分子检测拥有持久的 10% 增长曲线。Grand View Research 给出了更窄的消费者口径，估计居家 STI 检测市场在 2024 年约
              US$1.2-1.42 billion、2025 年约 US$3.0 billion、2033 年约 US$5.9 billion；不过本次报告无法直接复核其方法论，因为页面返回了 403
              机器人挑战。北美看起来约占 Visby 关注的关键市场的 40-45%，这让美国自然成为首发地理市场。呼吸道检测增加了第二条居家使用路径，但证据显示，短期内更应把它看成相邻机会和期权价值，而不是可以干净相加的
              TAM。
