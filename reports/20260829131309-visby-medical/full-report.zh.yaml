        title: 定价与报销动态
        blocks:
          - type: paragraph
            body: >-
              公司公开定价姿态有一个反差：标价异常清楚，实际成交价异常不透明。Visby 和经销商页面显示，女性 OTC 检测价格为 $149.99，支持
              HSA/FSA，并在阳性结果后提供当日远程医疗；但它们没有披露经销商抽成、优惠券、退款，或各渠道实际变现客户占比。管理层对 360Dx 的说法是，如果计入共付额、交通、采样和实验室处理，约 $150
              相比急诊护理或急诊室路径有折扣，也与实验室费用表大致相当。这一定位解释了公司为何能在一个带有污名的品类里尝试高价自费策略。更难的问题是报销。在已审阅来源中，Visby 强调自费便利性、远程医疗和 HSA/FSA
              税优使用，而不是 OTC 产品的常规保险报销。因此，价格弹性、支付方接受度和每盒实现净收入仍是关键尽调项，而不是已经解决的经济性。
