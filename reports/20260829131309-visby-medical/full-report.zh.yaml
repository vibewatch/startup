      - number: '5.3'
        title: 工作流、使用场景与交付模型
        blocks:
          - type: paragraph
            body: >-
              最重要的产品洞察是，Visby 卖的不只是检测性能，而是时间压缩和护理连续性。在诊所里，承诺很直接：患者可以自行采样，设备以极少手动操作在不到 30
              分钟内运行完成，临床医生能在同一次接诊中完成检测、沟通和治疗。到了家中，流程从可视化的临床场景转为应用承载的消费者旅程。用户购买套装，按照应用内指引操作，运行带电测试，收到应用推送结果，然后可以连接远程医疗或继续分享结果。应用商店列表、Visby
              应用页面、FAQ 和合作伙伴页面都强化了这一点：软件触点是产品契约的一部分，不是营销附件。因此，流程横跨实体诊断、结果解读和护理导航。表 TE002 展开居家、临床和可及性项目场景下的主要用户任务，图 FE002
              则把 OTC 旅程转成明确的运营流程。
