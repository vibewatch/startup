            title: 临床暂停抬高短期集中度风险
            body: >-
              历史临床证言显示，Visby 在急诊护理和女性健康场景中具有真实流程价值；但公司为了聚焦 OTC，暂时暂停了新的临床即时检测销售。这个决定可能具有战略合理性，却会让短期客户多元化围绕一个旗舰消费者 SKU
              和少数中介进一步收窄。
