      - number: '1.5'
        title: 战略转向、里程碑与未解缺口
        blocks:
          - type: paragraph
            body: >-
              当前记录中最重要的战略变化，是 2025 年转向 OTC 和居家检测。独立报道显示，Visby
              暂停了临床即时检测销售，以便把资源集中到消费者发布上；商业负责人则强调，退出医疗服务方渠道只是暂时而非永久。Google Cloud 支持的应用和远程医疗流程解释了管理层为何做出这种取舍：OTC
              交付不只是换包装，而是更高触达的数字服务模型，可以把阳性结果转化为当天指导和治疗入口。


              这次转向踩在有利的需求背景上。HIV.gov 对 CDC 2024 年 STI 数据的总结，凸显了持续疾病负担，让快速、私密的 STI
              检测具备商业意义。同时，公司概况记录仍有重大盲点：没有准确当前收入、没有准确当前员工数、没有公开股权结构表机制，也没有何时重启现场即时检测销售的详细路线图。里程碑曲线显然向好，但尽调重点现在已经从证明技术新颖性，转向证明可重复的商业经济性和渠道耐久性。
