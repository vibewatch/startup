      - number: '6.4'
        title: 留存、复用与耐久性
        blocks:
          - type: paragraph
            body: >-
              耐久性是 Visby 公开客户证据中最薄弱的一环。已审阅来源没有披露净收入留存、总收入留存、复购频率、续约率、订阅用户数或分渠道复用。这很重要，因为 STI
              检测往往是事件驱动，而非天然订阅型：一个消费者可能只在紧急时需要一次，另一个消费者则可能因为复查筛查、新伴侣或反复担忧而重复购买。公司显然试图靠私密
              应用结果、远程医疗和快速配送来提高完成率和满意度，官方产品评价也强调隐私和易用性。EasySTD
              的独立评测同样称赞速度和隐私，但指出感染覆盖有限、只面向女性以及自费成本相对较高。这些保留让人很难仅凭产品热度推断复购行为。目前，公开记录支持的是一种可能的客户体验优势，而不是首购会转化为耐久队列或低流失关系的证明。
