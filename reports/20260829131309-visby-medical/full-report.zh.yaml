            body: >-
              Visby 的路线图有吸引力，恰恰因为公司已经证明平台可以从诊所跨到家庭；但同样的扩张也暴露了集中的依赖。当前产品路径从临床性健康走向 OTC
              性健康，再到呼吸道，然后是男性检测和更广感染病菜单。数字侧，Visby 正在把 Google Cloud 基础设施、应用商店 分发、远程医疗路由，以及已宣布的 Gemini-on-Vertex-AI
              路线图叠到硬件平台之上。资金侧，BARDA 仍是呼吸道开发的重要推手。与这些上行空间相对，公开记录仍显示公司只有 San Jose 一个制造基地、供应商冗余能见度有限、公开 终端动销指标稀疏，并且在打造 OTC
              品类期间做出了暂停部分临床销售爬坡的战略决定。表 TE005 排列了路线图，图 FE003 则绘出依赖图；在假设无摩擦放量前，投资者最该对这些依赖做深入尽调。
