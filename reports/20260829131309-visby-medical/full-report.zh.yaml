      - number: '3.4'
        title: 差异化耐久性与护城河分析
        blocks:
          - type: paragraph
            body: >-
              Visby 的护城河真实存在，但比一句“唯一的居家 PCR”口号更窄，也更依赖执行。最强的要素仍是整合式产品架构：消费者可以自行取样，运行无仪器分子流程，约 30
              分钟拿到应用解读的结果，并在不去诊所的情况下进入远程医疗或治疗跟进。这与 Roche、Cepheid、Abbott 或 Labcorp
              都有实质差别，后者仍需要配备仪器的诊疗场所，或需要离机实验室。第二层防御来自监管和制造执行。Visby 已经跨过首个 FDA 居家 STI 门槛，募集了大量资本，并称其在 San Jose
              运营高度自动化制造。第三层是渠道设计。引用来源显示，公司已有消费者电商分发和远程医疗联动；这很重要，因为 OTC
              分子检测的品类创建，部分是物流和教育问题。这几层合在一起，为未来几年形成可信护城河，即便不能排除既有企业日后反击。
