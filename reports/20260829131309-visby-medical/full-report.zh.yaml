      - number: '3.5'
        title: 竞争风险与战略情景
        blocks:
          - type: paragraph
            body: >-
              悲观情景很直接。Visby 当前菜单仍比机构多重检测玩家窄得多，而公司在更大既有企业每天都在市场中销售时，暂时后撤了主动临床销售。如果 Abbott、Roche 或 Cepheid
              更积极推进居家分子检测，它们可以把品牌信任、报销经验和既有渠道关系组合起来，形成风险投资支持的专科公司难以轻易匹敌的优势。快速跟进者也不必复刻 Visby
              的确切形态才能施压；Aptitude、Scout、Detect 和 OraSure 表明，更便宜或设计不同的分子及快速检测路径，仍可以争夺同一批消费者或临床医生注意力。与此同时，Labcorp 和 Quest
              仍是强大的现状替代方案，因为当保险覆盖、医生熟悉度或实验室多重面板比速度更重要时，许多消费者仍会接受延迟的实验室结果。更平衡的判断是：Visby
              拥有一个差异化切入口，且具备真正战略价值；但在把它承销为持久品类垄断前，这个切入口必须靠菜单扩张和无瑕渠道执行进一步拓宽。
