      - number: '1.4'
        title: 资本、规模与渠道足迹
        blocks:
          - type: paragraph
            body: >-
              Visby 需要风险投资级别的资本，才能搭建并获批一次性 PCR 平台。公开市场数据资料显示，融资从 2015 年 $16M B 轮开始，随后有 $9.52M 扩展轮、2019 年 $101M C 轮、2020
              年 $70M D 轮、2022 年 $100M E 轮加 $35M 扩展轮，并叠加 BARDA 和 NIH 资助。2025 年 6 月的 Series F 又新增 $55M，可扩至 $65M，据报道估值
              $1B，并让 Catalio 成为领投方。合在一起，公开记录支撑一个判断：Visby 是一家重资本投入的诊断公司，而不是一个轻资产试剂盒品牌。


              与融资相比，规模能见度弱得多。第三方资料估计公司约有 200 名员工、当前收入约 $35M，但这些数字并未得到公司确认。更清晰的是渠道宽度。Optum Now、Everlywell 和 Fisher
              Scientific 页面展示了外部分发触点，公司材料还点名 Quest Diagnostics、LabCorp、Wisp、DoorDash、GoPuff 和 RAINN 等渠道。这个组合说明 Visby
              已经具备真实的商业触达能力，但还没有达到可消除尽调风险的经审计商业披露水平。
