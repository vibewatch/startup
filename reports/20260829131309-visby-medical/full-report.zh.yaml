      - number: '6.5'
        title: 获客策略与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Visby
              的获客策略似乎把诊断、分发和治疗协调当成一个整合的消费者流程。公司营销的是隐私、速度和当日行动，而不是商品化实验室检测；随后用合作伙伴移除运营摩擦：即时商务负责配送，远程医疗负责结果后护理，数字市场负责发现。这种设计可能提升有症状或焦虑用户的转化，因为他们看重紧迫性；但它也把客户集中风险从单一大型临床账户，转移到相对少数的平台和中介上。正面是多个合作伙伴带来多元化，而不是依赖单一店面。负面是
              Visby 没有披露按合作伙伴划分的收入组合，投资者无法判断是一两个渠道主导经济性。2025 年 7
              月暂停临床即时检测销售，则进一步放大了这种不确定性；尽管历史临床证言很强，短期渠道多元化仍被削弱。扩展到呼吸道检测和男性性健康产品，未来可能加深现有合作伙伴钱包份额；但今天的客户模型仍围绕一个旗舰 OTC SKU
              高度集中。Visby 也在尝试成本更低的数字获客：其联盟注册页面明确招募网站、社交渠道和数字平台按佣金推广产品；FAQ 和应用页面则用于降低用户上手摩擦，尤其是焦虑、暴露风险或无症状用户。
