      - number: '7.4'
        title: 竞争和团队 / 执行风险
        blocks:
          - type: paragraph
            body: >-
              Visby 的监管先发位置不应被误读为长期隔离带。Roche 已经有获批并获得 CLIA 豁免、面向机构场景的分子 STI 检测；Cepheid 的公开菜单也覆盖 CT/NG、Trichomonas、流感和
              SARS-CoV-2。这意味着 Visby 想切入的几乎每个相邻扩张领域，都已经有资源更强、带装机工作流入口的分子诊断在位者。公司内部的运营挑战也不只是多做需求生成。Visby
              正从临床医生主导的即时检测销售，转向消费者电商、远程医疗转化、支持运营和配送伙伴编排。公开履历仍把外部信任集中在创始人兼 CEO Adam de la Zerda 和 CMO Gary Schoolnik
              身上，而 2025
              年董事会更新明确加入了制造和成本效率经验。这一步合理，但也说明消费诊断业务的规模化仍是活的执行问题。公开记录显示团队有很强的医疗科技和临床资历，却没有显示可见领导层拥有全国性消费诊断规模化的长期公开战绩。
