companyProfile:
  summary: >-
    Visby Medical（原名 Click Diagnostics）是一家总部位于加州圣何塞的分子诊断公司，由 Adam de la Zerda 博士于 2012 年 12 月创立。公司发明了全球首个无仪器、一次性 PCR
    平台，可在用户掌心大小的设备里，用不到 30 分钟给出实验室质量的结果。经过十多年开发和验证一次性 PCR 芯片技术，Visby 于 2025 年 3 月取得里程碑式的 FDA De Novo 授权，推出首个用于性传播感染的 OTC
    居家 PCR 检测；随后又在 2026 年 7 月获得居家 Flu/COVID-19 PCR 检测的 FDA 许可。公司于 2025 年 6 月完成 $55M F 轮融资，投后估值 $1 billion，商业重心已完全转向消费者
    OTC 诊断市场，并借助 DoorDash、Everlywell、Quest Diagnostics、 LabCorp、Wisp、RAINN 等合作伙伴分发，同时借助 Google Cloud 和 Optum Now 接入远程医疗。
  foundedDate: '2012-12-01'
  founders:
    - name: Adam de la Zerda, PhD
      role: 创始人兼 CEO
      background: 以色列出生的 Stanford School of Medicine 副教授；约 2010 年在 Artiman Ventures 构想出无仪器 PCR 概念；自公司创立以来一直掌舵；存在关键人物依赖。
      claimRefs:
        - CO010
