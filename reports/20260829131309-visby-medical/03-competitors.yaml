- id: competitive-risks-and-strategic-scenarios
  title: Competitive risks and strategic scenarios
  body: The bear case is straightforward. Visby's current menu is still much narrower than institutional multiplex players, and the company has temporarily stepped back from active clinical selling while larger incumbents remain in-market every day. If Abbott, Roche, or Cepheid pursue home molecular testing more aggressively, they can combine brand trust, reimbursement know-how, and established channel relationships in ways a venture-backed specialist cannot easily match. Fast followers also do not need to reproduce Visby's exact format to pressure it; Aptitude, Scout, Detect, and OraSure show that cheaper or differently designed molecular and rapid-testing paths can still compete for the same consumer or clinician attention. At the same time, Labcorp and Quest remain powerful status-quo substitutes because many consumers will still accept a delayed lab answer when insurance coverage, physician familiarity, or multiplex lab panels matter more than speed. The most balanced judgment is therefore
    that Visby owns a differentiated wedge with genuine strategic value, but that wedge must broaden through menu expansion and flawless channel execution before it should be underwritten as a durable category monopoly.
