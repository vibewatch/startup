chapter:
  number: 3
  title: Competitors
  summary: Visby Medical has a real competitive wedge because it is the cited first FDA-authorized home PCR STI workflow and has now added a home respiratory PCR adjacency, but the moat is narrower than the total molecular-diagnostics market. Roche is the closest clinic STI rival, Cepheid and Abbott remain major incumbent benchmarks, BioFire dominates menu breadth in institutions, and Labcorp plus Quest remain powerful status-quo substitutes. The strongest evidence supports viewing Visby as a differentiated OTC specialist whose durability depends on workflow, distribution, and manufacturing execution before larger incumbents or adjacent challengers compress the lead.
sections:
- id: competitive-landscape-overview
  title: Competitive landscape overview
  body: 'Visby Medical no longer sits in one clean competitive box. Since the company paused new clinical point-of-care sales to concentrate on over-the-counter home testing, the most relevant near-term battlefield is consumer molecular diagnostics, not the entire hospital PCR market. That shift matters because Visby now competes simultaneously against three distinct groups: home-use molecular challengers such as Aptitude, Scout, Detect, and adjacent OraSure offerings; instrument-based point-of-care incumbents such as Cepheid, Abbott, and Roche; and status-quo central-lab workflows from Labcorp and Quest. BioFire matters less as a direct shelf-level rival and more as evidence of what sophisticated buyers can already get in institutional settings if breadth matters more than portability. The company still owns a meaningful first-mover position because the FDA identified Visby as the first home test for chlamydia, gonorrhea, and trichomoniasis, but that lead now has to be defended with workflow,
    channel access, and manufacturing execution rather than science alone.'
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP005
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: direct-competitors-and-closest-alternatives
  title: Direct competitors and closest alternatives
  body: The closest direct comparison depends on the buyer and care setting. For clinic-based sexual-health testing, Roche is the sharpest overlap because its January 2025 STI clearances brought chlamydia, gonorrhea, and mycoplasma genitalium onto a fast, CLIA-waived point-of-care PCR platform. Cepheid remains an important benchmark because Xpert CT/NG addresses the same pathogens and supports same-visit clinical action, but it still relies on a GeneXpert instrument and a longer time to result. Abbott ID NOW is faster on respiratory assays and has deep point-of-care placement, yet the reviewed menu centers on flu, COVID-19, RSV, and strep rather than STI testing. On the home-molecular side, Aptitude is the most credible consumer-side adjacency because it already has authorized home and point-of-care molecular respiratory testing, while Scout and Detect show how smaller developers are trying to remove the same speed-versus-accuracy tradeoff with portable molecular workflows. OraSure is best
    understood as a sexual-health adjacency with OTC and CLIA-waived infectious-disease distribution muscle, not as a direct PCR peer today.
