- id: differentiation-durability-and-moat-analysis
  title: Differentiation durability and moat analysis
  body: 'Visby''s moat is real, but it is narrower and more execution-dependent than a simple ''only PCR at home'' slogan suggests. The strongest element is still the integrated product architecture: a consumer can self-swab, run an instrument-free molecular workflow, get an app-interpreted result in about 30 minutes, and move into telehealth or treatment follow-up without visiting a clinic. That is meaningfully different from Roche, Cepheid, Abbott, or Labcorp, each of which still requires either an instrumented care site or an off-device laboratory. The second layer of defensibility comes from regulatory and manufacturing execution. Visby has already crossed the first FDA home-STI threshold, raised substantial capital, and says it operates highly automated manufacturing in San Jose. The third layer is channel design. Cited sources show consumer-commerce distribution and telehealth linkage, which matter because category creation in OTC molecular testing is partly a logistics and education
    problem. Those layers together create a credible moat for the next few years, even if they do not eliminate future incumbent response.'
  claimRefs:
  - CP003
  - CP004
  - CP034
  - CP035
  - CP036
  - CP037
  - CP041
