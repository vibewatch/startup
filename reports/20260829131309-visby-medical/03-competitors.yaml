  evidenceGaps:
  - type: missing-source
    severity: material
    topic: instrument-economics
    missingEvidence: Public instrument price cards, service contracts, and realized cartridge economics for Cepheid, Abbott, Roche, and BioFire in comparable care settings.
    whyItMatters: Exact equipment economics determine whether Visby's consumer price premium is offset by lower capital intensity or whether clinic buyers still favor installed systems.
    diligencePath: Request reseller quotes, distributor contracts, or procurement records from clinics using GeneXpert, ID NOW, cobas liat, and FilmArray.
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: otc-sell-through-vs-competition
    missingEvidence: Sell-through, reorder, CAC, and conversion data showing how Visby performs against labs, telehealth substitutes, and adjacent home-molecular entrants in the field.
    whyItMatters: Without real cohort and conversion data, it is difficult to know whether the moat is translating into durable commercial share or only first-purchase novelty.
    diligencePath: Request channel dashboards from Everlywell, Quest, Optum, and management with repeat purchase, fulfillment, and telehealth conversion metrics.
  - type: private-evidence-only
    severity: minor
    topic: incumbent-otc-roadmaps
    missingEvidence: Internal roadmaps or market-intelligence evidence showing whether Abbott, Roche, Cepheid, or BioFire are actively building or piloting OTC molecular sexual-health products.
    whyItMatters: The durability of Visby's lead depends partly on how quickly scaled incumbents decide to pursue the same category with stronger channels and reimbursement experience.
    diligencePath: Ask management and channel partners for competitive-intelligence briefs and monitor new FDA submissions and industry conference disclosures.
