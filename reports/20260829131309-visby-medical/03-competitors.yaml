- id: incumbent-threats-and-adjacent-players
  title: Incumbent threats and adjacent players
  body: 'The most serious long-run risk to Visby is not that another startup copies the product brochure, but that large incumbents decide the OTC molecular category is commercially attractive enough to pursue with far more distribution leverage. Abbott, Roche, and Cepheid already own trusted molecular brands, regulatory teams, installed instruments, and clinical relationships. BioFire shows a different version of the same problem: hospitals already buy a premium multiplex workflow when they value menu breadth and pathogen coverage more than portability. Mordor Intelligence''s company list reinforces that Visby operates next to a heavyweight PCR ecosystem, not in a white space. That does not make Visby irrelevant; it does mean the company cannot assume that being first at home automatically translates into durable dominance once incumbents notice the category. The temporary pause in clinical sales also increases the risk that professional accounts will standardize elsewhere while Visby focuses
    on consumer channel building.'
  claimRefs:
  - CP012
  - CP013
  - CP014
  - CP031
