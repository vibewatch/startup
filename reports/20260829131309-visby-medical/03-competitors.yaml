- id: FP001
  title: Competitive positioning map
  type: quadrant
  layout: wide
  summary: Visby leads the reviewed field on portability, while BioFire and the major point-of-care incumbents lead on institutional menu breadth or installed-channel power.
  data:
    xAxis:
      label: Instrument independence / portability (0-10 ordinal)
    yAxis:
      label: Menu breadth / incumbent reach (0-10 ordinal)
    points:
    - label: Visby
      x: 10
      y: 5
      detail: Highest home portability and no separate instrument, but still a comparatively narrow current menu.
      tone: positive
    - label: Cepheid
      x: 3
      y: 8
      detail: Instrument-based workflow but broad clinical presence and strong STI and respiratory relevance.
      tone: neutral
    - label: Abbott ID NOW
      x: 4
      y: 7
      detail: Portable clinical instrument with very fast respiratory assays and large distribution reach.
      tone: neutral
    - label: BioFire FilmArray
      x: 1
      y: 10
      detail: Lowest portability but the broadest multiplex capability in the reviewed set.
      tone: warning
    - label: Roche cobas liat
      x: 3
      y: 8
      detail: Strong STI and respiratory overlap with fast PCR, still anchored to near-patient instrument use.
      tone: neutral
    - label: Aptitude Metrix
      x: 7
      y: 4
      detail: Home molecular adjacency with easier economics, but current public overlap is respiratory not STI.
      tone: positive
    - label: Nuclein DASH
      x: 4
      y: 3
      detail: Small-footprint PCR competitor with limited documented consumer reach.
      tone: neutral
    - label: Scout
      x: 6
      y: 3
      detail: Portable molecular concept for clinics with narrower visible proof than incumbents.
      tone: neutral
    - label: Detect
      x: 8
      y: 2
      detail: Consumer-oriented molecular concept remains earlier stage and still developing its women's-health application.
      tone: warning
    - label: Labcorp / Quest
      x: 2
      y: 9
      detail: Weak portability but very strong status-quo network presence and broad lab testing options.
      tone: warning
