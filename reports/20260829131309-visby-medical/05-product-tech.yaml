- id: workflow-use-cases-and-delivery-model
  title: Workflow, use cases, and delivery model
  body: 'The most important product insight is that Visby sells time-compression and care-continuity, not only assay performance. In clinics, the promise is straightforward: a patient can self-collect, the device runs in under 30 minutes with minimal hands-on time, and the clinician can test, talk, and treat during the same encounter. At home, the workflow shifts from a visual clinical context to an app-mediated consumer journey. The user buys the kit, follows in-app instructions, runs the powered test, receives an app-delivered result, and can then connect to telehealth or share results onward. App-store listings, Visby’s app page, FAQ, and partner pages all reinforce that the software surface is part of the product contract, not a marketing accessory. The workflow therefore spans physical diagnostics, result interpretation, and care navigation. Table TE002 lays out the main user jobs across home, clinical, and access-program contexts, and Figure FE002 turns the OTC journey into an explicit
    operating flow.'
  claimRefs:
  - CE005
  - CE015
  - CE016
  - CE017
  - CE018
  - CE021
  - CE030
