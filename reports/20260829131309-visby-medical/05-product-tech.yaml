- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: The OTC journey links purchase, assay execution, result delivery, and care-routing into one consumer-controlled loop.
  approximationNotes: This figure models the most explicit public OTC path; exceptions such as refunds, invalid tests, or in-person physician fallback are omitted for clarity.
  data:
    nodes:
    - id: n1
      label: Acquire kit
      detail: User buys the test directly or through a partner channel such as Optum Now or other ecommerce pathways.
    - id: n2
      label: Collect sample
      detail: User follows instructions to self-collect the sample associated with the product.
    - id: n3
      label: Run powered disposable PCR
      detail: The cartridge and powered device execute the molecular assay in about 30 minutes.
    - id: n4
      label: Receive guided result
      detail: The app synchronizes timing and displays or helps interpret the result.
    - id: n5
      label: Connect to care if needed
      detail: Positive users can move into telehealth or share results with another clinician.
    - id: n6
      label: Treatment or next step
      detail: User receives treatment guidance, a prescription pathway, or follow-up instruction.
