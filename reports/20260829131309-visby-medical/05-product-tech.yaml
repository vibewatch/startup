chapter:
  number: 5
  title: Product and Technology
  summary: Visby Medical now has a coherent PCR platform spanning legacy clinical point-of-care devices and newer at-home OTC products. The core asset is a palm-sized, single-use, instrument-free PCR cartridge-and-power architecture that compresses molecular testing into an under-30-minute workflow, while the newer app layer, Google Cloud infrastructure, and telehealth links turn that assay into a test-to-treatment experience. Public evidence is strongest on regulatory validation, workflow differentiation, and category-first positioning; it is weakest on component redundancy, detailed cloud/security architecture, and unit economics at scale.
