- id: roadmap-dependencies-and-technical-risks
  title: Product roadmap, dependencies, and technical risks
  body: Visby’s roadmap is promising precisely because the company has already shown the platform can cross from clinic to home, but that same expansion exposes concentrated dependencies. The current product arc moves from clinical sexual-health to OTC sexual health, then to respiratory, then to a men’s test and broader infectious-disease menu. On the digital side, Visby is layering Google Cloud infrastructure, app-store distribution, telehealth routing, and an announced Gemini-on-Vertex-AI roadmap on top of the hardware platform. On the funding side, BARDA remains an important enabler for respiratory development. Against that upside, the public record still shows a single manufacturing site in San Jose, limited visibility into supplier redundancy, sparse published sell-through metrics, and a strategic decision to pause part of the clinical sales ramp while building the OTC category. Table TE005 sequences the roadmap and Figure FE003 maps the dependency graph that investors should diligence
    hardest before assuming frictionless scale.
