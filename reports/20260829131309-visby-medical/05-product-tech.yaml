  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Manufacturing yield, cartridge cost, and line throughput remain undisclosed
    missingEvidence: Public sources describe fully automated manufacturing and future cost reduction, but they do not disclose scrap rates, yields, capacity per line, or unit economics by SKU.
    whyItMatters: For a disposable molecular-diagnostics company, cost-down curve and manufacturing throughput are central to gross margin durability and ability to support lower-price channels.
    diligencePath: Request line-capacity, yield, scrap, throughput, and COGS trend data by product generation plus contingency plans for demand spikes.
    relatedQuestionRefs:
    - QE010
    - QE018
    - QE022
  - type: private-evidence-only
    severity: material
    topic: Detailed cloud-security and privacy architecture is not publicly inspectable
    missingEvidence: The public record supports secure access, confidential results, and Google Cloud infrastructure, but it does not expose HIPAA architecture, audit posture, encryption design, or incident-response commitments.
    whyItMatters: The app is part of the regulated care workflow for OTC products, so security and privacy failures could damage brand trust and attract regulatory scrutiny.
    diligencePath: Request HIPAA program details, vendor list, audit reports, data-retention policy, and security architecture for app, result storage, and telehealth handoff.
    relatedQuestionRefs:
    - QE017
    - QE021
    - QE025
  - type: private-evidence-only
    severity: material
    topic: Supplier redundancy for disposable PCR components and power accessories is not public
    missingEvidence: The public materials do not identify critical microfluidic, reagent, plastics, electronics, or adapter suppliers or whether qualified second sources exist.
    whyItMatters: Single-source inputs could create stockout risk precisely when Visby is trying to scale both seasonal respiratory demand and consumer OTC adoption.
    diligencePath: Request supplier concentration map, dual-source status, safety-stock policy, and component lead-time assumptions.
    relatedQuestionRefs:
    - QE010
    - QE016
  - type: missing-source
    severity: minor
    topic: Public sell-through and activation metrics for the OTC channel remain sparse
    missingEvidence: Public sources show the app, channel partners, and product launches, but not unit sales, app activations, completion rates, or telehealth conversion by channel.
    whyItMatters: Without adoption telemetry it is difficult to determine whether category-first regulatory wins are translating into efficient, repeatable consumer demand.
    diligencePath: Request sell-through, app-activation, completion, positivity, and telehealth-conversion data by DTC, partner, and clinical channel.
    relatedQuestionRefs:
    - QE013
    - QE020
sections:
- id: platform-technology-and-architecture
  title: Platform technology and architecture
  body: 'Visby Medical’s central technical asset is not a single assay but a miniaturized PCR platform that compresses core molecular-diagnostics functions into a palm-sized disposable. Public product and corporate pages consistently describe a single-use, instrument-free architecture with prepackaged chemistry and a small powered device that eliminates the need for a benchtop analyzer, service contract, or ongoing maintenance. The platform is explicitly framed as a 40-cycle PCR system, yet it still returns answers in under 30 minutes and can multiplex across more than one pathogen, which is the core reason the same base architecture can serve both sexual-health and respiratory workflows. The technology is therefore best understood as an integrated stack: specimen handling, sealed disposable chemistry, thermal cycling, readout, and then either a clinical or consumer interface. Table TE003 breaks that stack into operating layers, while Figure FE001 shows how the assay layer, digital layer,
    and manufacturing backbone fit together as one system rather than disconnected products.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE015
  - CE019
  - CE039
  - CE040
  - CE041
  tableRefs:
  - TE003
  figureRefs:
  - FE001
- id: product-portfolio-and-regulatory-status
  title: Product portfolio and regulatory status
  body: 'Visby now has a visible portfolio ladder rather than a one-product story. The legacy base is the 2021 first-generation women’s sexual-health point-of-care test, followed by the 2023 Gen 2 clinical version that simplified operation and moved toward fully automated manufacturing. The portfolio then widened in 2025 with two different regulatory wins: a February 2025 510(k) clearance plus CLIA waiver for the respiratory clinical product, and a March 2025 De Novo for the at-home women’s sexual-health OTC product that created the first home-use OTC PCR classification for any indication. In July 2026 Visby added the first OTC multi-viral at-home PCR for flu A, flu B, and SARS-CoV-2. The next public step is the men’s sexual-health submission, while sore-throat, UTI, and AI-enabled guidance remain developmental. Table TE001 enumerates the visible products and channels, and Figure FE004 scores maturity by product line so the difference between authorized, launching, and pipeline assets is
    explicit rather than implied.'
  claimRefs:
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
