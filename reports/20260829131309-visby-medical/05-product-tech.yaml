  - - Result sharing with outside physician
    - Consumer + external clinician
    - Complete test -> download/share result -> present result to personal physician or telehealth provider
    - Same day
    - Extends usefulness beyond Visby-partner care pathways
  - - Underserved-access distribution
    - Consumer via partner program
    - Receive subsidized kit -> test privately at home -> access telehealth if needed
    - About 30 min
