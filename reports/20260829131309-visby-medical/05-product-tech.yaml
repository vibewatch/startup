  - Result time
  - Value
  rows:
  - - Same-visit STI diagnosis in clinic
    - Clinician + female patient
    - Self-collect swab -> run disposable PCR -> discuss result -> prescribe during visit
    - Under 30 min
    - Eliminates send-out lag and reduces patient callbacks
  - - Urgent-care respiratory differentiation
    - Clinician + symptomatic respiratory patient
    - Collect sample -> run respiratory cartridge -> identify flu A/B vs COVID -> choose antiviral or other care
    - Under 30 min
    - Supports treatment decisions while patient is still onsite
  - - At-home STI answer with follow-up care
    - Female consumer
    - Buy kit -> follow app guidance -> run powered test -> view result -> connect to telehealth if positive
