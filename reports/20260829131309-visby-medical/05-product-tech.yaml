- id: quality-compliance-and-trust-infrastructure
  title: Quality, compliance, and trust infrastructure
  body: Visby’s trust layer is unusually concrete for a startup because so much of its product credibility is regulatory and workflow-based. The OTC women’s product carries FDA De Novo authorization with disclosed performance metrics and a new regulatory classification; the clinical sexual-health and respiratory products carry 510(k) clearances with CLIA waivers; and the public evidence base includes distributor corroboration plus a Johns Hopkins-linked outcomes study showing faster results and better treatment appropriateness. The consumer layer adds a second trust surface through confidential-result claims, secure app access, telehealth integration, and explicit support materials such as instructions and FAQs. At the same time, public transparency stops well short of a full security or quality-management audit trail. Table TE004 separates what is actually verified from what remains uninspected, so the chapter does not confuse strong regulatory proof with complete operational visibility.
  claimRefs:
  - CE011
  - CE013
  - CE014
  - CE020
