company:
  name: Visby Medical
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Visby Medical addresses a credible but still emerging market wedge at the intersection of point-of-care molecular
    diagnostics, at-home STI testing, and at-home respiratory PCR. The strongest top-down evidence supports a US$4.3
    billion global point-of-care molecular market in 2025 growing to US$7.09 billion by 2030, while consumer at-home
    STI testing appears to be a lower but fast-growing multibillion-dollar segment with North America representing more
    than 40% share. Demand is supported by persistent STI burden, stigma-driven demand for private testing,
    post-pandemic comfort with home diagnostics, and new FDA precedent for OTC molecular testing. The key constraints
    are premium self-pay pricing, immature reimbursement, limited disclosed sell-through data, and the execution
    trade-off between scaling OTC and clinical point-of-care channels.
sections:
  - id: market-definition-and-boundaries
    title: Market definition and boundaries
    body: >-
      Visby Medical should not be analyzed as a generic diagnostics company. The company now sits at the intersection of
      three specific spending pools: consumer-purchased at-home STI testing, near-patient clinical molecular
      diagnostics, and emerging at-home respiratory PCR. The cleanest boundary is not every dollar ever spent on
      sexually transmitted disease diagnostics or respiratory testing, because those broader categories include
      centralized lab PCR, physician visits, send-out specimen handling, and other workflows that Visby does not
      capture directly. Instead, the relevant market is the spend on rapid molecular testing performed either by the
      consumer at home or by clinicians at the point of care, plus the enabling digital-care workflow that turns a
      result into treatment. This boundary matters because some third-party estimates refer to technology categories,
      while others refer to site-of-care or consumer channels. If those numbers are added together without adjustment,
      the result double-counts overlapping assay categories and makes Visby's opportunity look larger and cleaner than
      the evidence supports.
    claimRefs: [CM001, CM002, CM008, CM040, CM047]
    tableRefs: [TM001]
    figureRefs: [FM001]
  - id: market-size-and-growth-projections
    title: Market size and growth projections
    body: >-
      On the most defensible top-down lens, MarketsandMarkets places global point-of-care molecular diagnostics at
      US$4.30 billion in 2025 and US$7.09 billion by 2030, while Future Market Insights gives a somewhat larger
      long-dated frame of US$5.3 billion in 2025, US$5.8 billion in 2026, and US$15.1 billion by 2036. Those two
      sources differ in vintage and horizon, but both support a durable 10% growth profile for rapid molecular
      testing. Grand View Research provides the narrower consumer lens, estimating at-home STI testing at roughly
      US$1.2-1.42 billion in 2024, around US$3.0 billion in 2025, and about US$5.9 billion by 2033, though that
      methodology could not be reviewed directly during this run because the page returned a 403 bot challenge. North
      America appears to represent roughly 40-45% of the key markets Visby cares about, which makes the U.S. the
      natural launch geography. Respiratory testing adds a second home-use lane, but the evidence suggests it should be
      viewed as adjacency and option value rather than cleanly additive near-term TAM.
    claimRefs: [CM003, CM004, CM006, CM007, CM009, CM010, CM011, CM032, CM038]
    tableRefs: [TM002]
    figureRefs: [FM002]
  - id: buyer-segments-and-purchasing-dynamics
    title: Buyer segments and purchasing dynamics
    body: >-
      Visby's most immediate buyer is the privacy-seeking female consumer who either has symptoms or wants a rapid
      answer without scheduling a clinic visit. In that workflow, the buyer, user, and payer are effectively the same
      person, and the value proposition is speed, discretion, and the ability to move from result to treatment from
      home. Telehealth platforms and ecommerce partners are therefore not side channels; they are part of the
      productized buying journey because they reduce friction between symptom recognition, test purchase, result
      interpretation, and prescription access. Clinical point-of-care buyers are different. Hospitals, urgent care
      centers, and physician offices care more about workflow fit, reimbursement, and staff simplicity than about
      consumer branding. That divergence helps explain why Visby has leaned harder into OTC despite still possessing
      point-of-care assets. Public health departments and pharmacy-led distribution remain plausible scaling channels,
      but the current public record is stronger on consumer and telehealth distribution than on named government
      procurement or broad retail shelf velocity.
    claimRefs: [CM024, CM025, CM026, CM034, CM035, CM036, CM043, CM049, CM052]
    tableRefs: [TM003]
    figureRefs: [FM003, FM004]
  - id: growth-drivers-and-secular-tailwinds
    title: Growth drivers and secular tailwinds
    body: >-
      Several secular drivers support Visby's market thesis. The first is disease burden: U.S. reported STI counts
      still run in the low millions annually, trichomoniasis remains highly prevalent, and WHO continues to describe
      more than one million curable STIs being acquired every day globally. The second is the mismatch between
      traditional care pathways and user preference. Many infections are asymptomatic, stigma remains meaningful, and
      consumers increasingly want private, self-directed testing that does not require a lab trip or a delayed mail-in
      result. Third, the pandemic normalized home diagnostics and made consumers far more willing to trust app-guided
      testing and follow-up telehealth. Fourth, FDA action matters. Visby's 2025 De Novo for home sexual-health PCR and
      its 2026 respiratory home-PCR clearance demonstrate that regulators are now willing to define and expand an OTC
      molecular category. Finally, antimicrobial resistance and the clinical value of early treatment reinforce the
      argument that higher-sensitivity testing can justify a premium over less accurate alternatives when speed affects
      outcomes.
    claimRefs: [CM012, CM013, CM014, CM017, CM019, CM021, CM022, CM027, CM031, CM041, CM044, CM045]
    tableRefs: [TM004]
  - id: constraints-and-adoption-barriers
    title: Constraints and adoption barriers
    body: >-
      The same evidence also shows why Visby's opportunity should not be treated as frictionless. The clearest barrier
      is price. At US$149.99, the flagship women's OTC test is a premium self-pay product, so adoption requires buyers
      to place a high value on privacy, speed, and PCR-grade confidence. Reimbursement is still immature in the public
      record; the company emphasizes FSA and HSA eligibility rather than routine payer coverage, which suggests
      mass-market expansion may lag clinical validity. A second barrier is market novelty. De Novo and first-of-category
      wins help category creation, but they also mean payer pathways, pharmacist education, and normalized consumer
      purchasing behavior are still forming. Third, the company's own commercial pivot is a caution signal: 360Dx
      reported that Visby paused some clinical point-of-care sales efforts to focus on OTC, implying limited
      organizational bandwidth and the need to choose between channels. Finally, public data is not yet rich enough to
      size Visby's true near-term obtainable market because unit sell-through, reorder behavior, and government or
      retail channel productivity are undisclosed.
    claimRefs: [CM018, CM028, CM029, CM048, CM049, CM050, CM051, CM052]
