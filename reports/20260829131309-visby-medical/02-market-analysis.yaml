      - [At-home OTC STI testing, Consumer-purchased STI testing done at home including on-device and integrated-care workflows., Current flagship category after the women's OTC PCR authorization and launch., ~US$3.0B global, Low-Medium]
      - [Clinical point-of-care molecular diagnostics, Near-patient molecular testing in hospitals physician offices clinics and urgent care settings., Core legacy platform category and still relevant for respiratory and future clinical workflows., US$4.3B global, Medium]
      - [At-home respiratory PCR, Consumer-run home molecular testing for respiratory pathogens such as flu and COVID-19., Newly opened adjacency after Visby's 2026 home flu/COVID PCR clearance., No clean standalone 2025 figure public, Low]
      - [Telehealth-enabled diagnostic workflow, Digital consultation results interpretation prescription and care routing attached to a home test purchase., Important adoption enabler for Visby rather than a standalone assay TAM., US$140B telehealth by 2030 (adjacent), Low-Medium]
      - [Broader STI diagnostics, Lab-based office-based and centralized diagnostic spending beyond pure home testing., Useful as context but too broad to treat as Visby's primary TAM without adjustment., Materially larger than home-testing niche, Low]
    notes: Definitions separate assay technology from site of care so overlapping analyst estimates are not added mechanically.
    claimRefs: [CM001, CM002, CM008, CM027, CM040]
  - id: TM002
    title: TAM / SAM / SOM sizing lens table
    columns: [Sizing lens, Approach, Estimate, Year, Confidence, Source basis]
    rows:
      - [Global clinical and near-patient molecular TAM, Top-down analyst market size for POC molecular diagnostics, US$4.3B, 2025, Medium, MarketsandMarkets / PRNewswire]
      - [North America clinical SAM, Regional share from POC molecular diagnostics analyst coverage, ~US$1.2B, 2025, Medium, MarketsandMarkets user-verified regional figures]
      - [Global at-home STI TAM, Top-down analyst market size for consumer self-testing, ~US$3.0B, 2025, Low, Grand View Research page returned 403 during this run]
      - [North America OTC STI SAM, Derived by applying 40%+ regional share to at-home STI TAM, ~US$1.2-1.35B, 2025, Low, Derived from Grand View regional share and market size]
      - [Respiratory adjacency, Long-dated market-model lens for influenza and COVID-19 testing, ~US$4.56B combined, 2035, Low-Medium, GlobalData figures cited by Medical Device Network]
    notes: These lenses are directional and not additive because site-of-care and modality categories overlap.
    claimRefs: [CM003, CM004, CM006, CM010, CM011, CM032, CM038]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Description, Channel, Visby fit, Priority]
    rows:
      - [Women 15-40 seeking private STI answers, Self-directed consumers including symptomatic and screening users who value speed and discretion., DTC ecommerce delivery telehealth, Strong current fit, P1]
      - [Urgent care centers and physician offices, Clinical buyers seeking rapid molecular results in near-patient workflows., B2B clinical point-of-care, Relevant but not current commercial emphasis, P2]
      - [Telehealth platforms, Digital-care intermediaries that can bundle testing counseling and prescription routing., B2B2C partnerships, High leverage channel amplifier, P1]
      - [Retail and delivery partners, Pharmacy-adjacent or convenience channels that reduce time-to-test and broaden reach., Retail ecommerce and last-mile delivery, Useful distribution multiplier, P2]
      - [Public health departments, Potential buyer for screening programs and access expansion but current public evidence is limited., B2G / public programs, Strategic option with weak present proof, P3]
    notes: Priority reflects current evidence strength not theoretical lifetime value across all channels.
    claimRefs: [CM016, CM024, CM025, CM026, CM034, CM035, CM036, CM052]
  - id: TM004
    title: Growth drivers and constraints table
    columns: [Factor, Type, Mechanism, Severity, Implication]
    rows:
      - [High STI burden, Driver, Millions of annual cases and a young-skewing burden sustain baseline screening demand., High, Keeps category need structurally present]
      - [Privacy and stigma, Driver, At-home testing reduces embarrassment clinic friction and delay for asymptomatic users., High, Favors discreet OTC workflows over status quo]
      - [Post-pandemic home-testing acceptance, Driver, Consumers are more willing to trust app-guided diagnostics and telehealth follow-up than before COVID-19., Medium-High, Improves adoption for home PCR]
      - [FDA category creation, Driver, De Novo and follow-on clearances reduce regulatory novelty for future OTC molecular products., Medium-High, Supports portfolio expansion and investor confidence]
      - [Antimicrobial resistance, Driver, Greater need for accurate early diagnosis increases the value of molecular sensitivity., Medium, Supports premium positioning for PCR]
      - [US$149.99 self-pay price, Constraint, Out-of-pocket pricing narrows the reachable audience to users willing to pay for speed and privacy., High, May slow mainstream penetration]
      - [Reimbursement uncertainty, Constraint, Lack of routine payer coverage reduces affordability and channel willingness., High, Limits broad-based adoption and payer-led growth]
      - [Channel focus trade-off, Constraint, Company resources appear concentrated on OTC rather than simultaneous scaling of all point-of-care lanes., Medium-High, May defer value realization in clinical POC]
      - [Sparse public sell-through data, Constraint, Limited disclosure on reorder and conversion makes SOM harder to underwrite., Medium, Raises diligence burden on commercial traction]
    notes: Severity rates near-term effect on adoption speed and valuation rather than long-run scientific importance.
    claimRefs: [CM018, CM021, CM022, CM027, CM028, CM041, CM048, CM049, CM051]
