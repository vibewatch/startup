  - id: FM004
    title: Adoption value-chain map
    type: flow
    layout: wide
    summary: Visby's home-PCR thesis depends on compressing testing interpretation and treatment into one consumer journey.
    claimRefs: [CM023, CM025, CM026, CM043, CM050, CM051]
    data:
      nodes:
        - label: Symptoms or screening intent
          note: Consumer decides privacy and speed matter enough to act.
        - label: Digital discovery
          note: Learns about the test via ecommerce media or telehealth referral.
        - label: Purchase and delivery
          note: Orders through Everlywell DoorDash GoPuff or a similar channel.
        - label: Self-swab and app-guided PCR
          note: Uses the palm-sized test and receives a 30-minute result.
        - label: Telehealth interpretation
          note: Connects to Optum Now Wisp or another care pathway for next steps.
        - label: Prescription or follow-up care
          note: Moves from result to treatment or escalation faster than mail-in workflows.
