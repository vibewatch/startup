    - Pandemic-era point-of-care molecular M&A
    - ~$45M 2020 revenue
    - Thermo Fisher deal for $450M upfront / up to $550M total
    - ~10x-12x revenue
    - Illustrates how COVID-era scarcity produced premium multiples above normal diagnostics levels
  - - Lucira Health
    - OTC PCR public / distress sale
    - 2022 revenue of $82.8M
    - Pfizer bankruptcy-auction purchase for $36.4M
    - <0.5x revenue
    - Critical downside comp showing OTC PCR can fail commercially despite FDA-cleared products
  - - Everlywell / Everly Health
    - Consumer diagnostics private market
