- id: TV006
  title: Final diligence asks table
  columns:
  - Ask
  - Why it matters
  - Priority
  - Diligence path
  rows:
  - - Current monthly sell-through, repeat purchase, and CAC by channel
    - These metrics determine whether the OTC engine compounds or only creates expensive awareness
    - Critical
    - Request channel dashboards for visby.com, Optum, Everlywell, Quest, Labcorp, and delivery partners
  - - Gross margin, unit-cost trend, and automation yield
    - The valuation cannot be underwritten responsibly without knowing whether disposable PCR economics improve at scale
    - Critical
    - Review management accounts, plant KPIs, yield curves, and BOM trends
  - - Actual reimbursement capture and payer-roadmap evidence
    - A reimbursed pathway would materially enlarge the reachable market and reduce price friction
    - High
    - Request payer outreach status, claims examples, and any pilot reimbursement results
  - - Cap table, liquidation preferences, and investor rights
    - A flat valuation after years of financing can hide substantial preference overhang
    - High
    - Obtain cap table, charter, side letters, and latest financing docs under NDA
  - - Launch performance for respiratory and timing for men's STI
    - The upside case depends on more than one SKU
    - High
    - Request regulatory calendar, production plan, launch KPIs, and channel commitments
  - - Backup manufacturing and recall-readiness plan
    - Single-site or quality risk can destroy equity value faster than demand misses
    - Medium-High
    - Review contingency production, QA escalation, supplier concentration, and insurance coverage
  notes: Each ask is linked to a valuation lever that can move the recommendation more than another round of high-level narrative.
