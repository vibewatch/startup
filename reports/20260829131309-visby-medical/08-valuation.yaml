company:
  name: Visby Medical
chapter:
  number: 8
  title: Valuation
  summary: Visby Medical has a credible category-first OTC PCR platform, but the public evidence set does not yet make the current $1 billion price look compelling. The strongest upside case depends on consumer adoption, reimbursement, and menu expansion that are directionally plausible but still only lightly proven in disclosed operating data.
sections:
- id: recommendation-and-investment-thesis
  title: Recommendation and investment thesis
  body: 'Visby Medical deserves serious attention because it has done something unusually hard in diagnostics: it created the first FDA-authorized over-the-counter PCR category for sexual health and then followed it with a second at-home PCR clearance in respiratory testing. That combination creates real option value. A company with a novel product, multiple FDA clearances, BARDA-backed development history, and meaningful channel partnerships can plausibly grow into a large consumer diagnostics franchise if execution holds. The problem is price. Public evidence still points to a current valuation of about $1 billion while current revenue is only visible through third-party trackers around $35 million, implying a revenue multiple near 28.6x. At that entry point, investors are paying not for proven scale but for future adoption, future reimbursement, and future manufacturing leverage. The recommendation is therefore conditional interest rather than price-taking. Visby is strong enough to keep
    on the short list, but the present mark already capitalizes a large share of the upside before public proof on sell-through, repeat demand, gross margin, or preference stack becomes visible.'
  claimRefs:
