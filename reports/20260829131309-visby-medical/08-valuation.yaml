  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Detailed cap table, liquidation preferences, investor rights, and any participating or senior preference terms from the 2022 and 2025 financings.
    whyItMatters: A flat $1 billion headline valuation can still leave new investors with unattractive risk-adjusted returns if preference overhang is substantial.
    diligencePath: Request the latest cap table, charter, financing docs, side letters, and board materials covering the Series E and Series F structures.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: otc-cohorts-and-channel-efficiency
    missingEvidence: By-channel sell-through, repeat purchase, CAC, payback period, return rate, and partner conversion data for the women's OTC launch.
    whyItMatters: Those metrics determine whether Visby is building a durable consumer franchise or merely renting distribution without attractive economics.
    diligencePath: Request cohort dashboards and settlement data from direct, marketplace, telehealth, and lab-partner channels.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV003
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: gross-margin-and-reimbursement
    missingEvidence: Verified public or private evidence on gross margin by product, reimbursement capture rates, and payer policy traction for the OTC STI workflow.
    whyItMatters: Exit multiple selection is fragile without knowing whether reimbursement broadens access and whether disposable-PCR economics improve with scale.
    diligencePath: Review management accounts, payer outreach materials, claims examples, and margin bridges by SKU and channel.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
  - type: enumeration-incomplete
    severity: material
    topic: comparable-valuation-coverage
    missingEvidence: Confirmed post-2022 revenue and valuation data for private diagnostics and consumer-testing comps that would better bracket Visby between strategic diagnostics M&A and consumer health platforms.
    whyItMatters: The current comp set is decision-useful but not exhaustive, and private-market opacity widens the range around any multiple conclusion.
    diligencePath: Pull banker books, secondary-market snapshots, or paid databases for private rounds and strategic transaction benchmarking.
    relatedQuestionRefs:
    - QV013
    - QV014
    - QV015
    - QV016
    relatedTableRefs:
    - TV004
