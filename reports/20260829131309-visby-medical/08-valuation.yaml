- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Thesis point
  - Anti-thesis point
  - Weight
  - What would change the view
  rows:
  - - First-ever OTC PCR sexual-health category creates a real first-mover wedge
    - Category creation does not equal durable consumer demand
    - High
    - Show repeat purchase, low complaint rates, and expanding share
  - - Multiple FDA clearances and BARDA-backed development reduce technology risk
    - Commercial risk remains much larger than technical risk
    - High
    - Convert regulatory wins into visible revenue acceleration
  - - Google Cloud, Optum, Everlywell, Quest, and Labcorp support access and workflow
    - Partners prove availability more than sustained consumer pull
    - Medium-High
    - Disclose channel mix, attach rates, and partner renewal economics
  - - Twelve years of development suggest meaningful IP and process know-how
    - Disposable PCR manufacturing may still be expensive and concentrated
    - Medium
    - Show gross-margin improvement and backup production readiness
  - - Large TAMs in at-home STI and POC molecular create long runway
    - TAM is not the same as obtainable market at a $149.99 self-pay price
    - High
    - Prove reimbursement or lower price without margin collapse
  - - Menu expansion can broaden Visby from a single launch to a platform
    - A flat $1B valuation since 2022 suggests investors are waiting for proof too
    - High
    - Deliver follow-on launches plus evidence that they monetize faster than the first
  notes: Weights reflect investment relevance at the current $1 billion mark, not abstract strategic attractiveness.
