- id: bull-base-and-bear-cases
  title: 'Scenario analysis: bull, base, and bear'
  body: 'The bull case for Visby is straightforward to explain even if it is not yet proven. If the women''s STI test establishes a durable consumer category, if the men''s version clears, if respiratory scales as a second OTC line, and if manufacturing economics improve, Visby can move from a single-launch story to a broader home-molecular platform. On the market math alone, a 5% share of the cited terminal at-home STI market would equal about $295 million of revenue before adding respiratory or adjacent assays. A platform-level bull case can therefore justify roughly $1.5 billion to $2.3 billion at 5-6x revenue. The base case is less generous and, in this evidence set, more credible: revenue reaches only $100 million to $150 million by 2028, reimbursement remains patchy, and new products contribute but do not fully transform the model. At 4-5x revenue, that yields only about $400 million to $750 million of value. The bear case is harsh but plausible. If the $149.99 price point keeps demand
    niche, if reimbursement never broadens, or if a larger diagnostics player compresses price, Visby could be a $50 million revenue company deserving only 2-3x sales, or about $100 million to $150 million of value. In other words, current downside is far easier to see than present upside is to verify.'
