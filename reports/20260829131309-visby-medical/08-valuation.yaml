- id: valuation-framework-and-financing-context
  title: Valuation framework and financing context
  body: The right valuation lens for Visby is neither pure medtech hardware nor pure consumer internet. It is a blended diagnostics-platform case with single-use device economics, regulated product risk, and consumer-acquisition uncertainty. The public financing record anchors the debate. Visby's June 2025 Series F was reported at roughly $55 million, expandable to $65 million, at a $1 billion valuation, while Tracxn places the 2022 Series E rounds at the same valuation level. That means the mark was effectively flat for about three years despite real regulatory and product progress. Flat is better than down in the post-2022 diagnostics market, but it also means the round did not re-rate the company upward after the OTC breakthrough. The main reason is likely evidence quality. Revenue remains a tracker estimate, not a company disclosure; reimbursement remains suggestive rather than demonstrated; and the visible consumer offer still depends on a $149.99 self-pay price point across partner
    channels. Because the current valuation is being measured against lightly verified revenue, the underwriting burden should sit on operating proof, not on narrative momentum alone.
  claimRefs:
  - CV001
  - CV003
  - CV004
  - CV005
