figures:
- id: FI001
  title: Revenue model bridge
  type: flow
  layout: wide
  summary: Visby monetizes primarily at the moment of test sale, with telehealth and treatment access increasing conversion value rather than appearing as separately disclosed revenue lines.
  data:
    nodes:
    - id: discover
      label: Consumer discovery
      detail: Consumer finds the test via visby.com, marketplaces, or partner health platforms.
    - id: purchase
      label: Test purchase
      detail: One-time self-pay purchase at a visible $149.99 list price for the women's OTC test.
    - id: fulfillment
      label: Shipment / retail fulfillment
      detail: Direct shipment or partner last-mile delivery through channels such as GoPuff or DoorDash.
    - id: result
      label: 30-minute PCR result
      detail: User runs the single-use test and receives app-delivered results at home.
    - id: telehealth
      label: Telehealth routing
      detail: Positive users can connect to licensed telehealth for consultation and prescriptions.
    - id: care
      label: Treatment / follow-up
      detail: Prescription and care completion reinforce product value and potential repeat intent.
    - id: repeat
      label: Repeat / partner expansion
      detail: Satisfied users and partner distribution can support repeat purchase and broader channel reach.
    edges:
    - from: discover
      to: purchase
    - from: purchase
      to: fulfillment
    - from: fulfillment
      to: result
    - from: result
      to: telehealth
    - from: telehealth
      to: care
    - from: care
      to: repeat
  approximationNotes: The flow shows monetization mechanics, not a disclosed accounting policy. Public sources show the test sale and bundled care journey, but not revenue recognition line items by step.
