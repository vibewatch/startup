- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - What is publicly known
  - Confidence
  - Diligence path
  rows:
  - - Exact 2026 revenue by channel
    - Needed to separate consumer traction from legacy clinical revenue and to assess mix quality
    - Only third-party revenue estimates around ~$35M were located
    - Low
    - Request monthly revenue bridge by DTC, partner, clinical POC, and respiratory lines
  - - Realized ASP, discounts, and partner take rates
    - List price does not equal net revenue or contribution margin
    - $149.99 list price is visible but net pricing is not
    - Medium
    - Request order-level waterfall from list price to recognized net revenue
  - - Gross margin and unit COGS
    - Core determinant of whether disposable PCR can scale profitably
    - Public sources discuss cost reduction but give no confirmed margin figure
    - High
    - Request product-level gross margin, BOM, yield, scrap, and freight data
  - - Cash on hand and monthly burn
    - Required to size runway and financing dependency
    - Only scenario inferences are supportable from headcount and capital raised
    - Low-Medium
    - Request latest cash balance, monthly burn, and covenant/debt schedule
  - - Consumer cohort economics
    - Without reorder, conversion, CAC, and payback, DTC scale cannot be underwritten
    - Public launch and channel breadth are visible; cohort quality is not
    - High
    - Request CAC, repeat purchase, positive-test rate, telehealth conversion, and retention by channel
  - - Reimbursement collections and denied claims
    - Could materially widen the reachable market and affect realized economics
    - HSA/FSA eligibility is public, routine OTC reimbursement is not
    - Medium
    - Review payer policies, claims acceptance, and reimbursement pilot data
  notes: The most important public gap is not one missing statistic but the absence of a connected revenue-to-margin-to-runway bridge built from company-confirmed numbers.
