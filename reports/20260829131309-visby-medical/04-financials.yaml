- id: capital-history-and-adequacy
  title: Capital history and adequacy
  body: 'Even without restating the entire round chronology from Company Overview, Financials can already reach one firm conclusion: Visby is a capital-intensive diagnostics company that has required repeated equity and non-dilutive financing to keep scaling. The official March 2022 Series E announcement said more than $100M would be used to take output from tens of thousands to hundreds of thousands of tests per month and expand the menu, while the June 2022 extension added another $35M for similar scale and pipeline goals. The June 2025 financing then added about $55M with potential to reach $65M specifically to accelerate launch and distribution of the at-home women''s STI test. In parallel, BARDA, NIH, and CARB-X money supported respiratory and antimicrobial-resistance programs, showing that government and mission-driven capital have been important complements to venture equity. The cumulative capital picture depends on lens: Tracxn reports $386M of funding, while Calcalistech reports
    $487M including grants. Either way, the amount raised is very large relative to the limited public revenue estimates, implying a business that still needs high utilization, lower COGS, and successful new-product launches to make prior capital efficient.'
