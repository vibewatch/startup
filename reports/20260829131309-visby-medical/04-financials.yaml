- id: financial-gaps-and-underwriting-implications
  title: Financial gaps and underwriting implications
  body: 'The underwriting issue is not whether Visby has credible technology or live consumer demand; it is whether the company can prove financial efficiency before the next financing window matters more than the science. No audited public financials were located in this run, and the most important operating metrics remain undisclosed: exact 2026 revenue, channel mix, realized ASP, gross margin, cash on hand, monthly burn, reorder rates, returns, and payer collections. Some external trackers are themselves inaccessible or inconsistent, which reduces confidence in any single third-party snapshot. That forces diligence to rely on scenario analysis. A reasonable public-base case is that a 180-194 person medtech manufacturer with ongoing R&D and launch spend burns tens of millions of dollars per year, making a $55M-$65M round feel more like 15-18 months of operating runway than a full bridge to profitability. If that framing is directionally right, then the investment case depends on three
    linked proofs over the next cycle: OTC sell-through, lower unit cost from automation, and a second at-home revenue line from respiratory testing. Without those proofs, a ~$1B valuation implies a very demanding forward setup relative to today''s public metrics.'
