- id: pricing-substitutes-and-distribution
  title: Pricing opacity and distribution power shape where substitutes can win
  body: |-
    The clearest commercial split in the source set is between opaque enterprise procurement and transparent self-serve analytics. Chainalysis, TRM, Elliptic, Merkle, and Mastercard/CipherTrace largely force buyers into some mix of demos, procurement cycles, implementation work, and negotiated pricing. That is normal for compliance tooling sold into banks, exchanges, and public agencies, but it also hides how much discounting or bundling is needed to win. Nansen sits at the opposite end: public list pricing at free to $69 per month makes it easy for individual analysts, small funds, or research teams to substitute it into wallet-intelligence workflows without a six-figure budget ask. Comparison and adverse sources push the same point harder: once buyers do not need regulator-facing evidence packages or travel-rule infrastructure, low-cost or free tools start to matter much more.

    The substitute threat is therefore uneven. For large regulated institutions, the best public guidance still says blockchain analytics should sit alongside legacy AML and sanctions systems, not be replaced by them. Internal build can absorb some reporting, screening, or triage logic, especially inside large exchanges and banks with existing compliance engineering teams. But specialist vendors still own the deepest public proof on wallet attribution, cross-chain tracing, and case-ready workflows. DeFi and crypto-native teams are different. There, ChainAware's critique and ChainGain's market map both suggest a credible path for lower-cost tools, free baselines, or self-serve products to displace enterprise suites that were designed for banks and centralized exchanges. Chainalysis keeps the strongest position where procurement friction buys trust; it is much less insulated where the buyer really wants speed, transparency, and lightweight intelligence.
