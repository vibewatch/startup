chapter:
  number: 3
  title: Competitors
  summary: Chainalysis still looks like the hardest vendor to displace in high-trust blockchain investigations
    and compliance because its public proof is deepest with regulators, major exchanges, and evidentiary
    workflow. TRM is the closest direct challenger on mission-critical public-private crime workflows,
    Elliptic is strongest as a bank-grade and stablecoin-oriented compliance rival, Merkle Science is
    a smaller but credible niche competitor, Mastercard/CipherTrace now looks more bundled than insurgent,
    and Nansen plus internal or low-cost tools matter mainly as substitutes for research-heavy or lighter-weight
    use cases rather than for the most regulated mandates.
sections:
- id: competitive-structure
  title: The real competition is a layered market, not one flat peer set
  body: |-
    Chainalysis does not compete against one monolithic 'crypto analytics' bucket. The retained evidence breaks the field into four practical layers. First are the direct enterprise compliance-and-investigations peers: TRM, Elliptic, and to a lesser extent Merkle Science. They sell overlapping workflows around tracing, wallet or entity risk, sanctions and AML monitoring, and regulator-facing investigation support. Second is the incumbent-bundled layer, where Mastercard's CipherTrace heritage matters less as an independent product family and more as a banking or payment-compliance capability that can be folded into a broader platform. Third are adjacent substitutes such as Nansen and the free or budget tracker ecosystem, which solve discovery, wallet intelligence, and research jobs for crypto-native teams without trying to win law-enforcement or bank-compliance mandates. Fourth is the status quo: large banks and exchanges can internalize pieces of monitoring inside legacy AML, sanctions, and investigations stacks, even if public guidance still points them back to specialist on-chain tooling when exposure becomes material.

    That layered structure matters because Chainalysis still looks strongest where trust, evidentiary defensibility, and regulator familiarity dominate the buying decision. Its own current materials emphasize top-exchange penetration, regulator usage, courtroom-grade workflow, and cross-chain tracing rather than self-serve exploration. TRM attacks the same budget line with a more explicitly AI-first narrative and strong public-sector momentum. Elliptic attacks from institutional finance and stablecoin compliance. Merkle attacks from behavior-based monitoring. Nansen competes for attention and research budget, not for the most compliance-intensive workflows. The practical diligence question is therefore not 'who else does analytics,' but 'which vendor class wins each buyer job to be done.'
