  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: ciphertrace-current-state
    missingEvidence: A current Mastercard or customer-facing product catalog that clearly confirms which
      legacy CipherTrace capabilities remain commercialized after the 2024 shutdown reports.
    whyItMatters: Without a current product inventory, CipherTrace could be understated as a competitive
      threat or overstated as a live substitute in bank procurement cycles.
    diligencePath: Request current Mastercard crypto-risk collateral, product packaging, and recent customer
      references for former CipherTrace modules.
    relatedQuestionRefs:
    - QP008
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing-opacity
    missingEvidence: Named contract values, minimum commits, implementation fees, and module-level pricing
      for Chainalysis, TRM, Elliptic, Merkle, and Mastercard/CipherTrace.
    whyItMatters: Public list prices are mostly absent, so competitive willingness-to-pay and discounting
      power remain harder to judge than product scope.
    diligencePath: Collect redacted customer proposals or procurement records and compare base subscriptions,
      usage fees, and implementation terms side by side.
    relatedQuestionRefs:
    - QP018
    - QP028
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: internal-build-adoption
    missingEvidence: Named examples showing how many large exchanges or banks rely primarily on internally
      built on-chain monitoring rather than specialist vendors.
    whyItMatters: The substitute threat from internal build could be material for the largest buyers,
      but public evidence is too generic to quantify share loss risk.
    diligencePath: Interview compliance leaders at large exchanges, custody banks, and payment firms about
      what they build in-house versus outsource to specialist vendors.
    relatedQuestionRefs:
    - QP020
    - QP027
  - type: missing-source
    severity: minor
    topic: cross-vendor-accuracy-benchmark
    missingEvidence: A neutral benchmark comparing false positives, attribution precision, and coverage
      quality across Chainalysis, TRM, Elliptic, and Merkle.
    whyItMatters: The sector makes large trust claims, but without a common benchmark it is hard to know
      whether data quality or workflow fit actually explains win rates.
    diligencePath: Ask vendors for third-party audit reports, courtroom references, and side-by-side pilot
      results under the same transaction and alert workloads.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
