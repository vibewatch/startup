company:
  name: Chainalysis
chapter:
  number: 4
  title: Financials
  summary: 'Public evidence supports Chainalysis as a real, recurring software-and-data business with estimated 2023 ARR around $190 million, a 2024 ARR projection around $250 million, and a revenue mix that had shifted to majority government by 2023-2024. Pricing is custom and multi-product, while 2023 layoffs and Sacra’s cash-burn estimate argue against any clean cash-flow-positive reading for 2023-2024. The open underwriting problem is precision: product-level mix, gross margin, CAC, retention, current cash, and Hercules facility terms remain private, so the business looks durable but still not fully modelable from public sources alone.'
sections:
- id: revenue-model-and-pricing
  title: Revenue model, product mix, and pricing mechanics
  body: |-
    Public materials show Chainalysis monetizes more than one thing. The company now describes itself as a blockchain data platform selling data, AI-powered software, services, and research, while product pages split the commercial offer into Reactor for investigations, KYT for real-time transaction monitoring, Data Solutions and Workflows for direct dataset access, and broader crypto-compliance and government services. That makes the business look less like a single-seat investigation tool and more like a layered platform with software, data, and expert-services attach. Pricing visibility is still indirect. Vendr and CostBench both describe quote-based contracting rather than public list pricing, Reactor appears to scale with seats and supported chains, KYT with monitored transaction volume, and implementation or training often sit outside base subscriptions. The underwriting takeaway is good revenue quality at the product-category level—recurring enterprise and government contracts—but weak precision on realized ASPs, discounting, and true product-line mix.
