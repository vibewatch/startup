- id: TI004
  title: Unit economics table
  columns:
  - Metric / proxy
  - Public value or status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Gross margin
    - Not publicly disclosed
    - Low
    - Without it, investors cannot separate software quality from services drag
    - Provide gross margin by product family and services
  - - Revenue recognition policy
    - Not publicly disclosed
    - Low
    - Needed to reconcile ARR estimates with recognized revenue and deferred revenue
    - Provide revenue-recognition memo and deferred-revenue bridge
  - - CAC / payback
    - Not publicly disclosed
    - Low
    - Government-heavy selling can be sticky but expensive; payback is unknown
    - Provide CAC, payback, and win rates by segment
  - - Sales cycle
    - Procurement-led public-sector motion implies long cycles but no public average is disclosed
    - Low
    - Cycle length drives working capital and forecast risk
    - Provide average sales cycle by segment and by vehicle
  - - Services and support attach
    - Official pages cite 120-plus specialists, case support, training, and Academy access
    - Medium
    - Support-heavy delivery raises cost of revenue and headcount intensity
    - Provide services attach rate and incremental margin
  - - Profitability status
    - Sacra said not yet profitable in 2024
    - Medium
    - Directly contradicts any clean cash-flow-positive reading
    - Provide EBITDA, FCF, and operating margin by quarter
  - - Cash burn
    - Sacra estimated about $40M burned in H2 2023
    - Medium
    - Shows that cash generation had not yet inflected positive in the public record
    - Provide monthly burn bridge and cash runway by scenario
  - - Expense actions
    - 2023 layoffs and private-sector S&M cuts are public; current opex mix is not
    - Medium
    - Restructuring helps efficiency but does not prove durable margin improvement
    - Provide opex split across R&D, S&M, G&A, and services delivery
  notes: Most true unit-economics fields remain undisclosed; the table uses public proxies and explicitly marks where the record is missing rather than pretending precision exists.
