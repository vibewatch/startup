- id: growth-trajectory-and-customer-mix
  title: Growth trajectory, public traction, and customer concentration
  body: |-
    Public evidence supports a real business at substantial scale, but almost every hard number is an estimate or directional proxy rather than company disclosure. Sacra’s $190 million 2023 ARR estimate and $250 million end-2024 projection fit the user’s working range and are directionally consistent with Chainalysis’s own earlier large-account and customer-expansion signals. The mix story matters as much as the top line. CoinDesk reported roughly 50-50 public and private revenue in 2020, while Sacra says 66% government and regulator revenue in 2023 and Forbes says more than 70% public-sector by 2023-2024. USAspending and Carahsoft reinforce that public-sector demand is not marketing fluff: FBI, IRS, and ICE dominate visible federal obligations, and reseller vehicles extend reach through GSA, NASA SEWP, Army ITES-SW2, and SLED channels. That mix improves durability in a crypto downturn, but it also means renewal, budgeting, and procurement risk are increasingly tied to government calendars rather than commercial volume alone.
