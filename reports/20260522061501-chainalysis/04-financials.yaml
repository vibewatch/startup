  - CI022
  - CI023
  - CI026
- calloutType: risk
  title: Debt and margin precision remain private
  body: Official materials confirm the Hercules financing existed, but they do not provide the terms needed to model leverage, and public sources still do not disclose gross margin, retention, or CAC and payback.
