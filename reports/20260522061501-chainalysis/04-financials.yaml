  - - Bundled product suites
    - Reactor plus KYT or data products often negotiated together
    - Multi-product bundle
    - Bundles can improve overall economics
    - Medium
    - Vendr says bundling often improves price relative to single-product deployments
  - - Implementation and onboarding
    - Separate professional-services and onboarding fees are common
    - Per engagement / scope based
    - Often outside base subscription
