- id: TI006
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Best public proxy
  - Current conclusion
  - Exact diligence path
  rows:
  - - Product-line revenue mix
    - Changes the valuation and margin story materially
    - Official product pages plus Sacra product overview
    - Public record shows lines of business but not revenue share
    - Request product-line ARR bridge and attach-rate analysis
  - - Gross margin by product and services
    - Needed to separate software quality from service drag
    - Official service intensity and staffing clues
    - No public disclosure
    - Request gross-margin walk by product family and services
  - - CAC, payback, and win rates
    - Determines whether government-heavy growth is attractive or expensive
    - Reseller vehicles and public pricing structure
    - No public disclosure
    - Request pipeline conversion, CAC, and payback by segment
  - - Net revenue retention and churn
    - Key revenue-quality metric for recurring software businesses
    - None found in reviewed sources
    - No public disclosure
    - Request cohort retention packs and churn waterfall
  - - Current cash and runway
    - Needed to know whether debt is optional or necessary
    - Sacra 2024 cash and burn estimate
    - Public evidence is stale for 2026 underwriting
    - Request latest cash balance, board runway case, and monthly burn bridge
  - - Debt pricing and covenants
    - Debt can restrict flexibility even when the dollar amount is small
    - Official announcement plus thin filing trace
    - Public terms remain incomplete
    - Request executed facility agreement and compliance certificate
  notes: This table intentionally catalogs what remains private because Chainalysis is a private company; each row names the exact document or dataset needed to close the gap.
