- id: cost-structure-and-capital-adequacy
  title: Cost structure, cash-flow inflection, and financing dependency
  body: |-
    Margin visibility is much worse than demand visibility. Sacra says Chainalysis was not yet profitable and burned about $40 million in cash in the second half of 2023 while still holding about $200 million of cash, and 2023 layoffs on Bloomberg and Forbes show management was actively resizing the business rather than growing at any cost. The October cuts mattered because they hit marketing and business-development roles serving the private sector, implying an expense base being reweighted toward public-sector selling and core delivery rather than broad commercial expansion. Official product pages also imply a service-heavy operating model: 120-plus specialists, global support, Academy access, private training, case support, and custom data work all suggest meaningful labor content in delivery. The October 2025 Hercules financing looks like optional growth capital instead of distress capital, but public disclosure on facility size, price, covenants, and drawn balance is still too thin to model debt service cleanly.
