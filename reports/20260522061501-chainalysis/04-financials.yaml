  evidenceGaps:
  - type: missing-source
    severity: material
    topic: gross-margin-disclosure
    missingEvidence: Gross margin by product line, any professional-services gross margin, and the revenue-recognition policy that determines how subscriptions, services, and training are booked.
    whyItMatters: Without gross-margin and recognition detail, it is impossible to separate high-quality recurring software from lower-margin services or channel-heavy government work.
    diligencePath: Request audited financial statements, product-line revenue bridge, deferred-revenue rollforward, and controller memo on recognition policy for subscriptions, services, and training.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI004
    - TI006
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency-disclosure
    missingEvidence: CAC, payback, pipeline conversion, average sales cycle, and net revenue retention broken out for public-sector and private-sector cohorts.
    whyItMatters: Government concentration can stabilize bookings while lengthening sales cycles and raising channel dependence, so efficiency metrics are needed to judge whether growth is attractive or expensive.
    diligencePath: Request cohort retention, payback, pipeline-to-bookings conversion, average procurement cycle by segment, and partner-sourced versus direct ACV for the last eight quarters.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
    - TI006
  - type: private-evidence-only
    severity: material
    topic: debt-term-disclosure
    missingEvidence: Signed Hercules facility agreement, current drawn amount, interest rate, amortization or maturity waterfall, covenants, security package, and permitted-acquisition restrictions.
    whyItMatters: A small non-dilutive facility can be harmless optionality, but covenant or pricing terms can still constrain liquidity, M&A, or future fundraising.
    diligencePath: Request the executed credit agreement, latest compliance certificate, debt schedule, and board materials describing why debt was preferred over equity in October 2025.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI005
    - TI006
  - type: private-evidence-only
    severity: material
    topic: product-mix-disclosure
    missingEvidence: Revenue split across Reactor, KYT, Data Solutions, services/training, government services, and any post-2024 acquired products.
    whyItMatters: The valuation and margin story changes materially depending on whether growth comes from scalable software and data access or from labor-heavy services and bespoke public-sector work.
    diligencePath: Request a product-line ARR bridge, attach-rate analysis, and gross-margin view by product family for the last two fiscal years plus the current year-to-date period.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI001
    - TI006
