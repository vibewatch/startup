- id: verdict-and-diligence-blockers
  title: Financial verdict and the limits of the public record
  body: |-
    My financial verdict is that Chainalysis has a credible recurring software and data business, visible public-sector demand, and enough evidence to support estimated ARR in the rough $190 million to $250 million band, but not enough disclosure to underwrite margin quality or capital efficiency with confidence. The central ambiguity is not whether the company has revenue; it is how much of that revenue is high-gross-margin software versus expert services, training, channel-mediated government work, or newer products layered onto the core platform. Adverse materials also matter. ChainArgos’s Bitcoin Fog critique and ICIJ’s reporting on category-dependent analytics outputs do not invalidate Chainalysis’s business, but they show that product credibility is still an economic variable because courtroom defensibility and regulator trust help support future renewals. Before underwriting valuation upside, a data room should produce product-level ARR, gross margin, retention, CAC and payback, current cash, debt terms, and customer concentration by agency and by private-sector cohort.
  claimRefs:
  - CI015
  - CI022
  - CI038
  - CI039
