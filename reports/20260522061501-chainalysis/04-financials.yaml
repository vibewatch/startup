tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Public evidence
  - Pricing mechanism
  - Buyer set
  - Revenue quality
  - Diligence ask
  rows:
  - - Reactor investigation licenses
    - Flagship investigation product sold to law enforcement, regulators, financial institutions, and corporate investigators
    - Quote-based; base platform plus user-seat and coverage drivers
    - Government agencies and regulated enterprises
    - High recurring value but likely services-backed in larger deployments
    - Provide ARR, renewal, and gross margin for Reactor-only versus bundled customers
  - - KYT monitoring subscriptions
    - Real-time transaction monitoring and alerting for exchanges, FIs, and payment flows
    - Volume tiers, monitored addresses, and transaction overages
    - Crypto businesses and financial institutions
    - Recurring compliance revenue with usage sensitivity
    - Provide transaction bands, overage revenue, and churn by customer segment
  - - Data Solutions / Workflows
    - SQL, API, notebook, and no-code access to curated datasets and custom workflows
    - Enterprise or mission-specific data-access contract
    - Regulators, law enforcement, tax authorities, exchanges
    - Potentially sticky and higher-value than point-seat licenses
    - Disclose data-contract ARR and support burden versus application ARR
  - - Government investigative services
    - Embedded investigations, intelligence, mission support, and custom tools are sold alongside software
    - Statement-of-work or support-heavy contract structures
    - Federal, state, local, and overseas public-sector buyers
    - Can deepen retention but may dilute pure software margin
    - Break out software versus services mix in public-sector revenue
  - - Training and certifications
    - Academy access, private training, and 20,000-plus trained professionals show paid enablement around the stack
    - Per-course, per-engagement, or bundled with licenses
    - Government agencies and enterprise compliance teams
    - Good attach revenue but labor-intensive
    - Show training revenue, attach rate, and incremental margin
  - - Case support / expert services
    - CoinDesk and official pages describe case support, expert assistance, and global specialists
    - Project or retainer style services
    - Investigations-led customers and government teams
    - High strategic value but likely lower gross margin than software
    - Provide utilization, gross margin, and conversion from services to recurring licenses
  - - Public-sector channel distribution
    - Carahsoft contract vehicles and solutions pages show reseller-mediated procurement into government
    - Reseller and contract-vehicle economics
    - Federal and SLED agencies
    - Improves access but can compress net realized pricing
    - Disclose reseller margin, direct versus indirect ACV, and vehicle-specific renewal rates
  notes: Rows mix recurring software, data access, partner-mediated procurement, and labor-backed services; public sources do not disclose recognized revenue share or gross margin by line.
