callouts:
  - calloutType: strength
    title: Dual-engine demand matters more than one TAM number
    body: >-
      The market is being pulled simultaneously by public-sector urgency and private-sector institutionalization. That is
      more durable than a category whose thesis depends only on retail trading activity or a single regulatory cycle.
    claimRefs:
      - CM018
      - CM019
      - CM032
      - CM033
      - CM035
  - calloutType: insight
    title: Boundary discipline is a diligence edge
    body: >-
      Broad category TAMs support a large market story, but the more decision-useful number is the smaller blockchain
      analytics and transaction-monitoring slice inside crypto-specific compliance technology. That is the spend pool most
      relevant to Chainalysis's core workflows today.
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM010
      - CM045
  - calloutType: risk
    title: Policy tailwinds do not automatically convert into third-party vendor revenue
    body: >-
      Stablecoin, custody, and tokenization adoption can expand the workflow surface while still pushing some buyers toward
      bundled, permissioned, or internalized solutions. Diligence must separate category growth from stand-alone vendor
      capture.
    claimRefs:
      - CM026
      - CM027
      - CM032
      - CM033
      - CM040
      - CM041
  - calloutType: recommendation
    title: 'Diligence priority: prove SAM, proof burden, and attach-rate by buyer segment'
    body: >-
      Management should be asked for pipeline, win-rate, contract-value, and module-attach evidence by exchanges, public
      sector, banks/payment firms, and asset managers. Public sources do not cleanly isolate Chainalysis's SAM or show how
      much new bank and tokenization demand lands with third-party vendors versus internal programs.
    claimRefs:
      - CM010
      - CM043
      - CM044
      - CM045
