  - id: S-M-tailwinds
    title: Regulation is the strongest tailwind, but fragmentation and internalization remain real constraints
    body: |
      The strongest tailwind is the combination of FATF pressure, MiCA implementation, and 2025 U.S. policy change.
      FATF's 2025 update says most surveyed jurisdictions have now legislated the Travel Rule, but emphasizes that
      implementation, supervision, offshore-VASP control, and stablecoin risk still lag. ESMA and the European Commission
      show MiCA moving from legal text into operating rules, with delegated and implementing acts still rolling out through
      2025. In the U.S., the White House, OCC Letter 1183, and OCC Letter 1184 all lowered procedural barriers for banks,
      stablecoin programs, and custody workflows. Layer on top the institutionalization described by WEF, Morgan Stanley,
      The Trade, Blockchain.com, BPM, and Oliver Wyman, and the category clearly benefits from more regulated entities,
      more regulated workflows, and more cross-border value moving on-chain.

      But not every tailwind becomes vendor revenue one-for-one. Stablecoin fragmentation across chains and issuers,
      uneven cross-border rules, private and permissioned-chain adoption, and the growing willingness of banks and large
      institutions to bundle or internalize analytics inside broader compliance stacks all create capture risk for
      stand-alone vendors. The market also remains definition-sensitive: broad category TAMs can overstate the spend truly
      available to dedicated on-chain intelligence tools. Chainalysis therefore benefits from structural demand expansion,
      but diligence still needs proof that this policy and workflow expansion converts into third-party budget capture
      rather than merely more complicated internal compliance work for customers.
