  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication for Chainalysis
      - Diligence ask
    rows:
      - - FATF Travel Rule operationalization and licensing enforcement
        - Tailwind
        - Immediate and multi-year
        - Expands mandatory screening, interoperability, and audit-evidence workflows across VASPs and supervisors
        - Which portion of new sales is tied to Travel Rule, licensing, or remediation programs?
      - - MiCA implementation and delegated-act rollout
        - Tailwind
        - 2025-2026 implementation window
        - Creates EU authorization, supervision, and reporting workloads that favor chain-native tooling
        - How much of pipeline growth comes from EU CASP, stablecoin, or supervisory use cases?
      - - U.S. bank and stablecoin policy liberalization
        - Tailwind
        - Immediate / 2025-2026
        - Makes bank custody, tokenized-payment, and stablecoin workflows more actionable procurement targets
        - Are banks buying stand-alone analytics or bundling them into broader custody and sanctions stacks?
      - - Record sanctions, DPRK theft, and nation-state illicit infrastructure
        - Tailwind
        - Immediate / persistent
        - Keeps public-sector and exchange demand durable even when speculative trading cycles cool
        - What share of public-sector and enterprise demand is mission-critical versus discretionary?
      - - Institutional tokenization and stablecoin adoption
        - Tailwind
        - 2026 onward
        - Broadens the buyer universe beyond exchanges into banks, asset managers, and treasury platforms
        - How much revenue comes from tokenization and treasury workflows versus classic exchange AML?
      - - AI-assisted, intelligence-led compliance operations
        - Tailwind
        - Ongoing
        - Buyers increasingly want lower-friction alert review, cross-chain intelligence, and integrated data access
        - Does Chainalysis demonstrate measurable false-positive or analyst-efficiency improvements?
      - - Fragmentation across chains, issuers, custodians, and inconsistent rules
        - Constraint
        - Immediate / persistent
        - Slows standardization and raises interoperability burdens for cross-border products and Travel Rule tooling
        - Which product modules win because of fragmentation, and which lose because standards remain uneven?
      - - Permissioned rails and bundled or internalized tooling
        - Constraint
        - 2026 onward
        - Banks and large institutions may solve part of the workflow inside broader custody, payments, or compliance stacks
        - What evidence shows third-party on-chain intelligence remains a must-buy rather than a nice-to-have layer?
      - - SAM ambiguity and workflow overlap
        - Constraint
        - Persistent
        - Broad TAMs can overstate the budget pool truly reachable by dedicated analytics vendors
        - Request management TAM/SAM bridge by segment, workflow, and average contract value
      - - Enterprise procurement intensity and audit burden
        - Constraint
        - Immediate / persistent
        - High contract values and proof burdens favor incumbents with strong references and integrations
        - What is the average sales cycle and proof-of-value requirement by buyer class?
    notes: >-
      Several rows combine hard regulatory facts with analyst synthesis about adoption timing and vendor capture. The table
      is designed to separate demand creation from demand monetization.
