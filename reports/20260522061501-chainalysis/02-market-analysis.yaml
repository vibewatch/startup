  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sam-isolation
      missingEvidence: A management-quality bridge from broad category TAM to Chainalysis-relevant SAM by buyer segment and workflow.
      whyItMatters: Public sources size the category broadly but do not isolate the budget pool truly reachable by dedicated on-chain intelligence vendors.
      diligencePath: Request management TAM/SAM model with segment definitions, average contract values, and module-level attach assumptions.
      relatedQuestionRefs:
        - QM006
      relatedTableRefs:
        - TM002
    - type: missing-source
      severity: material
      topic: public-private-revenue-split
      missingEvidence: A public dataset that cleanly separates current category spend between public-sector buyers and private-sector buyers.
      whyItMatters: Public-sector durability versus private-sector cyclical sensitivity is central to underwriting revenue resilience and sales-priority decisions.
      diligencePath: Ask management for revenue mix by public sector, exchanges, banks/payment firms, and asset managers, and corroborate with customer references.
      relatedQuestionRefs:
        - QM025
      relatedTableRefs:
        - TM003
    - type: missing-source
      severity: material
      topic: internalization-vs-vendor-capture
      missingEvidence: Segment-level proof of whether new bank, stablecoin, and tokenization workflows are purchased from third-party vendors or solved inside broader internal and bundled stacks.
      whyItMatters: Policy tailwinds can expand workflows without expanding independent vendor revenue if buyers internalize or bundle the capability.
      diligencePath: Request win-loss data and recent deployments by banks, custodians, and tokenization platforms, including whether Chainalysis displaced internal tooling or generic sanctions systems.
      relatedQuestionRefs:
        - QM026
      relatedTableRefs:
        - TM004
    - type: private-evidence-only
      severity: material
      topic: som-confidence
      missingEvidence: A buyer-segment-level view of pipeline, attach rates, contract values, and churn needed to convert the low-confidence inferred slice into an underwritable SOM.
      whyItMatters: Without segment economics and attach rates, market share capture remains more narrative than modelable.
      diligencePath: Request current pipeline by segment, contract duration, ACV, module attach rate, and renewal outcomes for public-sector and private-sector cohorts.
      relatedQuestionRefs:
        - QM028
      relatedTableRefs:
        - TM002
