  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A board-approved or finance-owned current employee count after the 2023 layoffs and 2025 acquisition
      integration.
    whyItMatters: Headcount is a core maturity and operating-efficiency signal, and public sources only bound the figure loosely.
    diligencePath: Request current headcount by function and geography plus a bridge from the 2023 restructuring to the report
      date.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO001
  - type: access-blocked
    severity: material
    topic: secondary-opacity
    missingEvidence: Transaction price, share count, and exact implied valuation for the 2025-03-19 Fabrica Ventures secondary.
    whyItMatters: The latest credible valuation signal is central to underwriting entry price and employee-liquidity pressure.
    diligencePath: Pull paid market-data records or request company-approved secondary-trade summaries from management or
      existing investors.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: hercules-terms
    missingEvidence: Facility size, interest rate, covenants, security package, and draw schedule for the Hercules financing.
    whyItMatters: Debt can change downside protection, liquidity runway, and control risk in a way headline press releases
      do not show.
    diligencePath: Request the executed credit agreement or lender term sheet and reconcile it to board materials.
    relatedQuestionRefs:
    - QO016
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: board-opacity
    missingEvidence: A complete current board roster, committee structure, and any investor-designated board rights.
    whyItMatters: Governance quality and key-person mitigation are hard to assess without a full board map after the 2024
      CEO transition.
    diligencePath: Request an up-to-date board list, committee charter summary, and observer-rights schedule.
    relatedQuestionRefs:
    - QO018
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-chronology
    missingEvidence: A fuller public chronology for earlier pre-2021 product launches, financing rounds, and regulatory milestones.
    whyItMatters: The chapter can establish a canonical history, but some early or private milestones remain underdocumented
      publicly.
    diligencePath: Request the internal board history slide and reconcile it against earlier fundraising and product-announcement
      archives.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO004
