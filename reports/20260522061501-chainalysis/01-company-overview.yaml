callouts:
- calloutType: strength
  title: Chainalysis still has category-defining reach even after the valuation reset
  body: |-
    The current public record still supports real market leadership: broad government adoption, 45+ regulators, 9 of the top 10 exchanges, and 1,500+ organizations on Reactor. The investment debate is now more about margin, governance, and pricing than about whether the company matters.
  claimRefs:
  - CO010
  - CO030
  - CO031
- calloutType: risk
  title: Public valuation and capital signals are weaker and more complex than the 2022 headline suggests
  body: |-
    Investors can verify the 2022 $8.6B peak, but the fresher signal is a much lower secondary-market value around $2.5B plus a later Hercules debt facility whose detailed terms are not publicly disclosed. That combination makes today’s price narrative materially less transparent than the last primary round.
  claimRefs:
  - CO016
  - CO018
  - CO019
  - CO020
  - CO021
- calloutType: insight
  title: The company is evolving from tracing specialist into broader risk infrastructure
  body: |-
    The Hexagate and Alterya deals, plus partnerships spanning procurement, compliance, and litigation support, show a deliberate move from post-incident blockchain tracing toward a broader prevention and enterprise-risk platform. That strategic widening is probably the most important post-2022 company-development fact for later chapters.
  claimRefs:
  - CO033
  - CO035
  - CO036
  - CO037
  - CO038
  - CO039
