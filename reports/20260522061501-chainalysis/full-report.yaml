      - number: '2.3'
        title: Buyers are split between public-sector urgency and private-sector workflow integration
        blocks:
          - type: paragraph
            body: >
              Public-sector demand is anchored in mission urgency. FATF, Treasury, Chainalysis, and TRM all point to a
              market in

              which sanctions evasion, DPRK-linked theft, stablecoin-enabled laundering, and cross-border VASP
              supervision have

              become standing operating problems rather than episodic edge cases. Law-enforcement and national-security
              buyers use

              analytics to trace flows, build evidentiary chains, and coordinate seizures; regulators and FIUs use
              similar data to

              test Travel Rule compliance, monitor licensing obligations, and supervise high-risk or offshore actors.
              Those buyers

              care most about attribution quality, evidentiary defensibility, chain and bridge coverage, sanctions
              intelligence,

              and the ability to collaborate across agencies.


              Private-sector demand looks different. Exchanges and payment firms buy to reduce false positives, satisfy
              licensing

              commitments, file defensible reports, and keep fraud, sanctions, and counterparty risk inside operating
              tolerances.

              Banks, custodians, and stablecoin issuers increasingly care about integrating blockchain intelligence into
              existing

              sanctions, payments, and custody stacks as U.S. and global policy barriers fall. Asset managers and wealth
              platforms

              care less about reactive investigations than about onboarding, treasury, collateral, and tokenized-asset
              workflows

              that now need the same auditability and governance standards as traditional finance. Across these
              segments, buying

              criteria converge on chain coverage, cross-chain intelligence, workflow integration, audit trails, and
              proof that the

              tool improves risk-adjusted operating efficiency rather than simply adding another alert queue.
