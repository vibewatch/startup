  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Recommendation follows a simple chain: public ARR support and strategic relevance add value, while disclosure gaps
      and concentration apply the discount.
    approximationNotes: >-
      This is a logic bridge rather than a quantified forecast; it shows the valuation decision path, not weighted
      probabilities.
    data:
      nodes:
        - id: history
          label: Historical round proof
          description: Series E at $4.2B and Series F at ~$8.6B prove prior investor appetite, but only as historical anchors.
        - id: currentmark
          label: Current secondary marks
          description: Yahoo, Forge, and Hiive imply a much lower ~$1.3B zone and a large liquidity discount.
        - id: arr
          label: Supported ARR range
          description: >-
            Public evidence still clusters around ~$190M ARR in 2023 and ~$250M projected for 2024, with only
            directional 2025 acceleration.
        - id: discounts
          label: Quality discounts
          description: >-
            Government concentration, CEO transition, and private debt terms all cap how much multiple expansion is
            deserved.
        - id: comps
          label: Comparable band
          description: >-
            TRM and Elliptic mark the direct-peer floor, while Recorded Future and Cellebrite frame strategic and public
            comparables.
        - id: decision
          label: Research-more, price-sensitive
          description: Fair-to-attractive near true 2026 marks; stretched if sellers still anchor near the older $2.5B level.
      edges:
        - from: history
          to: currentmark
          label: resets into
        - from: currentmark
          to: decision
          label: sets entry zone
        - from: arr
          to: decision
          label: translates into EV/ARR
        - from: discounts
          to: decision
          label: forces discount
        - from: comps
          to: decision
          label: bounds upside
        - from: arr
          to: comps
          label: anchors comp placement
