chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, roots, and what Chainalysis actually sells
        blocks:
          - type: paragraph
            body: >-
              Chainalysis is easiest to understand as infrastructure rather than as a single compliance tool. Its own
              company and product pages describe a blockchain data platform that serves government investigators,
              exchanges, financial institutions, and cybersecurity teams in more than 70 countries. The current public
              identity is clearly New York headquartered: Craft lists the headquarters at 114 Fifth Avenue in Manhattan,
              while independent legal coverage and current press materials repeatedly frame the business as a New York
              blockchain-data company. At the same time, the company’s roots are meaningfully Nordic. Public profiles
              identify Michael Gronager and Jan Møller as Danish co-founders, and Craft shows an active Copenhagen
              office, so “New York HQ with Copenhagen roots” is a more accurate description than a dual-headquarters
              narrative.


              Product scope has broadened well beyond the early Bitcoin-tracing origin story. Reactor anchors the
              investigations franchise, KYT anchors transaction monitoring and compliance, and the broader solutions
              stack now spans intelligence, risk screening, and fraud prevention. Sacra’s description of pricing and
              deployment makes the business model look like enterprise SaaS wrapped around a proprietary data layer:
              customers buy software access, seats, data depth, and workflow integration rather than a transactional
              retail product. The more recent Alterya and Hexagate acquisitions matter because they move Chainalysis
              from post-incident tracing toward a fuller prevention-plus-compliance-plus-investigation stack. That
              matters for diligence because it expands TAM and strategic relevance, but it also makes current product
              boundaries more dynamic than the company’s early reputation suggests.
