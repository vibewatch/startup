  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory fragmentation and policy dependence cut both ways
        blocks:
          - type: paragraph
            body: >-
              Global policy is still a moving target, which helps explain why Chainalysis can win work and why that same
              work can remain fragile. FATF and the FSB both say implementation remains incomplete, uneven, and
              vulnerable to arbitrage. The EU is still operationalizing MiCA through delegated acts, GAO still sees U.S.
              oversight and coordination gaps, and the White House and OCC have both shifted the American operating
              environment in ways that can simultaneously enlarge the addressable market and change how customers buy.
              This matters because Chainalysis is not just exposed to “more crypto” or “less crypto.” It is exposed to
              where enforcement power, bank participation, and cross-border supervision sit at any moment. If regulation
              fragments further, buyers need more customization, more jurisdiction-specific rule content, and more
              services. If rules converge and large institutions grow more comfortable owning their own digital-asset
              controls, the same policy progress can support internal tooling, multi-vendor stacks, or pricing pressure.
              In other words, policy is not simply a tailwind; it is a source of both demand creation and substitution
              risk.
            claimRefs:
              - CR001
