      - number: '1.4'
        title: Adverse markers, credibility debates, and the metrics that still require diligence
        blocks:
          - type: paragraph
            body: >-
              There are two distinct adverse threads that later chapters should carry forward. The first is
              business-model stress. In 2023 Chainalysis cut about 150 jobs from a workforce of roughly 900 and
              explicitly reoriented toward profitability and more stable government contracting. That does not look
              existential, but it does show that commercial crypto demand can soften fast enough to force operating
              resets. The second thread is epistemic rather than financial: Chainalysis markets its tools as
              independently validated and court-admissible, yet ChainArgos’s October 2025 Bitcoin Fog critique argued
              that some attribution techniques were unscientific or misapplied in litigation. A 2025 USENIX paper pulls
              in the opposite direction by finding low false-positive rates and strong lower-bound accuracy on sampled
              illicit-service datasets. The right conclusion is not that one side “wins,” but that data-quality claims
              and courtroom attribution claims should not be treated as identical.


              Public metrics also remain incomplete in ways that matter. Headcount is bounded but not verified for 2026,
              the exact Fabrica secondary economics are hidden behind market-data gates, and the Hercules credit terms
              are not publicly filed in a way that investors can inspect. Those are not fatal gaps for chapter one,
              because the company’s identity, customer relevance, and capital history are clear enough to establish
              canonical context. They do, however, narrow the confidence one should place on any precise valuation,
              leverage, or margin story built solely from public evidence.
            claimRefs:
