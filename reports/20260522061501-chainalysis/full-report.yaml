    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >-
      A typical investigation or compliance loop starts with screening or triage, escalates into graph analysis, and
      ends in a real-world action or freeze decision.
    data:
      nodes:
        - id: signal
