      - number: '3.4'
        title: Durability comes from trust and workflow embedding, but the low end can still commoditize
        blocks:
          - type: paragraph
            body: >-
              The moat case for Chainalysis is strongest when the job requires regulator trust, evidentiary
              documentation, and broad referenceability across law enforcement, regulators, and major exchanges. That is
              why the company still looks hardest to displace in the highest-trust segment even though TRM and Elliptic
              are credible challengers. TRM's best attack vector is modern AI-enabled investigations and a strong
              public-private mission narrative. Elliptic's is institutional finance readiness and global bank-facing
              coverage. Merkle's is agile behavior-based monitoring. Those are real threats, but they are not identical
              threats: they each compete hardest in different corners of the workflow stack.


              The adverse evidence matters because it shows where durability weakens. State of Surveillance frames the
              entire category as surveillance infrastructure and questions heuristic certainty. ChainAware argues that
              parts of the market are being sold oversized compliance stacks for the wrong job. ChainGain shows that
              buyers can now choose between free baselines, budget self-serve tools, and expensive enterprise suites.
              CipherTrace's retrenchment is a reminder that distribution alone does not guarantee product momentum after
              acquisition. The likely win-loss pattern is therefore nuanced. Chainalysis probably wins when the buyer
              wants the safest institutional answer, especially in public sector, exchange compliance, and high-stakes
              investigations. TRM or Elliptic are best placed to win when AI-first workflows, bank-grade compliance
              automation, or newer institutional rails matter more. Nansen and lighter substitutes can win whenever the
              buyer's core need is research speed rather than regulator-facing proof. Investors should treat
              Chainalysis's moat as durable but segmented, not universal.
