  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what spend belongs in-scope
        blocks:
          - type: paragraph
            body: >
              The cleanest way to frame Chainalysis's addressable market is not “all crypto infrastructure” but the
              narrower

              category where blockchain analytics, transaction monitoring, sanctions screening, Travel Rule
              interoperability, and

              investigation tooling intersect. Third-party category reports define that market around blockchain
              forensics,

              compliance data management, risk assessment, smart-contract auditing, and transaction monitoring sold into
              exchanges,

              banks, compliance firms, regulators, and law-enforcement agencies. That boundary matters because it
              excludes large

              pools of adjacent spend — custody, trading infrastructure, mining hardware, core payments processing,
              generic KYC,

              and general-purpose bank AML systems that do not need chain-native entity resolution or cross-chain
              tracing.


              The status quo is also more nuanced than “buy a competitor or do nothing.” Public-sector users can rely on
              internal

              investigative teams and fragmented agency tools; exchanges can bolt crypto overlays onto generic AML
              stacks; banks

              can try to internalize monitoring inside broader sanctions, payments, or custody programs; and many buyers
              still run

              manual case management around SAR filing and wallet screening. The result is a category where the
              differentiated

              product is not merely a database of risky addresses but a workflow engine that combines chain coverage,
              entity

              attribution, case management, sanctions context, and evidence quality that can survive audits, enforcement
              reviews,

              and courtroom scrutiny.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
