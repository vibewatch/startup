  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Supporting evidence
      - Threat
      - Severity
      - Likely win / loss implication
      - Diligence ask
    rows:
      - - Public-sector trust and referenceability
        - 45+ regulators, courtroom and evidence-quality framing, major law-enforcement outcomes
        - TRM expands public-sector proof and AI-first messaging
        - High
        - >-
          Chainalysis should keep advantage where the buyer wants the safest institutional answer; TRM narrows the gap
          on new procurements
        - Request win-loss examples in government and national-security accounts from the last 12 months
      - - Exchange and regulated-institution penetration
        - 9/10 top exchanges and broad financial-institution messaging
        - Elliptic and TRM are also selling bank and exchange compliance stacks
        - High
        - Chainalysis keeps incumbency value, but rivals can win on workflow modernization or geography
        - Compare renewal rates and displacement reasons among top exchange and bank accounts
      - - Embedded workflow and switching costs
        - Monitoring, tracing, audit trails, and case workflows raise migration cost
        - Multi-homing and modular procurement let buyers add substitutes at the edge
        - Medium
        - Full rip-and-replace may be rare, but seat and module expansion can slow if buyers mix tools
        - Map where buyers run one platform exclusively versus two or more in parallel
      - - AI and automation credibility
        - Chainalysis, TRM, Elliptic, and Merkle all use AI-first language now
        - AI becomes table stakes rather than differentiator
        - Medium
        - >-
          Marketing parity can compress pricing unless one vendor proves measurably better alert handling or
          investigator speed
        - Ask for pilot metrics on false positives, analyst hours saved, and alert-resolution time
      - - Low-end pricing umbrella
        - Nansen and free or budget trackers give buyers a much cheaper discovery layer
        - Research jobs get unbundled from compliance jobs
        - Medium
        - Chainalysis can lose lightweight analyst spend even when it retains core compliance budget
        - 'Segment seat counts by user type: investigators, compliance ops, and market-intelligence researchers'
      - - Category legitimacy and privacy backlash
        - Surveillance and heuristic-accuracy critiques continue to circulate
        - Trust claims face scrutiny in court, privacy debate, or DeFi-native markets
        - Medium
        - >-
          Backlash is unlikely to kill enterprise demand, but it can slow adoption in privacy-sensitive or
          protocol-native segments
        - >-
          Review courtroom references, third-party audits, and how each vendor handles disputed labels or false-positive
          appeals
    notes: >-
      Severity reflects competitive relevance to Chainalysis, not existential company risk. The register intentionally
      mixes direct rival threats with substitute and category-level pressure.
