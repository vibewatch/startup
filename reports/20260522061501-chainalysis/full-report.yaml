      - number: '2.2'
        title: Sizing the market requires multiple lenses rather than one headline TAM
        blocks:
          - type: paragraph
            body: >
              Public estimates support a large and fast-growing category, but they do not describe the same market.
              Research and

              Markets and GII Research both describe a broad crypto compliance and blockchain analytics market that
              grows from

              roughly $2.9 billion in 2025 to $3.64 billion in 2026 and $14.63 billion by 2032. Tokenization Compliance
              uses a

              narrower definition centered on crypto-specific compliance technology and arrives at a materially smaller
              market:

              about $2.1 billion in 2025 and $2.78 billion in 2026. Within that narrower view, blockchain analytics and

              transaction monitoring are the largest slice at about $820 million in 2025, implying that the subsegment
              most

              directly aligned with Chainalysis is already substantial but still far smaller than the broadest category
              headline.


              The more important conclusion is qualitative: demand intensity is being pulled by both adoption and risk.
              Chainalysis

              and TRM each describe record illicit volumes in 2025, while Chainalysis's geography and adoption work
              shows that

              institutional participation, regional on-chain volumes, and stablecoin use cases are broadening at the
              same time.

              That means the market cannot be sized responsibly from one analyst PDF alone. A defensible view combines
              category

              revenue estimates, illicit-flow intensity, institutional adoption, and regional licensing rollout — and
              still has to

              admit that no public source cleanly isolates Chainalysis's exact SAM or obtainable share.
