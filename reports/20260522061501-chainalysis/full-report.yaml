  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer proof is broad across buyer types, but the top-line counts are still mostly vendor-curated
        blocks:
          - type: paragraph
            body: >-
              The public customer record is broad enough to establish real demand. Chainalysis' own current surfaces say
              more than 1,500 organizations trust the platform, customers span 70 countries, and over 50 regulators or
              FIUs use the product. The mix on those same surfaces is not a generic logo wall: public-sector
              investigations, regulator supervision, exchange compliance, bank onboarding, payment and stablecoin
              controls, and source-of- wealth workflows all show up as concrete use cases. The important underwriting
              nuance is that the top-line counts remain mostly vendor-curated. The best independent cross-check in the
              retained set is adverse rather than promotional: State of Surveillance describes Chainalysis as the
              dominant surveillance vendor, says it has worked with 370 public-sector agencies and more than 1,100
              private companies, and says government contracts now make up the majority of sales. That does not
              contradict the vendor's 1,500-plus framing, but it does move the reader away from an undifferentiated
              customer-count story and toward a mix story. In practice, the company appears strongest where buyers need
              evidentiary tracing, regulator-ready reporting, and procurement fit, while the weakest part of the public
              record is still the commercial shape of the installed base: how much ARR sits in government versus private
              accounts, which cohorts renew, and how much wallet or transaction volume sits behind the named logos.
