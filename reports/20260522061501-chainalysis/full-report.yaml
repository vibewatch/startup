            body: >-
              The strengths are real, but this is not a clean technology-only moat. Chainalysis has a credible public
              case for accuracy and legal defensibility: its own data-quality page ties the platform to peer-reviewed
              work and to courtroom survival under Daubert. Yet the underlying academic paper is more nuanced than the
              marketing shorthand, showing wide variation in lower-bound coverage across cases and time. Adversarial
              legal filings go further, arguing that validated clustering rates do not automatically prove contested
              ownership attributions and complaining that proprietary heuristics remain opaque to defendants. Those
              disputes matter because Chainalysis increasingly wants customers to trust automation, from Rapid's AI
              summaries to Hexagate's exploit prevention and 2026 AI agents. Public evidence supports the direction of
              travel — especially the 2025 Alterya and Hexagate expansion and the 2026 agent narrative — but independent
              benchmarking of precision, false positives, and time-saved on the newest features remains thin. The same
              caution applies to privacy-preserving ecosystems and legacy labels. Public reviews still describe Kryptos
              and Storyline, and the security policy still names kryptos.chainalysis.com, yet the current sitemap and
              marketing surface emphasize the newer bundle of VASP Risking, Sentinel, DS, Rapid, Alterya, and Hexagate
              instead. Underwriting-wise, the company looks strongest where buyers value workflow breadth, public-sector
              fit, and defensible evidence; it looks weaker where buyers need open developer proof, transparent
              heuristics, or precise public boundaries around privacy-coin handling.
