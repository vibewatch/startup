      - number: '1.3'
        title: Funding history, valuation reset, and milestone sequence
        blocks:
          - type: paragraph
            body: >-
              Chainalysis’s capital story is no longer a straight-line up-and-to-the-right venture narrative. The public
              record shows a clear rise from the $4.2 billion Series E in June 2021 to the $8.6 billion Series F in May
              2022, with GIC leading that later round and existing investors plus strategic names such as BNY Mellon
              participating. Market-data providers now place lifetime funding at roughly $536.6 million, which is enough
              to establish Chainalysis as a heavily financed late-stage private software company. But the more important
              newer signal is the reset. TechCrunch and Sacra both describe 2024-2025 secondary activity implying a
              valuation closer to $2.5 billion, and CB Insights records a March 19, 2025 secondary involving Fabrica
              Ventures. That is a material rerating from the 2022 peak, even if the exact Fabrica pricing is not
              publicly visible in open snippets.


              The October 2025 Hercules financing adds another layer: Chainalysis is now comfortable using non-dilutive
              capital to fund AI investment and expansion after a period of acquisitions. Official disclosure confirms
              the financing exists and that it followed three acquisitions in eight months, but the public file stops
              short of revealing exact facility terms. Milestones across partnerships and product scope reinforce the
              same pattern. Four Inc. expanded federal-channel access in 2023, AlixPartners deepened litigation and
              compliance-services reach in 2024, and the Hexagate and Alterya deals pushed Chainalysis closer to a
              broader risk-and-prevention platform. The chronology now supports a simple conclusion: Chainalysis remains
              strategically relevant and operationally active, but its valuation and capital stack have become more
              nuanced than the 2021-2022 boom-era story.
