  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio breadth now covers triage, monitoring, investigation, and prevention
        blocks:
          - type: paragraph
            body: >-
              Chainalysis no longer presents itself as a niche blockchain-forensics vendor. The 2026 official surface
              reads like an operating suite for the full crypto-intelligence loop: front-line triage through Rapid,
              deeper graph analysis and case management through Reactor, seizure-time artifact review through Wallet
              Scan, transaction monitoring through KYT, wallet risk review through Address Screening, entity diligence
              through VASP Risking, issuer monitoring through Sentinel, custom analytics through Data Solutions, and
              preventive layers through Alterya and Hexagate. That breadth matters because customer workflows are no
              longer purely reactive. A compliance team may score a transfer in KYT, escalate the suspicious pattern
              into Reactor, and then use services staff or token controls to freeze or pursue funds. Likewise, a
              government team can start with Rapid in the field, validate seed phrases offline with Wallet Scan, and
              hand a trace into a full investigative workflow without leaving the platform family. The portfolio
              expansion also explains why Chainalysis now talks about stablecoin risk, fraud prevention, and web3
              security in the same breath as classic investigations: the goal is to own more of the decision chain
              before and after suspicious activity, not just the charting interface investigators see at the end.
