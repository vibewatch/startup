      - number: '6.4'
        title: Durability is plausible, but concentration and retention are still private
        blocks:
          - type: paragraph
            body: >-
              The adverse record does not disprove product-market fit, but it does make clear where underwriting risk
              sits. State of Surveillance explicitly frames Chainalysis as a surveillance vendor and cites Coinbase's
              "financial ankle monitor" critique, showing that success with governments and compliance buyers can
              intensify privacy backlash. The USENIX paper is more balanced, finding Chainalysis can provide a reliable
              lower bound with very low false positives in the seized illicit-service cases studied, but also noting
              that coverage changes over time and that generalization is difficult. Those sources matter for customers
              because many of the best-funded buyers—federal agencies, regulators, and banks—care not just that the
              product works, but that it remains defensible in court, supervision, and public debate. The bigger
              commercial problem is simpler: retention and concentration are still private. No retained source discloses
              NRR, GRR, logo churn, standard contract length, top-customer exposure, or agency-by-agency revenue
              dependence. Carahsoft shows why public-sector reach can scale quickly through contract vehicles, but that
              same channel structure can obscure realized ACV and direct-versus-indirect economics. So the customer
              chapter lands positive on reality of deployment and weak on portfolio transparency. Chainalysis looks well
              embedded in real workflows; it does not look publicly modelable enough yet on renewal quality, customer
              concentration, or the exact degree to which public-sector demand dominates the book.
