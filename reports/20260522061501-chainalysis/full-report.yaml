      - number: '7.3'
        title: Government concentration, stronger rivals, and internal build-outs pressure the model
        blocks:
          - type: paragraph
            body: >-
              The public record increasingly supports a concentration-risk reading. The visible IRS award trail, the
              breadth of Carahsoft and Four contract vehicles, and Forbes’ 70% public-sector mix all point in the same
              direction: Chainalysis has found stability by leaning harder into government and regulator demand as
              commercial crypto demand weakened. That helped it survive the crypto winter, but it also means procurement
              timing, agency budgets, and policy posture now matter more than they did when the company was marketed as
              a broad private-sector compliance winner. At the same time, rivals are not starving. TRM and Elliptic both
              raised meaningful capital in 2026, and Elliptic is explicitly teaching banks how to operationalize
              blockchain analytics inside their own case-management environments. That is not just classic vendor
              competition; it is a blueprint for workflow internalization. Internally, the company also carries
              execution risk. Chainalysis cut more than 15% of staff in 2023, then lost its founding CEO in late 2024.
              Jonathan Levin may be a credible operator, but deeper government focus, multiple acquisitions, and a
              still-private organization chart make retention and integration core diligence items rather than
              background noise.
