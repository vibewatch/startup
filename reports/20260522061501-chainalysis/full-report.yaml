  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Chainalysis layers a shared intelligence and control plane beneath multiple product workflows, then sells
      deployment and expert-services wrappers on top.
    data:
      layers:
        - id: data-sources
          label: Data acquisition and ground truth
          detail: >-
            Observed service attributions, OSINT, seized-data learnings, sanctions or scam identifiers, and customer or
            partner inputs that anchor entity labels.
        - id: intelligence-engine
          label: Intelligence engine
          detail: >-
            Generalized chain adapters, token support, clustering heuristics, service-specific heuristics, and
            Signals-style context that translate raw activity into reusable intelligence.
        - id: automation-plane
          label: Automation and analytics plane
          detail: >-
            KYT or screening APIs and webhooks, Data Solutions SQL and notebooks, no-code workflows, bulk exports,
            Gatelang monitors, and autotracing logic.
        - id: applications
          label: User-facing applications
          detail: >-
            Reactor, Rapid, Wallet Scan, Address Screening, VASP Risking, Sentinel, DS dashboards, Alterya, and
            Hexagate.
        - id: deployment-services
          label: Deployment, assurance, and services
          detail: >-
            Cloud, on-premises, FedRAMP or government environments, procurement rails, training, and embedded services
            that operationalize the product family.
    approximationNotes: >-
      This architecture is synthesized from official product pages, partner documentation, and platform disclosures;
      Chainalysis does not publish one canonical end-to-end diagram.
    claimRefs:
      - CE001
      - CE003
      - CE017
      - CE023
      - CE025
      - CE029
      - CE030
