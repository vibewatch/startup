      - number: '3.2'
        title: Product overlap is real, but the strongest proofs are not evenly distributed
        blocks:
          - type: paragraph
            body: >-
              At the feature level, Chainalysis, TRM, Elliptic, and Merkle all present variants of the same enterprise
              story: investigation tooling, transaction monitoring, sanctions or risk screening, and workflows for
              regulated institutions. The difference is the proof layer. Chainalysis combines official claims about
              top-exchange penetration, regulator footprint, Reactor counterparties, and KYT monitoring with a repeated
              'court admissible' or evidence-quality framing. TRM makes the strongest direct challenge because it spans
              law enforcement, defense and intelligence, banks, exchanges, and cybersecurity while leaning hard into AI
              agents and public-private threat response. Elliptic is narrower in tone but strong in banking and payments
              language, stablecoin and tokenized-asset risk, and internationally distributed institutional presence.
              Merkle has credible product overlap—especially behavior-based monitoring, cross-chain tracing, and faster
              asset-coverage messaging—but public scale markers remain smaller.


              Nansen sits outside that cluster. Its official and review surfaces are built around smart-money labels,
              research, execution, and portfolio monitoring for traders and funds. That makes it a meaningful substitute
              for crypto-native analysts who might otherwise buy limited seats from an enterprise vendor for exploratory
              work, but it is not evidence-backed as a public-sector or bank-compliance leader. CipherTrace under
              Mastercard also no longer looks like a clean head-to-head peer in the way it once might have. The retained
              sources are better at showing acquisition logic and retrenchment than current product momentum. The result
              is a market where feature checklists alone overstate parity: several firms can plausibly say they do
              'blockchain analytics,' but far fewer can show the same depth of regulated reference points.
