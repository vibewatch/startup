            body: >-
              Public-sector proof goes well beyond a marketing claim that agencies use the software. IRS-CI says the
              relationship covers platform access, training, pilot projects, and expert support, and USAspending shows
              both a Treasury award titled "PILOT IRS CRYPTOCURRENCY TRACING" and a separate IRS Criminal Investigation
              support- services contract with multiple funded modifications through 2025. State and local proof is also
              operational, not abstract. Calgary Police Service and Chainalysis jointly announced a blockchain
              investigations team and a Western Canada training centre, while Calgary's customer story says the tools
              reduced viability assessments from days to hours. Connecticut State Police says Chainalysis helped trace a
              pig-butchering case with losses above $1 million to a real-world entity that could be served with legal
              process, and Chainalysis keeps that quote live on its current government page. The named case-outcome
              references deepen the pattern. Chainalysis says its tools aided the FBI in the Colonial Pipeline case and
              its 2024 congressional testimony repeats that claim; the same investigations page ties
              Chainalysis-supported work to the Bitcoin Fog conviction alongside DOJ, IRS-CI, FBI, and Europol, and to
              the LockBit disruption alongside NCA, DOJ, FBI, and OFAC-linked sanctions activity. The result is a strong
              public case that government demand is not just for software seats but for a combined package of data,
