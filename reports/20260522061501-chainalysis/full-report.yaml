  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Why it matters
      - Action implication
    rows:
      - - Current ARR misses the public band
        - Verified ARR lands materially below the $190M-$250M frame
        - The whole valuation range depends on at least that scale being real.
        - Reset base and bear cases downward immediately.
      - - Government mix rises further
        - Public-sector revenue remains ~70% and commercial growth does not reaccelerate
        - The company starts to look more like a concentrated contractor than a balanced software platform.
        - Demand a lower multiple or walk away.
      - - Debt constraints are tighter than expected
        - Hercules docs reveal restrictive covenants, expensive pricing, or acquisition limits
        - Senior secured debt can cap strategic flexibility even if headline size is modest.
        - Treat leverage as a real downside multiplier.
      - - Secondary market is not actually executable
        - Quoted 2026 marketplace prices cannot be transacted at size
        - The attractive entry case depends on real liquidity near those marks.
        - Do not underwrite upside off teaser prices.
      - - Governance keeps moving
        - Further senior turnover or evidence of board-level instability
        - Execution discount expands when leadership is still settling.
        - Require more discount or delay the trade.
    notes: Kill criteria intentionally tie valuation failure to observable facts rather than to generic market noise.
    claimRefs:
      - CV022
      - CV024
      - CV025
      - CV038
      - CV043
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Current ARR and segment mix
        - Current ARR, public/private split, and contribution from Alterya / Hexagate
        - This determines whether 2025 acceleration deserves an upgraded multiple.
        - Request current board pack or CFO diligence deck.
      - - Debt package
        - Executed Hercules agreement, pricing, covenants, draw schedule, and collateral
        - Debt can be harmless optionality or hidden constraint; the current public record cannot distinguish the two.
        - Request treasury schedule and the signed credit agreement.
      - - Cap table and preferences
        - Current share count, preference stack, and any liquidation overhang since Series F
        - Marketplace share prices mean little without the current denominator and preference order.
        - Request cap table, charter summary, and any post-2022 amendments.
      - - Retention and cohort quality
        - NRR, logo retention, sales-cycle data, and commercial cohort growth through 2025-2026
        - A government-heavy mix can stabilize revenue while still capping long-term multiple expansion.
        - Request cohort tables by customer segment.
      - - Exit readiness
        - Concrete IPO workstreams, banker engagement, or strategic inbound evidence
        - The upside case partly relies on narrowing the liquidity discount via exit optionality.
        - Ask management and major investors how they rank IPO versus strategic paths.
    notes: Each ask is framed as a document request or management diligence item that can directly move the valuation view.
    claimRefs:
      - CV008
      - CV022
      - CV035
      - CV036
      - CV047
