companyProfile:
  summary: >-
    Chainalysis 是一家总部位于 New York、根基来自 Copenhagen 的区块链情报平台，2014 年由 Michael Gronager、Jan Møller 和 Jonathan Levin
    创立。公司向政府机构、交易所、金融机构和网络安全团队销售调查、合规与欺诈预防产品，并配套数据、服务和研究，客户覆盖 70 多个国家。公司累计融资约 $536.6M，最近披露的一轮是 2022 年估值 $8.6B 的 $170M
    Series F；行业重置之后，私募市场定价看起来更接近 ~$2.5B。公开证据支持公司已有真实规模和战略价值，但私有财务披露仍不完整。
