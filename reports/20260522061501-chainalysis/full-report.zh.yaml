      - number: '1.2'
        title: 领导层交接、治理可见度与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              领导层在 2024 年底成为一级尽调议题。Chainalysis 2024 年 12 月的官方公告称，Jonathan Levin 于 2024 年 12 月 3 日升任 CEO，Michael Gronager
              离开公司和董事会，Paul Auvil 加入董事会并担任独立董事和审计委员会主席。官方交接很重要：公司同时移出一位创始人 CEO，提拔一位同时懂产品和政策的创始人型经营者，并部分刷新董事会监督。公司后来在
              2026 年任命 Sebastien Giroux 为 CFO，也是在估值纪律、债务能力和收购整合比单纯增长更重要的节点补强财务班底。

              公开治理可见度仍不完整。官方来源确认 Levin 和 Auvil 的治理角色，也确认 Gronager
              离开，但没有给出完整现任董事会名单或投资人权利图谱。因此，本章可以有把握地说治理已经变化，却不能说外部观察者已经能充分评估独立性、委员会平衡或继任安排。关键人风险仍然存在。Levin
              现在集创始人身份、产品能力、市场信誉和 CEO 权力于一身。Jan Møller
              仍是公司起源叙事的重要人物，但在当前公开材料中可见度较低。结果是：公司看起来补强了高管团队，但围绕少数深度专业领导者的集中风险仍未消失。
