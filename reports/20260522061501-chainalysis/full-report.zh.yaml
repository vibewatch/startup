  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合现在覆盖分流、监测、调查和预防
        blocks:
          - type: paragraph
            body: >-
              Chainalysis 已不再把自己呈现为小众区块链取证供应商。2026 年的官方呈现更像一套覆盖完整加密情报闭环的运营套件：Rapid 负责一线分流，Reactor 负责更深的图谱分析和案件管理，Wallet
              Scan 负责查扣现场的物件审查，KYT 负责交易监测，Address Screening 负责钱包风险检查，VASP Risking 负责实体尽调，Sentinel 负责发行方监测，Data Solutions
              负责定制分析，Alterya 和 Hexagate 则提供预防层。这个广度很重要，因为客户工作流已经不再纯粹事后响应。合规团队可以在 KYT 里给一笔转账打分，把可疑模式升级到
              Reactor，再用服务人员或代币控制冻结或追回资金。政府团队同样可以先在现场用 Rapid，离线用 Wallet Scan
              验证助记词，再把追踪交给完整调查工作流，全程不用离开平台家族。产品组合扩张也解释了为什么 Chainalysis 现在把稳定币风险、欺诈预防和 web3
              安全与传统调查放在同一套叙事里：目标是在可疑活动前后占住更多决策链，而不只是占住调查人员最后看到的制图界面。
