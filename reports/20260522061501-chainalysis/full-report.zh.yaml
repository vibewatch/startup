            body: >-
              公共部门证据不只是“机构在用软件”的营销说法。IRS-CI 称，双方关系覆盖平台访问、培训、试点项目和专家支持；USAspending 也显示，一项 Treasury 合同名为 “PILOT IRS
              CRYPTOCURRENCY TRACING”，另有一份 IRS Criminal Investigation 支持服务合同，并在 2025
              年前多次获得经费修改。州和地方层面的证据同样是实操，而非抽象背书。Calgary Police Service 与 Chainalysis 共同宣布成立区块链调查团队和加拿大西部培训中心；Calgary
              的客户案例称，工具把可行性评估从数天压缩到数小时。Connecticut State Police 称，Chainalysis 帮助追踪一起损失超过 $1 million
              的“杀猪盘”案件，并定位到可送达法律程序的现实实体；Chainalysis 仍把这段引用放在当前政府页面上。具名案件结果进一步强化了这一模式。Chainalysis 称，其工具在 Colonial
              Pipeline 案中协助 FBI，2024 年国会证词也重复了这一说法；同一调查页面还把 Chainalysis 支持的工作分别与 Bitcoin Fog 定罪（并列 DOJ、IRS-CI、FBI 和
              Europol）以及 LockBit 打击行动（并列 NCA、DOJ、FBI 和 OFAC 相关制裁活动）联系起来。结论很强：政府需求买的不只是软件席位，而是一整套数据、培训、调查工作流和嵌入式任务支持。
