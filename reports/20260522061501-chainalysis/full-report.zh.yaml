  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 重要性
      - 行动含义
    rows:
      - - 当前 ARR 低于公开区间
        - 经核实 ARR 明显低于 $190M-$250M 框架
        - 整个估值区间都依赖至少这个规模为真。
        - 立即下调基准和悲观情景。
      - - 政府占比进一步上升
        - 公共部门收入仍约 ~70%，商业增长没有重新加速
        - 公司开始更像客户集中的承包商，而不是均衡的软件平台。
        - 要求更低倍数，否则放弃。
      - - 债务限制严于预期
        - Hercules 文件显示限制性契约、高成本定价或收购限制
        - 即使账面规模不大，优先担保债也会压住战略灵活性。
        - 把杠杆视为真实的下行放大器。
      - - 老股市场并不能实际成交
        - 2026 年市场平台报价无法以足够规模成交
        - 有吸引力的入场逻辑依赖这些估值附近的真实流动性。
        - 不要用诱导性报价来测算上行。
      - - 治理继续摇摆
        - 更多高管变动，或出现董事会层面不稳的证据
        - 领导层仍在磨合时，执行折价会扩大。
        - 要求更大折价，或推迟交易。
    notes: 否决标准有意把估值失败绑定到可观察事实，而不是泛泛的市场噪音。
    claimRefs:
      - CV022
      - CV024
      - CV025
      - CV038
      - CV043
      - CV046
  - id: TV006
    title: 最终尽调索取表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 当前 ARR 和细分结构
        - 当前 ARR、公共 / 私营拆分，以及 Alterya / Hexagate 贡献
        - 这决定 2025 年加速是否值得上调倍数。
        - 索取最新董事会材料或 CFO 尽调材料。
      - - 债务包
        - 已签署的 Hercules 协议、定价、契约、提款计划和抵押品
        - 债务可能是无害的可选资金，也可能是隐藏约束；当前公开记录无法区分两者。
        - 索取资金计划表和已签署信贷协议。
      - - 股权结构表和优先权
        - 当前股数、优先股堆叠，以及 Series F 以来的任何清算悬挂
        - 没有当前股本分母和优先顺序，市场平台每股价格意义不大。
        - 索取股权结构表、章程摘要，以及 2022 年后的任何修订。
      - - 留存与队列质量
        - NRR、客户数留存、销售周期数据，以及 2025-2026 年商业队列增长
        - 政府占比高可以稳定收入，但仍会压住长期倍数扩张。
        - 索取按客户细分拆分的队列表。
      - - 退出准备度
        - 具体 IPO 工作流、投行接触，或战略买方主动接洽证据
        - 上行情景部分依赖通过退出可选性收窄流动性折价。
        - 询问管理层和主要投资人如何排序 IPO 与战略退出路径。
    notes: 每个问题都被设定为文件请求或管理层尽调项，可直接推动估值判断。
    claimRefs:
      - CV008
      - CV022
      - CV035
      - CV036
      - CV047
