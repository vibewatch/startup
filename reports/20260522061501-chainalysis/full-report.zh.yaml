chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、根基，以及 Chainalysis 实际卖什么
        blocks:
          - type: paragraph
            body: >-
              理解 Chainalysis，最好的切入点不是把它看成单一合规工具，而是基础设施。公司和产品页面把它描述为区块链数据平台，服务政府调查人员、交易所、金融机构和网络安全团队，覆盖 70
              多个国家。当前公开身份很明确：Craft 显示总部在 Manhattan Fifth Avenue 114 号，独立法律报道和最新新闻材料也反复把它定义为一家 New York
              区块链数据公司。与此同时，公司的根基明显带有北欧色彩。公开资料显示 Michael Gronager 和 Jan Møller 是丹麦籍联合创始人，Craft 也显示公司在 Copenhagen
              仍有办公室，因此「New York 总部、Copenhagen 根基」比「双总部」叙事更准确。

              产品范围已经远远超出早期 Bitcoin 追踪故事。Reactor 托住调查业务，KYT 托住交易监测和合规，整个解决方案栈现在覆盖情报、风险筛查和欺诈预防。Sacra
              对定价和部署的描述显示，这是一门围绕自有数据层展开的企业 SaaS 生意：客户买的是软件访问、席位、数据深度和工作流集成，而不是交易型零售产品。近期收购 Alterya 和 Hexagate 很关键，因为
              Chainalysis 正从事后追踪走向预防 + 合规 + 调查的完整栈。尽调里，这扩大了 TAM 和战略价值，也让当前产品边界比早期声誉所暗示的更动态。
