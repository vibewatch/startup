      - number: '2.3'
        title: 买方分成公共部门紧迫性和私营部门工作流集成两类
        blocks:
          - type: paragraph
            body: >-
              公共部门需求由任务紧迫性托住。FATF、Treasury、Chainalysis 和 TRM 都指向同一个市场：制裁规避、DPRK 相关盗窃、稳定币洗钱和跨境 VASP
              监管，已经从偶发边缘事件变成常态化运营问题。执法和国家安全买方用分析工具追踪资金流、构建证据链并协调查扣；监管机构和 FIU 用类似数据测试 Travel Rule
              合规、监控牌照义务，并监督高风险或离岸主体。这些买方最看重归因质量、证据可辩护性、链和桥覆盖、制裁情报，以及跨机构协作能力。

              私营部门需求不同。交易所和支付公司采购，是为了降低误报、满足牌照承诺、提交可辩护报告，并把欺诈、制裁和交易对手风险控制在运营容忍度内。随着美国和全球政策壁垒下降，银行、托管方和稳定币发行方越来越在意把区块链情报接进既有制裁、支付和托管栈。资产管理人和财富平台没那么关心事后调查，更在意开户、资金管理、抵押品和代币化资产工作流；这些工作流现在需要与传统金融同级的可审计性和治理标准。各类买方的采购标准最终收敛到链覆盖、跨链情报、工作流集成、审计轨迹，以及工具是否能提升风险调整后的运营效率，而不是只增加另一个告警队列。
