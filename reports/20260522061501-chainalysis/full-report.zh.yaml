  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: wide
    summary: Chainalysis 长期经营调查和监控工作流的地方成熟度最高；预防和智能体自动化更新，独立验证更少。
    data:
      columns:
        - 调查深度
        - 自动化或预防
        - 部署灵活性
        - 公开开发者界面
        - 独立验证
      rows:
        - label: Reactor
          values:
            - 高 — 旗舰图谱工作流，带集成和 Signals 背景
            - 中 — 有自动解读和引导步骤，但人类分析师仍居核心
            - 高 — 云、区域云、本地部署、FedRAMP
            - 低 — 接口大多封闭
            - 高 — 经法院检验，并被学术讨论
        - label: KYT + Address Screening
          values:
            - 中 — 先筛查，再升级到 Reactor
            - 高 — 实时警报、API / webhook 工作流
            - 中 — 有公开集成模式，但公开架构细节有限
            - 中 — 合作伙伴文档展示了可用的集成原语
            - 中 — 运营证明强，但公开误报细节很少
        - label: Data Solutions
          values:
            - 高 — 可直接访问精选数据和自动追踪
            - 高 — SQL、笔记本、无代码工作流、自定义 API
            - 中 — 可能灵活，但具体租户细节受限
            - 中 — 有 SDK 和软件包，但 OSS 足迹薄
            - 中 — 能力证据强，独立案例研究有限
        - label: Rapid
          values:
            - 中 — 偏分诊，不是完整案件构建
            - 高 — 自然语言 AI 摘要和优先级排序
            - 高 — 浏览器端，并有云或本地部署版本
            - 低 — 没有公开 API 界面
            - 低 — 当前证据多来自厂商和发布报道
        - label: Alterya + Hexagate
          values:
            - 中 — 更偏预防，回溯深度较弱
            - 高 — APP 欺诈拦截、签名前模拟、自动动作
            - 中 — 便于集成，但具体控制项不公开
            - 低 — 有集成讨论，但公开开发者细节稀少
            - 低至中 — 最新说法主要依赖厂商或合作伙伴来源
        - label: VASP Risking + Sentinel
          values:
            - 中 — 对手方和发行方生态强，但不是完整图谱工作
            - 中 — 有警报和工作流钩子，但不是广泛自主动作
            - 中 — 产品页面能证明适配度，不能证明精确架构
            - 低 — 公开技术文档有限
            - 中 — 用例清楚，但 Kryptos 映射仍有一部分靠推断
    approximationNotes: 成熟度评级是基于公开证据深度的分析判断，不基于私下路线图简报或客户访谈。
