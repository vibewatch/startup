  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 乐观逻辑：品类龙头，扎根公共部门且具备真实数据护城河
        - Series E/F 轮融资历史、70+ 个国家覆盖，以及相对 TRM 和 Elliptic 的直接同行差距，都表明 Chainalysis 仍是这一小众赛道里最有规模的资产。
        - 需要证明 2025 年私营部门加速已转化为持续 ARR 增长，而不只是叙事。
      - - 乐观逻辑：当前老股指示价已计入大量坏消息
        - Yahoo、Forge 和 Hiive 的估值信号集中在 ~$1.3B，低于此前 $2.5B-$8.6B 锚点。
        - 需要证据证明这些估值能以足够规模成交，而不只是稀疏的经纪报价。
      - - 反向逻辑：政府收入占多数，应给折价
        - Forbes 报道公共部门收入约占 70%，且公司因商业需求疲弱而回撤。
        - 需要队列证据证明商业客户重新加速，集中度在缓解。
      - - 反向逻辑：治理和披露仍过于封闭
        - CEO 交接、非稀释债务，以及缺失的债务 / 股权结构细节，让故事比品牌声量更难支撑投资判断。
        - 需要按细分拆分的当前 ARR、债务文件和董事会层面的融资理由。
    notes: 本表有意把每条逻辑同一个具体尽调项配对；该尽调项可以上调或下调判断。
    claimRefs:
      - CV001
      - CV024
      - CV025
      - CV033
      - CV038
      - CV039
      - CV040
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值区间
      - 隐含倍数逻辑
      - 概率信号
    rows:
      - - 悲观
        - 当前老股价格才是真实信号，政府集中度持续，债务 / 股权结构不透明继续让买方谨慎。
        - $0.9B-$1.2B
        - 在有支撑区间低端，约 5x ARR。
        - 如果 2025 年加速被证明很浅，或并非来自商业客户，则最可能发生。
      - - 基准
        - ARR 至少守在公开的 $190M-$250M 区间内，战略价值仍真实存在，但披露折价仍大。
        - $1.4B-$1.8B
        - 基于有支撑 ARR 区间，约 6x-8x。
        - 需要 2025-2026 年执行持续见效，但不要求爆发式增长。
      - - 乐观
        - 2025 年 ARR 明显高于公开的 2024 年估计，私营部门增长重新加速，退出可选性收窄流动性折价。
        - $2.3B-$2.8B
        - 回到此前 2024-2025 年私募估值 / Recorded Future 控制权价值区间。
        - 需要硬 KPI 证明，不能只靠市场乐观情绪。
    notes: 情景区间是分析输出，锚定公开 ARR 估计、老股估值信号和可比公司区间，而不是经审计的管理层指引。
    claimRefs:
      - CV016
      - CV017
      - CV032
      - CV041
      - CV042
      - CV043
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标 / 日期
      - 估值或倍数
      - 状态
      - 相关性
      - 局限
    rows:
      - - Chainalysis（Series F 轮）
        - 2022 年 5 月融资轮
        - $8.54B-$8.6B；约 61.4x 2022 年收入
        - 历史融资头条估值
        - 显示 2021-2022 年热潮把公司估值抬高了多少。
        - 不是当前市场出清估值。
      - - Chainalysis（私募估值信号）
        - 2024-2025 年市场数据视角
        - ~$2.5B；按 $190M-$250M ARR 计为 ~10x-13x EV/ARR
        - 较早老股 / 隐含估值信号
        - 连接上一轮融资和当前市场的最佳公开桥梁。
        - 仍靠估计支撑，到 2026 年已有部分过时。
      - - Chainalysis（2026 年指示性）
        - Yahoo / Forge / Hiive，2026 年 5 月
        - 估计估值 ~$1.32B；每股 $6.09-$6.19
        - 市场平台指示性估值
        - 目前可得的最佳定价信号。
        - 仅为指示性；价格发现很薄，且非管理层背书。
      - - TRM Labs
        - 2026 年 2 月 Series C 轮
        - $1.0B 估值
        - 私募融资可比
        - 最接近的直接区块链分析同行，增长更快。
        - 收入基数和盈利能力披露少于 Chainalysis。
      - - Elliptic
        - 2026 年 5 月 Series D 轮
        - $670M 估值
        - 私募融资可比
        - 直接加密合规同行，银行客户足迹有分量。
        - 规模更小，地域组合不同。
      - - Recorded Future
        - 2024 年 9 月 Mastercard 收购
        - $2.65B 控制权价值
        - 战略并购可比
        - 最有用的战略情报退出参考。
        - 威胁情报与区块链分析相邻，但并不相同。
      - - Cellebrite
        - 2026 年 5 月公开市场
        - 估值指标：$2.77B EV；5.59x EV/Sales
        - 公开市场调查软件下限
        - 可作为证据驱动调查工具的有用锚点。
        - 公开市场流动性和披露远好于 Chainalysis。
      - - NICE
        - 2026 年 5 月公开市场
        - 估值指标：$5.16B EV；1.71x EV/Revenue
        - 公开市场合规软件下限
        - 可作为成熟合规分析的低倍数锚点。
        - 比 Chainalysis 成熟得多，增长属性也弱得多。
      - - Palantir
        - 2026 年 5 月公开市场
        - 估值指标：$321.61B EV；61.56x EV/Revenue
        - 前沿分析估值上限
        - 展示公开市场会给高增长政府分析叙事怎样的回报。
        - 业务太宽、公开市场属性太强，不适合作为现实基准可比。
    notes: 这是一个样本可比组，混合历史融资轮、老股估值信号、战略并购和公开市场可比公司；有意不追求穷尽。
    enumerationScope:
      coverage: sample
      basis: >-
        Sampled the most supportable public round, secondary, strategic, and public-market anchors reviewed on
        2026-05-22 rather than claiming a full universe of every comp.
    claimRefs:
