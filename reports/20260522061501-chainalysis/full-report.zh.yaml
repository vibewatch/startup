        - 公开融资和客户规模信号明显小于头部厂商
      - - Mastercard / CipherTrace
        - 在位厂商打包替代
        - 由 Mastercard 支持；传统加密情报和 AML 工具；2024 年有产品关停报道
        - 银行、交易所、监管机构、执法部门
        - 可能借 Mastercard 关系获得分发杠杆
        - 看起来更像打包且收缩中的方案，而不是快速推进的独立对手
      - - Nansen
        - 邻近替代品
