  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户证据横跨多类买方，但顶线计数仍主要由供应商筛选呈现
        blocks:
          - type: paragraph
            body: >-
              公开客户记录已经足够宽，能证明真实需求存在。Chainalysis 自己当前页面称，超过 1,500 个组织信任该平台，客户覆盖 70 个国家，超过 50 家监管机构或 FIU
              使用产品。同一批页面里的客户组合不是泛泛 logo
              墙：公共部门调查、监管监督、交易所合规、银行开户、支付和稳定币控制、资金来源工作流，都以具体用例出现。重要承保细节在于，顶线计数仍主要由供应商筛选呈现。留存来源里最好的独立交叉验证反而来自反向材料：State
              of Surveillance 把 Chainalysis 描述为主导监控供应商，称其与 370 家公共部门机构和 1,100 多家私营公司合作，并称政府合同现在占销售多数。这并不反驳供应商的 1,500+
              说法，但会把读者从不加区分的客户数故事，带向客户组合故事。实际看，公司在买方需要证据追踪、可供监管审阅的报告和采购适配时最强；公开记录最弱的地方仍是装机底座的商业形状：多少 ARR
              来自政府、多少来自私营账户，哪些队列续约，以及命名 logo 背后有多少钱包或交易量。
