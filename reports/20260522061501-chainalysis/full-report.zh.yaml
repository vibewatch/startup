  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Chainalysis 往往先借高摩擦的合规或调查需求切入；一旦数据信任建立，再扩到更多工作流。
    data:
      items:
        - label: 触发事件
          value: >-
            Scam losses, tax enforcement, sanctions exposure, digital-asset launch, or fraud risk create the initial
            buying reason.
        - label: 采购或政策路径
          value: Buyers then need a contract vehicle, supervisory mandate, or internal risk sponsor before deployment moves.
        - label: 初始部署
          value: First use usually centers on training, tracing, KYT, source-of-wealth, or onboarding controls.
        - label: 嵌入日常运营
          value: Daily casework, monitoring queues, regulator-facing reports, and cross-functional workflows follow.
        - label: 结果证明
          value: >-
            Faster investigations, lower illicit exposure, safer onboarding, or more confident regulator conversations
            become the proof points.
        - label: 扩张循环
          value: >-
            Buyers can add fraud, stablecoin, payments, additional chains, or embedded services after the first workflow
            sticks.
    approximationNotes: 该旅程是分析框架，不是时间线；它综合了保留引用中的公共部门和私营部门部署模式。
    claimRefs:
