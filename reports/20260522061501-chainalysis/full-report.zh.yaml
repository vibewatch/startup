            body: >-
              公开材料显示 Chainalysis 不只靠一种东西变现。公司现在把自己描述为区块链数据平台，销售数据、AI 驱动软件、服务和研究；产品页面则把商业报价拆成用于调查的 Reactor、用于实时交易监测的
              KYT、用于直接访问数据集的 Data Solutions 和
              Workflows，以及更广的加密合规和政府服务。这样看，公司不像单席位调查工具，更像带有软件、数据和专家服务附加的分层平台。定价可见度仍是间接的。Vendr 和 CostBench
              都描述的是按报价签约，而不是公开标价；Reactor 似乎随席位和支持链扩展，KYT
              随监测交易量扩展，实施或培训通常在基础订阅之外。承保层面的结论是：产品品类层面的收入质量不错——企业和政府合同具备经常性；但已实现 ASP、折扣和真实产品线组合仍缺乏精度。
