      - number: '6.4'
        title: 耐久性说得通，但集中度和留存仍未公开
        blocks:
          - type: paragraph
            body: >-
              反向记录没有推翻产品市场匹配，但清楚标出了投资风险所在。State of Surveillance 直接把 Chainalysis 定位为监控供应商，并引用 Coinbase “financial ankle
              monitor” 的批评，说明政府和合规买方越成功，隐私反弹也会越强。USENIX 论文更平衡：它发现，在研究过的被查封非法服务案例中，Chainalysis
              可以给出可靠的归因下限，误报率很低；但论文也指出，覆盖范围会随时间变化，结论难以泛化。这些来源对客户重要，因为资金最充足的一批买方——联邦机构、监管机构和银行——关心的不只是产品能不能用，还关心产品能否在法庭、监管审查和公共辩论中站得住。更大的商业问题更简单：留存和集中度仍未公开。保留下来的来源没有披露净留存率（NRR）、总留存率（GRR）、logo
              流失、标准合同期限、头部客户敞口，或按机构拆分的收入依赖。Carahsoft 说明公共部门触达可以借合同载体快速放大，但同样的渠道结构也会遮住实际 ACV
              以及直销与间接销售的经济性。因此，客户章节对部署真实性给出正面判断，对客户组合透明度则给出弱判断。Chainalysis
              看起来已经深嵌真实工作流；但在续约质量、客户集中度，以及公共部门需求究竟在账本中占到什么程度上，它还不足以公开建模。
