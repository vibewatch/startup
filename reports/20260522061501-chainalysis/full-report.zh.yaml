      - number: '5.4'
        title: 差异化真实存在，但归因、隐私和最新 AI 主张仍需承保
        blocks:
          - type: paragraph
            body: >-
              优势是真实的，但这不是纯技术护城河。Chainalysis 对准确性和法律可辩护性有可信公开论点：自己的数据质量页面把平台和同行评审研究、Daubert
              标准下的法庭检验联系起来。但底层学术论文比营销概述更细，显示不同案件和时间段的下限覆盖差异很大。对抗性法律文件更进一步，认为经过验证的聚类率不能自动证明有争议的所有权归因，并抱怨自有启发式方法对被告仍不透明。这些争议很重要，因为
              Chainalysis 越来越希望客户信任自动化，从 Rapid 的 AI 摘要，到 Hexagate 的漏洞预防，再到 2026 年 AI 智能体。公开证据支持这个方向，尤其是 2025 年 Alterya 和
              Hexagate 扩张以及 2026 年智能体叙事，但外部对最新功能的精度、误报和节省时间的基准测试仍很薄。隐私保护生态和旧标签也要同样谨慎。公开评测仍描述 Kryptos 和 Storyline，安全政策仍点名
              kryptos.chainalysis.com，但当前 sitemap 和营销呈现强调的是更新的 VASP Risking、Sentinel、DS、Rapid、Alterya 和 Hexagate
              组合。承保上，公司在买方重视工作流广度、公共部门适配和可辩护证据时最强；在买方需要开放开发者证明、透明启发式方法，或围绕隐私币处理给出精确公开边界时更弱。
