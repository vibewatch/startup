      - number: '3.2'
        title: 产品重叠真实存在，但最强证据分布并不均匀
        blocks:
          - type: paragraph
            body: >-
              在功能层面，Chainalysis、TRM、Elliptic 和 Merkle 都在讲企业级故事的变体：调查工具、交易监测、制裁或风险筛查，以及面向受监管机构的工作流。差别在证明层。Chainalysis
              把头部交易所渗透、监管机构覆盖、Reactor 交易对手方和 KYT 监测等官方主张，与反复出现的「法院可采纳」或证据质量叙事结合起来。TRM
              是最强的直接挑战者，因为它横跨执法、国防和情报、银行、交易所与网络安全，同时大力押注 AI 智能体和公私协同威胁响应。Elliptic
              语气更窄，但在银行和支付语言、稳定币和代币化资产风险，以及国际分布的机构存在感上很强。Merkle 有可信产品重叠，尤其是行为监测、跨链追踪和更快资产覆盖叙事，但公开规模标记仍更小。

              Nansen 坐在这组公司之外。它的官方材料和评测内容围绕聪明钱标签、研究、执行和投资组合监测，服务交易者和基金。这让它成为有意义的替代品：加密原生分析师做探索工作时，可能不用买企业供应商的有限席位，而是转向
              Nansen。但没有证据支持 Nansen 是公共部门或银行合规领导者。Mastercard 旗下 CipherTrace
              也不再像过去那样是干净的一对一同业。留存来源更能说明收购逻辑和收缩，而不是当前产品动能。结果是，单看功能清单会夸大同质化：几家公司都可以合理地说自己做「区块链分析」，但能展示同等深度受监管参考点的少得多。
