      - number: '1.4'
        title: 反向标记、可信度争议，以及仍需尽调的指标
        blocks:
          - type: paragraph
            body: >-
              后续章节需要持续带着两条反向线索。第一条是商业模式压力。2023 年，Chainalysis 从约 900 人团队中裁掉约 150
              人，并明确转向盈利能力和更稳定的政府合同。这不像生存危机，但说明商业加密需求降温的速度足以迫使公司重置经营。第二条不是财务问题，而是认知问题：Chainalysis 把工具包装成经过独立验证、可被法院采纳，但
              ChainArgos 在 2025 年 10 月对 Bitcoin Fog 的批评认为，部分归因技术在诉讼中不科学或使用不当。2025 年 USENIX
              论文则给出相反方向的证据，认为在抽样非法服务数据集上，误报率低、下限准确性强。正确结论不是哪一方「赢了」，而是数据质量主张和法庭归因主张不能被当成同一件事。

              公开指标也在关键处不完整。员工数有区间但 2026 年未核实，Fabrica 老股交易的精确经济性藏在市场数据付费墙之后，Hercules
              信贷条款也没有以投资人可检查的方式公开备案。对第一章来说，这些缺口并不致命，因为公司的身份、客户价值和资本历史足够清楚，可以建立标准背景。但这些缺口会压低投资人对任何精确估值、杠杆或利润率叙事的信心，尤其是当这些叙事完全来自公开证据时。
