        - 可在现有栈内吸收定制监测和工作流集成
        - 公开指南仍指出，重大加密暴露需要专门链上分析
    notes: 规模信号混合了当前官方说法、当前融资轮次，以及历史融资；当历史融资是最新公开参照时也纳入。内部自建是替代类别，而不是公司行。
