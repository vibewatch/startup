        - 联邦、州、地方和海外公共部门买家
        - 能加深留存，但可能稀释纯软件利润率
        - 拆分公共部门收入中的软件与服务结构
      - - 培训和认证
        - Academy 访问、私有培训和 20,000 多名受训专业人士，说明该技术栈周围存在付费赋能
        - 按课程、按项目，或与许可证捆绑
        - 政府机构和企业合规团队
        - 附加收入不错，但劳动密集
