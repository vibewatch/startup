  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及哪些支出应算在范围内
        blocks:
          - type: paragraph
            body: >-
              给 Chainalysis 的可服务市场划边界，最干净的方式不是看「所有加密基础设施」，而是看一个更窄的交叉区：区块链分析、交易监测、制裁筛查、Travel Rule
              互操作和调查工具。第三方品类报告把这个市场定义在区块链取证、合规数据管理、风险评估、智能合约审计和交易监测，买方包括交易所、银行、合规公司、监管机构和执法机构。这个边界很重要，因为它排除了大量相邻支出池——托管、交易基础设施、挖矿硬件、核心支付处理、通用
              KYC，以及不需要链原生实体解析或跨链追踪的通用银行 AML 系统。

              现状也不是「买竞争对手或什么都不做」那么简单。公共部门用户可以依靠内部调查团队和碎片化机构工具；交易所可以在通用 AML 栈上外挂加密覆盖层；银行可以尝试把监测内化到更广的制裁、支付或托管项目里；许多买方仍围绕
              SAR 申报和钱包筛查跑手工案件管理。结果是，真正差异化的产品不只是一个高风险地址数据库，而是一个工作流引擎：它把链覆盖、实体归因、案件管理、制裁语境和证据质量拼在一起，并能经受审计、执法复核和法庭审视。
