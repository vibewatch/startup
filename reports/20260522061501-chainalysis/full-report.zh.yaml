      - number: '2.2'
        title: 市场规模需要多重视角，不能只靠一个 TAM 标题
        blocks:
          - type: paragraph
            body: >-
              公开估计支持这是一个大且快速增长的品类，但各家并不在描述同一个市场。Research and Markets 与 GII Research 描述的是广义加密合规和区块链分析市场，规模从 2025 年约 $2.9B
              增至 2026 年 $3.64B，并在 2032 年达到 $14.63B。Tokenization Compliance 用了更窄的定义，聚焦加密专用合规技术，得到的市场明显更小：2025 年约
              $2.1B，2026 年 $2.78B。在这个较窄视角里，区块链分析和交易监测是最大切片，2025 年约 $820M，意味着与 Chainalysis 最直接匹配的子板块已经足够大，但仍远小于最宽口径的品类标题。

              更重要的结论是定性的：需求强度同时被采用和风险拉动。Chainalysis 和 TRM 都描述 2025 年非法交易量创纪录；Chainalysis
              的地域和采用研究也显示，机构参与、区域链上交易量和稳定币用例同时扩大。也就是说，不能只靠一份分析师 PDF
              来负责任地测算市场。更可辩护的视角，需要把品类收入估计、非法资金流强度、机构采用和区域牌照推进结合起来；同时还要承认，没有公开来源能干净隔离 Chainalysis 的精确 SAM 或可获取份额。
