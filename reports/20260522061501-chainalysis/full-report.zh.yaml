  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议沿着一条简单链条推导：公开 ARR 支撑和战略相关性增加价值，披露缺口和集中度则施加折价。
    approximationNotes: 这是逻辑桥，不是量化预测；它展示估值决策路径，而非加权概率。
    data:
      nodes:
        - id: history
          label: 历史融资轮证据
          description: Series E 轮估值 $4.2B、Series F 轮估值 ~$8.6B，说明过往投资人有胃口，但只能作为历史锚点。
        - id: currentmark
          label: 当前二级市场标记
          description: Yahoo、Forge 和 Hiive 指向低得多的 ~$1.3B 区间，也意味着大幅流动性折价。
        - id: arr
          label: 有支撑的 ARR 区间
          description: 公开证据仍集中在 2023 年 ~$190M ARR 和 2024 年 ~$250M 预测值附近；2025 年只看到方向性提速。
        - id: discounts
          label: 质量折价
          description: 政府客户集中、CEO 交接和私人债务条款，都会限制可给予的倍数扩张。
        - id: comps
          label: 可比公司区间
          description: TRM 和 Elliptic 标定直接同业下限；Recorded Future 和 Cellebrite 则框定战略和上市公司可比样本。
        - id: decision
          label: 继续研究，价格敏感
          description: 若接近真实的 2026 年标记，估值公平到有吸引力；若卖方仍锚定旧的 $2.5B 水平，则偏贵。
      edges:
        - from: history
          to: currentmark
          label: 重置为
        - from: currentmark
          to: decision
          label: 设定进入区间
        - from: arr
          to: decision
          label: 转化为 EV/ARR
        - from: discounts
          to: decision
          label: 迫使折价
        - from: comps
          to: decision
          label: 限定上行空间
        - from: arr
          to: comps
          label: 锚定可比定位
    claimRefs:
