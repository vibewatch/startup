  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 老股标记取代融资头条后，头部轮次估值大幅重置
        blocks:
          - type: paragraph
            body: >-
              最干净的估值证据是历史数据，噪音最大的则是当前数据。Chainalysis 直接确认 2021 年 Series E 估值为 $4.2 billion；随后公开报道把 2022 年 5 月 Series F
              写在大约 $8.54 billion 至 $8.6 billion。数字是真实的，但属于另一个流动性周期里的融资头条。更相关的后泡沫证据来自市场数据提供商和交易记录：Sacra 的 2024 年档案把
              Chainalysis 列为 $2.5 billion，CB Insights 显示 2024-2025 年可见私募市场活动，包括 2025 年 3 月一条与 Fabrica Ventures
              相关的老股交易记录；Yahoo、Forge 和 Hiive 的 2026 年市场页面显示，当前股价指示集中在 $6.09 至 $6.19 左右。Yahoo 将其换算成仅约 $1.32 billion
              的估计估值。投资判断的经验是，把已确认的历史轮次标记与当前带流动性折价的市场标记分开看，不要把它们混成一个看似精确的“当前估值”。
