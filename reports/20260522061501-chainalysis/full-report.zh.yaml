      - 原有痛点
      - Chainalysis 工作流
      - 可衡量或声称的收益
      - 限制
    rows:
      - - 一线调查员收到诈骗报案
        - 没有专家很难读懂钱包
        - Rapid 对地址分诊、给风险打分，并识别可能的法律请求对象
        - 面向非专家的白话摘要和即时优先级排序
        - 没有公开基准衡量错误升级
      - - 交易所合规分析师审核入站或出站资金流
        - 手工复筛和嘈杂队列拖慢响应
        - KYT 实时筛查交易；Address Screening 给钱包打分；告警升级到 Reactor
        - 秒级告警和可定制阈值
        - 风险规则校准仍按客户定制，且不公开
      - - 调查员搭建完整案件
        - 跨链兑换、混币器和桥让路径变得模糊
        - Reactor 追踪资金并映射交易对手；Signals 补充更多上下文
        - 横跨链和实体的单一调查工作流
        - 大型调查仍可能变复杂、变杂乱
      - - 搜查团队在突袭中找到助记词
        - 手工检查钱包慢且容易出错
        - Wallet Scan 离线处理助记词，再把发现交给 Reactor
        - 更快作出扣押决定，并降低数据处理风险
        - 没有公开矩阵覆盖所有派生边界情况
      - - 稳定币发行方或储备银行监控生态完整性
        - 二级市场持有人和风险暴露难以看清
        - Sentinel 监控持仓并告警；KYT 和 Reactor 支持后续处置；Hexagate 覆盖技术漏洞利用
        - 面向合规和安全事件的冻结或复核工作流
        - 冻结的操作权限取决于发行方治理和司法辖区
      - - 监管机构或情报分析师需要定制监控
        - 固定仪表盘回答不了任务专属问题
        - Data Solutions 运行定制查询、告警、导出和 notebook 环境；服务团队补齐专业能力缺口
        - 更适配定制化监管或情报任务
        - 仍需要技术深度或服务预算
    notes: 这些工作流条目描述可观察的产品交接；不能替代合同约定的 SLA 或法律程序权限。
