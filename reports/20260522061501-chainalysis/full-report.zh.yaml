        title: 证据摘录
        blocks:
          - type: callout
            title: 不要锚定 2022 年轮次头条
            body: 当前有用的争论不是 Chainalysis 是否曾值 $8.6 billion，而是今天真实入场价更接近较早的 $2.5 billion 私募标记，还是当前 ~$1.3 billion 的指示性老股标记。
