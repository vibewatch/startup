        - 买方需要最稳妥的机构答案时，Chainalysis 应保持优势；TRM 在新采购上缩小差距
        - 要求提供过去 12 个月政府和国家安全客户的胜负案例
      - - 交易所和受监管机构渗透
        - 前 10 大交易所中的 9 家，以及广泛金融机构信息
        - Elliptic 和 TRM 也在销售银行和交易所合规栈
        - 高
        - Chainalysis 保住在位价值，但对手可在工作流现代化或地域上赢单
        - 比较头部交易所和银行账户的续约率及替换原因
      - - 嵌入式工作流和切换成本
        - 监测、追踪、审计轨迹和案件工作流抬高迁移成本
        - 多供应商并用和模块化采购让买方在边缘添加替代品
        - 中
        - 完整替换可能少见，但如果买方混用工具，席位和模块扩张会放慢
        - 梳理哪些买方只跑一个平台，哪些并行使用两个或更多平台
      - - AI 和自动化可信度
        - Chainalysis、TRM、Elliptic 和 Merkle 现在都使用 AI 优先语言
        - AI 成为标配，而不是差异点
        - 中
        - 如果没有供应商证明警报处理或调查员速度可衡量地更好，营销趋同会压缩定价
        - 索要误报、节省分析师工时和警报解决时间的试点指标
      - - 低端价格伞
        - Nansen 以及免费或低价追踪器，为买方提供便宜得多的发现层
        - 研究任务从合规任务中拆出来
        - 中
        - 即使 Chainalysis 守住核心合规预算，也可能丢掉轻量级分析师支出
        - 按用户类型拆分席位数：调查人员、合规运营、市场情报研究员
      - - 品类合法性与隐私反弹
        - 围绕监控和启发式准确性的批评仍在传播
        - 信任主张会在法院、隐私争论或 DeFi 原生市场受审视
        - 中
        - 反弹不太可能扼杀企业需求，但会拖慢隐私敏感或协议原生细分市场的采用
        - 审阅法庭引用、第三方审计，以及各家厂商如何处理有争议标签或误报申诉
    notes: 严重程度反映它与 Chainalysis 的竞争相关性，而非公司存亡风险。本登记表有意混合直接竞争对手威胁、替代品压力和品类层面的压力。
