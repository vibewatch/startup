      - number: '8.3'
        title: 可比证据指向中段结果，并更像 IPO 前的战略退出
        blocks:
          - type: paragraph
            body: >-
              可比证据反对两个极端。Chainalysis 仍高于直接区块链分析同行：TRM 在 2026 年按 $1 billion 融资，Elliptic 按 $670 million 融资，二者都明显低于
              Chainalysis 的 2026 年隐含标记。但公司也缺少支撑 Palantir 式前沿倍数所需的披露质量或增长证明。因此，上市可比公司更适合作为区间：NICE 显示成熟合规软件可能落在约 1.7x
              EV/revenue；Cellebrite 给出更相关的调查软件底部，约 5.6x EV/sales；Palantir 则展示了政府加数据平台在拥有异常公开增长和披露时的外沿上限。最佳战略结果可比是
              Recorded Future 以 $2.65 billion 出售给 Mastercard，因为该交易为一个规模化情报资产定价，且该资产嵌入企业和公共部门工作流。这让中段区间比回到 $8.6 billion
              更可信，也让战略交易比近期 IPO 更可信，尤其是 Forge 仍称 Chainalysis 尚未正式认可上市流程。
