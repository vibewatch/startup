  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管碎片化与政策依赖有利有弊
        blocks:
          - type: paragraph
            body: >-
              全球政策仍在移动，这既解释了 Chainalysis 为什么能赢单，也解释了这些业务为什么仍然脆弱。FATF 和 FSB 都称，落地仍不完整、不均衡，且容易被监管套利。欧盟仍在通过授权法案把 MiCA
              落地，GAO 仍看到美国监管和协调缺口，White House 和 OCC 也都改变了美国运营环境，既可能扩大可服务市场，也可能改变客户采购方式。关键在于，Chainalysis
              面对的不是简单的“加密资产变多”或“加密资产变少”，而是任一时点执法权、银行参与度和跨境监管处在什么位置。如果监管进一步碎片化，买方需要更多定制、更多按司法辖区编写的规则内容，以及更多服务。如果规则趋同、大型机构更愿意自己掌握数字资产控制，同样的政策进展也可能支持内部工具、多供应商堆栈或价格压力。换句话说，政策不只是顺风，也同时制造需求和替代风险。
