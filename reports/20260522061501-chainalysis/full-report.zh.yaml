      - number: '4.4'
        title: 财务结论与公开记录的边界
        blocks:
          - type: paragraph
            body: >-
              我的财务结论是：Chainalysis 拥有可信的经常性软件和数据业务、可见的公共部门需求，也有足够证据支撑 ARR 大致在 $190M 到 $250M
              区间；但披露不足，无法有把握承保利润率质量或资本效率。核心不确定性不是公司有没有收入，而是收入中有多少来自高毛利软件，多少来自专家服务、培训、渠道化政府业务，或叠加在核心平台上的新产品。反向材料同样重要。ChainArgos
              对 Bitcoin Fog 的批评和 ICIJ 关于依赖品类的分析输出的报道，并不推翻 Chainalysis
