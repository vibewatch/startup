      - number: '5.2'
        title: 共享情报和分析基础设施是技术核心
        blocks:
          - type: paragraph
            body: >-
              技术护城河来自各 SKU 底下的共享情报层。Chainalysis 称其收集真实标签归因，再用网络级和服务特定启发式方法叠加，并复用于筛查、图谱、风险评分和定制分析。Data Solutions
              产品能看到这套架构：它开放 SQL、notebooks、无代码工作流、定制 API 和批量导出，而不只是固定仪表盘。Dfns 和 IBM
              的合作伙伴文档显示，共享情报并非纸面概念：它在主要链上的第三方运营系统里，驱动出站预筛查、入站监测和 webhook 触发的政策决策。公开 Python SDK 和 PyPI 包进一步说明 DS
              设计成可编程产品，包括针对 cross_chain.clusters 的分析查询和基于图谱的 autotracing。但按主流软件标准，开发者表面仍然偏窄。抓取时公开 GitHub org
              没有列出仓库，更丰富的文档似乎放在账号创建或合作伙伴门户之后。这个组合意味着产品策略强大但相对封闭：API 和 SDK 存在，但大多数真实实施细节看起来面向付费客户、嵌入式服务或私有培训，而不是广泛开源生态。
