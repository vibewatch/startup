      - number: '8.4'
        title: 管理层开放私有数据室前，建议应保持价格敏感
        blocks:
          - type: paragraph
            body: >-
              实际投资判断看价格，不看欣赏程度。如果买方能可靠地以接近当前约 $1.3 billion 的老股指示价拿到股票，Chainalysis
              开始显得合理到有吸引力，因为该价格对上一轮融资嵌入了重折价，接近调查软件上市公司底部，并留下走向 Recorded Future 式战略结果的上行。如果真实可执行价格仍更接近较早的 $2.5 billion
              标记，案例就明显变弱，因为投资人要为一家利润率私有、债务包不透明、政府收入占大头、私营部门恢复增长只有方向性证据的公司支付 10x 至 13x
              EV/ARR。正因如此，建议是继续研究，而不是买入。剩余工作很清楚：按分部核实现有 ARR，检查 Hercules 文件，确认当前股权结构表和优先股堆叠，并测试 2025-2026
              年私营部门加速是否足够耐久，能否弥合战略价值与可交易价值之间的缺口。
