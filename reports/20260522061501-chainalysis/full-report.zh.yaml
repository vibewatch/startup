      - number: '1.3'
        title: 融资历史、估值重置与里程碑顺序
        blocks:
          - type: paragraph
            body: >-
              Chainalysis 的资本故事已经不是一路向上的风投叙事。公开记录显示，公司从 2021 年 6 月估值 $4.2B 的 Series E，升至 2022 年 5 月估值 $8.6B 的 Series
              F；后一轮由 GIC 领投，既有投资人和 BNY Mellon 等战略方参与。市场数据机构现在把累计融资放在约 $536.6M，足以确认 Chainalysis
              是融资充足的后期私有软件公司。但更新、更重要的信号是估值重置。TechCrunch 和 Sacra 都描述了 2024-2025 年老股交易活动，隐含估值接近 $2.5B；CB Insights 也记录了
              2025 年 3 月 19 日涉及 Fabrica Ventures 的老股交易。相比 2022 年峰值，这是一次实质性重估，即使公开片段看不到 Fabrica 的精确定价。

              2025 年 10 月的 Hercules 融资又加了一层信息：经过一段收购期之后，Chainalysis 已经愿意用非稀释性资本投向 AI
              和扩张。官方披露确认融资存在，也确认它发生在八个月内三笔收购之后，但公开文件没有披露具体融资条款。合作和产品范围上的里程碑也指向同一模式。Four Inc. 在 2023
              年扩大了联邦渠道触达，AlixPartners 在 2024 年强化了诉讼和合规服务覆盖，Hexagate 与 Alterya 交易则把 Chainalysis
              推向更宽的风险与预防平台。时间线支持一个简单结论：Chainalysis 仍有战略价值、运营动作活跃，但它的估值和资本结构已经比 2021-2022 年繁荣期故事更复杂。
