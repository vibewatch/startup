      - number: '3.3'
        title: 定价不透明和分发能力决定替代品能在哪里赢
        blocks:
          - type: paragraph
            body: >-
              来源集中显示，最清楚的商业分裂在于不透明企业采购与透明自助分析。Chainalysis、TRM、Elliptic、Merkle 和 Mastercard/CipherTrace
              基本都会把买方带入演示、采购周期、实施工作和协商定价的组合。这对卖给银行、交易所和公共机构的合规工具很正常，但也隐藏了赢单所需的折扣或捆绑程度。Nansen 站在另一端：公开标价从免费到每月
              $69，让个人分析师、小基金或研究团队很容易把它替换进钱包情报工作流，不必提出六位数预算申请。比较来源和反向来源把同一点推得更狠：一旦买方不需要面向监管的证据包或 Travel Rule
              基础设施，低成本或免费工具就重要得多。

              替代威胁因此并不均匀。大型受监管机构方面，最好的公开指引仍认为区块链分析应与传统 AML
              和制裁系统并列，而不是被后者替代。内部自建可以吸收部分报告、筛查或分流逻辑，尤其是在已有合规工程团队的大型交易所和银行。但专业供应商仍掌握钱包归因、跨链追踪和可用于案件的工作流上最深的公开证据。DeFi
              和加密原生团队不同。ChainAware 的批评和 ChainGain 的市场图谱都显示，低成本工具、免费基线或自助产品有可信路径，能够替代那些为银行和中心化交易所设计的企业套件。Chainalysis
              在采购摩擦换来信任的地方最强；如果买方真正要的是速度、透明和轻量情报，它的护城河就弱得多。
