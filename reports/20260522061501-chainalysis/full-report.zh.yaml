        title: 政府集中度、更强对手和内部自建挤压模型
        blocks:
          - type: paragraph
            body: >-
              公开记录越来越支持集中度风险的解读。可见的 IRS 授权轨迹、Carahsoft 和 Four 合同载体的广度，以及 Forbes 所称 70%
              公共部门收入占比，都指向同一方向：商业加密资产需求走弱后，Chainalysis
              通过更深地倚重政府和监管需求找到了稳定性。这帮助它熬过加密寒冬，但也意味着采购节奏、机构预算和政策姿态，如今比公司被包装成广泛私营部门合规赢家时更重要。与此同时，对手并不缺粮。TRM 和 Elliptic 都在
              2026 年融到可观资本，Elliptic 还明确在教银行如何把区块链分析落到自身案件管理环境里。这不只是传统供应商竞争，更是一张工作流内化蓝图。公司内部也有执行风险。Chainalysis 在 2023
              年裁员超过 15%，随后在 2024 年底失去创始 CEO。Jonathan Levin 也许是可信的经营者，但更深的政府聚焦、多次收购，以及仍未公开的组织架构，使留存和整合成为核心尽调事项，而不是背景噪音。
