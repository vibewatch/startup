  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 真实竞争是分层市场，不是一个扁平同业池
        blocks:
          - type: paragraph
            body: >-
              Chainalysis 不是在和一个单一的「加密分析」篮子竞争。留存证据把市场拆成四个实用层级。第一层是直接的企业合规与调查同业：TRM、Elliptic，以及程度稍弱的 Merkle
              Science。它们围绕追踪、钱包或实体风险、制裁和 AML 监测、面向监管的调查支持销售重叠工作流。第二层是被既有巨头捆绑的能力，Mastercard 的 CipherTrace
              资产更像可折进银行或支付合规平台的一项能力，而不是独立产品族。第三层是 Nansen
              以及免费或低价追踪工具生态等相邻替代品，它们服务加密原生团队的钱包发现、钱包情报和研究任务，但并不试图赢下执法或银行合规任务。第四层是现状本身：大型银行和交易所可以把部分监测内化到传统
              AML、制裁和调查栈里，即使公开指引在暴露足够重要时仍会把它们指回专业链上工具。

              分层结构很重要，因为 Chainalysis 在信任、证据可辩护性和监管熟悉度主导采购决策的场景里仍最强。公司当前材料强调头部交易所渗透、监管机构使用、法庭级工作流和跨链追踪，而不是自助探索。TRM 用更明确的
              AI 优先叙事和强劲公共部门动能攻击同一预算线。Elliptic 从机构金融和稳定币合规切入。Merkle 从行为监测切入。Nansen
              争夺注意力和研究预算，而不是最重合规的工作流。实际尽调问题因此不是「还有谁做分析」，而是「每一种买方任务由哪一类供应商赢走」。
