      - number: '2.4'
        title: 监管是最强顺风，但碎片化和内化仍是真约束
        blocks:
          - type: paragraph
            body: >-
              最强顺风来自 FATF 压力、MiCA 落地和 2025 年美国政策变化的组合。FATF 2025 年更新称，多数受访司法辖区已经立法实施 Travel Rule，但执行、监督、离岸 VASP
              控制和稳定币风险仍落后。ESMA 和 European Commission 显示 MiCA 正从法律文本进入运营规则，授权和实施法案仍在 2025 年继续推出。美国方面，White House、OCC
              Letter 1183 和 OCC Letter 1184 都降低了银行、稳定币项目和托管工作流的程序性门槛。再叠加 WEF、Morgan Stanley、The Trade、Blockchain.com、BPM
              和 Oliver Wyman 描述的机构化趋势，这个品类显然受益于更多受监管实体、更多受监管工作流，以及更多跨境价值上链。

              但不是每一股顺风都会一比一变成供应商收入。稳定币在链和发行方之间碎片化，跨境规则不均，私有链和许可链采用增加，银行与大型机构也更愿意把分析捆进更宽的合规栈或内部化，这些都会给独立供应商带来收入捕获风险。市场也高度依赖定义：广义品类
              TAM 可能夸大真正可流向专用链上情报工具的支出。因此，Chainalysis 受益于结构性需求扩张，但尽调仍需要证明：政策和工作流扩张会转化为第三方预算捕获，而不只是让客户内部合规工作变得更复杂。
