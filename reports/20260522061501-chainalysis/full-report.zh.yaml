      - number: '7.2'
        title: 可追踪性边界、方法争议和诉讼风险压住信任
        blocks:
          - type: paragraph
            body: >-
              产品有用，但不是魔法。最强的独立证据带有细微差别：USENIX 论文发现，在特定被查封服务案例中，Chainalysis
              可以给出可靠的归因下限，且误报率很低；但论文也说，覆盖范围会随时间变化，难以泛化。更广泛的追踪综述称，跨链转移和相关工作流仍会制造盲点，这个领域是在管理误报和漏报，而不是消灭它们。这一点重要，因为
              Chainalysis 部分最高价值用例正好位于错误成本最高的场景：法庭证据、制裁项目、客户清退和高风险欺诈调查。Sterlingov 诉讼展示了问题的两面。法院已根据 Daubert 采纳 Reactor
              辅助证词，这增强了商业可辩护性；但法律评论和 ChainArgos 简报也显示，批评者仍可分别攻击同行评审、错误率披露，以及聚类与现实世界归因之间的差距。ICIJ 对 Binance
              的报道给出了另一种声誉角度：即便工具方向上有用，客户仍可能夸大供应商数据真正能证明的东西。
