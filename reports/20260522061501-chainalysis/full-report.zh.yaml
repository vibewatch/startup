  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Chainalysis 在多个产品工作流下铺一层共享情报和控制平面，再在上面销售部署与专家服务包装。
    data:
      layers:
        - id: data-sources
          label: 数据获取与真实标签
          detail: 已观测服务归属、OSINT、扣押数据沉淀、制裁或诈骗标识符，以及客户或伙伴输入，共同锚定实体标签。
