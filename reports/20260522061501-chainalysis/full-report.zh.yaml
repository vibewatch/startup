      - number: '6.3'
        title: 私营部门证据最强的是合规工作流和银行赋能场景
        blocks:
          - type: paragraph
            body: >-
              私营部门记录真实存在，但比公共部门记录窄，更偏合规深度而非商业深度。在交易所和 VASP 中，BitMEX 披露的结果最干净：它称 Chainalysis 的监控和调查工具帮助把链上风险敞口从 2019 年的
              1.7% 降至 2024 年的 0.2%，并支持了一起与 Interpol 通知相关的庞氏骗局拦截。Bitfinex 把 Chainalysis 描述为可配置、可跨司法辖区使用的合规标准；Bitfinex
              黑客事件更新则把该案写成交易所与执法机构协作的样板。Mercado Bitcoin 称，Chainalysis 帮助把可疑对象识别时间缩短
              50%，支持监管沟通，并支撑欧洲扩张。跳出加密原生场所，银行和支付案例说明了 Chainalysis 为什么能卖到纯交易所细分市场之外。Morabanc 称，工具支持数字资产客户 48 小时入驻；Banca
              Sella 用它补上区块链控制，又不破坏银行级合规；Onyze 称，与监管机构共享的数据集提升了银行信任；BVNK 称，产品从一开始就嵌入，用来支持英国、欧盟和美国数字资产占比较高的资金流转。BTC
              Markets 和 Busha
              又把地域样本扩展到澳大利亚和非洲。共同线索很清楚：公开参考客户证明了它在合规、入驻、财富来源审查和调查中的生产级使用，但对合同规模、总留存率（GRR），以及私营部门增长中银行与加密原生平台各占多少，仍几乎没有说明。
