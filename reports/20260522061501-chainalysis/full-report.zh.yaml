      - number: '4.2'
        title: 增长轨迹、公开牵引力与客户集中度
        blocks:
          - type: paragraph
            body: >-
              公开证据支持这是一门已经有相当规模的真实生意，但几乎每个硬数字都是估计或方向性代理，而不是公司披露。Sacra 估计 2023 年 ARR 为 $190M，并预测 2024 年底到
              $250M；这符合用户给出的工作区间，也与 Chainalysis 早期关于大客户和客户扩张的信号方向一致。组合故事和收入线同样重要。CoinDesk 报道 2020 年公共和私营收入大致五五开，而 Sacra
              称 2023 年政府和监管收入占 66%，Forbes 称到 2023-2024 年公共部门占比超过 70%。USAspending 和 Carahsoft 进一步说明公共部门需求不是营销话术：FBI、IRS 和
              ICE 主导可见联邦义务金额，分销商载体又把覆盖延伸到 GSA、NASA SEWP、Army ITES-SW2 和 SLED
              渠道。这个组合在加密下行周期提升了耐久性，但也意味着续约、预算和采购风险越来越绑定政府日历，而不只是商业交易量。
