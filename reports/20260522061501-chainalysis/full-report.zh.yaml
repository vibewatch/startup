            body: >-
              公开财务支撑仍高度依赖估计，但足够用于搭框架。Sacra 的工作仍把收入案例锚定在 2023 年约 $190 million ARR，以及 2024 年预计约 $250 million；Chainalysis 新
              CFO 只补充了方向性证据，即 ARR 增长在 2025 年加速。在这个有支撑的区间上，较早的 $2.5 billion 标记意味着约 10.0x 至 13.2x EV/ARR，而 Yahoo 的 $1.32
              billion 估计只意味着约 5.3x 至 6.9x。这道差距就是估值争论的核心。Hercules
              官方公告清楚表明，管理层选择非稀释性增长融资，而不是新一轮股权融资；这指向可选性，并非明显困境。不过，市场仍应打折，因为公司没有以承销级细节公开披露债务规模、定价或契约。再加上 Forbes
              证据显示，商业需求走弱后公共部门收入集中度达到约 70%，正确表述就不是“最佳同类加密资产数据平台理应享受溢价”，而是“耐久平台应在私有细节打开前承受折价”。
