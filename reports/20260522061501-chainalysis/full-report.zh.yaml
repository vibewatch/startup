      - number: '3.4'
        title: 耐久性来自信任和工作流嵌入，但低端仍可能商品化
        blocks:
          - type: paragraph
            body: >-
              Chainalysis 的护城河论点，在任务需要监管信任、证据文档以及跨执法、监管和主要交易所的广泛可引用性时最强。因此，即使 TRM 和 Elliptic 是可信挑战者，公司在最高信任度板块仍最难被替代。TRM
              的最佳攻击向量是现代 AI 驱动调查和强公私使命叙事。Elliptic 的攻击点是机构金融就绪度和全球银行客户覆盖。Merkle
              的攻击点是敏捷的行为监测。这些威胁都真实存在，但并非同一种威胁：它们分别在工作流栈的不同角落打得最凶。

              反向证据很重要，因为它说明耐久性在哪里变弱。State of Surveillance 把整个品类描述为监控基础设施，并质疑启发式归因的确定性。ChainAware
              认为市场部分买方被卖了过大的合规栈，实际任务并不匹配。ChainGain 显示买方现在可以在免费基线、低价自助工具和昂贵企业套件之间选择。CipherTrace
              的收缩提醒投资人，分发能力本身并不能保证收购后的产品动能。更可能的胜负格局是细分的：当买方想要最安全的机构答案，尤其是在公共部门、交易所合规和高风险调查里，Chainalysis 可能赢。AI
              优先工作流、银行级合规自动化或更新的机构通道更重要时，TRM 或 Elliptic 更有位置。买方核心需求是研究速度而不是面向监管的证明时，Nansen 和更轻的替代品可以赢。投资人应把 Chainalysis
              的护城河看成耐久但分段，而不是普适。
