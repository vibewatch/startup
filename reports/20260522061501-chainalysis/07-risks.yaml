callouts:
- calloutType: risk
  title: The dominant risk is policy-driven concentration, not lack of customer need
  body: Chainalysis looks strategically important, but a large and rising share of visible demand is tied to governments, procurement channels, and the shape of enforcement priorities rather than to fully diversified private-sector SaaS demand.
  claimRefs:
  - CR009
  - CR010
  - CR012
  - CR015
  - CR045
- calloutType: insight
  title: Courtroom admissibility is necessary but not sufficient
  body: The Bitcoin Fog record helps on commercial defensibility, yet the public debate shows that clustering accuracy, operator attribution, peer review, and error-rate disclosure can still be attacked separately.
  claimRefs:
  - CR025
  - CR028
  - CR029
  - CR030
  - CR031
  - CR048
- calloutType: recommendation
  title: Do not underwrite premium upside without concentration and precision data
