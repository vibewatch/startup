  evidenceGaps:
  - type: missing-source
    severity: material
    topic: government-concentration
    missingEvidence: A customer-by-customer ARR breakdown, top-agency renewal dates, and direct-versus-reseller revenue mix for 2024-2026.
    whyItMatters: Without exact concentration and renewal schedules, the downside from policy or procurement shocks cannot be sized precisely.
    diligencePath: Request top-10 customer concentration, reseller margin share, and agency renewal calendars in the data room.
    relatedQuestionRefs:
    - QR019
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: material
    topic: model-precision
    missingEvidence: Current recall and precision by chain, asset class, mixer, bridge, privacy protocol, and alert disposition workflow.
    whyItMatters: Public debate about accuracy is hard to underwrite without a live performance distribution across the risk categories that matter most to buyers.
    diligencePath: Request model-performance dashboards, QA methodology, human-review rates, and false-positive override data for the last 12 months.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: wrongful-freeze-disputes
    missingEvidence: A log of customer disputes, reversed escalations, civil claims, and appellate outcomes involving Chainalysis-driven actions.
    whyItMatters: Wrongful-freeze or attribution disputes can create outsized reputational and litigation damage even if they are statistically rare.
    diligencePath: Ask for legal-dispute summaries, customer escalation metrics, and any policy or insurer feedback on attribution disputes.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: integration-and-retention
    missingEvidence: Post-acquisition integration scorecards, attrition by function, open hiring plan, and customer attach rates for Alterya and Hexagate.
    whyItMatters: Mitigation maturity and execution quality depend on retaining scarce AI, security, and investigative talent while integrating acquired products.
    diligencePath: Request quarterly integration KPIs, retention by critical function, and cross-sell or attach metrics for the acquired products.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR004
  - type: enumeration-incomplete
    severity: minor
    topic: global-regulatory-coverage
    missingEvidence: A jurisdiction-by-jurisdiction map of Chainalysis revenue, licensing exposure, and enforcement touchpoints across top markets.
    whyItMatters: The public record supports a severity-ranked register, but not a truly exhaustive ledger of all legal exposures by jurisdiction.
    diligencePath: Request a geo revenue bridge with regulatory owners, major licenses, and outstanding enforcement or supervisory interactions.
    relatedQuestionRefs:
    - QR003
    relatedTableRefs:
    - TR001
