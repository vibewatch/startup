- id: mitigations-monitoring-and-thesis-breakers
  title: Mitigations are real, but diligence should focus on measurable kill criteria
  body: 'The mitigation story is credible enough that the risk chapter should not be read as a short thesis. Chainalysis is clearly trying to move left on the problem: Alterya adds fraud detection before funds settle into crypto, Hexagate adds real-time exploit prevention, and Hercules financing gives management room to keep investing in AI and data rather than simply retrench. Those are rational responses to the risk map because the highest-growth criminal categories increasingly require prevention and faster triage, not just post hoc tracing. But the public record still lacks the KPIs needed to prove mitigation maturity. There is no public error-budget dashboard by chain or typology, no disclosure of dispute or reversal rates, no clean view of attachment for acquired products, and no detailed customer concentration schedule. As a result, the right underwriting stance is conditional. Monitor concentration, legal precedent, precision disclosure, acquisition integration, and competitive win-loss
    evidence. If those data points improve, the downside narrows materially. If they do not, the company can still be strategically important while remaining too opaque to underwrite at premium assumptions.'
