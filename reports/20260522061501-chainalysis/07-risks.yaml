- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Government concentration
    - Public-sector mix and top-agency disclosure
    - Public-sector revenue stays above 75% or management refuses top-customer detail
    - Cut upside assumptions and require concentration disclosure before underwriting premium multiple
  - - Evidentiary backlash
    - Adverse appellate or civil development on attribution methods
    - A court materially constrains heuristic evidence or a wrongful-freeze dispute becomes public and credible
    - Pause underwriting until QA controls and legal exposure are reviewed
  - - Policy regime
    - Shift from outsourced analytics to internal bank capability
    - Large banks or exchanges standardize internal workflow ownership after new regulatory clarity
    - Lower long-term pricing power and seat-growth assumptions
  - - Traceability limits
    - No measured performance by risk archetype
    - Management cannot show precision / recall by chain, bridge, mixer, privacy protocol, and alert workflow
    - Assume lower win rates in high-end compliance and investigative use cases
  - - Talent and integration
    - Execution miss on acquisitions or another senior departure
    - Leadership turnover, missed product roadmap milestones, or poor attach rates for Alterya / Hexagate
    - Apply execution discount and shorten time to re-underwrite
  - - Competitive intensity
    - Rival funding converts into account wins or price pressure
    - TRM or Elliptic take marquee government or bank accounts or pricing compresses by more than 10%
    - Rework retention, CAC efficiency, and terminal multiple assumptions
  notes: These are investment kill criteria, not operational SLAs; they focus on metrics that can actually change underwriting rather than generic sentiment about crypto.
