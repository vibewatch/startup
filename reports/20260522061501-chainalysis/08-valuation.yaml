company:
  name: Chainalysis
chapter:
  number: 8
  title: Valuation
  summary: 'Chainalysis’s valuation record is now a three-step ladder rather than one current number: $4.2B at Series E, ~$8.6B at Series F, then a reset to a ~$2.5B 2024-2025 private-market mark and an even lower ~$1.3B 2026 marketplace-indicative mark. Against the only supportable ARR band of roughly $190M to $250M, the current marks look far more defensible than the old round headlines, but disclosure gaps on debt terms, cap table, and current mix still make the right call research-more and strongly price-sensitive.'
sections:
- id: valuation-reset
  title: Headline rounds reset hard once secondary marks replaced financing headlines
  body: 'The cleanest valuation evidence is historical and the noisiest evidence is current. Chainalysis directly confirmed a $4.2 billion Series E in 2021, then public reporting put the May 2022 Series F at roughly $8.54 billion to $8.6 billion. Those figures are real, but they are financing headlines from a very different liquidity regime. The more relevant post-boom evidence comes from market-data providers and transaction logs: Sacra’s 2024 profile lists Chainalysis at $2.5 billion, CB Insights shows visible 2024-2025 private-market activity including a March 2025 secondary entry tied to Fabrica Ventures, and 2026 marketplace pages from Yahoo, Forge, and Hiive show current share indications clustered around $6.09 to $6.19. Yahoo translates that into only about $1.32 billion of estimated valuation. The underwriting lesson is to separate confirmed historical round marks from current, liquidity-discounted marketplace marks instead of blending them into one faux-precise “current valuation.”'
