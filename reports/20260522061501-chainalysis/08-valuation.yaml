  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: hercules-debt-terms
    missingEvidence: Executed Hercules facility agreement, current drawn amount, interest rate, covenants, collateral package, and any limits on future financing or acquisitions.
    whyItMatters: A modest senior-secured facility can still change valuation if the covenants or pricing meaningfully restrict flexibility or signal stress.
    diligencePath: Request the signed credit agreement, latest compliance certificate, debt schedule, and board materials explaining why debt was preferred over equity in October 2025.
    relatedQuestionRefs:
    - QV014
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: current-arr-and-mix
    missingEvidence: Current ARR, public/private revenue split, product contribution from Alterya and Hexagate, and commercial cohort growth through 2025-2026.
    whyItMatters: The difference between a 5x multiple and a 10x multiple depends on whether 2025 acceleration was modest, broad-based, or mostly public-sector driven.
    diligencePath: Request CFO diligence materials showing ARR bridge, segment mix, and customer cohort performance for 2024, 2025, and current year-to-date.
    relatedQuestionRefs:
    - QV026
    - QV028
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-liquidity
    missingEvidence: Current fully diluted share count, preference stack, any post-Series-F amendments, and recent matched secondary trade sizes or clearing prices.
    whyItMatters: Indicative share prices are hard to convert into investable returns without the current denominator, liquidation stack, and proof that liquidity exists at size.
    diligencePath: Request cap table, charter summary, preference waterfall, and broker or platform evidence for recent executed secondary trades.
    relatedQuestionRefs:
    - QV008
    - QV028
    relatedTableRefs:
    - TV004
    - TV006
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table coverage gap
    missingEvidence: A fuller list of public and private cyber, compliance, and analytics comparables with normalized growth, margin, and liquidity adjustments.
    whyItMatters: The comparable table is intentionally sampled to the most supportable open-web anchors, which is enough for direction but not a full-screen comparable set.
    diligencePath: Build a paid-data comp screen in PitchBook, CapIQ, or a broker secondary dataset and reconcile each candidate to the same revenue and liquidity lens.
