- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Why it matters
  - Action implication
  rows:
  - - Current ARR misses the public band
    - Verified ARR lands materially below the $190M-$250M frame
    - The whole valuation range depends on at least that scale being real.
    - Reset base and bear cases downward immediately.
  - - Government mix rises further
    - Public-sector revenue remains ~70% and commercial growth does not reaccelerate
    - The company starts to look more like a concentrated contractor than a balanced software platform.
    - Demand a lower multiple or walk away.
  - - Debt constraints are tighter than expected
    - Hercules docs reveal restrictive covenants, expensive pricing, or acquisition limits
    - Senior secured debt can cap strategic flexibility even if headline size is modest.
    - Treat leverage as a real downside multiplier.
  - - Secondary market is not actually executable
    - Quoted 2026 marketplace prices cannot be transacted at size
    - The attractive entry case depends on real liquidity near those marks.
    - Do not underwrite upside off teaser prices.
  - - Governance keeps moving
    - Further senior turnover or evidence of board-level instability
    - Execution discount expands when leadership is still settling.
    - Require more discount or delay the trade.
  notes: Kill criteria intentionally tie valuation failure to observable facts rather than to generic market noise.
  claimRefs:
