- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - 'Bull thesis: category leader with real public-sector embed and data moat'
    - Series E/F history, 70+ country footprint, and direct peer gap vs TRM and Elliptic show Chainalysis remains the scaled asset in this niche.
    - Need proof that 2025 private-sector acceleration translated into sustained ARR growth, not just narrative.
  - - 'Bull thesis: current secondary indications already price a lot of bad news'
    - Yahoo, Forge, and Hiive marks cluster near ~$1.3B versus the prior $2.5B-$8.6B anchors.
    - Need evidence that those marks are actually executable in size and not just sparse broker-style indications.
  - - 'Anti-thesis: majority government mix deserves a discount'
    - Forbes reports ~70% public-sector revenue and a retreat from weaker commercial demand.
    - Need cohort evidence showing commercial customers reaccelerated and concentration is easing.
  - - 'Anti-thesis: governance and disclosure remain too private'
    - CEO transition, non-dilutive debt, and absent debt/cap-table detail make the story less underwriteable than the brand suggests.
    - Need current ARR by segment, debt docs, and board-level financing rationale.
  notes: The table intentionally pairs each thesis with the exact diligence item that could upgrade or downgrade the view.
