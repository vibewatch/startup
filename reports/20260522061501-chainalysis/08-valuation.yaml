- id: arr-and-credit-underwrite
  title: The ARR range supports a fair entry only if the debt and disclosure discount stays real
  body: Public financial support remains estimate-heavy but useful enough for framing. Sacra’s work still anchors the revenue case at roughly $190 million of ARR in 2023 and about $250 million projected for 2024, while Chainalysis’s new CFO only adds directional evidence that ARR growth accelerated through 2025. On that supported range, the older $2.5 billion mark implies roughly 10.0x to 13.2x EV/ARR, whereas Yahoo’s $1.32 billion estimate implies only about 5.3x to 6.9x. That gap is the core valuation debate. The official Hercules announcement makes clear that management chose non-dilutive growth financing rather than a fresh equity round, which points to optionality, not obvious distress; however, the market should still charge a discount because the company has not publicly disclosed debt size, pricing, or covenants in underwriter-grade detail. Add Forbes’ evidence that public-sector revenue concentration reached about 70% as commercial demand weakened, and the right framing is not “best-in-class crypto data platform deserves a premium” but rather “durable platform deserves a discount until the private details are opened.”
