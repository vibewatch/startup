  - - Chainalysis (2026 indicative)
    - Yahoo / Forge / Hiive, May 2026
    - ~$1.32B estimated valuation; $6.09-$6.19 per share
    - Marketplace-indicative mark
    - Best available current pricing signal.
    - Indicative only; price discovery is thin and not management-sponsored.
  - - TRM Labs
    - Series C, Feb 2026
    - $1.0B valuation
    - Private financing comparable
    - Nearest direct blockchain-analytics peer with faster growth.
    - Revenue base and profitability are less disclosed than Chainalysis.
  - - Elliptic
    - Series D, May 2026
    - $670M valuation
    - Private financing comparable
    - Direct crypto-compliance peer with meaningful bank footprint.
    - Smaller scale and different geography mix.
  - - Recorded Future
    - Mastercard acquisition, Sep 2024
    - $2.65B control value
    - Strategic M&A comparable
    - Most useful strategic-intelligence exit reference.
    - Threat-intel is adjacent, not identical, to blockchain analytics.
  - - Cellebrite
    - Public market, May 2026
    - $2.77B EV; 5.59x EV/Sales
    - Public investigations-software floor
    - Useful anchor for evidence-led investigation tooling.
    - Public market liquidity and disclosure are far better than Chainalysis.
  - - NICE
    - Public market, May 2026
    - $5.16B EV; 1.71x EV/Revenue
    - Public compliance-software floor
    - Useful lower-multiple anchor for mature compliance analytics.
    - Much more mature and less growth-oriented than Chainalysis.
  - - Palantir
    - Public market, May 2026
    - $321.61B EV; 61.56x EV/Revenue
    - Frontier analytics ceiling
    - Shows what a public, high-growth government analytics narrative can earn.
    - Too broad and too public to be a realistic base-case comp.
