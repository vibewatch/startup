- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation range
  - Implied multiple logic
  - Probability signal
  rows:
  - - Bear
    - Current secondary price is the right truth signal, government concentration persists, and debt/cap-table opacity keeps buyers cautious.
    - $0.9B-$1.2B
    - Roughly 5x ARR on the low end of the supported band.
    - Most likely if 2025 acceleration proves shallow or non-commercial.
  - - Base
    - ARR at least holds inside the $190M-$250M public band, strategic value remains real, but disclosure discount stays large.
    - $1.4B-$1.8B
    - Roughly 6x-8x on the supported ARR range.
    - Requires durable but not explosive 2025-2026 execution.
  - - Bull
    - 2025 ARR materially outgrew the public 2024 estimate, private-sector growth reaccelerated, and exit optionality narrows the liquidity discount.
    - $2.3B-$2.8B
    - Back toward the prior 2024-2025 private mark / Recorded Future control-value zone.
    - Needs hard KPI proof, not just marketplace optimism.
  notes: Scenario ranges are analytical outputs anchored on public ARR estimates, secondary marks, and comparable bands rather than on audited management guidance.
