- id: TV001
  title: Recommendation summary table
  columns:
  - Lens
  - Current read
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Research more
    - 2026 indicative marks look workable, but current ARR magnitude, debt terms, and cap-table detail remain private.
    - Stay engaged only with diligence access and executable secondary pricing.
  - - Confidence
    - Medium
    - Valuation history is well evidenced, while live private-market price and KPI quality are still estimate-driven.
    - Use ranges, not a single target price.
  - - Risk rating
    - High
    - Government concentration, governance reset, and hidden debt terms justify a meaningful liquidity and transparency discount.
    - Underwrite downside before upside.
  - - Valuation stance
    - Fair near ~$1.3B; stretched near ~$2.5B
    - Supported ARR range makes current indicative pricing 5x-7x EV/ARR, but the older private mark 10x-13x.
    - Do not anchor on the 2022 round headline.
  notes: Summary table uses public marks and estimated ARR; no line should be read as a management-guided valuation target.
