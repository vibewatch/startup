- id: price-sensitive-recommendation
  title: Recommendation should stay price-sensitive until management opens the private data room
  body: 'The practical investment call is price, not admiration. If a buyer can reliably access stock near the current secondary indications around $1.3 billion, Chainalysis starts to look fair-to-attractive because that price embeds a heavy discount to the last financing, sits close to the investigation-software public floor, and leaves upside toward a Recorded-Future-like strategic outcome. If the real executable price is still closer to the older $2.5 billion mark, the case weakens meaningfully because investors would be paying 10x to 13x EV/ARR for a company with private margins, an opaque debt package, majority government mix, and only directional evidence of renewed private-sector growth. That is why the recommendation is research-more rather than buy. The remaining work is clear: verify current ARR by segment, inspect the Hercules documents, confirm the current cap table and preference stack, and test whether 2025-2026 private-sector acceleration is durable enough to close the gap
    between strategic value and tradeable value.'
