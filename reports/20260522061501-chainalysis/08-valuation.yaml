- id: comps-and-exit-path
  title: Comparable evidence points to a mid-band outcome and a strategic exit before an IPO
  body: 'Comparable evidence argues against both extremes. Chainalysis still sits above the direct blockchain-analytics peer set: TRM raised at $1 billion in 2026 and Elliptic at $670 million, both materially below even the 2026 implied Chainalysis mark. But the company also lacks the disclosure quality or growth proof needed to justify a Palantir-like frontier multiple. Public comp anchors are therefore more useful as a bracket: NICE shows where mature compliance software can settle at roughly 1.7x EV/revenue, Cellebrite shows a more relevant investigation-software floor near 5.6x EV/sales, and Palantir shows the outer limit for a government-and-data platform with exceptional public growth and disclosure. The best strategic-outcome comp is Recorded Future’s $2.65 billion sale to Mastercard, because it prices a scaled intelligence asset with embedded enterprise and public-sector workflows. That makes a mid-band range more believable than a return to $8.6 billion, and it also makes a strategic
    transaction more plausible than a near-term IPO, especially because Forge still says Chainalysis has not officially endorsed a listing process.'
