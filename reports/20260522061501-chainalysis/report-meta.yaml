companyProfile:
  summary: Chainalysis is a New York-headquartered blockchain intelligence platform with Copenhagen roots, founded in 2014 by Michael Gronager, Jan Møller, and Jonathan Levin. It sells investigations, compliance, and fraud-prevention products plus data, services, and research to government agencies, exchanges, financial institutions, and cybersecurity teams in more than 70 countries. The company has raised roughly $536.6M, last disclosed a $170M Series F at an $8.6B valuation in 2022, and now appears to trade closer to a ~$2.5B private-market mark after the sector reset. Public evidence supports real scale and strategic relevance, but private financial disclosure remains incomplete.
