  foundingLocation: Copenhagen, Denmark
  headquarters: New York, NY
  productSummary: Chainalysis sells blockchain investigations, transaction monitoring, data-access, and fraud-prevention software plus related services, training, and research across the Reactor, KYT, Data Solutions, Alterya, and Hexagate stack.
  customerFocus: Government investigators, regulators, exchanges, banks, custodians, payment firms, and enterprise risk/compliance teams rather than consumers.
  businessModel: Quote-based enterprise software and data subscriptions with services, training, and public-sector support engagements layered around the core platform.
  stage: Late-stage private (post-Series F)
  fundingStatus: Last disclosed equity round was the May 2022 Series F ($170M at $8.6B). Lifetime funding is roughly $536.6M, and the company later added Hercules non-dilutive growth financing in October 2025.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO005, CO012, CO015, CO016, CO031, CI022]
