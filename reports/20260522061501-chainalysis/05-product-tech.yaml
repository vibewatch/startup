- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - prior pain point
  - chainalysis workflow
  - measurable or claimed benefit
  - limitation
  rows:
  - - Front-line detective receives a scam complaint
    - Wallets are hard to interpret without specialists
    - Rapid triages address, scores risk, and identifies likely legal-request targets
    - Plain-language summaries and instant prioritization for non-experts
    - No public benchmark on mistaken escalations
  - - Exchange compliance analyst reviews inbound or outbound flow
    - Manual rescreening and noisy queues slow response
    - KYT screens transactions in real time; Address Screening scores wallets; alerts escalate to Reactor
    - Seconds-level alerts and customizable thresholds
    - Risk-rule calibration remains customer-specific and private
  - - Investigator builds a full case
    - Cross-chain swaps, mixers, and bridges obscure the path
    - Reactor traces funds and maps counterparties; Signals adds more context
    - Single investigative workflow across chains and entities
    - Large investigations can still become complex or cluttered
  - - Search team recovers seed phrases during a raid
    - Manual wallet checks are slow and error-prone
    - Wallet Scan processes seed phrases offline, then hands findings to Reactor
    - Faster seizure decisions with lower data-handling risk
    - No public matrix of every derivation edge case
  - - Stablecoin issuer or reserve bank monitors ecosystem integrity
    - Secondary-market holders and exposure are hard to see
    - Sentinel watches holdings and alerts; KYT and Reactor support follow-up; Hexagate covers technical exploits
    - Freeze-or-review workflows for both compliance and security events
    - Operational authority to freeze depends on issuer governance and jurisdiction
  - - Regulator or intelligence analyst needs bespoke monitoring
    - Fixed dashboards cannot answer mission-specific questions
    - Data Solutions runs custom queries, alerts, exports, and notebooks; services teams fill expertise gaps
    - Better fit for bespoke supervision or intelligence tasks
    - Technical depth or services budget is still required
  notes: Workflow rows describe observable product handoffs; they are not substitutes for contracted SLAs or legal process authority.
