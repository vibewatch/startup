  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: kryptos-public-docs
    missingEvidence: A current official product page or technical note that explains Kryptos scope, its data model, and its relationship to VASP Risking or Sentinel.
    whyItMatters: Without it, the public module map for the entity-risk stack remains partly inferential and legacy naming could mislead buyers.
    diligencePath: Request the current product taxonomy or a demo deck that explicitly maps Kryptos, VASP Risking, and Sentinel.
    relatedQuestionRefs:
    - QE008
    - QE016
    relatedTableRefs:
    - TE001
  - type: access-blocked
    severity: material
    topic: ds-api-schema
    missingEvidence: Authenticated Data Solutions documentation with exact schemas, rate limits, tenant boundaries, and environment or SLA details.
    whyItMatters: Public SDK materials prove programmability but not the operational constraints that matter for production integration and security review.
    diligencePath: Obtain a trial or customer view of data.chainalysis.com and export the current DS technical-reference bundle.
    relatedQuestionRefs:
    - QE010
    - QE027
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: ai-prevention-benchmarks
    missingEvidence: Independent benchmark data or customer case studies validating Rapid, Alterya, Hexagate, or AI-agent precision, false-positive rates, or analyst time savings.
    whyItMatters: The newest prevention and automation surfaces are strategically important but are still supported mostly by vendor or partner narratives.
    diligencePath: Ask for audited customer references or third-party validations tied to specific deployment outcomes, not launch-language summaries.
    relatedQuestionRefs:
    - QE023
    - QE028
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: privacy-coin-coverage
    missingEvidence: A current public matrix covering product behavior for privacy coins, mixers, and privacy-preserving protocols, including what is unsupported or only partially supported.
    whyItMatters: Public reviews make the direction of the limitation clear, but not the exact boundaries, which matters for underwriting privacy-heavy customers or investigations.
    diligencePath: Request a current chain-and-asset support matrix and test plan specifically covering Monero and privacy-enhancing transaction patterns.
    relatedQuestionRefs:
    - QE021
    - QE027
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: public-developer-surface
    missingEvidence: Partner-portal metrics, public changelogs, or additional repositories that show the real level of external developer activity around DS and screening APIs.
    whyItMatters: The public GitHub footprint looks minimal, but that does not prove low developer adoption if the ecosystem is partner-gated rather than open.
    diligencePath: Ask the company for customer-developer metrics, changelog access, and public examples beyond the Python SDK package.
