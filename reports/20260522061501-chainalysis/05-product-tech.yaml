- id: data-architecture
  title: Shared intelligence and analytics infrastructure are the technical core
  body: 'The technical moat is the shared intelligence layer beneath the SKUs. Chainalysis says it collects ground-truth attributions, then compounds them with network-wide and service-specific heuristics that can be reused across screening, graphing, risk scoring, and custom analytics. That architecture is visible in the Data Solutions product, which exposes SQL, notebooks, no-code workflows, custom APIs, and bulk exports rather than just fixed dashboards. Partner documentation from Dfns and IBM shows that this shared intelligence is not theoretical: it powers outbound prescreening, inbound monitoring, and webhook-triggered policy decisions in third-party operational systems across major chains. The public Python SDK and PyPI package reinforce that DS is meant to be programmable, including analytical queries against cross_chain.clusters and graph-based autotracing. But the developer surface is still narrow by mainstream software standards. The public GitHub org showed no listed repositories
    at fetch time, while richer docs appear to live behind account creation or partner portals. That combination implies a powerful but relatively closed product strategy: APIs and SDKs exist, yet most of the real implementation detail appears designed for paid customers, embedded services, or private enablement rather than a broad open-source ecosystem.'
  claimRefs:
  - CE011
  - CE017
  - CE018
  - CE019
  - CE020
