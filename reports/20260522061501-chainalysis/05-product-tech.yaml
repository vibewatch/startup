- id: deployment-and-trust
  title: Deployment flexibility, services, and assurance signals widen the moat
  body: 'Deployment flexibility and service density look especially important in government and regulated-enterprise sales. Reactor explicitly advertises cloud, on-premises, and FedRAMP-authorized options, while the platform page highlights the shared controls that make those promises believable at a surface level: fault tolerance, load balancing, monitoring, incident response, APIs, integrations, SOC 2 Type 2, and FedRAMP. AWS''s description of GovCloud as a separate partition for government-sensitive workloads helps frame why those deployment claims matter, even though Chainalysis does not publish its precise reference architecture. On top of infrastructure, Chainalysis sells people. Government and services pages emphasize embedded mission staff, case support, intelligence consulting, and custom data tools, which suggests customer value is partly software and partly accumulated tradecraft. Carahsoft''s procurement pages deepen that picture by showing federal and state buying rails through
    GSA MAS, NASA SEWP V, ITES-SW2, NASPO, and related vehicles. In practice that means a buyer is not only adopting software modules; it is also buying a delivery model that can fit public-sector procurement, compliance review, training, and high-stakes operational support.'
  claimRefs:
  - CE003
  - CE025
  - CE026
  - CE027
  - CE028
  - CE032
  - CE034
