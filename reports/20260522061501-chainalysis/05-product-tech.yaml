      label: Address, transaction, or seed artifact appears
      type: input
    - id: screen
      label: Rapid / KYT / Address Screening score the signal and add context
      type: process
    - id: decision
      label: Analyst decides whether the signal merits escalation
      type: decision
    - id: trace
      label: Reactor (and sometimes Wallet Scan) builds the deeper trace and entity map
      type: process
    - id: review
      label: Compliance or investigative team adds due diligence and case notes
      type: process
    - id: action
      label: Freeze, escalate, subpoena, SAR, or incident-response action
      type: output
    - id: feedback
      label: Watchlists, thresholds, and monitoring rules are updated
      type: process
    edges:
    - from: signal
      to: screen
    - from: screen
      to: decision
    - from: decision
      to: trace
    - from: trace
      to: review
    - from: review
      to: action
    - from: action
      to: feedback
  approximationNotes: Represents the common workflow implied across product pages and partner docs; specific customer playbooks vary by regulator, exchange, or issuer.
