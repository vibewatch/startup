  rows:
  - - Reactor
    - Investigators, regulators, tax and intelligence teams
    - Graph-based tracing, entity attribution, case-building
    - Flagship product with integrations, deployment options, and public-sector packaging
    - Cross-chain workflow, human-readable automation, Signals context
    - No public pricing or throughput SLA
  - - Rapid
    - Front-line investigators and intake teams
    - Plain-language crypto triage and prioritization
    - Official product page plus 2025 launch coverage
    - No-download browser access, one-click escalation to Reactor
    - No independent audit of summary quality
  - - Wallet Scan
    - Search and seizure teams
    - Offline recovery-seed and key-material review
    - Official product plus Labs incubation story
    - Offline processing of seed phrases and advanced key formats
    - Coverage of every wallet format is not independently tested
  - - KYT + Address Screening
    - Compliance operations and risk teams
    - Real-time transaction monitoring plus wallet exposure screening
    - Official pages and partner integration docs
    - Seconds-level alerts, network-agnostic exposure, API/webhook workflows
    - Rule tuning accuracy and customer-specific false-positive rates are undisclosed
  - - VASP Risking + Sentinel
    - Counterparty-risk teams and token issuers
    - Entity diligence, ecosystem monitoring, freeze-or-review workflows
    - Current official pages for both products
    - Off-chain VASP data, issuer-specific token monitoring, Reactor handoff
    - Kryptos-to-VASP-Risking mapping is only partially documented publicly
  - - Data Solutions
    - Analysts, regulators, intelligence, advanced compliance teams
    - Custom analytics, alerting, enrichment, and automation
    - Official DS page, SDK docs, and public package release
    - SQL, Jupyter, no-code workflows, custom APIs, bulk exports
    - Most operational docs and schemas still appear gated behind account access
  - - Alterya + Hexagate
    - Fraud, cyber, exchange, and protocol security teams
    - APP-scam blocking plus on-chain exploit prevention
    - Official product pages and 2025 launch/update coverage
    - Pre-transaction prevention, ML monitors, automated response playbooks
    - Newest precision claims rely heavily on vendor or partner-sourced evidence
