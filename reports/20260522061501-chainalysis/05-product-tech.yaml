callouts:
- calloutType: strength
  title: 'Strength: one intelligence spine, many workflows'
  body: The strongest product-tech argument is architectural reuse. Chainalysis keeps adding surfaces, but the same attribution, clustering, screening, and entity-context engine shows up underneath investigations, monitoring, data products, fraud prevention, and web3 security.
  claimRefs:
  - CE001
  - CE029
  - CE030
  - CE041
- calloutType: risk
  title: 'Risk: the moat still depends on heuristics outsiders cannot fully inspect'
  body: Accuracy claims are credible enough to matter, but not so settled that buyers should stop asking hard questions. Peer-reviewed support exists, yet adversarial legal filings still target heuristic opacity, ownership attribution, and the limits of extrapolating from clustering to culpability.
  claimRefs:
  - CE034
  - CE035
  - CE036
  - CE037
  - CE038
- calloutType: insight
  title: 'Implication: 2025-2026 growth is about prevention and automation, not just tracing'
  body: The important story is not another marginal improvement to Reactor. It is the move into APP-fraud prevention, web3 exploit prevention, stablecoin issuer workflows, and AI-assisted triage or agentic analysis — all of which widen the budget line Chainalysis can target.
  claimRefs:
  - CE021
  - CE023
  - CE039
  - CE040
