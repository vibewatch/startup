  - id: private-sector-reference-customers
    title: Private-sector proof is strongest in compliance workflows and bank-enablement use cases
    body: >-
      The private-side record is real, but it is narrower than the public-sector record and skews toward compliance
      depth instead of commercial depth. Among exchanges and VASPs, BitMEX provides the cleanest disclosed outcome:
      it says Chainalysis monitoring and investigations tools helped cut on-chain risk exposure from 1.7% in 2019 to
      0.2% in 2024 and supported a Ponzi-scheme interdiction tied to Interpol notices. Bitfinex presents Chainalysis
      as a configurable, multi-jurisdiction compliance standard, while the Bitfinex hack update frames the case as a
      model for exchange-law-enforcement collaboration. Mercado Bitcoin says Chainalysis helped cut suspect-
      identification time by 50%, support regulatory engagement, and underpin European expansion. Beyond crypto-
      native venues, the bank and payments stories show why Chainalysis can sell above a pure exchange niche.
      Morabanc says the tooling supported 48-hour onboarding for digital-asset clients, Banca Sella uses it to add
      blockchain controls without breaking bank-grade compliance, Onyze says the regulator-shared data set builds
      trust with banks, and BVNK says the product has been embedded from inception to support digital-asset-heavy
      money movement across the UK, EU, and US. BTC Markets and Busha widen the geographic set to Australia and
      Africa. The common thread is clear: the public reference base proves production-grade usage in compliance,
      onboarding, source-of-wealth, and investigations, but it still says very little about contract size, gross
      retention, or the fraction of private-sector growth coming from banks versus crypto-native platforms.
    claimRefs:
