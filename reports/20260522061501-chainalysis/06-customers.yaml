figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: Chainalysis tends to land through a high-friction compliance or investigations need, then expand into more workflows once data trust is established.
    data:
      items:
        - label: Trigger event
          value: Scam losses, tax enforcement, sanctions exposure, digital-asset launch, or fraud risk create the initial buying reason.
        - label: Procurement or policy path
          value: Buyers then need a contract vehicle, supervisory mandate, or internal risk sponsor before deployment moves.
        - label: Initial deployment
          value: First use usually centers on training, tracing, KYT, source-of-wealth, or onboarding controls.
        - label: Operational embedding
          value: Daily casework, monitoring queues, regulator-facing reports, and cross-functional workflows follow.
        - label: Outcome proof
          value: Faster investigations, lower illicit exposure, safer onboarding, or more confident regulator conversations become the proof points.
        - label: Expansion loop
          value: Buyers can add fraud, stablecoin, payments, additional chains, or embedded services after the first workflow sticks.
    approximationNotes: The journey is analytical rather than chronological and synthesizes public-sector and private-sector deployment patterns from retained references.
    claimRefs:
      - CU008
      - CU011
      - CU019
      - CU024
      - CU048
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: Indexed funnel showing how broad digital-asset relevance narrows into the smaller subset of references with named, outcome-rich deployment proof.
    data:
      items:
        - label: Institutions and agencies facing crypto-risk or digital-asset demand
          value: 100
        - label: Buyers with a visible procurement or policy path to buy analytics
          value: 70
        - label: Public references showing named live deployment rather than generic positioning
          value: 40
        - label: References with a specific operating outcome or measurable workflow change
          value: 20
        - label: References with public renewal, concentration, or contract-economics transparency
          value: 5
    approximationNotes: Values are indexed analytical gates, not literal percentages; the point is how quickly commercial transparency drops after deployment proof appears.
    claimRefs:
      - CU001
      - CU005
      - CU019
      - CU042
      - CU043
      - CU044
