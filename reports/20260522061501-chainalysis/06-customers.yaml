  - id: TU005
    title: Expansion and concentration risk table
    columns:
      - Expansion driver
      - Concentration risk
      - Impact
      - Diligence path
    rows:
      - - Public-sector case wins and mission references
        - Government appears to be the majority of sales
        - Budget cycles and appropriations could dominate growth and renewal timing
        - Request revenue split by agency cohort, fiscal year, and direct versus channel bookings
      - - Carahsoft and contract vehicles
        - Indirect channel mix can compress realized pricing or obscure end-customer economics
        - Stronger reach but weaker visibility into net ACV and renewal accountability
        - Request reseller margin, direct-versus-indirect ACV, and vehicle-level renewal rates
      - - Bank onboarding and custody workflows
        - Proof is real but shallow on production volume
        - Logo breadth may overstate near-term revenue conversion
        - Request active users, monitored wallets, and transaction volume by bank-type customer
      - - Exchange compliance expansion into fraud and investigations
        - Crypto-native volumes can be cyclical
        - Cross-sell can grow share of wallet, but churn risk still cannot be modeled publicly
        - Request attach rates, churn, and sanctions-driven usage share by exchange cohort
      - - Payments and stablecoin use cases
        - Multi-jurisdiction support may require services-heavy delivery
        - Good expansion vector but could dilute pure-software margin
        - Request geography-level support burden and software-versus-services mix
      - - Accuracy and privacy scrutiny
        - Courtroom or policy backlash could slow some government or bank buyers
        - Reputational or evidentiary challenges may raise sales friction
        - Request legal-challenge history, false-positive controls, and exception-handling metrics
    notes: Risks are framed as underwritable questions rather than conclusions because the missing data is economic, not existential.
