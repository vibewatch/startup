  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: NRR, GRR, churn, contract length, and renewal timing by public sector, exchange, bank, and payments cohorts.
      whyItMatters: Without cohort-level retention and term data, deployment reality is clear but durability and downside resilience are still not modelable.
      diligencePath: Request cohort retention tables, logo churn, module attach, and standard term structures in the data room.
      relatedQuestionRefs:
        - QU021
      relatedTableRefs:
        - TU004
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: Revenue concentration by agency, reseller, top private customer, and public versus private bookings mix.
      whyItMatters: Government-heavy demand can be a moat, but it can also create concentration and budgeting risk that is invisible in the current public record.
      diligencePath: Request revenue split by agency cohort, reseller channel, top ten customers, and fiscal-year renewal schedule.
      relatedQuestionRefs:
        - QU022
      relatedTableRefs:
        - TU005
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: An exhaustive current customer roster with production-versus-pilot status, geography, and primary product module for each named account.
      whyItMatters: The chapter can prove real deployments, but it cannot infer total mix or concentration from a curated public reference set.
      diligencePath: Request a current customer census or anonymized cohort table that maps customer type, region, and deployed modules.
      relatedQuestionRefs:
        - QU003
        - QU007
      relatedTableRefs:
        - TU003
    - type: missing-source
      severity: minor
      topic: unsupported-logos
      missingEvidence: Direct customer confirmations for Coinbase, Kraken, or Binance if management wants those logos treated as material proof.
      whyItMatters: Public investor narratives may assume those brands are customers, but the retained record is much stronger for other named deployments.
      diligencePath: Request executed customer references, case studies, or mutually attributable statements for the specific logos management wants to cite.
      relatedQuestionRefs:
        - QU020
      relatedTableRefs:
        - TU003
