company:
  name: Chainalysis
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows Chainalysis has a real multi-segment customer base spanning federal and state law
    enforcement, regulators, exchanges, banks, custodians, and payment firms across multiple geographies.
    The strongest deployment proof is operational rather than commercial: IRS-CI contracts, Calgary and
    Connecticut police casework, BitMEX risk-reduction metrics, Morabanc onboarding speed, and private-bank
    or exchange compliance stories all point to real usage. The underwriting gap is durability and concentration:
    public materials say 1,500+ organizations trust the platform and adverse sources say government contracts are
    now the majority of sales, but public NRR, churn, top-customer concentration, and direct proof for logos such as
    Coinbase or Kraken remain thin.
sections:
  - id: customer-mix-and-scale
    title: Customer proof is broad across buyer types, but the top-line counts are still mostly vendor-curated
    body: >-
      The public customer record is broad enough to establish real demand. Chainalysis' own current surfaces say
      more than 1,500 organizations trust the platform, customers span 70 countries, and over 50 regulators or FIUs
      use the product. The mix on those same surfaces is not a generic logo wall: public-sector investigations,
      regulator supervision, exchange compliance, bank onboarding, payment and stablecoin controls, and source-of-
      wealth workflows all show up as concrete use cases. The important underwriting nuance is that the top-line
      counts remain mostly vendor-curated. The best independent cross-check in the retained set is adverse rather
      than promotional: State of Surveillance describes Chainalysis as the dominant surveillance vendor, says it has
      worked with 370 public-sector agencies and more than 1,100 private companies, and says government contracts
      now make up the majority of sales. That does not contradict the vendor's 1,500-plus framing, but it does move
      the reader away from an undifferentiated customer-count story and toward a mix story. In practice, the company
      appears strongest where buyers need evidentiary tracing, regulator-ready reporting, and procurement fit, while
      the weakest part of the public record is still the commercial shape of the installed base: how much ARR sits in
      government versus private accounts, which cohorts renew, and how much wallet or transaction volume sits behind
      the named logos.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU019
      - CU042
      - CU045
      - CU050
    tableRefs:
      - TU001
      - TU002
    figureRefs:
      - FU001
  - id: public-sector-deployment-depth
    title: Public-sector demand is the clearest and deepest part of the customer record
    body: >-
      Public-sector proof goes well beyond a marketing claim that agencies use the software. IRS-CI says the
      relationship covers platform access, training, pilot projects, and expert support, and USAspending shows both a
      Treasury award titled "PILOT IRS CRYPTOCURRENCY TRACING" and a separate IRS Criminal Investigation support-
      services contract with multiple funded modifications through 2025. State and local proof is also operational,
      not abstract. Calgary Police Service and Chainalysis jointly announced a blockchain investigations team and a
      Western Canada training centre, while Calgary's customer story says the tools reduced viability assessments from
      days to hours. Connecticut State Police says Chainalysis helped trace a pig-butchering case with losses above
      $1 million to a real-world entity that could be served with legal process, and Chainalysis keeps that quote live
      on its current government page. The named case-outcome references deepen the pattern. Chainalysis says its
      tools aided the FBI in the Colonial Pipeline case and its 2024 congressional testimony repeats that claim; the
      same investigations page ties Chainalysis-supported work to the Bitcoin Fog conviction alongside DOJ, IRS-CI,
      FBI, and Europol, and to the LockBit disruption alongside NCA, DOJ, FBI, and OFAC-linked sanctions activity.
      The result is a strong public case that government demand is not just for software seats but for a combined
      package of data, training, investigative workflow, and embedded mission support.
    claimRefs:
