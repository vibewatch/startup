  topStrengths:
    - >-
      Category-leading brand and deployment depth across government, exchanges, and financial institutions in 70+
      countries.
    - >-
      Durable public-sector embed and procurement channels helped the business stay relevant through the crypto
      downturn.
    - >-
      Broadened platform now spans investigations, compliance, data access, fraud detection, and threat defense rather
      than a single tracing tool.
    - >-
      Public evidence supports real scale, with estimated ARR in the roughly $190M-$250M band and 1,500+ organizations
      using the platform.
  topRisks:
    - >-
      Private financial disclosure remains weak: no audited current ARR, margins, retention, or customer-concentration
      schedule is public.
    - >-
      Revenue mix appears majority government/public-sector, concentrating demand on procurement cycles, agency budgets,
      and policy posture.
    - >-
      Methodology, evidentiary, and privacy critiques can pressure customer trust, courtroom defensibility, and
      regulator adoption.
    - >-
      Valuation discovery is unstable: 2025 secondary marks and thinner 2026 marketplace indications diverge sharply
      from the 2022 peak.
    - >-
      Leadership transition plus acquisition integration add execution risk while debt terms and full board visibility
      remain opaque.
  unresolvedGaps:
    - >-
      Current ARR and revenue mix by segment, including whether private-sector growth genuinely reaccelerated in
      2025-2026.
    - Executed Hercules facility size, pricing, covenants, and draw profile.
    - Current cap table, preference stack, and exact 2025 secondary transaction pricing and volume.
    - Net revenue retention, logo churn, and top-customer or top-agency concentration.
    - Current headcount and full board/governance-rights map.
