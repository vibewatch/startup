companyProfile:
  summary: >-
    Sigma Computing is a San Francisco-based private software company founded in 2014 as Bitmoon Computing. It provides
    a cloud-native analytics and business-intelligence layer over live data warehouses, using a spreadsheet-style
    interface and extending into governed AI agents and data applications.
