  topStrengths:
    - >-
      Strong reported growth to approximately $200 million ARR and more than 2,000 customers, with independent coverage
      of the latest financing.
    - >-
      Coherent warehouse-native product architecture that preserves customer data governance while extending into
      agentic analytics.
    - >-
      Strategic participation from Databricks Ventures, ServiceNow Ventures, and Workday Ventures provides ecosystem
