company:
  name: Sigma Computing
chapter:
  number: 1
  title: Company Overview
  summary: Sigma Computing is a private, San Francisco-based warehouse-native analytics company founded in 2014. Independent financing coverage repeats the company's reported growth into agentic analytics, but ownership, profitability, customer economics, and several scale metrics remain incompletely disclosed.
sections:
  - id: identity-and-product
    title: Identity, product, and leadership
    body: >-
      Sigma Computing, now branded as Sigma, was founded in 2014 as Bitmoon Computing by Rob Woollen and Jason Frantz and is headquartered in San Francisco. Its product is a cloud-native analytics and business-intelligence layer that queries live data in Snowflake, Databricks, BigQuery, and other warehouses through a spreadsheet-style interface. The warehouse-native architecture is the central product claim: users can explore large datasets without writing SQL while existing warehouse permissions and governance remain relevant. The company has expanded that base into Sigma Agents, which SiliconANGLE describes as no-code agents that can run interactively, autonomously, or through external API calls. Mike Palmer is identified as chief executive, with Woollen as co-founder and CTO and Frantz as co-founder and chief architect in the company profile. Leadership depth beyond those named executives and the board's composition are not publicly established by the assigned sources, so key-person and governance diligence remains open.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001, TO002]
  - id: financing-and-scale
    title: Financing, valuation, and operating scale
    body: >-
      Public reporting indicates that Sigma closed an $80 million Series E in May 2026 at a $3 billion valuation, led by Princeville Capital with strategic participation from Databricks Ventures, ServiceNow Ventures, and Workday Ventures. SiliconANGLE and The Next Web both report the same round and describe the valuation as double the prior $1.5 billion Series D level. The same reporting says annual recurring revenue reached $200 million in April 2026, up from roughly $100 million a year earlier, and customer count exceeded 2,000. These are reported operating metrics, not audited financial statements. Assigned profile material reports conflicting cumulative funding totals ($661 million-plus in its round table versus $961.3 million in its headline), while it explicitly says public metrics vary by source and methodology. The report therefore treats the latest round, valuation, ARR, and customer count as reported values with source and period qualifiers, not as verified accounting results.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
  - id: milestones-and-diligence
    title: Milestones, dependencies, and open diligence
    body: >-
      Sigma's trajectory combines a long-standing warehouse-native BI proposition with a recent shift toward agentic analytics. The assigned evidence records the 2014 founding, the 2021 Series C, the 2024 Series D, the 2026 Series E, the April 2026 ARR milestone, and the launch and rapid adoption of Sigma Agents. Strategic investors that are also warehouse or enterprise-software ecosystem participants may support distribution and integration, but they can also create dependence on partner priorities and competitive overlap. The competitor source describes Sigma's expanding architecture as including optional materialization and AI infrastructure layers, while positioning rival Astrato as simpler; this is a competitor's comparison, not an independent benchmark. UpGuard's page confirms ongoing external monitoring across 330-plus checks but does not disclose a breach or a passing score in the assigned text. Key unresolved items are board control, cap-table terms, profitability and cash efficiency, customer concentration, retention, and independent customer economics.
    claimRefs: [CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
