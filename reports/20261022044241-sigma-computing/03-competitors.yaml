  evidenceGaps:
    - type: missing-source
      severity: material
      topic: competitor-scale
      missingEvidence: >-
        Current independently verified revenue, customer, funding, and product-direction data for
        each material peer on a common date and definition.
      whyItMatters: >-
        The available pool supports Sigma's scale but not a comparable ranking of competitor
        resources or momentum.
      diligencePath: >-
        Collect current filings, direct company disclosures, and reputable financing coverage for
        each named peer, preserving metric definitions and reporting periods.
      relatedQuestionRefs:
        - QP002
      relatedTableRefs:
        - TP001
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: >-
        Realized quotes, discount schedules, implementation fees, embedded terms, and warehouse
        compute usage for matched Sigma and competitor workloads.
      whyItMatters: >-
        Public list signals cannot establish customer total cost or price-performance.
      diligencePath: >-
        Request normalized three-year quotes and run matched proof-of-concept workloads with compute
        telemetry across shortlisted vendors.
      relatedQuestionRefs:
        - QP004
      relatedTableRefs:
        - TP003
    - type: missing-source
      severity: material
      topic: switching-and-retention
      missingEvidence: >-
        Independent win-loss data, migration duration, workbook conversion effort, customer
        multi-homing rates, and retention by workload.
      whyItMatters: >-
        Feature differentiation does not establish durable switching costs or net retention.
      diligencePath: >-
        Interview recent wins, losses, and churned customers and inspect migration plans, usage
        cohorts, and renewal records.
      relatedQuestionRefs:
        - QP005
        - QP007
    - type: access-blocked
      severity: material
      topic: trust-and-security
      missingEvidence: >-
