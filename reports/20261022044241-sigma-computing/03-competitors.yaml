company:
  name: Sigma Computing
chapter:
  number: 3
  title: Competitors
  summary: >-
    Sigma occupies a differentiated but crowded position between spreadsheet-native warehouse
    analytics, incumbent BI suites, AI-first search, embedded analytics, and low-cost internal or
    open-source substitutes. Its live-warehouse spreadsheet and writeback model are meaningful
    differentiators, but pricing opacity, warehouse-compute exposure, improving incumbent
    DirectQuery and AI capabilities, and limited independent benchmarks constrain confidence in
    moat durability.
sections:
  - id: competitive-landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      Buyers can solve Sigma's core job through at least five routes: Sigma and newer
      warehouse-native tools; AI-first exploration led by ThoughtSpot; incumbent suites such as
      Power BI, Looker, Tableau, Qlik, and Domo; lower-cost products such as Metabase; or the status
      quo of spreadsheets and internal applications. Independent profiles consistently place
      Sigma beside these categories rather than in a narrow standalone market. Sigma's strongest
      position is with cloud-warehouse customers whose operators already think in spreadsheets
      but need governed access to live data. The positioning map is an evidence-backed ordinal
      synthesis, not a measured benchmark, because the assigned evidence does not provide a
      common performance, adoption, or total-cost dataset across vendors.
    claimRefs:
      - CP001
      - CP002
      - CP009
      - CP011
      - CP012
      - CP015
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: capability-tradeoffs
    title: Capability differentiation and operating tradeoffs
    body: >-
      Sigma's clearest differentiation is the combination of a spreadsheet interaction model,
      live queries against customer-controlled warehouses, and operational features such as input
      tables and writeback. That combination broadens the addressable user beyond SQL specialists
      and distinguishes Sigma from read-only dashboarding. It is not unique in every dimension:
      ThoughtSpot also emphasizes live-warehouse exploration, Looker has a mature governed
      semantic model, Omni targets analytics-engineering workflows, and several vendors support
      embedding. The adverse evidence is directionally consistent on two tradeoffs: complex live
      workbooks can increase latency and warehouse consumption, while Sigma's visualization and
      presentation depth may lag dashboard-first products. No independent workload benchmark in
      the pool quantifies either effect.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP005
      - CP008
      - CP009
      - CP010
      - CP016
    tableRefs:
      - TP002
  - id: commercial-and-distribution
    title: Pricing, distribution, switching, and channel power
    body: >-
      Sigma's public pricing is sales-led, so third-party list-price comparisons are useful only
      as screening signals and not evidence of realized contract economics. Microsoft can make
      Power BI the default inside existing enterprise agreements, Google can pair Looker with
      BigQuery and Gemini, and both routes reduce the need for a separate buying process. Sigma
      counters with warehouse neutrality, spreadsheet familiarity, and strategic ties to
      Databricks, ServiceNow, and Workday, but those relationships are not exclusive distribution
      rights. Switching cost therefore comes mainly from governed workbook logic, user training,
      embedded applications, and operational writeback workflows rather than proprietary data
      storage. Multi-homing remains plausible because several tools can query the same warehouse,
      although no source in the assigned pool measures actual overlap or migration cost.
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP008
      - CP011
      - CP015
    tableRefs:
      - TP003
  - id: moat-and-displacement
    title: Moat durability and displacement risk
    body: >-
      Sigma has enough reported scale and financing to compete aggressively, and independent
      coverage describes its 2026 expansion from warehouse-native BI into agentic analytics.
      However, that repositioning increases overlap with cloud platforms, incumbent BI vendors,
      and focused AI-search products. The durable moat is more likely to be accumulated governed
      workflows, embedded applications, and operator adoption than the phrase "agentic
      analytics," which large software vendors can copy. Competitor-authored criticism that
      Sigma's platform identity is broad and that some AI functions are immature should be treated
      as adverse directional evidence, not an independent benchmark. The underwriting conclusion
      is a differentiated product with real switching friction but no proven structural lock-in;
      customer-level win/loss, migration, and compute-cost data remain required.
    claimRefs:
      - CP004
      - CP005
      - CP013
      - CP014
      - CP015
      - CP016
