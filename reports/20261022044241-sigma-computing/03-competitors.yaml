        - LookML governance, APIs, and embedding
        - Direct quote and realized price are unknown
        - High governance value but meaningful specialist cost
      - - ThoughtSpot
        - "From $25/user/month for Essentials"
        - Per user and query-based tiers
        - Natural-language analytics
        - Scale economics and enterprise price are unknown
        - Direct pressure on Sigma's AI-led positioning
      - - Qlik Sense
        - "From $31/user/month"
        - Per-user and custom enterprise
        - Associative analytics and hybrid deployment
        - Implementation and enterprise discounts are unknown
        - Relevant where deployment flexibility matters
      - - Metabase
        - "Free self-hosted; cloud from $85/month"
        - Open-source or subscription
        - Core dashboards and visual query building
        - Internal hosting and engineering cost are excluded
        - Anchors the low-cost substitute set
