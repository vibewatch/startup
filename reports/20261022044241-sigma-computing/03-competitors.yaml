callouts:
  - calloutType: strength
    title: Differentiation is workflow-level, not warehouse exclusivity
    body: >-
      Sigma combines live warehouse access with a spreadsheet interface and operational
      writeback, creating adoption and workflow switching costs without requiring customers to
      move their underlying data into a proprietary store.
    claimRefs:
      - CP002
      - CP003
      - CP005
  - calloutType: risk
    title: Incumbents can compress the feature gap
    body: >-
      Microsoft, Google, and AI-first BI vendors already pair distribution or live-warehouse
      access with improving AI features. Sigma must prove that governed applications and operator
      workflows create durable retention beyond category-level agentic-analytics messaging.
    claimRefs:
      - CP007
      - CP008
      - CP009
      - CP014
