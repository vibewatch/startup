      - - Domo
        - All-in-one cloud BI
        - Not established in assigned evidence
        - Teams wanting connectors, pipelines, and dashboards in one suite
        - Broad connector library and mobile-oriented analytics
        - Proprietary data layer and opaque credit-based pricing
      - - Metabase or internal build
        - Low-cost substitute or status quo
        - Open-source tier; internal-build scale is organization-specific
        - Startups and developer-led teams with basic BI needs
        - Low licensing cost and rapid setup
        - Governance, visualization, maintenance, and scaling burden
