    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal synthesis of buyer commitment versus exploratory and operational interaction, based
      on the assigned qualitative evidence rather than a vendor benchmark.
    data:
      xAxis:
        label: Economic and organizational commitment
        min: 1
        max: 5
      yAxis:
        label: Exploratory and operational interaction
        min: 1
        max: 5
      points:
        - label: Sigma
          x: 4
          y: 5
          note: Enterprise commitment with spreadsheet exploration, writeback, and AI applications.
        - label: Power BI
          x: 2
          y: 3
          note: Lower public entry pricing and strong Microsoft distribution; mixed interaction modes.
        - label: Looker
          x: 5
          y: 3
          note: Higher specialist commitment centered on governed semantic modeling.
        - label: ThoughtSpot
          x: 4
          y: 5
          note: Enterprise AI-search orientation with high exploratory emphasis.
        - label: Omni
          x: 3
          y: 4
          note: Modern-data-team commitment with flexible governed exploration.
        - label: Metabase
          x: 1
          y: 2
          note: Low-cost self-service substitute with a lower enterprise-governance ceiling.
    approximationNotes: >-
      Scores are ordinal analyst judgments from qualitative source descriptions, not measured
      price, performance, satisfaction, or market-share values; one-point differences are not
      statistically meaningful.
