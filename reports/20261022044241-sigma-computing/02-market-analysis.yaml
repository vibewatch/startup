schemaVersion: "report-v2"
artifact: market-analysis
slug: sigma-computing
runDate: 2026-10-22
company:
  name: Sigma Computing
chapter:
  number: 2
  title: Market Analysis
  summary: Sigma participates in a warehouse-native analytics market moving from dashboard delivery toward governed, AI-assisted workflows. The evidence supports a broad enterprise transition and a credible buyer fit, but public sources do not isolate Sigma's SAM, SOM, pricing realization, or independent customer economics.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      The relevant market is enterprise analytics software that lets business
      users query, model, and act on governed operational data. It includes
      warehouse-native self-service BI, embedded analytics, write-back
      workflows, and AI-assisted analysis when those capabilities are sold as
      an analytics layer. It excludes the underlying cloud warehouse,
      general-purpose data engineering, standalone AI foundation models, and
      bespoke consulting. The status quo is not one product: it is a mix of
      legacy dashboard suites, spreadsheets, analyst-built SQL, and internal
      data applications. Sigma's fit is strongest where the buyer already
      treats Snowflake, Databricks, BigQuery, or another supported SQL
      warehouse as the system of record. That boundary matters because the
      platform's live-query architecture can reduce extract duplication, but
      it does not by itself create a new data budget or eliminate warehouse
      compute costs.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and growth signal
    body: >-
      Public evidence supports multiple directional sizing lenses rather than
      a defensible Sigma-specific TAM/SAM/SOM. A company-focused editorial
      source reports $200 million of ARR, more than 2,000 businesses, and
      1.1 million new active users, while The Next Web reports the same ARR
      milestone alongside an $80 million Series E at a $3 billion valuation.
      These are traction and investor-valuation signals, not market-size
      measurements. A competitor review supplies a narrower workflow lens:
      warehouse-native self-service for Excel-fluent analysts, with structural
      exclusions for NoSQL, API-first, and highly customized customer-facing
      embedded use cases. The market therefore has at least three separable
      pools: internal warehouse BI, embedded/product analytics, and AI-native
      data workflows. Available sources do not disclose the spend base,
      addressable geography, penetration, or conversion assumptions needed to
      convert those pools into comparable TAM, SAM, and SOM.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyers, adoption path, and constraints
    body: >-
      The likely economic buyer is a data, analytics, finance, or operations
      leader who already funds a cloud warehouse and wants more business-user
      throughput without moving data into a separate analytics store. Users
      are Excel-fluent analysts and operational teams; the payer is usually
      the enterprise data or business function budget owner, with warehouse
      compute remaining an adjacent cost. Adoption is triggered by demand for
      faster ad hoc analysis, governed AI workflows, write-back planning, or
      broader access to live data. Constraints are equally material: supported
      warehouse dependence, optional metric governance without a mature
      semantic layer, iframe-only embedding according to the competitor
      review, and uncertain compute economics. The market's growth thesis is
      therefore conditional on migration from incumbent BI and spreadsheets
      while preserving trust, governance, and measurable ROI.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
  - id: diligence-gaps
    title: What remains unproven
    body: >-
      The evidence base is strong enough to define a market thesis but not to
      underwrite market share or valuation from market size alone. No retained
      source provides a comparable global or regional BI spend denominator,
      Sigma's win rate against Power BI, Tableau, Looker, or internal builds,
      segment-level pricing, renewal or expansion rates, or customer payback.
      The available growth figures are partly company-originated or
      company-focused summaries, and the independent security page reviewed
      here describes its monitoring methodology without publishing a Sigma
      market or adoption benchmark. The diligence priority is to obtain
      bottom-up bookings by segment and geography, customer cohort retention,
      competitive displacement data, warehouse-compute allocation, and a
      reconciled definition of ARR, customers, and active users.
    claimRefs: [CM015, CM016]
callouts:
  - calloutType: insight
    title: The market is a transition thesis, not a single-number TAM
    body: Sigma has credible traction in a shift from static BI toward live, AI-assisted warehouse workflows, but the retained evidence does not support treating $200 million of ARR or a $3 billion valuation as market size.
    claimRefs: [CM005, CM006, CM008]
  - calloutType: risk
    title: Warehouse fit is both the wedge and the ceiling
    body: The same warehouse-native architecture that makes Sigma relevant to modern data teams narrows the addressable buyer set and leaves compute, governance, and embedding constraints for diligence.
    claimRefs: [CM002, CM011, CM012, CM013]
