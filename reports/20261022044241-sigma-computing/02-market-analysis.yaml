    notes: Buyer roles are evidence-constrained archetypes derived from product and market descriptions; source material does not provide a representative buyer survey.
    claimRefs: [CM010, CM011, CM012]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: The evidence supports a layered market thesis from incumbent displacement to narrower warehouse-native and AI-workflow pools, but not numeric TAM/SAM/SOM values.
    data:
      items:
        - label: Enterprise analytics and BI spend
          value: "unquantified"
          valueNote: No comparable denominator retained
          detail: Broad category including legacy BI, spreadsheets, and internal analytics
        - label: Cloud warehouse-native analytics
          value: "unquantified"
          valueNote: Sigma's primary architectural fit
          detail: Live analysis on supported cloud SQL warehouses
        - label: Internal self-service BI
          value: "unquantified"
          valueNote: Buyer and user segmentation is qualitative
          detail: Business analysts and functional teams using governed live data
        - label: AI-native data workflows
          value: "unquantified"
          valueNote: Category boundary remains emerging
          detail: Agents, AI apps, and workflow actions on warehouse data
        - label: Sigma-specific serviceable pool
          value: "unquantified"
          valueNote: Win rate, geography, and pricing are not disclosed
          detail: Addressable accounts matching warehouse, governance, and workflow requirements
        - label: Sigma obtainable share
          value: "unquantified"
          valueNote: No market share or conversion evidence retained
          detail: Requires bottom-up bookings, retention, and competitive displacement data
    approximationNotes: >-
      Layers are ordered market lenses, not proportional values. Values remain
      explicitly unquantified because the retained sources do not provide
      comparable denominators or transformation assumptions.
    claimRefs: [CM004, CM008, CM015, CM016]
