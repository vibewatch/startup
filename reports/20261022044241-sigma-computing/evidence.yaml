evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: profitability
    missingEvidence: Audited or management financials covering revenue recognition, gross margin, burn, runway, and payback.
    whyItMatters: ARR and funding do not establish cash generation or capital efficiency at the reported valuation.
    diligencePath: Request the latest management accounts, cohort economics, cash balance, burn plan, and debt schedule under NDA.
    relatedQuestionRefs:
      - QO005
      - QO007
      - QO008
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: Current cap table, liquidation preferences, board composition, protective provisions, and secondary transactions.
    whyItMatters: Headline valuation may not translate into common-equity value or investor alignment.
    diligencePath: >-
      Obtain the latest capitalization table, financing term sheets, charter, investor rights agreement, and board
      materials.
    relatedQuestionRefs:
      - QO002
      - QO004
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: A reconciled lifetime-funding schedule with treatment of debt and convertible instruments.
    whyItMatters: >-
      The assigned profile presents $661M-plus in its round table but $961.3M in its headline, so total raised is not
      stable.
    diligencePath: Reconcile each financing instrument to primary transaction announcements and company records.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: Independent customer references, retention cohorts, concentration, and active-customer definition.
    whyItMatters: More than 2,000 businesses is a scale indicator but does not show durability or revenue concentration.
    diligencePath: >-
      Request anonymized cohort retention, top-customer concentration, logo churn, expansion, and referenceable customer
      interviews.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: Complete leadership roster, board membership, and material leadership-change history.
    whyItMatters: The assigned sources name key executives but do not establish succession depth or governance quality.
    diligencePath: Review the current leadership page, board biographies, and recent corporate filings or investor materials.
    relatedQuestionRefs:
      - QO002
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: A complete leadership and governance roster covering the board, executives, and material leadership changes.
    whyItMatters: The leadership table is intentionally partial and cannot establish succession depth or board oversight.
    diligencePath: Request the current board roster, executive biographies, governance documents, and leadership-change history.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: A comparable global or regional enterprise analytics spend denominator with methodology, period, and geography.
    whyItMatters: >-
      Without a common denominator, ARR and valuation cannot be translated into penetration or a defensible serviceable
      market.
    diligencePath: >-
      Obtain paid analyst market data or a bottom-up account and spend model reconciled to Sigma's target segments and
      geographies.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-economics
    missingEvidence: Segment-level pricing, win rates, renewal and expansion cohorts, payback, and warehouse-compute allocation.
    whyItMatters: These measures determine whether the apparent market transition converts into repeatable, profitable demand.
    diligencePath: >-
      Request a customer cohort pack, bookings bridge, competitive-loss review, and compute-cost allocation from
      management.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: competitor-scale
    missingEvidence: >-
      Current independently verified revenue, customer, funding, and product-direction data for each material peer on a
      common date and definition.
    whyItMatters: The available pool supports Sigma's scale but not a comparable ranking of competitor resources or momentum.
    diligencePath: >-
      Collect current filings, direct company disclosures, and reputable financing coverage for each named peer,
      preserving metric definitions and reporting periods.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized quotes, discount schedules, implementation fees, embedded terms, and warehouse compute usage for matched
      Sigma and competitor workloads.
    whyItMatters: Public list signals cannot establish customer total cost or price-performance.
    diligencePath: >-
      Request normalized three-year quotes and run matched proof-of-concept workloads with compute telemetry across
      shortlisted vendors.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: switching-and-retention
    missingEvidence: >-
      Independent win-loss data, migration duration, workbook conversion effort, customer multi-homing rates, and
      retention by workload.
    whyItMatters: Feature differentiation does not establish durable switching costs or net retention.
    diligencePath: >-
      Interview recent wins, losses, and churned customers and inspect migration plans, usage cohorts, and renewal
      records.
    relatedQuestionRefs:
      - QP005
      - QP007
  - type: access-blocked
    severity: material
    topic: trust-and-security
    missingEvidence: >-
      Current detailed security attestations and a comparable independent vendor-risk score across Sigma and shortlisted
      competitors.
    whyItMatters: A monitoring page without findings cannot support a trust or regulatory advantage claim.
    diligencePath: >-
      Obtain current SOC reports, penetration summaries, subprocessor records, incident history, and full independent
      vendor-risk reports under diligence access.
    relatedQuestionRefs:
      - QP003
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited revenue reconciliation, gross margin, CAC payback, retention, and cohort economics by product and customer
      segment.
    whyItMatters: >-
      Without these measures, reported ARR growth cannot be converted into a defensible profitability or cash-efficiency
      view.
    diligencePath: >-
      Request a management data room with monthly P&L, bookings, cohort ARR bridge, NRR/GRR, churn, and fully loaded
      sales and service costs.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI009
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Latest balance sheet, cash reconciliation, monthly burn, debt schedule, covenants, and financing plan.
    whyItMatters: >-
      Funding raised is not cash available, and the next-round dependency cannot be assessed from the Series E headline
      alone.
    diligencePath: Request a current balance sheet, 24-month cash forecast, debt documents, and board-approved financing assumptions.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: security
    missingEvidence: >-
      Independent SOC 2 or ISO scope, penetration-test summary, control-level security results, and customer-specific
      audit evidence.
    whyItMatters: >-
      Warehouse-native design does not by itself verify Sigma's application controls, agent boundaries, or external
      integration security.
    diligencePath: >-
      Request current security certifications, scope statements, recent independent assessment summaries, and a control
      mapping for Agents, Connectors, and API Actions.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: Twelve- to twenty-four-month uptime, incident, latency, and SLA-credit history segmented by warehouse and region.
    whyItMatters: >-
      Customer experience depends on both Sigma and upstream warehouse/cloud infrastructure, so a target availability
      number is not an outcome history.
    diligencePath: >-
      Obtain service-status exports, SLA attainment, incident postmortems, p95/p99 query latency, and warehouse-specific
      availability data.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: private-evidence-only
    severity: material
    topic: implementation
    missingEvidence: Independent deployment timelines, implementation effort, support burden, and module-level adoption or retention.
    whyItMatters: >-
      Job postings and company examples indicate an enterprise operating motion but do not establish repeatable
      time-to-value or services intensity.
    diligencePath: >-
      Request anonymized deployment cohorts, implementation hours, support tickets, time-to-production, and expansion by
      product module.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE002
      - TE004
  - type: missing-source
    severity: material
    topic: agents
    missingEvidence: >-
      Agent accuracy, evaluation methodology, prompt-injection testing, approval controls, audit logs, and failed-action
      recovery.
    whyItMatters: >-
      Action-taking agents increase the consequence of incorrect answers, unauthorized changes, and opaque external API
      execution.
    diligencePath: >-
      Review evaluation sets, red-team results, permission matrices, model/version controls, action approvals, and
      production incident records.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
      - TE004
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      NRR, GRR, logo and revenue churn, renewal rate, contract length, cohort retention, satisfaction, expansion attach,
      and paid-user retention by customer segment.
    whyItMatters: >-
      Customer and user growth cannot establish durable recurring revenue or efficient land-and-expand behavior without
      retention and cohort denominators.
    diligencePath: >-
      Obtain management's monthly and annual cohort schedules, reconcile them to billing, and validate renewal and
      expansion behavior through former and current customer calls.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Top-1, top-5, and top-10 revenue shares; vertical, geography, channel, warehouse, embedded, and direct-sales mix;
      and concentration changes over time.
    whyItMatters: >-
      Broad logo evidence can coexist with material revenue dependence on a small group of customers, partners, or
      cloud-data platforms.
    diligencePath: >-
      Request anonymized customer-level ARR and gross-retention data, segment the file by vertical, geography, channel,
      product, and warehouse, and reconcile totals to finance.
    relatedQuestionRefs:
      - QU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customers
    missingEvidence: >-
      A dated, complete customer-reference list identifying pilot versus production, deployment scope, active users,
      renewal status, and verified outcome methodology.
    whyItMatters: >-
      The named proof table is a selected public sample and cannot establish the quality or representativeness of the
      full customer base.
    diligencePath: >-
      Ask management for a referenceable customer census and independently interview a stratified sample of new,
      renewed, expanded, contracted, and churned accounts.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: Verified uptime SLA, status history, incident log, and security assessment with dates and scope.
    whyItMatters: >-
      The product is a live enterprise dependency, but the retained public evidence does not quantify availability or
      incident exposure.
    diligencePath: >-
      Request the current trust-center package, SLA, status-page export, penetration-test summary, and customer incident
      history under NDA.
    relatedQuestionRefs:
      - QR006
      - QR008
  - type: private-evidence-only
    severity: material
    topic: financial-opacity
    missingEvidence: >-
      Audited financial statements, gross margin, burn, runway, cash balance, customer concentration, and
      warehouse-compute economics.
    whyItMatters: ARR and funding do not establish cash available, profitability, or resilience through a slower sales cycle.
    diligencePath: >-
      Obtain a management financial package, cohort retention file, top-customer concentration schedule, and
      warehouse-cost bridge.
    relatedQuestionRefs:
      - QR007
      - QR008
  - type: missing-source
    severity: material
    topic: legal
    missingEvidence: Current litigation, regulatory inquiry, privacy impact assessment, and cross-border data-transfer documentation.
    whyItMatters: >-
      The employment and privacy disclosures identify obligations but do not establish the company's complete legal
      posture.
    diligencePath: Request a legal schedule, DPA/subprocessor list, transfer-impact assessments, and open-claims representation.
    relatedQuestionRefs:
      - QR003
      - QR004
    relatedTableRefs:
      - TR002
  - type: stale
    severity: minor
    topic: concentration
    missingEvidence: Current customer, partner, warehouse, and platform concentration by revenue and usage.
    whyItMatters: >-
      Strategic investors and warehouse integrations may create commercial leverage and shared-fate dependencies that
      public profiles cannot quantify.
    diligencePath: Request revenue and usage concentration tables, renewal cohorts, partner-sourced pipeline, and portability plans.
    relatedQuestionRefs:
      - QR001
      - QR008
  - type: missing-source
    severity: blocking
    topic: private-financials
    missingEvidence: >-
      Audited or management-confirmed ARR and revenue bridge with period definitions, gross margin, burn, runway, net
      retention, and logo churn.
    whyItMatters: >-
      The reported $3 billion valuation is highly sensitive to whether $200 million is ARR, revenue, or a different
      run-rate measure and to the quality of that growth.
    diligencePath: >-
      Request the latest management financial package, cohort tables, ARR reconciliation, and board-approved operating
      plan under NDA.
    relatedQuestionRefs:
      - QV002
      - QV004
      - QV005
      - QV007
  - type: missing-source
    severity: material
    topic: cap-table
    missingEvidence: >-
      Executed Series E financing documents, fully diluted cap table, liquidation preferences, option-pool treatment,
      debt, convertibles, and secondary activity.
    whyItMatters: >-
      Headline post-money valuation does not determine common-equity value or investor return without security terms and
      dilution.
    diligencePath: >-
      Obtain the signed preferred-stock purchase agreement, capitalization schedule, debt schedule, and current 409A or
      equivalent valuation materials.
    relatedQuestionRefs:
      - QV003
      - QV008
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: Independent customer cohort, concentration, churn, expansion, and AI-agent conversion evidence.
    whyItMatters: Enterprise scale claims do not show whether growth is diversified, durable, or monetized at acceptable payback.
    diligencePath: >-
      Review anonymized cohort retention, top-customer concentration, pipeline conversion, reference calls, and product
      usage-to-contract bridges.
    relatedQuestionRefs:
      - QV005
      - QV006
      - QV009
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: A reconciled financing ledger explaining why public sources report different cumulative funding totals.
    whyItMatters: >-
      Different totals can reflect debt, convertibles, round extensions, or source errors and should not be treated as
      interchangeable capital raised.
    diligencePath: Reconcile each round against primary financing announcements and the company cap table.
    relatedQuestionRefs:
      - QV003
      - QV004
