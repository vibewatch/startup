company:
  name: Sigma Computing
chapter:
  number: 5
  title: Product & Technology
  summary: Sigma delivers warehouse-native analytics through a spreadsheet-style interface, governed live queries, embedded applications, and a recent agentic layer. The architecture is coherent and differentiated by keeping computation and permissions in the customer's warehouse, but public evidence is thinner on independent reliability, implementation effort, and the operational maturity of the newer AI surface.
sections:
  - id: product-workflow
    title: Customer workflow and product surface
    body: >-
      Sigma's core workflow is a business user exploring live warehouse data without waiting for a data team to publish a static dashboard. The product combines a spreadsheet-style workbook with SQL, Python, natural-language assistance, collaborative sharing, write-back input tables, embedded analytics, and parameter-driven data applications. The official announcement describes the product moving beyond passive business intelligence toward AI-powered workflows, with Sigma Agents, Sigma Assistant, Client Connectors, and API Actions. This broadens the addressable workflow from analysis to action, but it also creates a product-scope diligence question: the public record describes capabilities and customer examples more clearly than it quantifies adoption, latency, error rates, or the amount of implementation work required for each module.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: architecture-dependencies
    title: Warehouse-native architecture and dependencies
    body: >-
      The product's central architectural choice is to query the customer's cloud warehouse rather than copy data into a separate analytics store. Independent coverage says Sigma runs spreadsheet operations, SQL, Python, and AI Apps against the warehouse compute layer; the company says agents run where the data lives and inherit the permissions already controlled there. This can reduce extract duplication and align the user experience with existing governance, but it makes product performance and availability dependent on warehouse configuration, cloud-provider regions, query workload, semantic modeling, and customer data quality. The reviewed sources identify Snowflake, Databricks, BigQuery, Redshift, and PostgreSQL connectivity, yet they do not independently establish comparative performance or the completeness of each connector's feature support.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
  - id: maturity-roadmap
    title: Maturity, deployment, and roadmap signals
    body: >-
      Public maturity signals are mixed. Sigma's April 2026 announcement reports $200 million of ARR, more than 2,000 businesses, 1.1 million new active users in the latest fiscal year, and customer workflows that include real-time analytics and embedded AI applications. A current enterprise customer-success posting emphasizes adoption programs, training, success plans, integrations, production BI implementation, and net-dollar-retention work, which is consistent with a product that requires active deployment and expansion support rather than a purely self-serve workflow. A separate solution-engineering listing calls out discovery, demos, technical and security RFP responses, data migration, and partner-channel execution. These are useful operating signals, not independent proof of implementation success, retention, uptime, or roadmap delivery.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: trust-risk-gaps
    title: Trust, reliability, and technical diligence
    body: >-
      Sigma's stated trust proposition is inherited warehouse governance: live queries, row- and column-level controls, and agents operating inside existing permissions. The official release also describes API Actions and external-system connectors, which expand the control plane beyond read-only analytics and raise the importance of action authorization, auditability, secrets handling, and failure recovery. The reviewed UpGuard page reports continuous monitoring across 330-plus external checks but does not expose a company-specific score or control-level results in the fetched text. A review aggregation reports a 99.9% monthly target availability and notes dependence on upstream warehouses and cloud regions, while also saying historical multi-month uptime is not fully summarized. Investors should therefore treat security posture, incident history, service-level attainment, agent evaluation, connector coverage, and customer-side operating burden as open diligence items rather than infer them from architecture language.
    claimRefs: [CE013, CE014, CE015, CE016]
    tableRefs: [TE004]
