callouts:
  - calloutType: strength
    title: Coherent warehouse-native wedge
    body: >-
      Sigma's strongest product claim is internally consistent across independent coverage and company materials: business-friendly interaction sits directly on live warehouse compute while existing warehouse governance remains central.
    claimRefs: [CE005, CE006, CE007]
  - calloutType: risk
    title: New action surface raises the diligence bar
    body: >-
      Agents, connectors, and API Actions turn analytics into execution. Permission boundaries, evaluation quality, secrets, retries, auditability, and incident response should be underwritten as product controls, not assumed from warehouse-native positioning.
    claimRefs: [CE004, CE013, CE016]
