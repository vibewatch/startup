artifact: valuation
slug: sigma-computing
runDate: 2026-10-22
company:
  name: Sigma Computing
chapter:
  number: 8
  title: Valuation
  summary: >-
    Sigma's May 2026 financing provides the clearest public price anchor at a
    reported $3 billion post-money valuation and $80 million Series E, while
    public revenue and ARR figures remain inconsistent across sources. The
    evidence supports a research-more stance: operating momentum is credible
    enough to merit continued diligence, but private-company terms, margins,
    retention, and cash efficiency are not public enough for a high-conviction
    underwriting call.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive case is that Sigma has reached meaningful scale in a structurally
      attractive warehouse-native analytics market. The strongest current financing
      evidence is a May 2026 Series E of $80 million at a reported $3 billion
      valuation, while the same coverage reports $200 million of ARR and more than
      2,000 customers. The product thesis is also coherent: a spreadsheet-like
      interface operates on live warehouse data, and Sigma is extending that
      architecture into agentic analytics. Strategic participation from Databricks,
      ServiceNow, and Workday is a useful ecosystem signal, but it is not proof of
      customer economics or exit value. The anti-thesis is valuation sensitivity:
      the reported price implies roughly 15x ARR on one private-market data source,
      and the public record does not disclose gross margin, net retention, burn,
      runway, customer concentration, or preference terms. A $3 billion mark can
      therefore be reasonable only if growth remains unusually strong and the
      agentic product expands durable monetization rather than merely changing the
      category label.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: price-and-scenarios
    title: Price discipline and scenarios
    body: >-
      The entry question should be framed as a range of outcomes rather than as a
      single fair-value point. Multiples.vc records a $3 billion May 2026 valuation
      against $200 million of recorded revenue or ARR and calculates a 15.0x
      revenue multiple; The Next Web independently describes the same round and
      says the valuation doubled from $1.5 billion while revenue doubled over the
      same period. Those observations support a strong momentum case, but they do not
      establish audited revenue or recurring-revenue composition. Multiples.vc lists
      LTM EV-to-revenue references of 1.7x for Teradata, 4.9x for Amplitude, and 7.6x
      for Planisware, all below Sigma's recorded 15.0x figure, but those companies are
      imperfect business-model and growth matches rather than a dispositive benchmark.
      Latka instead reports $100 million of annual revenue in April 2025 and $581.3
      million raised across seven rounds, illustrating the data-quality problem rather
      than resolving it. A base case should require refreshed management financials,
      cohort retention, margin and burn data, and cap-table terms before accepting the
      reported price. The bear case is a multiple reset if growth slows, AI-agent
      adoption proves shallow, or enterprise budgets consolidate around incumbent
      platforms. The bull case requires sustained growth, expansion revenue, and
      evidence that agents increase paid workload rather than only usage.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV015]
    tableRefs: [TV003]
  - id: diligence-and-exit
    title: Exit readiness and diligence asks
    body: >-
      Sigma has credible ingredients for an eventual strategic or public-market
      outcome: private-market sources describe a broad enterprise customer base,
      strategic investors, and a product positioned across analytics, data apps, and
      AI workflows. However, exit readiness cannot be inferred from a financing
      headline. The latest round was privately reported rather than disclosed in a
      public filing, and the source set contains materially different totals for
      funding, revenue, ARR, and headcount. Silicon Valley Investclub estimates about
      13% dilution in the Series D and about 3% in the Series E from disclosed round
      sizes and post-money values, while noting that the shareholder register is not
      public; these calculations do not reveal preference rights or fully diluted
      ownership. UpGuard's current vendor-risk page also demonstrates that external
      monitoring exists, but its public page does not provide a complete score or
      incident history; absence of a disclosed incident is not evidence of absence.
      Before investment, diligence should obtain the executed financing documents,
      updated cap table, liquidation preferences, option-pool treatment, debt and
      convertibles, ARR bridge, gross margin, net retention, logo churn, customer
      concentration, and AI-agent usage-to-revenue conversion. Thesis-break triggers
      should include a material down-round, weakening net retention, sustained margin
      deterioration, a security or reliability event that causes enterprise churn,
      or failure to convert agent adoption into contracted recurring revenue.
    claimRefs: [CV011, CV012, CV013, CV014]
    tableRefs: []
    figureRefs: []
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Current assessment, Decision implication]
    rows:
      - [Recommendation, research-more, Do not underwrite the reported price without private financial and cap-table diligence.]
      - [Confidence, medium, "Financing and growth signals are usable, but private-company disclosure is incomplete."]
      - [Risk rating, high, "Multiple compression, concentration, terms, and execution risks remain material."]
      - [Valuation stance, fair, The reported 15.0x ARR/revenue anchor is plausible only under sustained high growth.]
    notes: "Assessment synthesizes current public evidence; fair is a conditional stance, not a disclosed company or market valuation."
    claimRefs: [CV001, CV003, CV006, CV011]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - [Warehouse-native architecture can support durable enterprise differentiation, "Live warehouse analytics and governed agentic workflows are described by The Next Web and private-market profiles.", "Evidence of weak performance, security, or implementation friction in customer cohorts."]
      - [Scale and strategic investors support continued growth, "$80M Series E at reported $3B valuation; Databricks, ServiceNow, and Workday Ventures participated.", "Down-round, reduced strategic support, or slowing ARR/customer expansion."]
      - [Price may already capitalize on the growth story, "Multiples.vc reports 15.0x on $200M revenue/ARR; TNW characterizes the valuation as aggressive but potentially defensible.", "Audited retention and margin data could justify the multiple; weak cohorts would not."]
      - [Public metrics are not yet underwriting-grade, "Latka reports $100M revenue while other sources report $200M ARR/revenue and different funding totals.", "Management data room reconciliation with definitions, periods, and source documents."]
      - [Public-company references imply a valuation premium, "Multiples.vc lists Teradata at 1.7x, Amplitude at 4.9x, and Planisware at 7.6x LTM EV/revenue versus Sigma's recorded 15.0x.", "Growth- and margin-normalized comparables or a lower entry price would make the comparison more decision-useful."]
      - [Competitor criticism identifies diligence tests, "Astrato alleges product-identity, performance, AI-maturity, embedded-product, and cost weaknesses.", "Neutral win-loss data and production customer evidence should confirm or rebut these biased claims."]
    notes: "Evidence is drawn from mixed independent, company-issued, competitor, and market-data sources; comparable metrics are not normalized for growth, margin, accounting basis, or period."
    claimRefs: [CV002, CV004, CV006, CV007, CV008, CV009, CV015, CV016]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Key downside trigger]
    rows:
      - [Bull, "ARR remains near or above the reported $200M level, growth stays high, agents expand paid workloads, and retention/margins prove strong.", "A 15x or higher revenue/ARR anchor is sustained or expands; upside requires verified growth and quality.", "Lower probability until audited or management-confirmed metrics are provided.", "Agent adoption does not convert to recurring revenue or strategic buyers reduce support."]
      - [Base, "Reported $3B valuation is broadly credible, growth moderates, and Sigma remains a differentiated private platform.", "Entry is approximately fair at the reported mark; return depends on future growth and exit timing.", "Most defensible pending financial and cap-table diligence.", "Retention, margin, or customer concentration is materially worse than assumed."]
      - [Bear, "Growth decelerates, AI analytics becomes a crowded feature, or enterprise budgets favor incumbents.", "Revenue multiple compresses materially below the reported 15.0x reference, producing downside even if revenue grows.", "Material risk because private metrics and terms are not public.", "Down-round, liquidity constraint, security event, or preference overhang impairs common equity value."]
      - [Decision gate, "Obtain ARR bridge, cohort retention, margin, burn, cap table, preferences, debt, and customer concentration.", "Proceed only if quality metrics support the price or the entry price resets.", "Required before a buy decision.", "Any unresolved blocker remains a research-more outcome."]
    notes: "Scenario ranges are qualitative because public sources do not provide sufficient audited inputs for a defensible numeric valuation range; the reported 15.0x reference is not treated as a forecast."
    claimRefs: [CV003, CV006, CV007, CV010, CV011, CV014]
