    claimRefs: [CV001, CV003, CV006, CV010, CV011]
callouts:
  - calloutType: recommendation
    title: Conditional research-more
    body: The public record supports continued diligence rather than a buy call. The reported $3 billion price can be accepted only after reconciling revenue definitions and obtaining retention, margin, cash-efficiency, customer-concentration, and cap-table evidence.
    claimRefs: [CV003, CV006, CV007, CV011]
  - calloutType: risk
    title: Private-market data conflict
    body: Funding, revenue, ARR, and headcount totals vary materially by source. Treat the figures as reported indicators, not interchangeable audited metrics, until management documentation reconciles periods and definitions.
    claimRefs: [CV007, CV008, CV009, CV012]
  - calloutType: assumption
    title: Downside trigger
    body: A down-round, weakening net retention, material margin deterioration, or a security/reliability event that causes enterprise churn would invalidate the current constructive valuation stance.
    claimRefs: [CV010, CV014]
