schemaVersion: "report-v2"
artifact: financials
slug: sigma-computing
runDate: 2026-10-22
company:
  name: Sigma Computing
chapter:
  number: 4
  title: Financials
  summary: Sigma presents a strong but still largely company-reported growth profile, with 2026 coverage citing $200M ARR, 2,000+ customers, and a $3B post-money valuation after an $80M Series E. The public record does not establish gross margin, burn, runway, retention, realized pricing, or customer concentration, so underwriting remains conditional on private financial diligence.
sections:
  - id: revenue-and-monetization
    title: Revenue model and monetization
    body: >-
      Sigma's monetization appears to be enterprise SaaS built around a cloud-warehouse
      analytics and AI applications platform. The product is sold to business and technical
      teams that query live warehouse data through spreadsheet, SQL, Python, and AI
      workflows; a 2026 job posting describes technical presales, RFP/RFI responses,
      prototypes, and concurrent enterprise engagements, which is consistent with a
      consultative sales motion rather than self-serve software. The same posting says
      Sigma has more than 2,000 customers and reached $200M ARR in April 2026, but the
      issuer is Sigma and the figures are not independently audited in the source.
      Third-party procurement commentary describes role-based tiers and custom enterprise
      quotes, while noting that published contract terms and typical deal sizes are not
      available. Consequently, list-price or role-price indications should not be treated
      as realized revenue, discount-adjusted ASP, or gross margin evidence.
    claimRefs: [CI001, CI002, CI003, CI004, CI016]
    tableRefs: [TI001, TI002]
  - id: unit-economics-and-costs
    title: Unit economics and cost structure
    body: >-
      The public file is insufficient to calculate CAC payback, gross margin, contribution
      margin, or sales efficiency. Sigma's live-query architecture can reduce data
      duplication, but it also leaves customer workloads dependent on warehouse compute;
      an independent competitor article flags performance under load and potentially
      unpredictable costs from heavy or frequent queries. Those observations are risk
      signals, not quantified Sigma cost data. The enterprise presales requirements,
      including solution prototypes, security responses, and 25% travel, indicate a
      non-trivial implementation and sales-support burden, but no public source supplies
      fully loaded selling expense, deployment cost, support cost, or payback period.
      A buyer should therefore model economics with actual cohort bookings, services
      effort, warehouse-cost pass-through, and renewal data rather than extrapolating
      from ARR growth alone.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Sigma's May 2026 Series E provides an observed financing event and a reported
      valuation anchor, but it does not disclose cash on hand, burn, runway, debt
      covenants, or use of proceeds. The Next Web reports an $80M round at a $3B
      valuation and describes the financing as a test of the company's agentic-analytics
      repositioning; its discussion of 15x ARR is an editorial calculation based on the
      reported $200M ARR, not an audited accounting multiple. The round size can
      plausibly extend operating flexibility, but cash available cannot be inferred
      from funding raised because expenses, debt, working capital, and transaction terms
      are unknown. The financial verdict is therefore constructive on reported growth
      and financing access, but research-more on earnings quality, capital efficiency,
      and downside protection.
    claimRefs: [CI009, CI010, CI011, CI012]
    figureRefs: [FI001]
  - id: diligence-blockers
    title: Underwriting gaps
    body: >-
      The most decision-relevant missing inputs are recurring-revenue definitions and
      cohort behavior, realized price and discount data, gross margin by product and
      customer segment, cash and burn forecasts, implementation and warehouse-cost
      allocation, debt or project-finance obligations, and concentration by customer,
      partner, and warehouse. Public profiles explicitly state that profitability figures
      were not found and that reported metrics vary by source and methodology. These are
      material gaps rather than evidence of weak performance: the available data can
      support a reported-growth narrative, but not a reliable cash-flow or valuation
      underwriting case.
    claimRefs: [CI013, CI014, CI015]

tables:
  - id: TI001
    title: Public revenue and traction signals
    columns: [Metric, Value, Period or basis, Evidence quality, Diligence implication]
    rows:
      - [ARR, "$200M", "April 2026", "Company statement reproduced in job posting and reported by The Next Web", "Reconcile ARR definition to GAAP revenue and billings"]
      - [Year-over-year ARR growth, ">100%", "Latest fiscal year / April 2026 report", "Company-reported", "Obtain cohort, retention, and expansion schedules"]
      - [Customers, "More than 2,000", "2026", "Company statement in job posting and third-party reporting", "Obtain active-account definition and concentration"]
      - [New active users, "1.1 million", "Latest fiscal year", "Company-reported in The Next Web", "Define active user and connect usage to paid revenue"]
      - [Accounting revenue, null, "Not publicly established", "No audited figure in assigned sources", "Request income statement and revenue-recognition policy"]
    notes: >-
      Values are public signals rather than an audited financial statement; ARR, customer,
      and active-user definitions and periods should be reconciled directly with Sigma.
    claimRefs: [CI001, CI002, CI009, CI013]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Monetization element, Public indication, Status, What it does not establish]
    rows:
      - [Viewer role, "Read-only dashboard access", "Third-party description", "Realized price or gross margin"]
      - [Explorer role, "Create analyses and explore data", "Third-party description", "Seat utilization or expansion rate"]
      - [Developer role, "Creation, administration, and governance capabilities", "Third-party description", "Contracted ARR per role"]
      - [Base annual fee, "Around $30,000", "Third-party procurement estimate", "Sigma list price, discounting, or standard contract"]
      - [Explorer / Developer pricing, "Approximately $1,000 per user annually", "Third-party procurement estimate", "Actual deal price, minimums, or services"]
    notes: >-
      Astrato's competitor comparison describes Sigma as using tiered licensing and
      enterprise sales; the cited procurement figures are third-party estimates and are
      not treated as official Sigma pricing.
    claimRefs: [CI003, CI004, CI006, CI016]
  - id: TI003
    title: Unit economics and capital-adequacy status
    columns: [Underwriting input, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Gross margin, null, "Unavailable", "Tests scalability and pricing power", "Obtain gross margin by product and warehouse-cost treatment"]
      - [CAC and payback, null, "Unavailable", "Tests growth efficiency", "Obtain sales-and-marketing spend, bookings, and cohort payback"]
      - [NRR / GRR / logo churn, null, "Unavailable", "Tests durability of ARR", "Obtain cohort retention and expansion schedules"]
      - [Cash on hand, null, "Unavailable", "Determines financing runway", "Obtain latest balance sheet and cash reconciliation"]
      - [Burn and runway, null, "Unavailable", "Determines next-round dependency", "Obtain monthly cash forecast, burn bridge, and financing trigger"]
      - [Debt obligations, null, "Unavailable", "Can constrain capital flexibility", "Obtain debt, covenants, and repayment schedule"]
    notes: >-
      Null means the assigned public sources do not disclose a defensible value; it does
      not mean zero. Each missing metric has a specific diligence request.
    claimRefs: [CI007, CI008, CI011, CI012, CI014]

figures:
  - id: FI001
    title: Reported revenue-to-capital logic
    type: flow
    summary: Sigma's reported warehouse-native platform monetizes enterprise usage, but public evidence stops before a measured gross-profit or cash-flow bridge.
    data:
      nodes:
        - id: enterprise-demand
          label: Enterprise analytics demand
          value: "2,000+ customers"
          unit: customers
        - id: platform-usage
          label: Warehouse-native platform usage
          value: "Live warehouse analytics, AI apps, and agents"
          unit: product scope
        - id: recurring-revenue
          label: Reported recurring revenue
          value: "$200M"
          unit: ARR
        - id: financing
          label: Series E financing
          value: "$80M"
          unit: new capital
        - id: valuation
          label: Reported post-money valuation
          value: "$3B"
          unit: valuation
        - id: unverified-economics
          label: Unobserved underwriting layer
          value: "Gross margin, burn, runway, retention"
          unit: missing inputs
      edges:
        - from: enterprise-demand
          to: platform-usage
        - from: platform-usage
          to: recurring-revenue
        - from: recurring-revenue
          to: financing
        - from: financing
          to: valuation
        - from: recurring-revenue
          to: unverified-economics
    approximationNotes: >-
      This is an evidence-backed relationship map, not a calculated income-statement
      bridge; the arrows do not imply conversion rates or causality.
    claimRefs: [CI001, CI009, CI010, CI015]

callouts:
  - calloutType: strength
    title: Growth and financing access are visible
    body: >-
      Assigned sources consistently report $200M ARR, more than 2,000 customers, and an
      $80M Series E at a $3B valuation in 2026, supporting a credible scale-stage growth
      signal even though the figures are not audited here.
    claimRefs: [CI001, CI002, CI009, CI010]
  - calloutType: risk
    title: Capital efficiency cannot yet be underwritten
    body: >-
      No assigned source supplies gross margin, cash, burn, runway, retention, realized
      pricing, or debt terms, so the valuation cannot be tested against cash generation
      or durable cohort economics.
    claimRefs: [CI007, CI008, CI011, CI012, CI014]
  - calloutType: recommendation
    title: Request cohort and cash evidence before underwriting
    body: >-
      Treat reported growth as a positive signal, but require a management data room with
      revenue reconciliation, cohort retention, customer concentration, margin bridge,
      cash forecast, and financing obligations before making a high-conviction call.
    claimRefs: [CI013, CI014, CI015]

