  - id: TR002
    title: Regulatory / legal risk register
    columns: [Rule, jurisdiction or scope, public status, likelihood, severity, mitigation, residual exposure, diligence path]
    rows:
      - ["Employment law and workplace investigations", "US and potentially international", "Employment counsel role describes active coverage and litigation support", "medium", "high", "Counsel and GRC partnership described", "medium", "Obtain jurisdiction matrix and open-claim summary"]
      - ["Applicant privacy and cross-border transfer", "US/UK/Canada/Australia named in posting", "Transfer and candidate-notice obligations disclosed but compliance outcome unverified", "medium", "high", "Candidate privacy notice and human review are referenced", "medium", "Review DPA, transfer mechanism, retention, and AI screening controls"]
      - ["AI-assisted decision and workflow governance", "Candidate screening plus broader agentic product surface", "Human decision-making stated for hiring; product-level control evidence incomplete", "medium", "high", "partial", "medium-high", "Test model inventory, approvals, audit logs, and escalation"]
    notes: "This register distinguishes disclosed obligations and mitigation statements from proof of compliance; no retained source documents an enforcement action or litigation outcome."
    enumerationScope:
      coverage: partial
      basis: "Publicly accessible 2026 employment, privacy, and risk evidence; private company records and comprehensive regulator dockets are excluded."
    claimRefs: [CR005, CR006, CR007, CR008, CR002]
  - id: TR003
    title: Operational / dependency risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Warehouse compute-cost escalation", "high", "high", "partial", "high", "No public uplift percentage or workload guardrail evidence"]
      - ["Customer data, semantic model, or permission misconfiguration", "medium-high", "high", "partial", "medium-high", "Need implementation-control and audit evidence"]
      - ["Upstream warehouse or cloud-provider availability", "medium", "high", "unclear", "medium-high", "No verified uptime SLA or status-history evidence"]
      - ["Agent or API-action error", "medium", "high", "developing", "medium-high", "Need production incident, approval, rollback, and monitoring evidence"]
      - ["Partner and strategic-platform dependence", "medium", "medium-high", "partial", "medium", "Need partner concentration and portability evidence"]
    notes: "Operational rows are risk hypotheses anchored to described architecture and explicit source limitations; they are not claims that each failure has occurred."
    claimRefs: [CR002, CR003, CR009, CR010, CR013, CR015]
callouts:
  - calloutType: risk
    title: Thesis-break trigger
    body: A material outage, security incident, regulatory action, or repeated customer evidence that Sigma cannot control warehouse cost and permission risk would break the constructive operating thesis; the trigger should be monitored with incident logs, SLA history, workload-cost data, and renewal cohorts.
    claimRefs: [CR002, CR003, CR004, CR009, CR010, CR013]
  - calloutType: assumption
    title: Evidence boundary
    body: The reviewed public sources contain no audited financial statements, public litigation docket, verified incident history, uptime percentage, or customer concentration schedule. Those omissions lower confidence and should not be converted into zero risk.
    claimRefs: [CR011, CR012, CR016]
