company:
  name: Sigma Computing
chapter:
  number: 7
  title: Risks
  summary: >-
    Public evidence points to a scaling enterprise-software risk profile: Sigma is adding legal
    and governance capacity while broadening from warehouse-native analytics into AI agents and
    workflow automation. The central underwriting risks are dependency on customer warehouse
    configuration and spend, opaque enterprise economics, expanding employment and cross-border
    compliance exposure, and limited public evidence on incidents, reliability, litigation, and
    cash efficiency.
sections:
  - id: risk-ranking
    title: Ranked risk view
    body: >-
      Sigma's highest-conviction risks are architectural and executional rather than a documented
      enforcement event. The product runs live against customer cloud warehouses, so performance,
      governance quality, and customer compute economics remain partly outside Sigma's control.
      Public descriptions also show a move into AI agents, API actions, and workflow automation;
      that expands the consequence of permission, model-output, and operational-control failures
      even where the underlying data remains in the warehouse. The evidence supports a high
      residual exposure to complexity and implementation risk, but not a claim that a breach,
      outage, or enforcement action has occurred. Mitigation evidence is strongest where Sigma or
      its hiring materials describe governance, GRC, employment counsel, and human review. UpGuard
      describes continuous external checks, but its public page does not expose the full assessment.
      Evidence remains weakest on quantified incident history, uptime, burn, and concentration.
    claimRefs: [CR001, CR002, CR003, CR004, CR013, CR015]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Legal, privacy, and regulatory exposure
    body: >-
      Sigma's public legal posture is better described as active compliance work than as a cleared
      legal record. A company-posted employment-counsel role covers federal, state, local, and
      potentially international employment law, investigations, reductions in force, outside
      counsel, litigation matters, and M&A diligence. The same posting says applicant data may
      transfer across the United States, United Kingdom, Canada, and Australia and that AI assists
      candidate screening while humans retain decision authority. Those statements identify
      concrete privacy, employment, cross-border-transfer, and AI-governance obligations, but they
      do not establish a violation. A buyer or investor should request the current privacy and
      data-processing terms, incident and litigation log, employment-law coverage by jurisdiction,
      and evidence that AI-assisted workflows have documented controls.
    claimRefs: [CR005, CR006, CR007, CR008, CR002]
    tableRefs: [TR002]
  - id: operational-dependencies
    title: Operational, partner, and financial dependencies
    body: >-
      Sigma's warehouse-native design is a strategic strength and a risk concentration. Marketplace
      material says users query massive datasets in the cloud warehouse, while the independent
      review notes that poorly governed workbooks can materially increase Snowflake, BigQuery, or
      Databricks spend and that implementation requires connection setup, semantic modeling,
      row-level security, and role mapping. That creates a shared-fate dependency on customer data
      quality, warehouse architecture, permissions, and cloud-provider availability. The public
      evidence also contains unaudited metrics, requires contact for annual pricing, and provides no
      public profitability figure, audited burn, runway, margin, or warehouse-compute uplift; these
      are diligence gaps, not estimates. Strategic investors include infrastructure partners and
      potential competitors, adding an ecosystem-governance dimension. The risk register therefore
      emphasizes measurable controls: workload-cost monitoring, permission review, SLA and incident
      evidence, renewal and concentration data, partner portability, and a cash-efficiency package.
    claimRefs: [CR009, CR010, CR011, CR012, CR014, CR015, CR016]
    tableRefs: [TR003]
