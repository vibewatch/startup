  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "retention"
      missingEvidence: >-
        NRR, GRR, logo and revenue churn, renewal rate, contract length, cohort retention,
        satisfaction, expansion attach, and paid-user retention by customer segment.
      whyItMatters: >-
        Customer and user growth cannot establish durable recurring revenue or efficient
        land-and-expand behavior without retention and cohort denominators.
      diligencePath: >-
        Obtain management's monthly and annual cohort schedules, reconcile them to billing,
        and validate renewal and expansion behavior through former and current customer calls.
      relatedQuestionRefs:
        - "QU004"
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-concentration"
      missingEvidence: >-
        Top-1, top-5, and top-10 revenue shares; vertical, geography, channel, warehouse,
        embedded, and direct-sales mix; and concentration changes over time.
      whyItMatters: >-
        Broad logo evidence can coexist with material revenue dependence on a small group
        of customers, partners, or cloud-data platforms.
      diligencePath: >-
        Request anonymized customer-level ARR and gross-retention data, segment the file by
        vertical, geography, channel, product, and warehouse, and reconcile totals to finance.
      relatedQuestionRefs:
        - "QU005"
    - type: "enumeration-incomplete"
      severity: "minor"
      topic: "named-customers"
      missingEvidence: >-
        A dated, complete customer-reference list identifying pilot versus production,
        deployment scope, active users, renewal status, and verified outcome methodology.
      whyItMatters: >-
        The named proof table is a selected public sample and cannot establish the quality
        or representativeness of the full customer base.
      diligencePath: >-
        Ask management for a referenceable customer census and independently interview a
        stratified sample of new, renewed, expanded, contracted, and churned accounts.
      relatedTableRefs:
        - "TU003"
