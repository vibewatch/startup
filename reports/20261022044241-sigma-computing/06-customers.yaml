company:
  name: "Sigma Computing"
chapter:
  number: 6
  title: "Customers"
  summary: >-
    Sigma shows credible breadth through more than 2,000 reported customers, 1.1 million
    new active users in the latest fiscal year, and a large catalog of named deployments
    across industries. The underwriting gap is durability: the retained public evidence
    does not disclose NRR, GRR, churn, renewal rates, contract length, or customer
    concentration, while competitor-authored sources describe adoption, performance,
    and cost friction that require direct customer-reference testing.
sections:
  - id: "customer-base-and-segmentation"
    title: "Customer base and segmentation"
    body: >-
      The public customer picture is enterprise-oriented but spans several adoption
      motions. Third-party reporting says Sigma served more than 2,000 customers by
      April-May 2026 and names AMD, Duolingo, Colgate-Palmolive, JPMorgan Chase, DoorDash,
      and other large organizations. The retained case-study index broadens that picture
      across financial services, logistics, healthcare, consumer, software, media, and
      manufacturing, with users ranging from data engineers and analytics leaders to
      product, finance, marketing, and operations teams. These references support a
      segmentation around enterprise analytics, analyst-led self-service, embedded
      analytics, and operational business workflows rather than a single narrow buyer.
      However, the catalog is syndicated vendor success material: it establishes named
      references and claimed use cases, not a representative mix of paying customers,
      revenue bands, geographies, contract sizes, or deployment maturity.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU007"
    tableRefs:
      - "TU001"
  - id: "adoption-and-customer-proof"
    title: "Adoption trajectory and customer proof"
    body: >-
      Adoption evidence is strongest at the top of the funnel. The Next Web reports
      1.1 million new active users in Sigma's latest fiscal year and more than 2,000
      customers, while a review aggregator reports a 4.6 average across 508 reviews.
      The named proof is concrete enough to show varied use: the indexed stories claim
      DoorDash increased queries by 30%, Agero achieved five times more self-service
      analytics and 50% lower BI costs, and customers use Sigma for embedded analytics,
      freight visibility, financial reporting, fraud controls, marketing, and operational
      workflows. These are useful deployment signals, but they are mostly company-issued
      outcomes without disclosed baselines, cohort definitions, implementation costs,
      or independent replication. Sigma Agents being described as the company's
      fastest-adopted product adds a current expansion surface, although no installed-base
      penetration or paid-conversion denominator is public.
    claimRefs:
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU008"
      - "CU009"
      - "CU015"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-expansion-and-friction"
    title: "Durability, expansion, and concentration risk"
    body: >-
      Public evidence does not close the durability question. The retained sources
      provide no NRR, GRR, logo churn, renewal rate, contract length, customer cohort,
      top-customer share, or warehouse-partner concentration. Review synthesis is
      directionally constructive on onboarding, warehouse connectivity, support, and
      collaboration, but also notes learning curves, pricing concerns, slow loads, and
      friction in complex workbooks. Competitor-authored accounts go further: Reflex
      describes one evaluated deployment with near-zero usage at renewal and estimates
      mid-sized annual fees of roughly $70,000-$80,000 plus add-ons, while Astrato argues
      that per-seat tiers and warehouse compute can make costs unpredictable. Those
      claims are self-interested and not independent benchmarks, yet they identify
      testable churn mechanisms. Microsoft Marketplace's instruction to contact Sigma
      for annual pricing reinforces procurement opacity. A prospective investor should
      therefore condition expansion confidence on customer calls, cohort retention
      schedules, concentration data, and renewal economics rather than logo breadth.
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU016"
    figureRefs:
      - "FU001"
