  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Key downside trigger
    rows:
      - - Bull
        - >-
          ARR remains near or above the reported $200M level, growth stays high, agents expand paid workloads, and
          retention/margins prove strong.
        - A 15x or higher revenue/ARR anchor is sustained or expands; upside requires verified growth and quality.
        - Lower probability until audited or management-confirmed metrics are provided.
        - Agent adoption does not convert to recurring revenue or strategic buyers reduce support.
      - - Base
        - >-
          Reported $3B valuation is broadly credible, growth moderates, and Sigma remains a differentiated private
          platform.
        - Entry is approximately fair at the reported mark; return depends on future growth and exit timing.
        - Most defensible pending financial and cap-table diligence.
        - Retention, margin, or customer concentration is materially worse than assumed.
      - - Bear
        - Growth decelerates, AI analytics becomes a crowded feature, or enterprise budgets favor incumbents.
        - >-
          Revenue multiple compresses materially below the reported 15.0x reference, producing downside even if revenue
          grows.
        - Material risk because private metrics and terms are not public.
        - Down-round, liquidity constraint, security event, or preference overhang impairs common equity value.
      - - Decision gate
        - Obtain ARR bridge, cohort retention, margin, burn, cap table, preferences, debt, and customer concentration.
        - Proceed only if quality metrics support the price or the entry price resets.
        - Required before a buy decision.
        - Any unresolved blocker remains a research-more outcome.
    notes: >-
      Scenario ranges are qualitative because public sources do not provide sufficient audited inputs for a defensible
      numeric valuation range; the reported 15.0x reference is not treated as a forecast.
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV010
      - CV011
      - CV014
