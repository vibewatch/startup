              - CO012
              - CO013
              - CO014
      - number: '1.3'
        title: Milestones, dependencies, and open diligence
        blocks:
          - type: paragraph
            body: >-
              Sigma's trajectory combines a long-standing warehouse-native BI proposition with a recent shift toward
              agentic analytics. The assigned evidence records the 2014 founding, the 2021 Series C, the 2024 Series D,
              the 2026 Series E, the April 2026 ARR milestone, and the launch and rapid adoption of Sigma Agents.
              Strategic investors that are also warehouse or enterprise-software ecosystem participants may support
              distribution and integration, but they can also create dependence on partner priorities and competitive
              overlap. The competitor source describes Sigma's expanding architecture as including optional
              materialization and AI infrastructure layers, while positioning rival Astrato as simpler; this is a
              competitor's comparison, not an independent benchmark. UpGuard's page confirms ongoing external monitoring
              across 330-plus checks but does not disclose a breach or a passing score in the assigned text. Key
              unresolved items are board control, cap-table terms, profitability and cash efficiency, customer
