      - number: '1.2'
        title: Financing, valuation, and operating scale
        blocks:
          - type: paragraph
            body: >-
              Public reporting indicates that Sigma closed an $80 million Series E in May 2026 at a $3 billion
              valuation, led by Princeville Capital with strategic participation from Databricks Ventures, ServiceNow
              Ventures, and Workday Ventures. SiliconANGLE and The Next Web both report the same round and describe the
              valuation as double the prior $1.5 billion Series D level. The same reporting says annual recurring
              revenue reached $200 million in April 2026, up from roughly $100 million a year earlier, and customer
              count exceeded 2,000. These are reported operating metrics, not audited financial statements. Assigned
              profile material reports conflicting cumulative funding totals ($661 million-plus in its round table
              versus $961.3 million in its headline), while it explicitly says public metrics vary by source and
              methodology. The report therefore treats the latest round, valuation, ARR, and customer count as reported
              values with source and period qualifiers, not as verified accounting results.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
