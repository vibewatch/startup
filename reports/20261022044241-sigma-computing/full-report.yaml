chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and leadership
        blocks:
          - type: paragraph
            body: >-
              Sigma Computing, now branded as Sigma, was founded in 2014 as Bitmoon Computing by Rob Woollen and Jason
              Frantz and is headquartered in San Francisco. Its product is a cloud-native analytics and
              business-intelligence layer that queries live data in Snowflake, Databricks, BigQuery, and other
              warehouses through a spreadsheet-style interface. The warehouse-native architecture is the central product
              claim: users can explore large datasets without writing SQL while existing warehouse permissions and
              governance remain relevant. The company has expanded that base into Sigma Agents, which SiliconANGLE
              describes as no-code agents that can run interactively, autonomously, or through external API calls. Mike
              Palmer is identified as chief executive, with Woollen as co-founder and CTO and Frantz as co-founder and
              chief architect in the company profile. Leadership depth beyond those named executives and the board's
              composition are not publicly established by the assigned sources, so key-person and governance diligence
              remains open.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
