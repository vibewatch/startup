  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      Public evidence supports a plausible analyst-to-enterprise expansion path, but activation, paid conversion,
      renewal, and concentration remain undisclosed checkpoints.
    data:
      nodes:
        - label: Warehouse and governance fit
          detail: >-
            Enterprise evaluation begins with cloud-warehouse connectivity, governance, security review, and custom
            commercial terms.
          touchpoints:
            - Cloud data warehouse
            - Security and procurement review
        - label: Analyst beachhead
          detail: Spreadsheet-style exploration and live queries provide the initial workflow for data and analytics teams.
          touchpoints:
            - Workbook creation
            - Analyst onboarding
        - label: Business-user self-service
          detail: >-
            Curated workbooks and collaboration can extend access to finance, operations, marketing, and other
            functions.
          touchpoints:
            - Shared dashboards
            - Governed business access
        - label: Operational and embedded use
          detail: >-
            Input tables, embedded analytics, and data applications can move the product into customer-facing and
            action-oriented workflows.
          touchpoints:
            - Embedded analytics
            - Operational workflows
        - label: AI product expansion
          detail: >-
            Sigma Agents is reported as the company's fastest-adopted product, but paid penetration and retained usage
            are not public.
          touchpoints:
            - Interactive agents
            - Autonomous or external workflows
        - label: Renewal and expansion test
          detail: >-
            Learning curve, performance, pricing, warehouse compute, and incumbent-tool overlap can determine whether
            adoption converts into durable expansion.
          touchpoints:
            - Renewal decision
            - Cross-team expansion
    approximationNotes: >-
      The sequence is an analytical journey synthesized from retained evidence, not a measured funnel; it does not imply
      conversion rates, uniform timing, or a shared customer population.
