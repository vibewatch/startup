      - number: '3.2'
        title: Capability differentiation and operating tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Sigma's clearest differentiation is the combination of a spreadsheet interaction model, live queries
              against customer-controlled warehouses, and operational features such as input tables and writeback. That
              combination broadens the addressable user beyond SQL specialists and distinguishes Sigma from read-only
              dashboarding. It is not unique in every dimension: ThoughtSpot also emphasizes live-warehouse exploration,
              Looker has a mature governed semantic model, Omni targets analytics-engineering workflows, and several
              vendors support embedding. The adverse evidence is directionally consistent on two tradeoffs: complex live
              workbooks can increase latency and warehouse consumption, while Sigma's visualization and presentation
              depth may lag dashboard-first products. No independent workload benchmark in the pool quantifies either
              effect.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP016
      - number: '3.3'
        title: Pricing, distribution, switching, and channel power
        blocks:
          - type: paragraph
            body: >-
              Sigma's public pricing is sales-led, so third-party list-price comparisons are useful only as screening
              signals and not evidence of realized contract economics. Microsoft can make Power BI the default inside
              existing enterprise agreements, Google can pair Looker with BigQuery and Gemini, and both routes reduce
              the need for a separate buying process. Sigma counters with warehouse neutrality, spreadsheet familiarity,
              and strategic ties to Databricks, ServiceNow, and Workday, but those relationships are not exclusive
              distribution rights. Switching cost therefore comes mainly from governed workbook logic, user training,
              embedded applications, and operational writeback workflows rather than proprietary data storage.
              Multi-homing remains plausible because several tools can query the same warehouse, although no source in
              the assigned pool measures actual overlap or migration cost.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP011
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP012
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Sigma has enough reported scale and financing to compete aggressively, and independent coverage describes
              its 2026 expansion from warehouse-native BI into agentic analytics. However, that repositioning increases
              overlap with cloud platforms, incumbent BI vendors, and focused AI-search products. The durable moat is
              more likely to be accumulated governed workflows, embedded applications, and operator adoption than the
              phrase "agentic analytics," which large software vendors can copy. Competitor-authored criticism that
              Sigma's platform identity is broad and that some AI functions are immature should be treated as adverse
              directional evidence, not an independent benchmark. The underwriting conclusion is a differentiated
              product with real switching friction but no proven structural lock-in; customer-level win/loss, migration,
              and compute-cost data remain required.
            claimRefs:
              - CP004
              - CP005
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is workflow-level, not warehouse exclusivity
            body: >-
              Sigma combines live warehouse access with a spreadsheet interface and operational writeback, creating
              adoption and workflow switching costs without requiring customers to move their underlying data into a
              proprietary store.
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
              - CP005
          - type: callout
            title: Incumbents can compress the feature gap
            body: >-
              Microsoft, Google, and AI-first BI vendors already pair distribution or live-warehouse access with
              improving AI features. Sigma must prove that governed applications and operator workflows create durable
              retention beyond category-level agentic-analytics messaging.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Sigma's monetization appears to be enterprise SaaS built around a cloud-warehouse analytics and AI
              applications platform. The product is sold to business and technical teams that query live warehouse data
              through spreadsheet, SQL, Python, and AI workflows; a 2026 job posting describes technical presales,
              RFP/RFI responses, prototypes, and concurrent enterprise engagements, which is consistent with a
              consultative sales motion rather than self-serve software. The same posting says Sigma has more than 2,000
              customers and reached $200M ARR in April 2026, but the issuer is Sigma and the figures are not
              independently audited in the source. Third-party procurement commentary describes role-based tiers and
              custom enterprise quotes, while noting that published contract terms and typical deal sizes are not
              available. Consequently, list-price or role-price indications should not be treated as realized revenue,
              discount-adjusted ASP, or gross margin evidence.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI009
              - CI013
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI006
              - CI016
      - number: '4.2'
        title: Unit economics and cost structure
        blocks:
          - type: paragraph
            body: >-
              The public file is insufficient to calculate CAC payback, gross margin, contribution margin, or sales
              efficiency. Sigma's live-query architecture can reduce data duplication, but it also leaves customer
              workloads dependent on warehouse compute; an independent competitor article flags performance under load
              and potentially unpredictable costs from heavy or frequent queries. Those observations are risk signals,
              not quantified Sigma cost data. The enterprise presales requirements, including solution prototypes,
              security responses, and 25% travel, indicate a non-trivial implementation and sales-support burden, but no
              public source supplies fully loaded selling expense, deployment cost, support cost, or payback period. A
              buyer should therefore model economics with actual cohort bookings, services effort, warehouse-cost
              pass-through, and renewal data rather than extrapolating from ARR growth alone.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI011
              - CI012
              - CI014
      - number: '4.3'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Sigma's May 2026 Series E provides an observed financing event and a reported valuation anchor, but it
              does not disclose cash on hand, burn, runway, debt covenants, or use of proceeds. The Next Web reports an
              $80M round at a $3B valuation and describes the financing as a test of the company's agentic-analytics
              repositioning; its discussion of 15x ARR is an editorial calculation based on the reported $200M ARR, not
              an audited accounting multiple. The round size can plausibly extend operating flexibility, but cash
              available cannot be inferred from funding raised because expenses, debt, working capital, and transaction
              terms are unknown. The financial verdict is therefore constructive on reported growth and financing
              access, but research-more on earnings quality, capital efficiency, and downside protection.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI009
              - CI010
              - CI015
      - number: '4.4'
        title: Underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              The most decision-relevant missing inputs are recurring-revenue definitions and cohort behavior, realized
              price and discount data, gross margin by product and customer segment, cash and burn forecasts,
              implementation and warehouse-cost allocation, debt or project-finance obligations, and concentration by
              customer, partner, and warehouse. Public profiles explicitly state that profitability figures were not
              found and that reported metrics vary by source and methodology. These are material gaps rather than
              evidence of weak performance: the available data can support a reported-growth narrative, but not a
              reliable cash-flow or valuation underwriting case.
            claimRefs:
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Growth and financing access are visible
            body: >-
              Assigned sources consistently report $200M ARR, more than 2,000 customers, and an $80M Series E at a $3B
              valuation in 2026, supporting a credible scale-stage growth signal even though the figures are not audited
              here.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI009
              - CI010
          - type: callout
            title: Capital efficiency cannot yet be underwritten
            body: >-
              No assigned source supplies gross margin, cash, burn, runway, retention, realized pricing, or debt terms,
              so the valuation cannot be tested against cash generation or durable cohort economics.
            calloutType: risk
            claimRefs:
              - CI007
              - CI008
              - CI011
              - CI012
              - CI014
          - type: callout
            title: Request cohort and cash evidence before underwriting
            body: >-
              Treat reported growth as a positive signal, but require a management data room with revenue
              reconciliation, cohort retention, customer concentration, margin bridge, cash forecast, and financing
              obligations before making a high-conviction call.
            calloutType: recommendation
            claimRefs:
              - CI013
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and product surface
        blocks:
          - type: paragraph
            body: >-
              Sigma's core workflow is a business user exploring live warehouse data without waiting for a data team to
              publish a static dashboard. The product combines a spreadsheet-style workbook with SQL, Python,
              natural-language assistance, collaborative sharing, write-back input tables, embedded analytics, and
              parameter-driven data applications. The official announcement describes the product moving beyond passive
              business intelligence toward AI-powered workflows, with Sigma Agents, Sigma Assistant, Client Connectors,
              and API Actions. This broadens the addressable workflow from analysis to action, but it also creates a
              product-scope diligence question: the public record describes capabilities and customer examples more
              clearly than it quantifies adoption, latency, error rates, or the amount of implementation work required
              for each module.
            claimRefs:
