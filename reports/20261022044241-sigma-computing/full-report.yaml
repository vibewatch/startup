      - number: '5.2'
        title: Warehouse-native architecture and dependencies
        blocks:
          - type: paragraph
            body: >-
              The product's central architectural choice is to query the customer's cloud warehouse rather than copy
              data into a separate analytics store. Independent coverage says Sigma runs spreadsheet operations, SQL,
              Python, and AI Apps against the warehouse compute layer; the company says agents run where the data lives
              and inherit the permissions already controlled there. This can reduce extract duplication and align the
              user experience with existing governance, but it makes product performance and availability dependent on
              warehouse configuration, cloud-provider regions, query workload, semantic modeling, and customer data
              quality. The reviewed sources identify Snowflake, Databricks, BigQuery, Redshift, and PostgreSQL
              connectivity, yet they do not independently establish comparative performance or the completeness of each
              connector's feature support.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE013
      - number: '5.3'
        title: Maturity, deployment, and roadmap signals
        blocks:
          - type: paragraph
            body: >-
              Public maturity signals are mixed. Sigma's April 2026 announcement reports $200 million of ARR, more than
              2,000 businesses, 1.1 million new active users in the latest fiscal year, and customer workflows that
              include real-time analytics and embedded AI applications. A current enterprise customer-success posting
              emphasizes adoption programs, training, success plans, integrations, production BI implementation, and
              net-dollar-retention work, which is consistent with a product that requires active deployment and
              expansion support rather than a purely self-serve workflow. A separate solution-engineering listing calls
              out discovery, demos, technical and security RFP responses, data migration, and partner-channel execution.
              These are useful operating signals, not independent proof of implementation success, retention, uptime, or
              roadmap delivery.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, reliability, and technical diligence
        blocks:
          - type: paragraph
            body: >-
              Sigma's stated trust proposition is inherited warehouse governance: live queries, row- and column-level
              controls, and agents operating inside existing permissions. The official release also describes API
              Actions and external-system connectors, which expand the control plane beyond read-only analytics and
              raise the importance of action authorization, auditability, secrets handling, and failure recovery. The
              reviewed UpGuard page reports continuous monitoring across 330-plus external checks but does not expose a
              company-specific score or control-level results in the fetched text. A review aggregation reports a 99.9%
              monthly target availability and notes dependence on upstream warehouses and cloud regions, while also
              saying historical multi-month uptime is not fully summarized. Investors should therefore treat security
              posture, incident history, service-level attainment, agent evaluation, connector coverage, and
              customer-side operating burden as open diligence items rather than infer them from architecture language.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE004
            claimRefs:
              - CE010
              - CE011
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coherent warehouse-native wedge
            body: >-
              Sigma's strongest product claim is internally consistent across independent coverage and company
              materials: business-friendly interaction sits directly on live warehouse compute while existing warehouse
              governance remains central.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: callout
            title: New action surface raises the diligence bar
            body: >-
              Agents, connectors, and API Actions turn analytics into execution. Permission boundaries, evaluation
              quality, secrets, retries, auditability, and incident response should be underwritten as product controls,
              not assumed from warehouse-native positioning.
            calloutType: risk
            claimRefs:
              - CE004
              - CE013
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              The public customer picture is enterprise-oriented but spans several adoption motions. Third-party
              reporting says Sigma served more than 2,000 customers by April-May 2026 and names AMD, Duolingo,
              Colgate-Palmolive, JPMorgan Chase, DoorDash, and other large organizations. The retained case-study index
              broadens that picture across financial services, logistics, healthcare, consumer, software, media, and
              manufacturing, with users ranging from data engineers and analytics leaders to product, finance,
              marketing, and operations teams. These references support a segmentation around enterprise analytics,
              analyst-led self-service, embedded analytics, and operational business workflows rather than a single
              narrow buyer. However, the catalog is syndicated vendor success material: it establishes named references
              and claimed use cases, not a representative mix of paying customers, revenue bands, geographies, contract
              sizes, or deployment maturity.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU002
              - CU004
              - CU007
      - number: '6.2'
        title: Adoption trajectory and customer proof
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is strongest at the top of the funnel. The Next Web reports 1.1 million new active users
              in Sigma's latest fiscal year and more than 2,000 customers, while a review aggregator reports a 4.6
              average across 508 reviews. The named proof is concrete enough to show varied use: the indexed stories
              claim DoorDash increased queries by 30%, Agero achieved five times more self-service analytics and 50%
              lower BI costs, and customers use Sigma for embedded analytics, freight visibility, financial reporting,
              fraud controls, marketing, and operational workflows. These are useful deployment signals, but they are
              mostly company-issued outcomes without disclosed baselines, cohort definitions, implementation costs, or
              independent replication. Sigma Agents being described as the company's fastest-adopted product adds a
              current expansion surface, although no installed-base penetration or paid-conversion denominator is
              public.
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU008
              - CU009
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU003
              - CU008
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not close the durability question. The retained sources provide no NRR, GRR, logo
              churn, renewal rate, contract length, customer cohort, top-customer share, or warehouse-partner
              concentration. Review synthesis is directionally constructive on onboarding, warehouse connectivity,
              support, and collaboration, but also notes learning curves, pricing concerns, slow loads, and friction in
              complex workbooks. Competitor-authored accounts go further: Reflex describes one evaluated deployment with
              near-zero usage at renewal and estimates mid-sized annual fees of roughly $70,000-$80,000 plus add-ons,
              while Astrato argues that per-seat tiers and warehouse compute can make costs unpredictable. Those claims
              are self-interested and not independent benchmarks, yet they identify testable churn mechanisms. Microsoft
              Marketplace's instruction to contact Sigma for annual pricing reinforces procurement opacity. A
              prospective investor should therefore condition expansion confidence on customer calls, cohort retention
              schedules, concentration data, and renewal economics rather than logo breadth.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is visible; durability is not
            body: >-
              More than 2,000 reported customers, 1.1 million new active users, and named use cases across many
              industries establish meaningful adoption breadth, but do not substitute for cohort retention or recurring
              expansion evidence.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
              - CU004
          - type: callout
            title: Renewal economics need primary diligence
            body: >-
              Competitor-authored accounts flag low usage, price, performance, and warehouse-compute friction. These are
              not independent benchmarks, but they define concrete questions for customer calls and renewal-cohort
              review.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view
        blocks:
          - type: paragraph
            body: >-
              Sigma's highest-conviction risks are architectural and executional rather than a documented enforcement
              event. The product runs live against customer cloud warehouses, so performance, governance quality, and
              customer compute economics remain partly outside Sigma's control. Public descriptions also show a move
              into AI agents, API actions, and workflow automation; that expands the consequence of permission,
              model-output, and operational-control failures even where the underlying data remains in the warehouse.
              The evidence supports a high residual exposure to complexity and implementation risk, but not a claim that
              a breach, outage, or enforcement action has occurred. Mitigation evidence is strongest where Sigma or its
              hiring materials describe governance, GRC, employment counsel, and human review. UpGuard describes
              continuous external checks, but its public page does not expose the full assessment. Evidence remains
              weakest on quantified incident history, uptime, burn, and concentration.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR013
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR009
              - CR011
              - CR013
              - CR014
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR009
              - CR011
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.2'
        title: Legal, privacy, and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Sigma's public legal posture is better described as active compliance work than as a cleared legal record.
              A company-posted employment-counsel role covers federal, state, local, and potentially international
              employment law, investigations, reductions in force, outside counsel, litigation matters, and M&A
              diligence. The same posting says applicant data may transfer across the United States, United Kingdom,
              Canada, and Australia and that AI assists candidate screening while humans retain decision authority.
              Those statements identify concrete privacy, employment, cross-border-transfer, and AI-governance
              obligations, but they do not establish a violation. A buyer or investor should request the current privacy
              and data-processing terms, incident and litigation log, employment-law coverage by jurisdiction, and
              evidence that AI-assisted workflows have documented controls.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR002
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR002
      - number: '7.3'
        title: Operational, partner, and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              Sigma's warehouse-native design is a strategic strength and a risk concentration. Marketplace material
              says users query massive datasets in the cloud warehouse, while the independent review notes that poorly
              governed workbooks can materially increase Snowflake, BigQuery, or Databricks spend and that
              implementation requires connection setup, semantic modeling, row-level security, and role mapping. That
              creates a shared-fate dependency on customer data quality, warehouse architecture, permissions, and
              cloud-provider availability. The public evidence also contains unaudited metrics, requires contact for
              annual pricing, and provides no public profitability figure, audited burn, runway, margin, or
              warehouse-compute uplift; these are diligence gaps, not estimates. Strategic investors include
              infrastructure partners and potential competitors, adding an ecosystem-governance dimension. The risk
              register therefore emphasizes measurable controls: workload-cost monitoring, permission review, SLA and
              incident evidence, renewal and concentration data, partner portability, and a cash-efficiency package.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR009
              - CR010
              - CR013
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break trigger
            body: >-
              A material outage, security incident, regulatory action, or repeated customer evidence that Sigma cannot
              control warehouse cost and permission risk would break the constructive operating thesis; the trigger
              should be monitored with incident logs, SLA history, workload-cost data, and renewal cohorts.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR009
              - CR010
              - CR013
          - type: callout
            title: Evidence boundary
            body: >-
              The reviewed public sources contain no audited financial statements, public litigation docket, verified
              incident history, uptime percentage, or customer concentration schedule. Those omissions lower confidence
              and should not be converted into zero risk.
            calloutType: assumption
            claimRefs:
              - CR011
              - CR012
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case is that Sigma has reached meaningful scale in a structurally attractive warehouse-native
              analytics market. The strongest current financing evidence is a May 2026 Series E of $80 million at a
              reported $3 billion valuation, while the same coverage reports $200 million of ARR and more than 2,000
              customers. The product thesis is also coherent: a spreadsheet-like interface operates on live warehouse
              data, and Sigma is extending that architecture into agentic analytics. Strategic participation from
              Databricks, ServiceNow, and Workday is a useful ecosystem signal, but it is not proof of customer
              economics or exit value. The anti-thesis is valuation sensitivity: the reported price implies roughly 15x
              ARR on one private-market data source, and the public record does not disclose gross margin, net
              retention, burn, runway, customer concentration, or preference terms. A $3 billion mark can therefore be
              reasonable only if growth remains unusually strong and the agentic product expands durable monetization
              rather than merely changing the category label.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV008
              - CV009
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV010
              - CV011
      - number: '8.2'
        title: Price discipline and scenarios
        blocks:
          - type: paragraph
            body: >-
              The entry question should be framed as a range of outcomes rather than as a single fair-value point.
              Multiples.vc records a $3 billion May 2026 valuation against $200 million of recorded revenue or ARR and
              calculates a 15.0x revenue multiple; The Next Web independently describes the same round and says the
              valuation doubled from $1.5 billion while revenue doubled over the same period. Those observations support
              a strong momentum case, but they do not establish audited revenue or recurring-revenue composition.
              Multiples.vc lists LTM EV-to-revenue references of 1.7x for Teradata, 4.9x for Amplitude, and 7.6x for
              Planisware, all below Sigma's recorded 15.0x figure, but those companies are imperfect business-model and
              growth matches rather than a dispositive benchmark. Latka instead reports $100 million of annual revenue
              in April 2025 and $581.3 million raised across seven rounds, illustrating the data-quality problem rather
              than resolving it. A base case should require refreshed management financials, cohort retention, margin
              and burn data, and cap-table terms before accepting the reported price. The bear case is a multiple reset
              if growth slows, AI-agent adoption proves shallow, or enterprise budgets consolidate around incumbent
              platforms. The bull case requires sustained growth, expansion revenue, and evidence that agents increase
              paid workload rather than only usage.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: Exit readiness and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Sigma has credible ingredients for an eventual strategic or public-market outcome: private-market sources
              describe a broad enterprise customer base, strategic investors, and a product positioned across analytics,
              data apps, and AI workflows. However, exit readiness cannot be inferred from a financing headline. The
              latest round was privately reported rather than disclosed in a public filing, and the source set contains
              materially different totals for funding, revenue, ARR, and headcount. Silicon Valley Investclub estimates
              about 13% dilution in the Series D and about 3% in the Series E from disclosed round sizes and post-money
              values, while noting that the shareholder register is not public; these calculations do not reveal
              preference rights or fully diluted ownership. UpGuard's current vendor-risk page also demonstrates that
              external monitoring exists, but its public page does not provide a complete score or incident history;
              absence of a disclosed incident is not evidence of absence. Before investment, diligence should obtain the
              executed financing documents, updated cap table, liquidation preferences, option-pool treatment, debt and
              convertibles, ARR bridge, gross margin, net retention, logo churn, customer concentration, and AI-agent
              usage-to-revenue conversion. Thesis-break triggers should include a material down-round, weakening net
              retention, sustained margin deterioration, a security or reliability event that causes enterprise churn,
              or failure to convert agent adoption into contracted recurring revenue.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Conditional research-more
            body: >-
              The public record supports continued diligence rather than a buy call. The reported $3 billion price can
              be accepted only after reconciling revenue definitions and obtaining retention, margin, cash-efficiency,
              customer-concentration, and cap-table evidence.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV011
          - type: callout
            title: Private-market data conflict
            body: >-
              Funding, revenue, ARR, and headcount totals vary materially by source. Treat the figures as reported
              indicators, not interchangeable audited metrics, until management documentation reconciles periods and
              definitions.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV012
          - type: callout
            title: Downside trigger
            body: >-
              A down-round, weakening net retention, material margin deterioration, or a security/reliability event that
              causes enterprise churn would invalidate the current constructive valuation stance.
            calloutType: assumption
            claimRefs:
              - CV010
              - CV014
