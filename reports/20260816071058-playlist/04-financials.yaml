- id: TI002
  title: Pricing / monetization table
  columns:
  - Product / layer
  - Public price or model
  - List vs realized
  - Unknowns
  - Implication
  rows:
  - - Mindbody
    - Base subscription per location, plus premium add-ons and transaction-related fees
    - List pricing only
    - Actual realized price, discounts, and fee attach rates unknown
    - Published price likely understates total operator spend.
  - - ClassPass consumer
    - Credits tiers (e.g. 8, 15, 33, 43, 68, 100, 125 credits)
    - List pricing / plan logic visible
    - Net ARPU, promo mix, and add-on purchases unknown
    - Consumer monetization is transparent at the UI level but not at the cohort level.
  - - ClassPass cancellation / refunds
    - Auto-renewal, cancellation timing, no refunds for months or extra credits
    - Policy language visible
    - Customer-service resolution rates and dispute incidence unknown
    - Policy friction can affect perceived revenue quality and churn.
  - - Employer wellness
    - Custom employer-benefit contracts
    - Realized contract pricing only
    - Seat, usage, subsidy, and payout structure undisclosed
    - Revenue durability depends on renewal and engagement, not public list pricing.
  - - EGYM / connected tech
    - Hardware + ecosystem / platform monetization
    - Realized project economics only
    - Bundle structure, financing, and support burden undisclosed
    - Potentially higher ACV but more capital and service complexity.
  notes: Public pricing is useful for GTM understanding, not for exact revenue or margin estimation.
