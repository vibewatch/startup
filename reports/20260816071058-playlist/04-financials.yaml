- id: peer-benchmarks-and-capital-intensity
  title: Peer Benchmarks and Capital Intensity
  body: 'Public comparables help frame what the merged business could become, even if no peer is a perfect match. Planet Fitness shows how a fitness platform can mix recurring revenue with franchise and equipment economics. Life Time shows the opposite pole: strong recurring membership dues can still coexist with large debt, lease, and capex demands in facility-heavy models. Playlist should sit somewhere between pure software and these more physical operators. Its software and marketplace layers should be more capital-light than Life Time, but EGYM and wellness-network execution make it less cleanly asset-light than a narrow SaaS company. Wellhub is useful as a narrower employer-wellness peer, but only for one layer of the stack. These comps do not solve valuation by themselves, yet they do show why the key diligence question is mix: the same revenue headline can deserve very different multiples depending on which economic engine dominates.'
  claimRefs:
  - CI020
  - CI021
  - CI022
  - CI023
  - CI024
  - CI025
