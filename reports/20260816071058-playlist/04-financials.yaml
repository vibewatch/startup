company:
  name: Playlist
chapter:
  number: 4
  title: Financials
  summary: Playlist’s public financial picture is directionally attractive but incomplete. The company disclosed more than $800 million of 2025 net revenue and strong profitability at merger announcement, but it does not break revenue, margin, or capital intensity out by Mindbody, ClassPass, Booker, EGYM Technology, and Wellpass. The business clearly mixes software, payments-adjacent fees, consumer marketplace monetization, employer wellness contracts, and hardware-related economics, which means the underwriting challenge is not whether revenue exists, but how much of it is recurring, margin-rich, and capital-light.
sections:
- id: revenue-model-and-public-traction
  title: Revenue Model and Public Traction
  body: Public evidence is strong enough to show that Playlist is not a concept-stage roll-up. The business disclosed more than $800 million of 2025 net revenue and described itself as strongly profitable. The more important nuance is that this is not one revenue engine. Mindbody and Booker monetize operator workflows. ClassPass monetizes credits and demand aggregation. ClassPass Corporate and Wellpass monetize employer access. EGYM introduces smart-equipment and training infrastructure economics. That means reported net revenue may contain very different quality bands inside one headline figure. Some of those streams are likely subscription-like and recurring. Others are transaction-linked, usage-linked, or dependent on physical deployment. The topline is therefore credible and meaningful, but the lack of segment breakout prevents investors from knowing how much of the mix is software-like versus marketplace-like or hardware-like. That distinction matters enormously because identical revenue
    dollars can justify very different valuations and financing expectations depending on their gross margin, churn profile, and implementation burden.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI008
  - CI009
  - CI012
  - CI013
  - CI015
  - CI016
  tableRefs:
  - TI001
  figureRefs:
