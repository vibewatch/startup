tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current public status
  - Revenue-quality note
  - Diligence ask
  rows:
  - - Mindbody / Booker software
    - Subscription software plus services
    - Per location / business account
    - Publicly visible via official pricing pages
    - Likely recurring but blended with add-ons and fees
    - Request ARR, logo count, and gross margin by software brand.
  - - Mindbody payments / fees
    - Processing, messaging, integrations, discovery-linked fees
    - Per transaction / usage event
    - Officially acknowledged but not quantified
    - Can be high-margin or contested depending on mix
    - Request net take rate and payments attach rate.
  - - ClassPass consumer
    - Credits-based plans and purchases
    - Credits / monthly cycle
    - Public plan structure visible
    - Recurring but sensitive to churn, refunds, and rollover policy perception
    - Request churn, ARPU, and rollover-liability detail.
  - - Employer wellness
    - Corporate access contracts and benefit programs
    - Employer contract / participant activity
    - Product framing is visible, economics are not
    - Potentially sticky if engagement is real; opaque if subsidies dominate
    - Request contract lengths, renewal rates, and partner payout terms.
  - - EGYM technology
    - Smart equipment and connected training ecosystem
    - Installation / hardware / software bundle
    - Official product scope visible, financial mix not public
    - More capital- and support-intensive than pure software
    - Request hardware gross margin and deployment payback.
  - - Cross-brand / other
    - Integration, services, and possible bundled monetization
    - Unknown
    - Not publicly broken out
    - Could be strategically important but financially invisible
    - Request cross-sell revenue and shared-customer penetration.
  notes: The table describes visible streams, not audited segment reporting. Public sources are sufficient for mechanism identification but not revenue weighting.
