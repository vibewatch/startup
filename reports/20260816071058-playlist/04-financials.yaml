  columns:
  - Field
  - Public evidence
  - Status
  - Why it matters
  - Diligence ask
  rows:
  - - Fresh capital
    - 2026 equity raise of $785M
    - known
    - Large enough to matter materially for integration and growth
    - Request exact post-close cash balance and use-of-funds plan.
  - - Cash on hand
    - Not disclosed
    - unknown
    - Needed to assess runway and flexibility
    - Request quarter-end cash immediately after merger close.
  - - Monthly burn
    - Not disclosed
    - unknown
    - Needed for runway and capital-dependency assessment
    - Request monthly cash burn by consolidated and segment view.
  - - Runway months
    - Not disclosed
    - unknown
    - Cannot infer without cash and burn
    - Request 12–24 month liquidity plan.
  - - Planned use of funds
    - Integration / scaling can be inferred, not explicitly budgeted
    - partial
    - Important because EGYM adds tech and operational complexity
    - Request board-approved capital allocation plan.
  - - Debt / project-finance obligations
    - Not disclosed publicly for Playlist
    - unknown
    - Could materially change risk if hardware or lease financing exists
    - Request debt schedule, covenants, leases, and equipment financing.
  notes: The raise de-risks near-term funding optics, but the absence of cash and debt disclosure prevents a clean runway conclusion.
