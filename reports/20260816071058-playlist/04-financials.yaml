callouts:
- calloutType: insight
  title: The real question is revenue mix, not whether revenue exists
  body: Playlist has crossed the threshold where topline existence is no longer in doubt. The unresolved question is which share of that topline behaves like sticky software, like transactional demand intermediation, or like capital-linked technology deployment.
  claimRefs:
  - CI001
  - CI003
  - CI016
  - CI035
- calloutType: risk
  title: A big raise does not substitute for a balance sheet
  body: The 2026 financing is a positive signal, but without cash, debt, and segment margin detail it cannot answer whether the merged business is comfortably funded or simply ambitiously funded.
  claimRefs:
  - CI017
  - CI018
  - CI019
  - CI035
