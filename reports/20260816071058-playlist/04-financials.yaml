- id: capital-adequacy-verdict-and-blockers
  title: Capital Adequacy Verdict and Remaining Blockers
  body: 'The January 2026 raise is large enough to reduce immediate solvency anxiety, but it does not eliminate underwriting uncertainty. A $785 million equity infusion around the EGYM merger suggests a company that wants strategic flexibility for integration, growth, and possibly balance-sheet reinforcement. Yet no reviewed public source provides cash, burn, runway, or debt details for Playlist itself. The best public read is therefore directional: this is a real scaled platform with credible revenue and sponsor backing, but not one whose margin path, hardware burden, or payback profile can be fully proven without private materials. Investors should treat the business as potentially attractive but evidentially incomplete. The crucial next step is not debating whether revenue exists; it is obtaining the segmented statements and cohort economics that reveal what kind of revenue it really is. Until then, even a large headline valuation should be treated with discipline rather than as proof
    of software-grade economics.'
  claimRefs:
  - CI014
  - CI017
