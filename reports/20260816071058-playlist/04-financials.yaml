  - - Software gross margin
    - 'null'
    - low
    - Determines SaaS-like quality of software layers
    - Request gross margin by Mindbody / Booker.
  - - Marketplace take rate / net revenue margin
    - 'null'
    - low
    - Determines whether access revenue is high-quality or pass-through heavy
    - Request gross vs net accounting and partner payout schedule.
  - - Hardware gross margin
    - 'null'
    - low
    - Critical for understanding EGYM capital intensity
    - Request technology segment gross margin and installation economics.
  - - CAC / payback
    - 'null'
    - low
    - Necessary for growth efficiency analysis
    - Request GTM spend by channel and payback by segment.
  - - NRR / GRR / churn
    - 'null'
    - low
    - Determines durability of operator and employer accounts
    - Request cohort retention and expansion by product line.
  notes: Most unit-economics fields remain unavailable publicly; this table is intentionally explicit about nulls and why they matter.
