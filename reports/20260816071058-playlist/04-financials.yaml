  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: segment-p-and-l
    missingEvidence: Revenue, gross margin, and EBITDA by Mindbody, ClassPass, Booker, Wellpass, and EGYM Technology
    whyItMatters: This is the single most important missing input for underwriting quality and valuation method
    diligencePath: Request FY2025 audited segment P&L plus 2026 YTD management accounts
    relatedQuestionRefs:
    - QI007
    - QI025
    relatedTableRefs:
    - TI001
    - TI003
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: Cash balance, debt schedule, lease burden, and runway forecast
    whyItMatters: Without liquidity data, capital adequacy remains qualitative
    diligencePath: Request post-close balance sheet, debt covenant summary, and 24-month cash forecast
    relatedQuestionRefs:
    - QI017
    - QI019
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: take-rate
    missingEvidence: Gross bookings, partner payouts, and net take rate for marketplace and employer-wellness layers
    whyItMatters: The difference between gross demand and net revenue determines margin quality
