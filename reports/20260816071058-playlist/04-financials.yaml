- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue by brand / segment
    - Cannot tell what portion deserves SaaS, marketplace, or hardware multiples
    - Request FY2025 segment revenue and 2026 YTD bridge.
  - - Gross margin by segment
    - Cannot assess earnings quality or capital-lightness
    - Request gross margin by Mindbody, ClassPass, Wellpass, EGYM Technology.
  - - Cash, debt, and runway
    - Cannot judge capital adequacy or refinancing risk
    - Request post-close balance sheet and monthly liquidity forecast.
  - - Retention / expansion metrics
    - Cannot distinguish durable recurring revenue from shallow usage revenue
    - Request NRR, GRR, churn, and cohort contribution by segment.
  - - Take rate / payout economics
    - Cannot tell whether marketplace and employer layers scale attractively
    - Request gross bookings, partner payouts, and net revenue treatment.
  notes: These are the minimum missing metrics that prevent a full underwriting-quality financial conclusion.
