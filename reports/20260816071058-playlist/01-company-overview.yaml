callouts:
- calloutType: insight
  title: Playlist is a roll-up with operating logic, not just a renamed holding company
  body: The reviewed sources show real category adjacency across studio software, consumer demand aggregation, salon/spa operations, smart equipment, and employer wellness. The investment question is whether management can turn those adjacencies into lower churn, better distribution, and cross-sell economics before integration complexity overwhelms the thesis.
  claimRefs:
  - CO002
  - CO028
  - CO032
  - CO033
  - CO036
- calloutType: risk
  title: Governance and segment disclosure still lag the headline scale story
  body: The merger announcement is rich in top-line positioning but poor in cap-table, leverage, margin, and board-process detail. That does not invalidate the deal, but it does mean the company-overview chapter should ground later chapters in facts while refusing to fill in private-company blanks with optimism.
  claimRefs:
  - CO016
  - CO017
  - CO029
