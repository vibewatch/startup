  - FO002
- id: leadership-and-governance
  title: Leadership, Governance, and Control Signals
  body: 'Public leadership disclosure is adequate for top-team identification but thin for governance underwriting. Playlist lists Fritz Lanman as CEO and co-founder and publicly elevates EGYM founder and CEO Philipp Roesch-Schlanderer into the new organization as co-founder and co-chairman. The corporate website also discloses a recognizable C-suite spanning finance, marketing, technology, legal, product, revenue, HR, and international operations. That is enough to ground later chapter references to who runs the company day to day. What remains missing is just as important: Playlist does not publish a full board roster, board-committee structure, or decision rights between founders and sponsor investors. The merger announcement’s explicit statement that Monti Saroya of Vista and Roesch-Schlanderer are co-chairmen indicates concentrated control around Vista and the founder side of the deal, but investors do not yet have a public look-through to voting terms, board independence, or formal
    succession planning. The report should therefore treat leadership depth as real, but governance transparency as incomplete.'
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  tableRefs:
  - TO002
- id: funding-and-corporate-history
  title: Funding History, Corporate Recombination, and Merger Logic
  body: 'The current Playlist story is the result of three major control events. First, Vista acquired MINDBODY in 2019, moving the former public company into private-equity ownership. Second, Mindbody completed its acquisition of ClassPass in October 2021, bringing marketplace demand and corporate wellness distribution under the same umbrella as studio-management software. Third, the January 2026 announced and March 2026 completed EGYM transaction layered smart equipment, AI workout programming, and a larger employer-wellness footprint on top of that base while raising $785 million of fresh equity at a $7.5 billion valuation. The official narrative is that this created the world’s largest full-stack fitness and wellness operating system. That narrative is directionally plausible given the combined asset set. However, a financing-history caution remains: the public materials disclose the headline valuation and investor names, but they do not disclose post-close ownership percentages, preference
    structure, leverage, or segment economics. Those are material omissions for any underwriting model.'
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO023
  - CO024
