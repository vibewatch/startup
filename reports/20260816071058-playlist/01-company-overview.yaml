- id: scale-and-reusable-ground-truth
  title: Scale Metrics and Reusable Ground Truth for Later Chapters
  body: 'The merger-close release provides the clearest ground-truth snapshot for the rest of this diligence run. Management publicly claimed more than 40,000 Mindbody-powered businesses, more than 88,000 ClassPass venues, more than 20,000 EGYM Wellpass employer partners, more than 33,000 EGYM-powered fitness locations, millions of active users across more than 30 countries, and more than 3,000 employees globally. It also stated that Playlist and EGYM generated more than $800 million of 2025 net revenue. These figures establish real scale and justify treating Playlist as a growth-stage platform rather than a venture-scale startup. At the same time, they are only top-line combination metrics. There is no disclosed brand-by-brand revenue split, gross margin by business line, or capital-intensity breakdown between software, marketplace, and hardware activities. The discipline for later chapters is therefore straightforward: reuse these disclosed consolidated metrics consistently, but do not
    infer hidden unit economics or segment contribution without separate evidence.'
