company:
  name: Playlist
chapter:
  number: 1
  title: Company Overview
  summary: Playlist entered August 2026 as a newly consolidated fitness and wellness technology platform combining Mindbody, ClassPass, Booker, and EGYM under one parent, with a January 2026 announced $785 million equity raise and March 2026 close that valued the combined enterprise at $7.5 billion. The combined platform now spans software, consumer booking, salon/spa operations, smart fitness equipment, and corporate wellness; however, the corporate narrative is still merger-fresh and many governance, reporting, and segment-level financial details remain private.
sections:
- id: identity-and-portfolio
  title: Identity, Scope, and Portfolio Construction
  body: 'Playlist should not be analyzed as a music or consumer-media brand. The reviewed 2026 primary materials show that it is a newly launched parent platform bringing together four distinct operating businesses: Mindbody for fitness, wellness, and beauty software; ClassPass for flexible consumer and employer wellness access; Booker for salon and spa back-office operations; and, after March 2026 closing, EGYM for smart fitness equipment, AI-enabled training, and corporate wellness. That mix matters because it changes the investment question from whether one point product can win a category into whether a combined software-plus-demand-plus-hardware stack can create a more defensible operating system for in-person wellness. The strongest company claim is breadth: Playlist says it now touches operators, employers, and end users across more than 30 countries. The main caveat is presentation. Playlist clearly markets the new parent and brand portfolio, but it does not yet provide the same
    level of segment and legal-entity clarity that a public-company-style filing would provide, so the portfolio has to be reconstructed from official pages and transaction releases rather than from consolidated statutory reporting.'
  claimRefs:
  - CO001
  - CO002
  - CO011
  - CO019
  - CO020
  - CO021
  - CO022
  - CO032
  - CO033
  tableRefs:
