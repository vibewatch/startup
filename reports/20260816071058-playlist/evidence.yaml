evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: >-
      Post-close ownership percentages, liquidation preferences, and board rights across Affinity, Vista, management,
      and legacy EGYM holders
    whyItMatters: These terms shape governance, dilution, and price sensitivity but are absent from the reviewed public record
    diligencePath: >-
      Request the post-close cap table, board observer rights, and financing instrument summary from the company or lead
      investors
    relatedQuestionRefs:
      - QO013
  - type: private-evidence-only
    severity: material
    topic: segment-financials
    missingEvidence: Brand-level revenue, gross margin, and profitability by Mindbody, ClassPass, Booker, and EGYM
    whyItMatters: >-
      Without segment detail, it is impossible to determine whether the combined platform is software-like,
      marketplace-like, hardware-like, or some hybrid in earnings quality
    diligencePath: Request FY2025 segment P&L by brand, including revenue recognition policy and gross margin bridge
    relatedQuestionRefs:
      - QO017
  - type: missing-source
    severity: minor
    topic: headquarters
    missingEvidence: >-
      A single public Playlist legal page explicitly naming the consolidated headquarters instead of relying on legacy
      Mindbody address disclosure
    whyItMatters: >-
      The company operates a new parent identity, so later readers will want a parent-level HQ citation rather than a
      legacy-entity inference
    diligencePath: >-
      Check Playlist terms, privacy, and corporate filings for a parent legal address; if unavailable, request
      confirmation from media relations
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Full board roster, committee structure, and any independent directors of Playlist
    whyItMatters: Board composition affects control, conflict handling, and sponsor oversight
    diligencePath: Request a board list or governance presentation from the company or investors
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: integration
    missingEvidence: Public KPI set showing cross-brand integration execution after the EGYM close
    whyItMatters: >-
      The operating-system thesis depends on actual cross-sell, shared data, and workflow connectivity rather than only
      branding
    diligencePath: Track later 2026 or 2027 investor/press updates for disclosed integration milestones or operator case studies
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam-sizing
    missingEvidence: >-
      A management-quality breakout of revenue pools attributable to operator software, consumer marketplace, employer
      wellness, and hardware-enabled services
    whyItMatters: >-
      Without that split, the market analysis can only use broad lenses and cannot translate directly into
      valuation-ready segment TAMs
    diligencePath: Request internal TAM/SAM/SOM framework by business line and geography
    relatedQuestionRefs:
      - QM008
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: roi
    missingEvidence: Verified employer ROI, renewal, and engagement data by cohort
    whyItMatters: Corporate wellness willingness-to-pay depends on measurable retention, productivity, or health-cost outcomes
    diligencePath: Request cohort-level renewal, participation, and outcome data from ClassPass Corporate / Wellpass-style programs
    relatedQuestionRefs:
      - QM016
      - QM022
  - type: missing-source
    severity: material
    topic: operator-economics
    missingEvidence: Independent operator-yield data showing how marketplace demand affects realized pricing and retention
    whyItMatters: Operator adoption can reverse if commissions or discounts compress economics
    diligencePath: Request studio and gym case studies with net yield, repeat rate, and churn impact
    relatedQuestionRefs:
      - QM018
      - QM023
  - type: missing-source
    severity: minor
    topic: geography
    missingEvidence: City-level network-density data for the major ClassPass and employer-wellness markets
    whyItMatters: Local density is central to realized value but public sources only provide global or national scale markers
    diligencePath: Request city-level venue counts, activity density, and utilization heatmaps
