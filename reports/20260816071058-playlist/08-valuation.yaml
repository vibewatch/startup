    {
      "id": "scenarios",
      "title": "Bull, base, and bear scenario logic",
      "body": "The bull case is not simply “the market stays excited.” It requires Playlist to demonstrate that the post-merger combination actually changes revenue quality. In that version of the story, the company uses Mindbody and Booker to own the operator workflow, ClassPass to drive demand, Wellpass to win employer budgets, and EGYM to deepen long-duration B2B relationships through connected hardware and training software. Health, fitness, and wellness demand trends remain supportive, employer-wellness budgets keep expanding, and cross-sell raises both contract stickiness and margin quality. Under those assumptions, the business can argue for a low-double-digit revenue multiple and eventual upside beyond the current mark.\n\nThe base case is narrower and closer to current evidence. It assumes the company is strategically important and genuinely scaled, but still too mixed and too opaque to justify a major re-rating from here. In that case, the present valuation can be defended only as a negotiated private-round price supported by capital access, sector narrative, and post-merger ambition. It is not yet a price that public evidence alone would let an outside investor underwrite with high conviction.\n\nThe bear case does not require revenue collapse. It only requires the blended model to behave more like services, marketplace intermediation, and hardware deployment than like premium software. If margins come in lower than expected, partner economics prove thinner, or integration progress stalls, the multiple can compress quickly toward the public-comp band. That would create meaningful downside from $7.5 billion even if the company keeps growing. The real swing factor is not topline existence. It is whether the merged company produces software-like economics from its unusually broad footprint.",
