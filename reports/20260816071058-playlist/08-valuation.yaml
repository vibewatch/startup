    {
      "id": "pricing-context",
      "title": "Current pricing context and comparable anchors",
      "body": "The cleanest current valuation anchor is the January 2026 announcement: $785 million of new equity alongside the EGYM merger at a $7.5 billion valuation. Against the publicly disclosed floor of more than $800 million of 2025 net revenue, that implies roughly a 9.4x multiple on the floor itself, and only modestly lower if actual revenue sits meaningfully above that headline. That is not impossible for a scaled category leader. It is, however, aggressive for a business whose public model appears meaningfully more mixed than pure vertical SaaS.\n\nPublic comparables reinforce that caution. Planet Fitness, Life Time, and Peloton each represent different ways fitness platforms can blend recurring revenue with physical operations, equipment, or consumer demand volatility. None is a perfect match for Playlist, but all are more transparent than Playlist because they publish annual reports and investor materials. Directionally, they clear at far lower revenue-multiple bands than Playlist’s implied mark. That matters because the current Playlist price is effectively asking investors to underwrite not only real scale, but also a superior quality-of-revenue profile that public evidence has not yet demonstrated.\n\nThe private comp lens helps, but only partially. Wellhub is useful for the employer-wellness slice, and secondary trackers still suggest meaningful investor appetite for scaled wellness-access platforms. Even so, Wellhub is only one slice of Playlist’s stack, and private marks are noisier than public trading comps. The conclusion is not that Playlist is absurdly priced. It is that the company is priced for strategic integration success before public evidence proves the combined business deserves that premium.",
