  - FE002
- id: trust-reliability-and-controls
  title: Trust, Reliability, and Data Controls
  body: Trust signals are real and important because the stack handles bookings, payments, personal identity, location data, and in some cases wellness-linked information. Mindbody publishes status and support surfaces, a privacy policy, and a detailed privacy annex describing processor obligations, security incidents, and cross-border safeguards. App-store privacy disclosures show that both Mindbody and ClassPass collect a meaningful set of identity-linked data categories. These are positive signals because they show the company treats data handling as a formal operating concern. Still, the public record remains incomplete. The reviewed sources do not provide a consolidated security architecture, public uptime history across all brands, or a single trust center covering the merged enterprise. That is enough to clear a basic diligence bar, but not enough to assume seamless or harmonized controls across the entire portfolio. A buyer or investor should therefore view trust maturity as brand-real
    but enterprise-fragmented until the company provides stronger unified evidence.
  claimRefs:
  - CE015
  - CE016
  - CE017
  - CE022
  - CE023
  - CE034
  tableRefs:
  - TE004
  figureRefs:
  - FE003
- id: roadmap-dependencies-and-verdict
  title: Roadmap Signals, Dependencies, and Product Verdict
  body: The strongest public roadmap signals come from hiring and positioning rather than from a transparent release log. Careers listings show active hiring in APIs, partner platforms, cyber security, branded mobile app design, and consumer platform product management. That strongly suggests the merged stack still requires major connective tissue work. The product opportunity is real because the company owns meaningful surfaces at each step of the wellness journey. The product risk is equally real because integrating those surfaces requires shared identity, data, orchestration, and support quality across brands that historically operated independently. In practical diligence terms, the module-level proof is already good enough to believe the product exists and matters. The unresolved question is whether Playlist can turn product adjacency into platform coherence quickly enough for the full-stack thesis to deserve premium valuation treatment. That is why product diligence should focus on
    shipped integration milestones rather than only on inspirational narrative or hiring momentum.
  claimRefs:
  - CE018
  - CE019
  - CE025
  - CE027
  - CE028
  - CE029
  - CE031
  - CE032
  - CE033
