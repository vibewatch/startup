callouts:
- calloutType: insight
  title: The modules are real even if the unified platform is not yet fully proven
  body: The reviewed sources make it easy to believe each product exists, serves a real workflow, and has product depth. The harder question is how quickly those modules become one platform in operational reality.
  claimRefs:
  - CE001
  - CE012
  - CE024
  - CE035
- calloutType: risk
  title: Integration risk is the main technical risk, not product absence
  body: The public record does not suggest a weak product portfolio. It suggests a strong but heterogeneous one that still needs identity, data, API, and support unification to earn full-stack premium status.
  claimRefs:
  - CE025
  - CE026
  - CE031
  - CE035
