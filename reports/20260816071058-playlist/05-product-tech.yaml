- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measured / stated benefit
  - Limitation
  rows:
  - - Run a studio or wellness business
    - Manage schedules, staff, clients, and payments
    - Mindbody / Booker
    - Centralizes booking, payments, and business operations
    - Public sources do not show average implementation time or admin load.
  - - Discover and book a class or appointment
    - Browse local options, compare, reserve, and pay
    - ClassPass / Mindbody consumer app
    - Fast booking with reviews and location discovery
    - Value depends on local supply density and pricing.
  - - Administer employer wellness access
    - Track eligibility and manage member access
    - Wellpass company portal
    - Structured admin workflow and access control
    - Renewal and engagement data are not public.
  - - Onboard a new gym member to connected strength training
    - Capture body setup, calibrate machines, guide first workout
    - EGYM Experience
    - Personalization and automatic progression
    - No public deployment-time or maintenance metrics reviewed.
  notes: Workflow clarity is strongest for day-one product usage and weaker for ongoing economics and performance measurement.
