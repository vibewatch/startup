tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Mindbody core platform
    - Studios, gyms, wellness operators
    - Mature / scaled
    - Back-office depth plus integrations and payments
    - Need exact attach rates and enterprise architecture detail.
  - - Booker spa / salon layer
    - Beauty and spa operators
    - Mature / niche
    - Extends portfolio beyond fitness into appointments-heavy beauty services
    - Need current investment and roadmap visibility.
  - - ClassPass consumer marketplace
    - Consumers and travelers
    - Mature / scaled
    - Discovery, flexibility, reviews, and broad venue access
    - Need net-take-rate and retention economics.
  - - Employer wellness / Wellpass
    - Employers, HR, employees
    - Growing / scaled
    - Employer access plus administration and participation model
    - Need renewal, activation, and local-density evidence.
  - - EGYM connected technology
    - Gyms, operators, members
    - Growing / scaled
    - Smart machines, automatic personalization, guided progression
    - Need deployment economics and hardware support burden.
  notes: The module map identifies product surfaces that are visible in public sources. It is not a claim that all modules already operate on one technical plane.
