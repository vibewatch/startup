  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: platform-unification
    missingEvidence: Architecture documents showing shared identity, data, analytics, billing, and orchestration layers across brands
    whyItMatters: This is the core diligence test for whether Playlist is truly a platform or still a portfolio
    diligencePath: Request architecture review and systems map from product / engineering leadership
    relatedQuestionRefs:
    - QE004
    - QE024
    - QE025
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: security-posture
    missingEvidence: A consolidated trust center, certification matrix, uptime history, and incident-response summary across all major brands
    whyItMatters: Brand-level privacy and support pages are helpful but insufficient for a merged-platform diligence standard
    diligencePath: Request current certifications, uptime SLOs, incident postmortems, and vendor-risk overview
    relatedQuestionRefs:
    - QE011
    - QE023
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: integration-roadmap
    missingEvidence: Concrete integration roadmap showing which user journeys and systems are being unified first
    whyItMatters: Without roadmap specificity it is impossible to tie the operating-system story to dated execution milestones
    diligencePath: Request 12–18 month platform roadmap with shipped versus planned milestones
    relatedQuestionRefs:
    - QE019
    - QE022
    - QE025
    relatedTableRefs:
    - TE005
  - type: missing-source
