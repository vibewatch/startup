  - - Status page / support references
    - Published
    - Reliability communication and support entry points
    - No consolidated uptime performance ledger reviewed.
  - - App-store privacy disclosures
    - Published
    - Mindbody and ClassPass mobile data categories
    - High-level disclosure, not detailed data-flow mapping.
  - - Payments / fraud language
    - Published
    - Official claim of payments protection and fraud detection
    - No public audit or certification matrix in reviewed sources.
  notes: Published controls are meaningful but remain fragmented by brand and document type.
