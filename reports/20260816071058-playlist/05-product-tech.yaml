- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Operator platform
    - Runs bookings, payments, CRM, marketing, reporting
    - Payments, messaging, integrations, support operations
    - Complexity rises with add-ons and partner services.
  - - Consumer marketplace apps
    - Drive discovery, reviews, reservations, and user engagement
    - App stores, location services, partner inventory, payment flows
    - Consumer trust and local supply quality matter heavily.
  - - Employer administration layer
    - Controls eligibility and member access
    - Employer data, admin workflows, support processes
    - Poor data hygiene or access errors can degrade customer trust.
  - - Connected gym-floor technology
    - Delivers machine personalization and workout capture
    - Hardware deployment, sensors, app sync, venue operations
    - Implementation and maintenance burden is higher than pure software.
  - - Partner / API layer
    - Extends platform via integrations and external tooling
    - Platform engineering, APIs, third-party vendors
    - Integration quality is a key hidden dependency.
  notes: This table uses public workflow and hiring evidence to infer the main architecture layers without pretending to reveal an internal systems diagram.
