companyProfile:
  summary: Playlist is the post-merger parent of Mindbody, ClassPass, Booker, and EGYM, combining operator software, consumer demand aggregation, employer wellness access, and connected-fitness technology under one platform story. Public evidence shows the January 2026 announcement of a $785 million equity raise at a $7.5 billion valuation, a March 2026 close, more than $800 million of 2025 net revenue, and a footprint spanning millions of users across more than 30 countries. The strategic case is compelling, but the company still operates with private-company opacity on consolidated margins, retention, and post-close integration quality.
  foundedDate: '2012-01-01'
  foundingLocation: San Luis Obispo, California, USA
  headquarters: San Luis Obispo, CA
  productSummary: Playlist sells business software to fitness, wellness, beauty, salon, and spa operators; consumer booking and subscription access through ClassPass; employer wellness access through ClassPass Corporate and EGYM Wellpass; and connected-fitness hardware and training software through EGYM.
  customerFocus: Fitness, wellness, beauty, and appointment-based operators; consumers seeking flexible wellness access; and employers buying wellness benefits for workforces.
  businessModel: Recurring software fees, payments- and transaction-adjacent monetization, consumer subscription and marketplace economics, employer wellness contracts, and connected-fitness hardware / software packages.
  stage: growth
  fundingStatus: $785M of new equity alongside the January 2026 EGYM merger at a $7.5B valuation; total historic capital is not publicly consolidated.
