  topStrengths:
  - Three-sided platform integrating operator software (Mindbody/Booker), consumer marketplace (ClassPass), employer wellness (EGYM Wellpass), and connected fitness hardware (EGYM).
  - $800M+ net revenue and global scale across 40+ countries with 100M+ sessions.
  - Strong employer wellness tailwind and EGYM’s European B2B foothold provide revenue diversification beyond consumer subscriptions.
  topRisks:
  - Stretched valuation at ~9-10x net revenue with no public margin or profitability evidence.
  - Investor reputational risk from Affinity Partners / Jared Kushner association.
  - Post-merger integration complexity across four brands with different buyer personas and technology stacks.
  - Consumer subscription friction evidenced by ClassPass litigation and complaint patterns.
  unresolvedGaps:
  - Consolidated gross margin and EBITDA not publicly disclosed.
  - Retention and churn rates for ClassPass subscribers, Mindbody venues, and EGYM Wellpass employers.
  - Exact post-merger organizational structure and integration timeline.
  - Partner economics — venue payout rates and ClassPass net revenue per member.
disclaimer: This report is for informational purposes only, is based on public sources as of 2026-08-16, and is not investment advice. Playlist is a private company, and many underwriting-critical metrics remain undisclosed or unaudited, so all valuation and risk conclusions should be independently verified.
