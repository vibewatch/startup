- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / fragility risk
  - Impact
  - Diligence path
  rows:
  - - Multi-location operator expansion
    - Operator economics may weaken if fees outrun perceived value
    - Could reduce upsell and expansion into larger accounts
    - Request cohort expansion and discounting by location count.
  - - Employer account growth
    - A few large employer cohorts could dominate perceived momentum
    - Could hide concentration and renewal risk
    - Request top-10 employer revenue concentration and renewal schedule.
  - - Consumer network growth
    - Local venue quality may not match headline venue counts
    - Could weaken retention in sparse or weak markets
    - Request city-level supply quality and active-venue utilization.
  - - Corporate wellness ROI narrative
    - Engagement may be lower than partner counts imply
    - Could reduce renewals or force subsidy-heavy pricing
    - Request employer participation and health-economics evidence.
  - - Reference-driven sales
    - Named case studies may not represent average customer quality
    - Could overstate land-and-expand potential
    - Request broader customer survey and churn distribution.
  notes: The key risk is that footprint breadth may hide segment fragility if denominators are weak.
