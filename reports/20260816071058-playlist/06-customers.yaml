callouts:
- calloutType: insight
  title: Customer existence is well proven; customer durability is not
  body: The evidence base easily clears the hurdle for real-world adoption. It does not clear the much harder hurdle of segment-by-segment retention and concentration underwriting.
  claimRefs:
  - CU001
  - CU006
  - CU010
  - CU028
  - CU035
- calloutType: risk
  title: ClassPass sentiment is the clearest public customer warning signal
  body: High app ratings coexist with poor Trustpilot sentiment and complaint patterns around cancellation and billing. That tension is exactly why retention diligence cannot rely on top-line popularity alone.
  claimRefs:
  - CU017
  - CU019
  - CU020
  - CU021
