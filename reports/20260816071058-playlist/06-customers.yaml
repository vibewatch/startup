- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Operator businesses
    - 'Buyer: owner/manager; User: staff; Payer: business'
    - Run schedules, bookings, payments, and appointments
    - 40K+ Mindbody-powered businesses
    - Core recurring workflow layer
    - Need revenue per operator and retention by cohort.
  - - Consumers
    - Buyer/user/payer often same person
    - Discover and book classes, salons, spas, and gyms
    - ClassPass app in 2,500+ locations; 88K+ venues
    - Drives marketplace demand and data
    - Need paid active user count and churn.
  - - Employers
    - 'Buyer/payer: HR or benefits; User: employee'
    - Provide wellness-access benefit
    - 20K+ employer partners; peer proof from Wellhub named employers
    - Potentially sticky contract revenue
    - Need renewal, engagement, and ROI by cohort.
  - - Venue / gym partners
    - 'Buyer: operator; User: venue teams'
    - Accept marketplace or employer-driven traffic
    - 88K+ venues and network growth context
    - Supply quality determines end-user value
    - Need partner yield, payout, and churn data.
  - - Beauty / spa customers
    - Buyer/user/payer mixed across direct and operator channels
    - Book services and manage appointments
    - Booker broadens beauty and spa footprint
    - Extends category breadth beyond fitness
    - Need distinct beauty versus fitness adoption data.
  notes: The table separates buyers, users, and payers because those roles do not align across the portfolio.
