- id: durability-satisfaction-and-friction
  title: Durability, Satisfaction, and Customer Friction
  body: The customer-quality picture is not uniformly positive. Mindbody’s consumer app ratings and archived Trustpilot snapshot look comparatively healthy. ClassPass, by contrast, shows stronger tension between usage appeal and support or billing sentiment. The app ratings are high, but archived Trustpilot sentiment is poor and complaints data shows recurring issues around cancellation, rollover, and billing. This does not invalidate the model; many scaled consumer products carry friction. But it does mean app-store popularity should not be mistaken for strong retention or customer love. The split between visible engagement and visible frustration is especially important because recurring-subscription durability depends on how the product behaves when a customer wants flexibility, pause, refund, or resolution rather than simply when they want to book. This is exactly the type of difference that can separate a high-usage consumer product from a high-retention subscription business.
  claimRefs:
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU027
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: concentration-expansion-and-diligence-blockers
  title: Expansion, Concentration, and Diligence Blockers
  body: The main customer diligence blocker is missing denominator and retention data. Public sources show broad footprint, named proofs, and large app surfaces, but they do not show segment-level churn, employer renewal, top-customer concentration, or operator yield. That gap matters because Playlist’s business spans several customer types with very different economics. A large venue count does not guarantee good operator economics. A large app audience does not guarantee good consumer retention. A large employer-partner count does not guarantee engagement or renewal quality. The most important next step is therefore not to debate whether customer adoption is real—it clearly is—but to determine which customer cohorts expand, which remain sticky, and which may look broad while actually being fragile. Without that cohort view, investor confidence should remain moderate even in the presence of impressive footprint statistics. The company may still be very strong, but public evidence today
    is far better at proving market presence than at proving dependable, long-duration customer economics across all segments.
  claimRefs:
  - CU023
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
