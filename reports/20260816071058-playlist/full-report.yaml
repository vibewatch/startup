        title: Exhibits
        blocks:
          - type: callout
            title: The merger premium is the entire debate
            body: >-
              Playlist may deserve a premium if the combined platform behaves like software-plus-distribution rather
              than like a loose holding company with mixed economics. Public evidence has not yet proven that
              distinction.
            calloutType: insight
