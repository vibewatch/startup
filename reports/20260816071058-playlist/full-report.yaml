      - number: '2.3'
        title: Buyers, Users, Payers, and Budget Owners
        blocks:
          - type: paragraph
            body: >-
              Playlist is a multi-buyer business. On the operator-software side, Mindbody and Booker are sold to owners,
              general managers, franchise operators, and operations teams that care about bookings, payments, payroll,
              inventory, and utilization. On the employer side, ClassPass Corporate and Wellpass-like models are sold
              into HR, benefits, people-operations, and total-rewards budgets. On the consumer side, the end user is
              also the buyer unless an employer subsidizes or packages access. This matters for sales motion and
              valuation because adoption friction, payback, and retention look different in each lane. Employer wellness
              must prove workforce engagement and ROI; operator software must prove efficiency and yield; consumer
              memberships must prove density and recurring value. The strength of Playlist’s thesis is that these
              budgets can reinforce one another, but the complexity is that each budget has different owners,
              procurement cycles, and success metrics. That complexity is a feature of the opportunity, but it also
              raises execution costs and slows simple cross-sell assumptions.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM028
              - CM029
