        title: Partner, Customer, and Reputational Risk
        blocks:
          - type: paragraph
            body: >-
              Partner and customer economics sit at the center of the medium-term risk profile. Marketplace and
              employer-wellness models can look strong at scale while still weakening if local network quality, payouts,
              or engagement are poor. Adverse commentary around Wellhub is useful precisely because it shows that scaled
              employer-wellness platforms are not immune to pricing sensitivity or partner churn. ClassPass complaint
              surfaces show how customer-policy friction can turn into trust damage. Separately, the company now also
              carries reputational risk that is partly detached from operating execution, because investor associations
              can shape press and partner perception. None of these risks is necessarily fatal on its own. The danger is
              cumulative transmission: weak economics, complaints, or reputational pressure can all reduce partner
              willingness, customer renewal, or diligence confidence at the same time. A business this broad does not
              need one catastrophic event to disappoint investors; several smaller failures can compound into the same
