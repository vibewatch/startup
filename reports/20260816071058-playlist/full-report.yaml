  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct Peers, Specialists, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              The right competitive frame for Playlist is a layered landscape, not a head-to-head duel. On the
              operator-software side, Mindbody and Booker face specialist vendors that focus more narrowly on boutique
              studios, health clubs, or coaching businesses. On the employer-wellness side, the clearest scaled peer is
              Wellhub. On the consumer side, ClassPass still competes with direct studio memberships, gym chains, and
              alternative multi-venue access products. This matters because the company’s full-stack pitch sounds
              broader than any single rival, but buyers rarely evaluate the whole stack at once. A studio owner compares
              booking, billing, branded app, and onboarding depth. An HR buyer compares partner density, engagement, and
              ROI narratives. A consumer compares variety, convenience, and whether the subscription feels worth it. The
              competitive question is therefore whether Playlist’s breadth creates genuine reinforcement across those
              buying moments or simply exposes the company to more specialist attack surfaces.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP017
              - CP019
