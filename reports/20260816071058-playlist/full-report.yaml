        title: Durability, Satisfaction, and Customer Friction
        blocks:
          - type: paragraph
            body: >-
              The customer-quality picture is not uniformly positive. Mindbody’s consumer app ratings and archived
              Trustpilot snapshot look comparatively healthy. ClassPass, by contrast, shows stronger tension between
              usage appeal and support or billing sentiment. The app ratings are high, but archived Trustpilot sentiment
              is poor and complaints data shows recurring issues around cancellation, rollover, and billing. This does
              not invalidate the model; many scaled consumer products carry friction. But it does mean app-store
              popularity should not be mistaken for strong retention or customer love. The split between visible
              engagement and visible frustration is especially important because recurring-subscription durability
              depends on how the product behaves when a customer wants flexibility, pause, refund, or resolution rather
              than simply when they want to book. This is exactly the type of difference that can separate a high-usage
              consumer product from a high-retention subscription business.
