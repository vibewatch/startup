  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments and Base Shape
        blocks:
          - type: paragraph
            body: >-
              Playlist’s customer base is structurally multi-sided. Mindbody and Booker serve businesses that need
              workflow software. ClassPass serves consumers looking for flexibility and discovery. Employer-wellness
              products serve benefits buyers and employee users at the same time. EGYM-linked experiences introduce
              operators and end members on the gym floor. This means aggregate counts alone can mislead. Forty thousand
              businesses, eighty-eight thousand venues, and twenty thousand employer partners are meaningful proof of
              breadth, but they do not reveal which side of the network is healthiest, most monetizable, or most
              durable. The segment shape matters because each segment has different renewal logic: operators want
              efficiency and yield, consumers want variety and ease, employers want ROI and engagement, and venue
              partners want quality demand rather than just traffic. That diversity is attractive strategically, but it
              also means weak performance in one segment can be masked by stronger surface metrics in another if
              management reports only aggregate network scale.
