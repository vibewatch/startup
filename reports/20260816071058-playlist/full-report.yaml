      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The market backdrop does have real tailwinds. Corporate wellness vendors increasingly position around
              retention, healthcare cost control, personalization, and data-driven engagement. Operator software demand
              benefits from fragmentation, digital booking norms, and the need to fill capacity more efficiently. AI is
              becoming a real commercial driver because both employers and operators want more personalization without
              linearly adding staff. But the constraints are equally important. Public corporate-wellness research flags
              privacy concerns and inconsistent ROI, while peer commentary around Wellhub shows that partner churn,
              pricing sensitivity, and dependence on company-reported metrics remain live risks. The merged Playlist
              thesis adds another constraint: local density. A network product is only as strong as the actual studios,
              salons, gyms, and equipment footprint near the end user. That means broad wellness demand can coexist with
              weak realized monetization in sparse or low-quality local supply pockets.
