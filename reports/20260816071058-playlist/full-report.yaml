            title: Channel conflict is a real competitive vulnerability
            body: >-
              A marketplace can create demand and still make operators nervous if commissions, comparison-shopping, or
              pricing opacity undermine trust. That is a qualitatively different risk from ordinary SaaS competition.
            calloutType: risk
