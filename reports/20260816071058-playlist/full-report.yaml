        title: Exhibits
        blocks:
          - type: callout
            title: The big TAM is true but not directly monetizable
            body: >-
              The wellness economy numbers are large enough to justify strategic ambition, but the company’s actual
              addressable spend is the much narrower zone where operator workflows, venue density, employer budgets, and
              end-user participation intersect.
