  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - What it means
      - Monitoring approach
    rows:
      - - Margin disappointment
        - Gross margin or EBITDA profile lands well below premium-software expectations.
        - The current multiple is too high for the actual business mix.
        - Request brand and channel margin bridge before any term-sheet decision.
      - - Retention weakness
        - Subscriber, venue, or employer churn is materially worse than management narrative implies.
        - Cross-sell and platform-stickiness assumptions are overstated.
        - Review cohort retention, NRR/GRR, and renewal cohorts by product.
      - - Integration stall
        - No credible cross-sell, platform-unification, or synergy evidence twelve months after close.
        - Portfolio breadth is not turning into operating leverage.
        - Track post-close KPI pack, roadmaps, and shared customer penetration.
      - - Capital-structure surprise
        - Debt, preferences, or dilution materially impair common-equity upside.
        - Headline valuation overstates real entry economics.
        - Obtain full cap table, debt schedule, and liquidation waterfall.
      - - Partner-economics stress
        - Venue payouts, employer pricing, or hardware deployment costs squeeze take rate.
        - Revenue mix deserves a lower marketplace or services multiple.
        - Audit partner gross margin and payout ratios by cohort.
      - - Reputational blowback
        - Investor optics or public controversy begin affecting partners, hires, or exit demand.
        - The financing signal becomes a commercial or IPO discount factor.
        - Monitor partner feedback, talent acceptance, and public-market comparability.
    notes: Each trigger translates directly into a price reset, a diligence escalation, or a pass decision.
    claimRefs:
      - CV023
      - CV027
      - CV029
      - CV033
      - CV037
      - CV039
