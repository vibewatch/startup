  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Scope and Module Map
        blocks:
          - type: paragraph
            body: >-
              Playlist’s product stack is best understood as a linked set of operating modules rather than one
              monolithic platform. Mindbody and Booker organize merchant workflows. ClassPass organizes discovery and
              booking demand. Wellpass organizes employer access and member administration. EGYM organizes the physical
              training experience through connected equipment and guided workouts. This modular breadth is the strategic
              reason the company can describe itself as a wellness operating system. It also means investors should
              resist oversimplifying the product as “software” alone. The live product estate spans back-office
              workflows, consumer search and booking, member administration, physical equipment, and data-rich workout
              experiences. That creates upside through adjacency, but it also means the technical burden is closer to
              platform integration than to selling a single high-margin SaaS tool. In diligence terms, that shifts
              attention away from feature existence and toward whether shared services, data standards, and identity
              layers can make the modules feel coherent to customers and operators.
