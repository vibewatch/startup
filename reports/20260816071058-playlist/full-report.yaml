  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, Regulatory, and Privacy Risk
        blocks:
          - type: paragraph
            body: >-
              The clearest public risks sit in the legal and regulatory layer because the company handles recurring
              subscriptions, personal data, and sensitive consumer workflows. Mindbody’s policy documents prove that the
              business processes payment-linked and location-related data and has formal privacy and processor controls.
              That is a positive sign, but it also confirms that the company operates in a risk-heavy zone where
              obligations are not theoretical. On the recurring-subscription side, ClassPass help materials and the
              Blackburn litigation make cancellation, rollover, and credit treatment more than cosmetic customer-service
              questions. They are legal and regulatory questions with direct revenue implications. The FTC’s
              click-to-cancel rule and California privacy frameworks make this even more salient. In other words, the
              public record already contains enough evidence to say that privacy and subscription governance are core
              diligence risks, not side notes. They are exactly the kinds of issues that can change margin structure,
              support burden, and public trust at the same time if handled poorly.
