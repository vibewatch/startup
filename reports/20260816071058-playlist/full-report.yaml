              surfaces also provide strong scale evidence through very large rating counts and broad geographic
              coverage. Taken together, these sources make it hard to argue that Playlist lacks real customers. The
              harder question is how much of that proof translates into retained, profitable, and referenceable customer
              relationships rather than top-of-funnel usage or promotional engagement. In particular, employer-side
              proof remains more category-level than Playlist-specific, which limits how confidently public evidence can
              be turned into renewal assumptions. That asymmetry means investors should separate broad category
