chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Scope, and Portfolio Construction
        blocks:
          - type: paragraph
            body: >-
              Playlist should not be analyzed as a music or consumer-media brand. The reviewed 2026 primary materials
              show that it is a newly launched parent platform bringing together four distinct operating businesses:
              Mindbody for fitness, wellness, and beauty software; ClassPass for flexible consumer and employer wellness
              access; Booker for salon and spa back-office operations; and, after March 2026 closing, EGYM for smart
              fitness equipment, AI-enabled training, and corporate wellness. That mix matters because it changes the
              investment question from whether one point product can win a category into whether a combined
              software-plus-demand-plus-hardware stack can create a more defensible operating system for in-person
              wellness. The strongest company claim is breadth: Playlist says it now touches operators, employers, and
              end users across more than 30 countries. The main caveat is presentation. Playlist clearly markets the new
              parent and brand portfolio, but it does not yet provide the same level of segment and legal-entity clarity
              that a public-company-style filing would provide, so the portfolio has to be reconstructed from official
              pages and transaction releases rather than from consolidated statutory reporting.
