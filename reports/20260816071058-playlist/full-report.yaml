            body: >-
              Aggregate adoption proof is strong, but the quality of proof differs by segment. Mindbody’s DDunc
              Athletics story is a real named operator case showing growth and future expansion ambitions. The
              FeaturedCustomers corpus suggests a large operator reference base for Mindbody and a smaller but still
              notable body of ClassPass references. Wellhub’s employer-side proof is stronger in public than Playlist’s
