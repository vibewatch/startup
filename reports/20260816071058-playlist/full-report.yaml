  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive case starts with scale and scope. Playlist is no longer a single-product software company.
              The January 2026 transaction and March 2026 close combined Mindbody, ClassPass, Booker, and EGYM into one
              platform that now reaches operators, consumers, employers, and connected-fitness environments. Public
              materials support more than $800 million of 2025 net revenue, more than 40,000 Mindbody-powered
              businesses, more than 88,000 ClassPass venues, and more than 20,000 EGYM Wellpass employer partners. That
              is enough scale to take the valuation discussion seriously. It also creates a plausible premium narrative:
              if the combined company can cross-sell supply software, demand aggregation, employer wellness access, and
              hardware-enabled programming, it could become a differentiated fitness operating system rather than just a
              roll-up of adjacent assets.


              The anti-thesis is that the market is being asked to pay a premium multiple before the company proves that
              this combined footprint earns premium economics. The same official materials that disclose scale do not
              disclose consolidated gross margin, EBITDA, net retention, or segment mix. That omission matters because
              Playlist is almost certainly blending software, marketplace, employer-benefit administration, services,
              and hardware economics inside one headline revenue number. A revenue dollar from a sticky software
              workflow should trade differently from a revenue dollar tied to venue incentives, member engagement, or
              hardware deployment.


              That tension defines the chapter. Playlist may deserve a strategic premium if the merged platform behaves
              like a unified operating system with software-like margins and real cross-sell. But on public evidence
              today, the premium remains a hypothesis rather than a proven fact. Investor association risk from Affinity
              Partners and Jared Kushner adds another wrinkle: the company has financing credibility, but some of the
              external attention around the round also introduces avoidable reputational noise.
            claimRefs:
              - CV001
              - CV002
              - CV003
