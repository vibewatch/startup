    title: Final diligence asks table
    columns:
      - Question
      - Why it matters
      - Diligence path
      - Priority
    rows:
      - - What are consolidated gross margin, contribution margin, and EBITDA by brand and revenue stream?
        - This decides whether the current multiple is reasonable or too full.
        - CFO pack with quarterly historical bridge by Mindbody, Booker, ClassPass, Wellpass, and EGYM.
        - Highest
      - - What are retention, churn, NRR/GRR, and renewal rates across consumer, operator, and employer cohorts?
        - Valuation support depends on durable cohorts, not just aggregate scale.
        - Revenue-operations and customer-success cohort files.
        - Highest
      - - What is the post-close cap table, debt load, and preference stack?
        - Common-equity returns can differ materially from headline enterprise value.
        - Legal and financing diligence on the waterfall and leverage package.
        - Highest
      - - What percentage of revenue is software-like versus marketplace-, services-, or hardware-linked?
        - A blended model needs different multiple logic than pure SaaS.
        - Segmented revenue and gross-profit taxonomy.
        - High
      - - What cross-sell and integration KPIs prove the four-brand thesis is working?
        - Without evidence of synergy, the premium is mostly narrative.
        - Board or management KPI pack on shared customers and integrated product use.
        - High
      - - What partner payout and employer contract economics govern take rate and margin durability?
        - These economics determine whether scale produces leverage or hides subsidy.
        - Contract sampling and cohort economics review.
        - High
    notes: >-
      If management cannot answer these requests cleanly, the correct action is to stay in research-more mode or walk
      away.
