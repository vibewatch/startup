      - number: '1.2'
        title: Leadership, Governance, and Control Signals
        blocks:
          - type: paragraph
            body: >-
              Public leadership disclosure is adequate for top-team identification but thin for governance underwriting.
              Playlist lists Fritz Lanman as CEO and co-founder and publicly elevates EGYM founder and CEO Philipp
              Roesch-Schlanderer into the new organization as co-founder and co-chairman. The corporate website also
              discloses a recognizable C-suite spanning finance, marketing, technology, legal, product, revenue, HR, and
              international operations. That is enough to ground later chapter references to who runs the company day to
              day. What remains missing is just as important: Playlist does not publish a full board roster,
              board-committee structure, or decision rights between founders and sponsor investors. The merger
              announcement’s explicit statement that Monti Saroya of Vista and Roesch-Schlanderer are co-chairmen
              indicates concentrated control around Vista and the founder side of the deal, but investors do not yet
              have a public look-through to voting terms, board independence, or formal succession planning. The report
              should therefore treat leadership depth as real, but governance transparency as incomplete.
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
              - CO017
