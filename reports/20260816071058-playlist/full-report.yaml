      - number: '4.2'
        title: Pricing, Monetization Layers, and Revenue Quality
        blocks:
          - type: paragraph
            body: >-
              Mindbody’s public pricing page is revealing because it openly distinguishes among base subscription,
              add-ons, and transaction-linked fees. That is a healthy sign of monetization breadth, but it also means
              headline plan descriptions are only part of actual customer spend. Independent commentary suggests some
              operators perceive those fees as hidden or at least difficult to forecast. ClassPass adds another wrinkle:
              consumer credits are easy to understand at a surface level, but renewal, rollover, cancellation timing,
              and refund limits shape how durable or contentious that revenue feels. On the employer side, monetization
              is even less transparent because contracts are not public and economics depend on engagement, partner
              payouts, and benefit-budget logic. The practical implication is that Playlist likely has multiple
              monetization levers, but outside investors cannot yet cleanly convert public pricing into realized take
              rate or gross margin. That is especially important in a company whose reported scale now spans software,
              partner intermediation, and physical deployment rather than one easily normalized revenue stream.
