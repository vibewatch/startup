      - number: '3.2'
        title: Capability Breadth, Pricing, and Buyer Fit
        blocks:
          - type: paragraph
            body: >-
              The clearest specialist advantage is focus. Glofox and Mariana Tek speak directly to boutique operators.
              Jonas Fitness looks more enterprise and club-oriented. Zen Planner emphasizes member management and
              operator efficiency. Trainerize is built for coaches and hybrid delivery. By contrast, Mindbody carries a
              broad platform story and can do more things, but public comparison material and independent critiques
              repeatedly suggest that buyers do not always reward maximum breadth. They often reward simpler pricing,
              easier setup, clearer support, and product surfaces designed around one operating model. That matters
              because Mindbody pricing is layered through base subscription, add-ons, and transaction-related fees,
              while several rivals market transparent starting points. Even when third-party comparison content is
              biased, it consistently reflects a market reality: specialist vendors can win deals by sounding easier to
              buy, simpler to administer, and less cluttered for the exact use case a customer has in mind.
            claimRefs:
