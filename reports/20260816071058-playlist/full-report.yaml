      - number: '8.4'
        title: Recommendation, confidence, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The public-only recommendation should be research-more. Playlist has crossed the threshold where investors
              must take it seriously: the scale is real, the financing is credible, and the strategic logic is coherent
              enough to justify work. At the same time, too many of the variables that actually determine valuation
              remain private. There is no public consolidated margin bridge, no disclosed retention by brand or channel,
              no clear view into partner payout economics, and no public cap-table or leverage disclosure that would let
              an investor move from enterprise narrative to common-equity underwriting.


              That is why confidence should remain medium and risk high. A stretched multiple is not automatically a bad
              investment if the company can prove quality-of-revenue, operating leverage, and integration discipline.
              But the same lack of transparency that leaves room for upside also leaves room for material downside. The
              investment committee version of this story is simple: strong platform, credible round, incomplete proof.
              That is good enough to keep diligence open, but not good enough to relax entry discipline.


              The next step is therefore evidence, not rhetoric. Management would need to provide gross margin, EBITDA,
              cohort retention, partner concentration, cash-flow profile, and post-close integration metrics before the
              valuation call could move from stretched-but-investable to clearly supported. If that evidence is strong,
              the company can plausibly grow into or beyond the current price. If it is weak, the right move is to
              rerate the opportunity toward the bear/base bands or pass entirely.
            claimRefs:
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
