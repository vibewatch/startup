  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Public Traction
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strong enough to show that Playlist is not a concept-stage roll-up. The business
              disclosed more than $800 million of 2025 net revenue and described itself as strongly profitable. The more
              important nuance is that this is not one revenue engine. Mindbody and Booker monetize operator workflows.
              ClassPass monetizes credits and demand aggregation. ClassPass Corporate and Wellpass monetize employer
              access. EGYM introduces smart-equipment and training infrastructure economics. That means reported net
              revenue may contain very different quality bands inside one headline figure. Some of those streams are
              likely subscription-like and recurring. Others are transaction-linked, usage-linked, or dependent on
              physical deployment. The topline is therefore credible and meaningful, but the lack of segment breakout
              prevents investors from knowing how much of the mix is software-like versus marketplace-like or
              hardware-like. That distinction matters enormously because identical revenue dollars can justify very
              different valuations and financing expectations depending on their gross margin, churn profile, and
              implementation burden.
            claimRefs:
