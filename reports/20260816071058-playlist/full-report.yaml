      - number: '1.3'
        title: Funding History, Corporate Recombination, and Merger Logic
        blocks:
          - type: paragraph
            body: >-
              The current Playlist story is the result of three major control events. First, Vista acquired MINDBODY in
              2019, moving the former public company into private-equity ownership. Second, Mindbody completed its
              acquisition of ClassPass in October 2021, bringing marketplace demand and corporate wellness distribution
              under the same umbrella as studio-management software. Third, the January 2026 announced and March 2026
              completed EGYM transaction layered smart equipment, AI workout programming, and a larger employer-wellness
              footprint on top of that base while raising $785 million of fresh equity at a $7.5 billion valuation. The
              official narrative is that this created the world’s largest full-stack fitness and wellness operating
              system. That narrative is directionally plausible given the combined asset set. However, a
              financing-history caution remains: the public materials disclose the headline valuation and investor
              names, but they do not disclose post-close ownership percentages, preference structure, leverage, or
              segment economics. Those are material omissions for any underwriting model.
