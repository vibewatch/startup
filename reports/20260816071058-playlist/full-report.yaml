      - number: '3.3'
        title: Distribution Power, Switching Costs, and Channel Conflict
        blocks:
          - type: paragraph
            body: >-
              Playlist’s main competitive upside is that it can plausibly connect operator workflows, marketplace
              demand, employer distribution, and equipment experiences in one ecosystem. If those links work, the
              company can defend accounts in ways a single-surface rival cannot. But the same integrated posture
              introduces conflict. Operators may value discovery demand while still worrying that a marketplace lists
              them beside close substitutes. Employers may value network scale while still asking whether local density
              and partner quality are strong enough to drive employee engagement. Switching costs are real in operations
              software because billing, staff workflows, and client history create inertia, yet specialist competitors
              openly market migration support and easier onboarding. That suggests the market is sticky enough to be
              defensible, but not sticky enough to assume incumbents cannot be displaced. The most important
              underwriting distinction is between operational gravity and true lock-in: Playlist clearly has the first,
              but public evidence for the second is still thin. That keeps displacement risk meaningfully alive in
              segments where onboarding and pricing simplicity matter most.
            claimRefs:
              - CP024
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
              - CP033
      - number: '3.4'
        title: Moat Durability and Adverse Competitive Evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse case is not that Playlist has no strengths. It has real scale, a meaningful installed base,
              and unusual scope. The adverse case is that specialists can still beat a broad platform in the moments
              that matter most to buyers: adoption, administration, support, pricing clarity, and perceived alignment.
              Wellhub also shows that even a scaled employer-wellness platform still faces churn, pricing sensitivity,
              and dependence on company-reported success metrics. That is relevant because the merged Playlist thesis
              relies on several network and platform effects that are intuitive but not yet publicly proven. In other
              words, Playlist’s moat may be real, but the public record still shows it more as a strategic possibility
              than as a demonstrated outcome. Until public evidence shows materially lower churn, better yields, or
              stronger cross-sell than specialists can match, moat claims should be treated as promising but not fully
              earned.
            claimRefs:
              - CP018
              - CP033
              - CP034
              - CP035
