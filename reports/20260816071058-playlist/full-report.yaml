            body: >-
              The public record gives unusually clear workflow proof for several parts of the stack. Mindbody describes
              operator-facing booking, payments, reporting, marketing, and support. Booker extends similar logic into
              spa and salon operations. ClassPass app descriptions show discovery, filtering, instant booking, and
              review-led decision support. EGYM’s training flow is even more concrete: onboarding at a fitness hub,
              automatic machine calibration, strength testing, guided execution, and progress tracking into the app
              layer. Wellpass help materials show that employer administrators manage eligibility and access rather than
              simply buying a static subscription. Together these sources support the claim that Playlist is not just a
              portfolio of brands; it is a portfolio of connected workflows. What they do not yet prove is that those
              workflows are deeply unified under one identity, one analytics layer, or one cross-brand customer record.
              That missing proof is central because the investment thesis depends on more than coexistence; it depends
