      - number: '6.4'
        title: Expansion, Concentration, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The main customer diligence blocker is missing denominator and retention data. Public sources show broad
              footprint, named proofs, and large app surfaces, but they do not show segment-level churn, employer
              renewal, top-customer concentration, or operator yield. That gap matters because Playlist’s business spans
              several customer types with very different economics. A large venue count does not guarantee good operator
              economics. A large app audience does not guarantee good consumer retention. A large employer-partner count
              does not guarantee engagement or renewal quality. The most important next step is therefore not to debate
              whether customer adoption is real—it clearly is—but to determine which customer cohorts expand, which
              remain sticky, and which may look broad while actually being fragile. Without that cohort view, investor
              confidence should remain moderate even in the presence of impressive footprint statistics. The company may
              still be very strong, but public evidence today is far better at proving market presence than at proving
              dependable, long-duration customer economics across all segments.
