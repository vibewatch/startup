        title: Exhibits
        blocks:
          - type: callout
            title: Playlist’s competitive edge is scope, but buyers often buy focus
            body: >-
              Playlist’s platform logic is strategically compelling, yet procurement still happens one workflow at a
              time. That is why specialist vendors remain credible threats even if they lack the company’s breadth.
            calloutType: insight
            claimRefs:
