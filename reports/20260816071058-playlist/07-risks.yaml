  figureRefs:
  - FR001
- id: operational-integration-and-service-risks
  title: Operational, Integration, and Service Risk
  body: Operational risk is less concretely litigated in public, but it is still material. Playlist now asks one parent organization to coordinate operator software, consumer booking, employer benefits, and connected fitness hardware. That is a harder execution problem than running a single application or a single consumer marketplace. Status pages and support surfaces are modest positives, yet complaint sources show that support quality can still become part of the risk story. The integration challenge is therefore not abstract. Different products, buyers, and support expectations must be aligned without creating billing errors, workflow breakage, or inconsistent data handling. EGYM and Wellpass add deployment and administration burden on top of already complex software surfaces. The public record does not prove failure here, but it clearly proves the conditions under which failure could become financially meaningful. That is enough to warrant a high-alert integration lens even before any
    visible post-merger incident appears in public reporting.
  claimRefs:
  - CR003
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR026
  - CR027
  - CR028
  tableRefs:
