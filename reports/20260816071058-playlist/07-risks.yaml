- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Subscription-policy litigation
    - Blackburn or similar actions expand materially
    - Adverse class-certification or rule-driven redesign pressure
    - Move stance more negative until economics are re-underwritten.
  - - Privacy / regulatory risk
    - Material complaint, enforcement, or incident emerges
    - Official action or severe incident disclosure
    - Pause underwriting and reassess control maturity.
  - - Partner economics
    - Venue churn or employer renewal weakens materially
    - Meaningful local supply deterioration or renewal slippage
    - Discount network-quality assumptions and valuation.
  - - Integration execution
    - Reliability failures or user confusion rise after integration milestones
    - Repeated support or workflow breakdowns across brands
    - Treat full-stack thesis as impaired.
  - - Reputational pressure
    - Major partner or customer pullback tied to controversy
    - Visible commercial impact from reputational issues
    - Increase required evidence threshold and reduce confidence.
  notes: These triggers are designed to change the investment call quickly if observed.
