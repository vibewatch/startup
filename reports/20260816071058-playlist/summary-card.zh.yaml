  topStrengths:
    - 三边平台把运营商软件（Mindbody/Booker）、消费者市场（ClassPass）、雇主健康福利（EGYM Wellpass）和联网健身硬件（EGYM）整合到一起。
    - 净收入超过 $800M，覆盖 40 多个国家，全球 session 超过 100M。
    - 雇主健康福利的强顺风和 EGYM 在欧洲 B2B 的立足点，让收入不只依赖消费者订阅。
  topRisks:
    - 估值约为净收入的 ~9-10x，明显偏高，且没有公开毛利率或盈利能力证据。
    - Affinity Partners / Jared Kushner 关联带来投资人声誉风险。
    - 合并后需要整合四个品牌，不同买方画像和技术栈会放大复杂度。
    - ClassPass 诉讼和投诉模式显示，消费者订阅存在摩擦。
  unresolvedGaps:
    - 合并口径毛利率和 EBITDA 未公开披露。
    - ClassPass 订阅者、Mindbody 场馆和 EGYM Wellpass 雇主的留存率与流失率。
    - 合并后的具体组织架构和整合时间表。
    - 合作伙伴经济性——场馆分成比例和 ClassPass 单会员净收入。
