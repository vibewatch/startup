callouts:
- calloutType: insight
  title: Playlist’s competitive edge is scope, but buyers often buy focus
  body: Playlist’s platform logic is strategically compelling, yet procurement still happens one workflow at a time. That is why specialist vendors remain credible threats even if they lack the company’s breadth.
  claimRefs:
  - CP019
  - CP020
  - CP026
  - CP035
- calloutType: risk
  title: Channel conflict is a real competitive vulnerability
  body: A marketplace can create demand and still make operators nervous if commissions, comparison-shopping, or pricing opacity undermine trust. That is a qualitatively different risk from ordinary SaaS competition.
  claimRefs:
  - CP024
  - CP033
  - CP034
