    - Specialists win on ease of use and focus
    - high
    - Breadth can become complexity if buyers only need one narrow workflow
    - Request churn and win/loss data by segment.
  - - Marketplace demand
    - Operators perceive channel conflict or poor economics
    - high
    - Distribution value can reverse if commissions or comparison-shopping dominate
    - Request operator yield and retention data for marketplace-linked accounts.
  - - Employer wellness scale
    - Wellhub or other peers retain superior partner density and employer engagement
    - high
    - Employer buyers care about usage and local supply more than portfolio story
    - Request city-level density and employer renewal metrics.
  - - Operational switching costs
    - Rivals neutralize inertia with guided migrations
    - medium
    - Incumbency is weaker if onboarding friction falls
    - Request historical displacement and save rates.
  - - Integration depth
    - Public evidence does not yet prove cross-brand product synergies
    - medium
    - The moat depends on integration outcomes, not just ownership structure
    - Request cross-sell and shared-product KPI disclosure.
  notes: Severity reflects investment relevance, not certainty. Every row points to a measurable diligence request.
