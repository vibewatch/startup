  evidenceGaps:
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: Segmented win/loss and displacement data showing where Playlist wins versus Glofox, Mariana Tek, Zen Planner, Jonas Fitness, Trainerize, and Wellhub
