- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company
  - Published entry price or model
  - Contract structure / notes
  - Included emphasis
  - Pricing risk / implication
  rows:
  - - Mindbody
    - Base subscription per location plus add-ons and transaction-related fees
    - Layered pricing structure; official page does not present one simple public matrix in reviewed text
    - Booking, scheduling, payments, marketing, support, integrations
    - Complexity and add-on fees create comparison friction.
  - - Glofox
    - Starts at $99/month
    - Public starting price, likely upsells by plan
    - Boutique operations and branded app
    - Transparent entry pricing helps smaller operators compare quickly.
  - - Zen Planner
    - $99 / $149 / $249 per month
    - Member-based pricing and month-to-month framing
    - Studio package features and payments workflow
    - Published tiers simplify procurement.
  - - Trainerize
    - $10/month coach entry; studio plans around $275/month
    - Month-to-month with optional add-ons and annual savings
    - Hybrid coaching, programming, payments, branded app
    - Cheaper entry point wins small coaches and hybrid operators.
  - - Wellhub
    - Custom employer contracts
    - Benefit platform economics depend on employer and partner scale
    - Network access, employee engagement, wellbeing ROI
    - Lack of public price lists shifts competition to ROI narrative.
  notes: Published prices are list prices, not realized contract economics. The table is useful for buyer perception and packaging clarity, not for exact margin comparison.
