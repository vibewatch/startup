- id: top-down-and-constrained-sizing
  title: Top-Down Context and Constrained Sizing
  body: 'Top-down context is undeniably large. GWI’s framework places the global wellness economy at $6.8 trillion in 2024 and projects nearly $9.8 trillion by 2029. North America alone is roughly $2.3 trillion in that framework. But this is precisely why investor discipline matters: most of that spending is not directly reachable by Playlist’s current monetization stack. The most relevant narrower estimate is corporate wellness, where Coherent Market Insights places the 2026 market at roughly $68.2 billion globally. On the operator-demand side, the Health & Fitness Association’s 81 million U.S. fitness-facility memberships in 2025 confirm that the downstream activity base remains large and still growing. The right way to use these figures is as stacked lenses. Broad wellness contextualizes cultural demand, corporate wellness describes employer-benefit budget potential, and operator-software plus local network density describe what the company can actually service. A single clean TAM for
    the fully merged company is not publicly supportable today.'
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
  - CM011
