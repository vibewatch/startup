company:
  name: Playlist
chapter:
  number: 2
  title: Market Analysis
  summary: 'Playlist participates in overlapping but adjacent markets rather than one clean SaaS category: operator software for fitness, wellness, and beauty businesses; a consumer and employer wellness-access marketplace; connected fitness hardware; and corporate wellness benefits. The broad wellness economy is enormous, but the underwriteable serviceable market is meaningfully narrower and is constrained by operator margins, employer ROI scrutiny, local supply density, and privacy-sensitive integration work.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, and Substitutes
  body: 'The first discipline for Playlist is refusing the lazy definition that it simply sells into the “wellness market.” The company actually sits across four adjacent layers: operator software for fitness, wellness, beauty, spa, and salon businesses; marketplace demand aggregation for consumers and employers; smart fitness equipment and AI training infrastructure; and corporate wellness program distribution. Those layers touch the same end activities—exercise, self-care, and member management—but they monetize different buyers and workflows. That is why broad wellness numbers are context, not valuation inputs. Included spend is the software and service budget that operators use to run bookings, payments, staffing, and client management; the access and subscription spend that consumers or employers use to activate wellness experiences; and the connected-equipment or employer-platform spend that makes on-site and networked wellness delivery work. Excluded spend should include most wellness
    tourism, supplements, food, and medical-adjacent categories that the company does not directly intermediate. The main substitutes remain manual workflows, single-purpose software, direct memberships, and employer reimbursement programs.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM015
  - CM016
  tableRefs:
  - TM001
  figureRefs:
