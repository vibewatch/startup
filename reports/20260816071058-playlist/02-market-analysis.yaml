    - Positive
    - Current
    - Supports corporate wellness budget resilience
    - Request renewal and utilization data by employer segment.
  - - AI personalization expectations
    - Positive
    - Current to medium term
    - Supports EGYM and merged-platform positioning
    - Request evidence that AI improves conversion or retention.
  - - Operator software fragmentation
    - Positive
    - Current
    - Creates room for bundled workflow tools and cross-sell
    - Map migration win rates by operator size.
  - - Privacy and data-governance scrutiny
    - Negative
    - Current
    - Can limit health-data use and personalization claims
    - Request compliance architecture and data minimization evidence.
  - - Partner churn / pricing sensitivity
    - Negative
    - Current
    - Can weaken local network density and operator economics
    - Request venue retention and payout trend data.
  - - Venue density dependence
    - Negative
    - Current
    - Marketplace value can vary sharply by geography
    - Request city-level coverage and fill-rate data.
  notes: The key constraint is not lack of demand but the difficulty of converting broad demand into durable, local, privacy-compliant, economically healthy platform usage.
