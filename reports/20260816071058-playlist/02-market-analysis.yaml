- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters
  rows:
  - - Operator software
    - Scheduling, payments, CRM, payroll, inventory, reminders, memberships
    - Generic accounting, unrelated ERP, wellness tourism spend
    - Studio / spa / salon / gym operator
    - Mindbody and Booker monetize this directly.
  - - Consumer wellness access
    - Credits, memberships, class discovery, appointment booking
    - Full-price direct memberships not routed through the platform
    - Consumer or employee
    - ClassPass monetizes flexibility and discovery.
  - - Employer wellness benefits
    - Subsidized access, program budgets, engagement analytics
    - Broad medical claims cost not controlled by the vendor
    - HR / benefits / total rewards
    - ClassPass Corporate and Wellpass compete for this budget.
  - - Connected fitness infrastructure
    - Smart equipment, AI training, club-floor digital systems
    - General commercial real estate or unrelated capex
    - Gym operator / corporate wellness provider
    - EGYM expands the stack into equipment and in-person delivery.
  - - Broader wellness economy context
    - Physical activity, beauty, self-care, preventive wellness demand
    - Supplements, wellness tourism, and many medical-adjacent categories
    - Mixed end market
    - Useful context, but not a direct TAM for Playlist.
  notes: Broad wellness context is included only as framing. The underwriteable market is the narrower workflow, access, and employer-benefit spend Playlist can actually intermediate.
