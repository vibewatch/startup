  - id: FE001
    title: 产品架构图
    type: stack
    layout: standard
    summary: 合并后的产品栈横跨运营方系统、消费者应用、雇主访问和联网训练硬件。
    data:
      layers:
        - label: 运营方系统
          detail: 面向运营方的商户工作流系统，负责排班、支付和报表。
          modules:
            - Mindbody 排班
            - Booker 美发沙龙 / 水疗工作流
            - 支付和报表
        - label: 消费者触点
          detail: 消费者直接使用的发现和预订界面。
          modules:
            - ClassPass 移动应用
            - Mindbody 消费者应用
            - 评论和预订流程
        - label: 雇主层
          detail: 面向企业账户的资格、访问和福利参与工具。
          modules:
            - Wellpass 访问模式
            - 公司门户 / 资格管理
            - 福利参与
        - label: 联网训练
          detail: 健身房现场技术，个性化训练并记录进展。
          modules:
            - EGYM 智能器械
            - 力量测试和自动调节
            - 应用内进展跟踪
        - label: 平台连接层
          detail: 共享服务和控制能力，用来打通跨品牌一致性。
          modules:
            - API / 合作伙伴平台
            - 支持 + 状态沟通
            - 隐私 / 数据控制
    claimRefs:
      - CE001
      - CE005
      - CE008
      - CE013
      - CE029
      - CE030
    approximationNotes: null
  - id: FE002
    title: 客户工作流 / 运营流
    type: flow
    layout: standard
    summary: 公开工作流证据显示，运营方、消费者、雇主和会员会在不同环节接触这套产品栈。
    data:
      nodes:
        - id: operator
          label: 运营方设置
          detail: 商户配置服务、日程、支付和员工工作流。
        - id: consumer
          label: 消费者发现
          detail: 用户浏览、筛选、阅读评价，并预订课程或预约。
        - id: employer
          label: 雇主管理
          detail: 福利团队管理资格和访问权限。
        - id: member
          label: 会员训练
          detail: EGYM 引导入门、力量测试和持续训练。
        - id: data
          label: 数据 / 进展层
          detail: 预订、参与和训练进展在多个触点累积。
      edges:
        - from: operator
          to: consumer
          label: 发布库存和可预订时段
        - from: employer
          to: consumer
          label: 可资助或授权访问
        - from: consumer
          to: member
          label: 参与可延伸到线下训练
        - from: member
          to: data
          label: 记录进展和使用情况
        - from: data
          to: operator
          label: 支持重复参与和服务交付
