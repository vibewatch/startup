      - number: '3.2'
        title: 能力宽度、定价与买方匹配
        blocks:
          - type: paragraph
            body: >-
              专业厂商最清晰的优势是聚焦。Glofox 和 Mariana Tek 直接对精品经营者说话。Jonas Fitness 更偏企业和俱乐部。Zen Planner 强调会员管理和经营者效率。Trainerize
              为教练和混合交付而建。相比之下，Mindbody
              承载更宽的平台故事，也能做更多事，但公开对比材料和独立批评反复显示，买方并不总奖励最大宽度。他们常常奖励更简单定价、更容易设置、更清晰支持，以及围绕单一运营模型设计的产品界面。这很关键，因为 Mindbody
              定价分为基础订阅、附加项和交易相关费用，而多家对手会营销透明起步价。即使第三方对比内容有偏向，它仍持续反映一个市场现实：专业供应商能赢单，是因为对客户眼前用例而言，它们听起来更容易购买、更简单管理，也没那么臃肿。
