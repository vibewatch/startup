  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分部与基础形态
        blocks:
          - type: paragraph
            body: >-
              Playlist 的客户基础在结构上是多边的。Mindbody 和 Booker 服务需要工作流软件的企业。ClassPass 服务追求灵活性和发现的消费者。雇主健康福利产品同时服务福利买方和员工用户。EGYM
              连接的体验把经营者和健身房地面上的终端会员带入网络。这意味着只看总量会误导。40,000 家企业、88,000 个场馆和 20,000
              个雇主合作伙伴，是有意义的宽度证明，但它们不揭示网络哪一侧最健康、最能变现、最耐久。分部形态很关键，因为每个分部的续约逻辑不同：经营者要效率和产出，消费者要丰富度和便利，雇主要 ROI
              和参与度，场馆合作伙伴要优质需求而不只是流量。这种多样性在战略上有吸引力，也意味着如果管理层只报告聚合网络规模，一个分部的弱表现可能被另一个分部更强的表层指标掩盖。
