  - id: TV004
    title: 可比估值表
    columns:
      - 公司
      - 类型
      - 估值
      - 收入 / 规模
      - 倍数
      - 备注
    rows:
      - - Playlist
        - 合并后私有平台
        - $7.5B
        - '>$800M 2025 年净收入'
        - 基于披露下限约 9.4x
        - 当前锚点；利润率、留存和资本结构细节仍未公开。
      - - Planet Fitness
        - 上市健身平台
        - 约 $5B 公开市场价值区间
        - $1B+ 收入基础，带有加盟和设备经济性
        - 约 5x 销售额倍数区间
        - 有用的混合型可比公司，但透明度高于 Playlist。
      - - Life Time
        - 重设施型上市运营商
        - 约 $2B 公开市场价值区间
        - 2025 年收入 $2.9B，会员驱动，资本强度更高
        - 约 2x 或更低销售额倍数区间
        - 显示实体健身敞口会如何压低倍数。
      - - Peloton
        - 互联健身 / 消费硬件上市可比公司
        - 约 $1B 公开市场价值区间
        - 相比峰值规模不足，但仍足以检验消费硬件情绪
        - 约 1.5x 销售额倍数区间
        - 硬件和消费端波动主导时，可作为有用的下行情景可比。
      - - Wellhub
        - 私有雇主健康福利细分可比公司
        - 2023 年官方 Series F 估值 $2.4B；2026 年二级市场跟踪约 $4.2B
        - 收入未公开披露
        - n/a
        - 仅有助于判断雇主福利层；私募市场信号质量参差。
    notes: 可比组仅作方向性参考；没有同行完全匹配 Playlist 「软件 + 市场平台 + 雇主福利 + 硬件」的组合。
    enumerationScope:
