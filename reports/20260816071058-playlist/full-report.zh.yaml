      - number: '2.3'
        title: 买方、用户、付款方与预算负责人
        blocks:
          - type: paragraph
            body: >-
              Playlist 是多买方业务。经营者软件一侧，Mindbody 和 Booker 卖给业主、总经理、加盟经营者和运营团队，他们关心预约、支付、薪酬、库存和利用率。雇主一侧，ClassPass Corporate
              和 Wellpass 类模式进入
              HR、福利、人员运营和全面薪酬预算。消费者一侧，除非雇主补贴或打包入口，终端用户也是买方。这影响销售动作和估值，因为每条车道的采用摩擦、回本周期和留存都不同。企业健康福利必须证明员工参与和
              ROI；经营者软件必须证明效率和产出；消费者会员必须证明密度和经常性价值。Playlist
              投资逻辑的强项，是这些预算可能相互强化；复杂之处在于，每类预算的负责人、采购周期和成功指标都不同。这种复杂性是机会的一部分，也会抬高执行成本，拖慢简单交叉销售假设。
