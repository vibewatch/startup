      - number: '3.4'
        title: 护城河耐久性与反向竞争证据
        blocks:
          - type: paragraph
            body: >-
              反向观点不是 Playlist 没有强项。它有真实规模、有意义的已安装客户基础和少见的范围。反向观点是，在买方最在意的时刻——采用、管理、支持、定价清晰度和感知契合——专业厂商仍能击败宽平台。Wellhub
              也说明，即使是规模化雇主健康福利平台，也仍面对流失、价格敏感度和对公司自报成功指标的依赖。这一点重要，因为合并后的 Playlist
              投资逻辑依赖多个直觉上成立、但尚未由公开证据证明的网络和平台效应。换句话说，Playlist
              的护城河可能真实存在，但公开记录里它更像战略可能性，而不是已展示的结果。在公开证据证明其流失显著更低、产出更好或交叉销售强到专业厂商无法匹配之前，护城河主张应被视为有希望但尚未完全挣到。
