chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、范围与组合构建
        blocks:
          - type: paragraph
            body: >-
              不能把 Playlist 当成音乐或消费媒体品牌来分析。所审阅的 2026 年一手材料显示，它是新推出的母平台，整合四块运营业务：Mindbody 做健身、健康生活和美容软件；ClassPass
              做消费者和雇主的灵活健康福利入口；Booker 做美发和水疗后台运营；2026 年 3 月交割后，EGYM 补上智能健身设备、AI
              驱动训练和企业健康福利。这个组合很关键，因为投资问题不再是单点产品能否打赢一个品类，而是软件 + 需求 + 硬件栈能否为线下健康生活拼出更可防守的操作系统。公司最强的主张是宽度：Playlist 称现在触达超过
              30 个国家的经营者、雇主和终端用户。主要限制在披露口径。Playlist
              已清晰营销新母品牌和品牌组合，但还没有给出上市公司式文件会提供的分部和法律实体透明度，因此只能用官方页面和交易新闻稿重建组合，而不是依靠合并法定报告。
