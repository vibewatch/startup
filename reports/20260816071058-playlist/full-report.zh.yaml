              理解 Playlist 产品栈，最好把它看成一组相连的运营模块，而不是一个单体平台。Mindbody 和 Booker 组织商户工作流。ClassPass 组织发现和预约需求。Wellpass
              组织雇主入口和会员管理。EGYM
              通过互联设备和引导训练组织实体训练体验。这种模块宽度是公司把自己描述成健康生活操作系统的战略原因。它也提醒投资者，不要把产品简单等同于「软件」。当前产品版图覆盖后台工作流、消费者搜索和预约、会员管理、实体设备以及数据密集的训练体验。相邻性带来上行，但也意味着技术负担更接近平台整合，而不是销售一个单一高毛利
              SaaS 工具。尽调上，关注点因此从功能是否存在，转向共享服务、数据标准和身份层能否让客户和经营者感觉这些模块是连贯的。
