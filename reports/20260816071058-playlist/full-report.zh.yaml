            body: >-
              并购交割新闻稿给本次尽调提供了最清晰的事实快照。管理层公开称，Mindbody 驱动的企业超过 40,000 家，ClassPass 场馆超过 88,000 个，EGYM Wellpass 雇主合作伙伴超过
              20,000 个，EGYM 驱动的健身地点超过 33,000 个，活跃用户数以百万计、覆盖超过 30 个国家，全球员工超过 3,000 人。公司还称 Playlist 与 EGYM 的 2025 年净收入超过
              $800 million。这些数字证明了真实规模，也支持把 Playlist
              视为成长阶段平台，而不是风险投资阶段创业公司。与此同时，它们只是顶层合并指标。公司没有披露按品牌拆分的收入、按业务线拆分的毛利率，也没有拆分软件、市场平台和硬件活动的资本强度。因此，后续章节要守住一条纪律：一致复用已披露的合并指标，但没有单独证据时，不推断隐藏的单位经济性或分部贡献。
