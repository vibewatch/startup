  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 乐观解读
      - 悲观解读
      - 证据
      - 含义
    rows:
      - - 平台范围
        - 四品牌栈可能长成有防御力的健身 OS。
        - 也可能仍是一组相邻产品，真正整合有限。
        - 官方产品组合页面和并购材料证明业务广度真实，但没有统一口径报告。
        - 溢价可能成立，但尚未被证明。
      - - 收入质量
        - 交叉销售和 B2B 合同可能让收入更经常性、更黏。
        - 表观收入可能掩盖市场、服务和硬件敞口。
        - 公开材料披露了规模，但没有披露利润率结构或留存。
        - 收入质量是核心尽调问题。
      - - 可比公司
        - 没有公开可比公司覆盖「运营方 + 消费者 + 雇主」完整栈。
        - 透明的上市健身可比公司估值倍数都更低。
        - Planet Fitness、Life Time 和 Peloton 的交易倍数都低于 Playlist 隐含区间。
        - 溢价必须靠更好的经济性支撑，不能只靠业务广度。
      - - 雇主健康福利
        - Wellpass 和 EGYM 打开经常性雇主预算入口。
        - 雇主健康福利只是其中一块，竞争可能仍激烈，也可能服务成分偏重。
        - Wellhub 和市场报告支持需求存在，但不能证明 Playlist 特定毛利。
        - 有帮助的上行来源，但不是完整估值答案。
      - - 赞助方 / 观感
        - Affinity 领投融资验证了资本可得性和交易可信度。
        - Kushner 相关曝光增加了本可避免的声誉包袱。
        - 官方融资材料和负面媒体报道分别给出两面。
        - 融资信号是正面的，但外部观感并非中性。
    notes: 这张表围绕可能改变价格敏感判断的证据，框定当前投资争论。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV016
      - CV020
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 收入 / 增长视角
      - 倍数
      - 隐含价值
      - 概率权重
    rows:
      - - 乐观
        - 交叉销售跑通，雇主健康福利放量；即使有硬件敞口，毛利也接近软件。
        - $800M 底线向 $900M-$1.0B 增长，收入组合质量改善。
        - 11x-12x
        - $9.6B-$12.0B
        - 25%
      - - 基准
        - 公司战略上有优势，但业务混合度高、披露不足。
        - $800M-$850M，增长温和，关键证据缺口尚未补上。
        - 8.5x-10x
        - $6.8B-$8.5B
        - 50%
      - - 悲观
        - 整合受阻，或业务模型尽调下来更像服务 / 市场平台 / 硬件。
        - $800M 下限守住，但收入质量不及预期。
        - 6x-7x
        - $4.8B-$5.6B
        - 25%
    notes: 情景区间是按证据加权后的估计，基于已披露的 2025 年净收入下限和方向性倍数区间。
    claimRefs:
