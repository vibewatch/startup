  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接对手、专业厂商与替代品
        blocks:
          - type: paragraph
            body: >-
              Playlist 的正确竞争框架是分层格局，不是正面对决。经营者软件一侧，Mindbody 和 Booker 面对更聚焦于精品工作室、健身俱乐部或教练业务的专业供应商。雇主健康福利一侧，最清晰的规模化同业是
              Wellhub。消费者一侧，ClassPass
              仍与工作室直接会员、连锁健身房和其他多场馆通行产品竞争。这很重要，因为公司的全栈叙事听起来比任何单一对手都宽，但买方很少一次评估整套栈。工作室业主会比较预约、账单、品牌应用和上线深度。HR
              买方会比较合作伙伴密度、参与度和 ROI 叙事。消费者会比较选择丰富度、便利性以及订阅是否值得。竞争问题因此是，Playlist 的宽度能否在这些购买时刻形成真实强化，还是只是让公司暴露在更多专业对手的攻击面前。
