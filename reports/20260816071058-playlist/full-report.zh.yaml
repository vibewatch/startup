              EGYM 和健康福利网络执行，让它不如窄口径 SaaS 公司那样干净地资产轻。Wellhub
              作为更窄的雇主健康福利同业有参考价值，但只对应栈中的一层。这些可比公司不能单独解决估值，却说明为什么关键尽调问题是组合：同一个收入标题，可能因主导经济引擎不同而配得上完全不同的倍数。
