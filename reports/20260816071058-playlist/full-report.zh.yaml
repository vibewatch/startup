      - number: '2.2'
        title: 自上而下背景与约束后规模测算
        blocks:
          - type: paragraph
            body: >-
              自上而下的背景无疑很大。GWI 的框架把 2024 年全球健康生活经济规模放在 $6.8 trillion，并预计到 2029 年接近 $9.8 trillion。在该框架下，仅北美就约为 $2.3
              trillion。但这正是投资纪律重要的原因：其中大部分支出不是 Playlist 当前变现栈可以直接触达的。更相关的窄口径估计是企业健康福利，Coherent Market Insights 估算 2026
              年全球市场约 $68.2 billion。经营者需求一侧，Health & Fitness Association 统计 2025 年美国健身设施会员数为 81
              million，确认下游活动基数仍大且还在增长。正确用法是把这些数字当成层叠镜头：宽泛健康生活解释文化需求，企业健康福利描述雇主福利预算潜力，经营者软件加本地网络密度说明公司实际能服务什么。今天，完全合并后公司的单一干净总可用市场（TAM）还缺乏公开证据支撑。
