  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              公开证据足以说明 Playlist 不是概念阶段的并购整合平台。公司披露 2025 年净收入超过 $800 million，并称自己盈利能力很强。更重要的是，这不是单一收入引擎。Mindbody 和 Booker
              变现经营者工作流。ClassPass 变现积分和需求聚合。ClassPass Corporate 和 Wellpass 变现雇主入口。EGYM
              带来智能设备和训练基础设施经济性。这意味着披露的净收入可能把质量差异很大的收入带装进同一个头部数字。部分收入流可能像订阅、具备经常性；其他则与交易、使用量或物理部署挂钩。因此，营收顶线可信且有意义，但缺少分部拆分，投资者无法判断收入组合中多少像软件、多少像市场平台或硬件。这个区分极其重要，因为同样一美元收入，取决于毛利率、流失曲线和实施负担，可以支撑完全不同的估值和融资预期。
