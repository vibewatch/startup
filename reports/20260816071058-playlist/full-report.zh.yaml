      - number: '8.2'
        title: 当前定价背景与可比锚点
        blocks:
          - type: paragraph
            body: >-
              最干净的当前估值锚点，是 2026 年 1 月公告：在与 EGYM 合并的同时，公司以 $7.5 billion 估值新增 $785 million 股权融资。按公开披露的 2025 年净收入下限超过 $800
              million 计算，这对应下限本身约 9.4x 收入倍数；如果实际收入明显高于该口径，倍数也只会小幅降低。有规模的品类龙头不是不能支撑这种倍数。但对于一个公开模型看起来明显比纯垂直 SaaS
              更混合的业务，这个定价仍然激进。


              上市可比公司进一步提示谨慎。Planet Fitness、Life Time 和 Peloton 分别代表健身平台把经常性收入与线下运营、设备或消费者需求波动混合的不同方式。它们都不是 Playlist
              的完美可比，但都比 Playlist 透明，因为它们发布年报和投资者材料。方向上看，它们的收入倍数区间远低于 Playlist 的隐含估值。关键在于，Playlist
              当前价格实际上要求投资者不只承认真实规模，还要承销一个公开证据尚未证明的更高收入质量。


              私营可比视角有帮助，但只能帮一部分。Wellhub 对雇主健康福利板块有参考价值，二级市场追踪数据仍显示，投资人对有规模的健康福利入口平台有不小兴趣。即便如此，Wellhub 只是 Playlist
              体系中的一块；私营估值也比公开交易可比公司噪音更大。结论不是 Playlist 定价荒谬，而是公司已经按战略整合成功来定价，而公开证据尚未证明合并后业务配得上这份溢价。
            claimRefs:
