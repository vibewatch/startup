  - id: TV001
    title: 推荐摘要表
    columns:
      - 维度
      - 评估
    rows:
      - - 推荐
        - 继续研究，直到可获得私有毛利、留存和股权结构数据。
      - - 估值
        - 在 2025 年净收入 >$800M 的口径下，$7.5B 估值约对应 9-10x；按公开证据看偏高。
      - - 置信度
        - 中，因为规模真实，但收入质量证明还不完整。
      - - 风险评级
        - 高，原因是整合复杂、混合经济性、声誉外溢和盈利能力不透明。
      - - 决策含义
        - 继续尽调；但没有私有数据前，不应把当前估值视为明确有吸引力。
