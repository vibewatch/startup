companyProfile:
  summary: >-
    Playlist 是 Mindbody、ClassPass、Booker 和 EGYM 并购后的母公司，把经营者软件、消费者需求聚合、雇主健康福利入口和互联健身技术包装在同一个平台故事下。公开证据显示，2026 年 1 月公司宣布按
    $7.5 billion 估值融资 $785 million 新股权，并于 2026 年 3 月完成交割；2025 年净收入超过 $800 million，覆盖超过 30
    个国家的数百万用户。战略逻辑有吸引力，但合并口径利润率、留存和交割后整合质量仍困在私有公司不透明里。
