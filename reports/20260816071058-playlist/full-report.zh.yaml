      - number: '8.3'
        title: 乐观、基准与悲观情景逻辑
        blocks:
          - type: paragraph
            body: >-
              乐观情景并不只是「市场热度不退」。它要求 Playlist 证明，合并后的组合确实改变了收入质量。乐观版本里，公司用 Mindbody 和 Booker 把经营方工作流抓在手里，用 ClassPass
              拉动需求，用 Wellpass 拿下雇主预算，再用 EGYM 借助互联硬件和训练软件加深长期 B2B
              关系。健康、健身和健康生活需求趋势继续支撑行业，雇主健康福利预算持续扩张，交叉销售同时提高合同粘性和利润率质量。沿着上述假设，公司可以争取低双位数收入倍数，并在未来获得高于当前估值的上行空间。


              基准情景更窄，也更接近当前证据。它假设公司具备战略重要性且规模真实，但业务仍然过于混合、披露仍然过少，难以支撑从当前水平大幅重估。基准情形下，现有估值只能被解释为一轮谈判出来的私募价格，背后有资本可得性、赛道叙事和并购后雄心支撑。它还不是一个仅凭公开证据就能让外部投资人高信心承销的价格。


              悲观情景不需要收入崩盘。只要混合模型表现得更像服务、市场撮合和硬件部署，而不是高溢价软件，就足够触发压力。如果利润率低于预期、合作伙伴经济性更薄，或整合进展卡住，倍数可能很快压缩到上市可比区间。即便公司继续增长，$7.5
              billion 估值也会面临明显下行。真正的摆动因素不是收入是否存在，而是合并后的公司能否从这张异常宽的版图里榨出软件式经济性。
            claimRefs:
              - CV021
