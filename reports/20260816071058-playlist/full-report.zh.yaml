      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              市场背景确有顺风。企业健康福利供应商越来越围绕留存、医疗成本控制、个性化和数据驱动参与来定位。经营者软件受益于市场碎片化、数字预约习惯，以及更高效填满产能的需求。AI
              正在成为真实商业驱动，因为雇主和经营者都想在不线性增加人员的情况下提供更多个性化。但约束同样重要。公开的企业健康福利研究提示隐私担忧和 ROI 不稳定，围绕 Wellhub
              的同业评论也显示，合作伙伴流失、价格敏感度和对公司自报指标的依赖仍是活风险。合并后的 Playlist
              投资逻辑还增加一项约束：本地密度。网络产品的强弱，取决于终端用户附近真实存在的工作室、美发店、健身房和设备覆盖。因此，宽泛健康生活需求可以与稀疏或低质量本地供给口袋中的弱变现同时存在。
