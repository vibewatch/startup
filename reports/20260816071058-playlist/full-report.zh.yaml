      - number: '8.5'
        title: 图表证据
        blocks:
          - type: callout
            title: 并购溢价是全部争议
            body: 如果合并平台表现得像软件加分发，而不是经济性混杂的松散控股公司，Playlist 可能配得上溢价。公开证据还没有证明它属于前者而非后者。
