  - id: TV005
    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 含义
      - 跟踪方法
    rows:
      - - 利润率不及预期
        - 毛利率或 EBITDA 表现明显低于优质软件公司的预期。
        - 以实际业务组合看，当前倍数过高。
        - 发出条款清单前，要求提供品牌和渠道维度的利润率桥接。
      - - 留存疲软
        - 订阅者、场馆或雇主流失率明显高于管理层叙事暗示。
        - 交叉销售和平台黏性假设过高。
        - 按产品复核队列留存、NRR/GRR 和续约队列。
      - - 整合停滞
        - 交易完成十二个月后，仍看不到可信的交叉销售、平台统一或协同证据。
        - 产品组合宽度没有转化为经营杠杆。
        - 跟踪交割后 KPI 包、路线图和共享客户渗透率。
      - - 资本结构意外
        - 债务、优先权或稀释显著损害普通股上行空间。
        - 表面估值夸大了真实入场经济性。
        - 获取完整股权结构表、债务明细和清算分配瀑布。
      - - 合作伙伴经济性承压
        - 场馆分成、雇主定价或硬件部署成本挤压抽佣率。
        - 收入组合应套用更低的市场平台或服务倍数。
        - 按队列审计合作伙伴毛利率和分成比例。
      - - 声誉反噬
        - 投资人观感或公共争议开始影响合作伙伴、招聘或退出需求。
        - 融资信号变成商业拓展或 IPO 折价因素。
        - 跟踪合作伙伴反馈、人才接受度和公开市场可比性。
    notes: 每个触发因素都会直接导向重新定价、升级尽调或放弃投资。
    claimRefs:
      - CV023
      - CV027
      - CV029
      - CV033
      - CV037
      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 问题
      - 重要性
      - 尽调路径
      - 优先级
    rows:
      - - 按品牌和收入流拆分后，合并毛利率、贡献利润率和 EBITDA 是多少？
        - 用来判断当前倍数是合理还是偏满。
        - CFO 材料包，按 Mindbody、Booker、ClassPass、Wellpass 和 EGYM 提供季度历史桥接。
        - 最高
      - - 消费者、运营商和雇主队列的留存、流失、NRR/GRR 和续约率分别是多少？
        - 估值支撑靠可持续队列，不只靠总规模。
        - 收入运营和客户成功队列文件。
        - 最高
      - - 交割后的股权结构表、债务负担和优先股堆叠是什么？
        - 普通股回报可能与表面企业价值大幅偏离。
        - 对分配瀑布和杠杆方案做法律与融资尽调。
        - 最高
      - - 收入中有多少比例类似软件，又有多少挂钩市场平台、服务或硬件？
        - 混合模型需要不同于纯 SaaS 的倍数逻辑。
        - 分部收入与毛利润分类。
        - 高
      - - 哪些交叉销售和整合 KPI 能证明四品牌逻辑正在跑通？
        - 没有协同证据，溢价主要就是叙事。
        - 董事会或管理层 KPI 材料包，覆盖共享客户和整合产品使用情况。
        - 高
      - - 哪些合作伙伴分成和雇主合同经济性决定抽佣率与利润率韧性？
        - 这些经济性决定规模是在释放杠杆，还是在掩盖补贴。
        - 合同抽样和队列经济性复核。
        - 高
    notes: 如果管理层无法清楚回答这些要求，正确动作就是保持继续研究状态，或直接离场。
    claimRefs:
      - CV032
      - CV035
      - CV036
      - CV038
      - CV040
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 按日期串起私募股权控股、ClassPass 整合和 EGYM 合并如何拼出今天的 Playlist 平台。
    data:
      items:
        - date: '2019-02-15'
          label: Vista 私有化收购
          detail: Vista 完成对 MINDBODY 的收购，形成由财务赞助方持有的基础资产。
          tone: neutral
        - date: '2021-10-15'
          label: 并入 ClassPass
          detail: Mindbody 完成对 ClassPass 的收购，补上消费者市场平台需求。
          tone: positive
        - date: '2025-06-04'
          label: Playlist 品牌露出
          detail: Playlist 新闻室时间线显示，EGYM 交割前公司已开始用母品牌对外讲故事。
          tone: neutral
        - date: '2026-01-15'
          label: 宣布合并
          detail: Playlist 与 EGYM 宣布合并，并以 $7.5B 估值引入 $785M 新股本。
          tone: positive
        - date: '2026-01-15'
          label: 治理重置
          detail: Roesch-Schlanderer 出任联合创始人兼联席董事长，Vista 同时派代表参与。
          tone: warning
        - date: '2026-03-31'
          label: 合并交割
