      - number: '8.4'
        title: 建议、置信度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              基于公开资料，建议应为「继续研究」。Playlist
              已经跨过值得投资人认真研究的门槛：规模真实，融资可信，战略逻辑也足够连贯，值得继续做功课。同时，真正决定估值的变量仍有太多未公开。公开信息没有合并口径毛利率桥、没有按品牌或渠道披露的留存、看不清合作伙伴分成经济性，也没有公开股权结构表或杠杆披露，无法让投资人从企业叙事走到普通股承销。


              因此，信心应保持中等，风险保持高位。如果公司能证明收入质量、经营杠杆和整合纪律，偏高倍数不必然等于坏投资。但同样的不透明度既给上行留了空间，也给实质下行留了空间。给投委会的版本很简单：平台强，融资可信，证据不完整。足以保持尽调开放，不足以放松入场纪律。


              下一步要看证据，而不是叙事。管理层需要先提供毛利率、EBITDA、队列留存、合作伙伴集中度、现金流画像和交割后整合指标，估值判断才可能从「偏高但可投」转向「明确有支撑」。如果证据强，公司有机会长进甚至跑赢当前价格；如果证据弱，正确动作就是把机会重估到悲观
              / 基准区间，或直接放弃。
