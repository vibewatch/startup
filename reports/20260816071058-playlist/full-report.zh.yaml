      - number: '1.3'
        title: 融资历史、公司重组与合并逻辑
        blocks:
          - type: paragraph
            body: >-
              当前 Playlist 故事来自三次重大控制权事件。第一，Vista 于 2019 年收购 MINDBODY，把这家原上市公司纳入私募股权所有。第二，Mindbody 于 2021 年 10 月完成对
              ClassPass 的收购，把市场需求和企业健康福利分销放到工作室管理软件同一伞下。第三，2026 年 1 月宣布、2026 年 3 月完成的 EGYM 交易，在这个基础上叠加智能设备、AI
              训练编程和更大的雇主健康福利覆盖，同时按 $7.5 billion 估值融资 $785 million
              新股权。官方叙事是，这造出了全球最大的全栈健身和健康生活操作系统。结合资产组合看，这个叙事方向上说得通。但融资历史仍留下警示：公开材料披露了标称估值和投资者名称，却没有披露交割后持股比例、优先权结构、杠杆或分部经济性。任何承销模型都不能忽略这些缺口。
