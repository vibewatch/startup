  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              分析 Playlist 的第一条纪律，是拒绝偷懒地把它定义成卖给「健康生活市场」的公司。公司实际横跨四个相邻层：面向健身、健康生活、美容、水疗和美发企业的经营者软件；面向消费者和雇主的市场需求聚合；智能健身设备和
              AI
              训练基础设施；企业健康福利项目分销。这些层触达同样的终端活动——运动、自我护理和会员管理——但变现的买方和工作流不同。因此，宽泛的健康生活数字只能提供背景，不能直接进入估值。可纳入支出包括经营者用于预约、支付、排班和客户管理的软件与服务预算；消费者或雇主用于激活健康生活体验的准入和订阅支出；以及让现场和联网健康生活交付跑起来的互联设备或雇主平台支出。应排除大多数健康旅游、补剂、食品和医疗相邻品类，因为公司并不直接居间。主要替代品仍是手工流程、单一用途软件、直接会员制和雇主报销项目。
