            body: >-
              最清晰的公开风险位于法律和监管层，因为公司处理经常性订阅、个人数据和敏感消费者工作流。Mindbody
              的政策文件证明，业务处理与支付和位置有关的数据，并具备正式隐私和处理者控制。这是正面信号，但也确认公司处在义务并非理论问题的高风险区域。经常性订阅一侧，ClassPass 帮助材料和 Blackburn
              诉讼让取消、结转和积分处理不再只是表面的客服问题，而是带有直接收入影响的法律和监管问题。FTC 的 click-to-cancel
              规则和加州隐私框架让这一点更突出。换句话说，公开记录已经有足够证据说明，隐私和订阅治理是核心尽调风险，不是旁注。处理不好，这类问题会同时改变利润率结构、支持负担和公众信任。
