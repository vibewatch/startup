      - number: '1.2'
        title: 领导层、治理与控制信号
        blocks:
          - type: paragraph
            body: >-
              公开领导层披露足够识别核心团队，但不足以支撑治理尽调。Playlist 列出 Fritz Lanman 为 CEO 兼联合创始人，并公开把 EGYM 创始人兼 CEO Philipp
              Roesch-Schlanderer
              提升为新组织的联合创始人兼联席董事长。公司官网还披露了一套可识别的高管团队，覆盖财务、营销、技术、法务、产品、收入、人力资源和国际运营。用这些信息支撑后续章节关于日常经营责任人的引用已经足够。缺口同样重要：Playlist
              未发布完整董事会名单、董事会委员会结构，也未披露创始人与财务赞助方投资者之间的决策权。并购公告明确称 Vista 的 Monti Saroya 和 Roesch-Schlanderer 为联席董事长，指向
              Vista 与创始人一侧集中控制，但投资者还看不到投票条款、董事会独立性或正式继任规划。因此，本报告应承认领导层深度真实存在，同时把治理透明度视为未完成。
