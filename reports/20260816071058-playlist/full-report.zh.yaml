  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              正向逻辑先看规模和覆盖面。Playlist 已不再是单一产品软件公司。2026 年 1 月的交易和 2026 年 3 月的交割，把 Mindbody、ClassPass、Booker 和 EGYM
              拼进一个平台；平台现在同时触达经营方、消费者、雇主和互联健身场景。公开材料支持几组量级：2025 年净收入超过 $800 million、Mindbody 覆盖企业超过 40,000 家、ClassPass
              场馆超过 88,000 个、EGYM Wellpass 雇主合作伙伴超过 20,000
              家。规模已经足以让估值讨论变得严肃，也给溢价叙事一个合理入口：如果合并后的公司能交叉销售供给侧软件、需求聚合、雇主健康福利入口和硬件驱动课程，就有机会从相邻资产拼盘变成差异化的健身运营系统。


              反向逻辑在于，市场还没看到这组组合资产跑出溢价经济性，就被要求先按溢价倍数买单。同一批披露规模的官方材料，并没有披露合并口径毛利率、EBITDA、净留存率或分部结构。披露缺口很关键，因为 Playlist
              几乎肯定把软件、市场平台、雇主福利管理、服务和硬件经济性混进了同一个收入数字。来自高粘性软件工作流的一美元收入，估值应不同于依赖场馆激励、会员参与或硬件部署的一美元收入。


              本章的核心张力由此而来。如果合并平台像一个统一操作系统那样运转，既有软件式利润率又能真正交叉销售，Playlist
              可能配得上战略溢价。但截至目前，公开证据只能支持「溢价」这一假设，还不能把它证明为事实。Affinity Partners 和 Jared Kushner
              带来的投资人关联风险又加了一层变量：公司融资可信度更强，但围绕本轮融资的一部分外部关注，也带来了本可避免的声誉噪音。
