companyProfile:
  summary: 'CAIT is CATL’s Shanghai-based intelligent-chassis subsidiary, founded in 2021 to commercialize battery-centric skateboard platforms for automakers. The business now centers on the CIIC family and the Bedrock Chassis, which integrate battery, electric drive, thermal management, and chassis controls into a reusable lower-body platform. Public evidence supports a first external financing round of more than RMB 2 billion in October 2025 at a valuation above RMB 10 billion, while also showing that commercialization is still early: CAIT has multiple OEM relationships, a first overseas Togg program targeted for 2027, and a damaged first proof point through Neta’s distress. CAIT therefore looks strategically important to CATL, but still operationally under-disclosed as a standalone company.'
  foundedDate: '2021-01-01'
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: Integrated EV chassis platforms sold B2B to automakers, led by CIIC and the Bedrock Chassis, combining Cell-to-Chassis battery integration, electric drive, thermal management, chassis control, and upper/lower body decoupling.
  customerFocus: Domestic and international EV manufacturers, mobility platforms, and OEM programs seeking faster time-to-market and lower EV platform development complexity.
  businessModel: B2B platform supply and engineering model built around battery-centric chassis architecture, likely combining platform integration, technical services, and program-specific commercialization with CATL ecosystem support.
  stage: Growth-stage private subsidiary
  fundingStatus: First external round closed in October 2025 at over RMB 2 billion raised and valuation above RMB 10 billion; CATL remained controlling shareholder after the round.
