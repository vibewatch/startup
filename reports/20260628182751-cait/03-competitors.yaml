callouts:
- calloutType: risk
  title: CATL battery lock-in is simultaneously a moat and a deal-killer for some OEMs
  body: 'The most structurally important competitive tension in CAIT''s position is not who else
    builds a similar chassis, but whether OEMs will accept permanent CATL battery dependency.
    Huawei HIMA''s reported move to diversify beyond CATL in 2026 is the clearest single data point
    confirming that Chinese OEMs — even sophisticated ones with strong CATL relationships — will
    resist single-supplier lock-in when they reach scale. CAIT''s strongest pitch (best battery
    technology already integrated) is also its highest objection (we will never escape CATL pricing).
    Investors should pressure-test how CAIT responds to the lock-in objection in deal negotiations.'
  claimRefs:
  - CP020
  - CP028
  - CP029

- calloutType: insight
  title: Western peer failures are a competitive gift but a cautionary reference class
  body: 'Canoo''s Chapter 7 bankruptcy and Arrival''s closure leave CAIT as effectively the only
    well-funded B2B integrated EV platform company with active OEM programs globally. This is a
    short-run competitive gift: there is no Western alternative a non-Chinese OEM can use as a
    credible alternative to CAIT. But the failure mode these companies revealed — the difficulty
    of reaching production scale with sufficient OEM patience and capital — is structurally similar
    to the challenge CAIT faces with its Neta impairment and Togg 2027 SOP deadline. CAIT''s
    CATL parent backing addresses capital duration; OEM patience and production readiness remain
    the open variables.'
  claimRefs:
  - CP009
  - CP010
  - CP011
  - CP025

- calloutType: assumption
  title: Competitive differentiation requires CAIT to disclose per-program economics
  body: 'This chapter documents the competitive landscape using public evidence, but the
    assessment of CAIT''s competitive position versus U Power and Tier-1 suppliers depends
    critically on information CAIT has not disclosed: per-program revenue, volume ramp
    milestones, and OEM customer retention terms. Until CAIT discloses at least one
    audited program outcome, the competitive advantage claim rests on product-architecture
    logic and CATL parentage rather than demonstrated commercial superiority.'
  claimRefs:
  - CP036
  - CP039
  - CP040

