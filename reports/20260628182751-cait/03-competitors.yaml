- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Competitive threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - CATL battery chemistry and CTC structural IP integrated into Bedrock platform
    - Direct peer (U Power) offers battery-supplier-agnostic chassis, removing CATL lock-in as a negative for OEM; BYD or Huawei-partnered OEMs use different chemistry
    - High
    - Confirm interoperability terms and whether CAIT chassis can be supplied without CATL cells; assess if this is a structural engineering impossibility or a commercial restriction
  - - OEM adoption lock-in (Bedrock program commit means multi-year CATL supply dependency)
    - Huawei HIMA diversified battery sourcing away from CATL in 2026; similar OEM preference for multi-sourcing will suppress CAIT demand among OEMs with alternatives
    - High
    - Quantify the share of target OEM prospects that have articulated multi-source battery policy; assess whether CAIT can adapt chassis for alternate cell formats
  - - Western direct-peer exits validate China-first go-to-market strategy
    - Exits occurred because of capital duration, OEM trust, and production scaling failures — not because the technology was wrong; same failure modes exist for CAIT if Neta-class customer losses multiply
    - Medium
    - Monitor CAIT''s active program count and customer financial health quarterly; require CAIT to disclose program-level milestones at next financing
  - - Tier-1 suppliers (ZF, Bosch, Magna) lack full integrated battery platform today
    - ZF, Bosch, and Magna are actively expanding EV chassis integration depth; within 3–5 years they may close the gap on system integration without requiring CATL lock-in for OEM customers
    - Medium
    - Track ZF SELECT / Chassis 2.0 product roadmap; monitor Magna EtelligentDrive OEM adoption; assess whether Tier-1 suppliers partner with CATL competitors on integrated platform
  - - CATL parent guarantee provides capital stability and technology depth
    - CATL is itself competing in multiple dimensions (battery market share, direct OEM relationships, HK listing); its strategic priorities could deprioritize CAIT if cell demand is under pressure
    - Medium
    - Confirm CAIT''s IP ownership and independence from parent; assess what happens to Bedrock supply if CATL strategy shifts; verify intercompany transfer pricing terms
  - - Chinese peer funding compression reduces CAIT''s commercial lead time
    - U Power raised hundreds of millions RMB in Dec 2024; if it secures additional rounds or achieves a named passenger-car OEM win, it becomes a direct reference point in CAIT''s deal negotiations
    - Low
    - Track U Power''s OEM wins and funding cadence; assess whether any named CAIT target OEM is evaluating U Power in parallel
  notes: Severity ratings are qualitative assessments based on the evidence-backed competitive
    dynamics identified in this chapter. Moat claims and threats are derived from public sources;
    diligence asks require CAIT commercial disclosure or CATL strategic communications to resolve.
