- id: western-cohort-distress-and-adverse-frame
  title: Western Peer Failures as Structural Adverse Evidence
  body: 'The exits of Canoo and Arrival from the B2B EV platform market are not simply competitive
    landscape events — they are structural evidence about the commercial viability of the standalone
    skateboard platform business model outside of China.

    Canoo filed for Chapter 7 bankruptcy liquidation in the U.S. Bankruptcy Court for the District
    of Delaware on January 17, 2025. The company had once secured delivery contracts with NASA, the
    U.S. Postal Service, and Walmart but never reached meaningful commercial production. Its IP and
    physical assets were sold to WHS Energy Solutions for $4 million — a near-total loss for investors.
    Canoo''s failure reveals the difficulty of funding and scaling an EV platform company in a market
    where major OEMs have their own architectures, and where fleet customers are slow to commit to
    untested third-party platforms.

    Arrival entered UK administration in early 2024, sold its manufacturing assets to Canoo, and
    officially closed by March 2025. Once valued at over $13 billion post-SPAC merger and backed by
    Hyundai, Kia, and BlackRock, Arrival had a flagship order from UPS for electric delivery vans.
    It never delivered at production scale, burning through capital on a "microfactory" manufacturing
    strategy that proved economically unviable. A $13.3 million SPAC fraud settlement was reached in
    2026, further documenting the company''s failure to deliver on its public commitments.

    The CAIT investment thesis must explicitly account for the Canoo/Arrival reference class. The
    failure mode was not product-technical but commercial: OEM trust, customer patience, and capital
    duration all ran out before production volume materialized. CAIT benefits from CATL''s parent
    credibility, which addresses the trust and capital dimensions, but the OEM patience and production
    ramp challenges are structurally similar.'
