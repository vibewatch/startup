      - number: '5.3'
        title: Safety Engineering and Validated Performance Claims
        blocks:
          - type: paragraph
            body: |
              The Bedrock chassis's headline safety claim is that it passed a 120 km/h frontal central pole
              impact test without fire, explosion, or thermal runaway—well beyond the 56 km/h standard
              applied in China's C-NCAP assessment program. CATL quantifies the severity gap: at 120 km/h,
              collision energy is 4.6 times that at 56 km/h, and in a pole impact (contact area 1/6th of a
              full-width frontal), per-unit-area impact pressure is 21 times the C-NCAP reference. CATL
              states the integrated chassis absorbs 85% of vehicle collision energy, versus approximately
              60% for conventional chassis designs.

              Three specific battery-level safety mechanisms underpin the platform. NP (No Propagation)
              technology in each cell prevents thermal runaway from propagating to adjacent cells. A
              high-ductility energy-absorbing insulation film isolates cells under mechanical deformation.
              The high-voltage safety system disconnects the circuit within 0.01 seconds of impact and
              completes residual energy discharge within 0.2 seconds. CATL cells also passed sled impact
              tests at 60 km/h, 90-degree bending tests, and breakthrough sawing tests without fire or
              explosion—all described as industry-first proprietary protocols.

              A critical qualification applies to all of these safety data points: the tests are CATL's
              own proprietary protocols, not submissions to independent third-party certification programs.
              Euro NCAP, UNECE R100 (EV battery safety), and UNECE R155/R156 (cybersecurity) type-approval
              certifications for production vehicles built on the Bedrock platform were not confirmed
              publicly as of the report date. Any European market entry by Togg or other OEM partners will
              require independent type approval under EU Regulation 2018/858, the outcome of which cannot
              be assumed from CATL's internal test results.
