              OEMs, but the adverse evidence is equally important. Neta, the earliest widely publicized CIIC partner,
              fell into acute financial distress and has been associated with halted production, creditor
              restructurings, and suspect sales practices, weakening CAIT's cleanest early proof point. A later Chinese
              report also argues that customer trust, liability allocation, and OEM reluctance to outsource a core
              chassis stack remain structural selling hurdles for third-party skateboard platforms. In other words, CAIT
              looks better than a concept-only mobility startup because it has a real parent, real product, and real
              signed partners, but the public record still leans more heavily on signed collaborations and rollout
              targets than on named, scaled production vehicles already shipping under CAIT economics.
