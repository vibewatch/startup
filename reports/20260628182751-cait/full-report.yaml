  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Classification Framework
        blocks:
          - type: paragraph
            body: >-
              CAIT competes in a market segment that did not meaningfully exist before 2020: outsourced integrated EV
              chassis platforms sold as a B2B unit to OEM customers. Mapping the competitive landscape requires a
              taxonomy distinguishing four classes of alternatives an OEM faces.

              Direct peers are companies that, like CAIT, sell a complete EV platform or skateboard chassis to OEMs as a
              B2B product. In China, the set is active and growing. U Power and PIX Moving are the most publicly
              documented alternatives, with Series B and B1 rounds closed in December 2024 respectively, and explicit
              product launches and OEM-facing go-to-market strategies. In Western markets, the former direct-peer set
              has been effectively eliminated by Chapter 7 bankruptcy and administration proceedings by early 2025:
              Canoo and Arrival, once the most prominent Western skateboard platform companies, are no longer operating.
              REE Automotive, an Israeli commercial-vehicle specialist listed on Nasdaq, remains active but addresses a
              distinct buyer segment — fleet commercial vehicle operators in North America — not passenger-car OEMs in
              China or export markets.

              Adjacent competitors are Tier-1 chassis system suppliers — ZF Friedrichshafen, Bosch, Magna International,
              and Continental — that supply individual or partially integrated chassis components (steering, braking,
              suspension, drive-by-wire electronics) to the same OEM customers. These companies do not sell a complete
              platform with battery integration, but they supply the modular building blocks an OEM can use to assemble
              its own chassis in lieu of outsourcing the whole system. Their scale, certification track record, and
              existing OEM relationships represent a structural advantage CAIT cannot easily replicate. ZF alone claims
              world market leadership in car chassis technology and has active supply programs for NIO and Mercedes-Benz
              by-wire systems.

              Incumbent substitutes are in-house OEM EV platforms. BYD's cell-to-chassis vertical integration and Huawei
              HIMA's full-stack intelligent chassis offering compete for the same OEM mind share that CAIT targets, but
              through a different channel — BYD internalizes everything; Huawei provides technology to OEM partners. The
              status-quo substitute for a new-entrant OEM is procuring components individually from Tier-1 suppliers and
              developing its own integration layer — slower and more expensive but preserving full architectural
              control.
