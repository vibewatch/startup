      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: CATL battery lock-in is simultaneously a moat and a deal-killer for some OEMs
            body: >-
              The most structurally important competitive tension in CAIT's position is not who else builds a similar
              chassis, but whether OEMs will accept permanent CATL battery dependency. Huawei HIMA's reported move to
              diversify beyond CATL in 2026 is the clearest single data point confirming that Chinese OEMs — even
              sophisticated ones with strong CATL relationships — will resist single-supplier lock-in when they reach
              scale. CAIT's strongest pitch (best battery technology already integrated) is also its highest objection
              (we will never escape CATL pricing). Investors should pressure-test how CAIT responds to the lock-in
              objection in deal negotiations.
            calloutType: risk
            claimRefs:
              - CP020
              - CP028
              - CP029
          - type: callout
            title: Western peer failures are a competitive gift but a cautionary reference class
            body: >-
              Canoo's Chapter 7 bankruptcy and Arrival's closure leave CAIT as effectively the only well-funded B2B
              integrated EV platform company with active OEM programs globally. This is a short-run competitive gift:
              there is no Western alternative a non-Chinese OEM can use as a credible alternative to CAIT. But the
              failure mode these companies revealed — the difficulty of reaching production scale with sufficient OEM
              patience and capital — is structurally similar to the challenge CAIT faces with its Neta impairment and
              Togg 2027 SOP deadline. CAIT's CATL parent backing addresses capital duration; OEM patience and production
              readiness remain the open variables.
            calloutType: insight
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP025
          - type: callout
            title: Competitive differentiation requires CAIT to disclose per-program economics
            body: >-
              This chapter documents the competitive landscape using public evidence, but the assessment of CAIT's
              competitive position versus U Power and Tier-1 suppliers depends critically on information CAIT has not
              disclosed: per-program revenue, volume ramp milestones, and OEM customer retention terms. Until CAIT
              discloses at least one audited program outcome, the competitive advantage claim rests on
              product-architecture logic and CATL parentage rather than demonstrated commercial superiority.
            calloutType: assumption
            claimRefs:
              - CP036
              - CP039
              - CP040
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Opacity
        blocks:
          - type: paragraph
            body: >-
              CAIT has published no revenue figure, pricing schedule, per-unit fee, or licensing rate in any primary or
              secondary source reviewed as of June 2026. The absence of disclosure is itself a high-confidence
              observation: this is not a data gap attributable to limited research coverage, but a deliberate posture
              consistent with CAIT still operating as a private subsidiary of a publicly-listed Chinese parent. No
              reviewed source — not CATL's own annual reports, not its Hong Kong prospectus filing, not the October 2025
              financing press releases — contains a CAIT revenue line or program-level contract value.

              The revenue model must therefore be inferred from product positioning and analogues. CATL's official
              materials describe CAIT's commercial arrangement as a "1+1+1" localization model: CATL technology, a
              local-market manufacturing partner, and the OEM brand. The platform is sold not as a discrete hardware
              unit but as a joint-development and technology-licensing arrangement in which the OEM co-develops the
              upper body while CAIT supplies the battery-integrated lower chassis foundation. This structure points to
              at least four potential revenue streams: (a) engineering and customization service fees (NRE charges) paid
              once or over the program development phase; (b) per-milestone program payments tied to homologation and
              production readiness events; (c) possible per-unit platform licensing royalties as vehicles enter
              production; (d) battery content revenues that accrue to CATL upstream rather than to CAIT directly.
              Whether stream (d) is consolidated into CAIT or retained by the parent is unknown and constitutes a
              material transfer-pricing diligence question.

              Publicly disclosed OEM-partnership events — VinFast (2022), Neta (2023), JAC Yiwei (2025), Avatr (2024
              launch), Togg (2026) — confirm that CAIT has signed commercial agreements with at least five named
              counterparties. But none of these announcements contains a contract value, minimum volume commitment, or
              per-platform fee. The Bedrock Chassis debut at IAA Munich 2025 and the Togg announcement in May 2026 are
              framed exclusively in technical and strategic terms, not financial ones. Comparable B2B EV platform
              licensing economics (from industry sources covering Rivian, REE Automotive, and peer Chinese suppliers)
              suggest upfront fees of $5M–$50M per program and per-unit royalties of $500–$3,000 per vehicle at
              early-stage scale, but these are scenario benchmarks, not CAIT-confirmed figures. Any model relying on
              CAIT revenue must treat these inputs as low-confidence estimates pending management disclosure.
