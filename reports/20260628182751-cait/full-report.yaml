      - number: '4.4'
        title: Peer Economics and Comparable Proxies
        blocks:
          - type: paragraph
            body: >-
              Because CAIT has no disclosed financials, the chapter builds cautious operating-economics proxies from
              three analogues: CATL parent margins (upstream supplier floor), Rivian (Western EV platform manufacturer
              at scale), and the failed Western cohort of Canoo and Arrival (capital-duration reference class).

              CATL parent economics provide the most optimistic plausible benchmark. CATL's 2024 full-year gross margin
              was 24.4% on revenue of RMB 362B, with net profit of RMB 50.75B (14.0% net margin) despite a 9.7% revenue
              decline driven by lithium carbonate price deflation. In 2025, CATL rebounded to RMB 423.7B revenue (+17%)
              with net profit of RMB 72.2B (+42%). CATL's Q4 2024 gross margin showed significant accounting-driven
              volatility, falling to 15.04% from 31.17% in Q3 2024, illustrating that reported margins in battery
              businesses can shift sharply with accounting treatment and pricing mechanics. CAIT's gross margin cannot
              be assumed to replicate CATL's 24.4% level: a chassis integrator carries higher fabrication content and
              lower battery-commodity exposure than a pure cell supplier, and the economics at CAIT's early production
              volumes are structurally unfavorable relative to CATL's mature GWh-scale operations.

              Rivian's 2025 full-year results provide the most directly comparable publicly-reported
              platform-manufacturer data point. Rivian achieved gross profit of $144M on $5.4B of revenue (gross margin
              approximately 2.7%) on 42,247 vehicles delivered, requiring $800M in capex. The capex-to-vehicle ratio was
              approximately $19,000 per unit — far above the per-unit platform fee economics CAIT would need to be
              viable. Rivian's operating cash burn dropped 94% year-on-year to approximately $124M in H1 2025,
              demonstrating that scale and operational focus can dramatically improve the cash profile over time, but
              only after significant capital has been deployed.

              Canoo and Arrival represent the capital-duration failure mode. Canoo accumulated over $900M in losses
              between 2022 and mid-2024 before filing Chapter 7 bankruptcy in January 2025, ending with less than
              $50,000 in assets. Arrival reached a $13B+ post-SPAC valuation, secured a UPS delivery van contract, and
              still failed to reach production scale before exhausting capital. Both companies had high-profile
              partnerships and institutional backing; neither had CATL-equivalent parent support. This failure mode
              matters not because CAIT's prospects are equivalent — the parent backstop is a genuine differentiator —
              but because it sets a ceiling on what commercial traction evidence is worth absent verifiable revenue and
              cash data.

              For Chinese platform supplier peers, industry reports from ResearchAndMarkets and TheAutomotiveData
              indicate that from 2023 to early 2025, seven domestic skateboard chassis suppliers raised a combined RMB
              1.6B across 15 funding rounds. CAIT's single October 2025 round of >RMB 2B exceeded the entire sector's
              aggregate capital raise in that period, reflecting the CATL parent credibility premium. Peer gross margin
              guidance from market research sources suggests 5–15% for early-ramp Chinese chassis suppliers and 15–25%
              at volume scale, but these figures are self-reported or analyst estimates and are not audited.
