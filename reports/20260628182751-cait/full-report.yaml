      - number: '8.5'
        title: Recommendation, Exit Readiness, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The overall valuation stance is Fairly Priced With High Uncertainty at the October 2025 transaction price.
              This stance reflects the following chain of evidence: (1) the Series A anchor was set by credible
              institutional investors with access to non-public management information; (2) CATL's financial strength
              and strategic commitment reduce existential risk materially; (3) the comparable set confirms the
              transaction is within the range of defensible valuations for an early-stage, high-optionality,
              parent-backed technology platform in China; and (4) adversarial factors — zero revenue disclosure,
              transfer pricing opacity, Western cohort failures, hype premium risk — preclude labeling the valuation as
              "attractive." The recommendation is Conditional Watchlist: monitor for (a) first OEM program to
              production, (b) any revenue disclosure, and (c) next financing round valuation signal before committing
              capital at or above the October 2025 price.

              Exit readiness is limited. CAIT has not filed for an IPO as of June 2026. Its earliest plausible IPO
              window, following CATL's own dual-listing playbook (Shenzhen A-share primary, Hong Kong secondary), is
              2028–2030. No secondary market liquidity is publicly available. The April 2026 CATL HK equity placement
              ($5 billion raised, 150+ institutional investors, massively oversubscribed) demonstrates that the parent
              ecosystem can mobilize global capital at scale — a supportive signal for CAIT's eventual listing
              environment. However, CAIT's IPO would need to navigate CATL's Pentagon designation context (U.S. bank
              participation constraints) and demonstrate audited standalone financials, which have not been publicly
              disclosed or indicated as forthcoming.

              Conviction is calibrated at medium. On the positive side: CATL is A-rated with CNY 110 billion net cash,
              the investor consortium for the Series A is credible, the Togg partnership represents a genuine
              international milestone, and the Chinese intelligent chassis market has clear structural tailwinds. On the
              negative side: zero revenue disclosure means every scenario remains a projection, the Neta failure
              eliminated the strongest early proof point, and the valuation has no floor other than CATL parent
              willingness to maintain support. The risk rating is High, consistent with the earlier chapters'
              assessment: CAIT has real assets and real parent support, but has not demonstrated the commercial
              conversion that would justify confidence above watchlist positioning.
