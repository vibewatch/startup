  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Product Scope
        blocks:
          - type: paragraph
            body: >-
              CAIT's market is not the entire EV battery industry nor the full automobile supply chain. It is a specific
              and recently emergent B2B segment: outsourced integrated intelligent EV chassis platforms sold to original
              equipment manufacturers. The product — most visibly the CIIC and Bedrock Chassis — bundles battery cells,
              Cell-to-Chassis structural integration, thermal management, suspension, and high-voltage safety
              architecture into a single platform that a vehicle maker can adopt without sourcing and integrating each
              component separately. The value proposition is time-to-market compression and development-cost reduction
              for OEM customers that lack the capital or engineering scale to build a bespoke EV platform from scratch.

              The boundary matters for investment analysis. A market boundary that includes all EV battery supply would
              put CAIT alongside CATL as a battery component maker and would frame a multi-hundred-billion-dollar
              addressable market where CAIT is a subscale participant. A boundary that includes only the structural or
              mechanical chassis sub-assembly would undercount revenue because CAIT charges for the integrated system,
              not just the structure. The correct boundary is the outsourced EV integrated platform product — covering
              development services, platform licensing fees, and battery-chassis hardware supplied as a unit. This
              market sits downstream of raw cell manufacturing and upstream of vehicle body design.

              Status-quo substitutes are the in-house EV platform programs maintained by established OEMs. Volkswagen's
              MEB, Hyundai's E-GMP, and BYD's various proprietary platforms all serve the same OEM need through internal
              engineering investment. The switching cost from in-house to outsourced platform is high for established
              OEMs with sunk engineering capital, but low for new entrants that have not yet committed to an internal
              platform. This creates the clearest near-term addressable population for CAIT: EV startups, export-focused
              OEMs entering new geographies, and legacy OEMs exploring secondary model lines where the ROI of a
              proprietary platform is insufficient.
