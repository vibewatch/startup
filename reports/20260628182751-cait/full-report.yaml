        - label: Revenue disclosure showing >RMB500M NRE plus royalties
          value: 6000
        - label: A+H IPO announcement with STIB / HKEX filing
          value: 4000
        - label: Pentagon designation scope expansion (CAIT-specific impact)
          value: -3000
        - label: Next financing round clears at flat or down valuation
          value: -4000
        - label: Repeat OEM partner failure (Neta-type event)
          value: -5000
  - id: FV003
    title: Valuation / Return Range — Bull / Base / Bear Scenarios (USD equivalent, 2028–2030 exit)
    type: range
    layout: standard
    summary: >-
      Implied CAIT enterprise value range across three scenarios at a 2028–2030 exit horizon. All figures are scenario
      constructs based on comparable multiples and OEM pipeline assumptions; none is a DCF output or management
      guidance.
    approximationNotes: >-
      USD equivalents converted at RMB 7.1/USD. Range bars represent the spread of outcomes within each scenario rather
      than a confidence interval. October 2025 transaction price ($1.4B) shown as the reference mid-point. Actual exit
      value will depend heavily on revenue disclosure, OEM program confirmation, and CATL parent capital-market
      conditions.
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
    data:
      items:
        - label: Bear case (RMB 5–8B; down-round or distress recapitalisation)
          low: 700
          high: 1100
          unit: USD M
          detail: >-
            Assumes no new OEM beyond Togg by end-2027; revenue disappoints; next round at flat/down. Driven by
            Neta-type counterparty failure or CATL geopolitical escalation. Implies 30–50% loss from October 2025 entry
            at ~$1.4B.
        - label: Base case (RMB 12–20B; dual-listing 2029–2030 at modest premium to Series A)
          low: 1700
          high: 2800
          unit: USD M
          detail: >-
            Assumes Togg production confirmed and one additional OEM program. Selective revenue disclosure. CATL parent
            continues to backstop capital. 20–100% nominal return from October 2025 entry over 4–5 years.
        - label: Bull case (RMB 30–50B; IPO at Mobileye-equivalent multiple after 3+ programs)
          low: 4200
          high: 7000
          unit: USD M
          detail: >-
            Assumes >RMB1B revenue disclosed by 2028; 3+ OEM programs confirmed; A+H listing at 3–5x forward revenue.
            Requires no major geopolitical or OEM conversion setback. 3–5x return from October 2025 entry.
        - label: October 2025 transaction anchor (reference)
          low: 1380
          high: 1400
          unit: USD M
          detail: >-
            Post-money from October 2025 Series A: >RMB 10B (~$1.38–1.40B at RMB 7.1/USD). Pre-money approximately RMB
            9B. High-confidence public anchor from multiple independent media sources.
