      - number: '2.2'
        title: 'Market Sizing: Multiple Lenses with Explicit Uncertainty'
        blocks:
          - type: paragraph
            body: >-
              Sizing the CAIT addressable market requires several lenses because no single published figure tracks the
              B2B integrated intelligent chassis segment precisely. Three external data anchors are available, and each
              represents a different scope.

              Lens 1 — Global EV production context. The IEA Global EV Outlook 2026 forecasts 23 million passenger EV
              sales globally in 2026, roughly 30% of new car sales. BNEF puts the same year at 23 million units,
              representing 27% of global passenger car sales. China remains the dominant production base, with CAAM
              projecting 19 million NEV sales in China for 2026 — a 15.2% year-on-year increase from the 16.49 million
              recorded in 2025. These figures establish the outer envelope of vehicle production into which any platform
              supplier could sell. If average platform content per vehicle were $500–$2,000, the global production
              envelope implies a theoretical ceiling of $11.5B–$46B annually at full penetration, but real platform
              outsourcing penetration is far below that and not separately reported.

              Lens 2 — EV skateboard chassis market. MarkWide Research sizes the global electric vehicle skateboard
              chassis market at $4.7 billion in 2026, forecasting growth to $21.82 billion by 2035 at an 18.6% CAGR. A
              broader competing estimate from Market Growth Reports places the same global market at approximately $11.7
              billion for 2026 at a similar CAGR range of 18.6–22.7%. The divergence between $4.7B and $11.7B reflects
              definitional differences: the narrower estimate covers standalone skateboard platform products, while the
              broader estimate likely includes adjacent drivetrain and integration services. Both are third-party market
              research estimates, not independently audited, and should be treated as order-of-magnitude anchors rather
              than precise figures. DIR Market Research independently notes over 45 automotive OEMs and more than 120
              EV-focused startups are currently investing in flexible chassis frameworks, pointing to a large pipeline
              of potential buyers.

              Lens 3 — Integrated battery technology market. PW Consulting / pmarketresearch.com sizes the global
              integrated battery technology market (spanning CTP, CTB, CTC, CTV) at $78.24 billion in 2025, rising to an
              estimated $102.69 billion in 2026 at a CAGR of 25.13%. This is a much broader market that includes
              passenger EV battery packs generally, not just outsourced chassis platforms. It overstates CAIT's
              addressable market by capturing battery integration at all tiers of the supply chain.

              Contradictory framing — CATL trillion-yuan claim. Media reporting around CAIT's financing round has
              referenced a trillion-yuan addressable market framing attributed to CATL executives. This framing does not
              have a published methodology in the public record as of the 2026-06-28 run date. It appears to correspond
              to the combined global spend on EV development, battery supply, and chassis manufacturing rather than the
              narrower outsourced platform segment. Preserving the claim accurately: it is a promotional market sizing
              that inflates the addressable universe by collapsing the distinction between CAIT's B2B niche and broader
              upstream EV supply chains. Investment analysis should use the narrow $4.7B–$12B 2026 estimate as the
              evidence-constrained TAM and treat the trillion-yuan framing as aspirational context only.

              SAM and SOM cannot be cleanly isolated. CAIT's serviceable addressable market depends on how many OEM
              programs in China and overseas are willing to outsource their platform development in the near term, what
              the per-program commercial value is, and how many CAIT can simultaneously support. None of these inputs
              are publicly disclosed. Five publicly confirmed OEM partnerships (VinFast, Neta, JAC Yiwei, Avatr, Togg)
              suggest a single-digit program count and a revenue scale that, based on announced financing needs, is
              likely in the low hundreds of millions of RMB range — consistent with a sub-$100M annual revenue profile
              in the near term.
