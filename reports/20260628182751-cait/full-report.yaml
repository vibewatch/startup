      - number: '8.4'
        title: Adverse Valuation Arguments and Structural Risk Factors
        blocks:
          - type: paragraph
            body: >-
              Several structural factors argue against accepting the October 2025 transaction at face value as an
              investable entry point. These arguments are not certainties, but they represent unresolved diligence gaps
              that should change the price any new investor is willing to pay.

              Limited disclosure is the most pervasive adverse factor. CAIT has not publicly disclosed a single revenue
              figure, gross margin, or forward contract value. Institutional investors who participated in the October
              2025 round likely received management presentations and diligence access not available to the public —
              meaning the disclosed valuation may reflect private information that cannot be independently verified. Any
              new investor entering at or above the Series A price is relying on a transaction price set under
              non-public disclosure conditions. This information asymmetry is a standard feature of pre-IPO investing
              but is particularly acute for CAIT given the opacity of its intercompany relationship with CATL.

              Transfer pricing opacity creates a structural valuation risk. CATL supplies batteries — CAIT's largest
              cost component — to CAIT as a 70.6% parent owner. Whether that supply is at arm's-length market rates,
              concessional group pricing, or cost-plus arrangements has a direct bearing on CAIT's standalone gross
              margin and therefore its economic quality. No public disclosure addresses this. If CAIT's margins are
              artificially supported by below-market battery supply from CATL, the standalone business would be
              significantly less attractive than the consolidated economics imply.

              The hype premium risk is real and observable across the sector. TMTPost's 2024–2025 coverage of CATL's
              first revenue shortfall noted that even the parent's dominant market position did not protect it from
              investor sentiment shifts when growth slowed. For CAIT, which operates entirely on expectations with no
              revenue anchor, hype-premium compression in the broader Chinese EV supply chain narrative represents a
              meaningful valuation risk. CATL's own shares were flagged as potentially overvalued by Morningstar
              analysis in October 2025 when trading above their fair value estimate. A parent-level sentiment correction
              would likely cascade into CAIT's pre-IPO marks.

              The Western skateboard chassis failure precedent is the strongest adverse analogue. Canoo filed for
              Chapter 7 bankruptcy in January 2025 having raised more than $900 million. Arrival closed in March 2025
              having raised over $900 million. Both companies had secured OEM expressions of interest, branded platform
              launches, and multi-year commercialization narratives. The structural failure modes — slow OEM conversion
              pace, capital intensity outrunning revenue conversion, OEM preference for internal control — are not
              geographically specific and are observable in CAIT's commercial pipeline. CATL's balance sheet eliminates
              the capital duration failure mode, but does not resolve the OEM conversion risk.

              The Neta partner failure demonstrated that even the closest CAIT commercial relationships carry acute
              counterparty risk. Neta fell into bankruptcy proceedings in 2025–2026, eliminating CAIT's earliest and
              most publicly cited commercial showcase. The program's failure means CAIT cannot point to a single
              successfully scaled revenue-generating customer as of June 2026. Each future OEM program carries the same
              structural counterparty risk that materialized with Neta, and the automotive sector's ongoing
              consolidation in China makes this risk non-trivial.

              Partner and platform lock-in risks reduce competitive durability of the valuation. OEMs that adopt Bedrock
              Chassis outsource a core platform decision to CAIT, creating legitimate strategic concerns about
              dependency that Chinese business media and analyst reports have flagged as a structural barrier to
              adoption. The larger the platform premium CAIT charges, the more OEMs are incentivized to develop
              competing internal capabilities or support alternative suppliers. This competitive dynamic creates a
              ceiling on how far the valuation can scale without demonstrable commercial lock-in evidence.
