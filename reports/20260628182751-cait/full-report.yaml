          subsidized and standalone quality is lower than consolidated economics suggest
        - >-
          Request related-party transaction policy from CAIT management; verify against CATL public filings'
          related-party disclosure section
      - - OEM contract terms and structure
        - >-
          No contract value, minimum volume, milestone payment schedule, or per-unit fee for any OEM program has been
