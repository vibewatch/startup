      - number: '3.3'
        title: Adjacent Tier-1 Suppliers and Incumbent OEM Platforms
        blocks:
          - type: paragraph
            body: >-
              The most credible near-term competitive pressure on CAIT's value proposition comes not from peer
              skateboard platform companies but from established Tier-1 automotive suppliers that are deepening their EV
              chassis integration capabilities. ZF Friedrichshafen describes itself as the world market leader in car
              chassis technology and presented its SELECT platform and Chassis 2.0 architecture at IAA Mobility 2025,
              offering steer-by-wire, brake-by-wire, and real-time vehicle health monitoring as an integrated chassis
              domain. ZF has secured series production contracts with NIO for the ET9 launch and with Mercedes-Benz
              starting in 2026. Bosch and Continental are both expanding their intelligent chassis control module (ICCM)
              product families, targeting the drive-by-wire systems that EV platforms require. Markets and Markets
              identifies Bosch and Continental as leading players in the global drive-by-wire market. Magna
              International offers its EtelligentDrive platform — scalable from 40 to 350kW and compatible with 400V to
              800V architectures — as a complete electric powertrain package for OEM partners, and has supplied
              Mercedes-Benz with its eDS Duo for the all-electric off-roader.

              The critical distinction between Tier-1 suppliers and CAIT is scope. Bosch, ZF, and Magna supply
              components and subsystems that an OEM assembles into its own platform; they do not provide a complete
              integrated chassis with battery cells pre-installed that an OEM can adopt without additional structural
              engineering. This is CAIT's primary differentiator — but it also means CAIT faces a build-vs-buy
              comparison in which the OEM can replicate most of CAIT's capability by combining best-in-class Tier-1
              components if it has the engineering resources to do so.

              On the domestic Chinese incumbent side, Huawei HIMA is the most important competitive dynamic. Huawei
              partners with Seres, Chery, BAIC, JAC, and SAIC to provide full-stack intelligent chassis, ADAS, HarmonyOS
              cockpit, and 5G connectivity as a platform that competes directly for the same OEM engineering budget and
              brand differentiation spend that CAIT is targeting. In 2026, Huawei reportedly diversified its battery
              supply away from exclusive CATL sourcing — a concrete illustration of the OEM instinct to avoid
              single-supplier dependence that also constrains CAIT's demand generation.
