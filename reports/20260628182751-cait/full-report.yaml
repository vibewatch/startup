      - number: '1.4'
        title: Commercial Ecosystem and Adverse Frame
        blocks:
          - type: paragraph
            body: >-
              The partnership timeline shows why CAIT deserves attention but not yet a mature-platform valuation
              premium. Public milestones begin with VinFast in 2022, Neta in 2023, the Neta S-based first-model
              narrative in 2024, JAC Yiwei in early 2025, Avatr at the Bedrock launch, and Togg in 2026 as the first
