      - number: '5.5'
        title: Trust, Compliance, and Technical Risk Assessment
        blocks:
          - type: paragraph
            body: |
              The Bedrock chassis's deep CTC structural integration creates meaningful lifecycle and
              repairability risks that distinguish it from conventional EV platforms. Battery cells that
              serve as load-bearing structural elements cannot be individually replaced in a standard
              workshop: any collision that deforms the chassis-battery assembly may require wholesale
              chassis replacement rather than a modular pack swap. Insurance markets have previously
              flagged structural battery integration as a driver of higher total-loss rates on EVs; Tesla's
              structural battery Model Y packs generated precedent cases of write-offs after moderate
              collisions. CTC architectures amplify this risk because the integration is more complete
              than CTB (Cell-to-Body) designs.

              OEM adoption concerns are documented. An unnamed technical executive at an automaker cited
              in Caixin media (reproduced in iChongqing) stated: "The prevailing view in the industry is
              that the chassis represents the 'soul' of a vehicle, and automakers are reluctant to cede
              control." CAIT's early platform adopters (AVATR, Neta) have equity relationships with CATL,
              which reduces their independence as market-validation proof. Changan Mazda marks the first
              CIIC collaboration with an OEM lacking a prior CATL equity tie. The ride, handling, and NVH
              baseline being set by CATL limits brand differentiation for OEM adopters at the chassis layer.

              European deployment readiness is incomplete. Bedrock-based vehicles require EU type approval
              under Regulation 2018/858 and compliance with UNECE R155/R156 cybersecurity requirements
              before European sales. CATL's patent portfolio covers CTC structural integration and battery
              safety mechanisms (per PatSnap analysis indicating thousands of active filings), but specific
              Bedrock chassis IP defensibility and licensing terms are undisclosed. Service network
              infrastructure for CTC-based vehicles requires specialized tooling and training that is still
              developing globally outside China, creating additional lead time for European deployment.
            claimRefs:
