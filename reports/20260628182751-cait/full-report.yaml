        title: Identity, Parent Context, and Current Stage
        blocks:
          - type: paragraph
            body: >-
              The open-source record is strong enough to pin down CAIT's identity more precisely than the user brief.
              Multiple 2025 financing reports and CATL's own 2026 Togg announcement identify the operating entity as
              Contemporary Amperex Intelligent Technology (Shanghai) Limited, with the Chinese legal name
              宁德时代（上海）智能科技有限公司, not the shorter colloquial label in the prompt. Chinese media and financing coverage
              consistently say the company was founded in 2021 in Shanghai as CATL's dedicated skateboard-chassis
              subsidiary. That matters because it reframes CAIT as a purpose-built commercialization vehicle inside the
              CATL ecosystem rather than a loosely defined 2023 spinout. Parent context is also unusually important
              here: CATL entered 2026 as a dual-listed battery champion, and CAIT's pitch to automakers depends on
              leveraging that upstream battery scale into a broader battery-plus-platform product set. Public materials
              describe CAIT's business scope as battery-centric CIIC integrated intelligent chassis products and
              technical services, placing it squarely in B2B EV platform supply rather than direct vehicle
              manufacturing.
