      - number: '4.3'
        title: Capital Adequacy and Funding History
        blocks:
          - type: paragraph
            body: >-
              CAIT completed its first external financing round in October 2025, closing more than RMB 2 billion
              (approximately USD 280M at contemporaneous rates). The round was led by Boyu Capital and Guotai Junan
              Securities/Haitong, with co-investment from BAIC Industrial Investment, Shanghai Science and Technology
              Venture Capital (Shanghai STVC), and Fortera Capital. This mix of private equity (Boyu), securities groups
              (Guotai Junan/ Haitong), state-backed industrial capital (BAIC), and municipal innovation capital
              (Shanghai STVC) signals broad stakeholder alignment and reduces near-term capital supply risk. The process
              launched in July 2025 with a reported RMB 100 million minimum ticket per investor and closed by October
              10, 2025.

              Valuation mechanics are partly disclosed. Chinese media reporting, citing Science and Technology
              Innovation Board Daily and Tianyancha data, establish a pre-money valuation of approximately RMB 9 billion
              and a post-money valuation exceeding RMB 10 billion, making CAIT the first declared unicorn in the Chinese
              skateboard chassis sector. CATL retained approximately 70.5934% of CAIT after the round, implying total
              external investor stake of approximately 29.4%. Industrial Bank Trust is cited in one report as acquiring
              9.99%, the closest disclosed individual stake, suggesting no single outside investor took a controlling
              position.

              The Company Overview chapter provides the full historical funding chronology; Financials does not repeat
              those claim IDs. For capital adequacy purposes, the essential forward-looking facts are: CAIT disclosed
              that proceeds are earmarked for (1) mass production of Bedrock Chassis models and (2) R&D for
              next-generation chassis technology. No breakdown between these two uses has been provided. No burn rate,
              monthly cash consumption, or projected runway figure has been disclosed by CAIT or its investors in any
              reviewed source.

              CATL parent provides a structurally important implicit backstop. CATL entered 2025 with over RMB 300
              billion in cash reserves reported in its annual disclosures, and its Hong Kong listing (targeting at least
              $5B proceeds) and subsequent $1.5B offshore bond program demonstrate continued parent capital market
              access. For a subsidiary operating at the scale CAIT likely is, the effective runway is inseparable from
              parent willingness to support, which itself depends on CATL's assessment of CAIT's strategic value to its
              battery supply chain. As long as CATL treats chassis platform capability as core to defending its OEM
              relationships, the implicit financing backstop is credible. If CATL faces its own margin pressure — as it
              did in 2024 when revenue fell 9.7% to RMB 362B — the willingness to fund a pre-revenue subsidiary could
              narrow.
