      - number: '2.3'
        title: Buyer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              CAIT's buying universe is OEMs, not consumers, and the decision to adopt an outsourced integrated chassis
              is a multi-year capital commitment at the vehicle program level rather than a transactional purchase. The
              buyer map organizes around four identifiable archetypes, each with distinct budget dynamics, risk
              tolerance, and adoption triggers.

              Startup OEMs are the most structurally attractive near-term buyer segment for CAIT. These are new-entrant
              EV brands without legacy platform investment, whose main constraint is development time and engineering
              headcount rather than capital. For a startup OEM, the choice between hiring 200+ chassis engineers to
              develop a proprietary platform versus licensing CAIT's Bedrock Chassis is a classic build-vs-buy decision
              where the outsourced path can compress a 36-plus-month program to 12–18 months. Neta was CAIT's earliest
              public startup OEM customer. Its subsequent financial distress illustrates a material counterparty risk:
              startup OEMs are most likely to adopt because they most need the platform shortcut, but they are also most
              likely to encounter financial or commercial difficulty before producing scaled volumes.

              Legacy OEMs represent a longer-cycle opportunity. Chinese state-linked OEMs like JAC (through the Yiwei
              brand) and international legacy automakers exploring electrification in secondary markets are potential
              customers when the ROI on a proprietary platform is insufficient for smaller model lines. The challenge is
              OEM reluctance to outsource a core structural asset to a third party, compounded by brand liability
              concerns if a safety incident is traced to a supplier-owned chassis system. In practice, the JAC Yiwei
              relationship and the Togg collaboration suggest CAIT has demonstrated enough credibility to attract at
              least some legacy-adjacent OEM adoption, though scale is not yet established.

              Export-market OEMs are the most strategically differentiated segment in CAIT's portfolio as of mid-2026.
              Togg (Turkey) signed for Bedrock-based development of a three-model B-segment vehicle family, with first
              mass production targeted for 2027. This represents the thesis that regional OEMs in markets with limited
              domestic platform capability — Turkey, Southeast Asia, the Middle East — will adopt a proven Chinese
              integrated platform rather than developing proprietary EV architectures. The payer in this case is the
              Togg vehicle program budget, the user is Togg's engineering team, and the ultimate customer is the end
              vehicle buyer. For CAIT, export-market OEMs are also a vehicle for CATL battery volume displacement — each
              Togg model built on Bedrock is an incremental CATL cell customer.

              Mobility fleet operators are a more speculative segment. Ride-hailing platforms, logistics operators, and
              purpose-built commercial vehicle startups have historically been active platforms for EV pilots. CAIT's
              platform is most mature for passenger vehicles; a commercial or fleet variant would require additional
              validation. No public evidence of a fleet-specific CAIT commercial relationship was found in the
              2026-06-28 research round.
