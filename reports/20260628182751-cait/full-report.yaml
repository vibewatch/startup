      - number: '3.4'
        title: Western Peer Failures as Structural Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              The exits of Canoo and Arrival from the B2B EV platform market are not simply competitive landscape events
              — they are structural evidence about the commercial viability of the standalone skateboard platform
              business model outside of China.

              Canoo filed for Chapter 7 bankruptcy liquidation in the U.S. Bankruptcy Court for the District of Delaware
              on January 17, 2025. The company had once secured delivery contracts with NASA, the U.S. Postal Service,
              and Walmart but never reached meaningful commercial production. Its IP and physical assets were sold to
              WHS Energy Solutions for $4 million — a near-total loss for investors. Canoo's failure reveals the
              difficulty of funding and scaling an EV platform company in a market where major OEMs have their own
              architectures, and where fleet customers are slow to commit to untested third-party platforms.

              Arrival entered UK administration in early 2024, sold its manufacturing assets to Canoo, and officially
              closed by March 2025. Once valued at over $13 billion post-SPAC merger and backed by Hyundai, Kia, and
              BlackRock, Arrival had a flagship order from UPS for electric delivery vans. It never delivered at
              production scale, burning through capital on a "microfactory" manufacturing strategy that proved
              economically unviable. A $13.3 million SPAC fraud settlement was reached in 2026, further documenting the
              company's failure to deliver on its public commitments.

              The CAIT investment thesis must explicitly account for the Canoo/Arrival reference class. The failure mode
              was not product-technical but commercial: OEM trust, customer patience, and capital duration all ran out
              before production volume materialized. CAIT benefits from CATL's parent credibility, which addresses the
              trust and capital dimensions, but the OEM patience and production ramp challenges are structurally
              similar.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP025
              - CP027
      - number: '3.5'
        title: Moat Durability, Switching Costs, and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              CAIT's primary competitive moat is the CATL battery integration advantage. No direct peer can replicate
              CATL's battery R&D depth, cell manufacturing scale, or CTC structural integration IP without a multi-year
              engineering program or a strategic partnership with CATL itself. CATL held 70.59% of CAIT post the October
              2025 external financing round, ensuring that the battery moat is organizationally anchored, not just
              contractual.

              However, the same lock-in is also a commercial constraint. OEMs that adopt the Bedrock Chassis commit to
              CATL chemistry, pricing, and supply continuity for the lifetime of the vehicle program. S&P Global's
              analysis of Chinese OEM dynamics documents that Huawei HIMA explicitly diversified battery sourcing in
              2026 to reduce CATL dependency — the most visible illustration of the OEM resistance pattern that
              constrains CAIT's buyer universe. This is not a theoretical concern: it is a live competitive dynamic
              visible in the OEM behavior of CAIT's own Chinese market.

              Switching costs run in both directions. Once an OEM has designed a vehicle on Bedrock, switching to a
              different platform or reverting to an in-house chassis requires a new vehicle program — typically 18-36
              months and hundreds of millions of dollars of reengineering. This creates durable revenue from programs
              that start, but it also raises the initial barrier for OEMs considering adoption. The sales cycle for a
              new CAIT program is long, relationship-intensive, and concentrated in the hands of a small number of
              program decision-makers at each potential customer.

              The Tier-1 supplier displacement risk is longer-cycle but credible. As ZF, Bosch, and Magna deepen their
              EV-specific integration capability and build out by-wire chassis domain competency, they will
              progressively close the technical gap between component supply and full-platform supply. If an OEM can
              assemble a near-CAIT-quality platform from ZF, Bosch, and a third-party battery partner within the next
              three to five years, CAIT's value proposition narrows to the CATL battery content advantage alone — a moat
              that remains meaningful but is narrower than the full platform differentiation pitch.
            claimRefs:
              - CP028
              - CP029
              - CP036
              - CP038
              - CP039
