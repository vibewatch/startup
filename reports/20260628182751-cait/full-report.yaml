      - number: '1.3'
        title: Product Architecture and Milestones
        blocks:
          - type: paragraph
            body: >-
              CAIT's strategic relevance comes from moving CATL from component supply toward a more integrated vehicle
              foundation. The company centers its offer on the CIIC integrated intelligent chassis family, with the
              Bedrock Chassis launched in December 2024 as the flagship passenger-vehicle variant. CATL's official
              launch materials give the clearest product picture: battery cells are integrated directly into the chassis
              through Cell-to-Chassis architecture, upper and lower body development are decoupled, collision-energy
              absorption rises to 85%, the system survived a 120 km/h frontal central pole test without fire or
              explosion, and high-voltage disconnection is triggered within 0.01 seconds. CATL also claims the platform
              can compress vehicle industrialization from 36-plus months to 12-18 months while supporting L3-L4
              intelligent-driving-ready decoupling. These claims are ambitious, but they are central to CAIT's business
              model because the platform is sold not as a single car program but as a reusable battery-centric
              foundation for OEMs that want faster development, lower BOM pressure, and more standardized EV packaging.
