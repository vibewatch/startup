      - number: '6.3'
        title: Retention, Concentration Risk, and Customer Signal Quality
        blocks:
          - type: paragraph
            body: |
              CAIT's customer model does not map neatly onto standard SaaS or recurring-revenue metrics.
              OEM platform licensing is a long-cycle, program-level commercial relationship: once an OEM
              selects the Bedrock platform for a model program, the effective "retention" question is
              whether that OEM returns for a second model or a derivative. CAIT does not disclose NRR,
              GRR, contract lengths, or license fee structures. The only proxy for retention is whether
              named customers have announced follow-on programs—and as of run date, no named customer
              beyond AVATR is known to have done so.

              Customer concentration risk is high and structurally tied to CATL's equity ecosystem. Of
              the nine named relationships, AVATR is the only confirmed-production customer, and AVATR
              is itself a CATL equity JV—making it captive demand rather than open-market evidence. JAC
              Yiwei, BAIC, and Changan Mazda have long-standing CATL battery supply relationships.
              T3 Mobility is backed by FAW, Dongfeng, and Changan (all CATL OEM customers). Only Togg
              and VinFast sit fully outside CATL's equity orbit, and VinFast's status is unclear. The
              pattern suggests the platform's early traction reflects CATL's partner ecosystem leverage
              rather than independent commercial pull on the basis of the chassis's own merits.

              The Neta case is the clearest evidence of what MOU-to-SOP conversion failure looks like.
              The industry insight platform 36kr (via the Economic Observer) notes that as a third-party
              supplier, CAIT faces a structural barrier: the chassis has historically been regarded as
              a core OEM competency. "Whether automobile manufacturers are really willing to hand over
              the chassis production to a third-party remains a question," wrote Chen Qingqing of Victory
              Bird Strategic Consulting. This concern is compounded by liability and data ownership
              questions when the chassis and body are produced by different entities.

              Industry analyst Chen Qingqing also observed that third-party chassis companies are
              "expected to make breakthroughs first in the fields of commercial vehicles, Robotaxi in
              specific scenarios, and some mid-and-low-end passenger vehicles that pursue extreme cost
              effectiveness." This framing is consistent with CAIT's own fleet JV strategy (T3/Ant/Hello)
              and suggests that the near-term addressable market may be narrower than CAIT's full OEM
              pipeline implies.

              The report's overall assessment is consistent with a cautious positive: CAIT has achieved
              the first and hardest step—putting a battery-centric chassis into actual production in China
              with an OEM customer—and has assembled a diversified pipeline across segments and
              geographies. But the pipeline is primarily at the agreement stage, the most advanced
              domestic program (Neta) has collapsed, and the first truly independent overseas commitment
              (Togg) is more than a year from production. CAIT's customer story is partnership-rich and
              shipment-light as of the run date, and investors should treat named relationships as
              pipeline indicators rather than confirmed revenue signals.
