  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform Overview and Commercial Value Proposition
        blocks:
          - type: paragraph
            body: |
              Contemporary Amperex Intelligent Technology (CAIT) offers OEM partners the Bedrock Chassis,
              a battery-centric integrated intelligent chassis that the company commercially brands as CIIC
              (Chassis-Integrated Intelligent Computing). Launched by CATL at a ceremony in Shanghai on
              December 24, 2024, CAIT positioned the Bedrock as the world's first standalone integrated
              intelligent chassis offered as a commercial product to passenger vehicle brands. The platform's
              distinctive claim is consolidating battery cells, electric drive, thermal management, and
              chassis domain controller into a single skateboard unit, eliminating the traditional separation
              between battery pack and vehicle structure.

              The commercial proposition rests on three core characteristics articulated by CAIT: internal
              integration (all key systems unified), chassis-body decoupling (the upper body or "top hat"
              can be designed independently from the lower platform), and external openness (standardized
              APIs aligned with the COVESA Vehicle Signal Specification standard). CAIT states this
              combination reduces OEM vehicle development time from 36 or more months to 12–18 months,
              a figure that, if corroborated at scale, represents a meaningful competitive advantage for
              capital-efficient market entrants. Yang Hanbing, CEO of CAIT-SH, stated at launch that the
              platform "activates a trillion-yuan market" by enabling modular, personalized vehicle design.

              The 1+1+1 localization model governs the commercial structure of overseas deployments: one
              chassis technology platform, one industrial supply chain, and one local domestic automotive
              brand partner. This model was applied to the April 2026 Togg agreement, the platform's first
              overseas passenger vehicle production commitment.
