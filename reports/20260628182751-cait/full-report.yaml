  - id: TM004
    title: Growth drivers and adoption constraints — EV integrated chassis market
    columns:
      - Driver / constraint
      - Direction
      - Timing (near/mid/long)
      - Implication for CAIT
      - Diligence ask
    rows:
      - - Time-to-market compression pressure
        - Driver
        - Near-term (now–2027)
        - >-
          Startup OEMs under competitive pressure to launch have the highest structural need for outsourced platforms;
          CATL claims 12–18 month vs 36+ month dev cycle
        - Verify cycle time claim with independent OEM case study; confirm mass-production SOP vs pilot milestones
      - - Cost pressure from intensifying EV competition
        - Driver
        - Near-term (now–2027)
        - >-
          China EV market in structurally competitive phase; per-unit margins compressing; outsourced platforms reduce
          per-program fixed cost for smaller OEMs
        - Quantify CAIT's per-program development fee and hardware margin vs. in-house equivalent
      - - China EV export expansion
        - Driver
        - Near-term (now–2028)
        - >-
          Chinese OEMs and supply chain pushing into SE Asia, Middle East, Europe, Latin America; CAIT positioned as the
          platform enabler for OEMs in markets lacking domestic platform capability
        - Track OEM export targets and confirm Togg and VinFast program progress against SOP dates
      - - EU / regional EV mandates and regulations
        - Driver
        - Mid-term (2027–2030)
        - >-
          Emission regulations in Europe, Turkey, SE Asia accelerate EV adoption; incremental demand for platform
          solutions
        - Monitor EU CO2 standards enforcement and Turkey's domestic EV industrial policy for CAIT tailwind
      - - OEM trust and liability risk
        - Constraint
        - Near-term (persistent)
        - >-
          OEMs reluctant to outsource structural chassis to a third party; safety incident on a CAIT-based vehicle
          creates direct reputational and legal exposure for CAIT and the OEM
        - Audit CAIT's warranty/liability model; check for any public safety or quality event linked to CIIC or Bedrock
      - - Homologation complexity and regulatory fragmentation
        - Constraint
        - Near-term → mid-term
        - >-
          Different crash, battery safety, and EMI standards across CN/EU/TR/ASEAN require per-market certification;
          adds 12–24 months and significant cost to overseas deployment
        - Confirm Togg EU/Turkish homologation timeline; check if CATL has engaged with type-approval bodies
      - - Supplier lock-in and single-source dependency
        - Constraint
        - Persistent
        - >-
          OEMs that adopt Bedrock depend on CATL battery chemistry and supply; Huawei HIMA diversification away from
          CATL illustrates OEM resistance to single-source battery dependency
        - >-
          Assess CAIT contractual terms for exclusivity vs open supplier model; check if any OEM has renegotiated or
          exited
      - - Startup OEM counterparty risk
        - Constraint
        - Near-term (acute for existing partners)
        - >-
          Neta financial distress damaged CAIT's earliest proof point; other startup OEM partners face similar capital
          pressure in China's hyper-competitive EV market
        - Review financial health of each named CAIT OEM partner; prioritize the ones with funded programs through SOP
    notes: >-
      Direction and timing reflect the research state as of 2026-06-28. 'Near-term' is 2026–2027; 'mid-term' is
      2028–2030. Diligence asks are open questions from the evidence base, not verified findings.
