      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Battery-Structural Integration as a Genuine Engineering Differentiator
            body: >
              CAIT's CTC integration is technically substantive—not just a marketing rebranding of cell-to-pack. The
              4th-generation design eliminates battery modules entirely, using cells as structural load-bearing elements
              within a 3D tortoise-shell frame. This enables higher volumetric energy density, reduced component count,
              and a chassis safety architecture that CATL's own tests indicate absorbs more collision energy than
              conventional designs. No other standalone commercial chassis platform currently offers equivalent
              battery-structural integration for passenger vehicle OEMs.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: callout
            title: Safety Claims Rest on Proprietary Protocols Without Independent Certification
            body: >
              Every headline safety figure—85% collision energy absorption, 120 km/h pole crash without fire, 0.01 s HV
              disconnect—is derived from CATL's own test protocols, not from independent Euro NCAP submissions, UNECE
              R100 type approvals, or any national new-car assessment program. European deployment via Togg requires
              type approval under EU Regulation 2018/858 and UNECE R155/R156; neither was confirmed as in progress as of
              June 2026. This is a material risk for the investment thesis if European deployments are central to CAIT's
              growth narrative.
            calloutType: risk
            claimRefs:
              - CE040
              - CE037
          - type: callout
            title: Structural Battery Integration Creates Unresolved Repairability and Insurance Risk
            body: >
              CTC integration makes battery replacement equivalent to chassis replacement after significant collision
              damage. Insurance markets across multiple EV architectures have flagged structural battery integration as
              a driver of higher total-loss rates. Repair requires specialized tooling, training, and parts availability
              that is nascent outside China. These risks are systemic to the CTC design philosophy and are not specific
              to CAIT, but they create friction for OEM partners and end-market consumers, particularly in European
              markets with right-to- repair regulations.
            calloutType: risk
            claimRefs:
              - CE035
              - CE036
          - type: callout
            title: Changan Mazda Partnership Provides First Non-Equity-Aligned OEM Validation
            body: >
              Most of CAIT's Chinese OEM partners (AVATR, Neta) have equity or investment relationships with CATL,
              reducing their independence as adoption signals. The May 2025 Changan Mazda MOU marks the first CIIC
              collaboration with a joint-venture OEM that lacks a prior CATL equity tie-in, providing a more
              credible—though still early-stage—signal of commercial platform attractiveness beyond captive customers.
            calloutType: insight
            claimRefs:
              - CE021
              - CE036
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Pipeline Overview
        blocks:
          - type: paragraph
            body: |
              CAIT's customer base organizes into three functionally distinct segments with different
              evidence standards and commercial implications. The first segment—domestic Chinese OEMs—
              contains the most relationships and the most evidence, but also the most impairment. AVATR
              (a CATL-Changan-Huawei JV) is the confirmed Bedrock production launch customer; Neta (Hozon
              Auto) was the first CIIC program but has entered bankruptcy restructuring as of June 2025;
              JAC Yiwei, Changan Mazda, BAIC, and IAT International have each signed cooperation
              agreements but have not yet announced production-committed programs.

              The second segment—overseas OEMs—has one confirmed relationship. VinFast signed a CIIC
              global strategic cooperation MOU in October 2022, but no production commitment on the
              Bedrock platform has been announced through the run date. Togg of Turkey signed a strategic
              partnership on April 29, 2026, covering three B-segment models with first mass production
              targeted for 2027; this is the only publicly confirmed overseas production commitment.

              The third segment—mobility and fleet applications—is structurally different. CATL, Ant Group,
              and Hello (formerly Hellobike) formed Shanghai Zaofu Intelligent Technology Co., Ltd. in June
              2025 with RMB 1.288 billion registered capital to develop and commercialize Level 4 robotaxi
              technology built on the Bedrock Chassis. T3 Mobility (backed by FAW, Dongfeng, Changan, and
              Alibaba/Tencent) signed a separate cooperation in July 2025 for robotaxi development on the
              same platform. These fleet relationships differ from OEM licensing in structure: CATL co-invests
              as a JV equity partner rather than as a pure platform licensor.

              Across all nine relationships, CAIT's pipeline is dense in signed agreements but narrow in
              confirmed production deployments. CATL's own statement in 2026 positions 2026–2027 as the
              concentrated model-launch window for Chinese OEM partners. Whether that window converts to
              commercial scale depends on the operational health of partner OEMs—a risk Neta has already
              illustrated adversely.
