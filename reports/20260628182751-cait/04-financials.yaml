- id: TI005
  title: Public financial gaps table — CAIT material unknowns and diligence paths
  columns:
  - Missing metric
  - Why undisclosed
  - Investment impact
  - Diligence path
  rows:
  - - CAIT revenue (any period)
    - Private subsidiary; no regulatory disclosure requirement; CATL consolidates without CAIT line item
    - Cannot verify revenue quality, recognition policy, or program-level economics
    - Request management accounts or investor materials containing CAIT P&L; ask for any board deck with financial summary
  - - CAIT gross margin
    - Not disclosed; consolidated within CATL; transfer pricing obscures standalone margin
    - Cannot determine whether CAIT is commercially viable on delivered programs
    - Obtain audited standalone CAIT financials or unaudited management accounts with gross margin line
  - - CATL-CAIT intercompany battery transfer price
    - Related-party transaction; not itemized in CATL annual report at subsidiary level
    - Most important single input for CAIT standalone cost structure; unknown transfer price can mask true economics
    - Review CATL related-party transaction disclosure; request CAIT internal supply agreement terms; assess arm's-length comparison
  - - Monthly burn rate and cash position
    - Not publicly disclosed; CAIT has no independent financial reporting obligation
    - Cannot model runway, assess capital adequacy, or determine urgency of next financing event
    - Request current treasury report; ask for monthly cash flow summary for past 12 months
  - - NRE and per-unit fee structures
    - Commercial-in-confidence; no OEM partner has disclosed contract terms
    - Cannot value any specific OEM relationship or model program-level unit economics
    - Request CAIT OEM contract term sheet or program financial model for at least one active program
  - - Yichun facility capex and utilization
    - Not publicly disclosed; CAIT did not file separate capex disclosures
    - Cannot assess production ramp cost or asset intensity of the manufacturing model
    - Request facility capex budget, actual spend-to-date, current capacity, and utilization rate
  - - Neta program revenue and impairment status
    - Neta is financially distressed; CAIT has not issued any disclosure about program revenue or write-down
