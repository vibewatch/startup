chapter:
  number: 4
  title: Financials
  summary: 'CAIT has not publicly disclosed any revenue, gross margin, cash flow, or
    burn-rate figure as of June 2026. The available financial record consists of: one
    confirmed external financing event (>RMB 2B in October 2025 at >RMB 10B post-money
    valuation), CATL parent financial data illustrating the upstream economics that partially
    underwrite CAIT, peer analogues from Rivian and the failed Western skateboard cohort,
    and a set of cautious proxy ranges constructed from platform-supplier benchmarks. The
    chapter preserves that opacity explicitly rather than speculating on actual CAIT revenue.
    CATL parent support materially reduces near-term capital adequacy risk, but commercial
    revenue risk remains fully unmitigated: the Neta program distress, the narrow buyer
    window documented in Chinese business media, and the structural capital-duration failure
    mode that consumed Canoo and Arrival all raise diligence risk that cannot be resolved
    without a CAIT management financial disclosure.'

sections:
- id: revenue-model-and-pricing-opacity
  title: Revenue Model and Pricing Opacity
  body: 'CAIT has published no revenue figure, pricing schedule, per-unit fee, or
    licensing rate in any primary or secondary source reviewed as of June 2026. The
    absence of disclosure is itself a high-confidence observation: this is not a data
    gap attributable to limited research coverage, but a deliberate posture consistent
    with CAIT still operating as a private subsidiary of a publicly-listed Chinese
    parent. No reviewed source — not CATL''s own annual reports, not its Hong Kong
    prospectus filing, not the October 2025 financing press releases — contains a
    CAIT revenue line or program-level contract value.

    The revenue model must therefore be inferred from product positioning and analogues.
    CATL''s official materials describe CAIT''s commercial arrangement as a "1+1+1"
    localization model: CATL technology, a local-market manufacturing partner, and the
    OEM brand. The platform is sold not as a discrete hardware unit but as a joint-development
    and technology-licensing arrangement in which the OEM co-develops the upper body while
    CAIT supplies the battery-integrated lower chassis foundation. This structure points
    to at least four potential revenue streams: (a) engineering and customization service
    fees (NRE charges) paid once or over the program development phase; (b) per-milestone
    program payments tied to homologation and production readiness events; (c) possible
    per-unit platform licensing royalties as vehicles enter production; (d) battery content
    revenues that accrue to CATL upstream rather than to CAIT directly. Whether stream (d)
    is consolidated into CAIT or retained by the parent is unknown and constitutes a
    material transfer-pricing diligence question.

    Publicly disclosed OEM-partnership events — VinFast (2022), Neta (2023), JAC Yiwei
    (2025), Avatr (2024 launch), Togg (2026) — confirm that CAIT has signed commercial
    agreements with at least five named counterparties. But none of these announcements
    contains a contract value, minimum volume commitment, or per-platform fee. The Bedrock
    Chassis debut at IAA Munich 2025 and the Togg announcement in May 2026 are framed
    exclusively in technical and strategic terms, not financial ones. Comparable B2B EV
    platform licensing economics (from industry sources covering Rivian, REE Automotive,
    and peer Chinese suppliers) suggest upfront fees of $5M–$50M per program and per-unit
    royalties of $500–$3,000 per vehicle at early-stage scale, but these are scenario
    benchmarks, not CAIT-confirmed figures. Any model relying on CAIT revenue must treat
    these inputs as low-confidence estimates pending management disclosure.'
