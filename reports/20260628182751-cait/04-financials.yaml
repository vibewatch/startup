    - Possible future stream from chassis domain controller OTA updates, telematics, or drive-by-wire software licensing
    - Per vehicle per year
    - No evidence this stream exists yet; product roadmap mentions expandable software architecture
    - low — speculative future stream
    - Confirm whether any recurring software or data revenue is contracted or planned
  notes: All streams except battery content pass-through represent standard B2B EV platform business model inferences. No CAIT-specific revenue figure has been disclosed in any reviewed source. Battery content treatment is the most material unknown because it determines whether CAIT's standalone gross margin reflects a full-cost chassis business or a subsidized integration service.
