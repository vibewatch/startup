figures:
- id: FI001
  title: Revenue model bridge — CAIT OEM activity to revenue and gross profit (inferred)
  type: waterfall
  layout: standard
  summary: 'Traces the inferred path from OEM partnership activity to CAIT revenue and
    gross profit, distinguishing disclosed facts from analyst inferences and identifying
    where the value chain is opaque.'
  approximationNotes: 'All nodes are inferred from product architecture and B2B platform
    analogues; no CAIT-specific financial data has been disclosed. Dollar and RMB values
    are scenario illustrations only, not CAIT estimates. Battery content pass-through
    is flagged as the largest unknown that determines whether CAIT gross margin looks
    like an integrator (~10%) or a subsidized subsidiary (higher if CATL absorbs battery
    cost).'
  data:
    items:
    - label: OEM signs joint-development agreement
      value: 0
      description: 'Initiating event; triggers engineering and customization work. No fee
        is confirmed at this stage in CAIT programs; may or may not include an upfront access fee.'
    - label: NRE / engineering service fees received
      value: 15
      description: 'Estimated RMB 50–200M per program in engineering fees (illustration only).
        Revenue recognition likely on milestone completion or percentage-of-completion basis.
        Actual CAIT NRE terms are not disclosed.'
    - label: Battery content cost (CATL intercompany supply)
      value: -45
      description: 'Largest cost node; typically >30% of platform materials cost. Transfer price
        from CATL parent determines gross margin impact. Unknown whether arm-length or concessional
        pricing applies.'
    - label: Other platform materials and assembly (aluminum, by-wire, suspension)
      value: -25
      description: 'Remaining manufacturing cost stack: casting, electronics, thermal management,
        drive units, integration labor. Proportions from industry benchmark; not CAIT-specific.'
    - label: Gross profit (inferred range)
      value: -55
      description: 'Illustrative gross margin of approximately 10–20% depending on NRE vs. per-unit
        mix, transfer pricing terms, and volume. This is a scenario range, not a CAIT figure.'
    - label: Per-unit royalty at production ramp
      value: 10
      description: 'Possible per-vehicle revenue stream once OEM programs enter serial production.
        Not confirmed for any CAIT program. Benchmarks suggest $500–$3,000 per vehicle.'
  claimRefs:
  - CI001
  - CI003
  - CI005
  - CI007
  - CI008

- id: FI002
  title: Unit economics bridge — CAIT per-program cost and revenue drivers (proxy inputs)
  type: flow
  layout: standard
  summary: 'Maps the key inputs and cost-compression levers that determine CAIT per-program
    unit economics, using proxy data where CAIT-specific figures are absent.'
  approximationNotes: 'No CAIT-specific unit economics are available. Nodes are populated
    from CATL parent data, Rivian 2025 annual results, and Chinese chassis supplier market
    research benchmarks. Values in parentheses are illustrative proxy figures, not CAIT
    disclosures. Confidence level for all nodes is low unless labeled otherwise.'
  data:
    nodes:
    - label: CATL parent gross margin (2024 actual)
      value: 24.4
      description: 'High-confidence anchor: CATL 2024 consolidated gross margin of 24.4%
        per annual report. Sets theoretical ceiling for battery content economics; CAIT
        standalone margin will be lower due to fabrication overhead.'
    - label: Chinese chassis supplier early-ramp gross margin (market estimate)
      value: 10
      description: 'Industry research estimates 5–15% gross margin for early-ramp Chinese
        skateboard chassis suppliers. Midpoint of 10% used as proxy. Audited data
        for any individual Chinese supplier not available.'
    - label: Rivian 2025 platform gross margin (actual reported)
      value: 2.7
      description: 'Rivian reported $144M gross profit on $5.4B revenue (2.7%) for 42,247
        units in full-year 2025. This is the most comparable publicly reported EV platform
        manufacturer margin. CAIT volumes are much smaller.'
    - label: Implied CAIT gross margin range (low case — pre-scale, arm-length CATL pricing)
      value: 5
      description: 'Low-case scenario: CAIT at very early scale with arm-length CATL battery
        pricing results in thin gross margin similar to Rivian early-stage economics.
        Not confirmed; scenario illustration only.'
    - label: Implied CAIT gross margin range (high case — parent-subsidized battery cost)
      value: 20
      description: 'High-case scenario: CATL provides battery content at below-market cost
        to CAIT, giving CAIT a structurally higher gross margin than standalone peers.
        Contingent on undisclosed intercompany transfer pricing terms.'
  claimRefs:
  - CI009
  - CI014
  - CI029
  - CI030
  - CI031

- id: FI003
  title: Financial estimate range — CAIT key metrics with evidence-bounded scenarios (2026)
  type: range
  layout: wide
  summary: 'Source-bounded low and high scenario values for CAIT''s key financial
    inputs. All bars are scenarios or proxies; confirmed CAIT values are zero or
    absent, shown explicitly to preserve the disclosure gap rather than fill it
    with speculation.'
  data:
    items:
    - label: CAIT revenue (annual, any period)
      low: 0
      high: 0
      unit: RMB M
      detail: 'Not disclosed. Low and high both shown as zero to indicate genuine absence
        of data, not a zero-revenue assertion. Actual revenue is unknown and may be
        non-zero. Source: disclosure review.'
    - label: Post-money valuation (Oct 2025 financing)
      low: 9000
      high: 10500
      unit: RMB M
      detail: 'Low anchored at pre-money of approximately RMB 9B (media reports citing
        STIB Daily); high anchored at post-money >RMB 10B (36kr, Gasgoo, SMM corroboration).
        RMB 10B = $1.4B at contemporaneous rates.'
    - label: Capital raised in external round (Oct 2025)
      low: 2000
      high: 2500
      unit: RMB M
      detail: 'Low is the publicly confirmed floor (">RMB 2B"). High is an upper bound
        consistent with post-money valuation mechanics (29.4% external stake at >RMB 10B
        valuation implies approximately RMB 2.9B raised; low-end of that range used as
        high bar). Not independently audited.'
    - label: CAIT gross margin (proxy scenario range)
      low: 5
      high: 20
      unit: '%'
      detail: 'Low: Rivian-like thin margin at early scale with arm-length CATL supply
        pricing. High: parent-subsidized battery cost giving integrator-like margin above
        Chinese chassis peer average. No CAIT-specific data; scenario illustration only.'
    - label: CATL parent cash reserves (backstop signal)
      low: 300000
      high: 400000
      unit: RMB M
      detail: 'Low anchored at >RMB 300B reported in CATL 2024 annual report and SZSE filing.
        High is a range estimate consistent with CATL 2025 operating cash flow of RMB 133.2B
        added to prior reserves. Provides implicit backstop context for CAIT financing risk.'
  approximationNotes: 'CAIT revenue bars are intentionally shown as zero to communicate the
    disclosure gap, not to assert zero revenue. All other CAIT-specific ranges are scenario
    constructs or corroboration ranges, not audited figures. CATL backstop bar is parent-level
    data, not CAIT-committed capital.'
  claimRefs:
  - CI018
  - CI019
  - CI020
  - CI025
  - CI027

- id: FI004
  title: Capital intensity / cash-flow map — CAIT cost-stack and capex drivers
  type: waterfall
  layout: standard
  summary: 'Illustrates the major cash-use drivers for a battery-integrated chassis
    platform manufacturer at CAIT''s inferred scale, using parent and peer data to
    construct a proxy capital intensity picture.'
  approximationNotes: 'Values are illustrative proxy amounts based on Rivian capex/unit,
    CATL parent R&D benchmarks, and Chinese chassis supplier industry reports. All
    CAIT-specific figures are unknown; this waterfall is a reference-class model, not
    a CAIT financial projection. Direction of bars (up = inflow/reduction, down = outflow)
    is notional.'
  data:
    items:
    - label: External financing inflow (Oct 2025 round)
      value: 2000
      description: 'RMB 2B+ raised in October 2025. Sole publicly confirmed capital inflow.
        Benchmark starting point for cash adequacy analysis.'
    - label: Bedrock Chassis mass production capex (estimated)
      value: -800
      description: 'Estimated capex for manufacturing ramp based on Yichun facility and
        comparable platform launch capex of $100-200M. Likely the largest single use of
        proceeds. Not disclosed by CAIT.'
    - label: Next-gen chassis R&D investment (estimated)
      value: -600
      description: 'Second declared use of proceeds. CATL parent spends RMB 22.1B on R&D
        annually at group level; CAIT''s share is not disclosed. RMB 600M is a conservative
        proxy estimate for a 3-year next-gen program.'
    - label: Working capital and operational burn (estimated)
      value: -400
      description: 'Personnel, engineering services, sales, supply-chain pre-positioning,
        and general operations. Estimated at RMB 100-200M per year for a 2-3 year horizon.
        Actual figure unknown.'
    - label: Implied residual / remaining capital (illustrative)
      value: 200
      description: 'After the three major uses above, implied residual is approximately
        RMB 200M — a thin cushion for contingencies, OEM program slippage, or slower-than-expected
        revenue ramp. This reinforces why disclosed burn and cash data are blocking diligence
        inputs.'
