- id: TI003
  title: Unit economics table — CAIT evidence-based and proxy metrics
  columns:
  - Metric
  - CAIT value
  - Confidence
  - Proxy / comparable
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue per OEM program
    - Not disclosed
    - high (gap confirmed)
    - $5M–$60M per program per year (illustrative from Rivian/REE analogues at low volume)
    - Determines whether any individual OEM program generates meaningful standalone economics
    - Request per-program revenue breakdown in management disclosure
  - - Gross margin (standalone CAIT)
    - Not disclosed
    - high (gap confirmed)
    - 5–15% early-ramp estimate (industry range for Chinese chassis suppliers)
    - Whether CAIT is above or below breakeven cannot be determined without this
    - Obtain audited standalone CAIT financial statements or at minimum unaudited management accounts
  - - CATL parent gross margin (2024)
    - 24.4% (CATL consolidated, per annual report)
    - high
    - Best-case upstream benchmark; CAIT standalone likely lower due to integration overhead
    - Sets the ceiling for what CAIT gross margin could plausibly approach at CATL-scale economics
    - Determine how much CATL battery margin is retained at CATL vs. passed to CAIT cost
  - - Battery cost as share of platform COGS
    - Not disclosed
    - high (gap confirmed)
    - More than 30% of EV platform materials cost (industry benchmark for CTC/CTB architectures)
    - Largest single COGS driver; intercompany pricing determines whether this is a cost or a pass-through
    - Obtain CATL-CAIT intercompany supply agreement and transfer pricing documentation
  - - Capex per production unit
    - Not disclosed
    - high (gap confirmed)
    - Approximately $19,000 per vehicle (Rivian 2025 full-year; $800M capex / 42,247 units)
    - Determines capital intensity for each incremental unit; critical for payback and runway model
    - Obtain CAIT facility capex budget and actual spend for Yichun production base
  - - Customer acquisition cost (CAC)
    - Not disclosed; B2B sales cycle is program-based, not transactional
    - high (gap confirmed)
    - Not applicable in standard SaaS sense; each program is a multi-year enterprise relationship
    - Sales efficiency in B2B automotive is measured by program close rate and time-to-SOP
    - Request pipeline metrics — programs in negotiation, time from MOU to signed contract, SOP timelines
  - - Burn rate (monthly)
    - Not disclosed
    - high (gap confirmed)
    - RMB 25–50M/month estimated (RMB 2B raised; 3–7 year runway at hardware growth-stage norms; highly uncertain)
    - Cannot assess how much of the Oct 2025 capital remains and whether a new round is imminent
    - Request current cash position, monthly burn, and expected use-of-funds timeline
  - - R&D spend as % of revenue
    - Not disclosed; CATL parent at 5.14% (2024) and 5.22% (2025) of consolidated revenue
    - medium (CATL proxy only)
    - CATL parent R&D of RMB 18.6B (2024) and RMB 22.1B (2025); CAIT share not disclosed
    - Indicates R&D investment discipline; for a platform company, this ratio should be high in early years
    - Obtain CAIT standalone R&D investment and capitalized development cost treatment
  notes: Most CAIT-specific cells in this table are null gaps backed by high-confidence confirmation that the metric is undisclosed. Proxy values are drawn from publicly reported Rivian, CATL, and Chinese skateboard chassis supplier benchmarks. Do not use proxy figures as CAIT estimates without management confirmation.
