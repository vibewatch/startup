- id: cost-structure-and-capex-intensity
  title: Cost Structure and Capex Intensity
  body: 'CAIT''s standalone cost structure is not disclosed. The analysis must be
    built from first principles using three inputs: product architecture (battery-integrated
    chassis), parent ecosystem (CATL battery manufacturing), and peer benchmarks (Rivian,
    Chinese chassis suppliers, CATL own margins).

    Battery content is the dominant cost driver for any CTC-integrated platform. For
    a fully integrated EV chassis incorporating CATL lithium cells, thermal management,
    and structural integration, the battery pack alone typically represents more than
    30% of the total platform materials cost. The remaining cost stack includes aluminum
    die-casting and structural extrusions (approximately 15-20%), by-wire electronics
    and chassis domain controller (10-15%), electric drive units (10-15%), suspension
    and steering modules (10-15%), thermal management and cooling systems (5-10%), and
    software integration and testing (5-10%). These proportions are analyst estimates
    from platform manufacturing benchmarks, not CAIT-reported figures.

    The intercompany dimension of battery supply is the single largest unknown in CAIT''s
    cost structure. CATL, as a 70.6% parent shareholder, supplies the cell content that
    makes up most of CAIT''s platform cost. The transfer price — whether arm''s-length
    market pricing or a related-party concessional rate — determines whether CAIT''s
    standalone gross margin looks similar to an independent chassis integrator or is
    effectively subsidized by the parent. CATL''s public filings acknowledge related-party
    transactions at group level but do not itemize CAIT-specific transfer terms.

    On capex, CAIT confirmed its first production base in Yichun, Jiangxi, signed in January
    2023 and described as operational in late 2024. No capex figure for this facility has
    been publicly stated. Comparable platform manufacturing launch capex — tooling, automated
    assembly, battery integration testing rigs, and casting infrastructure — typically runs
    $100M–$200M for an initial scalable line. CATL''s parent capex program (more than RMB
    300B in aggregate cash reserves, with RMB 18.6B and RMB 22.1B in R&D spending in 2024
    and 2025 respectively) represents a significant implicit backstop: CAIT can draw on
    CATL''s manufacturing engineering, intellectual property, and supply-chain infrastructure
    at terms that a standalone startup could not access. This is CAIT''s most financially
    important structural advantage over Western peers, but it also means the standalone
    capex burden and R&D cost are probably understated relative to a full commercial arms-length
    accounting.'
