  rows:
  - - Engineering / NRE service fees
    - One-time or phased payment per OEM program for customization, integration engineering, and homologation support
    - Per program; likely multi-million RMB
    - Inferred from product architecture; no public contract terms for any CAIT program
    - low — analyst inference only
    - Request per-program NRE fee schedules and whether any NRE has been recognized as revenue
  - - Per-unit platform licensing royalty
    - Recurring per-vehicle fee when OEM builds vehicles on Bedrock Chassis under licensing arrangement
    - Per vehicle; benchmarks suggest $500-$3,000 per unit
    - Not publicly confirmed; no volume commitment for any OEM partner has been disclosed
    - low — scenario benchmark; not confirmed
    - Confirm whether CAIT charges per-unit fees or relies entirely on engineering service model; get volumes and rates
  - - Milestone / program-stage payments
    - Payments tied to achieving specific development milestones (design freeze, prototype, SOP)
    - Per milestone per program
    - Inferred from joint-development structure described by CATL; actual milestones and values undisclosed
    - low — inferred
    - Request contract structures for active OEM programs; determine how milestones are defined and when payments trigger
  - - Battery content pass-through (CATL upstream)
    - CATL supplies cells to CAIT which integrates them; whether the margin on battery content accrues to CAIT or CATL is unknown
    - Per kWh or per chassis
