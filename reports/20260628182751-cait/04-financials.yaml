- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: 'The financial picture for CAIT as of June 2026 is defined by six hard disclosure
    gaps and one structural mitigant. The mitigant — CATL parent support — is real and
    meaningful, reducing the probability of acute capital distress. The gaps are equally
    real, collectively preventing any credible financial underwrite.

    The six core diligence blockers are: (1) No disclosed CAIT revenue, in any period or
    from any program, making revenue quality and recognition mechanics entirely unknown.
    (2) No disclosed gross margin or cost of goods sold, making it impossible to assess
    whether CAIT is currently above or below breakeven on delivered programs. (3) No
    disclosed burn rate or cash position, making standalone runway impossible to calculate.
    (4) No disclosed intercompany transfer pricing between CATL upstream battery supply
    and CAIT, which is the single largest cost-structure determination for a battery-
    integrated chassis company. (5) No disclosed NRE fee structures, program milestone
    payment schedules, or per-unit royalty terms for any signed OEM partner. (6) No
    audited standalone financial statements for CAIT as a separate entity; the only
    audited financial data available is CATL consolidated, which does not isolate CAIT.

    The adverse evidence reinforces the urgency of these gaps. Neta, CAIT''s earliest
    publicly named CIIC partner, fell into acute financial distress in 2025, raising
    questions about whether the Neta S CIIC 800V program generated any meaningful
    revenue before impairment. Chinese business media (CBN Weekly, via 36kr) documented
    in October 2025 that most Chinese new-force OEMs have already developed proprietary
    platforms, narrowing CAIT''s primary addressable market and suggesting the commercial
    window may be more constrained than the funding narrative implies. The Western peer
    failure class — Canoo liquidated, Arrival closed — illustrates that multi-billion-dollar
    valuations, high-profile partnerships, and institutional backing do not protect a
    pre-scale platform supplier from capital-duration risk when commercial ramp is slower
    than projected.

    CAIT''s financial verdict is therefore asymmetric: the downside is bounded and mitigated
    by CATL, but the upside — a scalable, revenue-generating platform business with transparent
    economics — remains entirely unverifiable from public data. Investment underwriting requires
    management disclosure covering at minimum: current revenue by program, gross margin on
    delivered units, CATL transfer-pricing terms, burn rate and cash position, and the specific
    contractual structure of each active OEM agreement.'
