  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: CAIT standalone revenue and gross margin
    missingEvidence: No CAIT revenue figure, gross margin, or cost of goods sold has been publicly disclosed in any reviewed source; the company operates as a private subsidiary without independent financial reporting obligations
    whyItMatters: Cannot determine whether CAIT is commercially viable, above breakeven, or generating meaningful revenue from any OEM program; all financial modeling depends on proxy benchmarks
    diligencePath: Request CAIT management accounts, investor deck with P&L summary, or audited standalone financial statements; at minimum request unaudited H1 2025 revenue and gross margin
    relatedQuestionRefs:
    - QI010
    relatedTableRefs:
    - TI001
    - TI005

  - type: private-evidence-only
    severity: blocking
    topic: CATL-CAIT intercompany battery transfer pricing
    missingEvidence: No public document discloses the terms under which CATL supplies battery content to CAIT; whether pricing is arm-length or concessional is unknown and determines the largest single line in CAIT's cost structure
    whyItMatters: The transfer price for battery content is the primary determinant of CAIT's standalone gross margin; a concessional price would make CAIT appear more profitable than it would be if spun out fully
    diligencePath: Request CATL-CAIT related-party supply agreement; review CATL annual report related-party transaction footnotes; request an arm-length comparable pricing benchmark from an independent battery source
    relatedQuestionRefs:
    - QI020
    relatedTableRefs:
    - TI003

  - type: missing-source
    severity: material
    topic: CAIT burn rate, cash position, and monthly treasury data
    missingEvidence: No source discloses CAIT's monthly cash burn, current cash balance, or planned use-of-funds schedule with timing
    whyItMatters: Without burn rate and cash position, runway cannot be calculated, and it is impossible to determine whether CAIT is approaching a funding gap or has years of capital runway
    diligencePath: Request current management treasury report; ask for 12-month trailing cash flow summary; request CFO presentation on expected next financing trigger
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI004

  - type: missing-source
    severity: material
    topic: Neta program revenue impact and current status
    missingEvidence: Neta's financial distress disrupted CAIT's earliest publicized program; no disclosure exists on whether any CAIT revenue was recognized from the Neta S CIIC chassis program, whether any receivables are outstanding, or whether the program is ongoing
    whyItMatters: The Neta program was CAIT's only commercially verified early deployment and its impairment is the most concrete adverse financial event in the public record
    diligencePath: Request CAIT's internal account of Neta program status; review any Neta creditor restructuring filings for CAIT-related claims; confirm whether any CIIC vehicles have been sold to end customers
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI005

