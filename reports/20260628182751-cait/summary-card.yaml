summary:
  headline: >-
    CAIT is a strategically credible CATL platform extension with real OEM interest and a strong parent moat, but
    today’s public evidence supports tracking rather than underwriting the business aggressively because revenue,
    customer conversion, and standalone economics remain opaque.
