  topStrengths:
    - >-
      CATL parentage gives CAIT a differentiated moat in battery integration, manufacturing credibility, and strategic
      customer access that most skateboard-chassis startups lack.
    - >-
      The Bedrock Chassis is a real launched product with a coherent battery-centric architecture and multiple public
      OEM relationships including Avatr, JAC Yiwei, and Togg.
    - >-
      The October 2025 financing round provides meaningful external validation and capital support for continued
      industrialization rather than purely conceptual R&D.
  topRisks:
    - >-
      CAIT discloses no standalone revenue, gross margin, transfer-pricing structure, or order-book depth, so the
      business cannot yet be underwritten on operating fundamentals.
    - >-
      Customer proof is still dominated by signed partnerships and rollout targets; the earliest high-profile CIIC
      program with Neta deteriorated with customer distress.
    - >-
      OEM adoption can be constrained by supplier lock-in fears, homologation and liability complexity, and
      repairability or service concerns inherent in deeply integrated chassis designs.
    - >-
      The business remains capital intensive and strategically dependent on CATL, which is both a moat and a governance
      or concentration risk for minority investors.
  unresolvedGaps:
    - Standalone CAIT revenue, gross margin, and cash-burn disclosure
    - Program-by-program conversion from signed cooperation to scaled production shipments
    - Exact post-round ownership, board rights, and CATL intercompany IP or transfer-pricing mechanics
    - Verified headcount, manufacturing footprint, and after-sales / repair responsibility model
    - Independent validation of Bedrock safety, homologation, and overseas compliance readiness
