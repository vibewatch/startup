- id: scenario-analysis
  title: Bull / Base / Bear Scenarios and Probability-Weighted Range
  body: 'Three scenarios encompass the plausible valuation range for CAIT by 2028–2030, the earliest credible
    window for a liquidity event (IPO or strategic sale). All three are explicit about assumptions that
    remain unverified; none relies on undisclosed CAIT financial data.

    The bull case assumes Togg''s 2027 production launch proceeds, two additional OEM partners (one Chinese,
    one international) confirm production programs by end-2027, and CAIT discloses meaningful NRE and
    per-unit licensing revenue in excess of RMB 1 billion by 2028. Under these conditions, CAIT could
    target a listing at 3–5x forward revenue, implying enterprise value of RMB 30–50 billion (~$4–7 billion).
    CATL''s HK listing success and capital-market platform (April 2026 $5 billion placement was massively
    oversubscribed) demonstrates that parent capital-market access exists for an eventual CAIT spin-up.
    Bull case requires: no CATL parent-dependency escalation, no repeat of the Neta customer-failure scenario,
    continued Chinese EV market growth, and successful EU/international homologation for Togg''s Turkish
    and European markets. Probability signal: low-to-medium (meaningful obstacles remain).

    The base case anchors to the October 2025 transaction price with moderate progression. Togg production
    in 2027 proceeds, at least one additional OEM program is publicly confirmed, CAIT begins disclosing
    selective financial metrics (NRE revenue per program) by 2028, but no full revenue statement is available.
    CATL retains majority control and continues to backstop capital access. CAIT targets a late-2029 to
    2030 A+H dual-listing (following CATL''s model) at an implied valuation of RMB 12–20 billion ($1.7–2.8
    billion). Base case return from October 2025 entry: approximately 20–100% nominal over 4–5 years (minimal
    risk-adjusted attractiveness; comparable to a strategic bond with equity upside). Probability signal:
    medium (consistent with disclosed milestone trajectory but depends on undisclosed commercial outcomes).

    The bear case assumes commercialization conversion fails to accelerate. One or more OEM partners beyond
    Togg delay or terminate programs. Revenue disclosure, if it materializes at all, reveals a below-expectation
    contract structure. CATL parent faces additional geopolitical headwinds (expanded DoD designation
    scope, EU supplier restrictions) that restrict the capital ecosystem around CAIT. CAIT''s next financing
    round, required before 2028 to fund Yichun production ramp-up, clears at a flat or down valuation
    of RMB 6–9 billion. The October 2025 investors face a down-round. Bear case implied value: RMB 5–8
    billion ($700M–$1.1B), a 30–50% loss from October 2025 entry price. Probability signal: medium (driven
    by the well- documented concentration of commercial risk on a narrow OEM pipeline).'
