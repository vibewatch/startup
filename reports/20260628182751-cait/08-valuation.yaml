  evidenceGaps:
  - topic: cait-revenue-disclosure
    type: private-evidence-only
    severity: blocking
    missingEvidence: No CAIT annual, quarterly, or program-level revenue figure has been disclosed in
      any public source reviewed as of June 2026.
    whyItMatters: Without revenue, all valuation multiples are scenario back-calculations rather than
      market multiples applied to observed fundamentals. The blocking gap means conviction above watchlist
      is unwarranted.
    diligencePath: Request management financial disclosure, investor presentation, or pre-IPO A1 filing
      from CAIT or from CATL's investor relations for subsidiary financial details.
    relatedQuestionRefs:
    - QV013
    - QV029
  - topic: transfer-pricing-policy
    type: private-evidence-only
    severity: blocking
    missingEvidence: CATL-to-CAIT battery supply transfer pricing is not disclosed in any public CATL
      annual report, HK prospectus, or CAIT communication.
    whyItMatters: Transfer price is the largest determinant of CAIT standalone gross margin; without it,
      economic quality of the platform business cannot be independently assessed.
    diligencePath: Request CAIT related-party transaction policy; cross-check against CATL A-share and
      H-share annual report related-party disclosure sections.
    relatedQuestionRefs:
    - QV014
    - QV029
  - topic: series-a-terms
    type: private-evidence-only
    severity: material
    missingEvidence: Liquidation preferences, anti-dilution provisions, and information rights for the
      October 2025 round are not publicly disclosed.
    whyItMatters: Adverse terms could materially subordinate common-equity value in bear and base scenarios;
      ratchet provisions could dilute CATL's stake or impose penalty on follow-on rounds.
    diligencePath: Request term sheet and shareholders' agreement from CAIT management or any October
      2025 investor who will share.
    relatedQuestionRefs:
    - QV025
    - QV012
  - topic: down-round-risk
    type: private-evidence-only
    severity: material
    missingEvidence: No next financing round terms, timeline, or valuation for CAIT post-October 2025
      round have been publicly disclosed.
    whyItMatters: Without a forward financing plan or milestone disclosure, the probability of a down-round
      cannot be quantified and bear-case scenario probability remains highly uncertain.
