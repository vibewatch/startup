- id: TV002
  title: Thesis / Anti-Thesis Table
  columns:
  - Argument
  - Evidence
  - What would change this view
  rows:
  - - FOR — CATL parent backstop eliminates capital duration risk, the single largest failure mode for
      Western comps
    - CATL CNY110B net cash, A- Fitch rating, RMB22.1B R&D spend in 2025; 70.6% ownership signals commitment
    - CATL divests or materially reduces stake; CATL credit deteriorates; CAIT capital support is made
      explicitly conditional
  - - FOR — First-mover unicorn positioning in a high-structural-tailwind segment
    - October 2025 post-money >RMB10B confirmed across multiple independent media; no other Chinese skateboard
      chassis entity has declared comparable valuation
    - A credible domestic competitor raises at a materially higher valuation demonstrating CAIT is not
      the structurally advantaged platform
  - - FOR — Togg partnership signals international OEM demand for Bedrock
    - CATL official press release and PRNewswire announcement (May 2026); electrive.com and carnewschina.com
      independent confirmation; 3-model program with 2027 SOP target
    - Togg program is delayed or cancelled before SOP; no further international OEM partnerships are signed
      within 12 months
  - - AGAINST — Zero revenue disclosure makes every valuation lens speculative
    - No CAIT financial statement, NRE fee schedule, per-unit royalty rate, or contract value has been
      disclosed in any reviewed source
    - Management discloses quarterly or annual revenue and gross margin figures ahead of IPO filing
  - - AGAINST — Neta bankruptcy eliminated the showcase customer and reveals structural counterparty risk
    - Neta bankruptcy proceedings 2025-2026; CNBC reported 64,719 pre-registered vehicles suggesting commercial
      scale that failed to convert; Neta CIIC program dead
    - CAIT publicly acknowledges the Neta impairment and demonstrates replacement program with equivalent
      or larger OEM within 12 months
