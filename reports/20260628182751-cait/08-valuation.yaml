    - Any publicly confirmed production halt, bankruptcy, or OEM program cancellation within CAIT's active
      pipeline
    - Accelerates OEM trust gap; narrows comparable pool to Togg only; signals structural resistance to
      platform adoption beyond CATL-affiliated OEMs
    - Reassess base and bull cases as bear scenarios; demand OEM pipeline diversification evidence before
      maintaining position
  - - Next CAIT financing round at flat or down valuation
    - Public announcement of CAIT capital raise at valuation equal to or below RMB 10B
    - Confirmed down-round risk; October 2025 investors face mark-down; IPO timeline pushed further out
    - Re-enter only if down-round terms provide materially improved economics vs. Series A
  - - CATL Pentagon designation scope expands to restrict HK capital markets
    - U.S. Treasury, DoD, or OFAC action materially restricting CATL-affiliated entities' access to U.S.
      institutional capital
    - CAIT IPO investor base narrows significantly; multiple compression for dual-listing scenario
    - Reduce valuation in all scenarios; bear case probability increases materially
  claimRefs:
  - CV028
  - CV029
  - CV030
  - CV033
  - CV038
  - CV039
  notes: Thresholds are observable proxy indicators rather than contractually defined events; triggers
    are not exhaustive.
- id: TV006
  title: Final Diligence Asks Table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - CAIT revenue and gross margin
    - No annual, quarterly, or program-level revenue figure has been publicly disclosed
    - Without revenue, no fundamental multiple can be applied and every scenario remains purely speculative;
      material for all valuation lenses
    - Management disclosure or audited financials; request in any investor discussion; required for IPO
      filing
  - - CATL-CAIT transfer pricing policy
    - Intercompany battery supply pricing between CATL (70.6% owner) and CAIT is not publicly disclosed
      in any reviewed source
    - Transfer pricing determines CAIT's standalone gross margin; if below-market, CAIT's economics are
      effectively subsidized and standalone quality is lower than consolidated economics suggest
    - Request related-party transaction policy from CAIT management; verify against CATL public filings'
      related-party disclosure section
  - - OEM contract terms and structure
    - No contract value, minimum volume, milestone payment schedule, or per-unit fee for any OEM program
      has been disclosed
    - Without contract terms, there is no basis for NRE or royalty revenue projections and no confirmation
      that programs will generate material revenue
    - Request contract summaries for Togg, JAC Yiwei, and Avatr; obtain minimum-volume or take-or-pay
      commitments; confirm whether Togg agreement is binding or framework
  - - Shareholder rights and preference structure
    - The terms of the October 2025 round — including liquidation preferences, anti-dilution, conversion
      rights, and information rights — have not been publicly disclosed
    - Preference overhang determines economic outcomes for all stakeholders in exit scenarios; adverse
      terms can subordinate common equity significantly
    - Request term sheet summary or cap table from management; review October 2025 investor documents
      if available
  - - IPO plan and listing timeline
    - No formal IPO announcement or A+H listing intention has been made by CAIT as of June 2026
    - Exit horizon is the primary uncertainty for return calculation; without IPO visibility, capital
      is locked in a pre-revenue private entity with no liquidity
    - Monitor CATL parent announcements and CAIT annual shareholder updates; track STIB or HKEX filing
      activity
  claimRefs:
  - CV006
  - CV026
  - CV027
  - CV037
  - CV040
  notes: All items reflect absence of public disclosure as of 2026-06-28; the list is prioritised by materiality
    to valuation, not by ease of resolution.
