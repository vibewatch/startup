- id: TV004
  title: Comparable Valuation Table
  enumerationScope:
    basis: Covers the five most operationally or structurally comparable public companies and one private-market
      precedent transaction for CAIT as of June 2026; CAIT-specific multiples are scenario back-calculations
      (implied revenue at current valuation), not observed market multiples, because CAIT has not disclosed
      revenue.
    coverage: partial
  columns:
  - Comparable
  - Business / relevance
  - 2025 revenue
  - Market cap / EV (2025-2026)
  - EV/rev or P/S multiple
  - Implied CAIT revenue at $1.4B
  - Limitation
  rows:
  - - Aptiv (APTV)
    - Tier-1 automotive technology supplier (electrical architecture, ADAS); closest operational comp
      for a chassis-tech platform supplier at scale
    - $20.4B
    - EV ~$21B
    - ~1.2x EV/revenue
    - ~$1.2B implied (far above any known CAIT projections)
    - Aptiv is profitable and scaled; CAIT is pre-revenue and dependent on single parent; multiple not
      directly applicable
  - - BorgWarner (BWA)
    - Global driveline and electrification supplier; comparable to CAIT as a platform-tech B2B supplier
      to OEMs
    - $14.0B
    - EV ~$15B
    - ~1.1x EV/revenue
    - ~$1.3B implied (extreme stretch for CAIT near-term)
    - BorgWarner is diversified across 100+ customers; CAIT has fewer than 6 named OEM partners all pre-production
  - - Mobileye (MBLY)
    - Intel ADAS spinout; a strategic parent-backed technology platform targeting OEMs; most analogous
      in structure to CAIT's parent-spinout positioning
    - $1.89B
    - MC ~$6.6B; EV ~$5.3B
    - ~2.8x EV/revenue; ~3.3x P/S
    - ~$420–500M implied (achievable in bull case by 2028–2029)
    - Mobileye has disclosed revenue from inception; CAIT has zero disclosure; Mobileye's software content
      (EyeQ SoC) carries higher IP defensibility premium than a chassis platform
  - - Rivian (RIVN)
    - EV platform / OEM with Volkswagen JV; captures both platform-supply and vehicle manufacturing premiums;
      benchmark for EV platform companies at early growth stage
    - $5.39B (FY2025, first positive gross profit)
    - MC ~$20–22B (mid-2026)
    - ~3.5–4x P/S
    - ~$350–400M implied (credible in 3–4-year bull scenario)
    - Rivian has manufactured and sold vehicles at scale; CAIT has no confirmed production volume; Rivian
      multiple includes consumer vehicle brand premium
  - - Zeekr (Geely-backed Chinese OEM IPO, 2024)
    - Chinese EV OEM backed by a dominant parent; most relevant precedent for Chinese EV ecosystem IPO
      multiples and parent-backed spinout expectations
    - $7.28B (2023 revenue)
    - $5.1B IPO target valuation (2024)
    - ~0.7x P/S (trailing revenue); ~1.0–1.5x forward revenue
    - ~$1.0–1.4B implied (suggests current CAIT valuation is near fair for a Chinese EV ecosystem entity
      IF revenue materialises)
    - Zeekr had actual vehicle revenue; CAIT does not; Zeekr IPO multiple reflects OEM, not B2B platform
      supplier, positioning
  - - Canoo (GOEV, bankrupt Jan 2025)
    - Western EV skateboard platform company that raised >$900M and filed Chapter 7; direct adverse comparable
      for structural failure mode of standalone chassis platform companies
    - Minimal (pre-revenue at failure)
    - Peak market cap ~$3.3B (2021 SPAC); bankrupt Jan 2025
    - N/A at bankruptcy; peak implied multiple ~10x speculative forward revenue
    - N/A — adverse benchmark only
    - Canoo lacked CATL's parent backstop; failure mode was capital duration + OEM non-conversion; this
      risk is partially but not fully mitigated for CAIT by parent support
  notes: 'All CAIT-implied revenue figures are scenario back-calculations: they answer "what CAIT annual
    revenue would justify $1.4 billion at each peer multiple?" — not a CAIT revenue projection. None of
    these revenue levels has been confirmed by public CAIT disclosure. The range spans $350M (at Rivian
    P/S) to $1.3B (at Aptiv EV/rev) — confirming the October 2025 valuation is expensive relative to revenue-based
    comps and can only be justified as a strategic/option premium absent revenue disclosure. The Mobileye
    comp at $420–500M represents the most achievable bull-case target for a Chinese B2B platform spinout.'
