chapter:
  number: 8
  title: Valuation
  summary: 'CAIT''s October 2025 Series A establishes a post-money anchor of more than RMB 10 billion
    (~$1.38 billion), making it the first declared unicorn in the Chinese intelligent chassis sector.
    The transaction is the sole publicly verifiable valuation reference; CAIT has disclosed no revenue,
    gross margin, or unit economics as of June 2026. Under every plausible comparable framework — automotive
    supplier multiples (1.1–1.2x EV/revenue), EV platform peer multiples (2–3.5x P/S), and strategic parent-backed
    spinout precedents — the October 2025 valuation is defensible only as a parent-support option premium
    and first-mover strategic positioning, not as an earnings or revenue multiple. The base-case stance
    is Fairly Priced With High Uncertainty: the valuation is supported by CATL''s A-rated balance sheet
    (CNY 110 billion net cash), a first-mover position in a structurally attractive segment, and credible
    investor validation (Boyu, BAIC, state capital). However, no revenue disclosure means the valuation
    cannot be independently stress-tested, and adverse risks — hype premium, Neta program impairment,
    Pentagon designation, opaque transfer pricing, Western platform bankruptcies — keep the upside path
    meaningfully uncertain. Investors should demand revenue disclosure, OEM contract terms, and transfer-pricing
    policy before moving beyond watchlist positioning.'
sections:
- id: valuation-anchor
  title: Valuation Anchor — October 2025 Transaction and What It Proves
  body: 'CAIT''s first and only external financing closed in October 2025 with more than RMB 2 billion
    raised from a select group of institutional investors. Multiple independent reports, including Science
    and Technology Innovation Board Daily and coverage from CnEVPost, Gasgoo, 36kr, and Shanghai Metals
    Market, converge on a pre-money valuation of approximately RMB 9 billion and a post-money valuation
    exceeding RMB 10 billion (~$1.38–1.4 billion at contemporaneous exchange rates). The round process
    launched in July 2025 with a reported minimum ticket of RMB 100 million per investor, closed October
    10, 2025, and attracted a diverse investor set including Boyu Capital (private equity), Guotai Junan
    Securities and Haitong (broker-dealer financial groups), BAIC Industrial Investment (state-backed
    automaker capital), Shanghai Science and Technology Venture Capital (municipal innovation capital),
    and Fortera Capital. Industrial Bank Trust is cited in one report as acquiring a 9.99% stake, the
    single largest disclosed external position. CATL''s shareholding updated to approximately 70.5934%
    post-round, implying total external investor stake of roughly 29.4%.

    Interpreting the transaction correctly requires distinguishing what it proves from what it does not.
    The post-money figure is a negotiated transaction price — it reflects what sophisticated institutional
    investors were willing to pay for a minority stake in a CATL-backed platform entity in October 2025,
    under conditions of limited disclosure and maximum strategic optionality. It does not prove CAIT''s
    intrinsic value, does not validate any specific revenue or earnings multiple, and does not resolve
    the key financial unknowns (revenue, margins, transfer pricing). The investor mix provides independent
    validation of strategic credibility: Boyu is a premier China-focused private equity firm with a track
    record of disciplined growth investing; BAIC''s participation confirms OEM-ecosystem interest; state
    capital signals policy alignment. These anchors reduce the probability that the RMB 10 billion figure
    is pure promotional hype — but they do not eliminate valuation stretch risk from subsequent marks
    if commercialization lags.

    The pre-money / post-money distinction matters for any new investor considering entry after October
    2025. The RMB 9 billion pre-money means that early CATL equity was the effective floor; post-money
    of RMB 10B+ reflects the capital injection. Any secondary market or follow-on transaction above the
    October 2025 post-money price requires additional justification beyond the Series A anchor. No CAIT-specific
    secondary market transactions have been reported as of June 2026. CATL''s April 2026 HK equity placement
    (raising $5 billion at the parent level) does not directly reprice CAIT but confirms parent capital-market
    access and reduces the near-term probability of a distressed CAIT recap.

    The October 2025 transaction also marked a milestone: CAIT became the first entity in China''s intelligent
    chassis sector to reach unicorn status ($1 billion valuation), a designation widely reported across
    domestic and international automotive and financial media. This first-mover premium is real but bounded
    — it was assigned before any OEM partner had reached volume production on Bedrock Chassis, and is
    therefore an expectation price rather than a realized one. The thesis-confirming evidence (Togg partnership
    announced May 2026 for mass production target 2027) arrived after the valuation was set; it provides
    directional support but does not represent de-risked commercialization.'
