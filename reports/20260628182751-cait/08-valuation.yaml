- id: comparable-valuation
  title: Comparable Valuation Set and Peer Multiples
  body: 'With no CAIT revenue disclosed, valuation comparables must be applied as scenario tests — "what
    revenue would CAIT need to justify $1.4 billion under each peer benchmark?" — rather than direct multiple
    applications. The analysis uses four reference frameworks: (1) listed automotive technology suppliers,
    (2) EV platform and manufacturer peers, (3) the failed Western skateboard chassis cohort as a downside
    anchor, and (4) CATL''s own parent financial profile as a strategic backstop proxy.

    Automotive technology suppliers provide the most operationally comparable benchmarks. Aptiv reported
    2025 full-year revenue of $20.4 billion with an enterprise value of approximately $21 billion, implying
    a 1.2x EV/revenue multiple. BorgWarner reported $14 billion in 2025 revenue with an enterprise value
    of approximately $15 billion, a 1.1x EV/revenue multiple. Both are profitable, scaled, and deeply
    integrated with global OEMs. Applied to CAIT at $1.4 billion, these multiples imply CAIT would need
    roughly $1.0–1.3 billion in annual revenue to trade at Aptiv or BorgWarner parity — a level that is
    entirely speculative given current disclosure. The supplier benchmark therefore signals that $1.4
    billion is a significant premium above fundamental supplier comparables unless CAIT''s eventual revenue
    scale proves material.

    EV-adjacent platform companies trade at higher multiples, reflecting growth optionality and software
    differentiation premiums. Rivian reported full-year 2025 revenue of $5.39 billion and achieved its
    first positive gross profit year ($144 million gross profit). Its market capitalization of approximately
    $21 billion implies a P/S ratio of roughly 3.5x–4x, well above traditional suppliers. Mobileye reported
    2025 revenue of $1.89 billion with a market capitalization of $6.6 billion (~3.3x P/S), positioning
    it as a technology-oriented platform supplier with meaningful ADAS content revenue. Applied to CAIT,
    Rivian-level multiples imply CAIT would need approximately $350–450 million in annual revenue to justify
    $1.4 billion. Under Mobileye multiples, approximately $420 million would be required. Both scenarios
    require CAIT to demonstrate substantive revenue within 2–3 years to maintain the valuation.

    The failed Western skateboard cohort (Canoo, Arrival) provides the essential adverse reference. Both
    companies launched with valuations in the billion-dollar range, secured strategic partnerships, and
    declared product launches before collapsing into bankruptcy by 2024–2025. The failure mechanism was
    not unique to Western markets: slow OEM conversion, capital duration failure, and the structural difficulty
    of selling a core chassis stack to OEM customers who prefer control over platform decisions. These
    failure precedents are directly relevant to CAIT''s risk profile, even if CATL''s financial backstop
    meaningfully reduces the probability of a similar liquidity failure.

    CATL''s own parent financial profile provides a structural backstop reference. CATL reported 2025
    revenue of RMB 423.7 billion (~$61.4 billion), net profit of RMB 72.2 billion (~$10.5 billion), and
    approximately CNY 110 billion in net cash at end-2024. Its 2026 P/E estimated at approximately 18x
    and EV/EBITDA around 11x represent a high-growth battery leader profile. CAIT at RMB 10 billion implies
    it is priced at approximately 2.4% of CATL''s market capitalization — a small but not negligible premium
    for what is still a pre-revenue subsidiary. This parent- fraction lens confirms the October 2025 valuation
    is not economically implausible from a strategic portfolio perspective; it is a real option on the
    platform''s commercialization anchored against CATL''s proven manufacturing and financial strength.

    Zeekr (Geely-backed), which targeted a $5.1 billion IPO valuation in 2024 on $7.28 billion in 2023
    revenue (~0.7x P/S), provides a Chinese EV market IPO precedent. Chinese OEM IPO multiples at the
    lower end of the 0.7–2.5x P/S range, consistent with wider regulatory and governance discounts, suggest
    that CAIT''s eventual IPO would likely need to demonstrate meaningful revenue before reaching any
    multiple above the October 2025 transaction price.'
