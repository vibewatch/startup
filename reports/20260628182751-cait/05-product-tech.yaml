company:
  name: CAIT
chapter:
  number: 5
  title: Product & Technology
  summary: >
    CAIT's Bedrock Chassis platform—commercially branded CIIC—integrates a fourth-generation
    Cell-to-Chassis battery structure, chassis domain controller, and standardized SDV interfaces
    into a unified skateboard that entered mass production in China in 2024 with AVATR as launch
    customer, and signed its first overseas deal with Turkish OEM Togg in April 2026. Company-stated
    safety claims (85% crash energy absorption, a 120 km/h pole crash test without fire) are backed
    by CATL's own proprietary testing protocols, not yet by independent Euro NCAP or UNECE
    certification, representing a material verification gap for European deployment. The 1+1+1
    localization model and the 12–18 month development-cycle pitch are commercially compelling but
    early-stage outside China, with only one overseas production commitment confirmed as of the
    report date.

sections:
  - id: platform-overview
    title: Platform Overview and Commercial Value Proposition
    body: |
      Contemporary Amperex Intelligent Technology (CAIT) offers OEM partners the Bedrock Chassis,
      a battery-centric integrated intelligent chassis that the company commercially brands as CIIC
      (Chassis-Integrated Intelligent Computing). Launched by CATL at a ceremony in Shanghai on
      December 24, 2024, CAIT positioned the Bedrock as the world's first standalone integrated
      intelligent chassis offered as a commercial product to passenger vehicle brands. The platform's
      distinctive claim is consolidating battery cells, electric drive, thermal management, and
      chassis domain controller into a single skateboard unit, eliminating the traditional separation
      between battery pack and vehicle structure.

      The commercial proposition rests on three core characteristics articulated by CAIT: internal
      integration (all key systems unified), chassis-body decoupling (the upper body or "top hat"
      can be designed independently from the lower platform), and external openness (standardized
      APIs aligned with the COVESA Vehicle Signal Specification standard). CAIT states this
      combination reduces OEM vehicle development time from 36 or more months to 12–18 months,
      a figure that, if corroborated at scale, represents a meaningful competitive advantage for
      capital-efficient market entrants. Yang Hanbing, CEO of CAIT-SH, stated at launch that the
      platform "activates a trillion-yuan market" by enabling modular, personalized vehicle design.

      The 1+1+1 localization model governs the commercial structure of overseas deployments: one
      chassis technology platform, one industrial supply chain, and one local domestic automotive
      brand partner. This model was applied to the April 2026 Togg agreement, the platform's first
      overseas passenger vehicle production commitment.
    claimRefs: [CE001, CE002, CE003, CE004, CE012, CE013, CE026, CE038]
    tableRefs: [TE002]
    figureRefs: [FE002]

  - id: core-architecture
    title: Core Technical Architecture
    body: |
      The Bedrock chassis architecture integrates six functional layers from structural cells to
      software-defined vehicle interfaces. At the foundation, fourth-generation Cell-to-Chassis
      (CTC) technology embeds battery cells directly into the chassis frame as load-bearing
      structural elements, eliminating conventional battery module housings and improving both
      volumetric energy density and crash protection. CATL describes this as sharing a structural
      design between cells and chassis, so that deformation energy is absorbed by the combined
      cell-chassis assembly rather than propagated to the cabin.

      The structural layer uses a three-dimensional biomimetic tortoise shell geometry that couples
      the body energy-unit framework. Materials are submarine-grade hot-formed steel at 2,000 MPa
      and aerospace-grade aluminum alloy at 600 MPa, combined with an aircraft-carrier arresting
      structure that disperses forces across multiple pathways during impact. The energy management
      layer incorporates thermal management, an 800V high-voltage architecture, and a proprietary
      high-voltage safety system. The motion control layer places a chassis domain controller that
      centralizes suspension, braking, and steering management, enabling software-defined vehicle
      (SDV) updates and coordinated energy-motion control.

      At the intelligence layer, the platform implements mechanical, software, and EE (electrical/
      electronic) decoupling to support L3–L4 autonomous driving integration. CAIT showcased CIIC
      at the COVESA Networking Showcase during CES 2025, where the platform was presented as aligned
      with the COVESA Vehicle Signal Specification (VSS) for open, multi-OEM API interoperability.
      At the same event, CAIT signed a memorandum of understanding with the Intelligent Racing
      Foundation (IRF) for AI-powered racing chassis development. The top body interface layer
      provides standardized mechanical, software, and EE connectors enabling a "one chassis,
      multiple vehicle models" product family strategy.
    claimRefs: [CE004, CE005, CE006, CE010, CE014, CE015, CE016, CE017, CE028, CE029, CE032, CE042]
    tableRefs: [TE003]
    figureRefs: [FE001]

  - id: safety-engineering
    title: Safety Engineering and Validated Performance Claims
    body: |
      The Bedrock chassis's headline safety claim is that it passed a 120 km/h frontal central pole
      impact test without fire, explosion, or thermal runaway—well beyond the 56 km/h standard
      applied in China's C-NCAP assessment program. CATL quantifies the severity gap: at 120 km/h,
      collision energy is 4.6 times that at 56 km/h, and in a pole impact (contact area 1/6th of a
      full-width frontal), per-unit-area impact pressure is 21 times the C-NCAP reference. CATL
      states the integrated chassis absorbs 85% of vehicle collision energy, versus approximately
      60% for conventional chassis designs.

      Three specific battery-level safety mechanisms underpin the platform. NP (No Propagation)
      technology in each cell prevents thermal runaway from propagating to adjacent cells. A
      high-ductility energy-absorbing insulation film isolates cells under mechanical deformation.
      The high-voltage safety system disconnects the circuit within 0.01 seconds of impact and
      completes residual energy discharge within 0.2 seconds. CATL cells also passed sled impact
      tests at 60 km/h, 90-degree bending tests, and breakthrough sawing tests without fire or
      explosion—all described as industry-first proprietary protocols.

      A critical qualification applies to all of these safety data points: the tests are CATL's
      own proprietary protocols, not submissions to independent third-party certification programs.
      Euro NCAP, UNECE R100 (EV battery safety), and UNECE R155/R156 (cybersecurity) type-approval
      certifications for production vehicles built on the Bedrock platform were not confirmed
      publicly as of the report date. Any European market entry by Togg or other OEM partners will
      require independent type approval under EU Regulation 2018/858, the outcome of which cannot
      be assumed from CATL's internal test results.
    claimRefs: [CE006, CE007, CE008, CE009, CE011, CE030, CE031, CE037, CE040]
    tableRefs: [TE001]
    figureRefs: [FE003]

  - id: deployment-roadmap
    title: OEM Deployment, Partnerships, and Roadmap
    body: |
      The Bedrock Chassis entered mass production in the Chinese market in 2024, with AVATR as the
      designated launch customer at the December 2024 ceremony. Subsequent Chinese OEM commitments
      include JAC Yiwei (January 2025 agreement for model development), Changan Mazda (May 2025
      MOU for CIIC-based NEV co-development), IAT International Automobile Technology (December
      2025 partnership for diverse EV powertrains), and BAIC. T3 Mobility and Ant Group have
      agreements targeting robotaxi deployment on the Bedrock platform. CATL and SAIC Motor signed
      a broader strategic collaboration in January 2025 covering technology R&D, battery swapping,
      and overseas expansion, though the chassis dimension of that agreement was less specific.

      The Neta S Shooting Brake, announced August 2024, was the first production model deployed
      on CIIC. That vehicle has underperformed commercially, and Neta's parent company Hozon New
      Energy Auto Co. was entered into a bankruptcy review case in May 2025 per the National
      Enterprise Bankruptcy Information Disclosure Platform—a cautionary data point about early
      platform partner risk, even though it reflects Neta's broader financial difficulties rather
      than a product defect.

      The first overseas production commitment—a strategic partnership with Togg of Turkey, signed
      April 29, 2026—covers a dedicated platform for three B-segment models, with first mass
      production targeted for 2027. Togg will define user experience, product specifications, and
      digital architecture while CAIT contributes the Bedrock platform and engineering expertise.
      CAIT is actively seeking additional European and Southeast Asian partnerships, with the Togg
      collaboration framed as a "benchmark project" for future deployments. The IAA Mobility Munich
      debut in September 2025 served as the primary Western-market showcase.
    claimRefs: [CE018, CE019, CE020, CE021, CE022, CE023, CE024, CE025, CE027, CE033, CE034, CE039]
    tableRefs: [TE005]
    figureRefs: [FE004]

  - id: trust-compliance-risks
    title: Trust, Compliance, and Technical Risk Assessment
    body: |
      The Bedrock chassis's deep CTC structural integration creates meaningful lifecycle and
      repairability risks that distinguish it from conventional EV platforms. Battery cells that
      serve as load-bearing structural elements cannot be individually replaced in a standard
      workshop: any collision that deforms the chassis-battery assembly may require wholesale
      chassis replacement rather than a modular pack swap. Insurance markets have previously
      flagged structural battery integration as a driver of higher total-loss rates on EVs; Tesla's
      structural battery Model Y packs generated precedent cases of write-offs after moderate
      collisions. CTC architectures amplify this risk because the integration is more complete
      than CTB (Cell-to-Body) designs.

      OEM adoption concerns are documented. An unnamed technical executive at an automaker cited
      in Caixin media (reproduced in iChongqing) stated: "The prevailing view in the industry is
      that the chassis represents the 'soul' of a vehicle, and automakers are reluctant to cede
      control." CAIT's early platform adopters (AVATR, Neta) have equity relationships with CATL,
      which reduces their independence as market-validation proof. Changan Mazda marks the first
      CIIC collaboration with an OEM lacking a prior CATL equity tie. The ride, handling, and NVH
      baseline being set by CATL limits brand differentiation for OEM adopters at the chassis layer.

      European deployment readiness is incomplete. Bedrock-based vehicles require EU type approval
      under Regulation 2018/858 and compliance with UNECE R155/R156 cybersecurity requirements
      before European sales. CATL's patent portfolio covers CTC structural integration and battery
      safety mechanisms (per PatSnap analysis indicating thousands of active filings), but specific
      Bedrock chassis IP defensibility and licensing terms are undisclosed. Service network
      infrastructure for CTC-based vehicles requires specialized tooling and training that is still
      developing globally outside China, creating additional lead time for European deployment.
    claimRefs: [CE035, CE036, CE037, CE040, CE041, CE042, CE043]
    tableRefs: [TE004]
    figureRefs: []

