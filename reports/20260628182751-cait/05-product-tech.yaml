callouts:
  - calloutType: strength
    title: "Battery-Structural Integration as a Genuine Engineering Differentiator"
    body: >
      CAIT's CTC integration is technically substantive—not just a marketing rebranding of
      cell-to-pack. The 4th-generation design eliminates battery modules entirely, using cells as
      structural load-bearing elements within a 3D tortoise-shell frame. This enables higher
      volumetric energy density, reduced component count, and a chassis safety architecture that
      CATL's own tests indicate absorbs more collision energy than conventional designs. No other
      standalone commercial chassis platform currently offers equivalent battery-structural
      integration for passenger vehicle OEMs.
    claimRefs: [CE005, CE006, CE007]

  - calloutType: risk
    title: "Safety Claims Rest on Proprietary Protocols Without Independent Certification"
    body: >
      Every headline safety figure—85% collision energy absorption, 120 km/h pole crash without
      fire, 0.01 s HV disconnect—is derived from CATL's own test protocols, not from independent
      Euro NCAP submissions, UNECE R100 type approvals, or any national new-car assessment program.
      European deployment via Togg requires type approval under EU Regulation 2018/858 and UNECE
      R155/R156; neither was confirmed as in progress as of June 2026. This is a material risk for
      the investment thesis if European deployments are central to CAIT's growth narrative.
    claimRefs: [CE040, CE037]

  - calloutType: risk
    title: "Structural Battery Integration Creates Unresolved Repairability and Insurance Risk"
    body: >
      CTC integration makes battery replacement equivalent to chassis replacement after significant
      collision damage. Insurance markets across multiple EV architectures have flagged structural
      battery integration as a driver of higher total-loss rates. Repair requires specialized
      tooling, training, and parts availability that is nascent outside China. These risks are
      systemic to the CTC design philosophy and are not specific to CAIT, but they create friction
      for OEM partners and end-market consumers, particularly in European markets with right-to-
      repair regulations.
    claimRefs: [CE035, CE036]

  - calloutType: insight
    title: "Changan Mazda Partnership Provides First Non-Equity-Aligned OEM Validation"
    body: >
      Most of CAIT's Chinese OEM partners (AVATR, Neta) have equity or investment relationships
      with CATL, reducing their independence as adoption signals. The May 2025 Changan Mazda MOU
      marks the first CIIC collaboration with a joint-venture OEM that lacks a prior CATL equity
      tie-in, providing a more credible—though still early-stage—signal of commercial platform
      attractiveness beyond captive customers.
    claimRefs: [CE021, CE036]

