  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: "independent-crash-test-verification"
      missingEvidence: >
        Third-party Euro NCAP, UNECE R100, or independent laboratory crash test results for
        production-spec Bedrock Chassis vehicles confirming the 85% collision energy absorption
        and 120 km/h pole crash performance without fire.
      whyItMatters: >
        CATL's headline safety claims are the primary commercial differentiator for the Bedrock
        platform; without independent certification, the claims cannot be relied upon for
        investment thesis underwriting or European regulatory compliance planning.
      diligencePath: >
        Request CATL/CAIT internal crash test protocols and raw data under NDA; track Euro NCAP
        submissions and UNECE R100 type approval filings for AVATR and Togg production vehicles.
      relatedQuestionRefs: [QE003]

    - type: missing-source
      severity: material
      topic: "12-18-month-cycle-OEM-confirmation"
      missingEvidence: >
        Independent OEM confirmation of the 12–18 month vehicle development cycle from a brand
        that has completed a vehicle program on the Bedrock platform without a prior CATL equity
        relationship.
      whyItMatters: >
        Development cycle reduction is a key commercial pitch to prospective OEM customers; if
        the actual cycle with integration complexity is closer to traditional timelines, the
        platform's competitive value proposition weakens substantially.
      diligencePath: >
        Obtain program schedules and start-to-production timelines from JAC Yiwei or Changan
        Mazda under NDA; compare with CATL's stated benchmark.
      relatedQuestionRefs: [QE013]

    - type: missing-source
      severity: material
      topic: "EU-type-approval-proceedings"
      missingEvidence: >
        Confirmation of formal type approval proceedings for any Bedrock chassis-based vehicle
        under EU Regulation 2018/858, including the applicable technical service and approval
        authority names, test schedule, and expected timeline.
      whyItMatters: >
        European deployments are central to CAIT's international growth narrative via the Togg
        partnership; unconfirmed type approval creates timeline risk for the 2027 production target.
      diligencePath: >
        Query EU type approval registers (e2etypeapproval.eu), request Togg's regulatory roadmap
        disclosure, and confirm CATL's engagement with European technical services (TÜV, IDIADA).
      relatedQuestionRefs: [QE015]

    - type: private-evidence-only
      severity: minor
      topic: "HV-disconnect-independent-certification"
      missingEvidence: >
        Independent third-party certification data for the 0.01-second high-voltage circuit
        disconnection specification from a recognized testing authority such as TÜV, UL, or
        a national EV safety authority.
      whyItMatters: >
        The HV disconnect speed is critical for first-responder safety and for UNECE R100
        compliance; without independent verification, the figure is reliant on CATL self-report.
      diligencePath: >
        Request CATL's HV safety test protocols and any third-party validation reports under NDA;
        review UNECE R100 test submissions when available.
      relatedQuestionRefs: [QE021]

    - type: missing-source
      severity: minor
      topic: "Bedrock-regulatory-certification-registry"
      missingEvidence: >
        Entries in publicly accessible regulatory certification registries (e.g., China CCC,
        Euro NCAP, UNECE type approval) confirming that the Bedrock Chassis has been certified
        to any national or international standard.
      whyItMatters: >
        Independent certification evidence would confirm platform readiness for production-scale
        deployment in regulated markets, strengthening OEM adoption signals beyond CATL's
        self-reported internal test results.
      diligencePath: >
        Search China CCC (China Compulsory Certification) database and MIIT vehicle announcement
        catalog for Bedrock-based vehicle models; search Euro NCAP published test database.
      relatedQuestionRefs: [QE024]

