- id: financial-capital-parent-dependency-risk
  title: Financial, Capital Access, and Parent-Dependency Risks
  body: |-
    CAIT's strongest mitigant is also one of its largest structural risks: dependence on CATL. Fitch affirmed CATL at A- with Stable Outlook in June 2025 and reported net cash of CNY110 billion at end-2024, giving the parent real capacity to support subsidiaries through a prolonged commercialization cycle. That materially reduces immediate insolvency risk for CAIT relative to a stand-alone startup.

    But parent strength is not the same thing as protected minority economics. Public evidence does not disclose transfer pricing between CATL and CAIT, does not separate chassis platform economics from CATL's broader battery business, and does not show ring-fenced capital support dedicated to CAIT. If CAIT remains pre-revenue while operating as a battery-dependent platform subsidiary, outside investors are underwriting parent willingness, not just platform quality.

    The downside case is that capital access becomes selectively expensive before CAIT proves independent revenue conversion. Kharon's reporting on CATL's Hong Kong IPO process suggests the Pentagon designation already affected bank participation, while broader automotive supplier data points to a tougher financing environment for ambitious but unproven programs. In that frame, CAIT's next financing or eventual IPO could clear at lower valuation than product announcements alone imply, even if CATL itself remains investment grade.
