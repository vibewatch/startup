- id: customer-concentration-oem-adoption-risk
  title: Customer Concentration and OEM Adoption Risks
  body: |-
    The clearest observed commercial risk is that CAIT's earliest showcase program ran into customer failure before it could become durable revenue. Neta/Hozon entered bankruptcy proceedings in 2025, accumulated enormous creditor claims, and later became associated with sales-inflation allegations. That sequence is especially damaging because Neta was not a hypothetical future logo but the first widely publicized CIIC program intended to demonstrate platform conversion from partnership to production.

    The commercial lesson is not only customer concentration; it is conversion fragility. If the first anchor customer fails financially, CAIT can lose more than near-term revenue. Tooling, receivables, engineering effort, and market proof all become impaired at once. Public restructuring reports suggest recoveries may be uncertain, while adverse reporting indicates CATL stopped deliveries to Neta over unpaid debts, confirming that the failure propagated upstream into the supply relationship itself.

    Broader market context worsens the read-through. Fitch and CNBC both describe a difficult 2026 Chinese EV demand and pricing environment, while BCG's supplier study underscores industry-wide margin pressure. That does not prove CAIT's remaining pipeline fails, but it does mean future OEM defaults, delayed launches, or platform deferrals should be treated as base-case diligence risks rather than tail events. The related signal from Huawei's HIMA ecosystem—bringing in battery suppliers beyond CATL—also shows that large OEM groups are actively preserving optionality instead of deepening single-source dependence.
