- id: geopolitical-supply-chain-export-risk
  title: Geopolitical, Supply Chain, and Export-Control Risks
  body: |-
    CAIT inherits CATL's geopolitical posture because the platform is inseparable from Chinese battery supply, processing scale, and IP. ORF's 2025 analysis argues that China controls roughly 70-95% of processing capacity across key EV-battery minerals, reinforcing that even a globally ambitious CAIT rollout remains rooted in a highly concentrated national industrial base. This concentration is a competitive advantage in cost and scale, but it also exposes overseas expansion to national-security policy from both directions.

    From the U.S. side, decoupling logic can shrink the addressable market or raise the political cost of choosing a CATL-adjacent chassis architecture. From the Chinese side, export-control and licensing measures over battery technology can slow or block the very 1+1+1 localization model CAIT is using to pitch overseas partners. A localization strategy works only if technology, process know-how, and supply-chain components can move across borders on acceptable timelines.

    For investors, the key point is that geopolitical risk is not a single sanction event. It is a dual-sided system in which U.S. designation risk, Chinese export licensing, and upstream mineral concentration can all interact to delay launch schedules, discourage OEM commitment, and compress strategic optionality in Europe, Turkey, Southeast Asia, and any future North American ambition.
