chapter:
  number: 7
  title: Risks
  summary: |-
    CAIT's risk profile is dominated by a tight coupling between unproven platform conversion and a very visible parent. The most material observed adverse event is Neta's bankruptcy, which impaired CAIT's earliest commercial program and demonstrated how fast customer distress can erase platform proof, tooling value, and receivable quality. At the same time, GB38031-2025, expanded EU supplier liability, CATL's Pentagon designation, battery-tech export controls, and CATL-linked capital-market friction all raise the bar for moving Bedrock from launch narrative to repeatable global production. CATL's A- / Stable rating and CNY110 billion net cash provide real near-term backstop strength, but public evidence still leaves CAIT dependent on parent discretion rather than demonstrated stand-alone unit economics.
sections:
- id: technology-safety-risk
  title: Technology, Safety, and Product Compliance Risks
  body: |-
    CAIT's core technical risk follows directly from Bedrock's value proposition: the battery is not just a pack supplier component but a structural element of the chassis. That architectural choice creates upside if CATL's claims hold, but it also compresses safety, repairability, software, and homologation risk into a single subsystem. Public reporting around the December 2024 launch repeats CATL's 120 km/h central-pole crash claim and no-fire/no-explosion outcome, yet the evidentiary base remains dominated by CATL-originated or CATL-amplified testing narratives rather than independently disclosed third-party certification outcomes.

    The regulatory bar also moved upward in CAIT's home market. China's GB38031-2025 standard makes no-fire/no-explosion performance the explicit battery safety requirement for new type approvals from July 2026, and public explainers add fast-charge-cycle and bottom-impact expectations that matter for a skateboard platform. The problem for CAIT is not that Bedrock necessarily fails the new standard; it is that no public source confirms which OEM programs have already entered certification, which labs are engaged, or whether any Bedrock configuration has completed the new approval sequence.

    A second-order technical risk is lifecycle ownership. Structural battery integration can improve stiffness and crash performance, but it also raises the chance that collision damage becomes a whole-chassis economics problem instead of a modular pack repair. For fleet and insurer stakeholders, this creates a real possibility that the platform proves technically safe yet commercially cumbersome in post-collision service. Cybersecurity disclosure is similarly thin: no public evidence was found of ISO/SAE 21434 certification, a PSIRT function, or Bedrock-specific penetration-test results, even though an SDV-ready chassis embeds safety-critical software at the platform level.
