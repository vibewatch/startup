  evidenceGaps:
  - id: GR001
    type: private-evidence-only
    severity: blocking
    topic: CAIT-revenue-unit-economics
    missingEvidence: CAIT has not disclosed any revenue, per-platform license fees, engineering service margins, or chassis unit shipment volumes. The October 2025 RMB 10 billion valuation is pre-revenue. No CATL earnings segment reporting separates chassis platform economics from battery supply. The fundamental investment underwriting basis is therefore platform potential, not demonstrated unit economics.
    whyItMatters: An investor cannot independently verify whether CAIT's growing OEM pipeline will translate into sustainable revenue at commercially viable margins without this data.
    diligencePath: Request CAIT-SH audited financial statements from CATL investor relations; request per-program unit economics (license fee per platform, NRE engineering fee, battery bundle margin) under NDA.
    relatedQuestionRefs:
    - QR026
    - QR028
  - id: GR002
    type: missing-source
    severity: material
    topic: GB38031-2025-compliance-timeline
    missingEvidence: No public disclosure confirms which Bedrock Chassis OEM programs have initiated GB38031-2025 type approval testing or their certification timeline as of July 1, 2026.
    whyItMatters: Programs not certified by July 2026 (new type approvals) cannot launch in China. A certification gap could delay CAIT's first post-AVATR production program.
    diligencePath: Request CATL/CAIT GB38031-2025 certification schedule from investor relations; ask which accredited Chinese labs are engaged; confirm whether any existing CATL battery systems already carry GB38031-2025 certification.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
  - id: GR003
    type: missing-source
    severity: material
    topic: EU-type-approval-Togg-timeline
    missingEvidence: As of the run date, no public disclosure confirms that Togg has initiated EU WVTA (under Regulation 2018/858) for Bedrock-based models, submitted to an EU-accredited lab, or received any preliminary type approval.
    whyItMatters: EU WVTA takes 12–24 months. If not initiated by mid-2026, Togg's 2027 production target is at serious risk of slipping.
    diligencePath: Request Togg/CAIT EU type approval submission timeline; confirm which EU-accredited technical service is engaged for UN R94, R95, R100, and R155 testing.
    relatedQuestionRefs:
    - QR007
    - QR008
  - id: GR004
    type: private-evidence-only
    severity: material
    topic: transfer-pricing-related-party
    missingEvidence: Transfer pricing between CATL (as sole battery supplier) and CAIT (as platform integrator) is a material related-party transaction that has not been publicly disclosed in CATL's segment reporting, CAIT press materials, or the October 2025 fundraising announcements.
    whyItMatters: If CATL charges CAIT above-market battery prices or retains platform IP economics, CAIT's eventual gross margins are structurally impaired. External investors in the October 2025 round may have agreed to related-party terms they cannot independently verify.
    diligencePath: Request CATL's formal policy on intra-group transfer pricing for subsidiary battery supply; obtain CAIT's audited COGS breakdown; compare to market prices for equivalent LFP battery systems.
    relatedQuestionRefs:
    - QR027
  - id: GR005
    type: missing-source
    severity: material
    topic: cybersecurity-architecture-disclosure
    missingEvidence: CAIT has not publicly disclosed its cybersecurity architecture for the Bedrock Chassis BMS, OTA update pathway, or chassis domain controller. No ISO/SAE 21434 certification, PSIRT function, or penetration test results are publicly available.
    whyItMatters: EU UNECE R155 makes cybersecurity type approval mandatory; a BMS compromise in a structurally integrated battery chassis could produce physical safety consequences. Investors and OEM partners cannot independently assess software security risk.
    diligencePath: Request CATL/CAIT ISO/SAE 21434 certification status; confirm whether a formal PSIRT function exists; ask for penetration test scope and last audit date; check if Bedrock BMS software development lifecycle documentation is available.
    relatedQuestionRefs:
    - QR009
