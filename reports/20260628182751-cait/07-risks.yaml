- id: regulatory-legal-liability-risk
  title: Regulatory, Legal, and Liability Risks
  body: |-
    CAIT's regulatory risk is unusually intertwined with CATL's geopolitical profile. The single most visible event was the Pentagon's January 2025 designation of CATL under Section 1260H as a Chinese Military Company. CATL publicly denied any military connection and said the measure should not have a substantially adverse impact, but independent reporting still links the designation to procurement exclusion, broader FEOC-style scrutiny, and reluctance by major U.S. financial institutions to support CATL-linked capital markets activity. For a subsidiary whose commercialization model depends on parent credibility, the practical consequence is reputational and market-access drag even without a blanket commercial ban.

    Legal risk also increased in Europe. Public legal analyses in 2025 note that the EU's revised product liability framework broadens the circumstances in which software providers, component suppliers, and upstream system integrators can face direct claims. A battery-integrated chassis compresses body, battery, controls, and software into one platform, which means a fire, software defect, or crash-energy-management failure can turn into a multi-party liability chain involving OEM, battery supplier, and chassis platform provider simultaneously.

    The Chinese regulatory clock is immediate rather than theoretical. GB38031-2025 became the controlling domestic battery-safety gate from July 2026, and any mid-program design not already aligned to the standard may face added re-test cost, schedule slippage, or launch risk. No CAIT-specific litigation or public enforcement action was identified in the reviewed sources, but the absence of observed disputes should be read as a stage-of-disclosure fact, not proof that liability allocation is resolved.
