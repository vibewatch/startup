      - number: '3.5'
        title: 护城河耐久性、切换成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              CAIT 的主要竞争护城河是 CATL 电池集成优势。没有直接同业能在没有多年工程项目或与 CATL 自身建立战略合作的情况下，复制 CATL 的电池研发深度、电芯制造规模或 CTC 结构集成 IP。2025 年
              10 月外部融资后，CATL 持有 CAIT 70.59%，确保电池护城河有组织锚点，而不只是合同关系。

              但同一种锁定也是商业约束。采用 Bedrock Chassis 的 OEM，会在车型项目生命周期内承诺使用 CATL 的化学体系、定价和供应连续性。S&P Global 对中国 OEM
              动态的分析记录显示，Huawei HIMA 在 2026 年明确分散电池来源，以降低对 CATL 的依赖——这是最可见的 OEM 抵触模式，限制了 CAIT 买方宇宙。这不是理论担忧，而是 CAIT
              自己中国市场中可见的现实竞争动态。

              切换成本双向存在。OEM 一旦在 Bedrock 上完成车型设计，切换到不同平台或退回内部底盘，通常需要启动新的车型项目——18-36 个月，且重做工程成本达数亿美元。这会给已经启动的项目创造持久收入，但也抬高了
              OEM 初次考虑采用时的门槛。新的 CAIT 项目销售周期很长，关系密集，并集中在每个潜在客户少数项目决策者手中。

              Tier-1 供应商替代风险周期更长，但可信。随着 ZF、Bosch 和 Magna 加深 EV 专属集成能力、建设线控底盘域能力，它们会逐步缩小部件供应与完整平台供应之间的技术差距。如果 OEM
              能在未来三到五年内，用 ZF、Bosch 和第三方电池伙伴拼出接近 CAIT 质量的平台，CAIT 的价值主张就会收窄为仅剩 CATL 电池内容优势——这个护城河仍有意义，但比完整平台差异化叙事窄得多。
