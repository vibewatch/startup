      - - 能源管理层
        - 热调节；HV 电力交付；安全隔离
        - 800V 热管理；HV 断电系统（0.01 s）；充电管理
        - 第三方充电网络对 800V 的兼容性在全球还未普及
      - - 运动控制层
        - 底盘动态；线控执行；能量-运动协同控制
        - 底盘域控制器；线控转向、制动、悬架
        - 单控制器架构形成安全关键的单点故障风险
