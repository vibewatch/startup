      - number: '7.3'
        title: 客户集中度与 OEM 采纳风险
        blocks:
          - type: paragraph
            body: >-
              已观察到的最清晰商业风险，是 CAIT 最早的展示项目尚未变成持久收入，就先遭遇客户失败。Neta/Hozon 于 2025 年进入破产程序，累积巨额债权申报，之后又卷入销量虚增指控。这一序列尤其伤害大，因为
              Neta 不是一个假设中的未来 logo，而是首个被广泛宣传、用来证明平台能从合作转入量产的 CIIC 项目。


              商业教训不只是客户集中度，而是转化脆弱性。如果首个锚定客户财务失败，CAIT 失去的可能不止近期收入。工装、应收账款、工程投入和市场证明会同时受损。公开重整报道显示回收可能存在不确定性；负面报道则显示 CATL
              因 Neta 欠款而停止供货，确认失败已经向上游传导到供应关系本身。


              更广泛的市场背景让这一读法更糟。Fitch 和 CNBC 都描述了 2026 年中国 EV 需求与价格环境的困难，BCG 供应商研究也强调全行业利润率压力。这不能证明 CAIT 剩余管线会失败，但意味着未来
              OEM 违约、上市延误或平台延期，应被视为基准情形下的尽调风险，而非尾部事件。Huawei HIMA 生态引入 CATL 之外的电池供应商，也释放出相同信号：大型 OEM
              集团正主动保留选择权，而不是加深单一来源依赖。
