      - number: '4.2'
        title: 成本结构与资本开支强度
        blocks:
          - type: paragraph
            body: >-
              CAIT 的独立成本结构未披露。分析必须用三个输入从第一性原理搭建：产品架构（电池集成底盘）、母公司生态（CATL 电池制造）和同业基准（Rivian、中国底盘供应商、CATL 自身利润率）。

              电池内容是任何 CTC 一体化平台的主导成本驱动。对包含 CATL 锂电芯、热管理和结构集成的完整一体化 EV 底盘来说，电池包通常占平台总材料成本超过 30%。其余成本栈包括铝压铸和结构挤压件（约
              15-20%）、线控电子和底盘域控制器（10-15%）、电驱单元（10-15%）、悬架和转向模块（10-15%）、热管理和冷却系统（5-10%）、软件集成和测试（5-10%）。这些比例是基于平台制造基准的分析师估算，不是
              CAIT 报告数字。

              集团内电池供应是 CAIT 成本结构中最大的未知项。CATL 作为持股 70.6% 的母公司，供应构成 CAIT 平台成本大头的电芯内容。转让价格——是按公平市场价，还是关联方优惠价——决定 CAIT
              独立毛利率看起来像独立底盘集成商，还是实质上由母公司补贴。CATL 公开文件在集团层面承认关联交易，但没有逐项列出 CAIT 专属转让条款。

              资本开支方面，CAIT 确认其首个生产基地位于江西宜春，2023 年 1 月签约，2024
              年末被描述为已运营。该设施资本开支金额未公开披露。可比平台制造启动资本开支——工装、自动化装配、电池集成测试台架和铸造基础设施——初始可扩展产线通常需要 $100M–$200M。CATL
              母公司资本开支计划（现金储备合计超过人民币 3000 亿元，2024 年和 2025 年研发支出分别为人民币 186 亿元和 221 亿元）构成显著隐性支撑：CAIT 能以独立创业公司无法获得的条件，调用
              CATL 的制造工程、知识产权和供应链基础设施。这是 CAIT 相对西方同业最重要的财务结构优势，但也意味着独立资本开支负担和研发成本，在完全商业公平口径下可能被低估。
