        - 有条件观察名单 — 若无收入披露，不应以高于 2025 年 10 月投后估值进入
        - CAIT 未披露收入；该交易锚点是唯一公开估值参照
        - 中
      - - 估值立场
        - 定价基本合理但不确定性高 — 2025 年 10 月锚点可被解释为战略期权溢价，而非盈利倍数
        - 可比公司组显示，按不同框架需要 $350–1,300M 收入支撑；所有零收入场景都是预测
        - 中
      - - 置信水平
        - 中 — 母公司实力和投资人质量提供锚点；零披露限制独立验证
        - CATL 为 A 级、净现金 CNY110B；Boyu/BAIC 投资人组合可信；CAIT 收入、利润率或合同金额均未公开
        - 中
      - - 风险评级
        - 高 — 商业化早期、平台转化未证实、Neta 减值、CATL Pentagon 指定背景
        - Neta 项目失败；确认量产为零；西方同类企业破产可作结构类比
        - 高
      - - 目标回报 / 持有
        - 基准情景：按 2025 年 10 月进入计算，4–5 年名义回报 20–100%；只有在确认 OEM 量产的牛市情景下才有吸引力
        - 情景分析；无管理层指引可用
        - 低
    claimRefs:
      - CV001
      - CV034
      - CV035
      - CV036
    notes: 评分是基于截至 2026-06-28 公开证据作出的分析判断；置信度反映披露质量，而非结果发生概率。
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点
      - 证据
      - 什么会改变该观点
    rows:
      - - 支持 — CATL 母公司兜底消除了资金续航风险，这是西方可比公司的最大失败模式
        - CATL 净现金 CNY110B、Fitch A- 评级、2025 年研发支出 RMB22.1B；70.6% 持股显示承诺
        - CATL 出售或大幅减持；CATL 信用恶化；CAIT 资本支持被明确附加条件
      - - 支持 — 在结构性顺风很强的赛道中占据先发独角兽位置
        - 多家独立媒体确认 2025 年 10 月投后估值 >RMB10B；尚无其他中国滑板底盘实体披露可比估值
        - 可信国内竞争者以显著更高估值融资，证明 CAIT 并非具备结构优势的平台
      - - 支持 — Togg 合作显示国际 OEM 对 Bedrock 有需求
        - CATL 官方新闻稿和 PRNewswire 公告（2026 年 5 月）；electrive.com 和 carnewschina.com 独立确认；3 款车型项目，目标 2027 年 SOP
        - Togg 项目在 SOP 前延迟或取消；12 个月内没有签下进一步国际 OEM 合作
      - - 反对 — 零收入披露让每个估值视角都带有猜测性
        - 已审阅来源中没有披露 CAIT 财务报表、NRE 收费表、单车销量提成费率或合同金额
        - 管理层在 IPO 申报前披露季度或年度收入和毛利率数字
      - - 反对 — Neta 破产抹去了展示客户，也暴露结构性交易对手风险
        - Neta 2025–2026 年破产程序；CNBC 报道 64,719 辆预登记车辆，说明看似商业规模未能转化；Neta CIIC 项目已终止
        - CAIT 公开承认 Neta 减值，并在 12 个月内展示同等或更大 OEM 的替代项目
    claimRefs:
      - CV005
      - CV008
      - CV014
      - CV029
      - CV032
    notes: 论点仅反映公开证据；未审阅 CAIT 管理层声明或非公开披露。
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 关键假设
      - 隐含估值（2028–2030）
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - Togg 2027 年 SOP 推进；到 2027 年底另有 2 个 OEM 项目确认；CAIT 到 2028 年披露 >RMB1B NRE / 许可收入；A+H 双重上市，按未来收入 3–5x 定价
        - RMB30–50B（~$4–7B）；较 2025 年 10 月进入价回报 3–5x
        - CATL-OEM 信任缺口、欧盟认证延迟、CATL Pentagon 指定限制 IPO 投资者基础、电池价格战压缩利润率
        - 低至中 — 需要 OEM 转化和披露同时兑现，目前尚未发生
      - - 基准
        - Togg 量产及另一个 OEM 项目确认；部分收入披露（仅 NRE）；CAIT 于 2029–2030 年双重上市，较 2025 年 10 月交易有温和溢价
        - RMB12–20B（~$1.7–2.8B）；较 2025 年 10 月进入价名义回报 20–100%
        - 转让定价不透明持续；看不到第二个主要 OEM 转化；IPO 前需下一轮融资，倍数不明
        - 中 — 与当前里程碑轨迹一致，但取决于未披露的商业结果
      - - 熊市
        - 到 2027 年底除 Togg 外无新增 OEM；收入披露不及预期；下一轮融资估值持平或下降；CATL 母公司地缘政治约束升级
        - RMB5–8B（~$700M–$1.1B）；较 2025 年 10 月进入价亏损 30–50%
        - 重演 Neta 式客户失败；CATL Pentagon 指定污点加深；OEM 采用的结构性阻力被证明持续存在
        - 中 — Neta 先例、零收入证明和地缘政治阴影让该情景并非小概率
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV033
    notes: 所有情景数值均为分析师构建；未使用管理层指引或经审计的 CAIT 财务数据。概率信号为定性判断。
  - id: TV004
    title: 可比估值表
    enumerationScope:
      basis: >-
        Covers the five most operationally or structurally comparable public companies and one private-market precedent
        transaction for CAIT as of June 2026; CAIT-specific multiples are scenario back-calculations (implied revenue at
        current valuation), not observed market multiples, because CAIT has not disclosed revenue.
      coverage: partial
    columns:
      - 可比公司
      - 业务 / 相关性
      - 2025 收入
      - 市值 / EV（2025–2026）
      - EV/rev 或 P/S 倍数
      - $1.4B 估值隐含 CAIT 收入
      - 局限
    rows:
      - - Aptiv (APTV)
        - Tier-1 汽车技术供应商（电子电气架构、ADAS）；最接近规模化底盘技术平台供应商的运营可比公司
        - $20.4B
        - EV ~$21B
        - 约 1.2x EV / 收入
        - 隐含 ~$1.2B（远高于任何已知 CAIT 预测）
        - Aptiv 已盈利且具备规模；CAIT 尚未产生收入并依赖单一母公司；倍数不能直接适用
      - - BorgWarner (BWA)
        - 全球传动系统和电动化供应商；作为面向 OEM 的平台技术 B2B 供应商，可与 CAIT 类比
        - $14.0B
        - EV ~$15B
        - 约 1.1x EV / 收入
        - 隐含 ~$1.3B（对近期 CAIT 来说极度拉伸）
        - BorgWarner 客户超过 100 家且高度分散；CAIT 具名 OEM 伙伴少于 6 家，且均未量产
      - - Mobileye (MBLY)
        - Intel ADAS 分拆公司；面向 OEM、由战略母公司支持的技术平台；结构上最类似 CAIT 的母公司分拆定位
        - $1.89B
        - 市值 ~$6.6B；EV ~$5.3B
        - 约 2.8x EV / 收入；约 3.3x P/S
        - 隐含 ~$420–500M（2028–2029 年牛市情景可达到）
        - Mobileye 自成立以来披露收入；CAIT 零披露；Mobileye 的软件内容（EyeQ SoC）比底盘平台拥有更高 IP 防御性溢价
      - - Rivian (RIVN)
        - EV 平台 / OEM，与 Volkswagen 成立 JV；同时包含平台供应和整车制造溢价；可作为早期成长阶段 EV 平台公司的基准
        - $5.39B（FY2025，首次实现正毛利）
        - 市值 ~$20–22B（2026 年中）
        - 约 3.5–4x P/S
        - 隐含 ~$350–400M（3–4 年牛市情景下可信）
        - Rivian 已规模化制造并销售车辆；CAIT 没有确认的量产规模；Rivian 倍数包含消费车品牌溢价
      - - Zeekr（Geely 支持的中国 OEM，2024 年 IPO）
        - 由强势母公司支持的中国 EV OEM；对中国 EV 生态 IPO 倍数和母公司支持型分拆预期最具参考价值
        - $7.28B（2023 年收入）
        - $5.1B IPO 目标估值（2024）
        - ~0.7x P/S（追溯收入）；~1.0–1.5x 未来收入
        - 隐含 ~$1.0–1.4B（若收入兑现，说明当前 CAIT 估值对中国 EV 生态实体接近合理）
        - Zeekr 有实际整车收入；CAIT 没有；Zeekr IPO 倍数反映的是 OEM 定位，而不是 B2B 平台供应商定位
      - - Canoo（GOEV，2025 年 1 月破产）
        - 西方 EV 滑板平台公司，曾融资 >$900M 并申请 Chapter 7；可直接作为独立底盘平台公司结构性失败模式的负面可比
        - 极低（失败时尚未产生收入）
        - 峰值市值 ~$3.3B（2021 SPAC）；2025 年 1 月破产
        - 破产时 N/A；峰值隐含倍数 ~10x 投机性未来收入
        - N/A — 仅作负面基准
        - Canoo 缺少 CATL 式母公司兜底；失败模式是资金续航 + OEM 未转化；母公司支持为 CAIT 部分缓释了该风险，但并未完全消除
    notes: >-
      所有 CAIT 隐含收入数字都是情景反推：它们回答的是「按各可比公司倍数，CAIT 需要多少年收入才能支撑 $1.4B？」——不是 CAIT 收入预测。公开 CAIT 披露未确认这些收入水平中的任何一个。区间从 $350M（按
      Rivian P/S）到 $1.3B（按 Aptiv EV/rev）——这说明，相对收入型可比公司，2025 年 10 月估值偏贵；在没有收入披露时，只能用战略 / 期权溢价解释。Mobileye 可比公司给出的
      $420–500M，是中国 B2B 平台分拆公司最可实现的牛市目标。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
  - id: TV005
    title: 论点破裂与退出触发表
    columns:
      - 触发因素
      - 阈值 / 可观察事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 收入披露显示合同经济性低于最低可接受水平
        - 任何公开或向投资者披露的单项目收入低于 RMB 100M，或只有 NRE、没有销量提成的模式
        - 抹去平台销量提成上行空间；可比倍数向 0.5–0.8x EV/revenue 压缩（Aptiv/BorgWarner，并因尚未规模化打折）
        - 退出观察名单头寸；不要以 2025 年 10 月价格或更高价格进入
      - - 第二个主要 OEM 伙伴失败（重演 Neta）
        - CAIT 活跃管线内任何公开确认的停产、破产或 OEM 项目取消
        - 加速 OEM 信任缺口；可比池收窄至仅剩 Togg；显示 CATL 关联 OEM 之外的平台采用存在结构性阻力
        - 将基准和牛市情景重新评估为熊市情景；维持头寸前要求 OEM 管线多元化证据
      - - CAIT 下一轮融资估值持平或下降
        - 公开宣布 CAIT 以等于或低于 RMB 10B 的估值融资
        - 确认估值下调轮风险；2025 年 10 月投资者面临减记；IPO 时间线进一步后移
        - 只有估值下调轮条款较 Series A 显著改善经济性时才重新进入
      - - CATL Pentagon 指定范围扩大并限制香港资本市场
        - U.S. Treasury、DoD 或 OFAC 行动实质性限制 CATL 关联实体获取美国机构资本
        - CAIT IPO 投资者基础显著收窄；双重上市情景的倍数被压缩
        - 所有情景下调估值；熊市情景概率显著上升
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV033
      - CV038
      - CV039
    notes: 阈值是可观察代理指标，而非合同定义事件；触发因素并不穷尽。
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - CAIT 收入和毛利率
        - 未公开披露年度、季度或项目级收入数字
        - 没有收入，就无法套用基本面倍数，每个情景都仍是纯粹猜测；这对所有估值视角都很重要
        - 管理层披露或经审计财务；在任何投资者沟通中索取；IPO 申报需要
      - - CATL-CAIT 转让定价政策
        - 已审阅来源均未公开 CATL（70.6% 所有者）与 CAIT 之间的集团内电池供应定价
        - 转让定价决定 CAIT 独立毛利率；若低于市场价，CAIT 经济性实际上受到补贴，独立质量低于合并经济性所暗示的水平
        - 向 CAIT 管理层索取关联方交易政策；对照 CATL 公开申报文件中的关联方披露章节核验
      - - OEM 合同条款和结构
        - 任何 OEM 项目的合同金额、最低销量、里程碑付款安排或单车费用均未披露
        - 没有合同条款，就没有 NRE 或销量提成收入预测基础，也无法确认项目会产生实质收入
        - 索取 Togg、JAC Yiwei 和 Avatr 的合同摘要；获取最低销量或 take-or-pay 承诺；确认 Togg 协议是有约束力协议还是框架协议
      - - 股东权利和优先权结构
        - 2025 年 10 月轮次条款尚未公开披露，包括清算优先权、反稀释、转换权和信息权
        - 优先权悬置决定退出情景下所有利益相关方的经济结果；不利条款可能显著压低普通股权益
        - 向管理层索取条款清单摘要或股权结构表；如可获得，审阅 2025 年 10 月投资人文件
      - - IPO 计划和上市时间线
        - 截至 2026 年 6 月，CAIT 尚未正式宣布 IPO 或 A+H 上市意向
        - 退出周期是回报计算的首要不确定性；没有 IPO 可见度，资本会被锁在未产生收入且没有流动性的非上市实体中
        - 监测 CATL 母公司公告和 CAIT 年度股东更新；跟踪 STIB 或 HKEX 申报活动
    claimRefs:
      - CV006
      - CV026
      - CV027
      - CV037
      - CV040
    notes: 所有事项均反映截至 2026-06-28 缺少公开披露；清单按对估值的重要性排序，而非按解决难易度排序。
