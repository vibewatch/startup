      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，CAIT 的财务图景由六个硬披露缺口和一个结构性缓释项共同决定。缓释项——CATL
              母公司支持——真实且有分量，降低了急性资本困境的概率。披露缺口同样真实，合在一起使任何可信的财务承销都无法成立。

              六个核心尽调阻断项是：（1）CAIT 未披露任何期间、任何项目的收入，收入质量和确认机制完全未知。（2）未披露毛利率或销售成本，无法判断 CAIT
              当前已交付项目是高于还是低于盈亏平衡。（3）未披露烧钱速度或现金头寸，无法计算独立 runway。（4）未披露 CATL 上游电池供应与 CAIT
              之间的关联交易转让定价；对一家电池集成底盘公司而言，这是决定成本结构的最大单项因素。（5）未披露任何已签 OEM 伙伴的 NRE 费用结构、项目里程碑付款节奏或单车 royalty 条款。（6）CAIT
              作为独立实体没有经审计的单体财务报表；唯一可用的经审计财务数据是 CATL 合并口径，无法单独拆出 CAIT。

              负面证据让这些缺口更紧迫。Neta 是 CAIT 最早公开点名的 CIIC 伙伴，却在 2025 年陷入急性财务困境，因此 Neta S CIIC 800V
              项目在减值前是否产生过有意义收入，必须打问号。中国商业媒体（CBN Weekly，经 36kr）在 2025 年 10 月记录称，多数中国新势力 OEM 已经开发自有平台，这压缩了 CAIT
              的主要可服务市场，也说明商业窗口可能比融资叙事暗示的更窄。西方同业的失败组——Canoo 清算、Arrival
              关闭——说明当商业爬坡慢于预期时，数十亿美元估值、高知名度合作和机构背书，并不能保护尚未规模化的平台供应商免于资本持续期风险。

              因此，CAIT 的财务结论是不对称的：下行风险有 CATL
              托底并被一定程度封住；但上行——一个可规模化、能产生收入、经济性透明的平台业务——仍完全无法从公开数据验证。投资承销至少需要管理层披露：按项目拆分的当前收入、已交付车辆毛利率、CATL
              转让定价条款、烧钱速度与现金头寸，以及每份在执行 OEM 协议的具体合同结构。
