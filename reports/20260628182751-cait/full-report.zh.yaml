companyProfile:
  summary: >-
    CAIT 是 CATL 位于上海的智能底盘子公司，成立于 2021 年，负责把以电池为中心的滑板底盘平台商业化，面向车企供货。公司当前围绕 CIIC 家族和 Bedrock Chassis
    展开，产品把电池、电驱、热管理和底盘控制整合进可复用的下车体平台。公开证据支持这样一个结论：CAIT 在 2025 年 10 月完成首轮外部融资，金额超过人民币 20 亿元，估值超过人民币 100 亿元；但商业化仍处早期。公司有多个
    OEM 关系，Togg 首个海外项目目标 2027 年投产，Neta 的困境则削弱了最早的验证点。因此，CAIT 对 CATL 具有战略重要性，但作为独立公司，运营披露仍然不足。
