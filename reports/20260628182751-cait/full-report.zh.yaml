  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与分类框架
        blocks:
          - type: paragraph
            body: >-
              CAIT 竞争的市场细分在 2020 年以前几乎不存在：作为 B2B 单元出售给 OEM 客户的外包一体化 EV 底盘平台。要绘制竞争格局，需要把 OEM 面对的替代方案分成四类。

              直接同业是像 CAIT 一样，把完整 EV 平台或滑板底盘作为 B2B 产品卖给 OEM 的公司。在中国，这一集合活跃且在增长。U Power 和 PIX Moving 是公开记录最多的替代方，分别在 2024
              年 12 月完成 Series B 和 B1 轮，并有明确产品发布和面向 OEM 的 go-to-market 策略。在西方市场，原有直接同业到 2025 年初已基本被 Chapter 7
              破产和管理程序淘汰：Canoo 和 Arrival 曾是最突出的西方滑板平台公司，如今已不再运营。REE Automotive 是一家以色列商用车专家，已在 Nasdaq
              上市，仍在运营，但服务的是不同买方群体——北美商用车队运营商，而不是中国或出口市场的乘用车 OEM。

              相邻竞争者是 Tier-1 底盘系统供应商——ZF Friedrichshafen、Bosch、Magna International 和 Continental——它们向同一批 OEM
              客户供应单个或部分集成的底盘部件（转向、制动、悬架、线控电子）。这些公司不销售带电池集成的完整平台，但它们提供模块化积木，OEM 可用来组装自有底盘，以替代整体外包。它们的规模、认证记录和既有 OEM 关系，是
              CAIT 难以轻易复制的结构性优势。仅 ZF 一家就声称自己是汽车底盘技术的全球市场领导者，并已有 NIO 和 Mercedes-Benz 线控系统供货项目。

              存量替代方案是 OEM 内部 EV 平台。BYD 的 Cell-to-Chassis 垂直整合和 Huawei HIMA 的全栈智能底盘方案，与 CAIT 争夺同一类 OEM 注意力，但渠道不同——BYD
              内化全部环节；Huawei 向 OEM 伙伴提供技术。对新进入 OEM 来说，现状替代方案是从 Tier-1 供应商分别采购部件并开发自己的集成层——更慢、更贵，但保留完整架构控制。
