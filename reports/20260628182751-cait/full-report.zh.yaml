      - - Togg 3 款车型家族扩张（EU/Turkey）
        - Togg 是唯一已确认的独立海外承诺；3 款车型提供一定范围韧性，但全部指向 2027+
        - 高 – 如果 EU 型式认证延误或 Togg 战略变化，海外管线会缩到零
