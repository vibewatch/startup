  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与产品范围
        blocks:
          - type: paragraph
            body: >-
              CAIT 的市场不是整个 EV 电池行业，也不是完整汽车供应链。它是一个具体且新近出现的 B2B 细分市场：面向整车厂出售的外包一体化智能 EV 底盘平台。产品——最显眼的是 CIIC 和 Bedrock
              Chassis——把电芯、Cell-to-Chassis 结构集成、热管理、悬架和高压安全架构打包成单一平台，车企无需分别采购并集成各个部件即可采用。对缺少资本或工程规模、无法从零搭建专属 EV 平台的 OEM
              客户来说，价值主张是压缩上市时间、降低开发成本。

              市场边界对投资分析很关键。如果把所有 EV 电池供应都纳入边界，CAIT 会被放在 CATL 旁边，像一个电池零部件制造商，并对应一个数千亿美元级的可服务市场，而 CAIT
              只是小规模参与者。如果只看结构或机械底盘子总成，又会低估收入，因为 CAIT 收费的是一体化系统，而不只是结构件。正确边界应是外包 EV
              一体化平台产品——覆盖开发服务、平台许可费，以及作为整体供应的电池底盘硬件。这个市场位于原始电芯制造下游、车身设计上游。

              现状替代方案是成熟 OEM 自己维护的内部 EV 平台项目。Volkswagen 的 MEB、Hyundai 的 E-GMP、BYD 的各类自有平台，都靠内部工程投入服务同一个 OEM
              需求。对已经沉没大量工程资本的成熟 OEM 来说，从自研切换到外包平台的成本很高；对尚未绑定内部平台的新进入者来说，切换成本较低。这给 CAIT 创造了最清晰的近期可触达人群：EV 创业公司、进入新地区的出口型
              OEM，以及在次级车型线上探索、但自有平台 ROI 不足的传统 OEM。
