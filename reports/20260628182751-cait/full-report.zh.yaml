  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价不透明
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，已审阅的一手或二手来源中，CAIT 未公布任何收入数字、价格表、单车费用或授权费率。缺乏披露本身就是高置信观察：这不是研究覆盖不足造成的数据缺口，而是与 CAIT
              仍作为中国上市母公司旗下私人子公司运营相一致的刻意姿态。已审阅来源——无论是 CATL 自己的年报、香港招股书，还是 2025 年 10 月融资新闻稿——都没有 CAIT 收入线或项目级合同金额。

              因此，收入模式只能从产品定位和可比案例推断。CATL 官方材料把 CAIT 的商业安排描述为“1+1+1”本地化模式：CATL 技术、本地市场制造伙伴和 OEM
              品牌。平台不是作为离散硬件单元出售，而是作为联合开发与技术授权安排：OEM 共研上车体，CAIT 提供电池集成的下底盘基础。这一结构指向至少四类潜在收入流：（a）工程和定制服务费（NRE
              费用），在项目开发期一次性或分期支付；（b）与认证和量产准备事件绑定的项目里程碑付款；（c）车辆进入量产后可能产生的单车平台授权版税；（d）上游归属于 CATL 而非直接归属于 CAIT
              的电池内容收入。收入流（d）是否并入 CAIT，还是留在母公司，是未知项，也是重大的转让定价尽调问题。

              公开披露的 OEM 合作事件——VinFast（2022）、Neta（2023）、JAC Yiwei（2025）、Avatr（2024 发布）、Togg（2026）——确认 CAIT
              至少与五个具名交易对手签署商业协议。但这些公告没有任何合同金额、最低采购量承诺或单平台费用。Bedrock Chassis 在 IAA Munich 2025 的首次亮相，以及 2026 年 5 月的 Togg
              公告，全部以技术和战略口径呈现，而非财务口径。可比 B2B EV 平台授权经济（来自覆盖 Rivian、REE Automotive 和中国同业供应商的行业来源）显示，早期规模下每个项目可能有 $5M–$50M
              前置费用，以及每车 $500–$3,000 版税；但这些是场景基准，不是 CAIT 确认数字。任何依赖 CAIT 收入的模型，在管理层披露前都必须把这些输入视作低置信估算。
