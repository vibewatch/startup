    type: flow
    layout: standard
    summary: 该流程追踪从四个主要证据域到整体推荐的证据链。有条件观察名单这一结论，来自强战略锚点与未解决商业证明缺口的组合。
    approximationNotes: 基于截至 2026 年 6 月公开证据的分析推断。节点强度标签是定性评估，并非量化分数。
    claimRefs:
      - CV001
      - CV005
      - CV015
      - CV026
      - CV034
      - CV035
    data:
      nodes:
        - id: parent-strength
          label: |-
            CATL 母公司实力
            A- 评级，CNY110B 净现金
        - id: transaction-anchor
          label: |-
            2025 年 10 月交易
            投后 RMB10B+；投资者组合可信
        - id: comp-assessment
          label: |-
            可比公司组
            相对战略可比标的定价公允；
            相对收入可比标的略显偏高
        - id: risk-overlay
          label: |-
            风险叠加
            零收入；Neta 受损；
            热度溢价；五角大楼背景
        - id: recommendation
          label: |-
            推荐
            有条件观察名单
            定价公允 / 不确定性高
        - id: diligence-gate
          label: |-
            尽调关口
            需要收入披露 +
            OEM 合同条款
            才能形成确信
      edges:
        - from: parent-strength
          label: 降低生存性风险；锚定战略期权价值
          to: transaction-anchor
        - from: transaction-anchor
          label: 设定估值底线；可信但无法独立验证
          to: comp-assessment
        - from: comp-assessment
          label: 确认价格在区间内；收入缺口限制上行空间
          to: risk-overlay
        - from: risk-overlay
          label: 阻止上调至观察名单以上；保留不利情景权重
          to: recommendation
        - from: recommendation
          label: 确信升级路径需要里程碑证据
          to: diligence-gate
  - id: FV002
    title: 估值敏感性 — 关键驱动因素 vs 2025 年 10 月锚点（RMB M）
    type: bar
    layout: standard
    summary: >-
      相对于 2025 年 10 月投后 RMB 10 billion 锚点，CAIT 隐含估值对六个关键上行和下行驱动因素的方向性敏感度。数值是示意性情景调整，不是财务模型输出；均代表分析师基于 2025 年 10
      月交易参照作出的判断。
    approximationNotes: 数值是方向性估计，用来表达各变量对 RMB 10B 锚点的影响幅度，并非精确 DCF 调整。正值代表相对锚点的上行，负值代表相对锚点的下行。
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV025
      - CV028
      - CV032
    data:
      items:
        - label: Togg 2027 SOP 确认 + 第二个 OEM 合作签署
          value: 8000
        - label: 收入披露显示 >RMB500M NRE 加版税
          value: 6000
        - label: A+H IPO 公告并提交 STIB / HKEX 文件
          value: 4000
        - label: 五角大楼指定范围扩大（CAIT 特定影响）
          value: -3000
        - label: 下一轮融资以平轮或下轮估值完成
          value: -4000
        - label: OEM 合作伙伴再次失败（Neta 类事件）
          value: -5000
  - id: FV003
    title: 估值 / 回报区间 — 牛市 / 基准 / 熊市情景（USD 等值，2028–2030 年退出）
    type: range
    layout: standard
    summary: 2028–2030 年退出窗口下，三个情景对应的 CAIT 隐含企业价值区间。所有数字都是基于可比倍数和 OEM 管线假设构建的情景值；均非 DCF 输出或管理层指引。
    approximationNotes: >-
      USD 等值按 RMB 7.1/USD 换算。区间条表示各情景下结果的分布，而非置信区间。2025 年 10 月交易价格（$1.4B）作为参考中点展示。实际退出价值将高度取决于收入披露、OEM 项目确认和 CATL
      母公司的资本市场状态。
    claimRefs:
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
    data:
      items:
        - label: 熊市情景（RMB 5–8B；下轮或困境再资本化）
          low: 700
          high: 1100
          unit: USD M
          detail: >-
            假设到 2027 年底除 Togg 外没有新增 OEM；收入低于预期；下一轮平轮 / 下轮。驱动因素是 Neta 类对手方失败或 CATL 地缘政治升级。相对 2025 年 10 月约 $1.4B
            的进入价格，意味着亏损 30–50%。
        - label: 基准情景（RMB 12–20B；2029–2030 年双重上市，相对 Series A 小幅溢价）
          low: 1700
          high: 2800
          unit: USD M
          detail: 假设 Togg 量产确认，并新增一个 OEM 项目。选择性披露收入。CATL 母公司继续提供资本兜底。按 2025 年 10 月进入价格，4–5 年名义回报 20–100%。
        - label: 牛市情景（RMB 30–50B；3+ 个项目后以 Mobileye 等价倍数 IPO）
          low: 4200
          high: 7000
          unit: USD M
          detail: 假设到 2028 年披露 >RMB1B 收入；确认 3+ 个 OEM 项目；A+H 上市估值为远期收入 3–5x。要求没有重大地缘政治或 OEM 转化挫折。相对 2025 年 10 月进入价格，回报 3–5x。
        - label: 2025 年 10 月交易锚点（参考）
          low: 1380
          high: 1400
          unit: USD M
          detail: 2025 年 10 月 Series A 投后：>RMB 10B（按 RMB 7.1/USD 约 $1.38–1.40B）。投前约 RMB 9B。该高置信公开锚点来自多个独立媒体来源。
  - id: FV004
    title: 投资 KPI — IC 就绪评分卡
    type: kpi
    layout: standard
    summary: 面向投资委员会审议 CAIT 的评分卡，时间点为 2026 年 6 月。所有项目均反映截至运行日的证据质量和分析置信度。
    approximationNotes: 分数和评估基于截至 2026 年 6 月的公开证据。收入和经济性项目反映披露缺失，而非数值为零。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV007
      - CV015
      - CV034
      - CV035
      - CV036
      - CV037
    data:
      items:
        - label: 推荐
          value: Conditional watchlist
        - label: 估值立场
          value: Fairly priced / high uncertainty
        - label: 置信度
          value: Medium
        - label: 风险评级
          value: High
        - label: 估值锚点
          value: '>RMB10B post-money (Oct 2025)'
        - label: 收入披露
          value: None — zero public disclosure
        - label: 母公司财务实力
          value: CATL A- / CNY110B net cash
        - label: 近期关键催化剂
          value: Togg SOP 2027 + revenue disclosure
        - label: 退出窗口
          value: 2028–2030 (A+H IPO path)
        - label: 不利信号数量
          value: 5 — Neta failure, Pentagon, hype premium, transfer pricing opacity, Western comps
