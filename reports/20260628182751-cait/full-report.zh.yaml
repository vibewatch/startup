      - number: '8.4'
        title: 反向估值论点与结构性风险因素
        blocks:
          - type: paragraph
            body: >-
              多个结构性因素说明，不能把 2025 年 10 月交易价格直接当作可投资入场价来接受。这些论点不是确定结论，但它们代表尚未解决的尽调缺口，应该改变任何新投资者愿意支付的价格。

              披露有限是最普遍的反向因素。CAIT 从未公开披露任何收入数字、毛利率或远期合同价值。参与 2025 年 10
              月轮次的机构投资者，很可能拿到了公众无法获得的管理层材料和尽调权限——也就是说，已披露估值可能反映无法独立验证的私人信息。任何新投资者若以 Series A
              价格或更高价格进入，实际上是在依赖一个由非公开披露条件设定的交易价格。信息不对称是 pre-IPO 投资的常见特征，但对 CAIT 尤其尖锐，因为它与 CATL 的关联交易关系不透明。

              转让定价不透明带来结构性估值风险。CATL 作为持股 70.6% 的母公司，向 CAIT 供应电池——这是 CAIT 最大成本项。该供应究竟按独立市场价格、集团优惠价，还是 cost-plus 安排定价，直接影响
              CAIT 独立毛利率，也决定其经济质量。公开披露没有回答这一点。如果 CAIT 利润率靠 CATL 低于市场价的电池供应人为支撑，那么独立业务的吸引力会显著弱于合并口径经济性所暗示的水平。

              炒作溢价风险真实存在，且在行业内可观察。TMTPost 2024–2025 年关于 CATL 首次收入下滑的报道指出，即便母公司拥有主导市场地位，增长放缓时也无法免受投资者情绪转向影响。CAIT
              完全靠预期运转，没有收入锚；因此，中国 EV 供应链叙事中的炒作溢价压缩，会构成实质估值风险。Morningstar 2025 年 10 月分析曾提示，CATL
              股价高于其公允价值估计时可能被高估。母公司层面的情绪修正，很可能传导到 CAIT 的 pre-IPO 估值标记。

              西方 skateboard chassis 失败先例是最强的反向类比。Canoo 在融资超过 $900 million 后，于 2025 年 1 月申请 Chapter 7 破产。Arrival 在融资超过
              $900 million 后，于 2025 年 3 月关闭。两家公司都曾获得 OEM 兴趣表达，推出品牌化平台，并讲述多年商业化叙事。结构性失败模式——OEM 转化慢、资本强度跑在收入转化前面、OEM
              更偏好内部控制——并不受地域限制，也能在 CAIT 的商业管线中看到。CATL 资产负债表消除了资本续航失败模式，但没有解决 OEM 转化风险。

              Neta 伙伴失败说明，即使 CAIT 最紧密的商业关系也有尖锐的交易对手风险。Neta 在 2025–2026 年进入破产程序，CAIT 最早、最常被公开引用的商业展示也随之消失。到 2026 年 6
              月，项目失败意味着 CAIT 无法指出任何一个已经成功规模化、能产生收入的客户。未来每个 OEM 项目都带有与 Neta 身上已经兑现的同类结构性交易对手风险；中国汽车行业仍在整合，这一风险并非小事。

              伙伴和平台锁定风险削弱估值的竞争耐久性。采用 Bedrock Chassis 的 OEM，把核心平台决策外包给 CAIT；这会引发合理的战略依赖担忧，中国商业媒体和分析师报告也把它标记为 adoption
              的结构性障碍。CAIT 收取的平台溢价越高，OEM 越有动力发展内部竞争能力，或支持替代供应商。这一竞争动态会给估值扩张设置上限，除非 CAIT 能拿出可验证的商业锁定证据。
