        title: 图表
        blocks:
          - type: callout
            title: 对投资来说，关键变量是市场边界，不是市场规模
            body: >-
              CAIT 的市场很容易被高估（与全球 EV 支出混同），也很容易被低估（当作小众硬件生意）。正确框架是一个 B2B 平台服务和硬件业务，位于 $4.7B–$12B TAM、年增 18–22% 的市场中；CAIT
              的真实优势是 CATL 的电池 IP 和可信度，而不是滑板架构本身。市场规模测算应从窄口径底盘平台市场出发，再叠加 CATL 每车电池内容，得到单项目真实经济价值。
