      - number: '7.2'
        title: 监管、法律与责任风险
        blocks:
          - type: paragraph
            body: >-
              CAIT 的监管风险与 CATL 的地缘政治画像异常交织。最显眼的事件，是 2025 年 1 月 Pentagon 依据 Section 1260H 将 CATL 列为 Chinese Military
              Company（中国军事公司）。CATL 公开否认任何军事关联，并称该措施不应产生重大不利影响；但独立报道仍把这一认定与采购排除、更广泛的 FEOC-style 审查，以及美国大型金融机构不愿支持
              CATL-linked 资本市场活动联系起来。对一家商业化模式依赖母公司信用的子公司而言，即便没有全面商业禁令，实际后果也是声誉拖累和市场准入阻力。


              欧洲法律风险也在上升。2025 年的公开法律分析指出，EU
              修订后的产品责任框架扩大了软件提供商、部件供应商和上游系统集成商可能直接面对索赔的情形。电池集成底盘把车身、电池、控制和软件压缩进一个平台，这意味着起火、软件缺陷或碰撞能量管理失效，都可能同时牵出
              OEM、电池供应商和底盘平台提供商的多方责任链。


              中国监管时钟是即时的，不是理论问题。GB38031-2025 从 2026 年 7 月起成为国内电池安全的控制性门槛；任何尚未对齐该标准的项目中设计，都可能面临额外复测成本、进度滑移或上市风险。已审阅来源中未发现
              CAIT 专项诉讼或公开执法行动，但没有观察到争议，只应解读为披露阶段事实，而不是责任分配已解决的证明。
