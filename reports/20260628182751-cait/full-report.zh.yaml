  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点——2025 年 10 月交易及其证明内容
        blocks:
          - type: paragraph
            body: >-
              CAIT 首次、也是唯一一次外部融资于 2025 年 10 月完成，从一组选定机构投资人处募得超过 RMB 2 billion。多篇独立报道，包括 Science and Technology
              Innovation Board Daily，以及 CnEVPost、Gasgoo、36kr 和 Shanghai Metals Market 的报道，均指向约 RMB 9 billion 的投前估值和超过
              RMB 10 billion 的投后估值（按当时汇率约 $1.38–1.4 billion）。本轮流程于 2025 年 7 月启动，据报每位投资人最低出资 RMB 100 million，10 月 10
              日完成交割；投资方多元，包括 Boyu Capital（私募股权）、Guotai Junan Securities 和 Haitong（券商金融集团）、BAIC Industrial
              Investment（国资车企资本）、Shanghai Science and Technology Venture Capital（地方科创资本）以及 Fortera Capital。一篇报道称
              Industrial Bank Trust 取得 9.99% 股权，是已披露的单一最大外部持仓。CATL 本轮后持股更新为约 70.5934%，意味着外部投资人合计持股约 29.4%。

              正确解读这笔交易，需要区分它证明了什么、没有证明什么。投后估值是协商出的交易价格——在披露有限、战略可选性最大化的条件下，它反映了成熟机构投资人愿意为一家 CATL 支持的平台实体少数股权支付多少。它不能证明
              CAIT 的内在价值，不能验证任何具体收入或利润倍数，也没有解决关键财务未知数（收入、利润率、转让定价）。投资人组合为战略可信度提供了独立验证：Boyu 是顶级中国私募股权机构，有纪律性成长投资记录；BAIC
              参与确认了 OEM 生态兴趣；国资资本释放政策对齐信号。这些锚点降低了 RMB 10 billion 数字纯属宣传 hype 的概率，但如果商业化滞后，后续估值标记仍有被拉伸的风险。

              对任何考虑在 2025 年 10 月后进入的新投资人而言，投前 / 投后差异很重要。RMB 9 billion 投前估值意味着早期 CATL 股权构成了有效底线；RMB 10B+
              投后估值反映的是资本注入。任何高于 2025 年 10 月投后价格的二级市场或后续交易，都需要 Series A 锚点之外的额外理由。截至 2026 年 6 月，尚无 CAIT 专项二级市场交易报道。CATL
              2026 年 4 月 HK 股权配售（母公司层面募资 $5 billion）不会直接重定价 CAIT，但确认了母公司资本市场通道，也降低了短期内 CAIT 被迫困境式重组资本结构的概率。

              2025 年 10 月交易也标志着一个里程碑：CAIT 成为中国智能底盘赛道首个达到独角兽状态（$1 billion
              估值）的实体，这一称号被国内外汽车和金融媒体广泛报道。这个先发溢价真实存在，但有边界——它是在任何 OEM 伙伴尚未在 Bedrock Chassis
              上达到规模量产前给出的，因此是预期价格，而不是已实现价格。验证投资论点的证据（2026 年 5 月宣布 Togg 合作，目标 2027 年量产）出现在估值确定之后；它提供方向性支持，但不代表商业化已去风险。
