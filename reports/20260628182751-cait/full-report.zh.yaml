      - number: '3.2'
        title: 直接同业画像——U Power、PIX Moving 与 REE Automotive
        blocks:
          - type: paragraph
            body: >-
              U Power（UPOWER Tech）2021 年初创立于中国，是商业上最可比的 CAIT 直接同业。它的 UP Super Board 线控底盘被营销为即插即用平台，可把座舱工程与动力总成开发解耦，帮助
              OEM 客户把整车开发时间压缩到短至 12 个月。公司在 2024 年 12 月完成 Series B 轮，由合肥产投集团领投，博原资本（Bosch 子公司）、Matrix Partners
              China、ZhenFund、China Creation Ventures 和火眼资本参投。早前 AVCJ 报道显示，该轮目标募资 CNY 300-500M（约 USD 43-72M），但最终金额未完整披露。U
              Power 已把总部迁至合肥（投资附带的政府条件），并在那里建设面向商用车、乘用车和底盘的制造、研发和销售生态。关键在于，U Power 没有 CATL 级别的电池集成——其底盘使用第三方电池供应商，也没有
              Cell-to-Chassis 结构电池架构。相对 CAIT，这是实质能力缺口；但对希望平台不依赖任何单一电池供应商的 OEM 来说，这也是定位优势。

              PIX Moving 聚焦自动驾驶优先的城市出行底盘平台，目标是自动驾驶接驳车、物流机器人和小型商用车，而不是 CAIT 所面向的主流乘用车 OEM 市场。它在 2024 年 12 月完成 Series B1
              轮，由浙商创投领投，国家中小企业发展基金共同投资。PIX Moving 技术依赖 3D 打印做底盘集成，可减少零件数量和制造前置时间，但相较传统冲压与焊接，会限制量产可扩展性。公司产品已部署到 30
              多个国家，地理覆盖比 CAIT 当前五国足迹更广，但其可服务 OEM 买方群体更专门。

              REE Automotive 是一家以色列起源、在 Nasdaq 上市的公司，其 P7 平台把电机、悬架、转向和制动布置在每个车轮的模块化“REEcorner”单元中。P7-C 底盘获得 EPA 和 FMVSS
              认证，并在 2024 年末至 2025 年开始向美国经销商和车队客户（包括 U-Haul）发货。截至 2025 年初，REE 报告订单积压约 $150M。REE
              的主要可服务市场是美国商用车车队运营商——不是中国或欧洲乘用车 OEM——因此对 CAIT 当前交易管线来说，它更像部分参考点，而非直接对手。
