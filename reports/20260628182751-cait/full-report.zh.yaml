  - id: TU003
    title: 具名客户验证表
    enumerationScope:
      coverage: exhaustive
      basis: >-
        All nine publicly named OEM and fleet customer relationships in CAIT's pipeline as of June 28, 2026, ordered
        chronologically by relationship commencement. Relationships included if confirmed by at least one dated press
        release, news report, or official announcement.
    columns:
      - 客户
      - 细分
      - 部署 / 使用场景
      - 生产 vs 试点
      - 结果 / 状态
      - 局限
    rows:
      - - VinFast（Vingroup，Vietnam）
        - 海外 OEM
        - CIIC 全球战略合作，覆盖 EV 底盘和电池创新
        - MOU / 合作阶段（Oct 2022）；无生产承诺
        - 合作已宣布，并由 VinFast 官方新闻室确认；2025–2026 无更新
        - 看不到 Bedrock 生产承诺；VinFast 资本约束可能使项目降级；MOU 早于 Bedrock 发布
      - - Neta / Hozon New Energy（中国）
        - 中国本土 OEM – 绑定圈层
        - Neta S Shooting Brake – 首款 CIIC 量产车型；Aug 2024 宣布
        - 已宣布；量产未能启动（原计划 Nov 2024）
        - Neta 母公司 Hozon 于 Jun 2025 进入破产重整；债权人申索 >RMB 26bn；CIIC 项目暂停；Neta 还被曝通过保险方案虚增 64,719 辆销量（Jan 2023–Mar 2024）
        - 最具杀伤力的反向验证点；客户信用和声誉风险都很重；绑定该客户的平台商业化说法被削弱
      - - AVATR Technology（China）
        - 中国本土 OEM – 绑定圈层（CATL 股权 JV）
        - Bedrock Chassis 首发伙伴；乘用车生产（Avatr 06 及衍生车型）
        - 生产 – 已确认 CN 2024–2025 量产；Avatr 06 于 2025 商业发布
        - 最强验证点；平台已进入商业乘用车生产；AVATR 12 和 06 系列于 2025 年发布，搭载 CATL 电池和 Huawei 智能系统
        - 绑定需求：CATL 是股权 JV 伙伴；客户结果不能作为独立推荐；AVATR 在 Bedrock 上的具体单元销量未披露
      - - JAC Yiwei（JAC Group EV 品牌，中国）
        - 中国本土 OEM – 绑定圈层（JAC 是 CATL 长期 OEM 客户）
        - 面向 BEV、EREV 和换电车型的 CIIC-S 战略合作；围绕热管理、电池包和 EE 架构联合研发
        - 合作 / MOU 阶段（Jan 2025）；无生产公告
        - 协议由多个来源确认；范围包括具备换电能力的 EV 车型；按 CATL 说法，联合开发车型预计 2026–2027
        - 没有独立生产时间表；MOU 不具约束力；CATL 所称 2026–2027 窗口未获 JAC Yiwei 独立确认
      - - Changan Mazda（Changan Automobile + Mazda Motor 的 JV，China）
        - 中国本土 OEM – 独立（首个非 CATL 股权 JV）
        - 基于 Bedrock/CIIC 滑板底盘联合开发 BEV 的 MOU
        - MOU 阶段（May 2025）；无生产承诺
        - 首个没有既有 CATL 股权的 OEM 伙伴；Mazda 目标到 2027 年实现 90% 电动化和 300,000 辆年销量； 合作打开新细分验证点
        - MOU 不具约束力；未宣布具体车型或上市日期；Mazda 在中国的销量轨迹仍承压
      - - BAIC（Beijing Automotive Group，中国）
        - 中国本土 OEM – 绑定圈层（BAIC Industrial Investment 是 CAIT Series A 投资方，Oct 2025）
        - 2025 年 CATL/CAIT 材料确认 Bedrock Chassis OEM 合作
        - 合作阶段；无生产公告
        - BAIC 在 CATL 2025 材料中与 AVATR 和 JAC 并列出现；BAIC Industrial Investment 参与 CAIT 的 Series A 融资（RMB 2bn+ 轮，Oct 2025）
        - 公开资料未披露车型、时间表或范围细节；投资方身份带来利益冲突（BAIC 有财务动机释放支持信号）
      - - IAT International Automotive Technology（中国）
        - 中国本土 OEM – 独立（工程集成商 / 整车设计方）
        - 面向多种 EV 动力总成（包括 BEV 和 EREV）的智能底盘战略合作；IAT 提供上车身 / top-hat 集成能力
        - 合作阶段（Dec 2025）；无生产公告
        - 协议于 December 2025 签署；IAT 带来非 CATL 股权 OEM 设计能力；把平台适用性扩展到增程和商用配置
        - IAT 是工程集成商，不是面向消费者的 OEM；下游产量取决于 IAT 拿到终端 OEM 合同；范围方面公开证据很少
      - - T3 Mobility / Ant Group / Hello（Shanghai Zaofu JV，中国）
        - 出行 / 车队 – robotaxi
        - 基于 Bedrock Chassis 的 Level 4 自动驾驶 robotaxi 车队；T3 Mobility 提供网约车网络；Ant Group 提供 AI / 数据；Hello 提供出行服务
        - JV 设立与合作阶段（Jun–Jul 2025）；未宣布商业部署
        - >-
          Shanghai Zaofu JV 于 Jun 2025 成立，资本 RMB 1.288bn；T3 Mobility 于 Jul 2025 签署合作； 合计投资承诺 >RMB 3bn；CATL 是 Zaofu JV
          股权共同投资方
        - L4 robotaxi 在中国商业部署需要监管放行；Baidu Apollo 和 Pony.ai 已拥有有限商业牌照；未披露车队发布时点
      - - Togg（Turkish Automobile Joint Venture Group，土耳其）
        - 海外 OEM – 独立
        - 面向 3 款 B-segment 电动车的 Bedrock Chassis 平台；目标土耳其和欧洲市场；Togg 保留用户体验、产品规格和数字架构控制权
        - 已签署合作（Apr 29, 2026）；首批量产目标 2027
        - 首个已确认海外生产承诺；由 CATL Chairman Robin Zeng 见证；官方新闻稿直接引用 Togg CEO；1+1+1 本地化模式在土耳其落地；Togg 由土耳其政府财团资助
