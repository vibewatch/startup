      - number: '5.5'
        title: 信任、合规与技术风险评估
        blocks:
          - type: paragraph
            body: >
              Bedrock 底盘深度 CTC 结构集成带来显著的生命周期和可维修性风险，使其不同于传统 EV
              平台。作为承载结构件的电芯，无法在标准维修车间单独更换：任何让底盘-电池总成变形的碰撞，都可能需要整套底盘更换，而不是模块化电池包替换。保险市场此前已指出，结构电池集成会推高 EV 全损率；Tesla 结构电池
              Model Y 电池包已经出现中度碰撞后报废的先例。CTC 架构比 CTB（Cell-to-Body）设计集成更彻底，因此放大了这一风险。


              OEM 采纳顾虑已有记录。Caixin media（经 iChongqing 转载）引用一位未具名车企技术高管称：「行业主流观点认为，底盘代表一辆车的『灵魂』，车企不愿让渡控制权。」CAIT
              早期平台采用者（AVATR、Neta）与 CATL 有股权关系，削弱了它们作为市场验证证据的独立性。Changan Mazda 是首个与 CIIC 合作、且此前没有 CATL 股权绑定的 OEM。CATL
              设定了底盘层面的 ride、handling 和 NVH 基线，也限制了采用该平台的 OEM 在底盘层面的品牌差异化。


              欧洲部署准备尚未完整。Bedrock 车型在欧洲销售前，需要依据 Regulation 2018/858 取得 EU 型式批准，并满足 UNECE R155/R156 cybersecurity 要求。CATL
              专利组合覆盖 CTC 结构集成和电池安全机制（PatSnap 分析显示有数千件有效申请），但 Bedrock 底盘的具体 IP 防御力和授权条款未披露。CTC
              车辆的服务网络基础设施需要专用工具和培训，而中国以外的全球市场仍在建设，这会给欧洲部署带来额外提前期。
