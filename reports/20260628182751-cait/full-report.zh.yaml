      - - 中国 EV 出口扩张
        - 驱动因素
        - 近期（现在–2028 年）
        - 中国 OEM 和供应链正进入东南亚、中东、欧洲、拉美；在缺少本土平台能力的市场，CAIT 可作为 OEM 的平台赋能方
        - 跟踪 OEM 出口目标，并按 SOP 日期确认 Togg 和 VinFast 项目进展
      - - EU / 区域 EV 强制目标和监管
        - 驱动因素
        - 中期（2027–2030 年）
        - 欧洲、Turkey、东南亚的排放法规加快 EV 采用，拉动平台方案的增量需求
        - 监测 EU CO2 标准执行，以及 Turkey 本土 EV 产业政策是否为 CAIT 带来顺风
      - - OEM 信任和责任风险
        - 约束
        - 近期（持续）
        - OEM 不愿把结构底盘外包给第三方；基于 CAIT 的车辆一旦发生安全事故，CAIT 和 OEM 都会直接面临声誉和法律风险
        - 审计 CAIT 的保修 / 责任模型；检查是否有任何与 CIIC 或 Bedrock 相关的公开安全或质量事件
      - - 认证复杂度和监管碎片化
        - 约束
        - 近期 → 中期
        - CN/EU/TR/ASEAN 的碰撞、电池安全和 EMI 标准不同，每个市场都要单独认证；海外部署会增加 12–24 个月和显著成本
        - 确认 Togg EU/Turkey 认证时间表；检查 CATL 是否已接触型式认证机构
      - - 供应商锁定和单一来源依赖
        - 约束
        - 持续
        - 采用 Bedrock 的 OEM 依赖 CATL 电池化学体系和供应；Huawei HIMA 转向多元化、减少对 CATL 的依赖，说明 OEM 抗拒单一来源电池依赖
        - 评估 CAIT 合同条款是排他还是开放供应商模式；检查是否有 OEM 重新谈判或退出
      - - 创业 OEM 交易对手风险
        - 约束
        - 近期（对现有合作方尤其尖锐）
        - Neta 财务困境损害了 CAIT 最早的验证点；中国 EV 市场高度竞争，其他创业 OEM 合作方面临类似资本压力
        - 审查每个已点名 CAIT OEM 合作方的财务健康状况；优先看已获资金、能撑到 SOP 的项目
    notes: 方向和时间反映截至 2026-06-28 的研究状态。「近期」指 2026–2027 年；「中期」指 2028–2030 年。尽调问题来自证据基础中的开放问题，不是已验证结论。
