      - number: '8.3'
        title: 牛市 / 基准 / 熊市情景与概率加权区间
        blocks:
          - type: paragraph
            body: >-
              三个情景覆盖 CAIT 到 2028–2030 年的合理估值区间；这也是最早可信的流动性事件窗口（IPO 或战略出售）。三个情景都明确列出仍未验证的假设；没有一个依赖未披露的 CAIT 财务数据。

              牛市情景假设 Togg 2027 年量产启动按计划推进，到 2027 年底另有两个 OEM 伙伴（一个中国、一个国际）确认量产项目，且 CAIT 到 2028 年披露超过 RMB 1 billion 的实质
              NRE 和单车授权收入。在这些条件下，CAIT 可按 3–5x 远期收入冲刺上市，对应企业价值 RMB 30–50 billion（约 $4–7 billion）。CATL
              香港上市成功以及其资本市场平台（2026 年 4 月 $5 billion 配售获得大幅超额认购）证明，母公司具备为 CAIT 最终孵化上市提供资本市场通道的能力。牛市情景要求：CATL
              母公司依赖不升级，Neta 客户失败情景不重演，中国 EV 市场继续增长，且 Togg 面向土耳其和欧洲市场的 EU / 国际认证成功落地。概率信号：低到中（仍有实质障碍）。

              基准情景以 2025 年 10 月交易价格为锚，并假设中等进展。Togg 2027 年量产推进，至少一个新增 OEM 项目获得公开确认，CAIT 到 2028 年开始选择性披露财务指标（每个项目的 NRE
              收入），但仍没有完整收入报表。CATL 保持多数控制，并继续托底资本通道。CAIT 以 2029 年末至 2030 年 A+H 双重上市为目标（沿用 CATL 模式），隐含估值 RMB 12–20
              billion（$1.7–2.8 billion）。相对 2025 年 10 月入场价，基准情景回报约为 20–100% 名义收益，历时 4–5
              年（风险调整后吸引力有限；更像带股权上行的战略债券）。概率信号：中（与已披露里程碑轨迹一致，但取决于未披露的商业结果）。

              熊市情景假设商业化转化未能加速。Togg 之外一个或多个 OEM 伙伴延迟或终止项目。即使收入披露最终出现，也显示合同结构低于预期。CATL 母公司遭遇更多地缘政治逆风（DoD 指定范围扩大、EU
              供应商限制），限制 CAIT 周边资本生态。CAIT 为资助宜春量产爬坡，2028 年前需要下一轮融资，但只能以 RMB 6–9 billion 的持平或下调估值完成。2025 年 10 月投资者面临 down
              round。熊市隐含价值：RMB 5–8 billion（$700M–$1.1B），较 2025 年 10 月入场价亏损 30–50%。概率信号：中（由商业风险高度集中在狭窄 OEM
              管线这一已有充分记录的事实驱动）。
