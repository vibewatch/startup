      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              外包 EV 平台采用的结构性驱动力很强，也有充分记录；但 CAIT 商业速度面对的具体约束同样真实，而且在宣传材料中较少被引用。

              驱动侧最强的力量是竞争下的上市时间压力。McKinsey 关于汽车产品开发的研究记录显示，领先中国 EV OEM 已把从概念到上市的开发周期压缩至约 24 个月，而传统西方 OEM 需要 40–50
              个月。CAIT 的平台主张更激进：CATL 称 Bedrock Chassis 可把整车产业化从 36 个月以上压缩至 12–18 个月。如果这一点能在规模化下成立，对任何试图进入窗口期不足两年的市场的新 OEM
              来说，都是决定性的商业论据。

              第二个驱动来自 EV 竞争加剧带来的成本压力。Wood Mackenzie 在 2026 年北京车展后报告称，中国 EV 市场处于“结构性竞争阶段”，仅靠销量增长不足以支撑盈利，且多家 OEM
              正在撤回零息金融方案，因为利润率被压缩。在这种环境中，创业型 OEM 如果通过外包降低平台开发成本，就能在首个车型项目中获得结构性成本优势。CNBC 的报道印证了垂直整合悖论：BYD
              对供应链的深度控制带来全球最低 EV 成本，但没有资本复制这条路的新进入者无法采用。CAIT 这类外包一体化平台提供了一条中间路线——不如完全垂直整合便宜，但比拼装定制平台更便宜、更快。

              约束侧，OEM 信任和责任分配是主导障碍。一篇 2025 年中国媒体分析（Sohu / 每日经济新闻，被 CAIT 融资报道引用）明确把客户信任、责任分配，以及 OEM
              不愿把核心底盘架构交给第三方供应商，列为一体化底盘模式的结构性销售障碍。这并非 CAIT 特有批评：Canoo 和 REE Automotive 曾在西方市场把外包滑板底盘商业化用于商用车，却遭遇严重采用失败。到
              2026 年，两家公司都面临严重财务困难，车队运营商不愿承诺采用财务脆弱供应商的平台，传统车企则保留平台控制权。类比并不完美——CAIT 受益于 CATL 信誉，而 Canoo 和 REE
              没有——但这种模式确认，外包底盘商业化比技术承诺暗示的更难。

              认证和监管碎片化构成第二层约束。CATL 自己的 Bedrock Chassis 营销提到中国安全认证，但国际部署需要在每个市场分别完成车型认证。PatSnap 对 CTC
              技术的分析指出，现行汽车安全标准并非为底盘集成电池系统设计，因此需要新的测试方法，验证周期也会显著拉长。对 Togg 来说，到 2027 年完成基于 Bedrock
              的车型在土耳其和欧盟的认证，将是一个行业首创里程碑，并带有有意义的执行风险。一体化系统的可维修性和可服务性也是相关担忧——如果电芯故障可能需要更换结构部件，车队买方在评估 10–15
              年资产寿命的总拥有成本时会格外在意。

              最后，供应商锁定风险会影响 OEM 决策。OEM 一旦把车型项目建在 CAIT 的 Bedrock Chassis 上，就在该项目生命周期内依赖 CATL 的电池化学体系、定价和供应连续性。Huawei HIMA
              据报在 2026 年转向分散 CATL 之外的电池供应，说明 OEM 对关键输入避免单一供应商依赖的本能更广泛存在；同样的本能也会给任何单一来源一体化平台供应商制造摩擦。
