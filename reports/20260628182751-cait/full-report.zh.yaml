      - number: '6.3'
        title: 留存、集中度风险与客户信号质量
        blocks:
          - type: paragraph
            body: >
              CAIT 的客户模型无法直接套用标准 SaaS 或经常性收入指标。OEM 平台授权是长周期、项目级商业关系：一旦 OEM 为某个车型项目选择 Bedrock 平台，真正的“留存”问题，是该 OEM
              是否会为第二款车型或衍生车型再次采用。CAIT 未披露 NRR、GRR、合同期限或授权费结构。留存的唯一代理，是具名客户是否宣布后续项目；截至运行日期，除 AVATR 外，尚无已知具名客户做到这一点。


              客户集中度风险高，并且结构性绑定 CATL 的股权生态。九个具名关系中，AVATR 是唯一确认量产的客户，而 AVATR 本身就是 CATL 持股的 JV，因此它是 captive
              demand，不是开放市场证据。JAC Yiwei、BAIC 和 Changan Mazda 与 CATL 有长期电池供应关系。T3 Mobility 由 FAW、Dongfeng 和 Changan 支持（均为
              CATL OEM 客户）。只有 Togg 和 VinFast 完全位于 CATL 股权轨道之外，而 VinFast 状态不明。这个模式说明，平台早期牵引力更多来自 CATL
              伙伴生态的杠杆，而不是底盘自身优势带来的独立商业拉力。


              Neta 案例最清楚地展示了 MOU-to-SOP 转化失败的样子。行业洞察平台 36kr（经 Economic Observer）指出，作为第三方供应商，CAIT 面临一个结构性门槛：底盘历史上一直被视为
              OEM 的核心能力。Victory Bird Strategic Consulting 的 Chen Qingqing
              写道：“汽车制造商是否真的愿意把底盘生产交给第三方，仍是一个问题。”当底盘和车身由不同主体生产时，责任划分和数据所有权问题又会加重这一顾虑。


              行业分析师 Chen Qingqing 还观察到，第三方底盘公司“预计会先在商用车、特定场景 Robotaxi，以及部分追求极致成本效率的中低端乘用车领域取得突破”。这个框架与 CAIT 自身的车队 JV
              策略（T3/Ant/Hello）一致，也说明近期可服务市场可能比 CAIT 完整 OEM 管线暗示的更窄。


              本报告总体评估是谨慎正面：CAIT 已经完成第一步、也是最难的一步——与 OEM
              客户一起，在中国把电池中心底盘投入实际量产；同时，它也搭起了跨细分市场和地域的多元管线。但管线主要停留在协议阶段，最先进的国内项目（Neta）已经崩塌，首个真正独立的海外承诺（Togg）距离量产还有一年以上。截至运行日期，CAIT
              的客户故事合作多、出货少，投资人应把具名关系视为管线指标，而非已确认收入信号。
