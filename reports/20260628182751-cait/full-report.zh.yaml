      - number: '2.2'
        title: 市场规模：多重视角与明确不确定性
        blocks:
          - type: paragraph
            body: >-
              估算 CAIT 可服务市场需要多重视角，因为没有任何单一公开数字精确追踪 B2B 一体化智能底盘细分市场。目前有三个外部数据锚点，每个代表不同范围。

              视角 1——全球 EV 产量背景。IEA Global EV Outlook 2026 预测，2026 年全球乘用 EV 销量为 2300 万辆，约占新车销量 30%。BNEF 对同一年给出的数字也是 2300
              万辆，占全球乘用车销量 27%。中国仍是主导生产基地，CAAM 预计 2026 年中国 NEV 销量为 1900 万辆，较 2025 年记录的 1649 万辆同比增长
              15.2%。这些数字勾勒出任何平台供应商可切入的车辆生产外沿。如果每辆车平均平台内容价值为 $500–$2,000，全球产量外沿意味着在完全渗透下，理论年上限为
              $11.5B–$46B；但现实中的平台外包渗透率远低于这一水平，也没有单独披露。

              视角 2——EV 滑板底盘市场。MarkWide Research 估算，2026 年全球电动车滑板底盘市场为 $4.7B，并预测到 2035 年增至 $21.82B，CAGR 为 18.6%。Market
              Growth Reports 给出更宽口径的竞争性估算，认为 2026 年同一全球市场约为 $11.7B，CAGR 区间相近，为 18.6–22.7%。$4.7B 与 $11.7B
              的差异反映定义不同：较窄估算覆盖独立滑板平台产品，较宽估算可能纳入相邻的动力总成和集成服务。二者都是第三方市场研究估算，并未独立审计，应视为数量级锚点，而非精确数字。DIR Market Research
              另行指出，超过 45 家汽车 OEM 和 120 多家专注 EV 的创业公司正在投资柔性底盘框架，指向一个庞大的潜在买方管线。

              视角 3——一体化电池技术市场。PW Consulting / pmarketresearch.com 估算，全球一体化电池技术市场（覆盖 CTP、CTB、CTC、CTV）在 2025 年为
              $78.24B，2026 年预计升至 $102.69B，CAGR 为 25.13%。这是一个宽得多的市场，包含乘用 EV 电池包总体，而不只是外包底盘平台。它把供应链各层级的电池集成都算入，因此高估了 CAIT
              的可服务市场。

              矛盾口径——CATL 的万亿元说法。围绕 CAIT 融资轮的媒体报道曾引用归因于 CATL 高管的万亿元可服务市场表述。截至 2026-06-28 研究日期，公开记录中没有这套口径的方法论。它看起来对应的是全球
              EV 开发、电池供应和底盘制造的合计支出，而不是更窄的外包平台细分市场。准确保留该说法：这是一种宣传性市场规模表述，通过抹平 CAIT 的 B2B 小众市场与更广上游 EV
              供应链之间的区别，放大了可服务宇宙。投资分析应使用证据约束下的窄口径 2026 年 $4.7B–$12B TAM，并把万亿元表述仅当作愿景背景。

              SAM 和 SOM 无法干净拆出。CAIT 的可服务可获得市场取决于近期有多少中国和海外 OEM 项目愿意外包平台开发、单项目商业价值是多少，以及 CAIT
              能同时支持多少项目。这些输入均未公开披露。五个公开确认的 OEM 合作（VinFast、Neta、JAC
              Yiwei、Avatr、Togg）显示项目数量仍是个位数；结合已披露融资需求推断，收入规模近期可能处于人民币数亿元低位区间，与低于 $100M 的年收入画像一致。
