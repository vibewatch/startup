      - number: '4.4'
        title: 同业经济性与可比代理
        blocks:
          - type: paragraph
            body: >-
              CAIT 没有披露财务数据，本章只能用三类参照物搭出审慎的经营经济性代理：CATL 母公司的利润率（上游供应商底线）、Rivian（已具规模的西方 EV 平台制造商），以及 Canoo 和 Arrival
              这一批失败的西方公司（资本持续期参照组）。

              CATL 母公司的经济性给出了最乐观、但仍算合理的基准。2024 年，CATL 全年收入 RMB 362B，毛利率 24.4%，净利润 RMB 50.75B（净利率 14.0%）；尽管碳酸锂价格通缩拉低收入
              9.7%，公司仍保持盈利。2025 年，CATL 收入反弹至 RMB 423.7B（+17%），净利润 RMB 72.2B（+42%）。CATL 2024 年 Q4 毛利率从 Q3 的 31.17% 降至
              15.04%，显著受会计处理驱动，说明电池业务的报告利润率会随会计处理和定价机制剧烈摆动。不能假设 CAIT 能复制 CATL 24.4%
              的毛利率：底盘集成商的制造含量更高，对电池大宗商品的敞口低于纯电芯供应商；CAIT 早期产量下的经济性，也结构性弱于 CATL 已成熟的 GWh 级运营。

              Rivian 2025 全年业绩提供了公开数据中最直接可比的平台制造商样本。Rivian 交付 42,247 辆车，在 $5.4B 收入上实现 $144M 毛利（毛利率约 2.7%），同时需要 $800M
              capex。capex-to-vehicle ratio 约为每辆 $19,000，远高于 CAIT 要跑通商业模式所需的单车平台费经济性。Rivian 2025 年 H1 经营性现金消耗同比下降 94% 至约
              $124M，说明规模和运营聚焦能显著改善现金曲线，但前提是已经砸下大量资本。

              Canoo 和 Arrival 代表资本持续期的失败模式。Canoo 在 2022 年至 2024 年中累计亏损超过 $900M，随后于 2025 年 1 月申请 Chapter 7 破产，最终资产不足
              $50,000。Arrival 在 SPAC 后估值一度超过 $13B，拿到 UPS 送货车合同，但仍在耗尽资本前没能达到量产规模。两家公司都有高知名度合作和机构支持；但都没有 CATL
              等级的母公司支撑。这个失败模式之所以重要，并不是因为 CAIT 前景与它们等同——母公司兜底确实是差异点——而是在缺少可验证收入和现金数据时，它给商业牵引力证据的价值划出了上限。

              中国平台供应商同业方面，ResearchAndMarkets 与 TheAutomotiveData 的行业报告显示，2023 年至 2025 年初，七家国内滑板底盘供应商在 15 轮融资中合计募得 RMB
              1.6B。CAIT 2025 年 10 月单轮融资超过 RMB 2B，已经高于该期间整个赛道的合计募资额，反映出 CATL
              母公司信用背书带来的溢价。市场研究来源给出的同业毛利率指引显示，早期爬坡中的中国底盘供应商约 5–15%，达到规模后约 15–25%；但这些数字来自自报或分析师估算，未经审计。
