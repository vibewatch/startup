      - number: '1.4'
        title: 商业生态与反向证据
        blocks:
          - type: paragraph
            body: >-
              合作时间线解释了为什么 CAIT 值得关注，但还不应获得成熟平台的估值溢价。公开里程碑从 2022 年 VinFast 开始，随后是 2023 年 Neta、2024 年基于 Neta S
              的首款车型叙事、2025 年初 JAC Yiwei、Bedrock 发布时的 Avatr，以及 2026 年作为首个海外乘用车项目的 Togg。这一序列显示其覆盖中国和国际 OEM，但反向证据同样重要。Neta
              是最早被广泛宣传的 CIIC 伙伴，后来陷入严重财务困境，并与停产、债权人重组和可疑销售做法相关，削弱了 CAIT 最干净的早期验证点。后续一篇中国报道还指出，客户信任、责任分配，以及 OEM
              不愿把核心底盘栈外包，是第三方滑板平台的结构性销售障碍。换句话说，CAIT 比只有概念的出行创业公司更好，因为它有真实母公司、真实产品和真实签约伙伴；但公开记录仍更多依赖已签合作和投产目标，而不是已经按 CAIT
              经济口径出货的具名规模化量产车型。
