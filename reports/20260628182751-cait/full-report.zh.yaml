      - number: '8.5'
        title: 建议、退出准备度与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              总体估值立场是：2025 年 10 月交易价格「定价基本合理，但不确定性高」。这一立场来自以下证据链：（1）Series A 锚点由可信机构投资者设定，他们获得了非公开管理层信息；（2）CATL
              的财务实力和战略承诺实质降低了生存风险；（3）可比公司集合确认，对于中国一个早期、高可选性、母公司支持的技术平台，这笔交易落在可辩护估值区间内；（4）反向因素——零收入披露、转让定价不透明、西方同类公司失败、炒作溢价风险——使得该估值不能被称为「有吸引力」。建议为「有条件观察名单」：在以
              2025 年 10 月价格或更高价格投入资本前，先跟踪（a）首个 OEM 项目量产，（b）任何收入披露，（c）下一轮融资估值信号。

              退出准备度有限。截至 2026 年 6 月，CAIT 尚未提交 IPO 申请。沿用 CATL 自身双重上市路径（深圳 A 股为主、香港二次上市），最早合理 IPO 窗口是 2028–2030
              年。公开市场没有二级流动性。2026 年 4 月 CATL 香港股权配售（募资 $5 billion，150+ 机构投资者，大幅超额认购）证明，母公司生态能够大规模调动全球资本——这对 CAIT
              最终上市环境是支持信号。但 CAIT IPO 需要穿越 CATL 的 Pentagon designation
              背景（美国银行参与受限），并拿出经审计的独立财务报表；这些报表目前既未公开披露，也没有即将披露的迹象。

              信心水平校准为中等。正面因素包括：CATL 为 A 级评级，拥有 CNY 110 billion 净现金；Series A 投资者联盟可信；Togg
              合作是一个真实的国际里程碑；中国智能底盘市场有明确结构性顺风。负面因素包括：零收入披露让每个情景仍只是预测；Neta 失败消除了最强的早期证明点；估值下限只取决于 CATL
              母公司维持支持的意愿。风险评级为高，与前文判断一致：CAIT 拥有真实资产和真实母公司支持，但尚未证明足以支撑高于观察名单定位的商业转化。
