  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术、安全与产品合规风险
        blocks:
          - type: paragraph
            body: >-
              CAIT 的核心技术风险直接来自 Bedrock 的价值主张：电池不只是电池包供应商部件，而是底盘的结构件。如果 CATL
              的主张成立，这一架构选择能带来上行；但它也把安全、可维修性、软件和型式认证风险压缩进同一个子系统。围绕 2024 年 12 月发布会的公开报道反复引用 CATL 的 120 km/h
              中央柱碰主张和不起火、不爆炸结果，但证据基础仍主要由 CATL 发起或放大的测试叙事构成，而不是独立披露的第三方认证结果。


              CAIT 本土市场的监管门槛也在抬高。中国 GB38031-2025 标准从 2026 年 7
              月起，把不起火、不爆炸性能明确列为新型式批准的电池安全要求；公开解读还加入了快充循环和底部碰撞预期，这些都与滑板平台相关。CAIT 的问题不是 Bedrock 必然无法通过新标准，而是没有公开来源确认哪些 OEM
              项目已经进入认证、使用哪些实验室，或是否已有任何 Bedrock 配置完成新的批准流程。


              第二层技术风险是生命周期归属。结构电池集成可以提升刚度和碰撞表现，但也提高了碰撞损伤从模块化电池包维修变成整套底盘经济性问题的概率。对车队和保险方而言，平台可能技术上安全，却在碰撞后服务中商业上笨重，这是真实可能性。网络安全披露同样稀薄：尽管面向
              SDV 的底盘在平台层嵌入安全关键软件，公开证据仍未发现 ISO/SAE 21434 认证、PSIRT 功能或 Bedrock 专项渗透测试结果。
