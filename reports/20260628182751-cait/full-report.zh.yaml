      - number: '3.3'
        title: 相邻 Tier-1 供应商与存量 OEM 平台
        blocks:
          - type: paragraph
            body: >-
              CAIT 价值主张近期最可信的竞争压力，不是来自同业滑板平台公司，而是来自持续加深 EV 底盘集成能力的成熟 Tier-1 汽车供应商。ZF Friedrichshafen 自称是汽车底盘技术全球市场领导者，并在
              IAA Mobility 2025 展示 SELECT 平台和 Chassis 2.0 架构，把线控转向、线控制动和实时车辆健康监测作为一体化底盘域提供。ZF 已拿到 NIO ET9 首发和 2026 年起
              Mercedes-Benz 的量产合同。Bosch 和 Continental 都在扩展智能底盘控制模块（ICCM）产品家族，瞄准 EV 平台所需的线控系统。Markets and Markets 把 Bosch
              和 Continental 列为全球线控市场领先玩家。Magna International 提供 EtelligentDrive 平台，功率可从 40 扩展到 350kW，兼容 400V 到 800V
              架构，作为完整电驱包供应 OEM 伙伴，并已为 Mercedes-Benz 纯电越野车提供 eDS Duo。

              Tier-1 供应商与 CAIT 的关键区别在于范围。Bosch、ZF 和 Magna 供应的是由 OEM 组装进自有平台的部件和子系统；它们不提供预装电芯、OEM 无需额外结构工程即可采用的完整一体化底盘。这是
              CAIT 的主要差异化——但也意味着 CAIT 面临自建还是购买的比较：只要 OEM 拥有工程资源，就能用最优 Tier-1 部件拼出 CAIT 大部分能力。

              在中国国内存量玩家中，Huawei HIMA 是最重要的竞争动态。Huawei 与 Seres、Chery、BAIC、JAC 和 SAIC 合作，提供全栈智能底盘、ADAS、HarmonyOS 座舱和 5G
              连接；这个平台直接争夺 CAIT 所瞄准的同一笔 OEM 工程预算和品牌差异化支出。2026 年，Huawei 据报把电池供应从 CATL 独供中分散出去——这具体说明了 OEM
              避免单一供应商依赖的本能，也会约束 CAIT 的需求生成。
