          - type: callout
            title: 西方同业失败是竞争礼物，也是警示参考类
            body: >-
              Canoo 的 Chapter 7 破产和 Arrival 关闭，使 CAIT 几乎成为全球唯一一家资金充足、且有活跃 OEM 项目的 B2B 一体化 EV 平台公司。这是短期竞争礼物：非中国 OEM
              找不到可作为 CAIT 可信替代的西方选项。但这些公司暴露的失败模式——在足够 OEM 耐心和资本支持下达到量产规模的难度——与 CAIT 面对 Neta 减值和 Togg 2027 SOP
              截止期的挑战在结构上相似。CAIT 的 CATL 母公司背书解决了资本期限问题；OEM 耐心和量产准备度仍是开放变量。
