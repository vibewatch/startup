  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台概览与商业价值主张
        blocks:
          - type: paragraph
            body: >
              Contemporary Amperex Intelligent Technology（CAIT）向 OEM 伙伴提供 Bedrock Chassis。这是一套以电池为中心的集成式智能底盘，公司商业品牌为
              CIIC（Chassis-Integrated Intelligent Computing）。CATL 于 2024 年 12 月 24 日在上海发布该平台；CAIT 将 Bedrock
              定位为全球首个面向乘用车品牌商业化提供的独立集成式智能底盘。平台最突出的主张，是把电芯、电驱、热管理和底盘域控制器整合到一个滑板单元里，取消电池包与车身结构之间的传统分离。


              CAIT 提出的商业主张靠三个核心特征支撑：内部集成（所有关键系统统一）、车身与底盘解耦（上车身或 top hat 可独立于下平台设计），以及外部开放（标准化 APIs 对齐 COVESA Vehicle
              Signal Specification 标准）。CAIT 称，这一组合可将 OEM 整车开发周期从 36 个月或更长压缩到 12–18
              个月；若能在规模化阶段得到验证，对追求资本效率的市场进入者就是有分量的竞争优势。CAIT-SH CEO Yang Hanbing 在发布时表示，该平台借助模块化、个性化整车设计，“激活一个万亿元市场”。


              1+1+1 本地化模型决定海外部署的商业结构：一个底盘技术平台、一条产业供应链、一个本土汽车品牌伙伴。2026 年 4 月的 Togg 协议采用了这一模型，也是该平台首个海外乘用车量产承诺。
