      - number: '1.3'
        title: 产品架构与里程碑
        blocks:
          - type: paragraph
            body: >-
              CAIT 的战略相关性来自 CATL 从零部件供应走向更一体化的车辆基础。公司以 CIIC 一体化智能底盘家族为核心，2024 年 12 月推出 Bedrock Chassis，作为乘用车旗舰变体。CATL
              官方发布材料给出的产品图像最清楚：电芯通过 Cell-to-Chassis 架构直接集成进底盘，上下车体开发解耦，碰撞能量吸收提升至 85%，系统通过 120 km/h
              正面中央柱碰测试且不起火、不爆炸，高压断电在 0.01 秒内触发。CATL 还称，平台可把整车产业化周期从 36 个月以上压缩至 12-18 个月，同时支持面向 L3-L4
              智能驾驶的解耦。这些说法很激进，但它们是 CAIT 商业模式的核心，因为平台不是作为单一车型项目出售，而是作为可复用、电池中心化的基础，提供给希望更快开发、降低 BOM 压力、标准化 EV 包装的 OEM。
