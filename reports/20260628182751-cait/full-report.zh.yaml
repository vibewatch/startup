      - - CATL 股权圈层 OEM 管线（JAC Yiwei、BAIC、Changan Mazda、IAT）
        - 9 个具名关系中有 6 个处于或邻近 CATL 股权 / 供应网络；外部验证有限
        - 中 – 如果 CATL 企业关系是主要管线驱动，那么竞争对手进入 CATL 供应基础（例如 BYD 自研平台、OEM 自研）可能压缩绑定漏斗，而 CAIT 未必能赢下一个独立项目
        - 找出任何在没有既有 CATL 供应或股权关系下选择 CAIT 的 OEM；Changan Mazda（Mazda 发起）最接近，但仍经由 Changan 母公司
      - - 出行 / 车队 robotaxi JV（Shanghai Zaofu、T3 Mobility）
        - 车队 JV 在结构上不同于 OEM 授权；多个共同投资方稀释了车队层的集中度风险
        - 中 – L4 部署延误或竞争对手推进（Baidu、Pony.ai）可能推迟车队收入；但 JV 股权比纯供应协议创造更耐久的商业关系
        - 跟踪 Shanghai Zaofu 技术开发里程碑，以及中国 L4 商业服务的任何监管批准；将 Bedrock 底盘 robotaxi 单车成本与 Baidu Apollo 和 Pony.ai 平台对比
      - - Neta 对 CIIC 项目可行性的反向信号
        - CAIT 最早的生产项目（Neta S CIIC）未能启动；客户进入破产，并被曝销量造假
        - 反向 – 限制 CAIT 指向已量产、独立运营项目的能力；削弱“先发量产验证”叙事
        - 评估 Neta 项目的合同保护；判断 CIIC 平台技术表现能否从 Neta 商业结果中拆出来独立验证；厘清 CAIT 在破产财产中的 IP 权利
    notes: >-
      集中度风险沿两条轴线最高：（1）客户广度——只有 AVATR 量产；（2）独立性——大多数具名客户位于 CATL 股权或供应生态内。叠加后，CATL 企业网络或中国 EV
      初创市场任一端出现负面变化，都可能对管线造成不成比例的冲击。 截至运行日，Togg 和车队 JV 是关键多元化向量。
