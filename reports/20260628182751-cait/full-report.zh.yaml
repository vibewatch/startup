      - number: '8.2'
        title: 可比估值组与同业倍数
        blocks:
          - type: paragraph
            body: >-
              CAIT 尚未披露收入，估值可比法只能作为情景测试来用——「在每一组同行基准下，CAIT 需要多少收入才能支撑 $1.4
              billion？」——而不能直接套倍数。分析采用四组参照框架：（1）上市汽车技术供应商；（2）EV 平台与整车同行；（3）已经失败的西方 skateboard chassis 阵营，作为下行情景锚；（4）CATL
              母公司的财务画像，作为战略托底代理。

              汽车技术供应商在运营层面最可比。Aptiv 2025 年全年收入 $20.4 billion，企业价值约 $21 billion，对应 1.2x EV/revenue。BorgWarner 2025 年收入
              $14 billion，企业价值约 $15 billion，对应 1.1x EV/revenue。两家公司都有利润、规模化运营，并深度嵌入全球 OEM。若把这些倍数套到 $1.4 billion 的
              CAIT，CAIT 需要约 $1.0–1.3 billion 年收入，才能与 Aptiv 或 BorgWarner 平价交易——以当前披露看，这一收入水平完全属于推测。因此，供应商基准传递的信号是：除非 CAIT
              最终证明收入规模足够大，否则 $1.4 billion 相比基本面供应商可比公司有显著溢价。

              EV 相邻平台公司交易倍数更高，反映增长可选性和软件差异化溢价。Rivian 2025 年全年收入 $5.39 billion，并首次实现全年正毛利（毛利 $144 million）。其约 $21 billion
              市值对应约 3.5x–4x P/S，明显高于传统供应商。Mobileye 2025 年收入 $1.89 billion，市值 $6.6 billion（约 3.3x
              P/S），定位更接近技术导向平台供应商，并拥有实质 ADAS 内容收入。套到 CAIT 上，Rivian 水平倍数意味着 CAIT 需要约 $350–450 million 年收入才能支撑 $1.4
              billion。按 Mobileye 倍数，则需要约 $420 million。两种情景都要求 CAIT 在 2–3 年内拿出实质收入，估值才守得住。

              失败的西方 skateboard 阵营（Canoo、Arrival）是关键反向参照。两家公司起步估值都在十亿美元级，拿到战略合作，宣布产品上市，最终在 2024–2025
              年走向破产。失败机制并不只属于西方市场：OEM 转化慢、资本续航失败，以及向更偏好掌控平台决策的 OEM 客户出售核心底盘栈，本身结构性困难。这些失败先例直接对应 CAIT 的风险画像，即便 CATL
              的财务托底显著降低了类似流动性失败的概率。

              CATL 母公司的财务画像提供结构性托底参照。CATL 2025 年收入 RMB 423.7 billion（约 $61.4 billion），净利润 RMB 72.2 billion（约 $10.5
              billion），2024 年末净现金约 CNY 110 billion。其 2026 年 P/E 预计约 18x，EV/EBITDA 约 11x，体现高增长电池龙头画像。CAIT RMB 10 billion
              估值约为 CATL 市值的 2.4%——对于一个仍处于收入前阶段的子公司，这个溢价不大，但也不可忽略。母公司占比视角确认：从战略组合角度看，2025 年 10 月估值并非经济上不合理；它是基于 CATL
              已验证的制造和财务实力，对平台商业化的一份真实期权。

              Zeekr（Geely 支持）2024 年 IPO 目标估值 $5.1 billion，基于 2023 年收入 $7.28 billion（约 0.7x P/S），提供了中国 EV 市场 IPO 先例。中国
              OEM IPO 倍数处在 0.7–2.5x P/S 区间低端，与更广泛的监管和治理折价一致；这意味着 CAIT 未来若要 IPO，大概率需要先证明有实质收入，才可能拿到高于 2025 年 10 月交易价格的倍数。
