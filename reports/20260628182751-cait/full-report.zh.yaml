      - number: '5.3'
        title: 安全工程与已验证性能主张
        blocks:
          - type: paragraph
            body: >
              Bedrock 底盘最醒目的安全主张，是通过了 120 km/h 正面中央柱碰测试，并且不起火、不爆炸、不热失控——远高于中国 C-NCAP 评价体系采用的 56 km/h 标准。CATL
              量化了严苛程度差异：120 km/h 下的碰撞能量是 56 km/h 的 4.6 倍；柱碰的接触面积为全宽正碰的 1/6，单位面积冲击压力是 C-NCAP 参考值的 21 倍。CATL 称，集成式底盘可吸收
              85% 的整车碰撞能量，而传统底盘设计约为 60%。


              平台由三项具体的电池级安全机制支撑。每个电芯中的 NP（No Propagation）技术阻止热失控向相邻电芯蔓延。高延展吸能绝缘膜在机械变形下隔离电芯。高压安全系统在碰撞后 0.01 秒内断开电路，并在 0.2
              秒内完成残余能量释放。CATL 电芯还通过了 60 km/h 滑台碰撞测试、90 度弯折测试和贯穿锯切测试，均未起火或爆炸；公司将这些称为行业首创的自有测试规程。


              所有这些安全数据都需要加上一个关键限定：测试来自 CATL 自有规程，而不是提交给独立第三方认证项目的结果。截至报告日期，公开资料未确认基于 Bedrock 平台的量产车型已取得 Euro NCAP、UNECE
              R100（EV battery safety）或 UNECE R155/R156（cybersecurity）型式认证。Togg 或其他 OEM 伙伴进入欧洲市场，都需要按照 EU Regulation
              2018/858 取得独立型式批准，结果不能从 CATL 内部测试直接推断。
