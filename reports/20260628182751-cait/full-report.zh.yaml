              买方分层中最重要的反向数据点是，CAIT 最早的高调客户 Neta，遭遇了足以触发债权人重组讨论和销售虚增指控的财务困境。这不推翻投资判断，但意味着 CAIT 的 TAM 估算需要打上交易对手风险折扣。创业型
              OEM 群体是 CAIT 产品市场匹配最好的地方，也是最暴露于竞争失败和资本压力的群体。
