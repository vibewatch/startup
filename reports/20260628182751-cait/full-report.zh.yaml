      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: CATL 电池锁定既是护城河，也是部分 OEM 的交易杀手
            body: >-
              CAIT 位置中最重要的结构性竞争张力，不是谁也能造类似底盘，而是 OEM 是否会接受永久依赖 CATL 电池。Huawei HIMA 据报在 2026 年转向 CATL
              之外的多元供应，是最清晰的单一数据点，说明中国 OEM——即使是与 CATL 关系深厚的成熟 OEM——一旦规模起来，也会抵抗单一供应商锁定。CAIT
              最强卖点（最好的电池技术已经集成）也是最高异议点（我们永远逃不出 CATL 定价）。投资人应压力测试 CAIT 在交易谈判中如何回应锁定异议。
