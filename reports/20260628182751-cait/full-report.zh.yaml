      - number: '5.2'
        title: 核心技术架构
        blocks:
          - type: paragraph
            body: >
              Bedrock 底盘架构把从结构电芯到软件定义汽车接口的六个功能层整合在一起。最底层采用第四代
              Cell-to-Chassis（CTC）技术，将电芯直接嵌入底盘框架，作为承载结构件，省掉传统电池模组壳体，同时提升体积能量密度和碰撞防护。CATL
              将其描述为电芯与底盘共享结构设计，使变形能量由电芯-底盘组合体吸收，而不是传导到乘员舱。


              结构层采用三维仿生龟甲几何，把车身能量单元框架耦合起来。材料包括 2,000 MPa 潜艇级热成型钢和 600 MPa
              航空级铝合金，并结合航母阻拦索式结构，在碰撞中把力分散到多条路径。能量管理层包括热管理、800V
              高压架构和自研高压安全系统。运动控制层放置底盘域控制器，集中管理悬架、制动和转向，支持软件定义汽车（SDV）更新，以及能量与运动的协同控制。


              智能层实现机械、软件和 EE（electrical/ electronic）解耦，支持 L3–L4 自动驾驶集成。CAIT 在 CES 2025 期间的 COVESA Networking Showcase 展示
              CIIC，并将该平台描述为对齐 COVESA Vehicle Signal Specification（VSS），可为多个 OEM 提供开放 API 互操作。同期，CAIT 与 Intelligent
              Racing Foundation（IRF）签署谅解备忘录，用于 AI 驱动的赛车底盘开发。上车身接口层提供标准化机械、软件和 EE 连接器，从而支撑“一套底盘，多款车型”的产品族策略。
