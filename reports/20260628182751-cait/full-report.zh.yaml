      - number: '5.4'
        title: OEM 部署、合作伙伴与路线图
        blocks:
          - type: paragraph
            body: >
              Bedrock Chassis 于 2024 年在中国市场进入量产，AVATR 是 2024 年 12 月发布会指定的首发客户。随后，中国 OEM 承诺包括 JAC Yiwei（2025 年 1
              月车型开发协议）、Changan Mazda（2025 年 5 月基于 CIIC 的 NEV 联合开发 MOU）、IAT International Automobile Technology（2025 年 12
              月多样化 EV 动力总成合作）和 BAIC。T3 Mobility 与 Ant Group 签有协议，目标是在 Bedrock 平台上部署 robotaxi。CATL 与 SAIC Motor 于 2025 年
              1 月签署更广泛的战略合作，覆盖技术研发、换电和海外扩张，但该协议中底盘维度的表述不够具体。


              2024 年 8 月发布的 Neta S Shooting Brake，是首款部署在 CIIC 上的量产车型。该车商业表现不佳；National Enterprise Bankruptcy Information
              Disclosure Platform 显示，Neta 母公司 Hozon New Energy Auto Co. 于 2025 年 5 月进入破产审查案件。尽管这反映的是 Neta
              更广泛的财务困难，而不是产品缺陷，但它仍是早期平台伙伴风险的警示数据点。


              首个海外量产承诺，是 2026 年 4 月 29 日与土耳其 Togg 签署的战略合作，覆盖一个面向三款 B-segment 车型的专属平台，目标 2027 年首次量产。Togg
              将定义用户体验、产品规格和数字架构，CAIT 则贡献 Bedrock 平台和工程能力。CAIT 正积极寻找更多欧洲和东南亚合作，Togg 合作被定位为未来部署的“标杆项目”。2025 年 9 月 IAA
              Mobility Munich 首秀，是其面向西方市场的主要展示。
