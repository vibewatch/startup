      - number: '6.2'
        title: 具名客户证据与量产状态
        blocks:
          - type: paragraph
            body: >
              AVATR 是 CAIT 最可信的客户证明点。2024 年 12 月 24 日发布会上，AVATR 被指定为 Bedrock 首个量产伙伴，并在 2025 年推进商业化上市，Avatr 06 系列——一款
              800V 中型轿车 / EREV——进入市场。AVATR 与 CATL 有股权重叠（CATL 直接持有 CATL-Changan-Huawei JV 股权），因此这是 captive
              demand，不是独立验证；但它确实证明该平台已具备在中国生产乘用车的制造就绪度。


              Neta 是 CAIT 最早的项目，如今也是伤害最大的案例。Neta S Shooting Brake 于 2024 年 8 月发布，是首款基于 CIIC 的车型，原计划 2024 年 11
              月量产。该节点未能兑现。到 2025 年 6 月，Neta 母公司 Hozon New Energy 已进入法院监督下的破产重整，总负债和债权申报超过 RMB 26 billion。2025 年 7
              月，国家媒体调查披露，Neta 与 Zeekr 通过交付前为车辆上保险来虚增披露销量；Neta 在这一方案下登记超过 64,719 辆车，占 2023 年 1 月至 2024 年 3 月披露 117,000
              辆销量的 50% 以上。在破产问题解决前，CIIC 项目事实上处于暂停状态。一位内部人士（Chen Xin）告诉 Economic Observer，CATL 子公司原本计划借 Neta 推广 CIIC，但
              Neta 的运营问题使预期销量无法实现，加剧了 CAIT 的财务压力，也加速了寻求外部融资的决定。


              JAC Yiwei 于 2025 年 1 月签署 CIIC-S 战略合作，覆盖 Bedrock 平台上的换电、BEV 和 EREV 研发。Changan Mazda（Changan Automobile 与
              Mazda Motor Corporation 的 JV）于 2025 年 5 月签署联合开发 BEV 的 MOU；这是首个签约、且没有 CATL 股权关联的 OEM JV，因此值得注意，尽管 MOU
              阶段不构成有约束力的量产义务。BAIC 在 2025 年 CATL 材料中被列为 Bedrock 伙伴，但未披露具体车型或时间表。IAT International 于 2025 年 12 月签署多样化 EV
              动力总成底盘开发合作。


              Togg 是 CAIT 最具战略重要性的新客户。2026 年 4 月 29 日签约由 CATL Chairman Robin Zeng 见证，Togg CEO Gürcan Karakaş 与 CATL
              Chief Customer Officer Libin Tan 签署。Togg Chairman Fuat Tosyalı 称，该合作旨在“创造价值”，Togg
              将在塑造用户体验、产品需求和数字架构中发挥“决定性作用”。合作覆盖三款 B-segment 车型，面向土耳其和欧洲市场，2027 年首次量产。Regulation 2018/858 下的 EU 型式批准尚未确认。


              VinFast 2022 年 MOU 是最早关系，也是最模糊的关系。VinFast 在其官方 newsroom 确认 CIIC 合作，但截至运行日期，尚未宣布后续基于 Bedrock 平台的量产承诺。考虑到
              VinFast 自身资本压力，该项目应视为状态不明。


              T3 Mobility 与 Ant Group/Hello 合作代表一条不同于 OEM 授权的车队需求路径。Shanghai Zaofu JV（资本 RMB 1.288bn）叠加 T3 的大型网约车网络，可能为
              Bedrock robotaxi 车队提供重复部署基础。不过，Level 4 在中国的商业化部署有自身监管时间线，也面临 Baidu Apollo 和 Pony.ai 的竞争压力。
