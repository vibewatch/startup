      - number: '4.3'
        title: 资本充足性与融资历史
        blocks:
          - type: paragraph
            body: >-
              CAIT 于 2025 年 10 月完成首轮外部融资，募资超过 RMB 2 billion（按当时汇率约 USD 280M）。本轮由 Boyu Capital 与 Guotai Junan
              Securities/Haitong 领投，BAIC Industrial Investment、Shanghai Science and Technology Venture Capital（Shanghai
              STVC）和 Fortera Capital 跟投。投资方横跨私募股权（Boyu）、证券集团（Guotai Junan/ Haitong）、国资产业资本（BAIC）和地方科创资本（Shanghai
              STVC），说明关键利益方对齐度较高，也降低了短期资本供给风险。融资流程于 2025 年 7 月启动，据称单个投资人的最低出资额为 RMB 100 million，并于 2025 年 10 月 10 日完成交割。

              估值机制只披露了一部分。中国媒体援引 Science and Technology Innovation Board Daily 与 Tianyancha 数据称，本轮投前估值约 RMB 9
              billion，投后估值超过 RMB 10 billion，使 CAIT 成为中国滑板底盘领域首个公开宣称的独角兽。本轮后，CATL 仍持有 CAIT 约 70.5934%，对应外部投资人合计持股约
              29.4%。一篇报道提到 Industrial Bank Trust 取得 9.99% 股权，是已披露的最接近单一持股比例的数据，也说明没有任何单一外部投资人取得控制权。

              Company Overview 章节已经给出完整融资时间线；Financials 不重复这些 claim IDs。从资本充足性看，最关键的前瞻事实是：CAIT 披露，募资用途包括（1）Bedrock
              Chassis 车型量产，（2）下一代底盘技术研发。公司没有披露两项用途之间的资金拆分。已审阅资料中，CAIT 或其投资人均未披露烧钱速度、月度现金消耗或预计 runway。

              CATL 母公司提供了结构上重要的隐性兜底。CATL 进入 2025 年时，年报披露现金储备超过 RMB 300 billion；其香港上市（目标募资至少 $5B）以及随后 $1.5B
              离岸债项目，说明母公司仍能进入资本市场。以 CAIT 可能的经营规模看，实际 runway 与母公司支持意愿无法切开，而支持意愿又取决于 CATL 如何评估 CAIT 对电池供应链的战略价值。只要 CATL
              把底盘平台能力视为守住 OEM 关系的核心，隐性融资兜底就可信。若 CATL 自身承受利润率压力——2024 年收入下滑 9.7% 至 RMB 362B
              时已经出现过——其继续资助一家尚未产生收入的子公司的意愿可能收窄。
