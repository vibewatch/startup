      - number: '3.4'
        title: 西方同业失败作为结构性反向证据
        blocks:
          - type: paragraph
            body: >-
              Canoo 和 Arrival 退出 B2B EV 平台市场，不只是竞争格局事件，也是在中国之外验证独立滑板平台商业模式可行性的结构性证据。

              Canoo 于 2025 年 1 月 17 日在美国 Delaware 地区破产法院申请 Chapter 7 破产清算。公司曾拿到 NASA、美国邮政和 Walmart 的交付合同，但从未实现有意义的商业量产。其
              IP 和实物资产以 $4M 卖给 WHS Energy Solutions——对投资者近乎全损。Canoo 的失败揭示了 EV 平台公司在一个主要 OEM
              都有自有架构、车队客户又迟迟不愿承诺未经验证第三方平台的市场中，融资和规模化有多难。

              Arrival 于 2024 年初进入英国管理程序，把制造资产卖给 Canoo，并在 2025 年 3 月前正式关闭。公司曾在 SPAC 合并后估值超过 $13B，并获得 Hyundai、Kia 和
              BlackRock 支持，旗舰订单是 UPS 的电动配送车。它从未按生产规模交付，反而在被证明经济上不可行的“微工厂”制造策略上烧掉资本。2026 年达成的 $13.3M SPAC
              欺诈和解，进一步记录了公司未能兑现公开承诺。

              CAIT 投资逻辑必须明确纳入 Canoo / Arrival 参考类。失败模式不是产品技术，而是商业：OEM 信任、客户耐心和资本期限都在量产规模出现前耗尽。CAIT 受益于 CATL
              母公司可信度，能够覆盖信任和资本两个维度，但 OEM 耐心和量产爬坡挑战在结构上相似。
