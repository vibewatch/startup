      - number: '1.2'
        title: 领导层、治理与资本结构
        blocks:
          - type: paragraph
            body: >-
              CAIT 的披露方式仍像战略子公司，而不是一家具备上市公司治理透明度的独立创业公司。一级资料中最清晰的具名经营者是杨汉兵；他在 CATL 自己的 Bedrock 和 Togg 发布中以 CAIT CEO
              身份出现，在后续中国媒体中则以董事层面的总经理身份出现。曾毓群仍是可见的母公司赞助者，出席关键伙伴签约，也强化了 CAIT 仍在 CATL 战略轨道内运转。融资记录比治理记录清楚得多。中英文报道显示，CAIT 于
              2025 年 7 月通过定向流程开启首轮外部融资，单笔门槛为人民币 1 亿元，2025 年 10 月以超过人民币 100 亿元估值完成超过人民币 20 亿元募资。公开具名投资方包括博裕、国泰君安 /
              海通、北汽产投、上海科创投和 Fortera。腾讯系 Tuya 风格报道进一步显示，2025 年 10 月股权更新后，CATL 仍持有 70.5934%；但完整治理图谱、董事会权利、集团内 IP
              或转让定价条款仍未披露。
