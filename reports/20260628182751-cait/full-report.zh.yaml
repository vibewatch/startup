      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              CAIT 的购买方是 OEM，而不是消费者；采用外包一体化底盘，是车辆项目层面的多年资本承诺，不是交易式采购。买方地图可分为四类可识别原型，每类预算动态、风险承受力和采用触发点都不同。

              创业型 OEM 是 CAIT 近期结构上最有吸引力的买方群体。这些是没有传统平台投资的新进入 EV 品牌，主要约束是开发时间和工程人手，而不是资本。对创业型 OEM 来说，在招聘 200
              多名底盘工程师开发自有平台，和授权使用 CAIT 的 Bedrock Chassis 之间选择，是典型的自建还是购买决策；外包路径可把 36 个月以上项目压缩到 12–18 个月。Neta 是 CAIT
              最早公开的创业型 OEM 客户。它后来的财务困境说明了重大交易对手风险：创业型 OEM 最可能采用，因为它们最需要平台捷径；但在产量规模化之前，它们也最可能遇到财务或商业困难。

              传统 OEM 代表周期更长的机会。JAC（通过 Yiwei 品牌）这类中国国资关联 OEM，以及在次级市场探索电动化的国际传统车企，可能在较小车型线自研平台 ROI 不足时成为客户。挑战在于，OEM
              不愿把核心结构资产外包给第三方；如果安全事件被追溯到供应商拥有的底盘系统，品牌责任担忧会进一步放大。实践中，JAC Yiwei 关系和 Togg 合作说明 CAIT 已展示出足够可信度，至少能吸引部分传统相邻
              OEM 采用，尽管规模尚未建立。

              截至 2026 年中，出口市场 OEM 是 CAIT 组合中战略差异化最强的群体。Togg（土耳其）签约基于 Bedrock 开发三款 B 级车家族，首批量产目标为 2027
              年。这代表一种判断：土耳其、东南亚、中东等国内平台能力有限地区的区域 OEM，会采用已经验证的中国一体化平台，而不是自建专属 EV 架构。此处付款方是 Togg 车型项目预算，使用者是 Togg
              工程团队，最终客户是终端购车者。对 CAIT 来说，出口市场 OEM 也是 CATL 电池出货替代的载体——每一款基于 Bedrock 的 Togg 车型，都会成为新增 CATL 电芯客户。

              出行车队运营商更具推测性。网约车平台、物流运营商和专用商用车创业公司，历史上一直是 EV 试点的活跃平台。CAIT 平台在乘用车上最成熟；商用或车队变体还需要额外验证。2026-06-28 这一轮研究未发现
              CAIT 与车队专用商业关系的公开证据。
