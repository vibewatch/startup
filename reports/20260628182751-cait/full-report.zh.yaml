      - number: '7.4'
        title: 地缘政治、供应链与出口管制风险
        blocks:
          - type: paragraph
            body: >-
              CAIT 继承了 CATL 的地缘政治姿态，因为该平台离不开中国电池供应、加工规模和 IP。ORF 2025 年分析认为，中国控制关键 EV 电池矿物约 70-95% 的加工能力，这进一步说明，即便 CAIT
              追求全球化铺开，其根仍扎在高度集中的国家产业基础里。这种集中度在成本和规模上是竞争优势，但也让海外扩张同时暴露在双向国家安全政策之下。


              美国一侧，脱钩逻辑会缩小可服务市场，或抬高选择 CATL-adjacent 底盘架构的政治成本。中国一侧，围绕电池技术的出口管制和许可措施，可能放慢或阻断 CAIT 向海外伙伴推介的 1+1+1
              本地化模型。只有技术、工艺 know-how（诀窍）和供应链组件能在可接受时间表内跨境流动，本地化策略才跑得通。


              对投资人而言，关键点是地缘政治风险不是单一制裁事件，而是一个双边系统：美国认定风险、中国出口许可和上游矿物集中度可能相互作用，推迟上市计划、削弱 OEM 承诺，并压缩 CAIT
              在欧洲、土耳其、东南亚以及未来任何北美野心中的战略选择权。
            claimRefs:
              - CR030
              - CR031
              - CR032
              - CR033
              - CR034
              - CR035
      - number: '7.5'
        title: 财务、资本渠道与母公司依赖风险
        blocks:
          - type: paragraph
            body: >-
              CAIT 最强的缓释项，也是其最大的结构性风险之一：依赖 CATL。Fitch 于 2025 年 6 月确认 CATL 评级为 A-、展望稳定，并报告其 2024 年底净现金为 CNY110
              billion，使母公司确有能力支撑子公司走过漫长商业化周期。相较独立初创公司，这显著降低了 CAIT 的即时破产风险。


              但母公司强，不等于少数股东经济性受到保护。公开证据没有披露 CATL 与 CAIT 之间的转让定价，没有把底盘平台经济性从 CATL 更广泛的电池业务中拆出来，也没有显示专门划给 CAIT 的隔离资本支持。若
              CAIT 作为依赖电池的平台子公司继续处于尚未产生收入的状态，外部投资人承销的是母公司意愿，不只是平台质量。


              下行情形是：在 CAIT 证明独立收入转化前，资本渠道选择性变贵。Kharon 对 CATL 香港 IPO 过程的报道显示，Pentagon
              认定已经影响银行参与；更广泛的汽车供应商数据也指向一个对雄心大但未经验证项目更艰难的融资环境。在这一框架下，即便 CATL 本身仍是投资级，CAIT 下一轮融资或最终 IPO
              的成交估值，也可能低于单靠产品发布所暗示的水平。
