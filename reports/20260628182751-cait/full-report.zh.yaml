        - 中
        - 跟踪 ZF SELECT / Chassis 2.0 产品路线图；监测 Magna EtelligentDrive 的 OEM 采用；评估 Tier-1 供应商是否与 CATL 竞争对手合作集成平台
      - - CATL 母公司担保带来资本稳定性和技术深度
        - CATL 本身在多个维度竞争（电池市场份额、直接 OEM 关系、香港上市）；如果电芯需求承压，其战略优先级可能降低 CAIT 权重
        - 中
