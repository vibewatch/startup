    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、母公司背景与当前阶段
        blocks:
          - type: paragraph
            body: >-
              开源记录足以比用户简报更精确地锁定 CAIT 身份。多篇 2025 年融资报道和 CATL 自己的 2026 年 Togg 公告都把运营主体写作 Contemporary Amperex Intelligent
              Technology (Shanghai) Limited，中文法律名称为宁德时代（上海）智能科技有限公司，而不是提示中较短的俗称。中国媒体和融资报道一致称，公司于 2021 年在上海成立，是 CATL
              专门做滑板底盘的子公司。这一点重要，因为它把 CAIT 重新定位为 CATL 生态内有明确商业化任务的载体，而不是一个边界松散的 2023 年拆分项目。母公司背景在这里也格外关键：CATL 进入 2026
              年时已是两地上市的电池龙头，CAIT 向车企推销的核心，是把上游电池规模撬成更宽的“电池 + 平台”产品组合。公开材料把 CAIT 的业务范围描述为以电池为中心的 CIIC 一体化智能底盘产品和技术服务，明确落在
              B2B EV 平台供应，而不是直接造车。
