      - number: '5.6'
        title: 展示项
        blocks:
          - type: callout
            title: 电池-结构集成是真正的工程差异点
            body: >
              CAIT 的 CTC 集成在技术上有实质内容，并不只是把 cell-to-pack 换个营销说法。第四代设计完全取消电池模组，把电芯作为结构承载件放进 3D
              龟甲框架。这带来更高体积能量密度、更少零部件，也形成一套底盘安全架构；CATL 自有测试显示，它比传统设计吸收更多碰撞能量。目前没有其他独立商业底盘平台，能向乘用车 OEM 提供同等程度的电池-结构集成。
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: callout
            title: 安全主张依赖自有规程，缺少独立认证
            body: >
              所有头部安全数字——85% 碰撞能量吸收、120 km/h 柱碰不起火、0.01 s 高压断开——都来自 CATL 自有测试规程，而不是独立 Euro NCAP 提交、UNECE R100
              型式批准或任何国家新车评价项目。若通过 Togg 在欧洲部署，需要取得 EU Regulation 2018/858 下的型式批准，并满足 UNECE R155/R156；截至 2026 年 6
              月，两者均未确认正在推进。如果欧洲部署是 CAIT 增长叙事的核心，这就是投资论点中的重大风险。
            calloutType: risk
            claimRefs:
              - CE040
              - CE037
          - type: callout
            title: 结构电池集成带来未解决的维修性与保险风险
            body: >
              重大碰撞损伤之后，CTC 集成会让更换电池近似于更换底盘。多个 EV 架构下的保险市场都指出，结构电池集成会推高全损率。维修需要专用工具、培训和零部件供应；这些能力在中国以外仍处早期。这些风险是 CTC
              设计理念的系统性问题，并非 CAIT 独有，但会给 OEM 伙伴和终端消费者制造摩擦，尤其是在有 right-to- repair 法规的欧洲市场。
            calloutType: risk
            claimRefs:
              - CE035
              - CE036
          - type: callout
            title: Changan Mazda 合作提供首个非股权绑定 OEM 验证
            body: >
              CAIT 多数中国 OEM 伙伴（AVATR、Neta）与 CATL 有股权或投资关系，削弱了它们作为采纳信号的独立性。2025 年 5 月的 Changan Mazda MOU，是 CIIC 首次与此前没有
              CATL 股权绑定的合资 OEM 合作，提供了一个更可信、但仍处早期的信号：该商业平台对关联客户以外的客户也有吸引力。
            calloutType: insight
            claimRefs:
              - CE021
              - CE036
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与管线概览
        blocks:
          - type: paragraph
            body: >
              CAIT 的客户基础可分为三个功能上不同的细分群体，证据标准和商业含义各不相同。第一类是中国国内 OEM，关系最多、证据也最多，但受损也最明显。AVATR（CATL-Changan-Huawei JV）是已确认的
              Bedrock 量产首发客户；Neta（Hozon Auto）是首个 CIIC 项目，但截至 2025 年 6 月已进入破产重整；JAC Yiwei、Changan Mazda、BAIC 和 IAT
              International 均签署了合作协议，但尚未宣布有量产承诺的项目。


              第二类是海外 OEM，目前有一个已确认关系。VinFast 于 2022 年 10 月签署 CIIC 全球战略合作 MOU，但截至运行日期，尚未宣布任何基于 Bedrock 平台的量产承诺。土耳其 Togg 于
              2026 年 4 月 29 日签署战略合作，覆盖三款 B-segment 车型，目标 2027 年首次量产；这是唯一公开确认的海外量产承诺。


              第三类是出行与车队应用，结构上不同。CATL、Ant Group 与 Hello（原 Hellobike）于 2025 年 6 月成立 Shanghai Zaofu Intelligent Technology
              Co., Ltd.，注册资本 RMB 1.288 billion，目标是开发并商业化基于 Bedrock Chassis 的 Level 4 robotaxi 技术。T3 Mobility（由
              FAW、Dongfeng、Changan 以及 Alibaba/Tencent 支持）于 2025 年 7 月另行签署合作，在同一平台上开发 robotaxi。这些车队关系不同于 OEM 授权：CATL 以 JV
              股权伙伴身份共同投资，而不是只做平台授权方。


              九个关系合计看，CAIT 的管线签约密集，但已确认量产部署很少。CATL 在 2026 年的表述将 2026–2027 年定位为中国 OEM 伙伴集中车型上市窗口。这个窗口能否转化为商业规模，取决于伙伴 OEM
              的运营健康度；Neta 已经从负面方向展示了这一风险。
