summary:
  headline: CAIT 是 CATL 向平台业务外延的可信落子，已有真实 OEM 兴趣，也握着强母公司护城河；但公开证据目前只支持继续跟踪，尚不足以激进承保，因为收入、客户转化和独立经济性仍不透明。
