  topStrengths:
    - CATL 背书让 CAIT 在电池集成、制造可信度和战略客户触达上形成差异化护城河，多数滑板底盘初创公司拿不到这些资源。
    - Bedrock Chassis 已经发布，不是概念图；架构围绕电池展开，并公开绑定 Avatr、JAC Yiwei、Togg 等多个 OEM。
    - 2025 年 10 月融资带来外部验证和资金支撑，说明公司在推进工业化，而不只是停留在概念研发。
  topRisks:
    - CAIT 未披露独立收入、毛利率、转移定价结构或订单簿深度，业务还无法按经营基本面承保。
    - 客户证据仍以签约合作和投放目标为主；最早高调推进的 Neta CIIC 项目随着客户困境走弱。
    - OEM 采纳可能被供应商锁定担忧、准入认证和责任划分复杂度，以及深度集成底盘天然带来的可维修性和服务顾虑卡住。
    - 业务仍重资产，并在战略上依赖 CATL；这既是护城河，也是少数股东需要面对的治理和集中度风险。
  unresolvedGaps:
    - CAIT 独立收入、毛利率和现金消耗披露
    - 各项目从签约合作转化为规模量产出货的情况
    - 本轮后确切股权、董事会权利，以及 CATL 体系内 IP 或转移定价机制
    - 经验证的员工数、制造布局和售后 / 维修责任模型
    - Bedrock 安全性、准入认证和海外合规准备度的独立验证
