callouts:
- calloutType: insight
  title: The market boundary, not the market size, is the investment-critical variable
  body: 'CAIT''s market is easy to overstate (by conflating with global EV spending)
    and easy to understate (by treating it as a niche hardware business). The correct
    frame is a B2B platform services and hardware business in a $4.7B–$12B TAM growing
    at 18–22% annually, where CAIT''s real advantage is CATL''s battery IP and credibility
    rather than the skateboard architecture itself. Market sizing should start from the
    narrow chassis platform market and layer in CATL''s battery content per vehicle to
    get a true economic value per program.'
  claimRefs:
  - CM001
  - CM015
  - CM016
  - CM018

- calloutType: risk
  title: Neta distress is the adverse proof point the market sizing cannot ignore
  body: 'The most important adverse data point in the buyer segmentation is that CAIT''s
    earliest high-profile customer — Neta — experienced financial distress significant
    enough to trigger creditor restructuring discussions and allegations of sales inflation.
    This does not invalidate the thesis, but it does mean CAIT''s TAM estimate needs a
    counterparty risk haircut. The startup OEM segment — where CAIT has the best product-market
    fit — is also the segment most exposed to competitive failure and capital pressure.'
  claimRefs:
  - CM039
  - CM040
  - CM041

- calloutType: assumption
  title: SAM and SOM are open gaps that must be filled by commercial milestones
  body: 'This chapter preserves the failure to isolate CAIT''s SAM and SOM as an explicit
    diligence gap rather than filling it with a derived estimate. The path to a reliable
    SAM/SOM is CAIT disclosing per-program economics, production volume ramp, and the
    dollar value of its pipeline. Until then, investment sizing should be anchored on
    the narrow $4.7B–$12B global platform TAM and CAIT''s current share of five confirmed
    programs.'
  claimRefs:
  - CM019
  - CM020
  - CM033

