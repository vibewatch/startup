        a platform TAM. It frames the total vehicle output into which any chassis platform
        supplier could sell.'
    - label: Integrated battery technology market (2026)
      value: 102.7
      description: 'PW Consulting estimates the global integrated battery market (CTP/CTB/CTC)
        at $102.7B in 2026 (CAGR 25.13%). This overstates CAIT''s TAM — it includes all
        in-house OEM battery integration, not only outsourced B2B chassis supply.'
    - label: EV skateboard chassis market (2026)
