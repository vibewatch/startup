  - id: named-customer-evidence
    title: Named Customer Evidence and Production Status
    body: |
      AVATR is CAIT's most credible customer proof point. Designated as Bedrock's first production
      partner at the December 24, 2024 launch ceremony, AVATR proceeded to commercial launches in
      2025, with the Avatr 06 series—an 800V mid-size sedan/EREV—reaching market. AVATR's equity
      overlap with CATL (CATL holds a direct stake in the CATL-Changan-Huawei JV) means this is
      captive demand, not independent validation, but it does confirm the platform's manufacturing
      readiness for passenger vehicle production in China.

      Neta was CAIT's earliest program and is now its most damaging case study. The Neta S Shooting
      Brake was announced in August 2024 as the first CIIC-based model, with mass production
      originally planned for November 2024. That deadline was missed. By June 2025 Neta's parent
      company Hozon New Energy had entered court-supervised bankruptcy restructuring with over
      RMB 26 billion in total liabilities and creditor claims. A July 2025 investigation by
      state media revealed that Neta and Zeekr had inflated reported sales by registering vehicles
      with insurance before delivery, with Neta registering more than 64,719 vehicles (over 50%
      of reported 117,000 sales from January 2023 to March 2024) under this scheme. The CIIC
      program is effectively suspended pending resolution of the bankruptcy. An insider (Chen Xin)
      told the Economic Observer that CATL's subsidiary originally planned CIIC promotion through
      Neta but Neta's operational problems prevented expected sales volumes, intensifying CAIT's
      financial pressure and accelerating the decision to seek external financing.

      JAC Yiwei signed a CIIC-S strategic cooperation in January 2025, covering battery swap,
      BEV, and EREV R&D on the Bedrock platform. Changan Mazda (the Changan Automobile JV with
      Mazda Motor Corporation) signed an MOU in May 2025 for jointly developed BEVs; this is
      notable as the first non-CATL-equity-affiliated OEM JV to sign, though the MOU stage
      imposes no binding production obligation. BAIC is named as a Bedrock partner in 2025
      CATL materials but has not disclosed a specific model or timeline. IAT International signed
      in December 2025 for diverse EV powertrain chassis development.

      Togg is CAIT's most strategically important new customer. The April 29, 2026 signing was
      witnessed by CATL Chairman Robin Zeng and signed by Togg CEO Gürcan Karakaş and CATL Chief
      Customer Officer Libin Tan. Togg Chairman Fuat Tosyalı described the partnership as designed
      to be "value-creating," with Togg playing "a defining role in shaping the user experience,
      product requirements and digital architecture." Three B-segment models are covered, targeting
      Turkish and European markets, with first mass production in 2027. EU type approval under
      Regulation 2018/858 is not yet confirmed.

      VinFast's 2022 MOU is the earliest relationship and the most ambiguous. VinFast confirmed
      the CIIC cooperation in its own official newsroom but no subsequent production commitment on
      the Bedrock platform has been announced through the run date. Given VinFast's own capital
      pressures, the program should be treated as status-unclear.

      The T3 Mobility and Ant Group/Hello partnerships represent a fleet demand pathway that is
      structurally different from OEM licensing. The Shanghai Zaofu JV (RMB 1.288bn capital),
      combined with T3's large ride-hailing network, could provide a repeating-deployment base for
      Bedrock robotaxi fleets. However, Level 4 commercial deployment in China faces its own
      regulatory timeline and competitive pressure from Baidu Apollo and Pony.ai.
