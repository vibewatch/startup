company:
  name: CAIT
chapter:
  number: 6
  title: Customers
  summary: >
    CAIT's visible customer set comprises nine named OEM and fleet relationships spanning three
    segments—domestic Chinese OEMs, overseas OEMs, and mobility/fleet JVs—but as of June 2026 only
    AVATR has confirmed production deployment on the Bedrock Chassis and is itself a CATL equity
    partner. The earliest and most advanced domestic program (Neta S Shooting Brake) collapsed when
    Neta's parent entered bankruptcy in June 2025 and was exposed for inflating sales figures,
    demonstrating that CAIT's customer risk is amplified by the financial fragility of its target
    market segment. Five of nine named customers have direct equity or investment ties to CATL,
    creating captive demand that strengthens near-term deal flow but limits evidence of independent
    commercial pull. The Togg partnership (April 2026) is the first genuinely independent overseas
    commitment but targets mass production in 2027 and carries EU type-approval uncertainty.
    No customer revenue, units shipped, NRR, or SOP beyond AVATR is publicly disclosed. The
    customer set validates that the Bedrock platform has cleared the zero-to-one hurdle for
    production intent in China, but falls short of demonstrating repeatable, independent-OEM
    demand conversion at scale.

sections:
  - id: customer-segmentation
    title: Customer Segmentation and Pipeline Overview
    body: |
      CAIT's customer base organizes into three functionally distinct segments with different
      evidence standards and commercial implications. The first segment—domestic Chinese OEMs—
      contains the most relationships and the most evidence, but also the most impairment. AVATR
      (a CATL-Changan-Huawei JV) is the confirmed Bedrock production launch customer; Neta (Hozon
      Auto) was the first CIIC program but has entered bankruptcy restructuring as of June 2025;
      JAC Yiwei, Changan Mazda, BAIC, and IAT International have each signed cooperation
      agreements but have not yet announced production-committed programs.

      The second segment—overseas OEMs—has one confirmed relationship. VinFast signed a CIIC
      global strategic cooperation MOU in October 2022, but no production commitment on the
      Bedrock platform has been announced through the run date. Togg of Turkey signed a strategic
      partnership on April 29, 2026, covering three B-segment models with first mass production
      targeted for 2027; this is the only publicly confirmed overseas production commitment.

      The third segment—mobility and fleet applications—is structurally different. CATL, Ant Group,
      and Hello (formerly Hellobike) formed Shanghai Zaofu Intelligent Technology Co., Ltd. in June
      2025 with RMB 1.288 billion registered capital to develop and commercialize Level 4 robotaxi
      technology built on the Bedrock Chassis. T3 Mobility (backed by FAW, Dongfeng, Changan, and
      Alibaba/Tencent) signed a separate cooperation in July 2025 for robotaxi development on the
      same platform. These fleet relationships differ from OEM licensing in structure: CATL co-invests
      as a JV equity partner rather than as a pure platform licensor.

      Across all nine relationships, CAIT's pipeline is dense in signed agreements but narrow in
      confirmed production deployments. CATL's own statement in 2026 positions 2026–2027 as the
      concentrated model-launch window for Chinese OEM partners. Whether that window converts to
      commercial scale depends on the operational health of partner OEMs—a risk Neta has already
      illustrated adversely.
