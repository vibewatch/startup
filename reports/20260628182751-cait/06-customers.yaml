  evidenceGaps:
    - id: GU001
      type: private-evidence-only
      severity: blocking
      topic: "customer-revenue-unit-volumes"
      missingEvidence: "No customer revenue, license fees, royalties, or chassis unit volumes have been publicly disclosed for any CAIT platform relationship. CAIT's economic model for individual OEM engagements—fee structure, per-vehicle royalty, engineering service revenue—is entirely opaque. AVATR's Bedrock-specific production count is not reported separately. Neta S CIIC volume is effectively zero."
      whyItMatters: "Investors cannot independently assess whether CAIT's growing pipeline is translating into revenue, or whether named relationships are primarily strategic signals. Without unit economics, the financial case for the CAIT business is entirely inferential."
      diligencePath: "Request CAIT-SH financial statements from CATL parent; request per-program economics under NDA; cross-reference CATL segment reporting for any chassis/platform revenue line in FY2024–2025 annual reports."
      relatedQuestionRefs: [QU006, QU008]

    - id: GU002
      type: missing-source
      severity: material
      topic: "customer-distancing-or-defection"
      missingEvidence: "No documented instance of a named CAIT customer publicly distancing from the platform, reducing scope, or opting to self-develop has been found. The absence of adverse customer signals does not confirm satisfaction—it may reflect the fact that most relationships are pre-production and formal exits have not yet been needed. VinFast's silence since 2022 is the clearest potential defection signal."
      whyItMatters: "An absence of documented adverse customer signals is ambiguous for early-stage B2B platforms. If OEMs quietly shelved Bedrock programs (as VinFast may have), it would not appear in press coverage without proactive investigation."
      diligencePath: "Direct outreach to named OEM engineering executives; track CATL earnings Q&A for analyst questions about chassis unit customer attrition; monitor job postings from named OEMs for in-house chassis roles that would indicate platform rejection."
      relatedQuestionRefs: [QU019]

    - id: GU003
      type: missing-source
      severity: material
      topic: "independent-customer-reference"
      missingEvidence: "No named OEM executive has given an unsolicited, third-party-moderated endorsement of the CAIT platform. All confirmations flow through CATL/CAIT press releases. Togg Chairman's April 2026 statement is the closest proxy but is embedded in a CAIT-issued press release and represents pre-production intent rather than operational feedback."
      whyItMatters: "Independent customer references are a primary diligence standard for B2B platforms. Their absence means investor validation relies entirely on CATL-controlled communications, which are not designed for third-party credibility."
      diligencePath: "Request direct investor reference calls with Togg engineering leadership, JAC Yiwei program management, and Changan Mazda NEV development team; if refused, treat named customer set as unverified strategic signals."
      relatedQuestionRefs: [QU014]

    - id: GU004
      type: private-evidence-only
      severity: material
      topic: "baic-program-scope"
      missingEvidence: "BAIC's Bedrock program scope, model timeline, and engineering commitment are not publicly disclosed beyond BAIC Industrial Investment's Series A participation. No model name, SOP target, or technical collaboration detail has been announced. BAIC holds an investor stake in CAIT and is simultaneously named as a customer prospect, creating a conflict of interest."
      whyItMatters: "Without a disclosed model program, BAIC cannot be counted as a genuine production pipeline entry. Its financial interest in CAIT's success may create signaling incentives unrelated to commercial intent."
      diligencePath: "Request BAIC engineering program roadmap from CAIT as part of Series A investor diligence disclosure; separately assess whether BAIC has disclosed any NEV platform plans referencing CAIT/Bedrock in its own public materials."
      relatedQuestionRefs: [QU022]

    - id: GU005
      type: missing-source
      severity: material
      topic: "mou-to-sop-conversion-mechanism"
      missingEvidence: "The mechanism for CAIT converting a signed MOU into a production commitment has not been publicly described. Intermediate gates—jointly defined specification, tooling order, supply chain localization agreement, binding SOP date—are not disclosed. No MOU-to-production conversion rate data exists for any CAIT relationship. Comparison to U Power or PIX Moving conversion rates is not possible from public sources."
      whyItMatters: "A high MOU count is a weak leading indicator if conversion rates are low. The Neta experience (signed Jan 2023, zero production, bankruptcy Jun 2025) demonstrates the full downside of a failed conversion. The nine named relationships cannot be mapped to expected production revenue without a disclosed gate model."
      diligencePath: "Request CAIT standard platform development agreement template; compare conversion rate against U Power and PIX Moving using trade press; ask CAIT management what percentage of signed agreements have reached tooling-order or SOP-date stage."
      relatedQuestionRefs: [QU024, QU026, QU027]

