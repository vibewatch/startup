    title: "CAIT Customer Journey Map — Segments, Adoption Surfaces, and Expansion Loops"
    type: journey-map
    layout: wide
    summary: "Three-segment customer journey across domestic OEM, overseas OEM, and mobility/fleet channels, showing the distinct entry point, development path, and expansion loop for each segment as of June 2026."
    data:
      items:
        - id: domestic-oem-entry
          label: "Stage 1: Domestic OEM Engagement (China)"
          actor: "Chinese OEM with EV development need (AVATR, JAC Yiwei, BAIC, Changan Mazda, IAT)"
          touchpoint: "Partnership announcement; CATL ecosystem introduction; CES / IAA showcase"
          outcome: "Signed cooperation agreement or MOU; AVATR advanced to production launch (Dec 2024)"
        - id: domestic-oem-development
          label: "Stage 2: Platform Adaptation (12–18 month cycle)"
          actor: "OEM engineering teams + CAIT chassis engineers"
          touchpoint: "Joint R&D on thermal management, EE architecture, top-hat interface; CIIC tooling"
          outcome: "OEM-customized vehicle program; body-chassis integration validated; SOP target set"
        - id: domestic-oem-production
          label: "Stage 3: China Production Launch"
          actor: "OEM (vehicle brand owner); CAIT (platform licensor/supplier)"
          touchpoint: "Model launch event; regulatory certification (C-NCAP, MIIT); dealer network"
          outcome: "Bedrock chassis in mass production; CAIT licensing revenue triggered; AVATR confirmed; Neta failed at this stage"
        - id: overseas-oem-entry
          label: "Stage 4: Overseas OEM Partnership (1+1+1 Model)"
          actor: "Non-Chinese OEM seeking fast EV platform (Togg, VinFast)"
          touchpoint: "Strategic partnership signing; CATL Chairman presence as signal of commitment"
          outcome: "Signed agreement covering model program scope; Togg (Apr 2026) confirmed; VinFast (2022) status-unclear"
        - id: overseas-oem-production
          label: "Stage 5: Overseas Production (2027 target for Togg)"
          actor: "Overseas OEM (Togg for Turkey/Europe); local supply chain; type approval authority"
          touchpoint: "EU type approval; local production ramp; brand-level market launch"
          outcome: "First confirmed overseas mass production (Togg, target 2027); EU Regulation 2018/858 approval required"
        - id: fleet-entry
