    notes: "Concentration risk is highest along two axes: (1) customer breadth—only AVATR is in production; (2) independence—most named customers are within CATL's equity or supply ecosystem. The combined effect is that adverse developments in either CATL's corporate network or the Chinese EV startup market could impair the pipeline disproportionately. Togg and the fleet JVs are the key diversification vectors as of run date."
