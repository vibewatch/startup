callouts:
- calloutType: strength
  title: CAIT starts with a real industrial parent, not a garage-stage EV thesis
  body: CAIT is materially more credible than a standalone skateboard-chassis startup because it is backed by CATL’s battery, manufacturing, and public-market infrastructure and has already converted that backing into named OEM relationships and a large first external financing round.
  claimRefs:
  - CO004
  - CO005
  - CO013
  - CO016
  - CO032
- calloutType: insight
  title: The business model is really battery-plus-platform monetization
  body: The strategic move is not just to sell a safer chassis; it is to shift CATL from component supplier toward a battery-centric development platform that can compress customer launch timelines and make CATL harder to displace in future EV programs.
  claimRefs:
  - CO007
  - CO020
  - CO024
  - CO039
- calloutType: risk
  title: The public proof set is still partnership-rich and shipment-light
  body: CAIT’s open-source story contains multiple signed collaborations and ambitious launch claims, but the earliest Neta program deteriorated with customer distress and the record still does not disclose CAIT revenue, unit economics, or a clean list of shipped high-volume production models.
  claimRefs:
  - CO034
  - CO035
  - CO040
