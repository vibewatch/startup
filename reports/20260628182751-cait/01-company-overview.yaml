- id: leadership-governance-and-capitalization
  title: Leadership, Governance, and Capitalization
  body: CAIT is still disclosed like a strategic subsidiary, not like a stand-alone venture with public-company governance transparency. The clearest named operator in primary sources is Yang Hanbing, who appears as CAIT CEO in CATL's own Bedrock and Togg releases and as board-level managing director in later Chinese media. Robin Zeng remains the visible parent sponsor, appearing at key partner signings and reinforcing that CAIT still operates within CATL's strategic orbit. The financing record is clearer than the governance record. Chinese and English reporting show that CAIT opened its first external financing in July 2025 through a targeted process with RMB100 million minimum tickets and closed more than RMB2 billion by October 2025 at a valuation above RMB10 billion. Publicly named investors include Boyu, Guotai Junan/Haitong, BAIC Industrial Investment, Shanghai STVC, and Fortera. Tencent-backed Tuya-style reporting further indicates CATL still held 70.5934% after an October 2025 shareholding
    update, but the full governance map, board rights, and intercompany IP or transfer-pricing terms remain undisclosed.
