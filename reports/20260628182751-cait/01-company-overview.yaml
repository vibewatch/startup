- id: commercial-ecosystem-and-adverse-frame
  title: Commercial Ecosystem and Adverse Frame
  body: The partnership timeline shows why CAIT deserves attention but not yet a mature-platform valuation premium. Public milestones begin with VinFast in 2022, Neta in 2023, the Neta S-based first-model narrative in 2024, JAC Yiwei in early 2025, Avatr at the Bedrock launch, and Togg in 2026 as the first overseas passenger-vehicle project. This sequence demonstrates breadth across Chinese and international OEMs, but the adverse evidence is equally important. Neta, the earliest widely publicized CIIC partner, fell into acute financial distress and has been associated with halted production, creditor restructurings, and suspect sales practices, weakening CAIT's cleanest early proof point. A later Chinese report also argues that customer trust, liability allocation, and OEM reluctance to outsource a core chassis stack remain structural selling hurdles for third-party skateboard platforms. In other words, CAIT looks better than a concept-only mobility startup because it has a real parent,
    real product, and real signed partners, but the public record still leans more heavily on signed collaborations and rollout targets than on named, scaled production vehicles already shipping under CAIT economics.
