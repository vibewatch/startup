  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current employee-count disclosure or labor filing that confirms whether CAIT is anywhere near the 500-1000 range in the prompt.
    whyItMatters: Headcount is a key scale signal for hardware-platform execution and for benchmarking burn intensity versus disclosed capital.
    diligencePath: Pull current Chinese corporate database records, hiring pages, and internal HR disclosures or request a management data room extract.
    relatedQuestionRefs:
    - QO021
  - type: private-evidence-only
    severity: blocking
    topic: financials
    missingEvidence: Standalone CAIT revenue, gross margin, cash burn, and order-book metrics.
    whyItMatters: Without operating metrics, the >RMB10B valuation anchor cannot be underwritten on commercial fundamentals.
    diligencePath: Request audited subsidiary financials, management accounts, backlog schedules, and customer-program revenue phasing.
    relatedQuestionRefs:
    - QO022
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A full CAIT board, executive roster, and shareholder-rights summary after the 2025 external financing.
    whyItMatters: Governance and control rights determine whether outside investors have any real influence or whether CAIT remains effectively a CATL internal vehicle.
    diligencePath: Review updated registration extracts, shareholder agreements, and board materials or request a cap-table plus governance memo from the company.
    relatedQuestionRefs:
    - QO023
