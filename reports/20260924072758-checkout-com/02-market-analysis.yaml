chapter:
  number: 2
  title: Market Analysis
  summary: "Checkout.com addresses the global enterprise payment processing market, defined as full-stack acquiring, gateway,\
    \ value-added services (fraud, acceptance optimisation, issuing), and alternative payment method support for merchants\
    \ processing >$100M annually. TAM is estimated at $30\u2013100B in annual revenue (high definitional sensitivity), with\
    \ strong growth driven by e-commerce expansion, cross-border complexity, and AI-powered acceptance tools. The company's\
    \ $300B+ 2025 volume implies a 4\u20135% share of enterprise digital commerce processing. Key constraints are regulatory\
    \ capital requirements, high switching costs, and pricing pressure from integrated bank solutions.\n"
sections:
- id: market-boundary-and-taxonomy
  title: Market Boundary and Taxonomy
  body: "Checkout.com's primary market is enterprise payment processing \u2014 the end-to-end handling of card-not-present\
    \ (online) and card-present transactions for large commercial merchants. The market includes payment acquiring (accepting\
    \ card transactions and routing to card networks), payment gateway software (API-based transaction routing and tokenisation),\
    \ fraud detection and risk management, alternative payment method (APM) acceptance (wallets, BNPL, real-time payments),\
    \ card issuing for B2B use cases, and payouts. The market explicitly excludes consumer banking deposits, mortgage lending,\
    \ insurance, and investment products. Adjacent markets \u2014 into which Checkout.com is expanding \u2014 include digital\
    \ currency settlement (via Blue EMI acquisition) and US regulated banking (via the Georgia MALPB charter). Status-quo\
    \ substitutes include in-house bank-owned acquiring relationships (Chase Paymentech, Barclays, Lloyds), legacy payment\
    \ service providers (Worldpay/FIS, Adyen, Stripe), and proprietary payment infrastructure built by very large merchants\
    \ (Amazon Pay, Meta Pay). The critical market distinction is enterprise vs. SMB: Checkout.com targets merchants above\
    \ roughly $100M annual revenue who need bespoke integration, local acquiring in 50+ countries, and dedicated technical\
    \ support \u2014 a narrower but higher-value segment than the SMB-focused players (Stripe, Square, PayPal).\n"
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
  tableRefs:
  - TM001
- id: market-sizing-multiple-lenses
  title: "Market Sizing \u2014 Multiple Lenses"
  body: "No single authoritative market sizing study covers enterprise-grade payment processing with the same scope as Checkout.com's\
    \ product portfolio. Multiple lenses are required. Lens 1 (volume-based): Global e-commerce transaction volume is estimated\
    \ at $5\u20137 trillion annually in 2024-2025. Enterprise processors earn take rates of 0.10\u20130.30% of volume; applying\
    \ this to the enterprise segment of global digital commerce yields an annual processor revenue pool of $10\u201325B (conservative)\
    \ to $50B+ (inclusive of value-added services). Lens 2 (listed-company comparison): Adyen (public, ~$2B revenue, ~0.15%\
    \ take rate on ~\u20AC1.35T volume) and Stripe (private, estimated ~$5B revenue on ~$1T volume) serve as market calibration\
    \ points. Checkout.com's $300B volume at an implied 0.20\u20130.30% take rate suggests $600M\u2013$900M gross revenue,\
    \ consistent with the 30%+ growth profile. Lens 3 (broader market reports): Various analyst reports estimate the global\
    \ payment gateway/processing market at $75\u2013130B by 2028 (including SMB), but the enterprise sub-segment accessible\
    \ to Checkout.com is materially smaller. Sizing gaps are significant: no public revenue confirmation, no disclosed gross\
    \ margin, and private company status prevent triangulation to a single number. All estimates carry material uncertainty\
    \ and should be treated as order-of-magnitude guidance only.\n"
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
