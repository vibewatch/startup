  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: nrr-grr-retention
    missingEvidence: 'No public NRR, GRR, or cohort-level revenue retention metric for Checkout.com has been published in
      any analyst, news, or company source. The >30% net revenue growth is a combined new-plus-existing metric and cannot
      be decomposed into retention versus new merchant contributions without access to per-merchant revenue history.

      '
    whyItMatters: 'Without NRR or GRR data it is not possible to independently verify whether the >30% net revenue growth
      implies strong same-store retention or is primarily driven by new merchant additions. NRR above 100% would confirm expanding
      customer value; NRR below 110% would temper the BDC growth narrative.

      '
    diligencePath: 'Request NRR, GRR, and cohort-level revenue data in the data room during investment due diligence; require
      at least three years of cohort history segmented by merchant tier (BDC vs standard enterprise).

      '
    relatedQuestionRefs:
    - QU006
    - QU011
  - type: private-evidence-only
    severity: material
    topic: merchant-concentration
    missingEvidence: 'Individual merchant TPV breakdown and top-N merchant concentration are not publicly disclosed by Checkout.com.
      The 40-50% top-20 concentration estimate is entirely derived from industry benchmarks and BDC structure, not from any
      disclosed data point.

      '
    whyItMatters: 'Material top-merchant concentration could create significant revenue risk if a large BDC merchant churns
      or reduces volumes; this risk is not quantifiable from public information alone, making it a blocking diligence item
      for any investment decision.

      '
    diligencePath: 'Request merchant-level TPV distribution under NDA, with specific focus on the top 10 BDC merchants; model
      scenarios for single-merchant and top-5 departure to stress-test the investment thesis.

      '
    relatedQuestionRefs:
    - QU014
