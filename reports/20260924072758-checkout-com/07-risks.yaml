chapter:
  number: 7
  title: Risks
  summary: 'Checkout.com''s risk profile is dominated by three interlocking threats: its Jersey parent structure creates regulatory
    opacity across UK, EU, and US jurisdictions; Guillaume Pousaz''s 100% founder control and Monaco relocation represent
    a concentrated key-person dependency with no disclosed succession plan; and its Azure-only cloud architecture exposes
    the 99.999% uptime SLA to single-provider failure during peak processing events. The April 2024 ShinyHunters security
    incident, while not confirmed as a card-data breach, has elevated reputational risk and ICO scrutiny; the January 2026
    MALPB bank charter is operationally positive but introduces new BSA/AML compliance obligations that are untested at scale.

    '
sections:
- id: regulatory-legal-compliance-risks
  title: Regulatory, Legal, and Compliance Risks
  body: "Checkout.com operates through a complex multi-jurisdictional structure that creates compounding regulatory risk.\
    \ The parent entity, Checkout Group Ltd, is incorporated in Jersey \u2014 a Crown dependency that requires no mandatory\
    \ consolidated P&L disclosure and operates outside direct EU or UK FCA regulatory perimeter at the group level. This creates\
    \ opacity for regulators and investors evaluating capital adequacy and group-level exposures. The two principal UK operating\
    \ subsidiaries, Checkout Ltd and Checkout Technology Ltd, hold active FCA payment institution licences under the Payment\
    \ Services Regulations 2017. FCA enforcement actions in the payments sector have been limited historically, but the FCA\
    \ has signalled increasing scrutiny of large non-bank payment institutions, particularly following the collapse of Wirecard;\
    \ any formal investigation would be a material enterprise sales and investor confidence risk even without revocation.\n\
    The January 2026 MALPB (Merchant Acquirer Limited Purpose Bank) charter approval from the Georgia Department of Banking\
    \ and Finance is strategically positive but introduces new US federal and state regulatory obligations. As a chartered\
    \ banking entity, Checkout.com becomes subject to enhanced BSA/AML program requirements under FinCEN guidelines and potential\
    \ CFPB oversight as it expands into consumer-adjacent payment services. The CFPB has increasingly scrutinised large non-bank\
    \ payment processors since 2023; the MALPB charter potentially brings Checkout.com under expanded CFPB supervisory authority.\
    \ US state money transmitter licences are required across approximately 30 states even with the MALPB charter in place;\
    \ the MALPB reduces but does not eliminate the burden of maintaining state-level money service business registrations.\
    \ PSD2/PSD3 compliance is ongoing across EU/EEA markets; the PSD3 legislative process is expected to conclude in 2026\u2013\
    27, requiring Checkout.com to adapt open banking, authentication, and liability frameworks. GDPR/UK GDPR exposure from\
    \ the April 2024 ShinyHunters incident remains live: the ICO was notified but no confirmed enforcement action has been\
    \ publicly reported; a confirmed data breach could trigger fines up to 4% of global annual revenue, which is material\
    \ given that Checkout.com does not disclose this figure.\n"
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR015
  - CR016
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-security-risks
  title: Operational and Security Risks
  body: "In April 2024, the ShinyHunters criminal hacking group claimed to have accessed Checkout.com's legacy cloud storage\
    \ environment, asserting that 35,000 payment card records were exposed. Checkout.com's CTO confirmed that no card data\
    \ was exfiltrated \u2014 the storage environment contained operational data, not cardholder data in PCI scope \u2014 and\
    \ donated an equivalent sum to a security research fund. The ICO was notified per UK GDPR obligations. However, the reputational\
    \ damage from a named breach claim involving one of the world's largest PSPs cannot be quantified in public sources, and\
    \ no independent forensic report has been released. Any future ICO enforcement notice, even for a process violation rather\
    \ than a data breach, would reintroduce this risk to enterprise sales cycles.\nCheckout.com's infrastructure runs exclusively\
    \ on Microsoft Azure under a multi-year partnership agreement. The company has not disclosed any multi-cloud failover\
    \ architecture, geographic redundancy outside Azure regions, or Recovery Time Objective (RTO) commitments in the event\
    \ of an Azure regional or service-wide outage. The 99.999% uptime SLA equates to approximately 5 minutes of downtime per\
    \ year; during the November 2025 Black Friday/Cyber Monday peak, the platform processed $5.2 billion in a single 24-hour\
    \ period. An Azure outage of even 30 minutes during a future BFCM event would represent approximately $108M in unprocessed\
    \ payments and potential SLA breach penalties across hundreds of enterprise contracts. PCI DSS Level 1 certification must\
    \ be renewed annually; any lapse or failure in the annual certification audit would trigger contract termination clauses\
    \ in standard PSP merchant agreements and could result in Visa/Mastercard fines against Checkout.com. API versioning and\
    \ deprecation risk is a structural concern in Checkout.com's developer ecosystem: enterprise merchants who integrate against\
    \ older API versions face breaking changes during migration, and the absence of a public API lifecycle governance document\
    \ creates uncertainty for long-term integration planning. Rising chargebacks in higher-risk merchant verticals could trigger\
    \ Visa and Mastercard monitoring programmes if rates exceed 1%; Checkout.com's Fraud Detection Pro product is a mitigation\
    \ but chargeback rate data is not publicly disclosed.\n"
  claimRefs:
  - CR004
  - CR005
  - CR006
  - CR012
  - CR013
  - CR014
  tableRefs:
  - TR002
  figureRefs: []
- id: partner-dependency-financial-risks
  title: Partner, Dependency, and Financial Risks
  body: "Guillaume Pousaz founded Checkout.com, is its sole controlling shareholder, and relocated from the UK to Monaco in\
    \ April 2025. No succession plan, deputy CEO, or independent board governance structure has been publicly disclosed. This\
    \ creates the most consequential key-person risk in the payments sector at the company's scale: Pousaz's departure, incapacitation,\
    \ or reputational event would instantly affect investor confidence, enterprise procurement decisions, and the ability\
    \ to complete an IPO or strategic transaction. The company's two most critical senior executives \u2014 CTO Mariano Albera\
    \ and CRO Antoine Nougu\xE9 \u2014 were both retained as of May 2026, but the competitive talent market for payments engineering\
    \ and enterprise sales leadership makes their continued retention a monitoring item. Jordan Reynolds, appointed as MALPB\
    \ CEO in 2025, is a key hire for US expansion but has been in role less than two years.\nCheckout.com's direct card acquiring\
    \ model depends entirely on active principal membership with Visa and Mastercard. Any violation of network rules \u2014\
    \ including merchant risk thresholds, chargeback rates, or prohibited category processing \u2014 could trigger a membership\
    \ review or suspension that would halt acquiring across the entire merchant base. No network suspension has occurred,\
    \ but the absence of public chargeback rate data makes this risk impossible to independently assess. Microsoft Azure remains\
    \ Checkout.com's sole disclosed cloud provider; no multi-cloud or distributed-provider strategy is public. The January\
    \ 2026 Blue EMI acquisition adds a Lithuania-based digital currency and stablecoin settlement subsidiary whose integration\
    \ into the core platform is ongoing and creates execution risk during a period when management is simultaneously executing\
    \ the MALPB charter build-out.\nOn the financial side, Checkout.com has not raised institutional capital since the January\
    \ 2022 $1B Series D at $40B valuation. The September 2025 employee buyback established a $12B implicit valuation \u2014\
    \ a 70% discount to peak. This compression means employee equity granted at prior valuations is materially underwater,\
    \ creating talent retention risk across the engineering, sales, and product functions where equity is the primary long-term\
    \ compensation driver. Revenue concentration among the Billion Dollar Club's 63 merchants \u2014 estimated at 40\u2013\
    50% of $300B+ TPV in the top 20 \u2014 is not publicly disclosed but is the single largest financial risk to the investment\
    \ thesis. One significant BDC departure could represent $2B+ of annual TPV loss without a guaranteed replacement timeline.\
    \ The company's 150+ currency processing scope creates ongoing FX exposure in a USD-strong macro environment; no hedging\
    \ policy has been publicly disclosed.\n"
  claimRefs:
  - CR007
  - CR008
  - CR009
  - CR010
