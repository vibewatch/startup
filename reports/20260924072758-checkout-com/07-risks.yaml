      structure makes UK group-level oversight more complex than for a domestically consolidated entity.

      '
    diligencePath: 'Request full regulatory correspondence history from management under NDA; conduct direct FCA regulatory
      intelligence call; obtain independent regulatory counsel review of compliance programme.

      '
