  - type: missing-source
    severity: material
    topic: azure-multi-cloud-failover
    missingEvidence: 'No public documentation, architecture diagram, or operational disclosure confirms whether Checkout.com
      has any multi-cloud failover capability, secondary cloud provider agreements, or Recovery Time Objective / Recovery
      Point Objective commitments beyond intra-Azure regional redundancy. The Microsoft Azure partnership is multi-year but
      does not preclude a simultaneous multi-region or service-wide failure.

      '
    whyItMatters: 'At $5.2B/day peak processing, a 4-hour Azure outage represents approximately $867M in unprocessed payments
      and would likely breach the 99.999% annual SLA; without multi-cloud failover, the SLA commitment is structurally unsupportable
      and may expose Checkout.com to material contractual penalty liability.

      '
