summary:
  headline: >
    Checkout.com 是一家具备技术差异化优势的直连收单企业支付平台，2025 年首次实现全年盈利且 TPV 增速走高；但其 $12B 估值（较 2022 年峰值折让 70%）也反映出真实的透明度风险，根源在于 Jersey
    控股架构、关键人过度集中以及超过 3 年（3+ 年）未引入新机构资金。
