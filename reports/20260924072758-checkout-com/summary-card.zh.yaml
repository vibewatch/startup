summary:
  headline: >-
    Checkout.com 的企业支付平台以直连收单和技术差异化见长，2025 年首次实现全年盈利，TPV 增速也在加快。当前 $12B 估值较 2022 年峰值低 70%，背后是 Jersey
    控股架构不透明、关键人高度集中，以及三年多没有新机构资本进入等真实风险。
