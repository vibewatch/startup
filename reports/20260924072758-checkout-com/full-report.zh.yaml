companyProfile:
  summary: >
    Checkout.com 由 Guillaume Pousaz（曾任职于 Visa 和 PayPal 的法裔瑞士创业者）于 2012
    年在伦敦创立，初衷是解决传统收单机构授权率偏低、处理迟缓与透明度不足的痛点，满足跨国大型企业诉求。公司打造了一套云原生直连收单支付平台，绕开传统中间件，助推大型企业商户获得更高授权率并压低交易成本。在自筹资金完成早期积累后，Checkout.com
    历经多轮融资累计吸纳 $1.8B，并于 2022 年 1 月以 $40B 顶峰估值完成 Series D 轮（投资方包括 Altimeter、Dragoneer、Franklin Templeton、GIC、Insight
    Partners、QIA、Tiger Global）。受 Fintech 估值倍数普遍回调拖累，2025 年 9 月二级市场老股转让将其估值重置至约 $12B，但公司仍在 2025 年首度录得全年调整后 EBITDA 盈利，TPV
    突破 $300B+（同比增 64%），净收入增速超过 30%。2026 年 1 月，Checkout.com 获批佐治亚州 MALPB 银行牌照，得以甩开合作银行中介在美国本土开展直连收单，拿下重要竞争节点。公司还在 2026 年
    1 月收购立陶宛数字货币平台 Blue EMI，并于 Forrester Wave: Payment Processing Platforms, Q1 2026 评选中位列领导者（Leader）。
