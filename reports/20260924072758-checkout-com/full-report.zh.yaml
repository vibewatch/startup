      - number: '7.3'
        title: 合作伙伴、外部依赖与财务风险
        blocks:
          - type: paragraph
            body: >
              Guillaume Pousaz 创办了 Checkout.com 且为唯一控股股东，于 2025 年 4 月将居所从英国迁往摩纳哥。公开资料中未见任何接班人计划、副 CEO
              或独立董事治理架构的披露。在同等规模的支付机构中，这是最为严峻的关键人物风险：Pousaz 的离职、履职能力丧失或负面声誉事件，将直接打击投资人信心、企业采购决策以及推进 IPO 或战略交易的能力。截至 2026
              年 5 月，公司最核心的两名高管——CTO Mariano Albera 与 CRO Antoine Nougué——均在任，但支付工程与大企业销售管理人才竞争激烈，核心团队的长期留存仍需持续跟踪。2025
              年获任 MALPB CEO 的 Jordan Reynolds 是美国拓展的关键雇员，但履职尚不足两年。


              Checkout.com 的直连卡收单模式完全依赖 Visa 与 Mastercard 的正式主要会员（Principal
              Membership）资格。任何违反卡组织规则的行为——包括商户风险阈值、拒付率超标或处理违禁类别交易——都可能招致会员资格重审甚至暂停，导致面向全部商户的收单业务停摆。历史上未曾发生过被卡组织暂停的情况，但因缺少公开拒付率数据，外部无法独立评估该风险。Microsoft
              Azure 仍是 Checkout.com 唯一披露的云服务商，公开信息中未见多云或分布式供应商策略。2026 年 1 月收购的 Blue EMI
              引入了一家位于立陶宛的数字货币与稳定币结算子公司，将其整合进核心平台的工作仍在推进，在管理层同步推进 MALPB 银行牌照建设的窗口期，带来了执行分散与整合风险。


              财务端，自 2022 年 1 月按 $40B 估值完成 $1B D 轮融资以来，Checkout.com 再未引入机构资本。2025 年 9 月的员工回购确立了 $12B 的内含估值——较峰值折价
              70%。估值下挫导致此前按高位定价授予的员工期权大面积破发（underwater），给期权作为核心长期激励手段的工程、销售与产品团队带来人才流失隐患。在十亿美元俱乐部 63 家商户中的收入集中度——估计前 20
              大商户占据 $300B+ TPV 的 40%–50%——未公开披露，却是本投资逻辑中最大的单项财务风险。单一核心 BDC 商户流失就对应超过 $2B 的年 TPV 缺口，且难以保证补齐周期。此外，公司支持 150
              多种货币处理，在美元强势的宏观环境下持续面临外汇风险敞口；公开资料中未披露任何外汇对冲政策。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
