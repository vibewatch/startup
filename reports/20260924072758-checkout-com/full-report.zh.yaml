  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与分类架构
        blocks:
          - type: paragraph
            body: >
              Checkout.com 主阵地属于企业级支付处理市场——涵盖为大型商业商户提供无卡交易（线上）及有卡交易的端到端处理。该市场囊括支付收单（受理银行卡交易并路由至卡组织网络）、支付网关软件（基于 API
              的交易路由与 Token 化）、反欺诈风控管理、替代支付方式（APM）受理（涵盖电子钱包、BNPL 与实时支付）、B2B
              场景发卡以及资金代付。该市场明确排除个人储蓄、抵押贷款、保险与财富管理等零售银行业务。公司借力收购 Blue EMI 进军数字货币结算，并依托佐治亚州 MALPB
              牌照切入美国受监管银行业务，以此拓展相邻市场。现存替代选项包括合作银行系收单关系（Chase
              Paymentech、Barclays、Lloyds）、老牌支付服务商（Worldpay/FIS、Adyen、Stripe）以及头部超大型商户自建支付底座（Amazon Pay、Meta
              Pay）。市场核心分水岭在企业级与中小微（SMB）：Checkout.com 主攻年营收大致在 $100M 以上的商户，满足其对定制集成、50+ 国家本地收单与专属技术支持的苛刻诉求——这块客群比专注 SMB
              的玩家（Stripe、Square、PayPal）所处圈层更窄，但客单价值更高。
