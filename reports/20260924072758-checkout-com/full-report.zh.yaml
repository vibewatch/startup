      - number: '3.3'
        title: 定价策略与渠道分发动态
        blocks:
          - type: paragraph
            body: >
              处于 Checkout.com 竞争梯队的主流支付机构——包括 Adyen、Stripe、Worldpay、Braintree 或
              JPMorgan——均未公开大客户合同定价。所有大型企业协议均为一客一议、按量分档的定制化结构，打包收单费、网关费与各类增值功能收费。公开标价（如 Stripe 的 2.9%+$0.30 和
              Braintree/PayPal 的 2.59%+$0.49）仅针对中小微及散客，完全不能代表企业级合同的真实水平。

              从上市公司披露来看，Adyen 的综合抽成率大致在交易规模的 0.13–0.15%，对应其专做大企业的纯粹客群与相对偏低的增值服务挂钩率。Checkout.com 的推算变现率约为
              0.20–0.30%（按公开披露的 $300B 交易量及测算的 $600M–$900M 营收推导），显示其依靠 AI 授权增值包、APM 渠道费及发卡产品获取了更高的单笔附加值。Stripe
              的实际综合抽成率偏高（约 0.4–0.5%），主因是夹杂大量 SMB 与腰部客群，但其纯大客户定价基本向 Adyen 和 Checkout.com 趋同。

              GTM 商业打法的分野十分鲜明。Checkout.com 采用配备专属商户成功经理的直销模式——与 Adyen 的打法类似。Stripe
              则依靠产品驱动增长（PLG）漏斗，先攻占开发者心智再向企业级大单转化。JPMorgan 将支付服务打包进庞大的对公银行业务里，拉低边际费率的同时加深商户对银行综合信贷体系的绑定。Worldpay
              则以传统分销商和银行网点代理为主要获客触手，对追求现代集成架构、坚持 API 优先的数字化大企业缺乏吸引力。
            claimRefs:
              - CP007
              - CP010
