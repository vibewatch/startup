              估值模型，没有新的外部机构融资来验证真实市场价格。母公司注册在泽西岛，并无公开披露收入或利润的法定要求，外界很难独立验证公司关于财务表现的主张。在做出任何资金承诺前，尽调必须索取经审计的账目、详细股权结构表（cap
