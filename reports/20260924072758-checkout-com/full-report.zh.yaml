      - number: '5.2'
        title: 技术架构与运营模型
        blocks:
          - type: paragraph
            body: >
              Checkout.com 底层系统全面云原生化，依据 2025 年 10 月公布的多年期战略合作，全盘搭建在 Microsoft Azure 之上，横跨全球多个 Azure 数据中心区域，用以支撑 50+
              个国家的收单覆盖，并具备异地容灾与多区域自动故障倒换能力。公司承诺 99.999% 的服务可用性 SLA；公开状态监控页面 status.checkout.com 实时提供系统组件健康度指标与历史故障报告。

              整体技术栈分为清晰的五层架构。顶层为商户 API 与 SDK 层，作为所有支付模块的统合 RESTful 入口，在 github.com/checkout 官方组织下开源维护生产级 SDK，涵盖
              Python、Node.js、.NET、Java、Go 以及 iOS（Frames）和 Android（Frames）。向下为 Intelligent Acceptance 决策引擎，每日调度 87M
              次机器学习推演，涵盖智能重试、网络 Token 优化与 3DS 校验研判。居中的直连收单核心——受英国 FCA 监管并取得佐治亚州 MALPB 牌照覆盖美国——直接接入 Visa、Mastercard 与
              Amex 卡网络会员清算通道。各类增值模块（Fraud Detection Pro、Flow、Payouts、Network Tokens、Card Issuing）共用同一个 Azure 后端集群。最底层的
              APM 编排层则借助托管跳转和静默重定向协议，分发对接 50+ 种第三方支付工具。

              2025 年黑五与网一的业务洪峰验证了高负载韧性：系统在 24 小时内抗住约 100M 笔交易，安全放行 $5.2B 支付规模而未发生任何宕机事故。Checkout.com 还是 2024 年首个落地
              Google Pay 安全支付身份验证（SPA）的支付机构，印证了其与顶尖一线科技巨头的深度集成实力。针对移动端，Frames SDK（iOS 和 Android）提供了预置且符合 PCI
              标准的卡号输入组件，帮助商户在免受 PCI 合规边界蔓延困扰的前提下安全接入移动支付。
