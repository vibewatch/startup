      - number: '2.3'
        title: 买方画像与客群分布
        blocks:
          - type: paragraph
            body: >
              Checkout.com 锁定的采购决策者是大型企业商户的支付或资金主管——通常是支付副总裁（VP of Payments）、CFO 或 CTO，后台常配有涵盖 IT
              安全、法务与财务的供应商评估小组。这类客户决策周期冗长（6–18 个月），且系统迁移成本高昂（涉及 API
              改造对接、联调测试与合规审查）。主要服务的垂直细分领域包含电商与平台撮合（eBay）、出行与网约车（Uber）、数字订阅与流媒体（Spotify）、社交电商（Pinterest）及各类数字化服务。按地域划分，Checkout.com
              最主要的落地阵地在欧洲（总部位于英国，持 FCA 牌照），同时在北美突飞猛进（2025 年美国业务量增速超 70%，加拿大直连收单于 2025
              年上线）。亚太、拉美（圣保罗枢纽）、中东及日本构成了增量拓客边界。包含 63 家商户的“十亿美元俱乐部”稳居买方金字塔顶尖——每家在平台上年处理交易量均突破 $1B，高于 2024 年的 39
              家，印证了存量商户规模扩张与新增大型企业客户拓展并进。买方的首要决策指标包括：授权率（Intelligent Acceptance 平均提升 3.8%）、平台高可用性（99.999%
              在线率）、本地收单覆盖能力、反欺诈与拒付管理能力，以及综合处理成本。
            claimRefs:
              - CM016
