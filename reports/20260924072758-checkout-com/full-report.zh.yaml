      - number: '7.3'
        title: 合作伙伴、依赖项与财务风险
        blocks:
          - type: paragraph
            body: >
              Guillaume Pousaz 创立了 Checkout.com，是其唯一控股股东，并于 2025 年 4 月从英国迁往摩纳哥。公司未公开披露任何接班人计划、副首席执行官（deputy
              CEO）或独立董事治理架构。以公司的体量，形成支付赛道影响最深远的关键人物风险：Pousaz 一旦离职、丧失履职能力或发生声誉事件，将立刻冲击投资者信心、企业采购决策以及推进 IPO
              或战略交易的能力。公司最核心的两位高管——CTO Mariano Albera 和 CRO Antoine Nougué——截至 2026 年 5
              月仍在任，但支付工程和企业销售领导力领域的人才竞争激烈，二人的持续留任需要长期跟踪。2025 年获任命为 MALPB CEO 的 Jordan Reynolds 是拓展美国市场的关键引援，但其在任时间不足两年。

              Checkout.com 的直连卡收单模式完全依赖 Visa 和 Mastercard 的有效主清算会员资质（principal
              membership）。任何违反卡组织规则的行为——包括超过商户风险阈值、拒付率超标或处理违规品类交易——都可能触发会员资格审查或暂停，进而导致整个商户底盘的收单业务停摆。目前尚未发生过卡组织暂停资质的情况，但由于拒付率数据未公开披露，外部无法对此风险展开独立评估。Microsoft
              Azure 仍是 Checkout.com 唯一披露的云服务商，未见公开的多云或多云厂商策略。2026 年 1 月收购的 Blue EMI
              带来了一家设在立陶宛的数字货币与稳定币结算子公司，将其整合进核心平台的工作仍在推进，在管理层同时筹建 MALPB 牌照落地之时，增加了执行风险。

              财务方面，Checkout.com 自 2022 年 1 月按 $40B 估值完成 $1B D 轮融资以来，未再引入任何机构资本。2025 年 9 月的员工回购确立了 $12B 的内含估值——较峰值折价
              70%。这一估值压缩意味着此前按更高估值授予的员工期权/股权大面积深陷水下，给工程、销售和产品部门带来人才留存风险，而股权恰恰是这些部门的核心长期薪酬支柱。收入在 63 家 Billion Dollar Club
              商户中的集中度（估计前 20 大客户占 $300B+ TPV 的 40–50%）未公开披露，构成本投资论点面临的单一最大财务风险。单个 BDC 核心客户的流失就可能对应 $2B+ 的年 TPV
              损失，且无法保证补足周期的长短。公司支持 150+ 种货币处理，在强势美元的宏观环境下带来了持续的外汇风险暴露，且未公开披露任何对冲策略。
            claimRefs:
