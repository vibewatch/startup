      - number: '5.2'
        title: 系统架构与运营模式
        blocks:
          - type: paragraph
            body: >
              Checkout.com 的底层平台采用云原生架构，依据 2025 年 10 月公布的多年期战略合作协议全量运行在 Microsoft Azure 之上，横跨全球多个 Azure 区域，以支撑 50+
              个国家/地区的收单覆盖，兼具容灾备份与多可用区故障转移能力。公司承诺 99.999% 的系统可用性 SLA；公共状态看板 status.checkout.com 实时披露系统组件运行状态及历史突发事件记录。

              技术栈划分为五层架构。顶层为商户 API 与 SDK 层，向所有支付产品提供单一的 RESTful 入口，在 github.com/checkout 组织名下以开源形式维护覆盖
              Python、Node.js、.NET、Java、Go、iOS（Frames）及 Android（Frames）的生产级 SDK。第二层为 Intelligent Acceptance 引擎，围绕智能重试、网络
              Token 优化与 3DS 校验决策每日执行 87M 次机器学习决策。第三层为直连收单核心——在英国拥有 FCA 牌照，在美国佐治亚州持有 MALPB 牌照——驻留在授权与结算层，持有
              Visa、Mastercard 与 Amex 的卡组织直连成员资格。第四层为增值服务层（Fraud Detection Pro、Flow、Payouts、Network Tokens、Card
              Issuing），共享 Azure 后端算力。第五层为 APM 编排层，通过托管重定向与静默重定向流程对接 50+ 种第三方支付方式。

              2025 年黑色星期五与网络星期一期间平台顶峰平稳度过，24 小时内处理了约 100M 笔交易、累计 $5.2B 交易额且未发生故障，验证了基础设施的高弹性吞吐能力。Checkout.com 在 2024
              年成为首家上线 Google Pay 安全支付认证（SPA）的支付机构，印证了其与头部科技巨头的深度工程对接实力。Frames SDK（iOS 与 Android）提供开箱即用且符合 PCI
              标准的卡号输入组件，使商户能够在不扩大自身 PCI 审计范围的前提下支持移动端刷卡支付。
