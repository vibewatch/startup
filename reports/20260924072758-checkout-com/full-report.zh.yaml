              BDC 在单个财报周期内同比扩张 62%（成员从 39 家增至 63 家），有力证明 Checkout.com 正在加速留存既有大型商户并拓展头部新客。按最低变现率预估，每家 BDC 商户对应一份年化收入预估超过
