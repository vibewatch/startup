      - number: '3.2'
        title: 功能特性与能力横向对比
        blocks:
          - type: paragraph
            body: >
              从五大核心采购基准审视——AI 授权优化、直连收单基础设施、替代支付方式（APM）覆盖广度、发卡能力以及开发者体验——Checkout.com 率先跑出 AI
              授权与美国直连收单（MALPB）双重先发优势，但在全部五个维度上均遭遇势均力敌的追击。

              AI 授权是业内最具争议的差异化标签。Checkout.com 的 Intelligent Acceptance 宣称基于年处理量 $300B
              的交易语料库训练模型，将交易动态路由至最优收单路径，平均为银行卡授权率带来 +3.8 个百分点的拉升。Adyen 打造的“Uplift”与“Optimum Authorisation”以及 Stripe
              的“Adaptive Acceptance”是主要对标竞品——两者均在 2024 年面世或大幅升级，正在迅速咬合差距。截至 2026 年初，预计 Checkout.com 的领先窗口仅有 12–18 个月。APM
              覆盖面由 Adyen（200+ 种渠道）在绝对数量上领跑，但 Checkout.com 胜在近期增势（2025 年基于 50+ 种渠道交出 104% 的 APM 处理量增速），显示 Checkout.com
              正在亚太和中东北非（MENA）加深本地集成，而非单纯增加支付方式。

              直连收单基础设施是更难复刻的护城河。Adyen 耗费 18 年才搭建起全球直连收单管网。Checkout.com 正依托佐治亚州 MALPB 牌照（2026 年 1
              月获批）弯道超车，省去了美国本土卡结算时赖以过桥的赞助银行中介——这一结构性壁垒目前尚未被 Stripe 或 Braintree 抹平。开发者体验依然是 Stripe 最深厚的壁垒；Checkout.com
              SDK 覆盖面虽广（覆盖 iOS、Android 及 Web 的 50+ 款 SDK，含 Frames 银行卡组件），但仍不及 Stripe 详尽的技术文档和浓厚的开发者社区号召力。
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP011
              - CP012
              - CP014
