          - type: callout
            title: ShinyHunters 数据泄露整改进展未披露公开确认
            body: >
              2021 年前后被黑客组织 ShinyHunters 披露的历史遗留云存储安全事件目前仍处于未完全关闭状态：截至 2026 年 5 月，尚未发布公开的事件后整改总结报告，亦未确认最终闭环时间表。尽管 CTO
              公开发声保证未造成持卡人数据或资金外泄，但跨国企业级客户采购委员会与英国监管机构 FCA 通常需要正式的书面闭环整改合规认证作为长期准入条件。
