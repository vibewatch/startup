      - number: '6.2'
        title: 采纳路径与业务增速
        blocks:
          - type: paragraph
            body: >
              Checkout.com 在 2025 年交出的核心运营数据，代表着同等体量支付基础设施服务商中的顶尖增长水平。全年总处理量（TPV）突破 $300 billion，同比增长 64%。公司日均处理超 $1
              billion 交易额，而在 2025 年黑色星期五与网络星期一高峰期，24 小时创纪录处理了 $5.2 billion——向大客户有力印证了其在应对极高洪峰季节性交易时的弹性基建吞吐承载力。

              “十亿美元俱乐部”（BDC）商户数由 39 家跃升至 63 家，年处理量超 $1 billion 的头部大商户数量同比激增
              62%。这一群体的扩张是衡量头部大客采纳度的最核心指标——表明公司最大、价值最高的客户群不仅留存稳固，且新增大商户正加速涌入。每家年交易量 $1B+ 的 BDC 商户按 0.2% 估算抽成率测算，每年贡献超
              $2M 收入，仅这 63 家 BDC 商户就锁定了至少 $126M 的估算年度经常性收入。

              存量商户大盘内的产品渗透率亦快速攀升。替代支付方式（APM）交易量同比增长 104%，反映出老客户更倾向于在平台内开启更多 APM 通道而非转投其他竞品。发卡业务在 2025 年 Q4 达到 $5 billion
              年化运行率。受 2025 年 10 月获批佐治亚州 MALPB 银行牌照助推的北美加速战略支撑，美国交易量同比劲增约 70%。净收入连续第二年维持 30%
              以上的稳健增长，与强劲的净金额留存率（NRR）表现高度吻合。
