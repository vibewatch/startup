  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与细分界定
        blocks:
          - type: paragraph
            body: >
              Checkout.com 的主阵地是企业级支付处理——为大型商业机构端到端处理非面对面（线上无卡交易）与面对面刷卡交易。该市场涵盖支付收单（受理银行卡交易并路由至卡组织网络）、支付网关软件（基于 API
              的交易路由与 Tokenization 代币化）、欺诈识别与风控、替代支付方式（APM，如电子钱包、BNPL 与实时支付）受理、B2B
              场景发卡以及代付清算。该市场明确排除了个人银行存款、房贷抵押、保险及投资产品。公司向外延伸的相邻市场包括数字货币清算结算（借助收购 Blue EMI）以及美国受监管银行业务（借助佐治亚州 MALPB
              牌照）。现状替代品包括银行自营收单渠道（Chase
              Paymentech、Barclays、Lloyds）、传统支付服务提供商（Worldpay/FIS、Adyen、Stripe），以及超大型商户自建的专属支付基础设施（Amazon Pay、Meta
              Pay）。市场划分的核心分水岭在于企业级客群与 SMB：Checkout.com 锚定年交易额大致在 $100M 以上的商户，这类商户需要定制化系统对接、覆盖 50+
              个国家和地区的本地收单能力以及专属技术支持——相比深耕 SMB 的厂商（Stripe、Square、PayPal），这一客群规模虽小，价值密度却更高。
