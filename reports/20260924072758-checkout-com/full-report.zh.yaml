      - number: '2.2'
        title: 市场规模测算——多重视角
        blocks:
          - type: paragraph
            body: >
              目前没有哪份权威市场测算报告的统计范畴能与 Checkout.com 的产品矩阵完全对齐，因此需要从多重视角交叉校验。视角一（基于交易量）：2024-2025 年全球电商交易体量估计达每年 $5–7
              trillion。企业级处理商的抽成率约为交易量的 0.10–0.30%；若将该比例套用到全球数字商业的企业级板块，可测算出处理商每年的收入池在 $10–25B（保守估计）到
              $50B+（包含增值服务）。视角二（上市企业对照）：Adyen（上市企业，收入约 $2B，在约 €1.35T 交易量上取得约 0.15% 抽成率）与 Stripe（非上市，在约 $1T 交易量上估计实现收入约
              $5B）可作为市场校准坐标。若按 Checkout.com 的 $300B 交易量及 0.20–0.30% 测算抽成率，推导出的总收入约为 $600M–$900M，与 30%+
              的增速画像相吻合。视角三（宏观行业报告）：各分析机构报告预计到 2028 年全球支付网关与处理市场将达 $75–130B（含 SMB 客群），但 Checkout.com
              能够触达的企业级细分市场明显更小。市场测算缺口显著：尚无公开收入确认、未披露毛利率，叠加私营企业属性，使人无法将其锚定为单一数字。所有估算均存在重大不确定性，仅能作为数量级维度的指引。
