chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与商业模式
        blocks:
          - type: paragraph
            body: >
              Checkout.com 由 Guillaume Pousaz 于 2012
              年创立，定位于面向全球企业级商户的全栈支付基础设施提供商。公司提供涵盖收单、支付网关、发卡、反欺诈风控、替代支付方式与代付打款的端到端支付服务。其核心客群以大型企业商户为主——截至 2026 年初已超 1,000
              家，其中包含 63 家在平台上年处理支付量超 $1B 的“十亿美元俱乐部”成员。公司销售打法紧盯那些交易体量庞大、业务复杂，且亟需在 50+
              个国家获取定制化授权优化、风险管理和本地收单能力的商户。收入主要来自支付处理手续费，同时来自 Intelligent Acceptance 和发卡等增值服务的贡献与日俱增。控股母公司注册于离岸法域
              Jersey，法律上无强制披露收入或利润的要求。集团主要依托两家英国核心子公司运营：持有 FCA 收单牌照的 Checkout Ltd，以及持有全部知识产权并雇佣研发团队的 Checkout Technology
              Ltd。该架构让集团在跨司法辖区管理 IP 所有权与调配应税利润时具备充分弹性。
