  productSummary: >
    Checkout.com 提供统一的企业级支付平台，涵盖七大核心模块：(1) 银行卡直连收单（Visa/Mastercard/Amex），持有英国 FCA 牌照及美国 MALPB 银行牌照；(2) Intelligent
    Acceptance——借助 AI/ML 路由与优化，在日均 87M 次决策中带来平均 +3.8% 的授权成功率提升；(3) Flow——托管式收银台转化产品；(4) Card Issuing 发卡业务（与 Visa
    合作，英国/EEA 已全面商用，ARR 达 $5B）；(5) Fraud Detection Pro 反欺诈模块；(6) Payouts 代付清算；(7) 50+ 种替代支付方式，覆盖数字钱包、BNPL 与实时支付。
  customerFocus: >
    聚焦数字商业、FinTech/加密货币、差旅、流媒体/SaaS 以及平台电商等垂直领域的企业级与成长期商户——年支付处理量通常超过 $100M/年。主要公开标杆客户包括
    Wise、Spotify、eBay、Shein、Coinbase、PizzaHut、Virgin 及 Samsung。
  businessModel: >
