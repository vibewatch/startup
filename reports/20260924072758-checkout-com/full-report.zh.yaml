      - number: '3.2'
        title: 功能与核心能力对比
        blocks:
          - type: paragraph
            body: >
              在五大核心采购指标——AI 授权率优化、直连收单基础设施、替代支付方式（APM）覆盖广度、发卡能力以及开发者体验中，Checkout.com 在 AI
              授权优化和美国直连收单（MALPB）上抢占了先发优势，但在全部五个维度上均面临强劲挑战。

              AI 授权优化是讨论最多的差异化卖点。Checkout.com 旗下的 Intelligent Acceptance 借助每年 $300 billion
              交易体量训练的模型将交易导向最优收单链路，官方数据称将银行卡授权成功率平均拉高 +3.8 个百分点。Adyen 的 “Uplift” 与 “Optimum Authorisation” 以及 Stripe 的
              “Adaptive Acceptance” 是最主要的竞品举措——均在 2024 年推出或大幅升级——正在缩小差距。截至 2026 年初，估计 Checkout.com 的领先优势在 12–18 个月。APM
              覆盖广度上 Adyen（200+ 种）占据优势，但近期增速上 Checkout.com 更胜一筹（2025 年在 50+ 种方式上取得 104% 的 APM 处理量增长），表明 Checkout.com
              正在亚太和中东及北非（MENA）深化整合，而非盲目扩充数量。

              直连收单基础设施是更难被复制的护城河。Adyen 花了 18 年打造直连收单网络。Checkout.com 正凭借佐治亚州 MALPB 牌照（2026 年 1
              月获批）加速超车，此举免除了美国银行卡结算中的银行赞助（sponsor bank）中介层——这一结构性优势尚未被 Stripe 或 Braintree 复刻。开发者体验依然是 Stripe
              最稳固的竞争壁垒；Checkout.com 的 SDK 覆盖（覆盖 iOS、Android 及 Web 端的 50+ 种 SDK，包括 Frames 卡输入组件）虽具竞争力，但在文档深度和开发者社区运营上仍难匹敌
              Stripe。
            claimRefs:
              - CP004
              - CP005
