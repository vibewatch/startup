      增速推算得出（该基数本身同样属于估算；Checkout.com 并未披露净收入）。概率信号属于定性判断，不代表统计学意义上的预测。三种情景互斥且穷尽；概率信号相加约 80–110%，允许重叠以作示意性权重参考。
