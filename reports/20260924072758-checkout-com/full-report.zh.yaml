      - - 基准
        - 美国 MALPB 交易量同比增速 50–70%；发卡业务 ARR 达 $8–10B；TPV 达到 $400B+；收入增长 25–35%；经调整 EBITDA 利润率 12–15%；2028 年前不上市
        - $16–22B
