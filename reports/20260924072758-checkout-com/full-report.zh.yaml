          - type: callout
            title: 绑定 Azure 多年期战略合作带来的单一云厂商依赖
            body: >
              2025 年 10 月签署的多年期 Azure 战略合作形成了对单一公有云服务商的高度依赖，短期内业务跨云迁移难度极大。一旦 Azure
              发生大区服务中断或单方面调整云资源定价，将直接波及底层平台的可用性与运营成本。其技术架构中未见关于多云备份或混合云冗余的公开披露。
            calloutType: insight
