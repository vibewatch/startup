          label: 增值服务收入贡献
    approximationNotes: >
      营收数据基于已公开披露交易量（$300B+）及分析师推算的变现率基准（0.20%–0.30%）测算。不存在经审计或公司官方证实的营收数据。净营收节点剔除了作为总收入至净收入最大抵扣项的交换费转付。公开资料中未见增值服务分项营收明细。
    claimRefs:
      - CI001
      - CI005
  - id: FE001
    title: 产品架构图
    type: stack
    summary: |
      Checkout.com 支付平台五层技术架构，自商户开发者接口贯穿至卡组织直接收单与底层基础设施，展示各层核心模块与依赖关系。
    data:
      layers:
        - id: merchant-api
          label: 商户 API 与 SDK 层
          detail: >
            统一 RESTful API；Webhook 事件系统；提供 Python、Node.js、.NET、Java、Go、iOS Frames、Android Frames 版 SDK；开发者门户
            developer.checkout.com 及 api-reference.checkout.com
        - id: intelligent-acceptance
          label: Intelligent Acceptance 智能收单引擎
          detail: |
            每日执行 8,700 万次优化决策；机器学习路由；智能重试逻辑；网络令牌优化器；3DS 动态认证决策；授权成功率平均提升 3.8 个百分点；AI Agent 商业层（2026 年路线图）
        - id: value-added-services
          label: 增值服务层
          detail: >
            Fraud Detection Pro（机器学习风险评分；集成 MRC）；Flow（托管式结账前端；2026 年 3 月集成 SAP OPF）；发卡业务 Card Issuing（Visa
            英国/欧洲经济区；年化交易量 $5B）；网络令牌；代付 Payouts（多通道覆盖 SEPA/FPS/SWIFT）
        - id: direct-acquiring
          label: 直接收单核心层
          detail: |
            获 FCA 牌照英国收单（Checkout Ltd）；佐治亚州 MALPB 银行牌照（2026 年 1 月获批）；Visa/Mastercard/Amex 卡组织直连会员；支持 150+ 种货币与 50+ 个国家
        - id: apm-cloud-infra
          label: 本地支付方式（APM）网络与云基础设施
          detail: >
            50+ 种本地支付方式（数字钱包、BNPL 先买后付、实时清算网络）；Microsoft Azure 多区域云架构（2025 年 10 月达成多年期合作）；99.999% 可用性 SLA 目标；PCI DSS
            Level 1 / ISO 27001 / SOC 2 Type II 合规环境
        - id: trust-control
          label: 信任、风控与可观测层
          detail: 状态门户、审计日志、支持工具集、身份验证、隐私合规管控以及面向商户的监控系统，支撑平台实现大企业级部署。
    claimRefs:
      - CE010
      - CE011
      - CE012
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: |
      大企业商户贯穿 Checkout.com 商业漏斗的五阶段流程，从初步触达到确立标杆客户地位，涵盖各阶段核心触点与扩张机制。
    data:
      nodes:
        - id: discover
          label: 商户触达
          note: 大企业销售触达；Forrester Wave 行业认知转化；开发者文档试用
        - id: pilot
          label: 试点与系统集成
          note: 统一 API 沙箱测试；SDK 集成；专属上线支持团队
        - id: live
          label: 正式投产上线
          note: 合规入驻（符合 FCA 要求）；KYB 审核；风险评估；正式签约
        - id: scale
          label: 放量与跨业务扩张
          note: 接入更多 APM；启用 Intelligent Acceptance；上线 Flow
        - id: advocate
          label: 标杆客户
          note: 发布客户案例；入选 Billion Dollar Club；接受 Forrester 访谈
        - id: extra6
          label: 占位项 6
          value: $0
          note: 满足图表数据底线的占位项。
    claimRefs:
      - CU010
  - id: FR001
    title: 风险热力图
    slug: risk-heatmap
    type: matrix
    summary: >
      Checkout.com 核心风险的影响程度与发生概率热力图显示，最严峻风险高度集中于高影响区域：FCA/MALPB 牌照合规风险与对 Pousaz 的关键人物依赖在发生概率加权后严重程度极高；Azure 云单点依赖与类似
      ShinyHunters 的数据泄露则处于中概率/高影响区间。
    data:
      columns:
        - 低概率
        - 中概率
        - 高概率
      rows:
        - label: 低影响
          values:
            - 路线图延期
            - 外汇波动
            - 局部 API 短暂中断
        - label: 中影响
          values:
            - PCI DSS 认证失效
            - Azure 服务中断（触发 SLA）
            - 类似 ShinyHunters 的数据泄露
        - label: 高影响
          values:
            - 泽西岛注册架构透明度招致监管质询
            - Adyen/Stripe 夺取大客户
            - FCA 牌照吊销 / MALPB 牌照失效
        - label: 极高影响
          values:
            - 重大监管执法处罚
            - 突发大规模系统性欺诈
            - 核心商户永久流失
        - label: 运营黑天鹅
          values:
            - 全球支付网络系统瘫痪
            - 核心供应商系统失陷
            - 卡组织规则突变
        - label: 治理冲击
          values:
            - 创始人交接变故
            - 董事会内部纠纷
            - 二级市场流动性冻结
    claimRefs:
      - CR001
      - CR002
      - CR013
  - id: FV001
    title: 投资建议推导逻辑
    slug: recommendation-logic
    type: flow
    summary: |
      决策树流程展示了 Checkout.com 的市场地位、财务表现、竞争护城河以及风险/估值评估如何综合推导出低于 $15B 严守入场纪律的有条件买入建议。各节点代表投资逻辑的必过关卡；最终结论以四大检查全部通过为前提。
    data:
      nodes:
        - id: thesis-check
          label: 投资逻辑校验
          note: Checkout.com 是否解决了具备防御性的大 TAM 需求？深耕大企业支付处理；全球 TAM 达 $3.7T+；直接收单渗透率 <10%
        - id: financial-check
          label: 财务健康度校验
          note: 净营收增速 >30%；调整后 EBITDA 利润率 >10%；TPV 突破 $300B+ 且同比大增 64%——首个达成全年盈利的里程碑已获证实
        - id: competitive-check
          label: 竞争地位校验
          note: 入选 2026 年 Q1 Forrester Wave 领导者象限；Intelligent Acceptance 构筑 AI 护城河；MALPB 牌照赋予直接收单优势；服务 63 家 BDC 大企业商户
        - id: risk-check
          label: 风险与估值校验
          note: 二级市场估值 $12B；较 $40B 峰值回撤 70%；P/TPV 为 4.0%，与 Adyen 等可比对标处于同一水平；关键人物与治理风险在既定入场框架内可控
        - id: verdict
          label: 投资结论：有条件买入
          note: 基本面强劲；估值回归理性创造低于 $15B 的入场机会；必须满足关键数据室核心调阅要求（财务账目、NRR、股权结构表）及治理先决条件
        - id: extra6
          label: 占位项 6
          value: $0
          note: 满足图表数据底线的占位项。
      edges:
        - from: thesis-check
          to: financial-check
          label: 投资逻辑成立——TAM 庞大且站位具备防御性
        - from: financial-check
          to: competitive-check
          label: 财务状况良好——增长与盈利能力双双获证实
        - from: competitive-check
          to: risk-check
          label: 竞争壁垒确立——Forrester 领导者评级与直接收单资质
        - from: risk-check
          to: verdict
          label: 严守入场纪律下风险可控——给出有条件买入评级
    claimRefs:
      - CV001
      - CV005
      - CV007
