chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与商业模式
        blocks:
          - type: paragraph
            body: >
              Guillaume Pousaz 于 2012 年创立
              Checkout.com，将其定位为面向全球企业级商户的全栈支付基础设施提供商。公司提供覆盖收单、支付网关、发卡、反欺诈、替代支付方式及代付清算的一站式端到端支付服务。核心客群为大型企业级商户——截至 2026
              年初已超 1,000 家，其中包含 63 家通过该平台年处理量超 $1B 的 “Billion Dollar Club” 超大型商户。公司 GTM 策略聚焦业务复杂、交易体量巨大的商户，这类客户往往需要在 50+
              个国家和地区获得定制化的授权率优化、风控管理及本地收单能力。收入来自支付处理手续费，且日益依赖 Intelligent Acceptance
              和发卡等增值服务。母公司注册于离岸辖区泽西岛，依法无需对外披露收入或利润。公司通过两家主要英国子公司运营：持有 FCA 收单牌照的 Checkout Ltd，以及持有核心知识产权并承载研发职能的 Checkout
              Technology Ltd。该架构为集团在多司法辖区管理 IP 归属及应税利润分配提供了运作弹性。
