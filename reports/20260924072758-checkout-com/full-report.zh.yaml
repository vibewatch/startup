      - number: '1.3'
        title: 融资历史与估值演变
        blocks:
          - type: paragraph
            body: >
              Checkout.com 在其融资历程中累计获得约 $1.8B 外部资本。最近一轮公开融资为 2022 年 1 月 12 日完成的 $1B Series D 轮，估值达 $40B。投资方包括 Altimeter
              Capital、Dragoneer Investment Group、Franklin Templeton、新加坡主权财富基金 GIC、Insight Partners、Qatar Investment
              Authority、Tiger Global 和牛津大学捐赠基金，早期投资方 Blossom Capital、Coatue、DST Global、Endeavor Catalyst 及 Ribbit
              Capital 亦跟投。随着 Fintech 行业估值全面下调，Checkout.com 内部估值在 2022 年底被下调至约 $11B，2023 年进一步降至 $9.35B。2025 年 9
              月的员工老股回购计划依据美国 409A 会计规则确立了 $12B 的估值基准——相较 2023 年低点反弹 28%，但较 $40B 高点仍折价 70%。据媒体报道，市场对其 IPO
              计划多有猜测，但截至本报告发布日尚未获公司证实。自 2022 年 1 月的 Series D 轮以来，公司未再引入任何新外部机构资本，表明其正依靠现有资金运营，并赶在潜在退出前冲刺全面盈利。
