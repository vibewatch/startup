companyProfile:
  summary: >
    Guillaume Pousaz（曾就职于 Visa 与 PayPal 的法裔瑞士创业者）于 2012 年在伦敦创立
    Checkout.com。创立逻辑在于：传统支付处理商在交易成功率、处理速度和透明度上，远未满足全球企业的需求。公司搭建了云原生直连收单支付平台，绕过传统中间件，帮企业级商户拉高授权成功率并压降成本。经历早期依靠自有资金滚动发展后，Checkout.com
    经多轮融资累计吸纳 $1.8B，并于 2022 年 1 月以 $40B 顶峰估值完成 Series D 轮（投资方包括 Altimeter、Dragoneer、Franklin Templeton、GIC、Insight
    Partners、QIA、Tiger Global）。尽管 Fintech 估值倍数回落导致 2025 年 9 月老股重定价至约 $12B，但公司在 2025 年首度取得经调整 EBITDA 全年盈利，TPV 突破
    $300B+（同比增 64%），净收入增速超过 30%。2026 年 1 月，Checkout.com 获批佐治亚州 MALPB 银行牌照，无需银行中介即可在美国开展直连收单，拿下关键竞争里程碑。公司于 2026 年 1
    月收购立陶宛数字货币平台 Blue EMI，并在 Forrester Wave: Payment Processing Platforms, Q1 2026 评选中获评领导者（Leader）。
  foundedDate: '2012-01-01'
