          - type: callout
            title: 商户集中度未予披露且可能具有重大影响
            body: >
              在 1,000 家商户底座中拥有 63 家 BDC 商户，前 20 大商户可能占据 $300B+ 总 TPV 的 40%–50% 甚至更高。该指标完全未公开披露。新签的 Spotify 与 eBay
              各自可能贡献超过 $5B 的年 TPV，仅这两家近期新增客户就可能占到总处理量的 3%–5%。BDC 阵营中单一大型客户的流失，所减少的交易体量可能超过 Checkout.com
              一个季度从数十家标准梯队大企业商户获取的新增量。投资人在做出任何投资承诺前，应在保密协议（NDA）下调取商户层级的 TPV 分布数据。
            calloutType: risk
            claimRefs:
              - CU005
          - type: callout
            title: 估值回落与安全事件带来新商户拓展阻力
            body: >
              Checkout.com 估值从 $40B（2022 年 1 月）下调至 $12B（2025 年 9 月员工回购参考价）已是公开事实，可能在销售周期中引发企业采购团队对供应商长期稳定性的顾虑。2024 年与
              ShinyHunters 相关的安全事件虽未证实发生银行卡数据泄露，但仍给企业客户的供应商尽调增添了数据安全疑虑。虽然两起事件均未产生已证实的商户流失，但在 2026
              年及以后的新客户拓展中，Checkout.com 的大企业销售团队都需要主动应对这些顾虑。
            calloutType: risk
            claimRefs:
              - CU005
          - type: callout
            title: 与 Wise 的合作是企业级客户留存韧性的决定性佐证
            body: >
              Wise 在收单、APM 与资金下发领域与 Checkout.com 合作逾 5 年，不仅发布了联合案例研究，合作产品版图也持续扩大，是 Checkout.com 长期大企业客户留存力的最佳单项佐证。Wise
              自身的迅猛扩张（年资金转账量超 $50B）让 Checkout.com 无需重新签约即可享受合作体量的内生扩张红利。Wise 案例还印证了 Intelligent Acceptance AI
              对客户留存的驱动作用：授权率的改善构成了 API 迁移之外的切换成本；商户若改用其他 PSP，将失去基于自身交易历史训练的专属优化模型。
            calloutType: insight
            claimRefs:
              - CU005
  - number: 7
    title: 风险评估
    sections:
      - number: '7.1'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >
              Checkout.com 依靠复杂的多司法管辖区架构运作，带来了叠加的监管风险。母公司 Checkout Group Ltd
              注册于英属泽西岛（Jersey）——该英国皇家属地不强制要求披露合并损益表，且在集团整体上处于欧盟或英国 FCA
              的直接监管范围之外。这给评估资本充足率与集团整体风险敞口的监管机构及投资人造成了信息黑箱。两家核心英国运营子公司 Checkout Ltd 与 Checkout Technology Ltd 依据 2017
              年《支付服务条例》持有有效的 FCA 支付机构牌照。历史上 FCA 在支付领域的执法动作相对有限，但已释放出对大型非银支付机构加强审视的信号，尤其是在 Wirecard
              暴雷后；即使牌照未被吊销，任何正式调查都将对大企业销售与投资人信心造成实质冲击。


              2026 年 1 月获佐治亚州银行与金融部批准的 MALPB（商户收单有限目的银行）牌照具备战略利好，但也引入了新的美国联邦与州级监管义务。作为持牌银行实体，Checkout.com 须遵守 FinCEN
              框架下更严格的 BSA/AML 反洗钱合规要求；随着业务延伸至面向消费者的支付服务，还面临来自 CFPB 的潜在监管。CFPB 自 2023 年起持续加大对大型非银支付处理商的审查力度，MALPB 牌照可能将
              Checkout.com 置于更广泛的 CFPB 监管权限下。即便拥有 MALPB 牌照，公司仍需在约 30 个州持有资金转移（Money Transmitter）牌照；MALPB
              减轻了但并未免除维护州级货币服务业务注册的合规负担。欧盟/欧洲经济区（EEA）市场的 PSD2/PSD3 合规仍在推进中；PSD3 立法预计在 2026–27 年落地，要求 Checkout.com
              调整开放银行、强客户身份认证与责任认定机制。2024 年 4 月 ShinyHunters 事件带来的 GDPR/UK GDPR
              合规风险依然存在：公司已向英国信息专员办公室（ICO）报备，但公开资料中未见已确认的处罚通报；若证实存在数据泄露，罚款上限可达全球年营业额的 4%，鉴于 Checkout.com
              从未披露该营收数据，这一潜在敞口极为敏感。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR015
              - CR016
