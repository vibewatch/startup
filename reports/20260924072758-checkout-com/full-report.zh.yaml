      - 置信度
      - 核心假设
      - 尽调核查缺口
    rows:
      - - TAM——全球数字支付处理收入
        - 全球电商交易规模（约 $6T）× 企业级抽佣率（0.15–0.30%）
        - 每年 $9–18B（保守测算）；$30–50B（广义测算）
        - low
        - 企业级占整体处理量约 20–40%；抽佣率在不同垂直领域相差可达 5 倍
        - 缺乏单一权威研究报告；测算区间对口径定义极度敏感
      - - TAM——行业分析师报告区间（广义支付软件市场）
        - 公开行业分析师研报（Mordor、Grand View、MarketsandMarkets）
        - 到 2028 年达 $75–130B（涵盖中小微、收单、软件及 APM）
        - low
        - 这类研报普遍混入中小微及周边软件；需对纯企业级业务打折 60–70%
        - 分析师报告统计口径不一，需谨慎参考
      - - SAM——全球跨国大企业商户
        - 估计全球 5,000–10,000 家年营收 >$100M 且具备跨境支付需求的大型商户
        - 支付处理商年收入空间 $10–40B
        - low
        - 合格目标商户数量存在不确定性；IT 预算分配占 GMV 的 0.2–0.5%
        - 尚无公开的大企业商户名录；该估算属于自下而上的粗略推算
      - - SAM——上市对标公司校准（Adyen）
        - Adyen（上市公司）：2024 年处理流水约 €1.35T，实现收入约 $2B，对应抽佣率约 0.15%
        - 若按类似抽佣率测算 $300B 交易量，对应 Checkout.com SAM 空间为 $3–5B
        - medium
        - Adyen 抽佣率内含增值服务收入；Checkout.com 抽佣率未公开
        - Checkout.com 未披露收入及利润率；与 Adyen 对标仅具方向性参考价值
      - - SOM——Checkout.com 当前收入推算
        - Checkout.com $300B 交易量 × 内含 0.20–0.30% 抽佣率
        - 估计总收入 $600M–$900M（未经证实）
        - low
        - 抽佣率未公开；毛利结构未知；调整后 EBITDA 利润率在未披露基数上 >10%
        - 非上市公司；未披露收入；测算区间存在 ±50% 误差带
      - - SOM——按 20% CAGR 测算的 5 年潜在空间
        - 当前 SOM 估算 × (1.20)^5 增长系数
        - 到 2030 年实现毛收入 $1.5–2.2B（估计）
        - 低
        - 假设收入增长与交易量增长一致；未对利润率扩张建模
        - 远期测算仅供示意，不代表公司指引
    notes: |
      所有估算均基于公开数据点与可比对象自下而上构建；由于 Checkout.com 母公司注册在 Jersey，因此没有公开可查的经审计收入数据。此类估算仅为数量级推算，具有高度不确定性。
    claimRefs:
