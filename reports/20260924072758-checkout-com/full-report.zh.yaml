      - number: '2.3'
        title: 买方与细分市场地图
        blocks:
          - type: paragraph
            body: >
              Checkout.com 的目标买方是大型企业级商户的支付或司库业务负责人——通常是支付副总裁（VP of Payments）、CFO 或 CTO，后台通常配备由 IT
              安全、法务与财务组成的供应商评估团队。决策周期漫长（6–18 个月），且切换成本高昂（涉及 API
              集成、商户联调与合规审核）。重点覆盖的垂直行业包括电商与平台市场（eBay）、出行与网约车（Uber）、数字订阅与流媒体（Spotify）、社交电商（Pinterest）及数字化服务。从地域分布看，Checkout.com
              的主力基本盘在欧洲（总部位于英国，持 FCA 牌照），在北美正快速扩张（2025 年美国业务量增速超 70%，2025 年在加拿大上线直连收单）。亚太、拉美（圣保罗枢纽）、中东及日本则是其外延增长点。由 63
              家商户组成的 “Billion Dollar Club” 占据了 Checkout.com 买方金字塔顶端——每家商户通过该平台处理的年交易量均超 $1B，较 2024 年的 39
              家显著增加，印证了存量商户交易规模扩张与新签标杆企业客群的双重驱动。买方核心决策考量包括：交易成功率（以 Intelligent Acceptance 平均提升 3.8%
              衡量）、平台可用性（99.999%）、本地收单覆盖面、欺诈与拒付管理能力，以及综合处理总成本。
            claimRefs:
              - CM016
