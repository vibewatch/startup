      - number: '1.3'
        title: 融资历史与估值演变
        blocks:
          - type: paragraph
            body: >
              Checkout.com 历史上累计吸纳外部资本约 $1.8B。最近一轮公开融资是 2022 年 1 月 12 日完成的 $1B Series D 轮，投后估值登顶 $40B。出资方涵盖 Altimeter
              Capital、Dragoneer Investment Group、Franklin Templeton、GIC（新加坡主权财富基金）、Insight Partners、Qatar Investment
              Authority、Tiger Global 与 Oxford University Endowment Fund，老股东 Blossom Capital、Coatue、DST Global、Endeavor
              Catalyst 及 Ribbit Capital 跟投。伴随更广泛的金融科技估值回调，Checkout.com 内部估值在 2022 年底被下调至约 $11B，2023 年进一步滑落至 $9.35B。2025
              年 9 月的员工老股回购计划依据美国 409A 会计准则暗含了 $12B 估值——虽较 2023 年低谷回升 28%，但较 $40B 峰值仍有 70% 折价。媒体曾报道其 IPO
              动向，但截至报告基准日公司尚未证实。自 2022 年 1 月 Series D 轮以来，公司未再引入任何新增外部机构资金，全凭存量资金维持运转，并在潜在退出前全力追逐盈利目标。
