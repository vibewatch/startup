            body: >
              Guillaume Pousaz 仍是唯一创始人、极可能也是控股股东，并继续担任 CEO。他于 2025 年 4
              月迁居摩纳哥，虽然压降了个人税负，却加剧了由单一主体控制且董事会架构不透明的私营企业治理风险。目前尚未披露任何接班计划或董事会构成细节。一旦发生履职受限、离职或治理纷争，都将对公司战略、团队文化及投资人信心造成重大且大概率不可逆的冲击。
