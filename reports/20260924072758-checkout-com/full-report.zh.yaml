      - number: '7.2'
        title: 运营与安全风险
        blocks:
          - type: paragraph
            body: >
              2024 年 4 月，网络犯罪黑客团伙 ShinyHunters 声称入侵了 Checkout.com 的历史遗留云存储环境，宣称泄露了 35,000 条支付卡记录。Checkout.com 的 CTO
              确认没有任何卡数据外泄——该存储环境仅包含运营数据，并非 PCI 范围内的持卡人数据——并向某安全研究基金捐赠了等额款项。公司已按英国 GDPR 义务通报 ICO。然而，作为全球最大的 PSP
              之一，因具名数据泄露指控而遭受的商誉损失无法在公开信源中准确量化，且官方尚未公布任何独立的取证调查报告。未来任何来自 ICO
              的行政处罚通知——即便仅针对流程违规而非实质性数据泄露——都会在企业销售周期中重新唤起商户对这一风险的担忧。

              Checkout.com 的底层基础设施基于一份多年合作协议完全运行在 Microsoft Azure 之上。公司未公开披露任何多云故障转移架构、Azure 区域之外的地理冗余，或发生 Azure
              区域性乃至全服务级瘫痪时的恢复时间目标（RTO）承诺。99.999% 的可用性 SLA 相当于每年停机时间约 5 分钟；在 2025 年 11 月的黑五网一（BFCM）峰值期间，该平台在单日 24 小时内处理了
              $5.2 billion 的支付交易。如果在未来的 BFCM 期间发生哪怕 30 分钟的 Azure 宕机，就对应约 $108M 无法处理的支付流水，并可能在数百份企业合同中引发违约罚金。PCI DSS
              Level 1 认证必须每年重新审核；在年度认证审核中的任何疏漏或失败都会触发标准 PSP 商户协议中的终止条款，并可能导致 Visa/Mastercard 对 Checkout.com 课以罚金。API
              版本管理与弃用风险是 Checkout.com 开发者生态中的结构性隐患：接入旧版 API 的大型企业商户在迁移时面临破坏性改动（breaking changes），且缺乏公开的 API
              生命周期治理白皮书，增加了长期集成规划的不确定性。如果高风险商户品类的拒付率超过 1%，可能触发 Visa 和 Mastercard 的监控名单计划；Checkout.com 的 Fraud Detection
              Pro 产品虽具缓释作用，但拒付率数据尚未公开披露。
