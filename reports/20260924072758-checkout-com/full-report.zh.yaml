      - number: '1.2'
        title: 领导团队与公司治理
        blocks:
          - type: paragraph
            body: >
              Guillaume Pousaz 创立了 Checkout.com，并一路担任 CEO 带领公司从初创企业壮大为估值 $12B 的全球支付处理巨头。2025 年 4
              月，面对英国非居民（non-domicile）税规变动，Pousaz
              由英国迁居摩纳哥，卷入新税制下超高净值人群撤出英国的人潮。该迁址举措属于核心治理信号，尽职调查必须审慎排查其中涉及的业务连续性风险。当前核心管理团队经验深厚：CTO Mariano Albera 统管技术，CRO
              Antoine Nougué 执掌全球营收，CPO Meron Colbeci 操盘产品，COO Jenny Hadlow 负责运营，CMO Rory O'Neill
              主管市场。针对进军美国银行业的战略布局，公司任命 Jordan Reynolds 出任 MALPB CEO 兼北美银行业务负责人，印证了 2026 年 1 月拿下的佐治亚州银行牌照具备高度战略意义。公司全球员工约
              2,000 人，约 50% 分布在英国。Checkout.com 在 Jersey
              设立母公司的组织架构，免除了依法公开详尽财务账目的法定义务，集团亦未主动公布收入或利润数字，压缩了潜在投资机构及商业伙伴核验业务的透明空间。
