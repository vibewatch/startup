      - number: '7.2'
        title: 运营与安全风险
        blocks:
          - type: paragraph
            body: >
              2024 年 4 月，网络犯罪黑客团伙 ShinyHunters 声称侵入了 Checkout.com 的早期云存储环境，宣称获取了 35,000 条支付卡记录。Checkout.com 的 CTO
              证实并未发生银行卡数据外泄——涉事存储环境存放的是运营数据，而非 PCI 范围内的持卡人数据——并将同等金额捐赠给了一家安全研究基金。公司已按 UK GDPR 义务向 ICO 报备。然而，作为全球大型 PSP
              之一遭遇具名数据泄露声索，其声誉受损程度在公开信息源中无法量化，且官方尚未公开独立的司法鉴识报告。未来 ICO 若下发任何处罚通知（即便是针对流程违规而非实质性数据泄露），都将把这一隐患重新带入大企业销售周期。


              Checkout.com 的基础设施完全运行在 Microsoft Azure 上，双方签有多年期合作协议。公司未公开多云故障切换架构或 Azure 区域外的地理冗余，也未披露面对 Azure
              区域性或全服务中断时的恢复时间目标（RTO）承诺。99.999% 的运行时间 SLA 对应每年约 5 分钟的停机上限；而在 2025 年 11 月「黑色星期五/网络星期一」（BFCM）流量高峰期，该平台单日 24
              小时处理了 $5.2B 支付流水。未来 BFCM 期间若 Azure 发生短短 30 分钟故障，就对应约 $108M 无法处理的支付流水，并可能触发数百份大企业合约中的 SLA 违约罚则。PCI DSS
              Level 1 认证须每年复审；若在年度认证审核中失效或未通过，将触发标准 PSP 商户协议中的解约条款，并可能招致 Visa 与 Mastercard 对 Checkout.com 的罚款。API
              版本演进与废弃风险也是开发者生态中的结构性隐忧：接入老旧 API 版本的大企业商户在迁移时面临破坏性改动风险，而缺少公开的 API 生命周期治理规范文件，让长期技术对接规划存在不确定性。高风险垂直商户拒付率若突破
              1%，可能触发 Visa 与 Mastercard 的监控计划；虽然 Checkout.com 的 Fraud Detection Pro 产品可作为缓冲，但公司并未公开披露实际拒付率数据。
            claimRefs:
              - CR004
              - CR005
              - CR006
