  - number: 6
    title: 客户分析
    sections:
      - number: '6.1'
        title: 客户细分与分层结构
        blocks:
          - type: paragraph
            body: >
              Checkout.com 有意将客群集中在企业级市场的顶端。截至 2026 年 2 月公布 2025 全年业绩时，公司服务 1,000+
              家大型企业商户；在历次公开表述中，公司均未提及自助开户、中小微（SMB）或初创企业分层产品。这种专注大企业的市场策略是一项结构性取舍：它提高了单客合同金额，也降低了每单位 TPV
              的客服运维成本，但意味着与每家客户的合作都需要经历漫长而高度定制化的洽谈。

              客户盘子横跨六大支柱赛道。数字化电商（Shein、Samsung、eBay）是撑起总处理量的基本盘，旗下各平台年 GMV 均在数百亿美元级别。FinTech
              与加密资产（Wise、Remitly、Coinbase）构成了质量最高的标杆案例群，粘性强且普遍合作多年并有公开成果背书。差旅与酒店酒旅（Virgin、Booking.com）以及 SaaS
              与流媒体（Spotify、DocuSign）则代表利润率较高的定期扣款场景，Intelligent Acceptance
              与订阅计费工具能在这些场景带来可量化的支付授权率提升。外卖（PizzaHut、Deliveroo）和 B2B 工业制造（Hyundai、Henkel）补足了其他行业布局。

              在地域分布上，Checkout.com 在大本营英国及欧洲腹地根基最深，而美国市场势头最猛，2025 年业务量同比增幅约
              70%。亚太与拉美主要依靠替代支付方式（APM）网络提供通道覆盖，但财报未将其单列为独立的区域营收细分板块。纯大客户直营模式促使这 1,000+
              家商户均绑定在多年期定制协议上，形成了高转换壁垒，为大盘留存率筑牢了底座。
            claimRefs:
              - CU001
              - CU010
              - CU013
