      - number: '1.2'
        title: 领导团队与治理结构
        blocks:
          - type: paragraph
            body: >
              Guillaume Pousaz 创立 Checkout.com，并带领公司从初创企业一路成长为估值 $12B 的全球支付处理商，至今一直担任 CEO。2025 年 4
              月，因英国调整非定居（non-domicile）税收规则，Pousaz
              从英国迁居摩纳哥，加入了新税制下超高净值人群离开英国的浪潮。这次迁居是一项关键治理信号，尽调必须深入穿透其业务连续性风险。公司现任高管团队底子扎实、经验丰富：CTO Mariano Albera 统管技术，CRO
              Antoine Nougué 负责全球业务收入，CPO Meron Colbeci 负责产品，COO Jenny Hadlow 统筹运营，CMO Rory O'Neill
              掌管市场。为拓展美国银行业务，Jordan Reynolds 出任 MALPB CEO 兼北美银行业务负责人，体现出 2026 年 1 月获批的佐治亚州银行牌照具备极高战略权重。公司全球员工约 2,000
              人，其中约 50% 常驻英国。Checkout.com 位于泽西岛的母公司架构使其无需公开详细财务数据，集团也未披露收入或利润数字，这削弱了潜在投资人与合作伙伴评估业务时的透明度。
