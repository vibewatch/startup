        - 估值回归常态后基本面强劲；但在实际出资前必须满足关键数据室调阅要求
      - - 确信度
        - 中高
        - 收入增长、TPV 规模与盈利能力已获证实；股权结构表、NRR 与合并财报仍属信息盲区
      - - 风险评级
        - 中高
        - 估值风险、关键人员依赖、Jersey 架构不透明，且已有 4 年未引入新的机构资本
      - - 估值态度
        - 具吸引力
        - $12B 估值对应 4.0% P/TPV 与约 8x 收入——与可比同行 Adyen 相当；较 2022 年峰值回调 70%，基本出清了估值泡沫
      - - 入场纪律
        - 低于 $15B
        - 估值高于 $15B 时风险收益比偏弱；若以 $12B 老股价格建仓，在基准与乐观情景下均具备不对称上行空间
      - - 退出周期
        - 3–5 年
        - 以 2027–2028 年 IPO 或被战略收购为主要退出路径；PE 延续基金接盘作为次优备选
      - - 出资前底线尽调清单
        - 合并财报、NRR、股权结构表
        - 任何资金投入前必须调阅的 3 项一票否决式数据室材料；详见最终尽调诉求表
    notes: >
      投资建议、确信度与风险评级属于分析师基于公开证据作出的研判，不构成证券要约或投资建议。低于 $15B 的入场纪律门槛根据 Adyen P/TPV
      同行分析与情景模型推导得出；若新一轮融资确立了更高的机构价格，该门槛亦将调整。“具吸引力”的估值态度反映当前 $12B 的老股交易定价，不代表未来其他价格的新股融资。
    claimRefs:
      - CV002
      - CV004
  - id: TV002
    title: 投资逻辑与反向逻辑对照表
    columns:
      - 核心支柱
      - 投资逻辑（多头）
      - 反向逻辑（空头）
      - 胜负手
    rows:
      - - 市场空间
        - 全球大型企业支付 TAM >$3.7T；直连收单机构市场渗透率 <10%；Checkout.com 在结构上具备消化这一机遇的卡位优势
        - Adyen 与 Stripe 虽估值更高，但已吃下欧美大企业的主要钱包份额；美国直连收单面临后发劣势
        - 2026–2027 年美国 MALPB 直连收单交易量的放量轨迹
      - - 产品与技术
        - Intelligent Acceptance 构建起 AI 护城河；入选 2026 年 Q1 Forrester Wave 领导者象限；MALPB 直连收单摆脱了对赞助银行的依赖
        - 资金实力雄厚的对手能迅速跟进功能；未见公开专利护城河；若估值下调面临团队被竞对挖角的风险
        - 大型企业 RFP 测评中 Intelligent Acceptance 相较 Adyen 的核准率差异
      - - 财务表现
        - TPV 达 $300B+ 且同比 +64%；首个全年经调整 EBITDA 利润率 >10%；净收入连续两年增长 >30%
        - 各项指标均为未经审计的新闻稿口径；Jersey 母公司无需强制披露合并损益表；收入绝对值未披露
        - 数据室中披露的集团合并审计财报与 NRR
      - - 客户质量
        - 拥有 63 家 BDC 大型商户（单客年 TPV 均在 $1B+）；直连客户总数达 1,000+ 家；截至 2026 年 5 月未见确认的商户流失
        - 未披露 NRR；商户 TPV 集中度未披露；单一 BDC 商户流失就会从投资模型中抽走 $2B+ 年交易量
        - 签署 NDA 调取单商户 TPV 队列数据；开展独立商户背景调查访谈
      - - 融资与资本结构
        - 经调整 EBITDA 已转正；历史累计融资 $1.8B；短期内无需外部输血；未披露任何流动性压力
        - 距上一轮机构融资已过去 4 年以上；估值缩水 70%；$1.8B 优先股堆叠结构未知
        - 开展新一轮股权融资或递交公开 S-1 招股说明书，以确立独立的机构估值
      - - 公司治理
        - 强劲的运营指标体现管理水平；专职高管团队已到位（CTO、CRO、COO 齐备）
        - 创始人（Pousaz）100% 绝对控股；自 2025 年 4 月起定居摩纳哥；未设立独立董事；未披露接班人计划
        - 将任命独立董事与制定正式接班人计划列为投资交割的前提条件
      - - 估值定价
        - $12B 估值对应 4.0% P/TPV，与 Adyen 的 3.5% 大致相当；对应约 8x 预估收入，在此类增速的企业级 PSP 中属于行业常态
        - 最近一轮机构定价（$40B）已是 4 年前的旧账；员工老股回购不具备独立价格发现功能；优先股堆叠可能削弱普通股回报
        - IPO S-1 注册申报或由新一轮机构增资提供独立第三方估值
    notes: |
      胜负手列出了能促使多空逻辑相互转化的具体证据或标志性事件，代表了最终尽调诉求中的最高优先级事项。“未见确认的商户流失”这一观察基于截至 2026 年 5 月的公开报道，不构成对 NRR 指标的确认。
    claimRefs:
