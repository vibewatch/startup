              2025 年，公司年支付量突破 $300B+（同比增 64%）、净收入增长 >30%，且经调整 EBITDA 利润率超过 10%，这一组合标志着重大的商业里程碑。在 2026
              年以前，极少有独立支付处理商能在这一体量下兼顾高速增长与 EBITDA 盈利。由 63 家商户组成的 “Billion Dollar Club” 以及 2026 年 1 月拿下的美国银行牌照，从实质上夯实了
