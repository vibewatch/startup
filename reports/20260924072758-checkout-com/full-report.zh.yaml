      - number: '6.2'
        title: 采用轨迹与增长动能
        blocks:
          - type: paragraph
            body: >
              Checkout.com 在 2025 年亮出的核心业务数据，树立了同等规模支付基础设施服务商中的顶尖增速标杆。全年总支付额（TPV）突破 $300B，同比攀升 64%。公司日均处理金额超 $1B，在 2025
              年黑五与网一（Cyber Monday）峰值期间创下 24 小时处理 $5.2B 的历史峰值——向在季节性交易高洪峰场景中对弹性基础设施极其严苛的大型商户展现了充沛实力。

              “十亿美元俱乐部”成员数量由 39 家跃升至 63 家，年处理量超 $1B 的超大商户数量同比增长
              62%。这一核心客户群体的壮大，是公司在大型企业市场拓展的重要指标：既表明头部客户持续留在平台，也反映出公司正以更快速度赢得新的大型企业客户。假设每家 BDC 商户每年贡献 $1B+ 交易额，按 0.2%
              的隐含抽成率推算，单家年收入至少 $2M；仅 63 家 BDC 商户就对应至少 $126M 的估算经常性收入。

              存量商户对各类新产品的调用采纳亦在急速铺开。替代支付方式（APM）交易体量同比增长 104%，印证存量商户正主动解锁更多 APM 选项，而非向其他竞品分流。发卡业务在 2025 年第四季度年化运行体量触及
              $5B。受佐治亚州 MALPB 银行牌照于 2025 年 10 月获批提振，北美市场战略提速，美国本土业务量同比增长约 70%。净收入连续第二年维持 30% 以上的增速，反映出较高的净收入留存率（NRR）。
