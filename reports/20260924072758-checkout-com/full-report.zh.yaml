      - number: '6.3'
        title: 知名标杆客户实证
        blocks:
          - type: paragraph
            body: >
              Checkout.com 披露的名义客户证据在大企业支付领域位居前列，公开确认的合作横跨多个垂直行业、地理区域与产品深度。截至 2026 年 5 月，公司已通过新闻稿、案例研究或联合官方公告确认了 12
              家具体客户。


              Wise 是合作最持久的标杆客户：在收单、替代支付方式（APM）与资金下发（Payouts）上的生产环境部署已超 5 年，双方发布了联合案例研究，并使用 Intelligent Acceptance AI
              优化数十个货币走廊的支付授权率。这段合作展示了金融科技平台与 PSP 跨多个产品周期共同扩张的长期企业级合作模式。


              Spotify（2026 年 2 月达成合作）与 eBay（2025 年 4 月达成合作）是近期最具战略意义的新增客户。Spotify 的全球订阅计费与收单规模（预计每年支付处理量超过 $12B）以及 eBay
              超过 $70B 年 GMV 平台上的电商平台收单加下发业务，是 Checkout.com 历史上签约的两大单体商户。从披露的支付规模看，两家商户几乎必然进入十亿美元俱乐部（BDC）。


              除上述旗舰标杆外，Shein、Coinbase、PizzaHut、Virgin、Hyundai、Samsung、Remitly 与 Henkel 补全了覆盖全部 6 个垂直行业的 12
              家客户名单。所有具名商户的生产环境状态均已通过新闻稿、案例研究或官方新闻中心公告得到确认。核心证据缺口在于公司未公开 1,000 多家商户的完整花名册；披露的 12
              家仅代表公开可查的子集。客户证明矩阵对比了各旗舰标杆的证据质量、业务产出具体性、产品深度与合作年限。
