  - number: 5
    title: 产品与技术架构
    sections:
      - number: '5.1'
        title: 产品矩阵与模块图谱
        blocks:
          - type: paragraph
            body: >
              Checkout.com 为大型企业商户提供横向一体化的支付基础设施平台，横跨七大核心功能模块，全盘由单一商务合同与统一 API 协议交付。商户仅需一次集成——依托 RESTful API、托管式 Frames
              SDK 或预置平台插件——便能接入跨越 150+ 种货币和 50+ 个国家的无卡收单通道、Intelligent Acceptance AI 优化、发卡业务、Fraud Detection Pro
              反欺诈、资金代付、Flow（托管收银界面），以及聚合了 Apple Pay、Google Pay、Klarna、Pix、FedNow 和 SEPA Instant 等 50+ 种渠道的替代支付方式网络。

              面向终端用户的处理流程始于消费者发起结账：Checkout.com Unified API 接收支付请求，实时调用 Intelligent Acceptance
              智能路由锁定最优通道路径，经由直连收单内核提交卡组织授权，接收发卡行审批反馈，并在数百毫秒内将交易结果推回商户。包括 Fraud Detection Pro 风险评分、网络 Token 封装上报及 3D
              Secure 动态挑战在内的增值服务，全部在同一 API 事务内同频处理。代付和发卡服务则运行在统一商户后台管理下的共置 API 接口上。

              商务端，所有模块均按单笔交易计费或作为企业级增值插件写入多年期合同。公司不设立公开标价，也无自助开通套餐。逾 1,000 家大型企业商户大盘及 63 家“十亿美元俱乐部”成员（年交易量超
              $1B）构成了全套产品矩阵的标杆客群。2025 年 APM 处理量同比劲增 104%，发卡业务在 2025 年第四季度触及 $5B 年化运行体量，见证了增值模块在核心收单之外的强势商业扩张。
