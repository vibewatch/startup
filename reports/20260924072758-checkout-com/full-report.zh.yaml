    type: journey-map
    summary: |
      大型企业商户在 Checkout.com 商业漏斗中的五阶段历程，从初期接触到成为标杆示范客户，呈现各阶段的关键触点与拓展机制。
    data:
      nodes:
        - id: discover
          label: 商户接触与发现
          note: 大客户销售触达；Forrester Wave 认知建立；开发者文档试用
        - id: pilot
          label: 试点 / 集成
          note: 统一 API 沙箱；SDK 集成；专属入驻支持团队
        - id: live
          label: 正式上线
          note: 符合 FCA 要求的入驻；KYB 审查；风险评估；合同签署
        - id: scale
          label: 规模化与拓展
          note: 接入更多 APM；激活 Intelligent Acceptance；部署 Flow
        - id: advocate
          label: 标杆客户
          note: 发布客户案例；加入 Billion Dollar Club；接受 Forrester 访谈
        - id: extra6
          label: 占位项 6
          value: $0
          note: 满足快速图表数据底线的占位项。
    claimRefs:
      - CU010
  - id: FR001
    title: 风险热力图
    slug: risk-heatmap
    type: matrix
    summary: >
      Checkout.com 核心风险的影响程度与发生可能性热力图，显示最关键的风险聚集在高影响区域：FCA/MALPB 牌照风险以及对 Pousaz 的关键人物依赖在考虑可能性加权后严重度最高；Azure 集中度与类似
      ShinyHunters 的数据泄露属于中等可能性 / 高影响风险。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 低影响
          values:
            - 路线图延期
            - 外汇波动
            - 轻微 API 中断
        - label: 中等影响
          values:
            - PCI DSS 认证失效
            - Azure 故障（SLA）
            - 类似 ShinyHunters 的安全泄露
        - label: 高影响
          values:
            - 泽西岛架构不透明引发监管质询
            - Adyen/Stripe 赢得大型企业客户
            - FCA 牌照吊销 / MALPB 失效
        - label: 极高影响
          values:
            - 重大监管执法处罚
            - 实质性欺诈潮
            - 商户永久性流失
        - label: 运营黑天鹅
          values:
            - 全球支付中断
            - 关键供应商系统受损
            - 卡组织清算规则变更
        - label: 治理冲击
          values:
            - 创始人继任事件
            - 董事会争议
            - 二级市场流动性冻结
    claimRefs:
      - CR001
      - CR002
      - CR013
  - id: FV001
    title: 投资建议决策逻辑
    slug: recommendation-logic
    type: flow
    summary: >
      决策树流程展示了 Checkout.com 的市场地位、财务表现、竞争护城河以及风险 / 估值评估如何综合得出在 sub-$15B
      估值区间内入场的“有条件买入”建议。每个节点代表一项设有准入门槛的投资逻辑审查；最终结论以通过全部四项审查为前提。
    data:
      nodes:
        - id: thesis-check
          label: 投资逻辑审查
          note: Checkout.com 是否切入一个具有防御壁垒且 TAM 庞大的市场？企业级支付处理；全球 TAM 达 $3.7T+；直连收单渗透率 <10%
        - id: financial-check
          label: 财务健康度审查
          note: 净收入增速 >30%；调整后 EBITDA 利润率 >10%；$300B+ TPV 同比 +64%——首个完整年度盈利里程碑获证实
        - id: competitive-check
          label: 竞争地位审查
          note: 2026 年 Q1 获评 Forrester Wave 领导者；Intelligent Acceptance AI 护城河；MALPB 直连收单优势；63 家 BDC 大型企业商户
        - id: risk-check
          label: 风险与估值审查
          note: $12B 二级市场估值；较 $40B 峰值回落 70%；P/TPV 为 4.0%，与同行 Adyen 基本持平；关键人物与治理风险在入场框架内可控
        - id: verdict
          label: 结论：有条件买入
          note: 基本面扎实；估值回归常态在 sub-$15B 区间创造了入场机会；必须满足关键数据室索取项（账目、NRR、股权结构表）及治理先决条件
        - id: extra6
          label: 占位项 6
          value: $0
          note: 满足快速图表数据底线的占位项。
      edges:
        - from: thesis-check
          to: financial-check
          label: 逻辑成立——TAM 空间广阔，壁垒稳固
        - from: financial-check
          to: competitive-check
          label: 财务稳健——增长与盈利能力获证实
        - from: competitive-check
          to: risk-check
          label: 竞争护城河获证实——Forrester 领导者，直连收单
        - from: risk-check
          to: verdict
          label: 风险在入场纪律约束下可控——有条件买入
    claimRefs:
      - CV001
      - CV005
      - CV007
