      - number: '6.4'
        title: 图表
        blocks:
          - type: callout
            title: Billion Dollar Club 增长是最好的业务韧性信号
            body: >
              BDC 在单个年度财报周期内同比扩张 62%（成员从 39 家增至 63 家），是有力证据，表明 Checkout.com 既留住了超大商户，又在加速拿下新的大型客户。按最低抽佣率测算，每家 BDC
              商户都对应一份估计年收入达 $2M+ 的多年合同。BDC 的增长、APM 交易量 104% 的扩张，加上发卡业务 $5B
              ARR，三者合力说明落地后扩张模式已经走通——商户持续留存、延伸产品范围并推高交易规模，筑起了一层在结构上不易因价格战而流失的复利收入底盘。
            calloutType: strength
            claimRefs:
              - CU002
              - CU011
              - CU014
          - type: callout
            title: 商户集中度未披露且潜在影响重大
            body: >
              在 1,000 家商户底盘中，仅 63 家 BDC 商户里排名前 20 的客户就可能占到 $300B+ 总 TPV 的 40-50% 甚至更高。公司对此完全没有披露。新近引入的 Spotify 和 eBay
              各自很可能贡献 $5B+ 的年 TPV，意味着仅这两家新增客户就可能占到总交易量的 3-5%。BDC 队列中一旦有一家大型客户离开，被带走的交易量可能超过 Checkout.com
              一个季度从数十家标准级企业商户获取的新增总量。投资者在签署任何投资承诺前，必须要求在 NDA 保护下查阅商户维度的 TPV 分布。
            calloutType: risk
            claimRefs:
              - CU005
          - type: callout
            title: 估值下滑与安全事件给新商户拓展带来风险
            body: >
              Checkout.com 的估值从 $40 billion（2022 年 1 月）跌至 $12 billion（2025 年 9
              月员工回购参考价）已是人尽皆知的公开信息，容易在销售周期中引发大型企业采购团队对供应商长期稳定性的顾虑。与 ShinyHunters 关联的 2024
              年安全事件——尽管并非已确认的持卡人数据泄露——依然给企业客户的供应商尽调增添了数据安全疑问。两起事件虽然均未导致已确认的商户流失，但 Checkout.com 的企业销售团队在 2026
              年及之后拓展新客时，必须主动加以化解。
            calloutType: risk
            claimRefs:
              - CU005
          - type: callout
            title: Wise 合作关系是企业业务耐久性的决定性证明
            body: >
              Wise 在收单、APM 和出海打款上与 Checkout.com 携手超过 5+ 年，并附有已公开的案例研究且产品足迹不断扩大，这是检验 Checkout.com 长期大客户留存成色的最佳样板。Wise
              自身的迅猛扩张（年转账流水 >$50B）让 Checkout.com 无需重新签约即可享受客户带来的自然交易量红利。Wise 案例也验证了 Intelligent Acceptance AI
              对客户留存的拉动作用：授权率的提升构筑了单纯 API 迁移所无法撼动的切换成本，因为一旦商户迁往其他 PSP，就会失去基于自身交易历史训练出来的专属优化模型。
            calloutType: insight
            claimRefs:
              - CU005
  - number: 7
    title: 风险与挑战
    sections:
      - number: '7.1'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >
              Checkout.com 跨多个司法管辖区的复杂架构运营，带来了复合型监管风险。母公司 Checkout Group Ltd 注册于泽西岛（英国皇家属地），无需强制披露合并损益表，且集团本身不受欧盟或英国 FCA
              的直接监管。这给评估资本充足率与集团整体风险敞口的监管机构与投资者带来了信息不透明。两家主要英国运营子公司 Checkout Ltd 和 Checkout Technology Ltd 均持有 2017
              年支付服务条例下的有效 FCA 支付机构牌照。历史上 FCA 在支付领域的执法动作相对有限，但在 Wirecard 倒闭后，FCA
              已释放信号将加大对大型非银行支付机构的审查力度；任何正式调查即便未导致吊销牌照，也会对企业级销售与投资者信心构成重大风险。

              2026 年 1 月从佐治亚州银行业与金融部获得的 MALPB（商户收单有限目的银行）牌照审批具有战略积极意义，但也带来了新的美国联邦和州级监管合规义务。作为持牌银行实体，Checkout.com
              在拓展涉个人消费支付服务时，须遵守 FinCEN 指引下更严格的 BSA/AML 反洗钱合规要求，并可能面临 CFPB 的监管。CFPB 自 2023 年以来持续加大对大型非银行支付处理商的审查力度，MALPB
              牌照可能将 Checkout.com 纳入 CFPB 扩大的监管管辖范围。即便持有 MALPB 牌照，公司仍需在约 30 个州取得州级资金汇兑（MTL）牌照；MALPB
              减轻但并未免除在各州维持货币服务商（MSB）登记的合规负担。欧盟及欧洲经济区市场的 PSD2/PSD3 合规工作持续推进；PSD3 立法进程预计将于 2026–27 年收官，届时 Checkout.com
              须调整开放银行、强身份认证与责任分担框架。2024 年 4 月 ShinyHunters 安全事件引致的 GDPR/英国 GDPR 风险敞口依然存在：虽然已通报
              ICO，但尚未见公开确认的处罚行动；一旦确认存在数据泄露，罚款金额最高可达全球年营业额的 4%，鉴于 Checkout.com 并未公开披露该基数，这一潜在处罚金额影响重大。
