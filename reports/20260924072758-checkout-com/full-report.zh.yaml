      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: AI 驱动的授权率优化改写市场收入模型
            body: >
              传统支付处理竞争聚焦于价格（基点费率）与稳定性。Checkout.com 的 Intelligent Acceptance——日均完成 87M 次优化，自 2023 年 6 月上线以来累计为商户增收超
              $15B+——带来了质的飞跃：支付基础设施能够在基础手续费之外为商户创造可量化的 ROI。若年处理量为 $1B 的商户平均授权成功率提升 3.8%，相当于直接多赚 $38M，使采购 Checkout.com
              成为一项净正向投资而非纯成本支出。这一机制将买方对话逻辑从 “谁最便宜” 重塑为 “谁的 ROI 最高”，为收取溢价提供了支撑——形成结构性竞争优势。
            calloutType: insight
            claimRefs:
              - CM015
          - type: callout
            title: TAM 黑箱带来显著规模测算风险
            body: >
              企业级支付处理市场缺乏单一公认的权威测算报告。受统计口径、抽成率假设与地域覆盖范围差异影响，各机构测算区间相差 5–10×。Checkout.com
              未披露收入，导致外界无法独立验证其抽成率、毛利率或市场份额。这种不透明性让人难以判断 Checkout.com 究竟是在抢占市场份额，还是仅仅顺水搭车宏观电商红利。任何基于 DCF
              或估值倍数的定价模型，都必须在所有合理假设区间内对市场规模进行严格的压力测试。
            calloutType: risk
            claimRefs:
              - CM008
              - CM011
              - CM013
              - CM014
          - type: callout
            title: 定价压力与刷卡手续费监管压缩基础收单利润率
            body: >
              欧盟对交换费（interchange fee）的监管限制（个人借记卡封顶 0.2%，个人信用卡封顶
              0.3%）以及美国监管层持续的严格审查，不断挤压基础收单业务的盈利空间。面对这一结构性阻力，处理规模的扩张无法线性转化为收入或利润率的改善。Checkout.com 的增值服务（Intelligent
              Acceptance、反欺诈风控、发卡）是防守利润率的核心盾牌——但这些领域也是争夺最激烈的正面战场，Adyen、Stripe 以及传统银行处理商均在重金布局同类能力。
            calloutType: risk
            claimRefs:
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              Checkout.com
              的竞争对手分布在三个维度：一是提供类似全栈企业级收单与支付处理的直接对标竞品；二是凭借银行关系提供打包捆绑费率的传统银行处理商；三是相邻或替代方案，包括主打开发者的网关、垂直细分服务商以及头部超大商户的自建系统。

              Adyen（Euronext: ADYEN）是最直接的竞品——这家只做企业级客群的上市公司在 2024 年处理了约 €1.35 trillion 交易量，取得约 €1.83 billion
              净收入，测算综合抽成率约在 0.13–0.15% 之间。Adyen 拥有超 3,800 名员工，自 2006 年起已在 36+ 个市场搭建直连收单网络，在运营历史、公开披露透明度及市值信誉上均领先于
              Checkout.com。Stripe（未上市，老股市场估值约 $65B）是开发者生态龙头，估计每年处理 $1 trillion 交易量，拥有市场上覆盖最广的产品矩阵。Worldpay 在 2023 年被私募机构
              GTCR 以约 $18 billion 从 FIS 手中收购，按处理规模算名列第一（$2T+），但受困于老旧系统架构与技术包袱。

              Braintree（PayPal 旗下）、JPMorgan Payments 与 Nuvei 凭借差异化的产品侧重和目标客户画像完善了这一竞争梯队。现状替代方案——如与 Barclays、Lloyds 或
              Chase 等银行建立的行内收单合作——对以英美为重心的商户仍然可用。Amazon 等超级商户虽具备自建能力，但自建需投入 $100M+ 资金并经历数年合规牌照审批，竞争压力仅局限于全球前
              10（top-10）大商户。科技巨头支付工具（Google Pay、Apple Pay）驻留在钱包和消费者端而非直连收单底层，与 Checkout.com 的核心收单产品互为补充而非替代关系。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP009
              - CP015
