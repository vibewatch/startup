      - number: '6.3'
        title: 标杆客户证言
        blocks:
          - type: paragraph
            body: >
              Checkout.com 披露的具名客户证据在企业级支付赛道名列前茅，公开确认的合作关系横跨多个垂直行业、地理区域与产品深度。截至 2026 年 5 月，共有 12
              家具名客户通过新闻稿、案例研究或公开联合品牌公告得到确认。

              Wise 是合作最持久的标杆客户：在收单、本地支付方式（APM）和出海打款（payouts）上实现了 5 年以上的生产环境部署，拥有已发布的案例研究，并借助 Intelligent Acceptance AI
              优化了数十个货币通道的授权率。两家公司的合作展示了当 FinTech 平台与其 PSP 跨越多个产品周期共同成长时，长期企业级采用的真实形态。

              Spotify（2026 年 2 月建立合作）和 eBay（2025 年 4 月建立合作）是近期最具战略意义的新增客户。Spotify 的全球订阅计费与收单规模——估计年支付规模超过 $12
              billion——以及 eBay 在 $70+ billion 年 GMV 平台上的平台收单加出海打款，代表了公司历史上规模最大的两单单体商户拓展。根据披露的支付规模，两家公司几乎确定都会进入 BDC。

              除旗舰标杆外，Shein、Coinbase、PizzaHut、Virgin、Hyundai、Samsung、Remitly 和 Henkel 补全了覆盖全部 6 个垂直行业的 12 家客户名单。这 12
              家具名商户的生产环境状态均已通过新闻稿、案例研究或官方新闻中心公告得到确认。核心证据缺口在于超过 1,000+ 家商户的完整名单未公开披露；具名的 12
              家仅代表可公开背书的子集。客户验证矩阵横向对比了各旗舰标杆的证据质量、成效具体度、产品深度及合作年限。
