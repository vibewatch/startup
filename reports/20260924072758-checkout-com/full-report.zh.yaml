        - 全球电商交易规模（约 $6T）× 大企业变现率（0.15%–0.30%）
        - 每年 $9–18B（保守测算）；$30–50B（广义测算）
        - 低
        - 大企业占总支付处理体量约 20%–40%；变现率差异达 5 倍
        - 缺乏单一权威研究；测算区间对口径范围高度敏感
      - - TAM——分析师报告口径（广义支付软件市场）
        - 行业公开分析师报告（Mordor、Grand View、MarketsandMarkets）
        - 截至 2028 年达 $75–130B（含中小企业、收单、软件及 APM）
        - 低
        - 上述报告混入了中小企业及相邻软件；纯大企业口径须折价 60%–70%
        - 分析师报告口径定义缺乏一致性；采信须保持审慎
      - - SAM——全球大企业跨境商户
        - 预估 5,000–10,000 家年营收超 $100M 且具备跨境支付需求的大企业商户
        - 支付处理机构年收入 $10–40B
        - 低
        - 达标商户数量存在不确定性；IT 与支付预算占商品交易总额的 0.2%–0.5%
        - 无公开的大企业商户名录；估算为自下而上的近似测算
      - - SAM——上市公司对标校准（Adyen）
        - Adyen（上市）：2024 年处理流水约 €1.35T，产生约 $2B 营收，变现率约 0.15%
        - 将相近变现率用于 $300B 处理量，推算 Checkout.com 的 SAM 为 $3–5B
        - 中
        - Adyen 变现率包含增值服务；Checkout.com 变现率未公开
        - Checkout.com 未披露营收或利润率数据；与 Adyen 对标仅具方向参考意义
      - - SOM——Checkout.com 当前营收测算
        - Checkout.com $300B 处理量 × 0.20%–0.30% 内含变现率
        - 总收入预估为 $600M–$900M（未经证实）
        - 低
        - 变现率未披露；利润率结构未知；经调整 EBITDA >10% 基于未披露底数
        - 非上市公司；未披露营业收入；估算区间存在 ±50% 误差范围
      - - SOM——20% 复合增速下的 5 年潜质
        - 当前 SOM 估算值 × (1.20)^5 增长系数
        - 截至 2030 年总收入达 $1.5–2.2B（预估）
        - 低
        - 假设收入增速与交易量增速保持一致；未对利润率扩张建模
        - 远期预估仅作示意；并非公司业绩指引
    notes: 所有估计均依据公开数据点和可比公司自下而上推算。Checkout.com 母公司注册于泽西岛，公开渠道没有经审计的收入数据。这些测算只反映数量级，存在很大不确定性。
