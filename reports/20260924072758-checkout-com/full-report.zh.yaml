  - number: 6
    title: 客户画像
    sections:
      - number: '6.1'
        title: 客户分群
        blocks:
          - type: paragraph
            body: >
              Checkout.com 的客户结构高度聚焦于支付市场的超大企业端。根据公司 2026 年 2 月发布的 2025 全年业绩，其服务的企业级商户超 1,000
              家，在所有公开对外发声中均未提供或暗示存在任何自助式、中小商户或初创企业通道。这种纯企业级 GTM 策略是一项结构性取舍：大幅拉高了客单价合同价值，摊薄了单美元 TPV
              对应的客户支持开销，但同时也意味着每一次客情建立都需要经历定制化、高利害关系的深度商务谈判。

              其客户大盘横跨六大核心垂直行业。数字零售与电商（Shein、Samsung、eBay）是交易量底座，旗下平台各自每年处理数百亿美元
              GMV。金融科技与加密领域（Wise、Remitly、Coinbase）是最优质的标杆客群，合作年限长并有公开合作案例。差旅住宿（Virgin、Booking.com）与 SaaS
              流媒体（Spotify、DocuSign）代表高利润、高频循环扣款场景，Intelligent Acceptance
              和订阅计费能力可显著带来立竿见影的授权率红利。外卖配送（PizzaHut、Deliveroo）与 B2B 工业（Hyundai、Henkel）补全了其行业版图。

              在地域分布上，Checkout.com 在欧洲及英国（大本营）基础最深厚，美国则是增长最快的引擎，2025 年交易量同比增长约
              70%。亚太与拉美市场主要通过替代支付方式覆盖，未作为单独的地理收入板块单独披露。纯大客户模式决定了 1,000+ 家商户均受多年期定制合同约束，形成了强有力的结构性迁移转换成本，牢牢稳固了大盘客户留存。
