  productSummary: >
    Checkout.com 对外输出统一的企业级支付平台，涵盖七大核心模块：(1) 银行卡直连收单（支持 Visa/Mastercard/Amex），持有英国 FCA 牌照与美国 MALPB 银行牌照；(2) Intelligent
    Acceptance——依靠 AI/ML 路由与优化算法，在每日 87M 次决策中平均带来 +3.8% 授权率提升；(3) Flow——托管式收银台转化产品；(4) Card Issuing 发卡（与 Visa 合作，英国/EEA
    全面上线，年化运行规模达 $5B ARR）；(5) Fraud Detection Pro 反欺诈；(6) Payouts 代付；(7) 50+ 种替代支付方式，覆盖数字钱包、BNPL 与实时支付。
