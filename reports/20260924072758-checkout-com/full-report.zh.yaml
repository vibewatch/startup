      - number: '3.4'
        title: 图表
        blocks:
          - type: callout
            title: AI 授权优化成关键竞争阵地
            body: >
              Checkout.com 的 Intelligent Acceptance（平均提升 +3.8% 授权成功率，累计为商户创造超 $15B+ 价值）是其 ROI 最高的差异化利器，也是 Adyen 和 Stripe
              在 2024 年竞相推出 AI 授权竞品的主因。估计 12-18 个月的先发优势虽然存在但正在收窄；这道护城河能否守住，取决于 Checkout.com 能否维持年处理量大致在 20%
              以上的增速以扩大训练数据优势，以及在面对 Adyen 更庞大的研发团队时能否持续保持模型研发投入领先。
            calloutType: insight
            claimRefs:
              - CP012
          - type: callout
            title: 估值回落带来结构性竞争劣势
            body: >
              Checkout.com 估值从 $40B（2022 年）大幅下挫 70% 至 $12B（2025 年 9 月），相比市值达 €35-45B 的上市公司 Adyen，在争夺顶尖人才、供应链定价谈判及面对 CFO
              级别的客情信任上带来了结构性劣势。路透社（Reuters）及多家金融媒体均报道了这一估值滑落；而在没有收入披露来校准估值倍数的情况下，Checkout.com
              无法反驳外界的不利对标。任何关于投资或并购的决策探讨，都必须将该信号与 CityAM 报道的创始人迁居摩纳哥一并纳入考量。
            calloutType: risk
            claimRefs:
              - CP012
  - number: 4
    title: 财务分析
    sections:
      - number: '4.1'
        title: 收入模式与收入构成
        blocks:
          - type: paragraph
            body: >
              Checkout.com 的收入来自六大主要业务线，均与支付交易量或增值服务使用量挂钩。核心收入支柱是支付收单手续费：当 Checkout.com
              作为商户的主要收单机构或收单网络代理时，按总交易额（GTV）的一定比例收取。基于 2025 年披露的 $300B+ 总处理量（TPV）以及分析师共识测算的 0.20-0.30% 综合抽成率推算，总收单收入可能落在
              $600M-$900M 区间，不过公司从未披露过这一确切数字。

              第二条业务线是支付网关与处理 API，对授权、Token 生成（tokenisation）及路由等服务按每笔交易或每次 API 调用收费。第三是增值服务——Intelligent Acceptance、Fraud
              Detection Pro、Network Tokens 及 Flow 结账组件——作为叠加在核心收单之上的独立授权企业级产品，带来增量收入。第四是与 Visa 合作推进的 B2B 虚拟卡与实体卡发卡业务，在
              2025 年 Q4 达到 $5B
              年化运行率。第五是出款业务（面向平台卖家、零工群体及跨境收款人的分发款项），构成一项出款即服务（payout-as-a-service）的手续费业务线。第六是跨境交易的外汇（FX）兑换，在结算与出款的时间差内由
              Checkout.com 承担汇率风险以赚取买卖利差。

              收入确认遵循主要责任人与代理人框架（principal-agent framework）：当 Checkout.com
              作为主要收单责任人时，按扣除行间交换费（interchange）前的总额确认总收入；仅作为纯网关时，则只确认网关净手续费。总额法与净额法收入的具体占比未见公开披露，这给深入测算毛利率和收入质量带来了实质不确定性。2025
              年黑色星期五与网络星期一期间，平台在 24 小时内处理了 $5.2B 交易额和约 100M 笔交易，印证了其峰值处理容量。
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI001
            claimRefs:
              - CI005
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI004
              - CI007
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI005
      - number: '4.2'
        title: 定价机制与 GTM 效率
        blocks:
          - type: paragraph
            body: >
              Checkout.com
              坚持纯直销的大客户模式，既没有公开的官方价目表，也没有自助服务或由开发者驱动的增长漏斗。所有费率均通过多年期定制合同单独磋商。企业商户由专属商户成功经理对接，鉴于系统对接复杂度、合规审批以及授权优化参数的个性化配置，全球大型跨国客户的销售周期通常长达
              6-18 个月。缺乏自助渠道和中小商户（SMB）层级，使 Checkout.com 区别于 Stripe 的产品驱动增长（PLG）机制，导致获客成本（CAC）本身偏高且无法通过公开数据推算。

              结合 $300B 处理量和 $600M-$900M 的预估收入测算，综合抽成率约在 0.20-0.30%，高于 Adyen 披露的 0.13-0.15%，但契合 Checkout.com 靠
              Intelligent Acceptance、发卡及出款服务带来的更高增值服务附加率。公司未披露客单价（ACV）、单商户总收入或留存率指标。综合 63 家“十亿美元俱乐部”（BDC）商户和 1,000+
              家企业级客户体量推算，单客 ACV 估计在 $1M-$10M 之间，该数据完全为分析推导所得。渠道模式为全球直销，未设立分销商或渠道合作伙伴计划。与 Visa（发卡）、Microsoft
              Azure（云基础设施）及 SAP（ERP 支付集成）的核心合作，本质上是降低商户入驻门槛的技术集成，并非直接贡献收入的分销通道。
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI014
      - number: '4.3'
        title: 成本结构与毛利率驱动因素
        blocks:
          - type: paragraph
            body: >
              Checkout.com 的成本构成主要由支付处理成本主导——包括行间交换费（interchange
              fees）、卡组织网络费（Visa、Mastercard）以及本地收单网络成本。根据银行卡支付处理的商业常态，交换费通常占总交易额（GTV）的 1.5-2.5%
              并在扣给商户前由处理商预先垫付，测算该部分支出约占总收单收入的 60-70%。若业务综合抽成率处于 0.20-0.30%，绝大部分 GTV 都会作为交换费成本穿透支出，对应净收入落在 $600M-$900M
              估算区间；参照同业处理商水平推算，该净收入对应的毛利率估计在 50-60% 左右。

              技术基建成本显著低于传统支付处理商，因为 Checkout.com 部署在公有云（Microsoft Azure）上而非自建数据中心，省去了自建硬件基础设施的资本开支（capex）。约 1,000
              名研发人员（占约 2,000 名总员工的一半）构成了最大的固定成本开销，主要支撑产品迭代、Intelligent Acceptance 的 AI 模型训练以及维持 99.999% 可用性 SLA
              的平台高可靠体系。营运资金和资本开支格局良好：支付结算虽存在时间差，但 Checkout.com 并不承担库存风险，除 MALPB 银行牌照要求的监管资本外亦无项目融资敞口。

              合规成本——包括 FCA 牌照认证、PCI DSS Level 1 标准、跨多司法管辖区的 GDPR 规范，以及如今 FDIC 对 MALPB 银行子公司的监管审计——属于持续发生且不断膨胀的运营支出。MALPB
              牌照带来的首要资本占用风险在于最低监管银行资本金，目前该金额尚无公开披露，在与管理层或佐治亚州银行监管部门直接核实前，必须将其视为未量化的资产负债表潜在义务。
            claimRefs:
              - CI015
              - CI016
      - number: '4.4'
        title: 图表
        blocks:
          - type: callout
            title: 财务不透明度是投资尽调的核心阻碍
            body: >
              Checkout.com
              注册在泽西岛的控股母公司架构在法律上豁免了所有强制性公开财务披露，导致单凭公开渠道根本无法验证其收入、利润率、现金头寸、负债义务或资本充足状况。本章涉及的每一项财务数据要么是公司口径声明，要么是分析推算，抑或是未知数。仅基于已披露的运营指标（$300B
              TPV、>30% 净收入增速、>10% 调整后
              EBITDA）而在未签署保密协议（NDA）获取经审计合并财报的情况下做出任何投资决策，均属于信息不充分的投研承销。这并非监管漏洞——而是公司有意选择的公司注册与信息披露策略带来的必然结果。
            calloutType: risk
            claimRefs:
              - CI007
          - type: callout
            title: 三年外部融资真空加剧退出估值不确定性
            body: >
              上一轮机构融资还是 2022 年 1 月按 $40B 估值完成的 $1B D 轮融资。随后估值滑落至 $12B（2025 年 9
              月员工期权回购对价基准），且已有三年以上未引入任何新增外部资本，因此缺乏来自公允第三方机构投资者的市场出清估值佐证。2025 年 9 月回购使用的 $12B
              纯属公司内部确定的参考基准，不应视为公允市场估值。未来任何流动性事件——无论是 IPO、并购出售还是老股转让——均需要向市场披露真实的营收和盈利数据，届时展现出的财务画像可能与本章推算的指标存在重大出入。
            calloutType: risk
            claimRefs:
              - CI006
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与功能模块图
        blocks:
          - type: paragraph
            body: >
              Checkout.com 作为横向一体化平台向企业级商户输出支付基础设施，涵盖七大核心产品模块，全部依托单一商业合同与统一 API 交付。商户仅需集成一次——无论是通过 RESTful API、托管式
              Frames SDK 还是预构建的平台连接器——即可获取覆盖 150+ 种货币和 50+ 个国家/地区的非面对面（CNP）无卡收单、Intelligent Acceptance 智能授权 AI、发卡、Fraud
              Detection Pro 反欺诈风控、出款（Payouts）、Flow（托管式收银台 UI），以及覆盖 Apple Pay、Google Pay、Klarna、Pix、FedNow 和 SEPA Instant
              等 50+ 种替代支付方式的编排网络。

              面向消费者的支付全流程始于买家发起结账：Checkout.com Unified API 接收支付请求，调用 Intelligent Acceptance
              智能路由算法选择最优卡组织链路，经由直连收单核心提交授权，接收发卡行反馈，并在数百毫秒内将处理结果返回商户。增值服务——如 Fraud Detection Pro 风险评分、网络 Token（network
              token）展示以及 3D Secure 动态身份校验编排——均作为同一 API 事务的组成部分实时内联执行。出款与发卡业务则运行在同机托管的 API 界面上，并在商户后台统一管理。

              商业层面上，所有模块均按交易笔数计费，或在多年期定制合同中作为大客户增值插件单独商定。平台不设公开价目表，亦无自助注册层级。1,000+ 家企业商户群以及 63 家“十亿美元俱乐部”（年处理量达
              $1B+）成员构成了整套产品矩阵的目标客群。2025 年 APM 交易量同比增长 104%，发卡业务在 2025 年 Q4 达到 $5B 年化运行率，凸显出增值模块在核心收单之外商业化拓展成效显著。
