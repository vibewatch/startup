      - number: '2.2'
        title: 市场规模测算：多维视角
        blocks:
          - type: paragraph
            body: >
              目前尚无任何一份权威市场规模报告能与 Checkout.com 的产品矩阵范畴完全吻合，因此必须运用多维视角交叉推导。视角一（基于交易规模）：2024–2025 年全球电商交易规模预估在每年 $5–7
              trillion。企业级处理商的抽成比例在交易量的 0.10–0.30%；若按此比例套入全球数字商务的企业级细分板块，推导出的处理机构年度收入池在 $10–25B（保守口径）至
              $50B+（计入增值服务）。视角二（对标上市公司）：Adyen（上市，营收约 $2B，在约 €1.35T 处理量上录得约 0.15% 抽成率）与 Stripe（未上市，预估营收约 $5B，处理体量约
              $1T）可作为市场校准坐标。Checkout.com 依托 $300B 交易规模及推导出的 0.20–0.30% 抽成率，推测总营收为 $600M–$900M，与其 30%+
              的增长态势。视角三（宏观行研报告）：多家分析机构预测全球支付网关/处理市场规模到 2028 年将达 $75–130B（含 SMB 部分），但 Checkout.com
              能切入的企业级子赛道规模明显偏小。测算存在显著盲区：公司未公开确认营收，也未披露毛利率；加上非上市公司身份，外界无法交叉验证出确切数字。各项估算都有较大不确定性，只能作为数量级参考。
