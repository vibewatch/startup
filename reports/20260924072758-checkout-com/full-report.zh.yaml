      - number: '3.3'
        title: 定价机制与分销动态
        blocks:
          - type: paragraph
            body: >
              在 Checkout.com 所处的竞争梯队中，没有哪家主流支付处理商——包括 Adyen、Stripe、Worldpay、Braintree 或
              JPMorgan——会公开披露企业级定价。所有大客户合同均为单独磋商、按交易量分层的定制框架，将收单费、网关费与增值服务费捆绑收取。公开的官方标价（如 Stripe 的 2.9%+$0.30 以及
              Braintree/PayPal 的 2.59%+$0.49）仅适用于 SMB 和零售商户，完全无法代表企业级合同水准。

              从上市公司公开披露看，Adyen 的综合抽成率大约在交易量的 0.13–0.15%，反映出其纯企业级定位以及相对更低的增值服务附加率。根据公开披露的 $300B 交易量及估计为 $600M–$900M
              的收入运行率推算，Checkout.com 的估计抽成率为 0.20–0.30%，体现出其从 AI 授权优化、APM 手续费及发卡产品中挖掘出了更高的单体价值。Stripe 的实际综合费率更高（约
              0.4–0.5%），主要由其 SMB 和中端市场交易量构成拉动，但其单独的企业级合同费率会收敛至 Adyen 和 Checkout.com 的水平。

              各家在 GTM 模式上的分歧尤为鲜明。Checkout.com 采用直销企业级模式，配备专属商户成功经理——与 Adyen 的模式类似。Stripe
              走产品驱动增长（PLG）漏斗，把开发者心智转化为企业大客户采购。JPMorgan 把支付服务打包进更宏大的银行合作中，压低了单次支付的边际价格，却加深了商户对银行综合业务的依附度。Worldpay
              依赖传统分销商和银行渠道走量，难以吸引追求现代化集成体系与 API 优先的企业级商户。
            claimRefs:
              - CP007
              - CP010
