  rows:
  - - Market
    - Global enterprise payment TAM >$3.7T; <10% market penetration by direct acquirers; Checkout.com is structurally positioned
      to grow into the opportunity
    - Adyen and Stripe already dominate enterprise wallet share in Europe and North America at higher valuations; late-mover
      disadvantage in US direct acquiring
    - "US MALPB direct-acquiring volume trajectory in 2026\u20132027"
  - - Product
    - Intelligent Acceptance AI moat; Forrester Wave Leader Q1 2026; MALPB direct-acquiring eliminates sponsor bank dependency
    - Feature parity achievable by well-capitalised competitors; no published patent moat; acqui-hire risk in a down-round
      scenario
    - Intelligent Acceptance acceptance-rate delta vs Adyen in enterprise RFP benchmarks
  - - Financials
    - $300B+ TPV +64% YoY; first full-year adj. EBITDA profitability >10%; net revenue growth >30% for second consecutive
      year
    - All metrics are unaudited press-release figures; Jersey parent has no mandatory consolidated P&L; absolute revenue undisclosed
    - Consolidated audited group accounts and NRR disclosure in data room
  - - Customers
    - 63 BDC enterprise merchants ($1B+ annual TPV each); 1,000+ total direct clients; no confirmed merchant churn as of May
      2026
    - No NRR disclosed; merchant TPV concentration undisclosed; single BDC departure removes $2B+ annual volume from thesis
      model
    - Per-merchant TPV cohort data under NDA; independent merchant reference calls
  - - Financing
    - Adj. EBITDA positive; $1.8B raised historically; no external capital needed in short term; no disclosed liquidity pressure
    - Four-plus years since last institutional round; 70% valuation decline; $1.8B preference overhang structure unknown
    - Fresh primary round or public S-1 filing establishing independent institutional valuation
  - - Governance
    - Strong operating metrics signal management quality; dedicated executive team (CTO, CRO, COO in place)
    - 100% founder control (Pousaz); Monaco-resident since April 2025; no independent directors; no succession plan disclosed
    - Independent director appointment and formal succession plan as closing conditions for any investment
  - - Valuation
    - $12B is 4.0% P/TPV, roughly peer-inline with Adyen 3.5%; 8x estimated revenue is industry-normal for enterprise PSPs
      at this growth rate
    - Most recent institutional mark ($40B) is four years old; employee buyback is not independent price discovery; preference
      stack may impair common equity returns
    - IPO S-1 registration or fresh institutional primary round providing independent third-party valuation
  notes: 'Swing factors describe the specific evidence or event that would shift the view from thesis to anti-thesis or vice
    versa; they represent the highest-priority items in the final diligence asks. The ''no confirmed merchant churn'' observation
    is based on public reporting through May 2026 and does not constitute NRR confirmation.

