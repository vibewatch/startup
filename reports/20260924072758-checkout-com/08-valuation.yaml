  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-preference-overhang
    missingEvidence: "Checkout.com has not publicly disclosed its capitalisation table, liquidation preference schedule, anti-dilution\
      \ provisions, or waterfall analysis for the $1.8 billion across four rounds of preferred equity from Altimeter, Dragoneer,\
      \ Franklin Templeton, GIC, Insight Partners, QIA, Tiger Global, and DST Global. The preference structure at the $40\
      \ billion Series D round is particularly critical \u2014 any full-ratchet or weighted-average anti-dilution provision\
      \ would significantly impair common equity returns at entry prices below the $40 billion Series D round price.\n"
    whyItMatters: 'Without the cap table and preference waterfall, the actual investor return profile at any exit below $25
      billion cannot be modelled; the headline valuation-multiple return may substantially overstate the common equity return
      after preference liquidation; this is a blocking diligence item before any capital commitment.

      '
    diligencePath: 'Request fully diluted capitalisation table, liquidation preference schedule, and anti-dilution provision
      terms for all series from Checkout.com''s CFO or legal counsel under NDA; engage fund-level legal adviser to review
      preference terms and model waterfall at $12B, $16B, and $22B exit prices.

      '
    relatedQuestionRefs:
    - QV010
    - QV027
  - type: private-evidence-only
    severity: blocking
    topic: consolidated-group-accounts
    missingEvidence: "Checkout Group Ltd (Jersey parent) is not required to publish consolidated audited financial accounts;\
      \ all financial metrics cited in this chapter and by Checkout.com in press releases are unaudited company-stated figures.\
      \ No independent audit firm has published a review of Checkout.com's group-level revenue, EBITDA, costs, or balance\
      \ sheet. The estimated FY2025 net revenue of $520\u2013600 million is a model construct, not a verified figure.\n"
    whyItMatters: "The investment thesis depends on validated revenue growth and EBITDA margin; any material divergence from\
      \ the modelled estimates \u2014 particularly if net revenue is below $450 million or EBITDA margin below 8% \u2014 would\
      \ reprice the investment and potentially collapse the base case return model. This gap cannot be closed from public\
      \ sources.\n"
    diligencePath: "Request FY2023\u2013FY2025 consolidated group audited accounts under NDA; request management accounts\
      \ for the most recently completed quarter; require a Big Four firm to provide agreed-upon procedures report on the key\
      \ financial metrics.\n"
