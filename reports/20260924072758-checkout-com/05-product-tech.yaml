- id: TE002
  title: Workflow / use-case table
  columns:
  - User Job
  - Current Workflow (Pre-Checkout.com)
  - Checkout.com Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Accept card payments globally
    - Multiple PSP relationships per region; separate acquiring contracts per card scheme; manual reconciliation
    - Single unified API acquiring across 50+ countries; direct Visa/MC/Amex membership
    - Eliminates multi-PSP fragmentation; reduces sponsor bank margin; unified reporting
    - Enterprise-only; no self-serve or SMB tier; 6-18 month onboarding cycle
  - - Maximise payment acceptance rates
    - Static routing rules; manual retry logic; periodic updates by payment operations team
    - 'Intelligent Acceptance: 87M daily AI decisions; smart retry; network token optimisation'
    - +3.8 pp average acceptance rate improvement; $10B+ in additional merchant revenue since launch
    - Acceptance lift is a portfolio average; per-merchant variation not disclosed; no third-party audit
  - - Issue corporate or virtual debit cards at scale
    - Third-party issuing platforms (Marqeta, Stripe Issuing); separate integration and commercial relationship
    - Integrated card issuing; Visa-partnered; virtual + physical debit; UK/EEA live
    - $5B annualised run rate; faster issuance cycle; single-platform management
    - US issuing not yet live; geographically limited to UK/EEA in production
  - - Prevent fraud and reduce chargebacks
    - Rule-based fraud platforms; manual review queues; separate third-party fraud vendor
    - 'Fraud Detection Pro: ML risk scoring; adaptive rules; MRC-integrated threat intelligence'
    - Chargeback rate reduction (specific percentage not publicly disclosed); lower false-positive declines
    - No published precision/recall benchmark; specific reduction metrics not disclosed
  - - Embed payment UI in mobile or web application
    - Custom card form builds; PCI scope expansion; separate tokenisation SDK per platform
    - 'Frames SDK (iOS/Android/JS): pre-built PCI-compliant card input; token issued at edge'
    - Reduced PCI scope; faster mobile checkout development; consistent UX across platforms
    - Limited to card-not-present input; no native in-app wallet orchestration beyond Frames
  notes: 'Solutions and benefits are company-claimed from official newsroom and developer documentation. Measurable benefits
    (acceptance lift, issuing run rate) are management-disclosed and not independently audited. The pre-Checkout.com workflow
    column is illustrative based on typical enterprise payment stack patterns, not validated against named merchant references.

    '
