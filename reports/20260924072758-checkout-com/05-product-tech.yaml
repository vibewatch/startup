  - CE002
  - CE003
  - CE005
  - CE007
  - CE011
- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / Component
  - Role
  - Key Dependency
  - Risk
  rows:
  - - Merchant API & SDK Layer
    - RESTful API entry point; webhook dispatch; SDK abstraction across Python, Node.js, .NET, Java, Go, iOS, Android
    - developer.checkout.com documentation uptime; API versioning continuity
    - Breaking API change risk; SDK version lag across 7 languages; documentation downtime
  - - Intelligent Acceptance Engine
    - ML routing; smart retry; network token optimiser; 3DS challenge intelligence; 87M daily decisions
    - Azure ML compute; Visa/Mastercard network token API access
    - Model degradation if transaction distribution shifts; network token API dependency on Visa/MC
  - - Direct Acquiring Core
    - Card network authorisation and settlement; FCA-licensed UK; Georgia MALPB US acquiring
    - Visa/Mastercard/Amex direct membership; UK FCA licence; Georgia MALPB charter
    - Licence revocation is existential; MALPB charter newly approved and not fully scaled; dual-licence maintenance cost
  - - Value-Added Services Layer
    - Fraud Detection Pro; Flow checkout; Payouts; Network Tokens; Card Issuing (Visa)
    - Visa issuing partnership; MRC threat intelligence data feeds; Azure ML compute
    - Partner dependency (Visa, MRC); cross-sell attach dependent on enterprise contract scope and renewal
  - - APM Orchestration Layer
    - Routes to 50+ APMs; manages redirect and silent redirect flows; handles webhook callbacks
    - Klarna/Afterpay/PayPal API contracts; national real-time payment scheme operators
    - APM partner contract termination; real-time scheme compliance rule changes; redirect abandonment friction
  - - Cloud Infrastructure (Azure)
    - Multi-region compute, storage, networking; disaster recovery; SLA backbone for 99.999% uptime
    - Microsoft Azure multi-year partnership; multi-region failover architecture
    - Azure regional outage risk; multi-year vendor lock-in; ShinyHunters legacy storage remediation outstanding
  notes: 'Architecture derived from official API documentation, developer portal, and newsroom disclosures. Specific Azure
    region count, failover RTO/RPO targets, and Intelligent Acceptance model architecture are not publicly disclosed; this
    table is based on management-disclosed and inferred information only.

