  figureRefs: []
tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / Asset
  - Primary User
  - Status / Maturity
  - Differentiation
  - Diligence Gap
  rows:
  - - Intelligent Acceptance
    - Enterprise merchants globally
    - GA since Jun 2023; 87M daily decisions; avg +3.8 pp acceptance lift
    - ML-powered smart retry, network token optimiser, 3DS challenge intelligence; proprietary data flywheel
    - Acceptance lift not independently benchmarked; no per-vertical breakdown published
  - - Card-not-present Acquiring
    - Enterprise merchants; 50+ countries; 150+ currencies
    - GA; core product; $300B+ TPV 2025; FCA-licensed UK; MALPB US approved Jan 2026
    - Direct Visa/MC/Amex membership; no sponsor bank; end-to-end acquiring ownership
    - MALPB US operationalisation timeline not confirmed; sponsor bank bridge period unclear
  - - Card Issuing (UK/EEA)
    - B2B enterprises; fintech clients; virtual + physical debit programmes
    - GA UK/EEA since Mar 2023; Visa partnership Jul 2025; $5B annualised run rate Q4 2025
    - Visa-partnered issuing; single-platform debit card management; real-time card controls
    - US issuing not yet live; MALPB infrastructure approved but timeline unconfirmed
  - - Flow (Hosted Checkout)
    - Enterprise UX/product teams; mobile-first merchants
    - GA since May 2024; SAP OPF integration Mar 2026
    - Conversion-optimised hosted page; A/B testing; APM-native; mobile-first responsive
    - No independent A/B test uplift data published; conversion improvement claimed but unaudited
  - - Fraud Detection Pro
    - Enterprise fraud and risk teams
    - GA; MRC-integrated; active 2025
    - ML risk scoring; adaptive rules engine; MRC threat intelligence partnership
    - No published false-positive rate, precision-recall metrics, or chargeback-reduction percentage
  - - Payouts
    - Marketplace platforms; gig economy operators; cross-border merchants
    - GA; multi-currency; SEPA / UK Faster Payments / SWIFT
    - Multi-rail disbursement; 150+ currency support; API-driven reconciliation
    - Pricing not published; volume and market share not disclosed
  - - APM Network (50+)
    - Global enterprise merchants; regional consumer bases
    - GA; 104% YoY volume growth 2025; includes wallets, BNPL, real-time schemes
    - Apple Pay, Google Pay, Klarna, Afterpay, Pix, FedNow, SEPA Instant coverage
    - Coverage depth by geography varies; real-time schemes not uniformly available across all markets
  notes: 'Status and maturity ratings are company-claimed from official newsroom announcements and developer documentation;
    none has been independently audited. Diligence gaps reflect the absence of publicly verified performance or operational
    data. All volume figures are management-disclosed.

    '
