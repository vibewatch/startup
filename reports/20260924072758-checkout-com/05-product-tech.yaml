- id: architecture-and-operating-model
  title: Architecture and Operating Model
  body: "Checkout.com's platform is cloud-native and runs exclusively on Microsoft Azure under a multi-year strategic partnership\
    \ announced in October 2025, spanning multiple global Azure regions to support 50+ country acquiring coverage with disaster\
    \ recovery and multi-region failover. The company targets 99.999% service-level availability; a public status page at\
    \ status.checkout.com provides real-time component health and historical incident data.\nThe technology stack is organised\
    \ in five layers. At the top, a Merchant API and SDK layer provides a single RESTful entry point for all payment products,\
    \ with production-grade SDKs in Python, Node.js, .NET, Java, Go, iOS (Frames), and Android (Frames) maintained as open-source\
    \ repositories under the github.com/checkout organisation. Beneath that, the Intelligent Acceptance Engine applies 87M\
    \ daily ML decisions across smart retry, network token optimisation, and 3DS challenge intelligence. The Direct Acquiring\
    \ Core \u2014 FCA-licensed in the UK and MALPB-chartered in Georgia for US \u2014 sits at the authorisation and settlement\
    \ layer with direct Visa, Mastercard, and Amex network membership. Value-added services (Fraud Detection Pro, Flow, Payouts,\
    \ Network Tokens, Card Issuing) share the same Azure backend. The APM Orchestration Layer routes to 50+ third-party payment\
    \ methods via managed redirect and silent redirect flows.\nPeak load was demonstrated on Black Friday and Cyber Monday\
    \ 2025 when the platform processed $5.2B in 24 hours across approximately 100M transactions without a reported outage,\
    \ validating infrastructure scalability. Checkout.com was the first PSP to launch Google Pay Secure Payment Authentication\
    \ (SPA) in 2024, confirming deep Tier-1 technology partner integration capability. The Frames SDKs (iOS and Android) provide\
    \ pre-built PCI-compliant card input components enabling merchants to accept mobile payments without expanding their own\
    \ PCI scope.\n"
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  tableRefs:
  - TE003
  figureRefs:
  - FE001
- id: differentiation-and-technical-moats
  title: Differentiation and Technical Moats
  body: "Checkout.com's competitive moat rests on three reinforcing components. First, direct card network membership (Visa,\
    \ Mastercard, Amex) enables end-to-end ownership of the acquiring relationship: no sponsor bank dependency, lower per-transaction\
    \ cost, and a differentiated acceptance rate baseline compared to gateway-only PSPs. The January 2026 Georgia MALPB bank\
    \ charter extends this ownership to the US market, removing a structural competitive disadvantage that previously forced\
    \ Checkout.com to route US card volume through a sponsor bank.\nSecond, the Intelligent Acceptance AI data moat derives\
    \ from 87M daily optimisation decisions across a large enterprise transaction corpus. This data volume is not replicable\
    \ by smaller-volume PSPs and compounds with each additional transaction, creating a reinforcing accuracy advantage. Since\
    \ its June 2023 launch, Intelligent Acceptance has been attributed with $10B+ in additional merchant revenue unlocked,\
    \ averaging +3.8 percentage points in acceptance rate improvement. Checkout.com was ranked a Leader by a global analyst\
    \ firm for its AI-powered acceptance platform in Q1 2026.\nThird, the integration ecosystem and ERP channel: the SAP Open\
    \ Payment Framework integration (March 2026) distributes Checkout.com's acquiring to the SAP enterprise customer base\
    \ \u2014 a new distribution channel bypassing the traditional enterprise sales cycle for SAP-using merchants. The Blue\
    \ EMI acquisition (January 2026) adds euro-stablecoin settlement, positioning Checkout.com ahead of pure fiat-only competitors\
    \ in the digital-asset settlement layer. The 2026 agentic commerce initiative positions AI agents as autonomous checkout\
    \ actors, with the company's first-mover announcement ahead of confirmed comparable commitments from Stripe or Adyen.\n"
  claimRefs:
  - CE002
  - CE003
  - CE016
