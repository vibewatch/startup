company:
  name: Checkout.com
chapter:
  number: 1
  title: Company Overview
  summary: "Checkout.com is a London-headquartered global payment technology company founded in 2012 by Guillaume Pousaz.\
    \ It processed $300B+ in payment volume in 2025 \u2014 a 64% YoY increase \u2014 and achieved full-year adjusted EBITDA\
    \ profitability exceeding 10% margin for the first time. The company is valued at $12B (September 2025 employee buyback),\
    \ has raised $1.8B in total capital, and obtained approval for a US Merchant Acquirer Limited Purpose Bank (MALPB) charter\
    \ in Georgia in January 2026, expanding its regulated infrastructure capabilities.\n"
sections:
- id: identity-and-business-model
  title: Identity and Business Model
  body: "Checkout.com was founded in 2012 by Guillaume Pousaz as a full-stack payment infrastructure provider targeting enterprise\
    \ merchants globally. It offers end-to-end payment services spanning acquiring, payment gateway, card issuing, fraud detection,\
    \ alternative payment methods, and payouts. Its primary customer base is large enterprise merchants \u2014 over 1,000\
    \ as of early 2026 \u2014 with a \"Billion Dollar Club\" of 63 merchants each processing more than $1B annually through\
    \ the platform. The company's go-to-market focuses on complex, high-volume merchants who demand bespoke acceptance optimisation,\
    \ risk management, and local acquiring capabilities across 50+ countries. Revenue derives from payment processing fees\
    \ and, increasingly, value-added services like Intelligent Acceptance and card issuing. The parent entity is incorporated\
    \ in Jersey, an offshore jurisdiction not legally required to disclose revenue or profit. The company operates through\
    \ two principal UK subsidiaries: Checkout Ltd (which holds the FCA acquiring licence) and Checkout Technology Ltd (which\
    \ owns the intellectual property and employs the R&D function). This structure gives the group flexibility in managing\
    \ IP ownership and taxable profit attribution across jurisdictions.\n"
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  tableRefs:
  - TO001
  figureRefs:
  - FO001
- id: leadership-and-governance
  title: Leadership and Governance
  body: "Guillaume Pousaz founded Checkout.com and has remained CEO throughout its growth from startup to a $12B-valued global\
    \ payments processor. In April 2025, Pousaz relocated from the United Kingdom to Monaco in response to changes to the\
    \ UK non-domicile tax rules, joining a wave of ultra-high-net-worth individuals departing the UK under the new tax regime.\
    \ This relocation is a governance signal that diligence must interrogate for continuity risk. The current executive team\
    \ is deep and experienced: CTO Mariano Albera oversees technology, CRO Antoine Nougu\xE9 leads global revenue, CPO Meron\
    \ Colbeci leads product, COO Jenny Hadlow leads operations, and CMO Rory O'Neill leads marketing. For the US banking push,\
    \ Jordan Reynolds was appointed MALPB CEO and Head of North America Banking, reflecting the strategic importance of the\
    \ Georgia bank charter obtained in January 2026. The company employs approximately 2,000 people globally, with roughly\
    \ 50% of staff based in the UK. Checkout.com's parent company structure in Jersey means that detailed financial disclosures\
    \ are not required publicly, and the group does not release revenue or profit figures, reducing transparency for prospective\
    \ investors and partners evaluating the business.\n"
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  tableRefs:
  - TO002
- id: funding-history-and-valuation
  title: Funding History and Valuation
  body: "Checkout.com has raised approximately $1.8B in total external capital across its funding history. The most recent\
    \ public round was a $1B Series D closed on January 12, 2022, at a $40B valuation. Investors included Altimeter Capital,\
    \ Dragoneer Investment Group, Franklin Templeton, GIC (Singapore's sovereign wealth fund), Insight Partners, Qatar Investment\
    \ Authority, Tiger Global, and Oxford University Endowment Fund, with existing backers Blossom Capital, Coatue, DST Global,\
    \ Endeavor Catalyst, and Ribbit Capital participating. Following the broader fintech valuation correction, Checkout.com's\
    \ internal valuation was cut to approximately $11B in late 2022 and again to $9.35B in 2023. The September 2025 employee\
    \ share buyback program implicitly established a $12B valuation using US 409A accounting rules \u2014 a 28% recovery from\
    \ the 2023 trough but still a 70% discount to the peak $40B. IPO speculation has been reported by press but has not been\
    \ confirmed by the company as of the report date. The company has not raised any new external institutional capital since\
    \ the January 2022 Series D, suggesting it is operating on existing capital while targeting profitability ahead of a potential\
    \ exit.\n"
  claimRefs:
  - CO014
  - CO015
  - CO016
