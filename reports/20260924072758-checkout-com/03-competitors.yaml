- id: feature-capability-comparison
  title: Feature and Capability Comparison
  body: "Across the five principal buying criteria \u2014 AI acceptance optimisation, direct acquiring infrastructure, alternative\
    \ payment method (APM) breadth, card issuing, and developer experience \u2014 Checkout.com holds first-mover positions\
    \ in AI acceptance and US direct acquiring (MALPB), but faces credible competition on all five dimensions.\nAI acceptance\
    \ is the most debated differentiator. Checkout.com's Intelligent Acceptance product reports an average +3.8 percentage\
    \ point improvement in card acceptance rates by routing transactions through the optimal acquiring path using models trained\
    \ on $300 billion in annual volume. Adyen's \"Uplift\" and \"Optimum Authorisation\" products, plus Stripe's \"Adaptive\
    \ Acceptance,\" are the primary competitive responses \u2014 both launched or significantly expanded in 2024 \u2014 and\
    \ are closing the gap. The estimated lead for Checkout.com is 12\u201318 months as of early 2026. APM coverage favours\
    \ Adyen (200+ methods) by breadth, but Checkout.com by recent growth rate (104% APM volume growth in 2025 on 50+ methods),\
    \ suggesting Checkout.com is deepening integrations in APAC and MENA rather than simply adding breadth.\nDirect acquiring\
    \ infrastructure is a harder moat to replicate. Adyen built its direct- acquiring network over 18 years. Checkout.com\
    \ is accelerating with the Georgia MALPB charter (approved January 2026), which removes the bank-sponsor intermediary\
    \ for US card settlement \u2014 a structural advantage not yet replicated by Stripe or Braintree. Developer experience\
    \ remains Stripe's most durable competitive moat; Checkout.com's SDK breadth (50+ across iOS, Android, and web, including\
    \ the Frames card component) is competitive but does not match Stripe's documentation depth and developer community engagement.\n"
  claimRefs:
  - CP004
  - CP005
