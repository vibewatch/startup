callouts:
- calloutType: risk
  title: Financial Opacity Is the Primary Investment Diligence Blocker
  body: "Checkout.com's Jersey holding company structure legally prevents any mandatory public financial disclosure, making\
    \ it impossible to verify revenue, margins, cash position, debt obligations, or capital adequacy from public sources alone.\
    \ Every financial metric in this chapter is either company-claimed, estimated, or unknown. Any investment decision based\
    \ solely on disclosed operational metrics ($300B TPV, >30% net revenue growth, >10% adjusted EBITDA) without obtaining\
    \ audited consolidated financials under NDA constitutes information-insufficient underwriting. This is not a regulatory\
    \ gap \u2014 it is the expected consequence of the company's deliberate incorporation and disclosure choices.\n"
  claimRefs:
  - CI007
- calloutType: risk
  title: Three-Year Capital Gap Creates Valuation Uncertainty at Exit
  body: "The last institutional financing round was the $1B Series D in January 2022 at a $40B valuation. The subsequent decline\
    \ to $12B (September 2025 employee buyback reference) and the absence of any new external capital for over three years\
    \ means there is no market- clearing valuation evidence from an arms-length institutional investor. The September 2025\
    \ buyback at $12B is a company-set reference price and should not be treated as a market valuation. Any future liquidity\
    \ event \u2014 IPO, acquisition, or secondary \u2014 will require revenue and profit disclosure that may reveal a materially\
    \ different financial profile from the implied estimates in this chapter.\n"
  claimRefs:
  - CI006
