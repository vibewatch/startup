- id: pricing-and-gtm-efficiency
  title: Pricing and GTM Efficiency
  body: 'Checkout.com operates an exclusively enterprise-direct sales model with no published list pricing and no self-serve
    or developer-led growth funnel. All pricing is negotiated individually via multi-year custom contracts. Enterprise merchants
    are assigned dedicated merchant success managers, and the sales cycle for major global enterprise accounts typically spans
    6-18 months due to integration complexity, regulatory approvals, and the bespoke configuration of acceptance optimisation
    parameters. No self-serve channel or SMB tier exists, distinguishing Checkout.com from Stripe''s product-led growth motion
    and making CAC inherently high and not publicly estimable.

    Blended take rate analysis using $300B volume and estimated revenue of $600M-$900M implies an effective rate of 0.20-0.30%,
    higher than Adyen''s disclosed 0.13-0.15% but consistent with Checkout.com''s higher value-added service attach rate from
    Intelligent Acceptance, issuing, and payout services. The company has not disclosed average contract value, gross revenue
    per merchant, or retention rates. The 63-merchant Billion Dollar Club and total merchant base of 1,000+ enterprise accounts
    implies an estimated ACV range of $1M-$10M per enterprise account, entirely analytically derived. Distribution is global-direct
    with no reseller or channel partner programme. Key partnerships with Visa (issuing), Microsoft Azure (cloud infrastructure),
    and SAP (ERP payments integration) function as technology integrations reducing merchant onboarding friction rather than
    acting as revenue-generating distribution channels.

    '
  claimRefs:
  - CI011
  - CI012
  - CI013
  - CI014
  tableRefs:
  - TI002
- id: cost-structure-and-margins
  title: Cost Structure and Gross Margin Drivers
  body: "Checkout.com's cost structure is dominated by payment processing costs \u2014 interchange fees, card network fees\
    \ (Visa, Mastercard), and local acquiring network costs. These are estimated at 60-70% of gross acquiring revenue, reflecting\
    \ the economics of card-based payment processing where interchange is typically 1.5-2.5% of GTV and is borne by the processor\
    \ before netting to the merchant. For a business at 0.20-0.30% blended take rate on volume, the majority of gross GTV\
    \ passes through as interchange cost, leaving estimated net revenue in the $600M-$900M range with gross margin on that\
    \ net revenue estimated at 50-60% based on comparable processor benchmarks.\nTechnology infrastructure costs are materially\
    \ lower than traditional payment processors because Checkout.com runs on public cloud (Microsoft Azure) rather than owning\
    \ data centres, eliminating owned-infrastructure capex. Engineering headcount of approximately 1,000 staff (half of the\
    \ ~2,000 total headcount) represents the largest fixed cost base, driving product development, AI model training for Intelligent\
    \ Acceptance, and platform reliability to support the 99.999% uptime SLA. Working capital and capex dynamics are favourable:\
    \ payment settlement creates timing differences but Checkout.com does not bear inventory risk or project-finance exposure\
    \ beyond the MALPB bank charter regulatory capital obligation.\nCompliance costs \u2014 FCA authorisation, PCI DSS Level\
    \ 1, GDPR across multiple jurisdictions, and now FDIC supervision of the MALPB bank subsidiary \u2014 are ongoing and\
    \ growing operating expenditures. The primary capital intensity exposure introduced by the MALPB charter is minimum regulatory\
    \ bank capital, which has not been publicly disclosed and must be treated as an unquantified balance-sheet obligation\
    \ until confirmed through direct engagement with management or Georgia banking regulators.\n"
  claimRefs:
  - CI015
  - CI016
  figureRefs: []
