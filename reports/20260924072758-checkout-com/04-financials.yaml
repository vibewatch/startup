chapter:
  number: 4
  title: Financials
  summary: "Checkout.com processed $300B+ in total payment volume in 2025 (64% YoY growth) and achieved full-year adjusted\
    \ EBITDA profitability exceeding 10% margin for the first time, implying estimated net revenue of $600M-$900M. However,\
    \ the Jersey parent company structure exempts the group from any mandatory financial disclosure, making revenue, margins,\
    \ cash position, and debt obligations entirely private \u2014 the primary diligence blocker for any investment decision.\
    \ The company has raised $1.8B in total capital, has not raised new institutional capital since January 2022, and funded\
    \ an employee share buyback at a $12B valuation from operations in September 2025, signalling operational self-sufficiency\
    \ but leaving capital structure opaque.\n"
sections:
- id: revenue-model-and-streams
  title: Revenue Model and Streams
  body: "Checkout.com generates revenue across six principal streams, all tied to payment activity volume or value-added service\
    \ utilisation. The dominant stream is payment acquiring fees, charged as a small percentage of gross transaction value\
    \ (GTV) where Checkout.com acts as the principal acquirer or acquiring network agent for a merchant. Based on $300B+ in\
    \ total payment volume (TPV) disclosed for 2025 and an estimated blended take rate of 0.20-0.30% derived from analyst\
    \ consensus, gross acquiring revenue likely falls in the range of $600M-$900M, though the company has never disclosed\
    \ this figure.\nThe second stream is the payment gateway and processing API, which charges per-transaction or per-API-call\
    \ fees for authorisation, tokenisation, and routing services. Third, value-added services \u2014 Intelligent Acceptance,\
    \ Fraud Detection Pro, Network Tokens, and Flow checkout \u2014 generate incremental revenue as separately licensed enterprise\
    \ products atop core acquiring. Fourth, card issuing, conducted in partnership with Visa for B2B virtual and physical\
    \ cards, reached a $5B annualised run rate in Q4 2025. Fifth, payouts (disbursements to marketplace sellers, gig-economy\
    \ workers, and cross-border recipients) form a payout-as-a-service fee line. Sixth, FX conversion on cross-border transactions\
    \ generates spread revenue where Checkout.com holds currency risk between settlement and payout.\nRevenue recognition\
    \ follows the principal-agent framework: where Checkout.com is the principal acquirer it recognises gross revenue before\
    \ interchange pass-through; where it acts as gateway-only it recognises net gateway fees only. The split between principal\
    \ and net revenue is not publicly disclosed, creating material uncertainty for gross margin and revenue quality analysis.\
    \ The Black Friday and Cyber Monday 2025 period processed $5.2B in 24 hours with approximately 100M transactions, demonstrating\
    \ peak processing capacity.\n"
  claimRefs:
  - CI001
  - CI004
  - CI005
  - CI008
  - CI009
  - CI010
  tableRefs:
  - TI001
  - TI003
  figureRefs:
