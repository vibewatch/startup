            title: 'AI Acceptance Data Moat: 87M Daily Decisions'
            body: >
              Intelligent Acceptance processes 87M payment optimisation decisions daily, delivering a +3.8
              percentage-point average acceptance rate lift and unlocking $10B+ in additional merchant revenue since its
              June 2023 launch. The transaction feedback corpus — proprietary to Checkout.com's enterprise merchant base
