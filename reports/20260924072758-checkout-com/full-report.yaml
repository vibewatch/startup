      - number: '4.2'
        title: Pricing and GTM Efficiency
        blocks:
          - type: paragraph
            body: >
              Checkout.com operates an exclusively enterprise-direct sales model with no published list pricing and no
              self-serve or developer-led growth funnel. All pricing is negotiated individually via multi-year custom
              contracts. Enterprise merchants are assigned dedicated merchant success managers, and the sales cycle for
              major global enterprise accounts typically spans 6-18 months due to integration complexity, regulatory
              approvals, and the bespoke configuration of acceptance optimisation parameters. No self-serve channel or
              SMB tier exists, distinguishing Checkout.com from Stripe's product-led growth motion and making CAC
              inherently high and not publicly estimable.

              Blended take rate analysis using $300B volume and estimated revenue of $600M-$900M implies an effective
              rate of 0.20-0.30%, higher than Adyen's disclosed 0.13-0.15% but consistent with Checkout.com's higher
              value-added service attach rate from Intelligent Acceptance, issuing, and payout services. The company has
              not disclosed average contract value, gross revenue per merchant, or retention rates. The 63-merchant
              Billion Dollar Club and total merchant base of 1,000+ enterprise accounts implies an estimated ACV range
              of $1M-$10M per enterprise account, entirely analytically derived. Distribution is global-direct with no
              reseller or channel partner programme. Key partnerships with Visa (issuing), Microsoft Azure (cloud
              infrastructure), and SAP (ERP payments integration) function as technology integrations reducing merchant
              onboarding friction rather than acting as revenue-generating distribution channels.
            claimRefs:
              - CI011
              - CI012
              - CI013
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI014
      - number: '4.3'
        title: Cost Structure and Gross Margin Drivers
        blocks:
          - type: paragraph
            body: >
              Checkout.com's cost structure is dominated by payment processing costs — interchange fees, card network
              fees (Visa, Mastercard), and local acquiring network costs. These are estimated at 60-70% of gross
              acquiring revenue, reflecting the economics of card-based payment processing where interchange is
              typically 1.5-2.5% of GTV and is borne by the processor before netting to the merchant. For a business at
              0.20-0.30% blended take rate on volume, the majority of gross GTV passes through as interchange cost,
              leaving estimated net revenue in the $600M-$900M range with gross margin on that net revenue estimated at
              50-60% based on comparable processor benchmarks.

              Technology infrastructure costs are materially lower than traditional payment processors because
              Checkout.com runs on public cloud (Microsoft Azure) rather than owning data centres, eliminating
              owned-infrastructure capex. Engineering headcount of approximately 1,000 staff (half of the ~2,000 total
              headcount) represents the largest fixed cost base, driving product development, AI model training for
              Intelligent Acceptance, and platform reliability to support the 99.999% uptime SLA. Working capital and
              capex dynamics are favourable: payment settlement creates timing differences but Checkout.com does not
              bear inventory risk or project-finance exposure beyond the MALPB bank charter regulatory capital
              obligation.

              Compliance costs — FCA authorisation, PCI DSS Level 1, GDPR across multiple jurisdictions, and now FDIC
              supervision of the MALPB bank subsidiary — are ongoing and growing operating expenditures. The primary
              capital intensity exposure introduced by the MALPB charter is minimum regulatory bank capital, which has
              not been publicly disclosed and must be treated as an unquantified balance-sheet obligation until
              confirmed through direct engagement with management or Georgia banking regulators.
            claimRefs:
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financial Opacity Is the Primary Investment Diligence Blocker
            body: >
              Checkout.com's Jersey holding company structure legally prevents any mandatory public financial
              disclosure, making it impossible to verify revenue, margins, cash position, debt obligations, or capital
              adequacy from public sources alone. Every financial metric in this chapter is either company-claimed,
              estimated, or unknown. Any investment decision based solely on disclosed operational metrics ($300B TPV,
              >30% net revenue growth, >10% adjusted EBITDA) without obtaining audited consolidated financials under NDA
              constitutes information-insufficient underwriting. This is not a regulatory gap — it is the expected
              consequence of the company's deliberate incorporation and disclosure choices.
            calloutType: risk
            claimRefs:
              - CI007
          - type: callout
            title: Three-Year Capital Gap Creates Valuation Uncertainty at Exit
            body: >
              The last institutional financing round was the $1B Series D in January 2022 at a $40B valuation. The
              subsequent decline to $12B (September 2025 employee buyback reference) and the absence of any new external
              capital for over three years means there is no market- clearing valuation evidence from an arms-length
              institutional investor. The September 2025 buyback at $12B is a company-set reference price and should not
              be treated as a market valuation. Any future liquidity event — IPO, acquisition, or secondary — will
              require revenue and profit disclosure that may reveal a materially different financial profile from the
              implied estimates in this chapter.
            calloutType: risk
            claimRefs:
              - CI006
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >
              Checkout.com delivers payment infrastructure to enterprise merchants as a horizontally integrated platform
              spanning seven core product modules, all served under a single commercial relationship and unified API
              contract. Merchants integrate once — via RESTful API, hosted Frames SDK, or pre-built platform connectors
              — and gain access to card-not-present acquiring across 150+ currencies and 50+ countries, Intelligent
              Acceptance AI, card issuing, Fraud Detection Pro, payouts, Flow (hosted checkout UI), and an orchestrated
              network of more than 50 alternative payment methods including Apple Pay, Google Pay, Klarna, Pix, FedNow,
              and SEPA Instant.

              The customer-facing workflow begins when a merchant buyer initiates checkout: the Checkout.com Unified API
              receives the payment request, applies Intelligent Acceptance routing to select the optimal network path,
              submits for authorisation via the direct acquiring core, receives the issuer decision, and returns the
              result to the merchant within a few hundred milliseconds. Value-added services — Fraud Detection Pro
              scoring, network token presentation, and 3D Secure challenge orchestration — are applied inline as part of
              the same API transaction. Payouts and card issuing operate on co-hosted API surfaces managed within the
              same merchant dashboard.

              Commercially, all modules are priced per transaction or as enterprise add-ons negotiated in bespoke
              multi-year contracts. There is no published list pricing or self-serve tier. The 1,000+ enterprise
              merchant base and the 63-merchant Billion Dollar Club (each processing $1B+ annually) represent the
              addressable customer base for the complete product stack. APM volume grew 104% year-on- year in 2025, and
              card issuing reached a $5B annualised run rate in Q4 2025, underscoring the successful commercial
              expansion of value-added modules beyond core acquiring.
