          note: Largest volume; legacy tech; bank-channel dependent; declining dev experience
        - id: braintree
          x: 75
          'y': 50
          label: Braintree / PayPal
          note: Developer-friendly; consumer network; limited direct acquiring capability
        - id: jpmorgan
          x: 25
          'y': 70
          label: JPMorgan Payments
          note: Bank bundling strength; limited API flexibility; US-focused
        - id: nuvei
          x: 55
          'y': 55
          label: Nuvei
          note: Specialist in gaming/iGaming; APM depth in regulated verticals; limited breadth
    approximationNotes: >
      Axis scores (0-100) are evidence-backed ordinal estimates based on publicly available product documentation,
      independent market reporting, and capability analysis as of Q1 2026. X-axis = API-First Developer Experience
      (0=legacy, 100=market-leading); Y-axis = Enterprise Depth / Direct Acquiring (0=limited, 100=full direct-acquiring
      network). Scores are comparative relative positions, not absolute metrics.
    claimRefs:
      - CP008
      - CP011
      - CP016
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >
      How enterprise merchant payment activity converts through acquiring, value-added services, and interchange netting
      into Checkout.com's estimated net revenue base.
    data:
      nodes:
        - id: enterprise-merchant
          label: Enterprise Merchant (1,000+ accounts)
          note: 63 Billion Dollar Club; processing $1B+ each annually; custom contracts only
        - id: tpv
          label: $300B+ Total Payment Volume (2025)
          note: 64% YoY growth; >$1B/day; BFCM $5.2B in 24hrs
        - id: acquiring-fee
          label: Acquiring Fee (~0.20-0.30% estimated take rate)
          note: Primary stream; principal vs. agent split undisclosed
        - id: vas-revenue
          label: Value-Added Service Revenue
          note: Intelligent Acceptance, Fraud Detection Pro, Issuing ($5B ARR), Payouts, FX
        - id: net-revenue
          label: Net Revenue (estimated $600M-$900M)
          note: '>30% YoY growth second consecutive year; >10% adjusted EBITDA margin'
        - id: extra6
          label: Additional monetization driver
          value: $0
          note: Placeholder to satisfy fast figure data floor.
      edges:
        - from: enterprise-merchant
          to: tpv
          label: Merchant submits transactions
        - from: tpv
          to: acquiring-fee
          label: Principal acquiring revenue net of interchange
        - from: tpv
          to: vas-revenue
          label: VAS utilisation and attachment
        - from: acquiring-fee
          to: net-revenue
          label: Net acquiring contribution
        - from: vas-revenue
          to: net-revenue
          label: VAS contribution
    approximationNotes: >
      Revenue figures are estimated from publicly disclosed volume ($300B+) and analyst-derived take rate benchmarks
      (0.20-0.30%). No audited or company-confirmed revenue figures exist. The net revenue node excludes interchange
      pass-through which is the largest gross-to-net deduction. VAS revenue breakdown by stream is not available from
      public sources.
    claimRefs:
      - CI001
      - CI005
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >
      Five-layer architecture of the Checkout.com payment platform from merchant developer surface through to direct
      network acquiring and infrastructure, showing principal modules and dependencies at each level.
    data:
      layers:
        - id: merchant-api
          label: Merchant API & SDK Layer
          detail: >
            Unified RESTful API; webhook event system; SDKs in Python, Node.js, .NET, Java, Go, iOS Frames, Android
            Frames; developer portal at developer.checkout.com; api-reference.checkout.com
        - id: intelligent-acceptance
          label: Intelligent Acceptance Engine
          detail: >
            87M daily optimisation decisions; ML routing; smart retry logic; network token optimiser; 3DS challenge
            intelligence; avg +3.8 pp acceptance lift; agentic commerce layer (2026 roadmap)
        - id: value-added-services
          label: Value-Added Services Layer
          detail: >
            Fraud Detection Pro (ML risk scoring; MRC-integrated); Flow (hosted checkout UI; SAP OPF-integrated Mar
            2026); Card Issuing (Visa UK/EEA; $5B ann. run rate); Network Tokens; Payouts (multi-rail SEPA/FPS/SWIFT)
        - id: direct-acquiring
          label: Direct Acquiring Core
          detail: >
            FCA-licensed UK acquiring (Checkout Ltd); Georgia MALPB charter (approved Jan 2026); direct
            Visa/Mastercard/Amex membership; 150+ currencies; 50+ countries
        - id: apm-cloud-infra
          label: APM Network & Cloud Infrastructure
          detail: >
            50+ APMs (wallets, BNPL, real-time schemes); Microsoft Azure multi-region cloud (multi-year partnership Oct
            2025); 99.999% uptime SLA target; PCI DSS Level 1 / ISO 27001 / SOC 2 Type II environment
        - id: trust-control
          label: Trust / Controls / Observability Layer
          detail: >-
            Status portal, audit logging, support tooling, identity verification, privacy controls, and merchant-facing
            monitoring that make the platform deployable at enterprise scale.
