      - number: '2.3'
        title: Buyer and Segment Map
        blocks:
          - type: paragraph
            body: >
              Checkout.com's target buyer is the payments or treasury executive at a large enterprise merchant —
              typically a VP of Payments, CFO, or CTO, often supported by a vendor evaluation team including IT
              security, legal, and finance. Decision cycles are long (6–18 months) and switching is costly (API
              integration, merchant testing, regulatory compliance). The primary verticals served include e-commerce and
              marketplaces (eBay), mobility and ride-hailing (Uber), digital subscriptions and streaming (Spotify),
              social commerce (Pinterest), and digital services. By geography, Checkout.com's primary deployment is in
              Europe (UK-headquartered, FCA-licensed) and growing rapidly in North America (US volumes >70% growth in
              2025, Canada direct acquiring launched 2025). Asia-Pacific, Latin America (Sao Paulo hub), Middle East,
              and Japan represent growth adjacencies. The "Billion Dollar Club" of 63 merchants represents the top tier
              of Checkout.com's buyer pyramid — each processing >$1B through the platform annually, up from 39 in 2024,
              demonstrating both merchant spend growth and net new enterprise wins. The buyer's primary decision
              criteria are: acceptance rate (measured by Intelligent Acceptance's average 3.8% improvement), platform
              uptime (99.999%), local acquiring coverage, fraud/chargeback management, and total cost of processing.
            claimRefs:
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM016
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: AI-Powered Acceptance Optimisation Transforms the Market's Revenue Equation
            body: >
              Traditional payment processing competed on price (basis points) and reliability. Checkout.com's
              Intelligent Acceptance — delivering 87M daily optimisations and $15B+ in additional merchant revenue since
              June 2023 — represents a qualitative shift: payment infrastructure that generates measurable merchant ROI
              above the base fee. An average 3.8% acceptance rate improvement at a merchant processing $1B annually
              translates to $38M in additional revenue captured, making Checkout.com's contract a revenue-positive
              investment rather than a cost. This reframes the buyer conversation from "cheapest processor" to "highest
              ROI processor" and justifies premium pricing — a structural competitive advantage.
            calloutType: insight
            claimRefs:
              - CM015
          - type: callout
            title: TAM Opacity Creates Significant Sizing Risk
            body: >
              The enterprise payment processing market lacks a single credible authoritative sizing study. Range
              estimates vary by 5–10× depending on scope, take-rate assumptions, and geographic coverage. Checkout.com
              does not disclose revenue, preventing independent verification of its take rate, gross margin, or market
              share. This opacity makes it impossible to determine whether Checkout.com is growing market share or
              simply riding macro e-commerce tailwinds. Any DCF or multiple-based valuation should stress-test market
              size assumptions across the full range of plausible estimates.
            calloutType: risk
            claimRefs:
              - CM008
              - CM011
              - CM013
              - CM014
          - type: callout
            title: Pricing Pressure and Interchange Regulation Compress Base Acquiring Margins
            body: >
              EU interchange fee regulation (0.2% consumer debit, 0.3% consumer credit cap) and ongoing US regulatory
              scrutiny compress base acquiring fee economics. This structural headwind means growth in processing volume
              does not translate linearly to revenue or margin improvement. Checkout.com's value-added services
              (Intelligent Acceptance, fraud detection, card issuing) are the primary margin defense — but these are
              also the most contested battlegrounds, with Adyen, Stripe, and bank processors all investing in similar
              capabilities.
            calloutType: risk
            claimRefs:
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >
              Checkout.com competes against a tiered set of alternatives across three competitive dimensions: direct
              peers offering comparable full-stack enterprise acquiring and payment processing; incumbent bank
              processors delivering bundled bank-relationship pricing; and adjacent or substitute solutions including
              developer-focused gateways, niche verticalists, and internal-build options at the largest merchant tier.

              Adyen (Euronext: ADYEN) is the most direct peer — a public enterprise-only processor that processed
              approximately €1.35 trillion in volume in 2024 and earned approximately €1.83 billion in net revenue,
              implying a blended take rate of around 0.13–0.15%. With over 3,800 employees and direct-acquiring
              operations in 36+ markets since 2006, Adyen has greater operating history, public disclosure transparency,
              and market-capitalisation credibility than Checkout.com. Stripe (private, ~$65B secondary-market
              valuation) is the largest developer-ecosystem player, processing an estimated $1 trillion annually and
              offering the broadest product suite in the market. Worldpay, acquired by GTCR from FIS in 2023 for
              approximately $18 billion, is the largest processor by volume ($2T+) but is hampered by legacy
              infrastructure and technology debt.

              Braintree (PayPal), JPMorgan Payments, and Nuvei complete the competitive set with differentiated product
              emphasis and distinct ICP focus. Status-quo substitutes — in-house bank acquiring relationships with
              Barclays, Lloyds, or Chase — remain viable for UK/US-centric merchants. Internal build is possible for
              mega-merchants such as Amazon, but requires $100M+ in investment and multi-year regulatory approvals,
              constraining competitive pressure to the top-10 global merchants only. Big Tech payments (Google Pay,
              Apple Pay) operate at the wallet and consumer layer rather than the direct acquiring layer, making them
              complementary rather than substitutes for Checkout.com's core acquiring product.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP009
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP009
              - CP015
      - number: '3.2'
        title: Feature and Capability Comparison
        blocks:
          - type: paragraph
            body: >
              Across the five principal buying criteria — AI acceptance optimisation, direct acquiring infrastructure,
              alternative payment method (APM) breadth, card issuing, and developer experience — Checkout.com holds
              first-mover positions in AI acceptance and US direct acquiring (MALPB), but faces credible competition on
              all five dimensions.

              AI acceptance is the most debated differentiator. Checkout.com's Intelligent Acceptance product reports an
              average +3.8 percentage point improvement in card acceptance rates by routing transactions through the
              optimal acquiring path using models trained on $300 billion in annual volume. Adyen's "Uplift" and
              "Optimum Authorisation" products, plus Stripe's "Adaptive Acceptance," are the primary competitive
              responses — both launched or significantly expanded in 2024 — and are closing the gap. The estimated lead
              for Checkout.com is 12–18 months as of early 2026. APM coverage favours Adyen (200+ methods) by breadth,
              but Checkout.com by recent growth rate (104% APM volume growth in 2025 on 50+ methods), suggesting
              Checkout.com is deepening integrations in APAC and MENA rather than simply adding breadth.

              Direct acquiring infrastructure is a harder moat to replicate. Adyen built its direct- acquiring network
              over 18 years. Checkout.com is accelerating with the Georgia MALPB charter (approved January 2026), which
              removes the bank-sponsor intermediary for US card settlement — a structural advantage not yet replicated
              by Stripe or Braintree. Developer experience remains Stripe's most durable competitive moat;
              Checkout.com's SDK breadth (50+ across iOS, Android, and web, including the Frames card component) is
              competitive but does not match Stripe's documentation depth and developer community engagement.
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP011
              - CP012
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP005
              - CP008
              - CP011
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP008
              - CP011
              - CP016
      - number: '3.3'
        title: Pricing and Distribution Dynamics
        blocks:
          - type: paragraph
            body: >
              No major payment processor in Checkout.com's competitive tier — including Adyen, Stripe, Worldpay,
              Braintree, or JPMorgan — publicly discloses enterprise pricing. All enterprise contracts are
              custom-negotiated, volume-tiered arrangements that bundle acquiring fees, gateway fees, and value-added
              service charges. Published list pricing (Stripe's 2.9%+$0.30 and Braintree/PayPal's 2.59%+$0.49) applies
              to SMB and retail customers only and is not representative of enterprise contracts.

              Based on public company disclosures, Adyen's blended take rate is approximately 0.13–0.15% of volume,
              reflecting its enterprise-only mandate and relatively lower value-added service attachment. Checkout.com's
              estimated take rate of 0.20–0.30% (derived from publicly disclosed volume of $300B and an estimated
              revenue run rate of $600M–$900M) implies higher per-unit value extraction from AI acceptance value-adds,
              APM fees, and issuing products. Stripe's effective blended rate is higher (approximately 0.4–0.5%) due to
              its SMB and mid-market volume mix, but enterprise-specific pricing converges with Adyen and Checkout.com.

              GTM motion differentiation is meaningful. Checkout.com uses a direct enterprise sales model with dedicated
              merchant success managers — similar to Adyen's model. Stripe uses a product-led growth funnel that
              converts developer adoption to enterprise accounts. JPMorgan bundles payment services into broader banking
              relationships, lowering the marginal payment price but increasing bank-relationship dependency. Worldpay's
              legacy reseller and bank-channel distribution is its primary market access mechanism, less relevant for
              API-first enterprise merchants seeking modern integration stacks.
            claimRefs:
              - CP007
              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP010
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: AI Acceptance Is the Key Competitive Battleground
            body: >
              Checkout.com's Intelligent Acceptance (+3.8% average acceptance rate improvement, $15B+ merchant value
              unlocked) is its highest-ROI differentiator and the primary reason Adyen and Stripe launched competing AI
              acceptance products in 2024. The estimated 12-18 month lead is real but narrowing; the durability of this
              moat depends on Checkout.com maintaining volume growth above roughly 20% annually to expand training-data
              advantage and continuing model investment ahead of Adyen's larger engineering organisation.
            calloutType: insight
            claimRefs:
              - CP012
          - type: callout
            title: Valuation Reset Creates Structural Competitive Disadvantage
            body: >
              Checkout.com's 70% valuation decline from $40B (2022) to $12B (Sept 2025) creates a structural
              disadvantage in talent competition, vendor-pricing negotiation, and CFO-level deal credibility versus
              Adyen (€35-45B public market cap). Reuters and multiple financial outlets reported the decline, and
              without revenue disclosure to calibrate valuation multiples, Checkout.com cannot rebut adverse
              comparisons. Any investment or acquisition discussion must account for this signal alongside the founder's
              relocation to Monaco reported by CityAM.
            calloutType: risk
            claimRefs:
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Streams
        blocks:
          - type: paragraph
            body: >
              Checkout.com generates revenue across six principal streams, all tied to payment activity volume or
              value-added service utilisation. The dominant stream is payment acquiring fees, charged as a small
              percentage of gross transaction value (GTV) where Checkout.com acts as the principal acquirer or acquiring
              network agent for a merchant. Based on $300B+ in total payment volume (TPV) disclosed for 2025 and an
              estimated blended take rate of 0.20-0.30% derived from analyst consensus, gross acquiring revenue likely
              falls in the range of $600M-$900M, though the company has never disclosed this figure.

              The second stream is the payment gateway and processing API, which charges per-transaction or per-API-call
              fees for authorisation, tokenisation, and routing services. Third, value-added services — Intelligent
              Acceptance, Fraud Detection Pro, Network Tokens, and Flow checkout — generate incremental revenue as
              separately licensed enterprise products atop core acquiring. Fourth, card issuing, conducted in
              partnership with Visa for B2B virtual and physical cards, reached a $5B annualised run rate in Q4 2025.
              Fifth, payouts (disbursements to marketplace sellers, gig-economy workers, and cross-border recipients)
              form a payout-as-a-service fee line. Sixth, FX conversion on cross-border transactions generates spread
              revenue where Checkout.com holds currency risk between settlement and payout.

              Revenue recognition follows the principal-agent framework: where Checkout.com is the principal acquirer it
              recognises gross revenue before interchange pass-through; where it acts as gateway-only it recognises net
              gateway fees only. The split between principal and net revenue is not publicly disclosed, creating
              material uncertainty for gross margin and revenue quality analysis. The Black Friday and Cyber Monday 2025
              period processed $5.2B in 24 hours with approximately 100M transactions, demonstrating peak processing
              capacity.
