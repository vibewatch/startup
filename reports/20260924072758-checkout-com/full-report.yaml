            title: Sponsor-Bank-Free Direct Acquiring in UK and US
            body: >
              Direct Visa, Mastercard, and Amex network membership eliminates the sponsor bank layer for UK
              (FCA-licensed) and US (MALPB-chartered) acquiring, removing an intermediary cost and counterparty risk
              that constrains gateway-only PSP competitors. The January 2026 US MALPB approval converts what was
              previously a structural competitive disadvantage in North America into a cost and independence advantage
              as it operationalises.
            calloutType: insight
            claimRefs:
              - CE015
          - type: callout
            title: ShinyHunters Breach Remediation Not Publicly Confirmed
            body: >
              The legacy cloud storage incident identified by the ShinyHunters group circa 2021 remains partially open:
              no public post-incident remediation report has been published and no timeline for full closure has been
              confirmed as of May 2026. While the CTO's assurance of no card data or funds exposure is on record,
              enterprise procurement teams and FCA supervisors typically require documented incident-closure
              certification for ongoing compliance sign-off.
            calloutType: insight
            claimRefs:
              - CE013
          - type: callout
            title: Multi-Year Azure Cloud Vendor Lock-In
            body: >
              The October 2025 multi-year Azure partnership creates a single-vendor cloud dependency with limited
              near-term portability. A major Azure regional outage or pricing renegotiation would have direct platform
              availability and cost implications. Multi-cloud or hybrid redundancy has not been publicly disclosed as
              part of the architecture.
            calloutType: insight
            claimRefs:
              - CE010
          - type: callout
            title: 'Agentic Commerce: First-Mover Positioning in AI-Native Payments'
            body: >
              Checkout.com's 2026 agentic commerce initiative — AI agents completing payment sequences on behalf of
              consumer-authorised AI actors — is the earliest explicit product commitment to this payment paradigm from
              a major PSP. If agent-to-agent commerce materialises at scale, Checkout.com's head start in building the
              infrastructure and merchant relationships for AI-native checkout could become a category-defining moat.
            calloutType: insight
            claimRefs:
