      - number: '8.2'
        title: Financial Scenarios and Valuation
        blocks:
          - type: paragraph
            body: >
              Checkout.com's financial scenario analysis is anchored by three verifiable inputs: $300B+ total payment
              volume in 2025 (up 64% YoY per BusinessWire announcement February 2026), net revenue growth exceeding 30%
              year-on-year for the second consecutive year, and the first full-year adjusted EBITDA profit margin above
              10%. These metrics derive from company press releases and have not been independently audited; the absence
              of consolidated group accounts from the Jersey parent remains a blocking diligence gap for any committed
              capital.

              At the $12B secondary implied valuation (September 2025 employee buyback), the implied revenue multiple is
              approximately 8x the estimated FY2025 net revenue of $520–600M (derived from >30% growth on an estimated
              $400M 2024 base). This multiple is consistent with Adyen's public trading multiple and represents a
              normalisation from the 40–60x revenue multiple implied at the $40B January 2022 peak — when fintech
              multiples globally were at all-time highs and Checkout.com had not yet demonstrated sustained
              profitability. The current valuation therefore reflects a fundamental re-rating that has reset
              expectations to operationally supportable levels.

              The bull case (3-year horizon, probability 20–30%) requires US MALPB volume to accelerate past 100% growth
              through 2026–27, card issuing ARR to scale from $5B to $15–20B, and a successful IPO or strategic
              acquisition at 10x forward revenue — implying an enterprise value of $25–35B. The base case (probability
              40–50%) assumes continuation of current trajectory: 25–35% revenue growth, 12–15% EBITDA margin, TPV
              reaching $400B+ by 2027, and a late-stage PE or continuation round at $16–22B. The bear case (probability
              20–30%) sees US MALPB underperform, Adyen and Stripe take enterprise share, revenue growth decelerate to
              below 15%, and a secondary repricing to $4–9B driven by further institutional mark-downs or a governor
              trigger event (FCA action, Pousaz departure, or Azure outage).

              The valuation sensitivity is principally driven by the US direct acquiring ramp: every 10% acceleration in
              US TPV growth adds approximately $1–2B to the 3-year exit value in the base case. Card issuing runway is
              the second-highest swing factor, as a $20B ARR issuing business would justify a meaningfully higher
              multiple than the current acquiring-dominant revenue mix. The EBITDA margin path matters less in absolute
              terms at the current scale — the market will value this business on a revenue or TPV multiple until it
              demonstrates $500M+ EBITDA — but crossing 15% adj. EBITDA margin would significantly de-risk a 2027 IPO
              narrative.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV013
      - number: '8.3'
        title: Comparable Company Analysis
        blocks:
          - type: paragraph
            body: >
              The most relevant public comparable for Checkout.com is Adyen, which operates a near-identical
              direct-acquiring model for enterprise merchants, is European-headquartered, and processes a similar TPV
              range. As of Q1 2026, Adyen trades at approximately $42B (€38B) market capitalisation, implying roughly 8x
              trailing revenue and 3.5% P/TPV on an estimated $1.2T annual TPV. At $12B on $300B TPV, Checkout.com
              trades at 4.0% P/TPV — a slight premium to Adyen's P/TPV ratio but at the same revenue multiple,
              reflecting higher TPV growth (64% vs Adyen's ~20–25%) offset by smaller absolute scale and less liquidity.
              The Adyen comparison supports the view that $12B is a fair-to- attractive entry point, not a stretched
              valuation.

              Stripe, valued at approximately $65B in its last known institutional round (Series I, 2023), is a partial
              comparable: it operates a developer-first aggregator model with broader SaaS components and serves a wider
              market segment including SMB. The $65B valuation implies approximately 12x estimated revenue, a premium to
              both Adyen and Checkout.com that reflects Stripe's product breadth and higher growth expectations.
              Stripe's higher revenue multiple does not support upward re-rating of Checkout.com without a corresponding
              expansion of the business model beyond pure acquiring.

              PayPal, Worldpay, Nuvei, and Klarna round out the comparable set with varying degrees of relevance.
              PayPal's depressed 2.5x revenue multiple and 0.7% P/TPV reflect mature growth and a consumer/SMB mix that
              Checkout.com does not share. Worldpay (PE-backed, ~$18B post-FIS sale) and Nuvei (go-private, ~$6.5B)
              represent the lower end of the enterprise acquiring spectrum — useful anchors for downside scenario
              pricing. Klarna's ~$15B BNPL valuation provides a European fintech frame but is structurally distinct. The
              overall peer set suggests that Checkout.com at $12B is trading at or below the lower end of its natural
              comparable range when adjusted for growth premium.
            claimRefs:
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Conditional Buy at Sub-$15B — Asymmetric Entry Point After a 70% Re-Rating
            body: >
              Checkout.com at $12B secondary implied valuation represents the most attractive entry point the asset has
              offered since its pre-2021 growth phase. The 70% decline from the $40B January 2022 peak has reset the
              valuation to operationally defensible levels: 4.0% P/TPV is approximately peer-inline with Adyen's 3.5%,
              and 8x estimated revenue is consistent with public enterprise payment processing multiples. The underlying
              business has not deteriorated — it has materially improved. Revenue grew more than 30% year-on-year for
              the second consecutive year. The company achieved first full-year adj. EBITDA profitability. The MALPB
              bank charter was approved in January 2026. The Forrester Wave named it a Leader in Q1 2026. The bull case
              requires three specific catalysts: US MALPB volume acceleration, card issuing ARR scaling to $15–20B, and
              an IPO or strategic acquisition by 2027–2028. The base case requires none — it requires only that
              Checkout.com continues growing at its current trajectory. The conditional element is the governance gap:
              100% founder control and no succession plan are unacceptable for a $12B investment without pre-closing
              remediation.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
          - type: callout
            title: The Anti-Thesis Is Structural, Not Cyclical — Four Years Without Institutional Price Discovery
            body: >
              The most serious element of the Checkout.com anti-thesis is not the 70% valuation decline per se — that
              reflects a market-wide fintech re-rating that hit every company from Stripe to Klarna. The serious risk is
              structural: the last institutional capital raise was January 2022, four years before the current analysis
              date. The only valuation mark since then is the September 2025 employee share buyback — a transaction type
              that does not require independent third-party valuation, does not involve external investors conducting
              diligence, and is not a market-clearing price. This means that $12B is a reasonable internal reference
              point but is not independently verified institutional capital. A fresh primary round or public S-1 filing
              is the only path to converting the current implicit valuation into a credible market price. Until then,
              any investment is based on the buyer's own analysis without a recent institutional comparator. This is a
              legitimate risk that must be reflected in both the entry price and the required evidence standard:
              consolidated audited accounts are not optional.
            calloutType: risk
            claimRefs:
              - CV003
              - CV008
              - CV010
          - type: callout
            title: Three Exit Paths, One Required Catalyst — IPO Is the Preferred but Not the Only Route
            body: >
              Checkout.com's exit readiness presents three viable paths over a 3–5 year horizon. The IPO path
              (preferred, highest multiple) requires: a public S-1 filing on NYSE or LSE, a demonstrated 2–3 year
              public-quality financial audit trail, an independent board meeting institutional governance standards, and
              a 2027–2028 IPO window that is currently not confirmed. The strategic acquisition path (alternative,
              possible premium) would require a Visa, Mastercard, JPMC, or major bank holding company to identify
              Checkout.com as a direct-acquiring-platform acquisition target — plausible given the MALPB charter and
              $300B TPV scale, but not in any public pipeline as of May 2026. The PE continuation round path (base case
              fallback) involves a late-stage private equity sponsor (Advent, GTCR, Thoma Bravo-equivalent) taking a
              minority or controlling stake at $16–22B — a proven path for payment processors (see Worldpay/GTCR,
              Nuvei/Advent). Of these three, only the PE continuation requires no IPO readiness and no strategic buyer
              interest; it is therefore the most robustly de-risked exit path under the base case assumptions.
            calloutType: insight
            claimRefs:
              - CV011
