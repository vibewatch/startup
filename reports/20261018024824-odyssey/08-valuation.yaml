      - [Confidence, medium, Core judgment is stable but bounded by missing private-company operating data.]
      - [Risk rating, high, Commercialization length and competition can still compress the next round.]
      - [Valuation stance, stretched, The latest mark is supported by frontier potential more than disclosed economics.]
      - [Target return / exit, Not supportable publicly, Revisit only after monetization proof or a materially better entry price.]
    notes: >-
      Decision rows synthesize public evidence as of 2026-10-18; missing revenue, customer, and preference disclosure
      is treated as a material evidence gap rather than as zero.
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV009
      - CV012
      - CV013
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Current evidence
      - What would change the view
    rows:
      - ["Thesis: frontier technical proof", "Odyssey has shipped a visible sequence of world-model milestones and official materials position one shared model across multiple physical-AI workloads.", "Upgrade if disclosed customer adoption converts research pace into commercial proof."]
      - ["Thesis: elite strategic backing", "The Series B, Natural Capital lead, and AWS preferred-cloud / Trainium relationship create financing durability and infrastructure support.", "Upgrade if AWS economics show measurable cost or distribution leverage rather than narrative alignment."]
      - ["Anti-thesis: price opacity", "Public sources disclose the round but not ARR, customer count, gross margin, or EV/Revenue multiples.", "Upgrade only after management shares monetization and unit-economics evidence."]
      - ["Anti-thesis: timing and competition", "Adverse coverage highlights 7-10 year commercialization risk plus open-source and hyperscaler competition.", "Downgrade if the next round is flat-to-down or if product momentum stops producing customer proof."]
    notes: >-
      Arguments separate company quality from price support; the rightmost column lists concrete diligence or valuation
      conditions that would move the recommendation.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV008
      - CV010
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - [Bull, AWS/Trainium produces real cost leverage and Odyssey turns research cadence into disclosed customer traction, '>$2.5B next mark or equivalent strategic outcome; upside requires multiple expansion plus commercial proof', Strategic partners deepen and new financing clears above the 2026 Series B with cleaner disclosure, Fails if commercial proof remains absent despite continued product releases]
      - [Base, Technical lead persists but commercial disclosure stays limited and value compounds mainly through credibility, '$1.45B-$2.5B range; modest step-up from the last round rather than a re-rating', Follow-on investors accept frontier scarcity but still demand more operating proof, Breaks if the next round introduces harsher structure or delayed adoption]
      - [Bear, Monetization slips while competitor and open-source pressure rise and preference terms matter more, '<$1.45B or flat-to-down financing; downside driven by opacity and slower proof conversion', New money prices risk before revenue traction is visible, Any evidence of weak AWS economics or a structured round accelerates this case]
    notes: >-
      These are directional scenario ranges anchored on the last disclosed post-money valuation and peer-financing
      references; they are not revenue-multiple outputs because public revenue and margin data were not disclosed.
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
      - CV013
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation remains gated by commercial proof and structure disclosure, not by lack of technical ambition.
    data:
      nodes:
        - id: proof
          label: Technical proof
          detail: Shipping cadence from Odyssey-2 Max through PROWL suggests frontier research progress.
          tone: positive
        - id: sponsor
          label: Strategic sponsorship
          detail: $310M funding and the AWS preferred-cloud / Trainium tie-up improve durability.
          tone: positive
        - id: market
          label: Large option value
          detail: Official positioning spans robots, cars, drones, games, and science.
          tone: opportunity
        - id: opacity
          label: Commercial proof gap
          detail: Public evidence does not disclose ARR, customer count, gross margin, or EV/Revenue.
          tone: warning
        - id: downside
          label: Downside pressure
          detail: Commercialization may take years and open-source or hyperscaler pressure can compress pricing.
          tone: adverse
        - id: decision
          label: Recommendation
          detail: Maintain research-more and stretched until monetization proof or a better entry point appears.
          tone: neutral
      edges:
        - from: proof
          to: sponsor
          label: attracts capital
        - from: sponsor
          to: market
          label: expands ambition
        - from: market
          to: opacity
          label: but proof lags
        - from: opacity
          to: downside
          label: raises underwriting risk
        - from: downside
          to: decision
          label: therefore
    approximationNotes: >-
      The flow is qualitative and ordered by underwriting logic; it does not imply fixed probability weights.
    claimRefs:
      - CV003
      - CV004
      - CV008
      - CV010
      - CV012
      - CV013
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Keep Odyssey in research-more until management shows paying-customer, revenue, margin, and preference-term
      evidence that lets investors underwrite more than frontier scarcity.
    claimRefs:
      - CV012
      - CV013
  - calloutType: risk
    title: Thesis-break triggers
    body: >-
      A flat-to-down next round, non-durable AWS economics, or continued absence of commercial disclosure after further
      product launches would move the current stretched view closer to an avoid.
    claimRefs:
      - CV008
      - CV010
      - CV013
