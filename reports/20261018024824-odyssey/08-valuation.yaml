  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: preference-overhang
      missingEvidence: Exact cap-table dilution, board rights, and liquidation-preference terms for the June 2026 Series B.
      whyItMatters: These terms determine whether a flat headline valuation still embeds investor-friendly downside protection that weakens common-share underwriting.
      diligencePath: Request the full financing deck, post-money cap table, board composition, and final Series B term sheet from management or lead investors.
      relatedQuestionRefs: [QV002]
    - type: private-evidence-only
      severity: material
      topic: monetization-proof
      missingEvidence: Current ARR or recognized revenue, paying-customer count, gross margin trajectory, and any disclosed contract concentration.
      whyItMatters: Without commercial proof, the current mark is anchored more by frontier scarcity and sponsor quality than by repeatable economic performance.
      diligencePath: Ask management for cohort-level bookings, revenue recognition, gross-margin bridges, and named customer references tied to active production usage.
      relatedQuestionRefs: [QV005, QV008]
    - type: missing-source
      severity: material
      topic: aws-economics
      missingEvidence: Minimum commitments, Trainium pricing, revenue-sharing, and go-to-market economics under the AWS relationship.
      whyItMatters: The bull case assumes infrastructure leverage, but the public record currently proves the partnership exists more than it proves durable cost or distribution advantage.
      diligencePath: Obtain the commercial agreement summary, compute-pricing benchmarks, and any joint-pipeline metrics from Odyssey and AWS.
      relatedQuestionRefs: [QV006]
