  summary: >-
    Odyssey 是一家位于 Palo Alto、聚焦物理 AI 和世界模型的公司，由拥有自动驾驶经验的创始人带领。本次更新显示，公司的产品迭代节奏更有证据支撑，并完成了 $310M 的 Series B，估值 $1.45B，同时与
    AWS/Trainium 建立了合作关系；但公开披露仍未达到可验证的收入、客户数、董事会和完整融资条款细节。
