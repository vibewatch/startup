  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发条件
    rows:
      - - 乐观
        - AWS/Trainium 产生实际成本杠杆，Odyssey 将研发节奏转化为已披露的客户增长
        - 下一轮估值超过 $2.5B，或实现等价的战略结果；上行空间需要倍数扩张加商业证明
        - 战略合作伙伴加深关系，新融资以高于 2026 Series B 的估值完成，且披露更清晰
        - 即使产品持续发布，商业证明仍缺失则该情景失效
      - - 基准
        - 技术领先地位仍在，但商业披露有限，价值主要靠可信度积累
        - $1.45B-$2.5B 区间；相比上一轮小幅上调，而非估值重估
        - 后续投资者接受前沿稀缺性，但仍要求更多运营层面的证明
        - 若下一轮引入更严苛的条款或采用延迟，这一情景就会失效
      - - 悲观情景
        - 变现放缓，竞争者和开源压力上升，优先权条款的重要性增加
        - <$1.45B 或融资持平至下行；下行压力来自不透明度和更慢的证明转化
        - 在收入牵引力显现前，新资金就先按风险定价
        - 任何 AWS 经济性疲弱或出现结构化融资的证据，都会加速这一情景
    notes: 这些是以最近一次披露的投后估值和同业融资参考为锚的方向性情景区间；由于公开收入和利润率数据未披露， 它们不是收入倍数推导结果。
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV009
      - CV010
      - CV012
      - CV013
