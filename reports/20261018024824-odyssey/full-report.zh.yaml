          tone: neutral
          claimRefs:
            - CO006
        - date: '2026-06-17'
          label: B 轮重新定价
          detail: Odyssey 宣布完成 $310 million 的 B 轮融资，估值为 $1.45 billion，由 Natural Capital 领投。
          tone: positive
          claimRefs:
            - CO005
        - date: '2026-06-17'
          label: 披露 AWS / Trainium 合作
