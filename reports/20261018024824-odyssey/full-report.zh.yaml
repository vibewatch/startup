  - id: FE001
    title: 产品架构图
    type: stack
    summary: 所分配的公开证据显示，这是一套从垂直用例向下延伸至骨干、控制适配和算力基础设施的分层技术栈。
    data:
      layers:
        - label: 垂直工作流
          modules:
            - 机器人
            - 自动驾驶
            - 游戏 / 交互媒体
            - 科学和国防仿真
        - label: 面向用户的交付界面
          modules:
            - 交互式演示
            - Odyssey-3 Flash 研究预览
            - World Model API
            - JavaScript SDK
            - Python SDK
        - label: 模型家族
          modules:
            - Odyssey-2
            - Odyssey-2 Pro
            - Odyssey-2 Max
            - Odyssey-3
            - Explorer
        - label: 控制适配层
          detail: 一个共享的预训练骨干通过小型任务策略或动作解码器，适配机械臂、人形机器人、汽车、无人机和游戏控制。
        - label: 算力和优化
          modules:
            - AWS 首选云
            - Trainium 芯片
            - 与 Annapurna Labs 合作
        - label: 开发工作流
          outputs:
            - 研究小组
            - 训练管线
            - 评估管线
            - 实时项目配员
    approximationNotes: 图示根据所分配的 2026 年 10 月来源抽象出公开的产品与运营技术栈；不是逆向工程得到的系统图。
    claimRefs:
      - CE001
      - CE004
      - CE008
      - CE009
      - CE013
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Odyssey 的公开路径从研究认知进入预览评估、直接咨询、设计合作伙伴工作和 AWS 协助扩张，而不是已披露的 在点名客户账户内落地并扩张。
    data:
      items:
        - label: 世界模型认知
          actor: 研究和应用 AI 负责人
          stage: 认知
          channels:
            - 科技和投资者报道
            - 机器人与仿真讨论
          touchpoints:
            - B 轮和世界模型类别报道
            - 机器人、游戏、科学和国防领域的用例框架
          tone: neutral
        - label: 自助研究预览
          actor: 研究人员和开发者
          stage: 评估
          channels:
            - 浏览器体验
          touchpoints:
            - Odyssey-3 在 experience.odyssey.systems 上的预览
            - 浏览器使用无需 API 密钥
          tone: opportunity
        - label: 辅助式企业咨询
          actor: 商业评估者
          stage: 资格评估
          channels:
            - 直销 / 联系流程
          touchpoints:
            - 用于开发者 API 访问的独立联系表单
            - 人工转化路径，而非自助结账
          tone: warning
        - label: 设计合作伙伴验证
          actor: 未点名的机器人与仿真合作伙伴
          stage: 试点
          channels:
            - 共同设计与合作伙伴评估
          touchpoints:
            - 提及了设计合作伙伴，但未公开点名
            - 在获得参考客户前，用现场演示展示能力
          tone: neutral
        - label: 真实用户和活动使用
          actor: 参与者和早期用户
          stage: 早期使用
          channels:
            - RAAIS 现场演示
            - 内部已交付系统
          touchpoints:
            - 参会者实时加入 Agora-1
            - 员工发帖称，已交付系统正在被真实用户使用
          tone: neutral
        - label: AWS 主导的扩张循环
          actor: Odyssey 加超大规模云厂商渠道
          stage: 扩张
          channels:
            - AWS 合作
            - Trainium 优化
          touchpoints:
            - 首选云地位
            - 联合市场进入以触达客户
          tone: risk
    approximationNotes: 该顺序反映保留来源所暗示的公开客户推进路径；Odyssey 未披露阶段转化率、成交周期或扩张百分比。
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU008
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余风险集中在算力集中度、商业化证明和运营披露缺失。
    data:
      columns:
        - 影响：中
        - 影响：高
        - 影响：关键
      rows:
