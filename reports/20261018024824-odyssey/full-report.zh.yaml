          - type: callout
            title: 披露不透明仍是闸门问题
            body: 保留的公开证据仍未验证收入、客户数、董事会结构或融资条款；即使是基本的外部画像数据，也存在相互冲突的成立年份，TFN 还质疑其人均资本密度。
            calloutType: risk
            claimRefs:
