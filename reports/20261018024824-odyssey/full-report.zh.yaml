        - 同行类别覆盖机器人、游戏和自主系统，但各领域覆盖披露不均
        - 通常更窄：创意视频或单一内部工作流
        - 如果一个模型要跨不同具身形态迁移，覆盖广度就很重要
      - - 多模态 / 声音落地
        - Starchild-1 增加实时多模态落地能力
        - 保留证据中的情况不一
        - 替代类产品通常视觉优先
        - 真实世界交互受益于不止图像预测的能力
      - - 公开商业可见度
        - API、Explorer 和流式传输界面均可见
        - 通常能看到融资项目，但不一定有客户或定价
        - 替代产品的认知度更高，但仿真范围并不等价
        - 商业可见度影响采购信心和销售周期速度
      - - 独立基准测试
        - 保留资料池中的证据有限
        - 品类内部不均衡
        - 不具可比性，因为替代类产品优化的是不同工作
        - 基准不透明会使护城河判断更难
      - - 部署依赖
        - AWS/Trainium 合作关系明确
        - 保留资料池中大多数同行的基础设施依赖尚不清晰
        - 内部技术栈依赖自有算力和人才；视频工具依赖供应商 API
        - 依赖关系会影响切换成本和议价能力
    notes: 标为不一或不清晰的单元格反映保留来源的限制，而不是隐藏的确定性；本矩阵比较资料池能够支持的内容，而不是客户部署中可能私下存在的内容。
