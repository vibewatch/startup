      - number: '8.2'
        title: 当前融资背景与可比参考
        blocks:
          - type: paragraph
            body: >-
              公开融资背景在 headline 条款上清晰，在投资判断深度上模糊。多份来源一致认为 Odyssey 于 2026 年 6 月以 $1.45B 估值完成 $310M Series
              B；第三方摘要则将累计融资额放在约 $337M-$338M，一家数据库列出本轮 $1.1B 投前 / $1.45B 投后估值。同一数据库明确称任何一轮都没有披露 EV/Rev，估值资料池中也没有保留来源用
              ARR、收入或客户数数据填补这一缺口。在同业框架上，Angel Investors Network 将 Odyssey 放在 AMI Labs 和 World Labs
              等规模更大的私人世界模型融资之下；这对可比背景有方向性帮助，却不足以证明 Odyssey 自身估值便宜。由于缺少公开二级市场价格，上一轮融资仍是唯一可见的参考点。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
      - number: '8.3'
        title: 乐观、基准与悲观框架
        blocks:
          - type: paragraph
            body: >-
              由于公开记录对最新融资条款的支撑强于对运营指标的支撑，情景框架应被视为方向性判断，而不是机械精确的模型。乐观情景取决于 AWS 和 Trainium 能否真正形成成本或 GTM 优势，以及 Odyssey
              能否把技术节奏转化为已披露的客户或收入。基准情景假设公司保住前沿可信度和融资获取能力，但商业信息仍不透明，使价值只能从 $1.45B
              估值缓慢累积。悲观情景聚焦于反向报道已经指出的风险：商业化周期漫长、开源或资本充足的竞争者施压，以及未来一轮融资中投资人比当前公开材料所允许的程度更激进地计入优先权悬垂。
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.4'
        title: 退出准备度、尽调要求与投资逻辑破坏触发点
        blocks:
          - type: paragraph
            body: >-
              从公开证据角度看，Odyssey
              尚未做好退出准备，因为从前沿研究到可投资商业企业的关键估值桥梁仍然缺失。支持者可以在私下作出投资判断，但外部投资人应把未披露的收入、客户集中度、毛利率和优先股条款视为尚未解决的尽调事项，而不是默认的积极因素。最清晰的升级路径很直接：管理层披露变现证明，AWS
              关系展现可量化的经济性而非叙事支持，新融资确认 2026 年 6 月估值并非周期高点。最清晰的投资逻辑破坏触发点是商业证明持续拖延、Trainium
              经济性被证明不可持续，或下一轮融资平价到下调且附带更重的结构性保护。
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: 在管理层展示付费客户、收入、利润率和优先权条款证据，使投资人能够对前沿稀缺性以外的内容作出投资判断之前，继续将 Odyssey 放在继续研究。
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV013
          - type: callout
            title: 投资逻辑破坏触发点
            body: 下一轮融资平价到下调、AWS 经济性不可持久，或产品进一步发布后商业披露仍持续缺失，都会让当前偏高的判断更接近回避。
            calloutType: risk
            claimRefs:
              - CV008
              - CV010
              - CV013
