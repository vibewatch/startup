        title: 展示项
        blocks:
          - type: callout
            title: 创始人与市场匹配加算力获取，是核心乐观情景
            body: Odyssey 把自动驾驶创始人履历、规模突出的 2026 年融资，以及明确的 AWS/Trainium 合作放在一起；这正是前沿仿真实验室快速持续交付研究成果所需要的组合。
            calloutType: strength
            claimRefs:
