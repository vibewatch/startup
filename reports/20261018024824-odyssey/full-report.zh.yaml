      - number: '4.2'
        title: 成本结构可能重算力且集中于合作伙伴
        blocks:
          - type: paragraph
            body: >-
              公开证据指向前沿模型经济性，却没有披露实际成本明细。Amazon 的 Ron Diamant 表示，世界模型需要“巨量算力吞吐和严格的延迟约束”；Odyssey 披露的 AWS/Trainium
              关系也足够深入，以至于 AlphaSignal 报道其还与 Annapurna Labs
              开展额外优化工作。这说明云端性能和供应能力是产品交付的核心，而不是普通的后台选择。与此同时，公开员工数代理值很小：Silicon Valley Investclub 列出约 55 名员工，Simplify
              显示公司规模为 51-200 人、六个月增长率为 0%、一年增长率为 -6%。这些不是经过审计的运营指标，但确实暗示这是一家资本密集型研究实验室，成本基础可能集中在算力和专业人才上，而不是广泛的 GTM
              规模。world-models.io 将 Odyssey-2 描述为独立基准测试有限的研究阶段产品，也进一步说明产品成熟度仍早于传统软件毛利模型的假设。
