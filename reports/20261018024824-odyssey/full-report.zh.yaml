      - number: '4.3'
        title: 这轮融资可能买来时间，但买不来可作投资判断的经济性
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，把 Odyssey 描述为“资金充足，足以继续验证模型”，比描述为“公开单位经济性已经清晰”更准确。相对于公司披露的规模代理值，$310M
              融资相当可观，应能为算力采购、模型训练和合作伙伴计划提供空间。但公开资料没有现金余额、烧钱速度、客户集中度、收入确认政策、毛利桥接，或合同层面的证据来说明 AWS 对毛利是增厚还是稀释。Air Street 提到
              Odyssey 仍在与设计合作伙伴合作、会在合适时机公布名称，world-models.io 也提示基准测试有限；两者都强化了这样一点：外部商业证明仍早于估值
              headline。因此，我对财务的判断是：融资获取能力积极，披露充分性消极；资本充足性看起来提高了，但收入质量和毛利持久性仍是尽调阻碍。
            claimRefs:
              - CI001
              - CI006
              - CI007
              - CI011
              - CI014
