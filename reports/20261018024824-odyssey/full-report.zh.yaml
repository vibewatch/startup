              预览版，机器人公司、游戏工作室、仿真工程师和自动驾驶系统开发者则反复被列为目标商业用户。这种广度在战略上有帮助，因为一套世界模型技术栈可以服务多个物理 AI
              工作流；但它也意味着公司尚未展示一个预算、部署节奏或续约行为都已披露的明确初始买方。最强的漏斗顶端证明是免费预览和现场演示，而不是具名企业账户。因此，相对于 $1.45B 估值，Odyssey
