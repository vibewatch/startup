          detail: world-models.io 发布的参考页面将 Odyssey-2 描述为因果自回归交互式视频世界模型，并仍将其标为研究阶段； 独立基准测试有限。
          tone: risk
          claimRefs:
            - CO016
        - date: 2026-02
