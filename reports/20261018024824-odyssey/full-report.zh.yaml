chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、边界，以及目前真正公开的信息
        blocks:
          - type: paragraph
            body: >-
              Odyssey 将自己定位为通用世界模型公司，而不是狭窄的视频工具供应商。保留的原始来源和公司发布的资料都一致将公司置于 Palo
              Alto，并描述其使命是构建能够在长时间尺度上预测并与物理世界互动的因果、多模态系统。指定资料池中最具体的商业描述来自当前的 AI Resident 招聘信息：Odyssey 销售 Explorer，可将一张
              2D 图片变成可互动的 3D 环境，通常通过授权或订阅提供。这让本次更新有了可用的产品和商业模式框架，但它仍是公司口径，而非独立客户验证。

              公开披露的模式和身份陈述同样重要。保留来源很容易披露估值、融资、投资人、办公室和研究里程碑，却没有披露确认收入、年经常性收入（ARR）、客户数、董事会构成或融资条款。因此，后续章节可以把本章当作可靠的身份和里程碑基线，但不能把它当作商业牵引力或治理成熟度的证明。
            claimRefs:
              - CO003
              - CO004
              - CO010
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO008
              - CO009
              - CO013
              - CO014
      - number: '1.2'
        title: 领导层集中既是资产，也是风险
        blocks:
          - type: paragraph
            body: >-
              对一家物理 AI 公司而言，这组创始人经历异常连贯。独立报道将 Oliver Cameron 和 Jeff Hawke 直接与 Voyage、Cruise 和 Wayve 的自动驾驶项目联系起来；这些经历是最贴近
              Odyssey 世界模型投资逻辑的相邻运营领域。这条履历让公司相较于普通 AI 媒体初创企业更容易获得技术层面的投资判断，也解释了投资人为何把团队视为前沿研究押注，而不是功能层应用公司。

              同一批证据也暴露出集中度风险。公开材料几乎都以创始人为中心，而本次更新保留的证据仍缺少完整的高管名单、董事会名单，或对上一份报告后领导层变化的充分说明。因此，本章可以支持创始人与市场匹配以及关键人物依赖的判断，却不能支持更广泛的治理深度。
            claimRefs:
              - CO001
              - CO002
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO013
      - number: '1.3'
        title: 2026 年 6 月融资重置了公司的规模
        blocks:
          - type: paragraph
            body: >-
              本次更新最清晰的变化是财务规模。多份保留来源一致显示，Odyssey 于 2026 年 6 月 17 日以 $1.45B 估值完成 $310M Series B，由 Natural Capital
              领投，Amazon、AMD Ventures、GV、EQT 和 In-Q-Tel 参与。独立报道还将本轮后的累计融资额定在约 $337M，因此 Odyssey 一步之间从相对小规模的 Series B
              前资本基础，进入了资本充裕得多的位置。

              新资本带来的不只是现金，还有战略信号。同一份公告让 AWS 成为 Odyssey 的首选云服务商，并将算力叙事从 Nvidia 转向 Trainium；TFN 还明确把这笔融资描述为市场上每名员工资本密度最高的
              AI 投资之一。因此，这轮融资既是实力信号，也是执行考验：它买来了现金跑道和基础设施，但也抬高了公开材料尚未提供的商业证据标准。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO007
              - CO012
              - CO013
      - number: '1.4'
        title: 研究节奏可见，商业证明不可见
        blocks:
          - type: paragraph
            body: >-
              Odyssey 已经让自己的研究叙事变得清晰。保留来源描述了从 Odyssey-2、Odyssey-2 Max 到 Starchild-1、Agora-1、PROWL，以及当前招聘信息中更晚的 Odyssey-3
              说法；这足以显示 2025 和 2026 年间持续的产品迭代。公司目前似乎还在三个办公室招聘，也进一步说明技术路线仍在推进，而不是停留在档案里。

              但这条时间线并不能证明客户采用、变现或治理质量。world-models.io 明确将 Odyssey-2
              标为研究阶段，且独立基准测试有限；指定资料池没有经过验证的客户或收入披露；一家声誉较低的外部数据库仍保留相互矛盾的成立年份。这些问题并不否定公司的势头，但会让本章继续落在技术进展加披露缺口上，而不是一份已经完成投资判断的运营画像。
            claimRefs:
              - CO009
              - CO011
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
