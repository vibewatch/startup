  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 该建议仍取决于商业证明和融资结构披露，而不是技术野心不足。
    data:
      nodes:
        - id: proof
          label: 技术证明
          detail: 从 Odyssey-2 Max 到 PROWL 的交付节奏，显示前沿研究仍在推进。
          tone: positive
        - id: sponsor
          label: 战略支持
          detail: $310M 融资以及 AWS 首选云 / Trainium 合作关系提升了持久性。
          tone: positive
        - id: market
          label: 巨大的期权价值
          detail: 官方定位覆盖机器人、汽车、无人机、游戏和科学。
          tone: opportunity
        - id: opacity
          label: 商业证明缺口
          detail: 公开证据未披露 ARR、客户数、毛利率或 EV/Revenue。
          tone: warning
        - id: downside
          label: 下行压力
          detail: 商业化可能需要数年，开源或超大规模云厂商的压力可能压低定价。
          tone: adverse
        - id: decision
          label: 建议
          detail: 在出现变现证明或更好的入场点前，维持“继续研究”和“估值偏高”的判断。
          tone: neutral
      edges:
        - from: proof
          to: sponsor
          label: 吸引资本
        - from: sponsor
          to: market
          label: 扩大野心
        - from: market
          to: opacity
          label: 但证明滞后
        - from: opacity
          to: downside
          label: 提高投资评估风险
        - from: downside
          to: decision
          label: 因此
    approximationNotes: 该流程是按投资评估逻辑排列的定性判断；不代表固定的概率权重。
    claimRefs:
      - CV003
      - CV004
      - CV008
      - CV010
      - CV012
      - CV013
