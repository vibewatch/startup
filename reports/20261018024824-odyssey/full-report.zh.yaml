  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 当前证据
      - 哪些变化会改变判断
    rows:
      - - 投资逻辑：前沿技术证明
        - Odyssey 已经交付一系列可见的世界模型里程碑，官方材料则把一个共享模型定位为服务多个物理 AI 工作负载。
        - 如果已披露的客户采用把研发节奏转化为商业证明，则上调判断。
      - - 投资逻辑：顶级战略支持
        - Series B、Natural Capital 领投，以及 AWS 首选云 / Trainium 关系，共同带来融资韧性和基础设施支持。
        - 如果 AWS 经济性显示出可量化的成本或分销杠杆，而不只是叙事上的一致，则上调判断。
      - - 反向逻辑：价格不透明
        - 公开来源披露了融资轮次，但没有披露 ARR、客户数、毛利率或 EV/Revenue 倍数。
        - 只有管理层分享变现和单位经济性证据后才上调判断。
      - - 反向逻辑：时点与竞争
        - 反向报道强调 7-10 年商业化风险，以及开源和超大规模云厂商竞争。
        - 如果下一轮持平或下调，或产品势头不再带来客户证明，则下调判断。
    notes: 论点将公司质量与价格支撑分开；最右列列出会改变建议的具体尽调或估值条件。
