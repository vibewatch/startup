  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与用户工作流
        blocks:
          - type: paragraph
            body: >
              公开证据显示，Odyssey 通过多个界面提供世界模型能力，而不是销售一个单一的巨型应用。ToolMage 描述了一个开发者 API，提供交互式流、可查看流和批量仿真，以及 JavaScript 和 Python
              SDK；Simplify 的公司画像还补充了 Explorer 产品，可将一张图片变成可互动的 3D 环境。YFarmX 还称，Odyssey 在 2026 年 10 月为 Odyssey-3 Flash
              开放了公开研究预览。从客户工作流看，当前产品路径似乎是：先测试交互式演示或预览，再把 API
              接入机器人、媒体或仿真工作流，最后针对具体环境或任务调整模型。仍然缺少的是一份权威的公开产品目录，清楚区分研究预览、高性能版本和普遍可用的商业 SKU。
