      - ["Task-specific policies / action decoders", "Translate shared representations into robot, vehicle, drone, or game controls", "Per-body demonstration data and evaluation loops", "Transfer story is promising but public benchmark coverage is thin"]
      - ["Delivery surfaces", "Expose capability through demo, preview, and API endpoints with SDKs", "Developer onboarding and support motion", "Public evidence does not verify enterprise support commitments"]
      - ["Compute and optimization stack", "Provide throughput and latency for training and serving", "AWS preferred-cloud relationship, Trainium, and Annapurna Labs collaboration", "Infrastructure concentration could shape cost, performance, and roadmap flexibility"]
    notes: "This architecture table summarizes only components explicitly described in the assigned sources; absent security, privacy, or uptime documentation is treated as a risk gap rather than reverse-inferred design detail."
    claimRefs: ["CE001", "CE004", "CE008", "CE013", "CE016"]
