      - Disclosed scale or funding
      - Target segment
      - Product scope
      - Differentiation signal
      - Limitation / competitive read
    rows:
      - [Odyssey, "$310M Series B at $1.45B valuation; ~$337M-$338M total funding", "Robotics, gaming, defense, science", "General-purpose world models, Explorer, API, real-time streaming", "Interactive causal simulation across multiple physical domains", "List pricing and broad customer density are not public"]
      - [Runway, "$315M Series E; $5.3B valuation; $40M ARR", "Creators and generative media", "World model product plus video generation", "Strongest public commercialization signal in retained peer set", "Evidence here points more to media/video than to broad physical-world control"]
      - [World Labs, "$230M raised", "Spatial AI / world-model buyers", "Marble product", "High-profile spatial/world-model entrant", "Retained pool does not show pricing or customer proof"]
      - [Decart.ai, "$300M raised at nearly $4B valuation", "World-model developers", "Lucy and Oasis world models", "Well-capitalized direct peer", "Retained pool does not show public benchmark or pricing detail"]
      - [AMI Labs, "$1.03B raised", "Frontier world-model research", "Training world models", "Very deep capital base", "Commercial packaging is unclear in retained evidence"]
      - ["Google DeepMind / Waymo", "No external commercial pricing disclosed in retained pool", "Autonomy and internal embodied-AI use", "Genie model used at Waymo", "Incumbent data, talent, and distribution advantages", "Not an open commercial alternative for most buyers"]
      - ["Internal build / status quo", "Engineering labor plus compute commitments", "Robotics, gaming, autonomy teams", "Custom engines and bespoke simulation stack", "Maximum control and workflow fit", "Requires expensive talent, infrastructure, and iteration speed"]
    notes: >-
      Peer scale comes from retained public reporting only; rows deliberately separate disclosed commercial proof from
      missing pricing or customer evidence rather than inferring parity across competitor classes.
    claimRefs: [CP004, CP006, CP007, CP012, CP013]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Odyssey
      - Frontier world-model peers
      - Video generators / legacy tools
      - Why it matters
    rows:
      - ["Interactive shared state", "Yes; positioned as persistent, action-conditioned simulation", "Mixed; Agora-style multi-agent state is not established for every peer in retained pool", "Generally no for Sora/Veo/Kling class; internal engines can do it with custom build", "Separates simulator-style products from fixed clip generation"]
      - ["Physical-world breadth", "Robots, humanoids, vehicles, drones, AI agents, games", "Peer category spans robotics, gaming, and autonomy but with uneven domain breadth disclosure", "Usually narrower: creative video or a single internal workflow", "Breadth matters if one model is meant to transfer across embodiments"]
      - ["Multimodal / sound grounding", "Starchild-1 adds real-time multimodal grounding", "Mixed in retained evidence", "Often visual-first in substitute class", "Real-world interaction benefits from more than image-only prediction"]
      - ["Public commercial visibility", "API, Explorer, and streaming surfaces are visible", "Often visible as funded programs but not always with customers or pricing", "Stronger product familiarity for substitutes, but not equivalent simulation scope", "Commercial visibility affects procurement confidence and sales-cycle speed"]
      - ["Independent benchmarking", "Limited in retained pool", "Uneven across category", "Not comparable because substitute class optimizes for different jobs", "Benchmark opacity makes moat claims harder to underwrite"]
      - ["Deployment dependence", "AWS/Trainium partnership is explicit", "Infrastructure dependence unclear for most peers in retained pool", "Internal stacks depend on in-house compute and talent; video tools depend on vendor APIs", "Dependency affects switching cost and bargaining power"]
    notes: >-
      Cells marked as mixed or unclear reflect retained-source limits rather than hidden certainty; this matrix compares
      what the pool supports, not what may exist privately in customer deployments.
    claimRefs: [CP001, CP005, CP007, CP010, CP011, CP012]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Option
      - Public access model
      - Price visibility
      - What the retained pool actually shows
      - Diligence implication
    rows:
      - [Odyssey, "API, Explorer, real-time streaming, licensing/subscription language", "No public list pricing in retained sources", "Public materials show product surfaces and design-partner style access but no standard rate card", "Need customer contracts or pipeline data before underwriting revenue quality"]
      - ["Frontier world-model peers", "Generally product or research access, but specifics vary", "Not disclosed in retained pool", "Peer sources emphasize fundraising and positioning more than packaging", "Cannot benchmark discounting, contract length, or gross-margin profile"]
      - ["Video generators / substitute tools", "Commercially familiar substitute class", "Not measured in this retained pool", "Sources here use them as capability substitutes rather than rate-card evidence", "Add direct pricing pages before using substitute-price anchors"]
      - ["Internal build / game-engine stack", "Bespoke build with cloud and research cost", "Project-based rather than list-price", "Retained evidence ties Odyssey's own category economics to compute, data capture, and engineering intensity", "Compare total cost of ownership and speed, not nominal license price"]
    notes: >-
      This table is intentionally about price visibility and packaging evidence, because the assigned pool does not
      contain authoritative public rate cards for Odyssey or most direct peers.
    claimRefs: [CP003, CP007, CP009, CP011, CP012]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal placement synthesizes retained evidence on commercial maturity and physical-world simulation breadth rather
      than claiming a benchmarked scorecard.
    data:
      xAxis:
        label: Commercial maturity
        min: 1
        max: 5
        low: Research or partner access
        high: Visible scaled product
        description: Ordinal score derived from retained public evidence only
        scale: ordinal
      yAxis:
        label: Physical-world simulation breadth
        min: 1
        max: 5
        low: Fixed clip or narrow tool
        high: Multi-domain causal world simulation
        description: Ordinal score derived from retained public evidence only
        scale: ordinal
      points:
        - label: Odyssey
          x: 2.5
          y: 4.7
          detail: Strong simulator positioning, but public pricing and benchmarking remain thin.
          claimRefs: [CP001, CP005, CP007, CP010, CP012]
        - label: Runway
          x: 4.6
          y: 2.6
          detail: Strongest visible commercial proof in the retained peer set, with narrower evidence on physical-world breadth.
          claimRefs: [CP004, CP006]
        - label: World Labs
          x: 2.4
          y: 3.3
          detail: Direct world-model peer with material funding but limited disclosed commercialization in retained evidence.
          claimRefs: [CP004, CP006]
        - label: Decart.ai
          x: 2.8
          y: 3.2
          detail: Capitalized direct peer without enough retained proof of commercial maturity.
          claimRefs: [CP004, CP006]
        - label: Google DeepMind / Waymo
          x: 4.0
          y: 4.2
          detail: Incumbent deployment and data advantage, even if not sold as an open external product.
          claimRefs: [CP004, CP013]
        - label: Video generators
          x: 4.1
          y: 1.9
          detail: High substitute familiarity for fixed clips, but weaker evidence of interactive world-state capability.
          claimRefs: [CP004, CP005, CP011]
    approximationNotes: >-
      Scores are ordinal judgments from retained evidence: x favors visible commercialization and y favors causal,
      multi-domain simulation. They should not be read as benchmark percentages or inferred market shares.
    claimRefs: [CP004, CP005, CP006, CP007, CP010, CP011, CP013]
callouts:
  - calloutType: strength
    title: Differentiation is technical, not yet commercial
    body: >-
      Odyssey looks more differentiated on simulator behavior, multimodal grounding, and domain breadth than on public
      pricing or customer density.
    claimRefs: [CP005, CP007, CP012]
  - calloutType: risk
    title: The moat is still vulnerable to copy and infrastructure pressure
    body: >-
      Limited independent benchmarking, non-exclusive cloud concentration, and better-capitalized peer sets all weaken
      confidence that today's lead is durable.
    claimRefs: [CP006, CP008, CP010]
