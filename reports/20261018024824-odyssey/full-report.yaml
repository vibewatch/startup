      - number: '2.3'
        title: Buyers, adoption drivers, and commercialization constraints
        blocks:
          - type: paragraph
            body: >-
              Public buyer evidence clusters into four groups: robotics teams that need synthetic training environments,
              creator or interactive-media workflows that want controllable 3D worlds, defense-adjacent simulation
              users, and research or healthcare users that benefit from realistic scenario generation. The adoption
              logic is clear enough: if a world model can replace slower, more manual, or riskier real-world iteration,
              it creates budget room. However, the same sources show why commercialization timing is hard to underwrite.
              Odyssey is still described as research-stage, independent benchmarking is limited, the company has not
              disclosed a public SAM or SOM, and the public pool does not name a paying production customer or publish a
              pricing model. AWS and Trainium access look strategically important, but without contract economics or
              customer proof they are more evidence of infrastructure dependence than of repeatable software demand.
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
