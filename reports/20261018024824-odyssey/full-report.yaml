        title: Exhibits
        blocks:
          - type: callout
            title: Reusable backbone is the main technical edge
            body: >-
              The most concrete technical claim is not just visual quality but reuse: Odyssey-3 is described as one
              pretrained backbone adapted into robot, vehicle, drone, and game-control policies, which is a stronger
              product signal than a single demo surface.
            calloutType: strength
            claimRefs:
              - CE004
              - CE005
              - CE006
          - type: callout
            title: Public enterprise-readiness evidence lags the ambition
            body: >-
              Independent coverage still frames Odyssey as research-stage and early access, and the assigned public
              evidence does not verify production controls such as security certifications, privacy commitments, or
              uptime reporting.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segmentation is broad, but the entry point is still research-led
        blocks:
          - type: paragraph
            body: >-
              Public sources describe Odyssey's demand surface as wide rather than tightly segmented: researchers and
              developers can access the Odyssey-3 preview directly, while robotics companies, game studios, simulation
              engineers, and autonomous-systems developers are repeatedly cited as the intended commercial users. That
              breadth is strategically helpful because a single world-model stack can address multiple physical-AI
              workflows, but it also means the company has not yet shown a sharply defined initial buyer with disclosed
              budget, deployment cadence, or renewal behavior. The strongest top-of-funnel proof is the free preview and
              live demos, not named enterprise accounts. Odyssey therefore looks earlier in customer formation than its
              $1.45 billion valuation might imply: the company can point to relevant use cases and real-user
              experimentation, yet it has not published the account list or conversion data that would show which
              segment is actually monetizing first.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
