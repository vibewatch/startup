  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model visibility is still thinner than the valuation headline
        blocks:
          - type: paragraph
            body: >-
              The June 2026 financing announcement and the October 2026 Odyssey-3 launch provide three concrete
              commercialization datapoints: Odyssey raised a large Series B at unicorn valuation, AWS became the
              preferred cloud provider, and Flexion was named as an adopter. Those are meaningful signals that the
              company is trying to move from frontier research toward commercial deployment. What they do not provide is
              equally important. In the retained official announcements, Odyssey disclosed funding, infrastructure, and
              an early customer proof point, but not list pricing, recognized revenue, ARR, or gross margin; a
              third-party company profile likewise says no public source in its results reports revenue or
              profitability. That leaves a plausible revenue bridge, but not a disclosed one, so the revenue-stream and
              pricing tables below should be read as a diligence map rather than a completed underwriting model.
