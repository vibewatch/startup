      - number: '4.2'
        title: Cost structure is likely compute-heavy and partner-concentrated
        blocks:
          - type: paragraph
            body: >-
              The public evidence points to frontier-model economics without disclosing the actual cost line items.
              Amazon's Ron Diamant said world models require "massive compute throughput with tight latency
              constraints," and Odyssey's disclosed AWS/Trainium relationship is deep enough that AlphaSignal reports
              additional optimization work with Annapurna Labs. That suggests cloud performance and supply are central
              to product delivery rather than a generic back-office choice. At the same time, public headcount proxies
              are small: Silicon Valley Investclub lists roughly 55 employees, while Simplify shows 51-200 company size,
              0% six-month growth, and -6% one-year growth. Those are not audited operating metrics, but they do imply a
              capital-intensive research lab whose cost base may be concentrated in compute and specialized talent
              rather than broad GTM scale. world-models.io's description of Odyssey-2 as research-stage with limited
              independent benchmarking reinforces that product maturity is still earlier than a conventional software
              margin model would assume.
            claimRefs:
              - CI003
