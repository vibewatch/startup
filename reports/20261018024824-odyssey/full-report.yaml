        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is technical, not yet commercial
            body: >-
              Odyssey looks more differentiated on simulator behavior, multimodal grounding, and domain breadth than on
              public pricing or customer density.
            calloutType: strength
            claimRefs:
