      - number: '5.3'
        title: Maturity, differentiation, and control gaps
        blocks:
          - type: paragraph
            body: >
              Odyssey's differentiation case is strongest where the sources converge on real-time, interactive,
              physics-aware world modeling rather than passive video generation. ToolMage highlights low-latency
              streaming and broad vertical ambitions, and independent editorial coverage still identifies causal design
              as a core strength. At the same time, the same independent sources describe the product line as
              research-stage, early-access, and only lightly benchmarked outside company demonstrations. That matters
              because the public evidence in this assigned pool does not verify security certifications, privacy
              controls, uptime commitments, or a public trust or status surface that an enterprise buyer would normally
              expect before embedding a model into production robotics, simulation, or media workflows. The chapter
              therefore supports a view of credible frontier capability, but not yet of mature enterprise readiness.
            claimRefs:
              - CE007
              - CE010
              - CE011
              - CE012
              - CE016
