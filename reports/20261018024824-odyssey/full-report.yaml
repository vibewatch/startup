            title: Commercial readiness is still under-evidenced
            body: >-
              The assigned pool shows funding, technical ambition, and partner validation, but it still lacks public
              pricing, customer proof, and a disclosed Odyssey-specific SAM or SOM. That makes adoption timing and
              valuation elasticity hard to underwrite from public evidence alone.
