        title: Exhibits
        blocks:
          - type: callout
            title: The market thesis is stronger as simulation infrastructure than as generic AI software
            body: >-
              Odyssey's public materials and third-party summaries make the opportunity legible when the buyer needs a
              persistent simulated environment, expensive compute, and iterative interaction. They are less persuasive
              when translated into a traditional self-serve SaaS TAM.
            calloutType: insight
            claimRefs:
