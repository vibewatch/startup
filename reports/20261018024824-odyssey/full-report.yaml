              - CV005
              - CV008
              - CV010
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV008
              - CV010
              - CV012
              - CV013
      - number: '8.2'
        title: Current financing context and comparable references
        blocks:
          - type: paragraph
            body: >-
              Public financing context is clear on headline terms and muddy on underwriting depth. Multiple sources
              agree that Odyssey raised a $310M Series B at a $1.45B valuation in June 2026, while third-party summaries
              place cumulative funding at roughly $337M-$338M and one database lists the round at $1.1B pre-money /
              $1.45B post-money. The same database explicitly says EV/Rev is not disclosed for any round, and no
              retained source in this valuation pool fills that gap with ARR, revenue, or customer-count data. On peer
              framing, Angel Investors Network places Odyssey below larger private world-model financings such as AMI
              Labs and World Labs, which is directionally helpful for comp context but not enough to prove that
              Odyssey's own mark is cheap. The lack of public secondary-market pricing means the last round remains the
              only visible reference point.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV009
      - number: '8.3'
        title: Bull, base, and bear framing
        blocks:
          - type: paragraph
            body: >-
              The scenario framework should be treated as directional rather than mechanically precise because the
              public record supports the latest financing terms better than it supports operating metrics. The bull case
              depends on AWS and Trainium becoming a real cost or go-to-market edge, plus Odyssey translating technical
              pace into disclosed customers or revenue. The base case assumes the company preserves frontier credibility
              and fundraising access but remains commercially opaque enough that value accretes slowly from the $1.45B
              mark. The bear case centers on the risks already called out by adverse coverage: long commercialization
              timelines, open-source or well-capitalized competitor pressure, and a future round where investors
              underwrite preference overhang more aggressively than the current public materials allow.
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Odyssey is not exit-ready from a public-evidence perspective because the key valuation bridge from
              frontier research to investable commercial business is still missing. A sponsor can underwrite that
              privately, but an external investor should treat undisclosed revenue, customer concentration, gross
              margin, and preferred-share terms as unresolved diligence items rather than as implied positives. The
              cleanest upgrade path is straightforward: management discloses monetization proof, the AWS relationship
              shows measurable economics rather than narrative sponsorship, and new financing confirms that the June
              2026 mark was not a peak-cycle price. The clearest thesis-break triggers are an extended slip in
              commercial proof, evidence that Trainium economics are non-durable, or a next round that prices
              flat-to-down with heavier structural protections.
            claimRefs:
              - CV006
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Keep Odyssey in research-more until management shows paying-customer, revenue, margin, and preference-term
              evidence that lets investors underwrite more than frontier scarcity.
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV013
          - type: callout
            title: Thesis-break triggers
            body: >-
              A flat-to-down next round, non-durable AWS economics, or continued absence of commercial disclosure after
              further product launches would move the current stretched view closer to an avoid.
            calloutType: risk
            claimRefs:
              - CV008
              - CV010
              - CV013
