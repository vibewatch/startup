              - CR010
              - CR011
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The current call should stay price-sensitive rather than collapse into a generic technology-quality score.
              Odyssey has real proof of technical momentum and sponsor quality: the June 2026 Series B brought $310M at
              a $1.45B valuation, AWS became the preferred cloud provider, and multiple sources describe sustained
              world-model shipping progress across Odyssey-2 Max, Starchild-1, Agora-1, and PROWL. The gating issue is
              that public evidence still does not disclose revenue, paying-customer count, gross margin, or
              liquidation-preference terms, so the price is supported mainly by frontier promise and strategic backing
              rather than commercial underwriting. That keeps the recommendation at research-more, with upgrade
              conditions tied to monetization proof or a materially better entry point.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
