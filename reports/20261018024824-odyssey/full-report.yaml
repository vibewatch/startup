              - CU003
              - CU005
              - CU008
              - CU013
              - CU014
      - number: '6.2'
        title: Adoption proof is mostly preview, design-partner, and event evidence
        blocks:
          - type: paragraph
            body: >-
              The best public adoption evidence is real, but it is still one layer short of durable production proof.
              TechTimes reports a free Odyssey-3 preview with no API key for browser use and notes that the India
              driving result remains a limited test rather than a commercial deployment. Air Street adds that Odyssey is
              working with design partners it will name later and that RAAIS attendees joined a live Agora-1 session in
              real time, which is stronger than a prerecorded demo but still not the same as a recurring paid
              deployment. Quasa and world-models.io both reinforce that the product is research-stage or early-access
              rather than a polished customer system. Taken together, these signals show meaningful product engagement
              and credible experimentation, yet they do not establish who is paying today, how many accounts have
              converted, or whether any reference customer is live in scaled production.
            claimRefs:
              - CU002
              - CU008
              - CU009
              - CU010
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU005
              - CU008
              - CU014
      - number: '6.3'
        title: Expansion is easiest to see through AWS, while durability remains unproven
        blocks:
          - type: paragraph
            body: >-
              Odyssey's clearest expansion mechanism is its June 2026 AWS agreement, which combines preferred-cloud
              status, Trainium optimization, and explicit joint go-to-market language. That gives the company a
              plausible channel into robotics, gaming, science, and adjacent developers without first building a
              self-serve enterprise motion from scratch. At the same time, the absence of customer counts, cohort data,
              contract length, or concentration disclosure means investors cannot yet separate channel narrative from
              durable account economics. Hiring for vendor-heavy data operations and the manual API inquiry flow both
              suggest that commercialization remains hands-on. The near-term customer question is not whether Odyssey
              has relevant users; it is whether the company can convert research curiosity and partner distribution into
              repeatable, referenceable accounts before competitors and hyperscaler dependencies narrow its room to
              maneuver.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU011
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a high residual-risk posture rather than a clean underwriting case. Odyssey
              has secured a $310 million Series B at a $1.45 billion valuation and tied its next phase to AWS as
              preferred cloud provider, which gives it capacity but also creates a concentrated compute dependency
              around one infrastructure relationship. At the same time, the October 2026 Odyssey-3 launch stretched the
              product story across robots, humanoids, vehicles, drones, games, and AI training environments, while the
              clearest named external proof remains a small set of robotics partners rather than broad customer
              deployment. The risk stack is therefore led by partner concentration, commercialization-proof gaps, and
              missing operating disclosures; kill criteria should focus on loss of AWS leverage, failed post-launch
              customer conversions, or evidence that cross-domain demos do not convert into repeatable production usage.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR010
              - CR012
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR007
              - CR009
              - CR010
              - CR012
              - CR015
      - number: '7.2'
        title: Legal, regulatory, and governance blind spots
        blocks:
          - type: paragraph
            body: >-
              Public sources do not establish that Odyssey has cleared the compliance work needed for safety-sensitive
              or defense-adjacent deployments. AI Business places Odyssey's opportunity set in autonomous vehicles and
              robotics, and investor/financing coverage shows participation from Amazon, AMD Ventures, GV, EQT, and IQT,
              but none of the assigned sources disclose privacy certifications, export-control procedures, incident
              reporting protocols, or a full governance pack. That does not prove an issue exists; it means the legal
              and regulatory layer remains unproven in the public record. Diligence should therefore require concrete
              artifacts such as security certifications, DPA language, export/sanctions controls, board composition, and
              any safety-review process before treating these risks as mitigated.
            claimRefs:
              - CR011
              - CR013
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR011
              - CR013
              - CR016
      - number: '7.3'
        title: Operational and productization execution risk
        blocks:
          - type: paragraph
            body: >-
              Odyssey's technical narrative is compelling, but its operating burden is unusually broad for a company
              still described publicly as roughly a 55-person team. Odyssey-3 is presented as a single foundation
              spanning multiple physical and virtual domains, with encouraging performance after limited task-specific
              data, yet the public proof still depends on company demonstrations plus close collaborators such as
              Flexion and Poke & Wiggle. That leaves several execution risks unresolved: whether the same pretrained
              backbone generalizes reliably outside curated demos, whether partner-led validation translates into signed
              production programs, and whether a small team can simultaneously advance model quality, evaluation,
              safety, and commercialization. Measurable thesis breaks would include launch slippage, failure to add new
              named adopters, or evidence that performance degrades materially outside partner-supported settings.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR014
              - CR015
      - number: '7.4'
        title: Financial opacity and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Funding strength does not remove financing risk when operating metrics are opaque. The assigned pool
              discloses the Series B, investor roster, and preferred-cloud arrangement, but it does not disclose
              revenue, profitability, customer concentration, gross margin, burn, or runway. That matters because
              world-model training is compute intensive and the public partner narrative is already concentrated around
              AWS and strategic backers. AlphaSignal explicitly questions whether the cloud shift reflects durable
              technical conviction or simply better terms, and Silicon Valley Investclub states that no public source in
              its results reports Odyssey's revenue or profitability. Until management supplies customer conversion,
              compute commitments, and unit-economics evidence, the right stance is to treat capital availability as a
              temporary buffer rather than proof that the model can scale economically.
            claimRefs:
              - CR001
              - CR002
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
