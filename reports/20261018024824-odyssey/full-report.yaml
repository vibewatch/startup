  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surfaces and user workflow
        blocks:
          - type: paragraph
            body: >
              Public evidence points to Odyssey selling access to world-model capabilities through several surfaces
              rather than a single monolithic application. ToolMage describes a developer API with interactive streams,
              viewable streams, and batch simulations, plus JavaScript and Python SDKs, while Simplify's company profile
              adds an Explorer product that turns a single image into an interactive 3D environment. YFarmX also says
              Odyssey opened a public research preview for Odyssey-3 Flash in October 2026. In customer-workflow terms,
              the current product motion appears to be: test the interactive demo or preview, integrate the API into a
              robotics, media, or simulation workflow, and then adapt the model to a specific environment or task. What
              is still missing is a canonical public product catalog that cleanly separates research previews,
              higher-performance variants, and generally available commercial SKUs.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
              - CE014
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
