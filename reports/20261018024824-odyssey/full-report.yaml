  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool describes Odyssey as a world-model company whose core product boundary is
              persistent, causal simulation of the physical world rather than a fixed-output text-to-video tool. That
              matters because the included opportunity is not "all generative video" or "all AI software"; it is the
              narrower set of workflows that need an environment to be simulated, updated, and interacted with over
              time. Across the pool, the consistently named application areas are robotics, gaming or interactive media,
              defense, science, and healthcare, with some sources also adding education or film. Those verticals imply
              different procurement motions and budget owners, so the market should be framed as several adjacent
              simulation budgets rather than one monolithic category. The status-quo substitutes in this framing are
              fixed-clip video generation, conventional game engines, and physical testing in the real world, because
              those are the alternatives Odyssey is implicitly trying to replace or compress.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM005
              - CM006
              - CM007
              - CM016
      - number: '2.2'
        title: Public sizing lenses are broad proxies, not Odyssey-specific demand
        blocks:
          - type: paragraph
            body: >-
              The strongest numeric market claim in the assigned evidence is still a very broad one: AIPressRoom says
              the wider physical-AI market could reach trillions by 2033, but that umbrella combines robotics,
              simulation, and autonomous systems and therefore overstates what can be treated as Odyssey's near-term
              addressable demand. More useful public evidence comes from constrained lenses: multiple sources agree on
              the target verticals, competitor financing shows capital flowing into the category, and Odyssey's own
              messaging ties adoption to expensive compute and infrastructure access. Taken together, those signals
              support a thesis that the category is large enough to attract serious capital, but they do not support a
              clean public TAM/SAM/SOM stack for Odyssey. The valuation case therefore depends more on whether Odyssey
              can win high-value simulation workloads in a few verticals than on a generic "AI is big" sector multiple.
            claimRefs:
              - CM005
