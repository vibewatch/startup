      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >
              The clearest technical through-line is backbone reuse. YFarmX describes Odyssey-3 as one pretrained
              world-model backbone that stays frozen while small task policies or decoders adapt it to robot arms, a
              humanoid, a car, a drone, and game control. ToolMage's API summary and Silicon Valley Invest Club's
              profile suggest that the same research stack is already exposed through streaming and developer surfaces,
              not only internal demos. The operating model is also compute-heavy and infrastructure-dependent: Odyssey's
              June 2026 announcement says AWS becomes the preferred cloud provider, Trainium becomes part of the
              training stack, and Annapurna Labs is a stated optimization partner. Simplify's AI Resident role further
              suggests the company is staffing research pods and evaluation pipelines across multiple modalities at
              once, which is consistent with a lab-to-product operating model but also raises execution complexity.
            claimRefs:
