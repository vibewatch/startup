      - number: '4.3'
        title: The round likely buys time, but not underwritable economics
        blocks:
          - type: paragraph
            body: >-
              Financially, Odyssey looks better framed as "well funded to keep proving the model" than "already legible
              on public unit economics." A $310 million round is substantial against the company's disclosed scale
              proxies and should provide room for compute procurement, model training, and partner programs. But there
              is still no public cash balance, burn rate, customer concentration, revenue-recognition policy, margin
              bridge, or contract-level evidence showing whether AWS is accretive or dilutive to gross profit. Air
              Street's note that Odyssey is still working with design partners it will name in time, plus
              world-models.io's benchmarking caveat, both reinforce that external commercial proof remains earlier than
              the valuation headline. My financial verdict is therefore positive on financing access and negative on
              disclosure sufficiency: capital adequacy appears improved, while revenue quality and margin durability
              remain diligence blockers.
            claimRefs:
              - CI001
              - CI006
              - CI007
              - CI011
              - CI014
              - CI015
