chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scope, and what is actually public
        blocks:
          - type: paragraph
            body: >-
              Odyssey presents itself as a general-purpose world-model company rather than a narrow video tool vendor.
              The retained primary and company-issued sources consistently place the company in Palo Alto and describe
              its mission as building causal, multimodal systems that can predict and interact with the physical world
              over long horizons. The most concrete commercial description in the assigned pool comes from the current
              AI Resident listing, which says Odyssey sells Explorer, a tool that turns one 2D image into an interactive
              3D environment, usually through licensing or subscription. That gives this refresh a usable
              product/business-model frame, but it remains a company-shaped description rather than independent customer
              validation.

              The public disclosure pattern matters as much as the identity statement. The retained sources readily
              disclose valuation, funding, investors, offices, and research milestones, but they do not disclose
              recognized revenue, ARR, customer count, board composition, or financing terms. For later chapters, this
              overview is reliable as an identity and milestone baseline, but not as proof of commercial traction or
              governance maturity.
            claimRefs:
              - CO003
              - CO004
              - CO010
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
              - CO008
              - CO009
              - CO013
              - CO014
      - number: '1.2'
        title: Leadership concentration is an asset and a risk
        blocks:
          - type: paragraph
            body: >-
              The founder story is unusually coherent for a physical-AI company. Independent reporting ties Oliver
              Cameron and Jeff Hawke directly to autonomous-driving programs at Voyage, Cruise, and Wayve, which is the
              closest adjacent operating category to Odyssey's world-model thesis. That lineage makes the company's
              technical positioning easier to underwrite than a generic AI-media startup, and it helps explain why
              investors have treated the team as a frontier research bet instead of a feature-layer application.

              The same evidence also shows concentration risk. Public materials are overwhelmingly founder-centric,
              while the retained refresh evidence still lacks a complete executive roster, board list, or any
              well-supported account of leadership changes since the prior report. That means the chapter can support
              founder-market fit and key-person dependence, but not broader governance depth.
            claimRefs:
              - CO001
              - CO002
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO013
      - number: '1.3'
        title: The June 2026 financing reset the company's scale
        blocks:
          - type: paragraph
            body: >-
              The clearest refresh delta is financial scale. Multiple retained sources align that Odyssey raised a $310
              million Series B on 17 June 2026 at a $1.45 billion valuation, led by Natural Capital with Amazon, AMD
              Ventures, GV, EQT, and In-Q-Tel participating. Independent reports also place cumulative funding at
              roughly $337 million after the round, implying that Odyssey moved from a relatively small pre-Series-B
              capital base into a much more heavily financed position in one step.

              That new capital comes with strategic signaling as well as cash. The same announcement made AWS Odyssey's
              preferred cloud provider and shifted the compute narrative toward Trainium rather than Nvidia, while TFN
              explicitly framed the result as one of the most capital-intensive AI bets per employee in the market. So
              the financing is both a strength signal and an execution test: it buys runway and infrastructure, but it
              also raises the standard for commercial evidence that is still absent from public materials.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO007
              - CO012
              - CO013
      - number: '1.4'
        title: Research cadence is visible; commercial proof is not
        blocks:
          - type: paragraph
            body: >-
              Odyssey has made its research narrative legible. The retained sources describe a sequence from Odyssey-2
              and Odyssey-2 Max into Starchild-1, Agora-1, PROWL, and a later Odyssey-3 claim in the current job
              listing, which is enough to show product iteration across 2025 and 2026. The company also still appears to
              be hiring in three offices, reinforcing that the technical roadmap is active rather than archival.

              What the timeline does not prove is customer adoption, monetization, or governance quality.
              world-models.io explicitly flags Odyssey-2 as research-stage with limited independent benchmarking, the
              assigned pool contains no verified customer or revenue disclosure, and one low-reputation external
              database still carries contradictory founding-year data. Those issues do not negate the company's
              momentum, but they keep the chapter anchored in technical progress plus disclosure gaps rather than in a
              fully underwritten operating profile.
            claimRefs:
