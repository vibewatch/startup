        title: Exhibits
        blocks:
          - type: callout
            title: Infrastructure concentration is the clearest financial risk in public view
            body: >-
              Preferred-cloud status with AWS may improve supply and co-sell access, but public disclosures still do not
              say whether the relationship is exclusive, credit-backed, or margin dilutive. That makes cloud economics
              the most important missing input in the financial model.
            calloutType: risk
            claimRefs:
