  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: durability-gap
      missingEvidence: Customer count, active-account count, renewal rates, churn, and contract duration by segment.
      whyItMatters: Public interest and demos do not show whether Odyssey has durable commercial adoption or repeatable account economics.
      diligencePath: Request cohort data, active paid account counts, and at least one renewal case study segmented by product surface.
      relatedQuestionRefs: [QU004]
      relatedTableRefs: [TU002]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: A named roster of paying customers or production deployments that can distinguish pilots, design partners, and self-serve preview users.
      whyItMatters: Without reference accounts, the chapter cannot validate whether Odyssey's broad market narrative has converted into production usage.
      diligencePath: Ask management for three named customer references with deployment status, budget owner, contract type, and measurable outcome.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer share, partner-sourced pipeline mix, and AWS-related revenue dependence.
      whyItMatters: The public evidence suggests AWS is the strongest expansion channel, but investors cannot judge concentration risk without channel and account mix.
      diligencePath: Request channel-sourced bookings, top-10 account revenue share, and any exclusivity or minimum-spend terms tied to AWS.
      relatedQuestionRefs: [QU005]
