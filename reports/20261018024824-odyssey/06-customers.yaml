chapter:
  number: 6
  title: Customers
  summary: >-
    Odyssey has widened awareness and evaluation with a free Odyssey-3 browser preview, live
    demo participation, and an AWS distribution narrative, but the public record still stops
    short of named paying customers, retention metrics, or concentration disclosure. The
    available evidence supports strong interest from robotics, simulation, and developer users,
    yet most customer proof remains early-stage, partner-led, or demo-led rather than durable
    production adoption.
sections:
  - id: segmentation-and-entry
    title: Segmentation is broad, but the entry point is still research-led
    body: >-
      Public sources describe Odyssey's demand surface as wide rather than tightly segmented:
      researchers and developers can access the Odyssey-3 preview directly, while robotics
      companies, game studios, simulation engineers, and autonomous-systems developers are
      repeatedly cited as the intended commercial users. That breadth is strategically helpful
      because a single world-model stack can address multiple physical-AI workflows, but it also
      means the company has not yet shown a sharply defined initial buyer with disclosed budget,
      deployment cadence, or renewal behavior. The strongest top-of-funnel proof is the free
      preview and live demos, not named enterprise accounts. Odyssey therefore looks earlier in
      customer formation than its $1.45 billion valuation might imply: the company can point to
      relevant use cases and real-user experimentation, yet it has not published the account list
      or conversion data that would show which segment is actually monetizing first.
    claimRefs: [CU001, CU002, CU003, CU007, CU012]
    tableRefs: [TU001, TU002]
    figureRefs: [FU001]
  - id: named-proof-and-adoption-quality
    title: Adoption proof is mostly preview, design-partner, and event evidence
    body: >-
      The best public adoption evidence is real, but it is still one layer short of durable
      production proof. TechTimes reports a free Odyssey-3 preview with no API key for browser
      use and notes that the India driving result remains a limited test rather than a commercial
      deployment. Air Street adds that Odyssey is working with design partners it will name later
      and that RAAIS attendees joined a live Agora-1 session in real time, which is stronger than
      a prerecorded demo but still not the same as a recurring paid deployment. Quasa and
      world-models.io both reinforce that the product is research-stage or early-access rather
      than a polished customer system. Taken together, these signals show meaningful product
      engagement and credible experimentation, yet they do not establish who is paying today, how
      many accounts have converted, or whether any reference customer is live in scaled
      production.
    claimRefs: [CU002, CU008, CU009, CU010, CU014]
    tableRefs: [TU003]
  - id: durability-and-expansion-risk
    title: Expansion is easiest to see through AWS, while durability remains unproven
    body: >-
      Odyssey's clearest expansion mechanism is its June 2026 AWS agreement, which combines
      preferred-cloud status, Trainium optimization, and explicit joint go-to-market language.
      That gives the company a plausible channel into robotics, gaming, science, and adjacent
      developers without first building a self-serve enterprise motion from scratch. At the same
      time, the absence of customer counts, cohort data, contract length, or concentration
      disclosure means investors cannot yet separate channel narrative from durable account
      economics. Hiring for vendor-heavy data operations and the manual API inquiry flow both
      suggest that commercialization remains hands-on. The near-term customer question is not
      whether Odyssey has relevant users; it is whether the company can convert research curiosity
      and partner distribution into repeatable, referenceable accounts before competitors and
      hyperscaler dependencies narrow its room to maneuver.
    claimRefs: [CU004, CU005, CU006, CU011, CU013]
