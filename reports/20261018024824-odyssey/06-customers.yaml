figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Odyssey's visible path runs from research awareness into preview evaluation, direct inquiry,
      design-partner work, and AWS-assisted expansion rather than disclosed land-and-expand inside
      named accounts.
    data:
      items:
        - label: World-model awareness
          actor: Research and applied-AI leads
          stage: Awareness
          channels:
            - Tech and investor coverage
            - Robotics and simulation discussions
          touchpoints:
            - Series B and world-model category coverage
            - Use-case framing across robotics, gaming, science, and defense
          tone: neutral
        - label: Self-serve research preview
          actor: Researchers and developers
          stage: Evaluation
          channels:
            - Browser experience
          touchpoints:
            - "Odyssey-3 preview at experience.odyssey.systems"
            - No API key required for browser use
          tone: opportunity
        - label: Assisted enterprise inquiry
          actor: Commercial evaluator
          stage: Qualification
          channels:
            - Direct sales / contact flow
          touchpoints:
            - Separate contact form for developer API access
            - Manual conversion path rather than self-serve checkout
          tone: warning
        - label: Design-partner validation
          actor: Unnamed robotics and simulation partners
          stage: Pilot
          channels:
            - Co-design and partner evaluation
          touchpoints:
            - Design partners referenced but not publicly named
            - Live demos used to show capability before reference accounts
          tone: neutral
        - label: Real-user and event usage
          actor: Participants and early users
          stage: Early use
          channels:
            - RAAIS live demo
            - Internal shipped systems
          touchpoints:
            - Attendees joined Agora-1 in real time
            - Staff posting says shipped systems are used by real people
          tone: neutral
        - label: AWS-led expansion loop
          actor: Odyssey plus hyperscaler channel
          stage: Expansion
          channels:
            - AWS partnership
            - Trainium optimization
          touchpoints:
            - Preferred-cloud status
            - Joint go-to-market to reach customers
          tone: risk
    approximationNotes: >-
      Sequence reflects the public customer motion implied by retained sources; Odyssey does not
      disclose stage conversion rates, time-to-close, or expansion percentages.
    claimRefs: [CU002, CU003, CU005, CU008, CU013, CU014]
