      Boundary rows synthesize how the assigned public sources describe Odyssey's workload. Cells
      describe supported inclusion/exclusion logic, not a complete spend census for each segment.
    claimRefs: [CM001, CM002, CM003, CM005, CM006, CM007, CM016]
