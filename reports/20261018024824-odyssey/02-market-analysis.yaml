      - Confidence
      - Limitation
    rows:
      - [AIPressRoom, 2026, Global, '"projected to reach trillions by 2033"', Not disclosed, Broad physical-AI sector proxy spanning robotics plus simulation plus autonomous systems, Low, Not Odyssey-specific and no underlying methodology is present in the assigned pool]
      - [AI Market Watch, 2026, Global, Not disclosed, N/A, Target-market lens built from named verticals and product positioning, Medium, Defines who the company says it serves but not how much those buyers spend]
      - [AlphaSignal, 2026, Global, Rival funding and valuation comps rather than a market total, N/A, "Category-capital lens using financings at Runway, World Labs, Decart.ai, and AMI Labs", Medium, Capital inflows show investor appetite rather than customer demand]
      - [Business Wire via Yahoo Finance, 2026, Global, Preferred-cloud and GTM partnership disclosed; no market size disclosed, N/A, Commercialization lens based on infrastructure and go-to-market collaboration with AWS, Medium, Says nothing public about Odyssey-specific SAM or SOM]
    notes: >-
      Only one row in the assigned pool offers a numeric sector proxy, so the remaining rows are
      constrained sizing lenses that bound the market qualitatively rather than as a public
      Odyssey TAM/SAM/SOM stack.
    claimRefs: [CM005, CM008, CM009, CM011, CM012, CM014, CM015]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - [Robotics simulation, Robotics companies and autonomy teams, ML researchers and simulation engineers, Corporate R&D programs, Train and evaluate physical-AI agents in synthetic environments, VP Engineering / robotics platform lead, Reduce real-world test cost and accelerate iteration]
      - [Interactive media and creator tooling, Game developers and film or interactive-content teams, Technical artists and world-building creators, Studio technology or content-production budgets, Turn images or prompts into interactive 3D worlds, Head of product / content pipeline owner, Faster world creation and controllable iteration]
      - [Defense / national security, Defense organizations and mission-simulation teams, Analysts and autonomy operators, Program or mission budgets, Run high-consequence scenario simulations before field deployment, Program executive / innovation office, Need for safe training and strategic simulation]
      - [Science / healthcare simulation, Research labs and healthcare-simulation providers, Researchers and training users, Institutional or grant-funded budgets, Model complex environments for experimentation or training, Research director / program owner, Lower-cost experimentation with realistic environments]
    notes: >-
      Buyer and budget-owner fields are inferred from the named workflow and user category in the
      assigned public sources; Odyssey does not publicly disclose its actual account mix.
    claimRefs: [CM002, CM006, CM007, CM010, CM011, CM016]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The public market evidence narrows from a broad physical-AI narrative at the top to an
      undisclosed commercial wedge at the bottom.
    data:
      items:
        - label: Broad physical-AI proxy
          value: projected to reach trillions by 2033
          note: Broad sector framing from AIPressRoom; this is not an Odyssey-specific TAM.
          claimRefs: [CM005, CM009]
        - label: World-model core workload
          value: persistent causal simulation
          note: The assigned pool consistently frames Odyssey as simulation infrastructure rather than fixed-output video.
          claimRefs: [CM001, CM003]
        - label: Named enterprise verticals
          value: robotics · gaming · defense · science · healthcare
          note: Public vertical breadth is clear even though spend by vertical is not.
          claimRefs: [CM002, CM006, CM010]
        - label: Interactive-media wedge
          value: controllable 3D world creation
          note: Public product descriptions suggest creator-tooling demand, but budget ownership varies by studio workflow.
          claimRefs: [CM002, CM006]
        - label: Compute-constrained deployment
          value: AWS + Trainium
          note: Infrastructure access is a visible adoption enabler and a strategic dependency.
          claimRefs: [CM007, CM011, CM014]
        - label: Public commercial wedge
          value: not disclosed
          note: The assigned public pool does not provide a quantified Odyssey SAM or SOM, a public price list, or a named production customer.
          claimRefs: [CM012, CM013, CM015]
    approximationNotes: >-
      Only the top layer includes a public market-size proxy. Lower layers are constrained lenses
      derived from named workloads, verticals, and missing disclosures in the assigned evidence.
    claimRefs: [CM005, CM006, CM009, CM011, CM012, CM013, CM014, CM015]
callouts:
  - calloutType: insight
    title: The market thesis is stronger as simulation infrastructure than as generic AI software
    body: >-
      Odyssey's public materials and third-party summaries make the opportunity legible when the
      buyer needs a persistent simulated environment, expensive compute, and iterative interaction.
      They are less persuasive when translated into a traditional self-serve SaaS TAM.
    claimRefs: [CM001, CM005, CM007, CM014]
  - calloutType: risk
    title: Commercial readiness is still under-evidenced
    body: >-
      The assigned pool shows funding, technical ambition, and partner validation, but it still
      lacks public pricing, customer proof, and a disclosed Odyssey-specific SAM or SOM. That
      makes adoption timing and valuation elasticity hard to underwrite from public evidence alone.
    claimRefs: [CM004, CM012, CM013, CM015]
