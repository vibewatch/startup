  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing-gap
      missingEvidence: Odyssey-specific TAM, SAM, and SOM by target vertical, geography, and buyer segment.
      whyItMatters: Public category enthusiasm is not enough to underwrite adoption or valuation without a bounded commercial wedge.
      diligencePath: Request management's market model showing vertical prioritization, buyer counts, ACV assumptions, and geographic rollout.
      relatedQuestionRefs: [QM002, QM008]
      relatedTableRefs: [TM002, TM003]
    - type: private-evidence-only
      severity: material
      topic: go-to-market-economics
      missingEvidence: AWS partnership economics, including committed spend, credits, co-sell mechanics, and margin implications.
      whyItMatters: Compute dependence is central to the market thesis, so infrastructure terms directly affect who Odyssey can serve and at what margin.
      diligencePath: Obtain the AWS commercial agreement summary and internal unit-economics assumptions for Trainium-backed deployments.
      relatedQuestionRefs: [QM004, QM005]
    - type: missing-source
      severity: material
      topic: commercialization-gap
      missingEvidence: Named design partners, paid production customers, pricing, and public benchmark evidence versus status-quo alternatives.
      whyItMatters: Without customer proof, public evidence cannot distinguish breakthrough research interest from repeatable commercial demand.
      diligencePath: Request customer references, pilot-to-production conversion data, pricing examples, and benchmark comparisons against incumbent tools.
      relatedQuestionRefs: [QM003, QM005, QM008]
