    sourceType: analyst-market-data
    reputationTier: medium
    independence: partner
    topics:
      - substitutes
      - design-partners
      - strategy
      - world-models
    keyQuote: >-
      A world model is not a video generator. Sora, Veo, Kling, and their successors take a prompt and render a fixed
      clip. The output can be beautiful, but the future is locked from the outset of generation. As a consumer of the
      video, your only mode of interaction is to watch.

      By contrast, a world model is closer to a simulator than a renderer. It predicts the next state of an environment
      from the past and from whatever a participant does next. It accepts input mid-rollout. It holds a persistent
      state, a memory of the world that can be acted on and changed.
    canonical: SM007
