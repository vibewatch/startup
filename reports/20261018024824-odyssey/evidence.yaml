evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-and-terms
    missingEvidence: >-
      Board composition, legal entity documents, cap-table ownership, liquidation preferences, and any debt or secondary
      detail tied to the Series B.
    whyItMatters: Control rights and downside economics affect both governance quality and valuation underwriting.
    diligencePath: Request the cap table, board list, financing documents, and any investor side letters from management.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: commercial-traction
    missingEvidence: Verified revenue, ARR, paying-customer count, pricing structure, and contract concentration.
    whyItMatters: >-
      Without commercial metrics, the chapter can describe financing scale but cannot underwrite product-market fit or
      value accrual.
    diligencePath: >-
      Request monthly revenue, ARR bridge, customer count by segment, pricing sheets, and top-account concentration from
      management.
    relatedQuestionRefs:
      - QO006
      - QO009
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: minor
    topic: founding-conflict
    missingEvidence: >-
      A primary incorporation record or first-company announcement resolving the 2017 versus late-2023 founding
      discrepancy carried by third-party directory data.
    whyItMatters: >-
      Even small factual conflicts reduce confidence in derivative datasets used for board, office, or headcount
      lookups.
    diligencePath: >-
      Verify incorporation date and company formation history against state filings or the original company
      announcement.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: Odyssey-specific TAM, SAM, and SOM by target vertical, geography, and buyer segment.
    whyItMatters: Public category enthusiasm is not enough to underwrite adoption or valuation without a bounded commercial wedge.
    diligencePath: >-
      Request management's market model showing vertical prioritization, buyer counts, ACV assumptions, and geographic
      rollout.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: go-to-market-economics
    missingEvidence: AWS partnership economics, including committed spend, credits, co-sell mechanics, and margin implications.
    whyItMatters: >-
      Compute dependence is central to the market thesis, so infrastructure terms directly affect who Odyssey can serve
      and at what margin.
    diligencePath: >-
      Obtain the AWS commercial agreement summary and internal unit-economics assumptions for Trainium-backed
      deployments.
    relatedQuestionRefs:
      - QM004
      - QM005
  - type: missing-source
    severity: material
    topic: commercialization-gap
    missingEvidence: >-
      Named design partners, paid production customers, pricing, and public benchmark evidence versus status-quo
      alternatives.
    whyItMatters: >-
      Without customer proof, public evidence cannot distinguish breakthrough research interest from repeatable
      commercial demand.
    diligencePath: >-
      Request customer references, pilot-to-production conversion data, pricing examples, and benchmark comparisons
      against incumbent tools.
    relatedQuestionRefs:
      - QM003
      - QM005
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Odyssey customer contracts, standard commercial terms, and any public or customer-confirmed rate card for direct
      peers.
    whyItMatters: >-
      Without contract structure and realized pricing, the chapter cannot compare revenue quality, discounting, or
      switching-cost realism across the peer set.
    diligencePath: >-
      Request signed customer examples, pipeline stage mix, and current price architecture from Odyssey, then collect
      named competitor pricing pages or buyer invoices for substitutes.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Current contract templates, list pricing, discounting norms, or usage-based rate cards for Odyssey products.
    whyItMatters: Without price architecture, revenue mix and revenue quality cannot be modeled.
    diligencePath: Request top customer contracts, order forms, and any public or private pricing deck.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin bridge, cloud COGS, inference/training spend, and any services-delivery cost disclosures.
    whyItMatters: World-model economics depend on compute efficiency; margin cannot be inferred from funding alone.
    diligencePath: Request a gross-margin walk, cloud-spend schedule, and unit-cost trend by major workload.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: runway
    missingEvidence: Cash on hand after the Series B, monthly burn, runway, debt, and any committed cloud-capacity obligations.
    whyItMatters: Capital adequacy depends on cash conversion and fixed commitments, not just on round size.
    diligencePath: Request board materials or finance pack showing cash, burn, committed capex/opex, and runway.
    relatedQuestionRefs:
      - QI001
      - QI006
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: customer-disclosure
    missingEvidence: >-
      Named paying customers, customer count, contract values, and concentration beyond Flexion and unnamed design
      partners.
    whyItMatters: Commercial proof cannot be converted into sales-efficiency or revenue-quality analysis without customer detail.
    diligencePath: Request customer list, pipeline stages, cohort revenue, and top-account concentration.
