    keyQuote: >-
      Runway, valued at $5.3 billion after a $315 million Series E, launched its first world model product and gained
      $40 million in annual recurring revenue.

      World Labs, Fei-Fei Li's spatial AI startup, launched its Marble product after raising $230 million.

      Decart.ai raised $300 million at a nearly $4 billion valuation to develop a pair of world models named Lucy and
      Oasis.

      Yann LeCun's startup AMI Labs raised $1.03 billion in March to train world models.

      Google DeepMind's Genie model is already being used at Waymo.
    canonical: SO007
  - id: SP008
    publisher: Air Street Press
    title: Odyssey raises $310M Series B for world models
    url: https://press.airstreet.com/p/odyssey-series-b
    date: 2026-06-23T00:00:00.000Z
    accessDate: 2026-10-18T00:00:00.000Z
    accessStatus: ok
