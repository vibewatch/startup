figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The retained evidence shows a fast sequence from founding and early model positioning into a
      heavily financed June 2026 reset and additional product/compute claims in September 2026.
    data:
      items:
        - date: Late 2023
          label: Company founded
          detail: Independent reporting says Oliver Cameron and Jeff Hawke started Odyssey in late 2023 after autonomous-driving roles at Voyage/Cruise and Wayve.
          tone: neutral
          claimRefs: [CO001, CO002]
        - date: "2025-01-01"
          label: Odyssey-2 cataloged
          detail: world-models.io published a reference page describing Odyssey-2 as a causal autoregressive interactive video world model and still labels it research-stage with limited independent benchmarking.
          tone: risk
          claimRefs: [CO016]
        - date: "2026-02"
          label: Series A referenced
          detail: AlphaSignal and TFN both say Nvidia's venture arm backed Odyssey's Series A four months before the June 2026 Series B.
          tone: neutral
          claimRefs: [CO006]
        - date: "2026-06-17"
          label: Series B repricing
          detail: Odyssey announced a $310 million Series B at a $1.45 billion valuation led by Natural Capital.
          tone: positive
          claimRefs: [CO005]
        - date: "2026-06-17"
          label: AWS / Trainium partnership disclosed
          detail: The same announcement made AWS the preferred cloud provider and said Odyssey would optimize work on Trainium chips.
          tone: positive
          claimRefs: [CO007]
        - date: "2026-06-17"
          label: Research stack summarized
          detail: The official release grouped Odyssey-2 Max, Starchild-1, Agora-1, and PROWL as the company's latest world-model milestones.
          tone: neutral
          claimRefs: [CO011]
        - date: "2026-09-15"
          label: Odyssey-3 launch claimed
          detail: The current AI Resident listing says Odyssey-3 launched on September 15, 2026 using one frozen backbone across robots, cars, and drones.
          tone: neutral
          claimRefs: [CO015]
        - date: "2026-09-17"
          label: Trainium3 flagship claim
          detail: The same listing says AWS named Odyssey a Trainium3 flagship on September 17, 2026.
          tone: neutral
          claimRefs: [CO015]
    approximationNotes: >-
      When sources do not provide a separate internal launch date, the timeline uses the dated
      public announcement or publication recorded in the retained evidence.
    claimRefs: [CO001, CO002, CO005, CO007, CO011, CO015, CO016]
callouts:
  - calloutType: strength
    title: Founder-market fit plus compute access is the core bull case
    body: >-
      Odyssey pairs self-driving founder lineage with an outsized 2026 financing and a named
      AWS/Trainium partnership, which is exactly the mix a frontier simulation lab needs to keep
      shipping research quickly.
    claimRefs: [CO001, CO002, CO005, CO007]
  - calloutType: risk
    title: Disclosure opacity remains the gating issue
    body: >-
      The retained public evidence still does not verify revenue, customer count, board structure,
      or financing terms, while even basic external profile data contains a conflicting founding-year
      entry and TFN questions the capital intensity per employee.
    claimRefs: [CO012, CO013, CO014]
