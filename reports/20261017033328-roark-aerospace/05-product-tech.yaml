      - Measurable benefit
      - Limitation
    rows:
      - [Monitor fixed sites for unauthorized drones, Layer multiple detection tools and manual monitoring, Standard Aero-Ark plus Plexus, "OTC entry price reported at £4,500 excluding taxes", "No published false-positive, range, or uptime data"]
      - [Detect drones in dense urban terrain, Traditional radar degraded by urban shadows, Urban Aero-Ark variant, Architecture explicitly claims urban-specific design, No independent benchmark versus incumbent urban C-UAS systems]
      - [Build a shared air-and-ground operating picture, Merge detection data and field imagery into one console, Plexus platform with WAMI/HSI inputs, Reported coverage of 30 U.S. cities and 12 U.K. cities, No named integration or retention evidence]
      - [Support public-safety and defense response workflows, Procure tools that fit authority and mission context, Portable or sentry deployments framed for regulated buyers, Alignment with FAA public-safety authority and NATO C-UAS use cases, Procurement still depends on interoperability and standardized testing]
    notes: >-
      Benefits are public-source claims or buyer-context signals only; missing denominators, test
      results, and production references remain open diligence items.
    claimRefs: [CE003, CE005, CE009, CE010, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Sensor capture layer, Collect ADS-B / Remote ID / DJI packets / passive radar signals, Hardware performance in field conditions, Public source describes inputs but not tested detection quality]
      - [Urban adaptation layer, Mitigate radar-shadow constraints in cities, Programmable meta surfaces and conical horn transceiver hardware, Urban differentiation is plausible but still single-source]
      - [Edge processing layer, Run on-device AI classification on deployed nodes, Model quality and local compute at the edge, "No public precision, latency, or model-governance evidence"]
      - [Plexus command layer, Fuse airspace and ground-level monitoring in real time, Software integration and support operations, "No public API, status-page, or reliability artifact in assigned pool"]
      - [Mapping network layer, Add WAMI and hyperspectral feeds from Roark and third-party pilots, Pilot recruitment and partner-device participation, Outside-operator dependence can affect consistency and control]
      - [Buyer-assurance layer, Clear interoperability and procurement gates for defense/public-safety users, "Test ranges, standardized procedures, and compliance evidence", Adoption risk is shifted to proving repeatable performance under formal evaluation]
    notes: >-
      This architecture table mixes company-described components with external assurance gates to
      show where the operating model depends on unverified technical and procurement proof.
    claimRefs: [CE001, CE002, CE004, CE009, CE010, CE014, CE015]
