    title: Roark counter-UAS operating stack
    type: stack
    summary: >-
      The visible stack runs from detection hardware and edge processing into Plexus and then into
      an externally constrained buyer-assurance layer.
    data:
      layers:
        - label: Sensor collection
          detail: Core sensor inputs visible in assigned launch reporting.
          items:
            - ADS-B monitoring
            - Remote ID capture
            - DJI packet collection / decryption
            - Passive radar
        - label: Detection hardware
          modules:
            - Standard Aero-Ark
            - Urban Aero-Ark
          outputs:
            - Portable deployment
            - Sentry deployment
        - label: Edge processing
          detail: Claimed local processing layer that classifies detections on-device.
          items:
            - On-device AI processing
            - Local classification
        - label: Plexus platform
          modules:
            - Real-time airspace monitoring
            - Ground-level monitoring
        - label: Mapping network
          detail: Service layer that expands the operating picture with city-scale imagery feeds.
          items:
            - WAMI service footprint
            - HSI service footprint
            - Third-party pilot participation
        - label: Buyer-assurance gates
          outputs:
            - Interoperability requirements
            - Standardized testing
            - Purchase or lease procurement paths
    approximationNotes: >-
      Layer order reflects the authored operating model from assigned evidence; it is not a verified
      system diagram or proof that every component is production validated.
    claimRefs: [CE001, CE002, CE004, CE005, CE009, CE010, CE015]
