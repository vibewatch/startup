callouts:
  - calloutType: "risk"
    title: "Kill criteria before underwriting"
    body: >-
      Stop or materially reprice the case if the late-2025 financing cannot be independently
      reconciled, if standardized test evidence for target use cases is unavailable, or if
      export-control / cyber-assurance materials remain incomplete for government buyers.
    claimRefs: [CR003, CR006, CR007, CR015]
  - calloutType: "insight"
    title: "Highest-leverage diligence asks"
    body: >-
      The fastest way to de-risk the story is to request four packs: financing close
      documents, recent procurement or field-test results, named production deployments with
      outcomes, and the security/export-control dossier used in defense or public-safety
      sales.
    claimRefs: [CR001, CR006, CR012, CR015]
