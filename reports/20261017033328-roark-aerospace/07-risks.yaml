company:
  name: "Roark Aerospace"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Roark's highest current risks are not generic startup risks but proof-burden risks:
    the assigned public evidence still leaves financing verification, procurement
    qualification, interoperability performance, and security/export-control diligence
    partially unresolved. Demand for counter-UAS remains real, but the same public buyers
    creating the opportunity are also imposing rigorous use-case, testing, and technical
    compliance gates that can quickly turn into a thesis-breaker.
sections:
  - id: "risk-ranking"
    title: "Highest-severity risks center on proof, not market existence"
    body: >-
      The assigned evidence supports that Roark is active in a live counter-UAS market,
      but it does not support underwriting the company on narrative alone. An independent
      July 2025 DFM report page says its Roark analysis is framed around "capability
      gaps" and that what cannot be verified is explicitly flagged, while Nordic9's
      December 2025 financing note still labels the reported $210 million Series B at a
      $1.6 billion valuation as pending verification. That combination makes financing
      proof, disclosure quality, and technical substantiation the core residual risks:
      if independent evidence cannot verify the capital stack, customer proof, and test
      performance, the downside is not just slower diligence but a broken price-setting
      process for any new investment or strategic partnership.
    claimRefs: [CR001, CR003, CR015]
    figureRefs: [FR001]
  - id: "regulatory-procurement"
    title: "Qualification and procurement screens are a real regulatory-like gate"
    body: >-
      Roark sells into a category where official buyers are formalizing purchase screens
      rather than improvising them. NATO's 2026 C-UAS marketplace is structured around
      defined use cases, "best value" and "cheapest technically-compliant" awards, and
      standardized testing to prove performance before member nations buy. DHS's
      purchasing tool likewise tells first-responder agencies to score products against
      mission-fit rubrics instead of relying on vendor storytelling. For Roark, this
      means legal and regulatory diligence cannot be limited to searching for lawsuits or
      permits; the immediate gate is whether the company can document interoperability,
      technical compliance, and repeatable field performance well enough to pass formal
      procurement filters.
    claimRefs: [CR004, CR005, CR006, CR007, CR012]
    tableRefs: [TR001]
  - id: "operational-and-dependency"
    title: "Execution risk rises with rapid threat evolution and public-buyer dependence"
    body: >-
      The counter-UAS environment is moving quickly enough that slow product iteration can
      become a risk event. AIRCOM's 2026 industry agenda emphasizes interoperability,
      operational relevance, and future capability development, while Defense News quotes
      NATO saying Ukrainian drone tactics changed every two to three weeks in 2023-2025
      and that innovation ranges will run repeated test cycles. Roark's own public
      positioning, as summarized by DFM, is ambitious: a multi-domain platform and one of
      the world's largest sensor networks. That ambition creates a corresponding
      execution burden around integration, reliability, and refresh cadence. The demand
      backdrop is supportive, but DefenseScoop's FY26 budget figures also underline that
      public-program timing and appropriations remain a meaningful concentration risk.
    claimRefs: [CR002, CR006, CR008, CR009, CR010, CR013, CR014]
    tableRefs: [TR002, TR003]
  - id: "mitigations-and-kill-criteria"
    title: "Mitigations must be documentable, and kill criteria should be explicit"
    body: >-
      The current evidence suggests a workable mitigation path, but it is documentary
      rather than rhetorical. Before underwriting valuation or growth assumptions, Roark
      should be able to produce signed financing documents, independently attributable
      customer deployments, recent performance or procurement-test evidence, and a clean
      export-control / cyber-assurance package suitable for defense and public-safety
      buyers. Until those materials exist, the practical kill criteria are straightforward:
      if the late-2025 round cannot be independently reconciled, if standardized testing
      evidence is not available, or if security and compliance documentation remains
      incomplete, the prudent stance is to treat the company as commercially interesting
      but still diligence-constrained.
    claimRefs: [CR003, CR006, CR012, CR015]
