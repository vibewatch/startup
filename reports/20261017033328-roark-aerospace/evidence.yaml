evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Named board members, additional executives, and an up-to-date operating org chart.
    whyItMatters: >-
      The public record currently points to a founder-centric narrative and does not show whether operating or
      governance depth matches the valuation story.
    diligencePath: Request the current board deck, org chart, and biographies for functional leaders below the CEO.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: funding
    missingEvidence: Signed cap table, named investors, and preference-rights bridge for the late-2025 financing.
    whyItMatters: >-
      Third-party sources disagree on total funding, first-round timing, and valuation, so the capital structure cannot
      be underwritten from profile pages alone.
    diligencePath: Obtain executed financing documents, post-money cap table, and investor-side confirmation of round size and terms.
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: customer-evidence
    missingEvidence: Named customer references, deployment case studies, and customer concentration or retention metrics.
    whyItMatters: >-
      Scale claims look plausible, but the assigned evidence does not show which customers are driving revenue or
      whether deployment volume converts into durable economics.
    diligencePath: Request customer roster by segment, top-contract list, renewals, and deployment proof tied to revenue.
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: roark-sam
    missingEvidence: >-
      Named program budgets, average deal sizes, pipeline by segment, and deployed-site counts that isolate Roark’s
      reachable spend by defense, public safety, and infrastructure.
    whyItMatters: >-
      Without contractable spend and conversion data, public category signals cannot be turned into a defensible revenue
      bridge or valuation multiple check for Roark.
    diligencePath: >-
      Request a pipeline cut by buyer segment, top opportunities, ACV / ARR mix, deployed-site counts, and win-loss data
      tied to specific NATO or national procurement programs.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
      - TM003
  - type: enumeration-incomplete
    severity: material
    topic: market-size-methodology
    missingEvidence: >-
      A third-party study using one denominator for counter-UAS spend instead of mixing budgets, supplier counts, and
      one-company revenue benchmarks.
    whyItMatters: >-
      The current public lenses are directionally useful but not directly comparable, which makes any simple TAM/SAM/SOM
      arithmetic vulnerable to overstatement or double counting.
    diligencePath: >-
      Obtain a sector study or build an internal model that separates defense, public-safety, and enterprise counter-UAS
      spend by geography and buyer type, then reconcile it to public budgets and peer disclosures.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: budget-owner-proof
    missingEvidence: >-
      Named public-safety or infrastructure contracts showing the procuring entity, end user, and contract model for
      managed drone-detection deployments.
    whyItMatters: >-
      The buyer / user / payer map is plausible from peer evidence, but it is not yet proven for Roark specifically
      outside the defense workflow.
    diligencePath: >-
      Collect awarded RFPs, framework agreements, and case studies that name the budget owner, operational user, and
      commercial structure for non-defense deployments.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM001
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Public list pricing, realized contract pricing, or disclosed unit economics for Roark, D-Fend, and Fortem.
    whyItMatters: >-
      Without comparable commercial terms, the pricing table can only compare packaging structure and unknowns rather
      than true buyer economics.
    diligencePath: >-
      Request current price cards, sample contracts, and discounting policies from Roark and named peers or
      procurements.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: deployment-validation
    missingEvidence: Named customer references, standardized test results, or independent deployment case studies for Roark.
    whyItMatters: >-
      Roark's moat case depends on whether claimed city coverage translates into trusted repeatable procurement wins
      against incumbents.
    diligencePath: Obtain named deployment references, formal evaluation results, and renewal data from Roark or public procurers.
    relatedQuestionRefs:
      - QP003
      - QP007
  - type: conflicting-data
    severity: material
    topic: funding-verification
    missingEvidence: Primary financing documents or independently verified investor disclosure for the late-2025 Series B.
    whyItMatters: >-
      Competitive scale comparisons change materially if Roark's valuation and funding round are overstated or
      structured unusually.
    diligencePath: Request signed financing documents, investor confirmations, and cap-table support for the claimed Series B.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Current cash balance, monthly burn, committed capex, debt obligations, and runway sensitivity.
    whyItMatters: >-
      Capital raised does not establish liquidity, and runway is the core underwriting variable for a private
      defense-technology company with hardware and service delivery components.
    diligencePath: Request latest management accounts, cash bridge, board reporting pack, and debt schedule.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Executed customer contracts showing price, term, deployment scope, discounts, and service-level obligations.
    whyItMatters: >-
      Offering structure alone cannot establish revenue quality, gross margin, or whether services are sold at
      economically rational rates.
    diligencePath: Review top ten contracts by ACV or deployment value and reconcile them to invoicing and gross-margin reporting.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: customer-traction
    missingEvidence: Named production deployments, customer count, renewals, utilization, and concentration metrics.
    whyItMatters: >-
      The strongest public traction claim in the assigned pool is still company-claimed and historical, so commercial
      validation remains weak.
    diligencePath: Obtain customer reference calls, deployment roster, renewal data, and cohort revenue breakdown.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI001
      - TI003
  - type: stale
    severity: material
    topic: funding-verification
    missingEvidence: Closed-round confirmation for the reported December 2025 Series B and evidence of the proceeds actually received.
    whyItMatters: >-
      A pending-verification funding headline should not be treated as equivalent to unrestricted cash available for
      operations.
    diligencePath: Review signed financing documents, updated cap table, wire receipts, and post-close board approvals.
    relatedQuestionRefs:
      - QI005
      - QI006
  - type: missing-source
    severity: material
    topic: assurance-gaps
    missingEvidence: Public certifications, test-range results, named integrations, or uptime/status records for Aero-Ark and Plexus.
    whyItMatters: >-
      Late-stage defense and public-safety buyers usually need repeatable performance and assurance proof before scaled
      deployment.
    diligencePath: >-
      Request formal test reports, certifications, integration references, and service-level documentation from
      management.
    relatedQuestionRefs:
      - QE006
      - QE007
  - type: private-evidence-only
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A credible public developer or practitioner-community proxy showing technical adoption, integration activity, or
      field support depth.
    whyItMatters: >-
      Without a developer or practitioner signal, it is harder to judge whether Plexus and the broader stack are easy to
      integrate, support, and extend.
    diligencePath: >-
      Ask for API/customer integration references, partner implementation notes, or public practitioner forums that show
      real technical usage.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: deployment-proof
    missingEvidence: Named production deployments, customer outcomes, or referenceable operating environments for Aero-Ark or Plexus.
    whyItMatters: >-
      The current evidence is strong enough to describe the package but weak on validating production-scale durability
      and real user outcomes.
    diligencePath: Obtain named customer references, deployment counts by use case, and pilot-to-production conversion evidence.
    relatedQuestionRefs:
      - QE005
      - QE008
  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: Named production customers, deployment scope, and quantified outcomes for at least three Roark accounts.
    whyItMatters: >-
      Without named references, public customer-proof quality remains too weak to judge adoption durability or
      referenceability.
    diligencePath: >-
      Obtain customer references or customer-authored case studies that identify the buyer, site count, use case, and
      production status.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: durability-gap
    missingEvidence: NRR, GRR, logo churn, renewal rates, contract length, and cohort behavior.
    whyItMatters: >-
      These metrics determine whether Roark's installed footprint is recurring and sticky or still dependent on one-off
      programs.
    diligencePath: Request cohort tables, renewal schedules, and contract summaries from management or the data room.
    relatedQuestionRefs:
      - QU008
  - type: private-evidence-only
    severity: material
    topic: concentration-risk
    missingEvidence: Top-customer revenue share, top-program dependence, and channel-partner concentration.
    whyItMatters: >-
      A defense-heavy book can look large in units deployed while remaining fragile if revenue is concentrated in a few
      programs.
    diligencePath: Request a customer-concentration schedule by revenue, bookings, and gross margin for the latest twelve months.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: deployment-footprint
    missingEvidence: Denominators linking devices and cities to named sites, active customers, and production status.
    whyItMatters: >-
      The footprint claims are directionally helpful but not decision-grade without a mapping to paying accounts and
      live deployments.
    diligencePath: Reconcile the installed-base and geography figures to a customer roster with production, pilot, and churn flags.
    relatedQuestionRefs:
      - QU002
      - QU003
    relatedTableRefs:
      - TU002
      - TU003
  - type: missing-source
    severity: blocking
    topic: financing-verification
    missingEvidence: Signed Series B close documents, investor list, cap table bridge, and post-close valuation support.
    whyItMatters: The round and valuation narrative are central to price-setting, governance assessment, and downside protection.
    diligencePath: Request executed financing documents and reconcile them to investor confirmations and Companies House filings.
    relatedQuestionRefs:
      - QR001
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
