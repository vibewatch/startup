company:
  name: "Roark Aerospace"
chapter:
  number: 4
  title: "Financials"
  summary: "Public evidence supports a blended monetization model built around Aero-Ark unit sales, rapid deployments, and managed service coverage, plus a reported $260 million cumulative funding base with a pending-verification $210 million Series B headline. It does not disclose revenue, margin, burn, or current cash, so the chapter can explain the revenue architecture and financing dependency but cannot underwrite Roark's actual runway or unit economics from public sources alone."
sections:
  - id: "revenue-architecture"
    title: "Revenue architecture is visible, but realized pricing is not"
    body: >
      The assigned public sources support a three-lane revenue model rather than a single
      hardware sale motion. Trade coverage of the 2023 Aero-Ark launch says the product can
      be bought outright, deployed temporarily through rapid-deployment units, or consumed as
      a managed detection service around Roark-operated installations. That mix matters because
      it implies different revenue-recognition and margin profiles: unit sales would be more
      hardware-like and lumpy, while rapid deployment and coverage-as-a-service could convert
      customer demand into time-bound or recurring service contracts. However, the same evidence
      set stops at offering structure. None of the retained sources disclose list pricing,
      realized contract values, discounting, or attach rates between hardware, deployment,
      monitoring, and mitigation. The right takeaway is therefore that Roark appears to have a
      plausible multi-modal monetization design, but not a publicly evidenced price book or
      revenue-quality profile.
    claimRefs: ["CI001", "CI002", "CI003", "CI012", "CI013"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "procurement-and-unit-economics"
    title: "Procurement complexity can be inferred; unit economics cannot"
    body: >
      Official and market sources point to a consultative procurement environment. DHS frames
      C-UAS buying around mission requirements, terrain, radio-frequency conditions, and budget,
      while Defense News reports that NATO is structuring a marketplace around standardized use
      cases, best-value comparisons, and lease-versus-purchase options. That supports a sales
      motion with technical evaluation and channel friction rather than simple commodity checkout,
      which usually lengthens sales cycles and raises pre-sale effort. At the same time, the
      assigned public evidence provides no direct read on CAC, payback, gross margin by product
      line, utilization of the service network, or customer concentration. Even the most useful
      market-demand signals, including a $3.1 billion FY26 U.S. counter-UAS budget request, only
      show that buyer spend exists; they do not show Roark's win rate, pricing power, or service
      delivery efficiency. Public diligence can therefore describe the funnel mechanics and demand
      context, but not quantify commercial efficiency.
    claimRefs: ["CI007", "CI008", "CI009", "CI012"]
    tableRefs: ["TI003"]
  - id: "capital-adequacy-and-verdict"
    title: "Capital headlines exist, but runway remains a diligence blocker"
    body: >
      The cleanest public financing datapoint in the assigned pool is Nordic9's company profile,
      which shows $260 million of total investments, alongside a December 2025 item describing a
      $210 million Series B at a $1.6 billion valuation. But that same funding note explicitly
      says the deal is still pending verification, so it should be treated as a valuation and
      round headline, not confirmed cash on hand. Public sources do show that Roark is still
      carrying fixed operating commitments such as a 13,650-square-foot Cambridge lease, while
      competitors like D-Fend are large enough to cite thousands of deployments and expected 2026
      revenue of $185 million. The underwriting conclusion is therefore cautious: Roark looks
      financed enough to have built a real commercial footprint, but the current evidence base is
      too thin to judge whether that capital structure supports efficient growth, healthy margins,
      or adequate runway into the next funding milestone.
    claimRefs: ["CI004", "CI005", "CI006", "CI010", "CI011", "CI014"]
