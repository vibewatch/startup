    claimRefs: ["CI001", "CI007", "CI008", "CI012", "CI013", "CI014"]
callouts:
  - calloutType: "strength"
    title: "Multi-modal monetization is the clearest public positive"
    body: "Roark does not appear to rely on a single transaction type: the public record shows outright sales, temporary deployments, and a managed-service model, which could widen buyer fit if the economics are real."
    claimRefs: ["CI001", "CI002", "CI013"]
  - calloutType: "risk"
    title: "Revenue quality is still opaque"
    body: "The same source pool that shows the offering mix does not disclose realized pricing, revenue, gross margin, CAC, payback, or customer concentration, so the financial story remains materially under-evidenced."
    claimRefs: ["CI012", "CI014"]
  - calloutType: "insight"
    title: "Demand backdrop is not the same as capture proof"
    body: "Government budget and procurement signals are helpful context, but they do not show that Roark wins those programs or does so at attractive margins."
    claimRefs: ["CI007", "CI008", "CI009"]
