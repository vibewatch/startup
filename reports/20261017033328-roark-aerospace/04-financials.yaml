          "Promotional framing only; no verifiable rate card",
          "The claim that access comes at a fraction of physical-deployment cost is not a realized pricing datapoint",
          "SI002"
        ]
      - [
          "Procurement benchmark in C-UAS market",
          "NATO says purchasing and lease options can both sit inside the same marketplace",
          "Best-value and cheapest-technically-compliant comparisons can pressure realized pricing",
          "SI007"
        ]
    notes: "This table separates public monetization structure from actual commercial terms; no retained source discloses Roark's realized prices."
    claimRefs: ["CI001", "CI002", "CI008", "CI012", "CI013"]
  - id: "TI003"
    title: "Unit economics table"
    columns:
      - "Metric"
      - "Value / null"
      - "Confidence"
      - "Why it matters"
      - "Diligence ask"
    rows:
      - [
          "Revenue / ARR",
          null,
          "low",
          "Without a public revenue base, growth and scale cannot be normalized",
          "Provide FY2024-FY2026 revenue bridge and ARR split if any subscription revenue exists"
        ]
      - [
          "Gross margin",
          null,
          "low",
          "Cannot distinguish hardware margin from managed-service margin",
          "Provide gross margin by unit sale, deployment service, and software/monitoring component"
        ]
      - [
          "CAC / payback",
          null,
          "low",
          "Procurement-led sales cycles can be long and capital intensive",
          "Provide funnel stages, win rates, CAC by segment, and payback by channel"
        ]
      - [
          "Cash / burn / runway",
          null,
          "low",
          "Capital raised is not the same as cash available to absorb operating burn",
          "Provide latest cash balance, monthly burn, committed spend, and runway sensitivity"
        ]
      - [
          "Capital raised",
          "260m total investments reported; 210m Series B headline marked pending verification",
          "low",
          "Funding headlines anchor financing history but do not prove current liquidity",
          "Provide closed-round documents, cap table, and evidence of proceeds received"
        ]
      - [
          "Facility footprint",
          "13,650 sq ft Cambridge lease in Q1 2026",
          "medium",
          "Physical footprint implies continuing fixed-cost obligations even without a public burn figure",
          "Provide lease term, rent, fit-out cost, and other fixed operating commitments"
        ]
    notes: "Null means unavailable in the assigned public sources; confidence describes the public datapoint, not Roark's underlying business quality."
    claimRefs: ["CI005", "CI006", "CI011", "CI012", "CI014"]
