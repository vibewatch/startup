slug: roark-aerospace
runDate: 2026-10-17
company:
  name: Roark Aerospace
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Roark Aerospace looks like a real London-based counter-UAS company with
    support for its 2022 founding, UK legal entity, product pricing history,
    late-2025 financing, and a Q1 2026 Cambridge lease. The bigger diligence
    issue is verification quality rather than existence: retained third-party
    sources disagree on total funding, the first-round date, and valuation,
    while public leadership and investor disclosure remain thin.
sections:
  - id: identity-stage
    title: Identity, footprint, and public offer
    body: >-
      Retained profile sources consistently place Roark Aerospace in London and
      describe it as a private Series B counter-UAS company founded in 2022,
      while Tracxn ties the business to an active UK legal entity incorporated
      on 2023-11-30. The assigned evidence also gives a concrete historical
      product snapshot rather than just a generic defense-tech label: a
      company-issued December 2023 pricing release described Aero-Ark hardware,
      a Detection as a Service subscription, and a Rapid Deploy day-rate
      service. That combination supports a blended hardware-plus-service model,
      but the last retained direct pricing evidence is old enough that current
      commercial terms should be rechecked during management diligence.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-governance
    title: Leadership, governance, and disclosure depth
    body: >-
      Leadership disclosure is the weakest part of the public record in this
      chapter. Tracxn names Patton French as founder and CEO, but the assigned
      pool does not surface a board list, another named executive, or a fuller
      governance map that would reduce key-person risk. Public scale markers are
      directionally stronger than the leadership detail: Tracxn attributes more
      than 55,000 deployed devices, more than 3,000 end users, a £100M-£500M
      annual revenue band as of 2025-11-30, and 244 employees as of 2025-12-31.
      Those datapoints suggest a business operating at material scale, but they
      are still profile-level claims rather than audited disclosures.
    claimRefs: [CO005, CO006, CO007, CO015]
    tableRefs: [TO002]
  - id: financing-valuation
    title: Financing history is material but not cleanly verified
    body: >-
      Roark's financing narrative is substantial enough to matter but messy
      enough to warrant caution. Multiples reports $285M raised across two
      rounds, with a $75M first round in January 2025, a $210M Series B in
      December 2025, and a $1.8B valuation for that Series B. Tracxn conflicts
      with the same story by reporting $287M total funding and saying the first
      funding round occurred in May 2025. Nordic9 preserves the same $210M
      Series B headline but at a lower $1.6bn valuation and explicitly marks
      the deal as pending verification. The result is enough evidence to treat a
      late-2025 growth financing as plausible, but not enough to accept the
      exact cap-table narrative without primary documents.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO003]
  - id: milestones-context
    title: Recent operating signals point to expansion in an active category
    body: >-
      The retained evidence shows both company-specific momentum and a sector
      backdrop that can support it. Cushman & Wakefield says Roark leased 13,650
      square feet in Cambridge in Q1 2026, which is a concrete operating-footprint
      signal after the late-2025 financing narrative. More broadly, 2026 buyer
      and strategic activity suggests counter-UAS remained commercially active:
      Defense News reported NATO building a marketplace with 18 C-UAS options,
      DefenseScoop reported a $3.1B U.S. FY26 counter-UAS request, and Motorola
      said it agreed to acquire D-Fend for $1.5B. Those category signals do not
      verify Roark's own traction, but they do make the company's market timing
      more believable than a standalone slideware story would be.
    claimRefs: [CO008, CO016]
    figureRefs: [FO001]
