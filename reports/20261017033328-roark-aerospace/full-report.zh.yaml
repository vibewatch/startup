            body: >
              保留的公开记录显示 Roark 不是空壳公司：Tracxn 将其画像与活跃的英国法人 RO-ARK AEROSPACE LIMITED 关联，Companies House 显示该实体已提交截至 2025 年
              11 月 30 日的申报。融资证据方向上支持该故事，但并不干净。Nordic9 报道 2025 年 12 月 18 日完成 $210 million B 轮，估值 $1.6
              billion；但同一条目明确称交易仍待核验。Tracxn 另称 Roark 两轮合计融资 $287 million，说明融资活动规模不小；不过保留的公开来源没有披露投资人、清算优先权、参与权或其他决定
              头条价格对新投资人是否具有经济真实性的股权结构表保护条款。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: 支撑案例的因素与击穿因素
        blocks:
          - type: paragraph
            body: >
              故事中可投资的部分是市场拉力加运营规模信号。NATO 将 2026 年 AIRCOM 行业日用于 C-UAS 能力开发；Defense News 报道 NATO 计划建立包含 18
              个候选系统的市场；DefenseScoop 称 FY26 美国预算申请包含跨军种 $3.1 billion 的反无人机资金。Tracxn 还把 £100 million 至 £500 million 的收入区间和
              244 名员工归于关联法人；若核实，这将是有意义的规模。反论点是价格支撑落后于叙事：Tracxn 列出 296 个活跃竞争者，Unmanned Airspace 描述了 654 家公司和超过 1,000
              套系统的目录，而 NATO 采购设计明确强调最佳价值和技术合规前提下的最低价格，而非品类领导者溢价。
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: 情景框架与入场纪律
        blocks:
          - type: paragraph
            body: >
              估值问题不是 Roark 是否服务于真实市场；公开记录已经回答“是”。问题在于，当前入场价格相对于可独立观察的基准和仍缺失的下行保护是否合理。CompaniesMarketCap 在 2026 年 10 月将
              DroneShield 市值列为 $1.0 billion，因此 Roark 所报 $1.6 billion 私募估值已经要求投资人在接受更少公开披露的同时，为一家在营上市可比公司支付更高价格。只有尽调证明
              Roark 接近其收入区间上端、客户质量可重复且本轮条款干净，这才可能合理。在没有这些证明前，纪律化立场应是继续研究，而不是买入。
            claimRefs:
              - CV004
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: 最终尽调要求与论点击穿触发器
        blocks:
          - type: paragraph
            body: >
              下一步尽调很直接：核实融资头条
              背后的经济性。已签署的融资材料应确认实际投后估值、领投人、清算顺位、参与权，以及任何类债务或项目融资叠加。商业尽调应确认收入区间来自经常性软件、硬件出货、服务还是一次性项目，并确认具名客户背调是否支持持久采用。若融资核验失败，客户集中度或毛利质量明显弱于规模叙事，或采购证据显示
              Roark 参与拥挤市场却没有足以支撑相对最佳公开基准溢价的中标率或性能证明，论点就会失效。
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV014
              - CV016
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 当前判断
            body: |
              继续研究是正确判断：市场信号具备投资价值，但价格信号尚不够干净。投资人应把所报估值视为尽调目标，而不是已经通过核验的投资判断锚点。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV015
              - CV016
          - type: callout
            title: 仍可能出错的地方
            body: |
              最大风险不是品类需求，而是为一家融资条款、客户质量和利润率持久性都比融资头条更不透明的公司支付过高价格。
            calloutType: risk
            claimRefs:
              - CV005
              - CV010
              - CV014
              - CV016
          - type: callout
            title: 什么会把本章判断推向买入
            body: |
              经核验的 term sheet、具名领投人、持久客户证明和当前财务质量，若能让 Roark 看起来强于可见的公开可比公司，便会实质性改变投资案例。
            calloutType: assumption
            claimRefs:
              - CV006
              - CV007
              - CV014
              - CV015
