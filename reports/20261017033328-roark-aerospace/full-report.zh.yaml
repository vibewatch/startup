              最详细的技术信息来自关于 Roark 2025 年 1 月发布的独立报道。按该报道，标准 Aero-Ark 节点结合 ADS-B、Remote ID、DJI 数据包采集 /
              解密和被动雷达；城市版本则换用可编程超材料表面和锥形喇叭收发单元，以应对密集城市中的雷达阴影问题。Roark 的地图层似乎还依赖外部运营者参与，因为其飞手招募项目向第三方无人机飞手提供资质支持、免费
