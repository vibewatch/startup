  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 收入质量接近 Tracxn 区间上沿，客户证明有力，轮次条款清晰。
        - 所报道的约 $1.6bn 估值可以维持甚至上升，因为公司应当相对于公开可比公司和拥挤市场的平均水平享有溢价。
        - 客户质量或条款仍未通过尽调。
        - 只有融资和客户证明都明显变得更扎实，这一情景才有可能实现。
      - - 基准
        - Roark 确实存在且具备商业相关性，但证明仍然参差不齐，轮次条款仍部分不透明。
        - 只有低于所报道估值入场，或具备强大的下行保护，交易才成立，因为公开可比公司尚未验证私人市场溢价。
        - 优先权悬置、集中度或利润率质量可能吞噬回报。
        - 这与留存公开记录最为一致。
      - - 悲观
        - 收入质量、客户持久性或采购牵引力与规模叙事不匹配。
        - 下行可能跟随或跌破 $1.0bn 的公开基准，因为当前估值相当于为未经验证的执行能力付费。
        - 倍数压缩、低价轮风险及拥挤的采购竞争。
        - 如果核心尽调事项仍无法取得，这一情景就具有可信度。
      - - 离场触发条件
        - 融资核验失败，或当前运营证据无法填补核心缺口。
        - 不要按报道价格推进；只有拿到硬证据或获得实质性更优的入场条款后，才重新考虑。
        - 估值周围存在虚假精确、隐藏优先权或商业验证薄弱。
        - 如果尽调材料仍不完整，则应立即触发。
    notes: 这些情景属于定性判断，因为现有留存的公开来源没有披露足够精确的估值输入、条款清单条款或客户经济数据，无法建立更窄的模型。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV008
      - CV010
      - CV014
      - CV015
      - CV016
