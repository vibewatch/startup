            title: 灵活打包有利于 Roark，但也让买方比较成为常态
            body: Roark 的 as-a-service 和快速部署定位符合 NATO 采购方向，但同一趋势也降低了切换成本，因为买方可以在承诺之前测试、租赁并比较更多供应商。
            calloutType: insight
            claimRefs:
              - CP001
