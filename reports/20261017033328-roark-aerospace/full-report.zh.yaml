      - number: '4.3'
        title: 融资头条存在，但现金 runway 仍是尽调阻碍
        blocks:
          - type: paragraph
            body: >
              指定资料池中最干净的公开融资数据点来自 Nordic9 公司画像：总投资额为 $260 million；其 2025 年 12 月条目还描述了 $210 million B 轮融资，估值 $1.6
              billion。但同一融资说明明确称交易仍待核验，因此应把它视为估值和轮次头条，而不是已确认的在手现金。公开来源确实显示，Roark 仍承担 13,650 平方英尺剑桥租约等固定运营承诺；D-Fend
              等竞争者则大到可以披露数千次部署和预计 2026 年收入 $185 million。因此投资判断应保持谨慎：Roark
              看起来有足够融资来建立真实商业足迹，但现有证据太薄，无法判断其资本结构是否支撑高效增长、健康利润率或维持到下一融资里程碑的 runway。
