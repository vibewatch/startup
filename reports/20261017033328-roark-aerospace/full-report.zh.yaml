  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构清晰可见，但实际价格不可见
        blocks:
          - type: paragraph
            body: >
              指定公开来源支持三条收入路径，而不是单一硬件销售。关于 2023 年 Aero-Ark 发布的行业报道称，产品可以直接购买，也可以通过快速部署单元临时部署，或在 Roark
              运营的安装点周边以托管检测服务形式使用。这一组合意味着不同的收入确认和利润率结构：单元销售更像硬件收入，起伏也更大；快速部署和覆盖即服务则可能把客户需求转成限时或经常性服务合同。但同一批证据只覆盖产品结构。保留来源没有披露目录价格、实际合同金额、折扣，或硬件、部署、监测和处置之间的附加率。合理结论是，Roark
              似乎拥有可信的多模式变现设计，但没有公开证据支持的价目表或收入质量画像。
            claimRefs:
              - CI001
              - CI002
