      - number: '3.3'
        title: 产品打包与采购动态降低切换摩擦
        blocks:
          - type: paragraph
            body: >-
              Roark 最清晰的公开差异化来自商业打包，而非某条显然独特的采购渠道。Aero-Ark 可一次性购买，也可通过快速部署服务或 as-a-service 模式使用，这对试点和事件驱动型用例很有商业价值。但
              NATO 的市场设计也在朝同一方向发展，强调挑战式采购、标准化测试，以及购买和租赁选项。这种机制降低了锁定，因为买方可以按用例和成熟度评估替代方案，而不必预先绑定一段定制化、长周期的供应商关系。
            claimRefs:
              - CP001
              - CP006
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP006
              - CP011
              - CP012
      - number: '3.4'
        title: Roark 尚未证明可信部署规模，业务持久性仍停留于叙事
        blocks:
          - type: paragraph
            body: >-
              指定资料池没有显示 Roark 达到大型竞争者所展示的公开证据栈。Roark 自称覆盖超过 70
              座城市且月度增长迅速，但资料池中的负面来源称该公司伴随异常高的估值说法出现，投资人细节却难以核验；一家二级交易追踪机构仍将 2025 年末融资标为待核验。与此同时，增长中的国防预算和联盟采购项目可能吸引更多
              成熟厂商参与。因此，若 Roark 只能依靠灵活的产品打包故事，而不能展示标准化测试、具名部署或同等信任信号，其护城河看起来很脆弱。
            claimRefs:
              - CP002
              - CP003
              - CP010
              - CP014
      - number: '3.5'
        title: 展示
        blocks:
          - type: callout
            title: 头部资本支持的竞争回应是主要护城河压力
            body: >-
              D-Fend 和 Fortem 不只是功能竞争者；它们正越来越多地借助 Motorola 和 Lockheed 分销，这提高了买方把 C-UAS 与采购信任、服务及生态支持打包购买的可能性，而公开证据还未显示
              Roark 具备同等能力。
            calloutType: risk
