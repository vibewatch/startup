  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议从真实需求 / 真实公司信号出发，但价格支撑存在缺口，因此结论仍是继续研究。
    data:
      nodes:
        - id: demand
          label: C-UAS 需求真实存在
          detail: NATO 和 DoD 都在 2026 年提升了反无人机活动的优先级。
        - id: operating-proof
          label: Roark 展现运营规模信号
          detail: 该公司与一个活跃的英国实体有关联，并有报道的收入区间和员工规模。
        - id: financing-headline
          label: 融资轮标题积极
          detail: Nordic9 报道 $210m 的 Series B，估值为 $1.6bn。
        - id: verification-gap
          label: 价格支撑不完整
          detail: 同一融资项目仍有待核验，公开条款也未披露。
        - id: benchmark-and-competition
          label: 基准和竞争都很苛刻
          detail: DroneShield 的公开市值为 $1.0bn，而买方可以在拥挤的供应商群中比较。
        - id: recommendation
          label: 建议：继续研究 / 估值偏高
          detail: 在条款、客户证明和当前财务质量得到核验前，不要将报道估值计入投资判断。
      edges:
        - from: demand
          to: operating-proof
          label: 类别相关性
        - from: operating-proof
          to: financing-headline
          label: 引发估值兴趣
        - from: financing-headline
          to: verification-gap
          label: 需要尽调
        - from: verification-gap
          to: benchmark-and-competition
          label: 与市场证明对比
        - from: benchmark-and-competition
          to: recommendation
          label: 严守入场纪律
    approximationNotes: 该流程属于定性判断，总结本章逻辑，而非数字估值模型。
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV009
      - CV010
      - CV011
      - CV015
      - CV016
