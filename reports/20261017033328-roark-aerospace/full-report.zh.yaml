            body: >-
              指定证据中的 Roark 不像实验室阶段的概念公司。Cushman & Wakefield 将其列为剑桥办公需求中的“autonomous defence systems”租户，Nordic9 报道了 2025
              年末 B 轮融资，不过仍标记为待核验。这些是商业化和规模化信号，不是产品技术领先的证明。就差异化而言，证据显示 Roark 试图以集成系统竞争，把固定 / 移动探测、共享软件层和城市级地图数据流结合起来。在
              Unmanned Airspace 统计数百家 C-UAS 供应商和超过 1,000
              个系统条目的市场中，这一定位有一定道理，但资料池的公开记录尚未给出能让差异化长期成立的基准数据、具名集成成果或认证证据；这些仍只是资料层面的说法，并非经审计披露。
