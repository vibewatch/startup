  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 已有充分证据支持公共部门买方资格审查，但没有证据支持指定客户转化和持续性。
    data:
      items:
        - label: 需求信号出现
          actor: 政府和盟友安全买方
          stage: 需求
          channel: 政策和采购论坛
          touchpoints:
            - 美国国土安全反无人机政策扩大了设施防御授权
            - AIRCOM Industry Day 2026 突出了互操作性和运营相关性
        - label: 使用场景明确
          actor: NATO 和公共部门项目团队
          stage: 资格审查
          channel: C-UAS 挑战设计
          touchpoints:
            - NATO 明确的使用场景包括点防御、区域防御和边境防御
            - 静态、可部署和全机动配置均在范围内
        - label: 先测试后购买的路径开启
          actor: 盟国和采购机构
          stage: 评估
          channel: 市场平台和试验场
          touchpoints:
            - NATO 表示合同将包含采购和租赁选项
            - 共同资金让各国能在做出采购决定前测试系统
        - label: Roark 商业模式契合这一动线
          actor: Roark 和买方采购团队
          stage: 商业契合
          channel: 适合服务和租赁的采购动线
          touchpoints:
            - Dealroom 描述了一种基于订阅的无人机探测即服务模式
            - 该产品面向政府、军方和企业部门
        - label: 声称的覆盖范围浮现
          actor: Roark 运营网络
          stage: 部署
          channel: 声称的装机基础和地域覆盖
          touchpoints:
            - Dealroom 称，截至 2025 年，全球已部署超过 30,000 台反无人机设备
            - Dealroom 称，该服务网络已覆盖美国 30 个城市和英国 12 个城市
        - label: 可供参考的客户证据断裂
          actor: 投资人和尽调团队
          stage: 证据缺口
          channel: 外部验证
          touchpoints:
            - 没有留存来源提供具名生产客户、留存指标或头部客户占比
            - Nordic9 仍将 Series B 项目标记为有待核验
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU012
      - CU013
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险集中在融资核验、采购资格审查和快速周期运营证明上，而不只是终端市场需求。
    data:
      columns:
        - label: 极低可能性
        - label: 低可能性
        - label: 中低可能性
        - label: 中高可能性
        - label: 高可能性
        - label: 极高可能性
      rows:
        - label: 关键影响
          values:
            - null
            - null
            - null
            - label: 融资证明缺口
              detail: Series B 和 $1.6bn 估值仍有待核验。
              note: 可能削弱价格信心和治理层面的投资判断。
            - label: 技术合规关卡
              detail: 获奖取决于技术合规且经过测试的使用场景表现。
              note: 试验失败可能切断核心采购渠道。
            - label: 资格审查失败
              detail: 获奖取决于技术合规且经过测试的使用场景表现。
              note: 试验失败可能切断核心采购渠道。
        - label: 高影响
          values:
            - null
            - label: 预算时点
              detail: C-UAS 需求有实质意义，但公开预算的时点仍然重要。
              note: 收入可能随项目日程和拨款变化。
            - label: 互操作性压力
              detail: 买方强调互操作性和运营相关性。
              note: 即使市场有资金，集成缺口也可能侵蚀中标率。
            - label: 威胁周期淘汰
              detail: 运营战术以周为单位演变，迫使系统快速刷新。
              note: 迭代缓慢会削弱现场可信度。
            - null
