            body: >-
              公开证据显示，Roark 销售的是捆绑式反无人机系统工作流，而非单一传感器。可见产品从 Aero-Ark 探测节点开始，叠加 Plexus 监测平台，再延伸到 WAMI
              和高光谱成像服务，把额外空中数据输入同一运营视图。这一点很重要，因为公共安全、场地安保和国防买家通常采购的是“探测、分类、监测、响应”的运营工作流，而不是分别购买彼此割裂的组件。现有证据更能说明组合声称包含什么，尚不能证明持续生产使用；但产品形态本身足够具体，可以按多组件系统而非泛泛的反无人机营销来评估。
