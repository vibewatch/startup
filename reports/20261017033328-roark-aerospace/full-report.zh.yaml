      - number: '3.2'
        title: 既有厂商的规模与分销是最清晰的竞争威胁
        blocks:
          - type: paragraph
            body: >-
              资料池中最有力的公开基准不是同样不透明的早期初创公司，而是拥有已验证部署和强大渠道的规模化厂商。Motorola 称 D-Fend 已在 30 多个国家完成数千次部署，预计 2026 年收入为 $185
              million；Fortem 则称 Lockheed Martin 的新投资旨在加速 Sanctum 内的生产和部署。这两份画像都说明，Roark
              面对的是已经把产品能力、采购信任、集成支持和长期国防或公共安全关系结合起来的供应商。
            claimRefs:
