      - number: '2.3'
        title: 买方地图、需求驱动与采用路径
        blocks:
          - type: paragraph
            body: >-
              最清晰的买方群体是盟国和各国的国防采购部门；其问题紧迫，并明确涉及互操作性、快速部署和真实运营条件下的验证。NATO
              和美国陆军的表述显示，需求覆盖点防御、区域防御、边境防御，以及固定、可部署和移动配置，意味着存在多条采购路径，而不是单一庞大的国防项目。同一批证据也指向国防部之外。Motorola 称 D-Fend
              服务政府、公共安全和企业组织；Roark Roark
              则据描述在数十座城市销售持续检测覆盖。由此可见，用户和付款方包括军事运营人员、公共安全机构，以及基础设施密集型企业的安全负责人；采用动因则包括违规无人机事件、战场经验迭代，以及把新传感器接入现有指挥控制环境的需要。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: 约束、矛盾与仍阻碍估值工作的事项
        blocks:
          - type: paragraph
            body: >-
              验证需求的同一批来源也说明，市场热情为何可能跑在可投资现实前面。采购越来越依赖挑战赛、租赁和密集测试，因此厂商必须匹配标准用例、证明互操作性并经受反复评估；单靠传感器性能很难迅速拿下项目。现有公开证据也无法按地理区域、买方预算负责人或平均交易规模拆出
              Roark 可签约的 SAM，因此估值不能负责任地把赛道预算直接换算成公司收入。就连公开法人记录也不能可靠地用于市场分类：资料池中的 Companies House 条目显示注册日期为 2026 年 7
              月，SIC 代码却属于人力资源，因此登记信息无法把 Roark 的运营足迹与标准行业代码对上。尽调结论是：市场真实存在，但 Roark 在其中的份额分母仍未得到证明。
            claimRefs:
              - CM005
              - CM009
              - CM011
              - CM012
              - CM014
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 需求清晰可见，但分母仍是间接的
            body: 预算、采购试点和同行披露都指向活跃的 C-UAS 采购，因此市场信号很强。缺少的是一条把这些信号干净连接到 Roark 可触达、可签约支出的桥梁。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM011
          - type: callout
            title: 互操作性与测试可能拖慢商业化
            body: 盟国买家释放的信号是：除探测性能外，现场验证、通用接口和可重复测试同样重要。即使威胁环境快速增长，不符合标准化工作流的厂商也可能面临缓慢采购。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 市场形态与买方选项
        blocks:
          - type: paragraph
            body: >-
              Roark 并不处在只有一家厂商的狭窄赛道。指定证据描述的反无人机系统市场拥有数百家公司和超过 1,000 个系统条目，覆盖探测器、电子反制、拦截器、集成系统和软件；NATO
              也明确围绕点防御、区域防御和边境防御用例，组织固定、可部署和全移动形态的需求。因此买方可以比较直接同行、子系统专家、托管服务模式、多厂商组合以及可租赁的预审选项，而不必默认采用单一专有架构。
            claimRefs:
              - CP004
              - CP005
              - CP010
