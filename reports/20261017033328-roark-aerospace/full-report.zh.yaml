chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、业务足迹与公开产品
        blocks:
          - type: paragraph
            body: >-
              保留的公司画像来源一致将 Roark Aerospace 定位在伦敦，并称其是 2022 年成立的私营 B 轮反无人机系统公司；Tracxn 则将其与一家于 2023-11-30
              注册成立的活跃英国法人实体关联起来。指定证据还给出了一份具体的历史产品快照，而非泛泛的国防科技标签：公司于 2023 年 12 月发布的定价资料介绍了 Aero-Ark 硬件、Detection as a
              Service 订阅和 Rapid Deploy 按日计费服务。这一组合支持“硬件加服务”的模式，但最后一份保留的直接定价证据已有一段时间，当前商业条款仍应在管理层尽调中重新核实。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
