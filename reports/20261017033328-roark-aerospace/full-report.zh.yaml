      - number: '1.4'
        title: 近期运营信号指向活跃赛道中的扩张
        blocks:
          - type: paragraph
            body: >-
              保留证据同时显示了公司自身的势头和能够支撑这一势头的行业背景。Cushman & Wakefield 称，Roark 在 2026 年第一季度于剑桥租下 13,650 平方英尺办公空间，这是 2025
              年末融资叙事之后一个具体的运营足迹信号。更广泛地看，2026 年买方和战略活动表明反无人机系统仍是活跃商业市场：Defense News 报道 NATO 正在搭建包含 18 个 C-UAS
              选项的市场，DefenseScoop 报道美国 FY26 反无人机系统预算申请为 $3.1B，Motorola 则称已同意以 $1.5B 收购 D-Fend。这些赛道信号并不能核实 Roark
              自身的牵引力，但确实让公司的市场时机比一份孤立的演示文稿故事更可信。
