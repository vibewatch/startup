      - number: '5.4'
        title: 保障、合规与采用风险
        blocks:
          - type: paragraph
            body: >-
              外部买方环境正在走向更结构化的保障，而不是更少保障。NATO 的 2026 C-UAS 市场工作以点防御、区域防御和边境防御用例为框架，强调互操作性、标准化测试，以及同时包含购买和租赁的采购选项。FAA
              则将公共安全机构定义为负责阻止、探测和调查不安全或未经授权 UAS 运营的主体。这些信号共同说明，              Roark
              的采用路径会经过公共部门买家，他们将要求集成、运营相关性和可重复性能方面的证据。本章的主要技术担忧因此是证据质量：指定资料池足以描述技术栈，却不足以确认正常运行时间、安全态势、开发者生态深度或成熟国防买家通常要求的具名生产案例。
