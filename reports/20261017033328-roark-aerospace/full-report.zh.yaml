  - id: TV002
    title: 正方论点 / 反方论点表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - 正方论点：品类需求真实存在
        - NATO AIRCOM 将 2026 年行业日聚焦于 C-UAS，NATO 正在建设一个包含 18 个选项的市场，FY26 美国预算申请还包括 $3.1bn 的反无人机经费。
        - 如果 Roark 无法证明自己参与这些采购渠道、具备相关性或赢单，这一判断会减弱。
      - - 正方论点：运营规模可能有意义
        - Tracxn 将 £100M-£500M 收入和 244 名员工归属于关联法人实体。
        - 如果经审计账目和具名客户引用证实该规模代表更高质量的业务，这一判断会改善。
      - - 反方论点：融资头条尚未得到明确核验
        - Nordic9 报道融资额为 $210m、估值为 $1.6bn，但也标注该交易仍待核验；留存公开记录没有披露投资人或优先权条款。
        - 若有已签署的融资文件、投资人确认及经过核验的股权结构表桥接，这一判断会改善。
      - - 反方论点：买方和基准有许多替代选择
        - Tracxn 列出 296 家活跃竞争者，Unmanned Airspace 则描述了一个包含 654 家公司条目和 1,000 多套系统的目录。
        - 如果 Roark 能证明胜率、转换成本或足以将自身与拥挤市场区分开的性能主张，这一判断会改善。
    notes: 各行总结当前公开证据对是否支付所报道估值的支持与反对理由；未解决事项指出最可能改变建议的尽调内容。
