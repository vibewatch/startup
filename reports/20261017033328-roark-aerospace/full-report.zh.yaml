      - number: '4.2'
        title: 可以推断采购复杂度，但无法推断单位经济性
        blocks:
          - type: paragraph
            body: >
              官方和市场来源都指向顾问式采购环境。DHS 将 C-UAS 采购置于任务要求、地形、射频条件和预算约束下；Defense News 报道 NATO
              正围绕标准化用例、最佳价值比较以及租赁与购买选项搭建市场。这说明销售需要技术评估并面临渠道摩擦，而非简单的商品结账；销售周期通常更长，售前投入也更高。同时，指定公开证据无法直接说明
              CAC、回本期、按产品线划分的毛利率、服务网络利用率或客户集中度。即使是 $3.1 billion FY26 美国反无人机预算申请这样的有用需求信号，也只能说明买方存在支出，无法说明 Roark
              的中标率、定价能力或服务交付效率。公开尽调可以描述漏斗机制和需求背景，却无法量化商业效率。
