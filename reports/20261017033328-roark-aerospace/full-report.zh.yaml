      - number: '1.3'
        title: 融资历史重要，但尚未得到明确核验
        blocks:
          - type: paragraph
            body: >-
              Roark 的融资叙事规模足够大，值得重视，但混乱程度也足以要求谨慎。Multiples 称两轮合计融资 $285M：2025 年 1 月首轮 $75M，2025 年 12 月 B 轮 $210M，B 轮估值为
              $1.8B。Tracxn 对同一故事给出不同说法，称总融资额为 $287M，且首轮发生在 2025 年 5 月。Nordic9 保留了 $210M B 轮这一融资头条，但估值较低，为
              $1.6bn，并明确将该交易标记为待核验。现有证据足以把 2025 年末的成长融资视为合理可能，却不足以在没有一手文件的情况下接受确切的股权结构表叙事。
