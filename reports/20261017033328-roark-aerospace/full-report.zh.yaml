              - CO014
      - number: '1.2'
        title: 领导层、治理与披露深度
        blocks:
          - type: paragraph
            body: >-
              本章公开记录中最薄弱的是领导层披露。Tracxn 将 Patton French 列为创始人兼
              CEO，但指定资料池没有董事会名单、其他具名高管，或足以降低关键人风险的完整治理图谱。相比领导层细节，公开规模信号更强：Tracxn 称已部署设备超过 55,000 台、终端用户超过 3,000 名，截至
              2025-11-30 的年收入区间为 £100M-£500M，截至 2025-12-31 有 244 名员工。这些数据说明公司可能已达到相当规模，但仍只是公司画像层面的说法，并非经审计披露。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO015
