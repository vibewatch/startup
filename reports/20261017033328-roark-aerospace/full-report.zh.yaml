  - id: FE001
    title: Roark 反无人机运营栈
    type: stack
    summary: 可见的技术栈从探测硬件和边缘处理开始，经由 Plexus，最终进入受外部约束的买方保障层。
    data:
      layers:
        - label: 传感器采集
          detail: 指定启动报道中可见的核心传感器输入。
          items:
            - ADS-B 监测
            - Remote ID 捕获
            - DJI 数据包采集 / 解密
            - 被动雷达
        - label: 探测硬件
          modules:
            - 标准 Aero-Ark
            - 城市 Aero-Ark
          outputs:
            - 便携式部署
            - Sentry 部署
        - label: 边缘处理
          detail: 据称在本地运行、在设备上对探测结果分类的处理层。
          items:
            - 设备端 AI 处理
            - 本地分类
        - label: Plexus 平台
          modules:
            - 实时空域监测
            - 地面层监测
        - label: 制图网络
          detail: 通过城市级影像流扩大运营态势的服务层。
          items:
            - WAMI 服务覆盖
            - HSI 服务覆盖
            - 第三方试点参与
        - label: 买方保障关卡
          outputs:
            - 互操作性要求
            - 标准化测试
            - 采购或租赁路径
    approximationNotes: 分层顺序反映指定证据中编写的运营模型；这不是经过核验的系统图，也不能证明每个组件都已通过生产验证。
