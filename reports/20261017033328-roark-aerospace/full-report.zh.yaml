  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与计入范围
        blocks:
          - type: paragraph
            body: >-
              公开来源支持把 Roark 的市场定义为反无人机系统的探测、跟踪和处置工作流，位置介于战场防空、公共安全空域安保和关键基础设施持续监测之间。公司被描述为在陆、空、海场景销售 Plexus AI 平台和
              Aero-Ark 探测单元，同时提供持续检测服务，而不是只卖一次性硬件。市场定义因此很关键：计入的支出不是所有无人机或自主系统预算，而是分层 C-UAS
              感知、软件、托管检测覆盖，以及接入既有防务或安保工作流的更窄预算。主要排除项包括广义自主系统项目、通用无人机制造，以及无法解决空域威胁探测或处置的通用实体安保软件。
            claimRefs:
              - CM001
              - CM002
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM010
              - CM015
      - number: '2.2'
        title: 受证据边界约束的规模化视角
        blocks:
          - type: paragraph
            body: >-
              指定证据无法为 Roark 提供一个可辩护的单一公开 TAM 数字，但给出了几个有边界的规模化视角。DefenseScoop 报道，美国 FY2026 反无人机系统预算申请为 $3.1
              billion，包含在更广的 $13.4 billion 自主系统申请中；它可作为政府买家的需求上限代理，但范围太宽，不能视为 Roark 的可触达收入池。与 NATO
              相关的来源提供第二个视角：联盟围绕九类反无人机系统用例和 18 个预竞标解决方案组织需求。它不是收入数字，却说明了买方如何组织采购。全球供给端同样拥挤，Unmanned Airspace 列出 654
              家公司和超过 1,000 套系统；Motorola 对 D-Fend 的披露则表明，赛道中的规模化厂商有可能达到九位数收入规模。这些视角合在一起有方向性价值，但数字不可比，不能直接拼成 TAM/SAM/SOM
              漏斗。
