  rows:
  - - Allied military point, area, and border defense
    - Layered detection, tracking, mitigation, integration, and mobile/static C-UAS deployments
    - Broad air-defense spend unrelated to counter-UAS and all autonomy programs
    - Ministries of defense, armed services, NATO-linked procurement bodies
    - Core Roark-adjacent wedge because NATO is formalizing these use cases and solution formats.
  - - Public-safety airspace security
    - Detection, tracking, and legally authorized mitigation around cities, events, and protected sites
    - Generic policing software or CCTV programs without drone-threat workflows
    - National, state, and local public-safety agencies
    - Relevant because peer vendors explicitly sell into public-safety buyers and Roark is described as running city-scale detection coverage.
  - - Critical-infrastructure / enterprise perimeter monitoring
    - Managed monitoring, alerting, and continuity protection around facilities and campuses
    - General enterprise-security spend that does not include airspace-threat detection
    - Infrastructure operators, enterprise security leaders, facility owners
    - Relevant as a civil-security adjacency, but still needs named Roark contract evidence to size confidently.
  - - Battlefield-awareness / ISR-adjacent edge autonomy
    - Sensor fusion, RF processing, and decision support when directly tied to C-UAS workflows
    - All unmanned systems spend or generic autonomy software budgets
    - Defense programs and prime-integrator teams
    - Important adjacency because public sources position Roark as part sensor network, part edge software stack, but the budget denominator is much broader than Roark's likely reachable spend.
  notes: Boundary logic is synthesized from public descriptions of Roark, NATO procurement use cases, and peer-vendor buyer categories; rows describe included/excluded spend, not awarded contract totals.
