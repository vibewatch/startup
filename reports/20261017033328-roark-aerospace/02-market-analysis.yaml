company:
  name: Roark Aerospace
chapter:
  number: 2
  title: Market Analysis
  summary: Roark appears to be playing in a real and fast-moving counter-UAS demand environment, but the public evidence supports only an evidence-bounded market lens rather than a clean TAM/SAM/SOM. The usable external anchors are defense budget lines, NATO procurement design, industry breadth, and scaled-peer benchmarks, which together point to meaningful demand but also to interoperability-heavy procurement friction and a crowded supply base.
sections:
- id: market-boundary
  title: Market boundary and what should count
  body: 'Public sources support defining Roark''s market as counter-UAS detection, tracking, and mitigation workflows that sit between battlefield air defense, public-safety airspace security, and persistent monitoring for critical infrastructure. The company is described as selling the Plexus AI platform and Aero-Ark detection unit across land, air, and sea, while also offering detection as an ongoing service rather than a one-time box sale. That matters for market definition: the included spend is not every drone or autonomy budget, but the narrower budgets for layered C-UAS sensing, software, managed detection coverage, and integration into existing defense or security workflows. The main excluded buckets are broad autonomy programs, general drone manufacturing, and generic physical-security software that does not solve airspace threat detection or mitigation.'
  claimRefs:
  - CM001
  - CM002
  - CM010
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Evidence-bounded sizing lenses
  body: 'The assigned evidence does not yield a single public TAM number that can be defended for Roark, but it does give several bounded sizing lenses. DefenseScoop reports a $3.1 billion FY2026 U.S. counter-UAS request inside a broader $13.4 billion autonomy request, which is useful as an upper demand proxy for government buyers but too broad to treat as Roark''s addressable revenue pool. NATO-related sources add a second lens: the alliance is structuring demand around nine counter-UAS use cases and eighteen pre-competed solution options, which is not a revenue figure but does show how buyers are organizing demand. The global supply side is also crowded, with Unmanned Airspace listing 654 companies and more than 1,000 systems, while Motorola''s D-Fend disclosure shows that a scaled vendor in the category can plausibly reach a nine-figure revenue run rate. These lenses are directionally useful together, but they are not numerically comparable enough to call a direct TAM/SAM/SOM stack.'
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM007
  - CM008
  - CM011
  tableRefs:
  - TM002
  figureRefs:
  - FM001
- id: buyers-and-adoption
  title: Buyer map, demand drivers, and adoption path
  body: The clearest buyer cluster is allied and national defense procurement, where the problem statement is urgent and explicitly tied to interoperability, rapid fielding, and proof in realistic operating conditions. NATO and U.S. Army messaging describe demand for point, area, and border defense plus static, deployable, and mobile configurations, which implies multiple procurement pathways rather than one monolithic defense program. The same evidence also points beyond ministries of defense. Motorola describes D-Fend as serving government, public-safety, and enterprise organizations, while Roark is described as selling persistent detection coverage across dozens of cities. That combination suggests the relevant user and payer map spans military operators, public-safety agencies, and security leaders at infrastructure-heavy enterprises, with adoption triggered by rogue-drone incidents, battlefield learning cycles, and the need to integrate new sensors into existing command-and-control
    environments.
  claimRefs:
  - CM002
  - CM003
  - CM004
  - CM012
  - CM013
  - CM015
  tableRefs:
  - TM003
- id: constraints-and-diligence-gaps
  title: Constraints, contradictions, and what still blocks valuation work
  body: 'The same sources that validate demand also show why market enthusiasm can outrun investable reality. Procurement is increasingly challenge-based, lease-enabled, and test-heavy, so vendors must fit standard use cases, prove interoperability, and survive repeated evaluation cycles; raw sensor performance alone is unlikely to close programs quickly. The available public evidence also fails to isolate Roark''s contractable SAM by geography, buyer budget owner, or average deal size, which means a valuation case cannot responsibly translate category budgets into company revenue. Even the public legal-entity record is not a clean market-classification aid: the Companies House listing in the pool shows a July 2026 incorporation and a human-resources SIC code, so the legal registry does not help reconcile Roark''s operating footprint with a standard industry code. For diligence purposes, the market is real, but the denominator for Roark''s share of it remains unproven.'
  claimRefs:
  - CM005
  - CM009
  - CM011
  - CM012
  - CM014
