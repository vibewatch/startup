callouts:
- calloutType: insight
  title: Demand is visible; the denominator is indirect
  body: The market signal is strong because budgets, procurement pilots, and peer disclosures all point to active C-UAS buying. What is still missing is the clean bridge from those signals to Roark's reachable contractable spend.
  claimRefs:
  - CM005
  - CM006
  - CM008
  - CM011
- calloutType: risk
  title: Interoperability and testing can delay monetization
  body: Allied buyers are signaling that field proof, common interfaces, and repeatable testing matter alongside detection performance. Vendors that do not fit standardized workflows may face slow procurement even in a fast-growing threat environment.
  claimRefs:
  - CM012
  - CM013
  - CM014
