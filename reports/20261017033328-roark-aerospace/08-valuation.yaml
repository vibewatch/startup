    claimRefs: ["CV004", "CV005", "CV008", "CV014", "CV015", "CV016"]
  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns:
      - "Argument"
      - "Evidence"
      - "What would change the view"
    rows:
      - ["Thesis: category demand is real", "NATO AIRCOM focused its 2026 industry day on C-UAS, NATO is building a marketplace of 18 options, and the FY26 U.S. budget request includes $3.1bn for counter-UAS.", "Weakens if Roark cannot show participation, relevance, or win evidence in these procurement channels."]
      - ["Thesis: operating scale may be meaningful", "Tracxn attributes £100M-£500M revenue and 244 employees to the linked legal entity.", "Improves if audited accounts and named customer references confirm the upper-quality interpretation of that scale."]
      - ["Anti-thesis: the financing headline is not cleanly verified", "Nordic9 reported $210m at $1.6bn but also flagged the deal as pending verification, and the retained public record does not disclose investors or preference terms.", "Improves with signed financing documents, investor confirmation, and a verified cap-table bridge."]
      - ["Anti-thesis: buyers and benchmarks have many alternatives", "Tracxn lists 296 active competitors, and Unmanned Airspace describes a directory of 654 company entries and more than 1,000 systems.", "Improves if Roark can evidence win rates, switching costs, or performance claims that separate it from the crowded field."]
    notes: "Rows summarize the current public case for and against paying the reported valuation; unresolved items identify the diligence most likely to change the recommendation."
    claimRefs: ["CV005", "CV006", "CV007", "CV009", "CV010", "CV011", "CV012", "CV013", "CV014"]
  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Assumptions"
      - "Valuation / return logic"
      - "Key risks"
      - "Probability signal"
    rows:
      - ["Bull", "Revenue quality is near the top of Tracxn's range, customer proof is strong, and round terms are clean.", "The reported ~$1.6bn mark can hold or improve because the company would merit a premium to the public comp and crowded-field averages.", "Customer quality or terms still fail diligence.", "Possible only if financing and customer proof both tighten materially."]
      - ["Base", "Roark is real and commercially relevant, but proof remains mixed and round terms stay partly opaque.", "Entry works only below the reported mark or with strong downside protection because public comparables do not yet validate a private premium.", "Preference overhang, concentration, or margin quality may absorb returns.", "Most consistent with the retained public record."]
      - ["Bear", "Revenue quality, customer durability, or procurement traction do not match the scale narrative.", "Downside likely tracks or falls below the $1.0bn public benchmark because the current mark would be paying for unverified execution.", "Multiple compression, down-round risk, and crowded procurement competition.", "Credible if core diligence items remain unavailable."]
      - ["Walk-away trigger", "Financing verification fails or current operating proof cannot clear core gaps.", "Do not proceed at the reported price; revisit only after hard evidence or materially better entry terms.", "False precision around valuation, hidden preferences, or weak commercial proof.", "Immediate if the diligence package stays incomplete."]
    notes: "Scenarios are qualitative because the retained public sources do not disclose enough precise valuation inputs, term-sheet terms, or customer economics for a narrower model."
    claimRefs: ["CV004", "CV005", "CV006", "CV008", "CV010", "CV014", "CV015", "CV016"]
