company:
  name: "Roark Aerospace"
chapter:
  number: 8
  title: "Valuation"
  summary: >
    Public evidence supports a real counter-UAS company operating in a live and well-funded category,
    but it does not yet support underwriting the reported $1.6 billion private valuation as-is. The
    financing headline is partly corroborated, the category benchmark is lower, and key downside terms
    and customer-quality proofs remain undisclosed, so the chapter lands on research-more with a
    stretched valuation stance.
sections:
  - id: "public-valuation-context"
    title: "Public valuation context and evidence quality"
    body: >
      The retained public record shows Roark is not a paper company: Tracxn ties the profile to
      active UK legal entity RO-ARK AEROSPACE LIMITED, and Companies House shows that entity has
      filed through 30 November 2025. Financing evidence is directionally supportive but not clean.
      Nordic9 reported a 18 December 2025 Series B of $210 million at a $1.6 billion valuation, yet
      the same item explicitly says the deal is still pending verification. Tracxn separately says
      Roark has raised $287 million over two rounds, which suggests material financing activity, but
      the retained public sources do not name investors or disclose liquidation preferences,
      participation rights, or other cap-table protections that determine whether the headline price
      is economically real for a new investor.
    claimRefs: ["CV001", "CV002", "CV003", "CV004", "CV005", "CV014"]
    tableRefs: ["TV001"]
  - id: "thesis-balance"
    title: "What supports the case and what breaks it"
    body: >
      The investable part of the story is market pull plus operating-scale signals. NATO devoted its
      2026 AIRCOM industry day to C-UAS capability development, Defense News reported NATO's planned
      marketplace of 18 candidate systems, and DefenseScoop said the FY26 U.S. budget request
      includes $3.1 billion for counter-UAS across the services. Tracxn also attributes a broad
      £100 million to £500 million revenue band and 244 employees to the linked legal entity, which
      would be meaningful scale if verified. The anti-thesis is that price support trails narrative:
      Tracxn lists 296 active competitors, Unmanned Airspace describes a directory of 654 company
      entries and more than 1,000 systems, and NATO's procurement design explicitly emphasizes
      best-value and cheapest technically compliant options rather than category-leader premiums.
    claimRefs: ["CV006", "CV007", "CV009", "CV010", "CV011", "CV012", "CV013"]
    tableRefs: ["TV002"]
  - id: "scenario-entry-discipline"
    title: "Scenario framing and entry discipline"
    body: >
      The valuation question is not whether Roark addresses a real market; the public record says it
      does. The question is whether the current entry price is justified relative to independently
      visible benchmarks and the still-missing downside protections. CompaniesMarketCap put
      DroneShield at a $1.0 billion market cap in October 2026, so Roark's reported $1.6 billion
      private mark already asks investors to pay above a live public comp while accepting less public
      disclosure. That can be rational only if diligence proves Roark sits near the top of its stated
      revenue band, has repeatable customer quality, and closed the round on clean terms. Without
      that proof, the disciplined stance is research-more rather than buy.
    claimRefs: ["CV004", "CV008", "CV015", "CV016"]
    tableRefs: ["TV003"]
    figureRefs: ["FV001"]
  - id: "diligence-asks-and-breakpoints"
    title: "Final diligence asks and thesis-break triggers"
    body: >
      The next diligence step is straightforward: verify the economics behind the headline. A signed
      financing package should confirm the actual post-money, lead investors, liquidation stack,
      participation rights, and any debt-like or project-finance overlays. Commercial diligence
      should confirm whether the revenue band reflects recurring software, hardware shipments,
      services, or one-off programs, and whether named customer references support durable adoption.
      The thesis breaks if financing verification fails, if customer concentration or gross-margin
      quality is materially weaker than the scale narrative implies, or if procurement evidence shows
      Roark is participating in a crowded market without win-rate or performance proof that merits a
      premium to the best visible public benchmark.
    claimRefs: ["CV005", "CV006", "CV010", "CV014", "CV016"]
