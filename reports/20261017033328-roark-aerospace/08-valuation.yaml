          label: "Compare against market proof"
        - from: "benchmark-and-competition"
          to: "recommendation"
          label: "Keeps entry discipline tight"
    approximationNotes: "The flow is qualitative and summarizes the chapter's logic rather than a numerical valuation model."
    claimRefs: ["CV004", "CV005", "CV008", "CV009", "CV010", "CV011", "CV015", "CV016"]
callouts:
  - calloutType: "recommendation"
    title: "Current call"
    body: >
      Research-more is the right call because the market signal is investable but the price signal is
      not yet clean enough. Investors should treat the reported valuation as a diligence target, not
      as a cleared underwriting anchor.
    claimRefs: ["CV004", "CV005", "CV015", "CV016"]
  - calloutType: "risk"
    title: "What can still go wrong"
    body: >
      The biggest risk is not category demand; it is overpaying for a company whose financing terms,
      customer quality, and margin durability remain less transparent than the headline valuation.
    claimRefs: ["CV005", "CV010", "CV014", "CV016"]
  - calloutType: "assumption"
    title: "What would move the chapter to buy"
    body: >
      A verified term sheet, named lead investors, durable customer proof, and current financial
      quality that make Roark look stronger than the visible public comp set would move the case
      materially.
    claimRefs: ["CV006", "CV007", "CV014", "CV015"]
