  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation follows a real-demand / real-company signal into a price-support gap that keeps the call at
      research-more.
    data:
      nodes:
        - id: demand
          label: C-UAS demand is real
          detail: NATO and DoD both elevated counter-drone activity in 2026.
        - id: operating-proof
          label: Roark shows operating-scale signals
          detail: The company is tied to an active UK entity with reported revenue range and employee scale.
        - id: financing-headline
          label: The round headline is positive
          detail: Nordic9 reported a $210m Series B at a $1.6bn valuation.
        - id: verification-gap
          label: Price support is incomplete
          detail: The same financing item is pending verification and public terms remain undisclosed.
        - id: benchmark-and-competition
          label: Benchmark and competition are demanding
          detail: DroneShield is at $1.0bn publicly while buyers can compare a crowded supplier field.
        - id: recommendation
          label: 'Recommendation: research-more / stretched'
          detail: Do not underwrite the reported mark without verified terms, customer proof, and current financial quality.
      edges:
        - from: demand
          to: operating-proof
          label: Category relevance
        - from: operating-proof
          to: financing-headline
          label: Creates valuation interest
        - from: financing-headline
          to: verification-gap
          label: Needs diligence
        - from: verification-gap
          to: benchmark-and-competition
          label: Compare against market proof
        - from: benchmark-and-competition
          to: recommendation
          label: Keeps entry discipline tight
    approximationNotes: The flow is qualitative and summarizes the chapter's logic rather than a numerical valuation model.
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV009
      - CV010
      - CV011
      - CV015
