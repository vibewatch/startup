              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.2'
        title: Qualification and procurement screens are a real regulatory-like gate
        blocks:
          - type: paragraph
            body: >-
              Roark sells into a category where official buyers are formalizing purchase screens rather than improvising
              them. NATO's 2026 C-UAS marketplace is structured around defined use cases, "best value" and "cheapest
              technically-compliant" awards, and standardized testing to prove performance before member nations buy.
              DHS's purchasing tool likewise tells first-responder agencies to score products against mission-fit
              rubrics instead of relying on vendor storytelling. For Roark, this means legal and regulatory diligence
              cannot be limited to searching for lawsuits or permits; the immediate gate is whether the company can
              document interoperability, technical compliance, and repeatable field performance well enough to pass
              formal procurement filters.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR012
              - CR015
      - number: '7.3'
        title: Execution risk rises with rapid threat evolution and public-buyer dependence
        blocks:
          - type: paragraph
            body: >-
              The counter-UAS environment is moving quickly enough that slow product iteration can become a risk event.
              AIRCOM's 2026 industry agenda emphasizes interoperability, operational relevance, and future capability
              development, while Defense News quotes NATO saying Ukrainian drone tactics changed every two to three
              weeks in 2023-2025 and that innovation ranges will run repeated test cycles. Roark's own public
              positioning, as summarized by DFM, is ambitious: a multi-domain platform and one of the world's largest
              sensor networks. That ambition creates a corresponding execution burden around integration, reliability,
              and refresh cadence. The demand backdrop is supportive, but DefenseScoop's FY26 budget figures also
              underline that public-program timing and appropriations remain a meaningful concentration risk.
            claimRefs:
              - CR002
              - CR006
              - CR008
              - CR009
              - CR010
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
