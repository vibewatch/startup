    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and public offer
        blocks:
          - type: paragraph
            body: >-
              Retained profile sources consistently place Roark Aerospace in London and describe it as a private Series
              B counter-UAS company founded in 2022, while Tracxn ties the business to an active UK legal entity
              incorporated on 2023-11-30. The assigned evidence also gives a concrete historical product snapshot rather
              than just a generic defense-tech label: a company-issued December 2023 pricing release described Aero-Ark
              hardware, a Detection as a Service subscription, and a Rapid Deploy day-rate service. That combination
              supports a blended hardware-plus-service model, but the last retained direct pricing evidence is old
              enough that current commercial terms should be rechecked during management diligence.
