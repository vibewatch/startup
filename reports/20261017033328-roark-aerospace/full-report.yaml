              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Market shape and buyer option set
        blocks:
          - type: paragraph
            body: |-
              Roark does not compete in a narrow one-vendor lane. The assigned evidence describes a
              counter-UAS market with hundreds of companies and more than a thousand system
              descriptions spanning detectors, electronic countermeasures, interceptors, integrated
              systems, and software, while NATO is explicitly structuring demand around point, area,
              and border defense use cases across static, deployable, and fully mobile form factors.
              That means buyers can compare direct peers, subsystem specialists, managed-service
              models, multi-vendor assemblies, and leaseable pre-vetted options instead of adopting a
              single proprietary architecture by default.
