      - number: '4.2'
        title: Procurement complexity can be inferred; unit economics cannot
        blocks:
          - type: paragraph
            body: >
              Official and market sources point to a consultative procurement environment. DHS frames C-UAS buying
              around mission requirements, terrain, radio-frequency conditions, and budget, while Defense News reports
              that NATO is structuring a marketplace around standardized use cases, best-value comparisons, and
              lease-versus-purchase options. That supports a sales motion with technical evaluation and channel friction
              rather than simple commodity checkout, which usually lengthens sales cycles and raises pre-sale effort. At
              the same time, the assigned public evidence provides no direct read on CAC, payback, gross margin by
              product line, utilization of the service network, or customer concentration. Even the most useful
              market-demand signals, including a $3.1 billion FY26 U.S. counter-UAS budget request, only show that buyer
              spend exists; they do not show Roark's win rate, pricing power, or service delivery efficiency. Public
              diligence can therefore describe the funnel mechanics and demand context, but not quantify commercial
              efficiency.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
