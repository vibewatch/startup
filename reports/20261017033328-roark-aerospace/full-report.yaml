      - number: '5.3'
        title: Maturity signals, differentiation, and dependencies
        blocks:
          - type: paragraph
            body: >-
              Roark does not look like a lab-stage concept company in the assigned evidence. Cushman & Wakefield placed
              the company in Cambridge office demand as an "autonomous defence systems" occupier, and Nordic9 reported a
              late-2025 Series B round, albeit still marked as pending verification. Those are commercialization and
              scaling signals, not proof that the product is technically superior. On differentiation, the evidence
              suggests Roark is trying to compete as an integrated system that combines fixed/mobile detection, a shared
              software layer, and a city-scale mapping feed. That pitch is directionally sensible in a market where
              Unmanned Airspace counts hundreds of C-UAS vendors and more than a thousand systems descriptions, but the
              public record in this pool does not yet show benchmark data, named integration wins, or certification
              evidence that would make the differentiation claim durable.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE013
              - CE014
      - number: '5.4'
        title: Assurance, compliance, and adoption risks
        blocks:
          - type: paragraph
            body: >-
              The external buyer environment is moving toward more structured assurance, not less. NATO's 2026 C-UAS
              marketplace work is organized around point, area, and border defense use cases and emphasizes
              interoperability, standardized testing, and procurement options that include both purchase and lease
              structures. The FAA separately frames public safety agencies as the bodies responsible for deterring,
              detecting, and investigating unsafe or unauthorized UAS operations. Together, those signals imply that
              Roark's adoption path runs through public-sector buyers who will expect evidence on integration,
              operational relevance, and repeatable performance. The chapter's main technical concern is therefore
              evidence quality: the assigned pool provides enough to describe the stack, but not enough to confirm
              uptime, security posture, developer ecosystem depth, or named production references at the standard
              late-stage defense buyers typically want.
            claimRefs:
              - CE006
              - CE009
              - CE010
              - CE011
              - CE012
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated package is clearer than assurance proof
            body: >-
              Roark's visible offer is coherent as hardware plus software plus mapping services, but the public evidence
              in this pool remains much stronger on package description than on validated performance or integration
              proof.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE014
          - type: callout
            title: Procurement friction is likely to center on interoperability and test evidence
            body: >-
              NATO and public-safety buyer signals point toward buyers that will want standardized testing, operational
              fit, and documented controls before scaling deployments.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments are clearer than named customer identities
        blocks:
          - type: paragraph
            body: >-
              The most concrete buyer segmentation evidence in this pool comes from Dealroom's description of Roark's
              "drone detection as a service" model for government, military, and corporate sectors, combined with 2026
              NATO and U.S. defense-policy evidence showing that public-sector buyers are actively widening counter-UAS
              procurement and testing channels. NATO's marketplace design matters because it is framed around point,
              area, and border defense use cases and explicitly allows both purchase and lease options, which aligns
              with Roark's service-oriented commercial motion better than a one-time hardware-only sale would. That
              said, this chapter's retained evidence shows the categories of buyers Roark is pursuing more clearly than
              the exact agencies, enterprises, or sites that are already live customers.
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
