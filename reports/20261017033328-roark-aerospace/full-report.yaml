  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Evidence-backed ordinal scores place prime-backed incumbents above Roark on procurement leverage and public
      deployment proof, while marketplace and specialist alternatives keep switching options open for buyers.
    data:
      xAxis:
        label: Distribution / procurement leverage
        min: 1
        max: 5
        lowLabel: Project-led or ad hoc route
        highLabel: Prime or pre-vetted channel leverage
        description: Ordinal score from public channel access, procurement vehicles, and lease/catalog pathways
      yAxis:
        label: Operationally evidenced deployment scale
        min: 1
        max: 5
        lowLabel: Limited public proof
        highLabel: Scaled validated deployments
        description: Ordinal score from public deployment proof, geography breadth, or standardized testing signals
      points:
        - label: Roark Aerospace
          x: 2
          'y': 2
          tone: warning
          note: Flexible packaging is public, but third-party deployment validation is limited in the assigned pool.
        - label: D-Fend Solutions
          x: 5
          'y': 5
          tone: positive
          note: Motorola cites thousands of deployments in 30+ countries and strong public-safety reach.
        - label: Fortem Technologies
          x: 4
          'y': 4
          tone: positive
          note: Lockheed-backed ecosystem access and operational deployment references strengthen the trust story.
        - label: NATO-vetted vendor pool
          x: 4
          'y': 3
          tone: neutral
          note: Purchase and lease routes plus standardized testing create a powerful alternative channel for buyers.
        - label: Fragmented specialist field
          x: 2
          'y': 3
          tone: neutral
          note: The market is broad and crowded, but many specialists still lack the scale of prime-backed vendors.
        - label: Legacy physical deployment / internal program
          x: 1
          'y': 2
          tone: adverse
          note: >-
            Buyers can still assemble or retain legacy approaches, although newer lease-and-service models reduce that
            lock-in.
    approximationNotes: >-
      Axes use 1-5 ordinal scores derived from public procurement leverage and deployment proof in the assigned source
      pool; they are not source-published benchmark ratings.
    claimRefs:
      - CP004
      - CP006
      - CP010
      - CP012
      - CP013
      - CP014
