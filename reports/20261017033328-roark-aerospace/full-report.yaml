      - number: '2.3'
        title: Buyer map, demand drivers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The clearest buyer cluster is allied and national defense procurement, where the problem statement is
              urgent and explicitly tied to interoperability, rapid fielding, and proof in realistic operating
              conditions. NATO and U.S. Army messaging describe demand for point, area, and border defense plus static,
              deployable, and mobile configurations, which implies multiple procurement pathways rather than one
              monolithic defense program. The same evidence also points beyond ministries of defense. Motorola describes
              D-Fend as serving government, public-safety, and enterprise organizations, while Roark is described as
              selling persistent detection coverage across dozens of cities. That combination suggests the relevant user
              and payer map spans military operators, public-safety agencies, and security leaders at
              infrastructure-heavy enterprises, with adoption triggered by rogue-drone incidents, battlefield learning
              cycles, and the need to integrate new sensors into existing command-and-control environments.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM012
              - CM013
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
