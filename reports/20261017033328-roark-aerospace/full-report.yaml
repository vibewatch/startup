              - CM005
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: Constraints, contradictions, and what still blocks valuation work
        blocks:
          - type: paragraph
            body: >-
              The same sources that validate demand also show why market enthusiasm can outrun investable reality.
              Procurement is increasingly challenge-based, lease-enabled, and test-heavy, so vendors must fit standard
              use cases, prove interoperability, and survive repeated evaluation cycles; raw sensor performance alone is
              unlikely to close programs quickly. The available public evidence also fails to isolate Roark's
              contractable SAM by geography, buyer budget owner, or average deal size, which means a valuation case
              cannot responsibly translate category budgets into company revenue. Even the public legal-entity record is
              not a clean market-classification aid: the Companies House listing in the pool shows a July 2026
              incorporation and a human-resources SIC code, so the legal registry does not help reconcile Roark's
              operating footprint with a standard industry code. For diligence purposes, the market is real, but the
              denominator for Roark's share of it remains unproven.
            claimRefs:
              - CM005
              - CM009
              - CM011
              - CM012
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand is visible; the denominator is indirect
            body: >-
              The market signal is strong because budgets, procurement pilots, and peer disclosures all point to active
              C-UAS buying. What is still missing is the clean bridge from those signals to Roark's reachable
              contractable spend.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM011
          - type: callout
            title: Interoperability and testing can delay monetization
            body: >-
              Allied buyers are signaling that field proof, common interfaces, and repeatable testing matter alongside
              detection performance. Vendors that do not fit standardized workflows may face slow procurement even in a
              fast-growing threat environment.
            calloutType: risk
            claimRefs:
