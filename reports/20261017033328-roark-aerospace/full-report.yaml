              - CR009
              - CR011
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR010
              - CR012
              - CR014
              - CR015
      - number: '7.4'
        title: Mitigations must be documentable, and kill criteria should be explicit
        blocks:
          - type: paragraph
            body: >-
              The current evidence suggests a workable mitigation path, but it is documentary rather than rhetorical.
              Before underwriting valuation or growth assumptions, Roark should be able to produce signed financing
              documents, independently attributable customer deployments, recent performance or procurement-test
              evidence, and a clean export-control / cyber-assurance package suitable for defense and public-safety
              buyers. Until those materials exist, the practical kill criteria are straightforward: if the late-2025
              round cannot be independently reconciled, if standardized testing evidence is not available, or if
              security and compliance documentation remains incomplete, the prudent stance is to treat the company as
              commercially interesting but still diligence-constrained.
            claimRefs:
              - CR003
              - CR006
              - CR012
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria before underwriting
            body: >-
              Stop or materially reprice the case if the late-2025 financing cannot be independently reconciled, if
              standardized test evidence for target use cases is unavailable, or if export-control / cyber-assurance
              materials remain incomplete for government buyers.
            calloutType: risk
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR015
          - type: callout
            title: Highest-leverage diligence asks
            body: >-
              The fastest way to de-risk the story is to request four packs: financing close documents, recent
              procurement or field-test results, named production deployments with outcomes, and the
              security/export-control dossier used in defense or public-safety sales.
            calloutType: insight
            claimRefs:
              - CR001
              - CR006
              - CR012
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public valuation context and evidence quality
        blocks:
          - type: paragraph
            body: >
              The retained public record shows Roark is not a paper company: Tracxn ties the profile to active UK legal
              entity RO-ARK AEROSPACE LIMITED, and Companies House shows that entity has filed through 30 November 2025.
              Financing evidence is directionally supportive but not clean. Nordic9 reported a 18 December 2025 Series B
              of $210 million at a $1.6 billion valuation, yet the same item explicitly says the deal is still pending
              verification. Tracxn separately says Roark has raised $287 million over two rounds, which suggests
              material financing activity, but the retained public sources do not name investors or disclose liquidation
              preferences, participation rights, or other cap-table protections that determine whether the headline
              price is economically real for a new investor.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: What supports the case and what breaks it
        blocks:
          - type: paragraph
            body: >
              The investable part of the story is market pull plus operating-scale signals. NATO devoted its 2026 AIRCOM
              industry day to C-UAS capability development, Defense News reported NATO's planned marketplace of 18
              candidate systems, and DefenseScoop said the FY26 U.S. budget request includes $3.1 billion for
              counter-UAS across the services. Tracxn also attributes a broad £100 million to £500 million revenue band
              and 244 employees to the linked legal entity, which would be meaningful scale if verified. The anti-thesis
              is that price support trails narrative: Tracxn lists 296 active competitors, Unmanned Airspace describes a
              directory of 654 company entries and more than 1,000 systems, and NATO's procurement design explicitly
              emphasizes best-value and cheapest technically compliant options rather than category-leader premiums.
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Scenario framing and entry discipline
        blocks:
          - type: paragraph
            body: >
              The valuation question is not whether Roark addresses a real market; the public record says it does. The
              question is whether the current entry price is justified relative to independently visible benchmarks and
              the still-missing downside protections. CompaniesMarketCap put DroneShield at a $1.0 billion market cap in
              October 2026, so Roark's reported $1.6 billion private mark already asks investors to pay above a live
              public comp while accepting less public disclosure. That can be rational only if diligence proves Roark
              sits near the top of its stated revenue band, has repeatable customer quality, and closed the round on
              clean terms. Without that proof, the disciplined stance is research-more rather than buy.
            claimRefs:
              - CV004
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >
              The next diligence step is straightforward: verify the economics behind the headline. A signed financing
              package should confirm the actual post-money, lead investors, liquidation stack, participation rights, and
              any debt-like or project-finance overlays. Commercial diligence should confirm whether the revenue band
              reflects recurring software, hardware shipments, services, or one-off programs, and whether named customer
              references support durable adoption. The thesis breaks if financing verification fails, if customer
              concentration or gross-margin quality is materially weaker than the scale narrative implies, or if
              procurement evidence shows Roark is participating in a crowded market without win-rate or performance
              proof that merits a premium to the best visible public benchmark.
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >
              Research-more is the right call because the market signal is investable but the price signal is not yet
              clean enough. Investors should treat the reported valuation as a diligence target, not as a cleared
              underwriting anchor.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV015
              - CV016
          - type: callout
            title: What can still go wrong
            body: >
              The biggest risk is not category demand; it is overpaying for a company whose financing terms, customer
              quality, and margin durability remain less transparent than the headline valuation.
            calloutType: risk
            claimRefs:
              - CV005
              - CV010
              - CV014
              - CV016
          - type: callout
            title: What would move the chapter to buy
            body: >
              A verified term sheet, named lead investors, durable customer proof, and current financial quality that
              make Roark look stronger than the visible public comp set would move the case materially.
            calloutType: assumption
            claimRefs:
              - CV006
              - CV007
              - CV014
              - CV015
