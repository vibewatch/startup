      - number: '5.2'
        title: Operating architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              The best available technical detail comes from independent reporting on Roark's January 2025 launch. In
              that description, the standard Aero-Ark node combines ADS-B, Remote ID, DJI packet collection/decryption,
              and passive radar, while the urban variant swaps in programmable meta surfaces and conical horn
              transceiver units to address radar-shadow problems in dense cities. Roark also appears to depend on
              external operator participation for the mapping layer, because its pilot engagement program offers
              qualifications support, free WAMI/HSI cameras, and Plexus access to third-party drone pilots. That makes
              the architecture more flexible, but it also means the quality of the data layer depends on outside
              operator supply, field integration, and quality controls that are not independently documented in the
              assigned evidence.
            claimRefs:
