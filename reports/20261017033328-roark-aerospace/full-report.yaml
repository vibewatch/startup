        title: Leadership, governance, and disclosure depth
        blocks:
          - type: paragraph
            body: >-
              Leadership disclosure is the weakest part of the public record in this chapter. Tracxn names Patton French
              as founder and CEO, but the assigned pool does not surface a board list, another named executive, or a
              fuller governance map that would reduce key-person risk. Public scale markers are directionally stronger
              than the leadership detail: Tracxn attributes more than 55,000 deployed devices, more than 3,000 end
              users, a £100M-£500M annual revenue band as of 2025-11-30, and 244 employees as of 2025-12-31. Those
              datapoints suggest a business operating at material scale, but they are still profile-level claims rather
              than audited disclosures.
