              - CU008
              - CU012
              - CU013
              - CU014
      - number: '6.3'
        title: Durability and concentration remain the core diligence gap
        blocks:
          - type: paragraph
            body: >-
              The weakest part of the customer case is durability. None of the retained sources provides NRR, GRR,
              churn, renewal rates, contract terms, or top-customer exposure, so there is no public basis here to judge
              whether Roark's installed footprint converts into sticky software/service revenue or whether a small
              number of defense programs dominate the book. The quality of the external proof set is also uneven: the
              Unmanned Systems Technology tag-page fetch contains only site boilerplate, and Nordic9's funding item
              still labels the Series B as pending verification, which underlines how much of the public narrative is
              still financing- and category-context heavy rather than customer-reference heavy. For investors, that
              means the next diligence step is not more market sizing; it is direct customer-reference work and
              concentration disclosure.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The buyer side is strongest where procurement is formalizing
            body: >-
              NATO and U.S. defense-policy evidence make government and allied security buyers the clearest externally
              supported Roark customer segment today.
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: callout
            title: Public customer proof is still thinner than the market narrative
            body: >-
              The current pool does not identify a single named production customer, renewal metric, or concentration
              disclosure, so durability still depends on private-reference work.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Highest-severity risks center on proof, not market existence
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports that Roark is active in a live counter-UAS market, but it does not support
              underwriting the company on narrative alone. An independent July 2025 DFM report page says its Roark
              analysis is framed around "capability gaps" and that what cannot be verified is explicitly flagged, while
              Nordic9's December 2025 financing note still labels the reported $210 million Series B at a $1.6 billion
              valuation as pending verification. That combination makes financing proof, disclosure quality, and
              technical substantiation the core residual risks: if independent evidence cannot verify the capital stack,
              customer proof, and test performance, the downside is not just slower diligence but a broken price-setting
              process for any new investment or strategic partnership.
            claimRefs:
              - CR001
              - CR003
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR008
