              - CI011
              - CI012
              - CI014
      - number: '4.3'
        title: Capital headlines exist, but runway remains a diligence blocker
        blocks:
          - type: paragraph
            body: >
              The cleanest public financing datapoint in the assigned pool is Nordic9's company profile, which shows
              $260 million of total investments, alongside a December 2025 item describing a $210 million Series B at a
              $1.6 billion valuation. But that same funding note explicitly says the deal is still pending verification,
              so it should be treated as a valuation and round headline, not confirmed cash on hand. Public sources do
              show that Roark is still carrying fixed operating commitments such as a 13,650-square-foot Cambridge
              lease, while competitors like D-Fend are large enough to cite thousands of deployments and expected 2026
              revenue of $185 million. The underwriting conclusion is therefore cautious: Roark looks financed enough to
              have built a real commercial footprint, but the current evidence base is too thin to judge whether that
              capital structure supports efficient growth, healthy margins, or adequate runway into the next funding
              milestone.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI010
              - CI011
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Multi-modal monetization is the clearest public positive
            body: >-
              Roark does not appear to rely on a single transaction type: the public record shows outright sales,
              temporary deployments, and a managed-service model, which could widen buyer fit if the economics are real.
            calloutType: strength
            claimRefs:
