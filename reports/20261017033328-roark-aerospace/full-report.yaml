              - CI002
              - CI013
          - type: callout
            title: Revenue quality is still opaque
            body: >-
              The same source pool that shows the offering mix does not disclose realized pricing, revenue, gross
              margin, CAC, payback, or customer concentration, so the financial story remains materially
              under-evidenced.
            calloutType: risk
