        title: Recent operating signals point to expansion in an active category
        blocks:
          - type: paragraph
            body: >-
              The retained evidence shows both company-specific momentum and a sector backdrop that can support it.
              Cushman & Wakefield says Roark leased 13,650 square feet in Cambridge in Q1 2026, which is a concrete
