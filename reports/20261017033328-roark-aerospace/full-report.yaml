  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product package and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Public evidence describes Roark as selling a bundled counter-UAS workflow rather than a single sensor. The
              visible package starts with Aero-Ark detection nodes, layers in the Plexus monitoring platform, and then
              extends into WAMI and hyperspectral imaging services that feed additional aerial data into the same
              operating picture. That matters because buyers in public safety, site security, and defense typically
              procure an operating workflow - detect, classify, monitor, and respond - instead of paying separately for
              disconnected components. The evidence is still strongest on what the bundle claims to include, not on
              proof of sustained production usage, but the product shape itself is specific enough to underwrite as a
              multi-component system rather than generic counter-drone marketing.
            claimRefs:
