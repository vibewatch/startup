      - number: '3.3'
        title: Packaging and procurement dynamics lower switching friction
        blocks:
          - type: paragraph
            body: |-
              Roark's clearest public differentiator is commercial packaging rather than an obviously
              unique procurement channel. Its Aero-Ark offer is presented as an outright purchase, a
              rapid-deployment service, or an as-a-service model, which is commercially useful for
              pilots and event-driven use cases. But NATO's marketplace design points in the same
              direction by emphasizing challenge-based procurement, standardized testing, and both
              purchase and lease options. That setup reduces lock-in because buyers can evaluate
              alternatives by use case and readiness instead of committing up front to one bespoke
              long-cycle vendor relationship.
            claimRefs:
              - CP001
              - CP006
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP006
              - CP011
              - CP012
      - number: '3.4'
        title: Durability remains narrative-heavy until Roark proves trusted deployment scale
        blocks:
          - type: paragraph
            body: |-
              The assigned pool does not show Roark matching the public proof stack that larger
              competitors present. Roark claims more than 70-city coverage and rapid monthly growth,
              but the adverse source in the pool says the company arrived with extraordinary valuation
              claims and limited verifiable investor detail, while a secondary deal tracker still marks
              the late-2025 round as pending verification. At the same time, rising defense budgets and
              alliance procurement programs are likely to attract more incumbent participation, so any
              moat that depends only on a flexible packaging story looks fragile unless Roark can show
              standardized testing, named deployments, or equivalent trust signals.
            claimRefs:
              - CP002
              - CP003
              - CP010
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Prime-backed response is the main moat pressure
            body: >-
              D-Fend and Fortem are not just feature competitors; they are increasingly distributed through Motorola and
              Lockheed, which raises the odds that buyers can bundle C-UAS with procurement trust, services, and
              ecosystem support that Roark has not yet matched publicly.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP013
          - type: callout
            title: Flexible packaging helps Roark, but it also normalizes buyer comparison
            body: >-
              Roark's as-a-service and rapid-deployment pitch aligns with where NATO procurement is heading, but that
              same shift also lowers switching costs because buyers can test, lease, and compare more vendors before
              committing.
            calloutType: insight
            claimRefs:
              - CP001
              - CP006
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is visible, but realized pricing is not
        blocks:
          - type: paragraph
            body: >
              The assigned public sources support a three-lane revenue model rather than a single hardware sale motion.
              Trade coverage of the 2023 Aero-Ark launch says the product can be bought outright, deployed temporarily
              through rapid-deployment units, or consumed as a managed detection service around Roark-operated
              installations. That mix matters because it implies different revenue-recognition and margin profiles: unit
              sales would be more hardware-like and lumpy, while rapid deployment and coverage-as-a-service could
              convert customer demand into time-bound or recurring service contracts. However, the same evidence set
              stops at offering structure. None of the retained sources disclose list pricing, realized contract values,
              discounting, or attach rates between hardware, deployment, monitoring, and mitigation. The right takeaway
              is therefore that Roark appears to have a plausible multi-modal monetization design, but not a publicly
              evidenced price book or revenue-quality profile.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI012
              - CI013
