  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what should count
        blocks:
          - type: paragraph
            body: >-
              Public sources support defining Roark's market as counter-UAS detection, tracking, and mitigation
              workflows that sit between battlefield air defense, public-safety airspace security, and persistent
              monitoring for critical infrastructure. The company is described as selling the Plexus AI platform and
              Aero-Ark detection unit across land, air, and sea, while also offering detection as an ongoing service
              rather than a one-time box sale. That matters for market definition: the included spend is not every drone
              or autonomy budget, but the narrower budgets for layered C-UAS sensing, software, managed detection
              coverage, and integration into existing defense or security workflows. The main excluded buckets are broad
              autonomy programs, general drone manufacturing, and generic physical-security software that does not solve
              airspace threat detection or mitigation.
            claimRefs:
              - CM001
              - CM002
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM010
              - CM015
      - number: '2.2'
        title: Evidence-bounded sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not yield a single public TAM number that can be defended for Roark, but it
              does give several bounded sizing lenses. DefenseScoop reports a $3.1 billion FY2026 U.S. counter-UAS
              request inside a broader $13.4 billion autonomy request, which is useful as an upper demand proxy for
              government buyers but too broad to treat as Roark's addressable revenue pool. NATO-related sources add a
              second lens: the alliance is structuring demand around nine counter-UAS use cases and eighteen
              pre-competed solution options, which is not a revenue figure but does show how buyers are organizing
              demand. The global supply side is also crowded, with Unmanned Airspace listing 654 companies and more than
              1,000 systems, while Motorola's D-Fend disclosure shows that a scaled vendor in the category can plausibly
              reach a nine-figure revenue run rate. These lenses are directionally useful together, but they are not
              numerically comparable enough to call a direct TAM/SAM/SOM stack.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
