              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU012
              - CU013
              - CU014
      - number: '6.2'
        title: Public adoption proof relies on claimed footprint and procurement context
        blocks:
          - type: paragraph
            body: >-
              Roark's best public adoption signals are still indirect. Dealroom attributes more than 30,000 deployed
              counter-UAS devices to the company and says its service network is active in 30 U.S. cities and 12 UK
              cities, which is meaningful if accurate, but the same source does not disclose how those devices map to
              named customers, site counts, recurring revenue, or production versus pilot status. Independent 2026
              evidence is stronger on operating scale than on customer outcomes: Cushman & Wakefield reports Roark
              leased 13,650 square feet in Cambridge in Q1 2026, which suggests operating expansion, while DefenseScoop
              and Defense News show that defense buyers are budgeting and structuring new procurement routes for the
              category. Those signals support market access and deployment potential, but they do not close the proof
              gap on actual named Roark users.
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU006
              - CU007
              - CU010
              - CU013
          - type: table
