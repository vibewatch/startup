      - number: '1.3'
        title: Financing history is material but not cleanly verified
        blocks:
          - type: paragraph
            body: >-
              Roark's financing narrative is substantial enough to matter but messy enough to warrant caution. Multiples
              reports $285M raised across two rounds, with a $75M first round in January 2025, a $210M Series B in
              December 2025, and a $1.8B valuation for that Series B. Tracxn conflicts with the same story by reporting
              $287M total funding and saying the first funding round occurred in May 2025. Nordic9 preserves the same
              $210M Series B headline but at a lower $1.6bn valuation and explicitly marks the deal as pending
              verification. The result is enough evidence to treat a late-2025 growth financing as plausible, but not
              enough to accept the exact cap-table narrative without primary documents.
