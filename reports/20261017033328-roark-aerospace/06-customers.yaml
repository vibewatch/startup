company:
  name: Roark Aerospace
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence in the assigned pool supports Roark Aerospace's positioning toward government,
    military, and corporate-security buyers plus a lease/service-friendly buying motion, but it does
    not independently verify named production customers, retention metrics, or customer concentration.
    The strongest 2026 signals come from NATO and U.S. counter-UAS procurement posture and from
    Roark's claimed deployment footprint, not from fresh third-party customer outcomes.
sections:
  - id: buyer-segments-and-procurement-fit
    title: Buyer segments are clearer than named customer identities
    body: >-
      The most concrete buyer segmentation evidence in this pool comes from Dealroom's description of
      Roark's "drone detection as a service" model for government, military, and corporate sectors,
      combined with 2026 NATO and U.S. defense-policy evidence showing that public-sector buyers are
      actively widening counter-UAS procurement and testing channels. NATO's marketplace design matters
      because it is framed around point, area, and border defense use cases and explicitly allows both
      purchase and lease options, which aligns with Roark's service-oriented commercial motion better
      than a one-time hardware-only sale would. That said, this chapter's retained evidence shows the
      categories of buyers Roark is pursuing more clearly than the exact agencies, enterprises, or
      sites that are already live customers.
    claimRefs: [CU001, CU004, CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: public-adoption-proof
    title: Public adoption proof relies on claimed footprint and procurement context
    body: >-
      Roark's best public adoption signals are still indirect. Dealroom attributes more than 30,000
      deployed counter-UAS devices to the company and says its service network is active in 30 U.S.
      cities and 12 UK cities, which is meaningful if accurate, but the same source does not disclose
      how those devices map to named customers, site counts, recurring revenue, or production versus
      pilot status. Independent 2026 evidence is stronger on operating scale than on customer outcomes:
      Cushman & Wakefield reports Roark leased 13,650 square feet in Cambridge in Q1 2026, which
      suggests operating expansion, while DefenseScoop and Defense News show that defense buyers are
      budgeting and structuring new procurement routes for the category. Those signals support market
      access and deployment potential, but they do not close the proof gap on actual named Roark users.
    claimRefs: [CU002, CU003, CU005, CU006, CU007, CU010, CU013]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration
    title: Durability and concentration remain the core diligence gap
    body: >-
      The weakest part of the customer case is durability. None of the retained sources provides NRR,
      GRR, churn, renewal rates, contract terms, or top-customer exposure, so there is no public basis
      here to judge whether Roark's installed footprint converts into sticky software/service revenue or
      whether a small number of defense programs dominate the book. The quality of the external proof
      set is also uneven: the Unmanned Systems Technology tag-page fetch contains only site boilerplate,
      and Nordic9's funding item still labels the Series B as pending verification, which underlines
      how much of the public narrative is still financing- and category-context heavy rather than
      customer-reference heavy. For investors, that means the next diligence step is not more market
      sizing; it is direct customer-reference work and concentration disclosure.
    claimRefs: [CU011, CU012, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale
      - Revenue / strategic value
      - Gap
    rows:
      - - Government / defense installations
        - National defense buyers / base-security operators / public budgets
        - Installation airspace defense and counter-UAS coverage
        - Strongest external demand proof comes from FY26 U.S. budget and homeland-policy updates
        - Strategically important anchor segment if Roark can clear procurement and testing hurdles
        - No named Roark agency, base, or contract disclosed in the retained pool
      - - NATO procurement route
        - NATO working groups / allied militaries / sovereign defense budgets
        - Point, area, and border defense across static, deployable, and mobile systems
        - 2026 marketplace pilot for 18 systems with purchase and lease options
        - Could compress multinational route-to-market if Roark is shortlisted or interoperable
        - No evidence Roark is one of the 18 selected systems or under contract
      - - Corporate / critical-infrastructure security
        - Enterprise security buyers / site operators / corporate security spend
        - Private-site drone detection as a service
        - Dealroom says the offer targets corporate sectors, but no named account is cited
        - Helpful diversification path beyond defense budgets
        - No public enterprise logo, outcome, or renewal data in this pool
      - - Homeland / public-safety operators
        - Commanders and security teams / installation users / public budgets
        - Covered-facility defense with broader perimeter authority
        - New policy support is current, but Roark deployment specifics are absent
        - Could widen buyer urgency where policy authority was previously ambiguous
        - Policy evidence is not equivalent to customer evidence
    notes: Public-source segmentation snapshot; scale reflects buyer demand and route-to-market evidence, not verified disclosed contract value.
    claimRefs: [CU001, CU004, CU005, CU006, CU007, CU008, CU009]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Counter-UAS devices deployed
        - ">30,000 globally"
        - "2025"
        - Dealroom
        - Medium
        - Suggests a non-trivial installed-footprint claim
        - Sites, active customers, and recurring-revenue mix are undisclosed
      - - Service-network locations
        - 30 U.S. cities; 12 UK cities
        - "2025"
        - Dealroom
        - Medium
        - Implies geographic activity in core Anglo markets
        - Definition of a city deployment or service node is undisclosed
      - - Cambridge operating footprint
        - 13,650 sq ft leased
        - Q1 2026
        - Cushman & Wakefield
        - Medium
        - Supports operating expansion and delivery capacity in Cambridge
        - Not direct evidence of customer count or spend
      - - U.S. counter-UAS budget
        - $3.1bn FY26 request
        - FY26
        - DefenseScoop
        - Medium
        - Expands funded demand for the category
        - No disclosed Roark award, booking, or conversion rate
    notes: Mixes company-attributed footprint, third-party operating-scale evidence, and category-budget context; missing denominators highlight what public sources still do not disclose.
    claimRefs: [CU002, CU003, CU007, CU010]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof surface
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - No named U.S. installation disclosed
        - Government / homeland defense
        - Covered-facility and installation C-UAS
        - Undisclosed
        - Policy urgency and buyer authority clearly improved in 2025-2026
        - Public policy evidence does not identify a Roark customer, site, or live production deployment
      - - No named NATO nation or program disclosed
        - Allied defense procurement
        - Point, area, and border defense across multiple deployment modes
        - Testing / marketplace stage
        - Purchase, lease, and test-before-buy pathways are explicit in 2026
        - No evidence Roark is selected, tested, or contracted through this route
      - - No named corporate site disclosed
        - Corporate / critical infrastructure
        - Drone detection as a service for enterprise sites
        - Undisclosed
        - Corporate buyer category is explicitly mentioned in Dealroom
        - No public logo, quantified outcome, or renewal evidence in the retained pool
    notes: Partial enumeration of the public proof surfaces reviewed for customer evidence; rows record what the pool can and cannot verify rather than inventing undisclosed names.
    enumerationScope:
      coverage: partial
      basis: Public proof surfaces retained in the assigned pool for 2025-2026 customer evidence, not a complete customer roster.
    claimRefs: [CU001, CU005, CU006, CU008, CU012, CU013, CU014]
figures:
