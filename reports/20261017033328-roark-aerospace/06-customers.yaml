    title: Customer journey map
    type: journey-map
    summary: Public-buyer qualification is well evidenced; named-customer conversion and durability are not.
    data:
      items:
        - label: Demand signal emerges
          actor: Government and allied security buyers
          stage: Demand
          channel: Policy and procurement forums
          touchpoints:
            - U.S. homeland counter-UAS policy expands installation-defense authority
            - AIRCOM Industry Day 2026 spotlights interoperability and operational relevance
        - label: Use case is framed
          actor: NATO and public-sector program teams
          stage: Qualification
          channel: C-UAS challenge design
          touchpoints:
            - Point, area, and border defense are the explicit NATO use cases
            - Static, deployable, and fully mobile configurations are all in scope
        - label: Test-before-buy route opens
          actor: Allied nations and procurement agencies
          stage: Evaluation
          channel: Marketplace and trial ranges
          touchpoints:
            - NATO says contracts will include purchase and lease options
            - Common funding lets nations test systems before procurement decisions
        - label: Roark commercial model fits this motion
          actor: Roark and buyer procurement teams
          stage: Commercial fit
          channel: Service and lease-friendly buying motion
          touchpoints:
            - Dealroom describes a subscription-based drone detection as a service model
            - The offer is aimed at government, military, and corporate sectors
        - label: Claimed footprint appears
          actor: Roark operating network
          stage: Deployment
          channel: Claimed installed-base and geography
          touchpoints:
            - Dealroom says more than 30,000 counter-UAS devices were deployed globally as of 2025
            - Dealroom says the service network is active in 30 U.S. cities and 12 UK cities
        - label: Referenceability breaks down
          actor: Investors and diligence team
          stage: Evidence gap
          channel: External validation
          touchpoints:
            - No retained source provides named production customers, retention metrics, or top-customer share
            - Nordic9 still marks the Series B item as pending verification
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU012, CU013, CU014]
