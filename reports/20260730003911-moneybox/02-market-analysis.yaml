callouts:
  - calloutType: insight
    title: The real market is UK household behavior, not abstract fintech TAM
    body: >-
      Moneybox is best analyzed as a wrapper-led, app-native consumer wealth business anchored in UK savings behavior,
      not as a generic global fintech platform.
    claimRefs: [CM001, CM002, CM003]
  - calloutType: strength
    title: The market is large enough because under-engagement remains high
    body: >-
      Public wrapper and household-finance data imply large pools of consumers still need simpler paths into investing,
      saving, first-home planning, and pension organization.
    claimRefs: [CM005, CM006, CM010, CM014]
  - calloutType: risk
    title: UK concentration and policy dependence are built into the market
    body: >-
      Moneybox benefits from wrapper demand, but that same focus concentrates the business in UK consumer confidence,
      tax-policy, and rate-cycle dynamics.
    claimRefs: [CM020, CM024, CM025, CM026]
