  claims:
    - {id: CM001, statement: Moneybox operates in UK consumer savings and wealth management rather than in a generic global fintech market, type: inferred, topic: market-definition, sourceRefs: [SM001, SM004, SM005, SM006], confidence: medium, freshness: current, answersQuestionRefs: [QM001]}
    - {id: CM002, statement: The most relevant public market boundary includes app-led savings, ISA, pension, and first-home workflows for UK retail users, type: inferred, topic: market-definition, sourceRefs: [SM001, SM004, SM005, SM006], confidence: medium, freshness: current, answersQuestionRefs: [QM001, QM002]}
    - {id: CM003, statement: Moneybox does not publicly position itself as serving institutional, adviser-led, or global wholesale finance markets, type: observed, topic: market-definition, sourceRefs: [SM004, SM005, SM006], confidence: medium, freshness: current, answersQuestionRefs: [QM001]}
    - {id: CM004, statement: The company’s market is best understood through adjacent UK wrapper and household-finance jobs rather than a single brokerage category, type: inferred, topic: market-definition, sourceRefs: [SM001, SM004, SM005, SM006], confidence: medium, freshness: current, answersQuestionRefs: [QM002]}
    - {id: CM005, statement: HMRC savings statistics indicate that ISA and LISA activity represent a material national savings pool in the UK, type: third-party-reported, topic: market-size, sourceRefs: [SM013, SM018, SM019], confidence: high, freshness: recent, answersQuestionRefs: [QM003, QM004]}
    - {id: CM006, statement: The Investment Association ISA Barometer provides an independent market lens showing continuing significance of ISA activity in the UK savings and investing market, type: third-party-reported, topic: market-size, sourceRefs: [SM015, SM018], confidence: high, freshness: recent, answersQuestionRefs: [QM003, QM004]}
    - {id: CM007, statement: ONS household-finance publications support the view that the UK household wealth and savings base is large enough to support specialist guided-wealth platforms, type: third-party-reported, topic: household-wealth, sourceRefs: [SM021, SM024], confidence: high, freshness: current, answersQuestionRefs: [QM003]}
    - {id: CM008, statement: FCA Financial Lives and related FCA research indicate many consumers still face confidence and engagement barriers around investing and longer-term financial decisions, type: third-party-reported, topic: advice-gap, sourceRefs: [SM014, SM025], confidence: high, freshness: current, answersQuestionRefs: [QM005, QM016]}
    - {id: CM009, statement: Those engagement barriers create room for simple guided financial products that reduce complexity for retail users, type: inferred, topic: advice-gap, sourceRefs: [SM014, SM025, SM001], confidence: medium, freshness: current, answersQuestionRefs: [QM005]}
    - {id: CM010, statement: Beginner investors are a core addressable segment for Moneybox because the company offers guided entry points into investing through standardized wrappers, type: inferred, topic: segments, sourceRefs: [SM004, SM016, SM017], confidence: medium, freshness: current, answersQuestionRefs: [QM006, QM010]}
    - {id: CM011, statement: Cash-first savers are a meaningful segment because Moneybox also addresses cash-holding behavior, not only investing behavior, type: inferred, topic: segments, sourceRefs: [SM001, SM016, SM017], confidence: medium, freshness: current, answersQuestionRefs: [QM006, QM007]}
    - {id: CM012, statement: In Moneybox’s core market the buyer, user, and payer are usually the same retail household person, type: inferred, topic: buyer-structure, sourceRefs: [SM004, SM005, SM006], confidence: medium, freshness: current, answersQuestionRefs: [QM007]}
    - {id: CM013, statement: First-home savers using the Lifetime ISA are a high-intent segment because home purchase is a concrete trigger for recurring contributions, type: inferred, topic: segments, sourceRefs: [SM006, SM020, SM001], confidence: medium, freshness: current, answersQuestionRefs: [QM006, QM008, QM020]}
    - {id: CM014, statement: Pension consolidators are a distinct segment because Moneybox publicly positions pension search and consolidation as a core workflow, type: company-claimed, topic: segments, sourceRefs: [SM005, SM001], confidence: high, freshness: current, answersQuestionRefs: [QM006, QM009, QM021]}
    - {id: CM015, statement: ISA, LISA, and pension wrapper structures are not just products for Moneybox; they are the operating boundary of its serviceable market, type: inferred, topic: wrappers, sourceRefs: [SM005, SM006, SM013, SM015], confidence: medium, freshness: current, answersQuestionRefs: [QM004]}
    - {id: CM016, statement: Moneybox’s core market is composed of workflow segments tied to life goals rather than enterprise verticals or industry departments, type: inferred, topic: segments, sourceRefs: [SM001, SM004, SM005, SM006], confidence: medium, freshness: current, answersQuestionRefs: [QM006]}
    - {id: CM017, statement: The guided-wealth opportunity is strengthened by the fact that many consumers want actionability rather than bespoke financial advice, type: inferred, topic: advice-gap, sourceRefs: [SM014, SM025, SM016], confidence: medium, freshness: current, answersQuestionRefs: [QM005]}
    - {id: CM018, statement: Public third-party review and benchmark sources imply digital app-based distribution is now a meaningful part of the UK investment and savings decision set, type: third-party-reported, topic: digital-demand, sourceRefs: [SM016, SM022, SM023], confidence: medium, freshness: current, answersQuestionRefs: [QM003, QM019]}
    - {id: CM019, statement: A major driver of Moneybox’s market is continued digital adoption for regulated consumer-finance workflows, type: inferred, topic: drivers, sourceRefs: [SM018, SM022, SM023], confidence: medium, freshness: current, answersQuestionRefs: [QM011, QM019]}
    - {id: CM020, statement: Another major driver is the UK tax-wrapper system, which creates recurring reasons for households to act before annual deadlines, type: inferred, topic: drivers, sourceRefs: [SM013, SM015, SM018], confidence: medium, freshness: current, answersQuestionRefs: [QM011, QM012, QM013]}
    - {id: CM021, statement: First-home affordability pressure supports demand for disciplined deposit-building tools and wrapper-led saving behavior, type: inferred, topic: drivers, sourceRefs: [SM006, SM020, SM021], confidence: medium, freshness: current, answersQuestionRefs: [QM011, QM020]}
    - {id: CM022, statement: The Lifetime ISA is an especially valuable driver because it links a government-supported wrapper to a clear consumer milestone, type: inferred, topic: drivers, sourceRefs: [SM006, SM013, SM020], confidence: medium, freshness: current, answersQuestionRefs: [QM008, QM012, QM020]}
    - {id: CM023, statement: Pension fragmentation is a real growth driver because many consumers need help locating and consolidating old pension pots, type: inferred, topic: drivers, sourceRefs: [SM005, SM001, SM014], confidence: medium, freshness: current, answersQuestionRefs: [QM009, QM011, QM021]}
    - {id: CM024, statement: A principal constraint on Moneybox’s market is UK-only geographic concentration, type: inferred, topic: constraints, sourceRefs: [SM001, SM002], confidence: medium, freshness: current, answersQuestionRefs: [QM014, QM015, QM022]}
    - {id: CM025, statement: Another constraint is dependence on UK tax-wrapper and regulatory policy remaining favorable to retail self-directed saving, type: inferred, topic: constraints, sourceRefs: [SM013, SM015, SM014], confidence: medium, freshness: current, answersQuestionRefs: [QM012, QM022]}
    - {id: CM026, statement: Cash-rate competition can attract low-loyalty balances and make the savings segment more rate-sensitive than the investing segment, type: inferred, topic: constraints, sourceRefs: [SM016, SM017, SM022], confidence: medium, freshness: current, answersQuestionRefs: [QM014, QM022]}
    - {id: CM027, statement: Consumer confidence and cost-of-living pressure can reduce both investing appetite and the ability to maintain regular contributions, type: inferred, topic: constraints, sourceRefs: [SM014, SM021], confidence: high, freshness: current, answersQuestionRefs: [QM014, QM022]}
    - {id: CM028, statement: The correct Moneybox sizing frame narrows from broad household savings and wrapper pools into digitally reachable self-directed users, type: inferred, topic: sam-som, sourceRefs: [SM005, SM006, SM014, SM018], confidence: medium, freshness: current, answersQuestionRefs: [QM017, QM018]}
    - {id: CM029, statement: Moneybox’s 1.9 million-plus customer base implies it has already captured meaningful share inside its narrower guided-wealth niche, type: company-claimed, topic: penetration, sourceRefs: [SM002, SM010, SM012], confidence: high, freshness: current, answersQuestionRefs: [QM023]}
    - {id: CM030, statement: The economic quality of the market improves when a single user becomes a multi-product household rather than a one-account user, type: inferred, topic: expansion, sourceRefs: [SM001, SM004, SM005], confidence: medium, freshness: current, answersQuestionRefs: [QM025]}
    - {id: CM031, statement: Public sources support the conclusion that Moneybox’s niche is already proven as viable even if the precise national SAM remains fuzzy, type: inferred, topic: sam-som, sourceRefs: [SM001, SM002, SM015], confidence: medium, freshness: current, answersQuestionRefs: [QM018, QM023]}
    - {id: CM032, statement: The most important market question for investors is not whether UK household savings exist, but whether Moneybox can deepen share and wallet capture inside its niche, type: inferred, topic: valuation-link, sourceRefs: [SM001, SM002, SM024], confidence: low, freshness: current, answersQuestionRefs: [QM025]}
    - {id: CM033, statement: Public market evidence does not support a single precise pound-denominated SAM or SOM for Moneybox without private company conversion data, type: observed, topic: sizing-gap, sourceRefs: [SM013, SM015, SM014], confidence: medium, freshness: current, answersQuestionRefs: [QM024]}
    - {id: CM034, statement: The absence of a single precise public SAM does not invalidate the investment case if the niche already shows meaningful penetration and depth, type: inferred, topic: sizing-gap, sourceRefs: [SM002, SM015, SM024], confidence: low, freshness: current, answersQuestionRefs: [QM024, QM025]}
    - {id: CM035, statement: Later valuation work should treat Moneybox as a focused domestic guided-wealth platform rather than as an unconstrained global consumer-finance software story, type: inferred, topic: valuation-link, sourceRefs: [SM001, SM002, SM024], confidence: medium, freshness: current, answersQuestionRefs: [QM015, QM025]}
