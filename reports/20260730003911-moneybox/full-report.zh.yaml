      - number: '7.3'
        title: 竞争、利率和英国集中度风险塑造商业模式
        blocks:
          - type: paragraph
            body: >-
              Moneybox 面临一组特别难受的商业风险：业务只在英国，服务零售用户，获客逻辑又部分依赖用户比较利率、税优账户便利性和品牌信任。因此，公司对英国国内宏观、Bank of England
              利率周期、税优账户政策变化都很敏感。YourMoney 对 Moneybox Cash ISA 的报道说明了它为什么会变成运营问题：奖励利率结构、Santander 和 HSBC
              等第三方银行之间的资金分配、FSCS 限额复杂性，都会影响客户行为和客服负荷。被诱人现金收益吸引来的利率敏感型储户，未必会像因更广泛财富管理需求留下来的客户那样表现。

              竞争会放大这类风险。Chip 和 Plum 可以挤压 app 原生储蓄和自动化细分场景；J.P. Morgan 旗下 Nutmeg、Hargreaves Lansdown、AJ
              Bell、Dodl、Wealthify、Vanguard 则在信任、成本或产品宽度上设定外部标尺。结果是，Moneybox
              的利润率质量取决于能否在引导式便利和产品打包上持续领先；它不能指望地理多元化或明显价格领先来吸收每一次外部冲击。
