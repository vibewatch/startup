  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律风险是结构性的，不是偶发的
        blocks:
          - type: paragraph
            body: >-
              Moneybox 与英国零售金融监管紧密相连，因为其核心产品是税优账户，吸引力、披露要求和转户机制都由公共政策定义。FCA 授权、CASS 义务、
              运营韧性预期、消费者保护要求，以及更广泛的行为监管环境，都在公司正常运营模型内部，而不是边缘事项。这很重要，因为即便核心应用体验不变， 规则变化也可能改变产品吸引力。2027 年 ISA
              改革说明文件就是一个具体例子：政府已经为许多用户设定更低的 Cash ISA 额度， 对非现金 ISA 转入 Cash ISA 设置新限制，并制定反规避规则，意在把储蓄者推向投资产品，而不是长期停在现金。

              Moneybox 面对的是机会和风险并存。偏向非现金投资的变化可以帮助平台更广泛的投资主张，但也可能让产品设计、客户沟通和储蓄主导获客策略更复杂。 LISA
              政策同样敏感，因为提款规则、奖金和购房资格由政府定义，而不是公司控制。实际风险并不是监管突然让业务违法，而是渐进规则变化提高合规成本、 改变产品组合，或制造公司无法完全控制的客户不满。
            claimRefs:
