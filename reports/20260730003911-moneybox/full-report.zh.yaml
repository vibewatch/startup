  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与客户任务
        blocks:
          - type: paragraph
            body: >-
              Moneybox 按消费者财务目标组织产品，而不是围绕抽象资产类别。用户可以从储蓄或找零开始，借助引导式起步选项或直接敞口进入投资，用 LISA 实现首次购房目标， 整合养老金，或通过 Junior ISA
              为孩子储蓄。这很重要，因为应用被设计来承接更广泛的个人金融工作流，而不是只承接一个账户。零售价值主张是便利、 引导和递进，而不是高级交易执行深度。

              产品广度也有经济意义。一个从零钱储蓄开始的家庭，之后可以逐步进入更高余额的税优账户、退休或购房产品。这条递进路径，是 Moneybox 为什么能更像平台、而不只是单功能金融科技公司的最清晰公开解释。
