      - number: '1.2'
        title: 创始人、治理与法律结构
        blocks:
          - type: paragraph
            body: >-
              创始人连续性是 Moneybox 最清晰的优势之一。Ben Stanway 和 Charlie Mortimer 仍是核心创始运营者，也仍在公开资料中代表公司的战略方向、
              产品理念和融资里程碑。支持公告和投资者材料反复引用 Stanway，年报和早期公司页面则强化了 Mortimer 作为联合创始人和产品架构师的持续角色。
              这种连续性在受监管的消费者金融公司里很重要，因为产品信任、合规质量和客户结果往往取决于管理团队在扩张过程中能否保持纪律。年报还显示，
              公司的治理成熟度明显高于小型应用初创公司：非执行董事、董事会委员会，以及覆盖风险、薪酬、提名、资金管理、产品治理、CASS 和信息安全的管理委员会均已具名。

              法律上，集团以 Digital Moneybox Limited 为核心，并用子公司承载抵押贷款、养老金和其他受监管业务。Companies House 确认了主体公司编号和注册地址， Play Store
              列表则披露 FCA 权限和保护措辞。因此，治理图景总体正面，但公开来源还不能完全穷尽：董事会名单可在高层级看到，完整所有权、投票控制和观察员权利细节仍未公开。
              这使得创始人集中度成为公司概览中的真实特征，但不必然构成问题。
