        title: 公开缺口、定价压力与仍需尽调的问题
        blocks:
          - type: paragraph
            body: >-
              公开记录在公司层面很强，在客户队列层面仍不完整。CAC、回本周期、按产品拆分的贡献利润率、按客户队列拆分的流失率，或订阅收入、投资费用、
              储蓄收入与抵押贷款相邻经济之间的清晰桥接，都没有公开。公开竞争对手定价让这个缺口不只是学术问题：Chip 公开营销更低投资费用观感， AJ Bell 和 Vanguard
              为主要关注账户壳成本的消费者提供可见的低成本替代。这并不意味着 Moneybox 定价过高，因为它的主张更宽、更有引导性； 但确实意味着当前盈利的可持续性依赖留存、钱包增长和自动化，而不是只靠费用领导力。

              因此，最重要的下一步尽调不是再找一个历史收入点，而是拿到产品层面的经济性和利率敏感性视图。投资者需要知道哪些入口产品创造最高 LTV、
              储蓄利率压缩会多大程度伤害收入组合，以及当余额和客户预期实质性上升时，支持或合规成本是否会侵蚀今天有吸引力的利润率。
