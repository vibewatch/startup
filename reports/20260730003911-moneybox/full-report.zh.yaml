      - number: '2.3'
        title: 增长驱动、结构性约束与时点逻辑
        blocks:
          - type: paragraph
            body: >-
              主要需求驱动很直接。数字分发降低获客摩擦。现金转投资仍是消费者的现实需求。英国税优账户体系给了人们在纳税年度截止前行动的理由。首次购房负担压力让 LISA
              和有纪律的储蓄旅程尤其相关。养老金碎片化带来行政痛点，Moneybox 这类应用可以解决。储蓄利率竞争也让消费者持续关注余额停放位置；这有助于获客，
              即便之后可能让产品组合更复杂。公开市场来源持续显示，消费者仍想要更简单的旅程和更清晰的金融工具，尤其是在信心偏低、传统建议昂贵或难以获得时。

              主要约束同样清楚。Moneybox 只在英国经营，宏观和政策暴露高度集中。ISA、LISA 和养老金规则在政治和监管上都重要。现金利率竞争能吸引摇摆用户。
              初级投资者市场有吸引力，但也受消费者信心、生活成本压力和投资风险感知影响。因此，市场时点不只是长期数字化的问题；还要看消费者是否有剩余现金、 是否信任账户壳，以及是否相信应用能把复杂决策变得安全且可执行。
