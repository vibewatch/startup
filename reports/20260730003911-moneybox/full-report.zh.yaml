chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与当前规模
        blocks:
          - type: paragraph
            body: >-
              Moneybox 是一家总部位于伦敦的消费者储蓄与财富管理应用，服务想用移动端引导完成储蓄、投资、购房和退休规划的英国零售用户。 公司于 2015 年注册成立，2016
              年正式上线，最早凭借把日常刷卡消费中的零钱自动扫入投资账户的找零机制打出知名度。这一最初切入口仍然重要， 因为它解释了品牌来源，但已经无法概括今天的完整业务。公开产品资料和 2024 年报显示，Moneybox
              现在覆盖 Stocks and Shares ISA、Cash ISA、Lifetime ISA、Junior ISA、普通投资账户、养老金、现金储蓄和购房流程。这个广度具有战略意义：公司不只是在争夺首次投资者，
              而是在围绕重大财务里程碑建立更广泛的零售财富关系。

              最强的规模信号既新也具体。Moneybox 2024 年报记录，截至 2024 年底，公司拥有 130 万已入金客户和 £11.7 billion 管理资产。2026 年 7 月的支持公告又把口径更新为超过
              190 万客户和超过 £23 billion AUA，并披露 2026 年上半年新增客户 390,000+、同期流入 £3.5 billion。 这些披露说明，Moneybox
              的身份已经从小众储蓄应用转向规模化大众市场英国财富平台；其价值主张不是单一投资产品，而是简单性、账户壳广度和生命周期匹配度。
