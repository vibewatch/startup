  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反方论点
        blocks:
          - type: paragraph
            body: >-
              核心投资论点在英国消费金融科技里罕见地强。Moneybox 已从产品承诺走到规模化财务证明：公司称客户超过 1.9 million，管理资产超过 £23 billion，2025 年年收入超过 £115
              million，并连续第三年盈利。2024 年年报已经显示收入 £93.8 million、税前利润 £19.7 million、毛利率 97%、AUA £11.7 billion，因此 2026
              年更新并不是在不透明基础上的信仰跳跃。产品宽度同样重要。Moneybox 已不再是单一功能的零钱进位 app；它覆盖股票投资 ISA、现金 ISA 和 Lifetime ISA、养老金、儿童
              ISA、普通投资、购房和养老金整合流程。平台深度叠加对零售用户友好的品牌，支撑了 Moneybox 成为英国品类定义型财富 app 的可能。

              反方论点不在于公司是否已经有规模，而在于价格发现和市场集中度。£800 million 估值来自全新的 PISCES 场所上一笔受控员工老股转让，并非传统竞争性新股融资轮。FCA 明确将 PISCES
              定位为私募市场沙盒，发行人可以控制买方准入和定价边界；独立报道也指出，交易稀薄、公开历史有限，使外界很难判断同一价格能否经得住更广泛外部融资检验。投资者因此不是在判断一门弱生意，而是在决定应给一个新流动性机制、以及一个英国本土财富平台多少信心；后者的估值倍数扩张可能受监管、储蓄利率周期和本土竞争封顶。
