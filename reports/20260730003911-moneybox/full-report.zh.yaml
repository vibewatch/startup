      - number: '8.3'
        title: 情景分析与敏感性
        blocks:
          - type: paragraph
            body: >-
              情景区间不需要英雄式电子表格建模，因为收入锚点异常具体。若投资者把公司所称 2025 年收入超过 £115 million
              当作最低基线，一个合理的、面向私募晚期投资的公开市场可比区间可以用收入倍数框定，而不是靠投机性的用户数或 AUA 经验法则。熊市情景下，Moneybox 保持盈利但增长降温，PISCES
              定价被证明偏乐观，英国集中度和政策风险把需求限制在约 5x 到 6x 收入。这对应约 £575 million 到 £690
              million。基准情景下，公司凭强留存、广产品深度和消费者信任优势继续复利，但没有国际可选性或利润率披露的阶跃变化。按约 £115 million 到 £120 million 收入的 6.5x 到 7.5x
              计算，对应约 £750 million 到 £900 million。

              牛市情景要求的不只是公司继续存在。它需要证明，Moneybox 的类投顾和人生阶段产品扩展能够加深 ARPU，2026 年新增客户能转化为持久余额，市场会把平台看成规模化数字财富复利器，而不是利率敏感型储蓄
              app。在这些条件下，£115 million 到 £120 million 收入上约 8.5x 到 10x，得到约 £980 million 到 £1.15
              billion。这足以支撑或小幅超过当前估值，但还不足以称其为明确便宜。实际结论是，当前估值已经折现了真实业务质量；除非增长、投顾变现或退出可选性继续改善，否则上行空间只有中等。
