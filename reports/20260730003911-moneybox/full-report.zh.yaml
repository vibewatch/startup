figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 公开记录显示，Moneybox 从引导式投资稳步扩展到全栈英国零售财富管理；2026 年 7 月，在 PISCES 机制支持的二级交易中达到相当于独角兽的估值。
    data:
      items:
        - date: '2016'
          label: 零钱取整功能公开上线
          detail: 股票与证券 ISA 叠加零钱取整机制，切出最初的消费者投资切入点。
          tone: positive
        - date: '2017'
          label: 儿童 ISA 和 LISA 上线
          detail: 产品从早期投资扩到家庭储蓄和首次购房流程。
          tone: positive
        - date: '2019'
          label: 养老金整合上线
          detail: 退休账户整合和现金 LISA 加深长期客户价值。
          tone: positive
        - date: '2021'
          label: 抵押贷款上线
          detail: Moneybox 从购房储蓄延伸到抵押贷款相邻的执行支持。
          tone: positive
        - date: 2022-03
          label: Series D 轮 £35m
          detail: Fidelity 领投最后一轮已知大型一级融资，Polar Capital 参投。
          tone: positive
        - date: 2024-10
          label: Apis / Amundi 交易估值 £550m
          detail: 一笔主要为二级交易、规模约 £70m 的交易重设估值，也扩大机构背书。
          tone: positive
        - date: '2025'
          label: 盈利能力与客户结果证据
          detail: 年报披露，截至 2025 年 4 月，已帮助 120k+ 首次购房，并找回 £600m+ 养老金。
          tone: positive
        - date: 2025-late
          label: Aurora 上线
          detail: 公开材料把 Aurora 定位为弥合咨询缺口的早期个性化支持。
          tone: positive
        - date: 2026-07
          label: PISCES 支持的员工二级交易，估值 £800m
          detail: Moneybox 不是靠一级融资，而是通过受控流动性窗口跨过独角兽门槛。
          tone: warning
    approximationNotes: 公开说法称 Aurora 于 2025 年末上线；更早的大多数里程碑直接来自年报和支持材料。
    claimRefs:
      - CO006
      - CO017
