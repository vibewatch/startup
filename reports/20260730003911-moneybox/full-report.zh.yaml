      - number: '8.2'
        title: 估值语境与可比公司组
        blocks:
          - type: paragraph
            body: >-
              当前估值语境比标准独角兽标题更细。Moneybox 2026 年 7 月公告称，公司准备以约 £800 million 估值出售至多 £45 million 老股，较 2024 年 10 月以二级交易支持的
              £550 million 估值大约提升 45%。这一点重要，因为新估值并未脱离此前证据：2024 年交易已经指向一家盈利、AUA 超过 £10 billion、收入快速扩张的公司；2026
              年更新又增加了一年盈利、更高 AUA 和持续客户增长。按粗略收入数学，用公司披露的 £115 million 下限计算，当前估值约为 2025 年收入的
              7x。这不是困境估值，但对一家盈利且高增长的平台型公司而言，也不明显亢奋。

              可比公司显示，这个价格合理但偏满。Nutmeg 据报道 2021 年约 £700 million 出售时，市场周期明显更早，且早于更名后平台被称 AUM 超过 £8.5 billion、客户 265,000
              名。相比之下，AJ Bell 是成熟上市标杆，2026 年收入 £317.8 million、AUA £108.2 billion、市值约 $3.12 billion；Hargreaves Lansdown
              私有化前最后已知公开市值约 $7.12 billion。Wealthsimple 位于野心区间的另一端：2025 年投后估值 CAD $10 billion，已盈利，AUA 超过 $100 billion，后又在
              2026 年 Q2 升至 $155.6 billion。相对这些锚点，Moneybox 的 £800 million 估值更像公平而非过高，但前提是利润韧性和客户深度能真正撑过更软的利率环境。
