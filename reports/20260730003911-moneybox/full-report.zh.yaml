            body: >-
              2024 年报罕见地让外界看到业务质量。收入从 £55.6 million 增至 £93.8 million，毛利达到 £90.7 million，毛利率达到 97%， 税前利润为 £19.7
              million，净流入为 £5.8 billion。AUA 升至 £11.7 billion，单客户 AUA 增长 53% 至 £9,002。这些指标重要，
              因为它们显示的不只是简单收入增长，还包括运营杠杆、客户钱包深度上升，以及一个虽处高度监管零售金融环境、却拥有类似软件毛利经济性的业务模型。 年报明确把部分杠杆归功于自有 Sycamore
              平台和高度自动化的运营模型。

              2026 年支持公告进一步推高了公开叙事：2025 年收入超过 £115 million，且 2025 年是连续第三年盈利。这改变了承销起点。Moneybox
              不再是能否摆脱风投资助活下来的问题，而是产品广度和监管要求扩大后，其利润画像能多耐久、多可防守的问题。
