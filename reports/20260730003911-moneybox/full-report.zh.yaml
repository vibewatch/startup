  summary: >-
    Moneybox 是一家总部位于伦敦的私营消费者财富管理平台，最初从储蓄和消费找零投资应用起步，后来扩展成覆盖 Stocks and Shares ISA、Cash and Lifetime ISA、Junior
    ISA、普通投资、养老金、储蓄、养老金整合和购房流程的多人生阶段金融关系。 公开证据显示，公司客户超过 190 万，管理资产超过 £23 billion，2025 年收入超过 £115 million，并连续第三年盈利。2026 年
