      - number: '7.4'
        title: 人员风险、缓释因素与投资论点失效触发点
        blocks:
          - type: paragraph
            body: >-
              创始人与团队风险真实存在，只是没有监管和商业风险那么戏剧化。Ben Stanway
              仍是围绕战略、融资和政策议题发声的核心公开发言人；公司由创始人带领，意味着领导层连续性本身就是文化和产品逻辑的一部分。这在出事前是优势，出事后就可能变成集中风险。如果执行质量下滑，而对创始人的依赖仍高，升级处理的带宽会很快收窄。更宽泛的人员风险在于，消费金融规模化需要运营、风险、合规、产品和客服人才同时到位；这些团队一旦协同变弱，服务质量可能先受损，之后才反映到公开财务数据里。

              好消息是，Moneybox
              看起来并不运营粗心。盈利、现金生成、成熟的董事会和委员会架构、审慎流程、披露的安全项目，都降低了灾难性断裂的概率。因此，正确的投资立场不是“因为有风险所以回避”，而是“因为最重要的风险可衡量且变化快，所以持续跟踪”。投资论点失效触发点包括：转户质量恶化、监管突然改变并削弱税优账户吸引力、利率和价格上长期被竞争对手压住、发生重大网络安全事件，或有证据显示关键客户分群弱于头部数字呈现的水平。
