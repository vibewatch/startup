      - number: '5.2'
        title: 平台架构与依赖结构
        blocks:
          - type: paragraph
            body: >-
              公开记录中最重要的单一技术事实是 Sycamore，这是 Moneybox 自研的储蓄和投资平台，公司把许多自动化和更低成本结构归功于它。这意味着公司在账户管理、
              产品配置和工作流自动化上拥有一层有意义的编排能力，尽管在更广泛服务栈中仍依赖合作银行、执行场所、托管结构和外部提供商。换句话说， Moneybox
              并没有完全垂直整合，但它似乎拥有对客户体验和运营杠杆最关键的软件层。

              这种架构有战略价值，因为多产品消费者金融一旦每个新账户壳都依赖脆弱的第三方系统拼接，就会变得笨重。更多掌握编排层，应让公司更容易推出相邻产品、
              自动化服务任务并守住利润率。这也意味着，公司更有机会在多个产品之间标准化控制、客户旅程和账户服务，而许多同行仍把这些产品呈现为松散连接的点解决方案。
