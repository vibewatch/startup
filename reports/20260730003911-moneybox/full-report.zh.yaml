      - number: '4.3'
        title: 资本充足、流动性与风险承担画像
        blocks:
          - type: paragraph
            body: >-
              Moneybox 的资产负债表风险画像看起来好于贷款人或保险公司，因为公司主要是在聚集和管理客户资产，而不是承销长期信用。年报称，截至 2024 年底， 运营现金余额为 £58.3
              million，公司产生了可观自由现金流。年报还描述了一个资金管理框架，允许在获批风险限额内，把多余公司流动性放入即时可取现金和短期英国国债。
              同一份公开记录显示，公司按投资公司审慎规则做资本和流动性压力测试，对合作银行做每日信用监控，遵守年度 CASS 审计要求，并拥有对消费者应用来说相当成熟的运营风险治理。

              这些披露让公司看起来比许多后期私营金融科技公司脆弱性低得多。开放问题不是 Moneybox 是否有可运作的审慎框架，而是在储蓄利率下行、客服成本上升， 或产品组合转向低收益余额时，利润率和增长还能保持多大韧性。
