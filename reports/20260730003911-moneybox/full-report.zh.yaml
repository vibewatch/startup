      - number: '5.3'
        title: 安全、信任与质量控制
        blocks:
          - type: paragraph
            body: >-
              对一家私营消费者应用来说，公开信任信号相对强。年报称，Moneybox 每年对系统和移动应用做第三方渗透测试，设有 Information Security Management Committee，并已达到
              NIST Cybersecurity Framework Capability Maturity Model Integration Level 3 一致性。 Play Store
              披露也使用银行级加密措辞，并重复 FCA 监管和 FSCS 保护框架。年报还加入运营韧性自评、关键第三方尽调，以及持续审慎和 CASS 治理。 对零售财富应用来说，这种披露出的控制成熟度让人明显更安心。

              局限在于，公开控制描述仍不等于硬运营遥测。没有公开可用性仪表盘，没有事故率披露，也没有细粒度服务质量证据，除了评分和评价。因此质量论点不错， 但还不完整。
