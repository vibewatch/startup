  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界，以及 Moneybox 实际卖向哪里
        blocks:
          - type: paragraph
            body: >-
              Moneybox 的正确市场边界比「全球金融科技」、甚至「财富科技」更窄，也更有用。公开证据显示，公司聚焦英国居民家庭，通过移动优先界面使用储蓄、
              投资、养老金和购房税优账户。这意味着它的实际市场由几个相邻资金池组成：消费者现金储蓄、Stocks and Shares ISA、Cash ISA、Lifetime
              ISA、养老金整合，以及初级零售投资普及。Moneybox 因此暴露于英国居民家庭配置闲置现金的行为，而不是一个无国界的全球软件市场。这个区别很重要，
              因为只做英国、重度围绕账户壳的策略仍然可以是一门很好的生意，但应按英国政策和家庭金融条件承销，而不是拿泛化的风投级 TAM 幻灯片来判断。

              HMRC 的年度储蓄评论和统计、Investment Association 的 ISA Barometer、FCA Financial Lives 研究，以及 ONS 家庭金融出版物都指向同一个结构性特征：
              可服务机会很大，因为大量家庭余额仍停留在现金中，账户壳使用规模可观，而且许多人仍需要帮助，把抽象的长期目标转成简单行动。Moneybox 在这个市场里的角色，
              不是服务机构交易员或高净值顾问；它要把税优账户和金融习惯打包给大众与新兴富裕英国消费者，他们更想要低摩擦行动，而不是定制化建议。
