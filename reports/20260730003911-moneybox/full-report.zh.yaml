              公开增长曲线不只是虚荣流量。年报记录 2024 年客户 130 万、净新增客户 40 万；2026 年支持公告则把总数更新为超过 190 万客户、 仅 2026 年上半年新增客户 390,000+，AUA 超过
              £23 billion。这不仅显示触达扩大，也显示平台内部有实质资产集中。更重要的是， Moneybox 把这些规模数字与具体结果放在一起。公司称，截至 2025 年 4 月已帮助完成超过 120,000
              次首次购房；到 2026 年 7 月， 超过 200,000 名客户已为首次购房储蓄，且超过 £800 million 遗失养老金已重归客户名下。

              这些都是重要验证点，因为它们显示客户活动绑定真实财务结果，而不只是应用会话或浅层注册。对消费者金融平台来说，这比原始下载或流量数字更有力， 也在今天实质增强了面向投资者的客户质量叙事。
