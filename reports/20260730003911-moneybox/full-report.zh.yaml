      - number: '8.4'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出准备度好于许多私有金融科技公司，因为 Moneybox 已经展示过有序流动性机制，但离投资委员会完全开绿灯仍缺关键证据。2024 和 2026
              两次交易看起来都更像股东流动性事件，而不是救急融资，这是正面信号。PISCES 也给公司提供了一条国内部分流动性路径，无需在管理层准备好之前硬推
              IPO。但同一机制仍早期、实验性强且受控。因此，最重要的缺失变量不是基本规模指标，而是决定晚期投资者能否从这一进入点获得有吸引力回报的变量，包括清算优先权结构、过往二级交易留下的任何悬而未决压力、经审计的
              2025 年财务报表、出售后市场出清需求、产品级 ARPU，以及各客户分群的利率敏感性。

              投资者还应记住，Moneybox 结构上仍以英国为中心。这一聚焦在产品设计和监管适配上是优势，但相较更多元的财富平台，会收窄战略收购方和 IPO 叙事。若能证明 Aurora
              或相邻投顾工具可以扩大变现、首次购房和退休流程能加深钱包份额、储蓄利率竞争加剧时利润率质量仍能守住，上行情景会更有说服力。在这些数据室问题得到回答前，公司原则上显然可投，但仅凭公开尽调，还不能按当前价格完全承销。
