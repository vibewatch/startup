        title: 定价、信任，以及为什么利润率压力是真实的
        blocks:
          - type: paragraph
            body: >-
              公开定价证据显示，Moneybox 并不明显拥有价格领导力。它的 Play Store 列表仍披露每月 £1 订阅费，以及对余额收取 0.45% 年投资费，
              外加底层基金费用。这很简单，但简单不等于最低成本。Chip 公开宣传 0.25% 投资平台费，AJ Bell、Hargreaves Lansdown、Vanguard 等大型传统机构也为 ISA
              和养老金公布详细定价或低成本叙事。消费者如果把决策简化成成本比较，很快就能找到替代项。

              信任让这幅图更复杂。Nutmeg 受益于 J.P. Morgan 所有权。Hargreaves Lansdown 和 AJ Bell 有长期上市公司和家庭品牌信誉。Vanguard
              占据低成本被动投资参照点。Moneybox 的竞争回答不是更低的名义价格，而是更友好的客户旅程。这条路可以走通，但意味着服务质量和产品清晰度是利润率防线的一部分， 而不只是营销包装。
