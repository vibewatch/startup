  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 立场
      - 论点
      - 证据锚点
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - Moneybox 已从新奇 app 变成具规模的财富平台。
        - 1.9m+ 客户、£23bn+ AUA、£115m+ 收入、连续 3 年盈利。
        - 如果增长、流入或盈利出现实质性逆转，判断会削弱。
      - - 投资逻辑
        - 相比单一功能储蓄 app，产品广度支撑更好的终身价值。
        - ISA、LISA、养老金、JISA、GIA、按揭和退休工作流均已公开。
        - 如果客户使用仍浅、ARPU 没有加深，广度的重要性会下降。
      - - 投资逻辑
        - 当前估值标记有 2024 年以来的真实经营进展支撑。
        - £800m 较 2024 年 £550m 标记约高 45%，其间又录得一年盈利。
        - 如果 2025 年经审计账目不能确认规模或质量，重估逻辑会削弱。
      - - 反向逻辑
        - PISCES 定价不等同于广泛市场价格发现。
        - FCA 规则允许控制买方准入和价格参数；独立报道提示交易可能偏薄。
        - 后续若有同价的新股轮次或广泛老股出清，会增强信心。
      - - 反向逻辑
        - 仅英国市场的集中度可能限制终局倍数扩张。
        - 监管和储蓄利率敏感性仍集中在单一市场。
        - 更广的变现或地域证据会降低这一折价。
      - - 反向逻辑
        - 当前价格已经计入相当质量。
        - 以约 7x 2025 年收入计，投资者买入价并非明显困境水平。
        - 更低入场价，或来自投顾和余额深化的更清晰上行，会改善这笔交易。
    notes: 论点只按投资相关性组织，不作为泛泛的公司评分卡。
