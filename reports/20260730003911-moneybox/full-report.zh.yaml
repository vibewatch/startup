      - number: '1.4'
        title: 里程碑、客户验证与不利背景
        blocks:
          - type: paragraph
            body: >-
              里程碑记录支撑了一个判断：Moneybox 正在搭建的是耐久的消费者财富平台，而不是单功能应用。年报列出的演进路径包括：2016 年推出带找零功能的 Stocks and Shares ISA，2017 年推出
              Junior ISA 和 Lifetime ISA，2019 年上线养老金整合，2021 年进入抵押贷款，2022 年加入美国股票， 2023 年推出 Cash ISA，2024 年推出 Simple Saver
              Reward。这些发布显示出一致模式：Moneybox 通过为同一批英国零售用户增加相邻的、 由税优账户驱动的储蓄和财富任务来扩张，而不是转向无关金融产品。运营验证同样扎实。到 2025 年 4
              月，公司称已帮助完成超过 120,000 次首次购房，并追踪到超过 £600 million 遗失养老金；到 2026 年 7 月，公司称超过 200,000 名客户已为首次购房储蓄，超过 £800
              million 遗失养老金已经重归客户名下。

              不利背景恰恰重要，因为主线故事很强。The Next Web 明确指出，独角兽标签带有星号，因为 £800 million 价格来自员工二级转让，而不是新的一级融资。 Trustpilot
              的总体图景偏正面，但负面评价仍指向转账延迟、客服摩擦，以及储蓄利率调整带来的失望。这些问题都不推翻 Moneybox 是一家有规模、
              已盈利金融科技公司的核心判断，但会影响后续章节对客户耐久性、品牌强度和估值质量的信心权重。
