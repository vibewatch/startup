      - number: '8.5'
        title: 建议与证据评估
        blocks:
          - type: paragraph
            body: >-
              建议是跟踪，信心中等，风险评级中等，估值立场为公平。相比泛泛地继续研究，这更建设性，因为公开记录已经验证了真实规模、利润和产品宽度。但它没有到买入那么激进，因为当前估值来自新市场结构下的受控二级交易，最大剩余不确定性也直接指向估值，而非外围细节。换句话说，Moneybox
              已经足以跨过“这是一门真实生意吗？”这道坎，也跨过了相当一部分“这是一门高质量生意吗？”这道坎，但还没跨过“今天这个进入价格显然有吸引力吗？”这道坎。

              价格纪律结论很直接。按约 7x 2025 年收入计算，相较盈利的英国上市平台，或相较 £550 million 的 2024
              年估值以来的经营进展，公司并不明显高估。但上行也没有不对称到让投资者可以忽视股权结构不透明、英国集中度或 PISCES 特有执行风险。若管理层提供经审计的 2025 年账目、确认交易后需求质量、证明 H1
              客户和资金流入激增能持续转化为 2026 年收入，并展示类投顾变现能抬升长期单位经济，结论会朝买入改善。没有这些证明时，应密切观察、进入尽调，并对价格保持敏感。
