      - number: '1.3'
        title: 融资历史、股东与估值台阶
        blocks:
          - type: paragraph
            body: >-
              Moneybox 的资本历史值得注意，因为最近的价格形成来自结构化流动性事件，而不是直接的成长股权一级融资。公司披露，2022 年 3 月完成由 Fidelity International Strategic
              Ventures 领投的 £35 million Series D，Polar Capital 参投，Oxford Capital、Burda、CNP 和 Breega 等既有投资方继续支持。2024 年 10
              月，Moneybox 宣布一笔约 £70 million 交易，Apis Partners 和 Amundi 参与，交易主要为二级转让、 也包含部分一级资本，公司估值 £550 million，较 Series
              D 估值高 84%。这笔交易还提到一个 35,000 人规模的股东社区，凸显股权结构广度不同寻常。

              2026 年 7 月的台阶更关键。Moneybox 通过伦敦证券交易所 Private Securities Market，在新的 PISCES 框架下准备了最高 £45 million 的员工二级流动性，估值
              £800 million，并由 Crowdcube 管理卖方和投资者流程。这同时说明两件事。正面看，公司并不需要靠救助轮达到准独角兽估值，
              而是用交易为长期员工创造流动性。更谨慎地看，该估值是在受控的私募市场窗口中形成，而不是经由开放、充分价格发现的机构竞争形成。最终估值是真实且具有战略意义的， 但仍应带着一定流动性折扣意识解读。
