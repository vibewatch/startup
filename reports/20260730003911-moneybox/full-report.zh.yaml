      - number: '7.2'
        title: 运营、网络与服务质量风险会快速传导到信任
        blocks:
          - type: paragraph
            body: >-
              Moneybox 是一个处理敏感金融数据、支付流、转账、客户资产，以及 ISA 转户或购房首付储蓄等时间敏感里程碑的消费者应用。因此，运营韧性和网络风险是核心问题， 不是抽象问题。FCA
              的运营韧性指引和网络安全出版物明确要求公司识别重要业务服务、为严重但合理的中断做准备，并持续改进网络防御。Moneybox 自己的年报和支持材料在流程上让人安心：它们提到年度渗透测试、信息安全治理、NIST
              成熟度对齐和审慎监督。但公开的服务表现证据更薄。 没有公开可用性仪表盘，没有公开事故率披露，也没有转账周期时长报告。

              评价显示了为什么这很重要。负面客户评论集中在转账、支持响应、应用导航，以及利率重置或资金移动摩擦后的挫败感。问题不是这些投诉证明存在系统性失败；
              问题在于零售金融中，少数糟糕体验的声誉成本可能很高，因为底层信任门槛极高。简言之，公开控制看起来不错，但运营风险论点仍取决于尚未完全发布的执行证据。
