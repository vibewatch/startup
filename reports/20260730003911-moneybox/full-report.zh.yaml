  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层，以及为什么这个用户基础并不泛化
        blocks:
          - type: paragraph
            body: >-
              Moneybox 的客户基础广泛、零售化，并且越来越多产品化。公开产品和年报材料指向几个客群簇：初级投资者、现金优先储蓄者、使用 LISA 的首次购房储蓄者、 养老金整合者，以及使用 Junior ISA
              的家庭储蓄者。这些不是随机相邻画像；它们都受益于简单的应用引导税优账户、重复缴款行为和低摩擦信任体验。 公司最强的客户优势，是其中许多客群可以随时间相互扩展。

              由于业务服务的是个人零售账户，而不是企业合同，客户集中度风险应按行为和组合分析，而不是用头部客户表。这改变了尽调框架：重要问题不是某一个客户是否会流失，
              而是少数关键使用场景或获客触点是否不成比例地驱动已入金账户增长。
