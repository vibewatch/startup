      - number: '2.4'
        title: Moneybox 专属 SAM 与 SOM 逻辑
        blocks:
          - type: paragraph
            body: >-
              Moneybox 最有用的测算框架不是一个单一 TAM 数字，而是从广义英国居民储蓄和账户壳资金池，收窄到数字渠道可触达、自主决策、未接受顾问服务、
              且可能采用应用关系的用户。总宇宙包括所有有储蓄、养老金或购房意图的英国家庭。可服务市场更窄：消费者愿意借助移动应用使用受监管金融产品，
              且需求适配标准化账户壳，而不是定制顾问关系。可获得市场还要更窄，受品牌认知、竞争、产品资格、转入摩擦，以及 Moneybox 并不试图服务每一种投资者原型所限制。

              公开证据显示，在这个更窄区域内，Moneybox 已经有实质渗透：客户超过 190 万，AUA 超过 £23 billion。这不能证明市场已经饱和。相反，
              它说明公司已经从投机式市场进入，跨入英国引导式财富细分市场中的有意义份额捕获。最重要的承销问题因此不是「市场是否足够大？」， 而是「Moneybox
              能否继续扩大份额、钱包深度和多产品采用，且速度快过监管、定价和传统机构压力对增长经济质量的削弱？」
