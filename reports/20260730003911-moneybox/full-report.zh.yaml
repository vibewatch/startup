  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争地图不只是「其他找零应用」
        blocks:
          - type: paragraph
            body: >-
              如果仍主要把 Moneybox 记成找零应用，就很容易低估它的竞争集合。现实中，公司现在同时与引导式投资应用、现金储蓄应用、养老金产品、首次购房储蓄工具和低成本投资平台重叠。 Nutmeg
              是最干净的近似样本，因为它覆盖 ISA、养老金、Lifetime ISA、Junior ISA 和包装精致的数字化引导投资。Plum 和 Chip 的竞争方式不同，
              但仍然重要：它们从更接近储蓄自动化和现金管理的位置起步，再延伸到投资和其他金融行为。传统机构一端，Hargreaves Lansdown、AJ Bell 和 Vanguard
              不是主要靠应用原生习惯循环竞争，而是靠信任、广度或价格。Trading 212 对年轻投资者的注意力和获客也重要，因为这些用户可能先选择直接交易， 再考虑引导式财富旅程。

              这种混合集合意味着 Moneybox 不是只打一类对手。它必须同时顶住自动化优先应用、传统平台和低成本投资品牌。这样会扩大市场机会， 但也意味着任何单一功能对比都无法解释真实竞争图景。
