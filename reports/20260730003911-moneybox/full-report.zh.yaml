      - number: '2.2'
        title: 英国需求池、买方分层与采用来源
        blocks:
          - type: paragraph
            body: >-
              Moneybox 最能释放的需求池，是把被动储蓄意图转成主动使用税优账户。HMRC 和 Investment Association 数据显示，ISA 仍是英国重要的家庭储蓄和投资结构； FCA
              Financial Lives 研究则显示，许多消费者面对长期投资决策仍缺乏信心、建议或参与度。这个组合利好引导式应用公司：Moneybox 不需要每个英国成年人都成为活跃投资者，
              只需要拿下一批数量可观、数字工具使用顺畅、重视简单账户壳、定期缴款和清晰产品框架的消费者。买方通常就是用户和付费者本人，这简化了产品设计， 但也让信任、利率竞争力和易用性异常重要。

              最相关的客群包括初级投资者、现金优先储蓄者、使用 LISA 的首次购房储蓄者、养老金整合者，以及想用一个应用处理相邻财富任务的时间紧张型工薪家庭。
              这些客群由工作流连接，而不是由职业或行业垂直连接。消费者触发点包括薪资变化、首次购房规划、组建家庭、养老金整理，以及对传统银行或券商体验不满。 Moneybox
              的赢法，是把这些时刻转化成已入金、重复发生、基于习惯的账户。
