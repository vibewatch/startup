  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 2026 年客户和资金流入动能转化为持续收入增长，人生阶段产品和指导服务带来更深变现。
        - 基于 ~£115m-£120m 收入的 8.5x-10x = ~£980m-£1.15bn。
        - 投顾采用不及预期，或利率压缩伤害收入质量。
        - 有可能，但需要当前公开亮点之外的新证据。
      - - 基准
        - 盈利持续、客户增长正常化，Moneybox 仍是高端英国财富 app，但倍数不大幅扩张。
        - 基于 ~£115m-£120m 收入的 6.5x-7.5x = ~£750m-£900m。
        - 英国集中度和竞争限制上行。
        - 从当前证据看最可信。
      - - 悲观
        - 增长降温，公私市场投资者对 PISCES 标记打折，储蓄利率或政策压力压缩情绪。
        - 基于 ~£115m 收入的 5x-6x = ~£575m-£690m。
        - 价格发现疑虑和产品组合疲弱。
        - 如果叙事跑在事后证据前面，下行空间可观。
    notes: 情景使用公司披露的 2025 年收入下限，而不是猜测性的用户价值公式。
