  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与 Moneybox 如何收费
        blocks:
          - type: paragraph
            body: >-
              Moneybox 通过多种来源变现：经常性订阅收入、基于 AUA 的投资收费、部分储蓄产品上的合作银行经济，以及抵押贷款等相邻产品带来的较小附带经济。 最明确的公开定价披露仍是 Play Store
              列表，其中写明每月 £1 订阅费、余额 0.45% 年投资费，以及底层基金费用。这很重要，
              因为它说明这门业务不是零费率增长应用；客户被要求直接为平台付费，余额变深后模型会更强。公开产品页面和评价来源也暗示，一些现金产品以无客户账户费呈现， 表明部分经济可能来自合作银行安排，而不是直接向零售客户收费。

              因此，这个模型比纯交易型应用更有吸引力，因为它是经常性的、与税优账户相关，且对余额敏感。但公开记录仍未说明订阅、AUA 收费、储蓄利差或其他附带收入各占多少。
              这个组合问题很重要，因为它决定当前盈利有多少暴露在利率竞争下，又有多少由长期投资余额防守。
