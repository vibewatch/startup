  claims:
    - {id: CR001, statement: Moneybox is structurally exposed to UK retail-finance regulation because its core products are tax wrappers and consumer savings products, type: inferred, topic: regulatory, sourceRefs: [SR001, SR004, SR005, SR006], confidence: medium, freshness: current, answersQuestionRefs: [QR001, QR002]}
    - {id: CR002, statement: FCA authorization, CASS obligations, operational-resilience expectations, and conduct requirements are part of Moneybox’s normal operating model, type: company-claimed, topic: regulatory, sourceRefs: [SR001, SR013, SR017], confidence: high, freshness: current, answersQuestionRefs: [QR004, QR005]}
    - {id: CR003, statement: The 2027 ISA reform factsheet shows that UK wrapper rules can change in ways that materially affect Cash ISA design and transfers, type: third-party-reported, topic: regulatory, sourceRefs: [SR014, SR001], confidence: high, freshness: current, answersQuestionRefs: [QR002, QR003]}
    - {id: CR004, statement: From April 2027 the Cash ISA allowance for many users is set to fall to £12,000 while non-cash ISA rules remain more generous, type: third-party-reported, topic: regulatory, sourceRefs: [SR014, SR001], confidence: high, freshness: current, answersQuestionRefs: [QR003]}
    - {id: CR005, statement: The same reform package would restrict transfers from non-cash ISAs into Cash ISAs, type: third-party-reported, topic: regulatory, sourceRefs: [SR014, SR001], confidence: high, freshness: current, answersQuestionRefs: [QR003]}
    - {id: CR006, statement: LISA attractiveness is partly government-defined through bonus and withdrawal rules rather than company-controlled, type: inferred, topic: regulatory, sourceRefs: [SR006, SR014], confidence: medium, freshness: current, answersQuestionRefs: [QR002]}
    - {id: CR007, statement: Regulatory change can therefore alter product mix, compliance cost, and customer experience even if the app itself does not change materially, type: inferred, topic: regulatory, sourceRefs: [SR014, SR001], confidence: medium, freshness: current, answersQuestionRefs: [QR001, QR024]}
    - {id: CR008, statement: Consumer-finance conduct scrutiny remains relevant because Moneybox serves mass retail users with regulated products and customer-outcome obligations, type: inferred, topic: regulatory, sourceRefs: [SR010, SR011, SR001], confidence: medium, freshness: current, answersQuestionRefs: [QR004]}
    - {id: CR009, statement: UK-only geography means Moneybox cannot diversify away from domestic policy shocks, type: inferred, topic: regulatory, sourceRefs: [SR001, SR002], confidence: medium, freshness: current, answersQuestionRefs: [QR015]}
    - {id: CR010, statement: The FCA explicitly expects firms to identify important business services and prepare for severe but plausible disruption, type: third-party-reported, topic: resilience, sourceRefs: [SR016, SR001], confidence: high, freshness: current, answersQuestionRefs: [QR006]}
    - {id: CR011, statement: The FCA’s cyber-security publications reinforce that retail-finance firms face an ongoing requirement to improve cyber defenses and resilience, type: third-party-reported, topic: cyber, sourceRefs: [SR015, SR016], confidence: high, freshness: current, answersQuestionRefs: [QR007]}
    - {id: CR012, statement: Moneybox publicly discloses annual penetration testing, information-security governance, and NIST maturity alignment, type: company-claimed, topic: cyber, sourceRefs: [SR001, SR013], confidence: high, freshness: current, answersQuestionRefs: [QR012, QR018]}
    - {id: CR013, statement: Public sources do not provide a detailed uptime dashboard, incident-rate history, or transfer-cycle-time telemetry for Moneybox, type: observed, topic: cyber, sourceRefs: [SR001, SR013], confidence: medium, freshness: current, answersQuestionRefs: [QR017]}
    - {id: CR014, statement: Negative reviews show that transfer and support friction remain part of the operating-risk surface, type: third-party-reported, topic: operating, sourceRefs: [SR008, SR009, SR024], confidence: medium, freshness: current, answersQuestionRefs: [QR011, QR022]}
    - {id: CR015, statement: Negative reviews also show that savings-rate resets can create customer frustration, type: third-party-reported, topic: operating, sourceRefs: [SR018, SR024], confidence: medium, freshness: current, answersQuestionRefs: [QR010, QR021]}
    - {id: CR016, statement: In retail finance, reputational damage can be disproportionately high because service friction occurs when customer trust is most exposed, type: inferred, topic: operating, sourceRefs: [SR009, SR024], confidence: medium, freshness: current, answersQuestionRefs: [QR011, QR024]}
    - {id: CR017, statement: Operational risk therefore transmits into customer trust and retention quality faster than into immediate solvency stress, type: inferred, topic: operating, sourceRefs: [SR009, SR015, SR016], confidence: medium, freshness: current, answersQuestionRefs: [QR019]}
    - {id: CR018, statement: The control framework looks comparatively mature for a private consumer fintech, but the public operating telemetry remains incomplete, type: inferred, topic: operating, sourceRefs: [SR001, SR013, SR016], confidence: medium, freshness: current, answersQuestionRefs: [QR012, QR018]}
    - {id: CR019, statement: Moneybox is commercially exposed to UK macro conditions and domestic rate cycles because it is UK-only and serves retail households, type: inferred, topic: commercial, sourceRefs: [SR001, SR011], confidence: medium, freshness: current, answersQuestionRefs: [QR015]}
    - {id: CR020, statement: The YourMoney Cash ISA coverage shows that Moneybox’s savings products rely on third-party banks and variable-rate structures that can create customer-protection complexity, type: third-party-reported, topic: commercial, sourceRefs: [SR018, SR013], confidence: high, freshness: current, answersQuestionRefs: [QR009, QR021]}
    - {id: CR021, statement: YourMoney reported that Moneybox’s Cash ISA allocated funds across Santander and HSBC and highlighted FSCS-limit complexity for some savers, type: third-party-reported, topic: commercial, sourceRefs: [SR018, SR013], confidence: high, freshness: current, answersQuestionRefs: [QR009, QR021]}
    - {id: CR022, statement: Rate-sensitive cash savers acquired through attractive yields may be lower-quality or less durable than broader wealth users, type: inferred, topic: commercial, sourceRefs: [SR018, SR024], confidence: medium, freshness: current, answersQuestionRefs: [QR010]}
    - {id: CR023, statement: Chip and Plum pressure app-native savings and automation segments, type: inferred, topic: competition-risk, sourceRefs: [SR020, SR026], confidence: medium, freshness: current, answersQuestionRefs: [QR016]}
    - {id: CR024, statement: Nutmeg under J.P. Morgan and incumbents such as Hargreaves Lansdown and AJ Bell create stronger external trust and scale benchmarks, type: inferred, topic: competition-risk, sourceRefs: [SR025, SR027, SR029, SR030], confidence: medium, freshness: current, answersQuestionRefs: [QR016]}
    - {id: CR025, statement: Vanguard and other low-cost alternatives increase price pressure where consumers reduce the choice to fee or rate comparisons, type: inferred, topic: competition-risk, sourceRefs: [SR028, SR029], confidence: medium, freshness: current, answersQuestionRefs: [QR016]}
    - {id: CR026, statement: Because Moneybox is not clearly a price leader, it must defend on guided breadth and customer experience, type: inferred, topic: competition-risk, sourceRefs: [SR007, SR029, SR030], confidence: medium, freshness: current, answersQuestionRefs: [QR016, QR024]}
    - {id: CR027, statement: UK concentration and benchmark-driven price pressure together create a real margin-compression risk, type: inferred, topic: financial-risk, sourceRefs: [SR018, SR029, SR030], confidence: medium, freshness: current, answersQuestionRefs: [QR010, QR015]}
    - {id: CR028, statement: Ben Stanway remains the central public spokesperson for strategy, financing, and policy-relevant announcements, type: observed, topic: people-risk, sourceRefs: [SR002, SR003], confidence: high, freshness: current, answersQuestionRefs: [QR013, QR014]}
    - {id: CR029, statement: Founder continuity is a strength but also a concentration point because product and strategic narrative remain tightly associated with the founding team, type: inferred, topic: people-risk, sourceRefs: [SR001, SR002, SR003], confidence: medium, freshness: current, answersQuestionRefs: [QR013, QR014]}
    - {id: CR030, statement: Scaling a regulated consumer-finance platform requires strong coordination across customer operations, risk, compliance, product, and support functions, type: inferred, topic: people-risk, sourceRefs: [SR001, SR016], confidence: medium, freshness: current, answersQuestionRefs: [QR013]}
    - {id: CR031, statement: Moneybox’s profitability and disclosed governance structure reduce the likelihood of a basic survival or control failure, type: inferred, topic: mitigants, sourceRefs: [SR001, SR002], confidence: high, freshness: current, answersQuestionRefs: [QR018, QR024]}
    - {id: CR032, statement: Board and committee depth provide some mitigation against pure founder concentration, type: inferred, topic: mitigants, sourceRefs: [SR001, SR003], confidence: high, freshness: current, answersQuestionRefs: [QR018]}
    - {id: CR033, statement: The right monitoring stance is to watch for deterioration in transfer quality, complaints, and wrapper attractiveness rather than to assume current public metrics will persist, type: inferred, topic: mitigants, sourceRefs: [SR009, SR014, SR018], confidence: medium, freshness: current, answersQuestionRefs: [QR020]}
    - {id: CR034, statement: A material cyber incident or customer-impacting outage would be a thesis-break event because trust is core to the business model, type: inferred, topic: mitigants, sourceRefs: [SR015, SR016], confidence: medium, freshness: current, answersQuestionRefs: [QR020, QR025]}
    - {id: CR035, statement: The highest-probability risks are quality and valuation-damaging execution risks rather than acute solvency risks, type: inferred, topic: verdict, sourceRefs: [SR001, SR009, SR018], confidence: medium, freshness: current, answersQuestionRefs: [QR019, QR024]}
    - {id: CR036, statement: The most likely thesis-breakers are severe service deterioration, adverse policy changes, sustained rate-driven churn, meaningful cyber events, or leadership instability, type: inferred, topic: verdict, sourceRefs: [SR014, SR015, SR018, SR024], confidence: medium, freshness: current, answersQuestionRefs: [QR020, QR025]}
    - {id: CR037, statement: Moneybox support materials reiterate FCA firm reference 712935 and payment-services permission 792703, type: company-claimed, topic: regulatory, sourceRefs: [SR013, SR019], confidence: medium, freshness: current, answersQuestionRefs: [QR026]}
    - {id: CR038, statement: Moneybox support materials say the firm is subject to strict capital adequacy and systems-and-controls requirements, type: company-claimed, topic: regulatory, sourceRefs: [SR013, SR019], confidence: medium, freshness: current, answersQuestionRefs: [QR026]}
    - {id: CR039, statement: Public disclosures and adverse coverage show FSCS protection can still create customer-support complexity when balances are split across third-party banks, type: inferred, topic: commercial, sourceRefs: [SR013, SR018], confidence: medium, freshness: current, answersQuestionRefs: [QR027]}
    - {id: CR040, statement: Dodl and Wealthify illustrate that simplified-investing competition extends beyond the best-known robo or platform brands, type: inferred, topic: competition-risk, sourceRefs: [SR022, SR023], confidence: medium, freshness: current, answersQuestionRefs: [QR028]}
