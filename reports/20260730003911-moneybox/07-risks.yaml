        - {id: n2, label: Product or transfer complexity}
        - {id: n3, label: Customer trust}
        - {id: n4, label: Retention / inflow quality}
        - {id: n5, label: Margin and growth quality}
        - {id: n6, label: Valuation confidence}
        - {id: n7, label: Cyber / resilience incident}
      edges:
        - {from: n1, to: n2, label: raises}
        - {from: n2, to: n3, label: weakens}
        - {from: n7, to: n3, label: shocks}
        - {from: n3, to: n4, label: drives}
        - {from: n4, to: n5, label: shapes}
        - {from: n5, to: n6, label: informs}
        - {from: n1, to: n6, label: compresses}
    approximationNotes: The DAG highlights the most important public transmission paths rather than every operational interaction.
    claimRefs: [CR003, CR012, CR017, CR024, CR035]
