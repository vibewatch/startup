companyProfile:
  summary: Moneybox is a London-based private consumer wealth platform that started as a savings and round-ups app and expanded into a broader life-stage financial relationship spanning Stocks and Shares ISA, Cash and Lifetime ISA, Junior ISA, general investing, pension, savings, pension consolidation, and home-buying workflows. Public evidence shows more than 1.9 million customers, more than £23 billion of assets under administration, and 2025 revenue above £115 million with a third consecutive profitable year. The July 2026 employee secondary used the UK’s new PISCES framework to set an £800 million / $1.1 billion valuation, making Moneybox one of the clearest examples of a scaled, profitable UK consumer fintech still private.
  foundedDate: '2016-01-01'
  founders:
    - name: Ben Stanway
      role: Co-founder
      background: Long-standing public face of Moneybox across financing, product, and policy announcements.
      claimRefs: [CO011, CO012]
    - name: Charlie Mortimer
      role: Co-founder
      background: Publicly identified as the co-founder most associated with Moneybox’s product-led origins and long-term operating continuity.
