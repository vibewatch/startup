  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: Guided digital wealth platform for UK consumers across saving, investing, retirement, first-home buying, and child-investing use cases.
  customerFocus: UK retail savers and investors, especially mass-affluent and aspiring first-home or retirement customers wanting app-led guidance rather than self-directed complexity.
  businessModel: Consumer fintech monetized through subscriptions, AUA-linked charges, and adjacent savings or partner economics on a multi-product wealth platform.
  stage: private, profitability-proven unicorn
  fundingStatus: July 2026 employee secondary at approximately £800m / $1.1b via PISCES; prior disclosed October 2024 mark was £550m.
