callouts:
  - calloutType: strength
    title: Rare combination of profitability, scale, and wrapper breadth
    body: >-
      Public sources support a rare profile for a private UK consumer fintech: meaningful scale, three consecutive
      profitable years, and a product set spanning cash, investing, pensions, and home-buying journeys.
    claimRefs:
      - CO005
      - CO009
      - CO018
  - calloutType: risk
    title: The unicorn mark is current but not fully de-risked
    body: >-
      Moneybox crossed the £800 million / $1.1 billion threshold via a PISCES-enabled employee liquidity event, not a
      fresh institutional primary raise. The mark is important, but investors should still examine liquidity mechanics.
    claimRefs:
      - CO024
      - CO025
      - CO034
  - calloutType: insight
    title: Moneybox is no longer just a round-up app
    body: >-
      The current business is best described as a guided UK retail wealth platform built around adjacent life goals,
      not as a single savings feature wrapped in a mobile app.
    claimRefs:
      - CO005
      - CO006
      - CO036
