company:
  name: Moneybox
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Moneybox has evolved from a round-up investing app into a profitable UK consumer wealth platform with more than
    1.9 million customers, more than £23 billion of assets under administration, and an £800 million July 2026
    valuation established through a PISCES-enabled employee secondary. The public record is unusually strong for a
    private consumer fintech because the 2024 annual report and 2026 support release disclose revenue, profitability,
    scale, governance, and product breadth. The main caveat is that the unicorn mark came through a managed liquidity
    event rather than a competitive primary financing.
sections:
  - id: section-1
    title: Identity, products, and current scale
    body: >-
      Moneybox is a London-based consumer savings and wealth-management app built for UK retail users who want a guided,
      mobile-first path into saving, investing, home buying, and retirement planning. The company was incorporated in
      2015 and launched publicly in 2016, initially becoming known for its round-up mechanism that swept spare change
      from everyday card purchases into investing accounts. That original wedge still matters because it explains the
      brand, but it no longer captures the full business. Public product materials and the 2024 annual report show that
      Moneybox now spans Stocks and Shares ISAs, Cash ISAs, Lifetime ISAs, Junior ISAs, general investment accounts,
      pensions, cash savings, and home-buying workflows. This breadth is strategically important because it means the
      company is not only chasing first-time investors; it is building a broader retail wealth relationship around major
      financial milestones.

      The strongest scale signals are current and concrete. Moneybox’s 2024 annual report recorded 1.3 million funded
      customers and £11.7 billion of assets under administration at year-end 2024. The July 2026 support announcement
      then updated the picture to more than 1.9 million customers and more than £23 billion of AUA, alongside 390,000+
      new customers in H1 2026 and £3.5 billion of inflows in that period. Those disclosures suggest that Moneybox’s
      identity has shifted from a niche savings app into a scaled mass-market UK wealth platform whose value proposition
      is simplicity, wrapper breadth, and lifecycle relevance rather than one single investment product.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO036
    tableRefs:
      - TO001
    figureRefs:
      - FO003
  - id: section-2
    title: Founders, governance, and legal structure
    body: >-
      Founder continuity is one of Moneybox’s clearest strengths. Ben Stanway and Charlie Mortimer remain the central
      founder-operators and are still publicly identified with the company’s strategic direction, product philosophy,
      and financing milestones. The support release and investor materials repeatedly quote Stanway, while the annual
      report and earlier company pages reinforce Mortimer’s continuing role as co-founder and product architect. That
      continuity matters in a regulated consumer-finance company because product trust, compliance quality, and customer
      outcomes often depend on a management team staying disciplined through scale. The annual report also shows that the
      company’s governance is materially more developed than that of a small app startup, with named non-executive board
      members, board committees, and management committees covering risk, remuneration, nominations, treasury, product
      governance, CASS, and information security.

      Legally, the group is anchored by Digital Moneybox Limited, with subsidiaries used for mortgage activity, pensions,
      and related regulated operations. Companies House confirms the main company number and registered office, while the
      Play Store listing discloses FCA permissions and protection language. The governance picture is therefore positive
      but not fully exhaustive from public sources: the board roster is visible at a high level, yet full ownership,
      voting control, and observer-right detail remain private. That makes founder concentration a real, but not
      necessarily problematic, feature of the company overview.
    claimRefs:
      - CO002
      - CO003
      - CO004
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
