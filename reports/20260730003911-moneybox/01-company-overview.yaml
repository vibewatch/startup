  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: Updated cap table, liquidation preference stack, and post-2026 secondary ownership breakdown.
      whyItMatters: The £800 million mark is observable, but economic control and preference overhang remain opaque.
      diligencePath: Request the post-transaction cap table and shareholder-rights summary from company counsel.
      relatedQuestionRefs: [QO024]
      relatedTableRefs: [TO003]
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: A current full board list with observer rights and committee memberships beyond public summary disclosures.
      whyItMatters: Board composition and control rights shape founder dependence, investor leverage, and governance quality.
      diligencePath: Request the latest board deck, committee matrix, and governance calendar.
      relatedQuestionRefs: [QO024]
      relatedTableRefs: [TO002]
    - type: conflicting-data
      severity: minor
      topic: founding-date
      missingEvidence: A single canonical external convention for whether May 2015 incorporation or 2016 public launch is the founding date.
      whyItMatters: Both dates appear in the public record and can create avoidable factual drift in later summaries.
      diligencePath: Standardize management’s preferred founding-date convention in the diligence data room.
      relatedQuestionRefs: [QO001]
