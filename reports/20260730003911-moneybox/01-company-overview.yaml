  - id: section-4
    title: Milestones, customer proof, and adverse context
    body: >-
      The milestone record supports the claim that Moneybox is building a durable consumer-wealth platform rather than a
      one-feature app. The annual report charts a progression from the 2016 Stocks and Shares ISA launch with round-ups,
      through the Junior ISA and Lifetime ISA in 2017, pension consolidation in 2019, mortgages in 2021, US stocks in
      2022, Cash ISA in 2023, and the Simple Saver Reward in 2024. These launches show a consistent pattern: Moneybox
      expands by adding adjacent, wrapper-led savings and wealth jobs for the same UK retail user rather than pivoting
      into unrelated financial products. The operating proof is similarly strong. By April 2025 the company said it had
      helped with more than 120,000 first-home purchases and traced more than £600 million of lost pensions; by July
      2026 it said more than 200,000 customers had saved for their first home and over £800 million of lost pensions had
      been reunited.

      The adverse context is important precisely because the top-line story is strong. The Next Web explicitly argued the
      unicorn label carries an asterisk because the £800 million price was set through a secondary employee sale instead
      of a fresh primary round. Trustpilot’s aggregate picture is positive, but negative reviews still point to transfer
      delays, support friction, and disappointment around savings-rate changes. None of those issues invalidate the core
      thesis that Moneybox is a scaled profitable fintech, but they do shape how much confidence later chapters should
      place on customer durability, brand strength, and valuation quality.
    claimRefs:
      - CO009
      - CO010
      - CO017
      - CO024
      - CO025
      - CO026
      - CO027
      - CO032
