  claims:
    - {id: CI001, statement: Moneybox publicly discloses a £1 monthly subscription fee on investment products, type: observed, topic: pricing, sourceRefs: [SI008, SI016], confidence: medium, freshness: current, answersQuestionRefs: [QI001, QI002]}
    - {id: CI002, statement: Moneybox publicly discloses a 0.45% annual investment fee on balances, type: observed, topic: pricing, sourceRefs: [SI008, SI016], confidence: medium, freshness: current, answersQuestionRefs: [QI001, QI002]}
    - {id: CI003, statement: Some cash products are presented publicly without customer account fees, type: company-claimed, topic: pricing, sourceRefs: [SI008, SI004], confidence: medium, freshness: current, answersQuestionRefs: [QI003]}
    - {id: CI004, statement: That fee presentation implies at least part of savings-product economics may come from partner-bank or product-structure arrangements rather than only direct retail charging, type: inferred, topic: revenue-mix, sourceRefs: [SI008, SI016], confidence: medium, freshness: current, answersQuestionRefs: [QI003]}
    - {id: CI005, statement: Moneybox monetizes through recurring fees rather than only through transaction commissions, type: inferred, topic: revenue-model, sourceRefs: [SI008, SI004], confidence: medium, freshness: current, answersQuestionRefs: [QI001]}
    - {id: CI006, statement: Mortgages and adjacent products appear to be supplementary revenue sources rather than the core earnings engine, type: inferred, topic: revenue-mix, sourceRefs: [SI001, SI004], confidence: medium, freshness: current, answersQuestionRefs: [QI004]}
    - {id: CI007, statement: The quality of the revenue model improves when customers deepen balances and adopt multiple products, type: inferred, topic: revenue-model, sourceRefs: [SI001, SI002], confidence: high, freshness: current, answersQuestionRefs: [QI004]}
    - {id: CI008, statement: Public sources do not cleanly split revenue among subscription, investment fee, savings, and ancillary streams, type: observed, topic: revenue-mix, sourceRefs: [SI001, SI008], confidence: high, freshness: current, answersQuestionRefs: [QI004]}
    - {id: CI009, statement: The annual report recorded 2024 revenue of £93.8 million, type: company-claimed, topic: historical-performance, sourceRefs: [SI001, SI002], confidence: high, freshness: historical, answersQuestionRefs: [QI005]}
    - {id: CI010, statement: The annual report recorded 2024 gross profit of £90.7 million, type: company-claimed, topic: historical-performance, sourceRefs: [SI001, SI002], confidence: high, freshness: historical, answersQuestionRefs: [QI005]}
    - {id: CI011, statement: The annual report recorded 2024 gross margin of 97% and profit before tax of £19.7 million, type: company-claimed, topic: historical-performance, sourceRefs: [SI001, SI002], confidence: high, freshness: historical, answersQuestionRefs: [QI006]}
    - {id: CI012, statement: Moneybox attributes part of its operating leverage to the proprietary Sycamore platform and automation, type: company-claimed, topic: operating-leverage, sourceRefs: [SI001, SI002], confidence: high, freshness: historical, answersQuestionRefs: [QI010, QI011]}
    - {id: CI013, statement: The annual report recorded 2024 AUA of £11.7 billion and AUA per customer of £9,002, type: company-claimed, topic: historical-performance, sourceRefs: [SI001, SI002], confidence: high, freshness: historical, answersQuestionRefs: [QI007, QI009]}
    - {id: CI014, statement: The annual report recorded 2024 net inflows of £5.8 billion, type: company-claimed, topic: historical-performance, sourceRefs: [SI001, SI002], confidence: high, freshness: historical, answersQuestionRefs: [QI007]}
    - {id: CI015, statement: The July 2026 support release said 2025 revenue exceeded £115 million, type: company-claimed, topic: recent-performance, sourceRefs: [SI002, SI010, SI011], confidence: high, freshness: current, answersQuestionRefs: [QI008]}
    - {id: CI016, statement: The same release said 2025 marked Moneybox’s third consecutive year of profitability, type: company-claimed, topic: recent-performance, sourceRefs: [SI002, SI010, SI011], confidence: high, freshness: current, answersQuestionRefs: [QI008]}
    - {id: CI017, statement: Headcount increased to 412 in 2024, indicating the company scaled while still investing materially in operations, type: company-claimed, topic: operating-leverage, sourceRefs: [SI001, SI002], confidence: high, freshness: historical, answersQuestionRefs: [QI010]}
    - {id: CI018, statement: Moneybox’s model is less balance-sheet-fragile than a lending fintech because it primarily gathers and administers customer assets rather than underwriting long-duration credit, type: inferred, topic: capital-profile, sourceRefs: [SI001, SI014], confidence: medium, freshness: current, answersQuestionRefs: [QI014, QI015]}
    - {id: CI019, statement: The annual report said the operating cash balance at year-end 2024 was £58.3 million, type: company-claimed, topic: capital-profile, sourceRefs: [SI001, SI002], confidence: high, freshness: historical, answersQuestionRefs: [QI012]}
    - {id: CI020, statement: The annual report said the company generated significant free cash flow in 2024, type: company-claimed, topic: capital-profile, sourceRefs: [SI001, SI002], confidence: high, freshness: historical, answersQuestionRefs: [QI012]}
    - {id: CI021, statement: The annual report describes a treasury framework that can place excess liquidity into instant-access cash and short-dated gilts, type: company-claimed, topic: capital-profile, sourceRefs: [SI001, SI002], confidence: high, freshness: historical, answersQuestionRefs: [QI013]}
    - {id: CI022, statement: The annual report describes capital and liquidity stress testing under investment-firm prudential rules, type: company-claimed, topic: capital-profile, sourceRefs: [SI001, SI002], confidence: high, freshness: historical, answersQuestionRefs: [QI013]}
