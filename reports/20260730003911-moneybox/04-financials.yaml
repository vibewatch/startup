    title: Revenue streams table
    columns: [stream, mechanism, unit, current value/status, quality, diligence ask]
    rows:
      - ['Investing subscription', 'Fixed monthly platform fee', '£/month', '£1 publicly disclosed', 'Recurring', 'Measure conversion and churn by balance tier']
      - ['AUA-based investment charge', 'Annual percentage fee on balances', '% of assets', '0.45% publicly disclosed', 'Recurring', 'Bridge to realized net take rate after fund charges']
      - ['Savings economics', 'Partner-bank or product economics', 'Unknown mix', 'Customer-facing fees absent on some products', 'Potentially recurring', 'Request partner-bank economics by product']
      - ['Mortgage / adjacent services', 'Referral or advice-adjacent economics', 'Unknown', 'Appears ancillary in public materials', 'Supplementary', 'Request revenue split and gross margin by stream']
    notes: >-
      Stream mapping is based on public disclosures and is sufficient for structure, not for precise revenue mix.
    claimRefs: [CI001, CI002, CI005, CI006, CI007]
  - id: TI002
    title: Pricing / monetization table
    columns: [price/unit/contract, list vs realized pricing, discounts/unknowns, source]
    rows:
      - ['Moneybox £1 monthly + 0.45% annual', 'List pricing visible', 'Realized customer cost varies by balances and fund charges', 'Play Store / review sources']
      - ['Chip 0.25% platform fee', 'Public headline pricing', 'Full product economics vary by mix and promotions', 'Chip Play / review sources']
      - ['AJ Bell published wrapper charges', 'List pricing visible', 'Realized cost varies by use and holdings', 'AJ Bell charges page']
      - ['Vanguard low-cost passive pricing', 'List pricing visible', 'Narrower proposition than Moneybox overall', 'Vanguard pages']
    notes: >-
      Official pricing is list pricing and should not be confused with realized blended monetization.
    claimRefs: [CI001, CI026, CI027, CI028]
  - id: TI003
    title: Unit economics table
    columns: [metric, value/null, confidence, why it matters, diligence ask]
    rows:
      - ['2024 revenue', '£93.8m', high, 'Shows current scale', null]
      - ['2024 gross margin', '97%', high, 'Signals software-like gross economics', null]
      - ['2024 PBT', '£19.7m', high, 'Shows post-growth profitability', null]
      - ['2024 AUA/customer', '£9,002', high, 'Indicates wallet deepening and cross-sell quality', null]
      - ['CAC', null, low, 'Underwrites acquisition efficiency', 'Request channel-level CAC by entry product']
      - ['Payback period', null, low, 'Tests durability of growth spend', 'Request cohort payback model']
      - ['Contribution margin by product', null, low, 'Separates profitable from dilutive growth', 'Request product-level P&L']
      - ['Churn / NRR by cohort', null, low, 'Tests LTV durability', 'Request cohort retention deck']
    notes: >-
      Public unit-economics disclosure is strong on outputs and weak on inputs, so the most important missing values are
      explicitly preserved as nulls.
    claimRefs: [CI009, CI010, CI011, CI014, CI029, CI030, CI031]
  - id: TI004
    title: Capital adequacy table
    columns: [cash on hand, monthly burn, runway months, planned use of funds, next-round trigger, debt/project-finance obligations]
    rows:
      - ['£58.3m operating cash balance at 2024 year-end', null, null, 'Operations, prudential liquidity, and growth investment', 'No obvious near-term survival financing trigger visible publicly', 'No lending-style balance-sheet exposure publicly disclosed']
      - ['Significant free cash flow in 2024', null, null, 'Supports internal funding capacity', 'Need 2025/2026 update to confirm persistence', 'Treasury placements into cash and short-dated gilts under policy limits']
    notes: >-
      Public capital adequacy evidence is governance-strong but ratio-light. The chapter deliberately avoids inventing burn
      or runway from incomplete disclosures.
    claimRefs: [CI018, CI019, CI020, CI021, CI022, CI023]
  - id: TI005
    title: Public financial gaps table
    columns: [missing private metrics, impact, exact diligence path]
    rows:
      - ['CAC and payback by entry product', 'Cannot test growth efficiency directly', 'Request growth model segmented by channel and product']
      - ['Revenue mix by subscription, AUA charge, savings economics, and ancillary streams', 'Cannot judge margin durability cleanly', 'Request audited management accounts with product-level mix']
      - ['2025/2026 gross margin and cash balance', 'Cannot confirm 2024 economics persisted', 'Request latest board finance pack']
      - ['Savings-rate sensitivity and mix elasticity', 'Cannot test downside in falling-rate environment', 'Request scenario model by rate cycle']
      - ['Customer-support and compliance cost absorption', 'Cannot test whether scale erodes profitability', 'Request operating-expense bridge and service SLA cost analysis']
    notes: >-
      These are the minimum public-data blockers preventing a fully institutional late-stage underwriting view.
    claimRefs: [CI029, CI030, CI031, CI032, CI033, CI034, CI035]
