      fully disclosed than 2024.
    data:
      items:
        - {label: 2024 revenue, low: 93.8, mid: 93.8, high: 93.8, unit: '£m', claimRefs: [CI009]}
        - {label: 2025 revenue, low: 115, mid: 120, high: 130, unit: '£m+', claimRefs: [CI015, CI016]}
        - {label: 2024 PBT, low: 19.7, mid: 19.7, high: 19.7, unit: '£m', claimRefs: [CI011]}
        - {label: 2024 operating cash, low: 58.3, mid: 58.3, high: 58.3, unit: '£m', claimRefs: [CI019]}
        - {label: 2024 AUA, low: 11.7, mid: 11.7, high: 11.7, unit: '£bn', claimRefs: [CI013]}
        - {label: 2026 AUA, low: 23, mid: 23, high: 24, unit: '£bn+', claimRefs: [CI016]}
