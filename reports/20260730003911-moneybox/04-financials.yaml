slug: moneybox
runDate: '2026-07-30'
company:
  name: Moneybox
chapter:
  number: 4
  title: Financials
  summary: >-
    Public disclosure is unusually strong for a private consumer fintech: Moneybox reported £93.8 million of 2024
    revenue, 97% gross margin, £19.7 million of profit before tax, £58.3 million of operating cash, and 2025 revenue
    above £115 million with a third consecutive profitable year. The key underwriting gap is no longer basic viability,
    but limited public visibility into product-level revenue mix, CAC, payback, and savings-rate sensitivity.
sections:
  - id: section-1
    title: Revenue model and how Moneybox gets paid
    body: >-
      Moneybox monetizes through a blend of recurring subscription revenue, AUA-based investment charges, partner-bank
      economics on some savings products, and smaller ancillary economics from adjacent products such as mortgages. The
      most explicit public pricing disclosure remains the Play Store listing, which states a £1 monthly subscription and
      a 0.45% annual investment fee on balances, plus underlying fund charges. That is important because it shows the
      business is not a zero-fee growth app; customers are asked to pay directly for the platform, and the model becomes
      stronger as balances deepen. Public product pages and review sources also imply that some cash products are
      presented with no customer account fee, suggesting economics may partly flow from partner-bank arrangements rather
      than direct retail charging.

      The resulting model is more attractive than a purely transactional app because it is recurring, wrapper-linked, and
      balance-sensitive. But the public record still leaves open how much revenue comes from subscriptions versus AUA
      charges, savings spreads, or other ancillary streams. That mix question matters because it determines how much of
      current profitability is exposed to rate competition and how much is defended by long-duration investment balances.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI003]
  - id: section-2
    title: Historical performance and operating leverage
    body: >-
      The 2024 annual report gives rare visibility into the quality of the business. Revenue increased from £55.6
      million to £93.8 million, gross profit reached £90.7 million, gross margin reached 97%, profit before tax was
      £19.7 million, and net inflows were £5.8 billion. AUA rose to £11.7 billion and AUA per customer increased 53% to
      £9,002. Those metrics matter because they show more than simple top-line growth: they indicate operating leverage,
      rising customer wallet depth, and a business model with software-like gross economics despite operating in a highly
      regulated retail-finance environment. The annual report explicitly credits the proprietary Sycamore platform and a
      highly automated operating model for part of this leverage.

      The 2026 support release pushed the public story further by saying 2025 revenue exceeded £115 million and that 2025
      marked a third consecutive year of profitability. That changes the underwriting starting point. Moneybox is no
      longer a question of whether it can survive without venture subsidy; it is a question of how durable and defensible
      its profit profile is as product breadth and regulatory demands expand.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014, CI015, CI016, CI017]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: section-3
    title: Capital adequacy, liquidity, and risk-bearing profile
    body: >-
      Moneybox’s balance-sheet risk profile looks better than that of a lender or insurer because the company is
      primarily gathering and administering customer assets rather than underwriting long-duration credit. The annual
      report states that the operating cash balance at year-end 2024 was £58.3 million and that the company generated
      significant free cash flow. It also describes a treasury framework that allows excess corporate liquidity to be
      placed into instant-access cash and short-dated gilts subject to approved risk limits. The same public record shows
      capital and liquidity stress testing under investment-firm prudential rules, daily credit monitoring of partner
      banks, annual CASS audit requirements, and operational-risk governance that is fairly mature for a consumer app.

      These disclosures make the company look far less fragile than many late-stage private fintechs. The open question
      is not whether Moneybox has a functioning prudential framework, but how resilient margins and growth remain when
      savings rates fall, customer service costs rise, or product mix shifts toward lower-yield balances.
    claimRefs: [CI018, CI019, CI020, CI021, CI022, CI023, CI024, CI025]
    tableRefs: [TI004]
    figureRefs: [FI002]
  - id: section-4
    title: Public gaps, pricing pressure, and what still needs diligence
    body: >-
      The public record is strong at the company level and still incomplete at the cohort level. There is no public CAC,
      payback period, contribution margin by product, churn by cohort, or clean bridge between subscription revenue,
      investment fees, savings-related income, and mortgage-adjacent economics. Public competitor pricing makes this more
      than an academic gap: Chip publicly markets lower investment-fee optics, while AJ Bell and Vanguard provide visible
      low-cost alternatives for consumers who care primarily about wrapper cost. That does not mean Moneybox is
      overpriced, because its proposition is broader and more guided, but it does mean the sustainability of current
      profitability depends on retention, wallet growth, and automation rather than on fee leadership alone.

      The most important next diligence step is therefore not another historical revenue point; it is a product-level
      view of economics and rate sensitivity. Investors need to know which entry products create the highest lifetime
      value, how much savings-rate compression can hurt revenue mix, and whether support or compliance costs could erode
      today’s attractive margins as balances and customer expectations scale.
    claimRefs: [CI026, CI027, CI028, CI029, CI030, CI031, CI032, CI033, CI034, CI035, CI036, CI037, CI038, CI039, CI040]
    tableRefs: [TI005]
    figureRefs: [FI004]
tables:
