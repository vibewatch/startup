        - {id: n2, label: Recurring fee revenue, detail: 'Subscription and AUA-linked charges monetize balances.'}
        - {id: n3, label: Sycamore automation, detail: 'Proprietary platform supports operating leverage.'}
        - {id: n4, label: 97% gross margin, detail: 'High gross economics visible in 2024.'}
        - {id: n5, label: Cash generation, detail: '2024 free cash flow and £58.3m operating cash reduce survival risk.'}
        - {id: n6, label: Prudential and treasury controls, detail: 'ICARA, CASS, credit monitoring, and liquidity policy mitigate risk.'}
      edges:
        - {from: n1, to: n2}
        - {from: n2, to: n4}
        - {from: n3, to: n4}
        - {from: n4, to: n5}
        - {from: n5, to: n6}
        - {from: n6, to: n1}
    approximationNotes: null
    claimRefs: [CI012, CI018, CI019, CI020, CI021, CI022]
  - id: FI003
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: >-
      Moneybox turns funded household balances into recurring revenue through subscription, AUA, and adjacent product
      economics rather than through one-off transactional activity.
    data:
      nodes:
        - {id: r1, label: Funded retail account, detail: 'Customer opens and funds saving, ISA, pension, or investment account.'}
        - {id: r2, label: Subscription fee, detail: 'Fixed monthly fee on investment-side relationship.'}
        - {id: r3, label: AUA-linked fees, detail: 'Balance growth expands recurring investment-fee revenue.'}
        - {id: r4, label: Savings and partner economics, detail: 'Some cash products appear to monetize differently from direct platform fees.'}
        - {id: r5, label: Ancillary product economics, detail: 'Mortgages and adjacent workflows likely add smaller revenue streams.'}
        - {id: r6, label: Total recurring platform revenue, detail: 'Multiple streams combine into high-margin consumer-wealth economics.'}
      edges:
        - {from: r1, to: r2}
        - {from: r1, to: r3}
        - {from: r1, to: r4}
        - {from: r1, to: r5}
        - {from: r2, to: r6}
        - {from: r3, to: r6}
        - {from: r4, to: r6}
        - {from: r5, to: r6}
    approximationNotes: Public sources show the branches of monetization more clearly than the exact revenue weights.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI008]
  - id: FI004
    title: Unit economics bridge
    type: flow
    layout: wide
    summary: >-
      The public unit-economics story runs from acquisition and balances into margins and cash generation, but the input
      layers remain partially undisclosed.
    data:
      nodes:
        - {id: u1, label: Customer acquisition, detail: 'CAC and channel mix undisclosed publicly.'}
        - {id: u2, label: Funded account retention, detail: '94%+ retention is a positive durability signal.'}
        - {id: u3, label: Balance deepening, detail: 'AUA per customer rose to £9,002 in 2024.'}
        - {id: u4, label: Revenue yield, detail: 'Subscription and AUA fees monetize the relationship.'}
        - {id: u5, label: Operating leverage, detail: 'Sycamore automation supports a high-margin model.'}
        - {id: u6, label: Profitability and cash generation, detail: '97% gross margin, £19.7m PBT, significant free cash flow.'}
      edges:
        - {from: u1, to: u2}
        - {from: u2, to: u3}
        - {from: u3, to: u4}
        - {from: u4, to: u5}
        - {from: u5, to: u6}
    approximationNotes: The bridge is qualitative at the acquisition-input layer because public CAC and payback data are missing.
    claimRefs: [CI012, CI013, CI017, CI029, CI030, CI031, CI034]
callouts:
