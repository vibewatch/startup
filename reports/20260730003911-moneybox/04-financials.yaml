    - {id: CI026, statement: Chip advertises lower investment-fee optics than Moneybox through a 0.25% public platform-fee message, type: observed, topic: pricing-pressure, sourceRefs: [SI018, SI025], confidence: low, freshness: current, answersQuestionRefs: [QI016, QI017]}
    - {id: CI027, statement: AJ Bell and Vanguard provide visible low-cost reference points for fee-sensitive wrapper users, type: observed, topic: pricing-pressure, sourceRefs: [SI018, SI023], confidence: high, freshness: current, answersQuestionRefs: [QI016, QI017]}
    - {id: CI028, statement: Public competitor pricing means Moneybox must defend on product breadth and guidance rather than on the cheapest headline fee, type: inferred, topic: pricing-pressure, sourceRefs: [SI008, SI018, SI023], confidence: medium, freshness: current, answersQuestionRefs: [QI016, QI017]}
    - {id: CI029, statement: Public disclosures do not provide CAC by channel or product, type: observed, topic: gaps, sourceRefs: [SI001, SI002], confidence: high, freshness: current, answersQuestionRefs: [QI019, QI020]}
    - {id: CI030, statement: Public disclosures do not provide payback period or contribution margin by product line, type: observed, topic: gaps, sourceRefs: [SI001, SI002], confidence: high, freshness: current, answersQuestionRefs: [QI019, QI020]}
    - {id: CI031, statement: Public disclosures do not provide churn, NRR, or cohort retention by entry product, type: observed, topic: gaps, sourceRefs: [SI001, SI002], confidence: high, freshness: current, answersQuestionRefs: [QI019, QI021]}
    - {id: CI032, statement: Public disclosures do not provide a current product-level revenue-mix bridge, type: observed, topic: gaps, sourceRefs: [SI001, SI008], confidence: high, freshness: current, answersQuestionRefs: [QI019, QI024]}
    - {id: CI033, statement: The biggest current financial unknown is how sensitive savings-related economics are to falling rates or changing mix, type: inferred, topic: gaps, sourceRefs: [SI008, SI025], confidence: medium, freshness: current, answersQuestionRefs: [QI022, QI024]}
    - {id: CI034, statement: Support and compliance costs could weaken current margins if product breadth scales faster than service quality, type: inferred, topic: gaps, sourceRefs: [SI009, SI025, SI014], confidence: medium, freshness: current, answersQuestionRefs: [QI023, QI025]}
    - {id: CI035, statement: The single most important next diligence ask is a product-level economic bridge covering CAC, payback, mix, and rate sensitivity, type: inferred, topic: gaps, sourceRefs: [SI029], confidence: low, freshness: current, answersQuestionRefs: [QI024, QI025]}
    - {id: CI036, statement: Public disclosures from AJ Bell provide a visible scale and transparency benchmark that Moneybox cannot yet match as a private company, type: inferred, topic: peer-benchmark, sourceRefs: [SI019, SI026, SI027], confidence: high, freshness: current, answersQuestionRefs: [QI016]}
    - {id: CI037, statement: Hargreaves Lansdown’s public key-data posture reinforces how much more visible unit economics and scale signals are in listed peers than in private app-led firms, type: inferred, topic: peer-benchmark, sourceRefs: [SI021, SI028, SI030], confidence: high, freshness: current, answersQuestionRefs: [QI016]}
    - {id: CI038, statement: Public-market wealth platforms create external valuation and pricing anchors that increase diligence expectations for Moneybox, type: inferred, topic: peer-benchmark, sourceRefs: [SI028, SI029, SI030], confidence: medium, freshness: current, answersQuestionRefs: [QI017]}
    - {id: CI039, statement: The gap between Moneybox’s strong company-level disclosure and listed-peer transparency increases the importance of private data-room evidence, type: inferred, topic: peer-benchmark, sourceRefs: [SI019, SI028, SI030], confidence: medium, freshness: current, answersQuestionRefs: [QI024]}
    - {id: CI040, statement: Late-stage underwriting should compare Moneybox’s margin durability against publicly benchmarked peers even when exact product economics remain private, type: inferred, topic: peer-benchmark, sourceRefs: [SI019, SI028, SI030], confidence: medium, freshness: current, answersQuestionRefs: [QI025]}
  evidenceGaps:
    - {type: private-evidence-only, severity: material, topic: unit-economics, missingEvidence: CAC, payback, contribution margin, and churn by entry product and acquisition channel., whyItMatters: These metrics determine whether current profitability can scale sustainably., diligencePath: Request monthly cohort and acquisition dashboards by product., relatedQuestionRefs: [QI019, QI020, QI021], relatedTableRefs: [TI003, TI005]}
    - {type: private-evidence-only, severity: material, topic: revenue-mix, missingEvidence: Current revenue bridge by subscription, investment fee, savings economics, and ancillary streams., whyItMatters: Margin durability and sensitivity analysis depend on mix quality., diligencePath: Request audited management accounts with product-level revenue and gross-margin segmentation., relatedQuestionRefs: [QI004, QI024], relatedTableRefs: [TI001, TI005]}
    - {type: missing-source, severity: material, topic: 2026-margin, missingEvidence: Public confirmation of 2025 or 2026 gross margin and current cash balance., whyItMatters: Revenue growth alone does not prove that 2024 economics persisted., diligencePath: Request current board finance pack and treasury summary., relatedQuestionRefs: [QI018], relatedTableRefs: [TI004, TI005]}
