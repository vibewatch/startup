      - number: '3.3'
        title: Pricing, trust, and why margin pressure is real
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence shows that Moneybox does not obviously own price leadership. Its Play Store
              listing still discloses a £1 monthly subscription plus a 0.45% annual investment fee on balances, with
              fund charges on top. That is simple, but simplicity is not the same as lowest cost. Chip publicly
              advertises a 0.25% investment platform fee, and large incumbents such as AJ Bell, Hargreaves Lansdown, and
              Vanguard publish detailed pricing or low-cost framing for ISAs and pensions. Consumers who reduce the
              decision to a cost comparison can therefore find alternatives quickly.

              Trust complicates that picture. Nutmeg benefits from J.P. Morgan ownership. Hargreaves Lansdown and AJ
              Bell have long-running public-company and household-brand credibility. Vanguard owns the low-cost
              passive-investing reference point. Moneybox’s competitive answer is not lower headline price but a
              friendlier customer journey. That can work, but it means service quality and product clarity are part of
              margin defence, not just marketing polish.
            claimRefs:
