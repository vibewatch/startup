            body: >-
              Moneybox’s balance-sheet risk profile looks better than that of a lender or insurer because the company is
              primarily gathering and administering customer assets rather than underwriting long-duration credit. The
              annual report states that the operating cash balance at year-end 2024 was £58.3 million and that the
              company generated significant free cash flow. It also describes a treasury framework that allows excess
              corporate liquidity to be placed into instant-access cash and short-dated gilts subject to approved risk
