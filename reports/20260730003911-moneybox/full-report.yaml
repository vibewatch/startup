      - number: '8.5'
        title: Recommendation and evidence assessment
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track with medium confidence, a medium risk rating, and a fair valuation stance.
              That is more constructive than a generic research-more posture because the public record already verifies
              real scale, profit, and product breadth. It is less aggressive than buy because the current mark came from
              a controlled secondary using a new market structure, and because the biggest remaining uncertainties map
              directly to valuation rather than to peripheral details. Put differently, Moneybox has done enough to
              clear the “is this a real business?” hurdle and much of the “is this a high-quality business?” hurdle, but
              it has not yet cleared the “is this entry price clearly attractive today?” hurdle.

              The price discipline conclusion is therefore straightforward. At roughly 7x 2025 revenue, the business
              does not look obviously overvalued versus profitable public UK platforms or versus the operating progress
              since the £550 million 2024 mark. But the upside also does not look so asymmetric that investors should
              ignore cap-table opacity, UK concentration, or PISCES-specific execution risk. The call would improve
              toward buy if management provides audited 2025 accounts, confirms post-event demand quality, demonstrates
              sustained 2026 revenue conversion from the H1 customer and inflow surge, and shows that advice-adjacent
              monetization can lift long-term unit economics. Absent those proofs, watch closely, engage in diligence,
              and be price-sensitive.
            claimRefs:
              - CV003
