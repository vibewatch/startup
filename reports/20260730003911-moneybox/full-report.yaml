      - number: '1.3'
        title: Funding history, shareholders, and valuation steps
        blocks:
          - type: paragraph
            body: >-
              Moneybox’s capital history is notable because recent price formation has come through structured liquidity
              events, not through a straightforward growth-equity primary round. The company disclosed a £35 million
              Series D in March 2022 led by Fidelity International Strategic Ventures, with Polar Capital joining and
              existing backers including Oxford Capital, Burda, CNP, and Breega continuing their support. In October
              2024, Moneybox announced a c.£70 million transaction involving Apis Partners and Amundi that was mainly
              secondary with some primary capital and valued the company at £550 million, 84% above the Series D mark.
              That transaction also highlighted the unusual breadth of the cap table by referencing a 35,000-strong
              shareholder community.

              The July 2026 step is more consequential. Moneybox prepared up to £45 million of employee secondary
              liquidity at an £800 million valuation using the London Stock Exchange’s Private Securities Market under
              the new PISCES framework, with Crowdcube managing the sell-side and investor process. This says two things
              at once. Positively, the company did not need a rescue round to reach a unicorn-equivalent valuation and
              instead used the transaction to create liquidity for long-serving staff. More cautiously, the valuation
              was established in a controlled private market window rather than through open, price-discovering
              institutional competition. The resulting mark is real and strategically meaningful, but it should still be
              interpreted with some liquidity-discount awareness.
