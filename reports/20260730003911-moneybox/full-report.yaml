chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, products, and current scale
        blocks:
          - type: paragraph
            body: >-
              Moneybox is a London-based consumer savings and wealth-management app built for UK retail users who want a
              guided, mobile-first path into saving, investing, home buying, and retirement planning. The company was
              incorporated in 2015 and launched publicly in 2016, initially becoming known for its round-up mechanism
              that swept spare change from everyday card purchases into investing accounts. That original wedge still
              matters because it explains the brand, but it no longer captures the full business. Public product
              materials and the 2024 annual report show that Moneybox now spans Stocks and Shares ISAs, Cash ISAs,
              Lifetime ISAs, Junior ISAs, general investment accounts, pensions, cash savings, and home-buying
              workflows. This breadth is strategically important because it means the company is not only chasing
              first-time investors; it is building a broader retail wealth relationship around major financial
              milestones.

              The strongest scale signals are current and concrete. Moneybox’s 2024 annual report recorded 1.3 million
              funded customers and £11.7 billion of assets under administration at year-end 2024. The July 2026 support
              announcement then updated the picture to more than 1.9 million customers and more than £23 billion of AUA,
              alongside 390,000+ new customers in H1 2026 and £3.5 billion of inflows in that period. Those disclosures
              suggest that Moneybox’s identity has shifted from a niche savings app into a scaled mass-market UK wealth
              platform whose value proposition is simplicity, wrapper breadth, and lifecycle relevance rather than one
              single investment product.
