      - number: '2.2'
        title: UK demand pools, buyer segments, and where adoption comes from
        blocks:
          - type: paragraph
            body: >-
              The addressable demand pool is strongest where Moneybox can convert passive saving intent into active
              wrapper use. HMRC and Investment Association data show that ISAs remain an important household savings and
              investing structure in the UK, while FCA Financial Lives work shows many consumers still lack confidence,
              advice, or engagement with long- term investing decisions. That combination is favorable for a guided
              app-led player: Moneybox does not need every UK adult to become an active investor, only a meaningful
              share of digitally comfortable consumers who value simple wrappers, regular contributions, and clear
              product framing. The buyer is usually the same person as the user and payer, which simplifies product
              design but makes trust, rate competitiveness, and ease of use unusually important.

              The most relevant segments are beginner investors, cash-first savers, first-home savers using the LISA,
              pension consolidators, and time-poor working households that want a single app for adjacent wealth jobs.
              These segments are linked by workflow rather than by profession or industry vertical. Consumer trigger
              points are salary changes, first-home planning, family formation, pension housekeeping, and
              dissatisfaction with incumbent banking or broker experiences. Moneybox wins when it turns those moments
              into funded, recurring, habit-based accounts.
