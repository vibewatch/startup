  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The core thesis is unusually strong for a UK consumer fintech. Moneybox has crossed from product promise
              into scaled financial proof: the company says it now serves more than 1.9 million customers, administers
              more than £23 billion, exceeded £115 million of annual revenue in 2025, and delivered a third consecutive
              profitable year. The 2024 annual report already showed £93.8 million of revenue, £19.7 million of profit
              before tax, 97% gross margin, and £11.7 billion of AUA, so the 2026 update is not a leap of faith from an
              opaque base. Product breadth also matters. Moneybox is no longer a single-feature round-up app; it spans
              Stocks and Shares ISA, Cash and Lifetime ISA, pension, Junior ISA, general investing, home-buying, and
              pension-consolidation journeys. That platform depth, combined with a retail-friendly brand, supports the
              idea that Moneybox can be a category-defining UK wealth app.

              The anti-thesis is about price discovery and market concentration rather than whether the company exists
              at scale. The £800 million mark comes from a controlled employee secondary on a brand-new PISCES venue,
              not from a traditional competitive primary round. The FCA explicitly frames PISCES as a private-market
              sandbox where issuers can control buyer access and pricing boundaries, and independent coverage notes that
              thin trading and limited public history make it hard to know whether the same price would survive a broad
              external fundraise. Investors are thus not being asked to judge a weak business; they are being asked to
              decide how much confidence to place in a new liquidity mechanism and in a UK-only wealth platform whose
              multiple expansion may be capped by regulation, savings-rate cycles, and domestic competition.
            claimRefs:
              - CV001
              - CV002
              - CV003
