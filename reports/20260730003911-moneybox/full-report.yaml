      - number: '2.3'
        title: Growth drivers, structural constraints, and timing logic
        blocks:
          - type: paragraph
            body: >-
              The main demand drivers are straightforward. Digital distribution lowers acquisition friction.
              Cash-to-investment conversion remains a live consumer need. The UK’s tax-wrapper system gives people
              reasons to act before tax-year deadlines. First-home affordability pressures make the LISA and disciplined
              saving journeys especially relevant. Pension fragmentation creates administrative pain that apps like
              Moneybox can solve. Savings-rate competition also keeps consumers attentive to where they park balances,
              which can help acquisition even if it later complicates mix. Public market sources consistently suggest
              that consumers still want simpler journeys and clearer financial tooling, especially when confidence is
              low and traditional advice remains expensive or inaccessible.

              The main constraints are equally visible. Moneybox is UK-only, so macro and policy exposure is
              concentrated. ISA, LISA, and pension rules are politically and regulatorily important. Cash-rate
              competition can attract fickle users. The beginner-investor market is attractive, but it is also sensitive
              to consumer confidence, cost-of-living stress, and perceptions of investment risk. That means market
              timing is not only about secular digitisation; it is also about whether consumers have surplus cash, trust
              the wrapper, and believe the app is making a complex decision feel safe and actionable.
