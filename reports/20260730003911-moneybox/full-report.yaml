      - number: '3.2'
        title: Feature breadth, lifecycle packaging, and where Moneybox differentiates
        blocks:
          - type: paragraph
            body: >-
              Moneybox’s strongest competitive advantage is not that it is always the cheapest or deepest specialist in
              any one product. Its advantage is that it packages several adjacent consumer wealth jobs in one guided
              app-native relationship. The company combines cash saving, Cash ISA, Stocks and Shares ISA, LISA, Junior
              ISA, general investment account, and pension workflows with a beginner-friendly interface. That matters
              because many households do not want to manage separate providers for every financial goal. Nutmeg broadly
              matches a large portion of the wrapper set, but its public story is more tightly centered on managed
              wealth than on home-buying or spare-change saving behavior. Plum and Chip can feel more dynamic in
              automation or rates messaging, while incumbent platforms win on research depth, asset breadth, or brand
              trust.

              The differentiation question is therefore about packaging and progression. Moneybox wants a user who
              enters through a simple savings or investing action to expand over time into pensions, LISAs, or
              higher-balance accounts. That cross-product journey is more strategically important than any single
              wrapper parity claim.
            claimRefs:
