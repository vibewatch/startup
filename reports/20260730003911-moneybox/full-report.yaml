  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - side
      - argument
      - evidence anchor
      - what would change the view
    rows:
      - - Thesis
        - Moneybox has moved from app novelty to scaled wealth platform.
        - 1.9m+ customers, £23bn+ AUA, £115m+ revenue, 3 profitable years.
        - A material reversal in growth, inflows, or profitability would weaken this.
      - - Thesis
        - Product breadth supports better lifetime value than a single-feature savings app.
        - ISA, LISA, pension, JISA, GIA, mortgages, and retirement workflows are all public.
        - If customers remain shallow and ARPU fails to deepen, breadth matters less.
      - - Thesis
        - The current mark is supported by real operating progress since 2024.
        - £800m is about 45% above the £550m 2024 mark after another profitable year.
        - If 2025 audited accounts fail to confirm scale or quality, the re-rating weakens.
      - - Anti-thesis
        - PISCES pricing is not identical to broad-market price discovery.
        - FCA rules allow controlled buyer access and price parameters; independent coverage flags thin trading.
        - A later primary round or broad secondary clearing at the same price would strengthen confidence.
      - - Anti-thesis
        - UK-only concentration can cap terminal multiple expansion.
        - Regulatory and savings-rate sensitivity remain concentrated in one market.
        - Evidence of broader monetization or geography would reduce this discount.
      - - Anti-thesis
        - Current price already discounts meaningful quality.
        - At roughly 7x 2025 revenue, investors are not buying at obvious distress levels.
        - A lower entry price or clearer upside from advice and balance deepening would improve the setup.
