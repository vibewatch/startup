      - number: '7.2'
        title: Operating, cyber, and service-quality risk can transmit quickly into trust
        blocks:
          - type: paragraph
            body: >-
              Moneybox is a consumer app handling sensitive financial data, payment flows, transfers, customer assets,
              and time-sensitive milestones such as ISA transfers or home-deposit saving. That means operational
              resilience and cyber risk are central rather than abstract. The FCA’s operational-resilience guidance and
              cyber-security publications set an explicit expectation that firms identify important business services,
              prepare for severe but plausible disruption, and continuously improve their cyber defenses. Moneybox’s own
              annual report and support materials are reassuring on process: they mention annual penetration testing,
              information-security governance, NIST maturity alignment, and prudential oversight. But public proof on
              service performance is thinner. There is no public uptime dashboard, no public incident-rate disclosure,
              and no transfer-cycle-time reporting.

              Reviews show why that matters. Negative customer commentary is concentrated around transfers, support
              responsiveness, app navigation, and the frustration that follows rate resets or friction during money
              movement. The problem is not that these complaints prove systemic failure; it is that in retail finance,
              the reputational cost of a few bad experiences can be high because the underlying trust bar is so
              elevated. In short, public controls look decent, but the operating-risk thesis still hinges on execution
              evidence that is not yet fully published.
            claimRefs:
