      - number: '3.4'
        title: Moat durability, switching costs, and where competitors can break the thesis
        blocks:
          - type: paragraph
            body: >-
              Moneybox has a real but moderate moat. The best evidence in its favor is strong retention, product
              breadth, lifecycle packaging, and the operating leverage implied by its proprietary platform and rising
              AUA per customer. These factors suggest users do not treat the app as disposable. But the moat is not
              impregnable. Wrappers are portable, transfers exist, and consumers can become more price-sensitive as
              balances rise. Savings-led rivals can outbid on rate or fee optics, incumbents can win maturing customers
              on trust and breadth, and direct-investing apps can capture younger users before they ever enter
              Moneybox’s guided funnel. Public adverse reviews also remind us that transfer friction and support quality
              remain where trust can erode fastest.

              The underwriting conclusion is therefore that Moneybox’s competitive position is strongest with first-time
              and time-poor consumers who value guided breadth, and weakest with fee-sensitive power users who optimize
              for cost, rate, or execution flexibility.
