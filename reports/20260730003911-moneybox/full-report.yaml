      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is better than for many private fintechs because Moneybox has already demonstrated orderly
              liquidity mechanics, but the evidence is still incomplete for a full investment-committee green light. The
              2024 and 2026 transactions both look more like shareholder-liquidity events than rescue financings, which
              is positive. PISCES also gives the company a domestic route for partial liquidity without forcing an IPO
              before management is ready. Yet that same mechanism is early, experimental, and controlled. The most
              important missing variables are therefore not basic scale metrics; they are the ones that determine
              whether a late-stage investor earns attractive returns from this entry point. Those include the preference
              stack, any overhang from prior secondaries, audited 2025 financial statements, post-sale clearing demand,
              product-level ARPU, and rate-sensitivity by cohort.

              Investors should also remember that Moneybox remains structurally UK-centric. That focus has been a
              strength in product design and regulatory fit, but it narrows strategic acquirer and IPO narratives
              relative to more diversified wealth platforms. A convincing upside case would therefore be stronger with
              evidence that Aurora or adjacent advice tools can expand monetization, that first-home and retirement
              workflows deepen wallet share, and that margin quality survives if savings-rate competition intensifies.
              Until those data-room questions are answered, the company is clearly investable in principle, but not yet
              fully underwritten at price in public-only diligence.
            claimRefs:
              - CV009
              - CV012
