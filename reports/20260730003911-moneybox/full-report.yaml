      - number: '1.2'
        title: Founders, governance, and legal structure
        blocks:
          - type: paragraph
            body: >-
              Founder continuity is one of Moneybox’s clearest strengths. Ben Stanway and Charlie Mortimer remain the
              central founder-operators and are still publicly identified with the company’s strategic direction,
              product philosophy, and financing milestones. The support release and investor materials repeatedly quote
              Stanway, while the annual report and earlier company pages reinforce Mortimer’s continuing role as
              co-founder and product architect. That continuity matters in a regulated consumer-finance company because
              product trust, compliance quality, and customer outcomes often depend on a management team staying
              disciplined through scale. The annual report also shows that the company’s governance is materially more
              developed than that of a small app startup, with named non-executive board members, board committees, and
              management committees covering risk, remuneration, nominations, treasury, product governance, CASS, and
              information security.

              Legally, the group is anchored by Digital Moneybox Limited, with subsidiaries used for mortgage activity,
              pensions, and related regulated operations. Companies House confirms the main company number and
              registered office, while the Play Store listing discloses FCA permissions and protection language. The
              governance picture is therefore positive but not fully exhaustive from public sources: the board roster is
              visible at a high level, yet full ownership, voting control, and observer-right detail remain private.
              That makes founder concentration a real, but not necessarily problematic, feature of the company overview.
