      - number: '2.4'
        title: SAM and SOM logic for Moneybox specifically
        blocks:
          - type: paragraph
            body: >-
              For Moneybox, the most useful sizing frame is not a single TAM number but a narrowing from broad UK
              household savings and wrapper pools toward digitally reachable, self-directed, non-advised users likely to
              adopt an app-led relationship. The total universe includes all UK households with savings, pensions, or
              home-buying intent. The serviceable market is narrower: consumers comfortable using a mobile app for
              regulated financial products and whose needs fit standardized wrappers rather than bespoke advisory
              relationships. The obtainably reachable market is narrower still, constrained by brand awareness,
              competition, product eligibility, transfer friction, and the fact that Moneybox is not trying to serve
              every investor archetype.

              Public evidence suggests Moneybox already has material penetration inside this narrower zone, given 1.9
              million+ customers and £23 billion+ of AUA. That does not prove saturation. Instead, it implies the
              company has already crossed from speculative market entry into meaningful share capture inside the UK
              guided-wealth niche. The most important underwriting question is therefore less “is the market big
              enough?” and more “can Moneybox keep gaining share, wallet depth, and multi-product adoption faster than
              regulatory, pricing, and incumbent pressure reduce the economic quality of that growth?”
            claimRefs:
