  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk are structural, not incidental
        blocks:
          - type: paragraph
            body: >-
              Moneybox is tightly coupled to UK retail-finance regulation because its core products are wrappers whose
              appeal, disclosure requirements, and transfer mechanics are defined by public policy. FCA authorization,
              CASS obligations, operational-resilience expectations, consumer-protection requirements, and the broader
              conduct environment all sit inside the company’s normal operating model rather than at the edge of it.
              This matters because changes to rules can alter product attractiveness even if the core app experience
              stays the same. The 2027 ISA reform factsheet is a concrete example: the government has already set out a
              lower Cash ISA allowance for many users, new restrictions on transfers from non-cash ISAs into Cash ISAs,
              and anti-circumvention rules designed to push savers toward investment products rather than long-term cash
              parking.

              For Moneybox, that creates both opportunity and risk. A shift favoring non-cash investing can help the
              platform’s broader investment proposition, but it can also complicate product design, customer
              communication, and savings-led acquisition strategies. LISA policy is similarly sensitive because
              withdrawal rules, bonuses, and home-buying eligibility are government-defined rather than
              company-controlled. The practical risk is therefore not that regulation suddenly outlaws the business, but
              that incremental rule changes increase compliance cost, alter product mix, or produce customer
              dissatisfaction that the company cannot fully control.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
