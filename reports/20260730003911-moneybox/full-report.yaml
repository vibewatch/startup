      - number: '8.3'
        title: Scenario analysis and sensitivity
        blocks:
          - type: paragraph
            body: >-
              The scenario range does not require heroic spreadsheet modeling because the revenue anchor is unusually
              tangible. If investors take the company’s statement that 2025 revenue exceeded £115 million as the minimum
              baseline, then a sensible public-to-private late-stage range can be framed using revenue multiples rather
              than speculative user or AUA heuristics. In the bear case, Moneybox remains profitable but growth cools,
              PISCES pricing proves optimistic, and UK-only concentration plus policy risk limit appetite to around 5x
              to 6x revenue. That implies roughly £575 million to £690 million. In the base case, the company continues
              compounding on strong retention, broad product depth, and consumer-trust advantages, but without a
              step-change in international optionality or margin revelation. A 6.5x to 7.5x range on roughly £115
              million to £120 million of revenue points to approximately £750 million to £900 million.

              The bull case requires more than continued existence. It needs evidence that Moneybox’s advice-adjacent
              and life-stage product expansion can deepen ARPU, that the 2026 customer additions convert into durable
              balances, and that the market views the platform more like a scaled digital-wealth compounder than a
              rate-sensitive savings app. Under those conditions, about 8.5x to 10x on £115 million to £120 million of
              revenue yields roughly £980 million to £1.15 billion. That is enough to justify or modestly exceed the
              current mark, but not enough to call the price a clear bargain. The practical conclusion is that the
              present valuation already discounts real business quality, while leaving only moderate upside unless
              growth, advice monetization, or exit optionality improves further.
            claimRefs:
              - CV004
              - CV019
