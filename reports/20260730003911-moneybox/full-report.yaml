      - number: '8.2'
        title: Valuation context and comparable set
        blocks:
          - type: paragraph
            body: >-
              The current valuation context is more nuanced than a standard unicorn headline implies. Moneybox’s July
              2026 announcement said the company is preparing a secondary share sale of up to £45 million at
              approximately £800 million, a roughly 45% uplift from the £550 million valuation attached to the October
              2024 secondary-backed transaction. That matters because the mark is not disconnected from prior evidence:
              the 2024 event already pointed to a profitable business with over £10 billion of AUA and rapid revenue
              scaling, while the 2026 update adds another year of profit, higher AUA, and continued customer growth. On
              raw revenue math, the current mark is about 7x 2025 revenue using the company’s disclosed £115 million
              floor. That is not a distressed number, but it is also not obviously euphoric for a profitable,
              fast-growing platform business.

              Comparables suggest the price is plausible but full. Nutmeg’s reported 2021 sale price of around £700
              million came at a meaningfully earlier point in the market cycle and before the rebranded platform was
              said to exceed £8.5 billion of AUM and 265,000 customers. AJ Bell, by contrast, is a mature listed
              benchmark with £317.8 million of revenue, £108.2 billion of AUA, and an approximately $3.12 billion market
              cap in 2026, while Hargreaves Lansdown’s last known public market cap before take-private was around $7.12
              billion. Wealthsimple sits at the opposite end of the ambition range: a CAD $10 billion 2025 post-money
              valuation, profitability, and over $100 billion of AUA that later rose to $155.6 billion in Q2 2026.
              Relative to those anchors, Moneybox’s £800 million mark looks more fair than stretched, but only if its
              profit durability and customer depth truly hold up through a softer rate environment.
