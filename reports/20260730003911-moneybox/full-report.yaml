      - number: '7.4'
        title: People risk, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Founder and people risk are real, even if they are less dramatic than the regulatory and commercial
              issues. Ben Stanway remains the central public spokesperson for strategy, financing, and policy-relevant
              announcements, while the founder-led nature of the company means leadership continuity is part of the
              culture and product logic. That is a strength until it becomes concentration risk. If execution quality
              slips while founder dependence remains high, escalation bandwidth can narrow quickly. The broader people
              risk is that consumer-finance scaling requires strong operational, risk, compliance, product, and support
              talent all at once; weak coordination across those groups can harm service quality before it shows up in
              public financials.

              The good news is that Moneybox does not look operationally careless. Profitability, cash generation, a
              mature board and committee structure, prudential processes, and a disclosed security program all reduce
              the probability of a catastrophic break. The right investment stance is therefore not “avoid because risk
              exists,” but “monitor because the most important risks are measurable and can change fast.” Thesis-break
              triggers include a deterioration in transfer quality, sharp regulatory changes that reduce wrapper
              attractiveness, sustained out-competition on rate and price, meaningful cyber incidents, or evidence that
              key customer cohorts are weaker than headline counts suggest.
            claimRefs:
