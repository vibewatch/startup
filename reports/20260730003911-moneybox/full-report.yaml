  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive map is broader than “other round-up apps”
        blocks:
          - type: paragraph
            body: >-
              Moneybox’s competitive set is easiest to underestimate when the business is remembered primarily as a
              round-up app. In reality the company now overlaps with guided-investing apps, cash-saving apps, pensions
              products, first-home saving tools, and low-cost investment platforms. Nutmeg is the closest clean analogue
              because it covers ISAs, pensions, Lifetime ISAs, Junior ISAs, and guided investing in a polished digital
              wrapper. Plum and Chip compete in a different but still important way: they start closer to savings
              automation and cash management, then extend into investing and other financial behaviors. At the incumbent
              end, Hargreaves Lansdown, AJ Bell, and Vanguard compete less on app-native habit loops and more on trust,
              breadth, or price. Trading 212 matters as an attention and acquisition competitor for younger investors
              who may choose direct execution before a guided wealth journey.

              This mixed set means Moneybox is not only fighting one category. It must hold up against automation-first
              apps, legacy platforms, and low-cost investing brands simultaneously. That broadens the market opportunity
              but also means no single feature comparison resolves the true competitive picture.
            claimRefs:
