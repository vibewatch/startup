  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and what Moneybox is actually selling into
        blocks:
          - type: paragraph
            body: >-
              The correct market boundary for Moneybox is narrower and more useful than “global fintech” or even
              “wealthtech.” Public evidence shows the company is focused on UK households using savings, investment,
              pension, and home-buying wrappers through a mobile-first interface. That means the practical market
              combines several adjacent pools: consumer cash savings, Stocks and Shares ISAs, Cash ISAs, Lifetime ISAs,
              pension consolidation, and beginner retail investment adoption. Moneybox is therefore exposed to the
              behavior of UK households allocating surplus cash, not to a borderless global software market. This
              distinction matters because a UK-only, wrapper-heavy strategy can still be a very good business, but it
              deserves underwriting against UK policy and household-finance conditions, not against generic
              venture-scale TAM slides.

              HMRC’s annual savings commentary and statistics, the Investment Association’s ISA Barometer, FCA Financial
              Lives work, and ONS household-finance publications all point to the same structural feature: the
              addressable opportunity is large because vast household balances remain in cash, because wrapper usage is
              material, and because many people still need help translating abstract long-term goals into simple
              actions. Moneybox’s role inside that market is not to serve institutional traders or high-net-worth
              advisers; it is to package wrappers and financial habits for mass and emerging-affluent UK consumers who
              want low-friction action more than bespoke advice.
            claimRefs:
              - CM001
