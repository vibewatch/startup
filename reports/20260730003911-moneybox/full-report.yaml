  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and how Moneybox gets paid
        blocks:
          - type: paragraph
            body: >-
              Moneybox monetizes through a blend of recurring subscription revenue, AUA-based investment charges,
              partner-bank economics on some savings products, and smaller ancillary economics from adjacent products
              such as mortgages. The most explicit public pricing disclosure remains the Play Store listing, which
              states a £1 monthly subscription and a 0.45% annual investment fee on balances, plus underlying fund
              charges. That is important because it shows the business is not a zero-fee growth app; customers are asked
              to pay directly for the platform, and the model becomes stronger as balances deepen. Public product pages
              and review sources also imply that some cash products are presented with no customer account fee,
              suggesting economics may partly flow from partner-bank arrangements rather than direct retail charging.

              The resulting model is more attractive than a purely transactional app because it is recurring,
              wrapper-linked, and balance-sensitive. But the public record still leaves open how much revenue comes from
              subscriptions versus AUA charges, savings spreads, or other ancillary streams. That mix question matters
              because it determines how much of current profitability is exposed to rate competition and how much is
              defended by long-duration investment balances.
