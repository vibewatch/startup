  - id: TV004
    title: Comparable valuation table
    columns: [comparable, metric, multiple/valuation/status, relevance, limitation]
    rows:
      - ['Moneybox', '£115m+ 2025 revenue; £23bn+ AUA; 1.9m+ customers', '£800m / about 7x revenue', 'Direct subject; shows current entry price discipline.', 'Price set in controlled secondary rather than broad fundraise.']
      - ['Nutmeg / J.P. Morgan Personal Investing', 'Reported ~£700m 2021 sale; later ~£8.5bn AUM and 265k customers', 'Strategic acquisition reference', 'Closest UK digital-wealth strategic comp with brand and wrapper overlap.', 'Different cycle, parent backing, and sale context limit one-for-one comparison.']
      - ['AJ Bell', '£317.8m revenue; £108.2bn AUA; 657k customers', 'Public market cap about $3.12bn in 2026', 'Profitable listed UK platform anchor for scale and valuation discipline.', 'Far more mature and broader distribution model than Moneybox.']
      - ['Hargreaves Lansdown', 'Large incumbent direct-investing and savings platform', 'Last known public market cap about $7.12bn before take-private', 'Upper-end UK platform value anchor.', 'Incumbent scale and legacy differences reduce direct comparability.']
      - ['Wealthsimple', 'CAD $10bn 2025 post-money; $100bn AUA in 2025; $155.6bn AUA and 3.6m clients by Q2 2026', 'Premium North American digital-wealth benchmark', 'Shows what a scaled, multi-product digital wealth platform can be worth.', 'Different geography, product breadth, and capital-market depth.']
    notes: >-
      The comparable set mixes UK public platforms, a strategic M&A reference, and a high-end North American private
      benchmark because no perfect public peer matches Moneybox’s exact business model.
    enumerationScope:
      coverage: partial
      basis: Comparable set covers the subject company, closest UK strategic and listed anchors, and one scaled international digital-wealth benchmark.
