      - [Base, 'Profitability persists, customer growth normalizes, and Moneybox remains a premium UK wealth app without dramatic multiple expansion.', '6.5x-7.5x on ~£115m-£120m revenue = ~£750m-£900m.', 'UK concentration and competition cap upside.', 'Most plausible on current evidence.']
      - [Bear, 'Growth cools, public/private investors discount PISCES marks, and savings-rate or policy pressure compresses sentiment.', '5x-6x on ~£115m revenue = ~£575m-£690m.', 'Price-discovery skepticism and product-mix weakness.', 'Material downside if narrative runs ahead of post-event proof.']
