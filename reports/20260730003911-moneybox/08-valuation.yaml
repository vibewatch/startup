      - ['Cap table and preferences', 'Liquidation stack, anti-dilution, and rights attached to prior rounds and secondaries', 'Return math can be very different from enterprise-value optics.', 'Company counsel and financing document review']
      - ['PISCES clearing evidence', 'Buyer mix, oversubscription, turnover, and any price support features', 'Determines whether the £800m mark is robust or merely indicated.', 'Transaction process review with management and intermediaries']
      - ['Product-level monetization', 'ARPU, revenue mix, and cohort economics by wrapper and advice workflow', 'Bull case depends on deeper monetization, not just headline customer growth.', 'Finance and analytics workstream']
      - ['Rate sensitivity', 'How savings-rate changes affect acquisition, retention, and product mix', 'Determines downside if cash-product competition intensifies.', 'Treasury and growth model review']
      - ['2026 trading update', 'H2 2026 revenue conversion from 390k H1 customer adds and £3.5bn H1 inflows', 'Tests whether growth quality is keeping pace with top-line narrative.', 'Board deck and management update']
    notes: >-
      Each ask maps directly to a valuation input that is still private.
    claimRefs: [CV006, CV007, CV016, CV043, CV047]
