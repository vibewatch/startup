  - id: TV005
    title: Thesis-break and kill triggers table
    columns: [trigger, threshold, transmission to thesis, action implication]
    rows:
      - ['Post-event demand is weak', 'Clearing interest proves narrow or materially below the headline price', 'Undermines confidence that £800m is a durable mark', 'Reprice toward bear-case range or pause.']
      - ['2025 audited accounts disappoint', 'Revenue, profit quality, or cash profile falls short of the public narrative', 'Reduces confidence in fair-value base case', 'Move from track toward research-more or avoid.']
      - ['UK policy shock', 'ISA/LISA or wrapper-rule changes materially impair product attractiveness', 'Caps growth and terminal multiple expansion', 'Lower multiple assumptions and focus on downside protection.']
      - ['Rate and mix pressure', 'Cash or entry products attract balances but fail to convert into durable high-quality revenue', 'Bull case on monetization weakens', 'Keep valuation at or below base case.']
      - ['Execution or trust break', 'Major service, cyber, or conduct issue damages customer confidence', 'Consumer-wealth brand premium evaporates quickly', 'Treat as thesis break until retention and inflows stabilize.']
    notes: >-
      These are valuation-relevant pre-commitment triggers, not generic operating KPIs.
    claimRefs: [CV012, CV013, CV014, CV017, CV043, CV045, CV046, CV047]
  - id: TV006
    title: Final diligence asks table
    columns: [topic, missing evidence, why it matters, owner or diligence path]
    rows:
