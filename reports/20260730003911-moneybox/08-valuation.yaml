schemaVersion: report-v2
artifact: valuation
slug: moneybox
runDate: '2026-07-30'
company:
  name: Moneybox
chapter:
  number: 8
  title: Valuation
  summary: >-
    Moneybox looks like a genuine scaled, profitable consumer-wealth platform rather than a narrative-only fintech,
    but the July 2026 £800 million / $1.1 billion mark should still be treated as a controlled secondary price rather
    than a fully market-clearing financing benchmark. Using the company’s own disclosure of more than £115 million of
    2025 revenue implies roughly 7x revenue at the current mark, which looks fair rather than obviously cheap when set
    against profitable listed UK platforms, Nutmeg’s reported sale price, and Wealthsimple’s much larger Canadian
    benchmark. The result is a track recommendation with medium confidence: the business quality is real, but investors
    still need post-PISCES clearing evidence, cap-table detail, and audited 2025 accounts before moving from interest to
    conviction.
sections:
  - id: investment-thesis-and-anti-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The core thesis is unusually strong for a UK consumer fintech. Moneybox has crossed from product promise into
      scaled financial proof: the company says it now serves more than 1.9 million customers, administers more than £23
      billion, exceeded £115 million of annual revenue in 2025, and delivered a third consecutive profitable year. The
      2024 annual report already showed £93.8 million of revenue, £19.7 million of profit before tax, 97% gross margin,
      and £11.7 billion of AUA, so the 2026 update is not a leap of faith from an opaque base. Product breadth also
      matters. Moneybox is no longer a single-feature round-up app; it spans Stocks and Shares ISA, Cash and Lifetime
      ISA, pension, Junior ISA, general investing, home-buying, and pension-consolidation journeys. That platform depth,
      combined with a retail-friendly brand, supports the idea that Moneybox can be a category-defining UK wealth app.

      The anti-thesis is about price discovery and market concentration rather than whether the company exists at scale.
      The £800 million mark comes from a controlled employee secondary on a brand-new PISCES venue, not from a
      traditional competitive primary round. The FCA explicitly frames PISCES as a private-market sandbox where issuers
      can control buyer access and pricing boundaries, and independent coverage notes that thin trading and limited public
      history make it hard to know whether the same price would survive a broad external fundraise. Investors are thus not
      being asked to judge a weak business; they are being asked to decide how much confidence to place in a new
      liquidity mechanism and in a UK-only wealth platform whose multiple expansion may be capped by regulation,
      savings-rate cycles, and domestic competition.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV012, CV013, CV014, CV016, CV017, CV018, CV035, CV046, CV047]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: valuation-context-and-comps
    title: Valuation context and comparable set
    body: >-
      The current valuation context is more nuanced than a standard unicorn headline implies. Moneybox’s July 2026
      announcement said the company is preparing a secondary share sale of up to £45 million at approximately £800
      million, a roughly 45% uplift from the £550 million valuation attached to the October 2024 secondary-backed
      transaction. That matters because the mark is not disconnected from prior evidence: the 2024 event already pointed
      to a profitable business with over £10 billion of AUA and rapid revenue scaling, while the 2026 update adds another
      year of profit, higher AUA, and continued customer growth. On raw revenue math, the current mark is about 7x
      2025 revenue using the company’s disclosed £115 million floor. That is not a distressed number, but it is also not
      obviously euphoric for a profitable, fast-growing platform business.

      Comparables suggest the price is plausible but full. Nutmeg’s reported 2021 sale price of around £700 million came
      at a meaningfully earlier point in the market cycle and before the rebranded platform was said to exceed £8.5 billion
      of AUM and 265,000 customers. AJ Bell, by contrast, is a mature listed benchmark with £317.8 million of revenue,
      £108.2 billion of AUA, and an approximately $3.12 billion market cap in 2026, while Hargreaves Lansdown’s last
      known public market cap before take-private was around $7.12 billion. Wealthsimple sits at the opposite end of the
      ambition range: a CAD $10 billion 2025 post-money valuation, profitability, and over $100 billion of AUA that later
      rose to $155.6 billion in Q2 2026. Relative to those anchors, Moneybox’s £800 million mark looks more fair than
      stretched, but only if its profit durability and customer depth truly hold up through a softer rate environment.
    claimRefs: [CV001, CV002, CV008, CV009, CV016, CV019, CV020, CV024, CV025, CV027, CV028, CV029, CV030, CV031, CV032, CV033, CV037, CV038, CV050, CV051]
    tableRefs: [TV004]
    figureRefs: [FV002]
  - id: scenario-analysis-and-sensitivity
    title: Scenario analysis and sensitivity
    body: >-
      The scenario range does not require heroic spreadsheet modeling because the revenue anchor is unusually tangible.
      If investors take the company’s statement that 2025 revenue exceeded £115 million as the minimum baseline, then a
      sensible public-to-private late-stage range can be framed using revenue multiples rather than speculative user or AUA
      heuristics. In the bear case, Moneybox remains profitable but growth cools, PISCES pricing proves optimistic, and
      UK-only concentration plus policy risk limit appetite to around 5x to 6x revenue. That implies roughly £575 million
      to £690 million. In the base case, the company continues compounding on strong retention, broad product depth, and
      consumer-trust advantages, but without a step-change in international optionality or margin revelation. A 6.5x to 7.5x
      range on roughly £115 million to £120 million of revenue points to approximately £750 million to £900 million.

      The bull case requires more than continued existence. It needs evidence that Moneybox’s advice-adjacent and
      life-stage product expansion can deepen ARPU, that the 2026 customer additions convert into durable balances, and
      that the market views the platform more like a scaled digital-wealth compounder than a rate-sensitive savings app.
      Under those conditions, about 8.5x to 10x on £115 million to £120 million of revenue yields roughly £980 million to
      £1.15 billion. That is enough to justify or modestly exceed the current mark, but not enough to call the price a clear
      bargain. The practical conclusion is that the present valuation already discounts real business quality, while leaving
      only moderate upside unless growth, advice monetization, or exit optionality improves further.
    claimRefs: [CV004, CV019, CV027, CV030, CV039, CV040, CV041, CV042, CV044, CV045]
    tableRefs: [TV003]
    figureRefs: [FV003]
  - id: exit-readiness-and-diligence-asks
    title: Exit readiness and final diligence asks
    body: >-
      Exit readiness is better than for many private fintechs because Moneybox has already demonstrated orderly liquidity
      mechanics, but the evidence is still incomplete for a full investment-committee green light. The 2024 and 2026
      transactions both look more like shareholder-liquidity events than rescue financings, which is positive. PISCES also
      gives the company a domestic route for partial liquidity without forcing an IPO before management is ready. Yet that
      same mechanism is early, experimental, and controlled. The most important missing variables are therefore not basic
      scale metrics; they are the ones that determine whether a late-stage investor earns attractive returns from this entry
      point. Those include the preference stack, any overhang from prior secondaries, audited 2025 financial statements,
      post-sale clearing demand, product-level ARPU, and rate-sensitivity by cohort.

      Investors should also remember that Moneybox remains structurally UK-centric. That focus has been a strength in
      product design and regulatory fit, but it narrows strategic acquirer and IPO narratives relative to more diversified
      wealth platforms. A convincing upside case would therefore be stronger with evidence that Aurora or adjacent advice
      tools can expand monetization, that first-home and retirement workflows deepen wallet share, and that margin quality
      survives if savings-rate competition intensifies. Until those data-room questions are answered, the company is clearly
      investable in principle, but not yet fully underwritten at price in public-only diligence.
    claimRefs: [CV009, CV012, CV013, CV015, CV034, CV043, CV045, CV046, CV047, CV049]
    tableRefs: [TV005, TV006]
    figureRefs: []
  - id: recommendation-summary
    title: Recommendation and evidence assessment
    body: >-
      The recommendation is track with medium confidence, a medium risk rating, and a fair valuation stance. That is more
      constructive than a generic research-more posture because the public record already verifies real scale, profit, and
      product breadth. It is less aggressive than buy because the current mark came from a controlled secondary using a new
      market structure, and because the biggest remaining uncertainties map directly to valuation rather than to peripheral
      details. Put differently, Moneybox has done enough to clear the “is this a real business?” hurdle and much of the “is
      this a high-quality business?” hurdle, but it has not yet cleared the “is this entry price clearly attractive today?”
      hurdle.

      The price discipline conclusion is therefore straightforward. At roughly 7x 2025 revenue, the business does not look
      obviously overvalued versus profitable public UK platforms or versus the operating progress since the £550 million
      2024 mark. But the upside also does not look so asymmetric that investors should ignore cap-table opacity, UK
      concentration, or PISCES-specific execution risk. The call would improve toward buy if management provides audited
      2025 accounts, confirms post-event demand quality, demonstrates sustained 2026 revenue conversion from the H1
      customer and inflow surge, and shows that advice-adjacent monetization can lift long-term unit economics. Absent
      those proofs, watch closely, engage in diligence, and be price-sensitive.
    claimRefs: [CV003, CV004, CV005, CV016, CV019, CV037, CV042, CV043, CV047, CV048, CV049]
    tableRefs: [TV001]
    figureRefs: [FV004]
