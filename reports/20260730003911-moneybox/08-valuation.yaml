  claims:
    - {id: CV001, statement: 'Moneybox said its July 2026 employee secondary would value the business at about £800 million ($1.1 billion) and make up to £45 million of shares available for transaction.', type: company-claimed, topic: valuation, sourceRefs: [SV001, SV004, SV005], confidence: high, freshness: current, answersQuestionRefs: [QV001]}
    - {id: CV002, statement: 'The 2026 mark is about 45% above Moneybox’s 2024 valuation level.', type: observed, topic: valuation, sourceRefs: [SV001, SV003, SV004], confidence: high, freshness: current, answersQuestionRefs: [QV002, QV009]}
    - {id: CV003, statement: 'Moneybox publicly says it supports more than 1.9 million customers and over £23 billion in assets under administration.', type: company-claimed, topic: scale, sourceRefs: [SV001, SV004, SV007], confidence: high, freshness: current, answersQuestionRefs: [QV003]}
    - {id: CV004, statement: 'Moneybox said 2025 revenue exceeded £115 million.', type: company-claimed, topic: revenue, sourceRefs: [SV001, SV005, SV007], confidence: high, freshness: current, answersQuestionRefs: [QV004, QV011]}
    - {id: CV005, statement: 'Moneybox said 2025 was its third consecutive profitable year.', type: company-claimed, topic: profitability, sourceRefs: [SV001, SV004, SV007], confidence: high, freshness: current, answersQuestionRefs: [QV004, QV030]}
    - {id: CV006, statement: 'Moneybox said more than 390,000 new customers joined in the first half of 2026.', type: company-claimed, topic: growth, sourceRefs: [SV001, SV005], confidence: medium, freshness: current, answersQuestionRefs: [QV027]}
    - {id: CV007, statement: 'Moneybox said first-half 2026 net inflows were £3.5 billion.', type: company-claimed, topic: growth, sourceRefs: [SV001, SV005], confidence: medium, freshness: current, answersQuestionRefs: [QV027]}
    - {id: CV008, statement: 'Moneybox’s prior disclosed valuation reference was £550 million in October 2024.', type: observed, topic: valuation-history, sourceRefs: [SV003, SV005], confidence: high, freshness: recent, answersQuestionRefs: [QV009]}
    - {id: CV009, statement: 'The 2024 transaction was mainly facilitated through a secondary share sale and existing investors were expected to sell 10% to 15% of current share capital.', type: observed, topic: liquidity, sourceRefs: [SV003], confidence: medium, freshness: recent, answersQuestionRefs: [QV009, QV010]}
    - {id: CV010, statement: 'Moneybox said its 2024 shareholder base included roughly 35,000 holders with crowdfund, customer, and employee participation.', type: company-claimed, topic: shareholder-base, sourceRefs: [SV003], confidence: medium, freshness: recent, answersQuestionRefs: [QV010]}
    - {id: CV011, statement: 'The 2024 Moneybox announcement said the business had surpassed £10 billion of AUA and scaled revenues by 168% in the prior fiscal year.', type: company-claimed, topic: historical-scale, sourceRefs: [SV003], confidence: medium, freshness: recent, answersQuestionRefs: [QV009]}
    - {id: CV012, statement: 'The FCA describes PISCES as a new type of private stock market where platforms connect buyers and sellers during intermittent trading events.', type: observed, topic: pisces, sourceRefs: [SV008, SV009], confidence: high, freshness: current, answersQuestionRefs: [QV005, QV006]}
    - {id: CV013, statement: 'Under FCA rules, companies using PISCES can control when shares trade, who can buy them, and can set floor or ceiling prices.', type: observed, topic: pisces, sourceRefs: [SV008], confidence: medium, freshness: current, answersQuestionRefs: [QV005, QV006, QV028]}
    - {id: CV014, statement: 'The FCA explicitly says investing in private companies on PISCES may involve extra risks compared with trading in public companies.', type: observed, topic: pisces-risk, sourceRefs: [SV008], confidence: medium, freshness: current, answersQuestionRefs: [QV007, QV028]}
    - {id: CV015, statement: 'The FCA says the PISCES regulatory framework is being tested in a sandbox and Treasury must report to Parliament on outcomes by June 2030.', type: observed, topic: pisces-risk, sourceRefs: [SV008, SV009], confidence: high, freshness: current, answersQuestionRefs: [QV008]}
    - {id: CV016, statement: 'Moneybox’s 2026 unicorn valuation was set via an employee secondary rather than a new primary financing round.', type: observed, topic: valuation-mechanism, sourceRefs: [SV001, SV004, SV005], confidence: high, freshness: current, answersQuestionRefs: [QV005, QV010, QV030]}
    - {id: CV017, statement: 'Independent coverage noted that PISCES pricing lacks long public trading history and may not prove the same price would survive a real fundraise.', type: observed, topic: valuation-risk, sourceRefs: [SV004, SV007], confidence: medium, freshness: current, answersQuestionRefs: [QV007, QV028]}
    - {id: CV018, statement: 'Independent coverage said the £800 million mark is likely to receive close scrutiny because it was set on a nascent platform rather than through competitive new-money bidding.', type: observed, topic: valuation-risk, sourceRefs: [SV006, SV007], confidence: medium, freshness: current, answersQuestionRefs: [QV007]}
    - {id: CV019, statement: 'Using the public £115 million 2025 revenue floor, the £800 million valuation implies roughly 7x revenue.', type: estimated, topic: multiple, sourceRefs: [SV001, SV005], confidence: medium, freshness: current, answersQuestionRefs: [QV011, QV024, QV025, QV030]}
    - {id: CV020, statement: 'Relative to £23 billion of AUA, the current mark equals roughly 3.5% of assets under administration.', type: estimated, topic: multiple, sourceRefs: [SV001], confidence: medium, freshness: current, answersQuestionRefs: [QV012]}
    - {id: CV021, statement: 'Moneybox’s 2024 annual report disclosed £93.8 million of revenue, £19.7 million of profit before tax, and £11.7 billion of AUA.', type: observed, topic: financials, sourceRefs: [SV002], confidence: medium, freshness: recent, answersQuestionRefs: [QV013]}
    - {id: CV022, statement: 'The 2024 annual report disclosed a 97% gross margin, supporting the argument that the platform has software-like gross economics.', type: observed, topic: financials, sourceRefs: [SV002], confidence: medium, freshness: recent, answersQuestionRefs: [QV013]}
    - {id: CV023, statement: 'The 2024 annual report said revenue grew 68% year over year in 2024.', type: observed, topic: growth, sourceRefs: [SV002], confidence: medium, freshness: recent, answersQuestionRefs: [QV013]}
    - {id: CV024, statement: 'Finextra reported JPMorgan’s 2021 Nutmeg acquisition was rumoured at around £700 million.', type: observed, topic: comps, sourceRefs: [SV017], confidence: medium, freshness: recent, answersQuestionRefs: [QV014, QV015]}
    - {id: CV025, statement: 'Finextra said Nutmeg later had about 265,000 users and £8.5 billion of assets under management.', type: observed, topic: comps, sourceRefs: [SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV014, QV015]}
    - {id: CV026, statement: 'Finder described Nutmeg as the UK’s largest digital wealth manager and said it managed more than £4.5 billion for more than 200,000 customers.', type: observed, topic: comps, sourceRefs: [SV019], confidence: medium, freshness: historical, answersQuestionRefs: [QV014]}
    - {id: CV027, statement: 'AJ Bell’s FY25 annual report disclosed £317.8 million of revenue, £137.8 million of profit before tax, £108.2 billion of AUA, and 657,000 customers.', type: observed, topic: comps, sourceRefs: [SV010], confidence: medium, freshness: recent, answersQuestionRefs: [QV016, QV017]}
    - {id: CV028, statement: 'CompaniesMarketCap showed AJ Bell at about $3.12 billion of market capitalization in 2026.', type: observed, topic: comps, sourceRefs: [SV011], confidence: medium, freshness: current, answersQuestionRefs: [QV016, QV017]}
    - {id: CV029, statement: 'CompaniesMarketCap showed Hargreaves Lansdown at a last known market cap of about $7.12 billion before its take-private.', type: observed, topic: comps, sourceRefs: [SV013], confidence: medium, freshness: recent, answersQuestionRefs: [QV018]}
    - {id: CV030, statement: 'Wealthsimple announced a CAD $750 million equity round at a CAD $10 billion post-money valuation in October 2025.', type: observed, topic: comps, sourceRefs: [SV014], confidence: medium, freshness: recent, answersQuestionRefs: [QV019, QV020]}
    - {id: CV031, statement: 'Wealthsimple said it was profitable in 2024 and continued to be profitable in 2025 while reaching $100 billion of AUA.', type: observed, topic: comps, sourceRefs: [SV014], confidence: medium, freshness: recent, answersQuestionRefs: [QV019, QV020]}
    - {id: CV032, statement: 'Wealthsimple said Q1 2026 AUA reached $124.8 billion and clients exceeded 3.4 million.', type: observed, topic: comps, sourceRefs: [SV015], confidence: medium, freshness: current, answersQuestionRefs: [QV020]}
    - {id: CV033, statement: 'Yahoo Finance reported Wealthsimple ended Q2 2026 with $155.6 billion of assets and 3.6 million clients.', type: observed, topic: comps, sourceRefs: [SV016], confidence: medium, freshness: current, answersQuestionRefs: [QV020]}
    - {id: CV034, statement: 'ClickThrough’s 2025 benchmark described UK investment and ISA providers as a highly competitive digital market and said Moneybox had the most Instagram followers among the surveyed brands at 87,300.', type: observed, topic: competition, sourceRefs: [SV020], confidence: medium, freshness: recent, answersQuestionRefs: [QV021]}
    - {id: CV035, statement: 'Moneybox publicly presents investing, pension, Lifetime ISA, Junior ISA, mortgage-linked, and general-investment journeys, supporting a broader life-stage proposition than a simple savings app.', type: observed, topic: products, sourceRefs: [SV024, SV025, SV026, SV027, SV030, SV031], confidence: high, freshness: current, answersQuestionRefs: [QV022]}
    - {id: CV036, statement: 'Finder’s Moneybox review rated the platform highly on account coverage, fees, and ease of use while noting its investment choice is more limited than full-featured platforms.', type: observed, topic: product-perception, sourceRefs: [SV021], confidence: medium, freshness: current, answersQuestionRefs: [QV023]}
    - {id: CV037, statement: 'Relative to AJ Bell, Hargreaves Lansdown, Nutmeg, and Wealthsimple, Moneybox looks more like a fair-valued scaled challenger than an obviously underpriced outlier.', type: inferred, topic: judgment, sourceRefs: [SV001, SV010, SV011, SV013, SV014, SV017], confidence: medium, freshness: current, answersQuestionRefs: [QV016, QV018, QV019, QV030]}
    - {id: CV038, statement: 'Compared with Nutmeg’s reported 2021 sale price, Moneybox’s 2026 mark looks plausible because public scale is now larger, but comparison is muddied by different market cycles and ownership contexts.', type: inferred, topic: judgment, sourceRefs: [SV001, SV017, SV019], confidence: medium, freshness: current, answersQuestionRefs: [QV014, QV015]}
    - {id: CV039, statement: 'A practical base-case valuation range is about £750 million to £900 million using 6.5x to 7.5x on roughly £115 million to £120 million of revenue.', type: estimated, topic: scenarios, sourceRefs: [SV001, SV010, SV011], confidence: medium, freshness: current, answersQuestionRefs: [QV025]}
    - {id: CV040, statement: 'A defensible bear-case range is about £575 million to £690 million if investors use roughly 5x to 6x on the 2025 revenue floor and discount PISCES-derived optimism.', type: estimated, topic: scenarios, sourceRefs: [SV001, SV008, SV010], confidence: medium, freshness: current, answersQuestionRefs: [QV024]}
    - {id: CV041, statement: 'A bull-case range of about £980 million to £1.15 billion is possible if growth converts cleanly and investors pay about 8.5x to 10x revenue for a profitable UK wealth platform.', type: estimated, topic: scenarios, sourceRefs: [SV001, SV014], confidence: medium, freshness: current, answersQuestionRefs: [QV026]}
    - {id: CV042, statement: 'The current £800 million mark sits inside the base-case range and therefore reads as fair rather than clearly attractive or clearly excessive.', type: inferred, topic: verdict, sourceRefs: [SV001, SV010, SV011], confidence: medium, freshness: current, answersQuestionRefs: [QV025, QV030]}
    - {id: CV043, statement: 'The most important unresolved valuation inputs are audited 2025 financials, the preference stack, post-sale clearing evidence, and product-level monetization detail.', type: inferred, topic: diligence, sourceRefs: [SV001, SV008, SV009], confidence: medium, freshness: current, answersQuestionRefs: [QV027, QV030]}
    - {id: CV044, statement: 'Because Moneybox is already profitable and cash-generative at the company level, down-round risk looks lower than for unprofitable consumer fintechs of similar age.', type: inferred, topic: risk-adjustment, sourceRefs: [SV001, SV002, SV003], confidence: medium, freshness: current, answersQuestionRefs: [QV024, QV025]}
