  claims:
    - {id: CU001, statement: Moneybox’s customer base includes beginner investors, cash savers, first-home savers, pension consolidators, and family savers, type: inferred, topic: segments, sourceRefs: [SU001, SU004, SU005, SU006, SU007], confidence: medium, freshness: current, answersQuestionRefs: [QU001]}
    - {id: CU002, statement: These segments are connected by simple app-led wrappers and recurring contribution behavior rather than by enterprise buying roles, type: inferred, topic: segments, sourceRefs: [SU001, SU004, SU005], confidence: medium, freshness: current, answersQuestionRefs: [QU001, QU002]}
    - {id: CU003, statement: In Moneybox’s core market the buyer, user, and payer are usually the same retail household person, type: inferred, topic: segments, sourceRefs: [SU004, SU005, SU006], confidence: medium, freshness: current, answersQuestionRefs: [QU001]}
    - {id: CU004, statement: Product breadth allows one customer segment to expand into another over time, type: inferred, topic: segments, sourceRefs: [SU001, SU004, SU005], confidence: medium, freshness: current, answersQuestionRefs: [QU002]}
    - {id: CU005, statement: Customer concentration should therefore be analyzed through segment and behavior dependence rather than named-account exposure, type: inferred, topic: concentration, sourceRefs: [SU001, SU014], confidence: medium, freshness: current, answersQuestionRefs: [QU002, QU018]}
    - {id: CU006, statement: The first-home saver segment is strategically important because it combines high intent with a concrete milestone, type: inferred, topic: segments, sourceRefs: [SU006, SU001, SU002], confidence: medium, freshness: current, answersQuestionRefs: [QU005, QU013]}
    - {id: CU007, statement: Pension consolidators are strategically important because they can carry higher balances and longer duration, type: inferred, topic: segments, sourceRefs: [SU005, SU001], confidence: high, freshness: current, answersQuestionRefs: [QU006, QU014]}
