        - {id: stage-4, label: Multi-product use, actor: Existing customer, description: 'Customer adds pensions, LISAs, cash products, or Junior ISAs as confidence rises.', channels: ['Cross-sell prompts', 'Product discovery']}
        - {id: stage-5, label: Retention or churn moment, actor: Existing customer, description: 'Service quality, transfers, and rate perception shape whether the relationship deepens or weakens.', channels: ['Support', 'Transfers', 'Rate changes']}
