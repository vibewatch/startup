company:
  name: Moneybox
chapter:
  number: 6
  title: Customers
  summary: >-
    Moneybox’s customer proof is unusually strong for a private consumer fintech: 1.3 million funded customers at the
    end of 2024, more than 1.9 million by July 2026, 94%+ retention, strong app ratings, and outcome proof through
    first-home saving and pension reconnection. The main customer risk is not concentration but execution quality around
    transfers, support speed, and rate-sensitive balance behavior.
sections:
  - id: section-1
    title: Customer segments and why this base is not generic
    body: >-
      Moneybox’s customer base is broad, retail, and increasingly multi-product. Public product and annual-report
      materials point to several segment clusters: beginner investors, cash-first savers, first-home savers using the
      LISA, pension consolidators, and family savers using the Junior ISA. These are not random adjacent personas; they
      all benefit from simple app-led wrappers, recurring contribution behavior, and a low-friction trust experience.
      The company’s strongest customer strength is that many of these segments can expand into one another over time.

      Because the business serves individual retail accounts rather than enterprise contracts, customer concentration risk
      should be analyzed through behavior and mix, not through a top-customer table. That changes the diligence frame:
      the important question is not whether one customer can churn, but whether a few key use cases or acquisition
      surfaces disproportionately drive funded-account growth.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU008]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: section-2
    title: Scale, adoption trajectory, and proof of real usage
    body: >-
      The public growth curve is not just vanity traffic. The annual report recorded 1.3 million customers and 0.4
      million net new customer additions in 2024, while the 2026 support release updated the total to more than 1.9
      million customers, 390,000+ new customers in H1 2026 alone, and £23 billion+ of AUA. That shows not only growing
      reach but also substantive asset concentration inside the platform. More importantly, Moneybox pairs these scale
      numbers with concrete outcomes. The company says it helped more than 120,000 first-home purchases by April 2025,
      over 200,000 customers had saved for their first home by July 2026, and more than £800 million of lost pensions
      had been reunited by the same point.

      Those are important proof points because they show customer activity tied to real financial outcomes, not only app
      sessions or superficial sign-ups. For a consumer finance platform, that is stronger evidence than raw download or
      traffic numbers and materially strengthens the customer-quality narrative for investors overall today.
    claimRefs: [CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU017]
    tableRefs: [TU002, TU003]
    figureRefs: [FU002]
  - id: section-3
    title: Retention, satisfaction, and where friction still shows
    body: >-
      Public satisfaction evidence is strong but not uniform. The annual report says customer retention exceeded 94% in
      2024 and reported an NPS of 89, alongside average ratings of 4.4 on Trustpilot, 4.8 on the App Store, and 4.7 on
      the Play Store. Trustpilot’s overview also emphasizes ease of use and positive service experiences. That is a good
      signal for a retail finance app, especially given the degree of trust required to move savings or pension balances.

      The negative evidence is more specific than the positive evidence. Complaints cluster around transfers, savings-rate
      resets, chatbot or support friction, and difficulty locating key information. That pattern matters because the
      moments when money moves or terms change are exactly the moments when referral quality and retention are most at
      risk. So the customer thesis is positive overall, but it is not immune to operational slippage. The business can
      therefore look strong on aggregate satisfaction while still carrying meaningful hidden operational risk in the very
      journeys that matter most to reputation and wallet retention.
    claimRefs: [CU018, CU019, CU020, CU021, CU022, CU023, CU024, CU025, CU026]
    tableRefs: [TU004]
    figureRefs: [FU003]
  - id: section-4
    title: Depth, concentration, and the real customer diligence question
    body: >-
      The annual report’s 53% rise in AUA per customer to £9,002 in 2024 is one of the most important customer-quality
      signals in the whole public record. It suggests that the average funded relationship is deepening, not just that
      more users are opening tiny starter accounts. Because customer concentration is naturally low in a mass-retail
      model, the more meaningful risk is concentration by segment or behavior. For example, if growth increasingly depends
      on rate-sensitive cash savers or a narrow set of home-buying journeys, then customer quality could be more fragile
      than headline counts imply.

      The right diligence question is therefore how customer cohorts differ by entry product, funding consistency,
      retention, and expansion behavior. Public sources strongly support the existence of large-scale customer demand, but
      they do not yet reveal enough about cohort quality to fully underwrite long-term customer economics.
    claimRefs: [CU027, CU028, CU029, CU030, CU031, CU032, CU033, CU034, CU035]
    tableRefs: [TU005]
    figureRefs: [FU004]
