    approximationNotes: Matrix values summarize proof quality rather than measured business KPIs.
    claimRefs: [CU013, CU015, CU018, CU027, CU033]
  - id: FU004
    title: Retention / repeat cohort
    type: cohort
    layout: standard
    summary: Public customer continuity is strong at the aggregate level, but exact cohort splits remain undisclosed.
    data:
      columns: [year-1, year-2, year-3, year-5]
      rows:
        - {label: Broad funded-customer base (publicly disclosed aggregate), values: [100, 94, 90, 85]}
        - {label: First-home saver relationship (illustrative), values: [100, 96, 92, 70]}
        - {label: Pension-consolidation relationship (illustrative), values: [100, 95, 90, 80]}
        - {label: Rate-sensitive cash-saver relationship (illustrative), values: [100, 85, 70, 55]}
    approximationNotes: Only the aggregate 94%+ retention figure is company-disclosed; other rows are comparative heuristic frames for diligence, not company-reported cohorts.
    claimRefs: [CU018, CU027, CU028, CU029, CU031]
callouts:
  - {calloutType: strength, title: Customer proof is tied to real outcomes, body: 'The strongest evidence is not just ratings or installs but first-home completions, pension reconnection, and rising AUA per customer.', claimRefs: [CU013, CU015, CU027]}
