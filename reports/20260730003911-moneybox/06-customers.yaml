      - ['LISA-driven growth', 'Home-buying demand could be cyclical or policy-sensitive', Medium, 'Request contribution and completion cohorts']
      - ['Pension consolidation', 'Transfer friction could reduce referrals and trust', High, 'Request transfer success and complaints data']
    notes: Customer concentration is best analyzed through segment dependence rather than through named-account exposure.
    claimRefs: [CU027, CU028, CU029, CU030, CU031]
