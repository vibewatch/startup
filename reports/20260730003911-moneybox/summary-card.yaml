  topStrengths:
    - >-
      Verified public scale with more than 1.9 million customers and more than £23 billion of assets under
      administration.
    - >-
      Public annual-report evidence of strong economics, including £93.8 million of 2024 revenue, 97% gross margin, and
      profitability.
    - >-
      Multi-product life-stage proposition spanning ISA, LISA, pension, Junior ISA, general investing, and home-buying
      workflows.
    - >-
      Third consecutive profitable year by 2025 reduces basic survival and down-round risk versus many private fintech
      peers.
    - PISCES-based liquidity event gives a fresh valuation signal without forcing a premature IPO.
  topRisks:
    - The £800 million mark was set in a controlled secondary rather than in a broad competitive primary round.
    - >-
      UK-only concentration leaves valuation exposed to domestic regulation, ISA/LISA policy shifts, and savings-rate
      cycles.
    - Current upside looks moderate because the present mark already prices in meaningful quality and profitability.
    - Cap-table terms, preference overhang, and post-event clearing demand are still private.
    - Trust-sensitive consumer finance models can de-rate quickly if service, cyber, or conduct quality weakens.
  unresolvedGaps:
    - Audited 2025 financial statements are not yet publicly available.
    - Product-level ARPU, revenue mix, and cohort economics are still not disclosed.
    - Post-PISCES buyer mix, clearing depth, and turnover quality remain private.
    - Liquidation preferences, anti-dilution protections, and broader cap-table rights are undisclosed.
    - H2 2026 revenue conversion from strong H1 customer and inflow growth is not yet visible publicly.
