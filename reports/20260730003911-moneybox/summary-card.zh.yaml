  topStrengths:
    - 公开规模已经验证：客户超过 190 万，管理资产超过 £23 billion。
    - 公开年报显示经济性强，包括 2024 年收入 £93.8 million、97% 毛利率和盈利。
    - 多产品、覆盖生命周期的主张横跨 ISA、LISA、养老金、Junior ISA、普通投资和购房流程。
    - 到 2025 年连续第三年盈利，相比许多私营金融科技同业，基本生存风险和 down round 风险更低。
    - 基于 PISCES 的流动性事件给出新的估值信号，又不用被迫提前 IPO。
  topRisks:
    - £800 million 估值来自受控二级交易，而不是广泛竞争的一手融资轮。
    - 业务只集中在英国，估值会暴露在本土监管、ISA/LISA 政策变化和储蓄利率周期下。
    - 当前估值已经计入相当质量和盈利能力，上行空间看起来中等。
    - 股权结构条款、优先权压力和事件后清算需求仍是私有信息。
    - 消费金融模型对信任高度敏感；服务、网络安全或经营行为质量一旦走弱，估值可能快速下修。
  unresolvedGaps:
    - 经审计的 2025 年财务报表尚未公开。
    - 产品级 ARPU、收入结构和 cohort 经济性仍未披露。
    - PISCES 后的买方结构、清算深度和换手质量仍是私有信息。
    - 清算优先权、反稀释保护和更广泛的股权结构权利尚未披露。
    - H1 客户和资金流入强增长能否在 H2 2026 转化为收入，公开层面还看不到。
