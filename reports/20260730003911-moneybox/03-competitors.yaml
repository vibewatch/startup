  claims:
    - {id: CP001, statement: Moneybox competes across guided wealth, savings, pensions, and home-buying journeys rather than a single micro-saving niche, type: inferred, topic: landscape, sourceRefs: [SP001, SP004, SP005, SP006], confidence: medium, freshness: current, answersQuestionRefs: [QP001]}
    - {id: CP002, statement: Nutmeg is the closest managed-investing analogue because it publicly overlaps with Moneybox across ISA, pension, LISA, and JISA wrappers, type: observed, topic: direct-peer, sourceRefs: [SP019, SP021, SP022], confidence: high, freshness: current, answersQuestionRefs: [QP002, QP006]}
    - {id: CP003, statement: Chip is a savings-led challenger that also overlaps with Moneybox on ISA and simple investing propositions, type: observed, topic: challenger, sourceRefs: [SP024, SP025], confidence: medium, freshness: current, answersQuestionRefs: [QP003, QP007]}
    - {id: CP004, statement: Plum competes through smart-money automation and saving behavior rather than through pure wrapper depth, type: observed, topic: challenger, sourceRefs: [SP020, SP023], confidence: medium, freshness: current, answersQuestionRefs: [QP003, QP008]}
    - {id: CP005, statement: Hargreaves Lansdown and AJ Bell are scaled incumbents that compete on trust, breadth, and retirement credibility, type: observed, topic: incumbents, sourceRefs: [SP026, SP027, SP028], confidence: high, freshness: current, answersQuestionRefs: [QP004, QP018]}
    - {id: CP006, statement: Vanguard UK is the clearest low-cost passive-investing benchmark in Moneybox’s comparison set, type: observed, topic: incumbents, sourceRefs: [SP029, SP030, SP031], confidence: high, freshness: current, answersQuestionRefs: [QP004, QP013]}
    - {id: CP007, statement: Trading 212 matters because it competes for younger retail-investor attention even if it is not a strong pension or LISA analogue, type: observed, topic: attention-competitor, sourceRefs: [SP032, SP033], confidence: medium, freshness: current, answersQuestionRefs: [QP005, QP009]}
    - {id: CP008, statement: No single competitor fully matches Moneybox’s mix of savings, investing, pensions, and home-buying positioning, type: inferred, topic: landscape, sourceRefs: [SP002, SP019, SP020, SP025], confidence: medium, freshness: current, answersQuestionRefs: [QP001]}
    - {id: CP009, statement: The competitive map is therefore broader than “other round-up apps”, type: inferred, topic: landscape, sourceRefs: [SP001, SP019, SP025, SP027], confidence: medium, freshness: current, answersQuestionRefs: [QP001]}
    - {id: CP010, statement: Moneybox’s strongest differentiation is the packaging of adjacent wealth jobs inside one guided mobile relationship, type: inferred, topic: differentiation, sourceRefs: [SP001, SP004, SP005, SP006], confidence: medium, freshness: current, answersQuestionRefs: [QP010, QP014]}
    - {id: CP011, statement: Plum publicly emphasizes automation, budgeting, and saving habits more than a full wealth-platform identity, type: observed, topic: differentiation, sourceRefs: [SP020, SP023], confidence: medium, freshness: current, answersQuestionRefs: [QP003, QP008]}
    - {id: CP012, statement: Chip publicly emphasizes savings rates and simple investing from a savings-led entry point, type: observed, topic: differentiation, sourceRefs: [SP024, SP025], confidence: medium, freshness: current, answersQuestionRefs: [QP003, QP007]}
    - {id: CP013, statement: Nutmeg’s public positioning is closer to managed digital wealth than to home-buying or spare-change habits, type: inferred, topic: differentiation, sourceRefs: [SP019, SP021, SP022], confidence: medium, freshness: current, answersQuestionRefs: [QP002, QP010]}
    - {id: CP014, statement: Moneybox’s cross-product progression matters more strategically than any single wrapper parity claim, type: inferred, topic: differentiation, sourceRefs: [SP001, SP004, SP005], confidence: medium, freshness: current, answersQuestionRefs: [QP014, QP015]}
    - {id: CP015, statement: Home-buying relevance through the LISA remains a useful Moneybox differentiator versus many investing-only peers, type: inferred, topic: differentiation, sourceRefs: [SP006, SP019, SP022], confidence: medium, freshness: current, answersQuestionRefs: [QP010]}
    - {id: CP016, statement: Direct stock access gives Moneybox broader product appeal than a pure managed-fund or pure savings app, type: inferred, topic: differentiation, sourceRefs: [SP004, SP016], confidence: medium, freshness: current, answersQuestionRefs: [QP010]}
    - {id: CP017, statement: Consumers who prefer one app for several adjacent financial goals may value Moneybox’s packaging more than the cheapest single-wrapper provider, type: inferred, topic: differentiation, sourceRefs: [SP001, SP016, SP017], confidence: medium, freshness: current, answersQuestionRefs: [QP015]}
    - {id: CP018, statement: Moneybox is better described as a guided mass-market wealth platform than as a robo-adviser or savings-only app, type: inferred, topic: category, sourceRefs: [SP001, SP004, SP005], confidence: medium, freshness: current, answersQuestionRefs: [QP014]}
    - {id: CP019, statement: Moneybox’s Play Store listing discloses a £1 monthly subscription plus a 0.45% annual investment fee on balances, type: observed, topic: pricing, sourceRefs: [SP008, SP016], confidence: medium, freshness: current, answersQuestionRefs: [QP016, QP017]}
    - {id: CP020, statement: Chip publicly advertises a 0.25% platform fee on investing products, type: observed, topic: pricing, sourceRefs: [SP025, SP024], confidence: medium, freshness: current, answersQuestionRefs: [QP012, QP016]}
    - {id: CP021, statement: AJ Bell and Hargreaves Lansdown publish detailed public charges for core investment wrappers, type: observed, topic: pricing, sourceRefs: [SP026, SP027, SP028], confidence: high, freshness: current, answersQuestionRefs: [QP004, QP016]}
    - {id: CP022, statement: Vanguard UK continues to frame itself around low-cost passive-investing access, type: observed, topic: pricing, sourceRefs: [SP029, SP030], confidence: high, freshness: current, answersQuestionRefs: [QP013, QP016]}
    - {id: CP023, statement: Nutmeg benefits from J.P. Morgan ownership and therefore a stronger institutional trust halo than Moneybox, type: inferred, topic: trust, sourceRefs: [SP018, SP019], confidence: medium, freshness: current, answersQuestionRefs: [QP011, QP018]}
    - {id: CP024, statement: Hargreaves Lansdown and AJ Bell retain stronger long-run public-company trust signals than private app-led challengers, type: inferred, topic: trust, sourceRefs: [SP026, SP027], confidence: medium, freshness: current, answersQuestionRefs: [QP018]}
    - {id: CP025, statement: Moneybox’s competitive answer to stronger incumbent trust is a simpler and more approachable customer journey, type: inferred, topic: trust, sourceRefs: [SP001, SP016, SP017], confidence: medium, freshness: current, answersQuestionRefs: [QP014]}
    - {id: CP026, statement: Simplicity is not the same thing as lowest cost, so service quality becomes part of margin defense for Moneybox, type: inferred, topic: trust, sourceRefs: [SP008, SP016, SP024], confidence: medium, freshness: current, answersQuestionRefs: [QP017]}
    - {id: CP027, statement: Self-directed execution apps can intercept future Moneybox users before they choose a guided wealth journey, type: inferred, topic: attention-competitor, sourceRefs: [SP032, SP033], confidence: medium, freshness: current, answersQuestionRefs: [QP009]}
    - {id: CP028, statement: Moneybox has a real but moderate moat supported by product breadth, retention, and lifestyle packaging, type: inferred, topic: moat, sourceRefs: [SP001, SP002], confidence: high, freshness: current, answersQuestionRefs: [QP019, QP024]}
    - {id: CP029, statement: The annual report’s 94%+ retention is evidence that the product relationship is more durable than a novelty app, type: company-claimed, topic: moat, sourceRefs: [SP001, SP002], confidence: high, freshness: historical, answersQuestionRefs: [QP024]}
    - {id: CP030, statement: Moneybox’s competitive position is strongest with first-time and time-poor consumers who value guided breadth, type: inferred, topic: fit, sourceRefs: [SP001, SP016, SP017], confidence: medium, freshness: current, answersQuestionRefs: [QP021]}
    - {id: CP031, statement: The moat is weakened by the portability of wrappers and the ability of consumers to unbundle providers as balances rise, type: inferred, topic: moat, sourceRefs: [SP016, SP026, SP029], confidence: medium, freshness: current, answersQuestionRefs: [QP019, QP022]}
    - {id: CP032, statement: Savings-led rivals can pressure Moneybox whenever consumers optimize around rate rather than around all-in experience, type: inferred, topic: moat, sourceRefs: [SP024, SP025, SP017], confidence: medium, freshness: current, answersQuestionRefs: [QP022, QP025]}
    - {id: CP033, statement: Public negative reviews show that transfer friction and support quality are where trust can erode fastest, type: third-party-reported, topic: service-risk, sourceRefs: [SP009, SP016, SP017], confidence: medium, freshness: current, answersQuestionRefs: [QP020, QP025]}
    - {id: CP034, statement: Competitive durability therefore depends on Moneybox keeping service quality high while broadening product scope, type: inferred, topic: service-risk, sourceRefs: [SP001, SP009, SP016], confidence: medium, freshness: current, answersQuestionRefs: [QP020, QP025]}
    - {id: CP035, statement: The users most likely to defect are fee-sensitive power users or consumers who prioritize direct execution flexibility over guided simplicity, type: inferred, topic: fit, sourceRefs: [SP024, SP026, SP032], confidence: medium, freshness: current, answersQuestionRefs: [QP022, QP025]}
