- id: constraints-conflicts
  title: Adoption constraints and contradictory evidence
  body: >-
    IFR explicitly warns that actual humanoid capabilities in real-world production scenarios remain limited to demonstrators or pilot projects today. The same IFR note says mass adoption as universal humanoid factory helpers or household assistants is not expected in the near or medium term. 36Kr and BigGo both highlight hardware durability constraints such as short dexterous-hand life and the immature supply chain for general humanoids. Morgan Stanley’s upgrade case depends on pilots turning into orders in the second half of 2026, which still leaves timing risk for every new entrant. ChinaBiz Insider argues many embodied-AI startups have only eighteen to twenty-four months of runway, making 2027-2028 a likely elimination window for weaker players. The reviewed unicorn counts also vary by source, with some citing 19 new robotics unicorns, others 22, and others 25, which shows that hype metrics are not perfectly standardized. International security scrutiny of Chinese robots could cap export
    opportunities or delay overseas procurement even if domestic pilots progress well. For Kunlunxing, the most important market constraint is not whether humanoids will matter eventually, but whether the company can translate macro tailwinds into differentiated deployment proof before the capital window tightens. The market analysis therefore supports a large and growing opportunity, but it does not support treating near-term commercialization as solved.
