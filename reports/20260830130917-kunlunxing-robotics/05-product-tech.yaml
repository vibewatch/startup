  - TE003
  figureRefs:
  - FE001
- id: workflow-dependencies
  title: Workflow, deployment, and dependency chain
  body: >-
    A general-purpose embodied-AI workflow typically runs from data collection to model training to robot-body integration to pilot deployment to field support. Kunlunxing’s public materials imply it wants to own more than one layer of that workflow rather than depend entirely on third-party models or integrators. That ambition raises both upside and dependency complexity because full-stack control requires stronger execution across components, simulation, controls, and service. Public peer materials from AgiBot, AimRT, and Unitree show that modern robot programs depend on runtime frameworks, datasets, tooling, and integration surfaces in addition to hardware. Without a Kunlunxing public website or repository, the closest public evidence for this chapter comes from practitioner proxies and competitor disclosures. The company also depends on a maturing supply chain for actuators, dexterous hands, perception systems, and manufacturing partners. 36Kr explicitly notes that the general-humanoid
    hardware supply chain remains foggy, especially for high-wear components. That means technical readiness and supplier readiness cannot be separated cleanly in diligence. A startup can have the right architecture narrative and still fail if the dependency graph matures too slowly.
  claimRefs:
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  tableRefs:
  - TE004
  figureRefs:
  - FE003
- id: trust-safety
  title: Trust, safety, compliance, and developer-signal gaps
  body: >-
    No reviewed public source provides Kunlunxing-specific safety certifications, privacy controls, or quality metrics. No reviewed public source provides a public developer community, documentation hub, or open repository under Kunlunxing’s own name. The absence of a public developer surface is not fatal for a young hardware company, but it does reduce third-party verifiability of progress. Chinese and international standards activity in 2026 shows the compliance bar for humanoid systems is rising rather than falling. OSHA, EU AI Act, and Chinese standard-system materials all imply that deployment readiness increasingly includes governance and safety process readiness. Public peer materials from Unitree and AgiBot show that more mature robotics companies already expose at least some combination of research, developer, or support surfaces. Kunlunxing therefore has a clear evidence gap on trust and quality controls even if its strategic direction is promising. The product-and-technology verdict
    is that the architecture narrative is investable, but the public maturity evidence is still early.
  claimRefs:
  - CE029
  - CE030
  - CE031
  - CE032
