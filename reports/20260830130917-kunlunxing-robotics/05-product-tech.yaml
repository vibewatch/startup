  - TE002
  figureRefs:
  - FE002
- id: architecture
  title: Architecture and differentiation thesis
  body: >-
    36Kr and BigGo both describe a dual-system intelligence architecture centered on a Kunlun World Model. Reviewed reporting says the company believes current robot brains suffer from weak physical causality, poor scene generalization, and black-box decision making. Kunlunxing’s answer is to pair a stronger model stack with algorithm-defined hardware and self-developed key components. The company also says modular general design should lower the threshold for adapting models to different robots. That architecture is directionally consistent with the full-stack strategies visible at AgiBot and other leading embodied-AI teams. AgiBot Research and open ecosystem material show what a more mature full-stack disclosure surface looks like for comparison. Unitree’s SDK and ROS2 tooling show what a more mature controls and developer-surface disclosure looks like for comparison. Kunlunxing’s technical differentiation claim is therefore coherent, but still only partially evidenced in public. The strongest
    technical moat the market sees today is the founders’ prior execution history rather than benchmarked robot performance. As long as no public benchmarks or demos are available, technical diligence remains largely architecture-led rather than performance-led.
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
