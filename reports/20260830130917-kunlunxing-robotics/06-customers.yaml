company:
  name: Kunlunxing Robotics
chapter:
  number: 6
  title: Customers
  summary: >-
    The best-supported early customer path for Kunlunxing is industrial manufacturing, logistics, and possibly policy-backed innovation deployments. Category comparables prove demand exists, but Kunlunxing itself has not yet publicly disclosed named customers or pilots in the reviewed materials. Customer underwriting should stay target-based, not traction-based, until first-account proof emerges.
sections:
- id: customer-definition
  title: Customer definition is clearer than customer proof
  body: >-
    Kunlunxing’s likely first customers are industrial operators, logistics operators, and policy-backed innovation sites rather than consumers. That conclusion follows from the company’s stated industrial-plus-domestic ambition combined with where peer companies are actually landing early deployments. Apptronik publicly names Mercedes-Benz and GXO Logistics as partners, which supports manufacturing and logistics as the practical first beachheads for humanoid vendors. Agility positions Digit for warehouse workflows, reinforcing the same early-customer logic. AgiBot’s public materials show another China path built around industrial and ecosystem deployments rather than a pure household launch. Kunlunxing has not publicly named customers, purchase orders, or pilots in the reviewed source set. The absence of customer proof means the chapter can describe target customers confidently but actual live accounts only cautiously. At the current stage, Kunlunxing is best interpreted as pre-reference-customer
    in public disclosure terms. International safety and product-liability expectations can materially slow enterprise robot buying even when category interest is high, because customers want confidence on workplace risk allocation before scaling deployments.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU031
  tableRefs:
  - TU001
- id: adoption-journey
  title: Adoption journey likely requires high-touch selling and validation
  body: >-
    Humanoid-robot adoption typically begins with technical validation and workflow scoping rather than instant purchase. Prospects then move through pilot design, on-site testing, safety review, integration, and only then to scaled orders. That long cycle favors teams that can combine engineering support with commercial patience. Ren Geng’s enterprise operating background is relevant here because enterprise-grade selling and ecosystem partnership are likely core requirements. Lang Xianpeng’s autonomous-driving background is also relevant because field reliability and system integration matter more than lab demos alone. The journey-map logic mirrors what public peer deployments suggest in warehousing and manufacturing. For Kunlunxing, customer acquisition should be modeled more like capital-equipment enterprise sales than software-led PLG. That implies a small number of design partners can matter disproportionately in the first one to two years. European and other overseas buyers are likely
    to ask tougher AI-governance and safety questions during the sales cycle as formal AI regulation matures, extending proof-of-concept timelines for Chinese robot vendors.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU032
  tableRefs:
  - TU003
  figureRefs:
  - FU001
- id: category-proof-vs-company-proof
  title: Category proof exists, company proof does not yet
  body: >-
    The category has clear evidence that manufacturing and logistics buyers are willing to test humanoid systems. Apptronik and Agility provide the strongest reviewed examples of named customer proof outside China. Chinese peer materials from AgiBot provide additional evidence that local industrial interest is real. But none of those proofs can be automatically assigned to Kunlunxing. Kunlunxing still needs its own first named design partner, pilot, or production site to convert category demand into company-specific demand proof. The strongest current proxy for customer-access potential is the investor and founder network, not a public customer list. That distinction matters because network access can open doors, but only deployment performance turns doors into revenue. Until company-specific proof emerges, customer diligence remains forward-looking rather than confirmatory. Export-control friction and national-security scrutiny can turn a technically successful pilot into a slower commercial
    conversion if customers worry about supply continuity or future policy barriers.
  claimRefs:
  - CU017
  - CU018
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU033
  tableRefs:
  - TU002
  figureRefs:
  - FU004
- id: concentration-retention
  title: Concentration and retention risks are likely to be high early
  body: >-
    Most early-stage robotics companies depend heavily on a handful of lighthouse deployments before broader market adoption. That dynamic creates concentration risk because one delayed pilot can materially change perceived traction. Retention also depends on uptime, integration burden, and continued budget support rather than on simple seat renewal mechanics. If Kunlunxing lands government-backed pilots before broad commercial accounts, concentration and political-exposure risk could rise further. No reviewed public source provides customer retention, NPS, cohort data, or pilot-conversion rates for Kunlunxing. The appropriate conclusion is therefore that early-customer quality matters more than early-customer quantity for the next stage of company proof. A young robot vendor may become overdependent on a small number of lighthouse accounts because each deployment requires scarce engineering attention, making lost pilots disproportionately costly. Government-backed or policy-shaped pilots
    can be helpful for credibility, but they can also create retention risk if procurement logic changes faster than the underlying workflow economics.
  claimRefs:
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU034
  - CU035
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU002
  - FU003
