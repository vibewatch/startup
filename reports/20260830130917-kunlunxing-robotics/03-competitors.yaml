  - TP001
  figureRefs:
  - FP001
- id: global-benchmarks
  title: Global benchmarks define the performance bar
  body: >-
    Figure remains the richest global valuation anchor in the reviewed source set, with Humanoid Index citing roughly US$39 billion of value and BMW pilot deployment context. Apptronik offers a more grounded industrial comparison because Reuters says it raised US$520 million at about a US$5 billion valuation while already naming Mercedes-Benz and GXO Logistics as commercial partners. Agility Robotics is a strong warehouse benchmark because its Digit system is linked to real warehouse and logistics workflows rather than purely conceptual demos. 1X represents the household-robot benchmark, with a consumer-home narrative and over US$125 million of disclosed funding, but still a very different go-to-market path from Kunlunxing’s likely industrial entry. Boston Dynamics remains the performance and reliability benchmark for industrial robotics credibility even if its product mix differs from pure humanoid challengers. Tesla Optimus remains the narrative benchmark because Kunlunxing itself explicitly
    references Tesla as the industry bar for embodied-AI mass production. Compared with these global peers, Kunlunxing has a stronger early fundraising burst than many entrants but weaker public evidence on product maturity and deployments. The practical implication is that Kunlunxing should be compared against both Chinese funding speed and global commercialization proof, not just one side of the market. Any claim that Kunlunxing already belongs in the same operating class as Figure, Apptronik, or Agility would go beyond the public evidence reviewed here.
