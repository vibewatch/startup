- id: capability-comparison
  title: Capability, pricing, and ecosystem comparison
  body: >-
    Unitree has the strongest public pricing transparency among major humanoid vendors in the reviewed source set. Unitree also has the most visible public developer tooling, including GitHub surfaces for SDK and ROS2 workflows. AgiBot discloses more about deployment positioning, manufacturing narrative, and product families than Kunlunxing currently does. Apptronik and Agility disclose clearer customer-use cases tied to logistics and manufacturing than Kunlunxing does in public. Figure and Tesla set the ambition bar for general-purpose embodied AI, but they do not erase the advantage Chinese teams may have in domestic manufacturing ecosystems. Kunlunxing’s public technology narrative of body-plus-brain integration is directionally comparable to the full-stack strategies used by the best-capitalized peers. What is missing is a supportable public record of pricing, unit capability, uptime, or integration tooling specific to Kunlunxing. That gap means buyers and investors must currently underwrite
    Kunlunxing more on inferred future capability than on published performance evidence. The near-term comparison therefore favors peers with more transparent capability disclosures, even if Kunlunxing may close the gap later.
  claimRefs:
