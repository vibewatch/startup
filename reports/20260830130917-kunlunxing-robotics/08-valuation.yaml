  - TV004
  figureRefs:
  - FV003
- id: scenario-logic
  title: Scenario-based valuation is more defensible than point-estimate precision
  body: >-
    A bull case assumes Kunlunxing converts founder quality and early capital into credible prototypes, pilot wins, and a path toward scaled industrial deployments. A base case assumes the company proves enough product readiness to retain financing support but remains pre-scale on revenue through the next twelve to eighteen months. A bear case assumes macro exuberance cools before Kunlunxing produces operating proof, leading to valuation compression despite capable founders. Because no revenue baseline is public, discounted cash flow is not a meaningful primary method today. Comparable-multiple and milestone-based scenario analysis are therefore more appropriate than deterministic intrinsic-valuation models. The strongest current value driver is option value on becoming a category winner inside China’s favored humanoid ecosystem. The biggest current discount driver is the absence of public product, customer, and governance proof. If Kunlunxing begins publishing product pages, prototypes,
    or accessible configuration data, the valuation discount for external opacity should narrow quickly. If peer funding or procurement news weakens while Kunlunxing remains disclosure-light, comparable compression could hit even without company-specific failure. Comparable pages with visible product packaging imply that milestone-based rerating can happen before audited revenue exists, but only when buyers can see credible commercial surfaces.
  claimRefs:
  - CV015
  - CV016
  - CV017
  - CV018
  - CV019
  - CV020
  - CV021
  - CV034
  - CV035
  - CV036
  tableRefs:
  - TV003
  figureRefs:
  - FV002
  - FV005
- id: recommendation
  title: The valuation conclusion is premium but fragile
  body: >-
    On the reviewed evidence, Kunlunxing deserves a premium to generic early-stage robotics startups because the founder pair and investor roster are exceptional. It does not yet deserve to be valued as if commercialization risk were solved. The appropriate framing is that the current valuation reflects unusually valuable execution optionality, not proven economic superiority. Any new investor or partner should insist on milestone-based diligence around prototypes, pilots, org depth, and cash runway before accepting headline marks at face value. The valuation recommendation is therefore constructive but cautious: premium is understandable, further step-up requires proof. If Kunlunxing begins naming customers or publishing technical milestones, re-rating upward could happen quickly; without that proof, downside from sentiment normalization is material. The most important near-term valuation test is whether Kunlunxing can shift the story from who invested and who founded the company to what
    product and customer evidence is independently visible. A constructive investor can accept some narrative premium today while still treating later step-ups as contingent on specific prototypes, pilots, and governance disclosures. The presence of many other well-funded humanoid entrants means opportunity cost is real; capital should flow toward proof density, not just founder prestige. Relative to the richest global peers, Kunlunxing can still look inexpensive on narrative grounds while remaining expensive on evidence grounds, which is why scenario discipline matters so much here.
  claimRefs:
  - CV022
  - CV023
  - CV024
  - CV025
