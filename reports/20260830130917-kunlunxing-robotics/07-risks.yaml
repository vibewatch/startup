  figureRefs:
  - FR003
- id: regulatory-legal-risk
  title: Regulatory, legal, and geopolitical risks
  body: >-
    China’s 2026 humanoid and embodied-AI standard system increases the need for compliance readiness on safety, ethics, and interoperability. OSHA, IEEE, and EU AI Act materials show that the broader global direction is toward stricter operational and safety expectations for advanced AI systems. The U.S. House proposal to ban Chinese-made robots from federal procurement highlights escalating geopolitical scrutiny. That scrutiny may not hurt Kunlunxing’s domestic story immediately, but it could limit export pathways or global partnership options. Because Kunlunxing has no public website or policy portal, there is no public evidence yet of product-safety governance, privacy architecture, or compliance staffing. A regulatory gap can stay invisible in early pilots and become decisive when deployments scale. If the company uses offshore structures or cross-border talent and component flows, additional trade and data-compliance risk could emerge. Safety-governance obligations are likely to become
    more operationally specific as humanoid standards move from framework language to deployment and certification practice. Any mismatch between Chinese domestic standards and Western buyer expectations could force costly product bifurcation for overseas expansion. Export-control policy can also create indirect risk by limiting access to some advanced components or by making foreign customers nervous about long-term supportability.
  claimRefs:
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR035
  - CR036
  - CR037
  tableRefs:
  - TR004
  figureRefs:
  - FR004
- id: people-customer-risk
  title: People, concentration, and commercial risks
  body: >-
    The company is unusually dependent on Ren Geng and Lang Xianpeng for fundraising, hiring, customer access, and technical direction. That key-person concentration is materially higher than in more mature competitors with larger disclosed management benches. No public evidence confirms a diversified customer base, so future customer concentration could also be high. A mismatch between investor expectations and engineering timelines could pressure management into overpromising deployments. In hardware categories, a single failed pilot or safety incident can damage reputation quickly. Because the team was still being assembled in Q2 2026, hiring execution itself is a first-order risk. The risk chapter overall therefore points to a company with high upside but equally high dependency on flawless early execution. Founders who are central to capital formation can become bottlenecks for organizational scaling if too many customer, hiring, and technical decisions remain founder-routed. A single
    poorly controlled pilot could create both safety and reputation damage in a market that is already searching for reasons to separate real leaders from narrative-only entrants. Hiring execution risk is amplified in embodied AI because core autonomy, controls, hardware, and field-operations talent are all scarce and heavily competed for inside China.
  claimRefs:
  - CR024
  - CR025
  - CR026
  - CR027
