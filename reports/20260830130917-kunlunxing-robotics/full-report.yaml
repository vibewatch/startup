      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Premium today is justified by optionality, not proof
            body: >-
              Kunlunxing likely deserves a premium to generic robotics startups, but that premium remains fragile
              because it rests on founders, investors, and macro tailwinds more than disclosed operating data.
            calloutType: insight
            claimRefs:
              - CV005
