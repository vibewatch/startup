  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Chinese direct peers already show more operating proof than Kunlunxing
        blocks:
          - type: paragraph
            body: >-
              Unitree is the clearest China benchmark on price transparency because it publicly markets G1 and H1
              humanoid systems and supports an open developer surface. TechNode and Humanoid Index both place Unitree
              around the US$1.4 billion to US$1.6 billion valuation zone, below the richest global peers but with
              stronger public product proof. AgiBot is the strongest disclosed China benchmark on deployment scale
              because it publicized large cumulative shipments and factory activity before mid-2026. AgiBot’s APC 2026
              materials and Humanoid Index profile position the company as a full-stack embodied-AI competitor spanning
              products, models, and manufacturing. 36Kr, KuCoin, and the investor-landscape pieces place Kunlunxing in
              the same fast-rising unicorn wave as Galaxea, Astribot, TARS, and Sudo AI. Those peer companies matter
              because they are competing for the same pools of capital, engineering talent, pilot sites, and narrative
              attention. Kunlunxing’s differentiator is not public shipment or public pricing yet, but the perceived
              quality of its founder-market fit and operating pedigree. That founder-led advantage is durable only if it
              converts into product readiness before Chinese incumbents lock in more supply-chain and customer
              relationships. In short, Chinese peer competition is already intense enough that team prestige alone is
              unlikely to remain a moat for long. Kunlunxing enters a market where several rivals already have stronger
              public proof on either price, scale, or deployments.
            claimRefs:
              - CP001
              - CP002
              - CP003
