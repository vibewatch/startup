      - number: '1.3'
        title: Funding history, investors, and ownership posture
        blocks:
          - type: paragraph
            body: >-
              Reviewed coverage consistently says Kunlunxing completed three funding rounds within roughly ninety days
              of formation, reaching a cumulative financing scale described as several billion yuan. The angel round is
              publicly tied to March 2026 and included Hillhouse-related GL Ventures among early backers. A pre-A round
              followed in March 2026 as investors doubled down before the company had released a product or customer
              list. The A round is consistently dated to 2026-05-02 and public sources say Bain Capital and Gaorong
              Ventures were among the lead investors. Investor lists across 36Kr, PEDaily, Baike, and Qichacha include
              GL Ventures, Gaorong, CAS Star, C&D Capital, Eastern Bell Capital, Huaye Capital, Sinovation Ventures, and
              Heart Capital. Qichacha shows a cap table with more than a dozen shareholder vehicles, including domestic
              funds, offshore holding structures, and founder-linked entities. 36Kr says every investor in the first
              round continued to increase exposure across all three early rounds, which is a strong signal of capital
              concentration behind a single team-level thesis. Multiple reviewed sources say the valuation crossed the
              US$1 billion unicorn threshold within days or weeks of registration and may have exceeded RMB 10 billion
              within the first ninety days. Public materials do not disclose exact round sizes, liquidation preferences,
              debt lines, or secondary transactions, so the headline fundraising velocity is better supported than the
              detailed economics of the financing stack. The presence of both financial investors and industrial capital
              suggests that Kunlunxing is being funded not only as a software thesis but as a capital-intensive hardware
              and manufacturing program.
