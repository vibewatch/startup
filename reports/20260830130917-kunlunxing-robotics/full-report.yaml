companyProfile:
  summary: >-
    Kunlunxing Robotics (Beijing Kunlunxing Robotics Technology Co., Ltd., 昆仑行机器人) is a Beijing-based embodied-AI
    startup formed in March 2026. Public reporting and registry evidence present the company as a full-stack humanoid
    robotics entrant pursuing industrial and future domestic use cases through a dual-drive body-plus-brain strategy
    centered on general embodied intelligence. The company stands out because Ren Geng brings rare China enterprise
    operating credibility from Alibaba Group and Alibaba Cloud while co-founder Lang Xianpeng brings autonomous-driving
    and intelligent-systems execution experience from Li Auto. Public evidence is unusually strong on capital formation
    and unusually weak on shipped product, customers, and economics.
