  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Kunlunxing competes inside the embodied AI and humanoid robotics market rather than the broader
              industrial-automation market as a whole. That market boundary includes general-purpose mobile manipulators
              and humanoids for industrial, logistics, service, and eventually domestic tasks. The boundary excludes
              traditional fixed-function industrial arms when they are not combined with embodied intelligence,
              mobility, or general-purpose control. Goldman Sachs estimates the global humanoid-robot market could reach
              at least US$6 billion over the next ten to fifteen years and as much as US$154 billion in a blue-sky 2035
              scenario. China-focused analyst commentary cited by ChinaBiz Insider says Morgan Stanley raised its 2026
              China humanoid shipment forecast to 50,000 units and a US$2 billion market, scaling to US$15 billion by
              2030. MarketsandMarkets publishes a narrower forecast lens centered on hardware-revenue opportunity rather
              than broader labor-displacement value. The reviewed market sources therefore support a wide spread between
              conservative commercialization cases and long-duration platform-optionality cases. SOC Robotics and other
              market commentators emphasize that cost, dexterity, and deployment reliability still separate the
              addressable market from the realistic near-term obtainable market. For Kunlunxing specifically, the
              practical serviceable market is best viewed as China industrial and logistics deployments first, with
              domestic-service optionality as a later call option. Sizing the company only with a single generic TAM
              number would overstate what a five-month-old company can actually pursue by 2026 or 2027.
