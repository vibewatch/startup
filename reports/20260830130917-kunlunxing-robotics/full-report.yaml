      - number: '8.2'
        title: Comparables argue for a wide but not unlimited valuation range
        blocks:
          - type: paragraph
            body: >-
              Figure’s valuation shows what the market pays for category leadership, brand heat, and perceived frontier
              capability. Apptronik’s roughly US$5 billion valuation after a major financing round shows what investors
              may pay for a company with clearer customer proof but less narrative extremity than Figure. Agility and
              Unitree provide mid-range valuation anchors that combine stronger operating evidence with more restrained
              pricing than the hottest frontier names. 1X provides a lower valuation anchor for a home-robot narrative
              that still carries large commercialization risk. Against those benchmarks, Kunlunxing’s reported >US$1
              billion to ~RMB 10 billion range is not absurd for the category, but it is aggressive for a company
              without public deployment proof. A reasonable comparable framework should therefore reward founder quality
              and capital access while discounting the lack of customer and product transparency. The most credible peer
              set is not a single China-only or US-only group, but a blended set of China industrializing peers and
              global commercialization benchmarks. Unitree's public shop and store pages strengthen the case that
              valuation should reflect not only funding heat but also visible commercialization surfaces such as pricing
              and product accessibility. AGIBOT product pages likewise show how a peer can support valuation through
              concrete SKU visibility even before full financial disclosure appears. TechCrunch coverage of 1X financing
              highlights that even heavily followed humanoid companies still trade on future consumer or platform
              optionality rather than on mature revenue disclosure. TechCrunch reporting on Amazon and Digit is relevant
              because named enterprise testing can justify higher valuation credibility than concept-stage narratives
              alone.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
