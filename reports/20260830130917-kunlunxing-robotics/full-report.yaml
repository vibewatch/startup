              understood as being in architecture-definition and team-assembly mode than in mature product-catalog mode.
              That immaturity does not invalidate the thesis, but it means the evidence base is stronger on design
              direction than on delivered capability. Compared with public peer pages, Kunlunxing is still pre-catalog
