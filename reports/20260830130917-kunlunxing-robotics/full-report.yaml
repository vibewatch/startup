      - number: '2.2'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The clearest near-term buyer segments are automotive, electronics, battery, and general manufacturing
              operators trying to automate repetitive but variable tasks. Warehouse and logistics operators are a second
              core segment because embodied systems can address picking, movement, and exception handling in
              environments built for humans. Public-service and research users form a third segment because they often
              adopt earlier than households and can absorb higher pilot costs. Long-term domestic use remains part of
              the strategic narrative for embodied AI but not the most supportable near-term revenue pool for
              Kunlunxing. In factory settings, the buyer is usually a plant or operations executive, the user is line
              labor or maintenance staff, and the payer is the capital-equipment or automation budget owner. In
              logistics, the economic buyer is typically a warehouse operations leader or COO-level sponsor whose budget
              tolerance depends on uptime and payback period. For local-government or public pilots, the payer may be a
              policy-backed fund or park operator rather than a commercial plant manager. The adoption path is therefore
              multi-stakeholder and slower than software procurement because safety, integration, and workflow redesign
              all require sign-off. These buyer dynamics favor companies that can pair hardware credibility with
              systems-integration capability, which is one reason investors highlight Kunlunxing’s commercialization
              pedigree.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
