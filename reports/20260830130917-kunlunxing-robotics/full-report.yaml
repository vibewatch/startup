        title: Kunlunxing already prices into the top decile of startup ambition
        blocks:
          - type: paragraph
            body: >-
              Multiple reviewed sources say Kunlunxing crossed the unicorn threshold in days or weeks and may have
              exceeded RMB 10 billion within ninety days. That valuation pace is extraordinary even in the context of
              China’s 2026 embodied-AI boom. Humanoid Index and Reuters-linked sources show that peer valuations span
              from the low single-digit billions for commercializing entrants to nearly US$39 billion for Figure.
              Unitree, Apptronik, Agility, and 1X provide a useful spread of valuation anchors across product maturity
              and go-to-market style. Kunlunxing therefore sits in a pricing zone where investors are already
              underwriting unusually strong future execution. The public evidence does not yet show corresponding public
              proof on revenue or deployments, which makes the current value primarily option-like. Valuation context
              supports premium expectations, not confirmation that those expectations are de-risked. Yiou and similar
              China startup profiles reinforce that Kunlunxing's valuation story is being framed around founder pedigree
              and financing speed rather than around disclosed operating metrics. Public product pages from peers matter
              to valuation because they reduce some uncertainty around what customers can actually buy, which Kunlunxing
              has not yet done publicly.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV028
              - CV029
