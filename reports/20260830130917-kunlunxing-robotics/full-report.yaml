              - CV020
              - CV025
      - number: '8.3'
        title: Scenario-based valuation is more defensible than point-estimate precision
        blocks:
          - type: paragraph
            body: >-
              A bull case assumes Kunlunxing converts founder quality and early capital into credible prototypes, pilot
              wins, and a path toward scaled industrial deployments. A base case assumes the company proves enough
              product readiness to retain financing support but remains pre-scale on revenue through the next twelve to
              eighteen months. A bear case assumes macro exuberance cools before Kunlunxing produces operating proof,
              leading to valuation compression despite capable founders. Because no revenue baseline is public,
              discounted cash flow is not a meaningful primary method today. Comparable-multiple and milestone-based
              scenario analysis are therefore more appropriate than deterministic intrinsic-valuation models. The
              strongest current value driver is option value on becoming a category winner inside China’s favored
              humanoid ecosystem. The biggest current discount driver is the absence of public product, customer, and
              governance proof. If Kunlunxing begins publishing product pages, prototypes, or accessible configuration
              data, the valuation discount for external opacity should narrow quickly. If peer funding or procurement
              news weakens while Kunlunxing remains disclosure-light, comparable compression could hit even without
              company-specific failure. Comparable pages with visible product packaging imply that milestone-based
              rerating can happen before audited revenue exists, but only when buyers can see credible commercial
              surfaces.
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
