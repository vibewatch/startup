            body: >-
              Kunlunxing is only months old, so its public operating record is too short to prove that its full-stack
              humanoid roadmap can execute on schedule. No reviewed public source confirms a shipped robot, a
              benchmarked prototype, or field-tested reliability metrics for Kunlunxing. The general-humanoid hardware
              supply chain remains immature, especially for wear-heavy dexterous-hand components according to 36Kr. IFR
              says actual humanoid capabilities in real-world production are still limited to pilots and demonstrations.
              That means Kunlunxing faces both company-specific execution risk and category-level readiness risk at the
              same time. A body-plus-brain strategy increases upside but also raises integration complexity because both
              cognition and hardware must improve together. The absence of a public product catalog or technical
              benchmark surface makes it harder for outsiders to validate progress independently. If engineering
              milestones slip, the market may quickly reinterpret the company from fast-rising leader to overfunded
              concept. A lack of public benchmark data makes schedule slip risk harder to detect early, because
              outsiders cannot compare planned milestones with measurable robot capability deltas over time. If
              Kunlunxing chooses to own too many stack layers simultaneously, management complexity itself becomes a
