            body: >-
              A general-purpose embodied-AI workflow typically runs from data collection to model training to robot-body
              integration to pilot deployment to field support. Kunlunxing’s public materials imply it wants to own more
              than one layer of that workflow rather than depend entirely on third-party models or integrators. That
              ambition raises both upside and dependency complexity because full-stack control requires stronger
              execution across components, simulation, controls, and service. Public peer materials from AgiBot, AimRT,
              and Unitree show that modern robot programs depend on runtime frameworks, datasets, tooling, and
              integration surfaces in addition to hardware. Without a Kunlunxing public website or repository, the
              closest public evidence for this chapter comes from practitioner proxies and competitor disclosures. The
              company also depends on a maturing supply chain for actuators, dexterous hands, perception systems, and
              manufacturing partners. 36Kr explicitly notes that the general-humanoid hardware supply chain remains
              foggy, especially for high-wear components. That means technical readiness and supplier readiness cannot
              be separated cleanly in diligence. A startup can have the right architecture narrative and still fail if
