      - number: '1.2'
        title: Founders, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Ren Geng is described across 36Kr, PEDaily, and BigGo as the founder and CEO, with prior senior leadership
              roles at Alibaba Group and Alibaba Cloud China plus earlier experience at Huawei and ENN. Lang Xianpeng is
              described as co-founder and technical leader after previously building Li Auto’s intelligent-driving
              organization from scratch and leading scaled assisted-driving delivery. The founder pairing is repeatedly
              framed by investors as unusually complementary because Ren Geng is associated with commercialization and
              operating systems while Lang Xianpeng is associated with autonomous-driving engineering and deployment.
              Reviewed articles say the broader founding team pulls from Huawei, Alibaba, and Li Auto, but none of the
              public sources publish a complete executive roster or department-by-department headcount. Qichacha shows a
              concentrated cap table with Ren Geng as the largest disclosed natural-person stakeholder and Lang as part
              of the core personnel set, reinforcing key-person dependence at the current stage. Baidu Baike adds names
              such as Fang Chunzheng, Xin Wang, and Ma Junjie to the director-level roster, but public biographies and
              precise role scopes for those individuals remain thin. No reviewed source discloses independent directors,
              formal audit structures, or separation between founder control and board oversight. The team was still
              described as not fully assembled during the first half of 2026, which means execution capacity was being
              built concurrently with fundraising and strategy formation. Leadership concentration is materially high
              because the technical roadmap, fundraising credibility, and commercial narrative all depend on the
              founders’ reputations more than on shipped product proof.
