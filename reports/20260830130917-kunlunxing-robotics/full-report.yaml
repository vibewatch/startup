              - CV034
      - number: '8.4'
        title: The valuation conclusion is premium but fragile
        blocks:
          - type: paragraph
            body: >-
              On the reviewed evidence, Kunlunxing deserves a premium to generic early-stage robotics startups because
              the founder pair and investor roster are exceptional. It does not yet deserve to be valued as if
              commercialization risk were solved. The appropriate framing is that the current valuation reflects
              unusually valuable execution optionality, not proven economic superiority. Any new investor or partner
              should insist on milestone-based diligence around prototypes, pilots, org depth, and cash runway before
              accepting headline marks at face value. The valuation recommendation is therefore constructive but
              cautious: premium is understandable, further step-up requires proof. If Kunlunxing begins naming customers
              or publishing technical milestones, re-rating upward could happen quickly; without that proof, downside
              from sentiment normalization is material. The most important near-term valuation test is whether
              Kunlunxing can shift the story from who invested and who founded the company to what product and customer
              evidence is independently visible. A constructive investor can accept some narrative premium today while
              still treating later step-ups as contingent on specific prototypes, pilots, and governance disclosures.
              The presence of many other well-funded humanoid entrants means opportunity cost is real; capital should
              flow toward proof density, not just founder prestige. Relative to the richest global peers, Kunlunxing can
              still look inexpensive on narrative grounds while remaining expensive on evidence grounds, which is why
              scenario discipline matters so much here.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
