              scenarios. The company’s product promise is therefore broader than a single arm, single actuator, or
              software-only brain layer. Reviewed sources say Kunlunxing intends to build general humanoid robots rather
              than only sell enabling components. No public source reviewed here publishes a Kunlunxing SKU sheet,
              payload specification, battery life, or degrees-of-freedom table. No public source reviewed here confirms
