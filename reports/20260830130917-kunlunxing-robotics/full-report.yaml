      - number: '2.3'
        title: Policy and structural demand drivers
        blocks:
          - type: paragraph
            body: >-
              IFR says China placed robotics at the heart of its 15th Five-Year Plan and is shifting AI effort toward
              physical-world applications. SCIO and People.cn reporting say China released its first national standard
              system for humanoid robotics and embodied AI in 2026. The standard system spans basic commonality,
              intelligent computing, limbs and components, complete systems, applications, and safety and ethics.
              China’s policy posture matters because it turns embodied AI from a research curiosity into a sector with
              procurement, standardization, and local-cluster support. China already had an operational stock of around
              two million industrial robots according to IFR, giving humanoid entrants a manufacturing ecosystem to
              build on. CGTN’s IDC-cited coverage says China led the global humanoid rise in 2025, reinforcing domestic
              supply depth and engineering momentum. The 2026 capital surge across 322 deals and more than twenty
              unicorns further lowered financing friction for ambitious robot programs. For Kunlunxing, these macro
              drivers mean the market is not just large in theory but politically prioritized inside China. At the same
              time, policy acceleration raises expectations that startups will show real deployments rather than rely
              indefinitely on vision narratives.
            claimRefs:
