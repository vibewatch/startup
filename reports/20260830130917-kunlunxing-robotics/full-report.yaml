    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and legal footprint
        blocks:
          - type: paragraph
            body: >-
              Kunlunxing Robotics is presented in reviewed public sources as a Beijing-based embodied AI and robotics
              startup focused on general-purpose humanoid robots and related embodied intelligence systems. Qichacha
              lists the legal entity as Beijing Kunlunxing Robotics Technology Co., Ltd. with a registration address
              inside the Beijing Economic-Technological Development Area in Tongzhou. Qichacha records Ren Geng as legal
              representative and chair-level operating principal of the company. Public source descriptions consistently
              say the company follows a dual-drive strategy that combines the robot body with the robot brain rather
              than pursuing software-only embodied AI. The reviewed business scope includes intelligent robot research
              and sales, industrial robot manufacturing and sales, software development, system integration, and AI
              application software development. The company has no official public website in the reviewed source set,
              which leaves product detail, recruitment scale, and policy disclosures dependent on third-party reporting
              and registry surfaces. Reviewed sources frame Kunlunxing as a full-stack entrant that wants to benchmark
              against Tesla Optimus rather than a narrow component supplier. Public materials consistently place the
              headquarters footprint in Beijing E-Town even when shorthand descriptions alternately use Yizhuang,
              Tongzhou, or Daxing labels for the administrative area. As of the run date, Kunlunxing remains a private
              company with sparse direct disclosure and no published board charter, privacy policy, or investor
              presentation in the reviewed materials.
