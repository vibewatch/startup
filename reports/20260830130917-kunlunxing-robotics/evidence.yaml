evidenceGaps:
  - type: missing-source
    severity: material
    topic: round sizing
    missingEvidence: >-
      Exact round-by-round financing amounts, post-money valuations, and ownership dilution across angel, pre-A, and A
      rounds.
    whyItMatters: >-
      Round size and ownership determine whether the unicorn narrative reflects durable financing support or simply
      headline valuation optics.
    diligencePath: Request signed term sheets, cap table history, and board-approved financing records for each round.
    relatedQuestionRefs:
      - QO022
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: Current headcount, functional staffing mix, and hiring plan by R&D, manufacturing, and commercialization.
    whyItMatters: >-
      A full-stack humanoid strategy cannot be judged without knowing whether the organization has enough depth to
      execute.
    diligencePath: Request org chart, payroll summary, and active requisition list.
    relatedQuestionRefs:
      - QO023
  - type: missing-source
    severity: material
    topic: product milestone
    missingEvidence: Prototype status, demo videos, pilot-site evidence, and engineering milestone tracker.
    whyItMatters: Operating proof is the main missing bridge between founder quality and valuation.
    diligencePath: Request engineering roadmap, demo footage, and pilot LOIs or test reports.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Board composition, reserved matters, and voting/control rights.
    whyItMatters: Governance structure affects downside protection and future financing flexibility.
    diligencePath: Request board consents, shareholder agreement, and current governance matrix.
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: material
    topic: leadership table coverage gap
    missingEvidence: A full executive roster, deputy leaders, and documented governance structure are not publicly available.
    whyItMatters: >-
      Leadership concentration and succession readiness cannot be judged from only the publicly named founders and
      directors.
    diligencePath: Request a current org chart, board list, and leadership biographies for the full senior team.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: investor map coverage gap
    missingEvidence: >-
      Public reporting names major investors, but exact ownership percentages, preferences, and board rights remain
      incomplete.
    whyItMatters: Cap-table nuance changes control, dilution, and downside protection analysis.
    diligencePath: Request a fully diluted cap table, shareholder agreement, and financing terms schedule.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: milestone table coverage gap
    missingEvidence: Public sources disclose financing dates more clearly than product, customer, or factory milestones.
    whyItMatters: The milestone profile matters because valuation currently runs ahead of operating proof.
    diligencePath: Request milestone tracker, prototype calendar, and pilot roadmap with dated deliverables.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: roi workflow
    missingEvidence: Task-level ROI data by workflow such as picking, material handling, quality inspection, or line tending.
    whyItMatters: Kunlunxing's obtainable market depends more on workflow economics than on abstract robot counts.
    diligencePath: Review pilot ROI dashboards, time-motion studies, and customer payback analyses from comparable deployments.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: shipment mix
    missingEvidence: Published shipment mix by robot form factor and capability tier.
    whyItMatters: Headline unit forecasts can overstate the addressable market for full general-purpose systems.
    diligencePath: Request analyst note appendices or vendor shipment breakouts by form factor.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: material
    topic: consumer timing
    missingEvidence: Consumer pilot, pricing, and serviceability evidence specific to home-use embodied systems in China.
    whyItMatters: A mistimed push into home robotics could burn capital before industrial proof is secure.
    diligencePath: Evaluate home-robot comparables, service-cost assumptions, and willingness-to-pay research.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: bubble risk
    missingEvidence: Cross-company evidence on paid deployments, revenue, and follow-on financing quality.
    whyItMatters: Market exuberance can distort valuation discipline and go-to-market expectations.
    diligencePath: Benchmark peer revenue proof, backlog, and down-round risk across the unicorn cohort.
    relatedQuestionRefs:
