      - number: '1.2'
        title: 创始人、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              36Kr、PEDaily 和 BigGo 均将 Ren Geng 描述为创始人兼 CEO，其此前在 Alibaba Group 和 Alibaba Cloud 中国区担任过高级管理岗位，并有 Huawei 与
              ENN 早期经历。Lang Xianpeng 被描述为联合创始人兼技术负责人，此前从零搭建 Li Auto 智能驾驶组织，并主导辅助驾驶规模化交付。投资人反复把这组创始人搭档描述为罕见互补：Ren Geng
              对应商业化和运营体系，Lang Xianpeng 对应自动驾驶工程和部署。已审阅文章称，更广义的创始团队来自 Huawei、Alibaba 和 Li
              Auto，但没有公开来源给出完整高管名单或按部门拆分的员工数。Qichacha 显示股权结构集中，Ren Geng 是披露中持股最高的自然人股东，Lang
              属于核心人员之一，强化了公司当前阶段的关键人依赖。Baidu Baike 还把 Fang Chunzheng、Xin Wang、Ma Junjie
              等名字列入董事级名单，但这些人的公开履历和精确职责边界仍然单薄。没有已审阅来源披露独立董事、正式审计结构，或创始人控制与董事会监督之间的隔离。2026
              年上半年，团队仍被描述为尚未完全组建，这意味着执行能力是在融资和战略成型的同时搭建起来的。领导层集中度实质上很高，因为技术路线、融资可信度和商业叙事都更多依赖创始人声誉，而不是已交付产品证明。
