    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义和成熟度目前主要停留在叙事层
        blocks:
          - type: paragraph
            body: >-
              Kunlunxing 公开把自己定义为面向工业和家庭场景的通用具身 AI 机器人公司。因此，公司的产品承诺比单一机械臂、单一致动器或纯软件大脑层更宽。已审阅来源称，Kunlunxing
              打算打造通用人形机器人，而不是只出售使能部件。此处审阅的公开来源没有发布 Kunlunxing SKU 表、载荷规格、续航或自由度表。此处审阅的公开来源也没有确认 Kunlunxing
              自身已经交付开发者套件、API
              界面或集成控制台。比起成熟产品目录阶段，公司更适合被理解为处在架构定义和团队搭建阶段。这种不成熟并不推翻投资逻辑，但意味着证据基础在设计方向上强于已交付能力。与公开同行页面相比，Kunlunxing
              对外展示仍处于产品目录前阶段。因此，今天的产品尽调先从公司声称想要打造什么开始，而不是从它已经商业化什么开始。
