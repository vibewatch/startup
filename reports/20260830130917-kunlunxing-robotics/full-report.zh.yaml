      - number: '8.3'
        title: 基于情景的估值比精确点估值更站得住
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设 Kunlunxing 把创始人质量和早期资本转化为可信原型、试点胜利，以及走向规模化工业部署的路径。 基准情景假设公司证明足够的产品就绪度，从而留住融资支持，但未来 12 到 18
              个月收入仍未放量。悲观情景假设 宏观热度在 Kunlunxing 拿出运营证据前降温，即便创始人能力不差，估值也会压缩。没有公开收入基线，折现现金流
              今天不能作为主要方法。可比倍数和基于里程碑的情景分析，比确定性的内在价值模型更合适。当前最强价值驱动，是押注公司
              在中国受政策青睐的人形机器人生态中成为品类赢家的期权价值。当前最大折价因素，是缺少公开产品、客户和治理证明。 若 Kunlunxing
              开始发布产品页、原型或可访问的配置数据，外部不透明带来的估值折价应会迅速收窄。若同业融资或采购新闻转弱， 而 Kunlunxing
              仍轻披露，即使公司本身没有失败，可比压缩也可能打到估值。带有可见产品包装的可比页面说明，基于里程碑的重估 可以先于审计收入发生，但前提是买方能看到可信商业化界面。
            claimRefs:
