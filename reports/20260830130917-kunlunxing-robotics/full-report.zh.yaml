      - number: '1.3'
        title: 融资历史、投资人和所有权姿态
        blocks:
          - type: paragraph
            body: >-
              已审阅报道一致称，Kunlunxing 在成立后约九十天内完成三轮融资，累计融资规模被描述为数十亿元人民币级。天使轮公开对应 2026 年 3 月，早期支持者包括 Hillhouse 相关的 GL
              Ventures。pre-A 轮同样发生在 2026 年 3 月，投资人在公司尚未发布产品或客户名单前继续加码。A 轮日期在公开来源中一致为 2026-05-02，资料称 Bain Capital 和
              Gaorong Ventures 等机构为领投方。36Kr、PEDaily、Baike 和 Qichacha 的投资人名单包括 GL Ventures、Gaorong、CAS Star、C&D
              Capital、Eastern Bell Capital、Huaye Capital、Sinovation Ventures 和 Heart Capital。Qichacha
              显示股权结构中有十多个股东载体，包括境内基金、离岸持股结构和创始人关联实体。36Kr
              称首轮每一家投资人都在三轮早期融资中持续增加敞口，这是资本集中押注单一团队级命题的强信号。多家已审阅来源称，公司估值在注册后数天或数周内跨过 US$1 billion 独角兽门槛，并且可能在最初九十天内超过
              RMB 10 billion。公开材料没有披露各轮精确金额、清算优先权、债务额度或老股交易，因此融资速度这个头条更有支撑，融资堆叠的具体经济条款则支撑较弱。财务投资人和产业资本同时出现，说明 Kunlunxing
              获得融资并不只是因为软件命题，也因为它被视为资本密集型硬件与制造项目。
