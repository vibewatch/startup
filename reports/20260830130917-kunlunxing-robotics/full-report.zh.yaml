      - number: '2.3'
        title: 政策和结构性需求驱动
        blocks:
          - type: paragraph
            body: >-
              IFR 称，中国把机器人置于第 15 个五年规划的核心位置，并把 AI 投入转向物理世界应用。SCIO 和 People.cn 的报道称，中国在 2026 年发布了首个人形机器人与具身 AI
              国家标准体系。该标准体系覆盖基础共性、智能计算、肢体与部件、整机、应用，以及安全和伦理。中国的政策姿态很重要，因为它把具身 AI 从研究兴趣点变成一个拥有采购、标准化和地方产业集群支持的行业。根据
              IFR，中国已有约 200 万台工业机器人在运行，为人形机器人新入局者提供了可依托的制造生态。CGTN 引用 IDC 的报道称，中国在 2025
              年领跑全球人形机器人崛起，进一步强化了国内供应深度和工程动能。2026 年，322 笔交易和超过 20 家独角兽的资本热潮进一步降低了雄心勃勃机器人项目的融资摩擦。对 Kunlunxing
              来说，这些宏观驱动意味着市场不只是理论上很大，也在中国内部被政策优先支持。与此同时，政策加速也提高了市场预期：创业公司需要拿出真实部署，而不是长期依赖愿景叙事。
