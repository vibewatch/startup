  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 中国直接同行已经展示出比 Kunlunxing 更多运营证明
        blocks:
          - type: paragraph
            body: >-
              Unitree 是中国市场最清晰的价格透明度参照，因为它公开销售 G1 和 H1 人形机器人系统，并支持开放开发者界面。TechNode 和 Humanoid Index 都把 Unitree 放在 US$1.4
              billion 到 US$1.6 billion 的估值区间，低于最贵的全球同行，但公开产品证明更强。AgiBot 是中国披露中部署规模最强的参照，因为它在 2026
              年中以前已公开大规模累计出货和工厂活动。AgiBot 的 APC 2026 材料和 Humanoid Index 资料把公司定位为覆盖产品、模型和制造的全栈具身 AI 竞争者。36Kr、KuCoin
              和投资人格局文章把 Kunlunxing 与 Galaxea、Astribot、TARS、Sudo AI
              放在同一波快速崛起的独角兽浪潮中。这些同行重要，因为它们争夺同一批资本、工程人才、试点场地和叙事注意力。Kunlunxing
              的差异化现在还不是公开出货或公开定价，而是市场感知中的创始人与市场匹配质量及运营履历。只有在中国既有玩家锁定更多供应链和客户关系之前，把这一创始人优势转化为产品就绪度，这种优势才算耐久。简言之，中国同行竞争已经足够激烈，团队光环不太可能长期充当护城河。Kunlunxing
              进入的市场中，已有多家竞争对手在价格、规模或部署至少一个维度上拥有更强公开证明。
