              公司谈论工厂部署、平台层和商业支持的方式一致。官方同行页面显示，硬件项目往往会先披露标价，再披露真实收入质量。Unitree 的公开 G1 定价和 AgiBot
              的公开商店页面表明，标价可以远早于毛利和使用率而可见。Apptronik 的商业伙伴披露说明，经常性工业收入与部署进展绑定，而不是消费级销售漏斗。对 Kunlunxing
              而言，公开证据支持产品品类和未来商业模式方向，但不支持当下变现牵引。投资人似乎在承销一个类似后期同行的经营模型，尽管 Kunlunxing 自身尚未发布同等商业证据。这个缺口是公司当前阶段最核心的财务事实。
