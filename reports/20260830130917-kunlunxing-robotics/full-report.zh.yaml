      - number: '2.2'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              最清晰的近期买方群体，是试图自动化重复但可变任务的汽车、电子、电池和一般制造运营商。仓储和物流运营商是第二个核心群体，因为具身系统能够在为人类设计的环境里处理拣选、移动和异常。公共服务和科研用户构成第三类，因为他们往往早于家庭用户采用，也能承受更高试点成本。家庭长期使用仍是具身
              AI 战略叙事的一部分，但不是 Kunlunxing
              近期最能支撑的收入池。在工厂场景里，买方通常是工厂或运营负责人，用户是一线工人或维修人员，付款方则是资本设备或自动化预算负责人。在物流场景里，经济买方通常是仓库运营负责人或 COO
              级赞助人，其预算容忍度取决于在线率和回本周期。地方政府或公共试点的付款方可能是政策支持基金或园区运营方，而不是商业工厂经理。因此，采用路径牵涉多方，比软件采购更慢；安全、集成和工作流重设计都需要签字。这样的买方动态有利于既能证明硬件可信度、又能提供系统集成能力的公司，这也是投资人强调
              Kunlunxing 商业化履历的原因之一。
