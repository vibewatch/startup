  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和规模测算口径
        blocks:
          - type: paragraph
            body: >-
              Kunlunxing 竞争的市场是具身 AI
              和人形机器人，而不是整个广义工业自动化市场。这个边界包括面向工业、物流、服务以及最终家庭任务的通用移动操作机器人和人形机器人。如果传统固定功能工业机械臂没有叠加具身智能、移动能力或通用控制，就不在这个边界内。Goldman
              Sachs 估计，未来十到十五年全球人形机器人市场至少可能达到 US$6 billion；在 2035 年蓝天情景下，规模最高可达 US$154 billion。ChinaBiz Insider
              引用的中国方向分析师评论称，Morgan Stanley 将 2026 年中国人形机器人出货预测上调至 50,000 台、市场规模 US$2 billion，并到 2030 年扩大到 US$15
              billion。MarketsandMarkets
              发布的预测口径更窄，聚焦硬件收入机会，而不是更广的劳动力替代价值。因此，已审阅市场来源支持一个跨度很宽的区间：一端是保守商业化情景，另一端是长期平台期权情景。SOC Robotics
              和其他市场评论者强调，成本、灵巧性和部署可靠性仍然把可服务市场和现实近期可获取市场隔开。对 Kunlunxing 而言，实际可服务市场最好先看中国工业和物流部署，家庭服务则是后续期权。只用一个泛化 TAM
              数字给公司定规模，会夸大一家成立五个月的公司到 2026 或 2027 年真正能追逐的机会。
