chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与法律主体
        blocks:
          - type: paragraph
            body: >-
              已审阅公开来源把 Kunlunxing Robotics 描述为一家北京具身 AI 与机器人创业公司，聚焦通用人形机器人及相关具身智能系统。Qichacha 显示，其法律主体为 Beijing
              Kunlunxing Robotics Technology Co., Ltd.，注册地址位于北京通州的北京经济技术开发区内。Qichacha 记录 Ren Geng
              为公司法定代表人和董事长级经营负责人。公开来源的描述一致称，公司采用机器人本体与机器人大脑结合的双驱策略，而不是只做软件层具身
              AI。已审阅经营范围包括智能机器人研发与销售、工业机器人制造与销售、软件开发、系统集成和 AI
              应用软件开发。已审阅来源集中没有公司的官方公开网站，产品细节、招聘规模和政策披露只能依赖第三方报道和工商登记界面。已审阅来源把 Kunlunxing 定位为希望对标 Tesla Optimus
              的全栈入局者，而不是狭窄零部件供应商。公开材料一致把总部落点放在 Beijing E-Town，即便简写描述会交替使用亦庄、通州或大兴等行政区标签。截至本次报告日期，Kunlunxing
              仍是一家私营公司，直接披露稀少；已审阅材料中也没有公开董事会章程、隐私政策或投资人演示材料。
