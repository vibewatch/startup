      - number: '8.4'
        title: 估值结论：有溢价，但脆弱
        blocks:
          - type: paragraph
            body: >-
              基于已审阅证据，Kunlunxing 应当相对普通早期机器人公司获得溢价，因为创始人组合和投资人阵容都很突出。但它还不该
              按商业化风险已经解决来估值。更合适的表述是：当前估值反映的是异常有价值的执行期权，而非已被证明的经济优势。
              任何新投资人或合作伙伴，在接受账面标价前，都应围绕原型、试点、组织厚度和现金跑道做基于里程碑的尽调。因此， 估值建议是建设性但谨慎：溢价可以理解，进一步上调需要证据。若 Kunlunxing
              开始披露客户名称或技术里程碑，向上重估 可能很快发生；没有这些证明，情绪正常化带来的下行空间很实质。近期最重要的估值测试，是 Kunlunxing 能否把故事从
              “谁投了、谁创立了公司”，转向独立可见的产品和客户证据。建设性投资人可以接受今天的一部分叙事溢价，但仍应把后续
              估值上调绑定到具体原型、试点和治理披露。大量其他资金充足的人形机器人新进入者存在，机会成本很真实；资本应流向证据密度， 而不只是创始人光环。相对全球最贵的同业，Kunlunxing
              在叙事上仍可能显得不贵，但在证据上依然昂贵，所以情景纪律在这里格外重要。
            claimRefs:
