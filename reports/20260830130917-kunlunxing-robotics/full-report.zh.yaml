companyProfile:
  summary: >-
    Kunlunxing Robotics（Beijing Kunlunxing Robotics Technology Co., Ltd., 昆仑行机器人）是一家总部位于北京的具身 AI 创业公司，成立于 2026 年 3
    月。公开报道和工商登记证据把公司呈现为一家全栈人形机器人新入局者，围绕通用具身智能，以「本体 + 大脑」双驱策略切入工业场景和未来家庭场景。公司突出的地方在于，Ren Geng 带来了来自 Alibaba Group 和
    Alibaba Cloud 的中国企业级运营背书，联合创始人 Lang Xianpeng 则带来了来自 Li Auto 的自动驾驶和智能系统落地经验。公开证据对资本形成的支撑异常强，对已交付产品、客户和经济性则异常弱。
  foundedDate: '2026-03-04'
  founders:
    - name: Ren Geng
      role: 创始人兼 CEO
      background: 曾任 Alibaba Group 副总裁、Alibaba Cloud 中国区总裁；公开来源还提到其早年在 Huawei 和 ENN 的运营岗位。他为融资、商业化和企业生态可信度提供支点。
      claimRefs:
        - CO010
    - name: Lang Xianpeng
      role: 联合创始人兼技术负责人
