            body: >-
              通用具身 AI 工作流通常从数据采集走到模型训练、机器人本体集成、试点部署和现场支持。Kunlunxing
              的公开材料暗示，它希望拥有这个工作流中的多个层，而不是完全依赖第三方模型或集成商。这个雄心既提高上行空间，也增加依赖复杂度，因为全栈控制要求公司在组件、仿真、控制和服务上都具备更强执行。AgiBot、AimRT
              和 Unitree 的公开同行材料显示，现代机器人项目除了硬件，还依赖运行时框架、数据集、工具和集成界面。没有 Kunlunxing
              公开网站或代码仓库时，本章最接近的公开证据来自从业者代理指标和竞争对手披露。公司还依赖正在成熟的致动器、灵巧手、感知系统和制造伙伴供应链。36Kr
              明确指出，通用人形机器人硬件供应链仍然不清晰，尤其是高磨损部件。因此，技术就绪度和供应商就绪度在尽调中无法干净切开。创业公司可以有正确的架构叙事，但如果依赖图成熟太慢，仍可能失败。
