      - number: '1.4'
        title: 里程碑、战略方向和当前状态
        blocks:
          - type: paragraph
            body: >-
              公司的公开叙事围绕成为通用人形机器人平台，而不是小众子系统供应商。Kunlunxing 明确把 Tesla Optimus 作为量产具身智能的行业参照。36Kr 和 BigGo
              称，公司围绕昆仑世界模型和双系统智能架构组织技术故事，意在提升因果推理和场景泛化能力。公开报道称，公司落地 Beijing E-Town，并在成立后不久获得地方政府定向支持。2026
              年最强的里程碑证据是融资速度和团队搭建，而不是出货、具名部署或收入。截至本次报告日期，已审阅公开信息没有披露商业订单、工厂铺开、开发者平台发布或安全认证。中国具身 AI 资本热潮为 Kunlunxing
              打开了有利融资窗口，但同一轮热潮也抬高了快速证明商业化的压力。美国政治层面对中国机器人的反弹带来外部里程碑风险，因为领先的中国人形机器人公司已经在 Washington
              成为采购审查对象。分析师和媒体语境显示，2026 年被期待成为人形机器人公司从 demo 走向试点部署的一年，因此 Kunlunxing
              缺乏公开产品证明这一点，相对其估值速度格外显眼。合在一起看，公司当前是一家资金充裕、创始人主导、战略野心很强的 A 轮公司；公开证据在人和资本上远比运营证明更扎实。
