      - number: '2.4'
        title: 采用约束和相反证据
        blocks:
          - type: paragraph
            body: >-
              IFR 明确提醒，真实生产场景中的人形机器人实际能力今天仍局限于演示机或试点项目。IFR 同一份说明还称，通用人形工厂助手或家庭助手的规模化采用，在短期和中期内都不被预期。36Kr 和 BigGo
              都强调硬件耐久性约束，例如灵巧手寿命短、通用人形机器人供应链不成熟。Morgan Stanley 的上调情景依赖 2026 年下半年试点转为订单，这仍然给每一个新入局者留下时间风险。ChinaBiz
              Insider 认为，许多具身 AI 创业公司只有 18 到 24 个月现金跑道，使 2027-2028 年可能成为弱玩家淘汰窗口。已审阅的独角兽数量也因来源而异，有的称新增 19 家机器人独角兽，有的称 22
              家，也有的称 25 家，说明热度指标并没有完全标准化。即便国内试点推进顺利，国际安全审查也可能封顶中国机器人的出口机会，或拖慢海外采购。对 Kunlunxing
              来说，最重要的市场约束不是人形机器人最终会不会重要，而是公司能否在资本窗口收紧前，把宏观顺风转化为差异化部署证明。因此，市场分析支持一个庞大且增长中的机会，但不支持把近期商业化视为已经解决。
