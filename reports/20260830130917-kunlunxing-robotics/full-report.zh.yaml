      - number: '3.4'
        title: 护城河耐久性和竞争风险
        blocks:
          - type: paragraph
            body: >-
              Kunlunxing 当前最强的护城河主张，是创始团队中商业化领导力与自动驾驶工程领导力的罕见组合。这个护城河仍处于产品前阶段，因此容易被已经拥有试点客户或可见 SKU 的更快竞争者冲击。具身 AI
              独角兽热潮意味着资本充裕，融资渠道本身不是耐久差异化。Unitree 的开放开发者生态和 AgiBot
              的研究披露，创造了公开学习界面，低披露创业公司很难在公共领域匹配。整个品类的客户集中风险都很高，因为大多数公司先靠少数锚定部署创造价值，再谈更大规模。对中国机器人的监管审查也可能成为均衡器：它会拖慢所有国内玩家的海外扩张，而不只是
              Kunlunxing。商品化风险同样存在，因为组件、模型和系统架构可能比品牌叙事暗示得更快趋同。因此，Kunlunxing
              的长期护城河很可能取决于它能否比同行更快证明部署经济性和组织执行，而不是只靠讲故事。竞争地图支持认真关注
              Kunlunxing，但不支持认定它已经拿到可防守领先。由于多个同行已经展示产品页、开发者工具或具名客户证据，除非 Kunlunxing 开始发布可比运营证明，否则它当前的叙事优势可能很快收窄。
