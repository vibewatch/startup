        title: 可比公司支持较宽但并非无边界的估值区间
        blocks:
          - type: paragraph
            body: >-
              Figure 的估值说明，市场愿意为品类领导地位、品牌热度和被感知的前沿能力支付什么价格。Apptronik 在一轮 大额融资后估值约 US$5 billion，说明一家客户证明更清晰、但叙事没有 Figure
              那么极端的公司，仍能获得投资人 高定价。Agility 和 Unitree 提供了中档估值锚点：运营证据更强，价格也比最热的前沿名字更克制。1X 则为家庭
              机器人叙事提供了较低估值锚点，但其商业化风险仍很大。对照这些基准，Kunlunxing 据报道 >US$1 billion 至 约 RMB 10 billion
              的区间，在品类里并不荒唐；但一家缺少公开部署证明的公司承受这个价格仍然激进。因此，合理的 可比框架应奖励创始人质量和融资能力，同时折价处理客户与产品透明度不足。最可信的可比组不是单一中国或美国样本，
              而是中国工业化同业与全球商业化标杆的混合组。Unitree 的公开商店和产品页面强化了一个判断：估值不应只反映融资热度， 也要看定价、产品可得性等可见商业化界面。AGIBOT
              产品页同样显示，即便完整财务披露尚未出现，同业也能靠具体 SKU 可见性支撑估值。TechCrunch 关于 1X 融资的报道提示，即使关注度很高的人形机器人公司，交易逻辑仍更多押注未来
              消费者或平台可选项，而非成熟收入披露。TechCrunch 对 Amazon 与 Digit 的报道也有意义，因为具名企业测试比单纯 概念阶段叙事更能支撑估值可信度。
            claimRefs:
