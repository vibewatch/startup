companyProfile:
  summary: >-
    Kunlunxing Robotics (Beijing Kunlunxing Robotics Technology Co., Ltd.,
    昆仑行机器人) is a Beijing-based embodied-AI startup formed in March 2026.
    Public reporting and registry evidence present the company as a full-stack
    humanoid robotics entrant pursuing industrial and future domestic use cases
    through a dual-drive body-plus-brain strategy centered on general embodied
    intelligence. The company stands out because Ren Geng brings rare China
    enterprise operating credibility from Alibaba Group and Alibaba Cloud while
    co-founder Lang Xianpeng brings autonomous-driving and intelligent-systems
    execution experience from Li Auto. Public evidence is unusually strong on
    capital formation and unusually weak on shipped product, customers, and
    economics.
  foundedDate: "2026-03-04"
  founders:
    - name: Ren Geng
      role: Founder & CEO
      background: >-
        Former Alibaba Group vice president and former Alibaba Cloud China
        president; public sources also cite earlier Huawei and ENN operating
        roles. He anchors fundraising, commercialization, and enterprise
        ecosystem credibility.
      claimRefs:
        - CO010
    - name: Lang Xianpeng
      role: Co-founder & Technical Leader
      background: >-
        Former Li Auto intelligent-driving leader who built and scaled assisted
        driving capabilities, providing autonomy and robotics-systems execution
        depth.
      claimRefs:
        - CO011
  foundingLocation: "Beijing, China"
  headquarters: "Beijing Economic-Technological Development Area (Tongzhou), Beijing, China"
  productSummary: >-
    General-purpose embodied-AI and humanoid robotics program combining a
    world-model-driven robot brain with self-developed or tightly integrated
    robot body components for industrial and future domestic tasks.
  customerFocus: >-
    Near-term focus is most plausibly manufacturing, logistics, and policy-
    backed pilot environments; household robotics remains a longer-duration
    option rather than a proven current revenue pool.
  businessModel: >-
    Likely mix of robot hardware sales, deployment and integration services,
    and eventual software / support revenue once product and pilot maturity are
    established.
  stage: Series A
  fundingStatus: >-
