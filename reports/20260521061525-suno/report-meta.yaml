    retained sources do not disclose a precise incorporation or launch address.
  headquarters: >-
    Cambridge, Massachusetts, with additional publicly listed office locations in New York and Los
    Angeles.
  productSummary: >-
    Suno sells AI-generated music creation and editing tools: prompt-to-song generation, custom
    lyrics, audio upload, covers, personas, song editing, stem splitting, Studio multitrack editing,
    mobile creation, and Copilot distribution, with a licensed-model roadmap for 2026.
  customerFocus: >-
    Primarily consumers, hobbyists, indie artists, and prosumer creators, with emerging partner and
    music-industry workflows; public evidence is much stronger for self-serve creator demand than for
    enterprise accounts or API customers.
  businessModel: >-
    Freemium subscription model with Free, Pro, and Premier tiers that gate credits, advanced tools,
    commercial rights, downloads, and paid overages; future economics also depend on licensed-model
    and partner arrangements.
  stage: Late-stage private / Series C
  fundingStatus: >-
    Verified public rounds include a $125 million Series B in May 2024 and a $250 million Series C at
    a $2.45 billion post-money valuation in November 2025. Disclosed financings imply roughly $375
    million raised, while later reports of a possible Series D above $5 billion remain unverified.
