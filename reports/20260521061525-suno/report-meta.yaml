companyProfile:
  summary: >-
    Suno is a 2022-founded private AI music company based in Cambridge, Massachusetts and led by
    co-founder CEO Mikey Shulman. The product has expanded from prompt-based song generation into a
    broader consumer and prosumer workflow spanning lyrics, uploads, covers, personas, editing,
    stems, Studio, and mobile creation, monetized through freemium subscriptions with paid commercial
    rights. Public evidence supports rare private-company scale for a consumer creative tool — more
    than 2 million paid subscribers, more than 100 million users, and roughly $300 million of ARR by
    February 2026 — but the business still carries meaningful diligence caveats around copyright
    litigation, licensing economics, and limited operating disclosure.
