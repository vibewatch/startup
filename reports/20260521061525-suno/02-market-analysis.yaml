- id: sizing-lenses-and-range
  title: Sizing lenses and range
  body: |-
    Public market-sizing evidence is directionally useful but methodologically messy. Grand View Research sizes pure-play generative AI in music at $440 million in 2023, $569.7 million in 2024, and $2.79 billion by 2030, which implies a fast-growing category but not yet a giant market. Business Research Insights publishes a much larger $1.98 billion 2026 starting point and an $18.04 billion 2035 endpoint. That spread is the diligence lesson: TAM changes materially depending on whether the analyst is measuring pure-play music generation, broader AI audio tooling, or a wider content-creation stack.

    Adjacent lenses are larger still. MIDiA projects 198.2 million music creators by 2030 and a $10 billion creator-tools sector, while IFPI puts recorded-music trade revenue at $29.6 billion in 2024. Those bigger figures matter because they show where Suno can pull share from or partner into, but they are not the same as Suno's direct market. A more evidence-constrained SAM lens uses Suno's current paid price points against MIDiA's creator base. At 2%-5% paid penetration of the 2030 creator base, annual paid creator spend lands at roughly $0.38-$2.85 billion; only at 10% penetration does the range move above $5 billion. That is a healthier, more believable valuation anchor than treating all recorded-music or creator-economy revenue as available.
  claimRefs:
