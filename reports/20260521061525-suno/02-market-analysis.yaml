company:
  name: Suno
chapter:
  number: 2
  title: Market Analysis
  summary: Suno competes in a narrow but fast-growing AI music creation market that sits inside larger creator-tools and recorded-music pools. Public evidence supports a real consumer, prosumer, and emerging partner opportunity, but contradictory market estimates, legal uncertainty, ownership ambiguity, and thin enterprise or API disclosure mean the most defensible sizing case is high-hundreds-of-millions to low-billions rather than generic tens-of-billions TAM rhetoric.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary and substitutes
  body: |-
    Suno is not selling music listening; it is selling AI-assisted music creation. Official product, help, and partnership materials show that the core market is creator-side spend on subscriptions, credits, Studio access, and commercial-use workflows. Free users get limited daily credits and no monetization rights, while paid users buy rights to distribute and monetize songs externally. That means included spend is consumer and prosumer subscription spend, add-on credits, Studio-driven workflow spend, and commercial exploitation of AI-generated tracks in streaming, video, film, TV, or games. The Warner partnership adds a second lane: licensed models, artist opt-ins, paid downloads, and rightsholder-aligned fan experiences.

    Important adjacent pools should still be excluded from Suno TAM. Global recorded-music subscriptions, traditional DAW budgets, live music, label services, and general creator-economy revenue are relevant context, but they are not automatically Suno revenue. For serious creators, the closest substitute remains traditional music production software, especially when open-source tools are good enough. For content teams that mainly need legal background music, royalty-free libraries and adjacent AI soundtrack vendors remain viable alternatives. The result is a real but narrower market boundary than a generic “AI plus music” narrative would imply.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM013
