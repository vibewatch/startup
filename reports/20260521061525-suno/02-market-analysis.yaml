  evidenceGaps:
  - type: missing-source
    severity: material
    topic: developer-api-gap
    missingEvidence: Official developer API documentation, public API pricing, or public product pages describing a developer channel.
    whyItMatters: Developer distribution could change Suno's SAM, but public evidence today only supports consumer, prosumer, professional, and partner segments.
    diligencePath: Ask management for public or private API docs, current API customers, pricing, rate limits, and revenue contribution.
    relatedQuestionRefs:
    - QM017
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: material
    topic: ownership-and-rights-ambiguity
    missingEvidence: A single current Suno policy statement that unambiguously defines ownership, copyright eligibility, and commercial licensing for paid outputs.
    whyItMatters: Rights clarity directly affects creator willingness to pay, distributor acceptance, and enterprise adoption in regulated media workflows.
    diligencePath: Obtain the latest rights policy text from Suno legal, compare archived and current help pages, and confirm distributor guidance for AI-generated releases.
    relatedQuestionRefs:
    - QM023
  - type: conflicting-data
    severity: minor
    topic: feature-limit-conflict
    missingEvidence: A current product changelog or help article reconciling Suno's conflicting upload-limit documentation and forthcoming download-cap rules.
    whyItMatters: Conflicting product docs weaken buyer trust and make it harder to model creator conversion, compute intensity, and support burden.
    diligencePath: Request an up-to-date product policy matrix showing free, Pro, and Premier upload limits, download caps, and effective dates.
    relatedQuestionRefs:
    - QM024
    - QM027
  - type: private-evidence-only
    severity: material
    topic: segment-mix-and-enterprise-economics
    missingEvidence: Public disclosure of user mix, paid conversion by segment, enterprise or partner pricing, and revenue split between subscriptions, top-ups, and partnerships.
    whyItMatters: Without segment economics, market sizing can only be bounded with external creator and pricing lenses rather than a true SAM or SOM.
    diligencePath: Request cohort conversion, ARPU by plan, partner revenue, and enterprise pipeline or contract data under NDA.
    relatedQuestionRefs:
    - QM028
    relatedTableRefs:
    - TM002
    - TM003
