- id: cost-structure-margin-and-capital-adequacy
  title: Cost structure, margin headwinds, and capital adequacy
  body: 'The hardest financial questions sit below gross profit. Sacra argues that Suno’s primary expense is GPU compute and that it exceeds payroll by several multiples, which fits the economics of long-form audio generation better than a pure software-margin model. Product direction likely adds both monetization headroom and cost complexity: Studio is Premier-only, WavTool brought browser-DAW technology in-house, and Warner’s licensed-model roadmap adds paid-only downloads, monthly download caps, and pay-for-more download mechanics. Those changes can improve average revenue per paying user, but they also imply extra compute, storage, moderation, and potential licensing payouts. The legal overhang is still material. The RIAA-backed complaint alleges Suno copied sound recordings to train its models, says Suno charges monthly fees on the back of that system, and seeks injunctions and damages. Court records show the main case remained active in May 2026 even after Warner’s separate settlement.
    Suno has enough disclosed scale and fresh capital to avoid looking immediately cash-starved, but no reviewed source discloses cash on hand, burn, runway, debt, or legal reserves.'
