- id: disclosure-gaps-and-financial-verdict
  title: Disclosure gaps and financial verdict
  body: 'The financial verdict is therefore mixed: Suno appears to have real subscription revenue quality at the top of the funnel, but not yet the disclosure quality needed for conventional underwriting. Public sources are strong enough to conclude that self-serve subscriptions are the core engine, that pricing power has expanded through professional workflow features, and that the business is already large enough for labels to negotiate over economic benchmarks rather than whether a market exists. Public sources are not strong enough to prove normalized gross margin, consumer-versus-enterprise mix, licensing take rates, per-song cost to serve, or post-settlement legal liability. Just as important, the Warner settlement economics remain confidential while the remaining label litigation is still live, so the two most important inputs to long-run contribution margin—compute and rights payments—remain largely opaque. Investors can underwrite momentum, consumer demand, and some capital adequacy
    from the public record; they cannot yet underwrite sustainable free-cash-flow conversion. Until Suno discloses margin structure, cash runway, and licensing burden with more specificity, the right stance is to treat the company as high-growth but still evidence-constrained on durability.'
