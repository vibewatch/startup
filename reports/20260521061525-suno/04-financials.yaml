- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Why it matters
  - Public confidence
  - Exact diligence ask
  rows:
  - - Total disclosed funding
    - ~$375M across the reported Series B and Series C
    - Sets the rough capital buffer
    - Medium
    - Confirm total primary capital, any secondary, and any unannounced extensions
  - - Latest financing
    - $250M Series C in November 2025
    - Most recent fresh cash infusion
    - High
    - Provide round close date, primary/secondary split, and investor rights
  - - Latest valuation
    - $2.45B post-money
    - Benchmark for revenue multiple expectations and next-round pressure
    - High
    - Provide cap table, option pool impact, and implied preferences
  - - Cash on hand
    - null
    - Determines runway and financing dependency
    - Low
    - Provide month-end cash, restricted cash, and expected cash conversion
  - - Monthly burn
    - null
    - Needed to size runway and sensitivity to compute or legal shocks
    - Low
    - Provide gross burn, net burn, and seasonal working-capital swings
  - - Runway months
    - null
    - Core adequacy metric for underwriting
    - Low
    - Provide base, bear, and rights-expansion runway cases
  - - Debt / project-finance obligations
    - No public debt or project-finance obligations were identified in reviewed sources
    - Hidden senior claims can materially change downside protection
    - Low
    - Disclose debt, leases, vendor financing, and cloud-commitment minimums
  - - Legal / licensing obligations
    - Warner economics are confidential and the remaining label litigation is still active
    - Could absorb cash or compress gross margin
    - Medium
    - Disclose reserves, expected settlement structure, and any minimum guarantees
  - - Next-round trigger
    - Not publicly disclosed
    - Clarifies how much execution risk must clear before the next financing event
    - Low
    - Provide the milestones that would force or avoid another round
  notes: This table separates what is truly public from what remains management-private; null means not disclosed rather than zero.
