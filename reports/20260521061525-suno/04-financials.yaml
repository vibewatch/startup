- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current public value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Self-serve subscriptions
    - Free-to-paid Pro/Premier recurring plans
    - Subscriber-month / subscriber-year
    - $200M annual revenue in Nov 2025; $300M ARR and 2M paid subscribers by Feb 2026
    - 'Medium-high: recurring model is clear, but accounting basis and churn bridge are not public'
    - Provide MRR/ARR bridge, plan mix, monthly churn, and billings vs recognized revenue
  - - Add-on credits
    - Extra purchased credits for paid subscribers after included allowances
    - Credit pack / incremental generation
    - Officially available to Pro/Premier users; no public revenue contribution disclosed
    - 'Medium: upsell exists, but attach rate and realized pricing are undisclosed'
    - Provide % of paid users buying top-ups and ARPPU uplift from overages
  - - Paid downloads / download overages
    - 2026 roadmap makes downloads paid-only and capped, with pay-for-more mechanics
    - Download / bundle
    - Announced by Warner and Suno; live economics not publicly quantified
    - 'Low: clear monetization lever, unclear price, adoption, and recognition policy'
    - Publish download caps, overage prices, and take-up by tier
  - - Pro workflow monetization
    - Premier-only Studio and WavTool-enhanced production tooling drive tier upgrades
    - Subscription tier uplift
    - Studio is live for Premier; professional workflow push is explicit
    - 'Medium: packaged inside subscription tiers rather than disclosed as a separate line'
    - Break out Premier mix, Studio-driven upgrades, and creator cohort monetization
  - - Licensed partner economics
    - Licensed models, artist opt-ins, and Songkick-linked fan experiences
    - Partner contract / rev share
    - Strategic direction disclosed, but deal economics remain confidential
    - 'Low: high strategic importance, almost no public economic detail'
    - Provide payout formulas, minimum guarantees, contract durations, and revenue-recognition treatment
  notes: Rows separate the disclosed subscription engine from announced but still opaque licensing and download monetization layers; no public source provides a revenue breakdown by stream.
