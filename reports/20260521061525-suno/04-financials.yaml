  - - Pro annual
    - $8 per month billed annually
    - 2,500 monthly credits
    - Commercial rights for new songs; downloads; add-on credits; 30-minute uploads
    - Only list pricing is public; actual annual-vs-monthly mix is unknown
  - - Pro monthly
    - $10 per month
    - 2,500 monthly credits
    - Commercial rights and self-serve subscription access
    - Realized ARPU, discounting, and subscriber mix are not public
  - - Premier annual
    - $24 per month billed annually
    - 10,000 monthly credits
    - Commercial rights plus Studio and highest workflow depth
    - Only list pricing is public; attach rate is unknown
  - - Premier monthly
    - $30 per month
    - 10,000 monthly credits
    - Commercial rights plus Studio
    - Actual mix between monthly and annual billing is undisclosed
  - - Add-on credits
    - Price not public in reviewed sources
    - Extra paid usage for Pro/Premier
    - Officially available while subscribed
    - No public price card or adoption data
  - - Download overages / licensed models
    - Price not public in reviewed sources
    - Monthly cap plus pay-for-more mechanics under the 2026 roadmap
    - Paid-only downloads and licensed-model controls are announced but not fully monetized in public docs
    - Economics remain confidential and may vary by rights regime
  notes: List pricing is public, but realized pricing, monthly-versus-annual mix, and the economics of add-on credits or paid download overages are not disclosed.
