- id: pricing-conversion-and-gtm-proxies
  title: Pricing, conversion, and GTM proxies
  body: 'Pricing and conversion evidence points to a classic freemium consumer funnel with emerging upsell layers. The annual plan view exposes $8 Pro and $24 Premier pricing, while press coverage of the monthly view cites $10 and $30. Official help pages show free users receive 50 daily credits and no commercial rights, whereas paid users get monthly credits, add-on credit purchases, downloads, distribution rights, and continued 50-daily-credit access after exhausting the monthly bucket. Billboard’s investor-deck reporting adds unusually strong consumer-SaaS-style engagement proxies: about 25% 30-day subscriber retention and 78% weekly retention for subscribers. Menlo and TechCrunch also describe growth as heavily word-of-mouth, with songs shared into group chats converting listeners into creators. A simple public math check yields about $150 of ARR per paid subscriber, which sits above annual Pro pricing but below annual Premier pricing; that is directionally consistent with a mostly-Pro
    mix plus monthly billing, add-ons, and perhaps early commercial-creator or partner revenue. The weaker point is conversion transparency: 2 million paid users against 100 million historical users is only a rough cumulative 2% ratio, not a live active conversion rate.'
