- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why missing data matters
  - Closest public proxy
  - Impact on judgment
  - Exact diligence path
  rows:
  - - Consumer vs enterprise / licensed-partner revenue mix
    - Mix determines durability, sales efficiency, and concentration risk
    - Pricing pages plus “mostly subscriptions” reporting
    - Material
    - Provide revenue by channel, plan, contract type, and cohort
  - - Gross margin / COGS bridge
    - Core valuation input for any AI subscription business
    - Sacra’s compute commentary only
    - Material
    - Provide gross margin bridge, COGS definition, and hosting allocation
  - - Cloud / GPU commitments and cost per song
    - Main variable-cost driver likely sits here
    - Sacra says compute exceeds payroll
    - Material
    - Provide cloud contracts, inference cost per generation, and training-spend cadence
  - - Cash, burn, and runway
    - Capital adequacy cannot be sized without liquidity detail
    - Fresh Series C and rapid ARR growth only
    - Blocking
    - Provide board cash waterfall, monthly burn, and runway scenarios
  - - Licensing payout / rev-share terms
    - Rights-safe growth could improve trust but compress margin
    - Warner says artists will benefit, but terms are confidential
    - Material
    - Review executed license terms, payout schedules, and accounting treatment
  - - Legal reserve / contingent liability
    - Active cases could alter solvency or force product changes
    - Complaint seeks injunction and damages; docket remains active
    - Material
    - Obtain reserve analysis, outside-counsel assessment, and insurance coverage
  notes: The missing metrics are the specific reasons public top-line momentum still falls short of full financial underwriteability.
