  evidenceGaps:
  - type: missing-source
    severity: material
    topic: enterprise-mix
    missingEvidence: Public API or enterprise package documentation plus revenue mix detail for commercial creators and licensed partners.
    whyItMatters: Without a published price card or revenue split, sales efficiency, concentration, and the extent of non-consumer revenue remain speculative.
    diligencePath: Request revenue by channel, contract count, average contract value, and any commercial-creator or API rate cards.
    relatedQuestionRefs:
    - QI008
    - QI023
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: liquidity
    missingEvidence: Current cash balance, gross and net burn, runway cases, debt schedule, and vendor commitment schedule.
    whyItMatters: Fresh capital and revenue scale suggest buffer, but financing dependency cannot be underwritten without liquidity detail.
    diligencePath: Obtain the board cash waterfall, debt schedule, GPU/cloud commitments, and management runway scenarios.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross-margin bridge, cloud or GPU spend, per-song inference cost, and training-spend allocation.
    whyItMatters: Compute appears to dominate costs, so valuation durability depends on whether unit costs are falling faster than price compression or payout burdens rise.
    diligencePath: Request COGS policy, cloud invoices, inference-cost model, and training amortization assumptions.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: licensing-economics
    missingEvidence: Warner settlement economics, payout formulas, minimum guarantees, and accounting treatment for paid downloads or licensed models.
    whyItMatters: Rights-safe monetization may improve trust yet compress gross margin if payouts or guarantees are meaningful.
    diligencePath: Review executed license terms, revenue-sharing schedules, and management accounting policy for licensed output monetization.
    relatedQuestionRefs:
    - QI016
    - QI018
    relatedTableRefs:
    - TI001
    - TI004
    - TI005
  - type: conflicting-data
    severity: material
    topic: revenue-quality
    missingEvidence: A reconciliation between the reported “annual revenue” figure in November 2025 and the reported “ARR” figure in February 2026 plus a matching billings bridge.
    whyItMatters: Growth is clearly strong, but without consistent definitions it is hard to normalize run rate, churn, and valuation multiples.
    diligencePath: Request the KPI pack showing GAAP revenue, ARR, billings, deferred revenue, and churn across the same periods.
    relatedQuestionRefs:
    - QI001
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
