      - number: '6.4'
        title: 耐久性限制与负面客户信号
        blocks:
          - type: paragraph
            body: >-
              耐久性证据方向上令人鼓舞，但仍不完整。Billboard 报道了异常强的消费者式参与代理指标——订阅用户约 25% 的 30 天留存、78% 的订阅用户周留存，以及全体用户 39%
              的周留存——公开应用商店评分也意味着许多用户满意到愿意大规模留下高分评价。即便如此，公开记录仍缺少更成熟客户章节需要的核心承销切片：按 cohort 的付费层流失、按 vintage
              的免费转付费、地域组合、客户集中度、NRR、GRR 和企业续约数据。负面客户信号也很实质。同一 App Store 评论界面既有亮眼音乐人证言，也有关于年度计费混乱和客服响应弱的投诉。更重要的是，Suno
              的客户扩张仍处于沉重版权阴云之下。RIAA 公告、底层联邦起诉书，以及音乐行业媒体提到的后续“Say No to
              Suno”反弹，都提高了风险：部分创作者、品牌或分发方可能会继续多栖，或在授权与训练数据争议更稳定前避免深度投入。
