      - number: '5.3'
        title: 权利、审核与数据控制
        blocks:
          - type: paragraph
            body: >-
              相比模型架构，Suno 的权利和安全立场更明确。合同图景很直接：付费订阅用户获得商用权和广泛分发界面，Free 层歌曲保持非商用，并被视为 Suno
              所有的输出。但公司也反复区分这些合同权利与版权本身；官方材料提醒，商用许可并不保证 AI 重度歌曲获得版权保护，在美国尤其如此，不过用户自己写的歌词可能仍可单独受保护。滥用控制方面，Suno
              帮助中心称，产品会拦截包含知名艺术家姓名、受版权或商标保护术语、贬损性语言和过度脏话的请求，并可在发布后移除材料或执行 DMCA 流程。更深的信任问题是训练数据。Suno 的 California
              披露现在承认，模型使用来自开放互联网的公开可用音乐文件和元数据，以及用户内容和活动数据训练，语料规模为数千万。这个披露比旧公开材料更清楚，但不能消除诉讼风险：RIAA
              支持的起诉书直接指控其为训练大规模复制受版权保护录音。来源图景也不完整。Suno 在 V3 发布时公开声称有不可听水印检测，但已审阅当前来源没有提供用户可验证的水印或溯源工具。
