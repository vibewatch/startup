      - number: '5.2'
        title: 模型演进与运营信号
        blocks:
          - type: paragraph
            body: >-
              最干净的公开版本史从 2023 年 Discord 时代的 Suno 开始，随后从 V2 起变得具体得多。当前帮助中心材料没有保留详细 V1 规格，这本身就是重要尽调点：V2
              之前的公开历史很薄。此后轨迹清晰。V3 成为首个官方描述的广播级模型，并把首次生成歌曲推进到 2 分钟。V3.5 随后改善结构，并把首次生成时长推到 4 分钟。V4
              带来已审阅官方材料中最有意义的质量语言变化，Suno 明确把发布与更干净音频、更锐利歌词、更好人声和更动态结构绑定，同时升级 Covers 和 Personas，并加入
              Remaster。技术实质上，公开记录最强的是运营而非架构。Modal 显示了真实基础设施规模——数千块 GPU、链式推理函数，以及对季节性峰值的弹性处理；Rolling Stone 2024 年报道则显示，V3
              时期 Suno 的产品流把 Suno 音乐模型与 ChatGPT 结合，用于歌词和标题。仍缺失的是承销方最关心的问题：已审阅的当前一手来源没有足够详细解释商业模型栈，无法判断它本质上是
              transformer、自回归、diffusion，还是混合架构。
