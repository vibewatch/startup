      - number: '8.3'
        title: 下行情景分布与敏感性
        blocks:
          - type: paragraph
            body: >-
              下行情景主要不在于 Suno 能否获客，而在于授权模型、下载限制和平台摩擦到来后，这些用户还能否继续被变现。Warner 合作确认，2026
              年会转向授权模型、仅付费用户可下载，并对付费用户设置月下载上限。Music Business Worldwide 还显示，其他唱片公司的经济条款仍足够私密，以至于 UMG 和 Sony 被阻止查看 Warner
              的交易条款。这给毛利率承保留下了大洞。法律背景也不是抽象风险。CourtListener 显示原始诉状仍是公司故事的一部分；Forbes
              认为选择性和解可能固化不透明经济性，同时把独立方排除在外；Copyright Office 的训练报告则强调，当 AI 输出与原作竞争时，可能造成替代效应和授权市场损害。再加上 Deezer
              官方政策给出的现实下游场景：AI 音乐可以继续分发，却失去推荐支持和版税参与。这些压力拉开了很宽的估值区间：若诉讼或流失真正咬伤业务，悲观情景接近公开内容公司倍数；若 Suno
              穿过转型仍保持增长，基准情景接近当前估值；只有当新一段 ARR 增长和私有 AI 热度同时延续，乐观情景才成立。
