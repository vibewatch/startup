  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 决策链从收入规模证据和可比公司支撑出发，经过法律与平台折扣，落到最终建议。
    approximationNotes: 这是定性决策图，不是概率模型。
    data:
      nodes:
        - id: scale
          label: 规模证据
          detail: 2M 付费订阅者和 $300M ARR 表明需求真实存在。
        - id: pricing
          label: 定价证据
          detail: 对照 Pro 和 Premier 档位，每付费用户隐含 $150 ARR 说得通。
        - id: comps
          label: 可比公司支撑
          detail: Suno 相对公开内容类可比公司应有溢价，但不能无限脱钩。
        - id: haircuts
          label: 折扣
          detail: 诉讼、授权不透明和平台政策风险会压低对该估值的信心。
        - id: mark
          label: 已验证当前估值
          detail: $2.45B 是本轮保留证据中唯一硬锚。
        - id: decision
          label: 建议
          detail: 仅在接近已验证估值且有下行保护时观察或投资；避开由传闻驱动的重定价。
      edges:
        - from: scale
          to: mark
          label: 支撑
        - from: pricing
          to: mark
          label: 支撑
        - from: comps
          to: mark
          label: 框定溢价
        - from: haircuts
          to: mark
          label: 折价
        - from: mark
          to: decision
          label: 驱动
    claimRefs:
      - CV006
      - CV008
      - CV035
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 围绕保留证据集，股权价值对收入规模和收入倍数假设的敏感性。
    approximationNotes: 数值是以十亿美元计的估计情景点，使用已披露或据报道的 ARR / 收入锚。
    data:
      items:
        - label: $250M ARR 情景 @ 6x
          value: 1.5
          unit: $B
          note: 诉讼压力较重的下行情景
        - label: $300M ARR 情景 @ 8x
          value: 2.4
          unit: $B
          note: 按后续 ARR 计算，接近当前已验证估值
        - label: $350M ARR 情景 @ 8x
          value: 2.8
          unit: $B
          note: 增长延续时的基准情景
        - label: $400M ARR 情景 @ 10x
          value: 4
          unit: $B
          note: 经济性更干净时的溢价情景
        - label: $300M ARR 情景 @ 12x
          value: 3.6
          unit: $B
          note: 偏贵，但仍低于私人市场 AI 泡沫
        - label: $300M ARR 情景 @ 16.7x
          value: 5
          unit: $B
          note: 传闻中的下一轮锚点
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV043
      - CV044
      - CV045
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 由证据支撑的悲观、基准和乐观估值区间，用于下一次承销讨论。
    approximationNotes: 区间表达的是情景不确定性，不是置信区间。
    data:
      items:
        - label: 悲观情景
          low: 1.2
          mid: 1.5
          high: 1.8
          unit: $B
        - label: 基准情景
          low: 2.2
          mid: 2.6
          high: 3
          unit: $B
        - label: 乐观情景
          low: 4.5
          mid: 5
          high: 5.5
          unit: $B
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 投委会式评分卡，把已经证实的内容与仍缺披露支撑的内容分开。
    approximationNotes: 评分是基于保留证据作出的 1-5 序数判断，不是管理层提供的经营 KPI。
    data:
      items:
        - label: 增长证据
          value: 5
          unit: /5
          note: 2M 付费和 $300M ARR 对私营公司来说是异常强的信号
        - label: 定价证据
          value: 4
          unit: /5
          note: 现行套餐阶梯和隐含 ARPPU 看起来一致
        - label: 法律清晰度
          value: 1
          unit: /5
          note: 核心经济性仍暴露在未决诉讼下
        - label: 授权经济性可见度
          value: 1
          unit: /5
          note: Warner 和其他唱片公司的条款仍不透明
        - label: 公开可比公司支撑
          value: 2
          unit: /5
          note: 相比公开音乐和内容类可比公司，当前估值仍显偏贵
        - label: 私人市场 AI 可选性
          value: 4
          unit: /5
          note: 私人市场 AI 音频估值显示，溢价偏好可能延续
        - label: 证据质量
          value: 3
          unit: /5
          note: 收入规模来源充分，但利润率和股权结构细节不足
    claimRefs:
      - CV006
      - CV008
      - CV030
      - CV038
      - CV040
      - CV046
