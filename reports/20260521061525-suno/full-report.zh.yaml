      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Suno 由 Mikey Shulman、Georg Kucsko、Martin Camacho 和 Keenan Freyberg 于 2022 年创立，四人此前曾在 Kensho
              共事。这段背景有战略意义：团队把机器学习工程经验、对音乐的共同兴趣和产品化能力拼在一起。Shulman 是公开层面最核心的高管声音：融资、媒体和法律报道都引用这位联合创始人兼
              CEO，他也持续把公司叙事锚定在音乐创作民主化上。2025 年和 2026 年，Suno 增补了更明确的音乐行业领导力，尤其是任命 Paul Sinclair 为 Chief Music
              Officer、Jeremy Sirota 为 Chief Commercial
              Officer。这些招聘增强了公司面向行业的深度，特别是授权、平台合作和企业解决方案。即便如此，与公司规模相比，公开披露仍偏薄。已审阅来源没有发现经独立确认的 CFO、COO
              或详细董事会名单，也没有披露后续融资中的投资者控制权或治理条款。因此，尽管音乐业务班底更强，关键人和治理尽调仍有实质工作未完成。
