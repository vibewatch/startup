      - number: '3.2'
        title: 能力、质量与工作流对比
        blocks:
          - type: paragraph
            body: >-
              能力竞争现在按待完成任务分层。Suno 在面向消费者的成品歌曲上仍显得最强，因为其付费层把分轨、编辑、上传和个人声音功能，与明确面向发布的权利打包在一起。Udio
              在创作者野心和制作人式控制上最接近，但独立报道显示，和解后的工作流受到导出限制干扰。Stable Audio 又不同：它押注技术控制、更长形态生成、开放权重、API
              访问和自托管，服务那些比榜单式社交歌曲更在意集成或声音设计的团队。MusicGen 保持战略重要性，因为它让开源基线继续存在；但已发布权重不可商用，模型在真实人声上仍难以匹敌 Suno 或 Udio。Google
              的 Lyria 具备有意义的音乐能力，但最强证据指向一个绑定 Gemini、Vertex 和 Shorts 的平台优先产品，而不是纯创作者订阅。Adobe 和 Canva
              则把“足够好”的音乐与音频选择内置到既有内容工作流里，削弱了大部分低端配乐需求。
