  - id: FP003
    title: 护城河 / 就绪度 KPI
    type: kpi
    layout: standard
    summary: 五个紧凑指标，概括哪些竞争力量最直接压迫 Suno 的防御力。
    approximationNotes: KPI 值来自采信来源集的综合判断，不是公司披露指标。
    data:
      items:
        - label: 最接近的直接对手
          value: Udio
          detail: 最相似的面向创作者的完整歌曲产品，但当前导出和授权过渡问题削弱了易用性
        - label: 最强平台杠杆
          value: Google
          detail: Gemini、Vertex、Dream Track 和 YouTube Shorts 压缩触达与分发成本
        - label: 开源压力
          value: High
          detail: Stable Audio 开放权重和 MusicGen 式本地工具，降低基础模型层的稀缺性
