        - 过去 12 个月收入 $18.086B
        - 约 4.9x 销售额
        - 最接近的大型上市音乐订阅可比公司
        - 成熟、多元化，且上市流动性强
      - - Adobe
        - 市值 $102.41B
        - 2025 年收入 $23.769B
        - 约 4.3x 销售额
        - 有用的创作者软件毛利率和订阅基准
        - 产品套件更广，毛利率画像更强
      - - Shutterstock
        - 市值 $0.57B
        - 最新可获取年收入 $0.935B
        - 约 0.6x 销售额
        - 授权内容基准
        - 增长更慢的传统媒体业务
      - - Getty Images
        - 市值 $0.41B
        - 2025 年收入 $0.981B
        - 约 0.4x 销售额
        - 权利管理媒体基准
        - 公开市场已计入困境和传统业务包袱
      - - ElevenLabs
        - 私有市场估值 $11B
        - $330M ARR
        - 约 33x ARR
        - 已保留的私有 AI 音频热度参照中，质量最高
        - 更广的企业语音平台，不是直接的消费者 AI 音乐同业
    notes: 可比集合有意混合了上市音乐、创作者软件、授权内容业务和一个私有 AI 音频基准。它是代表性样本，不是完整可比全集。
