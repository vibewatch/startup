companyProfile:
  summary: >-
    Suno 是一家 2022 年成立的私营 AI 音乐公司，总部位于 Massachusetts 州 Cambridge，由联合创始人兼 CEO Mikey Shulman
    领导。产品已经从提示词生成歌曲，扩展为覆盖歌词、上传、翻唱、Personas、编辑、分轨、Studio
    和移动端创作的消费者与半专业创作者工作流，并靠带付费商用权的免费增值订阅变现。公开证据支持它在消费者创意工具里达到少见的私营公司规模——截至 2026 年 2 月，付费订阅用户超过 2 million，总用户超过 100
    million，ARR 约 $300 million——但业务仍有实质尽调保留：版权诉讼、授权经济性和有限运营披露。
