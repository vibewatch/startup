  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              Suno 卖的不是音乐收听，而是 AI 辅助音乐创作。官方产品、帮助和合作材料显示，核心市场是创作者端在订阅、额度、Studio
              访问和商用工作流上的支出。免费用户获得有限每日额度且没有变现权，付费用户购买把歌曲对外分发和变现的权利。因此，纳入范围的支出包括消费者和半专业创作者订阅、追加额度、Studio 驱动的工作流支出，以及 AI
              生成曲目在流媒体、视频、电影、电视或游戏里的商业开发。Warner 合作又增加第二条路径：授权模型、艺术家选择加入、付费下载，以及与权利人利益一致的粉丝体验。


              重要相邻资金池仍应排除在 Suno TAM 之外。全球录制音乐订阅、传统 DAW 预算、现场音乐、厂牌服务和一般创作者经济收入都是重要背景，但不会自动变成 Suno
              收入。对严肃创作者而言，最接近的替代品仍是传统音乐制作软件，尤其当开源工具已经足够好。对主要需要合法背景音乐的内容团队而言，免版税曲库和相邻 AI
              配乐供应商仍是可行替代。结果是：市场真实存在，但边界比泛泛的“AI 加音乐”叙事更窄。
