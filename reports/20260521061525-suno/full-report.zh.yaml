      - number: '1.4'
        title: 里程碑、合作伙伴与负面事件
        blocks:
          - type: paragraph
            body: >-
              Suno 的时间线很重要，因为它同时呈现了快速产品扩张，以及公司试图与音乐行业关系正常化的紧迫推进。公司在 2023 年 12 月借 Copilot 分发走出隐身状态，2024 年 5 月完成重要 Series
              B，随后在 2024 年 6 月因被指大规模侵犯版权而遭 RIAA 和大型唱片公司起诉。Suno 没有放慢脚步，反而继续拓宽产品：Paul Sinclair 于 2025 年 7 月加入并担任 Chief
              Music Officer；Suno Studio 于 2025 年 9 月上线，面向更专业的工作流；公司在 2025 年 11 月宣布 $250 million Series C。同月，Warner Music
              Group 与 Suno 和解并宣布授权合作，Songkick 也转给 Suno；双方还预告 2026 年将采用更受限制的付费下载和授权模型经济性。2026 年 2 月，Suno 任命 Jeremy Sirota
              为 Chief Commercial Officer，并公开新的用户和 ARR 里程碑；2026 年 3 月，公司宣布
              v5.5。核心负面结论没有改变：Sony、UMG、欧洲权利组织和艺术家原告仍在推进，版权与训练数据风险仍然重大；后续报道又把 stream-ripping 指控和集体诉讼压力加入案件组合。
