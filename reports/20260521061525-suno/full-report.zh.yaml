      - number: '3.4'
        title: 护城河耐久性、切换成本与负面证据
        blocks:
          - type: paragraph
            body: >-
              最强证据指向的创作者切换成本只有中等。提示词、remix 和基于 DAW 的收尾都很容易多栖，开放权重也会削弱生成层本身的长期稀缺性。因此，Suno
              更能防守的资产不只是“模型质量”，而是发布权、消费者心智，最终还包括任何与授权方绑定的体验、用户自有声音和微调。Udio
              展示了授权方护城河的上行和下行：大型唱片公司和解及供给访问能提升信任，但同样的授权姿态也会让产品显得更受约束。Stable Audio 和 MusicGen
              说明商品化风险真实存在——开放或本地分发让技术能力更容易复制；但它们也强调，API、自托管和企业控制本身就是有价值的切入点。Google、Adobe、Canva 和 ElevenLabs
              加剧威胁，因为它们能把配乐或短内容创作吸收到更广平台。负面结论是：只有当生成质量与工作流粘性、创作者自由和权利安全访问打包在一起，并且体验比替代方案更好而不是更受限制时，Suno 的护城河才耐久。
