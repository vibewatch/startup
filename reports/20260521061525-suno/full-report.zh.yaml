            body: >-
              定价和转化证据指向经典免费增值消费者漏斗，并开始出现追加销售层。年度方案页面显示 Pro 为 $8、Premier 为 $24；媒体对月度页面的报道则引用 $10 和 $30。官方帮助页面显示，免费用户每天获得
              50 个额度且没有商用权；付费用户获得月度额度、追加额度购买、下载、分发权，并在耗尽月度额度后继续拥有每日 50 个额度。Billboard 对投资者材料的报道还给出异常强的消费者 SaaS
              式参与代理指标：订阅用户约 25% 的 30 天留存，以及 78% 的订阅用户周留存。Menlo 和 TechCrunch
              也把增长描述为高度依赖口碑，歌曲被分享到群聊后把听众转化为创作者。一个简单公开数学检验得到，每位付费订阅用户约贡献 $150 ARR，高于年度 Pro 定价、低于年度 Premier 定价；这与以 Pro
              为主、叠加月付、追加额度，也可能包含早期商业创作者或合作伙伴收入的组合方向一致。较弱之处在于转化透明度：2 million 付费用户相对 100 million 历史用户，只是粗略累计 2%
