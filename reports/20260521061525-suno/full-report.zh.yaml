  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 平台
      - 公开价格锚
      - 合约模式
      - 商业权利立场
      - 已知限制 / 未知项
      - 对 Suno 的含义
    rows:
      - - Suno
        - 免费；Pro 年付折合 $8；Premier 年付折合 $24
        - 自助订阅，带积分和充值
        - 付费歌曲可变现和发行；免费层不可商用
        - 付费下载上限正在 Warner 相关路线图下演变
        - 创作者变现基线强，发行用例清楚
      - - Udio
        - 独立评测：Standard 约 $10；Pro 约 $30；也有免费层
        - 自助积分，带过渡期限制
        - 付费使用通常可商用；免费层最好按署名或非商用处理
        - 本轮未能完整读取官方定价和导出文档；据报道，过渡期间导出暂停
        - 最接近的直接对手，但当前不透明和限制削弱易用性优势
      - - Mubert Render / API
        - 官方可见：Trial API 为 $49/mo；更广泛的实时定价仍部分由销售主导
        - API 和授权层级合约；也有消费者下载计划
        - 商业使用取决于计划和再授权层级
        - 各计划均禁止流媒体发行和 Content ID
        - 更像配乐基础设施竞争者，而非可发行 AI 歌曲竞争者
      - - Stable Audio
        - 官方授权层级公开；抓取文本未完全显示精确自助价格
        - 创作者加企业授权；面向大用户提供 API 和自托管
        - 声称支持社区 / 企业商业化
        - 较大组织需要企业覆盖；消费者定价不如 Suno 透明
        - 竞争点更多在技术控制和企业切入，而非休闲创作者采用
      - - MusicGen
        - $0 软件访问；本地算力成本是经济约束
        - 开源代码加本地部署
        - 公开发布权重不可商用
        - 商业团队需要其他许可证或不同模型
        - 基础生成层面临强商品化压力，但直接付费订阅威胁弱
      - - Lyria
        - 保留来源没有简单公开的创作者订阅价格
        - 面向消费者的 Gemini 入口，加 Vertex AI API / 企业包装
        - 受 Google 平台和 API 条款约束
        - 企业和平台包装比独立创作者定价更可见
        - 威胁在平台分发和捆绑，而非简单一对一价格竞争
      - - ElevenMusic
        - 免费每天最多 7 首歌；Pro 为 $9.99/mo 或 $95.90/yr
        - 消费者移动订阅，加 Music API 相邻业务
        - 商业定位积极，但详细音乐政策仍较新
        - 新入局者，与 Suno 或 Udio 相比长期证据有限
        - 价格足够低，会挤压休闲尝试预算
      - - Adobe Firefly / Canva
        - Firefly 高级功能含有限免费体验；Canva Pro 或单曲一次性费用
        - 捆绑在更宽的创作者订阅和编辑器工作流中
        - 两者都强调直接许可或商业安全使用
        - 都不是文化上病毒式传播全歌的强替代品
        - 无需专门 AI 音乐订阅，捆绑就能分流轻量配乐需求
    notes: 表格聚焦包装结构，而不是假装每家供应商都有清晰公开价格表。若第一方页面未能完整读取，“未知”或基于评测的条目会明确标注。
