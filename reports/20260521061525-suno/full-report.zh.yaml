  - id: TP004
    title: 护城河持久性 / 竞争风险登记表
    columns:
      - 护城河或风险轴
      - 为什么重要
      - 主要威胁
      - 严重性
      - 当前证据
      - 缓释措施 / 尽调问题
    rows:
      - - 授权曲库与艺人接入
        - 可改善信任、输出和变现权利
        - 授权方驱动的安全要求也会降低创作者自由度
        - 高
        - Udio 唱片公司和解，加上 Suno/Warner 与 Google/YouTube 的权利立场，说明版权准入很有价值，但也会束缚产品
        - 验证 Suno 在扩展授权体验时，能否保住导出自由度
      - - 分发入口
        - 音乐嵌进现有应用后，更容易抢到创作者注意力
        - Google、Adobe、Canva 和 ElevenLabs 能从更大的入口导入需求
        - 高
        - Gemini、Shorts、Creative Cloud、Canva 编辑器和 ElevenLabs 音频栈都处在音乐创作上游
        - 衡量 Suno 留存和转化，并与已经在这些生态内编辑的用户对比
      - - 生成模型商品化
        - 开放或本地模型会削弱核心模型能力的稀缺性
        - Stable Audio 开放权重，以及 MusicGen 式本地工具
        - 高
        - 开源可用性在提高；评测称原始质量差距仍在，但正在缩小
        - 护城河重点放在工作流资产、版权和社区上，而不只押注基础模型质量
      - - 切换成本和多平台使用
        - 低切换成本会推高获客压力
        - 创作者可以同时提示多个工具，再在 DAW 里收尾
        - 中
        - 差异化资产更多是声音、微调、已保存会话或与授权方绑定的体验，而不是通用提示词
        - 深化项目连续性、素材库和导出工作流，让 Suno 在项目中途更难被替换
      - - 产品限制反噬
        - 产品如果变得不好用，信任收益可能反噬
        - Udio 式围墙花园收紧
        - 高
        - DMN 报道称，封闭导出和受限输入引发创作者反弹
        - 让商业安全调整清晰、对用户有好处，而不是只显得防御性
      - - 现有配乐方案替代
        - 并非每个买家都需要一首完整歌曲
        - Adobe 和 Canva 能吸收简单内容音频需求
        - 中
        - 官方页面显示，免版税背景音乐和库存音频已嵌入视频工作流
        - Suno 信息传递应聚焦歌曲创作、粉丝关系、身份和更丰富输出，而不是泛化背景音乐
    notes: 风险登记表把竞争者信号视为 Suno 未来护城河的战略威胁，而不是孤立的市场事实。严重程度是尽调判断，依据是所引用的公开证据。
