      - number: '8.2'
        title: 可比框架与倍数解读
        blocks:
          - type: paragraph
            body: >-
              可比框架支持溢价，但不支持无限开价。按保留的 2026 年 5 月市值和近期收入数据，公开市场上 Spotify、Adobe、Shutterstock 和 Getty 的销售收入倍数分别约为
              4.9x、4.3x、0.6x 和 0.4x。这些同行并不完美：Spotify 是规模化音乐订阅平台，Adobe 是毛利率高得多的创作者软件套件，Shutterstock 或 Getty
              则是增长更慢、以权利管理内容为核心的公司。Suno 增速快于它们所有，因此理应有一些溢价。更贴近的私有音频热度参照是 ElevenLabs；CNBC 和 TechCrunch 称其以 $11 billion
              估值、$330 million ARR 融资，约为 33x。这说明前沿音频 AI 的私募倍数可以显著高于公开内容公司。但 ElevenLabs
              业务更宽、更企业化，也较少暴露在音乐版权诉讼中。最直接的判断是：Suno 当前已验证估值落在增长缓慢的公开媒体可比公司和泡沫化的私有 AI
              基础设施可比公司之间。因此，用「偏高」形容已验证估值，比「昂贵」更合适；若是任何传闻中的上调估值，则「偏高」比「合理」合适得多。
