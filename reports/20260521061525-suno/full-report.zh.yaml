  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 选项
      - 类别
      - 目标用户
      - 公开规模 / 包装信号
      - 关键差异点
      - 主要限制
    rows:
      - - Udio
        - 直接全歌竞争对手
        - 准专业艺人与创作者
        - 消费者订阅，加上和解后的厂牌协议
        - 在以歌曲为中心的工作流和制作人式定位上最接近
        - 授权过渡限制了导出，也制造信任与自由度之间的张力
      - - Mubert
        - API 和背景音频替代品
        - 视频应用、品牌、健康场景、UGC 工具
        - API 主导分层，带再授权逻辑；声称 28M 创作者
        - 面向嵌入式配乐使用，基础设施和权利框架很强
        - 不太适合艺人式流媒体发行和 Content ID 工作流
      - - Stable Audio
        - 技术型音乐 / 声音设计竞争对手
        - 开发者、声音设计师、企业团队
        - 创作者和企业许可证；开放权重加 API
        - 授权数据、长篇生成、自托管、inpainting、LoRa 支持
        - 相比 Suno 或 Udio，不太像会病毒式传播的消费者歌曲目的地
      - - MusicGen
        - 开源内部构建基线
        - 研究人员、爱好者、内部工具团队
        - 免费代码、需要本地 GPU、公开 demo 和预训练模型
        - 低成本试验、隐私、自动化和本地控制
        - 公开权重不可商用，人声落后于前沿消费者工具
      - - Google Lyria
        - 平台与企业级入局者
        - Gemini 用户、Shorts 创作者、应用构建者
        - Gemini 应用、Vertex AI、Media Studio、Dream Track、Artlist 和 Freepik 证明点
        - 分发入口强，加上水印和合作伙伴权利叙事
        - 更像平台表达工具，而不是创作者优先的独立订阅
      - - ElevenLabs / ElevenMusic
        - 音频套件入局者
        - 移动创作者、音频开发者、现有 ElevenLabs 用户
        - Music API 加 iOS 应用，含免费和付费层
        - 借声音、SFX、配音和现有开发者基数交叉销售
        - 音乐业务比声音主业更新，长期差异化仍未证实
      - - Adobe Firefly
        - 既有配乐替代品
        - 营销人员、剪辑师、代理商、游戏和社交创作者
        - Firefly / Creative Cloud 工作流中的高级功能
        - 通过提示词或视频上传生成商业安全的器乐配乐
        - 以器乐为先，不是文化上病毒式传播的全歌平台
      - - Canva + 素材音频工作流
        - 现状替代品
        - 轻量视频创作者和小企业
        - 内置曲库，含 Pro 曲目或一次性费用
        - 已嵌在庞大创作者工作流里，满足快速配乐需求
        - 不是前沿文本生成歌曲平台，差异化音乐创作能力有限
    notes: 行项目对比买方今天解决 AI 音乐或创作者配乐任务的主要路径；包装和规模基于公开产品页、合作公告和独立评测，尤其在第一方定价不透明时。
