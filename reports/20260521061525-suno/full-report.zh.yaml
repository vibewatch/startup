  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 法律敞口、授权模型依赖和商业化不确定性交叠之处，剩余风险最高。
    approximationNotes: 单元格位置是基于保留公开证据作出的分析判断，衡量可见缓释之后的发生概率和影响，并非管理层提供的评分模型。
    data:
      columns:
        - 中等影响
        - 高影响
        - 严重影响
        - 生存级 / 投资逻辑破裂影响
      rows:
        - label: 高概率
          values:
            - label: DSP AI 标识扩散
              tone: warning
              detail: 即便没有直接封禁，发现效率也可能走弱。
            - label: 模型质量商品化
              tone: warning
              detail: 付费留存取决于质量和工作流深度能否持续领先。
            - label: 付费权利 / 下载摩擦
              tone: negative
              detail: 迁移到授权模型可能伤害转化或留存。
            - label: n/a
              tone: neutral
        - label: 中等概率
          values:
            - label: 声音滥用事件
              tone: warning
              detail: 控制机制存在，但没有公开的执法质量数据集。
            - label: 计算成本冲击
              tone: warning
              detail: 弹性扩容有帮助，但单位经济性仍不透明。
            - label: WMG / 合作方议价力
              tone: negative
              detail: 路线图和经济条款越来越受对手方影响。
            - label: 大唱片公司案件进入裁决阶段
              tone: negative
              detail: 案件仍可能触发准备金、重训或禁令情景。
        - label: 低到中等概率
          values:
            - label: NO FAKES / 数字复制品立法提速
              tone: neutral
              detail: 立法尚未落定，但抬高了政策方向风险。
            - label: 海外著作权集体管理组织升级
              tone: warning
              detail: 跨境索赔可能放大法律杠杆。
            - label: EU GPAI 披露不合规
              tone: warning
              detail: 文档和标识缺口可能变成市场准入问题。
            - label: 不利禁令或和解经济性
              tone: negative
              detail: 这是主要的投资逻辑破裂事件，因为它同时伤害法律、产品和利润率。
    claimRefs:
      - CR005
      - CR007
      - CR011
      - CR012
      - CR022
      - CR026
      - CR029
      - CR032
      - CR041
      - CR043
      - CR045
      - CR047
      - CR049
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 最有价值的尽调问题，是法律、合作伙伴和计算风险如何同时传导到利润率、转化和估值。
    approximationNotes: 边表示方向性传导，不表示量化弹性。
    data:
      nodes:
        - id: N1
          label: 大唱片公司 / DMCA 案件
          detail: 针对 Suno 的版权和来源合法性主张。
          tone: negative
        - id: N2
          label: 海外权利行动
          detail: Koda、GEMA 及类似主张扩大地理范围。
          tone: warning
        - id: N3
          label: 授权模型义务
          detail: 合作方条款塑造下载、选择加入和路线图。
          tone: warning
        - id: N4
          label: 声音滥用事件
          detail: 复制或冒充失控可能触发政策反弹。
          tone: warning
        - id: N5
          label: 计算成本冲击
          detail: 弹性 GPU 有帮助，但成本不透明仍在。
          tone: warning
        - id: N6
          label: 付费转化 / 留存
          detail: 商业权利和最佳模型访问权驱动订阅者行为。
          tone: neutral
        - id: N7
          label: 品牌 / 企业采用
          detail: 更高价值客户在意权利和声誉。
          tone: neutral
        - id: N8
          label: 毛利率
          detail: 计算、法律和授权成本都会流入贡献利润率。
          tone: neutral
        - id: N9
          label: 资本需求 / 准备金
          detail: 不利结果可能抬高融资需求。
          tone: neutral
        - id: N10
          label: 估值
          detail: 倍数和承销信心最后调整。
          tone: neutral
      edges:
        - from: N1
          to: N3
          label: 推动授权迁移
        - from: N1
          to: N8
          label: 增加法律 / 和解成本
        - from: N2
          to: N9
          label: 扩大准备金情景
        - from: N3
          to: N6
          label: 改变用户经济性
        - from: N3
          to: N8
          label: 可能增加版税层
        - from: N4
          to: N7
          label: 损害信任
        - from: N5
          to: N8
          label: 压缩单位利润率
        - from: N6
          to: N8
          label: 驱动订阅毛利
        - from: N7
          to: N10
          label: 影响溢价叙事
        - from: N8
          to: N10
          label: 改变现金流倍数
        - from: N9
          to: N10
          label: 抬高稀释 / 风险折扣
    claimRefs:
      - CR007
      - CR011
      - CR012
      - CR026
      - CR032
