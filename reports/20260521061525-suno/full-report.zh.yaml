  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 典型 Suno 创作者旅程从低摩擦发现开始，进入重复创作和分享；当权利、用量或高级编辑变得重要时，开始变现。
    approximationNotes: 旅程阶段由官方定价 / 帮助页、应用商店列表、Microsoft 分发材料和公开创作者评测证据推断，不是内部漏斗分析。
    data:
      nodes:
        - id: discover
          label: 发现和好奇
          detail: 用户通过病毒式分享、应用商店浏览或 Microsoft Copilot 接触 Suno，并知道自己无需音乐训练，只靠简单 prompt 就能创作完整歌曲。
        - id: first-song
          label: 首次免费创作
          detail: 用户试用免费套餐，生成几首歌，并测试 prompt、哼唱或上传音频，不需要初始现金投入。
        - id: repeat-and-share
          label: 重复创作和社交分享
          detail: 如果输出新鲜或有用，用户会分享歌曲、关注创作者、浏览趋势，并回到网页端或移动端继续迭代更多想法。
        - id: paid-conversion
          label: 商业权利或产能驱动付费转化
          detail: 当月度用量、商业权利，或更长上传、分轨、优先队列等工具比免费试用更重要时，创作者会升级。
        - id: advanced-expansion
          label: 高级编辑与合作伙伴入口
          detail: 更严肃的用户会转向 Studio、更高阶工作流、语音驱动创作，或 Copilot 这类合作伙伴入口；版权合作方的变化也会改写未来行为。
