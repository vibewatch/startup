      - number: '2.2'
        title: 规模测算视角与区间
        blocks:
          - type: paragraph
            body: >-
              公开市场规模证据方向上有用，但方法论很乱。Grand View Research 估算，纯生成式 AI 音乐市场 2023 年为 $440 million、2024 年为 $569.7 million、2030
              年达到 $2.79 billion；这说明品类增长很快，但还不是巨型市场。Business Research Insights 给出的起点大得多：2026 年 $1.98 billion，2035 年
              $18.04 billion。这一分歧本身就是尽调结论：分析师测的是纯音乐生成、更广义的 AI 音频工具，还是更宽的内容创作栈，TAM 会显著改变。


              相邻视角更大。MIDiA 预计 2030 年音乐创作者达到 198.2 million，创作者工具板块达到 $10 billion；IFPI 则把 2024 年录制音乐批发收入列为 $29.6
              billion。这些更大的数字有意义，因为它们显示 Suno 可以从哪里拿份额或切入合作，但它们并不等于 Suno 的直接市场。更受证据约束的 SAM 视角，是把 Suno 当前付费价格与 MIDiA
              的创作者基数相乘。若 2030 年创作者基数的付费渗透率为 2%-5%，年度付费创作者支出约为 $0.38-$2.85 billion；只有渗透率到 10%，区间才会超过 $5
              billion。相比把所有录制音乐或创作者经济收入都视为可获得收入，这才是更健康、更可信的估值锚。
