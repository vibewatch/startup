        title: 披露缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              因此，财务结论是混合的：Suno
              在漏斗顶部似乎已经拥有真实订阅收入质量，但披露质量尚不足以支撑传统承销。公开来源足以得出几项结论：自助订阅是核心引擎；专业工作流功能扩大了定价权；业务规模已经大到让唱片公司围绕经济基准谈判，而不是讨论市场是否存在。公开来源还不足以证明标准化毛利率、消费者与企业收入组合、授权抽成、单曲服务成本或和解后法律责任。同样重要的是，Warner
              和解经济条款仍保密，而剩余唱片公司诉讼还在进行；因此，决定长期贡献利润率的两项最重要输入——计算和权利付款——仍大体不透明。投资者可以从公开记录承销动能、消费者需求和部分资本充足性；但还不能承销可持续自由现金流转化。在
              Suno 更具体地披露利润率结构、现金跑道和授权负担之前，合理立场是把公司视为高增长，但耐久性仍受证据约束。
