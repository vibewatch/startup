        blocks:
          - type: paragraph
            body: >-
              最难的财务问题在毛利以下。Sacra 认为 Suno 的主要支出是 GPU 计算，且规模是薪酬的数倍；这比纯软件利润率模型更符合长音频生成经济性。产品方向可能同时增加变现空间和成本复杂度：Studio 仅限
              Premier，WavTool 把浏览器 DAW 技术带入内部，Warner
              的授权模型路线图又加入仅付费下载、月度下载上限和额外付费下载机制。这些变化可以提高每付费用户平均收入，但也意味着额外计算、存储、审核和潜在授权分成。法律阴影仍然重大。RIAA 支持的起诉书称 Suno
              复制录音训练模型，并称 Suno 基于该系统收取月费，同时寻求禁令和赔偿。法院记录显示，即便 Warner 单独和解，主案在 2026 年 5 月仍然活跃。Suno
              已披露规模和新融资足以避免看起来马上缺钱，但已审阅来源没有披露在手现金、烧钱速度、现金跑道、债务或法律准备金。
