      - number: '2.3'
        title: 买方、用户与付费方分层
        blocks:
          - type: paragraph
            body: >-
              Suno 的买方地图很混杂。Free
              方案清楚面向爱好者和首次创作者：用户和付费方是同一个人，任务是实验，变现明确不在桌上。付费自助套餐对应半专业创作者和独立音乐人，他们需要外部分发、商用权，以及足够额度来持续发布。Suno Studio
              进一步上探市场，加入多轨编辑、分轨提取、录音、速度控制，并能导出回既有 DAW。即便正式企业销售动作尚未可见，制作人、作曲人和小型工作室工作流也因此变得可信。


              商用权文档还打开了代理机构和内容团队用例，因为付费输出可用于电影、电视、电子游戏、YouTube 和 TikTok。更往外，是 Warner
              交易创造的独立合作伙伴分层：唱片公司、艺术家和粉丝体验运营方通过授权模型、艺术家选择加入和付费下载参与经济分配。公开证据尚未支撑的是开发者分层。已审阅的 Suno 定价、博客和帮助材料没有显示公开 API、API
              定价或公开开发者文档；因此，在管理层拿出真实文档和客户之前，任何 API 驱动的 TAM 都应视为推测。
