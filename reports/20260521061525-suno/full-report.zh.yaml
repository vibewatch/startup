  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与公开规模
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Suno 已有真实收入规模，但还没有经审计的财务清晰度。TechCrunch 报道，Suno 2025 年 11 月 Series C 的投后估值为 $2.45
              billion，此前公司称年收入已达到 $200 million。到 2026 年 2 月下旬，TechCrunch、Billboard 和 Music Business Worldwide 都报道其拥有 2
              million 付费订阅用户和 $300 million ARR，平台累计使用人数超过 100 million。这个轨迹意味着运行率在约三个月内跃升很快，但公开记录混用了“年收入”和“ARR”术语，没有与
              GAAP 收入、递延收入或经流失调整的订阅收入做调节。收入模式本身仍明显以订阅为主：官方定价文件只暴露自助式 Free、Pro 和 Premier 分层，公开 API 或企业定价仍缺席。正确解读是：Suno
              已证明消费者愿意大规模付费，但公开来源仍无法把经常性订阅收入、合作伙伴收入和一次性变现层清楚拆开，尚不足以完整承销。
