        - 订阅者可将订阅期间创建的歌曲变现、分发、同步授权和下载
        - 合同权利不等于法定版权
      - - 免费层限制
        - 明确限制
        - Basic 层生成
        - 免费歌曲仅限非商业用途，并被视为 Suno 拥有的输出
        - 公开文档没有说明，未来授权模型规则是否会改变追溯处理
      - - 用户歌词与上传素材权属检查
        - 明确要求
        - 歌词和上传源文件
        - 用户保留原创歌词权利，处理前必须拥有上传素材
        - 除勾选框外，执行细节没有公开说明
      - - 提示词审核与 DMCA
        - 明确描述
        - 生成与公开分享
        - 艺术家姓名、商标词、贬损语言和脏话可能触发拦截或下架
        - 公开政策没有披露误杀率或申诉统计
      - - 公开分享默认值
        - 明确描述
        - Link Only 和 Public 分发
        - 歌曲默认是 Link Only，但公开分享可让曲目出现在个人主页或首页展示面
