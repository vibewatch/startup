  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 消费者规模与分层组合
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Suno 首先是大众消费者和半专业创作者平台，而不是窄口径销售的企业工具。到 2026 年 2 月下旬，多家媒体报道 Suno 已超过 100 million 历史用户和 2 million
              付费订阅用户；而 Billboard 仅在几个月前还报道其订阅用户为 1 million，意味着付费增长极快。官方关于页面和应用商店页面强化了同一模式：Suno
              称自己服务从首次创作者到资深词曲作者的所有人，移动端页面同样面向浴室歌手、爱好者和更严肃的创作者。应用商店信号重要，因为它们是公司披露之外少数公开分母：Apple 显示 257,000 个评分、4.9
              星，Google Play 显示 1.61 million 条评论和 10 million+ 下载。合起来看，这些信号指向宽广的全球漏斗顶部和大量移动端参与，尽管 Suno
              仍未发布活跃用户、地域拆分或按分层的实时免费转付费率。
