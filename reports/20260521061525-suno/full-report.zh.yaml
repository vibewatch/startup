      - number: '2.5'
        title: 约束、矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              同一组证据也说明，不能把 Suno 的市场按无摩擦假设承销。Adobe 创作者把成本、输出质量和训练透明度列为主要障碍，69% 担心自己的内容可能未经许可被用于训练 AI。Suno 自己的 California
              披露确认，模型使用数千万个公共音乐文件并继续收集数据；RIAA 起诉书则指控其大规模侵权并产生市场替代型输出。IFPI 和 Copyright Office
              都显示政策基线仍在移动：行业希望训练经授权、艺术家有控制权，而 Copyright Office 的训练报告仍只处于出版前最终定稿状态。


              所有权也很乱。Suno 当前帮助页面强调商用权，而不是保证版权；并称登记取决于重大人类贡献。Digital Music News 报道，公司在 Warner 交易后撤回了更接近所有权的表述。即便 Suno
              自己的产品文档，在上传限制上也相互冲突；2026 年具体下载上限时间表仍未公开。最后，锁定效应看起来有限，因为许多创作者已经在多个 AI 工具之间多栖。因此，市场真实存在，但其法律、运营和经济含义比标题式 TAM
              展示更模糊。
