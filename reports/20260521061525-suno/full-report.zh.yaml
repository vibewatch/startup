  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 创作工作流与编辑界面
        blocks:
          - type: paragraph
            body: >-
              Suno 当前产品界面已经远不止一次性文本生成歌曲玩具。官方工作流现在从便于快速提示的 Simple mode 开始，但很快进入分层创作路径，包含 Custom mode、用户提供歌词、Upload
              Audio、Covers、Personas、Song Editor 控件、分轨提取和 Studio。这很重要，因为公司明显想同时服务首次创作者和更严肃的制作人，而不是从第一次点击就把他们推进传统
              DAW。Upload Audio 让创作者从自己的声音而非只有文本开始；Covers 让他们在保留旋律的同时重塑自己的歌曲；Personas 让他们把一首歌的人声和氛围复用于新生成。最重要的产品变化是，Suno
              现在把编辑视为核心工作流，而不是下载后的清理步骤：官方页面强调段落替换、歌词重写、滑块、分轨导出和 MIDI 交接。移动端也强化同一方向，Android 页面描述了在手机上输入提示、哼唱、上传音频、remix
              和类似 Studio 的编辑。
