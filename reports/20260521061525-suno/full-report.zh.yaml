        - 未披露公开延迟或生成失败率
      - - 从自写歌词开始
        - 带入自己的主歌、hook 或完整歌词稿
        - 使用 Custom mode，粘贴歌词，也可围绕歌词生成配乐
        - 官方帮助称，用户保留自己创作歌词的权利
        - 公开文档没有量化模型能多稳定地保留逐行歌词意图
      - - 从已有录音出发
        - 把片段、旋律或音效变成歌曲
        - 通过 Upload Audio 导入设备文件或录音，再基于素材继续创作
        - 官方帮助说明了文件导入、录音，以及付费层级更长的上传上限
        - 用户必须拥有源素材；公开文档没有说明输出质量上限
      - - 重做已有歌曲
        - 让 Suno 里已有歌曲现代化，或换一种风格
        - 用 Covers 在保留旋律的前提下改风格，或用 Remaster 把旧曲推向新版音质
        - 官方资料把 Covers、Personas、Remaster 直接绑定到 V4 时期的质量升级
        - Covers 仅限用户自己的歌曲，产品形态仍近似测试版
      - - 保持一致的创作身份
        - 复用上一首歌的人声和气质
        - 先创建 Persona，再在 Custom mode 中调用它生成新歌
        - 官方文档称，Personas 能保留人声、风格和气质，可设为公开或私密
        - 没有公开基准显示，Personas 跨差异很大的曲风时还能多稳定
      - - 在 Suno 之外收尾
        - 把生成片段移入专业 DAW
        - 最多导出 12 条分轨；在 Studio 中可导出音频或 MIDI，供后续编辑
        - 官方 Studio 与落地页明确把 DAW 交接作为卖点
        - 关于分轨分离质量的独立公开验证仍然很少
    notes: 收益单元主要依赖官方工作流说法；独立确认最强的部分是 Studio 的存在和相对成熟度，而不是硬性能指标。
