  - id: TV005
    title: 破坏投资逻辑和止损触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 剩余唱片公司经济条款转为惩罚性
        - 和解或法院态势意味着不经济的版税、保底或重训要求
        - 当前倍数不能再只靠增长承销
        - 立场从偏高下调为昂贵 / 避免投入新资金
      - - 授权上线伤害付费留存
        - 下载限制生效后，可见流失飙升、降级潮或 ARPPU 下滑
        - 乐观和基准情景失去核心持续性假设
        - 将估值重切向悲观区间
      - - 下游平台压低 AI 音乐曝光
        - 推荐或歌单排除超出 Deezer 式政策，变得普遍
        - 即使生成仍合法，发现流量和版税池也会走弱
        - 下调收入和终局倍数
      - - 下一轮在无新增披露下突破 $5B
        - 毛利率、流失和股权结构表数据仍缺位时，价格大幅上升
        - 融资本身会成为泡沫证据，而不是基本面支撑
        - 除非条款含强下行保护，否则放弃
      - - 优先股堆叠转向不友好
        - 新的棘轮、叠加清算优先权或高级工具排在普通股之前
        - 表面优先股估值夸大普通股权益价值
        - 按完全摊薄和下行情景回款重估，而不是按表面投后估值
    notes: 触发项是会迫使重新定价的实际决策点，而不是可以无限期观察的背景风险。
    claimRefs:
      - CV014
      - CV037
      - CV038
      - CV041
      - CV042
      - CV048
      - CV050
      - CV052
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 和解经济性
        - Warner 与剩余唱片公司的版税、保底、股权和训练数据授权条款
        - 这是毛利率承销中最清晰的缺失变量
        - CFO、GC 和外部律师备忘录，加已签署协议
      - - 权利变更后的队列留存
        - 下载限制前后，按队列拆分的付费流失、降级和 ARPPU
        - 现在收入持续性比历史采用率更重要
        - 增长负责人和产品分析复盘
      - - 毛利率桥
        - 按套餐拆分的单次生成算力、存储、审核和授权负担
        - 估值取决于 ARR 有多少能转成贡献毛利
        - 财务模型走查和云厂商摘要
      - - 股权结构表和条款
        - 优先权、棘轮、认股权证和任何高级索偿
        - 表面投后估值可能夸大普通股权益价值
        - 对公司章程和投资者权利文件做法律尽调
      - - 私有可比证据
        - 更接近的 AI 创作者同业当前估值和收入区间
        - 能让相对上市可比公司的溢价讨论更精确
        - 投资人访谈、老股数据和投行市场反馈
      - - 监管和平台敞口
        - 跨 DSP 和合作伙伴界面的分发、审核和版税政策敞口
        - 即便没有法律禁令，Deezer 式政策扩散也可能冲击变现
        - 与 BD 和信任安全团队一起梳理政策
    notes: 这些问题最可能改变价格判断，不是泛泛的尽调清单。
    claimRefs:
      - CV038
      - CV039
      - CV046
      - CV048
      - CV050
