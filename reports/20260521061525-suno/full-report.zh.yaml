  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 已验证估值与入场基线
        blocks:
          - type: paragraph
            body: >-
              保留记录中唯一硬估值锚，是 2025 年 11 月的 Series C。TechCrunch、Music Business Worldwide、PR Newswire、Goodwin 以及 Suno
              自己的公告都指向同一组信息：融资 $250 million，投后估值 $2.45 billion，同时披露 $200 million 年收入运行率和近 100 million 累计用户。到 2026 年 2
              月，多家媒体又报道 Suno 拥有 2 million 付费订阅者和 $300 million ARR。这个顺序对承保很重要。若用该轮披露收入对比已验证估值，Suno 的定价约为
              12.3x。若用同一优先股估值对比后来的 ARR，隐含倍数降至约 8.2x。换句话说，如果 2026
              年增长能持续，已验证价格并不明显荒唐。但它也不便宜。这个价格已经假设公司能在产品权利、下载规则和训练数据经济性仍受法律压力冲击时，把异常强的消费者采用转化为持久变现。
