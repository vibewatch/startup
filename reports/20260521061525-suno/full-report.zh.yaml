              公开融资史显示，Suno 从早期消费者发布迅速走到后期私营公司规模。Lightspeed 在 2024 年 5 月领投 $125 million Series B，当时投资方称已有超过 10 million
              人使用产品。下一步发生在 2025 年 11 月，Suno 完成由 Menlo Ventures 领投的 $250 million Series C，投后估值 $2.45
              billion，NVentures、Hallwood Media、Lightspeed 和 Matrix 也参与。为本章审阅的公开来源意味着累计融资约 $375 million，并把 Series C
              估值视为最新披露锚点。运营规模方面，Suno 在 2026 年 2 月公开称已超过 2 million 付费订阅用户、100 million 总用户和 $300 million ARR，高于 Series C
              前后引用的 $200 million 年收入。这些数字说明，作为 AI 音乐产品，Suno
              的消费者转化和收入速度异常强；但重要缺口仍在：已审阅来源没有披露当前员工数、盈利能力、毛利率、烧钱速度、现金跑道或企业客户集中度。
