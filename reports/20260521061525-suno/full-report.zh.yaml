  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 按竞争者类别划分的格局
        blocks:
          - type: paragraph
            body: >-
              Suno 的竞争集合比“其他 AI 歌曲应用”更宽。最接近的直接对手是 Udio，因为它同样瞄准带人声的完整歌曲、remix 式迭代和付费商用。第二类包括 Mubert、Stable Audio
              等基础设施或配乐优先产品；它们通常更适合理解为背景音频、API 或技术控制替代品，而不是病毒式消费者歌曲品牌。第三类是开源或内部自建：MusicGen
              和更新的本地栈很重要，因为它们降低订阅依赖、改善隐私，也让生成层更容易商品化。第四类是相邻平台进入者和替代品。Google 的 Lyria 搭载 Gemini、Vertex 和
              YouTube；ElevenLabs 正把大型音频套件扩展到音乐和移动端；Adobe Firefly 面向商业安全的器乐配乐；Canva 的音频工作流加库存曲目已经解决最简单的创作者配乐任务。结果是，Suno
              面对的不是一个单一巨型竞争者，而是数个各自占据价值链一段的对手——歌曲质量、API 访问、授权安全、社交分发或既有工作流份额。
