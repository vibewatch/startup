      - - 训练数据披露
        - 按加州法律明确描述
        - 音乐模型数据集
        - Suno 称其大规模使用公开可得的音乐文件、元数据和部分用户数据
        - 披露口径很宽，没有列出具体数据集或授权方
      - - 水印与来源证明
        - 部分描述
