chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Suno 的自我定位不是通用 AI
              实验室，而是一家要放大想象力、降低音乐创作门槛的音乐公司。官方材料称，平台服务从浴室歌手到成熟艺术家的所有人；产品把文本提示变成带人声和配器的完整歌曲，现在还支持更深的编辑和音频上传。商业模式是免费增值。Free
              方案仍让用户体验核心生成能力，但付费 Pro 和 Premier 方案解锁明显更多额度、高级模型、编辑功能、新创歌曲商用权、个人声音工具，以及最高档的 Suno Studio。这套结构很关键：Suno
              变现的是创作意图，不是被动收听库存；当前政策组合也越来越把重度用户推向付费转化。官网支持 Cambridge 总部，以及 Cambridge、New York、Los Angeles
              三地办公室，但除了产品和套餐设计，并未披露员工数或更广泛的运营指标。
