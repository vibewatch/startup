      - number: '7.2'
        title: 滥用、模型与治理控制
        blocks:
          - type: paragraph
            body: >-
              第二层风险是产品滥用，加上外部可观测性弱。Suno 的 2026 年 3 月条款明确允许公司使用用户提交内容来训练、开发、微调或以其他方式改进服务及配套模型；California AB 2013
              披露则称，音乐模型训练使用数千万个公开可得的音乐文件和元数据，以及去掉结构化标识符后的部分用户内容和活动信息。相比许多同业，这已经披露得更多，但授权与未授权内容的混合比例、合成数据占比，以及用户生成内容在后续模型版本中的准确作用，仍没有答案。滥用控制方面，Suno
              确实有可见机制：包含名人姓名、受版权保护词项或辱虐内容的提示词可能被拦截；歌曲默认只能通过链接访问；用户可以举报版权侵权或不当内容曲目；语音模型按规则只应像用户自己的声音，若并非本人声音，还应有验证和移除权。但同一个官方
              v5.5 发布也扩大了风险面：公司推出私有 Voices
              和自定义模型，同时明确表示未来计划开放语音分享。因此，治理是真实存在的，但还没有被充分证明。公开材料讲的是规则和流程，不是错误率、下架量、冒名投诉或漏拦率。投资人真正要问的不是 Suno
              有没有政策——它有——而是当语音逼真度、自定义调校和商业使用权叠加到一个已经受版权审视的产品上时，这些控制能否规模化顶住。
