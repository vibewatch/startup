  - id: FU002
    title: 采用 / 部署路径
    type: flow
    layout: wide
    summary: Suno 公开可见的采用循环不靠企业采购，而围绕消费者发现、自助创作、移动端复用、付费创作者转化和合作伙伴扩展展开。
    approximationNotes: 这张流程图映射的是可见公共渠道和循环，不是内部转化率；节点重要性反映来源出现频率和已披露规模代理指标。
    data:
      nodes:
        - id: viral
          label: 病毒式或自然发现
          detail: 用户从朋友、信息流或音乐行业报道里听到 AI 歌曲，进而想自己做一首。
        - id: selfserve
          label: 自助免费账户
          detail: Suno 用带每日点数的免费方案承接需求，让任何人都能很快开始生成歌曲。
        - id: mobile
          label: 移动端复用
          detail: iOS 和 Android 商店页面有大量评论，说明许多用户会回到 App 入口，而不只是用桌面端。
        - id: paid
          label: 付费创作者转化
          detail: 商业权利、月度点数和高级功能，把一部分反复使用的创作者转成付费订阅者。
        - id: copilot
          label: 合作伙伴分发
          detail: Microsoft Copilot 把 Suno 带给非音乐人；这些用户可能从合作伙伴入口进入，而不是从 Suno 自有 App 进入。
        - id: rights
          label: 权利合作方层
          detail: WMG 及相关行业关系，可能改变未来授权模型、下载和用户许可的扩展方式。
      edges:
        - from: viral
          to: selfserve
        - from: selfserve
          to: mobile
        - from: selfserve
          to: paid
        - from: copilot
          to: selfserve
        - from: paid
          to: rights
        - from: mobile
          to: paid
    claimRefs:
