  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Suno 现在同时依赖权利合作方、分发合作方、下游平台和大规模 GPU 基础设施。
    approximationNotes: 节点是保留公开材料中最可见的外部依赖；这不是穷尽式供应商地图。
    data:
      nodes:
        - id: D1
          label: Suno 核心平台
          detail: 提示词到歌曲、编辑、声音和 Studio 工作流。
          tone: neutral
        - id: D2
          label: Warner Music Group
          detail: 和解、授权模型、选择加入、Songkick。
          tone: warning
        - id: D3
          label: Microsoft Copilot
          detail: 提示词驱动获客和合作伙伴分发入口。
          tone: neutral
        - id: D4
          label: Modal GPU 基础设施
          detail: 数千 GPU 规模的推理和批量预处理。
          tone: warning
        - id: D5
          label: 用户提交内容和声音
          detail: 训练反馈、自有声音模型、定制模型。
          tone: warning
        - id: D6
          label: 开放网络 / 已披露训练语料
          detail: 按 AB 2013 披露的公开互联网音频和元数据。
          tone: warning
        - id: D7
          label: DSP 政策层
          detail: 流媒体平台上的 AI 标识和推荐待遇。
          tone: warning
        - id: D8
          label: 付费订阅者
          detail: 商业权利和高级功能为模型供血。
          tone: positive
        - id: D9
          label: 监管机构 / 权利人
