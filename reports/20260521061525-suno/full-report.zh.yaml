  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管压力
        blocks:
          - type: paragraph
            body: >-
              Suno 最大的剩余风险仍是法律，而不是单纯的技术。RIAA 支持的诉状于 2024 年 6 月在马萨诸塞州提交，把 Suno 描述成一个建立在未授权复制录音之上的商业音乐生成器；公开的
              CourtListener 案卷显示，案件已经走过证据开示、修订排期令，并在 2025 年 9-10 月围绕修改诉状发生争执。Billboard 和 Complete Music Update
              随后报道称，原告试图加入 YouTube 抓流和 DMCA 反规避理论；Suno
              则主张，这些新增主张是在绕开直接的合理使用之争。关键在于，下行风险已不再只押在一个法理问题上。普通侵权败诉、数据来源合法性败诉，或与模型再训练绑定的禁令，都可能以不同方式挤压产品和现金流。Warner Music
              Group 于 2025 年 11
              月宣布和解及合作后，法律图景并没有更容易承保，反而更难。这里保留的可访问一手案卷摘录，截止时间早于任何因该公告产生的公开撤诉文件，因此无法从同一份一手记录独立确认和解后的准确原告阵容。再叠加 Koda
              在丹麦的案件、MBW 关于 GEMA 也已起诉的报道、U.S. Copyright Office 的训练报告、NO FAKES 法案，以及 EU AI Act 对 GPAI
              的义务，暴露面已经层层堆起：版权、数字复制品、透明度、训练数据披露问题都仍未落地。
