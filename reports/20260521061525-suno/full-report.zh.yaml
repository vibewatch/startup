      - number: '3.3'
        title: 定价、包装、信任与分发
        blocks:
          - type: paragraph
            body: >-
              包装差异很重要，因为它们揭示各家认为价值会在哪里沉淀。Suno 用免费增值阶梯直接向创作者变现，并控制分轨、高级编辑、Studio 访问和商用权。Udio
              似乎保留了消费者订阅模式，但可用证据仍主要来自二手摘要，因为本次工作中官方页面无法完整读取。Mubert 围绕权利架构包装价值：应用内音频、用户导出再授权，以及严格分发排除。Stable Audio
              把市场分成创作者授权和企业基础设施；MusicGen 广泛开放代码，但公开权重保持非商用。Google 和 Adobe 都强调信任：Google 把 Lyria 与水印、C2PA 和伙伴权利主张配套，Adobe
              则把 Firefly 营销为用于内容创作的商业安全器乐。分发杠杆同样不均衡。Google 带来 Gemini、Vertex、Dream Track 和 YouTube；Adobe 和 Canva
              拥有已经承载数百万视频工作流的创作界面；ElevenLabs 带来 API、创作者工具，以及现在的 iOS 音乐发现。这些相邻渠道意味着 Suno
              的风险不只是“更好的歌曲模型出现”，还包括“足够好的音乐被打包进更大的创作者生态”。
