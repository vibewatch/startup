- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in operating model
  - Public evidence
  - Key dependency
  - Technical risk
  rows:
  - - Prompt intake layer
    - Collects prompts from Simple mode, Custom mode, lyrics fields, mobile, and Copilot
    - Official site, help docs, Google Play listing, and Microsoft blog all describe prompt-first entry points
    - Prompt parsing and cross-surface UX consistency
    - Public docs do not quantify prompt adherence or latency across surfaces
  - - Lyric-assist layer
    - Generates or conditions lyrics before song generation
    - Suno documents ReMi in Custom mode, while Rolling Stone reported V3 used ChatGPT for lyrics and titles
    - Stable routing between lyric generation and song generation
    - Current commercial lyric stack after V3 is not fully disclosed
  - - Core song generation model family
    - Produces full songs with vocals and instrumentals
    - Official timeline covers V2 through V5, and V4 release language emphasizes audio, lyric, and vocal improvements
    - Model-quality progress and licensed-data transition
    - No reviewed primary source explains the current model architecture in public technical detail
  - - Transformation and editing layer
    - Applies Covers, Upload Audio, Remaster, crop/replace, and Song Editor controls after initial generation
    - Official product and help materials show section replacement, restyling, upload-based creation, and remaster flows
    - Reliable alignment between original source, edits, and regenerated sections
    - Public sources do not expose failure modes, rollback behavior, or deterministic edit controls
  - - Export and distribution layer
    - Handles stems, MIDI, downloads, sharing, mobile playback, and Copilot output delivery
    - Studio and landing pages market audio/MIDI export; paid-rights docs and WMG roadmap govern downloads
    - File compatibility, rights gating, and partner policies
    - Download rules are changing again under the licensed-model roadmap
  - - Inference and orchestration layer
    - Runs pre-processing and model inference at scale
    - Modal says Suno uses thousands of GPUs, chains multiple model steps, and auto-scales around peaks
    - GPU availability, cloud pricing, and partner infra
    - No public product SLA or queue-depth disclosure exists
  - - Training and compliance layer
    - Feeds model training and enforces safety constraints
    - California disclosure, Bark materials, moderation docs, and litigation filings expose parts of the stack
    - Rights clearance, user data handling, and policy enforcement
    - Training-data legality and provenance remain contested in court and not fully transparent
  notes: This architecture map is a synthesis of what reviewed public sources actually expose. It distinguishes concrete workflow and infrastructure evidence from model-internal details that remain undisclosed.
