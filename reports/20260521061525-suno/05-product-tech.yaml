- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user job
  - Current public status
  - Differentiation signal
  - Diligence gap
  rows:
  - - Simple mode prompt-to-song
    - Turn a quick idea into a complete song fast
    - Core live workflow
    - Lowest-friction text-to-song entry point with no production setup required
    - Need public data on conversion, generation latency, and quality variance by prompt type
  - - Custom mode and lyric controls
    - Add lyrics, structure, and more explicit direction
    - Core live workflow
    - Separates lyrics from style guidance and exposes more control than simple prompting
    - No public explanation of how lyric conditioning affects model routing or cost
  - - Upload Audio and Covers
    - Start from owned audio or transform an existing self-created song
    - Live, with Covers still described as beta
    - Moves Suno beyond blank-page prompting into transformation and reinterpretation workflows
    - Need clear public rules on acceptable source material, fidelity loss, and failure rates
  - - Personas
    - Carry a reusable vocal/style identity across new songs
    - Live, described as beta/early access in launch materials
    - Preserves vocals, vibe, and style as a reusable asset instead of a one-off output
    - Need public limits on how often Personas hold identity consistently across genres and edits
  - - Song Editor and Suno Studio
    - Rewrite sections, reorder arrangements, and work on a DAW-like timeline
    - Live but Studio still reads as beta
    - Pushes Suno toward iterative production rather than one-shot generation
    - Need public reliability, collaboration, and project-file durability information
  - - Stem and MIDI export
    - Split tracks and continue work in another DAW
    - Live in official surfaces
    - Exports up to 12 time-aligned WAV stems and, in Studio, audio plus MIDI handoff
    - Need independent proof on separation quality and stem consistency across complex mixes
  - - Mobile and Copilot surfaces
    - Generate, edit, and share from phone or through Copilot
    - Live distribution surface
    - Extends Suno into mobile creation and Microsoft prompt flows without extra music software
    - Need public metrics on mobile retention, Copilot usage, and parity versus desktop features
  notes: Rows focus on the modules and workflows repeatedly visible in official product, help, mobile, and partner sources as of 2026-05-21; this is not a full SKU list.
