- id: rights-moderation-and-data-controls
  title: Rights, moderation, and data controls
  body: 'Suno’s rights and safety position is more explicit than its model architecture. The contractual picture is straightforward: paid subscribers get commercial use rights and a wide distribution surface, while free-tier songs remain non-commercial and are treated as Suno-owned outputs. But the company also repeatedly distinguishes those contractual rights from copyright itself; official materials warn that commercial use permission does not guarantee copyright protection for AI-heavy songs, especially in the US, though user-written lyrics may remain separately protectable. On abuse controls, Suno’s own help center says the product blocks requests containing well-known artist names, copyrighted or trademarked terms, derogatory language, and excessive profanity, and can remove material or follow DMCA procedures after publication. The deeper trust question is training data. Suno’s California disclosure now admits the models were trained on publicly available music files and metadata from
    the open internet, plus user content and activity data, with corpus size described in the tens of millions. That disclosure is clearer than older public materials, but it does not eliminate litigation risk: the RIAA-backed complaint directly alleges large-scale copying of copyrighted recordings for training. The provenance picture is also incomplete. Suno publicly claimed inaudible watermark detection at the V3 launch, yet reviewed current sources do not provide a user-verifiable watermark or provenance tool.'
