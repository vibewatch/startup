chapter:
  number: 5
  title: Product & Technology
  summary: Suno has evolved from prompt-only song generation into a broader creation workflow that now spans Custom lyrics, Upload Audio, Covers, Personas, Song Editor, Studio, stem export, mobile creation, and Microsoft Copilot distribution. The public record is strong on version milestones, rights rules, and infrastructure scale, but still weak on the current commercial model architecture, public reliability metrics, and user-verifiable provenance controls.
sections:
- id: creation-workflow-and-editing-surface
  title: Creation workflow and editing surface
  body: 'Suno’s current product surface is much broader than a one-shot text-to-song toy. The official workflow now starts with Simple mode for fast prompting, but moves quickly into a layered creation path that includes Custom mode, user-supplied lyrics, Upload Audio, Covers, Personas, Song Editor controls, stem extraction, and Studio. That matters because the company is clearly trying to serve both first-time creators and more serious producers without forcing them into a traditional DAW from the first click. Upload Audio lets creators start from their own sounds rather than text alone, Covers lets them restyle their own songs while preserving melody, and Personas let them reuse a song’s vocals and vibe across new generations. The most important product shift is that Suno now treats editing as a core workflow, not just a post-download clean-up step: official pages emphasize section replacement, lyric rewrites, sliders, stem export, and MIDI handoff. Mobile surfaces reinforce the same direction,
    with the Android listing describing prompt input, humming, audio upload, remixing, and Studio-like editing from the phone.'
