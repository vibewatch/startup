- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / policy
  - Current public status
  - Scope
  - Reader implication
  - Gap / caveat
  rows:
  - - Paid commercial use rights
    - Explicitly granted
    - Paid generations
    - Subscribers can monetize, distribute, sync, and download songs created while subscribed
    - Contract rights are not the same as statutory copyright
  - - Free-tier restrictions
    - Explicitly restricted
    - Basic-tier generations
    - Free songs are non-commercial and treated as Suno-owned outputs
    - Public docs do not explain whether future licensed-model rules will change retroactivity
  - - User lyric and upload ownership checks
    - Explicitly required
    - Lyrics and uploaded source files
    - Users keep rights to original lyrics and must own uploaded material before processing
    - Enforcement detail beyond checkboxes is not publicly described
  - - Prompt moderation and DMCA
    - Explicitly described
    - Generation and published sharing
    - Artist names, trademarked terms, derogatory language, and profanity can trigger blocks or takedowns
    - Public policy language does not disclose false-positive or appeals statistics
  - - Public sharing defaults
    - Explicitly described
    - Link Only and Public distribution
    - Songs are Link Only by default, but public sharing can place tracks on profiles or homepage surfaces
    - Link Only is not truly private once shared
  - - Training-data disclosure
    - Explicitly described under California law
    - Music model datasets
    - Suno says it uses publicly available music files, metadata, and some user data at large scale
    - The disclosure is broad and does not enumerate exact datasets or licensors
  - - Watermarking and provenance
    - Partially described
    - Output identification
    - V3 materials referenced inaudible watermark detection and Bark materials referenced a classifier
    - Reviewed current sources do not expose a user-facing verifier or current technical spec
  - - Rights-holder transition controls
    - Explicitly described in WMG roadmap
    - Future licensed-model platform
    - Upcoming models add opt-in artist identity controls and paid-download restrictions
    - The roadmap is partner-led and not yet fully implemented
  notes: Rows mix contractual rights, moderation policy, data disclosure, and roadmap controls. They do not prove technical effectiveness; they show only what reviewed public materials currently state.
