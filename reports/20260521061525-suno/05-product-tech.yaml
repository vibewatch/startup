- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Suno workflow
  - Measurable benefit / public proof
  - Known limitation
  rows:
  - - Start from an idea
    - Write a short prompt and get a song draft quickly
    - Use Simple mode to describe mood, style, or concept and generate a song
    - Official docs emphasize song creation in seconds with one prompt
    - No public latency or failed-generation rate is disclosed
  - - Start from self-written lyrics
    - Bring your own verse, hook, or full lyric sheet
    - Use Custom mode, paste lyrics, and optionally generate supporting music around them
    - Official help says users keep rights to lyrics they wrote themselves
    - Public docs do not quantify how consistently the model preserves line-level lyric intent
  - - Start from an existing recording
    - Turn a clip, melody, or sound effect into a song
    - Upload Audio from device or recorded input and continue creation from that asset
    - Official help documents file import or recording and longer upload limits for paid tiers
    - Users must own the source material and public docs do not explain output quality ceilings
  - - Rework an existing song
    - Modernize or restyle a song already made in Suno
    - Use Covers to restyle melody-preserving songs or Remaster to push older tracks toward newer quality
    - Official sources tie Covers, Personas, and Remaster directly to V4-era quality upgrades
    - Covers are limited to a user's own songs and remain a beta-like surface
  - - Keep a consistent creative identity
    - Reuse the vocals and vibe of a prior song
    - Create a Persona, then call it from Custom mode for new generations
    - Official docs say Personas preserve vocals, style, and vibe and can be public or private
    - No public benchmark shows how stable Personas remain across radically different genres
  - - Finish outside Suno
    - Move generated pieces into a professional DAW
    - Export up to 12 stems and, in Studio, export audio or MIDI for downstream editing
    - Official Studio and landing pages explicitly market DAW handoff
    - Independent public validation of stem separation quality is still sparse
  notes: Benefit cells rely mostly on official workflow claims, with independent confirmation strongest for Studio’s existence and relative maturity rather than hard performance metrics.
