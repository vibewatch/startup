  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: provenance-gap
    missingEvidence: A current technical description of how newer Suno song models watermark or otherwise mark outputs, plus a user-facing verifier or third-party audit.
    whyItMatters: Underwriting rights and platform-trust risk requires knowing whether provenance claims still apply after V3 and whether users or partners can actually verify generated output.
    diligencePath: Request product-security or policy documentation on the current output-provenance scheme, verifier availability, false-positive rates, and whether the older Bark classifier or V3 watermarking claims still apply.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: developer-platform-scope
    missingEvidence: A current official source describing a standalone public API, enterprise console, partner SDK, or Snap integration for Suno.
    whyItMatters: Without that evidence, the product still underwrites primarily as a consumer or prosumer creation platform rather than a developer platform or multi-channel B2B ecosystem.
    diligencePath: Request official developer or enterprise collateral, public docs, API references, or partner launch materials; if none exist, confirm that the company intentionally remains consumer-first.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: public-reliability-benchmarks
    missingEvidence: Public latency, queue-time, failure-rate, uptime, or SLA disclosures for song generation, Studio editing, and mobile creation.
    whyItMatters: The public record proves infrastructure scale, but not user-facing reliability or cost-to-serve quality under peak load.
    diligencePath: Request internal reliability dashboards, uptime reports, queue-depth histograms, and cohort-level success rates for prompt generation, Upload Audio, and Studio workloads.
    relatedQuestionRefs:
    - QE028
    relatedTableRefs:
    - TE003
