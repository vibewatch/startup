tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule / case / regime
  - Jurisdiction
  - Current status
  - Likelihood
  - Severity
  - Visible mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - Major-label copyright case (UMG Recordings et al. v. Suno)
    - United States / D. Mass.
    - Complaint filed 2024; docket shows discovery and amended-complaint fight through Oct. 2025
    - High
    - Critical
    - Defend on fair use, negotiate licenses, migrate toward licensed models
    - Damages, injunction, retraining, or product restrictions still possible
    - Pull current PACER docket, settlement papers, and outside-counsel status memo
  - - DMCA / YouTube stream-ripping allegations
    - United States
    - Labels sought to add allegations in Sept. 2025; Suno publicly disputed the theory in Oct. 2025
    - Medium-High
    - Critical
    - Challenge access-control theory and data-sourcing allegations
    - Could narrow fair-use defense and add anti-circumvention liability
    - Obtain amended complaint, opposition, and any ruling on leave to amend
  - - Koda / GEMA and other foreign repertoire claims
    - Denmark / Germany / broader EU
    - Koda sued in Nov. 2025; MBW says GEMA sued earlier in 2025
    - Medium
    - High
    - Pursue local licenses and geo-specific compliance
    - Cross-border damages or injunction pressure can multiply leverage on settlement talks
    - Collect local pleadings and compare remedies by jurisdiction
  - - NO FAKES / digital replica exposure
    - United States
    - Federal bill and policy momentum target voice and visual likeness misuse
    - Medium
    - High
    - Own-voice verification, private voices, opt-ins for future licensed models
    - A prominent misuse incident could accelerate legal or platform action before federal law is final
    - Review voice-consent logs, escalation playbooks, and replica-specific controls
  - - EU AI Act GPAI and labeling obligations
    - European Union
    - Transparency, GPAI disclosure, and some obligations already phasing in ahead of Aug. 2026 application
    - Medium
    - High
    - Technical documentation, output labeling, and governance build-out
    - Training-data summary and deepfake labeling duties can expose gaps in current disclosure posture
    - Map product features and outputs to AI Act obligations by market
  - - California AB 2013 and training-data disclosure pressure
    - California / U.S.
    - Suno now discloses open-internet and user-data training inputs under state law
    - High
    - Medium-High
    - Publish dataset disclosure pages and rely on open-web / no-paywall position
    - Disclosure can still reinforce rights-holder claims if corpus composition looks under-licensed
    - Request internal breakdown of licensed, open-web, synthetic, and user-derived data
  notes: Rows are ordered by residual severity and mix primary legal documents with later reporting on amendments, settlements, and foreign suits; the table is partial because not every jurisdiction or claimant is publicly documented.
  enumerationScope:
    coverage: partial
    basis: Covers the major public legal and regulatory exposures visible in retained 2024-2026 sources, but not every private license, claim notice, or foreign proceeding.
