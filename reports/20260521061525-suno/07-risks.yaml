  evidenceGaps:
  - type: missing-source
    severity: material
    topic: post-settlement-major-label-status
    missingEvidence: A current PACER-backed filing or stipulation confirming which major-label plaintiffs remain after Warner’s announced settlement.
    whyItMatters: Residual injunction, damages, and settlement exposure cannot be sized cleanly without the current plaintiff lineup and procedural posture.
    diligencePath: Pull the live PACER docket or obtain a current outside-counsel memo summarizing active parties, pending motions, and next hearings.
    relatedQuestionRefs:
