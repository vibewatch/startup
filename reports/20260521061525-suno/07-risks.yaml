- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Major-label litigation
    - Court order or public filing
    - Injunction, adverse summary-judgment ruling, or amended complaint survives with strong DMCA theory
    - Pause or reprice until retraining, reserve, and settlement scenarios are rebuilt
  - - Residual plaintiff mix
    - Updated PACER or company legal memo
    - No visible narrowing of major-label exposure after WMG partnership, or new claimants join
    - Increase legal reserve assumptions and widen downside case
  - - Voice misuse / deepfake event
    - High-profile takedown, regulator inquiry, or artist complaint
    - Recognizable-artist or public-figure replica incident with weak response optics
    - Freeze weight on creator-brand expansion until controls are audited
  - - Licensed-model migration
    - Product policy and funnel data
    - Paid-only download rules or model deprecation cause conversion/churn deterioration beyond management guide
    - Cut ARR durability assumptions and test lower LTV/CAC
  - - DSP distribution policy
    - Platform announcement
    - Recommendation suppression or mandatory AI labeling spreads beyond isolated surfaces
    - Reduce discovery-led growth assumptions and shift to direct-channel scenarios
  - - Compute / unit economics
    - Board reporting or management disclosure
    - Per-song inference cost, queue delays, or cloud commitments move materially against margin targets
    - Re-underwrite cash runway and operating leverage before adding exposure
  notes: These triggers are designed for continuous monitoring; each is framed as an externally observable event or a specific internal diligence artifact management can produce.
