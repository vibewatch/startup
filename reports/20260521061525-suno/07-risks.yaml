  - type: private-evidence-only
    severity: material
    topic: licensing-economics
    missingEvidence: Economic terms of the Warner deal and any similar licenses, including revenue shares, guarantees, opt-in economics, and download-related payments.
    whyItMatters: Licensed models may reduce legal risk while simultaneously compressing gross margin or increasing partner leverage.
    diligencePath: Request signed commercial summaries, payout formulas, and scenario analysis for licensed-model gross margin.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR003
    - TR004
    - TR006
  - type: private-evidence-only
    severity: material
    topic: compute-unit-economics
    missingEvidence: Cloud commitments, GPU spend, per-song inference cost, and a margin bridge separating compute, moderation, legal, and licensing costs.
    whyItMatters: Subscriber and ARR growth do not prove durable contribution margin when large-scale inference is core to delivery.
