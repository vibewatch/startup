callouts:
- calloutType: risk
  title: The copyright case is now a compound risk, not a single fair-use bet
  body: The retained sources show the Suno case evolving from a straightforward training-data complaint into a broader fight over source legitimacy, DMCA anti-circumvention, and licensed-model remediation. That makes the downside path more complex than a simple fair-use win-or-loss framing.
  claimRefs:
  - CR005
  - CR007
  - CR008
  - CR009
  - CR011
  - CR043
- calloutType: risk
  title: Licensed models reduce one headline risk while increasing partner leverage
  body: Warner's settlement is clearly helpful, but it also ties upcoming product behavior, download rules, and artist opt-ins more tightly to rights-holder negotiations. That can solve litigation in one place while moving risk into margin, product flexibility, and counterparty dependence.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR045
  - CR048
- calloutType: insight
  title: Disclosure quality still trails commercial scale
  body: Public evidence is already strong enough to prove demand, subscriber growth, and product expansion. It is not yet strong enough to prove the exact corpus mix, partner economics, moderation effectiveness, or compute unit economics that ultimately determine residual risk and long-run margin.
  claimRefs:
