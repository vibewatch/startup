- id: TR005
  title: Governance / disclosure limits table
  columns:
  - Disclosure area
  - What is public
  - What remains missing
  - Why the gap matters
  - Immediate diligence path
  rows:
  - - Training corpus composition
    - AB 2013 disclosure says open-internet music, metadata, some user content/activity, synthetic data
    - Licensed vs unlicensed share, dataset counts by bucket, current-model mix
    - This is the core fact pattern for litigation and settlement economics
    - Request internal corpus taxonomy and outside-counsel privilege boundaries
  - - Voice and moderation controls
    - Terms, moderation page, report-song workflow, own-voice verification
    - Incident counts, takedown response time, false positive/negative rates
    - Policies do not prove enforcement quality
    - Review trust-and-safety dashboards and escalation procedures
  - - Partner economics
    - Microsoft distribution and WMG partnership are public
    - Traffic, conversion, rev-share, minimum guarantees, Songkick economics
    - Partner dependency cannot be valued from announcements alone
    - Request counterparty scorecards and signed commercial summaries
  - - Current case posture
    - CourtListener shows discovery and amendment fights through Oct. 2025; WMG later announced settlement
    - Updated public dismissal papers, remaining plaintiff mix, next hearings
    - Residual legal exposure is hard to size without a current procedural snapshot
    - Pull live PACER and management legal memo dated within 30 days
  notes: Rows distinguish between visible policy or announcement surfaces and the private evidence that would actually close underwriting gaps.
