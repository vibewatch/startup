  evidenceGaps:
  - type: missing-source
    severity: material
    topic: active-user-denominators
    missingEvidence: MAU, DAU, geography mix, and paid/free active creators by platform and segment.
    whyItMatters: Historical users and app-store ratings prove reach, but they do not show how many creators are currently
      active or monetizable.
    diligencePath: Request live dashboard exports for monthly active creators, paying actives, and country splits across web,
      iOS, Android, and Copilot.
    relatedQuestionRefs:
    - QU001
    - QU004
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: Paid-tier churn, NRR, GRR, free-to-paid conversion by cohort, and partner-channel retention.
    whyItMatters: The current public durability case relies on a small set of engagement proxies, which is not enough to underwrite
      long-run revenue quality.
    diligencePath: Request cohort tables by plan, acquisition channel, and vintage, plus audited definitions for retention
      metrics cited to investors.
    relatedQuestionRefs:
    - QU010
    - QU025
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named-enterprise-proof
    missingEvidence: Named agencies, brands, media companies, or enterprise customers with deployment scope, spend, outcomes,
      and renewal status.
    whyItMatters: Without named enterprise proof, it is difficult to judge whether Suno can expand beyond self-serve creators
      into durable higher-value accounts.
    diligencePath: Request a reference list of current brand, media, and enterprise accounts with permissioned customer calls
      and renewal history.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: developer-surface
    missingEvidence: First-party API documentation, pricing, SLAs, or customer references for a developer-facing Suno surface.
    whyItMatters: A real API or developer surface would expand channel optionality and could change the customer-mix and integration
      story materially.
    diligencePath: Ask management whether a first-party API exists, who uses it, and whether any developer revenue is material
      or strategic.
    relatedQuestionRefs:
    - QU018
  - type: private-evidence-only
    severity: material
    topic: concentration-and-channel-mix
    missingEvidence: Revenue mix across self-serve subscriptions, partner distribution, licensing, and any top-customer concentration
      schedule.
    whyItMatters: Customer quality changes materially depending on whether growth is diversified across many paying creators
      or concentrated in a few opaque channels or partners.
    diligencePath: Request revenue bridge by channel, top-account exposure, partner economics, and lost-deal analysis tied
      to legal or rights objections.
    relatedQuestionRefs:
    - QU022
    - QU025
    relatedTableRefs:
    - TU005
