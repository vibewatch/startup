- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / risk
  - Impact
  - Current evidence
  - Diligence path
  rows:
  - - Free to paid conversion via rights and volume
    - Conversion appears concentrated in self-serve creator subscriptions
    - High impact because 2M paid subs are the clearest monetized user base
    - Paid rights, monthly credits, and add-on credits are tied to Pro / Premier plans
    - Request free-to-paid conversion by acquisition channel and creator cohort
  - - Pro to Premier feature upsell
    - Advanced workflows may be concentrated in a smaller power-user tier
    - Medium impact on ARPU and creator stickiness
    - Premier uniquely includes Studio and 10,000 monthly credits
    - Request tier mix, feature attachment, and gross margin by plan
  - - Mobile app distribution
    - Large app-store reach could also imply consumer-style churn and app-store dependence
    - Medium impact on acquisition efficiency
    - Apple and Google listings show very large rating and download footprints
