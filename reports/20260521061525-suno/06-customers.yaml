callouts:
- calloutType: strength
  title: Consumer willingness to pay is clearly real
  body: The single strongest customer fact in public is not a named enterprise deployment but the combination of 2 million
    paid subscribers, 100 million-plus historical users, and large mobile review footprints. That package is unusual for a
    creative tool and strongly suggests Suno has crossed from novelty into genuine repeat consumer behavior.
  claimRefs:
  - CU001
  - CU002
  - CU008
  - CU009
  - CU034
- calloutType: risk
  title: Customer proof is broad but still shallow beyond creators
  body: Suno’s public evidence base is strongest for individual creators, reviewers, and partner channels. It is much weaker
    for named agencies, brands, or enterprise renewals. That means investors can underwrite demand and product resonance,
    but not yet a durable B2B customer franchise from public evidence alone.
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU032
  - CU039
- calloutType: risk
  title: Copyright and support friction can still interrupt adoption
  body: Even with high app-store scores and fast growth, Suno still carries live customer-adoption friction from confusing
    subscription experiences, unresolved copyright disputes, and organized creator backlash. Those issues matter most for
    higher-value creators, brands, and distributors that care about monetization certainty and reputational risk.
  claimRefs:
  - CU026
  - CU028
  - CU029
  - CU030
  - CU040
