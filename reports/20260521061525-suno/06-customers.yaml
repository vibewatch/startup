  layout: wide
  summary: Suno’s public adoption loop is built around consumer discovery, self-serve creation, mobile repeat use, paid creator
    conversion, and partner-driven extension rather than enterprise procurement.
  approximationNotes: This flow maps visible public channels and loops, not internal conversion rates; node importance reflects
    source prevalence and disclosed scale proxies.
  data:
    nodes:
    - id: viral
      label: Viral or earned discovery
      detail: Users hear AI songs from friends, feeds, or music-industry coverage and become curious about making one themselves.
    - id: selfserve
      label: Self-serve free account
      detail: Suno captures demand through a free daily-credit plan that lets anyone start generating songs quickly.
    - id: mobile
      label: Mobile repeat use
      detail: iOS and Android listings show large review footprints, implying that many users return through app surfaces
        rather than desktop only.
    - id: paid
      label: Paid creator conversion
      detail: Commercial rights, monthly credits, and advanced features convert a subset of repeat creators into paying subscribers.
    - id: copilot
      label: Partner distribution
      detail: Microsoft Copilot introduces Suno to non-musicians who may enter through a partner surface rather than Suno’s
        own app.
    - id: rights
      label: Rights-partner layer
      detail: WMG and related industry relationships may alter how future licensed models, downloads, and user permissions
