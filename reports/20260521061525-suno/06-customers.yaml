figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: A typical Suno creator journey starts with low-friction discovery, moves through repeat creation and sharing, and
    monetizes when rights, volume, or advanced editing become important.
  approximationNotes: Journey stages are inferred from official pricing/help pages, app listings, Microsoft distribution materials,
    and public creator-review evidence rather than internal funnel analytics.
  data:
    nodes:
    - id: discover
      label: Discovery and curiosity
      detail: A user encounters Suno through viral sharing, app-store browsing, or Microsoft Copilot and learns they can make
        full songs from a simple prompt without musical training.
    - id: first-song
      label: First free creation
      detail: The user tries the free plan, generates a few songs, and tests prompts, humming, or uploaded audio with no initial
        cash commitment.
    - id: repeat-and-share
      label: Repeat creation and social sharing
      detail: If outputs feel novel or useful, the user shares songs, follows creators, browses trends, and returns to iterate
        on more ideas across web or mobile.
    - id: paid-conversion
      label: Paid conversion for rights or throughput
      detail: A creator upgrades when monthly volume, commercial rights, or tools like longer uploads, stems, and priority
        queues matter more than free experimentation.
    - id: advanced-expansion
      label: Advanced editing and partner surfaces
      detail: More serious users expand into Studio, higher-tier workflows, voice-led creation, or partner surfaces like Copilot
        while rights-partner changes shape future behavior.
