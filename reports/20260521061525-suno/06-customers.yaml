tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / payer
  - Primary user
  - Core job-to-be-done
  - Public scale / proof
  - Revenue / strategic value
  - Main diligence gap
  rows:
  - - Free casual consumers
    - Self-serve individual / no paid subscription
    - First-time or light creator
    - Try prompt-to-song creation with low commitment
    - Free plan offers 50 daily credits / ~10 songs and no commercial use; 100M+ historical users implies a very large top
      funnel
    - Large acquisition pool but low direct monetization
    - No disclosed cohort conversion, geography split, or live active-user denominator
  - - Paying hobbyists and prosumers
    - Self-serve individual subscription
    - Repeat creator who wants more volume and rights
    - Make more songs, keep creating after the free cap, and monetize new outputs
    - 2M paid subscribers by Feb. 2026; Pro and Premier plans add monthly credits, rights, and extra features
    - Core subscription revenue driver
    - No public tier mix, churn, or ARPU by cohort
  - - Mobile-first creators
    - Self-serve individual via app stores
    - iPhone / Android creator
    - Create, share, and manage songs from the phone
    - Apple showed 257K ratings at 4.9; Google Play showed 1.61M reviews and 10M+ downloads
    - Expands reach, habit formation, and app-store discovery
    - No published MAU, retention, or mobile-versus-web revenue split
  - - Serious creators and small-team prosumers
    - Self-serve paid creator, sometimes project-based
    - Advanced editor / remixer
    - Use stems, longer uploads, voice capture, and Studio-like editing
    - Premier unlocks Studio; reviews say quality is strong for fast creation but still short of full pro control
    - Upsell halo and higher-value user segment
    - No disclosure on what share of revenue comes from advanced users
  - - Partner-distribution users
    - Microsoft account holder or partner-channel user
    - Copilot prompt user
    - Create songs without starting inside Suno’s core app
    - Microsoft says Suno capabilities are embedded in Copilot for prompt-led song generation
    - Incremental acquisition and awareness channel
    - No disclosed Copilot usage, conversion, or retention
  - - Rights-holder and industry counterparties
    - Music-rights partner or artist ecosystem stakeholder
    - Licensed-model or opt-in participant
    - Shape future licensed models and fan experiences
    - WMG partnership adds licensed AI-music collaboration, artist opt-ins, and fan-experience language
    - Potential revenue diversification and litigation relief
    - Not the same as a broad enterprise-customer roster; economics remain undisclosed
  notes: Rows combine official pricing/help materials, app-store positioning, and partner announcements; they describe visible
    segments, not a complete internal customer taxonomy.
