company:
  name: Suno
chapter:
  number: 6
  title: Customers
  summary: 'Suno has strong public evidence of consumer and creator adoption: by February 2026 the company said more than
    100 million people had used the platform and 2 million were paying subscribers, while app-store signals show very large
    mobile reach. The quality of customer proof is broad but shallow beyond individual creators and reviewers; public evidence
    is much stronger for consumer self-serve and partner distribution than for enterprise renewals, agency deployments, or
    durable cohort economics.'
sections:
- id: consumer-scale-and-segment-mix
  title: Consumer scale and segment mix
  body: 'Public evidence points to Suno as a mass-market consumer and prosumer creation platform first, not a narrowly sold
    enterprise tool. By late February 2026, multiple outlets reported Suno had surpassed 100 million historical users and
    2 million paid subscribers, while Billboard had reported 1 million subscribers only a few months earlier, implying extremely
    fast paid growth. The official about page and app listings reinforce the same pattern: Suno describes itself as serving
    anyone from first-timers to experienced songwriters, and its mobile listings market the product equally to shower-singers,
    hobbyists, and more serious creators. App-store signals matter because they are one of the few public denominators outside
    company disclosures: Apple showed 257,000 ratings at 4.9 stars, while Google Play showed 1.61 million reviews and 10 million-plus
    downloads. Together, those signals suggest a broad global top-of-funnel with substantial mobile participation, even though
    Suno still does not publish active users, geography splits, or live free-to-paid conversion by segment.'
  claimRefs:
