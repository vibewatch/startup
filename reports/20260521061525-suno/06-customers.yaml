    - Usage and conversion may depend on a partner surface Suno does not control
    - Medium impact on top-of-funnel and brand discovery
    - Microsoft markets Suno inside Copilot for prompt-led song creation
    - Request partner traffic, conversion, and revenue-sharing disclosures
  - - WMG licensed-model path
    - Future product rules may be influenced by rights-holder negotiations and catalog controls
    - High impact on roadmap and user economics
    - WMG partnership adds opt-ins, licensed models, and broader fan-experience ambitions
