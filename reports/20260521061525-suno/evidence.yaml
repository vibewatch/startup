evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current employee count by function and location.
    whyItMatters: >-
      Headcount is needed to assess operating leverage, hiring discipline, and whether revenue scale is being achieved
      with an efficient team.
    diligencePath: Request current org chart, total headcount, and 12-month hiring / attrition data from management.
    relatedQuestionRefs:
      - QO012
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, observer rights, protective provisions, and investor control terms from Series B and Series C.
    whyItMatters: >-
      Governance rights determine decision control, future financing flexibility, and founder/investor alignment at a
      sensitive licensing stage.
    diligencePath: Request current board materials, voting agreements, financing docs, and post-Series C cap table.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-scale
    missingEvidence: Enterprise customer count, named-customer mix, and consumer-versus-enterprise revenue contribution.
    whyItMatters: >-
      Without customer-mix detail, investors cannot tell whether the current revenue base is durable subscription
      breadth or concentrated partnership / enterprise exposure.
    diligencePath: Request customer segmentation, cohort retention, top-customer concentration, and channel mix by revenue.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: profitability
    missingEvidence: Gross margin, compute cost trends, burn, runway, and scenario analysis under different licensing outcomes.
    whyItMatters: >-
      The investment case depends on whether rapid ARR growth can outrun compute and licensing costs while litigation
      remains unresolved.
    diligencePath: Request detailed P&L, compute-spend breakdown, licensing obligations, and base / downside cash runway models.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: material
    topic: developer-api-gap
    missingEvidence: Official developer API documentation, public API pricing, or public product pages describing a developer channel.
    whyItMatters: >-
      Developer distribution could change Suno's SAM, but public evidence today only supports consumer, prosumer,
      professional, and partner segments.
    diligencePath: >-
      Ask management for public or private API docs, current API customers, pricing, rate limits, and revenue
      contribution.
    relatedQuestionRefs:
      - QM017
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: ownership-and-rights-ambiguity
    missingEvidence: >-
      A single current Suno policy statement that unambiguously defines ownership, copyright eligibility, and commercial
      licensing for paid outputs.
    whyItMatters: >-
      Rights clarity directly affects creator willingness to pay, distributor acceptance, and enterprise adoption in
      regulated media workflows.
    diligencePath: >-
      Obtain the latest rights policy text from Suno legal, compare archived and current help pages, and confirm
      distributor guidance for AI-generated releases.
    relatedQuestionRefs:
      - QM023
  - type: conflicting-data
    severity: minor
    topic: feature-limit-conflict
    missingEvidence: >-
      A current product changelog or help article reconciling Suno's conflicting upload-limit documentation and
      forthcoming download-cap rules.
    whyItMatters: >-
      Conflicting product docs weaken buyer trust and make it harder to model creator conversion, compute intensity, and
      support burden.
    diligencePath: >-
      Request an up-to-date product policy matrix showing free, Pro, and Premier upload limits, download caps, and
      effective dates.
    relatedQuestionRefs:
      - QM024
      - QM027
  - type: private-evidence-only
    severity: material
    topic: segment-mix-and-enterprise-economics
    missingEvidence: >-
      Public disclosure of user mix, paid conversion by segment, enterprise or partner pricing, and revenue split
      between subscriptions, top-ups, and partnerships.
    whyItMatters: >-
      Without segment economics, market sizing can only be bounded with external creator and pricing lenses rather than
      a true SAM or SOM.
    diligencePath: Request cohort conversion, ARPU by plan, partner revenue, and enterprise pipeline or contract data under NDA.
    relatedQuestionRefs:
      - QM028
    relatedTableRefs:
      - TM002
      - TM003
  - type: access-blocked
    severity: material
    topic: udio-transparency
    missingEvidence: >-
      Readable first-party Udio pricing and export-policy pages after the label settlements, including exact current
      download and rights rules.
    whyItMatters: >-
      Without first-party readable documentation, pricing and workflow comparisons lean on secondary summaries and could
      lag live policy changes.
    diligencePath: >-
      Re-fetch Udio pricing and Help Center pages when bot access or reader support improves, or obtain a
      management-supplied policy pack with URLs.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: material
    topic: mubert-transparency
    missingEvidence: A fully readable official Mubert business and API plan matrix with all live prices and included rights.
    whyItMatters: >-
      Mubert is relevant for embedded soundtrack infrastructure, but exact API economics still require inference from
      blog prose rather than a clean published table.
    diligencePath: Request current Mubert business pricing docs or capture the official API pricing matrix once accessible.
    relatedQuestionRefs:
      - QP026
  - type: missing-source
    severity: material
    topic: quality-benchmarking
    missingEvidence: >-
      A standardized independent benchmark that tests vocals, editability, long-form coherence, and commercial fit
      across Suno, Udio, Stable Audio, Lyria, and leading open-source models.
    whyItMatters: >-
      Public comparisons are still mostly review-style, which makes quality underwriting noisier than enterprise
      diligence would prefer.
    diligencePath: >-
      Run a controlled prompt set across the shortlist and score outputs with both human raters and task-specific
      workflow criteria.
    relatedQuestionRefs:
      - QP027
  - type: missing-source
    severity: material
