  - CV052
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Settlement economics
    - Royalties, guarantees, equity, and training-data license terms for Warner and remaining labels
    - This is the cleanest missing variable in gross-margin underwriting
    - CFO, GC, and outside counsel memo plus executed agreements
  - - Cohort retention after rights changes
    - Paid churn, downgrade, and ARPPU by cohort before and after download restrictions
    - Topline durability matters more than historical adoption at this point
    - Growth lead and product analytics review
  - - Gross-margin bridge
    - Per-generation compute, storage, moderation, and licensing burden by plan
    - Valuation depends on how much ARR converts into contribution margin
    - Finance model walkthrough and cloud vendor summary
  - - Cap table and terms
    - Preferences, ratchets, warrants, and any senior claims
    - Headline post-money can overstate common-equity value
    - Legal diligence on charter and investor-rights documents
  - - Private comparable evidence
    - Current marks and revenue ranges for closer AI creator peers
    - Would sharpen the premium-versus-public-comp debate
    - Investor references, secondary data, and banker market color
  - - Regulatory and platform exposure
    - Distribution, moderation, and royalty policy exposure across DSPs and partner surfaces
    - A Deezer-like policy spread could hit monetization without a legal ban
    - Policy mapping with BD and trust-and-safety teams
  notes: These are the asks most likely to move the price call, not a generic diligence checklist.
