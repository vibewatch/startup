tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Decision vector
  - Current read
  - Evidence basis
  - What changes the call
  rows:
  - - Recommendation
    - Track / only invest with downside protection near the verified mark
    - Current mark is real and growth is real, but unit economics and settlement economics remain unproven
    - Upgrade only if management shows durable retention, licensing economics, and a clean margin bridge
  - - Confidence
    - Medium
    - Topline scale is corroborated across several outlets, but key cost and cap-table details remain private
    - Confidence rises with audited cohort, gross-margin, and financing-term disclosure
  - - Risk rating
    - High
    - Litigation, licensing, partner rules, and consumer-volatility risk can all move the valuation band quickly
    - Risk falls only after remaining-label economics and post-transition churn are visible
  - - Valuation stance
    - Stretched
    - Verified mark implies roughly 8.2x-12.3x revenue versus 0.4x-4.9x public comps, though below the private ElevenLabs benchmark
    - The verified mark could move toward fair if ARR keeps compounding and legal drag stays manageable
  - - Entry discipline
    - Avoid paying a rumor-driven step-up without structural protection
    - Bear-case downside remains meaningful relative to any new preferred price
    - Accept a richer entry only with stronger proof on retention, margin, and preference terms
  notes: This table translates the retained evidence into an IC-style summary rather than a binary company-quality judgment; the recommendation changes with price and disclosure quality.
