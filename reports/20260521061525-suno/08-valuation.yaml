- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Core assumptions
  - Implied valuation range
  - Probability signal
  - Key failure / success pivot
  rows:
  - - Bear
    - ARR stalls near $250M-$300M, litigation or licensing costs bite, and public-content multiples dominate
    - $1.2B-$1.8B
    - Plausible if churn rises after licensed-model constraints or settlement costs spike
    - Downstream distribution stays available but recommendation support and monetization weaken
  - - Base
    - ARR holds around $300M-$375M, the licensed-model transition is workable, and investors keep granting a premium to public comps
    - $2.2B-$3.0B
    - Most defensible on retained evidence because it keeps today’s scale while haircutting uncertainty
    - Management must show that growth survives policy changes and that licensing costs are absorbable
  - - Bull
    - ARR jumps toward $450M-$500M+, legal overhang de-risks, and private-AI enthusiasm remains strong
    - $4.5B-$5.5B
    - Needs another step-function revenue jump plus evidence that new terms deepen, not weaken, monetization
    - This case fails quickly if the next round depends only on hype rather than economics
  notes: Ranges are scenario estimates, not a DCF; they translate retained multiple anchors and downside drivers into an explicit underwriting frame.
