  evidenceGaps:
  - type: stale
    severity: material
    topic: series-d-confirmation
    missingEvidence: A signed term sheet, official announcement, or cap-table memo for the rumored 2026 Series D.
    whyItMatters: The valuation call changes materially if a new insider-led round really clears above $5 billion with clean terms rather than remaining a press rumor.
    diligencePath: Request board-approved financing materials, investor rights summaries, and the most recent data-room financing deck.
    relatedQuestionRefs:
    - QV019
  - type: private-evidence-only
    severity: material
    topic: licensed-model-retention
    missingEvidence: Cohort churn, conversion, and usage data before and after download caps and licensed-model restrictions take effect.
    whyItMatters: The base case assumes Suno can keep a large paid base through tighter rights rules; if churn spikes, the current mark quickly looks too rich.
    diligencePath: Ask for monthly cohort retention, downgrade rates, credit usage, and cancellation reasons around each pricing or rights-policy change.
    relatedQuestionRefs:
    - QV021
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Current cap table, liquidation preferences, ratchets, warrants, and any senior security or side-letter protections.
    whyItMatters: The headline preferred valuation can overstate common-equity value if downside protection or stacked preferences already sit ahead of new money.
    diligencePath: Review the latest cap table, charter, investor rights agreement, and any draft term sheets for the next round.
    relatedQuestionRefs:
    - QV023
    - QV026
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: licensing-economics
    missingEvidence: Executed settlement economics, royalty formulas, minimum guarantees, and accounting treatment for licensed models.
    whyItMatters: Without visibility into the go-forward cost of licensed output, investors cannot tell whether future ARR growth translates into durable equity value.
    diligencePath: Obtain executed Warner economics, current remaining-label negotiation status, and a gross-margin bridge isolating licensing and compute costs.
    relatedQuestionRefs:
    - QV028
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-limitations
    missingEvidence: Clean private-peer revenue, margin, and term data for AI music and creator tools that are closer to Suno than mature public comps.
    whyItMatters: The comparable table is useful but still mixes public mature firms with a small private AI-audio set, which limits precision in the multiple anchor.
    diligencePath: Expand the private comparable set using investor decks, confidential round memos, and secondary-market marks before pricing a new round.
    relatedQuestionRefs:
    - QV023
    relatedTableRefs:
    - TV004
