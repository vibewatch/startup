- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Bullish read
  - Skeptical read
  - What would change the view
  rows:
  - - Consumer demand
    - 2 million paid subscribers and 100 million-plus users show real pull
    - Demand proof does not guarantee durable retention after rights changes
    - Show cohort stability through the licensed-model transition
  - - Monetization model
    - $150 implied ARR per paid user fits between Pro and Premier list prices
    - The blend may be flattered by temporary mix, promotions, or add-ons not visible publicly
    - Disclose plan mix, monthly-vs-annual split, and top-up economics
  - - Comparable support
    - Private AI audio can clear far richer multiples than public content platforms
    - Public music and content comps still anchor far lower than Suno’s current implied multiple
    - Add cleaner private peer and secondary-mark data
  - - Legal posture
    - Warner’s partnership shows labels will license with Suno rather than only litigate
    - Remaining-label economics and remedies are undisclosed, so the full cost of legitimacy is unknown
    - Show executed economics and remaining-plaintiff status memo
  - - Platform power
    - Licensed models can improve trust, artist opt-ins, and revenue opportunities
    - Download limits and recommendation suppression can reduce user utility and discovery
    - Publish post-change churn, conversion, and creator satisfaction data
  - - Valuation read
    - Current mark may be survivable if growth persists
    - Any step-up to $5B looks premature on current public evidence
    - A new round needs both higher ARR and cleaner downside economics
  notes: The anti-thesis is not “Suno is bad”; it is that valuation support relies on information the public record still does not provide.
