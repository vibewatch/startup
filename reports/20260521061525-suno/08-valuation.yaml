- id: comparable-frame-and-multiple-read
  title: Comparable frame and multiple read
  body: 'The comparable frame supports a premium, but not a blank check. On public markets, Spotify, Adobe, Shutterstock, and Getty sit around 4.9x, 4.3x, 0.6x, and 0.4x sales respectively on the retained May 2026 market-cap and recent-revenue data. Those are imperfect peers: Spotify is a scaled music subscription platform, Adobe is a much higher-margin creator-software suite, and Shutterstock or Getty are slower-growth rights-managed content businesses. Suno is growing faster than all of them, so some premium is deserved. The more relevant private-audio enthusiasm reference is ElevenLabs, which CNBC and TechCrunch say raised at $11 billion on $330 million of ARR, or roughly 33x. That supports the idea that frontier audio AI can clear much richer private multiples than public content companies. But ElevenLabs is also broader, more enterprise, and less exposed to music-copyright litigation. The clean read is that Suno’s current verified mark sits between slow public media comps and frothy
    private AI infrastructure comps, which is why “stretched” fits better than “expensive” for the verified mark and much better than “fair” for any rumored step-up.'
