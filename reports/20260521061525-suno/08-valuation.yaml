- id: downside-distribution-and-sensitivity
  title: Downside distribution and sensitivity
  body: 'The downside case is not mainly about whether Suno can acquire users; it is about whether those users stay monetizable once licensed models, download limits, and platform frictions arrive. Warner’s partnership confirms a 2026 transition to licensed models, paid-only downloads, and capped monthly downloads for paid users. Music Business Worldwide also shows that the remaining-label economics are still private enough that UMG and Sony were blocked from seeing Warner’s deal terms. That leaves a major hole in gross-margin underwriting. The legal backdrop is not abstract either. CourtListener shows the original complaint remains a live part of the company story, Forbes argues that selective settlements can entrench opaque economics while leaving independents out, and the Copyright Office’s training report highlights substitution and licensing-market harm concerns when AI outputs compete with originals. On top of that, Deezer’s official policy demonstrates a realistic downstream scenario
    in which AI music can remain distributed yet lose recommendation support and royalty participation. Those pressures create a wide valuation range: a bear case near public-content multiples if litigation or churn bites, a base case near today’s mark if Suno keeps growing through the transition, and a bull case only if a new ARR leg and private-AI enthusiasm both persist.'
