- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Remaining-label economics go punitive
    - Settlement or court posture implies uneconomic royalties, guarantees, or retraining demands
    - Current multiple can no longer be underwritten on growth alone
    - Move stance from stretched to expensive / avoid new money
  - - Licensed rollout hurts paid retention
    - Visible churn spike, downgrade wave, or lower ARPPU after download limits take effect
    - The bull and base cases lose their core durability assumption
    - Re-cut value toward bear range
  - - Downstream platforms suppress AI music exposure
    - Recommendation or playlist exclusion becomes common beyond Deezer-style policy
    - Discovery and royalty pools weaken even if generation remains legal
    - Haircut top-line and terminal multiple
  - - Next round clears above $5B without new disclosure
    - Price rises materially while margin, churn, and cap-table data remain missing
    - The financing itself becomes evidence of froth rather than of fundamental support
    - Pass unless terms include strong downside protection
  - - Preference stack turns hostile
    - New ratchets, stacked liquidation preferences, or senior instruments sit ahead of common
    - Headline preferred valuation overstates common-equity value
    - Re-underwrite on fully diluted and downside proceeds, not headline post-money
  notes: Triggers are practical decision points that would force a re-rating rather than background risks that can be watched indefinitely.
  claimRefs:
