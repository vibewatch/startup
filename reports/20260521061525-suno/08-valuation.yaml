company:
  name: Suno
chapter:
  number: 8
  title: Valuation
  summary: 'The retained evidence supports a real but already-demanding mark: Suno’s verified November 2025 Series C priced the company at $2.45 billion on $200 million of annual revenue, and later 2026 reporting moved the public run-rate to 2 million paid subscribers and $300 million of ARR. Relative to public music and content comps the verified mark looks stretched, while any rumor-led move toward $5 billion would look expensive without fresh proof on churn, margin, licensing economics, and legal resolution.'
sections:
- id: verified-mark-and-entry-baseline
  title: Verified mark and entry baseline
  body: The only hard valuation anchor in the retained record is the November 2025 Series C. TechCrunch, Music Business Worldwide, PR Newswire, Goodwin, and Suno’s own announcement all converge on a $250 million raise at a $2.45 billion post-money valuation, alongside a disclosed $200 million annual revenue run rate and nearly 100 million cumulative users. By February 2026, multiple outlets then reported 2 million paid subscribers and $300 million of ARR. That sequencing matters for underwriting. If the verified mark is compared with the revenue disclosed at the round, Suno was priced at roughly 12.3x. If the same preferred mark is compared with the later ARR figure, the implied multiple falls to about 8.2x. In other words, the verified price is not obviously absurd if the 2026 growth proves durable. But it is also not cheap. It already assumes the company can convert extraordinary consumer adoption into lasting monetization even while product rights, downloads, and training-data economics
    are still shifting under legal pressure.
