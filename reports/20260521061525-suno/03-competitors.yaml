  title: Competitor profile table
  columns:
  - Competitor / option
  - Category
  - Target user
  - Public scale / packaging signal
  - Key differentiation
  - Key limitation
  rows:
  - - Udio
    - Direct full-song rival
    - Prosumer artists and creators
    - Consumer subscription plus post-settlement label deals
    - Closest peer on song-centric workflow and producer-style positioning
    - Licensing transition has constrained exports and creates trust/freedom tension
  - - Mubert
    - API and background-audio substitute
    - Video apps, brands, wellness, UGC tools
    - API-led tiers with sublicensing logic; 28M creators claimed
    - Strong infrastructure and rights framework for embedded soundtrack use
    - Weak fit for artist-style streaming releases and Content ID workflows
  - - Stable Audio
    - Technical music / sound-design rival
    - Developers, sound designers, enterprise teams
    - Creator plus enterprise licenses; open weights plus API
    - Licensed data, long-form generation, self-hosting, inpainting, LoRa support
    - Less obviously a viral consumer song destination than Suno or Udio
  - - MusicGen
    - Open-source internal-build baseline
    - Researchers, hobbyists, internal tooling teams
    - Free code, local GPU requirement, public demo and pretrained models
    - Low-cost experimentation, privacy, automation, and local control
    - Public weights are non-commercial and vocals lag frontier consumer tools
  - - Google Lyria
    - Platform and enterprise entrant
    - Gemini users, Shorts creators, app builders
    - Gemini app, Vertex AI, Media Studio, Dream Track, Artlist and Freepik proof points
    - Strong distribution surface plus watermarking and partner-rights story
    - Framed more as platform expression tooling than a creator-first standalone subscription
  - - ElevenLabs / ElevenMusic
    - Audio-suite entrant
    - Mobile creators, audio developers, existing ElevenLabs users
    - Music API plus iOS app with free and paid tiers
    - Cross-sell from voice, SFX, dubbing, and existing developer base
    - Music is newer than its voice franchise and long-term differentiation remains unproven
  - - Adobe Firefly
    - Incumbent soundtrack substitute
    - Marketers, editors, agencies, game and social creators
    - Premium feature inside Firefly / Creative Cloud workflow
    - Commercially safe instrumental soundtrack generation from prompts or video uploads
    - Instrumental-first rather than a culturally viral full-song platform
  - - Canva + stock audio workflow
    - Status-quo substitute
    - Lightweight video creators and small businesses
    - Built-in library with Pro tracks or one-off fees
    - Already native inside a huge creator workflow for quick soundtrack needs
    - Not a frontier text-to-song platform and limited for differentiated music creation
  notes: Rows compare the main ways a buyer can solve AI music or creator soundtrack jobs today; packaging and scale rely on public product pages, partner announcements, and independent reviews where first-party pricing remained opaque.
