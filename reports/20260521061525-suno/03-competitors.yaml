- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk axis
  - Why it matters
  - Main threat
  - Severity
  - Current evidence
  - Mitigation / diligence ask
  rows:
  - - Licensed catalog and artist access
    - Can improve trust, outputs, and monetization rights
    - Licensor-driven safety can also reduce creator freedom
    - high
    - Udio label settlements plus Suno/Warner and Google/YouTube rights posture show access is valuable but constraining
    - Test whether Suno can keep export freedom while expanding licensed experiences
  - - Distribution surfaces
    - Winning creator attention is easier when music is bundled into existing apps
    - Google, Adobe, Canva, and ElevenLabs can route demand from much larger surfaces
    - high
    - Gemini, Shorts, Creative Cloud, Canva editor, and ElevenLabs audio stack all sit upstream of music creation
    - Measure Suno retention and conversion versus users who already edit inside those ecosystems
  - - Generation-model commoditization
    - Open or local models reduce scarcity of core model capability
    - Stable Audio open weights and MusicGen-style local tooling
    - high
    - Open-source access is expanding while reviews say raw quality gaps are narrowing even if still present
    - Keep moat emphasis on workflow assets, rights, and community rather than only base model quality
  - - Switching cost and multi-homing
    - Low switching raises customer acquisition pressure
    - Creators can prompt multiple tools and finish in a DAW
    - medium
    - Most differentiated assets are voices, fine-tunes, saved sessions, or licensor-linked experiences rather than generic prompting
    - Deepen project continuity, libraries, and export workflows that make Suno harder to leave mid-project
  - - Product restriction backlash
    - Trust wins can backfire if the product becomes less useful
    - Udio-style walled-garden tightening
    - high
    - DMN reports creator revolt against closed exports and restricted inputs
    - Keep commercial-safety changes legible and user-beneficial rather than purely defensive
  - - Status-quo soundtrack substitution
    - Not every buyer needs a full song
    - Adobe and Canva can absorb simple content-audio jobs
    - medium
    - Official pages show royalty-safe background music and stock audio embedded in video workflows
    - Focus Suno messaging on song creation, fandom, identity, and richer output rather than generic background music
  notes: Risk register treats competitor signals as strategic threats to Suno’s future moat, not as stand-alone market facts. Severity is a diligence judgment grounded in the cited public evidence.
