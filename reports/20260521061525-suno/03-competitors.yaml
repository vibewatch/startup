- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Public price anchor
  - Contract model
  - Commercial-rights position
  - Known restriction / unknown
  - Implication for Suno
  rows:
  - - Suno
    - Free; Pro at $8 annual-effective; Premier at $24 annual-effective
    - Self-serve subscription with credits and top-ups
    - Paid songs may be monetized and distributed; free is non-commercial
    - Paid download caps are evolving under Warner-linked roadmap
    - Strong creator monetization baseline and clear release use case
  - - Udio
    - 'Independent review: ~ $10 Standard; ~ $30 Pro; free tier also available'
    - Self-serve credits with transition-era limits
    - Paid use generally commercial; free best treated as attributed or non-commercial
    - Official pricing and export docs were not fully readable in this run; exports reportedly paused during transition
    - Closest direct rival, but current opacity and restrictions weaken ease of use advantage
  - - Mubert Render / API
    - 'Officially visible: Trial API at $49/mo; broader live pricing still partly sales-led'
    - API and licensing-tier contracts; consumer download plans also exist
    - Commercial use depends on plan and sublicensing tier
    - Streaming release and Content ID are prohibited across plans
    - More competitor for soundtrack infrastructure than for release-ready AI songs
  - - Stable Audio
    - Official licensing tiers are public; exact self-serve prices were not fully surfaced in fetched text
    - Creator plus enterprise licensing; API and self-hosting for large users
    - Community / enterprise commercialization claimed
    - Enterprise coverage required for larger organizations; consumer pricing less transparent than Suno
    - Competes more on technical control and enterprise wedge than on casual creator adoption
  - - MusicGen
    - $0 software access; local compute cost is the economic constraint
    - Open-source code plus local deployment
    - Public released weights are non-commercial
    - Commercial teams need other licenses or different models
    - Strong commoditization pressure on the base generation layer, weak direct paid-subscription threat
  - - Lyria
    - No simple public creator subscription price in retained sources
    - Gemini surface for consumers plus Vertex AI API / enterprise packaging
    - Governed by Google platform and API terms
    - Enterprise and platform packaging are more visible than standalone creator pricing
    - Threat is platform distribution and bundling, not straightforward one-for-one price competition
  - - ElevenMusic
    - Free up to seven songs per day; Pro at $9.99/mo or $95.90/yr
    - Consumer mobile subscription plus Music API adjacencies
    - Commercial positioning is positive but detailed music-policy depth is newer
    - New entrant with limited long-run proof compared with Suno or Udio
    - Low enough pricing to pressure casual experimentation budgets
  - - Adobe Firefly / Canva
    - Firefly premium with limited free tastes; Canva Pro or one-off track fees
    - Bundled inside broader creator subscriptions and editor workflows
    - Both emphasize straightforward licensed or commercially safe usage
    - Neither is a strong substitute for culturally viral full songs
    - Bundling can siphon away lightweight soundtrack demand without a dedicated AI music subscription
  notes: Table focuses on package structure rather than pretending every vendor exposes a clean public price card. Unknown or review-based entries are marked explicitly where first-party pages were not fully readable.
