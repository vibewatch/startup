callouts:
- calloutType: insight
  title: No single rival replicates Suno’s full stack
  body: Udio is closest on creator-facing songs, Stable Audio on technical control, Google on distribution, and Adobe or Canva on low-end soundtrack substitution. Suno’s problem is therefore a bundle of partial substitutes rather than one obvious clone.
  claimRefs:
  - CP005
  - CP018
  - CP025
  - CP030
  - CP035
  - CP040
- calloutType: risk
  title: Licensing can be both moat and constraint
  body: Udio’s post-settlement experience shows that more licensor alignment can improve trust while simultaneously making the product feel less open. If Suno pursues the same direction without preserving creator freedom, it could narrow the very advantage that built the category.
  claimRefs:
  - CP006
  - CP007
  - CP009
  - CP041
  - CP043
