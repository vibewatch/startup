  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Suno is not selling music listening; it is selling AI-assisted music creation. Official product, help, and
              partnership materials show that the core market is creator-side spend on subscriptions, credits, Studio
              access, and commercial-use workflows. Free users get limited daily credits and no monetization rights,
              while paid users buy rights to distribute and monetize songs externally. That means included spend is
              consumer and prosumer subscription spend, add-on credits, Studio-driven workflow spend, and commercial
              exploitation of AI-generated tracks in streaming, video, film, TV, or games. The Warner partnership adds a
              second lane: licensed models, artist opt-ins, paid downloads, and rightsholder-aligned fan experiences.


              Important adjacent pools should still be excluded from Suno TAM. Global recorded-music subscriptions,
              traditional DAW budgets, live music, label services, and general creator-economy revenue are relevant
              context, but they are not automatically Suno revenue. For serious creators, the closest substitute remains
              traditional music production software, especially when open-source tools are good enough. For content
              teams that mainly need legal background music, royalty-free libraries and adjacent AI soundtrack vendors
              remain viable alternatives. The result is a real but narrower market boundary than a generic “AI plus
              music” narrative would imply.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
