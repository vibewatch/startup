      - number: '6.4'
        title: Durability limits and adverse customer signals
        blocks:
          - type: paragraph
            body: >-
              Durability evidence is directionally encouraging but still incomplete. Billboard reported unusually strong
              consumer-style engagement proxies — about 25 percent 30-day retention for subscribers, 78 percent weekly
              retention for subscribers, and 39 percent weekly retention for all users — and public app-store ratings
              imply many users are satisfied enough to leave high-score reviews at scale. Even so, the public record
              still lacks the core underwriting cuts a more mature customer chapter would want: paid-tier churn by
              cohort, free-to-paid conversion by vintage, geography mix, customer concentration, NRR, GRR, and
              enterprise renewal data. Negative customer signals are also material. The same App Store review surface
              that contains glowing musician testimonials also includes complaints about confusing annual billing and
              weak support responsiveness. More importantly, Suno’s customer expansion still sits under a heavy
              copyright cloud. The RIAA announcement, the underlying federal complaint, and the later “Say No to Suno”
              backlash cited by music-industry outlets all raise the risk that some creators, brands, or distributors
              will keep multi-homing or avoid deeper commitment until licensing and training-data disputes become more
              settled.
