chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Suno presents itself not as a generic AI lab but as a music company built to amplify imagination and
              broaden access to music creation. Official materials describe a platform for everyone from shower-singers
              to seasoned artists, while the product itself turns text prompts into full songs with vocals and
              instrumentation and now supports deeper editing and audio uploads. The commercial model is freemium. The
              free plan still exposes users to the core generation experience, but paid Pro and Premier plans unlock
              materially more credits, advanced models, editing features, commercial use rights for newly created songs,
              personal-voice tools, and Suno Studio access at the top tier. That structure matters: it means Suno is
              monetizing creator intent rather than passive listening inventory, and its current policy mix increasingly
              nudges heavy users toward paid conversion. The official site supports a Cambridge headquarters and
              three-office footprint across Cambridge, New York, and Los Angeles, but does not disclose employee count
              or broader operating metrics beyond product and plan design.
