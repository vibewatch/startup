      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Suno was founded in 2022 by Mikey Shulman, Georg Kucsko, Martin Camacho, and Keenan Freyberg, who
              previously worked together at Kensho. That lineage is strategically important because it combines
              machine-learning engineering experience with a shared interest in music and productization. Shulman is the
              clearly dominant public executive voice: he is the co-founder and CEO quoted across fundraising, media,
              and legal coverage, and he still anchors the company narrative around democratizing music creation. In
              2025 and 2026 Suno added more explicit music-industry leadership, most notably Paul Sinclair as Chief
              Music Officer and Jeremy Sirota as Chief Commercial Officer. Those hires improve industry-facing depth,
              especially around licensing, platform partnerships, and enterprise solutions. Even so, public disclosure
              remains thin versus the company’s scale. Reviewed sources did not surface an independently confirmed CFO,
              COO, or detailed board roster, nor did they disclose investor control rights or governance terms from
              later financings. That leaves real key-person and governance diligence work outstanding despite the
              stronger music-business bench.
