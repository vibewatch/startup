      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              Suno's buyer map is heterogeneous. The free plan clearly addresses hobbyists and first-time creators: the
              user and payer are the same person, the job is experimentation, and monetization is explicitly off the
              table. Paid self-serve plans map to prosumers and indie artists who want external distribution, commercial
              use rights, and enough credits to publish consistently. Suno Studio pushes farther upmarket by adding
              multitrack editing, stem extraction, recording, tempo control, and export back into existing DAWs. That
              makes producer, composer, and small-studio workflows plausible even before any formal enterprise sales
              motion is visible.


              The commercial-rights documentation also opens agency and content-team use cases because paid outputs may
              be used in film, TV, video games, YouTube, and TikTok. Beyond that sits a separate partner segment created
              by the Warner deal, where labels, artists, and fan-experience operators become economic participants
              through licensed models, artist opt-ins, and paid downloads. What public evidence does not yet support is
              a developer segment. Reviewed Suno pricing, blog, and help materials did not surface a public API, API
              pricing, or public developer docs, so any API-led TAM should be treated as speculative until management
              shows real documentation and customers.
            claimRefs:
