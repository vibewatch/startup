  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Residual risk remains highest where legal exposure, licensed-model dependence, and monetization uncertainty
      overlap.
    approximationNotes: >-
      Cell placement is an analytical judgment based on retained public evidence about likelihood and impact after
      visible mitigations, not a management-supplied scoring model.
    data:
      columns:
        - Moderate impact
        - High impact
        - Critical impact
        - Existential / thesis-break impact
      rows:
        - label: High likelihood
          values:
            - label: DSP AI labeling spread
              tone: warning
              detail: Discovery can weaken even without outright bans.
            - label: Model-quality commoditization
              tone: warning
              detail: Paid retention depends on staying ahead in quality and workflow depth.
            - label: Paid-rights / download friction
              tone: negative
              detail: Licensed-model migration could hurt conversion or retention.
            - label: n/a
              tone: neutral
        - label: Medium likelihood
          values:
            - label: Voice misuse incident
              tone: warning
              detail: Controls exist but there is no public enforcement-quality dataset.
            - label: Compute cost shock
              tone: warning
              detail: Elastic scaling helps, but unit economics are opaque.
            - label: WMG / partner leverage
              tone: negative
              detail: Roadmap and economics are increasingly influenced by counterparties.
            - label: Major-label case survives into dispositive phase
              tone: negative
              detail: The case can still force reserve, retraining, or injunction scenarios.
        - label: Low to medium likelihood
          values:
            - label: NO FAKES / replica law acceleration
              tone: neutral
              detail: Legislation is not final but raises policy direction risk.
            - label: Foreign collecting-society escalation
              tone: warning
              detail: Cross-border claims could multiply legal leverage.
            - label: EU GPAI disclosure non-compliance
              tone: warning
              detail: Documentation and labeling gaps can become market-access problems.
            - label: Adverse injunction or settlement economics
              tone: negative
              detail: This is the main thesis-break event because it combines legal, product, and margin damage.
    claimRefs:
      - CR005
      - CR007
      - CR011
      - CR012
      - CR022
      - CR026
      - CR029
      - CR032
      - CR041
      - CR043
      - CR045
      - CR047
      - CR049
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The highest-value diligence question is how legal, partner, and compute risks propagate into margin, conversion,
      and valuation at the same time.
    approximationNotes: Edges show directional transmission rather than quantified elasticities.
    data:
      nodes:
        - id: N1
          label: Major-label / DMCA case
          detail: Copyright and source-legitimacy claims against Suno.
          tone: negative
        - id: N2
          label: Foreign rights actions
          detail: Koda, GEMA, and similar claims widen geography.
          tone: warning
        - id: N3
          label: Licensed-model obligations
          detail: Partner terms shape downloads, opt-ins, and roadmap.
          tone: warning
        - id: N4
          label: Voice misuse incident
          detail: Replica or impersonation failure could trigger policy backlash.
          tone: warning
        - id: N5
          label: Compute cost shock
          detail: Elastic GPUs help, but cost opacity remains.
          tone: warning
        - id: N6
          label: Paid conversion / retention
          detail: Commercial rights and best-model access drive subscriber behavior.
          tone: neutral
        - id: N7
          label: Brand / enterprise adoption
          detail: Higher-value customers care about rights and reputation.
          tone: neutral
        - id: N8
          label: Gross margin
          detail: Compute, legal, and licensing all flow into contribution margin.
          tone: neutral
        - id: N9
          label: Capital needs / reserve
          detail: Adverse outcomes can raise financing needs.
          tone: neutral
        - id: N10
          label: Valuation
          detail: Multiple and underwriting confidence move last.
          tone: neutral
      edges:
        - from: N1
          to: N3
          label: pushes licensed migration
        - from: N1
          to: N8
          label: adds legal / settlement cost
        - from: N2
          to: N9
          label: widens reserve scenarios
        - from: N3
