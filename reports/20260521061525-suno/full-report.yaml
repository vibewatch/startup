      - number: '3.4'
        title: Moat durability, switching costs, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence points to only moderate creator switching costs. Prompting, remixing, and DAW-based
              finishing all multi-home fairly easily, and open weights reduce the long-run scarcity of the generation
              layer itself. Suno’s more defensible assets are therefore not just “model quality,” but rights to release,
              consumer mindshare, and eventually any licensor-linked experiences or user-owned voices and fine-tunes.
              Udio demonstrates both the upside and downside of the licensor moat: major-label settlements and supply
              access improve trust, but the same licensing posture can make the product feel more constrained. Stable
              Audio and MusicGen show why commoditization risk is real—open or local distribution makes technical
              capability easier to replicate—yet they also highlight that API, self-hosting, and enterprise control are
              themselves valuable wedges. Google, Adobe, Canva, and ElevenLabs intensify the threat because they can
              absorb soundtrack or short-form creation into broader platforms. The adverse conclusion is that Suno’s
              moat is durable only where generation quality is bundled with workflow stickiness, creator freedom, and
              rights-safe access that feel better, not more restrictive, than the alternatives.
