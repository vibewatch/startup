  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory overhang
        blocks:
          - type: paragraph
            body: >-
              Suno's largest residual risk is still legal rather than purely technical. The RIAA-backed complaint filed
              in Massachusetts in June 2024 frames Suno as a commercial music generator built on unlicensed copying of
              sound recordings, and the public CourtListener docket shows that the case moved through discovery, amended
              scheduling orders, and a September-October 2025 fight over amending the complaint. Billboard and Complete
              Music Update then reported that plaintiffs sought to add YouTube stream-ripping and DMCA
              anti-circumvention theories, while Suno argued those additions were a gambit to avoid a direct fair-use
              fight. That matters because the downside is no longer limited to one doctrinal question. A loss on
              ordinary infringement, a loss on data-sourcing legitimacy, or an injunction tied to model retraining could
              each pressure product and cash flow differently. The legal picture also became harder, not easier, to
              underwrite after Warner Music Group announced a settlement and partnership in November 2025. The
              accessible primary docket extract retained here ends before any public dismissal papers tied to that
              announcement, so the exact post-settlement plaintiff lineup cannot be independently confirmed from the
              same primary record. Add Koda's Danish case, MBW's reporting that GEMA also sued, the U.S. Copyright
              Office's training report, the NO FAKES bill, and the EU AI Act's GPAI obligations, and the result is a
              stacked exposure profile: copyright, digital-replica, transparency, and training-data disclosure issues
              are all still live.
            claimRefs:
