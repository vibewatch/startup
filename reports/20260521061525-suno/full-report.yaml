        - Public technical transparency
      rows:
        - label: Simple and Custom generation
          values:
            - label: High
              tone: positive
              detail: Prompt-first creation is the clearest and oldest part of the product surface.
            - label: Medium
              tone: neutral
              detail: Custom controls are useful, but the deepest edit mechanics still live elsewhere.
            - label: Medium
              tone: neutral
              detail: Rights are understandable only when paired with plan-tier documentation.
            - label: Low
              tone: positive
              detail: Core prompting works without needing a rights-holder or enterprise partner.
            - label: Low
              tone: warning
              detail: The model internals behind prompt interpretation remain mostly opaque.
        - label: Upload Audio and Covers
          values:
            - label: Medium
              tone: neutral
              detail: These flows are easy to invoke but require owned source material and experimentation.
            - label: Medium
              tone: neutral
              detail: They represent real transformation tools, not just prompt variation.
            - label: Medium
              tone: neutral
              detail: Ownership rules are understandable, but edge cases around reused inputs are still thinly documented.
            - label: Low
              tone: positive
              detail: These features are mostly self-serve and not yet partner-controlled.
            - label: Low
              tone: warning
              detail: Public docs do not explain fidelity, failure, or source-audio handling in technical terms.
        - label: Personas
          values:
            - label: Medium
              tone: positive
              detail: The feature is conceptually easy to use once a reference song exists.
            - label: Medium
              tone: neutral
              detail: Personas add continuity but not full deterministic control.
            - label: Medium
              tone: neutral
              detail: Public/private behavior is described, but IP questions remain contextual.
            - label: Low
              tone: positive
              detail: The feature is mainly tied to Suno-native assets rather than outside partners.
            - label: Low
              tone: warning
              detail: No public benchmark shows how stable a Persona remains across many generations.
        - label: Song Editor and Studio
          values:
            - label: Medium
              tone: positive
              detail: Studio broadens the workflow but still targets users willing to learn more controls.
            - label: High
              tone: positive
              detail: This is the deepest edit surface described publicly, including stems and MIDI.
            - label: Medium
              tone: neutral
              detail: Rights are still governed by the same plan logic as the rest of the platform.
            - label: Low
              tone: positive
              detail: Studio is mainly self-serve rather than label- or marketplace-dependent.
            - label: Low
              tone: warning
              detail: Independent review says Studio is promising but still beta and unfinished.
        - label: Rights and moderation controls
          values:
            - label: Low
              tone: neutral
              detail: These controls do not create music directly.
            - label: Low
              tone: neutral
              detail: They constrain or enable the workflow rather than add arrangement flexibility.
            - label: High
              tone: positive
              detail: Plan-tier rights, moderation, and California training-data disclosures are unusually explicit.
            - label: Medium
              tone: warning
              detail: Litigation and label settlements still shape the compliance perimeter.
            - label: Medium
              tone: warning
              detail: Policies are public, but technical proof of provenance and filtering effectiveness is limited.
        - label: Partner roadmap and mobile reach
          values:
            - label: High
              tone: positive
              detail: Copilot and mobile broaden reach and lower creation friction.
            - label: Medium
              tone: neutral
              detail: These surfaces reuse the core product more than they add new edit primitives.
            - label: Medium
              tone: neutral
              detail: Paid-download and artist-control rules are becoming clearer under the WMG roadmap.
            - label: High
              tone: warning
              detail: Microsoft, app stores, and WMG now directly shape how users access and export music.
            - label: Low
              tone: warning
              detail: Public sources do not explain how partner surfaces connect to a broader enterprise strategy.
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      A typical Suno creator journey starts with low-friction discovery, moves through repeat creation and sharing, and
      monetizes when rights, volume, or advanced editing become important.
    approximationNotes: >-
      Journey stages are inferred from official pricing/help pages, app listings, Microsoft distribution materials, and
      public creator-review evidence rather than internal funnel analytics.
    data:
      nodes:
        - id: discover
          label: Discovery and curiosity
          detail: >-
            A user encounters Suno through viral sharing, app-store browsing, or Microsoft Copilot and learns they can
            make full songs from a simple prompt without musical training.
        - id: first-song
          label: First free creation
          detail: >-
            The user tries the free plan, generates a few songs, and tests prompts, humming, or uploaded audio with no
            initial cash commitment.
        - id: repeat-and-share
          label: Repeat creation and social sharing
          detail: >-
            If outputs feel novel or useful, the user shares songs, follows creators, browses trends, and returns to
            iterate on more ideas across web or mobile.
        - id: paid-conversion
          label: Paid conversion for rights or throughput
          detail: >-
            A creator upgrades when monthly volume, commercial rights, or tools like longer uploads, stems, and priority
            queues matter more than free experimentation.
        - id: advanced-expansion
          label: Advanced editing and partner surfaces
          detail: >-
            More serious users expand into Studio, higher-tier workflows, voice-led creation, or partner surfaces like
            Copilot while rights-partner changes shape future behavior.
    claimRefs:
      - CU010
      - CU011
      - CU016
      - CU017
      - CU018
      - CU035
      - CU036
      - CU039
  - id: FU002
    title: Adoption / deployment flow
    type: flow
    layout: wide
    summary: >-
      Suno’s public adoption loop is built around consumer discovery, self-serve creation, mobile repeat use, paid
      creator conversion, and partner-driven extension rather than enterprise procurement.
    approximationNotes: >-
      This flow maps visible public channels and loops, not internal conversion rates; node importance reflects source
      prevalence and disclosed scale proxies.
    data:
      nodes:
        - id: viral
          label: Viral or earned discovery
          detail: >-
            Users hear AI songs from friends, feeds, or music-industry coverage and become curious about making one
            themselves.
        - id: selfserve
          label: Self-serve free account
          detail: Suno captures demand through a free daily-credit plan that lets anyone start generating songs quickly.
        - id: mobile
          label: Mobile repeat use
          detail: >-
            iOS and Android listings show large review footprints, implying that many users return through app surfaces
            rather than desktop only.
        - id: paid
          label: Paid creator conversion
          detail: >-
            Commercial rights, monthly credits, and advanced features convert a subset of repeat creators into paying
            subscribers.
        - id: copilot
          label: Partner distribution
          detail: >-
            Microsoft Copilot introduces Suno to non-musicians who may enter through a partner surface rather than
            Suno’s own app.
        - id: rights
          label: Rights-partner layer
          detail: >-
            WMG and related industry relationships may alter how future licensed models, downloads, and user permissions
            expand.
      edges:
        - from: viral
          to: selfserve
        - from: selfserve
          to: mobile
        - from: selfserve
          to: paid
        - from: copilot
          to: selfserve
        - from: paid
          to: rights
        - from: mobile
          to: paid
    claimRefs:
      - CU001
      - CU002
      - CU016
      - CU017
      - CU018
      - CU019
