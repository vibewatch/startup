        title: Consumer scale and segment mix
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to Suno as a mass-market consumer and prosumer creation platform first, not a
              narrowly sold enterprise tool. By late February 2026, multiple outlets reported Suno had surpassed 100
              million historical users and 2 million paid subscribers, while Billboard had reported 1 million
              subscribers only a few months earlier, implying extremely fast paid growth. The official about page and
              app listings reinforce the same pattern: Suno describes itself as serving anyone from first-timers to
              experienced songwriters, and its mobile listings market the product equally to shower-singers, hobbyists,
              and more serious creators. App-store signals matter because they are one of the few public denominators
              outside company disclosures: Apple showed 257,000 ratings at 4.9 stars, while Google Play showed 1.61
              million reviews and 10 million-plus downloads. Together, those signals suggest a broad global
              top-of-funnel with substantial mobile participation, even though Suno still does not publish active users,
