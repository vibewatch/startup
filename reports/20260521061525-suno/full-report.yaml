      - number: '5.2'
        title: Model evolution and operating signals
        blocks:
          - type: paragraph
            body: >-
              The cleanest public version history starts with Discord-era Suno in 2023 and then becomes much more
              concrete from V2 onward. Current help-center materials do not preserve a detailed V1 specification, which
              is itself an important diligence point: public history before V2 is thin. From there, the trajectory is
              clear. V3 became the first officially described radio-quality model and pushed first-pass songs to two
              minutes. V3.5 then improved structure and moved first-pass generation to four minutes. V4 added the most
              meaningful quality-language change in reviewed official materials, with Suno explicitly tying the release
              to cleaner audio, sharper lyrics, better vocals, and more dynamic structure, while also upgrading Covers
              and Personas and adding Remaster. On technical substance, the public record is strongest on operations,
              not architecture. Modal shows real infrastructure scale—thousands of GPUs, chained inference functions,
              and elastic handling of seasonal peaks—while Rolling Stone’s 2024 profile shows that Suno’s product flow
              at V3 time combined Suno’s music model with ChatGPT for lyrics and titles. What remains missing is the key
              underwriter question: no reviewed current primary source explains the commercial model stack in enough
              detail to say whether it is fundamentally transformer, autoregressive, diffusion, or hybrid.
