      - number: '1.3'
        title: Funding, valuation, and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              Public financing history shows Suno moving quickly from early consumer launch to late-stage
              private-company scale. Lightspeed led a $125 million Series B in May 2024, at which point the investor
              said more than 10 million people had already used the product. The next major step was November 2025, when
              Suno raised a $250 million Series C at a $2.45 billion post-money valuation led by Menlo Ventures, with
              NVentures, Hallwood Media, Lightspeed, and Matrix also participating. Public sources reviewed for this
              chapter imply roughly $375 million of cumulative funding and treat the Series C valuation as the latest
              disclosed anchor. On operating scale, Suno publicly claimed in February 2026 that it had passed 2 million
              paid subscribers, 100 million total users, and $300 million in ARR, up from the $200 million annual
              revenue figure cited around the Series C. Those numbers indicate unusually strong consumer conversion and
              revenue velocity for an AI music product, but there are important gaps: reviewed sources did not disclose
              current headcount, profitability, gross margin, cash burn, runway, or enterprise customer concentration.
