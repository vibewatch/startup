      - number: '7.4'
        title: Monitoring triggers and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Because the public record mixes strong commercial traction with incomplete legal and economic detail, the
              most useful output is a trigger-based risk framework rather than a single static label. The thesis should
              be repriced immediately if the Massachusetts case produces an injunction, a court-endorsed theory that
              training data sourced through stream-ripping defeats fair use, or a public docket update showing the
              remaining major labels are not settling on workable economics. Separate triggers belong on misuse and
              distribution: a visible deepfake or voice-cloning incident involving a recognizable artist; a material
              rise in takedowns or regulator scrutiny tied to replica rules; or broader DSP treatment similar to
              Deezer's recommendation exclusions. Commercial triggers matter too. If Suno's licensed-model transition
              cuts free-tier sharing or paid download behavior more sharply than expected, or if partner traffic from
              Microsoft and WMG-led surfaces proves low-converting, then subscriber growth may mask deteriorating unit
              economics. The diligence agenda is therefore unusually concrete. Management should be asked for a current
              PACER-status memo, partner economics, training-corpus composition, moderation metrics, and a gross-margin
              bridge that isolates compute, licensing, and legal costs. Without those items, investors can see why the
              business is exciting, but they cannot cleanly size the residual exposure that sits between Suno's public
              momentum and durable enterprise value.
