  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Decision chain from topline proof and comp support through legal and platform haircuts to the final
      recommendation.
    approximationNotes: This is a qualitative decision map, not a probabilistic model.
    data:
      nodes:
        - id: scale
          label: Scale proof
          detail: 2M paid subscribers and $300M ARR indicate real demand.
        - id: pricing
          label: Pricing proof
          detail: $150 implied ARR per paid user is plausible against Pro and Premier tiers.
        - id: comps
          label: Comp support
          detail: Suno merits a premium to public content comps but not unlimited separation from them.
        - id: haircuts
          label: Haircuts
          detail: Litigation, licensing opacity, and platform-policy risk lower confidence in the mark.
        - id: mark
          label: Verified current mark
          detail: $2.45B is the only hard anchor retained in this run.
        - id: decision
          label: Recommendation
          detail: Track or invest only with downside protection near the verified mark; avoid rumor-led re-pricing.
      edges:
        - from: scale
          to: mark
          label: supports
        - from: pricing
          to: mark
          label: supports
        - from: comps
          to: mark
          label: frames premium
        - from: haircuts
          to: mark
          label: discounts
        - from: mark
          to: decision
          label: drives
    claimRefs:
      - CV006
      - CV008
      - CV035
      - CV040
