  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public scale
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports real top-line scale but not audited financial clarity. TechCrunch reported that
              Suno’s November 2025 Series C came at a $2.45 billion post-money valuation after the company said annual
              revenue had reached $200 million. By late February 2026, TechCrunch, Billboard, and Music Business
              Worldwide all reported 2 million paid subscribers and $300 million of ARR, with more than 100 million
              people having used the platform. That trajectory implies a very fast run-rate jump in roughly three
              months, but the public record mixes “annual revenue” and “ARR” terminology without a reconciliation to
              GAAP revenue, deferred revenue, or churn-adjusted subscription revenue. The revenue model itself still
              looks overwhelmingly subscription-led: official pricing documents expose only self-serve Free, Pro, and
              Premier tiers, while public API or enterprise pricing remains absent. The right interpretation is that
              Suno has proven consumer willingness to pay at scale, but public sources still do not separate recurring
              subscription revenue, partner revenue, or one-off monetization layers cleanly enough for full
              underwriting.
