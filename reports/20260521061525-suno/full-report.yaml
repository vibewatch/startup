      - number: '2.5'
        title: Constraints, contradictions, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The same evidence also shows why Suno's market should not be underwritten as frictionless. Adobe's
              creators cite cost, output quality, and training transparency as the leading barriers, and 69% worry their
              content may be used to train AI without permission. Suno's own California disclosure confirms that its
              models use tens of millions of public music files and keep collecting data, while the RIAA complaint
              alleges mass infringement and market-substituting outputs. IFPI and the Copyright Office both show that
              the policy baseline is still moving: the industry wants licensed training and artist control, and the
              Copyright Office's training report is still only in pre-publication-finalization status.


              Ownership is also messy. Suno's current help pages emphasize commercial-use rights rather than guaranteed
              copyright, and they say registration depends on significant human contribution. Digital Music News reports
              that the company shifted away from a stronger ownership-like framing after the Warner deal. Even Suno's
              own product documentation conflicts on upload limits, and concrete 2026 download-cap schedules are still
              not public. Finally, lock-in appears limited because many creators already multi-home across AI tools. The
              market is therefore real, but it is legally, operationally, and economically more ambiguous than headline
              TAM decks suggest.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM037
              - CM038
              - CM039
              - CM040
              - CM041
              - CM042
              - CM043
