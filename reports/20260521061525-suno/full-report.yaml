      - number: '1.4'
        title: Milestones, partnerships, and adverse events
        blocks:
          - type: paragraph
            body: >-
              Suno’s chronology is important because it shows both rapid product expansion and a simultaneous scramble
              to normalize relations with the music industry. The company came out of stealth in December 2023 with
              Copilot distribution, hit a major Series B in May 2024, then was sued by the RIAA and major labels in June
              2024 over alleged mass copyright infringement. Rather than slowing down, Suno kept broadening the product:
              Paul Sinclair joined as Chief Music Officer in July 2025, Suno Studio launched in September 2025 for more
              professional workflows, and the company announced a $250 million Series C in November 2025. That same
              month Warner Music Group settled with Suno and announced a licensed partnership that also transferred
              Songkick to Suno and previewed more restrictive paid-download and licensed-model economics for 2026. In
              February 2026 Suno added Jeremy Sirota as Chief Commercial Officer and publicly disclosed new user and ARR
              milestones, and in March 2026 the company announced v5.5. The central adverse conclusion is unchanged:
              copyright and training-data risk remain material because Sony, UMG, European rights groups, and artist
              plaintiffs were still active, and later reporting added stream-ripping allegations and class-action
              pressure to the case mix.
