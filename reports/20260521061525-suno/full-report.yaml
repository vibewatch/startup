  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape by competitor class
        blocks:
          - type: paragraph
            body: >-
              Suno’s competitor set is broader than “other AI song apps.” The closest direct peer is Udio because it
              also targets full songs with vocals, remix-style iteration, and paid commercial use. A second class
              includes infrastructure or soundtrack-first products such as Mubert and Stable Audio, which are often
              better understood as background-audio, API, or technical-control alternatives than as viral consumer song
              brands. A third class is open-source or internal build: MusicGen and newer local stacks matter because
              they reduce subscription dependence, improve privacy, and make the generation layer easier to commoditize.
              A fourth class is adjacent platform entrants and substitutes. Google’s Lyria rides Gemini, Vertex, and
              YouTube; ElevenLabs is extending a large audio suite into music and mobile; Adobe Firefly addresses
              commercially safe instrumental scoring; and Canva’s audio workflow plus stock tracks already solve the
              simplest creator soundtrack job. The result is a market where Suno does not face one monolithic competitor
              so much as several rivals that each own a different slice of the value chain—song quality, API access,
              licensing safety, social distribution, or incumbent workflow share.
