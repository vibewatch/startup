  topStrengths:
    - >-
      Rare consumer-scale proof for a private creative tool: 2 million paid subscribers, 100 million+ users, and roughly
      $300 million of ARR by February 2026.
    - >-
      Product breadth now extends beyond simple prompting into uploads, covers, personas, editing, stems, Studio, mobile
      creation, and Copilot distribution.
    - >-
      Freemium packaging creates a clear conversion ladder because commercial rights, higher throughput, and advanced
      workflows are reserved for paid plans.
    - >-
      The Warner partnership and licensed-model roadmap can improve legitimacy and downstream industry access if
      execution holds.
  topRisks:
    - >-
      Copyright and training-data litigation remains the core risk, with active label disputes, stream-ripping
      allegations, and European collection-society actions still unresolved.
    - >-
      Margin quality is unproven because gross margin, cash burn, legal reserve, licensing payouts, and future label
      economics remain undisclosed.
    - >-
      Customer proof is much stronger for consumer self-serve demand than for enterprise accounts, API usage, or durable
      B2B renewals.
    - >-
      Rights-holder partnerships may reduce one litigation path while increasing dependency on external counterparties
      for product rules, download rights, and economics.
    - >-
      Governance and operating disclosure still trail company scale, with limited public detail on board composition,
      investor controls, and broader executive bench depth.
  unresolvedGaps:
    - >-
      Exact gross margin, cash burn, runway, legal reserve, and licensing payout structure after the Warner settlement
      and any later label deals.
    - >-
      Clean resolution of the remaining plaintiff and jurisdiction mix across Sony, UMG, Koda, GEMA, and any artist
      actions after the November 2025 Warner settlement.
    - >-
      Cohort retention, churn, and paid-subscriber behavior after the licensed-model transition, download caps, and
      paid-only download rules.
    - >-
      Revenue mix between consumer subscriptions, partner channels, and any enterprise or API products, plus customer
      concentration by cohort.
    - Board composition, investor protections, later-round terms, and broader executive-bench maturity.
