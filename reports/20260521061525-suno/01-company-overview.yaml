  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: Current employee count by function and location.
      whyItMatters: >-
        Headcount is needed to assess operating leverage, hiring discipline, and whether revenue
        scale is being achieved with an efficient team.
      diligencePath: >-
        Request current org chart, total headcount, and 12-month hiring / attrition data from
        management.
      relatedQuestionRefs:
        - QO012
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
        Board composition, observer rights, protective provisions, and investor control terms from
        Series B and Series C.
      whyItMatters: >-
        Governance rights determine decision control, future financing flexibility, and
        founder/investor alignment at a sensitive licensing stage.
      diligencePath: >-
        Request current board materials, voting agreements, financing docs, and post-Series C cap
        table.
      relatedQuestionRefs:
        - QO015
      relatedTableRefs:
        - TO002
        - TO003
    - type: private-evidence-only
      severity: material
      topic: customer-scale
      missingEvidence: >-
        Enterprise customer count, named-customer mix, and consumer-versus-enterprise revenue
        contribution.
      whyItMatters: >-
        Without customer-mix detail, investors cannot tell whether the current revenue base is
        durable subscription breadth or concentrated partnership / enterprise exposure.
      diligencePath: >-
        Request customer segmentation, cohort retention, top-customer concentration, and channel mix
        by revenue.
      relatedQuestionRefs:
        - QO021
      relatedTableRefs:
        - TO003
    - type: private-evidence-only
      severity: material
      topic: profitability
      missingEvidence: >-
        Gross margin, compute cost trends, burn, runway, and scenario analysis under different
        licensing outcomes.
      whyItMatters: >-
        The investment case depends on whether rapid ARR growth can outrun compute and licensing
        costs while litigation remains unresolved.
      diligencePath: >-
        Request detailed P&L, compute-spend breakdown, licensing obligations, and base / downside
        cash runway models.
      relatedQuestionRefs:
        - QO024
