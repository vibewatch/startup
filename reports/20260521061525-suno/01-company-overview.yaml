callouts:
  - calloutType: strength
    title: Consumer monetization is already large by private-company standards
    body: >-
      The strongest top-line positive in chapter 1 is Suno’s combination of 2M+ paid subscribers,
      100M+ total users, and $300M ARR by February 2026. Even if the company-reported figures
      require private diligence confirmation, they imply unusually fast consumer conversion for an
      AI music product and help explain why the company could raise a large Series C despite
      unresolved litigation.
    claimRefs:
      - CO009
      - CO010
      - CO012
      - CO037
  - calloutType: risk
    title: Copyright litigation is a core business-model risk, not background noise
    body: >-
      Suno’s legal exposure goes beyond a generic AI-policy debate. The June 2024 RIAA case, later
      stream-ripping allegations, artist class actions, and the still-open Sony / UMG disputes all
      threaten the training-data, output-rights, and download economics that support the current
      product and pricing stack. The Warner settlement helped, but did not fully clear the overhang.
    claimRefs:
      - CO020
      - CO025
      - CO027
      - CO028
      - CO040
  - calloutType: risk
    title: Governance disclosure trails company scale
    body: >-
      Public information is rich on growth and product but still thin on internal control structure.
      Reviewed sources did not disclose a detailed board roster, investor protective provisions, or
      a fully built-out non-founder executive bench. That asymmetry raises diligence questions
      around governance maturity, decision rights, and operational resilience as Suno scales.
    claimRefs:
      - CO019
      - CO034
      - CO037
