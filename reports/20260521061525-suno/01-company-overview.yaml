company:
  name: Suno
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Suno is a Cambridge, Massachusetts-based AI music company founded in 2022 by four former Kensho
    employees. It monetizes a freemium subscription product for text-to-song generation and by
    February 2026 publicly claimed more than 2 million paid subscribers and $300 million of ARR
    after a $250 million Series C at a $2.45 billion post-money valuation in November 2025. Product
    momentum, Copilot distribution, and a Warner Music licensing partnership support the growth
    story, but unresolved copyright litigation, thin public governance disclosure, and limited
    operating transparency remain material diligence risks.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Suno presents itself not as a generic AI lab but as a music company built to amplify
      imagination and broaden access to music creation. Official materials describe a platform for
      everyone from shower-singers to seasoned artists, while the product itself turns text prompts
      into full songs with vocals and instrumentation and now supports deeper editing and audio
      uploads. The commercial model is freemium. The free plan still exposes users to the core
      generation experience, but paid Pro and Premier plans unlock materially more credits, advanced
      models, editing features, commercial use rights for newly created songs, personal-voice tools,
      and Suno Studio access at the top tier. That structure matters: it means Suno is monetizing
      creator intent rather than passive listening inventory, and its current policy mix
      increasingly nudges heavy users toward paid conversion. The official site supports a Cambridge
      headquarters and three-office footprint across Cambridge, New York, and Los Angeles, but does
      not disclose employee count or broader operating metrics beyond product and plan design.
    claimRefs:
      - CO001
      - CO002
      - CO006
      - CO007
      - CO008
      - CO029
      - CO030
      - CO031
      - CO035
      - CO038
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: founders-leadership-and-governance
    title: Founders, leadership, and governance
    body: >-
      Suno was founded in 2022 by Mikey Shulman, Georg Kucsko, Martin Camacho, and Keenan Freyberg,
      who previously worked together at Kensho. That lineage is strategically important because it
      combines machine-learning engineering experience with a shared interest in music and
      productization. Shulman is the clearly dominant public executive voice: he is the co-founder
      and CEO quoted across fundraising, media, and legal coverage, and he still anchors the company
      narrative around democratizing music creation. In 2025 and 2026 Suno added more explicit
      music-industry leadership, most notably Paul Sinclair as Chief Music Officer and Jeremy Sirota
      as Chief Commercial Officer. Those hires improve industry-facing depth, especially around
      licensing, platform partnerships, and enterprise solutions. Even so, public disclosure remains
      thin versus the company’s scale. Reviewed sources did not surface an independently confirmed
      CFO, COO, or detailed board roster, nor did they disclose investor control rights or
      governance terms from later financings. That leaves real key-person and governance diligence
      work outstanding despite the stronger music-business bench.
    claimRefs:
      - CO003
      - CO004
      - CO016
      - CO017
      - CO018
      - CO019
      - CO034
      - CO037
    tableRefs:
      - TO002
  - id: funding-valuation-and-disclosed-scale
    title: Funding, valuation, and disclosed scale
    body: >-
      Public financing history shows Suno moving quickly from early consumer launch to late-stage
      private-company scale. Lightspeed led a $125 million Series B in May 2024, at which point the
      investor said more than 10 million people had already used the product. The next major step
      was November 2025, when Suno raised a $250 million Series C at a $2.45 billion post-money
      valuation led by Menlo Ventures, with NVentures, Hallwood Media, Lightspeed, and Matrix also
      participating. Public sources reviewed for this chapter imply roughly $375 million of
      cumulative funding and treat the Series C valuation as the latest disclosed anchor. On
      operating scale, Suno publicly claimed in February 2026 that it had passed 2 million paid
      subscribers, 100 million total users, and $300 million in ARR, up from the $200 million annual
      revenue figure cited around the Series C. Those numbers indicate unusually strong consumer
      conversion and revenue velocity for an AI music product, but there are important gaps:
      reviewed sources did not disclose current headcount, profitability, gross margin, cash burn,
      runway, or enterprise customer concentration.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO029
      - CO032
      - CO033
      - CO037
    tableRefs:
      - TO003
    figureRefs:
      - FO003
  - id: milestones-partnerships-and-adverse-events
    title: Milestones, partnerships, and adverse events
    body: >-
      Suno’s chronology is important because it shows both rapid product expansion and a
      simultaneous scramble to normalize relations with the music industry. The company came out of
      stealth in December 2023 with Copilot distribution, hit a major Series B in May 2024, then was
      sued by the RIAA and major labels in June 2024 over alleged mass copyright infringement.
      Rather than slowing down, Suno kept broadening the product: Paul Sinclair joined as Chief
      Music Officer in July 2025, Suno Studio launched in September 2025 for more professional
      workflows, and the company announced a $250 million Series C in November 2025. That same month
      Warner Music Group settled with Suno and announced a licensed partnership that also
      transferred Songkick to Suno and previewed more restrictive paid-download and licensed-model
      economics for 2026. In February 2026 Suno added Jeremy Sirota as Chief Commercial Officer and
      publicly disclosed new user and ARR milestones, and in March 2026 the company announced v5.5.
      The central adverse conclusion is unchanged: copyright and training-data risk remain material
      because Sony, UMG, European rights groups, and artist plaintiffs were still active, and later
      reporting added stream-ripping allegations and class-action pressure to the case mix.
    claimRefs:
