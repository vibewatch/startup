    title: "Mammoth competes as a platform, not a single-product biotech"
    body: "The strongest differentiation in the assigned pool is scope: Mammoth is presented across therapeutics, diagnostics, and discovery, whereas several adjacent alternatives attack only one layer of the workflow."
    claimRefs: ["CP001", "CP002", "CP009", "CP010", "CP011"]
  - calloutType: "risk"
    title: "Public proof still lags the incumbent benchmark"
    body: "The peer set includes CRISPR companies with public therapeutic results, while the current independent profile in the pool still describes Mammoth's own therapeutic pipeline as preclinical or early stage."
    claimRefs: ["CP004", "CP012"]
