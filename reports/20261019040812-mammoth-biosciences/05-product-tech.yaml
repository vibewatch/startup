  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: commercial-maturity
      missingEvidence: Current product catalog by assay or therapeutic program, with named production deployments and stage-by-stage regulatory status.
      whyItMatters: Platform breadth is easier to verify than present-day monetizable product maturity, which limits underwriting of near-term execution.
      diligencePath: Request a current pipeline and product sheet that lists each diagnostic and therapeutic program, stage, partner, and regulatory milestone.
      relatedQuestionRefs: [QE005]
      relatedTableRefs: [TE001, TE002]
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: External documentation for manufacturing quality systems, privacy or security controls, and a credible practitioner-community proxy for technical adoption.
      whyItMatters: Product diligence needs trust and execution controls, especially when diagnostics and in vivo therapeutics depend on safety, compliance, and partner integration.
      diligencePath: Ask management for quality-system and compliance materials, then corroborate with certification records, regulatory filings, or practitioner references.
      relatedQuestionRefs: [QE007]
    - type: stale
      severity: material
      topic: partner-deployment
      missingEvidence: Fresh evidence on which of the historical partner and funder programs remain active and productized as of the 2026 run date.
      whyItMatters: Older partnership announcements are not proof of current commercial traction or ongoing deployment readiness.
      diligencePath: Re-verify each named program with current partner updates, regulatory records, or customer-facing product materials.
      relatedQuestionRefs: [QE006]
