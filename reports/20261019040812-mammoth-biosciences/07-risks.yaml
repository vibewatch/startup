        any investor-rights or preference stack details.
      whyItMatters: >-
        Public evidence confirms liquidity risk and valuation opacity but does not
        show whether Mammoth can fund the current breadth of execution without a
        dilutive or weakly priced round.
      diligencePath: >-
        Review board-approved budget, cap table, recent financing documents, and
        internal valuation support.
