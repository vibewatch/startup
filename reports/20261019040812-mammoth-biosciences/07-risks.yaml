callouts:
  - calloutType: risk
    title: Primary thesis-break triggers
    body: >-
      The public case worsens materially if Mammoth still cannot show a therapeutic
      timeline or named de-risking milestones at the next major financing or
      partnership update, if the flagship strategic collaboration narrows, or if
      valuation remains opaque while liquidity stays approval constrained.
    claimRefs:
      - CR003
      - CR006
      - CR010
      - CR011
      - CR016
  - calloutType: insight
    title: Real mitigants, but not mature enough to erase execution risk
    body: >-
      Novel non-Cas9 systems, exclusive licenses, experienced legal leadership, and
      milestone-bearing partnerships clearly improve the odds of technical and IP
      progress, but they do not substitute for disclosed clinical timelines,
      quality controls, or commercial concentration data.
    claimRefs:
      - CR006
      - CR012
      - CR013
      - CR014
