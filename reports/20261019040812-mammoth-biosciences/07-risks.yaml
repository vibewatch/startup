    - type: missing-source
      severity: material
      topic: regulatory-readiness
      missingEvidence: >-
        Lead-program clinical stage, IND or CTA status, preclinical safety package,
        and target human-study timing for Mammoth's current therapeutic pipeline.
      whyItMatters: >-
        The biggest residual risk is whether the platform can cross from discovery
        promise into regulated human therapeutics on a visible timetable.
      diligencePath: >-
        Request the current pipeline deck, regulator correspondence, preclinical tox
        package, and trial-registry references by program.
