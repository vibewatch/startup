  - id: FM001
    title: Evidence-constrained market sizing lens
    type: pyramid
    summary: >-
      The market narrows from broad CRISPR optionality to programs where Mammoth's compact systems solve a delivery
      problem, but no layer has a supportable dollar value in the assigned evidence.
    data:
      items:
        - label: Broad programmable-biology optionality
          displayValue: Not quantified
          note: >-
            Historical sources name healthcare and non-healthcare applications, but technical possibility is not
            addressable spend.
          tone: neutral
        - label: CRISPR diagnostics and therapeutics
          displayValue: Not quantified
          note: Mammoth historically spanned both categories; the current official emphasis is therapeutics.
          tone: neutral
        - label: In vivo gene-editing programs
          displayValue: Not quantified
          note: Current company positioning centers potential long-term curative therapies delivered in vivo.
          tone: opportunity
        - label: Delivery-constrained targets and tissues
          displayValue: Not quantified
          note: Compact systems are most relevant when payload size or tissue access prevents a conventional approach.
          tone: opportunity
        - label: Mammoth-owned and partnered priority programs
          displayValue: Target count not disclosed
          note: >-
            Public evidence confirms a wholly owned pipeline and partnerships but not a complete current program
            inventory.
          tone: risk
        - label: Reimbursable commercial opportunity
          displayValue: Price and eligible population unknown
          note: >-
            Clinical success, approved indication, pricing, and payer coverage are required before a commercial SOM can
            be estimated.
          tone: risk
    approximationNotes: >-
      Conceptual layers are ordered by narrowing relevance, not proportional value; the figure intentionally assigns no
      unsupported TAM, SAM, SOM, conversion rate, market share, or patient count.
    claimRefs:
      - CM001
      - CM002
      - CM004
      - CM008
      - CM014
      - CM015
