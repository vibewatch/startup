      - number: '5.2'
        title: Discovery engine and architecture
        blocks:
          - type: paragraph
            body: >-
              The most concrete technical disclosure comes from Mammoth's protein-discovery page and its 2025 NanoCas
              announcement. The company says its operating model starts with metagenomic sequence databases and
              proprietary AI search, then moves through wet-lab screening and protein engineering to build a portfolio
              of ultracompact Cas systems. Official materials also frame this as a modality platform, not just a
              nuclease program: Mammoth highlights nuclease, epigenetic, base-editing, and RT-editing scaffolds.
              Independent coverage reinforces that architecture by describing a broader CRISPR toolbox that includes
              Cas14 and Casphi-family systems for different targeting and delivery problems.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE008
              - CE009
