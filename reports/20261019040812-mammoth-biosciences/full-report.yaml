      - number: '3.2'
        title: Commercial access runs through partnerships, not transparent list pricing
        blocks:
          - type: paragraph
            body: >
              Mammoth's official surfaces emphasize integration and partnerships instead of public, self-serve
              packaging. The diagnostics page says DETECTR can be integrated into products built by Mammoth or by
              partners, and the About page discloses collaboration economics with Regeneron rather than customer list
              pricing. Third-party pages reinforce the same pattern: BioAI labels Mammoth's pricing as "Contact" and
              "Partnership-based," while UpMarket summarizes the company as a private-market issuer with partner
              relationships across Vertex, Bayer, and Regeneron. That access model can be an advantage against smaller
              entrants because it embeds Mammoth inside partner channels and development budgets, but it also makes
              apples-to-apples price comparison hard and leaves switching-cost claims dependent on relationship depth
              rather than observable contract structure.
            claimRefs:
