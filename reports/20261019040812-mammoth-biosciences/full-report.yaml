  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosed economics
        blocks:
          - type: paragraph
            body: >-
              Mammoth's public evidence supports a collaboration-led revenue thesis, not an operating model anchored in
              disclosed product sales. The official site frames the company as a platform business with a wholly owned
              therapeutic pipeline plus pharmaceutical partnerships, and the only clearly quantified operating economics
              in the assigned pool are partner terms: Regeneron is described as a multiple-indication collaboration with
              a $100 million upfront and equity investment, up to $370 million per target in development, regulatory,
              and commercial milestones, and royalties ranging from single digits to mid teens on future net sales.
              Older NFX and Global Biodefense coverage shows the same pattern earlier in Mammoth's life, with platform
              extension funded through new rounds and partner deals such as Horizon Discovery rather than through
              publicly priced recurring products. The verified bridge is therefore partner selection to upfront cash,
              then milestones, then royalties, with material gaps around timing, revenue recognition, and how much of
              that theoretical value becomes recognized revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
              - CI010
              - CI013
