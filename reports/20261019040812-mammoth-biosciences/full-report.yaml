              - CP011
              - CP014
      - number: '3.3'
        title: The moat case is real, but incumbents and software entrants can still compress it
        blocks:
          - type: paragraph
            body: >
              The durable-bull case is that Mammoth owns a broader CRISPR toolbox than legacy Cas9-focused programs and
              can use that breadth across therapeutics, diagnostics, and partnered discovery. Official pages highlight
              ultracompact systems, multiple editing modalities, and a partner-enabled portfolio, while NFX argues that
              Horizon plugging into the platform creates network effects over time. But the same evidence set also shows
              why the moat is not settled. TechCrunch's benchmark incumbents already had public therapeutic milestones,
              and BioAI's 2026 profile still flags Mammoth's core therapeutic programs as preclinical or early stage
              with no public list pricing. In practice, that means Mammoth may hold a differentiated platform narrative
              while still facing displacement risk from clinically validated therapeutic leaders, from design-software
              entrants that simplify early workflow steps, and from customers who choose to build around legacy systems
              in-house rather than route programs through Mammoth.
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP012
              - CP015
