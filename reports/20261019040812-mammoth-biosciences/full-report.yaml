              - CE004
              - CE005
              - CE011
      - number: '5.3'
        title: Maturity, deployment, and control gaps
        blocks:
          - type: paragraph
            body: >-
              The platform appears technically differentiated, but public maturity is still uneven. The strongest recent
              proof point is preclinical: Mammoth says NanoCas achieved extrahepatic editing in animal models via a
              single AAV vector, including macaque skeletal muscle work and limited off-target findings in liver tissue.
              Commercialization evidence is thinner. Independent reporting ties deployment to partners and funders such
              as DARPA, NIH RADx, GSK, and Horizon rather than to a transparent, currently disclosed roster of
              production products or customers. Public evidence also emphasizes ethical framing around somatic editing,
              yet the assigned source pool does not surface a current external package for security, privacy,
              manufacturing quality systems, or practitioner-community adoption, leaving trust and scale-up diligence
              unfinished.
            claimRefs:
              - CE007
              - CE010
              - CE011
              - CE012
              - CE013
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Reusable platform is the core asset
            body: >-
              Mammoth's clearest differentiation is a discovery-and-engineering engine that can feed multiple CRISPR
              modalities and partner paths rather than a single disease program.
            calloutType: strength
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE008
          - type: callout
            title: Public maturity proof lags the platform narrative
            body: >-
              The best disclosed technical validation is still preclinical and partner-mediated, while current
              commercial product depth, quality systems, and public practitioner signal remain under-disclosed.
            calloutType: risk
            claimRefs:
              - CE007
              - CE011
