  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Mammoth currently describes itself as an ultracompact-CRISPR therapeutics company pursuing long-term
              curative in vivo therapies, so the investable core should be bounded around programs where editing payload
              size, delivery, specificity, or modality breadth can change feasibility. Historical company-issued and
              independent coverage shows a broader platform spanning diagnostics, gene editing, and therapeutics, but
              that breadth is optionality rather than proof that every CRISPR application is addressable spend. Included
              activity is therefore Mammoth-owned therapeutic development and partner-funded compact-nuclease programs.
              Diagnostics licensing, bioproduction tools, and other detection workflows are adjacencies. Generic
              life-science research, ex vivo editing, unrelated molecular tests, agriculture, and biodefense should be
              excluded until there is current monetization evidence. Status-quo substitutes include larger CRISPR
              systems, split-vector delivery, central-lab molecular testing, chronic drug therapy, and programs
              abandoned because delivery or development economics remain unattractive.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              None of the eight assigned sources provides a publisher-grade estimate of Mammoth's current therapeutic
              TAM, a disease-level SAM, a probability- adjusted SOM, or a comparable CAGR. The chapter therefore treats
              explicit transaction terms and historical financing only as context, not as market size. Mammoth reports
              that its Regeneron relationship included $100 million of upfront and equity consideration and potential
              milestones of up to $370 million per target; those terms show strategic willingness to pay for platform
              access but are neither recognized revenue nor aggregate demand. TechCrunch's 2021 report of a $150 million
              Series D, $195 million in cumulative financing, and a valuation above $1 billion similarly demonstrates
              investor validation rather than customer spend. A credible bottom-up model would require eligible patient
              populations, target counts, program probabilities, treatment pricing, partner economics, and timing, none
              of which the assigned pool supplies consistently.
            claimRefs:
              - CM003
              - CM007
              - CM014
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM009
              - CM014
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
