        title: Exhibits
        blocks:
          - type: callout
            title: Mammoth competes as a platform, not a single-product biotech
            body: >-
              The strongest differentiation in the assigned pool is scope: Mammoth is presented across therapeutics,
              diagnostics, and discovery, whereas several adjacent alternatives attack only one layer of the workflow.
            calloutType: insight
            claimRefs:
