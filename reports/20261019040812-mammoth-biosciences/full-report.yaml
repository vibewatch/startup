  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a partner-led bridge from platform access to upfront, milestone, and royalty economics,
      but not to disclosed gross profit.
    data:
      nodes:
        - id: platform
          label: Platform and partnerable IP
          value: Cas14 / CasΦ toolkit and platform access
          note: Official and partner sources describe Mammoth as a cross-diagnostics and therapeutics platform.
        - id: partner
          label: Partner selects a program
          value: Program-level collaboration
          note: Public examples include Regeneron and Horizon Discovery.
        - id: upfront
          label: Upfront / equity cash
          value: $100M upfront + equity
          note: Published on Mammoth's official site for Regeneron.
        - id: milestones
          label: Development milestones
          value: Up to "$370M per target"
          note: Economics are disclosed; timing and realization are not.
        - id: royalties
          label: Royalties on launches
          value: Single digits to mid teens
          unit: '% of future net sales'
          note: Depends on approved products and partner commercialization.
        - id: gross-profit
          label: Gross profit and self-funding capacity
          value: Undisclosed
          note: Public sources do not quantify recognized revenue, COGS, or margin by stream.
      edges:
        - from: platform
          to: partner
          label: Platform fit and dealmaking
        - from: partner
          to: upfront
          label: Signature economics
        - from: upfront
          to: milestones
          label: Programs advance
        - from: milestones
          to: royalties
          label: Approval and launch
        - from: royalties
          to: gross-profit
          label: Margin depends on undisclosed cost structure
    approximationNotes: >-
      Sequence describes monetization logic from disclosed collaboration terms; it is not a forecast of timing,
      probability, or realized profit.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI009
      - CI013
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Mammoth's public architecture runs from discovery data through engineered Cas systems into therapeutics,
      diagnostics, and partner-enabled tools.
    data:
      layers:
        - label: Discovery inputs
          detail: Metagenomic data and proprietary search systems feed the discovery funnel.
          modules:
            - name: Metagenomic sequence databases
              detail: Large and growing databases plus exclusive sample data
            - name: Proprietary AI search
              detail: In-silico search for novel CRISPR systems and associated technologies
        - label: Validation and engineering
          detail: Candidate systems are screened and optimized before platform deployment.
          modules:
            - name: Wet-lab screening
              detail: High-throughput testing of protein characteristics and function
            - name: Protein engineering
              detail: Targeted optimization of candidates after screening
        - label: CRISPR toolkit
          detail: Mammoth organizes outputs as a reusable set of Cas families and modalities.
          modules:
            - name: Novel Cas families
              detail: Cas14, Casphi-family systems, and NanoCas-like ultracompact editors
            - name: Modality scaffolds
              detail: Nuclease, base, epigenetic, and RT-editing workflows
        - label: Delivery fit
          detail: Ultracompact editors are positioned around delivery-constrained in vivo use cases.
          modules:
            - name: Single-AAV compatibility
              detail: Official NanoCas positioning emphasizes room for guides and additional payload
            - name: Extrahepatic targeting
              detail: Preclinical proof points focus on muscle and heart rather than only liver delivery
        - label: Diagnostics layer
          detail: A separate diagnostic surface uses CRISPR chemistry for near-patient detection.
          modules:
            - name: DETECTR diagnostics
              detail: Point-of-care or lab-adjacent molecular testing workflows
            - name: EUA-era validation
              detail: COVID-period CRISPR diagnostic validation and emergency-use evidence
        - label: Product surfaces
          detail: The toolkit feeds both Mammoth-owned programs and partner-led products.
          modules:
            - name: In vivo therapeutics
              detail: Delivery-constrained gene editing and wholly owned pipeline programs
            - name: Diagnostics and partner tools
              detail: DETECTR diagnostics plus collaboration-led research and bioproduction tools
    approximationNotes: Public evidence supports the stack at platform level, but not a complete current product-by-product release map.
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE011
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Mammoth's public customer journey runs from platform evaluation into partner-funded diagnostics and therapeutic
      collaborations, with real execution proof but limited retention disclosure.
    data:
      items:
        - label: Platform evaluation
          actor: Biopharma and diagnostics counterparties
          stage: Discovery
          touchpoints:
            - Platform pitch centers on ultra-compact CRISPR systems and partner access
            - Early demand is driven by counterparties seeking complementary skills or differentiated IP
          tone: neutral
        - label: Diagnostics sponsorship
          actor: NIH RADx, DARPA, GSK
          stage: Validation
          touchpoints:
            - External sponsors fund or accelerate point-of-care and high-throughput diagnostics work
            - Public proof is strongest in infectious-disease testing rather than broad horizontal adoption
          tone: opportunity
        - label: Manufacturing scale-up
          actor: Merck MilliporeSigma and operations teams
          stage: Execution
          touchpoints:
            - 20-kit pilot lot and validation work convert one assay from development into launch-ready operations
            - Supply-chain and QC coordination provide the clearest evidence of real deployment work
          tone: opportunity
        - label: Regulatory / market proof
          actor: Agilent-linked DETECTR BOOST program
          stage: Proof point
          touchpoints:
            - High-throughput EUA milestone demonstrates real-world validation
            - Public sources still omit steady-state order flow or active installed-base data
          tone: opportunity
        - label: Platform expansion
          actor: Regeneron, Vertex, Bayer, Horizon Discovery
          stage: Expansion
          touchpoints:
            - Expansion is partner-led across therapeutics and research tools
            - Economics can be large, but progress and concentration by partner remain opaque
          tone: neutral
        - label: Durability gap
          actor: Investors and diligence teams
          stage: Underwriting
          touchpoints:
            - No public NRR, GRR, churn, or customer-count denominator in the reviewed source set
            - Concentration and renewal risk therefore stay open diligence questions
          tone: warning
    approximationNotes: null
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU006
      - CU007
      - CU012
      - CU013
