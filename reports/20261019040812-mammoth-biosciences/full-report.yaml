  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The call stays at track because historical financing strength and platform breadth are offset by stale valuation
      evidence, early-stage execution risk, and missing current terms.
    data:
      nodes:
        - id: n1
          label: Historical financing strength
          note: 2020-2021 rounds culminated in a >$1B valuation.
        - id: n2
          label: Platform breadth
          note: Diagnostics + therapeutics can create multiple milestone paths.
        - id: n3
          label: Commercial and clinical proof gap
          note: Independent coverage still frames the tech as early-stage.
        - id: n4
          label: Current price opacity
          note: Retained current sources do not disclose fresh share terms or a new mark.
        - id: n5
          label: Scenario skew
          note: Base case dominates until operating metrics and milestones are refreshed.
        - id: n6
          label: 'Recommendation: track'
          note: Stay engaged, but require current metrics and terms before underwriting entry.
      edges:
        - from: n1
          to: n2
          label: supports upside
        - from: n2
          to: n3
          label: still needs proof
        - from: n3
          to: n4
          label: raises underwriting risk
        - from: n4
          to: n5
          label: keeps range wide
        - from: n5
          to: n6
          label: drives price discipline
    approximationNotes: Sequence figure summarizes source-backed logic rather than a mathematical valuation model.
    claimRefs:
      - CV002
      - CV006
      - CV009
      - CV015
      - CV016
