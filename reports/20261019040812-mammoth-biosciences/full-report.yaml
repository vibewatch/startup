    sections:
      - number: '1.1'
        title: Identity and operating posture
        blocks:
          - type: paragraph
            body: >-
              Mammoth now leads its public story with in vivo gene-editing therapeutics, but it still frames itself as a
              broader CRISPR platform spanning diagnostics and partnerships. The retained evidence places the company in
              Brisbane, California within the San Francisco Bay Area and supports a business model centered on a wholly
              owned therapeutic pipeline plus collaboration economics rather than disclosed product revenue. For later
              chapters, the practical baseline is a science-led private biotech/platform company with credible technical
              assets but thin current commercial disclosure.
