            title: Public proof still lags the incumbent benchmark
            body: >-
              The peer set includes CRISPR companies with public therapeutic results, while the current independent
              profile in the pool still describes Mammoth's own therapeutic pipeline as preclinical or early stage.
            calloutType: risk
            claimRefs:
