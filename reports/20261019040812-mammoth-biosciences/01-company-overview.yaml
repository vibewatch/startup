callouts:
- calloutType: strength
  title: Scientific brand and capital access are real assets
  body: Few private CRISPR companies can pair Jennifer Doudna's founding role, a current Regeneron economics disclosure, and a unicorn financing history in the same public file. That combination meaningfully improves Mammoth's partnerability and ability to raise around a platform strategy rather than a single program.
  claimRefs:
  - CO003
  - CO005
  - CO011
  - CO013
- calloutType: risk
  title: Current operating proof is still under-disclosed
  body: The last hard valuation and headcount markers in retained evidence are still from 2021, and the current public file does not establish revenue, customers, or a refreshed external valuation. Combined with Fierce's reminder that the technology remained early-stage and safety-dependent, that leaves investors relying more on platform promise than on current operating disclosure.
  claimRefs:
  - CO011
  - CO013
  - CO014
  - CO016
