company:
  name: Mammoth Biosciences
chapter:
  number: 1
  title: Company Overview
  summary: Mammoth Biosciences is still best understood as a private CRISPR platform company whose current public posture is therapeutics-led but still tied to diagnostics and partnership economics. The company combines elite scientific credibility and blue-chip financing history with material disclosure gaps on current valuation, revenue, customer traction, and post-2021 scale.
sections:
- id: identity-and-operating-posture
  title: Identity and operating posture
  body: Mammoth now leads its public story with in vivo gene-editing therapeutics, but it still frames itself as a broader CRISPR platform spanning diagnostics and partnerships. The retained evidence places the company in Brisbane, California within the San Francisco Bay Area and supports a business model centered on a wholly owned therapeutic pipeline plus collaboration economics rather than disclosed product revenue. For later chapters, the practical baseline is a science-led private biotech/platform company with credible technical assets but thin current commercial disclosure.
  claimRefs:
  - CO001
  - CO002
  - CO006
  - CO007
  - CO016
  tableRefs:
  - TO001
- id: leadership-and-governance
  title: Leadership, governance, and dependency
  body: 'Founding continuity remains a core part of Mammoth''s investability story. Public materials still anchor the company around Trevor Martin, Janice Chen, Lucas Harrington, and Jennifer Doudna, while the current about page adds Jeff Huber as board chair and keeps Doudna in a formal scientific-advisory role. That combination gives Mammoth rare scientific credibility, but it also implies meaningful key-person concentration: the external narrative still depends heavily on founder reputations rather than on a broad, newly disclosed operating bench or independently visible commercial leaders.'
  claimRefs:
  - CO003
  - CO004
  - CO005
  tableRefs:
  - TO002
- id: capital-partners-and-scale
  title: Capital base, partner validation, and stale scale markers
  body: 'The strongest hard scale markers in the retained set are still historical. Independent and company-issued 2021 sources align on a $150 million Series D at a unicorn valuation and $195 million of cumulative financing, while current official materials still highlight Regeneron economics that can materially shape program value. Those are real positives, but the same record also shows how stale the public operating picture is: the last retained employee count is simply “over 100,” and the current evidence set still does not establish present-day revenue, customer count, or an externally corroborated valuation.'
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  - CO016
  tableRefs:
  - TO003
- id: milestones-and-open-asks
  title: Milestones and what still needs diligence
  body: 'Mammoth''s arc is legible even from a constrained fast-evidence set: diagnostics-first launch messaging in 2018, a follow-on $23 million raise after launch, a 2020 Series B that broadened the platform into therapeutics, and a 2021 unicorn financing that funded deeper platform and pipeline buildout. By the current run date, the website foregrounds MB-111 and ultracompact delivery as the company''s lead proof point, but independent caution from Fierce and the absence of updated valuation or commercial metrics mean the file still points to a technically compelling but disclosure-light company that needs direct diligence on program readiness and financing status.'
  claimRefs:
  - CO008
  - CO009
  - CO010
  - CO011
  - CO012
  - CO014
  - CO016
  figureRefs:
  - FO001
