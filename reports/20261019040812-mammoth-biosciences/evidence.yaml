evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-coverage
    missingEvidence: A current executive team roster, full board list, and committee/observer structure.
    whyItMatters: Founder concentration and governance depth affect execution resilience and control risk.
    diligencePath: >-
      Request the latest board deck or data room governance appendix with current executives, directors, and board
      observers.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-and-cap-table-coverage
    missingEvidence: A current cap table, post-2024 ownership summary, and details on partner opt-in or veto rights.
    whyItMatters: >-
      Control rights, follow-on capacity, and partnership economics directly affect downside protection and program
      optionality.
    diligencePath: Request the latest cap table, financing docs, and summary of material collaboration rights.
    relatedQuestionRefs:
      - QO004
      - QO007
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-scale-disclosure
    missingEvidence: Current revenue, customer count, diagnostics contribution, and any disclosed runway or burn metrics.
    whyItMatters: Without current commercial or cash-consumption data, it is hard to judge operating leverage or financing urgency.
    diligencePath: Request current board KPIs covering recognized revenue, active customers/partners, burn, and runway.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: clinical-readiness
    missingEvidence: Program-level preclinical package, IND timing, and safety/off-target evidence for MB-111 and other lead programs.
    whyItMatters: >-
      The company is now therapeutics-led in public positioning, so clinical readiness is the main determinant of value
      inflection.
    diligencePath: Request the latest development plan, IND-enabling package, and translational safety data for MB-111.
    relatedQuestionRefs:
      - QO003
      - QO008
  - type: missing-source
    severity: material
    topic: bottom-up-market-size
    missingEvidence: >-
      Disease-level eligible populations, target and program counts, treatment price assumptions, development
      probabilities, partner economics, launch timing, and a current independent market benchmark.
    whyItMatters: >-
      Without these inputs, TAM, SAM, SOM, CAGR, and market-share outputs would be unsupported and could materially
      overstate valuation potential.
    diligencePath: >-
      Obtain management's indication-by-indication market model and reconcile it with epidemiology, payer research,
      comparable launches, and a reputable current market study.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-and-payer-validation
    missingEvidence: >-
      Current customer and partner roster, program-by-program budgets, target counts, license revenue, treatment pricing
      work, and reimbursement evidence.
    whyItMatters: Public evidence shows who may buy but not the size, durability, or conversion of present demand.
    diligencePath: >-
      Request contracts, pipeline governance materials, revenue by relationship, payer interviews, and current partner
      program status.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM003
  - type: stale
    severity: material
    topic: diagnostics-adjacency
    missingEvidence: >-
      Current evidence showing which diagnostics programs, licenses, customers, regulatory pathways, or revenues remain
      active after the therapeutic emphasis.
    whyItMatters: >-
      Historical diagnostics breadth cannot be counted in present addressable revenue without proof that the programs
      still operate or generate economics.
    diligencePath: >-
      Request a current diagnostics intellectual-property and licensing schedule, named counterparties, regulatory
      status, and revenue contribution.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs:
      - TM001
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Current public price sheets, minimum contract sizes, or realized pricing examples for diagnostics or platform
      licensing.
    whyItMatters: >-
      Without observable pricing, it is hard to compare switching costs or estimate whether Mammoth wins on economics
      versus peers or substitutes.
    diligencePath: >-
      Request current commercial materials or anonymized customer proposals covering diagnostics and platform
      partnerships.
    relatedQuestionRefs:
      - QP003
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: direct-competitor-benchmark
    missingEvidence: A neutral, current side-by-side benchmark against named diagnostics peers and therapeutic CRISPR platforms.
    whyItMatters: >-
      The assigned pool supports a reasoned landscape, but it does not provide a fully independent market map or
      comparable operating metrics across rivals.
    diligencePath: >-
      Add current independent competitor coverage or analyst comparisons that benchmark feature scope, proof, and
      commercial progress.
    relatedQuestionRefs:
      - QP001
      - QP006
      - QP007
    relatedTableRefs:
      - TP001
      - TP002
  - type: stale
    severity: material
    topic: 2026-rank-freshness
    missingEvidence: >-
      Fresh independent 2026 evidence confirming whether Mammoth's relative rank versus incumbents has improved since
      the 2020-2021 articles in the assigned pool.
    whyItMatters: >-
      The moat and displacement judgment may have shifted materially if Mammoth has added clinical proof or if
      incumbents and software entrants have moved faster.
    diligencePath: >-
      Refresh the chapter with current independent competitive coverage and updated therapeutic milestones before making
      a stronger rank-order claim.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: blocking
    topic: cash-runway
    missingEvidence: >-
      Latest cash balance, quarterly burn, runway, and any financing covenants after the April 2024 strategic
      investment.
    whyItMatters: >-
      Without current liquidity data, investors cannot judge financing dependency, downside timing, or whether
      partnership economics meaningfully offset burn.
    diligencePath: >-
      Request the latest board or investor cash bridge, including unrestricted cash, quarterly burn, and minimum-cash
      covenants.
    relatedQuestionRefs:
      - QI004
      - QI006
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Recognized revenue by partner or product, milestone versus recurring mix, and any current revenue run rate or ARR
      disclosure.
    whyItMatters: >-
      Collaboration headline values are not the same as realized revenue quality, and the distinction determines whether
      growth is durable or event driven.
    diligencePath: >-
      Obtain monthly or quarterly revenue by stream together with the revenue-recognition policy for upfront, milestone,
      and royalty economics.
    relatedQuestionRefs:
      - QI001
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin, CMC or service-delivery cost structure, CAC or BD cycle metrics, and customer or partner
      concentration.
    whyItMatters: >-
      Margin path and go-to-market efficiency are necessary to test whether platform science can become a compounding
      financial model.
    diligencePath: >-
      Request cohort-level unit economics, funnel conversion, top-counterparty concentration, and delivery-cost
      assumptions by program type.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: collaboration-accounting
    missingEvidence: >-
      Current eligible target count and timing assumptions for milestone and royalty opportunities, plus accounting
      treatment for upfront cash.
    whyItMatters: >-
      Large headline collaboration values can overstate near-term revenue if economics are heavily back-ended or
      deferred.
    diligencePath: >-
      Request the active collaboration schedule with target counts, milestone staging, probability assumptions, and
      recognition treatment for upfront consideration.
    relatedQuestionRefs:
      - QI002
      - QI005
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: commercial-maturity
    missingEvidence: >-
      Current product catalog by assay or therapeutic program, with named production deployments and stage-by-stage
      regulatory status.
    whyItMatters: >-
      Platform breadth is easier to verify than present-day monetizable product maturity, which limits underwriting of
      near-term execution.
    diligencePath: >-
      Request a current pipeline and product sheet that lists each diagnostic and therapeutic program, stage, partner,
      and regulatory milestone.
    relatedQuestionRefs:
      - QE005
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: >-
      External documentation for manufacturing quality systems, privacy or security controls, and a credible
      practitioner-community proxy for technical adoption.
    whyItMatters: >-
      Product diligence needs trust and execution controls, especially when diagnostics and in vivo therapeutics depend
      on safety, compliance, and partner integration.
    diligencePath: >-
      Ask management for quality-system and compliance materials, then corroborate with certification records,
      regulatory filings, or practitioner references.
    relatedQuestionRefs:
      - QE007
  - type: stale
    severity: material
    topic: partner-deployment
    missingEvidence: >-
      Fresh evidence on which of the historical partner and funder programs remain active and productized as of the 2026
      run date.
