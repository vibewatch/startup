      - number: '4.3'
        title: 资本需求与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本充足性看起来仍更多依赖融资渠道，而不是已披露的自我造血能力。Fierce Biotech 和 TechCrunch 都报道 Mammoth 在 2021 年新增 1.95 亿美元融资；UpMarket 列出
              2024 年 4 月的一笔 9500 万美元战略投资，但保留来源都没有量化当前现金或融资后的烧钱速度。Alchemist
              将诊断与疗法视为低相关业务模式，这在战略上有帮助，因为它暗示管理层希望拥有多个价值创造时钟，而非单一二元临床催化剂；但多元化并不能消除疗法成熟期间反复依赖私募资本的需要。UpMarket 还警告 IPO
              前股份缺乏流动性、具有投机性并受转让限制，这进一步说明外部投资者面对的是一项期限很长、缺少按市值计价证据且没有公开现金续航披露的私有资产。
