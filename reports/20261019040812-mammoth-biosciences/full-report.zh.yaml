  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合覆盖既有者、替代方案与新型工作流进入者
        blocks:
          - type: paragraph
            body: >
              指定证据指向的是广泛竞争集合，而非一个清晰的同业组。TechCrunch 称 Mammoth 所处领域已有上市 CRISPR 公司，并以 CRISPR Therapeutics 与 Vertex、Intellia
              与 Regeneron 的疗法项目已有结果为例；Mammoth 则把诊断定位为更早形成差异的领域。当前官方材料仍把公司呈现为同时覆盖体内疗法、蛋白发现和 CRISPR
              诊断的平台，因此买方不仅会拿它与基因编辑疗法供应商比较，也会比较疾病检测替代方案和内部自建路径。BioAI 目录还列出 Arbor Biotechnologies 的临床阶段核酸酶发现，以及 Cassidy
              Bio、CRISPR-GPT 等软件驱动进入者；它们即使不复制 Mammoth 的完整湿实验室平台，也能切入更早的设计和工作流环节。
