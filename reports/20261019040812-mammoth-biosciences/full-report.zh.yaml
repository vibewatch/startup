  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与已披露经济
        blocks:
          - type: paragraph
            body: >-
              Mammoth 的公开证据支持合作驱动的收入逻辑，而不是以已披露产品销售为核心的经营模型。官网将公司定位为拥有自有治疗管线并与药企合作的平台业务；指定材料中唯一量化清晰的经营经济是伙伴条款：Regeneron
              被描述为多适应症合作，包含 1 亿美元预付款和股权投资、每个靶点最高 3.7 亿美元的开发/监管/商业里程碑付款，以及未来净销售额个位数至十几%的版税。较早的 NFX 和 Global Biodefense
              报道也显示，平台扩张主要靠新一轮融资和 Horizon Discovery
              等合作，而非公开定价的经常性产品。已验证的桥梁因此是伙伴选择带来预付款，再到里程碑，最后到版税；但时间安排、收入确认以及理论价值有多少能变成确认收入，仍存在重大缺口。
