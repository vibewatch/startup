      - number: '3.3'
        title: 护城河逻辑成立，但既有者和软件进入者仍能压缩它
        blocks:
          - type: paragraph
            body: >
              长期乐观情景在于：Mammoth 拥有比传统 Cas9 项目更广的 CRISPR 工具箱，并能把广度用于疗法、诊断和合作发现。官方页面突出超紧凑系统、多种编辑模态和合作伙伴驱动的组合；NFX 则认为
              Horizon 接入平台会逐步形成网络效应。但同一证据也说明护城河尚未坐实。TechCrunch 提到的基准既有者已经有公开疗法里程碑，而 BioAI 2026 年画像仍将 Mammoth
              核心治疗项目标为临床前或早期阶段，且没有公开标价。实际情况是，Mammoth 可能拥有差异化平台叙事，同时仍面临临床验证领先者、简化早期工作流的设计软件进入者，以及选择围绕传统系统内部自建而不经由 Mammoth
              开展项目的客户的替代风险。
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP012
              - CP015
