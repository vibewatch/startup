      label: 商业验证 / 买方准备度
      min: 1
      max: 5
      low: Research / preclinical
      high: Public proof / deployment
      description: Ordinal score synthesized from cited evidence; not a market-share or revenue measure.
      scale: ordinal
    yAxis:
      label: 覆盖整个工作流的平台广度
      min: 1
      max: 5
      low: Single workflow layer
      high: Discovery + therapeutics + diagnostics
      description: Higher scores indicate broader scope across the job to be done, not higher quality.
      scale: ordinal
    data:
      points:
        - label: Mammoth
          x: 3
          'y': 5
          note: 指定样本池中覆盖范围最广，但公开的治疗验证仍落后于成熟治疗领域的既有公司。
          claimRefs:
            - CP001
            - CP002
            - CP003
            - CP012
        - label: CRISPR Therapeutics / Vertex 基准
          x: 5
          'y': 2.5
          note: TechCrunch 引用了已公布的治疗结果；指定样本池没有显示其诊断覆盖面。
          claimRefs:
            - CP004
        - label: Intellia / Regeneron 基准
          x: 4.5
          'y': 2.5
          note: TechCrunch 引用了体内治疗进展和直接体内验证。
          claimRefs:
            - CP004
        - label: Arbor Biotechnologies
          x: 3.5
          'y': 3
          note: 处于临床阶段、以发现为驱动的同业公司，覆盖范围窄于 Mammoth。
          claimRefs:
            - CP009
        - label: 传统 Cas9 内部自建
          x: 2.5
          'y': 3.5
          note: TechCrunch 将与 Mammoth 合作描述为从零开始自建 CRISPR 方案的替代路径。
          claimRefs:
            - CP005
            - CP015
        - label: 设计软件进入者
          x: 2
          'y': 1.5
          note: Cassidy Bio 和 CRISPR-GPT 攻击的是设计与规划步骤，而不是 Mammoth 的完整湿实验室平台。
          claimRefs:
            - CP010
            - CP011
    approximationNotes: 所有坐标均根据指定样本池中的引用证据作序数综合，表示相对覆盖范围和可见验证，而非市场份额、科学质量或预期结果。
    claimRefs:
      - CP004
      - CP009
      - CP010
      - CP011
      - CP012
      - CP015
  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开证据支持一条由合作伙伴驱动、从平台接入走向预付款、里程碑付款和版税收入的路径，但不支持披露的毛利。
    data:
      nodes:
        - id: platform
          label: 平台与可合作 IP
          value: Cas14 / CasΦ toolkit and platform access
          note: 官方及合作伙伴来源将 Mammoth 描述为覆盖诊断和治疗的平台。
        - id: partner
          label: 合作伙伴选择项目
          value: Program-level collaboration
          note: 公开案例包括 Regeneron 和 Horizon Discovery。
        - id: upfront
          label: 预付款 / 股权现金
          value: $100M upfront + equity
          note: Mammoth 官方网站披露了与 Regeneron 相关的这一项。
        - id: milestones
          label: 开发里程碑
          value: Up to "$370M per target"
          note: 经济条款已披露，但时间安排和兑现情况尚未披露。
        - id: royalties
          label: 上市后版税
          value: Single digits to mid teens
          unit: '% of future net sales'
          note: 取决于获批产品和合作伙伴的商业化。
        - id: gross-profit
          label: 毛利与自我融资能力
          value: Undisclosed
          note: 公开来源没有按业务流量化确认收入、COGS 或利润率。
      edges:
        - from: platform
          to: partner
          label: 平台匹配与交易撮合
        - from: partner
          to: upfront
          label: 签约经济条款
        - from: upfront
          to: milestones
          label: 项目推进
        - from: milestones
          to: royalties
          label: 获批与上市
        - from: royalties
          to: gross-profit
          label: 利润率取决于未披露的成本结构
    approximationNotes: 该序列描述的是根据已披露合作条款推导出的变现逻辑，并非对时间、概率或实际利润的预测。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI009
      - CI013
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Mammoth 的公开架构从发现数据延伸到工程化 Cas 系统，再进入治疗、诊断和合作伙伴驱动的工具。
    data:
      layers:
        - label: 发现输入
          detail: 宏基因组数据和专有搜索系统为发现漏斗提供输入。
          modules:
            - name: 宏基因组序列数据库
              detail: 规模庞大且持续增长的数据库，加上独家样本数据
            - name: 专有 AI 搜索
              detail: 在计算机中搜索新型 CRISPR 系统及相关技术
        - label: 验证与工程化
          detail: 候选系统在部署到平台前会经过筛选和优化。
          modules:
            - name: 湿实验室筛选
              detail: 高通量测试蛋白质特征和功能
            - name: 蛋白质工程
              detail: 筛选后定向优化候选对象
        - label: CRISPR 工具箱
          detail: Mammoth 将输出组织为一套可复用的 Cas 家族和模态。
          modules:
            - name: 新型 Cas 家族
              detail: Cas14、Casphi 家族系统，以及类似 NanoCas 的超紧凑编辑器
            - name: 模态支架
              detail: 核酸酶、碱基、表观遗传和 RT 编辑工作流
        - label: 递送适配
          detail: 超紧凑编辑器定位于受递送限制的体内应用场景。
          modules:
            - name: 单 AAV 兼容性
              detail: 官方 NanoCas 定位强调可为引导序列和额外载荷留出空间
            - name: 肝外靶向
              detail: 临床前验证重点关注肌肉和心脏，而不只是肝脏递送
        - label: 诊断层
          detail: 独立的诊断业务使用 CRISPR 化学实现近患者检测。
          modules:
            - name: DETECTR 诊断
              detail: 即时检测或接近实验室的分子检测工作流
            - name: EUA 时代验证
              detail: COVID 期间的 CRISPR 诊断验证和紧急使用证据
        - label: 产品应用面
          detail: 工具箱同时服务 Mammoth 自有项目和合作伙伴主导的产品。
          modules:
            - name: 体内疗法
              detail: 受递送限制的基因编辑和全资管线项目
            - name: 诊断与合作伙伴工具
              detail: DETECTR 诊断，以及合作驱动的研究和生物生产工具
    approximationNotes: 公开证据支持平台层面的这一架构，但没有完整的当前各产品发布图谱。
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Mammoth 的公开客户旅程从平台评估走向由合作伙伴出资的诊断和治疗合作；真实执行证据存在，但留存披露有限。
    data:
      items:
        - label: 平台评估
          actor: 生物制药和诊断领域交易对手
          stage: 发现
          touchpoints:
            - 平台推介围绕超紧凑 CRISPR 系统和合作伙伴接入展开
            - 早期需求来自寻求互补能力或差异化 IP 的交易对手
          tone: neutral
        - label: 诊断赞助
          actor: NIH RADx、DARPA、GSK
          stage: 验证
          touchpoints:
            - 外部赞助方出资或加速即时检测和高通量诊断工作
            - 公开验证最强的是传染病检测，而非广泛的横向采用
          tone: opportunity
        - label: 制造规模化
          actor: Merck MilliporeSigma 和运营团队
          stage: 执行
          touchpoints:
            - 20 盒试制批次和验证工作，将一项检测从开发推进到可上市运营
            - 供应链和 QC 协同，是实际部署工作最清晰的证据
          tone: opportunity
        - label: 监管 / 市场验证
          actor: Agilent 关联的 DETECTR BOOST 项目
          stage: 验证点
          touchpoints:
            - 高通量 EUA 里程碑证明了真实世界验证
            - 公开来源仍未披露稳态订单流或活跃装机基数数据
          tone: opportunity
        - label: 平台扩张
          actor: Regeneron、Vertex、Bayer、Horizon Discovery
          stage: 扩张
          touchpoints:
            - 扩张由合作伙伴推动，覆盖治疗和研究工具
            - 经济规模可能很大，但进展和按合作伙伴划分的集中度仍不透明
          tone: neutral
        - label: 持续性缺口
          actor: 投资者和尽调团队
          stage: 投资判断
          touchpoints:
            - 审阅的来源集中没有公开 NRR、GRR、客户流失率或客户数分母
            - 因此集中度和续约风险仍是待尽调问题
          tone: warning
    approximationNotes: null
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU006
      - CU007
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余风险敞口是治疗执行、合作伙伴集中度和估值不透明。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 剩余敞口
      rows:
        - label: 治疗时间线与安全性
          note: 公开材料仍强调递送障碍，且没有产品时间线。
          values:
            - label: 高
            - label: 高
            - label: 中
            - label: 高
        - label: 合作伙伴集中度与依赖
          note: 一项旗舰合作的经济条款最为清晰。
          values:
            - label: 中高
            - label: 高
            - label: 中
            - label: 高
        - label: 平台铺得过广与资源聚焦
          note: Mammoth 覆盖诊断、治疗、工具和多个终端市场。
          values:
            - label: 高
            - label: 中高
            - label: 中
            - label: 中高
        - label: 估值与流动性不透明
          note: 尽管市场在营销二级市场接入，公开的非上市市场证据仍很薄弱。
          values:
            - label: 高
            - label: 中高
            - label: 低
            - label: 高
        - label: IP 与监管边界
          note: 非 Cas9 定位有所帮助，但公开的自由实施权材料包并未披露。
          values:
            - label: 中
            - label: 高
            - label: 中
            - label: 中高
        - label: 质量与事故的公开可见度
          note: 本章没有保留经过验证的事件、召回或质量体系证据。
          values:
            - label: 中
            - label: 中
            - label: 低
            - label: 高
    approximationNotes: 序数标签综合引用证据，并非管理层或投资者原话中的风险评级。
    claimRefs:
      - CR003
      - CR004
      - CR006
      - CR009
      - CR010
      - CR014
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议仍是持续跟踪：历史融资实力和平台覆盖面，被陈旧的估值证据、早期执行风险以及当前条款缺失所抵消。
    data:
      nodes:
        - id: n1
          label: 历史融资实力
          note: 2020—2021 年融资轮最终达到超过 $1B 的估值。
        - id: n2
          label: 平台覆盖面
          note: 诊断 + 治疗可以创造多条里程碑路径。
        - id: n3
          label: 商业与临床验证缺口
          note: 独立报道仍将该技术描述为早期阶段。
        - id: n4
          label: 当前价格不透明
          note: 保留的当前来源没有披露新的股权条款或估值标记。
        - id: n5
          label: 情景偏向
          note: 在经营指标和里程碑更新前，基准情景占主导。
        - id: n6
          label: 建议：持续跟踪
          note: 保持关注，但在评估是否入场前，要求当前指标和条款。
      edges:
        - from: n1
          to: n2
          label: 支持上行
        - from: n2
          to: n3
          label: 仍需验证
        - from: n3
          to: n4
          label: 抬高投资判断风险
        - from: n4
          to: n5
          label: 保持区间宽泛
        - from: n5
          to: n6
          label: 促成价格纪律
    approximationNotes: 该序列图总结来源支持的逻辑，而非数学估值模型。
    claimRefs:
      - CV002
      - CV006
      - CV009
      - CV015
      - CV016
