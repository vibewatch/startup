      - number: '8.2'
        title: 上行支撑与信心阻碍
        blocks:
          - type: paragraph
            body: >-
              上行逻辑并不难描述。Mammoth 围绕差异化 CRISPR
              工具箱故事完成了大额融资，外部观察者仍认为诊断加疗法模式比单一资产生物科技公司更有韧性，因为它能在二元临床读数之外提供验证点。反方观点是，公开证据仍把大部分上行空间描述为潜力，而非已实现证明。FierceBiotech
              和 TechCrunch 的独立报道将技术描述为早期、对安全性敏感且尚未形成实际治疗产品；Alchemist
              也明确指出诊断往往不如疗法受到风险投资者追捧。这些事实并未击破论点，但说明论点仍取决于证据：在公开证据足以支持激进估值立场前，Mammoth 需要更及时的商业牵引和临床去风险证明。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
