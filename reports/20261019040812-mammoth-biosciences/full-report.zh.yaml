          - type: paragraph
            body: >-
              保留的公开记录仍显示 Mammoth 拥有真实的平台抱负、顶级支持者和历史上溢价的融资结果，但不足以仅凭叙事买单。最有力的直接估值证据仍是 2021 年 9 月融资，当时 Mammoth 估值超过 10
              亿美元；而 2026 年市场数据画像仍把公开轮次历史压缩成一笔 1.5
              亿美元融资。这一差异很重要，因为本章当前公开来源没有披露新股价、新融资估值或优先权结构条款，投资者无法据此把公司质量与入场价格纪律联系起来。因此建议是
              **跟踪**：保持关注，但没有当前指标和条款，不要依据过时的独角兽估值评估一级或二级入场。
