      - number: '4.2'
        title: 牵引力、单位经济与披露缺口
        blocks:
          - type: paragraph
            body: >-
              Mammoth 的公开牵引数据太薄，无法把平台潜力转成投资评估模型。UpMarket 将其列为私有公司，称没有信誉媒体报道过其估值，并列出收入栏目却没有收入数字；保留来源也没有公布
              ARR、毛利率、现金余额、CAC、回本期或客户集中度。TechCrunch 2021 年还称 Mammoth 当时尚无治疗产品时间表，尽管目标是体内应用；这很重要，因为 Wikipedia 称公司在 2023
              年转向疗法。结果是，外界能核实的变现机制与能核实的实际财务表现之间存在巨大鸿沟。投资者能看到平台选择权和知名交易对手，却无法从公开证据判断业务是里程碑驱动、经常性、集中型，还是已经把科学进展转成可持续毛利。
