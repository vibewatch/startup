        - 2021 年融资支持双轨 CRISPR 平台，后续评论认为，这种组合可以降低对单一临床结果的依赖。
        - 如果 Mammoth 展现出当前商业牵引力，并取得项目特定的治疗里程碑，则上调判断。
      - - 论点
        - 历史投资者需求和合作伙伴兴趣表明，公司能够吸引战略关注。
        - 发布活动带来了投资者和合作伙伴的主动询问，2020—2021 年融资轮吸引了大型投资者，并获得董事会层面的支持。
        - 如果这些兴趣转化为当前已披露的收入、里程碑，或条款透明的新一轮上调融资，则上调判断。
      - - 反论点
        - 独立报道仍将这项技术视为早期且对安全性敏感。
        - FierceBiotech 称该技术处于早期阶段，TechCrunch 也指出，2021 年许多治疗产品尚不存在。
        - 只有在新的临床、监管或产品读出证据公开后，才下调这一担忧。
      - - 反论点
        - 公开估值支撑已经过时，当前市场数据快照彼此矛盾。
        - FundedIQ 仍列有一笔 $150M 融资，但 2021 年来源称累计融资为 $195M，并达到独角兽估值。
