  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Mammoth 目前将自己定位为追求长期治愈性体内疗法的超紧凑 CRISPR
              治疗公司，因此可投资核心应限定在编辑载荷大小、递送、特异性或模态广度能够改变可行性的项目。历史公司材料和独立报道显示其平台还覆盖诊断、基因编辑和疗法，但这种广度只是选择权，不代表每种 CRISPR
              应用都对应可触达支出。纳入范围应是 Mammoth
              自有治疗开发和合作伙伴资助的紧凑核酸酶项目；诊断授权、生物生产工具及其他检测流程属于相邻领域。在出现当前变现证据前，应排除泛生命科学研究、体外编辑、无关分子检测、农业和生物防御。现状替代方案包括更大型
              CRISPR 系统、分体载体递送、中心实验室分子检测、慢性药物治疗，以及因递送或开发经济性不佳而放弃的项目。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM006
              - CM015
      - number: '2.2'
        title: 受证据约束的市场测算
        blocks:
          - type: paragraph
            body: >-
              指定的八个来源都没有提供出版级的当前治疗 TAM、疾病层面的 SAM、按概率调整的 SOM 或可比 CAGR。因此，本章只把明确交易条款和历史融资当作背景，不把它们当作市场规模。Mammoth 披露其与
              Regeneron 的关系包含 1 亿美元预付款及股权对价，每个靶点还可能获得最高 3.7 亿美元里程碑付款；这些条款说明战略方愿意为平台访问付费，但既不是已确认收入，也不是总需求。TechCrunch 2021
              年报道的 1.5 亿美元 Series D、1.95 亿美元累计融资和超过 10
              亿美元估值，同样证明的是投资者认可，而不是客户支出。可信的自下而上模型还需要合资格患者群体、靶点数、项目成功概率、治疗定价、合作经济和时间表，而指定来源未能持续提供这些数据。
            claimRefs:
              - CM003
              - CM007
              - CM014
              - CM016
