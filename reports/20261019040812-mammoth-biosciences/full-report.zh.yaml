      - number: '2.3'
        title: 买方、用户、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              可观察的近期买方不是最终患者或保险公司：对自有项目而言是 Mammoth
              自己，对合作项目而言是制药或生物科技伙伴。研究、递送和转化团队使用技术；联盟、业务开发和研发负责人掌握当前预算。只有疗法证明临床获益并获得监管及报销支持后，最终支付方才会进入。历史上，诊断业务还引入公共卫生、实验室、医疗系统和检测开发方，生物生产则形成独立的工业流程。但指定材料没有披露活跃客户数、当前授权收入、逐合作伙伴靶点数、治疗定价或支付方覆盖。采用应按顺序建模：技术匹配、递送验证、临床前证明、监管许可、临床获益、制造准备，最后才是报销或平台重复需求。
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM009
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM009
              - CM015
      - number: '2.4'
        title: 采用驱动、约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              核心采用驱动是一项机制性主张：更小的系统可能适配大型 Cas9 系统无法适配的递送配置，更广的编辑工具箱也能让合作方为靶点匹配合适模态。两份可信度较低的 2026 年摘要提到约 4.7 千碱基的 AAV
              载荷上限，并把一体化递送视为实际优势；这只能提供方向，支撑高置信度预测前仍需技术尽调。诊断历史提供第二个驱动——接近 PCR
              的灵敏度、更简单的化学流程和靠近患者部署——但不证明当前需求。约束包括临床和监管结果的二元性、制造复杂度、伦理与信任问题、漫长商业化周期、不确定的报销，以及在众多平台应用中做取舍的纪律。估值上，合作条款可以验证战略兴趣，但没有依据的市场份额或宽泛
              CRISPR 增长率不应直接转成收入预测。
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 战略价值不是市场规模
            body: Regeneron 条款和历史风险融资验证了市场对平台的兴趣，但不能替代自下而上市场模型中的患者数、靶点数、价格、概率和时间输入。
            calloutType: risk
            claimRefs:
