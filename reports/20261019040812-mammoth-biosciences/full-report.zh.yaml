        - 平台覆盖面转化为可见的商业进展和治疗验证，同时投资者仍愿意为品类领导地位买单。
        - 上行空间来自新的上调融资轮或退出倍数：市场奖励的是已经去风险的多项目平台，而非单一资产。
        - 临床进度落后、诊断报销阻力或合作伙伴执行缺口，仍可能击穿这一逻辑。
        - 只有当前指标和里程碑显著好于保留的公开基线时，这一情景才成立。
      - - 基准情景
        - Mammoth 仍具战略重要性，但披露有限，验证证据逐步累积。
        - 价值能够保住，但在新证据收窄区间前，入场纪律应参考相对过时独角兽估值的折价。
        - 叙事强度掩盖了较弱的经营杠杆，或产品转化延迟。
        - 与保留的证据集最为一致。
      - - 悲观情景
        - 由于进展不足以支撑旧有平台溢价，下一轮融资或退出市场会将公司重新定价到低于此前预期的水平。
        - 回报测算会受到平价或下调融资轮、优先权负担或低流动性退出的挤压。
        - 过时估值、指标缺失和早期科学进展，几乎没有下行保护。
        - 如果新融资条款采取防御性设计，或里程碑延期，这一情景将变得更可能。
    notes: 情景表是定性的，因为保留的公开来源没有提供当前收入、利润率、现金消耗、现金续航或精确股权条款，无法建立有依据的数值模型。
