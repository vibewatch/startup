              - CV006
              - CV007
              - CV009
              - CV011
              - CV016
      - number: '8.3'
        title: 情景、尽调问题与否决标准
        blocks:
          - type: paragraph
            body: >-
              由于保留的公开资料没有披露当前收入、烧钱、现金续航、股权结构表中的优先权条款或 2021 年后的价格重置，情景分析只能保持定性到半定量。即便如此，来源仍足以界定哪些信息会改变判断。乐观情景需要证明 Mammoth
              能把平台广度转化为持续兑现的商业或临床里程碑；基准情景假设公司仍具战略吸引力，但估值大多被过时估值标记和有限经营披露锁住；悲观情景假设 2021
              年独角兽叙事比下一轮融资或退出市场能够支撑的价值更丰厚。因此最有价值的尽调问题是当前经营指标、精确融资条款和项目级证明。若缺少这些信息，否决标准很直接：平轮或下轮且优先权负担沉重、商业化证据弱，或疗法证明延后，都应把公司从跟踪改为放弃。
            claimRefs:
