      - number: '3.2'
        title: 商业获取靠合作，而非透明标价
        blocks:
          - type: paragraph
            body: >
              Mammoth 官方页面强调集成与合作，而不是面向自主购买的产品包装。诊断页面称 DETECTR 可集成到 Mammoth 或合作伙伴构建的产品；“关于我们”页面披露的是与 Regeneron
              的合作经济，而非客户标价。第三方页面也呈现同一模式：BioAI 将 Mammoth 定价标为“联系咨询”和“基于合作”，UpMarket 则概括其为私募市场发行主体，与 Vertex、Bayer 和
              Regeneron 建立合作关系。这种接入模式能把 Mammoth 嵌入伙伴渠道和开发预算，对抗小型进入者；但也让同口径价格比较困难，切换成本的判断只能依赖关系深度，而非可观察的合同结构。
            claimRefs:
