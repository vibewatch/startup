        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              财务结论是：平台经济潜力可观，但不足以支撑投资判断。公开来源支持这样的判断：Mammoth
              能通过合作疗法经济和平台合作变现，也多次吸引机构资本支持这一战略；但它们无法说明当前收入质量、利润率变化、销售效率或独立现金续航。在管理层披露按伙伴或产品确认的收入、当前现金与烧钱，以及从合作经济走向可持续毛利的清晰桥梁之前，本章对变现潜力保持建设性，但对可投资性保持谨慎。
