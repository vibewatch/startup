  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-disclosure
      missingEvidence: Public NRR, GRR, churn, renewal, or contract-length disclosure by customer segment.
      whyItMatters: Without durability metrics, it is impossible to distinguish one-time partnership announcements from recurring adoption.
      diligencePath: Request partner-level renewal, contract-term, and active-account metrics from management or data room materials.
      relatedQuestionRefs: [QU004]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Current revenue or pipeline concentration by top partner, by segment, and by diagnostics versus therapeutics.
      whyItMatters: A few large collaborations could dominate economics, changing underwriting on downside protection and expansion.
      diligencePath: Request current partner roster, revenue mix, and any top-counterparty exposure thresholds from management.
      relatedQuestionRefs: [QU005, QU006]
      relatedTableRefs: [TU003]
    - type: stale
      severity: material
      topic: diagnostics-commercialization
