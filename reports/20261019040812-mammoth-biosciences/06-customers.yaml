company:
  name: Mammoth Biosciences
chapter:
  number: 6
  title: Customers
  summary: >-
    Mammoth's disclosed customer proof is partnership-led rather than end-market-led: public evidence names
    biopharma collaborators, public-sector diagnostics sponsors, and manufacturing/tool partners, but not a
    current active customer count or retention cohort. The strongest real-world adoption proof is the COVID-era
    DETECTR BOOST diagnostic program, which advanced through pilot, validation, and first commercial-lot
    manufacturing, while durability and concentration remain under-disclosed.
sections:
  - id: customer-surface
    title: Customer surface is partner-led across biopharma, diagnostics, and manufacturing
    body: >-
      Mammoth's public customer surface is best described as a set of collaboration-led demand channels rather
      than a disclosed installed base. Independent coverage and company materials consistently point to three
      monetization surfaces: biopharma platform partnerships, diagnostics development sponsors, and manufacturing
      or tooling partners that help convert Mammoth's CRISPR assets into deployable products. Regeneron is the
      clearest currently disclosed named biopharma partner on Mammoth's own site. Independent reporting names
      Vertex and Bayer and links the diagnostics effort to GSK, NIH RADx, and DARPA, while a company-issued
      release names Horizon Discovery.
      That mix supports a real buyer/user map, but it does not establish how many accounts are active today, how
      revenue splits across segments, or whether any one partner dominates commercialization.
    claimRefs: [CU001, CU002, CU003, CU006, CU007, CU008]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Best adoption proof comes from diagnostics scale-up and named platform collaborations
    body: >-
      The best public proof that Mammoth moved beyond logo collection is still the diagnostics program around
      DETECTR BOOST. Merck Millipore's case study says the workflow was designed for 1,500 tests per eight-hour
      shift, that a 20-kit pilot lot was produced, that three batches were manufactured at production scale for
      validation, and that the first commercial lot shipped less than six months after project initiation. In
      parallel, independent reporting ties Mammoth's diagnostics platform to Agilent, GSK, NIH RADx, and DARPA,
      while Mammoth's own current materials highlight Regeneron and earlier releases cite Horizon Discovery. The
      net result is credible evidence of program execution and partner willingness to pay for access, but not yet
      a broad reader-visible roster of recurring end-customers or disclosed deployment volumes after the COVID
      testing window.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU013]
    tableRefs: [TU002, TU003]
  - id: durability-and-risk
    title: Expansion logic is visible, but retention, concentration, and current demand are opaque
    body: >-
      Mammoth's expansion story is easier to see than its durability story. Multiple sources describe a platform
      strategy in which diagnostics validates the technology first, then adjacent therapeutics, tools, and
      additional partner programs widen the revenue surface; the disclosed Regeneron economics reinforce that
      larger collaborations can be structured around upfront, milestone, and royalty streams. However, the same
      public record leaves major diligence holes. Fast Company and Global Genes show that platform ambition and
      partner-seeking outran detailed customer disclosure, and Alchemist's discussion underscores that diagnostics was a
      strategically unusual market choice because it is often less attractive to venture investors and slower to
      monetize than therapeutics. None of the reviewed sources provides NRR, GRR, renewal, churn, active customer
      count, partner-by-partner revenue, or top-customer concentration, so concentration and durability remain
      evidence gaps rather than validated strengths.
    claimRefs: [CU009, CU010, CU011, CU012, CU014]
callouts:
  - calloutType: strength
    title: Real execution proof exists, especially in diagnostics scale-up
    body: >-
      The chapter's strongest adoption evidence is not a logo sheet but a documented sequence from pilot lot to
      validation batches to first commercial lot for DETECTR BOOST, plus named biopharma and tool collaborations.
    claimRefs: [CU004, CU005, CU006, CU007, CU013]
  - calloutType: risk
    title: Public customer disclosure is thin on retention and concentration
    body: >-
      Mammoth shows credible partnership breadth, but the public record still does not disclose customer counts,
      renewal behavior, or partner-level revenue mix, which makes concentration and durability hard to underwrite.
    claimRefs: [CU009, CU011, CU012]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Biopharma platform partners
        - Pharma/biotech BD teams and R&D groups; partner budgets likely fund access
        - In vivo gene-editing programs and platform access
        - Named partners include Regeneron, Vertex, and Bayer
        - Large-collaboration economics can include upfronts, milestones, royalties, and opt-in rights
        - No partner-by-partner revenue recognition, live target count, or renewal data disclosed
      - - Research-tool / bioproduction partners
        - Tool providers and cell-line editing customers
        - CRISPR tools for CHO cell line editing and related workflows
        - Horizon Discovery named as a collaboration partner
        - Validates platform utility outside Mammoth's internal pipeline
        - No adoption volume, customer list, or channel economics disclosed
      - - Public-sector diagnostics sponsors
        - NIH RADx, DARPA, and strategic diagnostics collaborators such as GSK
        - Point-of-care and high-throughput infectious-disease testing
        - Multiple named programs and funding-backed diagnostic workstreams
        - Funds validation and can accelerate external proof points
        - Public sources do not show current post-COVID order flow or installed-base size
      - - Manufacturing / scale-up partners
        - Contract manufacturing, QC, packaging, and supply-chain operators
        - Reagent-kit scale-up and launch support for DETECTR BOOST
        - 20-kit pilot lot, three production-scale validation batches, and first commercial lot
        - Shows Mammoth can move one program from R&D into launch-ready operations
        - Evidence is program-specific and does not prove recurring end-user retention
    notes: >-
      Rows summarize disclosed demand surfaces and use named public partners rather than implying a complete customer list; null-style gaps are stated explicitly in the final column.
    claimRefs: [CU001, CU003, CU005, CU006, CU007, CU012]
