  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / partner
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Merck MilliporeSigma
        - Manufacturing / operations partner
        - Scale-up, QC, packaging, and shipping validation for DETECTR BOOST assay kits
        - Pilot through production-scale validation and first commercial lot
        - Public evidence of 20-kit pilot, three production-scale validation batches, and commercial-lot manufacture
        - Proves execution for one COVID-era program, not broad recurring customer demand
      - - Regeneron
        - Biopharma therapeutic partner
        - Multi-indication in vivo gene-editing collaboration
        - Commercial collaboration terms disclosed; program deployment undisclosed
        - $100M upfront/equity plus milestone and royalty structure indicates willingness to pay for the platform
        - No target-by-target progress, revenue realization, or renewal disclosure
      - - Horizon Discovery
        - Research-tool / bioproduction partner
        - Bring Mammoth CRISPR tools to CHO cell line editing
        - Commercial collaboration announced
        - Publicly cited as evidence of traction in monetizing Mammoth IP
        - No external adoption, sales, or end-customer list disclosed
      - - GSK / NIH RADx / DARPA
        - Diagnostics development sponsors and collaborators
        - Point-of-care and high-throughput infectious-disease testing
        - Program validation and development support
        - Named counterparties validate external demand for Mammoth's diagnostics platform
        - Public record does not disclose current volumes, deployed accounts, or recurring contracts
    notes: >-
      This is a partial enumeration of named public proof points from the assigned source pool, not an exhaustive customer ledger; rows mix customers, partners, and sponsors because that is how Mammoth discloses demand.
    enumerationScope:
      coverage: partial
      basis: Publicly named counterparties in the assigned 2026 source pool that provide concrete deployment, funding, or commercial-terms evidence for Mammoth's customer surface.
