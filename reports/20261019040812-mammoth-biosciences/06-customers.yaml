figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Mammoth's public customer journey runs from platform evaluation into partner-funded diagnostics and
      therapeutic collaborations, with real execution proof but limited retention disclosure.
    data:
      items:
        - label: Platform evaluation
          actor: Biopharma and diagnostics counterparties
          stage: Discovery
          touchpoints:
            - Platform pitch centers on ultra-compact CRISPR systems and partner access
            - Early demand is driven by counterparties seeking complementary skills or differentiated IP
          tone: neutral
        - label: Diagnostics sponsorship
          actor: NIH RADx, DARPA, GSK
          stage: Validation
          touchpoints:
            - External sponsors fund or accelerate point-of-care and high-throughput diagnostics work
            - Public proof is strongest in infectious-disease testing rather than broad horizontal adoption
          tone: opportunity
        - label: Manufacturing scale-up
          actor: Merck MilliporeSigma and operations teams
          stage: Execution
          touchpoints:
            - 20-kit pilot lot and validation work convert one assay from development into launch-ready operations
            - Supply-chain and QC coordination provide the clearest evidence of real deployment work
          tone: opportunity
        - label: Regulatory / market proof
          actor: Agilent-linked DETECTR BOOST program
          stage: Proof point
          touchpoints:
            - High-throughput EUA milestone demonstrates real-world validation
            - Public sources still omit steady-state order flow or active installed-base data
          tone: opportunity
        - label: Platform expansion
          actor: Regeneron, Vertex, Bayer, Horizon Discovery
          stage: Expansion
          touchpoints:
            - Expansion is partner-led across therapeutics and research tools
            - Economics can be large, but progress and concentration by partner remain opaque
          tone: neutral
        - label: Durability gap
          actor: Investors and diligence teams
          stage: Underwriting
          touchpoints:
            - No public NRR, GRR, churn, or customer-count denominator in the reviewed source set
            - Concentration and renewal risk therefore stay open diligence questions
          tone: warning
    approximationNotes: null
    claimRefs: [CU001, CU003, CU005, CU006, CU007, CU012, CU013]
