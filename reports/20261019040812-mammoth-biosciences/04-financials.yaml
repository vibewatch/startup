  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: cash-runway
      missingEvidence: Latest cash balance, quarterly burn, runway, and any financing covenants after the April 2024 strategic investment.
      whyItMatters: Without current liquidity data, investors cannot judge financing dependency, downside timing, or whether partnership economics meaningfully offset burn.
      diligencePath: Request the latest board or investor cash bridge, including unrestricted cash, quarterly burn, and minimum-cash covenants.
      relatedQuestionRefs: [QI004, QI006]
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: Recognized revenue by partner or product, milestone versus recurring mix, and any current revenue run rate or ARR disclosure.
      whyItMatters: Collaboration headline values are not the same as realized revenue quality, and the distinction determines whether growth is durable or event driven.
      diligencePath: Obtain monthly or quarterly revenue by stream together with the revenue-recognition policy for upfront, milestone, and royalty economics.
      relatedQuestionRefs: [QI001, QI003]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin, CMC or service-delivery cost structure, CAC or BD cycle metrics, and customer or partner concentration.
      whyItMatters: Margin path and go-to-market efficiency are necessary to test whether platform science can become a compounding financial model.
      diligencePath: Request cohort-level unit economics, funnel conversion, top-counterparty concentration, and delivery-cost assumptions by program type.
      relatedQuestionRefs: [QI006, QI008]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: material
      topic: collaboration-accounting
      missingEvidence: Current eligible target count and timing assumptions for milestone and royalty opportunities, plus accounting treatment for upfront cash.
      whyItMatters: Large headline collaboration values can overstate near-term revenue if economics are heavily back-ended or deferred.
      diligencePath: Request the active collaboration schedule with target counts, milestone staging, probability assumptions, and recognition treatment for upfront consideration.
      relatedQuestionRefs: [QI002, QI005]
      relatedTableRefs: [TI001, TI002]
