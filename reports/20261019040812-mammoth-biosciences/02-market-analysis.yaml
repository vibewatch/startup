  evidenceGaps:
    - type: missing-source
      severity: material
      topic: bottom-up-market-size
      missingEvidence: Disease-level eligible populations, target and program counts, treatment price assumptions, development probabilities, partner economics, launch timing, and a current independent market benchmark.
      whyItMatters: Without these inputs, TAM, SAM, SOM, CAGR, and market-share outputs would be unsupported and could materially overstate valuation potential.
      diligencePath: Obtain management's indication-by-indication market model and reconcile it with epidemiology, payer research, comparable launches, and a reputable current market study.
      relatedQuestionRefs: [QM002, QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-and-payer-validation
      missingEvidence: Current customer and partner roster, program-by-program budgets, target counts, license revenue, treatment pricing work, and reimbursement evidence.
      whyItMatters: Public evidence shows who may buy but not the size, durability, or conversion of present demand.
      diligencePath: Request contracts, pipeline governance materials, revenue by relationship, payer interviews, and current partner program status.
      relatedQuestionRefs: [QM003, QM008]
      relatedTableRefs: [TM003]
    - type: stale
      severity: material
      topic: diagnostics-adjacency
      missingEvidence: Current evidence showing which diagnostics programs, licenses, customers, regulatory pathways, or revenues remain active after the therapeutic emphasis.
      whyItMatters: Historical diagnostics breadth cannot be counted in present addressable revenue without proof that the programs still operate or generate economics.
      diligencePath: Request a current diagnostics intellectual-property and licensing schedule, named counterparties, regulatory status, and revenue contribution.
      relatedQuestionRefs: [QM006, QM008]
      relatedTableRefs: [TM001, TM003]
