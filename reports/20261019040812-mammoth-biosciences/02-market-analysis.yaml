      - - Mammoth-owned in vivo therapeutics
        - Discovery, delivery engineering, preclinical work, clinical development, and manufacturing preparation
        - Ex vivo editing, unrelated biologics, and non-CRISPR drug development
        - Mammoth funds development now; eventual payer is unknown until product and indication economics are defined
        - Current core because Mammoth explicitly centers long-term curative in vivo therapies
      - - Partner-funded compact-nuclease programs
        - Platform access, target work, delivery pairing, milestones, and possible co-development
        - Programs that do not use Mammoth systems or need compact delivery
        - Pharmaceutical and biotechnology R&D or alliance budgets
        - Current core and the clearest public willingness-to-pay signal
      - - Molecular diagnostics
        - Assay development, licensing, validation, and near-patient deployment using Mammoth intellectual property
        - Unrelated central-lab tests and generic diagnostics services
        - Assay companies, laboratories, health systems, and public-health programs
        - Historically important adjacency; current commercial scale is not disclosed
      - - Bioproduction and research tools
        - Select gene-editing tools integrated into partner workflows
        - General research tools that do not depend on Mammoth enzymes
        - Industrial biotechnology and research-tool partners
        - Adjacent platform use case, not evidence of a large current revenue pool
      - - Agriculture, biodefense, and other platform optionality
        - None included in the current core without active-program evidence
        - Broad hypothetical applications named in historical platform material
        - Potential institutional or industrial buyers remain unverified
        - Excluded from current sizing to avoid equating technical possibility with demand
    notes: >-
      Boundary is based only on the assigned source pool; excluded categories
      are potential adjacencies without current demand or monetization evidence.
