  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Wholly owned in vivo therapy
        - Mammoth program leadership
        - Discovery, delivery, translational, clinical, and manufacturing teams
        - Mammoth before approval; future reimburser is unverified
        - Target selection to delivery proof, preclinical package, clinical trials, approval, and reimbursement
        - Corporate R&D
        - Reproducible efficacy and safety with a manufacturable delivery system
      - - Biopharma collaboration
        - Pharmaceutical or biotechnology alliance and R&D leadership
        - Partner and Mammoth program scientists
        - Partner funds current work; eventual commercial payer is indication-specific
        - Platform evaluation, target selection, delivery pairing, milestones, and possible opt-in
        - Business development and partnered R&D
        - Compact-system fit solves a target or tissue constraint better than alternatives
      - - Molecular diagnostics license
        - Diagnostics product, laboratory, health-system, or public-health sponsor
        - Assay developers, laboratory operators, clinicians, and near-patient testers
        - Licensee or institutional budget; downstream reimbursement is not disclosed
        - Assay validation, regulatory review, manufacturing, and deployment
        - Product development or public-health program
        - Useful sensitivity with simpler chemistry, speed, or decentralized operation
      - - Bioproduction or research tool
        - Industrial biotechnology or research-tool partner
        - Cell-engineering and process-development teams
        - Partner program budget
        - Tool evaluation, workflow integration, validation, and repeat use
        - External innovation or process R&D
        - A Mammoth system enables an otherwise difficult editing workflow
      - - Eventual commercial therapy
        - Prescriber, health system, and formulary decision maker
        - Treating clinicians and patients
        - Insurer, national health system, employer, or patient mix remains unknown
        - Approval, evidence review, contracting, treatment, and long-term follow-up
        - Medical and pharmacy benefit owners remain indication-dependent
        - Durable benefit, acceptable safety, operational readiness, and supportable one-time-treatment economics
    notes: >-
