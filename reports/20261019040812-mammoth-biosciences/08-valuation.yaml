chapter:
  number: 8
  title: "Valuation"
  summary: "Public evidence still supports Mammoth as a high-upside CRISPR platform company, but the valuation proof in the retained corpus is stale: the last directly supported mark is the September 2021 unicorn round, and newer public data sources still disagree on even the disclosed financing history. That combination supports a track posture rather than underwriting a buy or firm entry price until management provides current operating metrics, cap-table terms, and program-level proof."
sections:
  - id: "recommendation-and-price-discipline"
    title: "Recommendation and price discipline"
    body: |-
      The retained public record still points to Mammoth as a company with real platform ambition, elite backers, and a historically premium financing outcome, but it does not support paying off narrative alone. The strongest directly supported valuation evidence is still the September 2021 financing that put Mammoth above a $1 billion valuation, while a 2026 market-data profile still collapses the public round history into a single $150 million round on record. That discrepancy matters because current public sources in this chapter do not disclose a fresh share price, a new financing mark, or preference-stack terms that would let an investor bridge from company quality to entry discipline. On that basis, the recommendation is **track**: stay engaged, but do not underwrite a primary or secondary entry off the stale unicorn mark without current metrics and terms.
    claimRefs: ["CV001", "CV002", "CV003", "CV004", "CV005", "CV015"]
    tableRefs: ["TV001"]
    figureRefs: ["FV001"]
  - id: "thesis-versus-anti-thesis"
    title: "What supports upside versus what blocks conviction"
    body: |-
      The upside case is not hard to articulate. Mammoth raised large rounds around a differentiated CRISPR-toolbox story, and outside observers still describe the diagnostics-plus-therapeutics model as more resilient than a single-asset biotech because it can produce validation points outside binary clinical readouts. The anti-thesis is that public evidence still frames much of that upside as potential rather than realized proof. Independent reporting from FierceBiotech and TechCrunch described the technology as early-stage, safety-sensitive, and still short of actual therapeutic products, while Alchemist explicitly notes that diagnostics often command lower venture enthusiasm than therapeutics. Those facts do not break the thesis, but they do mean the thesis is still evidence-sensitive: Mammoth needs fresher proof of commercial traction and clinical de-risking before public evidence can justify an aggressive valuation stance.
    claimRefs: ["CV006", "CV007", "CV008", "CV009", "CV010", "CV016"]
    tableRefs: ["TV002"]
  - id: "scenarios-diligence-and-kill-criteria"
    title: "Scenarios, diligence asks, and kill criteria"
    body: |-
      Scenario work here has to stay qualitative-to-semi-quantitative because the retained public corpus does not disclose current revenue, burn, runway, cap-table preferences, or a post-2021 price reset. Even so, the source set is enough to frame what would move the call. A bull case needs proof that Mammoth can turn platform breadth into repeated commercial or clinical milestones; a base case assumes the company remains strategically interesting but valuation is mostly trapped by stale marks and limited operating disclosure; a bear case assumes the 2021 unicorn narrative proves richer than the next financing or exit market will support. The highest-value diligence asks are therefore current operating metrics, exact financing terms, and program-specific proof points. Absent those, the kill criteria are straightforward: a flat or down financing with heavy preferences, weak commercialization evidence, or slipping therapeutic proof should move the company from track to pass.
    claimRefs: ["CV011", "CV012", "CV013", "CV014", "CV015", "CV016"]
    tableRefs: ["TV003"]
