      - ["Base", "Mammoth remains strategically important but disclosure stays light and proof accumulates gradually.", "Value is preserved but entry discipline should reference a discount to the stale unicorn mark until new evidence tightens the range.", "Narrative strength masks weak operating leverage or delayed product conversion.", "Most consistent with the retained evidence set."]
      - ["Bear", "The next financing or exit market re-prices the company below prior expectations because progress does not support the old platform premium.", "Return math compresses through a flat or down round, preference overhang, or low-liquidity exit.", "Stale marks, missing metrics, and early-stage science leave little downside protection.", "Becomes likely if new financing terms are structured defensively or milestones slip."]
    notes: "Scenario table is qualitative because the retained public sources do not provide current revenue, margin, burn, runway, or exact share terms needed for a defended numeric model."
