      - number: '3.2'
        title: 竞对画像：体量规模、战略重心与非对称优势
        blocks:
          - type: paragraph
            body: >-
              剖析 Arcee AI 的行业身位，必须拆解其直接竞对与相邻选手的资源体量和战略落点。DeepSeek、Z.ai
              等中国实验室依托国家级背景的大型算力集群，以极快的节奏密集发布开源权重，在把推理成本打到极低的同时叫板前沿性能。虽然这批模型在全球开发者中渗透率极高，但其海外背景给西方企业与政府机构带来了不可忽视的合规、采购及国家安全门槛。相比之下，西方本土竞对
              Mistral AI 借力欧洲数据主权政策东风，募资超 €1B，主攻开源模型与企业级专有支持服务。与此同时，Microsoft 等云巨头依托内部研发实力，将高性价比的 Phi 系列小模型直接嵌入 Azure
              云生态，手握难以企及的渠道杠杆。面对这些百亿级体量的对手，Arcee AI 依靠 Miami 和 San Francisco 约 30 人的精干研发团队周旋。其撬动机构级采买的核心支点，在于深度绑定美国能源部及
              17 所国家实验室的 Genesis-Science-1 开源计划，借此在联邦科研计算圈层树立起信誉背书。
