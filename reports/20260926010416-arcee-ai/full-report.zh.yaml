      - number: '2.4'
        title: 增长驱动要素、落地制约瓶颈与尽调核查缺口
        blocks:
          - type: paragraph
            body: >-
              企业对开源权重模型的需求，受业务与成本双重痛点催化。压降推理延迟和摆脱云端 GPU 繁琐运维的迫切诉求，推动企业转向专属端点，实测生产基准显示首字延迟（TTFT）降低 95%，吞吐量达到 41
              QPS。此外，Arcee Conductor 智能路由把常规 prompt 分流至轻量、高精度的
              SLM，不再盲目调用昂贵的前沿模型，大幅削减了运行成本。但另一方面，严峻的落地瓶颈与外部竞争正在侵蚀长期的软件毛利空间。中国实验室高性能、低费率开源模型的全球化倾销，对西方开发者平台造成巨大价格挤压；而风投资本过度集中，全美超
              60% 的 AI 融资直接涌向 OpenAI 和 Anthropic 两大闭源巨头。投资尽调还面临重大信息缺口：由于缺乏经过核查的合同 ARR、净留存率（NRR）和毛利率数据，独立的软件商业模型健康度尚未跑通。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM013
              - CM015
