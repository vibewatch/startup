            body: >-
              Arcee AI 围绕开源基础模型与工作流编排软件，打造并交付企业级人工智能平台。其核心模型序列为 Trinity 家族，旗舰产品 Trinity Large 拥有 4,000
              亿总参数，采用稀疏混合专家（MoE）架构，单 token 激活参数约 13B。区别于闭源 API 服务商，Arcee 将 Trinity 系列以宽松的 Apache 2.0
              协议开源，允许企业、科研机构和主权实体在其私有云或本地机房中自主下载、审查权重、进行私有微调与独立部署。除前沿推理模型外，Arcee 还提供包含 Small、Medium 与 Large 三种规格的
              Virtuoso 系列小语言模型（SLM），以及专攻代码任务的 Coder-Large。这批小模型是 Arcee Orchestra 平台上的基础算力组件。Orchestra
              兼具可视化拖拽与代码编排能力，支持开发者通过 Model Nodes 构建复杂的多智能体链路，在原生调用 Arcee 模型的同时，保持与任意兼容 OpenAI 接口的第三方端点完全互通。
