      - number: '3.3'
        title: 产品形态、定价逻辑与部署架构
        blocks:
          - type: paragraph
            body: >-
              Arcee AI 的商业化差异化，依托于开源基础模型与专有后训练工具链、全托管基础设施的有机组合。其旗舰 Trinity Large 采用稀疏混合专家架构，总参数量达 400B，但单 token 激活参数仅
              13B。这种设计让数据中心仅凭通用 GPU 就能承载大模型能力，压低了在线推理的服务开销。除开源权重本身外，Arcee 的护城河还延伸至工作流工具：团队主导开源的 mergekit
              工具包广受欢迎，免去了全量重训即可融合多种微调权重。庞大的开发者积淀为 Arcee Cloud 输送了商业线索，后者是专为模型评测、自适应微调及安全部署打造的企业级托管软件平台。在商业模式上，Arcee
              采取混合变现路径：基础权重开源可查、免费下载，摆脱了闭源 API 的 token 计量捆绑，主要依靠专有平台订阅费和企业 VPC 运维支持合同创收。然而由于公司尚未公开发布标准定价层级和已实现的 ARR
              规模，企业客户仍须自行测算本地托管的总体拥有成本（TCO）是否真正优于按量计费的商用 API。
