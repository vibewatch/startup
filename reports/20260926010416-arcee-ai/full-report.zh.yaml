chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、商业使命与组织架构
        blocks:
          - type: paragraph
            body: >-
              Arcee AI, Inc. 是一家成立于 2023 年、总部位于加州 San Francisco
              的美国未上市人工智能企业。公司定位为垂直一体化平台服务商，专为企业及工业客户打造开源权重基础模型和专用部署软件。相比完全依赖 OpenAI、Anthropic 等闭源专有模型 API，Arcee AI
              主打开源与开放权重架构，支持机构客户下载、审查、利用私有数据微调，并在物理隔离（air-gapped）或本地私有算力中自主部署，将所有权完整保留在企业内部。公司的商业化路径结合了开源软件分发与企业级技术支持合同、托管云推理以及领域专用后训练工具包。较小的
              Trinity Mini 模型以极低的每 token 推理费率切入商业化，大规模部署则深度绑定公司的专有编排与优化层。至于非公开的 GAAP 软件收入、企业级 ARR 运行率与营业毛利率，官方均未正式披露。
