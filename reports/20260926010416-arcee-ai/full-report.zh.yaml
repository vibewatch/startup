              估值进场将面临非对称的下行风险。机构投资者应将入场前提锁定在查阅 Data Room，必须先核实其经常性软件收入的真实体量。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV013
          - type: callout
            title: 二级老股流动性缺失与估值倍数压缩
            body: >-
              Pre-IPO 阶段的一级老股缺乏流动性，本金面临全部损失的风险。考虑到种子轮至 A 轮指标与 B 轮 $1B
              投后估值存在巨大落差，一旦商业软件变现落后于开源模型下载量的增长，私募股权投资者将承受估值倍数剧烈压缩的冲击。
            calloutType: risk
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
