      - number: '1.4'
        title: 模型研发演进、算力效率与市场阻力
        blocks:
          - type: paragraph
            body: >-
              Arcee AI 技术演进的核心里程碑是研发并推出 Trinity 基础模型家族。2026 年 1 月，Arcee AI 以 Apache 2.0 开源协议发布 Trinity Large，该模型拥有 4,000
              亿总参数，采用稀疏混合专家架构（MoE），单 token 激活参数仅 13B。团队借助由 2,048 块 Nvidia Blackwell B300 GPU 组成的专属集群，历时 6 个月、花费约 $20M
              就完成了包括 Trinity Large 在内的 2025 全系模型训练，资金利用效率较闭源前沿实验室高出一个数量级。在 Trinity Large 面世前，公司于 2025 年 7 月推出 4.5B 参数的
              AFM-4.5B 验证训练链路，并在 2025 年 12 月相继落地更小体量的 Trinity Nano 与 Mini 架构。除商业端企业落地外，Arcee AI 还携手美国能源部及旗下 17 所国家实验室，在
              Genesis Open Models Initiative 框架下共同攻关面向科学计算的开源模型
              Genesis-Science-1。不过，伴随中国低成本开源权重模型在全球快速铺开，公司正承受持续的价格下行压力。
