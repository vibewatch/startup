        - 随着前沿模型规模突破 1T 参数，训练成本将呈指数级攀升
        - 前沿模型训练资本开支超过 $50M，却未带来成比例的收入增长
      - - 企业级主权
        - 国防、能源与金融领域的受监管企业需要自托管开源权重模型，以保护自研核心知识产权
