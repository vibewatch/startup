      - number: '2.2'
        title: TAM、SAM 与基于客观事实的市场测算视角
        blocks:
          - type: paragraph
            body: >-
              测算企业级开源基础模型的市场空间，必须借助多维度的客观视角，而非脱离实际的自上而下拍脑袋。从机构估值视角看，Arcee AI 于 2026 年 9 月完成由 Vista Equity
              Partners、Cambium Capital 和 Emergence Capital 领投的 $150M 融资，确立了 $1.0B
              的投后估值基准。从实际工作负载看，开源权重模型正迅速吞食企业级份额，多模型路由平台上的开发者 token 调用量在 2026 年上半年由 11.5% 跃升至
              45%。然而商业化变现模式仍未定型：权重可下载带来的部署自由，使得调用量暴涨与直接转化为软件收入之间脱节。从资金效率基准看，Arcee AI 仅耗资约 $20M 便交付了包括 4,000 亿参数 Trinity
              Large 在内的 2025 全套前沿模型，印证了架构工程力对天价资本开支的替代效应；但也必须指出，公司当前的企业级商业软件 ARR 仍未见公开披露。
