  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：开源前沿权重与闭源 API 的路线分野
        blocks:
          - type: paragraph
            body: >-
              Arcee AI 所处的竞争生态，核心在于闭源前沿 API 路线与自主托管开源权重架构的结构性分野。OpenAI、Anthropic 及 Google
              等头部闭源实验室在通用推理与开发者心智上占据统治地位，依靠数十亿美元算力堆砌出全托管的 API 访问能力。然而，在强监管行业、国防军工或涉密业务场景中，企业面临数据出境、API
              价格剧烈波动和厂商锁定的多重阻碍。Arcee AI 的 Trinity 基础模型系列精准卡位这一空缺，支持客户下载完整模型权重并在自主掌控的网络边界内独立运行。相较于本土初创对手，Arcee 将主要竞争锚点对准了
              DeepSeek、Moonshot AI、Z.ai 等中国头部开源权重团队——这些团队凭借高性价比的开源权重席卷全球开发者生态。在本土与欧美市场，Arcee 还须直面 Microsoft Phi
              等云巨头小模型产品，以及欧洲老牌开源领头羊 Mistral AI 的贴身竞争。在这片拥挤的赛场上，资本规模、架构效率与企业级渠道交付能力决定生死。
