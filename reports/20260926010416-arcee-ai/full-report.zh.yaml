      - number: '1.3'
        title: 资本化历程、估值锚点与股东阵容
        blocks:
          - type: paragraph
            body: >-
              自 2023 年成立以来，Arcee AI 经历 4 轮已披露的股权融资，累计吸纳股本约 $180M。公司于 2024 年 1 月完成 $6M 种子轮融资；2024 年 7 月完成由 Emergence
              Capital 领投的 $24M A 轮融资；2025 年年中又引入 Microsoft M12、Prosperity7 Ventures 与 Hitachi Ventures 的战略投资。2026 年 9
              月，Arcee AI 敲定 $150M 的 B 轮融资，投前估值基准突破 $1.0B，正式跻身独角兽行列。该轮融资由 Vista Equity Partners、Cambium Capital 和
              Emergence Capital 联合领投，AI10 Ventures、Hitachi Ventures、IAG Capital Partners、Microsoft M12、Prosperity7
              Ventures 与 Wipro Ventures 等产业及战略资本广泛参投。这一里程碑背后经历过早期融资阻力：据 CEO Mark McQuade
              公开透露，在资本疯狂向闭源前沿巨头集中的阶段，硅谷一线头部风投最初普遍对开源权重模型团队持观望态度，直接放弃下注。
            claimRefs:
