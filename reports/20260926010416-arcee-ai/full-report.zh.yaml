      - number: '1.2'
        title: 核心管理层、创始人背景与技术治理
        blocks:
          - type: paragraph
            body: >-
              Arcee AI 由首席执行官 Mark McQuade 与首席技术官 Lucas Atkins 于 2023 年联合创办。Mark McQuade 曾是开源 AI 平台 Hugging Face
              的早期商业化团队成员，在开发者生态增长、开放权重社区运营以及企业模型定制上积累了直接经验。Lucas Atkins 主管核心 AI 研发、模型架构设计与预训练基础设施，此前曾为汽车平台搭建前沿语音对话系统。截至
              2026 年初，Arcee AI 全职团队保持在约 30
              人，极为精简；团队有意控制人员规模，围绕机器学习工程、数据治理和集群运维维系极高的人才密度，未盲目扩张非技术岗位。公司治理权高度集中在创始高管与领投机构手中，董事会与顾问层则由 Microsoft 旗下的
              M12、Prosperity7 Ventures 以及 B 轮领投机构等战略资本共同把关。
