            body: >-
              预训练与持续领域自适应展现出极致资金效率，是 Arcee 运营模式的核心特征。公司仅耗费约 $20M 的算力开销，便走完 2025 全系模型研发周期，包括从零预训练 400B 参数的 Trinity
              Large。为了在避开云巨头天价资本开支的同时交付前沿能力，Arcee 采取了双芯片异构算力策略：大规模预训练与强化学习运行在由 2,048 块 NVIDIA Blackwell Ultra GPU
              构成的集群上，借助 NVIDIA Quantum InfiniBand 互联以及单卡 8 TB/s 的显存带宽，在维持极高专家并行度的同时抑制训练 loss 异常波动。与此同时，Arcee 携手 AWS，利用
              Amazon EC2 Capacity Blocks for ML 弹性储备 GPU 资源，并将持续预训练与领域自适应任务无缝迁移到 AWS Trainium（Trn1）和
              Inferentia2（Inf2）自研芯片实例上。这套异构算力体系在处理 880 亿 token 的 PubMed 等专用数据集时，把训练耗时从 17 小时压降到 1.6 小时，较传统实例降低训练成本达
