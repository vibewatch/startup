  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类划分与企业支出范畴
        blocks:
          - type: paragraph
            body: >-
              企业级人工智能市场正在走向两极分化：一边是多租户闭源前沿模型 API，另一边是具备主权级可控力的开源权重自主部署。Arcee AI 扎根于企业级小语言模型（SLM）及模型编排软件这一细分赛道，将业务边界明确限定在
              72B 参数以下、需要专有、可审查且可深度微调的企业级客户群体。其目标支出圈定在模型蒸馏、模型合并（merging）、本地化私有推理及专用智能体编排预算，明确剔除通用 C
              端聊天机器人订阅与无差异化基础算力转售。第三方平台监测与行业追踪机构将 Arcee AI 划入企业级软件与业务自动化范畴，强调其用算法优化业务流程的能力，而非售卖同质化的基础模型算力。凭借可审查的开源模型，搭配
              Arcee Conductor 与 Arcee Orchestra 等软件编排工具，公司直接争夺企业原先划拨给自研机器学习团队，或是用于支付昂贵闭源 API 调用的 IT 预算。
