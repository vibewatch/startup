      - number: '3.4'
        title: 护城河壁垒、切换成本与被替代风险
        blocks:
          - type: paragraph
            body: >-
              面对行业技术的加速商品化以及同行策略调整，Arcee AI 护城河的稳固程度正经受严峻考验。公司宣称仅耗资约 $20M 就研发出 2025 年全部 4
              款模型，借此树立了资本效率标杆。然而业内人士提醒，这类低成本训练宣传往往把前置的基础研究开销排除在外，且在复杂多步推理、代码生成和超长上下文等企业级硬核场景中，未必能真正匹敌顶级闭源模型。此外，开源权重生态的迁移成本是一把双刃剑：开源权重固然帮客户规避了厂商锁定，但反过来也大幅拉低了模型厂商对客户的黏性。一旦
              Thinking Machines、Reflection AI 等本土团队或 DeepSeek 等中国对手以宽松开源协议发布更强的权重，企业几乎可以零阻力无缝切换底层模型。与此同时，闭源巨头正在疯狂打压
              token 价格并推出私有云专属隔离区，逐步侵蚀自建托管模型的成本与隐私护城河。Arcee 能否保住长期企业客户留存，最终取决于 Arcee Cloud 和 mergekit
