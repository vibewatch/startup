      - number: '1.4'
        title: Model Development Chronology, Infrastructure Efficiency, and Market Headwinds
        blocks:
          - type: paragraph
            body: >-
              The central technical milestone of Arcee AI's trajectory is the development and release of the Trinity
              foundation model family. In January 2026, Arcee AI released Trinity Large, a 400-billion-parameter sparse
              mixture-of-experts model featuring 13 billion active parameters per token under an Apache 2.0 open-source
              license. The startup trained its entire 2025 model lineup, including Trinity Large, in six months for
              approximately $20 million utilizing a dedicated cluster of 2,048 Nvidia Blackwell B300 GPUs, achieving an
              order-of-magnitude greater capital efficiency than frontier closed laboratories. Prior to Trinity Large,
              the company validated its training pipelines via the 4.5B-parameter AFM-4.5B model in July 2025 and
              smaller Trinity Nano and Mini architectures in December 2025. In parallel with commercial enterprise
              adoption, Arcee AI partners with the U.S. Department of Energy and its 17 national laboratories on
              Genesis-Science-1, an open model for scientific computing under the Genesis Open Models Initiative.
              Nevertheless, the company faces sustained competitive pricing pressure as low-cost Chinese open-weight
              models expand globally.
