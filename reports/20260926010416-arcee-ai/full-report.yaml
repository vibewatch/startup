  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar / Lens
      - Investment Thesis (Bull Case)
      - Investment Anti-Thesis (Bear Case)
      - Falsification / Pivot Trigger
    rows:
      - - Capital Efficiency
        - Demonstrated ability to train 400B MoE models for ~$20M creates defensible cost structure vs hyperscalers
        - Training costs will escalate exponentially as frontier models scale beyond 1T parameters
        - Frontier model training capex exceeds $50M without proportional revenue growth
      - - Enterprise Sovereignty
        - >-
          Regulated enterprises in defense, energy, and finance require self-hosted open-weight models to protect
          proprietary IP
        - Enterprises may commoditize open weights while purchasing proprietary closed models for complex agentic tasks
        - Enterprise churn exceeds 20% or customers migrate to open-weight models from Meta or DeepSeek
      - - Commercial Tooling
        - Arcee Cloud and deployment software generate high-margin SaaS revenue beyond pure model weights
        - Enterprise software monetizing open weights suffers low willingness-to-pay and pricing pressure
        - Gross margins drop below 50% due to dedicated cloud compute hosting costs
      - - Public Sector Anchor
        - Department of Energy partnership provides non-dilutive validation and sovereign anchor customer proof
        - Government contract revenue is lumpy, low-margin, and vulnerable to federal budget reallocation
        - Genesis-Science-1 fails benchmark milestones or federal funding lapses
    notes: Pillars synthesize primary company announcements with competitive and market risk factors.
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV010
