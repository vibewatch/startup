        title: Enterprise Buyer Profiles and Demand Segments
        blocks:
          - type: paragraph
            body: >-
              Arcee AI organizes its commercial strategy around four primary demand segments that prioritize
              infrastructure sovereignty, regulatory compliance, and cost governance over closed API dependencies. The
              company's highest-profile institutional deployment centers on public-sector scientific research, where
              national laboratories require transparent model architectures capable of operating within air-gapped
