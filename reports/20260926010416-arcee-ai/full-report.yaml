            body: >-
              To establish disciplined underwriting bounds, we model three operating scenarios across a four-year
              investment horizon. Under the Bull Case, Arcee AI successfully commercializes its Trinity model family
              across Fortune 500 regulated enterprises and scales its U.S. Department of Energy relationship, driving
              annual recurring revenue to $50 million by 2028 with 75% software gross margins, yielding an implied
              enterprise valuation between $3.5 billion and $5.0 billion at 35x to 50x forward ARR. The Base Case
              anticipates steady commercial traction where Arcee AI functions as a premier open-weight customization
              partner, achieving $25 million in ARR by 2028 at 60% gross margins, supporting a market valuation range of
              $1.2 billion to $1.8 billion at 15x to 20x forward revenue multiples. Crucially, private secondary markets
              such as UpMarket report substantial valuation volatility, noting historical estimates that pegged 2025
