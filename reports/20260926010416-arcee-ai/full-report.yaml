  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Open-Weight Architecture
        blocks:
          - type: paragraph
            body: >-
              Arcee AI develops and distributes an enterprise-grade artificial intelligence platform centered on
              open-weight foundation models and workflow orchestration software. The core model offering is the Trinity
              family, headlined by Trinity Large, a 400-billion-parameter sparse mixture-of-experts (MoE) foundation
              model that activates approximately 13 billion parameters per token. In contrast to proprietary closed-API
              providers, Arcee publishes its Trinity models under permissive Apache 2.0 licensing, enabling enterprises,
              research institutions, and sovereign entities to inspect, fine-tune, self-host, and deploy weights within
              their own private clouds or on-premises infrastructure. Alongside frontier reasoning models, Arcee offers
              the Virtuoso family of small language models (SLMs) in Small, Medium, and Large configurations, as well as
              Coder-Large for dedicated programming tasks. These SLMs serve as computational building blocks within
              Arcee Orchestra, a hybrid graphical and programmatic workflow platform. Orchestra enables developers to
              compose complex multi-agent pipelines via Model Nodes that natively execute Arcee models while maintaining
              full interoperability with arbitrary OpenAI-compatible external endpoints.
