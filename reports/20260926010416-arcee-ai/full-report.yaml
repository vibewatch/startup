      - number: '4.4'
        title: Capital Adequacy, Financing Dependency, and Diligence Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Arcee AI achieved a substantial capital milestone in September 2026, securing a $150 million Series B
              financing round led by Vista Equity Partners, Cambium Capital, and Emergence Capital that valued the
              company at over $1 billion. This financing followed an arduous capital environment where leading Tier-1
              venture firms initially passed on open-weight investments due to capital concentration in OpenAI and
              Anthropic. With approximately $180 million in cumulative equity raised and substantial cash reserves,
              Arcee possesses robust runway to fund its next frontier training generation and support Genesis-Science-1
              initiatives. Nonetheless, from an institutional underwriting perspective, fundamental diligence blockers
              persist: verified GAAP revenue, software Annual Recurring Revenue (ARR), customer account retention
              cohorts, and audited gross margin profiles remain entirely private. Third-party aggregator estimates of
              $7.8 million in 2025 revenue remain uncorroborated, meaning valuation multiples reflect strategic frontier
              option value rather than proven software cash flow multiples.
            claimRefs:
