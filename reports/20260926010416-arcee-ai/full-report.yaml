      - number: '1.2'
        title: Executive Leadership, Founder Backgrounds, and Technical Governance
        blocks:
          - type: paragraph
            body: >-
              Arcee AI was co-founded in 2023 by Chief Executive Officer Mark McQuade and Chief Technology Officer Lucas
              Atkins. Mark McQuade previously served as an early commercial employee at open-source AI platform Hugging
              Face, bringing direct experience in developer ecosystem growth, open-weight model community management,
              and enterprise model customization. Lucas Atkins directs core AI research, model architecture, and
              pre-training infrastructure, having previously designed advanced conversational speech systems for
              automotive platforms. As of early 2026, Arcee AI maintains an exceptionally lean headcount of
              approximately 30 employees, deliberately maintaining a high talent density across machine learning
              engineering, data curation, and cluster operations rather than rapidly scaling non-technical headcounts.
              Corporate governance is closely held between the executive founders and lead institutional venture
              investors, with key board and advisory oversight provided by strategic backers including Microsoft's M12,
              Prosperity7 Ventures, and lead Series B investors.
