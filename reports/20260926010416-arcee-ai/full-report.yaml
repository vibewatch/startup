      - number: '2.4'
        title: Growth Catalysts, Adoption Constraints, and Market Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Enterprise demand for open-weight intelligence is accelerated by urgent operational and economic
              catalysts. The operational necessity to reduce inference latency and eliminate cloud GPU management
              complexity drives migrations to dedicated endpoints, evidenced by production benchmarks achieving a 95%
              reduction in time-to-first-token latency and 41 queries per second throughput. Furthermore, intelligent
              routing via Arcee Conductor unlocks dramatic cost savings by triaging routine prompts away from expensive
              frontier models toward compact, highly trained SLMs. Conversely, powerful adoption constraints and adverse
              market dynamics threaten long-term software margins. The rapid global distribution of performant, low-cost
              open models from Chinese labs has created intense pricing pressure across Western developer platforms,
              while venture capital concentration has funneled over 60% of all US AI funding into closed incumbents
              OpenAI and Anthropic. Diligence must account for significant information gaps, specifically the absence of
              verified contract ARR, net revenue retention figures, and gross margin profiles required to validate
              standalone software economics.
