      - number: '3.2'
        title: 'Competitor Profiles: Scale, Focus, and Strategic Asymmetries'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Arcee AI's competitive standing requires dissecting the distinct scale and strategic priorities
              of its direct and adjacent rivals. Chinese laboratories like DeepSeek and Z.ai operate with massive
              government-supported compute clusters and have demonstrated an aggressive release cadence, regularly
              publishing competitive open-weight checkpoints that challenge frontier capabilities at minimal inference
              cost. While these models have captured substantial developer usage globally, their foreign origin
              introduces severe procurement, national security, and regulatory barriers for Western enterprise and
              public-sector buyers. In contrast, Western peers like Mistral AI have capitalized on European
              data-sovereignty mandates, raising over €1 billion to pair open-weight models with dedicated commercial
              enterprise support. Meanwhile, hyperscalers like Microsoft leverage proprietary research to distribute
              small, highly capable models like the Phi family natively within Azure cloud infrastructure, giving them
              immense distribution leverage. Against these multi-billion-dollar peers, Arcee AI relies on its Miami- and
              San Francisco-based research team of approximately 30 employees. Its key strategic bridge into
              institutional deployment is its formal collaboration with the U.S. Department of Energy and 17 national
              laboratories on the Genesis-Science-1 open initiative, anchoring Arcee's credibility within domestic
              federal scientific computing.
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP007
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP005
