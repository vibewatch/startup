              400-billion-parameter Trinity Large sparse mixture-of-experts model—for approximately $20 million in
              aggregate expenditures spanning compute, personnel, data curation, and infrastructure. Pre-training
              orchestration leverages specialized cloud infrastructure, including Amazon SageMaker HyperPod clusters
              operating 512 Nvidia H200 GPUs combined with highly curated datasets from DatologyAI to reduce wasteful
              parameter sweeps. Operating expenses are further moderated by a lean organizational structure of
              approximately 11 to 50 employees, containing recurring payroll overhead. However, ongoing unit economics
              remain subject to substantial compute gross margin drag whenever customer inference is hosted directly on
