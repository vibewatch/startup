      - number: '5.4'
        title: Enterprise Trust, Data Privacy, and Production Governance
        blocks:
          - type: paragraph
            body: >-
              Enterprise adoption of generative AI systems hinges on robust data governance, deployment autonomy, and
              intellectual property safety. Arcee addresses core enterprise trust requirements by providing complete
              architectural transparency and enforceable data isolation boundaries. Under Arcee's published commercial
              terms and privacy policies, customer inputs and outputs processed on paid enterprise instances are
              strictly segregated and excluded from foundation model training datasets, whereas unpaid community tiers
              remain subject to training use unless users explicitly submit opt-out requests. For highly sensitive
              defense, energy, and scientific workloads, Arcee's open-weight architecture allows complete on-premises
              air-gapped deployment, eliminating data egress and third-party API exposure. This capability is
              demonstrated by Arcee's partnership with the U.S. Department of Energy and its seventeen national
              laboratories under the Genesis Open Models Initiative to construct Genesis-Science-1. However, technical
              diligence identifies ongoing operational gaps: enterprise buyers must manage infrastructure clustering
              overhead when self-hosting 400B MoE models, and Arcee has not publicly released formal SOC 2 Type II audit
