      - number: '1.3'
        title: Capitalization Trajectory, Valuation Benchmark, and Investor Base
        blocks:
          - type: paragraph
            body: >-
              Arcee AI has raised approximately $180 million in cumulative equity financing across four disclosed
              funding rounds since its inception in 2023. Following a $6 million seed round in January 2024 and a $24
              million Series A led by Emergence Capital in July 2024, the company secured a mid-2025 strategic
              investment from Microsoft's M12, Prosperity7 Ventures, and Hitachi Ventures. In September 2026, Arcee AI
              finalized a $150 million Series B round that established a benchmark pre-money valuation exceeding $1.0
              billion, officially crossing the unicorn threshold. The round was co-led by Vista Equity Partners, Cambium
              Capital, and Emergence Capital, with broad strategic participation from AI10 Ventures, Hitachi Ventures,
              IAG Capital Partners, Microsoft's M12, Prosperity7 Ventures, and Wipro Ventures. This institutional
              capitalization milestone followed significant early venture fundraising resistance, as CEO Mark McQuade
              publicly reported that leading tier-one Silicon Valley venture capital firms initially passed on funding
              open-weight model labs amid aggressive capital concentration into closed frontier competitors.
