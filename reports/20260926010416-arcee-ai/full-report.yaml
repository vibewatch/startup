chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Commercial Mission, and Corporate Structure
        blocks:
          - type: paragraph
            body: >-
              Arcee AI, Inc. is a privately held American artificial intelligence company founded in 2023 and
              headquartered in San Francisco, California. The enterprise operates as a vertically integrated platform
              provider specializing in open-weight foundation models and specialized deployment software tailored for
              enterprise and industrial customers. Rather than relying entirely on proprietary closed-model APIs like
              OpenAI or Anthropic, Arcee AI builds open-source and open-weight architectures that organizations can
              download, inspect, fine-tune on private data, and deploy within air-gapped or on-premise infrastructure
              under full corporate ownership. The company's commercial model combines open software distribution with
              enterprise support contracts, managed cloud inference, and domain-specific post-training toolkits.
              Commercial pricing for its smaller Trinity Mini model starts at low per-token inference rates, while
              large-scale deployments leverage the company's proprietary orchestration and optimization layer. Private
              GAAP software revenue, enterprise ARR run-rate, and operating gross margins remain officially undisclosed.
            claimRefs:
