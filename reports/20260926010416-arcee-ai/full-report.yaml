        title: Market Boundary, Taxonomy, and Enterprise Spend Scope
        blocks:
          - type: paragraph
            body: >-
              The enterprise market for artificial intelligence is bifurcating between multi-tenant proprietary frontier
              model APIs and sovereign open-weight deployments. Arcee AI operates within the specialized enterprise
              small language model (SLM) and model orchestration software category, bounding its market to organizations
              requiring dedicated, inspectable, and fine-tunable intelligence under 72 billion parameters. This
              perimeter explicitly includes enterprise spend on model distillation, merging, on-premise inference, and
              specialized agentic orchestration, while excluding general-purpose consumer chatbot subscriptions and
              generic compute re-selling. Secondary platform intelligence and market trackers classify Arcee AI within
              enterprise software and business automation, emphasizing algorithmic task streamlining rather than
              undifferentiated foundation model compute. By delivering inspectable open-weight models alongside software
              orchestration tools like Arcee Conductor and Arcee Orchestra, the company targets budgets previously
              allocated to bespoke internal machine learning engineering or recurring proprietary API call fees.
