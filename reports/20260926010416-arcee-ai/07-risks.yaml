callouts:
  - calloutType: risk
    title: Capital Intensity in Frontier Open-Weight Pre-Training
    body: >-
      Arcee AI demonstrated extreme capital efficiency by spending ~$20M to train four models including Trinity Large.
      However, competing against capitalized rivals like River AI ($1.1B raised) and state-backed Chinese labs requires
      recurrent high-capex training cycles that could deplete the $150M Series B reserve if software monetization lags.
    claimRefs:
      - CR001
      - CR009
      - CR014
  - calloutType: insight
    title: Enterprise Security and Self-Hosting Trust Defensibility
    body: >-
      Arcee AI's open-weight architecture allows enterprise customers to run models within their own VPCs without
      sharing prompt data or fine-tuning weights with third-party API providers, structurally mitigating common
      enterprise data leakage concerns.
    claimRefs:
      - CR004
      - CR008
