    title: "Frontier Capital Efficiency vs. Closed Hyperscalers"
    body: "Arcee AI demonstrated notable capital efficiency by training its entire 2025 model portfolio, including the 400B-parameter Trinity Large MoE model, for approximately $20 million in aggregate compute, personnel, and operational costs. This demonstrates that specialized small and medium enterprise models can be produced at a fraction of closed-lab training budgets."
