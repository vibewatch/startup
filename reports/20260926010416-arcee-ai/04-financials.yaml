    title: "Open-Weight Commoditization and Revenue Opacity"
    body: "The rapid global proliferation of highly performant, low-cost Chinese open-weight models creates downward pricing pressure on commercial API and tuning revenues. Coupled with Arcee's complete lack of audited public ARR, customer counts, and gross margins, institutional underwriters face material information asymmetry regarding repeatable commercial software traction."
