evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements, GAAP software revenue, contracted ARR run-rate, gross margins, and monthly cash burn
      rate.
    whyItMatters: >-
      Without audited ARR and margin data, investors cannot verify unit economics or assess how long the $150M Series B
      runway will last given compute expenditure.
    diligencePath: Request company management accounts, GAAP revenue schedules, and current GPU cloud spend commitments under NDA.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: minor
    topic: governance
    missingEvidence: >-
      Fully diluted capitalization table detailing founder equity stakes, preferred share liquidation preferences, and
      formal board composition.
    whyItMatters: >-
      Determines whether lead Series B investors (Vista Equity Partners, Emergence Capital) hold formal board control or
      protective veto rights over future financing and IP licensing.
    diligencePath: Review certificate of incorporation, investor rights agreement, and board voting agreements in the data room.
  - type: missing-source
    severity: material
    topic: enterprise-revenue-and-arr
    missingEvidence: >-
      Audited financial statements, contractual annual recurring revenue (ARR), gross margin percentages, and customer
      retention metrics (NDR/NRR).
    whyItMatters: >-
      Without verified ARR or net retention data, market sizing cannot establish Arcee AI's precise commercial market
      share within the broader enterprise generative AI spending pool.
    diligencePath: >-
      Request audited GAAP income statements, management accounts detailing subscription ARR by customer tier, and
      cohort retention schedules during commercial diligence.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: revenue-transparency
    missingEvidence: >-
      Audited financial disclosure of realized ARR, enterprise subscription price sheets, and average contract values
      for Arcee Cloud.
    whyItMatters: >-
      Without realized contract pricing and renewal data, it is impossible to evaluate customer willingness to pay for
      Arcee's proprietary management platform versus consuming open weights on generic inference infrastructure.
    diligencePath: >-
      Request customer contract schedules, billing rate cards, and software subscription terms during confidential
      commercial diligence.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: adverse-evaluation
    missingEvidence: >-
      Standardized third-party benchmark evaluations comparing Trinity Large against GPT-4o, Claude 3.5 Sonnet, and
      DeepSeek-V3 across complex multi-step reasoning.
    whyItMatters: >-
      Verifying whether Arcee's reported capital-efficient training delivers competitive reasoning capabilities or
      merely matches smaller commodity models is critical to underwriting its long-term enterprise differentiation.
    diligencePath: >-
      Commission independent evaluation runs on standardized LMSYS, MMLU-Pro, and HumanEval benchmarks under identical
      prompt and temperature configurations.
    relatedQuestionRefs:
      - QP009
  - type: conflicting-data
    severity: minor
    topic: valuation-funding
    missingEvidence: >-
      Reconciliation between Airframe's historical record of $49M raised versus FundedIQ's record of $150M across 1
      round and company disclosures.
    whyItMatters: >-
      Historical capitalization numbers establish baseline dilution and burn rates prior to the September 2026 Series B
      round.
    diligencePath: Examine the capitalization table and round-by-round stock purchase agreements during legal diligence.
  - type: private-evidence-only
    severity: blocking
    topic: revenue-traction
    missingEvidence: >-
      Audited financial statements confirming trailing-twelve-month GAAP revenue, software Annual Recurring Revenue
      (ARR), customer account count, and net revenue retention.
    whyItMatters: >-
      Third-party estimates such as GetLatka's $7.8M revenue figure are unverified and contradictory regarding
      capitalization; institutional underwriting cannot confirm revenue sustainability or sales multiples without GAAP
      verification.
    diligencePath: >-
      Request confidential management accounts, customer cohort ARR bridge, and revenue recognition policies during
      Phase 2 data room access.
    relatedQuestionRefs:
      - QI007
      - QI009
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Itemized gross margin breakdown delineating third-party cloud compute expenses (AWS/SageMaker), inference
      infrastructure, and proprietary model training depreciation from realized software contract revenue.
    whyItMatters: >-
      As a developer of frontier SLMs utilizing high-end cluster training (e.g. 512 H200s), compute-heavy post-training
      and managed hosting can significantly erode software gross margins if customer pricing is fixed.
    diligencePath: >-
      Obtain customer unit economics models, hosting margin by SKU, and cloud commitment schedules from AWS and compute
      providers.
    relatedQuestionRefs:
      - QI005
      - QI009
    relatedTableRefs:
      - TI002
      - TI003
  - type: conflicting-data
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Detailed monthly cash burn rate, operating cash flow schedule, and contractual compute commitments under the new
      Series B runway.
    whyItMatters: >-
      While Arcee spent $20M across its 2025 model lineup and raised $150M in September 2026, scaling pre-training for
      larger mixture-of-experts models and Genesis-Science-1 could substantially increase monthly burn.
    diligencePath: >-
      Inspect pro forma 24-month financial forecast, capital expenditure budget for next-gen Trinity training, and
      committed compute capacity agreements.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
