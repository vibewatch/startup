  title: "Product & Technology"
  summary: "Arcee AI delivers an open-weight foundation model ecosystem headlined by the 400-billion-parameter Trinity Large sparse mixture-of-experts model and Trinity-Large-Thinking, offering $0.90 per million token inference economics via NVIDIA Blackwell GPUs, custom CUDA kernels, AWS Trainium accelerators, and the Arcee Orchestra workflow platform."
sections:
  - id: "product-portfolio-and-modularity"
    title: "Product Portfolio and Open-Weight Architecture"
    body: "Arcee AI develops and distributes an enterprise-grade artificial intelligence platform centered on open-weight foundation models and workflow orchestration software. The core model offering is the Trinity family, headlined by Trinity Large, a 400-billion-parameter sparse mixture-of-experts (MoE) foundation model that activates approximately 13 billion parameters per token. In contrast to proprietary closed-API providers, Arcee publishes its Trinity models under permissive Apache 2.0 licensing, enabling enterprises, research institutions, and sovereign entities to inspect, fine-tune, self-host, and deploy weights within their own private clouds or on-premises infrastructure. Alongside frontier reasoning models, Arcee offers the Virtuoso family of small language models (SLMs) in Small, Medium, and Large configurations, as well as Coder-Large for dedicated programming tasks. These SLMs serve as computational building blocks within Arcee Orchestra, a hybrid graphical and programmatic workflow platform. Orchestra enables developers to compose complex multi-agent pipelines via Model Nodes that natively execute Arcee models while maintaining full interoperability with arbitrary OpenAI-compatible external endpoints."
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE005"
      - "CE013"
    tableRefs:
      - "TE001"
  - id: "training-infrastructure-and-hardware-strategy"
    title: "Training Infrastructure, Silicon Diversity, and Capital Efficiency"
    body: "A defining characteristic of Arcee's operational model is extreme capital efficiency in pre-training and continuous domain adaptation. The company completed its entire 2025 model development cycle, including pre-training the 400B-parameter Trinity Large from scratch, for approximately $20 million in compute expenditures. To achieve frontier-scale capabilities without typical hyperscaler capital expenditures, Arcee pursued a dual-silicon infrastructure strategy. High-capacity pre-training and reinforcement learning runs are executed on clusters of 2,048 NVIDIA Blackwell Ultra GPUs interconnected via NVIDIA Quantum InfiniBand fabrics, leveraging 8 TB/s memory bandwidth per GPU to maintain high expert parallelism without training loss spikes. Concurrently, Arcee partners with Amazon Web Services to utilize Amazon EC2 Capacity Blocks for ML, reserving GPU capacity flexibly while shifting continuous pre-training and domain-adaptation pipelines onto AWS Trainium (Trn1) and Inferentia2 (Inf2) instances. This silicon diversification reduced training duration on specialized datasets such as an 88-billion-token PubMed corpus from 17 hours to 1.6 hours, achieving a 97.94 percent reduction in training costs compared to legacy instances."
    claimRefs:
      - "CE002"
      - "CE004"
      - "CE006"
      - "CE014"
    tableRefs:
      - "TE002"
  - id: "inference-stack-and-operating-architecture"
    title: "Inference Engine, Custom Kernels, and Operating Architecture"
    body: "Arcee's operating architecture is engineered to eliminate the high serving overhead and latency penalties typically associated with massive mixture-of-experts architectures. Production inference for Trinity-Large-Thinking is powered by a high-throughput vLLM serving stack orchestrated through NVIDIA Dynamo. To optimize throughput and token economics, Arcee implemented custom NVIDIA CUDA fused MoE kernels, speculative decoding techniques, and KV-cache-aware request routing across a heterogeneous fleet of NVIDIA Blackwell and Hopper systems. This specialized inference stack achieves a commercial API price point of approximately $0.90 per one million output tokens, delivering frontier agentic reasoning at roughly twenty times lower cost than closed proprietary reasoning models. In independent agent benchmarks, Trinity-Large-Thinking achieved second place globally on PinchBench while demonstrating top performance on domain tasks like the tau-squared airline tool-use benchmark. On public distribution platforms, Trinity-Large-Preview recorded over 3.37 trillion tokens served on OpenRouter during its first two months, validating robust enterprise and community adoption across coding harnesses and agent platforms including OpenClaw and Hermes Agent."
    claimRefs:
      - "CE002"
      - "CE006"
      - "CE009"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "trust-privacy-and-enterprise-readiness"
    title: "Enterprise Trust, Data Privacy, and Production Governance"
    body: "Enterprise adoption of generative AI systems hinges on robust data governance, deployment autonomy, and intellectual property safety. Arcee addresses core enterprise trust requirements by providing complete architectural transparency and enforceable data isolation boundaries. Under Arcee's published commercial terms and privacy policies, customer inputs and outputs processed on paid enterprise instances are strictly segregated and excluded from foundation model training datasets, whereas unpaid community tiers remain subject to training use unless users explicitly submit opt-out requests. For highly sensitive defense, energy, and scientific workloads, Arcee's open-weight architecture allows complete on-premises air-gapped deployment, eliminating data egress and third-party API exposure. This capability is demonstrated by Arcee's partnership with the U.S. Department of Energy and its seventeen national laboratories under the Genesis Open Models Initiative to construct Genesis-Science-1. However, technical diligence identifies ongoing operational gaps: enterprise buyers must manage infrastructure clustering overhead when self-hosting 400B MoE models, and Arcee has not publicly released formal SOC 2 Type II audit attestations or third-party red-teaming reports for its hosted Orchestra environment."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE010"
      - "CE014"
