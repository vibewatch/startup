- id: traction-gtm-and-cost-base
  title: Traction, GTM Motion, and Cost Base Proxies
  body: |-
    The strongest public traction signal is not a published GAAP revenue number but a cluster of late-stage scale indicators that fit an enterprise observability vendor rather than a niche tooling company. Coralogix’s official 2026 fundraising materials and TechCrunch both place the customer count above 5,000, while TechCrunch adds that the company passed $100 million in annualized revenue more than a year before June 2026, grew revenue by more than 60% over the last year, and now has roughly 30 customers spending more than $1 million annually. Those facts imply a business that is well beyond early product-market fit and already selling into substantial enterprise accounts. They do not, however, reveal how much of that growth comes from net-new logos versus expansion, nor whether the usage profile is economically attractive after cloud costs.

    Public hiring adds a second layer of signal. Coralogix is staffing AI engineering in Ramat Gan, DevSecOps in Israel, and senior enterprise sales in Boston, while the careers page says the team spans 28 countries. The U.S. enterprise sales leadership role carries $420,000 to $500,000 of on-target earnings, which is a direct clue that the company is funding a serious field motion rather than relying only on low-touch product-led adoption. Combined with more than 600 employees globally per TechCrunch, these signals point to a large and still-expanding cost base. A transparent public estimate is that annual people cost alone is already in the $90 million to $150 million range before infrastructure and other opex, but that estimate remains assumption-driven because public sources do not disclose payroll mix, stock compensation, or sales productivity.
