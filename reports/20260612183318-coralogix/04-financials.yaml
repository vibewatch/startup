  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Current GAAP and non-GAAP gross margin plus cost-of-revenue split by storage, compute, and support.
    whyItMatters: Without gross margin, it is impossible to know whether customer-owned storage is creating a structurally better cost profile or just a more competitive top-line price point.
    diligencePath: Request monthly gross margin bridge, cloud-infrastructure COGS by product line, and archive-query cost curves for the last four quarters.
    relatedQuestionRefs:
    - QI014
    - QI015
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Cash balance, net burn, and explicit runway as of the latest month-end after the Series F close.
    whyItMatters: A $200 million round materially improves capital adequacy, but investors still need to know how much cash is already committed to growth and how quickly that cash is being consumed.
    diligencePath: Request board deck liquidity slides, monthly cash flow statements, and post-close treasury balances.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Net revenue retention, gross revenue retention, logo churn, and cohort expansion by segment.
    whyItMatters: The current valuation range is hard to judge without knowing whether enterprise customers expand efficiently or require heavy replacement selling.
    diligencePath: Request cohort tables by year, segment, and product, including NRR/GRR and seven-figure account retention.
    relatedQuestionRefs:
    - QI017
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC payback, sales cycle length, quota attainment, S&M efficiency by geography, and payroll mix by function.
    whyItMatters: Public hiring shows an enterprise field build, but not whether that spend is compounding efficiently or masking a long payback profile; the same missing data also weakens any public estimate of the people-cost base.
    diligencePath: Request funnel conversion, fully loaded CAC, payback, average days-to-close, and payroll mix for core enterprise segments.
    relatedQuestionRefs:
    - QI010
    - QI013
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Booked ARR, GAAP revenue recognition policy, prepaid versus usage mix, and committed-use terms.
    whyItMatters: The public revenue floor does not reveal whether revenue is mostly ratable recurring contracts, bursty usage, or heavy discounting at renewal.
    diligencePath: Request ARR waterfall, revenue recognition memo, contract archetypes, and top-20 customer billing structures.
    relatedQuestionRefs:
    - QI008
    - QI009
    relatedTableRefs:
    - TI001
    - TI003
    - TI005
  - type: conflicting-data
    severity: minor
    topic: secondary-data-freshness
    missingEvidence: A reconciled external profile pack for funding, customer count, and founding data across secondary databases.
    whyItMatters: Stale external databases can contaminate cap-table and market-mapping work if they are not explicitly superseded by fresher primary and reported sources.
    diligencePath: Circulate a company-approved fact sheet to vendors such as Craft, Crunchbase, and ecosystem directories after major financing events.
    relatedTableRefs:
    - TI005
