- id: capital-adequacy-and-comparable-benchmarks
  title: Capital Adequacy and Public Comparable Benchmarks
  body: |-
    The capital story is consistent with the company overview and materially lowers near-term financing risk, even though it does not answer every underwriting question. Coralogix raised $115 million in Series E in June 2025 at a unicorn valuation and then $200 million in Series F in June 2026, with total capital raised reaching $550 million and TechCrunch reporting a $1.6 billion post-money valuation. Management told TechCrunch that the company did not raise because it needed additional runway and does not currently expect another round soon; official materials say the new money is for AI-native observability, telemetry data infrastructure, and global enterprise expansion. That is a credible late-stage growth use case, but it is still not a substitute for a cash balance, burn number, or quantified runway.

    Public comparables provide the right lens for what “good” can look like if Coralogix scales efficiently. Datadog produced $3.43 billion of fiscal 2025 revenue, 22% non-GAAP operating margin, and $915 million of free cash flow. Dynatrace produced $2.054 billion of ARR, 29% non-GAAP operating margin, and $529 million of free cash flow. Elastic produced $1.483 billion of revenue, 15% non-GAAP operating margin, and roughly 112% net expansion. Cisco’s post-Splunk disclosures show how valuable recurring observability-plus-security revenue can become inside a larger platform: software revenue reached $22.3 billion, subscription revenue grew 15%, and observability revenue grew 26% in fiscal 2025. The implication is not that Coralogix should already look like these companies. It is that the public market ultimately rewards observability vendors for margin, retention, and cash conversion, not just for ingest growth. On public facts alone, a working $160 million to $220 million revenue-run-rate range implies a roughly 7x to 10x post-money multiple, which is defendable for a growth asset but still hard to underwrite without retention and gross-margin proof.
