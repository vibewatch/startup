- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Public status
  - Underwriting impact
  - Exact diligence path
  rows:
  - - Current GAAP revenue
    - No exact figure public
    - Need it to anchor valuation multiple and growth-quality analysis
    - Request last eight quarters of GAAP revenue and bookings.
  - - Booked ARR / run-rate ARR
    - Only floor and growth hints are public
    - Without ARR, usage businesses can look more recurring than they are
    - Request ARR waterfall with new, expansion, contraction, and churn.
  - - Gross margin %
    - Not public
    - Cannot judge true benefit of customer-owned storage or archive-heavy model
    - Request quarterly gross margin bridge and cloud COGS detail.
  - - Net revenue retention / gross retention
    - Not public
    - Expansion efficiency is the core determinant of durable late-stage value
    - Request NRR/GRR by cohort, segment, and seven-figure-account band.
  - - Cash balance and runway
    - Not public
    - Fresh capital alone does not prove adequacy through profitability
    - Request treasury balances, debt, and runway model.
  - - Net burn
    - Not public
    - Needed to convert funding facts into dilution risk and capital need timing
    - Request monthly cash flow statement for trailing 24 months.
  - - CAC payback and sales cycle
    - Not public
    - Enterprise GTM can destroy capital efficiency if payback drifts out
    - Request funnel metrics, quota attainment, and sales-cycle medians by segment.
  - - Usage mix and discounting
    - Not public
    - List pricing can diverge sharply from realized economics in high-volume deals
    - Request top-customer contract archetypes, committed-use floors, and renewal discounting.
  - - Segment and geography revenue mix
    - Not public
    - Hard to test concentration risk and where growth is actually coming from
    - Request revenue mix by region, regulated vertical, and product line.
  notes: These are the highest-priority public-data gaps left after reviewing official, customer, press, and comparable-company sources. They are the minimum private disclosures required to move from evidence-backed narrative to full underwriting.
