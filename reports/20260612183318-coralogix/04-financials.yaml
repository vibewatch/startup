    - Request closing cash proceeds net of fees and any structured terms.
  - - Latest public valuation
    - 1.6 USDb post-money per TechCrunch
    - Medium
    - Sets the only public valuation anchor for current underwriting
    - Request signed term sheet or cap table to confirm post-money and option pool treatment.
  - - Cash on hand
    - Not public
    - Unavailable
    - Fresh capital does not equal current liquidity without balance-sheet disclosure
    - Request post-close treasury balance and restricted-cash schedule.
  - - Monthly burn
    - Not public
    - Unavailable
    - Critical for runway and dilution risk analysis
    - Request trailing 12-month monthly cash burn and seasonality.
  - - Runway
    - Management says the raise was not needed for runway; exact months undisclosed
    - Partial
    - Suggests capital adequacy is improved but not quantified
    - Request board runway model under base and downside plans.
  - - Use of funds
    - AI-native observability, telemetry data infrastructure, and global enterprise expansion
    - High
    - Signals growth investment rather than rescue financing
    - Request hiring plan, infrastructure capex/opex plan, and AI roadmap budget.
  - - People-cost base estimate
    - ~90-150 USDm annually before infra and other opex
    - Low estimate
    - Helps frame how quickly cash could be consumed during expansion
    - Request payroll by function/geography plus planned hiring pace.
  - - Next-round trigger
    - Likely slower growth, weak retention, or margin underperformance rather than immediate liquidity pressure
    - Low inference
    - Private-market leverage can fade quickly if growth-quality metrics soften
    - Request covenant, preference, and internal plan assumptions for profitability timing.
  notes: This table focuses on forward capital adequacy rather than repeating every historical round. Where management commentary exists without balance-sheet disclosure, the row is marked partial rather than factual.
