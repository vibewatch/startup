  - - Traces ingestion
    - Usage-based via units across pipelines
    - GB / unit
    - List price $0.16 per GB; traces can also be routed into cheaper archive paths
    - Official list price only
    - Request trace-retention mix and sampling economics by customer cohort.
  - - Metrics ingestion
    - Usage-based via units across pipelines
    - 1 GB = 1,000 time series
    - List price $0.05; stored in customer cloud with 30x compression claim
    - Official list price only
    - Request metric-cardinality controls and overage profile by enterprise cohort.
  - - AI evaluation workloads
    - Consumption priced separately from units
    - 1 million tokens
    - List price $1.50 per 1M tokens
    - Official list price only
    - Request token usage growth, gross margin, and AI attach-rate by customer size.
  - - Support / professional services
    - Bundled into subscription / usage economics
    - Included
    - Public page says support and professional services cost nothing extra
    - Company claim, not contract evidence
    - Request services revenue share and any paid enablement or migration packages.
  - - Archive query / long retention
    - Customer-owned storage plus remote query
    - S3 / archive query
    - Public page says data remains in customer S3 with effectively infinite retention and remote querying
    - Architecture claim plus customer proof
    - Request actual share of data kept hot versus archive and revenue impact of archive-heavy contracts.
