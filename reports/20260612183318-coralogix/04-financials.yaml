- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Annualized revenue floor
    - ~160 USDm public-information floor
    - Medium estimate
    - Public disclosures support meaningful scale but not a precise current ARR number
    - Request monthly ARR and GAAP revenue bridge from mid-2025 through current month.
  - - Working ARR / revenue run-rate band
    - ~160-220 USDm
    - Low estimate
    - Needed to frame valuation implications, but still model-based
    - Request board-approved budget or latest forecast to replace the estimate.
  - - Seven-figure accounts
    - ~30 customers spending >1 USDm annually
    - Medium
    - Signals real enterprise concentration and likely complex field sales
    - Request top-50 customer ARR distribution and expansion history.
  - - Customer count
    - '>5,000 in Jun 2026'
    - High
    - Sets a denominator for ACV and land-expand interpretation
    - Request active paying accounts, churned accounts, and product attach by segment.
  - - Headline ACV proxy
    - ~32-44k average if run-rate range is divided by 5,000+ customers
    - Low estimate
    - Shows the average contract could mask a highly skewed enterprise mix
    - Request ACV distribution by SMB, mid-market, and enterprise.
  - - Gross margin
    - Not publicly disclosed; storage architecture is customer-owned and compressed
    - Partial
    - Core margin path cannot be underwritten from list pricing alone
    - Request GAAP and non-GAAP gross margin plus COGS split.
  - - Net retention / gross retention
    - Not publicly disclosed
    - Unavailable
    - Retention is the single most important test of usage durability and pricing power
    - Request NRR/GRR by cohort and seven-figure-account retention.
  - - Sales efficiency / CAC payback
    - Public hiring only; no quantified CAC or payback
    - Partial
    - Enterprise GTM can be efficient or very expensive depending on cycle length and ramp
    - Request CAC, payback, quota attainment, and pipeline conversion.
  - - People-cost base
    - ~90-150 USDm estimated annual band before infra and other opex
    - Low estimate
    - Headcount is one of the largest controllable cost buckets in late-stage SaaS
    - Request payroll, SBC, and contractor spend by function and geography.
  - - Cost-control value proposition
    - Customer-owned storage and routing claims; Bank Jago says 80% archive placement lowered cost pressure
    - Medium
    - This is the strongest public argument for eventual gross-margin resilience and customer ROI
    - Request price realization, storage mix, and cloud pass-through by customer cohort.
  notes: Rows intentionally separate facts, partial public signals, and explicit estimates. Null or estimated rows are not defects in authoring; they reflect the private-company disclosure boundary.
  enumerationScope:
    coverage: partial
    basis: Rows cover the most material public unit-economics fields visible from reviewed official, customer, and comparable-company sources as of 2026-06-12; several core metrics remain private by design.
