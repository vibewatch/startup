- id: legal-disclosure-and-financing-risk
  title: Legal, disclosure, go-to-market, and financing risk
  body: 'The legal and financing picture is investable but still opaque in the ways that matter most for late-stage underwriting. Coralogix’s contracts, privacy policy, DPA, and TOMs show a credible compliance framework across GDPR, CCPA, Israeli privacy law, SCCs, breach notice, and annual audits, while EU AI Act and DORA materials show why this burden will keep expanding as the company sells AI and financial-services workflows into Europe. What remains missing is the company-specific proof that would let an investor measure risk rather than merely describe it. Coralogix is still private, so public materials do not disclose gross margin, burn, runway, cohort retention, customer concentration, or liquidation preferences from the latest round. TechCrunch’s June 2026 funding coverage is directionally strong — more than 5,000 customers, more than 600 employees, 30 seven-figure customers, more than 60% growth, and a $1.6 billion post-money valuation — but it is still management-mediated disclosure.
    That creates a real go-to-market concentration risk: the company appears to be moving deeper into large enterprises and regulated accounts, yet public sources do not show whether growth is diversified across cohorts or increasingly dependent on a relatively small number of large-spend accounts and AI-driven expansion narratives.'
