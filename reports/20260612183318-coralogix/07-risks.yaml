- id: TR003
  title: Partner / dependency risk register
  columns:
  - Dependency / pressure source
  - Counterparty / stack
  - Role in buyer decision
  - Failure scenario
  - Severity
  - Mitigation today
  - Residual exposure
  rows:
  - - Datadog pricing and full-stack breadth
    - Datadog
    - Direct incumbent for cloud-native enterprises
    - Buyer accepts Datadog’s modular pricing because breadth and workflow integration outweigh Coralogix cost savings
    - High
    - Coralogix is simpler on users/hosts and stronger on customer-cloud retention
    - Datadog can still defend accounts with ecosystem depth and flexible retention tiers
  - - Splunk / Cisco security consolidation
    - Splunk / Cisco
    - Security-led platform alternative
    - SecOps-led buyers standardize on Cisco-plus-Splunk rather than adopt a separate observability-plus-SIEM vendor
    - High
    - Coralogix can undercut cost and operational complexity in some deals
    - Cisco distribution and installed-base leverage remain materially larger
  - - Elastic / Grafana / Loki openness
    - Elastic, Grafana, Loki, Prometheus, OTel
    - Open and sovereign alternative set
    - Open-stack buyers reject vendor dependence and assemble a cheaper or more sovereign stack
    - High
    - Coralogix offers SaaS convenience and integrated workflows on top of open telemetry inputs
    - Open tools keep switching costs lower than a pure proprietary stack
  - - Cloud-native monitoring defaults
    - AWS CloudWatch, Azure Monitor, Google Cloud Observability
    - Budget ceiling and default procurement path
    - A platform team stays native long enough that Coralogix is delayed, narrowed to one use case, or never approved
    - High
    - Coralogix can sell cross-cloud unification and richer long-term retention economics
    - Native tools are already budgeted and embedded in cloud commitments
  - - Security-data lake alternatives
    - Microsoft Sentinel and AWS Security Lake
    - Security analytics adjacency
    - Security buyers shift spending to platform-adjacent SIEM/data-lake products rather than Coralogix security modules
    - Medium-High
    - Coralogix can unify observability and security on one pipeline
    - Large cloud vendors can bundle security features next to existing contracts
  - - Customer-cloud and OTel dependence
    - Customer S3/object storage plus OTel collectors
    - Architectural foundation for Coralogix differentiation
    - Implementation complexity or customer misconfiguration weakens adoption even when the pricing story is attractive
    - Medium-High
    - Coralogix benefits from open standards and customer control
    - The same openness means the buyer still owns meaningful implementation burden
  notes: This register mixes direct competitors, cloud defaults, and technical dependencies because all three can block or narrow Coralogix deployments before contract signature or expansion.
