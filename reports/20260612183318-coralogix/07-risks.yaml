- id: execution-reliability-and-security
  title: Product, AI, reliability, and security execution risk
  body: 'The next layer of risk is execution. Coralogix is asking investors and buyers to believe that one platform can handle logs, metrics, traces, SIEM, and a fast-moving AI observability and guardrails roadmap without losing quality on the basics. Public review evidence is supportive overall, but it is not clean. G2, TrustRadius, and PeerSpot all surface recurring friction around learning curve, page loading, duplicate logs, SSO visibility, query performance, dashboard flexibility, and alert-management ergonomics. The June 2026 status record is not catastrophic, but it is active enough to matter: archive-query failures in EU2, metrics-alert degradation in EU1, Olly domain maintenance, and RUM ingestion issues all appeared within the same month. Those events matter more because Coralogix simultaneously promises 24/7 support, five-minute response times, and an AI-native operating future. The trust documentation is solid on controls, encryption, audits, and breach notification, but it also
    pushes meaningful responsibility back onto customers for access configuration, API key hygiene, and filtering PII before ingestion. In practice, that means the security and compliance story is enterprise-grade enough to sell, but not yet strong enough to erase shared-responsibility, outage, or AI-efficacy risk from diligence.'
