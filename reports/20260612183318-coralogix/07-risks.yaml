tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk vector
  - Jurisdiction / surface
  - Current public status
  - Likelihood
  - Severity
  - Mitigation / residual exposure
  - Diligence path
  rows:
  - - AI Act and AI-governance obligations
    - EU / AI observability and AI-security workflows
    - EU AI Act is in force and Coralogix says its TOMs self-assess against the AI Act
    - Medium
    - High
    - Mitigation is policy language and product positioning, but no independent evidence yet shows how AI features are mapped to regulated use cases
    - Request legal memo mapping each AI feature to AI Act risk class, obligations, and customer-facing controls
  - - GDPR / privacy / cross-border processing
    - EU, UK, Switzerland, Israel, U.S., India
    - DPA and privacy policy cover GDPR, UK GDPR, Swiss FADP, Israeli privacy law, CCPA/CPRA, and SCC-style transfer mechanics
    - Medium
    - High
    - Mitigation is mature contractual coverage, but residual risk remains because customers may send PII or excess personal data into telemetry streams
    - Request current subprocessor list, product-by-product data-residency map, and examples of customer-side PII filtering controls
  - - DORA / regulated-operations scrutiny
    - EU financial-services customers
    - Coralogix TOMs reference DORA self-assessment and DORA is now a live framework for financial-sector resilience
    - Medium
    - Medium-High
    - Mitigation is control inventory and audit posture, but regulated buyers will still test evidentiary depth beyond marketing pages
    - Request sample financial-services security packet, incident reporting commitments, and evidence of DORA-aligned customer reviews
  - - Contractual uptime, support, and remedy limits
    - Global enterprise contracts
    - Master terms promise 99.9% monthly uptime and support policy offers 24/7 intake with fast response, but public documents do not show SLA credits or negotiated carve-outs
    - Medium
    - Medium-High
    - Mitigation is baseline contractual posture, yet residual exposure remains if large buyers expect stronger remedies than the standard form provides
    - Obtain current MSA, uptime SLA, limitation-of-liability caps, and redline history for top regulated or large-enterprise accounts
  - - Sensitive-data misuse inside telemetry
    - Customer configurations across logs, traces, and AI prompts
    - Terms, TOMs, and DPA repeatedly push responsibility for submitted data and access hygiene back to customers
    - High
    - Medium-High
    - Mitigation is shared responsibility plus filtering/masking tools, but user error can still create privacy or compliance incidents that hit Coralogix reputation
    - Request concrete examples of masking, PII handling defaults, and incident history involving customer misconfiguration
  notes: Rows rank the main public legal and regulatory exposures visible from contracts, privacy materials, and EU framework pages; this is a partial register because litigation, redline statistics, and regulator correspondence are not public.
  enumerationScope:
    coverage: partial
    basis: Rows cover the material public legal and regulatory surfaces visible in official documents and EU frameworks through 2026-06-12, not a full closed list of customer contracts, disputes, or regulator interactions.
