  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ai-efficacy
    missingEvidence: Independent benchmark data, customer case studies, and precision or false-positive metrics for AI guardrails, AI security, and Olly-led incident workflows.
    whyItMatters: The Series F narrative leans heavily on AI expansion, but public proof still comes mostly from company statements and light review evidence.
    diligencePath: Request AI attach rate by cohort, benchmark studies, top-customer reference calls, and internal scorecards for evaluation or guardrail outcomes.
    relatedQuestionRefs:
    - QR010
  - type: private-evidence-only
    severity: material
    topic: concentration-disclosure
    missingEvidence: Customer concentration, ARR concentration, NRR, GRR, renewal rates, and share of growth coming from the top enterprise cohort.
    whyItMatters: Public sources show scale but not diversification, so the downside of a few large-account losses cannot be quantified from the outside.
    diligencePath: Request cohort tables for top 10 accounts, revenue concentration, gross retention, net retention, and expansion by customer segment.
    relatedQuestionRefs:
    - QR018
  - type: private-evidence-only
    severity: blocking
    topic: financing-terms
    missingEvidence: Series F liquidation preferences, investor-control rights, pay-to-play terms, pro rata structure, and any unusual side letters or ratchets.
    whyItMatters: Valuation headlines alone do not reveal whether the next financing or exit economics could be distorted by preference overhang or governance constraints.
    diligencePath: Obtain the latest term sheet, cap table, investor-rights agreement, and summary of preference stack and board-control mechanics.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: business-continuity
    missingEvidence: Function-by-function geographic redundancy, site ownership for customer support and incident response, and wartime continuity planning tied to reserve-duty scenarios.
    whyItMatters: Macro resilience in Israeli tech does not answer whether Coralogix can keep critical functions running if staffing or travel disruptions intensify.
    diligencePath: Request business continuity plan, org chart by region, on-call ownership map, and evidence of failover drills across Israel, the U.S., and India.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR004
    - TR005
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-risk-register
    missingEvidence: A complete public list of customer-specific contractual redlines, litigation history, and regulator interactions that would make the legal risk register exhaustive.
    whyItMatters: The public register is good enough for screening but not for exhaustive legal underwriting, especially in regulated or cross-border deployments.
    diligencePath: Ask legal counsel for litigation summary, customer redline frequency by clause, and any regulator or supervisory correspondence relevant to privacy or AI.
    relatedQuestionRefs:
    - QR015
    - QR016
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: incident-history
    missingEvidence: A 12-month severity-level incident log, MTTR metrics, RCA completion stats, and customer-churn or credit impact from the incidents disclosed publicly in June 2026.
    whyItMatters: A handful of public incidents is not enough to distinguish normal platform operations from a quality trend that could affect enterprise trust and renewal risk.
    diligencePath: Request last 12 months of Sev-1 and Sev-2 incidents, uptime SLA credit data, and examples of post-incident customer communication or save actions.
    relatedQuestionRefs:
    - QR011
    - QR013
    - QR030
    relatedTableRefs:
    - TR002
    - TR005
