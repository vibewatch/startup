companyProfile:
  summary: Coralogix is an Israel-founded observability vendor that has expanded from log analytics into a broader platform spanning logs, metrics, traces, cloud SIEM, and AI observability. Its strongest public proof points are customer-owned storage economics, transparent unit pricing, the Aporia-led AI expansion, more than 5,000 customers, and a fast financing step-up from a $115M Series E in 2025 to a $200M Series F in June 2026. The core underwriting question is whether that product and growth momentum translates into durable late-stage software quality once exact ARR, retention, gross margin, and cap-table terms are tested in a private data room.
