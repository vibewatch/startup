      values:
      - Medium — Controlant + FSA sponsorship
      - Medium — compliance and procurement detail
      - Medium — proof is more about qualification than broad rollout
      - Low — no disclosed contract or renewal data
    - label: Independent review surfaces
      values:
      - Medium — G2, TrustRadius, PeerSpot, Gartner
      - Low — little deployment architecture detail
      - Medium — concrete complaints and praise
      - Low — weak link to actual renewal outcomes
