figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: The public customer journey usually starts with technical pain, lands in a focused migration or POC, then expands across teams if cost control and archive access prove out.
  data:
    items:
    - id: pain
      label: Legacy pain emerges
      actor: Platform / DevOps lead
      description: The trigger is usually ELK, Graylog, multi-tool fragmentation, poor archive access, or runaway ingestion cost.
      channels:
      - Case studies
      - Reviews
    - id: evaluation
      label: POC or migration evaluation
      actor: Infra / engineering manager
      description: Customers compare managed observability against self-hosted stacks or expensive indexed alternatives.
      channels:
      - Case studies
      - Partner introductions
    - id: initial-land
      label: Initial land
      actor: DevOps / platform team
      description: The first deployment usually centers on logs, traces, incident response, or archive query in one technical team.
      channels:
      - Migration support
      - OpenTelemetry tooling
    - id: expand
      label: Expand across personas
      actor: Developers, support, security, product, TAMs
      description: If the deployment works, usage widens into developers, support, security teams, or business users consuming dashboards.
      channels:
      - In-app support
      - Dashboards
      - Alerts
    - id: standardize
      label: Standardize or reconsider
      actor: Engineering leadership / procurement
      description: The account either standardizes around Coralogix, renews based on cost and visibility gains, or reopens vendor comparisons if pain persists.
      channels:
      - Partner channels
      - Review sites
      - Renewal cycle
  claimRefs:
  - CU006
  - CU011
  - CU012
  - CU021
  - CU024
  - CU025
  - CU026
  - CU029
  - CU031
- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: standard
  summary: Public evidence is strongest at evaluation, migration, and internal expansion stages; it becomes weakest at renewal and concentration visibility.
  data:
    nodes:
    - id: discover
      label: Discover / compare
      description: Customers arrive with legacy-tool pain or observability-cost pressure.
    - id: poc
      label: POC / migration design
      description: Technical teams test archive query, OpenTelemetry support, and cheaper retention paths.
    - id: deploy
      label: Initial production land
      description: A platform or DevOps team moves one environment or workflow onto Coralogix.
    - id: expand
      label: Cross-team expansion
      description: Developers, support, security, or product teams adopt dashboards, alerts, or traces.
    - id: channel
      label: Partner-assisted procurement
      description: AWS partner motion, CPPO support, or enterprise identity integrations ease procurement and rollout.
    - id: renew
      label: Renew / deepen
      description: Public proof becomes thin here because renewal and cohort data are not disclosed.
    edges:
    - from: discover
      to: poc
      label: cost / complexity trigger
    - from: poc
      to: deploy
      label: migration + onboarding
    - from: deploy
      to: expand
      label: logs, traces, dashboards, incidents
    - from: deploy
      to: channel
      label: procurement / identity setup
    - from: expand
      to: renew
      label: standardize or re-evaluate
  claimRefs:
  - CU022
  - CU023
  - CU024
  - CU026
  - CU027
  - CU028
  - CU029
  - CU031
  - CU042
- id: FU003
  title: Customer proof matrix
  type: matrix
  layout: wide
  summary: Fintech proof is deepest on scale, cyber/SaaS proof is deepest on migration detail, while independent verification and retention visibility lag across all segments.
  data:
    columns:
    - Evidence quality
    - Production specificity
    - Outcome specificity
    - Retention visibility
    rows:
    - label: Fintech / banking
      values:
      - High — Jago, Razorpay, Tradeweb, 10x
      - High — users, TB/day, migration detail
      - High — cost, telemetry, adoption gains
      - Low — no NRR/GRR or renewal disclosure
    - label: Cyber / SaaS
      values:
      - High — Claroty, Imperva, Cognism
      - High — named prior stacks and support workflows
      - Medium — strong anecdotes, weaker independent corroboration
      - Low — tenure anecdotes only
