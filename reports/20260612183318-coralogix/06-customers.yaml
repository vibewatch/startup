- id: TU006
  title: Reference quality table
  columns:
  - Evidence surface
  - What it proves well
  - Main limitation
  - Best use in this chapter
  rows:
  - - Official customer page
    - Current marketing count and breadth positioning
    - Uses broad language such as teams and does not reconcile paying-account definitions
    - Top-line scale claim with caution
  - - Official case studies
    - Named deployments, buyer/user context, migration triggers, and operational outcomes
    - Seller-curated and often lacking independent confirmation
    - Vertical use-case depth and land-expand patterns
  - - Independent news
    - Freshest count updates, named accounts, and public-sector sponsorship context
    - Operational detail is thin and renewal data absent
    - Independent cross-check on scale and named accounts
  - - Review platforms
    - Real user praise and complaints about support, UI, search, and deployment friction
    - Can be incentivized, gated, or sparse on segment tagging
    - Adverse signal and deployment-pain monitoring
  - - Reference aggregators / directories
    - Breadth of testimonials, case-study counts, and customer-win tracking
    - Usually meta-evidence rather than direct proof of current production use
    - Reference-quality calibration, not core underwriting
  - - Marketplace / partner pages
    - Channel structure, identity plumbing, and reseller motion
    - Weak evidence on actual marketplace demand or bookings share
    - Deal-motion interpretation
  notes: This table ranks evidence by underwriting utility, not by publisher prestige alone; the strongest breadth proof is still not the same as renewal proof.
