- id: deal-motion-and-expansion
  title: Deal motion, land-expand, and partner channels
  body: 'The public pattern suggests a classic technical land-and-expand motion rather than a top-down suite sale. Most case studies start with a platform, DevOps, or infrastructure team trying to replace DIY ELK, Graylog, or a fragmented set of tools. The initial business case is usually a mix of lower spend, easier archive access, fewer blind spots, and better support. Expansion then happens in one of three ways: more telemetry and longer retention; more personas such as developers, support teams, security teams, or business users; or more environments such as customer-hosted banking infrastructure, public cloud, or compliance-heavy workloads. Public channel evidence complements this. Coralogix’s partner page explicitly courts VARs, GSIs, hyperscalers, and cloud consultants, and it highlights AWS Advanced Technology Partner status plus CPPO support. Microsoft’s marketplace surface, by contrast, looks more like enterprise identity and deployment plumbing than a primary demand-generation
    channel. The missing piece is channel mix: no public source quantifies what share of bookings comes from direct sales, hyperscaler marketplaces, or resellers.'
  claimRefs:
