- id: retention-complaints-and-reference-quality
  title: Retention visibility, complaints, and reference quality
  body: 'This is where the customer chapter becomes more cautious. Public retention visibility is poor: there is no disclosed NRR, GRR, logo churn, renewal rate, cohort curve, or top-customer concentration table in the reviewed pack. The positive side is that several named customers describe meaningful tenure or deep adoption, and the review surfaces are active enough to suggest a non-trivial installed base. The negative side is that anecdotal tenure is not the same as renewal quality, and review surfaces carry their own biases. G2, TrustRadius, and PeerSpot all show users finding real value in support, search, and lower observability cost, but they also surface concrete pain around slow or unstable UI behavior, duplicate logs, tracing glitches, and documentation or change-management issues. Reference quality therefore tiers clearly: official case studies are rich but biased; independent news is freshest on customer count but thin on operational depth; review platforms are the best adverse
    signal but not a substitute for cohort data. The net result is a credible adoption story with real evidence gaps on durability.'
