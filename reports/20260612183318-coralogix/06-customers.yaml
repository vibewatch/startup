- id: named-deployments-and-use-cases
  title: Named deployments and vertical use-case depth
  body: 'Named proof is real, but it is uneven in quality. The strongest cases provide production-like detail: Claroty describes a multi-year migration from ELK with more than 200 users and 3,000-plus alerts; Jago provides 20TB-per-day scale plus 216 active users; Tradeweb discloses 130TB-per-day scale and 60% internal adoption; PUMA ties observability directly to failed-order detection in commerce flows; 10x Banking frames Coralogix as an OpenTelemetry-first foundation for both internal and customer-hosted banking environments. These are materially better than simple logo mentions because they reveal buyer profile, user set, workflow, migration trigger, and outcome. Still, almost all of this rich detail comes from Coralogix-published case studies. The independent side is much thinner: TechCrunch gives only a few fresh named accounts, and SiliconANGLE offers public-sector sponsorship context rather than a full production reference. That asymmetry matters. The platform clearly has real deployments,
    but investors should not confuse a deep seller-curated proof pack with broad independent retention evidence.'
