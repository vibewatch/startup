callouts:
- calloutType: strength
  title: Adoption is real across multiple telemetry-heavy verticals
  body: Coralogix is not relying on one narrow niche. The retained proof pack spans digital banking, payments, financial markets, cybersecurity SaaS, e-commerce, gaming, edtech, and regulated supply chain, with several cases showing hundreds of users or tens of terabytes per day.
  claimRefs:
  - CU006
  - CU008
  - CU009
  - CU010
  - CU012
  - CU016
  - CU018
- calloutType: risk
  title: Customer-count proof is much better than retention proof
  body: It is possible to believe that Coralogix has thousands of customers and still be unable to underwrite renewal quality. Public sources are rich on logos, migrations, and usage anecdotes, but they are almost silent on NRR, GRR, churn, concentration, and contract duration.
  claimRefs:
  - CU003
  - CU031
  - CU032
  - CU033
  - CU042
