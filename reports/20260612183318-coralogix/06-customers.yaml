  - - Consumer media / gaming
    - Consumer app infrastructure and product teams
    - 365Scores; Soft2Bet
    - Traffic-spike observability, dashboard-led product monitoring, regulated iGaming analytics
    - 1.2TB/day at 365Scores; 65TB/day at Soft2Bet
    - No public consumer-retention or player-churn link to Coralogix spend
  - - EdTech / multi-entity software groups
    - Central DevOps leadership and acquired engineering teams
    - Byju’s
    - Standardizing observability across heterogeneous stacks and subsidiaries
