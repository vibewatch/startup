  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count-definition
    missingEvidence: A board- or finance-reviewed definition of what counts as a customer, account, team, and enterprise customer, plus the current paying-account total.
    whyItMatters: The public record moves from 4,000-plus teams to 5,000-plus customers, but the unit of account is not reconciled and could materially change valuation assumptions about ACV and logo breadth.
    diligencePath: Request the internal KPI dictionary, latest board deck customer-count page, and reconciliation from team, account, and paying-customer definitions.
    relatedQuestionRefs:
    - QU002
    - QU023
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal rates, and cohort retention by segment, especially for seven-figure accounts.
    whyItMatters: Customer durability is central to underwriting a late-stage observability company, yet public evidence stops at anecdotal tenure and internal adoption depth.
    diligencePath: Request cohort tables by start year, segment, and spend band, plus renewal and contraction analysis for seven-figure customers.
    relatedQuestionRefs:
    - QU020
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-and-contracting
    missingEvidence: Top-10 customer revenue share, average contract term, procurement cycle, and percent of bookings sourced via hyperscaler or reseller channels.
    whyItMatters: Without concentration and contract data, the apparent enterprise depth from named accounts and million-dollar customers could mask hidden dependence on a few buyers or channel partners.
    diligencePath: Request top-customer concentration tables, median contract term, pipeline-to-bookings mix by channel, and win-loss summaries for cloud marketplace deals.
    relatedQuestionRefs:
    - QU022
    - QU025
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: minor
    topic: independent-customer-proof
    missingEvidence: Independent public references for newer named accounts beyond vendor case studies and financing coverage.
    whyItMatters: Most rich deployment evidence is seller-curated; stronger customer-side talks, filings, or procurement records would reduce reference bias.
    diligencePath: Request customer references willing to speak directly, public conference talks from named users, or procurement documentation from regulated accounts.
    relatedQuestionRefs:
    - QU003
    - QU004
    - QU017
    - QU024
    relatedTableRefs:
    - TU003
    - TU006
  - type: access-blocked
    severity: minor
    topic: review-surface-bias
    missingEvidence: A cleaner export of full user-review distributions and low-score reviews from G2 and Gartner without archive or UI gating.
    whyItMatters: The adverse signal is real, but some review surfaces are snapshot-based or partially gated, which limits confidence in complaint frequency and trend direction.
    diligencePath: Collect raw exports from review platforms or ask management for third-party review-monitoring dashboards with score distributions over time.
    relatedQuestionRefs:
    - QU018
    - QU019
    relatedTableRefs:
    - TU004
