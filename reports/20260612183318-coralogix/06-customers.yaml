- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / durability risk
  - Impact
  - Diligence path
  rows:
  - - DevOps-to-engineering expansion
    - Some accounts may remain tooling islands if adoption never spreads beyond infra teams
    - Seat growth and switching cost rise materially when developers, support, and security join the platform
    - Request logo-level seat growth and module adoption history
  - - More telemetry + archive query
    - High data-volume customers may also be the most price-sensitive during budget reviews
    - Coralogix wins by lowering observability TCO while widening coverage
    - Request gross-retention by high-volume account cohort
  - - Security + observability unification
    - If security adoption is shallow, platform stickiness could be overstated
    - Cross-team workflow unification can increase platform depth and wallet share
    - Request attach rate for SIEM, MDR, or security extensions
  - - Hyperscaler / reseller-assisted procurement
    - Unknown share of bookings may depend on partner economics or cloud co-sell motions
    - Partner and marketplace motion can accelerate enterprise reach without building every route directly
    - Request bookings mix by direct, reseller, and marketplace channel
  - - Public-sector / regulated entry
    - Sponsorship and compliance readiness do not guarantee long-term production spend
    - FedRAMP and regulated use cases can open sticky, higher-barrier demand
    - Request federal pipeline, conversion rate, and security accreditation milestones
  - - Top-customer concentration
    - No public disclosure exists on revenue share, contract length, or logo concentration
    - A few seven-figure accounts could drive a disproportionate share of growth and renewal risk
    - Request top-10 customer revenue mix, contract terms, and expansion history
  notes: Expansion pathways are visible in case studies and partner pages, but concentration remains mostly private evidence today.
