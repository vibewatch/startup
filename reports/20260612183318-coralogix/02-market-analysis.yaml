- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Cloud-native telemetry growth
    - Positive
    - Current
    - More logs, metrics, and traces create sustained need for observability workflows
    - Quantify Coralogix retention and gross-margin performance at higher ingest volumes
  - - Security-event centralization and compliance
    - Positive
    - Current
    - SIEM and security analytics remain necessary in regulated and high-risk estates
    - Check Coralogix security-specific win stories and regulated-customer mix
  - - OpenTelemetry and open standards
    - Positive and compressive
    - Current to medium term
    - Adoption rises as lock-in falls, but pricing power moves toward workflow and economics
    - Measure how much Coralogix usage comes from OTel-native pipelines
  - - AI and agent operations
    - Positive
    - Current to medium term
    - Observability expands beyond classic APM toward model, token, and agent traceability
    - Validate attach rates for AI-observability and security modules
  - - Tool sprawl and false positives
    - Negative for fragmented stacks, positive for consolidation winners
    - Current
    - Noise and training burden increase demand for unified platforms
    - Test whether Coralogix demonstrably reduces tools, alerts, or MTTR versus incumbents
  - - Native cloud and open-source substitution
    - Negative
    - Current
    - Simple or single-cloud use cases may never convert to a third-party suite
    - Segment pipeline by multicloud complexity, compliance need, and migration source
  - - Data-volume pricing and retention cost
    - Negative
    - Current
    - High ingest economics can cap expansion or trigger re-platforming
    - Benchmark Coralogix cost-per-terabyte and retention economics against alternatives
  - - Residency and governance constraints
    - Mixed
    - Current to medium term
    - Data-location and control requirements can either help or block adoption depending on architecture
    - Confirm storage control, sovereignty options, and audit trail completeness by region
  notes: Several factors help category growth while simultaneously narrowing which workloads are realistically monetizable by a third-party vendor. The valuation-relevant question is not gross market growth alone but who captures consolidation and telemetry-economics pressure.
