callouts:
- calloutType: insight
  title: The real market is the overlap, not the full stack of adjacent budgets
  body: Coralogix does not need to win all observability or all cybersecurity spend. It needs to win the subset of enterprise and mid-market telemetry programs where engineering and SecOps both feel enough pain that an integrated third-party platform beats native cloud tools, open-source components, or separate incumbents.
  claimRefs:
  - CM009
  - CM031
  - CM032
  - CM034
- calloutType: risk
  title: Headline TAM numbers overstate near-term monetizable demand
  body: Native cloud services, open-source stacks, and SIEM price sensitivity mean the broad market headline is not the right valuation denominator. Coralogix’s upside depends on consolidation wins in complex workloads, not on claiming the entire observability-plus-SIEM category.
  claimRefs:
  - CM010
