- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Primary buyer
  - Primary user
  - Payer / budget owner
  - Workflow
  - Adoption trigger
  - Why Coralogix can matter
  rows:
  - - Large-enterprise platform engineering
    - VP/head of platform engineering
    - SREs, DevOps, observability engineers
    - Central engineering or infrastructure budget
    - Cross-team telemetry, incident response, reliability management
    - Microservices, multicloud, and rising telemetry cost
    - Integrated observability with cost-awareness and cross-team workflows
  - - Security operations / SOC
    - Director of SecOps or SOC lead
    - Analysts, detection engineers, incident responders
    - CISO or shared security operations budget
    - Event collection, correlation, investigations, compliance evidence
    - Alert fatigue, tool fragmentation, need for faster investigations
    - One platform can reduce swivel-chair work between logs and security analytics
  - - Shared engineering + security buyer
    - CTO/CIO plus CISO coalition
    - Platform team plus SecOps users
    - Shared transformation or consolidation budget
    - Unifying telemetry, routing, and incident workflows
    - Board pressure to consolidate tools and data stores
    - Coralogix’s full-stack plus security positioning directly targets this overlap
  - - Regulated industries
    - CIO/CISO in BFSI, government, healthcare, telecom
    - Operations and security teams
    - Central IT, security, and compliance budgets
    - Retention, auditability, threat detection, uptime
    - Compliance reporting and data residency requirements
    - Cross-domain telemetry plus security controls are more valuable in regulated estates
  - - Mid-market cloud-native teams
    - Head of infrastructure or engineering manager
    - Platform and application developers
    - Engineering budget with founder/CFO oversight
    - Monitoring, logging, lean SecOps
    - Need to replace multiple point tools without enterprise-scale staffing
    - Simpler packaging and lower operational overhead can matter more than maximal feature breadth
  - - Cloud-native first single-cloud teams
    - Cloud platform owner
    - Developers and SREs
    - Cloud budget owner
    - Basic monitoring and alerting inside one hyperscaler
    - No compelling reason to adopt third-party yet
    - This is often excluded from near-term SAM because native tools are good enough
  notes: Buyer ownership is shared more often than isolated. Observability users sit closer to engineering, while SIEM users sit closer to security, and the winning platform often has to justify itself to both groups.
