- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Relevance to Coralogix
  rows:
  - - Observability platform spend
    - Logs, metrics, traces, APM, troubleshooting, dashboards, telemetry routing, AI-workload visibility
    - Raw cloud compute, network hardware, generic ITSM, per-request billing systems
    - Platform engineering, SRE, central engineering budgets
    - Core half of the addressable market
  - - Security analytics / SIEM spend
    - Security-event collection, detection, correlation, investigations, compliance reporting, incident response workflows
    - Endpoint suites without analytics, identity tools without event correlation, standalone firewall spend
    - CISO, SecOps, SOC leaders, shared security budgets
    - Core second half of the addressable market
  - - Cloud-native observability suites
    - CloudWatch, Azure Monitor, Google Cloud Operations, managed Prometheus, native logs/metrics/traces
    - Cross-cloud vendor-neutral consolidation layers
    - Cloud platform teams, CIO/CTO organizations
    - Primary substitute that narrows third-party SAM
  - - Cloud-native security data platforms
    - Security Lake, Sentinel connectors/data lake, adjacent cloud security analytics
    - Standalone MSSP spend or endpoint-only response tools
    - Security architecture, SOC, compliance owners
    - Substitute for ingest, normalization, and basic analytics
  - - Open-source monitoring / logging stacks
    - Prometheus, Grafana, Loki and similar self-managed telemetry tools
    - Commercial support contracts not yet purchased, broad SecOps analytics not built
    - Engineering teams with self-hosting tolerance
    - Budget-sensitive substitute and migration pressure
  - - Integrated third-party suites
    - Datadog, Splunk, Elastic, Dynatrace class offerings spanning multiple signals and workflows
    - Single-purpose point tools without cross-domain workflows
    - Central platform plus security leadership
    - Main competitive set for consolidated platforms
  notes: The boundary intentionally excludes broad infrastructure and generic cybersecurity spend. Coralogix is most relevant where observability and security telemetry need to be unified across clouds or teams rather than handled inside a single native tool.
