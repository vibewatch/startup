summary:
  headline: >-
    Coralogix has real product breadth, customer traction, and funding momentum, but the public record is still too thin
    on revenue quality, retention, and cap-table terms to justify aggressive underwriting at the $1.6B mark.
  overallScore: 6.6
  recommendation: track
