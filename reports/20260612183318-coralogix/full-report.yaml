  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue-quality miss
        - Data room shows run-rate closer to $125M-$150M or NRR near 100%.
        - Collapses the premium case and points back toward mature-peer multiples.
        - Rebase toward the bear band and demand a lower entry price.
      - - Gross-margin disappointment
        - Gross margin is materially below high-quality infra-SaaS norms or AI inference cost absorbs expansion.
        - Undercuts the main reason to pay above New Relic / Sumo style comps.
        - Cut bull-case weight until economics improve.
      - - Preference-stack overhang
        - Liquidation preferences, participation rights, or seniority materially reduce incremental common upside.
        - Turns a fair enterprise mark into a weak equity-return setup.
        - Model returns on a fully diluted, preference-aware basis before proceeding.
      - - Growth narrative weakens
        - AI attach-rate or enterprise expansion slows below the story implied by the 2026 round.
        - Removes the private AI-native premium argument.
        - Treat the company more like a mature observability asset than an AI infrastructure winner.
      - - Disclosure remains stalled
        - >-
          Management still withholds cohort retention, concentration, cap table, and cash data in the next diligence
          cycle.
        - Keeps the mark in story risk rather than evidence-backed underwriting.
        - Maintain track / research-more instead of buying the current round narrative.
    notes: Each trigger is monitorable and tied directly to valuation support rather than generic operating risk.
