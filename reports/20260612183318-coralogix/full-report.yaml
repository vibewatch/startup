      - number: '8.4'
        title: Recommendation, entry discipline, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              The right conclusion is not that Coralogix is obviously overvalued or obviously underpriced. It is that
              the current mark is investable only conditionally. The June 2026 financing does not read like a rescue
              round. Management told TechCrunch it was raised for acceleration rather than runway, the secondary piece
              was reportedly small, and the company has enough public scale to justify serious investor attention. But
              the missing evidence list is too central to ignore. A new investor still does not know the exact ARR
              bridge, NRR, GRR, gross margin, burn, cash runway, concentration risk, or the liquidation stack sitting
              beneath $550 million of cumulative funding. Those are not side details. They are the variables that decide
              whether Coralogix deserves a premium private multiple or only a respectable mature-observability one. That
              is why the cleanest stance is track / research-more with medium confidence and high risk, not buy. A buy
              call would require the company to move the discussion from story quality to evidence quality by proving
              that the current run-rate is at least in the chapter-4 band, that retention and margins are premium enough
              to justify an AI-native multiple, and that cap-table terms do not absorb most future upside. Until then,
              entry discipline matters more than admiration. The thesis does not break on a single press release. It
              breaks if valuation support weakens at the same time that economics, cap-table terms, or AI monetization
              fail to clear diligence.
