  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization Model and Revenue Quality
        blocks:
          - type: paragraph
            body: >-
              Coralogix discloses more list pricing detail than most private infrastructure startups, but the disclosure
              still stops at the point where investors would usually shift from pricing architecture to realized
              economics. The public pricing page lists usage prices for logs, traces, metrics, and AI tokens, says all
              support and enterprise features are included, and explicitly avoids seat caps, host caps, and tiering. The
              mechanical idea is that usage is converted into units, with different pipelines converting telemetry at
              different rates. That matters because Coralogix’s story is not “premium SaaS by seat” but
              “telemetry-routing plus customer-owned storage.” The same page says all data lands in the customer’s own
              S3 bucket, with infinite retention and remote querying, while only a short hot-storage layer sits in
              Coralogix-managed infrastructure.


              That architecture improves the quality of the revenue story in one narrow sense: it creates a clear line
              between list price and the cost drivers most likely to move with customer scale. If archive storage is
              customer-owned and compressed heavily before writing, Coralogix can claim lower storage friction and
              better retention economics than classic hot-index observability vendors. The customer evidence is
              directionally supportive. Claroty says Coralogix handles 3 TB of daily data and 3,000-plus alerts, while
              Bank Jago says it ingests up to 20 TB daily, stores 80% of logs and traces in low-cost cloud storage, and
              achieved broader coverage for the same budget. The missing piece is realized revenue quality. Public
              materials do not disclose discounting, committed-use structure, booked ARR, or what share of spend is
              truly recurring versus bursty usage.
