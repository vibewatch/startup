  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk theme
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Pricing moat compression
        - Win-rate declines against Datadog, Elastic, or native-cloud bundles
        - Two consecutive quarters of flat expansion with discounting rising faster than usage growth
        - Re-underwrite gross-margin durability and treat the cost wedge as tactical rather than structural
      - - Reliability erosion
        - Status-page incidents and customer references show repeated search, RUM, or archive failures
        - Multiple Sev-1 incidents in a quarter or reference customers citing degraded trust
        - Pause conviction until incident frequency, MTTR, and product-quality metrics improve
      - - AI execution miss
        - AI attach and efficacy remain self-described instead of independently validated
        - No credible benchmark or flagship references after the Series F investment cycle
        - Haircut valuation narrative and underwrite Coralogix primarily as a core observability vendor
      - - Enterprise concentration opacity
        - Management cannot disclose top-account dependence, renewal health, or NRR by cohort
        - No concentration pack or retention data in diligence room
        - Treat revenue quality as unverified and cap position size or defer investment
      - - Regional continuity shock
        - Reserve-duty, travel disruption, or security escalation materially affects staffing or support handoffs
        - Named functions or on-call responsibilities remain concentrated in one conflict-exposed labor pool
        - Require concrete geographic redundancy before underwriting scale-up plans
      - - Financing / term overhang
        - Round terms or cash needs prove less favorable than public narrative implies
        - Hidden preference stack, unusual ratchets, or runway materially shorter than management indicates
        - Reprice expected returns and consider that the next round may reset economics or governance
    notes: >-
      These kill criteria convert public risks into diligence checkpoints that can be monitored after initial screening
      rather than left as qualitative caveats only.
