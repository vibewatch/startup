  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Bull thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - AI observability tailwind
        - AI agents and telemetry growth can expand the category faster than legacy observability assumptions.
        - AI positioning can inflate multiples before revenue quality is proven.
        - Show AI attach-rate, net-new ARR, and retention by AI cohort.
      - - Commercial scale
        - More than 5,000 customers, 30 seven-figure accounts, and 60% growth look like real late-stage traction.
        - Those signals do not reveal churn, gross margin, or customer concentration.
        - Provide cohort retention, gross margin bridge, and concentration analysis.
      - - Cost architecture
        - Customer-controlled storage can make Coralogix attractive in a cost-fatigued market.
        - A cost story can still be copied or undercut by hyperscalers and open-source stacks.
        - Show durable win rates and expansion versus Datadog, Dynatrace, Elastic, and Grafana alternatives.
      - - Private premium
        - Grafana and AI-native SaaS data show that scarce category leaders can clear double-digit ARR multiples.
        - >-
          Most public and take-private observability comps still cluster in the mid-single-digit to high-single-digit
          range.
        - Prove that Coralogix deserves premium-tier economics rather than merely premium-tier narrative.
      - - Capital position
        - Management says the 2026 round was acceleration capital rather than runway capital.
        - Unknown preference stack and $550M of cumulative funding can still reduce equity upside.
        - Disclose cap table, liquidation stack, and secondary terms.
      - - Exit path
        - Strategic and late-stage private buyers still pay for scaled observability assets.
        - A near-term IPO case is weak without public-company disclosure depth and profitability proof.
        - Show audited metrics and a credible Rule-of-40 path.
    notes: The anti-thesis is intentionally valuation-specific and focuses on what can make a good company a weak entry.
