  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Coralogix should be evaluated against the overlap of two adjacent categories rather than against all
              infrastructure or all cybersecurity spend. The first category is observability: logs, metrics, traces,
              application performance monitoring, troubleshooting, and increasingly AI-workload visibility. The second
              is security analytics and SIEM: centralized collection of security events, correlation, detection,
              investigation, and compliance reporting. That boundary matters because broad cloud, database, endpoint,
              and generic IT operations budgets are not fully available to a third-party platform vendor. Published
              definitions from analyst reports and product pages consistently describe the relevant spend as telemetry
              collection, querying, analytics, detection, and incident response, not raw IaaS consumption or
              general-purpose security software.


              The boundary is also narrowed by status-quo substitutes. AWS CloudWatch, Azure Monitor, and Google Cloud
              Operations all package core observability functions inside their clouds, while AWS Security Lake and
              Microsoft Sentinel package increasing amounts of security-data management and analytics. Open-source and
              quasi-open stacks such as Prometheus, Grafana, and Loki keep basic metrics and logging available without a
              single commercial full-stack vendor. Incumbent third-party suites such as Datadog, Splunk, Elastic, and
              Dynatrace then compete by promising integrated breadth, lower telemetry friction, and better cross-domain
              workflows. For Coralogix, that means the investable market is the subset of enterprise and mid-market
              buyers whose telemetry, governance, or SecOps complexity has outgrown those native or point-tool defaults.
            claimRefs:
