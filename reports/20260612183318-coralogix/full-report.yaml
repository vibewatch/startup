      - number: '2.2'
        title: TAM / SAM / SOM Lenses and Contradictory Public Estimates
        blocks:
          - type: paragraph
            body: >-
              The headline market is clearly large enough to matter, but the public record does not support one clean,
              precise TAM number. On observability, Mordor Intelligence sizes the market at USD 3.35 billion in 2026
              growing to USD 6.93 billion by 2031, while Business Research Insights puts the 2026 starting point at
              roughly USD 4.35 billion with a longer-dated path to USD 16.97 billion by 2035. On SIEM, The Business
              Research Company places 2026 at USD 6.25 billion and MarketsandMarkets places it at USD 8.39 billion,
              while Splunk’s own educational page cites a still higher 2026 figure of USD 11.3 billion. These are not
              small differences; they reflect different category boundaries, treatment of services, and marketing versus
              analyst framing.


              The most defensible broad TAM lens for Coralogix is therefore not a single number but a published 2026
              combined observability-plus-SIEM band of roughly USD 9.6 billion to USD 12.7 billion using low and high
              analyst pairings. Even that band likely overstates what is truly serviceable for Coralogix, because native
              cloud suites, open-source stacks, and single-domain point tools absorb a meaningful share of simpler
              workloads. A practical SAM is better described as the subset of enterprise and upper-mid-market buyers
              that need third-party, cross-cloud, integrated observability plus security analytics. Public sources do
              not isolate that overlap cleanly, so any numeric SOM should be treated as evidence-constrained until
              Coralogix-specific pipeline and segment conversion data are available.
