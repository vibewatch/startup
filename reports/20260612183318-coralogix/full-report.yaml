      - number: '3.2'
        title: Pricing Models and Feature Depth
        blocks:
          - type: paragraph
            body: >-
              The cleanest competitive contrast is pricing architecture. Coralogix sells telemetry through
              pipeline-weighted units and customer-cloud storage: one unit equals $1.50 of logs, metrics, and traces,
              and the same budget can be shifted between frequent-search and monitoring pipelines. That is fundamentally
              different from Datadog's layered model of per-host infrastructure pricing plus separate log ingest,
              indexed-event, flex-storage, and outbound-routing charges. It is also different from Splunk's menu of
              workload, ingest, entity, and activity-based pricing; Dynatrace's host and memory-based observability
              pricing plus separate log-query models; New Relic's user-plus-ingest or compute-plus-ingest structure; and
              Grafana's modular usage pricing across series, logs, traces, and enterprise deployment options.


              Feature breadth alone does not settle the competition because several rivals already match Coralogix on
              the three core observability signals. The more important distinction is where SIEM depth and long-term
              data economics sit. Splunk Enterprise Security, Elastic Security, and Sumo Cloud SIEM are all explicit
              security operations products with SIEM, UEBA, or SOAR-style workflows. Datadog and Dynatrace increasingly
              fuse security with observability, but their commercial logic still feels modular. New Relic and Grafana
              remain observability-led in the reviewed materials, even though they support broad telemetry workflows and
              open standards. Logz.io sits closest to Coralogix on the narrative that cost control, telemetry
              optimization, and log-centric operations can be packaged as one unified service. Coralogix therefore does
              not win by merely offering logs, metrics, and traces; it wins only when buyers value its pricing model,
              customer-cloud retention, and observability-plus-SIEM packaging more than the incumbents' broader
              ecosystems.
