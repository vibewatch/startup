            body: >-
              Israel exposure should be treated as a nuanced risk rather than a shorthand veto. The bullish case is
              visible in the official macro data: the Israel Innovation Authority describes a 2025 rebound in output and
              employment, CNBC and Allianz both describe resilient growth expectations for 2026, and foreign capital has
              not disappeared from the ecosystem. The bearish case is also real. Ynet reports that Israel plans to keep
              roughly 60,000 reservists on duty at any given time from 2026, while Times of Israel cites staffing cuts
              of 15% to 20% or more for some high-tech employers and an earlier wave of tech-worker departures. For
              Coralogix, the practical implication is not that the business is doomed by geography, but that continuity,
              hiring, and customer-facing delivery need more explicit proof than public materials currently provide. The
              company also carries a basic disclosure inconsistency: its legal terms anchor the principal place of
              business in Ramat Gan, while TechCrunch described it as Boston-headquartered. That contradiction is not
              existential, but it is a reminder that even simple corporate descriptors require reconciliation. The
              thesis therefore breaks not on one headline, but if pricing loses force at the same time incidents, AI
              execution, war-linked labor strain, and financing expectations all move the wrong way together.
