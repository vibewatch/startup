      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a business with real scale, a differentiated monetization narrative, and materially
              improved capital adequacy after the 2026 round. Coralogix is not an unproven observability startup: it has
              thousands of customers, seven-figure accounts, enterprise hiring, and a public claim that it cleared a
              $100 million annualized revenue threshold more than a year ago. The architecture story also matters.
              Customer-owned storage and tiered telemetry routing give Coralogix a plausible answer to the cost backlash
              that is now one of the category’s biggest structural problems. That is strategically valuable in a market
              where Elastic says 97% of organizations have seen cost surprises, VendorBenchmark says spend often triples
              without controls, and Practical Logix says AI workloads can make telemetry budgets spiral.


              The underwrite still stops short of conviction because the hardest numbers remain private. Public sources
              do not give current gross margin, GAAP revenue, booked ARR, NRR, GRR, CAC payback, burn, cash, or runway.
              Even third-party profile databases are stale enough to be misleading: Craft still shows $96.2 million of
              total funding and 2,000 customers, far below fresher 2026 disclosures. There is also a second-order
              private-market risk. Crunchbase’s Q1 2026 data shows that late-stage capital is concentrated in very large
              AI-linked rounds while the IPO market remains soft, so future pricing power in private rounds can still
              compress if growth slows or profitability takes longer than expected. The practical verdict is that
              Coralogix looks financable and strategically relevant, but not yet fully underwritable on public
              information alone.
