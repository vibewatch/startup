        title: Roadmap Momentum and Public Product Risks
        blocks:
          - type: paragraph
            body: >-
              The strongest roadmap evidence is in the 2026 release notes and the June 2026 financing narrative.
              Coralogix is not presenting a static observability suite: the release notes show rapid work on trace
              drilldowns, release-centric health, memory and wall-clock profiling, RUM overview pages, AI Session
              correlation, and AI Guardrails. The June 2026 funding page then frames the next development cycle around
              AI-native observability, schema-free telemetry infrastructure, long-term retention, and open-format
              analytics. TechCrunch adds a more market-facing signal: management says more than half of enterprise
              customers already use either Olly or custom AI integrations, and that new capital will accelerate AI
              products, security offerings, and global expansion.


              The limitation angle is equally important. Public evidence is abundant for breadth, but thinner for
              independent proof that each module is best-in-class. CubeAPM’s independent review argues that Coralogix
              looks strongest in cost-optimized log management, pipeline pricing, and SIEM/CSPM breadth, while other
              vendors may still be stronger in deep APM; AWS marketplace feedback also suggests that large-query
              performance and deployment hygiene still matter in real environments. The OTel and Helm surfaces further
              imply migration and operating complexity, especially for teams coming from managed proprietary agents. The
              practical read is that Coralogix looks like a technically ambitious and fast-moving platform, but
              diligence should still test module attach rates, APM depth, AI guardrail accuracy, and the real migration
              effort for non-trivial clusters.
