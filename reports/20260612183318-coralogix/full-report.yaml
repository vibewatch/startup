  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Competitive pressure and pricing commoditization
        blocks:
          - type: paragraph
            body: >-
              Coralogix’s core underwriting risk is that its cost-control story is compelling precisely because the rest
              of the market already trained buyers to treat observability spend as a problem to be optimized, not just
              expanded. Datadog, Splunk, Elastic, Dynatrace, and Microsoft all sell adjacent combinations of
              observability, logging, and security operations, while AWS, Azure, and Google give cloud-heavy buyers a
              native default that can be “good enough” before a separate platform is approved. Grafana, Loki,
              Prometheus, and OpenTelemetry further reduce ideological lock-in for engineering teams that want modular
              or partially self-managed stacks. Coralogix therefore competes in a market where replacement cycles are
              often triggered by cost pain, but that same pain makes budgets more price-sensitive and keeps multi-homing
              rational. Its published per-GB pricing and unlimited-user packaging are easier to explain than many
              rivals’ menus, yet its own value proposition still depends on customers routing data well, tolerating
              customer-cloud storage complexity, and deciding that unified observability plus security is worth more
              than piecing together cloud-native or open components. That means price is both the wedge and the risk: if
              incumbents simplify packaging or buyers standardize on cheaper native tooling, Coralogix’s moat can
              compress quickly.
