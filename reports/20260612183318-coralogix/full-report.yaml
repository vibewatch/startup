  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation anchors and disclosure boundary
        blocks:
          - type: paragraph
            body: >-
              Coralogix's valuation discussion begins with an evidence split that matters more than the headline itself.
              The June 2025 Series E is clearly a unicorn round, but the public record does not publish a clean
              post-money number. TechCrunch reported that Coralogix raised $115 million at a pre-money valuation of over
              $1 billion and described the financing as all-equity and all-primary. That lets an analyst infer a minimum
              post-money slightly above roughly $1.115 billion, which this chapter rounds to about $1.12 billion only as
              shorthand. By contrast, the June 2026 Series F is much cleaner. TechCrunch reported a $1.6 billion
              post-money valuation, the official Coralogix release disclosed a $200 million raise and $550 million of
              lifetime funding, and CTech added that less than 10% of the round was secondary. Public revenue disclosure
              is still incomplete, but the evidence is enough to bound the discussion. TechCrunch said Coralogix had
              surpassed $100 million in annualized revenue more than a year before June 2026 and had grown revenue by
              more than 60% over the prior year, while chapter 4 already converted those facts into a conservative
              public-information band of roughly $160 million to $220 million of ARR or revenue run-rate. CTech also
              quoted management at a $150 million to $200 million annual revenue run-rate. Those data points are not
              audited financials, but they are enough to show that Coralogix is not being valued as a pre-scale tool
              vendor. On that limited public frame, the 2026 mark implies a multiple that is neither obviously reckless
              nor obviously cheap. The harder problem is what public evidence still cannot answer: exact ARR, gross
              margin, NRR, burn, cash runway, customer concentration, and the preference stack behind $550 million of
              cumulative funding.
            claimRefs:
