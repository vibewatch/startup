        title: Founders, named leadership, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The founder record is directionally strong but not perfectly consistent. Coralogix’s current About page
              names Ariel Assaraf as CEO and co-founder and Yoni Farin as CTO and co-founder, while Aleph’s portfolio
              page repeats that pairing. NewView’s portfolio page also centers Assaraf and dates the company to 2014.
              However, Globes adds Guy Kroupp and Lior Redlus to the founding group, and neither the official pack nor
              the independent coverage reviewed here supports the prompt hypothesis that Lior Frenkel was a founder. The
              deeper inconsistency is the founding year itself: official and investor pages often anchor Coralogix to
              2014, while Dun’s 100 and CTech describe it as founded in 2015. The safest reading is that 2014 reflects
              the company’s origin story and 2015 appears in some profile-style records as an establishment or scaling
              date.

              Leadership disclosure beyond the co-founders is serviceable but incomplete. The About page publicly names
              CRO Chetan Chaudhary, CHRO Yael Sapir-Zahavi, CFO Eran Hadad, and CMO and Strategic Partnerships leader
              Brian Mullen. After the December 2024 Aporia acquisition, Liran Hason and Alon Gubkin were brought in to
              lead Coralogix AI, and by March 2025 Hason was publicly presented as VP of AI. What remains
              under-disclosed is governance. Public sources confirm investor relationships with NewView, Brighton Park,
              Aleph, Advent, CPPIB, and Greenfield, but they do not provide a clean current board roster, committee
              structure, or control-rights summary, which keeps key-person and investor-governance diligence open.
