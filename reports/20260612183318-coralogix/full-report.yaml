  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, pricing model, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Coralogix now presents itself as a cross-stack observability platform rather than a narrow log-management
              vendor. Its official About, Pricing, AI Center, and Olly documentation describe one platform spanning
              logs, metrics, traces, security observability, and AI observability, with real-time streaming analytics,
              open formats, and customer-owned storage as the architectural spine. The company’s pricing model is
              unusually explicit for an infrastructure startup: official pricing is unit-based and usage-based, with
              published rates for logs, traces, metrics, and AI tokens, no user or host caps, and no formal pricing
              tiers. That supports the user prompt’s “pipeline-based pricing” hypothesis in substance, though Coralogix
              frames it as units allocated across data pipelines rather than classic seat or host licensing.

              On location, the public picture is much clearer than on founding chronology. Coralogix’s own contact page
              lists its Israel office at 21 Aba Hilel Street in Ramat Gan and U.S. offices in Boston and San Mateo,
              while Craft independently places the headquarters in Ramat Gan. That means the best-supported framing is
              Israel-headquartered with a significant U.S. presence, including a Bay Area office, not a standalone San
              Francisco headquarters. The company also documents offices in London, Frankfurt, and Gurugram, and its
              June 2026 financing release says the platform operates across eight regions including GovCloud, which
              matters for regulated-enterprise and public-sector credibility.
