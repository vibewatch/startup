      - number: '5.2'
        title: 部署、集成与运营者工作流
        blocks:
          - type: paragraph
            body: >-
              Coralogix 的部署模型越来越以 OpenTelemetry 为中心，对现代 cloud-native 团队看起来可信，但实际并不是「零工作量」。官方文档和公司 GitHub repos
              显示了多条摄取路径：Kubernetes Helm charts、Kubernetes manifests、Docker images、OpenTelemetry Agent daemonset、Cluster
              Collector、可选 OpenTelemetry Operator / CRD 模式，以及在 OpenTelemetry collector 生态中维护的开源
              exporter。这里最强信号不是某个落地页，而是官方设置文档、原始 README 材料和 upstream exporter 文档的组合。它们共同说明，Coralogix 可以通过标准 OTel
              组件摄取日志、指标、链路追踪和 Kubernetes 事件，而不只能通过专有 agents。


              同一证据也暴露主要实施摩擦。Kubernetes 设置需要 secrets、Helm repository 管理，有时还要做 Operator 级选择；原始 README 明确警告 Helm arrays
              会覆盖而不是 merge，并记录了某条安装路径上的一个已知验证 warning。Fleet Management 和 Zero Instrumentation 通过增加远程 OTel 配置、Kubernetes
              Helm presets 和基于 eBPF 的捕获，拓宽了故事；API index 和 Terraform provider 则显示
              alerts、dashboards、retentions、enrichments 和 SLO 相关自动化拥有真实 control-plane 表面。换句话说，Coralogix
              对成熟平台团队似乎技术上足够开放，但产品仍假设这些团队能处理 collector 配置、metadata 映射和 rollout hygiene。
