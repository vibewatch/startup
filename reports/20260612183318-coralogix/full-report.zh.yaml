  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与核心架构
        blocks:
          - type: paragraph
            body: >-
              Coralogix 的公开产品表面现在已经远宽于日志管理起点，尽管公司较旧描述仍常被这一点主导。当前官方平台页面呈现的是一个栈：覆盖日志、基础设施指标、分布式 tracing/APM、RUM、cloud SIEM
              和 AI 可观测性 / 安全，Streama 和 DataPrime 是连接组织。Streama 是公司的核心流内引擎：Coralogix
              称，它在数据被摄取时分析日志、指标、链路追踪和安全事件，避免索引延迟，降低用户必须等待的存储依赖型处理量。DataPrime 则作为平台工具、APIs 和 AI
              的通用语法，可在一条语句中跨事件类型、时间范围和存储层 join。


              这套架构是公开记录中最清晰的技术差异化。Coralogix 反复把成本控制和留存绑定到客户自有云对象存储、远程无索引查询，以及一条决定哪些数据保持热态、哪些应被压缩、哪些可留在更便宜归档层的遥测
              pipeline。证明技术深度的最强官方证据不是单个 benchmark，而是产品页面之间的一致性：Streama 负责流内处理，Data Engine 负责 TCO 和 quota 控制，DataPrime
              负责 schema-aware 查询，再把模块特定体验叠在同一个数据平面上。需要注意的是，大量差异化仍由公司自控页面描述，而非独立 benchmark，因此架构故事看起来连贯，但外部验证仍只有部分完成。
