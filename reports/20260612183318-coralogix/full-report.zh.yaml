  - id: FV004
    title: 投资 KPI
    type: kpi
    notes: IC 风格的 1-5 打分，仅基于运行日期可获得的公开证据。
    data:
      items:
        - label: 市场顺风
          score: 4
          detail: 可观测性和 AI 运营仍是战略性支出类别。
        - label: 规模证明
          score: 4
          detail: 5,000 多个客户和 30 个七位数账户，说明公司已有真实的后期阶段牵引力。
        - label: 护城河耐久性
          score: 3
          detail: 成本架构和 AI 定位重要，但既有厂商和开源压力仍然真实存在。
        - label: 经济性可见性
          score: 1
          detail: 公开毛利率、NRR 净留存率（NRR）、现金和股权结构数据仍然缺失。
        - label: 估值支撑
          score: 3
          detail: 该估值标记落在基准情形框住的范围内，但仍高于多数成熟上市同业。
        - label: 下行保护
          score: 2
          detail: 私有化可比交易提供一些支撑，但如果质量指标未达标，资产仍可能被下调重估。
        - label: 证据质量
          score: 1
          detail: 该决策仍取决于私有公司尽调，而不是公开证明。
    claimRefs:
      - CV012
      - CV014
      - CV040
      - CV041
      - CV042
