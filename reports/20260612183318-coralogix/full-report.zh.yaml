  - id: FR003
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要承销路径很直接：价格压力或执行失误先打到扩展和信任，再传导到收入质量、利润率信心、估值和融资杠杆。
    data:
      nodes:
        - id: price
          label: 价格压缩
        - id: quality
          label: 事件 / 产品摩擦
        - id: ai_exec
          label: AI 执行失误
        - id: geo
          label: 以色列劳动力 / 连续性压力
        - id: revenue
          label: 扩展 + 续约
        - id: margin
          label: 毛利率信心
        - id: valuation
          label: 估值支撑
        - id: financing
          label: 未来融资杠杆
      edges:
        - from: price
          to: revenue
          label: 折扣 / 赢单变慢
        - from: quality
          to: revenue
          label: 信任走弱 / 流失风险
        - from: ai_exec
          to: valuation
          label: 压窄 AI 溢价
        - from: geo
          to: quality
          label: 人员 / 支持压力
        - from: revenue
          to: margin
          label: 组合 + 支持负载
        - from: margin
          to: valuation
          label: 倍数压缩
        - from: valuation
          to: financing
          label: 轮次条款 / 退出时点
    approximationNotes: 传导关系有方向性，也由证据牵引；但由于公开毛利率和烧钱数据仍缺失，这些关系没有校准到公司披露模型。
    claimRefs:
      - CR012
      - CR020
      - CR029
      - CR030
      - CR031
      - CR033
      - CR038
  - id: FV001
    title: 推荐逻辑
    type: flow
    notes: 从融资锚点和可比公司框架推导到推荐。
    data:
      nodes:
        - id: n1
          label: 2025 Series E 独角兽标记是估算值，不是精确投后估值
        - id: n2
          label: 2026 Series F 是硬性的 $1.6B 投后估值锚点
        - id: n3
          label: 公开收入运行率证据指向约 $160M-$220M
        - id: n4
          label: 成熟可观测性可比公司大多落在中个位数到约 7x
        - id: n5
          label: 稀缺性溢价可比公司可以超过两位数 ARR 年经常性收入（ARR）倍数
        - id: n6
          label: 缺少毛利率、NRR 净留存率（NRR）、烧钱和股权结构条款
        - id: n7
          label: 基准情形能框住该估值标记，但下行仍有实质意义
        - id: n8
          label: 推荐为跟踪 / 进一步研究
      edges:
        - - n1
