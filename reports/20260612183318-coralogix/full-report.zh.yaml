        - 开放技术栈替代方案
        - 与开源对齐的厂商，提供免费、用量、企业和 BYOC 部署路径
        - 看重可组合性、OTel 和避免锁定的团队
        - OpenTelemetry 原生、无锁定叙事，BYOC / 公有云 / 联邦云选项
        - 技术栈更模块化，SIEM 深度不如安全主导厂商明确
