  - id: FP001
    title: 按定价主权和企业覆盖宽度划分的竞争定位
    type: quadrant
    layout: standard
    summary: 这张序数地图比较 Coralogix 与主要替代方案：一端是客户可控的经济性，另一端是产品宽度和分发能力。
    data:
      xAxis: 定价主权 / 部署控制（1 = 厂商控制的 SaaS 和多段式计费，10 = 自有云或开放部署，成本控制强）
      yAxis: 套件宽度 + 企业分发（1 = 小众或相邻产品，10 = 覆盖面广且企业触达强的既有厂商）
      points:
        - label: Coralogix
          x: 9
          'y': 6
          detail: 自有云存储和管道定价带来很强的主权感，但销售触达仍小于最大型既有厂商。
        - label: Datadog
          x: 4
          'y': 9
          detail: SaaS 平台覆盖很广，分发能力强，但分层定价和 SaaS 控制削弱了主权。
        - label: Splunk / Cisco
          x: 6
          'y': 10
          detail: Cisco 整合后，具备混合部署和巨大的既有厂商触达。
        - label: Elastic
          x: 9
          'y': 8
          detail: 部署灵活性很高，可观测性和安全覆盖也强。
        - label: Dynatrace
          x: 5
          'y': 8
          detail: 企业级产品宽度和自动化能力深，但平台经济性绑定更重。
        - label: New Relic
          x: 7
          'y': 7
          detail: 基于用量的经济性和 OTel 支持提升灵活性，但平台仍由 SaaS 主导。
        - label: Grafana Labs
          x: 10
          'y': 6
          detail: 开放且适合 BYOC，反锁定姿态很强，但原生 SIEM 权重较窄。
        - label: Sumo Logic
          x: 4
          'y': 6
          detail: SIEM 深度和不限用户数的打包方式，抵消了部署叙事更偏 SaaS 的弱点。
        - label: Logz.io
          x: 5
          'y': 5
          detail: 基于消耗的云可观测性产品，带成本工具，但存储主权控制弱于 Coralogix。
    approximationNotes: 坐标轴是分析师基于已审阅的公开产品、定价和部署材料综合出的序数评分；它们不是经审计的市场份额测算。
