  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 竞争对手
      - 标价锚点 / 模型
      - 计量口径
      - 包含能力 / 打包
      - 部署模型
      - 含义
    rows:
      - - Coralogix
        - 管线加权用量下每 unit $1.50
        - Units 可在高频搜索、监控和归档导向用例之间转换
        - 日志、指标、追踪、SIEM 和企业控制在同一商业框架内
        - 客户云存储，支持远程查询
        - 留存要求高时，相比主机优先、席位优先或索引优先的对手最有差异
      - - Datadog
        - 基础设施层级每主机 / 月 $15-$23，另收日志费用
        - 主机、摄入 GB、索引事件、存储事件、出站路由和其他模块
        - SaaS 产品目录广，但商业模式仍是模块化
        - SaaS 主导，带归档集成
        - 预算可能变成多行项目，用量治理负担重
      - - Splunk / Cisco
        - 跨工作负载、摄入、实体和活动模型的定制定价
        - 工作负载类型、GB 摄入、主机、MTS、每分钟追踪、会话、正常运行时间请求
        - 安全、可观测性和平台定价共用一张大菜单
        - 云、私有云、本地部署
        - 灵活但复杂；通常最适合由既有厂商主导的大型账户
      - - Elastic
        - 托管按资源；serverless 按用量；自管理按许可
        - 资源、用量，或节点 / RAM，取决于部署模式
        - 可观测性和安全可以跑在同一个 Elasticsearch 底座上
        - 托管、serverless、自管理、主权版本
        - 部署控制和名义价格同等重要时匹配度高
      - - Dynatrace
        - $7 主机基础版，$29 主机基础设施版，$58 每 8 GiB 主机全栈版；日志另行拆分计费
        - 主机、内存 GiB 小时、pod / session 单元、GiB 摄取 / 留存 / 查询
        - 包含 Grail 和 Smartscape，但定价仍随数据与运行时形态变化
        - 托管平台，agent 主导深度采集
        - 自动化深度强，但价格逻辑仍更接近传统 APM 经济模型
      - - New Relic
        - 100 GB 免费摄取；超出后 $0.40/GB；核心用户 $49；Pro 全平台用户每年 $349
        - 用户加数据摄取，或计算加数据摄取
        - 主机不限量且不额外收费；计算模型可去掉用户费用
        - SaaS 平台，覆盖云端与本地可见性
        - 对比按主机计费厂商更好定位，但 SIEM 深度表述不够明确
      - - Grafana Labs
        - $19/month + 用量；企业版 $25,000/year 起；指标每 1k series $6.50 起；日志按处理 / 写入 / 留存收费
        - Series、已处理 / 写入 / 留存 GB、企业承诺
        - OpenTelemetry 原生栈，主打 Adaptive Telemetry 与无锁定叙事
        - Cloud、公共 / 联邦云、BYOC、OSS / 企业版路径
        - 当开放性和可组合性压过单一厂商简化诉求时，吸引力最强
      - - Sumo Logic
        - 通过 Sumo Credit 分层、Flex 和 SIEM 摄取选项做套餐定价
        - Credits、摄取配置、留存配置；Flex 中搜索单独计费
        - 用户不限量，包含 Cloud SIEM、UEBA，并可选 SOAR 深度能力
        - SaaS / 云优先
        - 对日志 / SIEM 买家较强；在主权部署上差异化较弱
      - - Logz.io
        - 日志、指标、链路追踪、SIEM 与 AI 用量均按消费计费
        - GB、留存、唯一指标、span、AI 功能的 token / 调用次数
        - 年度方案中容量可在产品之间重新分配
        - 可观测性即服务 / SaaS
        - 成本控制叙事最接近 Coralogix，但没有同样的客户云存储叙事
    notes: 本表只使用公开标价或披露的计量口径；并不代表企业客户实际净价、折扣区间或总合同价值。对多数厂商而言，这些仍是尽调缺口。
