      - number: '3.2'
        title: 定价模型与功能深度
        blocks:
          - type: paragraph
            body: >-
              最清晰的竞争对比是定价架构。Coralogix 通过 pipeline-weighted units 和客户云存储销售遥测：一个单元等于 $1.50 的日志、指标和链路追踪，同一预算可在
              frequent-search 和 monitoring pipelines 之间切换。这与 Datadog
              的分层模型根本不同，后者是按主机基础设施定价，再叠加单独的日志摄取、indexed-event、flex-storage 和 outbound-routing 收费。它也不同于 Splunk 的
              workload、ingest、entity 和 activity-based 定价菜单；Dynatrace 的按主机与内存定价的可观测性加单独 log-query 模型；New Relic 的
              user-plus-ingest 或 compute-plus-ingest 结构；以及 Grafana 在 series、logs、traces 和企业部署选项上的模块化使用定价。


              仅靠功能广度无法决定竞争，因为几家对手已经在三类核心可观测性信号上匹配 Coralogix。更重要的区别是 SIEM 深度和长期数据经济性放在哪里。Splunk Enterprise
              Security、Elastic Security 和 Sumo Cloud SIEM 都是明确的安全运营产品，具备 SIEM、UEBA 或 SOAR 式工作流。Datadog 和 Dynatrace
              越来越把安全与可观测性融合，但商业逻辑仍显得模块化。New Relic 和 Grafana 在审阅材料中仍以可观测性为主，尽管它们支持宽泛遥测工作流和开放标准。Logz.io
              在「成本控制、遥测优化和日志中心运营可打包为一个统一服务」这一叙事上最接近 Coralogix。因此，Coralogix 不是只因提供日志、指标和链路追踪而赢；只有当买家对其定价模型、客户云留存、可观测性加
              SIEM 打包的重视超过 incumbents 更宽生态时，它才会赢。
