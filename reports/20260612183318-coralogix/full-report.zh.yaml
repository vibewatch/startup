companyProfile:
  summary: >-
    Coralogix 是一家创立于以色列的可观测性厂商，已从日志分析扩展为更宽的平台，覆盖日志、指标、链路追踪、cloud SIEM 和 AI 可观测性。公开材料中最强的证明点包括客户自有存储经济性、透明单元定价、Aporia 带来的
    AI 扩张、超过 5,000 家客户，以及从 2025 年 $115M Series E 到 2026 年 6 月 $200M Series F 的快速融资抬升。核心承销问题是：在私有 data room 里检验精确
    ARR、留存、毛利率和 cap table 条款之后，上述产品与增长动能能否转化成耐久的后期软件资产质量。
