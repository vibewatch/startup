      - number: '1.3'
        title: 融资轨迹、投资人基础与公开规模信号
        blocks:
          - type: paragraph
            body: >-
              公开资本故事，是围绕 AI 可观测性叙事快速抬升的一系列融资。Coralogix 自己 2025 年 6 月 17 日的文章和多家以色列独立商业媒体一致称，公司完成 $115 million Series
              E，估值超过 $1 billion，成为独角兽，NewView Capital 领投。CTech 和 Globes 称该轮后累计融资达到 $350 million；本轮抓取的 About 页面仍写着仅融资
              $320 million，最合理的解释是官网文案过时，而不是融资历史真正矛盾。

              到本轮报告日，更新的锚点是 2026 年 6 月 3 日 Series F。Coralogix、Advent、FinTech Global 和 TechCrunch 均报道 $200 million
              融资，累计融资升至 $550 million；TechCrunch 给出最具体估值数据点，即 $1.6 billion 投后估值。该轮也实质更新了公开规模指标。官方和独立 2026 年来源将客户基数从 2025
              年的 4,000 多家推进到 2026 年 6 月超过 5,000 家。员工数没那么干净：2025 年 6 月以色列报道称公司有 500 到 550 名员工，而 TechCrunch 2026 年 6
              月报道称全球超过 600 名员工。这足以否定用户提出的 2,500 客户假设过低，也足以把 600-800 名员工假设视为方向上合理，但截至报告日仍未精确验证。
