  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 公开状态
      - 承销影响
      - 精确尽调路径
    rows:
      - - 当前 GAAP 收入
        - 没有公开精确数字
        - 需要用它锚定估值倍数和增长质量分析
        - 索要过去八个季度的 GAAP 收入和 bookings。
      - - 已签约 ARR / run-rate ARR
        - 公开信息只有下限和增长线索
        - 没有 ARR，用量型业务可能显得比实际更具经常性
        - 索要 ARR 瀑布图，拆分新增、扩张、收缩和流失。
      - - 毛利率 %
        - 未公开
        - 无法判断客户自有存储或归档重度模型的真实好处
        - 索要季度毛利率桥表和云 COGS 细节。
      - - 净收入留存 / 总留存
        - 未公开
        - 扩张效率是后期价值能否持久的核心决定因素
        - 索要按 cohort、分层和七位数账户区间划分的 NRR / GRR。
      - - 现金余额和 runway
        - 未公开
        - 只有新资本无法证明公司能靠现有资金走到盈利
        - 索要资金余额、债务和 runway 模型。
      - - 净 burn
        - 未公开
        - 需要用它把融资事实转换为稀释风险和资本需求时点
        - 索要过去 24 个月的月度现金流量表。
      - - CAC 回收期和销售周期
        - 未公开
        - 如果回收期拉长，企业 GTM 可能摧毁资本效率
        - 索要漏斗指标、配额达成率，以及按分层划分的销售周期中位数。
      - - 用量结构与折扣
        - 未公开
        - 大客户高用量交易里，标价可能与实际经济性明显背离
        - 要求披露头部客户合同范式、承诺用量下限和续约折扣。
      - - 分部与地域收入结构
        - 未公开
        - 难以检验集中度风险，也难以判断增长实际来自哪里
        - 要求按地区、受监管垂直行业和产品线披露收入结构。
    notes: 复核官方、客户、媒体和可比公司资料后，上述项目仍是优先级最高的公开数据缺口。若要从有证据支撑的叙事推进到完整承销判断，至少需要这些私域披露。
