      - number: '8.3'
        title: 情景承保、上行和下行
        blocks:
          - type: paragraph
            body: >-
              情景争论主要是质量争论，而不是纯增长争论。乐观情景认为，Coralogix 超过 60% 的增长、5,000 多个客户规模、AI-native 定位和客户控制存储架构，能证明其倍数应更接近私营 AI-native
              区间，而不是成熟可观测性区间。在这个视角下，如果运行率走向 $200 million 至 $240 million，并叠加强留存和健康毛利率，可支撑约 $2.0 billion 至 $2.6
              billion。基准情景没那么英雄化，也更符合公开记录：如果第 4 章的 $160 million 至 $220 million 估计方向正确，并且公司因为仍比成熟同业增长更快而应享受约 7x 至 10x，那么
              $1.3 billion 至 $1.8 billion 的估值可以清楚包住当前 $1.6 billion 标记。悲观情景需要明确权重，因为火热 AI
              轮常常遮住最容易发生的失败模式：不是需求崩塌，而是质量调整后倍数崩塌。如果真实运行率更接近 $125 million 至 $150 million，如果 AI 扩张仍主要是叙事，或毛利率和 NRR
              只是普通而非优质，市场可以理性地把 Coralogix 重估到 New Relic、Sumo，甚至 Dynatrace
              式公开敞口所支付的中个位数倍数。这就是一家战略上有意义的公司，仍可能在错误价格上成为较弱进入点的方式。当前估值最好的防守理由是，它不需要 Datadog
              式英雄假设也可辩护。最强的悲观看法是，在公开证据证明优质经济性或温和股权结构表条款之前，它仍要求投资者支付高于成熟可比公司的价格。这种不对称支持有纪律的仓位和尽调，而不是热情。
