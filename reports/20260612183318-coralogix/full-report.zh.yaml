        - 平台团队在原生工具上停留足够久，导致 Coralogix 被延后、缩小到单一用例，或始终未获批准
        - 高
        - Coralogix 可以销售跨云统一和更强的长期留存经济性
        - 原生工具已经进入预算，并嵌入云承诺
      - - 安全数据湖替代方案
        - Microsoft Sentinel 和 AWS Security Lake
        - 安全分析邻近领域
        - 安全买家把支出转向平台邻近的 SIEM / 数据湖产品，而不是 Coralogix 安全模块
        - 中-高
