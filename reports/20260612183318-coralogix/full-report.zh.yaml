  - id: TR005
    title: 缓释措施与一票否决标准表
    columns:
      - 风险主题
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 定价护城河压缩
        - 对 Datadog、Elastic 或原生云捆绑方案的胜率下降
        - 连续两个季度扩张持平，且折扣上升快于用量增长
        - 重新承保毛利率韧性，把成本差距视为战术优势而非结构性优势
      - - 可靠性侵蚀
        - 状态页事故和客户访谈显示搜索、RUM 或归档反复失效
        - 单季度多起 Sev-1 事故，或参考客户提到信任受损
        - 暂停确信度，直到事故频率、MTTR 和产品质量指标改善
      - - AI 执行落空
        - AI attach 和效果仍停留在公司自述，缺少独立验证
        - Series F 投资周期之后仍没有可信基准或旗舰客户背书
        - 下调估值叙事，主要把 Coralogix 按核心可观测性厂商承保
      - - 企业客户集中度不透明
        - 管理层无法披露头部账户依赖、续约健康度或按 cohort 划分的 NRR
        - 尽调室没有集中度材料或留存数据
        - 将收入质量视为未验证，并限制持仓规模或推迟投资
      - - 区域连续性冲击
        - 预备役、出行中断或安全升级，对人员配置或支持交接造成实质影响
        - 指定职能或 on-call 职责仍集中在一个暴露于冲突的劳动力池
        - 承保扩张计划前，要求公司拿出具体的地域冗余安排
      - - 融资 / 条款悬空
        - 轮次条款或现金需求不如公开叙事暗示的有利
        - 隐藏优先权堆栈、异常棘轮条款，或 runway 明显短于管理层说法
        - 重新定价预期回报，并考虑下一轮可能重置经济利益或治理安排
    notes: 这些一票否决标准把公开风险转成尽调检查点，初筛之后可以继续监测，而不是只留下定性 caveat。
