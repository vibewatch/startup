      - number: '3.3'
        title: 部署模型、买家适配与切换模式
        blocks:
          - type: paragraph
            body: >-
              部署灵活性是另一个主要分野。Coralogix 明确把可观测性数据存进客户自己的 S3 bucket，并把远程、无索引查询和无限留存作为核心功能销售，而不是 add-ons。纸面上 Elastic
              是最灵活的对手，因为它提供 hosted、serverless 和 self-managed 模式，其安全产品也营销 sovereign、on-premises 和 air-gapped 部署。Grafana
              营销 public cloud、federal cloud 和 bring-your-own-cloud 选项。Splunk 仍支持 cloud、private cloud 和 on-premises
              选择。相比之下，在审阅材料中 Datadog、Sumo Logic、Logz.io 和 New Relic 更明显是 SaaS-led，即便它们也开放归档或 open-telemetry 选项。


              这些部署模型塑造买家适配。Coralogix 最适合想要集中式可观测性和 SIEM
              工作流、但不想按主机或按座席付费的工程或安全团队，也适合重视把长期留存数据保存在自有云账户里的企业。董事会层面要求开放标准、自管理或主权部署时，Elastic 和 Grafana 更强。买家想要一个大型
              incumbent，具备企业采购深度、服务覆盖和跨多项 IT 功能的平台整合时，Splunk/Cisco 和 Dynatrace 最强。New Relic、Sumo 和 Logz.io
              更容易说服从单一领域起步的团队——开发者可观测性、日志 / SIEM 运营，或受成本控制的云可观测性——再向外扩展。Coralogix 的挑战在于，multi-homing
              在这个市场仍然理性：买家可以在可观测性后端旁边保留开放栈、云原生归档或单独 SIEM，因此切换成本有意义，但并非绝对。
