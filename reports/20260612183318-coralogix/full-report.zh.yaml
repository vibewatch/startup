  - id: FE001
    title: 产品架构地图
    type: stack
    layout: wide
    summary: Coralogix 把开放采集、流内分析、通用查询平面、客户自有存储和按模块划分的体验叠进一个产品栈。
    data:
      layers:
        - label: 采集
          detail: OpenTelemetry collector、Kubernetes collector 和基于 eBPF 的捕获把遥测带入平台。
          items:
            - OTel collector
            - Kubernetes agent / cluster collector（Kubernetes 采集器）
            - OBI eBPF 捕获
        - label: 流内分析
          detail: Streama 在遥测摄取时就评估数据，而不是等索引后再分析。
          items:
            - 实时模板
            - 摄取时告警
            - 安全事件分析
        - label: 数据控制
          detail: 数据平面先管理成本和路由，避免每个字节都被同等处理。
          items:
            - TCO Optimizer
            - Quota Manager
            - Data Plans
            - Pipeline Analyzer
        - label: 统一查询平面
          detail: DataPrime 为实时数据、归档、API 和 AI 辅助工作流提供同一套语法。
          items:
            - 跨事件关联
            - 无需重建索引即可访问归档
            - 仪表盘 / 告警 / API
        - label: 体验表层
          detail: 按模块划分的体验搭在同一遥测基础之上。
          items:
            - 日志分析
            - 基础设施监控
            - APM / 链路追踪
            - RUM
            - Cloud SIEM
            - AI Center
            - Fleet Management
