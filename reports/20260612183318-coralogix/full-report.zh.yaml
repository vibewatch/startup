  - id: TV002
    title: Thesis / anti-thesis 表
    columns:
      - 视角
      - 多头 thesis
      - 反 thesis
      - 何种证据会改变看法
    rows:
      - - AI 可观测性顺风
        - AI agents 和遥测增长可能让品类扩张快于传统可观测性假设。
        - 在收入质量被证明之前，AI 定位可能先抬高倍数。
        - 展示 AI attach-rate、净新增 ARR，以及按 AI cohort 划分的留存。
      - - 商业规模
        - 超过 5,000 名客户、30 个七位数账户和 60% 增长，看起来像真实的后期 traction。
        - 这些信号无法揭示流失、毛利率或客户集中度。
        - 提供 cohort 留存、毛利率桥和集中度分析。
      - - 成本架构
        - 客户自控存储能让 Coralogix 在成本疲劳的市场里更有吸引力。
        - 成本叙事仍可能被超大规模云厂商和开源栈复制或压价。
        - 展示相对 Datadog、Dynatrace、Elastic 和 Grafana 替代方案的持久胜率与扩张。
      - - 私有市场溢价
        - Grafana 和 AI-native SaaS 数据显示，稀缺品类领导者可以拿到两位数 ARR 倍数。
        - 大多数公开和私有化的可观测性可比公司，仍集中在中个位数到高个位数区间。
        - 证明 Coralogix 值得溢价层级的经济性，而不只是溢价层级的叙事。
      - - 资本位置
        - 管理层称 2026 轮融资是加速资本，而不是 runway 资本。
        - 未知的优先权堆栈和累计 $550M 融资，仍可能削弱股权上行。
        - 披露 cap table、清算堆栈和二级交易条款。
      - - 退出路径
        - 战略买家和后期私有买家仍愿意为规模化可观测性资产付费。
        - 没有上市公司级披露深度和盈利能力证明，近期 IPO 案例偏弱。
        - 展示经审计指标和可信的 Rule-of-40 路径。
    notes: 反 thesis 刻意聚焦估值，讨论什么会让一家好公司变成一个弱买点。
