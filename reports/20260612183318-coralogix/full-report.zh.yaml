      - number: '4.3'
        title: 资本充足性与公开可比基准
        blocks:
          - type: paragraph
            body: >-
              资本故事与公司概览一致，并实质降低近期融资风险，尽管它没有回答每一个承销问题。Coralogix 于 2025 年 6 月以独角兽估值完成 $115 million Series E，随后在 2026 年 6
              月完成 $200 million Series F，累计融资达到 $550 million；TechCrunch 报道投后估值为 $1.6 billion。管理层告诉 TechCrunch，公司并非因为需要更多
              runway 而融资，且当前不预期很快再融资；官方材料称新资金将用于 AI-native 可观测性、遥测数据基础设施和全球企业扩张。这是可信的后期增长用途，但仍不能替代现金余额、烧钱数字或量化 runway。


              公开可比公司为 Coralogix 若能高效扩张时「好」可以长什么样提供了正确镜头。Datadog 2025 财年收入为 $3.43 billion，non-GAAP operating margin 为
              22%，free cash flow 为 $915 million。Dynatrace 产生 $2.054 billion ARR，non-GAAP operating margin 为 29%，free
              cash flow 为 $529 million。Elastic 收入为 $1.483 billion，non-GAAP operating margin 为 15%，net expansion 约
              112%。Cisco 的 post-Splunk 披露显示，recurring 可观测性加安全收入进入更大平台后可以多有价值：软件收入达到 $22.3 billion，subscription revenue
              增长 15%，可观测性收入在 2025 财年增长 26%。这并不是说 Coralogix 现在就应像这些公司；而是公开市场最终奖励可观测性厂商的，是利润率、留存和现金转化，而不只是摄取增长。仅从公开事实看，一个
              $160 million 到 $220 million 的 revenue-run-rate 工作区间，意味着约 7x 到 10x 投后倍数；对增长资产来说可以辩护，但没有留存和毛利率证明时仍难承销。
