      - number: '5.4'
        title: Roadmap 动能与公开产品风险
        blocks:
          - type: paragraph
            body: >-
              最强 roadmap 证据来自 2026 年 release notes 和 2026 年 6 月融资叙事。Coralogix 并没有呈现一套静态可观测性套件：release notes 显示，公司在 trace
              drilldowns、release-centric health、memory 与 wall-clock profiling、RUM overview pages、AI Session correlation
              和 AI Guardrails 上快速推进。2026 年 6 月 funding page 又把下一轮开发周期框定在 AI-native 可观测性、schema-free
              遥测基础设施、长期留存和开放格式分析上。TechCrunch 补充了一个更面向市场的信号：管理层称，超过一半企业客户已经使用 Olly 或 custom AI integrations，新资本将加速 AI
              products、security offerings 和全球扩张。


              局限角度同样重要。公开证据能证明广度，但独立证明每个模块 best-in-class 的材料更薄。CubeAPM 的独立评论认为，Coralogix 在 cost-optimized log
              management、pipeline pricing 和 SIEM/CSPM 广度上最强，而其他厂商在 deep APM 上可能仍更强；AWS marketplace 反馈也提示，大查询性能和部署
              hygiene 在真实环境中仍重要。OTel 和 Helm 表面进一步意味着迁移和运营复杂度，尤其对从托管专有 agents 迁出的团队。实际读法是，Coralogix
              看起来是一套技术雄心强、移动很快的平台，但尽调仍应测试模块 attach rates、APM 深度、AI guardrail 准确性，以及非平凡 clusters 的真实迁移工作量。
