  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              评估 Coralogix 时，应看两个相邻类别的重叠区，而不是把它同所有基础设施或所有网络安全支出相比。第一类是可观测性：日志、指标、链路追踪、应用性能监控、故障排查，以及越来越多的 AI
              工作负载可见性。第二类是安全分析和 SIEM：安全事件的集中采集、关联、检测、调查和合规报告。这个边界很重要，因为广义云、数据库、端点和通用 IT
              运维预算，并不都能流向第三方平台厂商。分析师报告和产品页面的公开定义一贯把相关支出描述为遥测采集、查询、分析、检测和事件响应，而不是原始 IaaS 消耗或通用安全软件。


              现状替代方案也进一步收窄了边界。AWS CloudWatch、Azure Monitor 和 Google Cloud Operations 都把核心可观测性功能打包在各自云里；AWS Security Lake
              和 Microsoft Sentinel 则打包了越来越多安全数据管理和分析能力。Prometheus、Grafana、Loki
              等开源和准开源栈，让基础指标和日志无需单一商业全栈厂商也能获得。Datadog、Splunk、Elastic、Dynatrace 等第三方 incumbents 则承诺集成广度、更低遥测摩擦和更好的跨域工作流。对
              Coralogix 来说，可投资市场因此是这样一部分企业和中端市场买家：其遥测、治理或 SecOps 复杂度已经超出原生工具或点状工具默认能力。
