  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点和披露边界
        blocks:
          - type: paragraph
            body: >-
              Coralogix 的估值讨论，首先要处理一个比标题数字更重要的证据分裂。2025 年 6 月 Series E 显然是独角兽轮，但公开记录没有给出干净的投后估值。TechCrunch 报道称，Coralogix
              以超过 $1 billion 的投前估值融资 $115 million，并将这轮描述为全股权、全新股。分析师因此可以推断，最低投后估值略高于约 $1.115 billion；本章只为简写，将其四舍五入为约
              $1.12 billion。相比之下，2026 年 6 月 Series F 要干净得多。TechCrunch 报道投后估值 $1.6 billion，Coralogix 官方新闻稿披露融资 $200
              million、累计融资 $550 million，CTech 又补充称该轮不到 10% 是老股交易。公开收入披露仍不完整，但证据足以限定讨论边界。TechCrunch 称，Coralogix 在 2026 年
              6 月一年多前已超过 $100 million 年化收入，过去一年收入增长超过 60%；第 4 章已把这些事实转换为保守公开信息区间：约 $160 million 至 $220 million 的 ARR
              或收入运行率。CTech 也引用管理层称年收入运行率为 $150 million 至 $200 million。这些数据点不是审计财务，但足以说明 Coralogix
              并不是按未规模化工具供应商估值。在这个有限公开框架下，2026 年标记隐含的倍数既不明显鲁莽，也不明显便宜。更难的问题是公开证据仍无法回答什么：确切 ARR、毛利率、NRR、烧钱速度、现金跑道、客户集中度，以及
              $550 million 累计融资背后的优先股堆叠。
