      - number: '8.4'
        title: 建议、进入纪律和最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              正确结论不是 Coralogix 显然高估或显然便宜，而是当前估值只有在附带条件时才可投。2026 年 6 月融资不像救援轮。管理层告诉
              TechCrunch，本轮是为加速而非延长现金跑道；据报道老股交易部分很小，公司也有足够公开规模，值得严肃投资者关注。但缺失证据清单过于核心，不能忽略。新投资者仍不知道确切 ARR
              桥、NRR、GRR、毛利率、烧钱速度、现金跑道、集中度风险，或 $550 million 累计融资之下的清算堆叠。这些不是边角细节，而是决定 Coralogix
              是否值得优质私营倍数、还是只值得可敬成熟可观测性倍数的变量。因此，最干净的立场是观察 / 继续研究，中等信心、高风险，而不是买入。买入判断需要公司把讨论从故事质量推进到证据质量：证明当前运行率至少落在第 4
              章区间内，留存和利润率足够优质、能支撑 AI-native
              倍数，且股权结构表条款不会吃掉大部分未来上行。在那之前，进入纪律比欣赏更重要。投资逻辑不会因一篇新闻稿而破裂；如果估值支撑减弱的同时，经济性、股权结构表条款或 AI 货币化未能通过尽调，投资逻辑才会破裂。
