  - id: TV005
    title: Thesis 破裂与一票否决触发项表
    columns:
      - 触发项
      - 阈值或事件
      - 对 thesis 的传导
      - 行动含义
    rows:
      - - 收入质量失手
        - Data room 显示 run-rate 更接近 $125M-$150M，或 NRR 接近 100%。
        - 溢价案例坍塌，估值重新指向成熟同业倍数。
        - 重置到熊市区间，并要求更低进入价格。
      - - 毛利率令人失望
        - 毛利率明显低于高质量 infra-SaaS 常模，或 AI 推理成本吃掉扩张。
        - 削弱支付高于 New Relic / Sumo 风格可比公司价格的主要理由。
        - 在经济性改善前，下调牛市情景权重。
      - - 优先权堆栈悬空
        - 清算优先权、参与权或 seniority 实质削弱增量普通股上行。
        - 把公允的企业价值标记变成偏弱的股权回报结构。
        - 继续推进前，按完全摊薄、考虑优先权的口径建模回报。
      - - 增长叙事转弱
        - AI attach-rate 或企业扩张低于 2026 轮所暗示的故事。
        - 拿掉私有 AI-native 溢价论点。
        - 与其把公司当作 AI 基础设施赢家，不如按成熟可观测性资产处理。
      - - 披露仍停滞
        - 下一轮尽调周期中，管理层仍不提供 cohort 留存、集中度、cap table 和现金数据。
        - 标记仍停留在故事风险里，而不是证据支撑的承保。
        - 维持跟踪 / 继续研究，而不是买入当前轮叙事。
    notes: 每个触发项都可监测，并直接绑定估值支撑，而不是泛泛的运营风险。
