  - id: TP004
    title: 护城河耐久度 / 竞争风险清单
    columns:
      - 护城河主张或脆弱点
      - 支撑证据
      - 威胁
      - 严重性
      - 缓释措施 / 尽调要求
    rows:
      - - 基于 pipeline 的定价和自有云留存构成真实成本楔子
        - Coralogix unit、自有 S3 存储与远程查询不同于主机 / 索引模型
        - 竞争对手复制降价，或增加更便宜的归档层
        - 高
        - 要求提供客户 cohort 数据，证明留存成本驱动决策时的胜率
      - - 统一可观测性 + SIEM 后端减少工具切换
        - Cloud SIEM、检测与共享数据平面都在同一 Coralogix 平台
        - Splunk、Elastic 和 Sumo 仍是品牌更深的 SIEM 平台
        - 高
        - 测试安全买家是否会在没有单独传统 SIEM 的情况下采用 Coralogix
      - - 开放标准降低埋点锁定，同时保住后端价值
        - Coralogix、Elastic、Grafana 和 New Relic 都强调 OTel；Coralogix 还把数据留在客户云中
        - 偏好开放栈的买家可能选择 Grafana 或 Elastic，而非 Coralogix
        - 中
        - 当买家将开源路线替代品列入短名单时，衡量 Coralogix 的附加采购率
      - - 大型既有厂商渠道、采购与整合能力更强
        - Cisco 将 Splunk 放在更大的网络 / 安全 / 软件平台中定位；Datadog 和 Dynatrace 的企业销售动作更大
        - 即便产品经济性更好，Coralogix 也可能在 CIO / CISO 标准化层面输单
        - 严重
        - 收集一线证据，区分输单是采购标准化造成，还是产品缺口造成
      - - 独立评论证实，可观测性定价痛点真实存在
        - Uptrace 和 PeerSpot 暴露既有工具中的定价、授权与预算压力
        - 如果 Coralogix 无法证明生产环境净成本更低，其切入楔子就会退化为营销同质化
        - 高
        - 用遥测组合、留存和归档假设，搭建并排生产成本证明
      - - Coralogix 的成本叙事仍依赖有纪律的路由和遥测治理
        - CubeAPM 提醒，真实账单仍随数据组合、路由质量、留存和 S3 成本变化
        - 治理薄弱的客户可能拿不到承诺中的节省
        - 中
        - 索要成熟客户案例，证明六到十二个月后的节省，而不只是试点开始时
      - - 多平台并用在该市场仍然理性
        - 混合部署选项和开放标准降低全品类绝对切换成本
        - 客户保留二级归档、开放工具或既有 SIEM，压低钱包份额
        - 中
        - 按买家分层和工作负载量化替换率与共存率
    notes: 严重性是分析师判断，不是公司披露的 KPI。本清单关注 Coralogix 差异化的耐久度，而非泛化的品类风险。
