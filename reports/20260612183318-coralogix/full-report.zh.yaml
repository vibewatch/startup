      - number: '6.3'
        title: 交易动作、落地扩张和合作渠道
        blocks:
          - type: paragraph
            body: >-
              公开模式更像经典技术型落地后扩张，而不是自上而下的套件销售。多数案例研究从平台、DevOps 或基础设施团队开始，他们想替换自建 ELK、Graylog
              或碎片化工具组合。初始商业理由通常混合了降低支出、更容易访问归档、减少盲区和更好支持。扩张随后沿三条路径发生：更多 telemetry
              和更长留存；更多角色，例如开发者、支持团队、安全团队或业务用户；更多环境，例如客户托管银行基础设施、公有云或合规负担重的工作负载。公开渠道证据与此相互补充。Coralogix 的合作伙伴页面明确招募
              VAR、GSI、超大规模云厂商和云顾问，并强调 AWS Advanced Technology Partner 身份和 CPPO 支持。相比之下，Microsoft marketplace
              页面更像企业身份和部署管道，而不是主要需求生成渠道。缺失的是渠道结构：没有公开来源量化直接销售、超大规模云厂商 marketplace 或经销商各占订单额的比例。
