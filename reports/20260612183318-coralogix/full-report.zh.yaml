      - number: '4.4'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              证据支持这样一家企业：已有真实规模、差异化货币化叙事，并在 2026 年融资后显著改善资本充足性。Coralogix
              不是未经验证的可观测性初创公司：它有数千客户、七位数账户、企业招聘，以及一项公开说法，即一年多前已越过 $100 million annualized revenue
              门槛。架构故事也重要。客户自有存储和分层遥测路由，让 Coralogix 对类别中最大的结构性问题之一——成本反弹——给出一个可信答案。在 Elastic 称 97%
              组织遭遇成本意外、VendorBenchmark 称无控制时支出常会翻三倍、Practical Logix 称 AI 工作负载会让遥测预算螺旋上升的市场里，这具有战略价值。


              承销仍止于确信之前，因为最关键数字仍是私有。公开来源不给当前毛利率、GAAP revenue、booked ARR、NRR、GRR、CAC payback、烧钱、现金或 runway。即便第三方 profile
              数据库也陈旧到可能误导：Craft 仍显示累计融资 $96.2 million、2,000 客户，远低于更新的 2026 年披露。还有一个二阶私募市场风险。Crunchbase 2026 年 Q1
              数据显示，后期资本集中在非常大的 AI-linked 轮次，而 IPO 市场仍疲软；因此，如果增长放缓或盈利耗时长于预期，未来私募轮定价能力仍可能压缩。实际结论是，Coralogix
              看起来可融资且具战略相关性，但仅靠公开信息还不能完全承销。
