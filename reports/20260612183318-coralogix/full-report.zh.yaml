  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 货币化模型与收入质量
        blocks:
          - type: paragraph
            body: >-
              Coralogix 披露的标价细节比多数私营基础设施初创公司更多，但披露仍停在投资人通常会从定价架构切换到已实现经济性的那一步之前。公开 pricing 页面列出日志、链路追踪、指标和 AI tokens
              的使用价格，称所有支持和企业功能都包含在内，并明确避免座席上限、主机上限和分层。其机制是把使用量转换成单元，不同 pipelines 按不同费率转换遥测。这一点重要，因为 Coralogix
              的故事不是「按座席收费的 premium SaaS」，而是「遥测路由加客户自有存储」。同一页面称所有数据都落在客户自己的 S3 bucket 中，可无限留存并远程查询，只有一层短期热存储留在 Coralogix
              管理的基础设施中。


              这套架构在一个狭窄意义上改善了收入故事质量：它在标价与最可能随客户规模变化的成本驱动之间划出清晰界线。如果归档存储由客户自有，并在写入前高度压缩，Coralogix
              就能声称比经典热索引可观测性厂商有更低存储摩擦和更好的留存经济性。客户证据方向上支持这一点。Claroty 称 Coralogix 处理每日 3 TB 数据和 3,000 多个告警；Bank Jago
              称其每日摄取最高 20 TB，将 80% 日志和链路追踪存进低成本云存储，并在同一预算下实现更广覆盖。缺失的一块是已实现收入质量。公开材料没有披露折扣、committed-use 结构、booked
              ARR，或支出中真正 recurring 与 bursty usage 的比例。
