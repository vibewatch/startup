  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 锚定指标
      - 价值 / 市值
      - 隐含倍数
      - 相关性
      - 局限
    enumerationScope:
      coverage: sample
      basis: >-
        Rows cover the most decision-useful public, take-private, and private observability comparables available from
        direct accessible sources through 2026-06-12; they are not an exhaustive sector screen.
    rows:
      - - Datadog
        - FY25 收入 $3.43B；FY26 指引 $4.06B-$4.10B
        - $81.83B 市值
        - 约 23.9x FY25 收入；约 20x FY26 指引
        - 品类领导力和披露质量的公开市场溢价上限。
        - Datadog 规模更大、流动性更强，披露也远多于 Coralogix。
      - - Dynatrace
        - FY26 ARR $2.054B；收入 $2.018B
        - $11.87B 市值
        - 约 5.8x ARR / 收入
        - 适合用作耐久企业可观测性的均衡公开可比公司。
        - 比 Coralogix 更成熟、更盈利，增长更慢但披露好得多。
      - - Elastic
        - FY26 收入 $1.739B；NER 约 112%
        - $6.32B 市值
        - ~3.6x revenue
        - 即便是关键任务遥测 / 搜索软件，也显示了较低倍数的公开市场框架。
        - 不是纯可观测性可比公司，也有搜索 / 安全业务组合差异。
      - - Cisco / Splunk 交易
        - Splunk ARR $4.0B
        - $28B 股权价值
        - ~7.0x ARR
        - 规模化可观测性和安全数据资产的战略收购参照。
        - 战略 M&A 定价可能高估少数股权私有投资人应支付的价格。
      - - New Relic 私有化
        - FY23 收入 $925.6M
        - $6.5B 股权价值
        - ~7.0x revenue
        - 有已知毛利率的成熟私有化基准。
        - 发生在 AI 溢价之前，增长也低于 Coralogix。
      - - Sumo Logic 私有化
        - FY23 ARR $301.6M / 收入 $300.7M
        - $1.7B 股权价值
        - 约 5.6x ARR / 收入
        - 较小公开可观测性资产的低端私有化参照。
        - 反映的资产规模和溢价程度低于 Coralogix 追求的定位。
      - - Grafana Labs 私有轮
        - ARR >$250M；付费客户 >5,000 家
        - 私募估值 >$6B
        - '>24x ARR'
        - 领先可观测性平台的高端私有稀缺性可比。
        - Open-core 领导者，稀缺性极强，且有披露的 2024 年私有市场溢价。
    notes: 本表用于框定估值区间，并不假装私有轮、公开市值和战略交易可以直接互换。
