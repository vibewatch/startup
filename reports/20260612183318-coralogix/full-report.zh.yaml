          - type: paragraph
            body: >-
              具名证据真实存在，但质量不均。最强的案例给出了接近生产环境的细节：Claroty 描述了从 ELK 迁移的多年过程，覆盖 200 多名用户和 3,000 多条告警；Jago 给出每天 20TB 的规模和 216
              名活跃用户；Tradeweb 披露每天 130TB 的规模和 60% 的内部采用率；PUMA 把可观测性直接连到商业流程中的失败订单检测；10x Banking 则把 Coralogix
              定位为内部及客户托管银行环境里以 OpenTelemetry 为先的基座。这些证据明显强于简单 logo 提及，因为它们揭示了买方画像、用户群、工作流、迁移触发点和结果。不过，几乎所有丰富细节都来自
              Coralogix 发布的案例研究。独立侧要薄得多：TechCrunch 只给出少数新近具名账户，SiliconANGLE
              提供的是公共部门赞助语境，而不是完整生产引用。这种不对称很关键。平台显然有真实部署，但投资者不能把卖方精心整理的深度证据包，误当成广泛独立的留存证据。
