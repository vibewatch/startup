      - number: '1.2'
        title: 创始人、具名领导层与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人记录方向上很强，但并不完全一致。Coralogix 当前 About 页面称 Ariel Assaraf 为 CEO 兼联合创始人、Yoni Farin 为 CTO 兼联合创始人，Aleph 的
              portfolio 页面重复了这一组合。NewView 的 portfolio 页面也以 Assaraf 为中心，并把公司日期定在 2014 年。不过，Globes 将 Guy Kroupp 和 Lior
              Redlus 加入创始团队；本轮审阅的官方资料包和独立报道都不支持用户假设中 Lior Frenkel 是创始人的说法。更深层的不一致来自创立年份本身：官方和投资人页面常把 Coralogix 锚定在 2014
              年，而 Dun’s 100 和 CTech 称其创立于 2015 年。最稳妥的读法是，2014 年反映公司起源故事，2015 年则出现在一些 profile 型记录里，作为成立或规模化日期。

              联合创始人之外，领导层披露够用但不完整。About 页面公开列出 CRO Chetan Chaudhary、CHRO Yael Sapir-Zahavi、CFO Eran Hadad，以及 CMO 兼
              Strategic Partnerships 负责人 Brian Mullen。2024 年 12 月收购 Aporia 后，Liran Hason 和 Alon Gubkin 被引入领导 Coralogix
              AI；到 2025 年 3 月，Hason 已公开以 VP of AI 身份出现。仍披露不足的是治理。公开来源确认了与 NewView、Brighton Park、Aleph、Advent、CPPIB 和
              Greenfield 的投资人关系，但没有提供清晰的现任董事会名单、委员会结构或控制权摘要，因此关键人和投资人治理尽调仍然未关闭。
