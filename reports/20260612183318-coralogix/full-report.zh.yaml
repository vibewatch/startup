      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Coralogix 的买方地图是跨职能的，不是单线程。在可观测性侧，日常用户通常是平台工程、SRE、DevOps、应用团队或可观测性专家，他们需要日志、链路追踪和指标来排查生产系统。在安全侧，用户是 SOC
              分析师、检测工程师、事件响应人员和安全运营负责人，他们需要事件关联、调查上下文和可用于合规的报告。公开 vendor 页面越来越把这些动作混在一起：Azure Monitor 被呈现为 Microsoft
              Sentinel 和 Defender 工作流之下的数据平台；AWS 将 CloudWatch 与 Security Lake 绑定；Google 则组合 logging、monitoring、BigQuery
              驱动分析和托管 Prometheus。


              预算所有权通常在一线用户之上。大型企业似乎主导当前支出：Mordor 称大型企业在 2025 年占可观测性收入的 62.35%，SIEM 分层也强调 BFSI、政府、医疗、制造、IT
              和电信等垂直领域，这些领域本就有合规和 uptime 预算。实际销售中，这意味着 Coralogix 往往需要一个共享预算故事，跨越中央平台工程、CIO 或 CTO 组织，以及 CISO 或 SecOps
              负责人。中端市场 B2B 买家在运营上可能采用更快，但最大合同仍来自那些遥测量、云复杂度或合规负担足够高的组织；对它们来说，整合可观测性和安全工具能创造可见的经济与工作流 ROI。
