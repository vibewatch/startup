chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品、定价模型与运营足迹
        blocks:
          - type: paragraph
            body: >-
              Coralogix 现在把自己定位为跨栈可观测性平台，而不是狭义日志管理厂商。其官方 About、Pricing、AI Center 和 Olly 文档描述的是一个平台：覆盖日志、指标、链路追踪、安全可观测性和
              AI 可观测性，以实时流式分析、开放格式和客户自有存储作为架构主轴。对一家基础设施初创公司来说，它的定价模型异常明确：官方定价按单元、按使用量计费，公开日志、链路追踪、指标和 AI token
              费率，不设用户或主机上限，也没有正式价格档位。这在实质上支持用户提出的「pipeline-based pricing」假设，只是 Coralogix 的表述是把单元分配到数据管线，而不是传统按座席或主机授权。

              地理位置的公开图景比创立时间清楚得多。Coralogix 自有联系页面列出以色列办公室位于 Ramat Gan 的 21 Aba Hilel Street，美国办公室在 Boston 和 San
              Mateo；Craft 也独立将总部放在 Ramat Gan。因此，最有支撑的表述是：总部在以色列，并有重要美国存在，包括湾区办公室，而不是单独的 San Francisco 总部。公司还记录了
              London、Frankfurt 和 Gurugram 办公室；2026 年 6 月融资新闻稿称平台在包括 GovCloud 在内的八个区域运行，这对受监管企业和公共部门可信度很重要。
