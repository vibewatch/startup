  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 尽调路径
    rows:
      - - 当前 ARR 与桥接
        - 从 2025 轮到 2026 轮的月度 ARR 或收入桥。
        - 用来检验 $1.6B 现实中到底是 7x、10x，还是明显更高。
        - 索取董事会材料和月度管理层报告。
      - - 收入质量
        - NRR、GRR、按 cohort 划分的流失、客户集中度和七位数账户组合。
        - 决定 Coralogix 是否值得相对成熟可比公司的溢价倍数。
        - 索取 cohort deck 和头部客户分析。
      - - 毛利率与 AI 成本结构
        - 按产品划分的毛利率、云成本趋势和 AI 推理成本负担。
        - 区分耐久数据平台溢价和高成本 AI 叙事。
        - 审阅产品 P&L，以及按模块划分的云成本分摊。
      - - 资本结构
        - 2025 和 2026 轮之间的 cap table、优先权堆栈、二级交易分配和所有权变化。
        - 只有标题估值，无法告诉新投资人该标记背后实际对应的回报。
        - 获取融资文件和完全摊薄 cap table。
      - - 现金与 runway
        - 现金余额、月度 burn、下行情景 runway，以及 covenant 或贷款约束。
        - 检验管理层关于本轮是加速资本而非救援资本的说法。
        - 审阅资金桥、董事会批准计划和债务文件。
      - - AI 变现证明
        - AI attach-rate、AI 驱动的 upsell，以及 AI 功能改善留存或 ARPU 的客户证据。
        - 溢价案例高度依赖 AI-native 可观测性，而不只是传统日志。
        - 索取产品分析、attach-rate cohort 和参考客户访谈。
    notes: 这些要求很具体，因为估值争议的约束更多来自缺失的私有公司证据，而非市场背景。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV037
      - CV038
      - CV039
