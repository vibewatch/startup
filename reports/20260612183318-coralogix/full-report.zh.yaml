      - number: '7.3'
        title: 法务、披露、进入市场和融资风险
        blocks:
          - type: paragraph
            body: >-
              法务和融资图景可投，但在后期承保最关心的维度上仍不透明。Coralogix 的合同、隐私政策、DPA 和 TOMs 展示了一个可信的合规框架，覆盖 GDPR、CCPA、以色列隐私法、SCC、breach
              通知和年度审计；EU AI Act 和 DORA 材料也说明，当公司把 AI 和金融服务工作流卖进欧洲时，这项负担会继续扩大。仍然缺失的是公司层面的证明：它能让投资者衡量风险，而不只是描述风险。Coralogix
              仍是私营公司，公开材料不披露毛利率、烧钱速度、现金跑道、队列留存、客户集中度或最新一轮的清算优先权。TechCrunch 的 2026 年 6 月融资报道方向上很强——5,000 多个客户、600 多名员工、30
              个七位数客户、超过 60% 增长、$1.6 billion
              投后估值——但仍是经管理层中介的披露。这带来真实的市场进入集中度风险：公司似乎正更深进入大型企业和受监管账户，但公开来源无法说明增长是否跨队列多元化，还是越来越依赖相对少数的大额支出账户和 AI 驱动扩张叙事。
