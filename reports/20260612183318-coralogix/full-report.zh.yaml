  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 竞争压力和定价商品化
        blocks:
          - type: paragraph
            body: >-
              Coralogix
              的核心承保风险在于，成本控制故事之所以有吸引力，恰恰因为市场其他玩家已经教育买方：可观测性支出是需要优化的问题，不只是需要扩张的预算。Datadog、Splunk、Elastic、Dynatrace 和
              Microsoft 都在销售相邻的可观测性、日志和安全运营组合；AWS、Azure 和 Google
              则给云用量重的买方一个原生默认选项，在单独平台获批之前可能已经「够用」。Grafana、Loki、Prometheus 和 OpenTelemetry
              进一步降低了工程团队的理念锁定，尤其是那些想要模块化或部分自管 stack 的团队。因此，Coralogix 所在市场的替换周期往往由成本痛点触发，但同一个痛点也让预算对价格更敏感，并让 multi-homing
              保持理性。它公布的按 GB
              定价和无限用户包装，比许多竞争对手的菜单更容易解释；但它自己的价值主张仍取决于客户能否良好路由数据、能否忍受客户云存储复杂性，并判断统一可观测性加安全的价值高于拼接云原生或开源组件。也就是说，价格既是楔子，也是风险：如果
              incumbents 简化包装，或买方标准化到更便宜的原生工具，Coralogix 的护城河可能迅速收缩。
