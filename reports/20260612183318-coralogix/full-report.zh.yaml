      - number: '8.2'
        title: 公开、私营和私有化估值视角
        blocks:
          - type: paragraph
            body: >-
              相对估值是检验 Coralogix 最干净的方法，因为公司仍是私营，并且仍扣住那些能支撑更精确 DCF 式承保的质量指标。Datadog 是公开市场的高端天花板。它报告 2025 财年收入 $3.43
              billion、non-GAAP 经营利润率 22%、自由现金流 $915 million；CompaniesMarketCap 显示 2026 年 6 月市值约 $81.83 billion，意味着约
              23.9x 尾随收入，以及约 20x Datadog 2026 财年指引中点。Dynatrace 是更均衡的公开可观测性可比公司。它报告 $2.054 billion ARR、2026 财年收入 $2.018
              billion、non-GAAP 经营利润率 29%、自由现金流 $529 million；其 2026 年 6 月约 $11.87 billion 市值意味着约 5.8x ARR 或收入。Elastic
              更低。它报告 2026 财年收入 $1.739 billion、约 112% 净扩张和 37% Rule of 40，但 2026 年 6 月约 $6.32 billion 市值仅意味着约 3.6x 收入。M&A
              视角也有启发。Cisco 同意以约 $28 billion 收购 Splunk，Splunk 在交易过程中报告 $4.0 billion ARR，意味着约 7.0x ARR。New Relic 私有化以约
              $6.5 billion 完成，对应 2023 财年收入 $925.6 million，约 7.0x 收入。Sumo Logic 私有化以约 $1.7 billion 完成，对应约 $301 million
              收入和 ARR，约 5.6x。这些数字让 Coralogix 当前估值看起来高于成熟公开和私有化可观测性资产，但对后期私营成长公司并不异常。Grafana Labs 展示了区间另一端：估值超过 $6
              billion，ARR 超过 $250 million，付费客户超过 5,000 个，意味着超过 24x ARR。更广泛的 2026 年市场记录也符合这种分裂。Windsor Drake 把广义公开 SaaS
              估在约 6x 至 7x EV/revenue，第一四分位公司约 13x 至 14x；Acquiry 称非 AI SaaS 通常约 4x 至 7x ARR，AI-native SaaS 约 8x 至 15x
              ARR，若 NRR 超过 120% 还有进一步溢价。因此，Coralogix 处在成熟可观测性平均水平与稀缺私营类别领导者之间，决定当前标记公平还是偏高的，是隐藏质量指标，而不是叙事本身。
