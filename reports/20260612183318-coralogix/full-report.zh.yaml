      - number: '1.4'
        title: 里程碑、客户证明与负面信号
        blocks:
          - type: paragraph
            body: >-
              Coralogix 2024-2026 年里程碑序列显示，公司有意从经典可观测性转向 AI-native 运维工具。2024 年 12 月收购 Aporia，补上 AI guardrails 和可观测性；2025
              年 3 月推出 AI Center，正式形成专门的 AI 可观测性界面；2025 年 6 月推出 Olly，把公司推向自然语言和 agentic 工作流。到 2026 年 6 月，公司自有文档称 Olly
              已向每一个 Coralogix 客户开放，并可通过 UI、API 和 MCP 集成运行；这具有战略意义，因为它把可观测性数据变成 agent 可消费的底座，而不只是 dashboard 层。

              客户证明有意义，但主要来自公司发布。Coralogix 案例研究显示，Claroty 从 ELK 迁移后每日运行 3TB 数据和 3,000 多个 Coralogix 告警；Bank Jago 则提到每日
              20TB 摄取和 216 名活跃 Coralogix 用户。这些都是有用采用信号，但不能替代标准化的 gross retention 或 expansion
              指标。主要公开负面信号来自运营和产品侧，而非财务困境。Coralogix 状态页记录了 2026 年 6 月多起影响 EU1 和 EU2 的事故与维护窗口。独立评论总体仍偏正面，但 G2、TrustRadius
              和 PeerSpot 都反复出现关于页面加载、查询性能、重复日志、SSO 摩擦、UI 杂乱以及高级功能学习曲线的抱怨。这些信号并不否定 product-market
              fit，但确实说明，快速扩展宽平台会带来执行负担。
