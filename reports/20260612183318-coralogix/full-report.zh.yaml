      - number: '4.2'
        title: 牵引、GTM 动作与成本基础代理指标
        blocks:
          - type: paragraph
            body: >-
              最强的公开牵引信号不是 GAAP 收入数字，而是一组后期规模指标，更像企业可观测性厂商，而不是小众工具公司。Coralogix 官方 2026 年募资材料和 TechCrunch 都把客户数放在 5,000
              以上；TechCrunch 还称，公司在 2026 年 6 月一年多前就超过 $100 million annualized revenue，过去一年收入增长超过 60%，现在约有 30 个年支出超过 $1
              million 的客户。这些事实意味着业务已经远超早期 product-market fit，并且已经卖进相当规模的企业账户。不过，它们没有揭示增长有多少来自新
              logo、有多少来自扩张，也没有说明扣除云成本后的使用量画像是否具备吸引力。


              公开招聘提供第二层信号。Coralogix 正在 Ramat Gan 招 AI 工程、在以色列招 DevSecOps、在 Boston 招高级企业销售；career 页面称团队遍布 28
              个国家。美国企业销售领导岗位的 on-target earnings 为 $420,000 到 $500,000，这是一个直接线索，说明公司正在投入严肃的 field motion，而不只是依靠低接触
              product-led adoption。结合 TechCrunch 所称全球超过 600 名员工，这些信号指向一个庞大且仍在扩张的成本基础。一个透明的公开估计是，仅年度人力成本就已经在 $90 million
              到 $150 million 区间，尚未计入基础设施和其他 opex；但该估计仍由假设驱动，因为公开来源没有披露薪酬结构、股权激励或销售生产率。
