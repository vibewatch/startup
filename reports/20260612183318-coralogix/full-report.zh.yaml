      - number: '5.3'
        title: 信任、安全与可靠性姿态
        blocks:
          - type: paragraph
            body: >-
              Coralogix 的公开信任材料多于许多私营基础设施厂商，但细节最强的是控制和支持流程，而不是独立测量的服务质量。Technical and Organizational Measures
              页面列出年度第三方审计，包括 SOC 2 Type 2 和多项 ISO 标准，并补充 GDPR、CCPA、HIPAA、DORA、AI Act 和 PCI-DSS 等框架的 self-assessment
              覆盖。这为企业采购提供了有用的控制清单。同一页面也收窄了主张：客户仍需负责安全配置其发送内容，并在传输前处理敏感或受监管数据。这是重要限定，因为架构鼓励广泛遥测采集，如果 instrumentation
              不当，很容易包含 PII。


              运营上，Coralogix 发布了支持政策，承诺 24/7 intake 和五分钟响应目标，并对 business-critical incidents 持续 24x7
              处理；公司还运营公开状态页，记录维护和事故通知。产品也开放 Microsoft Entra single sign-on 和 AWS marketplace
              分发，这两点都影响企业部署。不过，公开记录仍未给出硬性的独立 SLA 历史、公开 error budget，或 AI Center、Fleet Management 等较新界面的模块级 uptime
              承诺。尽调上，信任故事足以进入 shortlist 考虑，但还不足以替代安全资料包、SLA redline 和客户 reference calls。
