              客户章节到这里需要更谨慎。公开留存可见度很差：已审阅材料中没有披露 NRR、GRR、logo
              流失、续约率、队列曲线或头部客户集中度表。正面一侧是，多名具名客户描述了有意义的使用年限或深度采用，评论平台也足够活跃，说明装机基础并不小。负面一侧是，轶事式使用年限不等于续约质量，评论平台本身也有偏差。G2、TrustRadius
