  - id: TI003
    title: 单位经济性表
    columns:
      - 指标
      - 公开数值 / 状态
      - 置信度
      - 重要性
      - 尽调要求
    rows:
      - - 年化收入下限
        - 公开信息下限约 160 USDm
        - 中等估计
        - 公开披露支持已有实质规模，但无法给出精确当前 ARR 数字
        - 索要 2025 年中至本月的月度 ARR 与 GAAP 收入桥表。
      - - 工作假设 ARR / 收入 run-rate 区间
        - ~160-220 USDm
        - 低估计
        - 估值含义需要这个框架，但仍基于模型
        - 索要董事会批准预算或最新预测，用以替代估计值。
      - - 七位数账户
        - 约 30 个客户年支出 >1 USDm
        - 中
        - 说明真实企业客户集中度，也可能意味着复杂的现场销售
        - 索要前 50 大客户 ARR 分布和扩张历史。
      - - 客户数
        - '>5,000，Jun 2026'
        - 高
        - 为 ACV 与落地扩张解读提供分母
        - 索要活跃付费账户、已流失账户，以及按分层划分的产品附加采购。
      - - 标题口径 ACV 代理值
        - 若用 5,000+ 客户除 run-rate 区间，平均约 32-44k
        - 低估计
        - 显示平均合同额可能掩盖高度偏斜的企业客户组合
        - 索要按 SMB、中端市场和企业客户划分的 ACV 分布。
      - - 毛利率
        - 未公开披露；存储架构为客户自有且经过压缩
        - 部分
        - 仅靠标价无法承销核心毛利路径
        - 索要 GAAP 与 non-GAAP 毛利率，以及 COGS 拆分。
      - - 净留存率（NRR）/ 总留存率（GRR）
        - 未公开披露
        - 不可得
        - 留存是检验用量耐久性和定价权的最重要单项指标
        - 索要按 cohort 划分的 NRR / GRR，以及七位数账户留存。
      - - 销售效率 / CAC 回收期
        - 只有公开招聘信号；没有量化 CAC 或回收期
        - 部分
        - 企业 GTM 可能高效，也可能因周期和 ramp 拉长而非常昂贵
        - 索要 CAC、回收期、配额达成率和 pipeline 转化。
      - - 人员成本基数
        - 基础设施和其他 opex 前，估计年化区间约 90-150 USDm
        - 低估计
        - 员工数是后期 SaaS 中最大的可控成本池之一
        - 索要按职能和地域划分的薪酬、SBC 与承包商支出。
      - - 成本控制价值主张
        - 客户自有存储和路由主张；Bank Jago 称 80% 归档放置缓解了成本压力
        - 中
        - 这是支持未来毛利韧性与客户 ROI 的最强公开论据
        - 索要按客户 cohort 划分的价格实现、存储组合和云成本转嫁。
    notes: 各行有意区分事实、部分公开信号和明确估计。空缺或估计行不是写作缺陷；它们反映的是私营公司披露边界。
