        - 中；托管平台配主机级 agent 采集
        - 低到中；平台覆盖云和本地可见性，但服务由 SaaS 主导
        - 高；公有云、联邦云和 BYOC 选项
        - 低；已审阅材料中由 SaaS 主导
        - 低；可观测性即服务模型
      - - 买方摩擦 / 复杂度
