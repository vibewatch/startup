      - number: '2.2'
        title: TAM / SAM / SOM 视角与相互矛盾的公开估计
        blocks:
          - type: paragraph
            body: >-
              headline 市场显然足够大，但公开记录不支持一个干净、精确的 TAM 数字。在可观测性上，Mordor Intelligence 估计 2026 年市场为 USD 3.35 billion，并在 2031
              年增至 USD 6.93 billion；Business Research Insights 则把 2026 年起点放在约 USD 4.35 billion，并给出到 2035 年 USD 16.97
              billion 的更长期路径。在 SIEM 上，The Business Research Company 将 2026 年规模放在 USD 6.25 billion，MarketsandMarkets 放在
              USD 8.39 billion，而 Splunk 自有教育页面引用的 2026 年数字更高，为 USD 11.3
              billion。这些差异并不小；它们反映了类别边界、服务处理方式，以及营销口径与分析师口径的不同。


              因此，对 Coralogix 最可辩护的宽口径 TAM 视角，不是单一数字，而是使用低、高分析师配对得到的 2026 年公开可观测性加 SIEM 合计区间，约 USD 9.6 billion 到 USD 12.7
              billion。即便这个区间，也可能高估 Coralogix 真正可服务市场，因为原生云套件、开源栈和单域点状工具会吸收大量更简单工作负载。更实际的 SAM
              应描述为：需要第三方、跨云、集成式可观测性加安全分析的企业和高端中端市场买家子集。公开来源没有干净隔离这个重叠区，因此任何数值型 SOM 都应在 Coralogix 特定 pipeline
              和细分转化数据可得之前，视为受证据约束。
