      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              多股力量正在同时扩张市场。分布式 cloud-native 系统继续产生更多遥测；AI agents 带来围绕 token
              消耗、延迟、漂移和可追溯性的新可观测性需求；网络安全团队在威胁和合规要求上升时，仍需要集中式分析。OpenTelemetry 在 2026 年毕业尤其重要，因为它降低 instrumentation
              锁定，让后端选择更可竞争；这通常会加速可观测性实践采用，同时迫使厂商在存储经济性、自动化和工作流深度上竞争，而不是只靠基础数据采集。对 Coralogix
              的战略后果是：市场增长真实存在，但差异化必须来自集成工作流和 cost-performance，而不是拥有封闭遥测格式。


              约束同样重要。工具蔓延仍普遍存在，团队想要整合；可观测性和 SIEM 买家都对误报、培训负担和按数据量定价敏感。Elastic 引用的一项从业者调查称，80% 的团队正在主动整合工具；学术和行业来源也把
              alert fatigue 描述为一个结构性问题，尤其在多个安全工具或嘈杂 SIEM 管线叠加时。原生云服务和开源栈也限制了第三方厂商现实可争夺的类别份额。估值上，这意味着 Coralogix
              应按其赢下复杂跨域工作负载的能力交易，而不是按完整 headline 市场交易。最大上行来自公司证明：集成可观测性加安全，比
              Datadog、Splunk、Elastic、云原生默认方案或开源组合更能同时降低遥测成本和运营噪音。
