        - Run-rate 约 $160M-$220M，增长保持健康，投资人愿为后期、带 AI 色彩的基础设施资产支付约 7x-10x。
        - $1.3B-$1.8B
        - 与今天可得的公开证据最一致。
        - 当前标记可以辩护，但并不明显便宜。
      - - 牛市
        - Run-rate 走向 $200M-$240M+，留存证明为溢价水平，AI attach 支撑 10x-13x 的私有市场定价。
        - $2.0B-$2.6B
        - 需要溢价级质量指标，而不只是溢价叙事。
        - 上行需要 Datadog 式质量信号或 Grafana 式稀缺性。
      - - 2025 速记背景
        - 2025 年标记按约 $100M-$125M run-rate 推算约 $1.12B。
        - ~$1.12B
        - 只适合作为历史定价背景。
        - 有助于说明标题估值上升，但隐含倍数未必扩张。
