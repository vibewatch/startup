        - 索要董事会在基准和下行情景下的 runway 模型。
      - - 资金用途
        - AI 原生可观测性、遥测数据基础设施和全球企业扩张
        - 高
        - 表明是增长投资，而非救援融资
        - 索要招聘计划、基础设施 capex / opex 计划和 AI 路线图预算。
      - - 人员成本基数估计
        - 基础设施和其他 opex 前，年化约 90-150 USDm
        - 低估计
        - 帮助判断扩张中现金可能多快被消耗
        - 索要按职能 / 地域划分的薪酬，以及计划招聘节奏。
      - - 下一轮触发因素
        - 可能是增长放缓、留存偏弱或毛利表现不及预期，而非即时流动性压力
        - 低推断
        - 如果增长质量指标转弱，私募市场杠杆会很快消退
        - 索要契约、优先权和内部计划中对盈利时间的假设。
    notes: 本表关注前瞻资本充足性，而不是重复每一轮历史融资。若只有管理层评论、没有资产负债表披露，则标为部分而非事实。
