      - number: '7.2'
        title: 产品、AI、可靠性和安全执行风险
        blocks:
          - type: paragraph
            body: >-
              下一层风险是执行。Coralogix 要求投资者和买方相信，一个平台可以同时处理日志、指标、traces、SIEM，以及快速推进的 AI 可观测性和 guardrails
              路线图，同时不牺牲基础质量。公开评论证据总体支持，但并不干净。G2、TrustRadius 和 PeerSpot 都反复暴露学习曲线、页面加载、重复日志、SSO 可见性、查询性能、dashboard
              灵活性和告警管理易用性上的摩擦。2026 年 6 月状态记录并不灾难性，但活跃到足以影响判断：EU2 归档查询失败、EU1 指标告警降级、Olly 域名维护和 RUM
              摄取问题都出现在同一个月。这些事件更重要，因为 Coralogix 同时承诺 24/7 支持、5 分钟响应时间和 AI-native 运营未来。信任文档在控制、加密、审计和 breach
              通知上扎实，但也把访问配置、API key 卫生和摄取前过滤 PII 等重要责任推回给客户。实际含义是，安全和合规故事足够企业级，能够支撑销售，但还不足以在尽调中抹掉共同责任、宕机或 AI 效果风险。
