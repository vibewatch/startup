      - number: '7.4'
        title: 区域敞口、组织压力和投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              以色列敞口应当被视为细致风险，而不是一句否决。乐观证据在官方宏观数据中可见：Israel Innovation Authority 描述了 2025 年产出和就业反弹，CNBC 和 Allianz 都提到
              2026 年增长预期具韧性，外国资本也没有从生态中消失。悲观证据同样真实。Ynet 报道称，以色列计划从 2026 年起在任一时点维持约 60,000 名预备役人员服役；Times of Israel
              则引用部分高科技雇主裁员 15% 至 20% 或更多，以及更早一波科技从业者离境。对 Coralogix
              来说，实际含义不是业务会被地理位置拖垮，而是连续性、招聘和面向客户的交付，需要比当前公开材料更明确的证明。公司还存在一个基础披露不一致：法律条款把主要营业地点锚定在 Ramat Gan，而 TechCrunch
              称其总部在 Boston。这个矛盾并非生死问题，但提醒投资者，即使简单公司描述也需要核对。投资逻辑因此不会被单一标题击穿；真正的破裂是，定价力度减弱的同时，事故、AI
              执行、战争相关劳动力压力和融资预期一起走错方向。
