        - 部署 OTel 采集器、映射元数据、按层路由数据
        - OpenTelemetry agent / cluster collector、DataPrime、Data Engine（采集与数据管线）
        - 用一套栈覆盖日志、指标、链路和 Kubernetes 事件
        - 采集器设计和密钥管理仍需要平台工程团队动手。
      - - 排查生产事故
        - 从告警切到链路、关联日志、性能剖析和运行时指标
        - APM、Trace Drilldown、Dependencies view、Continuous Profiling（性能分析模块）
        - 更快跨服务和 span 定位根因
        - 除评论和案例研究外，独立证明解决时间缩短的证据较少。
      - - 理解 Web 或移动端用户体验回退
        - 跟踪发布、回放、核心指标、网络请求和错误
        - RUM、Session Replay、Releases page、RUM Overview（前端体验模块）
        - 更好把部署版本与影响用户的回退关联起来
        - 公开证据没有显示 RUM 相对日志 / APM 核心的采用广度。
      - - 运行安全与合规监控
        - 摄取事件、套用检测、长期留存数据、查询归档
        - Cloud SIEM、AI Security、Infinite Retention、Remote Query（安全与留存模块）
        - 不按热层经济性存放长期调查数据
        - 检测质量和分析师工作流深度仍主要来自公司描述。
      - - 安全运营 AI 应用
        - 观测 prompt / response、运行评估、执行护栏
        - AI Center、Evaluation Engine、Guardrails、AI-SPM、Session Explorer（AI 观测模块）
        - 让幻觉、PII、prompt injection 等非错误型失败变得可见
        - 公开材料中没有独立基准验证护栏效果。
      - - 大规模标准化铺开采集器
        - 按元数据选择采集器，并远程推送配置变更
        - Fleet Management
        - 降低大规模 OTel 环境中的漂移
        - 需要启用 Supervisor 的 agent，并严格使用 Helm preset。
