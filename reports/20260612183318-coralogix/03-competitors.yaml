- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim or vulnerability
  - Supporting evidence
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Pipeline-based pricing and own-cloud retention are a real cost wedge
    - Coralogix units, own-S3 storage, and remote query differ from host/index models
    - Competitors copy price cuts or add cheaper archive tiers
    - High
    - Request customer cohort data showing win rates where retention costs drove the decision
  - - Unified observability + SIEM backend reduces tool hopping
    - Cloud SIEM, detections, and shared data plane are on the same Coralogix platform
    - Splunk, Elastic, and Sumo remain deeper branded SIEM platforms
    - High
    - Test whether security buyers adopt Coralogix without a separate incumbent SIEM
  - - Open standards reduce instrumentation lock-in while preserving backend value
    - Coralogix, Elastic, Grafana, and New Relic all emphasize OTel; Coralogix also keeps data in customer cloud
    - Open-stack buyers may choose Grafana or Elastic instead of Coralogix
    - Medium
    - Measure attach rates when buyers shortlist open-source-aligned alternatives
  - - Large incumbents have stronger channel, procurement, and consolidation power
    - Cisco positions Splunk as part of a broader network/security/software platform; Datadog and Dynatrace have larger enterprise motions
    - Coralogix loses at CIO/CISO standardization level even if product economics are better
    - Critical
    - Collect field evidence on deal losses caused by procurement standardization rather than product gaps
  - - Independent critiques confirm that observability pricing pain is real
    - Uptrace and PeerSpot surface pricing, licensing, and budget pressure across incumbent tools
    - If Coralogix cannot prove lower net cost in production, its wedge collapses into marketing parity
    - High
    - Build side-by-side production cost proofs with telemetry mix, retention, and archive assumptions
  - - Coralogix cost story still depends on disciplined routing and telemetry governance
    - CubeAPM warns real bills still vary with data mix, routing quality, retention, and S3 costs
    - Poorly governed customers may not realize the promised savings
    - Medium
    - Ask for mature-customer examples showing savings after six to twelve months, not just at pilot start
  - - Multi-homing remains rational in this market
    - Hybrid deployment options and open standards lower absolute switching costs across the category
    - Customers keep secondary archives, open tools, or incumbent SIEMs, muting wallet share
    - Medium
    - Quantify replacement versus coexistence rates by buyer segment and workload
  notes: Severity is an analyst judgment, not a company-reported KPI. The register focuses on durability of Coralogix’s differentiation rather than generic category risks.
