  rows:
  - - Coralogix
    - Reference platform
    - Private vendor; platform page highlights 3M+ events/sec across 500K+ applications worldwide
    - Growth-stage through enterprise teams unifying observability and security telemetry
    - Pipeline-based pricing, own-cloud storage, infinite retention, SIEM on same backend
    - Smaller field motion and public-company proof points than Cisco/Splunk, Datadog, Dynatrace, or Elastic
  - - Datadog
    - Direct incumbent
    - Public SaaS incumbent with broad product menu and 1,000+ integrations visible on pricing pages
    - Enterprise and upper-mid-market cloud teams wanting one SaaS control plane
    - Strong full-stack coverage and integrated security in one SaaS experience
    - Layered host + ingest + indexing + routing pricing can expand quickly at scale
  - - Splunk / Cisco
    - Security-led incumbent
    - Backed by Cisco after a roughly $28B acquisition and paired with Cisco channel and platform breadth
    - Large enterprises prioritizing SIEM depth, hybrid deployment, and vendor consolidation
    - Deep SIEM / UEBA / SOAR story with cloud, private-cloud, and on-prem support
    - Commercial model remains more menu-driven and procurement-heavy than Coralogix
  - - Elastic
    - Open flexible rival
    - Public platform vendor with hosted, serverless, and self-managed deployment choices
    - Log-heavy, security-conscious, or sovereign-deployment buyers
    - OTel-first observability plus compute-and-storage-based security economics
    - Operating Elastic well can demand more in-house expertise than a pure SaaS tool
  - - Dynatrace
    - AI-operations incumbent
    - Public enterprise platform with Grail, Smartscape, and OneAgent-led collection
    - Large enterprises valuing automated root-cause analysis and runtime context
    - Deep causal topology and built-in security/observability correlation
    - Host- and memory-based pricing plus proprietary collection create migration friction
  - - New Relic
    - Usage-based observability rival
    - Private since the $6.5B Francisco Partners / TPG acquisition
    - Engineering teams seeking usage-based observability without host counting
    - 100 GB free ingest, unlimited hosts, broad platform and OTel ingest
    - Reviewed materials remain observability-led rather than SIEM-led
  - - Grafana Labs
    - Open-stack alternative
    - Open-source-aligned vendor with free, usage, enterprise, and BYOC deployment paths
    - Teams that value composability, OTel, and avoidance of lock-in
    - OpenTelemetry-native, no-lock-in message, BYOC/public/federal cloud options
    - More modular stack and less explicit SIEM depth than security-led vendors
  - - Sumo Logic
    - Log/SIEM specialist
    - Pricing page cites more than 2,500 customers globally
    - Cloud SIEM and log analytics buyers wanting unlimited users and predictable packaging
    - Explicit Cloud SIEM depth with 900+ rules, UEBA, threat intel, and SOAR hooks
    - Cloud/SaaS-led posture is less differentiated on sovereign deployment
  - - Logz.io
    - Cost-focused adjacent rival
    - Cloud-native observability vendor emphasizing AWS-native microservices and data optimization
    - Teams optimizing telemetry cost in cloud-native stacks
    - Consumption model across logs, metrics, traces, and SIEM plus cost-control tooling
    - SaaS-only deployment and smaller enterprise distribution than top incumbents
