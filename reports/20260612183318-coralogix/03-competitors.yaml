- id: FP003
  title: Coralogix moat / vulnerability scorecard
  type: kpi
  layout: compact
  summary: Compact ordinal view of the dimensions most likely to determine whether Coralogix holds share against incumbents and open alternatives.
  data:
    items:
    - label: Pricing architecture advantage
      value: 8
      unit: /10
      note: Pipeline-weighted units and own-cloud retention are meaningfully different from host-, seat-, and index-first rivals.
    - label: Deployment sovereignty
      value: 9
      unit: /10
      note: Customer-cloud storage and remote archive query are unusually strong in this peer set.
    - label: Observability breadth
      value: 7
      unit: /10
      note: Coralogix covers core signals, but the largest incumbents already match broad observability checklists.
    - label: SIEM credibility
      value: 7
      unit: /10
      note: Cloud SIEM is real, but Splunk, Elastic, and Sumo remain deeper branded security references.
    - label: Incumbent distribution pressure
      value: 9
      unit: /10 risk
      note: Cisco/Splunk, Datadog, and Dynatrace have stronger field reach and consolidation pull.
    - label: Open-stack substitution risk
      value: 7
      unit: /10 risk
      note: Grafana and Elastic can answer the no-lock-in story for buyers who value sovereignty first.
    - label: Net-price transparency
      value: 5
      unit: /10
      note: List architecture is clear, but public realized enterprise discount and win-loss data remain sparse.
  approximationNotes: Scores are analyst-derived ordinal judgments based on reviewed public evidence; they are not reported company KPIs.
