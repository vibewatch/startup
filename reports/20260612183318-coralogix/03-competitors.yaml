- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor
  - List-price anchor / model
  - Meter
  - Included capabilities / packaging
  - Deployment model
  - Implication
  rows:
  - - Coralogix
    - $1.50 per unit across pipeline-weighted usage
    - Units convertible across frequent-search, monitoring, and archive-oriented use cases
    - Logs, metrics, traces, SIEM, and enterprise controls inside the same commercial frame
    - Customer-cloud storage with remote query
    - Most differentiated against host-, seat-, or index-first rivals when retention is high
  - - Datadog
    - $15-$23 per host/month for infrastructure tiers plus separate log charges
    - Hosts, ingested GB, indexed events, stored events, outbound routing, and other modules
    - Broad SaaS catalog, but commercial model stays modular
    - SaaS-led with archive integrations
    - Budgeting can become multi-line-item and usage governance heavy
  - - Splunk / Cisco
    - Custom pricing across workload, ingest, entity, and activity models
    - Workload types, GB ingest, hosts, MTS, traces per minute, sessions, uptime requests
    - Security, observability, and platform pricing share a broad menu
    - Cloud, private cloud, on-prem
    - Flexible but complex; usually strongest for large incumbent-led accounts
  - - Elastic
    - Hosted resource-based; serverless usage-based; self-managed license-based
    - Resources, usage, or nodes/RAM depending on deployment mode
    - Observability and security can run on one Elasticsearch base
    - Hosted, serverless, self-managed, sovereign variants
    - Strong fit where deployment control matters as much as headline price
  - - Dynatrace
    - $7 host foundation, $29 host infrastructure, $58 per 8 GiB host full-stack; logs split separately
    - Hosts, memory-GiB-hours, pod/session units, GiB ingest/retain/query
    - Grail and Smartscape included, but pricing still varies by data and runtime shape
    - Managed platform with agent-led deep collection
    - Automation depth is strong, but price logic is still closer to incumbent APM economics
  - - New Relic
    - 100 GB free ingest; $0.40/GB beyond; $49 core user; $349 Pro full-platform user annually
    - Users plus data ingest, or compute plus data ingest
    - Unlimited hosts at no extra charge; compute model can remove user fees
    - SaaS platform with cloud and on-prem visibility
    - Easier to position against host-based vendors, less explicit on SIEM depth
  - - Grafana Labs
    - $19/month + usage; enterprise from $25,000/year; metrics from $6.50 per 1k series; logs process/write/retain fees
    - Series, GB processed/written/retained, enterprise commit
    - OpenTelemetry-native stack with Adaptive Telemetry and no-lock-in message
    - Cloud, public/federal cloud, BYOC, OSS/enterprise paths
    - Most compelling where openness and composability outweigh desire for single-vendor simplicity
  - - Sumo Logic
    - Package pricing via Sumo Credit tiers, Flex, and SIEM ingest options
    - Credits, ingest profile, retention profile, search billed separately in Flex
    - Unlimited users, Cloud SIEM, UEBA, and optional SOAR depth
    - SaaS / cloud-led
    - Strong for log/SIEM buyers; less differentiated on sovereign deployment
  - - Logz.io
    - Consumption-based pricing across logs, metrics, traces, SIEM, and AI usage
    - GB, retention, unique metrics, spans, tokens / invocations for AI features
    - Capacity can be reallocated across products on annual plans
    - Observability-as-a-service / SaaS
    - Closest adjacent story to Coralogix on cost control, but without the same customer-cloud-storage narrative
  notes: This table uses public list prices or stated meter types only; it does not imply realized enterprise net pricing, discount bands, or total contract value, which remain a diligence gap across most vendors.
