  - type: private-evidence-only
    severity: material
    topic: net-enterprise-pricing
    missingEvidence: Realized enterprise discount bands, average annual commitments, and effective blended net prices for Coralogix and major competitors.
    whyItMatters: List-price architecture explains competitive posture, but underwriting a pricing moat requires understanding what large customers actually pay after negotiation.
    diligencePath: Request anonymized recent quotes or renewal data for Coralogix, Datadog, Splunk, Elastic, Dynatrace, and New Relic across matched telemetry profiles.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: multi-homing-and-replacement-rates
    missingEvidence: Cohort-level data showing how often Coralogix fully replaces incumbent observability or SIEM vendors versus coexisting beside them.
    whyItMatters: Switching-cost durability and wallet-share potential depend on whether Coralogix becomes the system of record or only one more analytics layer in a multi-tool stack.
    diligencePath: Ask management for win-loss notes, top-20 account tool maps, and renewal cohorts broken out by replace-versus-coexist landing pattern.
