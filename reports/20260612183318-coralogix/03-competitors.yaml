- id: FP001
  title: Competitive positioning by pricing sovereignty and enterprise breadth
  type: quadrant
  layout: standard
  summary: Ordinal map of Coralogix and key alternatives on customer-controlled economics versus breadth and distribution power.
  data:
    xAxis: Pricing sovereignty / deployment control (1 = vendor-controlled SaaS and multi-part billing, 10 = own-cloud or open deployment with strong cost control)
    yAxis: Suite breadth + enterprise distribution (1 = niche or adjacent offering, 10 = broad incumbent with strong enterprise reach)
    points:
    - label: Coralogix
      x: 9
      y: 6
      detail: Own-cloud storage and pipeline pricing create strong sovereignty, but field reach is smaller than the largest incumbents.
    - label: Datadog
      x: 4
      y: 9
      detail: Very broad SaaS platform with strong distribution, but layered pricing and SaaS control reduce sovereignty.
    - label: Splunk / Cisco
      x: 6
      y: 10
      detail: Hybrid deployment and massive incumbent reach after the Cisco combination.
    - label: Elastic
      x: 9
      y: 8
      detail: Very high deployment flexibility with strong observability and security breadth.
    - label: Dynatrace
      x: 5
      y: 8
      detail: Deep enterprise breadth and automation, but more committed platform economics.
    - label: New Relic
      x: 7
      y: 7
      detail: Usage-based economics and OTel support help flexibility, though the platform remains SaaS-led.
    - label: Grafana Labs
      x: 10
      y: 6
      detail: Open and BYOC-friendly with strong no-lock-in posture, but narrower native SIEM weight.
    - label: Sumo Logic
      x: 4
      y: 6
      detail: SIEM depth and unlimited-user packaging offset a more SaaS-centered deployment story.
    - label: Logz.io
      x: 5
      y: 5
      detail: Consumption-based cloud observability with cost tooling, but less sovereign storage control than Coralogix.
