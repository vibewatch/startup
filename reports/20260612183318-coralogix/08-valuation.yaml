tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - Track / research-more, not buy at the current mark.
        - Valuation support exists, but disclosure quality is still too weak for conviction underwriting.
      - - Valuation stance
        - Fair only under the base case; stretched if quality metrics lag.
        - Do not treat the $1.6B headline as self-validating.
      - - Confidence
        - Medium
        - Round facts are clear, but revenue quality and cap-table terms are still private.
      - - Risk rating
        - High
        - A modest miss on growth, margin, or retention could compress the multiple toward mature-peer levels.
      - - 2025 anchor
        - Around $1.12B is a shorthand estimate, not a disclosed post-money fact.
        - Do not over-read the 2025 unicorn badge as precision valuation evidence.
      - - 2026 anchor
        - $1.6B post-money is the first hard disclosed valuation point in the current cycle.
        - Use it as the main mark, then test it against comp and scenario lenses.
      - - Upgrade trigger
        - Data-room proof of strong NRR, healthy gross margin, and benign preference terms.
        - Could support a premium multiple closer to private AI-native leaders.
      - - Downgrade trigger
        - Run-rate near the low end, weaker retention, or investor terms that subordinate new common-like returns.
        - Would push the case toward the bear band below roughly $1.2B.
    notes: This summary is explicitly price-sensitive and evidence-sensitive rather than a general company-quality score.
