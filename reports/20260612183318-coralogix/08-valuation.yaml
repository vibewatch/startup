  - id: public-private-and-take-private-lenses
    title: Public, private, and take-private valuation lenses
    body: >-
      Relative valuation is the cleanest way to test Coralogix because the company
      is private and still withholds the quality metrics that would support a tighter
      DCF-style underwrite. Datadog is the premium public ceiling. It reported $3.43
      billion of fiscal 2025 revenue, 22% non-GAAP operating margin, and $915 million
      of free cash flow; CompaniesMarketCap showed about $81.83 billion of market
      cap in June 2026, which implies roughly 23.9x trailing revenue and about 20x
      Datadog's fiscal 2026 guide midpoint. Dynatrace is the more balanced public
      observability comp. It reported $2.054 billion of ARR, $2.018 billion of fiscal
      2026 revenue, 29% non-GAAP operating margin, and $529 million of free cash
      flow; its June 2026 market cap of about $11.87 billion implies roughly 5.8x
      ARR or revenue. Elastic sits lower. It reported $1.739 billion of fiscal 2026
      revenue, about 112% net expansion, and a 37% Rule of 40, but its June 2026
      market cap of about $6.32 billion implies only about 3.6x revenue. The M&A
      lens is also instructive. Cisco agreed to buy Splunk for about $28 billion,
      and Splunk reported $4.0 billion of ARR during the deal process, implying about
      7.0x ARR. New Relic's take-private closed at about $6.5 billion against $925.6
      million of fiscal 2023 revenue, or about 7.0x revenue. Sumo Logic's take-private
      closed at about $1.7 billion against about $301 million of revenue and ARR,
      or about 5.6x. Those numbers make Coralogix's current mark look richer than
      mature public and take-private observability assets, but not anomalous for
      a late-stage private growth company. Grafana Labs shows the opposite end of
      the range: more than $6 billion of valuation on more than $250 million of ARR
      and more than 5,000 paying customers, or more than 24x ARR. Broader 2026 market
      notes are consistent with that split. Windsor Drake put broad public SaaS around
      6x to 7x EV/revenue with top-quartile names at roughly 13x to 14x, while Acquiry
      said non-AI SaaS commonly traded around 4x to 7x ARR and AI-native SaaS around
      8x to 15x ARR, with a further premium for 120%+ NRR. Coralogix therefore sits
      between mature observability averages and scarce private-category leaders, which
      means hidden quality metrics—not the narrative alone—decide whether the current
      mark is fair or stretched.
