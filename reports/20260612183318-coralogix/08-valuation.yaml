  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Anchor metric(s)
      - Value / market cap
      - Implied multiple
      - Relevance
      - Limitation
    enumerationScope:
      coverage: sample
      basis: Rows cover the most decision-useful public, take-private, and private observability comparables available from direct accessible sources through 2026-06-12; they are not an exhaustive sector screen.
    rows:
      - - Datadog
        - FY25 revenue $3.43B; FY26 guide $4.06B-$4.10B
        - $81.83B market cap
        - ~23.9x FY25 revenue; ~20x FY26 guide
        - Premium public upper bound for category leadership and disclosure quality.
        - Datadog is larger, more liquid, and far more disclosed than Coralogix.
      - - Dynatrace
        - FY26 ARR $2.054B; revenue $2.018B
        - $11.87B market cap
        - ~5.8x ARR / revenue
        - Useful balanced public comp for durable enterprise observability.
        - More mature and profitable than Coralogix, with slower growth but much better disclosure.
      - - Elastic
        - FY26 revenue $1.739B; NER ~112%
        - $6.32B market cap
        - ~3.6x revenue
        - Shows lower-multiple public framing even for mission-critical telemetry/search software.
        - Not a pure-play observability comp and carries search/security mix differences.
      - - Cisco / Splunk deal
        - Splunk ARR $4.0B
        - $28B equity value
        - ~7.0x ARR
        - Strategic takeout reference for scaled observability and security data assets.
        - Strategic M&A pricing can overstate what a minority private investor should pay.
      - - New Relic take-private
        - FY23 revenue $925.6M
        - $6.5B equity value
        - ~7.0x revenue
        - Useful mature take-private benchmark with known gross margin.
        - Pre-AI-premium and lower growth than Coralogix.
      - - Sumo Logic take-private
        - FY23 ARR $301.6M / revenue $300.7M
        - $1.7B equity value
        - ~5.6x ARR / revenue
        - Lower-end take-private reference for a smaller public observability asset.
        - Reflects a less scaled and less premium asset than Coralogix aspires to be.
      - - Grafana Labs private round
        - ARR >$250M; >5,000 paying customers
        - ">$6B private valuation"
        - ">24x ARR"
        - Upper-end private scarcity comp for a leading observability platform.
        - Open-core leader with exceptional scarcity and a disclosed 2024 private premium.
    notes: This table is meant to bracket valuation, not to pretend private rounds, public market caps, and strategic transactions are directly interchangeable.
