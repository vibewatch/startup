  - id: scenario-underwriting-and-downside
    title: Scenario underwriting, upside, and downside
    body: >-
      The scenario debate is mostly a quality debate rather than a pure growth debate.
      The bull case says Coralogix's more than 60% growth, 5,000-plus customer scale,
      AI-native positioning, and customer-controlled storage architecture justify
      a multiple closer to the private AI-native range than to the mature observability
      range. Under that lens, a run-rate moving toward $200 million to $240 million
      plus strong retention and healthy gross margins can support roughly $2.0 billion
      to $2.6 billion. The base case is less heroic and more consistent with the
      public record: if chapter 4's $160 million to $220 million estimate is directionally
      right and the company deserves roughly 7x to 10x because it is still growing
      faster than mature peers, a valuation around $1.3 billion to $1.8 billion
      cleanly brackets the current $1.6 billion mark. The bear case deserves explicit
      weight because hot AI rounds often hide the easiest failure mode, which is
      not collapse in demand but collapse in quality-adjusted multiple. If the true
      run-rate is nearer $125 million to $150 million, if AI expansion is still mostly
      narrative, or if gross margin and NRR look ordinary rather than premium, the
      market can rationally rerate Coralogix toward the mid-single-digit multiples
      paid for New Relic, Sumo, or even Dynatrace-like public exposure. That is how
      a strategically relevant company can still be a weak entry at the wrong price.
      The best defense of the current mark is that it does not require Datadog-like
      heroics to be defensible. The best bearish argument is that it still asks investors
      to pay above mature comp levels before public evidence proves premium-quality
      economics or benign cap-table terms. That asymmetry argues for disciplined
      sizing and diligence rather than enthusiasm.
