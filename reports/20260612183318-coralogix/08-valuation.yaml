  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: 2025 and 2026 exact round terms
      missingEvidence: The exact 2025 post-money, full cap table, liquidation preferences, participation rights, and ownership changes across the 2025 and 2026 rounds.
      whyItMatters: A headline enterprise mark can still produce weak incremental investor returns if the stack is senior or heavily dilutive.
      diligencePath: Obtain financing documents, investor rights agreements, and a fully diluted cap-table model from management or counsel.
      relatedQuestionRefs: [QV029, QV031]
      relatedTableRefs: [TV001, TV006]
    - type: private-evidence-only
      severity: blocking
      topic: current revenue quality
      missingEvidence: Current ARR or revenue bridge, NRR, GRR, gross margin, and cohort-level concentration by customer size.
      whyItMatters: Those are the metrics that determine whether Coralogix deserves a premium multiple closer to Datadog or a mature-comp multiple closer to New Relic or Sumo.
      diligencePath: Request the latest board pack, cohort model, product P&L, and top-customer concentration analysis.
      relatedQuestionRefs: [QV025, QV026, QV033]
      relatedTableRefs: [TV003, TV006]
    - type: enumeration-incomplete
      severity: material
      topic: comparable valuation table directional only
      missingEvidence: Private secondary marks, the exact June 2026 round deck, and a broader screen of international private observability rounds that could refine the comparable set.
      whyItMatters: Without those inputs, the comp table is useful for bracketing but not exhaustive enough to claim a precise sector-clearing multiple.
      diligencePath: Broaden the comp set with banker materials, secondary market indications, and direct round documents after management access is granted.
      relatedQuestionRefs: [QV019]
      relatedTableRefs: [TV004]
    - type: missing-source
      severity: material
      topic: exit readiness
      missingEvidence: A management view on exit timing, public-company readiness metrics, and any formal strategic interest or secondary liquidity discussions.
      whyItMatters: Exit path matters because the current mark may only work if the company can raise again or sell strategically before public-market discipline fully applies.
      diligencePath: Ask management for IPO-readiness workstreams, banker outreach history, and any strategic inbound summary.
      relatedQuestionRefs: [QV028]
      relatedTableRefs: [TV001]