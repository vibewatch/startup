  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation range (USD billions)
      - Probability signal
      - Key risk or upside transmission
    rows:
      - - Bear
        - Run-rate only $125M-$150M, growth decelerates materially, and market pays 5x-7x like mature or reset observability assets.
        - $0.8B-$1.2B
        - Real if retention, gross margin, or AI monetization disappoint.
        - Compression toward Dynatrace / New Relic / Sumo style multiples.
      - - Base
        - Run-rate roughly $160M-$220M, growth remains healthy, and investors pay about 7x-10x for a late-stage AI-tinged infrastructure asset.
        - $1.3B-$1.8B
        - Most consistent with the public evidence available today.
        - Current mark is defendable but not obviously cheap.
      - - Bull
        - Run-rate moves toward $200M-$240M+, retention proves premium, and AI attach supports 10x-13x private-style pricing.
        - $2.0B-$2.6B
        - Requires premium-quality metrics, not just premium narrative.
        - Upside needs Datadog-like quality signals or Grafana-like scarcity.
      - - 2025 shorthand context
        - 2025 mark inferred around $1.12B on roughly $100M-$125M run-rate.
        - ~$1.12B
        - Useful only as historical pricing context.
        - Helps show that the headline valuation rose while the implied multiple may not have expanded.
    notes: Scenario math is directional because private ARR is undisclosed and mixes public evidence with explicit assumption sets.
