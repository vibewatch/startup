  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue-quality miss
        - Data room shows run-rate closer to $125M-$150M or NRR near 100%.
        - Collapses the premium case and points back toward mature-peer multiples.
        - Rebase toward the bear band and demand a lower entry price.
      - - Gross-margin disappointment
        - Gross margin is materially below high-quality infra-SaaS norms or AI inference cost absorbs expansion.
        - Undercuts the main reason to pay above New Relic / Sumo style comps.
        - Cut bull-case weight until economics improve.
      - - Preference-stack overhang
        - Liquidation preferences, participation rights, or seniority materially reduce incremental common upside.
        - Turns a fair enterprise mark into a weak equity-return setup.
        - Model returns on a fully diluted, preference-aware basis before proceeding.
      - - Growth narrative weakens
        - AI attach-rate or enterprise expansion slows below the story implied by the 2026 round.
        - Removes the private AI-native premium argument.
        - Treat the company more like a mature observability asset than an AI infrastructure winner.
      - - Disclosure remains stalled
        - Management still withholds cohort retention, concentration, cap table, and cash data in the next diligence cycle.
        - Keeps the mark in story risk rather than evidence-backed underwriting.
        - Maintain track / research-more instead of buying the current round narrative.
    notes: Each trigger is monitorable and tied directly to valuation support rather than generic operating risk.
    claimRefs:
      - CV032
      - CV035
      - CV036
      - CV038
      - CV039
      - CV041
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Current ARR and bridge
        - Monthly ARR or revenue bridge from the 2025 round to the 2026 round.
        - Needed to test whether $1.6B is 7x, 10x, or materially higher in reality.
        - Request board package and monthly management reporting.
      - - Revenue quality
        - NRR, GRR, churn by cohort, customer concentration, and seven-figure account mix.
        - Determines whether Coralogix deserves a premium multiple over mature comps.
        - Request cohort deck and top-customer analysis.
      - - Gross margin and AI cost structure
        - Gross margin by product, cloud cost trend, and AI inference cost burden.
        - Separates a durable data-platform premium from a costly AI narrative.
        - Review product P&L and cloud cost allocation by module.
      - - Capital structure
        - Cap table, preference stack, secondary allocation, and ownership changes across the 2025 and 2026 rounds.
        - Headline valuation alone cannot tell a new investor what return actually sits behind the mark.
        - Obtain financing documents and a fully diluted cap table.
      - - Cash and runway
        - Cash balance, monthly burn, downside runway, and covenant or facility constraints.
        - Tests management's claim that the round was acceleration capital rather than rescue capital.
        - Review treasury bridge, board-approved plan, and debt documents.
      - - AI monetization proof
        - AI attach-rate, AI-driven upsell, and customer proof that AI features improve retention or ARPU.
        - The premium case leans heavily on AI-native observability rather than legacy logging alone.
        - Request product analytics, attach-rate cohorts, and reference calls.
    notes: These asks are concrete because the valuation debate is constrained less by market context than by missing private-company evidence.
