    - Need independent benchmark on query speed and false-positive reduction versus peers.
  - - Infrastructure monitoring
    - Platform / infra engineer
    - Core and broad
    - Unified host-container-cluster view plus Kubernetes relationship mapping
    - Need proof of depth outside Kubernetes-heavy cloud-native estates.
  - - APM / tracing
    - Application / SRE team
    - Mature and expanding
    - 100% OpenTelemetry posture, service catalog, database monitoring, continuous profiling, serverless APM
    - Need independent proof that trace analysis depth matches top-tier APM vendors.
  - - RUM
    - Frontend / product engineering
    - Mature and expanding
    - Session replay, Core Web Vitals, network monitoring, release/version views, mobile/web coverage
    - Need attach-rate data and customer evidence beyond official pages.
  - - Cloud SIEM / security
    - SecOps / detection engineering
    - Broad but company-led
    - In-stream detection, infinite retention, OOTB detections and dashboards, next-gen alerting
    - Need more external validation of detection quality and incident workflow depth.
  - - AI Center (observability + guardrails + AI security)
    - AI platform / app teams
    - Fast-moving and 2026-prioritized
    - Monitoring, evaluations, guardrails, AI-SPM, session explorer, AI Session trace correlation
    - Need customer references and benchmark data on guardrail accuracy and real production adoption.
  - - Telemetry data engine / retention stack
    - Platform owner / FinOps
    - Foundational
    - TCO Optimizer, quota rules, remote query, parquet + compression, schema-free DataPrime layer
    - Need real customer mix on hot vs archive tiers and resulting performance trade-offs.
  notes: Rows summarize the modules public sources make visible today; maturity is judged from product, docs, and release-note evidence rather than revenue disclosure.
