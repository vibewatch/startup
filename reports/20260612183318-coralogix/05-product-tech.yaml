  evidenceGaps:
  - type: missing-source
    severity: material
    topic: uptime-benchmarks
    missingEvidence: Independent uptime history or negotiated SLA terms for core observability and newer AI surfaces.
    whyItMatters: The public status page proves transparency, but it does not replace module-level uptime commitments or a customer-verifiable reliability record.
    diligencePath: Request the current MSA/SLA, last 12 months of severity-1 and severity-2 incident metrics, and customer references that depend on APM, RUM, and AI Center in production.
    relatedQuestionRefs:
    - QE018
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: module-attach-rates
    missingEvidence: Module-level adoption, expansion, and attach rates for SIEM, RUM, AI Center, and Fleet Management.
    whyItMatters: Public breadth is clear, but investment value depends on whether non-log modules are real revenue drivers or mostly roadmap and demo surfaces.
    diligencePath: Ask for product-line ARR mix, attach rates by segment, and customer cohorts using at least three modules beyond log analytics.
    relatedQuestionRefs:
    - QE024
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
  - type: private-evidence-only
    severity: material
    topic: performance-benchmarks
    missingEvidence: Independent performance benchmarks for Streama query latency, AI guardrail quality, and DataPrime learning-curve outcomes.
    whyItMatters: The strongest technical claims are still mostly company-led, while external reviews emphasize architecture and pricing more than benchmarked superiority.
    diligencePath: Request a proof-of-concept pack with representative workloads, false-positive/false-negative guardrail tests, and benchmark comparisons against the incumbent stack.
    relatedQuestionRefs:
    - QE002
    - QE023
    - QE025
    relatedTableRefs:
    - TE003
  - type: access-blocked
    severity: minor
    topic: peer-review-detail
    missingEvidence: Full-text peer-review detail from gated software-review platforms beyond the snippets visible during this run.
    whyItMatters: Independent reviews are helpful for migration friction and product gaps, but snippet-level access can understate the distribution of negative feedback.
    diligencePath: Ask the company for reference calls and pull full G2/Gartner/TrustRadius exports during live diligence rather than relying on public snippets alone.
    relatedQuestionRefs:
    - QE022
    - QE024
