- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in stack
  - Primary dependency
  - Public risk or operating caveat
  rows:
  - - OpenTelemetry / eBPF collection
    - Capture logs, metrics, traces, and runtime telemetry from apps and clusters
    - Collectors, k8s attributes, secrets, optional eBPF
    - Open approach is attractive, but configuration quality directly affects data hygiene.
  - - Streama in-stream engine
    - Analyze data during ingest for alerts, templates, and security events
    - Ingest throughput and routing design
    - No public benchmark proves how Streama performs against the largest competitor workloads.
  - - Data Engine controls
    - Route and govern cost, quotas, and plans
    - Correct tagging, quota policy, usage analytics
    - FinOps value depends on operator discipline rather than pure vendor automation.
  - - DataPrime query plane
    - Unify syntax across tools, archives, APIs, and AI
    - Schema handling, archive connectivity, metadata enrichment
    - Public claims of lower learning curve are still company-led.
  - - Customer cloud object storage
    - Hold retained telemetry with remote query and infinite-retention posture
    - Customer S3/object storage configuration and cost ownership
    - Lowers lock-in but pushes some storage and governance burden to the customer.
  - - Experience layer
    - Expose dashboards, SIEM, APM, RUM, AI explorer, session explorer, releases
    - UI workflows plus underlying data mappings
    - Breadth is high, but depth by module varies and should be tested in demos.
  - - Control plane and automation
    - APIs, Terraform, Fleet Management, SSO, status/support surfaces
    - API maturity, identity config, rollout process
    - Strong automation surface exists, but migration from incumbent tools still needs change management.
  notes: Architecture rows are derived from official product pages, docs, and open-source readmes; they reflect how the stack is described publicly, not a reverse-engineered internal design.
