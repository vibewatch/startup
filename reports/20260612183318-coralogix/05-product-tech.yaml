  summary: Coralogix layers open collection, in-stream analytics, a common query plane, customer-owned storage, and module-specific experiences into one product stack.
  data:
    layers:
    - label: Collection
      detail: OpenTelemetry collectors, Kubernetes collectors, and eBPF-based capture bring telemetry into the platform.
      items:
      - OTel collectors
      - Kubernetes agent / cluster collector
      - OBI eBPF capture
    - label: In-stream analytics
      detail: Streama evaluates telemetry while it is being ingested rather than waiting for post-index analysis.
      items:
      - Real-time templates
      - Ingest-time alerting
      - Security-event analysis
    - label: Data controls
      detail: The data plane governs cost and routing before every byte is treated the same way.
      items:
      - TCO Optimizer
      - Quota Manager
      - Data Plans
      - Pipeline Analyzer
    - label: Unified query plane
      detail: DataPrime provides one syntax across live data, archives, APIs, and AI-assisted workflows.
      items:
      - Cross-event joins
      - Archive access without reindexing
      - Dashboards / alerts / APIs
    - label: Experience surfaces
      detail: Module-specific experiences sit on top of the same telemetry foundation.
