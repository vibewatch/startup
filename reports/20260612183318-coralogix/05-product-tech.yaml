chapter:
  number: 5
  title: Product & Technology
  summary: Coralogix’s public product story now spans logs, infrastructure metrics, APM/tracing, RUM, cloud SIEM, and AI observability/security, all tied together by an in-stream architecture, customer-owned storage, and a steadily more OpenTelemetry-centric control plane. The strongest technical differentiators visible in source material are Streama, DataPrime, remote query against archive tiers, and documented Kubernetes / collector tooling. The main diligence cautions are that much of the architecture story is still company-controlled, Kubernetes and OTel deployment adds real operational complexity, and public proof on AI efficacy, module attach rates, and hard performance SLAs remains thin.
sections:
- id: suite-and-architecture
  title: Product Suite and Core Architecture
  body: |-
    Coralogix’s public product surface is now much broader than the log-management starting point that still dominates older descriptions of the company. The current official platform pages present one stack spanning logs, infrastructure metrics, distributed tracing/APM, RUM, cloud SIEM, and AI observability/security, with Streama and DataPrime as the connective tissue. Streama is the company’s core in-stream engine: Coralogix says it analyzes logs, metrics, traces, and security events while data is being ingested, avoiding indexing delays and lowering the amount of storage-dependent processing the user has to wait for. DataPrime then acts as the common syntax across platform tools, APIs, and AI, with the ability to join across event types, time ranges, and storage tiers in one statement.

    That architecture is the clearest technical differentiation in the public record. Coralogix repeatedly ties cost control and retention to customer-owned cloud object storage, remote index-free querying, and a telemetry pipeline that decides what should stay hot, what should be compressed, and what can remain in cheaper archive tiers. The strongest official evidence for technical depth is not a single benchmark but the consistency across product pages: Streama for in-stream processing, Data Engine for TCO and quota controls, DataPrime for schema-aware querying, and module-specific experiences layered on top of the same data plane. The caveat is that much of this differentiation is still described on company-controlled pages rather than independent benchmarks, so the architecture story looks coherent but remains only partially externally verified.
