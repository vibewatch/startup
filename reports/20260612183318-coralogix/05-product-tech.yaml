- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow in public sources
  - Coralogix solution surface
  - Claimed benefit
  - Limitation / caveat
  rows:
  - - Collect app + infra telemetry
    - Deploy OTel collectors, map metadata, route data by tier
    - OpenTelemetry agent / cluster collector, DataPrime, Data Engine
    - One stack for logs, metrics, traces, and Kubernetes events
    - Collector design and secret management still require hands-on platform engineering.
  - - Investigate production incident
    - Move from alert to traces, correlated logs, profiles, and runtime metrics
    - APM, Trace Drilldown, Dependencies view, Continuous Profiling
    - Faster root cause isolation across services and spans
    - Independent proof of time-to-resolution improvement is sparse outside reviews and case studies.
  - - Understand web or mobile user regressions
    - Track releases, replays, vitals, network requests, and errors
    - RUM, Session Replay, Releases page, RUM Overview
    - Better link between deployment versions and user-impacting regressions
    - Public evidence does not show how broadly RUM is adopted versus logs/APM core.
  - - Run security and compliance monitoring
    - Ingest events, apply detections, retain long-term data, query archives
    - Cloud SIEM, AI Security, Infinite Retention, Remote Query
    - Long-lived investigation data without hot-tier economics
    - Detection quality and analyst workflow depth are still mostly company-described.
  - - Operate AI applications safely
    - Observe prompts/responses, run evaluations, enforce guardrails
    - AI Center, Evaluation Engine, Guardrails, AI-SPM, Session Explorer
    - Makes non-error failures such as hallucination, PII, and prompt injection visible
    - Guardrail efficacy is not independently benchmarked in the public pack.
  - - Standardize collector rollout at scale
    - Select collectors by metadata and push config changes remotely
    - Fleet Management
    - Lower drift across large OTel estates
    - Requires Supervisor-enabled agents and Helm preset discipline.
  notes: This table focuses on the user workflow Coralogix describes publicly; measurable benefits are directional unless a third-party review or case study quantifies them.
