- id: deployment-and-workflow
  title: Deployment, Integration, and Operator Workflow
  body: |-
    Coralogix’s deployment model is increasingly OpenTelemetry-centric and looks credible for modern cloud-native teams, but it is not “zero work” in practice. The official docs and company GitHub repositories show multiple ingestion paths: Kubernetes Helm charts, Kubernetes manifests, Docker images, an OpenTelemetry Agent daemonset, a Cluster Collector, an optional OpenTelemetry Operator / CRD mode, and an open-source exporter maintained in the OpenTelemetry collector ecosystem. The strongest signal here is not one landing page but the combination of official setup docs, raw README material, and the upstream exporter documentation. Together they show that Coralogix can ingest logs, metrics, traces, and Kubernetes events through standard OTel components rather than only through proprietary agents.

    The same evidence also surfaces the main implementation friction. The Kubernetes setup requires secrets, Helm repository management, and occasionally Operator-level choices; the raw README explicitly warns that Helm arrays overwrite rather than merge and documents a known validation warning in one installation path. Fleet Management and Zero Instrumentation broaden the story by adding remote OTel configuration, Kubernetes Helm presets, and eBPF-based capture, while the API index and Terraform provider show a real control-plane surface for alerts, dashboards, retentions, enrichments, and SLO-related automation. In other words, Coralogix appears technically open enough for sophisticated platform teams, but the product still assumes that those teams can handle collector configuration, metadata mapping, and rollout hygiene.
