- id: trust-security-reliability
  title: Trust, Security, and Reliability Posture
  body: |-
    Coralogix has more public trust material than many private infrastructure vendors, but the detail is strongest on controls and support process rather than on independently measured service quality. The Technical and Organizational Measures page lists annual third-party audits including SOC 2 Type 2 and multiple ISO standards, then adds self-assessment coverage for frameworks such as GDPR, CCPA, HIPAA, DORA, the AI Act, and PCI-DSS. That gives a useful control inventory for enterprise procurement. The same page also narrows the claim: customers remain responsible for securely configuring what they send and for handling sensitive or regulated data before transmission. That is an important qualifier because the architecture encourages broad telemetry collection, which can easily include PII if badly instrumented.

    Operationally, Coralogix publishes a support policy with 24/7 intake and a five-minute response target, plus continuous 24x7 work on business-critical incidents, and it runs a public status page that records maintenance and incident notices. The product also exposes Microsoft Entra single sign-on and AWS marketplace distribution, both of which matter in enterprise deployments. Still, the public record stops short of giving a hard independent SLA history, a public error budget, or module-level uptime commitments for newer surfaces such as AI Center and Fleet Management. For diligence, the trust story is solid enough for shortlist consideration, but not yet sufficient to replace a security packet, SLA redline, and customer reference calls.
