  - id: milestones-customer-proof-and-adverse-signals
    title: Milestones, customer proof, and adverse signals
    body: >-
      Coralogix’s 2024-2026 milestone sequence shows a company intentionally repositioning from classic observability toward AI-native operations tooling. The December 2024 Aporia acquisition added AI guardrails and observability, the March 2025 AI Center launch formalized a dedicated AI-observability surface, and the June 2025 introduction of Olly pushed the company toward natural-language and agentic workflows. By June 2026, the company’s own docs said Olly was available to every Coralogix customer and operable through UI, API, and MCP integrations, which is strategically important because it turns observability data into an agent-consumable substrate rather than just a dashboard layer.

      Customer proof is meaningful but mostly company-published. Coralogix case studies show Claroty running 3TB of daily data and 3,000-plus Coralogix alerts after moving from ELK, while Bank Jago cites 20TB of daily ingestion and 216 active Coralogix users. Those are useful adoption signals, but they are not substitutes for a canonical gross-retention or expansion metric. The main adverse public signals are operational and product-side rather than financial distress. Coralogix’s status page recorded multiple June 2026 incidents and maintenance windows affecting EU1 and EU2. Independent review surfaces remain favorable overall, but G2, TrustRadius, and PeerSpot all surface recurring complaints about page loading, query performance, duplicate logs, SSO friction, UI clutter, and the learning curve for advanced features. Those signals do not negate product-market fit, but they do show the execution burden of scaling a broad platform quickly.
