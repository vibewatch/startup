  - id: capital-trajectory-and-public-scale
    title: Funding trajectory, investor base, and public scale signals
    body: >-
      The public capital story is one of rapid step-up financing around an AI observability narrative. Coralogix’s own June 17, 2025 post and multiple independent Israeli business outlets agree that the company raised $115 million in a Series E round at a valuation above $1 billion, becoming a unicorn with NewView Capital as lead investor. CTech and Globes say that round brought total funding to $350 million, while the About page fetched during this run still states only $320 million raised, which is best interpreted as stale website copy rather than a genuine contradiction in financing history.

      By run date, the fresher anchor is the June 3, 2026 Series F. Coralogix, Advent, FinTech Global, and TechCrunch all report a $200 million round that took total funding to $550 million; TechCrunch adds the most specific valuation datapoint, a $1.6 billion post-money valuation. That round also materially updated public scale indicators. Official and independent 2026 sources move the customer base from 4,000-plus in 2025 to more than 5,000 by June 2026. Headcount is less clean: June 2025 Israeli coverage put the company at 500 to 550 employees, while TechCrunch reported more than 600 employees globally in June 2026. That is enough to reject the user’s 2,500-customer hypothesis as too low and to treat the 600-800 employee hypothesis as directionally plausible but still not precisely verified at run date.
