  evidenceGaps:
    - type: conflicting-data
      severity: minor
      topic: founding-year
      missingEvidence: A canonical legal or company-history source that resolves whether Coralogix should be dated to 2014 or 2015 in diligence materials.
      whyItMatters: The founding-year discrepancy is not thesis-breaking, but it affects chronology cleanliness and can signal sloppy data hygiene in secondary profiles.
      diligencePath: Ask management or legal for incorporation date, first commercial launch date, and preferred historical framing for investor materials.
      relatedQuestionRefs: [QO003]
      relatedTableRefs: [TO004]
    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: A precise run-date employee census by region and function.
      whyItMatters: Public sources move from 500-550 employees in June 2025 to 600-plus in June 2026, which is directionally useful but not precise enough for efficiency underwriting.
      diligencePath: Request current global headcount, hiring plan, attrition, and Israel-versus-U.S.-versus-India employee distribution from management.
      relatedQuestionRefs: [QO013]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: A complete current board roster, committee structure, control-rights map, and cap-table ownership breakdown.
      whyItMatters: Public investor pages reveal relationships but not who actually controls the board or what protections late-stage investors negotiated.
      diligencePath: Request the latest cap table, board list, investor-rights agreement, and any side letters or observer arrangements.
      relatedQuestionRefs: [QO023]
      relatedTableRefs: [TO002, TO003]
    - type: private-evidence-only
      severity: material
      topic: financial-disclosure
      missingEvidence: Current revenue, ARR, gross margin, burn, and retention metrics as of the 2026 run date.
      whyItMatters: The company is late-stage and well-funded, but public sources still do not provide the core operating metrics needed to judge efficiency and valuation support.
      diligencePath: Request board materials or management disclosures covering ARR, net retention, gross margin, burn, and profitability timeline.
      relatedQuestionRefs: [QO024]
      relatedTableRefs: [TO001]
