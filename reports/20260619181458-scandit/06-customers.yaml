  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table — customer logo completeness and boilerplate logo verification
    missingEvidence: Complete and independently audited list of all active Scandit enterprise customers with named executive
      quotes, deployment scales, and quantified outcomes. Current public record covers ~8 case studies with quantified outcomes
      out of 2,100+ claimed enterprise customers; FedEx, Lufthansa, Sephora, and Instacart appear only in press release boilerplate
      without dedicated case studies.
    whyItMatters: The 8 named case studies in TU003 (named customer proof table) represent a partial view of the customer
      base. If a significant portion of the 2,100+ customer count consists of inactive, trial, or low-ACV accounts, the revenue
      quality and retention story changes materially. Boilerplate logos like FedEx and Lufthansa that lack standalone verification
      inflate perceived brand-name traction.
    diligencePath: 'Request from Scandit management: (1) customer roster with vertical, ACV, and deployment date for at least
      the top 20 accounts by ARR, (2) confirmation of active FedEx and Lufthansa relationship status and ARR contribution,
      (3) definition of enterprise customer including criteria for active vs. inactive.'
    relatedTableRefs:
    - TU003
    relatedQuestionRefs:
    - QU003
    - QU021
  - type: private-evidence-only
    severity: material
    topic: customer retention metrics — NRR, GRR, logo churn, cohort data
    missingEvidence: Independently audited or management-disclosed Net Revenue Retention, Gross Revenue Retention, annual
      logo churn rate, and cohort retention curves by vintage year. No public filing, investor statement, or third-party data
      provider discloses any Scandit retention metric.
    whyItMatters: Without NRR or GRR data, the durability and quality of Scandit's revenue cannot be assessed. Multi-year
      renewal events at named accounts (Walmart) provide qualitative signals but are not a substitute for portfolio-level
      retention metrics. Enterprise SaaS at 110–130%+ NRR indicates strong land-and-expand mechanics; absence of this data
      is a significant diligence gap for any investor.
    diligencePath: 'Request from Scandit management: (1) annual NRR and GRR for last three fiscal years, (2) logo churn rate
      by vintage cohort, (3) average contract length and renewal rate, (4) top-10 customer ARR as percentage of total ARR,
      (5) NPS methodology, survey date, sample size, and independent survey provider.'
