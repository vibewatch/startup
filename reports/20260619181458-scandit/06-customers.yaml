company:
  name: Scandit
chapter:
  number: 6
  title: Customers
  summary: 'Scandit serves 2,100+ enterprise customers across retail, transport and logistics, healthcare, manufacturing,
    and air travel, running on 170 million+ active devices processing 80 billion scans annually — all figures are self-reported
    with no third-party audit. Named production evidence is strongest in retail and logistics: Walmart (1.3 million associates,
    partnership renewed June 2025), Staples Canada (1,200 iPhones, 18,500 hours saved weekly, 45% hardware cost reduction),
    Swiss Post (200 million parcels/year, AR-guided last-mile delivery), Dior (85% shipping control time reduction, December
    2025), OK Corporation Japan (picking time halved, error rate near zero), Leeds Teaching Hospitals NHS Trust (recall time
    from 8 hours to 35 minutes), Shipt (89K monthly active devices, 100K+ BYOD contractors), and Artivion (140 field reps
    across 9 countries). A self-reported 98% NPS is unverified by any independent third party. No NRR, GRR, or cohort retention
    data is public. Concentration risk centres on Walmart as the single largest named logo; no revenue breakdown by customer
    is disclosed. Third-party reviews (G2, PeerSpot) are sparse (13 G2 reviews) and identify opaque pricing as the primary
    user complaint. The land-and-expand model is evidenced by multi-year renewals and expanding workflow deployments at named
    accounts, but systematic retention proof requires diligence.'
sections:
- id: section-1
  title: Customer base composition, vertical segmentation, and named logos
  body: 'Scandit''s homepage as of mid-2026 reports 2,100+ enterprise customers, 170 million+ active mobile devices, and an
    ISO 27001 certification. The company''s developer page states that development teams at nine of the top fifteen global
    brands trust Scandit. These aggregate metrics are company-disclosed and not independently audited. Boilerplate in Scandit
    press releases — including the June 2025 Walmart renewal and the December 2025 Dior partnership announcement — consistently
    names Instacart, Levi Strauss & Co., Sephora, Lufthansa, and FedEx as trusted customers, establishing a set of referenceable
    marquee logos across verticals. The casestudies.com listing of Scandit''s case studies enumerates dozens of named deployment
    references across retail (AEON, Alaska Airlines, Colruyt Group, Coop, Decathlon, METRO), logistics and delivery (CDL Last
    Mile, DPD Russia, Helthjem, NACEX, PostNL, Rappi, Yodel), healthcare (Cardinal Health, ERS Medical), and other sectors
    including energy (Enphase Energy, SunPower) and consumer apps (Shopkick, Yuka, Ibotta), reflecting genuine breadth across
    enterprise buyer types.

    Scandit''s primary verticals, by evidence density and public reference volume, are retail (estimated 50–60% of named case
    studies), transport and logistics (approximately 20–25%), healthcare (approximately 10%), and manufacturing/field service/other
    (approximately 10–15%). Airlines and air travel (Alaska Airlines, Lufthansa) appear in boilerplate and as discrete references
    but represent a smaller named cohort. No published revenue or ARR breakdown by vertical is available for verification.
    The buyer is typically a technology or IT leader (CIO, VP of Product, Director of Digital), the user is a frontline worker
    or consumer app end-user, and the payer is the enterprise IT or operations budget holder. Consumer-facing scanner apps
    (Shopkick, Ibotta, Yuka, Coop@home) constitute a distinct segment where the SDK is embedded in a B2C application — in
    these cases, the payer is the app operator and the user is a retail shopper or loyalty-programme participant, creating
    a different renewal and expansion dynamic from enterprise B2B deployments.

    '
