- id: section-4
  title: Retention, expansion, and land-and-expand signals
  body: 'Scandit''s stated go-to-market philosophy centres on a land-and-expand model: customers adopt the platform for a
    single high-value workflow and then extend to adjacent use cases, geographies, or user populations. This pattern is directly
    evidenced in multiple named accounts. Staples Canada started with a three-store pricing-audit pilot and scaled to 1,200
    iPhones across 298 stores, with future expansion planned to include back-of-store receiving, cycle counting, and omnichannel
    fulfilment. Artivion began with consignment scanning for North American sales reps and extended to all 70 EMEA reps within
    the same year. Dior''s deployment of MatrixScan Count for shipping control is explicitly described as the foundation for
    planned expansion to all Dior distribution centres running Hardis WMS globally. Walmart''s relationship, active since
    2022, was formally renewed in June 2025 with an expanded scope covering additional associate and customer-facing applications
    — the most direct multi-year enterprise renewal event in the public record.

    Scandit does not publish NRR, GRR, customer cohort retention, or logo churn rates. The self-reported 98% NPS is the only
    public satisfaction metric, and it lacks verification. G2 hosts 13 reviews with a 4.2/5 average, which is a small panel
    for a 2,100-customer business. PeerSpot surfaces user-reported complaints about opaque and high pricing as the primary
    barrier for smaller or budget-constrained buyers. Futurum Group''s independent analysis of Scandit Empower 2024 noted
    that winners of the Smart Data Capture Awards consistently pointed to "real-world, impactful results" and framed their
    deployments as steps in a larger digital transformation initiative — implying a sticky, multi-phase engagement pattern
    rather than a transactional licence relationship. Third-party coverage of the Walmart renewal from IoT M2M Council and
    Retail Systems corroborates the multi-year nature of the commercial relationship. No evidence of mass churn, failed deployments
    at named accounts, or systematic switching to competitors was found in the research. The primary adverse signals are pricing
    opacity in third-party reviews and the absence of published retention metrics.

    '
