- id: TU004
  title: Retention, satisfaction, and expansion signals
  type: matrix
  layout: standard
  summary: Scandit does not publish NRR, GRR, or cohort data. Retention evidence is inferred from multi-year named account
    relationships and expansion evidence within accounts. No adverse retention events are documented in public sources.
  columns:
  - Metric / signal
  - Available evidence
  - Confidence
  - Diligence ask
  rows:
  - - Net Revenue Retention (NRR)
    - Not disclosed; no public filing or investor statement
    - Not assessable from public sources
    - Request current and three-year historical NRR from management; benchmark against 110–130% enterprise SaaS median
  - - Logo retention / churn
    - Not disclosed; no public churn rate or customer count over time series
    - Not assessable from public sources
    - Request logo churn by vintage cohort and by vertical; ask whether 2,100+ is gross adds or net active count
  - - Multi-year renewal evidence
    - 'Walmart: renewed June 2025 after 3+ years; Artivion: expanded from North America to EMEA within 12 months; Staples
      Canada: scaled from 3-store pilot to all 298 stores; Dior: explicitly plans to expand to all Hardis WMS distribution
      centres'
    - Medium — individual renewal events confirmed, not systematic cohort retention
    - Ask for percentage of customers renewing annually and average contract tenure
  - - NPS score
    - 98% self-reported on homepage; G2 4.2/5 from 13 reviews; FeaturedCustomers 177 references
    - Very low for the 98% figure; medium for G2 and FeaturedCustomers
    - 'Request NPS methodology: respondent base, date, cohort definition, and independent survey provider; compare to G2 and
      PeerSpot for independent triangulation'
  - - Expansion-within-account evidence
    - 'Multiple named accounts document workflow expansion: Staples Canada (front-of-store to back-of-store); Artivion (US
      to EMEA plus new barcode standards); Dior (one DC to all DCs globally); OK Corporation (picking app to POP/price-tag
      management)'
    - Medium — expansion is evidenced in first-party case studies; no revenue expansion data
    - Request average ACV growth rate per cohort and per-account expansion timelines
  claimRefs:
  - CU028
  - CU030
  - CU031
  - CU033
  - CU034
  - CU037
  notes: Scandit does not disclose NRR, GRR, or cohort data; evidence is inferred from named account events; confidence is
    limited to public record.
- id: TU005
  title: Concentration risk and adverse evidence
  type: matrix
  layout: standard
  summary: Primary risks are customer concentration around Walmart, metric opacity (self-reported aggregate figures), thin
    third-party reviews, and the absence of published retention data.
  columns:
  - Risk / adverse signal
  - Evidence
  - Severity
  - Diligence path
  rows:
  - - Walmart concentration risk
    - 1.3M associates = largest single disclosed deployment; no revenue breakdown by customer; no other named customer approaches
      comparable deployment scale; Walmart contract renewal is annual or multi-year (undisclosed)
    - High if >20% revenue; undisclosed
    - Request exact ARR from Walmart and top-5 customers as % of total ARR; ask for contract renewal dates
  - - Logo inflation risk
    - FedEx and Lufthansa appear in every Scandit press release boilerplate but have no standalone case study, named executive
      quote, or specific deployment detail; may be outdated references or indirect/partner relationships
    - Medium — affects marketing credibility if not active
    - Confirm FedEx and Lufthansa relationship status, contract scope, and ARR contribution
  - - Unverifiable aggregate metrics
    - 2,100+ customers, 170M+ devices, 80B scans, and 98% NPS are all company-reported with no independent audit; G2 has only
      13 reviews; PeerSpot surfaces pricing complaints; IHL Group research was co-commissioned by Scandit
    - Medium — standard for private SaaS but creates diligence dependency on management disclosure
    - Request annual third-party NPS survey, customer count audit methodology, and active device definition
  - - Pricing opacity complaints
    - PeerSpot and G2 reviews specifically cite expensive and non-transparent licensing as barriers; no public pricing published;
      quote-based enterprise model creates friction for smaller or budget-limited enterprise buyers
    - Low-medium — impacts SMB segment; enterprise deals are individually negotiated
    - Obtain pricing model details; assess whether list prices or volume discounts are accessible to target segment
  claimRefs:
  - CU024
  - CU025
  - CU026
  - CU035
  - CU036
  - CU039
  notes: Risk severities are qualitative assessments based on available public evidence; revenue concentration percentages
    are unavailable without management disclosure.
figures:
- id: FU001
  title: Customer journey map — from awareness to multi-workflow expansion
  type: journey-map
  layout: wide
  summary: 'Scandit''s customer journey progresses through five stages: discovery and evaluation, pilot deployment, production
    launch, multi-workflow expansion, and strategic partnership. Named customer examples confirm each stage in public evidence.
    The journey map highlights the land-and-expand mechanics that underpin Scandit''s commercial model.'
  data:
    nodes:
    - id: stage-discovery
      label: Discovery & evaluation
      detail: IT or digital transformation leader identifies barcode/ID scanning need. Scandit trial (30-day free trial) or
        SDK evaluation. Benchmark against open-source (ZXing, Google ML Kit) or hardware vendors (Zebra, Honeywell). Median
        time to first scan under 1 hour per Scandit SDK documentation.
      segment: IT/Digital buyer
      tone: neutral
    - id: stage-pilot
      label: Pilot deployment (1–3 stores/sites)
      detail: 'Single-site or small-footprint pilot. Scandit provides trials, solution design, integration, and CS support
        included. Staples Canada: 3-store pilot. Artivion: tested in March 2023, deployed July 2023. Shipt: parallel SDK evaluation
        during COVID-19 demand surge. OK Corporation: online supermarket app built in 3 months.'
      segment: IT + Operations buyer
      tone: positive
