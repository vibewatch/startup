callouts:
- calloutType: strength
  title: Walmart multi-year renewal is the most durable and independently corroborated enterprise proof point
  body: The June 2025 Walmart partnership renewal — confirmed by a Scandit press release, Retail Customer Experience, IoT
    M2M Council, and Retail Systems — represents the strongest single evidence of enterprise durability in Scandit's public
    record. The relationship has been active since 2022, now spans multiple associate-facing and customer-facing applications
    in the MyWalmart app, covers 1.3 million US associates, and includes an expanded commercial scope in the renewed agreement.
    Walmart's VP of Product Management Dan Miller is directly quoted, providing independent executive confirmation. For a
    private company, a multi-year enterprise renewal at this deployment scale, with named C-suite corroboration from the customer,
    is an unusually strong public proof point of product durability and commercial stickiness.
  claimRefs:
  - CU005
  - CU006
  - CU007
- calloutType: risk
  title: Self-reported NPS of 98% is unverifiable and statistically implausible without methodology disclosure
  body: Scandit's homepage prominently displays a 98% NPS score. No survey methodology, sample size, survey date, response
    rate, or independent survey provider is cited. An NPS of 98% would place Scandit in the highest tier of any enterprise
    software benchmark globally — a tier occupied by a handful of consumer brands and virtually no enterprise SaaS provider.
    G2 reviews, the only independent third-party review dataset, show 13 reviews with a 4.2/5 average (not exceptional for
    enterprise software). PeerSpot flags pricing opacity as a consistent user complaint. Without methodology disclosure, the
    98% NPS figure should be treated as a marketing claim and not a benchmarked or auditable satisfaction metric. Diligence
    should request the full NPS survey methodology, raw data distribution, and third-party survey provider details.
  claimRefs:
  - CU004
  - CU024
  - CU029
- calloutType: insight
  title: Case study depth is heavily weighted toward retail and logistics; healthcare and manufacturing need direct diligence
  body: Scandit's public case study library and named customer evidence is heavily concentrated in retail (Walmart, Staples
    Canada, OK Corporation, Kroger, VF Corporation) and logistics (Swiss Post, Dior, Shipt, Yodel). Healthcare has one strong
    proof point (Leeds Teaching Hospitals NHS Trust, with GS1 corroboration) and one production deployment (Artivion), but
    no named US hospital network, health system, or major pharmacy chain case study. Manufacturing and field service references
    exist in the casestudies.com library (American Woodmark, Cincinnati Bell, British Gas) but without quantified first-party
    outcomes on the Scandit website. Any investor relying on healthcare or manufacturing vertical growth should request pipeline
    data, active customer counts by vertical, and NRR by vertical segment, as public evidence does not currently support a
    symmetric vertical diversification claim.
  claimRefs:
  - CU020
  - CU027
  - CU042
