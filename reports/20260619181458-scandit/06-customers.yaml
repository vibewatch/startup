- id: section-3
  title: Named customer case studies and verified production outcomes
  body: 'Scandit''s deepest public evidence base consists of first-party case studies on its website and third-party coverage
    confirming named deployments. The Walmart partnership, renewed on 25 June 2025, is the single most material evidence of
    enterprise durability: the relationship has been active since 2022 and now covers multiple associate applications including
    the MyWalmart app, with deployment across order fulfilment, stock replenishment, out-of-stock detection, product information
    lookup, and receipt checks. Dan Miller, Vice President of Product Management at Walmart, is directly quoted in the renewal
    announcement, providing high-confidence corroboration from an independent executive. Staples Canada is the most outcome-quantified
    case study: 1,200 iPhones across all 298 Canadian stores generate 20,000 sessions and 200,000 app interactions per week,
    saving 18,500 associate hours weekly across pricing audits and delivering a 45% reduction in hardware costs relative to
    dedicated scanner devices.

    For logistics, Swiss Post integrated Scandit Smart Data Capture into its Nemo app for 200 million parcels and 1.7 billion
    letters per year, with named IT leader Sascha Zingg confirming driver satisfaction with scanning speed and accuracy. Dior
    reduced shipping control time by 85% in its December 2025 deployment with Hardis WMS across distribution centres, with
    independent corroboration from both the Scandit press release and Retail Times coverage. For healthcare, Leeds Teaching
    Hospitals NHS Trust under the NHS Scan4Safety programme reduced product recall time from over 8 hours to 35 minutes and
    recall cost from £173 to £9; GS1 UK independently documents these outcomes. For Japan, OK Corporation cut order-picking
    time from 5 seconds to 2 seconds per item and reduced the picking error rate from approximately 6% to near zero. For medical
    devices, Artivion deployed Scandit Express to 140 field reps across US and EMEA with zero picking errors since October
    2021 implementation and 2,274 completed inventory counts in the first year.

    Consumer-facing deployments also show scale: Shipt grew to 89,000 monthly active devices by enabling scanning on contractor-owned
    personal smartphones without a dedicated device procurement programme. Alaska Airlines deploys Scandit for boarding door
    scanning, with the product manager explicitly noting Scandit "blew away the competition in both accuracy and speed." Kroger
    uses Scandit for fresh-food inventory management, confirmed by its Senior Manager of Product.

    '
