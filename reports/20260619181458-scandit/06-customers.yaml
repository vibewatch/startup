- id: section-5
  title: Concentration risk, adverse evidence, and diligence gaps
  body: 'The most significant concentration risk is Walmart. While no revenue percentage is disclosed, Walmart''s deployment
    across 1.3 million US associates — out of a reported 2,100 total enterprise customers — almost certainly represents a
    disproportionate revenue contribution. A Walmart renewal failure, pricing renegotiation, or in-house build decision would
    constitute a material adverse event. No other named customer approaches a comparable disclosed deployment scale. The second
    tier of references (Shipt at 89K devices, Swiss Post, Staples Canada) are significant but represent smaller revenue profiles.
    FedEx and Lufthansa appear in boilerplate across all press releases but neither has a standalone case study or named executive
    quote, raising the question of whether these are active, contractually committed production relationships or historical
    or indirect references.

    Customer count claims (2,100+) are entirely self-reported. "Enterprise customer" is not defined — it could include free-trial
    conversions, long-tail SMB deployments, or inactive accounts. The 170 million active device figure similarly lacks an
    independent definition of "active." The 80 billion annual scan figure cannot be cross-checked against third-party usage
    data. Third-party reviews are thin: G2 has only 13 reviews (4.2/5), and PeerSpot surfaced pricing transparency and integration
    complexity as repeated complaint themes. The IHL Group research (October 2025) was co-commissioned by Scandit, reducing
    its independence for claims about Scandit''s own market position. No published diligence shows contract lengths, average
    contract value, revenue concentration percentages, or cohort data for the enterprise customer base. These gaps require
    direct management disclosure in a diligence process.

    '
