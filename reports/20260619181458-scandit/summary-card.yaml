  topStrengths:
    - >-
      Category-leading enterprise SDK with 80B+ annual scans, 170M+ active devices, 2,100+ enterprise customers, and a
      17-year technology moat rooted in ETH Zurich computer vision research
    - >-
      Land-and-expand engine evidenced by Walmart (1.3M associates, renewed June 2025) and approximate 3× ARR growth
      from $35M to $119.1M between December 2023 and November 2024
    - >-
      All three co-founders remain in active C-suite roles; near top-quartile SaaS efficiency at ~$327K ARR per FTE,
      with AI-enabled computer vision positioning qualifying for a premium multiple bracket
    - >-
      Broad strategic exit optionality — attractive acquisition target for Zebra, Honeywell, SAP, Salesforce, and
      logistics platform buyers across multiple enterprise verticals
  topRisks:
    - >-
      Stale $1B+ valuation at 8.4× last-disclosed ARR versus a 3.4× public SaaS median following the Q1 2026
      SaaSpocalypse; entry at the 2022 mark requires confirmed ARR re-acceleration to $150M+
    - >-
      No audited financials, NRR, GRR, or customer concentration data publicly available; 240% ARR growth is
      founder-disclosed via LATKA only and has not been independently corroborated
    - >-
      Honeywell/HHP patent attack (UPC preliminary injunction issued 2024, withdrawn March 2025) signals recurring IP
      exposure from hardware incumbents; free Google ML Kit and AWS SDKs commoditize the low-to-mid scanning market
    - >-
      Key-person concentration across all three co-founders in C-suite roles; undisclosed Kreos Capital venture debt
      overhang affects exit waterfall and down-round risk
  unresolvedGaps:
    - >-
      Audited FY2025 ARR, NRR, GRR, and cohort retention data not publicly available; latest ARR confirmation is the
      November 2024 LATKA founder-disclosure
    - >-
      Walmart and top-10 customer revenue concentration not disclosed; Kreos Capital debt quantum and terms undisclosed
      — both material for exit waterfall underwriting
    - >-
      No primary equity round since February 2022; capital adequacy through mid-2026 cannot be confirmed from public
      sources
    - >-
      No independent third-party accuracy benchmark for Vision AI Engine on damaged/difficult barcodes across standard
      industry test sets; barKoder data shows Scandit at 47.6% vs 90.4% on PDF417 damaged samples
