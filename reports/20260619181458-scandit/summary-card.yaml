summary:
  headline: >-
    Scandit is the global #1 enterprise data capture SDK with 170M+ active devices, 2,100+ customers, and $119M
    last-disclosed ARR, but its stale $1B 2022 valuation mark at 8.4× ARR is roughly 2.5× the current public SaaS median
    — warranting a track stance pending audited ARR re-acceleration or a lower entry multiple.
