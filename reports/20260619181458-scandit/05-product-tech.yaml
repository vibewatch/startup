  - id: section-3
    title: Developer experience, framework coverage, and enterprise integrations
    body: >
      Scandit supports 11 deployment frameworks: native iOS (CocoaPods, SwiftPM, Carthage),
      native Android (Gradle/Maven), JavaScript/Web (WebAssembly), React Native, Flutter, Cordova,
      Capacitor, Xamarin, .NET MAUI, Titanium, and Linux. The company publishes feature-parity
      documentation across all platforms. Developer tooling includes the Scandit Developer
      Documentation portal (docs.scandit.com), 73 GitHub repositories of SDK sample apps and
      reference code, a 30-day free trial with instant license key and no sales call requirement,
      a UX best-practice library, QA test guides, and a median support first-reply time of
      approximately three hours.


      Scandit's most significant developer productivity investment in 2026 is Agent Skills: an
      AI-assisted integration bundle that allows AI coding agents — including Claude Code, Cursor,
      GitHub Copilot, Codex, Gemini, and 40+ others — to write the full SDK integration autonomously
      from a plain-language description. Agent Skills is installed with a single command
      (npx skills add https://github.com/scandit/skills) and targets the current validated SDK APIs.
      This reduces integration time materially for teams already using AI-assisted development.
      The npm package scandit-web-datacapture-barcode received approximately 9,500–32,000 weekly
      downloads as of mid-2026, consistent with sustained B2B enterprise adoption.


      On the enterprise integration side, the strongest verified partnership is with SAP: Scandit
      provides native SDK and web SDK integration for SAP Fiori, S/4HANA, SAP Business Technology
      Platform, Commerce Cloud, and Extended Warehouse Management, covering workflows including
      inventory management, shipping/receiving, mPOS, click-and-collect, and ID scanning. The
      SAP partnership page is co-branded and the SAP App Center lists Scandit as a certified SAP
      partner. For Google AppSheet, Scandit is listed as a named scanning provider in Google's
      official help documentation, requiring a separately purchased Scandit license; integration
      is available for Core-tier and above AppSheet plans. In Pega, Scandit Smart Data Capture
      is available as a direct marketplace component, enabling no-code embedding into Pega Platform
      workflows for healthcare, logistics, and manufacturing use cases.


      Oracle, Blue Yonder, and Manhattan Associates do not provide out-of-the-box Scandit
      connectors. Enterprise deployments targeting these platforms require custom middleware,
      integration platform (Oracle Integration Cloud, Boomi, MuleSoft), or SDK-level development.
      This creates additional deployment cost and integration risk relative to the SAP, AppSheet,
      and Pega integrations and is a diligence point for deals targeting Oracle WMS or Blue
      Yonder WMS accounts.
