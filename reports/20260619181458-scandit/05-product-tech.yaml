  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: security-certification
      missingEvidence: >-
        ISO 27001:2022 certificate number, issuing certification body, audit cadence, and scope of
        certification are not publicly disclosed. No SOC 2 Type II attestation has been identified.
      whyItMatters: >-
        Enterprise customers in financial services, healthcare, and US federal verticals frequently
        require third-party attestation reports (SOC 2 Type II) in addition to ISO 27001. The absence
        of a public SOC 2 report may create sales friction or require contract-level security review.
      diligencePath: >-
        Request Scandit's ISO 27001 certificate, issuing body, and most recent audit report; ask whether
        a SOC 2 Type II report exists or is planned; review ShelfView-specific data processing agreements.
      relatedQuestionRefs:
        - QE002
        - QE025
    - type: missing-source
      severity: material
      topic: id-validate-limitation
      missingEvidence: >-
        No public roadmap commitment for ID Validate expansion beyond US driver's licenses and state IDs
        to international document types. G2 notes "coming soon" only for ID Bolt + Validate web integration.
      whyItMatters: >-
        International deployments in airline, hospitality, car rental, and KYC contexts cannot rely on
        Scandit for on-device authenticity checking; alternative solutions (Jumio, Onfido) must be
        evaluated for these use cases, which may limit Scandit's total contract value in global accounts.
      diligencePath: >-
        Request Scandit's product roadmap for ID Validate international document coverage; identify whether
        any named enterprise customers currently use Scandit for international document verification.
      relatedQuestionRefs:
        - QE003
        - QE017
    - type: missing-source
      severity: material
      topic: web-sdk-benchmark-gap
      missingEvidence: >-
        No independent benchmark of Scandit's camera-mode (real-time live-stream) performance across
        frameworks has been published by a neutral third party. Existing independent benchmarks (Dynamsoft,
        barKoder) cover static-image web-SDK decoding only; company-authored benchmarks cover camera mode.
      whyItMatters: >-
        The most commercially relevant performance scenario for SparkScan and MatrixScan is live camera
        scanning, not static-image decoding. The existing static-image gap vs. Dynamsoft creates uncertainty
        about real-world comparative performance. Enterprises evaluating Scandit against Dynamsoft for
        high-frequency camera-mode scanning lack an authoritative neutral comparison.
      diligencePath: >-
        Commission or request an independent camera-mode performance benchmark across Scandit, Dynamsoft,
        and Scanbot for the customer's specific hardware and symbology set.
      relatedQuestionRefs:
        - QE012
        - QE015
    - type: private-evidence-only
      severity: minor
      topic: shelfview-accuracy
      missingEvidence: >-
        ShelfView's 99.7% shelf insight accuracy figure is company-stated and predates the MarketLab
        technology integration. No independent audit, customer-confirmed measurement, or academic validation
        of this figure has been identified.
      whyItMatters: >-
        Shelf intelligence accuracy is the primary commercial metric for ShelfView ROI calculations.
        If the 99.7% figure reflects pre-MarketLab performance on a specific subset of store formats
        and SKU densities, post-integration performance in new deployment contexts may differ.
      diligencePath: >-
        Request customer-validated ShelfView accuracy data from at least two named retail deployments;
        ask specifically about performance on high-SKU-density stores (grocery) vs. low-density (pharmacy).
      relatedQuestionRefs:
        - QE008
      relatedTableRefs:
        - TE002
    - type: missing-source
      severity: minor
      topic: oracle-blue-yonder-integration
      missingEvidence: >-
        No native Scandit connector for Oracle WMS, Blue Yonder, or Manhattan Associates has been
        identified. Integration depth and reference customers for these platforms are not documented
        in public sources.
      whyItMatters: >-
        Blue Yonder and Manhattan Associates are the two dominant WMS platforms in the large-enterprise
        warehouse segment. Absence of native connectors increases total cost of ownership for customers
