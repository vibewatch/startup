  - id: TE003
    title: Technology and operating architecture
    columns:
      - layer / component
      - role
      - dependency
      - risk
    rows:
      - - Device hardware (smartphone, tablet, handheld, wearable, fixed camera, robot)
        - Frame acquisition, camera exposure, and sensor I/O
        - iOS/Android OS camera APIs; GPU for AR rendering (recommended)
        - Device heterogeneity across 20,000+ models creates edge-case variation; low-end devices may lack GPU for full AR feature set
      - - SDK runtime (native iOS / Android / WebAssembly)
        - Cross-platform execution container; packages AI engine and capture modules
        - Platform OS; no Google Play Services required; WebAssembly runtime in browser
        - Web SDK has demonstrated performance gap on static-image batch decoding vs. native (11,210ms avg vs. native speeds); WASM without SIMD support limits performance on some ARM devices
      - - Scandit Vision AI Engine
        - "Core inference: barcode decoding, OCR fallback, Smart Scan Intention, AR tracking"
        - Proprietary Scandit IP; no third-party AI cloud APIs; updated via SDK version releases
        - Closed-source; customers cannot inspect or audit inference logic; performance improvements require SDK upgrade cycles
      - - Data Capture Modules (Barcode, ID/OCR, Label, Object)
        - "Modular feature set: symbology detection, ID document parsing, text recognition"
        - Vision AI Engine; SDK license key activation
        - Module activation is license-controlled; customers must upgrade licenses to unlock additional modules
      - - AR Overlay Layer (MatrixScan AR)
        - Real-time AR status icons, overlays, and popovers anchored to detected barcodes
        - GPU rendering; SDK AR framework; device display latency
        - Some barcode types not supported in AR tracking mode; performance degrades on very dense barcode environments
      - - ShelfView Cloud Pipeline
        - Image ingestion, AI-based shelf analysis, digital shelf twin generation, alert dispatch
        - Cloud hosting (EEA data centers per Scandit privacy claims); image transmission from device
        - Only Scandit product with cloud data-transit dependency; introduces latency, data-residency risk, and potential GDPR complexity for EU retail deployments
      - - Integration Layer (SAP Fiori, AppSheet, Pega, custom APIs)
        - Connects Scandit scan results to enterprise business systems
        - "Platform-specific: native SDK for SAP/Pega/AppSheet; custom middleware for Oracle/Blue Yonder/Manhattan"
        - Oracle, Blue Yonder, Manhattan Associates lack native connectors; requires custom integration effort and creates implementation dependency risk
    notes: >-
      Architecture derived from Scandit official product, developer, and partner documentation (SE001, SE006, SE007, SE011).
      Cloud infrastructure details (EEA data centers) sourced from Scandit's claimed ISO 27001 and GDPR posture; not independently verified.
