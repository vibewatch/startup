chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Scandit's Smart Data Capture platform is a modular on-device computer vision and AR software stack
    that converts any camera-equipped smart device into an enterprise-grade scanner. Its Vision AI Engine
    powers six commercially mature product lines — the core Barcode Scanner SDK, SparkScan, MatrixScan,
    ID Scanning/Validate/Bolt, ShelfView (extended via the August 2024 MarketLab acquisition), and the
    Scandit Express turnkey app — each targeting distinct enterprise workflow needs across retail,
    logistics, healthcare, and air travel. Technical differentiation centers on on-device edge processing
    (ISO 27001 certified, GDPR/CCPA compliant), context-aware scanning intelligence, AR-overlaid
    multi-barcode capture, and broad 20,000+ device-model coverage across 11 frameworks. Adverse
    evidence includes a documented web-SDK static-image detection gap versus Dynamsoft (178 vs. 292
    unique barcodes found, and 11,210ms vs. 278ms average per image in a 2024 benchmark) and a
    third-party challenged accuracy score (65.5% vs. 89.7%) on damaged Data Matrix codes;
    ID Validate remains scoped to US driver's licenses only, and Oracle/Blue Yonder/Manhattan
    Associates integrations require custom middleware rather than native plug-and-play connectors.
sections:
  - id: section-1
    title: Product portfolio and module capabilities
    body: >
      Scandit's commercial product portfolio as of mid-2026 spans six distinct product lines organized
      under its "Smart Data Capture" platform umbrella. The core Barcode Scanner SDK is the foundational
      offering and the largest revenue driver: it processed 80 billion scans in 2025 across more than
      170 million active mobile devices and 20,000+ device models, delivering accuracy above 99% across
      the symbologies and environmental conditions most enterprise apps target. The SDK reads every
      major 1D and 2D symbology — UPC, EAN, Code 128, Code 39, ITF, QR Code, Micro QR, Data Matrix
      (including direct part marking), PDF417, Aztec, DotCode, MaxiCode, GS1 DataBar and Composite
      codes, and major postal symbologies — and automatically falls back to printed-digit OCR if a
      barcode is too damaged to decode.


      SparkScan is a pre-built floating scanning component built on top of the core SDK, designed
      for high-frequency single-scan workflows. Its AI-driven Smart Scan Intention engine reduces
      unwanted scans by up to 100% and delivers a 65% longer scan range on electronic shelf labels
      and tiny barcodes compared to baseline. Integration requires minimal code and does not require
      app redesign, with a median time-to-first-scan under one hour.


      MatrixScan is the platform's multi-barcode AR capture family. Four commercially deployed
      sub-products address distinct workflows: MatrixScan Find uses AR overlays to highlight
      a target item among many for in-store order picking or parcel location; MatrixScan Count
      supports batch inventory counting with a pre-built AR counting UI; MatrixScan Batch processes
      multiple barcodes in a single pass without AR overhead; MatrixScan AR adds configurable
      information overlays to any barcode in frame. Verified production outcomes include 50% faster
      shipment processing (Stratix), 85% reduction in shipping control time (Dior), and $500,000
      in annual per-site savings at a major delivery operator.


      ID Scanning is Scandit's document verification product line, consisting of three components:
      ID Scan (data extraction from 2,500+ document types), ID Validate (authenticity and forgery
      detection, currently scoped to US driver's licenses and state IDs only), and ID Bolt (a
      pre-built web component for drop-in browser-based ID scanning). Published accuracy benchmarks
      are 100% for PDF417 barcodes, 99% for Machine Readable Zones (MRZ), and 95%+ for Visual
      Inspection Zones (VIZ). All scanning runs on-device with no internet connection required.


      ShelfView is Scandit's retail shelf intelligence solution, materially expanded by the
      August 2024 acquisition of shelf-audit technology from MarketLab, a Polish image recognition
      and AI software company. The combined ShelfView platform uses a hybrid data capture model
      — mobile devices, fixed-position cameras, and autonomous robots — to deliver a digital
      shelf twin with 99.7% alert accuracy for out-of-stocks, low-stock events, and planogram
      violations. ShelfView is the only Scandit product that processes imagery through a cloud
      pipeline rather than purely on-device. The retail industry loses approximately $634 billion
      annually from on-shelf availability issues per IHL Group research cited at the acquisition.


      Scandit Express is a turnkey no-code application available on any iOS or Android device that
      provides immediate access to MatrixScan Find, Count, and Batch without any software development
      or SDK integration. It targets customers who want immediate scanning capability in standard
      workflows without developer resources.
