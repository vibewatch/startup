- id: FM004
  title: Adoption funnel and value chain
  type: flow
  layout: standard
  summary: The enterprise smart data capture value chain runs from technology infrastructure (hardware + OS) through the SDK
    platform layer (Scandit's position) to workflow application integrations and finally to end-user outcomes. Scandit's value
    is captured at the SDK layer; adjacent actors in the chain are both partners and potential competitive threats.
  data:
    nodes:
    - id: hardware
      label: Hardware layer
      detail: Smartphones, tablets, rugged handheld computers (Zebra, Honeywell, Datalogic, Samsung), wearables, drones, fixed
        cameras. Not sold by Scandit; controls physical scan performance floor.
      tone: neutral
    - id: os
      label: OS and MDM
      detail: Android, iOS, Windows; enterprise MDM (VMware Workspace ONE, SOTI, Microsoft Intune). Manages device fleet;
        MDM vendors increasingly bundle basic scan capabilities.
      tone: warning
    - id: sdk
      label: Smart data capture SDK (Scandit)
      detail: Barcode Scanner SDK, SparkScan, MatrixScan, ID Bolt, Label Scanning, ShelfView. Converts any camera into enterprise-grade
        scanner; AR overlay; on-device ML inference. This is Scandit's position.
      tone: positive
    - id: integrations
      label: Workflow integrations
      detail: SAP EWM, Google AppSheet, Pega, custom WMS/TMS/ERP extensions. Scandit partners with these platforms; deep integration
        here creates switching cost and also partner-channel dependency.
      tone: positive
    - id: apps
      label: Enterprise workflow apps
      detail: Custom mobile apps built by retailers, logistics operators, hospitals. These are the direct buyers; they embed
        the SDK and own the end-user experience.
      tone: neutral
    - id: frontline
      label: Frontline worker outcome
      detail: Faster scan throughput, fewer errors, AR-guided workflows, lower training time. The value proposition must be
        demonstrable in pilot to unlock full deployment.
      tone: positive
    - id: platform-risk
      label: Platform layer risk
      detail: Apple (iOS), Google (Android), Samsung (Knox), and Microsoft (Intune) each have the surface area to embed scanning
        capabilities that could disintermediate the SDK layer. Currently limited to commodity use cases.
      tone: warning
    edges:
    - from: hardware
      to: os
    - from: os
      to: sdk
    - from: sdk
      to: integrations
    - from: integrations
      to: apps
    - from: apps
      to: frontline
    - from: platform-risk
      to: sdk
  approximationNotes: null
