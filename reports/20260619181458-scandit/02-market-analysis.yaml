  approximationNotes: 'All items are in USD billion (2026 estimates). Low/mid/high for each item reflect the range of published
    estimates from different analysts for that scope, or ±10% uncertainty band where only a single base estimate was available.
    Items represent different scopes of the same technology domain, not multiple estimates of the same quantity. Mixing items
    on a single chart is intentional: it illustrates the market boundary problem for Scandit sizing. The narrow mobile barcode
    scanner ($0.91B) and the broad AI in computer vision ($27B) are not comparable and should not be summed. See TM002 for
    source attribution and methodology per row.'
