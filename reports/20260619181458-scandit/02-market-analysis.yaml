  evidenceGaps:
  - id: EM001
    type: missing-source
    severity: material
    description: No single published analyst report provides a clean market size for enterprise smart-device data capture
      software (SDK licensing) as a standalone category. The $3–5B SAM estimate in this chapter is an analytic inference from
      multiple overlapping lens estimates, not a published figure. Any financial model relying on this number should be stress-tested
      and ideally replaced with primary research.
    relatedQuestionRefs:
    - QM001
    - QM021
    diligencePath: Commission primary market sizing research scoped to enterprise SDK/software-layer data capture platforms
      (excluding hardware). IDC, Gartner, or Forrester may publish adjacent segments on request. Alternatively, build a bottoms-up
      estimate from named customer counts × ACV × vertical TAM penetration.
  - id: EM002
    type: stale
    severity: minor
    description: Several market sizing estimates (WorldMetrics, Verified Market Reports) use 2022 as a baseline year with
      extrapolated growth rates; the actual 2026 market figures have not been independently verified by primary data collection
      for this chapter.
    relatedQuestionRefs:
    - QM025
    diligencePath: Request most recent (2025–2026) analyst updates from IDC or Gartner for barcode scanning and enterprise
      mobile computing categories. Cross-check against Zebra Technologies and Honeywell's publicly disclosed enterprise mobile
      segment revenues in their annual reports as anchors.
  - id: EM003
    type: private-evidence-only
    severity: material
    description: Scandit does not publicly disclose its revenue by vertical, by product line, or by geography. The vertical
      segmentation in TM003 (retail, logistics, healthcare, air travel, field service) is qualitative; revenue concentration
      by vertical is not publicly known and may differ substantially from the broad industry averages cited.
    relatedQuestionRefs:
    - QM010
    - QM012
    diligencePath: Request ARR or revenue breakdown by vertical, product line, and geography from the data room. Confirm whether
      retail, logistics, or healthcare is the largest revenue contributor and whether any vertical represents greater than
      40% of ARR (concentration risk).
  - id: EM004
    type: missing-source
    severity: minor
    description: The 136% profitability leadership advantage for retailers with hybrid data capture (IHL Group, cited by Scandit)
      is a company-cited third-party statistic; the original IHL Group research methodology, sample size, and full report
      are not publicly available for independent review.
    relatedQuestionRefs:
    - QM022
    diligencePath: Obtain the IHL Group source report directly. Verify sample size, definition of "profitability leadership,"
      and whether Scandit contracted IHL Group for the study (which would affect independence).
  - id: EM005
    type: missing-source
    severity: minor
    description: Saturation signals in the enterprise barcode scanning market — evidence that Scandit's target customers have
      already deployed a solution — are not well represented in public sources. No analyst published an adoption-saturation
      or slowdown-risk analysis for this specific software category as of the research date.
    relatedQuestionRefs:
