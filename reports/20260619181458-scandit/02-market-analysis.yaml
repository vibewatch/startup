callouts:
- calloutType: insight
  title: Market definition ambiguity is a core valuation risk
  body: The 30× variance in market size estimates ($0.91B–$27B) is not analyst error — it reflects genuine uncertainty about
    which market Scandit actually competes in. A software-only barcode SDK company billing $119M ARR in a $0.91B narrow market
    implies 13% penetration (capped growth). The same company in a $5B+ enterprise CV market implies sub-3% penetration (large
    runway). Investors must define the boundary before applying multiples. The most defensible construct for Scandit's SAM
    is $3–5B, implying a 2–4% penetration rate and substantial headroom.
  claimRefs:
  - CM010
  - CM011
  - CM015
  - CM017
  - CM018
- calloutType: strength
  title: Labor shortages and omnichannel fulfillment create durable demand tailwinds
  body: Two structurally durable drivers — persistent warehouse labor shortages (50–70% of costs, 7–9% annual wage growth)
    and the omnichannel retail build-out — create a demand environment where mobile scanning automation pays back quickly
    and where the ROI is measurable. These are multi-year secular trends, not cyclical catalysts, which supports long-cycle
    enterprise software contract duration.
  claimRefs:
  - CM029
  - CM030
  - CM031
  - CM034
- calloutType: risk
  title: Platform layer and rugged-device cycles constrain new logo acquisition speed
  body: The two most significant adoption constraints — the 5–7 year rugged-device refresh cycle and the platform layer risk
    from Apple, Google, Samsung, and Microsoft embedding native scan capabilities — are not near-term existential threats
    but are structural limiters on how quickly Scandit can convert the large installed base of hardware-native scanning customers.
    New logo momentum likely requires either a hardware refresh trigger or a use case (ID verification, shelf intelligence)
    that hardware native scanning cannot satisfy.
  claimRefs:
  - CM032
  - CM035
  - CM036
  - CM039
