- id: section-2
  title: Market sizing across multiple lenses
  body: 'Because no single analyst report cleanly segments the exact revenue earned by enterprise smart-device data capture
    software SDK vendors, the market must be sized using several complementary lenses. Each lens is described below with its
    geographic scope, year, CAGR, methodology basis, and key limitation that prevents a single definitive TAM/SAM/SOM from
    being declared.

    Lens 1 — AI in Computer Vision (Fortune Business Insights, 2026): The global AI in computer vision market is estimated
    at $27.01 billion in 2026 and is projected to reach $100.78 billion by 2034 at a 17.89% CAGR. North America holds 32.47%
    market share. This figure includes manufacturing inspection, autonomous vehicles, medical imaging, and security surveillance,
    and therefore substantially overstates Scandit''s addressable market but confirms the large tailwind in underlying computer
    vision investment.

    Lens 2 — Enterprise barcode scanners and mobile computers (Market Growth Reports / Industry Research Biz, 2026): Estimated
    at $2.9–3.5 billion globally with a 5.7–8.6% CAGR to 2034–2035. This scope includes both hardware (rugged scanners) and
    software but is bounded to industrial/enterprise barcode use. Retail accounts for 40% of revenue; logistics and transportation
    for 28%; healthcare is growing fastest within the segment. Limitation: hardware revenue from Zebra/Honeywell dominates
    and Scandit''s software license revenue sits within a sub-fraction of this total.

    Lens 3 — Mobile barcode scanner applications (Business Research Insights / Cognitive Market Research, 2026): Narrowly
    scoped to app-based software for mobile and handheld barcode scanning; estimated at approximately $0.91 billion in 2026,
    growing at 4.7–8.3% CAGR. This is the most conservative but arguably the most directly comparable proxy for Scandit''s
    core SDK market. Limitation: excludes ID Bolt, ShelfView, and Label Capture which are now material product lines.

    Lens 4 — Warehouse barcode scanner and systems (Verified Market Reports, 2025): Global warehouse barcode scanner market
    valued at $5.65 billion for 2025, growing at 6.65% CAGR through 2034. This scope includes fixed and mobile scanners, RFID-integrated
    systems, and scanning software used in distribution centers and warehouses. Limitation: blends hardware and software;
    over-represents fixed-install hardware that Scandit does not sell.

    Lens 5 — Computer vision for retail (Research and Markets, 2026): Global market for computer vision specifically deployed
    in retail estimated at $5.24 billion in 2026, growing at 23.8% CAGR to $12.19 billion by 2030. Represents only the retail
    vertical but aligns directly with Scandit''s ShelfView and hybrid data-capture initiatives. Limitation: single-vertical;
    not additive with Lens 2.

    Lens 6 — Healthcare barcode technology (MarkWide Research, 2026): The healthcare barcode technology market is projected
    to reach approximately $4.8 billion in 2026 at a 7–10.7% CAGR through 2035. Medication verification and patient identification
    at the bedside are fastest-growing applications. Scandit''s NHS UK engagement and Johns Hopkins Hospital deployment (ch1)
    confirm participation here.

    Contradictions are substantial. Estimates for the roughly equivalent space range from $0.9B to $27B depending on scope
    definition and analyst methodology. The mid-range estimate of $3–5B for enterprise software-layer data capture aligned
    to Scandit''s product scope is the most defensible but is not directly published by any single credible source. Investors
    should treat the $3–5B figure as an inference from the lenses above rather than a published market size. An SOM for Scandit
    — bounded by its $119M ARR and the penetration expected in its 2,100+ customer base — is approximately $0.4–0.8B on a
    conservative 10–20% software capture rate of a $3–5B relevant SAM.

    '
