- id: TM004
  title: Growth drivers and adoption constraints
  columns:
  - factor
  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Labor shortage in warehousing / logistics
    - accelerator
    - Current and ongoing through 2027+
    - 50–70% of warehouse costs are labor; 7–9% annual wage growth makes automation ROI compelling; Scandit directly substitutes
      or supplements manual scanning labor
    - What share of Scandit's new logos in 2024–2025 cite labor cost as primary driver? How does pricing reflect scan-volume
      versus headcount-saved?
  - - Omnichannel fulfillment demand
    - accelerator
    - Current; 2023–2028 peak build-out period
    - Real-time inventory accuracy required for BOPIS and ship-from-store; drives mobile scanning adoption at store level;
      30% higher CLV for omnichannel-capable retailers
    - What percentage of Scandit retail ARR is tied to omnichannel fulfillment programs versus back-office scanning?
  - - AI/computer vision algorithmic advances
    - accelerator
    - Current and expanding; 17.89% CAGR in AI in CV through 2034
    - Enables higher accuracy at lower hardware cost; Level 4 contextual barcode scanning in 2026; expands use cases for ID
      and shelf intelligence; narrows gap with purpose-built hardware
    - Review Scandit SDK 8 roadmap; confirm Level 4 contextual scanning delivery timeline and competitive response from Zebra/Honeywell
  - - Rugged-device hardware refresh cycle
    - constraint
    - 5–7 year cycle creates persistent friction
    - Enterprise customers on Zebra/Honeywell fleets have native scanning that defers Scandit evaluation until hardware refresh;
      creates a step-function adoption pattern
    - What is the estimated installed base of Zebra/Honeywell devices in Scandit's target verticals, and how many come up
      for refresh in 2025–2028?
  - - Identity fraud escalation and regulatory mandates
    - accelerator
    - Current; World Cup 2026 near-term catalyst
    - 1-in-25 fraud rate in 2025 creates urgent buyer demand for ID Bolt; EU AI Act identity provisions add compliance urgency;
      78% of travelers want single-device journey management
    - Confirm Scandit ID Bolt pricing model and gross margin relative to core SDK; assess whether identity verification volumes
      can sustain KLM's 500K scans/month scale at multiple customers
  - - Switching cost from deep SDK integration
    - constraint
    - Persistent; benefits installed base, creates friction for new wins
    - SDK embedded in WMS/TMS/ERP custom apps requires re-integration to displace; protects current ARR but also means evaluation
      cycles are long for greenfield enterprise prospects
    - Confirm average time-to-close for Scandit enterprise deals; assess whether switching cost creates net retention above
      110%?
  - - Trade tariffs and hardware supply disruption
    - constraint
    - Near-term; 2025–2026 tariff impact on GPU/scanner hardware
    - Fortune BI notes reciprocal tariffs disrupt AI hardware supply chain, delaying large-scale deployments; affects rugged-device
      customers who are already hardware-constrained
    - Assess Scandit's exposure to hardware-dependent customers who may delay deployment during tariff uncertainty
  - - Privacy regulation and data sovereignty
    - constraint
    - Medium-term; GDPR/CCPA enforcement + EU AI Act timeline
    - ID verification and shelf intelligence deployments require local data processing in privacy-sensitive jurisdictions;
      GDPR/CCPA adds compliance review steps to procurement; potential market access limitation
    - Confirm whether Scandit's on-device edge processing architecture fully satisfies EU AI Act high-risk identity provisions
  notes: 'Directions are relative to Scandit''s growth trajectory: accelerator increases adoption or deal velocity; constraint
    slows deployment speed, reduces market ceiling, or creates execution risk. Timing is indicative and based on publicly
    available market intelligence as of June 2026. Diligence asks are items requiring primary data-room or management confirmation
    that cannot be resolved from public sources.'
