chapter:
  number: 2
  title: Market Analysis
  summary: Scandit competes at the intersection of enterprise barcode scanning software, AI-powered computer vision, and augmented-reality-guided
    workflows — a market that has no single agreed boundary. Depending on scope, addressable spend in 2026 ranges from roughly
    $0.9 billion (mobile barcode scanner software only) to $27 billion (enterprise AI in computer vision) and $30 billion
    (warehouse automation). The widest SAM most consistent with Scandit's actual revenue base — enterprise barcode scanning
    SDK and smart-device data capture software — is plausibly $3–5 billion in 2026, growing at 6–10% CAGR. Retail (40% of
    industry revenue) and logistics/transportation (28%) are the dominant verticals; healthcare, air travel, and field service
    are growth pockets. The two most powerful demand drivers are chronic labor shortages in warehousing and the shift to omnichannel
    fulfillment requiring real-time inventory accuracy. Key adoption constraints include the depth of enterprise workflow
    integration (switching costs), the ongoing rugged-device refresh cycle that entrenches hardware-native SDK alternatives,
    and regulatory friction in identity verification. Multiple contradictory analyst estimates are preserved; the market cannot
    be reliably sized from public data alone without investor-grade primary research.
sections:
- id: section-1
  title: Market boundary and category definition
  body: 'Scandit''s operating market sits at the intersection of three overlapping categories: enterprise barcode scanning,
    AI-powered computer vision applied to physical objects, and augmented-reality workflow tooling for frontline workers.
    Defining the boundary is a material diligence task because analyst estimates in this space differ by an order of magnitude
    depending on what they include.

    The narrowest scoped definition — mobile barcode scanner applications, meaning software-only SDKs and apps that turn consumer
    or enterprise smartphones into barcode readers — yields a market of roughly $0.9 billion in 2026 with a 4.7–8.3% compound
    annual growth rate. This scope captures Scandit''s barcode scanning SDK and SparkScan/MatrixScan products most directly
    but excludes the broader workflow intelligence and ID verification products.

    A broader but still hardware-adjacent definition — barcode scanners and mobile computers combined — covers hardware devices,
    embedded firmware, and software applications from vendors such as Zebra, Honeywell, and Datalogic alongside pure software
    providers like Scandit. This scope produces estimates of $2.9–3.5 billion in 2026 at a 5.7–8.6% CAGR. Scandit''s software-only
    motion within this market means it competes on the software layer without the hardware attachment, making full market
    revenue share calculations misleading.

    Enterprise computer vision — the broadest category that encompasses all AI-powered machine perception from manufacturing
    quality inspection and autonomous vehicle vision to retail shelf intelligence and document scanning — is estimated at
    $27.0 billion globally in 2026 and growing at 17.89% CAGR through 2034. Scandit participates in specific verticals within
    this space (smart-device barcode scanning, ID verification, shelf intelligence) but does not address manufacturing defect
    inspection, autonomous navigation, security surveillance, or medical imaging, which collectively represent the majority
    of the broad market.

    Key spend that is correctly excluded from Scandit''s SAM includes: mobile device management platforms (MDM, an adjacent
    $10+ billion market that manages the devices on which Scandit runs but performs no data-capture function), rugged device
    hardware (the $10.4 billion enterprise rugged handheld market led by Zebra and Honeywell), enterprise resource planning
    software, general-purpose cloud vision APIs (Google Vision AI, AWS Rekognition) not targeting enterprise frontline workflows,
    and consumer barcode scanning utilities.

    Adjacent markets that Scandit is actively entering or that influence its addressable scope include: retail shelf intelligence
    and automated shelf monitoring ($5.58 billion smart shelves market in 2026 per Fortune Business Insights), healthcare
    barcode scanning for medication verification and asset tracking ($4.8 billion in 2026), and AI-powered identity and document
    verification (growing sharply due to a documented fraud surge reaching one fraudulent attempt per 25 verifications in
    2025).

    '
