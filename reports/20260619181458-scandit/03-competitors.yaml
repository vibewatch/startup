  - - "Datalogic (Borsa Italiana: DAL)"
    - Hardware-incumbent / embedded firmware
    - €493.8M FY2024 revenue; €241.1M H1 2025; ~20% AIDC market share; acquired Datema (EasyShop) Apr 2025
    - Retail, logistics, manufacturing, healthcare — EMEA stronghold
    - Manufacturing precision hardware; Memor mobile computers; EasyShop retail software via Datema acquisition; strong vitality index (27.2% new product sales)
    - No AR workflow SDK; software layer limited to embedded firmware; flat/declining revenue in fixed retail scanner segment
  - - Dynamsoft (private, Canada)
    - Pure-software SDK
    - Private; estimated mid-market SaaS revenues; entry SDK from ~$1,249/year; large developer user base
    - Industrial, manufacturing, server-side image processing, web app developers
    - Highest static-image batch detection accuracy in vendor benchmark (428 barcodes vs Scandit 178); fastest browser SDK (278 ms/image); broad symbology support
    - Benchmark is vendor-authored and measures static images only; no AR overlays; weaker enterprise frontline UI tooling; not focused on retail/logistics workflows
  - - Scanbot SDK (doo GmbH, Germany)
    - Pure-software SDK
    - Private; funded; pricing from fixed annual license (unlimited scans/devices); ~100–200 employees est.
    - Enterprise app developers; insurance, field service, healthcare; high-volume deployments
    - Fixed annual fee with unlimited scans/devices — pricing certainty advantage vs Scandit; detailed Cognex migration support; strong document scanning
    - No AR/MatrixScan workflow depth; no ID Bolt equivalent; no shelf intelligence; limited enterprise SLA
  - - Anyline (Vienna, Austria)
    - Pure-software SDK (OCR/text capture specialist)
    - ~$42M estimated 2026 revenue; $36–39M total funding; CEO change Feb 2026
    - Utilities (meter reading), logistics (license plates, VINs), automotive (tires), government
    - Mobile OCR for unstructured text fields; TireBuddy automotive SDK; custom model training; niche industrial verticals
    - Not a barcode scanning competitor in retail/warehouse; OCR-first, barcode-second architecture; smaller scale than Scandit
  - - Microblink / BlinkID (London / Brooklyn)
    - ID scanning and document OCR specialist
    - ~$28M estimated 2026 revenue; $60M total funding (Silversmith 2020 Series A); ~130–178 employees
    - Financial services KYC, telecom onboarding, digital identity, online verification
    - ~3B identity verifications processed 2025; 195-country coverage; advanced fraud detection; liveness and biometric matching
    - Not a barcode scanning competitor; ID-only; lacks frontline worker workflow tools; primarily digital/cloud KYC rather than physical touchpoint
  - - "Socket Mobile (NASDAQ: SCKT)"
    - Hardware + bundled SDK (small scale)
    - $14.8M TTM revenue Q1 2026; ~$7.2M market cap; ~53 employees
    - Point-of-sale retail, field service, inventory — Bluetooth scanner attachment for tablets/phones
    - CaptureSDK bundled with Bluetooth scanners; Shopify/Apple native integrations; low-cost scanner option for basic POS workflows
    - Hardware-dependent scanning via Bluetooth (not camera); no AR, no multi-barcode; effectively a POS peripheral, not an enterprise platform competitor
  - - Google ML Kit (Google LLC)
    - Platform API substitute
    - Free; integrated in Android and available for iOS; maintained by Google engineering teams
    - App developers building consumer or basic enterprise apps on Android/iOS
    - Zero licensing cost; on-device processing; Google ecosystem integration; broad Android OEM device coverage
    - No AR overlays; 10 barcodes per scan limit; no batch scanning; no ID document scanning; no enterprise SLA; detects ~120 barcodes in benchmark vs commercial leaders
  - - Apple VisionKit (Apple Inc.)
    - Platform API substitute
    - Free; native iOS/macOS only; maintained by Apple
    - iOS-native app developers; consumer and basic enterprise iOS deployments
    - Native iOS integration; zero cost; Apple hardware acceleration; no external dependency
    - iOS/macOS only — no Android or web path; no AR workflow; no customization for enterprise; not suitable for mixed-device fleets
  notes: >-
    Hardware revenue for Zebra, Honeywell, and Datalogic represents total company or segment revenue and is not
