- id: TP004
  title: Moat durability and competitive risk register
  columns:
  - moat claim
  - threat mechanism
  - severity
  - timeline
  - mitigation or diligence ask
  rows:
  - - Deep SDK integration in enterprise WMS/TMS/ERP apps creates multi-year switching cost
    - Competitor releases migration automation tool or compatible API contract; customer app modernization project resets integration baseline
    - High
    - Medium-term (3–5 years)
    - Verify Scandit NRR (not public); assess whether integration depth is confirmed by customer references; request churn analysis by cohort
  - - AR overlays and MatrixScan proprietary technology not matched by free or low-cost alternatives
    - Google/Apple invest in AR scanning APIs (ARKit/ARCore); Dynamsoft ships AR layer; open-source AR scanning matures
    - Medium
    - Medium-term (3–5 years)
    - Monitor Apple ARKit and Google ARCore scanning roadmaps; assess Dynamsoft AR development cadence; confirm patent coverage on MatrixScan architecture
  - - ETH Zurich ML research foundation and 17+ years of algorithm refinement
    - Well-funded competitor hires ETH/ML talent and compresses innovation timeline; open-source foundation models reduce proprietary advantage
    - Medium
    - Long-term (5+ years)
    - Review Scandit patent portfolio depth; confirm ongoing ETH collaboration active; assess founder-research team retention
  - - 2,100+ enterprise customer installed base and >98% support satisfaction
    - Incumbent customer wins by competitor on pricing; Scandit price increases trigger churn in price-sensitive segments
    - Medium
    - Near-term (1–3 years)
    - Request Scandit NRR and logo retention data (data room); confirm churn concentration by vertical; assess ACV distribution (large-account concentration risk)
  - - Cognex cmbSDK discontinuation creates forced migration pipeline for Scandit
    - Dynamsoft and Scanbot execute faster on Cognex migration with lower-friction pricing or documentation
    - Low
    - Near-term (2026–2027 window)
    - Track Cognex customer migration wins; measure Scandit's Cognex-migration pipeline contribution to new ARR; compare migration guide UX vs Dynamsoft/Scanbot
  - - Premium pricing perception — cost-at-scale is the primary competitive vulnerability per independent reviews
    - Budget-constrained enterprise (mid-market, public sector) moves to Scanbot unlimited model or free platform APIs; Scandit loses volume-scanning accounts
    - High
    - Current and ongoing
    - Confirm whether Scandit offers unlimited-scan pricing tier for high-volume customers; assess Scanbot win rate in competitive evaluations; request pricing flexibility data from Scandit sales
  - - Zebra's $593M FY2025 R&D and Elo Touch acquisition signal expansion into Scandit's software workflow territory
    - Workcloud platform adds AR, batch scanning, or SDK-level capabilities; Zebra enterprise customers reduce Scandit seat count
    - Medium
    - Medium-term (2–4 years)
    - Monitor Zebra Workcloud product roadmap announcements; assess Zebra SDK API capability gap vs Scandit annually; evaluate whether Scandit retains competitive superiority on mixed-fleet enterprises where Zebra tools do not apply
  - - Honeywell PSS divestiture to Brady creates strategic uncertainty in second-largest hardware incumbent install base
    - Brady does not invest in Operational Intelligence software; Honeywell enterprise customers accelerate shift to software-only solutions including Scandit; conversely Brady integrates Oi into a competing workflow platform
    - Medium
    - Near-term (2026–2027 transition)
    - Monitor Brady Corp software strategy post-acquisition close; track whether Honeywell PSS enterprise customers accelerate software-only evaluations; assess whether Scandit has a specific Honeywell-migration sales motion
  notes: >-
    Severity ratings (High/Medium/Low) represent the potential impact on Scandit's competitive position and ARR if the threat
    materializes, not the probability of occurrence. Timeline is approximate and based on public information about competitor
    investment and roadmap as of mid-2026. Diligence asks require primary data from Scandit's data room or management
    interviews and cannot be resolved from public sources.
  claimRefs:
  - CP033
  - CP034
  - CP035
  - CP036
  - CP037
  - CP038
  - CP039
  - CP040

