    scanner hardware market, not the software-layer data capture market where Scandit competes. Revenue and employee figures
    for Anyline, Microblink, and Scanbot are third-party estimates from Growjo, Tracxn, and company intelligence platforms
    and may differ from actual private figures. All financial data as of mid-2026 research date.
