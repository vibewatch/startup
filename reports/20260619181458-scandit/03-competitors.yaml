- id: TP003
  title: Pricing and packaging comparison
  columns:
  - vendor
  - pricing model
  - entry / minimum price
  - enterprise pricing
  - included capabilities
  - notable constraints or unknowns
  rows:
  - - Scandit
    - Tiered annual subscription (Core/Standard/Advanced) + per-device or per-scan options
    - Custom quote required; per-scan/per-device model available; ballpark $15–$50+/device/year (est. from industry ranges)
    - Custom enterprise contracts with volume discounts; flat annual fee at large scale
    - "Core: single barcode; Standard: batch, label scanning, markdown, task management; Advanced: inventory counting, track and trace; ID Bolt and ShelfView priced separately"
    - Pricing not publicly listed; custom quotes required; cost-at-scale cited as enterprise concern in reviews; feature tier gating may force upgrade cost
  - - Dynamsoft Barcode Reader
    - Per-feature/year, per-device, per-concurrent-device, per-domain, per-server, or per-instance
    - ~$1,249–$1,371/year for single web SDK feature license; 10,000-scan bundle for web ~$1,371/year
    - Device/server/instance pricing by custom quote; OEM licensing available
    - Barcode reading (1D/2D); OCR add-ons; document normalization; web and native SDKs
    - Entry price is for web SDK only; camera-mode and native mobile requires separate license; vendor-published benchmark methodology favors Dynamsoft's strengths
  - - Scanbot SDK
    - Fixed annual license fee; unlimited scans, unlimited devices, per licensed app/domain
    - Custom quote required; publicly positioned as cost-effective at high volume vs per-scan models
    - Fixed annual flat fee regardless of scan volume or device count
    - Barcode scanning, document scanning, credit card scanning, label OCR; feature set by tier
    - No AR/MatrixScan equivalent; no ID Bolt equivalent; no shelf intelligence; pricing not published (contact required)
  - - Anyline
    - Custom quote; usage-based or annual license
    - Not published; estimated competitive with Scanbot/Dynamsoft for niche verticals
    - Custom enterprise contracts
    - Mobile OCR for text fields (meter reading, tire sidewall, VIN, license plate); barcode scanning secondary
    - Primarily OCR-vertical, not barcode-platform; $36–39M total funding constrains enterprise investment capacity
  - - Microblink / BlinkID
    - Custom quote; per-scan pricing for identity verification
    - Not published; industry range for ID verification ~$0.50–$2.00/scan for comparable platforms
    - Volume-based enterprise contracts; custom for large KYC deployments
    - ID document scanning, MRZ reading, fraud detection, liveness (via partners); barcode on ID back
    - ID-only product; not a barcode scanning SDK; per-scan may scale to significant cost at airline/hospitality volumes
  - - Zebra DataWedge / EMDK
    - Free with Zebra hardware purchase
    - $0 for licensed Zebra device holders
    - $0 — included in device ownership
    - Barcode scanning, data routing, profile configuration (DataWedge); full hardware API access (EMDK)
    - Zebra-hardware only; zero interoperability with non-Zebra devices; no AR; limited to device-tier capabilities
  - - Google ML Kit barcode scanning
    - Free (open API, no licensing)
    - $0
    - $0 — no enterprise tier
    - Basic barcode detection (1D/2D); on-device; Android + iOS
    - Max 10 barcodes/frame; no AR; no batch-scan; no ID; no enterprise SLA; accuracy below commercial SDKs; iOS limited vs Scandit
  - - Apple VisionKit barcode scanning
    - Free (native iOS/macOS framework)
    - $0
    - $0 — no enterprise tier
    - Native barcode scanning; text recognition; object detection; Apple Silicon optimized
    - iOS/macOS only (no Android, no web); no AR workflow; no enterprise customization; no ID Bolt equivalent
  notes: >-
    All pricing data as of 2026-06-19 research date. Scandit per-device ballpark ($15–$50+/device/year) is derived from
    industry-wide commercial SDK benchmarks, not from Scandit's published pricing (not available). Actual enterprise pricing
    involves negotiated multi-year contracts with volume discounts that may materially differ. Dynamsoft entry price is from
    publicly listed ComponentSource and Capterra listings. Google ML Kit and Apple VisionKit pricing is confirmed as $0 from
    official documentation. Pricing structure comparisons are list/entry-level only; realized enterprise pricing is not
    observable from public sources.
  claimRefs:
  - CP013
  - CP015
