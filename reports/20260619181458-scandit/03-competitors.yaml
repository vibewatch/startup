  - - Honeywell PSS (being acquired by Brady Corp)
    - Hardware-incumbent / device management software
    - ~$1.1B FY2025 revenue; $1.4B Brady acquisition announced Apr 2026, expected H2 2026 close; ~18–22% market share
    - Warehouse, logistics, distribution, manufacturing — large rugged fleet accounts
    - Operational Intelligence (Oi) device fleet management; anomaly detection; SAML SSO; B2M partner for cross-vendor device support
