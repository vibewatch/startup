- id: section-3
  title: Substitute threats — platform APIs, shelf intelligence, ID verification, and status quo
  body: >
    Beyond named SDK competitors, Scandit faces meaningful substitute threats from platform-native
    barcode APIs, adjacent computer vision vendors in shelf intelligence and ID verification, internal
    build options, and the status quo of hardware-dedicated rugged devices.


    Google ML Kit and Apple VisionKit represent the most structurally significant long-term substitute
    threat. Both are free, developer-accessible barcode scanning APIs embedded in the mobile
    operating systems on which Scandit runs. Google ML Kit's barcode scanning module is available on
    both iOS and Android, requires no licensing cost, and processes data entirely on-device. Apple
    VisionKit is native to iOS 13.0+, iPadOS, and macOS, deeply integrated with the Apple hardware
    stack. Independent benchmarks show Google ML Kit detecting approximately 120 barcodes on a test
    set versus Apple Vision at 150 and commercial SDK leaders at 354 (Dynamsoft). Neither platform
    API supports AR overlays, multi-barcode simultaneous tracking (MatrixScan), batch-scanning
    optimization, or enterprise SLA guarantees. Google ML Kit caps at 10 barcodes per scan frame and
    Apple VisionKit is iOS/macOS-only with no Android deployment path. For enterprise deployments
    requiring mixed device fleets, batch scanning, AR guidance, or ID document validation, platform
    APIs do not substitute. However, for commodity use cases — a retail employee scanning one barcode
    at a time in a basic iOS app — platform APIs reduce the barrier to avoiding a commercial SDK
    entirely. As Google and Apple continue to invest in their vision frameworks, this substitution
    risk for low-complexity use cases will intensify.


    Open-source alternatives (ZXing "Zebra Crossing," ZBar) provide basic barcode scanning under
    Apache 2.0 and LGPL licensing respectively. ZXing is widely deployed in consumer apps but is
    not maintained at enterprise performance standards and lacks AR, ID scanning, and OCR
    capabilities. It represents the zero-cost status-quo alternative that budget-constrained teams
    evaluate before purchasing Scandit, particularly in SMB and developer-tool contexts.


    Shelf intelligence competitors including Trigo Vision, Focal Systems (now part of a broader
    portfolio), Standard AI, Simbe Robotics (Tally robot), and Trax Retail (merged with FORM in 2026)
    compete with Scandit's ShelfView product in the retail shelf intelligence space. These vendors
    predominantly use fixed ceiling-mounted cameras or autonomous shelf-scanning robots (Simbe's
    Tally) rather than mobile SDK deployments. Their architectural difference from Scandit is
    important: most shelf intelligence vendors capture data via a fixed-infrastructure investment
    (cameras, robots) and sell SaaS analytics, whereas Scandit's ShelfView leverages the mobile
    devices already deployed by store associates, avoiding new hardware capex. This creates a genuine
    competitive differentiation — Scandit's shelf intelligence approach has zero incremental hardware
    cost if devices are already licensed. However, fixed-camera vendors offer continuous monitoring
    versus Scandit's associate-triggered shelf capture, which may cover fewer shelf-scanning events
    per day in low-traffic situations.


    Cloud-based identity verification platforms (Jumio, Onfido by Entrust, Sumsub, IDnow, Acuant/GBG)
    compete with Scandit ID Bolt on digital onboarding and KYC workflows. These platforms are
    cloud-native, heavily compliance-focused (AML/KYC integration, liveness detection, biometric
    matching), and priced per-scan ($0.50–$2.00 per document verification). Scandit ID Bolt
    differentiates through on-device edge processing (useful for air travel and offline environments)
    and native mobile SDK integration into frontline worker apps. Cloud KYC platforms have larger
    customer counts in financial services and telecom; Scandit's ID Bolt strength is in physical
    touchpoints (airports, hospitality, healthcare) where connectivity is constrained or privacy
    sensitivity is high.

