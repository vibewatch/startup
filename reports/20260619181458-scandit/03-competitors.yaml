  evidenceGaps:
  - id: EP001
    type: private-evidence-only
    severity: material
    description: >-
      Scandit's net revenue retention (NRR) rate is not publicly disclosed; this is the single most
      important metric for assessing moat durability and switching-cost effectiveness. The >98% support
      satisfaction claim is company-reported and does not substitute for NRR. Without NRR, it is not
      possible to confirm whether the installed base of 2,100+ customers is expanding, contracting, or flat
      on a revenue-weighted basis.
    relatedQuestionRefs:
    - QP015
    diligencePath: >-
      Request NRR (net revenue retention) and gross revenue retention (GRR) from the data room, segmented by
      vertical (retail, logistics, healthcare) and cohort year. Request the churn log for accounts > $100K ACV
      that churned in 2023–2025 and the cited competitive displacement reason.

  - id: EP002
    type: missing-source
    severity: material
    description: >-
      The Dynamsoft static-image benchmark is the most widely cited performance comparison for Scandit vs.
      Dynamsoft, but it measures only browser-based static image decoding — not camera-mode or native mobile SDK
      performance. No independent, camera-mode enterprise SDK benchmark exists in public literature as of
      mid-2026. The absence of an independent camera-mode benchmark means Scandit's performance advantage in
      its primary deployment scenario is not corroborated by any public third-party test.
    relatedQuestionRefs:
    - QP003
    - QP027
    diligencePath: >-
      Commission or locate an independent camera-mode barcode scanning benchmark that tests Scandit, Dynamsoft,
      and Scanbot on real-device, real-environment scenarios (warehouse, low-light, damaged labels). Alternatively,
      request Scandit's own accuracy benchmarking methodology and independent validation. The Dynamsoft benchmark
      should be cited in competitive collateral with explicit scope caveats.

  - id: EP003
    type: private-evidence-only
    severity: material
    description: >-
      Scandit's competitive win/loss data — which competitors it beats most often, which it loses to, and on
      what criteria — is not publicly available. The pricing comparison analysis in TP003 is based on published
      SDK pricing from competitor sources and third-party estimates; Scandit's actual realized ACV per customer
      and the discount structures offered in competitive bids are unknown.
    relatedQuestionRefs:
    - QP004
    - QP019
    diligencePath: >-
      Request win/loss analysis from Scandit's sales data room, including top three competitive displacement
      losses and the most common objection in lost deals. Request average ACV by product tier and any
      competitive pricing responses offered to retain at-risk accounts.

  - id: EP004
    type: stale
    severity: minor
    description: >-
      Revenue estimates for Anyline (~$42M), Microblink (~$28M), and Scanbot SDK are derived from third-party
      intelligence aggregators (Growjo, Tracxn, compworth.com) that estimate revenue from headcount models and
      industry proxies, not from financial disclosures. These companies are private and may have revenues that
      differ substantially from estimates. Estimates for Scanbot in particular could not be confirmed from any
      independently cited source in this research.
    relatedQuestionRefs:
    - QP011
    - QP012
    diligencePath: >-
      Request updated Anyline, Microblink, and Scanbot revenue estimates from PitchBook, CB Insights, or
      LinkedIn headcount growth signals. For competitive impact, focus on relative scale (Scandit at ~$119M ARR
      vs Anyline at ~$42M and Microblink at ~$28M) rather than precision point estimates.

  - id: EP005
    type: missing-source
    severity: moderate
    description: >-
      No public source documents Scandit's specific competitive win rate against Zebra DataWedge in
      mixed-fleet enterprise RFPs. The hypothesis that mixed-fleet enterprises (combining Zebra and
      non-Zebra devices) favor Scandit is logically sound but not confirmed by any case study, analyst
      survey, or win/loss report in publicly available research.
    relatedQuestionRefs:
    - QP021
    - QP025
    diligencePath: >-
      Request from Scandit any case studies or win/loss data that specifically document competitive displacement
      of Zebra DataWedge on mixed-fleet accounts. Confirm the estimated percentage of Scandit's enterprise base
