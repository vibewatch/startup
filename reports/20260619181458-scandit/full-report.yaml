              retailers investing 208% more in inventory visibility when in profit-growth mode. By combining the
              MarketLab fixed-camera IP with mobile and robot capture modes, Scandit is positioning ShelfView as a
              recurring analytics platform — not a one-time SDK integration. This shifts the revenue model for retail
              customers from license fees toward platform subscriptions, and opens adjacencies in CPG monetization and
              store associate performance analytics.
