companyProfile:
  summary: >-
    Scandit AG is a Swiss private enterprise software company founded in November 2009 by three ETH Zurich computer
    vision researchers. The company has built the leading smart data capture platform, which converts any
    camera-equipped smart device — smartphones, tablets, handheld computers, wearables, drones, and fixed cameras — into
    an enterprise-grade barcode scanner, ID document reader, and AR-guided workflow tool. As of mid-2026, the platform
    processes 80 billion barcode scans annually across 170 million+ active devices, serving 2,100+ enterprise customers
    in retail, logistics, healthcare, manufacturing, and air travel. Scandit achieved unicorn status in February 2022
    with a $150M Series D led by Warburg Pincus at a $1B+ post-money valuation. The most recent publicly disclosed ARR
    figure is $119.1M as of November 2024 (CEO-disclosed via LATKA), implying approximately 240% year-over-year growth
    from $35M in December 2023 — a figure that requires independent corroboration.
  foundedDate: '2009-11-01'
  founders:
    - name: Samuel Mueller
      role: CEO & Co-founder
