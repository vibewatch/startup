              diligence
            body: >-
              Scandit's public case study library and named customer evidence is heavily concentrated in retail
              (Walmart, Staples Canada, OK Corporation, Kroger, VF Corporation) and logistics (Swiss Post, Dior, Shipt,
              Yodel). Healthcare has one strong proof point (Leeds Teaching Hospitals NHS Trust, with GS1 corroboration)
              and one production deployment (Artivion), but no named US hospital network, health system, or major
              pharmacy chain case study. Manufacturing and field service references exist in the casestudies.com library
              (American Woodmark, Cincinnati Bell, British Gas) but without quantified first-party outcomes on the
              Scandit website. Any investor relying on healthcare or manufacturing vertical growth should request
