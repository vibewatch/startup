      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >
              Enterprise data capture transactions involve distinct buyer, user, and payer roles that are rarely the
              same person. Understanding this segmentation is essential for assessing Scandit's land-and-expand model
              and the stickiness of its contracts.

              Retail is the largest vertical and Scandit's strongest foothold. Retail accounts for 40% of global barcode
              scanning industry revenue. Buyers are IT or digital transformation executives; users are store associates,
              warehouse pickers, and self-checkout customers; payers are corporate IT and operations budgets. The
              adoption trigger is typically an omnichannel fulfillment initiative, a BOPIS (buy online, pick up in
              store) rollout, or a workforce productivity program. Research conducted by IHL Group and published in
              Scandit's 2026 report found that 36% of retailers plan to deploy hybrid data capture strategies, with a
              further 21% planning adoption within 24 months. Retailers who have adopted hybrid data capture are 136%
              more likely to maintain profitability leadership.

              Logistics, transportation, and post/parcel represent the second-largest vertical at 28% of barcode
              scanning industry revenue. Buyers are operations or IT leaders at logistics companies, last-mile carriers,
              or postal services; users are warehouse workers, drivers, and sorting staff; payers are operations budgets
              with direct ROI measurement on error rates and throughput. Scandit's own 2026 Delivery Trends Report
              (co-authored with Woop) quantifies the ROI for AR-guided last-mile operations: a 30% reduction in loading
              errors and savings of over $500,000 per depot annually. FedEx, DHL, La Poste, and Swiss Post are named
              customers (ch1 reference).

              Healthcare buyers are hospital IT departments and pharmacy procurement teams; users are nurses,
              pharmacists, and clinical support staff; payers are hospital systems and, in regulated markets,
              reimbursement systems that require medication scanning for compliance. Healthcare barcode technology is
              one of the more constrained buyer segments because IT procurement cycles are long and regulatory
              compliance requirements (FDA UDI in the US, EU MDR traceability) create switching barriers in both
              directions. NHS UK and Johns Hopkins Hospital are named deployments.

              Air travel and identity verification represent a fast-growing adjacent segment. Airlines and airport
              operators are buyers; frontline gate agents, check-in staff, and immigration officers are users;
              operational budgets and IATA/government mandated compliance are payers. KLM processes approximately
              500,000 identity document scans per month via Scandit ID Bolt. Air France-KLM implemented Scandit to allow
              pre-verification of travel documents, preventing denied boardings and reducing financial penalties. The
              2026 World Cup travel surge is identified by Scandit as a near-term demand catalyst for identity
              verification solutions.

              Field service and manufacturing are slower-adoption segments. Scandit customers here include companies
              deploying inspection and asset management workflows. The buyer is typically an IT or facilities manager;
              the payer is an operations budget. Adoption trigger is typically a specific workflow digitization project
              rather than a strategic platform decision.

              Across all verticals, the land-and-expand pattern (documented in ch1) means that initial deal size
              understates total contract potential: a retail customer who deploys Scandit for BOPIS picking may expand
              to self-checkout, shelf intelligence, and supply-chain receiving. Average ACV implied by $119M ARR /
              ~2,100 customers is approximately $57K, but the distribution skews toward large enterprise contracts at
              $100K–$500K+ at the top end.
