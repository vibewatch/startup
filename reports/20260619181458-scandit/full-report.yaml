      - number: '7.2'
        title: Technology, competitive, and platform dependency risks
        blocks:
          - type: paragraph
            body: >-
              Scandit faces a two-sided technology risk: commoditisation from below by free and open-source
              alternatives, and performance credibility risk from benchmark comparisons published by competing
              commercial SDK vendors.


              On commoditisation, Google ML Kit Barcode Scanning provides free, on-device scanning for Android and iOS
              with support for standard 1D/2D formats, suitable for basic enterprise use cases such as inventory
              lookups, event check-in, and loyalty programmes. ZXing, ZBar, and QuaggaJS serve as zero-cost alternatives
              for development teams with simpler requirements. The expanding coverage of these free tools erodes
              Scandit's addressable market at the lower end: organisations with straightforward scanning needs and no
              requirement for augmented-reality overlays, multi-barcode tracking, or high-throughput logistics workflows
              face declining justification for Scandit's premium pricing. The worldmetrics.org 2026 barcode scanning
              software rankings place Scandit #1 but immediately below it sit ML Kit, AWS Panorama, and Microsoft Azure
              AI Vision — all of which offer barcode scanning as a bundled feature within broader cloud-platform
              ecosystems, creating substitution risk for customers already invested in those platforms.


              On benchmark performance, a comparative SDK test published by barKoder assessed damaged PDF417 barcode
              samples and reported Scandit's decoding success rate at 47.61%, versus barKoder's 90.4%, Scanbot's 52.38%,
              and Dynamsoft's 42.85%. A separate benchmark for rotated-image scenarios showed higher detection accuracy
              for Dynamsoft compared to Scandit. These results are published by a direct competitor (barKoder) and
              should be treated as potentially self-serving; they may not reflect Scandit's real-world performance in
              the high-throughput enterprise conditions where it most competes. Scandit has never published its own
              independent benchmark report. The absence of third-party benchmark audits of Scandit's Vision AI Engine —
              which is proprietary and closed-source — is a diligence gap: customers and investors cannot independently
              verify scanning accuracy claims across the full symbology and condition matrix.


              Platform dependency is a structural risk. Scandit's SDK on iOS depends on Apple's AVFoundation camera
              framework; any Apple-initiated breaking change, API deprecation, or App Store policy shift could require
              immediate SDK updates and emergency patches to enterprise customers. The same applies to Android camera
              stack APIs (Camera2/CameraX). While all major barcode-scanning SDK vendors face the same dependency,
              Scandit's scale (170 million+ active devices) amplifies the blast radius of any unpatched incompatibility.
              ShelfView, Scandit's shelf intelligence product, introduces an additional cloud dependency (EU-based data
              centres, undisclosed cloud provider) that creates an uptime and availability risk not present in the
              on-device product lines.


              Finally, Scandit's integration partnerships with SAP, Pega, and Google AppSheet create a distribution
              dependency: if any of these platforms changes its partner programme economics, terminates the integration,
              or introduces a competing native capability, Scandit's embedded workflow distribution channel would be
              disrupted. Honeywell and Zebra, as major enterprise hardware incumbents, bundle their own scanning
              software and create channel conflict risk at the hardware refresh layer.
