      - number: '8.4'
        title: Investment thesis, anti-thesis, and recommendation stance
        blocks:
          - type: paragraph
            body: >
              The investment thesis for Scandit rests on five pillars. First, platform dominance in a defensible niche:
              Scandit is the global #1 enterprise data capture SDK, with 170M+ active devices, 2,100+ enterprise
              customers across retail, logistics, healthcare, and manufacturing, and a 17-year technology advantage
              rooted in the ETH Zurich computer vision department. No comparable pure-play SDK platform exists at this
              scale and breadth. Second, land-and-expand economics: the ARR acceleration from $35M (December 2023) to
              $119.1M (November 2024) — if confirmed — indicates that the land-and-expand engine is firing across large
              accounts, with the Walmart 1.3M-associate renewal as the flagship example. Third, AI-enablement premium:
              the company's computer vision engine, MatrixScan AR, and ShelfView hybrid data capture are increasingly
              AI/ML-driven, positioning Scandit in the AI-enabled SaaS bracket (7–9× private multiple) rather than the
              legacy SaaS median (3.4×). Fourth, strategic optionality: Scandit is an attractive acquisition target for
              industrial automation (Zebra, Honeywell), enterprise software (SAP, Salesforce), and logistics platform
              (XPO, FedEx Technology) buyers, providing multiple exit vectors beyond IPO. Fifth, operational efficiency:
              at ~$327K ARR/FTE, Scandit is near the top quartile for its ARR cohort, suggesting it has already made the
              cost rationalisation investments required for a path to profitability.


              The anti-thesis centres on four risk factors. First, stale valuation: the $1B 2022 mark is priced at 8.4×
              current ARR against a 3.4× public market median, requiring roughly 60% multiple recovery or significant
              ARR growth to be justified at entry. Second, disclosure opacity: without audited financials, NRR, GRR, or
              customer concentration data, the 240% ARR growth claim is unverifiable and the land-and-expand thesis
              cannot be confirmed. Third, SaaS multiple compression: the Q1 2026 SaaSpocalypse has materially re-rated
              the comparable universe downward, and recovery to 8× median is not foreseeable in the near term. Fourth,
              competitive and commoditisation pressure: free SDKs from Google, AWS, and Microsoft continue to erode the
              low-to-mid scanning market, and the absence of a published third-party accuracy benchmark for Scandit's
              Vision AI Engine remains a credibility gap.


              The recommendation stance is **track**: hold the company under active observation, do not enter at the $1B
              valuation mark, and commit to a conditional buy if either (a) entry can be negotiated at ≤7× confirmed
              forward ARR (approximately $840M on $120M ARR), (b) data-room access confirms NRR ≥115% and ARR ≥$130M for
              FY2025, or (c) a secondary market opportunity arises at a meaningful discount to the 2022 post-money. In
              an M&A exit context, Scandit carries genuine strategic value that could support a premium above the
              base-case financial valuation; this is the primary upside optionality worth preserving.
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV035
      - number: '8.5'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >
              Warburg Pincus's typical growth equity hold period of four to seven years from a February 2022 investment
              implies a target liquidity event in the 2026–2029 window. As of mid-2026, three exit pathways are
              available. The IPO pathway is effectively closed: no venture-backed SaaS unicorn filed to go public in Q1
              2026, Liftoff withdrew its planned IPO in February 2026, and the PitchBook Q1 2026 report notes that the
              long-anticipated Databricks, Anthropic, and OpenAI listings remain on deck for later in 2026 with no
              confirmed timeline. Scandit at $119M ARR and no public comparables at scale is unlikely to be a near-term
              IPO candidate in the current environment. The strategic M&A pathway is more plausible: the combination of
              2,100+ enterprise customers, 170M active devices, deep SAP/Pega/Google AppSheet ecosystem integrations,
              and 17 years of computer vision IP creates a strategic asset that could command an acquisition premium
              above the financial multiple. Credible acquirers include Zebra Technologies (seeking to replace hardware
              scanner revenue with SaaS ARR), Honeywell Safety & Productivity Solutions (similar rationale post the
              Honeywell SPS divestiture discussions), SAP (to embed scanning natively in EWM/WM workflows),
              Salesforce/ServiceNow (to extend field service and last-mile automation), and private equity platforms
              pursuing industrial software roll-ups. Secondary market activity (selling Warburg Pincus's position or
              earlier investors' stakes) is a third option but would require agreement on a price that acknowledges the
              valuation gap.


              Six thesis-break triggers require monitoring. The most acute is confirmed ARR below $100M for FY2025,
              which would indicate that the 2024 acceleration was non-recurring and the growth story collapses. A second
              is confirmed NRR below 100%, indicating net customer contraction contrary to the land-and-expand thesis. A
              third is the materialisation of Walmart concentration risk through a public disclosure of a major contract
              reduction. A fourth is a formal down round at a valuation below $800M (signalling distressed financing and
              investor acknowledgment of the valuation gap). A fifth is Google ML Kit capturing measurable mid-market
              share from Scandit in any major vertical within 12 months, forcing ACV compression. A sixth is EU AI Act
              Annex III classification of ID Bolt/ID Validate as high-risk AI systems creating compliance costs that
              erode ID scanning margins post-2027.
            claimRefs:
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV005
            claimRefs: []
          - type: table
            tableRef: TV006
            claimRefs: []
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Stale 2022 valuation creates a 2.5× multiple gap versus 2026 public SaaS benchmarks
            body: >-
              Scandit's $1 billion Series D mark (February 2022) implies 8.4× its last-disclosed ARR. The SaaS Capital
              Index median fell to 3.4× by May 2026 — roughly 60% below Scandit's 2022 entry price. Any new investor
              entering at the 2022 mark is paying more than double the current SaaS market median without verified NRR,
              audited ARR, or cohort data to support the premium. This is the single most actionable risk for a new
              entrant.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV007
          - type: callout
            title: Track — conditional buy threshold is ≤7× confirmed forward ARR
            body: >-
              Scandit has genuine strategic assets, a defensible market position, and an AI-enabled platform that
              warrants above-SaaS-median pricing. The appropriate entry price is ≤7× confirmed FY2025 ARR (approximately
              $840M–$910M if ARR is $120–130M) with NRR ≥115% and data-room access to cohort retention and customer
              concentration data. Without these conditions, the recommendation is to track and wait for either a price
              correction, a secondary market opportunity, or M&A process initiation.
            calloutType: recommendation
            claimRefs:
              - CV032
              - CV033
              - CV038
          - type: callout
            title: Strategic M&A premium is the primary upside optionality
            body: >-
              In a financial valuation, Scandit's base case is $780M–$1.04B. However, strategic acquirers (Zebra
              Technologies displacing hardware revenue with SaaS ARR, SAP embedding scanning in its EWM workflows,
              Honeywell SPS seeking software-first capabilities) would likely pay a 30–50% strategic premium above
              financial value. This M&A optionality — plausible given the Warburg Pincus exit timeline — is the scenario
              where the 2022 $1B mark is validated or exceeded.
            calloutType: insight
            claimRefs:
              - CV036
              - CV040
