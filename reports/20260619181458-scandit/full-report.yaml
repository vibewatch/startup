      - CE029
      - CE037
  - id: FU001
    title: Customer journey map — from awareness to multi-workflow expansion
    type: journey-map
    layout: wide
    summary: >-
      Scandit's customer journey progresses through five stages: discovery and evaluation, pilot deployment, production
      launch, multi-workflow expansion, and strategic partnership. Named customer examples confirm each stage in public
      evidence. The journey map highlights the land-and-expand mechanics that underpin Scandit's commercial model.
    data:
      nodes:
        - id: stage-discovery
          label: Discovery & evaluation
          detail: >-
            IT or digital transformation leader identifies barcode/ID scanning need. Scandit trial (30-day free trial)
            or SDK evaluation. Benchmark against open-source (ZXing, Google ML Kit) or hardware vendors (Zebra,
            Honeywell). Median time to first scan under 1 hour per Scandit SDK documentation.
          segment: IT/Digital buyer
          tone: neutral
        - id: stage-pilot
          label: Pilot deployment (1–3 stores/sites)
          detail: >-
            Single-site or small-footprint pilot. Scandit provides trials, solution design, integration, and CS support
            included. Staples Canada: 3-store pilot. Artivion: tested in March 2023, deployed July 2023. Shipt: parallel
            SDK evaluation during COVID-19 demand surge. OK Corporation: online supermarket app built in 3 months.
          segment: IT + Operations buyer
          tone: positive
        - id: stage-production
          label: Production launch
          detail: >-
            Full deployment to target workforce or customer base. Staples Canada: all 298 stores, 1,200 iPhones. Swiss
            Post: national last-mile deployment. Leeds NHS: all wards. Shipt: 89K monthly active devices. OK
            Corporation: all 135 stores.
          segment: Enterprise-wide
          tone: positive
        - id: stage-expand-workflow
          label: Multi-workflow expansion
          detail: >-
            Expansion from pilot use case to adjacent workflows. Staples Canada: front-of-store pricing → back-of-store
            receiving and cycle counting. Artivion: North America → EMEA, 1D → 2D barcodes. Dior: one warehouse → all
            Hardis WMS DCs globally. OK Corporation: picking → POP/price-tag management.
          segment: Cross-functional
          tone: positive
        - id: stage-strategic
          label: Strategic partnership
          detail: >-
            Formal renewal and expanded commercial relationship. Walmart: renewed June 2025 with expanded scope for
            additional associate and customer-facing apps. Scandit CEO quoted alongside Walmart VP Product in
            announcement. Dior: plans for global rollout.
          segment: C-suite / VP level
          tone: positive
        - id: stage-risk-exit
          label: Churn / competitive displacement (adverse)
          detail: >-
            No named customer churn events found in public record. Pricing complaints identified in G2/PeerSpot reviews
            may affect budget-sensitive or SMB buyers. Competitive risk from Honeywell Mobility Edge, Zebra
            Software/DataWedge, and open-source ZXing/MLKit for cost-sensitive or hardware-bundled deployments.
          segment: Risk flag
          tone: warning
    approximationNotes: >-
      Journey stages are constructed from cross-referencing named customer case studies. Timelines are illustrative;
      actual stage duration varies by customer. No internal CRM or pipeline data was available.
    claimRefs:
      - CU005
      - CU008
      - CU009
      - CU011
      - CU015
      - CU023
      - CU028
      - CU034
