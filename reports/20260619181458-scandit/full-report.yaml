  - id: FV001
    title: Recommendation logic — from evidence to investment stance
    type: flow
    layout: wide
    summary: >-
      Logic chain linking Scandit's scale, platform proof, and risk evidence to the valuation gap assessment and
      resulting track / conditional-buy recommendation.
    data:
      nodes:
        - id: scale
          label: Scale / proof
          detail: >-
            $119.1M ARR (Nov 2024, unaudited); 2,100+ enterprise customers; 170M+ active devices; Walmart 1.3M-associate
            renewal Jun 2025
          tone: positive
        - id: moat
          label: Platform moat
          detail: >-
            17-year ETH Zurich CV lineage; 23+ patents; MatrixScan/ID Validate/ShelfView platform depth;
            SAP/Pega/AppSheet integrations
          tone: positive
        - id: risk_val
          label: Valuation risk
          detail: >-
            $1B 2022 mark at 8.4× ARR vs 3.4× SaaS median; 2.5× premium requires NRR/growth confirmation; stale
            4-year-old mark
          tone: negative
        - id: risk_disc
          label: Disclosure risk
          detail: >-
            No NRR, no audited financials, no customer revenue breakdown; ARR growth unverified; 240% YoY requires
            corroboration
          tone: negative
        - id: comps
          label: Comparable bracket
          detail: >-
            SaaS median 3.4×; AI-enabled private 8–9×; Cognex 11×; Windsor Drake LMM premium 7×; base-case 6–8× =
            $780M–$1.04B
          tone: neutral
        - id: entry_cond
          label: Entry condition
          detail: ≤7× confirmed forward ARR (~$840M on $120M ARR); NRR ≥115% verified; or M&A exit at strategic premium
          tone: neutral
        - id: recommend
          label: 'Recommendation: TRACK'
          detail: >-
            Conditional buy if entry price and data-room evidence thresholds met; no buy at $1B 2022 mark in current
            SaaS environment
          tone: neutral
      edges:
        - from: scale
          to: comps
        - from: moat
          to: comps
        - from: risk_val
          to: comps
        - from: risk_disc
          to: comps
        - from: comps
          to: entry_cond
        - from: entry_cond
          to: recommend
    approximationNotes: >-
      Flow nodes summarise multi-source evidence; individual values are derived from cited sources throughout this
      chapter.
