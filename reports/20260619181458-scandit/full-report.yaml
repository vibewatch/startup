      - number: '1.4'
        title: Scale metrics, cover KPIs, and key gaps
        blocks:
          - type: paragraph
            body: >
              Scandit's public traction metrics are substantial. The homepage reports 2,100+ customers, 170M+ active
              mobile devices, 50B+ scans per year across the full platform, and a 98% NPS score. The website barcode
              scanning page separately quotes 80 billion barcode scans per year, representing the core SDK workload.
              These are company- stated figures, not independently audited, and should be treated as company claims for
              diligence purposes.


              The ARR figure that is most widely cited in public sources is $119.1M reported as of November 2024 via
              LATKA, a database that aggregates founder-disclosed SaaS metrics. This represents a steep increase from
              $61.9M reported earlier in 2024 and $35M in late 2023. The LATKA methodology relies on founder interviews
              and is not independently audited, but the directional ARR trajectory — tripling between late 2023 and late
              2024 — is consistent with the Series D press release statement that ARR doubled between the May 2020
              Series C and the February 2022 Series D. Average annual contract value per customer implied by the LATKA
              ARR and customer count (approximately $119M / ~1,000 customers reported at Series D time) is approximately
              $119K, consistent with an enterprise-caliber ACV.


              Headcount data presents a diligence gap. Wikipedia cites 550 employees as of 2022 based on contemporaneous
              sources. Secondary databases report figures in the range of 364 to 392 employees as of late 2024 and 2025.
              This apparent decline from the 2022 peak is consistent with the Series D press release commitment to grow
              the globally distributed team by another 50% in 2022 not appearing to have been sustained at that rate
              through the 2023–2025 period. No public WARN Act filings or press reports of structured layoffs at Scandit
              have been identified. The headcount discrepancy should be treated as a material diligence gap requiring
              confirmation from company data room.


              The company serves six primary verticals: retail (largest, includes 8 of top 10 U.S. grocers),
              post/parcel/ express (includes 3 of top 5 global courier companies), air travel, healthcare, supply
              chain/manufacturing, and field service. Named customer relationships confirmed in public sources include
              Walmart (renewed June 2025), FedEx, DHL, Levi Strauss & Co, Sephora, Instacart, Carrefour, NHS UK, Alaska
              Airlines, Kroger, 7-Eleven, Swiss Post, Johns Hopkins Hospital, Toyota, La Poste, VF Corporation,
              Lufthansa, and Carrefour Poland (via MarketLab).
