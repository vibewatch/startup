            title: Self-reported NPS of 98% is unverifiable and statistically implausible without methodology disclosure
            body: >-
              Scandit's homepage prominently displays a 98% NPS score. No survey methodology, sample size, survey date,
              response rate, or independent survey provider is cited. An NPS of 98% would place Scandit in the highest
              tier of any enterprise software benchmark globally — a tier occupied by a handful of consumer brands and
              virtually no enterprise SaaS provider. G2 reviews, the only independent third-party review dataset, show
