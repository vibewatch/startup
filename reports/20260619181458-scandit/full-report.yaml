      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market definition ambiguity is a core valuation risk
            body: >-
              The 30× variance in market size estimates ($0.91B–$27B) is not analyst error — it reflects genuine
              uncertainty about which market Scandit actually competes in. A software-only barcode SDK company billing
              $119M ARR in a $0.91B narrow market implies 13% penetration (capped growth). The same company in a $5B+
              enterprise CV market implies sub-3% penetration (large runway). Investors must define the boundary before
              applying multiples. The most defensible construct for Scandit's SAM is $3–5B, implying a 2–4% penetration
              rate and substantial headroom.
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
              - CM015
              - CM017
              - CM018
          - type: callout
            title: Labor shortages and omnichannel fulfillment create durable demand tailwinds
            body: >-
              Two structurally durable drivers — persistent warehouse labor shortages (50–70% of costs, 7–9% annual wage
              growth) and the omnichannel retail build-out — create a demand environment where mobile scanning
              automation pays back quickly and where the ROI is measurable. These are multi-year secular trends, not
              cyclical catalysts, which supports long-cycle enterprise software contract duration.
            calloutType: strength
            claimRefs:
              - CM029
