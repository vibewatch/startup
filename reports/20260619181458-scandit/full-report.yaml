  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Value / Multiple
      - Relevance to Scandit
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the four most relevant publicly available reference points for Scandit valuation as of June 2026: the two
        public company comps in the scanning/CV space (Cognex and Zebra), the closest M&A precedent in the barcode SDK
        sector (Scanbot SDK), the private AI-enabled SaaS benchmark dataset (Finro Q1 2026), and the two primary public
        SaaS index references (SaaS Capital and PitchBook). Not exhaustive due to limited disclosed private comparables.
    rows:
      - - Cognex Corporation (CGNX) — public
        - EV/Revenue (mid-2026)
        - ~11× ($11B EV / $994M FY2025 revenue)
        - Best-available pure-play machine vision public comp; barcode scanning is core to Cognex product lines
        - Hardware-heavy (67% gross margin vs Scandit ~78% est.); $994M scale vs $119M ARR; different buyer profile
      - - Zebra Technologies (ZBRA) — public
        - EV/Revenue (mid-2026)
        - ~2.6× ($14B EV / $5.4B FY2025 revenue)
        - Enterprise data capture/scanning incumbent; Scandit directly displaces Zebra hardware customers
        - Hardware-majority (48% gross margin); $5.4B scale; low-growth legacy hardware multiple; floor reference only
      - - SaaS Capital Index (SCI) — pure-play SaaS median
        - EV/ARR (May 2026)
        - 3.4× (median, 68 constituents; 3.4× SaaS Capital and Aventis Advisors independently)
        - Broad benchmark for pure-play SaaS companies traded publicly; establishes 2026 market floor
        - Public companies only; no premium for vertical niche, AI-enablement, or strategic value
      - - PitchBook Enterprise SaaS Comp Sheet — public SaaS median
        - EV/TTM Revenue (Q1 2026, 99 companies)
        - 3.3× (median, March 31, 2026; down from 4.9× at year-end 2025 and 6.2× at year-end 2024)
        - Independent SaaS median from institutional source; confirms SaaS Capital reading
        - Broader constituent universe including some hardware/services revenue; not exclusively pure SaaS
      - - AI-enabled private SaaS — VC rounds (Finro Q1 2026)
        - EV/Revenue (2026, VC-round median)
        - 8–9× (private AI-enabled SaaS VC rounds; AI-native at 21×)
        - Applicable bracket if Scandit's CV/ML architecture counts as AI-enabled, not legacy SaaS
        - Dataset median; no Scandit-specific comparable; wide dispersion within AI-enabled category
      - - Scanbot SDK (M&A, July 2025)
        - EV/ARR (implied)
        - ~6–12× est. (€7M ARR; acquired by Apryse/Thoma Bravo; consideration undisclosed)
        - Only disclosed recent M&A in the barcode/document scanning SDK sector; direct product comparability
        - Scale gap (€7M vs $119M ARR); no disclosed consideration; acquirer is roll-up PE not strategic buyer
      - - Windsor Drake private LMM SaaS (Rule of 40 >50, NRR >120%)
        - EV/Revenue (2025-2026 private LMM)
        - 7× (premium bracket; median is 4–5×; 7×+ for Rule-of-40 >50 and NRR >120%)
        - Applicable if Scandit can demonstrate Rule of 40 compliance and confirmed NRR
        - Lower middle market dataset; different scale from Scandit ($119M ARR is mid-market not LMM)
    notes: >-
      All public multiples as of mid-June 2026 from cited public sources. Scanbot SDK consideration is undisclosed;
      multiple range is estimated from market benchmarks. AI-enabled bracket from Finro Q1 2026 dataset of 575
      companies. Scandit's applicable bracket is 6–9× depending on NRR and growth confirmation. Cognex serves as a
