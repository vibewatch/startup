      - number: '7.3'
        title: Financial, valuation, disclosure, and customer concentration risks
        blocks:
          - type: paragraph
            body: >-
              Scandit's financial risk profile is materially constrained by its private-company opacity. The last
              publicly disclosed ARR figure is $119.1 million, reported by the CEO in November 2024 via LATKA. No
              audited financial statements, annual report, or independent revenue verification is publicly available. No
              NRR (net revenue retention), GRR (gross revenue retention), churn rate, burn rate, or unit economics data
              has been disclosed. This opacity forces investors to rely entirely on founder-disclosed metrics, creating
              adverse selection risk in valuation discussions.


              The $1 billion valuation established in the February 2022 Series D round, led by Warburg Pincus, implies
              approximately 8.4× ARR multiple against the $119.1 million figure. The SaaS Capital 2025 benchmark places
              the public SaaS median valuation multiple at approximately 7.0× current run-rate ARR, having declined
              roughly 60% from its 2021 peak. At $119.1 million ARR with no disclosed growth rate more recent than
              end-2024, Scandit's Series D headline valuation of $1 billion may be stretched relative to 2026 market
              conditions; a fair-value re-rate using current SaaS multiples could value the company in the $700–850
              million range depending on growth assumptions, significantly below the last-round price. This creates
              down-round risk for any new financing, and signals potential tension with Warburg Pincus's typical 4–7
              year PE hold, which would target a 2026–2029 liquidity event window.


              Customer concentration is a related risk. Walmart is the largest single named enterprise customer — 1.3
              million associates on Scandit's platform, partnership renewed June 2025. No customer revenue contribution
              percentage is disclosed; it is impossible to determine from public sources whether Walmart constitutes 5%,
              10%, or 20%+ of total ARR. Standard institutional diligence thresholds flag any single customer above
              10–15% of revenue as a material concentration risk requiring scenario modelling. The absence of a revenue
              breakdown means this risk cannot be sized. If Walmart were to reduce scope, renegotiate pricing
              aggressively, or insource scanning capability, the revenue impact could be disproportionate to Scandit's
              scale. Beyond Walmart, no other customer's revenue contribution is disclosed.


              The review signal is also sparse. Scandit has fewer than 20 verified reviews on G2 (listed as js-only
              access on fetch) and 3 on SoftwareFinder. The FeaturedCustomers.com page lists 177 customer references but
              these are marketing-facing, not independently scored reviews. The company's self-reported 98% NPS has no
              third-party audit. This sparse independent review footprint, combined with opaque pricing (custom quotes
              only), creates buyer-side friction and limits market confidence signals available to investors.
