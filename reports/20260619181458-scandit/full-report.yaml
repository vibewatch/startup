  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and module capabilities
        blocks:
          - type: paragraph
            body: >
              Scandit's commercial product portfolio as of mid-2026 spans six distinct product lines organized under its
              "Smart Data Capture" platform umbrella. The core Barcode Scanner SDK is the foundational offering and the
              largest revenue driver: it processed 80 billion scans in 2025 across more than 170 million active mobile
              devices and 20,000+ device models, delivering accuracy above 99% across the symbologies and environmental
              conditions most enterprise apps target. The SDK reads every major 1D and 2D symbology — UPC, EAN, Code
              128, Code 39, ITF, QR Code, Micro QR, Data Matrix (including direct part marking), PDF417, Aztec, DotCode,
              MaxiCode, GS1 DataBar and Composite codes, and major postal symbologies — and automatically falls back to
              printed-digit OCR if a barcode is too damaged to decode.


              SparkScan is a pre-built floating scanning component built on top of the core SDK, designed for
              high-frequency single-scan workflows. Its AI-driven Smart Scan Intention engine reduces unwanted scans by
              up to 100% and delivers a 65% longer scan range on electronic shelf labels and tiny barcodes compared to
              baseline. Integration requires minimal code and does not require app redesign, with a median
              time-to-first-scan under one hour.


              MatrixScan is the platform's multi-barcode AR capture family. Four commercially deployed sub-products
              address distinct workflows: MatrixScan Find uses AR overlays to highlight a target item among many for
              in-store order picking or parcel location; MatrixScan Count supports batch inventory counting with a
              pre-built AR counting UI; MatrixScan Batch processes multiple barcodes in a single pass without AR
              overhead; MatrixScan AR adds configurable information overlays to any barcode in frame. Verified
              production outcomes include 50% faster shipment processing (Stratix), 85% reduction in shipping control
              time (Dior), and $500,000 in annual per-site savings at a major delivery operator.


              ID Scanning is Scandit's document verification product line, consisting of three components: ID Scan (data
              extraction from 2,500+ document types), ID Validate (authenticity and forgery detection, currently scoped
              to US driver's licenses and state IDs only), and ID Bolt (a pre-built web component for drop-in
              browser-based ID scanning). Published accuracy benchmarks are 100% for PDF417 barcodes, 99% for Machine
              Readable Zones (MRZ), and 95%+ for Visual Inspection Zones (VIZ). All scanning runs on-device with no
              internet connection required.


              ShelfView is Scandit's retail shelf intelligence solution, materially expanded by the August 2024
              acquisition of shelf-audit technology from MarketLab, a Polish image recognition and AI software company.
              The combined ShelfView platform uses a hybrid data capture model — mobile devices, fixed-position cameras,
              and autonomous robots — to deliver a digital shelf twin with 99.7% alert accuracy for out-of-stocks,
              low-stock events, and planogram violations. ShelfView is the only Scandit product that processes imagery
              through a cloud pipeline rather than purely on-device. The retail industry loses approximately $634
              billion annually from on-shelf availability issues per IHL Group research cited at the acquisition.


              Scandit Express is a turnkey no-code application available on any iOS or Android device that provides
              immediate access to MatrixScan Find, Count, and Batch without any software development or SDK integration.
              It targets customers who want immediate scanning capability in standard workflows without developer
              resources.
