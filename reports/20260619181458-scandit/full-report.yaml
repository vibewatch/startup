      - number: '4.4'
        title: Capital adequacy, financing history, and runway framework
        blocks:
          - type: paragraph
            body: >
              Scandit has raised $273.1M in total equity and debt-adjacent capital across eight documented funding
              rounds since 2013, making it the best-capitalized pure-play enterprise data capture company in the world.
              The most recent disclosed primary round is the $150M Series D in February 2022 led by Warburg Pincus at a
              company valuation in excess of $1 billion. No Series E or subsequent primary equity round has been
              publicly announced through the June 2026 research date, meaning the company has operated for more than
              four years without new primary equity dilution.


              Kreos Capital, a European venture debt specialist now a part of BlackRock (acquired June 2023), appears in
              both the Series C (2020) and Series D (2022) investor lists. Kreos typically provides non-dilutive growth
              debt to VC-backed technology companies alongside or following equity rounds, commonly structuring
              facilities of $10M–$50M for companies at Scandit's stage. The exact quantum, interest rate, maturity, and
              covenants of any Kreos facility are not publicly disclosed and constitute a material diligence item; the
              mere presence of a venture debt provider in the investor list does not confirm that a facility exists, but
              it is a strong indicator.


              Capital adequacy through mid-2026 can be supported by inference but not confirmed. At $119M ARR with an
              estimated gross margin of 75–82% and approximately 365–380 employees, Scandit's gross profit run-rate is
              approximately $89–$98M annually. If operating expenses are consistent with private SaaS benchmarks (S&M
              ~40–47%, R&D ~30–34%, G&A ~8–12%), total opex would be roughly $90–$110M against that ARR base, implying
              near-breakeven or modest cash consumption. The contraction from 553 employees in December 2022 to 364 in
              November 2025 — a reduction of ~34% — is consistent with deliberate cost discipline and an improving path
              to profitability. However, these estimates carry low confidence and the actual cash position is unknown.


              The valuation implied by the $1B+ Series D from February 2022 has not been publicly updated. A revenue
              multiple applied to the November 2024 ARR of $119.1M at a 10x multiple (consistent with enterprise SaaS
              companies growing 30–50% annually in 2025–2026 per public comps) would imply a current equity value of
              approximately $1.0B–$1.5B, roughly in line with the 2022 Series D valuation. A 15x multiple on a higher
              forward ARR estimate could support a higher valuation. All valuation estimates are speculative without a
              disclosed transaction.


              The absence of a public Series E round after 4+ years could indicate several scenarios: the company is
              sufficiently cash-generating to not require dilutive equity; the company is preserving optionality for an
              IPO or strategic exit; or growth targets from the 2022 Series D have not been fully met, suppressing
              investor appetite for new primary capital. The headcount reduction from 553 (peak, December 2022) to 364
              (November 2025), combined with the Series D press release commitment to grow headcount by another 50% by
              end of 2022 (which would have implied ~830 employees), suggests the growth ambition was not sustained at
              that rate.
