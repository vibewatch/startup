          - type: callout
            title: Platform layer and rugged-device cycles constrain new logo acquisition speed
            body: >-
              The two most significant adoption constraints — the 5–7 year rugged-device refresh cycle and the platform
              layer risk from Apple, Google, Samsung, and Microsoft embedding native scan capabilities — are not
              near-term existential threats but are structural limiters on how quickly Scandit can convert the large
              installed base of hardware-native scanning customers. New logo momentum likely requires either a hardware
              refresh trigger or a use case (ID verification, shelf intelligence) that hardware native scanning cannot
              satisfy.
