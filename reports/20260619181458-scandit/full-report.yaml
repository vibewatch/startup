chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and business model
        blocks:
          - type: paragraph
            body: >
              Scandit AG, commonly referred to as Scandit, is a privately held Swiss technology company incorporated and
              headquartered in Zurich, Switzerland. The registered address is Hardturmstrasse 181, 8005 Zurich. The
              company operates from seven offices spanning Zurich (global headquarters), London, Warsaw (Poland),
              Tampere (Finland), Boston (United States), and Tokyo (Japan), reflecting a genuinely international
              go-to-market presence built over more than fifteen years of operation.


              Scandit describes its core offering as smart data capture: software that converts any camera-equipped
              smart device — smartphones, tablets, handheld computers, wearables, drones, robots, and fixed cameras —
              into a high-performance barcode scanner, ID document reader, and label capture tool. The platform
              processes vision workloads on the device edge using proprietary computer vision, machine learning, and
              augmented reality algorithms, and its results are sold as enterprise software licenses and platform
              subscriptions rather than hardware.


              The company's product suite as of 2026 includes the Barcode Scanner SDK (the core product, handling 1D/2D
              barcode scanning with AR overlays), SparkScan (an optimized high-frequency scanning UI), MatrixScan
              (simultaneous multi-barcode AR tracking), ID Scanning and ID Validate/ID Bolt (ID document and passport
              verification), Label Scanning (combined barcode and OCR capture), ShelfView (retail shelf intelligence now
              incorporating the August 2024 MarketLab asset acquisition), the Scandit Express turnkey app, and the
              broader Store Intelligence Platform. Scandit's website homepage reports that the platform processes 80
              billion barcode scans annually across more than 170 million active mobile devices, and that the company
              serves 2,100+ enterprise customers with a 98% NPS score.


              The company was co-founded in November 2009 when three PhD researchers at ETH Zurich — Samuel Mueller,
              Christian Floerkemeier, and Christof Roduner — formalized their research project on smartphone-based
              computer vision. The founding narrative is rooted in the ETH Zurich computer science department and the
              broader Auto-ID Labs research network. The company's original academic advisor, Professor Friedemann
              Mattern, had explored the potential of low-resolution smartphone cameras for barcode scanning a decade
              earlier, and the founders' proof-of-concept became the basis for the commercial business.


              Scandit's business model targets enterprise customers across retail, transportation and logistics,
              healthcare, manufacturing, air travel, and field service. Revenue is primarily from annual enterprise
              software licenses and SDK subscription fees, following a land-and-expand pattern: customers adopt for one
              workflow and extend to broader organizational use. The company partners with hardware vendors including
              Apple (approved mobility partner) and Samsung (Knox integration) as well as enterprise software platforms
              including SAP, Google AppSheet, and Pega to embed scanning into standard workflow applications.
