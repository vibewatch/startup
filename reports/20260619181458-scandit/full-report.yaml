              The most material financial risk is that Scandit's reported jump from $35M ARR (December 2023) to $119.1M
              ARR (November 2024) — a 240% year-over-year increase — is sourced exclusively from a founder-disclosed
              LATKA database entry and is not corroborated by any independent audit, press release, investor
