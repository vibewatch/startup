  - id: FP003
    title: Competitive moat and readiness KPIs
    type: kpi
    layout: standard
    summary: >-
      Eight KPI-style indicators summarizing Scandit's competitive durability across key dimensions. Ratings are
      evidence-based ordinal assessments; green = strong, yellow = moderate, red = at risk. Together they confirm strong
      near-term moat with two specific soft spots: pricing at scale and static-image web SDK performance vs Dynamsoft.
    data:
      items:
        - label: AR workflow differentiation depth
          value: Strong
          tone: positive
          detail: MatrixScan, SparkScan, Find mode — no free or low-cost competitor matches full AR overlay suite as of 2026
        - label: Installed base stickiness (switching cost)
          value: High
          tone: positive
          detail: >-
            SDK embedded in WMS/TMS/ERP apps; 2,100+ enterprise customers; >98% support satisfaction; multi-year
            re-integration cost to displace
        - label: Platform breadth (barcode + ID + shelf + OCR in one SDK)
          value: Unique
          tone: positive
          detail: >-
            Only vendor covering all four capability domains in a single SDK platform; nearest competitor covers at most
            two
        - label: Hardware-agnostic cross-platform reach
          value: Strong
          tone: positive
          detail: >-
            Any camera device — smartphones, wearables, drones, robots, fixed cameras — all supported; not achievable
            with Zebra or Apple-only SDKs
        - label: Pricing at scale (per-scan or per-device model)
          value: Moderate risk
          tone: warning
          detail: >-
            Cost-at-scale is the leading independent reviewer complaint; Scanbot's unlimited model and Dynamsoft's entry
            price create budget pressure for high-volume accounts
        - label: Static-image / web SDK barcode detection vs Dynamsoft
          value: At risk (specific scenario)
          tone: negative
          detail: >-
            Dynamsoft benchmark shows Scandit detecting 178 vs 428 barcodes and running 40× slower in static-image web
            SDK mode; adverse perception impact even if camera-mode performance differs
        - label: ID scanning competitive position vs Microblink
          value: Moderate
          tone: warning
          detail: >-
            Microblink processed 3B verifications in 2025 with deeper KYC/AML integration; Scandit ID Bolt stronger at
            physical touchpoint (edge, offline) but narrower in cloud KYC workflow breadth
        - label: Resilience to hardware-incumbent software expansion (Zebra Workcloud)
          value: Moderate risk
          tone: warning
          detail: >-
            Zebra's $593M FY2025 R&D and Elo Touch acquisition target the same frontline workflow market; risk
            materializes over 2–4 year product roadmap, not immediately
    claimRefs:
