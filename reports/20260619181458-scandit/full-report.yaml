  - id: FM001
    title: Market sizing lens
    type: pyramid
    layout: wide
    summary: >-
      Three nested layers of market scope for Scandit in 2026: the broadest AI-in-computer-vision TAM ($27B), the
      enterprise barcode-and-mobile-computers SAM ($3–3.5B), and the constrained SDK software SOM (~$0.4–0.8B inferred),
      reflecting a 1.5–2.7% capture rate on the SAM consistent with Scandit's ~$119M ARR.
    data:
      items:
        - label: 'TAM: AI in Computer Vision'
          detail: >-
            $27.01B globally (2026, Fortune Business Insights); 17.89% CAGR. Includes all enterprise CV applications —
            manufacturing inspection, autonomous vehicles, surveillance, retail, and logistics. Scandit participates in
            a small subset.
          tone: neutral
        - label: 'SAM: Enterprise barcode scanners & mobile computers (software layer)'
          detail: >-
            $2.9–3.5B globally (2026, multiple analysts); 5.7–8.6% CAGR. Includes software licenses and services from
            barcode scanning vendors. Scandit competes on the software layer; hardware revenue from Zebra/Honeywell is
            excluded from Scandit's SAM.
          tone: positive
        - label: 'SOM: SDK smart-data-capture software (Scandit-addressable)'
          detail: >-
            ~$0.4–0.8B inferred (2026 analytic construct); based on ~$119M Scandit ARR at ~2,100 customers implying
            ~15–25% capture of the identified SAM sub-layer. Not a published figure; requires investor-grade primary
            sizing research.
          tone: warning
    approximationNotes: >-
      TAM figure is from Fortune Business Insights (2026). SAM is the midpoint range from Market Growth Reports and
      Verified Market Reports barcode scanner + mobile computers estimates. SOM is an analytic inference: Scandit's
      reported ~$119M ARR divided by a plausible $0.5–0.7B software sub-market implies a 17–24% share. This inference is
      subject to all the scope and accuracy uncertainties described in TM002.
