          - type: callout
            title: On-device architecture structurally limits cloud COGS
            body: >-
              Unlike cloud-based computer vision APIs that charge per API call and require significant backend compute
              to process every image server-side, Scandit runs inference entirely on the device using the device's own
              compute resources. This means Scandit does not pay cloud infrastructure COGS proportional to scan volume —
              80 billion barcode scans per year do not create 80 billion cloud compute events billed to Scandit. This
              architecture structurally supports gross margins in the 75–82% range, which would be anomalously low for a
              cloud API but is appropriate for an on-device SDK company.
