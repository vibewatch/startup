          ~$1.1B FY2025 revenue; $1.4B Brady acquisition announced Apr 2026, expected H2 2026 close; ~18–22% market
          share
        - Warehouse, logistics, distribution, manufacturing — large rugged fleet accounts
        - >-
          Operational Intelligence (Oi) device fleet management; anomaly detection; SAML SSO; B2M partner for
          cross-vendor device support
        - Strategic uncertainty post-acquisition; Oi not a barcode capture SDK; future AI roadmap under Brady unclear
      - - 'Datalogic (Borsa Italiana: DAL)'
        - Hardware-incumbent / embedded firmware
        - €493.8M FY2024 revenue; €241.1M H1 2025; ~20% AIDC market share; acquired Datema (EasyShop) Apr 2025
        - Retail, logistics, manufacturing, healthcare — EMEA stronghold
        - >-
          Manufacturing precision hardware; Memor mobile computers; EasyShop retail software via Datema acquisition;
          strong vitality index (27.2% new product sales)
        - >-
          No AR workflow SDK; software layer limited to embedded firmware; flat/declining revenue in fixed retail
          scanner segment
      - - Dynamsoft (private, Canada)
        - Pure-software SDK
        - Private; estimated mid-market SaaS revenues; entry SDK from ~$1,249/year; large developer user base
        - Industrial, manufacturing, server-side image processing, web app developers
        - >-
          Highest static-image batch detection accuracy in vendor benchmark (428 barcodes vs Scandit 178); fastest
          browser SDK (278 ms/image); broad symbology support
        - >-
          Benchmark is vendor-authored and measures static images only; no AR overlays; weaker enterprise frontline UI
          tooling; not focused on retail/logistics workflows
      - - Scanbot SDK (doo GmbH, Germany)
        - Pure-software SDK
        - Private; funded; pricing from fixed annual license (unlimited scans/devices); ~100–200 employees est.
        - Enterprise app developers; insurance, field service, healthcare; high-volume deployments
