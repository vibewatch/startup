  - id: FE001
    title: Product architecture map — Smart Data Capture platform stack
    type: stack
    layout: wide
    summary: >-
      Scandit's platform is a layered on-device software stack: device hardware at the base, the Vision AI Engine as the
      core compute layer, modular data-capture capabilities above it, pre-built workflow components on top, and an
      integration layer connecting to enterprise systems. ShelfView is the sole product that breaks from the on-device
      model by adding a cloud analytics tier.
    data:
      layers:
        - label: Enterprise business systems (integration layer)
          detail: >-
            SAP Fiori/S4HANA/BTP (native); Google AppSheet (licensed provider); Pega Marketplace (direct component);
            Oracle/Blue Yonder/Manhattan Associates (custom middleware required); custom REST/webhook APIs.
        - label: Pre-built workflow components
          detail: >-
            SparkScan (high-frequency single-scan UI), MatrixScan Find/Count/Batch/AR (multi-barcode AR workflows), ID
            Bolt (pre-built web ID scanning), Scandit Express (no-code turnkey app), ShelfView Dashboard and alert
            console.
        - label: Data Capture Modules
          detail: >-
            Barcode Capture (1D/2D, 50+ symbologies, OCR fallback), ID Scan/ID Validate (2,500+ document types; US
            forgery detection), Label Capture (combined barcode+OCR), Object Recognition (ShelfView shelf products).
        - label: Scandit Vision AI Engine
          detail: >-
            Context-aware Smart Scan Intention, real-time AR overlay tracking, OCR engine, image recognition, on-device
            ML inference. Closed-source proprietary IP. Updated per SDK release cycle.
        - label: SDK runtime (iOS / Android / WebAssembly)
          detail: >-
            Platform-specific execution containers for 11 frameworks. No Google Play Services dependency. WebAssembly
            for browser; native binaries for mobile and rugged Android (Zebra, Honeywell).
        - label: Device hardware (cameras, processors, sensors)
          detail: >-
            20,000+ supported device models: iPhones, iPads, Android smartphones and tablets, Zebra TC/ET series,
            Honeywell EDA/CT/CK series, Samsung Knox devices, wearables, fixed cameras, autonomous robots, drones.
    approximationNotes: null
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE019
      - CE023
      - CE024
      - CE025
      - CE035
