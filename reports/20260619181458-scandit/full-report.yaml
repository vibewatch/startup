      - number: '5.4'
        title: Trust, security, and compliance
        blocks:
          - type: paragraph
            body: >
              Scandit's core trust posture centers on on-device data processing: all image analysis, barcode decoding,
              and ID document extraction occurs locally on the device by default, with no image or personal data
              transmitted to external servers in the standard SDK configuration. No personal data is stored on the
              device; any data transmitted is encrypted in transit and at rest. This architecture simplifies GDPR and
              CCPA compliance for customers by minimizing data exposure and avoiding the consent and data-transfer
              obligations triggered by cloud processing.


              Scandit publicly claims ISO 27001:2022 certification for information security management, corroborated by
              references across multiple official product pages. This certification requires independent third-party
              audit and ongoing maintenance; the certification covers Scandit's organizational security practices rather
              than the individual SDK deployments. No SOC 2 Type II attestation or FedRAMP authorization has been
              identified in public sources, which may be a gap for US federal or highly regulated financial-sector
              deployments.


              For ID Scanning specifically, ID Validate's fraud detection runs on-device without an internet connection.
              Current scope is limited to US driver's licenses and state IDs; international document types are excluded
              from the authenticity-checking capability, though ID Scan (data extraction only) supports 2,500+
              international document types. This geographic limitation on ID Validate is a material diligence gap for
              international travel, hospitality, and KYC use cases. ShelfView introduces a cloud processing step for
              shelf image analysis; Scandit's privacy terms must be reviewed for data sovereignty in EU ShelfView
              deployments.
            claimRefs:
              - CE003
              - CE020
              - CE021
              - CE040
