      - number: '6.2'
        title: Platform-scale adoption metrics and deployment depth
        blocks:
          - type: paragraph
            body: >
              Scandit reports 80 billion barcode scans processed per year, 170 million+ active devices, and 2,100+
              enterprise customers. The 80 billion annual scan figure represents a large aggregate volume implying deep
              production embedding — high-frequency scanning workflows (retail price checks, logistics parcel tracking,
              pharmacy dispensing) would need to run daily at scale to accumulate this figure. Specific deployments
              confirm the scale: Walmart deploys Scandit across 1.3 million associates in the United States, making it
              by far the largest single disclosed deployment. Shipt scaled to 89,000 monthly active devices and
              onboarded 100,000+ contractors on personal smartphones during the COVID-19 demand surge without a custom
              device programme. Staples Canada deployed to 1,200 iPhones across 298 stores with 20,000 associate
              sessions and 200,000 app interactions per week. Swiss Post processes deliveries for 200 million parcels
              and 1.7 billion letters annually using Scandit-powered workflows.

              These deployment scales suggest deep workflow embedding rather than surface-level pilots. However, no
              independent figure audits device counts, scan volumes, or active customer definitions. Scandit's 2026
              Delivery Trends Report positions the company as a thought-leadership source in last-mile logistics, with
              AR-enabled scanning reducing van loading errors by 65% and three of the top five global couriers cited as
              customers — though these couriers are not named. The IHL Group / Scandit research published in October
              2025 found that retailers with 10%+ profit growth invest 208% more in inventory visibility solutions,
              contextualising Scandit's shelf intelligence ambition but noting it was co-commissioned by Scandit itself,
              limiting independence. A 98% NPS is displayed prominently on the Scandit homepage but has no published
              methodology, sample size, survey date, or third-party verification, making it a company claim rather than
              a benchmarked satisfaction metric.
