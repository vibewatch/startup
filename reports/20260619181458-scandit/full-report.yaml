  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Hardware-incumbent scanner vendors and their SDK strategies
        blocks:
          - type: paragraph
            body: >
              The three dominant hardware-incumbent barcode scanner vendors — Zebra Technologies, Honeywell Productivity
              Solutions and Services (being divested to Brady Corp), and Datalogic — collectively hold approximately 60%
              of global enterprise barcode scanner hardware revenue. All three offer proprietary software SDKs embedded
              in their device ecosystems, which function as both competitive moats for their hardware and as structural
              barriers to Scandit's software-only expansion into hardware-loyal enterprise accounts.


              Zebra Technologies is the undisputed hardware leader, reporting $5.40 billion in FY2025 net sales (up 8.3%
              year-over-year) and holding an estimated 25–28% global market share in enterprise barcode scanners.
              Zebra's free DataWedge configuration tool and EMDK developer kit are deeply embedded in the enterprise
              device lifecycle: DataWedge requires no coding for basic barcode integration and routes scan data to any
              Zebra-hosted application without additional licensing cost. For enterprises running large Zebra fleets,
              these tools eliminate the incremental value proposition of a commercial SDK for basic scanning use cases.
              Zebra's October 2025 acquisition of Elo Touch Solutions for $1.3 billion — which Zebra estimates expands
              its addressable market by $8 billion — signals an accelerating pivot toward software-driven frontline
              experiences including AI agents, self-service kiosks, and interactive retail workflows. Zebra's FY2025 R&D
              investment of $593 million (11% of net sales) confirms sustained commitment to competing in the software
              layer. The convergence risk is real: as Zebra's Workcloud platform matures, enterprises that standardize
              on Zebra hardware may derive sufficient workflow functionality without purchasing third-party SDKs.


              Honeywell's Productivity Solutions and Services business (mobile computers, barcode scanners, printing
              solutions) generated approximately $1.1 billion in 2025 revenue, representing roughly 18–22% of the
              enterprise barcode scanner market. In April 2026, Honeywell announced agreement to sell PSS to Brady
              Corporation for $1.4 billion in cash, expected to close H2 2026. Brady is a manufacturer of identification
              and safety products, not a technology platform company at scale. This ownership change introduces material
              strategic uncertainty: Honeywell Operational Intelligence (Oi), the software management platform for
              Honeywell device fleets, is actively integrating AI features (anomaly detection, automation engine) under
              Honeywell's technology roadmap, but its future development trajectory under Brady is not clear. For
              Scandit, the divestiture could create near-term opportunity if Honeywell/Brady enterprise customers face
              software platform discontinuity and evaluate alternatives. However, Honeywell's Operational Intelligence
              product will continue to compete as a fleet management and analytics layer that, while not a direct
              barcode SDK competitor, occupies the same enterprise IT budget category.


              Datalogic, listed on Borsa Italiana and headquartered in Bologna, Italy, reported H1 2025 revenue of
              €241.1 million (down 1.5% year-over-year), with full-year 2025 revenue expected to be broadly in line with
              2024's €493.8 million (~$532 million). Datalogic holds approximately 20% global market share in the
              combined barcode scanners and mobile computers category, with particular strength in EMEA. In April 2025
              Datalogic acquired Datema Retail Solutions AB (maker of EasyShop software), signalling a strategic move
              toward software-augmented data capture. Datalogic competes primarily through hardware excellence (Memor
              mobile computers, PowerScan fixed readers) and embedded firmware — its software layer does not match
              Scandit's AR capabilities but provides adequate barcode performance for customers who standardize on
              Datalogic hardware.
