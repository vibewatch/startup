  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing history, valuation anchor, and stale-price risk
        blocks:
          - type: paragraph
            body: >
              Scandit's last disclosed valuation is $1 billion-plus, set at the close of its $150 million Series D in
              February 2022, led by Warburg Pincus with participation from Atomico, Forestay Capital, G2VP, GV, Kreos
              Capital, NGP Capital, Schneider Electric, Sony Innovation Fund, and Swisscom Ventures. At the time, the
              company's ARR had more than doubled since the May 2020 Series C ($80M raised). With GetLatka reporting
              $21M ARR in April 2021 as the nearest public data point prior to the Series D, and the company stating
              "more than doubled" ARR from May 2020, the implied ARR at Series D close is estimated at $55–80 million.
              The resulting implied valuation multiple at the time of the round is therefore approximately 12–18× ARR —
              consistent with early 2022 market conditions, when the SaaS Capital Index stood at approximately 12–14×
              before the February 2022 Fed rate-tightening cycle began. The round represented approximately 15% equity
              dilution (implied by GetLatka: $150M raised at $1B post-money), giving a pre-money valuation of
              approximately $850M.


              As of June 2026, no subsequent primary equity round has been publicly announced. The company has now
              operated for more than four years without new primary dilution, which is consistent with either strong
              organic cash generation, utilisation of the Kreos Capital venture debt facility, or both. The absence of a
              new primary round also means the $1B valuation is unrevised and potentially deeply stale. Between the
              February 2022 Series D close and mid-2026, the SaaS Capital Index (SCI) median dropped from approximately
              12–14× to 3.4× ARR — a compression of more than 75%. The PitchBook Q1 2026 Enterprise SaaS Public Comp
              Sheet reports the median enterprise value/trailing-12-month revenue multiple fell to 3.3× as of March 31,
              2026, labelling the event a "SaaSpocalypse." Roughly $1 trillion in aggregate SaaS market capitalisation
              was erased in Q1 2026, triggered by Anthropic's January 2026 launch of an agentic AI platform and
              compounded by soft earnings, tariff volatility, and investor concern over per-seat pricing models.


              Against Scandit's last-disclosed ARR of $119.1M (November 2024), the $1B Series D mark implies an 8.4× ARR
              multiple. This is approximately 2.5× the current SaaS public market median of 3.4×. Even applying a
              generous AI-enabled premium (Finro's Q1 2026 dataset places AI-enabled SaaS private VC at approximately
              8–9× ARR; AI-native at 21×), the 2022 mark exceeds the applicable 2026 private market bracket. A more
              appropriate 6–8× multiple on the current $119.1M ARR implies a value of $715M–$953M — materially below the
              prior-round post-money. The Kreos Capital venture debt overhang (quantum undisclosed but typically $15–50M
              for companies at Scandit's stage) further reduces the implied equity value. Any investor entering at or
              near the 2022 valuation mark without confirmed ARR re-acceleration or a verified NRR above 115% is
              accepting a negative entry premium relative to current market conditions.
