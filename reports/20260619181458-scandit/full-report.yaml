      - number: '5.5'
        title: Competitive differentiation, documented limitations, and 2026 roadmap
        blocks:
          - type: paragraph
            body: >
              Scandit's primary competitive differentiators are: AR-overlaid multi-barcode capture (unique at commercial
              maturity in its tier), broad platform coverage (11 frameworks, 20,000+ devices vs. single-platform
              competitors), enterprise SLA quality (median 3-hour first reply), context-aware scanning intelligence, and
              15 years of edge case library depth. However, independent benchmarks surface specific technical gaps that
              diligence must address.


              Dynamsoft published a benchmark of four web SDKs against 83 real-world static barcode images using default
              configurations and no pre-processing. Scandit's web SDK detected 178 unique barcodes versus Dynamsoft's
              292, and averaged 11,210ms per image versus Dynamsoft's 278ms. The test is limited to static-image
              decoding via a browser API; Dynamsoft explicitly notes that "real-time camera scanning involves additional
              components — frame acquisition, preview rendering, autofocus, and SDK-side stream optimization" not
              covered by this test, and Scandit's 11,210ms average likely reflects an exhaustive default scanning mode
              on large dense images. Camera-mode performance is not captured and may differ materially. Scandit's own
              camera-mode tests against ZXing and ML Kit show better Scandit performance. The static-image gap is
              nonetheless a real integration risk for web SDK deployments.


              barKoder's third-party benchmark on 29 damaged Data Matrix samples found Scandit second at 65.52% versus
              barKoder at 89.66% and Cognex at 48.28%. On 55 blurred EAN/UPC samples, Scandit scored 80% versus
              barKoder's 89.09%. These tests are published by barKoder (a competitor) and should be treated as
              competitor-authored material; methodology is disclosed but replication by an independent party has not
              been identified. The scores indicate that Scandit is not the top performer on adversarial static-image
              tests even among commercial SDKs.


              On product scope limitations: ID Validate covers only US driver's licenses and state IDs as of mid-2026,
              excluding international documents. MatrixScan's AR capabilities do not support every barcode symbology in
              all tracking modes. ShelfView's cloud processing step creates data-residency and latency considerations
              absent from the core SDK. Pricing is not publicly disclosed for enterprise tiers; Scandit offers a 30-day
              free trial and explicit simple/advanced tier options for small teams, but enterprise pricing requires
              sales engagement and custom quoting.


              The 2026 roadmap, as expressed in the Scandit blog, centers on "SDK 8" and "Smart Label Capture" as
              concrete near-term product deliverables, and AI Level 4 contextual scanning (inferring relationships
              between barcodes and their physical context) as a technology frontier objective. ID Bolt is expected to
              incorporate ID Validate functionality. Agent Skills is an active 2026 developer-experience initiative.
              Walmart's large-scale AR deployment via Scandit is described as "likely the largest commercial use of AR
              worldwide" as of 2025, providing a public validation data point for the roadmap direction.
            claimRefs:
