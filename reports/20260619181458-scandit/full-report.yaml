      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: On-device architecture is a genuine technical and commercial differentiator
            body: >-
              Performing all image analysis on the device edge — with no image transmitted, no cloud call, and no Google
              Play Services dependency — is not just a marketing claim. It enables offline-first deployments on Zebra,
              Honeywell, and other rugged enterprise Android handhelds that would otherwise require Google services,
              simplifies GDPR compliance by eliminating data-in-transit obligations, and delivers sub-200ms scan latency
              regardless of network quality. This architecture advantage is directly validated by reference deployments
              in NHS test sites (1.2M daily scans), Walmart (1.3M associates), and FedEx (global parcel tracking).
            calloutType: strength
            claimRefs:
              - CE003
              - CE016
              - CE035
          - type: callout
            title: Web SDK has a documented performance gap versus Dynamsoft in static-image batch decoding
            body: >-
              Dynamsoft's published benchmark (four web SDKs, 83 real-world images, default configuration) found
              Scandit's web SDK detected 178 unique barcodes versus 292 for Dynamsoft, and averaged 11,210ms per image
              versus 278ms. Dynamsoft itself states these results do not reflect real-time camera-mode performance,
              which each vendor tunes independently. Nonetheless, any enterprise deployment targeting web SDK in a
              batch-scan or static-image-processing scenario (e.g., document intake, e-commerce listing) faces this gap.
              Scandit's pre-built camera-mode components (SparkScan, MatrixScan) are designed for live-stream use and
              likely perform differently, but no direct comparison test for camera-mode performance across the same SDK
              set has been published.
            calloutType: risk
            claimRefs:
              - CE027
              - CE036
          - type: callout
            title: ID Validate is limited to US documents — a hard constraint for international deployments
            body: >-
              As of June 2026, ID Validate's forgery and authenticity detection is scoped exclusively to US driver's
              licenses and state IDs. International use cases — airline passenger ID checking, European KYC, APAC
              delivery driver onboarding — can use ID Scan for data extraction but cannot use Scandit for on-device
              authenticity verification. This creates a product gap for Scandit's verticals with significant
              international operations. International expansion of ID Validate is not on the declared 2026 roadmap; only
              the ID Bolt + Validate web integration is flagged as near-term.
