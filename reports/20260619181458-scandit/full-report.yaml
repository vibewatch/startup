            body: >-
              Kreos Capital, a specialized venture debt provider now owned by BlackRock, appears in both the 2020 Series
              C and 2022 Series D investor lists. Kreos typically structures non-dilutive debt facilities alongside
              equity rounds for high-growth technology companies. The quantum, interest rate, maturity, and covenants of
              any Kreos facility at Scandit are not publicly available. Debt service obligations and any financial
