      - number: '5.2'
        title: Vision AI engine and on-device technical architecture
        blocks:
          - type: paragraph
            body: >
              Scandit's proprietary Vision AI Engine is the shared computational layer underlying every product module.
              Its core function is to perform all image analysis and decoding on the device itself — camera frames never
              leave the device by default, and scanning operates fully offline. This design choice is both a privacy and
              performance decision: latency is sub-200ms per scan (below human perceptual threshold), and sensitive
              barcode, ID, or label data does not transit external servers. The engine runs natively on iOS and Android
              and via WebAssembly in browsers, with platform-specific performance tuning across all 11 supported
              frameworks. The SDK does not depend on Google Play Services, enabling deployment on Zebra, Honeywell, and
              other rugged Android devices that operate outside standard Google service environments.


              Three AI capabilities distinguish the Vision AI Engine from lower-tier alternatives. First, context-aware
              scanning (branded "Smart Scan Intention") uses behavior analysis rather than fixed timeouts to distinguish
              intentional from accidental barcode captures — even in environments with many barcodes in frame
              simultaneously. This is the basis for the reported 0% false-positive rate on major 1D symbologies during
              continuous 30-minute robot testing. Second, the engine adapts automatically when a barcode is too damaged
              to decode: it falls back to reading the printed human-readable digits below the barcode using OCR, with no
              user input required. Third, for MatrixScan, the engine simultaneously tracks, decodes, and renders AR
              overlays across all barcodes in a live camera frame in real time.


              In Scandit's own comparative tests against open-source ZXing (Code 128, Samsung Galaxy S9), Scandit
              scanned a sequence in 4.0 seconds versus ZXing's 6.93 seconds, achieved 0% false positives versus ZXing's
              5%, and reached 168 cm versus ZXing's 37 cm maximum read range. On 11 damaged "tough codes," ZXing read 2
              while Scandit read all 11. Against Google ML Kit, Scandit was approximately 2x faster in proof-of-delivery
              workflows and 4x faster on bottom-shelf electronic shelf labels; ML Kit also caps at 10 barcodes per call
              while Scandit has no such limit. These tests are company-authored and methodological details vary by SDK
              release; independent validation is discussed in Section 5.


              For ShelfView specifically, captured images are processed through a cloud pipeline incorporating image
              recognition and vision AI to create a digital shelf twin. This introduces a cloud dependency and
              data-transmission step that the core barcode and ID SDKs explicitly avoid. ShelfView's 99.7% alert
              accuracy is company-stated and was claimed prior to and after the MarketLab integration. An independent
              audit of this figure has not been identified.
