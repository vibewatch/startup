  - id: FE004
    title: Product maturity and capability map
    type: matrix
    layout: wide
    summary: >-
      Scandit's product line shows high technical maturity across barcode scanning, SparkScan, and MatrixScan, with
      medium maturity in ID scanning (constrained by ID Validate's US-only scope) and ShelfView (cloud dependency,
      recent MarketLab integration). Competitive differentiation is highest where AR overlays and multi-barcode
      workflows intersect with broad device coverage.
    data:
      columns:
        - Technical maturity
        - Commercial validation
        - Competitive differentiation
        - Key risk / limitation
      rows:
        - label: Barcode Scanner SDK (core)
          values:
            - High — 15 years, 80B scans/yr, 99%+ accuracy on standard conditions
            - High — Walmart, FedEx, DHL, Lufthansa, NHS named customers
            - High — 20,000+ devices, 11 frameworks, no Google Play Services dependency
            - Medium — Dynamsoft web SDK gap; barKoder advantage on damaged codes in static tests
        - label: SparkScan
          values:
            - High — GA, pre-built component, well-documented
            - Medium-High — bundled with core SDK; broad deployment implied
            - Medium-High — context-aware AI scanning unique in category; limited head-to-head data
            - Low — strong claims; no independent benchmark for SparkScan-specific AI
        - label: MatrixScan (Find / Count / Batch / AR)
          values:
            - High — four sub-products GA; Dior, Stratix named reference deployments
            - High — measured customer outcomes published (50% faster, 85% reduction, $500k savings)
            - High — real-time multi-barcode AR tracking at commercial scale; no direct open-source equivalent
            - Medium — not all symbologies supported in AR mode; DPM/VIN gap vs. barKoder
        - label: ID Scan / ID Validate / ID Bolt
          values:
            - Medium-High — ID Scan mature; ID Validate limited to US; ID Bolt GA for data extraction only
            - Medium — niche use cases (delivery, car rental, age verification) vs. core scanning
            - Medium — on-device, no cloud required; but Jumio/Onfido offer broader international validation
            - High — ID Validate US-only; ID Bolt lacks Validate integration; international KYC gap
        - label: ShelfView
          values:
            - Medium — hybrid architecture is new post-MarketLab; cloud pipeline adds complexity
            - Medium-High — 8 of top 10 US grocers; Carrefour Poland; IHL Group commissioned research
            - Medium-High — hybrid capture (mobile + fixed + robot) is differentiated; 99.7% accuracy claimed
            - High — cloud dependency; accuracy unaudited; robot deployment cost; recent acquisition integration risk
    approximationNotes: >-
      Maturity ratings are derived from available public evidence (customer references, product documentation,
      benchmarks) and incorporate adverse evidence where found. Ratings are qualitative assessments, not quantitative
      scores.
