      - number: '6.5'
        title: Concentration risk, adverse evidence, and diligence gaps
        blocks:
          - type: paragraph
            body: >
              The most significant concentration risk is Walmart. While no revenue percentage is disclosed, Walmart's
              deployment across 1.3 million US associates — out of a reported 2,100 total enterprise customers — almost
              certainly represents a disproportionate revenue contribution. A Walmart renewal failure, pricing
              renegotiation, or in-house build decision would constitute a material adverse event. No other named
              customer approaches a comparable disclosed deployment scale. The second tier of references (Shipt at 89K
              devices, Swiss Post, Staples Canada) are significant but represent smaller revenue profiles. FedEx and
              Lufthansa appear in boilerplate across all press releases but neither has a standalone case study or named
              executive quote, raising the question of whether these are active, contractually committed production
              relationships or historical or indirect references.

              Customer count claims (2,100+) are entirely self-reported. "Enterprise customer" is not defined — it could
