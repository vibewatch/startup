      - number: '8.2'
        title: Comparable valuation analysis — ARR multiples, public comps, and M&A benchmarks
        blocks:
          - type: paragraph
            body: >
              Four valuation lenses apply to Scandit: (1) public SaaS median multiples as a floor reference; (2)
              industrial computer vision public comps (Cognex, Zebra Technologies) as strategic peers; (3) private SaaS
              transaction multiples from recent M&A data; and (4) AI-enabled/computer vision premium brackets from
              multi-company datasets. Each lens yields a different implied value range, and their weighted
              interpretation defines the applicable multiple corridor for Scandit.


              Cognex Corporation (CGNX), the global industrial machine vision leader, reported FY2025 revenue of $994M
              with an enterprise value of approximately $11B as of mid-2026, implying a trailing EV/revenue multiple of
              approximately 11×. Cognex's gross margin is approximately 67% (lower than Scandit's estimated 75–82%
              because Cognex includes hardware) and its Adjusted EBITDA margin was 21.5% in FY2025. Cognex provides the
              best publicly available pure-play machine vision comparable, though its hardware content and scale reduce
              direct comparability to Scandit's software-only model. Zebra Technologies (ZBRA), the enterprise data
              capture and mobile computing leader, reported FY2025 net sales of $5.4B with an enterprise value of
              approximately $14B as of mid-2026, implying an EV/revenue multiple of approximately 2.6×. Zebra's
              substantially lower multiple reflects its hardware-majority revenue mix (48% gross margin versus Scandit's
              estimated 75–82% software margin), much larger scale, and the absence of a high-growth SaaS premium.
              Zebra's multiple serves as a floor reference for Scandit: any pure-software SaaS platform with Scandit's
              NRR profile should command a material premium above 2.6×.


              On the M&A side, Apryse (backed by Thoma Bravo) acquired Scanbot SDK — a direct barcode and document
              scanning SDK competitor — in July 2025 for an undisclosed consideration. Scanbot had approximately €7
              million ARR in 2024 and served 200–250 enterprise customers. Based on typical M&A multiples for enterprise
              barcode/document scanning SDK businesses in 2023–2025 (6–12× ARR per publicly available SaaS M&A
              benchmarks), the implied Scanbot transaction value is approximately €42–84M ($46–92M). Scandit at $119M
              ARR is approximately 17× Scanbot's scale, commanding a meaningful scale premium and substantially broader
              customer base and platform depth. However, the strategic acquirer universe for Scanbot (Thoma Bravo/Apryse
              as a document-tech roll-up) is different from Scandit's likely acquirer set (Zebra, Honeywell, SAP, or a
              logistics software platform), which may command a different premium.


              Windsor Drake's 2025–2026 private lower middle market SaaS data shows the median at 4–5× ARR for typical
              founder-led businesses, rising to 7×+ for companies with Rule of 40 scores above 50% and NRR above 120%.
              Scandit's ARR/FTE of ~$327K and estimated gross margin of 75–82% are consistent with top-quartile
              efficiency; if NRR is confirmed above 115%, this would support the 7–9× private bracket. Aventis Advisors
              and the SaaS Capital Index independently confirm the public SaaS median at 3.4× as of Q1 2026. For a
              company with Scandit's profile — AI-enabled (but not AI-native), high efficiency, enterprise platform,
              defensible niche — the applicable private market multiple bracket is approximately 6–9×, with the high end
              requiring NRR and growth confirmation.
