companyProfile:
  summary: >-
    Scandit AG is a Swiss private enterprise software company founded in November 2009 by three ETH
    Zurich computer vision researchers. The company has built the leading smart data capture platform,
    which converts any camera-equipped smart device — smartphones, tablets, handheld computers,
    wearables, drones, and fixed cameras — into an enterprise-grade barcode scanner, ID document
    reader, and AR-guided workflow tool. As of mid-2026, the platform processes 80 billion barcode
    scans annually across 170 million+ active devices, serving 2,100+ enterprise customers in retail,
    logistics, healthcare, manufacturing, and air travel. Scandit achieved unicorn status in February
    2022 with a $150M Series D led by Warburg Pincus at a $1B+ post-money valuation. The most recent
    publicly disclosed ARR figure is $119.1M as of November 2024 (CEO-disclosed via LATKA), implying
    approximately 240% year-over-year growth from $35M in December 2023 — a figure that requires
    independent corroboration.
  foundedDate: '2009-11-01'
  founders:
    - name: Samuel Mueller
      role: CEO & Co-founder
      background: >-
        PhD researcher at ETH Zurich Auto-ID Labs; has led Scandit as CEO from founding through
        unicorn status, serving as named spokesperson across every major funding and partnership announcement.
      claimRefs: [CO012]
    - name: Christian Floerkemeier
      role: CTO & VP Product
      background: >-
        Senior researcher at ETH Zurich Auto-ID Labs with deep expertise in mobile computer vision
        and smart device systems; oversees Scandit's technical roadmap.
      claimRefs: [CO013]
    - name: Christof Roduner
      role: CIO & VP Engineering
      background: >-
        ETH Zurich researcher and co-inventor of Scandit's core scanning technology; oversees the
        global engineering organization.
      claimRefs: [CO014]
  foundingLocation: Zurich, Switzerland
  headquarters: Zurich, Switzerland
  productSummary: >-
    Smart data capture SDK suite: Barcode Scanner SDK (core product, 1D/2D scanning with AR
    overlays), SparkScan (high-frequency scanning UI with Smart Scan Intention), MatrixScan
    (simultaneous multi-barcode AR tracking and picking), ID Scanning / ID Validate / ID Bolt
    (identity document and passport verification), Label Scanning (combined OCR and barcode),
    ShelfView and Store Intelligence Platform (retail shelf analytics, hybrid mobile/fixed-camera),
    and Scandit Express (plug-and-play iOS/Android app).
  customerFocus: >-
    Global enterprise customers across retail (including 8 of the top 10 U.S. grocers), transportation
    and logistics (including 3 of the top 5 global couriers), healthcare, manufacturing, air travel,
    and field service. Named logos include Walmart, FedEx, DHL, NHS UK, Sephora, Lufthansa, Alaska
    Airlines, Staples Canada, Swiss Post, Levi Strauss & Co, Carrefour, and Kroger.
  businessModel: >-
    Annual enterprise software licensing and SDK subscription fees, structured across Core, Standard,
    and Advanced tiers priced by device count or flat annual fee. Revenue model is land-and-expand:
    customers adopt for one workflow and organically expand to broader organizational use across
    additional verticals and product modules. No hardware revenue.
  stage: Series D unicorn
  fundingStatus: >-
    Total of approximately $273M raised across eight rounds; most recent is a $150M Series D in
    February 2022, led by Warburg Pincus at a $1B+ post-money valuation. No new primary equity round
    has been publicly announced since February 2022. A Kreos Capital venture debt facility is in
    place; the quantum and terms are undisclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO012, CO013, CO014, CO020, CO022, CO030, CO031, CU001, CU002]
summary:
  headline: >-
    Scandit is the global #1 enterprise data capture SDK with 170M+ active devices, 2,100+ customers,
    and $119M last-disclosed ARR, but its stale $1B 2022 valuation mark at 8.4× ARR is roughly 2.5×
    the current public SaaS median — warranting a track stance pending audited ARR re-acceleration or
    a lower entry multiple.
  overallScore: 6
  recommendation: track
  confidence: medium
  riskRating: medium
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: 119.1
    arrUsdM: 119.1
    revenueGrowthYoYPct: 240
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 273
    customerCount: 2100
    headcount: 377
  topStrengths:
    - Category-leading enterprise SDK with 80B+ annual scans, 170M+ active devices, 2,100+ enterprise
      customers, and a 17-year technology moat rooted in ETH Zurich computer vision research
    - Land-and-expand engine evidenced by Walmart (1.3M associates, renewed June 2025) and approximate
      3× ARR growth from $35M to $119.1M between December 2023 and November 2024
    - All three co-founders remain in active C-suite roles; near top-quartile SaaS efficiency at ~$327K
      ARR per FTE, with AI-enabled computer vision positioning qualifying for a premium multiple bracket
    - Broad strategic exit optionality — attractive acquisition target for Zebra, Honeywell, SAP,
      Salesforce, and logistics platform buyers across multiple enterprise verticals
  topRisks:
    - Stale $1B+ valuation at 8.4× last-disclosed ARR versus a 3.4× public SaaS median following the
      Q1 2026 SaaSpocalypse; entry at the 2022 mark requires confirmed ARR re-acceleration to $150M+
    - No audited financials, NRR, GRR, or customer concentration data publicly available;
      240% ARR growth is founder-disclosed via LATKA only and has not been independently corroborated
    - Honeywell/HHP patent attack (UPC preliminary injunction issued 2024, withdrawn March 2025) signals
      recurring IP exposure from hardware incumbents; free Google ML Kit and AWS SDKs commoditize the
      low-to-mid scanning market
    - Key-person concentration across all three co-founders in C-suite roles; undisclosed Kreos Capital
      venture debt overhang affects exit waterfall and down-round risk
  unresolvedGaps:
    - Audited FY2025 ARR, NRR, GRR, and cohort retention data not publicly available; latest ARR
      confirmation is the November 2024 LATKA founder-disclosure
    - Walmart and top-10 customer revenue concentration not disclosed; Kreos Capital debt quantum and
      terms undisclosed — both material for exit waterfall underwriting
    - No primary equity round since February 2022; capital adequacy through mid-2026 cannot be confirmed
      from public sources
    - No independent third-party accuracy benchmark for Vision AI Engine on damaged/difficult barcodes
      across standard industry test sets; barKoder data shows Scandit at 47.6% vs 90.4% on PDF417 damaged samples
