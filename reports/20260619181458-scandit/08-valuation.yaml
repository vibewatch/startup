  - id: section-5
    title: Exit readiness, thesis-break triggers, and final diligence asks
    body: >
      Warburg Pincus's typical growth equity hold period of four to seven years from a February 2022
      investment implies a target liquidity event in the 2026–2029 window. As of mid-2026, three
      exit pathways are available. The IPO pathway is effectively closed: no venture-backed SaaS
      unicorn filed to go public in Q1 2026, Liftoff withdrew its planned IPO in February 2026, and
      the PitchBook Q1 2026 report notes that the long-anticipated Databricks, Anthropic, and OpenAI
      listings remain on deck for later in 2026 with no confirmed timeline. Scandit at $119M ARR and
      no public comparables at scale is unlikely to be a near-term IPO candidate in the current
      environment. The strategic M&A pathway is more plausible: the combination of 2,100+ enterprise
      customers, 170M active devices, deep SAP/Pega/Google AppSheet ecosystem integrations, and
      17 years of computer vision IP creates a strategic asset that could command an acquisition
      premium above the financial multiple. Credible acquirers include Zebra Technologies (seeking
      to replace hardware scanner revenue with SaaS ARR), Honeywell Safety & Productivity Solutions
      (similar rationale post the Honeywell SPS divestiture discussions), SAP (to embed scanning
      natively in EWM/WM workflows), Salesforce/ServiceNow (to extend field service and last-mile
      automation), and private equity platforms pursuing industrial software roll-ups. Secondary
      market activity (selling Warburg Pincus's position or earlier investors' stakes) is a third
      option but would require agreement on a price that acknowledges the valuation gap.


      Six thesis-break triggers require monitoring. The most acute is confirmed ARR below $100M
      for FY2025, which would indicate that the 2024 acceleration was non-recurring and the growth
      story collapses. A second is confirmed NRR below 100%, indicating net customer contraction
      contrary to the land-and-expand thesis. A third is the materialisation of Walmart concentration
      risk through a public disclosure of a major contract reduction. A fourth is a formal down round
      at a valuation below $800M (signalling distressed financing and investor acknowledgment of the
      valuation gap). A fifth is Google ML Kit capturing measurable mid-market share from Scandit
      in any major vertical within 12 months, forcing ACV compression. A sixth is EU AI Act Annex III
      classification of ID Bolt/ID Validate as high-risk AI systems creating compliance costs that
      erode ID scanning margins post-2027.

