        - Three founder-operators with 17-year institutional knowledge; Warburg Pincus governance discipline
        - All-founder C-suite creates key-person concentration; no audited financials or board composition disclosed
        - Data-room governance docs; board independence confirmation; founder vesting/retention terms
    notes: >-
      All pro-thesis and anti-thesis entries are based on public evidence. Items marked as undisclosed require data-room access.

