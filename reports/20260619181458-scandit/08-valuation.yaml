callouts:
  - calloutType: risk
    title: Stale 2022 valuation creates a 2.5× multiple gap versus 2026 public SaaS benchmarks
    body: >-
      Scandit's $1 billion Series D mark (February 2022) implies 8.4× its last-disclosed ARR. The SaaS
      Capital Index median fell to 3.4× by May 2026 — roughly 60% below Scandit's 2022 entry price.
      Any new investor entering at the 2022 mark is paying more than double the current SaaS market
      median without verified NRR, audited ARR, or cohort data to support the premium. This is the
      single most actionable risk for a new entrant.
    claimRefs:
      - CV005
      - CV006
      - CV007

  - calloutType: recommendation
    title: Track — conditional buy threshold is ≤7× confirmed forward ARR
    body: >-
      Scandit has genuine strategic assets, a defensible market position, and an AI-enabled platform
      that warrants above-SaaS-median pricing. The appropriate entry price is ≤7× confirmed FY2025 ARR
      (approximately $840M–$910M if ARR is $120–130M) with NRR ≥115% and data-room access to cohort
      retention and customer concentration data. Without these conditions, the recommendation is to track
      and wait for either a price correction, a secondary market opportunity, or M&A process initiation.
    claimRefs:
      - CV032
      - CV033
      - CV038

  - calloutType: insight
    title: Strategic M&A premium is the primary upside optionality
    body: >-
      In a financial valuation, Scandit's base case is $780M–$1.04B. However, strategic acquirers
      (Zebra Technologies displacing hardware revenue with SaaS ARR, SAP embedding scanning in its EWM
      workflows, Honeywell SPS seeking software-first capabilities) would likely pay a 30–50% strategic
      premium above financial value. This M&A optionality — plausible given the Warburg Pincus exit
      timeline — is the scenario where the 2022 $1B mark is validated or exceeded.
    claimRefs:
      - CV036
      - CV040

