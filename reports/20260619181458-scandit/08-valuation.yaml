  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: ARR verification
      missingEvidence: >-
        Audited or auditor-reviewed ARR for FY2023, FY2024, and FY2025 YTD; reconciliation of the
        founder-disclosed $119.1M ARR figure to GAAP revenue in audited accounts.
      whyItMatters: >-
        The entire valuation thesis — bull, base, and bear scenarios — is anchored to the unverified
        $119.1M ARR figure. A 240% YoY growth claim cannot be incorporated into an investment
        recommendation without independent verification. If overstated, the implied multiple collapses
        from 8.4× to 12–15× at a $70–80M verified ARR, making the 2022 mark even more stretched.
      diligencePath: >-
        Request Swiss CO2/IFRS audited financial statements for FY2022–FY2024 and management accounts
        for FY2025 YTD from Scandit's CFO; cross-check against subscription revenue line.
      relatedQuestionRefs:
