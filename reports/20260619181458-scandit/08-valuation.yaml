        - Audited cohort retention data; FY2025 ARR confirmation
      - - Valuation
        - AI-enabled premium (7–9× private) partially justifies entry above SaaS median; platform has genuine moat
        - $1B Series D at 8.4× current ARR is 2.5× the SaaS median; 2022 mark is materially stale
        - Data-room ARR + NRR; entry negotiation below $900M; FY2025 audited ARR
      - - Competitive moat
        - 17 years of CV IP, 23+ patents, ETH Zurich lineage, MatrixScan/ID Validate platform depth
        - Benchmark gap (47.6% vs barKoder's 90.4% on damaged PDF417); no third-party accuracy audit
        - Independent SDK accuracy benchmark; Scandit counter-data from enterprise deployments
      - - Exit options
        - Attractive M&A target (Zebra, SAP, Honeywell, Salesforce) at strategic premium; PE roll-up option
        - IPO market effectively closed in 2026; SaaS compression reduces exit multiple headroom
