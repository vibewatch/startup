    type: flow
    layout: wide
    summary: >-
      Logic chain linking Scandit's scale, platform proof, and risk evidence to the valuation gap
      assessment and resulting track / conditional-buy recommendation.
    data:
      nodes:
        - id: scale
          label: Scale / proof
          detail: "$119.1M ARR (Nov 2024, unaudited); 2,100+ enterprise customers; 170M+ active devices; Walmart 1.3M-associate renewal Jun 2025"
          tone: positive
        - id: moat
