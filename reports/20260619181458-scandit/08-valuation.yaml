          detail: "$1B 2022 mark at 8.4× ARR vs 3.4× SaaS median; 2.5× premium requires NRR/growth confirmation; stale 4-year-old mark"
          tone: negative
        - id: risk_disc
          label: Disclosure risk
          detail: "No NRR, no audited financials, no customer revenue breakdown; ARR growth unverified; 240% YoY requires corroboration"
