        - Prior investors take paper losses; Series D preference stack creates governance friction; signals distress
        - Negative signal; do not co-invest at down-round terms; seek senior preference in any new capital structure
      - - Free SDK mid-market displacement
        - "Google ML Kit or AWS Panorama measurably displace Scandit in ≥2 major verticals within 12 months"
        - ACV compression at low-to-mid end; Total Addressable Market shrinks; multi-year ARR ceiling lower
        - Reduce ACV estimates; compress DCF; assess product roadmap differentiation against free alternatives
      - - EU AI Act high-risk classification of ID products
        - "Formal guidance or enforcement action classifying ID Bolt/ID Validate as Annex III high-risk AI systems pre-2027"
        - Compliance cost burden on ID scanning margin; customer liability concerns reduce adoption rate
        - Reduce gross margin estimate for ID scanning by 300–500 bps; model incremental compliance spend
    notes: >-
      Kill triggers require verification from public announcements or data-room evidence; qualitative signals only
      (e.g., press reports) warrant escalation to re-investigation, not immediate action.

  - id: TV006
    title: Final diligence asks
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - ARR verification
        - "Audited or auditor-reviewed management-account ARR for FY2023, FY2024, and FY2025 YTD; reconciliation to GAAP revenue"
        - "The $119.1M ARR figure is founder-disclosed via LATKA only; 240% growth is the central valuation driver and unverifiable from public sources"
        - "Data room — audited accounts (Swiss CO2/IFRS) or Big Four-reviewed management accounts with ARR reconciliation"
      - - NRR and GRR by customer cohort
        - "Net revenue retention (NRR), gross revenue retention (GRR), and cohort-level revenue breakdown for 2022–2025"
        - "Land-and-expand thesis cannot be validated without cohort retention; NRR below 110% re-rates the multiple by 2–3× points"
        - "Data room — cohort P&L by entry year; annual revenue per customer for top 25 accounts; churn log FY2022–FY2025"
      - - Customer revenue concentration
        - "Top 10 customer ARR as % of total ARR; Walmart wallet share"
        - "Walmart is the single largest named customer with 1.3M associates; undisclosed concentration is a blocking underwriting gap"
        - "Data room — CRM revenue export or customer revenue schedule from management accounts; Walmart contract terms"
      - - Cap table, preference stack, and debt terms
        - "Full cap table by share class; liquidation waterfall; Kreos Capital loan quantum, rate, covenants, and maturity"
        - "Cannot model exit proceeds, preference overhang, or EV-to-equity bridge without full capital structure"
        - "Data room — cap table (Carta or equivalent); Kreos Capital loan agreement; investor rights agreement"
      - - EBITDA and cash runway
        - "FY2024 and FY2025 operating P&L including R&D, S&M, G&A; cash balance; burn rate; projected runway"
        - "Profitability trajectory and runway determine whether new primary capital is needed and on what terms"
        - "Data room — management accounts P&L; monthly bank statements (last 12 months); board-approved operating plan"
      - - Board composition and governance
        - "Board member names, roles, independence; Warburg Pincus governance rights; audit committee; co-founder vesting"
        - "Founder-only C-suite and undisclosed board create governance opacity; Warburg exit timeline may conflict with founder preferences"
        - "Data room — board minutes (last 8 quarters); shareholder agreement; investor rights; co-founder employment terms"
      - - EU AI Act classification plan
        - "Scandit legal team's written assessment of ID Bolt and ID Validate under EU AI Act Annex III for specific deployment contexts"
        - "Annex III compliance obligation (December 2027) creates unquantified future compliance cost"
        - "Data room — Scandit legal memo on AI Act classification; if unavailable, commission external EU AI Act counsel opinion"
    notes: >-
      All diligence asks are standard for a Series D+ enterprise SaaS investment. Priority order: (1) ARR verification,
      (2) NRR/GRR cohorts, (3) customer concentration. No public sources can substitute for data-room access on these topics.

