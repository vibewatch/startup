        - "#1 enterprise data capture SDK globally; 170M+ active devices; 2,100+ enterprise customers"
        - Free SDKs (Google ML Kit, ZXing) erode low-end market; cloud incumbents bundle scanning
        - Customer churn data; mid-market ACV trend over 12 months
      - - Revenue quality
        - Land-and-expand architecture structurally supports high NRR; Walmart 1.3M-associate renewal signals account depth
