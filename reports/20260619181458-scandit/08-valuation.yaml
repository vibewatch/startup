  - id: section-3
    title: Bull / base / bear scenario analysis and valuation range
    body: >
      Three scenarios frame the investment case for Scandit in mid-2026. Each scenario applies a
      different ARR trajectory and multiple assumption, reflecting different resolutions of the core
      uncertainty: whether the $119.1M ARR (November 2024) represents a sustainable inflection or
      a step-change that will revert toward prior growth rates.


      In the bull case, Scandit's 2024 ARR acceleration (from $35M to $119.1M, approximately 240%
      growth) is genuine and continues at a more moderate pace — approximately 30–40% annual growth
      — reaching $150–165M ARR by end-2026. This is consistent with the Walmart 1.3M-associate
      renewal in June 2025, continued enterprise platform expansion, and the ShelfView/MarketLab
      platform completing its ramp. If NRR is confirmed at 120%+ and the platform is reclassified as
      AI-enabled enterprise software, a 10–12× multiple is achievable. This implies a bull-case
      valuation of $1.5B–$2.0B, potentially supporting a strategic M&A exit at a further premium to
      an acquirer like SAP, Salesforce, or Zebra seeking to expand their software-only ARR base. In
      this scenario, existing investors are whole and the 2022 mark is validated.


      In the base case, ARR has grown modestly from the November 2024 figure, reaching approximately
      $125–140M by mid-2026. Multiple compression is partially offset by Scandit's above-median
      efficiency and niche platform depth. A 6–8× multiple on $130M ARR implies a base-case
      valuation of $780M–$1.04B — straddling the $1B mark with meaningful uncertainty in either
      direction. A new primary round at 7× $130M would price at approximately $910M (flat-to-down
      from $1B), indicating either a flat or mild down round. In this scenario, Warburg Pincus is
      near break-even on paper mark at the lower end of the range and marginally in the money at
      the upper end.


      In the bear case, the 2024 ARR figure is partially overstated or non-recurring, reflecting
      concentrated deal events (e.g., Walmart expansion, large one-time enterprise deals) that do not
      repeat. ARR normalises to $100–115M by 2026, and SaaS multiples remain compressed at 3–5×
      due to the Q1 2026 market reset. This implies a bear-case valuation of $350–575M — well below
      the $1B Series D mark, implying a significant down round for any new primary capital and
      material paper losses for Series D investors. In this scenario, the Kreos Capital debt overhang
      becomes material in the exit waterfall.


      The probability distribution across scenarios is skewed by the disclosure gap: without audited
      ARR, confirmed NRR, and cohort data, the bear case cannot be ruled out. The analyst recommendation
      is to treat the base case as the working assumption pending data-room access, with no buy
      recommendation at the 2022 $1B+ mark given the current 3.4× public market reference.

