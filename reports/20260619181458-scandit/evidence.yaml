  - id: EM001
    type: missing-source
    severity: material
    description: >-
      No single published analyst report provides a clean market size for enterprise smart-device data capture software
      (SDK licensing) as a standalone category. The $3–5B SAM estimate in this chapter is an analytic inference from
      multiple overlapping lens estimates, not a published figure. Any financial model relying on this number should be
      stress-tested and ideally replaced with primary research.
    relatedQuestionRefs:
      - QM001
      - QM021
    diligencePath: >-
      Commission primary market sizing research scoped to enterprise SDK/software-layer data capture platforms
      (excluding hardware). IDC, Gartner, or Forrester may publish adjacent segments on request. Alternatively, build a
      bottoms-up estimate from named customer counts × ACV × vertical TAM penetration.
  - id: EM002
    type: stale
    severity: minor
    description: >-
      Several market sizing estimates (WorldMetrics, Verified Market Reports) use 2022 as a baseline year with
      extrapolated growth rates; the actual 2026 market figures have not been independently verified by primary data
      collection for this chapter.
    relatedQuestionRefs:
      - QM025
    diligencePath: >-
      Request most recent (2025–2026) analyst updates from IDC or Gartner for barcode scanning and enterprise mobile
      computing categories. Cross-check against Zebra Technologies and Honeywell's publicly disclosed enterprise mobile
      segment revenues in their annual reports as anchors.
  - id: EM003
    type: private-evidence-only
    severity: material
    description: >-
      Scandit does not publicly disclose its revenue by vertical, by product line, or by geography. The vertical
      segmentation in TM003 (retail, logistics, healthcare, air travel, field service) is qualitative; revenue
      concentration by vertical is not publicly known and may differ substantially from the broad industry averages
      cited.
    relatedQuestionRefs:
      - QM010
      - QM012
    diligencePath: >-
      Request ARR or revenue breakdown by vertical, product line, and geography from the data room. Confirm whether
      retail, logistics, or healthcare is the largest revenue contributor and whether any vertical represents greater
      than 40% of ARR (concentration risk).
  - id: EM004
    type: missing-source
    severity: minor
    description: >-
      The 136% profitability leadership advantage for retailers with hybrid data capture (IHL Group, cited by Scandit)
      is a company-cited third-party statistic; the original IHL Group research methodology, sample size, and full
      report are not publicly available for independent review.
    relatedQuestionRefs:
      - QM022
    diligencePath: >-
      Obtain the IHL Group source report directly. Verify sample size, definition of "profitability leadership," and
      whether Scandit contracted IHL Group for the study (which would affect independence).
  - id: EM005
    type: missing-source
    severity: minor
    description: >-
      Saturation signals in the enterprise barcode scanning market — evidence that Scandit's target customers have
      already deployed a solution — are not well represented in public sources. No analyst published an
      adoption-saturation or slowdown-risk analysis for this specific software category as of the research date.
    relatedQuestionRefs:
      - QM022
      - QM025
    diligencePath: >-
      Search for customer churn data, competitive displacement reports, or Honeywell/Zebra investor presentations that
      describe software-layer competition. Review Scandit's NRR metric (not publicly disclosed) in the data room to
      assess whether existing customers are expanding or contracting.
  - id: EM006
    type: missing-source
    severity: minor
    description: >-
      The EU AI Act identity provisions and their specific application to enterprise document scanning deployments
      (Scandit ID Bolt) are not yet fully specified in publicly available regulatory guidance as of June 2026. The
      extent to which automated identity verification at boarding gates, hospitality, or age-gated retail qualifies as
      "high-risk AI" under the Act has not been publicly resolved by regulators.
    relatedQuestionRefs:
      - QM023
    diligencePath: >-
      Monitor EU AI Act implementing acts for identity verification classifications. Request from Scandit a legal
      opinion on whether ID Bolt qualifies as high-risk AI under the EU AI Act and confirm current GDPR data-processing
      architecture for ID scanning.
  - id: EP001
    type: private-evidence-only
    severity: material
    description: >-
      Scandit's net revenue retention (NRR) rate is not publicly disclosed; this is the single most important metric for
      assessing moat durability and switching-cost effectiveness. The >98% support satisfaction claim is
      company-reported and does not substitute for NRR. Without NRR, it is not possible to confirm whether the installed
      base of 2,100+ customers is expanding, contracting, or flat on a revenue-weighted basis.
    relatedQuestionRefs:
      - QP015
    diligencePath: >-
      Request NRR (net revenue retention) and gross revenue retention (GRR) from the data room, segmented by vertical
      (retail, logistics, healthcare) and cohort year. Request the churn log for accounts > $100K ACV that churned in
      2023–2025 and the cited competitive displacement reason.
  - id: EP002
    type: missing-source
    severity: material
    description: >-
      The Dynamsoft static-image benchmark is the most widely cited performance comparison for Scandit vs. Dynamsoft,
      but it measures only browser-based static image decoding — not camera-mode or native mobile SDK performance. No
      independent, camera-mode enterprise SDK benchmark exists in public literature as of mid-2026. The absence of an
      independent camera-mode benchmark means Scandit's performance advantage in its primary deployment scenario is not
      corroborated by any public third-party test.
    relatedQuestionRefs:
      - QP003
      - QP027
    diligencePath: >-
      Commission or locate an independent camera-mode barcode scanning benchmark that tests Scandit, Dynamsoft, and
      Scanbot on real-device, real-environment scenarios (warehouse, low-light, damaged labels). Alternatively, request
      Scandit's own accuracy benchmarking methodology and independent validation. The Dynamsoft benchmark should be
      cited in competitive collateral with explicit scope caveats.
  - id: EP003
    type: private-evidence-only
    severity: material
    description: >-
      Scandit's competitive win/loss data — which competitors it beats most often, which it loses to, and on what
      criteria — is not publicly available. The pricing comparison analysis in TP003 is based on published SDK pricing
      from competitor sources and third-party estimates; Scandit's actual realized ACV per customer and the discount
      structures offered in competitive bids are unknown.
    relatedQuestionRefs:
      - QP004
      - QP019
    diligencePath: >-
      Request win/loss analysis from Scandit's sales data room, including top three competitive displacement losses and
      the most common objection in lost deals. Request average ACV by product tier and any competitive pricing responses
      offered to retain at-risk accounts.
  - id: EP004
    type: stale
    severity: minor
    description: >-
      Revenue estimates for Anyline (~$42M), Microblink (~$28M), and Scanbot SDK are derived from third-party
      intelligence aggregators (Growjo, Tracxn, compworth.com) that estimate revenue from headcount models and industry
      proxies, not from financial disclosures. These companies are private and may have revenues that differ
      substantially from estimates. Estimates for Scanbot in particular could not be confirmed from any independently
      cited source in this research.
    relatedQuestionRefs:
