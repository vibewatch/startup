callouts:
- calloutType: risk
  title: Patent litigation risk remains open despite HHP withdrawal
  body: >-
    The UPC preliminary injunction issued August 2024 demonstrated that Scandit's
    BarcodeTrackingAdvancedOverlay SDK feature was found to likely constitute indirect
    infringement of EP 3 866 051. Although HHP withdrew in March 2025, the main proceedings
    were not settled; Honeywell retains the patent and could reassert claims in main
    proceedings or different jurisdictions. Future patent assertion campaigns from incumbent
    hardware vendors (Zebra, Cognex) leveraging overlapping portfolios cannot be excluded.
  claimRefs:
  - CR001
  - CR002
  - CR003

- calloutType: risk
  title: Benchmark performance gap is publicly documented and uncontested
  body: >-
    barKoder's published SDK comparison found Scandit's damaged PDF417 decoding rate at
    47.61% versus barKoder's 90.4%. Scandit has not published a counter-study or
    commissioned independent benchmarking. For logistics and healthcare deployments where
    damaged or poorly-printed labels are endemic, this performance gap could be a competitive
    disqualifier if surfaced in evaluations. Diligence should obtain Scandit's own accuracy
    data under controlled conditions and independent validation.
  claimRefs:
  - CR011
  - CR015

- calloutType: recommendation
  title: Investor diligence priority — NRR, customer concentration, and AI Act classification
  body: >-
    Three data gaps present the most material investment risk. First, NRR and GRR are
    undisclosed — confirming retention at Walmart scale and within the 2,100+ customer
    base is foundational to growth-stage valuation. Second, Walmart revenue concentration
    must be sized: if Walmart exceeds 15% of ARR, standard PE/VC risk frameworks require
    scenario modelling of account loss. Third, legal confirmation of EU AI Act
    classification for ID Bolt and ID Validate — whether these products fall under Annex III
    high-risk — should be obtained before the Digital Omnibus is formally adopted, given the
    potential compliance cost implications for Scandit's enterprise customers.
  claimRefs:
  - CR007
  - CR022
  - CR024
  - CR027

