- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Patent litigation (hardware vendor IP assertion)
    - New UPC, US, or PCT infringement actions filed against Scandit or its SDK products
    - Any new suit filed by Honeywell, Zebra, Cognex, or Hand Held Products asserting SDK-related patents
    - Immediate legal review; assess injunction risk; SDK product roadmap impact; potential divestiture of affected feature
  - - EU AI Act compliance (ID scanning classification)
    - GDPR/AI Act supervisory authority investigation or guidance letter targeting Scandit or a named customer deployment
    - Any national DPA or EDPB finding that Scandit's ID Bolt/ID Validate constitutes a high-risk AI system in a specific deployment
    - "Thesis-break: re-evaluate ID scanning product line revenue and compliance roadmap cost; obtain legal classification opinion"
  - - Competitive displacement (Google ML Kit or platform-native scanning)
    - G2/Capterra/PeerSpot review volume decline; developer community shift to free SDKs; Scandit sales win rate vs free alternatives dropping below 60%
    - Any publicly documented large enterprise win (>10,000 devices) by ML Kit or equivalent displacing Scandit
    - Re-evaluate moat durability; accelerate AR/workflow differentiation investment; consider pricing tier revision
  - - Customer concentration (Walmart)
    - Any Walmart announcement of scanning platform review, competitive RFP, or in-house scanning investment
    - Walmart downsizes, renegotiates, or exits Scandit partnership; loss of >10% ARR implied
    - "Thesis-break: re-model ARR trajectory; assess Walmart revenue concentration as % of total; evaluate strategic alternatives"
  - - Valuation / liquidity risk
    - SaaS Capital Index median multiple dropping below 5× ARR; Warburg Pincus hold period exceeds 7 years (post-2029 without exit)
    - Down-round financing event or strategic sale at sub-$700M valuation
    - "Thesis-break: re-evaluate risk-adjusted return; assess board alignment on exit timeline; review secondary market pricing"
  - - Key-person departure
    - CEO or CTO departure announcement
    - Unplanned departure of any of the three co-founders within 12 months of investment
    - "Thesis-break: immediately assess succession plan and interim leadership quality; evaluate customer and investor confidence impact"
  - - Financial opacity resolution
    - No NRR, GRR, or audited financial data disclosed after 18 months of investor engagement
    - Persistent refusal to provide audited NRR and GRR data in a diligence context
    - "Thesis-break: cannot invest at growth-stage premium without retention data; downgrade to monitor"
  notes: >-
    Kill criteria are heuristic thresholds based on public evidence and standard institutional
    diligence practice. All thresholds require confirmation with actual Scandit financial and
    contractual data before being applied.
  claimRefs:
  - CR001
  - CR007
  - CR011
  - CR022
  - CR024
  - CR029
  - CR027

