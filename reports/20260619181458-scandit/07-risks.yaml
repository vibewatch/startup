  - - iOS/Android platform API breaking change or deprecation
    - Medium — Apple and Google historically make annual breaking changes in camera stack
    - High — unpatched incompatibility could disrupt 170 million+ active devices simultaneously
    - High — Scandit has 15+ years maintaining SDK compatibility; documented fast patch cadence
    - Low-Medium — risk is managed but cannot be eliminated; beta SDK testing programme in place
    - SLA for emergency OS compatibility patches not publicly disclosed
  - - Proprietary Vision AI Engine audit gap (no third-party accuracy audit)
    - High — structural gap, no independent audit exists
    - Medium — creates buyer skepticism and regulatory documentation gap for EU AI Act high-risk compliance
    - Low — no third-party audit programme identified; all accuracy claims are company-originated
    - Medium — regulatory requirement for AI system documentation (GPAI and high-risk) may mandate accuracy testing evidence post-2026
