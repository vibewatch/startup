  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: customer concentration
    missingEvidence: >-
      Wallet share of Walmart (and top 5 customers) as a percentage of total ARR; no public
      revenue breakdown by customer is available.
    whyItMatters: >-
      Cannot size the revenue impact of losing the largest named account without knowing its
      revenue share; standard PE/VC diligence requires scenario modelling for any customer >10%
      of ARR.
    diligencePath: >-
      Request Scandit management information pack and CRM revenue data showing ARR breakdown
      by top 10 customers, vertical, and geography.
    relatedQuestionRefs:
    - QR004
    - QR026
    relatedTableRefs:
    - TR003

  - type: private-evidence-only
    severity: blocking
    topic: financial opacity
    missingEvidence: >-
      NRR, GRR, churn rate, burn rate, CAC, LTV, and audited financial statements; none are
      public.
    whyItMatters: >-
      Cannot validate growth-stage premium (8.4× implied ARR multiple) without retention data;
      NRR below 110% would indicate material risk to ARR growth trajectory.
    diligencePath: >-
      Request audited accounts or management accounts for FY2023, FY2024, and FY2025 YTD;
      request NRR/GRR by cohort; request burn rate and cash runway.
    relatedQuestionRefs:
    - QR007
    - QR018
    - QR025

  - type: missing-source
    severity: material
    topic: benchmark performance
    missingEvidence: >-
      Independent third-party benchmark of Scandit's Vision AI Engine covering the full
      symbology matrix, environmental conditions (lighting, damage, distance, angle), and
      device diversity range used by enterprise customers.
    whyItMatters: >-
      Scandit's only published competitive benchmark data comes from a competing vendor
      (barKoder); Scandit has not countered with its own independent accuracy study, making
      performance claims unverifiable.
    diligencePath: >-
      Commission or obtain access to an independent benchmark lab test (e.g. AIM Global,
      university lab, or third-party consultancy) covering Scandit vs. Dynamsoft, Honeywell,
      and Google ML Kit on standardised barcode sets.
    relatedQuestionRefs:
    - QR006
    - QR013
    relatedTableRefs:
    - TR002

  - type: missing-source
    severity: material
    topic: EU AI Act classification
    missingEvidence: >-
      Legal opinion or Scandit-published guidance on whether ID Bolt and ID Validate products
      are classified as high-risk AI systems under EU AI Act Annex III for specific deployment
      contexts (border control, age verification, employment identity checks).
    whyItMatters: >-
      Annex III obligations (December 2027 under Digital Omnibus) include risk management,
      data governance, human oversight, and transparency requirements; if applicable, these add
      compliance cost for Scandit's enterprise customers and potentially for Scandit as AI system
      provider.
    diligencePath: >-
      Request Scandit legal team's written EU AI Act product classification analysis for
      ID Bolt and ID Validate; obtain external EU AI Act counsel opinion if Scandit classification
      is not provided.
    relatedQuestionRefs:
    - QR023
    - QR016
    relatedTableRefs:
    - TR001

  - type: private-evidence-only
    severity: material
    topic: governance opacity
    missingEvidence: >-
      Board composition (member names, roles, independence), audit committee structure, investor
      governance rights, and co-founder retention/vesting terms.
    whyItMatters: >-
      Cannot assess alignment between investor exit timeline (Warburg Pincus ~2026–2029
      window) and founder preferences; cannot assess governance independence or oversight
      quality.
    diligencePath: >-
      Request board composition and investor rights documentation as part of standard VC/PE
      due diligence; confirm founder employment terms and retention equity package.
    relatedQuestionRefs:
    - QR012
    - QR027

