company:
  name: Scandit
chapter:
  number: 7
  title: Risks
  summary: >-
    Scandit's primary risk profile as of mid-2026 spans four domains. Legal/IP: a 2024 UPC
    preliminary injunction for indirect patent infringement issued against Scandit by Hand Held
    Products (Honeywell) was withdrawn in March 2025 and the parallel US suit dismissed with
    prejudice, but the episode signals ongoing patent-attack exposure from incumbent hardware
    vendors. Regulatory: EU AI Act high-risk biometric system obligations (originally August 2026)
    are provisionally deferred to December 2027 under the Digital Omnibus deal, providing material
    near-term relief; however, GDPR transparency enforcement priorities and ID-scanning
    special-category data requirements remain live and intensifying. Competitive/platform:
    free alternatives (Google ML Kit, ZXing) commoditize the low-to-mid scanning market;
    third-party benchmarks show Scandit's PDF417 reading rate at 47.6% versus barKoder's 90.4%
    on damaged samples; iOS/Android platform API dependency creates continuous SDK maintenance
    overhead. Operational/valuation: the $1B Series D valuation from February 2022 implies
    approximately 8.4× last-disclosed ARR against a 2025 SaaS median of approximately 7×;
    all three co-founders remain in active C-suite control creating key-person concentration;
    and the absence of public NRR/GRR, audited financials, or customer revenue breakdowns
    limits investor diligence. No GDPR fines, security breaches, enforcement sanctions,
    or criminal proceedings have been identified through mid-2026.
sections:
- id: section-1
  title: Regulatory, privacy, and IP/legal risk landscape
  body: >-
    Scandit faces two distinct legal risk vectors: patent litigation from incumbent hardware
    vendors and evolving regulatory obligations from EU data-protection and AI law.


    On the patent front, Hand Held Products, Inc. (HHP, a Honeywell subsidiary) filed an
    application for provisional measures against Scandit at the Munich Local Division of the
    Unified Patent Court (UPC) on February 21, 2024, the same day European Patent EP 3 866 051
    was granted. The patent covers devices and methods for reading and displaying barcodes
    associated with product images. On August 27, 2024, the Munich LD issued a preliminary
    injunction against Scandit on the basis of indirect infringement, finding that Scandit's
    Data Capture SDK — specifically the BarcodeTrackingAdvancedOverlay feature — supplied an
    essential means enabling customers to build patent-infringing software. Scandit appealed
    and an oral hearing was held January 9, 2025. On March 13, 2025, HHP withdrew its request
    for provisional measures; the UPC Court of Appeal formally closed the proceedings on April
    18, 2025. Simultaneously, HHP filed a US District Court action (N.D. Illinois, 1:24-cv-11027)
    asserting five US patents; that suit was voluntarily dismissed with prejudice by HHP on
    March 14, 2025, with each party bearing its own legal costs and no infringement finding.
    The rapid withdrawal on both sides, combined with Scandit's payment demand for €500,000
    security for costs, suggests HHP concluded the litigation risk/reward was unfavourable.
    Nonetheless, the episode illustrates a recurring risk: Honeywell, Zebra Technologies, and
    Cognex hold large hardware-adjacent patent portfolios in barcode technology, and future
    patent assertion campaigns cannot be ruled out given Scandit's continued displacement of
    dedicated scanner hardware. The fact that Scandit's SDK was found to likely constitute
    indirect infringement in the UPC preliminary ruling — before HHP withdrew — shows that
    the BarcodeTrackingAdvancedOverlay feature class carries non-zero patent-attack surface.


    On the regulatory front, GDPR remains the primary compliance obligation. Scandit's ID
    Scanning and ID Validate products process identity documents (passports, driver's licences)
    that contain biometric data; when used for identity verification rather than simple data
    extraction, this may constitute "special category data" processing under GDPR Article 9,
    requiring explicit consent or a narrowly defined legal basis. Scandit's on-device
    architecture — all processing is performed locally on the scanning device for all products
    except ShelfView — mitigates the data transfer and centralised storage risk materially.
    Scandit is ISO 27001:2022 certified and maintains a dedicated Information Security team with
    executive oversight. The EDPB has designated transparency and information obligations as the
    coordinated enforcement priority for 2026 under Articles 12–14 GDPR, meaning Scandit's
    enterprise customers deploying ID scanning workflows face heightened compliance scrutiny
    when disclosing to end-users how their identity document data is handled. No GDPR
    enforcement action against Scandit has been identified.


    The EU AI Act introduces a prospective risk tier. Article 5 prohibited practices — including
    real-time biometric identification in public spaces, emotion recognition at workplaces, and
    untargeted facial image scraping — came into force February 2, 2025; none of these appear
    to apply directly to Scandit's current product lines, which are document/barcode-oriented.
    The original August 2, 2026 deadline for high-risk biometric system compliance (Annex III)
    has been provisionally deferred to December 2, 2027 under the Digital Omnibus political
    agreement of May 7, 2026, though this is not yet formally law. If Scandit's ID Bolt and
    ID Validate products are classified as high-risk biometric identification systems in
    specific deployments (e.g., age verification at borders, employee identity checks),
    compliance obligations — risk management systems, data governance, human oversight, and
    transparency — would apply. No enforcement action against Scandit under the AI Act has
    been identified. The net risk is material but primarily borne by Scandit's enterprise
    customers; Scandit's role as data processor rather than data controller in most deployments
    shifts primary GDPR liability to the enterprise.
