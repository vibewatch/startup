      filings, GDPR/EU AI Act regulatory timelines, and public Scandit compliance disclosures.
  rows:
  - - HHP/Honeywell UPC patent PI (EP 3 866 051)
    - EU (UPC — Germany)
    - "Closed: HHP withdrew provisional measures March 2025; UPC CoA formally closed April 2025. No finding of final infringement."
    - Low (resolved)
    - Medium — preliminary injunction was granted and SDK modification required
    - HHP withdrawal renders PI moot; BarcodeTrackingAdvancedOverlay risk factored into product; Scandit's request for €500k security for costs awarded
    - Low — ongoing; future Honeywell assertion of underlying EP 051 in main proceedings remains possible
    - Obtain Scandit counsel briefing on main proceedings status and any settlement terms
  - - HHP/Honeywell US patent suit (1:24-cv-11027, N.D. Illinois)
    - US (Federal)
    - "Closed: HHP voluntarily dismissed with prejudice March 14, 2025; no infringement finding; no damages."
    - Low (resolved)
    - Low — dismissed with prejudice bars re-assertion of same patents for same conduct
    - Voluntary dismissal with prejudice is permanent bar; Scandit bears no liability exposure from this case
    - Minimal — five US patents litigated; dismissed. Risk from other Honeywell/HHP patents not in this suit remains
    - Confirm via Scandit legal team whether any other HHP/Honeywell US patents remain asserted
  - - EU AI Act — high-risk biometric system obligations (Annex III)
    - EU
    - Originally August 2, 2026; Digital Omnibus provisional agreement (May 7, 2026) defers standalone high-risk to December 2, 2027; not yet formally law
    - Medium — deferral provisionally agreed but not enacted
    - High — if ID Bolt/ID Validate classified as high-risk, Scandit's enterprise customers face risk management, data governance, human oversight, and transparency obligations
    - On-device architecture; Scandit as data processor not controller; ISO 27001:2022; GDPR compliance programme
    - Medium — Omnibus deferral pending formal adoption; customers in border/employment/essential-services contexts remain in scope even post-deferral if using ID scanning for biometric identification
    - Confirm Scandit's legal classification of ID Bolt/Validate products against EU AI Act Article 6 and Annex III definitions; obtain customer-facing compliance guidance
  - - GDPR special-category data (ID scanning — biometric data)
    - EU/EEA and UK
    - Live and enforcing; EDPB 2026 coordinated enforcement action focuses on transparency obligations (Articles 12–14); no GDPR action against Scandit identified
    - Medium — enterprise customers using ID scanning face heightened transparency scrutiny in 2026
    - Medium — fines up to 4% global turnover for controller-side violations; Scandit is data processor in most deployments, limiting direct exposure
    - On-device processing eliminates central data storage; Scandit as data processor not controller; DPA/data processing agreements in place per privacy policy; Aphaia Ltd as nominated DPO
    - Low-Medium — risk primarily flows to enterprise customers; Scandit's processor role limits direct GDPR liability but contractual liability clauses in customer agreements create indirect exposure
    - Request DPA template and evidence of DPIA process for ID scanning deployments; confirm processor liability caps
  - - US state privacy laws (CCPA, state biometric laws — BIPA Illinois, Washington, Texas)
    - US (multi-state)
    - Live; CCPA compliance stated on Scandit website; BIPA-style biometric privacy laws in 12+ US states create strict liability for ID data collection without consent
    - Low-Medium — Scandit's on-device architecture and processor role substantially mitigate direct liability
    - Medium — BIPA provides $1,000–5,000 per violation statutory damages; class actions common
    - On-device processing; processor-not-controller position; privacy policy and terms of service disclosures; US entity (Scandit Inc.) operates under US legal framework
    - Low — no Scandit-specific BIPA or CCPA enforcement identified; risk primarily borne by enterprise customers
    - Confirm indemnification scope in enterprise customer contracts for US biometric privacy law violations
  notes: >-
