  - id: section-2
    title: Founders, leadership, and governance
    body: >
      Scandit's three co-founders remain in active leadership roles, a notable factor in a company of this vintage
      and funding stage. Samuel Mueller, CEO and co-founder, has led the company since founding in 2009 and continues
      as the primary strategic and public spokesperson, as confirmed by his named statements in the Series D press
      release, the MarketLab acquisition announcement, and the June 2025 Walmart partnership renewal. Christian
      Floerkemeier, CTO and VP Product, oversees the technical roadmap. Christof Roduner, CIO and VP Engineering,
      oversees the engineering organization. The founding team's depth in computer vision, ETH Zurich Auto-ID Labs
      research, and enterprise software scaling is a material differentiator relative to typical software scale-ups
      where founders have departed by the growth stage.


      Beyond the three founders, the publicly identified senior leadership team includes Uwe Kraemer (CFO) and
      Natasha Sandoval (Chief Marketing Officer). No material C-suite departures or adverse leadership changes have
      been identified in publicly available sources through mid-2026. Key-person concentration is a legitimate
      diligence point: Mueller is the named CEO for all major company announcements across every funding round and
      partnership, and the continuity of all three founders in technical leadership creates a differentiated but
      concentrated governance structure.


      Scandit is a VC-backed private company and does not publicly disclose its board composition in detail.
      Warburg Pincus (Series D lead), Atomico (Series A, B, C, D participant), and other Series D investors
      including G2VP and GV would be expected to hold board representation, but specific board member identities
      and governance mechanics are not available in public sources. This is a gap for diligence and is noted
      explicitly in the stakeholder table below.


      No lawsuits, regulatory sanctions, executive misconduct allegations, or material governance controversies
      involving Scandit have been identified in publicly available sources through the research conducted for
      this chapter as of 2026.
