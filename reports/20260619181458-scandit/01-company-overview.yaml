  - calloutType: strength
    title: Three founding researchers still lead the company
    body: >-
      All three co-founders — Mueller, Floerkemeier, and Roduner — remain in active executive roles more than
      fifteen years after founding. This founder-operator continuity through the growth stage is unusual and
      signals deep product conviction and institutional knowledge in computer vision.
    claimRefs:
      - CO012
      - CO013
      - CO014
  - calloutType: insight
    title: Warburg Pincus and Atomico create a differentiated investor pairing
    body: >-
      Atomico's consecutive participation from Series A through Series D and Warburg Pincus's B2B software
      growth-equity track record creates a combined institutional base with both technology-company building
      experience and scale-up capital discipline. This pairing is atypical for a sub-$200M-raised European
      software company.
    claimRefs:
      - CO020
      - CO022
      - CO023
      - CO024
  - calloutType: risk
    title: Headcount trajectory and private ARR carry material diligence gaps
    body: >-
      The implied headcount decline from 550 in 2022 to 364–392 in 2024–2025 is unexplained in public sources
      and has not been confirmed by Scandit. The $119.1M ARR figure is founder-disclosed via LATKA and is not
      independently audited. Both metrics should be confirmed in the data room before use in financial modelling.
    claimRefs:
      - CO034
      - CO035
      - CO036
      - CO037
