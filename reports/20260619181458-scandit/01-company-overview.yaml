  - id: section-5
    title: Milestones, partnerships, and adverse context
    body: >
      Scandit's public record is a clean growth arc punctuated by successive funding milestones, product
      expansions, and strategic partnerships, with no material adverse events identified through mid-2026.
      The company's founding in November 2009 traces directly to ETH Zurich doctoral research; the initial
      proof-of-concept used a granola box as the first scanning target, as recounted in the 2025 Top100 Swiss
      Startup retrospective by the founders themselves.


      Early recognition events (2011 CTI Startup Label, Top 100 Swiss Startups, Nokia innovation prize) validated
      the technology prior to significant commercial scale. The first institutional round (Series A, 2017 with
      Atomico) came after several years of bootstrapped customer acquisition, with Atomico's Series A announcement
      stating the company had already built a customer base that included major retailers and logistics companies.
      MatrixScan, the multi-barcode AR product, was launched in April 2017. The Series B in July 2018 (GV,
      Atomico, NGP Capital, $30M) coincided with first named large enterprise customer evidence including DHL,
      Sephora, and Louis Vuitton. The Series C in May 2020 ($80M, G2VP, Salesforce Ventures) arrived during
      the COVID-19 pandemic as contactless-scanning demand surged; the press release described tripled revenue
      and doubled blue-chip customer count from the 2018 base.


      The two most important post-Series D developments are both clearly documented. First, the August 2024
      MarketLab acquisition (Scandit's first acquisition) added a Polish fixed-camera shelf audit AI team
      and technology into the ShelfView product, broadening the retail offering from mobile-only to hybrid
      mobile/fixed-camera shelf intelligence. Second, the June 2025 Walmart partnership renewal and expansion,
      reported by Chain Store Age, confirmed that Walmart has been deploying Scandit across multiple associate
      workflows since 2022, covering order fulfillment, stock replenishment, self-checkout receipt checks,
      and AR-guided backroom operations for 1.3 million store associates.


      No material adverse events — lawsuits, regulatory sanctions, data breaches, leadership misconduct,
      product recalls, or publicly disclosed governance disputes — have been identified in publicly available
      sources for Scandit through mid-2026. The competitive landscape does carry a structural risk: large
      platform companies such as Google, Apple, and Amazon embed commodity scanning capabilities in their
      ecosystems, and hardware incumbents Zebra Technologies and Honeywell offer integrated device-plus-software
      solutions. A market research report from MarkWide Research notes that smartphone SDKs like Scandit's are
      explicitly identified as a "substitution threat" to standalone scanner hardware in the barcode scanner
      market analysis. These dynamics are noted for later-chapter diligence but do not constitute adverse
      factual findings about Scandit's current operations.
