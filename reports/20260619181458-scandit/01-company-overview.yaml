  - id: section-3
    title: Funding history, valuation, and investor map
    body: >
      Scandit has raised approximately $273M to $300M in venture capital across at least six institutional funding
      rounds since 2013, making it the best-capitalized pure-play mobile data capture company in the world. Multiple
      sources including the LATKA database, Tracxn, and Seedtable report total funding at $273M; the Series D press
      release described the total at that time as "almost $300 million," reflecting rounding of earlier undisclosed
      amounts and inclusion of prior pre-Series A instruments.


      The funding progression is clearly documented: an early $5.5M pre-Series A in 2014, followed by a $7.5M
      Series A in January 2017 led by Atomico, a $30M Series B in July 2018 led by GV with Atomico and NGP Capital,
      an $80M Series C in May 2020 led by G2VP with Salesforce Ventures, Swisscom Ventures, Atomico, GV, Kreos,
      and NGP Capital, and the flagship $150M Series D in February 2022 led by Warburg Pincus with Atomico,
      Forestay Capital, G2VP, GV, Kreos, NGP Capital, Schneider Electric, Sony Innovation Fund by IGV1, and
      Swisscom Ventures. The Series D set the public valuation at over $1 billion, granting unicorn status.


      No subsequent primary funding rounds or publicly disclosed secondary transactions, valuation changes, or
      debt instruments have been identified between the February 2022 Series D close and the June 2026 research
      date. This means the $1B+ valuation from 2022 is the most recent publicly supportable figure, though the
      company's reported ARR growth from approximately $35M in late 2023 to $119.1M in late 2024 suggests that
      the underlying business may support a higher contemporary valuation. That inference is not corroborated by
      a disclosed transaction and should be treated as a diligence gap.


      Atomico has participated in every institutional round from Series A through Series D and is the longest-
      tenured institutional investor. Warburg Pincus, as Series D lead, is the most recent and largest single-
      check investor at over $73 billion AUM with a track record in B2B software scale-ups. The investor base
      includes both strategic corporate investors (Schneider Electric, Salesforce Ventures, Samsung implicit via
      partnership, Swisscom Ventures) and financial sponsors (Warburg Pincus, Atomico, G2VP, GV, NGP Capital,
      Forestay Capital), creating a diverse set of stakeholder interests.
