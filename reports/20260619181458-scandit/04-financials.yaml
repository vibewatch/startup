  - id: section-2
    title: ARR trajectory and customer-count economics
    body: >
      Scandit's ARR trajectory reconstructed from available public sources shows two phases: a period of
      moderate growth from founding through the 2022 Series D, followed by extraordinary acceleration
      in 2024. The LATKA database, which aggregates founder-disclosed SaaS metrics, provides the only
      external ARR time series available: $21M in April 2021, $35M in December 2023, $61.9M earlier in
      2024, and $119.1M as of November 2024. The Series D press release in February 2022 independently
      corroborates directional ARR growth by stating that ARR more than doubled between the May 2020
      Series C and the February 2022 Series D, and that the company tripled recurring revenues between
      the July 2018 Series B and the 2020 Series C.


      The 240%-plus year-over-year ARR growth implied between December 2023 ($35M) and November 2024
      ($119.1M) is extraordinary for a company at this scale and is the single most consequential
      financial fact that requires corroboration in a data room. No independent audit, press disclosure,
      investor announcement, or analyst coverage has confirmed this figure. The directional narrative
      is plausible — Scandit's land-and-expand model at major enterprise accounts including Walmart
      (1.3M+ associates since 2022, renewed June 2025), FedEx, DHL, and NHS could generate outsized
      expansion ARR as usage scales — but the magnitude and timing are not verifiable from public
      sources as of June 2026. An earlier 2024 figure of $61.9M suggests meaningful intra-year
      acceleration.


      Customer count introduces a significant complication for ACV estimation. The company's homepage
      states 2,100+ enterprise customers as of June 2026; LATKA reports approximately 1,000 customers.
      This 2:1 discrepancy likely reflects different definitional thresholds (LATKA may exclude small
      or trial-phase accounts while the company counts all active licensed deployments), but it means
      the implied average ACV ranges from approximately $57K (if 2,100 customers) to $119K (if 1,000
      customers), a range too wide for reliable underwriting without confirmed count. Both figures are
      consistent with an enterprise-caliber ACV above the $25K mid-market threshold.


      The growth trajectory from Series B through Series D is consistent with the company's stated
      land-and-expand model: tripled revenues from 2018 to 2020, doubled from 2020 to 2022, then
      apparent plateau through 2023 before the 2024 acceleration. The plateau period coincides with
      aggressive headcount build (553 employees at December 2022 peak) and investment in new product
      lines including ShelfView. The acceleration may reflect the payoff of that investment and/or
      the MarketLab acquisition completing Scandit's retail hybrid data capture platform.
