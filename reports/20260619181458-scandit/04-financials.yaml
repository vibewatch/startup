  - id: section-3
    title: Cost structure, unit economics, and gross-margin proxy
    body: >
      Scandit's gross margin profile is not publicly disclosed, but its on-device software architecture
      provides a basis for estimation. The SDK runs natively on the device using the device's own
      compute resources — it does not stream video to a cloud backend for processing, which eliminates
      the largest variable COGS driver in cloud-native computer vision businesses. Scandit's COGS
      consists primarily of cloud infrastructure for the licensing and telemetry layer, customer support
      and success engineering, R&D amortization attributable to delivery, and some professional services
      costs associated with enterprise onboarding and integrations. On this basis, Scandit's gross
      margin should fall in the 75–82% range, consistent with the enterprise SaaS median of approximately
      76% (CloudZero 2025) and the high end of that range for software-only delivery models.


      Benchmarkit's 2025 private SaaS benchmark survey across more than 1,000 companies identifies
      ARR per full-time equivalent (FTE) at the >$100M ARR tier as approximately $300,000 median.
      Scandit's implied ARR/FTE of $327K ($119.1M / ~364 employees as of November 2025) places it
      slightly above the median for its ARR cohort, which is a positive efficiency signal, particularly
      given that the headcount has contracted from a peak of 553 in December 2022.


      Sales and marketing expenses for VC-backed private SaaS companies are typically 40–47% of
      revenue per the Benchmarkit 2025 survey. At Scandit's ARR scale, with expansion ARR representing
      over 50% of new ARR (an industry benchmark pattern for companies above $50M ARR), blended CAC
      efficiency would be considerably better than new-logo CAC alone. Scandit has not disclosed CAC
      or payback period metrics; the only proxy is the distribution of its 58-person sales team (per
      Highperformr.ai headcount data) against $119M ARR, implying approximately $2M ARR per sales
      employee, which is healthy for enterprise SaaS.


      Net revenue retention is also undisclosed but can be estimated from benchmarks. Enterprise B2B
      SaaS companies with ACV above $100K achieve a median NRR of 118%, with top-quartile performers
      exceeding 130% (Optif.ai 2026, N=939 companies). Scandit's land-and-expand architecture —
      where customers typically add workflows, product modules, devices, or geographies over time —
      is structurally well-suited to generating the seat expansion and upsell pattern that drives
      high NRR in enterprise SaaS. The co-founders confirmed in a December 2025 interview that the
      land-and-expand model remains central to growth. However, NRR cannot be confirmed without
      cohort-level revenue data from the company's data room.


      R&D investment is significant and non-optional. Maintaining compatibility across 20,000+ device
      models (confirmed by co-founders in the December 2025 interview), advancing MatrixScan,
      ID Validate, and ShelfView capabilities against an evolving competitive landscape, and integrating
      AI/ML into the platform requires ongoing engineering investment. The Benchmarkit benchmark places
      R&D at approximately 34% of revenue for private SaaS, which would imply ~$40M annual R&D spending
      at Scandit's current ARR. Actual spend is unconfirmed.
