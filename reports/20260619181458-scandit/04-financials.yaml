callouts:
  - calloutType: strength
    title: Top-quartile ARR-per-employee efficiency
    body: >-
      Scandit's implied ARR per full-time employee of approximately $327K ($119.1M / 364 employees) is
      above the Benchmarkit 2025 median of $300K for private SaaS companies at the >$100M ARR tier.
      Following the headcount contraction from 553 at peak (December 2022) to 364 (November 2025), the
      company's output per head compares favorably to enterprise SaaS benchmarks, suggesting improving
      capital efficiency and a path toward profitability.
    claimRefs:
      - CI020
      - CI021
      - CI022
      - CI023

  - calloutType: risk
    title: Uncorroborated 240% ARR growth and simultaneous headcount reduction require data-room validation
    body: >-
      The most material financial risk is that Scandit's reported jump from $35M ARR (December 2023) to
      $119.1M ARR (November 2024) — a 240% year-over-year increase — is sourced exclusively from a
      founder-disclosed LATKA database entry and is not corroborated by any independent audit, press
      release, investor announcement, or analyst coverage. Simultaneously, the company's headcount dropped
      by approximately 153 employees (from 545 to 392) between October and December 2024, a ~28% reduction
      in approximately two months that has not been publicly explained. These two signals require specific
      data-room responses before the ARR figure can be used as a reliable underwriting input.
    claimRefs:
      - CI010
      - CI011
      - CI037
      - CI038
      - CI039

  - calloutType: risk
    title: Kreos Capital venture debt terms are undisclosed
    body: >-
      Kreos Capital, a specialized venture debt provider now owned by BlackRock, appears in both the 2020
      Series C and 2022 Series D investor lists. Kreos typically structures non-dilutive debt facilities
      alongside equity rounds for high-growth technology companies. The quantum, interest rate, maturity,
      and covenants of any Kreos facility at Scandit are not publicly available. Debt service obligations
      and any financial covenants could restrict flexibility at a time when no new primary equity has been
      raised for more than four years.
    claimRefs:
      - CI031
      - CI032
      - CI033
      - CI034

  - calloutType: insight
    title: On-device architecture structurally limits cloud COGS
    body: >-
      Unlike cloud-based computer vision APIs that charge per API call and require significant backend compute
      to process every image server-side, Scandit runs inference entirely on the device using the device's own
      compute resources. This means Scandit does not pay cloud infrastructure COGS proportional to scan volume —
      80 billion barcode scans per year do not create 80 billion cloud compute events billed to Scandit. This
      architecture structurally supports gross margins in the 75–82% range, which would be anomalously low for
      a cloud API but is appropriate for an on-device SDK company.
    claimRefs:
      - CI018
      - CI019
      - CI025

