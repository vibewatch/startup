  - id: section-5
    title: Financial verdict, adverse evidence, and diligence blockers
    body: >
      The financial picture for Scandit is broadly positive but carries important caveats that make
      full underwriting impossible without data-room access. The company has the hallmarks of a
      high-quality enterprise SaaS business: an on-device architecture with strong gross margin
      economics, a land-and-expand model generating estimated above-benchmark NRR, a diversified
      enterprise customer base with named Fortune-500 anchor accounts, and a capital-efficient
      workforce operating at top-quartile ARR per employee. The $119M ARR at $1B+ valuation (from
      2022) is consistent with current SaaS market pricing if growth continues at 20–30%+ annually.


      The primary adverse financial signals are: (1) the 240% ARR jump between December 2023 and
      November 2024 is extraordinary and uncorroborated by any primary source; (2) the headcount
      drop from 545 employees in October 2024 to 392 in December 2024 — a reduction of 153 people
      (~28%) in approximately two months — is consistent with a material workforce reduction event
      that has not been publicly disclosed; (3) the customer count discrepancy between LATKA (1,000)
      and the company website (2,100+) creates ACV calculation uncertainty; (4) Kreos Capital's
      participation in two rounds as a venture debt provider creates a potential debt obligation
      whose terms are undisclosed; and (5) no primary funding since February 2022 leaves the last
      public valuation anchor at 2022 market conditions, which is not directly comparable to 2026
      valuation realities.


      The growth quality question is the central financial diligence issue. If the ARR jump to
      $119M in late 2024 reflects genuine enterprise expansion (e.g., Walmart at scale, FedEx,
      DHL, and NHS expanding usage across the full platform), the implied NRR would be consistent
      with top-quartile enterprise SaaS benchmarks and the business would be genuinely
      capital-efficient. If instead it reflects aggressive multi-year contract recognition, a
      definitional change in ARR counting, or a small number of very large one-time contracts,
      the underlying growth quality would be lower. The simultaneous headcount reduction in Q4
      2024 is ambiguous: it could reflect post-restructuring efficiency, or it could mean the
      workforce was right-sized after growth targets proved unachievable.


      Professional services revenue and its margin profile are also undisclosed. Enterprise SDK
      deployments often require significant integration support, which could include lower-margin
      services revenue that compresses blended gross margins below the 75–82% software-only
      estimate. The share of ARR attributable to professional services versus pure software
      license is a critical data-room inquiry.
