chapter:
  number: 4
  title: Financials
  summary: >-
    Scandit's financial profile is that of a high-efficiency enterprise SaaS platform with $119.1M ARR as of
    November 2024 (founder-disclosed via LATKA), roughly 340–370 employees, and an estimated ARR-per-employee
    ratio of ~$327K that places it near the top quartile of private SaaS peers. Revenue is generated through
    annual SDK subscription licenses priced by device count or flat annual fee across three capability tiers
    (Core, Standard, Advanced), with an estimated gross margin of 75–82% consistent with on-device software
    economics. The company has raised $273.1M across eight rounds with no public capital raise since the
    February 2022 Series D at $1B+ valuation; capital adequacy through mid-2026 is supportable given ARR
    scale, but full underwriting requires data-room access to cash balances, Kreos Capital debt terms,
    audited P&L, and confirmed customer count.
sections:
  - id: section-1
    title: Revenue model, pricing structure, and monetization tiers
    body: >
      Scandit monetizes its smart data capture platform almost entirely through enterprise software
      licensing and SDK subscription fees. The company does not manufacture hardware, eliminating the
      inventory, warranty, and logistics cost drivers that constrain hardware-centric competitors. Revenue
      recognition follows a software subscription model with annual billing as the standard cadence,
      though multi-year enterprise contracts are common at scale.


      Scandit's publicly documented pricing structure as of June 2026 is organized into three tiers. The
      Core Edition covers single barcode scanning and basic ID scanning (barcode or MRZ-based). The
      Standard Edition adds Smart Label Capture, fluorescent barcode support, limited multi-barcode
      functions (MatrixScan Find and Batch), batch scanning, and task management. The Advanced Edition
      encompasses all Standard capabilities plus MatrixScan Count, MatrixScan AR, MatrixScan Pick,
      inventory counting, and track-and-trace functions. ID scanning is priced separately from the
      core tier progression. Scandit Express, a plug-and-play application for iOS and Android, serves
      as a lower-friction entry point that bundles barcode, text, and ID capture in a pre-built interface.


      Pricing is not published and is negotiated per engagement. Scandit's FAQ confirms that both flat
      annual fee and usage-based (per device or per scan) options are available, with the platform
      positioning per-device or per-scan billing as particularly well-suited to deployments with
      variable device volumes or pay-as-you-go preferences. The company describes its pricing as
      scalable from start-ups to global enterprise deployments, and explicitly states that standard
      billing is annual. Enterprise-level customers typically negotiate multi-year contracts with volume
      discounts. Realized pricing is commercially sensitive and not publicly available.


      Beyond the core barcode SDK, Scandit's revenue streams include: the ID scanning suite (ID Validate
      and ID Bolt for document verification and fraud detection); Label Scanning (OCR plus barcode);
      ShelfView and the Store Intelligence Platform (retail shelf analytics, including the August 2024
      MarketLab-derived hybrid data capture); and professional services and implementation support
      embedded in enterprise packages. The share of revenue from each of these streams is not publicly
      disclosed, but the core barcode SDK remains the primary driver given its 2009 founding origin,
      broadest customer penetration, and the disclosed 80 billion annual barcode scan volume.
