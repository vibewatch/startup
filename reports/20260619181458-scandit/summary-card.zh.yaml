  topStrengths:
    - 企业 SDK 品类领先，年扫描量 80B+，活跃设备 170M+，企业客户 2,100+；17 年技术护城河源自 ETH Zurich 计算机视觉研究
    - Walmart（1.3M 名员工，2025 年 6 月续约）验证了落地扩张引擎；2023 年 12 月至 2024 年 11 月 ARR 也从 $35M 增至 $119.1M，约 3×
    - 三位联合创始人均仍在 C-suite 一线任职；每名 FTE 约贡献 $327K ARR，效率接近 SaaS 前四分位，AI 计算机视觉定位也有资格拿到溢价倍数区间
    - 战略退出选项宽，可能吸引 Zebra、Honeywell、SAP、Salesforce 以及多个企业垂直领域的物流平台买家
  topRisks:
    - $1B+ 估值已经陈旧，相当于最后披露 ARR 的 8.4×；Q1 2026 SaaSpocalypse 后公开 SaaS 中位数为 3.4×，若按 2022 年估值入场，必须确认 ARR 重新加速至 $150M+
    - 审计财务、NRR、GRR 和客户集中度数据均未公开；240% ARR 增长仅由创始人通过 LATKA 披露，尚无独立佐证
    - Honeywell/HHP 专利攻击（UPC 于 2024 年发出初步禁令，2025 年 3 月撤回）显示硬件巨头带来反复 IP 风险；免费 Google ML Kit 和 AWS SDK 正在商品化中低端扫描市场
    - 三位联合创始人都集中在 C-suite，关键人风险高；未披露的 Kreos Capital 风险债务包袱会影响退出瀑布和下轮融资风险
  unresolvedGaps:
    - FY2025 审计 ARR、NRR、GRR 和队列留存数据未公开；最新 ARR 确认来自 2024 年 11 月 LATKA 创始人披露
    - Walmart 与前 10 大客户收入集中度未披露；Kreos Capital 债务规模和条款未披露，二者都会实质影响退出瀑布承保
    - 2022 年 2 月以来没有一级股权融资；公开来源无法确认资金是否足以支撑到 2026 年中
    - Vision AI Engine 在标准行业测试集损坏/困难条码上的准确率没有独立第三方基准；barKoder 数据显示 PDF417 损坏样本上 Scandit 为 47.6%，对比 90.4%
