  - id: FM001
    title: 市场规模视角
    type: pyramid
    layout: wide
    summary: >-
      2026 年 Scandit 的市场范围有三层嵌套：最宽的计算机视觉 AI TAM（$27B）、企业条码与移动计算机 SAM（$3–3.5B）， 以及受限的 SDK 软件 SOM（推断约 ~$0.4–0.8B）；按
      Scandit 约 $119M ARR 计算，对 SAM 的捕获率为 1.5–2.7%。
    data:
      items:
        - label: TAM：计算机视觉 AI
          detail: >-
            全球 $27.01B（2026 年，Fortune Business Insights）；17.89% CAGR。包括所有企业 CV 应用——制造检测、 自动驾驶车辆、安防监控、零售和物流。Scandit
            只参与其中一小部分。
          tone: neutral
        - label: SAM：企业条码扫描器与移动计算机（软件层）
          detail: >-
            全球 $2.9–3.5B（2026 年，多家分析机构）；5.7–8.6% CAGR。包括条码扫描供应商的软件许可和服务。 Scandit 在软件层竞争；Zebra/Honeywell 的硬件收入不计入 Scandit
            的 SAM。
          tone: positive
        - label: SOM：SDK 智能数据采集软件（Scandit 可触达）
          detail: >-
            推断约 ~$0.4–0.8B（2026 年分析构造）；基于 Scandit 约 $119M ARR、约 2,100 家客户，意味着对已识别 SAM 子层的捕获率约
            15–25%。这不是公开数字；需要投资级一手市场规模研究。
          tone: warning
    approximationNotes: >-
      TAM 数字来自 Fortune Business Insights（2026 年）。SAM 是 Market Growth Reports 与 Verified Market Reports 对条码扫描器 +
      移动计算机估算的中点区间。SOM 是分析推断：Scandit 报告约 $119M ARR，除以合理的 $0.5–0.7B 软件子市场，意味着 17–24% 份额。该推断受 TM002 所述全部范围和准确性不确定性约束。
