  - id: FE004
    title: 产品成熟度与能力地图
    type: matrix
    layout: wide
    summary: >-
      Scandit 产品线在条码扫描、SparkScan 和 MatrixScan 上技术成熟度高；ID 扫描为中等成熟（受 ID Validate 仅覆盖美国限制）， ShelfView 也为中等成熟（云依赖、近期整合
      MarketLab）。当 AR 叠加、多条码工作流与广泛设备覆盖相交时，竞争差异化最强。
    data:
      columns:
        - 技术成熟度
        - 商业验证
        - 竞争差异化
        - 关键风险 / 限制
      rows:
        - label: Barcode Scanner SDK（核心）
          values:
            - 高——15 年，80B 次扫描/年，标准条件下准确率 99%+
            - 高——Walmart、FedEx、DHL、Lufthansa、NHS 为具名客户
            - 高——20,000+ 款设备，11 个框架，不依赖 Google Play Services
            - 中——Dynamsoft Web SDK 差距；静态测试中 barKoder 在破损码上有优势
        - label: SparkScan
          values:
            - 高——GA、预构建组件、文档完善
            - 中高——与核心 SDK 捆绑；暗示已广泛部署
            - 中高——上下文感知 AI 扫描在品类中独特；直接对比数据有限
            - 低——主张很强；没有针对 SparkScan 专属 AI 的独立基准
        - label: MatrixScan 多条码（Find / Count / Batch / AR）
          values:
            - 高——四个子产品 GA；Dior、Stratix 为具名参考部署
            - 高——已发布可量化客户结果（快 50%、减少 85%、节省 $500k）
            - 高——商业规模下实时多条码 AR 跟踪；没有直接开源等价物
            - 中——AR 模式并不支持所有码制；DPM/VIN 相对 barKoder 有缺口
        - label: ID Scan / ID Validate / ID Bolt 身份扫描
          values:
            - 中高——ID Scan 成熟；ID Validate 仅限美国；ID Bolt GA 仅用于数据提取
