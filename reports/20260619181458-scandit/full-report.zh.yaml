  - id: TP003
    title: 定价与包装对比
    columns:
      - 供应商
      - 定价模型
      - 入门 / 最低价格
      - 企业定价
      - 包含能力
      - 主要约束或未知项
    rows:
      - - Scandit
        - 分层年度订阅（Core/Standard/Advanced）+ 按设备或按扫描选项
        - 需要定制报价；可用按扫描 / 按设备模型；粗略区间为 $15–$50+/设备/年（按行业区间估计）
        - 带量折扣的定制企业合同；大规模客户可用固定年费
        - Core：单条码；Standard：批量、标签扫描、降价标记、任务管理；Advanced：库存盘点、追踪追溯；ID Bolt 和 ShelfView 单独定价
        - 定价未公开列示；需要定制报价；评论中把规模化成本列为企业顾虑；功能分层门槛可能迫使客户升级并增加成本
      - - Dynamsoft Barcode Reader
        - 按功能 / 年、按设备、按并发设备、按域名、按服务器或按实例
        - 单个 Web SDK 功能许可证约 $1,249–$1,371/年；Web 10,000 次扫描包约 $1,371/年
        - 设备 / 服务器 / 实例定价需定制报价；可提供 OEM 授权
        - 条码读取（1D/2D）；OCR 附加模块；文档规范化；Web 和原生 SDK
        - 入门价格仅适用于 Web SDK；摄像头模式和原生移动端需要单独许可证；供应商发布的基准方法偏向 Dynamsoft 的强项
      - - Scanbot SDK
        - 固定年度许可费；不限扫描次数、不限设备数，按授权 app / 域名计费
        - 需定制报价；公开定位是在高吞吐量场景下，相比按次扫描模型更具成本效益
        - 无论扫描量或设备数量如何，均为固定年度费用
        - 条码扫描、文档扫描、信用卡扫描、标签 OCR；功能按层级配置
        - 没有 AR / MatrixScan 等价能力；没有 ID Bolt 等价能力；没有货架智能；未公开定价（需联系）
