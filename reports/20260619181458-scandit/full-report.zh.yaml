  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价结构和变现层级
        blocks:
          - type: paragraph
            body: >
              Scandit 几乎完全靠企业软件许可和 SDK
              订阅费，为其智能数据采集平台变现。公司不制造硬件，因此没有库存、质保和物流成本，这些正是硬件中心型竞争对手受限的成本驱动项。收入确认遵循软件订阅模式，年度计费是标准节奏；在规模化企业合同中，多年期协议也很常见。


              截至 2026 年 6 月，Scandit 公开文档中的定价结构分为三层。Core Edition 覆盖单条码扫描和基础身份扫描（基于条码或 MRZ）。Standard Edition 增加 Smart
              Label Capture、荧光条码支持、有限多条码功能（MatrixScan Find 和 Batch）、批量扫描及任务管理。Advanced Edition 包含所有 Standard 能力，并增加
              MatrixScan Count、MatrixScan AR、MatrixScan Pick、库存计数和追踪溯源功能。身份扫描独立于核心层级另行定价。Scandit Express 是面向 iOS 和
              Android 的即插即用应用，以预构建界面打包条码、文本和身份采集，作为摩擦更低的入口。


              Scandit 不公开价格，按项目谈判。公司 FAQ
              确认可选择固定年度费用和用量计费（按设备或按扫描），并把按设备或按扫描计费定位为尤其适合设备数量波动或偏好即用即付的部署。公司称其定价可从初创公司扩展到全球企业部署，并明确表示标准计费为年度。企业级客户通常会谈多年期合同和量级折扣。实际成交价格具有商业敏感性，公开渠道不可得。


              除核心条码 SDK 外，Scandit 的收入流还包括：身份扫描套件（用于文件验证和欺诈检测的 ID Validate 与 ID Bolt）；Label Scanning（OCR 加条码）；ShelfView 和
              Store Intelligence Platform（零售货架分析，包括 2024 年 8 月来自 MarketLab
              的混合数据采集能力）；以及嵌在企业套餐中的专业服务和实施支持。各收入流占比未公开披露，但核心条码 SDK 仍是主要驱动，因为它源自 2009 年创立时的基础产品、客户渗透最广，并披露有每年 800
              亿次条码扫描量。
