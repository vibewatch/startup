      - number: '4.2'
        title: ARR 轨迹和客户数经济性
        blocks:
          - type: paragraph
            body: >
              根据公开来源重建的 Scandit ARR 轨迹显示两个阶段：从创立到 2022 年 Series D 的温和增长期，以及 2024 年的异常加速。LATKA 数据库汇总创始人披露的 SaaS
              指标，是目前唯一可得的外部 ARR 时间序列：2021 年 4 月 $21M，2023 年 12 月 $35M，2024 年早些时候 $61.9M，2024 年 11 月为 $119.1M。2022 年 2 月的
              Series D 新闻稿独立印证了 ARR 增长方向，称 ARR 在 2020 年 5 月 Series C 到 2022 年 2 月 Series D 之间增长超过一倍，并且公司在 2018 年 7 月
              Series B 到 2020 年 Series C 之间经常性收入增长三倍。


              2023 年 12 月（$35M）到 2024 年 11 月（$119.1M）之间隐含的同比 ARR 增长超过
              240%，对这一规模的公司来说极不寻常，也是需要在数据室核实的最关键财务事实。没有独立审计、新闻披露、投资人公告或分析师覆盖确认这个数字。方向性叙事是合理的——Scandit 在 Walmart（自 2022
              年起覆盖 1.3M+ 员工，2025 年 6 月续约）、FedEx、DHL 和 NHS 等大型企业账户的落地扩张模型，可能随着使用量放大带来超额扩张 ARR——但截至 2026 年 6
              月，规模和时点无法由公开来源验证。2024 年早些时候的 $61.9M 数字显示年内有明显加速。


              客户数给 ACV 估算带来显著复杂性。公司官网称截至 2026 年 6 月有 2,100+ 企业客户；LATKA 报告约 1,000 个客户。这个 2:1 差异可能反映定义门槛不同（LATKA
              可能排除小型或试用阶段账户，而公司统计所有活跃许可部署），但也意味着隐含平均 ACV 从约 $57K（若 2,100 个客户）到 $119K（若 1,000
              个客户）不等；区间太宽，在没有确认客户数前无法可靠承保。两个数字都符合高于 $25K 中端市场门槛的企业级 ACV。


              从 Series B 到 Series D 的增长轨迹符合公司所称的落地扩张模型：2018 年到 2020 年收入增长三倍，2020 年到 2022 年翻倍，随后到 2023 年表观平台期，再到 2024
              年加速。平台期与激进扩员（2022 年 12 月峰值 553 人）和 ShelfView 等新产品线投入重合。加速可能反映这些投资开始兑现，也可能反映 MarketLab 收购补齐了 Scandit
              的零售混合数据采集平台。
