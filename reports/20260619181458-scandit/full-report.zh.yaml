      - number: '5.2'
        title: Vision AI 引擎和设备端技术架构
        blocks:
          - type: paragraph
            body: >
              Scandit 自研 Vision AI Engine
              是所有产品模块底层共享的计算层。它的核心功能，是在设备本身完成全部图像分析和解码——默认情况下摄像头帧不离开设备，扫描可完全离线运行。这个设计既关乎隐私，也关乎性能：每次扫描延迟低于
              200ms（低于人类感知阈值），敏感条码、身份或标签数据不经过外部服务器。引擎原生运行于 iOS 和 Android，并通过 WebAssembly 运行于浏览器，在所有 11
              个受支持框架上做平台特定性能调优。SDK 不依赖 Google Play Services，因此可部署在 Zebra、Honeywell 等运行在标准 Google 服务环境之外的三防 Android 设备上。


              三项 AI 能力把 Vision AI Engine 与低层级替代方案区分开。第一，情境感知扫描（品牌名 “Smart Scan
              Intention”）用行为分析而不是固定超时，区分有意和意外条码捕获——即使画面里同时有多个条码。这是公司报告在主流 1D 符号体系连续 30 分钟机器人测试中误报率 0%
              的基础。第二，当条码损坏到无法解码时，引擎会自动适应：无需用户输入，回退到 OCR 读取条码下方的人类可读打印数字。第三，对 MatrixScan 来说，引擎能在实时摄像头画面中同步追踪、解码并渲染所有条码的
              AR 叠加。


              在 Scandit 自己与开源 ZXing 的对比测试中（Code 128、Samsung Galaxy S9），Scandit 用 4.0 秒扫完一组序列，ZXing 为 6.93 秒；误报率为
              0%，ZXing 为 5%；最大读取距离达到 168 cm，ZXing 为 37 cm。在 11 个受损 “tough codes” 上，ZXing 读出 2 个，Scandit 读出全部 11 个。对比
              Google ML Kit 时，Scandit 在签收证明工作流中约快 2x，在底层货架电子标签上约快 4x；ML Kit 每次调用还限制 10 个条码，Scandit 没有该限制。这些测试由公司编写，不同
              SDK 版本的方法细节不一；独立验证见第 5 节。


              ShelfView 方面，采集图像通过云管线处理，结合图像识别和视觉 AI 创建数字货架孪生。这引入了核心条码和身份 SDK 明确避免的云依赖和数据传输步骤。ShelfView 的 99.7%
              告警准确率由公司陈述，并在 MarketLab 集成前后均被声称。尚未发现对该数字的独立审计。
