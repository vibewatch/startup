chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部和商业模式
        blocks:
          - type: paragraph
            body: >
              Scandit AG 通常简称 Scandit，是一家在瑞士注册并总部位于苏黎世的私营科技公司。注册地址为 Hardturmstrasse 181, 8005
              Zurich。公司在七个办公室运营，覆盖苏黎世（全球总部）、伦敦、华沙（波兰）、坦佩雷（芬兰）、波士顿（美国）和东京（日本）；十五年以上经营之后，已经形成真正国际化的 go-to-market 覆盖。


              Scandit
              将核心产品定义为智能数据采集：用软件把任何带摄像头的智能设备——智能手机、平板电脑、手持计算机、可穿戴设备、无人机、机器人和固定摄像头——变成高性能条码扫描器、身份证件读取器和标签采集工具。平台借助自有计算机视觉、机器学习和增强现实算法，在设备边缘处理视觉工作负载；商业化方式是企业软件授权和平台订阅，而不是硬件销售。


              截至 2026 年，公司的产品套件包括 Barcode Scanner SDK（核心产品，处理带 AR 叠加的 1D/2D 条码扫描）、SparkScan（面向高频扫描优化的
              UI）、MatrixScan（多条码同步 AR 跟踪）、ID Scanning 和 ID Validate/ID Bolt（身份证件和护照验证）、Label Scanning（条码和 OCR
              结合采集）、ShelfView（零售货架智能，现已纳入 2024 年 8 月收购的 MarketLab 资产）、Scandit Express 交钥匙应用，以及更广义的 Store Intelligence
              Platform。Scandit 网站首页披露，平台每年在超过 1.7 亿台活跃移动设备上处理 800 亿次条码扫描，公司服务 2,100+ 家企业客户，NPS 为 98%。


              2009 年 11 月，三位 ETH Zurich 博士研究人员 Samuel Mueller、Christian Floerkemeier 和 Christof Roduner
              将基于智能手机的计算机视觉研究项目正式公司化，共同创立了 Scandit。创始故事根植于 ETH Zurich 计算机科学系和更广泛的 Auto-ID Labs 研究网络。公司的原学术导师 Friedemann
              Mattern 教授早在十年前就探索过低分辨率智能手机摄像头用于条码扫描的潜力；创始人的概念验证后来成为商业业务的基础。


              Scandit 的商业模式面向零售、运输和物流、医疗、制造、航空出行和现场服务等企业客户。收入主要来自年度企业软件授权和 SDK
              订阅费，采用先落地再扩张的模式：客户先在一个工作流采用，再扩展到更广泛的组织使用。公司与 Apple（获批移动合作伙伴）、Samsung（Knox 集成）等硬件厂商合作，也与 SAP、Google
              AppSheet、Pega 等企业软件平台合作，把扫描能力嵌入标准工作流应用。
