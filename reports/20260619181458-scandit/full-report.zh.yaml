      - number: '6.2'
        title: 平台级采用指标与部署深度
        blocks:
          - type: paragraph
            body: >
              Scandit 报告每年处理 80 billion 次条码扫描、170 million+ 台活跃设备和 2,100+ 家企业客户。80 billion
              的年扫描量是很大的汇总规模，意味着产品深度嵌入生产环境——高频扫描工作流（零售价格核查、物流包裹追踪、药房配药）必须每天大规模运行，才能累积到这个数字。具体部署确认了规模：Walmart 在美国 1.3
              million 名员工中部署 Scandit，是目前披露的最大单一部署。Shipt 扩展到 89,000 台月活设备，并在 COVID-19 需求激增期间，靠个人智能手机让 100,000+
              名承包商入职，没有定制设备计划。Staples Canada 在 298 家门店部署 1,200 台 iPhone，每周产生 20,000 次员工会话和 200,000 次应用交互。Swiss Post 使用
              Scandit 驱动的工作流，每年处理 200 million 件包裹和 1.7 billion 封信件的投递。

              这些部署规模更像深度嵌入工作流，而不是表层试点。不过，设备数量、扫描量或活跃客户定义都没有独立审计。Scandit 的 2026 Delivery Trends Report
              把公司定位为最后一英里物流的思想领导来源，称启用 AR 的扫描把货车装载错误减少 65%，并引用全球前五大快递公司中的三家为客户——但未披露这些快递公司名称。IHL Group / Scandit 于 2025
              年 10 月发布的研究发现，利润增长超过 10% 的零售商在库存可视性解决方案上的投资高出 208%；该结论为 Scandit 的货架智能野心提供背景，但研究由 Scandit
              共同委托，独立性有限。Scandit 首页突出展示 98% NPS，但没有公布方法论、样本量、调研日期或第三方验证，因此它更像公司声明，而不是有基准可比的满意度指标。
