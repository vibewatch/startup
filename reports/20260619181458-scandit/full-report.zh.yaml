  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合和模块能力
        blocks:
          - type: paragraph
            body: >
              截至 2026 年中，Scandit 的商业产品组合覆盖六条不同产品线，统一放在其 “Smart Data Capture” 平台伞下。核心 Barcode Scanner SDK
              是基础产品，也是最大收入驱动：2025 年，它在超过 1.7 亿台活跃移动设备和 20,000+ 设备型号上处理了 800 亿次扫描，在大多数企业应用目标符号体系和环境条件下提供超过 99% 的准确率。SDK
              读取所有主要 1D 和 2D 符号体系——UPC、EAN、Code 128、Code 39、ITF、QR Code、Micro QR、Data Matrix（包括 direct part
              marking）、PDF417、Aztec、DotCode、MaxiCode、GS1 DataBar 和 Composite codes，以及主要邮政符号体系——如果条码损坏到无法解码，会自动回退到打印数字
              OCR。


              SparkScan 是构建在核心 SDK 之上的预构建悬浮扫描组件，面向高频单次扫描工作流。其 AI 驱动的 Smart Scan Intention 引擎最多可减少 100%
              非目标扫描；与基线相比，在电子货架标签和微小条码上扫描距离延长 65%。集成只需要少量代码，不要求重新设计应用；中位首次扫描时间低于一小时。


              MatrixScan 是平台的多条码 AR 采集产品族。四个已商业部署的子产品覆盖不同工作流：MatrixScan Find 用 AR
              叠加在大量物品中高亮目标商品，用于店内订单拣货或包裹定位；MatrixScan Count 通过预构建 AR 计数 UI 支持批量库存计数；MatrixScan Batch 不带 AR
              开销，一次处理多个条码；MatrixScan AR 为画面中的任意条码添加可配置的信息叠加。已验证生产结果包括：发货处理速度提升 50%（Stratix）、发货控制时间减少
              85%（Dior），以及某大型配送运营商单站点每年节省 $500,000。


              ID Scanning 是 Scandit 的文件验证产品线，由三个组件构成：ID Scan（从 2,500+ 文件类型提取数据）、ID Validate（真实性和伪造检测，目前仅限美国驾照和州身份证）、ID
              Bolt（用于浏览器端即插即用身份扫描的预构建 Web 组件）。公开准确率基准为：PDF417 条码 100%、Machine Readable Zones（MRZ）99%、Visual Inspection
              Zones（VIZ）95%+。所有扫描均在设备端运行，无需互联网连接。


              ShelfView 是 Scandit 的零售货架智能方案，因 2024 年 8 月收购波兰图像识别和 AI 软件公司 MarketLab 的货架审计技术而大幅扩展。合并后的 ShelfView
              平台采用混合数据采集模型——移动设备、固定位置摄像头和自主机器人——交付数字货架孪生，并在缺货、低库存事件和货架图违规上达到 99.7% 告警准确率。ShelfView 是 Scandit
              唯一通过云管线处理图像的产品，而不是纯设备端。按收购时引用的 IHL Group 研究，零售行业每年因货架可得性问题损失约 $634 billion。


              Scandit Express 是一款交钥匙无代码应用，可在任何 iOS 或 Android 设备上使用，无需软件开发或 SDK 集成即可立即访问 MatrixScan Find、Count 和
              Batch。它面向希望在标准工作流中立刻获得扫描能力、但没有开发资源的客户。
