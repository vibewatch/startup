      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 市场定义模糊是核心估值风险
            body: >-
              市场规模估算存在 30× 差异（$0.91B–$27B），这不是分析师错误，而是真实反映了 Scandit 到底在哪个市场竞争的不确定性。一家纯软件条码 SDK 公司在 $0.91B 窄市场中计费 $119M
              ARR，意味着 13% 渗透率（增长受限）。同一家公司若处于 $5B+ 企业 CV 市场，则渗透率低于 3%（跑道很长）。投资人在套用倍数前必须先定义边界。对 Scandit 的 SAM 来说，最可辩护的结构是
              $3–5B，对应 2–4% 渗透率和充足上行空间。
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
              - CM015
              - CM017
              - CM018
          - type: callout
            title: 劳动力短缺和全渠道履约形成持久需求顺风
            body: >-
              两个结构性且持久的驱动——仓库劳动力持续短缺（占成本 50–70%，工资年增 7–9%）和全渠道零售建设——创造了一个移动扫描自动化能快速回本、ROI
              可衡量的需求环境。这些是多年期世俗趋势，不是周期性催化剂，支撑长周期企业软件合同期限。
            calloutType: strength
            claimRefs:
              - CM029
              - CM030
              - CM031
              - CM034
          - type: callout
            title: 平台层和坚固型设备周期限制新标识客户获取速度
            body: >-
              两个最重要的采用约束——5–7 年坚固型设备更新周期，以及 Apple、Google、Samsung、Microsoft 嵌入原生扫描能力带来的平台层风险——并非近期生存威胁，但会结构性限制 Scandit
              将庞大的硬件原生扫描存量客户转化过来的速度。新标识客户动能可能需要硬件更新触发，或需要硬件原生扫描无法满足的用例（身份验证、货架智能）。
            calloutType: risk
            claimRefs:
              - CM032
              - CM035
              - CM036
