      - number: '5.5'
        title: 竞争差异化、已记录限制和 2026 年路线图
        blocks:
          - type: paragraph
            body: >
              Scandit 的核心竞争差异在几处：AR 叠加的多条码采集（在同档商业成熟度里独特）、广泛平台覆盖（11 个框架、20,000+ 设备，而竞争对手多为单一平台）、企业级 SLA 质量（首次回复中位数 3
              小时）、具备上下文感知的扫描智能，以及 15 年积累的边缘案例库。不过，独立基准测试也暴露出尽调必须处理的具体技术缺口。


              Dynamsoft 发布了一项基准测试，用 83 张真实静态条码图片，在默认配置、无预处理条件下比较四个 Web SDK。Scandit 的 Web SDK 检出 178 个唯一条码，Dynamsoft 为
              292 个；Scandit 平均每张图片耗时 11,210ms，Dynamsoft 为 278ms。该测试仅限通过浏览器 API 解码静态图片；Dynamsoft
              明确说明，「实时摄像头扫描还涉及额外组件——帧采集、预览渲染、自动对焦和 SDK 端流优化」，这些不在该测试范围内。Scandit 的 11,210ms
              平均值很可能反映的是默认模式在大尺寸高密度图片上的穷尽式扫描。摄像头模式性能未被捕捉，可能有实质差异。Scandit 自己针对 ZXing 和 ML Kit 的摄像头模式测试显示 Scandit
              表现更好。即便如此，静态图片差距仍是 Web SDK 部署的真实集成风险。


              barKoder 对 29 个受损 Data Matrix 样本做的第三方基准测试显示，Scandit 以 65.52% 排第二，barKoder 为 89.66%，Cognex 为 48.28%。在 55
              个模糊 EAN/UPC 样本上，Scandit 得分 80%，barKoder 为 89.09%。这些测试由
              barKoder（竞争对手）发布，应视为竞争对手撰写材料；方法论有披露，但尚未发现独立第三方复现。分数说明，即便在商业 SDK 中，Scandit 在对抗性静态图片测试里也不是最佳表现者。


              产品范围也有限制：截至 2026 年中，ID Validate 只覆盖美国驾照和州身份证，不含国际证件。MatrixScan 的 AR 能力并不在所有追踪模式下支持每一种条码制式。ShelfView
              的云端处理步骤带来数据驻留和延迟考量，而核心 SDK 没有这些问题。企业级定价未公开；Scandit 为小团队提供 30 天免费试用和明确的简单 / 高级层级选项，但企业定价需要销售介入并定制报价。


              按 Scandit 博客表述，2026 年路线图把「SDK 8」和「Smart Label Capture」作为近期具体产品交付，把 AI Level 4
              上下文扫描（推断条码与其物理环境之间的关系）作为技术前沿目标。ID Bolt 预计会纳入 ID Validate 功能。Agent Skills 是 2026 年正在推进的开发者体验项目。截至 2025
              年，Walmart 通过 Scandit 的大规模 AR 部署被描述为「可能是全球最大的 AR 商业用途」，为路线图方向提供了一个公开验证点。
