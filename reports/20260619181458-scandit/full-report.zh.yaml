      - number: '1.4'
        title: 规模指标、封面 KPI 和关键缺口
        blocks:
          - type: paragraph
            body: >
              Scandit 的公开牵引指标相当可观。首页披露 2,100+ 家客户、1.7 亿+ 活跃移动设备、全平台每年 500 亿+ 次扫描，以及 98% NPS。网站条码扫描页面另称每年 800 亿次条码扫描，代表核心
              SDK 工作负载。这些是公司披露数字，未经独立审计；尽调时应作为公司主张处理。


              公开来源中最常引用的 ARR 数字是 LATKA 报告的截至 2024 年 11 月 $119.1M。LATKA 是一个聚合创始人披露 SaaS 指标的数据库。该数字较 2024 年早些时候披露的 $61.9M
              和 2023 年末的 $35M 大幅增加。LATKA 方法依赖创始人访谈，未经独立审计；但 ARR 方向性轨迹——2023 年末到 2024 年末增长至三倍——与 Series D 新闻稿中 ARR 在 2020
              年 5 月 Series C 到 2022 年 2 月 Series D 之间翻倍的表述一致。按 LATKA ARR 和客户数推算的平均年度合同价值（约 $119M / Series D 时报告约 1,000
              家客户）约为 $119K，符合企业级 ACV 水平。


              员工人数数据构成尽调缺口。Wikipedia 基于同期来源称 2022 年员工数为 550。二级数据库报告 2024 年末和 2025 年员工数在 364 到 392 之间。相较 2022 年峰值的表观下降，与
              Series D 新闻稿中承诺 2022 年全球分布式团队再增长 50% 但 2023–2025 年期间似乎未能维持该速度的情况一致。未发现 Scandit 的公开 WARN Act
              申报或结构化裁员媒体报道。员工数差异应作为重大尽调缺口，需要由公司数据室确认。


              公司服务六个主要垂直行业：零售（最大，包括美国前 10 大杂货商中的 8 家）、邮政 / 包裹 / 快递（包括全球前 5 大快递公司中的 3 家）、航空出行、医疗、供应链 /
              制造，以及现场服务。公开资料确认的具名客户关系包括 Walmart（2025 年 6 月续约）、FedEx、DHL、Levi Strauss &
              Co、Sephora、Instacart、Carrefour、NHS UK、Alaska Airlines、Kroger、7-Eleven、Swiss Post、Johns Hopkins
              Hospital、Toyota、La Poste、VF Corporation、Lufthansa 和 Carrefour Poland（通过 MarketLab）。
