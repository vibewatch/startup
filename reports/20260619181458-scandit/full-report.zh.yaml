      - number: '1.5'
        title: 里程碑、合作伙伴和不利背景
        blocks:
          - type: paragraph
            body: >
              Scandit 的公开记录是一条干净的增长曲线，由连续融资里程碑、产品扩展和战略合作串联而成；截至 2026 年中，未发现重大不利事件。公司 2009 年 11 月的创立可直接追溯到 ETH Zurich
              博士研究；据创始人在 2025 年 Top100 Swiss Startup 回顾中亲自讲述，最早的概念验证用一盒燕麦棒作为第一个扫描目标。


              早期认可事件（2011 CTI Startup Label、Top 100 Swiss Startups、Nokia 创新奖）在显著商业规模形成前验证了技术。第一轮机构融资（2017 年 Atomico 参与的
              Series A）发生在多年自举获客之后；Atomico 的 Series A 公告称公司当时已建立包含大型零售商和物流公司的客户基础。多条码 AR 产品 MatrixScan 于 2017 年 4
              月推出。2018 年 7 月 Series B（GV、Atomico、NGP Capital，$30M）与首批具名大型企业客户证据同时出现，包括 DHL、Sephora 和 Louis Vuitton。2020
              年 5 月 Series C（$80M，G2VP、Salesforce Ventures）发生在 COVID-19 疫情期间，当时无接触扫描需求激增；新闻稿称收入较 2018 年基数增长至三倍，蓝筹客户数量翻倍。


              Series D 之后最重要的两项进展都有清晰记录。第一，2024 年 8 月 MarketLab 收购（Scandit 首次收购）把一家波兰固定摄像头货架审计 AI 团队及技术纳入 ShelfView
              产品，将零售产品从纯移动拓展到混合移动 / 固定摄像头货架智能。第二，Chain Store Age 报道的 2025 年 6 月 Walmart 续约和扩展合作确认，Walmart 自 2022
              年起已在多个员工工作流中部署 Scandit，覆盖订单履约、补货、自助结账收据核查，以及面向 130 万门店员工的 AR 引导后仓操作。


              截至 2026 年中，公开资料未发现 Scandit 存在重大不利事件——诉讼、监管处罚、数据泄露、领导层不当行为、产品召回或公开披露的治理争议。竞争格局确实存在结构性风险：Google、Apple、Amazon
              等大型平台公司在其生态中嵌入商品化扫描能力，硬件既有厂商 Zebra Technologies 和 Honeywell 提供设备加软件的一体化方案。MarkWide Research
              的一份市场研究报告指出，在条码扫描器市场分析中，Scandit 这类智能手机 SDK 被明确认定为独立扫描器硬件的“替代威胁”。这些动态将在后续章节尽调中讨论，但不构成关于 Scandit
              当前运营的不利事实发现。
