      - number: '3.3'
        title: 替代威胁——平台 API、货架智能、身份验证和现状惯性
        blocks:
          - type: paragraph
            body: >
              除了具名 SDK 竞争对手，Scandit 还面临几类有实质意义的替代威胁：平台原生条码 API、货架智能和身份验证领域的相邻计算机视觉厂商、内部自研选项，以及继续使用专用三防硬件设备的现状惯性。


              Google ML Kit 和 Apple VisionKit 是长期看结构性最强的替代威胁。两者都是免费、开发者可用的条码扫描 API，嵌在 Scandit 所运行的移动操作系统里。Google ML Kit
              的条码扫描模块同时支持 iOS 和 Android，无许可成本，且数据完全在设备端处理。Apple VisionKit 原生支持 iOS 13.0+、iPadOS 和 macOS，并深度集成 Apple
              硬件栈。独立基准显示，在一个测试集上，Google ML Kit 约识别 120 个条码，Apple Vision 为 150 个，商业 SDK 领先者为 354 个（Dynamsoft）。两种平台 API
              都不支持 AR 叠加、多条码同步追踪（MatrixScan）、批量扫描优化或企业 SLA 保证。Google ML Kit 每个扫描帧上限为 10 个条码；Apple VisionKit 仅支持
              iOS/macOS，没有 Android 部署路径。企业部署如果需要混合设备队列、批量扫描、AR 引导或身份文件验证，平台 API 不能替代 Scandit。但在商品化用例里——例如零售员工在基础 iOS
              应用中一次扫一个条码——平台 API 降低了完全绕开商业 SDK 的门槛。随着 Google 和 Apple 继续投入视觉框架，低复杂度用例的替代风险会增强。


              开源替代方案（ZXing “Zebra Crossing”、ZBar）分别基于 Apache 2.0 和 LGPL 许可提供基础条码扫描。ZXing 广泛部署在消费者应用中，但维护标准达不到企业性能要求，也缺少
              AR、身份扫描和 OCR 能力。它代表预算受限团队在购买 Scandit 前会评估的零成本现状替代方案，尤其是在 SMB 和开发者工具场景。


              货架智能竞争对手包括 Trigo Vision、Focal Systems（现为更大产品组合的一部分）、Standard AI、Simbe Robotics（Tally 机器人）和 Trax
              Retail（2026 年与 FORM 合并），它们在零售货架智能领域与 Scandit 的 ShelfView 竞争。这些厂商主要使用固定天花板摄像头或自主货架扫描机器人（Simbe 的
              Tally），而不是移动 SDK 部署。它们与 Scandit 的架构差异很重要：多数货架智能厂商靠固定基础设施投资（摄像头、机器人）采集数据并销售 SaaS 分析；Scandit 的 ShelfView
              则利用门店员工已经部署的移动设备，避免新增硬件资本开支。这形成了真实差异化——如果设备已经获许可，Scandit 的货架智能方案没有增量硬件成本。不过，固定摄像头厂商能提供连续监测；Scandit
              依赖店员触发货架采集，低客流情况下每天覆盖的货架扫描事件可能更少。


              云端身份验证平台（Jumio、Entrust 旗下 Onfido、Sumsub、IDnow、Acuant/GBG）在数字开户注册和 KYC 工作流上与 Scandit ID Bolt
              竞争。这些平台云原生、强合规导向（AML/KYC 集成、活体检测、生物特征匹配），并按次计价（每次文件验证 $0.50–$2.00）。Scandit ID Bolt
              的差异化在于设备端边缘处理（适合航空出行和离线环境）以及对一线员工应用的原生移动 SDK 集成。云 KYC 平台在金融服务和电信行业客户数更大；Scandit ID Bolt
              的强项在实体触点（机场、酒店、医疗），这些场景网络连接受限或隐私敏感度较高。
            claimRefs:
              - CP026
              - CP027
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
      - number: '3.4'
        title: 竞争地位、护城河耐久度和反向证据
        blocks:
          - type: paragraph
            body: >
              Scandit 在一线员工数据采集的中端市场和企业层最具竞争力；截至 2026 年中，AR 工作流深度、多条码同步扫描（MatrixScan）、跨平台覆盖和企业 SLA
              标准组合在一起，还没有单一竞争对手能完整复制。


              最深的护城河来自 SDK 集成深度。Scandit 的 SDK 嵌入企业工作流应用——WMS、TMS、ERP 扩展、自定义拣货和核验应用——这些应用都围绕 Scandit 的 API 合约开发、QA
              和认证。迁移到替代方案，需要重新集成每一个调用 Scandit SDK 的应用，再跨设备型号和操作系统版本重新测试、重新认证。这种集成深度形成多年切换成本，保护已安装基础 ARR，也解释了 Scandit
              隐含的高净收入留存。Scandit 拥有 2,100+ 企业客户，客户支持满意率 >98%（据 Scandit 自身定价页披露），已安装基础的广度进一步强化留存经济性。


              AR 和 MatrixScan 技术领先是第二层护城河。2026 年，没有免费或低价替代方案能复制 Scandit 的实时 AR 叠加引擎，在实时摄像头画面中同步追踪多个条码。ETH Zurich
              的研究基础、公司的专利组合，以及引擎中沉淀的 17+ 年算法打磨，很难被竞争对手用三年加速开发项目压缩出来。Dynamsoft、Scanbot 和 Anyline 都提供多条码扫描，但没有一家提供完整 AR
              工作流工具（计数模式、查找模式、SparkScan 触发界面），而这些工具正是 Scandit 在高密度拣货和收货工位的企业部署差异化来源。


              护城河的反向证据很实质，不能低估。第一，Dynamsoft 的基准测试（供应商自写、静态图片、浏览器 SDK）显示，同一测试集上 Scandit 识别 178 个条码，对 Dynamsoft 的 428
              个，并且在该模式下慢 40×。虽然这项测试不反映真实摄像头视频流性能——Scandit 在该场景做过大量优化——但企业在线评估选项时会看到这个基准，它会给 Web 优先部署场景带来感知问题。第二，G2 和
              PeerSpot 上多位独立企业评价者把规模化成本列为 Scandit 的主要摩擦点。高频扫描量企业客户（杂货自助结账、大批量包裹分拣）会发现，按扫描或按设备计费成为最大的软件成本项之一，进而触发 RFP
              流程；Scanbot 的无限扫描模型或 Dynamsoft 的较低入门价，可以为切换提供预算理由。第三，Google ML Kit 和 Apple VisionKit 仍在获得母平台厂商持续投入；如果
              Google 或 Apple 决定进一步投资企业工作流能力，它们与 Scandit 的功能完整性差距（无 AR、无批量扫描、无身份扫描）可能在 3–5 年维度收窄。第四，Zebra FY2025 的 R&D
              支出为 $593 million，且收购 Elo Touch，显示其正直接向 Scandit 当前所在的软件工作流层推进——Workcloud 平台成熟后，可能削弱 Scandit 对 Zebra
              设备队列客户的价值主张。


              Honeywell PSS 剥离带来净正向机会，但也有一个前提。Honeywell 将其 $1.1B 扫描器 / 移动计算业务出售给 Brady Corp，使 Honeywell
              企业客户已安装基础出现不确定性；其中一部分客户可能在所有权过渡期加速评估混合设备队列和纯软件方案，这个窗口有利于 Scandit。前提是，Honeywell Operational Intelligence
              仍由独立所有权控制（留在 Honeywell 自动化业务内），或面临自身战略重估，因此 Honeywell 软件层的完整竞争图景尚未定局。


              总体看，Scandit 的护城河耐久但并非永久。未来 3–5 年，公司最好的竞争杠杆，是从基础条码扫描扩展到 AI
              驱动工作流、货架智能、身份验证和任务管理——这些功能里免费替代品落后最远，也更能用按席位或按结果定价支撑更高 ACV。
