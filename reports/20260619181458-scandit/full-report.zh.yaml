        - Vision AI Engine；SDK 许可证密钥激活
        - 模块激活受许可证控制；客户必须升级许可证才能解锁更多模块
      - - AR Overlay Layer AR 叠加层（MatrixScan AR）
        - 实时 AR 状态图标、叠层和弹出框，锚定到已检测条码
        - GPU 渲染；SDK AR 框架；设备显示延迟
        - 部分条码类型不支持 AR 跟踪模式；在条码极密集环境中性能下降
      - - ShelfView Cloud Pipeline
        - 图像摄取、基于 AI 的货架分析、数字货架孪生生成、警报分发
