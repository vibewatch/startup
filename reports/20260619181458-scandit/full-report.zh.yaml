      - number: '7.3'
        title: 财务、估值、披露与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              Scandit 的财务风险画像受到私人公司不透明度的实质约束。最后公开披露的 ARR 为 $119.1 million，由 CEO 在 2024 年 11 月通过 LATKA
              报告。没有可公开获取的经审计财务报表、年报或独立收入验证。NRR（净收入留存）、GRR（总收入留存）、流失率、烧钱率或单位经济数据都未披露。这种不透明迫使投资者完全依赖创始人披露指标，在估值讨论中制造逆向选择风险。


              2022 年 2 月由 Warburg Pincus 领投的 Series D 确立了 $1 billion 估值，对 $119.1 million ARR 意味着约 8.4× ARR 倍数。SaaS
              Capital 2025 基准显示，公开 SaaS 中位估值倍数约为当前 run-rate ARR 的 7.0×，较 2021 年峰值下降约 60%。在 $119.1 million ARR 且没有披露比
              2024 年底更新的增长率情况下，Scandit Series D 的 $1 billion 标称估值相对 2026 年市场环境可能偏高；用当前 SaaS 倍数重估公允价值，公司可能落在 $700–850
              million 区间，具体取决于增长假设，显著低于上一轮价格。这给任何新融资带来 down-round 风险，也显示可能与 Warburg Pincus 典型 4–7 年 PE 持有期产生张力；该持有期会指向
              2026–2029 年流动性事件窗口。


              客户集中度是相关风险。Walmart 是最大的单一具名企业客户——1.3 million 名员工在 Scandit 平台上，合作于 2025 年 6 月续约。未披露客户收入贡献比例；从公开来源无法判断
              Walmart 占总 ARR 的 5%、10% 还是 20%+。标准机构尽调阈值会把任何单一客户超过收入 10–15% 标记为重大集中度风险，需要做情景建模。缺少收入拆分意味着该风险无法量化。如果 Walmart
              缩小范围、强势重新议价或把扫描能力内化，收入影响可能相对 Scandit 规模不成比例。除 Walmart 外，没有披露任何其他客户的收入贡献。


              评论信号也稀疏。Scandit 在 G2 上少于 20 条已验证评论（抓取时列为 js-only access），SoftwareFinder 上有 3 条。FeaturedCustomers.com 页面列出
              177 个客户参考，但这些面向营销，不是独立评分评论。公司自报 98% NPS 没有第三方审计。独立评论足迹稀疏，加上定价不透明（仅定制报价），会制造买方摩擦，并限制投资者可获得的市场信心信号。
