      - number: '6.3'
        title: 具名客户案例研究与已验证生产成果
        blocks:
          - type: paragraph
            body: >
              Scandit 最深的公开证据基础来自其网站上的第一方案例研究，以及确认具名部署的第三方报道。2025 年 6 月 25 日续约的 Walmart 合作，是企业耐久性最实质的单一证据：该关系自 2022
              年启动，如今覆盖包括 MyWalmart app 在内的多个员工应用，部署场景包括订单履约、库存补货、缺货检测、产品信息查询和收据核查。Walmart 产品管理副总裁 Dan Miller
              在续约公告中被直接引用，提供了来自独立高管的高置信佐证。Staples Canada 是结果量化最充分的案例研究：298 家加拿大门店的 1,200 台 iPhone 每周产生 20,000 次会话和
              200,000 次应用交互，在价格审计中每周节省 18,500 个员工小时，并相对专用扫描设备降低 45% 硬件成本。

              物流方面，Swiss Post 将 Scandit Smart Data Capture 集成到 Nemo app，每年处理 200 million 件包裹和 1.7 billion 封信件；具名 IT 负责人
              Sascha Zingg 确认司机对扫描速度和准确性满意。Dior 在 2025 年 12 月与 Hardis WMS 的部署中，把配送中心的发运控制时间减少 85%；Scandit 新闻稿和 Retail
              Times 报道都提供了独立佐证。医疗方面，NHS Scan4Safety 计划下的 Leeds Teaching Hospitals NHS Trust 将产品召回时间从超过 8 小时降到 35
              分钟，召回成本从 £173 降到 £9；GS1 UK 独立记录了这些成果。日本的 OK Corporation 将每件商品的拣货时间从 5 秒降到 2 秒，并把拣货错误率从约 6%
              降到接近零。医疗器械方面，Artivion 将 Scandit Express 部署给美国和 EMEA 的 140 名现场代表，自 2021 年 10 月实施以来拣货错误为零，第一年完成 2,274 次库存盘点。

              面向消费者的部署也显示规模：Shipt 通过让承包商自有个人智能手机支持扫描，在没有专用设备采购计划的情况下增长到 89,000 台月活设备。Alaska Airlines 将 Scandit
              用于登机口扫描，产品经理明确指出 Scandit「在准确性和速度上都远胜竞争对手」。Kroger 将 Scandit 用于生鲜库存管理，并由其 Senior Manager of Product 确认。
