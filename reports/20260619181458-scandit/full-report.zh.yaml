  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资（2025–2026）
      - 目标细分市场
      - 差异化
      - 相对 Scandit 的局限
    rows:
      - - 'Zebra Technologies (NASDAQ: ZBRA)'
        - 硬件既有厂商 / 集成 SDK
        - $5.40B FY2025 收入；2025 年 10 月以 $1.3B 收购 Elo Touch；条码扫描仪市场份额约 25–28%
        - 企业加固设备队列——零售、仓储、物流、医疗健康
        - 面向 Zebra 硬件的免费 DataWedge/EMDK SDK；深度设备集成；$593M 研发投入；Workcloud 平台扩张
        - SDK 锁定 Zebra 设备；不跨平台；没有 AR 多条码叠加的同等能力；仅在 Zebra 硬件上免费
      - - Honeywell PSS（正被 Brady Corp 收购）
        - 硬件既有厂商 / 设备管理软件
        - FY2025 收入约 $1.1B；Brady 于 2026 年 4 月宣布 $1.4B 收购，预计 2026 年下半年完成；市场份额约 18–22%
        - 仓库、物流、分销、制造——大型加固设备队列账户
        - Operational Intelligence（Oi）设备队列管理；异常检测；SAML SSO；B2M 合作伙伴支持跨供应商设备
        - 收购后战略不确定；Oi 不是条码采集 SDK；Brady 旗下未来 AI 路线图不清晰
      - - 'Datalogic (Borsa Italiana: DAL)'
        - 硬件既有厂商 / 嵌入式固件
        - €493.8M FY2024 收入；2025 年上半年 €241.1M；AIDC 市场份额约 20%；2025 年 4 月收购 Datema（EasyShop）
        - 零售、物流、制造、医疗健康——EMEA 大本营
        - 精密制造硬件；Memor 移动计算机；通过收购 Datema 获得 EasyShop 零售软件；活力指数强（27.2% 新产品销售）
        - 没有 AR 工作流 SDK；软件层局限于嵌入式固件；固定式零售扫描仪板块收入持平 / 下滑
      - - Dynamsoft（私有，加拿大）
        - 纯软件 SDK
        - 私有；估计为中端市场 SaaS 收入；入门 SDK 起价约 $1,249/年；开发者用户基数大
        - 工业、制造、服务器端图像处理、Web 应用开发者
        - 在供应商基准中，静态图像批量检测准确率最高（428 个条码，Scandit 为 178 个）；浏览器 SDK 最快（278 ms/图像）；支持广泛码制
        - 基准由供应商撰写，且只测静态图像；没有 AR 叠加；企业一线 UI 工具较弱；不聚焦零售 / 物流工作流
      - - Scanbot SDK（doo GmbH，德国）
        - 纯软件 SDK
        - 私有；已获融资；固定年费许可证起价（不限扫描 / 设备）；估计约 100–200 名员工
        - 企业应用开发者；保险、现场服务、医疗健康；高量部署
        - 固定年费且不限扫描 / 设备——相对 Scandit 具备定价确定性优势；Cognex 迁移支持详细；文档扫描能力强
        - 没有 AR/MatrixScan 工作流深度；没有 ID Bolt 同等产品；没有货架智能；企业 SLA 有限
      - - Anyline（维也纳，奥地利）
        - 纯软件 SDK（OCR / 文本采集专家）
        - 2026 年收入估计约 $42M；总融资 $36–39M；2026 年 2 月更换 CEO
        - 公用事业（抄表）、物流（车牌、VIN）、汽车（轮胎）、政府
        - 面向非结构化文本字段的移动 OCR；TireBuddy 汽车 SDK；定制模型训练；工业垂直细分领域有定位
        - 不是零售 / 仓库条码扫描竞争对手；OCR 优先、条码其次的架构；规模小于 Scandit
      - - Microblink / BlinkID（伦敦 / 布鲁克林）
        - ID 扫描与证件 OCR 专家
        - 2026 年收入估计约 $28M；总融资 $60M（Silversmith 2020 Series A）；约 130–178 名员工
        - 金融服务 KYC、电信开户、数字身份、在线验证
        - 2025 年处理约 3B 次身份验证；覆盖 195 个国家；先进欺诈检测；活体检测与生物特征匹配
        - 不是条码扫描竞争对手；仅做 ID；缺少一线员工工作流工具；主要是数字 / 云端 KYC，而非实体触点
      - - 'Socket Mobile (NASDAQ: SCKT)'
        - 硬件 + 捆绑 SDK（小规模）
        - 2026 年 Q1 TTM 收入 $14.8M；市值约 $7.2M；约 53 名员工
        - 销售点零售、现场服务、库存——面向平板 / 手机的蓝牙扫描仪附件
        - CaptureSDK 与蓝牙扫描仪捆绑；Shopify/Apple 原生集成；基础 POS 工作流的低成本扫描仪选择
        - 依赖硬件的蓝牙扫描（不是摄像头）；没有 AR、没有多条码；本质上是 POS 外设，不是企业平台竞争对手
      - - Google ML Kit（Google LLC，平台 API）
        - 平台 API 替代品
        - 免费；集成于 Android，并可用于 iOS；由 Google 工程团队维护
        - 在 Android/iOS 上构建消费级或基础企业应用的开发者
        - 零许可成本；端侧处理；Google 生态集成；覆盖广泛 Android OEM 设备
        - 没有 AR 叠加；每次扫描最多 10 个条码；没有批量扫描；没有 ID 证件扫描；没有企业 SLA；基准中检测约 120 个条码，低于商业领先者
      - - Apple VisionKit（Apple Inc.）
        - 平台 API 替代品
        - 免费；仅原生 iOS/macOS；由 Apple 维护
        - iOS 原生应用开发者；消费级和基础企业 iOS 部署
        - 原生 iOS 集成；零成本；Apple 硬件加速；无外部依赖
        - 仅 iOS/macOS——没有 Android 或 Web 路径；没有 AR 工作流；企业定制能力不足；不适合混合设备队列
    notes: >-
      Zebra、Honeywell 和 Datalogic 的硬件收入代表公司总收入或分部收入，不能与 Scandit 纯软件 ARR 直接比较。硬件既有厂商的市场份额指企业条码扫描仪硬件市场，不是 Scandit
      竞争的软件层数据采集市场。Anyline、Microblink 和 Scanbot 的收入与员工数来自 Growjo、Tracxn 和公司情报平台等第三方估算，可能不同于实际私有公司数据。所有财务数据截至 2026
      年中研究日期。
