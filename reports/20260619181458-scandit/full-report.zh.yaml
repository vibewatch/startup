  - id: FP003
    title: 竞争护城河与就绪度 KPI
    type: kpi
    layout: standard
    summary: >-
      8 个 KPI 风格指标概括 Scandit 在关键维度上的竞争耐久性。评级基于证据做序数判断；绿色 = 强，黄色 = 中等，红色 = 有风险。合在一起看， Scandit
      的短期护城河很强，但有两个明确软肋：规模化后的定价，以及静态图片 Web SDK 性能相对 Dynamsoft 的差距。
    data:
      items:
        - label: AR 工作流差异化深度
          value: Strong
          tone: positive
          detail: MatrixScan、SparkScan、Find 模式——截至 2026 年，没有免费或低价竞争对手能匹配完整 AR 叠加套件
        - label: 装机基础黏性（切换成本）
          value: High
          tone: positive
          detail: SDK 嵌入 WMS/TMS/ERP 应用；企业客户 2,100+；支持满意度 >98%；要替换需付出多年重新集成成本
        - label: 平台宽度（条码 + ID + 货架 + OCR 集于一个 SDK）
          value: Unique
          tone: positive
          detail: 唯一在单一 SDK 平台覆盖全部四个能力域的厂商；最接近的竞争对手至多覆盖两个
        - label: 硬件无关的跨平台覆盖
          value: Strong
          tone: positive
          detail: 任意摄像头设备——智能手机、可穿戴设备、无人机、机器人、固定摄像头——都支持；Zebra 或仅 Apple SDK 做不到
        - label: 规模化定价（按扫描次数或按设备模型）
          value: Moderate risk
          tone: warning
          detail: 规模成本是独立评论者最主要的抱怨；Scanbot 的不限量模型和 Dynamsoft 的入门价格，给高用量账户带来预算压力
        - label: 静态图片 / Web SDK 条码检测相对 Dynamsoft
          value: At risk (specific scenario)
          tone: negative
          detail: >-
            Dynamsoft 基准测试显示，静态图片 Web SDK 模式下，Scandit 检出 178 个条码，Dynamsoft 检出 428 个，且 Scandit 慢 40×；
            即便摄像头模式表现不同，也会造成负面感知
        - label: ID 扫描相对 Microblink 的竞争位置
          value: Moderate
          tone: warning
          detail: Microblink 2025 年处理 3B 次验证，KYC/AML 集成更深；Scandit ID Bolt 在实体触点（边缘、离线）更强， 但云端 KYC 工作流宽度更窄
        - label: 抵御硬件既有厂商软件扩张（Zebra Workcloud）的韧性
          value: Moderate risk
          tone: warning
          detail: Zebra FY2025 R&D 投入 $593M，并收购 Elo Touch，瞄准同一个一线工作流市场；风险会在 2–4 年产品路线图中显现，不是马上发生
    claimRefs:
      - CP033
      - CP034
      - CP035
      - CP036
      - CP037
      - CP038
      - CP039
      - CP040
  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: Scandit 的客户活动——设备部署和工作流采用——如何经由 SDK 订阅和许可模型，转化为年度经常性收入及估算毛利。
    data:
      nodes:
        - id: device
          label: 配备摄像头的智能设备
          detail: 智能手机、平板、手持终端、可穿戴设备或固定摄像头；公司称活跃设备 170M+。
          tone: neutral
        - id: sdk
          label: 设备安装 Scandit SDK
          detail: 端侧计算机视觉；Core/Standard/Advanced 层级；条码、ID、标签、AR。每次扫描不消耗云计算。
          tone: positive
        - id: license
          label: 年度 SDK 许可
          detail: 按设备或固定年费；核心变现事件；约 1,000–2,100 家企业客户。
          tone: positive
        - id: expand
          label: 落地后扩张增售
          detail: 现有客户增加设备、模块（ID、ShelfView）、地域或工作流。推动估算 NRR 约 115–125%。
