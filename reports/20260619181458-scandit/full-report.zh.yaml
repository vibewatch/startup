      - number: '7.4'
        title: 运营、执行与关键人风险
        blocks:
          - type: paragraph
            body: >-
              Scandit 的运营风险主要是人员和治理风险。截至 2026 年中，三位联合创始人——Samuel Mueller（CEO）、Christian Floerkemeier（CTO and VP
              Product）和 Christof Roduner（CIO and VP Engineering）——仍在活跃担任 C-suite 和技术领导职务。对一家成立 16 年、处于 Series D
              融资阶段的独角兽而言，这并不常见，而且利弊并存：创始人深厚的计算机视觉和 ETH Zurich 研究背景确实形成技术差异，但持续的运营集中也是治理风险。Samuel Mueller
              是记录中每个重大公司公告的具名发言人——Series D、MarketLab 收购、Walmart 合作续约——这带来关键人暴露。任何一位创始人离开，尤其是 Mueller 作为 CEO 或
              Floerkemeier 作为 CTO 离开，都可能扰动机构客户关系、投资者信心和产品路线图。


              Scandit 雇用约 500 人，其中约 40% 从事 R&D。这一人头结构体现出真正的工程驱动文化，但也意味着约 200 名工程师推动核心 Vision AI
              Engine。该引擎是专有的——没有开源组件、没有第三方审计——积累的技术知识集中在一支相对较小的工程团队中，难以独立验证或复制。截至 2026 年中，未发现重大 C-suite
              离任或负面领导层变动；Glassdoor 显示员工情绪整体正面（基于 141 条评论，4.0+/5.0），但数据与公司相关，必须谨慎看待。


              宏观和设备周期风险具有实质性。Scandit 授权主要按设备数或年费计；零售、物流等行业的企业 BYOD
              采用周期和设备更新节奏会造成收入波动。经济下行或零售支出收缩可能压缩设备部署预算，拖慢现有账户扩张，并降低新 logo 赢单率。驱动 Scandit 单位经济的先落地再扩张模型，对企业 IT
              支出周期和一线员工数字化动能最敏感。Scandit 是纯软件公司，因此不存在重大供应链或制造风险，但其客户的硬件更新时间线（企业坚固型设备通常为 3–5 年周期）可能压低扫描席位扩张。


              缺少经审计财务、董事会构成披露或公开治理文件，意味着这些领域的重大问题无法仅凭公开尽调确认或排除。瑞士私人公司披露标准不要求公开提交账目，因此这种不透明是结构性的，而不是困境信号。
