      - number: '3.2'
        title: 纯软件 SDK 和专业计算机视觉竞争对手
        blocks:
          - type: paragraph
            body: >
              纯软件 SDK 层是 Scandit 最直接的竞争场。六家厂商在不靠硬件收入的企业条码扫描市场竞争：Dynamsoft、Scanbot
              SDK、Anyline、Microblink（BlinkID）、barKoder，以及已停用的 Cognex cmbSDK（这给 Scandit 及同业带来一次被迫迁移窗口）。


              在核心条码识别准确率上，Dynamsoft 是 Scandit 技术能力最强的纯软件对手。Dynamsoft 自己发布的一项基准测试覆盖 83 张静态真实场景测试图片（Web
              SDK、浏览器环境、默认配置），结果显示 Dynamsoft 识别出 428 个条码、292 个唯一代码，Scandit 为 178 个条码。平均处理时间为 Dynamsoft 每张 278 ms，Scandit
              为 11,210 ms。关键范围提示：这是供应商自写基准，使用 Dynamsoft 自有测试集，测的是浏览器里的静态图片 API 解码，不测摄像头视频流或原生移动 SDK
              性能；后两类场景结果会不同。Dynamsoft 入门价格透明（单项功能 Web 许可约 $1,249–$1,371/年），设备或服务器部署则扩展为定制企业报价。Dynamsoft
              的目标客群更偏工业和制造（批量扫描、服务器端图像处理），而不是企业一线工作流，因此与 Scandit 在零售和物流强项上的企业正面竞争有所受限。


              Scanbot SDK（品牌名 Scanbot，德国 doo GmbH 子公司）把自己定位为 Scandit
              的替代方案，主打定价模型清晰：它按固定年度许可收费，在每个授权应用或域名内提供无限扫描和无限设备，消除企业客户在 Scandit 上常提到的按扫描或按设备计费不可预测性。Scanbot
              还提供详细迁移文档，专门面向 Cognex cmbSDK 用户。Scanbot 在 AR 工作流深度（MatrixScan、SparkScan）和身份文件扫描能力上不及 Scandit。


              Anyline 总部位于奥地利维也纳，是一家移动 OCR 和数据采集 SDK 公司，2026 年收入估计约 $42 million，累计融资 $36–39 million。Anyline 领导层在 2026 年
              2 月调整（联合创始人 Lukas Kinigadner 从 CEO 转任 Chief Revenue Officer；Christoph Braunsberger 出任 CEO）。Anyline
              最强的差异化在于非结构化文本 OCR 采集（车牌、轮胎侧壁、公用事业仪表、VIN）和垂直细分 SDK，尤其是汽车领域的 TireBuddy，而不是企业级条码扫描。


              Microblink（BlinkID 产品线）总部在伦敦，并在 Brooklyn 设有美国运营团队，主要在身份文件扫描领域与 Scandit 竞争。Microblink 2026 年收入估计约 $28
              million，累计融资 $60 million（2020 年由 Silversmith 领投 Series A），员工约 130–178 人。2025 年，Microblink 在 195 个国家处理了约 30
              亿次身份验证，沉淀了深厚的 KYC/AML 能力。BlinkID SDK 聚焦文件 OCR、机器可读区提取和欺诈检测，而不是条码扫描，因此它是部分竞争对手——在 Scandit ID Bolt
              项目上直接竞争，但不覆盖核心条码或 AR 工作流用例。


              Cognex Corporation 从 2026 年起停用其移动条码 SDK（cmbSDK），这是纯软件层最重要的结构性事件。Cognex 的传统企业客户集中在医疗、制造和现场服务，如今必须迁移到替代
              SDK。Dynamsoft、Scanbot 和 Scandit 都已为原 Cognex cmbSDK 用户发布定向迁移指南，在一个通常切换成本很高的品类里，打开了罕见的绿地获客窗口。


              Socket Mobile（NASDAQ: SCKT）把 CaptureSDK 与自家无线条码和 RFID 硬件扫描器捆绑销售，面向 POS、零售店员和现场服务场景，用蓝牙扫描器连接 iOS、Android 和
              Windows 设备。Socket Mobile 2026 年 Q1 的过去十二个月收入为 $14.8 million；市值约 $7.2 million。Socket Mobile 位于 Scandit
              市场边缘——其硬件加 SDK 套装服务于依赖专用蓝牙扫描器连接平板或手机的零售环境，而不是基于摄像头的扫描。不过，一些企业客户会购买 Socket 扫描器，作为简单 POS 周边扫描工作流里成本更低的
              Scandit 替代方案。
