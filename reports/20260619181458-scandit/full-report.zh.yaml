      - number: '4.6'
        title: 图表
        blocks:
          - type: callout
            title: 前四分位的 ARR/员工效率
            body: >-
              Scandit 隐含每名全职员工 ARR 约 $327K（$119.1M / 364 名员工），高于 Benchmarkit 2025 对 >$100M ARR 层级私有 SaaS 公司的 $300K
              中位数。员工数从峰值 553 人（2022 年 12 月）收缩到 364 人（2025 年 11 月）后，公司人均产出优于企业 SaaS 基准，显示资本效率改善，并出现通向盈利的路径。
            calloutType: strength
            claimRefs:
              - CI020
              - CI021
              - CI022
              - CI023
          - type: callout
            title: 未经佐证的 240% ARR 增长和同步裁员，需要数据室验证
            body: >-
              最实质的财务风险是，Scandit 报告的 ARR 从 $35M（2023 年 12 月）跃升至 $119.1M（2024 年 11 月）——同比增长 240%——唯一来源是创始人披露的 LATKA
              数据库条目，没有任何独立审计、新闻稿、投资人公告或分析师覆盖佐证。与此同时，公司员工数在 2024 年 10 月到 12 月之间减少约 153 人（从 545 到 392），约两个月降幅
              ~28%，且没有公开解释。ARR 数字要作为可靠承保输入，必须先在数据室得到针对这两项信号的具体回应。
