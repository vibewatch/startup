      - number: '6.6'
        title: 图表
        blocks:
          - type: callout
            title: Walmart 多年期续约是最持久且有独立佐证的企业级证明点
            body: >-
              2025 年 6 月 Walmart 合作续约——由 Scandit 新闻稿、Retail Customer Experience、IoT M2M Council 和 Retail Systems 确认——是
              Scandit 公开记录中最强的单一企业耐久性证据。该关系自 2022 年开始，现已覆盖 MyWalmart app 中多个面向员工和客户的应用，覆盖 1.3 million
              名美国员工，并在续约协议中包含扩大的商业范围。Walmart 产品管理副总裁 Dan Miller
              被直接引用，提供了独立高管确认。对一家私人公司而言，这种部署规模下的多年期企业续约，加上来自客户具名高管的佐证，是异常强的产品耐久性和商业粘性公开证明点。
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: 自报 98% NPS 无法验证；没有方法论披露时统计上也不可信
            body: >-
              Scandit 首页突出展示 98% NPS。页面没有引用调研方法、样本量、调研日期、回复率或独立调研机构。98% NPS 会把 Scandit
              放到全球任何企业软件基准的最高层级——该层级通常只有少数消费品牌，几乎没有企业 SaaS 供应商。唯一独立第三方评论数据集 G2 显示，13 条评论平均 4.2/5（对企业软件而言并不突出）。PeerSpot
              标出定价不透明是持续的用户投诉。没有方法论披露时，98% NPS 应视为营销声明，而不是有基准可比或可审计的满意度指标。尽调应索取完整 NPS 调研方法、原始数据分布和第三方调研机构细节。
            calloutType: risk
            claimRefs:
              - CU004
              - CU024
              - CU029
          - type: callout
            title: 案例研究深度明显偏向零售和物流；医疗与制造需要直接尽调
            body: >-
              Scandit 的公开案例研究库和具名客户证据高度集中在零售（Walmart、Staples Canada、OK Corporation、Kroger、VF Corporation）和物流（Swiss
              Post、Dior、Shipt、Yodel）。医疗有一个强证明点（Leeds Teaching Hospitals NHS Trust，并有 GS1
              佐证）和一个生产部署（Artivion），但没有具名美国医院网络、卫生系统或大型药房连锁案例研究。制造和现场服务参考存在于 casestudies.com 库中（American
              Woodmark、Cincinnati Bell、British Gas），但 Scandit 网站上没有量化的第一方成果。任何依赖医疗或制造垂直增长的投资者，都应索取 pipeline
              数据、按垂直行业划分的活跃客户数和垂直细分 NRR；目前公开证据不足以支撑对称的垂直多元化主张。
            calloutType: insight
            claimRefs:
              - CU020
              - CU027
              - CU042
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私与知识产权 / 法律风险图谱
        blocks:
          - type: paragraph
            body: >-
              Scandit 面临两类不同法律风险：来自既有硬件厂商的专利诉讼，以及欧盟数据保护和 AI 法律演进带来的监管义务。


              专利方面，Hand Held Products, Inc.（HHP，Honeywell 子公司）于 2024 年 2 月 21 日在 Unified Patent Court（UPC）Munich Local
              Division 对 Scandit 申请临时措施；同一天，欧洲专利 EP 3 866 051 获授权。该专利覆盖读取和显示与产品图像关联条码的设备和方法。2024 年 8 月 27 日，Munich LD
              基于间接侵权对 Scandit 发出初步禁令，认定 Scandit 的 Data Capture SDK——尤其是 BarcodeTrackingAdvancedOverlay
              功能——提供了让客户构建专利侵权软件的必要手段。Scandit 提起上诉，口头听证于 2025 年 1 月 9 日举行。2025 年 3 月 13 日，HHP 撤回临时措施请求；UPC Court of
              Appeal 于 2025 年 4 月 18 日正式结束该程序。同时，HHP 在美国 District Court（N.D. Illinois，1:24-cv-11027）提起诉讼，主张五项美国专利；该诉讼由
              HHP 于 2025 年 3 月 14 日自愿有偏见撤诉，各方承担自身法律费用，且没有侵权认定。两边快速撤回，加上 Scandit 要求 €500,000 费用担保，说明 HHP 可能判断诉讼风险 /
              回报不利。尽管如此，该事件说明一种反复出现的风险：Honeywell、Zebra Technologies 和 Cognex 在条码技术中持有大量硬件相邻专利组合；考虑到 Scandit
              持续替代专用扫描硬件，未来专利主张行动不能排除。UPC 初步裁定在 HHP 撤回前曾认为 Scandit SDK 可能构成间接侵权，这说明 BarcodeTrackingAdvancedOverlay
              这一功能类别存在非零专利攻击面。


              监管方面，GDPR 仍是主要合规义务。Scandit 的 ID Scanning 和 ID Validate
              产品处理含有生物识别数据的身份文件（护照、驾照）；当这些产品用于身份验证而不仅是简单数据提取时，可能构成 GDPR Article 9 下的「特殊类别数据」处理，需要明确同意或狭义定义的法律基础。Scandit
              的端侧架构——除 ShelfView 外，所有产品都在扫描设备本地完成处理——实质性降低了数据传输和集中存储风险。Scandit 已获得 ISO 27001:2022
              认证，并设有由高管监督的专职信息安全团队。EDPB 已将透明度和信息义务指定为 2026 年 Articles 12–14 GDPR 下的协调执法优先事项，这意味着 Scandit 的企业客户部署 ID
              扫描工作流时，在向终端用户披露其身份证件数据如何被处理方面，将面临更高合规审查。尚未发现针对 Scandit 的 GDPR 执法行动。


              EU AI Act 引入前瞻性风险层级。Article 5 禁止行为——包括公共空间实时生物识别、工作场所情绪识别，以及无目标抓取人脸图像——已于 2025 年 2 月 2 日生效；这些似乎都不直接适用于
              Scandit 当前以证件 / 条码为导向的产品线。高风险生物识别系统合规（Annex III）原定 2026 年 8 月 2 日截止，但根据 2026 年 5 月 7 日 Digital Omnibus
              政治协议，已被临时推迟至 2027 年 12 月 2 日，不过该安排尚未正式成为法律。如果 Scandit 的 ID Bolt 和 ID Validate
              产品在特定部署中被归类为高风险生物识别系统（如边境年龄验证、员工身份核查），则风险管理系统、数据治理、人工监督和透明度等合规义务将适用。尚未发现 AI Act 下针对 Scandit
              的执法行动。净风险具有实质性，但主要由 Scandit 的企业客户承担；在多数部署中，Scandit 作为数据处理者而非数据控制者，主要 GDPR 责任转移给企业。
