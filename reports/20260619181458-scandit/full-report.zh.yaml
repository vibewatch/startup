      - number: '5.3'
        title: 开发者体验、框架覆盖和企业集成
        blocks:
          - type: paragraph
            body: >
              Scandit 支持 11 种部署框架：原生 iOS（CocoaPods、SwiftPM、Carthage）、原生
              Android（Gradle/Maven）、JavaScript/Web（WebAssembly）、React Native、Flutter、Cordova、Capacitor、Xamarin、.NET
              MAUI、Titanium 和 Linux。公司发布跨所有平台的功能对等文档。开发者工具包括 Scandit Developer Documentation 门户（docs.scandit.com）、73 个包含
              SDK 示例应用和参考代码的 GitHub 仓库、30 天免费试用（即时许可密钥、无需销售电话）、UX 最佳实践库、QA 测试指南，以及约三小时的中位支持首次回复时间。


              Scandit 在 2026 年最重要的开发者生产力投入是 Agent Skills：一个 AI 辅助集成包，允许 AI coding agents——包括 Claude Code、Cursor、GitHub
              Copilot、Codex、Gemini 及 40+ 其他工具——从自然语言描述出发，自主写完整 SDK 集成。Agent Skills 用一条命令安装（npx skills add
              https://github.com/scandit/skills），并面向当前已验证 SDK API。对已经使用 AI 辅助开发的团队，这能显著缩短集成时间。截至 2026 年中，npm 包
              scandit-web-datacapture-barcode 每周下载量约 9,500–32,000 次，与持续的 B2B 企业采用相符。


              企业集成方面，已验证最强合作是 SAP：Scandit 为 SAP Fiori、S/4HANA、SAP Business Technology Platform、Commerce Cloud 和 Extended
              Warehouse Management 提供原生 SDK 和 Web SDK 集成，覆盖库存管理、发货 / 收货、mPOS、线上下单门店自提和身份扫描等工作流。SAP 合作页面采用联合品牌，SAP App
              Center 将 Scandit 列为认证 SAP 合作伙伴。Google AppSheet 方面，Scandit 在 Google 官方帮助文档中被列为具名扫描提供方，需要单独购买 Scandit
              许可；集成适用于 Core 层级及以上 AppSheet 计划。在 Pega 中，Scandit Smart Data Capture 作为直接 marketplace 组件提供，可无代码嵌入 Pega
              Platform 工作流，用于医疗、物流和制造场景。


              Oracle、Blue Yonder 和 Manhattan Associates 不提供开箱即用 Scandit 连接器。面向这些平台的企业部署需要自定义中间件、集成平台（Oracle Integration
              Cloud、Boomi、MuleSoft）或 SDK 层开发。相比 SAP、AppSheet 和 Pega 集成，这带来额外部署成本和集成风险，也是面向 Oracle WMS 或 Blue Yonder WMS
              账户交易的尽调点。
