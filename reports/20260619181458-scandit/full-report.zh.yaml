        - 2026 年 IPO 市场基本关闭；SaaS 估值压缩削弱退出倍数空间
        - IPO 市场重启（Databricks/OpenAI 作为试金石）；M&A 战略接触或投行介入
      - - 治理 / 透明度
        - 三位创始人运营公司，沉淀 17 年机构知识；Warburg Pincus 带来治理纪律
        - 全创始人 C-suite 造成关键人集中；经审计财务和董事会构成均未披露
        - 数据室治理文件；确认董事会独立性；创始人归属 / 留任条款
    notes: 所有正方和反方论点均基于公开证据。标为未披露的项目需要数据室访问。
