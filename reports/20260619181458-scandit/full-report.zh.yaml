companyProfile:
  summary: >-
    Scandit AG 是一家瑞士私营企业软件公司，2009 年 11 月由三位 ETH Zurich
    计算机视觉研究人员创立。公司做出了领先的智能数据采集平台，把任何带摄像头的智能设备——智能手机、平板电脑、手持计算机、可穿戴设备、无人机和固定摄像头——变成企业级条码扫描器、身份证件读取器和 AR 引导的工作流工具。截至 2026
    年中，平台每年处理 800 亿次条码扫描，覆盖 1.7 亿+ 活跃设备，服务零售、物流、医疗、制造和航空出行领域的 2,100+ 家企业客户。Scandit 于 2022 年 2 月完成由 Warburg Pincus 领投的
    $150M Series D 轮，投后估值 $1B+，成为独角兽。最近一次公开披露的 ARR 为截至 2024 年 11 月的 $119.1M（CEO 通过 LATKA 披露），意味着较 2023 年 12 月的 $35M
    同比增长约 240%——该数字需要独立佐证。
