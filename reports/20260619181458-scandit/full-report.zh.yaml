  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和品类定义
        blocks:
          - type: paragraph
            body: >
              Scandit 所处市场位于三个重叠品类的交叉处：企业条码扫描、应用于物理对象的 AI
              计算机视觉，以及面向一线员工的增强现实工作流工具。界定边界是实质尽调任务，因为该领域分析师估算会因纳入范围不同而相差一个数量级。

              最窄口径是移动条码扫描器应用，即把消费级或企业级智能手机变成条码读取器的纯软件 SDK 和应用；按该口径，2026 年市场约 $0.9 billion，复合年增长率为 4.7–8.3%。该范围最直接覆盖
              Scandit 的条码扫描 SDK 和 SparkScan/MatrixScan 产品，但排除了更广泛的工作流智能和身份验证产品。

              更宽但仍与硬件相邻的定义——条码扫描器和移动计算机合并——覆盖 Zebra、Honeywell、Datalogic 等厂商的硬件设备、嵌入式固件和软件应用，也包括 Scandit
              这类纯软件供应商。该口径下，2026 年估算为 $2.9–3.5 billion，CAGR 为 5.7–8.6%。Scandit
              在该市场中的纯软件动作意味着它竞争的是软件层而非硬件附件，因此直接计算整体市场收入份额会产生误导。

              企业计算机视觉是最宽品类，涵盖从制造质量检测、自动驾驶视觉到零售货架智能和文件扫描的所有 AI 机器感知；2026 年全球估计为 $27.0 billion，并以 17.89% CAGR 增长至 2034
              年。Scandit 参与该空间中的特定垂直领域（智能设备条码扫描、身份验证、货架智能），但不覆盖制造缺陷检测、自动导航、安防监控或医学影像；这些共同构成了广义市场的大部分。

              应从 Scandit SAM 中正确排除的关键支出包括：移动设备管理平台（MDM，这是一个相邻的 $10+ billion 市场，管理运行 Scandit 的设备，但不执行数据采集功能）、坚固型设备硬件（由
              Zebra 和 Honeywell 领跑的 $10.4 billion 企业坚固型手持设备市场）、企业资源计划软件、并非面向企业一线工作流的通用云视觉 API（Google Vision AI、AWS
              Rekognition），以及消费者条码扫描工具。

              Scandit 正在主动进入或会影响其可服务范围的相邻市场包括：零售货架智能和自动货架监测（Fortune Business Insights 称 2026 年智能货架市场为 $5.58
              billion）、用于用药核验和资产跟踪的医疗条码扫描（2026 年 $4.8 billion），以及 AI 驱动的身份和文件验证（因有记录的欺诈激增而快速增长，2025 年每 25 次验证中就有 1
              次欺诈尝试）。
