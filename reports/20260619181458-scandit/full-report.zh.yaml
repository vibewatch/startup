  - id: FM004
    title: 采用漏斗与价值链
    type: flow
    layout: standard
    summary: >-
      企业智能数据采集价值链从技术基础设施（硬件 + OS）出发，经过 SDK 平台层（Scandit 的位置），再到工作流应用集成，最后到终端用户结果。 Scandit 的价值在 SDK
      层捕获；链条中的相邻参与者既是合作伙伴，也是潜在竞争威胁。
    data:
      nodes:
        - id: hardware
          label: 硬件层
          detail: 智能手机、平板、坚固型手持计算机（Zebra、Honeywell、Datalogic、Samsung）、可穿戴设备、无人机、固定摄像头。 Scandit 不销售这些硬件；它们决定实体扫描性能下限。
          tone: neutral
        - id: os
          label: OS 和 MDM
          detail: Android、iOS、Windows；企业 MDM（VMware Workspace ONE、SOTI、Microsoft Intune）。管理设备队列； MDM 供应商正越来越多打包基础扫描能力。
          tone: warning
        - id: sdk
          label: Smart Data Capture SDK（Scandit 平台）
          detail: >-
            Barcode Scanner SDK、SparkScan、MatrixScan、ID Bolt、Label Scanning、ShelfView。把任何摄像头转成企业级扫描器； AR 叠加；端侧 ML 推理。这就是
            Scandit 的位置。
          tone: positive
        - id: integrations
          label: 工作流集成
          detail: SAP EWM、Google AppSheet、Pega、自定义 WMS/TMS/ERP 扩展。Scandit 与这些平台合作；这里的深度集成形成切换成本， 也带来合作伙伴渠道依赖。
          tone: positive
        - id: apps
          label: 企业工作流应用
          detail: 零售商、物流运营商和医院自建移动应用。这些是直接买方；它们嵌入 SDK，并掌握终端用户体验。
          tone: neutral
        - id: frontline
          label: 一线员工结果
          detail: 更快扫描吞吐、更少错误、AR 引导工作流、更低培训时间。价值主张必须能在试点中证明，才能打开全面部署。
          tone: positive
        - id: platform-risk
          label: 平台层风险
          detail: Apple（iOS）、Google（Android）、Samsung（Knox）和 Microsoft（Intune）都有足够入口嵌入扫描能力，从而绕开 SDK 层。目前这种威胁仅限于商品化用例。
          tone: warning
      edges:
        - from: hardware
          to: os
        - from: os
          to: sdk
        - from: sdk
          to: integrations
        - from: integrations
          to: apps
        - from: apps
          to: frontline
        - from: platform-risk
          to: sdk
    approximationNotes: null
    claimRefs:
      - CM001
      - CM002
      - CM032
      - CM035
      - CM036
