  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史、估值锚与陈旧价格风险
        blocks:
          - type: paragraph
            body: >
              Scandit 最后披露的估值为 $1 billion-plus，来自 2022 年 2 月完成的 $150 million Series D，由 Warburg Pincus
              领投，Atomico、Forestay Capital、G2VP、GV、Kreos Capital、NGP Capital、Schneider Electric、Sony Innovation Fund 和
              Swisscom Ventures 参投。当时，公司 ARR 较 2020 年 5 月 Series C（融资 $80M）后已翻倍以上。GetLatka 报告 2021 年 4 月 ARR 为 $21M，这是
              Series D 前最近的公开数据点；结合公司称 ARR 较 2020 年 5 月「翻倍以上」，Series D 完成时隐含 ARR 估计为 $55–80 million。因此，该轮当时的隐含估值倍数约为
              12–18× ARR——符合 2022 年初市场环境，当时 SaaS Capital Index 在 2022 年 2 月美联储加息周期开始前约为 12–14×。该轮约造成 15% 股权稀释（由 GetLatka
              暗示：以 $1B post-money 融资 $150M），对应约 $850M pre-money 估值。


              截至 2026 年 6 月，公司没有公开宣布后续主股权融资。公司已超过四年没有新的主股权稀释，这可能符合强劲有机现金生成、使用 Kreos Capital 风险债设施，或两者兼有。没有新主轮融资也意味着 $1B
              估值未被修订，且可能严重陈旧。2022 年 2 月 Series D 完成至 2026 年中，SaaS Capital Index（SCI）中位数从约 12–14× 降至 3.4× ARR——压缩超过
              75%。PitchBook Q1 2026 Enterprise SaaS Public Comp Sheet 报告称，截至 2026 年 3 月 31 日，企业价值 / 过去 12 个月收入中位倍数降至
              3.3×，并把这一事件称为「SaaSpocalypse」。2026 年 Q1，SaaS 总市值约 $1 trillion 被抹去，触发因素是 Anthropic 2026 年 1 月发布 agentic AI
              平台，并叠加疲软盈利、关税波动和投资者对按席位定价模型的担忧。


              对照 Scandit 最后披露的 $119.1M ARR（2024 年 11 月），$1B Series D 标记意味着 8.4× ARR 倍数。这约为当前公开 SaaS 市场 3.4× 中位数的
              2.5×。即便给予慷慨的 AI-enabled 溢价（Finro Q1 2026 数据集显示，AI-enabled SaaS 私人 VC 约为 8–9× ARR；AI-native 为 21×），2022
              年标记也超过适用的 2026 年私人市场区间。对当前 $119.1M ARR 应用更合适的 6–8× 倍数，意味着 $715M–$953M 估值——实质低于上一轮 post-money。Kreos Capital
              风险债悬置（金额未披露，但 Scandit 这一阶段公司通常为 $15–50M）进一步降低隐含股权价值。任何在接近 2022 年估值标记进入、却没有确认 ARR 重新加速或验证 NRR 高于 115%
              的投资者，都是在相对当前市场条件接受负入场溢价。
