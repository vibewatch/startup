  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 因素
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 仓储 / 物流劳动力短缺
        - 加速因素
        - 当前，并持续至 2027 年以后
        - 仓库成本中 50–70% 是人力；年薪资增长 7–9%，让自动化 ROI 更有吸引力；Scandit 直接替代或补充人工扫描劳动力
        - Scandit 2024–2025 年新增客户中，有多少把劳动力成本列为首要驱动因素？定价如何反映扫描量与节省人头数的差异？
      - - 全渠道履约需求
        - 加速因素
        - 当前；2023–2028 年为建设高峰期
        - BOPIS 和门店发货要求实时库存准确率；推动门店层面的移动扫描采用；具备全渠道能力的零售商 CLV 高 30%
        - Scandit 零售 ARR 中，绑定全渠道履约项目的比例是多少，后台扫描占比又是多少？
      - - AI / 计算机视觉算法进步
        - 加速因素
        - 当前并继续扩张；AI in CV 到 2034 年 CAGR 为 17.89%
        - 在更低硬件成本下提升准确率；2026 年推出 Level 4 上下文条码扫描；扩大 ID 和货架智能用例；缩小与专用硬件的差距
        - 审查 Scandit SDK 8 路线图；确认 Level 4 上下文扫描交付时间表，以及 Zebra/Honeywell 的竞争回应
      - - 加固设备硬件更新周期
        - 约束
        - 5–7 年周期造成持续摩擦
        - 使用 Zebra/Honeywell 设备队列的企业客户已有原生扫描能力，会把 Scandit 评估推迟到硬件更新期；采用节奏因此呈阶梯式
        - Scandit 目标垂直行业中，Zebra/Honeywell 设备的估算装机基数是多少？2025–2028 年有多少设备进入更新窗口？
      - - 身份欺诈升级与监管强制要求
        - 加速因素
        - 当前；2026 年世界杯是近期催化剂
        - 2025 年 1/25 的欺诈率带来紧迫买方需求，推动 ID Bolt；EU AI Act 身份条款增加合规紧迫性；78% 旅客希望用单一设备管理旅程
        - 确认 Scandit ID Bolt 定价模型及其相对核心 SDK 的毛利率；评估身份验证量能否在多个客户处支撑 KLM 每月 500K 次扫描的规模
      - - 深度 SDK 集成带来的切换成本
        - 约束
        - 持续存在；有利于既有客户基础，也给新赢单制造摩擦
        - SDK 嵌入 WMS/TMS/ERP 定制应用后，替换时需要重新集成；这保护当前 ARR，但也意味着绿地企业客户的评估周期很长
        - 确认 Scandit 企业交易的平均成交周期；评估切换成本是否带来超过 110% 的净留存？
      - - 贸易关税与硬件供应扰动
        - 约束
        - 近期；2025–2026 年关税影响 GPU / 扫描仪硬件
        - Fortune BI 指出，对等关税扰乱 AI 硬件供应链，延迟大规模部署；这会影响本就受硬件约束的加固设备客户
        - 评估 Scandit 对硬件依赖型客户的敞口，这些客户可能在关税不确定期推迟部署
      - - 隐私监管与数据主权
        - 约束
        - 中期；GDPR/CCPA 执法 + EU AI Act 时间线
        - 身份验证和货架智能部署，在隐私敏感司法辖区要求本地数据处理；GDPR/CCPA 给采购增加合规审查步骤；可能限制市场准入
        - 确认 Scandit 的端侧边缘处理架构，是否完全满足 EU AI Act 高风险身份条款
    notes: >-
      方向是相对于 Scandit 增长轨迹而言：加速因素会提高采用率或交易速度；约束会拖慢部署、压低市场上限，或制造执行风险。时间为指示性判断，依据截至 2026 年 6
      月的公开市场情报。尽调问题需要数据室或管理层一手确认，公开资料无法解决。
