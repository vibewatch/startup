  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础构成、垂直行业切分与具名标杆
        blocks:
          - type: paragraph
            body: >
              截至 2026 年中，Scandit 首页披露 2,100+ 家企业客户、170 million+ 台活跃移动设备，并取得 ISO 27001 认证。公司开发者页面称，全球前十五大品牌中有九家的开发团队信任
              Scandit。这些汇总指标均由公司披露，未经过独立审计。Scandit 新闻稿中的样板文案——包括 2025 年 6 月 Walmart 续约和 2025 年 12 月 Dior 合作公告——持续把
              Instacart、Levi Strauss & Co.、Sephora、Lufthansa 和 FedEx 列为可信客户，由此形成跨垂直行业的可引用标杆客户组。casestudies.com 对 Scandit
              案例研究的列表列出数十个具名部署参考，覆盖零售（AEON、Alaska Airlines、Colruyt Group、Coop、Decathlon、METRO）、物流与配送（CDL Last Mile、DPD
              Russia、Helthjem、NACEX、PostNL、Rappi、Yodel）、医疗（Cardinal Health、ERS Medical），以及能源（Enphase
              Energy、SunPower）和消费应用（Shopkick、Yuka、Ibotta）等其他行业，反映出企业买家类型确实较广。

              按证据密度和公开参考数量估算，Scandit 的核心垂直行业是零售（具名案例研究约 50–60%）、运输与物流（约 20–25%）、医疗（约 10%），以及制造 / 现场服务 / 其他（约
              10–15%）。航空公司和航空出行（Alaska Airlines、Lufthansa）出现在样板文案和离散参考中，但具名群体更小。没有已发布的收入或 ARR 按垂直行业拆分可供验证。买方通常是技术或 IT
              负责人（CIO、产品副总裁、数字化总监），使用者是一线员工或消费应用终端用户，付款方是企业 IT
              或运营预算负责人。面向消费者的扫描应用（Shopkick、Ibotta、Yuka、Coop@home）构成一个独立细分，SDK 嵌入 B2C
              应用——在这些场景中，付款方是应用运营商，用户是零售购物者或会员计划参与者，续约和扩张动态不同于企业 B2B 部署。
