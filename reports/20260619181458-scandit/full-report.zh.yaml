        - 端侧处理；处理者而非控制者立场；隐私政策和服务条款披露；美国实体（Scandit Inc.）按美国法律框架运营
        - 低 —— 未发现 Scandit 专属 BIPA 或 CCPA 执法；风险主要由企业客户承担
