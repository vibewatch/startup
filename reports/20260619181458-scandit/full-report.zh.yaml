      - number: '1.2'
        title: 创始人、领导层和治理
        blocks:
          - type: paragraph
            body: >
              Scandit 三位联合创始人仍在一线领导岗位；以公司的成立时间和融资阶段看，这是一个值得注意的因素。CEO 兼联合创始人 Samuel Mueller 自 2009
              年创立以来一直领导公司，并继续担任主要战略和公开发言人；Series D 新闻稿、MarketLab 收购公告和 2025 年 6 月 Walmart 续约合作公告中的具名表述都印证了这一点。CTO 兼产品副总裁
              Christian Floerkemeier 负责技术路线图。CIO 兼工程副总裁 Christof Roduner 负责工程组织。创始团队在计算机视觉、ETH Zurich Auto-ID Labs
              研究和企业软件规模化方面积累很深，相比典型软件 scale-up 到增长阶段后创始人已离开的情况，这是实质差异化。


              三位创始人之外，公开可识别的高级领导团队包括 CFO Uwe Kraemer 和首席营销官 Natasha Sandoval。截至 2026 年中，公开资料未发现重大 C-suite
              离职或不利领导层变动。关键人集中度是合理的尽调点：Mueller 是每一轮融资和每项重大合作中具名的 CEO，三位创始人持续掌握技术领导权，也形成了差异化但集中的治理结构。


              Scandit 是一家 VC 支持的私营公司，并不公开披露详细董事会构成。Warburg Pincus（Series D 领投方）、Atomico（Series A、B、C、D 参与方）以及 G2VP、GV
              等其他 Series D 投资方预计会拥有董事会席位，但具体董事身份和治理机制无法从公开资料获得。这是一个尽调缺口，并在下方利益相关方表中明确标注。


              截至本章研究所覆盖的 2026 年，公开资料未发现涉及 Scandit 的诉讼、监管处罚、高管不当行为指控或重大治理争议。
