      - number: '2.2'
        title: 多重视角下的市场规模
        blocks:
          - type: paragraph
            body: >
              没有一份分析师报告能干净切分企业智能设备数据采集软件 SDK 厂商的精确收入，因此必须用几个互补视角估算市场。下方逐一说明每个视角的地理范围、年份、CAGR、方法基础和关键限制，也解释为什么无法宣称一个单一定论式
              TAM/SAM/SOM。

              视角 1 — 计算机视觉中的 AI（Fortune Business Insights，2026）：全球计算机视觉 AI 市场 2026 年估计为 $27.01 billion，预计到 2034 年达到
              $100.78 billion，CAGR 为 17.89%。北美占 32.47% 市场份额。该数字包括制造检测、自动驾驶车辆、医学影像和安防监控，因此显著高估了 Scandit
              的可服务市场，但确认底层计算机视觉投资存在大顺风。

              视角 2 — 企业条码扫描器和移动计算机（Market Growth Reports / Industry Research Biz，2026）：全球估算为 $2.9–3.5 billion，到
              2034–2035 年 CAGR 为 5.7–8.6%。该范围同时包括硬件（坚固型扫描器）和软件，但限定在工业 / 企业条码使用。零售占收入 40%；物流和运输占
              28%；医疗是该细分中增长最快的领域。限制：Zebra/Honeywell 的硬件收入占主导，Scandit 的软件授权收入只位于总量中的一个子部分。

              视角 3 — 移动条码扫描器应用（Business Research Insights / Cognitive Market Research，2026）：窄口径限定为移动和手持条码扫描的应用型软件；2026
              年估算约 $0.91 billion，CAGR 为 4.7–8.3%。这是最保守、但也可以说最直接可比 Scandit 核心 SDK 市场的代理指标。限制：排除了已经成为重要产品线的 ID
              Bolt、ShelfView 和 Label Capture。

              视角 4 — 仓库条码扫描器和系统（Verified Market Reports，2025）：2025 年全球仓库条码扫描器市场价值 $5.65 billion，到 2034 年 CAGR 为
              6.65%。该范围包括配送中心和仓库使用的固定及移动扫描器、RFID 集成系统和扫描软件。限制：混合了硬件和软件；过度代表 Scandit 不销售的固定安装硬件。

              视角 5 — 零售计算机视觉（Research and Markets，2026）：专门部署在零售领域的全球计算机视觉市场 2026 年估计为 $5.24 billion，以 23.8% CAGR 增长，到
              2030 年达到 $12.19 billion。它只代表零售垂直行业，但与 Scandit 的 ShelfView 和混合数据采集举措直接对齐。限制：单一垂直；不能与视角 2 相加。

              视角 6 — 医疗条码技术（MarkWide Research，2026）：医疗条码技术市场预计 2026 年达到约 $4.8 billion，到 2035 年 CAGR 为
              7–10.7%。床旁用药核验和患者识别是增长最快的应用。Scandit 在 NHS UK 的合作和 Johns Hopkins Hospital 部署（ch1）确认其参与该领域。

              矛盾很大。对大致相近空间的估算从 $0.9B 到 $27B 不等，取决于范围定义和分析师方法。与 Scandit 产品范围匹配的企业软件层数据采集中位估算 $3–5B
              最可辩护，但没有任何单一可信来源直接发布。投资人应把 $3–5B 视为来自上述视角的推断，而非已发布市场规模。Scandit 的 SOM——受其 $119M ARR 和 2,100+
              客户基础中预期渗透约束——在相关 SAM $3–5B、软件捕获率保守为 10–20% 的假设下约为 $0.4–0.8B。
