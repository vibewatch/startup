      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >
              企业数据采集交易中，买方、用户和付款方角色不同，且很少是同一个人。理解这层分工，是评估 Scandit 先落地再扩张模型和合同粘性的关键。

              零售是最大垂直行业，也是 Scandit 最强立足点。零售占全球条码扫描行业收入的 40%。买方是 IT 或数字化转型高管；用户是门店员工、仓库拣货员和自助结账顾客；付款方是企业 IT
              和运营预算。采用触发因素通常是全渠道履约计划、BOPIS（在线购买、门店自提）推出，或劳动力生产率项目。IHL Group 进行并发表于 Scandit 2026 年报告的研究发现，36%
              的零售商计划部署混合数据采集策略，另有 21% 计划在 24 个月内采用。已经采用混合数据采集的零售商，保持盈利能力领先的可能性高出 136%。

              物流、运输和邮政 / 包裹是第二大垂直行业，占条码扫描行业收入的 28%。买方是物流公司、末端配送承运商或邮政服务的运营或 IT
              负责人；用户是仓库工人、司机和分拣人员；付款方是运营预算，并用错误率和吞吐量直接衡量 ROI。Scandit 自有的 2026 Delivery Trends Report（与 Woop 联合撰写）量化了 AR
              引导末端配送运营的 ROI：装载错误减少 30%，每个站点每年节省超过 $500,000。FedEx、DHL、La Poste 和 Swiss Post 是具名客户（ch1 引用）。

              医疗买方是医院 IT 部门和药房采购团队；用户是护士、药剂师和临床支持人员；付款方是医院系统，在受监管市场中还包括要求用药扫描以满足合规的报销系统。医疗条码技术是约束更强的买方细分之一，因为 IT
              采购周期很长，监管合规要求（美国 FDA UDI、欧盟 MDR 可追溯性）在切换的两个方向都形成壁垒。NHS UK 和 Johns Hopkins Hospital 是具名部署。

              航空出行和身份验证是快速增长的相邻细分。航空公司和机场运营商是买方；一线登机口工作人员、值机人员和移民官员是用户；运营预算和 IATA / 政府强制合规是付款方。KLM 每月通过 Scandit ID Bolt
              处理约 500,000 次身份证件扫描。Air France-KLM 部署 Scandit 以允许旅行文件预验证，避免拒绝登机并降低财务罚金。Scandit 将 2026
              年世界杯出行潮识别为身份验证解决方案的近期需求催化剂。

              现场服务和制造是采用较慢的细分。Scandit 在这里的客户包括部署检查和资产管理工作流的公司。买方通常是 IT 或设施经理；付款方是运营预算。采用触发因素通常是具体工作流数字化项目，而不是战略性平台决策。

              跨所有垂直行业，先落地再扩张模式（ch1 已记录）意味着初始交易规模低估了总合同潜力：一家零售客户先用 Scandit 做 BOPIS 拣货，之后可能扩展到自助结账、货架智能和供应链接收。按 $119M ARR
              / 约 2,100 家客户推算，平均 ACV 约为 $57K，但分布向大型企业合同倾斜，顶部达到 $100K–$500K+。
