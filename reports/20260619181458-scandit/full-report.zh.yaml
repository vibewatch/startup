      - number: '8.3'
        title: 牛市 / 基准 / 熊市情景分析与估值区间
        blocks:
          - type: paragraph
            body: >
              到 2026 年中，Scandit 的投资判断可以用三种情景框定。每种情景对应不同的 ARR 轨迹和倍数假设，也对应核心不确定性的不同答案：2024 年 11 月的 $119.1M
              ARR，究竟是可持续拐点，还是一次性跃升、之后会回落到此前增速。


              牛市情景下，Scandit 2024 年 ARR 从 $35M 提升到 $119.1M，约增长 240%，这一加速是真实的，并以更温和的节奏延续——年增速约 30–40%，到 2026 年底 ARR 达到
              $150–165M。Walmart 2025 年 6 月续约 1.3M 名门店员工、企业平台继续扩张，以及 ShelfView/MarketLab 平台完成爬坡，都支持这一情景。如果 NRR 确认为
              120%+，且平台被重新归类为 AI-enabled 企业软件，10–12× 倍数可以实现。这意味着牛市估值为 $1.5B–$2.0B；若 SAP、Salesforce 或 Zebra 等收购方希望扩大
              software-only ARR 底座，战略并购退出还可能给出更高溢价。在这一情景下，现有投资人账面回本，2022 年估值也得到验证。


              基准情景下，ARR 较 2024 年 11 月数字小幅增长，到 2026 年中约为 $125–140M。Scandit 高于中位数的效率和利基平台深度，部分抵消了倍数压缩。以 $130M ARR 和 6–8×
              倍数计算，基准估值为 $780M–$1.04B——围绕 $1B 关口上下波动，两侧都有实质不确定性。若新一轮 primary round 按 7× $130M 定价，估值约 $910M（较 $1B
              持平到下调），意味着持平轮或小幅 down round。在这一情景下，Warburg Pincus 在区间低端接近账面盈亏平衡，在高端略有账面收益。


              熊市情景下，2024 年 ARR 数字被部分高估，或包含不可重复收入，反映的是集中大单事件（如 Walmart 扩张、大型一次性企业交易），之后无法复制。到 2026 年，ARR 回归到 $100–115M；受
              2026 年 Q1 市场重估影响，SaaS 倍数仍压在 3–5×。这意味着熊市估值为 $350–575M——显著低于 $1B Series D 标记；任何新的 primary capital 都会对应大幅
              down round，Series D 投资人也会出现实质账面损失。在这一情景下，Kreos Capital 债务悬顶会在退出分配瀑布中变得重要。


              各情景概率受披露缺口牵引：没有经审计 ARR、已确认 NRR 和 cohort 数据，熊市情景无法排除。分析师建议是在获得 data room 权限前，以基准情景作为工作假设；鉴于当前公开市场参照倍数只有
              3.4×，不建议按 2022 年 $1B+ 标记买入。
