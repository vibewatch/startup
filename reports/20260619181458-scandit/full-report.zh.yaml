      - number: '2.4'
        title: 增长驱动和采用约束
        blocks:
          - type: paragraph
            body: >
              企业智能数据采集的需求前景总体积极，但几项结构性约束会调节采用速度和总市场天花板。

              最强增长驱动是仓储和物流持续劳动力短缺。估计 50–70% 的仓储成本与劳动力有关，2024 年仓库工资同比上涨 7–9%。截至 2024 年，全球只有 25%
              的仓库部署了任何形式的自动化；主要受劳动力成本压力推动，预计到 2027 年超过 75% 的公司将部署 cyber-physical
              systems。任何能减少每次扫描人工投入、降低错误或加快员工上手的工具，都会争夺这笔自动化预算。

              第二个驱动是全渠道履约需求。超过 80% 的零售销售仍发生在实体门店，但消费者对 BOPIS、当日达和门店发货的期待要求实时、准确的店内库存数据。这为移动扫描基础设施创造了结构性需求，并与 Scandit
              核心产品对齐。获得完整全渠道能力的零售商，相比单渠道竞争者，客户生命周期价值高 30%，留存率高 90%。

              第三个驱动是嵌入商品化硬件的 AI 和计算机视觉算法成熟。Fortune Business Insights 预计计算机视觉 AI 市场到 2034 年将以 17.89% CAGR 增长；Nvidia 2025
              年对“physical AI”的背书，也加速了机构对智能物理世界感知时代正在到来的理解。摄像头性能和移动 SoC 算力提升后，专用坚固型扫描器与消费级硬件上的软件之间差距缩小，结构性扩大了 Scandit
              的可服务安装基础。

              第四，AR 引导工作流 ROI 已从猜想变成实证。Walmart 与 Scandit 的部署被描述为截至 2025 年可能是全球最大的商业 AR 部署。Dior 在物流中使用 AR，将发货控制时间减少
              85%。AR 引导末端配送使装载错误减少 30%，每个站点每年节省超过 $500,000。量化 ROI 会加快企业采购周期，并减少从试点到生产的摩擦。

              第五个驱动是身份欺诈上升和监管强制要求。2025 年，每 25 次验证尝试中就有 1 次涉及欺诈，高质量假证件现在可在线以低于 $10 的价格买到。这为每一个物理触点的 AI
              身份验证创造了紧迫买方需求——机场登机、酒店入住、年龄限制零售、医疗登记。Scandit 的 ID Bolt 产品直接覆盖这一需求。

              采用约束同样重要。最显著的是切换成本：Scandit 的 SDK 深度嵌入企业工作流应用（WMS、TMS、ERP 扩展、自定义移动应用）。替换它需要重新集成、重新测试、重新认证这些应用，形成多年切换周期；这有利于
              Scandit 守住存量安装基础，但也让新客户评估周期拉长。只有 15% 的零售领导者称已充分发挥现有全渠道系统价值，反映出技术债很深，复杂化了新部署。

              第二个约束是坚固型设备更新周期。运营大规模 Zebra 或 Honeywell 设备队列的企业客户处在 5–7
              年硬件更新周期。这些设备具备原生条码扫描固件，不需要软件授权就能满足基础扫描需求；在重大硬件更新触发评估之前，切换到 Scandit 的成本并不低。

              第三个约束是定价结构。独立评论和竞争分析指出，Scandit 基于用量的按扫描或按设备定价，可能让高频扫描部署担心成本可预测性。较小运营商和预算受限团队可能评估开源替代品（ZXing、ZBar）或成本更低的商业
              SDK（Scanbot、Dynamsoft）；这些方案达不到 Scandit 的性能，但能满足较低要求。

              第四个约束是身份验证中的监管摩擦。GDPR、CCPA 以及新兴 EU AI Act 中关于自动化身份处理的条款，带来了合规要求，会拉长 ID
              扫描部署的企业采购周期。隐私敏感司法辖区要求本地数据处理或特定同意机制，限制了身份验证工作流的跨境标准化。贸易关税带来的国际供应链扰动，也给依赖坚固型设备的客户带来硬件可用性不确定性。
