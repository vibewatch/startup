      - number: '1.3'
        title: 融资历史、估值和投资人图谱
        blocks:
          - type: paragraph
            body: >
              自 2013 年以来，Scandit 至少完成六轮机构融资，累计募集约 $273M 至 $300M，使其成为全球资本最充足的纯软件移动数据采集公司。LATKA 数据库、Tracxn、Seedtable
              等多个来源报告的总融资额为 $273M；Series D 新闻稿称当时累计融资额“接近 $300 million”，反映了此前未披露金额的四舍五入以及早期 pre-Series A 工具的纳入。


              融资路径记录清晰：2014 年早期 $5.5M pre-Series A；2017 年 1 月由 Atomico 领投 $7.5M Series A；2018 年 7 月由 GV 领投、Atomico 和 NGP
              Capital 参投 $30M Series B；2020 年 5 月由 G2VP 领投，Salesforce Ventures、Swisscom Ventures、Atomico、GV、Kreos 和 NGP
              Capital 参投 $80M Series C；以及 2022 年 2 月旗舰 $150M Series D，由 Warburg Pincus 领投，Atomico、Forestay
              Capital、G2VP、GV、Kreos、NGP Capital、Schneider Electric、Sony Innovation Fund by IGV1 和 Swisscom Ventures
              参投。Series D 将公开估值定在超过 $1 billion，使公司获得独角兽身份。


              从 2022 年 2 月 Series D 交割到 2026 年 6 月研究日之间，未发现后续一级融资轮、公开披露的二级交易、估值变化或债务工具。因此，2022 年 $1B+
              估值仍是公开可支持的最新数字；不过，公司报告 ARR 从 2023 年末约 $35M 增长到 2024 年末 $119.1M，提示当前业务基本面可能支撑更高估值。该推断没有已披露交易佐证，应作为尽调缺口处理。


              Atomico 从 Series A 到 Series D 连续参与每一轮机构融资，是持有时间最长的机构投资人。Warburg Pincus 作为 Series D 领投方，是最近且单笔最大支票的投资人，AUM
              超过 $73 billion，并拥有 B2B 软件 scale-up 投资记录。投资人基础同时包括战略企业投资者（Schneider Electric、Salesforce Ventures、通过合作关系隐含的
              Samsung、Swisscom Ventures）和财务赞助方（Warburg Pincus、Atomico、G2VP、GV、NGP Capital、Forestay
              Capital），形成了多元的利益相关方组合。
