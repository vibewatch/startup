      预算负责人和付款方常常不是同一人：零售场景里，运营副总裁批准商业案例，但 IT 掌握合同。医疗健康场景里，IT 管供应商关系，但药房或合规团队必须做内部 sponsor。这会影响 Scandit 的
      land-and-expand 路径：最初的技术拥护者（应用开发者或解决方案架构师）可能不是经济买方，销售周期因此拉长。
