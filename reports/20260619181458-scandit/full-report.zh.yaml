          - type: callout
            title: 设备端架构从结构上限制云 COGS
            body: >-
              不同于按 API 调用收费、并需要大量后端算力在服务器端处理每张图片的云端计算机视觉 API，Scandit 完全在设备端用设备自有算力运行推理。这意味着 Scandit 不会按扫描量成比例支付云基础设施
              COGS——每年 800 亿次条码扫描，不会变成 800 亿次计费给 Scandit 的云计算事件。该架构从结构上支撑 75–82% 区间的毛利率；这个水平对云 API 来说异常低，但对设备端 SDK
              公司是合理的。
