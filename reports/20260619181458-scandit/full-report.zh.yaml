      - number: '6.5'
        title: 集中度风险、负面证据与尽调缺口
        blocks:
          - type: paragraph
            body: >
              最显著的集中度风险是 Walmart。虽然没有披露收入占比，但 Walmart 在美国 1.3 million 名员工中的部署——相比披露的 2,100
              家企业客户总数——几乎必然贡献了不成比例的收入。Walmart 续约失败、重新议价或决定内部自建，都会构成重大负面事件。没有其他具名客户接近可比的已披露部署规模。第二梯队参考（Shipt 的 89K
              台设备、Swiss Post、Staples Canada）规模可观，但收入体量更小。FedEx 和 Lufthansa
              出现在所有新闻稿的样板文案中，但两者既没有独立案例研究，也没有具名高管引述，留下一个问题：这些究竟是活跃且有合同承诺的生产关系，还是历史性或间接参考。

              客户数量声明（2,100+）完全由公司自报。「企业客户」没有定义——可能包括免费试用转化、长尾 SMB 部署或非活跃账户。170 million 活跃设备数字同样缺少「活跃」的独立定义。80 billion
              年扫描量无法用第三方使用数据交叉核验。第三方评论很薄：G2 只有 13 条评论（4.2/5），PeerSpot 显示定价透明度和集成复杂性是反复出现的投诉主题。IHL Group 研究（2025 年 10 月）由
              Scandit 共同委托，削弱了其对 Scandit 自身市场位置声明的独立性。没有已发布尽调披露合同期限、平均合同价值、收入集中度比例，或企业客户基础的 cohort
              数据。这些缺口需要在尽调过程中由管理层直接披露。
