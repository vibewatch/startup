  - id: FR001
    title: 风险严重度热力图 — 按风险类别比较发生可能性与影响
    type: matrix
    layout: wide
    summary: 定性风险热力图把每项已识别风险放到当前缓释后的发生可能性（列）和剩余影响（行）中。高严重度风险集中在技术商品化、Walmart 集中度和估值重估单元格。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 高剩余影响
          values:
            - 监管（若 ID Bolt 被归为高风险，则适用 EU AI Act Annex III；推迟至 2027 年 12 月）
            - Walmart 客户集中度（>10% ARR 未确认）；估值 down-round 风险
            - 平台 API 依赖（Apple / Android 破坏性变更）；CEO / CTO 关键人离职
        - label: 中等剩余影响
          values:
            - 专利 IP 主张（HHP 案已结；未来 Honeywell / Zebra 仍可能主张）
            - GDPR 透明度执法（企业客户在 2026 年面临更高审查）；Warburg Pincus 流动性压力
            - 基准性能差距（受损 PDF417、旋转条码）；被免费 SDK 竞争替代
        - label: 低剩余影响
          values:
