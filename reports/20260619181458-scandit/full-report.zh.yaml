      - number: '5.4'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >
              Scandit 的核心信任姿态围绕设备端数据处理：默认标准 SDK
              配置下，所有图像分析、条码解码和身份文件提取都在本地设备完成，没有图像或个人数据传输到外部服务器。设备上不存储个人数据；任何传输数据都会在传输中和静态存储时加密。这一架构通过最小化数据暴露，并避免云处理触发的同意和数据传输义务，简化了客户的
              GDPR 和 CCPA 合规。


              Scandit 公开声称获得 ISO 27001:2022 信息安全管理认证，并有多个官方产品页面引用佐证。该认证需要独立第三方审计和持续维护；认证覆盖 Scandit 的组织安全实践，而不是单个 SDK
              部署。公开来源中未识别到 SOC 2 Type II 鉴证或 FedRAMP 授权，这可能是美国联邦或高度监管金融行业部署的缺口。


              身份扫描方面，ID Validate 的欺诈检测在设备端运行，无需互联网连接。当前范围仅限美国驾照和州身份证；国际文件类型不包含在真实性检查能力内，尽管 ID Scan（仅数据提取）支持 2,500+
              国际文件类型。ID Validate 的这一地理限制，是国际旅行、酒店和 KYC 用例的实质性尽调缺口。ShelfView 会为货架图像分析引入云处理步骤；在 EU ShelfView 部署中，必须审查
              Scandit 隐私条款中的数据主权安排。
