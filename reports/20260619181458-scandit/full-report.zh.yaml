      - number: '6.4'
        title: 留存、扩张与先落地再扩张信号
        blocks:
          - type: paragraph
            body: >
              Scandit 对外表述的 go-to-market 理念围绕先落地再扩张模型：客户先在一个高价值工作流采用平台，再扩展到相邻用例、地区或用户群。这一模式在多个具名账户中有直接证据。Staples Canada
              从三家门店的价格审计试点起步，扩展到 298 家门店的 1,200 台 iPhone，未来计划扩展到店后收货、循环盘点和全渠道履约。Artivion 从北美销售代表的寄售扫描起步，同一年扩展到全部 70 名
              EMEA 代表。Dior 部署 MatrixScan Count 用于发运控制，并被明确描述为未来扩展到全球所有运行 Hardis WMS 的 Dior 配送中心的基础。Walmart 关系自 2022
              年启动，并在 2025 年 6 月正式续约，扩大范围覆盖更多员工和面向客户的应用——这是公开记录中最直接的多年期企业续约事件。

              Scandit 未公布 NRR、GRR、客户 cohort 留存或 logo 流失率。自报的 98% NPS 是唯一公开满意度指标，也缺少验证。G2 有 13 条评论，平均 4.2/5；对于一家 2,100
              客户规模的公司，这个样本很小。PeerSpot 显示，用户报告中最主要的小型或预算受限买家障碍，是定价不透明且偏高。Futurum Group 对 Scandit Empower 2024
              的独立分析指出，Smart Data Capture Awards
              获奖者持续强调「真实世界、有影响力的结果」，并把其部署描述为更大数字化转型项目中的步骤——这意味着一种粘性、多阶段的互动模式，而不是交易性许可证关系。IoT M2M Council 和 Retail
              Systems 对 Walmart
              续约的第三方报道佐证了商业关系的多年期性质。研究中未发现大规模流失、具名账户部署失败或系统性转向竞争对手的证据。主要负面信号是第三方评论中的定价不透明，以及缺少已发布的留存指标。
