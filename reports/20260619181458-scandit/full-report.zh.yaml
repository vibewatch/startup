  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 硬件既有扫描器厂商及其 SDK 策略
        blocks:
          - type: paragraph
            body: >
              三大硬件既有条码扫描器厂商——Zebra Technologies、Honeywell Productivity Solutions and Services（正被剥离给 Brady Corp）和
              Datalogic——合计持有全球企业条码扫描器硬件收入约 60%。三家公司都提供嵌入各自设备生态的专有软件 SDK，这些 SDK 既是硬件的竞争护城河，也是 Scandit
              以纯软件模式进入硬件忠诚型企业账户时面临的结构性障碍。


              Zebra Technologies 是无可争议的硬件领导者，FY2025 净销售额 $5.40 billion（同比增长 8.3%），在企业条码扫描器全球市场份额估计为 25–28%。Zebra 的免费
              DataWedge 配置工具和 EMDK 开发工具包深度嵌入企业设备生命周期：DataWedge 在基础条码集成上无需编码，并能把扫描数据路由到任何 Zebra 托管应用且不产生额外授权成本。对运营大规模
              Zebra 设备队列的企业来说，这些工具消除了商业 SDK 在基础扫描用例中的增量价值主张。Zebra 于 2025 年 10 月以 $1.3 billion 收购 Elo Touch
              Solutions——Zebra 估计该交易把可服务市场扩大 $8 billion——这表明公司正加速转向软件驱动的一线体验，包括 AI agents、自助服务亭和互动零售工作流。Zebra FY2025 的
              R&D 投入为 $593 million（占净销售额 11%），确认其将持续在软件层竞争。融合风险是真实存在的：随着 Zebra Workcloud 平台成熟，标准化使用 Zebra 硬件的企业可能无需采购第三方
              SDK，也能获得足够的工作流功能。


              Honeywell 的 Productivity Solutions and Services 业务（移动计算机、条码扫描器、打印解决方案）2025 年收入约 $1.1 billion，约占企业条码扫描器市场
              18–22%。2026 年 4 月，Honeywell 宣布同意以 $1.4 billion 现金将 PSS 出售给 Brady Corporation，预计 2026 年下半年交割。Brady
              是识别和安全产品制造商，并非规模化技术平台公司。该所有权变化带来实质战略不确定性：Honeywell Operational Intelligence (Oi) 是 Honeywell
              设备队列的软件管理平台，正按 Honeywell 技术路线图主动集成 AI 功能（异常检测、自动化引擎），但在 Brady 旗下的后续开发轨迹并不清晰。对 Scandit 而言，如果
              Honeywell/Brady 企业客户面对软件平台连续性问题并评估替代方案，剥离可能创造近期机会。不过，Honeywell Operational Intelligence
              产品会继续作为设备队列管理和分析层竞争；它虽不是直接条码 SDK 竞争对手，却占用同一类企业 IT 预算。


              Datalogic 在 Borsa Italiana 上市，总部位于意大利博洛尼亚，报告 2025 年上半年收入 €241.1 million（同比下降 1.5%），预计 2025 全年收入大体与 2024 年
              €493.8 million（约 $532 million）持平。Datalogic 在条码扫描器和移动计算机合并品类中持有约 20% 全球市场份额，在 EMEA 尤其强。2025 年 4 月，Datalogic
              收购 Datema Retail Solutions AB（EasyShop 软件制造商），显示其正向软件增强数据采集推进。Datalogic 主要靠硬件能力竞争（Memor 移动计算机、PowerScan
              固定读取器）和嵌入式固件竞争——其软件层不具备 Scandit 的 AR 能力，但足以为标准化使用 Datalogic 硬件的客户提供合格条码性能。
