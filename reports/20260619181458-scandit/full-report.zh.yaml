  - id: FU001
    title: 客户旅程地图——从认知到多工作流扩张
    type: journey-map
    layout: wide
    summary: Scandit 客户旅程经历五个阶段：发现与评估、试点部署、生产上线、多工作流扩张、战略合作。公开证据中的具名客户示例确认了每个阶段。 该旅程图突出支撑 Scandit 商业模型的落地后扩张机制。
    data:
      nodes:
        - id: stage-discovery
          label: 发现与评估
          detail: >-
            IT 或数字化转型负责人识别条码 / ID 扫描需求。Scandit 试用（30 天免费试用）或 SDK 评估。 与开源方案（ZXing、Google ML
            Kit）或硬件厂商（Zebra、Honeywell）做基准对比。按 Scandit SDK 文档，首次扫描的中位时间低于 1 小时。
          segment: IT / 数字化买方
          tone: neutral
        - id: stage-pilot
          label: 试点部署（1–3 家门店 / 站点）
          detail: >-
            单站点或小范围试点。Scandit 提供试用、方案设计、集成和 CS 支持，且包含在内。Staples Canada：3 店试点。 Artivion：2023 年 3 月测试，2023 年 7
            月部署。Shipt：COVID-19 需求激增期间并行评估 SDK。 OK Corporation：3 个月建成线上超市应用。
          segment: IT + 运营买方
          tone: positive
        - id: stage-production
          label: 生产上线
          detail: >-
            向目标员工群体或客户基础全面部署。Staples Canada：全部 298 家门店、1,200 部 iPhone。Swiss Post：全国最后一英里部署。Leeds NHS：所有病房。Shipt：89K
            月活设备。OK Corporation：全部 135 家门店。
          segment: 企业全域
          tone: positive
        - id: stage-expand-workflow
          label: 多工作流扩张
          detail: >-
            从试点用例扩展到邻近工作流。Staples Canada：前场定价 → 后场收货和循环盘点。Artivion：北美 → EMEA，1D → 2D 条码。 Dior：一个仓库 → 全球所有 Hardis WMS
            DC。OK Corporation：拣货 → POP/价签管理。
          segment: 跨职能
          tone: positive
        - id: stage-strategic
          label: 战略合作
          detail: >-
            正式续约并扩大商业关系。Walmart：2025 年 6 月续约，并扩大范围，覆盖更多员工和面向客户的应用。 公告中 Scandit CEO 与 Walmart VP Product
            同时被引用。Dior：计划全球铺开。
          segment: 高管层 / VP 层级
          tone: positive
        - id: stage-risk-exit
          label: 流失 / 竞争替代（负面）
          detail: >-
            公开记录中未发现具名客户流失事件。G2/PeerSpot 评论中的定价抱怨，可能影响预算敏感型或 SMB 买方。 Honeywell Mobility Edge、Zebra
            Software/DataWedge，以及开源 ZXing/MLKit，对成本敏感或硬件捆绑部署构成竞争风险。
