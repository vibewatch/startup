  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 规则 / 案件 / 敞口
      - 司法辖区
      - 截至 2026-06-19 的状态
      - 可能性
      - 严重性
      - 缓释措施
      - 剩余敞口
      - 尽调路径
    enumerationScope:
      coverage: exhaustive
      basis: >-
        All publicly identified legal proceedings, regulatory obligations, and enforcement risks affecting Scandit AG as
        of June 2026, drawn from UPC case records, US court filings, GDPR/EU AI Act regulatory timelines, and public
        Scandit compliance disclosures.
    rows:
      - - HHP/Honeywell UPC 专利 PI（EP 3 866 051）
        - EU（UPC —— 德国）
        - 已结案：HHP 于 2025 年 3 月撤回临时措施；UPC CoA 于 2025 年 4 月正式结案。未作出最终侵权认定。
        - 低（已解决）
        - 中 —— 曾授予初步禁令，并要求修改 SDK
        - HHP 撤回使 PI 失去实际意义；BarcodeTrackingAdvancedOverlay 风险已计入产品；Scandit 要求 €500k 诉讼费用担保获支持
        - 低 —— 仍在持续；Honeywell 未来仍可能在主程序中主张基础 EP 051
        - 获取 Scandit 法律顾问关于主程序状态和任何和解条款的简报
      - - HHP/Honeywell 美国专利诉讼（1:24-cv-11027，N.D. Illinois）
        - 美国（联邦）
        - 已结案：HHP 于 2025 年 3 月 14 日自愿有偏见撤诉；无侵权认定；无损害赔偿。
        - 低（已解决）
        - 低 —— 有偏见撤诉阻止其就同一行为再次主张同一专利
        - 有偏见自愿撤诉构成永久阻却；Scandit 不承担本案责任敞口
        - 极小 —— 诉讼涉及 5 项美国专利，已撤诉。其他未纳入本案的 Honeywell/HHP 专利仍有风险
        - 通过 Scandit 法务团队确认是否仍有其他 HHP/Honeywell 美国专利被主张
      - - EU AI Act —— 高风险生物识别系统义务（Annex III）
        - EU
        - 原定 2026 年 8 月 2 日；Digital Omnibus 临时协议（2026 年 5 月 7 日）将独立高风险推迟至 2027 年 12 月 2 日；尚未正式成为法律
        - 中 —— 延期条款已临时达成，但尚未立法
        - 高 —— 若 ID Bolt/ID Validate 被归类为高风险，Scandit 的企业客户将面临风险管理、数据治理、人工监督和透明度义务
        - 端侧架构；Scandit 是数据处理者而非控制者；ISO 27001:2022；GDPR 合规计划
        - 中 —— Omnibus 延期仍待正式采纳；即便延期后，边境、就业、基本服务等场景中的客户若用 ID 扫描做生物识别，仍在适用范围内
        - 确认 Scandit 对 ID Bolt/Validate 产品相对于 EU AI Act Article 6 和 Annex III 定义的法律分类；获取面向客户的合规指引
      - - GDPR 特殊类别数据（ID 扫描 —— 生物识别数据）
        - EU/EEA 和英国
        - 已生效并执行；EDPB 2026 年协同执法行动聚焦透明度义务（Articles 12–14）；未发现针对 Scandit 的 GDPR 行动
        - 中 —— 使用 ID 扫描的企业客户在 2026 年面临更高透明度审查
