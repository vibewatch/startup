      - number: '5.6'
        title: 图表
        blocks:
          - type: callout
            title: 端侧架构是真正的技术和商业差异点
            body: >-
              所有图像分析都在设备边缘完成——不传输图片、不调用云端，也不依赖 Google Play Services——这不只是营销说法。该架构让 Zebra、Honeywell 等坚固型企业 Android
              手持设备可以优先离线部署，否则这些设备会需要 Google 服务；同时，它通过消除传输中数据义务简化 GDPR 合规，并在任何网络质量下都交付低于 200ms 的扫描延迟。NHS 测试点（每日 1.2M
              次扫描）、Walmart（1.3M 名员工）和 FedEx（全球包裹追踪）的参考部署直接验证了这项架构优势。
            calloutType: strength
            claimRefs:
              - CE003
              - CE016
              - CE035
          - type: callout
            title: Web SDK 在静态图片批量解码中相对 Dynamsoft 存在有记录的性能差距
            body: >-
              Dynamsoft 发布的基准测试（四个 Web SDK、83 张真实图片、默认配置）显示，Scandit 的 Web SDK 检出 178 个唯一条码，Dynamsoft 为 292 个；Scandit
              平均每张图片耗时 11,210ms，Dynamsoft 为 278ms。Dynamsoft
              自己声明，这些结果不代表实时摄像头模式性能，因为各厂商会独立调优。尽管如此，任何面向批量扫描或静态图片处理场景（如文档接收、电商上架）部署 Web SDK 的企业，都要面对这个差距。Scandit
              的预构建摄像头模式组件（SparkScan、MatrixScan）面向实时视频流设计，表现可能不同，但同一组 SDK 之间尚无已发布的摄像头模式性能直接对比测试。
            calloutType: risk
            claimRefs:
              - CE027
              - CE036
          - type: callout
            title: ID Validate 仅限美国证件——这是国际部署的硬约束
            body: >-
              截至 2026 年 6 月，ID Validate 的伪造和真实性检测范围只覆盖美国驾照和州身份证。国际用例——航空旅客身份核验、欧洲 KYC、APAC 配送司机入职——可以用 ID Scan 提取数据，但不能用
              Scandit 在设备端验证真实性。这给 Scandit 拥有大量国际运营的垂直行业留下产品缺口。ID Validate 的国际扩展不在已声明的 2026 年路线图中；近期只标出了 ID Bolt +
              Validate 的 Web 集成。
            calloutType: risk
            claimRefs:
              - CE011
              - CE040
          - type: callout
            title: ShelfView 把 Scandit 定位成物理 AI 平台，而不只是 SDK 供应商
            body: >-
              IHL Group/Scandit 研究（2025）把货架智能定义为「战略必需项」；处于利润增长模式的零售商在库存可视性上的投资高出 208%。Scandit 把 MarketLab 的固定摄像头 IP
              与移动端、机器人采集模式结合，正在把 ShelfView 定位为持续性分析平台——不是一次性 SDK 集成。零售客户的收入模型因此从许可证费用转向平台订阅，并打开 CPG 变现和门店员工绩效分析等相邻机会。
            calloutType: insight
            claimRefs:
