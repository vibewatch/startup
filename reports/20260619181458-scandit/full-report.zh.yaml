          value: Stretched
          detail: 当前 ARR 的 8.4× vs SaaS 中位数 3.4×；2.5× 溢价；基本情形公允价值 $780M–$1.04B
          tone: negative
        - label: 退出准备度
          value: Limited near-term
          detail: IPO 市场关闭；2026–2029 年 M&A 可行；Warburg Pincus 持有 4 年（进入目标窗口）
          tone: neutral
        - label: 战略价值
          value: High
          detail: Zebra / SAP / Honeywell / Salesforce 收购逻辑强；23+ 专利；深度企业集成
          tone: positive
        - label: 证据质量
          value: Insufficient for buy
          detail: 公开来源确认平台实力；财务验证需要 data-room 访问
          tone: negative
    approximationNotes: 语气评级仅反映分析师对公开证据的判断。若 data-room 尽调验证 ARR、NRR 和 cohort 数据，收入质量和财务透明度很可能上调至 Confirmed / Adequate。
