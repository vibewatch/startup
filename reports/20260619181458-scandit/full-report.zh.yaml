            title: Kreos Capital 风险债条款未披露
            body: >-
              Kreos Capital 是专业风险债提供方，现由 BlackRock 持有，同时出现在 2020 年 Series C 和 2022 年 Series D 投资人名单中。Kreos
              通常为高增长科技公司在股权轮同时安排非稀释性债务额度。Scandit 任何 Kreos 额度的规模、利率、期限和契约条款均未公开。债务服务义务和任何财务契约，可能在公司四年多没有新增主股权时限制其灵活性。
            calloutType: risk
