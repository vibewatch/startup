      - number: '4.3'
        title: 成本结构、单位经济性和毛利率代理
        blocks:
          - type: paragraph
            body: >
              Scandit 未公开披露毛利率，但其设备端软件架构给估算提供了基础。SDK 原生运行在设备上，使用设备自身算力——它不会把视频流传到云后端处理，因此消除了云原生计算机视觉业务最大的可变 COGS
              驱动项。Scandit 的 COGS 主要包括许可和遥测层的云基础设施、客户支持和成功工程、可归因于交付的 R&D 摊销，以及部分与企业导入和集成有关的专业服务成本。基于此，Scandit 毛利率应落在
              75–82% 区间，与企业 SaaS 约 76% 的中位数（CloudZero 2025）一致，并接近纯软件交付模型的高端。


              Benchmarkit 2025 年覆盖 1,000 多家公司的私有 SaaS 基准调查显示，在 >$100M ARR 层级，每名全职员工（FTE）对应 ARR 的中位数约为 $300,000。Scandit
              隐含 ARR/FTE 为 $327K（$119.1M / 截至 2025 年 11 月约 364 名员工），略高于其 ARR 组别中位数，是一个正向效率信号，尤其是在员工数已从 2022 年 12 月峰值 553
              人收缩之后。


              Benchmarkit 2025 调查显示，VC 支持的私有 SaaS 公司销售和营销费用通常占收入 40–47%。以 Scandit 的 ARR 规模看，扩张 ARR 占新增 ARR 超过 50%（>$50M
              ARR 公司常见行业基准模式），因此混合 CAC 效率会明显好于单看新标识客户 CAC。Scandit 未披露 CAC 或回本周期指标；唯一代理是其 58 人销售团队（据 Highperformr.ai
              员工数据）对应 $119M ARR，隐含每名销售员工约 $2M ARR，对企业 SaaS 来说健康。


              净收入留存同样未披露，但可用基准估算。ACV 高于 $100K 的企业 B2B SaaS 公司 NRR 中位数为 118%，前四分位超过 130%（Optif.ai 2026，N=939 家公司）。Scandit
              的落地扩张架构——客户通常随时间增加工作流、产品模块、设备或地域——在结构上适合产生席位扩张和追加销售，从而驱动企业 SaaS 的高 NRR。联合创始人在 2025 年 12
              月访谈中确认，落地扩张模型仍是增长核心。不过，没有公司数据室中的队列级收入数据，NRR 无法确认。


              R&D 投入很大且不可选。要维护跨 20,000+ 设备型号的兼容性（联合创始人在 2025 年 12 月访谈中确认），在不断变化的竞争环境中推进 MatrixScan、ID Validate 和
              ShelfView 能力，并把 AI/ML 集成进平台，都需要持续工程投入。Benchmarkit 基准显示，私有 SaaS 的 R&D 约占收入 34%；按 Scandit 当前 ARR 计算，意味着年度
              R&D 支出约 ~$40M。实际支出未确认。
