      - number: '8.2'
        title: 可比估值分析——ARR 倍数、公开可比公司与 M&A 基准
        blocks:
          - type: paragraph
            body: >
              四个估值视角适用于 Scandit：（1）公开 SaaS 中位倍数作为底部参考；（2）工业计算机视觉公开可比公司（Cognex、Zebra Technologies）作为战略同业；（3）近期 M&A 数据中的私人
              SaaS 交易倍数；（4）多公司数据集中的 AI-enabled / 计算机视觉溢价区间。每个视角给出的隐含价值范围不同，加权解读后定义 Scandit 适用的倍数走廊。


              Cognex Corporation（CGNX）是全球工业机器视觉领导者，FY2025 收入 $994M，截至 2026 年中企业价值约 $11B，意味着过去 12 个月 EV/revenue 倍数约
              11×。Cognex 毛利率约 67%（低于 Scandit 估计的 75–82%，因为 Cognex 包含硬件），FY2025 Adjusted EBITDA margin 为 21.5%。Cognex
              提供了公开可得的最佳 pure-play 机器视觉可比公司，尽管其硬件内容和规模削弱了与 Scandit 纯软件模型的直接可比性。Zebra
              Technologies（ZBRA）是企业数据采集和移动计算领导者，FY2025 净销售额 $5.4B，截至 2026 年中企业价值约 $14B，意味着 EV/revenue 倍数约 2.6×。Zebra
              明显更低的倍数反映了其硬件占多数的收入组合（毛利率 48%，而 Scandit 估计软件毛利率为 75–82%）、更大规模，以及缺少高增长 SaaS 溢价。Zebra 的倍数可作为 Scandit
              的底部参考：任何拥有 Scandit NRR 画像的纯软件 SaaS 平台，都应显著高于 2.6×。


              M&A 方面，Thoma Bravo 支持的 Apryse 于 2025 年 7 月收购 Scanbot SDK——一家直接的条码和文档扫描 SDK 竞争对手——对价未披露。Scanbot 2024 年 ARR
              约为 €7 million，服务 200–250 家企业客户。基于 2023–2025 年企业条码 / 文档扫描 SDK 业务的典型 M&A 倍数（按公开 SaaS M&A 基准为 6–12×
              ARR），Scanbot 交易隐含价值约为 €42–84M（$46–92M）。Scandit 的 $119M ARR 约为 Scanbot 规模的
              17×，有显著规模溢价，也有更广客户基础和更深平台能力。不过，Scanbot 的战略买方宇宙（Thoma Bravo/Apryse 作为文档技术 roll-up）不同于 Scandit
              可能的买方集合（Zebra、Honeywell、SAP 或物流软件平台），可获得的溢价可能不同。


              Windsor Drake 2025–2026 年私人 lower middle market SaaS 数据显示，典型创始人主导企业的中位数为 4–5× ARR；Rule of 40 分数高于 50%、NRR
              高于 120% 的公司可升至 7×+。Scandit 约 $327K 的 ARR/FTE 和估计 75–82% 毛利率，符合上四分位效率；如果确认 NRR 高于 115%，可支持 7–9×
              私人区间。Aventis Advisors 和 SaaS Capital Index 独立确认，截至 2026 年 Q1，公开 SaaS 中位数为 3.4×。对 Scandit
              这种画像的公司——AI-enabled （但不是 AI-native）、高效率、企业平台、有防御性的利基——适用的私人市场倍数区间约为 6–9×，高端需要 NRR 和增长确认。
