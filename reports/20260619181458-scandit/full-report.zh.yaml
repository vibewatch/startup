      - number: '7.2'
        title: 技术、竞争与平台依赖风险
        blocks:
          - type: paragraph
            body: >-
              Scandit 面临双面技术风险：下方有免费和开源替代品带来的商品化压力，上方有竞争性商业 SDK 厂商发布基准对比带来的性能可信度风险。


              商品化方面，Google ML Kit Barcode Scanning 为 Android 和 iOS 提供免费的端侧扫描，支持标准 1D/2D
              格式，适用于库存查询、活动签到和会员计划等基础企业用例。ZXing、ZBar 和 QuaggaJS 为需求更简单的开发团队提供零成本替代。免费工具覆盖范围扩大，正在侵蚀 Scandit
              的低端可服务市场：扫描需求直接、且不需要增强现实叠加、多条码追踪或高吞吐物流工作流的组织，越来越难证明 Scandit 高价的合理性。worldmetrics.org 2026 年条码扫描软件排名把
              Scandit 列为第一，但紧随其后的是 ML Kit、AWS Panorama 和 Microsoft Azure AI
              Vision——这些都把条码扫描作为更广泛云平台生态中的打包功能，为已经投入这些平台的客户制造替代风险。


              基准性能方面，barKoder 发布的一项 SDK 对比测试评估了受损 PDF417 条码样本，并报告 Scandit 解码成功率为 47.61%，barKoder 为 90.4%，Scanbot 为
              52.38%，Dynamsoft 为 42.85%。另一项旋转图片场景基准显示，Dynamsoft 相比 Scandit
              有更高检测准确率。这些结果由直接竞争对手（barKoder）发布，应视为可能带有自身利益；它们未必反映 Scandit 在其最主要竞争的高吞吐企业环境中的真实表现。Scandit
              从未发布自己的独立基准报告。Scandit 的 Vision AI Engine 是专有且闭源的；缺少第三方基准审计，是一个尽调缺口：客户和投资者无法独立验证其在完整条码制式和条件矩阵中的扫描准确性声明。


              平台依赖是结构性风险。Scandit 的 iOS SDK 依赖 Apple 的 AVFoundation 摄像头框架；任何 Apple 发起的破坏性变更、API 废弃或 App Store
              政策转向，都可能要求立即更新 SDK，并向企业客户发布紧急补丁。Android 摄像头栈 API（Camera2/CameraX）同理。虽然所有主要条码扫描 SDK 厂商都有同样依赖，但 Scandit
              的规模（170 million+ 台活跃设备）会放大任何未修复不兼容的影响半径。Scandit 的货架智能产品 ShelfView
              引入额外云依赖（欧盟数据中心、未披露云供应商），带来端侧产品线不存在的正常运行时间和可用性风险。


              最后，Scandit 与 SAP、Pega 和 Google AppSheet 的集成伙伴关系形成分发依赖：如果其中任何平台改变伙伴计划经济性、终止集成，或推出竞争性的原生能力，Scandit
              的嵌入式工作流分发渠道就会受扰动。Honeywell 和 Zebra 作为主要企业硬件既有厂商，会捆绑自家扫描软件，并在硬件更新层制造渠道冲突风险。
