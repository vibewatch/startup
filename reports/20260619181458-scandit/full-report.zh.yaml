  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司 / 指标
      - 指标
      - 数值 / 倍数
      - 与 Scandit 的相关性
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the four most relevant publicly available reference points for Scandit valuation as of June 2026: the two
        public company comps in the scanning/CV space (Cognex and Zebra), the closest M&A precedent in the barcode SDK
        sector (Scanbot SDK), the private AI-enabled SaaS benchmark dataset (Finro Q1 2026), and the two primary public
        SaaS index references (SaaS Capital and PitchBook). Not exhaustive due to limited disclosed private comparables.
    rows:
      - - Cognex Corporation (CGNX) — 上市公司
        - EV/Revenue（2026 年中）
        - ~11×（$11B EV / $994M FY2025 收入）
        - 当前可得的最佳纯机器视觉上市可比公司；条码扫描是 Cognex 产品线核心
        - 硬件占比较高（毛利率 67%，Scandit 估计 ~78%）；$994M 规模 vs $119M ARR；买方画像不同
      - - Zebra Technologies (ZBRA) — 上市公司
        - EV/Revenue（2026 年中）
        - ~2.6×（$14B EV / $5.4B FY2025 收入）
        - 企业数据采集 / 扫描传统厂商；Scandit 直接替代 Zebra 硬件客户
        - 硬件为主（毛利率 48%）；$5.4B 规模；低增长传统硬件倍数；仅作底部参考
      - - SaaS Capital Index (SCI) — 纯 SaaS 中位数
        - EV/ARR（2026 年 5 月）
        - 3.4×（中位数，68 家成分公司；SaaS Capital 与 Aventis Advisors 独立测得均为 3.4×）
        - 公开交易纯 SaaS 公司的宽口径基准；给出 2026 年市场底部
        - 仅含上市公司；不计垂直细分、AI 赋能或战略价值溢价
      - - PitchBook Enterprise SaaS Comp Sheet — 上市 SaaS 中位数
        - EV/TTM Revenue（2026 年 Q1，99 家公司）
        - 3.3×（中位数，2026 年 3 月 31 日；低于 2025 年底的 4.9× 和 2024 年底的 6.2×）
        - 来自机构来源的独立 SaaS 中位数；印证 SaaS Capital 读数
        - 成分范围更广，含部分硬件 / 服务收入；并非纯 SaaS
      - - AI 赋能私有 SaaS — VC 轮次（Finro 2026 年 Q1）
        - EV/Revenue（2026 年，VC 轮次中位数）
        - 8–9×（私有 AI 赋能 SaaS VC 轮次；AI 原生为 21×）
        - 如果 Scandit 的 CV/ML 架构算作 AI 赋能而非传统 SaaS，该区间适用
        - 数据集为中位数；没有 Scandit 专属可比公司；AI 赋能类别内部分化很大
      - - Scanbot SDK（M&A，2025 年 7 月）
        - EV/ARR（隐含）
        - ~6–12× 估计（€7M ARR；被 Apryse/Thoma Bravo 收购；对价未披露）
        - 条码 / 文档扫描 SDK 领域唯一披露的近期 M&A；产品可比性直接
        - 规模差距（€7M vs $119M ARR）；对价未披露；收购方是整合型 PE，不是战略买家
      - - Windsor Drake 私有 LMM SaaS（Rule of 40 >50，NRR >120%）
        - EV/Revenue（2025-2026 私有 LMM）
        - 7×（溢价区间；中位数为 4–5×；Rule-of-40 >50 且 NRR >120% 时为 7×+）
        - 如果 Scandit 能证明符合 Rule of 40 且 NRR 得到确认，该区间适用
        - 低端中型市场数据集；与 Scandit 规模不同（$119M ARR 属于中端市场，不是 LMM）
    notes: >-
      所有上市公司倍数均截至 2026 年 6 月中，来自已引用的公开来源。Scanbot SDK 对价未披露；倍数区间按市场基准估算。 AI 赋能区间来自 Finro 2026 年 Q1 覆盖 575 家公司的数据集。Scandit
      适用区间为 6–9×，取决于 NRR 和增长能否确认。Cognex 是机器视觉倍数的上限参考；Zebra 是硬件集成扫描倍数的底部参考。
    claimRefs:
      - CV009
      - CV011
      - CV006
      - CV007
      - CV013
      - CV017
      - CV014
  - id: TV005
    title: 推翻论点与叫停触发条件
    columns:
      - 触发条件
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - ARR 反转或夸大
        - FY2025 经验证 ARR 低于 $100M
        - 2024 年加速增长不可持续；先落地再扩张论点坍塌；任何高于 5× 的入场倍数都不成立
        - 退出 / 不入场；立即要求数据室提供 ARR 对账
      - - 净收入留存低于 100%
        - 任一过去四季度客户队列确认 GRR 或 NRR < 100%
        - 客户基数在收缩；扩张模型失效；ARR 天花板低于当前运行率
        - 下调至卖出 / 不入场；按负 NRR 轨迹重建模型
      - - Walmart 集中度风险兑现
        - 公开披露 Walmart 合同流失、未续约，或来自具名账户的 ARR 减少 >30%
        - 集中度风险兑现；剩余客户群 ARPU 被稀释；M&A 吸引力下降
        - 立即重估；任何 M&A 谈判都要求托管或陈述与保证条款
      - - 正式下轮融资低于 $800M
        - 公开或在数据室宣布投后估值低于 $800M 的新一级股权融资
        - 既有投资人账面亏损；Series D 优先权堆叠造成治理摩擦；释放困境信号
        - 负面信号；不按降价轮条款共同投资；任何新资本结构都寻求高级优先权
      - - 免费 SDK 替代中端市场
        - Google ML Kit 或 AWS Panorama 在 12 个月内可衡量地替代 Scandit，覆盖 ≥2 个主要垂直行业
        - 低端至中端 ACV 受压；TAM 缩小；多年 ARR 天花板降低
        - 下调 ACV 估算；压缩 DCF；评估产品路线图相对免费替代品的差异化
      - - EU AI Act 将 ID 产品列为高风险
        - 2027 年前，正式指南或执法行动将 ID Bolt/ID Validate 归类为 Annex III 高风险 AI 系统
        - 合规成本压低 ID 扫描毛利；客户责任担忧削弱采用速度
        - 将 ID 扫描毛利率估算下调 300–500 bps；建模增量合规支出
    notes: 叫停触发条件需要公开公告或数据室证据验证；仅有定性信号（例如媒体报道）只应升级为重新调研，不应立即行动。
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 验证
        - FY2023、FY2024 和 FY2025 YTD 经审计或审计师审阅的管理账 ARR；与 GAAP 收入对账
        - $119.1M ARR 仅由创始人通过 LATKA 披露；240% 增长是核心估值驱动，但无法从公开来源验证
        - 数据室 — 经审计账目（Swiss CO2/IFRS）或四大会计师审阅、含 ARR 对账的管理账
      - - 按客户队列拆分的 NRR 和 GRR
        - 2022–2025 年净收入留存（NRR）、总收入留存（GRR）和队列级收入拆分
        - 没有队列留存就无法验证先落地再扩张论点；NRR 低于 110% 会让倍数重估下调 2–3× 点
        - 数据室 — 按进入年份拆分的队列 P&L；前 25 大账户的年度客户收入；FY2022–FY2025 流失日志
      - - 客户收入集中度
        - 前 10 大客户 ARR 占总 ARR 的比例；Walmart 钱包份额
        - Walmart 是已具名的最大客户，覆盖 130 万员工；未披露集中度是承保阻断性缺口
        - 数据室 — CRM 收入导出或管理账客户收入明细；Walmart 合同条款
      - - 股权结构、优先权堆叠和债务条款
        - 按股权类别列示完整股权结构表；清算瀑布；Kreos Capital 贷款金额、利率、契约和到期日
        - 没有完整资本结构，就无法建模退出收益、优先权悬置或从 EV 到股权价值的桥
        - 数据室 — 股权结构表（Carta 或同等系统）；Kreos Capital 贷款协议；投资人权利协议
      - - EBITDA 和现金跑道
        - FY2024 和 FY2025 经营 P&L，包括 R&D、S&M、G&A；现金余额；烧钱速度；预计跑道
        - 盈利路径和跑道决定是否需要新的一级资本，以及需要什么条款
        - 数据室 — 管理账 P&L；月度银行流水（最近 12 个月）；董事会批准的经营计划
      - - 董事会构成与治理
        - 董事姓名、角色、独立性；Warburg Pincus 治理权；审计委员会；联合创始人归属安排
        - 只有创始人的 C-suite 和未披露董事会造成治理不透明；Warburg 退出时间表可能与创始人偏好冲突
        - 数据室 — 董事会会议纪要（最近 8 个季度）；股东协议；投资人权利；联合创始人雇佣条款
      - - EU AI Act 分类方案
        - Scandit 法务团队就 ID Bolt 和 ID Validate 在特定部署场景下是否落入 EU AI Act Annex III 的书面评估
        - Annex III 合规义务（2027 年 12 月）会带来尚未量化的未来合规成本
        - 数据室 — Scandit 关于 AI Act 分类的法务备忘录；如无，则委托外部 EU AI Act 律师出具意见
    notes: 所有尽调问题都是 Series D+ 企业 SaaS 投资的标准事项。优先级顺序：（1）ARR 验证，（2）NRR/GRR 队列，（3）客户集中度。上述主题没有任何公开来源可以替代数据室访问。
