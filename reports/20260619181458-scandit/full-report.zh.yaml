        title: 图表
        blocks:
          - type: callout
            title: 尽管 HHP 已撤回，专利诉讼风险仍未关闭
            body: >-
              2024 年 8 月发出的 UPC 初步禁令显示，Scandit 的 BarcodeTrackingAdvancedOverlay SDK 功能被认定可能构成对 EP 3 866 051 的间接侵权。虽然 HHP
              于 2025 年 3 月撤回，但主程序并未和解；Honeywell 仍持有该专利，可能在主程序或其他司法辖区重新主张权利。既有硬件厂商（Zebra、Cognex）未来利用重叠专利组合发起专利主张行动，不能排除。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: 基准性能差距已有公开记录且未被反驳
            body: >-
              barKoder 发布的 SDK 对比显示，Scandit 的受损 PDF417 解码率为 47.61%，barKoder 为 90.4%。Scandit
              尚未发布反向研究，也未委托独立基准测试。对物流和医疗部署而言，受损或印刷质量差的标签很常见；如果这个性能差距在评估中暴露，可能成为竞争性淘汰因素。尽调应获取 Scandit
              在受控条件下的自有准确性数据和独立验证。
            calloutType: risk
            claimRefs:
              - CR011
              - CR015
          - type: callout
            title: 投资者尽调优先项——NRR、客户集中度与 AI Act 分类
            body: >-
              三个数据缺口构成最实质的投资风险。第一，NRR 和 GRR 未披露——确认 Walmart 规模和 2,100+ 客户基础内的留存，是成长阶段估值的基础。第二，必须量化 Walmart 收入集中度：如果
              Walmart 超过 ARR 的 15%，标准 PE/VC 风险框架要求对账户流失做情景建模。第三，在 Digital Omnibus 正式通过前，应取得 ID Bolt 和 ID Validate 的 EU
              AI Act 分类法律确认——即这些产品是否落入 Annex III 高风险范围——因为这可能给 Scandit 企业客户带来合规成本影响。
