  - id: FE001
    title: 产品架构图——Smart Data Capture 平台栈
    type: stack
    layout: wide
    summary: >-
      Scandit 平台是一套分层的端侧软件栈：底层是设备硬件，核心计算层是 Vision AI Engine，上方是模块化数据捕获能力， 再往上是预构建工作流组件，最后由集成层连接企业系统。ShelfView
      是唯一打破端侧模型的产品，额外加入云端分析层。
    data:
      layers:
        - label: 企业业务系统（集成层）
          detail: >-
            SAP Fiori/S4HANA/BTP（原生）；Google AppSheet（授权提供商）；Pega Marketplace（直接组件）； Oracle/Blue Yonder/Manhattan
            Associates（需要定制中间件）；自定义 REST/webhook API。
        - label: 预构建工作流组件
          detail: >-
            SparkScan（高频单次扫描 UI）、MatrixScan Find/Count/Batch/AR（多条码 AR 工作流）、ID Bolt（预构建 Web ID 扫描）、Scandit
            Express（无代码交钥匙应用）、ShelfView Dashboard 和告警控制台。
        - label: 数据捕获模块
          detail: >-
            Barcode Capture（1D/2D、50+ 码制、OCR 回退）、ID Scan/ID Validate（2,500+ 证件类型；美国伪造检测）、 Label Capture（条码 + OCR
            组合）、Object Recognition（ShelfView 货架商品）。
        - label: Scandit Vision AI Engine
          detail: 上下文感知的 Smart Scan Intention、实时 AR 叠加跟踪、OCR 引擎、图像识别、端侧 ML 推理。 闭源专有 IP。按 SDK 发布周期更新。
        - label: SDK 运行时（iOS / Android / WebAssembly）
          detail: 面向 11 个框架的平台专用执行容器。不依赖 Google Play Services。浏览器使用 WebAssembly； 移动端和加固 Android（Zebra、Honeywell）使用原生二进制。
        - label: 设备硬件（摄像头、处理器、传感器）
          detail: >-
            支持 20,000+ 款设备机型：iPhone、iPad、Android 智能手机和平板、Zebra TC/ET 系列、 Honeywell EDA/CT/CK 系列、Samsung Knox
            设备、可穿戴设备、固定摄像头、自主机器人、无人机。
    approximationNotes: null
