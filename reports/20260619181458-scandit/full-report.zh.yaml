  - id: FV001
    title: 建议逻辑 — 从证据到投资立场
    type: flow
    layout: wide
    summary: 逻辑链把 Scandit 的规模、平台验证和风险证据连接到估值缺口评估，并推导出跟踪 / 有条件买入建议。
    data:
      nodes:
        - id: scale
          label: 规模 / 验证
          detail: $119.1M ARR（2024 年 11 月，未经审计）；2,100+ 企业客户；170M+ 活跃设备；Walmart 130 万员工续约，2025 年 6 月
          tone: positive
        - id: moat
          label: 平台护城河
          detail: 17 年 ETH Zurich 计算机视觉血统；23+ 专利；MatrixScan / ID Validate / ShelfView 平台深度；SAP / Pega / AppSheet 集成
          tone: positive
        - id: risk_val
          label: 估值风险
          detail: 2022 年 $1B 标记相当于 8.4× ARR，高于 3.4× SaaS 中位数；2.5× 溢价需要 NRR / 增长确认；标记已停留 4 年
          tone: negative
        - id: risk_disc
          label: 披露风险
          detail: 没有 NRR、没有经审计财务、没有客户收入拆分；ARR 增长未验证；240% YoY 需要佐证
          tone: negative
        - id: comps
          label: 可比区间
          detail: SaaS 中位数 3.4×；AI-enabled 私有公司 8–9×；Cognex 11×；Windsor Drake LMM 溢价 7×；基本情形 6–8× = $780M–$1.04B
          tone: neutral
        - id: entry_cond
          label: 入场条件
          detail: ≤7× 已确认 forward ARR（以 $120M ARR 计约 $840M）；NRR ≥115% 经验证；或以战略溢价 M&A 退出
          tone: neutral
        - id: recommend
          label: 建议：TRACK
          detail: 若入场价格和 data-room 证据门槛达标，可有条件买入；在当前 SaaS 环境下，不按 2022 年 $1B 标记买入
          tone: neutral
      edges:
        - from: scale
          to: comps
        - from: moat
          to: comps
        - from: risk_val
          to: comps
        - from: risk_disc
          to: comps
        - from: comps
          to: entry_cond
        - from: entry_cond
          to: recommend
    approximationNotes: 流程节点汇总多来源证据；单项数值来自本章各处引用的来源。
    claimRefs:
      - CV005
      - CV006
      - CV032
      - CV033
