      - number: '8.5'
        title: 退出就绪度、论点失效触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              Warburg Pincus 对成长股权投资的典型持有期为 4–7 年。按 2022 年 2 月投资计算，目标流动性事件窗口落在 2026–2029 年。到 2026 年中，Scandit 有三条退出路径。IPO
              路径基本关闭：2026 年 Q1 没有 VC 支持的 SaaS 独角兽提交上市申请，Liftoff 在 2026 年 2 月撤回计划中的 IPO，PitchBook 2026 年 Q1 报告也指出，市场长期期待的
              Databricks、Anthropic 和 OpenAI 上市仍排在 2026 年晚些时候，但没有确认时间表。Scandit ARR 为 $119M，且缺少同规模公开可比公司，在当前环境下不太可能成为近期
              IPO 候选。战略 M&A 路径更可行：2,100+ 企业客户、170M 活跃设备、深入的 SAP/Pega/Google AppSheet 生态集成，以及 17 年计算机视觉
              IP，组合成一项战略资产，收购溢价可能高于财务倍数。可信买家包括 Zebra Technologies（希望用 SaaS ARR 替代硬件扫描仪收入）、Honeywell Safety &
              Productivity Solutions（在 Honeywell SPS 剥离讨论后逻辑类似）、SAP（将扫描原生嵌入 EWM/WM
              流程）、Salesforce/ServiceNow（延伸现场服务和最后一公里自动化），以及推动工业软件 roll-up 的私募股权平台。二级市场交易（出售 Warburg Pincus
              持仓或早期投资人股份）是第三条路径，但需要双方认可一个能反映估值缺口的价格。


              六个论点失效触发器需要监测。最紧迫的是 FY2025 确认 ARR 低于 $100M，这会说明 2024 年加速不可重复，增长故事坍塌。第二是确认 NRR 低于 100%，意味着客户净收缩，与
              land-and-expand 论点相反。第三是 Walmart 集中度风险落地，即公开披露重大合同缩减。第四是以低于 $800M 估值正式 down round，信号是融资承压，且投资人承认估值缺口。第五是
              12 个月内 Google ML Kit 在任何主要垂直中从 Scandit 手中拿到可衡量的中端市场份额，迫使 ACV 压缩。第六是 EU AI Act Annex III 将 ID Bolt/ID
              Validate 归类为高风险 AI 系统，导致 2027 年后合规成本侵蚀 ID 扫描利润率。
            claimRefs:
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV005
            claimRefs: []
          - type: table
            tableRef: TV006
            claimRefs: []
      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 过期的 2022 年估值相较 2026 年公开 SaaS benchmark 形成 2.5× 倍数缺口
            body: >-
              Scandit 2022 年 2 月 Series D 的 $1 billion 标记，意味着按其最近披露 ARR 计算为 8.4×。到 2026 年 5 月，SaaS Capital Index 中位数降至
              3.4×——比 Scandit 2022 年入场价低约 60%。任何按 2022 年标记进入的新投资人，支付的价格都超过当前 SaaS 市场中位数两倍，却没有经验证 NRR、经审计 ARR 或 cohort
              数据支撑溢价。这是新进入者最可操作的单一风险。
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
              - CV007
          - type: callout
            title: 跟踪——有条件买入阈值为已确认 forward ARR 的 ≤7×
            body: >-
              Scandit 拥有真实战略资产、可防守市场位置，以及 AI-enabled 平台，估值应高于 SaaS 中位数。合适入场价是已确认 FY2025 ARR 的 ≤7×（若 ARR 为 $120–130M，则约
              $840M–$910M），同时 NRR ≥115%，并能在 data room 中看到 cohort 留存和客户集中度数据。若不满足这些条件，建议继续跟踪，等待价格修正、二级市场机会或 M&A 流程启动。
            calloutType: recommendation
            claimRefs:
              - CV032
              - CV033
              - CV038
          - type: callout
            title: 战略 M&A 溢价是主要上行可选性
            body: >-
              按财务估值，Scandit 基准情景为 $780M–$1.04B。不过，战略收购方（Zebra Technologies 用 SaaS ARR 替代硬件收入、SAP 将扫描嵌入 EWM 流程、Honeywell
              SPS 寻求 software-first 能力）很可能在财务价值之上支付 30–50% 的战略溢价。考虑到 Warburg Pincus 的退出时间表，这一 M&A 可选性是 2022 年 $1B
              标记得到验证或被超过的情景。
            calloutType: insight
            claimRefs:
              - CV036
              - CV040
