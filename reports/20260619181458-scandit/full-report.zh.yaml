      - number: '4.5'
        title: 财务结论、反向证据和尽调阻塞项
        blocks:
          - type: paragraph
            body: >
              Scandit 的财务图景整体正面，但有重要前提；没有数据室访问，无法完整承保。公司具备高质量企业 SaaS 的特征：设备端架构带来强毛利率经济性；落地扩张模型支撑估计高于基准的
              NRR；企业客户基础多元，并有具名 Fortune-500 锚定账户；员工队伍资本效率高，ARR/员工处于前四分位。若年增长继续保持 20–30%+，$119M ARR 配 $1B+ 估值（来自 2022
              年）与当前 SaaS 市场定价相符。


              主要反向财务信号包括：(1) 2023 年 12 月到 2024 年 11 月 ARR 跳增 240%，异常且没有任何一手来源佐证；(2) 员工数从 2024 年 10 月 545 人降至 2024 年 12 月
              392 人，约两个月减少 153 人（~28%），符合一次重大裁员事件，但公司没有公开披露；(3) LATKA（1,000）与公司网站（2,100+）之间的客户数差异造成 ACV 计算不确定；(4) Kreos
              Capital 作为风险债提供方参与两轮融资，可能存在债务义务且条款未披露；(5) 自 2022 年 2 月以来没有主融资，使最后一个公开估值锚仍停在 2022 年市场条件，不能直接与 2026 年估值现实相比。


              增长质量是财务尽调的核心问题。如果 2024 年末 ARR 跳至 $119M 反映真实企业扩张（例如 Walmart 规模化、FedEx、DHL 和 NHS 在全平台扩大使用），隐含 NRR 将符合前四分位企业
              SaaS 基准，业务也会真正具备资本效率。若它反映的是激进多年期合同确认、ARR 口径定义变化，或少数超大一次性合同，底层增长质量就更低。Q4 2024
              同时发生员工减少，信号模糊：可能反映重组后效率提升，也可能意味着增长目标被证明无法实现后，公司调整了人员规模。


              专业服务收入及其毛利率画像同样未披露。企业 SDK 部署往往需要大量集成支持，可能包含毛利率较低的服务收入，把混合毛利率压到 75–82% 的纯软件估计以下。专业服务与纯软件许可在 ARR
              中的占比，是数据室里的关键问题。
