      - ["Pharmacy / site routing", "Provider, patient, and pharmacy", "Reported operating capability", "Accounts for coverage restrictions and inventory", "Routing accuracy, pharmacy coverage, and overrides"]
      - ["Evidence-to-access integration", "Clinician", "OpenEvidence partnership announced", "Links decision support with prescription execution", "Production penetration and interface specifications"]
    notes: "Status reflects public descriptions as of 2026-10-23; no row implies universal payer, drug, EHR, or pharmacy coverage."
    claimRefs: [CE001, CE002, CE003, CE004, CE006, CE007, CE008]
  - id: "TE002"
    title: "Workflow and use-case assessment"
    columns: ["User job", "Current friction", "Tandem response", "Publicly described benefit", "Limitation / test"]
    rows:
      - ["Submit a medication authorization", "Manual paperwork and calls", "Automated submission workflow", "Less administrative handling", "Measure touchless completion by payer"]
      - ["Resolve a denial", "Appeal preparation and follow-up", "Appeals included in workflow", "Single operating surface", "Review overturn rate and human escalation"]
      - ["Find an affordable path", "Benefit and program complexity", "Affordability support", "Keeps access work connected to the prescription", "Validate eligible-program coverage"]
      - ["Route the prescription", "Coverage and pharmacy restrictions", "Preferred pharmacy or site-of-care routing", "Reported real-time visibility", "Test inventory, specialty-pharmacy, and override cases"]
      - ["Move from evidence to prescription", "Decision support and execution are separate", "OpenEvidence integration", "Connects clinical evidence to submission", "Verify deployment depth and data handoff"]
    notes: "Benefits are provider, partner, or management descriptions; the assigned evidence includes no controlled outcome study."
    claimRefs: [CE002, CE003, CE004, CE005, CE007, CE008, CE009]
  - id: "TE003"
    title: "Technology, control, and dependency assessment"
    columns: ["Layer / dependency", "Observed or benchmark evidence", "Risk", "Required diligence evidence"]
    rows:
      - ["EHR and clinical-data intake", "A competitor review says full functionality needs supported EHR integrations", "Deployment scope may vary by EHR", "Integration inventory, implementation time, and failed-intake logs"]
      - ["Interoperability", "Adjacent platforms expose APIs, HL7/FHIR, X12, batch, and file-transfer patterns", "Tandem protocols are undisclosed", "Interface specifications, versioning policy, and certification list"]
      - ["Automation and exceptions", "Competitor critique highlights insurer snags and patient-response dependency", "Automation may fall back to manual work", "Straight-through rate, exception taxonomy, and staffing model"]
      - ["Privacy and security", "KFF identifies privacy breaches and data misuse as sector risks", "Sensitive prescription data increases impact", "SOC 2/HITRUST evidence, BAA, data-flow map, retention and training-use policy"]
      - ["Clinical and fairness oversight", "KFF describes individualized-review requirements; Optum describes governance and human review", "Incorrect or biased automation can harm access", "Model cards, subgroup testing, denial/escalation policy, and audit samples"]
      - ["Reliability and recovery", "No Tandem-specific uptime or incident evidence was present in the assigned pool", "Workflow outages could delay therapy", "Status history, SLOs, incident postmortems, RTO/RPO, and manual fallback"]
    notes: "Humata, Waystar, Optum, and KFF are context benchmarks; their controls and interfaces are not attributed to Tandem."
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE014, CE015, CE016]
