company:
  name: "Tandem"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Tandem's disclosed product is an AI-enabled prescription-access workflow spanning prior
    authorization, appeals, affordability, and pharmacy routing. Public evidence supports a
    broad operating workflow and a live partner integration, but does not expose the underlying
    architecture, reliability record, security posture, model controls, or integration coverage.
sections:
  - id: "product-scope"
    title: "Product scope and customer workflow"
    body: >-
      Tandem is positioned as a workflow product for the administrative work that begins when a
      clinician writes a prescription. The disclosed sequence covers intake, prior-authorization
      paperwork, appeals, affordability support, and routing to a pharmacy or site of care. Forbes
      adds useful operating detail: the system is reported to collect prior-medication context and
      pharmacy restrictions, while doctors and patients can follow status in real time. This is a
      broader workflow proposition than a point form-filler, but the evidence remains largely
      company-originated or based on management descriptions. No reviewed source establishes
      coverage across every drug class, payer, EHR, or exception path, so the product should be
      underwritten as medication-access automation with unresolved edge-case boundaries.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001]
  - id: "workflow-and-architecture"
    title: "Workflow, integrations, and operating architecture"
    body: >-
      The clearest external integration proof is the announced OpenEvidence connection, which links
      clinical decision support to prescription generation and prior-authorization submission.
      Tandem's described execution layer then handles appeals, affordability, and destination
      routing. The architecture map below is therefore a functional evidence map, not a claim about
      Tandem's private software stack. Adjacent vendors show what enterprise interoperability can
      require: Humata markets proprietary APIs plus HL7/FHIR, while Waystar publicly lists REST,
      web services, sFTP, HL7, batch, X12 EDI, and robotic-process interfaces. Tandem's assigned
      evidence does not disclose equivalent protocols, data models, hosting, model vendors,
      fallback operations, or integration certification, leaving implementation effort and
      scalability unquantified.
    claimRefs: [CE007, CE008, CE010, CE011, CE012, CE016]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: "maturity-and-differentiation"
    title: "Maturity, differentiation, and operational dependencies"
    body: >-
      Product maturity is supported by reported production use and a commercial model tied to
      pharmaceutical-company relationships, not by a published release history or technical
      benchmark. The potential differentiation is orchestration across provider, patient, payer,
      affordability, and pharmacy steps, plus real-time status visibility. That breadth also creates
      dependencies on accurate clinical data, payer rules, patient responsiveness, supported EHRs,
      and pharmacy inventory. A competitor review argues that Tandem is strongest for relatively
      straightforward medication authorizations and may require supported EHR integrations; its
      commercial bias warrants caution, but the critique identifies concrete exception-handling and
      human-oversight questions that should be tested in references and workflow logs.
    claimRefs: [CE004, CE005, CE006, CE009, CE010]
    tableRefs: [TE003]
  - id: "trust-controls"
    title: "Trust, safety, compliance, and quality controls"
    body: >-
      The reviewed pool does not document Tandem-specific security certifications, business
      associate terms, audit logs, model evaluation, bias testing, human-review thresholds, uptime,
      incident history, or disaster recovery. These are material omissions for software processing
      prescription and insurance data. KFF identifies inaccurate or biased outcomes and privacy
      breaches as sector risks, and notes that some coverage decisions require individualized
      clinical review rather than algorithm-only adjudication. Optum's disclosed governance board
      and human-in-the-middle approach provide a useful diligence benchmark, not evidence that
      Tandem uses the same controls. Investment diligence should require control artifacts and
      measured exception outcomes before treating the workflow breadth as safe or reliable at scale.
    claimRefs: [CE013, CE014, CE015, CE016]
callouts:
  - calloutType: "risk"
    title: "Architecture and control evidence is the core technical gap"
    body: >-
      Public workflow descriptions are not substitutes for system diagrams, integration inventories,
      security attestations, uptime history, model evaluations, or documented human escalation rules.
    claimRefs: [CE013, CE014, CE015, CE016]
