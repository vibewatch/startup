schemaVersion: "report-v2"
artifact: financials
slug: tandem
runDate: "2026-10-23"
company:
  name: Tandem
chapter:
  number: 4
  title: Financials
  summary: >-
    Tandem is publicly described as free to providers and patients, with monetization
    attributed to partnerships and enterprise contracts, but a Preqin profile separately
    describes provider subscriptions. The assigned evidence does not disclose revenue,
    gross margin, burn, cash, runway, or realized contract economics, so capital adequacy
    and revenue quality remain material underwriting blockers despite the reported 2026
    financing.
sections:
  - id: revenue-model
    title: Revenue model is plausible but internally inconsistent
    body: >-
      The clearest public description is a subsidized workflow model: providers and
      patients use Tandem without charge, while partnerships and enterprise contracts
      are reported as the monetization layer. The OpenEvidence partnership shows how
      Tandem can enter the clinical workflow at the prescribing decision and carry the
      process through prior authorization, affordability support, and pharmacy routing,
      but the announcement contains no commercial terms. A Preqin profile creates an
      important contradiction by asserting that practices pay through subscriptions.
      Until management reconciles whether provider access is universally free, selectively
      subsidized, or sold under some contracts, neither payer identity nor revenue quality
      can be underwritten. Public list price of zero for users is therefore a distribution
      fact, not evidence of revenue, margin, or willingness to pay among enterprise partners.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics
    title: Activity signals do not resolve unit economics
    body: >-
      PYMNTS reported that Tandem expected millions of patients to use its service during
      2026, which suggests potential transaction volume but does not state active patients,
      completed authorizations, recognized revenue, or retention. A competitor assessment
      argues that Tandem is concentrated in medication prior authorizations and does not
      publish denial or accuracy rates; because that assessment is issued by DataMatrix,
      it is adverse competitive evidence rather than an independent benchmark. Linear
      Health's claimed automation range of $2 to $5 per authorization and outsourcing
      range of $7 to $15 are useful only as vendor-authored market reference points.
      They cannot be substituted for Tandem pricing, CAC, payback, contribution margin,
      implementation cost, appeal labor, or partner revenue share. Those company-specific
      inputs remain absent from the assigned evidence.
    claimRefs: [CI008, CI009, CI010, CI011]
    tableRefs: [TI003]
  - id: capital-and-external-drivers
    title: Financing extends capacity but does not establish runway
    body: >-
      Secondary sources reported a roughly $100 million 2026 financing at a $1 billion
      valuation, while PYMNTS reported $137 million raised to date on January 26, 2026.
      Preqin says the February financing was intended for hiring, product development,
      and deeper partnerships. None of those figures states cash on hand, debt, restricted
      cash, monthly burn, working-capital requirements, or remaining runway; capital raised
      must not be treated as capital still available. External demand may be durable:
      Mercer projects specialty drugs to exceed half of drug spending in 2026-2027 and
      beyond, and Cardinal Health reports active reassessment of hub-vendor models among
      200 biopharma manufacturers. Yet that backdrop can increase both opportunity and
      integration, compliance, and service-delivery costs.
    claimRefs: [CI005, CI006, CI007, CI014, CI015]
  - id: financial-verdict
    title: Financial verdict and underwriting threshold
    body: >-
      The investable thesis is a high-volume prescription-access network whose provider
      adoption is accelerated by a zero user price and whose economics are captured from
      enterprises elsewhere in the drug supply chain. The evidence does not yet show that
      this activity converts into recognized revenue or gross profit, and the conflicting
      subscription description weakens confidence in payer and contract architecture.
      Policy risk also matters: the National Health Law Program reports that some plans
      already use AI to support denials and that several states require human oversight
      for adverse determinations. Those constraints may protect patients while preserving
      costly exception handling. Underwriting should therefore remain conditional on
      contract-level revenue evidence, cohort retention, gross-margin bridges, customer
      concentration, cash and burn, and a management reconciliation of the provider-pricing
      conflict.
    claimRefs: [CI003, CI012, CI013, CI016]
tables:
  - id: TI001
    title: Revenue streams and payer architecture
    columns: [Stream, Mechanism, Public value or status, Revenue quality, Diligence ask]
    rows:
      - [Provider and patient workflow, "Prior authorization, appeals, affordability, and pharmacy routing", "Publicly described as free", "Adoption channel; no direct revenue shown", "Provide policy and contract exceptions to the zero-price offer"]
      - [Enterprise contracts, "Organizations pay for workflow or network access", "Reported by secondary coverage; terms undisclosed", "Potential recurring revenue, but duration and recognition are unknown", "Provide contract samples, ACV, renewal, and revenue-recognition policy"]
      - [Partnerships, "Integration or commercial relationship across the drug supply chain", "OpenEvidence partnership announced without economics", "Strategic distribution proof, not revenue proof", "Disclose fees, revenue share, implementation obligations, and exclusivity"]
      - [Provider subscriptions, "Practices pay for platform access", "Asserted by Preqin but conflicts with free-provider reporting", "Unresolved and potentially segment-specific", "Reconcile payer identity and quantify subscription revenue by cohort"]
    notes: "Public-source snapshot as of 2026-10-23; no row establishes realized revenue, and the provider-subscription row is explicitly conflicting."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Buyer or reference, Price or unit, List versus realized, Qualification]
    rows:
      - [Providers, "$0 publicly reported", "User-facing list price only", "Does not establish contract exceptions, acquisition cost, or revenue"]
      - [Patients, "$0 publicly reported", "User-facing list price only", "Does not establish affordability-program funding or partner economics"]
      - [Enterprise or biopharma partner, "Not disclosed", "Realized pricing unavailable", "Contract unit, minimums, take rate, and revenue share are unknown"]
      - [Automation market reference, "$2-$5 per authorization claimed by Linear Health", "Competitor-authored benchmark, not Tandem pricing", "Useful only as a diligence comparison range"]
    notes: "The Linear Health range is vendor-authored market context; it is not independent evidence of Tandem pricing or realized revenue."
    claimRefs: [CI001, CI002, CI011]
  - id: TI003
    title: Unit economics and capital adequacy gaps
    columns: [Metric, Public value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue or ARR, "Not disclosed", Low, "Required to size revenue quality and valuation support", "Provide audited monthly revenue, ARR definition, and revenue by payer type"]
      - [Gross margin and service cost, "Not disclosed", Low, "Automation may still require integration and exception-handling labor", "Provide gross-margin bridge by workflow, including human review and implementation"]
      - [CAC and payback, "Not disclosed", Low, "Free provider adoption may shift acquisition cost to enterprise sales", "Provide fully loaded CAC, sales cycle, payback, and channel commissions"]
      - [Retention and concentration, "Not disclosed", Low, "Enterprise dependence can create renewal and bargaining risk", "Provide gross and net retention plus top-10 customer and partner concentration"]
      - ["Cash, burn, and runway", "Not disclosed", Low, "Reported financing is not cash available", "Provide current cash, restricted cash, debt, monthly burn, and base/downside runway"]
    notes: "Nulls are evidence gaps, not zero values; the assigned public sources disclose neither company financial statements nor management KPI definitions."
    claimRefs: [CI005, CI006, CI007, CI009, CI010]
