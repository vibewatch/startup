company:
  name: Tandem
chapter:
  number: 6
  title: Customers
  summary: >-
    Tandem, now operating as Forus, reports rapid provider adoption and broad national
    reach, but the retained evidence is dominated by company-supplied aggregates rather
    than named production customers, measured outcomes, retention, or concentration data.
    The strongest current proof is a workflow partnership with OpenEvidence; the clearest
    counterpoint is a competitor's warning that automation may be best suited to simpler
    medication prior authorizations.
sections:
  - id: customer-base
    title: Customer base and economic roles
    body: >-
      The available evidence points to a multi-sided network rather than a conventional
      single-buyer software account. Provider practices and health systems are the principal
      workflow users, patients are beneficiaries who reportedly pay nothing, and biopharma
      companies appear to be the commercial customer segment most clearly described in the
      retained material. Pulse 2 relayed Forus's statements that thousands of practices and
      health systems use the platform across all 50 states and that five of the ten largest
      global biopharma companies work with it. PYMNTS separately reported that the service
      is free to providers and patients. Those statements support segmentation, but they do
      not disclose contracts, revenue mix, procurement owners, or whether every counted
      practice is active and paying through another side of the network. OpenEvidence is
      best classified as a distribution and workflow partner, not automatically as a
      customer.
    claimRefs: [CU001, CU005, CU007, CU008, CU014]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory is broad but largely self-reported
    body: >-
      Current third-party articles relay strong company-supplied adoption indicators:
      provider adoption reportedly increased tenfold year over year in each of the prior
      two years; usage spans thousands of practices and health systems; and the service
      reportedly reaches patients in nearly 80% of U.S. residential ZIP codes. PYMNTS also
      reported management's expectation that millions of patients would use the service in
      2026. These measures are directionally consistent with expansion, but they mix growth,
      installed footprint, geographic reach, and a forward-looking patient forecast. They
      therefore cannot be combined into a conversion funnel or treated as equivalent active
      usage. No retained source supplies a dated active-account series, repeat-use rate, paid
      deployment count, or denominator for the tenfold growth statement. The trajectory is
      promising, but not independently audited.
    claimRefs: [CU004, CU005, CU006, CU009]
    tableRefs: [TU002]
  - id: proof-and-durability
    title: Named proof, retention, and concentration remain thin
    body: >-
      The OpenEvidence partnership is the clearest named relationship in the assigned
      evidence. It connects clinical decision support to prescription generation and prior
      authorization submission, but the announcement does not disclose deployment volume,
      customer conversion, treatment-start improvement, or commercial terms. Aggregate
      references to thousands of provider organizations and five leading biopharma
      companies do not identify accounts or distinguish pilots from scaled production.
      None of the retained Tandem or Forus sources reports NRR, GRR, churn, renewal,
      contract length, or customer concentration. Consequently, retention and top-customer
      exposure remain private-evidence questions rather than negative conclusions. A
      similarly named European clinical-documentation company, Tandem Health, reports a
      different integration footprint; those figures must not be attributed to this
      prescription-access business.
    claimRefs: [CU001, CU005, CU007, CU015, CU016]
    tableRefs: [TU003]
  - id: workflow-value-and-friction
    title: Workflow value depends on exception handling and production execution
    body: >-
      The proposed customer journey is coherent: a clinical decision can trigger a
      prescription, authorization and appeal work, affordability support, pharmacy routing,
      and ultimately treatment initiation. Yet the retained evidence does not quantify how
      often Tandem completes that sequence or where cases drop out. A competitor assessment
      says the product is attractive for simple medication authorizations while arguing
      that complex cases still require human judgment and follow-up; because the publisher
      sells an alternative service, that critique is adverse evidence, not an independent
      benchmark. Separate named deployments from Alithya and MCG show what diligence-grade
      proof can look like: throughput measures, production status, named counterparties,
      implementation detail, and explicit baselines. Those comparator outcomes do not
      establish Tandem's performance, but they define the evidence needed to underwrite
      durable customer value.
    claimRefs: [CU003, CU010, CU011, CU012, CU013]
    figureRefs: [FU001]
