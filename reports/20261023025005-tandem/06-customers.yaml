      - ["Provider practices and health systems", Provider, "Prescription-access workflow", "Thousands reported in aggregate; named deployments absent", "No account-level result disclosed", "Cannot distinguish active production, pilots, or inactive accounts"]
      - ["Five top-ten global biopharma companies", Biopharma, "Research and medicine-launch support", "Commercial relationships reported; customers unnamed", "No customer-specific result disclosed", "Contract value, duration, concentration, and data rights are unknown"]
      - ["Retained comparator deployments", "External benchmark only", "Alithya payer intake and MCG payer-provider authorization automation", "Named production evidence exists for comparators, not Tandem", "Comparator throughput and workflow evidence is available", "Must not be attributed to Tandem; shows the proof standard still missing"]
    notes: "Partial enumeration of public proof in the assigned source pool; anonymous aggregates and comparator deployments are shown explicitly rather than presented as named Tandem customers."
    enumerationScope:
      coverage: partial
      basis: "Public Tandem or Forus relationships and relevant production benchmarks retained in the assigned 2026 source pool."
    claimRefs: [CU001, CU002, CU005, CU007, CU012, CU013, CU016]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: "The public value proposition spans six workflow stages, while measured stage-level completion and conversion remain undisclosed."
    data:
      nodes:
        - label: Clinical decision
          detail: "OpenEvidence partnership supplies evidence-based decision support at the point of care."
        - label: Prescription action
          detail: "Tandem is positioned to turn the decision into prescription generation."
        - label: Authorization
          detail: "The platform reportedly submits prior authorizations and manages appeals."
        - label: Affordability
          detail: "The workflow includes enrollment in financial-support pathways where needed."
        - label: Pharmacy routing
          detail: "The prescription is routed to the preferred pharmacy or site of care."
        - label: Treatment start
          detail: "The intended endpoint is patient access; no retained source quantifies completion or elapsed time."
    approximationNotes: "Ordered conceptual workflow from partnership descriptions; no conversion rates, stage volumes, or completion-time estimates are implied."
    claimRefs: [CU001, CU003, CU010]
callouts:
  - calloutType: strength
    title: Broad reported footprint
    body: >-
      Company-supplied figures indicate thousands of provider organizations, reach across
      all 50 states, and commercial relationships with five of the ten largest global
      biopharma companies.
    claimRefs: [CU005, CU006, CU007]
  - calloutType: risk
    title: Durability is not publicly measurable
    body: >-
      The retained evidence does not disclose retention, renewal, contract duration,
      account-level outcomes, or customer concentration, so the apparent reach cannot yet
      be translated into durable revenue quality.
    claimRefs: [CU016]
