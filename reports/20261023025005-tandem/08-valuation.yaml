company:
  name: Tandem
chapter:
  number: 8
  title: Valuation
  summary: "Tandem has attracted substantial financing interest around a reported $1 billion valuation, but the public record does not disclose enough recurring revenue, margin, retention, or capitalization detail to underwrite that price confidently. The appropriate stance is research-more: commercial proof and strategic partnerships are encouraging, while price discovery and downside protection remain unresolved."
sections:
  - id: investment-view
    title: Investment view and price discipline
    body: >-
      The investable thesis is that Tandem can convert a large administrative bottleneck into a
      scalable medication-access network. Publicly reported product descriptions say the platform
      automates prior authorizations, appeals, enrollment forms, and pharmacy routing, while an
      OpenEvidence partnership connects clinical decision support to prescription execution. A
      Doctor Care Anywhere deployment provides a concrete operating signal, with the partner
      describing use across 60,000 consultations per month. These are strategic and workflow
      indicators, not proof of revenue quality or gross margin. The anti-thesis is therefore
      price-sensitive: Tandem is offered at no cost to providers and patients in the cited
      reporting, while monetization terms, customer concentration, and unit economics remain
      unclear. A reported $1 billion post-money valuation and a reported $100 million financing
      should be treated as reported financing context, not independently verified fair value.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: scenarios
    title: Scenario valuation and downside
    body: >-
      Scenario analysis is constrained by missing company financials. The bull case assumes the
      reported financing closes near the cited valuation, adoption expands through partners, and
      Tandem develops a durable biopharma or provider monetization layer; this could support a
      premium outcome, but no precise target return is supportable from the retained evidence. The
      base case treats the $1 billion mark as an unverified private financing reference and
      requires evidence of paid deployments, recurring revenue, gross margin, and renewal behavior
      before accepting it as an underwriting input. The bear case is a repricing if fundraising
      reports do not translate into paid scale, if the product remains limited to simpler
      authorization cases, or if workflow and integration complexity forces human services around
      the software. Public comparable evidence is directional only: Waystar trades at a reported
      enterprise-value-to-revenue multiple of 5.01x, but it is a profitable public RCM company
      with a materially different maturity and disclosure profile.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV003]
  - id: diligence
    title: Entry conditions and thesis-break triggers
    body: >-
      A decision should remain conditional until management supplies a financing and operating
      packet. The minimum diligence set is a current cap table and term sheet, liquidation
      preference and participation terms, post-money ownership, debt and runway, paid customer
      count, cohort retention, revenue by customer and partner, gross margin by workflow, and
      evidence that integrations can scale beyond a narrow medication subset. The market is
      competitive and segmented: Black Book's 2026 provider survey ranked Infinx first in
      provider-side prior authorization automation and described prior authorization as a top
      operational bottleneck for 71% of validated respondents. DataMatrix's competitor review
      says Tandem is useful for simpler medication authorizations but not a complete end-to-end
      service; that is a competitor-issued view rather than an independent benchmark, but it
      identifies a testable product-boundary risk. The thesis breaks on a down round, weak paid
      conversion, material concentration, or inability to show reliable outcomes and governance.
    claimRefs: [CV011, CV012, CV013, CV014, CV015]
localEvidence:
  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: valuation
      missingEvidence: Audited or management-confirmed revenue, gross margin, burn, runway, and paid customer metrics at the financing date.
      whyItMatters: The reported valuation cannot be converted into a defensible revenue or cash-flow multiple without denominators and operating quality.
      diligencePath: Request monthly financial statements, ARR or revenue bridge, cohort retention, customer concentration, and a capitalization table under NDA.
      relatedQuestionRefs: [QV003, QV004]
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: The financing term sheet, liquidation preferences, participation rights, option pool, and post-money ownership.
      whyItMatters: A headline valuation may not describe common-equity economics or downside protection for a new investor.
      diligencePath: Obtain the latest preferred-stock financing documents and fully diluted cap table.
      relatedQuestionRefs: [QV004]
    - type: missing-source
      severity: material
      topic: commercialization
      missingEvidence: Independent evidence of paid deployments, renewal rates, workflow-level gross margin, and customer concentration.
      whyItMatters: Strategic partnerships and consultation volume do not establish repeatable monetization or pricing power.
      diligencePath: Validate a representative customer cohort, invoices, renewal data, implementation costs, and partner revenue-sharing terms.
    - type: conflicting-data
      severity: material
      topic: product-scope
      missingEvidence: A neutral evaluation of authorization coverage, exception handling, human escalation, and outcomes across medication classes.
      whyItMatters: A competitor review describes a narrower product boundary than the broad automation framing in financing coverage.
      diligencePath: Run a blinded workflow benchmark across routine and complex authorization cases with denial, time-to-therapy, and escalation metrics.
