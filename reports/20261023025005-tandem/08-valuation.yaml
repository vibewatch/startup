    columns: [Scenario, Assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Paid scale expands through provider and biopharma partnerships; workflow outcomes are independently validated", "Premium private-market value may be justified, but no numeric target is supportable from disclosed denominators", "Low-to-medium until financial packet is verified", "Partner volume fails to convert into paid recurring revenue"]
      - [Base, "Reported $1B mark is treated as a financing reference, with monetization and margins unverified", "Research-more; require price discipline and preferred-term review before entry", "Highest pending diligence", "Revenue, gross margin, retention, or cap-table data remain unavailable"]
      - [Bear, "Product remains narrow, services are needed for exceptions, or financing terms dilute common economics", "Repricing or down round becomes plausible; avoid unsupported mark-to-market assumptions", "Material", "Down round, concentration, weak outcomes, or governance gaps"]
      - [Comparable context, "Waystar is a mature public RCM company with $1.21B trailing revenue and 5.01x EV/revenue", "Directional benchmark only; do not apply its multiple to Tandem without revenue and maturity comparability", "Not a probability", "False comparability or multiple compression"]
