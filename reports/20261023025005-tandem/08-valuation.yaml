      - [Strategic distribution, "Partner materials cite 60,000 consultations per month and OpenEvidence integration", "Paid conversion, renewal, and partner economics"]
      - [Financing validation, "Multiple sources report $100M financing and a $1B valuation", "Signed term sheet, cap table, and post-money ownership"]
      - [Product-boundary risk, "Competitor review says simple cases are stronger than end-to-end coverage", "Neutral benchmark showing breadth, accuracy, and escalation performance"]
