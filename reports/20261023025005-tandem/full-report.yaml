  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The defensible core market is medication-access workflow automation after a clinician writes a
              prescription: insurance checks, documentation assembly, prior-authorization submission and appeal,
              affordability support, and pharmacy or site-of-care routing. The boundary excludes the value of the
              medicine itself, insurer premium revenue, general clinical decision support, and prior authorizations for
              procedures, imaging, and durable medical equipment. Current substitutes are practice staff, payer portals,
              fax, telephone follow-up, and outsourced authorization specialists. Tandem is reported to be free to
              providers and patients, but the retained sources do not disclose the paying customer or pricing basis.
              That missing commercial boundary matters more to sizing than the company's reported valuation.
            claimRefs:
              - CM001
              - CM002
              - CM015
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
              - CM016
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              No assigned source publishes a company-specific TAM, SAM, or SOM, so the market must be triangulated
              without converting unrelated denominators into software revenue. ASHP reported $915 billion of US
              prescription-drug spending in 2025 and projected more than $1 trillion in 2026; CMS separately reported
              more than $100 billion of gross Medicaid prescription-drug spending in 2024. Those figures describe drug
              economics, not Tandem's addressable fees. A closer operational lens is CAQH's $18.7 billion estimate of
              potential medical administrative savings from further automation, while 40% electronic prior-authorization
              penetration indicates remaining process headroom. Neither figure identifies eligible medication
              transactions, willingness to pay, or Tandem's attainable share.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
              - CM009
