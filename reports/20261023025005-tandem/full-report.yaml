      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Providers and access teams are the operational users, patients are the beneficiaries, and insurers or
              pharmacy-benefit managers control coverage decisions. Public evidence does not identify which participant
              funds Tandem, so buyer segmentation remains provisional: a practice or health system can justify adoption
              through lower labor and faster therapy starts, while a biopharma sponsor could value fewer abandoned
              prescriptions. The adoption path begins with EHR integration and reliable handling of routine cases, then
              depends on appeals, payer-specific exceptions, staff escalation, and patient participation. The strongest
              demand signal is workflow pain: the AMA reported 39 prior authorizations per physician per week,
              widespread care delays, treatment abandonment, and dedicated authorization staffing.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Drivers, constraints, and underwriting gaps
        blocks:
          - type: paragraph
            body: >-
              Growth is supported by rising prescription use, high specialty-drug spending, and a large gap between
              electronic and manual authorization workflows. Regulation can reduce friction but remains uneven: CMS's
              optional GENEROUS Medicaid model would introduce uniform coverage criteria only for participating states
              and manufacturers. Execution risk is material because payer rules vary, integrations can constrain
              deployment, and edge cases still require judgment and communication. DataMatrix, a competitor rather than
              an independent benchmark, argues that Tandem is best suited to simpler medication authorizations and that
              broader categories need human support. Underwriting therefore requires transaction eligibility, exception
              rates, authorization outcomes, implementation costs, contracted pricing, retention, and independently
              verified customer ROI.
            claimRefs:
              - CM004
              - CM007
              - CM009
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market urgency is not market size
            body: >-
              Prescription spending and administrative savings validate the importance of the workflow, but neither is a
              valid proxy for Tandem's software revenue opportunity.
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM008
          - type: callout
            title: The paying customer remains undisclosed
            body: >-
              Public sources identify providers as users and patients as beneficiaries while describing the product as
              free to both, leaving budget ownership and pricing unverified.
            calloutType: risk
            claimRefs:
              - CM002
              - CM015
          - type: callout
            title: Underwrite from eligible transactions
            body: >-
              Require a bottoms-up model covering medication-authorization volume, attach rate, pricing, exception
              handling, implementation cost, retention, and customer-level ROI.
            calloutType: recommendation
            claimRefs:
              - CM009
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer jobs
        blocks:
          - type: paragraph
            body: >-
              Tandem's relevant market is broader than electronic prior-authorization form completion. Its public
              workflow spans prescription intake, benefits and clinical-document collection, prior authorization
              submission, appeals, patient-support enrollment, pharmacy routing, and status communication. Rx Almanac
              describes Forus, the company's later name, as free to providers and patients and paid through biopharma
              partnerships, while the company's own practice page says it is free and supports multiple plans, drugs,
              and pharmacies. That creates a three-sided competitive set: medication-access vendors selling to
              manufacturers, provider workflow tools, and infrastructure platforms that already sit between prescribers,
              pharmacies, payers, or revenue-cycle teams. The buyer must therefore compare not just automation depth but
              the network position and data rights needed to complete a case after an initial submission.
            claimRefs:
              - CP001
              - CP002
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              The capability comparison is asymmetric by design. CoverMyMeds and Surescripts emphasize network reach or
              rapid decisions for qualifying, programmable cases; Waystar embeds authorization in a broader
              revenue-cycle suite; Cohere operates primarily on the payer side; and DataMatrix represents the human,
              end-to-end outsourcing substitute. Tandem/Forus instead claims a medication-access workflow that combines
              authorization, appeals, affordability, and pharmacy routing. Independent comparison material places Tandem
              among deeper specialty- medication options but also says its coverage is primarily medication prior
              authorizations, while the competitor's own critique says automation can leave gaps when cases require
              payer nuance, phone calls, or human judgment. These are positioning statements rather than controlled
              benchmark results, so the matrix marks unsupported performance and compliance cells as unknown rather than
              treating vendor claims as proof.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
