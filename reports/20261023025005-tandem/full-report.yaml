      - number: '4.2'
        title: Activity signals do not resolve unit economics
        blocks:
          - type: paragraph
            body: >-
              PYMNTS reported that Tandem expected millions of patients to use its service during 2026, which suggests
              potential transaction volume but does not state active patients, completed authorizations, recognized
              revenue, or retention. A competitor assessment argues that Tandem is concentrated in medication prior
              authorizations and does not publish denial or accuracy rates; because that assessment is issued by
              DataMatrix, it is adverse competitive evidence rather than an independent benchmark. Linear Health's
              claimed automation range of $2 to $5 per authorization and outsourcing range of $7 to $15 are useful only
              as vendor-authored market reference points. They cannot be substituted for Tandem pricing, CAC, payback,
              contribution margin, implementation cost, appeal labor, or partner revenue share. Those company-specific
              inputs remain absent from the assigned evidence.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI009
              - CI010
      - number: '4.3'
        title: Financing extends capacity but does not establish runway
        blocks:
          - type: paragraph
            body: >-
              Secondary sources reported a roughly $100 million 2026 financing at a $1 billion valuation, while PYMNTS
              reported $137 million raised to date on January 26, 2026. Preqin says the February financing was intended
              for hiring, product development, and deeper partnerships. None of those figures states cash on hand, debt,
              restricted cash, monthly burn, working-capital requirements, or remaining runway; capital raised must not
              be treated as capital still available. External demand may be durable: Mercer projects specialty drugs to
              exceed half of drug spending in 2026-2027 and beyond, and Cardinal Health reports active reassessment of
              hub-vendor models among 200 biopharma manufacturers. Yet that backdrop can increase both opportunity and
              integration, compliance, and service-delivery costs.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict and underwriting threshold
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is a high-volume prescription-access network whose provider adoption is accelerated
              by a zero user price and whose economics are captured from enterprises elsewhere in the drug supply chain.
              The evidence does not yet show that this activity converts into recognized revenue or gross profit, and
              the conflicting subscription description weakens confidence in payer and contract architecture. Policy
              risk also matters: the National Health Law Program reports that some plans already use AI to support
              denials and that several states require human oversight for adverse determinations. Those constraints may
              protect patients while preserving costly exception handling. Underwriting should therefore remain
              conditional on contract-level revenue evidence, cohort retention, gross-margin bridges, customer
              concentration, cash and burn, and a management reconciliation of the provider-pricing conflict.
            claimRefs:
              - CI003
              - CI012
              - CI013
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is not runway
            body: >-
              The reported round size and cumulative capital raised do not reveal current cash, burn, debt,
              working-capital needs, or the next financing trigger.
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI009
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Tandem is positioned as a workflow product for the administrative work that begins when a clinician writes
              a prescription. The disclosed sequence covers intake, prior-authorization paperwork, appeals,
              affordability support, and routing to a pharmacy or site of care. Forbes adds useful operating detail: the
              system is reported to collect prior-medication context and pharmacy restrictions, while doctors and
              patients can follow status in real time. This is a broader workflow proposition than a point form-filler,
              but the evidence remains largely company-originated or based on management descriptions. No reviewed
              source establishes coverage across every drug class, payer, EHR, or exception path, so the product should
              be underwritten as medication-access automation with unresolved edge-case boundaries.
            claimRefs:
