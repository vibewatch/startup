  - id: FP001
    title: Competitive positioning by workflow breadth and network leverage
    type: quadrant
    summary: >-
      An evidence-backed ordinal map separates broad network incumbents from medication-access specialists; positions
      are analytical scores, not market-share measurements.
    data:
      xAxis: 'Workflow breadth: 1 = PA-only or narrow, 5 = end-to-end access'
      yAxis: 'Network leverage: 1 = local/service-led, 5 = scaled payer/provider/pharmacy network'
      points:
        - label: Tandem/Forus
          x: 4
          'y': 3
          note: >-
            PA, appeals, affordability, routing; provider/EHR and partner evidence, but network scale not independently
            verified
        - label: CoverMyMeds
          x: 3
          'y': 5
          note: Broad connectivity and network claims; downstream decision speed remains payer-dependent
        - label: Surescripts
          x: 2
          'y': 5
          note: National e-prescribing network and touchless PA for qualifying cases
        - label: Waystar
          x: 4
          'y': 4
          note: Broad revenue-cycle suite and provider footprint; medication-specific depth uncertain
        - label: Cohere Health
          x: 3
          'y': 4
          note: Payer-side clinical review; provider benefit depends on payer adoption
        - label: DataMatrix Medical
          x: 5
          'y': 1
          note: Broad human service scope but service-led rather than network-led
    approximationNotes: >-
      Scores are ordinal analyst synthesis from the cited capability and network descriptions; they are not
      independently measured rankings or market shares.
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
      - CP010
  - id: FI001
    title: Publicly described activity-to-revenue bridge
    type: flow
    summary: >-
      The workflow is visible through patient access, but the paying contract and gross-profit conversion remain
      undisclosed.
    data:
      nodes:
        - id: prescription
          label: Prescription decision
          detail: A clinician selects treatment at the point of care.
        - id: access-workflow
          label: Access workflow
          detail: Tandem automates prior authorization submissions and appeals.
        - id: affordability-routing
          label: Affordability and routing
          detail: The service supports affordability and routes prescriptions to a pharmacy or site of care.
        - id: user-price
          label: Provider and patient price
          detail: $0 is publicly reported for providers and patients.
        - id: enterprise-contract
          label: Partnership or enterprise contract
          detail: Secondary coverage identifies the monetization layer but does not disclose the unit or rate.
        - id: gross-profit
          label: Revenue and gross profit
          detail: Conversion, recognized revenue, service cost, and gross margin are not disclosed.
    approximationNotes: >-
      Conceptual sequence only; no conversion rates, transaction volumes, revenue shares, or gross-profit amounts are
      available.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI016
  - id: FE001
    title: Evidence-backed product architecture map
    type: stack
    summary: >-
      A functional stack of publicly described workflow layers, with undisclosed implementation details marked as
      diligence gaps.
    data:
      layers:
        - label: Clinical trigger
          detail: A clinician writes a prescription.
          items:
            - Prescription event
            - Clinical decision context
          outputs:
            - Access workflow initiated
        - label: Intake and context
          detail: Reportedly gathers prior-medication and pharmacy-restriction context.
          items:
            - Medication history
            - Coverage restrictions
          outputs:
            - Authorization-ready context
        - label: Authorization execution
          detail: Submission, paperwork, phone-call, and appeal workflows.
          items:
            - Prior authorization
            - Appeal handling
          outputs:
            - Coverage response
        - label: Affordability support
          detail: Connects the prescription workflow to available affordability paths.
          items:
            - Program navigation
            - Patient coordination
          outputs:
            - Affordability path
        - label: Pharmacy and site routing
          detail: Routes to a preferred pharmacy or site of care.
          items:
            - Pharmacy selection
            - Inventory / restriction handling
          outputs:
            - Fulfillment destination
        - label: Visibility and partner surface
          detail: Doctors and patients receive status visibility; OpenEvidence supplies a disclosed partner entry point.
          items:
            - Status tracking
            - Partner integration
          outputs:
            - Prescription-access status
    approximationNotes: >-
      Functional evidence map only; it does not represent Tandem's undisclosed software, model, hosting, or security
      architecture.
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE007
      - CE008
      - CE011
      - CE012
      - CE016
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The public value proposition spans six workflow stages, while measured stage-level completion and conversion
      remain undisclosed.
    data:
      nodes:
        - label: Clinical decision
          detail: OpenEvidence partnership supplies evidence-based decision support at the point of care.
        - label: Prescription action
          detail: Tandem is positioned to turn the decision into prescription generation.
        - label: Authorization
          detail: The platform reportedly submits prior authorizations and manages appeals.
        - label: Affordability
          detail: The workflow includes enrollment in financial-support pathways where needed.
        - label: Pharmacy routing
          detail: The prescription is routed to the preferred pharmacy or site of care.
        - label: Treatment start
          detail: The intended endpoint is patient access; no retained source quantifies completion or elapsed time.
    approximationNotes: >-
      Ordered conceptual workflow from partnership descriptions; no conversion rates, stage volumes, or completion-time
      estimates are implied.
    claimRefs:
      - CU001
      - CU003
      - CU010
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      The risk ranking is qualitative and weights healthcare-workflow consequence plus the absence of Tandem-specific
      mitigation evidence.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: PHI governance failure
          values:
            - High
            - Critical
            - Not publicly evidenced
            - High
        - label: Payer or pharmacy handoff failure
          values:
            - High
            - Critical
            - Not publicly evidenced
            - High
        - label: Automation quality failure
          values:
            - Medium-high
            - Critical
            - Not independently benchmarked
            - High
        - label: Critical partner or intermediary outage
          values:
            - Medium
            - Critical
            - Not publicly evidenced
            - High
        - label: State-law compliance drift
          values:
            - Medium
            - High
            - Requires continuing monitoring
            - Medium-high
        - label: Financial and concentration opacity
          values:
            - High
            - High
            - Public disclosure incomplete
            - High
    approximationNotes: >-
      Ordinal assessments are not probabilities; they synthesize cited workflow, legal, comparable-outage, financing,
      and disclosure evidence.
    claimRefs:
      - CR016
