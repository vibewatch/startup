        title: Milestones and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Tandem's trajectory combines a 2023 founding, a 2025 founder recognition, 2026 financing and valuation
              disclosures, and two 2026 workflow partnerships. The external context is material: Holland & Knight's 2026
              survey of state laws describes requirements for clinical circumstances, human review, disclosures, and
              monitoring when AI is used around prior authorization, while Stanford researchers warn that opaque
              insurance AI can amplify wrongful denials without meaningful human review. These are sector-level
              constraints rather than allegations of a Tandem violation. DataMatrix, a competitor, argues Tandem is
              strongest for medication authorization automation but does not publish denial or accuracy metrics for
              Tandem. The company has not publicly supplied enough evidence to establish board oversight, customer
              concentration, security controls, realized revenue quality, or whether the reported funding totals are
