      - number: '5.4'
        title: Trust, safety, compliance, and quality controls
        blocks:
          - type: paragraph
            body: >-
              The reviewed pool does not document Tandem-specific security certifications, business associate terms,
              audit logs, model evaluation, bias testing, human-review thresholds, uptime, incident history, or disaster
              recovery. These are material omissions for software processing prescription and insurance data. KFF
              identifies inaccurate or biased outcomes and privacy breaches as sector risks, and notes that some
              coverage decisions require individualized clinical review rather than algorithm-only adjudication. Optum's
              disclosed governance board and human-in-the-middle approach provide a useful diligence benchmark, not
              evidence that Tandem uses the same controls. Investment diligence should require control artifacts and
              measured exception outcomes before treating the workflow breadth as safe or reliable at scale.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Architecture and control evidence is the core technical gap
            body: >-
              Public workflow descriptions are not substitutes for system diagrams, integration inventories, security
              attestations, uptime history, model evaluations, or documented human escalation rules.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and economic roles
        blocks:
          - type: paragraph
            body: >-
              The available evidence points to a multi-sided network rather than a conventional single-buyer software
              account. Provider practices and health systems are the principal workflow users, patients are
              beneficiaries who reportedly pay nothing, and biopharma companies appear to be the commercial customer
              segment most clearly described in the retained material. Pulse 2 relayed Forus's statements that thousands
              of practices and health systems use the platform across all 50 states and that five of the ten largest
              global biopharma companies work with it. PYMNTS separately reported that the service is free to providers
              and patients. Those statements support segmentation, but they do not disclose contracts, revenue mix,
              procurement owners, or whether every counted practice is active and paying through another side of the
              network. OpenEvidence is best classified as a distribution and workflow partner, not automatically as a
              customer.
            claimRefs:
              - CU001
              - CU005
              - CU007
              - CU008
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
              - CU008
              - CU014
      - number: '6.2'
        title: Adoption trajectory is broad but largely self-reported
        blocks:
          - type: paragraph
            body: >-
              Current third-party articles relay strong company-supplied adoption indicators: provider adoption
              reportedly increased tenfold year over year in each of the prior two years; usage spans thousands of
              practices and health systems; and the service reportedly reaches patients in nearly 80% of U.S.
              residential ZIP codes. PYMNTS also reported management's expectation that millions of patients would use
              the service in 2026. These measures are directionally consistent with expansion, but they mix growth,
              installed footprint, geographic reach, and a forward-looking patient forecast. They therefore cannot be
              combined into a conversion funnel or treated as equivalent active usage. No retained source supplies a
              dated active-account series, repeat-use rate, paid deployment count, or denominator for the tenfold growth
              statement. The trajectory is promising, but not independently audited.
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU009
      - number: '6.3'
        title: Named proof, retention, and concentration remain thin
        blocks:
          - type: paragraph
            body: >-
              The OpenEvidence partnership is the clearest named relationship in the assigned evidence. It connects
              clinical decision support to prescription generation and prior authorization submission, but the
              announcement does not disclose deployment volume, customer conversion, treatment-start improvement, or
              commercial terms. Aggregate references to thousands of provider organizations and five leading biopharma
              companies do not identify accounts or distinguish pilots from scaled production. None of the retained
              Tandem or Forus sources reports NRR, GRR, churn, renewal, contract length, or customer concentration.
              Consequently, retention and top-customer exposure remain private-evidence questions rather than negative
              conclusions. A similarly named European clinical-documentation company, Tandem Health, reports a different
              integration footprint; those figures must not be attributed to this prescription-access business.
            claimRefs:
              - CU001
              - CU005
              - CU007
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU007
              - CU012
              - CU013
              - CU016
      - number: '6.4'
        title: Workflow value depends on exception handling and production execution
        blocks:
          - type: paragraph
            body: >-
              The proposed customer journey is coherent: a clinical decision can trigger a prescription, authorization
              and appeal work, affordability support, pharmacy routing, and ultimately treatment initiation. Yet the
              retained evidence does not quantify how often Tandem completes that sequence or where cases drop out. A
              competitor assessment says the product is attractive for simple medication authorizations while arguing
              that complex cases still require human judgment and follow-up; because the publisher sells an alternative
              service, that critique is adverse evidence, not an independent benchmark. Separate named deployments from
              Alithya and MCG show what diligence-grade proof can look like: throughput measures, production status,
              named counterparties, implementation detail, and explicit baselines. Those comparator outcomes do not
              establish Tandem's performance, but they define the evidence needed to underwrite durable customer value.
            claimRefs:
              - CU003
              - CU010
              - CU011
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU010
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad reported footprint
            body: >-
              Company-supplied figures indicate thousands of provider organizations, reach across all 50 states, and
              commercial relationships with five of the ten largest global biopharma companies.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: callout
            title: Durability is not publicly measurable
            body: >-
              The retained evidence does not disclose retention, renewal, contract duration, account-level outcomes, or
              customer concentration, so the apparent reach cannot yet be translated into durable revenue quality.
            calloutType: risk
            claimRefs:
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Tandem operates in a workflow where protected health information, payer decisions, and medication access
              can intersect. The assigned evidence does not establish that Tandem makes clinical or coverage decisions,
              but the joint OpenEvidence release says the partnership connects clinical decision-making with
              prescription generation and prior authorization submission. That boundary needs to be explicit in product
              design and contracts. Foley says an AI vendor processing PHI needs a business associate agreement defining
              permitted data use and safeguards, while ITECS says a BAA alone does not make an unsafe workflow
              compliant. Manatt reports that multiple states now prohibit payers from using AI alone for adverse
              coverage decisions and that some healthcare-AI laws add notice, consent, or professional-review duties.
              These sources establish the regulatory direction, not Tandem's compliance. Residual exposure therefore
              remains high until diligence verifies data flows, minimum-necessary access, retention, subprocessors,
              human accountability, audit records, and state-by-state workflow classification.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.2'
        title: Operational, quality, and dependency exposure
        blocks:
          - type: paragraph
            body: >-
              Tandem's described product spans paperwork, phone calls, prior authorizations, appeals, affordability
              support, and pharmacy routing. This creates a chain of external handoffs where a payer-rule change,
              integration outage, queue backlog, routing failure, or incorrect automation can delay medication access
              even if the core software remains available. OpenEvidence also says it relies on signed content agreements
              with several medical publishers, adding an upstream content relationship to the partnership chain.
              Comparable-sector evidence shows the downside can be material: HIPAA Journal reports that the Change
              Healthcare outage halted critical payment and claims systems for about two months, and Becker's reports
              widespread care and financial disruption among hospitals. These events did not involve Tandem and do not
              prove Tandem has suffered an incident; they show why redundancy, recovery objectives, manual fallback,
              vendor oversight, and tested incident response are investment-critical. No Tandem-specific uptime,
              recovery, incident-history, fallback, or concentration evidence appears in the assigned pool.
            claimRefs:
              - CR001
              - CR004
              - CR010
              - CR011
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR008
              - CR015
      - number: '7.3'
        title: Financial and execution exposure
        blocks:
          - type: paragraph
            body: >-
              PYMNTS reported in January 2026 that Tandem was raising $100 million at a reported $1 billion valuation
              and had raised $137 million to date. That is financing evidence, not evidence of cash available, recurring
              revenue, gross margin, burn, runway, or customer concentration. The same article says the service is free
              to patients and providers, which increases the importance of identifying the actual payer, pricing
              mechanism, implementation cost, and margin by workflow. A competitor review from DataMatrix characterizes
              Tandem as suitable for simpler medication authorizations and says its denial rate is not published.
              Because DataMatrix sells an alternative service, those statements are adverse directional evidence rather
              than an independent performance benchmark. The sparse company-domain message, "Tandem is nowLearn More,"
              also leaves current public identity and transition details unclear. The underwriting position should
              remain conditional: failure to produce production quality, resilience, concentration, data-governance, and
              unit-economics evidence is a thesis-break trigger, not a disclosure inconvenience.
            claimRefs:
              - CR002
              - CR003
              - CR012
              - CR013
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-conviction residual risk
            body: >-
              A failure across payer, pharmacy, EHR, model, or partner handoffs could delay medication access while
              creating privacy, contractual, and reputational exposure; public evidence does not show Tandem's tested
              fallback or concentration limits.
            calloutType: risk
            claimRefs:
              - CR004
              - CR010
              - CR011
              - CR015
          - type: callout
            title: Investment kill criteria
            body: >-
              Pause underwriting if diligence cannot verify PHI governance, human accountability, production quality,
              service recovery, dependency concentration, and contribution economics with dated, denominator-based
              evidence.
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR009
              - CR013
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment view and price discipline
        blocks:
          - type: paragraph
            body: >-
              The investable thesis is that Tandem can convert a large administrative bottleneck into a scalable
              medication-access network. Publicly reported product descriptions say the platform automates prior
              authorizations, appeals, enrollment forms, and pharmacy routing, while an OpenEvidence partnership
              connects clinical decision support to prescription execution. A Doctor Care Anywhere deployment provides a
              concrete operating signal, with the partner describing use across 60,000 consultations per month. These
              are strategic and workflow indicators, not proof of revenue quality or gross margin. The anti-thesis is
              therefore price-sensitive: Tandem is offered at no cost to providers and patients in the cited reporting,
              while monetization terms, customer concentration, and unit economics remain unclear. A reported $1 billion
              post-money valuation and a reported $100 million financing should be treated as reported financing
              context, not independently verified fair value.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV010
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV010
              - CV013
              - CV015
      - number: '8.2'
        title: Scenario valuation and downside
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis is constrained by missing company financials. The bull case assumes the reported
              financing closes near the cited valuation, adoption expands through partners, and Tandem develops a
              durable biopharma or provider monetization layer; this could support a premium outcome, but no precise
              target return is supportable from the retained evidence. The base case treats the $1 billion mark as an
              unverified private financing reference and requires evidence of paid deployments, recurring revenue, gross
              margin, and renewal behavior before accepting it as an underwriting input. The bear case is a repricing if
              fundraising reports do not translate into paid scale, if the product remains limited to simpler
              authorization cases, or if workflow and integration complexity forces human services around the software.
              Public comparable evidence is directional only: Waystar trades at a reported enterprise-value-to-revenue
              multiple of 5.01x, but it is a profitable public RCM company with a materially different maturity and
              disclosure profile.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV013
              - CV015
      - number: '8.3'
        title: Entry conditions and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              A decision should remain conditional until management supplies a financing and operating packet. The
              minimum diligence set is a current cap table and term sheet, liquidation preference and participation
              terms, post-money ownership, debt and runway, paid customer count, cohort retention, revenue by customer
              and partner, gross margin by workflow, and evidence that integrations can scale beyond a narrow medication
              subset. The market is competitive and segmented: Black Book's 2026 provider survey ranked Infinx first in
              provider-side prior authorization automation and described prior authorization as a top operational
              bottleneck for 71% of validated respondents. DataMatrix's competitor review says Tandem is useful for
              simpler medication authorizations but not a complete end-to-end service; that is a competitor-issued view
              rather than an independent benchmark, but it identifies a testable product-boundary risk. The thesis
              breaks on a down round, weak paid conversion, material concentration, or inability to show reliable
              outcomes and governance.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Decision
            body: >-
              Research-more: accept the reported financing as evidence of investor interest, not as proof of fair value.
              Require a signed financing package and operating diligence before underwriting entry.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV010
              - CV013
          - type: callout
            title: Thesis-break trigger
            body: >-
              A down round, inability to show paid recurring monetization, material customer concentration, or failure
              to demonstrate reliable performance on complex authorizations should invalidate the current valuation
              thesis.
            calloutType: risk
            claimRefs:
              - CV007
              - CV014
              - CV015
