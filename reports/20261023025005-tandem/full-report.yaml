              - CP009
              - CP010
      - number: '3.3'
        title: Pricing, packaging, and switching
        blocks:
          - type: paragraph
            body: >-
              Public pricing is not comparable on a clean per-case basis. Tandem advertises no charge to providers and
              patients, while the independent profile says the paying-side motion is biopharma partnerships and that
              contract economics are undisclosed. DataMatrix advertises flexible hourly pricing starting at $12 per
              hour, but it is a human-services competitor with a different cost and accountability model. Incumbent
              platforms do not publish a comparable Tandem-style list price in the assigned evidence. Switching costs
              are consequently likely to concentrate in workflow integration, payer and pharmacy connectivity,
              clinical-document quality, and the accumulated operational knowledge of exception paths, not merely
              software license price. A diligence process should test migration effort, exportability of case history,
              multi-homing across e-PA portals, and whether manufacturer reporting creates lock-in.
            claimRefs:
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP012
              - CP014
              - CP016
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Tandem's moat case rests on combining workflow placement with a data and distribution network: the product
              page says it can operate through an EHR or uploaded records, while partner reporting describes integration
              into a clinical environment. That can reduce office burden, but the same evidence shows powerful
              alternatives. Optum describes electronic authorization as a real-time exchange with multiple portals and
              plan-specific review; Waystar claims a broad provider footprint and revenue-cycle suite; and Surescripts'
              touchless model can be dramatically faster when payer participation and programmable criteria are present.
              The adverse operating lesson from the Change Healthcare cyberattack is that healthcare connectivity is a
              concentration and resilience risk: AMA survey respondents reported ongoing disruption to eligibility,
              claims, remittance, and payments. Tandem's differentiation may persist in complex medication access, but
              durability depends on proving exception performance, redundancy, security controls, and manufacturer value
              that infrastructure incumbents cannot easily replicate.
            claimRefs:
              - CP015
              - CP016
              - CP017
              - CP018
              - CP019
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated medication-access scope
            body: >-
              Tandem's strongest defensible distinction is combining point-of-prescribing automation with appeals,
              affordability, pharmacy routing, and patient status rather than selling only an e-PA transaction.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP005
          - type: callout
            title: Incumbent distribution and resilience
            body: >-
              Large networks and concentrated healthcare infrastructure can compress Tandem's differentiation; diligence
              should test payer participation, fallback workflows, security evidence, and outage continuity.
            calloutType: risk
            claimRefs:
              - CP006
              - CP015
              - CP017
              - CP018
          - type: callout
            title: Underwrite by completed-case economics
            body: >-
              Compare completed therapy access, exception handling, and manufacturer reporting against network and
              human-service alternatives; public list pricing does not establish realized unit economics.
            calloutType: recommendation
            claimRefs:
              - CP012
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is plausible but internally inconsistent
        blocks:
          - type: paragraph
            body: >-
              The clearest public description is a subsidized workflow model: providers and patients use Tandem without
              charge, while partnerships and enterprise contracts are reported as the monetization layer. The
              OpenEvidence partnership shows how Tandem can enter the clinical workflow at the prescribing decision and
              carry the process through prior authorization, affordability support, and pharmacy routing, but the
              announcement contains no commercial terms. A Preqin profile creates an important contradiction by
              asserting that practices pay through subscriptions. Until management reconciles whether provider access is
              universally free, selectively subsidized, or sold under some contracts, neither payer identity nor revenue
              quality can be underwritten. Public list price of zero for users is therefore a distribution fact, not
              evidence of revenue, margin, or willingness to pay among enterprise partners.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
