chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Forbes reports that Sahir Jaggi started Forus in 2023 under the Tandem name to automate the administrative
              backend of prescriptions. The workflow begins when a physician writes a prescription and addresses prior
              authorization, prior medication history, pharmacy restrictions, affordability, and real-time status
              visibility. PYMNTS separately describes Tandem Technology as raising capital for software that eases
              writing and obtaining prescriptions, with paperwork and phone calls automated for prior authorization and
              pharmacy routing. The product is therefore best characterized as healthcare operations infrastructure, not
              a diagnostic system. Its identity is complicated by the July 2026 DataMatrix review, which says Tandem AI
              rebranded as Forus after a $160 million funding round; the underlying medication prior-authorization
              product is described as the same platform.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.2'
        title: Financing, monetization, and scale
        blocks:
          - type: paragraph
            body: >-
              The financing record is directionally strong but not internally uniform. Forbes reports a $1 billion
              valuation, $160 million in total funding, and annualized revenue above $50 million after revenue had
              roughly quintupled during the year. PYMNTS, citing unnamed sources, reports a $100 million round led by
              Accel at a $1 billion valuation and $137 million raised to date. These figures should not be blended: the
              two reports may reflect different financing cutoffs or definitions, and neither establishes cash
              available, burn, runway, margin, or a GAAP revenue base. Forbes says providers and patients are not
              charged and that pharmaceutical companies are commercial counterparties, while the company reportedly
              expects millions of patients to use its services in 2026. Public evidence does not establish active
              customer count or headcount.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO010
              - CO011
      - number: '1.3'
        title: Leadership and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The strongest public leadership evidence is concentrated in Jaggi. Forbes identifies him as founder and
              says he previously led product at Oscar Health, giving him direct exposure to prescription-coverage
              friction. A separate OpenEvidence release quotes Adam Harris, MD, as Tandem's Head of Clinical
              Intelligence, while the Doctor Care Anywhere announcement quotes Lukas Saari as CEO and co-founder of
              Tandem Health in the European clinical-workflow business. Those references may reflect operating entities
              or a broader leadership team, but they do not disclose board composition, investor control rights, or
              succession coverage. Partnerships with OpenEvidence and Doctor Care Anywhere demonstrate external workflow
              integration; they do not independently verify customer retention or economics. The stakeholder table
              therefore separates capital providers, operating partners, and governance diligence asks.
            claimRefs:
              - CO003
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO010
              - CO011
