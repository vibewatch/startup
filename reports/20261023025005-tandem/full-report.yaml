      - number: '5.3'
        title: Maturity, differentiation, and operational dependencies
        blocks:
          - type: paragraph
            body: >-
              Product maturity is supported by reported production use and a commercial model tied to
              pharmaceutical-company relationships, not by a published release history or technical benchmark. The
              potential differentiation is orchestration across provider, patient, payer, affordability, and pharmacy
              steps, plus real-time status visibility. That breadth also creates dependencies on accurate clinical data,
              payer rules, patient responsiveness, supported EHRs, and pharmacy inventory. A competitor review argues
              that Tandem is strongest for relatively straightforward medication authorizations and may require
              supported EHR integrations; its commercial bias warrants caution, but the critique identifies concrete
              exception-handling and human-oversight questions that should be tested in references and workflow logs.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE009
              - CE010
          - type: table
