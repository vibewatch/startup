company:
  name: Tandem
chapter:
  number: 7
  title: Risks
  summary: >-
    Tandem's largest residual exposures are regulated-data governance and operational
    dependency across payer, pharmacy, EHR, and partner handoffs. Public evidence describes
    the workflow and the surrounding legal and outage risks, but does not establish Tandem's
    own control effectiveness, concentration, recovery performance, or unit economics.
sections:
  - id: regulatory-and-legal-exposure
    title: Regulatory and legal exposure
    body: >-
      Tandem operates in a workflow where protected health information, payer decisions, and
      medication access can intersect. The assigned evidence does not establish that Tandem
      makes clinical or coverage decisions, but the joint OpenEvidence release says the
      partnership connects clinical decision-making with prescription generation and prior
      authorization submission. That boundary needs to be explicit in product design and
      contracts. Foley says an AI vendor processing PHI needs a business associate agreement
      defining permitted data use and safeguards, while ITECS says a BAA alone does not make
      an unsafe workflow compliant. Manatt reports that multiple states now prohibit payers
      from using AI alone for adverse coverage decisions and that some healthcare-AI laws add
      notice, consent, or professional-review duties. These sources establish the regulatory
      direction, not Tandem's compliance. Residual exposure therefore remains high until
      diligence verifies data flows, minimum-necessary access, retention, subprocessors,
      human accountability, audit records, and state-by-state workflow classification.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR001]
  - id: operational-quality-and-dependency
    title: Operational, quality, and dependency exposure
    body: >-
      Tandem's described product spans paperwork, phone calls, prior authorizations, appeals,
      affordability support, and pharmacy routing. This creates a chain of external handoffs
      where a payer-rule change, integration outage, queue backlog, routing failure, or
      incorrect automation can delay medication access even if the core software remains
      available. OpenEvidence also says it relies on signed content agreements with several
      medical publishers, adding an upstream content relationship to the partnership chain.
      Comparable-sector evidence shows the downside can be material: HIPAA Journal reports
      that the Change Healthcare outage halted critical payment and claims systems for about
      two months, and Becker's reports widespread care and financial disruption among
      hospitals. These events did not involve Tandem and do not prove Tandem has suffered an
      incident; they show why redundancy, recovery objectives, manual fallback, vendor
      oversight, and tested incident response are investment-critical. No Tandem-specific
      uptime, recovery, incident-history, fallback, or concentration evidence appears in the
      assigned pool.
    claimRefs: [CR001, CR004, CR010, CR011, CR015]
    tableRefs: [TR002, TR003]
  - id: financial-and-execution-exposure
    title: Financial and execution exposure
    body: >-
      PYMNTS reported in January 2026 that Tandem was raising $100 million at a reported
      $1 billion valuation and had raised $137 million to date. That is financing evidence,
      not evidence of cash available, recurring revenue, gross margin, burn, runway, or
      customer concentration. The same article says the service is free to patients and
      providers, which increases the importance of identifying the actual payer, pricing
      mechanism, implementation cost, and margin by workflow. A competitor review from
      DataMatrix characterizes Tandem as suitable for simpler medication authorizations and
      says its denial rate is not published. Because DataMatrix sells an alternative service,
      those statements are adverse directional evidence rather than an independent
      performance benchmark. The sparse company-domain message, "Tandem is nowLearn More,"
      also leaves current public identity and transition details unclear. The underwriting
      position should remain conditional: failure to produce production quality, resilience,
      concentration, data-governance, and unit-economics evidence is a thesis-break trigger,
      not a disclosure inconvenience.
    claimRefs: [CR002, CR003, CR012, CR013, CR014, CR016]
    figureRefs: [FR001]
tables:
