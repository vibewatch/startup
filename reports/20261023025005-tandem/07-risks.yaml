      - ["AI-assisted adverse coverage decisions", "State-by-state payer rules", "Several 2026 laws require human review", "Medium", "High", "Human review, escalation, appeal, and audit trail", "Medium-high", "Map every payer-facing function to applicable state law and responsible human reviewer"]
      - ["Patient notice and consent for AI use", "State-by-state healthcare rules", "Requirements vary by workflow and state", "Medium", "High", "Workflow-specific notice, consent, and recordkeeping", "Medium-high", "Review product surfaces and customer contracts by state, use case, and effective date"]
      - ["Model, connector, and data-flow change control", "HIPAA and contractual obligations", "External guidance only; company controls undisclosed", "High", "High", "Risk analysis, validation, rollback, and accountable approval", "High", "Inspect validation records, change logs, exceptions, and incident ownership"]
    notes: "Sources are Manatt, Foley, ITECS, and the joint partner release; likelihood, severity, and residual exposure are qualitative analyst assessments, not reported probabilities."
    enumerationScope:
      coverage: partial
      basis: "Publicly documented U.S. healthcare-AI and HIPAA exposures relevant to the described prescription-access workflow as of 2026-10-23."
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - ["Payer or pharmacy handoff failure delays access", "High", "Critical", "Workflow described; fallback not disclosed", "High", "No public uptime, routing-failure, queue, or recovery metrics"]
      - ["Automation error creates denial, rework, or unsafe delay", "Medium-high", "Critical", "Competitor commentary only; no independent production series", "High", "No denominator-based accuracy, denial, appeal, override, or human-review data"]
      - ["PHI exposure or cyber incident", "Medium", "Critical", "External control guidance only", "High", "No public Tandem incident history, assurance report, penetration-test summary, or notification terms"]
      - ["Critical intermediary outage causes cascading disruption", "Medium", "Critical", "No disclosed dependency map or tested redundancy", "High", "No counterparty concentration, RTO/RPO, failover evidence, or manual continuity results"]
    notes: "Comparable outage evidence comes from Change Healthcare and is not a Tandem incident; qualitative ratings reflect consequence and disclosure gaps rather than measured company failure rates."
    claimRefs: [CR010, CR011, CR012, CR013, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty or role
      - Concentration
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - ["Clinical evidence handoff", "OpenEvidence and its licensed content relationships", "Not disclosed", "Evidence or integration interruption breaks the path from decision support to access execution", "High", "SLA, content continuity, queue decoupling, and manual fallback", "Medium-high"]
      - ["Prior-authorization and appeal rules", "Payers and pharmacy benefit managers", "Not disclosed", "Rule change or rejection increases denials, appeals, and treatment delay", "Critical", "Versioned rules, human escalation, audit trail, and payer-specific monitoring", "High"]
      - ["Prescription routing and affordability support", "Pharmacies, sites of care, and support programs", "Not disclosed", "Routing or eligibility failure prevents dispensing or increases abandonment", "Critical", "Alternate routing, exception handling, and patient-support escalation", "High"]
      - ["Workflow infrastructure", "EHRs, model providers, connectors, and subprocessors", "Not disclosed", "Outage, model change, or data exposure interrupts service or creates a compliance event", "Critical", "Least privilege, change control, contractual accountability, and tested recovery", "High"]
    notes: "Roles come from company/partner descriptions and external guidance; concentration, contract protections, and mitigation performance are not disclosed in the assigned evidence."
    claimRefs: [CR001, CR004, CR005, CR008, CR015]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      The risk ranking is qualitative and weights healthcare-workflow consequence plus the
      absence of Tandem-specific mitigation evidence.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: PHI governance failure
          values: ["High", "Critical", "Not publicly evidenced", "High"]
        - label: Payer or pharmacy handoff failure
          values: ["High", "Critical", "Not publicly evidenced", "High"]
        - label: Automation quality failure
          values: ["Medium-high", "Critical", "Not independently benchmarked", "High"]
        - label: Critical partner or intermediary outage
          values: ["Medium", "Critical", "Not publicly evidenced", "High"]
        - label: State-law compliance drift
          values: ["Medium", "High", "Requires continuing monitoring", "Medium-high"]
        - label: Financial and concentration opacity
          values: ["High", "High", "Public disclosure incomplete", "High"]
    approximationNotes: "Ordinal assessments are not probabilities; they synthesize cited workflow, legal, comparable-outage, financing, and disclosure evidence."
    claimRefs: [CR016]
callouts:
  - calloutType: risk
    title: Highest-conviction residual risk
    body: >-
      A failure across payer, pharmacy, EHR, model, or partner handoffs could delay medication
      access while creating privacy, contractual, and reputational exposure; public evidence
      does not show Tandem's tested fallback or concentration limits.
    claimRefs: [CR004, CR010, CR011, CR015]
  - calloutType: recommendation
    title: Investment kill criteria
    body: >-
      Pause underwriting if diligence cannot verify PHI governance, human accountability,
      production quality, service recovery, dependency concentration, and contribution
      economics with dated, denominator-based evidence.
    claimRefs: [CR008, CR009, CR013, CR014, CR016]
