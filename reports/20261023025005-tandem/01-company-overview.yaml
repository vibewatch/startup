company:
  name: Tandem
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Tandem, now rebranded as Forus, is a prescription-access automation company
    founded by Sahir Jaggi. Current evidence supports a $1 billion valuation,
    substantial venture backing, and early provider and platform partnerships,
    but private-company disclosure leaves governance, customer concentration,
    headcount, and the funding total partly unresolved.
sections:
  - id: identity-and-product
    title: Identity and operating model
    body: >-
      Forbes reports that Sahir Jaggi started Forus in 2023 under the Tandem
      name to automate the administrative backend of prescriptions. The
      workflow begins when a physician writes a prescription and addresses
      prior authorization, prior medication history, pharmacy restrictions,
      affordability, and real-time status visibility. PYMNTS separately
      describes Tandem Technology as raising capital for software that eases
      writing and obtaining prescriptions, with paperwork and phone calls
      automated for prior authorization and pharmacy routing. The product is
      therefore best characterized as healthcare operations infrastructure,
      not a diagnostic system. Its identity is complicated by the July 2026
      DataMatrix review, which says Tandem AI rebranded as Forus after a
      $160 million funding round; the underlying medication prior-authorization
      product is described as the same platform.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: financing-and-scale
    title: Financing, monetization, and scale
    body: >-
      The financing record is directionally strong but not internally uniform.
      Forbes reports a $1 billion valuation, $160 million in total funding, and
      annualized revenue above $50 million after revenue had roughly quintupled
      during the year. PYMNTS, citing unnamed sources, reports a $100 million
      round led by Accel at a $1 billion valuation and $137 million raised to
      date. These figures should not be blended: the two reports may reflect
      different financing cutoffs or definitions, and neither establishes cash
      available, burn, runway, margin, or a GAAP revenue base. Forbes says
      providers and patients are not charged and that pharmaceutical companies
      are commercial counterparties, while the company reportedly expects
      millions of patients to use its services in 2026. Public evidence does
      not establish active customer count or headcount.
    claimRefs: [CO005, CO006, CO007, CO008, CO009]
    tableRefs: [TO002]
  - id: leadership-partners-and-governance
    title: Leadership and stakeholder map
    body: >-
      The strongest public leadership evidence is concentrated in Jaggi. Forbes
      identifies him as founder and says he previously led product at Oscar
      Health, giving him direct exposure to prescription-coverage friction.
      A separate OpenEvidence release quotes Adam Harris, MD, as Tandem's Head
      of Clinical Intelligence, while the Doctor Care Anywhere announcement
      quotes Lukas Saari as CEO and co-founder of Tandem Health in the European
      clinical-workflow business. Those references may reflect operating
      entities or a broader leadership team, but they do not disclose board
      composition, investor control rights, or succession coverage. Partnerships
      with OpenEvidence and Doctor Care Anywhere demonstrate external workflow
      integration; they do not independently verify customer retention or
      economics. The stakeholder table therefore separates capital providers,
      operating partners, and governance diligence asks.
    claimRefs: [CO003, CO010, CO011]
    tableRefs: [TO003]
  - id: milestones-and-risk-context
    title: Milestones and diligence implications
    body: >-
      Tandem's trajectory combines a 2023 founding, a 2025 founder recognition,
      2026 financing and valuation disclosures, and two 2026 workflow
      partnerships. The external context is material: Holland & Knight's 2026
      survey of state laws describes requirements for clinical circumstances,
      human review, disclosures, and monitoring when AI is used around prior
      authorization, while Stanford researchers warn that opaque insurance AI
      can amplify wrongful denials without meaningful human review. These are
      sector-level constraints rather than allegations of a Tandem violation.
      DataMatrix, a competitor, argues Tandem is strongest for medication
      authorization automation but does not publish denial or accuracy metrics
      for Tandem. The company has not publicly supplied enough evidence to
      establish board oversight, customer concentration, security controls,
      realized revenue quality, or whether the reported funding totals are
      comparable.
    claimRefs: [CO012, CO013, CO014]
    figureRefs: [FO001]
callouts:
  - calloutType: insight
    title: Strong traction signal, incomplete underwriting
    body: >-
      The $1 billion valuation and reported annualized revenue above $50 million
      are meaningful traction signals, but the $137 million versus $160 million
      funding discrepancy and limited private-company disclosure keep the
      financing and governance picture provisional.
    claimRefs: [CO005, CO006, CO007, CO008]
  - calloutType: risk
    title: Human oversight is a product and regulatory dependency
    body: >-
      State-law developments and independent ethics research make human review,
      patient-specific context, transparency, and monitoring central diligence
      questions for a company automating prescription-access workflows.
    claimRefs: [CO012, CO013]
