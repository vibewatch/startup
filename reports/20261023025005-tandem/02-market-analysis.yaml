artifact: market-analysis
slug: tandem
runDate: 2026-10-23
company:
  name: Tandem
chapter:
  number: 2
  title: Market Analysis
  summary: Tandem targets the post-prescription medication-access workflow, where low electronic prior-authorization penetration and documented provider burden create a credible automation wedge. Broad drug-spending and administrative-savings figures establish urgency but do not establish Tandem's TAM, SAM, SOM, pricing, or attainable share.
sections:
  - id: market-boundary
    title: Market boundary and status-quo substitutes
    body: >-
      The defensible core market is medication-access workflow automation after a
      clinician writes a prescription: insurance checks, documentation assembly,
      prior-authorization submission and appeal, affordability support, and
      pharmacy or site-of-care routing. The boundary excludes the value of the
      medicine itself, insurer premium revenue, general clinical decision support,
      and prior authorizations for procedures, imaging, and durable medical
      equipment. Current substitutes are practice staff, payer portals, fax,
      telephone follow-up, and outsourced authorization specialists. Tandem is
      reported to be free to providers and patients, but the retained sources do
      not disclose the paying customer or pricing basis. That missing commercial
      boundary matters more to sizing than the company's reported valuation.
    claimRefs: [CM001, CM002, CM015, CM016]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: >-
      No assigned source publishes a company-specific TAM, SAM, or SOM, so the
      market must be triangulated without converting unrelated denominators into
      software revenue. ASHP reported $915 billion of US prescription-drug
      spending in 2025 and projected more than $1 trillion in 2026; CMS separately
      reported more than $100 billion of gross Medicaid prescription-drug spending
      in 2024. Those figures describe drug economics, not Tandem's addressable
      fees. A closer operational lens is CAQH's $18.7 billion estimate of potential
      medical administrative savings from further automation, while 40% electronic
      prior-authorization penetration indicates remaining process headroom.
      Neither figure identifies eligible medication transactions, willingness to
      pay, or Tandem's attainable share.
    claimRefs: [CM003, CM004, CM005, CM006, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyer, user, payer, and adoption path
    body: >-
      Providers and access teams are the operational users, patients are the
      beneficiaries, and insurers or pharmacy-benefit managers control coverage
      decisions. Public evidence does not identify which participant funds Tandem,
      so buyer segmentation remains provisional: a practice or health system can
      justify adoption through lower labor and faster therapy starts, while a
      biopharma sponsor could value fewer abandoned prescriptions. The adoption
      path begins with EHR integration and reliable handling of routine cases,
      then depends on appeals, payer-specific exceptions, staff escalation, and
      patient participation. The strongest demand signal is workflow pain: the AMA
      reported 39 prior authorizations per physician per week, widespread care
      delays, treatment abandonment, and dedicated authorization staffing.
    claimRefs: [CM010, CM011, CM012, CM013, CM014, CM015]
    tableRefs: [TM003]
  - id: drivers-constraints-and-gaps
    title: Drivers, constraints, and underwriting gaps
    body: >-
      Growth is supported by rising prescription use, high specialty-drug spending,
      and a large gap between electronic and manual authorization workflows.
      Regulation can reduce friction but remains uneven: CMS's optional GENEROUS
      Medicaid model would introduce uniform coverage criteria only for
      participating states and manufacturers. Execution risk is material because
      payer rules vary, integrations can constrain deployment, and edge cases still
      require judgment and communication. DataMatrix, a competitor rather than an
      independent benchmark, argues that Tandem is best suited to simpler
      medication authorizations and that broader categories need human support.
      Underwriting therefore requires transaction eligibility, exception rates,
      authorization outcomes, implementation costs, contracted pricing, retention,
      and independently verified customer ROI.
    claimRefs: [CM004, CM007, CM009, CM016]
callouts:
  - calloutType: insight
    title: Market urgency is not market size
    body: Prescription spending and administrative savings validate the importance of the workflow, but neither is a valid proxy for Tandem's software revenue opportunity.
    claimRefs: [CM003, CM005, CM006, CM008]
  - calloutType: risk
    title: The paying customer remains undisclosed
    body: Public sources identify providers as users and patients as beneficiaries while describing the product as free to both, leaving budget ownership and pricing unverified.
    claimRefs: [CM002, CM015]
  - calloutType: recommendation
    title: Underwrite from eligible transactions
    body: Require a bottoms-up model covering medication-authorization volume, attach rate, pricing, exception handling, implementation cost, retention, and customer-level ROI.
    claimRefs: [CM009, CM015, CM016]
tables:
  - id: TM001
    title: Market definition and boundary
    columns: [Segment or category, Included spend or activity, Excluded spend or activity, Buyer or payer, Relevance]
    rows:
      - ["Medication prior authorization", "Coverage checks, documentation, submission, and appeals for prescribed medicines", "Procedure, imaging, and durable-medical-equipment authorizations", "Provider organization; insurer or PBM adjudicates", "Core workflow"]
      - ["Affordability and routing", "Copay support and routing to a pharmacy or site of care", "The acquisition value of the medicine itself", "Provider, patient, pharmacy, and possible sponsor", "Core workflow extension"]
      - ["Provider administrative labor", "Staff time spent preparing and following authorization requests", "General clinical labor unrelated to medication access", "Practice or health-system operations", "Primary ROI pool"]
      - ["Outsourced authorization services", "Human specialists handling submissions, calls, exceptions, and appeals", "General revenue-cycle and billing services", "Practice or health-system operations", "Status-quo substitute"]
      - ["Broad prescription economy", "Context on therapy volume, spending growth, and access pressure", "Drug spend treated as software TAM", "Patients, plans, employers, government, and providers", "Context only"]
    notes: The boundary is an analytical scope derived from retained workflow descriptions; no source publishes a Tandem-specific TAM, and drug spend is explicitly excluded as a software-revenue proxy.
    claimRefs: [CM001, CM002, CM003, CM015, CM016]
  - id: TM002
    title: Sizing and adoption lenses
    columns: [Publisher, Period, Geography, Metric, Method, Confidence, Limitation]
    rows:
      - ["ASHP", "2025", "United States", "$915B prescription-drug spending; 12.7% annual increase", "Annual drug-expenditure report", "High", "Drug spend is not software TAM"]
      - ["ASHP", "2026 projection", "United States", "More than $1T prescription-drug spending", "Annual forecast based on expenditure trends", "High", "Forecast is not an addressable-fee estimate"]
      - ["CMS/HHS", "2024", "US Medicaid", "More than $100B gross and $60B after rebates", "Administrative program spending reported by CMS", "High", "Program spend is not Tandem revenue"]
      - ["CAQH via AJMC", "2025 Index covering 2024", "United States", "$18.7B potential medical administrative savings", "Data from 600 provider organizations and plans representing 63% of insured lives", "Medium", "Savings span workflows beyond medication authorization"]
      - ["CAQH via Chief Healthcare Executive", "2024 transactions", "United States", "40% of prior-authorization transactions electronic", "CAQH transaction-adoption measure", "Medium", "No transaction count, price, or attainable share"]
    notes: Rows use different units, populations, and periods and must not be added or converted into TAM, SAM, or SOM; confidence rates source authority, not company applicability.
    claimRefs: [CM003, CM004, CM005, CM006, CM008, CM009]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer or counterparty, Workflow, Adoption trigger]
    rows:
      - ["Specialty practice", "Practice owner or operations leader", "Clinician and authorization staff", "Insurer or PBM adjudicates; budget owner undisclosed", "Coverage check through appeal and routing", "High weekly volume and dedicated staff cost"]
      - ["Health system", "Service-line, pharmacy, or digital leader", "Access teams, clinicians, and pharmacy staff", "Multiple plans and PBMs; budget owner undisclosed", "Integrated multi-payer medication access", "Measured labor savings and faster therapy initiation"]
      - ["Independent authorization service", "Practice outsourcing decision-maker", "Human authorization specialists", "Acts for provider against insurer requirements", "Calls, forms, exceptions, and appeals", "Need for broad coverage and human escalation"]
      - ["Patient", "Not identified as a paying customer", "Patient or caregiver supplies information", "Health plan and benefit design determine coverage", "Affordability and pharmacy handoff", "Lower delay and treatment abandonment"]
      - ["Biopharma company", "Market-access or patient-services leader", "Field and patient-services teams", "Possible commercial sponsor; no contract evidence", "Access support for prescribed therapy", "Improved prescription completion with compliant economics"]
    notes: Buyer and budget-owner assignments are hypotheses constrained by the reported free-to-provider-and-patient model; contracts, pricing, and sponsor economics remain private-evidence gaps.
    claimRefs: [CM002, CM010, CM011, CM012, CM013, CM014, CM015, CM016]
figures:
  - id: FM001
    title: Market evidence pyramid, not derived TAM/SAM/SOM
    type: pyramid
    summary: Six sourced indicators move from broad prescription economics to workflow burden and adoption, with no arithmetic conversion into Tandem revenue.
    data:
      items:
        - label: US prescription-drug spending in 2025
          value: 915
          unit: USD billions
          detail: ASHP reported expenditure level
        - label: Annual prescription-spending increase in 2025
          value: 12.7
          unit: percent
          detail: ASHP reported year-over-year increase
        - label: Projected US prescription-drug spending in 2026
          value: ">1000"
          unit: USD billions
          detail: ASHP forecast; not software revenue
        - label: Potential medical administrative savings
          value: 18.7
          unit: USD billions
          detail: CAQH estimate reported by AJMC
        - label: Prior-authorization transactions handled electronically
          value: 40
          unit: percent in 2024
          detail: CAQH adoption measure reported by Chief Healthcare Executive
        - label: Average prior authorizations per physician
          value: 39
          unit: per week
          detail: AMA 2024 physician survey
    approximationNotes: Values retain their original units, periods, and denominators. Layers are contextual indicators rather than nested populations, widths are not value-proportional, and no TAM, SAM, SOM, conversion rate, or revenue estimate is derived.
    claimRefs: [CM003, CM004, CM005, CM008, CM009, CM010]
