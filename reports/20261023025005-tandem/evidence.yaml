evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A cap-table or financing history reconciling the $137 million and $160 million reported totals and the reported
      $100 million round.
    whyItMatters: Funding totals affect dilution, ownership, runway assumptions, and comparability of the reported valuation.
    diligencePath: Request executed financing documents, cap table, and a bridge from each reported financing total to cash proceeds.
    relatedQuestionRefs:
      - QO003
      - QO004
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, investor rights, executive bench, and succession coverage.
    whyItMatters: >-
      The public record is concentrated on one founder and does not establish control, oversight, or key-person
      resilience.
    diligencePath: Obtain the board register, charter and investor-rights summary, executive roster, and succession plan.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: scale
    missingEvidence: Verified active customer, patient, partner, headcount, retention, margin, burn, and runway metrics.
    whyItMatters: >-
      Valuation and revenue claims cannot be converted into operating quality or cash-need conclusions without
      denominators and unit economics.
    diligencePath: >-
      Request a current KPI pack with definitions, periods, cohort retention, customer concentration, headcount, margin,
      burn, and runway.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: missing-source
    severity: material
    topic: security
    missingEvidence: >-
      Tandem/Forus security, privacy, clinical-safety, and data-governance controls for prescription and partner
      workflows.
    whyItMatters: >-
      The product handles sensitive healthcare workflows and operates in a regulatory environment emphasizing oversight
      and patient-specific context.
    diligencePath: >-
      Request SOC 2 or equivalent reports, BAAs, data-flow maps, model-monitoring evidence, incident history, and
      clinical-safety documentation.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map
    missingEvidence: A complete investor, board, executive, customer, and strategic-partner census.
    whyItMatters: The public stakeholder sample may omit parties with material control, concentration, or commercial influence.
    diligencePath: >-
      Reconcile the public map to the cap table, board materials, contract register, and current customer and partner
      lists.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: serviceable-market
    missingEvidence: >-
      A company-specific count of eligible medication-access transactions, contracted pricing, attach rates, and
      attainable share.
    whyItMatters: >-
      Broad drug spending and administrative savings cannot be converted into Tandem revenue without the relevant
      transaction and pricing denominators.
    diligencePath: >-
      Request management's bottoms-up TAM, SAM, and SOM model with transaction-level source data, exclusions, and
      sensitivity cases.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-economics
    missingEvidence: >-
      Independent customer cohorts showing implementation time, exception handling, authorization outcomes, labor
      savings, contracted price, and renewal behavior.
    whyItMatters: Documented market pain establishes need but not product ROI, willingness to pay, or durable adoption.
    diligencePath: >-
      Obtain anonymized pre/post customer data, reference calls, renewal cohorts, and a reconciliation of automated
      versus manually escalated cases.
    relatedQuestionRefs:
