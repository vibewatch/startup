company:
  name: Tandem
chapter:
  number: 3
  title: Competitors
  summary: Tandem/Forus competes in medication-access automation, where broad connectivity incumbents, touchless prior-authorization networks, payer-side decision platforms, and human outsourcing services address overlapping but non-identical jobs. The strongest differentiation is an end-to-end, point-of-prescribing workflow, but public evidence leaves payer reach, exception handling, realized pricing, and resilience to incumbent distribution advantages unresolved.
sections:
  - id: landscape
    title: Competitive landscape and buyer jobs
    body: >-
      Tandem's relevant market is broader than electronic prior-authorization form completion. Its
      public workflow spans prescription intake, benefits and clinical-document collection, prior
      authorization submission, appeals, patient-support enrollment, pharmacy routing, and status
      communication. Rx Almanac describes Forus, the company's later name, as free to providers and
      patients and paid through biopharma partnerships, while the company's own practice page says
      it is free and supports multiple plans, drugs, and pharmacies. That creates a three-sided
      competitive set: medication-access vendors selling to manufacturers, provider workflow tools,
      and infrastructure platforms that already sit between prescribers, pharmacies, payers, or
      revenue-cycle teams. The buyer must therefore compare not just automation depth but the
      network position and data rights needed to complete a case after an initial submission.
    claimRefs: [CP001, CP002, CP004]
    tableRefs: [TP001]
  - id: capability
    title: Capability, distribution, and trust comparison
    body: >-
      The capability comparison is asymmetric by design. CoverMyMeds and Surescripts emphasize
      network reach or rapid decisions for qualifying, programmable cases; Waystar embeds
      authorization in a broader revenue-cycle suite; Cohere operates primarily on the payer side;
      and DataMatrix represents the human, end-to-end outsourcing substitute. Tandem/Forus instead
      claims a medication-access workflow that combines authorization, appeals, affordability, and
      pharmacy routing. Independent comparison material places Tandem among deeper specialty-
      medication options but also says its coverage is primarily medication prior authorizations,
      while the competitor's own critique says automation can leave gaps when cases require payer
      nuance, phone calls, or human judgment. These are positioning statements rather than
      controlled benchmark results, so the matrix marks unsupported performance and compliance
      cells as unknown rather than treating vendor claims as proof.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP010]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: economics
    title: Pricing, packaging, and switching
    body: >-
      Public pricing is not comparable on a clean per-case basis. Tandem advertises no charge to
      providers and patients, while the independent profile says the paying-side motion is
      biopharma partnerships and that contract economics are undisclosed. DataMatrix advertises
      flexible hourly pricing starting at $12 per hour, but it is a human-services competitor with
      a different cost and accountability model. Incumbent platforms do not publish a comparable
      Tandem-style list price in the assigned evidence. Switching costs are consequently likely to
      concentrate in workflow integration, payer and pharmacy connectivity, clinical-document
      quality, and the accumulated operational knowledge of exception paths, not merely software
      license price. A diligence process should test migration effort, exportability of case history,
      multi-homing across e-PA portals, and whether manufacturer reporting creates lock-in.
    claimRefs: [CP012, CP014]
    tableRefs: [TP003]
  - id: durability
    title: Moat durability and displacement risk
    body: >-
      Tandem's moat case rests on combining workflow placement with a data and distribution
      network: the product page says it can operate through an EHR or uploaded records, while
      partner reporting describes integration into a clinical environment. That can reduce office
      burden, but the same evidence shows powerful alternatives. Optum describes electronic
      authorization as a real-time exchange with multiple portals and plan-specific review; Waystar
      claims a broad provider footprint and revenue-cycle suite; and Surescripts' touchless model
      can be dramatically faster when payer participation and programmable criteria are present.
      The adverse operating lesson from the Change Healthcare cyberattack is that healthcare
      connectivity is a concentration and resilience risk: AMA survey respondents reported ongoing
      disruption to eligibility, claims, remittance, and payments. Tandem's differentiation may
      persist in complex medication access, but durability depends on proving exception performance,
      redundancy, security controls, and manufacturer value that infrastructure incumbents cannot
      easily replicate.
    claimRefs: [CP015, CP016, CP017, CP018, CP019]

tables:
  - id: TP001
    title: Competitor profile and buyer job
    columns: [Competitor or alternative, Category, Target buyer/job, Public scale or scope, Differentiation, Limitation or unknown]
    rows:
      - [Tandem/Forus, Direct medication-access platform, Providers and biopharma teams seeking prescription-to-therapy execution, "Thousands of providers claimed; no independently verified count", "PA plus appeals, affordability, routing, and status in one workflow", "Payer reach, realized pricing, and exception rates undisclosed"]
      - [CoverMyMeds, Incumbent e-PA network, Broad provider/pharmacy/payer connectivity, "Claims about 90% of electronic PA volume and 950,000+ professionals in Neon comparison", "Large network and EHR/pharmacy integrations", "Decision speed remains dependent on payer processing"]
      - [Surescripts, Network and touchless PA, Providers and payers with programmable criteria, "22–27 second median touchless decisions cited in Neon comparison", "Very fast routine-case decisions when payer participates", "Less suited to complex specialty cases; participation required"]
      - [Waystar, Incumbent revenue-cycle suite, Health systems wanting authorization inside RCM, "60% of U.S. patient population and 1M+ providers claimed on official site", "Authorization, denial, payments, and analytics in one platform", "Performance varies by implementation; not medication-access-specific"]
      - [Cohere Health, Payer-side adjacent, Payers seeking clinical-review automation, "No assigned public scale metric", "Guideline-based review and real-time routine decisions", "Provider value is indirect and depends on payer adoption"]
      - [DataMatrix Medical, Human-services substitute, Practices needing end-to-end PA and billing support, "25 years of healthcare operations claimed", "Human review, phone calls, broad authorization categories", "Higher-touch model; competitor-authored performance claims"]
    notes: "Scope and scale combine official/vendor claims with independent or competitor comparison material; figures labeled claimed are not independently verified, and unknown cells are intentionally preserved."
    claimRefs: [CP001, CP005, CP006, CP007, CP008, CP009, CP010]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, Tandem/Forus, CoverMyMeds or Surescripts, Waystar or Cohere, Human outsourcing, Evidence implication]
    rows:
      - [Medication PA submission, "Core capability claimed", "Core network capability", "Available in broader authorization or payer workflows", "Core capability", "Tandem is not differentiated by submission alone"]
      - [Appeals and denial follow-up, "Appeals and payer follow-up claimed", "Reach is clear; depth not established", "Denial management or payer review varies by platform", "Full-spectrum support claimed", "Test complex-case completion and human escalation"]
      - ["Benefits, affordability, and patient support", "Benefits and affordability workflow claimed", "Hub or pharmacy connectivity varies; not established here", "Patient financial care available in Waystar; Cohere fit is payer-side", "Insurance verification claimed", "Broader access stack is Tandem's clearest scope distinction"]
      - ["EHR and workflow integration", "EHR integration or upload path claimed", "Major EHR/pharmacy integrations cited", "Epic, Cerner, and MEDITECH integrations cited for Waystar", "EHR-agnostic claim from competitor", "Integration depth and implementation burden require references"]
      - ["Routine-case speed", "24-hour form-completion claim; no independent benchmark", "22–27 second touchless median when criteria are met", "Real-time routine review claimed for Cohere", "No comparable speed metric", "Do not compare unlike denominators or workflows"]
      - ["Security, resilience, and governance", "HIPAA/SOC 2/BAA claimed on practice page", "Network scale implies dependency; controls not reviewed here", "Enterprise platform claims; detailed controls not assigned", "Human accountability claimed", "Obtain audit reports, incident history, BAA terms, and continuity evidence"]
    notes: "The matrix distinguishes documented capability from performance and governance evidence. 'Not established here' is an evidence gap, not a negative finding."
    claimRefs: [CP002, CP005, CP006, CP007, CP008, CP009, CP015, CP017]
  - id: TP003
    title: Pricing, packaging, and switching comparison
    columns: [Alternative, Public price or payer model, Included scope, Switching or lock-in driver, Diligence implication]
    rows:
      - [Tandem/Forus, "Free to providers and patients; biopharma partnership economics", "Medication access workflow from PA through routing and status", "EHR placement, case history, manufacturer reporting, and network connections", "Request contract economics, data-use rights, and exit/export terms"]
      - [DataMatrix Medical, "Flexible hourly pricing starting at $12/hr", "Human PA, billing, virtual assistants, and follow-up", "Operational knowledge and human escalation", "Compare total cost per completed case, not list price"]
      - [CoverMyMeds, "Not stated in assigned evidence", "Broad e-PA connectivity", "Network effects and workflow familiarity", "Obtain payer/pharmacy coverage and commercial terms"]
      - [Surescripts, "Not stated in assigned evidence", "e-prescribing network and touchless PA for qualifying cases", "Payer participation and programmable criteria", "Test eligibility share and fallback path"]
      - [Waystar, "Not stated in assigned evidence", "Revenue-cycle, authorization, denial, and payment workflows", "Existing RCM integration and provider footprint", "Model migration cost and bundled-suite tradeoffs"]
    notes: "Public list or model disclosures are incomplete and non-comparable; no realized revenue, margin, or per-case economics are inferred from these pages."
    claimRefs: [CP012, CP014, CP016]

figures:
  - id: FP001
    title: Competitive positioning by workflow breadth and network leverage
    type: quadrant
    summary: "An evidence-backed ordinal map separates broad network incumbents from medication-access specialists; positions are analytical scores, not market-share measurements."
    data:
      xAxis: "Workflow breadth: 1 = PA-only or narrow, 5 = end-to-end access"
      yAxis: "Network leverage: 1 = local/service-led, 5 = scaled payer/provider/pharmacy network"
      points:
        - {label: "Tandem/Forus", x: 4, y: 3, note: "PA, appeals, affordability, routing; provider/EHR and partner evidence, but network scale not independently verified"}
        - {label: "CoverMyMeds", x: 3, y: 5, note: "Broad connectivity and network claims; downstream decision speed remains payer-dependent"}
        - {label: "Surescripts", x: 2, y: 5, note: "National e-prescribing network and touchless PA for qualifying cases"}
        - {label: "Waystar", x: 4, y: 4, note: "Broad revenue-cycle suite and provider footprint; medication-specific depth uncertain"}
        - {label: "Cohere Health", x: 3, y: 4, note: "Payer-side clinical review; provider benefit depends on payer adoption"}
        - {label: "DataMatrix Medical", x: 5, y: 1, note: "Broad human service scope but service-led rather than network-led"}
    approximationNotes: "Scores are ordinal analyst synthesis from the cited capability and network descriptions; they are not independently measured rankings or market shares."
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP010]

callouts:
  - calloutType: strength
    title: "Integrated medication-access scope"
    body: "Tandem's strongest defensible distinction is combining point-of-prescribing automation with appeals, affordability, pharmacy routing, and patient status rather than selling only an e-PA transaction."
    claimRefs: [CP001, CP002, CP005]
  - calloutType: risk
    title: "Incumbent distribution and resilience"
    body: "Large networks and concentrated healthcare infrastructure can compress Tandem's differentiation; diligence should test payer participation, fallback workflows, security evidence, and outage continuity."
    claimRefs: [CP006, CP015, CP017, CP018]
  - calloutType: recommendation
    title: "Underwrite by completed-case economics"
    body: "Compare completed therapy access, exception handling, and manufacturer reporting against network and human-service alternatives; public list pricing does not establish realized unit economics."
    claimRefs: [CP012, CP014]

