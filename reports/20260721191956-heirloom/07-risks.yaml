- id: TR005
  title: Heirloom mitigation and kill criteria monitor
  columns:
  - Risk
  - Monitorable trigger
  - Threshold/event
  - Action implication
  rows:
  - - DOE grant and policy continuity
    - DOE award status and public funding notices
    - Pause, clawback, or missed milestone lasting more than two quarters
    - Stop treating Project Cypress as funded base case; require revised financing plan
  - - NEPA and environmental review
    - EIS schedule and record of decision
    - Final EIS/ROD slips materially beyond management plan or scope expands
    - Reprice schedule; condition investment on permit path
  - - Class VI and storage MRV
    - Permit applications, primacy status, Subpart RR MRV approval
    - No credible storage-permit path before facility commissioning
    - Block scale-up revenue in model until storage path is resolved
  - - 45Q economics
    - Tax counsel memo, transfer-market terms, IRS guidance
    - Eligibility, transferability, or direct-pay value materially impaired
    - Increase cost of capital and require customer-price sensitivity
  - - Facility ramp and uptime
    - Net verified tons per month and uptime
    - Two consecutive quarters below plan without root-cause fix
    - Move from base case to bear case and pause follow-on capital
  - - MRV or buyer certificate quality
    - Verifier exceptions and buyer acceptance
    - Major verifier qualification or buyer refuses certificate acceptance
    - Suspend revenue recognition for affected tons
  - - Community acceptance
    - Community-benefits commitments and grievance log
    - Unresolved material opposition, litigation, or unmet local benefits
    - Delay IC approval until resolution plan is signed
  - - People and partner execution
    - Executive attrition and PMO milestone dashboard
    - Loss of CEO/COO-equivalent or repeated partner milestone misses
    - Require governance reset, operating hire, or milestone-based tranche
  notes: Thresholds are diligence triggers, not company guidance; calibrate against private management plan before investment.
