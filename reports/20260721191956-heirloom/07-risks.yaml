  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-legal
    missingEvidence: Complete list of Project Cypress federal, state, local, storage, community-benefit, grant, and tax covenants.
    whyItMatters: Public sources reveal major regimes but not every approval or covenant that can delay financing or revenue.
    diligencePath: Request permit matrix, award agreement, tax memo, community-benefits plan, and storage-contract exhibits
      from management.
    relatedQuestionRefs:
    - QR002
    - QR024
    - QR025
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: blocking
    topic: operational-metrics
    missingEvidence: Facility-level uptime, net captured tons, energy intensity, maintenance cost, and verifier exception
      history.
    whyItMatters: Without operating curves, the scale-up and cost-overrun risk cannot be quantified rather than ranked qualitatively.
    diligencePath: Inspect plant dashboards, monthly operating reports, root-cause analyses, and verified delivery reconciliations.
    relatedQuestionRefs:
    - QR008
    - QR026
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Counterparty concentration, substitution rights, milestone covenants, offtake delivery schedules, and
      storage partner obligations.
    whyItMatters: The public dependency map cannot determine whether Heirloom can replace a failing partner or absorb a delayed
      counterparty.
    diligencePath: Review Project Cypress consortium agreement, offtake contracts, storage agreements, PPAs, and project-finance
      covenants.
    relatedQuestionRefs:
    - QR014
    - QR027
    - QR030
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: people-execution
    missingEvidence: Executive succession, plant-operations org chart, hiring plan, retention risk, and PMO milestone ownership.
    whyItMatters: Rapid growth can hide bottlenecks until facility commissioning, regulatory execution, or buyer delivery
      milestones slip.
    diligencePath: Interview executive bench, review org chart by workstream, analyze open requisitions, and test board succession
      planning.
    relatedQuestionRefs:
    - QR018
    - QR019
    - QR020
    - QR028
    relatedTableRefs:
    - TR004
  - type: conflicting-data
    severity: material
    topic: 45q-policy
    missingEvidence: Current tax-counsel view reconciling statutory 45Q text, IRS page, transfer-market terms, and 2026 policy
      proposals.
    whyItMatters: 45Q value and transferability can alter cost of capital, customer pricing, and Project Cypress financing
      structure.
    diligencePath: Obtain outside tax memo, transferability quote, recapture analysis, and sensitivity case without 45Q transfer
      proceeds.
    relatedQuestionRefs:
    - QR003
    - QR004
    - QR005
    relatedTableRefs:
    - TR005
