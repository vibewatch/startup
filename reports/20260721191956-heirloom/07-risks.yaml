- id: partner-dependency
  title: Partner and dependency risks
  body: 'Heirloom''s scaling plan is partner-rich by design. Project Cypress depends on Battelle as hub lead, Climeworks as
    the other DAC technology provider, DOE as grantor, Louisiana and federal regulators as storage gatekeepers, renewable-energy
    providers as operating inputs, and Microsoft and Frontier-style buyers as the demand proof needed to finance facilities.
    This structure can be a strength if every counterparty executes, but it creates correlated failure modes: a DOE pause
    reduces capital confidence; a Climeworks controversy contaminates DAC credibility; a storage-permit delay strands capture
    modules; a community-benefit dispute slows local approvals; and an offtake slip weakens bankability. The dependency map
    is therefore a diligence roadmap. Investors should require counterparty status, substitution rights, storage route evidence,
    renewable-energy procurement status, buyer delivery schedules, and escalation rights before underwriting Project Cypress
    as a near-term value driver.'
  claimRefs:
  - CR001
  - CR021
  - CR022
  - CR023
