slug: heirloom
runDate: '2026-07-21'
company:
  name: Heirloom Carbon Technologies
chapter:
  number: 7
  title: Risk Assessment
  summary: 'Heirloom''s most material risks are not abstract DAC skepticism but specific gating dependencies: DOE/45Q policy,
    Project Cypress environmental review, Class VI storage, MRV acceptance, plant ramp, partner synchronization, and hiring
    depth. Public mitigations exist, but residual exposure remains high until private operating metrics, permit paths, contract
    rights, and kill triggers are verified.'
sections:
- id: severity-frame
  title: Severity frame and residual exposure
  body: Heirloom's risk profile is not a single science risk; it is a stacked execution chain in which public policy, storage
    regulation, plant learning, offtake credibility, and organizational scale all have to clear together. The highest residual
    exposures are regulatory and project-finance dependencies around Project Cypress, because DOE funding continuity, environmental
    review, Class VI storage approvals, Subpart RR MRV, and 45Q economics can each interrupt scaled removals before the customer
    promise is fulfilled. Operationally, the public proof point remains a Tracy facility disclosed at roughly 1,000 tons per
    year and nearly 1,000 operating hours, while the financing case requires facilities orders of magnitude larger to perform
    reliably. That gap makes severity high even where likelihood is only medium. The heatmap therefore treats policy/MRV/storage
    as high-impact risks, and treats partner and people risks as accelerants that transmit schedule slippage into customer
    confidence, margins, financing, and valuation.
  claimRefs:
  - CR011
  - CR013
  - CR031
  - CR032
  - CR033
  - CR034
  - CR045
  - CR046
  - CR048
  figureRefs:
  - FR001
  - FR002
- id: regulatory-legal
  title: Regulatory and legal risks
  body: 'The most immediate legal/regulatory diligence work is Project Cypress rather than Heirloom''s corporate entity. DOE
    is preparing an EIS for financial assistance to Battelle, while earlier budget-period activity had a categorical exclusion;
    that sequencing means the company can show progress but cannot treat full-scale Louisiana deployment as de-risked. Storage
    is a second gate: Class VI wells, state primacy, Subpart RR MRV, and UIC financial-responsibility obligations govern whether
    captured CO2 can be injected, monitored, and certified without long-tail liabilities. A third gate is 45Q. IRS guidance
    makes the credit available to qualifying DAC facilities and transferable or directly payable, but adverse 2026 sources
    show activists and policy writers still contest subsidy durability and transferability. Kill criteria should therefore
    be anchored in observable regulatory events: EIS delay, Class VI path failure, 45Q transfer impairment, DOE award pause,
    or community-benefit commitments that remain non-measurable.'
  claimRefs:
