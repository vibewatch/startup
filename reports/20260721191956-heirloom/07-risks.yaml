- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Rule/license/case
  - Jurisdiction
  - Status
  - Likelihood
  - Severity
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - DOE Project Cypress award and EIS
    - U.S. federal / Louisiana
    - Initial funding awarded; DOE preparing EIS
    - Medium
    - High
    - Community-benefits plan, staged DOE funding, EIS process
    - Award pause, EIS delay, or scope change can defer hub revenue
    - Read award terms, EIS schedule, clawback covenants, and community-benefits milestones
  - - Class VI wells and Louisiana primacy
    - EPA / Louisiana
    - Class VI regime defined; Louisiana primacy has been subject to EPA public process
    - Medium
    - High
    - Use permitted storage partners and regulator engagement
    - Permit timing, primacy challenge, or well integrity conditions can strand capture capacity
    - Verify storage counterparty permits, monitoring area, pore-space rights, and appeal risk
  - - Subpart RR geologic-sequestration MRV
    - EPA greenhouse-gas reporting
    - EPA-approved MRV plans required for geologic sequestration reporters
    - Medium
    - High
    - Align storage MRV with EPA and buyer verification standards
    - MRV rejection can block credit issuance and 45Q support
    - Review EPA MRV plan status, verifier comments, and reconciliation to buyer protocols
  - - Section 45Q tax credit
    - U.S. tax law / IRS
    - Credit exists with DAC thresholds and transfer/direct-pay paths
    - Medium
    - High
    - Structure financing around qualified facilities and conservative credit timing
    - Policy, transferability, qualification, or recapture risk can impair economics
    - Obtain tax memo, eligibility model, transfer-market quotes, and recapture analysis
  - - Community-benefits and environmental justice commitments
    - DOE / local Louisiana communities
    - DOE commitments announced; measurable benefits still need proof
    - Medium
    - Medium
    - Community council, labor commitments, local engagement
    - Opposition or unmet commitments can slow permits and damage buyer confidence
    - Review community-benefits plan, minutes, complaints, local MOUs, and grievance process
  notes: Enumeration is a partial public-source register ordered by severity; private permits, grant covenants, and contracts
    may add items.
