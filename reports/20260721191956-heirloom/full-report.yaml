        title: People and execution risks
        blocks:
          - type: paragraph
            body: >-
              The public people signal is rapid growth rather than proven large-plant operating depth. Heirloom says it
              is growing quickly and that new roles will continue opening; its public announcements also concentrate
              executive voice around CEO Shashank Samala in major customer and financing milestones. That does not prove
              a weakness, but it does define the diligence ask: confirm succession coverage, plant-operations
              leadership, project controls, safety/compliance leadership, community-engagement capacity, MRV quality
              ownership, and project-finance bandwidth. The Series B broadens the stakeholder set with strategic
              airlines, industrials, and climate investors, which raises coordination load while the company is also
              scaling facilities and regulatory obligations. A people risk becomes thesis-breaking if management
              turnover, hiring shortfalls, or matrixed partner governance prevents the company from converting grants
              and offtakes into verified tons on schedule.
