      - number: '3.3'
        title: Capability, GTM, and trust posture
        blocks:
          - type: paragraph
            body: >-
              For durable-CDR buyers, the winning product is not only a capture machine; it is a contracted tonne with
              credible MRV, storage, delivery timing, and procurement defensibility. Heirloom's public contracts
              emphasize measurement, reporting, verification, and permanent storage, while its Frontier profile frames
              DAC as durable, measurable, and compact but still cost challenged. 1PointFive's trust posture is
              different: it can attach DAC to Occidental's subsurface and permitting capabilities, which is a real
              infrastructure advantage but may raise buyer concerns about fossil incumbent optics. Climeworks can point
              to operating history, projects, and storage partners, yet its cost and performance disclosures remain a
              diligence issue. Adjacent pathways have different trust trade-offs: biochar has delivery liquidity and
              registry methodologies, while ocean alkalinity has large theoretical capacity but model uncertainty. The
              practical result is multi-homing, with buyers allocating across methods to diversify technology risk
              rather than locking into one supplier.
