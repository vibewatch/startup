      - number: '5.3'
        title: 'Operating architecture: low-cost inputs, high-integrity dependencies'
        blocks:
          - type: paragraph
            body: >-
              The architecture has four coupled layers. First is mineral handling: limestone feedstock, hydration, tray
              contactors, and repeated cycling. Second is thermal regeneration: electric kilns and calcination equipment
              that must deliver a concentrated CO2 stream without fossil combustion. Third is plant and site
              infrastructure: land, renewable electricity, water, controls, labor, and logistics. Fourth is storage and
              credit issuance: concrete mineralization or underground sequestration, registry-grade MRV, and customer
              delivery. This is a differentiated architecture because it leans on cheap limestone, mature kiln concepts,
              modular warehouses, and operational learning rather than a breakthrough sorbent. It is also fragile: a
              bottleneck in clean power procurement, Class VI storage, pipeline access, equipment scale-up, or
              measurement data can delay tonnes even if the contactor chemistry performs.
