      - - Leilac electric calcination partnership
        - Supplies a potential future reactor path for high-purity CO2 and calcium oxide
        - License/collaboration execution and integration with Heirloom plants
        - Technology transfer from cement/lime pilots to DAC assets may slip or underperform
      - - Controls, data, and learning loop
        - Optimizes uptake rate and plant operations from operating data
        - Sensors, algorithms, process engineers, and high-quality measurement data
        - Public evidence does not yet quantify uptime, failure modes, or algorithmic lift
      - - Additional renewable energy
        - Keeps process emissions from eroding net removals
        - PPAs, grid accounting, and location/time matching where feasible
        - DAC competes for clean electrons with grid decarbonization and data-center load
      - - CO2 transport and storage
        - Turns captured CO2 into durable removals
        - Concrete partners, Class VI wells, pipelines, and storage operators
