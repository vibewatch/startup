      - number: '7.2'
        title: Regulatory and legal risks
        blocks:
          - type: paragraph
            body: >-
              The most immediate legal/regulatory diligence work is Project Cypress rather than Heirloom's corporate
              entity. DOE is preparing an EIS for financial assistance to Battelle, while earlier budget-period activity
              had a categorical exclusion; that sequencing means the company can show progress but cannot treat
              full-scale Louisiana deployment as de-risked. Storage is a second gate: Class VI wells, state primacy,
              Subpart RR MRV, and UIC financial-responsibility obligations govern whether captured CO2 can be injected,
              monitored, and certified without long-tail liabilities. A third gate is 45Q. IRS guidance makes the credit
              available to qualifying DAC facilities and transferable or directly payable, but adverse 2026 sources show
              activists and policy writers still contest subsidy durability and transferability. Kill criteria should
              therefore be anchored in observable regulatory events: EIS delay, Class VI path failure, 45Q transfer
              impairment, DOE award pause, or community-benefit commitments that remain non-measurable.
            claimRefs:
