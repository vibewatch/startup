      - number: '5.2'
        title: 'Workflow: accelerating limestone mineralization into a three-day industrial loop'
        blocks:
          - type: paragraph
            body: >-
              The core workflow begins by heating limestone-derived material so CO2 is released and captured, leaving
              calcium oxide that is hydrated into a reactive lime material. That material is placed on vertically
              stacked trays, exposed to ambient air, treated with water, and cycled until it absorbs CO2 and returns
              toward calcium carbonate. Heirloom and Frontier describe the carbonation step as days rather than years,
              with Frontier specifying roughly three days and Heirloom reporting 85% carbonation extents in 2.5 days in
              earlier development work. The measurable benefit is a shorter sorbent cycle using abundant minerals rather
              than bespoke chemical media. The limitation is that the technology converts a chemistry advantage into a
              materials-handling and energy-infrastructure problem: trays, kilns, clean electricity, compression,
              transport, storage, and MRV must all work as a system for each net tonne.
            claimRefs:
              - CE003
