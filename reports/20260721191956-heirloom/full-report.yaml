      - number: '3.4'
        title: Switching costs, lock-in, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Switching costs are low before a project reaches financial close and higher after a buyer signs a
              long-term offtake tied to milestones, MRV, delivery schedules, and storage infrastructure. Corporate
              buyers can and do multi-home: CDR.fyi shows Microsoft and Frontier as large purchasers, and the same
              ecosystem has backed Heirloom, 1PointFive, biochar suppliers, and early ocean approaches. Supplier lock-in
              instead comes from project finance. Heirloom's Microsoft release explicitly argues that bankable
              agreements reduce cost of capital; Frontier's Heirloom deal includes milestones, MRV scope, and options
              for lower-priced future tonnes. Distribution power therefore sits with a narrow buyer set and specialized
              marketplaces rather than with any one DAC vendor. That buyer concentration creates pricing pressure and
              milestone discipline: if Heirloom misses cost or delivery targets, purchasers can allocate marginal
              budgets to 1PointFive scale, Climeworks portfolios, or cheaper substitute methods.
