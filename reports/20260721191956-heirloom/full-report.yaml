      - number: '8.2'
        title: 'Thesis and anti-thesis: proof quality is strong, but the proof is not yet self-funding scale'
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on unusually strong signals for an early DAC platform: Microsoft’s large offtake,
              Frontier’s buyer coalition, the Tracy commercial facility, Project Cypress eligibility, and a strategic
              investor syndicate that reaches aviation, shipping, manufacturing, and Japanese finance. Those signals
              matter because DAC is not valued like software; a credible company must coordinate buyers, project
              finance, storage, renewable power, permitting, and plant learning. The anti-thesis is equally
              evidence-based. Durable CDR buyer growth remains narrow, buyer hesitation is visible in market reports,
              and public sources still show the industry’s core cost challenge. The same DOE award and strategic
              investor list that support the bull case also prove the model is capital-intensive and externally
              financed. The recommendation therefore changes only if Heirloom demonstrates repeatable delivered tonnes,
              lower cost per tonne, and broadening demand outside a small group of climate-leading buyers.
            claimRefs:
