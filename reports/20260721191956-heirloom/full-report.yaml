  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: research-more, with price discipline before any buy call'
        blocks:
          - type: paragraph
            body: >-
              Heirloom is a high-quality DAC company, but the public evidence does not support a clean buy
              recommendation at an unspecified late-stage private price. The chapter’s stance is research-more / track:
              the company has strong demand validation, named strategic investors, DOE-linked project momentum, and
              early commercial proof, yet the official valuation is undisclosed and the secondary-market evidence is
              incomplete. Forge provides a concrete lower-bound post-money estimate near $696 million, while the
              diligence playbook’s wider ~$695 million to $900 million range must be treated as conflicting and
              estimated rather than a confirmed unicorn mark. At that range, the decision hinges less on climate-market
              enthusiasm and more on private plant economics, cap-table terms, and milestone risk. A buyer should not
              treat the $150 million Series B as self-validating; it should insist on proprietary diligence, structured
              downside protection, and entry price discipline. This posture preserves optionality: Heirloom may be the
              right company in the right market, but the available public record does not yet convert that quality
              signal into a price-insensitive recommendation. The burden of proof should shift to the company and
              sellers to show why ordinary venture dilution, project delays, and cost-curve risk are already reflected
              in the entry terms.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV041
              - CV045
