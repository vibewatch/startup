  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product lines: credits backed by modular DAC assets'
        blocks:
          - type: paragraph
            body: >-
              Heirloom’s sellable product is not a standalone machine; it is a permanent carbon-removal credit produced
              by company-operated limestone DAC assets and delivered to corporate climate buyers. The operational asset
              base starts with the Tracy, California commercial facility and extends to planned Louisiana facilities
              tied to Project Cypress and separate Northwest Louisiana deployments. That framing matters for diligence
              because the buyer receives a verified tonne, while Heirloom must execute an integrated industrial
              workflow: source limestone, run kilns and passive contactors, procure additional clean power, move CO2 to
              concrete or geologic storage, and document the net removal. The maturity signal is real but early. Tracy
              is commercial and active, yet at roughly 1,000 tonnes per year it is a learning plant, not proof that the
              same architecture can run at hundreds of thousands of tonnes per year with predictable uptime, net energy
              efficiency, storage permits, and financeable delivery risk.
