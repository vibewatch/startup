        title: Sizing lenses show a large need but a small delivered market
        blocks:
          - type: paragraph
            body: >-
              The strongest market read is multi-lens rather than a single headline TAM. The outer climate-need lens is
              gigaton-scale: RMI and the State of CDR assessment frame removals as unavoidable for hard-to-abate
              residual emissions, and CDR.fyi cites a roughly 4 Gt durable-CDR pathway by 2050. The disclosed-demand
              lens is much smaller but now measurable: CDR.fyi reports 2.3 Mt contracted in Q1 2026 and roughly 46.4 Mt
              disclosed durable CDR contracts implied by Microsoft’s April 2026 share. The DAC lens is smaller still:
              2.47 Mt of DAC credits were contracted between 2022 and 2025-H1, but only 1,186 tonnes had been delivered
              by mid-2025. Revenue publishers converge on about $1.7B of global DAC revenue by 2030, yet their long-term
              outputs remain summary-level estimates rather than independently auditable SAM/SOM.
