  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: durable removals, not generic offsets'
        blocks:
          - type: paragraph
            body: >-
              Heirloom should be underwritten against the durable carbon dioxide removal market, with direct air capture
              as one high-cost, high-permanence pathway inside that boundary. The included spend is not every voluntary
              carbon credit, every avoided-emissions offset, or every corporate climate budget line. It is the portion
              of buyer budgets that pays for verified atmospheric CO2 removal, plus the enabling spend that turns
              removals into bankable supply: project development, capture equipment, measurement and verification,
              storage, and long-term offtake finance. Adjacent budgets matter because they are substitutes. A
              sustainability team can first buy renewable energy, reduce Scope 1-3 emissions, purchase cheaper
              nature-based offsets, or wait for compliance rules before paying for DAC. That makes market definition a
              gating diligence step: the broad climate-budget TAM is real, but Heirloom's serviceable market depends on
              durable-removal standards, corporate willingness to pay, and financeable supply.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
