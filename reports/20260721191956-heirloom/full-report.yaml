            body: >-
              Heirloom’s public customer base is best understood as a set of buyers of durable carbon removal rather
              than users of a conventional software product. The payer is usually a corporate climate, sustainability,
              or procurement team; the user is the buyer’s carbon-accounting and net-zero program; and the ultimate
              operational workflow is Heirloom’s capture, storage, MRV, and certificate delivery chain. The strongest
              named segment is enterprise net-zero buyers, anchored by Microsoft’s up-to-315,000-ton contract and the
              Frontier coalition of Stripe, Meta, Shopify, JPMorgan, McKinsey, Workday, H&M, and Autodesk. A second
              segment is early-market catalytic buyers such as Shopify, which funded an initial deployment and then
              added a multi-year offtake signal. A third emerging segment is hard-to-abate aviation, where the United
              Airlines Ventures Sustainable Flight Fund secured a large purchase right for CDR that may support
              sustainable aviation fuel or storage. The gap is that public sources disclose buyer quality and tons far
