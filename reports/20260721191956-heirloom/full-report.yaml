      - number: '3.2'
        title: Scale, funding, customer proof, and price signals
        blocks:
          - type: paragraph
            body: >-
              The competitive field splits by scale proof. 1PointFive has the largest named single-site design at
              STRATOS, a 500,000-tonne-per-year facility backed by Occidental, a $550 million BlackRock joint venture,
              Microsoft and Amazon offtakes, and Class VI sequestration permits. Climeworks has the deepest operating
              history, multiple Iceland projects, and a service-layer portfolio, but public adverse reporting shows cost
              and utilization risk that buyers will price into future DAC contracts. Heirloom has a smaller currently
              operating footprint than those two peers, yet it has unusually strong customer validation for its stage:
              the Microsoft agreement for up to 315,000 tonnes, Frontier's 26,900-tonne purchase, and planned Louisiana
              facilities approaching 320,000 tonnes per year create a financeable path if milestones are met. Emerging
              DAC entrants Sustaera, Avnos, and Zero Carbon Systems remain earlier: their claims focus on cost
              architecture, water co-products, supply-chain fit, or inherited IP rather than delivered volumes at
              industrial scale.
