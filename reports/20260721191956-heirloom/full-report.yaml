      - number: '7.3'
        title: Operational, quality, and MRV risks
        blocks:
          - type: paragraph
            body: >-
              Operational risk is dominated by scale translation. Heirloom's Tracy facility proves commercial operation,
              renewable-energy sourcing, and a pathway to permanent storage, but public evidence does not disclose a
              complete uptime curve, capture-cost curve, net-energy intensity, or verified delivery history by offtake
              contract. That is why Frontier's customer-facing risk note matters: it identifies stubbornly high costs
              and insufficient demand as the core scale-up failure mode. MRV and permanence are equally material because
              buyers purchase verified net removal, not gross capture. DOE buyer guidance, Isometric protocol work,
              Puro.earth certification criteria, EPA Subpart RR, and EPA UIC financial-responsibility rules all show
              that quantification, monitoring, durability, and liability controls must be accepted by regulators and
              credit buyers. Climeworks' public operating-data scrutiny is not a direct Heirloom failure, but it is a
              relevant proxy for how quickly DAC plants can lose credibility when performance claims are not
              transparent.
