  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity frame and residual exposure
        blocks:
          - type: paragraph
            body: >-
              Heirloom's risk profile is not a single science risk; it is a stacked execution chain in which public
              policy, storage regulation, plant learning, offtake credibility, and organizational scale all have to
              clear together. The highest residual exposures are regulatory and project-finance dependencies around
              Project Cypress, because DOE funding continuity, environmental review, Class VI storage approvals, Subpart
              RR MRV, and 45Q economics can each interrupt scaled removals before the customer promise is fulfilled.
              Operationally, the public proof point remains a Tracy facility disclosed at roughly 1,000 tons per year
              and nearly 1,000 operating hours, while the financing case requires facilities orders of magnitude larger
              to perform reliably. That gap makes severity high even where likelihood is only medium. The heatmap
              therefore treats policy/MRV/storage as high-impact risks, and treats partner and people risks as
              accelerants that transmit schedule slippage into customer confidence, margins, financing, and valuation.
            claimRefs:
              - CR011
              - CR013
              - CR031
