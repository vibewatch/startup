      - number: '6.5'
        title: Expansion and concentration risk diligence path
        blocks:
          - type: paragraph
            body: >-
              The central traction risk is concentration around Microsoft paired with a delivery backlog. On a narrow
              public-tonnage basis that counts Microsoft, Frontier, and Shopify disclosed CDR commitments but excludes
              United’s option-like SAF/storage right, Microsoft represents roughly 92% of named contracted tons.
              Including the United right would diversify headline demand, but that instrument is different: it is a
              right to purchase up to 500,000 tons and may be used for SAF production or storage, so it should not be
              blended mechanically with delivered permanent-removal cohorts. Expansion upside is visible in Frontier
              options, policy and compliance-market development, Louisiana capacity, and hard-to-abate strategic
              investors. Diligence should therefore test five items: buyer-level delivery schedules, enforceability and
              pricing of future options, Microsoft payment and termination terms, storage-permit critical path, and
              whether non-Microsoft buyers are willing to sign larger follow-on commitments after first deliveries.
