    title: Valuation thesis-break and kill triggers
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Entry price discipline
        - Confirmed round or secondary quote above $900M without protective terms
        - Compresses expected return before scale and cost proof are verified
        - Pass or require tranched valuation and downside preference
      - - Cost curve miss
        - No credible private data path below $200/tCO2 by early 2030s
        - Leaves DAC dependent on premium voluntary buyers and subsidies
        - Do not invest until plant KPIs improve
      - - Scale proof stall
        - No independently verified delivered scale beyond Tracy and contracted pilots
        - Weakens move from commercial proof to infrastructure platform
        - Reprice to technology-option value
      - - Project Cypress slippage
        - DOE draw, private match, permit, storage, or construction milestones slip materially
        - Undermines bull-case volume and financing leverage
        - Pause investment until milestone reset is documented
      - - Buyer concentration
        - Backlog remains dominated by Microsoft, Frontier, and climate-leader buyers
        - Limits TAM conversion and financing bankability
        - Demand discount and require customer pipeline diligence
      - - Policy / storage dependency
        - 45Q, Class VI, storage partner, or community approval assumptions weaken
        - Raises project cost of capital and delivery risk
        - Require contingency plan or pass
