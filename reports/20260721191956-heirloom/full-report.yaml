  - id: FV001
    title: Valuation recommendation logic chain
    type: flow
    layout: wide
    summary: >-
      A price-sensitive research-more call follows from strong proof signals but unresolved cost, scale, and valuation
      evidence.
    data:
      nodes:
        - id: proof
          label: Proof signals
          detail: Microsoft, Frontier, Tracy facility, DOE hub
        - id: scale
          label: Scale bridge
          detail: Louisiana / Project Cypress must convert pilots into infrastructure
        - id: economics
          label: Economics test
          detail: Cost path must move from $600-$1,000/tCO2 toward <$200/tCO2
        - id: market
          label: Demand test
          detail: Buyer base must broaden beyond climate leaders
        - id: valuation
          label: Valuation test
          detail: Undisclosed; secondary estimate lower bound near $696M; top end unverified
        - id: decision
          label: Recommendation
          detail: Research-more / track with price protection
      edges:
        - from: proof
          to: scale
          label: validated demand requires volume
        - from: scale
          to: economics
          label: volume only matters if cost declines
        - from: economics
          to: market
          label: price must unlock buyers
        - from: market
          to: valuation
          label: demand supports return multiple
        - from: valuation
          to: decision
          label: opacity gates investment
    approximationNotes: Qualitative IC decision flow; no implied causal certainty.
    claimRefs:
      - CV006
      - CV007
      - CV012
      - CV015
      - CV016
      - CV041
      - CV045
  - id: FV002
    title: Valuation sensitivity to four unresolved drivers
    type: bar
    layout: standard
    summary: Cost and delivered volume are more decisive than a headline round size.
    data:
      items:
        - label: Cost / tonne path
          value: 5
          unit: sensitivity score
          note: Failure to approach <$200/tCO2 breaks scale adoption
        - label: Delivered volume
          value: 4
          unit: sensitivity score
          note: Move from 1,000 t/yr proof to hundreds of thousands of tonnes
        - label: Buyer breadth
          value: 4
          unit: sensitivity score
          note: Repeat non-tech and compliance demand lowers market risk
        - label: Entry valuation / terms
          value: 4
          unit: sensitivity score
          note: $695M-$900M range leaves limited room for error
        - label: DOE / project finance
          value: 3
          unit: sensitivity score
          note: Milestones affect capital intensity and timing
    approximationNotes: Ordinal 1-5 IC sensitivity score derived from public evidence and diligence gaps.
