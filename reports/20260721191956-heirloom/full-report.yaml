      - number: '2.4'
        title: Growth drivers are powerful, but adoption constraints are structural
        blocks:
          - type: paragraph
            body: >-
              The positive case rests on hard-to-abate residual emissions, policy support, certification, and bankable
              offtake. DOE’s Regional DAC Hubs aim for million-ton annual hub potential, 45Q procedures and IRA updates
              make tax-credit compliance central to project finance, and the EU CRCF plus Japan’s GX-ETS transition
              point toward a compliance layer. But the constraints are just as material. DAC remains energy- and
              capital-intensive; Grand View Research explicitly flags high operating cost and energy intensity. Booked
              demand is concentrated in a handful of buyers, delivered DAC tonnes remain tiny versus contracted volumes,
              and CDR.fyi’s buyer research points to unresolved carbon accounting, standards, procurement fit, and
              risk-sharing as blockers. These are not cosmetic adoption frictions: they determine whether offtakes are
              repeatable project-finance collateral or one-off climate-tech demonstrations.
