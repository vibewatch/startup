      - number: '2.5'
        title: Contradictions and diligence gaps to preserve
        blocks:
          - type: paragraph
            body: >-
              The diligence posture should preserve contradictory market signals rather than averaging them away.
              Forecast publishers show explosive DAC revenue CAGR and near-term 2030 estimates near $1.7B, while
              operating data show that delivered DAC removals are still measured in thousands, not millions, of tonnes.
              Corporate net-zero commitments are not the same as funded CDR budgets; Carbon Market Watch’s critique of
              weak 2030 emissions-reduction plans is a direct warning against assuming that every net-zero logo becomes
              a durable-removal customer. Compliance markets could unlock durable demand, but the January 2026 policy
              review says binding mechanisms remain fragmented and supply readiness may be moving faster than demand
              obligations. The next diligence cycle therefore needs contract-level price curves, delivery schedules,
              tax-credit qualification, storage access, and buyer repeat-rate evidence before converting TAM into SOM or
              valuation upside.
            claimRefs:
              - CM018
              - CM026
              - CM039
              - CM040
              - CM041
