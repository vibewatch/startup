companyProfile:
  summary: >-
    Heirloom Carbon Technologies is a San Francisco–based direct air capture (DAC) company founded in 2020 that sells
    permanent carbon dioxide removal. Its approach accelerates the natural weathering of limestone — releasing CO2 from
    calcined limestone with renewable-powered kilns and re-exposing the resulting oxide to the air so it re-absorbs
    atmospheric CO2 in roughly three days — then permanently stores the captured CO2. Heirloom opened North America's
    first commercial DAC facility in Tracy, California in November 2023 and is a technology provider in the DOE-backed
    Project Cypress hub in Louisiana. It has attracted marquee carbon-removal buyers (Microsoft, Stripe, Meta, Shopify,
    JPMorgan via Frontier) and closed a $150M Series B in December 2024, but remains pre-scale with undisclosed
    financials.
