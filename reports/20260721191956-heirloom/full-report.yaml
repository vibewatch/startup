      - number: '8.4'
        title: 'Kill triggers and final asks: convert public promise into investable underwriting evidence'
        blocks:
          - type: paragraph
            body: >-
              The next diligence cycle should be framed around kill triggers, not incremental narrative comfort. A
              confirmed entry price above the unverified $900 million top-end estimate without preference protection
              should trigger a pass. A failure to show credible progress from current DAC cost levels toward sub-$200
              per tonne should also break the thesis, because buyer breadth and project finance depend on affordability.
              Scale and Project Cypress are equally decisive: if DOE draw conditions, matching capital, permits, storage
              contracts, or construction timelines slip materially, the bull case loses its volume bridge. Final
              diligence must therefore demand the cap table, plant-level cost and uptime data, full offtake contracts,
              project-finance documents, customer pipeline evidence, and a comparable valuation bridge. Until those
              documents are reviewed, public evidence supports continued research and relationship-building, not an
              unconditional investment recommendation.
