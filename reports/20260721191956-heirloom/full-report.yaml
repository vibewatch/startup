  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: DAC peers, substitutes, and buyer alternatives'
        blocks:
          - type: paragraph
            body: >-
              Heirloom competes first against direct air-capture suppliers, not generic offsets. Its closest technical
              peers are Climeworks' solid-sorbent DAC portfolio, 1PointFive/Occidental's Carbon Engineering
              liquid-solvent STRATOS platform, Avnos' hybrid DAC that also produces water, Sustaera's modular alkaline
              DAC, and the Global Thermostat assets now held by Zero Carbon Systems. The buyer's job, however, is
              broader than buying DAC: Microsoft, Frontier members, Amazon, JPMorgan, Shopify, airlines, and other
              durable-CDR purchasers can multi-home across DAC, biochar, BECCS, enhanced weathering, mineralization,
              biomass storage, and ocean alkalinity. They can also defer purchases, buy conventional offsets or
              emissions reductions, or fund internal climate projects while durable CDR remains expensive. That makes
              the status quo and substitute pathways material competitors even when their permanence, MRV, and brand
              claims are not identical to DAC. Heirloom's near-term positioning is therefore a portfolio slot:
              high-durability U.S. DAC with limestone input advantages and bankable offtakes, but not yet the largest
              disclosed deployment pipeline.
