    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing, and Revenue Recognition
        blocks:
          - type: paragraph
            body: >-
              Heirloom’s public revenue model is a carbon-removal infrastructure model, not a software or hardware
              resale model. The company sells durable carbon dioxide removal credits through long-term offtake contracts
              with buyers that can tolerate early DAC prices in exchange for high-durability removals, MRV, and
              permanent storage. The two clearest price anchors are the Microsoft agreement and the Frontier agreement:
              Microsoft contracted for up to 315,000 metric tons and third-party coverage estimated roughly $200
              million, while Frontier buyers contracted for 26,900 tons at $26.6 million. Those contracts imply headline
              prices in the hundreds to nearly one thousand dollars per ton, but they are not the same as recognized
              revenue. Revenue quality depends on facility delivery, measured removal, verified storage, milestone
              compliance, and whether options for lower-priced future tons convert into realized volume. The accounting
              diligence question is therefore backlog-to-revenue conversion, not simply announced contract value.
