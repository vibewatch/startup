      - number: '1.1'
        title: Identity, product, and current stage
        blocks:
          - type: paragraph
            body: >-
              Heirloom Carbon Technologies is best treated as a private, venture-backed Series B climate-technology
              company in direct air capture, founded in 2020 and anchored in the San Francisco/Brisbane, California
              area. Its one-line product is permanent carbon removal produced by limestone-based DAC facilities: the
              company heats limestone, hydrates the resulting material, exposes it to air so it reabsorbs CO2 in roughly
              three days rather than years, then releases and permanently stores the CO2 while regenerating the
              material. That mechanism supports a business model based on selling verified carbon-removal tons to
              corporate buyers and strategics, not selling hardware or software licenses. The practical scale baseline
              is still early: the Tracy, California facility is the North American commercial proof point at about 1,000
              tons per year, while Louisiana/Project Cypress is the announced scale-up path. Later chapters should reuse
              this as the ground truth and avoid implying audited revenue, broad customer count, or a confirmed unicorn
              valuation.
