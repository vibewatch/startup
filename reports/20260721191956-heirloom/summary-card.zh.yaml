  topStrengths:
    - 明星客户带来可信需求：Microsoft 最高 315,000 吨采购，加上 Frontier 买家 Stripe、Meta、Shopify、JPMorgan，验证了 Heirloom 碳移除的长期 CDR 需求。
    - 部署领先：北美首个商业 DAC 设施（2023 年加州 Tracy）和 DOE 支持的 Louisiana 枢纽，让公司在运营和政策资本上先跑一步。
    - 低成本路径清晰，股东阵容强：用充足石灰岩把目标成本压到约 $100/tonne，并获得 Lowercarbon、Breakthrough Energy Ventures 和战略工业方支持。
  topRisks:
    - 单位经济尚未证明：当前 DAC 成本仍在每吨数百美元高位，远高于约 $100/tonne 目标；实际工厂成本和利润率没有披露。
    - 补贴和政策依赖重：计划靠 Section 45Q 抵免和 DOE Project Cypress 资金支撑，税收政策变化和补助追回都会直接冲击项目。
    - 需求集中且执行复杂：买方高度集中在少数科技公司，尤其是 Microsoft；项目融资、Class VI 许可、能源供给，以及 Louisiana 社区和许可风险都要兑现。
    - 估值不透明：没有官方估值，二级市场给出的约 $695M–$900M 区间也有争议，清晰测算风险投资回报很难。
  unresolvedGaps:
    - 官方估值和股权结构表未披露，包括优先权、期权池和老股交易；$695M–$900M 区间来自二级市场，且存在争议。
    - 收入、毛利率、现金余额、烧钱速度和现金跑道均未披露；Tracy / Louisiana 每净吨实际成本仍未知。
    - 已交付吨数与已签约吨数的差距，以及承购合同质量（价格、救济、取消、MRV 条款）均未公开。
    - Project Cypress 的执行里程碑、配套资本、许可和封存合同仍待确认。
