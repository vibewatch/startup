company:
  name: Heirloom Carbon Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: 'Heirloom’s product is a delivered carbon-removal asset: modular limestone direct-air-capture facilities plus verified
    CDR credits. The technical bet is less on exotic sorbent discovery than on industrializing calcination, tray handling,
    clean power, MRV, and storage at costs and reliability that have not yet been publicly proven at hub scale.'
sections:
- id: product-lines-and-maturity
  title: 'Product lines: credits backed by modular DAC assets'
  body: 'Heirloom’s sellable product is not a standalone machine; it is a permanent carbon-removal credit produced by company-operated
    limestone DAC assets and delivered to corporate climate buyers. The operational asset base starts with the Tracy, California
    commercial facility and extends to planned Louisiana facilities tied to Project Cypress and separate Northwest Louisiana
    deployments. That framing matters for diligence because the buyer receives a verified tonne, while Heirloom must execute
    an integrated industrial workflow: source limestone, run kilns and passive contactors, procure additional clean power,
    move CO2 to concrete or geologic storage, and document the net removal. The maturity signal is real but early. Tracy is
    commercial and active, yet at roughly 1,000 tonnes per year it is a learning plant, not proof that the same architecture
    can run at hundreds of thousands of tonnes per year with predictable uptime, net energy efficiency, storage permits, and
    financeable delivery risk.'
  claimRefs:
  - CE001
  - CE002
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  tableRefs:
  - TE001
  figureRefs:
  - FE004
- id: limestone-dac-workflow
  title: 'Workflow: accelerating limestone mineralization into a three-day industrial loop'
  body: 'The core workflow begins by heating limestone-derived material so CO2 is released and captured, leaving calcium oxide
    that is hydrated into a reactive lime material. That material is placed on vertically stacked trays, exposed to ambient
    air, treated with water, and cycled until it absorbs CO2 and returns toward calcium carbonate. Heirloom and Frontier describe
    the carbonation step as days rather than years, with Frontier specifying roughly three days and Heirloom reporting 85%
    carbonation extents in 2.5 days in earlier development work. The measurable benefit is a shorter sorbent cycle using abundant
    minerals rather than bespoke chemical media. The limitation is that the technology converts a chemistry advantage into
    a materials-handling and energy-infrastructure problem: trays, kilns, clean electricity, compression, transport, storage,
    and MRV must all work as a system for each net tonne.'
  claimRefs:
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE022
  - CE023
  tableRefs:
  - TE002
  figureRefs:
  - FE001
  - FE002
- id: operating-architecture-and-dependencies
  title: 'Operating architecture: low-cost inputs, high-integrity dependencies'
  body: 'The architecture has four coupled layers. First is mineral handling: limestone feedstock, hydration, tray contactors,
    and repeated cycling. Second is thermal regeneration: electric kilns and calcination equipment that must deliver a concentrated
    CO2 stream without fossil combustion. Third is plant and site infrastructure: land, renewable electricity, water, controls,
    labor, and logistics. Fourth is storage and credit issuance: concrete mineralization or underground sequestration, registry-grade
    MRV, and customer delivery. This is a differentiated architecture because it leans on cheap limestone, mature kiln concepts,
    modular warehouses, and operational learning rather than a breakthrough sorbent. It is also fragile: a bottleneck in clean
    power procurement, Class VI storage, pipeline access, equipment scale-up, or measurement data can delay tonnes even if
    the contactor chemistry performs.'
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE020
  - CE021
  - CE024
  - CE025
