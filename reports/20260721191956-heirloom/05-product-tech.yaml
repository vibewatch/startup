- id: TE003
  title: Technology and operating architecture dependency table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Limestone / lime sorbent loop
    - Provides abundant mineral that absorbs CO2 after calcination and hydration
    - Reliable limestone supply, water, handling, and repeat cycle performance
    - Attrition, contamination, moisture variability, or unreported replacement rates could raise cost
  - - Vertically stacked trays / passive contactors
    - Expose reactive material to ambient air over the carbonation window
    - Warehouse space, airflow, robotics/material handling, and operating data
    - Scaling hundreds of thousands of trays is an operations problem, not just chemistry
  - - Renewable-energy electric kiln
    - Releases CO2 from limestone and regenerates reactive material
    - High-temperature electric calcination equipment and additional clean power
    - Electricity price, interconnection, kiln efficiency, and equipment availability drive unit economics
  - - Leilac electric calcination partnership
    - Supplies a potential future reactor path for high-purity CO2 and calcium oxide
    - License/collaboration execution and integration with Heirloom plants
    - Technology transfer from cement/lime pilots to DAC assets may slip or underperform
  - - Controls, data, and learning loop
    - Optimizes uptake rate and plant operations from operating data
    - Sensors, algorithms, process engineers, and high-quality measurement data
    - Public evidence does not yet quantify uptime, failure modes, or algorithmic lift
  - - Additional renewable energy
    - Keeps process emissions from eroding net removals
    - PPAs, grid accounting, and location/time matching where feasible
    - DAC competes for clean electrons with grid decarbonization and data-center load
  - - CO2 transport and storage
    - Turns captured CO2 into durable removals
    - Concrete partners, Class VI wells, pipelines, and storage operators
    - Storage supply, permitting, and community opposition can bottleneck otherwise working capture plants
  - - MRV / registry layer
    - Calculates net tonnes and enables credit issuance
    - Protocol, verifier, evidence upload, energy accounting, and customer reporting
    - Lack of public certificate samples makes delivery quality harder to diligence
  notes: Architecture risks are dependency risks identified from fetched sources and diligence inference, not disclosed Heirloom
    failure incidents.
