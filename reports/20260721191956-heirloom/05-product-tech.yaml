- id: TE002
  title: Customer workflow and operating use case for delivered DAC tonnes
  columns:
  - User job
  - Current workflow
  - Heirloom solution
  - Measurable benefit
  - Limitation
  rows:
  - - Buy durable CDR for net-zero goals
    - Negotiate bespoke offtakes across immature CDR suppliers
    - Long-term CDR credits from limestone DAC facilities
    - Large named purchases such as up to 315,000 tonnes and 26,900 Frontier tonnes
    - Delivery occurs over future facilities, so buyer accepts construction and operating risk
  - - Convert air capture into a net removal
    - Account for capture, process emissions, storage, and verification separately
    - Integrated capture loop plus storage partner and MRV package
    - MRV is explicitly included in Frontier pricing and Isometric protocols define accounting
    - Public batch-level net-removal ledgers for Heirloom are not yet broadly visible
  - - Run the capture chemistry repeatedly
    - Use slow natural mineral weathering or alternative sorbents
    - Heat limestone, hydrate lime, expose trays, recalcine when saturated
    - Carbonation time compressed from years to less than about three days
    - Cycle still requires thermal energy, handling, and moisture control
  - - Store captured CO2 durably
    - Rely on future geologic wells or utilization markets
    - Store in concrete at Tracy and plan Class VI geologic storage for Louisiana
    - Concrete mineralization and geologic storage can support century-to-millennium claims
    - Geologic storage permits and local acceptance are external dependencies
  - - Scale supply for corporate portfolios
    - Pre-purchase scarce durable CDR with long fulfillment windows
    - Modular facilities and larger hub projects intended to expand supply
    - Louisiana plans approach 320,000 tonnes per year combined
    - Industry-wide demand, policy support, and clean power availability remain uncertain
  notes: Workflow rows connect buyer jobs to the operating system; benefits are public claims, not independently audited realized
    performance.
