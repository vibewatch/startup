- id: TE001
  title: Product module / asset matrix for limestone DAC delivery
  columns:
  - Module / asset / product line
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Tracy, California DAC facility
    - Early CDR buyers and Heirloom operations team
    - Commercial facility capturing up to 1,000 tCO2/year
    - First North American commercial DAC facility using modular limestone contactors
    - Public net tonnes delivered, uptime, energy intensity, and verifier certificates are not fully visible
  - - Enterprise carbon-removal credits
    - Corporate sustainability and procurement teams
    - Enterprise sales pages and named offtake contracts are public
    - Credit product wraps removal, storage, and MRV into a buyer-facing tonne
    - Contract terms, remedies for delayed delivery, and realized price per tonne remain private
  - - Individual / small-business removals
    - Individuals and smaller buyers
    - Public purchase flow exists for supporting removal credits
    - Creates demand aggregation beyond large frontier buyers
    - Allocation from small purchases to issued tonnes needs certificate-level traceability
  - - Louisiana first facility at Port of Caddo-Bossier
    - Large buyers needing future durable supply
    - Planned construction with operation targeted for 2026 and around 17,000 tCO2/year
    - Larger repeat module near storage and industrial workforce
    - Permits, PPA execution, grid interconnection, storage contracts, and construction schedule
  - - Project Cypress Heirloom facility
    - DOE hub stakeholders, corporate buyers, storage partners
    - Design-stage hub asset with first phase expected at 100,000 tCO2/year in 2027
    - Links DAC, federal hub support, and Gulf Coast storage infrastructure
    - Subject to funding reviews, negotiations, FEED results, permits, and community acceptance
  - - DAC-to-concrete storage pathway
    - Buyers accepting concrete mineralization permanence and concrete partners
    - Demonstrated with CarbonCure and Central Concrete; used for Tracy storage
    - Near-term storage route without waiting for all geologic infrastructure
    - Concrete market capacity, lifecycle accounting, and demolition/end-of-life permanence assumptions
  notes: Status reflects publicly fetched sources as of 2026-07-21; private operating data and delivery certificates are treated
    as diligence gaps.
