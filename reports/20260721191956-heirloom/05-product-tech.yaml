  - TE003
  figureRefs:
  - FE003
- id: quality-mrv-and-durability
  title: 'Quality controls: MRV is central, but public certificates remain a diligence ask'
  body: 'Heirloom’s quality proposition is durable and additional removal, not commodity CO2 capture. Multiple sources support
    the logic: Frontier’s purchase terms include MRV, Isometric’s DAC protocol requires measurement of energy diversion and
    registry-grade verification, Puro’s geologically stored carbon methodology advertises 1,000-plus-year durability, and
    EPA Subpart RR requires MRV plans and annual reporting for covered geologic sequestration facilities. Heirloom has also
    committed not to use captured CO2 for enhanced oil recovery and to publish community-relevant safety data. The gap is
    public traceability at the facility-and-batch level. Investors still need certificate samples, net-carbon calculations,
    permanence assumptions for concrete versus geologic pathways, independent verifier identities, energy procurement evidence,
    and any reversal or non-delivery terms in customer contracts.'
  claimRefs:
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  - CE032
  tableRefs:
  - TE004
  figureRefs:
  - FE005
- id: roadmap-and-risk-verdict
  title: 'Roadmap: from Tracy proof point to Louisiana execution risk'
  body: 'The roadmap is ambitious and staged. Heirloom moved from laboratory carbonation acceleration to a 1,000-tonne-per-year
    Tracy facility, then to large offtakes and a Louisiana expansion plan. The next milestones are materially harder than
    the prior ones: a 17,000-tonne-per-year first Northwest Louisiana facility expected to operate in 2026, a Project Cypress
    phase expected around 100,000 tonnes per year in 2027, and a longer-term Heirloom Louisiana footprint approaching 320,000
    tonnes per year. The adverse evidence is not that limestone DAC cannot work; it is that DAC at meaningful climate scale
    can be energy-, materials-, permitting-, and capital-intensive. Product diligence should therefore focus on uptime, electricity
    intensity per net tonne, equipment learning curves, storage permit status, MRV issuance history, and whether customers
    accept delivery risk at scale.'
