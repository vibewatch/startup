  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating performance
    missingEvidence: Facility-level net-tonne delivery ledger, uptime, energy intensity, and maintenance history for Tracy.
    whyItMatters: The investment case hinges on whether a 1,000-tonne learning plant predicts larger Louisiana assets.
    diligencePath: Request monthly operating dashboards, net-removal calculations, and verifier-ready evidence packages from
      Tracy.
    relatedQuestionRefs:
    - QE010
    - QE019
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: material
    topic: MRV certificates
    missingEvidence: Public sample credit certificates or registry serials linking Heirloom tonnes to protocols, verifiers,
      storage pathway, and buyer delivery.
    whyItMatters: Without certificate-level traceability, quality claims cannot be independently reconciled to delivered tonnes.
    diligencePath: Obtain anonymized issued-credit samples and compare them with Isometric, Puro, or other registry requirements.
    relatedQuestionRefs:
    - QE014
    - QE016
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: energy procurement
    missingEvidence: Executed PPAs, location/time matching details, grid emissions accounting, and electricity use per net
      tonne for current and planned facilities.
    whyItMatters: Clean power quality determines whether DAC produces high-integrity net removals rather than merely gross
      capture.
    diligencePath: Review PPAs, grid-accounting methodology, and measured kWh per gross and net tonne for Tracy and Louisiana
      designs.
    relatedQuestionRefs:
    - QE008
    - QE018
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: storage permits
    missingEvidence: Heirloom-specific storage permits, CapturePoint contractual terms, Subpart RR MRV plans, and Class VI
      timelines for Louisiana projects.
    whyItMatters: Capture capacity has limited credit value if storage wells, pipelines, and monitoring approvals arrive late.
    diligencePath: Request storage partner agreements, permit docket references, and a critical-path schedule for Class VI
      and pipeline approvals.
    relatedQuestionRefs:
    - QE007
    - QE012
    relatedTableRefs:
    - TE004
    - TE005
  - type: conflicting-data
    severity: minor
    topic: cost trajectory
    missingEvidence: Audited current cost per tonne and reconciled bridge from present costs to the long-term low-cost target.
    whyItMatters: Public sources agree costs must fall, but the magnitude and timing of Heirloom-specific cost declines are
      not disclosed.
    diligencePath: Build a unit-cost model using capex, energy, labor, sorbent replacement, storage, MRV, and financing inputs
      from management.
    relatedQuestionRefs:
    - QE025
    - QE026
    relatedTableRefs:
    - TE002
    - TE005
  - type: enumeration-incomplete
    severity: minor
    topic: product module map
    missingEvidence: Complete list of live, contracted, and planned product SKUs or facility modules, including any private
      pilots not on the public website.
    whyItMatters: The public module map may omit private buyer-specific delivery structures or facility configurations.
    diligencePath: Reconcile public pages against the sales pipeline, project-finance data room, and registry issuance records.
    relatedQuestionRefs:
    - QE001
    - QE002
    relatedTableRefs:
    - TE001
