- id: TE004
  title: Trust, quality, and compliance controls for Heirloom CDR tonnes
  columns:
  - Control / certification / quality metric
  - Status
  - Scope
  - Gap
  rows:
  - - Measurement, reporting, and verification in customer contract
    - Included in Frontier offtake price
    - Covers removal accounting and permanent storage for purchased tonnes
    - Need sample MRV report, verifier identity, and treatment of delayed delivery
  - - Isometric DAC protocol
    - Published for consultation and public trust-building
    - DAC monitoring, energy procurement, and registry issuance rules
    - Need whether and when Heirloom tonnes are certified under a specific protocol version
  - - Puro GSC / DACCS methodology
    - Methodology describes geologic DACCS and 1,000+ year durability
    - Geologically stored carbon crediting infrastructure
    - Need mapping between Heirloom storage pathway and any issued registry serials
  - - EPA Subpart RR for geologic sequestration
    - Federal MRV requirements for covered geologic storage facilities
    - Mass balance, monitoring plans, leakage detection, and annual reporting
    - Heirloom-specific Louisiana storage facilities and approved MRV plans are not yet public
  - - No enhanced-oil-recovery principle
    - Company commitment stated in responsible-deployment principles
    - Applies to Heirloom-captured CO2 and fossil equity governance
    - Need contractual covenants with storage partners and remedies for breach
  - - Concrete mineralization storage
    - Demonstrated with CarbonCure / Central Concrete and used at Tracy
    - Centuries-long concrete storage as calcium carbonate
    - Need lifecycle boundary, demolition scenario, and independent permanence opinion
  - - Community governance / benefits
    - Tracy and Project Cypress community processes announced
    - Local input, workforce, and community investment model
    - Need minutes, commitments, grievance handling, and air/water monitoring data
  notes: Controls are public-program signals; absence of public certificate artifacts is a diligence gap rather than evidence
    of non-compliance.
