tables:
- id: TU001
  title: Heirloom Customer Segmentation by Buyer Job
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Enterprise net-zero offtake
    - Corporate sustainability and procurement teams pay; climate-accounting teams use certificates
    - Durable CDR for net-zero and carbon-negative commitments
    - Microsoft up to 315,000 tons; early buyers include Microsoft, Stripe, Shopify, Klarna
    - High-credit buyers can support project finance and validate premium durable CDR demand
    - Delivered tons by buyer, price, and renewal status remain private
  - - Frontier coalition buyers
    - Frontier aggregates purchases for Stripe, Meta, Shopify, JPMorgan, McKinsey, Workday, H&M, Autodesk
    - Portfolio approach to permanent removals with MRV and storage milestones
    - 26,900 tons by 2030 for $26.6M
    - Broadens buyer logos and creates option for future lower-price purchases
    - Buyer-by-buyer allocation, delivery schedule, and satisfaction not public
  - - Early catalytic climate funds
    - Shopify Sustainability Fund and Stripe Climate style buyers pay to catalyze supply
    - Fund first deployments and help suppliers move from lab to field
    - Shopify 400 tons plus later multi-year offtake signal
    - Repeat intent and early-market validation before commercial scale
    - No public retention rate or delivered-certificate acceptance data
  - - Hard-to-abate / SAF-linked buyers
    - United Airlines Ventures Sustainable Flight Fund and aviation climate teams
    - CDR delivered for sustainable aviation fuel production or underground storage
    - Right to purchase up to 500,000 tons
    - Potential demand diversification outside software-company net-zero budgets
    - Option-like right is not the same as delivered permanent-removal revenue
  - - Self-serve individuals and small businesses
    - Individual or small-business buyers purchase credits from public Heirloom pages
    - Climate action and support for permanent-removal industry growth
    - No public buyer count or average order size
    - Useful brand and demand activation channel
    - Revenue, CAC, repeat rate, and fulfillment economics undisclosed
  - - Public / policy-enabled demand
    - Government programs and compliance-market actors influence demand; corporate buyers still pay for credits
    - DAC hubs, procurement pilots, compliance-market inclusion, MRV standards
    - Project Cypress and Louisiana capacity roadmap support future supply
    - Can lower financing risk and increase buyer confidence
    - Not direct customer retention proof and depends on permitting/funding execution
  notes: Segments are public-evidence based; nulls/gaps mean no reviewed public source disclosed the metric.
