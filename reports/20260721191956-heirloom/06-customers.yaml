  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Customer-level renewal, churn, NRR, GRR, and satisfaction data for Microsoft, Frontier buyers,
      Shopify, and other named accounts.
    whyItMatters: Retention is central to whether large offtake announcements convert into durable revenue and repeat
      purchases.
    diligencePath: Request a customer-by-customer contract schedule, renewal history, delivery acceptance records,
      NPS or satisfaction notes, and board-level revenue concentration reporting.
    relatedQuestionRefs:
    - QU019
    - QU024
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: delivery-by-customer-gap
    missingEvidence: Publicly verifiable delivered tons by buyer, facility, vintage, storage pathway, and certificate
      retirement status.
    whyItMatters: The largest diligence uncertainty is not whether customers signed, but whether Heirloom has delivered
      material volumes against named commitments.
    diligencePath: Reconcile Heirloom invoices, registry records, MRV reports, Frontier delivery ledger exports,
      and Microsoft/Stripe/Shopify retirement confirmations.
    relatedQuestionRefs:
    - QU011
    - QU024
    relatedTableRefs:
    - TU002
    - TU003
  - type: enumeration-incomplete
    severity: minor
    topic: customer-enumeration
    missingEvidence: Complete customer list, deal sizes, pricing, contract lengths, and active/inactive status for
      all buyers beyond public announcements.
    whyItMatters: The public named roster is likely incomplete and could understate or overstate concentration depending
      on undisclosed accounts.
    diligencePath: Ask management for a redacted customer master, bookings bridge, and top-10 customer concentration
      schedule by contracted tons and revenue.
    relatedQuestionRefs:
    - QU001
    - QU012
    relatedTableRefs:
    - TU001
    - TU003
  - type: conflicting-data
    severity: material
    topic: market-delivery-gap
    missingEvidence: A direct reconciliation between Heirloom contracted tons, Frontier portfolio contracted tons,
      CDR.fyi market data, and any registry-delivered tons.
    whyItMatters: Different public surfaces describe commitments, facility capacity, and market deliveries at different
      levels of aggregation.
    diligencePath: Build a deal-level reconciliation with source, buyer, facility, scheduled delivery year, delivered
      tons, and MRV certificate identifiers.
    relatedQuestionRefs:
    - QU011
    - QU023
    - QU024
    relatedTableRefs:
    - TU002
