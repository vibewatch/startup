- id: TU005
  title: Expansion Drivers and Customer Concentration Diligence Path
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Microsoft project-finance anchor
    - Microsoft is roughly 92% of narrow disclosed CDR tonnage excluding United’s option-like right
    - High upside but material single-buyer exposure
    - Review Microsoft contract economics, delivery schedule, termination rights, and step-in remedies
  - - Frontier future purchase options
    - Options are not guaranteed orders and buyer allocation is not public
    - Could lower future price and diversify logos if exercised
    - Obtain option schedule, exercise conditions, and buyer-by-buyer split
  - - United SAF/storage right
    - Potentially large but not equivalent to delivered permanent-removal commitment
    - Diversifies into aviation but may depend on SAF pathway execution
    - Confirm exercise status, SAF conversion chain, storage split, and MRV treatment
  - - Louisiana capacity roadmap
    - Capacity milestones could slip and delay deliveries across buyers
    - Critical to converting backlog into revenue and certificates
    - Validate permits, financing, EPC schedule, power procurement, and storage contracts
  - - Policy and compliance-market demand
    - Voluntary buyers still dominate public proof
    - Could expand TAM if procurement and compliance markets mature
    - Track procurement pilots, eligibility standards, and buyer willingness to sign long-term offtakes
  - - Sector-wide CDR delivery lag
    - CDR market has delivered only a small share of sold tonnes
    - Raises risk that signed contracts overstate near-term traction
    - Reconcile scheduled, delivered, and certified tons by buyer and vintage
  notes: Concentration estimates use public named tonnage and deliberately separate options/rights from signed CDR
    offtake.
