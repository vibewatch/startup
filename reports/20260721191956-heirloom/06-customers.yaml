- id: FU001
  title: Heirloom Buyer Journey From Climate Target to Delivered Removal
  type: journey-map
  layout: wide
  summary: Customer journey highlights where named buyers move from climate commitments into contract, facility,
    MRV, and expansion gates.
  approximationNotes: Stages are inferred from public buyer pages and offtake announcements; no private sales-cycle
    data was available.
  claimRefs:
