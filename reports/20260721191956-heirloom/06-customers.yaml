- id: named-customer-proof-quality
  title: 'Named customer proof: strong logos, uneven outcome specificity'
  body: 'The named-customer evidence quality is highest for Microsoft and Frontier because both announcements specify
    tons, buyer purpose, and project-finance logic. Shopify also has unusually clear early proof: Heirloom says
    Shopify selected it for a carbon removal portfolio, bought 400 tons for the first deployment, and later added
    a multi-year offtake commitment. Meta and JPMorgan are credible named participants through the Frontier buyer
    set, but the public record reviewed here does not include Meta-authored or JPMorgan-authored Heirloom case studies,
    delivered-ton confirmations, or satisfaction comments. Stripe’s proof is partly direct and partly channel-based:
    Stripe Climate says Frontier facilitates purchases, while Heirloom lists Stripe among Frontier and early catalytic
    buyers. Across the roster, the outcomes are mostly climate-procurement commitments, not quantified customer
    ROI. The production-versus-pilot answer is therefore mixed: Tracy is commercial and operating, but the largest
    customer promises depend on future facilities and storage milestones.'
  claimRefs:
