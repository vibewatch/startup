- id: adoption-trajectory-and-delivery-gap
  title: 'Adoption trajectory: contracted demand is ahead of delivered visibility'
  body: 'The adoption curve is real but still mostly contracted rather than delivered. Public proof begins with
    Shopify’s 400-ton early purchase in 2021, steps up materially with Microsoft’s 315,000-ton long-term contract
    in September 2023, and broadens with the Frontier buyer agreement for 26,900 tons by 2030. The Tracy plant created
    production credibility because it can capture up to 1,000 tons per year and was described as serving early catalytic
    buyers, but that capacity is small relative to the headline contract backlog. Frontier’s own Heirloom profile
    adds an important gating detail: deliveries require milestones such as FEED results, renewable power contracting,
    storage permits, and community-benefits planning. The sector context is also adverse; CDR.fyi reports only 3.3%
    of CDR purchases delivered across the market. For diligence, the key denominator is scheduled-versus-delivered
    tons by buyer and facility, not total announced offtake.'
  claimRefs:
  - CU005
  - CU006
  - CU009
  - CU011
  - CU012
