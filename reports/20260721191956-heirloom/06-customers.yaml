  data:
    items:
    - label: Need recognition
      value: Corporate net-zero, carbon-negative, or hard-to-abate aviation objective creates durable-removal demand
      note: 'Buyer emotion: strategic urgency'
    - label: Supplier discovery
      value: Buyer evaluates Heirloom directly or through Frontier / Stripe Climate / Shopify Sustainability Fund
      note: Channel can be direct offtake or coalition aggregation
    - label: Quality diligence
      value: Buyer checks permanence, MRV, storage pathway, responsible deployment, and no-EOR commitments
      note: High-quality CDR must survive internal climate-accounting scrutiny
    - label: Contracting
      value: Buyer signs offtake, option, or purchase right with milestones, delivery schedule, and certificate
        requirements
      note: Contracts can be bankability tools for project finance
    - label: Facility and storage execution
      value: Heirloom must build capacity, secure clean power and storage, capture CO2, and generate MRV proof
      note: This is the main gap between announced demand and delivered tons
    - label: Delivery and expansion
      value: Buyer accepts/remits certificates, retires tons, and may renew or exercise options
      note: Public sources do not disclose post-delivery satisfaction or renewal cohorts
