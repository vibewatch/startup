- id: retention-repeat-and-satisfaction
  title: Retention, repeat usage, and satisfaction signals
  body: Heirloom has repeat and expansion signals, but not retention metrics. Microsoft’s contract is multi-year
    and bankability-oriented; Shopify’s announcement contains both an initial 400-ton purchase and a subsequent
    multi-year offtake commitment; and Frontier’s agreement includes options to buy more tons from future projects
    at lower prices. Those are meaningful durability signals because corporate carbon removal buyers rarely commit
    to large, expensive, permanent CDR without internal climate-budget support. However, public evidence stops well
    short of NRR, GRR, churn, renewal, delivery acceptance, or satisfaction. No source reviewed disclosed whether
    a buyer renewed after delivery, expanded after receiving certificates, or accepted/rejected delivered tons based
    on MRV. The correct underwriting posture is to treat repeat intent as positive but private-evidence-only until
    diligence obtains contract schedules, invoices, registry retirements, and customer reference calls.
  claimRefs:
  - CU003
  - CU008
  - CU014
  - CU027
  - CU028
  - CU029
  - CU032
  - CU039
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-and-concentration-risk
  title: Expansion and concentration risk diligence path
  body: 'The central traction risk is concentration around Microsoft paired with a delivery backlog. On a narrow
    public-tonnage basis that counts Microsoft, Frontier, and Shopify disclosed CDR commitments but excludes United’s
    option-like SAF/storage right, Microsoft represents roughly 92% of named contracted tons. Including the United
    right would diversify headline demand, but that instrument is different: it is a right to purchase up to 500,000
    tons and may be used for SAF production or storage, so it should not be blended mechanically with delivered
    permanent-removal cohorts. Expansion upside is visible in Frontier options, policy and compliance-market development,
    Louisiana capacity, and hard-to-abate strategic investors. Diligence should therefore test five items: buyer-level
    delivery schedules, enforceability and pricing of future options, Microsoft payment and termination terms, storage-permit
    critical path, and whether non-Microsoft buyers are willing to sign larger follow-on commitments after first
    deliveries.'
