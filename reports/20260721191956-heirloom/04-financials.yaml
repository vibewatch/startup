- id: traction-capital-adequacy-and-financing-dependency
  title: Public Traction, Capital Adequacy, and Financing Dependency
  body: 'Public traction is strongest in contracted tons and facility pipeline, not in revenue. Tracy is capped at about 1,000 tons per year, while the Louisiana plan would step to 17,000 tons and then to roughly 300,000 tons within Heirloom’s portion of Project Cypress, with the broader hub targeting 1 million tons per year. The capital plan is correspondingly layered. The Company Overview funding chronology should be treated as background, while this chapter focuses on the forward implication: a $150 million Series B, a prior $53 million Series A, follow-on strategic investments, United’s undisclosed equity investment, DOE grants, Louisiana incentives, and offtake-backed project finance all need to work together. Cash on hand, burn, runway, debt obligations, and project-finance covenants are not public. The practical next-round trigger is likely evidence that Louisiana execution can convert contracted demand into lower-cost, financeable, verified removals.'
