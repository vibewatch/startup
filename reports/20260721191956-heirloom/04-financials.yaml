company:
  name: Heirloom Carbon Technologies
chapter:
  number: 4
  title: Financials & Capital
  summary: Heirloom’s financial story is unusually strong on contracted demand and capital access but still weak on underwriteable operating disclosure. Microsoft, Frontier, United, DOE, and Louisiana commitments create bankable signals, yet revenue recognition, gross margin, cash runway, utilization, and project-finance terms remain private diligence blockers.
sections:
- id: revenue-model-offtake-and-recognition
  title: Revenue Model, Pricing, and Revenue Recognition
  body: 'Heirloom’s public revenue model is a carbon-removal infrastructure model, not a software or hardware resale model. The company sells durable carbon dioxide removal credits through long-term offtake contracts with buyers that can tolerate early DAC prices in exchange for high-durability removals, MRV, and permanent storage. The two clearest price anchors are the Microsoft agreement and the Frontier agreement: Microsoft contracted for up to 315,000 metric tons and third-party coverage estimated roughly $200 million, while Frontier buyers contracted for 26,900 tons at $26.6 million. Those contracts imply headline prices in the hundreds to nearly one thousand dollars per ton, but they are not the same as recognized revenue. Revenue quality depends on facility delivery, measured removal, verified storage, milestone compliance, and whether options for lower-priced future tons convert into realized volume. The accounting diligence question is therefore backlog-to-revenue conversion, not
    simply announced contract value.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI009
  - CI029
  tableRefs:
