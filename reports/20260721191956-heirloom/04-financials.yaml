- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: 'Heirloom has unusually high-quality early demand for a hard-asset climate company: large credible buyers, a major customer that is also an investor, Frontier diligence, DOE support, and state-level project incentives. That creates a credible financing story if delivered tons rise and cost per ton falls. The blockers are equally material. The company does not disclose revenue, ARR, cash, burn, runway, gross margin, utilization, realized price, delivered tons, debt terms, or project-finance covenants. Announced offtake and funding are not a substitute for evidence that facilities can run near nameplate capacity at a cost that leaves margin after energy, capex recovery, storage, MRV, and financing expense. The financial verdict is track-with-diligence: revenue quality could become strong because contracts are long-term and bankable, but capital intensity and unit-economics opacity prevent underwriting without a data room.'
