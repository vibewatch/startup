  figureRefs: []
- id: unit-economics-cost-stack-and-margin-path
  title: Unit Economics, Cost Stack, and Margin Path
  body: 'The public unit-economics picture is directionally clear but not underwritable. Heirloom’s cost stack is dominated by capex for DAC facilities, renewable electricity and kiln energy, labor and maintenance, CO2 transport and storage, MRV, permitting, and financing cost. Frontier’s assessment is important because it frames the cost-down path as operational excellence, capex learning, lower opex, plant lifetime, cheaper capital, and scale rather than a speculative new sorbent. Public price and cost references still show a large gap: Canary and Latitude cite current DAC prices or costs generally around $600–1,000 per ton, a DOE target near $100, and Heirloom expectations of hundreds of dollars per ton by decade-end. The first Louisiana phase illustrates the capital intensity: a $475 million investment for a 17,000-ton-per-year facility implies roughly $27,900 of capex per annual ton of nameplate capacity before operating costs. No public source discloses gross margin or utilization.'
  claimRefs:
  - CI008
  - CI016
