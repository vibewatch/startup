- id: TI005
  title: Public Financial Gaps and Exact Diligence Path
  columns:
  - Missing private metric
  - Impact on underwriting
  - Known public proxy
  - Exact diligence path
  rows:
  - - Recognized revenue
    - Cannot distinguish backlog from delivered revenue
    - Announced Microsoft and Frontier offtakes
    - Request revenue by contract, delivered tons, deferred revenue, and MRV issuance
  - - ARR / recurring revenue
    - ARR may be a poor fit but recurring cash flow still matters
    - Multi-year offtakes and options
    - Request contracted annual cash flow schedule and renewal/option status
  - - Gross margin
    - No way to assess profitability per delivered ton
    - Public cost and price ranges only
    - Request per-facility gross margin bridge by price, energy, labor, storage, MRV
  - - Cash, burn, runway
    - Capital adequacy cannot be measured
    - Series B and strategic investments
    - Request 24-month cash forecast under base and delayed-project scenarios
  - - Debt / project-finance covenants
    - Could constrain operations or require sponsor support
    - Microsoft bankability language
    - Request debt term sheets, covenants, conditions precedent, and draw schedule
  - - Delivered tons / utilization
    - Nameplate capacity may overstate revenue
    - Tracy 1,000-ton nameplate and 1,000 operating hours
    - Request monthly capture, storage, issuance, downtime, and net-removal reconciliation
  - - Customer concentration and cancellation rights
    - Microsoft/Frontier could dominate backlog
    - Named large buyers but no mix
    - Request backlog by buyer, counterparty credit, take-or-pay terms, and termination rights
  notes: These gaps are material diligence blockers because public records disclose contracts and facilities, not operating financials.
