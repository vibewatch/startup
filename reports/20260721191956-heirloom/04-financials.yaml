  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: recognized-revenue
    missingEvidence: Recognized revenue by contract, deferred revenue, and cash collections from delivered verified removals.
    whyItMatters: Announced offtake can overstate near-term revenue if delivery is delayed or milestones are unmet.
    diligencePath: Request audited or management-prepared revenue schedules by customer, delivery vintage, MRV issuance, and payment status.
    relatedQuestionRefs:
    - QI003
    - QI014
    - QI024
    relatedTableRefs:
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Gross margin by facility after energy, labor, MRV, transport, storage, depreciation, and financing costs.
    whyItMatters: Per-ton price has little underwriting value without the delivered-ton cost stack.
    diligencePath: Obtain unit-economics bridge for Tracy, Shreveport 17,000 tpa, and Project Cypress 100,000/300,000 tpa phases.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI025
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn, restricted cash, and committed but undrawn project capital.
    whyItMatters: Series B size cannot determine runway for a construction-heavy business.
    diligencePath: Review bank statements, board cash forecast, construction budget, debt term sheets, and minimum liquidity covenants.
    relatedQuestionRefs:
    - QI019
    - QI024
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: debt-project-finance
    missingEvidence: Executed project-finance agreements, lender diligence, covenants, and conditions precedent.
    whyItMatters: Bankability is a key part of Heirloom’s capital story, but public sources do not disclose actual debt terms.
    diligencePath: Request lender term sheets, financing model, DSCR assumptions, sponsor guarantees, and construction draw schedule.
    relatedQuestionRefs:
    - QI020
    - QI023
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: utilization-delivered-tons
    missingEvidence: Monthly capture, net removal, storage, downtime, and issued-credit metrics by facility.
    whyItMatters: Nameplate capacity is not the same as delivered revenue or gross margin.
    diligencePath: Request facility operating dashboard and third-party MRV records for every delivered-credit vintage.
    relatedQuestionRefs:
    - QI016
    - QI017
    relatedTableRefs:
    - TI003
    - TI005
  - type: conflicting-data
    severity: material
    topic: cost-targets
    missingEvidence: Reconciled internal cost curve from current high-hundreds or $600–1,000 per ton economics to $100 target.
    whyItMatters: The financial verdict hinges on whether cost-down is learning-curve reality or aspiration.
    diligencePath: Compare internal cost curve to actual vendor quotes, PPA pricing, storage contracts, and plant-availability data.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI025
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: buyer-concentration
    missingEvidence: Backlog concentration, counterparty credit, take-or-pay protections, and cancellation rights.
    whyItMatters: A few catalytic buyers may dominate early demand and financing support.
    diligencePath: Request contract abstracts by buyer including pricing, termination, credit support, and delivery remedies.
    relatedQuestionRefs:
    - QI005
    - QI021
    relatedTableRefs:
    - TI001
    - TI005
  - type: missing-source
    severity: minor
    topic: valuation
    missingEvidence: Board-approved valuation or latest preferred-share price with liquidation stack.
    whyItMatters: Public sources do not provide a reliable official valuation for financial underwriting.
    diligencePath: Review financing documents, 409A reports, secondary transactions, and investor side letters before using a valuation KPI.
    relatedQuestionRefs:
    - QI018
    - QI019
