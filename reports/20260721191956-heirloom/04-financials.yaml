- id: gtm-motion-and-demand-quality
  title: GTM Motion and Sales-Efficiency Proxies
  body: 'Sales efficiency cannot be measured from CAC payback or quota attainment because Heirloom does not disclose sales expense, customer count, or recognized revenue. The visible proxy is a coalition-led enterprise motion. Microsoft, Frontier, Stripe, Meta, Shopify, JPMorgan, United Airlines Ventures, DOE procurement, and strategic industrial investors each reduce a different adoption barrier: technical diligence, demand aggregation, bankable cash flow, policy legitimacy, or sector-specific use cases such as SAF. This can be powerful because one high-quality offtake can unlock cheaper project capital and follow-on buyers. It is also slow and bespoke. Contract cycles appear to require diligence, community-benefits planning, FEED work, PPAs, storage permits, and project-finance underwriting rather than a standard sales funnel. The diligence ask is to map each contracted buyer to signed volume, delivery schedule, payment terms, termination rights, and actual cash collections.'
  claimRefs:
  - CI004
  - CI006
