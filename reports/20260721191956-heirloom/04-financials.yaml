tables:
- id: TI001
  title: Financial Revenue Streams and Recognition Risk
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Permanent CDR offtake
    - Buyer contracts for future verified removals
    - Metric ton CO2 removed
    - Microsoft up to 315,000 tons; Frontier 26,900 tons
    - High if delivery and storage milestones are met
    - Provide contracted backlog by buyer, delivery year, payment schedule, and termination rights
  - - Buyer-coalition purchases
    - Frontier aggregates buyers and performs diligence
    - Metric ton plus MRV
    - Frontier agreement valued at $26.6M
    - High buyer quality, but dependent on coalition appetite
    - Show conversion from coalition diligence to repeat direct contracts
  - - Strategic-sector optionality
    - United option can become CDR or SAF feedstock
    - Metric ton / feedstock ton
    - Option up to 500,000 tons; investment amount undisclosed
    - Potentially high but option exercise is uncertain
    - Disclose option economics, exercise conditions, and SAF partner economics
  - - Government procurement
    - DOE purchase pilot and DAC Hubs validate terms and standards
    - Credit / award milestone
    - Pilot is small; DAC Hub support is material
    - Useful for bankability more than near-term revenue
    - Provide status of DOE procurement bids and any binding purchase terms
  - - Utilization / CO2 reuse
    - Captured CO2 stored underground or embedded in concrete
    - Delivered stored ton
    - Tracy supports early buyers; Louisiana planned for geologic storage
    - Revenue-recognition depends on verified storage pathway
    - Reconcile delivered tons by storage route and MRV issuance date
  notes: Rows separate announced demand from recognized revenue; public sources do not disclose delivered revenue or revenue mix.
