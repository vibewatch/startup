- id: TI002
  title: Heirloom Pricing and Monetization Evidence
  columns:
  - Price / contract
  - List vs realized pricing
  - Discounts / unknowns
  - Source-backed value
  - Diligence ask
  rows:
  - - Microsoft offtake
    - Estimated realized contract value, not official list price
    - Neither party disclosed price; estimate from press coverage
    - ~$200M / 315,000 tons ≈ $635 per ton
    - Confirm contracted price curve, prepayment, penalties, and inflation clauses
  - - Frontier offtake
    - Official contract value across buyer coalition
    - Options for lower-priced future tons not quantified
    - $26.6M / 26,900 tons ≈ $989 per ton
    - Provide option strike prices and expected blended realized price
  - - Heirloom quoted current price
    - Company spokesperson range via Canary
    - Public range may not equal realized prices by buyer
    - $600–$1,000 per ton
    - Disclose signed weighted-average price by vintage and customer
  - - Industry / DOE target
    - Benchmark target, not Heirloom contract
    - Timing and achievability uncertain
    - DOE $100 per ton; Heirloom trajectory toward $100
    - Provide internal cost curve with energy, capex, and financing assumptions
  - - United option
    - Commercial option plus equity investment
    - Option exercise and price undisclosed
    - Up to 500,000 tons; investment amount not disclosed
    - Show whether option is take-or-pay, priced, or contingent
  notes: All per-ton values are either public estimates or derived from announced contract value divided by tons; they are not GAAP revenue.
