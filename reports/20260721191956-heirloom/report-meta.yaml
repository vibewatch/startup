  topStrengths:
    - >-
      Marquee, credible demand: Microsoft's up-to-315,000-tonne purchase plus
      Frontier buyers (Stripe, Meta, Shopify, JPMorgan) validate durable-CDR
      demand for Heirloom's removal.
    - >-
      Deployment lead: North America's first commercial DAC facility (Tracy, CA,
      2023) and a DOE-backed Louisiana hub give it a real operating and
      policy-capital head start.
    - >-
      Low-cost pathway and strong cap table: an abundant-limestone approach
      targeting ~$100/tonne, backed by Lowercarbon, Breakthrough Energy Ventures,
      and strategic industrials.
  topRisks:
    - >-
      Unit economics unproven: current DAC costs (high hundreds of $/tonne) sit
      far above the ~$100/tonne target, and realized plant costs/margins are
      undisclosed.
    - >-
      Subsidy and policy dependence: reliance on Section 45Q credits and DOE
      Project Cypress funding exposes the plan to tax-policy and grant-clawback
      risk.
    - >-
      Demand concentration and execution: heavy reliance on a few tech buyers
      (notably Microsoft), plus project-finance, permitting (Class VI), energy,
      and Louisiana community/permitting risk.
    - >-
      Valuation opacity: no official valuation and disputed ~$695M–$900M
      secondary estimates make a clean venture return hard to underwrite.
  unresolvedGaps:
    - >-
      No official valuation or cap table (preferences, option pool, secondaries);
      the $695M–$900M range is secondary-market-derived and disputed.
    - >-
      No disclosed revenue, gross margin, cash position, burn, or runway; realized
      cost per net tonne at Tracy/Louisiana is unknown.
    - >-
      Delivered-versus-contracted tonnes and offtake contract quality (prices,
      remedies, cancellation, MRV terms) are not public.
    - >-
      Project Cypress execution milestones, matching capital, permits, and storage
      contracts remain to be confirmed.
