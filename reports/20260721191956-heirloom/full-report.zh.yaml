      - number: '1.1'
        title: 身份、产品与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Heirloom Carbon Technologies 更适合被视作一家私营、风投支持的 Series B 气候科技公司，赛道是直接空气捕集，创立于 2020 年，核心落在加州 San
              Francisco/Brisbane 一带。它的一句话产品，是由石灰石 DAC 设施产出的永久碳移除：公司加热石灰石，使生成材料水合，再暴露在空气中，让它约三天内而非数年重新吸收 CO2，随后释放并永久封存
              CO2，同时再生材料。该机制支撑的商业模式，是向企业买家和战略方销售经核证的碳移除吨数，而不是销售硬件或软件许可。现实规模基线仍然偏早：加州 Tracy 设施是北美商业化证明点，年产约 1,000
              吨；Louisiana/Project Cypress 则是已宣布的扩产路径。后续章节应把这一点作为事实底座，避免暗示已审计收入、广泛客户数量或已确认的独角兽估值。
