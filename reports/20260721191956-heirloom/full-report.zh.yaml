            body: >-
              销售效率无法通过 CAC 回收期或配额达成率衡量，因为 Heirloom
              不披露销售费用、客户数或已确认收入。可见代理指标是一套由联盟牵引的企业销售动作。Microsoft、Frontier、Stripe、Meta、Shopify、JPMorgan、United Airlines
              Ventures、DOE 采购和战略工业投资人，各自降低不同采用障碍：技术尽调、需求聚合、可融资现金流、政策合法性，或 SAF
              等行业特定用例。它可能很强，因为一个高质量承购能打开更便宜的项目资本和后续买家。但它也慢且高度定制。合同周期似乎需要尽调、社区利益规划、FEED
              工作、PPA、封存许可和项目融资承销，而不是标准销售漏斗。尽调要求是把每个合同买家映射到已签体量、交付计划、付款条款、终止权和实际现金回款。
