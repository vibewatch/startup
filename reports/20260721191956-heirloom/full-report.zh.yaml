      - number: '5.3'
        title: 运营架构：低成本输入，高完整性依赖
        blocks:
          - type: paragraph
            body: >-
              架构有四个耦合层。第一层是矿物处理：石灰石原料、水合、托盘接触器和重复循环。第二层是热再生：电窑和煅烧设备必须在不使用化石燃烧的情况下输出高浓度 CO2
              气流。第三层是工厂与场址基础设施：土地、可再生电力、水、控制、劳动力和物流。第四层是封存与信用签发：混凝土矿化或地下封存、登记级 MRV
              和客户交付。它是一套差异化架构，因为公司依靠便宜石灰石、成熟窑炉概念、模块化仓库和运营学习，而不是突破性吸附剂。它也脆弱：清洁电力采购、Class VI
              封存、管道接入、设备放大或测量数据中的任一瓶颈，即使接触器化学表现良好，也会推迟吨数交付。
