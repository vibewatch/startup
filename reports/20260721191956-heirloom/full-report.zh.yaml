      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              最紧迫的法律 / 监管尽调工作是 Project Cypress，而不是 Heirloom 公司实体本身。DOE 正在为向 Battelle 提供财政援助准备
              EIS；较早预算期活动则获得过类别排除。这一顺序意味着公司可以展示进展，但不能把 Louisiana 全规模部署视为已经去风险。封存是第二道闸门：Class VI 井、州级主导权、Subpart RR MRV 和
              UIC 财务责任义务，决定捕集 CO2 能否在没有长期尾部责任的情况下被注入、监测和认证。第三道闸门是 45Q。IRS 指引让符合资格的 DAC 设施可以获得抵免，且可转让或直接支付；但 2026
              年负面来源显示，活动人士和政策撰写者仍在质疑补贴耐久性和可转让性。因此，否决标准应锚定可观察监管事件：EIS 延误、Class VI 路径失败、45Q 转让受损、DOE 奖励暂停，或社区利益承诺仍不可衡量。
