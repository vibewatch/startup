      - number: '5.2'
        title: 工作流：把石灰石矿化加速成三天工业循环
        blocks:
          - type: paragraph
            body: >-
              核心工作流从加热石灰石衍生材料开始，CO2 被释放并捕集，留下氧化钙，再水合成反应性石灰材料。该材料被放在垂直堆叠托盘上，暴露在环境空气中，用水处理，并循环至吸收 CO2、回到接近碳酸钙状态。Heirloom 和
              Frontier 把碳酸化步骤描述为以天而非年计算；Frontier 具体写到约三天，Heirloom 则报告早期开发工作中 2.5 天达到 85%
              碳酸化程度。可衡量收益是利用充足矿物缩短吸附剂循环，而不是依赖定制化化学介质。限制在于，这项技术把化学优势转成材料处理和能源基础设施问题：托盘、窑炉、清洁电力、压缩、运输、封存和 MRV
              必须作为系统共同运转，才能产生每一吨净移除。
            claimRefs:
              - CE003
              - CE004
