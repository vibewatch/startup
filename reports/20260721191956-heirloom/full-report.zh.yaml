      - number: '7.5'
        title: 人才与执行风险
        blocks:
          - type: paragraph
            body: >-
              公开人才信号体现的是快速增长，而不是已经验证的大型工厂运营深度。Heirloom 称公司在快速增长，未来会继续开放新岗位；重大客户和融资里程碑的公开公告中，高管声音也集中在 CEO Shashank Samala
              身上。上述公开信号并不证明公司有弱点，但它定义了尽调问题：确认继任覆盖、工厂运营负责人、项目控制、安全 / 合规负责人、社区沟通能力、MRV 质量归属，以及项目融资带宽。Series B
              把战略航空公司、工业方和气候投资人纳入利益方集合，提升了协调负担；与此同时，公司还在扩大设施并承担更多监管义务。若管理层流失、招聘不足，或矩阵式伙伴治理阻碍公司按期把拨款和承购转成已核验吨数，人才风险就会击穿投资逻辑。
