      - number: '3.4'
        title: 切换成本、锁定与分销权力
        blocks:
          - type: paragraph
            body: >-
              在项目达成财务关闭前，切换成本低；买家签下与里程碑、MRV、交付计划和封存基础设施绑定的长期承购后，切换成本升高。企业买家可以、也确实会多归属：CDR.fyi 显示 Microsoft 和 Frontier
              是大买家，同一生态也支持过 Heirloom、1PointFive、生物炭供应商和早期海洋路径。供应商锁定更多来自项目融资。Heirloom 的 Microsoft
              新闻稿明确主张，可融资协议能降低资本成本；Frontier 的 Heirloom 交易包含里程碑、MRV 范围，以及未来以更低价格购买吨数的选择权。因此，分销权力掌握在狭窄买家群和专业市场手中，而不是任何单一
              DAC 供应商手里。买家集中带来定价压力和里程碑约束：如果 Heirloom 错过成本或交付目标，采购方可以把边际预算分给 1PointFive 规模、Climeworks 组合，或更便宜的替代方法。
