  - id: TP001
    title: 买家替代方案视角下的竞争格局
    columns:
      - 替代方案
      - 类别
      - 买家获得什么
      - 有证据支撑的优势
      - 主要限制
    rows:
      - - Heirloom 石灰石 DAC
        - 直接 DAC 同行
        - 来自石灰石循环与封存的永久 DAC 碳信用
        - 美国首个商业 DAC 设施，加上 Microsoft 和 Frontier 承购
        - 规模仍落后 1PointFive，成本目标尚未证实
      - - Climeworks 固体吸附剂 DAC
        - 直接 DAC 同行
        - 依托冰岛运营的 DAC 碳信用和组合解决方案
        - 多个真实项目，Mammoth 达数万吨级规模
        - 公开报道指出成本高、裁员和 Orca 利用率不达标
      - - 1PointFive / Occidental STRATOS
        - 既有巨头支持的直接 DAC
        - 配套地质封存的大规模 DAC 碳信用
        - 500,000 t/yr STRATOS 设计、Class VI 许可、Amazon 和 Microsoft 合同
        - 化石能源既有玩家观感，以及大型首创项目执行风险
      - - Avnos HDAC
        - 相邻 DAC 同行
        - 利用低品位热移除碳并产水
        - Project Cedar 目标每年 3,000 tCO2 和 6,000 吨水
        - 商业规模交付要等 2026 年设施启动后验证
      - - Sustaera 碱性 DAC
        - 相邻 DAC 同行
        - 主打土地和供应链效率的模块化 DAC
        - 宣称设计模块化、节地，并在 2026 年改善成本 / 能耗
        - 第三方交付证据有限，已披露销售量小
      - - Zero Carbon Systems / Global Thermostat 资产
        - 传统 DAC 资产 / 潜在进入者
        - 使用收购的 Global Thermostat IP 的连续 DAC 流程
        - 收购 DAC 专利基础，并宣称百万吨级以上设计目标
        - 商业牵引和已交付量未公开
      - - 生物炭 / 生物质路径
        - 替代型 CDR
        - 来自稳定化生物质或生物炭的持久碳信用
        - 主导当前已交付持久 CDR 排行榜
        - 原料、土地使用和永久性质量因项目而异
      - - 海洋碱化 / 海洋 CDR
        - 替代型 CDR
        - 来自增强海洋吸收的碳信用
        - 首批经登记册验证的碳信用显示市场开始成形
        - MRV 不确定性和开放系统永久性风险仍然重大
    notes: 该部分格局聚焦有公开证据、且与买家相关的替代方案；内部企业自建 DAC 等缺少证据支撑的细分项，在正文讨论而非列为活跃供应商。
