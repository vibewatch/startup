      - number: '2.2'
        title: 多个测算口径显示需求很大，但已交付市场很小
        blocks:
          - type: paragraph
            body: >-
              最强的市场判断来自多口径交叉，而不是单一标题 TAM。外层气候需求口径是十亿吨级：RMI 和 State of CDR 评估把移除定义为难减排残余排放的必需项，CDR.fyi 则引用到 2050 年约 4 Gt
              的持久 CDR 路径。已披露需求口径小得多，但已经可测：CDR.fyi 报告 2026 年 Q1 已签 2.3 Mt，并由 Microsoft 2026 年 4 月份额推算出约 46.4 Mt 已披露持久 CDR
              合同。DAC 口径更小：2022 年至 2025-H1 签约 DAC 信用 2.47 Mt，但到 2025 年中仅交付 1,186 吨。收入发布机构大致收敛到 2030 年全球 DAC 收入约
              $1.7B，但其长期输出仍是摘要级估计，而非可独立审计的 SAM/SOM。
