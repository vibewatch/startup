  - id: TM004
    title: 影响 DAC 采用的增长驱动与落地约束
    layout: wide
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 难减排残余排放
        - 驱动
        - 长期至 2050 年
        - 为持久 CDR 撑起十亿吨级气候需求 TAM
        - 将买家残余排放路径映射到已获预算的 CDR 支出
      - - DOE 区域 DAC 枢纽
        - 驱动
        - 2020 年代示范周期
        - 公共资金支撑百万吨级枢纽目标，也帮助积累基础设施经验
        - 核验 Heirloom 自身的枢纽里程碑、配套资金和场址进度
      - - 45Q 和 IRA 税收抵免合规
        - 带执行风险的驱动
        - 当前项目融资结构设计
        - 可提升可融资性，但捕集、利用 / 封存和文档都必须合格
        - 按项目审查税收抵免资格、可转让性和追缴风险
      - - 欧盟 CRCF 和新兴合规机制
        - 需求不确定的驱动
        - 2026 年后规则制定与采用
        - 认证能建立信任，但不会自动产生购买义务
        - 跟踪合格方法学和受监管买家义务
      - - 买家集中
        - 约束
        - 当前
        - 大买家暂停或调整策略会打击需求
        - 剔除 Microsoft 和 Frontier 后衡量复购率
      - - DAC 交付比例低
        - 约束
        - 当前至规模化阶段
        - 已签约碳信用还不能证明已交付移除量或可确认收入
        - 审计交付排期、违约处罚、封存就绪度和登记册注销
      - - 成本和能耗高
        - 约束
        - 当前至降本曲线兑现
        - 相比更便宜的减排、自然抵消和其他 CDR 路径，ROI 受限
        - 对标含能源和封存在内的每吨全口径交付成本
      - - 标准、MRV 与采购摩擦
        - 约束
        - 当前
        - 拖慢中端市场采用，也让宣称措辞风险变得实质性
        - 检查买家合同条款、MRV 数据包、保险和宣称政策
    notes: 驱动与约束只表示方向；时间取决于政策落地、买家续约和项目交付证据。
