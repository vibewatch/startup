      - number: '2.4'
        title: 增长驱动强劲，但采用约束是结构性的
        blocks:
          - type: paragraph
            body: >-
              正面情景建立在难减排残余排放、政策支持、认证和可融资承购之上。DOE 的 Regional DAC Hubs 目标是让枢纽具备百万吨级年潜力；45Q 程序和 IRA 更新让税收抵免合规成为项目融资核心；EU
              CRCF 和 Japan GX-ETS 过渡则指向合规层。但约束同样实质。DAC 仍然耗能、重资本；Grand View Research 明确指出运营成本高、能源强度高。已签需求集中在少数买家手中，已交付
              DAC 吨数相对合同量仍极小，CDR.fyi 的买方研究还指出碳核算、标准、采购适配和风险共担仍未解决。这些不是表面采用摩擦：它们决定承购能否成为可重复的项目融资抵押品，而不是一次性气候科技展示。
