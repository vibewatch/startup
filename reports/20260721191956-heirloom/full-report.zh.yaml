  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品线：由模块化 DAC 资产支撑的信用
        blocks:
          - type: paragraph
            body: >-
              Heirloom 可销售的产品不是独立机器，而是由公司运营的石灰石 DAC 资产生成、并交付给企业气候买家的永久碳移除信用。运营资产基础从加州 Tracy 商业设施起步，并延伸到与 Project Cypress
              和独立 Northwest Louisiana 部署绑定的计划中 Louisiana 设施。这一框定对尽调重要，因为买家收到的是经核证的一吨移除量，而 Heirloom
              必须跑通一整套工业工作流：采购石灰石、运行窑炉和被动接触器、采购额外清洁电力、把 CO2 移至混凝土或地质封存，并记录净移除量。成熟度信号真实但早期。Tracy 是商业化且在运行的设施，但年产约 1,000
              吨，它是学习型工厂，不足以证明同一架构能在每年数十万吨规模下，以可预测正常运行时间、净能源效率、封存许可和可融资交付风险运行。
