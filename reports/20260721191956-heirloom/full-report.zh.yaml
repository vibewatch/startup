      - number: '8.3'
        title: 情景估值：用里程碑概率，不用单一头条倍数
        blocks:
          - type: paragraph
            body: >-
              概率加权的里程碑框架才是合适估值镜头。乐观情景不是 Heirloom 只是变成一家更大的创业公司；而是公司把早期客户证明和 DOE 牵引的基础设施转化为低成本、可融资的 DAC 平台。基准情景更谨慎：即使
              Heirloom 仍是最强的未上市 DAC 公司之一，如果进场价格接近估计 $695 million 到 $900 million 区间的高端，风险调整后的上行也可能有限。悲观情景则是重估：公司无法从 1,000
              吨设施和已签承购，跨到独立核验、完成融资、数十万吨级的运营。可比对象也强化了谨慎必要性。Climeworks、1PointFive/STRATOS、Carbon Engineering 和 Frontier
              承购都有参考意义，但它们分别映射到不同财务对象：股权轮、项目融资承诺、战略 M&A 或收入合同。
