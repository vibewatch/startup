      - number: '2.5'
        title: 必须保留的矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              尽调姿态应保留相互矛盾的市场信号，而不是把它们平均掉。预测机构给出爆发式 DAC 收入 CAGR，并把近期 2030 年估计放在约 $1.7B；运营数据却显示，已交付 DAC
              移除量仍以千吨而非百万吨计。企业净零承诺不等于有资金的 CDR 预算；Carbon Market Watch 对薄弱 2030
              减排计划的批评，直接提醒我们不能假设每一个净零标识都会变成持久移除客户。合规市场可能打开持久需求，但 2026 年 1
              月政策审查称，约束性机制仍然碎片化，供给准备度可能跑在需求义务前面。因此，下一轮尽调需要合同级价格曲线、交付计划、税收抵免资格、封存通道和买家复购率证据，之后才能把 TAM 转成 SOM 或估值上行。
            claimRefs:
              - CM018
              - CM026
              - CM039
              - CM040
              - CM041
