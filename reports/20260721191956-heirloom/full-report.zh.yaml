      - number: '3.3'
        title: 能力、GTM 与信任姿态
        blocks:
          - type: paragraph
            body: >-
              对持久 CDR 买家来说，胜出的产品不只是一台捕集机器，而是一吨已签约、并带有可信 MRV、封存、交付时间和采购可辩护性的移除量。Heirloom 的公开合同强调测量、报告、核证和永久封存；其 Frontier
              档案把 DAC 描述为持久、可测量、占地紧凑，但仍有成本挑战。1PointFive 的信任姿态不同：它可以把 DAC 接到 Occidental
              的地下能力和许可能力上，这是真实基础设施优势，但也可能引发买家对既有化石能源企业形象的担忧。Climeworks
              可以指向运营历史、项目和封存伙伴，但成本与性能披露仍是尽调问题。相邻路径的信任取舍不同：生物炭有交付流动性和登记方法学，海洋碱化有巨大的理论容量但模型不确定。实际结果是买家多归属，在不同方法间分配预算以分散技术风险，而不是锁定单一供应商。
