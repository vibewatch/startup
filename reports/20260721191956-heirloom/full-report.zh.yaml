  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 严重性框架与剩余敞口
        blocks:
          - type: paragraph
            body: >-
              Heirloom 的风险画像不是单一科学风险，而是一条堆叠执行链：公共政策、封存监管、工厂学习、承购可信度和组织规模都必须一起过关。最高的剩余敞口，是 Project Cypress
              周围的监管和项目融资依赖，因为 DOE 资金连续性、环境审查、Class VI 封存批准、Subpart RR MRV 和 45Q 经济性，任何一项都可能在客户承诺兑现前打断规模化移除。运营上，公开证明点仍是
              Tracy 设施，披露产能约每年 1,000 吨、运行近 1,000 小时；而融资案例要求大几个数量级的设施可靠运转。这个缺口让严重性偏高，即便可能性只是中等。因此，热力图把政策 / MRV /
              封存视为高影响风险，并把合作伙伴和人员风险视为加速器：它们会把进度滑坡传导到客户信心、利润率、融资和估值。
