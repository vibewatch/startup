  - id: TM001
    title: DAC 型耐久碳移除的市场边界
    layout: wide
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 对 Heirloom 的意义
    rows:
      - - 自愿耐久 CDR 信用
        - 已核验、耐久性超过 100 年的大气 CO2 移除，包括 DAC 信用
        - 避免排放信用、可再生能源证书和非耐久抵消
        - 企业净零团队和可持续采购
        - 承购支持 DAC 项目的核心收入池
      - - 合规与认证移除
        - 符合 EU CRCF、日本 GX-ETS 挂钩机制、未来公共采购或类似项目资格的信用或证书
        - 无认证或注销规则的自愿声明
        - 受监管实体、政府和合规买方
        - 可能打开需求，但时间和资格仍不确定
      - - DAC 项目开发与赋能服务
        - 捕集设备、工厂 EPC、O&M、MRV、CO2 调理、运输、封存和项目融资结构设计
        - 烟囱点源碳捕集，除非与大气移除绑定
        - 项目开发商、政府、基础设施融资方
        - 决定承购能否转化为已交付吨数
      - - 相邻低成本替代品
        - 减排、PPA、REC、自然抵消、避免排放信用和内部碳费
        - 作为永久 CDR 销售的耐久大气移除
        - 可持续、能源和采购团队
        - 决定 DAC 的切换成本和支付意愿上限
      - - 其他耐久 CDR 路径
        - 生物炭、BECCS、增强风化、矿化、海洋碱化、生物油和生物质移除信用
        - 非移除抵消或临时生物封存
        - 与 DAC 相同的企业和中介买方
        - 为价格、耐久性、交付风险和组合配置提供基准
    notes: 边界是分析口径：纳入 / 排除支出来自引用定义和买方行为，不是已报告的市场分类法。
