              Heirloom 的公开收入模式是碳移除基础设施模式，不是软件或硬件转售模式。公司通过长期承购合同销售持久二氧化碳移除信用，买家能承受早期 DAC 价格，以换取高持久性移除、MRV
              和永久封存。最清晰的两个价格锚是 Microsoft 协议和 Frontier 协议：Microsoft 签约最高 315,000 公吨，第三方报道估计约 $200 million；Frontier 买家以
              $26.6 million 签下 26,900
              吨。这些合同暗示的标题价格从数百美元到接近每吨一千美元不等，但它们不等于已确认收入。收入质量取决于设施交付、实测移除、经核证封存、里程碑合规，以及未来低价吨数选择权能否转化为实际体量。因此，会计尽调问题是已签未交付合同储备如何转成收入，而不是简单看已宣布合同价值。
