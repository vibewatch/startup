companyProfile:
  summary: >-
    Heirloom Carbon Technologies 是一家总部位于 San Francisco 的直接空气捕集（DAC）公司，成立于 2020
    年，销售永久性二氧化碳移除服务。其路线是加速石灰石的自然风化——用可再生能源驱动的窑炉从煅烧石灰石中释放 CO2，再把生成的氧化物重新暴露在空气中，使其约三天内重新吸收大气 CO2——随后把捕集到的 CO2
    永久封存。Heirloom 于 2023 年 11 月在加州 Tracy 开设北美首个商业 DAC 设施，也是 DOE 支持的 Louisiana Project Cypress 枢纽的技术提供方。公司吸引了
    Microsoft、Stripe、Meta、Shopify 以及经由 Frontier 的 JPMorgan 等头部碳移除买家，并在 2024 年 12 月完成 $150M Series B，但仍处于规模化前阶段，财务数据未披露。
