            body: >-
              Heirloom 的护城河更像执行型，而非结构上牢不可破。石灰石便宜且充足，流程受益于模块化学习，公司也拥有早期美国设施证明、重大承购和 Louisiana 扩产路径。但如果 DAC 变成标准化商品吨，并具备透明
              MRV，买家主要比较已交付成本、交付风险、封存质量和交易对手实力，这些优势就不够。1PointFive 可以凭既有地下能力做大规模；Climeworks 可以打包组合和运营历史；Avnos
              可以推介产水为正的基础设施；生物炭可以指向当前交付流动性；在买家接受模型不确定性的场景下，海洋 / 增强风化路径可能压低 DAC 价格。负面证据是全行业的：Climeworks 裁员和 Orca 表现不佳、新型
              CDR 已交付基数极小、Microsoft 集中，都说明市场脆弱。核心尽调问题是：在买家稀缺或替代价格曲线侵蚀溢价之前，Heirloom 能否把石灰石成本理论转成可重复建设、利用率和经核证交付。
