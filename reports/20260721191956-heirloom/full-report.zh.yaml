        title: 创始人、领导层与治理依赖
        blocks:
          - type: paragraph
            body: >-
              公开领导层记录显示，公司由创始人驱动，且以 CEO 为中心。Shashank Samala 在 Heirloom 重大融资、Microsoft、Tracy、Louisiana 和 United 公告中都被明确列为
              CEO/联合创始人，这让融资叙事、买家信心和基础设施伙伴关系形成清晰的关键人物依赖。Noah McQueen 则提供技术层面的创始人—市场匹配锚点：Forbes、Penn 和 Incite 来源都把
              McQueen 与碳移除科学以及 Heirloom 创立故事联系起来。董事会和治理透明度明显更薄。Series A 新闻稿称 Ahren 的 Alice Newcombe-Ellis
              将加入董事会，但已抓取的公开资料没有给出完整现任董事会名单、投票控制条款、投资者保护性条款，也没有在 CEO/创始人叙事之外清楚呈现当前高管梯队。我们也没有找到近期 CEO
              更替或重大领导层流失的公开证据。因此，尽调立场不是领导层不稳定，而是：在承销大额融资或二级购买前，必须拿到私营公司治理和继任证据。
