      - number: '8.4'
        title: 否决触发点与最终要求：把公开承诺转成可投资承销证据
        blocks:
          - type: paragraph
            body: >-
              下一轮尽调应围绕否决触发点展开，而不是给叙事一点增量安慰。若确认进场价格高于未经核验的 $900 million 顶端估计，且没有优先权保护，应直接放弃。若公司无法证明当前 DAC 成本正可信地向每吨低于
              $200 推进，也应击穿投资逻辑，因为买方广度和项目融资都取决于可负担性。规模化和 Project Cypress 同样关键：如果 DOE
              提款条件、配套资本、许可、封存合同或施工时间表出现重大滑坡，乐观情景就失去产量桥梁。因此，最终尽调必须要求股权结构表、工厂级成本和运行可用率数据、完整承购合同、项目融资文件、客户管线证据，以及可比估值桥。在审阅上述文件之前，公开证据支持继续研究和建立关系，不支持无条件投资建议。
