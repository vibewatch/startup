      - number: '5.4'
        title: 质量控制：MRV 是核心，但公开证书仍是尽调要求
        blocks:
          - type: paragraph
            body: >-
              Heirloom 的质量主张是持久且额外的移除，不是商品化 CO2 捕集。多个来源支撑这一逻辑：Frontier 购买条款包含 MRV；Isometric 的 DAC
              协议要求测量能源挪用并完成登记级核证；Puro 的地质封存碳方法学宣传 1,000 年以上持久性；EPA Subpart RR 要求覆盖的地质封存设施制定 MRV 计划并提交年度报告。Heirloom
              还承诺不把捕集 CO2
              用于强化采油，并发布与社区相关的安全数据。缺口是设施和批次层面的公开可追溯性。投资人仍需要证书样本、净碳计算、混凝土与地质路径的永久性假设、独立核证方身份、能源采购证据，以及客户合同中的任何返转或未交付条款。
