      - number: '2.3'
        title: 买家、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              买家地图一分为二。超大规模云厂商和软件公司是最清晰的自愿付款方，因为它们有公开净零承诺、成熟的可持续团队，也有足够预算签多年承购。Frontier、Stripe Climate
              等中介把许多较小企业预算汇成池化需求，并降低供应商尽调摩擦。航空、金融服务和难减排工业是可信用户分层，但触发采用的原因不同：航空需要中和残余排放，银行需要让融资排放叙事可信，工业企业需要合规或客户压力。政府则是单独的付款方和市场塑造者：DOE
              枢纽资金与 EU 认证在成为直接购买强制要求前，就已经影响供给和信任。对估值而言，关键采用路径不是认知度，而是一套有资金支持的工作流：从可持续战略到采购批准、风险分配、MRV 接受，再到交付 / 注销证据。
