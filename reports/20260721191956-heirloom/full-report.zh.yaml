      - number: '7.3'
        title: 运营、质量与 MRV 风险
        blocks:
          - type: paragraph
            body: >-
              运营风险主要卡在规模化转化。Heirloom 的 Tracy
              设施证明了商业化运营、可再生能源采购，以及通向永久封存的路径，但公开证据没有披露完整的运行可用率曲线、捕集成本曲线、净能耗强度，或按承购合同核验的交付历史。因此 Frontier
              面向客户的风险提示很关键：它把长期高企的成本和需求不足列为规模化失败的核心模式。MRV 和永久性同样重要，因为买方买的是经过核验的净移除量，不是总捕集量。DOE 买方指南、Isometric
              协议工作、Puro.earth 认证标准、EPA Subpart RR 以及 EPA UIC 财务责任规则都表明，监管方和碳信用买方必须同时接受量化、监测、耐久性和责任控制。Climeworks
              的公开运营数据受到审视，并不等于 Heirloom 失败，但它是一个可用参照：DAC 工厂一旦不透明地宣称性能，信誉会多快流失。
