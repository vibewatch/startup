  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：持久移除，不是普通抵消
        blocks:
          - type: paragraph
            body: >-
              承销 Heirloom
              时，应把它放在持久二氧化碳移除市场里看；直接空气捕集只是其中一条高成本、高永久性的路径。纳入的支出不是所有自愿碳信用、所有避免排放的抵消，也不是每一条企业气候预算。它是买家预算中为经核证大气 CO2
              移除付费的部分，再加上把移除量变成可融资供给的赋能支出：项目开发、捕集设备、测量与核证、封存，以及长期承购融资。相邻预算重要，因为它们是替代品。可持续团队可以先买可再生能源、削减 Scope 1-3
              排放、购买更便宜的自然基抵消，或等合规规则落地后再为 DAC 付费。因此，市场定义是尽调闸门：宽口径气候预算 TAM 确实存在，但 Heirloom 的可服务市场取决于持久移除标准、企业付费意愿和可融资供给。
            claimRefs:
