              作为一家重资产气候公司，Heirloom 拥有异常高质量的早期需求：大型可信买家、既是客户又是投资人的重要客户、Frontier 尽调、DOE
              支持，以及州级项目激励。如果已交付吨数上升、每吨成本下降，这会形成可信融资故事。阻断点同样实质。公司不披露收入、ARR、现金、烧钱速度、跑道期、毛利率、利用率、实际价格、已交付吨数、债务条款或项目融资契约。已宣布承购和融资不能替代设施能够接近铭牌产能运行、且在能源、capex
