            body: >-
              Heirloom 的公开客户群，更适合理解为一组持久碳移除买家，而不是传统软件产品用户。付款方通常是企业气候、可持续或采购团队；用户是买家的碳核算与净零项目；最终运营工作流则是 Heirloom
              的捕集、封存、MRV 和证书交付链。最强的具名分层是企业净零买家，由 Microsoft 最高 315,000 吨合同，以及
              Stripe、Meta、Shopify、JPMorgan、McKinsey、Workday、H&M 和 Autodesk 组成的 Frontier 联盟支撑。第二个分层是早期市场催化买家，如
              Shopify，它资助了初始部署，随后又增加多年承购信号。第三个新兴分层是难减排航空，United Airlines Ventures Sustainable Flight Fund 获得了 CDR
              大额购买权，可能用于支持可持续航空燃料或封存。缺口在于，公开来源披露买家质量和吨数，远多于定价、活跃账户数、续约机制或客户级交付。
