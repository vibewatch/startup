        - 把数十万托盘规模化是运营问题，不只是化学问题
      - - 可再生能源电窑
        - 从石灰石中释放 CO2，并再生反应材料
        - 高温电煅烧设备和额外清洁电力
        - 电价、互联、窑炉效率和设备可得性决定单位经济模型
      - - Leilac 电煅烧合作
        - 为高纯 CO2 和氧化钙提供潜在未来反应器路径
        - 许可 / 合作执行，以及与 Heirloom 工厂整合
        - 从水泥 / 石灰试点转移到 DAC 资产时，技术可能延误或表现不达标
      - - 控制、数据和学习循环
        - 用运营数据优化吸收速率和工厂运营
        - 传感器、算法、工艺工程师和高质量测量数据
        - 公开证据尚未量化开工率、故障模式或算法提升
      - - 额外可再生能源
        - 防止过程排放侵蚀净移除量
        - PPA、电网核算，以及可行时的位置 / 时间匹配
        - DAC 与电网脱碳和数据中心负荷争夺清洁电力
      - - CO2 运输和封存
        - 把捕集 CO2 转化为耐久移除量
        - 混凝土合作伙伴、Class VI 井、管道和封存运营商
        - 封存供给、许可和社区反对，可能卡住原本可运行的捕集工厂
      - - MRV / 注册层
        - 计算净吨数，并支持信用签发
        - 协议、核证方、证据上传、能源核算和客户报告
        - 缺少公开证书样本，使交付质量更难尽调
    notes: 架构风险来自抓取来源和尽调推断识别的依赖风险，不是 Heirloom 已披露的故障事件。
