      - number: '7.4'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Heirloom 的扩张方案从设计上就高度依赖合作伙伴。Project Cypress 依赖 Battelle 作为枢纽牵头方，依赖 Climeworks 作为另一家 DAC 技术供应商，依赖 DOE 拨款，依赖
              Louisiana 和联邦监管机构把关封存，依赖可再生能源供应商提供运营投入，也依赖 Microsoft 和 Frontier
              式买方给出融资设施所需的需求证明。只要每个交易对手都能兑现，合作伙伴结构可以成为优势；但它也制造了相互牵连的失效模式：DOE 暂停会削弱资本信心，Climeworks 争议会污染 DAC
              可信度，封存许可延误会让捕集模块搁置，社区利益争议会拖慢地方审批，承购滑坡会削弱可融资性。因此，依赖地图就是尽调路线图。投资者把 Project Cypress
              作为近期价值驱动因素承销前，应要求披露交易对手状态、替代权、封存路线证据、可再生能源采购状态、买方交付时间表和升级权利。
