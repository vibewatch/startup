  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局：DAC 同行、替代方案与买家其他选择
        blocks:
          - type: paragraph
            body: >-
              Heirloom 首先竞争的是直接空气捕集供应商，而不是普通抵消。最接近的技术同行包括 Climeworks 的固体吸附剂 DAC 组合、1PointFive/Occidental 的 Carbon
              Engineering 液体溶剂 STRATOS 平台、同样产水的 Avnos 混合 DAC、Sustaera 的模块化碱性 DAC，以及 Zero Carbon Systems 目前持有的 Global
              Thermostat 资产。不过，买家的工作不只是购买 DAC：Microsoft、Frontier 成员、Amazon、JPMorgan、Shopify、航空公司和其他持久 CDR 采购方，可以在
              DAC、生物炭、BECCS、增强风化、矿化、生物质封存和海洋碱化之间多归属。它们也可以推迟采购、购买传统抵消或减排，或在持久 CDR
              仍然昂贵时资助内部气候项目。因此，现状和替代路径都是重要竞争对手，即便它们的永久性、MRV 和品牌主张与 DAC 并不相同。Heirloom 的近期定位因此是一个组合仓位：高持久度美国
              DAC，具备石灰石投入优势和可融资承购，但还不是已披露部署管线最大的玩家。
