        - 设施投运前没有可信的封存许可路径
        - 模型中先封住规模化收入，直到封存路径解决
      - - 45Q 经济性
        - 税务律师备忘录、转让市场条款、IRS 指引
        - 资格、可转让性或直接支付价值受到实质损害
        - 上调资本成本，并要求客户价格敏感性分析
      - - 设施爬坡与稼动率
        - 每月已核验净吨数和稼动率
        - 连续两个季度低于计划，且根因未修复
        - 从基准情景切到悲观情景，并暂停后续资本
      - - MRV 或买方证书质量
        - 核验方例外意见和买方接受度
        - 核验方提出重大保留，或买方拒收证书
        - 暂停确认受影响吨数的收入
      - - 社区接受度
        - 社区收益承诺和申诉记录
        - 重大反对、诉讼或本地收益未兑现且未解决
        - 延后 IC 批准，直到签署解决方案
      - - 人员与伙伴执行
        - 高管流失和 PMO 里程碑看板
        - CEO / COO 等级人员流失，或伙伴反复错过里程碑
        - 要求重置治理、招聘运营负责人，或按里程碑分批投资
    notes: 阈值是尽调触发项，不是公司指引；投资前需对照私下管理计划校准。
    claimRefs:
      - CR035
      - CR036
      - CR037
      - CR038
      - CR039
      - CR040
      - CR045
      - CR048
  - id: TV001
    title: 估值门槛下的建议摘要
    columns:
      - 决策字段
      - 本章立场
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 继续研究 / 观察
        - 买方和 DOE 信号强，但估值未披露，仅有老股交易估计
        - 不要只凭公开证据买入；要求开放数据室并提供价格保护
      - - 信心
        - 中-低
        - 许多验证点来自官方渠道，但股权结构表、已实现单位经济性和已交付吨数仍属私下信息
        - 视为可进入尽调，不是可上 IC
      - - 风险评级
        - 高
        - DAC 成本、项目融资、需求集中和政策依赖仍然重要
        - 要求按里程碑分批出资，或设置结构化下行保护
      - - 估值立场
        - 偏高 / 未知
        - 老股交易下限接近 $696M；上限 ~$900M 仍未核验；没有已确认的 $1B 独角兽估值
        - 进入价格必须接近较低估计，或由专有证据支撑
      - - 决策含义
        - 除非条款补偿不透明性，否则放弃
        - 公开证据能支撑资产质量，不能证明任何价格都能跑出清晰的风投回报
        - 仅推进到带终止触发项的确认性尽调
    notes: 这里是非枚举的建议综合；估值按未披露且估计处理，不视为已确认的独角兽价格。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV006
      - CV041
      - CV045
  - id: TV002
    title: 估值投资逻辑与反向逻辑变化日志
    columns:
      - 论点
      - 投资解读
      - 什么会改变判断
    rows:
      - - Microsoft 承购
        - 验证高质量移除需求，也证明项目融资可落地
        - 合同经济性、交付排期、取消权和项目融资可转让性得到核验
      - - Frontier 买方组合
        - 把客户验证从单一战略企业拓宽出去
        - 非科技买方和合规买方形成规模化复购
      - - Project Cypress / Louisiana 规模化
        - 从 Tracy 验证点走向数十万吨规模，有了可信路径
        - DOE 提款条件满足，且独立施工进度尽调确认路径
      - - 战略投资人
        - 航空、航运、制造和日本金融伙伴改善商业化入口
        - 投资人转化为客户、渠道伙伴或项目融资支持
      - - 成本曲线
        - 低成本石灰石叙事是核心上行驱动
        - 已核验工厂数据证明有可信路径低于 $200/tCO2，并最终逼近 $100/tCO2
      - - 反向逻辑：需求集中
        - 可持续的 CDR 市场仍依赖少数气候领先型买方
        - 新买方标识、合规需求和多年签约在手订单让收入更多元
      - - 反向逻辑：补贴 / 项目依赖
        - 经济性尚不能自我造血，因此可能必须依赖 DOE 资金和大额承购
        - 无补贴项目经济性和商业债可得性得到证明
    notes: 这些论点是决策杠杆；表格有意为每个投资逻辑配一项证伪测试。
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV012
      - CV026
      - CV027
      - CV032
      - CV043
  - id: TV003
    title: 概率加权估值情景框架
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Louisiana 设施按计划推进；低于 $200/tCO2 的成本路径变得可信；企业和合规买方拓宽
        - 如果公司成为领先的 DAC 基础设施平台，$695M 进入价可能支持风投回报
        - 建设、许可、能源、封存、MRV 和稀释
        - DOE 里程碑、重复承购和第三方工厂 KPI 同时出现时转正
      - - 基准
        - Heirloom 仍是背书最强的 DAC 平台之一，但公开数据仍缺利润率和规模化交付验证
        - 估计 $695M-$900M 区间介于合理到偏高；回报取决于私下条款和后续资本负担
        - 交付慢、高资本开支、买方集中、优先权不透明
        - 继续跟踪并做数据室尽调；只在接近较低估计或有结构保护时投资
      - - 悲观
        - 成本维持在 $600-$1,000/tCO2 附近，买方增长放缓，或 Project Cypress 延误
        - 可能出现低价融资，或战略期权价值低于当前老股交易估计；公开市场投资人面临稀释风险
        - 政策退坡、项目融资失败、承购延迟
        - 产能 / 成本里程碑未达标，或非科技需求疲弱时触发
    notes: 仅为示意性情景逻辑；Heirloom 未披露估值或财务数据，因此不主张硬性估值。
    claimRefs:
      - CV014
      - CV015
      - CV016
      - CV017
      - CV028
      - CV029
      - CV030
      - CV040
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Heirloom 老股市场标记
        - Forge 2024 年 12 月 Series B-2 投后
        - Forge 报告 ~$695.67M；公开上限仍未核验
        - 最接近的私募市场可观察价格输入
        - 单一老股交易数据源；公司官方未披露估值
      - - Climeworks
        - 股权融资和运营产能
        - CHF 600M / USD 650M 股权轮；Mammoth 最高 36,000 tCO2/yr
        - 最接近的规模化 DAC 私营可比对象
        - 融资规模不是投后估值；技术和地域不同
      - - 1PointFive / STRATOS
        - 项目融资承诺
        - BlackRock 对 STRATOS 的 $550M JV 投资
        - 大型 DAC 部署的基础设施资本可比项
        - 项目经济性落在 Oxy / 1PointFive 内部，不是独立初创公司股权
      - - Carbon Engineering / Occidental
        - 战略并购价值
        - Oxy 收购对价约 $1.1B
        - DAC 技术战略价值参照
        - 战略型油气买家的协同效应会扭曲纯风险投资估值
      - - Frontier Heirloom 承购
        - 已签约需求
        - Heirloom 在更大范围 Frontier 采购中获得 $26.6M、26,900 tCO2 承购，交付期到 2030 年
        - 耐久 CDR 的需求和价格信号
        - 承购价值代表待履约收入，不等于企业价值
      - - 耐久 CDR 市场
        - 市场健康度和买方集中度
        - CDR.fyi 显示订单量增长，但采购方集中度仍高
        - 情景权重的宏观需求背景
        - 市场层面数据无法证明 Heirloom 自身执行力
    notes: 该枚举是选取的 DAC/CDR 可比集，并非碳移除公司的完整清单；各行需要结合业务模式解读，因为指标口径随商业模式而异。
    enumerationScope:
      coverage: sample
      basis: Representative DAC/CDR valuation references with public 2022-2026 evidence relevant to Heirloom entry pricing.
    claimRefs:
      - CV002
      - CV019
      - CV020
      - CV021
      - CV022
      - CV039
  - id: TV005
    title: 估值逻辑破裂与放弃触发点
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 入场价格纪律
        - 已确认的新轮或老股报价高于 $900M，且没有保护性条款
        - 在规模和成本证据验证前压缩预期回报
        - 放弃，或要求分阶段估值和下行优先权
      - - 成本曲线未达标
        - 到 2030 年代初，私有数据仍无法可信证明成本可降至 $200/tCO2 以下
        - DAC 将继续依赖高溢价自愿买方和补贴
        - 工厂 KPI 改善前不投
      - - 规模验证停滞
        - 除 Tracy 和已签约试点外，没有独立验证的已交付规模
        - 削弱从商业验证走向基础设施平台的逻辑
        - 按技术期权价值重估
      - - Project Cypress 延误
        - DOE 拨款、私人配套资金、许可、封存或建设里程碑明显滑坡
        - 削弱乐观情景的销量和融资杠杆
        - 暂停投资，直到里程碑重置有文件佐证
      - - 买方集中
        - 已签约订单仍由 Microsoft、Frontier 和气候领先买方主导
        - 限制总可用市场（TAM）转化和融资可银行性
        - 给予需求折扣，并要求客户管线尽调
      - - 政策 / 封存依赖
        - 45Q、Class VI、封存合作方或社区审批假设转弱
        - 推高项目资本成本和交付风险
        - 要求应急方案，否则放弃
    notes: 放弃触发点是可跟踪的尽调阈值，不是预测。
    claimRefs:
      - CV016
      - CV017
      - CV018
      - CV023
      - CV031
      - CV032
      - CV033
      - CV034
  - id: TV006
    title: IC 定价建议前的最终尽调问题
    columns:
      - 议题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表和优先权
        - 最新完全摊薄股权结构表、清算顺位、期权池、SAFE / 可转债、老股交易
        - 决定 $695M-$900M 名义区间能否对应普通股回报
        - 公司 CFO / 法律顾问；索取融资文件和老股交易历史
      - - 工厂单位经济模型
        - Tracy 和 Louisiana 每毛吨 / 净吨成本、开工率、能源、煅烧、人工、吸附剂、MRV、封存成本
        - 估值敏感性中最大的摆动因素
        - 技术尽调团队；检查工厂数据和 EPC 模型
      - - 承购合同质量
        - 价格、交付日期、救济条款、取消权、可转让性、MRV 要求
        - 把客户名单转成可融资收入，或暴露待履约订单不够硬
        - 商业法律顾问；审阅 Microsoft 和 Frontier 协议
      - - Project Cypress 执行
        - DOE 里程碑、配套资本、许可、社区收益、封存合同、应急预算
        - 乐观情景依赖大型项目融资
        - 基础设施尽调；审阅 DOE 授奖文件和项目计划
      - - 需求管线
        - 非科技买方、合规市场线索、续约率、远期价格曲线
        - 检验早期买方是品类布道者，还是可重复市场
        - GTM 尽调；导出销售管线并做客户访谈和背调
      - - 可比估值桥
        - Heirloom、Climeworks、Sustaera、CarbonCapture 的私人市场估值标记，以及项目融资门槛回报率
        - 避免锚定不可比的轮次规模
        - 投资者关系 / 银行家；索取私有市场可比公司材料
      - - 退出和战略兴趣
        - 潜在战略收购方、IPO 时点、项目级融资替代方案、治理权
        - 决定回报来自公司股权、资产融资还是战略出售
        - IC 主办人，配合银行家和战略方访谈
    notes: 尽调问题刻意聚焦公开抓取来源拿不到的私有证据。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV044
      - CV045
