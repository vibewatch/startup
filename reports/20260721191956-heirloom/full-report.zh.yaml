  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：继续研究；任何买入判断前先守住价格纪律
        blocks:
          - type: paragraph
            body: >-
              Heirloom 是一家高质量 DAC 公司，但公开证据不足以支持在未披露的后期私募价格上直接给出买入建议。本章立场是继续研究 / 观察：公司有强需求验证、具名战略投资人、DOE
              牵引的项目动能和早期商业证明，但官方估值未披露，二级市场证据也不完整。Forge 给出接近 $696 million 的具体投后下限估计，而尽调手册中更宽的约 $695 million 到 $900
              million 区间，应视为相互冲突的估计，不是已确认的独角兽标记。在这个区间，决策更少取决于气候市场热度，更多取决于私有工厂经济性、股权结构表条款和里程碑风险。买方不应把 $150 million Series
              B 当作自证；应坚持专有尽调、结构化下行保护和进场价格纪律。价格纪律保留了选择权：Heirloom
              可能是正确市场里的正确公司，但现有公开记录还不能把质量信号转化为不看价格的推荐。公司和卖方应承担举证责任，说明普通风投稀释、项目延误和成本曲线风险为何已反映在进场条款中。
            claimRefs:
