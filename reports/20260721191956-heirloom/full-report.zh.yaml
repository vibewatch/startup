      - number: '8.2'
        title: 投资逻辑与反向逻辑：证据质量强，但还没有证明可自我造血式规模化
        blocks:
          - type: paragraph
            body: >-
              投资逻辑建立在早期 DAC 平台少见的强信号上：Microsoft 大额承购、Frontier 买方联盟、Tracy 商业设施、Project Cypress
              资格，以及覆盖航空、航运、制造和日本金融的战略投资人联盟。信号之所以重要，是因为 DAC 不能像软件一样估值；可信公司必须把买方、项目融资、封存、可再生电力、许可和工厂学习协调起来。反向逻辑同样有证据支撑。耐久
              CDR 买方增长仍然狭窄，市场报告能看到买方犹豫，公开来源仍指向行业核心成本挑战。支撑乐观情景的同一笔 DOE 拨款和战略投资人名单，也证明这个模型资本开支重、依赖外部融资。因此，只有当 Heirloom
              证明可重复交付吨数、每吨成本下降，并在少数气候领先买方之外扩展需求时，建议才应改变。
