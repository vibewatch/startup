- id: TM004
  title: Growth drivers and adoption constraints affecting DAC uptake
  layout: wide
  columns:
  - Driver/constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Hard-to-abate residual emissions
    - Driver
    - Long-term to 2050
    - Creates a gigaton climate-need TAM for durable CDR
    - Map buyer residual-emissions pathways to funded CDR budgets
  - - DOE Regional DAC Hubs
    - Driver
    - 2020s demonstration cycle
    - Public funding supports million-ton hub ambitions and infrastructure learning
    - Verify Heirloom-specific hub milestones, matching funds, and site schedule
  - - 45Q and IRA tax-credit compliance
    - Driver with execution risk
    - Current project-finance structuring
    - Can improve financeability but requires qualifying capture, utilization/storage, and documentation
    - Review tax-credit eligibility, transferability, and recapture risk per project
  - - EU CRCF and emerging compliance schemes
    - Driver with uncertain demand
    - 2026 onward rulemaking and adoption
    - Certification can build trust but does not automatically create purchase obligation
    - Track eligible methodologies and regulated buyer obligations
  - - Buyer concentration
    - Constraint
    - Current
    - Demand is vulnerable to megabuyer pauses or strategy changes
    - Measure repeat purchase rate excluding Microsoft and Frontier
  - - Low DAC delivery ratio
    - Constraint
    - Current through scale-up
    - Contracted credits are not yet proof of delivered removals or revenue recognition
    - Audit delivery schedules, penalties, storage readiness, and registry retirements
  - - High cost and energy intensity
    - Constraint
    - Current through cost-down curve
    - Limits ROI versus cheaper abatement, nature offsets, and other CDR pathways
    - Benchmark all-in delivered cost per tonne including energy and storage
  - - Standards, MRV, and procurement friction
    - Constraint
    - Current
    - Slows mid-market adoption and makes claims-language risk material
    - Inspect buyer contract terms, MRV data package, insurance, and claims policy
  notes: Drivers and constraints are directional; timing depends on policy implementation, buyer renewals, and project delivery
    evidence.
