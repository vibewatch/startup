- id: drivers-and-constraints
  title: Growth drivers are powerful, but adoption constraints are structural
  body: 'The positive case rests on hard-to-abate residual emissions, policy support, certification, and bankable offtake.
    DOE’s Regional DAC Hubs aim for million-ton annual hub potential, 45Q procedures and IRA updates make tax-credit compliance
    central to project finance, and the EU CRCF plus Japan’s GX-ETS transition point toward a compliance layer. But the constraints
    are just as material. DAC remains energy- and capital-intensive; Grand View Research explicitly flags high operating cost
    and energy intensity. Booked demand is concentrated in a handful of buyers, delivered DAC tonnes remain tiny versus contracted
    volumes, and CDR.fyi’s buyer research points to unresolved carbon accounting, standards, procurement fit, and risk-sharing
    as blockers. These are not cosmetic adoption frictions: they determine whether offtakes are repeatable project-finance
    collateral or one-off climate-tech demonstrations.'
  claimRefs:
  - CM022
  - CM025
  - CM026
  - CM027
  - CM028
  - CM029
  - CM034
  - CM035
  - CM038
  - CM039
  - CM040
  tableRefs:
  - TM004
- id: diligence-implications
  title: Contradictions and diligence gaps to preserve
  body: The diligence posture should preserve contradictory market signals rather than averaging them away. Forecast publishers
    show explosive DAC revenue CAGR and near-term 2030 estimates near $1.7B, while operating data show that delivered DAC
    removals are still measured in thousands, not millions, of tonnes. Corporate net-zero commitments are not the same as
    funded CDR budgets; Carbon Market Watch’s critique of weak 2030 emissions-reduction plans is a direct warning against
    assuming that every net-zero logo becomes a durable-removal customer. Compliance markets could unlock durable demand,
    but the January 2026 policy review says binding mechanisms remain fragmented and supply readiness may be moving faster
    than demand obligations. The next diligence cycle therefore needs contract-level price curves, delivery schedules, tax-credit
    qualification, storage access, and buyer repeat-rate evidence before converting TAM into SOM or valuation upside.
  claimRefs:
  - CM018
  - CM026
  - CM039
  - CM040
  - CM041
tables:
- id: TM001
  title: Market boundary for DAC-based durable carbon removal
  layout: wide
  columns:
  - Segment/category
  - Included spend
  - Excluded spend
  - Buyer/payer
  - Relevance to Heirloom
  rows:
  - - Voluntary durable CDR credits
    - Verified atmospheric CO2 removals with 100+ year durability, including DAC credits
    - Avoided-emissions credits, renewable-energy certificates, and non-durable offsets
    - Corporate net-zero teams and sustainability procurement
    - Core revenue pool for offtake-backed DAC projects
  - - Compliance and certified removals
    - Credits or certificates eligible under EU CRCF, Japan GX-ETS-linked schemes, future public procurement, or similar programs
    - Voluntary claims without certification or retirement rules
    - Regulated entities, governments, and compliance buyers
    - Potential demand unlock, but timing and eligibility remain uncertain
  - - DAC project development and enabling services
    - Capture equipment, plant EPC, O&M, MRV, CO2 conditioning, transport, storage, and project-finance structuring
    - Point-source carbon capture on smokestacks unless tied to atmospheric removal
    - Project developers, governments, infrastructure financiers
    - Determines whether offtakes convert into delivered tonnes
  - - Adjacent lower-cost substitutes
    - Emissions abatement, PPAs, RECs, nature offsets, avoided-emission credits, and internal carbon fees
    - Durable atmospheric removals sold as permanent CDR
    - Sustainability, energy, and procurement teams
    - Sets switching cost and willingness-to-pay ceiling for DAC
  - - Other durable CDR pathways
    - Biochar, BECCS, enhanced weathering, mineralization, ocean alkalinity, bio-oil, and biomass removal credits
    - Non-removal offsets or temporary biological storage
    - Same corporate and intermediary buyers as DAC
    - Benchmarks price, durability, delivery risk, and portfolio allocation
  notes: 'Boundary is analytical: included/excluded spend is derived from cited definitions and buyer behavior, not a reported
    market taxonomy.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
