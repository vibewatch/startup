    severity: material
    topic: DAC market sizing
    missingEvidence: Auditable methodology behind public DAC market-research forecasts and consistent definitions of revenue
      versus credit value.
    whyItMatters: Grand View, Precedence, and MarketsandMarkets converge near 2030 but expose different forecast horizons
      and assumptions.
    diligencePath: Obtain full analyst reports or triangulate with supplier bookings, public project capex, and registry-level
      credit issuance.
