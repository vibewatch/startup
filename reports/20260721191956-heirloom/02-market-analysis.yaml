schemaVersion: report-v2
artifact: market-analysis
slug: heirloom
runDate: '2026-07-21'
company:
  name: Heirloom Carbon Technologies
chapter:
  number: 2
  title: Market Analysis
  summary: The market is large by climate-need and policy-support lenses but still early by delivered DAC tonnes, with demand
    concentrated in a handful of voluntary buyers. Heirloom’s valuation sensitivity should therefore hinge on contracted offtake
    quality, delivery evidence, cost-down path, and conversion of emerging compliance frameworks into funded demand.
sections:
- id: market-boundary
  title: 'Market boundary: durable removals, not generic offsets'
  body: 'Heirloom should be underwritten against the durable carbon dioxide removal market, with direct air capture as one
    high-cost, high-permanence pathway inside that boundary. The included spend is not every voluntary carbon credit, every
    avoided-emissions offset, or every corporate climate budget line. It is the portion of buyer budgets that pays for verified
    atmospheric CO2 removal, plus the enabling spend that turns removals into bankable supply: project development, capture
    equipment, measurement and verification, storage, and long-term offtake finance. Adjacent budgets matter because they
    are substitutes. A sustainability team can first buy renewable energy, reduce Scope 1-3 emissions, purchase cheaper nature-based
    offsets, or wait for compliance rules before paying for DAC. That makes market definition a gating diligence step: the
    broad climate-budget TAM is real, but Heirloom''s serviceable market depends on durable-removal standards, corporate willingness
    to pay, and financeable supply.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Sizing lenses show a large need but a small delivered market
  body: 'The strongest market read is multi-lens rather than a single headline TAM. The outer climate-need lens is gigaton-scale:
    RMI and the State of CDR assessment frame removals as unavoidable for hard-to-abate residual emissions, and CDR.fyi cites
    a roughly 4 Gt durable-CDR pathway by 2050. The disclosed-demand lens is much smaller but now measurable: CDR.fyi reports
    2.3 Mt contracted in Q1 2026 and roughly 46.4 Mt disclosed durable CDR contracts implied by Microsoft’s April 2026 share.
    The DAC lens is smaller still: 2.47 Mt of DAC credits were contracted between 2022 and 2025-H1, but only 1,186 tonnes
    had been delivered by mid-2025. Revenue publishers converge on about $1.7B of global DAC revenue by 2030, yet their long-term
    outputs remain summary-level estimates rather than independently auditable SAM/SOM.'
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM015
  - CM016
