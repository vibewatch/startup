- id: buyers-budget-owners
  title: Buyer, user, and payer segmentation
  body: 'The buyer map is bifurcated. Hyperscalers and software companies are the clearest voluntary payers because they have
    public net-zero commitments, sophisticated sustainability teams, and enough budget to sign multi-year offtakes. Intermediaries
    such as Frontier and Stripe Climate convert many smaller corporate budgets into pooled demand and reduce supplier diligence
    friction. Aviation, financial services, and hard-to-abate industrials are credible user segments, but their adoption triggers
    differ: aviation wants residual-emissions neutralization, banks want financed-emissions credibility, and industrials need
    compliance or customer pressure. Government is a separate payer and market maker: DOE hub funding and EU certification
    shape supply and trust even before they become direct purchase mandates. For valuation, the key adoption path is not awareness;
    it is a funded workflow from sustainability strategy to procurement approval, risk allocation, MRV acceptance, and delivery/retirement
    evidence.'
  claimRefs:
  - CM014
  - CM021
  - CM023
  - CM024
  - CM030
  - CM031
  - CM032
  - CM033
  - CM036
