- id: TM003
  title: Buyer, user, payer, and budget-owner map for durable CDR
  layout: wide
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - Hyperscale and software
    - Microsoft-like sustainability teams
    - Corporate net-zero program and Scope 3 narrative
    - Corporate sustainability or treasury budget
    - Multi-year offtake, supplier diligence, registry retirement
    - Chief Sustainability Officer / finance partner
    - Carbon-negative or net-zero milestone requires durable removals
  - - Pooled procurement platforms
    - Frontier, Stripe Climate, and allied buyers
    - Small and mid-size companies seeking vetted removals
    - Marketplace contribution or advance market commitment
    - Portfolio screening, pooled offtake, milestone payments
    - Sustainability lead or founder/finance approver
    - Need access to vetted CDR without building internal diligence
  - - Aviation and transport
    - Airlines and sustainable aviation funds
    - Residual aviation emissions and customer-facing climate claims
    - Sustainability, fuel strategy, or corporate venture budget
    - Pilot purchase, offtake, SAF/CDR portfolio coordination
    - Net-zero aviation program owner
    - Hard-to-abate residual emissions remain after operational measures
  - - Financial services
    - Banks and asset managers
    - Own operations and financed-emissions credibility
    - Sustainability, CSR, or climate-solutions budget
    - Portfolio purchase, public commitment, retirement evidence
    - CSO / ESG reporting / procurement
    - Client and regulator scrutiny of net-zero plans
  - - Government and compliance buyers
    - DOE, EU, Japan, future regulated entities
    - Public climate targets and regulated residual emissions
    - Public appropriations, tax credits, or compliance budgets
    - Grant, tax-credit qualification, certified credit purchase
    - Energy ministry, regulator, or compliance desk
    - Certification or mandatory scheme makes removals eligible
  - - Industrial hard-to-abate
    - Cement, steel, energy, chemicals, and manufacturing firms
    - Residual emissions after abatement capex
    - Decarbonization capex, compliance, or customer-premium budgets
    - Internal abatement first, then durable removals for residuals
    - Operations, procurement, and sustainability jointly
    - Compliance cost or customer contract values durable neutralization
  notes: Segmentation is a buying-workflow map, not an exhaustive customer list; unsupported private budget sizes remain diligence
    gaps.
