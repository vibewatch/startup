    {
      "id": "cover-metric-gaps-and-diligence-asks",
      "title": "Cover metrics, unsupported numbers, and diligence implications",
      "body": "The cover-metric stance is intentionally conservative. Total raised is supportable; valuation is not, except as an estimated secondary-market range with a strong caveat; named customers are supportable, but an active customer count is not; facility capacity is supportable for Tracy and announced Louisiana plants, but delivered tons, utilization, revenue, ARR, gross margin, burn, runway, and company-wide headcount are not disclosed in the fetched public set. This matters because Heirloom’s investability cannot be read from venture round size alone. The company is operating in an infrastructure market where contracted offtake, DOE hub funding, Class VI storage, renewable-power procurement, project finance, and cost-down execution all have to line up. The practical diligence package should request the cap table, board roster, latest budget, revenue and booked backlog, contracted delivery schedule by buyer, delivered removals, facility utilization, energy-cost assumptions, storage permits, employee roster, and any debt or project-finance commitments before treating the $695M–$900M secondary range as actionable pricing.",
