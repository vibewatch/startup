    {
      "id": "founders-leadership-and-governance",
      "title": "Founders, leadership, and governance dependence",
      "body": "The public leadership record is founder-led and CEO-centric. Shashank Samala is consistently the named CEO/co-founder in Heirloom’s major financing, Microsoft, Tracy, Louisiana, and United announcements, which creates a clear key-person dependency for fundraising narrative, buyer confidence, and infrastructure partnerships. Noah McQueen supplies the technical founder-market-fit anchor: Forbes, Penn, and Incite sources connect McQueen to carbon-removal science and Heirloom’s founding story. Board and governance transparency is materially thinner. The Series A release states that Alice Newcombe-Ellis of Ahren would join the board, but the fetched public set does not provide a complete current board roster, voting-control terms, investor protective provisions, or a clear current executive bench beyond the named CEO/founder narrative. We also found no public evidence of a recent CEO transition or material leadership churn. The diligence stance is therefore not that leadership is unstable; it is that private governance and succession evidence must be obtained before underwriting a large financing or secondary purchase.",
