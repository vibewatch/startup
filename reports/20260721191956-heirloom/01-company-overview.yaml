      "id": "milestones-and-chronology-of-record",
      "title": "Milestones and chronology of record",
      "body": "The overview chronology should be reused as the single record for dated Heirloom milestones. The company moved from founding in 2020 and early Frontier/customer validation into a $53M Series A in 2022, then converted that credibility into a September 2023 Microsoft offtake, the November 2023 Tracy opening, and a Frontier buyers agreement the same month. The 2024 layer added DOE’s $50M Project Cypress phase award, the Northwest Louisiana expansion plan, and the $150M Series B. By 2025, United’s Sustainable Flight Fund added aviation-linked demand and capital, while 2026 public reporting indicates Project Cypress remained eligible for up to $600M after a federal review. The table below deliberately mixes founding, financing, product, scale, regulatory, partnership, governance, and adverse entries. It includes adverse cost skepticism because the company-overview chapter must preserve not only promotional milestones but also the scale and cost hurdles that later market, product, financial, and risk chapters will test.",
