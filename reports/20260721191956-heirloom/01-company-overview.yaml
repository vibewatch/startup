    {
      "id": "capitalization-valuation-and-stakeholders",
      "title": "Funding, valuation, and stakeholder map",
      "body": "Heirloom’s funding history is now substantial but still private-company opaque. The canonical equity path is a $53M Series A in March 2022, led by Carbon Direct Capital Management, Ahren Innovation Capital, and Breakthrough Energy Ventures with Microsoft Climate Innovation Fund participation, followed by a $150M Series B announced December 4, 2024 and co-led by Future Positive and Lowercarbon Capital. Together those rounds support a simple public total of over $200M, approximately $203M, while Forge lists $207.43M. Valuation is the key disputed cover fact: Heirloom did not officially disclose a valuation in its Series B materials, and the best public framing is undisclosed with secondary estimates around $695M to $900M and unconfirmed unicorn status. The stakeholder map is broader than venture investors: Microsoft, Frontier buyers, United, DOE/Battelle, Louisiana officials, CapturePoint, and industrial strategics all matter because Heirloom needs buyer commitments, public funding, storage infrastructure, and project finance to scale.",
