- id: scenario-comparables
  title: 'Scenario valuation: use milestone probability, not a single headline multiple'
  body: 'A probability-weighted milestone framework is the right valuation lens. The bull case is not simply that Heirloom becomes a larger startup; it is that the company turns early customer proof and DOE-linked infrastructure into a low-cost, bankable DAC platform. The base case is more cautious: Heirloom may remain one of the strongest private DAC companies while still offering limited risk-adjusted upside if entry occurs near the high end of an estimated $695 million to $900 million range. The bear case is a repricing if the company cannot bridge from a 1,000-ton facility and signed offtakes to independently verified, financed, multi-hundred-thousand-ton operations. Comparables reinforce the need for caution. Climeworks, 1PointFive/STRATOS, Carbon Engineering, and Frontier offtakes are relevant, but each maps to a different financial object: equity round, project-finance commitment, strategic M&A, or revenue contract.'
