- id: TV003
  title: Probability-weighted valuation scenario framework
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Louisiana facilities stay on track; cost path under $200/tCO2 becomes credible; enterprise and compliance buyers broaden
    - A $695M entry could plausibly underwrite venture return if the company becomes a leading DAC infrastructure platform
    - Construction, permitting, energy, storage, MRV, and dilution
    - Positive if DOE milestones, repeat offtakes, and third-party plant KPIs arrive together
  - - Base
    - Heirloom remains one of the best-backed DAC platforms, but public data still lacks margins and delivered-scale proof
    - Estimated $695M-$900M range is fair-to-stretched; return depends on private terms and follow-on capital burden
    - Slow delivery, high capex, buyer concentration, opaque preferences
    - Track with data-room diligence; invest only near lower estimate or with structure
  - - Bear
    - Costs remain near $600-$1,000/tCO2, buyer growth slows, or Project Cypress slips
    - Down-round or strategic-option value below current secondary estimates; public investors face dilution risk
    - Policy pullback, project-finance failure, offtake delays
    - Triggered by missed capacity/cost milestones or weak non-tech demand
  notes: Illustrative scenario logic only; no hard valuation is asserted because Heirloom has not disclosed valuation or financials.
