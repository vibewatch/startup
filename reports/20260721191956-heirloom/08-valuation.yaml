- id: TV006
  title: Final IC diligence asks before a price recommendation
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and preferences
    - Current fully diluted cap table, liquidation stack, option pool, SAFEs/convertibles, secondary trades
    - Determines whether $695M-$900M headline range maps to common-equity return
    - Company CFO / counsel; request financing documents and secondary history
  - - Plant unit economics
    - Tracy and Louisiana cost per gross/net tonne, uptime, energy, calcination, labor, sorbent, MRV, storage costs
    - Largest swing factor in valuation sensitivity
    - Technical diligence team; inspect plant data and EPC model
  - - Offtake contract quality
    - Prices, delivery dates, remedies, cancellation rights, assignability, MRV requirements
    - Converts customer logos into bankable revenue or exposes soft backlog
    - Commercial counsel; review Microsoft and Frontier agreements
  - - Project Cypress execution
    - DOE milestones, matching capital, permits, community benefits, storage contracts, contingency budget
    - Bull case depends on large-scale project finance
    - Infrastructure diligence; review DOE award documentation and project plan
  - - Demand pipeline
    - Non-tech buyers, compliance-market leads, renewal rates, forward price curve
    - Tests whether early buyers are category evangelists or repeatable market
    - GTM diligence; pipeline export and customer references
  - - Comparable valuation bridge
    - Private marks for Heirloom, Climeworks, Sustaera, CarbonCapture, and project-finance hurdle rates
    - Avoids anchoring on incomparable round sizes
    - Investor relations / bankers; request private-market comp deck
  - - Exit and strategic interest
    - Likely strategic acquirers, IPO timing, project-level financing alternatives, governance rights
    - Determines whether return comes from company equity, asset finance, or strategic sale
    - IC sponsor with bankers and strategic references
  notes: Diligence asks intentionally focus on private evidence unavailable in fetched public sources.
