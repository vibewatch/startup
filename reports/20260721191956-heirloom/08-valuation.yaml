  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation-disclosure
    missingEvidence: Company-confirmed post-money valuation, current secondary marks, and full financing terms for every Series B extension.
    whyItMatters: The investment recommendation is price-sensitive and public sources do not confirm a hard valuation or unicorn status.
    diligencePath: Request capitalization table, board-approved financing summary, and third-party secondary-market history from company and existing investors.
    relatedQuestionRefs:
    - QV001
    - QV002
    - QV003
    - QV021
    - QV032
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Plant-level cost per net delivered tonne, uptime, energy intensity, sorbent/calcination costs, MRV costs, and storage liabilities.
    whyItMatters: Cost-per-ton is the dominant valuation sensitivity and public sources only provide broad current DAC cost ranges.
    diligencePath: Conduct technical data-room review and independent engineering diligence for Tracy and Louisiana designs.
    relatedQuestionRefs:
    - QV012
    - QV013
    - QV014
    - QV022
    - QV028
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: offtake-quality
    missingEvidence: Full Microsoft, Frontier, and other buyer agreements with price, delivery schedule, remedies, termination rights, and assignability.
    whyItMatters: Customer logos convert to valuation only if contracts are bankable and financeable.
