  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Heirloom secondary-market mark
    - Forge Dec. 2024 Series B-2 post-money
    - ~$695.67M reported by Forge; public upper end remains unverified
    - Closest observed private-market price input
    - Single secondary data source; company valuation officially undisclosed
  - - Climeworks
    - Equity financing and operating capacity
    - CHF 600M / USD 650M equity round; Mammoth up to 36,000 tCO2/yr
    - Closest scaled DAC private comparable
    - Round size is not post-money valuation; different technology and geography
  - - 1PointFive / STRATOS
    - Project-finance commitment
    - BlackRock $550M JV investment in STRATOS
    - Infrastructure capital comparable for large DAC deployment
    - Project economics inside Oxy/1PointFive, not standalone startup equity
  - - Carbon Engineering / Occidental
    - Strategic M&A value
    - Oxy acquisition consideration approximately $1.1B
    - DAC technology strategic value reference
    - Strategic oil-and-gas buyer synergies distort pure venture valuation
  - - Frontier Heirloom offtake
    - Contracted demand
    - Heirloom $26.6M offtake for 26,900 tCO2 by 2030 within wider Frontier procurement
    - Demand and price signal for durable CDR
    - Offtake value is revenue backlog, not enterprise value
  - - Durable CDR market
    - Market health and buyer concentration
    - CDR.fyi says order volume grew but purchaser concentration stayed high
    - Macro demand context for scenario weights
    - Market-level data cannot prove Heirloom-specific execution
  notes: Enumeration is a selected DAC/CDR comparable set, not an exhaustive list of carbon-removal companies; rows require interpretation because metrics differ by business model.
