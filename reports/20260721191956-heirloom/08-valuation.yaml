- id: TV002
  title: Valuation thesis and anti-thesis change log
  columns:
  - Argument
  - Investment read
  - What would change the view
  rows:
  - - Microsoft offtake
    - Validates demand and project-finance bankability for high-quality removals
    - Contract economics, delivery schedule, cancellation rights, and project finance assignability verified
  - - Frontier buyer set
    - Broadens customer proof beyond one strategic enterprise
    - Repeat purchases from non-tech and compliance buyers at scale
  - - Project Cypress / Louisiana scale
    - Creates a plausible route from Tracy proof to hundreds of thousands of tonnes
    - DOE draw conditions met and independent construction schedule diligence confirms path
  - - Strategic investors
    - Aviation, shipping, manufacturing, and Japanese finance partners improve commercialization access
    - Investors convert into customers, channel partners, or project-finance support
  - - Cost curve
    - Low-cost limestone narrative is the core upside driver
    - Verified plant data shows credible path below $200/tCO2 and eventually toward $100/tCO2
  - - 'Anti-thesis: demand concentration'
    - Durable CDR market still depends on a small set of climate-forward buyers
    - New buyer logos, compliance demand, and multi-year contracted backlog diversify revenue
  - - 'Anti-thesis: subsidy/project dependence'
    - DOE funding and large offtakes may be necessary because economics are not self-funding
    - Unsubsidized project economics and commercial debt availability are demonstrated
  notes: Arguments are decision levers; table intentionally pairs each thesis point with a disconfirming test.
