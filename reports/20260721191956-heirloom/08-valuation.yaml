  title: Valuation-gated recommendation summary
  columns:
  - Decision field
  - Chapter stance
  - Evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - Research-more / track
    - Strong buyer and DOE signals, but valuation is undisclosed and only secondary-estimated
    - Do not buy on public evidence alone; request data room and price protection
  - - Confidence
    - Medium-low
    - Many proof points are official, but cap table, realized unit economics, and delivered tonnes are private
    - Treat as diligence-ready, not IC-ready
  - - Risk rating
    - High
    - DAC cost, project finance, demand concentration, and policy dependencies remain material
    - Require milestone tranching or structured downside protection
  - - Valuation stance
    - Stretched / unknown
    - Secondary lower bound near $696M; top-end ~$900M remains unverified; no confirmed $1B unicorn
    - Entry must be near lower estimate or justified by proprietary proof
  - - Decision implication
    - Pass unless terms compensate for opacity
    - Public proof supports quality, not a clean venture return at any price
    - Advance only to confirmatory diligence with kill triggers
