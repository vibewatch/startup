tables:
- id: TP001
  title: Competitive landscape by buyer alternative
  columns:
  - Alternative
  - Category
  - What buyer gets
  - Evidence-backed strength
  - Primary limitation
  rows:
  - - Heirloom limestone DAC
    - Direct DAC peer
    - Permanent DAC credits from limestone cycling and storage
    - First U.S. commercial DAC facility plus Microsoft and Frontier offtakes
    - Scale still trails 1PointFive and cost targets remain unproven
  - - Climeworks solid-sorbent DAC
    - Direct DAC peer
    - DAC credits and portfolio solutions with Iceland operations
    - Multiple real-world projects and Mammoth at tens-of-thousands-ton scale
    - Public reporting cites high cost, layoffs, and Orca utilization shortfall
  - - 1PointFive / Occidental STRATOS
    - Incumbent-backed direct DAC
    - Large-scale DAC credits with geologic storage
    - 500,000 t/yr STRATOS design, Class VI permits, Amazon and Microsoft contracts
    - Fossil-incumbent optics and large first-of-kind execution risk
  - - Avnos HDAC
    - Adjacent DAC peer
    - Carbon removal plus water production using low-grade heat
    - Project Cedar target of 3,000 tCO2 and 6,000 tons water annually
    - Commercial-scale delivery remains pending until 2026 facility startup
  - - Sustaera alkaline DAC
    - Adjacent DAC peer
    - Modular DAC pitched around land and supply-chain efficiency
    - Claims modular, land-efficient design and 2026 cost/energy improvements
    - Limited third-party delivery proof and small disclosed sold volume
  - - Zero Carbon Systems / Global Thermostat
    - Legacy DAC asset / likely entrant
    - Continuous DAC process using acquired Global Thermostat IP
    - Acquired a DAC patent base and claims megaton-plus design ambition
    - Commercial traction and delivered volumes are not public
  - - Biochar / biomass pathways
    - Substitute CDR
    - Durable credits from stabilized biomass or biochar
    - Dominates current delivered durable CDR leaderboards
    - Feedstock, land-use, and permanence quality vary by project
  - - Ocean alkalinity / marine CDR
    - Substitute CDR
    - Credits from enhanced ocean uptake
    - First registry-validated credits show market formation
    - MRV uncertainty and open-system permanence remain material
  notes: Partial landscape focused on buyer-relevant alternatives with public evidence; unsupported segments such as internal
    enterprise DAC builds are addressed in prose rather than enumerated as active vendors.
