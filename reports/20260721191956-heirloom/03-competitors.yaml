  rows:
  - - Heirloom
    - Limestone DAC
    - 1,000 t/yr Tracy; nearly 320,000 t/yr Louisiana plan; $150M Series B
    - Enterprise durable-CDR buyers and project-finance-backed offtakes
    - Low-cost limestone input, modular process, Microsoft and Frontier demand proof
    - Needs repeatable scale-up and delivered-cost evidence
  - - Climeworks
    - Solid-sorbent DAC
    - Orca, Mammoth tens-of-thousands-ton project, roughly $810M raised per Canary
    - Enterprises buying DAC and managed CDR portfolios
    - Operating history, storage partners, portfolio distribution
    - High current cost and adverse utilization/layoff evidence
  - - 1PointFive
    - Liquid-solvent DAC / incumbent
    - STRATOS designed for 500,000 t/yr; $550M BlackRock JV
    - Large corporates seeking high-volume DAC credits
    - Occidental subsurface, Class VI permits, Microsoft/Amazon contracts
    - First-of-kind mega-project and fossil-incumbent trust risk
  - - Sustaera
    - Modular alkaline DAC
    - Small disclosed sold volume; 2026 claims of energy/cost improvements
    - Industrial buyers seeking lower-cost modular DAC
    - Land-efficient design using existing supply chains
    - Independent operating proof is thin
  - - Avnos
    - Hybrid DAC
    - '>$100M backing; Project Cedar 3,000 tCO2/yr target'
    - Data centers and infrastructure with water/cooling constraints
    - Produces water and uses low-grade waste heat
    - Scale is pilot-to-early commercial
  - - Zero Carbon Systems
    - Continuous DAC / acquired IP
    - Acquired Global Thermostat; claims megaton-plus architecture
    - Infrastructure buyers wanting lower-energy DAC
    - Legacy IP plus new design and management team
    - Limited public customer and delivery evidence
  - - Biochar suppliers
    - Substitute CDR
    - Top delivered-tonne suppliers on CDR.fyi are biochar-heavy
    - Buyers optimizing for available durable tonnes
    - Delivery liquidity and lower complexity
    - Quality depends on biomass sourcing and methodology
  - - Ocean alkalinity startups
    - Substitute CDR
    - Early credits such as Planetary first issuance
    - Frontier-style buyers funding emerging methods
    - Large theoretical storage capacity
    - MRV uncertainty and open-ocean variability
  notes: Scale/funding cells combine official facility statements, buyer announcements, and independent reporting; unknown
    realized prices or utilization are intentionally not inferred.
