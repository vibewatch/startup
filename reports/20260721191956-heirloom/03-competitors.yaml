company:
  name: Heirloom Carbon Technologies
chapter:
  number: 3
  title: Competitive Landscape
  summary: Heirloom has credible buyer validation and a differentiated limestone DAC process, but the competitive benchmark
    is set by 1PointFive scale, Climeworks operating history, and cheaper or more liquid substitute CDR pathways. Its moat
    depends on converting offtakes and limestone cost theory into verified, low-cost delivery before DAC becomes a standardized
    tonne.
sections:
- id: landscape-map
  title: 'Landscape: DAC peers, substitutes, and buyer alternatives'
  body: 'Heirloom competes first against direct air-capture suppliers, not generic offsets. Its closest technical peers are
    Climeworks'' solid-sorbent DAC portfolio, 1PointFive/Occidental''s Carbon Engineering liquid-solvent STRATOS platform,
    Avnos'' hybrid DAC that also produces water, Sustaera''s modular alkaline DAC, and the Global Thermostat assets now held
    by Zero Carbon Systems. The buyer''s job, however, is broader than buying DAC: Microsoft, Frontier members, Amazon, JPMorgan,
    Shopify, airlines, and other durable-CDR purchasers can multi-home across DAC, biochar, BECCS, enhanced weathering, mineralization,
    biomass storage, and ocean alkalinity. They can also defer purchases, buy conventional offsets or emissions reductions,
    or fund internal climate projects while durable CDR remains expensive. That makes the status quo and substitute pathways
    material competitors even when their permanence, MRV, and brand claims are not identical to DAC. Heirloom''s near-term
    positioning is therefore a portfolio slot: high-durability U.S. DAC with limestone input advantages and bankable offtakes,
    but not yet the largest disclosed deployment pipeline.'
