- id: TP005
  title: Moat durability and competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Low-cost limestone input and simple supply chain
    - DAC credits standardize around delivered cost and MRV, not material novelty
    - High
    - Request plant-level capex, energy, uptime, and cost-down curve from Tracy to Louisiana
  - - Bankable Microsoft and Frontier offtakes
    - Buyer concentration lets Microsoft/Frontier redirect marginal budgets to cheaper paths
    - High
    - Review termination rights, milestone schedule, prepayment, and project-finance covenants
  - - First U.S. commercial DAC proof
    - 1PointFive overtakes on volume with STRATOS and Class VI storage
    - Medium
    - Benchmark delivered tonnes, storage permits, and construction schedule by site
  - - MRV and permanence trust
    - Biochar and registry-backed substitutes show more delivered tonnes today
    - Medium
    - Compare audit trail, storage liability, buffer pools, and reversal treatment by method
  - - Operational learning loop
    - Climeworks experience shows learning can coexist with underutilization and layoffs
    - Medium
    - Demand utilization, uptime, maintenance, and capture-rate data for each module generation
  - - Partner ecosystem in Louisiana
    - Permitting, power, community, or storage bottlenecks delay scale
    - Medium
    - Confirm renewable PPAs, Class VI/storage access, community agreements, and EPC readiness
  notes: Risk severity reflects competitive impact, not company survival probability; each mitigation is a diligence action
    needed before underwriting moat durability.
