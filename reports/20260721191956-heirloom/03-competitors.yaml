  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized net price, discount schedule, prepayment terms, and delivery penalties for Heirloom, Climeworks,
      and 1PointFive contracts.
    whyItMatters: Published offtakes disclose volume more often than economics, so competitive price position may be misread
      from list or implied prices.
    diligencePath: Request redacted customer contracts, invoice schedules, and project-finance model sensitivities under NDA.
    relatedQuestionRefs:
    - QP004
    - QP013
    - QP014
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: delivered-dac-volumes
    missingEvidence: Audited delivered tonnes and utilization by facility for Heirloom Tracy, Climeworks Mammoth/Orca, and
      1PointFive STRATOS once operational.
    whyItMatters: Competitive scale claims are based on design capacity and sold volumes rather than fully audited delivered
      removals.
    diligencePath: Obtain registry retirements, third-party MRV statements, and facility uptime/capture logs for each site.
    relatedQuestionRefs:
    - QP011
    - QP017
    - QP025
    relatedTableRefs:
    - TP004
  - type: enumeration-incomplete
    severity: minor
    topic: competitive-landscape
    missingEvidence: Full long-tail list of enhanced weathering, BECCS, biomass storage, mineralization, and ocean suppliers
      active in each buyer segment.
    whyItMatters: The chapter profiles representative substitutes, but buyer RFPs may include additional suppliers not captured
      in public sources.
    diligencePath: Export current supplier lists from CDR.fyi portal and major registries, then map by delivery method and
      buyer overlap.
    relatedQuestionRefs:
    - QP001
    - QP016
    - QP023
    relatedTableRefs:
    - TP001
  - type: conflicting-data
    severity: material
    topic: cost-targets
    missingEvidence: Comparable cost accounting definitions across DAC vendors, including energy, storage, MRV, financing,
      overhead, and learning-curve assumptions.
    whyItMatters: Vendor cost claims are not normalized; a lower capture-cost target may exclude storage or finance costs
      a buyer ultimately pays.
    diligencePath: Build a normalized $/net-ton cost bridge using vendor data rooms and third-party engineering review.
    relatedQuestionRefs:
    - QP005
    - QP014
    - QP025
    relatedTableRefs:
    - TP005
