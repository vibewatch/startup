- id: TP003
  title: Pricing and packaging comparison for durable CDR buyers
  columns:
  - Supplier / pathway
  - Price or contract signal
  - Included capabilities
  - Discounts / unknowns
  - Competitive implication
  rows:
  - - Heirloom Frontier
    - ~$989/t implied by $26.6M for 26,900 t
    - Removal plus MRV and permanent storage
    - Future option tonnes may be lower priced
    - Shows premium DAC demand but leaves realized gross margin unknown
  - - Heirloom current DAC range
    - Company spokesperson range $600-$1,000/t cited by TechCrunch/Canary
    - Permanent limestone DAC credits
    - Industry target $200-$300 early next decade
    - Heirloom must show cost-down before commodity pressure rises
  - - Climeworks
    - JPMorgan price around $800/t; individual price cited at $1,000/t
    - DAC capture, storage, portfolio service layer
    - Mammoth operating cost closer to $1,000 than $100 per Canary
    - Sets high-price umbrella but adverse performance narrows tolerance
  - - 1PointFive
    - Microsoft 500,000 t and Amazon 250,000 t; price undisclosed
    - Large-volume DAC credits from STRATOS with storage
    - Contract economics not public
    - Scale may win buyers even without public price transparency
  - - Biochar
    - No single price quoted here; CDR.fyi shows delivery liquidity
    - Durable biomass carbon storage under methodologies
    - Feedstock and quality differences drive dispersion
    - Can undercut DAC for buyers willing to accept project heterogeneity
  - - Ocean alkalinity
    - Early credits validated; price not public in cited source
    - Modeled marine CO2 uptake and MRV package
    - Uncertainty bars and compliance-grade claims unresolved
    - Could displace some exploratory budgets but not conservative DAC demand
  - - Status quo / delay
    - No CDR purchase; emissions reduction or lower-quality offsets
    - Budget retention or cheaper decarbonization work
    - Does not create durable removal claim
    - Strong substitute while DAC remains expensive and scarce
  notes: Prices are public list or implied values, not realized net revenue. Unknown means no fetched source disclosed the
    contract price.
