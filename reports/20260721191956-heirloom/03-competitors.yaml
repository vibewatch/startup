- id: moat-durability-and-adverse-evidence
  title: Moat durability and displacement risk
  body: 'Heirloom''s moat looks more executional than structurally impregnable. Limestone is cheap and abundant, the process
    benefits from modular learning, and the company has early U.S. facility proof, major offtakes, and a Louisiana scale path.
    But those advantages are not sufficient if DAC becomes a standardized commodity tonne with transparent MRV and buyers
    compare mostly on delivered cost, delivery risk, storage quality, and counterparty strength. 1PointFive can out-scale
    through incumbent subsurface capabilities; Climeworks can bundle portfolios and operating history; Avnos can pitch water-positive
    infrastructure; biochar can point to current delivery liquidity; and ocean/enhanced-weathering pathways may undercut DAC
    where buyers accept model uncertainty. The adverse evidence is sector-wide: Climeworks'' layoffs and Orca underperformance,
    novel CDR''s tiny delivered base, and Microsoft concentration all indicate that the market is fragile. The core diligence
    ask is whether Heirloom can convert limestone cost theory into repeatable construction, utilization, and verified delivery
    before buyer scarcity or substitute price curves erode its premium.'
