summary:
  headline: >
    Alumis 进入 2026 年时，是口服 TYK2 抑制剂里最强的 pre-NDA 标的：Phase 3 PASI 90 约 65%、现金 $569.5M、分析师一致强买入并隐含约 60% 上行；在 $3.16B
    市值下可买入，但单一资产 FDA 二元风险让信心只到中等。
