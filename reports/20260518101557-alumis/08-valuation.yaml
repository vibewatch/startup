  - id: valuation-context
    title: Valuation Context and Comparable Analysis
    body: >
      At $24.86 per share and approximately $3.16 billion market cap as of May 18, 2026, ALMS trades at a steep premium to tangible assets but a meaningful discount to analyst consensus targets. Wall Street carries a strong buy consensus across 10–13 analysts, with average price targets of approximately $40 per share (range $25–$55) implying roughly 60% upside. Leading targets include Oppenheimer at $55, Wells Fargo at $51, and Morgan Stanley at $38. This valuation is broadly consistent with precedent for late-stage pre-commercial biotechs with class-leading Phase 3 data: the psoriasis and autoimmune space has seen acquisitions commanding 50–100%+ premiums. The January 2026 upsized public offering raised $345.1 million at $17 per share; the stock has since appreciated ~46%, reflecting strong demand for the Phase 3 efficacy story. Comparable analysis anchors to similarly positioned pre-NDA biotechs and recently transacted dermatology and immunology assets. Takeda's zasocitinib is the closest competitive complication, also planning a 2026 FDA filing with PASI 90 >50%. BMS Sotyktu, the only approved oral TYK2 inhibitor, generated approximately $190M in 2024 revenue, well below peak forecasts, revealing the challenge of formulary access and biologic incumbent entrenched positioning. An EV/peak-sales multiple of 1.0–1.5x applied to an envudeucitinib psoriasis peak sales estimate of $2.5B yields a fair-value range of approximately $3.2–$4.2B, suggesting the current market cap is fair to modestly undervalued assuming successful launch.
