  - id: exit-readiness
    title: Exit Readiness and Final Diligence Asks
    body: >
      Alumis is already publicly traded (NASDAQ: ALMS), completing the IPO exit path for early investors in June 2024. The remaining exit mechanisms for investors are: stock appreciation through FDA approval and commercial launch, targeted at analyst consensus of $40 per share; M&A by a large pharmaceutical company seeking oral immunology capabilities, with Alumis an attractive target for AbbVie, Pfizer, or Sanofi given its class-leading TYK2 data; and partnership or licensing deals for ex-US rights or the SLE indication that could validate the pipeline while providing non-dilutive capital. Immediate diligence asks focus on the NDA package readiness covering manufacturing CMC, clinical module completeness, and pediatric study waivers; SLE LUMUS primary endpoint details; competitive positioning against Takeda zasocitinib in timing and label; and payer strategy for formulary positioning at launch. The company's cash runway of approximately $569.5M should fund operations through late 2027, providing coverage through an expected FDA review period of 12 months post-filing. The Kaken Pharmaceutical partnership revenue concentration remains a vulnerability if that agreement is renegotiated.
