    title: "Investment Recommendation: BUY (Medium Confidence)"
    body: >
      Alumis earns a buy rating driven by class-leading Phase 3 efficacy, a $569.5M cash cushion, and analyst consensus implying ~60% upside to the $40 price target. The H2 2026 NDA filing is the key binary catalyst. Position sizing should reflect the single-asset concentration risk and elevated short interest of ~15.5% of float.
    claimRefs:
      - CV001
      - CV002
      - CV013
      - CV022
  - calloutType: risk
    title: "Key Risk: Binary FDA Outcome on Single Asset"
    body: >
      Alumis has one commercial-stage pipeline asset. A FDA complete response letter for the envudeucitinib psoriasis NDA — estimated at ~15% probability based on Phase 3 data quality — could reset the market cap to the $0.9–$1.5B bear case range, a 50–70% decline from current levels.
    claimRefs:
      - CV030
      - CV031
      - CV038
  - calloutType: insight
    title: "Comparable Valuation Check: Current Price Between Bear and Base Cases"
    body: >
      At $3.16B market cap, ALMS trades above the bear case ($0.9–$1.5B) and below the base case midpoint ($4.5B), implying the market assigns roughly 60–70% probability to an approval outcome. This is a reasonable probability-weighted pricing for a Phase 3-complete program with positive Phase 3 data and strong analyst support.
