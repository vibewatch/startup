  name: Alumis Inc.
chapter:
  number: 8
  title: Valuation and Investment Recommendation
  summary: "Alumis (NASDAQ: ALMS) enters May 2026 as a near-inflection public biotech trading at ~$3.16B market cap with Phase 3 ONWARD data showing class-leading PASI 90 of ~65% at Week 24 and $569.5M cash providing runway into late 2027. The stock earns a buy recommendation with medium confidence: the NDA filing in H2 2026 is a binary catalyst, analyst consensus targets $40 (+60% implied upside), but high short interest and single-asset concentration create a stretched-to-fair valuation that demands execution discipline."
sections:
  - id: investment-thesis
    title: Investment Thesis and Anti-Thesis
    body: >
      Alumis presents a compelling buy thesis anchored in three pillars: class-leading clinical efficacy, a large underpenetrated addressable market, and a well-capitalized pre-approval balance sheet. Phase 3 ONWARD1 and ONWARD2 data confirm that envudeucitinib achieves PASI 90 rates of approximately 65% and PASI 100 rates of approximately 40% at Week 24, materially exceeding deucravacitinib (Sotyktu) benchmarks of roughly 40% PASI 90. The psoriasis drugs market was estimated at $21.78 billion in 2026 and is growing at approximately 8.6% annually through 2031, while the more specific TYK2 inhibitor segment is expanding at 15% CAGR toward $7.4 billion by 2033. Alumis's NDA filing in H2 2026 could unlock commercial launch in 2027, with a peak sales potential in psoriasis alone estimated at $2–4 billion globally. The anti-thesis centers on binary regulatory and commercial execution risk: the entire investment thesis depends on a single drug receiving FDA approval, launching successfully in a competitive market already occupied by deucravacitinib and the newly approved oral IL-23 inhibitor icotrokinra. Elevated short interest (~15.5% of float) signals significant institutional bearishness, and any NDA delay or additional FDA data requests could reprice the stock sharply downward. The company generated only $1.74M in Q1 2026 revenue, relies on a single licensing partner (Kaken Pharmaceutical), and must commercialize into a market where large biologics incumbents control formulary access.
