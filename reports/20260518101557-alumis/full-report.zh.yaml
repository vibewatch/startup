      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              从创立到 2026 年 1 月，Alumis 通过五次不同融资事件累计募集约 $1.12 billion 资本。约 $70 million 的 Series A 融资发生在 2021 年，当时公司仍以 Esker
              Therapeutics 名义运营；多个行业来源确认这是公司的创始轮融资。 2022 年，公司完成 $200 million Series B，使其能够开展斑块状银屑病 Phase 2 STRIDE 试验，
              并启动 SLE 和非感染性葡萄膜炎的中期研究。


              2024 年 3 月完成的 $259 million Series C，在公告时是 Fierce Biotech 融资追踪器记录下 2024 年规模最大的私营生物科技融资。 本轮由 Foresite
              Capital、Samsara BioCapital 和 venBio Partners 联合领投。Cormorant Asset Management、 SR One、Lilly Asia Ventures
              等新投资者加入，既有支持者 AyurMaya Capital Management 也参与认购。 本轮资金支持了斑块状银屑病关键 Phase 3 ONWARD 项目和 SLE Phase 2b LUMUS 项目。


              2024 年 6 月 28 日的 IPO 募集总额约 $250 million。IPO 定价为每股 $16.00，位于 $16–$18 指示区间的低端； 此前公司还把发行规模从计划的 17.65 million
              股（含超额配售目标 $274–315 million）下调至 13,125,000 股。 同价向 AyurMaya 进行的同步私募额外带来约 $40 million。ALMS 股价在上市首日最低约
              $12.77，跌破发行价—— 这是公开市场初始接纳度偏弱的信号。


              2026 年 1 月，在正面 Phase 3 ONWARD 结果公布后，Alumis 完成放大的后续公开增发，以每股 $17.00 发行 20,297,500 股， 募集总额约 $345.1
              million（包括承销商超额配售权全部行使）。本次发行由 Morgan Stanley、Leerink Partners、 Cantor 和 Wells Fargo Securities 主导。公司截至
              2025 年 12 月 31 日的未经审计现金约为 $308.6 million； 后续增发完成后，总流动性超过 $650 million，管理层披露现金跑道可延伸至约 2027 年末。
