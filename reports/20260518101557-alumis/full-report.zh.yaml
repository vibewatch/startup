      - number: '3.3'
        title: 生物制剂既有玩家格局
        blocks:
          - type: paragraph
            body: >-
              注射生物制剂仍是中重度银屑病的临床金标准，也定义了口服药必须接近的疗效天花板，只有接近这一水平，治疗算法才会真正改变。 2025 年，全球银屑病生物药市场规模约 $14.5 billion；按约 7–9%
              年增长，2026 年预计达到 $16.2 billion。 IL-17 和 IL-23 抑制剂在银屑病及 PsA 等相邻适应症中合计年收入超过 $30 billion。

              2026 年，AbbVie 的 Skyrizi（risankizumab，IL-23 抑制剂）和 Novartis 的 Cosentyx（secukinumab，IL-17A
              抑制剂）在生物制剂银屑病市场中按收入和处方医生份额领先。Skyrizi 是该细分中按用量增长最快的生物制剂；Cosentyx 保留最广的全球商业覆盖。Eli Lilly 的
              Taltz（ixekizumab，IL-17A）在北美拥有强份额。UCB 的 Bimzelx （bimekizumab，双重 IL-17A/F 抑制剂）是近期进入者，凭借差异化双重 IL-17
              阻断迅速拿份额。Johnson and Johnson 的 Stelara（ustekinumab，IL-12/23）在 2023 年美国专利到期后面临生物类似药竞争，但仍用于 PsA。Skyrizi
              在关键试验中通常实现 65–75% 的 PASI 90 和超过 50% 的 PASI 100；这是 ESK-001 必须接近的基准，才能支撑面向针头厌恶患者的近生物制剂疗效叙事。

              生物制剂对 Alumis 的战略意义在于，它们是 ESK-001 必须逼近的疗效天花板，而不是需要整体取代的对象。TYK2 抑制剂通过变构抑制 TYK2 JH2 假激酶结构域，阻断 IL-23、IL-12 和 I
              型干扰素通路的细胞因子信号，从而产生抗炎效果；这一单一口服机制可带来接近靶向生物制剂活性的 IL-23/IL-17 通路抑制。JAK 抑制剂也能产生类似但选择性更低的免疫抑制，机制是 ATP
              竞争性激酶抑制。现有疗法——外用皮质激素、 methotrexate、cyclosporine 和光疗——构成患者进入高级系统疗法前循环使用的一线标准。生物制剂注射药每年 $40,000–$50,000 的标价，
              与口服 TYK2 药物每月 $6,000–$7,000 的标价形成鲜明对比；成本和便利性共同支持生物制剂初用者和针头厌恶人群采用口服药。
            claimRefs:
              - CP023
              - CP024
              - CP025
              - CP026
