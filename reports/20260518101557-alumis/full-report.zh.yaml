      - number: '8.3'
        title: 情景、风险和投资逻辑失效触发点
        blocks:
          - type: paragraph
            body: >
              乐观情景假设 envudeucitinib 在 mid-2027 获 FDA 批准用于银屑病，随后商业化上市强劲；SLE 2b 期数据支撑 2028 年第二个
              NDA；大型药企可能以显著溢价达成合作或收购。在这一情景下，获批后 18–24 个月内，随着商业放量启动、多适应症管线可信度提升，估值可能达到 $6–8B。基准情景假设 NDA 按时提交并获批，凭借相对
              Sotyktu 的优效数据实现中等强度上市，且 SLE 部分验证概念，支撑 $4–5B 估值。悲观情景——NDA 被拒、FDA 要求补充研究，或出现意外安全性信号——可能把股价重置到
              $0.9–$1.5B，对应较当前水平下跌 50–70%。关键投资逻辑失效触发点包括：FDA 发出任何指向安全性或疗效缺陷的完整回复函；Q3 2026 SLE 2b 期 LUMUS 数据未达到主要 BICLA
              终点；CEO Martin Babler 等关键管理层流失；以及 Acelyrin 收购期间相关证券集体诉讼显著升级。空头仓位约 15.5%，回补天数 13.5 天，说明机构对悲观情景有较强押注。Q3 2026
              SLE 读出和 H2 2026 NDA 申报，是最可能验证或撕裂当前估值的两个二元事件。
