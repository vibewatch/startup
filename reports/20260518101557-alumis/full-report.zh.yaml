  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Alumis 的首要监管风险，是 envudeucitinib 用于斑块状银屑病的 FDA NDA 审评，计划 H2 2026 提交。尽管 ONWARD1 和 ONWARD2
              以高统计显著性达到所有主要和次要终点——Week 16 时 74% PASI 75 和 59% sPGA 0/1，并在 Week 24 深化至约 65% PASI 90、超过 40% PASI 100——NDA
              获批并非板上钉钉。FDA 可能出具完整回复函（complete response letter，CRL），理由包括 CDMOs 的化学、生产与控制（Chemistry, Manufacturing and
              Controls，CMC）缺陷；也可能要求 ONWARD3 长期扩展试验提供更多安全性数据，或要求风险评估与缓解策略（Risk Evaluation and Mitigation
              Strategy，REMS）而限制商业采用。标准 NDA 审评周期为自提交起 10 个月；优先审评（Priority Review）会压缩至 6 个月。Alumis 的 10-K
              明确承认，即使监管机构审阅了临床试验设计，也可能不同意研究设计、数据解读，或提出额外要求。

              TYK2 类标签问题已部分解决。唯一获批的 TYK2 抑制剂 Deucravacitinib（Sotyktu）没有携带 JAK 抑制剂黑框警告；该警告针对重大心血管不良事件、癌症、血栓和死亡，适用于
              tofacitinib、baricitinib、upadacitinib 和 ruxolitinib。不过，Sotyktu 标签确实包含关于感染、结核病、恶性肿瘤和超敏反应的显著警告，并明确表示尚不清楚 TYK2
              抑制是否可能与 JAK 抑制观察到或潜在的不良反应相关。对 envu 来说，这留下了标签不确定性——FDA 可能采用类似预防性措辞，进而影响处方医生采用，尤其是在心血管风险患者群体中。

              两起活跃事项抬高法律风险。ACELYRIN 证券集体诉讼代表 IPO 投资者提起，指称公司对 izokibep 作出重大虚假和误导性陈述；该事项通过 May 21, 2025 ACELYRIN 合并并入
              Alumis。被告已于 February 19, 2026 提交驳回第二次修订诉状的动议，诉讼仍在进行。另一起 Climb Bio 针对 Alumis 和 ACELYRIN 的诉讼，争议 budoprutug
              资产的一项里程碑付款义务。两项均未解决；Alumis Q1 2026 业绩评论将这些诉讼列为管理层分心和潜在财务负债来源。IP 风险为中等：Alumis 持有 envu 化学和工艺专利；BMS Sotyktu
              核心化合物专利到 November 7, 2033 到期，意味着在此之前美国 TYK2 类别不会有授权仿制药竞争。
            claimRefs:
