      - number: '5.6'
        title: 附录
        blocks:
          - type: callout
            title: 3 期疗效处于已报告口服银屑病疗法结果的顶部区间
            body: >-
              Envudeucitinib 在 ONWARD1 和 ONWARD2 中 Week 24 的 3 期 PASI 90 率分别为 68.0% 和 62.1%，且起效快（Week 4 即与安慰剂拉开 PASI 90
              差距），所有终点均优于 apremilast；在中重度斑块状银屑病已发表口服疗法结果中，它处在或接近上边界。24 小时持续的最大 IC90 TYK2
              抑制，从机制上解释了它相对既有口服方案的疗效优势，也支持每日两次给药作为持续压制通路的最优方案。
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE031
          - type: callout
            title: 每日两次给药且缺少与 deucravacitinib 的头对头数据，是商业风险
            body: >-
              Deucravacitinib（Sotyktu）已获 FDA 批准、商业化站稳脚跟，并且每日一次给药。Envudeucitinib
              需要每日两次给药；如果没有头对头比较数据证明其疗效或安全性优于在位产品，这会成为处方集和患者依从性劣势。间接跨试验比较会被试验设计、患者人群和对照组差异混淆。TYK2 类别中的医生处方惯性，再叠加 Alumis
              仍处于收入前阶段，即便 NDA 按期获批，也会形成实质性商业执行风险。
            calloutType: risk
            claimRefs:
              - CE008
              - CE034
              - CE036
          - type: callout
            title: A-005 CNS 渗透性打开差异化第二产品线，选择权价值高
            body: >-
              A-005 经 1 期和 ECTRIMS 2025 数据确认可穿过血脑屏障，并在 CSF 中达到 IC90 TYK2 抑制，打开了 deucravacitinib 无法覆盖的竞争空间——神经炎症疾病。如果 MS
              患者 2 期数据确认临床疗效，A-005 将成为首个获批用于神经科的口服 CNS 渗透性变构 TYK2 抑制剂，进入一个由昂贵输注生物制剂和注射疗法主导的高价值市场。其机制相对已获批 DMTs
              完全不同；如果有效，TYK2 资产组合将延伸到一个商业风险画像不同于银屑病的适应症。
            calloutType: insight
            claimRefs:
              - CE012
