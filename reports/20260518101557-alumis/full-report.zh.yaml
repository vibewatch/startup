      - number: '7.4'
        title: 合作方与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Alumis 的收入完全来自与 Kaken Pharmaceutical 的单一合作协议；Kaken 也是公司唯一商业合作方。虽然这段关系验证了 envu 在日本的商业潜力，却造成极端收入集中风险：Kaken
              合作一旦发生争议、终止或重新谈判，Alumis 当前收入将 100% 消失。Kaken 协议条款和里程碑安排未完全公开，给投资者造成信息不对称。

              对 CDMOs 的制造依赖，是临床供应、NDA CMC 申报和最终商业上市的结构性风险。Alumis 没有内部制造能力，目前以采购订单方式运作，尚未建立长期供应安排。主要 API
              供应商位于印度和台湾，两地都面临地缘政治波动、FDA 检查活动和供应链中断风险。2025–2026 年药企行业背景显示，FDA 对 CMOs 执法行动增加 50%，40%+
              公司因地缘政治紧张遭遇供应中断。CDMO 的 GMP 失败——尤其是在 NDA 前商业上市准备阶段——可能推迟监管提交或批准，压缩商业窗口。

              ONWARD3 长期扩展和 LUMUS SLE 试验依赖 CRO，带来执行风险；Alumis 在 10-K 中承认，公司依赖 CROs 和临床中心妥善、及时开展试验，对其表现影响有限。研究中心方案偏离、LUMUS
              入组缓慢、数据完整性问题，都可能影响监管申报质量。与 Cantor Fitzgerald 签署的 $300M ATM 发行协议提供财务灵活性，但资本市场准入取决于 Alumis 使用时的股价和市场环境——一个二元
              NDA 结果，可能在最需要 ATM 资本时反而损害准入能力。
