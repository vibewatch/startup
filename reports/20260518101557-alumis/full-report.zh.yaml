      - number: '6.4'
        title: Sotyktu 采用轨迹作为商业参照
        blocks:
          - type: paragraph
            body: >
              Sotyktu（deucravacitinib，BMS）是唯一获批的 TYK2 抑制剂，也是推演 envudeucitinib 预期上市曲线最有参考价值的商业参照。

              Sotyktu 于 September 2022 获批。全球净销售额 2024 年约 $246 million，2025 年增长约 19% 至 $291
              million——方向为正，但远低于最初预期的重磅药物轨迹。GlobalData 预测 2029 年峰值销售额为 $2.9 billion，意味着较 2025 年约十倍增长，需要连续四年保持两位数年度增长。

              Recon Strategy 的反向分析指出核心逆风：皮肤科医生认为 Sotyktu 疗效不足以取代高疗效生物制剂，同时准入摩擦压低了处方落地后的净患者量。与皮下注射 IL-17 和 IL-23
              药物相比（PASI 90 率 70-80%；PASI 100 为 40-55%），TYK2 在医生主导的治疗启动中仍处于不利位置，尽管口服便利性是患者偏好上的差异点。

              对 Alumis 来说，教训是疗效数据本身不够——支付方合约、处方医生教育和处方集定位必须随上市同步推进，否则会重演 Sotyktu 式采用惯性。Envudeucitinib 的 PASI 100 率（约
              40%）和优于 apremilast 的主张，可以支撑差异化处方集信息，但目前没有与 Sotyktu 的头对头数据。
            claimRefs:
              - CU017
              - CU018
              - CU019
              - CU020
              - CU038
