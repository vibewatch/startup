      - number: '5.4'
        title: 制造、供应链与商业合作
        blocks:
          - type: paragraph
            body: >-
              Alumis 没有内部制造能力。所有临床供应生产都外包给第三方合同制造组织（CMOs）和合同研究组织（CROs），安排符合后期临床阶段生物科技公司 的常见做法。截至 Q1 2026，SEC 文件未公开
              envudeucitinib 原料药和制剂的主要 CMO 合作方身份，这构成重要供应链尽调缺口。公司尚未公开描述商业规模制造准备计划，尽管 10-Q 将获取商业制造产能列为计划步骤。ACELYRIN
              合并带来一项临床制造预付信用凭证，交割时价值约 $11.4M，可用于来自前 ACELYRIN CMO 的 lonigutamab 临床供应。

              Kaken Pharmaceutical（Japan）合作于 March 2025 签署，授予 Kaken 在日本针对皮肤科适应症开发、制造和商业化 envudeucitinib 的独家许可。Alumis 收到
              $20M 首付款，并有权获得里程碑和特许权使用费；Kaken 还在 2026 年底前报销 $20M 全球开发成本。Kaken 保留将许可扩展至风湿科和胃肠科的选择权。除日本外，Alumis 保留所有其他地区及包括
              SLE 和 CNS 项目在内的所有适应症全球权利。截至 March 31, 2026，Alumis 持有 $569.5M 现金和有价证券；管理层认为，这足以从 May 2026 10-Q 发布日起支持至少 12
              个月运营，覆盖 NDA 提交和 LUMUS 顶线读出里程碑。
