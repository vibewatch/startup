      - number: '6.5'
        title: 扩展路径与集中度风险
        blocks:
          - type: paragraph
            body: >
              截至 May 2026，Alumis 只有一项资产和一个待批适应症（NDA 计划 H2 2026 提交），在商业和科学两个维度都存在尖锐集中度风险。

              最近期的客户扩展路径是银屑病关节炎。Sotyktu 于 March 2026 获 FDA 批准用于 PsA 后，TYK2 抑制在关节疾病中的监管先例已经确立。不过，Alumis 尚未披露关键性 PsA
              试验设计，因此除 2 期数据之外，该细分仍属推测。NHANES 推导的 PsA 患病率约 912,000 名美国成人，代表一个有意义的患者分层，但商业窗口取决于尚未取得的 3 期数据。

              SLE 扩展（LUMUS 2b 期，顶线 Q3 2026）更近，但开发阶段更早。若 LUMUS 读出为阳性，将打开约 204,000 名美国成人的增量患者分层；若结果为阴性，SLE 作为近期客户机会将被排除。

              竞争集中度风险来自 TYK2 和口服免疫管线。PatSnap 数据识别出多项后期 TYK2 项目（Takeda、Boehringer Ingelheim、Sun Pharma），并有下一代 IL-17/IL-23
              生物制剂同步推进。Envudeucitinib BID 给药相对 QD 备选方案是患者便利性劣势；Alumis 正在开发 QD 缓释制剂，但尚未进入关键试验。截至 May 2026，Alumis 未披露专科药房
              合作方、hub 服务合同或患者支持项目，商业基础设施路径仍未验证。
