      - number: '7.8'
        title: 附录
        blocks:
          - type: callout
            title: 投资逻辑失效观察——2026 年三项二元事件
            body: >-
              H2 2026 有三项二元事件，各自都可能单独击穿 Alumis 投资逻辑：（1）FDA 就 envu NDA 申报发出 CRL（H2 2026 申报，约 10 个月审评）；（2）LUMUS 2b 期 SLE
              顶线失败（Q3 2026）；（3）ONWARD3 LTE 出现严重不良事件信号，引发临床暂停或标签限制。每项事件都无法靠运营手段缓释，并会同时实质性损害商业价值、融资能力和“一粒药拓管线”叙事。
