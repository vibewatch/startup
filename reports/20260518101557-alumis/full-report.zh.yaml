      - number: '2.2'
        title: 市场规模：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              2026 年，斑块状银屑病、PsA 和 SLE 合计的全球 TAM 超过 USD 30 billion；该数值由分别测算的适应症市场相加得出。 斑块状银屑病估计范围从 USD 12.5–13.7
              billion（保守、口径较窄）到 USD 23.8 billion（口径更宽，包含银屑病中使用的所有生物制剂）。 这种差异更多来自分析师报告的定义不一致，而非真实市场波动。PsA 2026 年估计为 USD
              13.97 billion （Fortune Business Insights），到 2034 年 CAGR 约 11%。SLE 2026 年估计为 USD 3.68–3.71 billion， 按不同来源，到
              2031–2035 年 CAGR 为 7.5–11.2%。这些都是包含生物制剂在内的全疗法 TAM。

              口服系统疗法的可服务市场（SAM）显著收窄。PsA 中，口服细分占市场收入约 20–28%，生物制剂约占 51–52%； 将口服份额套用到 $14B PsA TAM，意味着约 $3–4B 的口服 PsA
              SAM。银屑病中，相对于由生物制剂主导的收入基盘， 口服细分要小得多。单是银屑病生物制剂市场就预计在 2026 年达到 $16.2 billion（Intel Market Research），
              这意味着口服疗法目前只占小部分，但增速最快。综合三类适应症可被口服疗法触达的份额，口服系统免疫学的粗略 SAM 为 $5–9B。

              具体到口服 TYK2 抑制剂类别，可获取市场（SOM）估计在 2026 年约为 USD 615 million（Research and Markets）， 几乎全部集中在 Sotyktu，并预计到 2032 年
              CAGR 约 9.6%。随着更多 TYK2 抑制剂获批，类别级 SOM 会继续扩张。 Alumis 在 NDA 获批后的首年 SOM（考虑 2026 年 H2 申报，预计 2027–2028
              年获批）无法由公开数据支撑； 它取决于处方集准入、相对 Sotyktu 和 zasocitinib 的定价，以及在医生推广中能否围绕 PASI 90/100 差异化提出有力主张。
