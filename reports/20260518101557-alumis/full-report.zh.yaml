              Takeda 的 zasocitinib 将在其 2026 财年向 FDA 申报审批，具备每日一次给药、无食物影响，PASI 90 率也能与 envu 3 期数据竞争。NDA 每延迟一个月，zasocitinib
              作为领先的下一代口服 TYK2 抑制剂，就会拿走更多皮肤科医生关系。envu 每日两次给药在初级保健 / 皮肤科市场里是结构性劣势，因为依从性会拉开商业成败。
