companyProfile:
  summary: >
    Alumis Inc.（NASDAQ: ALMS）是一家总部位于 South San Francisco 的临床阶段生物制药公司，成立于 2021 年， 由 Foresite Capital 的公司孵化平台 Foresite
    Labs 孵化。公司专注于开发口服、选择性 TYK2 抑制剂， 以解决自身免疫和炎症疾病中显著未满足的治疗需求。其主打化合物 envudeucitinib 是一款每日一次口服 TYK2 抑制剂，在两项 Phase 3
    试验（ONWARD1 与 ONWARD2）中，第 24 周 PASI 90 率约 65%，达到同类领先水平， 明显高于目前唯一获批的口服 TYK2 抑制剂。Alumis 于 2024 年 6 月在 NASDAQ 完成 IPO，并于
    2026 年 1 月 完成 $345.1M 后续增发；公司持有约 $569.5M 现金，现金跑道可延伸至 2027 年末。公司计划在 2026 年 H2 就 envudeucitinib 的斑块状银屑病适应症提交 NDA，SLE
    Phase 2b 数据预计在 2026 年 Q3 读出。
