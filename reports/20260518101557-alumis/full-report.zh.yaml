      xAxis: 选择性 / 安全性画像（1=低，10=高）
      yAxis: Phase 3 疗效证据 — PASI 90 基准（1=低，10=高）
      points:
        - label: ESK-001 (Alumis)
          x: 9
          'y': 8
        - label: Sotyktu / Deucravacitinib (BMS)
          x: 8
          'y': 7
        - label: Zasocitinib (Takeda)
          x: 9
          'y': 7
        - label: Icotyde / Icotrokinra (J&J)
          x: 8
          'y': 8
        - label: Rinvoq / Upadacitinib (AbbVie)
          x: 4
          'y': 8
        - label: Otezla / Apremilast (Amgen)
          x: 7
          'y': 3
        - label: Brepocitinib (Priovant)
          x: 5
          'y': 3
        - label: Cosentyx / Secukinumab (Novartis)
          x: 7
          'y': 8
    approximationNotes: >-
      X 轴评分：TYK2 变构药物（ESK-001、Sotyktu、zasocitinib）因选择性且无黑框警告得 8–9 分；Icotyde 因安全性得 8 分 （无黑框警告，IL-23 特异）。Rinvoq 因 pan-JAK
      活性且需黑框警告得 4 分。Otezla 尽管疗效较低，但因 PDE4 选择性得 7 分。 Brepocitinib 作为 TYK2/JAK1 双重抑制剂，选择性较弱，得 5 分。Cosentyx（生物制剂）得 7
      分（靶向性高但需注射； 纳入是为了对标生物制剂疗效）。Y 轴评分以各药关键试验主要时间点的 PASI 90 近似；试验设计不同，横向比较不精确。 Sotyktu 评分 7，低于 icotyde 的
      8，反映商业真实世界采用滞后和头对头失利。生物制剂 Cosentyx 因成熟 PASI 90 数据得 8 分。
