      - number: '3.6'
        title: 展项
        blocks:
          - type: callout
            title: Icotyde 早于 ESK-001 上市获批，抬高了口服疗效门槛
            body: >-
              Johnson and Johnson 的 icotyde（icotrokinra）于 2026 年 3 月获 FDA 批准，并在 Phase 3 中显示相对 Sotyktu 的头对头优效。 Icotyde 第
              16 周约 70% IGA 0/1、55% PASI 90，且已商业化上市；因此，ESK-001 进入的口服竞争格局， 比 Alumis 启动 Phase 3 项目时更激烈。ESK-001 第 24 周约 65%
              的 PASI 90 方向上具备竞争力，但时间点不同， 且缺少头对头数据；在真实世界或比较性证据出现前，相对口服定位仍未解决。
            calloutType: risk
            claimRefs:
              - CP012
              - CP017
              - CP039
          - type: callout
            title: ESK-001 的最大化 TYK2 抑制和平台宽度，让 Alumis 具备差异化
            body: >-
              ESK-001 关于 24 小时最大化 TYK2 抑制的主张，加上干净的 Phase 2 和 Phase 3 安全性画像，使其有机会成为相对 Sotyktu 的临床升级方案， 但仍需头对头验证。LUMUS SLE
              Phase 2b 项目和 A-005 CNS 管线，把 Alumis 从单产品上市公司转化为 TYK2 平台公司。 如果 LUMUS 在 2026 年 Q3 读出积极，ESK-001
              可能成为首个同时获批用于银屑病和 SLE 的 TYK2 抑制剂， 从而大幅拉开与 Sotyktu 和 zasocitinib 的差异；后两者均未披露 SLE 项目。
