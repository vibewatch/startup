      - number: '2.3'
        title: 买方与细分市场图谱
        blocks:
          - type: paragraph
            body: >
              斑块状银屑病、PsA 和 SLE 的口服免疫学市场，涉及不同的买方、使用者和支付方角色。开具处方的医生——银屑病主要是认证皮肤科医生， PsA 和 SLE
              则是风湿科医生——在适应症内决定处方集选择，但会受到支付方的事前授权标准、阶梯治疗要求和处方集层级约束。
              患者是终端使用者，并在口服药和注射药之间拥有有意义的选择权；针头厌恶和给药便利性已被记录为口服药采用的驱动因素。

              商业支付方（UnitedHealth、Cigna、Aetna、BCBS plans）和 PBMs（Express Scripts、CVS Caremark、OptumRx）
              通过排除清单和阶梯治疗规则控制处方集位置，通常要求先用传统 DMARDs 和 / 或 apremilast 治疗失败，才授权品牌 TYK2 或生物制剂疗法。政府支付方（Medicare Part
              D、Medicaid）也采取类似利用管理模式，但强制返利后净价更低。因此， 对具有商业意义的用量来说，实际支付方是 PBM / 保险公司，而不是患者。

              采用率在细分适应症层面不同：银屑病患者更年轻、常有工作，并拥有私人保险覆盖——因此处方集层级直接相关。SLE 患者明显集中在育龄女性和有色人种，Medicaid
              占比更高；在这一支付结构下，药物可及时间和返利经济性都不同于商业保险。PsA 患者通常同时由皮肤科和风湿科管理， 任何新口服药都需要面对双医生处方动态。总体来看，假设银屑病 NDA 先行，Alumis
              近期上市最有价值的买方细分是： 年轻、有商业保险、厌恶针头的中重度斑块状银屑病患者；他们使用 apremilast 控制不足，且有皮肤科医生愿意在升级生物制剂前开具品牌口服药。
