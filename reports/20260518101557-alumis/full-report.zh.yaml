      - number: '6.2'
        title: 处方医生、支付方与准入架构
        blocks:
          - type: paragraph
            body: >
              尽管 envudeucitinib 临床画像强，处方医生和支付方准入环境仍会给采用带来实质逆风；Sotyktu 的商业轨迹已经说明这一点。

              在处方医生端，Recon Strategy 于 December 2025 基于 Deutsche Bank 调研数据分析发现，50% 的美国皮肤科医生把 Sotyktu 的疗效排在系统治疗第七或第八位，65%
              在价格和准入维度把它排在倒数两位。这种处方医生冷淡，既来自临床保守——高疗效生物制剂（IL-17 和 IL-23 药物，按月或按季给药）仍是首选——也来自限制患者获得药物的处方集摩擦。BMS 在
              September 2025 以低于目录价 80% 以上的价格（$6,678/30-day WAC）启动 DTC 活动时，已经明确承认准入问题。

              在支付方端，UnitedHealthcare 当前 2026 事先授权政策要求提供外用皮质激素失败记录，再加 3 个月 methotrexate 试验或既往 FDA
              批准系统性靶向药物失败，并要求开方皮肤科医生证明，授权期为 12 个月。Cigna 的 March 2026 政策修订同样要求外用和传统系统治疗失败后才覆盖。两个支付方合计覆盖超过 55 million
              商业参保人，使阶梯治疗 合规事实上成为任何 TYK2 抑制剂获得有意义处方量的前提。

              对 envudeucitinib 来说，现实中最先可触达的人群，是已经经历外用药、methotrexate 和生物制剂失败的中重度银屑病患者子集；这比完整 1.9 million 人群更窄，医学复杂度也更高。
            claimRefs:
              - CU019
              - CU020
              - CU021
              - CU022
