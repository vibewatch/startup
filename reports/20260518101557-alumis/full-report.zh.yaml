  - id: FU001
    title: 患者旅程图：Envudeucitinib 准入路径
    slug: customer-journey-map
    type: journey-map
    layout: standard
    summary: 示意患者从银屑病诊断出发，经过阶梯治疗门槛，最终拿到 envudeucitinib 处方的路径，并标出支付方和处方医生触点。
    data:
      items:
        - label: 诊断
          description: 患者因斑块型银屑病就诊皮肤科医生（PASI >=12，BSA >=10%）；病情确认为中重度。
        - label: 需先证明外用药失败
          description: 必须完成的前置步骤：记录外用糖皮质激素或维生素 D 类似物治疗失败；通常 4-8 周。支付方事先授权（PA）的前置条件。
        - label: 传统全身治疗步骤
          description: UHC/Cigna 要求：甲氨蝶呤试用 3 个月，或既往已对获批全身靶向药失败 / 不耐受。
        - label: 支付方事先授权提交
          description: 皮肤科医生提交 PA，并附阶梯治疗失败文件；UHC 给 12 个月授权；Cigna 要求证明传统全身治疗失败。
        - label: 处方医生治疗决策
          description: 皮肤科医生从已纳入处方集的全身药物中选择；重症程度最高者优先生物制剂；偏好口服者选 TYK2。
        - label: Envudeucitinib 起始治疗
          description: 患者开始 envudeucitinib 40 mg BID（NDA 批准仍待定，2026 年下半年）；专科药房配药；患者支持项目尚未披露。
        - label: 持续用药关口
          description: 第 4/16/24 周评估疗效；达到 PASI 75/90 响应则继续；无响应者换药；生物制剂类别标杆为 12 个月持续用药率 >70%。
    sourceRefs:
      - SU006
      - SU012
      - SU013
      - SU024
    claimRefs:
      - CU007
      - CU023
    notes: 该示意旅程基于 UHC 和 Cigna 的 PA 政策；各支付方流程不同。Alumis 仍处商业化前阶段，尚未披露患者支持项目细节。
