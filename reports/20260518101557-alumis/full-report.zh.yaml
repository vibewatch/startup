      - number: '1.6'
        title: 展项
        blocks:
          - type: callout
            title: Phase 3 疗效结果跻身口服银屑病疗法已报告数据的最强梯队
            body: >-
              Phase 3 ONWARD1 和 ONWARD2 试验以高统计显著性达到所有主要和次要终点。第 24 周约 65% 的 PASI 90 和 >40% 的 PASI 100 应答率，明显高于 BMS
              Sotyktu 约 40% 的 PASI 90 和约 15% 的 PASI 100； Sotyktu 是目前唯一获批的银屑病 TYK2 抑制剂。如果商业化顺利，这一疗效曲线可能支持其相对 Sotyktu
              获得有意义的市场份额溢价。
