  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >
              Alumis 的主要可触达市场覆盖三类自身免疫适应症：中重度斑块状银屑病、银屑病关节炎（PsA）和系统性红斑狼疮（SLE）。 这些适应症共享一套生物学机制——IL-23/IL-17 和 I
              型干扰素信号通路失调——TYK2 抑制在机制上正是切入这一点。 本分析的市场边界是中重度疾病的口服和注射系统疗法；仅外用疗法和非处方产品不纳入。生物制剂（anti-TNF、anti-IL-17、
              anti-IL-23）计入总适应症 TAM，但不计入口服子市场 SAM；后者才是 Alumis 的主要竞争场。

              现有标准疗法包括：面向中重度疾病且既往系统治疗失败患者的注射生物制剂（AbbVie Skyrizi、Novartis Cosentyx、J&J Stelara、Amgen Enbrel /
              生物类似药）；用于早期系统治疗的传统口服 DMARDs（methotrexate）和 phosphodiesterase-4 抑制剂（Otezla / apremilast）；以及自 2022 年 9
              月以来、2026 年前唯一获批的口服 TYK2 抑制剂 Sotyktu （deucravacitinib）。2026 年 3 月，J&J / Protagonist 的 ICOTYDE（口服 IL-23
              拮抗剂）获得 FDA 批准， 这是关键市场转折：它新增了一个口服类别，直接与 TYK2 抑制剂争夺不愿打针、但想要生物制剂级疗效的患者。因此， 到 Alumis 进入 NDA
              申报周期时，口服免疫学子市场已不再是单一产品类别。

              关键纳入 / 排除逻辑：SLE 被纳入，因为 Alumis 有活跃的 Phase 2b LUMUS 项目，但截至 2026 年 5 月，SLE 尚无获批 TYK2 抑制剂。PsA 被纳入，因为 Sotyktu
              已获 European Commission 批准用于 PsA，且 Alumis 计划开展适应症研究。 IBD（溃疡性结肠炎、Crohn's）邻近市场则排除在主要 TAM 外，因为 Alumis
              披露的管线中没有活跃 IBD 项目。
