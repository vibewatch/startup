      - number: '4.3'
        title: 运营费用与现金消耗：2025 年经营活动耗用现金 $369.5M
        blocks:
          - type: paragraph
            body: >-
              Alumis 的成本结构由临床 R&D 支出主导，这符合后期 3 期生物医药公司的特征。2025 财年，研发费用为 $386.0 million，高于 2024 年的 $265.6 million，增加
              $120.4 million，约 45%。主要驱动因素包括：斑块状银屑病 3 期 ONWARD 项目的合同研究和临床试验成本加速，R&D 团队员工增加，以及与 ACELYRIN 整合相关的 $9.5
              million 一次性并购费用（遣散费和股权激励）。2024 年基数还包含与此前收购 FronThera 相关的 $23.0 million 临床里程碑付款，抬高了同比比较基数。


              2025 年，一般及行政费用为 $91.9 million，高于 2024 年的 $35.2 million，增加 $56.7 million。主要驱动因素是 ACELYRIN 合并带来的 $30.2
              million 交易和遣散成本。剔除并购成本后，基础 G&A 增长约 $26.5 million，反映为支持新合并组织而增加的员工和专业咨询服务。2025 年，R&D 与 G&A 合计为 $477.9
              million。


              2025 年经营活动耗用现金 $369.5 million，2024 年为 $255.1 million。$369.5 million 经营性现金流出与 $243.3 million 净亏损之间的差额，主要来自
              ACELYRIN 合并确认的 $187.9 million 非现金廉价购买收益；该收益降低了 GAAP 净亏损，但没有产生现金。$43.5 million 股权激励费用部分抵消了现金口径与 GAAP
              口径的差距。按季度看，Q3 2025 经营亏损为 $115.3 million（高于 Q3 2024 的 $98.4 million，增长 17%），由 3 期加速投入推动。公司一直指引，亏损和支出水平会在
              NDA 提交前保持高位。
