            title: 商业化前、收入前生物科技公司，关键人集中且竞争激烈
            body: >-
              Alumis 没有获批产品、没有产品收入，也只有一位 CEO（Martin Babler），且未公开披露继任人。竞争格局已因 J&J 获批的口服 IL-23 抑制剂 icotrokinra 和 Takeda
              的每日一次 TYK2 zasocitinib 而加剧；分析师已经以定价压力为由下调目标价。 公司的全部商业价值取决于在现金跑道耗尽前，在日益拥挤的市场中成功申报、防守并推出 envudeucitinib。
