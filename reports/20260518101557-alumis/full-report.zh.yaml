      - number: '1.4'
        title: 管线概览与产品策略
        blocks:
          - type: paragraph
            body: >-
              Alumis 进展最快的候选产品 envudeucitinib，是一款口服、高选择性、变构 TYK2 抑制剂，设计目标是在 24 小时内提供最大化 TYK2
              抑制，同时尽量减少脱靶结合。该化合物已在面向中重度斑块状银屑病成人患者的关键 Phase 3 ONWARD1 和 ONWARD2 试验中评估； 正面顶线结果于 2026 年 1 月 6
              日公布。试验中，envudeucitinib 相对安慰剂以高统计显著性达到所有主要和次要终点。 第 16 周，平均 74% 的用药患者达到 PASI 75，59% 达到 sPGA 0/1。第 24 周，约 65%
              达到 PASI 90， 超过 40% 达到 PASI 100（皮损完全清除）。在第 24 周所有 PASI 终点上，该药也优于活性对照 apremilast（p<0.0001）。
              未发现新的安全性信号；常见不良事件包括头痛、鼻咽炎、上呼吸道感染和痤疮。


              公司计划在 2026 年下半年向美国 FDA 提交 envudeucitinib 用于斑块状银屑病的 NDA。评估疗效持久性和长期安全性的长期延伸研究 ONWARD3 仍在进行。SLE 方面，全球 Phase
              2b LUMUS 试验已于 2025 年 7 月完成 408 名患者入组；顶线数据预计在 2026 年 Q3 公布。 该试验为随机、双盲、安慰剂对照研究，主要终点为第 48 周 BICLA 应答率。


              主打项目之外，Alumis 正在开发 A-005，这是一款用于神经炎症和神经退行性疾病、可透过 CNS 的变构 TYK2 抑制剂， 目前处于 Phase 1 临床开发。第三个管线资产 lonigutamab
              是一款用于甲状腺眼病的皮下注射抗 IGF-1R 生物制剂。 公司的精准数据分析平台还在未披露的免疫介导疾病靶点中识别出更多临床前项目。Envudeucitinib 的竞争格局包括 BMS Sotyktu
              （deucravacitinib，2022 年获批，24 周 PASI 90 约 40%）、Takeda zasocitinib（每日一次 TYK2，Phase 3）以及 J&J 已获批的口服 IL-23 抑制剂
              icotrokinra；其中最后一项被 H.C. Wainwright 认为在 2026 年拥有最强商业位置， 促使该机构把 ALMS 目标价从 $40 下调至 $25。
