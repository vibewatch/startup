  - id: FP001
    title: 竞争定位图 — 口服银屑病药物与 TYK2 类（2026 年 5 月）
    type: quadrant
    layout: wide
    summary: 按 TYK2 选择性和安全性画像（x 轴，1–10）对比关键 Phase 3 疗效证据（以最佳可得 PASI 90 率近似，y 轴，1–10）， 给出口服银屑病竞争药物的序数定位。评分基于证据作序数估计；见估算说明。
