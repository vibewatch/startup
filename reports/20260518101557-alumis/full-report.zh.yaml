      - number: '3.4'
        title: 功能、定价与上市路径对比
        blocks:
          - type: paragraph
            body: >-
              ESK-001 相对 Sotyktu 的差异化，建立在其“高选择性、24 小时最大化 TYK2 抑制”主张之上。Alumis 认为，这种变构结合画像 比已获批的每日一次 6 mg Sotyktu 剂量更完整地压制
              IL-23、IL-12 和 I 型干扰素细胞因子信号。52 周 Phase 2 开放标签延伸数据显示，PASI 90 维持在 61.3%，PASI 100 维持在
              38.8%，且没有新的安全性信号——这套持久性数据支持 NDA 申请。 ONWARD 中，ESK-001 在所有 PASI 终点上优于 apremilast，为支付方和处方医生谈判提供了相对 Otezla
              的格式化升级主张。 ESK-001、zasocitinib 和 icotyde 之间不存在三方头对头试验；相对定位目前只能依赖跨试验比较，而患者人群、时间点和试验设计差异会带来重要限制。

              口服银屑病类别的定价正转向更重视准入的模式。Sotyktu 此前美国 30 天供应标价约 $6,828；2026 年 1 月起，BMS 又为自费患者推出每月 $950 的直达患者项目。Otezla 30
              天供应标价约 $3,700。ESK-001 尚未定价；Alumis 也尚未提交 NDA。 应预期其上市定价会接近或高于 Sotyktu
              历史标价；在真实世界数据积累前，重度支付方返利和阶梯编辑规则将是主要准入障碍。

              竞争对手的上市能力差异很大。Sotyktu 受益于三年商业化真实世界数据，以及 BMS 成熟的皮肤科销售团队。Zasocitinib 上市时背后是 Takeda 围绕数十亿美元 Entyvio
              品牌建立的全球免疫学基础设施。Icotyde 受益于 J&J 已完全搭建好的全球皮肤科和免疫学商业组织。 ESK-001 是 Alumis 的首个商业产品，需要大规模自建商业团队或达成共同推广合作。Alumis
              于 2024 年 6 月在 Nasdaq 完成 IPO，发行价每股 $16，募集约 $250 million；2026 年 5 月股价在 $22–24 区间。公司自 Series A（$70M）、 Series
              B（$200M）、Series C（$259M）和 IPO 累计募集约 $529 million，现金跑道足以支持 NDA 准备和上市就绪工作。
