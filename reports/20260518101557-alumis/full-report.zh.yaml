  - id: FE001
    title: Alumis 药物开发架构 — 从发现到监管栈
    type: stack
    layout: wide
    summary: 五层架构从基础治疗假设延伸到商业化监管路径，展示 Alumis 如何把 TYK2 遗传洞察转成临床资产和监管申报。
    data:
      layers:
        - label: 治疗假设与靶点生物学
          detail: >-
            约 20 种免疫介导和神经炎症疾病中的 TYK2 遗传学依据；Foresite Labs 基因组靶点识别；JH2 假激酶结构域作为选择性变构结合位点； TYK2 细胞因子图谱（IL-23、IL-17、IL-12、I
            型 IFN）作为疾病驱动因素；IRF5 和其他未披露靶点
        - label: 化合物发现与药物化学
          detail: >-
            理性设计 TYK2 JH2 变构配体；氘代替换（CYP1A2 代谢稳定性）；环丙基羧酰胺（hERG 心脏安全性）；针对口服生物利用度和线性 PK/PD 关系优化；可进入 CNS 的 A-005 骨架设计为具备 BBB
            通透性
        - label: 临床前与转化科学
          detail: >-
            GLP 毒理和安全药理；体外 / 体内 PK/PD 刻画；IC90 TYK2 抑制阈值定义；生成支持 IND 的数据；精准平台生物标志物检测开发 （SIGLEC1、pSTAT、细胞因子面板、用于
            STRIDE/LUMUS 的皮肤胶带剥离蛋白组学）
        - label: 临床开发
          detail: >-
            Phase 1 PK/PD envudeucitinib（40 mg BID，确认 IC90 维持 24h）；STRIDE Phase 2 剂量探索 NCT05600036； ONWARD1/2 Phase 3
            1,700+ 名患者，所有终点达成；A-005 Phase 1 血浆到 CSF 1:1 且超过 IC90； LUMUS Phase 2b 408 名 SLE 患者；A-005 Phase 2 MS
            待启动；ECTRIMS/AAD/EADV 生物标志物会议展示
        - label: 监管与商业化路径
          detail: >-
            envudeucitinib 银屑病 NDA 准备（目标 2026 年 Q4）；第三方 CMO 商业 GMP 放大生产；Kaken Pharmaceutical 日本协作 （$20M
            首付款，皮肤科权利）；ONWARD3 长期扩展安全性数据；SLE NDA 路径 2028+，取决于 LUMUS 成功；A-005 MS 关键性路径需 5+ 年
    claimRefs:
      - CE002
      - CE003
      - CE010
      - CE012
      - CE017
      - CE021
      - CE023
  - id: FE002
    title: Phase 3 Envudeucitinib ONWARD 项目中的患者旅程
    type: flow
    layout: wide
    summary: 一名中重度斑块状银屑病患者在 Phase 3 ONWARD 试验中依次走过的步骤：从资格评估，到主要和次要终点评估，再到进入长期扩展。
    data:
      nodes:
        - id: n1
          label: 医生诊断
          detail: 确诊中重度斑块状银屑病（PASI ≥12、BSA ≥10%、sPGA ≥3）；考虑系统治疗
          type: start
        - id: n2
          label: 筛查与资格
          detail: 采集基线 PASI、sPGA、头皮 ss-PGA、DLQI、瘙痒 NRS；既往生物制剂洗脱；IEC/IRB 同意
          type: step
        - id: n3
          label: 2:1:1 随机分组
          detail: 双盲分配至 envudeucitinib 40 mg BID、安慰剂或 apremilast；无需禁食
          type: step
        - id: n4
          label: 每日两次口服给药
          detail: 患者自行服用 envudeucitinib 40 mg BID；达到 IC90 TYK2 抑制并在 24h 给药间隔内维持
          type: step
        - id: n5
          label: 第 2–12 周早期评估
          detail: 第 2 周瘙痒 NRS 改善；第 4 周 PASI 90 与安慰剂拉开；第 12 周 50% 患者 DLQI 0/1
          type: step
        - id: n6
          label: 第 16 周共同主要终点
          detail: PASI 75（平均 74%）和 sPGA 0/1（平均 59%）相对安慰剂 p<0.0001；头皮和 QoL 次要指标
          type: step
        - id: n7
          label: 第 24 周更高门槛终点
          detail: PASI 90（68.0%/62.1%）、PASI 100（41.0%/39.5%）、头皮 ss-PGA 0/1（~75%）；优于 apremilast，p<0.0001
          type: step
        - id: n8
          label: ONWARD3 长期扩展
          detail: 完成第 24 周的患者可进入 ONWARD3（NCT06846541）；持续观察持久性、维持效果和长期安全性
          type: end
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
        - from: n6
          to: n7
        - from: n7
          to: n8
    claimRefs:
      - CE004
      - CE005
      - CE006
      - CE031
      - CE032
      - CE033
