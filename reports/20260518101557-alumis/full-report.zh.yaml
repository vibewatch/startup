  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型：商业化前，Kaken 日本交易带来首笔授权收入
        blocks:
          - type: paragraph
            body: >-
              Alumis 是一家临床阶段生物制药公司，市场上没有商业化产品。截至 2026 年 5 月，公司从未从药品销售中产生收入。 2025 财年，公司报告总收入 $24.05 million，其中 $17.39
              million 为许可收入，$6.66 million 为合作收入——二者全部来自 2025 年 3 月 与 Kaken Pharmaceutical Co., Ltd. 签署的合作与授权协议。Kaken
              交易授予 Kaken 在日本开发、生产和商业化 ESK-001 （envudeucitinib）作为皮肤科疗法的权利；作为交换，Alumis 将在 2025–2026 年获得 $40 million
              预付款和近期共同开发付款， 还有最高约 $140 million 的潜在里程碑和领域选择权付款，以及从低双位数到约日本净销售额 20% 的分级特许权使用费。


              收入确认遵循 ASC 606：$17.4 million 许可义务在 2025 年 3 月向 Kaken 转让许可时确认；开发服务和生产服务义务则随着 Alumis 履约，按投入法随时间确认。截至 2025 年
              12 月 31 日，仍有 $17.6 million 交易价格未履约并递延——其中 $14.3 million 与预计到 2028 年确认的开发服务相关，$3.3 million
              与一项重大权利选择权相关，将在选择权行使或到期时确认。


              在 Kaken 交易之前，Alumis 2024 年收入为零。任何未来商业收入都完全取决于 envudeucitinib 获得 FDA 批准（计划 2026 年 H2 提交 NDA）、在银屑病中成功上市，以及
              SLE 临床读出（Phase 2b LUMUS 试验数据预计 2026 年 Q3）。Kaken 未来可能在日本商业化上市， 届时会带来特许权使用费，但仍需数年。若 envudeucitinib
              获批，美国商业化上市的定价模型尚未由管理层公开披露。 口服 TYK2 抑制剂的行业基准显示，年治疗费用可能在五位数美元区间（Bristol Myers Squibb 已获批 TYK2 抑制剂 Sotyktu
              的美国标价约为每年 $65,000）。Alumis 尚未确认任何定价假设。
