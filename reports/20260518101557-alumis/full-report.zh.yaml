      - number: '5.3'
        title: A-005 CNS 项目与精准医学平台
        blocks:
          - type: paragraph
            body: >-
              A-005 将 TYK2 资产组合延伸进中枢神经系统。该化合物设计用于穿过血脑屏障，瞄准具有 TYK2 遗传学依据的神经炎症疾病——主要是多发性硬化，也可能包括帕金森病和其他神经退行性疾病。在一项纳入 135
              名健康受试者的 1 期研究中，A-005 显示剂量成比例药代动力学、延长的 CSF 暴露（浓度与游离药物血浆浓度相当或更高），并通过 pSTAT 水平变化证明最大 TYK2 抑制。ECTRIMS 2025
              药理数据进一步确认，血浆到 CSF 的游离药物比例约 1:1，并超过细胞实验给出的 IC90 阈值。未报告严重不良事件。多发性硬化 2 期试验预计 H1 2026 启动。如果 A-005 在 MS
              中成功，它将成为首个获批用于神经炎症的口服 CNS 渗透性变构 TYK2 抑制剂。

              Alumis 的精准数据分析平台是推动资产发现和临床生物标志物策略的底层设施。平台整合基因组、蛋白质组和临床数据，用来识别疾病驱动因素、患者亚型和预测性生物标志物。在银屑病中，STRIDE 2
              期生物标志物分析显示，envudeucitinib 可将病灶皮肤中的关键细胞因子和蛋白——包括 IL-23、IL-17F、IL-22、IL-23A、IL-36A、DEFB4A、KRT16 和
              S100A9——恢复至非病灶组织水平。STRIDE 中从 Week 2 开始出现的剂量依赖性血液 SIGLEC1 抑制，为 40 mg BID 最大化 TYK2
              通路占用提供了早期药效学确认。这些生物标志物特征用于指导 SLE 和 CNS 项目的剂量选择与患者富集策略。Alumis 由 Foresite Labs（Foresite Capital
              关联方）孵化；Foresite Labs 依据一项持续至 December 2026 的协议继续提供遗传靶点探索服务。Alumis 的 TYK2 基因组分析显示，TYK2 对约 20
              种免疫介导疾病有贡献，为多适应症资产组合策略提供了理性基础。
