      - number: '7.6'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              CEO Martin Babler 于 September 2021 上任，同时担任总裁、CEO 和董事会主席，是 Alumis 后期开发和 IPO 策略的核心设计者。他曾带领 Principia
              Biopharma 以 $3.7 billion 被 Sanofi 收购，又有 Genentech 和 Eli Lilly 背景，因此在 TYK2
              和免疫肿瘤投资圈具备可信度。若他离职或无法履职，投资者信心会受挫，NDA 进程叙事会被打断，关键机构关系也会面临风险。Alumis 在 10-K
              中明确把对管理团队和关键科研人员的依赖列为重大风险，公司也未公开披露正式继任计划。

              CMO Jörn Drappa 博士麾下临床领导团队的深度，直接决定 NDA 申报能否跑通；这一流程需要 CMC、临床、监管和生物统计能力协同。10-K
              强调，公司吸引并留住合格临床、科研和运营人才存在挑战；在湾区生物科技竞争激烈、同行资金充足的环境里，若 NDA 团队在关键节点（H2 2026 提交）出现流失，冲击会很大。ACELYRIN
              并购整合又增加组织复杂度，因为 ACELYRIN 已终止的主项目 izokibep 可能已经在合并后团队里造成士气和留任问题。

              ACELYRIN 并购过程中暴露过治理风险：ACELYRIN 投资者 Trium Capital 公开施压 ACELYRIN 董事会，要求拒绝 Alumis
              并购、转而清算，理由是清算能为股东带来更高回报。虽然两家公司董事会都建议推进并购，且股东已于 May 13, 2025
              批准交易，但这一事件反映出投资者对交易条款和管理层资本配置的怀疑。并购完成后，这类治理顾虑已经进入 Alumis 股东基础；若执行失速，未来代理权争夺中可能再次浮现。
