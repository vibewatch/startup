  - id: FM001
    title: 口服免疫市场规模金字塔——Alumis 适应症 TAM/SAM/SOM
    type: pyramid
    layout: standard
    summary: >
      三层金字塔展示 Alumis 的嵌套市场机会：最宽层是总可寻址市场（斑块型银屑病、PsA 和 SLE 的全球治疗支出合计），中间层是口服系统性治疗 SAM，底层是口服 TYK2 类
      SOM。每一层都基于不同分析师估计或推导估计。金字塔从全疗法 TAM 到口服 TYK2 SOM 急剧收窄，反映生物制剂在三个适应症中均占主导。
    data:
      items:
        - label: 总可寻址市场（全球 PsO + PsA + SLE 治疗支出，所有疗法）
          value: '>$30B (2026)'
          note: 由 Fortune Business Insights（$13.97B PsA）、Mordor/TBRC（$3.68–3.71B SLE）和斑块型银屑病估计（$12–16B）合计得出。生物制剂主导三个适应症。
          layer: 1
          claimRef: CM007
        - label: 可服务可寻址市场（全球 3 个适应症的口服系统性免疫疗法）
          value: ~$5–9B (2026, estimated)
          note: 口服疗法占 PsA 市场约 20–28%，在银屑病和 SLE 中占比更低。该估计来自类别渗透率数据；没有分析师明确测算这一跨适应症口服 SAM。
          layer: 2
          claimRef: CM009
        - label: 可服务可获得市场（全球口服 TYK2 抑制剂类别，2026）
          value: ~$615M (2026)
          note: >-
            Research and Markets 对口服 TYK2 类别的预测，CAGR 为 9.6%。该类别由 Sotyktu（FY2024 $246M）主导；随着 zasocitinib 和 envudeucitinib
            入市，类别将扩张。
          layer: 3
          claimRef: CM001
    claimRefs:
