  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 患者人群分层
        blocks:
          - type: paragraph
            body: >
              Alumis 仍是一家商业化前临床阶段公司；截至 May 2026，还没有产生产品收入的客户。因此，客户框架只能前瞻性拆成三条主轴：患者、处方医生和支付方。

              首要患者分层是美国中重度斑块状银屑病成人。National Psoriasis Foundation 报告，截至 March 2026，美国有 7.5 million 成人患有银屑病，其中约 1.9
              million（约四分之一）达到需要系统治疗的中重度阈值，也就是 envudeucitinib 的直接可服务人群。斑块状银屑病占全部银屑病表现的 80-90%，也是唯一推进到 3 期的适应症。

              两个扩展分层正处于临床开发。按 NHANES 2017-2020（ACR 2024），银屑病关节炎影响约 912,000 名美国成人；Sotyktu 在 March 2026 获 FDA 批准用于 PsA，验证了
              TYK2 抑制在关节疾病中的可行性。按 CDC 估计，系统性红斑狼疮影响约 204,000 名美国成人；Alumis 的 2b 期 LUMUS 试验预计 Q3 2026 给出顶线数据。

              处方医生客户包括美国皮肤科医生（约 12,000-13,000 名执业）和风湿科医生（约 6,500-7,000 名）。支付方客户——商业健康计划和 PBMs——构成第三条轴；UHC 和 Cigna 已经对
              Sotyktu 施加阶梯治疗事先授权，建立了 envudeucitinib 将面对的处方集先例。

              全球银屑病药物市场 2025 年为 $20.05 billion，预计到 2031 年增至 $32.94 billion，CAGR 为 8.63%；口服小分子（包括 TYK2 抑制剂）是增长最快的细分，CAGR
              接近 15%。
            claimRefs:
