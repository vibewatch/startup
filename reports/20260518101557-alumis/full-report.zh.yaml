      - number: '7.2'
        title: 临床与运营风险
        blocks:
          - type: paragraph
            body: >-
              单资产集中是 Alumis 最核心的运营风险。Envudeucitinib 代表近期全部商业化路径；所有临床、监管和商业执行都压在这一单一分子上。公司在 June 2024 停止了 envu
              用于非感染性葡萄膜炎的 2a 期试验，因为疗效结果未达到其临床阈值，说明 TYK2 抑制并不能泛化到每个适应症。SLE 2b 期 LUMUS 试验——一项 48 周研究，预计 Q3 2026
              给出顶线数据——是下一个高风险二元读出。LUMUS 入组一直不易，因为患者筛选时必须处于活动性疾病状态；10-K 明确提示，临床试验时间越长，受试者退出风险越高。

              制造完全依赖第三方 CDMOs 和合同制造商。Alumis 没有制造设施，envu API 主要来自印度和台湾制造商。公司在 10-K 中承认，尚未建立长期供应安排，仍在为 envu
              API、制剂和关键原材料搭建冗余供应链。在搭建期内，单一来源 API 任何中断——无论来自地缘政治紧张、FDA 对 CDMO 发出警告信、质量事件还是不可抗力——都可能让临床供应停摆，或推迟 NDA CMC
              文件。2025-2026 年行业数据显示，FDA 对合同制造商的执法行动在 2025 年增加约 50%，超过 40% 药企报告因地缘政治紧张出现供应链中断。

              长期安全性仍需持续观察。Alumis 10-K 指出，随着 ONWARD3 中更多患者接受更长时间 envu 暴露，更多 SAEs 和 AEs
              会积累。某些状况在银屑病患者中更常见——肥胖、心血管疾病、银屑病关节炎、抑郁——会干扰归因。作为监管先例的 Deucravacitinib
              标签包含横纹肌溶解警告；这是一种罕见但严重的不良事件，可能在长期扩展数据中浮现。长期免疫调节带来的理论性致癌风险仍在监测，但以当前试验时长无法量化。
