      - number: '5.2'
        title: Envudeucitinib：变构机制、选择性与 3 期 ONWARD 证据
        blocks:
          - type: paragraph
            body: >-
              Envudeucitinib 通过变构机制实现 TYK2 选择性：它结合 JH2 假激酶调控结构域——该位点在结构上不同于 JAK1、JAK2 和 JAK3 的 JH2 结构域——诱导构象变化，将催化性 JH1
              结构域锁定在非活性状态，阻断 ATP 结合和下游 STAT 磷酸化。这种间接抑制保留了 JAK1/2/3 信号活性，避开第一代非选择性 JAK
              抑制剂相关的血细胞减少、感染风险和脂质紊乱。分子结构中加入氘代甲基三唑基团，以增强 CYP1A2 代谢稳定性并减少代谢物驱动的脱靶效应；另有环丙基甲酰胺基团，假设可降低 hERG 相关心脏复极风险。在 40 mg
              BID 口服给药下，药物可在完整 24 小时给药间隔内维持最大 IC90 TYK2 抑制——2 期数据显示，这一药效学阈值是获得强皮损清除反应的必要条件。

              3 期 ONWARD1（NCT06586112）和 ONWARD2（NCT06588738）纳入超过 1,700 名中重度斑块状银屑病成人患者，按 2:1:1 随机分配至 envudeucitinib 40 mg
              BID、安慰剂或活性对照 apremilast。两项试验均达到全部共同主要终点（PASI 75 和 Week 16 时 sPGA 0/1），并以高统计显著性达到所有次要终点。两项试验合并看，Week 16 时
              74% 患者达到 PASI 75，59% 达到 sPGA 0/1（相对安慰剂 p<0.0001）。Week 24 时，PASI 90 率为 68.0%（ONWARD1）和 62.1%（ONWARD2），PASI
              100 率为 41.0% 和 39.5%——处于该适应症口服疗法的高端区间。Envudeucitinib 在 Week 24 的所有 PASI 终点上均优于 apremilast（每项试验 p<0.0001）。到
              Week 24，约 75% 患者实现头皮银屑病清除（ss-PGA 0/1）。患者报告的瘙痒改善早在 Week 2 即可观察到，Week 12 时 50% 患者达到 DLQI
              0/1。最常见的治疗期间不良事件为头痛、鼻咽炎、上呼吸道感染和痤疮；多数为轻至中度，截至 Week 24 未出现新的安全信号。公司计划在 Q4 2026 向 FDA 提交 NDA。长期扩展试验
              ONWARD3（NCT06846541）仍在进行。
