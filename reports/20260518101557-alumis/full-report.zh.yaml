      - number: '4.4'
        title: 资本充足性：$633M 备考流动性可支撑运营至 Q4 2027
        blocks:
          - type: paragraph
            body: >-
              截至 December 31, 2025，Alumis 持有 $308.5 million 现金、现金等价物和有价证券（其中 $89.7 million 为现金，$218.8 million
              为有价证券）。January 2026 后续公开发行新增 $324.4 million 净募资，使备考流动性增至约 $632.9 million。管理层在 March 2026 10-K
              中表示，合并现金头寸——既有 2025 年末余额加上 January 2026 发行净募资——预计可支持经营费用和资本开支需求至 2027 年第四季度。公司在 2025
              年文件中确认没有债务、信贷额度或项目融资义务。


              按 2025 年经营性现金消耗 $369.5 million/年（约 $92 million/季度）测算，$632.9 million 备考资金相当于自 2025 年末起约 20 个月现金跑道，与管理层 Q4
              2027 指引一致。近期 2026 年支出计划包括 3 期 ONWARD 长期数据收集、NDA 准备和提交，以及 2b 期 LUMUS SLE 试验活动。如果 NDA 按标准 12 个月 FDA
              审评周期获受理并获批，Alumis 将在当前现金跑道耗尽前后接近或进入商业化阶段支出。


              多个因素可能压缩现金跑道。第一，NDA 准备和商业化前活动（商业团队搭建、制造放大、支付方合约）会在任何产品收入出现前带来增量资本需求。第二，如果 SLE 2b 期数据支持推进 3
              期，将触发更多大规模试验成本。第三，公司仍有一项活跃的 Form S-3 储架注册文件，提交日期为 July 3, 2025（July 2028 到期），且此前已通过 January 8, 2026 的
              424B5 招股说明书补充文件 使用过至少一次，说明公司仍依赖 ATM 和后续公开发行能力来补足资产负债表。截至 May 2026，ALMS 空头持仓约占流通股 14.96%，回补天数为 9.01
              天——偏高但不极端，反映投资者对盈利时间表仍有分歧。
