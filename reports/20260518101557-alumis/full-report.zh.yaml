      - number: '8.4'
        title: 退出准备度和最终尽调事项
        blocks:
          - type: paragraph
            body: >
              Alumis 已经上市（NASDAQ: ALMS），早期投资者的 IPO 退出路径已在 June 2024 完成。投资者剩余退出机制包括：借 FDA 批准和商业化上市推动股价升值，目标锚定分析师一致预期每股
              $40；寻求大型药企并购，尤其是需要口服免疫学能力的买方，考虑到其同类领先的 TYK2 数据，Alumis 对 AbbVie、Pfizer 或 Sanofi 都具吸引力；以及围绕 ex-US 权利或 SLE
              适应症达成合作 / 授权交易，在验证管线的同时提供非稀释资金。近期尽调重点应放在 NDA 包准备度，包括生产 CMC、临床模块完整性和儿科研究豁免；SLE LUMUS 主要终点细节；相对 Takeda
              zasocitinib 的时间和标签竞争定位；以及上市时争取处方集位置的支付方策略。公司约 $569.5M 现金跑道应足以支撑运营至 late 2027，覆盖申报后预计 12 months FDA 审评期。若
              Kaken Pharmaceutical 合作协议被重新谈判，合作收入集中度仍是脆弱点。
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV042
          - type: table
            tableRef: TV006
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV042
      - number: '8.5'
        title: 附录
        blocks:
          - type: callout
            title: 投资建议：买入（中等信心）
            body: >
              Alumis 获得买入评级，驱动因素包括同类领先的 3 期疗效、$569.5M 现金缓冲，以及分析师一致预期隐含相对 $40 目标价约 60% 上行空间。H2 2026 NDA
              申报是关键二元催化剂。仓位大小应反映单一资产集中风险和约流通股 15.5% 的较高空头仓位。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV013
              - CV022
          - type: callout
            title: 关键风险：单一资产面对二元 FDA 结果
            body: >
              Alumis 只有一项商业阶段管线资产。若 FDA 就 envudeucitinib 银屑病 NDA 发出完整回复函——基于 3 期数据质量估计概率约 15%——市值可能重置到 $0.9–$1.5B
              的悲观情景区间，较当前水平下跌 50–70%。
            calloutType: risk
            claimRefs:
              - CV030
              - CV031
              - CV038
          - type: callout
            title: 可比估值校验：当前价格介于悲观和基准情景之间
            body: >
              ALMS 当前市值 $3.16B，高于悲观情景（$0.9–$1.5B）、低于基准情景中点（$4.5B），意味着市场给获批结果约 60–70% 概率。对于一个 3
              期已完成、数据阳性且分析师支持强的项目，这一定价按概率加权后合理。
            calloutType: insight
            claimRefs:
              - CV001
              - CV034
              - CV035
              - CV036
              - CV037
