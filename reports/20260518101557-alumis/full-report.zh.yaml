      - number: '2.5'
        title: 竞争市场动态与口服免疫学格局
        blocks:
          - type: paragraph
            body: >
              银屑病及相关适应症的口服免疫学市场，正经历自 2000 年代初生物制剂获批以来最具颠覆性的阶段。五股力量正在汇合： （1）第二代 TYK2 抑制剂（envudeucitinib、zasocitinib）在
              Phase 3 中达到生物制剂级 PASI 90； （2）首个口服 IL-23 拮抗剂（ICOTYDE）于 2026 年 3 月获 FDA 批准，峰值销售额预计超过 $5B；
              （3）既有注射生物制剂（Skyrizi、Cosentyx、Tremfya）拥有数十亿收入基盘和强临床差异化；
              （4）老一代生物制剂（adalimumab、etanercept）的生物类似药竞争扩大，降低支付方在成熟疗法上的成本； （5）TYK2 管线密度高——142 个活跃项目——让 2030 年前的竞争跑道变得拥挤。

              对 Alumis 来说，商业上最相关的比较是 envudeucitinib vs Sotyktu vs zasocitinib，因为这是三款已处于或接近 NDA 阶段的口服 TYK2 药物。Sotyktu
              FY2024 收入为 $246 million，GlobalData 预计 2029 年达到 $2.9B， 这给近期类别上限划出边界。Zasocitinib 接近同步提交 NDA，加上 Takeda $4B
              的收购投入，显示其商业意图认真。 ICOTYDE 于 2026 年 3 月获批，引入口服 IL-23 竞争者，并拥有相对 Sotyktu 更优的头对头数据。Envudeucitinib 的临床差异化建立在最大化
              24 小时 TYK2 抑制（公司主张，尚未独立验证）和来自 1,700+ 名患者的强 PASI 90/100 数据之上。 竞争市场分析显示，到 2027–2028 年，Alumis
              将进入一个四药口服银屑病竞争局；要在 $615M 且增长中的 TYK2 子市场中拿到有意义份额，公司需要处方集定位、定价纪律和临床差异化。
            claimRefs: []
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接 TYK2 抑制剂竞争对手
        blocks:
          - type: paragraph
            body: >-
              TYK2 抑制剂类别是 Alumis 最直接的竞争场，目前由 Bristol Myers Squibb 的 Sotyktu（deucravacitinib）锚定， Takeda 的 zasocitinib
              即将加入竞争。Sotyktu 于 2022 年 9 月获 FDA 批准用于中重度斑块状银屑病，是首个同类 选择性 TYK2 抑制剂。其变构机制——结合 JH2 假激酶调节结构域，而非 ATP
              结合位点——赋予其相对 JAK1/2/3 的选择性， 也把它与带有类别黑框警告的更广谱 JAK 抑制剂区分开来。Sotyktu 2024 年全球净销售额约 $246 million，同比增长 45%。 2026
              年 3 月，FDA 基于关键 POETYK PsA-1 和 PsA-2 Phase 3 试验数据，把 Sotyktu 标签扩展到活动性银屑病关节炎， 使其成为首个获批用于 PsA 的 TYK2 抑制剂。BMS
              进一步扩大患者可及性：2026 年 1 月推出直达患者平台， 30 天供应价 $950，比此前约 $6,828 的美国标价下降 86%。尽管早期商业化已有牵引，分析师下调评级压低了峰值销售预期： Leerink
              Partners 将其 2030 年 Sotyktu 销售额估计下调至 $832 million，而 BMS 自身指引为超过 $4 billion； 下调原因是支付方准入摩擦和新兴竞争对手带来的定价压力。

              Takeda 的 zasocitinib（TAK-279，原 NDI-034858）于 2022 年 12 月从 Nimbus Therapeutics 收购而来， 首付款 $4
              billion，是行业史上规模最大的单资产免疫学收购之一。在中重度斑块状银屑病 Phase 3 LATITUDE 试验中， 约 70% 患者在第 16 周达到 sPGA 0/1，PASI 90 超过 50%；超过
              90% 的应答者将获益维持至 60 周， 显示出强持久性。Takeda 目标是在 2026 财年向 FDA 提交 NDA。Zasocitinib 也处于银屑病关节炎 Phase 3，
              长期延伸研究（NCT07286058）预计在 2029 年 12 月完成。

              TYK2 类别也有值得注意的竞争失败。Ventyx Biosciences 的 VTX958 于 2023 年 4 月在 Phase 2 SLE 试验中失败并被终止—— 这预警了 Alumis 正试图在
              LUMUS Phase 2b 试验中克服的类别级 SLE 挑战。Priovant Therapeutics 的 brepocitinib （PF-06700841）是 Pfizer-Roivant
              合资项目下的双重 TYK2/JAK1 抑制剂，2023 年未能在一项 Phase IIb 外用银屑病研究中达到主要终点；其银屑病开发已被降级，资源转向皮肌炎、葡萄膜炎和扁平苔藓性毛囊炎。两次失败都强化了一个判断：
              变构 TYK2 选择性，是在银屑病中形成竞争差异化所需的机制画像。
