      - number: '3.5'
        title: 护城河分析与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Alumis 潜在竞争护城河由三层相互强化的因素构成。第一，ESK-001 的分子画像——最大化 24 小时 TYK2 抑制， 且 Phase 2 和 Phase 3
              研究中未出现新的安全性信号——使其有机会成为相对 Sotyktu 的临床升级方案，但仍需头对头验证。 第二，管线宽度提供了银屑病之外的战略可选项：Alumis 的 LUMUS Phase 2b SLE
              试验已完成入组，顶线数据预计 2026 年 Q3 公布； A-005 是一款可透过 CNS 的变构 TYK2 抑制剂，计划在 2026 年 H1 启动多发性硬化 Phase 2。ACTRIMS Forum
              2025 公布的 A-005 Phase 1 数据确认，脑脊液药物水平与血浆水平相当或更高，验证了 CNS 穿透假设。第三，公开资本结构和约 $529 million
              累计融资，让公司可进入股权市场，为商业化建设或合作提供资金，短期稀释压力较小。

              竞争风险重大且多维。Icotyde 2026 年 3 月获 FDA 批准，并已在头对头中证明优于 Sotyktu；在 ESK-001 预计于 2027 年 H2 左右（NDA 申报后标准 10
              个月审评）商业化进入前，留给它的口服残余市场已经收窄。Zasocitinib 的 Phase 3 PASI 90 数据与 ESK-001 方向上具备竞争力，使两个 TYK2 抑制剂并存的口服市场成为可能；届时
              ESK-001 可能是第三个进入者，而不是主要颠覆者。Takeda 通过全球 Entyvio 品牌建立的整合免疫学商业基础设施， 给 zasocitinib 带来相对首款产品商业化公司的显著上市执行优势。BMS
              对 Sotyktu 设定的 $950 / 月直达患者定价先例， 在 ESK-001 上市前就压缩了类别级毛利率预期。此外，VTX958 2023 年 Phase 2 SLE 失败说明，TYK2
              抑制并不会自动跨自身免疫适应症转化， 这给 Alumis 的 LUMUS 项目带来管线风险——尽管 LUMUS 的设计和患者选择不同于失败的 Ventyx 研究。

              银屑病市场的切换成本中等：疗效良好的患者很少会在没有应答丧失时换药，而阶梯编辑处方集要求会在获批后把初始品牌准入延迟数月。 分销权掌握在专业 PBM——Express Scripts、CVS
              Caremark、OptumRx——以及专业药房手中，Alumis 与这些主体没有既有合同关系。 对一家没有商业化历史的公司来说，PBM 合约能力是首个产品上市特有的执行风险。
