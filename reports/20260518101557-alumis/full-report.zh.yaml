      - number: '3.2'
        title: 口服系统替代方案：JAK 抑制剂、PDE4 与口服 IL-23
        blocks:
          - type: paragraph
            body: >-
              TYK2 抑制剂之外，Alumis 还面对不断扩大的口服系统疗法格局。2026 年最重要的竞争事件，是 Johnson and Johnson 的 icotyde（icotrokinra，原 JNJ-2113）于
              2026 年 3 月获 FDA 批准；这是首个用于 12 岁及以上成人和青少年中重度斑块状银屑病患者的口服 IL-23 受体拮抗剂肽。关键 ICONIC 项目纳入超过 2,500 名患者，并在 Phase 3
              头对头比较中显示相对 deucravacitinib 的优效； 约 70% 患者达到 IGA 0/1，55% 在第 16 周达到 PASI 90。分析师预计，icotyde 可能超过 Sotyktu 和
              Otezla， 成为银屑病首选口服方案，并设定新的疗效基准；ESK-001 若要证明第三个口服进入者的合理性，就必须匹配或超越该基准。 ESK-001 的 ONWARD Phase 3
              达到所有主要和次要终点，包括在每个 PASI 基准上优于 apremilast；ESK-001 第 24 周 PASI 90 约 65%，PASI 100 超过 40%。ESK-001 与 icotyde
              尚无头对头试验，相对口服定位仍未解决。

              JAK 抑制剂构成最大的相邻口服免疫学类别。AbbVie 的 Rinvoq（upadacitinib）已获批用于斑块状银屑病、银屑病关节炎、 特应性皮炎和多个其他适应症；截至 2026 年
              Q1，处方价值同比增长约 32%。不过，所有 pan-JAK 药物——包括 Rinvoq、 Xeljanz（tofacitinib）和 Olumiant（baricitinib）——都带有 FDA
              类别黑框警告，覆盖严重感染、恶性肿瘤、 重大不良心血管事件和血栓；相对于 TYK2 选择性和 IL-23 靶向药物，这是结构性安全劣势。由于仿制药进入和安全性驱动的处方集限制， Pfizer 的 Xeljanz
              在 2026 年处方量下降约 21%。

              Amgen 的 Otezla（apremilast）是开创性的口服 PDE4 银屑病抑制剂，仍拥有最大的既有口服用户基础；2025 年全球市场预计为 $2.14–2.8
              billion。分析师调研显示，Otezla 并未明显向 Sotyktu 流失份额；TYK2 类别增长似乎主要来自已用生物制剂治疗的患者， 而不是 Otezla 转换患者。ESK-001 的 ONWARD 试验把
              apremilast 作为活性对照臂，envudeucitinib 在所有疗效终点上优于 apremilast， 建立了有意设计的升级替代逻辑：对于反应不足患者，ESK-001
              可在支付方和处方医生谈判中被定位为优于 Otezla 的口服升级方案。
