      - number: '5.5'
        title: 监管合规、质量控制与开发路线图
        blocks:
          - type: paragraph
            body: >-
              Alumis 所有临床项目均在美国 FDA IND 申请下开展，所有试验均按良好临床实践（Good Clinical Practice）要求在 ClinicalTrials.gov 注册。3 期 ONWARD
              项目的 NCT 编号为 NCT06586112、NCT06588738（ONWARD1、ONWARD2）和 NCT06846541（ONWARD3）。LUMUS 2b 期 SLE 试验注册号为
              NCT05966480。制造合作方预计按 GMP 生产临床供应；NDA 提交则需要商业规模 GMP 合规。GLP 临床前研究支撑所有支持 IND 申报的毒理学包，所有研究中心均有 IRB 监督。

              竞争性监管环境带来一项可校准的风险。FDA 已对 JAK 抑制剂发布类别性黑框警告，覆盖感染、恶性肿瘤、重大心血管不良事件和血栓——这一警告由亲和力更高的 JAK1/2/3 抑制剂数据驱动。Alumis
              主张，envudeucitinib 的变构、TYK2 选择性机制保留 JAK1/2/3 活性，因此不应纳入这些 JAK 类别担忧。Deucravacitinib（Sotyktu）同样采用这种变构 JH2
              机制，并于 2022 年获 FDA 批准；其标签没有黑框警告，形成了监管先例。Envudeucitinib NDA 将接受 ONWARD1/2 完整安全数据库加 ONWARD3 长期扩展数据审评；扩展试验或
              SLE 队列中任何新信号，都可能影响标签范围。公开文件提到 Alumis 对 envudeucitinib 和 A-005 的 IP 组合，但未逐项列示——化合物组成和用途专利的覆盖广度及到期年限仍是尽调缺口。
