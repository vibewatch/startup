      - number: '6.3'
        title: 试验证据与具名利益相关方背书
        blocks:
          - type: paragraph
            body: >
              上市前最具体的客户证据来自 ONWARD 3 期项目——ONWARD1（NCT06586112）和 ONWARD2（NCT06588738）在 156 个全球研究中心随机纳入 1,700+ 名患者，入组于 May
              2025 完成，顶线数据于 March 28 的 AAD 2026 公布。

              对口服药而言，疗效结果非常突出。Week 16 时，约 74% envudeucitinib 患者达到 PASI 75，59.5% 达到 sPGA
              0/1，两项试验均以统计显著性（p<0.001）达到共同主要终点。到 Week 24，约 65% 达到 PASI 90，约 40% 达到 PASI
              100——这一疗效排名在间接比较中可媲美或超过若干已上市生物制剂。Envudeucitinib 在 Week 24 的所有 PASI 终点上超过
              apremilast，形成支持处方集差异化的关键次要胜利。瘙痒缓解（患者报告 NRS 评分）从 Week 2 即可检测到，给患者带来快速可感知收益，有助于依从性和口碑需求。

              截至 Week 24，安全性画像与此前 2 期数据一致；不良事件大多为轻至中度（鼻咽炎、头痛、痤疮、上呼吸道感染），没有新的安全信号。

              Dr. Andrew Blauvelt, MD, MBA（Blauvelt Consulting）是一位发表丰富的 TYK2 专家、前 Oregon Medical Research Center 教员，担任
              ONWARD 主要研究者，并在 AAD 2026 展示结果。National Psoriasis Foundation 在其 AAD 2026 报道中将 envudeucitinib
              列为口服突破候选药物，为临床证据补上患者倡导组织的可信度。
