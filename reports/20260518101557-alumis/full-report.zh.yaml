      - number: '7.3'
        title: 竞争与技术风险
        blocks:
          - type: paragraph
            body: >-
              TYK2 抑制剂竞争格局在 2026 年明显升温。Takeda 的 zasocitinib（2022 年以 $4 billion 从 Nimbus Therapeutics 收购）在 2026 American
              Academy of Dermatology 会议上公布 3 期 LATITUDE 数据：Week 16 两项试验 PASI 90 率为 61.3% 和 51.9%，PASI 100 为 33.4% 和
              25.2%。Takeda 计划在其 2026 财年提交美国批准申请，并预测峰值收入 $3–6 billion。关键给药差异在于，zasocitinib 每日一次，而 envudeucitinib
              每日两次；在初级保健和皮肤科场景中，JAK 和 TYK2 抑制剂会围绕便利性竞争，这可能成为实质性依从性劣势。Takeda R&D 总裁公开称，给药是相对 Alumis 的「相当大的差异化」领域。

              BMS Sotyktu（deucravacitinib）作为先发者，3 期 PASI 90 率仅 32–42%，疗效上正被 zasocitinib 和 envu 双双超越；但 BMS 在 March 2026 获
              FDA 批准 Sotyktu 用于银屑病关节炎，扩大了商业护城河，而 Alumis 仍没有获批产品。J&J 与 Protagonist 的 Icotyde（可注射 IL-23 受体拮抗剂）基于最高 55% 的
              Week 16 PASI 90 率获得 FDA 批准，在 envu 入市时又增加一个高疗效注射竞争者。

              Ventyx Biosciences 的 VTX958 项目提供了警示性横向参照。VTX958 是一款变构 TYK2 抑制剂，曾在 2 期银屑病试验（疗效相对竞争门槛不足，November 2023）和 2
              期克罗恩病试验（尽管内镜改善呈剂量依赖，CDAI 主要终点仍未达成）中均未达到主要症状终点。Ventyx 已停止 VTX958 内部开发。Envudeucitinib 机制上不同（它实现最大 TYK2
              抑制，同时阻断 IL-23/IL-17 和 I 型干扰素），但 VTX958 的失败说明，变构 TYK2 抑制剂这个类别并不保证在每个免疫适应症都有效。尤其是 SLE，类别内证据参差不齐。如果 LUMUS
              失败，市场会质疑向其他免疫适应症外推的逻辑。

              中国药企也在加速提交 TYK2 专利，构成更长期的国际竞争和 IP 压力向量，尤其是在全球 TYK2 机会延伸到的亚太市场。
