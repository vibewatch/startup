  - id: FR001
    title: Alumis 风险热力图——可能性 × 严重性
    type: matrix
    layout: standard
    summary: 运营 / 供应和临床二元风险集中在高可能性 / 高严重性象限；监管和法律风险落在高严重性、较低可能性一侧。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 致命
          values:
            - 知识产权挑战 / 专利无效
            - FDA 对 NDA 发出 CRL；NDA CMC 期间 CDMO GMP 不达标
            - ONWARD3（长期）出现 SAE 信号
        - label: 高
          values:
            - Envu 葡萄膜炎类适应症外失败
            - ACELYRIN 诉讼不利判决；印度 / 台湾 API 供应中断
            - LUMUS SLE 2b 期失败；Kaken 合作争议；zasocitinib 先于 envu 获 FDA 批准
        - label: 中
          values:
            - ATM 资本市场通道受损
            - ACELYRIN 并购整合人才流失；Climb Bio 诉讼
            - 现金跑道耗尽；CEO/CMO 离职
        - label: 低
          values:
            - 中国 TYK2 新进入者提交国际 IP 申请
            - 英国 / 欧盟临床试验监管分化
            - envu 获批后报销 / 覆盖被拒
