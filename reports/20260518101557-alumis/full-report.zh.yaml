      - number: '8.2'
        title: 估值背景和可比分析
        blocks:
          - type: paragraph
            body: >
              截至 May 18, 2026，ALMS 股价为每股 $24.86，市值约 $3.16 billion；相对有形资产溢价很高，但较分析师一致目标价仍有明显折价。华尔街 10–13
              位分析师给出强烈买入一致评级，平均目标价约每股 $40（区间 $25–$55），意味着约 60% 上行空间。主要目标价包括 Oppenheimer 的 $55、Wells Fargo 的 $51 和 Morgan
              Stanley 的 $38。这一估值大体符合拥有同类领先 3 期数据、处于后期但尚未商业化的生物科技公司先例：银屑病和自身免疫领域的并购曾给出 50–100%+ 溢价。January 2026
              扩大发行的公开增发以每股 $17 融资 $345.1 million；此后股价上涨约 46%，反映市场对 3 期疗效故事需求强劲。可比分析锚定定位相近的 pre-NDA
              生物科技公司，以及近期成交的皮肤病学和免疫学资产。Takeda 的 zasocitinib 是最接近的竞争变量，也计划在 2026 年向 FDA 申报，PASI 90 >50%。BMS Sotyktu
              是唯一获批的口服 TYK2 抑制剂，2024 年收入约 $190M，远低于峰值预测，暴露出处方集准入和生物制剂既有玩家卡位带来的挑战。若将 1.0–1.5x EV/峰值销售倍数套用于 envudeucitinib
              银屑病峰值销售估计 $2.5B，公允价值区间约为 $3.2–$4.2B；假设上市成功，当前市值处于合理到略低估区间。
