  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 治疗管线与产品线地图
        blocks:
          - type: paragraph
            body: >-
              Alumis 围绕 TYK2 资产组合组织资产：两款处于临床阶段、作用于 TYK2 JH2 假激酶结构域的变构抑制剂，一个用于理性指导部署的精准数据分析平台，以及同一平台识别出的临床前项目。核心资产是
              envudeucitinib（原 ESK-001），一种口服、高选择性、非共价小分子变构 TYK2 抑制剂，剂量为 40 mg 每日两次。它正处于中重度斑块状银屑病 3 期（ONWARD
              项目）、系统性红斑狼疮（LUMUS）2b 期，并在探索更多免疫介导疾病，包括银屑病关节炎和类风湿关节炎。A-005 是第二代、可进入 CNS 的变构 TYK2
              抑制剂，设计目标是在具有药理相关性的浓度下穿过血脑屏障；该项目已完成 1 期，2026 年将推进至多发性硬化 2 期。Lonigutamab 是通过 ACELYRIN 合并获得的、用于甲状腺眼病的皮下注射抗
              IGF-1R 单克隆抗体，截至 Q1 2026 处于战略评估中。TYK2 之外，精准分析平台已识别 IRF5 和其他未披露靶点，至少一个内部开发项目预计在 H2 2026 报告 1 期数据。除
              envudeucitinib 在日本的权益外，Alumis 保留所有资产的全球权利（Kaken Pharmaceutical 持有日本皮肤科独家权利）。
