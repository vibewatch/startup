  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑和反向逻辑
        blocks:
          - type: paragraph
            body: >
              Alumis 的买入逻辑有三根支柱：同类领先的临床疗效、渗透不足的大型可服务市场，以及获批前已经资金充足的资产负债表。ONWARD1 和 ONWARD2 3 期数据确认，envudeucitinib 在 Week
              24 可达到约 65% 的 PASI 90 率、约 40% 的 PASI 100 率，显著高于 deucravacitinib（Sotyktu）约 40% PASI 90 的基准。银屑病药物市场 2026
              年估计为 $21.78 billion，并在 2031 年前以约 8.6% 年增速扩张；更聚焦的 TYK2 抑制剂细分市场则以 15% CAGR 迈向 2033 年 $7.4 billion。Alumis 计划在
              H2 2026 提交 NDA，可能打开 2027 年商业化上市窗口；仅银屑病一项，全球峰值销售潜力估计为 $2–4 billion。反向逻辑集中在二元监管风险和商业执行风险：整个投资逻辑都押在一款药能否获 FDA
              批准，并在一个已有 deucravacitinib 和新获批口服 IL-23 抑制剂 icotrokinra 的竞争市场里成功上市。较高的空头仓位（约流通股 15.5%）显示机构看空明显；任何 NDA 延误或
              FDA 额外数据要求，都可能让股价大幅下修。公司 Q1 2026 收入仅 $1.74M，依赖单一授权合作伙伴 Kaken Pharmaceutical，且必须进入一个由大型生物制剂巨头掌控处方集准入的市场。
