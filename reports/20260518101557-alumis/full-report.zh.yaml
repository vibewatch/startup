    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Alumis Inc. 是一家后期生物制药公司，在 Delaware 注册成立，总部位于 280 East Grand Avenue, South San Francisco, California
              94080。公司在 SEC 登记的通信和办公地址可由 CIK 0001847367 下的 EDGAR 文件确认。Alumis 称，公司用精准方法开发口服疗法，以优化临床结局，并显著改善免疫介导疾病患者的生活。
              公司在 Nasdaq Global Select Market 上市，股票代码 ALMS，已于 2024 年 6 月 28 日开始交易。


              公司成立于 2021 年，源自 Foresite Capital 的孵化部门 Foresite Labs。多个行业来源确认，Alumis 更名前曾以 Esker Therapeutics
              名义运营。公司的核心商业模式是临床阶段药物开发；截至本次报告日期，公司没有获批产品， 也没有产品收入。运营全部靠股权融资支撑；截至 2026 年 5 月，公司报告的过去十二个月每股亏损为 $1.78。


              Alumis 的商业逻辑押注于开发下一代口服小分子疗法：疗效上挑战注射生物制剂，同时保留口服给药的便利性。公司用自研精准数据分析平台， 在多种免疫介导疾病中识别并推进项目。除 TYK2 抑制剂项目外，Alumis
              还把管线扩展到 lonigutamab， 这是一款用于甲状腺眼病、皮下注射给药的抗 IGF-1R 生物制剂，体现出多靶点切入免疫介导疾病的路线。 公司把策略描述为打造“一片药里的管线”，希望借助对
              IL-23、IL-17 和 I 型干扰素通路的最大化 TYK2 抑制， 覆盖公司基因组分析认为驱动约 20 种免疫介导疾病的关键机制。
