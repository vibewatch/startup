      - number: '7.5'
        title: 财务风险
        blocks:
          - type: paragraph
            body: >-
              Alumis 是一家临床阶段公司，没有来自产品的商业收入；截至 December 31, 2025，累计亏损 $901.9 million，FY2025 和 FY2024 净亏损分别为 $243.3
              million 和 $294.2 million。Q1 2026 季度经营性现金消耗为 $87 million，与后期临床开发成本一致。管理层称，当前现金——截至 March 31, 2026 为 $570
              million，且 January 2026 完成 $324 million 公开发行——足以支持自 March 2026 起至少 12 个月运营；这意味着在 H2 2026 NDA
              提交前或提交后不久，公司可能还需要额外融资。如果 NDA 按期提交并在标准 10 个月审评周期内获批，商业化费用会在公司需要融资或谈判商业合作时大幅推高烧钱速度。

              稀释风险实质且持续存在。March 2026 与 Cantor Fitzgerald 签署的 $300 million ATM 协议补充了股权融资工具，但 ATM 销售会造成持续股份稀释。每一轮后续融资——包括
              January 2026 的 $324M 发行——都会稀释早期投资者。Alumis 还持有 $51 million 与 lonigutamab 项目相关的已收购在研 R&D 无形资产；在决定探索
              lonigutamab 战略替代方案后，可能出现非现金减值。Kaken Pharmaceutical 收入集中意味着，任何合作争议都会在公司仍以每季度 $87M 烧钱时立即抹去全部收入。

              NDA 结果的二元属性形成财务悬崖。如果 FDA 发出 CRL，市值可能大幅下跌，削弱公司以合理条款融资的能力，并威胁商业化计划。不同于商业阶段生物科技公司，Alumis 没有能产生现金的产品来缓冲挫折。June
              2024 IPO 募资约 $250 million；后续股权发行延长了现金跑道，但公司仍结构性依赖有利的资本市场条件和成功的 NDA 结果。
