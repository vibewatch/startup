      - number: '4.2'
        title: 融资历史：IPO 以来股权融资超过 $816M，包括 2026 年 1 月后续增发
        blocks:
          - type: paragraph
            body: >-
              Alumis 的运营完全靠股权资本融资——在 2025 10-K 或任何公开文件中，看不到债务、信贷额度或项目融资结构。公司于 July 1, 2024 在 Nasdaq（代码：ALMS）上市，以每股
              $16.00 发行 13.125 million 股。扣除 $16.7 million 承销折扣和其他发行费用后，IPO 净募资 $193.3 million。July 17, 2024，同步私募以同样 $16
              价格向 AyurMaya Capital Management 出售 2.5 million 股，募集和净到款均为 $40 million。IPO 前，Alumis 在 2024 年初 完成约 $259
              million C 轮融资，由 Foresite Capital 领投，Samsara BioCapital、venBio Partners、Lilly Asia Ventures、Cormorant Asset
              Management 等参投。公司此前由 Foresite Labs 孵化；IPO 时，Foresite Capital 持股约 33%。


              Q2 2025，Alumis 完成与 ACELYRIN, Inc.（原 Nasdaq: SLRN）的全股票合并；合并后，Alumis 股东约持有 55%，ACELYRIN 股东约持有 45%。合并实体保留
              Alumis 名称，并由原 Alumis 管理团队领导。截至 December 31, 2024，Alumis 持有约 $289 million 现金和有价证券，ACELYRIN 持有约 $448 million
              现金和有价证券；合并交割前，备考合并现金约 $737 million。


              January 9, 2026，Alumis 完成扩大发行规模的承销后续公开发行，以每股 $17.00 发行 20,297,500 股（包括承销商超额配售权全部行使）。扣除承销折扣后净募资 $324.4
              million。发行后备考流动性约为 $632.9 million，由 December 31, 2025 的 $308.5 million 现金和有价证券，加上 $324.4 million
              净募资构成。Morgan Stanley、Leerink Partners 和 Cantor 担任承销代表，Robert W. Baird 也参与承销。
