        - Phase 3 结果已被计入价格；deucravacitinib 设下低基准；相较生物制剂 IL-17/23 仍有差距
      - - 市场机会
        - 银屑病 2026 年规模 $21.78B，CAGR 8.6%；TYK2 细分市场以 15% CAGR 增至 2033 年 $7.4B
        - 生物制剂既有玩家主导处方集；口服细分市场历史上受支付方阻力约束
      - - 监管
        - NDA 计划 H2 2026 申报；FDA 通常支持样本量充分的 Phase 3 项目
        - FDA 完整回应函风险；若收到 CRL，单药公司风险暴露；SLE LUMUS 尚未经验证
      - - 竞争
        - 疗效优于 deucravacitinib；相对 zasocitinib 可能具备差异化
        - Takeda zasocitinib 也已完成 Phase 3，计划 2026 年向 FDA 申报；icotrokinra 口服 IL-23 已获批
      - - 财务
        - Q1 2026 现金 $569.5M；跑道至 2027 年末；2026 年 1 月以 $17/股融资 $345M
        - 2025 年净亏损 $243M；现金消耗约 $82M/季度；唯一收入来源是 Kaken；无产品销售
      - - 估值
