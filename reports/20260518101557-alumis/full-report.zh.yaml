      - number: '1.5'
        title: 里程碑与时间线
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一条从 Alumis 2021 年创立、延伸至 2026 年 1 月融资和同步 Phase 3 结果公告的里程碑时间线。 融资历史有新闻稿和 SEC 文件充分记录。2021 年 Series
              A（$70M）是公司仍名为 Esker Therapeutics 时的创始资本； 2022 年 Series B（$200M）支持 Phase 2 临床工作；2024 年 Series C（$259M）启动关键
              Phase 3 项目； 2024 年 6 月 IPO 则让公司以每股 $16.00 进入公开市场，尽管上市首日股价跌破发行价。


              2026 年 1 月 6 日正面 Phase 3 ONWARD 结果公告，是公司迄今最重要的临床里程碑；据 Pharmaphorum， 公告当天股价上涨约
              82%。不过，此后股价转为波动，尽管临床背景积极，仍在另一个交易日下跌约 18.51%； J&J 和 Takeda 的口服银屑病项目带来的竞争压力，促使分析师修正预期。截至 2026 年 5 月 15
              日，ALMS 报 $22.87， 52 周区间为 $2.76 至 $30.60，反映出尚未商业化、且接近 NDA 申报的生物科技公司常见的高二元风险和执行不确定性。


              公开记录中的不利里程碑包括：IPO 缩量（原计划 $274–315M，最终总额 $250M）、上市首日跌破 IPO 发行价，
              以及分析师因竞争审视加剧而下调目标价。可得来源中未识别出监管执法、产品召回或重大诉讼；但这种缺失应视作待尽调事项， 而不是确认的干净记录，因为商业化前生物科技公司可能存在尚未进入公开记录的 IP
              争议、雇佣事项或临床不良事件。
