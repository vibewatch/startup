      - number: '7.7'
        title: 缓释措施、监控指标和终止条件
        blocks:
          - type: paragraph
            body: >-
              Alumis 的主要风险缓释因素包括：ONWARD 3 期阳性结果为 NDA 提供强支撑；$570M 现金储备带来多年跑道；TYK2 类别已有 Sotyktu 监管先例，可避开 JAK 黑框警告。公司正在 NDA
              提交前为 API、药品和关键原材料搭建冗余供应链，这是 NDA CMC 申报的最佳实践。正在进行的 ONWARD3 长期延长期试验会为监管包补充安全性数据。精准数据分析平台和 GWAS 驱动的靶点选择，也为
              SLE 和“一粒药拓管线”策略提供银屑病之外的科学依据。

              三个投资逻辑失效触发点需要立即重新评估投资：（1）FDA 对 envu 银屑病 NDA 发出完整回复函（CRL）——无论指向疗效、安全性、CMC
              还是其他缺陷——都会击穿近期商业叙事，并在最糟糕的时点削弱融资能力；（2）ONWARD3 长期延长期出现 ONWARD1/2 中未见的重大严重不良事件信号，尤其是符合 JAK
              类不良事件（心血管、恶性肿瘤、血栓）特征的信号，可能触发临床暂停、标签限制或项目重估；（3）LUMUS SLE 2b 期失败会终结“一粒药拓管线”叙事，把商业可服务市场压缩到银屑病单一适应症，并让
              zasocitinib 每日一次给药优势带来的竞争压力更尖锐。

              关键监控指标包括：Q2–Q3 2026 FDA pre-NDA 会议结果和 CMC 反馈；LUMUS Q3 2026 顶线数据；医学会议上的 ONWARD3 长期延长期安全性更新；Takeda
              zasocitinib NDA 申报和 FDA 审评时间线；季度现金消耗相对资金余额；ACELYRIN 集体诉讼 MTD 裁定；Kaken
              合作里程碑付款安排。年度尽调应索取：经审计财务报表、供应链冗余确认、CDMO 审计状态、NDA 受理 / 拒绝受理函，以及临床团队留任数据。
