            title: 2024 年最大私营生物科技融资，显示投资者在逆风市场中仍有信心
            body: >-
              2024 年初完成 $259 million Series C——在当时是 2024 年规模最大的私营生物科技融资——而且发生在行业融资环境艰难时， 这是投资者相信 TYK2 抑制逻辑和 Martin
              Babler 领导力的强信号。随后完成的 IPO、后续增发和 Phase 3 验证， 拼出了一条资本与临床执行弧线；创立三年内能做到这一点的商业化前生物科技公司并不多。
