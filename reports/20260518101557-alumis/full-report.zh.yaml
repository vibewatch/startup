      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              口服 TYK2 抑制剂类别的核心增长驱动，是生物制剂级疗效与口服给药便利性的汇合。过去，中重度银屑病患者必须权衡： 口服 apremilast 便利，但 PASI 75 疗效约 30%；注射生物制剂则可让
              50–70% 患者达到 PASI 90。第二代 TYK2 抑制剂—— Sotyktu、envudeucitinib、zasocitinib——如今实现 75–80% 的 PASI 75 和 55–68% 的
              PASI 90， 正在填平过去推动生物制剂采用的疗效差距。这是结构性市场驱动，不是周期性因素。

              第二个驱动因素是 TYK2 的监管安全性画像。JAK 抑制剂（tofacitinib、baricitinib、upadacitinib）带有 FDA
              关于重大不良心血管事件、血栓和恶性肿瘤的黑框警告；与之不同，deucravacitinib 和下一代 TYK2 抑制剂尚未收到这一警告—— 尽管 Sotyktu 标签指出，TYK2 抑制是否可能共享 JAK
              风险仍不确定，这压低了处方热情。没有黑框警告是商业优势， 处方医生和支付方都可用来支持处方集定位。

              关键采用约束包括：（1）竞争拥挤——从 2027 年起，三款口服 TYK2 抑制剂（Sotyktu、zasocitinib、envudeucitinib） 加上 ICOTYDE（口服
              IL-23）将在斑块状银屑病中竞争，压缩定价权并推高返利要求；（2）长期安全性数据有限——Sotyktu LTE 只有三年随访，不足以支撑终身慢性病治疗；（3）支付方阶梯治疗规则要求先用更便宜药物治疗失败，才授权
              TYK2； （4）适应症特定监管风险——没有 TYK2 抑制剂获批用于 SLE，Alumis 的 SLE 市场机会完全取决于 2026 年 Q3 的 LUMUS Phase 2b
              读出；（5）成熟生物制剂的生物类似药竞争带来支付方节省，这些节省原本可能用于扩大新口服药准入。市场在增长， 但第三个进入者面对的商业准入环境，明显比 Sotyktu 2022 年上市时更难。
