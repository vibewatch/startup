      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Martin Babler 担任 Alumis 总裁、首席执行官兼董事长。他于 2021 年 9 月加入公司， 在所有重大融资事件和临床里程碑中都是公司的公开代表。Babler 拥有深厚的小分子免疫学运营经验：
              他曾任 Principia Biopharma 总裁兼 CEO，该公司于 2021 年被 Sanofi 以约 $3.7 billion 收购； 此前还在 Genentech 和 Eli Lilly
              担任高管。其在同一治疗领域从运营到并购退出的履历，是重要的投资者信号， 也解释了 Alumis 能够在 2024 年私营生物科技融资环境艰难时完成 $259 million Series C 融资。


              Jörn Drappa, MD, PhD 担任首席医学官，并出现在所有 Phase 3 结果公告中；公司对外披露中的主要技术声音来自他的科学评论。 John Schroer 担任首席财务官，主导了公司的 IPO
              和后续增发等资本市场活动。Roy Hardiman 担任首席商务与法务官。 Mark Bradley 担任首席开发官，负责包括 ONWARD 和 LUMUS 项目在内的临床运营。


              截至本次报告日期，Alumis 董事会包括：Martin Babler（董事长）；知名生命科学投资人 Srinivas Akkaraju； Foresite Capital 创始人兼 CEO Jim
              Tananbaum，显示 Foresite 仍在其孵化公司中保持董事会层面的参与； Alan Colowick、Sapna Srivastava、Zhengbin Yao（Zymeworks 总裁兼 CEO）以及
              Patrick Machado。 公司尚未公开披露 COO、具名继任计划或 Babler 的运营副手；对于一家处在关键监管节点前、尚未商业化的生物科技公司， 这造成了关键人集中风险。


              2021 年以 Esker Therapeutics 名义启动公司的原始创始团队，在当前可获得的公开来源中没有完整披露。 公司的公开叙事把创立归因于从 Foresite Labs 孵化而来，并由 Martin
              Babler 作为创始运营型 CEO 推动； 抓取来源中没有确认其他共同发明人或创始人的姓名。
