- id: mitigations-kill-criteria
  title: Mitigations, Monitoring, and Kill Criteria
  body: >-
    Alumis's primary risk mitigations include the positive ONWARD Phase 3 results providing strong NDA
    support, a $570M cash position providing multi-year runway, and the TYK2 class's established
    regulatory precedent via Sotyktu avoiding the JAK boxed warning. The company is implementing
    redundant supply chain for API, drug product, and critical raw materials prior to NDA submission,
    which is best practice for NDA CMC filing. The ongoing ONWARD3 long-term extension provides
    additional safety data for the regulatory package. The precision data analytics platform and
    GWAS-driven target selection provide scientific rationale for the SLE and pipeline-in-a-pill
    strategy beyond psoriasis.

    Three thesis-break triggers require immediate investment re-evaluation: (1) An FDA complete
    response letter (CRL) on the envu NDA in plaque psoriasis—whether citing efficacy, safety, CMC,
    or other deficiencies—would collapse the near-term commercial narrative and impair capital-raising
    ability at precisely the worst moment; (2) A material serious adverse event signal in ONWARD3
    long-term extension not present in ONWARD1/2—particularly a signal consistent with JAK-class
    adverse events (cardiovascular, malignancy, thrombosis)—would trigger a clinical hold, label
    restriction, or program reconsideration; (3) LUMUS Phase 2b failure in SLE would eliminate the
    pipeline-in-a-pill narrative, reducing the commercial addressable market to psoriasis only and
    making the competitive fight against zasocitinib's once-daily dosing advantage more acute.

    Key monitoring indicators: FDA pre-NDA meeting outcome and CMC feedback from Q2–Q3 2026; LUMUS
    topline Q3 2026; ONWARD3 long-term extension safety updates at medical meetings; Takeda zasocitinib
    NDA filing and FDA review timeline; quarterly cash burn versus treasury balance; ACELYRIN class
    action MTD ruling; Kaken collaboration milestone payment schedule. Annual diligence asks: audited
    financial statements, supply chain redundancy confirmation, CDMO audit status, NDA acceptance/
    refusal to file letter, and clinical team retention data.
  claimRefs:
  - CR036
  - CR037
  - CR038
  - CR039
  - CR040
