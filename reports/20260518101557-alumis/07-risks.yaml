- id: people-execution-risk
  title: People and Execution Risk
  body: >-
    CEO Martin Babler, appointed in September 2021 and serving as President, CEO, and Chairman of
    the Board, is the central architect of Alumis's late-stage development and IPO strategy. His prior
    experience leading Principia Biopharma through its $3.7 billion acquisition by Sanofi, combined
    with a background at Genentech and Eli Lilly, makes him a credible leader in the TYK2 and immuno-
    oncology investor community. His departure or incapacitation would disrupt investor confidence,
    disrupt the NDA process narrative, and risk key institutional relationships. Alumis's 10-K
    explicitly identifies dependence on its management team and key scientific personnel as a material
    risk, and the company has not publicly disclosed a formal succession plan.

    The depth of the clinical leadership team under CMO Dr. Jörn Drappa is critical to executing the
    NDA submission—a process that requires coordinated CMC, clinical, regulatory, and biostatistics
    expertise. The 10-K highlights the challenge of attracting and retaining qualified clinical,
    scientific, and operations personnel; in a competitive Bay Area biotech environment with multiple
    well-capitalized peers, turnover in the NDA team at a critical juncture (H2 2026 submission) would
    be highly disruptive. The merger integration of ACELYRIN adds organizational complexity, given that
    ACELYRIN's discontinued lead program (izokibep) may have created morale and retention issues within
    the combined workforce.

    Governance risk arose during the ACELYRIN merger process: Trium Capital, an ACELYRIN investor,
    publicly pressured ACELYRIN's board to reject the Alumis merger and instead pursue liquidation,
    arguing liquidation would yield higher returns to shareholders. While the boards of both companies
    recommended the merger—approved by shareholders on May 13, 2025—this episode reflects investor
    skepticism about the terms of the transaction and management allocation of capital. The governance
    concern is now embedded in Alumis's shareholder base post-merger and could surface in future proxy
    contests if execution falters.
