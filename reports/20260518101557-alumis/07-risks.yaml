- id: financial-risk
  title: Financial Risk
  body: >-
    Alumis is a clinical-stage company with no commercial revenue from products, an accumulated deficit
    of $901.9 million as of December 31, 2025, and net losses of $243.3 million in FY2025 and $294.2
    million in FY2024. The quarterly operating cash burn was $87 million in Q1 2026, consistent with
    late-stage clinical development costs. Management's stated belief that current cash—$570 million
    as of March 31, 2026, following a $324 million public offering in January 2026—funds operations
    for at least 12 months from March 2026 means that additional financing will likely be required
    before or shortly after the H2 2026 NDA filing. If the NDA is filed on schedule and approved
    within the standard 10-month review cycle, commercialization expenses will dramatically increase
    the burn rate precisely when the company needs to raise capital or negotiate a commercial partnership.

    Dilution risk is material and ongoing. The March 2026 $300 million ATM agreement with Cantor
    Fitzgerald supplements equity raises but at-the-market sales create continuous share dilution. Each
    successive capital raise—including the $324M offering in January 2026—dilutes early investors.
    Alumis also holds $51 million in acquired in-process R&D intangible assets tied to the lonigutamab
    program; following the decision to explore strategic alternatives for lonigutamab, a non-cash
    impairment charge is possible. Revenue concentration in Kaken Pharmaceutical means that any
    collaboration dispute would immediately eliminate all revenue while the company continues burning
    cash at $87M per quarter.

    The binary nature of the NDA outcome creates a financial cliff. A CRL from the FDA would trigger
    a significant decline in market capitalization, potentially impairing the ability to raise equity
    at reasonable terms and threatening the commercialization plan. Unlike commercial-stage biotechs,
    Alumis has no cash-generating products to buffer a setback. The IPO in June 2024 raised approximately
    $250 million; subsequent equity issuances have extended runway, but the company remains structurally
    dependent on favorable capital market conditions and a successful NDA outcome.
