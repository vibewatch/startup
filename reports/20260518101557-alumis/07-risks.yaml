  evidenceGaps:
  - id: lumus-sle-outcome-not-yet-public
    title: LUMUS Phase 2b SLE Trial Primary Endpoint Outcome Not Yet Available
    type: missing-source
    severity: blocking
    topic: clinical-risk
    missingEvidence: >-
      LUMUS Phase 2b topline results in SLE are expected Q3 2026 but not yet reported; the primary
      endpoint (e.g., SLEDAI-based response or SRI-4 at 48 weeks), patient population, and dosing
      arm outcomes are not publicly available.
    whyItMatters: >-
      LUMUS is the next binary event for Alumis's pipeline-in-a-pill narrative. A miss would narrow
      the commercial case to psoriasis only, compressing value and increasing competitive disadvantage
      against zasocitinib's once-daily regimen. The SLE opportunity materially affects any DCF
      valuation model built on the total addressable market.
    diligencePath: >-
      Monitor Alumis investor relations for Q3 2026 topline press release; track conference
      presentations at EULAR/ACR/SLE meetings for interim signals; review LUMUS trial design on
      ClinicalTrials.gov for primary endpoint definition and powering assumptions.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR002
  - id: cdmo-identities-not-disclosed
    title: Specific CDMO Partners for Envudeucitinib API Not Publicly Identified
    type: private-evidence-only
    severity: material
    topic: cdmo-supply-risk
    missingEvidence: >-
      Alumis's 10-K identifies principal API supplier geographies (India, Taiwan) but does not name
      the specific CDMOs. GMP compliance history, FDA inspection records, and quality audit outcomes
      for these unnamed manufacturers are not publicly available.
    whyItMatters: >-
      Without CDMO identities, the FDA warning letter history and GMP compliance status of envu's
      API manufacturers cannot be assessed. A CDMO with a recent warning letter or import alert
      would create a material NDA CMC risk that could trigger a CRL.
    diligencePath: >-
      Request CDMO identities in primary diligence; obtain FDA's Establishment Inspection Report (EIR)
      history for named CDMOs via FOIA; review CMC section of NDA pre-submission filings; confirm
      redundant supplier qualification timeline.
    relatedQuestionRefs:
    - QR011
    - QR020
    relatedTableRefs:
    - TR003
  - id: redundant-supply-chain-not-confirmed
    title: Redundant API Supply Chain Implementation Status Not Publicly Confirmed
    type: private-evidence-only
    severity: material
    topic: manufacturing-risk
    missingEvidence: >-
      Alumis's 10-K states that it is "in the process of implementing" redundant supply chain for envu
      API and drug product. The completion status, timeline, and qualification of the backup API
      supplier(s) are not publicly disclosed as of May 2026.
    whyItMatters: >-
      Until the redundant supply chain is qualified and validated, Alumis operates with single-source
      API risk. An NDA CMC package submitted with a single unqualified backup API source may receive
      FDA questions, increasing the probability of a CRL based on CMC deficiency.
    diligencePath: >-
      Request supply chain due diligence package from management; confirm backup API supplier
      qualification status and timeline; review CMC section of NDA pre-submission correspondence.
    relatedQuestionRefs:
    - QR020
    relatedTableRefs:
    - TR003
  - id: zasocitinib-head-to-head-data-not-available
    title: No Head-to-Head Efficacy or Safety Data Between Envudeucitinib and Zasocitinib
    type: missing-source
    severity: material
    topic: zasocitinib-competitive-risk
    missingEvidence: >-
      All efficacy comparisons between envudeucitinib and zasocitinib are cross-trial comparisons
      with different patient populations, time points (Week 16 for zasocitinib vs. Week 24 for envu
      PASI 90 primary presentation), and randomization approaches—making direct comparison unreliable.
    whyItMatters: >-
      Without head-to-head data, commercial payers and prescribers may rely on indirect comparisons
      that disadvantage envu due to the time-point difference. If zasocitinib achieves approval first,
      payers may require head-to-head data before granting formulary parity or preferential placement.
    diligencePath: >-
      Monitor Alumis and Takeda presentations at upcoming dermatology congresses for adjusted
      cross-trial analyses; assess FDA label language for each drug once approved; evaluate payer
      formulary access requirements and potential head-to-head trial designs.
    relatedQuestionRefs:
    - QR006
    - QR015
    relatedTableRefs: []
  - id: eu-ex-us-regulatory-pathway-not-assessed
    title: Ex-U.S. Regulatory Approval Pathways and Label Divergence Risks Not Publicly Available
    type: missing-source
    severity: material
    topic: regulatory-risk
    missingEvidence: >-
      Alumis's public disclosures focus on the U.S. FDA regulatory pathway for envudeucitinib. EU
      (EMA) and UK (MHRA) submission strategies, scientific advice outcomes, and potential label
      divergence risks are not publicly available as of May 2026. The regulatory risk register (TR001)
      therefore covers the primary U.S. pathway only; ex-U.S. regulatory risks remain uncharacterized,
      creating partial coverage.
    whyItMatters: >-
      If Alumis or its partners (Kaken in Japan) pursue EU or UK approvals, label differences (e.g.,
      stricter cardiovascular or malignancy warnings relative to FDA approval) could delay or limit
      the international commercial opportunity, and potential CHMP benefit-risk divergence from the
      FDA conclusion could affect Kaken collaboration economics and future partnership negotiations.
    diligencePath: >-
      Request EMA/MHRA filing strategy from management; review EU Sotyktu (deucravacitinib) CHMP
      assessment report as a TYK2 class precedent; assess Japan PMDA precedent via Kaken collaboration
      terms; evaluate risk of stricter ex-U.S. TYK2 class label requirements.
    relatedQuestionRefs:
    - QR029
    - QR030
    relatedTableRefs:
    - TR001
