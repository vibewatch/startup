callouts:
- calloutType: risk
  title: Thesis-Break Watch — Three Binary Events in 2026
  body: >-
    Three binary events in H2 2026 can individually break the Alumis investment thesis: (1) FDA CRL
    on the envu NDA filing (H2 2026 filing, ~10-month review); (2) LUMUS Phase 2b SLE topline failure
    (Q3 2026); (3) a serious adverse event signal in ONWARD3 LTE triggering a clinical hold or label
    restriction. Each event is operationally unmitigatable and would materially impair commercial value,
    capital-raise capacity, and the pipeline-in-a-pill narrative simultaneously.
  claimRefs:
  - CR001
  - CR012
  - CR014
  - CR036
  - CR037

- calloutType: risk
  title: Competitive Clock — Zasocitinib Once-Daily Dosing
  body: >-
    Takeda's zasocitinib is filing for FDA approval in its fiscal year 2026 with once-daily dosing, no
    food effect, and PASI 90 rates competitive with envu's Phase 3 data. Every month of NDA delay
    cedes more dermatologist relationships to zasocitinib as the leading next-generation oral TYK2
    inhibitor. The twice-daily envu regimen is a structural disadvantage in a primary care/dermatology
    market where adherence differentiates commercial success.
  claimRefs:
  - CR017
  - CR018
  - CR019
  - CR020

