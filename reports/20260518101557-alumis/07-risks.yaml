  data:
    columns:
    - Low Likelihood
    - Medium Likelihood
    - High Likelihood
    rows:
    - label: Critical
      values:
      - IP challenge / patent invalidation
      - FDA CRL on NDA; CDMO GMP failure during NDA CMC
      - SAE signal in ONWARD3 (long-term)
    - label: High
      values:
      - Envu uveitis-type off-indication failure
      - ACELYRIN litigation adverse judgment; API supply disruption from India/Taiwan
      - LUMUS SLE Phase 2b failure; Kaken collaboration dispute; zasocitinib FDA approval before envu
    - label: Moderate
      values:
      - ATM capital market access impairment
      - ACELYRIN merger integration attrition; Climb Bio litigation
