- id: clinical-operational-risk
  title: Clinical and Operational Risk
  body: >-
    Single-asset concentration is the defining operational risk at Alumis. Envudeucitinib represents
    the entirety of the near-term commercial pathway; all clinical, regulatory, and commercial execution
    depends on this single molecule. The company discontinued its Phase 2a envu trial in non-infectious
    uveitis in June 2024 when efficacy results did not meet its clinical threshold, demonstrating that
    TYK2 inhibition does not generalize to every indication. The SLE Phase 2b LUMUS trial—a 48-week
    study with topline data expected in Q3 2026—is the next high-stakes binary readout. Enrollment in
    LUMUS has been challenging because patients must have active disease at screening; the 10-K
    explicitly flags that longer clinical trials have heightened participant withdrawal risk.

    Manufacturing relies entirely on third-party CDMOs and contract manufacturers. Alumis has no
    manufacturing facilities, and API for envu is sourced principally from manufacturers in India and
    Taiwan. The company acknowledges in its 10-K that it does not yet have long-term supply arrangements
    in place and is still implementing a redundant supply chain for envu API, drug product, and critical
    raw materials. During this implementation period, a single-source API disruption—whether from
    geopolitical tensions, an FDA warning letter to a CDMO, a quality event, or force majeure—could
    halt clinical supply or delay NDA CMC documentation. Industry data from 2025-2026 shows FDA
    enforcement actions against contract manufacturers increased approximately 50% in 2025, and over
    40% of pharma companies reported supply chain disruptions due to geopolitical tensions.

    Long-term safety is an ongoing concern. Alumis's 10-K notes that as more patients are exposed to
    envu over longer periods in ONWARD3, additional SAEs and AEs will accumulate. Certain conditions
    are more frequent in psoriasis patients—obesity, cardiovascular disease, psoriatic arthritis,
    depression—creating confounding factors for attributability. Deucravacitinib's label, which serves
    as a regulatory precedent, includes warnings for rhabdomyolysis, a rare but severe adverse event
    that could surface in long-term extension data. The theoretical oncogenicity risk from prolonged
    immune modulation is monitored but unquantified at current trial durations.
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
