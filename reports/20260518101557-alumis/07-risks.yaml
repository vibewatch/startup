company:
  name: Alumis Inc.
chapter:
  number: 7
  title: Risks
  summary: >-
    Alumis faces a risk profile dominated by binary clinical/regulatory risk concentrated in a single
    asset—envudeucitinib (envu)—with an NDA submission planned for H2 2026 following positive ONWARD1/2
    Phase 3 results and a SLE Phase 2b topline readout (LUMUS) expected Q3 2026 that represents the
    next high-stakes binary event. The company carries an accumulated deficit of $901.9M, burns $87M per
    quarter, and has revenue concentrated 100% in a single Kaken Pharmaceutical collaboration; a cash
    position of $570M as of Q1 2026 (including a $324M public offering in January) provides runway into
    at least Q2 2027. Competitive pressure from Takeda's zasocitinib—which posted PASI 90 rates of
    61.3%/51.9% in Phase 3 at Week 16 versus envu's ~65% at Week 24 and plans a 2026 FDA filing with
    an advantaged once-daily dosing regimen—is the primary commercial risk if envu gains approval.
    Legal exposure includes the inherited ACELYRIN securities class action (motion to dismiss filed
    February 19, 2026) and a separate Climb Bio milestone-payment dispute. CDMO-dependent manufacturing
    with API sourced principally from India and Taiwan creates operational concentration risk while a
    redundant supply chain is being implemented. Thesis-break triggers: FDA complete response letter
    (CRL) on the envu NDA; a serious adverse event signal in ONWARD3 long-term extension; or LUMUS
    Phase 2b failure collapsing the SLE/pipeline-in-a-pill narrative.

sections:
- id: regulatory-legal-risk
  title: Regulatory and Legal Risk
  body: >-
    Alumis's primary regulatory risk is the FDA NDA review for envudeucitinib in plaque psoriasis,
    planned for submission in H2 2026. Although ONWARD1 and ONWARD2 met all primary and secondary
    endpoints with high statistical significance—74% PASI 75 and 59% sPGA 0/1 at Week 16, deepening
    to approximately 65% PASI 90 and over 40% PASI 100 by Week 24—NDA approval is not guaranteed.
    The FDA may issue a complete response letter (CRL) citing Chemistry, Manufacturing and Controls
    (CMC) deficiencies at CDMOs, request additional safety data from the ONWARD3 long-term extension,
    or require a Risk Evaluation and Mitigation Strategy (REMS) that constrains commercial uptake.
    The standard NDA review cycle is 10 months from filing; a Priority Review would compress this to
    6 months. Alumis's 10-K explicitly acknowledges that regulatory authorities may disagree with study
    design, interpretation of data, or impose additional requirements even after reviewing clinical
    trial design.

    The TYK2-class labeling question is partially resolved. Deucravacitinib (Sotyktu), the only approved
    TYK2 inhibitor, does not carry the JAK inhibitor boxed warning for major adverse cardiovascular
    events, cancer, thrombosis, and death that was mandated for tofacitinib, baricitinib, upadacitinib,
    and ruxolitinib. However, Sotyktu's label does include prominent warnings on infections, tuberculosis,
    malignancy, and hypersensitivity, and explicitly states that it is not known whether TYK2 inhibition
    may be associated with the observed or potential adverse reactions of JAK inhibition. For envu,
    this creates residual labeling uncertainty—the FDA may apply similar precautionary language that
    could affect prescriber adoption, particularly in cardiovascular-risk patient populations.

    Legal risk is elevated by two active matters. The ACELYRIN securities class action, filed on
    behalf of IPO investors alleging materially false and misleading statements about izokibep, was
    inherited through the May 21, 2025 ACELYRIN Merger. Defendants filed a motion to dismiss the
    second amended complaint on February 19, 2026; the litigation remains active. A separate lawsuit
    by Climb Bio against Alumis and ACELYRIN disputes a milestone payment obligation on the budoprutug
    asset. Neither matter has been resolved, and Alumis's Q1 2026 earnings commentary flagged this
    litigation as a source of management distraction and potential financial liability. IP risk is
    moderate: Alumis holds patents on envu's chemistry and process, and BMS Sotyktu's core compound
    patents expire November 7, 2033, meaning no authorized generic competition for the TYK2 class
    before that date in the U.S.
