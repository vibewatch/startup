callouts:
  - calloutType: risk
    title: "Icotyde's Approval Before ESK-001's Launch Sets a Higher Oral Efficacy Bar"
    body: >-
      Johnson and Johnson's icotyde (icotrokinra) received FDA approval in March 2026 and
      demonstrated head-to-head superiority over Sotyktu in Phase 3. With icotyde achieving
      approximately 70% IGA 0/1 and 55% PASI 90 at week 16 and already commercially available,
      ESK-001 launches into a more competitive oral landscape than existed when Alumis initiated
      its Phase 3 program. ESK-001's ~65% PASI 90 at week 24 is directionally competitive but
      uses a different timepoint and lacks head-to-head data, leaving relative oral positioning
      unresolved until real-world or comparative evidence is generated.
    claimRefs:
      - CP012
      - CP017
      - CP039

  - calloutType: strength
    title: "ESK-001's Maximal TYK2 Inhibition and Platform Breadth Differentiate Alumis"
    body: >-
      ESK-001's claim of maximal 24-hour TYK2 inhibition, combined with a clean Phase 2 and
      Phase 3 safety profile, positions it as a potential clinical step-up over Sotyktu pending
      head-to-head validation. The LUMUS SLE Phase 2b program and A-005 CNS pipeline convert
      Alumis from a single-product launch into a TYK2 platform company. If LUMUS reads
      positively in Q3 2026, ESK-001 could be the first TYK2 inhibitor approved for both
      psoriasis and SLE, substantially expanding differentiation from Sotyktu and zasocitinib,
      neither of which has disclosed SLE programs.
    claimRefs:
      - CP013
      - CP015
      - CP031
      - CP041
      - CP043

