company:
  name: Alumis Inc.
chapter:
  number: 3
  title: Competitors
  summary: >-
    Alumis's lead asset ESK-001 (envudeucitinib) enters the TYK2 inhibitor class behind BMS's
    Sotyktu (deucravacitinib, $246M in 2024 global net sales, PsA label expanded March 2026) and
    alongside Takeda's zasocitinib (Phase 3 LATITUDE: ~70% sPGA 0/1 at week 16, NDA planned
    FY2026), while J&J's icotyde (icotrokinra, oral IL-23, FDA approved March 2026 with
    demonstrated head-to-head superiority over Sotyktu) reshapes the competitive oral landscape.
    ESK-001's ONWARD Phase 3 met all primary and secondary endpoints (PASI 90 ~65%, PASI 100
    >40% at week 24) with NDA submission planned for 2H 2026; key competitive risks include
    icotyde's established oral market position, Takeda's deep commercial infrastructure behind
    zasocitinib, and BMS's $950/month direct-to-patient pricing precedent that compresses
    class-level launch economics before Alumis reaches market.

