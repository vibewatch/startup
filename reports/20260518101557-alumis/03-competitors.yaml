figures:
  - id: FP001
    title: Competitive Positioning Map — Oral Psoriasis and TYK2 Class (May 2026)
    type: quadrant
    layout: wide
    summary: >-
      Ordinal positioning of oral psoriasis competitors on TYK2 selectivity and safety profile
      (x-axis, 1–10) versus pivotal Phase 3 efficacy evidence proxied by best available PASI 90
      rate (y-axis, 1–10). Scores are evidence-based ordinal estimates; see approximationNotes.
    data:
      xAxis: "Selectivity / Safety Profile (1=low, 10=high)"
      yAxis: "Phase 3 Efficacy Evidence — PASI 90 Benchmark (1=low, 10=high)"
      points:
        - label: "ESK-001 (Alumis)"
          x: 9
          y: 8
        - label: "Sotyktu / Deucravacitinib (BMS)"
          x: 8
          y: 7
        - label: "Zasocitinib (Takeda)"
          x: 9
          y: 7
        - label: "Icotyde / Icotrokinra (J&J)"
          x: 8
          y: 8
        - label: "Rinvoq / Upadacitinib (AbbVie)"
          x: 4
          y: 8
        - label: "Otezla / Apremilast (Amgen)"
          x: 7
          y: 3
        - label: "Brepocitinib (Priovant)"
          x: 5
          y: 3
        - label: "Cosentyx / Secukinumab (Novartis)"
          x: 7
          y: 8
    approximationNotes: >-
      X-axis scores: TYK2 allosteric agents (ESK-001, Sotyktu, zasocitinib) score 8–9 for
      selectivity and absence of boxed warning; Icotyde scores 8 for safety (no boxed warning,
      IL-23 specific). Rinvoq scores 4 due to pan-JAK activity and required boxed warning.
      Otezla scores 7 for PDE4 selectivity despite lower efficacy. Brepocitinib scores 5 as
      dual TYK2/JAK1 with less selectivity. Cosentyx (biologic) scores 7 (highly targeted but
      injectable; included for biologic efficacy benchmarking). Y-axis scores proxy PASI 90
      from pivotal trials at each drug's primary timepoint; trials differ in design so
      comparisons are imprecise. Sotyktu is scored 7 vs icotyde's 8 reflecting commercial
      real-world uptake lag and head-to-head defeat. Biologic Cosentyx is scored 8 for
      well-established PASI 90 data.
    claimRefs:
      - CP001
      - CP007
      - CP013
      - CP017
      - CP022

