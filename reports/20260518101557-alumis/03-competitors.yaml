  - id: feature-pricing-gtm-comparison
    title: Feature, Pricing, and Go-to-Market Comparison
    body: >-
      ESK-001's differentiation from Sotyktu rests on its claim of maximal 24-hour TYK2
      inhibition with high selectivity. Alumis argues this allosteric binding profile achieves
      more complete suppression of IL-23, IL-12, and type-I interferon cytokine signaling than
      the approved 6 mg once-daily Sotyktu dose. Phase 2 open-label extension data at 52 weeks
      showed sustained PASI 90 of 61.3% and PASI 100 of 38.8% with no new safety signals—a
      durability dataset supporting the NDA application. ESK-001 outperformed apremilast at all
      PASI endpoints in ONWARD, providing a formulaic step-up claim over Otezla for payer and
      prescriber negotiations. No three-way head-to-head trial between ESK-001, zasocitinib, and
      icotyde exists; cross-trial comparisons remain the only available basis for relative
      positioning, with important limitations due to differences in patient populations,
      timepoints, and trial designs.

      Pricing in the oral psoriasis class is shifting toward access-oriented models. Sotyktu's
      prior US list price of approximately $6,828 per 30-day supply has been supplemented by
      BMS's direct-to-patient program at $950 per month for cash-pay patients starting January
      2026. Otezla lists at approximately $3,700 per 30-day supply. ESK-001 pricing has not
      been set; Alumis's NDA has not yet been filed. Launch pricing comparable to or above
      Sotyktu's historical list price should be expected, with heavy payer rebating and step-edit
      navigation as the primary access barriers until real-world data accumulate.

      Go-to-market capabilities differ substantially across competitors. Sotyktu benefits from
      three years of commercial real-world data and BMS's established dermatology field force.
      Zasocitinib will launch backed by Takeda's global immunology infrastructure built around
      its multi-billion-dollar Entyvio franchise. Icotyde benefits from J&J's fully built-out
      global dermatology and immunology commercial organization. ESK-001, as Alumis's first
      commercial product, requires substantial commercial build or a co-promotion partnership.
      Alumis completed its IPO on Nasdaq in June 2024 at $16 per share, raising approximately
      $250 million; shares traded in the $22–24 range in May 2026. Total capital raised stands
      at approximately $529 million across Series A ($70M), Series B ($200M), Series C ($259M),
      and the IPO, providing adequate runway to fund NDA preparation and launch readiness.
