  - id: oral-systemic-non-tyk2-alternatives
    title: "Oral Systemic Alternatives: JAK Inhibitors, PDE4, and Oral IL-23"
    body: >-
      Beyond TYK2 inhibitors, Alumis competes against a broadening oral systemic landscape.
      The most significant competitive event of 2026 is the FDA approval in March 2026 of
      Johnson and Johnson's icotyde (icotrokinra, formerly JNJ-2113), the first oral IL-23
      receptor antagonist peptide for moderate-to-severe plaque psoriasis in adults and
      adolescents aged 12 and older. The pivotal ICONIC program enrolled over 2,500 patients
      and demonstrated superiority over deucravacitinib in a head-to-head Phase 3 comparison,
      with approximately 70% of patients achieving IGA 0/1 and 55% achieving PASI 90 at week 16.
      Analysts predict icotyde could become the preferred oral option for psoriasis over Sotyktu
      and Otezla, setting a new efficacy benchmark that ESK-001 must match or surpass to justify
      a third oral entrant. ESK-001's ONWARD Phase 3 met all primary and secondary endpoints
      including outperformance of apremilast at every PASI benchmark; ESK-001 achieved PASI 90
      of approximately 65% and PASI 100 of over 40% at week 24. No head-to-head trial between
      ESK-001 and icotyde has been conducted, leaving relative oral positioning unresolved.

      JAK inhibitors form the largest adjacent oral immunology class. AbbVie's Rinvoq
      (upadacitinib) is approved for plaque psoriasis, psoriatic arthritis, atopic dermatitis,
      and multiple additional indications, posting approximately 32% year-over-year growth in
      prescription value as of Q1 2026. However, all pan-JAK agents—including Rinvoq, Xeljanz
      (tofacitinib), and Olumiant (baricitinib)—carry an FDA class boxed warning covering serious
      infections, malignancies, major adverse cardiovascular events, and thrombosis, a structural
      safety disadvantage relative to TYK2-selective and IL-23 targeted agents. Pfizer's Xeljanz
      has experienced prescription volume decline of approximately 21% in 2026 due to generic
      entry and safety-driven formulary restrictions.

      Amgen's Otezla (apremilast), the pioneering oral PDE4 inhibitor for psoriasis, maintains
      the largest installed oral base, with a global market projected at $2.14–2.8 billion in
      2025. Analyst surveys indicate Otezla is not meaningfully losing share to Sotyktu; growth
      from the TYK2 class appears to come primarily from biologic-treated patients rather than
      Otezla switchers. ESK-001's ONWARD trials used apremilast as an active comparator arm, and
      envudeucitinib outperformed apremilast at all efficacy endpoints, establishing a designed
      step-up displacement argument that positions ESK-001 as the preferred oral upgrade over
      Otezla for inadequate responders.
