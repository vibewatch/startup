sections:
  - id: tyk2-inhibitor-direct-competitors
    title: Direct TYK2 Inhibitor Competitors
    body: >-
      The TYK2 inhibitor class is Alumis's most immediate competitive arena, currently anchored
      by Bristol Myers Squibb's Sotyktu (deucravacitinib) and imminently contested by Takeda's
      zasocitinib. Sotyktu received FDA approval in September 2022 for moderate-to-severe plaque
      psoriasis as the first-in-class selective TYK2 inhibitor. Its allosteric mechanism—binding
      the JH2 pseudokinase regulatory domain rather than the ATP-binding site—confers selectivity
      over JAK1/2/3, distinguishing it from broader JAK inhibitors that carry a class boxed
      warning. Sotyktu posted global net sales of approximately $246 million in 2024, a 45%
      year-over-year increase. In March 2026, the FDA expanded Sotyktu's label to include active
      psoriatic arthritis based on data from the pivotal POETYK PsA-1 and PsA-2 Phase 3 trials,
      making it the first TYK2 inhibitor approved for PsA. BMS broadened patient access further
      by launching a direct-to-patient platform in January 2026 at $950 per 30-day supply—an 86%
      reduction from the prior US list price of approximately $6,828. Despite early commercial
      traction, analyst downgrades temper peak sales expectations: Leerink Partners lowered its
      2030 Sotyktu sales estimate to $832 million versus BMS's own guidance of over $4 billion,
      citing payer access friction and pricing pressure from emerging competitors.

      Takeda's zasocitinib (TAK-279, formerly NDI-034858) was acquired from Nimbus Therapeutics
      in December 2022 for $4 billion in upfront consideration, one of the largest single-asset
      immunology acquisitions in industry history. In Phase 3 LATITUDE trials in moderate-to-severe
      plaque psoriasis, approximately 70% of patients achieved sPGA 0/1 at week 16, with PASI 90
      exceeding 50%; more than 90% of responders maintained benefit through 60 weeks, demonstrating
      strong durability. Takeda targets an NDA submission to the FDA in fiscal year 2026.
      Zasocitinib is also in Phase 3 for psoriatic arthritis, with a long-term extension study
      (NCT07286058) estimated to complete in December 2029.

      The TYK2 class also carries notable competitive failures. Ventyx Biosciences' VTX958
      failed its Phase 2 SLE trial in April 2023 and was discontinued—forewarning the class-level
      SLE challenge Alumis is attempting to overcome in its LUMUS Phase 2b trial. Priovant
      Therapeutics' brepocitinib (PF-06700841), a dual TYK2/JAK1 inhibitor through a
      Pfizer-Roivant joint venture, failed to meet primary endpoints in a Phase IIb topical
      psoriasis study in 2023 and has been deprioritized for psoriasis in favor of dermatomyositis,
      uveitis, and lichen planopilaris. Both failures reinforce allosteric TYK2 selectivity as
      the required mechanistic profile for competitive differentiation in psoriasis.
