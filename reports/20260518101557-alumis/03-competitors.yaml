  evidenceGaps:
    - type: missing-source
      severity: material
      topic: "ESK-001 vs zasocitinib direct comparison"
      missingEvidence: >-
        A head-to-head clinical trial or published PK/PD comparison between ESK-001 and
        zasocitinib at matched timepoints with consistent endpoints.
      whyItMatters: >-
        Current cross-trial comparisons use different timepoints (week 24 for ESK-001 vs
        week 16 for zasocitinib) and different patient populations, making relative efficacy
        claims imprecise and leaving the competitive positioning uncertain for prescribers
        and payers.
      diligencePath: >-
        Request that Alumis disclose any comparative TYK2 occupancy or PK/PD data; monitor
        forthcoming publications from ONWARD long-term extension for any indirect comparison
        data; review real-world prescribing studies once both drugs are commercially available.
      relatedQuestionRefs: [QP011]

    - type: missing-source
      severity: material
      topic: "ESK-001 vs icotyde head-to-head efficacy"
      missingEvidence: >-
        A direct head-to-head clinical trial or network meta-analysis comparing envudeucitinib
        (ESK-001) and icotrokinra (icotyde) using consistent patient populations, timepoints,
        and endpoint definitions.
      whyItMatters: >-
        Icotyde is already approved with demonstrated Sotyktu superiority; without head-to-head
        data, ESK-001's positioning relative to the new oral standard is based solely on
        cross-trial PASI 90 rates measured at different timepoints, which is insufficient
        for formulary differentiation or prescriber preference justification.
      diligencePath: >-
        Monitor Alumis for any announcement of a comparative effectiveness study or network
        meta-analysis; review ONWARD long-term extension data for real-world cohort comparisons;
        track payer formulary tier decisions post-launch for market signal.
      relatedQuestionRefs: [QP012]

    - type: private-evidence-only
      severity: minor
      topic: "Alumis market capitalization as of May 2026"
      missingEvidence: >-
        Precise market capitalization calculation requires real-time share count and current
        trading price; share count from public float plus insider/institutional holdings is
        not fully disaggregated in available public disclosures.
      whyItMatters: >-
        Market capitalization is relevant for assessing Alumis's capital access relative to
        competitors and for valuation context in competitive positioning analysis.
      diligencePath: >-
        Access current ALMS share count from SEC 13D/13G filings or most recent 10-Q proxy
        statement; multiply by ALMS closing price on valuation date.
      relatedQuestionRefs: [QP020]

    - type: enumeration-incomplete
      severity: minor
      topic: "Early-stage TYK2 programs excluded from competitor table"
      missingEvidence: >-
        Pre-Phase 2 TYK2 inhibitor programs, topical TYK2 agents, and non-US programs from
        Chinese biotechs (multiple early-stage TYK2 programs identified by PatSnap analysis)
        are excluded from TP001 due to insufficient public efficacy data.
      whyItMatters: >-
        Long-term competitive landscape may include 5–10 additional TYK2 programs currently
        in Phase 1 or preclinical stage, which could enter Phase 3 by 2028–2030 and create
        additional competition at ESK-001's commercial maturity.
      diligencePath: >-
        Review ClinicalTrials.gov for all active TYK2 or similar kinase inhibitor trials;
        reference PatSnap competitive landscape reports for early-stage program tracking.
      relatedTableRefs: [TP001]

    - type: missing-source
      severity: material
      topic: "Net pricing and payer rebate data for TYK2 inhibitors"
      missingEvidence: >-
        Net prices after PBM rebates for Sotyktu, Rinvoq, and Otezla are not publicly
        disclosed; payer step-edit criteria for new TYK2 entrants are not yet established
        for zasocitinib or ESK-001.
      whyItMatters: >-
        Net pricing determines actual revenue and market access for Alumis post-NDA; the
        $950 DTP Sotyktu price and list prices are not representative of insurer-negotiated
        net prices, making commercial economics modeling highly uncertain.
      diligencePath: >-
        Request pharmacy benefit manager formulary tier positions from Alumis management
        diligence; review IQVIA net pricing data for Sotyktu; monitor specialty pharmacy
        contracting announcements at launch.
