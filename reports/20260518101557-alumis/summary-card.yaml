  headline: >
    Alumis enters 2026 as the best-in-class oral TYK2 inhibitor pre-NDA story with Phase 3 PASI 90 of ~65%, $569.5M cash
    runway, and a strong-buy analyst consensus implying ~60% upside; a buy at $3.16B market cap with medium confidence
    reflecting single-asset binary FDA risk.
