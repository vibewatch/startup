  topStrengths:
    - >-
      Class-leading Phase 3 efficacy: PASI 90 ~65% at Week 24 materially exceeds deucravacitinib's ~40% benchmark,
      approaching biologic-level skin clearance with oral convenience
    - >-
      $569.5M cash (Q1 2026) provides runway into late 2027, fully funding the FDA review period following H2 2026 NDA
      filing
    - >-
      Strong Wall Street conviction: analyst consensus Strong Buy at ~$40 average target (range $25–$55) implies ~60%
      upside from current ~$24.86
    - >-
      Multi-indication TYK2 platform: psoriasis NDA H2 2026 plus SLE Phase 2b LUMUS readout Q3 2026, creating two
      near-term binary catalysts
    - >-
      Clean Phase 3 safety profile with no new class-effect signals; differentiated vs. JAK inhibitor class which
      carries black-box warnings
  topRisks:
    - >-
      Single-asset binary FDA risk: an NDA complete response letter could reset market cap to $0.9–$1.5B (50–70%
      decline); ~15% probability based on Phase 3 data quality
    - >-
      Short interest ~15.5% of float (13.5 days to cover) signals substantial institutional skepticism about commercial
      execution and valuation
    - >-
      Competitive timing risk: Takeda zasocitinib also Phase 3-complete with 2026 NDA plan; first-mover advantage
      uncertain and icotrokinra oral IL-23 already approved
    - >-
      Commercial execution overhang: deucravacitinib significantly underperformed revenue forecasts due to formulary
      restrictions; Alumis faces same biologic-incumbent payer dynamics
    - >-
      SLE LUMUS Phase 2b miss (Q3 2026) would collapse the multi-indication pipeline thesis and reset valuation toward a
      single-indication range
  unresolvedGaps:
    - >-
      NDA package completeness: CMC section readiness, long-term extension data availability, and pediatric study waiver
      status have not been publicly confirmed ahead of H2 2026 filing
    - >-
      Commercial payer and formulary access strategy: no public disclosure of step-edit requirements, PBM tier
      negotiations, or net pricing strategy relative to deucravacitinib
    - >-
      Zasocitinib competitive timeline: Takeda has not confirmed precise NDA submission date; if Takeda receives PDUFA
      before Alumis, first-mover commercial advantage shifts
