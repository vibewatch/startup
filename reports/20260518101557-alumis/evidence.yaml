evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Complete Alumis cap table showing ownership percentages, board voting rights, preferred stock terms, anti-dilution
      provisions, and liquidation preferences for Series A, B, and C pre-IPO investors.
    whyItMatters: >-
      Without cap table details it is impossible to assess governance concentration, the economic impact of future
      dilution, or any preferred liquidation waterfall that might affect common shareholders in an M&A or insolvency
      scenario.
    diligencePath: >-
      Request cap table and shareholder agreement from management; review SEC Schedule 13D/13G filings for reportable
      5%+ holders; review S-1 registration statement risk factors for preference stock disclosures.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: company-identity
    missingEvidence: >-
      Public confirmation of the original founding team composition for Alumis when it operated as Esker Therapeutics in
      2021, including whether co-founders beyond Martin Babler are credited.
    whyItMatters: >-
      Key-person analysis and founder-market fit assessment depend on knowing who originated the scientific and
      commercial vision; if additional co-founders exist, their departure or continued involvement is material for
      diligence.
    diligencePath: >-
      Review original 2021 Esker Therapeutics / Alumis launch press release on BusinessWire or GlobeNewswire; check the
      Alumis S-1 prospectus "Our History" section for named founders; review LinkedIn profiles of known executives.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: >-
      Public disclosure of Alumis employee headcount, hiring plans, and functional coverage (especially commercial and
      regulatory affairs build-out ahead of NDA).
    whyItMatters: >-
      A pre-commercial biotech approaching NDA submission typically begins building a commercial organization; the
      absence of disclosed headcount makes it impossible to assess operational readiness and launch execution capacity.
    diligencePath: >-
      Review 10-K FY2025 "Human Capital" section for headcount disclosure; review LinkedIn for approximate hiring
      signals; request management presentation on commercial build.
    relatedQuestionRefs:
      - QO014
  - type: private-evidence-only
    severity: minor
    topic: adverse
    missingEvidence: >-
      Confirmation that no material litigation, employment disputes, IP infringement claims, regulatory enforcement, or
      clinical adverse events of significance exist beyond what is visible in public filings.
    whyItMatters: >-
      Pre-commercial biotechs can carry undisclosed litigation or regulatory risk not fully visible in public documents;
      confirmation of a clean record requires access to the S-1 risk factor disclosures and management representations.
    diligencePath: >-
      Review the Alumis S-1 and 10-K risk factors for disclosed litigation; conduct PACER and patent litigation
      searches; engage legal diligence team for review of any pending IP disputes.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: minor
    topic: milestone-completeness
    missingEvidence: >-
      Complete milestone history for Alumis including patent portfolio composition and expected exclusivity window for
      envudeucitinib, Series A and Series B lead investor identities, A-005 Phase 1 initiation date, lonigutamab
      development timeline, and any partnership or licensing milestone not yet publicly disclosed.
    whyItMatters: >-
      The milestone table captures all confirmed financing and clinical events but cannot enumerate partnership, IP, and
      governance milestones from available public sources; without IP exclusivity data it is impossible to assess
      commercial duration of the envudeucitinib franchise.
    diligencePath: >-
      Review the Alumis S-1 "Our History" and "Intellectual Property" sections; review Orange Book and patent office
      filings for envudeucitinib composition-of-matter and method patents; request management Q&A on patent life and
      exclusivity strategy.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: Sotyktu FY2025 revenue
    missingEvidence: >-
      BMS's precise FY2025 Sotyktu net revenue figure; the BusinessWire press release redirected to the IR website
      without disclosing product-level data directly.
    whyItMatters: >-
      Sotyktu's actual sales trajectory is the key commercial benchmark for any second TYK2 entrant; underperformance
      could signal market access barriers that will affect envudeucitinib.
    diligencePath: >-
      Access BMS's 2025 Form 10-K (filed Q1 2026) from SEC EDGAR for product-level revenue disclosures and SG&A
      investment in Sotyktu.
    relatedQuestionRefs:
      - QM005
  - type: missing-source
    severity: material
    topic: payer reimbursement TYK2
    missingEvidence: >-
      Current Express Scripts / CVS Caremark / OptumRx formulary tier status for Sotyktu; prior authorization criteria
      document for oral TYK2 inhibitors in commercial plans.
    whyItMatters: >-
      Formulary tier and step-therapy requirements are the primary determinants of real-world oral TYK2 adoption and
      rebate pressure on new entrants.
    diligencePath: >-
      Review each major PBM's formulary lookup tool (publicly available for consumer-facing searches) and the NPF
      medication access tracker for Sotyktu coverage data.
    relatedQuestionRefs:
      - QM021
  - type: missing-source
    severity: material
    topic: zasocitinib vs Sotyktu head-to-head
    missingEvidence: >-
      Results from the head-to-head zasocitinib-versus-Sotyktu trial (NCT06973291); current data only show each drug vs
      placebo or apremilast.
    whyItMatters: >-
      Head-to-head TYK2 comparative data will directly influence prescriber choice between zasocitinib and
      envudeucitinib and set competitive differentiation benchmarks.
    diligencePath: Monitor ClinicalTrials.gov NCT06973291 for completion date and publications; expected readout 2026–2027.
    relatedQuestionRefs:
      - QM018
  - type: private-evidence-only
    severity: minor
    topic: SLE market TYK2 opportunity sizing
    missingEvidence: >-
      Analyst sizing of the oral TYK2 addressable SLE sub-market specifically; available SLE TAM ($3.7B) includes all
      drug classes, not oral TYK2.
    whyItMatters: >-
      The oral TYK2 SAM within SLE cannot be sized without knowing what share of the SLE market is oral-therapy
      accessible and what Alumis LUMUS data would unlock.
    diligencePath: >-
      Cross-reference SLE patient prevalence data with existing Benlysta/anifrolumab penetration as a proxy for
      biologic-eligible patient share; review Alumis LUMUS protocol for eligible patient population.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: ESK-001 vs zasocitinib direct comparison
    missingEvidence: >-
      A head-to-head clinical trial or published PK/PD comparison between ESK-001 and zasocitinib at matched timepoints
      with consistent endpoints.
    whyItMatters: >-
      Current cross-trial comparisons use different timepoints (week 24 for ESK-001 vs week 16 for zasocitinib) and
      different patient populations, making relative efficacy claims imprecise and leaving the competitive positioning
      uncertain for prescribers and payers.
    diligencePath: >-
      Request that Alumis disclose any comparative TYK2 occupancy or PK/PD data; monitor forthcoming publications from
      ONWARD long-term extension for any indirect comparison data; review real-world prescribing studies once both drugs
      are commercially available.
    relatedQuestionRefs:
      - QP011
  - type: missing-source
    severity: material
    topic: ESK-001 vs icotyde head-to-head efficacy
    missingEvidence: >-
      A direct head-to-head clinical trial or network meta-analysis comparing envudeucitinib (ESK-001) and icotrokinra
      (icotyde) using consistent patient populations, timepoints, and endpoint definitions.
    whyItMatters: >-
      Icotyde is already approved with demonstrated Sotyktu superiority; without head-to-head data, ESK-001's
      positioning relative to the new oral standard is based solely on cross-trial PASI 90 rates measured at different
      timepoints, which is insufficient for formulary differentiation or prescriber preference justification.
    diligencePath: >-
      Monitor Alumis for any announcement of a comparative effectiveness study or network meta-analysis; review ONWARD
      long-term extension data for real-world cohort comparisons; track payer formulary tier decisions post-launch for
      market signal.
    relatedQuestionRefs:
      - QP012
  - type: private-evidence-only
    severity: minor
    topic: Alumis market capitalization as of May 2026
    missingEvidence: >-
      Precise market capitalization calculation requires real-time share count and current trading price; share count
      from public float plus insider/institutional holdings is not fully disaggregated in available public disclosures.
    whyItMatters: >-
      Market capitalization is relevant for assessing Alumis's capital access relative to competitors and for valuation
      context in competitive positioning analysis.
    diligencePath: >-
      Access current ALMS share count from SEC 13D/13G filings or most recent 10-Q proxy statement; multiply by ALMS
      closing price on valuation date.
    relatedQuestionRefs:
      - QP020
  - type: enumeration-incomplete
    severity: minor
    topic: Early-stage TYK2 programs excluded from competitor table
    missingEvidence: >-
      Pre-Phase 2 TYK2 inhibitor programs, topical TYK2 agents, and non-US programs from Chinese biotechs (multiple
      early-stage TYK2 programs identified by PatSnap analysis) are excluded from TP001 due to insufficient public
      efficacy data.
    whyItMatters: >-
      Long-term competitive landscape may include 5–10 additional TYK2 programs currently in Phase 1 or preclinical
      stage, which could enter Phase 3 by 2028–2030 and create additional competition at ESK-001's commercial maturity.
    diligencePath: >-
      Review ClinicalTrials.gov for all active TYK2 or similar kinase inhibitor trials; reference PatSnap competitive
      landscape reports for early-stage program tracking.
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: Net pricing and payer rebate data for TYK2 inhibitors
    missingEvidence: >-
      Net prices after PBM rebates for Sotyktu, Rinvoq, and Otezla are not publicly disclosed; payer step-edit criteria
      for new TYK2 entrants are not yet established for zasocitinib or ESK-001.
    whyItMatters: >-
      Net pricing determines actual revenue and market access for Alumis post-NDA; the $950 DTP Sotyktu price and list
      prices are not representative of insurer-negotiated net prices, making commercial economics modeling highly
      uncertain.
    diligencePath: >-
      Request pharmacy benefit manager formulary tier positions from Alumis management diligence; review IQVIA net
      pricing data for Sotyktu; monitor specialty pharmacy contracting announcements at launch.
  - type: private-evidence-only
    severity: blocking
    topic: commercialization-capital-plan
    missingEvidence: >-
