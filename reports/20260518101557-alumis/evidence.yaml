      hiring, manufacturing scale-up, payer contracting, and market access beyond the Q4 2027 runway end.
    whyItMatters: >-
      Without a commercial build-out capital estimate, investors cannot determine whether Alumis will require one or
      multiple additional dilutive equity raises before achieving sustainable product revenue—a critical factor in
      valuation underwriting.
    diligencePath: >-
      Request management's commercial readiness plan and capital expenditure forecast during due diligence; compare
      against peer pre-launch spending from Dermira, Immunomedics, and other dermatology-focused late-stage biotech
      companies at comparable stages.
