  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Alumis's public milestone record runs from its 2021 founding through the January 2026 Phase 3
      results and capital raise. The financing ramp has been continuous, with the company raising
      capital approximately every 1.5–2 years from Series A through its Nasdaq listing and follow-on.
    data:
      items:
        - date: '2021'
          label: Founded as Esker Therapeutics; Series A ~$70M
          detail: >-
            Foresite Labs incubation; Series A financing funds Phase 1 and early discovery;
            company initially operates as Esker Therapeutics.
          tone: positive
          claimRefs:
            - CO002
            - CO019
        - date: '2022'
          label: Series B $200M; company known as Alumis
          detail: >-
            $200M Series B funds Phase 2 STRIDE psoriasis trial and mid-phase SLE/uveitis studies;
            Alumis brand in use.
          tone: positive
          claimRefs:
            - CO020
        - date: '2024-03'
          label: Series C $259M — largest private biotech round of 2024
          detail: >-
            Co-led by Foresite Capital, Samsara BioCapital, venBio Partners; funds Phase 3 ONWARD
            and Phase 2b LUMUS programs.
          tone: positive
          claimRefs:
            - CO021
            - CO022
        - date: '2024-06-28'
          label: IPO on Nasdaq (ALMS) at $16/share; $250M gross
          detail: >-
            IPO downsized from planned $274–315M; priced at range low; stock fell below $16 on
            first day of trading — signal of muted initial reception.
          tone: neutral
          claimRefs:
            - CO023
            - CO025
            - CO046
        - date: '2025-07-24'
          label: LUMUS Phase 2b enrollment complete (408 patients)
          detail: >-
            SLE trial enrollment completed; topline data expected Q3 2026.
          tone: positive
          claimRefs:
            - CO037
        - date: '2026-01-06'
          label: Phase 3 ONWARD1/ONWARD2 — all endpoints met; ~65% PASI 90 at Wk 24
          detail: >-
            Most significant clinical milestone; stock surges ~82% on announcement day; NDA
            submission planned for H2 2026.
          tone: positive
          claimRefs:
            - CO031
            - CO033
            - CO036
        - date: '2026-01-09'
          label: Follow-on offering closes; $345.1M raised at $17/share
          detail: >-
            Upsized public offering fully funds NDA prep and runway into late 2027.
          tone: positive
          claimRefs:
            - CO026
            - CO027
        - date: '2026 Q3 (expected)'
          label: SLE Phase 2b LUMUS topline data expected
          detail: >-
            Binary event; positive data would validate pipeline-in-a-pill thesis and expand
            commercial opportunity.
          tone: neutral
          claimRefs:
            - CO037
        - date: '2026 H2 (planned)'
          label: NDA submission to FDA for envudeucitinib in psoriasis planned
          detail: >-
            Standard PDUFA review ~10 months; potential approval could follow in 2027.
          tone: positive
          claimRefs:
            - CO036
        - date: '2026-05-18'
          label: Key-person concentration — Babler as sole named CEO with no public successor plan
          detail: >-
            No public disclosure of COO or succession plan; represents an open governance diligence
            item at a critical pre-commercial juncture.
          tone: negative
          claimRefs:
            - CO045
    approximationNotes: >-
      Series A and Series B dates and amounts are from industry press reports (FierceBiotech,
      BioSpace) and may not precisely match internal company records. The Series B lead investor
      is not confirmed. IPO first-day trading details are from the Benzinga IPO coverage.
    claimRefs:
      - CO002
      - CO019
      - CO020
      - CO021
      - CO023
      - CO025
      - CO026
      - CO031
      - CO036
      - CO037
      - CO045
  - id: FO002
    title: Company snapshot logic
    type: flow
    layout: standard
    summary: >-
      Alumis's operating logic flows from its precision platform and pipeline through clinical
      development to a prospective NDA/commercialization path, with capital markets and key-person
      governance as binding dependencies.
    data:
      nodes:
        - id: platform
          label: Precision data analytics platform
          detail: >-
            Proprietary genomic and data analytics capability identifies targets across ~20
            immune-mediated conditions; drives pipeline selection.
          tone: positive
        - id: envudeucitinib
          label: Envudeucitinib (lead TYK2 inhibitor)
          detail: >-
            Oral, allosteric TYK2 inhibitor; Phase 3 ONWARD completed (psoriasis); Phase 2b LUMUS
            ongoing (SLE); NDA planned H2 2026.
          tone: positive
        - id: other-pipeline
          label: A-005 / Lonigutamab / Preclinical programs
          detail: >-
            A-005: CNS TYK2 for neuroinflammation (Phase 1); Lonigutamab: anti-IGF-1R for thyroid
            eye disease; multiple preclinical programs.
          tone: positive
        - id: capital
          label: Capital base ($650M+ post Jan 2026 offering)
          detail: >-
            Runway into late 2027; funds NDA filing, launch readiness, and SLE Phase 2b completion.
          tone: positive
        - id: competition
          label: Competitive pressure (Sotyktu, zasocitinib, icotrokinra)
          detail: >-
            BMS Sotyktu (first TYK2, approved 2022), Takeda zasocitinib (once-daily TYK2, Phase 3),
            J&J icotrokinra (approved oral IL-23); analyst price target cuts reflect competition.
          tone: negative
        - id: regulatory
          label: FDA NDA pathway (H2 2026 planned)
          detail: >-
            NDA not yet filed; FDA review expected ~10 months post-filing; conditional on NDA
            acceptance; commercial launch contingent on approval.
          tone: neutral
        - id: commercialization
          label: Commercial launch (prospective; post-approval)
          detail: >-
            No commercial infrastructure yet disclosed; launch readiness planning expected to
            begin post-NDA filing; competitive market entry risk high.
          tone: neutral
      edges:
        - from: platform
          to: envudeucitinib
          label: Target identification and candidate optimization
        - from: platform
          to: other-pipeline
          label: Multi-target discovery and prioritization
        - from: capital
          to: envudeucitinib
          label: R&D funding for NDA preparation and launch readiness
        - from: envudeucitinib
          to: regulatory
          label: NDA submission planned H2 2026
        - from: regulatory
          to: commercialization
          label: Conditional on FDA approval (~10-month review)
        - from: competition
          to: commercialization
          label: Intensifying pressure on pricing and market share assumptions
    claimRefs:
      - CO008
      - CO010
      - CO036
      - CO038
      - CO039
      - CO040
      - CO041
  - id: FO003
    title: Snapshot KPIs
    type: kpi
    layout: standard
    summary: >-
      Key financial and clinical metrics summarizing Alumis's maturity, capital position,
      lead-asset efficacy, and risk profile as of the run date.
    data:
      items:
        - label: Total capital raised (est.)
          value: ~$1.12B
          detail: Across Series A–C, IPO, and January 2026 follow-on offering
          claimRefs:
            - CO029
        - label: Cash runway
          value: Into late 2027
          detail: Management guidance post-January 2026 follow-on ($650M+ liquidity)
          claimRefs:
            - CO027
            - CO028
        - label: Market cap (May 15, 2026)
          value: ~$2.9B
          detail: Based on $22.87 closing price on Nasdaq
          claimRefs:
            - CO043
        - label: Phase 3 PASI 90 (Wk 24)
          value: ~65%
          detail: Average across ONWARD1 and ONWARD2; vs ~40% for Sotyktu
          claimRefs:
            - CO033
        - label: Phase 3 PASI 100 (Wk 24)
          value: ">40%"
          detail: Complete skin clearance; average across ONWARD1 and ONWARD2
          claimRefs:
            - CO033
        - label: SLE trial enrollment
          value: 408 patients
          detail: LUMUS Phase 2b; topline readout expected Q3 2026
          claimRefs:
            - CO037
        - label: 52-week ALMS stock range
          value: $2.76–$30.60
          detail: High volatility reflecting binary clinical and commercial risk profile
          claimRefs:
            - CO042
            - CO043
        - label: Q3 2025 net loss
          value: -$110.8M
          detail: Quarterly pre-commercial R&D burn; no product revenue
          claimRefs:
            - CO030
    claimRefs:
