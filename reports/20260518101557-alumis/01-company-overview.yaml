  - id: pipeline-overview-and-product-strategy
    title: Pipeline overview and product strategy
    body: >-
      Alumis's most advanced product candidate, envudeucitinib, is an oral, highly selective,
      allosteric inhibitor of TYK2 designed to deliver maximal 24-hour TYK2 inhibition while
      minimizing off-target binding. The compound was evaluated in the pivotal Phase 3 ONWARD1
      and ONWARD2 trials in adults with moderate-to-severe plaque psoriasis; positive topline
      results were announced on January 6, 2026. In the trials, envudeucitinib met all primary
      and secondary endpoints with high statistical significance versus placebo. At Week 16, 74%
      of patients on average achieved PASI 75 and 59% achieved sPGA 0/1. At Week 24, approximately
      65% achieved PASI 90 and more than 40% achieved PASI 100 (complete skin clearance). The
      drug was also superior to the active comparator apremilast across all PASI endpoints at
      Week 24 (p<0.0001). No new safety signals were identified; common adverse events were
      headache, nasopharyngitis, upper respiratory tract infections, and acne.


      The company plans to submit an NDA to the U.S. FDA for envudeucitinib in plaque psoriasis
      in the second half of 2026. ONWARD3, a long-term extension study assessing durability of
      response and long-term safety, is ongoing. In SLE, the global Phase 2b LUMUS trial
      completed enrollment of 408 patients in July 2025; topline data are expected in Q3 2026.
      The trial is a randomized, double-blind, placebo-controlled study with BICLA response rate
      at Week 48 as the primary endpoint.


      Beyond the lead program, Alumis is developing A-005, a CNS-penetrant allosteric TYK2
      inhibitor for neuroinflammatory and neurodegenerative diseases, currently in Phase 1
      clinical development. The third pipeline asset, lonigutamab, is a subcutaneous anti-IGF-1R
      biologic for thyroid eye disease. The company's precision data analytics platform has also
      identified additional preclinical programs across undisclosed immune-mediated disease targets.
      The competitive landscape for envudeucitinib includes BMS Sotyktu (deucravacitinib, approved
      2022, PASI 90 ~40% at 24 weeks), Takeda zasocitinib (once-daily TYK2, Phase 3), and J&J's
      approved oral IL-23 inhibitor icotrokinra—the last of which H.C. Wainwright cited as holding
      the strongest commercial position in 2026, leading the firm to cut its ALMS price target
      from $40 to $25.
