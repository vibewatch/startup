company:
  name: Alumis Inc.
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Alumis Inc. (Nasdaq: ALMS) is a late-stage biopharmaceutical company headquartered in South
    San Francisco, California, developing oral precision therapies for immune-mediated diseases.
    Founded in 2021 and incubated by Foresite Labs, the company raised approximately $1.12 billion
    in aggregate capital through a Series A (~$70M), Series B ($200M), Series C ($259M), its June
    2024 IPO ($250M gross), and a January 2026 follow-on offering ($345.1M). Its lead candidate,
    envudeucitinib (formerly ESK-001), an oral, highly selective, allosteric TYK2 inhibitor, met
    all primary and secondary endpoints in the Phase 3 ONWARD1 and ONWARD2 psoriasis trials
    (results announced January 6, 2026), and an NDA submission to the FDA is planned for the
    second half of 2026. Phase 2b data for systemic lupus erythematosus (SLE) are expected in
    Q3 2026. The company is pre-revenue, reported a Q3 2025 net loss of $110.8 million, and held
    a cash position exceeding $650 million following the January 2026 offering.
sections:
  - id: identity-headquarters-and-business-model
    title: Identity, headquarters, and business model
    body: >-
      Alumis Inc. is a late-stage biopharmaceutical company incorporated in Delaware and
      headquartered at 280 East Grand Avenue, South San Francisco, California 94080. The company's
      mailing and business address registered with the SEC is confirmed by EDGAR filings under
      CIK 0001847367. Alumis describes itself as developing oral therapies using a precision
      approach to optimize clinical outcomes and significantly improve the lives of patients with
      immune-mediated diseases. The company is listed on the Nasdaq Global Select Market under
      the ticker symbol ALMS, having commenced trading on June 28, 2024.


      The company was founded in 2021, having emerged from Foresite Labs, the incubation arm of
      Foresite Capital. Multiple industry sources confirm that Alumis previously operated under
      the name Esker Therapeutics before rebranding. The company's core business model is
      clinical-stage drug development with no approved products and no product revenue as of the
      run date. All operations are financed through equity capital raises, with the company
      reporting a trailing-twelve-month loss of $1.78 per share as of May 2026.


      Alumis's commercial thesis rests on developing next-generation, oral small-molecule
      therapies that can challenge injectable biologics on efficacy while offering the convenience
      of oral dosing. The company's proprietary precision data analytics platform is used to
      identify and advance programs across a range of immune-mediated diseases. In addition to its
      TYK2 inhibitor programs, Alumis has expanded its pipeline to include lonigutamab, a
      subcutaneously delivered anti-IGF-1R biologic for thyroid eye disease, demonstrating a
      multi-target approach to immune-mediated disease. The company describes its strategy as
      building a "pipeline-in-a-pill," seeking to leverage maximal TYK2 inhibition across the
      IL-23, IL-17, and type I interferon pathways that drive roughly 20 immune-mediated
      conditions according to the company's genomic analyses.
