      - CO027
      - CO028
      - CO030
      - CO033
      - CO037
      - CO042
      - CO043
callouts:
  - calloutType: strength
    title: Phase 3 efficacy results rank among the strongest reported for an oral psoriasis therapy
    body: >-
      The Phase 3 ONWARD1 and ONWARD2 trials met all primary and secondary endpoints with high
      statistical significance. The ~65% PASI 90 and >40% PASI 100 response rates at Week 24
      substantially exceed the ~40% PASI 90 and ~15% PASI 100 rates reported by BMS Sotyktu,
      the only currently approved TYK2 inhibitor for psoriasis. This efficacy profile could
      command a meaningful market share premium over Sotyktu if commercialized successfully.
    claimRefs:
      - CO031
      - CO033
      - CO040
  - calloutType: risk
    title: Pre-commercial, pre-revenue biotech with key-person concentration and intense competition
    body: >-
      Alumis has no approved products, no product revenue, and a single CEO (Martin Babler) without
      a publicly disclosed successor. The competitive landscape has intensified with J&J's approved
      oral IL-23 inhibitor icotrokinra and Takeda's once-daily TYK2 zasocitinib; analysts have
      already cut price targets citing pricing pressure. The company's entire commercial value
      depends on successfully filing, defending, and launching envudeucitinib in an increasingly
      crowded market before its cash runway expires.
    claimRefs:
      - CO040
      - CO041
      - CO045
  - calloutType: insight
    title: Largest 2024 private biotech fundraise reflects investor conviction despite market headwinds
    body: >-
      Closing a $259 million Series C in early 2024—the largest private biotech raise of 2024 at
      the time—during a challenging funding environment for the sector is a strong signal of
      investor conviction in both the TYK2 inhibition thesis and Martin Babler's leadership. The
      subsequent IPO, follow-on offering, and Phase 3 validation complete a capital and clinical
      execution arc that few pre-commercial biotechs achieve within three years of founding.
    claimRefs:
      - CO021
      - CO022
      - CO029
