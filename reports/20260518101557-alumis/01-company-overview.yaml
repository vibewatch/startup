  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: >-
        Complete Alumis cap table showing ownership percentages, board voting rights, preferred
        stock terms, anti-dilution provisions, and liquidation preferences for Series A, B, and C
        pre-IPO investors.
      whyItMatters: >-
        Without cap table details it is impossible to assess governance concentration,
        the economic impact of future dilution, or any preferred liquidation waterfall that might
        affect common shareholders in an M&A or insolvency scenario.
      diligencePath: >-
        Request cap table and shareholder agreement from management; review SEC Schedule 13D/13G
        filings for reportable 5%+ holders; review S-1 registration statement risk factors for
        preference stock disclosures.
