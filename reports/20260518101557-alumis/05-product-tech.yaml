        Phase 3 ONWARD1 (NCT06586112) and ONWARD2 (NCT06588738) enrolled more than 1,700 adults with
        moderate-to-severe plaque psoriasis, randomized 2:1:1 to envudeucitinib 40 mg BID, placebo, or
        apremilast; both trials met all primary and secondary endpoints with high statistical significance.
      type: observed
      topic: ONWARD Phase 3 results
      sourceRefs:
        - SE005
        - SE012
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE007
