  claims:
    - id: CE001
      statement: >-
        Envudeucitinib (formerly ESK-001) is an oral, highly selective, non-covalent allosteric inhibitor of TYK2
        designed to correct immune dysregulation across a range of immune-mediated diseases.
      type: observed
      topic: envudeucitinib mechanism
      sourceRefs:
        - SE001
        - SE009
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE001
        - QE007
    - id: CE002
      statement: >-
        Envudeucitinib binds selectively to the JH2 pseudokinase regulatory domain of TYK2, inducing a
        conformational change that prevents ATP binding at the catalytic JH1 domain and inactivates TYK2 signaling
        while preserving JAK1, JAK2, and JAK3 activity.
      type: third-party-reported
      topic: envudeucitinib mechanism
      sourceRefs:
        - SE003
        - SE009
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE001
    - id: CE003
      statement: >-
        At 40 mg twice daily, oral administration of envudeucitinib achieves maximal TYK2 inhibition at the IC90
        level sustained over the full 24-hour dosing interval in Phase 1 healthy volunteers and Phase 2 patients.
      type: third-party-reported
      topic: pharmacodynamics
      sourceRefs:
        - SE003
        - SE009
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE013
    - id: CE004
