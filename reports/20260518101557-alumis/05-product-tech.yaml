  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: manufacturing
      missingEvidence: >-
        Identities of Alumis's primary drug substance and drug product CMO partners for envudeucitinib; contract
        terms, capacity commitments, and single-source vs dual-source manufacturing strategy.
      whyItMatters: >-
        CMO dependency is a material NDA and commercial launch risk; failure to scale commercial GMP supply on time
        could delay product launch. Without CMO identity, investors cannot assess counterparty reputation, track
        record, or concentration risk.
      diligencePath: >-
        Request CMO/CDMO identities and relationship summaries from Alumis management in a diligence call; review
        manufacturing agreements during due diligence; obtain 483 observation and audit history for named sites.
      relatedQuestionRefs:
        - QE018
        - QE025
    - type: private-evidence-only
      severity: material
      topic: intellectual property
      missingEvidence: >-
        Composition-of-matter patent numbers, filing dates, expiry dates, and geographic coverage for
        envudeucitinib and A-005; method-of-use patent scope; freedom-to-operate analysis vs deucravacitinib IP.
      whyItMatters: >-
        Patent expiry horizon directly governs the commercial exclusivity window and thus the net present value of
        the envudeucitinib franchise; composition-of-matter gaps could expose Alumis to generic competition
        earlier than expected.
      diligencePath: >-
        Request IP schedule and freedom-to-operate opinions; search USPTO and EPO patent databases for Alumis-filed
        applications on TYK2 JH2 allosteric ligands; analyze composition-of-matter vs formulation vs method-of-use
        patent strength.
      relatedQuestionRefs:
        - QE019
    - type: missing-source
      severity: material
      topic: regulatory risk
      missingEvidence: >-
        Detailed FDA guidance letters, pre-NDA meeting minutes, and formal CMC feedback on commercial manufacturing
        readiness that would indicate whether the FDA has any outstanding concerns about the envudeucitinib NDA.
      whyItMatters: >-
        Pre-NDA FDA feedback shapes the final data package scope and can accelerate or delay the NDA timeline;
        absence of this information makes it impossible to assess the probability of a complete response letter
        or request for additional studies.
      diligencePath: >-
        Request copies of FDA correspondence and pre-NDA meeting outcomes in due diligence; review any CRL risk
        disclosures in subsequent SEC filings; monitor FDA PDUFA date announcements post-NDA submission.
      relatedQuestionRefs:
        - QE021
    - type: private-evidence-only
      severity: minor
      topic: commercial scale-up plan
      missingEvidence: >-
        Alumis's commercial-scale manufacturing strategy, including whether a second commercial CMO has been
        contracted, anticipated batch sizes, yield assumptions, and timeline for commercial GMP validation.
      whyItMatters: >-
        Commercial manufacturing readiness is a prerequisite for NDA approval; inadequate supply chain planning
        could delay product availability at launch and affect payer negotiations.
      diligencePath: >-
        Request commercial manufacturing readiness report or pre-NDA CMC briefing document; confirm dual-source
        supply strategy or explain single-source risk mitigation with a contractual supply assurance.
      relatedQuestionRefs:
        - QE025
    - type: missing-source
      severity: minor
      topic: developer-signal
      missingEvidence: >-
        Alumis has no public developer-facing API, GitHub repository, or software developer community surface
        typical of technology companies. Practitioner-community engagement is proxied here by drug intelligence
        platforms (Larvol Delta, Synapse PatSnap) and conference presentations (ECTRIMS 2025, EADV 2024, AAD 2026).
        No independent scientific forums or preprint servers with Alumis-affiliated publications were identified
        beyond peer-reviewed journals.
      whyItMatters: >-
        For a clinical-stage pharma company, developer-signal translates to scientific practitioner enthusiasm
        and adoption in medical communities; absence of a broader preprint or forum presence limits early
        independent signal on compound performance.
      diligencePath: >-
        Monitor bioRxiv/medRxiv for Alumis-affiliated preprints; track ECTRIMS, EADV, AAD, and ACR conference
        abstracts for independent data presentations; review Alumis's publication strategy for peer-reviewed
        ONWARD and LUMUS results.
acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      TE001, TE004, and TE005 are pure factual snapshots drawn from SEC filings, ClinicalTrials.gov registry
      entries, and company press releases with no derived, estimated, or computed cells that require
      annotation; per-table notes would be redundant with claim-level sourceRefs and evidenceGaps.
  - dimension: paywallRisk
    reason: >-
      ClinicalTrials.gov pages (SE012-SE015) returned js-only status, representing 4 of 25 sources (16%).
      All substantive content from these registries was independently retrieved via company press releases and
      peer-reviewed publications that cite the NCT numbers. The js-only status reflects ClinicalTrials.gov's
      JavaScript-rendered interface, not inaccessibility of trial information; the four entries are retained for
      NCT provenance.
