  - id: FE002
    title: Patient Journey Through Phase 3 Envudeucitinib ONWARD Program
    type: flow
    layout: wide
    summary: >-
      Sequential steps a moderate-to-severe plaque psoriasis patient traverses in the Phase 3 ONWARD trials,
      from eligibility assessment through primary and secondary endpoint evaluation and long-term extension entry.
    data:
      nodes:
        - id: n1
          label: Physician Diagnosis
          detail: Moderate-to-severe plaque psoriasis diagnosed (PASI ≥12, BSA ≥10%, sPGA ≥3); systemic therapy considered
          type: start
        - id: n2
          label: Screening and Eligibility
          detail: Baseline PASI, sPGA, scalp ss-PGA, DLQI, pruritus NRS captured; washout of prior biologics; IEC/IRB consent
          type: step
        - id: n3
          label: Randomization 2:1:1
          detail: Double-blind assignment to envudeucitinib 40 mg BID, placebo, or apremilast; no fasting requirement
          type: step
        - id: n4
          label: Twice-Daily Oral Dosing
          detail: Self-administered envudeucitinib 40 mg BID; IC90 TYK2 inhibition reached and sustained across 24h dosing interval
          type: step
        - id: n5
          label: Early Assessments Weeks 2–12
          detail: Pruritus NRS improvement Week 2; PASI 90 separation from placebo Week 4; DLQI 0/1 in 50% by Week 12
          type: step
        - id: n6
          label: Week 16 Co-Primary Endpoints
          detail: "PASI 75 (74% avg) and sPGA 0/1 (59% avg) vs placebo p<0.0001; scalp and QoL secondary measures"
          type: step
        - id: n7
          label: Week 24 Higher-Hurdle Endpoints
          detail: "PASI 90 (68.0%/62.1%), PASI 100 (41.0%/39.5%), scalp ss-PGA 0/1 (~75%); superior to apremilast p<0.0001"
          type: step
