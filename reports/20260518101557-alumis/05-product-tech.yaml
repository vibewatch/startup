  - id: section-regulatory-quality-roadmap
    title: Regulatory compliance, quality controls, and development roadmap
    body: >-
      All Alumis clinical programs are conducted under U.S. FDA IND applications, with all trials registered on
      ClinicalTrials.gov per Good Clinical Practice requirements. The Phase 3 ONWARD program carries NCT numbers
      NCT06586112, NCT06588738 (ONWARD1, ONWARD2), and NCT06846541 (ONWARD3). The LUMUS Phase 2b SLE trial is
      registered as NCT05966480. Manufacturing partners are expected to operate under GMP for clinical supply, with
      commercial-scale GMP compliance required for NDA submission. GLP preclinical studies underpin all IND-enabling
      toxicology packages, and IRB oversight is in place at all investigational sites.

      The competitive regulatory context presents a calibrated risk. The FDA has issued a class-wide black-box warning
      for JAK inhibitors covering infection, malignancy, major adverse cardiovascular events, and thrombosis — driven
      by data from higher-affinity JAK1/2/3 inhibitors. Alumis argues that the allosteric, TYK2-selective mechanism
      of envudeucitinib is exempt from these JAK class concerns, given its preservation of JAK1/2/3 activity.
      Deucravacitinib (Sotyktu), which shares this allosteric JH2 mechanism and was FDA-approved in 2022, received
      its label without a black-box warning, establishing regulatory precedent. The envudeucitinib NDA will face
      review of the full safety database from ONWARD1/2 plus ONWARD3 long-term extension data; any new signal in
      the extension trial or the SLE cohort could influence label scope. Alumis's IP portfolio for envudeucitinib
      and A-005 is referenced but not enumerated in public filings — the breadth and expiry horizon of
      composition-of-matter and method-of-use patents remain a diligence gap.
