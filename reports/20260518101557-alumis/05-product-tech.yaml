figures:
  - id: FE001
    title: Alumis Drug Development Architecture — Discovery to Regulatory Stack
    type: stack
    layout: wide
    summary: >-
      Five-layer architecture from foundational therapeutic hypothesis through the commercial regulatory pathway,
      illustrating how Alumis translates TYK2 genetic insights into clinical assets and regulatory submissions.
    data:
      layers:
        - label: Therapeutic Hypothesis and Target Biology
          detail: >-
            TYK2 genetic rationale across ~20 immune-mediated and neuroinflammatory diseases; Foresite Labs genomic
            target identification; JH2 pseudokinase domain as selective allosteric binding site; TYK2 cytokine
            landscape (IL-23, IL-17, IL-12, type I IFN) as disease drivers; IRF5 and additional undisclosed targets
        - label: Compound Discovery and Medicinal Chemistry
          detail: >-
            Rational allosteric TYK2 JH2 ligand design; deuterium substitution (CYP1A2 metabolic stability);
            cyclopropyl carboxamide (hERG cardiac safety); optimization for oral bioavailability and linear PK/PD
            relationship; CNS-penetrant A-005 scaffold design engineered for BBB permeability
        - label: Preclinical and Translational Science
          detail: >-
            GLP toxicology and safety pharmacology; in vitro/in vivo PK/PD profiling; IC90 TYK2 inhibition
            threshold definition; IND-enabling data generation; precision platform biomarker assay development
            (SIGLEC1, pSTAT, cytokine panels, skin tape strip proteomics for STRIDE/LUMUS)
        - label: Clinical Development
          detail: >-
            Phase 1 PK/PD envudeucitinib (40 mg BID IC90 24h confirmed); STRIDE Phase 2 dose-ranging NCT05600036;
            ONWARD1/2 Phase 3 1,700+ patients all endpoints met; A-005 Phase 1 1:1 plasma-to-CSF IC90; LUMUS Phase
            2b 408 SLE patients; A-005 Phase 2 MS pending; ECTRIMS/AAD/EADV biomarker conference presentations
        - label: Regulatory and Commercial Pathway
          detail: >-
            NDA preparation for envudeucitinib psoriasis (Q4 2026 target); third-party CMOs commercial GMP scale-up;
            Kaken Pharmaceutical Japan collaboration ($20M upfront, dermatology rights); ONWARD3 long-term extension
            safety data; SLE NDA pathway 2028+ contingent on LUMUS success; A-005 MS pivotal path 5+ years
