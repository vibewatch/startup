  - id: section-manufacturing-partnerships
    title: Manufacturing, supply chain, and commercial partnerships
    body: >-
      Alumis has no internal manufacturing capabilities. All clinical supply production is outsourced to third-party
      contract manufacturing organizations (CMOs) and contract research organizations (CROs) under agreements typical
      of late-stage clinical-stage biotechs. The identities of primary CMO partners for envudeucitinib drug substance
      and drug product are not publicly disclosed in SEC filings as of Q1 2026, representing a material supply chain
      diligence gap. A commercial-scale manufacturing readiness plan has not been described publicly, though the
      10-Q identifies procurement of commercial manufacturing capacity as a planned step. The ACELYRIN merger added
      a prepaid credit voucher for clinical manufacturing valued at approximately $11.4M at closing, applicable to
      lonigutamab clinical supply from a former ACELYRIN CMO.

      The Kaken Pharmaceutical (Japan) collaboration, signed March 2025, grants Kaken an exclusive license to
      develop, manufacture, and commercialize envudeucitinib in Japan for dermatology indications. Alumis received a
      $20M upfront payment and is entitled to milestone and royalty payments; Kaken also reimburses $20M in global
      development costs through end of 2026. Kaken retains options to expand the license to rheumatology and
      gastroenterology. Alumis retains global rights for all other geographies and all indications including SLE and
      CNS programs. As of March 31, 2026, Alumis held $569.5M in cash and marketable securities, which management
      believes is sufficient for at least 12 months of operations from the May 2026 10-Q issuance date, covering the
      NDA submission and LUMUS topline readout milestones.
