callouts:
  - calloutType: strength
    title: Phase 3 efficacy ranks at the top of reported oral psoriasis therapy results
    body: >-
      Envudeucitinib's Phase 3 PASI 90 rates of 68.0% and 62.1% in ONWARD1 and ONWARD2 at Week 24 — with
      rapid onset (PASI 90 separation from placebo by Week 4) and superiority to apremilast on all endpoints —
      place it at or near the upper boundary of published oral therapy outcomes in moderate-to-severe plaque
      psoriasis. The maximal IC90 TYK2 inhibition sustained over 24 hours mechanistically explains this efficacy
      advantage over existing oral options and supports the twice-daily dosing regimen as optimal for sustained
      pathway suppression.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE031
  - calloutType: risk
    title: Twice-daily dosing and absence of head-to-head data vs deucravacitinib are commercial risks
    body: >-
      Deucravacitinib (Sotyktu) is FDA-approved, commercially established, and dosed once daily. Envudeucitinib
      requires twice-daily dosing, which is a formulary and patient adherence disadvantage in the absence of
      head-to-head comparative data demonstrating superior efficacy or safety vs the incumbent. Indirect
      cross-trial comparisons are confounded by different trial designs, patient populations, and comparator arms.
      Physician prescribing inertia in the TYK2 class combined with Alumis's pre-revenue status creates meaningful
      commercial execution risk even if the NDA is approved on schedule.
    claimRefs:
      - CE008
      - CE034
      - CE036
  - calloutType: insight
    title: A-005 CNS penetrance opens a wholly differentiated second franchise with high optionality
    body: >-
      A-005's confirmed blood-brain barrier penetrance and IC90 CSF TYK2 inhibition from Phase 1 and ECTRIMS 2025
      data opens a competitive space that deucravacitinib cannot address — neuroinflammatory disease. If Phase 2
      data in MS patients confirm clinical efficacy, A-005 would be the first oral CNS-penetrant allosteric TYK2
      inhibitor approved in neurology, accessing a high-value market dominated by expensive infusion biologics and
      injection-route therapies. The mechanism is wholly novel vs approved DMTs and, if effective, would extend
      the TYK2 franchise into an indication with a different commercial risk profile than psoriasis.
    claimRefs:
      - CE012
      - CE013
      - CE014
      - CE015
