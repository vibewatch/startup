        - Medium — published estimates, not company-confirmed
      - - Primary US competition
        - Approved TYK2 inhibitor (Sotyktu, BMS) + Takeda TAK-279 (Phase 3)
        - Competitive oral TYK2 inhibitor market; pricing may be constrained by BMS incumbent position
        - Medium — market structure confirmed; relative pricing undisclosed
    notes: >-
      No Alumis-disclosed US pricing. Estimates derived from category comps (Sotyktu) and biologic market norms.
      Do not use for revenue projections without management confirmation. Market size is public epidemiology-based.
