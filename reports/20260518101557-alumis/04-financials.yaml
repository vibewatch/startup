  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: commercialization-capital-plan
      missingEvidence: >-
        A post-approval commercialization capital plan detailing incremental spending requirements for commercial
        team hiring, manufacturing scale-up, payer contracting, and market access beyond the Q4 2027 runway end.
      whyItMatters: >-
        Without a commercial build-out capital estimate, investors cannot determine whether Alumis will require
        one or multiple additional dilutive equity raises before achieving sustainable product revenue—a critical
        factor in valuation underwriting.
