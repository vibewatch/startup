  - id: section-capital-history
    title: 'Capital raise history: $816M+ raised in equity since IPO including January 2026 follow-on'
    body: >-
      Alumis has financed its operations entirely through equity capital—no debt, credit facility, or project-finance structure
      appears in the 2025 10-K or any public filing. The company went public on July 1, 2024 on Nasdaq (ticker: ALMS), selling
      13.125 million shares at $16.00 per share. Net proceeds from the IPO were $193.3 million after $16.7 million in
      underwriting discounts and other offering costs. On July 17, 2024, a concurrent private placement sold 2.5 million shares
      at the same $16 price to AyurMaya Capital Management for gross and net proceeds of $40 million. Prior to the IPO, Alumis
      raised approximately $259 million in a Series C round that closed in early 2024, led by Foresite Capital with participation
      from Samsara BioCapital, venBio Partners, Lilly Asia Ventures, and Cormorant Asset Management, among others. The
      company was previously incubated by Foresite Labs, and Foresite Capital held approximately 33% of shares at the time
      of the IPO.


      In Q2 2025, Alumis completed an all-stock merger with ACELYRIN, Inc. (formerly Nasdaq: SLRN), in which Alumis
      stockholders received approximately 55% and ACELYRIN stockholders approximately 45% of the combined company. The combined
      entity retained the Alumis name and is led by the existing Alumis executive team. At December 31, 2024, Alumis held
      approximately $289 million and ACELYRIN held approximately $448 million in cash and marketable securities, giving a
      pro-forma combined cash position of approximately $737 million ahead of the merger close.


      On January 9, 2026, Alumis completed an upsized underwritten follow-on offering of 20,297,500 shares at $17.00 per share
      (including full exercise of the underwriters' overallotment option). Net proceeds were $324.4 million after underwriting
      discounts. Post-offering pro-forma liquidity stood at approximately $632.9 million, combining the $308.5 million cash
      and marketable securities at December 31, 2025 with the $324.4 million net proceeds. Morgan Stanley, Leerink Partners,
      and Cantor served as underwriting representatives. Robert W. Baird also participated as an underwriter.
    claimRefs:
