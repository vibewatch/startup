  - id: section-capital-adequacy
    title: 'Capital adequacy: $633M pro-forma liquidity funds operations into Q4 2027'
    body: >-
      As of December 31, 2025, Alumis held $308.5 million in cash, cash equivalents, and marketable securities ($89.7 million
      cash, $218.8 million in marketable securities). The January 2026 follow-on offering added $324.4 million in net proceeds,
      bringing pro-forma liquidity to approximately $632.9 million. Management stated in the March 2026 10-K that the combined
      cash position—existing year-end 2025 balance plus the January 2026 net offering proceeds—is expected to fund operating
      expenses and capital expenditure requirements into the fourth quarter of 2027. The company confirmed no debt, credit
      facility, or project-finance obligation in its 2025 filings.


      At a 2025 operating cash burn rate of $369.5 million per year (approximately $92 million per quarter), the $632.9 million
      pro-forma position represents approximately 20 months of runway from year-end 2025, consistent with management's Q4 2027
      guidance. The near-term 2026 spending plan includes Phase 3 ONWARD long-term data collection, the NDA preparation and
      submission, and Phase 2b LUMUS SLE trial activities. If the NDA is accepted and approved on the standard 12-month FDA
      review clock, Alumis would be nearing or entering commercial-stage spending roughly as its current runway expires.


      Several factors could compress the runway. First, NDA preparation and pre-commercialization activities (commercial
      team build-out, manufacturing scale-up, payer contracting) would require incremental capital before any product revenue
      materializes. Second, if SLE Phase 2b data supports progression into Phase 3, additional large-scale trial costs would
      be triggered. Third, the company maintains an active Form S-3 shelf registration filed July 3, 2025 (expires July 2028),
      with at least one prior use via a 424B5 prospectus supplement dated January 8, 2026, indicating ongoing reliance on
      at-the-market and follow-on offering capacity to top up the balance sheet. Short interest in ALMS stood at approximately
      14.96% of float as of May 2026, with 9.01 days to cover—an elevated but not extreme short position that reflects investor
      debate about the timeline to profitability.
