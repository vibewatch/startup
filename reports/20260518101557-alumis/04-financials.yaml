  - id: TI002
    title: Pricing and monetization model — envudeucitinib future US commercial scenario
    columns:
      - Parameter
      - Basis / Source
      - Estimate or status
      - Confidence
    rows:
      - - US list price (annual, oral TYK2 inhibitor)
        - Industry comp (BMS Sotyktu ~$65k/yr WAC)
        - '$50,000–$75,000 annual treatment cost estimate'
        - Low — Alumis has not disclosed pricing; estimate based on TYK2 category comps
      - - Net price after rebates/discounts (biologic-comparable)
        - Biologic/oral market precedent; 20–40% gross-to-net discount typical
        - '$35,000–$55,000 estimated net realized price'
