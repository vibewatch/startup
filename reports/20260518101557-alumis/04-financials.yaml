  - id: section-operating-expenses
    title: 'Operating expenses and cash burn: $369.5M cash used in operations in 2025'
    body: >-
      Alumis's operating cost structure is dominated by clinical R&D spending, consistent with a late-stage Phase 3 biopharma.
      For fiscal year 2025, research and development expenses were $386.0 million, up from $265.6 million in 2024—an increase
      of $120.4 million or approximately 45%. The primary drivers were accelerated contract research and clinical trial costs
      for the Phase 3 ONWARD program in plaque psoriasis, increased headcount in R&D teams, and $9.5 million in one-time
      merger-related expenses (severance and stock-based compensation) related to the ACELYRIN integration. The 2024 baseline
      also included a $23.0 million clinical milestone payment related to the prior acquisition of FronThera, which inflates
      the year-on-year comparison.


      General and administrative expenses were $91.9 million in 2025, up from $35.2 million in 2024—an increase of $56.7 million.
      The main driver was $30.2 million in transaction and severance costs from the ACELYRIN merger. Underlying G&A growth
      (excluding merger costs) was approximately $26.5 million, reflecting increased headcount and professional consulting
      services to support the newly combined organization. Together, R&D and G&A totaled $477.9 million for 2025.


      Cash used in operating activities was $369.5 million in 2025, compared to $255.1 million in 2024. The gap between the
      $369.5 million operating cash outflow and the $243.3 million net loss is explained primarily by the $187.9 million non-cash
      bargain purchase gain from the ACELYRIN merger, which reduced GAAP net loss but did not generate cash. Stock-based
      compensation expense of $43.5 million partially offsets the cash-to-GAAP gap. On a quarterly basis, Q3 2025 operating
      loss was $115.3 million (up 17% from $98.4 million in Q3 2024), driven by Phase 3 acceleration spending. The company
      has consistently guided that loss and spending rates will remain elevated through the NDA submission.
