callouts:
  - calloutType: risk
    title: Net loss improvement is an accounting artifact, not an operating improvement
    body: >-
      The FY2025 net loss of $243.3M appears smaller than the FY2024 net loss of $294.2M, but this improvement
      is almost entirely explained by the $187.9M one-time non-cash bargain purchase gain recorded when Alumis
      acquired ACELYRIN at a price below the fair value of its net assets. Underlying operating cash burn
      worsened from $255.1M (2024) to $369.5M (2025). Any underwriting based on the stated net loss will
      materially understate the true rate of capital consumption.
    claimRefs:
      - CI020
      - CI021
      - CI022

  - calloutType: risk
    title: Commercialization will require additional equity dilution beyond current runway
    body: >-
      Management's Q4 2027 runway guidance is based on the current operating plan, which covers clinical
      development, NDA preparation, and minimal commercial readiness activities. A commercial launch in 2027
      would require substantial pre-launch spending—sales force recruitment, manufacturing scale-up, payer
      contracting, and market access investment—none of which is funded by the current $633M balance. Alumis
      has an active S-3 shelf and a $300M at-the-market equity program, indicating that additional dilutive
      raises are anticipated. Short interest at 14.96% of float (9.01 days to cover) reflects market pricing
      of this dilution risk.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI028
      - CI029

  - calloutType: recommendation
    title: Diligence must close four gaps before underwriting
    body: >-
      Four information gaps block financial underwriting: (1) program-level R&D cost breakdown to assess
      Phase 3 capital intensity per program; (2) per-patient Phase 3 trial cost vs. CRO contracts; (3) a
      post-approval commercial capital plan with explicit incremental spending estimates beyond current runway;
      (4) gross-to-net discount assumptions and payer access strategy for the US launch. All four require
      direct management engagement and are unlikely to be available from public sources before the NDA
      submission in 2H 2026.
    claimRefs:
      - CI017
      - CI018
      - CI032

