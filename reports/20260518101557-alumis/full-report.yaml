      - number: '2.3'
        title: Buyer and Segment Map
        blocks:
          - type: paragraph
            body: >
              The oral immunology market for plaque psoriasis, PsA, and SLE involves distinct buyer, user, and payer
              roles. The prescribing physician — primarily a board-certified dermatologist for psoriasis, a
              rheumatologist for PsA and SLE — makes the formulary-within-indication prescribing decision, but is
              constrained by payer prior authorization criteria, step-therapy requirements, and formulary tier
              placement. Patients are end users who exercise meaningful choice between orals and injectables, with
              needle aversion and administration convenience being documented adoption drivers for oral agents.

              Commercial payers (UnitedHealth, Cigna, Aetna, BCBS plans) and PBMs (Express Scripts, CVS Caremark,
              OptumRx) control formulary positioning through exclusion lists and step-therapy protocols, typically
              requiring failure of conventional DMARDs and/or apremilast before authorizing branded TYK2 or biologic
              therapy. Government payers (Medicare Part D, Medicaid) follow similar utilization management patterns but
              at lower net pricing after mandatory rebates. The effective payer is therefore the PBM/insurer, not the
              patient, for commercially meaningful volume.

              Segment-level adoption varies by indication: psoriasis patients skew younger, are often employed, and have
              private insurance coverage — making formulary tier directly relevant. SLE disproportionately affects women
              of reproductive age and people of color, with a higher Medicaid representation, where drug access
              timelines and rebate economics differ from commercial. PsA patients are often managed across both
              dermatology and rheumatology, creating a dual-physician prescribing dynamic for any new oral agent.
              Collectively, the highest-value buyer segment for Alumis's near-term launch (assuming psoriasis NDA first)
              is: younger, commercially insured, needle-averse, moderate-to-severe plaque psoriasis patients
              inadequately controlled on apremilast, with a dermatologist willing to prescribe a branded oral ahead of
              biologic step-up.
