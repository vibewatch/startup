      - number: '6.2'
        title: Prescribers, Payers, and Access Architecture
        blocks:
          - type: paragraph
            body: >
              Despite envudeucitinib's strong clinical profile, the prescriber and payer access landscape presents
              material adoption headwinds, as illustrated by Sotyktu's commercial trajectory.

              On the prescriber side, a December 2025 Recon Strategy analysis of Deutsche Bank survey data found that
              50% of US dermatologists ranked Sotyktu seventh or eighth among systemic therapies on efficacy, and 65%
              ranked it in the bottom two on pricing and access. This prescriber tepidity reflects both clinical
              conservatism -- high-efficacy biologics (IL-17 and IL-23 agents with monthly or quarterly dosing) remain
              preferred -- and formulary friction that limits patient access. BMS acknowledged the access problem
              explicitly when it launched a DTC campaign in September 2025 at more than 80% below list price
              ($6,678/30-day WAC).

              On the payer side, UnitedHealthcare's prior authorisation policy (current 2026) requires documented
              topical corticosteroid failure plus a 3-month methotrexate trial or prior failure of an FDA-approved
              systemic targeted agent, with prescribing dermatologist attestation and a 12-month authorisation. Cigna's
              March 2026 policy revision similarly requires topical and conventional systemic failure before coverage.
              These two payers collectively cover more than 55 million commercial lives, making step-therapy compliance
              a de facto prerequisite for any TYK2 inhibitor to achieve meaningful script volume.

              For envudeucitinib, this means the practical first-access addressable universe is the subset of
              moderate-to-severe psoriasis patients who have already failed topicals, methotrexate, and biologics -- a
              narrower and more medically complex cohort than the full 1.9 million.
            claimRefs:
              - CU019
              - CU020
              - CU021
              - CU022
              - CU023
          - type: table
            tableRef: TU004
            claimRefs:
              - CU024
              - CU025
              - CU026
              - CU027
              - CU028
          - type: figure
            figureRef: FU002
            claimRefs:
              - CU035
              - CU036
      - number: '6.3'
        title: Trial Evidence and Named Stakeholder Proof
        blocks:
          - type: paragraph
            body: >
              The most concrete customer evidence available pre-launch derives from the ONWARD Phase 3 programme --
              1,700+ patients randomised across 156 global investigator sites in ONWARD1 (NCT06586112) and ONWARD2
              (NCT06588738), with enrollment completed May 2025 and topline data presented at AAD 2026 on March 28.

              Efficacy results were exceptional for an oral agent. At week 16, approximately 74% of envudeucitinib
              patients achieved PASI 75 and 59.5% reached sPGA 0/1, meeting both co-primary endpoints with statistical
              significance (p<0.001) in both trials. By week 24, approximately 65% achieved PASI 90 and approximately
              40% achieved PASI 100 -- efficacy rankings that rival or exceed several marketed biologics in indirect
              comparisons. Envudeucitinib outperformed apremilast on all PASI endpoints at week 24, delivering a key
              secondary win that supports formulary differentiation. Itch relief (patient- reported NRS score) was
              detectable by week 2, providing rapid patient- perceived benefit that supports adherence and word-of-mouth
              demand.

              The safety profile through week 24 was consistent with prior Phase 2 data; adverse events were mostly
              mild-to-moderate (nasopharyngitis, headache, acne, upper respiratory infections) with no new safety
              signals.

              Dr. Andrew Blauvelt, MD, MBA (Blauvelt Consulting) -- a well-published TYK2 expert and former Oregon
              Medical Research Center faculty -- served as a principal ONWARD investigator and presented results at AAD
