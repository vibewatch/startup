      yAxis: Phase 3 Efficacy Evidence — PASI 90 Benchmark (1=low, 10=high)
      points:
        - label: ESK-001 (Alumis)
          x: 9
          'y': 8
        - label: Sotyktu / Deucravacitinib (BMS)
          x: 8
          'y': 7
        - label: Zasocitinib (Takeda)
          x: 9
          'y': 7
        - label: Icotyde / Icotrokinra (J&J)
          x: 8
          'y': 8
        - label: Rinvoq / Upadacitinib (AbbVie)
          x: 4
          'y': 8
        - label: Otezla / Apremilast (Amgen)
          x: 7
          'y': 3
        - label: Brepocitinib (Priovant)
          x: 5
          'y': 3
        - label: Cosentyx / Secukinumab (Novartis)
          x: 7
          'y': 8
    approximationNotes: >-
      X-axis scores: TYK2 allosteric agents (ESK-001, Sotyktu, zasocitinib) score 8–9 for selectivity and absence of
