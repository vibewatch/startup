      - number: '6.5'
        title: Expansion Pathways and Concentration Risk
        blocks:
          - type: paragraph
            body: >
              As of May 2026, Alumis has a single asset in a single approved indication (NDA planned H2 2026),
              representing acute concentration risk on both the commercial and scientific dimensions.

              The most near-term customer expansion pathway is psoriatic arthritis. With Sotyktu receiving FDA PsA
              approval in March 2026, the regulatory precedent for TYK2 inhibition in joint disease is established.
              However, Alumis has not yet disclosed a pivotal PsA trial design, making this segment speculative beyond
              Phase 2 data. The NHANES-derived PsA prevalence of ~912,000 US adults represents a meaningful patient
              segment, but the commercial window depends on Phase 3 data not yet available.

              The SLE expansion (LUMUS Phase 2b, topline Q3 2026) is more imminent but earlier in development. A
              positive LUMUS readout would unlock an incremental patient segment of ~204,000 US adults; a negative
              result would eliminate SLE as a near-term customer opportunity.

              Competitive concentration risk derives from the TYK2 and oral immunology pipeline. PatSnap data identifies
              multiple late-stage TYK2 programmes (Takeda, Boehringer Ingelheim, Sun Pharma) alongside next- generation
              IL-17/IL-23 biologics. BID dosing for envudeucitinib is a patient convenience disadvantage versus QD
              alternatives; Alumis is developing a QD modified-release formulation, but this is not yet in pivotal
              trials. Alumis has not disclosed a specialty pharmacy partner, hub services contract, or patient support
              programme as of May 2026, leaving the commercial infrastructure pathway unverified.
