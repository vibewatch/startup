      - number: '8.3'
        title: Scenarios, Risks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              The bull case envisions FDA approval of envudeucitinib for psoriasis in mid-2027 followed by strong
              commercial launch, Phase 2b SLE data supporting a second NDA in 2028, and potential partnership or
              acquisition by a large pharma at a significant premium. Under this scenario, valuation could reach $6–8B
              within 18–24 months of approval as commercial ramp begins and the multi-indication pipeline gains
              credibility. The base case assumes on-time NDA filing and approval, a moderate commercial launch aided by
              superiority data versus Sotyktu, and partial SLE proof of concept, supporting a valuation of $4–5B. The
              bear case—NDA rejection, FDA request for additional studies, or unexpected safety signal—could reset the
              stock toward $0.9–$1.5B, representing a 50–70% decline from current levels. Key thesis-break triggers
              include: any FDA complete response letter citing safety or efficacy deficiencies; SLE Phase 2b LUMUS data
              missing on its primary BICLA endpoint in Q3 2026; loss of key management including CEO Martin Babler; and
              the securities class action lawsuit from the Acelyrin acquisition period escalating materially. Short
              interest at approximately 15.5% with 13.5 days to cover reflects institutional conviction in the bear
              case. The Q3 2026 SLE readout and H2 2026 NDA filing are the two binary events that will most likely
              either validate or rupture the current valuation.
            claimRefs:
