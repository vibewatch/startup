      - number: '7.4'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Alumis's revenue is entirely derived from a single collaboration agreement with Kaken Pharmaceutical, the
              company's sole commercial partner. While this relationship validates envu's commercial potential in Japan,
              it creates extreme revenue concentration risk: any dispute, termination, or renegotiation of the Kaken
              collaboration eliminates 100% of Alumis's current revenue. The terms and milestone schedule of the Kaken
              agreement are not fully public, creating information asymmetry for investors.

              Manufacturing dependency on CDMOs is a structural risk for clinical supply, NDA CMC filing, and eventual
              commercial launch. Alumis has no in-house manufacturing and operates on purchase-order basis without
              long-term supply arrangements currently in place. The principal API suppliers are located in India and
              Taiwan, both geographies subject to geopolitical volatility, FDA inspection activity, and supply chain
              disruptions. The 2025–2026 pharma industry backdrop shows FDA enforcement actions increasing 50% against
              CMOs and 40%+ of companies experiencing supply disruptions from geopolitical tensions. A GMP failure at a
              CDMO—particularly during the pre-NDA commercial launch readiness phase—could delay the regulatory filing
              or approval, compressing the commercial window.

              CRO dependency for ONWARD3 long-term extension and the LUMUS SLE trial creates execution risk that Alumis
              acknowledges in its 10-K: the company relies on CROs and clinical sites for proper and timely conduct, and
              has limited influence over their performance. Protocol deviations at trial sites, slow enrollment in
              LUMUS, and data integrity issues could affect the quality of regulatory submissions. The $300M ATM
              offering agreement with Cantor Fitzgerald provides financial flexibility, but capital-markets access
              depends on Alumis's stock price and market conditions at time of use— a binary NDA outcome could impair
              access to ATM capital precisely when it is most needed.
