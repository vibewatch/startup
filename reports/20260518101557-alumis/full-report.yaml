      - number: '7.5'
        title: Financial Risk
        blocks:
          - type: paragraph
            body: >-
              Alumis is a clinical-stage company with no commercial revenue from products, an accumulated deficit of
              $901.9 million as of December 31, 2025, and net losses of $243.3 million in FY2025 and $294.2 million in
              FY2024. The quarterly operating cash burn was $87 million in Q1 2026, consistent with late-stage clinical
              development costs. Management's stated belief that current cash—$570 million as of March 31, 2026,
              following a $324 million public offering in January 2026—funds operations for at least 12 months from
              March 2026 means that additional financing will likely be required before or shortly after the H2 2026 NDA
              filing. If the NDA is filed on schedule and approved within the standard 10-month review cycle,
              commercialization expenses will dramatically increase the burn rate precisely when the company needs to
              raise capital or negotiate a commercial partnership.

              Dilution risk is material and ongoing. The March 2026 $300 million ATM agreement with Cantor Fitzgerald
              supplements equity raises but at-the-market sales create continuous share dilution. Each successive
              capital raise—including the $324M offering in January 2026—dilutes early investors. Alumis also holds $51
              million in acquired in-process R&D intangible assets tied to the lonigutamab program; following the
              decision to explore strategic alternatives for lonigutamab, a non-cash impairment charge is possible.
              Revenue concentration in Kaken Pharmaceutical means that any collaboration dispute would immediately
              eliminate all revenue while the company continues burning cash at $87M per quarter.

              The binary nature of the NDA outcome creates a financial cliff. A CRL from the FDA would trigger a
              significant decline in market capitalization, potentially impairing the ability to raise equity at
              reasonable terms and threatening the commercialization plan. Unlike commercial-stage biotechs, Alumis has
              no cash-generating products to buffer a setback. The IPO in June 2024 raised approximately $250 million;
              subsequent equity issuances have extended runway, but the company remains structurally dependent on
              favorable capital market conditions and a successful NDA outcome.
            claimRefs:
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
      - number: '7.6'
        title: People and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              CEO Martin Babler, appointed in September 2021 and serving as President, CEO, and Chairman of the Board,
              is the central architect of Alumis's late-stage development and IPO strategy. His prior experience leading
              Principia Biopharma through its $3.7 billion acquisition by Sanofi, combined with a background at
              Genentech and Eli Lilly, makes him a credible leader in the TYK2 and immuno- oncology investor community.
              His departure or incapacitation would disrupt investor confidence, disrupt the NDA process narrative, and
              risk key institutional relationships. Alumis's 10-K explicitly identifies dependence on its management
              team and key scientific personnel as a material risk, and the company has not publicly disclosed a formal
              succession plan.

              The depth of the clinical leadership team under CMO Dr. Jörn Drappa is critical to executing the NDA
              submission—a process that requires coordinated CMC, clinical, regulatory, and biostatistics expertise. The
              10-K highlights the challenge of attracting and retaining qualified clinical, scientific, and operations
              personnel; in a competitive Bay Area biotech environment with multiple well-capitalized peers, turnover in
              the NDA team at a critical juncture (H2 2026 submission) would be highly disruptive. The merger
              integration of ACELYRIN adds organizational complexity, given that ACELYRIN's discontinued lead program
              (izokibep) may have created morale and retention issues within the combined workforce.

              Governance risk arose during the ACELYRIN merger process: Trium Capital, an ACELYRIN investor, publicly
              pressured ACELYRIN's board to reject the Alumis merger and instead pursue liquidation, arguing liquidation
              would yield higher returns to shareholders. While the boards of both companies recommended the
              merger—approved by shareholders on May 13, 2025—this episode reflects investor skepticism about the terms
              of the transaction and management allocation of capital. The governance concern is now embedded in
              Alumis's shareholder base post-merger and could surface in future proxy contests if execution falters.
