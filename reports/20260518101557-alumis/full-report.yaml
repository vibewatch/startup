companyProfile:
  summary: >
    Alumis Inc. (NASDAQ: ALMS) is a South San Francisco–based clinical-stage biopharmaceutical company founded in 2021
    and incubated by Foresite Labs, the venture creation platform of Foresite Capital. The company is focused on
    developing oral, selective TYK2 inhibitors to address significant unmet need in autoimmune and inflammatory
    diseases. Its lead compound, envudeucitinib, is a once-daily oral TYK2 inhibitor that delivered class-leading PASI
    90 rates of approximately 65% at Week 24 in two Phase 3 trials (ONWARD1 and ONWARD2), substantially exceeding the
    performance of the only currently approved oral TYK2 inhibitor. Alumis completed an IPO on NASDAQ in June 2024 and a
    $345.1M follow-on offering in January 2026, and holds approximately $569.5M in cash, providing runway into late
    2027. The company plans to file an NDA for envudeucitinib in plaque psoriasis in H2 2026, with SLE Phase 2b data
    expected in Q3 2026.
