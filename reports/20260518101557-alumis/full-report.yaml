      - number: '1.3'
        title: Funding history and capital stack
        blocks:
          - type: paragraph
            body: >-
              Alumis has raised approximately $1.12 billion in aggregate capital from founding through January 2026
              across five distinct financing events. The Series A of approximately $70 million was raised in 2021 when
              the company was operating under the Esker Therapeutics name; multiple industry sources confirm this
              founding round. The Series B of $200 million was raised in 2022, enabling the company to conduct its Phase
              2 STRIDE trial in plaque psoriasis and initiate mid-phase studies in SLE and non-infectious uveitis.


              The Series C of $259 million, closed in March 2024, was the largest private biotech financing of 2024 at
              the time of announcement according to Fierce Biotech's fundraising tracker. The round was co-led by
              Foresite Capital, Samsara BioCapital, and venBio Partners. New investors including Cormorant Asset
              Management, SR One, and Lilly Asia Ventures joined, while existing backer AyurMaya Capital Management
              participated. This round funded the pivotal Phase 3 ONWARD program in plaque psoriasis and the Phase 2b
              LUMUS program in SLE.


              The IPO on June 28, 2024, raised gross proceeds of approximately $250 million. The IPO was priced at
              $16.00 per share, the low end of the $16–$18 indicated range, after the company downsized the offering
              from a planned 17.65 million shares (targeting $274–315 million including over-allotment) to 13,125,000
              shares. A concurrent private placement to AyurMaya at the same price added approximately $40 million. ALMS
              shares traded as low as approximately $12.77 on the first day of trading, falling below the offering
              price—a signal of muted initial public market reception.


              In January 2026, following the announcement of positive Phase 3 ONWARD results, Alumis completed an
              upsized follow-on public offering of 20,297,500 shares at $17.00 per share, raising gross proceeds of
              approximately $345.1 million (including full exercise of the underwriters' over-allotment option). This
              offering was led by Morgan Stanley, Leerink Partners, Cantor, and Wells Fargo Securities. The company's
              unaudited cash position was approximately $308.6 million as of December 31, 2025; following the follow-on,
              total liquidity exceeded $650 million with management disclosing a runway into approximately late 2027.
