            title: Phase 3 efficacy results rank among the strongest reported for an oral psoriasis therapy
            body: >-
              The Phase 3 ONWARD1 and ONWARD2 trials met all primary and secondary endpoints with high statistical
              significance. The ~65% PASI 90 and >40% PASI 100 response rates at Week 24 substantially exceed the ~40%
              PASI 90 and ~15% PASI 100 rates reported by BMS Sotyktu, the only currently approved TYK2 inhibitor for
              psoriasis. This efficacy profile could command a meaningful market share premium over Sotyktu if
              commercialized successfully.
            calloutType: strength
            claimRefs:
