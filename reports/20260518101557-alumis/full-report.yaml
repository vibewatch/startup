  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries and Scope
        blocks:
          - type: paragraph
            body: >
              Alumis's primary addressable market spans three autoimmune indications: moderate-to-severe plaque
              psoriasis, psoriatic arthritis (PsA), and systemic lupus erythematosus (SLE). These indications share a
              common biology — dysregulated IL-23/IL-17 and Type I interferon signaling pathways — that TYK2 inhibition
              addresses mechanistically. The market boundary for this analysis is oral and injectable systemic therapies
              for moderate-to-severe disease; topical-only therapies and over-the-counter products are excluded.
              Biologics (anti-TNF, anti-IL-17, anti-IL-23) are included in the total indication TAM but not in the oral
              sub-market SAM that defines Alumis's primary competitive arena.

              The status-quo standard of care consists of: injectable biologics (AbbVie Skyrizi, Novartis Cosentyx, J&J
              Stelara, Amgen Enbrel/biosimilars) for patients with moderate-to-severe disease and prior systemic therapy
              failure; oral conventional DMARDs (methotrexate) and phosphodiesterase-4 inhibitors (Otezla/apremilast)
              for early systemic therapy; and, since September 2022, Sotyktu (deucravacitinib), the only approved oral
              TYK2 inhibitor pre-2026. A critical market shift occurred in March 2026 when J&J/Protagonist's ICOTYDE
              (oral IL-23 antagonist) received FDA approval, adding a new oral class that competes directly with TYK2
              inhibitors for needle-averse patients seeking biologic-level efficacy. The oral immunology sub-market is
              accordingly no longer a single-product class as of Alumis's NDA submission cycle.

              Key inclusion/exclusion logic: SLE is included because Alumis has an active Phase 2b LUMUS program, but
              there is no approved TYK2 inhibitor for SLE as of May 2026. PsA is included because Sotyktu has European
              Commission approval for PsA and Alumis plans indication studies. The IBD (ulcerative colitis, Crohn's)
              adjacency is excluded from the primary TAM as Alumis has no active IBD program in its disclosed pipeline.
            claimRefs: []
