    title: Competitive Positioning Map — Oral Psoriasis and TYK2 Class (May 2026)
    type: quadrant
    layout: wide
    summary: >-
      Ordinal positioning of oral psoriasis competitors on TYK2 selectivity and safety profile (x-axis, 1–10) versus
