      - number: '5.2'
        title: 'Envudeucitinib: allosteric mechanism, selectivity, and Phase 3 ONWARD evidence'
        blocks:
          - type: paragraph
            body: >-
              Envudeucitinib achieves TYK2 selectivity through an allosteric mechanism: it binds the JH2 pseudokinase
              regulatory domain — a site structurally distinct from the JH2 domains of JAK1, JAK2, and JAK3 — inducing a
              conformational change that locks the catalytic JH1 domain in an inactive state, blocking ATP binding and
              downstream STAT phosphorylation. This indirect inhibition preserves JAK1/2/3 signaling activity,
              eliminating the cytopenia, infection risk, and lipid dysregulation associated with first-generation,
              non-selective JAK inhibitors. The molecular structure incorporates a deuterated methyl triazole moiety to
              enhance CYP1A2 metabolic stability and reduce metabolite-driven off-target effects, plus a cyclopropyl
              carboxamide group hypothesized to reduce hERG-associated cardiac repolarization risk. At 40 mg BID, oral
              administration sustains maximal IC90 TYK2 inhibition across the full 24-hour dosing interval — a
              pharmacodynamic threshold that Phase 2 data established as necessary for robust skin clearance responses.

              Phase 3 ONWARD1 (NCT06586112) and ONWARD2 (NCT06588738) enrolled more than 1,700 adults with
              moderate-to-severe plaque psoriasis randomized 2:1:1 to envudeucitinib 40 mg BID, placebo, or apremilast
              as an active comparator. Both trials met all co-primary endpoints (PASI 75 and sPGA 0/1 at Week 16) and
              all secondary endpoints with high statistical significance. Across both trials, 74% of patients achieved
              PASI 75 and 59% achieved sPGA 0/1 at Week 16 (p<0.0001 vs placebo). At Week 24, PASI 90 rates of 68.0%
              (ONWARD1) and 62.1% (ONWARD2), and PASI 100 rates of 41.0% and 39.5%, were observed — results that rank at
              the upper range for oral therapies in this indication. Envudeucitinib was superior to apremilast on all
              PASI endpoints at Week 24 (p<0.0001 in each trial). Scalp psoriasis clearance (ss-PGA 0/1) was achieved by
              approximately 75% of patients by Week 24. Patient-reported itch improvement was observed as early as Week
              2, and DLQI 0/1 was achieved by 50% of patients by Week 12. Most common treatment-emergent adverse events
              were headache, nasopharyngitis, upper respiratory tract infection, and acne; the majority mild to moderate
              with no new safety signals through Week 24. An NDA submission to the FDA is planned for Q4 2026. ONWARD3
              (NCT06846541), the long-term extension, is ongoing.
