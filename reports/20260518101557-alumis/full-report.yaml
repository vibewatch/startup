      - number: '2.2'
        title: 'Market Sizing: TAM, SAM, and SOM'
        blocks:
          - type: paragraph
            body: >
              The combined global TAM across plaque psoriasis, PsA, and SLE exceeds USD 30 billion in 2026, computed by
              summing independently sized indication markets. Plaque psoriasis estimates range from USD 12.5–13.7
              billion (conservative, narrowly scoped) to USD 23.8 billion (broader scope including all biologics used in
              psoriasis), reflecting definitional inconsistencies across analyst reports rather than true market
              volatility. PsA is estimated at USD 13.97 billion in 2026 (Fortune Business Insights), growing at ~11%
              CAGR through 2034. SLE is estimated at USD 3.68–3.71 billion in 2026, growing at 7.5–11.2% CAGR through
              2031–2035 depending on the source. These are all-therapy TAM figures including biologics.

              The serviceable addressable market (SAM) for oral systemic therapy narrows significantly. In PsA, the oral
              segment holds approximately 20–28% of market revenue, with biologics commanding ~51–52%; applying oral
              share to the $14B PsA TAM implies a ~$3–4B oral PsA SAM. In psoriasis, the oral segment is substantially
              smaller relative to the biologic-dominant revenue base. The biologic psoriasis market alone is projected
              at $16.2 billion in 2026 (Intel Market Research), implying oral therapies represent a minor fraction today
              but one growing at the fastest rate. Combining oral-accessible share across the three indications yields a
              rough SAM of $5–9B for oral systemic immunology.

              The serviceable obtainable market (SOM) for the oral TYK2 inhibitor class specifically is estimated at
              ~USD 615 million in 2026 (Research and Markets), concentrated almost entirely in Sotyktu, with a CAGR of
              ~9.6% through 2032. This class-level SOM will expand as additional TYK2 inhibitors receive approval.
              Alumis's first-year SOM following NDA approval (expected 2027–2028 given H2 2026 filing) is not
              supportable from public data; it would depend on formulary access, pricing relative to Sotyktu and
              zasocitinib, and PASI 90/100 differentiation claims in prescriber detailing.
