              - CO033
              - CO040
          - type: callout
            title: Pre-commercial, pre-revenue biotech with key-person concentration and intense competition
            body: >-
              Alumis has no approved products, no product revenue, and a single CEO (Martin Babler) without a publicly
              disclosed successor. The competitive landscape has intensified with J&J's approved oral IL-23 inhibitor
              icotrokinra and Takeda's once-daily TYK2 zasocitinib; analysts have already cut price targets citing
              pricing pressure. The company's entire commercial value depends on successfully filing, defending, and
              launching envudeucitinib in an increasingly crowded market before its cash runway expires.
            calloutType: risk
            claimRefs:
