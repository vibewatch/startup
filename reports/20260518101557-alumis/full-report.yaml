              at $16.00 per share, though the stock fell below offering price on the first day of trading.


              The January 6, 2026 announcement of positive Phase 3 ONWARD results represented the company's most
              significant clinical milestone to date, triggering an approximately 82% stock price surge that day
              according to Pharmaphorum. However, the stock subsequently became volatile, declining approximately 18.51%
              on a separate trading day despite the positive clinical backdrop, as competitive pressure from J&J and
              Takeda's oral psoriasis programs led analysts to revise estimates. As of May 15, 2026, ALMS traded at
              $22.87 with a 52-week range of $2.76 to $30.60, reflecting the high binary risk and execution uncertainty
              typical of pre-commercial biotech companies approaching an NDA submission.


              Adverse milestones in the public record include the downsized IPO (planned at $274–315M, priced at a $250M
              total), the below-IPO first-day trading price, and the analyst price target cuts reflecting heightened
              competitive scrutiny. No regulatory enforcement actions, product recalls, or material litigation have been
              identified in available sources, though this absence should be treated as an open diligence item rather
              than a confirmed clean record, as pre-commercial biotechs can carry IP disputes, employment matters, or
