    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and business model
        blocks:
          - type: paragraph
            body: >-
              Alumis Inc. is a late-stage biopharmaceutical company incorporated in Delaware and headquartered at 280
              East Grand Avenue, South San Francisco, California 94080. The company's mailing and business address
              registered with the SEC is confirmed by EDGAR filings under CIK 0001847367. Alumis describes itself as
              developing oral therapies using a precision approach to optimize clinical outcomes and significantly
              improve the lives of patients with immune-mediated diseases. The company is listed on the Nasdaq Global
              Select Market under the ticker symbol ALMS, having commenced trading on June 28, 2024.


              The company was founded in 2021, having emerged from Foresite Labs, the incubation arm of Foresite
              Capital. Multiple industry sources confirm that Alumis previously operated under the name Esker
              Therapeutics before rebranding. The company's core business model is clinical-stage drug development with
              no approved products and no product revenue as of the run date. All operations are financed through equity
              capital raises, with the company reporting a trailing-twelve-month loss of $1.78 per share as of May 2026.


              Alumis's commercial thesis rests on developing next-generation, oral small-molecule therapies that can
              challenge injectable biologics on efficacy while offering the convenience of oral dosing. The company's
              proprietary precision data analytics platform is used to identify and advance programs across a range of
              immune-mediated diseases. In addition to its TYK2 inhibitor programs, Alumis has expanded its pipeline to
              include lonigutamab, a subcutaneously delivered anti-IGF-1R biologic for thyroid eye disease,
              demonstrating a multi-target approach to immune-mediated disease. The company describes its strategy as
              building a "pipeline-in-a-pill," seeking to leverage maximal TYK2 inhibition across the IL-23, IL-17, and
              type I interferon pathways that drive roughly 20 immune-mediated conditions according to the company's
              genomic analyses.
