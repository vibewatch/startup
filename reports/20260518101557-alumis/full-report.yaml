              a challenging funding environment for the sector is a strong signal of investor conviction in both the
              TYK2 inhibition thesis and Martin Babler's leadership. The subsequent IPO, follow-on offering, and Phase 3
              validation complete a capital and clinical execution arc that few pre-commercial biotechs achieve within
              three years of founding.
