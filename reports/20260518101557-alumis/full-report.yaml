      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The principal growth driver for the oral TYK2 inhibitor class is the convergence of biologic-level
              efficacy with oral administration convenience. Historically, moderate-to-severe psoriasis patients faced a
              trade-off: oral apremilast offered convenience at ~30% PASI 75 efficacy, while injectable biologics
              achieved PASI 90 in 50–70% of patients. Second-generation TYK2 inhibitors — Sotyktu, envudeucitinib,
              zasocitinib — now deliver PASI 75 rates of 75–80% and PASI 90 rates of 55–68%, closing the efficacy gap
              that historically drove biologic adoption. This shift is a structural market driver, not cyclical.

              A second driver is TYK2's regulatory safety profile. Unlike JAK inhibitors (tofacitinib, baricitinib,
              upadacitinib), which carry an FDA black-box warning for major adverse cardiovascular events, thrombosis,
              and malignancy, deucravacitinib and next-generation TYK2 inhibitors have not received this warning —
              though Sotyktu's label notes uncertainty about whether TYK2 inhibition might share JAK risks, which has
              dampened enthusiastic prescribing. The absence of a black-box warning is a commercial advantage that
              prescribers and payers can leverage for formulary positioning.

              Key adoption constraints include: (1) Competitive crowding — three oral TYK2 inhibitors (Sotyktu,
              zasocitinib, envudeucitinib) plus ICOTYDE (oral IL-23) will compete in plaque psoriasis from 2027,
              compressing pricing power and increasing rebate demands; (2) Limited long-term safety data — only three
              years of follow-up for Sotyktu LTE, insufficient for lifetime chronic disease treatment; (3) Payer
              step-therapy protocols requiring prior treatment failure with cheaper agents before TYK2 authorization;
              (4) Indication-specific regulatory risk — no TYK2 inhibitor is approved for SLE, and Alumis's SLE market
              opportunity depends entirely on the Q3 2026 LUMUS Phase 2b readout; (5) Biosimilar competition for
              established biologics diverting payer savings that might otherwise widen access for new oral agents. The
              market is growing but the commercial access environment for a third entrant is materially more difficult
              than it was for Sotyktu's 2022 launch.
