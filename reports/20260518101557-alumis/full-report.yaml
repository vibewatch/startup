      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Phase 3 efficacy ranks at the top of reported oral psoriasis therapy results
            body: >-
              Envudeucitinib's Phase 3 PASI 90 rates of 68.0% and 62.1% in ONWARD1 and ONWARD2 at Week 24 — with rapid
              onset (PASI 90 separation from placebo by Week 4) and superiority to apremilast on all endpoints — place
              it at or near the upper boundary of published oral therapy outcomes in moderate-to-severe plaque
              psoriasis. The maximal IC90 TYK2 inhibition sustained over 24 hours mechanistically explains this efficacy
              advantage over existing oral options and supports the twice-daily dosing regimen as optimal for sustained
              pathway suppression.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE031
          - type: callout
            title: Twice-daily dosing and absence of head-to-head data vs deucravacitinib are commercial risks
            body: >-
              Deucravacitinib (Sotyktu) is FDA-approved, commercially established, and dosed once daily. Envudeucitinib
              requires twice-daily dosing, which is a formulary and patient adherence disadvantage in the absence of
              head-to-head comparative data demonstrating superior efficacy or safety vs the incumbent. Indirect
              cross-trial comparisons are confounded by different trial designs, patient populations, and comparator
              arms. Physician prescribing inertia in the TYK2 class combined with Alumis's pre-revenue status creates
              meaningful commercial execution risk even if the NDA is approved on schedule.
            calloutType: risk
            claimRefs:
              - CE008
              - CE034
              - CE036
          - type: callout
            title: A-005 CNS penetrance opens a wholly differentiated second franchise with high optionality
            body: >-
              A-005's confirmed blood-brain barrier penetrance and IC90 CSF TYK2 inhibition from Phase 1 and ECTRIMS
              2025 data opens a competitive space that deucravacitinib cannot address — neuroinflammatory disease. If
              Phase 2 data in MS patients confirm clinical efficacy, A-005 would be the first oral CNS-penetrant
              allosteric TYK2 inhibitor approved in neurology, accessing a high-value market dominated by expensive
              infusion biologics and injection-route therapies. The mechanism is wholly novel vs approved DMTs and, if
              effective, would extend the TYK2 franchise into an indication with a different commercial risk profile
              than psoriasis.
            calloutType: insight
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Patient Population Segmentation
        blocks:
          - type: paragraph
            body: >
              Alumis operates as a pre-commercial clinical-stage company; no revenue-generating customers exist as of
              May 2026. The customer framework is therefore forward-looking, segmented across three principal axes:
              patients, prescribers, and payers.

              The primary patient segment is US adults with moderate-to-severe plaque psoriasis. The National Psoriasis
              Foundation reports 7.5 million US adults have psoriasis as of March 2026, with approximately 1.9 million
              (roughly 1 in 4) meeting the moderate-to-severe threshold that justifies systemic therapy -- the direct
              addressable universe for envudeucitinib. Plaque psoriasis constitutes 80-90% of all psoriasis
              presentations and is the sole Phase 3 indication pursued.

              Two expansion segments are in clinical development. Psoriatic arthritis affects approximately 912,000 US
              adults per NHANES 2017-2020 (ACR 2024), and Sotyktu received FDA approval for PsA in March 2026,
              validating TYK2 inhibition in joint disease. Systemic lupus erythematosus affects approximately 204,000 US
              adults per CDC estimates; Alumis's Phase 2b LUMUS trial has topline data expected Q3 2026.

              Prescriber customers are US dermatologists (~12,000-13,000 practicing) and rheumatologists (~6,500-7,000).
              Payer customers -- commercial health plans and PBMs -- represent the third axis; UHC and Cigna already
              impose step-therapy prior authorisation for Sotyktu, establishing the formulary precedent envudeucitinib
              will face.

              The global psoriasis drugs market was $20.05 billion in 2025, growing to an estimated $32.94 billion by
              2031 at 8.63% CAGR; oral small molecules (including TYK2 inhibitors) are the fastest-growing segment at
              nearly 15% CAGR.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
