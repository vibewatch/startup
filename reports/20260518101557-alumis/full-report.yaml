  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Therapeutic pipeline and product-line map
        blocks:
          - type: paragraph
            body: >-
              Alumis is organized around a TYK2 franchise: two clinical-stage allosteric inhibitors of the JH2
              pseudokinase domain of TYK2, a precision data analytics platform that rationally guides their deployment,
              and preclinical programs identified through the same platform. The lead asset is envudeucitinib (formerly
              ESK-001), an oral, highly selective, non-covalent small-molecule allosteric TYK2 inhibitor dosed twice
              daily at 40 mg. It is in Phase 3 for moderate-to-severe plaque psoriasis (ONWARD program), Phase 2b for
              systemic lupus erythematosus (LUMUS), and being profiled for additional immune-mediated diseases including
              psoriatic arthritis and rheumatoid arthritis. A-005 is a second-generation CNS-penetrant allosteric TYK2
              inhibitor designed to cross the blood-brain barrier at pharmacologically relevant concentrations; it
              completed Phase 1 and is advancing to Phase 2 in multiple sclerosis in 2026. Lonigutamab, a subcutaneously
              delivered anti-IGF-1R monoclonal antibody for thyroid eye disease acquired via the ACELYRIN merger, is
              under strategic review as of Q1 2026. Beyond TYK2, the precision analytics platform has identified IRF5
              and additional undisclosed targets, with at least one internally-developed program expected to report
              Phase 1 data in H2 2026. Alumis retains global rights for all assets except envudeucitinib in Japan (Kaken
              Pharmaceutical holds exclusive Japan dermatology rights).
            claimRefs:
              - CE001
