            body: >-
              The public record supports a milestone chronology running from Alumis's 2021 founding through its January
              2026 capital raise and concurrent Phase 3 results announcement. The financing history is well documented
              by press releases and SEC filings. The 2021 Series A ($70M) represents the founding capital when the
