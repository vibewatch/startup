  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model: pre-commercial with first licensing income from Kaken Japan deal'
        blocks:
          - type: paragraph
            body: >-
              Alumis is a clinical-stage biopharmaceutical company with no commercial product on the market. As of May
              2026, the company has never generated revenue from drug sales. For fiscal year 2025, total reported
              revenue was $24.05 million, consisting of $17.39 million in license revenue and $6.66 million in
              collaboration revenue—both sourced exclusively from the collaboration and licensing agreement signed with
              Kaken Pharmaceutical Co., Ltd. in March 2025. The Kaken deal grants Kaken the rights to develop,
              manufacture, and commercialize ESK-001 (envudeucitinib) as a dermatology therapy in Japan, in exchange for
              $40 million in upfront and near-term co-development payments across 2025–2026, potential milestone and
              field option payments of up to approximately $140 million, and tiered royalties ranging from low
              double-digits to approximately 20% of Japan net sales.


              The revenue recognition profile follows ASC 606: the $17.4 million license obligation was recognized upon
              the March 2025 transfer of the license to Kaken; the development services and manufacturing services
              obligations are being recognized over time using an input method as Alumis performs its services. As of
              December 31, 2025, $17.6 million in transaction price remained unsatisfied and deferred—$14.3 million
              related to development services expected to be recognized through 2028, and $3.3 million related to a
              material right option that will be recognized when the option is exercised or expires.


              Prior to the Kaken deal, Alumis generated zero revenue in 2024. Any future commercial revenue depends
              entirely on FDA approval of envudeucitinib (NDA submission planned 2H 2026), successful market launch in
              psoriasis, and clinical readout in SLE (Phase 2b LUMUS trial data anticipated Q3 2026). Revenue from a
              potential Japanese commercial launch by Kaken would generate royalties but is years away. The pricing
              model for a US commercial launch—if envudeucitinib is approved—has not been publicly disclosed by
              management. Industry benchmarks for oral TYK2 inhibitors suggest a likely annual treatment cost in the
              five-figure range (Bristol Myers Squibb's approved TYK2 inhibitor Sotyktu carries a US list price of
              approximately $65,000 per year). Alumis has not confirmed any pricing assumptions.
