  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Alumis's primary regulatory risk is the FDA NDA review for envudeucitinib in plaque psoriasis, planned for
              submission in H2 2026. Although ONWARD1 and ONWARD2 met all primary and secondary endpoints with high
              statistical significance—74% PASI 75 and 59% sPGA 0/1 at Week 16, deepening to approximately 65% PASI 90
              and over 40% PASI 100 by Week 24—NDA approval is not guaranteed. The FDA may issue a complete response
              letter (CRL) citing Chemistry, Manufacturing and Controls (CMC) deficiencies at CDMOs, request additional
              safety data from the ONWARD3 long-term extension, or require a Risk Evaluation and Mitigation Strategy
              (REMS) that constrains commercial uptake. The standard NDA review cycle is 10 months from filing; a
              Priority Review would compress this to 6 months. Alumis's 10-K explicitly acknowledges that regulatory
              authorities may disagree with study design, interpretation of data, or impose additional requirements even
              after reviewing clinical trial design.

              The TYK2-class labeling question is partially resolved. Deucravacitinib (Sotyktu), the only approved TYK2
              inhibitor, does not carry the JAK inhibitor boxed warning for major adverse cardiovascular events, cancer,
              thrombosis, and death that was mandated for tofacitinib, baricitinib, upadacitinib, and ruxolitinib.
              However, Sotyktu's label does include prominent warnings on infections, tuberculosis, malignancy, and
              hypersensitivity, and explicitly states that it is not known whether TYK2 inhibition may be associated
              with the observed or potential adverse reactions of JAK inhibition. For envu, this creates residual
              labeling uncertainty—the FDA may apply similar precautionary language that could affect prescriber
              adoption, particularly in cardiovascular-risk patient populations.

              Legal risk is elevated by two active matters. The ACELYRIN securities class action, filed on behalf of IPO
              investors alleging materially false and misleading statements about izokibep, was inherited through the
              May 21, 2025 ACELYRIN Merger. Defendants filed a motion to dismiss the second amended complaint on
              February 19, 2026; the litigation remains active. A separate lawsuit by Climb Bio against Alumis and
              ACELYRIN disputes a milestone payment obligation on the budoprutug asset. Neither matter has been
              resolved, and Alumis's Q1 2026 earnings commentary flagged this litigation as a source of management
              distraction and potential financial liability. IP risk is moderate: Alumis holds patents on envu's
              chemistry and process, and BMS Sotyktu's core compound patents expire November 7, 2033, meaning no
              authorized generic competition for the TYK2 class before that date in the U.S.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
