      - number: '3.5'
        title: Moat Analysis and Competitive Risk
        blocks:
          - type: paragraph
            body: >-
              Alumis's potential competitive moats rest on three reinforcing layers. First, ESK-001's molecular
              profile—maximal 24-hour TYK2 inhibition with demonstrated absence of new safety signals across Phase 2 and
              Phase 3 studies—positions it as a potential clinical step-up over Sotyktu, pending head-to-head
              validation. Second, pipeline breadth provides strategic optionality beyond psoriasis: Alumis's LUMUS Phase
              2b trial in SLE completed enrollment with topline data expected Q3 2026, and A-005, a CNS-penetrant
              allosteric TYK2 inhibitor, has Phase 2 initiation in multiple sclerosis planned for 1H 2026. A-005 Phase 1
              data presented at ACTRIMS Forum 2025 confirmed cerebrospinal fluid drug levels comparable to or exceeding
              plasma levels, validating the CNS penetrance hypothesis. Third, a public capital structure with
              approximately $529 million in total raised capital provides access to equity markets to fund commercial
              build or partnership without near-term dilutive pressure.

              Competitive risks are material and multi-dimensional. Icotyde's FDA approval in March 2026 with proven
              head-to-head superiority over Sotyktu narrows the oral residual market available to ESK-001 before its
              expected commercial entry around 2H 2027 post-NDA filing and standard 10-month review. Zasocitinib's Phase
              3 PASI 90 data are directionally competitive with ESK-001's, making a two-TYK2-inhibitor oral market
              plausible where ESK-001 becomes a third entrant rather than the primary disruptor. Takeda's integrated
              immunology commercial infrastructure—built through the global Entyvio franchise—gives zasocitinib a
              significant launch execution advantage over a first-product commercial organization. BMS's $950/month
              direct-to-patient pricing precedent for Sotyktu compresses class-level gross margin expectations before
              ESK-001 reaches market. Additionally, VTX958's Phase 2 SLE failure in 2023 demonstrates that TYK2
              inhibition does not automatically translate across autoimmune indications, creating pipeline risk for
              Alumis's LUMUS program—though LUMUS differs in design and patient selection from the failed Ventyx study.

              Switching costs in the psoriasis market are moderate: patients on effective therapy rarely switch without
              loss of response, and step-edit formulary requirements delay initial brand access by months post-approval.
              Distribution power resides with specialty PBMs—Express Scripts, CVS Caremark, OptumRx—and specialty
              pharmacies with which Alumis has no pre-existing contractual relationships. PBM contracting capability is
              a first-product execution risk specific to a company with no commercial history.
