            body: >
              Alumis earns a buy rating driven by class-leading Phase 3 efficacy, a $569.5M cash cushion, and analyst
              consensus implying ~60% upside to the $40 price target. The H2 2026 NDA filing is the key binary catalyst.
              Position sizing should reflect the single-asset concentration risk and elevated short interest of ~15.5%
              of float.
