      - number: '3.3'
        title: Biologic Incumbent Landscape
        blocks:
          - type: paragraph
            body: >-
              Injectable biologics remain the clinical gold standard for moderate-to-severe psoriasis and define the
              efficacy ceiling that oral agents must approach to shift treatment algorithms meaningfully. The global
              biologic medications for psoriasis market was valued at approximately $14.5 billion in 2025, projected at
              $16.2 billion in 2026 at roughly 7–9% annual growth. IL-17 and IL-23 inhibitors collectively generate over
              $30 billion per year across psoriasis and adjacent indications including PsA.

              AbbVie's Skyrizi (risankizumab, IL-23 inhibitor) and Novartis's Cosentyx (secukinumab, IL-17A inhibitor)
              lead the biologic psoriasis market by revenue and prescriber share in 2026. Skyrizi is the fastest-growing
              biologic in the segment by volume; Cosentyx retains the broadest global commercial footprint. Eli Lilly's
              Taltz (ixekizumab, IL-17A) holds strong North American share. UCB's Bimzelx (bimekizumab, dual IL-17A/F
              inhibitor) is a recent entrant gaining share rapidly through its differentiated dual-IL-17 blockade.
              Johnson and Johnson's Stelara (ustekinumab, IL-12/23) faces biosimilar competition following US patent
              expiry in 2023 but retains use in PsA. Skyrizi typically achieves 65–75% PASI 90 and over 50% PASI 100 in
              pivotal trials, the benchmark ESK-001 must approach to support a near-biologic efficacy narrative for
              needle-averse patients.

              The strategic relevance of biologics to Alumis is as the efficacy ceiling ESK-001 must approximate, not
              displace wholesale. TYK2 inhibitors achieve anti-inflammatory effect by blocking cytokine signaling
              through IL-23, IL-12, and type-I interferon pathways via allosteric inhibition of the TYK2 JH2
              pseudokinase domain, providing IL-23/IL-17 pathway suppression through a single oral mechanism that
              approximates targeted biologic activity. JAK inhibitors achieve similar but less selective
              immunosuppression via ATP-competitive kinase inhibition. Status-quo therapy—topical corticosteroids,
              methotrexate, cyclosporine, and phototherapy—constitutes the first-line standard patients cycle through
              before reaching advanced systemics. Biologic injectable list prices of $40,000–$50,000 annually contrast
              sharply with oral TYK2 agent list prices of $6,000–$7,000 per month, providing cost and convenience
              rationales that support oral adoption among biologic-naive and needle-averse populations.
