  - id: FU001
    title: 'Patient Journey Map: Envudeucitinib Access Pathway'
    slug: customer-journey-map
    type: journey-map
    layout: standard
    summary: >-
      Illustrative patient journey from psoriasis diagnosis through step-therapy gatekeeping to envudeucitinib
      prescription, highlighting payer and prescriber touchpoints.
    data:
      items:
        - label: Diagnosis
          description: >-
            Patient presents to dermatologist with plaque psoriasis (PASI >=12, BSA >=10%); moderate-to-severe
            classification established.
        - label: Topical Failure Required
          description: >-
            Required step: documented failure of topical corticosteroid or vitamin D analogue; typically 4-8 weeks.
            Payer PA prerequisite.
        - label: Conventional Systemic Step
          description: >-
            Required by UHC/Cigna: 3-month methotrexate trial or prior failure/intolerance of an approved systemic
            targeted agent.
        - label: Payer Prior Auth Submission
          description: >-
            Dermatologist submits PA with step failure documentation; UHC grants 12-month auth; Cigna requires
            conventional systemic failure attestation.
        - label: Prescriber Treatment Decision
          description: >-
            Dermatologist selects from formulary-approved systemic agents; biologics preferred for highest severity;
            TYK2 for oral-preferring patients.
        - label: Envudeucitinib Initiation
          description: >-
            Patient starts envudeucitinib 40 mg BID (pending NDA approval H2 2026); specialty pharmacy dispenses;
            patient support programme not yet disclosed.
        - label: Persistence Gate
          description: >-
            Week 4/16/24 response assessment; PASI 75/90 response triggers continuation; non-responders switch; >70%
            12-month persistence is the biologic class benchmark.
    sourceRefs:
      - SU006
      - SU012
      - SU013
      - SU024
    claimRefs:
      - CU007
      - CU023
    notes: >-
      Illustrative journey based on UHC and Cigna PA policies; individual payer workflows vary. Pre-commercial; Alumis
      has not disclosed patient support programme details.
