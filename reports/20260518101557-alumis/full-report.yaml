      - number: '6.4'
        title: Sotyktu Adoption Trajectory as Commercial Comparator
        blocks:
          - type: paragraph
            body: >
              Sotyktu (deucravacitinib, BMS) is the only approved TYK2 inhibitor and serves as the most instructive
              commercial comparator for envudeucitinib's expected launch curve.

              Sotyktu was approved in September 2022. Global net sales were approximately $246 million in 2024 and grew
              ~19% to $291 million in 2025 -- directionally positive but well below the blockbuster trajectory
              originally forecast. GlobalData's peak sales projection of $2.9 billion by 2029 implies roughly tenfold
              growth from 2025, requiring sustained double-digit annual growth for four consecutive years.

              The Recon Strategy adverse analysis identifies the core headwinds: dermatologist perception of Sotyktu's
              efficacy as insufficient to displace high-efficacy biologics, combined with access friction that depresses
              net patient volume even when prescriptions are written. The comparison to subcutaneous IL-17 and IL-23
              agents (PASI 90 rates of 70-80%; PASI 100 of 40-55%) remains unfavourable for TYK2 in prescriber- guided
              treatment initiation, though oral convenience is a patient preference differentiator.

              For Alumis, the lesson is that efficacy data alone is insufficient -- payer contracting, prescriber
              education, and formulary positioning must accompany launch to avoid Sotyktu-like adoption inertia.
              Envudeucitinib's PASI 100 rates (~40%) and the apremilast superiority claim could support a differentiated
              formulary message, but head-to-head data versus Sotyktu do not exist.
            claimRefs:
