      - number: '5.3'
        title: A-005 CNS program and precision medicine platform
        blocks:
          - type: paragraph
            body: >-
              A-005 extends the TYK2 franchise into the central nervous system. The compound is designed to cross the
              blood-brain barrier, targeting neuroinflammatory conditions where TYK2 has a genetic rationale — primarily
              multiple sclerosis, but also potentially Parkinson's disease and other neurodegenerative conditions. In a
              Phase 1 study of 135 healthy participants, A-005 demonstrated dose-proportional pharmacokinetics,
              prolonged CSF exposure with concentrations comparable to or exceeding free drug plasma concentrations, and
              maximal TYK2 inhibition evidenced by pSTAT level changes. ECTRIMS 2025 pharmacology data further confirmed
              the approximately 1:1 plasma-to-CSF free drug ratio exceeding the IC90 threshold from cell-based assays.
              No serious adverse events were reported. A Phase 2 trial in multiple sclerosis is anticipated to initiate
              in H1 2026. If A-005 succeeds in MS, it would be the first approved oral CNS-penetrant allosteric TYK2
              inhibitor for neuroinflammation.

              Alumis's precision data analytics platform is the enabling infrastructure driving both asset discovery and
              clinical biomarker strategy. The platform integrates genomic, proteomic, and clinical data to identify
              disease drivers, patient subtypes, and predictive biomarkers. In psoriasis, the STRIDE Phase 2 biomarker
              analyses demonstrated that envudeucitinib normalizes key cytokines and proteins in lesional skin —
              including IL-23, IL-17F, IL-22, IL-23A, IL-36A, DEFB4A, KRT16, and S100A9 — to levels observed in
              nonlesional tissue. Dose-dependent blood SIGLEC1 suppression from Week 2 in STRIDE provided early
              pharmacodynamic confirmation of maximal TYK2 pathway engagement at 40 mg BID. These biomarker signatures
              inform dose selection and patient enrichment strategies for the SLE and CNS programs. Alumis was incubated
              by Foresite Labs (Foresite Capital affiliate), which continues to provide genetic target exploration
              services under an agreement through December 2026. TYK2 genomic analyses by Alumis identify contributions
              to approximately 20 immune-mediated conditions, providing the rational basis for the multi-indication
              franchise strategy.
