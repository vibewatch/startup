      - number: '7.3'
        title: Competitive and Technology Risk
        blocks:
          - type: paragraph
            body: >-
              The TYK2 inhibitor competitive landscape has intensified materially in 2026. Takeda's zasocitinib
              (acquired from Nimbus Therapeutics for $4 billion in 2022) delivered Phase 3 LATITUDE data at the 2026
              American Academy of Dermatology meeting showing PASI 90 rates of 61.3% and 51.9% in two trials at Week 16,
              with PASI 100 of 33.4% and 25.2%. Takeda plans to file for U.S. approval in its fiscal year 2026 and
              forecasts peak revenue of $3–6 billion. The critical dosing differentiation is that zasocitinib is
              once-daily, while envudeucitinib is twice-daily—a potentially material adherence disadvantage in a primary
              care and dermatology setting where JAK and TYK2 inhibitors compete on convenience. Takeda's president of
              R&D publicly identified dosing as an area of "considerable differentiation" over Alumis.

              BMS Sotyktu (deucravacitinib), the first-mover, achieved PASI 90 rates of only 32–42% in Phase 3 and is
              being outcompeted on efficacy by both zasocitinib and envu; however, BMS received FDA approval for Sotyktu
              in psoriatic arthritis in March 2026, expanding its commercial moat while Alumis has no approved product.
              J&J and Protagonist's Icotyde (injectable IL-23 receptor antagonist) received FDA approval based on PASI
              90 rates up to 55% at Week 16, adding a high-efficacy injectable competitor at the time envu enters the
              market.

              The Ventyx Biosciences VTX958 program provides a cautionary read-across. VTX958 is an allosteric TYK2
              inhibitor that failed its primary symptomatic endpoint in both a Phase 2 psoriasis trial (insufficient
              efficacy vs. the competitive bar, November 2023) and a Phase 2 Crohn's disease trial (missed CDAI primary
              endpoint despite dose-dependent endoscopic improvement). Ventyx discontinued internal development of
              VTX958. While envudeucitinib is mechanistically distinct (it achieves maximal TYK2 inhibition blocking
              both IL-23/IL-17 and Type I interferon), the VTX958 failures demonstrate that allosteric TYK2 inhibitors
              as a class do not guarantee efficacy in every immune indication. The SLE indication, in particular, shows
              mixed evidence across the class. If LUMUS fails, the read-across to other immune indications would be
              questioned.

              Chinese pharmaceutical companies are also filing TYK2 patents at accelerating rates, representing a
              longer-term competitive and IP pressure vector internationally, particularly in Asia-Pacific markets where
              the global TYK2 opportunity extends.
            claimRefs:
