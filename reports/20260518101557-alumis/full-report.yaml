      - number: '1.2'
        title: Founders, leadership, and governance
        blocks:
          - type: paragraph
            body: >-
              Martin Babler serves as President, Chief Executive Officer, and Chairman of the Board of Alumis. He joined
              the company in September 2021 and has been the public face of the organization across all major financing
              events and clinical milestones. Babler brings deep small-molecule immunology operating experience from
              prior roles as President and CEO of Principia Biopharma, which was acquired by Sanofi for approximately
              $3.7 billion in 2021, and from senior positions at Genentech and Eli Lilly. His operator-to-acquisition
              track record in the same therapeutic area is a significant investor signal and explains Alumis's ability
              to raise $259 million in Series C financing during a challenging 2024 private biotech market.


              Jörn Drappa, MD, PhD serves as Chief Medical Officer and has been named in all Phase 3 results
              announcements; his scientific commentary has been the primary technical voice of the company in external
              disclosures. John Schroer serves as Chief Financial Officer and led the company's capital markets activity
              through the IPO and follow-on offering. Roy Hardiman serves as Chief Business and Legal Officer. Mark
              Bradley serves as Chief Development Officer, with responsibility for clinical operations including the
              ONWARD and LUMUS programs.


              The Alumis board of directors as of the run date includes Martin Babler as Chairman; Srinivas Akkaraju, a
              prominent life sciences investor; Jim Tananbaum, founder and CEO of Foresite Capital, reflecting
              Foresite's ongoing board-level engagement with the company it incubated; Alan Colowick, Sapna Srivastava,
              Zhengbin Yao (President and CEO of Zymeworks), and Patrick Machado. The company has not publicly disclosed
              a COO, named successor plan, or operational deputy to Babler, creating key-person concentration risk for a
              pre-commercial biotech company at a pivotal regulatory juncture.


              The original founding team that launched the company under the Esker Therapeutics name in 2021 is not
              fully disclosed in currently available public sources. The company's public narrative attributes founding
              to its emergence from Foresite Labs incubation with Martin Babler as a founding operator-CEO; no other
              founding co-inventor names are confirmed from fetched sources.
