artifact: customers
slug: alumis
runDate: '2026-05-18'
company:
  name: Alumis Inc.
chapter:
  number: 6
  title: "Customers"
  summary: >
    Alumis is pre-commercial; no paying customers exist as of May 2026. The
    addressable patient universe spans 7.5 million US adults with plaque
    psoriasis (~1.9 million moderate-to-severe), ~912,000 with psoriatic
    arthritis, and ~204,000 with systemic lupus erythematosus. Prescriber
    customers are US dermatologists (~12,000-13,000 practicing) and
    rheumatologists (~6,500-7,000). Commercial payers -- PBMs and health
    plans -- represent the third customer axis; UnitedHealthcare and Cigna
    already impose step-therapy and prior authorisation for Sotyktu,
    establishing the access precedent for envudeucitinib. Phase 3 ONWARD data
    (March 2026) achieved all primary and secondary endpoints with PASI 90 of
    ~65% and PASI 100 of ~40% at week 24, among the strongest efficacy results
    ever reported for an oral psoriasis therapy. Risk centres on Sotyktu's
    slow commercial ramp -- a cautionary precedent -- and on envudeucitinib's
    single-asset, single-indication concentration as of this writing.

sections:
  - id: SU001
    title: "Patient Population Segmentation"
    order: 1
    body: >
      Alumis operates as a pre-commercial clinical-stage company; no
      revenue-generating customers exist as of May 2026. The customer
      framework is therefore forward-looking, segmented across three
      principal axes: patients, prescribers, and payers.

      The primary patient segment is US adults with moderate-to-severe
      plaque psoriasis. The National Psoriasis Foundation reports 7.5 million
      US adults have psoriasis as of March 2026, with approximately 1.9
      million (roughly 1 in 4) meeting the moderate-to-severe threshold that
      justifies systemic therapy -- the direct addressable universe for
      envudeucitinib. Plaque psoriasis constitutes 80-90% of all psoriasis
      presentations and is the sole Phase 3 indication pursued.

      Two expansion segments are in clinical development. Psoriatic arthritis
      affects approximately 912,000 US adults per NHANES 2017-2020 (ACR
      2024), and Sotyktu received FDA approval for PsA in March 2026,
      validating TYK2 inhibition in joint disease. Systemic lupus
      erythematosus affects approximately 204,000 US adults per CDC
      estimates; Alumis's Phase 2b LUMUS trial has topline data expected
      Q3 2026.

      Prescriber customers are US dermatologists (~12,000-13,000 practicing)
      and rheumatologists (~6,500-7,000). Payer customers -- commercial
      health plans and PBMs -- represent the third axis; UHC and Cigna
      already impose step-therapy prior authorisation for Sotyktu,
      establishing the formulary precedent envudeucitinib will face.

      The global psoriasis drugs market was $20.05 billion in 2025, growing
      to an estimated $32.94 billion by 2031 at 8.63% CAGR; oral small
      molecules (including TYK2 inhibitors) are the fastest-growing segment
      at nearly 15% CAGR.
    tableRefs: [TU001]
    figureRefs: [FU001]
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007]

  - id: SU002
    title: "Prescribers, Payers, and Access Architecture"
    order: 2
    body: >
      Despite envudeucitinib's strong clinical profile, the prescriber and
      payer access landscape presents material adoption headwinds, as
      illustrated by Sotyktu's commercial trajectory.

      On the prescriber side, a December 2025 Recon Strategy analysis of
      Deutsche Bank survey data found that 50% of US dermatologists ranked
      Sotyktu seventh or eighth among systemic therapies on efficacy, and
      65% ranked it in the bottom two on pricing and access. This prescriber
      tepidity reflects both clinical conservatism -- high-efficacy biologics
      (IL-17 and IL-23 agents with monthly or quarterly dosing) remain
      preferred -- and formulary friction that limits patient access. BMS
      acknowledged the access problem explicitly when it launched a DTC
      campaign in September 2025 at more than 80% below list price
      ($6,678/30-day WAC).

      On the payer side, UnitedHealthcare's prior authorisation policy
      (current 2026) requires documented topical corticosteroid failure plus
      a 3-month methotrexate trial or prior failure of an FDA-approved
      systemic targeted agent, with prescribing dermatologist attestation and
      a 12-month authorisation. Cigna's March 2026 policy revision similarly
      requires topical and conventional systemic failure before coverage.
      These two payers collectively cover more than 55 million commercial
      lives, making step-therapy compliance a de facto prerequisite for any
      TYK2 inhibitor to achieve meaningful script volume.

      For envudeucitinib, this means the practical first-access addressable
      universe is the subset of moderate-to-severe psoriasis patients who have
      already failed topicals, methotrexate, and biologics -- a narrower and
      more medically complex cohort than the full 1.9 million.
    tableRefs: [TU004]
    figureRefs: [FU002]
    claimRefs: [CU019, CU020, CU021, CU022, CU023]

  - id: SU003
    title: "Trial Evidence and Named Stakeholder Proof"
    order: 3
    body: >
      The most concrete customer evidence available pre-launch derives from
      the ONWARD Phase 3 programme -- 1,700+ patients randomised across 156
      global investigator sites in ONWARD1 (NCT06586112) and ONWARD2
      (NCT06588738), with enrollment completed May 2025 and topline data
      presented at AAD 2026 on March 28.

      Efficacy results were exceptional for an oral agent. At week 16,
      approximately 74% of envudeucitinib patients achieved PASI 75 and
      59.5% reached sPGA 0/1, meeting both co-primary endpoints with
      statistical significance (p<0.001) in both trials. By week 24,
      approximately 65% achieved PASI 90 and approximately 40% achieved
      PASI 100 -- efficacy rankings that rival or exceed several marketed
      biologics in indirect comparisons. Envudeucitinib outperformed
      apremilast on all PASI endpoints at week 24, delivering a key secondary
      win that supports formulary differentiation. Itch relief (patient-
      reported NRS score) was detectable by week 2, providing rapid patient-
      perceived benefit that supports adherence and word-of-mouth demand.

      The safety profile through week 24 was consistent with prior Phase 2
      data; adverse events were mostly mild-to-moderate (nasopharyngitis,
      headache, acne, upper respiratory infections) with no new safety
      signals.

      Dr. Andrew Blauvelt, MD, MBA (Blauvelt Consulting) -- a well-published
      TYK2 expert and former Oregon Medical Research Center faculty -- served
      as a principal ONWARD investigator and presented results at AAD 2026.
      The National Psoriasis Foundation highlighted envudeucitinib as an oral
      breakthrough candidate in its AAD 2026 coverage, lending patient-
      advocacy credibility that complements the clinical evidence.
    tableRefs: [TU003]
    figureRefs: [FU003]
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU013, CU014, CU015, CU016, CU030, CU037]

  - id: SU004
    title: "Sotyktu Adoption Trajectory as Commercial Comparator"
    order: 4
    body: >
      Sotyktu (deucravacitinib, BMS) is the only approved TYK2 inhibitor
      and serves as the most instructive commercial comparator for
      envudeucitinib's expected launch curve.

      Sotyktu was approved in September 2022. Global net sales were
      approximately $246 million in 2024 and grew ~19% to $291 million in
      2025 -- directionally positive but well below the blockbuster
      trajectory originally forecast. GlobalData's peak sales projection of
      $2.9 billion by 2029 implies roughly tenfold growth from 2025, requiring
      sustained double-digit annual growth for four consecutive years.

      The Recon Strategy adverse analysis identifies the core headwinds:
      dermatologist perception of Sotyktu's efficacy as insufficient to
      displace high-efficacy biologics, combined with access friction that
      depresses net patient volume even when prescriptions are written. The
      comparison to subcutaneous IL-17 and IL-23 agents (PASI 90 rates of
      70-80%; PASI 100 of 40-55%) remains unfavourable for TYK2 in prescriber-
      guided treatment initiation, though oral convenience is a patient
      preference differentiator.

      For Alumis, the lesson is that efficacy data alone is insufficient --
      payer contracting, prescriber education, and formulary positioning must
      accompany launch to avoid Sotyktu-like adoption inertia.
      Envudeucitinib's PASI 100 rates (~40%) and the apremilast superiority
      claim could support a differentiated formulary message, but head-to-head
      data versus Sotyktu do not exist.
    tableRefs: [TU002]
    claimRefs: [CU017, CU018, CU019, CU020, CU038]

  - id: SU005
    title: "Expansion Pathways and Concentration Risk"
    order: 5
    body: >
      As of May 2026, Alumis has a single asset in a single approved
      indication (NDA planned H2 2026), representing acute concentration risk
      on both the commercial and scientific dimensions.

      The most near-term customer expansion pathway is psoriatic arthritis.
      With Sotyktu receiving FDA PsA approval in March 2026, the regulatory
      precedent for TYK2 inhibition in joint disease is established. However,
      Alumis has not yet disclosed a pivotal PsA trial design, making this
      segment speculative beyond Phase 2 data. The NHANES-derived PsA
      prevalence of ~912,000 US adults represents a meaningful patient
      segment, but the commercial window depends on Phase 3 data not yet
      available.

      The SLE expansion (LUMUS Phase 2b, topline Q3 2026) is more imminent
      but earlier in development. A positive LUMUS readout would unlock an
      incremental patient segment of ~204,000 US adults; a negative result
      would eliminate SLE as a near-term customer opportunity.

      Competitive concentration risk derives from the TYK2 and oral
      immunology pipeline. PatSnap data identifies multiple late-stage TYK2
      programmes (Takeda, Boehringer Ingelheim, Sun Pharma) alongside next-
      generation IL-17/IL-23 biologics. BID dosing for envudeucitinib is a
      patient convenience disadvantage versus QD alternatives; Alumis is
      developing a QD modified-release formulation, but this is not yet in
      pivotal trials. Alumis has not disclosed a specialty pharmacy partner,
      hub services contract, or patient support programme as of May 2026,
      leaving the commercial infrastructure pathway unverified.
    tableRefs: [TU005]
    figureRefs: [FU004]
    claimRefs: [CU028, CU029, CU031, CU032, CU033, CU034]

