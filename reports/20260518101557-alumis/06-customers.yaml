    sourceRefs: [SU013, SU014]
    claimRefs: [CU024, CU025, CU026, CU027, CU028]
    notes: "Adherence estimates from peer-reviewed real-world studies across France, Japan, Germany, and the US; not specific to envudeucitinib. Envudeucitinib real-world data does not exist pre-launch; the fifth row is an analyst risk projection only."

