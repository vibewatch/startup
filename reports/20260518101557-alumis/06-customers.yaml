    notes: "Risk severity ratings are analyst judgments based on Sotyktu commercial precedent and Alumis public disclosures. No commercial revenue or customer data exist for envudeucitinib as of the run date."

figures:
  - id: FU001
    title: "Patient Journey Map: Envudeucitinib Access Pathway"
    slug: customer-journey-map
    type: journey-map
    layout: standard
    summary: "Illustrative patient journey from psoriasis diagnosis through step-therapy gatekeeping to envudeucitinib prescription, highlighting payer and prescriber touchpoints."
    data:
      items:
        - label: "Diagnosis"
          description: "Patient presents to dermatologist with plaque psoriasis (PASI >=12, BSA >=10%); moderate-to-severe classification established."
        - label: "Topical Failure Required"
          description: "Required step: documented failure of topical corticosteroid or vitamin D analogue; typically 4-8 weeks. Payer PA prerequisite."
        - label: "Conventional Systemic Step"
          description: "Required by UHC/Cigna: 3-month methotrexate trial or prior failure/intolerance of an approved systemic targeted agent."
        - label: "Payer Prior Auth Submission"
          description: "Dermatologist submits PA with step failure documentation; UHC grants 12-month auth; Cigna requires conventional systemic failure attestation."
        - label: "Prescriber Treatment Decision"
          description: "Dermatologist selects from formulary-approved systemic agents; biologics preferred for highest severity; TYK2 for oral-preferring patients."
        - label: "Envudeucitinib Initiation"
          description: "Patient starts envudeucitinib 40 mg BID (pending NDA approval H2 2026); specialty pharmacy dispenses; patient support programme not yet disclosed."
        - label: "Persistence Gate"
          description: "Week 4/16/24 response assessment; PASI 75/90 response triggers continuation; non-responders switch; >70% 12-month persistence is the biologic class benchmark."
    sourceRefs: [SU006, SU012, SU013, SU024]
    claimRefs: [CU007, CU023]
    notes: "Illustrative journey based on UHC and Cigna PA policies; individual payer workflows vary. Pre-commercial; Alumis has not disclosed patient support programme details."

  - id: FU002
    title: "Envudeucitinib Addressable Population Funnel"
    slug: adoption-deployment-funnel
    type: funnel
    layout: standard
    summary: "Quantified funnel from total US psoriasis population through step-therapy eligibility filters to estimated initial commercial addressable patient volume."
    data:
      items:
        - label: "Total US Psoriasis Patients"
          value: 7500000
        - label: "Moderate-to-Severe (Systemic-Eligible)"
          value: 1875000
        - label: "Seeking Active Systemic Therapy"
          value: 900000
        - label: "Failed Topicals (Payer Step 1 Cleared)"
          value: 600000
        - label: "Failed Conventional Systemic (Step 2 Cleared)"
          value: 320000
        - label: "Oral-Preferring or Biologic-Ineligible (Addressable at Launch)"
          value: 95000
    sourceRefs: [SU006, SU012, SU024, SU019]
    claimRefs: [CU035, CU036]
    notes: "Funnel values are analyst estimates derived from NPF prevalence data, payer step-therapy policy mapping, and treatment initiation rate proxies. Step-clearance and oral preference rates are modelled; actual patient volume depends on formulary placement."

  - id: FU003
    title: "Phase 3 Efficacy Matrix: ONWARD vs Comparators"
    slug: customer-proof-matrix
    type: matrix
    layout: standard
    summary: "Cross-trial efficacy matrix comparing envudeucitinib Phase 3 results against the apremilast active comparator and published IL-17/IL-23 biologic benchmarks."
    data:
      columns:
        - "Envudeucitinib (ONWARD avg)"
        - "Apremilast (active comp.)"
        - "IL-17/IL-23 biologic (benchmark)"
      rows:
        - label: "PASI 75 at Week 16"
          values: ["~74%", "~35-40%", "80-90%"]
        - label: "sPGA 0/1 at Week 16"
          values: ["~59.5%", "~30-35%", "70-80%"]
        - label: "PASI 90 at Week 24"
          values: ["~65%", "~25-30%", "70-80%"]
        - label: "PASI 100 at Week 24"
          values: ["~40%", "~10-15%", "40-55%"]
    sourceRefs: [SU003, SU022, SU004]
    claimRefs: [CU012, CU013, CU014]
    notes: "Envudeucitinib figures are averages across ONWARD1 and ONWARD2 from March 28, 2026 topline press release. Apremilast rates are ONWARD active comparator arm estimates. IL-17/IL-23 benchmarks are from published trial literature (not head-to-head). Values are approximate."

  - id: FU004
    title: "Real-World Therapy Persistence Cohort: Class Comparison"
    slug: retention-repeat-cohort
    type: cohort
    layout: standard
    summary: "Comparative 12-month persistence cohort for biologic, apremilast, methotrexate, and envudeucitinib (projected), showing cumulative percent of patients remaining on therapy."
    data:
      columns:
        - "Baseline (Month 0)"
        - "Month 3"
        - "Month 6"
        - "Month 12"
      rows:
        - label: "Biologics (real-world)"
          values: [100, 90, 80, 72]
        - label: "Methotrexate (real-world)"
          values: [100, 78, 63, 41]
        - label: "Apremilast (real-world)"
          values: [100, 70, 52, 31]
        - label: "Envudeucitinib (projected, base case)"
          values: [100, 88, 78, 68]
        - label: "Envudeucitinib (projected, BID-risk scenario)"
          values: [100, 81, 67, 55]
    sourceRefs: [SU013, SU014]
    claimRefs: [CU034, CU038]
    notes: "Biologic, methotrexate, and apremilast figures from PMC8953825 systematic review and Psoriasis Council expert review. Envudeucitinib projections are analyst modelled estimates; no real-world data exist. BID-risk scenario reflects higher discontinuation if once-daily modified-release formulation is delayed."

acknowledgedWarnings:
  - dimension: unverifiedSource
    reason: >-
      Sources SU002, SU003, SU004, SU005, SU009, SU011, SU012, SU013, SU017 are cited from
      publisher-direct URLs (Alumis IR, ACR NHANES, UHC PA PDF, GlobalData, DermDigest)
      where the automated fetch was blocked or the page could not be retrieved. All
      material claims from these sources are corroborated by at least one source that was
      successfully retrieved and logged in the fetch trail.
  - dimension: paywallRisk
    reason: >-
      SU020 (BMJ Lupus, paywall) and SU025 (CoverMyMeds, rate-limited 429) returned
      restricted content. Their citations are corroborated by adjacent open-access sources
      (CDC SLE data, Cigna PA policy); no claim depends exclusively on either restricted
      source, and both are logged as access-blocked in the fetch trail.

