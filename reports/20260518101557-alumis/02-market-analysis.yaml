company:
  name: Alumis Inc.

chapter:
  number: 2
  title: "Market Analysis"
  summary: >
    Alumis operates across three immunology indication markets — plaque psoriasis (~$12–24B global TAM, wide estimate range), psoriatic arthritis (~$14B global), and systemic lupus erythematosus (~$3.7B global) — collectively exceeding $30B in combined 2026 global spend. The oral TYK2 inhibitor class itself is a nascent sub-market (~$615M in 2026), dominated by BMS Sotyktu ($246M FY2024), with Alumis's envudeucitinib (ESK-001) NDA filing planned H2 2026 as the second entrant. Competitive intensity has accelerated materially: J&J/Protagonist ICOTYDE received FDA approval March 2026 (oral IL-23 antagonist with expected >$5B peak sales), and Takeda's zasocitinib Phase 3 data succeeded with NDA filing planned 2026, crowding the oral immunology pipeline. Growth drivers — oral preference, TYK2's clean safety profile vs. JAK inhibitors, and indication breadth — are real, but SAM/SOM constraints from payer pricing pressure, long-term safety monitoring requirements, and TYK2 class pricing compression make the commercial path narrower than the broad indication TAM implies.

