sections:
  - id: S01
    title: "Market Boundaries and Scope"
    body: >
      Alumis's primary addressable market spans three autoimmune indications: moderate-to-severe plaque psoriasis, psoriatic arthritis (PsA), and systemic lupus erythematosus (SLE). These indications share a common biology — dysregulated IL-23/IL-17 and Type I interferon signaling pathways — that TYK2 inhibition addresses mechanistically. The market boundary for this analysis is oral and injectable systemic therapies for moderate-to-severe disease; topical-only therapies and over-the-counter products are excluded. Biologics (anti-TNF, anti-IL-17, anti-IL-23) are included in the total indication TAM but not in the oral sub-market SAM that defines Alumis's primary competitive arena.

      The status-quo standard of care consists of: injectable biologics (AbbVie Skyrizi, Novartis Cosentyx, J&J Stelara, Amgen Enbrel/biosimilars) for patients with moderate-to-severe disease and prior systemic therapy failure; oral conventional DMARDs (methotrexate) and phosphodiesterase-4 inhibitors (Otezla/apremilast) for early systemic therapy; and, since September 2022, Sotyktu (deucravacitinib), the only approved oral TYK2 inhibitor pre-2026. A critical market shift occurred in March 2026 when J&J/Protagonist's ICOTYDE (oral IL-23 antagonist) received FDA approval, adding a new oral class that competes directly with TYK2 inhibitors for needle-averse patients seeking biologic-level efficacy. The oral immunology sub-market is accordingly no longer a single-product class as of Alumis's NDA submission cycle.

      Key inclusion/exclusion logic: SLE is included because Alumis has an active Phase 2b LUMUS program, but there is no approved TYK2 inhibitor for SLE as of May 2026. PsA is included because Sotyktu has European Commission approval for PsA and Alumis plans indication studies. The IBD (ulcerative colitis, Crohn's) adjacency is excluded from the primary TAM as Alumis has no active IBD program in its disclosed pipeline.
    tableRefs: [TM001]
    figureRefs: []

  - id: S02
    title: "Market Sizing: TAM, SAM, and SOM"
    body: >
      The combined global TAM across plaque psoriasis, PsA, and SLE exceeds USD 30 billion in 2026, computed by summing independently sized indication markets. Plaque psoriasis estimates range from USD 12.5–13.7 billion (conservative, narrowly scoped) to USD 23.8 billion (broader scope including all biologics used in psoriasis), reflecting definitional inconsistencies across analyst reports rather than true market volatility. PsA is estimated at USD 13.97 billion in 2026 (Fortune Business Insights), growing at ~11% CAGR through 2034. SLE is estimated at USD 3.68–3.71 billion in 2026, growing at 7.5–11.2% CAGR through 2031–2035 depending on the source. These are all-therapy TAM figures including biologics.

      The serviceable addressable market (SAM) for oral systemic therapy narrows significantly. In PsA, the oral segment holds approximately 20–28% of market revenue, with biologics commanding ~51–52%; applying oral share to the $14B PsA TAM implies a ~$3–4B oral PsA SAM. In psoriasis, the oral segment is substantially smaller relative to the biologic-dominant revenue base. The biologic psoriasis market alone is projected at $16.2 billion in 2026 (Intel Market Research), implying oral therapies represent a minor fraction today but one growing at the fastest rate. Combining oral-accessible share across the three indications yields a rough SAM of $5–9B for oral systemic immunology.

      The serviceable obtainable market (SOM) for the oral TYK2 inhibitor class specifically is estimated at ~USD 615 million in 2026 (Research and Markets), concentrated almost entirely in Sotyktu, with a CAGR of ~9.6% through 2032. This class-level SOM will expand as additional TYK2 inhibitors receive approval. Alumis's first-year SOM following NDA approval (expected 2027–2028 given H2 2026 filing) is not supportable from public data; it would depend on formulary access, pricing relative to Sotyktu and zasocitinib, and PASI 90/100 differentiation claims in prescriber detailing.
    tableRefs: [TM002]
    figureRefs: [FM001, FM002]

  - id: S03
    title: "Buyer and Segment Map"
    body: >
      The oral immunology market for plaque psoriasis, PsA, and SLE involves distinct buyer, user, and payer roles. The prescribing physician — primarily a board-certified dermatologist for psoriasis, a rheumatologist for PsA and SLE — makes the formulary-within-indication prescribing decision, but is constrained by payer prior authorization criteria, step-therapy requirements, and formulary tier placement. Patients are end users who exercise meaningful choice between orals and injectables, with needle aversion and administration convenience being documented adoption drivers for oral agents.

      Commercial payers (UnitedHealth, Cigna, Aetna, BCBS plans) and PBMs (Express Scripts, CVS Caremark, OptumRx) control formulary positioning through exclusion lists and step-therapy protocols, typically requiring failure of conventional DMARDs and/or apremilast before authorizing branded TYK2 or biologic therapy. Government payers (Medicare Part D, Medicaid) follow similar utilization management patterns but at lower net pricing after mandatory rebates. The effective payer is therefore the PBM/insurer, not the patient, for commercially meaningful volume.

      Segment-level adoption varies by indication: psoriasis patients skew younger, are often employed, and have private insurance coverage — making formulary tier directly relevant. SLE disproportionately affects women of reproductive age and people of color, with a higher Medicaid representation, where drug access timelines and rebate economics differ from commercial. PsA patients are often managed across both dermatology and rheumatology, creating a dual-physician prescribing dynamic for any new oral agent. Collectively, the highest-value buyer segment for Alumis's near-term launch (assuming psoriasis NDA first) is: younger, commercially insured, needle-averse, moderate-to-severe plaque psoriasis patients inadequately controlled on apremilast, with a dermatologist willing to prescribe a branded oral ahead of biologic step-up.
    tableRefs: [TM003]
    figureRefs: [FM003]

  - id: S04
    title: "Growth Drivers and Adoption Constraints"
    body: >
      The principal growth driver for the oral TYK2 inhibitor class is the convergence of biologic-level efficacy with oral administration convenience. Historically, moderate-to-severe psoriasis patients faced a trade-off: oral apremilast offered convenience at ~30% PASI 75 efficacy, while injectable biologics achieved PASI 90 in 50–70% of patients. Second-generation TYK2 inhibitors — Sotyktu, envudeucitinib, zasocitinib — now deliver PASI 75 rates of 75–80% and PASI 90 rates of 55–68%, closing the efficacy gap that historically drove biologic adoption. This shift is a structural market driver, not cyclical.

      A second driver is TYK2's regulatory safety profile. Unlike JAK inhibitors (tofacitinib, baricitinib, upadacitinib), which carry an FDA black-box warning for major adverse cardiovascular events, thrombosis, and malignancy, deucravacitinib and next-generation TYK2 inhibitors have not received this warning — though Sotyktu's label notes uncertainty about whether TYK2 inhibition might share JAK risks, which has dampened enthusiastic prescribing. The absence of a black-box warning is a commercial advantage that prescribers and payers can leverage for formulary positioning.

      Key adoption constraints include: (1) Competitive crowding — three oral TYK2 inhibitors (Sotyktu, zasocitinib, envudeucitinib) plus ICOTYDE (oral IL-23) will compete in plaque psoriasis from 2027, compressing pricing power and increasing rebate demands; (2) Limited long-term safety data — only three years of follow-up for Sotyktu LTE, insufficient for lifetime chronic disease treatment; (3) Payer step-therapy protocols requiring prior treatment failure with cheaper agents before TYK2 authorization; (4) Indication-specific regulatory risk — no TYK2 inhibitor is approved for SLE, and Alumis's SLE market opportunity depends entirely on the Q3 2026 LUMUS Phase 2b readout; (5) Biosimilar competition for established biologics diverting payer savings that might otherwise widen access for new oral agents. The market is growing but the commercial access environment for a third entrant is materially more difficult than it was for Sotyktu's 2022 launch.
    tableRefs: [TM004]
    figureRefs: [FM004]

  - id: S05
    title: "Competitive Market Dynamics and Oral Immunology Landscape"
    body: >
      The oral immunology market for psoriasis and related indications is undergoing its most disruptive period since biologic approval in the early 2000s. Five forces are converging: (1) second-generation TYK2 inhibitors (envudeucitinib, zasocitinib) achieving biologic-level PASI 90 rates in Phase 3; (2) the first oral IL-23 antagonist (ICOTYDE) receiving FDA approval in March 2026 with projected $5B+ peak sales; (3) established injectable biologics (Skyrizi, Cosentyx, Tremfya) generating multi-billion revenue bases with strong clinical differentiation; (4) growing biosimilar competition for older biologics (adalimumab, etanercept) lowering payer costs on established therapy; (5) TYK2's pipeline density — 142 active programs — creating a crowded competitive runway through 2030.

      For Alumis specifically, the most commercially relevant comparison is envudeucitinib vs Sotyktu vs zasocitinib, as these are the three oral TYK2 agents in or near the NDA stage. Sotyktu's FY2024 revenue of $246 million and GlobalData's $2.9B projection to 2029 set the upper bound for the class near term. Zasocitinib's near-simultaneous NDA filing and Takeda's $4B acquisition investment signal serious commercial intent. ICOTYDE's March 2026 approval introduces an oral IL-23 competitor with superior head-to-head data vs Sotyktu. Envudeucitinib's clinical differentiation rests on maximal 24-hour TYK2 inhibition (a company claim not yet independently validated) and strong PASI 90/100 data from 1,700+ patients. The competitive market analysis suggests Alumis will enter a four-drug oral competition for psoriasis by 2027-2028, requiring formulary positioning, pricing discipline, and clinical differentiation to capture meaningful share of the $615M and growing TYK2 sub-market.
    tableRefs: []
    figureRefs: []

