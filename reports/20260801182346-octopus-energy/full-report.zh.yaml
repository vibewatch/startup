      - number: '1.3'
        title: 资本基础与投资方
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 已从多元化的战略和财务投资者处融资超过 $2B。最近一轮主要融资于 2023 年 12 月以 $8B 估值完成（融资 $800M），随后 GIM 和 CPP
              Investments 在 2024 年 5 月增持，估值抬升至 $9B。澳大利亚上市能源公司 Origin Energy 持有约 23%，是最大单一股东，既拥有经济上行，也对 Kraken
              在澳大利亚部署具备战略影响力。Generation Investment Management（Al Gore 的基金）持股 13%，CPP Investments（加拿大养老金）持股 12%，提供机构背书。日本
              Tokyo Gas 于 2020 年投资约 $200M，获得约 9.7% 股份，并参与经营 Octopus Energy 日本零售业务的合资公司。澳大利亚养老基金 Aware Super 在 2024 年 5
              月与 GIM 共同投资。FY24 公司净资产在 £722M 股权投资与留存收益合计推动下达到 £1.7B。集团控股公司层面没有披露公开债务或信贷额度， 尽管 Octopus Energy Generation
              内部很可能存在项目融资结构。公司仍为私营；管理层公开讨论过上市，但尚未宣布确定时间表。
