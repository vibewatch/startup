      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              在英国能源零售中，主要买方是居民家庭，基于价格、客户服务口碑、费率结构和环保资质选择供应商。预算归家庭掌握；价格差、费率到期和比价网站媒体报道会触发切换决策。 SME
              是次级客群，采购复杂度略高，留存周期也更长。Ofgem 价格上限适用于居民客户，但不适用于 SME 或大型工业客户，因此不同客群毛利动态不同。 对 Kraken
              的公用事业软件业务而言，买方是公用事业公司的高管团队（CTO、COO 或 CEO），采购由 IT 和客户运营部门支持。采用路径包括较长的供应商评估、 概念验证迁移，然后进入多年平台合同。Kraken
              客户既有大型国际公用事业公司（EDF、E.ON Next、National Grid US），也有较小的独立企业，
              说明企业级和中端市场都可触达。迁移承诺周期长，并让客户承担显著切换成本，因此一旦上平台，留存很强。对清洁能源发电投资而言，Octopus Energy Generation
              的买方最终是其上市和非上市基金（ORIT、海上风电基金）的机构 LP，Tokyo Gas 则是基石 LP。付款方是基金投资人；
              底层能源的使用者是电网，并最终是零售消费者。采用触发因素包括企业或机构投资者的净零承诺，以及政府可再生能源目标。
