  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 的客户群横跨三个主要细分。最大的是英国居民零售能源供应：截至 2025 年 1 月约有 7.5 million 个家庭账户，占英国居民能源市场
              23.7%，这是英国市场现代竞争时期由单一供应商拿到的最高份额。海外方面，Octopus 在德国（超过 1 million）、法国（约 600,000）、日本（约 500,000）、意大利（约
              500,000）、西班牙（约 400,000）和新西兰（约 100,000）又服务至少 2.5 million 名客户。按 Octopus 新闻稿，全球客户数在 2024 年末已超过 10
              million。第二个独立细分是企业能源客户：Octopus 通过 Shape Shifters 资费套件、Electric Match 和 Wind Works 服务英国 SME 和商业客户，但精确 SME
              账户数未公开。第三个细分是 Kraken B2B 许可客户——美国、澳大利亚、日本、意大利和欧洲的公用事业公司，它们为自己的客户群许可 Kraken
              平台。按渠道看，绝大多数零售客户来自数字渠道，无退出费切换让客户进出 Octopus 都很容易。按用例看，Agile、Intelligent Octopus Go、Cosy 和 Flux
              等智能资费客户，是价值最高、参与度最高的队列；他们使用 Kraken 的需求调度能力，也产生支撑 Octopus 平台差异化的数据优势。按地域看，英国仍是主导收入市场，但非英国客户群在 FY2024
              增长了三倍——这是一个关键战略里程碑，说明国际扩张逻辑正在推进。英国零售收入集中仍是残余风险，因为英国价格上限监管会压缩利润率，天气、批发价格和监管政策也会同时影响英国盈利。
