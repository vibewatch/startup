      - number: '5.3'
        title: 虚拟电厂与需求灵活性
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的虚拟电厂，是英国能源系统中运营成熟度最高的消费者侧灵活性资产之一。Kraken Asset 聚合加入智能电价的电动车、 热泵和家用电池负荷，调度约 2GW
              灵活需求——Octopus 称这是全球最大的面向消费者 VPP。这个能力在多个维度具备商业价值。 第一，Octopus 能参与 Balancing Mechanism 和辅助服务市场，从 National
              Grid ESO 的需求上调和下调中获得收入。第二， 它能向获得授权的公用事业客户证明 Kraken Asset 是生产级 DER 调度系统，加速企业销售。第三，它让智能电价客户从参与中获得可衡量的财务收益，
              加深客户锁定。Intelligent Octopus Go 费率只要求客户连接 EV 并设定出发时间；Kraken 的 ML 系统会自动处理全部充电排程。 Ofgem 2024 年 1 月数据显示，在英国
              502,000 名居民智能 TOU EV 电价客户中，超过一半使用 Octopus 费率，说明在车队大规模电气化前， Octopus 已占据 EV 灵活性市场主导位置。Fan Club
              费率在特定风电场发电时给附近客户折扣，创造超本地需求响应，降低平衡成本和输电损耗。 Octopus Energy Generation 在 8 个国家的 300 个可再生项目资产基础，把市场情报回流到
              Kraken 批发价格预测，完成从发电、 调度到客户计费的垂直整合数据闭环。Heatmiser 恒温器集成把符合 VPP 条件的资产延伸到热泵；热泵的可控时点对电网稳定至关重要。 公开讨论的路线图项目包括，随
              EV 电池技术成熟集成 V2G，并进一步扩大电池储能参与电网平衡市场。
