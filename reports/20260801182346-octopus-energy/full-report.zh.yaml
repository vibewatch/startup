      - number: '7.5'
        title: 战略与执行风险
        blocks:
          - type: paragraph
            body: >-
              CEO 兼联合创始人 Greg Jackson CBE 是 Octopus Energy Group 最核心的公众面孔，也深度绑定监管关系、融资和战略方向。Octopus
              在治理披露中明确识别了这一关键人物集中风险，但没有通过继任计划披露显示已实质缓释。Greg Jackson 离任或失去履职能力，会给零售业务和 Kraken
              许可业务都带来重大执行与声誉风险。公司同时在德国、法国、日本、意大利、西班牙、新西兰、美国和更多市场扩张，执行复杂度倍增：每个市场都需要监管批准、本地人才、对冲能力和产品本地化。按当前规模估计，非英国业务仍在亏损（FY24
              国际贡献未单独披露）。Kraken Technologies 分拆（2025 年 12 月）带来管理带宽风险，领导层注意力要在完成分拆、加速 Kraken 独立增长、维持 Octopus
              零售竞争位置之间分配。通过 SoLR 任命快速增长客户，尤其是六个月迁移 1.5 million 个 Bulb 账户，可能在没有主动选择的迁移队列中埋下潜在客户满意度或流失风险。Octopus
              的气候与净零战略是品牌资产来源，但也制造长期产品转型风险：热泵、太阳能和 EV 需要的客户主张、安全制度和安装能力，都不同于燃气和电力计费。
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
      - number: '7.6'
        title: 财务与资产负债表风险
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group FY24 的 EBITDA 利润率只有 0.76%，面对商品成本上升、监管罚款或执行失误，缓冲极薄。£1.7 billion
              净资产提供了有意义的权益基础，但现金头寸、月度烧钱速度和可用信用额度余量未公开披露，外部无法评估资本充足性。Kraken Technologies 分拆（2025 年 12 月）估值 $8.65
              billion，可能通过 OEG 保留股权为其带来部分流动性，但具体持股比例和预期现金收入未披露。OEG 继续持有一组可再生能源资产（£7 billion
              AUM），融资来自权益和项目层债务组合；项目债务总量和契约未公开披露。集团营运资本周期在冬季峰值期结构性为负，因为必须先为批发采购融资，再从客户计费中回收，需要短期商品信用额度。英国零售业务存在坏账风险，尤其是预付费客户细分，Ofgem
              已经在该细分识别出计费合规故障。Octopus 报告 FY24 净利润 £83 million（基于 £12.4 billion 收入的 0.67%
              净利率），这是集团历史上第一个重大盈利年份；尚无穿越完整商品周期、持续盈利的记录。集团未披露杠杆率、利息覆盖倍数或债务到期结构，使信用风险评估依赖数据室访问。
