      - number: '3.2'
        title: 英国能源零售竞争对手画像
        blocks:
          - type: paragraph
            body: >-
              Centrica 旗下 British Gas 是英国零售的历史在位者，如今以约 650–700 万户家庭位居居民供应商第二。竞争资产包括品牌认知、 现场工程师队伍（约 7,000 名工程师）支撑 Home
              Services（锅炉维修、热泵、电气工程），以及拥有 200 万+ 连接设备的 Hive 智能家居平台——英国最大的居民能源 IoT 生态。British Gas 在 Citizens Advice
              投诉指标上长期落后于 Octopus，也没有开发出可匹配 Agile 或 Intelligent Octopus Go 的动态电价产品。Centrica 的战略优先事项是靠 Hive
              和服务变现保住客户生命周期价值， 而不是通过价格竞争夺回零售市场份额。

              E.ON Next 是 €35B+ E.ON SE 集团的英国零售部门，吸收 Npower 后拥有约 450 万账户。它使用自有 CRM / 计费栈，并在 2024
              年推出分时电价，显示在位者开始投资智能能源。E.ON 的结构性优势包括母公司的欧洲配电网资产，以及未来搭建外部授权业务的潜力——但尚未宣布。 OVO Energy（2020 年收购 SSE 后拥有约
              400–450 万英国客户）是 Octopus 在技术战略上最接近的同行：其 Kaluza 平台处理 EV 智能充电和需求灵活性，并已授权给约两家英国外部公用事业公司。

              EDF Energy 聚焦核电支持的固定价格费率（约 270–300 万英国客户），竞争点是核能发电（约占英国电力 15%）带来的供给成本确定性， 而不是智能产品差异化。EDF 的战略方向是 Great
              British Nuclear 旗下的核电机组整合，不是零售份额增长。四家传统供应商加上 Octopus，合计控制英国居民能源供应约 80%+。
