      - number: '6.2'
        title: 采用轨迹与增长
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的增长轨迹，是英国零售能源史上最突出的案例之一。公司 2015 年成立，2016 年上线时客户为零，到 2020 年已增长至约 1.5 million 个英国家庭账户，2021
              年突破 2 million，并在多次兜底供应商 任命中通过外延方式明显提速。2021 年接手 Avro Energy 客户，新增约 580,000 个账户。Bulb Energy 在 2021 年 11
              月进入破产管理，随后进入特别管理程序；英国政府在 2022 年 10 月选定 Octopus 收购 Bulb，并在 2023 年 1 月至 6 月期间把 1.5 million 名客户迁移到 Octopus 和
              Kraken 平台。2023 年末收购 Shell Energy Retail UK，又新增 1.3 million 个账户。这些外延增量合力推动 Octopus 在 2025 年 1 月超过 British
              Gas，成为英国最大的家庭能源供应商。有机增长来自高 NPS 带动的口碑推荐、面向 EV 车主和太阳能家庭的有竞争力智能资费，以及相对传统公司更低 CAC 的强数字营销。FY2024 期间，非英国客户群约 3x
              增长，确认国际扩张已经形成实质牵引；德国尤其突出，靠有机切换和本地营销增长到超过 1 million 名客户。到 2024 年 10 月，英国管理电表达到 12.9
              million，其中包括燃气表和电表，说明双燃料客户关系更深。智能资费采用率没有精确披露，但 Ofgem 数据显示，在英国 502,000 名智能 TOU EV 资费客户中，Octopus 拥有超过
              250,000 名，证明其客户基础内智能产品渗透率很高。
