      - number: '1.4'
        title: 增长指标与市场位置
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的增长轨迹在英国能源史上属于最快一档。公司 2016 年从零起步，到 2025 年 10 月已拥有 780 万英国家庭客户， 并在 2025 年 1 月超过 British
              Gas，成为英国最大的居民能源供应商，覆盖约四分之一家庭。全球范围内，2025 年 10 月公司在八个直销零售市场的客户数突破 1000 万，仅 FY24 非英国客户基数就增长到三倍。FY24 收入达到
              £12.4B（主要是英国零售能源商品），毛利润 £1B，EBITDA £95M，净利润 £83M（0.7% 利润率）。Kraken FY24 经常性 SaaS 收入为 £90M，同比增长 68%，利润
              £35M，增长 483%，显示技术板块经济性改善。 员工数在 FY24 从 4,800 增至 8,500，之后已超过 11,000。德国业务超过 100 万客户，法国约 600,000，意大利 500,000，
              日本 500,000，西班牙 400,000，体现出有意义的国际多元化。多数市场 Trustpilot 评分为 4.8/5，连续八年获得 Which? Recommended
              Provider，说明客户满意度表现持续领先，传统供应商尚未追上。TIME Magazine 将 Octopus Energy 列入 100 Most Influential
              Companies，进一步强化英国以外的品牌可信度。
