  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 在三个不同但互相强化的战场竞争。英国居民零售中，公司如今以约 780 万户家庭（约 24% 份额）领先市场， 高于 Centrica 旗下 British Gas（约
              650–700 万）、OVO Energy（约 400–450 万）、E.ON Next（约 450 万）和 EDF Energy（约 270–300 万）。这个位置来自更高客户满意度、两次大型收购（2022 年
              Bulb、2023 年 Shell Energy UK），以及由 Kraken 平台驱动的技术型成本结构。2021–22 年英国能源危机淘汰 25 家以上小供应商，是结构性加速器：Octopus
              吸收了多个政府指定组合， 并把自身品牌巩固为相对传统供应商更可靠、数字优先、NPS 更高且 Ofgem 投诉率更低的替代选择。

              公用事业软件中，Kraken Technologies（2025 年 9 月分拆）把云原生计费、调度和 CRM 平台授权给 27 个以上国家的公用事业公司， 覆盖 7000 万个已签约账户，已签约 ARR 为
              $500M。主要竞争对手是 Oracle Utilities（全球 4.30 亿+ 传统客户，服务重、偏本地部署模式）、 OVO 的 Kaluza（云原生 EV 和需求灵活性平台，约 2
              个英国外部授权客户），以及 Ensek（英国中端计费和 CRM，服务账户少于 500K 的供应商）。没有竞争者同时具备 Kraken 的授权规模、按账户计费的 SaaS 经济性和 ML 调度能力。

              可再生能源发电中，Octopus Energy Generation 在 9 个市场管理 4.9 GW、£7B AUM，与 Ørsted（全球已安装海上风电 10.2 GW，行业领导者）和
              Vattenfall（瑞典国有支持公用事业公司，拥有英国海上风电和区域供热资产）竞争。OEG 的优势来自零售锚定需求降低市场价格风险， 以及相较 Ørsted
              海上优先组合更宽的资产组合（太阳能、电池、陆上）。所有战场上可能的新进入者包括由超大规模云厂商支持的公用事业平台和国际能源巨头， 尽管截至 2026 年尚无一家具备英国规模的实质落地。
