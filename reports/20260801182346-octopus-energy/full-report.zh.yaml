      - number: '8.5'
        title: 融资背景与资本结构
        blocks:
          - type: paragraph
            body: >-
              自 2019 年以来，Octopus Energy Group 在新股融资轮中累计募资约 £1B+。已知投资者包括 Generation Investment Management（£630M，2021
              年）、CPP Investments（金额未披露，隐含集团估值 $9B，Q1 2024）、Tokyo Gas（战略伙伴兼投资者，金额未披露）和 Origin Energy
              Australia（合资形成，澳大利亚业务隐含
              $500M+）。优先股堆叠——清算优先级、反稀释权和参与机制——任何一轮都未公开披露，这是重大缺口：在悲观清算或被迫退出中，普通股（包括管理层和员工股权）可能被摊薄到远低于标题估值。集团层面债务融资没有公开确认。零售能源业务需要商品采购信用额度，通常由银行以对冲头寸作担保提供，但这些额度的规模、期限和交易对手均未披露。考虑到
              Octopus 利润率环境很薄，批发价格飙升情景下商品信用敞口可能很大。Kraken Technologies 分拆增加了复杂性：如果 Kraken 被拆为独立实体，Octopus Group 股东是否获得按比例
              Kraken 股权，取决于分拆结构（全额分派、部分 IPO 或有融资的剥离）。管理层已披露 Kraken CEO 任命（Amir Orad，Q4 2025），但没有披露分拆后 Kraken-Octopus
              持续商业关系的股权结构、优先权瀑布或许可费。Octopus Energy Group Ltd（注册号 09263047）的 UK Companies House
              文件确认了申报历史和注册账目，但公开来源没有集团层面、带完整分部披露的合并账目，限制了对资本充足性和现金头寸的量化评估。
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV039
      - number: '8.6'
        title: 最终尽调问题与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              在确认或扩大 Octopus Energy Group 任何仓位前，有四类最终尽调问题至关重要。第一，Kraken ARR 经审计数字：管理层当前声称的 $500M+ ARR
              无法从公开来源独立验证。按合同类型（许可、托管服务、基于绩效）、客户和地域拆分的 Kraken 经审计收入，是验证支撑 $9B 估值的软件倍数假设所必需的。第二，Kraken
              分拆结构和时间表：必须披露精确股权分配、优先权瀑布、持续 Octopus 零售关系的许可费结构，以及分拆后 Kraken 实体的治理安排，才能评估对当前 Octopus Group
              投资者的价值转移。第三，Ofgem 执法轨迹：2025 年 7 月计费自动化罚款和正在进行的预付费电表调查，必须先解决，监管风险轮廓才可评估。任何进一步牵涉 Kraken
              计费的执法，尤其是导致许可条件或重大整改成本的执法，都会成为投资逻辑破裂触发点。第四，商品采购信用额度：应披露任何商品采购融资的规模、期限和抵押条款，以评估批发能源价格飙升中的下行风险。投资逻辑破裂触发点包括：（1）2025
              年 7 月罚款后 18 个月内，出现第二项牵涉 Kraken 计费自动化的重大 Ofgem 执法；（2）失去一个或多个主要 Kraken 许可客户（E.ON Next、Tokyo Gas、National
              Grid US），且代表 Kraken ARR 超过 15%；（3）Kraken 分拆结构不给现有 Octopus Group 投资者按比例 Kraken 实体股权；（4）被迫下轮融资或困境二级交易的隐含估值低于
              $7B，释放机构对软件逻辑失去信心的信号。
