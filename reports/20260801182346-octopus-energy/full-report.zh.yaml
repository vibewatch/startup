  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与收入结构
        blocks:
          - type: paragraph
            body: |
              Octopus Energy Group 横跨四个主要收入板块：英国能源零售供应、国际能源零售、Kraken SaaS 授权，以及 OEG 可再生能源发电。
              英国能源零售供应——按参照 Ofgem 价格上限的费率，向约 780 万居民和 SME 客户供应电力和天然气——占集团收入的主导份额，
              估计超过 FY24 £12.4B 总收入的 90%。收入确认按消费模型进行：客户按用掉的每千瓦时电或每立方米天然气付费，
              另加每日固定日费；价格随 Ofgem 价格上限审查周期按季度调整。这形成了一条主要由用量驱动、受大宗能源价格影响的收入流，
              毛利相对流水很薄，但部分受 Ofgem 允许回报方法保护。

              Kraken Technologies——Octopus 自有公用事业操作系统——通过向第三方公用事业公司（E.ON Next、Origin Energy、Tokyo Gas 等）
              按账户 / 月收费，提供其计费、客户管理和灵活性栈，从而产生 SaaS 授权收入。Kraken FY24 SaaS 收入达到 £90M，
              同比增长 68%，授权账户 7000 万。Kraken 利润增至 £35M，增长 483%。这些数据披露在 Octopus Energy Group 的 FY24
              业绩新闻稿中，代表质量最高、毛利最高的收入板块。2025 年 9 月部分分拆预计将把 Kraken 单独变现，已签约 ARR 为 $500M。
              Octopus Energy Generation（OEG）通过出售其约 4.9 GW 可再生能源组合（£7B AUM）在九个市场发出的电力贡献收入，
              并通过向零售业务提供优先 PPA 价格，带来进一步垂直整合收益。
