      - number: '4.2'
        title: 单位经济性与成本结构
        blocks:
          - type: paragraph
            body: |
              能源零售按设计就是低毛利业务：Ofgem 的价格上限方法，允许供应商在大宗商品和网络成本转嫁之上获得受限单位毛利。
              行业分析师普遍估计英国能源零售毛利率为收入的 3% 至 5%，意味着在 FY24 收入水平下毛利润约为 £370M 至 £620M；
              Octopus 约 £1B 的隐含毛利润（约 8% 毛利率）说明，垂直整合和拥有 Kraken 而非从 Oracle 或 SAP 采购计费基础设施，
              带来了运营效率和避免成本收益。Octopus 在 £12.4B 收入上实现 £95M EBITDA，相当于 0.76% EBITDA 利润率，
              与轻资本零售模式一致，但被大宗商品成本转嫁显著稀释。

              客户获取成本（CAC）未披露。Octopus 称其增长更多由转介绍驱动，付费 CAC 相比传统供应商更低，但没有独立核验数字。
              单位经济性桥接只能依赖代理指标：英国能源零售行业通过数字渠道获客的 CAC 估计为每客户 £50 至 £150；由于流失较低，
              且智能电价产品（Agile Octopus、Intelligent Octopus Go）互动度高，回本期以月计。营运资本需求有季节性，
              冬季能源消耗和计费量最高时达到峰值，因此除股权外还需要信贷额度。Octopus 和所有英国能源零售商一样，使用大宗商品采购信贷额度，
              管理在批发市场购买能源与通过客户账单收回成本之间的现金时点差；这让资产负债表暴露于远期头寸的按市值计价波动。
