        - $1.3–2.2B（较 $9B 入场价崩塌 75–85%）
        - Ofgem 牌照条件；Kraken ARR 收缩；能源软件倍数压缩至纯公用事业水平
        - 低但不能忽视 — 2025 年 7 月执法行动已为 Kraken 计费失效树立先例
