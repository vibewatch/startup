      - number: '7.2'
        title: 技术与运营风险
        blocks:
          - type: paragraph
            body: >-
              Kraken 只部署在 Amazon Web Services 上，给全部 70 million+ 个签约账户带来结构性集中风险：如果 Kraken 主要 AWS 部署区域长时间宕机，E.ON
              Next、Tokyo Gas、National Grid US 等多个独立公用事业公司的计费、直接借记收款和客户管理会同时受损，Octopus 自己的 7.5 million
              英国客户也会受影响。多云故障切换或灾备架构均未公开披露。2025 年 7 月 Ofgem 罚款，是 Kraken 计费自动化故障造成监管处罚的已验证案例：如果自动化直接借记管理能向 34,000+
              名预付费客户多收费，那么 AI 驱动计费错误影响更大客户群的风险也存在。Kraken 关于 AI 和 ML 的业绩说法——效率提升 40%、NPS 改善 3x、节省 27 million tonnes
              CO2——都是管理层陈述，没有独立审计，潜在许可客户和监管方都无法验证准确性。AI 需求预测一旦出现重大偏差，可能在批发交易集成模块中造成对冲损失，直接影响能源采购成本和零售利润率。Kraken
              Technologies 没有公开确认 SOC 2 Type II 或 ISO 27001 认证，这对受监管公用事业客户构成重大信息安全保证缺口。70 million+ 个客户账户的个人和金融数据，分布在 27
              个国家却集中于同一平台，同时受 GDPR、日本 APPI、加州 CCPA 和其他数据保护制度约束，因此数据泄露风险较高。
