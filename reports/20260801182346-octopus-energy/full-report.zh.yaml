      - number: '7.4'
        title: 竞争与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的竞争位置依赖 Kraken 的服务成本优势——每账户约 £15-20，行业平均为 £40-60。传统公司继续投资竞品云原生平台时，这一优势可能被侵蚀。Ovo Energy 的
              Kaluza 分拆公司是最直接的 Kraken 竞争对手；它没有披露同等规模，但正积极向公用事业公司营销。British Gas（Centrica）已经投资数字化转型和数据分析能力。E.ON 许可 Kraken
              给 Octopus 带来收入，但也意味着 E.ON 同时获得 Kraken 能力，降低自身服务成本劣势。Oracle Utilities 在全球传统公用事业公司中保有庞大装机基础，并一直投资把 IS-U
              平台迁移到云上。如果 Oracle 云公用事业产品成熟到与 Kraken 功能相当，大型公用事业公司许可 Kraken 的壁垒可能变低。Octopus 的零售市场份额（英国家庭
              23.7%）带来监管审视风险：作为市场最大供应商，Octopus 面临更高 Ofgem 监督，不能再依赖从零增长时使用的挑战者品牌定位。通过 SoLR 吸收 Avro 和 Bulb
              客户，形成了外延客户队列；这些客户的流失特征、满意度水平和参与模式，可能不同于原生获得的 Octopus 客户。Kraken 分拆制造了结构性冲突：Kraken
              的商业激励是最大化来自所有公用事业客户的许可收入，其中包括 Octopus 竞争对手；Octopus 零售的利益则是防止竞争对手缩小平台差距。分拆后如何管理这一张力，尚未公开披露。
            claimRefs:
