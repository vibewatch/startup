      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Greg Jackson CBE 是 CEO 兼联合创始人，剑桥经济学毕业，转向能源前曾创办软件公司。他是集团最核心的公共面孔，也主导监管关系、融资和战略方向， 形成实质性的关键人物集中风险。Stuart
              Jackson（与 Greg 无家族关系）是联合创始人兼 CFO，同样毕业于剑桥经济学，自创立以来延续财务管理。 联合创始人兼 CTO James Eddison 拥有剑桥工程背景，负责包括 Kraken
              平台在内的技术战略。2025 年 9 月 Kraken 分拆后， Amir Orad 出任独立 Kraken CEO，Tim Wan 出任 Kraken CFO，部分分散了执行责任。Greg Jackson
              公开表达过能源政策、家庭负担能力以及智能电价在脱碳中作用的观点， 并因服务能源和商业获授 CBE。董事会详细构成未在公开文件中完整披露，治理透明度因此仍是尽调开放问题。Octopus Energy Group
              Ltd 在英国提交简略账目， 不发布完整公司治理声明，这意味着董事会构成、独立董事人数、审计委员会设置和关联交易披露，都需要进入私人数据室才能完整评估。
