      - number: '3.4'
        title: 竞争护城河与耐久性分析
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 的竞争护城河在三个互相强化的层级上运作。第一，Kraken 平台切换成本：一旦公用事业公司把计费、CRM 和调度迁到 Kraken，再换平台需要 3–5 年和
              £10M–£50M，形成结构性的长期留存。Oracle 的装机基础也受益于同一机制，但 Kraken 是唯一把云原生规模与 ML 调度商业化部署结合起来的平台。中期主要风险不是具名在位者，而是 AWS
              Energy、Google Cloud 这类超大规模云厂商支持的新进入者， 将计费基础设施层商品化。

              第二，Octopus 的智能电价基础设施（Agile、Intelligent Octopus Go）：复制这些产品，需要把 ML 调度与批发结算打通，需要大客户基数来平滑波动， 还需要竞争对手无法授权的
              Kraken 引擎。E.ON Next 2024 年推出的 TOU 电价是衍生产品，技术深度落后 2–3 年。第三， 发电、零售和软件的垂直整合创造复合成本优势。OEG 可再生资产锚定 Agile
              的批发地板价；Kraken 成本效率反哺零售毛利。OVO 缺少发电资产； Oracle 缺少零售。

              最可信的反向情景，是快速账户增长（Bulb + Shell 迁移）后服务质量下滑，Ofgem 2025 年 7 月 £1.5M 罚款和 2025 年 5 月退款已经发出信号。 如果 NPS
              领先被削弱，Octopus 的主要零售护城河也会变弱。国际壁垒真实存在：Octopus 27 个目标国家各有具备监管本土优势的本地在位者， 需要逐个市场进入，也没有一个全球竞争者可以在所有市场被同时替换。
