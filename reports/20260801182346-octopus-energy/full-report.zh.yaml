      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景需要三个条件同时成立：Kraken 完成分拆，并在 2027 年前以经验证的 $600M+ ARR 获得独立 SaaS 或混合 SaaS 的 8–12x 倍数；海外客户增长继续每年新增 3–5M
              个账户；英国监管环境保持稳定，不再出现重大 Ofgem 执法。在这些假设下，仅 Kraken 实体就值 $5–7B，服务 8M+ 客户且利润率改善的英国零售业务还能贡献 $1.5–2B，意味着在 IPO 或
              M&A 执行溢价前，集团股权价值为 $6.5–9B。由于 $9B 入场价已经计入大量 Kraken 可选性，乐观情景下当前投资者总回报也只是温和；上行取决于超过当前 ARR 预期。基准情景假设 Kraken
              分拆时获得 5–7x ARR 混合倍数，英国客户数稳定在 7.5–8M，Ofgem 执法轨迹不升级。这得到 Kraken 独立价值 $2.5–3.5B 和零售公用事业价值 $1.5–2B（约为 £6.9B 收入的
              0.25x），意味着集团股权价值 $4–5.5B，相比入场估值折价 35–55%。悲观情景假设 Kraken 无法干净分拆，出现一项或多项牵涉计费自动化的新 Ofgem
              执法，失去一个或多个主要许可客户，同时英国市场份额在 Centrica 的 Hive 和 Kaluza 达到功能相当后停滞。集团随后回归纯公用事业倍数，即 £6.9B 收入的 0.15–0.25x，对应约
              £1–1.7B（$1.3–2.2B）集团股权价值，相比 $9B 入场价下跌 75–85%。悲观情景概率低，但考虑到 Ofgem 执法先例和能源软件倍数压缩已经发生，不能忽视。
