      - number: '8.4'
        title: 建议与风险调整后回报
        blocks:
          - type: paragraph
            body: >-
              在当前 $9B 估值下，总体建议是有条件正面；条件是 Kraken 分拆能以可防御的软件倍数成功执行。信心为中等，原因是英国零售客户资产和 Kraken 全球覆盖很强，但被极薄零售利润率、Ofgem
              执法先例，以及外部投资者看不到经审计 Kraken ARR 数据所抵消。估值立场是，$9B 价格既不明显高估，也不明显低估——它押注一个具体结果，即 Kraken 软件重估；该结果合理但不确定。任何以 $9B
              进入的投资者，都必须能承受 Kraken 分拆催化出现前估值下调 40–60% 的情景。风险评级为高。商品价格敞口、极薄零售利润率、Ofgem 执法风险和 Kraken
              分拆执行风险叠在一起，带来很宽的结果分布。下行保护有限，因为公司没有有意义的资产支撑（不同于 SSE 的受监管网络资产或 Ørsted 的已签约海上风电容量）——账面价值之上的全部溢价都压在 Kraken
              软件估值上。当前投资者的目标退出窗口是 2028–2032 年，假设 Kraken 在 2024 CPP 轮后的 3–5 年内 IPO 或二级交易。2028 年 Kraken 按基准情景（$3B）IPO 时，对
              $9B 入场价中的 Kraken 部分回报约 0.3–0.4x；零售业务若利润率改善，可能恢复到 0.25–0.3x 收入。基准情景下，入场投资者总回报估计为 0.5–0.7x——除非 Kraken
              明显超预期，否则会毁损价值。
