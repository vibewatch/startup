  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 横跨三个边界、买方结构和竞争动态各不相同但互相依赖的市场。第一是英国居民能源零售，消费者通过持牌供应商购买标准可变、固定或动态费率的电力和天然气。 这个市场由英国约
              2850 万个电力计量点和约 2200 万个天然气计量点定义，在当前价格水平下每年产生约 £40B 或更多零售收入。由 Ofgem 管理的价格上限，为使用标准可变费率的家庭设定单位价格和固定日费上限，直接约束包括
              Octopus 在内所有零售供应商的单位毛利。 第二个市场是全球公用事业技术软件，具体是公用事业运营中的计费、客户信息系统、需求响应和智能电网集成层。这个市场过去由 Oracle Utilities、SAP
              和大型系统集成商服务；Kraken 在这里以云原生 SaaS 替代方案竞争。第三个市场是清洁能源发电投资，Octopus Energy Generation
              在欧洲陆上风电、海上风电和太阳能资产上，与大型基础设施基金、养老金资本和专业可再生能源开发商竞争。现状替代品包括传统 ERP / 计费系统（Oracle、SAP）、传统能源供应商（British
              Gas、E.ON），以及由受监管回报支撑的常规化石燃料发电。这些市场相邻而非彼此独立： Octopus 的零售规模给 Kraken 提供可信度，Kraken 的运营优势又支撑零售毛利防守。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM031
              - CM039
      - number: '2.2'
        title: 零售、公用事业软件与清洁能源的市场规模
        blocks:
          - type: paragraph
            body: >-
              英国居民能源零售市场按收入看是欧洲最大市场之一，由约 2850 万个电力计量点和 2200 万个天然气计量点驱动，年度家庭能源支出随价格水平落在 £40B 至 £50B
              区间。这既包括批发商品成本转嫁，也包括网络费用、政策附加费和供应商毛利。Octopus FY24 收入 £12.4B， 约占估计英国居民能源总支出的 25-30%，与其 24%
              市占率大致一致。按客户量看，这主要是一个平稳市场，但收入会随批发价格波动。全球公用事业软件和 SaaS 市场较难通过公开来源测算。Kraken 已签约年收入 $500M，只占全球公用事业 IT
              支出的很小一部分。行业观察者估计，全球公用事业公司合计每年在运营上花费数千亿美元； 其中覆盖计费、CRM 和智能电表集成软件的子集，估计每年至少 $10B。Kraken 已签约收入三年翻了四倍，说明它在抢占既有
              IT 预算份额， 而不是创造全新支出。全球清洁能源投资市场庞大且增长中；多项估算显示 2023 年年度清洁能源投资超过 $1T，IEA《World Energy Investment 2024》报告引用 2023
              年清洁能源投资 $1.7T、化石燃料约 $1T，构成历史性拐点。Octopus Energy Generation 的 £7B AUM 使其成为该市场的中型参与者，身旁还有规模大得多的基础设施基金。
