    Technology——云原生公用事业管理平台，覆盖计费、CRM、交易、计量、需求响应， 授权给 E.ON、Origin Energy、Tokyo Gas、EDF Renewables 等全球第三方公用事业公司。
  customerFocus: 零售：寻求透明、数字优先能源供应的英国家庭和 SME。Kraken：希望替换传统计费基础设施，并加入 AI 驱动需求管理能力的 Tier-1 和 Tier-2 公用事业运营商。
