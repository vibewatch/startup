      - number: '7.3'
        title: 市场与商品风险
        blocks:
          - type: paragraph
            body: >-
              英国零售能源从根本上暴露在批发天然气和电力商品价格波动中。Ofgem
              价格上限保护消费者，却限制供应商可赚取的单位利润率；当商品价格跌破上限地板时，收入下降快于成本，当商品价格冲破上限时，供应商又要吸收对冲损失，风险不对称。2021-2022
              年欧洲天然气价格危机期间，多家英国能源供应商破产；Octopus 通过兜底供应商任命吸收 Avro Energy（580,000 名客户）和 Bulb（1.5 million
              名客户），并承担整合成本。Octopus 披露 FY24 EBITDA 利润率仅 0.76%，处在一个持续 1-2% 商品价格变动就可能把集团推入经营亏损的阈值。Q2 2026 Ofgem 价格上限下调
              6.6%，在固定成本基础设施没有相应减少的情况下，压低所有英国零售客户的单位收入。Octopus
              使用商品信用额度，在向客户计费前为批发能源采购融资，价格波动期会产生按市值计价的资产负债表敞口。这些信用额度的规模和交易对手未披露。天气风险既季节性又结构性：异常温和的冬天会降低用能和收入，极端寒潮又会同时推高需求和采购成本。随着热泵渗透率提高，气候变化也会给天然气消费带来长期需求不确定性。
