      - number: '1.5'
        title: 里程碑与监管记录
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的里程碑记录，是一条常规增长叙事，中间被两次政府支持的大型收购打断，同时监管合规负担逐步上升。2022 年 12 月收购 Bulb Energy 的 150
              万客户，由英国政府支持促成，是公司首次动用大规模非有机增长事件。到 2023 年中，Bulb 客户全部迁移到 Kraken 平台，验证了 Kraken 吸收大规模转移的能力。2023 年末收购 Shell
              Energy Retail UK，增加约 130 万能源客户，并在不到三个月内完成迁移， 进一步展示平台能力。伴随有机增长和收购增长，Octopus Energy 承受的监管审视也与规模同步上升。2025 年 7
              月，Ofgem 因公司未能及时向约 34,000 名预付费电表客户开具最终账单，对其罚款 £1.5M。2025 年 5 月，Ofgem 要求 Octopus 和其他九家供应商合计退还 £7M，
              原因是固定日费多收；Octopus 份额为 £2.64M，另加 £546,000 善意付款，覆盖 2019 年 1 月至 2024 年 9 月期间的错误。Greg Jackson 在 2024
              年公开警告，受非商品类网络和政策成本影响，英国家庭能源账单到 2029 年可能上涨 20%；这增强了其声誉可信度， 也提示零售业务面临成本压力风险。2025 年 9 月 Kraken
              分拆，是创立以来最重要的结构性事件：技术平台被拆成独立实体，估值最高估计达 £10B，管理层可在独立于零售集团的情况下推进自身资本议程。
