      - number: '6.3'
        title: 具名客户证明与参考质量
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的客户证据在英国零售能源市场中属于最强一档，但市场属性决定了个人案例研究没有汇总满意度指标常见。最权威的第三方客户证明，是连续八年保持的 Which? Recommended
              Provider 奖项；该奖项要求独立验证的满意度调查，覆盖客服、性价比、计费准确性和投诉处理。Trustpilot 上超过 400,000 条评价给出
              4.8/5，覆盖面很广，但存在自选择偏差。英国最大能源切换平台 Uswitch 在年度客户满意度调查中也持续把 Octopus 排在高位。B2B 侧，具名 Kraken 客户是另一类参考账户：Origin
              Energy（澳交所上市澳大利亚公用事业公司，约 4 million 名客户）既持股 23%，也是 Kraken 许可客户，代表最高价值的战略客户证明。EDF Energy 是英国最大传统供应商之一，它许可
              Kraken 做客户管理，说明连竞争对手也认可平台优势。National Grid US 是受监管配电公用事业公司，为北美市场增加了受监管资产所有者参考。Tokyo Gas
              是日本最大燃气公用事业公司，提供了全球监管要求最高市场之一的参考。这些 B2B 参考都是生产部署，不是试点——Octopus 自己的 7.5 million 英国客户也跑在同一个 Kraken
              平台上，这是最可信的概念验证。Bulb 和 Shell Energy 两次迁移都在数月内完成且未出现重大服务中断，证明公司的交付能力不只是软件。一个反向信号是 2025 年 7 月 Ofgem 罚款，涉及
              34,000 名预付费电表客户未收到最终账单；这说明即便总体满意度很高，特定受监管细分仍有客服缺口。
