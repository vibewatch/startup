      - number: '5.4'
        title: 部署、集成、可靠性与路线图
        blocks:
          - type: paragraph
            body: >-
              Kraken 的部署模型是 AWS 上的云原生，让 Octopus 能通过搭建区域实例进入新地理市场，无需大量本地基础设施。2023 年六个月内将 150 万 Bulb Energy 客户快速迁移到 Kraken
              基础设施，以及随后在 2023 年末迁移 130 万 Shell Energy 客户，都证明了这一点。 两次迁移均未出现重大服务中断，Octopus 在企业客户对话中把它们作为参考基准。集成架构是 API
              优先：获授权的公用事业公司通过 RESTful API 连接 Kraken，用于计费、计量数据交换和客户管理；Kraken Field 则与外部员工管理和地图平台集成。智能电表数据通过英国 Data
              Communications Company 网络摄取，在每个国际市场也有等效集成。AWS 多区域架构和自动扩展支撑可靠性，不过集中在单一云服务商上， 形成潜在单点故障，投资者需要评估。面向客户的可靠性由超过
              400,000 条评论给出的 Trustpilot 4.8/5 评分，以及连续八年 Which? Recommended Provider 身份背书。已知可靠性事件包括两项 Ofgem 计费执法行动：2025
              年因未向 34,000 名预付费客户开具最终账单被罚 £1.5M；2025 年 5 月因固定日费多收错误，被要求退款 £2.64M，并支付 £546K 善意款。这些事件说明，即便平台整体先进，
              某些受监管客户群的计费边缘情形仍需要更强质控工具。Kraken 路线图计划通过美国、日本和欧洲国际扩张，到 2027 年达到 100M 账户。 热泵集成、V2G 调度、AI
              驱动联络中心自动化，以及水务公用事业等相邻垂直领域，会进一步扩大可服务市场。
            claimRefs:
              - CE023
              - CE024
              - CE025
              - CE026
              - CE027
      - number: '5.5'
        title: 差异化——技术 IP、数据与品牌
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的竞争差异化靠四根支柱撑住。第一，自研技术：Kraken 平台从一开始就面向现代云环境和智能电表数据量重建，绕开了传统 Oracle 和 SAP
              公用事业平台背后的技术债。Skyrocket ML 系统和 Kraken Asset 调度引擎，在自动化需求响应和客户沟通自动化上是真正的 IP，竞争对手要复制需要多年。第二，数据优势：仅英国就管理 12.9
              million 只电表，全球有 70 million 个账户，Octopus 不断积累消费模式、设备行为、批发价格响应等自有数据，用来反哺资费设计、ML
              模型训练和发电资产调度。没有大规模智能电表覆盖的竞争对手，拼不出同等数据集。第三，品牌资产：Octopus 几乎不靠传统广告，却已经靠口碑建立品牌认知，持续较高的 Trustpilot 评分和 Which?
              认可都在证明获客成本更低。服务每 4 个英国家庭中的 1 个，以及 2025 年 1 月超过 British Gas 的里程碑，进一步强化了品牌存在感。第四，监管关系：Octopus
              多次被指定为兜底供应商（Supplier of Last Resort），既证明监管信任，也让公司以低于市场的成本获得客户群。参与英国 Smart Data 计划、较早推出 TOU 资费，使 Octopus 成为
              Ofgem 和 DESNZ 的政策伙伴。关键 IP 包括用于热泵 VPP 控制的 Heatmiser 收购、带来漫游数据和网络效应的 Electroverse EV 充电网络，以及 Skyrocket ML
              系统。复制壁垒很高：从零重建一个相当于 Kraken 的平台，估计需要五到七年和数亿英镑；这也解释了为什么大型公用事业公司宁愿持续支付许可费，而不是内部自建。
