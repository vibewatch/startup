      - number: '5.2'
        title: Kraken 平台架构与能力
        blocks:
          - type: paragraph
            body: >-
              Kraken 是 Octopus Energy Group 的核心技术资产。它是基于 Amazon Web Services、使用 Python 和 Django 从零构建的云原生公用事业操作系统，
              设计目标是处理公用事业运营全栈：客户管理和 CRM、实时计费、智能电表数据处理、DER 聚合，以及现场员工管理。平台围绕三个主要组件组织。 Kraken Customer
              处理计费、直接借记管理、数字沟通和客户服务工作流。Kraken Asset（原 KrakenFlex）是 DER 聚合与虚拟电厂调度引擎， 与智能 EV
              充电器、热泵和电池系统通信，根据批发价格信号或电网稳定需求转移负荷。Kraken Field 管理现场服务运营，包括热泵安装排程和智能电表铺设。 这些模块组合成端到端平台，运行传统 SAP 或 Oracle
              公用事业软件的竞争者很难复制。AWS 基础设施支撑全球扩展性：Octopus 称 AWS 支持了快速国际扩张； Kraken 如今按授权管理 1700 万个能源账户。Kraken 内部的 Skyrocket
              机器学习系统可自动化最高 40% 的数字客户沟通，降低客服处理时长并提高 NPS。Kraken 的 API 优先架构让第三方授权更顺畅：EDF、E.ON Next、Origin
              Energy、Plenitude、Tokyo Gas、Cuckoo Broadband、Severn Trent Water 和 National Grid US 都是客户。截至 FY2024，平台实现
              $500M 承诺年度经常性收入，Octopus 目标到 2027 年管理账户总数达到 1 亿。2025 年 3 月宣布、2025 年 9 月完成的 Kraken 分拆，让 Kraken 获得独立治理， 可以在不与
              Octopus 零售发生战略冲突的情况下加快企业销售周期，并为未来 IPO 打开可能。公司声称取得 ISO/IEC 27001 信息安全管理认证， 但精确范围需要独立核验。
