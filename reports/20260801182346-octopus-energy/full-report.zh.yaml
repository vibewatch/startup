      - 与 Octopus 的可比性
      - 主要局限
    rows:
      - - Centrica PLC（British Gas 母公司）
        - 英国纯零售能源供应商
        - £32.5B (FY2023)
        - 约 0.15x（EV 约 £4.8B）
        - Octopus 零售业务最接近的可比对象；按收入计，为英国最大居民能源供应商
        - 无技术授权收入；Hive IoT 平台相较 Kraken 规模不足；传统基础设施成本底座推高单位成本
      - - SSE PLC
        - 综合能源与基础设施；英国
        - £9.8B（FY2024 估算）
        - 约 1.5x（EV 约 £14.5B）
        - 体现基础设施相对纯零售的溢价；受监管网络资产支撑更高倍数
        - SSE 倍数由受监管网络资产（RIIO-T2 / ED2）主导；单看零售部分，倍数低得多
      - - EDF Group（英国和法国）
        - 欧洲综合能源巨头
        - ~€143B 合并（FY2023）
        - ~0.5x（集团口径，EV ~€70B）
        - 为核电 / 零售组合的综合公用事业提供欧洲参考倍数
        - 法国国家持股扭曲市场定价；英国零售业务相对 EDF 集团规模偏小
      - - Orsted
        - 海上风电开发商；丹麦
        - DKK 86B (~£9.6B, FY2023)
        - ~2.5x（2024；从 2021 年 ~5x 压缩）
        - 说明成本和利率逆风下，能源转型溢价会快速压缩
        - 纯可再生能源开发商，不是零售或软件公司；倍数反映签约海上风电收入
      - - OVO Energy / Kaluza（私营）
