      - number: '5.6'
        title: 信任、安全、隐私与合规
        blocks:
          - type: paragraph
            body: >-
              经营一家服务每 4 个英国家庭中 1 个、并为全球 70 million 个账户处理计费的公用事业公司，需要严密的安全、隐私和合规控制。Octopus 声称其 Kraken 平台的信息安全管理通过 ISO/IEC
              27001 认证，但认证范围和当前状态仍需尽调独立确认。集团参与英国 Smart Data 计划，说明它在跟进不断演进的开放能源数据监管。Kraken 在德国、法国、意大利、西班牙的欧盟部署嵌入了 GDPR
              合规，并借助 AWS 区域基础设施满足数据驻留要求。智能电表数据处理受 DCC 数据访问控制和 Ofgem 许可条件约束。消费者安全义务包括预付费电表保护（与 2025 年 7 月 Ofgem
              执法直接相关）、通过 Priority Services Register 识别脆弱客户，以及监管债务管理规则。2025 年 Ofgem 的 £1.5M 计费罚款、£2.64M 退款令和 £546K
              善意补偿，暴露出合规监控缺口，尤其是预付费和固定费用计费边缘场景。相对 £12.4B 收入，这些事件金额不大，但声誉影响显著，也说明受监管客户细分的计费周期异常处理存在质量控制缺口。Octopus
              对客户运营团队投入很重，英国员工从 50 人扩到超过 4,000 人，Trustpilot 和 Which? 得分也高；即便后端计费自动化出现过孤立故障，面向客户的服务质量仍然强。Kraken B2B
              平台的安全更关键：获许可的公用事业公司把客户数据和计费基础设施交给 Kraken，一旦许可客户发生重大数据泄露或计费中断，Kraken 的企业销售管线会承受严重声誉后果。渗透测试、SOC
              监控，以及第三方集成的供应链安全，都是现有公开披露之外还需要尽调确认的领域。
