        - id: margin-compression
          label: 零售利润率压缩
          detail: 0.76% EBITDA 利润率恶化；集团走向经营亏损；动用授信额度
        - id: fundraising-risk
          label: 融资困难
          detail: 投资者信心受损；下一轮融资成本更高，或无法融资
        - id: kraken-spinoff-tension
          label: Kraken 分拆利益冲突
          detail: Kraken 作为独立实体，可能优先外部收入，而非 Octopus 零售条款
  - id: FR003
    title: 监管事件时间线——关键执法与合规里程碑
    type: timeline
    layout: standard
    summary: 时间线展示 2021 至 2026 年影响 Octopus Energy Group 的重大监管事件、执法行动和合规里程碑，显示 Octopus 成为英国最大供应商后，监管风险的演进和 Ofgem 审查强度上升。
    approximationNotes: 日期来自公开 Ofgem 执法记录、议会记录和新闻稿。预付费电表调查状态以运行日期（2026-05-08）公开信息为准。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR015
    data:
      items:
        - label: Avro Energy SoLR 指定
          date: Sep 2021
          detail: Octopus 首次大型 SoLR；58 万客户转入；监管合规义务开始规模化
        - label: 能源市场危机见顶；多家供应商破产
          date: Oct 2021
          detail: 燃气价格危机触发英国 28+ 家供应商倒闭；行业 SoLR 义务升级
        - label: Bulb Energy 特别管理
          date: Nov 2021
          detail: Bulb 150 万客户被纳入政府特别管理；Octopus 后来获选为收购方
        - label: Ofgem 预付费电表调查启动（全行业）
          date: 2023
          detail: 议会和 Ofgem 审查针对弱势家庭强制安装预付费电表的问题
        - label: Energy Act 2023 生效
          date: Dec 2023
          detail: 对智能电表铺设、弱势客户识别和热泵安装合规提出新义务
        - label: Ofgem 因直接借记超收罚款 £1.5M
          date: Jul 2025
          detail: Kraken 计费自动化被认定向 3.4 万+客户超收；需退款 £2.64M
        - label: Ofgem 2026 年 Q2 价格上限下调（6.6%）
          date: Apr 2026
          detail: 季度上限调整降低单位收入；利润率压缩风险兑现
  - id: FR004
    title: 竞争与结构性风险依赖图
    type: dag
    layout: standard
    summary: 有向无环图展示竞争和结构性风险，说明市场地位、技术平台和战略决策如何为 Octopus Energy Group 形成相互连接的风险依赖。
    approximationNotes: 依赖关系为分析师推断。该图基于公开信息呈现逻辑因果关系，不代表 Octopus 管理层自身风险模型。
    claimRefs:
      - CR021
      - CR022
      - CR023
      - CR024
      - CR027
      - CR034
    data:
      nodes:
        - id: kraken-advantage
          label: Kraken 服务成本优势
          detail: £15–20/账户，对比行业 £40–60；竞争和授权护城河的主要来源
        - id: competitor-investment
          label: 在位企业平台投资
          detail: Kaluza（Ovo）、Oracle 云、Centrica 数字化；3–5 年视角内差距收窄
        - id: client-migration-risk
          label: Kraken 被授权方迁移风险
          detail: E.ON、Origin 或其他客户可能在合同到期后自建或切换平台
        - id: key-person-risk
          label: Greg Jackson 关键人风险
          detail: CEO 离职或健康事件扰乱监管关系和投资者信心
        - id: spinoff-conflict
          label: Kraken 分拆利益冲突
          detail: Kraken 的外部授权目标可能偏离 Octopus 零售的平台访问利益
        - id: margin-erosion
          label: 零售利润率侵蚀
          detail: 竞争对手服务成本改善，削弱 Octopus 在零售端的定价优势
      edges:
        - from: competitor-investment
          to: kraken-advantage
          label: 优势随时间收窄
        - from: kraken-advantage
          to: client-migration-risk
          label: 差异化下降推高流失风险
        - from: spinoff-conflict
          to: kraken-advantage
          label: 分拆后定价可能侵蚀 Octopus 零售成本优势
        - from: key-person-risk
          to: spinoff-conflict
          label: 领导层缺口放大治理复杂度
        - from: client-migration-risk
          to: margin-erosion
          label: Kraken ARR 增长放缓，削弱 SaaS 对零售的交叉补贴
        - from: competitor-investment
          to: margin-erosion
          label: 成本差距收窄，侵蚀 Octopus 零售竞争性定价能力
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 逻辑链从五个证据支柱——市场地位、产品验证、客户牵引、财务结构和风险画像——推导出有条件正面推荐，并列出两项条件（Kraken 分拆且无进一步 Ofgem 执法）；满足后可转为明确买入推荐，不满足则触发下调。
    approximationNotes: 节点描述是分析师定性摘要。量化触发阈值见 TV005（推翻投资假设与终止触发条件表）。
    claimRefs:
      - CV004
      - CV005
      - CV027
      - CV036
    data:
      nodes:
        - id: n1
          label: 英国市场领先（750 万客户，NPS 第 1）
        - id: n2
          label: Kraken 平台（7000 万账户，声称 $500M+ ARR）
        - id: n3
          label: 国际扩张（27 个国家，8+ 被授权方）
        - id: n4
          label: 利润率薄（0.76% EBITDA）叠加 Ofgem 执法风险
        - id: n5
          label: $9B 估值由 CPP Investments 入股锚定（Q1 2024）
        - id: n6
          label: Kraken 分拆执行 — 核心价值催化剂
        - id: n7
          label: 有条件正面 — 暂缓，等待 Kraken 分拆结构披露与 ARR 审计
        - id: n8
          label: 多头上修触发 — Kraken 以 $2B+ 分拆，且 Ofgem 无再次执法
        - id: n9
          label: 空头下修触发 — Ofgem 第二次执法或主要授权客户大量流失
      edges:
        - from: n1
          to: n5
          label: 支撑
        - from: n2
          to: n5
          label: 核心驱动
        - from: n3
          to: n5
          label: 增长期权
        - from: n4
          to: n5
          label: 折价
        - from: n5
          to: n6
          label: 由此释放价值
        - from: n6
          to: n7
          label: 未确认 — 有条件
        - from: n6
          to: n8
          label: 乐观情景
        - from: n4
          to: n9
          label: 升级情景
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: >-
      该图测算 Octopus Energy Group 隐含企业价值对三项关键驱动的敏感性：Kraken ARR 倍数（0x–12x）、Kraken ARR 绝对规模（$300M–$800M），以及基于 £6.9B
      收入的零售公用事业倍数。每条序列只调整一个驱动，其他变量维持基准值，展示低、基准、高假设下对集团估值的隐含贡献。
    approximationNotes: 所有数值均为分析师估算。Kraken ARR 为管理层声称口径，未经审计。零售收入采用 FY2024 披露值。EV/Revenue 倍数来自 TV004 的可比公司组。
    claimRefs:
      - CV013
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
    data:
      items:
        - label: Kraken ARR 倍数 — 低：0x（纯公用事业）
          value: 0
          unit: USD millions
          detail: 不给 Kraken SaaS 任何估值信用；整个集团按零售公用事业估值
          tone: negative
        - label: Kraken ARR 倍数 — 基准：6x ARR（$500M）
          value: 3000
          unit: USD millions
          detail: 基准 ARR 下，Kraken 软件贡献按基准假设估值
          tone: neutral
        - label: Kraken ARR 倍数 — 高：10x ARR（$500M）
          value: 5000
          unit: USD millions
          detail: 当前 ARR 水平下，Kraken 在多头情景获得 SaaS 重估
          tone: positive
        - label: Kraken ARR 规模 — 低：$300M，6x
          value: 1800
          unit: USD millions
          detail: 分拆后 ARR 见顶；倍数保持不变
          tone: negative
        - label: Kraken ARR 规模 — 基准：$500M，6x
          value: 3000
          unit: USD millions
          detail: 管理层声称的 ARR，采用基准倍数
          tone: neutral
        - label: Kraken ARR 规模 — 高：$800M，6x
          value: 4800
          unit: USD millions
          detail: 到 FY2027 ARR 增至 $800M，采用基准倍数
          tone: positive
        - label: 英国零售倍数 — 低：£6.9B 收入按 0.15x
          value: 1315
          unit: USD millions
          detail: 纯公用事业底部倍数；不给科技溢价
          tone: negative
        - label: 英国零售倍数 — 基准：£6.9B 收入按 0.25x
          value: 2191
          unit: USD millions
          detail: 介于 Centrica 与 SSE 之间的同业混合倍数
          tone: neutral
        - label: 英国零售倍数 — 高：£6.9B 收入按 0.50x
          value: 4382
          unit: USD millions
          detail: 若受监管资产获得估值信用，给予类似 SSE 的溢价
          tone: positive
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: >-
      Octopus Energy Group 的多头、基准、空头隐含企业价值区间（十亿美元），并以 CPP Investments 的 $9B 入场价格作为参照。多头情景要求 Kraken SaaS
      在分拆时重估；空头情景假设估值回落到纯公用事业倍数。
    approximationNotes: 所有区间均为分析师估算，使用 TV004 中的可比倍数。汇率假设为 $1.27/GBP（2024 年平均）。这些估算没有经审计财务数据支撑。
    claimRefs:
      - CV001
      - CV017
      - CV018
      - CV019
      - CV024
    data:
      items:
        - label: 空头情景隐含 EV（十亿美元）
          low: 1.3
          mid: 1.8
          high: 2.2
          unit: $B
          detail: £6.9B 收入按 0.15–0.25x 纯公用事业倍数；Kraken 分拆放弃或失败；基于 TV003 空头假设
        - label: 基准情景隐含 EV（十亿美元）
          low: 4
          mid: 4.8
          high: 5.5
          unit: $B
          detail: Kraken 以 $500M ARR 计 5–7x，加上零售业务 0.25x 收入；基于 TV003 基准假设
        - label: 多头情景隐含 EV（十亿美元）
          low: 6.5
          mid: 7.5
          high: 9
          unit: $B
          detail: Kraken 以 $600M+ ARR 计 8–12x，加上零售业务 0.3x 收入；Kraken 分拆顺利落地
        - label: 入场估值参照（CPP Investments，Q1 2024，十亿美元）
          low: 9
          mid: 9
          high: 9
          unit: $B
          detail: 最近已知一级市场交易；投资者回报计算的参考价格
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向 IC 的 Octopus Energy Group 七项投资维度记分卡。每项 KPI 都是分析师方向性评级，并用本尽调报告中的证据支撑；证据仅限截至 2026-05-08 的公开来源。
    approximationNotes: 评级是基于公开证据的定性分析师判断，不是正式打分模型，也不意味着具体回报概率。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV033
      - CV035
      - CV042
    data:
      items:
        - label: 市场机会
          value: Positive
          detail: 英国能源转型叠加全球公用事业软件可服务市场；政策与技术共同确认了跨越数十年的结构性顺风
        - label: 产品差异化
          value: Neutral
          detail: Kraken 计费自动化故障（Ofgem July 2025）削弱了原本较强的产品差异化叙事；ARR 未经审计
        - label: 客户验证
          value: Positive
          detail: 英国 7.5M 客户、全球 70M 账户；E.ON Next、Tokyo Gas、National Grid US 为 Kraken 授权客户
        - label: 财务健康度
          value: Negative
          detail: 0.76% EBITDA 利润率、现金状况未披露、暴露于大宗商品价格；公开信息未确认现金续航缓冲
        - label: 风险画像
          value: Negative
          detail: 高风险 — Ofgem 执法先例、大宗商品价格敞口、Kraken 分拆复杂度和薄利润率把下行分布拉宽
        - label: 估值支撑
          value: Neutral
          detail: $9B 只有在 Kraken SaaS 重估假设下才站得住；基准情景意味着较入场价格减记 40–55%
        - label: 证据质量
          value: Neutral
          detail: 市场与客户证据扎实；Kraken ARR、资本结构、分拆条款和现金状况证据薄弱
