      - number: '2.4'
        title: 增长驱动、约束与证据缺口
        blocks:
          - type: paragraph
            body: >-
              英国能源零售的增长驱动具备结构性，包括交通和供热电气化（EV 和热泵推高用电需求）、智能电表覆盖扩大（支撑分时电价和需求响应）、 英国 Net Zero Strategy 要求到 2050
              年大幅推动能源系统脱碳，以及消费者对绿色费率的认知提高。Agile Octopus 这类动态电价每半小时把价格挂钩批发市场条件， 让懂技术的消费者和 Octopus 智能充电 VPP
              受益。英国零售增长的约束包括偏薄的大宗能源毛利（Octopus FY24 净利率 0.7%）、 上升的非商品类网络和政策成本（Greg Jackson 预计到 2029 年将让家庭账单增加
              20%），以及六家供应商如今控制超过 90% 账户的市场结构， 引发集中度担忧。向德国、法国、意大利、西班牙、日本和美国扩张，带来增长选择权，但每个市场都有自己的监管框架、语言要求和 Kraken 本地化成本。
              对 Kraken 软件市场而言，增长驱动包括全球公用事业运营数字化、多个市场的智能电表强制要求，以及管理分布式能源资源（EV、电池、热泵）的需要，
              这些需求传统系统无法处理。约束包括公用事业采购周期长、既有供应商关系，以及从传统 Oracle 和 SAP 安装迁移所需的资本和时间。 证据缺口显著：没有公开分析师用一致方法覆盖 Kraken TAM，IEA
              的全球清洁能源投资数据被广泛引用，但公用事业软件子集没有独立测算； Octopus 在英国以外的国际零售市占率也没有由独立来源公开审计。
