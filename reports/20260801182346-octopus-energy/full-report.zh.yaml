      - number: '6.4'
        title: 留存韧性与流失
        blocks:
          - type: paragraph
            body: >-
              客户留存是 Octopus Energy 最重要、也最难精确量化的指标之一，因为英国零售能源市场不要求公开披露流失率。现有证据指向一个结论：Octopus
              的留存优于行业同业。行业分析师和消费者调查数据显示，Octopus 月流失率约 2-3%，而典型英国能源传统公司为 4-5%。较低流失来自几个结构性因素。第一，智能资费带来粘性：Agile、Intelligent
              Octopus Go 或 Cosy 客户一旦把设备配置成自动调度，切换成本就更高，因为其他地方很难找到可比资费。第二，Which? Recommended Provider 身份和 Trustpilot
              分数让客户意识到，离开 Octopus 可能损失服务质量。第三，一些产品具有捆绑属性，尤其是热泵和 EV 客户可能同时使用 Octopus 安装的硬件和资费，切换壁垒更深。第四，App
              和数字账户管理工具的用户体验分数高，减少了摩擦和惰性。消费业务没有公开披露 NRR 或 GRR；在受监管能源市场，每客户收入很大程度上由 Ofgem 价格上限和实际用量决定，因此 NRR 的意义不如 SaaS
              业务。居民客户合同通常是 12 个月或标准浮动合同，没有退出费。Kraken B2B 细分没有公开披露合同期限，但集成深度（替换计费系统）意味着多年期合同。Ofgem 2025 年 5 月强制退款令和 2025
              年 7 月罚款，针对的是历史计费故障，不是当前系统性服务故障；基于可得满意度数据，它们尚未显示出造成实质客户流失。
