  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与合规风险
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 在 Ofgem 零售能源供应许可下运营，受英国能源消费者保护法规全套约束，包括行为标准（Standards of
              Conduct）、智能电表义务、脆弱客户保护和直接借记管理规则。2025 年 7 月，Ofgem 因直接借记付款中多收客户费用开出 £1.5 million 罚款——这是 Kraken
              CRM/计费自动化模块的直接失灵——并要求 Octopus 向受影响客户退还 £2.64 million、支付 £546,000 消费者补偿。这是 Octopus 首次重大 Ofgem
              执法，尤其值得注意，因为计费自动化正是 Kraken 平台声称的核心差异点。另一项 Ofgem 调查仍在进行，涉及预付费电表实践；此前行业更广泛担忧 2022-2023
              年强制安装预付费电表影响脆弱家庭。议会对能源供应商做法的审查已经加强，2023-2024 年特别委员会听证会审视了预付费电表滥用和家庭能源债务。Energy Act 2023
              对供应商提出新义务，涉及脆弱性识别、智能电表铺设和净零家庭技术安装，持续推高合规成本。Octopus 在 27+
              个国家运营，各国监管框架不同，合规风险会叠加。在德国、法国、意大利、西班牙和日本，消费者保护法、数据隐私要求和智能电表标准各不相同；任何单一市场监管失误，都可能在该市场客户因 Kraken
              管理的运营承担合规后果时，影响 Kraken 的许可收入。
