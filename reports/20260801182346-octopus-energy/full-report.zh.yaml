      - number: '3.3'
        title: 能源技术平台竞争对手
        blocks:
          - type: paragraph
            body: >-
              Oracle Utilities 是全球占主导地位的传统公用事业客户管理和计费平台，通过授权部署（CC&B、MDM、Opower）服务超过 4.30 亿公用事业客户。 它的竞争地位靠 Oracle ERP
              集成、成熟的专业服务生态，以及数十年建立的高管买方关系支撑。Oracle 的部署模式主要是本地部署或 Oracle Cloud Infrastructure，大型公用事业公司实施周期为 3–5 年，重建平台成本
              £10M–£50M。这为既有客户形成高切换成本， 也让 Oracle 不适合需要几个月内上线的挑战者零售商。Kraken 的云原生、单代码库 SaaS 能在数月而非数年内接入一家新公用事业公司。

              Kaluza 是 OVO Energy 自有的智能能源平台，是英国与 Kraken 功能最接近的同类。它处理 EV 智能充电调度、需求灵活性和客户互动。 截至 2024 年，OVO 已将 Kaluza
              授权给约两家英国外部公用事业公司，但没有披露 SaaS 收入或已签约账户数，无法直接基准比较。 Kaluza 的战略范围看起来比 Kraken 更窄，对完整计费到调度栈的强调更少，也没有确认的国际授权计划。

              Ensek（Ignition 平台）面向英国中端能源供应商（少于 500K 账户），提供云原生计费、CRM 和市场结算。其路线图整合 AI 自动化和行为洞察层 （Flex 模块），会让它更接近 Kraken 的
              ML 调度功能。Ensek 缺少 Kraken 的国际授权网络和批发价格优化基础设施，竞争被限制在英国居民中端市场。 没有其他公用事业软件平台宣布可与 Kraken 规模相当的国际云原生授权战略。
