        Includes the six most directly comparable public and private entities for Octopus Energy Group across UK
        utility, European renewable, private energy-tech, and SaaS reference categories. Global utility universe is not
        exhaustively enumerated. Private comparables (OVO/Kaluza) are included where valuation signals exist in press or
        analyst reports. EV/Revenue multiples are sourced from filed accounts, S&P Global Market Intelligence,
        Morningstar, and Reuters.
