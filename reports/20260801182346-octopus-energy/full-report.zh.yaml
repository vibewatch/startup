  - id: TV005
    title: 论点破裂和止损触发器表
    columns:
      - 触发器
      - 触发阈值
      - 导致论点破裂的机制
      - 行动含义
    rows:
      - - Ofgem 进一步执法牵涉 Kraken 计费
        - 自 2025 年 7 月罚款起 18 个月内，任何援引计费自动化失效的新执法行动或临时决定
        - 直接否定 Kraken 核心差异化主张；授权客户可能重新评估或退出；ARR 增长停滞；SaaS 倍数坍塌
        - 全面复核 Kraken 授权客户合同和 ARR；重估基准与牛市情景；若 SaaS 倍数假设站不住，考虑退出
      - - 主要 Kraken 授权客户离开
        - 失去任何占 Kraken ARR 超过 15% 的授权客户（如 E.ON Next UK、Tokyo Gas、National Grid US）
        - 暴露授权客户流失风险；释放产品或服务质量失效信号；ARR 增长可能抵不过客户流失；牛市情景坍塌
        - 立即要求 ARR 审计；测算 ARR 下降 20–30% 的模型敏感性；将投资列入观察名单
      - - Kraken 分拆结构对集团投资人不利
        - 分拆披露但不按比例分配股权；分拆后向 Kraken 支付的授权费高于市场；或集团投资人不获得 Kraken 股权
        - 抹掉 $9B 估值中的主要上行来源；剩余集团价值回落至纯公用事业倍数，隐含 $1.3–2.2B
        - 聘请法律顾问评估少数投资人权利；判断剥离条款是否允许按当前账面价值退出
      - - 降价轮或压力型二级交易
        - 2026 年 5 月后 24 个月内，任何隐含估值低于 $7B 的一级融资或二级交易
        - 显示机构对软件论点失去信心；触发 LP 按市值减记；为 Kraken 分拆制造负面动量
        - 立即复核估值；重估仓位规模；要求 GP 透明披露股权结构和优先权机制
      - - 大宗商品价格冲击或 Ofgem 价格上限下调超预期
        - Ofgem 价格上限环比下调超过 10%，且批发远期价格显示未来两个或更多季度利润率损失已锁定
        - 零售业务转为经营亏损；集团动用大宗商品信贷额度；分红能力消失；重心从增长转向生存
        - 压力测试流动性；确认大宗商品信贷额度余量；推迟任何新增资本投入
    claimRefs:
      - CV021
      - CV033
      - CV034
      - CV036
      - CV037
      - CV039
      - CV040
    notes: 触发阈值是分析师基于相对论点假设的重要性作出的判断。它们不是投资管理指令，也不构成投资建议。
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - Kraken ARR（经审计）
        - 按客户、合同类型、地域和增长率拆分的经审计 Kraken Technologies ARR；流失率；净收入留存
        - $9B 估值依赖 Kraken 拿到 SaaS 倍数；未经审计的管理层 $500M+ ARR 说法，没有独立验证就撑不起该倍数
        - 要求开放数据室；查阅 UK Companies House 的 Kraken Technologies Ltd 经审计账目；要求四大会计师事务所对 ARR 出具审计意见
      - - Kraken 分拆结构
        - 股权分配方案、优先权清偿顺序、分拆后 Octopus 零售向 Kraken 支付的授权费、治理结构、时间表，以及 IPO 或二级交易路线图
        - 没有分拆结构，$9B 估值最主要的上行来源无法量化；价值可能流向 Kraken 实体，损害集团投资人
        - 管理层披露；法律顾问审阅分拆文件草案；董事会层面沟通少数投资人保护
      - - Ofgem 执法轨迹
        - 2025 年 7 月计费罚款的处理结果和整改状态；预付费电表调查状态；Ofgem 对 Kraken 自动计费的未来监管姿态
        - 第二次执法会触发论点破裂；持续调查形成或有负债，公开信息无法量化
        - 直接询问 Ofgem；查阅数据室披露的监管往来；法律意见评估最大责任敞口
      - - 大宗商品采购信贷额度
        - 大宗商品采购额度的规模、期限、交易对手、抵押条款和使用情况；截至 2026 年的对冲比例和按市值计价敞口
        - 0.76% EBITDA 利润率几乎没有缓冲；价外对冲头寸或信贷额度撤回会立刻变成流动性风险
        - 索取资金管理资料包；独立审查大宗商品对冲政策和交易对手信贷线
      - - 集团合并账目
        - 完整集团合并 P&L、资产负债表和现金流量表，并披露分部（英国零售、Kraken 软件、发电、国际）
        - UK Companies House 申报披露有限；公开来源无法验证分部利润率和现金头寸
        - 要求在数据室提供经审计集团账目；如无法提供，则要求管理账目，并由审计师对关键指标签字
    claimRefs:
      - CV003
      - CV007
      - CV026
      - CV027
      - CV029
      - CV033
      - CV039
    notes: 尽调路径假设公司配合正式数据室流程。部分事项（如 Ofgem 调查状态）可能受监管保密限制。
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Octopus Energy 的公开历程，从 2016 年英国数字化挑战者，走到 2025 年全球市场领导者和平台授权方；其间有两次政府促成的收购、四次重大融资， 以及 2025 年 9 月 Kraken 分拆。
    data:
      items:
        - date: '2015'
          label: 成立
          detail: Greg Jackson、Stuart Jackson 和 James Eddison 在伦敦注册公司，定位清洁能源。
          tone: positive
        - date: '2016'
          label: 市场启动
          detail: 以数字化挑战者身份进入英国零售能源市场，运营由 Kraken 支撑。
          tone: positive
        - date: '2020'
          label: Tokyo Gas 投资 $200M
          detail: 首个重要国际战略投资方入局；日本合资路径打开。
          tone: positive
        - date: 2022-12
          label: 收购 Bulb Energy
          detail: 政府支持交易；新增 1.5M 客户；英国市场地位更稳。
          tone: positive
        - date: 2023-09
          label: 收购 Shell Energy UK
          detail: 借助 Kraken，3 个月内迁移 1.3M Shell Energy 客户。
          tone: positive
        - date: 2023-12
          label: 以 $8B 估值融资 $800M
          detail: Origin Energy、GIM、CPP Investments、Tokyo Gas 参与这轮标志性清洁能源融资。
          tone: positive
        - date: 2024-05
          label: 估值升至 $9B
          detail: GIM 和 CPP 加仓；Aware Super 共同投资。
          tone: positive
        - date: 2025-01
          label: 英国市场第一
          detail: 超过 British Gas；份额 24%；覆盖 7.8M 户家庭。
          tone: positive
        - date: 2025-05
          label: Ofgem 超额收费整改令
          detail: 因固定费用错误，被要求退还 £2.64M，并支付 £546K 善意补偿。
          tone: warning
        - date: 2025-07
          label: Ofgem 开出 £1.5M 罚款
          detail: 因未向约 34,000 名预付费客户出具最终账单而被罚。
          tone: negative
        - date: 2025-09
          label: Kraken 分拆
          detail: Kraken Technologies 成为独立实体；Amir Orad 任 CEO；估值最高估计 £10B。
          tone: positive
        - date: 2025-10
          label: 全球客户达 10M
          detail: 零售客户达到 10M，覆盖 27+ 个国家和 8 个直营市场。
          tone: positive
