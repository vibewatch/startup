chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group Ltd 于 2015 年注册成立，2016 年进入英国居民能源市场，作为挑战者供应商，靠直接面向消费者的数字模式，
              提供简单、有竞争力的绿色能源费率。公司随后演变为垂直整合的清洁能源集团，横跨三个互相咬合的板块：能源零售供应、Kraken 云技术平台，以及通过 Octopus Energy Generation
              布局的可再生能源发电。零售业务服务英国、德国、法国、意大利、西班牙、 日本、美国和新西兰客户；截至 2025 年初，英国仍是主导市场，覆盖 780 万户家庭，约占居民市场 24%。Kraken
              是专为公用事业打造的操作系统， 处理全球 7000 万个已签约账户的计费、客户管理、智能电表集成和灵活调度；2025 年 9 月被分拆为独立实体。Octopus Energy Generation 管理约 £7B
              资产，覆盖陆上风电、海上风电和太阳能，是欧洲较大的专注可再生能源投资者之一。集团收入既来自能源零售的大宗商品毛利， 也来自 EDF、E.ON Next、Origin Energy 和 Tokyo Gas 等
              Kraken 客户的经常性 SaaS 授权费，在能源行业形成少见的双收入结构。 Octopus Electric Vehicles 是 EV 租赁和智能充电子公司，Electroverse
              是公共充电网络，两者把集团触角延伸到相邻的电气化市场。
