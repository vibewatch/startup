      - number: '8.2'
        title: 估值背景与可比公司
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 是私人公司，没有公开上市股票。最近一次独立价格信号是 Q1 2024 CPP Investments 轮，隐含集团估值 $9 billion（按 2024 年平均汇率约
              £7.1 billion）。这之前，Generation Investment Management 在 2021 年以据报 £2.2B 估值投资 £630M，说明三年内在客户增长和 Kraken
              许可动能推动下，估值大约提升 3x。2025 或 2026 年没有公开确认的新股融资轮。可比公司分三类。纯英国能源供应商（Centrica、EDF UK）以 0.15–0.5x EV/Revenue
              交易，反映零售利润率薄、商品敞口和监管风险。基础设施权重更高的能源公司（SSE）享有溢价，通常为 1.0–1.5x，因为受监管网络资产的收益型估值高于商品零售。Ørsted 等海上风电开发商在 2021
              年凭转型可选性以 4–5x 收入交易，但到 2024 年随着海上风电成本上升、利率走高，压缩到约 2.5x；这对 Octopus 自身的科技溢价估值是一个警示先例。Kraken 最相关的 SaaS 可比包括
              Salesforce、ServiceNow 及类似企业垂直 SaaS，交易在 8–12x 收入。如果 Kraken 的 $500M+ ARR 得到验证，且分拆以 8x ARR 倍数成功执行，仅 Kraken
              实体估值就约 $4B；按 0.3x 收入倍数计入零售公用事业业务后，当前 $9B 集团价格仍有上行空间。基准情景不假设完整重估；它假设 Kraken ARR 混合倍数为
              5–7x，零售收入基础适用纯公用事业倍数，得到 $4–5.5B 的集团股权价值。
