  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 的投资逻辑分两层：第一，公司打造了一个结构上更优的英国零售能源业务，增长快于任何可比同业，并维持高于市场的获客经济性；第二，也是支撑 $9B
              估值更关键的一点，Kraken Technologies 平台是一项真正的垂直 SaaS 资产——它把运营系统授权给第三方公用事业公司，已经规模化，当前声称拥有 $500M+ 经常性
              ARR；一旦从零售能源业务中分离，就应获得科技公司倍数，而不是公用事业倍数。五个投资逻辑支柱是：（1）英国市场领先，拥有 7.5M 居民客户，产生可防御零售现金流；（2）Kraken 在 27 个国家覆盖 70M
              个账户，形成抵御新进入者的许可护城河；（3）进入德国、日本、澳大利亚、Texas 和其他市场，提供纯英国公用事业公司没有的增长可选性；（4）能源转型带来多十年的结构性顺风；（5）CPP Investments 和
              Generation Investment Management 以 $9B 成为机构锚定投资者，给出了来自成熟投资者的可信价格信号。反向逻辑有四个结构性反驳：（1）Kraken 计费自动化故障——经 2025
              年 7 月 Ofgem 执法验证——直接反驳了 Kraken 软件优势已被证明且可规模化这一核心主张；（2）$9B 估值对应集团收入 1.3x，要求市场相信 Kraken 会在分拆时获得 SaaS
              重估，但这一结果尚未确认，且随着能源软件倍数压缩，不确定性上升；（3）Octopus 0.76% EBITDA 利润率几乎没有缓冲，一旦商品价格或 Ofgem 上限逆向变动，就可能进入亏损年份；（4）Kraken
              分拆增加结构复杂性，也可能在独立软件供应商 Kraken 和其最大客户 Octopus 之间制造潜在利益冲突。
