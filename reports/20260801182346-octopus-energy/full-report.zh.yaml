      - number: '6.5'
        title: 扩张集中度与落地扩张动态
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy 的扩张经济性由两套不同的落地扩张逻辑驱动。零售细分的主要扩张机制是产品交叉销售：一个从标准浮动资费获得的客户，可以升级到 Agile，再到 Intelligent Octopus
              Go，再到捆绑 EV 租赁或 Cosy Octopus 热泵安装。每一步都会提高客户 LTV、降低流失，并为 Kraken 平台生成更丰富的需求调度数据。Electroverse
              把客户关系延伸到公共充电。Octopus Electric Vehicles 增加薪酬牺牲租赁。Zero Bills
              产品在资费关系之外带来硬件安装收入。这在能源生态中形成了多产品漏斗，与商品化零售能源供应明显不同。Kraken B2B
              的扩张逻辑则是地域和垂直：客户通常先从一个市场或一个模块开始，再逐步扩展到更多市场或模块。National Grid US 从初步讨论走到完整 Kraken 部署，是大规模地域落地扩张。Severn Trent
              Water 用 Kraken 管理水务公用事业，则代表能源之外的垂直扩张。英国居民细分的客户集中度风险中等：没有单个居民客户贡献有意义收入份额，商品化零售市场中的前 10
              大客户风险实际为零。更重要的集中度风险在细分层面——英国居民零售贡献集团收入和利润的大多数，因此英国监管或批发市场环境恶化，会对集团产生不成比例影响。消费者采购摩擦低（数字优先、无退出费切换），但 B2B
              Kraken 客户采购摩擦高（替换计费系统是多年迁移，需要董事会级批准和大量实施资源）；这让赢客户很难，同时也让客户流失很少见。
            claimRefs:
              - CU020
              - CU021
              - CU022
              - CU023
              - CU024
