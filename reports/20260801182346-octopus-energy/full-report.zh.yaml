      - number: '4.3'
        title: 资本充足性与财务位置
        blocks:
          - type: paragraph
            body: |
              Octopus Energy Group 已在多轮融资中筹集超过 $2B 股权资金（详见第 1 章，通过 claimRefs 指向公司概览）。最近披露的估值是
              2024 年 5 月 $370M 融资后的 $9B。FY24 净资产为 £1.7B。手头现金、月度运营消耗和未提款债务额度没有在任何公开文件中披露；
              Companies House 上 Octopus Energy Group Ltd（公司编号 09263047）的年度申报滞后 12-18 个月，也不提供详细流动性分析。
              Centrica 的公开年报可作为在位者成本和资本结构的比较点：Centrica（British Gas 母公司）报告净现金为正，
              由上游和交易业务支撑，这是结构性优势；Octopus 通过拥有 Kraken IP 部分抵消。

              可再生能源发电板块资本强度高：按 £7B 组合 AUM 收购和开发约 4.9 GW 风电和太阳能资产，意味着显著动用项目融资。
              OEG 发电资产通常通过无追索权项目债融资，把大部分债务隔离在 Octopus Energy Group 零售资产负债表之外。Kraken 分拆预计在
              2025 年 9 月以 $500M 已签约 ARR 触发，将为 OEG 股东带来部分变现事件，在无需整体出售的情况下提供流动性。Ofgem 于
              2025 年 7 月因多收客户直接借记款，对 Octopus 罚款 £1.5M，形成财务和声誉风险；但相对集团收入规模并不重大。
              没有披露现金位置就无法分析跑道，但 FY24 盈利（净利润 £83M）表明 Octopus 在集团层面已越过盈亏平衡。
