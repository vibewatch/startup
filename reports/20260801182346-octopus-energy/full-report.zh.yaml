      - number: '4.4'
        title: 财务结论与尽调议程
        blocks:
          - type: paragraph
            body: |
              Octopus Energy Group 的财务画像最好拆成两门不同生意来看：一门是大规模、低毛利的零售和大宗能源业务（收入 £12.4B，约
              0.76% EBITDA 利润率），另一门是高增长、高毛利 SaaS 平台（Kraken：SaaS 收入 £90M、利润 £35M、增长 68%）。
              收入质量混合——零售收入体量大，但暴露于大宗商品价格波动、监管价格上限和营运资本波动；Kraken SaaS 收入则是经常性、已签约且高毛利。
              Kraken 的部分分拆会模糊后续财务可比性，并引入估值拐点风险。

              主要财务尽调阻断点包括：（1）没有公开披露现金、未提款信贷额度或月度消耗；（2）没有经独立审计的分板块毛利视图；（3）国际零售亏损位置未量化；
              （4）Kraken 分拆估值和所有权经济性尚未披露。鉴于 FY24 集团层面盈利，以及按更高估值持续获得融资的记录清晰可见，资本风险看似可控，
              但没有数据室访问就无法确认。对潜在投资或合作而言，核心问题是：当英国能源市场危机后正常化、零售毛利受压时，Kraken 的 SaaS 毛利画像能否结构性抵消。
