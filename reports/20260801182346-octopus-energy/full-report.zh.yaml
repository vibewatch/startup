  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与客户工作流集成
        blocks:
          - type: paragraph
            body: >-
              Octopus Energy Group 覆盖完整能源客户生命周期，三条主产品线分别是带智能电价的零售能源供应、Kraken B2B 平台，以及 Octopus Energy Generation
              投资部门。从客户工作流看，零售主张始于获客——主要数字化、无退出费切换——随后完成智能电价开通， 再通过半小时数据、自动直接借记和 App 控制形成持续互动。智能电价是主要产品差异点：Agile Octopus
              提供挂钩批发市场价格的半小时动态定价， 奖励把需求转移到低碳、低成本时段的客户。Intelligent Octopus Go 面向 EV 车主，在批发价最低时自动给车辆充电，夜间价格为
              8p/kWh，相比公共充电最高节省 85%。Cosy Octopus 为热泵用户设计，在热泵效率最高的早晨和下午提供补贴费率。Flux 面向太阳能加电池家庭， 按动态费率支付上网和购电。Fan Club
              在风电场发电时，奖励附近客户折扣。Zero Bills 提供由 Octopus 安装太阳能和电池的住宅， 持续能源账单为零，彻底消除客户能源成本。企业端，Shape Shifters 费率套件包括 Trio 和
              Agile 变体，Electric Match 与 Wind Works 面向商业和工业客户。Electroverse 将欧洲 EV 公共充电聚合到一个漫游账户中，把产品足迹延伸到公共出行基础设施。
              这些产品合在一起，把 Octopus 定位为全屋能源管理者，而不是大宗能源供应商；Kraken 平台支撑所有客户侧编排，从智能电表数据摄取到调度指令和计费结算。 Octopus Electric Vehicles
              子公司提供薪资牺牲式 EV 租赁，让客户更深绑定生态，也为 Kraken 需求调度引擎产生更多数据。 Octopus 收购 Heatmiser，以控制热泵排程并接入 Kraken 的 VPP
              调度层，把公司的垂直整合栈从软件经硬件延伸到家庭。 OEG 通过拥有和管理发电资产增加供给侧维度，使 Octopus 能越来越多地用自有可再生发电匹配客户负荷。
