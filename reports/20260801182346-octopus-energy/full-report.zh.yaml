companyProfile:
  summary: >-
    Octopus Energy 是一家英国后期私营能源公司，由 Greg Jackson 于 2015 年创立。公司在英国向 750 万客户供应零售能源， 并将 Kraken 云平台授权给 27 个以上国家的 7000 万+
    公用事业账户。OEG 在 FY24 首次实现实质性盈利（收入 £12.4B、净利润 £83M），而 2025 年末披露进一步凸显 Kraken 作为独立软件资产的价值。Kraken Technology 于 2025 年 12 月以
    $8.65B 估值分拆，把集团内嵌的 SaaS 价值锚定出来。OEG 在英国能源市场拥有最高 NPS（连续七年获 Which? Recommended Provider），并已取得 B Corporation 认证。
  foundedDate: '2015-01-01'
  founders:
    - name: Greg Jackson CBE
      role: CEO 兼联合创始人
      background: 创办 OEG 前是连续软件创业者，剑桥大学经济学毕业。Greg Jackson 是 Octopus 使命驱动品牌、技术战略和国际扩张的核心推手。 他一直抵制战略出售叙事，并为 Kraken 最终 IPO 做定位。
