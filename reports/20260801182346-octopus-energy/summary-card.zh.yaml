  topStrengths:
    - Kraken Technology 以 $8.65B 估值拆分（2025 年 12 月）——这是一家定义品类的公用事业 SaaS 平台，覆盖 27+ 个司法辖区、70M+ 合同账户，17x ARR 倍数符合赢家占优的平台逻辑。
    - 连续七年获 Which? Recommended Provider，NPS 超过 +60，反映 Kraken 在线上生产环境的表现，也验证了平台对潜在公用事业授权客户的核心价值。
    - 持续投入之后，FY24 首次实现实质盈利（£83M 净利润、£95M EBITDA），降低了后期烧钱风险，也证明零售和技术业务能在经济性上互相支撑。
    - OEG Generation 的太阳能资产组合能天然对冲批发电价飙升，形成纯零售竞争对手没有的结构性成本优势。
  topRisks:
    - Kraken ARR（估计 $500M+）未经审计，也没有任何公开披露确认；拿不到数据室里的经审计经常性收入和分地区流失率，就无法承销整个 $8.65B 拆分估值和 17x ARR 倍数。
    - OEG 的大宗商品采购授信（规模、交易对手、契约）没有公开披露，形成无法建模的隐性杠杆；一旦大宗商品价格承压，可能触发追加保证金。
    - Ofgem 执法仍是现实风险：2025 年 7 月 £1.5M 计费罚款和 2023 年仍未结案的预付费电表调查，都是金额未知的或有负债，并可能升级为全行业市场调查。
    - Kraken（70M+ 账户）依赖 AWS 单云，形成灾难性故障模式；公司没有披露多云故障切换或灾备测试结果。若 P0 宕机同时触发 SLA 赔付和监管谴责，投资假设会被打穿。
  unresolvedGaps:
    - Kraken ARR 和过去 12 个月分地区流失率——主要估值驱动无法从公开来源审计；没有这些数据，$8.65B 倍数就是推测。
    - OEG 大宗商品授信：规模、交易对手、契约和按市值计价头寸构成隐性杠杆，没有数据室访问权就无法建模。
    - 完整优先权 / 稀释结构（Series A 至 E）：二级投资人仅靠公开申报无法计算有效每股经济性；Companies House 只提供部分数据。
    - Ofgem 预付费电表调查（2023）：截至运行日，Octopus 相关事项尚未公布正式结果；公开数据无法量化或有负债。
    - OEG FY25 经审计账目尚未发布；Kraken 拆分后、2025 年 7 月 Ofgem 执法后的财务状况仍未知。
