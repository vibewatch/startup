- id: direct-peer-profiles
  title: 'Direct Peer Profiles: Scale, Funding, Target Customer, and Strategic Direction'
  body: 'Unitree Robotics (Hangzhou) is the scale leader: its STAR Market IPO filing
    discloses RMB1.7 billion 2025 revenue, RMB600 million adjusted net profit, 60.27%
    gross margin, and 5,500+ humanoid units shipped in 2025 (#1 globally), against
    a RMB12.7 billion pre-IPO valuation and a targeted RMB42 billion minimum IPO market
    cap; it self-manufactures over 90% of core components and plans to expand to 75,000
    humanoid and 115,000 quadruped annual capacity. AgiBot (Shanghai) reached its
    15,000th mass-produced general-purpose robot in June 2026, having scaled from
    1,000 to 10,000 units in three months, spans the A2, G1, X1, and X2 product lines,
    and set a Guinness World Record for humanoid walking distance; TrendForce credits
    its standardized, order-driven supply chain for the ramp. UBTECH Robotics is the
    only Hong Kong-listed (9880) pure-play humanoid company in this set, targeting
    factory assembly lines with Walker S/S2 (the latter the first humanoid with autonomous
    battery swapping) alongside a legacy AI-education business. Fourier Intelligence
    (Shanghai) positions its GRx series and RehabHub product toward healthcare/rehabilitation
    and consumer-companion use cases rather than industrial deployment, a softer target
    market than DexForce''s. Robotera (Beijing) markets itself as the industry''s
    only fully self-developed software-and-hardware embodied-intelligence stack, including
    the XHAND1 dexterous hand, though its official product pages disclose little specification
    or pricing detail. DexForce itself reports more than RMB100 million 2025 revenue,
    guidance for 3-4x 2026 growth, a RMB10 billion+ Series B valuation, and named
    industrial customers (Midea, CRRC, Wuling) -- a materially smaller and less transparent
    scale footprint than Unitree''s or AgiBot''s disclosed production and financial
    figures.'
