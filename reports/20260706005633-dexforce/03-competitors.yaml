- id: capability-pricing-gtm-trust-comparison
  title: Capability, Pricing, Go-to-Market, and Trust/Regulatory Comparison
  body: On disclosed capability, DexForce's W1 Pro claims sub-millimeter arm precision
    (±0.5mm) and up to 40 degrees of freedom with a 10kg single-arm payload -- figures
    none of the profiled peers publish at comparable granularity -- but it is a wheeled,
    not bipedal, platform, while Unitree, AgiBot, UBTECH, Fourier, and Robotera all
    field bipedal humanoids, and independent coverage notes that Fourier, UBTECH,
    and AgiBot are all investing heavily in VLA (vision-language-action) model capability
    alongside Unitree. On pricing, Unitree is the only competitor with fully public
    list pricing (G1 from US$13,500; R1 dual-arm from RMB26,900/~$3,968), while AgiBot,
    UBTECH, Fourier, and Robotera all direct buyers to sales contact, matching DexForce's
    own lack of published pricing (third parties estimate the W1 Pro at $50,000-$150,000,
    or roughly $78,000). On go-to-market, DexForce's franchise-style "robot commercial
    service kiosk" operator-recruitment model for retail/tourism venues is structurally
    distinct from every peer's direct industrial/enterprise or consumer-retail sales
    motion. On trust and regulatory posture, China released its first national humanoid-robot
    standard system (HEIS, "2026 Edition") in February 2026, and the drafting committee
    was reported to include the founders of Unitree and AgiBot, giving those two companies
    a direct voice in standard-setting that DexForce is not reported to hold; separately,
    MIIT and China's State Council SASAC jointly launched a 2026 real-scene training
    program to validate humanoid deployment across industrial, service, and specialized
    scenarios nationally.
