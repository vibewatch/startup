callouts:
- calloutType: risk
  title: No disclosed vertical integration versus Unitree's self-manufactured hardware
  body: DexForce has not disclosed comparable in-house component manufacturing to
    Unitree's reported >90% self-manufactured motors, reducers, and lidar, leaving
    DexForce's hardware cost structure and supply-chain resilience as an open question
    during an industry-wide period of falling average selling prices.
  claimRefs:
  - CP021
  - CP022
  - CP050
- calloutType: insight
  title: Franchise kiosk GTM is distinctive but structurally replicable
  body: DexForce's operator-partner retail kiosk model is a real distribution differentiator
    versus every profiled peer's direct industrial/enterprise sales motion, with reported
    fast operator payback, but nothing in reviewed sources indicates a structural
    (contractual, IP, or capital) barrier stopping a better-capitalized or cheaper-hardware
    competitor from replicating it.
  claimRefs:
  - CP011
  - CP012
  - CP049
- calloutType: risk
  title: Sector-wide bubble and slower-ramp warnings compound DexForce's disclosure
    gap
  body: Morgan Stanley's far more conservative 2026 unit forecast and a Beijing NDRC
    official's overcapacity warning both target the sector broadly, but they weigh
    more heavily on a private, pre-IPO, non-profitable-disclosed company like DexForce
    than on already-profitable (Unitree) or already-listed (UBTECH) peers with independent
    capital-markets access.
  claimRefs:
  - CP045
  - CP046
  - CP047
  - CP048
  - CP051
