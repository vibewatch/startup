- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat Claim
  - Threat
  - Severity
  - Mitigation / Diligence Ask
  rows:
  - - Generative-simulation (DexVerse/DexWorldModel) reduces reliance on costly teleoperation
      data collection
    - Independent trade coverage of Unitree's IPO filing argues Unitree's real-world
      "data flywheel" (30,000+ quadrupeds, 5,500+ humanoids in active deployment)
      is a more durable advantage than pure-simulation approaches, and Fourier, UBTECH,
      and AgiBot are all separately investing in comparable AI-model capability
    - high
    - Request head-to-head benchmark data (e.g., WorldArena scores over multiple cycles)
      showing DexForce's margin versus Unitree's WMA or AgiBot's BFM-2 world models,
      not a single snapshot ranking
  - - First-mover franchise/retail kiosk go-to-market model
    - No disclosed structural barrier (patent, exclusivity) prevents Unitree, UBTECH,
      or new entrants from copying the operator-partner kiosk model once proven profitable,
      especially as consumer-grade hardware (Noetix, Booster) keeps getting cheaper
    - medium
    - Request exclusivity terms, patent filings, or proprietary retail-operations
      software that would block replication of the kiosk model
  - - Named large industrial customers (Midea, CRRC, Wuling)
    - Sources describe AI-model deployment/licensing rather than confirmed long-term
      exclusive contracts; competitors with vertically integrated hardware (Unitree)
      or public capital (UBTECH) could underbid on future industrial RFPs
    - medium
    - Request contract terms, duration, and exclusivity for the Midea/CRRC/Wuling
      relationships
  - - 'Physical-AI technical pedigree / #1 WorldArena ranking'
    - Benchmark leadership is a point-in-time claim; better-funded peers (Unitree,
      AgiBot) and non-China entrants (Tesla, Boston Dynamics) could overtake DexWorldModel
      in subsequent evaluation rounds
    - medium
    - Request the WorldArena methodology and DexForce's ranking history across multiple
      evaluation cycles
  - - Vertical integration / cost control
    - DexForce has not disclosed comparable in-house component manufacturing to Unitree's
      >90% self-manufactured hardware, leaving it more exposed to supply-chain cost
      pass-through as industry-wide average selling prices fall
    - high
    - Request DexForce's bill-of-materials sourcing breakdown and manufacturing/assembly
      ownership structure
  - - Regulatory / standard-setting influence
    - China's national humanoid robot standard-setting committee (HEIS) is reported
      to include the founders of Unitree and AgiBot, giving those companies a structural
      voice in future compliance requirements DexForce is not reported to hold
    - medium
    - Confirm whether DexForce holds any seat or advisory role on the HEIS standard
      committee or related MIIT working groups
  - - Overall category durability amid sector-wide bubble risk
    - A Beijing NDRC official and Goldman Sachs have both warned of overcapacity/bubble
      risk across 150+ Chinese humanoid companies, and Morgan Stanley forecasts a
      far slower 2026 ramp (~12,000 units) than bullish industry projections, which
      could compress funding availability for all but the best-capitalized or already-listed
      players
    - high
    - Track DexForce's runway, next-round timing, and dependence on continued venture
      funding given no disclosed profitability
  notes: Severity ratings are the author's evidence-backed qualitative judgment (high/medium),
    not a standardized scoring model; each row cites the specific competitor or adverse
    evidence used to assign it.
