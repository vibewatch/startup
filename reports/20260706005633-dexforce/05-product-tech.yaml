- id: deployment-integration-reliability-support-roadmap
  title: Deployment, integration, reliability, support, and roadmap
  body: 'DexForce''s clearest deployment evidence is its commercial-service-station
    rollout: a May 2026 release describes 10+ storefronts opened simultaneously across
    Xuzhou, Shenzhen, Guilin, and Yangshuo tourism and retail sites, drawing more
    than 100,000 visitors on launch day, followed by a second release claiming single-store
    daily revenue above RMB 100,000, a 4.6x revenue lift versus traditionally staffed
    stores, a 99% visit-to-purchase conversion rate, and a payback period as fast
    as six months during the Labor Day holiday window. These are entirely self-reported,
    holiday-peak figures with no named third-party operator audit. Integration support
    is documented in more procedural detail than most early-stage humanoid vendors
    publish: the Barista Operation Manual specifies a signed pre-opening checklist,
    capsule/cup restocking thresholds, and a fault-escalation phone line (400-8086-299)
    for unresolved errors, while the Humanoid API (v0.4.0) exposes ROS2 topics/services/actions
    for joint-level state and position control — but only at the low-level joint-control
    layer in the pages reviewed, with no higher-level task or skill API surfaced.
    DexForce''s own documentation and code are versioned but early: API v0.4.0, W1
    user manual v0.4.0, and Barista manual v0.1, with EmbodiChain''s GitHub roadmap
    note stating more features will be added "in the coming months" while the repository
    remains labeled Alpha. RBTX, a robotics-component marketplace, separately lists
    a 3-week delivery lead time for W1 Pro units sold through its channel. No source
    reviewed discloses fleet-level uptime, mean-time-between-failure, or warranty/RMA
    statistics for any deployed unit.

    '
