  title: Certification and reliability remain undocumented
  body: No reviewed source shows an independent safety/quality certification for the
    W1 Pro, and deployment-economics figures (revenue lift, conversion, payback) are
    single-source, holiday-period company claims with no fleet reliability data behind
    them.
