- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - DexForce solution
  - Measurable benefit signal
  - Limitation / caveat
  rows:
  - - Coffee/drink retail service
    - Manual staffing of espresso and beverage counters in malls, parks, and tourist
      sites
    - W1 Pro 'barista' configuration with tablet/voice ordering, a signed pre-shift
      checklist, and phone-based fault escalation
    - Company reports single-store day revenue above RMB 100,000 and 99% visit-to-purchase
      conversion during a holiday peak
    - Robot brews only one 110ml cup size; figures are unaudited, holiday-peak, and
      self-reported
  - - Multi-category commercial kiosk switching
    - Retail operators otherwise need one single-purpose vending machine per product
      category
    - Same general control 'brain' claimed to run espresso, draft-beer, and ice-cream/popcorn
      devices across 10+ simultaneously opened stores
    - Framed by DexForce as proof of cross-category generalization versus single-purpose
      vending automation
    - No independent verification of uptime or task-success rate across device types
  - - Secondary development / research integration
    - Labs and integrators need programmatic control of a humanoid platform
    - ROS2-based Humanoid API exposing joint-state topics and position-control services/actions
    - Documented message formats and topic names allow direct evaluation without full
      vendor lock-in
    - Reviewed pages cover only low-level joint control; no higher-level task/skill
      API surfaced
  - - Industrial pick / logistics sorting
    - Manual parcel or pharmacy-item sorting in warehouse settings
    - W1 Pro's dexterous-hand/gripper end effectors plus binocular vision, named as
