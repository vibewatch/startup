- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: DexForce's stack runs from perception and actuation hardware through a
    simulation/data-engine layer and a world-model/policy layer into developer and
    deployment interfaces.
  approximationNotes: Layer boundaries are inferred from product pages, the Core Technology
    page, GitHub, and the API/user manuals because DexForce has not published one
    canonical architecture diagram.
  data:
    layers:
    - id: perception-actuation
      label: Perception and actuation hardware
      detail: 6cm-baseline binocular pure-vision system with a large-model algorithm,
        optional wrist RGBD cameras, laser SLAM, dual 7-DOF arms, and dexterous-hand/gripper
        end effectors form the physical control substrate.
    - id: compute-runtime
      label: Onboard compute and control runtime
      detail: Dual-PC ≥300 TOPS architecture (single-PC ≥150 TOPS on the stationary
        unit) drives 1kHz whole-body control.
    - id: simulation-data-engine
      label: Simulation and data-engine layer
      detail: DexVerse™ generates physics-accurate synthetic scenes and data; EmbodiChain
        packages asset generation, scene layout, trajectory sampling, failure recovery,
        and online data streaming for training.
    - id: world-model-policy
      label: World-model and policy layer
      detail: DexWorldModel provides causal latent world modeling; Dexterity-BEV aligns
        heterogeneous multi-camera, multi-embodiment robot data into one BEV coordinate
        frame for policy training.
    - id: developer-integration
      label: Developer and integration interfaces
      detail: The ROS2-based Humanoid API exposes joint-state topics and position-control
        services/actions; EmbodiChain's GitHub SDK exposes the training pipeline to
        external developers.
    - id: deployment-support
      label: Deployment and field-support layer
      detail: Barista/commercial-service scripts, pre-shift checklists, docs.dexforce.com
        manuals, and a phone support hotline manage on-site operation and fault escalation.
