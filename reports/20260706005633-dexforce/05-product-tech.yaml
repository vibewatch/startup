- id: module-sku-asset-map
  title: Module, SKU, and documentation asset map
  body: 'DexForce''s public surface enumerates at least six distinct product/asset
    lines. The W1 and W1 Pro humanoid ships in full-body (34 DOF, mobile, laser-SLAM
    navigation) and stationary half-body (22 DOF) configurations, both documented
    in parallel English and Chinese spec pages. DexVerse™ and DexWorldModel are the
    simulation/world-model engines behind policy training; EmbodiChain is the one
    component DexForce has open-sourced on GitHub under an Apache-2.0 license. RobotToday''s
    independent supplier profile adds two lines not prominent on DexForce''s primary
    marketing pages — a "Kingfisher" 3D smart camera and "PickWiz" vision software
    — consistent with the separate en.dexforce.top vision-solutions site, suggesting
    DexSense/vision hardware is sold as a distinct industrial-vision product rather
    than only as a humanoid accessory. Finally, DexForce''s documentation center (docs.dexforce.com)
    packages a Humanoid User Manual, a Secondary Development API reference, and a
    Barista Operation Manual, plus separate documentation trees for its 3D Vision
    Guidance Kit and camera hardware. Notably, third-party listings (RobotToday, RBTX)
    describe configurations with "up to 40 DOF," while DexForce''s own English and
    Chinese W1 Pro pages list 34 DOF for the full-body unit — a discrepancy no reviewed
    source reconciles, and one worth flagging before treating either figure as canonical.

    '
