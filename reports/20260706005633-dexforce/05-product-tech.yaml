  title: Commercial-service kiosks double as a training-data flywheel
  body: DexForce frames every barista/retail storefront as both a revenue pilot and
    a source of real operating data intended to feed DexWorldModel and EmbodiChain,
    tying its commercialization strategy directly to its Sim2Real data-engine thesis.
  claimRefs:
  - CE017
  - CE033
