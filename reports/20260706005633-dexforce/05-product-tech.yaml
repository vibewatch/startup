chapter:
  number: 5
  title: Product & Technology
  summary: DexForce sells an integrated hardware-software matrix — the DexVerse synthetic-data
    engine, DexWorldModel, the open-sourced EmbodiChain data/training platform, DexSense
    vision sensors, and the W1/W1 Pro humanoid robot — built around a Sim2Real loop
    that turns generated simulation data into deployed commercial-service and industrial
    workflows. Public documentation (a versioned ROS2 API, a W1 user manual with explicit
    safety and misuse warnings, and a barista operations manual) is unusually detailed
    for an early-stage humanoid vendor, but independent certification, fleet reliability
    data, and benchmark comparability all remain undisclosed.
sections:
- id: product-definition-and-workflow
  title: Product definition in customer workflow terms
  body: 'DexForce (跨维智能) describes itself as building an integrated hardware-software
    product matrix — the EmbodiChain embodied-intelligence development platform, the
    DexForce W1 Pro universal humanoid robot, and DexSense pure-vision spatial-intelligence
    sensors — deployed, in the company''s own words, across 50+ sub-industries and
    1,000+ projects. The clearest publicly documented customer workflow is not generic
    humanoid automation but a scripted commercial-service loop: an operator selects
    a robot configuration (full-body mobile or stationary half-body), integrates it
    either through the ROS2-based secondary-development API or a turnkey application
    such as the "barista" coffee-service package, runs a signed pre-opening equipment/material
    checklist, and then lets end customers order via voice or a tablet interface on
    the same local network as the robot. DexForce''s own May 2026 release frames this
    as a generalizable "brain" that can switch between espresso machines, draft-beer
    taps, and ice-cream/popcorn dispensers across more than ten simultaneously opened
    storefronts, explicitly contrasting this with single-purpose vending automation.
    The company also positions each live deployment as a data flywheel: real operating
    data from commercial-service stations is intended to feed back into DexWorldModel
    and EmbodiChain training, closing what an internal release calls the "data-model-embodiment-scenario"
    loop. This is a coherent, workflow-specific narrative, but it rests almost entirely
    on DexForce''s own releases and manuals rather than named third-party operator
    case studies.

    '
