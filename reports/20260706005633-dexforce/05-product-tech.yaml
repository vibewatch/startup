- id: FE003
  title: Critical dependency map
  type: dag
  layout: wide
  summary: DexForce's product execution depends on GPU/compute supply, its own open-source
    community, ROS2 conventions, commercial operator partners, an external benchmark
    platform, and an unresolved certification gap.
  data:
    nodes:
    - id: dexforce-platform
      label: DexForce product platform (W1/W1 Pro, DexVerse, DexWorldModel)
      detail: Central node covering hardware, simulation, and world-model layers
      type: process
    - id: gpu-compute-supply
      label: GPU compute and onboard AI-processing hardware supply
      detail: Underpins both DexVerse training throughput and onboard ≥300 TOPS compute
      type: input
    - id: embodichain-community
      label: EmbodiChain open-source community (GitHub)
      detail: Only external developer-facing surface; Alpha-stage and small but active
      type: input
    - id: ros2-ecosystem
      label: ROS2 middleware ecosystem
      detail: Underlies the Humanoid API's topic/service/action interfaces
      type: input
    - id: commercial-operator-partners
      label: Commercial-service-station operator partners
      detail: Provide the storefronts, staffing, and consumables behind reported revenue
        figures
      type: input
    - id: worldarena-benchmark
      label: WorldArena external benchmark platform
      detail: Source of the Track 2 leaderboard placement DexForce cites for DexWorldModel
      type: input
    - id: certification-gap
      label: Independent safety / quality certification
      detail: No certificate found in any reviewed source; a standing adoption and
        trust bottleneck
      type: output
