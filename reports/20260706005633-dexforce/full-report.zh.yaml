      - number: '5.4'
        title: 部署、集成、可靠性、支持与路线图
        blocks:
          - type: paragraph
            body: >
              DexForce 最清晰的部署证据来自商业服务站点铺开：2026 年 5 月发布稿称，徐州、深圳、桂林、阳朔的旅游和零售点位同时开出 10+ 家门店，开业日吸引超过 100,000
              名访客；随后另一篇发布稿称，单店日收入超过 RMB 100,000，相比传统人工门店收入提升 4.6 倍，访客到购买转化率 99%，劳动节假期窗口内最快 6
              个月回本。这些全部是公司自报的假日峰值数字，没有具名第三方运营商审计。集成支持的流程细节，比多数早期人形机器人厂商披露得更多：Barista Operation Manual 写明了签字版开业前检查清单、胶囊 /
              纸杯补货阈值，以及未解决故障的电话升级线（400-8086-299）；Humanoid API（v0.4.0）开放 ROS2 topics / services /
              actions，用于关节级状态和位置控制——但本次审阅页面只看到低层关节控制层，没有浮出更高层任务或技能 API。DexForce 自己的文档和代码有版本号，但仍很早期：API v0.4.0、W1 user
              manual v0.4.0、Barista manual v0.1；EmbodiChain 的 GitHub 路线图说明称“未来几个月”会增加更多功能，而仓库仍标为 Alpha。机器人组件市场 RBTX
              另列出，通过其渠道销售的 W1 Pro 交付周期为 3 周。没有审阅来源披露任何已部署设备的机队级正常运行时间、平均故障间隔时间或保修 / RMA 统计。
