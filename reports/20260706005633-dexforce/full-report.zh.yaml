      - - 关联方集中
        - 披露 Lens Technology 或另一名客户投资人占已报告收入的比例过高
        - 证实反论点中关于循环收入 / 投资的担忧
        - 对已报告收入基数打折；重估倍数
      - - 经审计披露或 IPO 申报
        - 发布经审计财务数据，或 STAR Market / HKEX 式招股书
        - 将从正反任一方向解决本章多数开放证据缺口
        - 基于新披露完整重跑本章分析
    notes: 触发项被定义为二元、可监测事件，绑定具体披露，而不是主观情绪变化。
    claimRefs:
      - CV055
      - CV056
      - CV009
      - CV057
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务
        - FY2024-FY2026 收入和损益表的勾稽、审计版本
        - 本章所有估值倍数都建立在未经审计、公司报告的数据之上
        - 在 NDA 下直接向 DexForce 管理层或审计师索取
      - - 股权结构和交易条款
        - 完整股权结构表，以及 Series B 工具类型、反稀释和清算优先权条款
        - 决定任何新投资人的真实经济所有权和下行保护
        - 向 DexForce 或参与 Series B 的投资人索取
      - - 客户集中
        - 按最大客户 / 运营商拆分收入，包括任何投资人-客户重叠（例如 Lens Technology）
        - 检验已报告规模来自广泛需求，还是少数关联方交易
        - 向 DexForce 索取客户级收入明细表
      - - 独立认证
        - W1 Pro 平台的安全 / 工业认证记录
        - 在 DexForce 自身安全免责声明之外，支撑商业部署风险判断
        - 向 DexForce 索取，或检索国家认证登记库
      - - 基准验证
        - 独立 WorldArena Track 2 排行榜确认
        - 验证最强的非财务技术差异化声称
        - 直接联系 WorldArena 基准组织方
      - - 法律实体验证
        - 中国企业登记库中的注册实体详情（研究时 CNVerify 受阻）
        - 在任何资本承诺前确认基本法律身份和所有权结构
        - 通过替代登记库提供商或中国境内律师重试
      - - 上市计划
        - 超出一般 IPO 准备表述的确认上市地点和时间表
        - 决定任何 IPO 前投资的现实退出周期
        - 监控 CSRC / STAR Market 和 HKEX 申报索引；直接向 DexForce IR 索取
    notes: 每项问题都映射到本章一个证据缺口，目标是在单轮后续尽调中可执行。
    claimRefs:
      - CV058
      - CV018
      - CV022
      - CV057
      - CV019
