      - number: '1.4'
        title: 规模口径、收入信号与商业里程碑
        blocks:
          - type: paragraph
            body: >-
              DexForce 的规模口径会随来源和日期变化，本章把这些数字视为公司声称，而非独立审计结果。英文首页（about.html）称已覆盖 “50+ 个细分行业和 1,000+ 个项目”；中文关于我们页面和公司
              2026 年 6 月 Series B 文章则称 “50+ 细分行业” 和 “1,500+ 项目”，并另有 “1,500+ 具身模型”
              的口径。后者看起来相近，其实是不同指标（已部署模型，而非已部署项目）；中英文项目数本身也不一致，最可能只是两个语种网站更新滞后，而不是两组独立验证数字。收入方面，EmbodiedGlobal
              引述创始人贾奎称，DexForce 2025 年收入超过 RMB 100 million，仅 H1 2026 就录得约 RMB 100 million，并指引 2026 全年收入增长 3-4x（隐含目标约 RMB
              300-400 million）；另有 DexForce 自己 Series B 文章引用的一名投资人预计全年收入“数亿元”，但未给出具体数字；更早的 2025 年 7 月 21jingji
              文章已称公司当时年化收入达到“亿元级”（RMB 100 million-plus），落地“数十个场景”，拥有 “100+
              企业客户”。这些证据显示收入轨迹在稳步上升，但仍是自报轨迹，不是审计结果。产品里程碑方面，DexForce 的 DexWorldModel 于 2026 年 4 月登顶 WorldArena
              全球具身世界模型基准测试的 Track 2（Functionality）榜单；同一时期，公司发布了 Dexterity-BEV 数据对齐方法（arXiv
              2606.02274）。商业上，公司从展会演示走向付费部署：2026 年 5 月 1 日一次铺设行动在一天内把 10+ 个机器人值守零售亭铺到五个城市地标，吸引超过 100,000
              名游客；同月内部报告声称单店假期收入超过 RMB 100,000，较传统人工值守亭收入提升 4.6x，进店到购买转化率 99%，回本周期最快六个月。2026 年 5 月 21-25
              日亮相中国（深圳）国际文化产业博览交易会，带来国家级媒体（CCTV）报道，并为 “DexBot Inside” 项目签下新的运营商伙伴。
