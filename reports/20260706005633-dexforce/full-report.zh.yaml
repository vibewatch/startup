  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层
        blocks:
          - type: paragraph
            body: >-
              DexForce 披露的客户基础至少横跨七类不同的买方 / 用户 / 付款方分层，而不是单一 GTM 动作。工业侧，大型制造商的采购团队（家电领域的 Midea、轨道装备领域的 CRRC、汽车装配领域的
              Wuling、精密玻璃 / 盖板部件领域的 Lens Technology）购买 DexForce 的具身 AI 模型，用于跑在第三方机械臂上的 bin-picking、装配和插装任务；产线工人是日常用户，OEM
              是付款方。第二类结构完全不同，是商业零售和餐饮服务；DexForce 不直接卖给消费者，而是向独立运营商提供“DexBot Inside”具身 AI
              大脑，运营商把硬件加盟进主题公园、商场、旅游街区等高客流场所；运营商既是买方也是付款方，消费者是终端用户。第三类新浮出的分层是科研和教育，证据是一家具名机构合作方 Guilin Tourism
              University，以及广州和梅州的另外三个 2026
              年合作方；本轮抓取到的任何来源都没有细化这些合作方的商业模式。地域集中在中国大陆（深圳、徐州、桂林、阳朔、汕尾、广州、梅州）；本轮抓取来源没有记录海外商业部署。客户旅程图（FU001）追踪了潜在客户通常如何从展会曝光进入试点，再进入具名披露，最后走向工业产线或零售加盟签约；售后支持也接续其后，Lens
              Technology 案例中还最终转成投资人关系。
