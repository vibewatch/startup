  - id: FM001
    title: 市场规模视角
    type: pyramid
    layout: standard
    summary: 中国人形机器人 / 具身 AI 机会分三层：口径最宽的产值池、更窄的对外销售出货市场，以及尚未量化的 DexForce 专属切口；三层方法论互不兼容。
    data:
      nodes:
        - id: tam
          label: TAM - 区域具身 AI / 机器人产业产值池（最宽，产值口径）
          detail: >-
            杭州单城具身 AI 集群已披露 2025 年产值 106.8B 元人民币（~$15.7B）；上海目标到 2027 年核心产值 >50B
            元人民币（~$6.96B）。这一口径太宽，且基于产值，不能直接等同于人形机器人销量。
        - id: sam
          label: SAM - 中国人形机器人市场，对外销售出货收入口径（Morgan Stanley）：$2B（2026）-> $15B（2030E）
          detail: 这是 Morgan Stanley 的总量美元口径；不含样机、预订单和内部使用，且其 2026 年出货量预测已在七个月内从 12,000 台上修至 50,000 台。
        - id: som
          label: SOM - DexForce 在工业 + 零售自助亭垂直场景中可触达的切口（作者设界，低置信度）
          detail: 公开来源没有披露 DexForce 的出货或收入份额；只能用其 Series B 投后估值 >$1.4B 和 50+ 个在运行场景做定性设界，覆盖汽配、NEV、3C、航空航天、物流以及零售 / 旅游自助亭。
    approximationNotes: >-
      三层口径基准不同（区域产业产值 vs. 全国对外销售出货收入 vs. 未量化的公司专属切口），不能相加；SOM 层是作者明示设定的边界，不是已披露数字。AgiBot 自身产能规模波动（CM019）说明，支撑 TAM/SAM
      的底层台数仍很不稳定。
    claimRefs:
      - CM019
      - CM022
      - CM023
      - CM024
      - CM026
      - CM027
