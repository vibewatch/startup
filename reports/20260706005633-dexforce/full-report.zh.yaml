      - number: '4.3'
        title: 成本结构、毛利驱动因素与资本支出
        blocks:
          - type: paragraph
            body: >-
              已找到的任何来源都没有披露 DexForce 的毛利率、销售成本或资本支出数字。其自有硬件规格（双 7-DOF 机械臂，每臂额定 10kg 负载、±0.5mm 精度；双板载计算机，算力不低于 300
              TOPS；有线连续运行 8+ 小时）意味着成本结构主要由精密执行、计算芯片和传感组件驱动，这与更广泛的人形机器人品类一致；但没有物料清单或供应商成本数据，无法为 DexForce 单独量化。缺少 DexForce
              专属披露时，本章用两个公开可比对象三角测算可能的利润率和资本支出区间：UBTECH FY2025 经审计毛利率 37.7%（FY2024 为 28.7%），合并收入 RMB2,001.0
              million；其新放量的全尺寸人形机器人细分收入同比增长 2,203.7%，在 1,079 台基础上达到 RMB820.6 million。另一个是 Unitree，报告 2025 年收入约 RMB1.7
              billion、出货 5,500+ 台人形机器人，毛利率 60.27%（2023 年为 44.22%）；同时，第三方执行器成本估算（The Robot Report 引述
              McKinsey）称，物料清单成本占人形机器人硬件成本的 40-60%。这些数字不应被解读为 DexForce 自身利润率；它们只为正在放量的中国人形机器人生产商建立一个合理区间（大约 30-60%
              毛利率），低端受硬件成本强度约束，高端受软件 / 授权收入占比支撑，而 DexForce 尚未确认该区间适用于自身业务。
