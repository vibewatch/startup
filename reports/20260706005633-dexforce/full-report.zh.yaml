      - number: '7.6'
        title: 财务与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              DexForce 在约两年内至少完成三轮已披露融资——Lenovo Capital 领投的 2024 年战略轮、2025 年中 A1 / A2 轮，以及 2026 年 6 月投后估值超过 RMB 100 亿元的
              Series B。这是该赛道典型的高资本强度、盈利前路径，也让估值建立在自报、未经审计的收入基础上。独立负面来源让增长案例明显复杂化：Morgan Stanley 预计中国 2026 年人形机器人出货约
              12,000 台，而部分行业预测超过 100,000 台；它把“limited working capability”列为约束条件，并认为 100,000 台关口要到 2030 年后才会跨过。另一路，北京
              NDRC 官员在 2025 年 11 月公开承认，速度和泡沫风险是行业现实问题；Goldman Sachs 据报也警示，没有实际订单支撑的过剩产能正在形成。China Daily
              记录了行业价格战已经展开（Unitree R1 起价 RMB 26,900，Noetix Bumi 定价 RMB 9,998，Booster K1 起价 RMB 29,900），这可能压缩全行业可实现
              ASP，包括 DexForce；但没有来源把 DexForce 自身定价与这一趋势做对标。披露标准上，DexForce 落后于更接近公开市场的可比公司：Unitree IPO 文件披露审计式 2025 年数字（约
              RMB 17 亿元收入、约 RMB 6 亿元净利润），UBTECH 的 HKEX 上市市值可持续观察；DexForce 作为只表态有 IPO
              意向的私人公司，既不披露审计财务，也没有公开市场估值。本次研究中，一个与更广泛行业评论相关的 HKEX filing 返回 404，阻断了对该特定文件的独立核验。另有行业范围 2026 年商业化分析记录，AI
              公司正普遍从固定 / 按席位定价转向按使用量、按 token 和混合定价，以让收入匹配可变算力和硬件成本；DexForce 没有公开披露 W1 / W1 Pro
              部署的定价或单机经济模型，因此无法判断其商业模式是否能承受同样的成本对齐压力。Unitree 的估值轨迹——2025 年中 $1.7 billion Series C 后，不到一年即提交 IPO 文件，目标隐含约
              RMB 420 亿元估值——加上 UBTECH 可持续观察的 HKEX 市值，进一步说明 DexForce 最直接竞争对手的公私市场估值重定价速度，而 DexForce 目前无法被对标。
