      - number: '5.5'
        title: 差异化、IP / 开源姿态与信任 / 安全 / 合规控制
        blocks:
          - type: paragraph
            body: >
              DexForce 声称的差异化，落在团队背景（超过 70% 员工从事 R&D，由其称为全球 top 2% 的科学家带队）以及开源 / 闭源混合的 IP 姿态：EmbodiChain 以 Apache-2.0
              发布在 GitHub，W1 Pro 的控制软件则被独立市场列表描述为 closed-source，DexWorldModel
              权重也未在任何审阅来源中公开。这种部分开放，本身就是它相对中国人形机器人市场的一个差异点；TrendForce 预计 2026 年中国人形机器人产量增长 94%，且 Unitree 和 AgiBot
              两家合计拿下近 80% 出货量——这意味着 DexForce 竞争的不是硬件出货规模，而是 world-model / data-engine 专长和商业服务细分场景。信任与安全方面，W1
              用户手册异常明确：它列出禁止误用场景（载客、医疗 / 生命支持、户外运行、陡坡、超载、牵引、液体 / 化学品运输），记录背部急停按钮、可选拉绳急停、底盘防撞条和 48V/40Ah
              电池包的电池管理系统，并直接说明机器人尚未通过医疗安全认证。没有审阅来源——无论官方页面、手册还是第三方列表——披露该平台取得任何独立工业安全认证（CE、UL、ISO 或同等认证）；另有市场评论称，Morgan
              Stanley 警示中国人形机器人商业化叙事整体存在“bubble”风险，跑在已验证的现场可靠性之前。合在一起看，DexForce
              在预期用途和误用边界上确实有文档纪律，但缺少第三方认证、机队可靠性数据和经独立验证的 benchmark 方法，平台安全和性能说法仍主要靠公司自证。
