      - number: '2.3'
        title: 买方、用户、付款方分层及采用路径
        blocks:
          - type: paragraph
            body: >-
              DexForce 的采用路径至少穿过四类不同买方路径。在工业制造中，买方 / 付款方是工厂运营或制造工程预算负责人；在 MIIT 和 SASAC 的 2026
              年真实场景训练联合行动下，他们往往与集成商、模型提供商和研究机构一起组成“创新应用联合体”。该行动要求每个省至少遴选 20 个场景单位、每家中央国企至少遴选 10 个，覆盖工业、服务和特种领域，并提出到 2026
              年底形成万台级部署能力。在商业服务亭细分中，买方 / 付款方是 DexForce 面向全国招募的本地运营商或加盟方，终端用户则是到店消费者；DexForce 自己的五一铺设行动在五个城市落地 10+
              个亭，并披露最快 6 个月回本、单店假期收入超过 100,000 yuan、较传统人工门店收入提升 4.6x、客流增长 30%-40%（旗舰点最高
              200%）——这些数字仍由公司披露，尚未独立审计。第三条路径是政府和国企牵头的示范点，触发因素是完成政策配额，而不是常规采购决策；上海实施方案给出一种明确的共同付款结构：合格项目最高补贴成本的 50%（上限 20
              million yuan），试点部署最高补贴投资额的 20%（上限 10 million yuan）。全国 MIIT/SASAC
              通知没有披露等同的资助比例，因此该项目的付款方经济性只能部分观察。所有细分里，采用都不是一次企业销售周期即可转化，而是在有记录的应用验证步骤之后才转化——MIIT
              自己的表述是“验证一个场景、部署一批、带动一片”。
