      - number: '4.6'
        title: 商业化怀疑：反向解读
        blocks:
          - type: paragraph
            body: >-
              The Robot Report 对 Unitree IPO 披露的分析，为整个人形机器人商业化叙事提供了一次反向校验；用同样的审慎态度阅读 DexForce 自身说法，这一点直接相关。尽管 Unitree
              的收入和利润率增速亮眼，该媒体发现，截至 2025 年 9 月的九个月里，Unitree 人形机器人板块收入只有 9.01% 来自工业应用，73.6% 来自科研 / 教育客户，17.4%
              来自商业展示。这意味着，即便是行业里商业化最靠前、已奔 IPO 的玩家，人形机器人收入大头仍来自非工业场景。该分析还指出研发费用 / 收入比从 31.39% 降至 7.73%，并引用 McKinsey
              估算：执行器和传感器 BOM 可占人形机器人硬件成本的 40-60%。两点都说明，这门生意仍在规模化中摸索可持续的单机经济性。DexForce 没有披露客户分部收入，因此无法判断它提到的 Midea / CRRC
              / Wuling 工业案例究竟是有收入的部署、试点，还是展示合作；在 DexForce 拿出可比的分部披露之前，Unitree 的发现足以让人把它的“工业客户”表述视为未验证。DexForce
              报告的收入增长并未因此失效，但它显著压低了一个判断的置信度：这些增长到底来自可持续的工业自动化需求，还是来自现阶段行业常见的试点、科研或展示活动。
            claimRefs:
              - CI029
              - CI043
              - CI044
      - number: '4.7'
        title: 财务判断
        blocks:
          - type: paragraph
            body: >-
              收入质量：DexForce 报告的收入增长（按 2025 年或 2026 年上半年口径超过 RMB 1 亿元，FY2026 目标因来源不同为 RMB 2.5 亿-4
              亿元）方向上可信；多家独立媒体以及早期独立投资人引述，均佐证其到 2025 年中已进入亿元人民币收入层级。但没有统一校准后的单一数字、没有披露客户 /
              分部组合，也没有任何经审计报表，收入质量无法有把握地评估——Unitree 工业收入占比偏低这一行业反向发现，是具体的谨慎理由。利润率路径：DexForce
              未披露自身毛利率；可比中国人形机器人厂商的毛利率随规模放量，从 20% 高段 / 30% 低段向 40-60% 区间改善，说明 DexForce 可能有一条合理但未被证实的路径。资本强度：业务一端是硬件
              capex（机械臂、算力、传感器），另一端是加盟 / 服务层（DexBot Inside），后者单位收入的资本占用可能低于纯硬件销售，但没有 capex
              或单机成本数据验证这一判断。投资判断障碍：（1）没有经审计财务报表或备案文件；（2）没有披露现金余额、烧钱速度或资金可支撑时间；（3）三个 FY2026 收入目标未对齐；（4）DexBot Inside
              渠道或工业客户没有披露客户集中度和合同条款；（5）中国企业登记来源访问受阻，无法独立验证资本结构。总体看，DexForce
              呈现出一个可信但财务不透明的增长故事；在有把握推进投资判断前，需要管理层提供经审计或审阅的财务数据、统一校准后的收入和利润率数字，以及客户集中度披露。
            claimRefs:
              - CI043
