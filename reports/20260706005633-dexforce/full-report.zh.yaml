      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              政策、成本和需求正在同时汇合成增长驱动。北京已把具身 AI 列为五年战略重点，导入补贴土地 / 办公空间和优惠银行信贷；MIIT 与 SASAC 的 2026
              年真实场景训练行动，把这一重点落成一条具体、配额驱动的部署路径；中国首个人形机器人和具身 AI 国家标准体系于 2026 年 3 月发布，覆盖安全、应用和生命周期管理三大支柱，由 120
              多家机构协作完成，降低了集成与合规不确定性；杭州具有约束力的地方条例于 2026 年 5 月生效，是该行业首个法律定义框架，可能成为其他省份复制的模板。成本侧，平均售价下降（Unitree 自身 ASP 从
              2023 年到 2025 年前三季度约降 72%），叠加更多零部件内部生产，并借力中国新能源汽车产业的共用供应链，正在改善工业和商业部署中的买方 ROI。TrendForce
              报道称，汽车制造、消费电子和物流客户的 2026 年订单在增加，试用采用正在转向真实需求。约束同样实质。Morgan Stanley 2025 年 11 月笔记把“工作能力有限”列为近期采用的绑定约束，包括大脑
              / VLA 模型与训练数据缺口、本体部件质量一致性问题，以及价格 / 成本压力；MIIT 自己 2026 年通知也明确要求补齐碰撞检测、力控、紧急制动和安全记录等尚未成熟的能力。北京 NDRC 官员和
              Goldman Sachs 也分别警告泡沫与过剩产能风险，背景是中国人形机器人公司已超过 150
              家（超过一半是创业公司或跨行业进入者），产能扩张跑在确认订单量之前。监管成熟度也不均衡：目前只有杭州拥有有约束力的地方立法，多数其他地区仍依赖非约束性战略规划或补贴试点项目；全球竞争也很激烈，Tesla
              Optimus、Boston Dynamics Atlas、Figure AI 和 1X，加上国内竞争者 Unitree、AgiBot 和 UBTECH，即便对 DexForce
              这类资金充足的中国玩家，也增加了定价与执行压力。
