      - number: '1.5'
        title: 反向背景与承销边界
        blocks:
          - type: paragraph
            body: >-
              DexForce 叙事最强的反向证据，来自 EmbodiedGlobal 自己对 Series B 的报道。该报道明确提醒：“与许多中国独角兽一样，KuaWei 的数字（1,500 个模型、99.9%
              成功率、亚毫米精度）来自公司自报，在第三方基准测试出现前应视为声称”；同时，估值跳升到 RMB 10 billion 以上“需要在 IPO
              窗口期拿出相匹配的收入增长”。这条提醒嵌在更大的行业层面警告里：Morgan Stanley 2025 年 11 月研究笔记（ChinaBizInsider 曾报道）对 2026
              年中国人形机器人出货量的预测保守得多，约 12,000 台，而行业多头的预测有些超过 100,000 台；其理由是当前机器人任务效率只有人类工人的
              20-30%，短期商业部署卡在成本和可靠性，而不是热度。该笔记并非 DexForce 专属，但直接适用于任何建立在 DexForce 自报 99.9%+
              任务成功率和零售快速回本声称之上的尽调。除了对规模数字的怀疑，本章还提出投资者在承销 Series B
              后估值前需要补齐的几项披露缺口：没有经审计财务报表，没有披露员工数，没有公开股权结构表或投票权安排；尽管具名企业客户（Midea、CRRC、Wuling、Lens
              Technology）暗示存在有意义的商业客户重叠风险，也没有客户集中度拆分。法定代表人与创始人的名字差异仍未解决，增加了一个治理透明度问题；后续章节（领导层、财务、风险）应持续跟踪，而非在此强行定论。
