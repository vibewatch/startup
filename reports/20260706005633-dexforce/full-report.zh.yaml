  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - DexForce 相关性
    rows:
      - - 工业具身 AI / 人形机器人部署（制造）
        - 面向汽车零部件、NEV、3C 电子、航空航天和化工等场景的柔性分拣、装配、物料搬运：人形 / 具身机器人硬件、基础模型授权和集成服务
        - 不具备具身泛化能力的传统定制工业机械臂 / 协作机器人；与具身 AI 无关的原始工厂自动化资本开支
        - 工厂运营 / 制造工程预算负责人，常由省级或 SOE 真实场景训练项目共同出资
        - DexForce 已通过 1,500+ 个已部署具身模型服务的核心市场
      - - 物流与仓储自动化
        - 仓库和配送中心里的具身拣选、分拣和物料运输任务
        - 不带具身 AI 决策层的固定输送线 / AGV 基础设施
        - 物流运营预算负责人或 3PL 运营商
        - TrendForce 点名的 2026 年增长垂直领域；邻近 DexForce 现有物流场景覆盖
      - - 商业服务 / 零售与文旅服务亭部署
        - 面向餐饮制备、零售和互动文旅体验的机器人即服务型服务亭，以及运转这些服务亭所需的运营商网络
        - 不具备具身 AI 适应性的传统人工零售 / F&B 劳动力和固定自动售货机硬件
        - DexForce 招募的本地运营商 / 加盟商（“运营商”）；业主 / 景区伙伴分成
        - 第二个核心市场；DexForce 自身案例数据（10+ 个服务亭、100k+ 访客）落在这里
      - - 具身 AI 基础模型 / 仿真软件授权
        - DexVerse 仿真引擎、DexWorldModel 及相关软件，独立授权或随硬件打包
        - 不具备具身 / 物理世界扎根能力的通用云计算或通用计算机视觉 SDK
        - 机器人 OEM、集成商，或 DexForce 自身硬件业务单元
        - DexForce 声称的长期差异化和护城河论点
      - - 相邻机器视觉 / 工业 3D 相机市场
        - DexForce Vision 品牌下销售的工业检测和引导用结构光 / 3D 相机硬件
        - 通用消费相机硬件和无关的计算机视觉研究支出
