      - number: '6.5'
        title: 扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              DexForce 近期扩张驱动来自“DexBot Inside”运营商 / 加盟模式：公司不直接卖断硬件，而是把具身 AI 大脑授权给独立运营商，由后者运营零售服务生意；在宣传 2026 年 5
              月首发周经济性后，公司立即发起全国运营商招募。这对 DexForce
              来说资本更轻，但执行风险集中在公司无法控制的运营商身上，新运营商稳态（促销后）单店经济性也未被验证。另有三项集中度风险突出。第一，DexForce 最容易引用的客户背书 Lens Technology 同时也是
              Series B 投资人，因此不是独立第三方数据点。第二，TrendForce 行业数据显示，Unitree 和 AgiBot 两家合计拿下中国 2026 年人形机器人近 80%
              出货量；Unitree（融资规模大得多）和 UBTech（已上市，FY2025 收入 RMB 20.01 亿元）都远大于 DexForce 独立报道的 RMB 1 亿元以上年化收入——这意味着 DexForce
              只能在残余小份额中与资本更雄厚的对手竞争。第三，本章能拼出的几乎所有具名客户证据，都集中在单一 Series B
              融资公告或单一展会签约事件周围，而不是广泛、独立来源的客户名单；相较于拥有完全独立客户背书基础的公司，这容易夸大持久需求的广度。DexForce 还表示有意推进
              IPO，最终会迫使更完整的客户集中度披露，但今天并不能提供这种可见度。
