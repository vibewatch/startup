      - number: '3.5'
        title: 护城河持久性、商品化风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              DexForce 核心护城河声称是生成式仿真 AI：DexVerse 引擎和 DexWorldModel（在 WorldArena 具身世界模型基准测试中排名
              #1）让其生成合成训练数据，而不必依赖许多中国同行使用的大规模遥操作数据采集。围绕 Unitree 自身 IPO 文件的独立行业报道，直接挑战这条护城河的持久性：Unitree 的“数据飞轮”——30,000+
              台四足机器人和 5,500+ 台人形机器人已在生成真实世界交互数据——比仅依赖仿真的“纯模型公司”更持久；Fourier、UBTECH 和 AgiBot 也都在各自冲刺可比的 AI
              模型能力。低端商品化风险已经可见：China Daily 报道 Unitree 自身人形机器人平均售价从 RMB593,000（2023）降至 RMB167,000（9M 2025），Leju 的 Kuavo
              ASP 同比下降 26% 至 RMB308,100；低于 RMB30,000 的消费级进入者（Noetix 的 Bumi 为 RMB9,998，Booster 的 K1 为 RMB29,900）和低于
              RMB100,000 的工业型号（Astribot 的 T1 为 RMB89,900），都显示 DexForce 估计价格更高的 W1 Pro
              所在品类价格点压缩得有多快。行业层面的反向证据进一步强化风险：Morgan Stanley 2025 年 11 月笔记仅预测 2026 年中国人形机器人约 12,000 台（相对部分玩家 100,000
              台预测），理由是当前机器人效率只有人类水平的 20-30%，集成复杂度和价格 / 成本压力构成绑定约束；另有北京 NDRC 官员和 Goldman Sachs 都警告 150+
              家公司组成的行业存在泡沫和过剩产能风险。对于 DexForce 这样未披露盈利能力或制造规模、仍为私营且 IPO
              前的公司，商品化压力叠加融资市场怀疑，构成的风险明显高于已盈利（Unitree）或已上市（UBTECH）的同行。
