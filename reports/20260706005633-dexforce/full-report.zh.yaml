      - number: '8.6'
        title: 退出准备度、投资论点破裂触发项与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              DexForce 自身公告明确把 Series B 定位为 IPO 准备；Series B 募资用途包括迭代世界模型算法、升级物理引擎、建设数据基础设施， 以及提升人形机器人能力和真实世界部署。这更像 IPO
              前的资本投放，而非单纯成长型股权融资故事；不过，没有任何来源披露已确认的上市地点或时间表。 退出准备度仍未被证明：独立安全认证尚未披露；作为对比的 UBTECH 自身投资者关系财务页面渲染成仅
              JavaScript 的空壳，没有可提取数据； 通过独立中国工商登记服务（CNVerify）验证 DexForce 注册实体详情的尝试，被反机器人挑战拦下，使本章连基础法律实体核验都未完成。
              另一项用创业融资数据库（Fundup）交叉核验 DexForce 融资历史的尝试同样被拦下；一个提到 DexForce 的备选 Gasgoo 文章 URL 返回 404。
              并行检索某家已上市中国人形机器人同业的特定 HKEX 申报索引链接时，也在单个报道周期内收到 404 “页面已迁移”提示，凸显即便已索引的监管文件也会很快失效，
              必须重新核验，不能凭记忆引用。下方投资论点破裂触发表和最终尽调问题表，把这些缺口转成具体、可监控的阈值：已审计收入披露或 IPO 申报，
              会是最能证实投资论点的单一事件；而下一轮下调、客户集中度暴露，或劳动节假日窗口之外服务亭经济性被记录为失效， 都会各自独立地把当前“继续研究”立场打向“回避”。
