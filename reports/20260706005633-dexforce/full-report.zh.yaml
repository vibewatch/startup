  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局框架：直接同行、在位者、相邻玩家、替代方案与内部自建
        blocks:
          - type: paragraph
            body: >-
              DexForce 所处的中国人形机器人与具身智能行业已经拥挤，并被监管层点名关注。北京 NDRC 一名官员 2025 年 11 月称，中国有超过 150
              家公司在做人形机器人，其中超过一半是创业公司或跨行业进入者，并警告重复、缺乏差异化的产品会带来泡沫和过剩产能风险。在这一群体中，本章基于能力和 GTM，把五家公司视为直接同行——Unitree
              Robotics、AgiBot、UBTECH Robotics、Fourier Intelligence 和 Robotera——因为它们都已出货或正在开发面向工业、商业或消费部署的通用人形机器人 /
              具身智能平台。Boston Dynamics 的 Atlas（已进入商业部署）和 Tesla 计划量产的 Optimus Gen 3 位于外侧一层，是 TrendForce
              明确拿来与中国队列比较的相邻全球在位者。对 DexForce 尤其重要的还有两层：现状替代方案——传统固定位置工业自动化和人力，这两者正是 DexForce 零售亭与工业部署试图替代的对象；以及内部自建，因为
              Midea、CRRC、Wuling 等大型工业客户原则上可以自建机器人 / 自动化能力，而不是授权 DexForce 的模型。潜在进入者还包括 China Daily 报道的低于 RMB30,000
              的消费级人形机器人浪潮（Noetix、Booster、Astribot）；这些企业正在全行业压低价格，商品化动态最终可能打到 DexForce 估计价格更高的轮式人形机器人类别。
