chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部、创立与商业模式
        blocks:
          - type: paragraph
            body: >-
              DexForce Technology Co., Ltd.（跨维（深圳）智能数字科技有限公司，英文报道中也写作 Kuawei Intelligence 或 Trans-Dimensional
              Intelligence）是一家围绕具身智能和人形机器人的中国国家高新技术企业。公司中英文关于我们页面均称其成立于 2021 年 6 月；百度百科企业资料给出更精确的注册日期： 2021 年 6 月 15
              日。总部位于广东省深圳市南山区科苑路 1001 号深圳创新投资大厦（亦译 Venture Building）14 楼；这一地址在公司英文站、中文站、文档中心和 dexforce.top
              视觉硬件商城中反复一致出现。公司称，超过 70% 员工从事研发，由其所谓“全球前 2% 科学家”带队。产品矩阵包括 EmbodiChain（发布在 GitHub、采用 Apache-2.0 许可证的开源 GPU
              加速具身 AI 开发平台）、DexForce W1 Pro 通用轮式人形机器人、DexSense 纯视觉空间传感器和 3D 工业相机（部分通过 dexforce.top 商城销售）、DexVerse 仿真 /
              合成数据引擎，以及 DexWorldModel 世界模型。商业上，DexForce 把硬件直接销售与其自称的 “Physical Token” 经济模型结合起来——按机器人执行的每个物理动作收费，呼应大语言模型按
              token 计价——并叠加类加盟的 “DexBot Inside” 运营商计划，由本地伙伴以收入分成方式运营机器人值守的零售和文旅亭。结果是一种混合商业模式：直接销售机器人和视觉硬件，授权
              EmbodiChain/DexVerse 软件栈，并运营一个按已部署机器人产能付费、而非一次性预付采购的运营商网络。
