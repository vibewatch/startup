  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品
        blocks:
          - type: paragraph
            body: >
              DexForce（跨维智能）称自己在搭建软硬件一体的产品矩阵——EmbodiChain 具身智能开发平台、DexForce W1 Pro 通用人形机器人、DexSense 纯视觉空间智能传感器——并称已落地
              50+ 个子行业、1,000+ 个项目。公开资料里最清晰的客户工作流，不是泛化的人形机器人自动化，而是一套脚本化商业服务闭环：运营方选择机器人配置（全身移动式或固定半身式），通过基于 ROS2 的二次开发 API
              或“barista”咖啡服务套件这类交钥匙应用接入，执行签字确认的开业前设备 / 物料清单，然后让终端客户在与机器人同一局域网内用语音或平板下单。DexForce 2026 年 5
              月的发布稿把它定义为可泛化的“大脑”，可在 espresso 机、鲜啤龙头、冰淇淋 /
              爆米花出餐设备之间切换，并已同时开出十多家门店；公司明确把它与单一用途自动售卖区分开。公司还把每个现场部署都定位成数据飞轮：商业服务站点的真实运营数据将回流 DexWorldModel 和 EmbodiChain
              训练，闭合内部发布稿所谓“data-model-embodiment-scenario”环。这个叙事连贯且贴近工作流，但几乎完全建立在 DexForce 自己的发布稿和手册上，而不是具名第三方运营商案例。
