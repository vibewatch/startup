  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: DexForce 的堆栈从感知和执行硬件出发，经由仿真 / 数据引擎层、世界模型 / 策略层，进入开发者和部署接口。
    approximationNotes: 层边界根据产品页面、Core Technology 页面、GitHub 以及 API / 用户手册推断，因为 DexForce 没有发布一张官方统一架构图。
    data:
      layers:
        - id: perception-actuation
          label: 感知与执行硬件
          detail: 6cm 基线双目纯视觉系统搭配大模型算法，可选腕部 RGBD 摄像头、激光 SLAM、双 7-DOF 机械臂和灵巧手 / 夹爪末端执行器，共同构成物理控制底座。
        - id: compute-runtime
          label: 机载算力与控制运行时
          detail: 双 PC ≥300 TOPS 架构（固定式单元为单 PC ≥150 TOPS）驱动 1kHz 全身控制。
        - id: simulation-data-engine
          label: 仿真与数据引擎层
          detail: DexVerse™ 生成物理精确的合成场景和数据；EmbodiChain 将资产生成、场景布局、轨迹采样、失败恢复和在线数据流封装成训练流程。
        - id: world-model-policy
          label: 世界模型与策略层
          detail: DexWorldModel 提供因果潜在世界建模；Dexterity-BEV 将异构多摄像头、多本体机器人数据对齐到同一 BEV 坐标系，用于策略训练。
        - id: developer-integration
          label: 开发者与集成接口
          detail: 基于 ROS2 的 Humanoid API 暴露关节状态话题和位置控制服务 / 动作；EmbodiChain 的 GitHub SDK 向外部开发者开放训练流水线。
        - id: deployment-support
          label: 部署与现场支持层
          detail: 咖啡师 / 商业服务脚本、班前检查清单、docs.dexforce.com 手册和电话支持热线，负责现场运营和故障升级。
