      - number: '2.2'
        title: 规模测算口径与 TAM/SAM/SOM 矛盾
        blocks:
          - type: paragraph
            body: >-
              中国人形机器人 / 具身 AI 市场的公开规模测算异常分歧，而这些矛盾不是噪音，反而有信息量。Morgan Stanley 最新（2026 年 6 月）笔记把中国对外销售人形机器人市场定在 2026 年 $2
              billion，到 2030 年在年出货 446,000 台基础上增至 $15 billion；但这个 $2 billion 口径排除了原型机、预订单和内部使用单位，而且已经大幅修订：同一家银行在 2025 年
              11 月“现实检查”笔记中只预测 2026 年 12,000 台，2026 年 1 月改为 14,000 台，之后又改为 28,000 台，最终在 2026 年 6 月落到 50,000
              台——同一发布方七个月内对出货量的摆动超过四倍。另一个口径来自行业跟踪机构 GGII，并经 China Daily 报道；它统计产量而非对外销售，把 2025 年出货量定为 14,400 台，2026
              年产量可能达到 100,000-200,000 台，是 Morgan Stanley 同年出货数的两到四倍，因为“产量”和“对外销售出货量”不是同一种测量。咨询公司 Leaderobot 在 2025 年 4
              月会议上的预测更进一步，仅中国 2025 年人形机器人收入就预计为 82 billion yuan（约 $11.6 billion），远高于 GGII 出货数据或 Morgan Stanley
              市场规模数字所能隐含的水平。区域产业集群数字又是第四类口径：杭州具身 AI 集群已报告单城 2025 年产值 106.8 billion yuan（约 $15.7 billion），上海目标到 2027
              年核心产出超过 50 billion yuan（约 $6.96 billion）。这些是区域产业集群产值，不是需求侧人形机器人单位市场规模，因此不能与全国出货收入口径相加。已审阅来源没有自下而上拆出
              DexForce 在任何口径中的可获取份额；其 Series B 后约 $1.4 billion 投后估值和 50+ 在运场景，是方向性、低置信度 SOM 的唯一公开锚点。
