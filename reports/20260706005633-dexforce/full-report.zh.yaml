            body: >-
              DexForce 已披露的 GTM 动作，把工业 B2B 部署（Embodied Global 点名客户 Midea、CRRC、Wuling）、面向消费者的加盟渠道（DexBot Inside
              亭），以及面向公众的品牌曝光（文博会国家媒体报道）混在一起。公司材料中，亭模式是唯一量化单位经济的渠道：单店月收入超过
              RMB100,000、在指定窗口内回本、客流转化提升、峰值日订单数；这些全部来自自报，均未由第三方独立验证。没有来源披露工业渠道的获客成本、销售人员数、销售周期长度、净收入留存或合同期限，因此无法有把握地计算标准
              SaaS / 硬件销售效率代理指标（如 magic number、CAC payback）。H1 2026 “数百台”人形机器人与全年近 1,000
              台目标之间隐含的出货节奏，意味着下半年装载明显更重；这既可能符合季节性工业采购周期，也可能只是乐观全年指引。没有来源拆分这两个数字的渠道组合（工业、亭、出口）。UBTECH（经审计、来自文件）和
