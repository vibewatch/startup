      nodes:
        - id: reg-safety-gap
          label: 缺少独立安全认证
          detail: 已审阅来源均未披露 CE/UL/ISO 同等级认证
          type: input
        - id: api-auth-gap
          label: 未认证的关节控制 API
          detail: v0.4.0 API 文档未描述认证 / 访问控制机制
          type: input
        - id: autonomous-deployment
          label: 公共场景无人监督自主部署
          detail: 据独立报道，W1 Pro 在深圳一家便利店无人监督运行
          type: input
        - id: bubble-sentiment
          label: 行业泡沫风险情绪
          detail: NDRC 官员和 Goldman Sachs 均警示产能过剩 / 泡沫风险
          type: input
        - id: capital-concentration
          label: 国资关联资金方集中
          detail: 已披露各轮融资中，国资 / 战略投资人反复出现
          type: input
        - id: unaudited-revenue
          label: 未经审计的自报收入
          detail: “亿元级”数字来自单一投资人引述，未经审计
          type: input
        - id: safety-incident-risk
          label: 潜在公共安全事件
          detail: 认证与 API 缺口叠加，可能触发需报告事件
          type: process
        - id: procurement-access
          label: 政府 / 国家项目采购入口
          detail: 可触达 MIIT/SASAC 场景单元分配和政府关联客户
          type: process
        - id: customer-trust
          label: 客户 / 运营商信任与续约
          detail: 场地运营商和消费者继续在 DexForce 机器人上完成交易的意愿
          type: process
        - id: financing-availability
          label: 未来融资可得性
          detail: 按不低于当前 >RMB 10B 估值完成后续融资的能力
          type: process
        - id: company-valuation
          label: DexForce 估值与投资论点韧性
          detail: 监管、运营和财务风险最终传导到这里
          type: output
      edges:
        - from: reg-safety-gap
          to: safety-incident-risk
          label: 推高事件发生概率 / 严重程度
        - from: api-auth-gap
          to: safety-incident-risk
          label: 推高控制安全事件发生概率 / 严重程度
        - from: autonomous-deployment
          to: safety-incident-risk
          label: 放大任何故障的公共暴露
        - from: safety-incident-risk
          to: customer-trust
          label: 事件会削弱运营商 / 消费者信任
        - from: safety-incident-risk
          to: procurement-access
          label: 事件可能危及国家项目资格
        - from: bubble-sentiment
          to: financing-availability
          label: 行业情绪转向会收紧后续融资
        - from: capital-concentration
          to: financing-availability
          label: 投资人团体疲劳会限制新增资金来源
        - from: unaudited-revenue
          to: financing-availability
          label: 披露缺口会增加新投资人尽调摩擦
        - from: customer-trust
          to: company-valuation
          label: 收入韧性取决于信任能否延续
        - from: procurement-access
          to: company-valuation
          label: 国家项目入口支撑增长叙事
        - from: financing-availability
          to: company-valuation
          label: 融资可得性托住当前估值
    claimRefs:
      - CR005
      - CR054
      - CR014
      - CR017
      - CR021
      - CR027
      - CR030
      - CR040
      - CR046
      - CR047
  - id: FR003
    title: 依赖图：DexForce 执行模型所依赖的外部节点
    type: dag
    layout: wide
    summary: DexForce 的商业执行依赖六个无法直接控制的外部节点：运营商、资金方、国家项目、基准平台、开源社区，以及 GPU / 算力供应。
    data:
      nodes:
        - id: dexforce-core
          label: DexForce 商业平台（W1/W1 Pro、DexVerse、DexWorldModel）
          detail: 连接硬件、仿真和世界模型层的中心节点
          type: process
        - id: operator-network
          label: 商业服务运营商网络
          detail: 覆盖上线城市的第三方场地运营商（徐州、深圳、桂林、阳朔、汕头等）
          type: input
        - id: capital-providers
          label: 国资关联 / 战略资金方高度集中
          detail: >-
            Shenzhen Capital Group、Guiyang Digital Economy Fund、Qianhai Mother Fund、ICBC Capital、Hengjian Capital、
            Zhurui Capital、Lenovo Capital 等
          type: input
        - id: state-program
          label: MIIT / SASAC 2026 真实场景训练项目
          detail: 可能通向省级场景单元实地验证
          type: input
        - id: worldarena-benchmark
          label: WorldArena 外部基准平台
          detail: DexWorldModel Track 2「#1」声称的唯一引用来源
          type: input
        - id: embodichain-community
          label: EmbodiChain 开源开发者社区
          detail: Alpha 阶段的 GitHub 项目；唯一面向外部开发者的入口
          type: input
        - id: gpu-compute-supply
          label: GPU / AI 算力硬件供应
          detail: 支撑训练吞吐和机载推理算力
          type: input
        - id: certification-gap
          label: 独立安全 / 质量认证
          detail: 已审阅来源均未找到证书；这是持续的采纳与信任瓶颈
          type: output
      edges:
        - from: operator-network
          to: dexforce-core
          label: 部署点位与收入数据
        - from: capital-providers
          to: dexforce-core
          label: 研发与扩张资金
        - from: state-program
          to: dexforce-core
          label: 潜在政府关联部署与验证通道
        - from: worldarena-benchmark
          to: dexforce-core
          label: 外部基准验证
        - from: embodichain-community
          to: dexforce-core
          label: 开源数据 / 训练工具
        - from: gpu-compute-supply
          to: dexforce-core
          label: 训练与机载推理算力
        - from: dexforce-core
          to: certification-gap
          label: 尚未解决的信任 / 采纳瓶颈
    claimRefs:
      - CR027
      - CR030
      - CR031
      - CR032
      - CR029
      - CR028
      - CR016
      - CR014
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: standard
    summary: 从 DexForce 的融资动能和商业证明出发，经过披露缺口和行业负面信号，推导最终建议。
    data:
      nodes:
        - id: n1
          label: 融资动能：Series B 轮融资 RMB1B，估值 >RMB10B
          tone: positive
        - id: n2
          label: 商业证明：多城零售亭上线 + WorldArena 基准声称
          tone: positive
        - id: n3
          label: 披露缺口：数字未经审计，无股权结构表、无认证
          tone: warning
        - id: n4
          label: 负面信号：NDRC 泡沫警示、Morgan Stanley 质疑
          tone: risk
        - id: n5
          label: 估值校验：估算 ~100x 过去收入 / ~25-33x 远期收入，对比同业 7.5-25x
          tone: warning
        - id: n6
          label: 建议：继续研究，中等信心，高风险，估值偏贵
          tone: neutral
      edges:
        - from: n1
          to: n5
          label: 定下价格
        - from: n2
          to: n5
          label: 支撑规模化
        - from: n3
          to: n6
          label: 压低信心
        - from: n4
          to: n6
          label: 推高风险评级
        - from: n5
          to: n6
          label: 决定估值立场
    approximationNotes: 节点位置仅用于展示推理链，并非概率加权模型。
    claimRefs:
      - CV054
      - CV055
      - CV056
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在不同收入基数下，估算 DexForce >RMB10B Series B 估值隐含的收入倍数，并与 Unitree 和 UBTECH 对标。
    data:
      items:
        - label: DexForce FY2025 过去收入（~RMB100M）
          value: 100
          unit: x revenue multiple (estimated)
          tone: risk
        - label: DexForce FY2026 指引收入（~RMB300-400M）
          value: 29
          unit: x revenue multiple (estimated)
          tone: warning
        - label: Unitree IPO 前估值（RMB1.7B 收入）
          value: 7.5
          unit: x revenue multiple (estimated)
          tone: neutral
        - label: Unitree 目标 IPO 估值（RMB1.7B 收入）
          value: 25
          unit: x revenue multiple (estimated)
          tone: neutral
        - label: UBTECH 公开市值（~HK$2.23B 收入）
          value: 24.5
          unit: x revenue multiple (estimated)
          tone: positive
    approximationNotes: 所有倍数均以已披露或公司指引估值除以已披露或公司指引收入估算；均非来自独立估值模型。
    claimRefs:
      - CV038
      - CV039
      - CV025
      - CV026
      - CV029
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: DexForce 下一轮融资或上市时的熊 / 基准 / 牛估值区间估算，单位：RMB 十亿。
    data:
      items:
        - label: 熊
          low: 8
          high: 13
          unit: RMB billions
          detail: 泡沫风险警示方向上被验证；零售亭经济性无法复制。
        - label: 基准
          low: 13
          high: 20
          unit: RMB billions
          detail: 增长继续低于指引；上市前先完成一轮估值抬升的私募融资。
        - label: 牛
          low: 20
          high: 35
          unit: RMB billions
          detail: DexForce 自身指引的 FY2026 3-4x 增长兑现；估值重估至接近同业公开市场倍数。
    approximationNotes: 区间基于同业倍数和 DexForce 自身指引估算；应视为情景示意，而非目标价。
    claimRefs:
      - CV051
      - CV052
      - CV053
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向 IC 的七项评分表，覆盖市场顺风、商业证明、护城河、披露质量、估值、行业风险，以及综合总分。
    data:
      items:
        - label: 市场顺风
          value: Strong
          tone: positive
          detail: TrendForce 预测 2026 年产量 +94%；Morgan Stanley 将预测上调至 50,000 台。
        - label: 商业证明
          value: Moderate
          tone: warning
          detail: 多城零售亭上线已确认，但仅有节假日窗口的运营商数据。
        - label: 技术护城河
          value: Unverified
          tone: warning
          detail: WorldArena Track 2 第一名声称未找到独立佐证。
        - label: 披露质量
          value: Weak
          tone: risk
          detail: 数字未经审计；未披露股权结构表、交易条款或认证。
        - label: 估值相对同业
          value: ~4x stretched
          tone: risk
          detail: 估算 ~100x 过去收入倍数，对比 Unitree 7.5-25x、UBTECH ~24.5x。
        - label: 行业风险
          value: High
          tone: risk
          detail: NDRC 泡沫警示；Morgan Stanley 预测在 7 个月内从 12,000 台摆到 50,000 台。
        - label: IC 综合评分
          value: 5.5 / 10
          tone: neutral
          detail: 继续研究；中等信心；高风险评级；估值偏贵。
    approximationNotes: 评分为综合本章证据形成的定性判断，并非公式驱动输出。
    claimRefs:
      - CV042
      - CV043
      - CV007
      - CV008
      - CV040
      - CV046
      - CV054
