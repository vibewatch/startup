        title: 采用轨迹与部署代理指标
        blocks:
          - type: paragraph
            body: >-
              最清晰的独立采用代理指标来自金融媒体报道（21jingji 和 InvestorsCN，日期均在 2025 年 7 月 10 日前后）：DexForce 已超过 100 家付费企业客户，年化收入超过 RMB 1
              亿元，覆盖数十个部署场景。DexForce 自己的官方页面让这张图更复杂：英文 about 页面称 50+ 个子行业和 1,000+ 个交付项目，同一页面的中文版本称 1,500+ 个项目，招聘页面又称服务
              1,000+ 家企业——三个不同分母（客户、项目、企业）从未彼此校准，也未与独立报道的 100 家客户数字对齐。最新部署代理指标是 2026 年 5 月 1 日零售铺开：5 个城市 /
              场地（徐州方特主题公园、深圳龙岗星河 COCO Park、深圳 K11、桂林象鼻山、阳朔西街）同时开出 10+ 家门店，公司称开业日吸引 100,000+ 名访客，假日峰值期间旗舰样本每台机器人每日 1,000+
