      - number: '1.2'
        title: 领导层、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              公开领导层叙事几乎全部围绕贾奎教授展开；公司新闻稿和独立报道都把他称为创始人兼首席科学家。EmbodiedGlobal 关于 Series B
              的报道称，他是香港中文大学（深圳）（CUHK-Shenzhen）终身教授，并连续多年入选 Stanford “Top 2%” 高被引科学家；DexForce 自己的 Series B 公告也直接引用他对公司“每个
              Physical Token 最高 ROI”战略的表述。公司招聘页补充称，更大的核心团队来自 MIT、Nanyang Technological University、National University of
              Singapore、KAIST、Tsinghua University 和 Zhejiang
              University，但没有点名其他高管；本章审阅的任何来源也没有出现独立董事名单、委员会结构或投票控制安排。一个值得注意的褶皱是：百度百科企业登记摘要把公司法定代表人列为贾军，这与已审阅罗马化文本中的创始人贾奎不是同一个名字。差异可能来自另一个面向合规的负责人，也可能是不同来源的音译不一致，或是公开记录尚未解开的身份问题。无论如何，面向创始人的叙事与登记法定代表人并不明显指向同一名已披露个人，这加重了科学家主导深科技创业公司常见的高关键人依赖风险：战略、融资叙事和技术方向都穿过一位具名教授，却没有公开可识别的副手或接班计划。
