      - number: '3.4'
        title: 切换成本、锁定效应、分销力与供应 / 伙伴准入
        blocks:
          - type: paragraph
            body: >-
              DexForce 的零售亭渠道按低切换成本和快速运营商回本设计——公司报告 2026 年五一假期单店收入超过
              RMB100,000，回本周期最快六个月。这降低了运营商伙伴采用门槛，但同一逻辑也降低了竞争硬件厂商在同一运营商关系中替代 DexForce 的门槛，只要更便宜或更强的机器人出现。工业侧，DexForce
              披露的客户（Midea、CRRC、Wuling）在已审阅来源中体现为 AI 模型授权和部署，而不是已确认的排他长期合同，因此切换成本和锁定效应大多没有文档支撑。同业分销力分化很大：UBTECH 香港上市让其拥有
              DexForce 作为私营、筹备 IPO 公司尚不具备的直接资本市场准入和披露义务；Unitree 待定的科创板上市会延伸同样优势；TrendForce 认为，AgiBot 订单驱动、标准化的制造供应链支撑了其
              2026 年快速放量，而 DexForce 没有披露可匹配的能力。供应 / 伙伴准入方面，Unitree 90%
              以上核心硬件组件（电机、减速器、lidar）自制，在全行业平均售价下行期直接控制成本和供应；DexForce
              没有披露可比的垂直整合位置。因此，相较已经内部制造（Unitree）或搭建标准化外部供应链（AgiBot）的同行，DexForce 的硬件成本结构和组件供应链仍是开放尽调问题。
