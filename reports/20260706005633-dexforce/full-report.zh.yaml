  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 生成式仿真（DexVerse/DexWorldModel）降低对高成本遥操作数据采集的依赖
        - >-
          行业媒体对 Unitree IPO 申报的解读认为，Unitree 的真实世界“数据飞轮”（30,000+ 四足机器人、5,500+ 人形机器人已投入运营）比纯仿真路线更耐久；Fourier、UBTECH、AgiBot
          也在分别投入可比的 AI 模型能力
        - 高
        - 要求提供正面对比基准数据（例如多个周期的 WorldArena 分数），证明 DexForce 相比 Unitree 的 WMA 或 AgiBot 的 BFM-2 世界模型有余量，而不是只看单次快照排名
      - - 先发的加盟式零售机器人亭渠道模型
        - 未披露任何结构性壁垒（专利、独家权利）阻止 Unitree、UBTECH 或新玩家在该模式验证盈利后复制运营商伙伴零售亭模式，尤其是消费级硬件（Noetix、Booster）还在变便宜
        - 中
        - 要求披露独家条款、专利申请，或足以阻止复制零售亭模式的自有零售运营软件
      - - 已点名的大型工业客户（Midea、CRRC、Wuling）
        - 资料描述的是 AI 模型部署 / 授权，而非已确认的长期独家合同；拥有垂直一体化硬件的竞争对手（Unitree）或有公开市场资金的竞争对手（UBTECH）未来可能在工业 RFP 中压价
        - 中
        - 要求披露 Midea/CRRC/Wuling 关系的合同条款、期限和独家性
      - - 'Physical-AI 技术底子 / WorldArena #1 排名'
        - 基准领先只是时点性主张；资金更充足的同行（Unitree、AgiBot）以及非中国玩家（Tesla、Boston Dynamics）可能在后续评测轮次中超过 DexWorldModel
        - 中
        - 要求提供 WorldArena 方法论，以及 DexForce 在多个评测周期中的排名历史
      - - 垂直整合 / 成本控制
        - DexForce 未披露可与 Unitree >90% 自制硬件相媲美的内部组件制造能力；行业平均售价下行时，供应链成本传导对 DexForce 的压力更大
        - 高
        - 要求披露 DexForce 的 BOM 采购拆分，以及制造 / 组装所有权结构
      - - 监管 / 标准制定影响力
        - 据报道，中国国家人形机器人标准化总体组（HEIS）纳入了 Unitree 和 AgiBot 创始人，这让这些公司在未来合规要求中拥有结构性发声权；DexForce 目前没有被报道拥有同等席位
        - 中
        - 确认 DexForce 是否在 HEIS 标准委员会或相关 MIIT 工作组中拥有席位或顾问角色
      - - 全品类耐久性与全行业泡沫风险
        - >-
          北京 NDRC 官员和 Goldman Sachs 均警示过 150+ 家中国人形机器人公司的产能过剩 / 泡沫风险；Morgan Stanley 预测 2026 年爬坡速度（约 12,000
          台）远低于行业乐观预期，可能挤压除资本最充足或已上市玩家之外所有公司的融资可得性
        - 高
        - 跟踪 DexForce 的现金跑道、下一轮融资时间，以及在未披露盈利能力情况下对持续风险投资的依赖
    notes: 严重性评级是作者基于证据的定性判断（高 / 中），不是标准化评分模型；每行都列明了用于赋分的具体竞争对手或反向证据。
