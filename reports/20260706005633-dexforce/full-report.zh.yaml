  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正反论点
        blocks:
          - type: paragraph
            body: >
              DexForce 的多头论点靠四根支柱：2026 年 6 月完成的 Series B 具备可信的多机构背书（Shenzhen Capital Group、ICBC Capital、Qianhai Mother
              Fund、Lens Technology、Hengjian Capital），投后估值跨过 RMB 100 亿元；已有真实商业部署证据，包括多城 kiosk 同步开业；有独立声称的 world model
              benchmark 排名（DexWorldModel 在 WorldArena Track 2 拿到第一）；定位差异化，主打“physical-AI infrastructure”，独立报道把它类比为 Scale
              AI 或垂直领域 Nvidia Omniverse，而不是硬件 OEM。反论点同样具体。EmbodiedGlobal 在 Series B 报道中明确提醒，在第三方 benchmark 出现前，应把
              DexForce 的核心数字视为公司说法。一名 Series B 战略投资人 Lens
              Technology，据称是在先成为客户后才投资——创始人本人称为“先用，后投”的关联方动态。没有审阅来源为本章披露股权结构表、清算优先权条款、客户集中度拆分或独立安全认证，也没有独立榜单佐证
              WorldArena 说法。两类独立行业声音——一名北京 NDRC 官员警示中国 150+ 家人形机器人进入者存在泡沫风险，以及 Morgan Stanley 2025 年 11 月笔记称 2026 年
              100,000 台的多头情形“比你想得远得多”——都直接适用于任何建立在 DexForce 自报势头之上的尽调。正反两套逻辑都有证据支撑；开放问题是未来 12-24 个月的披露会把答案推向 DexForce
              哪一边。
