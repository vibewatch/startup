      - number: '8.2'
        title: 建议、置信度、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >
              正反两面放在一起看，本章建议是继续研究——不是跟踪，更不是买入；置信度中等，风险评级高，估值偏贵。 谨慎压过确信，原因很直接：DexForce Series B
              后估值对应的收入倍数，明显高于两个财务透明度最高的中国人形机器人同业， Unitree（按 Pre-IPO 估值约 ~7.5x、按目标 IPO 市值约 ~25x）和 UBTECH（按当前公开市值约
              ~24.5x）已披露倍数； 即便把 DexForce 自身指引的 FY2026 收入增长计入，仍是如此。支撑这一倍数的规模、收入和基准数据几乎都来自公司口径，
              且报道同轮融资的独立媒体明确标注为未经审计，在这种情况下，“买入”站不住脚。反过来，直接“回避”又会低估真实且有独立印证的融资动能—— 六家以上独立媒体确认 Series B
              条款；其基准排名主张也至少出现在独立新闻报道中，尽管尚未被独立复现。

              “继续研究”正对应这个中间地带：投资论点足够可信，值得密切跟进，但尚未拿到已审计财务、股权结构或认证证据，
              还不足以支持“跟踪”或“买入”。哪些决策阈值会把判断推向上调或下调，都可以明确测试；本章后文的建议摘要表和投资论点破裂触发表会完整展开。
