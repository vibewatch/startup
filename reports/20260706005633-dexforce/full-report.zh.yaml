      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              DexForce 自己的技术文档暴露了公司没有在其他地方主动宣传的运营风险。Humanoid API（v0.4.0）开放 ROS2 topics 和 services，用于实时关节级状态和
              position-mode 控制，但本次审阅页面没有描述任何认证、授权或访问控制机制——对于一个能直接指令机器人关节的系统，这是有意义的缺口。Barista Operation Manual 明确记录了一个感知
              / 抓取限制：工作人员被要求只装约半架纸杯，避免机器人误抓多个纸杯；手册还要求签署开业前检查清单，并提供运营人员无法解决故障时的管理员升级热线。独立报道另称，一台 W1 Pro
              在深圳便利店内完全自主、无人监督运行，备餐并送餐，没有人工看护——这是公共安全暴露，但未披露事故响应协议。没有审阅来源披露机队级正常运行时间、MTBF、保修 / RMA 率或安全事故记录。DexForce
              自己的部署经济性数字（首日收入、4.6 倍提升、99% 转化、6 个月回本）明确归属劳动节假期周期，且未经独立审计。另一个规格冲突仍未对齐：DexForce 为 W1 Pro 列出 34 DOF，而
              RobotToday 的独立供应商档案列为“up to 40 DoF”。
