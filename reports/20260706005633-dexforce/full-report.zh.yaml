      - number: '5.2'
        title: 模块、SKU 与文档资产图谱
        blocks:
          - type: paragraph
            body: >
              DexForce 的公开界面至少列出六条不同产品 / 资产线。W1 和 W1 Pro 人形机器人提供全身（34 DOF、移动式、laser-SLAM 导航）和固定半身（22
              DOF）两种配置，英文和中文规格页并行记录。DexVerse™ 和 DexWorldModel 是支撑策略训练的仿真 / 世界模型引擎；EmbodiChain 是 DexForce 唯一已在 GitHub 以
              Apache-2.0 许可开源的组件。RobotToday 的独立供应商档案补充了 DexForce 主营销页上不突出的两条线——“Kingfisher”3D 智能相机和“PickWiz”视觉软件——这与单独的
              en.dexforce.top 视觉解决方案网站一致，说明 DexSense / 视觉硬件更像是独立销售的工业视觉产品，而不只是人形机器人配件。最后，DexForce
              文档中心（docs.dexforce.com）打包了 Humanoid User Manual、Secondary Development API reference 和 Barista Operation
              Manual，并另设 3D Vision Guidance Kit 和相机硬件文档树。值得注意的是，第三方列表（RobotToday、RBTX）描述的配置为“up to 40 DOF”，而 DexForce
              自己的英文和中文 W1 Pro 页面列出全身机型为 34 DOF——审阅来源都没有解释这个差异，正式采用任一数字前都应标记。
