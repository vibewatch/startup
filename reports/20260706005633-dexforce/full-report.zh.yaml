      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >
              三个情景框定 DexForce 估值如何从当前 >RMB10B 的 Series B 标记继续演变。牛市情景下，FY2026 收入达到或超过公司自己指引的 FY2025 3-4x 增长 （估计
              RMB300-400 million 或更高），后续融资或 IPO 又把 DexForce 重估到 Unitree 或 UBTECH 式公开市场倍数（估计 20-30x）， 对应估值区间约 RMB20-35
              billion。考虑到中国人形机器人板块预期移动之快，这并非不可能：Morgan Stanley 自己的 2026 年出货预测， 约六个月内就从约 14,000 台升到 28,000 台，再升到 50,000
              台。基准情景下，收入继续增长但低于指引速度，DexForce 在上市前再完成一轮小幅上调的私募融资， 节奏类似 Unitree 走向 STAR Market 申报前的多轮路径，对应估值约 RMB13-20
              billion；这与整体证据图景一致——动能真实，但披露仍长期未经审计。 熊市情景下，北京 NDRC 官员的泡沫风险提示和 Morgan Stanley 2025 年 11 月更谨慎的报告，对 DexForce
              本身也方向正确；假日服务亭经济性无法复现， 下一轮持平、下调或估值停滞随之出现——类似 UBTECH 在 2023 年 12 月至 2024 年 12 月间公开市值从峰值到谷底约 37.5% 的跌幅，之后才恢复。
              各情景的假设、估值逻辑、关键风险和概率信号，见下方情景表和估值区间图；所有区间都明确是基于同业倍数和公司指引估计、推断而来， 不是来自独立估值模型。
