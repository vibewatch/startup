      - number: '5.3'
        title: 架构：Sim2Real、world model、BEV 对齐和数据引擎
        blocks:
          - type: paragraph
            body: >
              DexForce 的技术架构从感知和执行硬件出发，向上接入仿真与数据引擎层，再进入世界模型 / 策略层。硬件上，W1 Pro 组合了 6cm 基线双目纯视觉系统和大模型双目算法、双 7-DOF 手臂（10kg
              载荷、±0.5mm 重复定位精度），以及额定 ≥300 TOPS 的双 PC 算力架构，并以 1kHz 跑全身控制。其上是 DexVerse™；DexForce 称它借助 domain randomization
              和 differentiable simulation，从多模态输入生成物理精确的 3D 场景和合成训练数据，以缩小 sim-to-real gap；公司还声称模型最高可达“99.9%
              accuracy”，但这一数字没有独立审计链。DexWorldModel 被定位为因果 latent world model，并与 EmbodiChain、Dexterity-BEV 研究线一起，构成
              DexForce Core Technology 页面所谓三大旗舰技术输出。DexForce 宣布其 DSCFuncWorld world model 在 WorldArena Track
              2（Functionality/Data-Engine）榜单全球第一；公司称该榜单测试的是 world model 能否生成可供机器训练、可迁移、可执行的机器人数据，而不只是逼真视频。另一路，DexForce
              发布了“Dexterity-BEV”论文，提出一个 bird's-eye-view 对齐层，把异构的多相机、多具身形态、多操作员机器人数据归一到同一物理坐标系——方法明确借鉴 BEV
              表征统一自动驾驶感知的路径。EmbodiChain 是 DexForce 唯一公开发布的组件，把资产生成、场景布局、轨迹采样、失败恢复和在线数据流打包为供给这套技术栈的数据引擎层；其 GitHub
              组织显示最近一次提交是 2026 年 7 月 5 日，距本报告运行日期仅一天。
