      - number: '8.5'
        title: 可比估值组合
        blocks:
          - type: paragraph
            body: >
              DexForce 最接近、且有披露的可比公司，是 Unitree Robotics 和 UBTECH Robotics 这两家拥有公开财务披露的中国人形机器人同业。 Unitree 的 STAR Market
              IPO 申报显示，2025 年收入 RMB1.7 billion、调整后净利润 RMB600 million，对应 RMB12.7 billion 的 Pre-IPO 估值 （估计约 ~7.5x
              往绩收入倍数）和目标约 ~RMB42 billion IPO 市值（估计约 ~25x 倍数）；另一笔 2025 年中 Series C 据称把 Unitree 估到约 RMB12 billion， 对应约
              RMB1 billion 往绩收入。UBTECH Robotics（HKEX: 9880）截至 2026 年 7 月 2 日市值为 HK$54.73 billion，往绩收入约 HK$2.23 billion，
              对应估计 ~24.5x 倍数，尽管其市值自 2023 年以来峰谷波动超过 60%。把同样算术套到 DexForce 自己披露的数据上——约 RMB100 million 的 FY2025 往绩收入， 或若
              FY2026 指引兑现则估计 RMB300-400 million——再对照其 >RMB10 billion 的 Series B 标记，得到的倍数要么约 100x，要么约 25-33x，
              完全取决于采用哪一个未经审计的收入基数。AgiBot 过去只是一个生产规模可比项（2026 年 6 月生产第 15,000 台，有独立印证，并据报在 2025 年全球出货排名第一），
              现在也有了披露的估值轨迹：Reuters 报道其 2026 年 3 月 PitchBook 标记约 ~$2.07 billion，并计划在 2026 年 Q3 前以 HK$40-50 billion （约
              ~$5.1-6.4 billion）估值在香港 IPO，意味着从私募标记到 IPO 目标约 2.5-3.1x 的上台阶。同一篇 Reuters 报道称 Unitree 自身 IPO 目标最高可达 RMB50
              billion（约 ~$7 billion），略高于上文引用的 ~RMB42 billion——这提醒我们，IPO 估值目标会随着上市流程推进而变化，不能视为固定数字。 更早的 2025 年 3 月报道已把
              AgiBot 在 Tencent 领投轮中的谈判估值放在约 RMB15 billion（约 ~$2.1 billion），说明在 2026 年 IPO 目标隐含更快重估前，
              该公司的私募市场标记大约横盘了一年。Fourier Intelligence 和 Robotera 自己官网没有披露任何估值，但第三方追踪机构 Premier Alternatives 目前分别给出 $1.2
              billion（2025 年 8 月，资本效率 4.85x）和 $1.4 billion（2026 年 3 月，资本效率 3.52x）的估值；Robotera 还在 2026 年 4-5 月完成了 由 SF
              Group 领投、Sequoia China、IDG Capital、HSG 和 CICC Capital 参与的又一轮 $200 million+ 融资。这些第三方数字为直接同业组补上量化可比项，
              但仍是外部追踪机构和通讯社来源的估计，不是公司确认披露。

              这些比较没有一个是完全同口径：Unitree 和 AgiBot 是硬件出货业务，UBTECH 在 HKD 报告口径下混合教育、消费、工业收入线； DexForce 自身报道则把它放得更接近物理 AI 基础设施 /
              平台业务——本章审阅的任何来源都未找到该类别已披露的公开可比公司。 另一个外部校验来自 Goldman Sachs 研究（经 Taibo Financial 报道）：其估计 2025 年全球人形机器人出货约
              15,000-20,000 台， 并预计 2026-2027 年增长数倍，为这些可比公司收入倍数算术中的销量假设提供外部印证。
