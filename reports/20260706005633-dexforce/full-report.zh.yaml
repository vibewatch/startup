  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与热力图
        blocks:
          - type: paragraph
            body: >-
              DexForce 的风险画像横跨五类相互咬合的风险：监管 / 法律、运营 / 质量 / 安全、伙伴 / 依赖、人员 / 执行，以及财务 / 模型风险。公司是一家早期、pre-IPO
              的人形机器人厂商，处在快速变化的中国监管框架内（2026 年国家标准体系、2026 年 MIIT / SASAC 专项行动，以及杭州首个城市级具身 AI
              法规）；同时，其商业叙事高度依赖自报且大多未经审计的指标：一个假期窗口收入快照、一个来自投资人的收入数字，以及一个外部平台 benchmark 排名。本章在缺少独立佐证时，对 DexForce
              自己的说法保持审慎，并大量引用负面第三方来源——Morgan Stanley 的出货预测笔记、NDRC 官员的泡沫风险警示、TrendForce
              的竞争集中度数据——来压力测试增长案例。下方热力图按发生概率、影响和缓释成熟度，给 DexForce 十项最需关注的风险打分；最严重的“高概率、高影响、低缓释成熟度”组合，集中在缺少独立安全认证、关节控制 API
              的认证 / 访问控制机制未记录，以及完全不在 DexForce 控制内的行业宏观情绪上。
