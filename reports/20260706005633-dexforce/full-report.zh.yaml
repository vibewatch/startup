      - number: '3.2'
        title: 直接同行画像：规模、融资、目标客户与战略方向
        blocks:
          - type: paragraph
            body: >-
              Unitree Robotics（杭州）是规模领先者：其科创板 IPO 文件披露 2025 年收入 RMB1.7 billion、调整后净利润 RMB600 million、毛利率 60.27%，2025 年出货
              5,500+ 台人形机器人（全球 #1）；对应 IPO 前估值 RMB12.7 billion，并目标实现至少 RMB42 billion 的 IPO 市值。公司 90% 以上核心零部件自制，并计划扩至年产
              75,000 台人形机器人和 115,000 台四足机器人。AgiBot（上海）于 2026 年 6 月达到第 15,000 台量产通用机器人，三个月内从 1,000 台扩至 10,000 台，覆盖
              A2、G1、X1、X2 产品线，并创造了人形机器人行走距离 Guinness World Record；TrendForce 认为其标准化、订单驱动的供应链支撑了这轮爬坡。UBTECH Robotics
              是这一组中唯一在香港上市（9880）的纯人形机器人公司，以 Walker S/S2（后者是首款可自主换电的人形机器人）瞄准工厂装配线，同时保留既有 AI 教育业务。Fourier
              Intelligence（上海）把 GRx 系列和 RehabHub 产品定位在医疗 / 康复和消费陪伴场景，而不是工业部署；这个目标市场比 DexForce
              更软。Robotera（北京）自称拥有行业唯一全自研软硬件具身智能栈，包括 XHAND1 灵巧手，但其官方产品页披露的规格或定价细节很少。DexForce 自身披露 2025 年收入超过 RMB100
              million、2026 年增长指引 3-4x、Series B 估值 RMB10 billion+，以及 Midea、CRRC、Wuling 等具名工业客户；相较 Unitree 或 AgiBot
              已披露的产量和财务数字，DexForce 的规模足迹明显更小，也更不透明。
