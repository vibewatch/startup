      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              2026 年，中国人形机器人监管环境明显收紧。MIIT 和 SASAC 联合发文启动全国“真实场景训练”专项行动，要求各省至少遴选 20 个代表性场景单位、中央企业至少遴选 10 个，并以 2026
              年底前形成“万台级”部署能力为目标——文件还明确要求开发者加强碰撞检测、力控限制、紧急制动和黑匣子安全能力，说明这些行为的安全工程在全行业仍是进行中的工作。另一路，中国发布了首个人形机器人与具身 AI
              国家标准体系（HEIS 2026），杭州出台首部有约束力的城市级具身 AI 机器人法规，引入编码可追溯和“沙盒监管”机制。在这一背景下，DexForce 自己的 W1
              用户手册相当坦率：手册说明机器人尚未通过医疗安全认证，并列出至少七类禁止误用场景，每一类都给出明确危险理由。没有审阅来源披露 W1 / W1 Pro 平台取得独立工业安全认证（CE、UL、ISO
              或中国同等认证），也没有披露 DexForce 特定的执法行动或诉讼——但后一项缺失本身仍是未解缺口，不能视为无风险证明。
