      - number: '8.3'
        title: 当前融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >
              DexForce 披露的融资历史包含三件事：2024 年 5 月由 Lenovo Capital 领投的战略轮；2025 年 7 月合计数亿 RMB 的 A1/A2 轮， 由 Chengdu Sci-Tech
              Innovation Investment 和 Hongtai Fund 领投，当时 Lenovo Capital 代表称 DexForce 拥有 100+ 家企业客户、 数十个已部署场景和约 RMB100
              million 年化收入；以及 2026 年 6 月 Series B，融资 RMB1 billion，投后估值超过 RMB10 billion。
              对中国财经媒体报道的独立汇总又给出一个更尖锐的数据点：DexForce 报告仅 H1 2026 收入就达到 RMB100 million，并在“2022-2024 年每年翻倍”之后， 指引 2026 全年收入为
              2025 全年的 3-4x。现阶段的入场纪律，是在 IPO 申报或类似披露事件出现前，把这些数字全部视为公司指引的估计，
              而非已审计实际值。已审阅来源没有一处把三轮融资拼成完整台账——具体分期规模、工具类型（股权还是可转债）、反稀释条款、累计历史融资额都未解决—— 因此，任何按 Series B
              估值或接近该估值投入的新资本，都在价格和结构上承受真实悬置风险。本轮投资人本身混合了国资关联、银行系资本和带政策导向的资金，
              也有民营战略方；这支撑融资动能叙事，但不能替代独立、以回报最大化为目标的价格发现。融资交割后，也没有任何来源披露新的融资或估值更新。
