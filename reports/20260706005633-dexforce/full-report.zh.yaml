      - number: '1.3'
        title: 融资历史、投资者基础与估值
        blocks:
          - type: paragraph
            body: >-
              DexForce 已披露融资历史至少跨越三个独立事件。2024 年 5 月，EqualOcean 报道了 Lenovo Capital
              领投的战略融资，资金用于产品开发、团队扩张和市场增长——这是目前找到的最早第三方确认融资事件。2025 年 7 月，21jingji、Investor's China（投资家网）和 Chuangtouzhijia
              等中文媒体报道称，DexForce 完成合计数亿元的 A1 和 A2 轮融资，由 Chengdu Sci-Tech Innovation Investment（成都科创投）和 Hongtai
              Fund（洪泰基金）领投，Tianying Capital、Sichuan Academician Fund、Nanshan Strategic Emerging Industries
              Investment、Yicun Songling 和 Tanyuan Venture Capital 参投，老股东 Lenovo Capital 继续追加。随后，2026 年 6 月 30 日，DexForce
              宣布完成 RMB 1 billion（约 US$137-138 million）Series B，投后估值超过 RMB 10 billion（约 US$1.37-1.38
              billion），跨过独角兽门槛。公司自有公告、Gasgoo、Pandaily、EmbodiedGlobal 和 Wedoany 共同点名的 Series B 投资方包括继续加码的老股东 Shenzhen
              Capital Group（深创投）和 Guiyang Digital Economy Fund；新投资方 Qianhai Mother Fund、Lens
              Technology（SZ:300433，据报道在投资前已成为客户）、ICBC Capital、Hengjian Capital/Asset 和 Zhurui Capital；以及老股东 Nanshan
              Strategic Emerging Industries Investment、Chengdu Sci-Tech Innovation Investment 和 Sichuan Academician Fund
              的跟投。已审阅来源没有把完整融资台账对齐——准确日期、分期金额、工具类型和累计融资额均未公开。因此，即便单轮融资事件已有独立交叉验证，累计融资总额仍应视为未解决。
