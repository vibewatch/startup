              RMB1 billion Series B
              报道累计融资低两个数量级以上；这对中国公司结构并不异常（注册资本是名义资产负债表数字，不是实缴现金），但也凸显没有来源把已披露融资额与经审计资产负债表相连。公开市场可比对象展示了规模化后披露可以是什么样子：UBTECH
              向 HKEX 提交的 2025 年报给出分项收入、毛利和净亏损（RMB789.8 million）数字，其市值（2026 年 7 月 2-3 日为 HK$54.73 billion，低于 2025 年底
              HK$63.48 billion 峰值）也是可持续观察的投资者情绪代理指标；Unitree 的 IPO 相关报道披露了 DexForce 没有的收入、利润率和渠道组合细节。DexForce
