  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              DexForce 更应被理解为一家通用具身 AI
              “大脑”公司，而不是单一产品的人形机器人制造商。它把共用的感知、仿真和控制栈（DexVerse、DexWorldModel、DexAgent、DexSense、DexBrain）授权给两条不同商业路径：一条是工业具身
              AI 部署，用于汽车零部件、新能源汽车、3C 电子、航空航天、物流和化工中的柔性分拣、装配与物料搬运；另一条是商业服务亭业务，把 W1 Pro
              人形机器人放进便利店、商场、主题公园和旅游地标，用来制作食物、销售零售商品并与游客互动。第三个更小的相邻业务，是 DexForce 既有的机器视觉 / 工业 3D
              相机线，服务的是相关但不同的质检买家。因此，市场边界包括具身 AI 硬件、基础模型 / 软件授权和机器人即服务亭运营；排除缺乏具身泛化能力的传统固定用途工业机械臂与协作机器人、泛工厂自动化资本开支，以及没有具身
              AI 引擎的消费 / 教育机器人玩具。DexForce 目标任务的大多数现状替代方案其实就是人力：制造业中的产线工人和工艺工程师，以及商业亭细分中的零售 / 餐饮服务员工。DexForce 还要和 140
              多家国内人形机器人制造商争夺同一预算；这些企业在 2025 年发布了超过 330 个型号，包括 Unitree 和 AgiBot。Unitree 的 2025
              年披露显示，即便是商业化最靠前的细分龙头，人形机器人收入也只是刚刚超过四足机器人收入——这提醒我们，人形机器人专属收入基础仍很年轻。
