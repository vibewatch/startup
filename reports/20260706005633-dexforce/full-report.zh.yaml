      - number: '7.5'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              除创始人和笼统团队描述外，DexForce 对组织披露较少。公司招聘页面称核心团队来自 MIT、NTU、NUS、KAIST、Tsinghua 和 Zhejiang University，R&D 人员超过
              70%，但没有披露总人数、流失率，或除 CUHK-Shenzhen 的 Jia Kui 教授这一创始人之外的具名高管。这形成了早期 deep-tech venture
              常见的关键人集中风险。全行业人才竞争激烈：HEIS 国家标准起草委员会本身就吸纳了 Unitree 和 AgiBot 的资深人员，而这两家公司也是 DexForce
              出货规模最大的两个竞争对手，争夺同一批稀缺的资深人形机器人工程师。财务执行侧，DexForce 唯一被独立报道的收入数字——截至 2025 年中“亿元人民币级别”——来自单一投资人引述（Lenovo
              Capital 投资负责人，提到 100+ 付费客户），并在同一融资轮新闻周期内被两家中国金融媒体重复，而非来自独立审计。DexForce 声明的 Series B
              短期资金用途——世界模型迭代、物理引擎升级、数据基础设施和人形机器人能力补齐——意味着公司仍需依赖 R&D 和现场部署人员增长；这一步显著早于任何已披露、足以自筹该投资的收入运行率。
