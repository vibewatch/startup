      - number: '7.4'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              DexForce
              的商业化故事依赖一组公司无法直接控制的外部节点。商业服务收入叙事建立在少数具名城市的第三方场地运营商之上，公司还称正在全国招募更多运营商——这意味着运营商流失或不续约，会直接削弱其自有新闻稿引用的收入证据点。资本基础呈现出国资关联和战略投资人跨轮重复出现的稳定模式：Shenzhen
              Capital Group、Guiyang Digital Economy Fund 和 Lenovo Capital 从 2024 年战略轮，到 2025 年中 A1 / A2 轮，再到 2026 年 6 月
              Series B 持续出现（同时加入 Qianhai Mother Fund 和 ICBC Capital 等新投资人）；如果国资投资优先级变化，融资可得性会受到影响。DexForce 旗舰
              DexWorldModel benchmark 说法依赖单一外部评测平台（WorldArena），本次研究没有独立取得其方法论。参与 MIIT / SASAC 2026 专项行动可能提供验证渠道，但没有来源确认
              DexForce 是任何省份的具名场景单位参与方。最后，TrendForce 预测 Unitree 和 AgiBot 两家将在 2026 年拿下中国人形机器人近 80%
              出货量，把行业规模和监管注意力集中到两个竞争对手，而不是 DexForce。独立行业媒体也从生产角度佐证这种集中度：AgiBot 到 2026 年 6 月累计第 15,000 台下线，从 5,000 台到
              10,000 台再到 15,000 台，大约在创立后三年内完成；DexForce 没有披露可比制造规模里程碑。
