            body: >-
              Pandaily、Gasgoo、Wedoany、KrASIA 和两篇 EmbodiedGlobal 文章独立印证 RMB1 billion / >RMB10 billion 的 Series B
              条款和领投方名单， 让本章“融资动能”支柱在中国私营人形机器人板块融资中获得了少见的广泛第三方确认。
            calloutType: strength
            claimRefs:
              - CV001
              - CV002
          - type: callout
            title: 支撑 >RMB10B 标记的每个收入数字都未经审计
            body: >-
              EmbodiedGlobal 自己的 Series B 报道明确称，在第三方基准可用前，DexForce 的头部数字“应被视为主张”；没有任何来源把 A1/A2、H1 2026 和 FY2026 指引收入数字
              调和成一个已审计数字。
            calloutType: risk
            claimRefs:
              - CV008
              - CV018
              - CV015
          - type: callout
            title: 隐含倍数会因收入基数不同而摆动 3-4x
            body: >-
              使用 FY2025 往绩收入，对应估计约 ~100x 倍数；使用 DexForce 自己指引的 FY2026 收入，对应估计约 ~25-33x 倍数——这更接近 Unitree 和 UBTECH 已披露的
              7.5-25x 与 ~24.5x 倍数。哪一个基数更接近已审计现实，是本章最影响估值的开放问题。
            calloutType: insight
            claimRefs:
              - CV038
              - CV039
              - CV040
          - type: callout
            title: 一名关联方投资者在本轮中出现
            body: Series B 战略投资人 Lens Technology 据称是在先成为 DexForce 客户后才投资；创始人本人把这种模式概括为“先用后投”——这种路径可能同时放大外界感知到的商业牵引力和融资可信度。
            calloutType: risk
            claimRefs:
              - CV009
