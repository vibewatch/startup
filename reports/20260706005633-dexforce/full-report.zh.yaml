              本轮抓取到的来源没有披露 DexForce 任何分部层面的 net revenue retention、gross revenue retention、logo churn、合同续约率或客户满意度 / NPS
              分数；留存表（TU004）把这些逐项记录为明确空值，并配上具体尽调问题，而不是默默省略。能够记录的是 2026 年 5 月零售首发周的单店经济性：假期单店收入超过 RMB
              100,000，相比传统（非机器人）门店提升 4.6 倍，进店到购买转化率超过 99%，DexForce 称回本期“最快 6 个月”（并明确提示取决于品类），普通门店周边客流提升
              30%-40%，而桂林象鼻山旗舰店单点测得 200% 的更大提升，同一旗舰店峰值单小时吞吐 82 单、收入 RMB
              2,050。这些是首发周、接近促销的数字，不是稳态留存证据；区间图（FU004）因此把它们呈现为已披露范围，而不是合成一个单一平均值，以免用旗舰店离群结果夸大典型门店表现。DexForce
              运营手册确认存在客户支持热线（400-8086-299），但工单量、解决时间和投诉历史均未披露。
