      - number: '3.3'
        title: 能力、定价、GTM 与信任 / 监管对比
        blocks:
          - type: paragraph
            body: >-
              披露能力方面，DexForce W1 Pro 声称手臂精度达到亚毫米级（±0.5mm），最高 40 个自由度，单臂负载 10kg——已画像同行没有以可比颗粒度发布这些数字；但 W1 Pro
              是轮式平台，不是双足平台，而 Unitree、AgiBot、UBTECH、Fourier 和 Robotera 都有双足人形机器人。独立报道还指出，Fourier、UBTECH 和 AgiBot 与
              Unitree 一样，均在重投 VLA（vision-language-action）模型能力。定价方面，Unitree 是唯一完整公开标价的竞争者（G1 起价 US$13,500；R1 双臂起价
              RMB26,900/~$3,968），而 AgiBot、UBTECH、Fourier 和 Robotera 都要求买家联系销售，这与 DexForce 自身不公开价格一致（第三方估计 W1 Pro 为
              $50,000-$150,000，或约 $78,000）。GTM 方面，DexForce 面向零售 / 旅游场所招募运营商的加盟式“机器人商业服务亭”模式，在结构上不同于所有同行的直接工业 /
              企业销售或消费零售动作。信任与监管姿态方面，中国于 2026 年 2 月发布首个人形机器人国家标准体系（HEIS，“2026 Edition”）；据报道，起草委员会包括 Unitree 和 AgiBot
              创始人，让这两家公司在标准制定中拥有 DexForce 未被报道拥有的直接话语权。另一路，MIIT 与中国国务院 SASAC 共同启动 2026
              年真实场景训练计划，在全国工业、服务和特种场景中验证人形机器人部署。
