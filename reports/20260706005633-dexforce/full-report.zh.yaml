  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流、定价模型与收入确认
        blocks:
          - type: paragraph
            body: >-
              DexForce 自有材料描述的是多收入流商业模型，而不是单一产品线：面向制造客户的工业人形机器人授权 / 部署（Midea、CRRC、Wuling 被列为部署案例）、面向具身 AI 计算 / 数据服务的
              “Physical Token” 消耗式定价设计、直接硬件销售（如 W1 Pro 人形机器人平台），以及与全国招募的本地运营商分享亭收入的加盟式零售机器人概念（“DexBot Inside”）。公司新闻稿引用了
              DexBot Inside 模式的单店经济性（回本周期、收入提升、峰值日订单），并描述 2026 年 5 月 1 日前后的多城市铺设 活动，但这些数字均未独立审计。整体收入报道同样碎片化且来自自报：Gasgoo
              引用 H1 2026 收入 RMB100 million，对应 FY2026 目标超过 RMB300 million；Embodied Global 引用 2025 年收入超过 RMB100
              million，并给出 2026 年 3-4x 增长指引；Pandaily 引用 FY2026 目标 RMB250-300 million。没有来源披露收入确认政策、授权 /
              订阅与硬件销售收入拆分，或“收入”数字究竟是已入账、已签约还是由出货隐含。三个 FY2026 目标无法对齐成一个数字，也没有来源说明 H1 2026 的 RMB100 million
              是已收现金、已开票，还是运行率估计。本章把它视为相互冲突的数据声称，而非已解决事实。
