- id: funding-history-investors-valuation
  title: Funding history, investor base, and valuation
  body: DexForce's disclosed financing history spans at least three distinct events.
    In May 2024, EqualOcean reported a strategic financing round led by Lenovo Capital,
    earmarked for product development, team expansion, and market growth — the earliest
    third-party-confirmed capital event found. In July 2025, Chinese outlets 21jingji,
    Investor's China (投资家网), and Chuangtouzhijia reported that DexForce closed combined
    A1 and A2 rounds worth several hundred million RMB (数亿元), led by Chengdu Sci-Tech
    Innovation Investment (成都科创投) and Hongtai Fund (洪泰基金), with Tianying Capital,
    the Sichuan Academician Fund, Nanshan Strategic Emerging Industries Investment,
    Yicun Songling, and Tanyuan Venture Capital also participating, while existing
    shareholder Lenovo Capital added further follow-on capital. Then, on June 30,
    2026, DexForce announced a Series B of RMB 1 billion (roughly US$137-138 million)
    at a post-money valuation above RMB 10 billion (roughly US$1.37-1.38 billion),
    crossing the unicorn threshold. Series B investors named across the company's
    own release, Gasgoo, Pandaily, EmbodiedGlobal, and Wedoany include returning double-down
    backers Shenzhen Capital Group (深创投) and the Guiyang Digital Economy Fund; new
    investors Qianhai Mother Fund, Lens Technology (SZ:300433, which reportedly became
    a customer before investing), ICBC Capital, Hengjian Capital/Asset, and Zhurui
    Capital; and follow-on capital from existing shareholders Nanshan Strategic Emerging
    Industries Investment, Chengdu Sci-Tech Innovation Investment, and the Sichuan
    Academician Fund. No source reviewed reconciles a full financing ledger — exact
    dates, tranche sizes, instrument type, or cumulative lifetime proceeds are not
    public, so total capital raised is best treated as unresolved even though the
    individual round events are independently corroborated.
