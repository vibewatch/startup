company:
  name: DexForce
chapter:
  number: 1
  title: Company Overview
  summary: DexForce (跨维智能, also rendered Kuawei Intelligence / Trans-Dimensional Intelligence)
    is a Shenzhen-based physical-AI and embodied-intelligence company founded in June
    2021 that pairs a self-developed simulation-to-real (Sim2Real) stack — EmbodiChain,
    DexVerse, DexWorldModel — with the DexForce W1 Pro humanoid and DexSense vision
    hardware. By its June 30, 2026 Series B, the company had raised RMB 1 billion
    at a post-money valuation above RMB 10 billion, becoming a China embodied-AI unicorn
    preparing for an IPO, but audited revenue, headcount, cap table, and board-governance
    detail remain undisclosed and several scale figures are self-reported.
sections:
- id: identity-hq-founding-business-model
  title: Identity, headquarters, founding, and business model
  body: 'DexForce Technology Co., Ltd. (跨维（深圳）智能数字科技有限公司, also written Kuawei Intelligence
    or Trans-Dimensional Intelligence in English-language coverage) is a Chinese national
    high-tech enterprise centered on embodied intelligence and humanoid robots. The
    company''s own English and Chinese about-us pages state it was founded in June
    2021, and Baidu Baike''s corporate profile gives a more precise incorporation
    date of June 15, 2021. Headquarters sit at the 14th Floor, Shenzhen Innovation
    Investment Mansion (also translated Venture Building), No. 1001 Keyuan Road, Nanshan
    District, Shenzhen, Guangdong Province — an address repeated consistently across
    the company''s English site, Chinese site, documentation center, and the dexforce.top
    vision-hardware storefront. The company says more than 70% of its staff work in
    R&D, led by what it calls ''top 2% global scientists.'' Its product matrix spans
    EmbodiChain (an open-sourced, GPU-accelerated embodied-AI development platform
    published on GitHub under an Apache-2.0 license), the DexForce W1 Pro general-purpose
    wheeled humanoid, DexSense pure-vision spatial sensors and 3D industrial cameras
    (marketed in part through the dexforce.top storefront), the DexVerse simulation/synthetic-data
    engine, and the DexWorldModel world model. Commercially, DexForce blends outright
    hardware sales with a self-described ''Physical Token'' economics model — charging
    per physical action a robot performs, echoing per-token pricing for large language
    models — and a franchise-like ''DexBot Inside'' operator program in which local
    partners run robot-staffed retail and cultural-tourism kiosks under revenue-sharing
    arrangements. The result is a hybrid business model: selling robots and vision
    hardware outright, licensing the EmbodiChain/DexVerse software stack, and running
    an operator network that pays for deployed robot capacity rather than a single
    up-front purchase.'
