company:
  name: DexForce
chapter:
  number: 6
  letter: U
  title: Customers
  summary: DexForce reports 100+ paying enterprise customers and RMB100M+ annualized revenue as of mid-2025
    per independent financial media, spanning industrial (Midea, CRRC, Wuling named via Series B coverage),
    retail/cultural-tourism (a May 2026 rollout of 10+ stores across 5 cities plus an independently corroborated
    Shenzhen convenience-store deployment), and a single named research/education partner. However, DexForce's
    own pages disclose three mutually unreconciled scale denominators (1,000+ projects EN, 1,500+ projects
    ZH, 1,000+ enterprises careers page), named customer proof stalls at 9 identifiable accounts against
    the claimed 100+ base, the strongest customer reference (Lens Technology) is also a Series B investor,
    and no source discloses NRR, GRR, churn, renewal, or satisfaction data, leaving retention, concentration,
    and true production maturity as open diligence questions.
