  - CU052
  body: DexForce's disclosed customer base spans at least seven distinct buyer/user/payer segments rather
    than a single go-to-market motion. On the industrial side, procurement teams at large manufacturers
    (Midea in home appliances, CRRC in rail equipment, Wuling in automotive assembly, and Lens Technology
    in precision glass/cover components) buy DexForce's embodied-AI models for bin-picking, assembly,
    and insertion tasks running on third-party robotic arms; line workers are the day-to-day users while
    the OEM is the payer. A second, structurally different segment is commercial retail and food-and-beverage
    service, where DexForce does not sell directly to consumers but instead supplies its "DexBot Inside"
    embodied-AI brain to independent operators who franchise the hardware into high-traffic venues (theme
    parks, malls, tourist streets); the operator is both buyer and payer, while consumers are the end
    users. A third, newly surfaced segment is research and education, evidenced by a single named institutional
    partner, Guilin Tourism University, alongside three other 2026 partners in Guangzhou and Meizhou whose
    business models are not detailed in any source fetched this run. Geography is concentrated in mainland
    China (Shenzhen, Xuzhou, Guilin, Yangshuo, Shanwei, Guangzhou, Meizhou); no source fetched this run
    documents an overseas commercial deployment. The customer journey map (FU001) traces how a prospect
    typically moves from trade-show visibility through a pilot, into a named disclosure, and finally into
    either an industrial production line or a retail franchise signing, with post-sale support and, in
    Lens Technology's case, an eventual investor relationship.
- id: adoption-trajectory
  title: Adoption Trajectory & Deployment Proxies
  tableRefs:
  - TU002
  figureRefs:
  - FU002
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU012
  - CU013
  - CU015
  - CU016
  - CU051
  body: 'The clearest independent adoption proxy comes from financial-media coverage (21jingji and InvestorsCN,
    both dated around July 10, 2025) reporting that DexForce had surpassed 100 paying enterprise customers
    and RMB100 million-plus in annualized revenue across dozens of deployment scenarios. DexForce''s own
    official pages complicate this picture: the English-language about page claims 50-plus sub-industries
    and 1,000-plus delivered projects, the Chinese-language variant of the same page claims 1,500-plus,
    and the careers page separately claims 1,000-plus enterprises served — three different denominators
    (customers, projects, enterprises) that are never reconciled against one another or against the independently
    reported 100-customer figure. The most recent deployment proxy is the May 1, 2026 retail rollout:
    10-plus stores opened simultaneously across five cities/venues (Xuzhou Fangte theme park, Shenzhen
    Longgang Xinghe COCO Park, Shenzhen K11, Guilin Elephant Trunk Hill, and Yangshuo West Street), drawing
    a claimed 100,000-plus opening-day visitors, with a flagship-cohort figure of 1,000-plus orders per
    robot per day during the holiday peak. The adoption/deployment funnel (FU002) makes explicit how sharply
    the evidence narrows: from a claimed scale of roughly 1,000 enterprises/projects, down to 100 independently
    reported paying customers, down to 9 named accounts and operators this chapter could actually identify,
    down to just 1 deployment independently corroborated by a source with no financial or ownership tie
    to DexForce.'
- id: named-customer-proof
  title: Named Customer Proof
  tableRefs:
  - TU003
  figureRefs:
  - FU003
  claimRefs:
  - CU006
  - CU007
  - CU019
  - CU024
  - CU026
  - CU027
  - CU029
  - CU020
  body: Named customer proof is thin relative to the scale claims above, but it is real and spans both
    industrial and retail tracks. Embodied Global's Series B coverage names Midea, CRRC, and Wuling as
    industrial customers running DexForce's models on production robotic arms for bin-picking, assembly,
    and insertion, and separately reports a founder quote that Lens Technology was a customer before becoming
    a Series B investor — a related-party detail that limits how independent that reference can be treated.
    Pandaily's reader-view fetch of a funding article separately names Huawei and Midea as customers,
    but the underlying Huawei-titled article returned only an empty/broken extraction in this run, so
    the Huawei detail could not be independently verified and is flagged as an open question. At the May
    2026 Shenzhen Cultural Expo, DexForce signed four named retail/cultural-tourism operators (Zhongyi,
    Xingkong Yinli, Shaanxi Hairong, and Guangdong Dadao) whose CCTV-covered booth demo (chess, ice-cream
    service, and blind-box robots) is a visibility proxy, not proof of paying production use. The single
    strongest piece of arm's-length proof is Aigazine's independent report of a W1 Pro Gen2 robot operating
    unsupervised inside a real Shenzhen community convenience store, handling meal prep, microwave duties,
    and customer delivery — a non-DexForce, non-investor outlet corroborating a live production deployment.
    The customer proof matrix (FU003) scores each of these accounts on evidence quality, outcome specificity,
    retention visibility, and production maturity side by side.
- id: retention-durability
  title: Retention, Durability & Satisfaction Gaps
  tableRefs:
  - TU004
  figureRefs:
  - FU004
  claimRefs:
  - CU017
  - CU051
  - CU032
  - CU033
  - CU034
  - CU035
  - CU037
  - CU038
  body: 'No source fetched this run discloses net revenue retention, gross revenue retention, logo churn,
    contract renewal rates, or a customer satisfaction/NPS score for DexForce at either the industrial
    or retail segment level; each of these is recorded as an explicit null with a concrete diligence ask
    in the retention table (TU004) rather than silently omitted. What can be documented is unit economics
    for the May 2026 retail launch week: a per-store holiday revenue of RMB100,000-plus, a 4.6x uplift
    versus a traditional (non-robotic) store, a 99%-plus store-entry-to-purchase conversion rate, a payback
    period DexForce describes as "as fast as 6 months" (explicitly caveated as category-dependent), a
    general 30%-40% foot-traffic lift around an average store versus a much larger 200% lift measured
    only at the flagship Guilin Elephant Trunk Hill location, and a peak single-hour throughput of 82
    orders and RMB2,050 in revenue at that same flagship store. These are launch-week, promotion-adjacent
    figures, not steady-state retention evidence, and the range figure (FU004) presents them as disclosed
    spans rather than a single blended average to avoid overstating the typical store''s performance using
    the flagship''s outlier result. A customer-support hotline (400-8086-299) is confirmed to exist in
    DexForce''s operator manual, but ticket volume, resolution time, and complaint history are undisclosed.'
- id: expansion-concentration
  title: Expansion & Concentration Risk
  tableRefs:
  - TU005
  claimRefs:
  - CU018
  - CU039
  - CU040
  - CU041
  - CU042
  - CU043
  - CU045
  - CU049
  - CU050
  body: 'DexForce''s near-term expansion driver is the "DexBot Inside" operator/franchise model: rather
    than selling hardware outright, DexForce licenses its embodied-AI brain to independent operators who
    run the retail-service business, and the company launched a nationwide operator-recruitment call immediately
    after publicizing the May 2026 launch-week economics. This is capital-light for DexForce, but it concentrates
    execution risk in operators the company does not control, and steady-state (post-promotion) unit economics
    for new operators are unproven. Three further concentration risks stand out. First, DexForce''s single
    most quotable customer reference, Lens Technology, is also a Series B investor, so that reference
    is not an arm''s-length data point. Second, TrendForce''s industry-level data shows Unitree and AgiBot
    alone capturing nearly 80% of China''s 2026 humanoid-robot shipment volume, while Unitree (raised
    at a much larger scale) and UBTech (publicly listed, reporting RMB2,001 million in FY2025 revenue)
    both dwarf DexForce''s independently reported RMB100 million-plus annualized revenue — meaning DexForce
    competes for a small residual share against far better-capitalized rivals. Third, essentially all
    of the named customer proof this chapter could assemble clusters around a single Series B funding
    announcement or a single trade-show signing event, rather than a broad, independently sourced customer
    roster, which risks overstating the breadth of durable demand relative to a company with a fully independent
    reference base. DexForce has also stated an intent to pursue an IPO, which would eventually force
    fuller customer-concentration disclosure but provides no such visibility today.'
