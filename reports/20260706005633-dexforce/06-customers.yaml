- calloutType: risk
  title: Named customer proof is thin and cluster-concentrated
  body: Of DexForce's independently reported 100+ paying enterprise customers, this chapter can name only
    9 accounts/operators, and most of those surfaced from a single Series B funding announcement (Midea,
    CRRC, Wuling, Lens Technology) or a single Cultural Expo signing event (four retail operators). No
    broad, independently sourced customer list exists in the fetched evidence.
  claimRefs:
  - CU006
  - CU019
  - CU024
- calloutType: risk
  title: Lens Technology's reference is not arm's-length
  body: DexForce's founder states that Lens Technology was a customer before becoming a Series B investor.
    Any commercial reference from Lens Technology therefore carries a related-party conflict of interest
    and should be weighted accordingly relative to a fully independent logo.
  claimRefs:
  - CU026
  - CU027
- calloutType: strength
  title: Aigazine independently corroborates a live, unsupervised retail deployment
  body: Aigazine, an outlet with no disclosed financial or ownership tie to DexForce, independently reports
    a W1 Pro Gen2 robot operating unsupervised inside a real Shenzhen convenience store performing meal
    prep, microwave duties, and customer delivery — the single strongest arm's-length production-deployment
    data point in this chapter.
  claimRefs:
  - CU029
- calloutType: assumption
  title: Customers, projects, and enterprises are not the same denominator
  body: DexForce's own pages report three different scale metrics — 1,000+ projects (EN about page), 1,500+
    projects (ZH about page), and 1,000+ enterprises (careers page) — none of which is reconciled with
    the independently reported 100+ paying customers figure. This chapter treats them as distinct, non-additive
    metrics rather than assuming any of them approximate a customer count.
  claimRefs:
  - CU002
  - CU003
  - CU013
- calloutType: risk
  title: Retention, NRR/GRR, and churn are wholly undisclosed
  body: No source fetched this run contains net revenue retention, gross revenue retention, logo churn,
    renewal rate, or a satisfaction/NPS score for any DexForce segment. All May 2026 retail unit-economics
    figures are launch-week/promotion-adjacent, not steady-state retention evidence.
  claimRefs:
  - CU032
  - CU033
  - CU034
