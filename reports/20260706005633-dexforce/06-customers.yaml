    - label: Pilot / demo engagement
      description: Prospective industrial buyers or retail operators trial the platform on a specific
        task (bin-picking, barista, retail service).
      claimRefs:
      - CU004
    - label: Named disclosure (press / case study)
      description: A subset of engagements become named logos in company or independent press (Midea,
        CRRC, Wuling, Lens Technology).
      claimRefs:
