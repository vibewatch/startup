- id: FV001
  title: Recommendation logic
  type: flow
  layout: standard
  summary: Chain from DexForce's financing momentum and commercial proof, through
    disclosure gaps and adverse sector signals, to the final recommendation.
  data:
    nodes:
    - id: n1
      label: 'Financing momentum: RMB1B Series B at >RMB10B valuation'
      tone: positive
    - id: n2
      label: 'Commercial proof: multi-city kiosk launch + WorldArena benchmark claim'
      tone: positive
    - id: n3
      label: 'Disclosure gaps: unaudited figures, no cap table, no certification'
      tone: warning
    - id: n4
      label: 'Adverse signals: NDRC bubble warning, Morgan Stanley skepticism'
      tone: risk
    - id: n5
      label: 'Valuation check: est. ~100x trailing / ~25-33x forward vs. 7.5-25x peer
        multiples'
      tone: warning
    - id: n6
      label: 'Recommendation: research-more, medium confidence, high risk, stretched
        stance'
      tone: neutral
    edges:
    - from: n1
      to: n5
      label: sets the price
    - from: n2
      to: n5
      label: supports scale
    - from: n3
      to: n6
      label: caps confidence
    - from: n4
      to: n6
      label: raises risk rating
    - from: n5
      to: n6
      label: drives valuation stance
