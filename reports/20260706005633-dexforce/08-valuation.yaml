- id: financing-context-and-entry-discipline
  title: Current financing context and entry discipline
  body: 'DexForce''s disclosed financing history spans three events: a May 2024 strategic
    round led by Lenovo

    Capital; combined A1/A2 rounds in July 2025 worth several hundred million RMB,
    led by Chengdu Sci-Tech

    Innovation Investment and Hongtai Fund, at which point Lenovo Capital''s own representative
    credited DexForce

    with 100+ enterprise customers, dozens of deployed scenarios, and roughly RMB100
    million in annualized

    revenue; and the June 2026 Series B of RMB1 billion at a post-money valuation
    above RMB10 billion. Independent

    aggregation of Chinese financial-press coverage adds a sharper data point: DexForce
    reports RMB100 million in

    H1 2026 revenue alone, and guides full-year 2026 revenue to 3-4x of full-year
    2025 after "doubling every year

    from 2022-2024." Entry discipline at this stage means treating every one of those
    figures as a company-guided

    estimate, not an audited actual, until an IPO filing or comparable disclosure
    event arrives. No source

    reviewed reconciles a full financing ledger across all three rounds -- exact tranche
    sizes, instrument type

    (equity vs. convertible), anti-dilution terms, or cumulative lifetime proceeds
    are unresolved -- so any new

    capital committed at or near the Series B mark carries real overhang risk on both
    price and structure. The

    round''s investor base itself mixes state-linked and bank-affiliated capital with
    policy-aligned mandates

    alongside private strategics, which supports the financing-momentum narrative
    but does not substitute for

    arm''s-length, return-maximizing price discovery, and no source discloses any
    financing or valuation update

    since the round closed.

    '
