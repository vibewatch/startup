callouts:
- calloutType: strength
  title: Six-plus independent outlets confirm the Series B terms
  body: Pandaily, Gasgoo, Wedoany, KrASIA, and two EmbodiedGlobal articles independently
    corroborate the RMB1 billion / >RMB10 billion Series B terms and lead investor
    list, giving this chapter's financing-momentum pillar unusually broad third-party
    confirmation for a private China humanoid-sector round.
  claimRefs:
  - CV001
  - CV002
- calloutType: risk
  title: Every revenue figure behind the >RMB10B mark is unaudited
  body: EmbodiedGlobal's own Series B coverage explicitly states DexForce's headline
    figures "should be treated as claims until third-party benchmarks are available,"
    and no source reconciles the A1/A2, H1 2026, and FY2026-guidance revenue figures
    into one audited number.
  claimRefs:
  - CV008
  - CV018
  - CV015
- calloutType: insight
  title: The implied multiple swings 3-4x depending on which revenue base is used
  body: Using trailing FY2025 revenue implies an estimated ~100x multiple; using DexForce's
    own guided FY2026 revenue implies an estimated ~25-33x multiple -- much closer
    to Unitree's and UBTECH's disclosed 7.5-25x and ~24.5x multiples. Which base proves
    closer to audited reality is the single most valuation-relevant open question
    in this chapter.
  claimRefs:
  - CV038
  - CV039
  - CV040
- calloutType: risk
  title: A related-party investor sits inside the round
  body: Series B strategic investor Lens Technology reportedly invested only after
    first becoming a DexForce customer, a dynamic the founder himself frames as "use
    it first, then invest" -- a pattern that can inflate both perceived commercial
    traction and round credibility.
  claimRefs:
  - CV009
