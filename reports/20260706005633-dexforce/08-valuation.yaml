- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal (qualitative)
  rows:
  - - Bull
    - FY2026 revenue hits or exceeds guided 3-4x FY2025 growth (est. RMB300-400M+);
      DexForce re-rates toward Unitree/UBTECH-style public multiples (est. 20-30x).
    - Estimated RMB20-35 billion valuation range at next financing event or listing.
    - Guidance miss; benchmark claims unverified; no listing venue confirmed.
    - Plausible but unconfirmed — sector forecasts have swung this fast before (Morgan
      Stanley 14k→28k→50k units in 6 months).
  - - Base
    - Revenue growth continues but below guided pace; a further private step-up round
      precedes any listing, echoing Unitree’s multi-round path to its IPO filing.
    - Estimated RMB13-20 billion valuation range at the next private round.
    - Prolonged private status delays price discovery; disclosure quality does not
      improve.
    - Most consistent with the balance of evidence reviewed in this chapter.
  - - Bear
    - Bubble-risk warnings (NDRC, Morgan Stanley Nov-2025) prove directionally right
      for DexForce; holiday-period kiosk economics fail to repeat.
    - Flat-to-down next round or valuation stagnation, echoing UBTECH’s own ~37.5%
      peak-to-trough public market-cap decline (Dec 2023–Dec 2024).
    - Down round signals distress to the broader sector; related-party investor dynamics
      draw scrutiny.
    - Cannot be ruled out given the disclosure gaps and adverse sector commentary
      identified in this chapter.
  notes: All valuation ranges are explicitly estimated/inferred from peer multiples
    and DexForce's own guidance, not derived from an independent valuation model;
    treat as scenario illustration, not a price target.
