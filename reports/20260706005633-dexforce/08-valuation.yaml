- id: recommendation-confidence-risk-valuation-stance
  title: Recommendation, confidence, risk rating, and valuation stance
  body: 'Weighing the thesis against the anti-thesis, this chapter''s recommendation
    is research-more --

    not track, and not buy -- with medium confidence, a high risk rating, and a stretched
    valuation stance. The

    case for caution over conviction is straightforward: DexForce''s post-Series-B
    valuation implies an estimated

    revenue multiple that sits well above the disclosed multiples of its two most
    financially transparent China

    humanoid peers, Unitree (an estimated ~7.5x on its pre-IPO mark and ~25x on its
    targeted IPO market cap) and

    UBTECH (an estimated ~24.5x on its current public market capitalization), even
    after crediting DexForce''s own

    guided FY2026 revenue growth. A "buy" call is not supportable while nearly every
    scale, revenue, and benchmark

    figure behind that multiple remains company-sourced and explicitly flagged as
    unaudited by an independent

    outlet covering the same round. At the same time, an outright "avoid" would understate
    real, independently

    corroborated financing momentum -- six-plus independent outlets confirm the Series
    B terms -- and a benchmark

    placement claim that at least appears in independent news coverage even if not
    independently reproduced.

    Research-more reflects that middle ground: the thesis is credible enough to keep
    tracking closely, but not

    yet supported by the audited financial, cap-table, or certification evidence a
    "track" or "buy" call would

    require. The decision-relevant thresholds that would move this call toward an
    upgrade or a downgrade are

    explicit and testable, and are developed fully in the recommendation summary table
    and the thesis-break

    triggers table later in this chapter.

    '
