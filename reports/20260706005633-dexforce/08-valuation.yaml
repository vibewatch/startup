  evidenceGaps:
  - type: missing-source
    severity: material
    topic: benchmark-verification
    missingEvidence: An independent, third-party-run leaderboard entry or reproduction
      confirming DexForce's claimed WorldArena Track 2 first-place world-model result.
    whyItMatters: The benchmark claim is one of the strongest pieces of evidence for
      the bull thesis, but it currently rests entirely on DexForce's own release with
      no independent leaderboard citation found.
    diligencePath: Request the WorldArena benchmark organizer's published leaderboard
      or contact the benchmark maintainers directly to confirm DexForce's placement
      and methodology.
    relatedQuestionRefs:
    - QV003
  - type: conflicting-data
    severity: material
    topic: revenue-reconciliation
    missingEvidence: A single, audited revenue figure that reconciles DexForce's A1/A2-round
      annualized RMB100 million estimate, its reported RMB100 million H1 2026 figure,
      and its 3-4x FY2026 guidance into one consistent full-year number.
    whyItMatters: Every valuation multiple in this chapter depends on which unaudited
      revenue base is used; without reconciliation, the implied multiple could be
      understated or overstated by several multiples.
    diligencePath: Request audited or reviewed interim financial statements directly
      from DexForce, or wait for an IPO prospectus that would require reconciled financials.
    relatedQuestionRefs:
    - QV014
  - type: access-blocked
    severity: minor
    topic: registry-verification
    missingEvidence: Independently verified registered-entity details (legal name,
      registration date, registered capital, shareholder list) for DexForce Technology
      Co., Ltd.
    whyItMatters: Without registry verification, even basic legal-entity facts rely
      solely on DexForce's own disclosures and a public encyclopedia entry.
    diligencePath: Retry the CNVerify lookup with a different access method, or use
      an alternative China business registry (e.g., National Enterprise Credit Information
      Publicity System) directly.
    relatedQuestionRefs:
    - QV012
  - type: stale
    severity: minor
    topic: financing-freshness
    missingEvidence: Any DexForce financing, valuation-reaffirmation, or secondary-transaction
      disclosure dated after the June 2026 Series B close.
    whyItMatters: A stretched valuation stance issued today could be stale within
      months given how quickly this sector's financing and forecast data have moved
      in 2025-2026.
    diligencePath: Set a recurring search alert for DexForce financing news and re-run
      this chapter's evidence review at the next scheduled report refresh.
    relatedQuestionRefs:
    - QV015
  - type: missing-source
    severity: material
    topic: deal-terms
    missingEvidence: Series B term sheet or definitive agreement details covering
      instrument type, anti-dilution protection, and liquidation preference.
    whyItMatters: Deal terms directly affect downside protection and true economic
      ownership; their absence means any price-based valuation view ignores potential
      preference overhang.
    diligencePath: Request the term sheet or a summary of economic rights directly
      from DexForce or a participating investor under an NDA.
    relatedQuestionRefs:
    - QV016
  - type: missing-source
    severity: material
    topic: certification-status
    missingEvidence: Any independent safety, industrial, or CE/UL-style certification
      record for the W1 Pro commercial-service platform.
    whyItMatters: Commercial-service deployment claims (kiosk revenue lift, multi-city
      rollout) cannot be fully underwritten without independent evidence that the
      platform meets recognized safety standards.
    diligencePath: Request certification test reports or safety-audit documentation
      directly from DexForce, or search national/regional robot-safety certification
      registries.
    relatedQuestionRefs:
    - QV030
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-set-coverage
    missingEvidence: Financial or valuation disclosure for additional China humanoid/embodied-AI
      entrants beyond the five comparables enumerated in this chapter's comparable
      valuation table.
    whyItMatters: China's humanoid sector reportedly has 150+ entrants; a five-company
      comparable set is illustrative, not exhaustive, so DexForce's relative positioning
      could look different against a fuller peer set.
    diligencePath: Expand the comparable set in a future refresh using a systematic
      screen (e.g., all humanoid-sector companies with disclosed Series B+ rounds
      or public listings) rather than the convenience sample used here.
    relatedTableRefs:
    - TV004
acknowledgedWarnings:
- dimension: unverifiedSource
  reason: Sources were reviewed via web search and direct inspection during DexForce
    research; key funding, corporate, and product URLs are verified in the per-run
    fetch trail; remaining sources were confirmed accessible during research but not
    re-fetched post-env-setup.
