- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis argument
  - Anti-thesis argument
  - What would change the view
  rows:
  - - Financing momentum
    - Multi-institution RMB1B Series B at >RMB10B valuation, confirmed by 6+ independent
      outlets.
    - Every revenue/scale figure behind the round is company-sourced; one source flags
      them as unaudited claims.
    - An audited financial statement or IPO prospectus confirming the underlying revenue
      base.
  - - Benchmark validation
    - DexWorldModel claims a first-place WorldArena Track 2 finish.
    - No independent leaderboard or reproduction was found corroborating the claim.
    - A published, independently-run WorldArena leaderboard entry naming DexForce.
  - - Commercial deployment
    - Simultaneous multi-city kiosk launches with a claimed 4.6x revenue lift vs.
      staffed stores.
    - Deployment economics are reported only for a short holiday-period window with
      no repeatability data.
    - Multi-quarter operator-reported revenue data outside the Labor Day holiday window.
  - - Investor quality
    - Syndicate includes state-linked funds (Shenzhen Capital Group) and a bank-affiliated
      investor (ICBC Capital).
    - Strategic investor Lens Technology reportedly invested only after becoming a
      customer first.
    - Disclosure of arm's-length, return-maximizing terms for at least one investor
      in the round.
  - - Sector tailwind vs. bubble risk
    - TrendForce forecasts 94% output growth in 2026; Morgan Stanley raised its shipment
      forecast to 50,000 units by June 2026.
    - A Beijing NDRC official and Morgan Stanley's own earlier note both warned of
      sector-wide bubble risk and far lower (12,000-unit) shipment levels.
    - Two consecutive quarters of stable, converging third-party shipment/revenue
      forecasts for the sector.
  notes: Each row pairs a specific confirming citation with a specific adverse or
    gap-based citation from this chapter's source set.
