- id: exit-readiness-triggers-diligence-asks
  title: Exit readiness, thesis-break triggers, and final diligence asks
  body: 'DexForce''s own release frames the Series B explicitly as IPO preparation,
    and Series B proceeds are

    earmarked for iterating the world-model algorithms, upgrading the physics engine,
    building data

    infrastructure, and improving humanoid capability and real-world deployment --
    consistent with pre-IPO capital

    deployment rather than a pure growth-equity story, though no source discloses
    a confirmed listing venue or

    timeline. Exit readiness nonetheless remains unproven: no independent safety certification
    has been disclosed,

    UBTECH''s own investor-relations financial page for comparison renders as a JavaScript-only
    shell with no

    extractable data, and an attempt to verify DexForce''s registered-entity details
    via an independent China

    business-registry service (CNVerify) was blocked by an anti-bot challenge, leaving
    even basic legal-entity

    verification incomplete for this chapter. A separate attempt to cross-check DexForce''s
    funding history against

    a startup-funding database (Fundup) was similarly blocked, and one alternate Gasgoo
    article URL referencing

    DexForce returned a 404. A parallel attempt to retrieve a specific HKEX filing-index
    link for an

    already-listed China humanoid peer returned a 404 "page relocated" notice within
    a single reporting cycle,

    underscoring how quickly even indexed regulatory filings go stale and must be
    re-verified rather than cited

    from memory. The thesis-break triggers and final diligence asks tables below translate
    these gaps into

    concrete, monitorable thresholds: an audited revenue disclosure or IPO filing
    would be the single most

    thesis-confirming event, while a down round, a customer-concentration reveal,
    or a documented failure of

    kiosk economics outside the Labor Day holiday window would each independently
    break the current research-more

    stance toward avoid.

    '
