- id: bull-base-bear-scenarios
  title: Bull, base, and bear scenarios
  body: 'Three scenarios frame how DexForce''s valuation could evolve from its current
    >RMB10B Series B mark.

    In the bull case, FY2026 revenue lands at or above the company''s own guided 3-4x
    FY2025 growth (an estimated

    RMB300-400 million or more), and a subsequent round or IPO re-rates DexForce toward
    Unitree- or UBTECH-style

    public multiples (an estimated 20-30x), implying an estimated valuation range
    of RMB20-35 billion -- plausible

    given how quickly China humanoid-sector expectations have moved (Morgan Stanley''s
    own 2026 shipment forecast

    rose from roughly 14,000 to 28,000 to 50,000 units within about six months). In
    the base case, revenue growth

    continues but below the guided pace, and DexForce raises a further private round
    at a modest step-up before

    any public listing, similar in cadence to Unitree''s own multi-round path toward
    its STAR Market filing,

    implying an estimated RMB13-20 billion mark -- consistent with the overall evidence
    picture of real momentum

    alongside persistent unaudited disclosure. In the bear case, the bubble-risk warnings
    from a Beijing NDRC

    official and Morgan Stanley''s more cautious November 2025 note prove directionally
    right for DexForce

    specifically, the reported holiday-period kiosk economics fail to repeat, and
    a flat-to-down next round or

    valuation stagnation follows -- echoing UBTECH''s own roughly 37.5% peak-to-trough
    public market-cap decline

    between December 2023 and December 2024 before its subsequent recovery. Each scenario''s
    assumptions,

    valuation logic, key risks, and probability signal are detailed in the scenario
    table and valuation-range

    figure below; all ranges are explicitly estimated and inferred from peer multiples
    and company guidance, not

    derived from an independent valuation model.

    '
