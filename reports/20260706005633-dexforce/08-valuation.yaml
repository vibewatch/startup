    - Third-party tracker (Premier Alternatives) estimates $1.4B valuation (Mar 2026)
      on $411.5M total raised; raised a further $200M+ round in Apr-May 2026
    - Estimated 3.52x capital-efficiency ratio (valuation/funding, not revenue)
    - Rounds out the direct-peer set; first quantified estimate found for this peer.
    - No revenue disclosure exists to compute a revenue multiple; capital-efficiency
