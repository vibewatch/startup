      - number: '1.4'
        title: Scale claims, revenue signals, and commercial milestones
        blocks:
          - type: paragraph
            body: >-
              DexForce's scale claims evolve depending on which source and date is checked, and the chapter treats them
              as company-claimed rather than independently audited. The English homepage (about.html) states deployment
              across '50+ sub-industries and 1,000+ projects,' while the Chinese about-us page and the company's own
              June 2026 Series B article state '50+ 细分行业' and '1,500+ 项目' (50+ sub-industries, 1,500+ projects)
              alongside a separate claim of '1,500+ 具身模型' (1,500+ embodied models) — a similar-looking number that
              actually describes a different metric (deployed models, not deployed projects), and the English and
              Chinese project counts themselves do not match, most likely reflecting an update lag between the two
              language sites rather than two independently verified figures. On revenue, EmbodiedGlobal quotes founder
              Jia Kui saying DexForce generated more than RMB 100 million in 2025 and booked roughly RMB 100 million in
              H1 2026 alone, guiding toward 3-4x revenue growth for full-year 2026 (implying a roughly RMB 300-400
              million target); separately, an investor quoted in DexForce's own Series B article projects full-year
              revenue 'in the hundreds of millions of RMB' without committing to a specific figure, and an earlier July
              2025 21jingji article already described the company as having reached '亿元级' (RMB 100 million-plus)
              annualized revenue and being deployed across 'dozens of scenarios' with '100+ enterprise customers' at
              that time — evidence of a steadily rising, but self-reported, revenue trajectory rather than an audited
              one. On product milestones, DexForce's DexWorldModel topped the Track 2 (Functionality) leaderboard of the
              WorldArena global embodied world-model benchmark in April 2026, and the company published its
              Dexterity-BEV data-alignment method (arXiv 2606.02274) the same period. Commercially, the company moved
              from trade-show demonstrations toward paid deployment: a May 1, 2026 rollout placed 10+ robot-staffed
              retail kiosks across five city landmarks in a single day, drawing more than 100,000 visitors, and a
              same-month internal report claimed per-store holiday revenue above RMB 100,000, a 4.6x revenue lift versus
              traditional staffed kiosks, 99% store-visit-to-purchase conversion, and payback periods as fast as six
              months. A May 21-25, 2026 appearance at the China (Shenzhen) International Cultural Industries Fair
              produced national broadcaster (CCTV) coverage and new operator-partner signings under the 'DexBot Inside'
              program.
