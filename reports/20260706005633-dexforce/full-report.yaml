  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition in customer workflow terms
        blocks:
          - type: paragraph
            body: >
              DexForce (跨维智能) describes itself as building an integrated hardware-software product matrix — the
              EmbodiChain embodied-intelligence development platform, the DexForce W1 Pro universal humanoid robot, and
              DexSense pure-vision spatial-intelligence sensors — deployed, in the company's own words, across 50+
              sub-industries and 1,000+ projects. The clearest publicly documented customer workflow is not generic
              humanoid automation but a scripted commercial-service loop: an operator selects a robot configuration
              (full-body mobile or stationary half-body), integrates it either through the ROS2-based
              secondary-development API or a turnkey application such as the "barista" coffee-service package, runs a
              signed pre-opening equipment/material checklist, and then lets end customers order via voice or a tablet
              interface on the same local network as the robot. DexForce's own May 2026 release frames this as a
              generalizable "brain" that can switch between espresso machines, draft-beer taps, and ice-cream/popcorn
              dispensers across more than ten simultaneously opened storefronts, explicitly contrasting this with
              single-purpose vending automation. The company also positions each live deployment as a data flywheel:
              real operating data from commercial-service stations is intended to feed back into DexWorldModel and
              EmbodiChain training, closing what an internal release calls the "data-model-embodiment-scenario" loop.
              This is a coherent, workflow-specific narrative, but it rests almost entirely on DexForce's own releases
              and manuals rather than named third-party operator case studies.
