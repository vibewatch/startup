      - number: '2.3'
        title: Buyer, User, and Payer Segmentation and the Adoption Path
        blocks:
          - type: paragraph
            body: >-
              DexForce's adoption path runs through at least four distinct buyer motions. In industrial manufacturing,
              the buyer/payer is the plant-operations or manufacturing-engineering budget owner, often organized into an
              'innovation application consortium' alongside integrators, model providers, and research institutes under
              MIIT and SASAC's 2026 joint real-scenario training action, which directs each province to select at least
              20 scenario units and each central state-owned enterprise at least 10, spanning industrial, service, and
              special domains, with a stated goal of ten-thousand-unit-scale deployment capability by the end of 2026.
              In the commercial-service kiosk segment, the buyer/payer is a local operator or franchisee that DexForce
              recruits nationally, while the end user is the walk-in consumer; DexForce's own May Day rollout placed 10+
              kiosks across five cities and reported payback periods as fast as 6 months, single-store holiday revenue
              above 100,000 yuan, a 4.6x revenue uplift versus traditional staffed stores, and footfall increases of
              30%-40% (up to 200% at flagship sites) -- figures that remain company-disclosed and are not yet
              independently audited. A third path runs through government- and SOE-anchored demonstration sites, where
              the trigger is meeting a policy quota rather than a conventional purchase decision, and Shanghai's
              implementation plan shows one concrete example of a co-payer structure, funding qualifying projects up to
              50% of cost (capped at 20 million yuan) and pilot deployments up to 20% of investment (capped at 10
              million yuan); the national MIIT/SASAC notice does not disclose an equivalent funding percentage, leaving
              that program's payer economics only partially observable. Across every segment, adoption converts only
              after a documented application-verification step -- MIIT's own language is to 'validate one scenario,
              deploy a batch, and drive a cluster' -- rather than a single enterprise sales cycle.
