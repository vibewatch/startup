              first humanoid with autonomous battery swapping) alongside a legacy AI-education business. Fourier
              Intelligence (Shanghai) positions its GRx series and RehabHub product toward healthcare/rehabilitation and
              consumer-companion use cases rather than industrial deployment, a softer target market than DexForce's.
              Robotera (Beijing) markets itself as the industry's only fully self-developed software-and-hardware
              embodied-intelligence stack, including the XHAND1 dexterous hand, though its official product pages
              disclose little specification or pricing detail. DexForce itself reports more than RMB100 million 2025
