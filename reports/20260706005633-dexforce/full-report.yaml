      - number: '1.5'
        title: Adverse context and underwriting limits
        blocks:
          - type: paragraph
            body: >-
              The strongest counterweight to DexForce's narrative comes from EmbodiedGlobal's own reporting on the
              Series B, which explicitly cautions that 'like many Chinese unicorns, KuaWei's numbers (1,500 models,
              99.9% success, sub-mm precision) are self-reported and should be treated as claims until third-party
              benchmarks are available,' and that the jump to a RMB 10 billion-plus valuation 'will need commensurate
              revenue growth through the IPO window.' That caution sits inside a broader sector-level warning: Morgan
              Stanley's November 2025 research note (covered by ChinaBizInsider) forecasts a far more conservative 2026
              China humanoid-robot shipment volume (about 12,000 units) than industry bulls project (some over 100,000),
              citing current robot task efficiency at only 20-30% of a human worker and describing near-term commercial
              deployment as gated by cost and reliability rather than hype. While that note is not DexForce-specific, it
              applies directly to any diligence built on DexForce's self-reported 99.9%+ task-success and rapid-payback
              retail claims. Beyond scale-figure skepticism, the chapter surfaces several disclosure gaps an investor
              would need closed before underwriting the post-Series-B valuation: no audited financial statements, no
              disclosed headcount, no public cap table or voting-rights schedule, and no customer-concentration
              breakdown despite named enterprise customers (Midea, CRRC, Wuling, Lens Technology) suggesting meaningful
              commercial-customer overlap risk. The unresolved legal-representative-versus-founder naming discrepancy
              adds a further governance-transparency question that later chapters (leadership, financials, risks) should
              track rather than resolve here.
            claimRefs:
              - CO043
              - CO044
              - CO045
              - CO046
              - CO053
              - CO054
              - CO055
              - CO016
