      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The public leadership narrative centers almost entirely on Professor Jia Kui (贾奎), credited across the
              company's own news releases and independent coverage as the founder and lead scientist. EmbodiedGlobal's
              reporting on the Series B describes him as a tenured professor at the Chinese University of Hong Kong,
              Shenzhen (CUHK-Shenzhen) and a multi-year Stanford 'Top 2%' cited scientist, and DexForce's own Series B
              announcement quotes him directly on the company's 'highest ROI per physical token' strategy. The company's
              hiring page adds that the broader core team draws from MIT, Nanyang Technological University, the National
              University of Singapore, KAIST, Tsinghua University, and Zhejiang University, but names no other
              individual executives, and no independent board roster, committee structure, or voting-control schedule
              appears in any source reviewed for this chapter. A notable wrinkle: Baidu Baike's corporate-registry
              summary lists the company's legal representative as Jia Jun (贾军), a name distinct from founder Jia Kui
              (贾奎) in the reviewed romanization — a discrepancy that may reflect a separate compliance-facing officer, a
              transliteration inconsistency across sources, or an unresolved identity question the public record does
              not settle. Either way, the founder-facing narrative and the registered legal representative are not
              obviously the same disclosed individual, which compounds the already-high key-person dependence risk
              typical of a scientist-led deep-tech startup: strategy, fundraising messaging, and technical direction all
              run through one named professor with no publicly identified deputy or succession plan.
