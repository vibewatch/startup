      - number: '7.2'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              China's regulatory environment for humanoid robotics tightened materially in 2026. MIIT and SASAC issued a
              joint notice launching a national 'real-scenario training' special action, directing provinces to select
              at least 20 representative scenario units and central enterprises at least 10, with a stated goal of
              'ten-thousand-unit-scale' deployment capability by end of 2026 -- and explicitly calling on developers to
              strengthen collision detection, force-control limits, emergency braking, and black-box safety capability,
              implying that safety engineering for these behaviors is still industry-wide work in progress. Separately,
              China released its first national standard system for humanoid robotics and embodied AI (HEIS 2026), and
              Hangzhou enacted the first binding city-level embodied-AI robotics law, introducing coding-traceability
              and 'sandbox supervision' mechanisms. Against this backdrop, DexForce's own W1 user manual is notably
              candid: it states the robot has not passed medical-safety certification and lists at least seven
              categories of prohibited misuse, each with an explicit hazard rationale. No source reviewed discloses an
              independent industrial safety certification (CE, UL, ISO, or PRC equivalent) for the W1/W1 Pro platform,
              nor any DexForce-specific enforcement action or litigation -- though the latter absence itself remains an
              unresolved gap rather than a clean bill of health.
