              estimate (McKinsey, cited by The Robot Report) that bill-of-materials costs represent 40-60% of humanoid
              hardware cost. These figures should not be read as DexForce's own margins; they establish a plausible
              range (roughly 30-60% gross margin) for a scaling Chinese humanoid producer, bounded by hardware cost
              intensity on the low end and software/licensing mix on the high end, that DexForce has not confirmed
