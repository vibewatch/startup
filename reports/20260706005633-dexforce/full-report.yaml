        - id: api-auth-gap
          label: Unauthenticated joint-control API
          detail: No authentication/access-control mechanism described in v0.4.0 API docs
          type: input
        - id: autonomous-deployment
          label: Autonomous unsupervised public deployment
          detail: W1 Pro operating unsupervised in a Shenzhen convenience store per independent coverage
          type: input
        - id: bubble-sentiment
          label: Sector bubble-risk sentiment
          detail: NDRC official and Goldman Sachs warnings of overcapacity / bubble risk
          type: input
