      - number: '2.2'
        title: Sizing Lenses and the TAM/SAM/SOM Contradiction
        blocks:
          - type: paragraph
            body: >-
              Public sizing for China's humanoid/embodied-AI market is unusually contested, and the contradictions are
              informative rather than noise. Morgan Stanley's latest (June 2026) note pegs China's external-sales
              humanoid market at $2 billion in 2026, growing to $15 billion by 2030 on 446,000 annual unit shipments --
              but that $2 billion lens excludes prototypes, pre-orders, and internal-use units, and it has already been
              revised sharply: the same bank projected only 12,000 2026 units in a November 2025 'reality check' note,
              then 14,000 in January 2026, then 28,000, before settling on 50,000 in June 2026 -- a more than four-fold
              swing in shipment volume from one publisher within seven months. A separate lens from industry tracker
              GGII, reported via China Daily, counts production output rather than external sales and puts 2025
              shipments at 14,400 units with 2026 output potentially reaching 100,000-200,000 units -- two-to-four times
              Morgan Stanley's shipment number for the same year, because 'output' and 'externally sold shipments' are
              not the same measurement. An April 2025 conference forecast from consultancy Leaderobot went further
              still, projecting 82 billion yuan (about $11.6 billion) of 2025 China humanoid revenue alone -- far above
              what either the GGII shipment data or Morgan Stanley's market-size figure would imply. Regional
              industrial-cluster figures add a fourth kind of number entirely: Hangzhou's embodied-AI cluster already
              reported 106.8 billion yuan (about $15.7 billion) of 2025 output value for one city, and Shanghai targets
              over 50 billion yuan (about $6.96 billion) of core output by 2027 -- output-value figures for regional
              industrial clusters, not demand-side humanoid-unit market sizes, so they cannot be summed with the
              national shipment-revenue lens. No source reviewed isolates a bottom-up figure for DexForce's own
              obtainable share of any of these lenses; its roughly $1.4 billion post-money Series B and 50+ live
              scenario footprint are the only public anchors for a directional, low-confidence SOM.
