            body: >-
              Unitree Robotics (Hangzhou) is the scale leader: its STAR Market IPO filing discloses RMB1.7 billion 2025
              revenue, RMB600 million adjusted net profit, 60.27% gross margin, and 5,500+ humanoid units shipped in
              2025 (#1 globally), against a RMB12.7 billion pre-IPO valuation and a targeted RMB42 billion minimum IPO
