  - id: FM001
    title: Market sizing lens
    type: pyramid
    layout: standard
    summary: >-
      China's humanoid/embodied-AI opportunity spans a broad output-value pool, a narrower external-sales shipment
      market, and an unquantified DexForce-specific wedge, and the three layers use incompatible methodologies.
    data:
      nodes:
        - id: tam
          label: TAM - regional embodied-AI/robotics industrial output pool (broadest, output-value lens)
          detail: >-
            Hangzhou's single-city embodied-AI cluster already reports 106.8B yuan (~$15.7B) 2025 output value; Shanghai
            targets >50B yuan (~$6.96B) core output by 2027. Too broad and output-based to equate directly with humanoid
            unit sales.
        - id: sam
          label: >-
            SAM - China humanoid robot market, external-sales shipment-revenue lens (Morgan Stanley): $2B (2026) -> $15B
            (2030E)
          detail: >-
            Morgan Stanley's headline dollar lens; excludes prototypes/pre-orders/internal use and has already been
            revised from 12,000 to 50,000 2026 unit shipments within seven months.
        - id: som
          label: SOM - DexForce's reachable wedge across industrial + retail-kiosk verticals (author-bounded, low confidence)
          detail: >-
            No public source discloses DexForce's unit or revenue share; bounded qualitatively by its >$1.4B post-money
            Series B and 50+ live scenario footprint spanning auto parts, NEV, 3C, aerospace, logistics, and
            retail/tourism kiosks.
    approximationNotes: >-
      The three layers use different bases (regional industrial output value vs. national external-sales shipment
      revenue vs. an unquantified company-specific wedge) and are not additive; the SOM layer is an explicit author
      bound, not a disclosed figure. AgiBot's own production-scale volatility (CM019) illustrates how unstable the
      underlying unit counts feeding the TAM/SAM layers still are.
