            body: >-
              DexForce's own materials describe a multi-stream commercial model rather than a single product line:
              industrial humanoid licensing/deployment to manufacturing customers (Midea, CRRC, Wuling cited as
              deployments), a "Physical Token" consumption-based pricing construct for embodied-AI compute/data
              services, direct hardware sales (e.g., the W1 Pro humanoid platform), and a franchised retail-robotics
              concept ("DexBot Inside") that shares kiosk revenue with local operators recruited nationwide. Company
              press releases quote per-store economics (payback period, revenue uplift, peak daily orders) for the
              DexBot Inside format and describe multi-city rollout activity around May 1, 2026, but none of these
              figures are independently audited. Aggregate revenue reporting is similarly fragmented and self-reported:
              Gasgoo cites RMB100 million in H1 2026 revenue against an FY2026 target above RMB300 million; Embodied
              Global cites 2025 revenue above RMB100 million with 3-4x growth guidance for 2026; Pandaily cites an
              FY2026 target of RMB250-300 million. No source discloses revenue recognition policy, the split between
              licensing/subscription vs. hardware-sale revenue, or whether "revenue" figures are booked, contracted, or
              shipment-implied. The three FY2026 targets do not reconcile to a single figure, and no source clarifies
              whether the RMB100 million H1 2026 figure is cash-collected, invoiced, or a run-rate estimate. This is
