      - number: '5.3'
        title: 'Architecture: Sim2Real, world model, BEV alignment, and the data engine'
        blocks:
          - type: paragraph
            body: >
              DexForce's technical architecture runs from perception and actuation hardware up through a
              simulation-and-data-engine layer into a world-model/policy layer. On hardware, the W1 Pro pairs a
              6cm-baseline binocular pure-vision system with a large-model binocular algorithm, dual 7-DOF arms (10kg
              payload, ±0.5mm repeatability), and a dual-PC compute architecture rated at ≥300 TOPS running whole-body
              control at 1kHz. Above that sits DexVerse™, which DexForce says generates physics-accurate 3D scenes and
              synthetic training data from multimodal inputs using domain randomization and differentiable simulation to
              reduce the sim-to-real gap; the company also claims resulting models reach "up to 99.9% accuracy," a
              figure with no independent audit trail. DexWorldModel is positioned as a causal latent world model and,
              together with EmbodiChain and the Dexterity-BEV research line, forms what DexForce's Core Technology page
              calls its three flagship technical outputs. DexForce announced that its DSCFuncWorld world model ranked
              first globally on the WorldArena Track 2 (Functionality/Data-Engine) leaderboard, which it describes as
              testing whether a world model can generate machine-trainable, transferable, and executable robot data
              rather than just realistic video. Separately, DexForce published "Dexterity-BEV," a paper proposing a
              bird's-eye-view alignment layer that normalizes heterogeneous multi-camera, multi-embodiment,
              multi-operator robot data into one physical coordinate frame — explicitly modeled on the way BEV
              representations unified autonomous-driving perception. EmbodiChain, DexForce's only openly published
              component, packages asset generation, scene layout, trajectory sampling, failure recovery, and online data
              streaming as the data-engine layer feeding this stack, and its GitHub organization shows a commit as
              recent as July 5, 2026, one day before this report's run date.
