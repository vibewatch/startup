          detail: Repeat state/strategic investors across all disclosed funding rounds
          type: input
        - id: unaudited-revenue
          label: Unaudited, self-reported revenue
          detail: '''Hundred-million-RMB-level'' figure sourced to a single investor quote, unaudited'
          type: input
        - id: safety-incident-risk
          label: Potential public safety incident
          detail: Compounded risk of a reportable incident given the certification and API gaps
          type: process
        - id: procurement-access
          label: Government / state-program procurement access
          detail: Access to MIIT/SASAC scenario-unit allocations and government-linked customers
          type: process
        - id: customer-trust
          label: Customer / operator trust and renewal
          detail: Willingness of site operators and consumers to continue transacting with DexForce robots
          type: process
        - id: financing-availability
          label: Future financing availability
          detail: Ability to close follow-on rounds at or above the current >RMB 10B valuation
          type: process
        - id: company-valuation
          label: DexForce valuation and thesis durability
          detail: Ultimate outcome that regulatory, operational, and financial risks transmit into
          type: output
