            body: >-
              Using trailing FY2025 revenue implies an estimated ~100x multiple; using DexForce's own guided FY2026
              revenue implies an estimated ~25-33x multiple -- much closer to Unitree's and UBTECH's disclosed 7.5-25x
              and ~24.5x multiples. Which base proves closer to audited reality is the single most valuation-relevant
              open question in this chapter.
            calloutType: insight
