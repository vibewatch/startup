            body: >-
              Pandaily, Gasgoo, Wedoany, KrASIA, and two EmbodiedGlobal articles independently corroborate the RMB1
              billion / >RMB10 billion Series B terms and lead investor list, giving this chapter's financing-momentum
              pillar unusually broad third-party confirmation for a private China humanoid-sector round.
            calloutType: strength
