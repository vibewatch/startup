      - number: '7.3'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              DexForce's own technical documentation surfaces operational risks the company does not otherwise
              publicize. The Humanoid API (v0.4.0) exposes ROS2 topics and services for real-time joint-level state and
              position-mode control without describing any authentication, authorization, or access-control mechanism in
              the reviewed pages -- a meaningful gap for a system capable of directly commanding a robot's joints. The
              Barista Operation Manual documents a perception/grasping limitation explicitly: staff are told to load
              only about half the paper-cup rack to avoid the robot mis-grasping multiple cups, alongside a signed
              pre-opening checklist and an administrator escalation hotline for faults the operator cannot resolve.
              Independent coverage separately reports a W1 Pro unit operating fully autonomously and unsupervised inside
              a Shenzhen convenience store, preparing and delivering meals without human oversight -- a public-safety
              exposure with no disclosed incident-response protocol. No source reviewed discloses fleet-level uptime,
              MTBF, warranty/RMA rates, or a safety-incident record. DexForce's own deployment-economics figures
              (day-one revenue, a 4.6x lift, 99% conversion, six-month payback) are attributed specifically to the Labor
              Day holiday period and are not independently audited. A further specification conflict -- DexForce lists
              34 DOF for the W1 Pro while RobotToday's independent supplier profile lists 'up to 40 DoF' -- remains
              unreconciled.
