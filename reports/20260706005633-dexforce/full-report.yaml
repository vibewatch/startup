        title: Customer Segmentation
        blocks:
          - type: paragraph
            body: >-
              DexForce's disclosed customer base spans at least seven distinct buyer/user/payer segments rather than a
              single go-to-market motion. On the industrial side, procurement teams at large manufacturers (Midea in
              home appliances, CRRC in rail equipment, Wuling in automotive assembly, and Lens Technology in precision
              glass/cover components) buy DexForce's embodied-AI models for bin-picking, assembly, and insertion tasks
              running on third-party robotic arms; line workers are the day-to-day users while the OEM is the payer. A
              second, structurally different segment is commercial retail and food-and-beverage service, where DexForce
              does not sell directly to consumers but instead supplies its "DexBot Inside" embodied-AI brain to
              independent operators who franchise the hardware into high-traffic venues (theme parks, malls, tourist
              streets); the operator is both buyer and payer, while consumers are the end users. A third, newly surfaced
              segment is research and education, evidenced by a single named institutional partner, Guilin Tourism
              University, alongside three other 2026 partners in Guangzhou and Meizhou whose business models are not
              detailed in any source fetched this run. Geography is concentrated in mainland China (Shenzhen, Xuzhou,
              Guilin, Yangshuo, Shanwei, Guangzhou, Meizhou); no source fetched this run documents an overseas
              commercial deployment. The customer journey map (FU001) traces how a prospect typically moves from
              trade-show visibility through a pilot, into a named disclosure, and finally into either an industrial
              production line or a retail franchise signing, with post-sale support and, in Lens Technology's case, an
