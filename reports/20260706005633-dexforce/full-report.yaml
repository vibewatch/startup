      - number: '8.5'
        title: Comparable valuation set
        blocks:
          - type: paragraph
            body: >
              DexForce's closest disclosed comparables are Unitree Robotics and UBTECH Robotics, the two China

              humanoid peers with public financial disclosure. Unitree's STAR Market IPO filing shows RMB1.7 billion in

              2025 revenue and RMB600 million in adjusted net profit against a RMB12.7 billion pre-IPO valuation (an

              estimated ~7.5x trailing-revenue multiple) and a targeted ~RMB42 billion IPO market cap (an estimated ~25x

              multiple); a separate mid-2025 Series C reportedly valued Unitree at roughly RMB12 billion against roughly

              RMB1 billion in trailing revenue. UBTECH Robotics (HKEX: 9880) trades at a HK$54.73 billion market

              capitalization as of July 2, 2026 against roughly HK$2.23 billion in trailing revenue, an estimated ~24.5x

              multiple, though its market cap has swung by more than 60% peak-to-trough since 2023. Applying the same

              arithmetic to DexForce's own disclosed figures -- roughly RMB100 million trailing FY2025 revenue, or an

              estimated RMB300-400 million if FY2026 guidance is realized -- against its >RMB10 billion Series B mark

              implies a multiple of either roughly 100x or roughly 25-33x, depending entirely on which unaudited revenue

              base is used. AgiBot, previously a production-scale-only comparable (15,000th unit produced June 2026,

              independently corroborated, with a reported first-place 2025 global shipment ranking), now also has a

              disclosed valuation trajectory: Reuters reports a ~$2.07 billion PitchBook mark as of March 2026 and a

              targeted Hong Kong IPO valuation of HK$40-50 billion (~$5.1-6.4 billion) by Q3 2026, implying roughly a

              2.5-3.1x step-up from private mark to IPO target. The same Reuters reporting puts Unitree's own IPO target

              as high as RMB50 billion (~$7 billion), moderately above the ~RMB42 billion figure cited above -- a
              reminder

              that IPO valuation targets move as the listing process progresses and should not be treated as fixed. An
              earlier, March 2025 report had already placed AgiBot's negotiated valuation at roughly RMB15 billion
              (~$2.1 billion) in a Tencent-led round, suggesting the company's private-market mark was roughly flat for
              about a year before the sharper re-rating implied by its 2026 IPO target. Fourier

              Intelligence and Robotera, which disclose nothing on their own official sites, are now valued by
              third-party

              tracker Premier Alternatives at $1.2 billion (Aug 2025, 4.85x capital efficiency) and $1.4 billion (Mar
              2026,

              3.52x capital efficiency) respectively; Robotera also closed a further $200 million+ financing round in

              April-May 2026 led by SF Group with Sequoia China, IDG Capital, HSG, and CICC Capital participating. These

              third-party figures round out the direct-peer set with quantified comparables but remain estimates from an

              external tracker and wire-service sourcing, not company-confirmed disclosure.

              None of these comparisons is a clean apples-to-apples match: Unitree and AgiBot are hardware-shipment

              businesses, UBTECH mixes education/consumer/industrial revenue lines under HKD reporting, and DexForce's
              own

              coverage frames it as closer to a physical-AI infrastructure/platform business -- a category with no
              disclosed

              public comp found in any source reviewed for this chapter. Separately, Goldman Sachs research (via Taibo
              Financial) estimates global humanoid robot shipments of roughly 15,000-20,000 units in 2025 with
              several-fold growth expected in 2026-2027, providing external corroboration for the volume assumptions
              embedded in these comparables' revenue-multiple math.
