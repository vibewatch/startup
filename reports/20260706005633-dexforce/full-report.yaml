  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >
              DexForce's bull case rests on four pillars: a credible, multi-institution Series B (Shenzhen Capital

              Group, ICBC Capital, Qianhai Mother Fund, Lens Technology, Hengjian Capital) that crossed a RMB10 billion

              post-money valuation in June 2026; real commercial deployment evidence, including simultaneous multi-city

              kiosk launches; an independently-claimed world model benchmark placement (DexWorldModel's first-place

              WorldArena Track 2 finish); and a differentiated "physical-AI infrastructure" positioning that independent

              coverage compares to Scale AI or a domain-specific Nvidia Omniverse rather than to a hardware OEM. The

              anti-thesis is just as concrete. EmbodiedGlobal's own reporting on the Series B explicitly cautions that

              DexForce's headline figures should be treated as claims until third-party benchmarks are available. One

              Series B strategic investor, Lens Technology, reportedly invested only after first becoming a customer --
              a

              related-party dynamic the founder himself describes as "use it first, then invest." No source reviewed for

              this chapter discloses a cap table, liquidation-preference terms, customer-concentration breakdown, or

              independent safety certification, and no independent leaderboard corroborates the WorldArena claim. Two

              independent, sector-level voices -- a Beijing NDRC official warning of bubble risk across China's 150+

              humanoid entrants, and Morgan Stanley's own November 2025 note calling the 100,000-unit 2026 bull case "a
              lot

              further away than you think" -- apply directly to any diligence built on DexForce's self-reported
              momentum.

              Both the thesis and the anti-thesis are evidence-supported; the open question is which one the next 12-24

              months of disclosure resolves in DexForce's favor.
            claimRefs:
