        title: Switching Cost, Lock-In, Distribution Power, and Supply/Partner Access
        blocks:
          - type: paragraph
            body: >-
              DexForce's retail-kiosk channel is architected for low switching cost and fast operator payback -- the
              company reports a single-store revenue above RMB100,000 during the 2026 May Day holiday and a payback
              period as fast as six months -- which lowers the barrier for operator-partners to adopt but by the same
              logic lowers the barrier for a rival hardware maker to displace DexForce inside that same operator
              relationship once a cheaper or more capable robot is available. On the industrial side, DexForce's
              disclosed customers (Midea, CRRC, Wuling) reflect AI-model licensing and deployment rather than confirmed
              exclusive long-term contracts in the sources reviewed, which leaves switching cost and lock-in largely
              undocumented. Distribution power diverges sharply across the peer set: UBTECH's Hong Kong listing gives it
              direct capital-markets access and disclosure obligations DexForce does not yet have as a private,
              IPO-preparing company; Unitree's pending STAR Market listing would extend the same advantage; and AgiBot's
              order-driven, standardized manufacturing supply chain is credited by TrendForce with enabling its rapid
              2026 production scale-up in a way DexForce has not disclosed matching. On supply/partner access, Unitree
              self-manufactures over 90% of core hardware components (motors, reducers, lidar), giving it direct control
              over cost and supply during an industry-wide period of falling average selling prices; DexForce has not
              disclosed a comparable vertical-integration position, leaving its hardware cost structure and component
              supply chain as an open diligence question relative to peers that either manufacture in-house (Unitree) or
              have engineered a standardized external supply chain (AgiBot).
