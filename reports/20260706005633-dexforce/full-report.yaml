  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and heatmap
        blocks:
          - type: paragraph
            body: >-
              DexForce's risk profile spans five interlocking categories: regulatory/legal,
              operational/quality/security, partner/dependency, people/execution, and financial/model risk. The company
              is an early-stage, pre-IPO humanoid-robotics vendor operating inside a fast-moving PRC regulatory regime
              (a 2026 national standard system, a 2026 MIIT/SASAC special action, and China's first city-level
              embodied-AI law in Hangzhou), while its own commercial narrative rests heavily on self-reported, largely
              unaudited metrics: a single holiday-period revenue snapshot, an investor-sourced revenue figure, and a
              benchmark ranking on one external platform. This chapter treats DexForce's own claims skeptically where
              independent corroboration is absent, and draws heavily on adverse third-party sources -- Morgan Stanley's
              shipment-forecast note, an NDRC official's bubble-risk warning, and TrendForce's competitive-concentration
              data -- to stress-test the growth case. The heatmap below scores DexForce's ten highest-attention risks on
              likelihood, impact, and mitigation maturity; the most severe combinations of high likelihood, high impact,
              and low mitigation maturity concentrate in the absence of independent safety certification, the
              undocumented authentication posture of the joint-control API, and macro sector sentiment entirely outside
              DexForce's control.
            claimRefs:
              - CR001
              - CR002
              - CR005
