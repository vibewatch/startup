      - number: '7.6'
        title: Financial and business-model risk
        blocks:
          - type: paragraph
            body: >-
              DexForce has raised at least three disclosed funding rounds in roughly two years -- a 2024 strategic round
              led by Lenovo Capital, a mid-2025 A1/A2 round, and a June 2026 Series B at a post-money valuation
              exceeding RMB 10 billion -- a capital-intensive, pre-profitability trajectory typical of the sector but
              one that leaves the valuation resting on a self-reported, unaudited revenue base. Independent adverse
              sources complicate the growth case materially: Morgan Stanley forecasts China's 2026 humanoid shipments at
              roughly 12,000 units versus some industry projections exceeding 100,000, citing 'limited working
              capability' as the binding constraint, and does not expect the 100,000-unit mark to be crossed before
              2030; separately, a Beijing NDRC official publicly acknowledged in November 2025 that speed and bubble
              risk are live concerns for the sector, while Goldman Sachs was reported to have warned of overcapacity
              forming without actual orders. China Daily documents an active industry-wide price war (Unitree's R1 from
              RMB 26,900, Noetix's Bumi at RMB 9,998, Booster's K1 from RMB 29,900) that could compress achievable
              average selling prices across the sector, DexForce included, though no source benchmarks DexForce's own
              pricing against this trend. On disclosure standards, DexForce lags comparators that are further along the
              public-market path: Unitree's IPO filing discloses audited-style 2025 figures (~RMB 1.7B revenue, ~RMB
              600M net profit), and UBTECH's live HKEX-listed market capitalization is continuously observable, while
              DexForce, as a private company that has only stated IPO intent, discloses neither audited financials nor a
              public market valuation. A referenced HKEX filing tied to broader sector commentary also returned a 404
              error during this research run, blocking independent verification of that specific document. Separately,
              industry-wide 2026 monetization analysis documents AI companies broadly shifting from flat/seat-based
              pricing toward usage-based, token-based, and hybrid pricing models to align revenue with variable compute
              and hardware costs; DexForce discloses no public pricing or unit-economics model for its W1/W1 Pro
              deployments, leaving open whether its commercial model would withstand the same cost-alignment pressure.
              Unitree's valuation trajectory -- a $1.7 billion Series C round in mid-2025 followed by an IPO filing
              targeting an implied ~RMB 42 billion valuation less than a year later -- alongside UBTECH's continuously
              observable HKEX market capitalization, further illustrates a pace of public/private valuation re-rating
              among DexForce's most direct competitors that DexForce cannot be benchmarked against.
