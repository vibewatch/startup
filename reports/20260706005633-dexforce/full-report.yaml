  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Down round or flat extension
        - Any subsequent round priced at or below the >RMB10B Series B mark
        - Directly contradicts the financing-momentum pillar of the thesis
        - Downgrade to avoid; reassess entry price
      - - Disclosed customer concentration
        - Top customer/operator represents >30% of reported revenue
        - Undermines the "100+ customers, dozens of scenarios" scale narrative
        - Downgrade risk rating; request concentration detail before any commitment
      - - Kiosk-economics failure
        - Post-holiday-window operator revenue data show the claimed 4.6x lift is not sustained
        - Breaks the core commercial-deployment proof point
        - Downgrade valuation stance toward overvalued
      - - Benchmark reproduction failure
        - An independent WorldArena leaderboard entry contradicts or omits DexForce’s claimed first-place finish
        - Removes the strongest non-financial differentiation claim
        - Downgrade confidence; treat benchmark claim as unverified
      - - Certification denial or recall
        - Any safety-certification failure or product recall disclosed for the W1 Pro
        - Directly threatens commercial-deployment viability
        - Downgrade to avoid immediately
      - - Related-party concentration
        - >-
          Disclosure that Lens Technology or another customer-investor represents a disproportionate share of reported
          revenue
        - Confirms the anti-thesis concern about circular revenue/investment
        - Discount reported revenue base; reassess multiple
      - - Audited disclosure or IPO filing
        - Publication of audited financials or a STAR Market/HKEX-style prospectus
        - Would resolve most of this chapter’s open evidence gaps in either direction
        - Re-run this chapter’s analysis in full with the new disclosure
    notes: >-
      Triggers are framed as binary, monitorable events tied to specific disclosures rather than subjective sentiment
      shifts.
    claimRefs:
      - CV055
      - CV056
      - CV009
      - CV057
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited financials
        - Reconciled, audited revenue and profit/loss statements for FY2024-FY2026
        - Every valuation multiple in this chapter rests on unaudited, company-reported figures
        - Request directly from DexForce management or its auditor under an NDA
      - - Cap table and deal terms
        - Full cap table plus Series B instrument type, anti-dilution, and liquidation-preference terms
        - Determines true economic ownership and downside protection for any new investor
        - Request from DexForce or a participating Series B investor
      - - Customer concentration
        - Revenue breakdown by top customers/operators, including any investor-customer overlap (e.g., Lens Technology)
        - Tests whether reported scale reflects broad-based demand or a small number of related-party deals
        - Request customer-level revenue schedule from DexForce
      - - Independent certification
        - Safety/industrial certification records for the W1 Pro platform
        - Underwrites commercial-deployment risk independent of DexForce’s own safety disclaimers
        - Request from DexForce or search national certification registries
      - - Benchmark verification
        - Independent WorldArena Track 2 leaderboard confirmation
        - Validates the strongest non-financial technical differentiation claim
        - Contact WorldArena benchmark organizers directly
      - - Legal-entity verification
        - Registered-entity details from a China business registry (blocked on CNVerify at time of research)
        - Confirms basic legal identity and ownership structure ahead of any capital commitment
        - Retry via an alternative registry provider or in-country counsel
      - - Listing plan
        - Confirmed listing venue and timeline beyond general IPO-preparation language
        - Determines the realistic exit horizon for any pre-IPO investment
        - Monitor CSRC/STAR Market and HKEX filing indices; request directly from DexForce IR
    notes: >-
      Each ask maps to one of this chapter's evidenceGaps and is intended to be actionable within a single follow-up
      diligence cycle.
