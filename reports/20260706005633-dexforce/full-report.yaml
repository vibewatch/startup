      - number: '6.5'
        title: Expansion & Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              DexForce's near-term expansion driver is the "DexBot Inside" operator/franchise model: rather than selling
              hardware outright, DexForce licenses its embodied-AI brain to independent operators who run the
              retail-service business, and the company launched a nationwide operator-recruitment call immediately after
              publicizing the May 2026 launch-week economics. This is capital-light for DexForce, but it concentrates
              execution risk in operators the company does not control, and steady-state (post-promotion) unit economics
              for new operators are unproven. Three further concentration risks stand out. First, DexForce's single most
              quotable customer reference, Lens Technology, is also a Series B investor, so that reference is not an
              arm's-length data point. Second, TrendForce's industry-level data shows Unitree and AgiBot alone capturing
              nearly 80% of China's 2026 humanoid-robot shipment volume, while Unitree (raised at a much larger scale)
              and UBTech (publicly listed, reporting RMB2,001 million in FY2025 revenue) both dwarf DexForce's
              independently reported RMB100 million-plus annualized revenue — meaning DexForce competes for a small
              residual share against far better-capitalized rivals. Third, essentially all of the named customer proof
              this chapter could assemble clusters around a single Series B funding announcement or a single trade-show
              signing event, rather than a broad, independently sourced customer roster, which risks overstating the
              breadth of durable demand relative to a company with a fully independent reference base. DexForce has also
              stated an intent to pursue an IPO, which would eventually force fuller customer-concentration disclosure
              but provides no such visibility today.
