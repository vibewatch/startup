  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Framing the Landscape: Direct Peers, Incumbents, Adjacents, Substitutes, and Internal Build'
        blocks:
          - type: paragraph
            body: >-
              DexForce sits inside a crowded, regulator-flagged Chinese humanoid and embodied-intelligence sector. A
              Beijing NDRC official said in November 2025 that more than 150 Chinese companies were making humanoid
              robots, with over half being startups or cross-industry entrants, and warned of bubble and overcapacity
              risk from repetitive, undifferentiated products. Within that population, this chapter treats five
              companies as direct peers on capability and go-to-market grounds -- Unitree Robotics, AgiBot, UBTECH
              Robotics, Fourier Intelligence, and Robotera -- because each ships or is developing a general-purpose
              humanoid or embodied-intelligence platform for industrial, commercial, or consumer deployment. Boston
              Dynamics' Atlas (already in commercial deployment) and Tesla's planned Optimus Gen 3 mass production sit
              one layer out as adjacent global incumbents that TrendForce explicitly tracks against the China cohort.
              Two further layers matter for DexForce specifically: status-quo substitutes -- traditional fixed-position
              industrial automation and human staffing, both of which DexForce's own retail kiosks and industrial
              deployments are trying to displace -- and internal build, since large industrial customers such as Midea,
              CRRC, and Wuling could in principle develop in-house robotics/automation capability rather than licensing
              DexForce's models. Likely entrants include the wave of sub-RMB30,000 consumer humanoid makers (Noetix,
              Booster, Astribot) that China Daily reports are pushing prices down industry-wide, a commoditization
              dynamic that could eventually reach DexForce's higher-priced wheeled-humanoid category.
