      - number: '7.5'
        title: People and execution risk
        blocks:
          - type: paragraph
            body: >-
              DexForce discloses relatively little about its organization beyond its founder and a general team
              description. The company's careers page describes a core team drawn from MIT, NTU, NUS, KAIST, Tsinghua,
              and Zhejiang University, with R&D staff exceeding 70% of headcount, but does not disclose total headcount,
              attrition, or named executives beyond founder Professor Jia Kui of CUHK-Shenzhen. This creates a
              key-person concentration risk typical of early-stage deep-tech ventures. Talent competition is intense
              industry-wide: the HEIS national-standard-drafting committee itself draws senior personnel from Unitree
              and AgiBot, DexForce's two largest-volume rivals, competing for the same scarce pool of senior
              humanoid-robotics engineers. On the financial-execution side, the only independently reported revenue
              figure for DexForce -- 'hundred-million-RMB-level' as of mid-2025 -- traces to a single investor quote
              (Lenovo Capital's investment lead, citing 100+ paying customers) repeated across two Chinese
              financial-media outlets covering the same funding-round press cycle, rather than to an independent audit.
              DexForce's stated near-term use of Series B proceeds -- world-model iteration, physics-engine upgrade,
              data infrastructure, and humanoid-capability completion -- implies continued reliance on R&D and
              field-deployment headcount growth well ahead of any disclosed revenue run-rate sufficient to self-fund
