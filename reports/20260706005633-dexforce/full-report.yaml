    DexForce was founded in Shenzhen in June 2021 and positions itself as a full-stack physical-AI company rather than
    only a humanoid OEM. Public materials consistently tie the company to a Sim2Real workflow built around EmbodiChain,
    DexVerse, DexWorldModel, and W1/W1 Pro robots for industrial manipulation, retail-service kiosks, and
    research/education workflows. Independent and company-linked sources support that DexForce reached 100+ enterprise
