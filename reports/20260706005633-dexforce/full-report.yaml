            title: Every revenue figure behind the >RMB10B mark is unaudited
            body: >-
              EmbodiedGlobal's own Series B coverage explicitly states DexForce's headline figures "should be treated as
              claims until third-party benchmarks are available," and no source reconciles the A1/A2, H1 2026, and
              FY2026-guidance revenue figures into one audited number.
            calloutType: risk
