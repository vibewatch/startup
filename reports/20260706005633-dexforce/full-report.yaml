    title: 'Risk transmission map: how individual risks compound into valuation'
    type: dag
    layout: wide
    summary: >-
      How DexForce's regulatory, operational, and financial risk factors transmit through safety, trust, procurement,
      and financing channels into overall valuation and thesis durability.
    data:
      nodes:
