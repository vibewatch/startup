  topStrengths:
    - DexForce combines simulation, world-model, data-pipeline, perception, and humanoid assets in one embodied-AI stack rather than depending on a single hardware SKU.
    - The company has attracted heavyweight state, industrial, and strategic capital, culminating in a June 2026 RMB1 billion Series B above the unicorn threshold.
    - Public evidence supports real deployment activity across industrial and retail-service scenarios, including 100+ enterprise customers by mid-2025 and a documented May 2026 multi-city kiosk rollout.
    - DexForce's Sim2Real and world-model positioning is differentiated enough to win external attention, including a first-place WorldArena Track 2 claim and open-source EmbodiChain distribution.
  topRisks:
    - Most operating metrics remain self-reported or lightly corroborated, with no audited revenue, gross margin, cash balance, or cap-table disclosure.
    - Named customer proof is sparse relative to claimed scale, and several marquee references rely on single-outlet or company-mediated reporting.
    - The >RMB10 billion valuation implies aggressive revenue and execution expectations for a hardware- and deployment-heavy business whose unit economics are still opaque.
    - Commercial-service kiosk economics are based on holiday-period company claims that have not been independently verified outside a narrow set of flagship sites.
    - DexForce faces an intensely competitive China humanoid market where Unitree, AgiBot, UBTECH, and other better-capitalized peers are scaling quickly.
  unresolvedGaps:
    - Audited 2025 and H1 2026 revenue, plus a reconciled FY2026 revenue guide and any margin disclosure.
    - Customer concentration, renewal/churn, contract duration, and independent confirmation from named logos such as Midea, CRRC, Wuling, Huawei, or Lens Technology.
    - Full cap table, board/governance rights, liquidation preferences, and whether IPO preparation has advanced beyond media statements.
    - Independent safety, reliability, and certification data for W1/W1 Pro deployments, including uptime and field-failure rates.
    - Shipment and deployment methodology tying together 100+ enterprise customers, 1,000+ or 1,500+ projects, and 1,500+ embodied models.
