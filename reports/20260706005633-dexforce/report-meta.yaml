companyProfile:
  summary: >-
    DexForce was founded in Shenzhen in June 2021 and positions itself as a full-stack physical-AI
    company rather than only a humanoid OEM. Public materials consistently tie the company to a
    Sim2Real workflow built around EmbodiChain, DexVerse, DexWorldModel, and W1/W1 Pro robots for
    industrial manipulation, retail-service kiosks, and research/education workflows. Independent
    and company-linked sources support that DexForce reached 100+ enterprise customers by mid-2025,
    booked roughly RMB100 million in H1 2026 revenue, and raised a RMB1 billion Series B above a
    RMB10 billion valuation in June 2026. However, most of the economic, customer-quality, and
    governance details required for conviction underwriting remain private or self-reported.
  foundedDate: '2021-06-15'
  founders:
