  topStrengths:
    - DexForce 把仿真、世界模型、数据管线、感知和人形机器人资产拼进同一个具身 AI 技术栈，而不是押注单一硬件 SKU。
    - 公司吸引了重量级国资、产业资本和战略资本，并在 2026 年 6 月完成 RMB1 billion Series B，估值跨过独角兽门槛。
    - 公开证据支持其在工业和零售服务场景真实落地，包括截至 2025 年中 100+ 企业客户，以及 2026 年 5 月有记录的多城市 kiosk 铺设。
    - DexForce 的 Sim2Real 和世界模型定位足够差异化，已经获得外部关注，包括 WorldArena Track 2 第一名主张和开源 EmbodiChain 分发。
  topRisks:
    - 多数运营指标仍由公司自报或只有轻度佐证，审计收入、毛利率、现金余额和股权结构表均未披露。
    - 相比公司声称的规模，具名客户证明偏少，几个明星案例还依赖单店或公司转述报道。
    - '>RMB10 billion 估值隐含激进收入和执行预期，但这是一门硬件和部署都很重的生意，单位经济性仍不透明。'
    - 商业服务 kiosk 经济性依赖公司在假期期间的说法，除少数旗舰点位外尚未独立验证。
    - 中国人形机器人市场竞争激烈，Unitree、AgiBot、UBTECH 等资金更厚的同行正在快速扩张，DexForce 必须直面它们。
  unresolvedGaps:
    - 2025 年和 2026 年 H1 审计收入、经核对的 FY2026 收入指引，以及任何利润率披露。
    - 客户集中度、续约 / 流失、合同期限，以及来自 Midea、CRRC、Wuling、Huawei、Lens Technology 等具名客户的独立确认。
    - 完整股权结构表、董事会 / 治理权、清算优先权，以及 IPO 准备是否已经越过媒体表述阶段。
    - W1 / W1 Pro 部署的独立安全、可靠性和认证数据，包括在线率和现场故障率。
    - 能把 100+ 企业客户、1,000+ 或 1,500+ 项目、1,500+ 具身模型串起来的出货和部署口径。
