- id: TR006
  title: Mitigation and kill-criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory/certification risk
    - Independent safety certification status
    - No CE/UL/ISO-equivalent certification obtained within 12 months of first mass-market
      retail/hospitality deployment
    - Escalate diligence hold; require a certification roadmap as a funding condition
  - - Operational/security risk
    - Joint-control API authentication disclosure
    - No published authentication/access-control mechanism disclosed before wider
      multi-site rollout
    - Require an independent security audit before proceeding
  - - Partner/dependency risk
    - Named operator renewal
    - Any disclosed launch-city operator fails to renew or is not replaced within
      2 quarters
    - Treat revenue proof-points as unproven; discount the growth case
  - - People/execution risk
    - Headcount/attrition disclosure
    - Company continues withholding basic headcount and attrition data through the
      next funding round
    - Downgrade execution-capacity confidence; request as a condition of participation
  - - Financial/model risk
    - Independent audit of revenue
    - No independently audited revenue or unit-economics disclosure prior to any Series
      C or pre-IPO round
    - Do not underwrite valuation on self-reported figures; require an audit as a
      closing condition
  - - Financial/model risk (sector)
    - China 2026 humanoid shipment data (TrendForce/Morgan Stanley trackers)
    - Actual 2026 shipments land materially below the ~12,000-unit conservative forecast
    - Treat as evidence of a broader sector demand-timing miss; reassess DexForce's
      growth assumptions
  - - Regulatory/legal risk (state program)
    - Provincial scenario-unit allocation confirmation
    - DexForce is not named/confirmed as a participating scenario unit in any province
      by end of 2026
    - Reduce weight placed on state-program-driven upside in the base case
  - - Financial/model risk (valuation)
    - Follow-on round investor composition
    - Next round is led/anchored again exclusively by state-linked or repeat existing
      investors with no new independent/international lead
    - Treat as a signal of limited external validation; increase the valuation discount
  notes: Triggers are designed to be observable from public disclosures, press coverage,
    or direct diligence requests without requiring DexForce's cooperation.
