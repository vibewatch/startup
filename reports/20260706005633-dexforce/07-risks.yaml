callouts:
- calloutType: risk
  title: No independent safety certification disclosed for a robot already deployed
    unsupervised in public
  body: DexForce's own W1 user manual states the robot has not passed medical-safety
    certification, and no reviewed source discloses any CE/UL/ISO-equivalent independent
    industrial safety certification -- yet independent coverage reports a W1 Pro unit
    operating fully autonomously, unsupervised, in a Shenzhen convenience store preparing
    food for customers.
  claimRefs:
  - CR012
  - CR014
  - CR021
- calloutType: risk
  title: Joint-control API documentation describes no authentication or access-control
    mechanism
  body: The Humanoid API (v0.4.0) exposes ROS2 topics and services for real-time joint-level
    state and position-mode control without any documented authentication, authorization,
    or access-control layer -- a meaningful security gap for a system capable of directly
    commanding a physical robot's joints.
  claimRefs:
  - CR017
- calloutType: risk
  title: Valuation rests on a self-reported, unaudited revenue figure amid explicit
    sector bubble-risk warnings
  body: DexForce's only independently reported revenue figure ('hundred-million-RMB-level')
    traces to a single investor quote from the same funding-round press cycle that
    produced its >RMB 10 billion valuation. Independently, a Beijing NDRC official
    has publicly acknowledged bubble-risk concerns for the sector, and Morgan Stanley
    forecasts far lower 2026 China shipment volumes than some industry projections.
  claimRefs:
  - CR040
  - CR046
  - CR047
  - CR048
- calloutType: assumption
  title: Capital-provider base is highly concentrated among repeat state-linked and
    strategic investors
  body: Shenzhen Capital Group, the Guiyang Digital Economy Fund, and Lenovo Capital
    recur across DexForce's 2024 strategic round, mid-2025 A1/A2 round, and June 2026
    Series B, alongside new entrants such as Qianhai Mother Fund and ICBC Capital
    -- a pattern that should be treated as a financing-availability dependency rather
    than diversified institutional validation.
  claimRefs:
  - CR030
  - CR031
- calloutType: recommendation
  title: Prioritize five diligence asks before increasing conviction
  body: Request (1) a certification roadmap for independent safety certification,
    (2) the joint-control API's authentication/access-control design, (3) audited
    or reviewed financial statements, (4) current headcount and attrition data, and
    (5) confirmation of DexForce's status as a named MIIT/SASAC scenario-unit participant
    -- each closes one of the chapter's most material evidence gaps.
  claimRefs:
  - CR052
  - CR053
