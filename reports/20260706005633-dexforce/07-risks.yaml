- id: partner-dependency-risk
  title: Partner and dependency risk
  body: 'DexForce''s commercialization story depends on a concentrated set of external
    nodes it does not directly control. Its commercial-service revenue narrative rests
    on third-party site operators across a handful of named cities, and the company
    states it is actively recruiting more operators nationwide -- meaning operator
    churn or non-renewal would directly undercut the revenue proof-points cited in
    its own press releases. Its capital base shows a consistent pattern of state-linked
    and strategic investors recurring across rounds: Shenzhen Capital Group, the Guiyang
    Digital Economy Fund, and Lenovo Capital reappear from the 2024 strategic round
    through the mid-2025 A1/A2 round to the June 2026 Series B (alongside new entrants
    such as Qianhai Mother Fund and ICBC Capital), a concentration that leaves financing
    exposed to any shift in state investment priorities. DexForce''s flagship DexWorldModel
    benchmark claim depends on a single external evaluation platform (WorldArena)
    whose methodology was not independently retrieved in this research. Participation
    in the MIIT/SASAC 2026 special action offers a potential validation channel, but
    no source confirms DexForce as a named scenario-unit participant in any province.
    Finally, TrendForce forecasts Unitree and AgiBot alone will capture nearly 80%
    of 2026 China humanoid shipments, concentrating industry volume and regulatory
    attention on two rivals rather than DexForce. Independent trade press corroborates
    this concentration in production terms: AgiBot rolled its 15,000th cumulative
    unit off the line by June 2026, scaling from 5,000 to 10,000 to 15,000 units
    within roughly three years of its founding, a manufacturing-scale pace DexForce
    has disclosed no comparable milestone against.'
