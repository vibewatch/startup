- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - National embodied-AI strategic priority with land/office subsidies and favorable
      lending
    - Driver
    - Current, 2024-2030 five-year horizon
    - Lowers cost of capital and site setup for embodied-AI companies, including DexForce
    - Confirm which of DexForce's specific sites or rounds have received named government
      subsidy or lending support
  - - MIIT/SASAC 2026 real-scenario training action with explicit ten-thousand-unit-scale
      deployment goal
    - Driver
    - Through end of 2026
    - Creates a structured, policy-backed path from pilot to normalized deployment
      that DexForce can plug into via consortiums
    - Verify whether DexForce is a named participant/lead unit in any provincial or
      central-SOE scenario unit
  - - National standard system for humanoid robots and embodied AI (HEIS, Mar 2026)
    - Driver
    - Released Mar 2026, phased rollout
    - Reduces integration and compliance uncertainty for buyers by standardizing safety,
      application, and lifecycle requirements
    - Check DexForce's compliance roadmap against the six standard pillars, especially
      safety and ethics
  - - Hangzhou's binding embodied-AI robotics regulation (effective May 2026)
    - Driver
    - Effective May 2026, local scope
    - First legally binding local framework may become a template other provinces
      copy, reducing long-run legal ambiguity
    - Track whether similar binding legislation is drafted in Shenzhen/Guangdong,
      where DexForce is headquartered
  - - Falling average selling prices and production costs via NEV-supply-chain leverage
    - Driver
    - Current, ongoing since 2023
    - Improves buyer ROI case and shortens payback periods across industrial and commercial
      deployments
    - Obtain DexForce's own bill-of-materials or ASP trend if disclosed, for comparison
      with Unitree's published cost curve
  - - Manufacturing, logistics, and retail automation demand shifting from trial to
      real orders
    - Driver
    - Current, accelerating in 2H2026 per TrendForce
    - Expands the addressable order pipeline beyond demonstration pilots
    - Ask for DexForce's order backlog or contracted-vs-piloted scenario split
  - - Limited working capability and unresolved brain/VLA model and hardware-quality
      consistency
    - Constraint
    - Current, per Morgan Stanley Nov 2025 note
    - Caps how fast pilots convert into large, repeatable deployments regardless of
      policy support
    - Request DexForce's task success-rate and failure-mode data from its own real-scenario
      deployments
  - - Safety, reliability, and lifecycle-management standards still being built out
    - Constraint
    - Current through 2026-2027
    - Slows scale deployment in mixed human-robot environments until certification
      pathways mature
    - Confirm DexForce's collision-detection, force-limiting, and 'black box' safety
      feature status against MIIT's stated requirements
  - - Bubble-risk and overcapacity warnings from NDRC and Goldman Sachs
    - Constraint
    - Flagged Nov 2025, ongoing
    - Signals a real risk that capital and production capacity are running ahead of
      realized order volume across the sector
    - Compare DexForce's disclosed order/pipeline data against its production and
      hiring pace
  - - Fragmented, non-uniform regulatory landscape (policy plans vs. binding law vary
      by city)
    - Constraint
    - Current, evolving through 2026+
    - Companies operating across multiple provinces face inconsistent compliance and
      subsidy regimes
    - Map which of DexForce's operating provinces have binding rules versus non-binding
      plans
  - - Reliance on operator/franchisee network for commercial-kiosk unit economics
    - Constraint
    - Current, ongoing
    - DexForce's own reported payback and revenue-uplift figures are self-disclosed
      and depend on operator execution quality
    - Seek an independent operator reference check or audited revenue data for at
      least one kiosk cohort
  - - Intense global competition (Tesla Optimus, Boston Dynamics Atlas, Figure AI,
      1X) alongside domestic rivals Unitree, AgiBot, UBTECH
    - Constraint
    - Current, intensifying through 2026-2027
    - Pressures pricing and export ambitions even for well-funded Chinese players
    - Assess DexForce's differentiation claims (DexWorldModel, DexVerse) against competitor
      roadmaps in the companion competitors chapter
  notes: Directions are classified as the reviewed sources describe them; several
    items (e.g., falling prices, standards releases) simultaneously drive adoption
    while also revealing how immature the underlying safety and reliability base still
    is.
