- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer / budget owner
  - Workflow
  - Adoption trigger
  rows:
  - - Industrial manufacturing (auto parts, NEV, 3C, aerospace, chemicals)
    - Plant operations / manufacturing-engineering leadership, often inside an MIIT/SASAC-organized
      innovation consortium
    - Line workers and process/quality engineers
    - Factory automation capex, partly matched by provincial or central-SOE real-scenario
      training funding
    - Flexible sorting, assembly, and dexterous manipulation tasks validated inside
      a designated real-scenario training space
    - A completed application-verification report showing acceptable success rate,
      reliability, and economics for the scenario
  - - Logistics and warehousing
    - Warehouse/3PL operations leadership
    - Warehouse operators and pickers
    - Logistics capex or outsourced-service budget
    - Embodied picking, sorting, and transport in unstructured warehouse layouts
    - Demonstrated throughput and error-rate improvement versus existing automation
      or manual labor
  - - Commercial retail & tourism kiosk
    - Local operator/franchisee ('运营商') recruited nationally by DexForce
    - Walk-in consumers at malls, theme parks, and scenic/tourism sites
    - Operator capex/lease, with landlord or scenic-area revenue share
    - 7x24 autonomous food/beverage prep, retail, and interactive tourism engagement
    - Fast payback (DexForce cites as fast as 6 months) and measurable footfall/revenue
      uplift versus a staffed store
  - - Government / central-SOE real-scenario demonstration
    - Provincial industrial authorities and central state-owned enterprises named
      in the MIIT/SASAC 2026 notice
    - Designated 'user units' hosting the training space (factories, service sites,
      emergency-response stations)
    - Government and SOE demonstration budgets, with policy-driven quotas (>=20 scenarios/province,
      >=10/central SOE)
    - Real-scenario training, data collection, and validation ahead of normalized
      deployment
    - Meeting the 2026 policy quota and producing a replicable operating playbook
      for wider rollout
  - - Catering / food-service
    - Franchise or chain food-service operator
    - Customers ordering food/beverages
    - Franchise capex or DexForce-operator revenue share
    - Autonomous meal prep, heating, and delivery in a small-format store
    - Labor-cost relief during peak hours and demonstrated food-safety/quality consistency
  - - Healthcare and education (emerging, lighter exposure)
    - Hospital administration or education-technology budget holder
    - Patients, students, or care staff
    - Institutional procurement or pilot-grant budget
    - Assistive or educational embodied-AI use cases named among DexForce's 50+ scenarios
    - Regulatory clearance and successful narrow-scope pilot; least mature of the
      six segments
  notes: Buyer/payer roles for the industrial and government-demonstration segments
