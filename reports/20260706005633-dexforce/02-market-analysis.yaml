  - CM014
  - CM015
- calloutType: risk
  title: Bubble and overcapacity warnings are coming from inside the industry
  body: A Beijing NDRC official and Goldman Sachs have both flagged bubble/overcapacity
    risk given 150+ Chinese humanoid makers and production scaling ahead of confirmed
    orders, which should temper any single bullish market-size headline.
  claimRefs:
  - CM050
  - CM051
  - CM052
