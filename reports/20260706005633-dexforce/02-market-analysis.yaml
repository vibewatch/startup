company:
  name: DexForce
chapter:
  number: 2
  title: Market Analysis
  summary: 'DexForce sells into two distinct markets under one embodied-AI engine:
    industrial embodied-AI deployment across manufacturing/logistics verticals and
    a commercial-service kiosk business in retail and tourism. Public sizing for China''s
    humanoid/embodied-AI market is unusually contradictory -- Morgan Stanley alone
    moved its own 2026 shipment forecast from 12,000 to 50,000 units within seven
    months, and separate output, revenue, and regional-cluster lenses diverge further
    still -- so this chapter treats every broad market number as a contested estimate
    and keeps DexForce''s own SOM as an explicit, low-confidence gap rather than a
    precise figure.'
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary and Status-Quo Substitutes
  body: 'DexForce is best understood not as a single-product humanoid maker but as
    a generalized embodied-AI ''brain'' company that licenses a common perception,
    simulation, and control stack (DexVerse, DexWorldModel, DexAgent, DexSense, DexBrain)
    across two distinct commercial motions: industrial embodied-AI deployment for
    flexible sorting, assembly, and material handling across auto parts, new-energy
    vehicles, 3C electronics, aerospace, logistics, and chemicals, and a commercial-service
    kiosk business that puts W1 Pro humanoids into convenience stores, malls, theme
    parks, and tourism landmarks to prepare food, sell retail goods, and interact
    with visitors. A third, smaller adjacency is DexForce''s legacy machine-vision/industrial-3D-camera
    line, which serves a related but distinct quality-control buyer. The market boundary
    therefore includes embodied-AI hardware, foundation-model/software licensing,
    and robot-as-a-service kiosk operations, and excludes traditional fixed-purpose
    industrial robot arms and cobots that lack embodied generalization, generic factory-automation
    capex, and consumer/education robot toys with no embodied-AI engine. The status-quo
    substitute for most of DexForce''s target tasks is simply human labor: line workers
    and process engineers in manufacturing, and staffed retail/food-service employees
    in the commercial-kiosk segment. DexForce also competes for the same budgets as
    more than 140 domestic humanoid manufacturers that released over 330 models in
    2025, including Unitree and AgiBot, whose 2025 disclosures show humanoid revenue
    only recently overtook quadruped-robot revenue for the segment leader -- a reminder
    that even the most commercially advanced peer''s humanoid-specific revenue base
    is very young.'
