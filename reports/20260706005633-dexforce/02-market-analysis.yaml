- id: growth-drivers-and-adoption-constraints
  title: Growth Drivers and Adoption Constraints
  body: 'Growth drivers are converging from policy, cost, and demand simultaneously.
    Beijing has named embodied AI a five-year strategic priority, directing subsidized
    land/office space and favorable bank lending; MIIT and SASAC''s 2026 real-scenario
    training action gives that priority a concrete, quota-driven deployment path;
    China''s first national standard system for humanoid robots and embodied AI, spanning
    safety, application, and lifecycle-management pillars, was released in March 2026
    after collaboration among more than 120 institutions, reducing integration and
    compliance uncertainty; and Hangzhou''s binding local regulation, effective May
    2026, is the first legally defined framework for the sector and could become a
    template other provinces copy. On the cost side, falling average selling prices
    (Unitree''s own ASP fell roughly 72% from 2023 to the first three quarters of
    2025) and greater in-house component production, leveraging shared supply chains
    with China''s new-energy-vehicle industry, are improving buyer ROI economics across
    both industrial and commercial deployments. TrendForce reports growing 2026 orders
    from automotive manufacturing, consumer electronics, and logistics as trial adoption
    shifts to real demand. The constraints are just as material. Morgan Stanley''s
    own November 2025 note flagged ''limited working capability'' -- brain/VLA model
    and training-data gaps, body-component quality-consistency issues, and price/cost
    pressure -- as the binding constraint on near-term adoption, and MIIT''s own 2026
    notice explicitly calls for building out collision-detection, force-control, emergency-braking,
    and safety-recording capability that is not yet mature. A Beijing NDRC official
    and Goldman Sachs have both separately warned of bubble and overcapacity risk
    given more than 150 Chinese humanoid companies (over half startups or cross-industry
    entrants) and production scaling ahead of confirmed order volume. Regulatory maturity
    is also uneven: only Hangzhou has binding local legislation so far, while most
    other regions rely on non-binding strategic plans or subsidized pilot programs,
    and intense global competition from Tesla Optimus, Boston Dynamics Atlas, Figure
    AI, and 1X, alongside domestic rivals Unitree, AgiBot, and UBTECH, adds pricing
    and execution pressure even for well-funded Chinese players such as DexForce.'
