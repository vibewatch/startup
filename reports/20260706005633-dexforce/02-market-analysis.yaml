  title: DexForce's kiosk unit economics are still self-disclosed
  body: DexForce's payback-period, revenue-uplift, and footfall figures for its commercial-service
    kiosks come only from its own press releases; treat them as company claims pending
    independent operator or audited-revenue corroboration.
  claimRefs:
  - CM034
  - CM035
  - CM036
