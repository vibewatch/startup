tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - DexForce relevance
  rows:
  - - Industrial embodied-AI / humanoid deployment (manufacturing)
    - Humanoid/embodied robot hardware, foundation-model licensing, integration services
      for flexible sorting, assembly, and material handling across auto parts, NEV,
      3C electronics, aerospace, and chemicals
    - Traditional fixed-purpose industrial robot arms/cobots with no embodied generalization;
      raw factory-automation capex unrelated to embodied AI
    - Plant operations / manufacturing-engineering budget owner, often co-funded through
      provincial or SOE real-scenario training programs
    - Core market DexForce already serves via 1,500+ deployed embodied models
  - - Logistics and warehousing automation
    - Embodied picking, sorting, and material-transport tasks in warehouses and distribution
      centers
    - Fixed conveyor/AGV infrastructure with no embodied-AI decision layer
    - Logistics operations budget owner or 3PL operator
    - Named as a 2026 growth vertical by TrendForce; adjacent to DexForce's existing
      logistics scenario coverage
  - - Commercial-service / retail & tourism kiosk deployment
    - Robot-as-a-service kiosks for food/beverage prep, retail, and interactive tourism
      experiences, plus the operator network needed to run them
    - Traditional staffed retail/F&B labor and fixed vending-machine hardware with
      no embodied-AI adaptability
    - Local operator/franchisee ('运营商') recruited by DexForce; landlord/scenic-area
      partner shares revenue
    - Second core market; DexForce's own case data (10+ kiosks, 100k+ visitors) sits
      here
  - - Embodied-AI foundation model / simulation software licensing
    - DexVerse simulation engine, DexWorldModel, and related software licensed or
      bundled with hardware
    - General-purpose cloud compute or generic computer-vision SDKs with no embodied/physical-world
      grounding
    - Robot OEMs, integrators, or DexForce's own hardware business unit
    - DexForce's stated long-term differentiation and moat argument
  - - Adjacent machine-vision / industrial 3D camera market
    - Structured-light/3D camera hardware for industrial inspection and guidance sold
      under the DexForce Vision brand
    - General consumer camera hardware and unrelated computer-vision research spend
    - Machine-vision integrators and industrial quality-control budget owners
    - Legacy adjacency; distinct customer and budget line from the humanoid business
  - - 'Excluded: consumer/education robot toys and generic security robots'
    - Not counted in this market boundary
    - Consumer-grade robot toys, telepresence robots, and rule-based security patrol
      robots without embodied generalization
    - Consumer or campus-security budget
    - Explicitly out of scope; DexForce does not target this segment
  notes: Included/excluded boundaries follow DexForce's own stated scenario coverage
    (SM020) and TrendForce's industry framing (SM001); the machine-vision line and
    the humanoid/embodied-AI line are treated as separate rows because they serve
    different buyers even though both trade under the DexForce brand.
