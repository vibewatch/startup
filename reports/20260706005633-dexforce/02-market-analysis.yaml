  evidenceGaps:
  - type: missing-source
    severity: material
    topic: dexforce-som-isolation
    missingEvidence: A bottom-up public estimate or management disclosure isolating
      DexForce's own serviceable-obtainable market across its industrial and commercial-kiosk
      verticals.
    whyItMatters: Without it, DexForce's SOM remains an author-bounded, low-confidence
      range rather than an auditable figure, which limits how precisely the opportunity
      can be sized for underwriting.
    diligencePath: Request DexForce management's internal TAM/SAM/SOM model, current
      scenario-by-scenario revenue split, and win-rate assumptions against Unitree,
      AgiBot, and UBTECH.
    relatedQuestionRefs:
    - QM013
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: kiosk-independent-corroboration
    missingEvidence: Independent, audited, or third-party-verified data on DexForce's
      commercial-service kiosk payback periods, revenue uplift, and footfall impact.
    whyItMatters: All current unit-economics evidence for the retail/tourism vertical
      originates from DexForce's own press releases, so the reported 6-month payback
      and 4.6x revenue uplift cannot yet be independently verified.
    diligencePath: Interview at least one independent kiosk operator directly, or
      obtain audited store-level revenue data for a representative cohort of deployed
      sites.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: material
    topic: china-humanoid-market-size-contradiction
    missingEvidence: A reconciled, methodology-consistent estimate of China's 2026
      humanoid robot market that resolves the gap between Morgan Stanley's external-sales
      shipment lens (50,000 units / $2B), GGII's production-output lens (100,000-200,000
      units), and Leaderobot's 2025 revenue estimate ($11.6B).
    whyItMatters: Valuation and market-opportunity judgments about any China-based
      humanoid or embodied-AI company, including DexForce, depend heavily on which
      lens is used, and the lenses currently disagree by a factor of roughly 2x-16x.
    diligencePath: Commission or locate a bottom-up analyst reconciliation that separates
      external shipments, internal/prototype units, and total industrial output value
      on a single consistent basis.
