- id: FM003
  title: Buyer / segment map
  type: matrix
  layout: wide
  summary: DexForce's buying motion spans plant-operations, logistics, commercial-kiosk-operator,
    and government/SOE-consortium personas rather than one universal buyer.
  data:
    columns:
    - Primary user
    - Payer / budget owner
    - Adoption trigger
    - Preferred adoption path
    rows:
    - label: Industrial manufacturing
      values:
      - Line workers and process/quality engineers
      - Factory automation capex, partly matched by provincial/SOE training funds
      - Completed application-verification report showing acceptable success rate
        and reliability
      - Join an MIIT/SASAC-organized innovation consortium, then scale within the
        same scenario type
    - label: Logistics and warehousing
      values:
      - Warehouse operators and pickers
      - Logistics capex or outsourced-service budget
      - Demonstrated throughput and error-rate improvement
      - Pilot in one facility before multi-site rollout
    - label: Commercial retail & tourism kiosk
      values:
      - Walk-in consumers at malls, theme parks, and scenic sites
      - Local operator/franchisee capex, with landlord/scenic-area revenue share
      - Fast payback (DexForce cites as fast as 6 months) and footfall/revenue uplift
      - Operator recruitment, single-site launch, then multi-city replication
    - label: Government / central-SOE demonstration
      values:
      - Designated user units hosting the training space
      - Government and SOE demonstration budgets under 2026 policy quotas
      - Meeting the >=20 scenarios/province or >=10/central-SOE 2026 quota
      - Validate one scenario, then deploy a batch, then drive a cluster ('验证一个、部署一批、带动一片')
  approximationNotes: The government/SOE demonstration and commercial-kiosk columns
    are triggered by fundamentally different mechanisms -- a top-down policy quota
    versus bottom-up operator payback economics (CM054) -- rather than a single uniform
    adoption trigger.
  claimRefs:
  - CM029
  - CM030
  - CM031
  - CM032
  - CM033
  - CM034
  - CM054
- id: FM004
  title: Adoption funnel or value-chain map
  type: funnel
  layout: standard
  summary: MIIT's 2026 real-scenario training program converts pilots into normalized
    deployment through four sequential stages rather than a single purchase decision.
  data:
    items:
    - label: Scenario unit selected and innovation consortium formed
      value: 100
      unit: index
    - label: Real-scenario training and task-skill package developed
      value: 65
      unit: index
    - label: Application-verification report issued (success rate, reliability, economics)
      value: 35
      unit: index
    - label: Normalized deployment and scale-out across similar scenarios/regions
      value: 15
      unit: index
  approximationNotes: Stage values are ordinal indices reflecting the sequential funnel
    described in MIIT's 2026 notice, not volumetric conversion-rate data, because
    no public source discloses how many scenario units actually progress from one
    stage to the next.
  claimRefs:
  - CM029
  - CM030
  - CM047
callouts:
- calloutType: risk
  title: Same bank, four-fold forecast swing
  body: Morgan Stanley's own China 2026 humanoid shipment forecast moved from 12,000
    units (Nov 2025) to 50,000 units (Jun 2026), a reminder that even primary-tier
    analyst numbers for this market should be treated as moving targets rather than
    settled facts.
