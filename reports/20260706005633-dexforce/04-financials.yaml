- id: SEC-I-3
  title: Cost Structure, Gross-Margin Drivers, and Capital Expenditure
  body: 'DexForce discloses no gross margin, cost of goods sold, or capital expenditure
    figures in any located source. Its own hardware specifications (dual 7-DOF arms
    rated 10kg payload each at ±0.5mm precision, dual onboard computers rated at or
    above 300 TOPS, 8+ hours of wired continuous operation) imply a cost structure
    dominated by precision actuation, compute silicon, and sensing components consistent
    with the broader humanoid-robotics category, but no bill-of-materials or supplier
    cost data is available to quantify this for DexForce specifically. In the absence
    of DexForce-specific disclosure, this chapter triangulates plausible margin and
    capex ranges from two public comparables: UBTECH''s audited FY2025 gross margin
    of 37.7% (up from 28.7% in FY2024) on consolidated revenue of RMB2,001.0 million,
    with its newly scaled full-size humanoid segment growing revenue 2,203.7% year-over-year
    to RMB820.6 million on 1,079 units; and Unitree''s reported 60.27% gross margin
    (up from 44.22% in 2023) on 2025 revenue of approximately RMB1.7 billion and 5,500+
    humanoid shipments, alongside a third-party actuation-cost estimate (McKinsey,
    cited by The Robot Report) that bill-of-materials costs represent 40-60% of humanoid
    hardware cost. These figures should not be read as DexForce''s own margins; they
    establish a plausible range (roughly 30-60% gross margin) for a scaling Chinese
    humanoid producer, bounded by hardware cost intensity on the low end and software/licensing
    mix on the high end, that DexForce has not confirmed applies to its own business.'
