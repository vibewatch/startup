- id: SEC-I-2
  title: Go-to-Market Motion and Sales-Efficiency Proxies
  body: 'DexForce''s disclosed go-to-market motion blends industrial B2B deployment
    (named customers Midea, CRRC, Wuling per Embodied Global) with a consumer-facing
    franchise channel (DexBot Inside kiosks) and public-facing brand exposure (state-media
    coverage at a cultural-industries expo). The kiosk format is the only channel
    with quantified unit economics in company materials: single-store monthly revenue
    above RMB100,000, payback inside a stated window, foot-traffic conversion uplift,
    and peak daily order counts, all self-reported and none independently verified
    by a third party. No source discloses customer acquisition cost, sales headcount,
    sales-cycle length, net revenue retention, or contract duration for the industrial
    channel, making it impossible to compute standard SaaS/hardware sales-efficiency
    proxies (e.g., magic number, CAC payback) with any confidence. The shipment cadence
    implied by "several hundred" H1 2026 humanoid units against a stated near-1,000-unit
    full-year 2026 target implies material second-half loading, which is consistent
    with either seasonal industrial procurement cycles or optimistic full-year guidance;
    no source disaggregates the channel mix (industrial vs. kiosk vs. export) of either
    figure. Comparable-company sales-efficiency proxies from UBTECH (audited, filing-sourced)
    and Unitree (IPO-linked prospectus reporting) are presented for contrast rather
    than direct substitution.'
