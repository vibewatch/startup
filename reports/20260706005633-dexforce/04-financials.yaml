  evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: gross-margin-disclosure
    missingEvidence: DexForce-specific gross margin, cost of goods sold, or bill-of-materials
      cost breakdown.
    whyItMatters: Without a company-specific margin figure, all profitability and
      unit-economics analysis relies on comparable-company triangulation rather than
      DexForce's actual financial performance.
    diligencePath: Request management-provided cost-of-goods-sold detail, margin bridge
      by revenue stream, and supplier cost schedules.
    relatedQuestionRefs:
    - QI022
    relatedTableRefs:
    - TI006
  - type: missing-source
    severity: blocking
    topic: cash-runway-disclosure
    missingEvidence: Cash on hand, monthly burn rate, runway in months, and debt/project-finance
      obligations for DexForce.
    whyItMatters: Without this, financing dependency and solvency risk cannot be assessed,
      and the timing/necessity of DexForce's next funding round cannot be estimated.
    diligencePath: Request the most recent balance sheet, cash-flow statement, and
      any credit-facility agreements directly from management or lead investors.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: sales-efficiency-metrics
    missingEvidence: Customer acquisition cost, sales headcount, sales-cycle length,
      and net revenue retention for DexForce's industrial and kiosk channels.
    whyItMatters: Without these, standard sales-efficiency proxies cannot be computed,
      limiting confidence in the durability and cost of DexForce's revenue growth.
    diligencePath: Request sales-team headcount and productivity data, and CAC/payback
      estimates by channel, directly from management.
    relatedQuestionRefs:
    - QI025
    relatedTableRefs:
    - TI003
  - type: conflicting-data
    severity: material
    topic: fy2026-revenue-target
    missingEvidence: A single, reconciled FY2026 revenue target and its basis (booked,
      contracted, or projected).
    whyItMatters: Three different FY2026 targets (RMB250-300M, >RMB300M, and an implied
      ~RMB300-400M+) are in circulation, and no source explains the discrepancy, which
      materially affects any valuation or growth-rate analysis.
    diligencePath: Request the company's internal FY2026 operating plan or board-approved
      budget with a single stated revenue target and recognition basis.
    relatedQuestionRefs:
    - QI004
    relatedTableRefs:
    - TI001
  - type: access-blocked
    severity: material
    topic: corporate-registry-access
    missingEvidence: Independently verifiable Chinese corporate-registry records (shareholder
      structure, filed capital, business scope) for DexForce.
    whyItMatters: Without registry access, capital structure and shareholder claims
      from press coverage cannot be independently cross-checked.
    diligencePath: Obtain a registry extract via a licensed Chinese corporate-data
      provider or request equivalent documentation directly from the company.
    relatedQuestionRefs:
    - QI014
    relatedTableRefs:
    - TI005
  - type: stale
    severity: minor
    topic: a1a2-source-reverification
    missingEvidence: Live, re-accessible versions of the 21jingji and InvestorsCN
      articles quoting a Lenovo Capital investor on mid-2025 customer count and revenue
      tier.
    whyItMatters: Both URLs returned HTTP 404 on re-fetch and no Wayback Machine snapshot
      was found for 21jingji, so the underlying quotes rely on this session's historical
      cache rather than a currently live, independently re-checkable source.
    diligencePath: Attempt retrieval via alternate archive services or contact the
      original publishers for a copy of the article.
    relatedQuestionRefs:
    - QI018
    - QI019
    relatedTableRefs: []
  - type: private-evidence-only
    severity: material
    topic: dexbot-inside-contract-terms
    missingEvidence: The franchise/revenue-share agreement terms, and underlying cost
      assumptions, behind DexForce's self-reported DexBot Inside kiosk unit economics.
    whyItMatters: Company-claimed payback period, revenue uplift, and conversion metrics
      cannot be verified or stress-tested without the underlying contract and cost
      data, which likely exist only as private company records.
    diligencePath: Request a sample DexBot Inside franchise agreement and the cost
      assumptions behind the payback/uplift figures directly from management.
    relatedQuestionRefs:
    - QI008
    relatedTableRefs:
    - TI003
