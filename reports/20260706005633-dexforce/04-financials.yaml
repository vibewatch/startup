- id: SEC-I-5
  title: Capital Adequacy and Financing Dependency
  body: DexForce's disclosed financing history includes an undisclosed-amount 2024
    round involving Lenovo Capital, A1/A2 rounds in 2025 reported at "hundreds of
    millions of yuan" (Baidu Baike, Chuangtouzhijia) with a named investor syndicate
    (Chengdu Sci-Tech Innovation, Hongtai Fund, Tianying Capital, Sichuan Academician
    Fund, Nanshan Strategic Emerging, Yicun Songling, Tanyuan Venture Capital, and
    a Lenovo Capital follow-on), and a RMB1 billion Series B in 2026 described by
    DexForce's own site as reaching a valuation in the tens of billions of RMB. Historical
    (2025-vintage, now unreachable) cached coverage from 21jingji and InvestorsCN
    quotes an unnamed Lenovo Capital investor stating DexForce had "100+ cumulative
    customers, dozens of scenarios, and annual revenue at the hundred-million-RMB
    tier" as of mid-2025 — an early independent-investor data point that predates
    and is broadly consistent with later 2025/2026 revenue reporting, though both
    source URLs now return 404 and could not be re-verified live. No source discloses
    cash on hand, monthly cash burn, runway, total debt, or whether DexForce is presently
    profitable or cash-flow positive; given a hardware- and services-led business
    model, reliance on successive equity rounds to fund capital expenditure and working
    capital appears likely but is not confirmed. This is a material and, on cash-runway
    specifically, a blocking evidence gap for underwriting purposes.
