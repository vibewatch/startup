- id: SEC-I-6
  title: 'Commercialization Skepticism: An Adverse Read'
  body: The Robot Report's analysis of Unitree's IPO disclosure provides an adverse-stance
    check on humanoid-robotics commercialization narratives generally, which is directly
    relevant to reading DexForce's own claims with appropriate skepticism. Despite
    Unitree's headline revenue and margin growth, the outlet finds that only 9.01%
    of Unitree's humanoid-segment revenue in the nine months to September 2025 came
    from industrial applications, versus 73.6% from research/education customers and
    17.4% from commercial demonstrations — implying that even the sector's most commercially
    advanced, IPO-bound player derives the large majority of humanoid revenue from
    non-industrial use cases. The same analysis notes a declining R&D-to-revenue ratio
    (31.39% to 7.73%) and cites a McKinsey estimate that actuation and sensing bill-of-materials
    can represent 40-60% of humanoid hardware cost, both consistent with a business
    still working out durable unit economics at scale. Because DexForce discloses
    no customer-segment revenue split, it is impossible to determine whether its own
    Midea/CRRC/Wuling industrial references represent revenue-generating deployments,
    pilots, or demonstration engagements; the Unitree finding is a reasonable basis
    to treat DexForce's "industrial customer" framing as unverified until a comparable
    segment disclosure is available. This does not invalidate DexForce's reported
    revenue growth, but it materially discounts confidence that the growth reflects
    sustainable industrial-automation demand rather than pilot, research, or demonstration
    activity typical of the sector at this stage.
  claimRefs:
  - CI029
  - CI043
  - CI044
  tableRefs: []
  figureRefs: []
- id: SEC-I-7
  title: Financial Verdict
  body: 'Revenue quality: DexForce''s reported revenue growth (RMB100 million-plus
    on a 2025 or H1 2026 basis, with FY2026 targets of RMB250-400 million depending
    on source) is directionally credible given multiple independent outlets and an
    early independent-investor quote corroborating a hundred-million-RMB revenue tier
    by mid-2025, but the absence of a single reconciled figure, a disclosed customer/segment
    mix, or any audited statement means revenue quality cannot be assessed with confidence
    — the sector-wide adverse finding on Unitree''s low industrial-revenue share is
    a specific reason for caution. Margin path: no DexForce-specific gross margin
    is disclosed; comparable Chinese humanoid producers show margins improving from
    the high-20s/low-30s percent toward the 40-60% range as volume scales, suggesting
    a plausible but unconfirmed path for DexForce. Capital intensity: the business
    combines hardware capex (arms, compute, sensors) with a franchise/services layer
    (DexBot Inside) that may be less capital-intensive per unit of revenue than pure
    hardware sale, but no capex or unit-cost data is available to confirm this thesis.
    Blockers to underwriting: (1) no audited financial statements or filings; (2)
    no disclosed cash balance, burn rate, or runway; (3) three non-reconciled FY2026
    revenue targets; (4) no customer-concentration or contract-term disclosure for
    the DexBot Inside channel or industrial customers; (5) blocked access to Chinese
    corporate-registry sources that could otherwise independently verify capital structure.
    Overall, DexForce presents a plausible but financially opaque growth story that
    would require management-provided audited or reviewed financials, a single reconciled
    revenue and margin figure, and customer-concentration disclosure before underwriting
    could proceed with confidence.'
