- id: SEC-I-4
  title: Public Traction vs. Private Financial Gaps
  body: 'DexForce is a privately held company with no located audited financial statements,
    annual report, or regulatory filing. Corporate-registry lookups attempted directly
    (qcc.com, cnverify.com, fundup.ai) each returned access-blocked responses (404
    or Cloudflare bot-check pages), preventing independent verification of registered
    capital, shareholder structure, or filed financial summaries beyond what Baidu
    Baike reports (registered capital RMB1,557,874 as of November 2024). That registered-capital
    figure is more than two orders of magnitude smaller than the cumulative funding
    reported across the A1/A2 rounds and RMB1 billion Series B, which is unremarkable
    for a Chinese company structure (registered capital is a nominal balance-sheet
    figure, not paid-in cash) but underscores that no source ties disclosed fundraising
    amounts to an audited balance sheet. Public-market comparables illustrate what
    disclosure could look like at scale: UBTECH''s HKEX-filed 2025 annual report gives
    line-item revenue, gross profit, and net loss (RMB789.8 million) figures, and
    its market capitalization (HK$54.73 billion as of July 2-3, 2026, down from a
    HK$63.48 billion year-end-2025 peak) is a continuously observable proxy for investor
    sentiment; Unitree''s IPO-linked reporting discloses revenue, margin, and channel-mix
    detail unavailable for DexForce. The gap between DexForce''s press-release-level
    disclosure and these public comparables is the central financial-diligence constraint
    of this chapter.'
