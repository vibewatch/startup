companyProfile:
  summary: >-
    Acronis is a Swiss-based cyber-protection software vendor founded in Singapore in 2003 that combines backup,
    disaster recovery, cybersecurity, endpoint management, and IT automation in an MSP-led platform. The company is now
    majority-owned by EQT after its 2024-2025 transaction and serves more than 21,000 service providers and 750,000
    businesses across 150+ countries, but public underwriting remains constrained by private financial opacity and a
    standing U.S. intelligence-community exclusion order.
  founders:
    - name: Serg Bell (Serguei Beloussov)
      role: Founder
      background: Co-founded Acronis after prior work on SWsoft / Parallels infrastructure software.
      claimRefs:
        - CO001
        - CO002
  foundingLocation: Singapore
  headquarters: Schaffhausen, Switzerland
  productSummary: >-
    MSP-led cyber protection software spanning backup, disaster recovery, cybersecurity, endpoint management,
    automation, and consumer backup subscriptions.
  customerFocus: Managed service providers, SMBs, enterprise IT, and consumer/home-office users
  businessModel: >-
    Recurring cloud subscriptions, workload-based consumption, and consumer subscriptions sold through direct and
    channel partners
  stage: Private equity-backed
  fundingStatus: >-
