  topStrengths:
    - Broad MSP/channel distribution at 21,000+ service providers and 750,000+ businesses
    - Integrated backup, disaster recovery, cybersecurity, and endpoint-management platform
    - Strong institutional sponsorship and continued 2026 product cadence
  topRisks:
    - Audited financials, gross margin, cash, debt, and net retention remain undisclosed
