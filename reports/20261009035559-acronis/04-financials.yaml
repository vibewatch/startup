callouts:
  - calloutType: "risk"
    title: "Financial Opacity and Structural Absence of Audited Operating Metrics"
    body: "Acronis operates with the reporting opacity typical of private-equity-controlled enterprise software firms. Outside of high-level transaction valuation markers ($3.5B implied EV in the 2024 EQT buyout) and secondary equity estimates (~$420M revenue), there is zero verified public data on GAAP gross margin, cash burn, adjusted EBITDA, or debt obligations, making standard public-market underwriting impossible without confidential data-room access [CI001, CI009]."
    claimRefs:
      - "CI001"
      - "CI009"
  - calloutType: "insight"
    title: "Capital-Light Channel Distribution Buffers Direct Sales CAC"
    body: "By routing core product delivery through more than 21,000 MSP partners and tier-1 IT distributors, Acronis offloads local end-customer acquisition, frontline technical support, and billing management to its channel partners. This structure allows Acronis to capture recurring software revenues across 750,000 businesses with a concentrated inside cloud sales force, keeping customer acquisition unit economics scalable [CI003, CI007, CI008]."
    claimRefs:
      - "CI003"
      - "CI007"
      - "CI008"
