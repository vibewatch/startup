callouts:
  - calloutType: strength
    title: Established Channel Moat with 21,000+ Service Provider Partners
    body: >-
      Acronis maintains a sticky distribution foundation through deep integration with over 21,000 managed service
      providers globally. By combining backup, disaster recovery, endpoint security, and IT automation into a single multi-tenant
      console, Acronis eliminates vendor sprawl for MSPs, creating high switching costs across more than 750,000 customer organizations.
    claimRefs:
      - CO004
      - CO005
  - calloutType: risk
    title: Federal Procurement Friction Stemming from 2025 DNI Exclusion Order
    body: >-
      The September 2025 U.S. DNI order excluding Acronis from Intelligence Community systems represents a tangible reputational
      and commercial hurdle. While not citing technical vulnerabilities and restricted to sensitive intelligence networks, the
      action may cause spillover hesitation among broader public sector agencies and defense industrial base contractors.
    claimRefs:
      - CO015
      - CO016
