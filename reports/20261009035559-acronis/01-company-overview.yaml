company:
  name: Acronis
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Acronis is a Swiss-headquartered cyber protection software vendor founded in 2003 that integrates backup, disaster
    recovery, cybersecurity, and endpoint management into a unified platform primarily distributed through managed service
    providers (MSPs). Following major minority funding from Goldman Sachs ($147M in 2019) and CVC Capital Partners ($250M
    at a $2.5B+ valuation in 2021), Swedish private equity firm EQT acquired a majority stake in the company at an implied
    $3.5B enterprise value, while public underwriting remains constrained by unaudited private financials and a 2025 U.S.
    DNI exclusion order affecting federal intelligence systems.
sections:
  - id: identity-business-model
    title: Corporate Identity, Origins, and Unified Cyber Protection Architecture
    body: >-
      Acronis International GmbH is a privately held global software vendor specializing in cybersecurity and data protection,
      headquartered in Schaffhausen, Switzerland, with corporate group roots tracing back to Singapore where it was founded in
      2003 by Serg Bell (Serguei Beloussov) as a spin-off from SWsoft (later Parallels). The company initially established
      market leadership in bare-metal disk imaging and workstation backup under its flagship Acronis True Image brand before
      pivoting toward an integrated, cloud-native cyber protection architecture that consolidates backup, disaster recovery,
      anti-malware heuristics, endpoint management, and IT automation into a single agent. The company’s commercial model is
      heavily anchored in channel distribution: Acronis powers over 21,000 service providers and managed service providers
      (MSPs) across 150+ countries, protecting approximately 750,000 businesses and enterprise clients through 50+ global
      data centers supporting 26 languages. Acronis structures its portfolio into two principal lines: Acronis Cyber Protect
      Cloud, sold to MSPs and enterprises through flexible consumption models (per-workload, per-GB, or solution-based), and
      its consumer brand True Image (formerly Cyber Protect Home Office), while offering specialized security packs spanning
      EDR/XDR, advanced disaster recovery, email security, and GenAI protection.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
    tableRefs:
      - TO001
  - id: leadership-governance
    title: Governance, Executive Transitions, and Capital Structure
    body: >-
      Acronis operates under a private equity-backed governance structure following successive institutional funding rounds and
      consequent control shifts. In September 2019, Goldman Sachs led a $147 million investment at a valuation surpassing $1
      billion. In May 2021, CVC Capital Partners led a $250 million equity round valuing Acronis at over $2.5 billion, which
      accelerated product expansion into anti-malware and cloud-native management. In August 2024, Swedish private equity house
      EQT agreed to acquire a majority stake in Acronis at an implied enterprise valuation of approximately $3.5 billion, with
      the transaction closing in 2025. Following the EQT acquisition, governance consolidated around Chairman Warren Adelman
      and EQT Partner Johannes Reichel, alongside continuing board representation from CVC Capital Partners (Daniel Williamson)
      and Springcoast Partners (Holger Staude). Operating leadership transitioned from founder Serguei Beloussov to Ezequiel
      Steiner, and subsequently to CEO Jan-Jaap Jager in 2025. While founder-led engineering DNA remains influential, the
      executive bench reflects institutional PE stewardship designed to drive operational scaling and strategic expansion.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
    tableRefs:
      - TO002
      - TO003
  - id: milestones-adverse-context
    title: Operating Scale, Milestone Sequence, and Federal Compliance Headwinds
    body: >-
      Acronis expanded its technological footprint through targeted technology acquisitions, including GroupLogic (2012),
      BackupAgent and nScaled (2014), 5nine Software (2019), and DeviceLock and CyberLynx (2020), cementing its transition from
      point backup utilities to full-stack cyber protection. The company introduced behavioral anti-ransomware protection
      (Active Protection) and blockchain notarization in 2017, and rolled out platform enhancements in 2026 including automated
      disaster recovery test failover reporting, partner-level vulnerability assessment, and per-user SAML provisioning. However,
      Acronis faces material compliance and reputational headwinds: on September 15, 2025, the U.S. Director of National
      Intelligence (DNI) issued an exclusion and removal order under FAR Subpart 4.23 against Acronis products across the U.S.
      Intelligence Community based on a Federal Acquisition Security Council (FASC) recommendation. Although neither FASC nor
      DNI identified specific technical vulnerabilities in Acronis software, and commercial operations outside U.S. intelligence
      remain unaffected, the exclusion creates friction for federal contracting and regulated procurement channels.
    claimRefs:
      - CO013
      - CO014
      - CO015
      - CO016
    tableRefs:
      - TO004
    figureRefs:
      - FO001
