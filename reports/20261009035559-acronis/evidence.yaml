evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance
    missingEvidence: >-
      Comprehensive enumeration of full executive officers, senior vice presidents, and board committees beyond public
      press releases.
    whyItMatters: >-
      Incomplete visibility into executive committee roles limits assessment of key-person operational dependencies
      across business units.
    diligencePath: >-
      Request management organization chart, executive employment agreements, and board committee charters during
      confirmatory diligence.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: ownership-cap-table
    missingEvidence: Detailed post-EQT equity capitalization table, voting classes, and secondary liquidity participation schedules.
    whyItMatters: >-
      Full stakeholder economic allocation, rollover equity terms, and liquidation preference stacks are necessary to
      model return hurdles.
    diligencePath: Review full cap table capitalization ledger and shareholder rights agreements with company legal counsel.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Audited revenue, ARR, gross margins, EBITDA, and customer retention metrics for FY2024-FY2026.
    whyItMatters: >-
      As a private equity-owned vendor, Acronis does not publish audited financials, limiting quantitative margin and
      cash flow verification.
    diligencePath: Request audited financial statements and recurring revenue bridge during prospective sponsor diligence.
  - type: missing-source
    severity: minor
    topic: regulatory-exposure
    missingEvidence: Quantified U.S. federal agency revenue exposure resulting from the September 2025 DNI FASCSA exclusion order.
    whyItMatters: Determining whether federal revenue loss impacts overall company growth trajectory and channel confidence.
    diligencePath: Solicit federal government sector revenue breakdown and public sector reseller contract volumes from management.
  - type: missing-source
    severity: material
    topic: audited-financials
    missingEvidence: >-
      Audited breakdown of annual recurring revenue (ARR), gross margin percentages, and net revenue retention across
      MSP vs enterprise customer segments.
    whyItMatters: >-
      Without audited revenue decomposition, market sizing estimates and valuation underwriting rely on qualitative
      management assertions.
    diligencePath: >-
      Request confidential disclosure from EQT or Acronis management during formal sponsor diligence, or inspect
      statutory filings under Swiss commercial registers.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitive-economics
    missingEvidence: Realized Acronis and competitor prices by workload, storage, customer segment, discount, and contract term.
    whyItMatters: Public list and estimated ranges cannot establish relative total cost or pricing power.
    diligencePath: >-
      Request anonymized invoices, renewal cohorts, discount schedules, and comparable competitor quotes from management
      and channel partners.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-and-retention
    missingEvidence: >-
      Competitive win-loss data, renewal and churn by product, partner multi-homing, migration duration, and
      customer-level switching cost.
    whyItMatters: These measures determine whether the channel footprint produces durable retention or only broad distribution.
    diligencePath: >-
      Review CRM win-loss records, cohort retention, partner wallet-share data, migration tickets, and reference calls
      with former customers.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: audited-financials
    missingEvidence: Audited financial statements confirming GAAP/IFRS revenue, ARR, gross margins, operating expenses, and cash flow.
    whyItMatters: >-
      Without audited figures, underwriting must rely on third-party estimates that cannot verify operating
      profitability or unit economics.
    diligencePath: >-
      Request audited annual financial statements and trailing 12-month management reports in a formal diligence data
      room.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: nrr-and-retention
    missingEvidence: Net revenue retention (NRR), gross revenue retention (GRR), and partner churn rates broken down by MSP size.
    whyItMatters: >-
      Retention metrics demonstrate whether Acronis is expanding organically within its 21,000+ partner base or
      suffering silent churn.
    diligencePath: >-
      Request quarterly cohort analysis of partner spend, workload retention, and advanced pack attach rates over the
      past 36 months.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: debt-schedule-and-use-of-funds
    missingEvidence: >-
      Debt capital structure, credit facilities, interest obligations, and net proceeds breakdown from the 2024 EQT
      buyout.
    whyItMatters: >-
      Debt load and leverage ratios determine debt service burden, cash flow flexibility, and risk of financial
      distress.
    diligencePath: >-
      Examine credit facility agreements, term loan amortization schedules, and capital structure documents from EQT
      transaction filings.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: regulatory-revenue-exposure
    missingEvidence: >-
      Quantified revenue exposure to U.S. federal and defense sector accounts impacted by the September 2025 DNI FASCSA
      exclusion order.
    whyItMatters: >-
      Exclusion from intelligence community and sensitive government systems may cause revenue attrition or secondary
      private-sector caution.
    diligencePath: >-
      Audit public-sector distributor revenue, direct government contracts, and sub-contractor software bills of
      materials (SBOM) across defense supply chains.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Audited gross revenue retention (GRR), net revenue retention (NRR), and annualized cohort churn rates for MSP
      channel partners and direct enterprise clients.
    whyItMatters: >-
      Without audited NRR and churn figures, it is impossible to evaluate whether the 750,000 business customer base is
      organically expanding or masking account-level attrition through new partner recruitment.
    diligencePath: >-
      Request confidential SaaS cohort retention schedules and MSP partner churn tables under NDA during EQT sponsor
      diligence.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU001
  - type: private-evidence-only
    severity: material
    topic: federal-revenue-exposure
    missingEvidence: >-
      Quantified commercial revenue exposure of Acronis and its reseller partners to U.S. federal agency contracts and
      FAR 52.204-30 compliance reviews following the FASCSA exclusion order.
    whyItMatters: >-
      Exclusion from Intelligence Community systems and GSA Advantage could prompt broader civilian agency restrictions
      and channel partner displacement in defense-adjacent supply chains.
    diligencePath: >-
      Review public sector channel revenue breakdowns and government contract schedules with Acronis legal and
      commercial leadership.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: minor
    topic: named-customers
    missingEvidence: >-
      Exhaustive registry of enterprise production deployments detailing annual contract values, displaced competitors,
      and module adoption rates.
    whyItMatters: >-
      Available customer databases provide sample implementation narratives but omit commercial contract size, software
      version status, and active billing verification.
    diligencePath: Audit customer reference call transcripts and CRM account data for top 100 enterprise billing accounts.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited annual income statement, balance sheet, cash flow statement, ARR growth rate, gross margin, and net
      revenue retention figures.
    whyItMatters: >-
      Without audited financial statements, valuation multiples and return underwriting rely on unverified company
      claims and private secondary indicators.
    diligencePath: >-
      Request confidential virtual data room access from Acronis management and lead sponsor EQT to inspect audited
      financial statements and cohort retention tables.
    relatedQuestionRefs:
      - QV001
      - QV006
  - type: missing-source
    severity: material
    topic: secondary-liquidity
    missingEvidence: Recent secondary transaction pricing, bid-ask spreads, and matched share volume on private secondary platforms.
