chapter:
  number: 6
  title: "Customers"
  summary: "Acronis operates an indirect, channel-first distribution model anchored by over 21,000 managed service providers and cloud distributors serving approximately 750,000 corporate clients, alongside an e-commerce subscription channel delivering over 5.5 million consumer deployments. While customer proof spans diverse global verticals in banking, industrial manufacturing, and professional services, enterprise adoption remains vulnerable to supply-chain privilege-escalation incidents and public-sector friction stemming from a historic FASCSA federal exclusion order."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Partner Channel Architecture"
    body: "Acronis distributes its cyber protection, data recovery, and IT automation solutions primarily through a two-tier channel architecture designed for managed service providers (MSPs), cloud service providers, and telecommunications distributors, rather than direct high-touch enterprise direct sales. Company disclosures report a global footprint encompassing more than 21,000 active service providers delivering protection to upwards of 750,000 business entities across 150 countries and 50 cloud data center facilities. In parallel with this commercial MSP core, Acronis maintains a direct-to-consumer and micro-business e-commerce subscription engine managed via cleverbridge, supporting over 5.5 million home users with True Image and Cyber Protect Home Office suites. Commercial buyers stratify into three primary tiers: tier-one regional and national MSPs delivering fully managed Backup-as-a-Service (BaaS) and Endpoint Detection and Response (EDR) to resource-constrained small and medium businesses; mid-market enterprises deploying hybrid cloud backup alongside Active Directory and virtualization stacks; and consumer home-office endpoints. Strategic channel reliance delegates end-customer tier-one support and relationship ownership to local partners, creating extensive geographic reach while obscuring customer-level contract terms, net revenue retention rates, and account-level unit economics from external diligence."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU004"
      - "CU007"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-deployment"
    title: "Adoption Trajectory, Workload Expansion, and Deployment Dynamics"
    body: "The adoption trajectory of Acronis Cyber Protect Cloud reflects a clear transition from point backup-and-imaging utility software toward integrated security and IT operations consolidation. Channel telemetry and vendor operational reports indicate that partner adoption is increasingly led by consolidated security bundles—integrating AI-guided endpoint detection, patch management, email security, and disaster recovery into an autonomous IT framework. Mid-2026 threat telemetry reveals active endpoint agent operations across millions of endpoints globally, with normalized client detection rates indicating monthly threat mitigations across 5.6% of unique corporate clients. Independent market database records compile multi-year production deployments across banking, manufacturing, energy, and non-profit accounts, where organizations frequently initiate adoption with workstation imaging and server backup before expanding into hybrid cloud and multi-tenant virtualization protection. However, because Acronis reports aggregate partner counts and protected corporate entities without publishing audited annual recurring revenue (ARR), gross retention, or cohort-based expansion metrics, true organic expansion cannot be independently decoupled from pricing adjustments and distributor inventory absorption."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU005"
      - "CU007"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-customer-proof"
    title: "Named Customer Proof and Production Deployments"
    body: "Public customer references and independent procurement records demonstrate that Acronis Cyber Protect Cloud is deployed in critical production workflows across regulated commercial and industrial sectors. In financial services, regional institutions such as Anderson Brothers Bank deployed Acronis Cyber Protect Cloud across 26 branches and more than 350 employee workstations, integrating backup imaging into Active Directory infrastructure and branch hardware estates including ATMs and surveillance recorders. In industrial and enterprise sectors, organizations such as BHPetrol implemented centralized backup orchestration across national depot locations and data centers supporting mission-critical SAP environments, while global consumer manufacturer Caffitaly protects hybrid on-premise and Microsoft 365 environments across more than 400 staff endpoints. Production case studies published through vendor and distributor channels across 2026 highlight customer operational outcomes including 350% product adoption acceleration for Nord Security business suites and zero backup downtime for industrial operational technology deployments like Mevis. Despite these reference deployments, public accounts skew heavily toward centralized backup and disaster recovery use cases, with comparatively sparse public enterprise case studies documenting end-to-end displacement of incumbent enterprise-scale EDR vendors."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU003"
  - id: "retention-and-concentration-risks"
    title: "Retention Durability, Security Vulnerabilities, and Concentration Risks"
    body: "Customer retention in the Acronis model is fundamentally mediated by channel partner health and technical integrity. In the consumer and digital subscription stream, automated renewal infrastructure managed by cleverbridge demonstrated a 19% improvement in renewal rates over a six-year horizon, supported by automated quote-to-cart workflows. In the commercial B2B domain, service providers report significant administrative efficiency gains through unified multi-tenant consoles, leading to Leader recognition across seven G2 Fall 2026 Grid categories including MDR, RMM, Cloud Security, and SaaS Backup. However, operational durability faces substantial adverse headwinds. In September 2026, security researchers confirmed in-the-wild exploitation of CVE-2026-87886, a high-severity local privilege-escalation vulnerability affecting Acronis Backup plugins for cPanel and Plesk Linux hosting servers, threatening multi-tenant hosting environments. Furthermore, the September 2025 FASCSA exclusion and removal order issued by the U.S. Director of National Intelligence excluded Acronis products from Intelligence Community systems and GSA Advantage procurement schedules, introducing severe federal contractor compliance liabilities under FAR 52.204-30 and establishing enterprise procurement friction across security-sensitive public and defense-adjacent customer segments."
    claimRefs:
      - "CU002"
      - "CU006"
      - "CU010"
      - "CU011"
      - "CU012"
