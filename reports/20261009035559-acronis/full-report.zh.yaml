  - id: FE001
    title: Acronis 统一网络保护技术栈
    type: stack
    summary: 分层架构展示终端客户、云控制编排与超融合基础设施之间的结构分离。
    data:
      layers:
        - label: 客户端与终端工作负载层
          detail: 单一轻量级网络保护代理，支持 30 多种操作环境中的备份、反恶意软件、EDR 与补丁管理
        - label: 应用与安全引擎层
          detail: 行为启发式分析、主动反勒索软件回滚、漏洞评估及 AI 驱动的威胁检测
        - label: 管理与多租户控制平面
          detail: Acronis Cyber Protect Cloud 集中式 Web 控制台，提供租户隔离、遥测汇总与策略管理
        - label: 集成与自动化网关
          detail: Acronis Cyber Platform REST API、Postman 集合、Ticket Bridge 及第三方 PSA/RMM 自动化连接器
        - label: 计算与虚拟化架构
          detail: Acronis Cyber Frame OpenStack 编排与 KVM 虚拟机管理程序基础，提供多租户 IaaS 虚拟机
        - label: 存储与灾难恢复基础设施
          detail: 软件定义存储、混合云存储库、重复数据删除引擎及区域主权数据中心
    approximationNotes: 代表依据官方技术文档与开发者指南汇编的概念性功能架构。
    claimRefs:
      - CE001
      - CE008
      - CE010
  - id: FU001
    title: 客户旅程与渠道扩张架构
    type: journey-map
    summary: 覆盖 MSP 与企业账户的多阶段客户接入、合作伙伴配置及平台扩张循环。
    data:
      items:
        - label: 渠道接入
          detail: 服务商加入合作伙伴计划，配置云控制台并集成 PSA/RMM 工具
          touchpoints:
            - 合作伙伴门户注册
            - 账单与 API 配置
            - 目录模块设置
        - label: 客户接入与试用
          detail: MSP 启动终端发现，部署轻量级代理并开始备份试点
          touchpoints:
            - 静默推送代理
            - 初始云种子备份
            - 部署前健康扫描
        - label: 生产环境 BaaS 激活
          detail: 通过定时镜像、灾难恢复编排与文件恢复保护核心工作负载
          touchpoints:
            - 每日备份验证
            - RPO/RTO SLA 调度
            - 多租户仪表盘评审
        - label: 安全与 RMM 增购
          detail: 从数据保护扩展到高级端点检测、漏洞修补和电子邮件安全
          touchpoints:
            - EDR/MDR 启用
            - 自动化补丁周期
            - 电子邮件过滤规则
        - label: 自主 IT 成熟
          detail: 部署受策略约束的 AI 修复、生成式 AI 防护控制和持续合规机制
          touchpoints:
            - AI 异常检测
            - 自动化事件回滚
            - 汇总式二级 SOC 监督
        - label: 车队保障与持续审计
          detail: 长期验证车队遥测数据、报告监管态势，并治理多租户 SLA
          touchpoints:
            - 自动化灾难恢复测试
            - 合规审计证据导出
            - 年度合作伙伴许可层级评审
    approximationNotes: 展示 Acronis 合作伙伴赋能材料和客户案例中识别出的标准运营采纳阶段。
    claimRefs:
