      - number: '3.4'
        title: 护城河更多来自运营，而非排他性
        blocks:
          - type: paragraph
            body: >
              证据支持的是运营护城河，而不是排他性技术护城河。庞大的服务提供商基础和统一控制平面，在 MSP 采用 Acronis
              标准化后，可以制造工作流、培训、计费和迁移摩擦。然而，保留证据没有量化续约率、多平台并用、竞争获胜率或迁移成本。竞争对手发布的比较称，单一代理在运营技术环境中可能带来资源和连接性取舍；近期一位 Capterra
              评测者也将资源占用、规模定价和控制台复杂度列为缺点。这些来源可作为不利信号，但不是独立基准。专业厂商可以替换单个工作负载，而不必替换整个平台，从而限制了单靠广度带来的持久性。
