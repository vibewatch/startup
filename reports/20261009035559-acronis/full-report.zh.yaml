  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层与合作伙伴渠道架构
        blocks:
          - type: paragraph
            body: >-
              Acronis 主要通过面向托管服务提供商（MSP）、云服务提供商和电信分销商的双层渠道架构，分销网络保护、数据恢复和 IT 自动化解决方案，而不是直接开展高接触式企业销售。公司披露的全球覆盖包括 21,000
              多家活跃服务提供商，这些伙伴在 150 个国家、50 个云数据中心设施中为超过 750,000 家企业提供保护。


              除商业 MSP 核心外，Acronis 还通过 cleverbridge 管理面向消费者和微型企业的电商订阅引擎，依靠 True Image 和 Cyber Protect Home Office 套件服务超过
              5.5 million 家庭用户。商业买方分为三个主要层级：向资源有限的中小企业提供全托管备份即服务（BaaS）和终端检测与响应（EDR）的一级区域和全国 MSP；将混合云备份与 Active Directory
              及虚拟化堆栈结合部署的中型企业；以及消费者家庭办公终端。渠道依赖把终端客户的一级支持和关系归属交给本地伙伴，在扩大地理覆盖的同时，也让外部尽调难以看到客户层面的合同条款、净收入留存率和账户级单位经济性。
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
