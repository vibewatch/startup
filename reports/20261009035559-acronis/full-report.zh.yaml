      - number: '2.3'
        title: 买方分层、预算归属与渠道动态
        blocks:
          - type: paragraph
            body: >
              Acronis 生态的采用高度受双层渠道上市结构影响。在占主导地位的托管服务提供商（MSP）和云服务提供商（CSP）细分市场，经济买方是 MSP
              所有者、负责人或首席技术官，日常用户则是一级或二级系统工程师、支持技术员。在这一模式下，MSP 充当付款方，承担批发软件许可或用量账单，再将其打包成按终端客户 SMB
              的席位或设备收取的月度经常性费用。该细分市场的主要采用触发因素包括技术员人效、平台多租户能力、与专业服务自动化（PSA）及 RMM 工具的集成，以及把分散的安全和备份控制台合并为一个统一界面。


              相比之下，中型企业 IT 细分市场由内部 IT
              总监或首席信息安全官（CISO）担任经济买方和付款方，内部系统管理员是用户。这里的采用通常由传统备份系统即将续约、要求不可变异地归档的合规规定，或勒索软件事件后的复盘触发。但市场仍有一个主要摩擦点：纯企业网络安全厂商如
              CrowdStrike 提供透明的按席位公开价格档位，而 Acronis 的 Cyber Protect 和 Cyber Protect Cloud 公开定价页面返回 404
              错误，潜在企业买方只能走定制化、销售主导的报价流程。
            claimRefs:
              - CM001
              - CM006
              - CM010
              - CM011
