  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与服务定义
        blocks:
          - type: paragraph
            body: >-
              Acronis 围绕统一交付网络保护定义产品组合，把混合数据保护、网络安全和终端管理纳入单一运营架构。Acronis Cyber Protect Cloud
              不要求服务提供商分别部署、修补和监控备份、终端检测与响应（EDR）以及远程监控与管理（RMM）软件包，而是通过单一管理平面和轻量客户端代理整合这些功能
              [CE001]。对托管服务提供商（MSP）而言，该平台通过集中管理多客户租户、自动配置和跨异构客户终端执行策略，解决技术员工作流中的核心低效 [CE002]。除旗舰多租户云服务外，Acronis
              还维护针对不同部署模式的独立产品线：Acronis Cyber Frame 为私有云和主权云环境提供超融合基础设施（HCI）及基础设施即服务（IaaS）；Acronis True Image（原名 Acronis
              Cyber Protect Home Office）则为个人工作站和移动设备提供本地化备份与网络保护 [CE003,
              CE004]。运营遥测表明，统一代理可以在客户终端群中执行行为启发式检测和恶意软件拦截，但近期漏洞监测也显示，第三方开发者和工单工具遭供应链入侵，仍是企业生态中的关键运营攻击面 [CE005]。
