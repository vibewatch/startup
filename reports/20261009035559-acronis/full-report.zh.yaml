          description: 核心备份按月按消耗计费，另加高毛利高级安全模块包
        - id: n4
          label: 分销商与渠道利润
          description: 从终端用户账单中扣除批发折扣及合作伙伴激励
        - id: n5
          label: Acronis 净批发收入
          description: 从 21,000 多家活跃服务商收取的估算约 $420M 年度经常性收入
