  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、工作负载范围与支出分类
        blocks:
          - type: paragraph
            body: >
              Acronis 的可服务市场位于三个传统上彼此分散的基础设施软件领域交汇处：备份与灾难恢复（BDR）、终端保护与响应（EDR/MDR），以及远程 IT
              系统管理（RMM/补丁管理）。历史上，托管服务提供商（MSP）和中小企业（SMB）分别采购这些能力，向 Veeam、VMware、CrowdStrike 和 ConnectWise
              等厂商支付不同的许可费和维护费。Acronis 将可服务支出界定为“网络保护”——这一工作负载范式认为，没有主动威胁检测的备份容易受到现代勒索软件攻击，而没有快速裸机回滚的终端安全无法保证网络韧性。


              纳入的支出包括云管理终端保护、服务器和虚拟机镜像备份、Microsoft 365 / SaaS 应用归档、灾难恢复编排、持续漏洞评估，以及外包托管检测与响应（MDR）。相反，Acronis
              明确排除企业级大型机数据管理、专有存储区域网络（SAN）复制硬件和高端安全信息与事件管理（SIEM）数据湖，将这些工作负载定位为相邻的企业领域。现状替代方案仍很普遍：数千家小型 IT
              服务商仍依赖原生操作系统工具（如 Windows Server Backup 和 Microsoft Defender）、未托管的单点工具或彼此割裂的开源脚本。这个分散的基线是 Acronis
              的主要替代机会，但要替换现有方案，公司必须说服预算负责人：代理整合带来的单位经济性和较低管理开销优于多厂商堆栈。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM010
      - number: '2.2'
        title: 市场规模、品类分布与现实触达范围
        blocks:
          - type: paragraph
            body: >
              衡量 Acronis 市场时，需要从多个口径审视，而不能接受不受约束的自上而下数字。6sense 的独立技术画像遥测估计，Acronis 在核心备份与恢复品类中拥有全球 12,159 个客户域名，估计市场份额约为
              6.64%，排名第三，仅次于 Veeam（21.34%）和 VMware Disaster Recovery（14.19%）。在更窄的独立备份分类中，6sense 识别出 Acronis Backup 的
              1,935 个客户域名，对应 6.30% 的市场份额，落后于 AWS Backup（22.58%）、SolarWinds Backup（18.21%）等超大规模云厂商工具，以及企业厂商
              Rubrik（11.18%）。这些数字显示出较深的品类渗透，但也凸显了撼动根深蒂固的企业巨头有多难。


              要严谨评估收入潜力，市场规模必须拆分为总体市场需求、渠道可触达支出和当前可服务能力。总体可寻址市场（TAM）涵盖全球 SMB 和中型市场在终端保护、SaaS 备份及灾难恢复上的支出。但 Acronis
              的可服务可寻址市场（SAM）实际上受制于那些通过外包服务商消费 IT 基础设施，或需要统一多租户架构的组织。可服务可获得市场（SOM）还受到 Acronis 当前渠道合作伙伴基础的限制：超过 20,000
              家活跃服务提供商保护着全球约 750,000 家企业。SOM 的增长取决于提高每个受保护工作负载的收入，以及推动 24/7 托管检测与响应（MDR）和生成式 AI 安全治理等高毛利模块化增值服务的采用。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
              - CM009
