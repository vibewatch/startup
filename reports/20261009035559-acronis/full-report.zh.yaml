      - number: '1.2'
        title: 治理、管理层交接与资本结构
        blocks:
          - type: paragraph
            body: >-
              在多轮机构融资及由此带来的控制权变化后，Acronis 采用私募股权支持的治理结构。2019 年 9 月，Goldman Sachs 领投一笔 $147 million 投资，公司估值超过 $1
              billion。2021 年 5 月，CVC Capital Partners 领投 $250 million 股权融资，Acronis 估值超过 $2.5
              billion，并加速向反恶意软件和云原生管理扩张。2024 年 8 月，瑞典私募股权机构 EQT 同意以约 $3.5 billion 的隐含企业价值收购 Acronis 多数股权，交易于 2025
              年完成。EQT 收购后，治理核心由董事长 Warren Adelman 和 EQT 合伙人 Johannes Reichel 组成，同时保留 CVC Capital Partners（Daniel
              Williamson）和 Springcoast Partners（Holger Staude）的董事会代表。运营领导层从创始人 Serguei Beloussov 交接给 Ezequiel
              Steiner，随后于 2025 年交给 CEO Jan-Jaap Jager。创始人主导的工程文化仍有影响，但管理层已体现机构化 PE 管理，目标是推动运营规模化和战略扩张。
