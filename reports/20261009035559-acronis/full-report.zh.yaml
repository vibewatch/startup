      - number: '4.2'
        title: GTM 销售动作、合作伙伴经济性与成本结构驱动因素
        blocks:
          - type: paragraph
            body: >-
              Acronis 的商业引擎高度依赖区域内勤和现场云销售代表，他们与区域软件分销商密切协作，寻找潜客、按 BANT 标准筛选、演示、谈判并引导托管服务提供商（MSP）上线
              [CI008]。这种双层分销动作把直接获客成本分摊到数千个下游 SMB 账户，相较于直接面向企业的安全厂商，形成销售效率优势 [CI008]。销售成本由覆盖 50 多个全球数据中心和 111
              个合作伙伴地点的云基础设施托管，以及第三方威胁情报接入和存储开销驱动 [CI002,
              CI007]。运营费用主要来自全球研发工程中心，这些中心分布在保加利亚、以色列、新加坡等成本较低的欧洲和亚洲地区，同时还包括瑞士和美国的公司办公室 [CI002, CI009]。2026 年，MSP
              合作伙伴面临宏观预算压缩和供应商定价摩擦，因此技术员生产率和工单处理自动化成为守住渠道利润的关键 [CI004]。
            claimRefs:
              - CI002
              - CI004
              - CI007
              - CI008
