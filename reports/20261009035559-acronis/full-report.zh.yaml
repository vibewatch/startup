    title: Acronis 合作伙伴主导的商业变现与收入转化流程
    type: flow
    summary: 展示客户工作负载接入、分层合作伙伴变现及成本结构转化为经营收益的可视化模型。
    data:
      nodes:
        - id: n1
          label: SMB 客户工作负载
          description: 需要保护的终端用户服务器、虚拟机、工作站及 Microsoft 365 云工作负载
