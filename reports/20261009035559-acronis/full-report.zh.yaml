      - number: '2.4'
        title: 加速催化剂与结构性采用约束
        blocks:
          - type: paragraph
            body: >
              针对分散型中小企业供应链的网络威胁越来越频繁、越来越复杂，推动了 Acronis 的市场顺风。Acronis Threat Research Unit 的遥测显示，全球企业终端持续承受威胁压力：2026 年 7
              月，5.6% 的独立受监测客户终端至少拦截到一次恶意软件威胁，重点国家中持续出现区域热点，包括新加坡（10.2%）、印度（10.0%）和美国（8.8%）。此外，复杂的供应链入侵——例如 ShinyHunters
              勒索组织于 2026 年 7 月入侵 Ernst & Young 的第三方工具——强化了市场对凭证盗窃和 SaaS 协作工具暴露客户数据、导致横向移动的认识。这样的威胁环境会推动集成式 MDR
              服务需求，该服务可以在最短 15 分钟内处置关键终端事件，而无需 MSP 自建全天候安全运营中心。


              反过来，多项采用约束限制了市场速度。核心备份基础设施的切换成本向来很高：在远程数据中心之间迁移 PB 级历史备份归档，会带来技术风险、高昂云出口费用和大量管理人力。品牌认知又是一重障碍：尽管 Acronis
              已开发出复杂的 AI 检测启发式能力，许多企业安全负责人仍主要把它视为传统备份工具，而非经过分析师验证的主流 EDR 平台。与 CrowdStrike 等网络安全头部厂商直接比较时，Acronis
              会面临买方对检测效果的怀疑，而且在主流企业软件基准目录中的独立评测数量也不相当。
            claimRefs:
              - CM006
              - CM010
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 控制台和代理整合是渠道价值的关键杠杆
            body: >
              运营利润微薄的托管服务提供商更看重 Acronis
              的商业价值主要在于技术员效率，而不是逐项功能追平顶级企业安全工具。分别部署、更新和监控杀毒、备份、远程管理和漏洞补丁代理，会制造告警疲劳和无法计费的人力。Acronis 把这些能力统一到单一代理，再通过多租户
              Web 控制台管理，使 MSP 能以更少的每席位工时保护客户终端，直接抵消技术员工资上涨对服务利润的挤压。
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM010
          - type: callout
            title: 定价不透明与企业信任缺口限制上探
            body: >
              Acronis 在批发定价闭门协商的合作伙伴渠道中表现良好，但其企业上市路径受到公开价格缺失，以及买方始终认为它只是安全领域的次级备份厂商的限制。与公开发布清晰按席位档位并拥有深厚分析师背书的
              CrowdStrike 等厂商竞争时，Acronis 很难说服那些更看重同类最佳终端检测、而非运营整合的专业安全团队。
            calloutType: risk
            claimRefs:
              - CM006
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争范围超出备份套件
        blocks:
          - type: paragraph
            body: >
              Acronis 并不存在一个整齐划一的同业群组。Tracxn 将 Rubrik、SentinelOne 和 Druva 列为主要竞争对手，并把
              Veeam、F-Secure、Tanium、Cohesity、Webroot 和 Keepit
              纳入前十。这个集合横跨数据韧性、终端安全、云数据保护以及消费者或小企业安全，而不是单一产品品类。保留的比较还加入了专业恢复工具、简单的云端点备份和免费的自托管镜像软件。因此，买方可以只替换 Acronis
              的一项功能，拼装多款产品，或继续使用内部工具，而不是另选统一平台。替代方案如此广泛，使任何关于 Acronis 拥有品类级护城河的说法都必须经受更高标准的检验。
            claimRefs:
              - CP001
              - CP002
              - CP015
              - CP016
