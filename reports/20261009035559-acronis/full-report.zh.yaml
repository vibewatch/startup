        - 高
        - 多租户门户、捆绑安全 / 备份利润
        - 高（合作伙伴流失直接损害 ARR）
      - - 大股东治理
        - EQT Private Equity
        - 控股股东（2024/2025 年收购）
        - 高（董事会控制、战略方向）
        - 杠杆资本重组、激进控制成本
        - 中
        - 独立董事长与经验丰富的执行董事会
        - 中（在流动性期限上保持战略一致）
      - - 财务不透明
        - 私募市场贷款方 / 审计师
        - 核验资本结构与经营偿付能力
        - 高（经审计财务指标未披露）
        - 未对冲的现金消耗率或未披露的债务偿付压力
        - 高
        - 第三方信用估算与 PE 发起人支持
        - 高（缺乏公开经审计财务报表）
    notes: 按严重性排序。评估商业渠道依赖、私募股权治理及资本结构透明度。
    claimRefs:
      - CR013
      - CR014
      - CR015
      - CR016
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 基础证据
      - 决策含义
    rows:
      - - 建议
        - research-more
        - 覆盖 21k 以上 MSP 的规模被缺失的经审计财务报表抵消
        - 待完成一手财务尽调后再承诺资本
      - - 置信度
        - medium
        - 历史估值标记已核验，但运营 KPI 未公开
        - 发布买入评级前，要求直接访问管理层数据室
      - - 风险评级
        - high
        - 流动性锁定、优先权悬置及网络威胁敞口
        - 设计下行保护与高级清算优先权
      - - 估值立场
        - fair
        - 隐含 $3.5B EV 与历史 C 轮融资一致
        - 需要坚持价格纪律；避免在二级市场支付溢价
    notes: 评级综合考虑渠道分销规模、披露不透明度与私募市场流动性不足。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV008
      - CV013
  - id: TV002
    title: 正反投资论点平衡表
    columns:
      - 支柱
      - 投资论点
      - 反方论点
      - 改变论点的触发因素
    rows:
      - - 渠道分销
        - 21,000 多家 MSP 合作伙伴带来稳定、可扩张的中端市场触达
        - MSP 合作伙伴集中度高且价格竞争同质化
        - MSP 合作伙伴净流失或活跃服务商数量增速放缓
      - - 平台整合
        - 统一代理与数据模型覆盖备份、EDR 及自动化
        - 专业终端安全厂商的点解决方案竞争
        - 失去主要分销商合同或独立基准排名下降
      - - 资本化与估值
        - 有机构支持记录，历史投后估值为 $3.5B
        - 二级市场完全缺乏价格发现与交易量
        - 披露经审计 ARR 增长超过 25% 且 EBITDA 为正
      - - 市场定位
        - 全球覆盖广泛，保护 750,000 多家企业客户
        - 私有披露状况掩盖毛利率与流失指标
        - 公开注册申报披露单位经济效益与 cohort NRR
    notes: 综合核心多头 / 空头论点及可核验的尽调标记。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV011
      - CV013
  - id: TV003
    title: 乐观、中性与悲观情景估值表
    columns:
      - 情景
      - 隐含估值
      - 运营假设
      - 关键下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - $4.5B - $5.0B
        - ARR 超过 $500M，同比增幅 >20%，且 GenAI EDR 采用成功
        - 平台集成失败或同行激进降价
        - 25%（需要核验财务加速增长及 IPO 准备度）
      - - 基准情景
        - $3.2B - $3.6B
        - ARR 为 $400M-$450M，保持低两位数增长，与 $3.5B 估值标记一致
        - 私募股权二级市场估值倍数压缩
        - 50%（与历史 C 轮估值及渠道规模一致）
      - - 悲观情景
        - $2.0B - $2.4B
        - 流失增加、联邦渠道受限，增长放缓至 10% 以下
        - 网络事件升级或 MSP 渠道声誉受损
        - 25%（下行风险与流动性不足及竞争压力相关）
    notes: 情景分析根据运营假设和私募市场风险因素建模估值结果。
    claimRefs:
      - CV001
      - CV005
      - CV008
      - CV013
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Acronis 从 2003 年成立到 2026 年运营云原生网络平台期间的企业、产品、资本形成及监管关键里程碑。
    data:
      items:
        - date: '2003-01-01'
          label: 公司成立
          detail: Serg Bell 在新加坡创立公司，使其从 SWsoft 分拆出来，并推出磁盘镜像与备份解决方案。
          tone: neutral
        - date: '2008-01-01'
          label: 瑞士公司重新注册
          detail: 在瑞士沙夫豪森注册成立，建立欧洲与新加坡双重运营体系。
          tone: neutral
        - date: '2012-09-10'
          label: 收购 GroupLogic
          detail: 收购 GroupLogic，拓展企业移动文件访问、同步与安全企业共享业务。
          tone: positive
        - date: '2017-01-18'
          label: 反勒索软件与区块链发布
          detail: 发布 True Image 2017 New Generation，加入 Active Protection 与 Notary 区块链公证。
          tone: positive
        - date: '2019-09-18'
          label: Goldman Sachs $147M 融资轮
          detail: 由 Goldman Sachs 领投，融资 $147 million，估值超过 $1 billion，达到独角兽水平。
          tone: positive
        - date: '2021-05-04'
          label: CVC 以 $2.5B+ 估值投资 $250M
          detail: 由 CVC Capital Partners 领投，融资 $250 million，Acronis 估值超过 $2.5 billion。
          tone: positive
        - date: '2024-08-07'
          label: 宣布 EQT 多数股权收购
          detail: 同意以隐含 $3.5 billion 估值，将多数股权出售给瑞典私募股权公司 EQT。
          tone: positive
        - date: '2025-08-20'
          label: EQT 交易完成并更换 CEO
          detail: 完成 EQT 交易，任命 Jan-Jaap Jager 为 CEO，接替 Ezequiel Steiner。
          tone: neutral
        - date: '2025-09-15'
          label: 美国 DNI FASCSA 排除令
          detail: 美国 DNI 依据 FAR 4.23 下令将 Acronis 产品从美国情报界系统中移除。
          tone: negative
        - date: '2026-01-15'
          label: Cyber Protect Cloud 2026 年 1 月更新
          detail: 推出自动化 DR 测试故障转移报告、合作伙伴漏洞管理与 SAML 配置。
          tone: positive
    approximationNotes: 公司 2008 年注册成立及 2003 年创立的具体日历日统一按 1 月 1 日处理。
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO007
      - CO008
      - CO010
      - CO013
      - CO014
      - CO015
      - CO016
  - id: FM001
    title: 可触达市场规模金字塔与可服务漏斗
    type: pyramid
    summary: 分层市场规模展示从全球网络安全与数据保护支出，逐步下探至 Acronis 通过渠道可获得的市场。
    data:
      items:
        - label: 总可寻址市场（TAM）
          value: 45000
          unit: USD M
          detail: 全球企业与 SMB 在终端安全、云数据备份、灾难恢复及补丁管理上的软件支出。
        - label: 可服务可寻址市场（SAM）
          value: 12500
          unit: USD M
          detail: 通过外包 IT 提供商、MSP 及云聚合商流入的中端市场与 SMB 基础设施支出。
        - label: 可服务可获得市场（SOM）
          value: 3200
          unit: USD M
          detail: 现有 20,000 多家 MSP 合作伙伴及多租户网络保护工作负载附加模块带来的近期可寻址扩张。
        - label: 渠道合作伙伴工作负载机会
          value: 1500
          unit: USD M
          detail: 向现有合作伙伴基础追加销售 MDR、XDR 及 GenAI 防护模块带来的增量扩张机会。
        - label: 受保护终端客户覆盖
          value: 750
          unit: USD M
          detail: 假设全球 750,000 多家受保护企业每年稳定扩张，对应的潜在基准收入。
        - label: 当前平台渗透率
          value: 426
          unit: USD M
          detail: 由 750,000 多家企业及 20,000 多家活跃服务商支撑的年度经常性收入基准。
    approximationNotes: 市场规模分层反映行业分析师对中端市场安全与备份基础设施支出的估算；ARR 基准以披露的运行率指标为锚。
