  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现机制与 GTM 分销
        blocks:
          - type: paragraph
            body: >-
              Acronis 主要通过间接、渠道主导的上市架构交付网络保护软件，服务超过 21,000 家活跃服务提供商，保护全球超过 750,000 家企业 [CI003, CI007]。商业变现围绕 Acronis
              Cyber Protect Cloud 展开，该平台把备份、灾难恢复、网络安全、终端管理和原生 AI 自动化整合在单一多租户平台中 [CI003,
              CI004]。服务提供商通过批发用量和订阅档位消费平台能力，使合作伙伴可以用很低甚至零前期成本为客户工作负载提供网络保护，同时向上销售 EDR、XDR 和 GenAI Protection 等模块化高级安全包
              [CI002, CI003, CI005]。其他商业收入包括面向企业 IT 的永久许可和本地订阅许可，以及 Acronis True Image 传统消费者备份 [CI009]。但由于 Acronis
              没有公开拆分合作伙伴实际平均收入、净收入留存或合同折扣安排，收入顶部的可见度仍依赖第三方估算 [CI001, CI006]。
