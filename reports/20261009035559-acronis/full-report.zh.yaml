      - number: '5.2'
        title: 模块化 SKU 架构与部署模式
        blocks:
          - type: paragraph
            body: >-
              Acronis 技术的商业交付依托模块化 SKU 结构，使 MSP 合作伙伴能够扩展服务而不承担基础设施开销。核心产品 Acronis Cyber Protect Cloud
              捆绑基础数据备份和网络安全能力，同时允许服务提供商启用覆盖高级备份、高级灾难恢复、高级安全和管理能力的保护包 [CE006]。对运营自有数据中心，或在商业许可变化后寻求 VMware
              替代方案的服务提供商，Acronis 提供两个版本的 Acronis Cyber Frame：Cyber Frame Cloud 按用即付，直接从区域 Acronis 数据中心配置虚拟机和存储；Cyber
              Frame Local 则把本地 x86 服务器集群改造成自托管多租户 IaaS 平台 [CE007]。Cyber Frame Local 内置原生 KVM
              虚拟机监控器、软件定义存储和软件定义网络，运行在优化后的 OpenStack 基础上，从而无需依赖专有虚拟机监控器堆栈 [CE008]。与此同时，消费者产品线 Acronis True Image
              面向单设备环境，提供磁盘克隆、本地备份和基础勒索软件回滚，并与 MSP 多租户控制隔离 [CE009]。
