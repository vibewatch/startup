  - id: FV001
    title: 估值与建议决策链
    type: flow
    summary: 从运营证明出发，经风险评估，最终落到“继续研究”的投资判断的顺序决策链。
    data:
      nodes:
        - id: channel-scale
          label: 渠道规模（21k 以上 MSP、750k 以上客户）
        - id: product-breadth
          label: 产品范围（备份、EDR、自动化）
        - id: financial-opacity
          label: 财务不透明（经审计指标未公开）
        - id: valuation-anchor
          label: 估值锚点（$3.5B Series C 轮估值）
        - id: secondary-illiquidity
          label: 二级市场流动性不足（没有活跃交易价格）
        - id: underwriting-stance
          label: 立场（继续研究 / 合理 / 高风险）
      edges:
        - from: channel-scale
          to: product-breadth
        - from: product-breadth
          to: financial-opacity
        - from: financial-opacity
          to: valuation-anchor
        - from: valuation-anchor
          to: secondary-illiquidity
        - from: secondary-illiquidity
          to: underwriting-stance
    approximationNotes: 流程图将观察到的规模与最终建议立场之间的定性投资判断逻辑串联起来。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV006
      - CV008
      - CV011
