    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、起源与统一网络保护架构
        blocks:
          - type: paragraph
            body: >-
              Acronis International GmbH 是一家私营全球软件厂商，专注于网络安全和数据保护，总部位于瑞士沙夫豪森；其集团根源可追溯至新加坡。公司由 Serg Bell（Serguei
              Beloussov）于 2003 年从 SWsoft（后更名为 Parallels）分拆创立。早期，公司凭借旗舰品牌 Acronis True Image
              在裸机磁盘镜像和工作站备份领域建立市场领先地位，随后转向云原生统一网络保护架构，将备份、灾难恢复、反恶意软件启发式检测、终端管理和 IT 自动化整合进单一代理。公司的商业模式高度依赖渠道分销：Acronis
              为遍布 150 多个国家的 21,000 多家服务提供商和托管服务提供商（MSP）提供支持，通过覆盖 26 种语言的 50 多个全球数据中心，保护约 750,000 家企业和企业客户。Acronis
              将产品组合分为两条主线：面向 MSP 和企业销售的 Acronis Cyber Protect Cloud，采用按工作负载、按 GB 或按解决方案计费的灵活消费模式；以及消费者品牌 True Image（前身为
              Cyber Protect Home Office）。此外，公司还提供 EDR/XDR、高级灾难恢复、电子邮件安全和 GenAI 保护等专项安全包。
