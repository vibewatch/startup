      - CM007
      - CM008
      - CM009
  - id: FP001
    title: 受证据约束的竞争定位图
    type: quadrant
    summary: 分析师赋予的序数位置用于比较产品组合广度与目标运营环境复杂度；不代表市场份额或产品质量评分。
    data:
      xAxis:
        label: 产品组合广度（1=专业型，5=集成型）
        low: 专业型
        high: 集成型
      yAxis:
        label: 目标环境复杂度（1=终端或 SMB，5=大型或异构企业）
        low: 终端或 SMB
        high: 大型或异构企业
      points:
        - label: Acronis
          x: 5
          'y': 3
          notes: Broad integrated scope with MSP, SMB, and enterprise positioning.
        - label: Veeam
          x: 3
          'y': 5
          notes: Backup-led platform oriented toward large virtualized estates.
        - label: Veritas NetBackup
          x: 2
          'y': 5
          notes: Specialized data protection for heterogeneous large enterprises.
        - label: Macrium
          x: 1
          'y': 3
          notes: Focused imaging and recovery for OT and long-lifecycle Windows systems.
        - label: Carbonite
          x: 1
          'y': 1
          notes: Simple cloud endpoint and small-server backup.
        - label: SentinelOne
          x: 2
          'y': 3
          notes: Endpoint-security specialist adjacent to Acronis's security scope.
    approximationNotes: 坐标是分析师依据保留的类别、能力及目标工作负载描述作出的序数判断。并非独立测量的评分，也未使用缺乏支持的属性。
