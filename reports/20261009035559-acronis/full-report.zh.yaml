            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV008
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV011
              - CV013
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 承销立场与入场纪律
            body: >-
              Acronis 的漏斗前端合作伙伴覆盖很强，拥有超过 21,000 家服务提供商，但机构投资者必须严格把住入场关。历史估值为
              $3.5B，却没有公开流动性或经审计财务披露，因此投资者应保持“继续研究”的立场，在承销前要求数据室完整透明。
            calloutType: recommendation
            claimRefs:
              - CV002
