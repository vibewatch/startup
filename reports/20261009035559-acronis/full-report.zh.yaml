      - number: '1.3'
        title: 运营规模、里程碑序列与联邦合规阻力
        blocks:
          - type: paragraph
            body: >-
              Acronis 通过定向技术收购扩大技术版图，包括 GroupLogic（2012 年）、BackupAgent 和 nScaled（2014 年）、5nine Software（2019 年），以及
              DeviceLock 和 CyberLynx（2020 年），由此完成从单点备份工具向全栈网络保护的转型。公司于 2017 年推出行为型反勒索软件保护（Active Protection）和区块链公证，并在
              2026 年推出平台增强功能，包括自动灾难恢复测试故障切换报告、合作伙伴级漏洞评估和按用户配置 SAML。然而，Acronis 面临实质性的合规与声誉阻力：2025 年 9 月 15
              日，美国国家情报总监（DNI）依据联邦采购安全委员会（FASC）建议，按照 FAR Subpart 4.23 对 Acronis 产品发布了针对美国情报共同体的排除和移除令。尽管 FASC 和 DNI 均未指出
              Acronis 软件存在具体技术漏洞，且美国情报系统以外的商业运营不受影响，但该排除令仍给联邦合同和受监管采购渠道带来摩擦。
