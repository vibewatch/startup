      - number: '3.3'
        title: 公开定价只能指示方向，达不到采购标准
        blocks:
          - type: paragraph
            body: >
              保留的公开定价证据在计价单位和方法上并不一致。ITQlick 列出的 Acronis 起价为每台工作站 $69，而其比较表展示了宽泛的年度区间，并将若干竞争对手数字标注为基于公开 2026
              年数据的估算。同一来源估计，在所比较的配置中，Veeam 比 Acronis 高 15% 至 30%，Carbonite 比 Acronis 低 10% 至 20%。CyberSentriq
              为一款按年支付的电子邮件安全组合包公布了每用户每月 $3.74 的价格，但该套餐并不等同于完整的 Acronis 套件。这些数字仅适合用于了解产品打包方向；实际 MSP
              折扣、存储用量、增值安全模块、支持层级和多租户分配均未公开，因此无法据此得出可用于采购的价差。
            claimRefs:
              - CP012
