      - number: '6.3'
        title: Named Customer Proof and Production Deployments
        blocks:
          - type: paragraph
            body: >-
              Public customer references and independent procurement records demonstrate that Acronis Cyber Protect
              Cloud is deployed in critical production workflows across regulated commercial and industrial sectors. In
              financial services, regional institutions such as Anderson Brothers Bank deployed Acronis Cyber Protect
              Cloud across 26 branches and more than 350 employee workstations, integrating backup imaging into Active
              Directory infrastructure and branch hardware estates including ATMs and surveillance recorders. In
              industrial and enterprise sectors, organizations such as BHPetrol implemented centralized backup
              orchestration across national depot locations and data centers supporting mission-critical SAP
              environments, while global consumer manufacturer Caffitaly protects hybrid on-premise and Microsoft 365
              environments across more than 400 staff endpoints. Production case studies published through vendor and
              distributor channels across 2026 highlight customer operational outcomes including 350% product adoption
              acceleration for Nord Security business suites and zero backup downtime for industrial operational
              technology deployments like Mevis. Despite these reference deployments, public accounts skew heavily
              toward centralized backup and disaster recovery use cases, with comparatively sparse public enterprise
              case studies documenting end-to-end displacement of incumbent enterprise-scale EDR vendors.
            claimRefs:
              - CU003
              - CU004
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
