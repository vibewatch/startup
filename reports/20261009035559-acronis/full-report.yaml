              - CR004
              - CR007
              - CR008
              - CR013
              - CR015
      - number: '7.3'
        title: Partner Channel Concentration and Governance Dependencies
        blocks:
          - type: paragraph
            body: >-
              Acronis relies predominantly on a two-tier indirect go-to-market model comprising more than 20,000 managed
              service providers and service distributors serving approximately 750,000 business accounts worldwide. This
              distribution model introduces significant channel concentration and execution dependencies: MSPs control
              customer retention and endpoint tiering, but mixed feedback regarding vendor support responsiveness and
              complex subscription licensing risks partner churn. On corporate governance, the majority acquisition by
              Swedish private equity firm EQT (announced in August 2024 at an implied USD 3.5B enterprise value and
              closing in 2025) installed EQT leadership representation on the board alongside Chairman Warren Adelman
              and CEO Jan-Jaap Jager. However, the complete absence of publicly disclosed audited financial statements,
              EBITDA margin schedules, or cash burn metrics leaves underwriting models dependent on qualitative proxies
              and third-party scoring (such as RFP.wiki's 3.5/5 EBITDA rating).
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The FASCSA Order Creates Unprecedented Downstream Headwinds
            body: >-
              The landmark DNI exclusion order under FASCSA represents a major tail-risk event for Acronis. Even if
              immediate direct revenue loss within the U.S. Intelligence Community is manageable relative to global
              billings, the mandate for federal contractors under FAR 52.204-30 to report and remediate Acronis
              deployments creates administrative friction that could prompt broad federal and enterprise displacement.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Recommendation, and Stance
        blocks:
          - type: paragraph
            body: >-
              Acronis presents a compelling platform consolidation thesis anchored in MSP-first distribution, combining
              backup, disaster recovery, cybersecurity, and endpoint management across more than 21,000 service
              providers and 750,000 corporate clients globally [CV002, CV003]. The company's architectural shift toward
              a unified data model across security and operational workflows addresses critical channel partner pain
              points by reducing agent sprawl and administrative overhead [CV004]. However, the anti-thesis is equally
              substantial: Acronis operates as an opaque private entity without audited revenue, gross margins, cash
              burn, or net revenue retention in the public domain [CV005, CV013]. Consequently, underwriting an
              institutional position today requires an explicit 'research-more' recommendation, medium confidence, high
              risk rating, and a 'fair' valuation stance [CV005]. While historical funding rounds established baseline
              valuations of $2.5B in 2021 led by CVC Capital Partners and $3.5B in 2022 led by BlackRock, institutional
              entry discipline necessitates verifying current recurring revenue scale before committing capital [CV001,
              CV008, CV013].
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV008
              - CV013
      - number: '8.2'
        title: Financing History and Private Secondary Liquidity
        blocks:
          - type: paragraph
            body: >-
              Acronis has accumulated approximately $658 million across five identified financing rounds since its
              founding in Singapore, progressing from early institutional backing by Insight Partners to major growth
              equity rounds led by Goldman Sachs, CVC Capital Partners, and BlackRock [CV008, CV009, CV010]. In May
              2021, Acronis announced securing more than $250 million led by CVC Capital Partners VII at a valuation
              exceeding $2.5 billion, accelerating international data center expansion and R&D staffing [CV001, CV007].
              By July 2022, BlackRock led an additional $250 million Series C transaction establishing a post-money
              valuation mark of $3.5 billion [CV008, CV010]. Despite this established capitalization history, secondary
              market tracking platforms Forge Global, EquityZen, and PM Insights report limited market liquidity, with
              no matched transaction prices, active trade volume, or verified share pricing available to pre-IPO
              investors as of 2026 [CV006, CV011, CV012]. Investors face significant illiquidity and preference overhang
              risks given the layered liquidation preferences of late-stage private equity rounds [CV005, CV013].
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV011
              - CV013
      - number: '8.3'
        title: Scenario Underwriting, Valuation Comps, and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              Evaluating Acronis across bull, base, and bear scenarios highlights substantial valuation dispersion
              governed by growth durability, operating leverage, and channel retention [CV014]. In the bull case,
              Acronis scales cyber protection cross-selling to achieve an IPO or premium private buyout at an enterprise
              value above $4.5B [CV014]. In the base case, steady mid-teens ARR expansion sustains fair value near the
              historical $3.5B post-money valuation mark [CV008, CV014]. Conversely, the bear case accounts for
              macroeconomic multiple contraction, partner churn, or enterprise supply-chain scrutiny that could depress
              valuation toward $2.2B [CV014]. Private secondary market indicators on Forge and EquityZen reflect an
              illiquid market where trading activity remains constrained, preventing market-driven price discovery
              [CV006, CV011, CV012]. The recommendation logic synthesizes scale evidence, governance and disclosure
              risks, and valuation discipline to guide institutional decision-making [CV002, CV005, CV013, CV014].
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV008
              - CV011
              - CV012
              - CV013
              - CV014
