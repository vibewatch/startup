      - number: '1.2'
        title: Governance, Executive Transitions, and Capital Structure
        blocks:
          - type: paragraph
            body: >-
              Acronis operates under a private equity-backed governance structure following successive institutional
              funding rounds and consequent control shifts. In September 2019, Goldman Sachs led a $147 million
              investment at a valuation surpassing $1 billion. In May 2021, CVC Capital Partners led a $250 million
              equity round valuing Acronis at over $2.5 billion, which accelerated product expansion into anti-malware
              and cloud-native management. In August 2024, Swedish private equity house EQT agreed to acquire a majority
              stake in Acronis at an implied enterprise valuation of approximately $3.5 billion, with the transaction
              closing in 2025. Following the EQT acquisition, governance consolidated around Chairman Warren Adelman and
              EQT Partner Johannes Reichel, alongside continuing board representation from CVC Capital Partners (Daniel
              Williamson) and Springcoast Partners (Holger Staude). Operating leadership transitioned from founder
              Serguei Beloussov to Ezequiel Steiner, and subsequently to CEO Jan-Jaap Jager in 2025. While founder-led
              engineering DNA remains influential, the executive bench reflects institutional PE stewardship designed to
              drive operational scaling and strategic expansion.
            claimRefs:
