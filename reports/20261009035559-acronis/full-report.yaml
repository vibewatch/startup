      - number: '6.4'
        title: Retention Durability, Security Vulnerabilities, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Customer retention in the Acronis model is fundamentally mediated by channel partner health and technical
              integrity. In the consumer and digital subscription stream, automated renewal infrastructure managed by
              cleverbridge demonstrated a 19% improvement in renewal rates over a six-year horizon, supported by
              automated quote-to-cart workflows. In the commercial B2B domain, service providers report significant
              administrative efficiency gains through unified multi-tenant consoles, leading to Leader recognition
              across seven G2 Fall 2026 Grid categories including MDR, RMM, Cloud Security, and SaaS Backup. However,
              operational durability faces substantial adverse headwinds. In September 2026, security researchers
              confirmed in-the-wild exploitation of CVE-2026-87886, a high-severity local privilege-escalation
              vulnerability affecting Acronis Backup plugins for cPanel and Plesk Linux hosting servers, threatening
              multi-tenant hosting environments. Furthermore, the September 2025 FASCSA exclusion and removal order
              issued by the U.S. Director of National Intelligence excluded Acronis products from Intelligence Community
              systems and GSA Advantage procurement schedules, introducing severe federal contractor compliance
              liabilities under FAR 52.204-30 and establishing enterprise procurement friction across security-sensitive
              public and defense-adjacent customer segments.
            claimRefs:
              - CU002
              - CU006
              - CU010
              - CU011
              - CU012
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Massive Multi-Tier Distribution Engine
            body: >-
              With over 21,000 active service providers and 50,000 global partners protecting 750,000 businesses,
              Acronis possesses an expansive channel distribution moat that insulates it from direct enterprise sales
              cycle volatility.
            calloutType: strength
