      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting Stance and Entry Discipline
            body: >-
              Acronis demonstrates impressive top-of-funnel partner reach with over 21,000 service providers, yet
              institutional investors must maintain strict entry discipline. With historical valuation marks at $3.5B
              but zero public liquidity or audited financial disclosures, investors should maintain a 'research-more'
              stance and require full data-room transparency before underwriting.
