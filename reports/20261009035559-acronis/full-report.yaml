  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Workload Scope, and Spend Classification
        blocks:
          - type: paragraph
            body: >
              The addressable market for Acronis sits at the convergence of three traditionally fragmented
              infrastructure software sectors: backup and disaster recovery (BDR), endpoint protection and response
              (EDR/MDR), and remote IT systems management (RMM/patch management). Historically, managed service
              providers (MSPs) and small-to-midsize businesses (SMBs) procured these disciplines through separate
              software stacks, paying disparate license and maintenance fees to vendors like Veeam, VMware, CrowdStrike,
              and ConnectWise. Acronis bounds its addressable spend around "cyber protection"—a workload paradigm
              asserting that backup without proactive threat detection is vulnerable to modern ransomware, and endpoint
              security without rapid bare-metal rollback cannot guarantee cyber resilience.


              Included spend encompasses cloud-managed endpoint protection, server and virtual machine image backup,
              Microsoft 365 / SaaS application archiving, disaster recovery orchestration, continuous vulnerability
              assessment, and outsourced managed detection and response (MDR). Conversely, Acronis explicitly excludes
              enterprise-grade mainframe data management, proprietary storage area network (SAN) replication hardware,
              and high-end security information and event management (SIEM) data lakes, positioning those workloads as
              adjacent enterprise domains. Status-quo substitutes remain widespread: thousands of smaller IT shops still
              rely on native operating system tools (such as Windows Server Backup and Microsoft Defender), unmanaged
              point utilities, or disjointed open-source scripts. This fragmented baseline represents Acronis's primary
              replacement opportunity, yet displacing it requires convincing budget owners that agent consolidation
              delivers superior unit economics and lower administrative overhead than multi-vendor stacks.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM010
      - number: '2.2'
        title: Market Sizing, Category Distribution, and Realistic Reach
        blocks:
          - type: paragraph
            body: >
              Quantifying the market for Acronis requires examining multiple sizing lenses rather than accepting an
              unconstrained top-down figure. Independent technographic telemetry from 6sense estimates Acronis's
              installed presence in the core backup and recovery category at 12,159 customer domains globally,
              representing approximately a 6.64% estimated market share and placing the vendor third behind Veeam
              (21.34%) and VMware Disaster Recovery (14.19%). In a narrower standalone backup taxonomy, 6sense
              identifies 1,935 customer domains for Acronis Backup, yielding a 6.30% market share behind hyperscaler
              utilities such as AWS Backup (22.58%), SolarWinds Backup (18.21%), and enterprise vendor Rubrik (11.18%).
              These figures illustrate substantial category penetration, yet they also highlight the structural
              difficulty of dislodging entrenched enterprise incumbents.


              To rigorously evaluate revenue potential, sizing must be stratified across total market demand,
              channel-accessible spend, and immediate serviceable capacity. The total addressable market (TAM) spans
              global SMB and mid-market spend on endpoint protection, SaaS backup, and disaster recovery. However,
              Acronis's serviceable addressable market (SAM) is effectively governed by organizations consuming IT
              infrastructure through outsourced service providers or seeking unified multi-tenant architectures. The
              serviceable obtainable market (SOM) is further constrained by Acronis's current channel partner base of
              over 20,000 active service providers protecting approximately 750,000 businesses worldwide. Growth in this
              SOM depends on expanding revenue per protected workload and driving adoption of higher-margin modular
              add-ons such as 24/7 Managed Detection and Response (MDR) and generative AI security governance.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
          - type: figure
            figureRef: FM001
            claimRefs:
