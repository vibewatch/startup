chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Origins, and Unified Cyber Protection Architecture
        blocks:
          - type: paragraph
            body: >-
              Acronis International GmbH is a privately held global software vendor specializing in cybersecurity and
              data protection, headquartered in Schaffhausen, Switzerland, with corporate group roots tracing back to
              Singapore where it was founded in 2003 by Serg Bell (Serguei Beloussov) as a spin-off from SWsoft (later
              Parallels). The company initially established market leadership in bare-metal disk imaging and workstation
              backup under its flagship Acronis True Image brand before pivoting toward an integrated, cloud-native
              cyber protection architecture that consolidates backup, disaster recovery, anti-malware heuristics,
              endpoint management, and IT automation into a single agent. The company’s commercial model is heavily
              anchored in channel distribution: Acronis powers over 21,000 service providers and managed service
              providers (MSPs) across 150+ countries, protecting approximately 750,000 businesses and enterprise clients
              through 50+ global data centers supporting 26 languages. Acronis structures its portfolio into two
              principal lines: Acronis Cyber Protect Cloud, sold to MSPs and enterprises through flexible consumption
              models (per-workload, per-GB, or solution-based), and its consumer brand True Image (formerly Cyber
              Protect Home Office), while offering specialized security packs spanning EDR/XDR, advanced disaster
              recovery, email security, and GenAI protection.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
