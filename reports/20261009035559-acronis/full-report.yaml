      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Channel Dynamics
        blocks:
          - type: paragraph
            body: >
              Adoption dynamics across the Acronis ecosystem are heavily dictated by a two-tier channel go-to-market
              structure. In the predominant Managed Service Provider (MSP) and Cloud Service Provider (CSP) segment, the
              economic buyer is the MSP owner, principal, or Chief Technology Officer, while the daily user is the
              tier-1/tier-2 systems engineer or support technician. In this model, the MSP acts as the payer, absorbing
              the wholesale software license or usage billing and packaging it into a bundled monthly per-seat or
              per-device recurring fee charged to their end-client SMB. The primary adoption triggers in this segment
              are technician labor efficiency, platform multi-tenancy, integration with Professional Services Automation
              (PSA) and RMM tools, and the consolidation of disparate security and backup consoles into a single glass
              pane.


              In contrast, the mid-market corporate IT segment features an internal IT Director or Chief Information
              Security Officer (CISO) as the economic buyer and payer, with internal sysadmins acting as users. In this
              environment, adoption is triggered by upcoming contract renewals of legacy backup systems, compliance
              mandates requiring immutable offsite archiving, or post-incident reviews following a ransomware scare.
              However, a major market friction point remains: unlike pure-play enterprise cybersecurity vendors such as
              CrowdStrike that offer transparent per-seat public pricing tiers, Acronis's public pricing pages for Cyber
              Protect and Cyber Protect Cloud return 404 errors, requiring prospective corporate buyers to navigate
              custom sales-led quoting processes.
            claimRefs:
              - CM001
              - CM006
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM006
              - CM010
              - CM012
      - number: '2.4'
        title: Catalysts for Acceleration and Structural Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              Market tailwinds for Acronis are propelled by the escalating frequency and sophistication of cyberthreats
              targeting distributed small-to-midmarket supply chains. Acronis Threat Research Unit telemetry
              demonstrates persistent threat pressure across global business endpoints, recording that 5.6% of unique
              monitored client endpoints had at least one malware threat blocked in July 2026, with persistent regional
              hotspots across focus countries including Singapore (10.2%), India (10.0%), and the United States (8.8%).
              Furthermore, complex supply-chain intrusions—such as the July 2026 Ernst & Young third-party tool
              compromise by the ShinyHunters extortion group—have heightened awareness that credential theft and SaaS
              collaboration tools expose client data to lateral movement. This threat environment drives demand for
              integrated MDR services that remediate critical endpoint incidents in as little as 15 minutes without
              requiring MSPs to staff internal 24/7 security operations centers.


              Conversely, several adoption constraints limit market velocity. Switching costs in core backup
              infrastructure are notoriously steep: migrating petabytes of historical backup archives across remote data
              centers introduces technical risk, high cloud egress costs, and significant administrative labor. Brand
              perception presents an additional hurdle: while Acronis has developed sophisticated AI-powered detection
              heuristics, many enterprise security leaders continue to view the vendor primarily as a heritage backup
              utility rather than an analyst-validated primary EDR platform. When evaluated directly against
              cybersecurity leaders like CrowdStrike, Acronis faces buyer skepticism regarding detection efficacy and
              lacks comparable independent review volume in mainstream enterprise software benchmarking directories.
            claimRefs:
              - CM006
              - CM010
              - CM011
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Console and Agent Consolidation as the Critical Channel Value Lever
            body: >
              For managed service providers operating on thin operational margins, the commercial value of Acronis lies
              primarily in technician efficiency rather than feature-by-feature parity with elite enterprise security
              tools. Deploying, updating, and monitoring separate agents for antivirus, backup, remote management, and
              vulnerability patching creates alert fatigue and unbillable labor. By unifying these capabilities into a
              single agent managed via a multi-tenant web console, Acronis enables MSPs to protect client endpoints with
              fewer labor hours per seat, directly defending service margins against rising technician wages.
            calloutType: insight
            claimRefs:
              - CM001
              - CM006
              - CM010
          - type: callout
            title: Pricing Inscrutability and Enterprise Trust Deficits Restrict Upmarket Flight
            body: >
              While Acronis thrives in the partner channel where wholesale pricing is negotiated behind closed doors,
              its enterprise go-to-market is constrained by lack of public pricing transparency and persistent buyer
              perception that it remains a secondary backup player in security. In competitive bake-offs against vendors
              like CrowdStrike—which publish clear per-seat tiers and boast deep analyst endorsement—Acronis struggles
              to win over dedicated security teams that prioritize best-of-breed endpoint detection over operational
              consolidation.
            calloutType: risk
            claimRefs:
              - CM006
              - CM011
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape Extends Beyond Backup Suites
        blocks:
          - type: paragraph
            body: >
              Acronis does not face one clean peer group. Tracxn identifies Rubrik, SentinelOne, and Druva as its top
              competitors and also places Veeam, F-Secure, Tanium, Cohesity, Webroot, and Keepit in its top-ten list.
              That set spans data resilience, endpoint security, cloud data protection, and consumer or small-business
              security rather than a single product category. The retained comparisons add specialist recovery tools,
              simple cloud endpoint backup, and free self-managed imaging software. Buyers can therefore replace only
              one Acronis function, assemble several products, or retain internal tooling instead of selecting another
              unified platform. This broad substitute set raises the standard for any claim that Acronis has a
              category-wide moat.
            claimRefs:
              - CP001
              - CP002
              - CP015
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
