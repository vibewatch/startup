figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Key corporate, product, capital formation, and regulatory milestones in Acronis's trajectory from 2003 founding to
      2026 cloud-native cyber platform operations.
    data:
      items:
        - date: '2003-01-01'
          label: Company Founded
          detail: Founded in Singapore by Serg Bell as a spin-off from SWsoft, launching disk imaging and backup solutions.
          tone: neutral
        - date: '2008-01-01'
          label: Swiss Corporate Reincorporation
          detail: Incorporated in Schaffhausen, Switzerland, establishing dual European corporate and Singapore operations.
          tone: neutral
        - date: '2012-09-10'
          label: GroupLogic Acquisition
          detail: Acquired GroupLogic to expand into enterprise mobile file access, sync, and secure enterprise sharing.
          tone: positive
        - date: '2017-01-18'
          label: Anti-Ransomware & Blockchain Launch
          detail: Released True Image 2017 New Generation with Active Protection and Notary blockchain notarization.
          tone: positive
        - date: '2019-09-18'
          label: Goldman Sachs $147M Round
          detail: Raised $147 million led by Goldman Sachs, attaining unicorn valuation exceeding $1 billion.
          tone: positive
        - date: '2021-05-04'
          label: CVC $250M Investment at $2.5B+
          detail: Raised $250 million led by CVC Capital Partners, valuing Acronis at over $2.5 billion.
          tone: positive
        - date: '2024-08-07'
          label: EQT Majority Buyout Announced
          detail: >-
            Agreed to sell majority equity stake to Swedish private equity firm EQT at an implied $3.5 billion
            valuation.
          tone: positive
        - date: '2025-08-20'
          label: EQT Deal Closed & CEO Transition
          detail: Closed EQT transaction and appointed Jan-Jaap Jager as CEO, succeeding Ezequiel Steiner.
          tone: neutral
        - date: '2025-09-15'
          label: U.S. DNI FASCSA Exclusion Order
          detail: U.S. DNI ordered removal of Acronis products from U.S. intelligence community systems under FAR 4.23.
          tone: negative
        - date: '2026-01-15'
          label: Cyber Protect Cloud January 2026 Update
          detail: Rolled out automated DR test failover reporting, partner vulnerability management, and SAML provisioning.
          tone: positive
    approximationNotes: Exact calendar day for corporate incorporation in 2008 and 2003 founding is normalized to January 1.
