      - number: '3.3'
        title: Public Pricing Is Directional, Not Procurement-Grade
        blocks:
          - type: paragraph
            body: >
              The retained public pricing evidence is inconsistent in unit and methodology. ITQlick lists Acronis as
              starting at $69 per workstation, while its comparison table shows broad annual ranges and labels several
              competitor figures as estimates based on public 2026 data. The same source estimates Veeam at 15% to 30%
              above Acronis and Carbonite at 10% to 20% below it for the configurations being compared. CyberSentriq
              publishes a $3.74 per-user monthly price for one annually paid email-security bundle, but that package is
              not equivalent to the full Acronis suite. These figures are useful for packaging orientation only;
              realized MSP discounts, storage consumption, add-ons, support, migration, and contract terms remain
              unavailable.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.4'
        title: The Moat Is Operational Rather Than Exclusive
        blocks:
          - type: paragraph
            body: >
              The evidence supports an operational moat, not an exclusive technology moat. A large service-provider base
              and a unified control plane can create workflow, training, billing, and migration friction once an MSP
              standardizes on Acronis. However, the retained evidence does not quantify renewal rates, multi-homing,
              competitive win rates, or migration costs. Competitor-issued comparisons argue that the all-in-one agent
              can impose resource and connectivity trade-offs in operational-technology environments, and one recent
              Capterra reviewer similarly described resource use, scale pricing, and console complexity as drawbacks.
              Those sources are useful adverse signals but are not independent benchmarks. Specialist vendors can
              displace individual workloads without replacing the entire platform, limiting the durability of breadth
              alone.
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Consolidation Can Become Its Own Displacement Vector
            body: >-
              Acronis's breadth can lower tool-management overhead for MSPs, but buyers that prioritize deterministic
              recovery, air-gapped operation, or a narrowly optimized workload can choose specialist products without
              adopting another all-in-one suite.
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Monetization Mechanics, and GTM Distribution
        blocks:
          - type: paragraph
            body: >-
              Acronis delivers cyber protection software primarily through an indirect, channel-led go-to-market
              architecture serving more than 21,000 active service providers and protecting over 750,000 businesses
              worldwide [CI003, CI007]. Commercial monetization centers on Acronis Cyber Protect Cloud, which combines
              backup, disaster recovery, cybersecurity, endpoint management, and AI-native automation into a single
              multitenant platform [CI003, CI004]. Service providers consume platform capabilities via wholesale usage
              and subscription tiers—enabling partners to deliver cyber protection for customer workloads with little to
              no upfront cost, while upselling modular advanced security packs such as EDR, XDR, and GenAI Protection
              [CI002, CI003, CI005]. Complementary commercial streams include perpetual and subscription on-premises
              licensing for corporate IT and legacy consumer backup via Acronis True Image [CI009]. However, because
              Acronis does not publicly unbundle realized average revenue per partner, net revenue retention, or
              contract discounting schedules, top-line visibility remains dependent on third-party estimates [CI001,
              CI006].
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
              - CI009
