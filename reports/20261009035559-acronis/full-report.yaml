  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Regulatory and Supply Chain Governance: FASCSA Exclusion Fall-out'
        blocks:
          - type: paragraph
            body: >-
              The regulatory and compliance posture of Acronis AG underwent a structural negative shift on September 15,
              2025, when the Office of the Director of National Intelligence published the first-ever exclusion and
              removal order under the Federal Acquisition Supply Chain Security Act of 2018 (FASCSA). The binding order
              barred executive branch intelligence community agencies from procuring Acronis software and services and
              mandated the physical removal of Acronis products from intelligence community and sensitive compartmented
              information systems. Following the DNI action, the General Services Administration promptly removed
              Acronis products from GSA Advantage and alerted federal contractors to FAR 52.204-30 compliance
              obligations. While Acronis continues to target regulated commercial sectors—evidenced by marketing for
              pharmaceutical manufacturing under EU NIS 2, FDA 21 CFR Part 11, and IEC 62443-4-1 certifications—the
              undisclosed substantive rationale behind the classified FASCSA determination introduces severe contagion
              risks across broader federal civilian, defense, and allied procurement channels.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
      - number: '7.2'
        title: Operational, Product Quality, and Detection Limitations
        blocks:
          - type: paragraph
            body: >-
              Acronis positions its unified cyber protection architecture around continuous cyber resilience, yet
              independent benchmarking and field telemetry reveal clear operational trade-offs and quality
              vulnerabilities. In a rigorous 100-test comparative email security benchmark conducted by AIMultiple
              across 11 threat categories, Acronis Email Security scored 122 out of 200, achieving 100% detection
              against advanced GenAI phishing but slipping to 44% detection on basic bulk spam (such as pharmaceutical
              and lottery scams). Furthermore, customer reviews and procurement evaluations synthesized by RFP.wiki
              highlight that while day-to-day backup workflows achieve an uptime score of 4.2 out of 5 and strong CSAT
              (4.5/5), users repeatedly experience support responsiveness friction, performance degradation under heavy
              workload loads, and unexpected storage cost creep. Telemetry from the Acronis Threat Research Unit in
              August 2026 demonstrates that 5.6% of unique endpoints encounter blocked malware monthly, while external
              supply-chain extortion groups like ShinyHunters continue to compromise enterprise SaaS and DevOps
              platforms, underlining the constant exposure of centralized IT tools.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
