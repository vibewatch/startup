      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Consolidated Single-Agent Footprint
            body: >-
              Acronis differentiates technically in the crowded cybersecurity and disaster recovery market by delivering
              backup, behavioral anti-malware, and patch management through a single agent rather than fragmented
              software packages, significantly reducing operational friction for MSP technicians.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
          - type: callout
            title: Third-Party SaaS and Tooling Supply-Chain Vulnerability
            body: >-
              Recent cyberthreat intelligence highlights that threat actors increasingly target third-party DevOps,
              ticketing, and IT service management platforms to compromise client infrastructure, making API
              integrations and credential hygiene a primary security exposure point for platform adopters.
            calloutType: risk
            claimRefs:
              - CE005
              - CE010
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Partner Channel Architecture
        blocks:
          - type: paragraph
            body: >-
              Acronis distributes its cyber protection, data recovery, and IT automation solutions primarily through a
              two-tier channel architecture designed for managed service providers (MSPs), cloud service providers, and
              telecommunications distributors, rather than direct high-touch enterprise direct sales. Company
              disclosures report a global footprint encompassing more than 21,000 active service providers delivering
              protection to upwards of 750,000 business entities across 150 countries and 50 cloud data center
              facilities. In parallel with this commercial MSP core, Acronis maintains a direct-to-consumer and
              micro-business e-commerce subscription engine managed via cleverbridge, supporting over 5.5 million home
              users with True Image and Cyber Protect Home Office suites. Commercial buyers stratify into three primary
              tiers: tier-one regional and national MSPs delivering fully managed Backup-as-a-Service (BaaS) and
              Endpoint Detection and Response (EDR) to resource-constrained small and medium businesses; mid-market
              enterprises deploying hybrid cloud backup alongside Active Directory and virtualization stacks; and
              consumer home-office endpoints. Strategic channel reliance delegates end-customer tier-one support and
              relationship ownership to local partners, creating extensive geographic reach while obscuring
              customer-level contract terms, net revenue retention rates, and account-level unit economics from external
              diligence.
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption Trajectory, Workload Expansion, and Deployment Dynamics
        blocks:
          - type: paragraph
            body: >-
              The adoption trajectory of Acronis Cyber Protect Cloud reflects a clear transition from point
              backup-and-imaging utility software toward integrated security and IT operations consolidation. Channel
              telemetry and vendor operational reports indicate that partner adoption is increasingly led by
              consolidated security bundles—integrating AI-guided endpoint detection, patch management, email security,
              and disaster recovery into an autonomous IT framework. Mid-2026 threat telemetry reveals active endpoint
              agent operations across millions of endpoints globally, with normalized client detection rates indicating
              monthly threat mitigations across 5.6% of unique corporate clients. Independent market database records
              compile multi-year production deployments across banking, manufacturing, energy, and non-profit accounts,
              where organizations frequently initiate adoption with workstation imaging and server backup before
              expanding into hybrid cloud and multi-tenant virtualization protection. However, because Acronis reports
              aggregate partner counts and protected corporate entities without publishing audited annual recurring
              revenue (ARR), gross retention, or cohort-based expansion metrics, true organic expansion cannot be
              independently decoupled from pricing adjustments and distributor inventory absorption.
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
