      - number: '1.3'
        title: Operating Scale, Milestone Sequence, and Federal Compliance Headwinds
        blocks:
          - type: paragraph
            body: >-
              Acronis expanded its technological footprint through targeted technology acquisitions, including
              GroupLogic (2012), BackupAgent and nScaled (2014), 5nine Software (2019), and DeviceLock and CyberLynx
              (2020), cementing its transition from point backup utilities to full-stack cyber protection. The company
              introduced behavioral anti-ransomware protection (Active Protection) and blockchain notarization in 2017,
              and rolled out platform enhancements in 2026 including automated disaster recovery test failover
              reporting, partner-level vulnerability assessment, and per-user SAML provisioning. However, Acronis faces
              material compliance and reputational headwinds: on September 15, 2025, the U.S. Director of National
              Intelligence (DNI) issued an exclusion and removal order under FAR Subpart 4.23 against Acronis products
              across the U.S. Intelligence Community based on a Federal Acquisition Security Council (FASC)
              recommendation. Although neither FASC nor DNI identified specific technical vulnerabilities in Acronis
              software, and commercial operations outside U.S. intelligence remain unaffected, the exclusion creates
              friction for federal contracting and regulated procurement channels.
