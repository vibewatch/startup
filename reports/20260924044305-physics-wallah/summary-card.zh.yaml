  topStrengths:
    - 大众化定价与广泛的应试覆盖，让 PW 在印度教育科技行业拥有规模靠前的可触达生源池。
    - 创始人兼教师的品牌号召力格外突出，持续带动信任、转化与转介绍。
    - 贯穿 YouTube、App 与线下中心的混合分发网络，打通了多条变现路径。
    - 上市身份与扎实的资本基础，让公司的治理更完善、资金跑道也长于多数教育科技同行。
  topRisks:
    - 创始人依赖度仍处高位，Alakh Pandey 个人品牌若受损，将迅速传导至业务基本面。
    - 在家长付费模式下，消费者权益监管审查与退款投诉容易演变成焦点事件。
    - 留存率、续费率与单体经济学披露仍不完整，利润质量难以做出投资判断。
    - 线下网点扩张与规模复杂度上升，一旦执行脱节就会侵蚀盈利能力。
  unresolvedGaps:
