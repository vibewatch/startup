summary:
  headline: >
    Physics Wallah is a real public-market edtech asset with strong brand and scale, but the current evidence base is
    still too thin on retention, margins, and cohort quality to justify more than a track stance.
  overallScore: 6.4
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: fair
