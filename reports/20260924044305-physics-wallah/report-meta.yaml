  topStrengths:
    - >-
      Mass-market affordability and broad exam coverage give PW one of the largest reachable learner pools in Indian
      edtech.
    - The founder-teacher brand is unusually strong and still drives trust, conversion, and referral.
    - Hybrid distribution across YouTube, app, and offline centres creates multiple paths to monetization.
    - >-
      Public listing and a strong capital base give the company more governance depth and runway than the average edtech
      peer.
  topRisks:
    - Founder dependence is still high, so any damage to Alakh Pandey's brand would hit the company fast.
    - Consumer-regulatory scrutiny and refund complaints can become headline issues in a parent-paid business.
    - Retention, renewal, and unit-economics disclosure remain incomplete, making margin quality hard to underwrite.
    - Offline expansion and scale complexity can erode profitability if execution slips.
  unresolvedGaps:
    - Audited cohort retention and renewal data by exam and channel.
    - Channel-level cash conversion and offline working-capital needs.
    - Teacher revenue-share, content-IP ownership, and succession planning.
    - A current public-market cap and float-based valuation benchmark.
