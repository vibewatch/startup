companyProfile:
  summary: >
    Physics Wallah is an Indian edtech company that started as Alakh Pandey's free YouTube teaching channel in 2016, was
    formalized with Prateek Maheshwari as co-founder in 2020, and is now a public company headquartered in Noida. It
    sells affordable exam-prep and upskilling through a hybrid stack of online courses, tests, notes, and offline
    centres. The company has raised roughly $275 million in disclosed funding, most recently $210 million in September
    2024 at a $2.8 billion valuation, and went public in November 2025.
