  - number: 4
    title: 财务表现
    sections:
      - number: '4.1'
        title: 收入模型与变现结构
        blocks:
          - type: paragraph
            body: >
              PW 通过线上课程、线下中心、模考题库、纸质资料及相关服务变现。官网和 Reuters 报道均显示，其面向大众市场定价，课程年费约从 $50 起，试图把 YouTube
              免费流量转成付费学员。收入并非来自单一订阅产品，而是由多个渠道共同构成。

              公开数据已显示，PW 的规模不再只是设想。Reuters 报道其有 5.5 million 名付费订阅用户；TechCrunch 称 FY23 营收为 $96.2 million，FY24 增至前一年的 2.5
              倍；Tracxn 最新快照显示 FY26 营收超过 ₹1,000 crore。这些数据口径并未汇总成一套经审计的模型，但足以说明 PW 已从创作者主导的业务成长为有一定规模的上市公司。
            claimRefs:
              - CI001
