companyProfile:
  summary: >
    Physics Wallah 是一家总部位于 Noida 的印度教育科技公司。Alakh Pandey 于 2016 年从 YouTube 免费教学频道起步，Prateek Maheshwari 于 2020
    年加入并成为联合创始人，公司由此走向正式运营。PW 通过线上课程、题库、讲义和线下中心提供平价应试培训与技能提升课程。公司披露的累计融资约为 $275 million；最近一轮融资于 2024 年 9 月完成，金额为 $210
    million，估值为 $2.8 billion。公司于 2025 年 11 月上市。
