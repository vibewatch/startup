        title: 财务披露盲区与估值核算边界
        blocks:
          - type: paragraph
            body: >
              财务尽调最大的限制不是没有收入数据，而是缺少足够细致、公开的单位经济性信息。公开来源显示 PW 已有一定规模、增长较快，私募估值也大幅上调，但未披露
              CAC、退款压力、按产品划分的留存率或各渠道盈利能力等队列数据。线上与线下教育业务的成本和收益可能差异很大，因此这些缺口比在纯 SaaS 公司更值得关注。

              因此，PW 是一家增长较快、但投资判断仍缺少完整依据的上市公司。营收规模、融资历程和资本基础相对清楚，尚不清楚的是利润率能否持续，以及线下业务需要占用多少营运资金。现阶段适合审慎跟踪，而不是简单外推增长。
