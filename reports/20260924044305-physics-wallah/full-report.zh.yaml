      - - 上市公司合规治理纪律
        - 披露要求提高招致更严审视
        - 投资者关系渠道与举报平台
        - 紧密合规日历与排期管理
    notes: |
      本清单采取审慎态度，重点梳理已公开的法律与监管风险。
    claimRefs:
      - CR001
      - CR002
      - CR007
    enumerationScope:
      coverage: sample
      basis: Selected regulatory, consumer, and refund-related risk items publicly visible today.
  - id: TR002
    title: 运营与安全风险清单
    columns:
      - 风险
      - 影响机制
      - 早期预警指标
      - 缓释举措
    rows:
      - - 直播课中断
        - 升学大考时间窗口对停机容忍度极低
        - 客服工单量激增
        - 容灾与系统弹性工程
      - - 访问控制失效
        - 学生数据与教学版权内容必须受到保护
        - 未授权访问事件
        - 启用 MFA 与策略加固
      - - 教学内容盗版
        - 课程泄露削弱变现能力
        - 水印篡改或账号外借问题
        - DRM 数字版权保护与盗版监测
      - - 线上线下混合系统复杂度
        - 线上与线下业务流程容易割裂脱节
        - 产品与交付体验不一致
        - 标准化运营手册
    notes: |
      运营风险基于合作伙伴案例与混合模式推断得出，非来源于已公开的安全事故日志。
    claimRefs:
      - CR003
      - CR004
      - CR010
  - id: TR003
    title: 人才与执行风险清单
    columns:
      - 风险
      - 影响机制
      - 跟踪信号
      - 缓释举措
    rows:
      - - 创始人个人集中度过高
        - 品牌高度依赖创始人个人 IP
        - 围绕名师的宣发集中
        - 扩充师资梯队并沉淀机构化 IP
      - - 组织文化与人员流失
        - 核心员工流失损害教学质量
        - 裁员或内部纠纷指控见诸媒体
        - 完善管理体系与流程
      - - 舆情口碑波动
        - 评价网站极易迅速放大客诉问题
        - 社区论坛负面舆论
        - 提升客诉响应速度与服务水平
      - - 接班人风险
        - 投资人需要创始人之外的业务持续性保障
        - 未见公开接班方案
        - 正式披露接班人计划
    notes: |
      本表为定性风险清单；信号列旨在帮助跟踪边际变化，而非提供精确量化指标。
    claimRefs:
      - CR005
      - CR006
      - CR008
      - CR012
  - id: TV001
    title: 投资建议汇总表
    columns:
      - 评估维度
      - 评估值
      - 核心依据
    rows:
      - - 投资建议
        - 观察
        - 具备优质增长属性，但披露信息仍存缺口
      - - 置信度
        - 中
        - 公开信号强劲，但利润率质量尚不完整
      - - 风险评级
        - 高
        - 创始人依赖、监管及续费留存风险真实存在
      - - 估值立场
        - 合理
        - 业务规模扎实；但高溢价倍数尚未完全确立
    notes: |
      本表特意将估值立场与投资建议拆开呈现。当标的具备重大战略价值时，即便是合理估值也依然值得保持观察。
    claimRefs:
      - CV009
      - CV010
  - id: TV002
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心成立前提
      - 估值影响
      - 下行触发因素
    rows:
      - - 乐观情景
        - 留存强劲、线下扩张高效、品牌实现机构化沉淀
        - 估值倍数有望扩张
        - 创始人及监管端未发生负面冲击
      - - 基准情景
        - 延续稳健增长、维持合理利润率、信息披露局部改善
        - 估值合理至偏正面
        - 执行节奏偏缓但业务并未受损
      - - 悲观情景
        - 续费率疲软、利润率走低、再度遭遇消费者舆论反弹
        - 估值倍数承压压缩
        - 出现重大信任危机
    notes: |
      鉴于公开记录尚未支撑完整的量化运营模型，本表情景分析采用定性评估。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 可比估值参考表
    columns:
      - 估值锚点
      - 数值
      - 属性类型
      - 解读
    rows:
      - - 2024 年 9 月私募轮融资
        - $2.8B
        - 一级市场定价
        - 最近一期清晰的估值锚点
      - - 2022 年 6 月融资轮
        - $1.1B
        - 前期一级市场定价
        - 反映公司估值重估节奏之快
      - - Tracxn 营收数据快照
        - '>₹1,000 crore 营收；15,000+ 员工'
        - 运营规模
        - 用于评估 2024 年估值定价偏低还是偏高
      - - 公开发行上市
        - 2025 年 11 月上市
        - 二级市场架构
        - 当前估值应锚定二级市场定价
    notes: |
      本表并非可比公司交易倍数，而是用于勾勒公司自身估值重估轨迹与现阶段披露质量的参考坐标。
    claimRefs:
      - CV001
      - CV002
      - CV003
figures:
  - id: FO001
    title: Physics Wallah 里程碑时间线（2016–2026）
    type: timeline
    summary: 梳理从创作者起家到上市公司规模的关键里程碑，涵盖各轮融资、线下扩张以及 2026 年 6 月的监管信号。
    data:
      items:
        - label: YouTube 频道开播
          date: '2016'
          detail: Alakh Pandey 开始为备考学生录制免费物理课。
          tone: positive
        - label: 公司正式设立
          date: '2020'
          detail: PW 成立正规实体运营，Prateek Maheshwari 出任联合创始人。
          tone: positive
        - label: 首次机构化扩张
          date: '2022'
          detail: 完成 Series A 融资晋升独角兽，加速推进线下与线上扩张。
          tone: positive
        - label: 线下与并购拓展
          date: 2022-2024
          detail: PW 扩建学习中心并收购相近赛道的教育资产。
          tone: positive
        - label: Series B 估值阶梯式跳升
