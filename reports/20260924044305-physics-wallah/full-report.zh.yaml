  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞品与邻近对手
        blocks:
          - type: paragraph
            body: >
              Unacademy、Vedantu、BYJU'S 等线上应试平台直接争夺同一笔备考支出。Allen 和 Aakash 等线下机构同样重要：它们在许多城市占据高端 JEE 和 NEET 培训市场，PW
              开设混合式中心后也必须与实体辅导机构正面竞争。TechCrunch 和 CNBC 均指出，PW 在行业走弱时仍在扩张；竞争不只看产品覆盖，也看谁能在融资转紧、留存承压时站稳脚跟。

              Tracxn 汇总的竞品名单也显示，赛道相当分散。PW 不仅要面对综合教育平台，也会受到新兴 AI
              教育工具和长尾备考渠道的分流；这些产品未必提供完整服务，却能争夺用户时间。竞品分析因此要同时看线上平台、线下机构和用户未必视作竞品的替代选择。
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: figure
            figureRef: FP001
            claimRefs:
