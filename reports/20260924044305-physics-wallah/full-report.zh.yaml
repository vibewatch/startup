chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 业务定位与运营规模
        blocks:
          - type: paragraph
            body: >
              Physics Wallah Limited 总部位于北方邦 Noida，通过 pw.live 面向消费者提供服务。公司称其覆盖 35+ 类考试、业务遍及 175+ 座城市，运营 100+ 个线下中心，并以
              YouTube 频道、讲义、模拟试卷和直播课支撑庞大的免费学习生态。第三方报道也显示，PW 已不再局限于单一线上渠道：Reuters 称其服务数千万学生，MongoDB 和 AWS
              的客户案例则将其描述为规模大、流量高的平台，对可靠性和安全性要求很高。

              各来源给出的客户数并不完全一致，这本身就是尽调信号。PW 官网强调广泛覆盖和免费内容；Reuters 报道其有 46 million 名学生和 5.5 million 名付费订阅用户，MongoDB 案例则称其有
              5.3 million 名付费用户、线上社区达 142 million 人。上市公司披露的这些数字不能互换，社区总规模只能作为方向性参考。投资判断应以经审计的财务数据和平台经济性为锚，而非依赖单一营销指标。
