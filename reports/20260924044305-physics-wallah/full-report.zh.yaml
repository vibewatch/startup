      - number: '4.2'
        title: 定价策略、资本结构与现金流需求
        blocks:
          - type: paragraph
            body: >
              定价是 PW 商业模式的核心。据 Reuters 报道，课程年费低至约 $50，价格亲民有助于扩大市场，但也要求公司实现足够大的转化量。CNBC 和 Reuters 均将公司的增长与 2024
              年融资及线下扩张相联系。行业融资紧张之际仍能融到资金，说明外部投资者看到了规模化发展的可能，而不只是认可其品牌。

              现在的核心问题已不是 PW 能否融资，而是能否把资金转化为有质量的盈利。公开资料显示 EBITDA 有所改善，但经营现金流转化、折扣对收入的影响和单客回收期等数据仍不够透明，外部投资者难以据此判断利润率。
            claimRefs:
