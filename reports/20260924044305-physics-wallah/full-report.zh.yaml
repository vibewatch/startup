              - CP003
      - number: '3.2'
        title: 差异化定位与替代威胁
        blocks:
          - type: paragraph
            body: >
              PW 的差异化来自低价、辨识度很高的教师品牌，以及贯通 YouTube 免费内容、App 付费课程和线下中心的混合渠道。Reuters 报道课程年费低至 $50
              左右，远低于高端线下辅导，因此适合对价格敏感的家庭。但低价本身不是护城河，还要有考试成果、稳定交付和学生愿意付费的内容。

              免费替代品始终存在。学生可以在 YouTube 免费观看 PW 内容、用本地辅导补充校内学习，或在冲刺阶段转向声誉更久的当地教练。PW
              要把便利性、测试训练和口碑整合成一个产品，才能胜出；若内容让用户感到疲乏，或创始人教师品牌减弱，其优势就会承压。
            claimRefs:
              - CP002
              - CP004
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP006
              - CP007
      - number: '3.3'
        title: 护城河韧性与竞争风险
        blocks:
          - type: paragraph
            body: >
              PW 的护城河不只在低价，还包括学生信任、内容积累，以及贯通线上线下的大众化交付体系。收购 FreeCo、iNeuron 和 Xylem Learning
              后，业务也延伸到社群、技能提升和区域市场。但这套优势还没有完全脱离创始人个人：Alakh Pandey 仍深刻影响用户认知，离职教师的公开批评或消费者负评都可能被竞品利用。

              PW 并非毫无防守能力，但竞争范围比简单的竞品名单更灵活。若能持续展示考试成果并维持低价，PW 有望继续快于同行增长；否则，用户很容易转向替代品，尤其是考试季更迭、学生重新选择课程时。
