      - number: '1.2'
        title: 领导层、股权结构与公司治理
        blocks:
          - type: paragraph
            body: >
              PW 仍高度依赖创始人。Alakh Pandey 是品牌的公众代表和核心教师，Prateek Maheshwari
              则是另一位联合创始人，参与融资与运营。这样的集中度不仅是文化问题，也关系到控制权与接班安排：产品分发、用户信任和学生认同都与创始人的声誉紧密相连。IPO
              前后，公司增设独立董事并设立正式合规职能，但治理仍由创始人主导，尚未分散到更广泛的机构体系。

              尽调不应只看董事会名单，还要判断商业模式在多大程度上依赖少数核心人物。融资条款、面向消费者的内容和增长叙事都显示，关键人物风险偏高。与一般软件公司相比，PW 更需要厘清接班安排、内容 IP 归属，以及 Alakh
              Pandey 个人影响力减弱后品牌能否延续。
