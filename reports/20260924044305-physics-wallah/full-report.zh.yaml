  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与采购决策链路
        blocks:
          - type: paragraph
            body: >
              PW 面对的不是笼统的“教育科技”市场，而是印度平价应试培训与技能提升市场。官网列出 JEE、NEET、UPSC、6–12 年级基础课程、公务员考试和技能提升等类别。Reuters 与 TechCrunch 将
              PW 描述为覆盖在校生、升学考试以及线上线下付费课程的大型平台。使用者和付款者常常不是同一人：学生上课，家长通常付费；学生年龄、考试目标或求职需求，则影响买家更看重价格还是考试结果。

              市场规模最终取决于渠道转化。YouTube 免费内容能带来关注，收入则要靠把用户转成题库、课程订阅、线下中心或辅导服务的付费客户。据 Reuters 报道，PW 年费低至 $50
              左右，因此既要与高端线下辅导竞争，也要面对免费的线上替代品。实际可服务市场应聚焦于有明确应试需求、能承担一定年度支出的印度家庭，而不是所有教育消费者。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
      - number: '2.2'
        title: 市场测算口径与需求驱动力
        blocks:
          - type: paragraph
            body: >
              最实用的市场规模参照，是 PW 通过线上和线下渠道能触达的印度学生与考生。TechCrunch 称印度约有 250 million 名在校生，每年约有 4 million 人参加工程和医学入学考试；Reuters
              报道 PW 服务 46 million 名学生、拥有 5.5 million 名付费订阅用户；官网称其覆盖 35+ 类考试、175+
              座城市。这些数字口径不同，不能直接相加；但即使扣除免费用户、转化损耗和地域限制，潜在市场仍然很大。

              需求主要由三点支撑：升学考试压力、平价课程和线上线下结合带来的便利。家庭购买课程看重考试结果，而不只是内容。另一面，用户对价格敏感，信任需要逐步建立，也可以转向免费 YouTube、本地辅导或老牌线下机构。PW
              的增长取决于能否把庞大潜在学员群转成持续付费队列，并证明低价模式也能带来可持续经济效益。
            claimRefs:
              - CM002
              - CM004
              - CM006
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM009
      - number: '2.3'
        title: 采纳制约因素、替代选项与尽调盲区
        blocks:
          - type: paragraph
            body: >
              买家重视熟悉教师品牌、可负担价格和明确考试结果时，PW
              的需求最强。线上课程、线下中心和咨询支持分别缓解不同采用障碍，但也带来风险：在价格敏感的市场，如果考试成绩不佳、考试政策变化或信任受损，学生可能转向传统机构或免费替代品。第三方报道也显示，PW 如今面对的是比
              2020–21 年更常态化的行业环境。

              尽调的关键不是市场够不够大，而是最容易转化的用户获取之后，还有多少人愿意在可盈利价格水平持续付费。与其只看一个 TAM 数字，不如分层评估可触达考试类别、付款者承受能力，以及结果导向转化情况。
            claimRefs:
              - CM007
              - CM008
              - CM011
              - CM012
