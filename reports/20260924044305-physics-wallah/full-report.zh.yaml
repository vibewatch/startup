      - number: '1.3'
        title: 融资历程、估值演进与关键里程碑
        blocks:
          - type: paragraph
            body: >
              PW 的估值快速上调：2022 年 Series A 轮估值约 $1.1B，2024 年 9 月 Series B 轮达到 $2.8B，2025 年 11 月 IPO 后成为公开市场标的。Reuters 和
              CNBC 均称，2024 年该轮由 Hornbill Capital 领投，Lightspeed、WestBridge 和 GSV 参投；Tracxn 数据库目前列出的累计融资额超过 $275M，FY26
              营收超过 ₹1,000 crore。PW 保留创始人主导的特征，同时也从风投支持的增长阶段转入上市公司审视。

              公司的发展脉络从 2016 年的 YouTube 起步，延伸至 2020 年正式设立公司、扩张线下中心、收购相关业务、2024 年融资，最终于 2025
