evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: Audited cohort retention, renewal, and cancellation data by product line.
    whyItMatters: >-
      The report can describe scale and pricing, but it cannot yet underwrite customer durability or churn economics
      without audited retention evidence.
    diligencePath: Obtain FY26 annual-report disclosures or management pack that breaks retention out by cohort and product.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: teacher-economics
    missingEvidence: Public disclosure of teacher revenue-share, content-IP ownership, and off-platform brand rights.
    whyItMatters: >-
      PW's content engine depends on teachers, but the contractual economics and IP durability are not publicly
      described.
    diligencePath: Review employment, contractor, and content-licensing terms in the filing data room or investor materials.
    relatedQuestionRefs:
      - QO006
  - type: stale
    severity: minor
    topic: public-market-valuation
    missingEvidence: Current traded market capitalization and free-float analysis after the IPO.
    whyItMatters: >-
      The latest fully disclosed private valuation is from 2024; current public-market pricing is materially more useful
      for valuation work.
    diligencePath: Pull the latest exchange market cap and share-count data from the listed-company filings.
    relatedQuestionRefs:
      - QO003
  - type: missing-source
    severity: minor
    topic: investor-map
    missingEvidence: A fuller public cap-table and post-IPO ownership breakdown for all major holders.
    whyItMatters: >-
      TO003 is intentionally partial; the report can map the control stack, but exact ownership percentages remain
      underdisclosed.
    diligencePath: Pull shareholding-pattern disclosures and investor-relations filings for the latest ownership bridge.
    relatedTableRefs:
