  - type: missing-source
    severity: material
    topic: cohort-sizing
    missingEvidence: Publicly audited cohort retention or renewal data by exam and channel.
    whyItMatters: >-
      Without cohort-level demand data, TAM-to-SOM translation remains a rough estimate rather than an
