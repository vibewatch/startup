chapter:
  number: 7
  title: Risks
  summary: 'Physics Wallah''s main risks sit in four buckets: founder concentration, consumer-regulatory scrutiny, operational complexity, and customer trust. The business is big enough that most of these risks are now listed-company issues rather than startup issues, and the most important question is whether the company can institutionalize quality fast enough to stay ahead of the public spotlight.

    '
sections:
- id: regulatory-and-consumer
  title: Regulatory and Consumer Risk
  body: 'The clearest external risk is consumer and regulatory scrutiny. PW''s terms are explicit that online batch purchases are non-refundable, and the June 2026 CCPA order shows the company can attract formal attention on consumer-treatment issues. For an education company that sells to parents and students under stress, refund policy, complaint handling, and service quality are not side issues; they can become the headline risk if expectations are not managed well.

    Regulatory risk is also broader than one order. Because PW serves minors and collects user data across a large platform surface, the company must keep consent, content-use rights, and complaint handling aligned with listed-company standards. The fact that the company has formal whistle-blower and investor-relations surfaces is helpful, but it does not eliminate the need for strong day-to-day compliance execution.

    '
  claimRefs:
  - CR001
  - CR002
  - CR007
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-and-security
  title: Operational and Security Risk
  body: 'PW''s scale creates operational risk. AWS and MongoDB both show a platform that has to manage large volumes of live traffic, complex content, and sensitive student data. That is good news for credibility, but it also means outages, content-piracy pressure, and data protection failures can hit many users at once. The AWS case study in particular shows the company had to harden access controls, DDoS defenses, and storage policies simply to keep the platform running securely at scale.

    The technical risk is compounded by the hybrid model. Online, offline, and counselling-style interactions all have different failure modes, and students will tolerate very little friction when exams are near. A minor engineering issue can therefore become a customer trust issue if it interferes with batches, tests, or access to materials. That makes uptime, access control, and content integrity core business risks rather than just IT concerns.

    '
  claimRefs:
  - CR003
  - CR004
  - CR008
  - CR009
  tableRefs:
  - TR002
- id: people-and-execution
  title: People, Brand, and Execution Risk
  body: 'PW still depends heavily on Alakh Pandey''s brand and on a small set of visible executives. The public narrative is powerful when outcomes are good, but the same visibility raises the penalty for any founder controversy, teacher departure, or perceived change in teaching quality. Wikipedia''s coverage of teacher allegations and layoffs, plus consumer-review pages, show that the company has already faced that kind of pressure before it fully matured as a listed business.

    The key execution question is whether PW can institutionalize the teaching brand without losing the authenticity that made it work. If not, rivals can turn sentiment against it very quickly. This is also where governance matters: the more the company relies on structured reporting, formal compliance, and teacher-IP discipline, the less vulnerable it becomes to a single-person shock.

    '
  claimRefs:
  - CR005
  - CR006
  - CR010
  - CR011
  - CR012
  tableRefs:
  - TR003
