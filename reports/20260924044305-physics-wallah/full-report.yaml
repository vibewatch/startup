      - Risk
      - Why it matters
      - Signal
      - Mitigation
    rows:
      - - Founder concentration
        - Brand is still person-led
        - Teacher-centric publicity
        - Expand teacher bench and IP
      - - Culture / attrition
        - Staff exits can hurt quality
        - Layoff or allegation headlines
        - Better management systems
      - - Sentiment volatility
        - Review sites can amplify issues quickly
        - Negative forums
        - Faster response and customer service
      - - Succession risk
        - Investors need continuity beyond the founder
        - No public transition plan
        - Formal succession disclosure
    notes: >
      This is a qualitative register; the signal column is meant to help the reader monitor changes rather than to
      measure them precisely.
    claimRefs:
      - CR005
      - CR006
      - CR008
      - CR012
  - id: TV001
    title: Recommendation Summary Table
    columns:
      - Field
      - Value
      - Why
    rows:
      - - Recommendation
        - track
        - Good growth asset, but disclosure gaps remain
      - - Confidence
        - medium
        - Public signals are strong, but margin quality is incomplete
      - - Risk rating
        - high
        - Founder, regulatory, and retention risks remain real
      - - Valuation stance
        - fair
        - Scale is real; premium multiple is not yet fully earned
    notes: >
      This table intentionally separates valuation stance from recommendation. A fair valuation can still be worth
      tracking when the business is strategically important.
    claimRefs:
      - CV009
      - CV010
  - id: TV002
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - What has to be true
      - Valuation implication
      - Downside trigger
    rows:
      - - Bull
        - Strong retention, efficient offline growth, institutionalized brand
        - Multiple can expand
        - Founder or regulatory shock absent
      - - Base
        - Continued growth, fair margins, partial disclosure improvement
        - Fair to slightly positive
        - Slow but not broken execution
      - - Bear
        - Weak renewal, margin decay, renewed consumer backlash
        - Multiple compresses
        - Any major trust fracture
    notes: |
      Scenario values are qualitative because the public record does not yet support a fully quantified operating model.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: Comparable Valuation Table
    columns:
      - Reference
      - Value
      - Type
      - Interpretation
    rows:
      - - September 2024 private round
        - $2.8B
        - Private mark
        - Most recent clear valuation anchor
      - - June 2022 round
        - $1.1B
        - Prior private mark
        - Shows how quickly the business re-rated
      - - Tracxn revenue snapshot
        - '>₹1,000 crore revenue; 15,000+ headcount'
        - Operating scale
        - Helps frame whether the 2024 mark was too cheap or too rich
      - - Public listing
        - Listed Nov 2025
        - Market structure
        - Current valuation should now be public-market based
    notes: >
      These are not trading comps. They are reference points for the company's own re-rating path and current disclosure
      quality.
    claimRefs:
      - CV001
      - CV002
      - CV003
figures:
  - id: FO001
    title: Physics Wallah Milestone Timeline (2016–2026)
    type: timeline
    layout: wide
    summary: >-
      Key milestones from creator-led origin to public-company scale, including financings, offline expansion, and the
      June 2026 regulatory signal.
    data:
      items:
        - label: YouTube channel begins
          date: '2016'
          detail: Alakh Pandey starts free physics lessons for exam aspirants.
          tone: positive
        - label: Company formalized
          date: '2020'
          detail: PW becomes a formal operating company with Prateek Maheshwari as co-founder.
          tone: positive
        - label: First institutional scale-up
          date: '2022'
          detail: Series A and unicorn status accelerate offline and digital expansion.
          tone: positive
        - label: Offline and acquisition expansion
          date: 2022-2024
          detail: PW expands centres and acquires adjacent learning assets.
          tone: positive
        - label: Series B valuation step-up
          date: 2024-09
          detail: $210M round values PW at $2.8B.
          tone: positive
        - label: IPO / public listing
          date: 2025-11
          detail: PW lists on Indian exchanges and becomes a public company.
          tone: positive
        - label: Revenue crosses ₹1,000 crore
          date: 2026-03
          detail: Tracxn current snapshot shows revenue above the threshold.
          tone: positive
        - label: CCPA order
          date: 2026-06
          detail: Consumer-regulatory scrutiny becomes explicit in public record.
          tone: adverse
