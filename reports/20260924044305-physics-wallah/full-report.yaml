chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Scale
        blocks:
          - type: paragraph
            body: >
              Physics Wallah Limited is headquartered in Noida, Uttar Pradesh, and markets its consumer product through
              pw.live. The company says it covers 35+ exam categories, runs 100+ offline centres, operates in 175+
              cities, and supports a large free-learning ecosystem across YouTube channels, notes, sample papers, and
              live classes. Third-party coverage is directionally consistent that PW has crossed the classic
              "single-channel" edtech model: Reuters describes a hybrid platform serving tens of millions of students,
              while MongoDB's customer case study and AWS's case study both frame PW as a high-scale, high-traffic
              platform with demanding reliability and security needs.

              The exact customer count is not perfectly aligned across sources, which is itself useful diligence signal.
              PW's own homepage emphasises broad reach and free content, Reuters cites 46 million students and 5.5
              million paying subscribers, and MongoDB's case study describes 5.3 million paid users and a 142 million
              online community. For a public company, that spread matters: it means investors should treat the top-line
              community numbers as directional rather than interchangeable and should anchor underwriting on audited
              financials and platform economics instead of any single marketing metric.
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO010
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO010
      - number: '1.2'
        title: Leadership, Ownership, and Governance
        blocks:
          - type: paragraph
            body: >
              PW remains strongly founder anchored. Alakh Pandey is still the public face of the brand and the core
              teaching asset, while Prateek Maheshwari is the other co-founder who appears in the primary funding and
              operating narrative. That concentration is not just a cultural point; it is a control and succession issue
              because the product's distribution, trust, and student affinity are all tightly linked to the founders'
              reputations. The company has strengthened its board in the run-up to and after the IPO, adding independent
              directors and a formal compliance function, but the governance story is still founder-led rather than
              institutionally dispersed.

              For diligence, the important observation is not merely who sits on the board, but how much of the
              commercial story depends on a small set of people. The term sheet, customer-facing content, and growth
              narrative all point to an unusually high key-person exposure. That makes transition planning, content-IP
              ownership, and the durability of the brand beyond Alakh Pandey more relevant than they would be for a
              conventional software business.
            claimRefs:
              - CO002
              - CO003
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO009
              - CO014
      - number: '1.3'
        title: Funding, Valuation, and Milestones
        blocks:
          - type: paragraph
            body: >
              PW's capital path shows a rapid re-rating: a 2022 Series A at roughly $1.1B, followed by a September 2024
              Series B at $2.8B, and then the November 2025 IPO that turned the company into a public market asset.
              Reuters and CNBC both tie the 2024 round to Hornbill Capital with participation from Lightspeed,
              WestBridge, and GSV, while Tracxn now lists cumulative funding above $275M and revenue above ₹1,000 crore
              as of FY26. The broader message is that PW has shifted from venture-backed growth to listed-company
              scrutiny without losing its founder identity.

              The milestone trail also captures the company's operating evolution: YouTube origins in 2016,
              incorporation in 2020, offline centre expansion, acquisition-led scale-up, 2024 financing, and eventual
              public listing. The strongest near-term diligence questions are whether that expansion has translated into
              durable cash generation and whether the public-market narrative is being underwritten by audited cohort
              behaviour or mainly by headline reach statistics.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO012
              - CO013
