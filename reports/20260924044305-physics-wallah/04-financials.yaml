  evidenceGaps:
  - type: missing-source
    severity: material
    topic: cohort-payback
    missingEvidence: Channel-level CAC, payback, and retention disclosure by product line.
    whyItMatters: Without those inputs the report cannot judge whether scale is becoming more efficient or simply larger.
    diligencePath: Ask management for cohort packs and product-level unit-economics exhibits.
    relatedQuestionRefs:
    - QI008
  - type: missing-source
    severity: material
    topic: cash-conversion
    missingEvidence: Clear operating cash-flow and free-cash-flow bridge for FY26.
    whyItMatters: Growth can look healthy while cash conversion remains weak, especially with offline expansion.
    diligencePath: Review the next audited filing and bridge revenue to cash generation.
    relatedQuestionRefs:
    - QI007
  - type: stale
    severity: minor
    topic: margin-quality
    missingEvidence: Independent confirmation of current EBITDA and gross-margin trend.
    whyItMatters: The current public evidence relies heavily on management or media descriptions rather than filed statements.
    diligencePath: Pull the latest audited or interim financial statements from the listed-company disclosures.
    relatedQuestionRefs:
    - QI006
