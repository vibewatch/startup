  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Customer count, top-customer ARR concentration, renewal rates, and cohort expansion data.
    whyItMatters: Logo quality is strong, but investors cannot tell whether the customer base is broad and durable or concentrated in a few marquee accounts.
    diligencePath: Request customer census, concentration schedule, cohort retention dashboard, and third-party reference calls.
    relatedQuestionRefs:
    - QU018
    - QU019
    - QU024
    - QU025
  - type: access-blocked
    severity: minor
    topic: evidence-quality
    missingEvidence: Open review-platform evidence from Trustpilot, G2, or Gartner that is fully accessible and current.
    whyItMatters: Independent customer-sentiment channels could help test whether curated case studies reflect typical customer experience.
    diligencePath: Use licensed review access or obtain customer-reference transcripts from management.
    relatedQuestionRefs:
    - QU015
    - QU024
    relatedTableRefs:
    - TU003
callouts:
- calloutType: strength
  title: The visible logos and workflows are high quality
  body: Cresta’s named customers are not random logo drops. They cluster in high-volume, high-consequence environments—airlines, lenders, telecom, hospitality, and service-heavy operators—where measurable gains in handle time, containment, collections, or QA genuinely matter. That is strong evidence the product solves hard problems.
  claimRefs:
  - CU004
  - CU005
  - CU006
  - CU007
  - CU031
- calloutType: risk
  title: Customer quality is clear; customer breadth is not
  body: The main concern is not whether Cresta can win strong logos. It can. The concern is whether those stories represent a broad, diversified, and renewably expanding customer base. Without customer count, concentration, and renewal metrics, the public customer story remains one-sided.
  claimRefs:
  - CU026
  - CU027
  - CU028
  - CU033
  - CU035
acknowledgedWarnings:
- dimension: tableNotes
  reason: Customer exhibits intentionally preserve company-authored proof and carry concentration gaps forward rather than overstating breadth or retention.
