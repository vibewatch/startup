- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: 'Cresta’s strongest public customers share a similar journey: high-volume support, workflow complexity, deployment, then measurable operating impact.'
  data:
    nodes:
    - label: High-volume customer conversations
      detail: Airlines, lenders, telecom, and home-services teams start from frontline volume and complexity.
    - label: Quality / coaching or containment pain
      detail: Manual QA, high AHT, inconsistent agents, or weak self-service trigger evaluation.
    - label: Cresta deployment across guidance + analytics + automation
      detail: The platform enters through real-time guidance, QA, or AI agent workflows.
    - label: Measured business impact
      detail: Stories then emphasize ROI, containment, handle time, collections, revenue, or cost savings.
  approximationNotes: The map synthesizes common patterns across many customer stories rather than tracing a single company’s lifecycle.
