- id: adoption-trajectory-and-stickiness
  title: Adoption trajectory and likely stickiness
  body: The public stories suggest that Cresta deployments often deepen over time rather than remaining one-off pilots. Oportun says it is extending the same AI foundation from sales into collections for millions of conversations, and Xanterra describes expanding from five live AI agents to a planned sixteen across brands. Propel frames deployment as part of a broader effort to scale without matching headcount growth, while airline and telecom stories emphasize embedded frontline guidance and analytics rather than isolated experiments. These signals point toward real operational embedding, especially in regulated or high-complexity workflows where guidance, QA, and automation touch the same teams. That likely increases switching costs for the best accounts. Even so, retention remains mostly inferred from expansion clues because Cresta does not publish renewal rates, logo churn, or module attach curves. The stickiness argument is plausible, but it remains one inference step short of proof.
    Public references point toward durability, not quantified durability.
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU029
  - CU031
  - CU033
  tableRefs:
  - TU002
  - TU005
  figureRefs:
  - FU002
  - FU004
- id: gaps-and-verdict
  title: Coverage gaps, concentration risk, and verdict
  body: 'The core weakness in the customer chapter is breadth disclosure. Cresta publishes many strong stories, but it does not disclose customer count, ARR concentration, churn, standardized satisfaction measures, or a balanced set of neutral customer references. That means the public record can support a strong claim about who the company can win and what kinds of workflows it can improve, but not a strong claim about how diversified or retention-rich the customer base is overall. The customer quality signal is therefore asymmetric: logo quality and use-case sophistication look strong, yet portfolio-level reliability remains unknown. For diligence purposes, the right conclusion is constructive but still incomplete. Cresta appears to have real enterprise traction in hard workflows; investors still need concentration, renewal, and customer-reference depth before underwriting the customer base as resilient. This is a quality-over-quantity customer story until management provides the missing
    cohort data. Reference quality matters as much as reference volume here. That distinction is material for diligence and underwriting decisions today overall.'
  claimRefs:
  - CU027
  - CU028
  - CU030
  - CU032
  - CU034
  - CU035
