company:
  name: Cresta
chapter:
  number: 6
  title: Customers
  summary: Cresta’s public customer story is compelling on logo quality and workflow outcomes—especially across travel, BFSI, and service operations—but still lacks the portfolio-level breadth, renewal, and concentration disclosure needed for full underwriting.
sections:
- id: segments-and-logo-quality
  title: Customer segments and logo quality
  body: Cresta's public customer evidence is strong on logo quality even if it is incomplete on breadth. The visible roster spans large travel and hospitality brands such as United, Alaska, Xanterra, Windstar, and Holiday Inn; regulated and high-volume financial-services accounts such as Oportun, Aqua Finance, Achieve, Snap Finance, and Propel; and telecom or consumer-service operators such as Cox, Brinks Home, Vivint, and Aptive. Official company materials also reference marquee accounts like United, Cox, and Marriott, reinforcing the enterprise tone of the customer base. This does not prove low concentration or a large customer count, but it does show that Cresta has landed in serious frontline environments where workflow quality, compliance, and revenue consequences matter. The public logo set is therefore qualitatively strong, even if quantitatively incomplete. Few young AI software companies can point to this many recognizable service operations publicly. That alone raises the credibility
    of the rest of the diligence work.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: customer-proof-and-metrics
  title: Customer proof and measurable impact
  body: 'Cresta''s best customer evidence is outcome-rich. Public case studies cite lower handle time, higher containment, improved collections, increased save rates, six- or seven-figure revenue lifts, cost savings, and broader QA coverage. The named proofs are not all equally strong, but several are impressive even by enterprise-software standards: United''s 15% handle-time reduction, Aqua Finance''s 61% lift in dollars collected per hour, Snap Finance''s 40% lower handle time and containment jump from 6% to 33%, Xanterra''s 76% to 84% containment examples and $3.3 million revenue increase, and Aptive''s $2.37 million retention impact. The caveat is equally important: nearly all of this evidence is company-authored. Investors should treat it as strong directional proof of value, not as audited outcome reporting. The pattern is compelling, but it still comes from curated customer storytelling rather than neutral benchmarking.'
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
