chapter:
  number: 7
  title: Risks
  summary: 'Cresta’s risk profile is high but not yet thesis-breaking: privacy-consent litigation and deployment-quality risk are the main concerns, tempered by credible trust controls, real customer traction, and a meaningful capital base.'
sections:
- id: legal-and-regulatory
  title: Legal and regulatory risk is the top-ranked exposure
  body: Cresta’s highest-priority risk is legal and regulatory rather than purely technical. The public record contains an active privacy lawsuit, Galanter v. Cresta Intelligence, and multiple independent law-firm analyses frame AI call-monitoring litigation as an emerging category risk rather than a one-off dispute. California’s all-party-consent framework is a clear reason this matters. If Cresta’s software is used in ways that create ambiguous disclosure or consent practices, the risk can move quickly from legal theory into customer and go-to-market friction. Europe adds a second layer through the AI Act and broader privacy-rights obligations, while U.S. telemarketing rules still matter for outbound automation. The company has credible mitigation language around governance and privacy, but these controls do not erase the core fact that contact-center AI operates directly inside heavily regulated customer interactions. Regulatory complexity is therefore structural, not incidental. It should
    stay at the top of every diligence checklist.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR009
  - CR010
  - CR011
  - CR041
  - CR042
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-and-product
  title: Operational risk centers on deployment quality and trust
  body: 'The next-ranked risk is operational underdelivery: the possibility that strong demos and strong pilot interest do not convert into stable, governed, scaled production usage. Third-party market evidence consistently points to integration difficulty, workforce readiness, and trust gaps as the main causes of AI-contact-center underperformance. That lines up with Cresta’s own product emphasis on testing, approvals, rollback, training, quality, and coaching. These are sensible mitigations, but they also implicitly admit the problem space is difficult. The biggest unresolved operational weakness is the absence of public reliability evidence. There are no disclosed uptime targets, incident histories, or benchmark pass rates for key products. That means investors can see the control framework, but not yet the empirical performance of that framework under live enterprise conditions. Enterprise buyers may tolerate some novelty, but not opaque reliability. This is the central non-legal risk
    in the file.'
  claimRefs:
  - CR008
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR027
  - CR028
  - CR038
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: dependencies-and-financial-model
  title: Dependencies, concentration, and financing shape residual exposure
  body: 'Cresta’s architecture and customer base create meaningful dependency risk. The platform depends on customer-system integrations, data access, configuration quality, and governance working together. Broad connector support is a strength, but it also expands the set of ways deployments can fail. Customer concentration is another hidden dependency: the public logo set is strong, yet the company does not disclose customer count or top-account ARR. That makes it impossible to rule out material concentration. On the financial side, recent capital and ARR scale reduce short-term distress risk, but they do not eliminate the possibility of future financing under weaker valuation conditions. Mature public software comparables and installed-base incumbents also create strategic pressure, because they can compress pricing or lower buyer willingness to pay for a standalone platform if “good enough” alternatives improve. Residual exposure here is high because several dependencies are opaque at
    once. Opaque dependencies tend to compound rather than offset one another.'
  claimRefs:
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR029
  - CR030
  - CR036
  - CR039
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: people-mitigations-and-kill-triggers
  title: People risk is manageable today, but kill criteria should stay explicit
  body: 'The people story is ambiguous rather than alarming. The public record does not prove a morale or layoffs problem, but it does show why execution risk is inherently high in this category: AI shifts human work toward more complex escalations and puts change-management stress on frontline teams and managers. Cresta’s training, testing, quality, and coaching modules are valuable precisely because they address that risk directly. The right risk posture is therefore not to assume failure, but to define thesis-break conditions clearly. An adverse privacy ruling, a major security incident, persistent inability to turn pilots into production expansions, or evidence of concentration-driven churn would all materially damage the investment case. For now, the balance of evidence supports a high risk rating rather than a critical one because Cresta still shows credible scale, capital support, and proactive mitigation design. Risk is elevated, but not yet disqualifying. Investors should still
    demand crisp monitoring metrics. Weekly churn, expansion, and incident reviews would tighten oversight materially.'
  claimRefs:
