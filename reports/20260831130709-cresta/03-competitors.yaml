callouts:
- calloutType: risk
  title: Message-level differentiation is fading quickly
  body: Cresta still looks differentiated on product breadth, but rivals increasingly tell similar stories about unified human-plus-AI operations, governed agents, and shared intelligence. That does not eliminate differentiation, but it shifts the burden of proof from messaging to operational outcomes, deployment speed, and multi-module expansion evidence.
  claimRefs:
  - CP006
  - CP017
  - CP018
  - CP019
  - CP020
  - CP034
- calloutType: insight
  title: The hardest competition is probably bundled, not feature-for-feature
  body: The main threat is not that every competitor beats Cresta on every workflow. It is that large suites can bundle “good enough” AI into existing contracts while AI-native challengers attack narrower jobs with simpler economics. Cresta wins if its cross-workflow platform value is large enough to justify a separate enterprise platform decision.
  claimRefs:
  - CP012
  - CP016
  - CP028
  - CP029
  - CP030
  - CP033
acknowledgedWarnings:
- dimension: tableNotes
  reason: The exhibits intentionally summarize class-level competitor tendencies and preserve unsupported cells as directional judgments rather than exhaustive vendor audits.
