companyProfile:
  summary: Cresta is a late-stage contact-center AI company founded out of Stanford's AI Lab in 2017. The company sells a unified platform spanning AI agents, live agent assistance, coaching, quality management, knowledge, and orchestration for enterprise customer-service workflows. Public evidence shows meaningful commercial scale, including more than $100 million in ARR by 2026, a Fortune 500 customer base, and a $125 million Series D in November 2024, but the exact post-money valuation, revenue quality, and concentration profile remain undisclosed.
