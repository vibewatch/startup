  topStrengths:
    - Cresta has unusually strong public operating proof for a private AI company, including a >$100M ARR milestone, a $125M Series D, and visible Fortune 500 customer deployments.
    - The product has expanded beyond simple agent assist into a broader platform spanning automation, quality, knowledge, orchestration, and AI-agent workflows.
    - Customer stories and enterprise positioning suggest real workflow value across travel, BFSI, telecom, hospitality, and other large-service environments.
  topRisks:
    - Exact current valuation, Series D terms, and downside protections are not reliably visible in accessible primary sources.
    - Legal and compliance exposure around AI-enabled call monitoring and privacy remains the most material thesis-break risk.
    - Public evidence is still weak on gross margin, NRR, burn, and customer concentration, so underwriting a premium multiple would be speculative.
  unresolvedGaps:
    - Signed Series D pricing documents, post-money valuation, and liquidation preference stack remain unavailable.
    - Exact ARR, revenue mix, gross margin, NRR, and burn are still missing from the public record.
    - Top-customer concentration, renewal cadence, and canonical headcount or headquarters data still require management-grade diligence.
