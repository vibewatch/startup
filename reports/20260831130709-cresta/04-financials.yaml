      label: Enterprise land-and-expand motion
    - from: usage
      to: arr
      label: Recurring billings plus overages
    - from: expansion
      to: arr
      label: Cross-sell and module attach
  approximationNotes: This is a structural revenue map derived from public product and pricing signals; it is not a disclosed booking waterfall.
