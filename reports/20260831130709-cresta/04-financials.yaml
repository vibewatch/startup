      description: AI Agent, Agent Assist, intelligence, quality, coaching, and orchestration are sold as a connected suite.
    - id: contracts
      label: Enterprise contract scope
      description: Initial deals likely scoped by channel, seats, or workflow complexity rather than self-serve sign-up.
    - id: usage
      label: Usage and overages
      description: AWS evidence implies usage thresholds and overage mechanics on at least part of the portfolio.
    - id: expansion
      label: Module expansion
      description: Customers can add more products over time, increasing ARR without needing a full rip-and-replace sale.
    - id: arr
      label: '>$100M ARR'
      description: Current public topline signal anchors the scale outcome of the model.
