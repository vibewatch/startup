company:
  name: Cresta
chapter:
  number: 4
  title: Financials
  summary: Cresta has unusually strong public evidence for a private company's ARR scale and enterprise pricing posture, but true underwriting remains blocked by missing disclosure on margins, burn, retention, and customer concentration.
sections:
- id: topline-and-revenue-model
  title: Topline signal and revenue model
  body: 'The strongest public financial fact about Cresta is not a GAAP revenue figure but the company''s ARR milestone. Official materials say Cresta surpassed $100 million in annual recurring revenue by mid-2026, and Axios independently echoed that threshold earlier in the year. That is enough to anchor the business as meaningfully scaled even though the company remains private. Public product pages also imply a diversified recurring revenue model: Cresta sells AI Agent, agent-assist and guidance capabilities, conversation intelligence, quality management, coaching, and orchestration. Third-party pricing analyses suggest those modules can be purchased separately and expanded over time, which implies a land-and-expand commercial structure rather than a single monolithic contract. The public model therefore looks multi-product, enterprise, and largely subscription-based, even if recognition details remain undisclosed. Importantly, this is not the profile of a one-feature experimental AI
    vendor. It looks like a platform trying to compound more ARR out of each large account over time.'
  claimRefs:
  - CI001
  - CI002
  - CI005
  - CI006
  - CI007
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: pricing-and-revenue-quality
  title: Pricing opacity, contract shape, and revenue-quality proxies
  body: Cresta's monetization is visible only through fragments. The company does not publish a first-party price sheet, so AWS Marketplace is the clearest official signal and third-party pricing analyses fill in the rest. Those sources point to a six-figure annual entry point for Agent Assist, plus overages and broader negotiated enterprise contracts for additional modules. UsagePricing characterizes the structure as seat-based subscriptions with feature-tier expansion, while noting that the autonomous AI Agent product may introduce outcome-linked economics. The positive implication is that Cresta appears able to monetize material workflow value at enterprise price points. The negative implication is that public evidence on realized pricing, discounting, expansion rates, and churn is missing. Customer case studies show persuasive ROI claims, but they are marketing evidence rather than audited revenue-quality disclosures. Premium list-price optics are not the same as durable net revenue
    quality. They nevertheless suggest meaningful willingness to pay in the target segment.
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
  tableRefs:
  - TI002
  - TI003
  figureRefs:
  - FI002
- id: efficiency-and-cost-structure
  title: Efficiency proxies and cost-structure blind spots
  body: 'Because Cresta is private, public efficiency analysis has to rely on imperfect proxies. Combining the disclosed ARR threshold with public headcount estimates suggests ARR per employee somewhere around the mid-$100k range, but both numerator and denominator are noisy and should not be mistaken for a management KPI. More useful are the customer outcomes that hint at why enterprises pay for the product: lower handle time, higher containment, faster collections, cost savings, and revenue lift. Those indicators support economic relevance, but they still do not reveal gross margin, services burden, or CAC payback. The public record also suggests implementation and change-management costs are meaningful because Cresta integrates into complex legacy stacks and supports enterprise-grade deployments rather than lightweight self-serve onboarding. That likely raises services and customer-success load compared with a pure self-serve software model. It likely raises onboarding complexity as well
    over time materially.'
  claimRefs:
  - CI018
  - CI019
  - CI020
  - CI021
  - CI024
  - CI025
  - CI026
  - CI036
  tableRefs:
  - TI004
  figureRefs:
  - FI003
- id: capital-adequacy-and-verdict
  title: Capital adequacy, public comps, and verdict
  body: 'The capital story is good enough to be constructive but not good enough to be precise. Cresta raised $125 million in late 2024 and says lifetime funding now exceeds $270 million, while current ARR is above $100 million. That combination implies a business with meaningful scale and some financing flexibility. Public comps help frame what maturity could look like: Five9, NICE, and Salesforce all operate at much larger revenue bases and much lower simple revenue multiples than an aggressive private AI mark would imply. Even so, the main diligence blocker is not topline scarcity; it is disclosure scarcity. Without audited gross margin, burn, net retention, or cash-on-hand data, an investor can say revenue quality looks promising but cannot underwrite the margin path or next-financing dependency with confidence. This chapter therefore lands as encouraging but incomplete, not investment-grade certainty. A management data room could materially improve conviction very quickly because the
    topline skeleton already exists.'
