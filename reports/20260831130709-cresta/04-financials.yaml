  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financial-gaps
    missingEvidence: Audited revenue, gross margin, net retention, CAC payback, cash, burn, and customer concentration.
    whyItMatters: Without these metrics the investor can judge topline momentum but cannot underwrite software quality, cash efficiency, or downside financing risk.
    diligencePath: Request the latest board package, audited financial statements, ARR bridge, and cohort retention dashboard.
    relatedQuestionRefs:
    - QI014
    - QI015
    - QI024
    - QI025
  - type: conflicting-data
    severity: material
    topic: valuation-crosscheck
    missingEvidence: Primary documentation of the current valuation and latest cap-table mark.
    whyItMatters: Financial quality and valuation stance are hard to connect when public secondary sources disagree about the company's current mark.
    diligencePath: Request cap-table summary, last preferred financing documents, and any 409A or board valuation materials.
    relatedQuestionRefs:
    - QI020
callouts:
- calloutType: strength
  title: The public topline signal is unusually good for a private company
  body: 'Most private software companies ask investors to accept topline scale on trust. Cresta does not fully solve that problem, but it goes further than usual: official sources and Axios align on >$100M ARR, while customer case studies provide multiple workflow-level ROI stories that help explain why enterprises keep paying.'
  claimRefs:
  - CI001
  - CI002
  - CI016
  - CI017
  - CI018
  - CI020
  - CI021
- calloutType: risk
  title: Revenue quality still cannot be underwritten from public evidence alone
  body: 'The key missing metrics are exactly the ones that separate premium AI-software stories from services-heavy or cash-intensive deployments: gross margin, realized pricing, net retention, burn, and customer concentration. Public evidence supports momentum, not financial conclusiveness.'
  claimRefs:
  - CI022
  - CI023
  - CI035
  - CI036
acknowledgedWarnings:
- dimension: tableNotes
  reason: The exhibits intentionally separate supported price fragments from missing private metrics; notes are included, but the chapter remains gap-heavy by design because the company is private.
