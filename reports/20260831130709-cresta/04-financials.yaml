      high: 105
      unit: USD millions
      note: Official claim is only that ARR is above $100M; upper bound here is a minimal public-confidence buffer, not guidance.
    - label: ARR per employee (USD thousands)
      low: 160
      high: 200
      unit: USD thousands
      note: Uses >$100M ARR and roughly 500-626 public employee range.
    - label: Simple public-comp revenue multiple (x)
      low: 2.1
      high: 5.0
      unit: x revenue
      note: Five9, NICE, and Salesforce simple market-cap-to-revenue range.
    - label: Public AWS entry benchmark (USD thousands)
      low: 150
      high: 300
      unit: USD thousands
      note: One channel vs. both chat and voice Agent Assist, excluding add-ons.
  approximationNotes: The ranges are deliberately conservative and should not be mistaken for audited management guidance or realized contract values.
