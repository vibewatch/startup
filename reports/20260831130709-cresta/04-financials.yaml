- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Gross margin and services mix
    - Cannot test whether the business is software-like or services-heavy
    - Request audited income statement and product-vs-services gross margin
  - - Net revenue retention and logo churn
    - Cannot assess revenue quality or expansion durability
    - Request ARR bridge by cohort, churn, and expansion
  - - Cash balance and monthly burn
    - Cannot model runway or next-round dependency
    - Request monthly cash runway model and board materials
  - - Customer concentration by ARR
    - Cannot test whether a few logos explain the public success stories
    - Request top-20 customer revenue concentration schedule
  - - Realized ASP / discounting
    - Cannot connect list-price anecdotes to actual monetization
    - Request contract data by product, seat band, and channel
  - - Services effort and deployment cost
    - Cannot assess implementation burden or margin drag
    - Request average implementation timeline, services attach, and support ratios
  notes: These are the primary blockers preventing full underwriting from public materials alone.
