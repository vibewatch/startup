evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: hq-headcount-conflict
    missingEvidence: A management-confirmed 2026 employee count and a single canonical headquarters line.
    whyItMatters: Cover metrics and operating-scale comparisons become noisy when public databases disagree on basic company facts.
    diligencePath: >-
      Request a management data sheet or HRIS export showing headcount, primary headquarters, and office roster as of
      2026-08-31.
    relatedQuestionRefs:
      - QO003
      - QO013
      - QO025
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: valuation-uncertainty
    missingEvidence: Primary documentation of the Series D post-money valuation or board-approved 409A context.
    whyItMatters: >-
      Valuation is a key cover fact and later valuation analysis becomes fragile if the current capitalization benchmark
      is inferred from media lore.
    diligencePath: Request financing documents, a board memo, or a cap-table summary confirming the November 2024 valuation.
    relatedQuestionRefs:
      - QO010
      - QO025
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-scale
    missingEvidence: A disclosed customer count, logo count, or revenue concentration schedule.
    whyItMatters: >-
      The company claims Fortune 500 penetration and strong outcomes, but public materials do not quantify account
      breadth or concentration.
    diligencePath: Request a customer census by logo, ARR band, and vertical with churn and expansion history.
    relatedQuestionRefs:
      - QO012
  - type: access-blocked
    severity: minor
    topic: layoff-signal
    missingEvidence: Reliable press or company disclosures confirming or refuting the anonymous layoffs discussion.
    whyItMatters: A layoffs event could affect delivery capacity and morale, but the current signal is weak and uncorroborated.
    diligencePath: >-
      Search wage-and-layoff notices, ask management directly, and compare 2025-2026 hiring and headcount movement from
      HR analytics providers.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam-gap
    missingEvidence: >-
      A disclosed seat base, customer count, workflow mix, and average contract value needed to build a Cresta-specific
      SAM or SOM.
    whyItMatters: >-
      Market size alone does not determine investability; investors need to know what fraction of the category Cresta
      can realistically monetize.
    diligencePath: Request management operating metrics by customer segment, seats, workflow module attach, and geography.
    relatedQuestionRefs:
      - QM021
      - QM025
  - type: private-evidence-only
    severity: material
    topic: competitive-gaps
    missingEvidence: Win-rate, churn, module attach, and head-to-head displacement data against top rivals.
    whyItMatters: >-
      Public product pages reveal positioning, but not whether Cresta actually wins against incumbent bundles or cheaper
      AI-agent challengers.
    diligencePath: >-
      Request sales pipeline data segmented by competitor, customer references from competitive takeouts, and
      renewal-expansion history by module.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: blocking
    topic: financial-gaps
    missingEvidence: Audited revenue, gross margin, net retention, CAC payback, cash, burn, and customer concentration.
    whyItMatters: >-
      Without these metrics the investor can judge topline momentum but cannot underwrite software quality, cash
      efficiency, or downside financing risk.
    diligencePath: Request the latest board package, audited financial statements, ARR bridge, and cohort retention dashboard.
    relatedQuestionRefs:
      - QI014
      - QI015
      - QI024
      - QI025
  - type: conflicting-data
    severity: material
    topic: valuation-crosscheck
    missingEvidence: Primary documentation of the current valuation and latest cap-table mark.
    whyItMatters: >-
      Financial quality and valuation stance are hard to connect when public secondary sources disagree about the
      company's current mark.
    diligencePath: Request cap-table summary, last preferred financing documents, and any 409A or board valuation materials.
    relatedQuestionRefs:
      - QI020
  - type: private-evidence-only
    severity: material
    topic: reliability-gap
    missingEvidence: SLA, uptime, model evaluation pass rates, hallucination/error rates, and incident history by product module.
    whyItMatters: >-
      Technical diligence depends on whether the governed deployment story translates into measurable production
      reliability.
    diligencePath: Request production dashboards, incident reports, benchmark eval packs, and connector-level reliability data.
    relatedQuestionRefs:
      - QE021
      - QE025
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: Independent practitioner communities, public repos, or package-adoption evidence for Cresta’s technology.
    whyItMatters: Hiring pages are only a weak proxy for developer adoption or implementation quality.
    diligencePath: Request customer engineering references, implementation partner references, and deployment architecture reviews.
    relatedQuestionRefs:
      - QE017
      - QE025
  - type: private-evidence-only
    severity: material
    topic: concentration-gap
    missingEvidence: Customer count, top-customer ARR concentration, renewal rates, and cohort expansion data.
    whyItMatters: >-
      Logo quality is strong, but investors cannot tell whether the customer base is broad and durable or concentrated
      in a few marquee accounts.
    diligencePath: Request customer census, concentration schedule, cohort retention dashboard, and third-party reference calls.
    relatedQuestionRefs:
      - QU018
      - QU019
      - QU024
      - QU025
  - type: access-blocked
    severity: minor
    topic: evidence-quality
    missingEvidence: Open review-platform evidence from Trustpilot, G2, or Gartner that is fully accessible and current.
    whyItMatters: >-
      Independent customer-sentiment channels could help test whether curated case studies reflect typical customer
      experience.
    diligencePath: Use licensed review access or obtain customer-reference transcripts from management.
    relatedQuestionRefs:
      - QU015
      - QU024
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: reliability-gap
    missingEvidence: Uptime, incident history, benchmark evals, and rollback success data by product module.
    whyItMatters: >-
      Without reliability evidence the investor cannot tell whether the control framework truly works at production
      scale.
    diligencePath: Request incident logs, SLA history, evaluation dashboards, and customer postmortems.
    relatedQuestionRefs:
