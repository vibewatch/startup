            title: 这是一个“足够大，但不会自证”的市场
            body: >-
              品类规模显然足以支撑风投级结果，但大市场叙事本身还不够。最重要的市场事实不是准确 TAM 数字，而是多数企业仍难以把 AI
              在联络中心运营化。能补上集成、治理和准备度缺口的供应商，即便公开市场区间仍嘈杂，也应能拿到不成比例的份额。
            calloutType: insight
