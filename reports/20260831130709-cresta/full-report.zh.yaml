chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、品类与当前定位
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，Cresta 对外不再把自己定位成狭窄的点状工具，而是一家客户体验 AI 公司。官网和平台概览反复把业务讲成统一平台：覆盖人工坐席辅助、AI
              坐席自动化、质检管理、辅导和会后洞察。这个表述很关键，因为它把公司品类从传统会话智能拓宽到更完整的联络中心运营层。创立资料把公司源头追溯到 2017 年的 Stanford AI
              Lab，公开时间线也把最早商业里程碑指向首个客户
              Intuit。因此，即便第三方数据库对总部标注并不一致，公司在创立年份、产品方向和企业级定位上的公开身份仍较清晰。换句话说，品类定义野心不小，但逻辑清楚：Cresta
              卖的是一套同时触达人效预算和客户体验自动化预算的软件。
