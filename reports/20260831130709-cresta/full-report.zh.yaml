      - CU030
  - id: FU004
    title: 留存 / 复购队列
    type: cohort
    layout: standard
    summary: 留存质量最能从运营嵌入和扩张信号看出，但真实续约经济性仍未披露。
    data:
      columns:
        - 估计扩张 / 续约代理（%）
        - 估计运营嵌入度（%）
        - 证据置信度（%）
      rows:
        - label: 旅游 / 酒店企业客户
          values:
            - 70
            - 80
            - 60
        - label: BFSI / 催收客户
          values:
            - 80
            - 85
            - 65
        - label: 电信 / 消费服务客户
          values:
            - 65
            - 75
            - 60
    approximationNotes: 百分比来自作者对公开扩张和嵌入信号的估计，不是披露的续约或流失数据。
    claimRefs:
      - CU023
      - CU024
      - CU025
      - CU029
      - CU033
      - CU035
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 法律同意风险和部署交付不足按综合严重性和剩余暴露排在最高。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解成熟度
        - 剩余严重性
      rows:
        - label: 隐私 / 同意诉讼
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 部署 / 就绪失败
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 客户信任侵蚀
          values:
            - 中高
            - 高
            - 中
            - 高
        - label: 集中度不透明
          values:
            - 中
            - 高
            - 低
            - 高
        - label: 融资 / 估值压缩
          values:
            - 中
            - 中高
            - 中
            - 中高
    approximationNotes: 单元格是基于公开法律、运营和财务信号综合得出的有证据支撑的序数判断。
    claimRefs:
      - CR001
      - CR012
      - CR015
      - CR020
      - CR022
      - CR037
      - CR038
      - CR039
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 最危险的风险，是那些会从合规或可靠性迅速传导到客户信任、收入和融资灵活性的风险。
    data:
      nodes:
        - id: privacy
          label: 隐私 / 同意风险
        - id: reliability
          label: 可靠性和部署风险
        - id: trust
          label: 客户信任
        - id: revenue
          label: 扩张 / 续约收入
        - id: valuation
          label: 估值和融资灵活性
        - id: ops
          label: 运营工作量
      edges:
        - from: privacy
          to: trust
          label: 法律暴露削弱买方信心
        - from: reliability
          to: trust
          label: 不良结果降低信心
        - from: reliability
          to: ops
          label: 升级和返工增加
        - from: trust
          to: revenue
          label: 续约和扩张放缓
        - from: revenue
          to: valuation
          label: 增长可信度减弱
        - from: ops
          to: revenue
          label: 部署成本和延迟叠加
    approximationNotes: 该图聚焦与投资逻辑最相关的一阶风险传导路径。
    claimRefs:
      - CR009
      - CR015
      - CR017
      - CR031
      - CR032
      - CR033
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Cresta 最大的依赖位于企业系统、标杆客户和私募市场资本的交界处。
    data:
      nodes:
        - id: customers
          label: 标杆企业客户
        - id: systems
          label: 客户系统和权限
        - id: governance
          label: 信任与发布控制
        - id: capital
          label: 私募资本支持
        - id: competition
          label: 有存量基础的竞争对手
        - id: outcome
          label: 收入韧性
      edges:
        - from: customers
          to: outcome
          label: 续约与扩张
        - from: systems
          to: outcome
          label: 部署跑通
        - from: governance
          to: outcome
          label: 控制守住信任
        - from: capital
          to: outcome
          label: 支撑继续扩张
        - from: competition
          to: outcome
          label: 捆绑与价格压力
        - from: systems
          to: governance
          label: 复杂度推高控制需求
    approximationNotes: 依赖关系压缩为最可能快速改变投资判断的节点。
    claimRefs:
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
      - CR029
      - CR036
      - CR039
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议从已见规模和客户验证出发，但卡在估值信心瓶颈：价格披露弱，剩余风险仍重。
    data:
      nodes:
        - id: scale
          label: ARR 超过 $100M，融资超过 $270M
          detail: 公开来源已能看见真实的后期规模。
          tone: positive
        - id: proof
          label: Fortune 500 客户验证
          detail: 点名披露的企业部署提升可信度。
          tone: positive
        - id: platform
          label: 更宽的 AI 平台叙事
          detail: 上行空间取决于坐席辅助之外的交叉销售能否跑通。
          tone: positive
        - id: risk
          label: 法律与部署风险
          detail: 隐私和执行问题会迅速压缩价值。
          tone: warning
        - id: price
          label: 轮次价格未知
          detail: 一手来源未披露投后估值。
          tone: warning
        - id: call
          label: 跟踪建议
          detail: 承销前先等价格和收入质量证据。
          tone: neutral
      edges:
        - from: scale
          to: call
        - from: proof
          to: call
        - from: platform
          to: call
        - from: risk
          to: call
        - from: price
          to: call
        - from: scale
          to: price
        - from: risk
          to: price
    approximationNotes: 该流程偏定性、面向投资判断；它展示逻辑顺序，而不是完整还原公司经营因果。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV009
      - CV036
      - CV037
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 以已披露的 $100M ARR 下限计算，价值敏感性主要取决于投资人愿意为收入质量和风险支付多少倍数。
    data:
      items:
        - label: 3x ARR 下限
          value: 300
        - label: 5x ARR 下限
          value: 500
        - label: 7.5x ARR 下限
          value: 747
        - label: 8x ARR 下限
          value: 800
        - label: 10x ARR 下限
          value: 1000
        - label: 16x ARR 下限
          value: 1600
    approximationNotes: 柱形把已披露 ARR 下限转成示意性估值锚点；实际价值取决于准确 ARR、增长、利润率，以及证券结构或优先权条款。
    claimRefs:
      - CV003
      - CV027
      - CV028
      - CV029
      - CV032
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据能支撑的区间很宽，因为收入分子和私募市场倍数都只露出一部分。
    data:
      items:
        - label: 悲观情景估值
          low: 0.3
          base: 0.4
          high: 0.5
          unit: $B
        - label: 基准情景估值
          low: 0.6
          base: 0.7
          high: 0.8
          unit: $B
        - label: 乐观情景估值
          low: 0.9
          base: 1.05
          high: 1.2
          unit: $B
    approximationNotes: 区间是示意性的企业价值式区间，来自将可比倍数套用到已披露 ARR 下限，并叠加情景假设；不是管理层指引，也不是完整模型。
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV029
      - CV033
      - CV034
      - CV035
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 按 IC 口径打分落在中档：公司质量高于平均，但估值支撑和下行保护偏弱。
    data:
      items:
        - label: 市场质量
          value: 7
          unit: /10
          note: 呼叫中心 AI 品类大且在增长，企业需求明确。
        - label: 客户验证
          value: 7
          unit: /10
          note: 以私营公司标准看，点名的 Fortune 500 客户和成效主张很强。
        - label: 产品宽度
          value: 7
          unit: /10
          note: 平台已延伸到单一辅助用例之外。
        - label: 经济性可见度
          value: 4
          unit: /10
          note: ARR 下限可见，但利润率和留存不可见。
        - label: 风险负担
          value: 4
          unit: /10
          note: 法律、部署和集中度风险仍不小。
        - label: 估值清晰度
          value: 3
          unit: /10
          note: 一级价格披露缺位，二级市场标记又互相冲突。
        - label: 证据质量
          value: 5
          unit: /10
          note: 经营证据较好，估值佐证一般。
    approximationNotes: 分数是基于截至 2026-08-31 留存公开证据做出的编辑判断，采用 1-10 分制。
    claimRefs:
      - CV008
      - CV016
      - CV031
      - CV036
      - CV037
      - CV038
      - CV040
