      - number: '8.4'
        title: 正确选择是继续观察，直到价格和收入质量证据打开
        blocks:
          - type: paragraph
            body: >-
              最终建议是观察，不是买入，也不是回避。公司看起来足够强，仍值得纳入可投范围：它有真实规模、可信客户、后期资本，以及可能支撑进一步上行的产品宽度。但投资人仍缺少关键证据，无法判断当前或下一次入场价格只是合理、明显偏高，还是确实有吸引力。缺失证据异常集中在少数决定性事项上：准确
              ARR、净留存率（NRR）、毛利率、头部客户集中度，以及 Series D
              的完整资本结构和优先股堆叠。如果这些项目表现强，它们会迅速改变投资观点。反过来，负面的隐私裁决、降价融资、重大大客户流失，或试点转化停滞，都会打断投资逻辑。在这些关口清除之前，纪律性的做法是以中等置信度继续观察，并把估值立场记录为未知。更好的价格可能和更好的尽调同样重要。耐心本身就是投资判断纪律的一部分。
