              规模降低了短期压力风险，但不能排除未来在估值条件转弱时融资的可能。成熟公开软件可比公司和大装机基数既有厂商也会制造战略压力，因为如果“足够好”的替代方案改进，它们可以压缩定价，或降低买方为独立平台付费的意愿。这里的剩余暴露高，因为多个依赖同时不透明。不透明的依赖往往会相互叠加，而不是彼此抵消。
