      - number: '2.4'
        title: 约束、信任与真实采用漏斗
        blocks:
          - type: paragraph
            body: >-
              这个市场最大的误判，是把“某处用了 AI”和一线服务已经运营化混为一谈。最重要的约束是集成和准备度缺口：Brilo 称 88% 的中心使用 AI，但只有 25% 已完全集成；CX Today 和 Krista
              都认为，薄弱的变革管理、培训和数据集成让试点难以滚成生产价值。信任仍是另一道摩擦。许多场景下客户仍偏好人工支持，公开调研摘要也显示，运营方的判断和消费者愿意接受的程度之间存在明显信任差。监管再加一层：欧洲 AI
              Act 和美国长期消费者联系规则，都会提高企业级部署自主或半自主语音系统的成本。因此，人机混合模型看起来比全自主模型更现实。对 Cresta 有利的是，公司明确同时销售自动化和人工增强，而不是坚持完全替代。
