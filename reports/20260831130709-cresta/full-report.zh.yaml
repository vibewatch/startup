      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 经营验证强于典型私营 AI 初创公司
            body: Cresta 并不是信息完全缺失。融资、ARR 里程碑、客户验证和产品宽度，都比许多同阶段私营软件公司更可见。重要性在于，压住建议的不是经营证据不足；真正卡住的是更窄、但后果更重的可信定价和收入质量数据。
            calloutType: strength
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV008
          - type: callout
            title: 不要把公司质量强，误当成入场质量强
            body: 如果投资人无法确认投后估值、优先股堆叠、ARR 质量和客户集中度，那么即使公司本身非常好，价格错了也可能是一笔弱投资。纪律性的结论，是把 Cresta 留在活跃名单上，同时拒绝对公允价值给出虚假的精确度。
            calloutType: risk
            claimRefs:
