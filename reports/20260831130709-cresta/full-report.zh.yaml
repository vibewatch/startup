  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 实际 ARR 明显高于公开下限，AI 智能体产品扩大客户预算份额，隐私问题仍受控
        - 若进场价低于该区间，可能支撑大约 $0.9B-$1.2B+ 估值区间和更好的未来回报
        - 溢价消退、模块无法变现、治理事件
        - 需要私有数据证明
      - - 基准
        - ARR 仅略高于下限，增长不错但不爆发，投资人相对公开可比公司只给小幅溢价
        - 支撑大约 $0.6B-$0.8B 参考区间，容错空间有限
        - 客户集中度或集成摩擦压住倍数
        - 最能被公开数据支撑
      - - 悲观
        - 增长不及预期、诉讼恶化，或类公开市场可比公司的倍数压缩占主导
        - 在较低公开市场倍数下，价值滑向大约 $0.3B-$0.5B 下限带
        - 降估值融资、客户流失，或收入质量差暴露
        - 如果隐藏的质量指标偏弱，该情景并非小概率
    notes: 情景估值是基于公开证据的示意区间，不是董事会级估值。它们用已披露 ARR 下限和可比倍数逻辑，而不是完整 DCF。
