        title: 资本基础、规模信号与覆盖限制
        blocks:
          - type: paragraph
            body: >-
              最扎实的资本事实是 2024 年 11 月 D 轮：多方来源都指向一笔由 QIA 和 World Innovation Lab 共同领投的 $125 million 融资，公司称累计融资超过 $270
              million。收入规模对一家私营公司来说也少见地有支撑，因为官方材料和 Axios 都指向 Cresta 到 2026 年 ARR 超过 $100 million。相比之下，其他快照指标仍然混乱。Cresta
              自称有 600 多名员工和 10 多个枢纽；Forbes 报道为 500 名员工、总部 Palo Alto；Revelio 则给出 626 人和 Sunnyvale
              总部标签。合适的尽调姿态，是承认规模已经相当可观，同时保留对精确员工数和总部的数字不确定性。后续若用人均收入或人均估值做基准比较，这一点尤其重要，否则会把公开记录无法支持的精度说过头。它也影响客户支持能力判断，因为交付深度和地域覆盖部分取决于团队构成，而公开记录只能近似描述。
