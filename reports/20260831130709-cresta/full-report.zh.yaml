        title: 里程碑、扩张与反向背景
        blocks:
          - type: paragraph
            body: >-
              Cresta 的里程碑显示，公司正从坐席辅助起点走向更宽的自动化和编排平台。About 页面记录了早期融资路径和首个客户里程碑，2024 至 2026 年的发布又加入国际扩张、Knowledge
              Agent、Conductor，以及通过 TELUS Digital 和 Firstsource
              推动的合作伙伴渠道。这串线索拼出一个连贯增长故事：产品更宽、全球触达更远、企业落地能力更强。公开记录里的主要反向问题不是商业，而是法律。2025 年 Galanter 诉讼及后续律所评论显示，AI
              通话监控供应商正面对升级的同意和隐私风险。还有一个匿名 Blind 裁员帖，但在缺乏佐证前，证据太弱，不足以实质改变公司概况判断。因此，时间线支持一个建设性的运营叙事，同时给出一条清晰警示：AI
              驱动的通话工作流越扩张，公司的合规暴露面也会同步扩大。
