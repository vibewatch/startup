          - type: paragraph
            body: >-
              Cresta 估值的核心事实，不是便宜或昂贵，而是准确价格无法从可获取的一手来源中可靠确认。QIA 公告、PR Newswire 新闻稿和 Cresta 自己的 Series D
              文章都确认了这轮融资和增长叙事，但都没有披露投后估值。随后，二级市场线索急剧分叉。AI Infrastructure Map 给出约 $747 million 的投后估计，Craft
              等透明度较低的公司资料网站则指向约 $1.6 billion。差距太大，不能随手取平均。置信度还被几个原本可用于交叉验证的来源进一步拉低：Business Wire、Sifted、PitchBook
              以及部分媒体链接在本轮工作中遇到屏蔽、失效，或内容不足。因此，在拿到管理层级别的融资文件之前，应守住的纪律是把估值记为未知。价格问题仍然开放，而不只是精度不够。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV003
              - CV027
              - CV028
              - CV029
              - CV032
      - number: '8.3'
        title: 上市可比公司更能锚定下行，而不是定义上行
        blocks:
          - type: paragraph
            body: >-
              最干净的可观察锚点，是上市可比公司组，而不是私募市场传闻。按 2026 年 8 月市值和过去 12 个月收入数据，Five9 和 NICE 的交易倍数都在约 2 倍收入出头，Salesforce
              约为五倍。由此得到约 2.1x 到 5.0x 的公开可见区间。以披露的 $100 million ARR 下限计算，即便采用 AI Infrastructure Map 对 Cresta
              较低的二级市场估计，隐含倍数也约为 7.5x；较高的 $1.6 billion 线索则意味着超过 16x。两者都高于上市可比区间。Cresta 看起来比成熟上市套件增长更快，也可能拥有更 AI
              原生的产品叙事，因此溢价仍可能合理；但公开证据没有给出支撑大幅溢价所需的精确 ARR
              分子、收入质量、毛利率、净留存率（NRR）或优先股结构。因此，上市可比公司定义底部，情景表定义能负责任论证的顶部。上行情景仍有条件，不能直接兑现。
            claimRefs:
