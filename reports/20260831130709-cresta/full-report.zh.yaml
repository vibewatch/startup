  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相邻支出
        blocks:
          - type: paragraph
            body: >-
              看 Cresta，合适的市场框架窄于“全部客服软件”，但宽于传统语音分析。最有用的边界是呼叫中心 AI：用软件和服务自动化客户互动、辅助人工坐席、打分质检、浮出洞察，并在联络中心运营中编排工作流。The
              Business Research Company 和 Research and Markets 都把平台、解决方案和服务纳入这一更宽的呼叫中心 AI
              框架，且覆盖云端和本地部署。不过，这个边界仍排除了大量相邻支出，包括通用 CRM 许可证、完整 CCaaS 席位收入、更宽的企业自动化，以及不触及联络中心智能或执行的支持品类。这个边界选择很重要，因为公开 TAM
              估算是否纳入这些相邻池子，结果会相差很大。它也解释了为什么重基础设施的既有厂商和应用层 AI 供应商会同时出现在同一张分析师版图上，却未必争夺完全相同的预算。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
