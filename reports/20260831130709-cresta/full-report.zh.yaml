      - number: '2.2'
        title: 买方、用户与细分结构
        blocks:
          - type: paragraph
            body: >-
              这个市场由企业客户牵引，并围绕具体工作流展开。买方通常是联络中心运营负责人、CX 高管、数字服务负责人，或为集成买单的 IT 相关方；用户包括一线坐席、主管、QA 经理、分析师，以及越来越多的 AI
              坐席运营人员。付款方随公司成熟度变化：有些项目归服务运营预算，有些归数字化转型或 IT，有些用人效目标来论证。垂直行业组合在各来源中一致，BFSI、电信、零售、医疗和旅行反复被列为核心采用者。Cresta
              当前客户案例和内容重点，与
              BFSI、电信、旅行或酒店账户尤其匹配。重要的是，即便数字渠道扩张，语音仍是市场核心，因为电话仍承载最高风险、往往也最高成本的客户互动。因此，围绕实时指导、转写质量和合规自动化的供应商主张，仍比单纯聊天机器人量级更重要。这也偏向能支持复杂升级处理的供应商，而不只是
              FAQ 分流。
            claimRefs:
