  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律和监管风险是最高优先级暴露
        blocks:
          - type: paragraph
            body: >-
              Cresta 最高优先级风险不是纯技术，而是法律和监管。公开记录包含一起正在进行的隐私诉讼 Galanter v. Cresta Intelligence，多家独立律所分析也把 AI
              通话监控诉讼描述为新兴品类风险，而非单一纠纷。加州的全方同意框架清楚说明了问题为何重要。如果 Cresta 软件的使用方式造成披露或同意实践模糊，风险会很快从法律理论转成客户和销售落地摩擦。欧洲还通过 AI
              Act 和更广隐私权义务叠加第二层，美国电话营销规则对外呼自动化仍然重要。公司在治理和隐私上有可信缓释表述，但这些控制无法抹掉一个核心事实：联络中心 AI
              直接运行在高度受监管的客户互动之中。因此，监管复杂性是结构性的，不是偶发因素。它应该始终排在每一份尽调清单最前面。
