  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入规模信号与收入模型
        blocks:
          - type: paragraph
            body: >-
              Cresta 最扎实的公开财务事实不是 GAAP 收入口径，而是公司的 ARR 里程碑。官方材料称，到 2026 年年中，Cresta 的年经常性收入（ARR）超过 $100 million；Axios
              在当年早些时候也独立呼应了这一门槛。尽管公司仍为私营，这已足以把业务锚定为具备实质规模。公开产品页还暗示了多元经常性收入模型：Cresta 销售 AI
              Agent、坐席辅助和指导能力、会话智能、质检管理、辅导和编排。第三方定价分析显示，这些模块可以分别购买，并随时间扩展，意味着商业结构更像先落地再扩张，而不是单一巨型合同。因此，即便确认收入细节未披露，公开模型仍呈现多产品、企业级、以订阅为主的特征。重要的是，这不是单功能实验性
              AI 供应商的画像，更像一个平台，试图随时间从每个大客户身上滚出更多 ARR。
