        title: 覆盖缺口、集中度风险与结论
        blocks:
          - type: paragraph
            body: >-
              客户章节的核心弱点是广度披露。Cresta 发布了许多强案例，但没有披露客户数、ARR
              集中度、流失、标准化满意度指标，或一组平衡的中立客户参考。因此，公开记录可以支撑一个强判断：公司能赢哪些客户、能改善哪些工作流；但无法支撑另一个强判断：客户基础整体有多分散、留存和扩张有多强。客户质量信号因此是不对称的：logo
              质量和用例复杂度看起来强，组合层面的可靠性仍未知。尽调结论应是建设性但仍不完整。Cresta
              似乎在困难工作流里拿到了真实企业牵引；投资人在把客户基础承销为韧性资产前，仍需要集中度、续约和客户访谈深度。只要管理层还没给出缺失的队列数据，这就是一个重质量、轻数量的客户故事。在这里，参考质量和参考数量同样重要。这个区别对今天的尽调和承销判断有实质意义。
