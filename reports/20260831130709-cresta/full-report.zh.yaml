  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图、直接同业与替代方案
        blocks:
          - type: paragraph
            body: >-
              Cresta 已不再处于一个整齐单一的品类。买方可以用 NICE、Five9、Genesys、Salesforce、Talkdesk 等大型套件厂商解决同一任务；也可以用
              Observe.AI、Uniphore、Quiq、Ada、Balto、Forethought 等 AI 原生挑战者；还可以在某些工作流中用 Gong、ZoomInfo Chorus
              等相邻会话智能工具，尽管它们无法复刻完整的联络中心运营层。现状本身同样是竞争对手：许多中心仍依靠人工 QA、人工辅导，以及既有 CCaaS 加 CRM 技术栈，而不采购专门 AI 平台。这意味着 Cresta
              同时对抗大装机基数厂商和“什么都不做”的惯性，也解释了为什么品类定义和工作流证据在正面销售中如此重要。竞争者还可能从不同预算线切入同一交易，并压迫同一个买方决策。因此，即使决策人看起来单一，品类地图仍然很宽。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
