  summary: >-
    Cresta 是一家后期联络中心 AI 公司，2017 年源自 Stanford AI Lab。公司销售统一平台，覆盖 AI
    坐席、人工坐席辅助、辅导、质检管理、知识和编排，服务企业客服工作流。公开证据显示其商业规模已具实质性，包括到 2026 年 ARR 超过 $100 million、Fortune 500 客户群，以及 2024 年 11 月完成
    $125 million D 轮；但准确投后估值、收入质量和客户集中度仍未披露。
