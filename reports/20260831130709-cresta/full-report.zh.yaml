        title: 客户细分与 logo 质量
        blocks:
          - type: paragraph
            body: >-
              Cresta 的公开客户证据在 logo 质量上很强，尽管广度披露不完整。可见名单覆盖 United、Alaska、Xanterra、Windstar、Holiday Inn
              等大型旅行和酒店品牌；Oportun、Aqua Finance、Achieve、Snap Finance、Propel 等受监管且高流量的金融服务账户；以及 Cox、Brinks
              Home、Vivint、Aptive 等电信或消费者服务运营商。官方公司材料还提到 United、Cox、Marriott
              这类标杆账户，进一步强化了客户基础的企业级调性。这不能证明低集中度或庞大客户数，但确实表明 Cresta 已进入严肃的一线环境，工作流质量、合规和收入后果都很重要。因此，公开 logo
              组合在定性上很强，即使定量上仍不完整。很少有年轻 AI 软件公司能公开指向这么多可识别的服务运营场景。仅这一点就提高了其余尽调工作的可信度。
