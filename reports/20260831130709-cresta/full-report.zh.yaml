        title: 领导层交接与治理补强
        blocks:
          - type: paragraph
            body: >-
              当前领导层问题的重点不是谁创立 Cresta，而是现有运营班底和旧资料里的创始叙事如何分工。官方材料和 Forbes 都显示，Ping Wu 自 2023 年起担任 CEO；Sebastian Thrun、Tim
              Shi、Zayd Enam 则继续作为创始人留在公司起源故事中。到 2026 年，Cresta 还通过任命 Doug Leone 为董事长、让 Carl Eschenbach
              回归董事会，强化了董事会信号。这些动作更像一家已报出实质 ARR、拿下 Fortune 500
              客户的成熟企业软件公司在补强规模化治理。围绕少数高可见度高管的关键人依赖仍在，但此阶段治理姿态已比创始人中心更机构化。尽调要继续追问的是股权和角色清晰度：创始人仍支撑叙事可信度，经营控制权则已明显转到后期 CEO
              和更有经验的董事会手里。
