      - number: '2.3'
        title: 增长驱动与预算为何此时流动
        blocks:
          - type: paragraph
            body: >-
              2026 年的预算动能看起来真实，尽管 ROI 落地仍不均衡。核心驱动仍是经济性：二级市场摘要提到，AI
              处理和人工处理客服互动之间存在数量级成本差，同时中位回本周期以月而非年计。这些经济性又叠加了高管压力；当前调研和汇编显示，多数服务负责人承压要部署 AI，大多数企业也在投入智能体 AI
              能力。公开市场报告还把需求放在更广的趋势中：超个性化互动、运营效率提升，以及云端联络中心现代化。因此，这个市场采用意愿很强，但赢家不能只靠模型质量；还要拿出可信的集成、治理和运营变革叙事，把预算兴趣转成持久的生产使用。实践中，品类奖励落地能力，至少不低于算法新意和运营纪律。
