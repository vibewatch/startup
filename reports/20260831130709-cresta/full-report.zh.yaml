            - 中
        - label: Knowledge Agent
          values:
            - 中高
            - 高
            - 中
        - label: Coach + Quality 闭环
          values:
            - 高
            - 高
            - 中低
        - label: Opera 编排
          values:
            - 中高
            - 高
            - 中
        - label: Conductor / Synthetic Customers / Training
