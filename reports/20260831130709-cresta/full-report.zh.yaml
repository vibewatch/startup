  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Cresta 最强的公开客户有相似路径：高容量支持、工作流复杂、部署，随后出现可衡量的运营影响。
    data:
      nodes:
        - label: 高容量客户对话
          detail: 航空、贷款、电信和家政服务团队一开始面对的就是一线量大且复杂。
        - label: 质检 / 辅导或自助承接痛点
          detail: 人工 QA、高 AHT、坐席不一致或自助服务弱，会触发评估。
        - label: Cresta 在引导 + 分析 + 自动化上部署
          detail: 平台通过实时引导、QA 或 AI 智能体工作流切入。
        - label: 可衡量业务影响
          detail: 案例随后强调 ROI、自助承接、处理时长、催收、收入或成本节约。
    approximationNotes: 这张图综合多篇客户故事里的共性，而不是追踪单家公司生命周期。
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU031
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开客户证据显示，许多交易从一个高痛点工作流切入；价值跑通后，再扩展到更多渠道或自动化。
    data:
      items:
        - label: 识别复杂工作流痛点
          value: 100
          unit: index
          note: 例子包括催收、预订、留存和 QA 瓶颈。
        - label: 初始引导 / QA 部署
          value: 70
          unit: index
          note: 很多故事从人工坐席辅助或监控开始。
        - label: 工作流扩展到更多团队
          value: 45
          unit: index
          note: Oportun 和 Propel 等例子显示用例在拓宽。
        - label: 自动化 / AI 智能体扩展
          value: 30
          unit: index
          note: Xanterra 等案例显示，早期成效之后会扩大 AI 智能体推出。
        - label: 组合层面粘性得到验证
          value: 20
          unit: index
          note: 公开披露在续约和 NRR 证据前就停止。
    approximationNotes: 漏斗是基于公开扩张线索的叙事代理，不是已披露转化数据。
    claimRefs:
      - CU023
      - CU024
      - CU025
      - CU033
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    layout: wide
    summary: 最强验证同时具备标杆客户质量、可衡量运营结果和工作流复杂度。
    data:
      columns:
        - 标杆客户质量
        - 结果具体度
        - 工作流复杂度
        - 可能粘性
      rows:
        - label: United / Alaska / 航空公司组
          values:
            - 高
            - 中高
            - 高
            - 高
        - label: Oportun / Aqua / Snap / Propel BFSI 组
          values:
            - 中高
            - 高
            - 高
            - 高
        - label: Cox / Brinks / Vivint / Aptive 服务业组
          values:
            - 中高
            - 中
            - 中高
            - 中
        - label: Windstar / Holiday Inn 酒店业组
          values:
            - 中
            - 中
            - 中
            - 中
    approximationNotes: 单元格是基于可获得客户故事具体度和垂直行业复杂度作出的分析师判断。
    claimRefs:
