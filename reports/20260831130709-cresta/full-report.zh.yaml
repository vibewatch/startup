              Cresta 的人员故事是模糊，而不是令人警报。公开记录没有证明士气或裁员问题，但它说明了为什么这一品类天然有很高执行风险：AI
              会把人工工作推向更复杂的升级处理，并把变革管理压力压到一线团队和主管身上。Cresta
              的培训、测试、质检和辅导模块之所以有价值，正是因为它们直接处理这项风险。合适的风险姿态不是假设失败，而是清楚定义打破投资逻辑的条件。隐私诉讼出现不利裁决、重大安全事故、持续无法把试点转成生产扩张，或出现集中度驱动的流失证据，都会实质损害投资案例。目前证据平衡支持高风险评级，而不是关键性致命评级，因为
