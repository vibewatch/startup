  - FO003
- id: milestones-and-adverse-context
  title: Milestones, expansion, and adverse context
  body: 'Cresta''s milestone record shows a business moving from agent-assist origins into a broader automation and orchestration platform. The about page captures the early funding path and first-customer milestone, while 2024 to 2026 releases add international expansion, Knowledge Agent, Conductor, and partner-led distribution through TELUS Digital and Firstsource. This creates a coherent growth story: more product breadth, more global reach, and more enterprise implementation capacity. The main adverse issue in the public record is legal rather than commercial. The 2025 Galanter lawsuit and subsequent law-firm commentary show that AI call-monitoring vendors face escalating consent and privacy risk. There is also an anonymous Blind layoffs thread, but that evidence is too weak to materially change the company-overview judgment absent corroboration. The chronology therefore supports a constructive operating narrative with one clear caution: expansion in AI-powered call workflows raises
    the company''s compliance surface area as quickly as it expands product scope.'
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO020
  - CO021
  - CO022
  - CO023
