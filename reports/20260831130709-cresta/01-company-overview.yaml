  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: hq-headcount-conflict
    missingEvidence: A management-confirmed 2026 employee count and a single canonical headquarters line.
    whyItMatters: Cover metrics and operating-scale comparisons become noisy when public databases disagree on basic company facts.
    diligencePath: Request a management data sheet or HRIS export showing headcount, primary headquarters, and office roster as of 2026-08-31.
    relatedQuestionRefs:
    - QO003
    - QO013
    - QO025
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: valuation-uncertainty
    missingEvidence: Primary documentation of the Series D post-money valuation or board-approved 409A context.
    whyItMatters: Valuation is a key cover fact and later valuation analysis becomes fragile if the current capitalization benchmark is inferred from media lore.
    diligencePath: Request financing documents, a board memo, or a cap-table summary confirming the November 2024 valuation.
    relatedQuestionRefs:
    - QO010
    - QO025
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-scale
    missingEvidence: A disclosed customer count, logo count, or revenue concentration schedule.
    whyItMatters: The company claims Fortune 500 penetration and strong outcomes, but public materials do not quantify account breadth or concentration.
    diligencePath: Request a customer census by logo, ARR band, and vertical with churn and expansion history.
    relatedQuestionRefs:
    - QO012
  - type: access-blocked
    severity: minor
    topic: layoff-signal
    missingEvidence: Reliable press or company disclosures confirming or refuting the anonymous layoffs discussion.
    whyItMatters: A layoffs event could affect delivery capacity and morale, but the current signal is weak and uncorroborated.
    diligencePath: Search wage-and-layoff notices, ask management directly, and compare 2025-2026 hiring and headcount movement from HR analytics providers.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO004
