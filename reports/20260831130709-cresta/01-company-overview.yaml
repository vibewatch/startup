  title: Identity basics are solid, but cover facts still require reconciliation
  body: Founding, product scope, current CEO, and latest round are all well supported. The weak spots are exact headquarters, exact employee count, and current valuation. Those contradictions matter because they influence how investors benchmark operating efficiency and valuation credibility. The right approach is not to guess; it is to carry the ambiguity forward explicitly and request management-grade evidence during diligence.
