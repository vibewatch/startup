company:
  name: Cresta
chapter:
  number: 1
  title: Company Overview
  summary: Cresta enters 2026 as a late-stage private contact-center AI platform with official support for >$100M ARR and >$270M raised, but still with unresolved public contradictions on exact headcount, headquarters, and latest valuation.
sections:
- id: identity-and-platform
  title: Identity, category, and current positioning
  body: 'Cresta presents itself in 2026 as a customer-experience AI company rather than a narrow point solution. The homepage and platform overview consistently frame the business as a unified platform spanning human-agent assistance, AI-agent automation, quality management, coaching, and post-conversation insight. That framing matters because it broadens the company''s category from classic conversation intelligence into a more comprehensive contact-center operating layer. Founding materials trace the company back to Stanford''s AI Lab in 2017, and the public timeline ties the earliest commercial milestone to Intuit as the first customer. Public identity is therefore relatively clear on founding year, product direction, and enterprise orientation even if exact headquarters labeling remains inconsistent across third-party databases. In other words, the category definition is ambitious but legible: Cresta is selling software that touches both labor productivity and customer-experience automation
    budgets.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO017
  - CO018
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Leadership transition and governance reinforcement
  body: 'The main leadership issue is not who founded Cresta, but how the current operating leadership differs from the founding narrative supplied by older sources. Current official materials and Forbes both indicate Ping Wu has served as CEO since 2023, while Sebastian Thrun, Tim Shi, and Zayd Enam remain important founder figures in the company''s origin story. In 2026 Cresta also strengthened board signaling by elevating Doug Leone to chairman and bringing Carl Eschenbach back onto the board. Those moves suggest a scale-up governance posture around a maturing enterprise software company that now claims material ARR and Fortune 500 traction. Key-person dependence still exists around a small, highly visible leadership bench, but the governance posture looks more institutional than founder-centric at this stage. The important diligence follow-up is ownership and role clarity: founders still anchor narrative credibility, while operating control has clearly shifted to a later-stage CEO and
    a more seasoned board.'
  claimRefs:
  - CO002
  - CO006
  - CO007
  - CO008
  - CO009
  - CO016
  tableRefs:
  - TO002
  - TO003
  figureRefs: []
- id: capital-scale-and-footprint
  title: Capital base, scale signals, and coverage caveats
  body: 'The strongest supportable capital fact is the November 2024 Series D: multiple sources align on a $125 million round co-led by QIA and World Innovation Lab, with total funding described by the company as more than $270 million. Revenue scale is also unusually well supported for a private company because both official materials and Axios point to Cresta surpassing $100 million in ARR by 2026. By contrast, other snapshot metrics remain messy. Cresta itself says it has 600-plus employees and 10-plus hubs, while Forbes reports 500 employees and Palo Alto headquarters, and Revelio places headcount at 626 with a Sunnyvale headquarters label. The right diligence posture is to treat scale as clearly substantial while preserving numeric uncertainty around precise headcount and headquarters. That is especially important because later benchmarking on revenue per employee or valuation per employee would otherwise overstate precision the public record does not actually support. It also affects
    customer-supportability judgments, because delivery depth and geographic coverage depend partly on workforce composition that the public record only approximates.'
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO024
  - CO025
  - CO026
  - CO027
  - CO028
  - CO029
  - CO030
