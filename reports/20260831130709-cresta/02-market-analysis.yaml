company:
  name: Cresta
chapter:
  number: 2
  title: Market Analysis
  summary: 'Cresta operates inside a fast-growing but still operationally immature call-center-AI market: 2026 size estimates cluster around roughly $3B-$4B+, executive pressure is high, and the real bottleneck is integration, trust, and workforce readiness rather than buyer interest.'
sections:
- id: market-boundary
  title: Market boundary and adjacent spend
  body: 'For Cresta, the right market frame is narrower than “all customer-service software” but broader than legacy speech analytics. The most useful boundary is call center AI: software and services that automate customer interactions, assist live agents, score quality, surface insights, and orchestrate workflows across contact-center operations. The Business Research Company and Research and Markets both support that broader call-center-AI frame by including platforms, solutions, and services across cloud and on-premise deployments. That still excludes a large amount of adjacent spend, however, including generic CRM licenses, full CCaaS seat revenue, broader enterprise automation, and support categories that do not touch contact-center intelligence or execution. This boundary choice matters because public TAM estimates vary sharply depending on whether those adjacent pools are included. It also helps explain why infrastructure-heavy incumbents and application-layer AI vendors can both
    appear in the same analyst landscape without actually addressing identical budgets.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: buyers-and-segments
  title: Buyer, user, and segment structure
  body: 'The market is enterprise-led and workflow-specific. Buyers are typically contact-center operations leaders, CX executives, digital-service leaders, or IT stakeholders sponsoring integration, while users include frontline agents, supervisors, QA managers, analysts, and increasingly AI-agent operators. Payers vary by company maturity: some programs sit in service operations budgets, some in digital transformation or IT, and some are justified against labor-efficiency targets. The vertical mix is consistent across sources, with BFSI, telecom, retail, healthcare, and travel repeatedly listed as core adopters. Cresta''s current customer stories and content focus line up especially well with BFSI, telecom, and travel or hospitality accounts. Importantly, voice remains central to the market even as digital channels expand, because the phone still anchors the highest-stakes and often highest-cost customer interactions. That is one reason vendor claims around real-time guidance, transcription
    quality, and compliant automation still matter more than simple chatbot volume. It also favors vendors that can support complex escalations, not just FAQ deflection.'
  claimRefs:
  - CM014
  - CM015
  - CM016
  - CM017
  - CM018
  - CM019
  tableRefs:
  - TM003
  figureRefs:
  - FM003
- id: growth-drivers
  title: Growth drivers and why budgets are moving now
  body: 'Budget momentum in 2026 appears real even if ROI realization remains uneven. The core driver is still economic: secondary market summaries cite an order-of-magnitude cost gap between AI-handled and human-handled service interactions, along with median payback periods measured in months rather than years. Those economics are reinforced by executive pressure, with current surveys and compilations showing most service leaders under pressure to deploy AI and large majorities investing in agentic AI capabilities. Public market reports also frame demand as part of a broader push toward hyper-personalized engagement, operational efficiency, and cloud-based contact-center modernization. The result is a market where adoption intent is strong, but winning vendors need more than model quality: they need credible integration, governance, and operating-change narratives to convert budget interest into durable production usage. In practice, the category rewards deployment competence at least
    as much as algorithmic novelty and operational discipline.'
  claimRefs:
  - CM020
  - CM021
  - CM022
  - CM023
  - CM024
  - CM025
  - CM026
  tableRefs:
  - TM002
  figureRefs:
  - FM002
- id: constraints-and-adoption-funnel
  title: Constraints, trust, and the real adoption funnel
  body: 'The biggest mistake in this market is to confuse “using AI somewhere” with having it operationalized in frontline service. The most important constraint is the integration and readiness gap: Brilo says 88% of centers use AI but only 25% have fully integrated it, while CX Today and Krista both argue that weak change management, training, and data integration are what keep pilots from compounding into production value. Trust remains another friction point. Customers still prefer human support for many cases, and public survey summaries show a meaningful trust gap between what operators believe and what consumers are willing to accept. Regulation adds another layer: Europe''s AI Act and longstanding U.S. consumer-contact rules raise the cost of deploying autonomous or semi-autonomous voice systems at enterprise scale. Hybrid human-plus-AI models therefore look more practical than fully autonomous ones. For Cresta, that is favorable because the company explicitly sells both automation
    and human augmentation rather than insisting on full replacement.'
  claimRefs:
  - CM027
  - CM028
  - CM029
