  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-gap
    missingEvidence: A disclosed seat base, customer count, workflow mix, and average contract value needed to build a Cresta-specific SAM or SOM.
    whyItMatters: Market size alone does not determine investability; investors need to know what fraction of the category Cresta can realistically monetize.
