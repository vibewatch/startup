callouts:
- calloutType: insight
  title: This is a “large enough, but not self-proving” market
  body: The category is clearly large enough to support a venture-scale outcome, but large-market rhetoric alone is not enough. The most important market fact is not the exact TAM number; it is that most enterprises are still struggling to operationalize AI in contact centers. Vendors that can close the integration, governance, and readiness gap should capture disproportionate share even if the published market range remains noisy.
  claimRefs:
  - CM007
  - CM008
  - CM011
  - CM027
  - CM029
- calloutType: risk
  title: Adoption intent is high, but trust and implementation remain gating factors
  body: Secondary 2026 sources show broad AI experimentation, yet they also show a meaningful trust gap and persistent production failures. That means buyers may sign pilots quickly while taking longer to standardize on a platform. For Cresta, the ability to prove controlled deployment and hybrid oversight likely matters more than aggressive autonomy claims.
  claimRefs:
  - CM020
  - CM021
  - CM027
  - CM030
  - CM031
  - CM035
acknowledgedWarnings:
- dimension: tableNotes
  reason: The chapter uses factual reference exhibits to preserve boundary and sizing dispersion; notes are included to explain assumptions and limitations.
