- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: The usable market narrows from broad customer-service and contact-center software into the smaller call-center-AI wedge where Cresta actually sells differentiated workflows.
  data:
    items:
    - label: Broad customer-service / contact-center software shell
      detail: Largest adjacency, but includes infrastructure and software categories Cresta does not capture directly.
      tone: warning
    - label: Call center AI category
      detail: Analyst definitions include platforms, solutions, and services for AI-driven customer interactions and workforce workflows.
      tone: positive
    - label: Enterprise hybrid automation + augmentation wedge
      detail: Cresta's practical target combines AI agents, live-agent assist, QA, and orchestration for large service operations.
      tone: positive
    - label: Production-ready governed deployments
      detail: The final wedge is smaller still because many AI pilots never operationalize at scale.
      tone: warning
  approximationNotes: This pyramid is a boundary-narrowing device rather than a publisher-issued TAM/SAM/SOM stack.
