- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Five9
    - 2026 market cap / TTM revenue
    - $2.53B / $1.17B ≈ 2.2x revenue
    - Closest public CCaaS-style contact-center comp with AI positioning
    - Broader and more mature public business
  - - NICE
    - 2026 market cap / TTM revenue
    - $6.44B / $3.01B ≈ 2.1x revenue
    - Large incumbent CX and analytics comp with enterprise buyer overlap
    - Scale and business mix differ materially from Cresta
  - - Salesforce
    - 2026 market cap / TTM revenue
    - $213.98B / $42.82B ≈ 5.0x revenue
    - Upper public software anchor with service AI relevance
    - Very broad platform, not a pure contact-center AI comp
  - - AI Infrastructure Map Cresta estimate
    - Secondary post-money estimate
    - ~$747M post-money on 2024 Series D
    - Shows a lower visible private-market breadcrumb
    - Methodology is opaque and not primary
  - - Craft / profile-site Cresta estimate
    - Secondary profile estimate
    - ~$1.6B valuation listing
    - Shows the high visible private-market breadcrumb
    - May reflect stale or unverified aggregator data
  notes: This comparable set is intentionally partial and valuation-focused. It covers the cleanest accessible public anchors plus the two conflicting private-market breadcrumbs surfaced in the fetch corpus.
  enumerationScope:
    coverage: partial
    basis: Covers the most decision-relevant accessible valuation anchors and conflicting private breadcrumbs found in current public research; it is not a complete peer list.
