callouts:
- calloutType: strength
  title: Operating proof is stronger than typical for a private AI startup
  body: Cresta is not suffering from a total-information problem. Funding, ARR milestone, customer proof, and product breadth are all more visible than at many private software companies of similar stage. That matters because it means the recommendation is not being held back by a lack of operating evidence; it is being held back by the narrower but more consequential absence of trustworthy pricing and quality-of-revenue data.
  claimRefs:
  - CV001
  - CV003
  - CV005
  - CV006
  - CV008
- calloutType: risk
  title: Do not confuse strong company quality with strong entry quality
  body: If an investor cannot confirm post-money valuation, preference stack, ARR quality, and concentration, then even a very good company can still be a weak investment at the wrong price. The disciplined outcome here is to keep Cresta on the active list while refusing false precision about fair value.
  claimRefs:
  - CV009
  - CV013
  - CV016
  - CV036
  - CV037
  - CV040
  - CV041
