  - CV041
  - CV042
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Series D pricing and terms
    - Signed financing docs, post-money valuation, preference stack
    - Defines whether current price is fair, stretched, or attractive
    - Company finance team / lead investor
  - - Revenue quality
    - Exact ARR, GAAP revenue run rate, NRR, gross margin
    - Needed to justify any premium to public comps
    - Finance leadership / board materials
  - - Customer concentration
    - Top 10 customers by ARR and renewal schedule
    - Determines downside from logo churn
    - CRO / customer success ops
  - - Unit economics and burn
    - Burn, runway, sales efficiency, and services burden
    - Changes risk rating and exit timing assumptions
    - CFO package
  - - Litigation and compliance posture
    - Case status, insurance, consent workflows, audit logs
    - Can rapidly impair deployability and valuation
    - Legal / compliance review
  notes: If these asks are answered well, the recommendation could move quickly. If they are answered poorly, the thesis can break just as quickly.
