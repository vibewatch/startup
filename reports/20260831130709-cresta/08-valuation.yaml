- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Privacy litigation worsens
    - Adverse ruling, injunction, or material settlement
    - Undermines trust, slows deployments, and compresses multiple
    - Pause or re-underwrite immediately
  - - Down-round financing
    - Next capital raise clears well below current expectations
    - Signals weaker growth or bargaining power than narrative implied
    - Reset return model and downside assumptions
  - - Large-logo churn or concentration revealed
    - Top account churns or top-three concentration proves very high
    - Weakens revenue durability and customer-proof narrative
    - Lower conviction and valuation ceiling
  - - Pilot conversion stalls
    - Flagship deployments fail to expand or references weaken
    - Breaks platform-scale expansion thesis
    - Move from track to avoid absent new evidence
  - - Security or reliability event
    - Material breach, outage, or repeat rollback failure
    - Damages enterprise trust and buyer willingness
    - Re-rate risk toward critical
  notes: Each trigger is chosen because it is both monitorable and directly connected to valuation and recommendation.
  claimRefs:
