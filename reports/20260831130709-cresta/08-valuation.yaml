- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Support
  - What would change the view
  rows:
  - - Scaled late-stage AI platform
    - '>$100M ARR, >$270M funding, Fortune 500 deployments'
    - Evidence that ARR quality or retention is weak
  - - Product breadth can widen share of wallet
    - Platform now spans coaching, QA, knowledge, and AI-agent workflows
    - Proof that new modules are low adoption or low monetization
  - - Investor base can support continued scaling
    - QIA-led Series D plus existing blue-chip backers
    - Punitive future financing terms or investor pullback
  - - Valuation evidence is too thin
    - Primary sources omit post-money price and secondary marks conflict
    - Signed round docs or board memo confirming price and terms
  - - Public comps imply caution
    - Observable public range is well below high-end private breadcrumbs
    - Verified hypergrowth and margins strong enough to justify durable premium
  - - Risk overhang remains live
    - Privacy, deployment, and concentration risks can transmit quickly to valuation
    - Clear resolution of litigation and concentration opacity
  notes: Rows pair the investable qualities with the exact evidence gaps that would change the recommendation.
