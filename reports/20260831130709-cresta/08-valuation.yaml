- id: scenario-range-and-comparable-set
  title: Public comparables anchor the downside better than they define the upside
  body: The cleanest observable anchor is the public-comp set, not the private-market rumor mill. Based on August 2026 market-cap and trailing-revenue figures, Five9 and NICE both trade around low-two-times revenue while Salesforce trades around five times. That produces a visible public range of roughly 2.1x to 5.0x. On the disclosed ARR floor of $100 million, even AI Infrastructure Map’s lower secondary estimate for Cresta implies a multiple around 7.5x, while the higher $1.6 billion breadcrumbs imply more than 16x. Both sit above the public-comparable band. A premium could still be deserved because Cresta appears to be growing faster than mature public suites and may have a more AI-native product narrative, but public evidence does not show the exact ARR numerator, quality of revenue, gross margins, NRR, or preference structure needed to defend a large premium. That is why public comparables define the floor and the scenario table defines the ceiling of what can be argued responsibly.
    The upside case remains conditional, not bankable.
