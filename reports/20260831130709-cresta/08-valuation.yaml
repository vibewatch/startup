- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Actual ARR materially above public floor, AI-agent products expand wallet share, privacy issues remain contained
    - Could support roughly $0.9B-$1.2B+ valuation range and better forward returns if entry is below that band
    - Premium fades, modules do not monetize, governance incident
    - Requires private data to prove
  - - Base
    - ARR only moderately above floor, growth stays good but not explosive, investors grant modest premium to public comps
    - Supports roughly $0.6B-$0.8B reference range with limited margin for error
    - Customer concentration or integration friction caps multiple
    - Most defensible from public data
  - - Bear
    - Growth disappoints, litigation worsens, or public-like comp compression dominates
    - Value drifts toward roughly $0.3B-$0.5B floor band on low public multiples
    - Down-round, churn, or poor quality-of-revenue revealed
    - Not unlikely if hidden quality metrics are weak
  notes: Scenario values are illustrative public-evidence ranges, not board-grade valuations. They use the disclosed ARR floor and comparable-multiple logic rather than a full DCF.
