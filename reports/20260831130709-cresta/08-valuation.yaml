company:
  name: Cresta
chapter:
  number: 8
  title: Valuation
  summary: Cresta looks like a credible late-stage contact-center AI platform, but the public record does not cleanly establish the current price. The correct stance is track with medium confidence and valuation recorded as unknown until round terms and revenue-quality metrics are opened.
sections:
- id: thesis-and-underwriting-frame
  title: The company quality is real, but the underwriting frame must stay price-sensitive
  body: 'Cresta has enough public evidence to support a serious company-quality discussion. Official and third-party sources corroborate a $125 million Series D, total funding above $270 million, and an ARR milestone above $100 million by 2026. Customer evidence is also stronger than average for a private AI company, with Fortune 500 logos and repeated outcome claims across the site. Product breadth has expanded beyond classic agent assist into automation, quality, orchestration, and AI-agent workflows. That combination supports the pro-thesis: Cresta looks like a scaled, credible late-stage contact-center AI platform rather than a thin demo company. The underwriting problem is that company quality is not the same as entry quality. Public valuation support is much weaker than the operating proof, and risk evidence on privacy, deployment, and concentration means the recommendation should remain explicitly price-sensitive. Strong operating evidence alone cannot solve that pricing problem.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  tableRefs:
  - TV001
  - TV002
