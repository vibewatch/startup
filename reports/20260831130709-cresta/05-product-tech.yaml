company:
  name: Cresta
chapter:
  number: 5
  title: Product & Technology
  summary: Cresta’s product stack is unusually broad for a private contact-center AI vendor, combining automation, augmentation, testing, coaching, and governance; the main remaining gaps are public reliability evidence and independent practitioner signal.
sections:
- id: platform-and-modules
  title: Product definition and module map
  body: 'Cresta''s product is best understood as a unified contact-center AI operating layer rather than a single automation bot. The company now markets a module set that spans autonomous AI Agent, Knowledge Agent, Quality Management, Coach, Opera orchestration, and a shared integrations layer. That matters because the value proposition is not just “answer more calls automatically.” It is to run customer conversations, coach humans, measure quality, and operationalize change on the same conversation substrate. The architecture implied by public pages is modular but tightly connected: AI Agent extends legacy assist capabilities, Knowledge Agent handles context retrieval and guided workflows, and quality and coaching close the loop on what actually changes behavior. In product terms, Cresta is selling system-level workflow improvement rather than a narrow conversational interface alone. That is a more ambitious product scope than most AI-support startups attempt publicly. It also creates
    more cross-module upsell potential if the integration layer is genuinely reusable across deployments.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: workflow-and-architecture
  title: Workflow design, operating flow, and integrations
  body: 'Public product pages give a fairly specific view of how Cresta wants the platform to be used. Teams define agent identity, prompts, safeguards, and tool access; connect the system to enterprise applications and knowledge sources; test against simulated conversations; then deploy governed rollouts with rollback and optimization loops. Omnichannel operation is central, with voice and digital interactions sharing context and brand controls. Knowledge Agent and Opera are important because they move the system beyond simple response generation into real workflow execution, while integrations keep the platform tethered to telephony, CRM, and knowledge systems already in use. The resulting operating model is layered rather than replacement-oriented: Cresta sits above existing systems of record and depends on connector quality, data freshness, and workflow design to make automation and augmentation reliable. That is powerful when it works, but it also makes implementation quality a central
    part of the product. Product depth and deployment depth are inseparable here.'
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE016
  - CE017
  - CE018
