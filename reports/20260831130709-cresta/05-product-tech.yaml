    - Manual prompt iteration
    - Conductor + testing flow
    - Structured build/test/deploy cycle
    - No public SLA or rollout failure rate
  - - Prepare agents for new scenarios
    - Role-play or static materials
    - Training Simulator
    - Practice with realistic, adaptive scenarios
    - Independent training efficacy data absent
