  - TE002
  - TE003
  figureRefs:
  - FE002
- id: trust-and-controls
  title: Trust, privacy, and deployment controls
  body: 'Cresta''s public trust posture is unusually explicit by startup standards. The company claims ISO/IEC 42001 certification, PCI-DSS and ISO 27701 compliance, third-party penetration testing, automatic PII redaction, and a responsible-AI program centered on transparency and privacy. The test-and-deploy workflow adds another layer of control through simulations, approvals, versioning, audit trails, and one-click rollback. Together these claims suggest the company understands that enterprise contact-center AI lives or dies on controllability, not on demo fluency alone. The caveat is that public detail stops short of operational evidence: there are no disclosed uptime metrics, evaluation pass rates, or incident histories. Still, compared with typical AI-vendor marketing, Cresta has at least sketched a coherent trust architecture that links policy claims to workflow controls. The missing next step is measurable proof that those controls work in production every day.'
  claimRefs:
  - CE008
  - CE009
  - CE019
  - CE020
  - CE021
  - CE022
  - CE023
  - CE033
  - CE034
  tableRefs:
  - TE004
  figureRefs:
  - FE003
- id: maturity-and-risks
  title: Product maturity, roadmap, and technical diligence gaps
  body: The clearest pattern in the roadmap is expansion from live-agent augmentation into a broader agent lifecycle stack. Knowledge Agent, Synthetic Customers, Training Simulator, and Conductor all deepen the company's ability to build, evaluate, and improve both human and AI-agent performance. That is strategically sensible because market competition is moving toward governed production systems rather than isolated copilots. At the same time, the product story retains two technical weaknesses from a diligence perspective. First, practitioner signal is thin outside hiring and press, which makes it hard to validate developer love or implementation smoothness independently. Second, the public record says very little about uptime, benchmark quality, hallucination rates, or SLA performance. The product therefore looks thoughtful and broad, but still needs hands-on technical validation in a management diligence process. The roadmap is credible; the independent verification layer is still thin.
    That is the tradeoff of a fast-moving private platform company today, especially in enterprise AI software markets globally now.
  claimRefs:
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
