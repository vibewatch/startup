  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-gap
    missingEvidence: SLA, uptime, model evaluation pass rates, hallucination/error rates, and incident history by product module.
    whyItMatters: Technical diligence depends on whether the governed deployment story translates into measurable production reliability.
    diligencePath: Request production dashboards, incident reports, benchmark eval packs, and connector-level reliability data.
    relatedQuestionRefs:
    - QE021
    - QE025
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: Independent practitioner communities, public repos, or package-adoption evidence for Cresta’s technology.
    whyItMatters: Hiring pages are only a weak proxy for developer adoption or implementation quality.
    diligencePath: Request customer engineering references, implementation partner references, and deployment architecture reviews.
    relatedQuestionRefs:
    - QE017
    - QE025
callouts:
- calloutType: strength
  title: Cresta has built a real platform story, not just an AI-agent demo
  body: The product surface now spans design, deployment, testing, optimization, knowledge, quality, and coaching. That breadth is strategically useful because enterprise contact-center buyers do not just need an AI agent; they need a controlled operating system for changing workflows without breaking trust or compliance.
  claimRefs:
  - CE001
  - CE005
  - CE008
  - CE012
  - CE014
  - CE015
  - CE016
  - CE024
- calloutType: risk
  title: Technical maturity still needs production proof
  body: Cresta’s public product detail is richer than average, but the company still does not disclose uptime, evaluation pass rates, hallucination rates, or incident history. The technology story is coherent; the reliability story is still mostly asserted rather than audited.
  claimRefs:
  - CE019
  - CE020
  - CE023
  - CE033
  - CE034
acknowledgedWarnings:
- dimension: tableNotes
  reason: The exhibits summarize logical architecture and maturity from public materials; notes clarify where the public record stops short of audited technical evidence.
