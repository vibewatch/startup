  summary: Cresta’s public architecture layers conversation capture, knowledge, orchestration, quality, and governed deployment into one operating stack.
  data:
    layers:
    - label: Channel Layer
      detail: Voice and digital customer interactions enter through a unified AI Agent and agent-assist surface.
    - label: Shared Context Layer
      detail: Conversation data, knowledge, and workflow context are reused across human and AI agent experiences.
    - label: Guidance and Resolution Layer
      detail: Knowledge Agent, AI Agent, and Opera workflows surface answers, next actions, and automations.
    - label: Quality and Coaching Layer
      detail: Quality Management and Coach score behaviors, detect risk, and reinforce desired actions.
    - label: Testing and Governance Layer
      detail: Synthetic Customers, approvals, audit trails, and rollback govern releases and ongoing optimization.
    - label: Integration Layer
      detail: Bi-directional integrations connect telephony, CRM, chat, and knowledge systems at operational latency.
  approximationNotes: Cresta does not publish a formal architecture diagram; this is a logical stack assembled from product pages.
