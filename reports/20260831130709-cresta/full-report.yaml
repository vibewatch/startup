      - number: '2.4'
        title: Constraints, trust, and the real adoption funnel
        blocks:
          - type: paragraph
            body: >-
              The biggest mistake in this market is to confuse “using AI somewhere” with having it operationalized in
              frontline service. The most important constraint is the integration and readiness gap: Brilo says 88% of
              centers use AI but only 25% have fully integrated it, while CX Today and Krista both argue that weak
              change management, training, and data integration are what keep pilots from compounding into production
              value. Trust remains another friction point. Customers still prefer human support for many cases, and
              public survey summaries show a meaningful trust gap between what operators believe and what consumers are
              willing to accept. Regulation adds another layer: Europe's AI Act and longstanding U.S. consumer-contact
              rules raise the cost of deploying autonomous or semi-autonomous voice systems at enterprise scale. Hybrid
              human-plus-AI models therefore look more practical than fully autonomous ones. For Cresta, that is
              favorable because the company explicitly sells both automation and human augmentation rather than
              insisting on full replacement.
            claimRefs:
