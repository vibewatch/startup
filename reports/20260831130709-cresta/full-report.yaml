      - number: '2.3'
        title: Growth drivers and why budgets are moving now
        blocks:
          - type: paragraph
            body: >-
              Budget momentum in 2026 appears real even if ROI realization remains uneven. The core driver is still
              economic: secondary market summaries cite an order-of-magnitude cost gap between AI-handled and
              human-handled service interactions, along with median payback periods measured in months rather than
              years. Those economics are reinforced by executive pressure, with current surveys and compilations showing
              most service leaders under pressure to deploy AI and large majorities investing in agentic AI
              capabilities. Public market reports also frame demand as part of a broader push toward hyper-personalized
              engagement, operational efficiency, and cloud-based contact-center modernization. The result is a market
              where adoption intent is strong, but winning vendors need more than model quality: they need credible
              integration, governance, and operating-change narratives to convert budget interest into durable
              production usage. In practice, the category rewards deployment competence at least as much as algorithmic
              novelty and operational discipline.
