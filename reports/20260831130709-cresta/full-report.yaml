            body: >-
              Cresta's milestone record shows a business moving from agent-assist origins into a broader automation and
              orchestration platform. The about page captures the early funding path and first-customer milestone, while
              2024 to 2026 releases add international expansion, Knowledge Agent, Conductor, and partner-led
              distribution through TELUS Digital and Firstsource. This creates a coherent growth story: more product
