      - number: '7.2'
        title: Operational risk centers on deployment quality and trust
        blocks:
          - type: paragraph
            body: >-
              The next-ranked risk is operational underdelivery: the possibility that strong demos and strong pilot
              interest do not convert into stable, governed, scaled production usage. Third-party market evidence
              consistently points to integration difficulty, workforce readiness, and trust gaps as the main causes of
              AI-contact-center underperformance. That lines up with Cresta’s own product emphasis on testing,
              approvals, rollback, training, quality, and coaching. These are sensible mitigations, but they also
              implicitly admit the problem space is difficult. The biggest unresolved operational weakness is the
              absence of public reliability evidence. There are no disclosed uptime targets, incident histories, or
              benchmark pass rates for key products. That means investors can see the control framework, but not yet the
              empirical performance of that framework under live enterprise conditions. Enterprise buyers may tolerate
              some novelty, but not opaque reliability. This is the central non-legal risk in the file.
