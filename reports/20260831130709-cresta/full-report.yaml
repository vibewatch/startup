              The core weakness in the customer chapter is breadth disclosure. Cresta publishes many strong stories, but
              it does not disclose customer count, ARR concentration, churn, standardized satisfaction measures, or a
              balanced set of neutral customer references. That means the public record can support a strong claim about
              who the company can win and what kinds of workflows it can improve, but not a strong claim about how
              diversified or retention-rich the customer base is overall. The customer quality signal is therefore
