      - number: '3.4'
        title: Switching cost, multi-homing, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Cresta benefits from being able to sit on top of existing stacks instead of forcing a full migration, but
              that same advantage cuts both ways. Layering into incumbent telephony, CRM, and knowledge systems reduces
              adoption friction, yet it also makes multi-homing easier and lowers the barrier for buyers to trial
              alternative overlays or internal builds. The most commoditization-exposed parts of the offer are generic
              AI-agent promises, basic real-time guidance, and summarization. The more defensible layer is
              workflow-specific deployment grounded in shared conversation data, governed automation, and quality or
              coaching systems that help enterprises operationalize AI safely. Even so, without clean public win-rate,
              churn, or displacement data, moat conclusions remain provisional and should be validated directly with
              customer references and pipeline conversion evidence. This is a market where technical coexistence helps
              early sales and weakens long-term lock-in at the same time. Execution evidence, not architecture alone,
              will decide durability.
            claimRefs:
