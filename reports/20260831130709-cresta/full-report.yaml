        title: Capital adequacy, public comps, and verdict
        blocks:
          - type: paragraph
            body: >-
              The capital story is good enough to be constructive but not good enough to be precise. Cresta raised $125
              million in late 2024 and says lifetime funding now exceeds $270 million, while current ARR is above $100
              million. That combination implies a business with meaningful scale and some financing flexibility. Public
              comps help frame what maturity could look like: Five9, NICE, and Salesforce all operate at much larger
              revenue bases and much lower simple revenue multiples than an aggressive private AI mark would imply. Even
              so, the main diligence blocker is not topline scarcity; it is disclosure scarcity. Without audited gross
              margin, burn, net retention, or cash-on-hand data, an investor can say revenue quality looks promising but
              cannot underwrite the margin path or next-financing dependency with confidence. This chapter therefore
              lands as encouraging but incomplete, not investment-grade certainty. A management data room could
