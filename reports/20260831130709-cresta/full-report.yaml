      - number: '1.3'
        title: Capital base, scale signals, and coverage caveats
        blocks:
          - type: paragraph
            body: >-
              The strongest supportable capital fact is the November 2024 Series D: multiple sources align on a $125
              million round co-led by QIA and World Innovation Lab, with total funding described by the company as more
              than $270 million. Revenue scale is also unusually well supported for a private company because both
              official materials and Axios point to Cresta surpassing $100 million in ARR by 2026. By contrast, other
              snapshot metrics remain messy. Cresta itself says it has 600-plus employees and 10-plus hubs, while Forbes
              reports 500 employees and Palo Alto headquarters, and Revelio places headcount at 626 with a Sunnyvale
              headquarters label. The right diligence posture is to treat scale as clearly substantial while preserving
              numeric uncertainty around precise headcount and headquarters. That is especially important because later
              benchmarking on revenue per employee or valuation per employee would otherwise overstate precision the
              public record does not actually support. It also affects customer-supportability judgments, because
              delivery depth and geographic coverage depend partly on workforce composition that the public record only
              approximates.
