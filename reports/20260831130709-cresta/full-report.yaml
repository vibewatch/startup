            title: Privacy-consent exposure is the fastest thesis-break path
            body: >-
              The public lawsuit and supporting legal commentary matter because Cresta’s product sits directly inside
              recorded customer interactions. An adverse legal interpretation would not just create legal expense; it
              could slow deployments, unsettle buyers, and erode trust in the platform’s core use cases.
