  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory risk is the top-ranked exposure
        blocks:
          - type: paragraph
            body: >-
              Cresta’s highest-priority risk is legal and regulatory rather than purely technical. The public record
              contains an active privacy lawsuit, Galanter v. Cresta Intelligence, and multiple independent law-firm
              analyses frame AI call-monitoring litigation as an emerging category risk rather than a one-off dispute.
              California’s all-party-consent framework is a clear reason this matters. If Cresta’s software is used in
              ways that create ambiguous disclosure or consent practices, the risk can move quickly from legal theory
              into customer and go-to-market friction. Europe adds a second layer through the AI Act and broader
              privacy-rights obligations, while U.S. telemarketing rules still matter for outbound automation. The
              company has credible mitigation language around governance and privacy, but these controls do not erase
              the core fact that contact-center AI operates directly inside heavily regulated customer interactions.
              Regulatory complexity is therefore structural, not incidental. It should stay at the top of every
              diligence checklist.
