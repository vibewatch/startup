        title: Efficiency proxies and cost-structure blind spots
        blocks:
          - type: paragraph
            body: >-
              Because Cresta is private, public efficiency analysis has to rely on imperfect proxies. Combining the
              disclosed ARR threshold with public headcount estimates suggests ARR per employee somewhere around the
              mid-$100k range, but both numerator and denominator are noisy and should not be mistaken for a management
              KPI. More useful are the customer outcomes that hint at why enterprises pay for the product: lower handle
              time, higher containment, faster collections, cost savings, and revenue lift. Those indicators support
              economic relevance, but they still do not reveal gross margin, services burden, or CAC payback. The public
              record also suggests implementation and change-management costs are meaningful because Cresta integrates
              into complex legacy stacks and supports enterprise-grade deployments rather than lightweight self-serve
              onboarding. That likely raises services and customer-success load compared with a pure self-serve software
