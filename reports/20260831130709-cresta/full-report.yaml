            body: >-
              The main threat is not that every competitor beats Cresta on every workflow. It is that large suites can
              bundle “good enough” AI into existing contracts while AI-native challengers attack narrower jobs with
              simpler economics. Cresta wins if its cross-workflow platform value is large enough to justify a separate
              enterprise platform decision.
