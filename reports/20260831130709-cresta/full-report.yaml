      - number: '3.3'
        title: Pricing, packaging, and segment fit
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is a competitive weakness for Cresta. The company does not expose a standard
              price page on its own site, so the clearest public benchmark comes from AWS Marketplace and third-party
              pricing analyses. Those sources point to a high enterprise entry point for Agent Assist alone, with
              additional products and usage likely increasing contract value. In contrast, several competitors frame
              entry economics per agent, per user, or per resolved conversation. That difference matters because Cresta
              sits between two pricing worlds: the seat-based logic familiar to contact-center software buyers and the
              outcome-based logic increasingly used by AI-agent challengers. The result is that Cresta looks best
              matched to larger organizations that can justify six-figure annual commitments and implementation effort
              across multiple workflows. For smaller or earlier-stage teams, simpler pricing may be enough to win the
              first pilot. Procurement friction itself becomes a competitive variable here, especially in
              budget-constrained accounts and faster sales cycles.
