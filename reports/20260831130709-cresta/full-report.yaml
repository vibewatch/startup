  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape, direct peers, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Cresta no longer competes in a single tidy category. Buyers can solve the same job with broad suite
              incumbents such as NICE, Five9, Genesys, Salesforce, or Talkdesk; with AI-native challengers such as
              Observe.AI, Uniphore, Quiq, Ada, Balto, and Forethought; or with adjacent conversation-intelligence tools
              such as Gong and ZoomInfo Chorus that matter for some workflows but do not replicate the full
              contact-center operating layer. The status quo is still a competitor as well: many centers continue to
              rely on manual QA, manual coaching, and incumbent CCaaS plus CRM stacks without a dedicated AI platform.
              That means Cresta is competing both against large installed-base vendors and against “do nothing” inertia,
              which is why category definition and workflow proof matter so much in head-to-head selling. It also means
              competitors can enter deals from different budget lines and still pressure the same buyer decision. The
              category map is therefore broad even when the decision maker looks singular.
            claimRefs:
