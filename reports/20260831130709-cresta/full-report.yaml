  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, category, and current positioning
        blocks:
          - type: paragraph
            body: >-
              Cresta presents itself in 2026 as a customer-experience AI company rather than a narrow point solution.
              The homepage and platform overview consistently frame the business as a unified platform spanning
              human-agent assistance, AI-agent automation, quality management, coaching, and post-conversation insight.
              That framing matters because it broadens the company's category from classic conversation intelligence
              into a more comprehensive contact-center operating layer. Founding materials trace the company back to
              Stanford's AI Lab in 2017, and the public timeline ties the earliest commercial milestone to Intuit as the
              first customer. Public identity is therefore relatively clear on founding year, product direction, and
              enterprise orientation even if exact headquarters labeling remains inconsistent across third-party
              databases. In other words, the category definition is ambitious but legible: Cresta is selling software
              that touches both labor productivity and customer-experience automation budgets.
