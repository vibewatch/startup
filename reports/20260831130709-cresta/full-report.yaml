      - number: '5.2'
        title: Workflow design, operating flow, and integrations
        blocks:
          - type: paragraph
            body: >-
              Public product pages give a fairly specific view of how Cresta wants the platform to be used. Teams define
              agent identity, prompts, safeguards, and tool access; connect the system to enterprise applications and
              knowledge sources; test against simulated conversations; then deploy governed rollouts with rollback and
              optimization loops. Omnichannel operation is central, with voice and digital interactions sharing context
              and brand controls. Knowledge Agent and Opera are important because they move the system beyond simple
              response generation into real workflow execution, while integrations keep the platform tethered to
              telephony, CRM, and knowledge systems already in use. The resulting operating model is layered rather than
              replacement-oriented: Cresta sits above existing systems of record and depends on connector quality, data
              freshness, and workflow design to make automation and augmentation reliable. That is powerful when it
              works, but it also makes implementation quality a central part of the product. Product depth and
              deployment depth are inseparable here.
