      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: This is a “large enough, but not self-proving” market
            body: >-
              The category is clearly large enough to support a venture-scale outcome, but large-market rhetoric alone
              is not enough. The most important market fact is not the exact TAM number; it is that most enterprises are
              still struggling to operationalize AI in contact centers. Vendors that can close the integration,
              governance, and readiness gap should capture disproportionate share even if the published market range
              remains noisy.
            calloutType: insight
            claimRefs:
