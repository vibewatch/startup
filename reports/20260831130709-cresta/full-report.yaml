  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adjacent spend
        blocks:
          - type: paragraph
            body: >-
              For Cresta, the right market frame is narrower than “all customer-service software” but broader than
              legacy speech analytics. The most useful boundary is call center AI: software and services that automate
              customer interactions, assist live agents, score quality, surface insights, and orchestrate workflows
              across contact-center operations. The Business Research Company and Research and Markets both support that
              broader call-center-AI frame by including platforms, solutions, and services across cloud and on-premise
              deployments. That still excludes a large amount of adjacent spend, however, including generic CRM
              licenses, full CCaaS seat revenue, broader enterprise automation, and support categories that do not touch
              contact-center intelligence or execution. This boundary choice matters because public TAM estimates vary
              sharply depending on whether those adjacent pools are included. It also helps explain why
              infrastructure-heavy incumbents and application-layer AI vendors can both appear in the same analyst
              landscape without actually addressing identical budgets.
            claimRefs:
              - CM001
