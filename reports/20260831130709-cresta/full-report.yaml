  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Topline signal and revenue model
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial fact about Cresta is not a GAAP revenue figure but the company's ARR
              milestone. Official materials say Cresta surpassed $100 million in annual recurring revenue by mid-2026,
              and Axios independently echoed that threshold earlier in the year. That is enough to anchor the business
              as meaningfully scaled even though the company remains private. Public product pages also imply a
              diversified recurring revenue model: Cresta sells AI Agent, agent-assist and guidance capabilities,
              conversation intelligence, quality management, coaching, and orchestration. Third-party pricing analyses
              suggest those modules can be purchased separately and expanded over time, which implies a land-and-expand
              commercial structure rather than a single monolithic contract. The public model therefore looks
              multi-product, enterprise, and largely subscription-based, even if recognition details remain undisclosed.
              Importantly, this is not the profile of a one-feature experimental AI vendor. It looks like a platform
              trying to compound more ARR out of each large account over time.
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
              - CI007
