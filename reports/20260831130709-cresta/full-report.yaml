      - number: '8.2'
        title: Valuation evidence is too inconsistent to support a hard fair-value call
        blocks:
          - type: paragraph
            body: >-
              The central valuation fact pattern is not that Cresta looks cheap or expensive; it is that the exact price
              is not reliably documented in accessible primary sources. The QIA announcement, the PR Newswire release,
              and Cresta’s own Series D post all confirm the round and growth narrative but do not disclose post-money
              valuation. Secondary breadcrumbs then diverge sharply. AI Infrastructure Map shows a roughly $747 million
              post-money estimate, while Craft and other low-transparency profile sites point toward a roughly $1.6
              billion mark. That gap is too large to average away casually. Confidence is reduced further by the access
              profile of several expected corroboration sources: Business Wire, Sifted, PitchBook, and some media links
              were blocked, broken, or non-substantive in this run. As a result, the correct discipline is to carry
              valuation as unknown until management-grade round documentation is produced. The price question remains
              open, not merely imprecise.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
