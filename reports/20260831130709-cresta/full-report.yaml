      - number: '7.4'
        title: People risk is manageable today, but kill criteria should stay explicit
        blocks:
          - type: paragraph
            body: >-
              The people story is ambiguous rather than alarming. The public record does not prove a morale or layoffs
              problem, but it does show why execution risk is inherently high in this category: AI shifts human work
              toward more complex escalations and puts change-management stress on frontline teams and managers.
              Cresta’s training, testing, quality, and coaching modules are valuable precisely because they address that
              risk directly. The right risk posture is therefore not to assume failure, but to define thesis-break
              conditions clearly. An adverse privacy ruling, a major security incident, persistent inability to turn
              pilots into production expansions, or evidence of concentration-driven churn would all materially damage
              the investment case. For now, the balance of evidence supports a high risk rating rather than a critical
              one because Cresta still shows credible scale, capital support, and proactive mitigation design. Risk is
              elevated, but not yet disqualifying. Investors should still demand crisp monitoring metrics. Weekly churn,
              expansion, and incident reviews would tighten oversight materially.
            claimRefs:
