      - number: '8.4'
        title: The right call is track until price and quality-of-revenue evidence are opened
        blocks:
          - type: paragraph
            body: >-
              The final recommendation is track, not buy and not avoid. The company appears strong enough to stay
              investable: it has real scale, credible customers, late-stage capital, and product breadth that could
              support further upside. But investors still lack the evidence needed to know whether the current or next
              entry price is merely fair, plainly stretched, or actually attractive. That missing evidence is unusually
              concentrated in a few decisive items: exact ARR, NRR, gross margin, top-customer concentration, and the
              full capitalization and preference stack from the Series D. Those items would quickly change the
              investment view if they proved strong. Conversely, an adverse privacy ruling, a down-round, material
              large-logo churn, or stalled pilot conversion would break the thesis. Until those gates are cleared, the
              disciplined posture is medium-confidence tracking with valuation stance recorded as unknown. A better
              price could matter as much as better diligence. Patience is part of the underwriting discipline.
            claimRefs:
