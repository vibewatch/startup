        title: Exhibits
        blocks:
          - type: callout
            title: Operating proof is stronger than typical for a private AI startup
            body: >-
              Cresta is not suffering from a total-information problem. Funding, ARR milestone, customer proof, and
              product breadth are all more visible than at many private software companies of similar stage. That
              matters because it means the recommendation is not being held back by a lack of operating evidence; it is
              being held back by the narrower but more consequential absence of trustworthy pricing and
              quality-of-revenue data.
            calloutType: strength
            claimRefs:
