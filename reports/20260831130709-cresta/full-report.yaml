      - number: '4.2'
        title: Pricing opacity, contract shape, and revenue-quality proxies
        blocks:
          - type: paragraph
            body: >-
              Cresta's monetization is visible only through fragments. The company does not publish a first-party price
              sheet, so AWS Marketplace is the clearest official signal and third-party pricing analyses fill in the
              rest. Those sources point to a six-figure annual entry point for Agent Assist, plus overages and broader
              negotiated enterprise contracts for additional modules. UsagePricing characterizes the structure as
              seat-based subscriptions with feature-tier expansion, while noting that the autonomous AI Agent product
              may introduce outcome-linked economics. The positive implication is that Cresta appears able to monetize
              material workflow value at enterprise price points. The negative implication is that public evidence on
              realized pricing, discounting, expansion rates, and churn is missing. Customer case studies show
              persuasive ROI claims, but they are marketing evidence rather than audited revenue-quality disclosures.
              Premium list-price optics are not the same as durable net revenue quality. They nevertheless suggest
