      - number: '2.2'
        title: Buyer, user, and segment structure
        blocks:
          - type: paragraph
            body: >-
              The market is enterprise-led and workflow-specific. Buyers are typically contact-center operations
              leaders, CX executives, digital-service leaders, or IT stakeholders sponsoring integration, while users
              include frontline agents, supervisors, QA managers, analysts, and increasingly AI-agent operators. Payers
              vary by company maturity: some programs sit in service operations budgets, some in digital transformation
              or IT, and some are justified against labor-efficiency targets. The vertical mix is consistent across
              sources, with BFSI, telecom, retail, healthcare, and travel repeatedly listed as core adopters. Cresta's
              current customer stories and content focus line up especially well with BFSI, telecom, and travel or
              hospitality accounts. Importantly, voice remains central to the market even as digital channels expand,
              because the phone still anchors the highest-stakes and often highest-cost customer interactions. That is
              one reason vendor claims around real-time guidance, transcription quality, and compliant automation still
              matter more than simple chatbot volume. It also favors vendors that can support complex escalations, not
              just FAQ deflection.
            claimRefs:
