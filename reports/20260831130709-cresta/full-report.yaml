      - number: '7.3'
        title: Dependencies, concentration, and financing shape residual exposure
        blocks:
          - type: paragraph
            body: >-
              Cresta’s architecture and customer base create meaningful dependency risk. The platform depends on
              customer-system integrations, data access, configuration quality, and governance working together. Broad
              connector support is a strength, but it also expands the set of ways deployments can fail. Customer
              concentration is another hidden dependency: the public logo set is strong, yet the company does not
              disclose customer count or top-account ARR. That makes it impossible to rule out material concentration.
              On the financial side, recent capital and ARR scale reduce short-term distress risk, but they do not
              eliminate the possibility of future financing under weaker valuation conditions. Mature public software
              comparables and installed-base incumbents also create strategic pressure, because they can compress
              pricing or lower buyer willingness to pay for a standalone platform if “good enough” alternatives improve.
              Residual exposure here is high because several dependencies are opaque at once. Opaque dependencies tend
              to compound rather than offset one another.
