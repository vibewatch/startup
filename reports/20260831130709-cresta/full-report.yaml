  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and module map
        blocks:
          - type: paragraph
            body: >-
              Cresta's product is best understood as a unified contact-center AI operating layer rather than a single
              automation bot. The company now markets a module set that spans autonomous AI Agent, Knowledge Agent,
              Quality Management, Coach, Opera orchestration, and a shared integrations layer. That matters because the
              value proposition is not just “answer more calls automatically.” It is to run customer conversations,
              coach humans, measure quality, and operationalize change on the same conversation substrate. The
              architecture implied by public pages is modular but tightly connected: AI Agent extends legacy assist
              capabilities, Knowledge Agent handles context retrieval and guided workflows, and quality and coaching
              close the loop on what actually changes behavior. In product terms, Cresta is selling system-level
              workflow improvement rather than a narrow conversational interface alone. That is a more ambitious product
              scope than most AI-support startups attempt publicly. It also creates more cross-module upsell potential
              if the integration layer is genuinely reusable across deployments.
