          - type: callout
            title: Do not confuse strong company quality with strong entry quality
            body: >-
              If an investor cannot confirm post-money valuation, preference stack, ARR quality, and concentration, then
              even a very good company can still be a weak investment at the wrong price. The disciplined outcome here
              is to keep Cresta on the active list while refusing false precision about fair value.
            calloutType: risk
