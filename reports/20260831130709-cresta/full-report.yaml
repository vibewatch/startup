      - number: '1.2'
        title: Leadership transition and governance reinforcement
        blocks:
          - type: paragraph
            body: >-
              The main leadership issue is not who founded Cresta, but how the current operating leadership differs from
              the founding narrative supplied by older sources. Current official materials and Forbes both indicate Ping
              Wu has served as CEO since 2023, while Sebastian Thrun, Tim Shi, and Zayd Enam remain important founder
              figures in the company's origin story. In 2026 Cresta also strengthened board signaling by elevating Doug
              Leone to chairman and bringing Carl Eschenbach back onto the board. Those moves suggest a scale-up
              governance posture around a maturing enterprise software company that now claims material ARR and Fortune
              500 traction. Key-person dependence still exists around a small, highly visible leadership bench, but the
              governance posture looks more institutional than founder-centric at this stage. The important diligence
              follow-up is ownership and role clarity: founders still anchor narrative credibility, while operating
              control has clearly shifted to a later-stage CEO and a more seasoned board.
