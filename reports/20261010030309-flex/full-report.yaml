      - number: '5.3'
        title: Operating Model, Banking Infrastructure, and Software Architecture
        blocks:
          - type: paragraph
            body: >-
              Flex functions strictly as a technology layer and loan broker rather than a chartered depository
              institution or direct lender. Under its operating model, all credit underwriting, lines of credit,
              depository escrow accounts, loan disbursements, and ACH payment transmissions are executed exclusively by
              FDIC-insured partner banks: Lead Bank and Column N.A. To preserve regulatory separation and state lending
              compliance, Flex structures operations across specialized operating subsidiaries: Flexible Finance
              Brokering, Inc. (NMLS ID #2599800) performs credit brokering, while Flexible Finance Servicing, Inc. (NMLS
              ID #2256673) manages servicing and collection workflows. The software stack integrates consumer onboarding
              via Plaid for identity and depository account linking, soft credit score inquiries for credit eligibility,
              and landlord payment portal interfaces. Critically, banking partner capabilities are not uniform across
              the portfolio: Column N.A. currently supports only Flex Rent, leaving Flex Bills and other installment
              flows dependent on Lead Bank. This creates architecture fragmentation and platform routing dependencies
              across the underlying banking APIs.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
