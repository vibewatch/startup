              regulatory applications to establish a proposed Utah industrial bank subsidiary; notably, this filing
              represented an initial regulatory charter application rather than an approved operational charter [CI006].


              Achieving a state industrial bank charter would structurally alter Flex capital requirements by permitting
              direct deposit-taking and reducing dependency on third-party sponsor banks like Column N.A. and Lead Bank,
              but the approval timeline, capital reserve mandates, and regulatory scrutiny remain substantial gating
              factors [CI002, CI006]. Meanwhile, external private data from Multiples.vc asserts an alternate
              capitalization history featuring $180 million in cumulative equity and $300 million in debt facilities
              [CI009]. In the absence of audited balance sheets, cash on hand, monthly net burn rate, debt service
              covenants, and facility maturity dates are entirely undisclosed [CI013, CI014]. Flex credit-linked growth
              model requires continuous liquidity to fund monthly rent advances; if credit defaults surge or warehouse
              facility costs rise, Flex runway and capitalization would experience immediate pressure [CI001, CI002,
              CI013].
