  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Scrutiny and Industrial Bank Charter Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Flexible Finance, Inc. (operating as Flex) has expanded its rent-splitting consumer credit service to over
              3.2 million customers and processed more than $40 billion in on-time payments. To eliminate reliance on
              third-party partner banks and reduce funding costs, Flex submitted an application to the Federal Deposit
              Insurance Corporation (FDIC) for deposit insurance on behalf of a proposed Utah-chartered industrial loan
              company (ILC), Flex Bank. However, this application has triggered formal joint opposition from the Bank
              Policy Institute (BPI) and the Independent Community Bankers of America (ICBA), who submitted a detailed
              petition urging the FDIC to halt approval. The banking trade associations argue that Flex Bank represents
              a captive shell bank model that exploits the ILC loophole to avoid consolidated Federal Reserve
              supervision under the Bank Holding Company Act (BHCA). Regulators and industry opponents highlight
              heightened risks of noncompliance with Sections 23A and 23B of the Federal Reserve Act (Regulation W)
              governing affiliate transactions, conflicts of interest in credit underwriting where the bank may relax
              standards to preserve the parent's commercial customer relationships, and anti-tying prohibitions under
              Section 106 of the BHCA Amendments of 1970. Because Flex Bank would operate digitally without branches
              while relying primarily on affiliate relationships and brokered deposits, any regulatory rejection or
              protracted delay creates substantial uncertainty around Flex's long-term unit economics and balance-sheet
              independence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
