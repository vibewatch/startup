      - number: '4.2'
        title: GTM motion, partner channel economics, and sales efficiency
        blocks:
          - type: paragraph
            body: >-
              Flex distributes its rent-splitting financial products primarily through direct software integrations with
              residential property management systems and multifamily landlord operating portals [CI001]. By integrating
              directly into core rental operating platforms—including Yardi, RealPage, Entrata, and AppFolio—Flex
              positions its payment splitting service directly within the tenant rent-payment workflow [CI001]. Because
              Flex charges landlords and property managers zero fees, multifamily operators are incentivized to promote
              Flex to residents to improve on-time collection rates and avoid operational collection friction [CI001].
              Company marketing materials report that Flex has served over 2 million renters who have used the service
              to flex their rent, avoiding over $850 million in cumulative renter late fees [CI004].


              Independent third-party profile data from Silicon Valley Investment Club corroborates that Flex has
              processed payments for approximately 3.5 million cumulative customers, facilitating over $45 billion in
              total bill and rent payment volume since inception while helping customers avoid more than $780 million in
              late fees [CI005]. However, this partner-embedded distribution motion introduces critical sales efficiency
              and customer retention ambiguities. Flex does not disclose customer acquisition costs, partner
              revenue-sharing agreements, integration maintenance expenses, or active cohort retention rates [CI014].
              Furthermore, while marketing metrics emphasize multi-year cumulative aggregates—such as 3.5 million
              customers served and $45 billion in cumulative payments—Flex does not publish point-in-time monthly active
              users (MAU) or annual cohort churn [CI005, CI014]. For investment underwriting, distinguishing between
              one-time transactional users and recurring monthly active subscribers is a fundamental diligence
              requirement, as churned accounts cease paying the core $5.99 monthly membership fee [CI002, CI014].
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
              - CI014
      - number: '4.3'
        title: Cost structure, credit provisioning, and service-delivery expenses
        blocks:
          - type: paragraph
            body: >-
              Flex operates as a legally non-bank financial technology entity that does not directly disburse loan
              proceeds, hold customer deposits, or transmit consumer funds [CI002]. Under regulatory and banking partner
              disclosures, all loans, lines of credit, banking services, loan disbursements, and funds transmissions are
              originated and executed by partner financial institutions, specifically Lead Bank and Column N.A., both
              Members FDIC [CI002]. Flexible Finance, Inc. performs loan brokering and marketing operations through its
              licensed subsidiary Flexible Finance Brokering, Inc. (NMLS ID #2599800), while loan servicing, account
              administration, and collection activities are executed through Flexible Finance Servicing, Inc. (NMLS ID
              #2256673) [CI002]. An additional payments entity, Flexible Finance Payments, LLC (NMLS ID #2713261),
              supports transaction processing architecture [CI002].


              This partner-dependent operational architecture shapes Flex cost structure and gross margin profile. Major
              service-delivery cost components include partner bank cost-of-funds (interest and facility fees paid on
              credit advances), credit loss provisions on defaulted lines of credit, software verification fees paid to
              data aggregators such as Plaid for underwriting and bank account verification, payment network processing
