      - number: '5.2'
        title: Product Portfolio, SKU Map, and Fee Mechanism
        blocks:
          - type: paragraph
            body: >-
              The Flex product line is bifurcated into two primary consumer offerings: Flex Rent and Flex Bills,
              supported by an auxiliary Pay in Full tier. Flex Rent, the flagship product, enables residential tenants
              to split monthly apartment or home rent obligations across properties with integrated property management
              software or direct landlord payment portals. Flex Bills broadens this utility across non-rent household
              obligations, covering mortgages, auto loans, childcare, insurance, and utilities. The monetization
              structure combines recurring subscription fees with transactional split and payment processing fees. Flex
              Rent charges a recurring monthly membership fee of up to $5.99 that automatically renews until canceled.
              In addition, users incur a mandatory 0.5% payment processing fee on the total bill volume, an optional
              split fee of up to 3% assessed against the borrowed credit balance that cannot be mitigated by early
              repayment, and an optional 2.5% surcharge when funding installments via credit card. Users who utilize
              Flex exclusively to pay bills in full without drawing credit pay only the 0.5% processing fee and are
              exempt from monthly membership fees.
