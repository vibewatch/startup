            body: >-
              Evaluating Flex forward capital adequacy is constrained by private capital structure opacity and
              significant public data contradictions. According to Silicon Valley Investment Club records, Flexible
              Finance, Inc. has raised over $388 million in total venture funding across six financing rounds, including
              a $146.4 million Series D in April 2024 at a $1.36 billion post-money valuation, followed by a $12 million
