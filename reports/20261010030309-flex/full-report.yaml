  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              The market for residential rent payments and household liquidity smoothing is characterized by a
              fragmented landscape spanning core property management software, consumer credit alternatives, and
              specialized rent-financing fintechs. For Flexible Finance, Inc. (operating as Flex), the primary baseline
              competitor is the traditional status quo: lump-sum rent payments transmitted on the first of each month
              via ACH transfers, paper checks, or resident portal credit card transactions. Incumbent property
              management software platforms—most notably Yardi Systems, RealPage, Entrata, and AppFolio—dominate the
              landlord accounting ledger and resident payment portal workflow. While general-purpose Buy Now, Pay Later
              (BNPL) providers like Affirm and Klarna dominate retail e-commerce, and earned wage access apps like
              EarnIn and Dave address paycheck timing, Flex differentiates itself by focusing specifically on recurring
              monthly rent obligations, advancing full rent to property managers on the first of the month and splitting
              the tenant's repayment into two scheduled installments. In addition, unbranded search discovery frequently
              surfaces unrelated corporate entities, including public contract manufacturer Flex Ltd. and Amazon Flex,
              underscoring the necessity of direct property management integration over open unbranded consumer
              acquisition.
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP013
      - number: '3.2'
        title: Competitor Profiles and Capability Matrix
        blocks:
          - type: paragraph
            body: >-
              Evaluating alternative solutions across residential tenant workflows reveals distinct operational
              trade-offs between core ERP integration depth and tenant payment flexibility. Flex operates as a
              technology layer rather than a chartered depository bank, relying on partner financial
              institutions—specifically Lead Bank and Column N.A.—to underwrite lines of credit, disburse loan proceeds,
              and facilitate payment transmission. In contrast, property management software portals offer direct,
              zero-friction integration with landlord accounting systems but historically enforce rigid single-payment
              schedules with high credit card transaction surcharges. General consumer BNPL platforms offer flexible
              multi-week installments but lack property management ERP integrations, while cash-advance and earned wage
              access applications enforce low transaction limits (typically $100 to $500) that cannot support median
              residential rents exceeding $1,400. Flex bridges this gap by offering structured rent splitting alongside
              positive credit bureau reporting, though its service remains strictly contingent upon landlord and biller
              eligibility.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP013
              - CP014
