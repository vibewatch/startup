              depository institution and disclaims loan disbursement activities; all credit lines, banking services, and
              fund transmissions are executed through Lead Bank and Column N.A., Members FDIC. While this regulatory
              posture allows nationwide fee export under federal banking law, it introduces existential platform
              counterparty risk. A regulatory enforcement action, contractual termination, or capital constraint at
              either sponsor bank would disrupt payment transmissions and threaten ongoing tenant installment servicing.
            claimRefs:
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
      - number: '8.3'
        title: Entity Disambiguation and Private Market Comparables
        blocks:
          - type: paragraph
            body: >-
              A critical diligence challenge in analyzing Flexible Finance, Inc. is resolving pervasive brand name
              collision across private financing databases, commercial registries, and regulatory enforcement actions.
              Most notably, a distinct B2B fintech company founded by Zaid Rahman—Flexbase Technologies Inc., operating
              as Flex at flex.one—raised $70 million in Series B1 funding in July 2026 at a $1.2 billion valuation led
              by The Halo Fund, bringing its capital structure to $180 million in equity and $300 million in debt.
              Pitchbook, Tracxn, and algorithmic news aggregators frequently conflate Flexbase Technologies Inc. with
              Flexible Finance, Inc., mistakenly attributing business banking, stablecoin cross-border payments, and
              middle-market credit facilities to the consumer rent platform. Additionally, regulatory enforcement
              databases highlight Amazon's $61.7 million settlement with the Federal Trade Commission in 2021 regarding
              tip withholding from Amazon Flex gig delivery drivers, creating further headline confusion. Underwriters
              must disentangle these unrelated corporate entities before establishing valuation multiples or diligence
              baselines.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Valuation Scenarios, Downside Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Flexible Finance's equity value across economic cycles requires explicit scenario modeling tied
              to credit loss elasticity and regulatory durability. In the bull scenario, annual transacted rent volume
              scales beyond $15 billion, the company's application for a Utah industrial loan charter receives FDIC
              approval, and net credit default rates remain contained below 1.5%, supporting an enterprise valuation
              expansion toward $2.5 billion to $3.0 billion. In the base case, payment volume expands moderately while
              loss rates fluctuate between 2.5% and 3.5%, leaving equity value range-bound near the $1.2 billion to $1.4
              billion Series D benchmark. In the bear scenario, macroeconomic distress elevates renter defaults above
              5.0%, warehouse credit lenders tighten advance rates, or banking regulators challenge rent-splitting fees,
              forcing a distressed recapitalization at $300 million to $500 million. Definitive investment participation
              requires prior verification of credit default cohorts, warehouse debt covenants, and sponsor bank renewal
              terms.
            claimRefs:
              - CV001
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting Discipline and Diligence Hurdle
            body: >-
              Flexible Finance's $1.41 billion valuation benchmark reflects impressive consumer scale with over 3.5
              million customers served, but entering private secondary equity without audited default rates and capital
              structure terms exposes investors to severe downside risk. Diligence must remain focused on credit loss
              rates and warehouse debt covenants before committing capital.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV012
          - type: callout
            title: Public Database Name Collision
            body: >-
              Diligence teams must rigorously isolate Flexible Finance, Inc. (consumer rent-splitting) from Flexbase
              Technologies Inc. (B2B digital bank which raised $70 million at a $1.2 billion valuation in July 2026) and
              unrelated entities like Amazon Flex. Pitchbook and automated database feeds frequently intermingle these
              distinct financing rounds.
            calloutType: insight
            claimRefs:
              - CV007
              - CV009
              - CV011
