chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Core Product, and Bank Partnership Architecture
        blocks:
          - type: paragraph
            body: >-
              Flexible Finance, Inc., operating commercially as Flex (getflex.com), is a consumer financial technology
              company founded in 2019 and headquartered in New York City. The company was founded by Shragie
              Lichtenstein and YeTong Shao to resolve cash-flow volatility for consumers whose monthly obligations—most
              notably rent, mortgages, and essential household bills—fall due on fixed calendar dates that mismatch
              biweekly or irregular income schedules. Flex operates not as a chartered depository institution, but as a
              technology and servicing layer. Credit facilities, lines of credit, and payment transmissions are
              originated and provided by federally insured bank partners Lead Bank and Column N.A., Members FDIC.
              Brokering activities are conducted through Flexible Finance Brokering, Inc. (NMLS ID #2599800), and
              servicing and collection activities are managed by Flexible Finance Servicing, Inc. (NMLS ID #2256673).


              The company's core consumer offering, Flex Rent, pays the property manager or landlord upfront and in full
              when rent is due, allowing the tenant to pay an initial portion and repay the remaining balance later in
              the month on a user-selected date. Beyond rent, Flex has expanded its platform into Flex Bills (covering
              utilities, car payments, phone, internet, insurance, and childcare) and Flex Move-in. The fee model
              comprises a monthly membership fee of up to $5.99, a 0.5% bill processing fee on the total bill amount, a
              split fee of up to 3% based on the borrowed amount, and an optional 2.5% surcharge when paying by credit
              card. Flex does not charge late fees or penalty interest, and reports on-time rent payment histories to
              Equifax, Experian, and TransUnion to help users establish credit history.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
