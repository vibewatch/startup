      - number: '1.2'
        title: Operating Scale, Capital History, and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              By late 2026, Flex reached significant consumer adoption, reporting over 3.5 million customers served,
              more than $45 billion in cumulative payments processed, and over $1 billion in monthly rent volume,
              alongside more than 400 employees based out of its New York headquarters. Independent investment tracking
              compiles a total equity funding history of $388.3 million across six financing rounds. The company's
              equity capital sequence began with a $5.78 million Seed round in October 2019 ($31.84 million post-money
              valuation), followed by a $14.02 million Series A in September 2020 ($57.76 million post-money), a $50.11
              million Series B in April 2021 ($252.21 million post-money), a $160 million Series C in April 2022 led by
              Camber Creek ($959.79 million post-money), a $146.41 million Series D in April 2024 ($1.36 billion
              post-money), and a $12 million Series D non-voting extension in June 2024 pricing the company at $1.41
              billion.


              Flex's institutional cap table is heavily anchored by proptech and real estate technology specialists, led
              by Camber Creek (which led or participated in Seed, Series A, Series B, and Series C), Coatue Management,
              Renn Global, Matrix Partners, and dozens of institutional co-investors. Governance remains closely held by
              executive leadership and primary venture partners; however, detailed board of directors seats and
              committee memberships for Flexible Finance, Inc. are not publicly disclosed. In July 2026, Flexible
              Finance initiated a major regulatory advancement by filing applications to establish a proposed Utah
              industrial bank subsidiary, representing a potential long-term transition toward a self-chartered banking
              model to reduce dependency on third-party sponsor banks.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
