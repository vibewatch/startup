  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and Service Definition in Consumer Workflow Terms
        blocks:
          - type: paragraph
            body: >-
              Flex (Flexible Finance, Inc.) delivers a financial technology application designed to alleviate household
              cash flow volatility by decoupling bill due dates from worker payroll cycles. In standard household
              workflows, major liabilities such as residential rent, auto loans, mortgages, childcare, utilities, and
              telecom bills come due in large lump sums at the beginning of each calendar month. This creates timing
              mismatches for households whose compensation arrives bi-weekly or semi-monthly. Through the Flex mobile
              application, users enroll eligible monthly obligations into an automated splitting schedule. Under this
              workflow, Flex facilitates the payment of the entire bill amount directly to the landlord or third-party
              biller on or before the due date, ensuring the consumer avoids late fees or penalties. Simultaneously, the
              user pays an initial installment upon bill scheduling and selects a custom second payment date later
              within the same calendar month that aligns with their income cadence. Unlike multi-month Buy Now, Pay
              Later (BNPL) services that extend obligations across six to eight weeks and compound debt into future
              billing cycles, Flex confines its repayment cycle strictly within the month of service, avoiding growing
              revolving debt balances.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE013
