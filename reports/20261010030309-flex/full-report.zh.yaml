      - number: '1.3'
        title: 实体辨析、监管边界与风险画像
        blocks:
          - type: paragraph
            body: >-
              评估 Flex 时，关键尽调工作是将 Flexible Finance, Inc. 与公开记录中同名的无关实体区分开。第一，Flex Ltd.（NASDAQ: FLEX）是总部位于德州奥斯汀、前身为新加坡注册
              Flextronics 的全球制造及电子供应链公司，市值超过 $40B，由 CEO Revathi Advaithi 领导；该公司 2026 年宣布拟分拆 Cloud and Power
              Infrastructure 业务（Axiom Solutions International），并进行 $2.0B 可转 preferred equity 融资。第二，Amazon Flex 是
              Amazon.com, Inc. 运营的独立承包商物流配送项目，2021 年因扣留司机小费与 FTC 达成 $61.7M 和解。第三，另一家此前名为 Flexbase 的商业金融初创公司于 2026 年 7
              月融资 $70M，为中型市场企业主提供 AI 原生私人银行服务。

              对 Flexible Finance, Inc. 而言，运营及监管尽调聚焦消费者信用建设和银行合作模式。由于公司依赖 Lead Bank 与 Column N.A.
              发放贷款、转移存款，针对银行与金融科技赞助安排的任何监管执法都可能成为系统性依赖风险。此外，公司虽已申请设立犹他州工业银行子公司，但提交申请不等于获批银行牌照，未来资本及合规成本仍不确定。
            claimRefs:
              - CO014
              - CO015
              - CO016
