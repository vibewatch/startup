      - number: '2.4'
        title: 采用驱动因素、监管约束与规模缺口
        blocks:
          - type: paragraph
            body: >-
              双月租金分期融资的采用速度受持续工资波动及传统房东滞纳金造成的严重财务摩擦推动；Flex 估计用户每年因此避免超过 $850M 的费用。收入来自 $5.99 月会员费、0.5% 支付处理费和借款资金最高 3%
              的分期费。然而，可寻址市场扩张受到结构性约束。Flex 不是银行，授信额度可用性严格取决于赞助银行合规情况及各州放贷牌照。品牌还与其他项目混淆，例如 Amazon Flex 配送司机小费政策的 FTC
              执法，令自动化尽调更复杂。私人贷款损失准备金、各信用队列违约率和净核销额仍由 Flexible Finance 及其发起合作方保密，构成重要尽调缺口。
            claimRefs:
              - CM006
              - CM009
              - CM010
              - CM011
              - CM012
