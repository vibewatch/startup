chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、核心产品与银行合作架构
        blocks:
          - type: paragraph
            body: >-
              Flexible Finance, Inc. 以 Flex（getflex.com）开展商业运营，是一家 2019 年成立、总部位于纽约的消费金融科技公司。公司由 Shragie Lichtenstein 和
              YeTong Shao 创立，解决消费者现金流波动问题：租金、房贷及基本家庭账单等月度义务通常在固定日期到期，却与双周或不规则收入错开。Flex
              不是持牌存款机构，而是技术与服务层。信贷工具、授信额度及支付传输均由联邦保险银行合作方 Lead Bank 和 Column N.A. 发起并提供，二者均为 Members FDIC。经纪业务由 Flexible
              Finance Brokering, Inc.（NMLS ID #2599800）承接，服务及催收由 Flexible Finance Servicing, Inc.（NMLS ID #2256673）管理。

              核心消费者产品 Flex Rent 在租金到期时先向物业管理方或房东全额付款，租户先付一部分，月底按用户选择的日期偿还余额。除租金外，Flex 还扩展至 Flex
              Bills（公用事业、车贷、电话、互联网、保险及托儿费用）和 Flex Move-in。收费包括最高 $5.99 的月会员费、按账单总额收取的 0.5% 账单处理费、按借款额收取的最高 3%
              分期费，以及刷信用卡时可选的 2.5% 附加费。Flex 不收滞纳金或罚息，并向 Equifax、Experian 和 TransUnion 报送按时租金支付记录，帮助用户建立信用历史。
