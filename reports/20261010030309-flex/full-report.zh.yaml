      - number: '2.2'
        title: 可服务市场规模与交易量轨迹
        blocks:
          - type: paragraph
            body: >-
              评估消费者租金分期的总可寻址市场，必须把国内住宅租金支出与企业、工业支出分开。美国住宅租金年支付总额这一自上而下的支出池超过
              $600B。其中，可服务市场是受工资周期与月度租金期限错配影响的租户，估计年可寻址交易量为 $120B。Flex 声称每月处理超过 $1B 租金，对应年化运行率超过
              $12B，显示其在该层市场已有较高渗透率。其历史运营累计交易量已超过 $45B，注册会员达 3.5M+。上述私人交易数据与 $1.5B–$4.5B 的柔性电路封装市场或 Fidelity Flex
              共同基金资产完全无关。
