              让住宅租户在已集成物业管理软件的房产或直接房东支付门户中分摊月租。Flex Bills 把功能扩展到房贷、车贷、托儿、保险和公用事业等非租金家庭义务。变现由经常性订阅费、交易分期费和支付处理费组成。Flex
              Rent 收取最高 $5.99 的自动续费月会员费，直到取消为止；另收账单总额 0.5% 的强制支付处理费、按借款余额收取且提前还款不能降低的最高 3% 可选分期费，以及使用信用卡支付分期时的可选 2.5%
