  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管审查与工业银行牌照脆弱性
        blocks:
          - type: paragraph
            body: >-
              Flexible Finance, Inc.（以 Flex 名义运营）已将其租金拆分消费信贷服务扩展至超过 320 万客户，并处理了超过 400 亿美元的按时付款。为消除对
              第三方合作银行的依赖并降低融资成本，Flex 代表拟设立的犹他州特许工业贷款公司（ILC）Flex Bank，向联邦存款保险公司（FDIC）提交了
              存款保险申请。然而，该申请引发了银行政策研究所（BPI）和美国独立社区银行家协会（ICBA）的正式联合反对；两者提交了详细请愿书， 要求 FDIC 暂停批准。银行业协会认为，Flex Bank 属于利用 ILC
              监管漏洞的受控空壳银行模式，以规避《银行控股公司法》（BHCA）下的 美联储合并监管。监管机构和行业反对者指出，Flex 可能违反《联邦储备法》（条例 W）第 23A 和 23B 条（规范关联交易）的风险升高，
              以及信贷审批中的利益冲突（银行可能放宽标准以维持母公司的商业客户关系）和 1970 年 BHCA 修正案第 106 条下的反捆绑限制。 由于 Flex Bank
              将在无网点的情况下以数字方式运营，且主要依赖关联关系和经纪存款，任何监管拒绝或长期延迟都会给 Flex 的长期单位经济性和 资产负债表独立性带来重大不确定性。
