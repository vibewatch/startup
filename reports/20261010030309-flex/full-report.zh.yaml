  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接同业、在位者与替代方案
        blocks:
          - type: paragraph
            body: >-
              住宅租金支付和家庭流动性平滑市场较为分散，涵盖物业管理软件、消费信贷替代方案和专门的租金融资金融科技。对 Flexible Finance, Inc.（以 Flex
              运营）而言，最主要的基准竞争者是传统现状：每月第一天通过 ACH、支票或住户门户刷卡一次性付租。Yardi Systems、RealPage、Entrata 和 AppFolio
              等物业管理软件平台主导房东账簿和住户支付门户。Affirm、Klarna 等通用 BNPL 服务商主导零售电商，EarnIn、Dave 等工资提前支取应用解决发薪时点问题；Flex
              则专注于每月重复租金义务，在月初先付全租，再拆成两笔定期还款。无品牌搜索还经常出现 Flex Ltd. 和 Amazon Flex 等无关实体，凸显直接接入物业管理系统比开放式无品牌获客更重要。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP013
      - number: '3.2'
        title: 竞争者画像与能力矩阵
        blocks:
          - type: paragraph
            body: >-
              比较住宅租户解决方案可以看到，核心 ERP 集成深度与支付灵活性之间存在不同取舍。Flex 是技术层而非持牌存款银行，依靠 Lead Bank 和 Column N.A.
              等合作金融机构完成授信、发放贷款和支付传输。物业管理软件门户能直接、无摩擦接入房东账务系统，但过去通常采用僵硬的单笔支付计划，并收取较高刷卡附加费。通用消费者 BNPL 平台可提供多周分期，却缺少物业管理 ERP
              集成；现金预支和工资提前支取应用的交易上限通常仅为 $100–$500，无法覆盖超过 $1,400 的住宅租金中位数。Flex
              以结构化租金分期和正面信用报告填补这一缺口，但服务仍严格取决于房东及账单方是否符合资格。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
              - CP013
              - CP014
