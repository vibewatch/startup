      - number: '2.3'
        title: 买方、房东与合作伙伴的细分动态
        blocks:
          - type: paragraph
            body: >-
              Flex
              的市场分销模式依靠连接个人租户、物业管理公司和持牌银行发起方的多边生态。核心消费者是工薪住宅租户：他们可以平滑现金流，避免惩罚性滞纳金，并选择获得正面信用报告。机构物业管理方和个人房东则是关键账单方。房东希望全额、准时收租，同时不承担客户授信或催收风险。Flexible
              Finance, Inc. 通过与 Lead Bank 和 Column N.A. 等持牌存款机构合作，衔接这一关系；这些银行发放底层授信额度并处理支付传输。Flex
              先向物业管理方全额付款，消除房东的催收摩擦，并建立可防御的物业层面集成壁垒。
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM010
          - type: table
            tableRef: TM003
