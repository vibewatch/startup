  - id: FU001
    title: 客户采用与支付生命周期旅程图
    type: journey-map
    summary: 以可视化方式呈现租户及合作伙伴在引导、授信评估、支付执行及信用报告环节的生命周期阶段。
    data:
      items:
        - label: 阶段 1：发现与申请
          stage: 发现与申请
          actor: 消费者租户
          action: App download, soft credit pull assessment, and bill eligibility verification
          outcome: Underwriting determination by Lead Bank or Column N.A.
          touchpoints:
            - 移动应用商店界面
            - 物业管理门户推荐
        - label: 阶段 2：账单选择与连接
          stage: 账单选择与连接
          actor: 消费者租户
          action: Selecting eligible rent and monthly utility bills within mobile application
          outcome: Identification of billing due dates and biller settlement accounts
          touchpoints:
            - 账单方搜索及门户凭据
            - 账户验证
        - label: 阶段 3：分期结构设计
          stage: 分期结构设计
          actor: 租户与平台
          action: Selection of 2nd payment date aligned to payroll schedule
          outcome: Calculation of 0.5% processing fee and up to 3% split line fee
          touchpoints:
            - Flex 账单排期界面
            - 直接借记账户连接
        - label: 阶段 4：拨款执行
          stage: 拨款执行
          actor: Flex 与合作银行
          action: Full disbursement sent upfront to landlord/biller on due date
          outcome: Landlord receives 100% of payment; tenant avoids late penalty
          touchpoints:
            - 自动 ACH / 门户传输
            - 合作银行结算通道
        - label: 阶段 5：首次收款
          stage: 首次收款
          actor: 租户与 Flex
          action: Collection of first split payment plus monthly membership fee
          outcome: Partial repayment debited on or immediately before bill due date
          touchpoints:
            - 租户支票账户扣款
            - 卡处理网关
        - label: 阶段 6：还款与报告
          stage: 还款与报告
          actor: 租户与征信机构
          action: Tenant completes 2nd split payment; on-time history reported
          outcome: Line cleared; positive payment history transmitted to bureaus
          touchpoints:
            - Equifax、Experian、TransUnion 数据馈送
            - 会员自动循环续费
    approximationNotes: 生命周期阶段代表 Flex 官方披露和监管脚注所记录的实际运营流程。
