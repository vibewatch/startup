  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与类别定义
        blocks:
          - type: paragraph
            body: >-
              Flex（Flexible Finance,
              Inc.）明确属于消费金融科技领域，重点服务住宅租金支付和基本家庭账单管理。平台解决结构性流动性摩擦：住宅房东通常要求每月第一天一次性支付租金，而消费者工资多按双周或半月发放。Flex
              在月初向住房提供方支付全额租金，再让符合条件的租户分两期偿还。该经营边界明确排除商业地产类别，例如浅湾工业 flex
              空间；后者是租户租用带专用装卸月台和办公改造的实体仓库。严格尽调还须把私人消费金融实体与市场检索出的同名实体区分开，包括上市合同电子制造商 Flex Ltd. 以及柔性印刷电路封装等无关技术领域。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM009
              - CM013
