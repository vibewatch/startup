  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、定价结构与变现机制
        blocks:
          - type: paragraph
            body: >-
              Flex 是消费金融科技平台，收入来自多层费用：经常性会员费、交易级账单处理费、授信额度分期费和可选融资费。旗舰产品 Flex Rent
              让符合条件的住宅租户把月租拆成两笔：第一笔月初到期，第二笔在月底前于月内稍后支付 [CI001]。使用该服务需支付自动续费的 $5.99 月会员费 [CI002]。此外，平台对处理的租金或账单总额收取 0.5%
              交易处理费 [CI002]。选择信用卡而非借记卡或银行转账的用户还需支付 2.5% 刷卡附加费，使刷卡交易总费率达到 3.0% [CI002]。

              用户通过无抵押循环授信，为先行支付的租金或账单部分提供资金时，Flex 按借款额度收取最高 3% 的分期费 [CI002]。该费用是固定借款费，提前还款也不能折扣或减少，因而为资金提供方形成有效借款收益
              [CI002]。不符合授信条件或不选择授信的用户可使用 Flex Pay in Full；这类用户免交 $5.99 月会员费，但仍需支付 0.5% 交易处理费，适用时还需支付 2.5% 刷卡附加费
              [CI002]。补充收入包括把分期模式扩展到公用事业、通信、保险、托儿等非租金家庭义务的 Flex Bills，以及帮助符合条件的消费者将押金和初始租约成本分三个月或六个月支付的 Flex Move-in
              [CI006]。所有消费者产品均不向房东及物业管理合作方收取直接软件许可或支付便利费，Flex 因而以物业零成本的方式获客 [CI001]。
            claimRefs:
              - CI001
              - CI002
              - CI006
