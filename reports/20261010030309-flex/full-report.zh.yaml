  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以消费者工作流定义产品与服务
        blocks:
          - type: paragraph
            body: >-
              Flex（Flexible Finance,
              Inc.）提供金融科技应用，将账单到期日与工薪周期拆开，以缓解家庭现金流波动。住宅租金、车贷、房贷、托儿、公用事业和通信账单等大额义务，通常在每月初一次性到期；而许多家庭的收入按双周或半月到账，于是产生时点错配。用户通过
              Flex 移动应用把符合条件的月度义务加入自动分期计划。Flex
              在到期日前向房东或第三方账单方支付全额账单，使消费者避免滞纳金或罚金；用户同时在排期时支付第一期，并选择当月稍后、与收入节奏相符的第二期日期。不同于把义务拉长 6–8 周并滚入未来账期的多月 BNPL，Flex
              将偿还严格限制在服务当月，避免循环债务余额不断增长。
            claimRefs:
              - CE001
              - CE002
              - CE003
