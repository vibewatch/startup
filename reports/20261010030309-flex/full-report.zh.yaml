      - number: '1.2'
        title: 运营规模、资本历史与治理结构
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年末，Flex 已实现较大规模的消费者采用：据披露，服务客户超过 350 万，累计处理支付额超过 $45B，月度租金交易量超过 $1B，纽约总部员工超过 400
              人。独立投资跟踪数据显示，公司六轮融资累计股权资金为 $388.3M。股权融资始于 2019 年 10 月 $5.78M 的 Seed 轮（投后估值 $31.84M），随后是 2020 年 9 月 $14.02M
              的 Series A（$57.76M）、2021 年 4 月 $50.11M 的 Series B（$252.21M）、2022 年 4 月由 Camber Creek 领投的 $160M Series
              C（$959.79M）、2024 年 4 月 $146.41M 的 Series D（$1.36B），以及 2024 年 6 月按 $1.41B 估值定价的 $12M Series D 无投票权扩展轮。

              Flex 的股权结构表高度集中于房地产科技及地产技术专业投资者，主要包括 Camber Creek、Coatue Management、Renn Global、Matrix Partners
              及数十家机构共同投资者。治理权仍由管理层和主要创投伙伴紧密掌握，但 Flexible Finance, Inc. 的董事席位及委员会成员没有详细公开披露。2026 年 7 月，Flexible Finance
              申请设立拟议中的犹他州工业银行子公司，可能长期转向自有银行牌照，以降低对第三方赞助银行的依赖。
