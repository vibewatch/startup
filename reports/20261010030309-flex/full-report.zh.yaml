      - number: '3.3'
        title: 定价、产品组合与转换动态
        blocks:
          - type: paragraph
            body: >-
              不同租金支付机制在费用承担和租户成本可预测性上差异明显。传统住户门户在刷信用卡付租时通常转嫁 2.5%–3.5% 的卡组织处理费，而 ACH 常常免费或只收象征性费用。Flex 则采用多层收费：$5.99
              月会员费、0.5% 租金处理费（刷卡另加 2.5%）以及按借款额度收取的最高 3% 可变分期费。关键是，提前还款不能降低或退还 Flex
              分期费。单个租户若改回标准门户支付，技术切换成本很小；但物业管理方一旦完成工作流集成，Flex 的模式就会形成双边锁定，因为租户看重可预测的双月现金流管理。
            claimRefs:
              - CP005
              - CP006
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.4'
        title: 壁垒持久性、平台依赖与替代风险
        blocks:
          - type: paragraph
            body: >-
              Flex 的长期竞争持久性取决于能否抵御物业管理 ERP 在位者的渠道去中介化。Flex
              不拥有底层物业管理记录系统，只是外部软件中介，运营能否持续取决于房东同意和门户兼容性。如果大型物业管理软件供应商在现有住户门户中加入原生分期支付或授信额度选项，Flex
              便会面临直接替代压力，且不拥有主要租户关系。此外，其运营模式依赖 Lead Bank、Column N.A. 等银行合作方，以及由 Flexible Finance Brokering, Inc. 和
              Flexible Finance Servicing, Inc. 管理的逐州放贷牌照合规。尽管 Flex 声称已有超过 350 万用户、处理账单超过
              $45B，若要维持竞争差异化，仍需从租金分期扩展到完整家庭账单管理，并深化自有物业管理集成。
