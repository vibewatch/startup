callouts:
  - calloutType: insight
    title: Dual-Sided Value Proposition Drives Distribution Velocity
    body: Flex creates aligned economic incentives for both renters and property managers. Renters avoid punitive $50 to $150 landlord late fees by smoothing payments into two installments, while landlords receive guaranteed full rent disbursements on the first of the month, reducing bad debt and collection friction.
    claimRefs:
      - CM001
      - CM006
      - CM008
  - calloutType: risk
    title: Depository Dependence and Multi-Entity Diligence Fog
    body: Because Flexible Finance, Inc. is not a chartered bank, its lending programs rely on third-party bank partners Lead Bank and Column N.A. Furthermore, diligence must navigate extreme brand homonym ambiguity across public electronics manufacturers, mutual funds, and gig platforms.
    claimRefs:
      - CM003
      - CM010
      - CM012
      - CM013
