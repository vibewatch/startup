callouts:
  - calloutType: "risk"
    title: "Banking Partner Dependency and Asymmetric Product Coverage"
    body: "Flex's entire operating model is predicated on partner bank relationships with Lead Bank and Column N.A. Neither Flex nor its operating subsidiaries hold banking charters or disburse consumer loans directly. Column N.A. currently supports only Flex Rent, leaving Flex Bills and expanded bill-splitting flows tied to Lead Bank. Any regulatory friction, API outage, or underwriting policy tightening from these partner banks poses direct operational risk to service continuity."
    claimRefs:
      - "CE008"
      - "CE010"
      - "CE011"
  - calloutType: "insight"
    title: "Intra-Month Credit Structure Mitigates Revolving Debt Traps"
    body: "Unlike traditional point-of-sale BNPL products that spread repayments across 6 to 8 weeks and encourage perpetual debt rollover, Flex restricts installment obligations to the current calendar month. By combining upfront fee transparency with zero late penalties and direct reporting to major credit bureaus, the platform positions itself as an intra-month cashflow smoothing tool rather than a speculative consumer loan."
    claimRefs:
      - "CE003"
      - "CE012"
      - "CE014"
