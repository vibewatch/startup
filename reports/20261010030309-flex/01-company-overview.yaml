chapter:
  number: 1
  title: "Company Overview"
  summary: "Flex (Flexible Finance, Inc.) is a New York-headquartered consumer financial technology company founded in 2019 by Shragie Lichtenstein and YeTong Shao that enables renters and consumers to split monthly rent and recurring household bills into two payments. Operating through federally insured bank partners Lead Bank and Column N.A., the company has scaled to over 3.5 million members, $45 billion in cumulative bills paid, and over 400 employees, while raising $388.3 million in total funding across six rounds through a Series D non-voting extension at a $1.41 billion valuation. In July 2026, Flexible Finance announced applications to establish a proposed Utah industrial bank subsidiary to support its lending and payments infrastructure."
sections:
  - id: "identity-and-business-model"
    title: "Corporate Identity, Core Product, and Bank Partnership Architecture"
    body: "Flexible Finance, Inc., operating commercially as Flex (getflex.com), is a consumer financial technology company founded in 2019 and headquartered in New York City. The company was founded by Shragie Lichtenstein and YeTong Shao to resolve cash-flow volatility for consumers whose monthly obligations—most notably rent, mortgages, and essential household bills—fall due on fixed calendar dates that mismatch biweekly or irregular income schedules. Flex operates not as a chartered depository institution, but as a technology and servicing layer. Credit facilities, lines of credit, and payment transmissions are originated and provided by federally insured bank partners Lead Bank and Column N.A., Members FDIC. Brokering activities are conducted through Flexible Finance Brokering, Inc. (NMLS ID #2599800), and servicing and collection activities are managed by Flexible Finance Servicing, Inc. (NMLS ID #2256673).\n\nThe company's core consumer offering, Flex Rent, pays the property manager or landlord upfront and in full when rent is due, allowing the tenant to pay an initial portion and repay the remaining balance later in the month on a user-selected date. Beyond rent, Flex has expanded its platform into Flex Bills (covering utilities, car payments, phone, internet, insurance, and childcare) and Flex Move-in. The fee model comprises a monthly membership fee of up to $5.99, a 0.5% bill processing fee on the total bill amount, a split fee of up to 3% based on the borrowed amount, and an optional 2.5% surcharge when paying by credit card. Flex does not charge late fees or penalty interest, and reports on-time rent payment histories to Equifax, Experian, and TransUnion to help users establish credit history."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "scale-operations-and-capital"
    title: "Operating Scale, Capital History, and Governance Structure"
    body: "By late 2026, Flex reached significant consumer adoption, reporting over 3.5 million customers served, more than $45 billion in cumulative payments processed, and over $1 billion in monthly rent volume, alongside more than 400 employees based out of its New York headquarters. Independent investment tracking compiles a total equity funding history of $388.3 million across six financing rounds. The company's equity capital sequence began with a $5.78 million Seed round in October 2019 ($31.84 million post-money valuation), followed by a $14.02 million Series A in September 2020 ($57.76 million post-money), a $50.11 million Series B in April 2021 ($252.21 million post-money), a $160 million Series C in April 2022 led by Camber Creek ($959.79 million post-money), a $146.41 million Series D in April 2024 ($1.36 billion post-money), and a $12 million Series D non-voting extension in June 2024 pricing the company at $1.41 billion.\n\nFlex's institutional cap table is heavily anchored by proptech and real estate technology specialists, led by Camber Creek (which led or participated in Seed, Series A, Series B, and Series C), Coatue Management, Renn Global, Matrix Partners, and dozens of institutional co-investors. Governance remains closely held by executive leadership and primary venture partners; however, detailed board of directors seats and committee memberships for Flexible Finance, Inc. are not publicly disclosed. In July 2026, Flexible Finance initiated a major regulatory advancement by filing applications to establish a proposed Utah industrial bank subsidiary, representing a potential long-term transition toward a self-chartered banking model to reduce dependency on third-party sponsor banks."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO002"
      - "TO003"
  - id: "naming-disambiguation-and-risks"
    title: "Entity Disambiguation, Regulatory Boundary, and Risk Profile"
    body: "A critical diligence requirement when evaluating Flex is disambiguating Flexible Finance, Inc. from unrelated corporate entities sharing the 'Flex' name in public records. First, Flex Ltd. (NASDAQ: FLEX) is a $40B+ market capitalization global manufacturing and electronic supply chain corporation headquartered in Austin, Texas (formerly Singapore-registered Flextronics) led by CEO Revathi Advaithi, which announced in 2026 the planned spin-off of its Cloud and Power Infrastructure business (Axiom Solutions International) and a $2.0 billion convertible preferred equity financing. Second, Amazon Flex is an independent contractor logistics delivery program operated by Amazon.com, Inc., which settled an FTC enforcement action for $61.7 million in 2021 concerning driver tip withholding. Third, a separate commercial finance startup formerly called Flexbase raised $70 million in July 2026 to offer AI-native private banking for middle-market business owners.\n\nFor Flexible Finance, Inc., operational and regulatory diligence centers on the consumer credit-building and bank-partnership model. Because Flexible Finance relies on bank partners Lead Bank and Column N.A. for loan origination and deposit movement, any regulatory enforcement on bank-fintech sponsor arrangements represents a systemic dependency. Furthermore, while the company has applied to establish a Utah industrial bank subsidiary, an application does not constitute regulatory charter approval, leaving future capital and compliance costs uncertain."
    claimRefs:
      - "CO014"
      - "CO015"
      - "CO016"
