callouts:
  - calloutType: "insight"
    title: "Multi-Entity Naming Ambiguity in Diligence Research"
    body: "Diligence analysts must decouple Flexible Finance, Inc. (consumer rent-splitting fintech, $1.41B valuation) from Flex Ltd. (public technology manufacturing corporation, NASDAQ: FLEX, $40B+ enterprise value) and Amazon Flex (logistics delivery contractor program). Public automated news and SEC scraping engines frequently conflate these three independent organizations."
    claimRefs:
      - "CO014"
      - "CO015"
  - calloutType: "risk"
    title: "Bank-Fintech Sponsor Dependency and Regulatory Transition"
    body: "Because Flexible Finance is not a bank, its entire payment transmission and line of credit execution relies on partnerships with Lead Bank and Column N.A. While the company submitted applications in July 2026 for a Utah industrial bank charter, regulatory review remains pending, leaving partner bank dependency as a primary operational risk factor."
    claimRefs:
      - "CO004"
      - "CO013"
      - "CO016"
