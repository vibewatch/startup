companyProfile:
  summary: >-
    Flex is a New York-based consumer fintech founded in 2019 by Shragie Lichtenstein and YeTong Shao that helps renters
    and households split recurring rent and bills into two payments while paying landlords and billers upfront. The
    company operates through sponsor-bank partners Lead Bank and Column N.A., layers its brokering and servicing through
    licensed affiliates, and has scaled to a reported 3.5 million customers, more than $45 billion in cumulative
    payments, and more than 400 employees. Flex also reported applications for a proposed Utah industrial bank
    subsidiary in July 2026, signaling a longer-term effort to reduce sponsor-bank dependence.
