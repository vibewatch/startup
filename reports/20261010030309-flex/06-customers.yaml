      - "CU011"
      - "CU016"
  - calloutType: "insight"
    title: "Entity Ambiguity Obscures Independent Market Verification"
    body: "Automated search signals for Flex are heavily polluted by Flex Ltd. (manufacturing) and Amazon Flex (logistics). The near-total absence of independent analyst coverage for Flexible Finance, Inc. highlights that published metrics remain entirely company-controlled."
