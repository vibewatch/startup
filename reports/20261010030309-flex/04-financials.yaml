callouts:
  - calloutType: "insight"
    title: "Multi-Tiered Monetization Offsets Zero Landlord Pricing"
    body: "Flex achieves widespread distribution in multifamily properties by offering a zero-cost software integration to landlords and property managers. It monetizes entirely on the consumer side through an interdependent fee structure: a $5.99 recurring monthly membership fee, a 0.5% transaction processing fee, and an up to 3% credit line split fee on borrowed funds. This multi-stream structure allows Flex to generate revenue from both subscription retention and payment transaction volume [CI001, CI002]."
    claimRefs:
      - "CI001"
      - "CI002"

  - calloutType: "risk"
    title: "Absence of Audited Credit Metrics Precludes Direct Underwriting"
    body: "Although Flex claims over 3.5 million cumulative customers and $45 billion in total payments processed, the company provides no public disclosure of net charge-off rates, delinquency buckets, gross margins, or partner bank advance terms. Because Flex advances full rent payments to landlords while absorbing tenant non-payment risk without charging late penalties, undisclosed credit losses represent a critical private risk factor [CI003, CI005, CI013, CI014]."
    claimRefs:
      - "CI003"
      - "CI005"
      - "CI013"
      - "CI014"

  - calloutType: "assumption"
    title: "Partner Bank Concentration and Charter Evolution"
    body: "Flex relies heavily on third-party bank partners Lead Bank and Column N.A. to originate loans and lines of credit. While Flexible Finance announced an application to establish a proposed Utah industrial bank subsidiary in July 2026, the application remains pending regulatory approval. Until a direct charter is operational, Flex remains operationally dependent on third-party sponsor bank facilities and funding agreements [CI002, CI006]."
    claimRefs:
      - "CI002"
      - "CI006"

