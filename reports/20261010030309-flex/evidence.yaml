evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Formal board of directors composition, committee chairs, and executive officers list for Flexible Finance, Inc.
    whyItMatters: >-
      Without public board and executive rosters, key-person dependency and fiduciary governance quality cannot be
      independently evaluated.
    diligencePath: Request state incorporation certificates, corporate bylaws, and verified leadership register from company counsel.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: banking-charter
    missingEvidence: >-
      Official application docket and regulatory review status from the Utah Department of Financial Institutions and
      FDIC for the proposed industrial bank.
    whyItMatters: >-
      Determines whether Flexible Finance will successfully secure depository authority and direct lending capabilities
      or remain permanently dependent on partner banks.
    diligencePath: >-
      Submit public records inquiries to the Utah Department of Financial Institutions and review FDIC deposit insurance
      application notices.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: credit-underwriting-metrics
    missingEvidence: >-
      Audited loan performance metrics, consumer default and charge-off rates, average APR equivalents, and credit loss
      reserves for Flex's rent line of credit.
    whyItMatters: >-
      Without independent loss rate and default data, underwriting durability and true net unit economics across
      economic cycles cannot be objectively verified.
    diligencePath: >-
      Request bank partner origination reports from Lead Bank and Column N.A. or inspect audited financial statements
      from Flexible Finance, Inc.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-retention-and-churn
    missingEvidence: >-
      Audited resident retention, cohort churn, and property-level renewal data comparing Flex against native property
      portal payment features.
    whyItMatters: >-
      Determines whether Flex maintains durable resident loyalty when property managers switch accounting or resident
      portal vendors.
    diligencePath: >-
      Request anonymized unit-level cohort retention schedules and property management system partner renewal rates
      during management diligence.
    relatedQuestionRefs:
      - QP002
