      Without audited revenue and margin disclosures, valuation multiples and sustainable cash generation cannot be
      verified.
    diligencePath: >-
      Obtain audited financial statements and CPA management letters for fiscal years 2024 through 2026 under a formal
      non-disclosure agreement.
    relatedQuestionRefs:
