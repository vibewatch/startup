callouts:
  - calloutType: "risk"
    title: "ILC Charter Opposition Threatens Capital Independence"
    body: "The joint BPI-ICBA petition to the FDIC represents a structural headwind for Flex. Opponents argue that establishing Flex Bank creates a captive shell institution that skirts consolidated Federal Reserve oversight, introduces dangerous affiliate transaction dynamics under Regulation W, and presents systemic risk to the Deposit Insurance Fund. If the FDIC pauses or denies the application, Flex remains tethered to external bank partners and vulnerable to third-party contract renegotiation."
    claimRefs:
      - "CR002"
      - "CR003"
      - "CR005"
  - calloutType: "insight"
    title: "Disambiguation Imperative Across the Flex Brand Ecosystem"
    body: "Underwriters and analysts must exercise diligence to decouple Flexible Finance, Inc. from unrelated public and regulatory entities sharing the name Flex. Global manufacturing titan Flex Ltd. ($27.9B sales in FY2026) and historical enforcement cases like the FTC's Amazon Flex tip settlement distort automated screening tools. Diligence should focus exclusively on Flexible Finance's balance-sheet credit lines, rent servicing agreements, and NMLS licensed entities."
    claimRefs:
      - "CR013"
      - "CR014"
      - "CR015"
