chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立故事与商业模式
        blocks:
          - type: paragraph
            body: >-
              SiFive 在半导体里的核心身份很有战略含义：它由 Krste Asanovic、Yunsup Lee 和 Andrew Waterman 于 2015 年创立，这支 Berkeley 团队也被认为在 2010
              年创造了 RISC-V。这个出身重要，因为 SiFive 卖的不是通用 CPU，也不是成品芯片；
              它把一个开放标准做成商业化实现，让客户可以许可、定制，再集成进自己的芯片。公司自己的商业模式页面把收入机制讲得很清楚： SiFive 提供自研 RISC-V 处理器
              IP，收取前期许可费，也从客户芯片销售中收取下游版税。公开产品组合已经覆盖 Essential 嵌入式核心、Intelligence 向量和矩阵 AI 产品、Performance 应用处理器，以及
              Automotive 产品。这个组合让 SiFive 更接近 Arm 的 IP
              许可模式，而不是无晶圆厂产品公司；差别在于它更强调架构定制、开放标准一致性和按工作负载协同设计。公开网站对公司的精确重心仍留下一些模糊处： 近期新闻稿使用 Santa Clara 电头，地点页面列出
              Berkeley 和其他全球办公室，较早的第三方资料仍指向 San Mateo。尽调时， Silicon Valley 是最干净的当前表述；未解决的城市级差异，更应视为披露质量问题，而不是投资逻辑本身。
