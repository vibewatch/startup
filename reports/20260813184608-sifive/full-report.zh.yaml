      - number: '3.4'
        title: 切换成本、多栖与分销力量
        blocks:
          - type: paragraph
            body: >-
              开放 RISC-V 降低了架构依赖，但没有消除切换成本。买家仍要认证工具链、验证操作系统、证明安全行为，并且常常要投入漫长产品周期。这些摩擦让多栖在理论上可行，
              但在实践中少见。汽车领域尤其如此，工具链认证和安全证据可能压过实际核心选择。Arm 因此保留权力，不只因为架构熟悉，也因为生态能降低执行风险。 SiFive
              的答案是借伙伴撬动：Linux、晶圆厂、工具链和汽车平台伙伴能帮助弥合信任缺口，而不需要 SiFive 匹配 Arm 的资产负债表。即便如此， 分销和支持的不对称仍然重要。
