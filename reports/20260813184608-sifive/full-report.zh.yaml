  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按买家、用户与付费方划分客户
        blocks:
          - type: paragraph
            body: >-
              SiFive 的客户基础必须不同于普通封装芯片供应商来分层。直接付费方通常是上游设计组织——半导体公司、汽车 Tier 1、OEM 计算平台团队， 或超大规模云厂商芯片团队——它们为自己的产品许可 CPU
              IP。用户可能是这支工程团队，也可能是验证平台的下游软件组织。同时，SiFive 还有一个战略上重要、经济属性不同的人群：开发者和生态参与者，他们使用开发板、Linux 发行版和 BSP 层，让 RISC-V
              变得可用。第二类人群重要， 因为它会降低第一类人群未来的切换成本。第三类人群是战略伙伴；即便它们不一定是直接收入客户，其采用信号也有价值：Red Hat、Canonical、Fedora 贡献者、GitHub
              维护者和汽车工具链伙伴都属于这里。因此，公开来源尽调必须分清谁付费、谁验证，以及谁只是扩大生态表面。
            claimRefs:
              - CU001
              - CU002
              - CU020
              - CU033
