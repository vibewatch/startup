            body: >-
              典型软件式耐久性指标缺失。SiFive 没有披露净留存率（NRR）、总留存率（GRR）、流失率、续约率或合同期限。最接近的公开替代指标是连续性信号： Red Hat 和 Canonical 的重复 OS
              支持，Fedora 和 GitHub 社区中持续的开发板使能工作，以及多次汽车生态合作。这些代理指标确实重要——
              尤其在一个许可业务里，如果生态放弃它，外部会看得见——但它们无法告诉投资人：现有客户是否扩大年度支出、是否产生增长版税，还是只是维持实验兴趣。
              它们还与预览阶段软件栈里可见的支持摩擦并存。正确结论不是耐久性弱，而是公开证据量化不足。
