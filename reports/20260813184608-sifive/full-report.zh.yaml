      - number: '5.4'
        title: 部署、集成与商业佐证
        blocks:
          - type: paragraph
            body: >-
              SiFive 的公开产品证据，在有外部生态支持或具体部署实物的地方最强。Red Hat 合作把 RHEL 10 开发者预览放到 P550 上；Canonical 和发行版材料显示 Ubuntu 及更广泛
              Linux 支持；Intel 与 Samsung 公告显示 SiFive IP 准备如何插入更大的晶圆厂和加速器工作流。NVLink Fusion 也因同样原因重要：它把 SiFive 放进异构 AI
              机架，而不是让它替换每一个既有组件。 最强的具体出货产品佐证较早，但仍有价值——FADU 基于 SiFive IP 的 SSD 控制器和 SSD 产品。较弱区域是最雄心勃勃的一块：
