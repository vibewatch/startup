  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              结构上最重要的风险类别是监管与法律。SiFive 正进一步进入 AI 和数据中心叙事，而美国围绕先进计算的出口管制政策也变得更宽、更细、更强调执法。 BIS 和 GAO
              官方材料显示，规则现在不仅覆盖产品，也覆盖交易对手、尽职调查、实体清单暴露和配套服务。对一家卖 IP 而不是芯片的公司来说， 这不会消除风险，而是把风险位置转向伙伴和客户合规。RISC-V
              的地缘政治显著性又加了一层。这个架构如今已进入美中竞争的战略讨论， 未来受到政策关注的概率更高。OpenFive/CFIUS 事件也说明，在交易情境中，牵涉 SiFive
              的资产会引来国家安全审查。本次复核的公开记录没有发现正在进行的诉讼， 但在一个由更大既有厂商主导的 CPU IP 市场里，仍应假设存在专利和许可悬置风险。
