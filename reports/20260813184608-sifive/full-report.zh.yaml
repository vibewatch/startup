      - number: '1.2'
        title: 领导层、创始人连续性与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人连续性仍是 SiFive 最强的信号资产之一。Patrick Little 现任董事长、总裁兼 CEO；Krste Asanovic 仍在公开材料中被列为联合创始人兼首席架构师，Yunsup Lee
              也继续以联合创始人兼 CTO 身份出现。Andrew Waterman 仍在公开创始叙事里，说明公司今天的背书仍来自它与 RISC-V 标准故事的直接距离，而不是后来改写的财务或运营叙事。CPU IP 客户在意
              ISA 方向、软件兼容性和长期路线图可信度，这种创始人与市场的契合很有价值。但治理透明度弱于运营故事。公开来源没有给出清晰的当前董事会名单、投票结构或投资人权利图谱，
              外部尽调难以有把握地判断控制权动态。现有证据多是间接的：融资公告列出具名投资人，法务高管招聘强调 IPO 和 M&A 经验，
              战略伙伴继续出现在产品和生态里程碑中。这足以说明公司有机构资本支持，并在搭建上市公司式规范；但还不足以还原今天到底是谁在治理它。
