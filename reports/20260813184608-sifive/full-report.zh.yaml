  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 按买家任务划分的竞争版图
        blocks:
          - type: paragraph
            body: >-
              不能只拿 SiFive 和其他 RISC-V 初创公司对标。芯片公司选择 CPU IP 时，至少可以用五种方式完成任务：购买既有 Arm 基础设施或汽车 IP； 向
              SiFive、Codasip、Syntacore 以及 Andes 等被引用的同行购买商业 RISC-V IP；从垂直整合的 RISC-V 芯片公司获取功能； 继续使用既有 MCU 或 MPU
              供应商的嵌入式替代品；或者把更多 CPU 栈放在内部自研。这个宽度很重要，因为不同细分市场优化不同标准。 数据中心和基础设施团队在意性能、Linux
              就绪度和供应商信任。汽车买家在意安全、工具链和长支持窗口。嵌入式买家通常更在意成本、认证工作量和供应连续性， 而不是架构意识形态。现实中，SiFive
              不是在一个干净单一品类里竞争，而是在开放性、支持能力和上市速度的交叉点上竞争。
