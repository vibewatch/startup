      - number: '1.4'
        title: 运营足迹、生态佐证与关键里程碑
        blocks:
          - type: paragraph
            body: >-
              近期里程碑显示，SiFive 正尝试把标准领导力转化为生态锁定。公司称 2025 年是创纪录增长年，其 IP 已进入 500+ 个设计，基于 SiFive 的内核出货超过 10
              billion。公开路线图信号也讲同一个故事：P870-D 瞄准数据中心 CPU 编排；NVLink Fusion 把未来 SiFive 平台接入以 NVIDIA 为中心的 AI 系统；Red Hat 选择
              HiFive Premier P550 作为最初的 RHEL 10 RISC-V 目标；Ubuntu 也预装在同一块板上。汽车侧佐证同样更多由伙伴牵引，而不是客户披露：Renesas、HighTec 和
              Quintauris 都宣布了与安全、区域架构或下一代车辆计算绑定的工作。地域也支撑规模逻辑。SiFive 地点页面列出美国、欧洲、印度、中国、日本、韩国、台湾和英国等办公室； Revelio 即使在 2023
              年后裁员周期之后，仍看到员工数超过 580。弱点在于，精确收入和员工数仍是私有信息。第三方估计有方向价值但彼此不一致， 因此正确结论不是 SiFive 没有规模，而是它还没有达到公开市场级别的运营披露。
