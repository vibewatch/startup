      - number: '2.3'
        title: 买家分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              SiFive 的买家图谱在上游，由工程团队主导。数据中心里，最关键买家是超大规模云厂商或云芯片设计组织，它们寻找可定制 CPU IP， 以插入 GPU 密集的 AI 机架。预算控制通常在芯片平台、基础设施或定制
              ASIC 团队手里，而不是 IT 采购手里。汽车里，实际付费方是半导体供应商、Tier 1 平台架构师和 OEM 计算平台负责人，他们要在严格的安全和网络安全约束下决定如何构建
              ADAS、车身和中央计算控制器。工业和嵌入式市场里， 采购通常由 SoC 团队掌握，这些团队看重低功耗、设计自由度和更低版税负担。采用路径也不同于封装芯片市场：客户先评估 ISA 和软件栈， 选择可许可的 CPU
              家族，验证工具链和安全包，把 IP 集成进更大的 SoC，然后才出货系统。这条链很长，因此伙伴佐证很重要。HighTec、Quintauris 和 Renesas 不只是
              logo；它们在工具链、安全和互操作层面降低采用摩擦，而这些层面决定 SiFive 的市场能否从架构好奇心转化为量产规模。
