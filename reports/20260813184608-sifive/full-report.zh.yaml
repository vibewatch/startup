      - number: '3.3'
        title: 能力、打包与定价比较
        blocks:
          - type: paragraph
            body: >-
              整个同行集合的 CPU IP 公开定价数据都很差。多数供应商披露许可框架、产品家族和解决方案领域，而不是价目表或实际折扣。因此，竞争比较必须关注打包逻辑， 不只是名义价格。Arm
              打包的是信任、连续性和生态密度；SiFive 打包的是商业 RISC-V 广度和可配置性；Codasip 和 Syntacore 围绕定向目录和定制竞争；垂直整合玩家靠交付系统而不是 IP
              竞争；嵌入式既有厂商则用已知供应链和较低集成风险竞争。投资人的实际问题不是 SiFive 纸面上是否更便宜，因为公开证据很少能说明这一点；而是 SiFive 能否在 CPU IP
              结构性商品化之前，把灵活性转化成溢价合同。
