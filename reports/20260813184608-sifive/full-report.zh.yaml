      - number: '5.5'
        title: 信任、合规与路线图边界
        blocks:
          - type: paragraph
            body: >-
              在信任和合规上，SiFive 做的公开工作多于许多半导体初创公司。汽车材料反复提到 ISO 26262 功能安全包和 ISO/SAE 21434 网络安全一致性；P570
              材料又加入了对安全应用处理器有意义的安全和虚拟化构建块。公司还围绕安全、验证和企业 Linux 展示了相当广的工具生态。 不过，公开记录在认证和伙伴背书上强于运营证据。没有公开缺陷率序列、现场故障统计或支持
              SLA 披露，外部投资人无法像判断成熟公开供应商那样判断产品质量。 因此路线图可信度不错，但不是绝对的：SiFive
              显然有活跃发布和可见伙伴，但它最激进的数据中心主张仍需要围绕基准、客户阶段和部署时点做管理层尽调。
