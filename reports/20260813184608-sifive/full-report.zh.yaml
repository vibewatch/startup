        title: 扩张循环与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开来源里最可信的扩张循环，是从开发者试验走向企业或 OEM 评估，再进入芯片设计导入。这在战略上有吸引力，但也意味着漏斗可能要多年才能变现。
              集中度风险是它的镜像：由于具名客户稀疏，外部观察者无法知道，当前许可或版税收入是否大多来自少数客户或伙伴。渠道依赖也真实存在。Arrow 影响开发板可得性，Red Hat 和 Canonical
