      - 行动含义
    rows:
      - - 再次不透明融资
        - 新增资本没有硬收入披露，也没有令人信服的价格发现
        - 说明 Series G 买来的是时间，不是证据。
        - 把估值态度从足价重估为偏高 / 回避。
      - - 真实收入落在低端估计附近
        - 尽调或未来文件显示收入更接近低于 $100M，而不是 $250M-$300M
        - 隐含倍数被拉爆，IPO 可信度走弱。
        - 当前价格放弃；只有重置后再看。
      - - 版税转化仍然单薄
        - 付费版税量产项目很少扩宽，甚至没有扩宽
        - 模型变成押注未来规模的期权，而不是当前经济性的证据。
        - 推荐维持观察，甚至下调。
      - - 企业生态证据停滞
        - Red Hat / Linux 赋能仍像预览版，缺少更广生产证据
        - 削弱企业采用溢价叙事。
        - 下调乐观情景概率，并收窄公允价值区间。
      - - 大型平台带来的竞争压力上升
        - Arm、NVIDIA 或其他生态龙头挤压 SiFive 的战略空白
        - 提高 GTM 风险和退出复杂度。
        - 要求更高安全边际。
    notes: 上述外部或尽调可观察触发条件用于季度重新承销。
    claimRefs:
      - CV021
      - CV030
      - CV031
      - CV032
      - CV033
      - CV039
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入和毛利率
        - 已验证的 FY2025/FY2026 收入、确认政策和毛利率桥接
        - 这是当前估值最大的信心解锁项。
        - 数据室中的 CFO / 审计师材料。
      - - 付费版税客户队列细节
        - 活跃付费版税项目数量、最大客户，以及从设计赢单到出货的阶段进展
        - 需要用它判断版税是否已经冒头，还是仍主要是未来可选项。
        - 财务 + 销售队列分析。
      - - 现金和现金跑道
        - Series G 后现金余额、烧钱速度、招聘计划，以及分情景现金跑道
        - 如果资本充足性确实强，估值舒适度会明显提高。
        - 董事会材料 / 管理层模型。
      - - 优先权和分配瀑布条款
        - 清算优先权、反稀释、老股定价和普通股经济性
        - 新进资金回报可能偏离企业价值数学。
        - 法律文件和股权结构表导出。
      - - IPO 准备包
        - 审计师准备度、治理清理、分部披露和时间假设
        - 需要用它区分可信 IPO 路径和永久 pre-IPO 故事。
        - CFO / 法务尽调会议。
      - - 商业证据扩展
        - 更多具名量产客户和伙伴背书的设计赢单
        - 会降低集中度风险，并支撑更高信心倍数。
        - 销售推荐访谈和客户证据包。
    notes: 以上是在确信地支付后期充分定价前，最低限度需要完成的尽调项目。
    claimRefs:
      - CV023
      - CV024
      - CV030
      - CV032
      - CV040
