  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              分析 SiFive 时，首先应把它看成处理器 IP 供应商，而不是商用 CPU、服务器或汽车模块卖家。它自己的商业模式和产品组合材料已经讲明： 公司许可 RISC-V
              核和子系统，收取前期费用，并通过版税分享下游客户成功。这意味着应纳入的支出，是客户 SoC 内部可许可的 CPU、子系统和软件使能层。
              应排除的支出，是大部分下游半导体和基础设施栈：GPU、HBM、网络交换机、封装、机箱、配电和成品设备。不过可触达垂直领域仍很宽。 官方市场页面把 SiFive 放在数据中心、AI/ML、汽车、边缘 /
              嵌入式、消费电子、存储、航空航天 / 国防等市场里。云基础设施里的现状替代品是 Arm Neoverse 和既有 x86 服务器 CPU；安全和车身计算里的替代品，仍是专有或基于 Arm
              的汽车计算。因此，正确的市场问题不是“半导体市场有多大”， 而是“买家会在多少计算和控制芯片里许可或协同设计开放标准 CPU IP，因为这种 IP 具有战略价值？”
