  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 证据
      - 什么会改变判断
    rows:
      - - SiFive 在开放 RISC-V 生态里占据有价值的 CPU IP 层
        - 商业模式和融资来源都把 SiFive 描述成类似 Arm 的授权公司。
        - 若证据显示客户没有转化为版税收入，这一论点会明显走弱。
      - - Series G 给 SiFive 留出时间，去追更大的数据中心和企业级机会
        - $400M 新资金显著拉长战略腾挪空间。
        - 若更广证据出现前还需要再融资，这条支撑会走弱。
      - - FADU 和 Red Hat 说明公司已不只是 PPT 故事
        - 具名量产式案例和企业生态引用是真实存在的。
        - 如果证据不能从这些锚点外扩，叙事仍然太窄。
      - - 公开收入质量仍过于不透明，难以高确信度承销
        - 估计分歧、收入波动警示和缺失的审计指标都指向同一个问题。
        - 经审计收入、毛利率和付费版税客户队列数据会提高信心。
      - - Arm 仍有参考价值，但已不是干净可比公司
        - Arm 已在销售自己的 AGI CPU，并在生态内更直接竞争。
        - 如果 Arm 的自研芯片动作失败，它会重新成为更干净的授权业务参照。
      - - 私募 AI 芯片溢价不能自动证明 SiFive 的估值合理
        - Cerebras 和 SambaNova 规模更大，讲的是更完整的 AI 计算栈故事。
        - 如果 SiFive 证明自己有同等稀缺性和规模，可比估值的迁移性才会提高。
    notes: 投资逻辑和反向逻辑刻意保持对称：SiFive 看起来具备战略重要性，但公开证据仍留下实质估值风险。
