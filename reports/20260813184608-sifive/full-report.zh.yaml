      - number: '2.5'
        title: 矛盾、规模缺口与尽调问题
        blocks:
          - type: paragraph
            body: >-
              核心矛盾在于，SiFive 今天变现的窄市场，与它战略上引用的更大终端市场之间差距很大。$1.9-$3.0 billion 的商业 RISC-V
              市场仍能支撑一家大型私有公司，但单靠这个数字，不能证明宣传材料里的每一个数据中心 AI 或汽车愿景都合理。更大的数字只有在 SiFive 能证明自己转化为可许可 CPU
              附着、产生版税的量产和伙伴使能部署时，才有承销价值。公开来源没有给出所需桥接指标。没有按垂直拆分的收入， 没有赢单率数据，没有版税瀑布，也没有自下而上的视角说明：一旦 IP 被选中，SiFive
              能从一个超大规模云厂商或 OEM 项目里拿走多少价值。 因此，尽调应保留总可用市场（TAM）区间，谨慎看待分析师份额估计，并要求管理层给出垂直收入结构、按买家类型划分的活跃管线、版税集中度，
              以及按市场划分的部署里程碑。没有这些，任何公开的可获取市场（SOM）都会更像讲故事，而不是承销。
            claimRefs:
