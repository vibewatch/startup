      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设 SiFive 把当前叙事转成 IPO 级证据。也就是说，收入明确高于当下争议区间，Red Hat
              等企业级项目走出预览状态，更多具名量产项目证明版税在扩面，而不是未来成功上的一张薄期权。在这种情况下，$6B-$8.5B 的结果可以支撑。


              基准情景更克制。SiFive 继续证明战略价值，客户证据缓慢扩宽，收入落在公开估计的中部，而不是任何一个极端。这个情景下，$2.6B-$4.0B
              的区间更合适，也意味着当前这一轮已经消化了合理上行空间的相当一部分。


              悲观情景不需要技术失败。只要收入质量不及预期、版税滞后，或 IPO 窗口仍然苛刻，$0.8B-$1.6B 区间内的降估值融资、结构化融资或战略出售就会变得可信。因此，情景测算支持保持观察，而不是激进入场。
            claimRefs:
              - CV007
              - CV027
