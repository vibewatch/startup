      - number: '2.2'
        title: 规模测算视角——广义 RISC-V TAM 与相邻市场池
        blocks:
          - type: paragraph
            body: >-
              公开规模数据支持多个不可互换的视角。最窄口径下，Mordor 预计 RISC-V 技术市场将从 2026 年 $1.89 billion 增长到 2031 年 $10.62 billion；Global
              Market Insights 则在 2025 年 $2.3 billion 基础上，把更广义的 2026 年市场放在 $3.0 billion。这些数字适合给商业化 RISC-V 机会本身做基准。但
              SiFive 的战略叙事越过了这个狭窄池子。它的 Series G 新闻稿把下一代 AI 和智能体数据中心基础设施描述为 $100 billion-plus 机会；SiFive 自己的材料也强调超大规模云厂商
              CPU 编排、 向量计算和贴近 NVLink 的部署。汽车是另一个关键相邻池子：Future Market Insights 估计 2026 年汽车半导体市场为 $76.0 billion，其中处理器占
              27%，约 $20.5 billion。这些数字不应被揉成一个总可用市场（TAM），因为它们测的是不同范围： 商业化 RISC-V
              收入、相邻基础设施预算，以及处理器占比高的应用领域。更有纪律的结论是：SiFive 当前可变现核心市场不大，但嵌在更大的计算支出类别里； 这些类别未来可能扩大它的可服务市场（SAM）。
