companyProfile:
  summary: >-
    SiFive 是一家后期私有半导体公司，2015 年由 RISC-V 架构师 Krste Asanovic、Yunsup Lee 和 Andrew Waterman 创立，目标是把 RISC-V 处理器 IP 商业化。公司出售可配置
    CPU 核和平台使能能力，覆盖嵌入式、汽车、AI/ML、存储和数据中心等场景， 商业模式类似 Arm：许可费加版税。公开来源能支撑它已有实质规模——500+ 个设计、10B+ 已出货内核、估值 $3.65B 的 $400M
    Series G，以及来自 FADU、Red Hat、Ubuntu 等伙伴的真实生态佐证——但仍未披露经审计收入、利润率、现金跑道或产生版税的客户集中度。
