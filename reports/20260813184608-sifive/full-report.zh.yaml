      - number: '1.3'
        title: 资本形成、投资人基础与 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              SiFive 的融资历史显示，它正从有风投支持的架构赌注，稳步迁移成后期基础设施平台。公司官方新闻稿记录了 2017 年 $8.5 million Series B、2018 年 $50.6 million
              Series C、2019 年 $65.4 million Series D、2020 年 $61 million Series E、2022 年 $175 million Series F，以及 2026 年
              4 月的 $400 million Series G。把这些官方轮次相加， 再纳入 Series B 新闻稿隐含的更早资本，公开记录可支持约 $765.5 million
              的已公告融资额，接近委托方提供的融资框架。这个数明显低于 EE Times 约 $970 million
              的总额，说明第三方统计可能混入了老股交易、非轮次资本或其他交易所得。这个差异重要，因为投资人用不同分母看估值纪律时， 结论会不同。即便如此，方向很清楚：2022 年 Series F 让 SiFive 估值超过
              $2.5 billion；2026 年 Series G 把投后估值推到 $3.65 billion，并明确把这轮资金定位为数据中心 CPU 和 AI 系统扩张的燃料。包括 2022 年和 2026
              年独立报道在内的多个来源，也把公司描述成在走向 IPO 准备，而不是为近期战略出售做包装。
