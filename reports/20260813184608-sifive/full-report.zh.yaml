      - number: '7.3'
        title: 伙伴、客户与依赖风险
        blocks:
          - type: paragraph
            body: >-
              SiFive 的增长策略明显依赖伙伴。NVIDIA 强化 AI 数据中心叙事；Red Hat 和 Canonical 强化 Linux 可信度；Intel 和 Samsung
              强化平台与晶圆厂可信度；HighTec、Quintauris 和 Renesas 强化汽车意义。对 SiFive 这种规模的公司来说，
              这很理性，但也制造了联动依赖。如果伙伴放慢、重新排序优先级，或只是没能把生态工作转化为客户量产项目，SiFive 自己的轨迹也会随之放慢。
              稀疏的公开客户披露又放大了问题，因为外部无法有把握地判断收入集中度，也无法把商业客户与生态验证者分开。结果是，伙伴质量和客户质量不可分割。 一切顺利时，这是强加速器；一旦出错，它会变成危险倍增器。
