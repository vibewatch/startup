      - number: '8.3'
        title: 可比估值框架
        blocks:
          - type: paragraph
            body: >-
              基于可比公司的方法必不可少，但可比组必须谨慎处理。Arm 仍是商业模式上最接近的参照，因为授权加版税的经济性，比 AMD 或 Marvell 更接近 SiFive。不过，Arm 自身在 2026
              年向芯片产品扩张，意味着它的市值现在反映的不只是纯授权经济性。Qualcomm 有助于说明规模化半导体版税模式的威力和风险，尤其是集中度。AMD、Marvell 和 NVIDIA
              在商业模式上没有那么直接，但它们说明，规模化赢家在公开市场的 AI 算力和基础设施倍数仍然处在高位。


              私募 AI 芯片可比公司也确认，投资人仍愿意为稀缺性付高价。但 Cerebras 和 SambaNova 不是 CPU-IP 授权公司；它们更接近全栈 AI 算力故事。它们的公开估值支持一个判断：SiFive
              估值在 $3.65B，并不天然就是贵。但它们不能证明当前价格对新增资本有吸引力。
