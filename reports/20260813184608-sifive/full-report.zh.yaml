      - number: '1.5'
        title: 反向信号与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开来源里最大的负面因素不是灾难性事件，而是披露摩擦。Intel 2022 年放弃收购谈判，说明 SiFive 有战略价值，但也难以定价和整合； 对核心 IP
              公司来说，这并不罕见，因为上行空间取决于未来生态捕获，而不是当前已报告现金流。2022 年 OpenFive 剥离以及随后通过 CFIUS 审查的出售，让故事线更简单，但也确认公司在可能的 IPO
              旅程之前主动重塑了业务边界。与此同时，精确收入、收入结构、版税与许可费占比、董事会构成、
              投资人控制权仍未披露。即使是累计融资总额、准确总部城市这样看似简单的事实，也需要在一手和二手来源之间重新对齐。这些问题都没有破坏核心叙事： SiFive 是 RISC-V CPU IP
              纯商业化公司里的领先者。但后续章节在处理私有财务数据、客户集中度和估值可比对象时，需要明确标注信心等级， 不能默认拥有上市公司精度。
