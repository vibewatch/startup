        title: 收入架构与确认逻辑
        blocks:
          - type: paragraph
            body: >-
              SiFive 变现的是知识产权，而不是芯片。公司官方商业模式页面和多篇独立文章都指向同一个核心结构：客户先付费许可 CPU IP 和配套资料； 如果客户芯片进入量产，SiFive
              之后再获得版税。工程支持和软件使能看起来也是重要的经济附着项，尽管公司没有公开拆分。这个模型有两个后果。 第一，规模化后可能很有吸引力，因为版税和同一 IP
              家族的重复复用，结构上应比制造驱动的半导体模式拥有更高利润率。第二，外部很难读懂它，
              因为确认收入取决于设计周期时点、里程碑结构和量产爬坡，而这些大多不在公开视野里。投资人因此需要把商业模式质量与当前数字透明度拆开看。
