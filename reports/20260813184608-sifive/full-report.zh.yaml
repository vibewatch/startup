      - number: '8.5'
        title: 投资逻辑失效触发点、退出语境与尽调问题
        blocks:
          - type: paragraph
            body: >-
              SiFive 有 IPO 可能性，但公开信息还支撑不到 IPO 质量。公司的规模、资本和生态地位足以保住 IPO
              路径，但新增投资人最想看的核心事项——审计后收入、毛利率、产生版税的客户队列数据、客户集中度、股权结构压力和现金跑道——仍在公开记录之外。这就是为什么估值纪律比故事共情更重要。


              如果下一轮融资仍避开硬价格发现，实际收入明显更接近低端估计，或当前生态证据无法加深为更广泛的量产证据，投资逻辑就会失效。反过来，如果管理层能拿出收入质量和版税广度证据，判断会迅速上修。换句话说，缺失证据异常集中：少数几项尽调材料就能明显改变估值判断。
