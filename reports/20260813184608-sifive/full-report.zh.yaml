  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: sample
      basis: >-
        Selected to bracket SiFive with the most decision-useful public and private comps rather than enumerate every
        semiconductor peer.
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限性
    rows:
      - - Arm Holdings
        - 上市 CPU IP 授权商 / 平台
        - 市值 ~$297.6B（Aug 2026）
        - 授权加版税经济性最接近的商业模式可比对象。
        - 如今正进入自有芯片，因此已不再是纯授权类比。
      - - Qualcomm
        - 上市芯片 + 授权混合模式
        - 市值 ~$173.0B；FY2025 收入约 $38.4B
        - 展示版税叠加芯片如何放大规模，也说明集中度为何仍重要。
        - 移动业务占比高且规模大得多，直接可比性下降。
      - - AMD
        - 上市计算半导体公司
        - 市值 ~$788.5B；FY2025 收入约 $34.6B
        - 可作为公众市场对 AI 计算胃口的上沿参考。
        - 不是 IP 授权业务；产品经济性差异很大。
      - - Marvell
        - 上市 AI / 定制芯片基础设施
        - 市值 ~$199.4B
        - 可作为低于 NVIDIA 软件护城河的数据中心基础设施锚点。
        - 定制芯片和网络敞口不是 CPU IP 版税模型。
      - - NVIDIA
        - 上市 AI 平台龙头
        - 市值 ~$5.456T；FY2026 收入约 $215.9B
        - 展示软件叠加计算领导力能创造多大价值。
        - 太强势且高度一体化，不能直接锚定 SiFive 入场定价。
      - - Cerebras
        - 后期私募 AI 硬件
        - $8.1B Series G 轮（Sep 2025）
        - 确认 AI 半导体公司仍能获得稀缺性溢价。
        - 完整 AI 计算栈故事，不是 CPU IP 授权。
      - - SambaNova
        - 后期私募 AI 硬件
        - $11B 估值（Jul 2026）
        - 另一个标记：私募 AI 芯片资本仍愿以溢价估值入场。
        - 商业模式和规模与 SiFive 明显不同。
    notes: 本表只给方向，不追求精确。它刻意混合商业模式可比和市场背景可比，因为没有单一干净的上市类比。
