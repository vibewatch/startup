          - type: paragraph
            body: >-
              正向投资逻辑有四个支点。第一，SiFive 占据技术栈里有战略价值的一层：CPU IP 和 RISC-V 落地能力，而不是同质化板卡组装。第二，公司融到的资金足以继续投入数据中心级路线图。第三，FADU 和
              Red Hat 的关系说明，SiFive 已经走过纯概念阶段的生态营销。第四，更大的市场环境正在奖励稀缺的 AI 和算力基础设施资产，包括 IP 占比高的公司。


              反向逻辑同样重要。最强的公开证据仍是生态证据，不是持续版税证据。Sacra 对收入前置的警示，正是那类会让一轮融资账面上看着合理、事后回看太贵的问题。Arm
              转向第一方芯片，也让竞争和可比公司框架更复杂：最明显的公开可比公司正在变得没那么中立、进攻性更强。结论是，SiFive 值得继续跟踪，但不能对估值松懈。
            claimRefs:
              - CV004
              - CV016
              - CV017
              - CV018
