      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              乐观情景有充分支撑。RISC-V 采用正在受益于三股互相强化的力量：长期 AI 需求、汽车计算含量膨胀，以及地缘政治下的主权激励。Mordor 增长最快的桶，正是 SiFive
              最强调的两个领域——数据中心和汽车。公司材料也与这个故事对齐：数据中心叙事强调开放 API、每瓦性能和供应链韧性； 汽车叙事强调区域架构、安全、网络安全和单车处理器含量上升；AI/ML
              叙事强调自定义指令，以及可扩展向量和矩阵引擎。但市场并非没有摩擦。 分析师报告仍提示，相比 Arm 和 x86，软件成熟度存在缺口。EE Times
              和其他生态报道也强调标准碎片化、验证工作量和各区域准备度不均。Arm Neoverse 仍是最强的基础设施替代品，因为它提供已验证子系统和成熟伙伴计划；既有汽车平台则积累了多年认证历史。因此，SiFive
              近期最可信的扩张路径，是新设计启动和异构 AI 系统——买家在这些场景里主动想要定制；而不是大规模替换已经部署的既有 CPU 资产。
