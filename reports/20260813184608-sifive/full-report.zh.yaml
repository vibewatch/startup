  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心与估值立场
        blocks:
          - type: paragraph
            body: >-
              看 SiFive，关键不在公司质地是否过关，而在价格是否合适。公司看起来是真公司：商业模式说得通，也融到了一轮有分量的后期资金，生态验证不止停在 PPT。但同一组让 SiFive
              值得关注的证据，也说明当前这一轮不能随手追。公开收入估计跨度太大，审计后财务不可见，长期价值最关键的驱动因素——产生版税的客户数、客户集中度、现金转化和利润率结构——仍未披露。


              估值 $3.65B
              时，只有高端收入判断大体正确，且授权活动已经开始转成有分量的版税飞轮，这一轮才大致能说公平。如果低端判断更接近现实，估值就偏高。这种不对称足以让当前建议维持在「观察」。信心应维持中低，风险应维持高，因为公开记录更能证明战略价值，而不是证明当下财务质量。
