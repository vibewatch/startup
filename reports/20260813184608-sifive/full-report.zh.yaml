      - number: '7.4'
        title: 财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              财务模型风险主要是传导风险。Sacra 把 SiFive 收入描述为前置且波动，这符合典型半导体 IP 难题：许可收入先到，版税后来，漫长设计周期让时点充满不确定性。
              这意味着，如果版税落后于预期，表面动能可能与融资敏感性并存。Series G 明显降低了即时压力，但没有解决核心信息缺口，因为公开记录仍缺少现金、
              烧钱速度、利润率和客户队列转化数据。如果外部预期跑在内部准备度之前，IPO 信号本身就会变成风险。本次复核材料里没有公开债务负担证据，这是有利因素。
              但在公司证明设计导入正以估值隐含节奏转化为耐久经常性经济之前，股权依赖仍是主导风险。
