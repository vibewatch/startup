- id: TU003
  title: Named Customer Proof Table
  columns:
  - Customer / Partner
  - Segment
  - Deployment / Use Case
  - Production vs Pilot
  - Outcome
  - Limitation
  rows:
  - - FADU
    - Storage / direct design customer
    - Annapurna SSD controller and Bravo enterprise SSD powered by SiFive IP
    - Production product proof
    - Strongest named commercial product evidence; enterprise/hyperscale orientation
    - Dated 2018 proof, not a 2026 revenue disclosure
  - - Red Hat
    - Enterprise OS validator
    - RHEL 10 / 10.2 developer preview on HiFive Premier P550
    - Validated preview, not production customer
    - High-quality enterprise-software endorsement; hardware tested specifically on
      P550
    - Not direct silicon revenue evidence
  - - Canonical / Ubuntu
    - Developer and ecosystem validator
    - Ubuntu 24.04 LTS on HiFive Premier P550
    - Production board support with experimental community path
    - Makes P550 a de facto reference platform for developers
    - Support quality initially mixed; not revenue proof
  - - Renesas
    - Automotive partner-customer archetype
    - Joint development of high-end RISC-V automotive solutions
    - Joint development / pre-production
    - Signals interest from incumbent semiconductor supplier
    - Shipment volumes and contract economics not public
  - - HighTec
    - Automotive toolchain partner
    - Safety-ready compiler and industrial/auto software stack
    - Ecosystem support
    - Reduces adoption friction in safety-critical markets
    - Toolchain support is not equivalent to design-win revenue
  - - Quintauris
    - Automotive platform partner
    - Compatibility and standardization layer for RISC-V real-time automotive platform
    - Ecosystem support
    - Improves interoperability thesis
    - Indirect revenue linkage unclear
  notes: This enumeration intentionally distinguishes production products from validation
    partners and development-stage relationships.
