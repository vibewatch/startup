tables:
- id: TU001
  title: Customer Segmentation Table
  columns:
  - Segment
  - Buyer / User / Payer
  - Use Case
  - Scale Signal
  - Revenue / Strategic Value
  - Gap
  rows:
  - - Direct design customer
    - 'Buyer: chip/SoC team; User: hardware+software engineers; Payer: R&D/IP budget
      owner'
    - License CPU IP for custom silicon
    - 500+ designs and 10B+ shipped cores imply broad downstream use
    - Potentially highest direct monetization
    - No public customer count or revenue split
  - - Hyperscaler / cloud silicon prospect
    - 'Buyer: custom silicon org; User: infrastructure architects; Payer: cloud capex
      / silicon budget'
    - Data-center CPU orchestration and AI offload
    - Unnamed tier-1 hyperscaler use/profiling cited by SiFive
    - High strategic value if converted
    - Named deployments not disclosed
  - - Automotive ecosystem customer
    - 'Buyer: semiconductor/Tier 1/OEM platform team; User: vehicle compute engineers;
      Payer: platform budget'
    - ADAS, IVI, body, powertrain, central compute
    - Renesas, HighTec, Quintauris named publicly
    - High strategic value; likely long design cycles
    - Economic terms and shipment volumes undisclosed
  - - Developer / board user
    - 'Buyer: individual developer or team; User: same; Payer: lab/dev budget'
    - Linux validation, prototyping, BSP testing
    - Arrow availability, Ubuntu/RHEL/Fedora signal
    - Important funnel and ecosystem value
    - Probably modest direct revenue
  - - Software / ecosystem validator
    - 'Buyer: partner org; User: open-source and platform teams; Payer: partner ecosystem
      budgets'
    - OS, compiler, distro, and tooling enablement
    - Red Hat, Canonical, Fedora, GitHub
    - High leverage on future monetization
    - Not equivalent to arms-length product revenue
  notes: Segments are separated by who pays and how value is created; public logo
    evidence spans both direct customers and ecosystem validators.
