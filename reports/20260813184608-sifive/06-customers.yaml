- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion Driver / Concentration Risk
  - Impact
  - Implication
  - Diligence Path
  rows:
  - - Board-to-silicon funnel
    - Positive
    - Developer adoption can seed future design wins
    - Track conversion from board use to license agreements
  - - Anonymous hyperscaler interest
    - Mixed
    - Large upside but proof quality remains low without names
    - Request customer names, stage, and projected revenue timing
  - - Ecosystem-heavy proof mix
    - Negative
    - Many strong logos may validate technology without proving revenue scale
    - Separate paying customers from validators in CRM export
  - - Unknown top-customer concentration
    - Negative
    - Revenue could be concentrated in a few undisclosed accounts
    - Request top-10 revenue share and pipeline by segment
  - - OS and channel dependence
    - Negative
    - Red Hat, Canonical, Arrow and community support influence funnel quality
    - Assess alternative channels and support redundancy
  - - Automotive partner dependence
    - Mixed
    - Renesas/HighTec/Quintauris can unlock scale but lengthen control chain
    - Validate commercial ownership of wins and royalty splits
  notes: Risks and opportunities are framed qualitatively because public customer
    economics are thin.
