      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map for SiFive is upstream and engineering-led. In data centers, the most relevant buyer is a
              hyperscaler or cloud-silicon design organization looking for customizable CPU IP that can plug into a
              GPU-heavy AI rack. Budget control usually sits with silicon-platform, infrastructure, or custom-ASIC
              groups rather than IT buyers. In automotive, the practical payers are semiconductor vendors, Tier 1
              platform architects, and OEM compute-platform owners deciding how to build ADAS, body, and central-compute
              controllers under tight safety and cybersecurity constraints. In industrial and embedded markets,
              procurement often sits with SoC teams that value low power, design freedom, and reduced royalty burden.
              The adoption path is also unlike packaged-chip markets: customers evaluate the ISA and software stack,
              choose a licensable CPU family, validate toolchains and safety packages, integrate the IP into a broader
              SoC, and only then ship systems. That long chain is why partner proof matters. HighTec, Quintauris, and
              Renesas are not just logos; they reduce adoption friction at the toolchain, safety, and interoperability
              layers that determine whether SiFive’s market can convert from architectural curiosity into production
              volume.
