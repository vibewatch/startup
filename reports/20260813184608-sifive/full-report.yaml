            body: >-
              The strongest adverse competitive evidence is that open ISA has not yet transferred ecosystem leadership
              away from Arm. Independent comparisons still treat Arm as the reference point for mature tooling and broad
              commercial deployment. At the same time, the RISC-V ecosystem is expanding fast enough that SiFive cannot
              assume category growth translates automatically into company-specific moat. Other IP vendors, vertically
              integrated RISC-V players, and well-capitalized entrants can all attack different parts of the stack. That
              leaves SiFive with a durable but narrow moat: it can be the commercial-control layer for companies that
              want RISC-V without designing a CPU from scratch. If larger entrants or better-capitalized ecosystem
