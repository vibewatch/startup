chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding Story, and Business Model
        blocks:
          - type: paragraph
            body: >-
              SiFive’s core identity is unusually strategic in semiconductors: it was founded in 2015 by Krste Asanovic,
              Yunsup Lee, and Andrew Waterman, the same Berkeley team credited with creating RISC-V in 2010. That origin
              matters because SiFive does not sell a commodity CPU or finished chip; it sells commercial implementations
              of an open standard that customers can license, customize, and integrate into their own silicon. The
              company’s own business-model page makes the revenue mechanics explicit: SiFive provides proprietary RISC-V
              processor IP, receives upfront licensing fees, and also collects downstream royalties tied to customer
              chip sales. Its public portfolio now spans Essential embedded cores, Intelligence vector and matrix AI
              products, Performance application processors, and Automotive offerings. That mix positions SiFive closer
              to Arm’s IP-licensing model than to a fabless product vendor, but with greater emphasis on architectural
              customization, open-standard alignment, and workload-specific co-design. The public website still leaves
              some ambiguity on the exact corporate center of gravity: recent press releases use Santa Clara datelines,
              the locations page lists Berkeley and other global offices, and older third-party profiles still point to
              San Mateo. For diligence purposes, Silicon Valley is the cleanest current descriptor, and the unresolved
              city-level discrepancy is better treated as a disclosure-quality issue than as a thesis point.
            claimRefs:
