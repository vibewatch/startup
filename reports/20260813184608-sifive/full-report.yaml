companyProfile:
  summary: >-
    SiFive is a late-stage private semiconductor company founded in 2015 by RISC-V architects Krste Asanovic, Yunsup
    Lee, and Andrew Waterman to commercialize RISC-V processor IP. The company sells configurable CPU cores and related
    platform enablement across embedded, automotive, AI/ML, storage, and data-center use cases through an Arm-like
    licensing-plus-royalty model. Public sources support meaningful scale—500+ designs, 10B+ shipped cores, a $400M
    Series G at $3.65B valuation, and real ecosystem proof from FADU, Red Hat, Ubuntu, and other partners—but still do
    not disclose audited revenue, margins, cash runway, or royalty-bearing customer concentration.
