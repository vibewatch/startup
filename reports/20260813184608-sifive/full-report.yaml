      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The bullish case is well supported. RISC-V adoption is benefiting from three reinforcing drivers: secular
              AI demand, automotive compute inflation, and geopolitical sovereignty incentives. Mordor’s fastest-growth
              buckets are exactly the two segments SiFive emphasizes most—data centers and automotive. Company materials
              also line up with that story: the data-center pitch emphasizes open APIs, performance-per-watt, and
              supply-chain resilience; the automotive pitch emphasizes zonal architectures, safety, cybersecurity, and
              higher processor content per vehicle; the AI/ML pitch emphasizes custom instructions plus scalable vector
              and matrix engines. But the market is not frictionless. Analyst reports still flag software maturity gaps
              versus Arm and x86. EE Times and other ecosystem reporting highlight standards fragmentation, verification
              work, and uneven regional readiness. Arm Neoverse remains the strongest infrastructure substitute because
              it offers validated subsystems and a mature partner program, while incumbent automotive platforms carry
              years of qualification history. The most credible near-term expansion path for SiFive is therefore in new
              design starts and heterogeneous AI systems where buyers actively want customization—not in sweeping
              displacement of installed incumbent CPU estates.
