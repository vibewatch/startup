    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation by Buyer, User, and Payer
        blocks:
          - type: paragraph
            body: >-
              SiFive’s customer base must be segmented differently from a normal packaged-chip vendor. The direct payer
              is typically an upstream design organization—a semiconductor company, automotive Tier 1, OEM
              compute-platform team, or hyperscaler silicon group—that licenses CPU IP for its own products. The user
              can be either that engineering team or a downstream software organization validating a platform. In
              parallel, SiFive has a strategically important but economically different cohort: developers and ecosystem
              participants using boards, Linux distributions, and BSP layers to make RISC-V practical. That second
              cohort matters because it lowers future switching costs for the first cohort. A third cohort consists of
              strategic partners whose adoption signals are valuable even when they are not obviously direct revenue
              customers: Red Hat, Canonical, Fedora contributors, GitHub maintainers, and automotive toolchain partners
              all fit here. Open-source diligence therefore has to separate who pays, who validates, and who merely
              expands the ecosystem surface.
