  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Architecture and Recognition Logic
        blocks:
          - type: paragraph
            body: >-
              SiFive monetizes intellectual property rather than chips. The company’s official business-model page and
              multiple independent writeups all converge on the same core structure: customers pay upfront to license
              CPU IP and related collateral, then SiFive earns royalties later if those customer chips reach production.
              Engineering support and software enablement appear to be important economic attachments, even if they are
              not broken out publicly. This model has two consequences. First, it can be very attractive at scale
              because royalties and repeated reuse of an IP family should be structurally higher margin than a
              manufacturing-led semiconductor model. Second, it can be hard to read from the outside because recognized
              revenue depends on design-cycle timing, milestone structure, and production ramps that are largely
              invisible in public. Investors therefore need to separate business-model quality from current-number
              transparency.
