      - Signal / indicator
      - Transmission to thesis
      - Action implication
    rows:
      - - Another opaque financing round
        - New capital without hard revenue disclosure or convincing price discovery
        - Suggests Series G bought time but not proof.
        - Re-rate the valuation stance from full to stretched / avoid.
      - - Revenue reality lands near low-end estimates
        - Diligence or future filing implies revenue much closer to sub-$100M than to $250M-$300M
        - Explodes implied multiple and weakens IPO credibility.
        - Pass at current price; revisit only after reset.
      - - Royalty conversion remains thin
        - Few or no broadened royalty-bearing production programs
