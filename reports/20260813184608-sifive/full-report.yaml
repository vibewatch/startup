  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Portfolio Map
        blocks:
          - type: paragraph
            body: >-
              SiFive does not primarily sell finished semiconductors. It sells licensable processor IP and adjacent
              system IP that customers integrate into their own SoCs. The public catalog is structured as families
              rather than individual one-off cores: Performance for application-class and infrastructure compute,
              Intelligence for AI vector and matrix acceleration, Automotive for safety-critical domains, and a broader
              RISC-V core portfolio that acts as the entry point. That portfolio logic matters because it explains why
              SiFive can appear in such different end products—from SSD controllers to developer boards to prospective
              AI-rack CPUs—without becoming a traditional fabless chip vendor. The company is effectively productizing
              architectural building blocks plus enough system IP and ecosystem scaffolding to make them deployable.
