      - number: '1.5'
        title: Adverse Signals and Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The biggest open-source negatives are not catastrophic events but disclosure frictions. Intel’s abandoned
              2022 acquisition talks showed SiFive was strategically valuable but also difficult to price and integrate,
              which is common for core-IP businesses whose upside rests on future ecosystem capture rather than current
              reported cash flow. The 2022 OpenFive divestiture and subsequent CFIUS-cleared sale simplified the story,
              but also confirms that the company has actively reshaped its business perimeter ahead of a likely IPO
              journey. Meanwhile, exact revenue, revenue mix, royalties versus license fees, board composition, and
              investor control rights remain undisclosed. Even seemingly simple facts like lifetime funding totals and
              the exact headquarters city require reconciliation across primary and secondary sources. None of those
              issues breaks the core narrative that SiFive is the leading pure-play commercializer of RISC-V CPU IP, but
              they do mean later chapters should treat private financial figures, customer concentration, and valuation
              comparables with explicit confidence labels instead of assuming public-company precision.
