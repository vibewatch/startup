  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              The most structurally important risk category is regulatory and legal. SiFive is moving further into AI
              and data-center narratives just as U.S. export-control policy around advanced computing has become more
              expansive, more detailed, and more enforcement-oriented. Official BIS and GAO materials show that the rule
              set now reaches not only products but also counterparties, due diligence, entity-list exposure, and
              associated services. For a company selling IP rather than chips, that does not remove risk; it changes the
              locus of risk toward partner and customer compliance. RISC-V’s geopolitical salience adds a second layer.
              The architecture is now strategically discussed in U.S.-China competition, which increases the chance of
              future policy attention. The OpenFive/CFIUS episode also shows that SiFive-related assets can attract
              national-security review in transaction contexts. No active litigation surfaced in the public record
              reviewed here, but patent and licensing overhang should be assumed in a CPU IP market dominated by far
              larger incumbents.
