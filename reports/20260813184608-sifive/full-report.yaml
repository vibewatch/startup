            body: >-
              SiFive’s growth strategy is visibly partner-heavy. NVIDIA strengthens the AI data-center narrative; Red
              Hat and Canonical strengthen Linux credibility; Intel and Samsung strengthen platform and foundry
              credibility; HighTec, Quintauris, and Renesas strengthen automotive relevance. This is rational for a
              company of SiFive’s scale, but it also creates correlated dependency. If partners slow, reprioritize, or
