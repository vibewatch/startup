      - number: '2.5'
        title: Contradictions, Sizing Gaps, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The core contradiction is between the narrow market SiFive monetizes today and the much larger end markets
              it references strategically. A $1.9-$3.0 billion commercial RISC-V market can still support a large
              private company, but it does not by itself justify every datacenter-AI or automotive aspiration embedded
              in the pitch deck. Those bigger numbers become actionable only if SiFive can prove conversion into
              licensable CPU attach, royalty-bearing production, and partner-enabled deployment. Public sources do not
              provide the needed bridge metrics. There is no disclosed by-vertical revenue split, no win-rate data, no
              royalty waterfall, and no bottoms-up view of how much of a hyperscaler or OEM program SiFive captures once
              its IP is selected. Diligence should therefore preserve the TAM range, treat analyst share estimates
              cautiously, and push management for vertical revenue mix, active pipeline by buyer type, royalty
              concentration, and deployment milestones by market. Without those, any published SOM would look more like
              storytelling than underwriting.
            claimRefs:
              - CM016
              - CM031
              - CM035
              - CM040
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape by Buyer Job
        blocks:
          - type: paragraph
            body: >-
              SiFive should not be benchmarked only against other RISC-V startups. A chip company choosing CPU IP can
              solve the job in at least five ways: buy incumbent Arm infrastructure or automotive IP, buy commercial
              RISC-V IP from vendors such as SiFive, Codasip, Syntacore, and Andes-cited peers, source functionality
              from a vertically integrated RISC-V silicon company, continue using embedded substitutes from incumbent
              MCU or MPU vendors, or build more of the CPU stack internally. That breadth matters because different
              segments optimize for different criteria. Data-center and infrastructure teams care about performance,
              Linux readiness, and vendor trust. Automotive buyers care about safety, toolchains, and long support
              windows. Embedded buyers often care more about cost, qualification effort, and supply continuity than
              architectural ideology. In practice, SiFive competes less in a single neat category than at the
              intersection of openness, support, and time-to-market.
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP026
