            body: >-
              SiFive is capital-light relative to a chip manufacturer, but it is not inexpensive to operate. CPU design,
              verification, software tooling, safety work, customer field engineering, and ecosystem support all create
              substantial fixed-cost demands. The public record does not disclose COGS, gross margin, CAC, payback, or
              burn. That means the best public unit-economics conclusions are directional. Upside comes from repeated
              licensing and future royalties, which should carry strong incremental margins if design wins convert to
              production. Pressure comes from front-loaded commercial timing, lumpy program starts, and continuing
              ecosystem investment. In other words, the model can become beautiful, but the current public evidence does
