      - number: '8.5'
        title: Thesis-Break Triggers, Exit Context, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              SiFive is IPO-plausible, but not publicly underwritten to IPO quality. The company has enough scale,
              capital, and ecosystem relevance to keep an IPO path alive, yet the core items a fresh investor would
              want—audited revenue, gross margin, royalty-bearing cohort data, concentration, cap-table overhang, and
              cash runway—remain outside the public record. That is why valuation discipline matters more than story
              sympathy.


              The thesis breaks if the next financing still avoids hard price discovery, if actual revenue lands much
              closer to low-end estimates, or if current ecosystem proof fails to deepen into broader production proof.
              Conversely, the call improves quickly if management can substantiate revenue quality and royalty breadth.
              In other words, the missing evidence is unusually concentrated: a small number of diligence items would
              meaningfully move the valuation view.
            claimRefs:
              - CV023
