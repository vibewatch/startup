      - number: '3.2'
        title: Direct Peers and Incumbent Alternatives
        blocks:
          - type: paragraph
            body: >-
              The direct peer set inside commercial RISC-V includes Codasip and Syntacore, with Andes repeatedly cited
              in independent ecosystem analyses as a major Asian commercial RISC-V vendor. But Arm remains the decisive
              incumbent because it sells licensable CPU IP into many of the same customer workflows SiFive wants to win.
              Arm also brings public-company scale, extensive support surfaces, and a deeply rooted ecosystem that
              reduces perceived procurement risk. Qualcomm and Ventana-style developments matter as adjacent threats
              rather than perfect like-for-like peers: if major incumbents add serious RISC-V optionality to their
              roadmaps, SiFive could face future pressure from larger balance sheets and distribution engines. Microchip
              and Renesas matter mostly as substitutes in lower-power or embedded designs, not as direct matches in
              high-performance licensable CPU IP.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP017
              - CP026
      - number: '3.3'
        title: Capability, Packaging, and Pricing Comparison
        blocks:
          - type: paragraph
            body: >-
              Public pricing data for CPU IP is poor across the entire peer set. Most vendors disclose licensing
              frameworks, product families, and solution areas rather than rate cards or realized discounts. That means
              competitive comparison has to focus on packaging logic as much as on nominal price. Arm packages trust,
              continuity, and ecosystem density; SiFive packages commercial RISC-V breadth and configurability; Codasip
              and Syntacore compete around targeted catalogs and customization; vertically integrated players compete by
              delivering systems rather than IP; embedded incumbents compete with known supply chains and lower
              integration risk. The practical investor question is not whether SiFive is cheaper on paper, because
              public evidence rarely says that. It is whether SiFive can convert flexibility into premium contracts
              before CPU IP becomes structurally commoditized.
