      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes SiFive turns its current narrative into IPO-grade evidence. That means revenue moves
              clearly above today's debated range, Red Hat and similar enterprise efforts progress beyond preview
              status, and more named production programs demonstrate that royalties are broadening rather than remaining
              a thin option on future success. In that world, a $6B-$8.5B outcome is supportable.


              The base case is more modest. SiFive keeps proving strategic relevance, customer proof broadens slowly,
              and revenue ends up closer to the middle of public estimates than to either extreme. In that scenario, a
              $2.6B-$4.0B range looks more appropriate, which means the current round already discounts a good portion
              of the reasonable upside.


              The bear case does not require technology failure. It only requires that revenue quality disappoint,
              royalties lag, or the IPO window stay unforgiving. In that case, a down-round, structured financing, or
              strategic exit in the $0.8B-$1.6B range becomes plausible. The scenario math therefore supports a watchful
              stance rather than aggressive entry.
            claimRefs:
              - CV007
              - CV027
