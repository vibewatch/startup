      - number: '1.3'
        title: Capital Formation, Investor Base, and IPO Path
        blocks:
          - type: paragraph
            body: >-
              SiFive’s financing history shows a steady migration from venture-backed architecture bet to late-stage
              infrastructure platform. Official company releases document $8.5 million of Series B funding in 2017,
              $50.6 million of Series C in 2018, $65.4 million of Series D in 2019, $61 million of Series E in 2020,
              $175 million of Series F in 2022, and then the $400 million Series G in April 2026. When those official
              rounds are added together—and the Series B release’s implied earlier capital is included—the open-source
              record supports roughly $765.5 million of announced financing, closely matching the user-provided funding
              frame. That is materially lower than EE Times’ roughly $970 million total, suggesting third-party tallies
              are mixing in categories such as secondary liquidity, non-round capital, or other transaction-related
              proceeds. The discrepancy matters because valuation discipline looks different depending on which
              denominator investors use. Still, the direction of travel is unambiguous: Series F valued SiFive above
              $2.5 billion in 2022 and Series G lifted the post-money mark to $3.65 billion while explicitly framing the
              round as fuel for data-center CPU and AI-system expansion. Multiple sources, including 2022 and 2026
              independent coverage, also describe the company as marching toward IPO readiness rather than positioning
              for a near-term strategic sale.
