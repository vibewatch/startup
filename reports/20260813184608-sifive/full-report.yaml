        - $400M of fresh capital meaningfully extends strategic flexibility.
        - If another raise is needed before broader proof appears, this leg weakens.
      - - FADU and Red Hat show the company is past pure slideware
        - Named production-style and enterprise ecosystem references are real.
        - If proof does not broaden beyond these anchors, the narrative remains too narrow.
      - - Public revenue quality is still too opaque for high-conviction underwriting
        - Estimate dispersion, lumpy-revenue warnings, and absent audited metrics all point the same way.
        - Audited revenue, gross margin, and royalty-bearing cohort data would improve confidence.
      - - Arm is helpful but no longer a clean comp
        - Arm now sells its own AGI CPU and competes more directly across the ecosystem.
