        - Hold recommendation at track or worse.
      - - Enterprise ecosystem proof stalls
        - Red Hat / Linux enablement stays preview-like without broader production proof
        - Weakens premium narrative for enterprise adoption.
        - Lower bull probability and trim fair-value band.
      - - Comp pressure increases from larger platforms
        - Arm, NVIDIA, or other ecosystem leaders compress SiFive's strategic whitespace
        - Raises go-to-market risk and exit complexity.
