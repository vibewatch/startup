      - number: '3.4'
        title: Switching Costs, Multi-Homing, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Open RISC-V lowers architectural dependency but does not eliminate switching costs. Buyers still have to
              qualify toolchains, validate operating systems, prove safety behavior, and often commit to long product
              cycles. Those frictions make multi-homing possible in theory but rare in practice. This is especially true
              in automotive, where toolchain qualification and safety evidence can dominate the actual core decision.
              Arm therefore retains power not just because its architecture is familiar, but because its ecosystem
              reduces execution risk. SiFive’s answer is partner leverage: Linux, foundry, toolchain, and automotive
              platform partners can help close trust gaps without SiFive matching Arm’s balance sheet. Still, the
              distribution and support asymmetry remains material.
            claimRefs:
              - CP013
              - CP014
              - CP018
              - CP019
              - CP023
              - CP029
