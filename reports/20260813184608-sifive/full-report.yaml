  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Confidence, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              The correct frame for SiFive is price-sensitive, not company-quality-sensitive. The company looks real:
              its business model is coherent, it has raised a meaningful late-stage round, and its ecosystem proof
              extends beyond slideware. But the same evidence set that makes SiFive interesting also reveals why the
              current round should not be chased casually. Public estimates of revenue are too wide, no audited
              financials are visible, and the most important drivers of long-term value—royalty-bearing customer count,
              concentration, cash conversion, and margin structure—remain undisclosed.


              At $3.65B, the round can be argued as roughly fair only if the high-side revenue view is directionally
              correct and if license activity is already turning into a meaningful royalty flywheel. If the low-end view
              is closer to reality, the valuation is stretched. That asymmetry is enough to keep the current
              recommendation at Track. Confidence should remain medium-low, and risk should remain high, because the
              public record is better at proving strategic relevance than at proving present-day financial quality.
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV022
              - CV023
              - CV025
              - CV026
              - CV038
