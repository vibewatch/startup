evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, voting rights, and investor-control terms.
    whyItMatters: Control dynamics affect IPO readiness, minority protections, and strategic optionality.
    diligencePath: Request current cap table, board observer rights, voting agreements, and investor side letters from management.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology
    missingEvidence: A fully exhaustive public chronology including every hiring, governance, and product milestone.
    whyItMatters: >-
      The milestone table is intentionally limited to public events material to company formation and scale, not every
      corporate event.
    diligencePath: Expand the chronology after management provides a complete dated corporate timeline.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: private-financials
    missingEvidence: Audited or management-certified 2025 revenue, revenue mix, and royalty concentration.
    whyItMatters: Valuation underwriting depends on how much of revenue is recurring royalties versus upfront license fees.
    diligencePath: >-
      Request audited financial statements, cohort revenue mix, customer concentration, and royalty waterfall
      disclosures.
    relatedQuestionRefs:
      - QO014
  - type: conflicting-data
    severity: minor
    topic: funding-total
    missingEvidence: >-
      A management-reconciled lifetime funding schedule that explains the gap between official round math and media
      totals.
    whyItMatters: Different funding denominators can distort ownership dilution, cash efficiency, and valuation history.
    diligencePath: >-
      Ask finance to reconcile announced equity rounds, seed capital, secondaries, asset-sale proceeds, and any
      convertible instruments.
    relatedQuestionRefs:
      - QO007
  - type: conflicting-data
    severity: minor
    topic: hq
    missingEvidence: A single current corporate address and entity map for the parent and major subsidiaries.
    whyItMatters: Basic entity hygiene should be clean before IPO marketing, legal diligence, or key-customer contracting review.
    diligencePath: Request entity list, principal executive office, and jurisdiction-by-jurisdiction operating-subsidiary summary.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: material
    topic: som-model
    missingEvidence: By-vertical revenue mix, royalty waterfall, and conversion rates from evaluation to taped-out production programs.
    whyItMatters: >-
      Without those inputs, public TAM and SAM lenses cannot be converted into a defensible SiFive SOM or near-term
      revenue capture model.
    diligencePath: >-
      Request pipeline by buyer type, active design wins, expected royalty start dates, and historical conversion from
      proof-of-concept to production.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: risc-v-market-size-band
    missingEvidence: >-
      A single reconciled definition explaining the gap between Mordor’s 2026 RISC-V market size and Global Market
      Insights’ broader estimate.
    whyItMatters: Different scopes can overstate or understate SiFive’s current addressable market if used interchangeably.
    diligencePath: >-
      Ask management which external benchmark it uses internally and how it maps revenue to direct, adjacent, and
      strategic TAM layers.
    relatedQuestionRefs:
      - QM008
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: hyperscaler-conversion
    missingEvidence: Named hyperscaler design wins, paid evaluation milestones, and production-tapeout schedules.
    whyItMatters: >-
      Hyperscaler interest is a major part of the upside case, but evaluation without deployment does not prove revenue
      durability.
    diligencePath: Request customer names under NDA, program stage, committed spend, and attach to accelerators or full-CPU roles.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-map-partiality
    missingEvidence: An exhaustive list of all buyer archetypes and every regional go-to-market partner used by SiFive.
    whyItMatters: >-
      The buyer map intentionally focuses on the highest-consequence channels rather than every possible embedded or
      industrial segment.
    diligencePath: Expand the segmentation after management provides CRM exports and partner-program details.
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: win-rate-versus-competitors
    missingEvidence: Named competitive bake-offs, realized pricing, and win/loss rates versus Arm and direct RISC-V peers.
    whyItMatters: >-
      Without win/loss data, outside diligence cannot tell whether SiFive’s breadth converts into actual competitive
      power.
    diligencePath: Request CRM-coded competitive opportunities, realized pricing bands, and segment-level close rates.
    relatedQuestionRefs:
      - QP012
      - QP021
      - QP023
    relatedTableRefs:
      - TP003
      - TP004
  - type: enumeration-incomplete
    severity: minor
    topic: peer-roster
    missingEvidence: Complete peer roster including every regional and state-backed RISC-V IP vendor.
    whyItMatters: The chapter covers the most commercially relevant public classes rather than every emerging core vendor.
    diligencePath: Expand with region-by-region competitor mapping and procurement evidence.
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: minor
    topic: andes-scale
    missingEvidence: Primary-source scale disclosures for Andes in the exact period of this report.
    whyItMatters: Independent sources consistently mention Andes as a major vendor, but source quality on exact scale is mixed.
    diligencePath: Obtain public filings or investor materials for Andes and update scale comparisons.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: minor
    topic: multi-homing-frequency
    missingEvidence: Evidence on how often customers genuinely multi-source CPU IP or switch architectures mid-program.
    whyItMatters: Switching-cost conclusions are currently inference-heavy because public procurement narratives are sparse.
    diligencePath: Ask management for examples of competitive displacement, second-sourcing, and program migration timelines.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited revenue, gross margin, operating expense, cash, and burn disclosures.
    whyItMatters: Without them, no serious runway or valuation underwriting is possible.
    diligencePath: Request audited statements, monthly burn dashboard, and budget-vs-actual pack.
    relatedQuestionRefs:
      - QI003
      - QI013
      - QI014
      - QI022
    relatedTableRefs:
      - TI003
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: royalty-conversion
    missingEvidence: Customer-level progression from design win to tapeout to royalty-bearing production.
    whyItMatters: This is the most important bridge between SiFive’s attractive model and actual recurring revenue quality.
    diligencePath: Request cohort analysis of programs by stage, royalty start date, and lifetime value.
    relatedQuestionRefs:
