  topStrengths:
    - 由 RISC-V 共同发明者创立，至今仍是最清晰的 RISC-V CPU IP 纯商业化龙头。
    - 授权费加版税的 Arm 式模式不用背芯片厂制造包袱，规模化弹性有吸引力。
    - Series G 新增 $400M 资金，并引入 Atreides、NVIDIA、Apollo、T. Rowe Price 等重量级投资人。
    - 公开生态证据真实存在：FADU 已给出接近量产的部署，Red Hat / Ubuntu 也围绕 P550 平台做了适配。
    - SiFive 称其 IP 已进入 500+ 设计、出货 10B+ 核心，为 IPO 前的规模叙事提供了可信支撑。
  topRisks:
    - 公开资料无法验证经审计收入、毛利率、现金跑道，或真正产生版税的项目广度。
    - 当前估值高度依赖实际确认收入是否接近第三方估算高端；若收入低得多，估值支撑会迅速变弱。
    - 客户集中度和股权结构经济条款仍不透明，最终投资人回报可能因此大幅改写。
    - Arm 进入自研芯片后，竞争格局和最干净的公开可比公司都变得更复杂。
    - 生态进展有意义，但部分证据仍像预览阶段；伙伴推动的采用还不等于广泛、可重复的收入证明。
  unresolvedGaps:
    - FY2025/FY2026 经审计收入、毛利率和收入确认政策尚未公开。
    - 公开资料未披露活跃版税项目数量或头部客户集中度。
    - Series G 后的现金余额、烧钱速度、现金跑道和招聘计划没有披露。
    - 清算优先权、反稀释条款，以及近期任何老股清算价格均未公开。
    - 公开证据更能证明生态势能，却还撑不起 IPO 级别的信息披露、治理和重复客户经济性。
