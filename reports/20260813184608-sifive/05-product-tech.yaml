chapter:
  key: product-tech
  order: 5
  number: 5
  letter: E
  title: Product & Technology
  summary: 'SiFive’s product is a layered compute-IP platform: open-standard RISC-V
    cores and system IP, packaged into Performance, Intelligence, and Automotive families,
    then made usable through boards, OS enablement, foundry collaborations, and safety/toolchain
    partners. Public evidence shows real technical depth—RVA23-ready P570 cores, automotive
    safety packaging, AI vector/matrix engines, NVLink-adjacent integrations, and
    Linux ecosystem momentum on the HiFive Premier P550—but outside diligence still
    lacks independent benchmark breadth, field-reliability metrics, and named production
    deployments for the most ambitious data-center roadmap claims.'
sections:
- id: product-definition
  title: Product Definition and Portfolio Map
  body: 'SiFive does not primarily sell finished semiconductors. It sells licensable
    processor IP and adjacent system IP that customers integrate into their own SoCs.
    The public catalog is structured as families rather than individual one-off cores:
    Performance for application-class and infrastructure compute, Intelligence for
    AI vector and matrix acceleration, Automotive for safety-critical domains, and
    a broader RISC-V core portfolio that acts as the entry point. That portfolio logic
    matters because it explains why SiFive can appear in such different end products—from
    SSD controllers to developer boards to prospective AI-rack CPUs—without becoming
    a traditional fabless chip vendor. The company is effectively productizing architectural
    building blocks plus enough system IP and ecosystem scaffolding to make them deployable.'
  claimRefs:
  - CE001
  - CE002
  - CE009
  - CE029
  - CE030
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: architecture-workflow
  title: Architecture and Customer Workflow
  body: 'The product stack can be understood as a layered workflow. At the bottom
    is the open RISC-V ISA. Above that sit SiFive’s licensable core families, then
    system IP such as interrupt, security, and memory-management features, then operating-system
    and toolchain enablement, and finally customer-specific SoC integration. In practice,
    customers do not buy a shrink-wrapped chip; they choose a family, match it to
    a workload, integrate it with their own accelerators or peripherals, validate
    the software stack, and then ship silicon or a board. This is why the HiFive Premier
    P550 matters disproportionately to a company of SiFive’s size: it turns abstract
    IP into something that developers can boot, benchmark, test with Linux distributions,
    and use to de-risk later product programs.'
  claimRefs:
  - CE010
  - CE011
  - CE013
  - CE029
  - CE039
  tableRefs:
  - TE002
  - TE003
  figureRefs:
  - FE002
- id: differentiation
  title: Differentiation and Technical Depth
  body: 'SiFive’s differentiators are customization, standards alignment, and workload-specific
    compute blocks. The Performance family and P570 Gen 3 show the mainstream application-core
    side of that thesis: out-of-order execution, vector capability, RVA23 compliance,
    and security extensions in a power- and area-conscious profile. The P870-D extends
    that logic into data-center orchestration. The Intelligence line represents the
    AI-specific side, combining scalar control with vector and matrix compute plus
    software-first tooling and even bridge mechanisms for legacy ARM NEON-oriented
    code. Automotive is the trust-heavy side: deterministic compute, safety packages,
    and cybersecurity alignment. What SiFive does not appear to offer is a vertically
    integrated full product stack. Its edge is architectural flexibility and partner-enablement,
    not turnkey end-to-end AI systems.'
  claimRefs:
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE030
  - CE035
  - CE036
  figureRefs:
  - FE004
- id: deployment-integration
  title: Deployment, Integrations, and Commercial Proof
  body: 'Public product evidence is strongest where SiFive has either external ecosystem
    support or a concrete deployment artifact. The Red Hat collaboration places RHEL
    10 developer preview on the P550, Canonical and distro materials show Ubuntu and
    broader Linux support, and the Intel and Samsung announcements show how SiFive
    IP is meant to be inserted into broader foundry and accelerator workflows. NVLink
    Fusion matters for the same reason: it frames SiFive as part of a heterogeneous
    AI rack rather than a replacement for every incumbent component. The strongest
    concrete shipped-product proof is older but still valuable—FADU’s SSD controller
    and SSD products built on SiFive IP. The weaker zone is the most ambitious one:
    hyperscaler and agentic-data-center programs are strategically important, but
    public references remain anonymized and ahead of volume proof.'
  claimRefs:
  - CE012
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE026
  - CE027
  - CE028
  - CE031
