- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / Component
  - Role
  - Dependency
  - Risk
  rows:
  - - RISC-V ISA / profiles
    - Baseline instruction compatibility and standards layer
    - RVA23, ecosystem standardization, compiler support
    - Fragmentation or delayed standards uptake can slow adoption
  - - Core families (Performance / Intelligence / Automotive)
    - Primary CPU and compute IP blocks
    - SiFive roadmap and customer design-in
    - Performance claims may outpace public third-party validation
  - - System IP (AIA, IOMMU, WorldGuard, crypto)
    - Security, virtualization, interrupts, memory protection
    - Integration into customer SoC and software stack
    - Security posture depends on correct customer implementation
  - - OS and toolchain layer
    - Makes IP usable in practice
    - Red Hat, Canonical, HighTec, broader Linux ecosystem
    - Immature or partial support can stall deployments
  - - Foundry / board / silicon integration
    - Turns IP into physical silicon and dev hardware
    - Intel, Samsung, ESWIN, partner ASIC programs
    - Schedule, cost, or packaging dependencies can delay commercialization
  - - Accelerator / interconnect ecosystem
    - Links CPUs into AI and heterogeneous systems
    - NVIDIA NVLink and customer-specific accelerator IP
    - Value depends on partner support and customer workload fit
  notes: The product is best understood as a stack whose commercial value depends
    on third-party layers working in concert; SiFive does not control every layer
    directly.
