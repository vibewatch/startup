- id: TE004
  title: Trust / Quality / Compliance Table
  columns:
  - Control / Certification / Metric
  - Status
  - Scope
  - Gap
  rows:
  - - ISO 26262 functional-safety packages
    - Publicly claimed available
    - Automotive family and related customer programs
    - Public sources do not include program-by-program certification evidence
  - - ISO/SAE 21434 language
    - Publicly claimed aligned
    - Automotive cybersecurity workflows
    - No public field audit or incident history
  - - WorldGuard / secure branch prediction / vector crypto / IOMMU
    - Publicly documented features
    - Application and secure SoC design
    - Feature presence does not prove deployment quality
  - - Enterprise Linux support
    - Publicly demonstrated on dev platform
    - RHEL 10 preview, Ubuntu 24.04 and broader Linux ecosystem
    - Still not equivalent to multi-vendor production server certification
  - - Partner tooling ecosystem
    - Broad public roster
    - Compilers, RTOS, debug, EDA, automotive stacks
    - Partner support breadth is clearer than end-customer outcomes
  - - Reliability / uptime / support metrics
    - Not publicly disclosed
    - Field performance and customer support quality
    - Major diligence gap for underwriting mature supplier quality
  notes: The trust stack is better documented at the feature, certification, and ecosystem
    layer than at the field-operations layer.
