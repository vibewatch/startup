  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: field-reliability
    missingEvidence: Public uptime, defect, RMA, support-SLA, and field-failure metrics
      across shipped customer products.
    whyItMatters: Trust claims are a major part of the automotive and enterprise story,
      but outside diligence cannot yet verify them with public-company rigor.
    diligencePath: Request quality dashboards, post-silicon errata history, major
      customer support commitments, and safety-incident logs.
    relatedQuestionRefs:
    - QE022
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: named-datacenter-deployments
    missingEvidence: Named hyperscaler programs, current tapeout stage, benchmark
      environments, and production deployment timing for data-center products.
    whyItMatters: The boldest product upside sits in data center AI, but the public
      evidence remains anonymized and marketing-forward.
    diligencePath: Request NDAd customer list, benchmark methodology, and program
      stage from evaluation through production.
    relatedQuestionRefs:
    - QE007
    - QE017
    relatedTableRefs:
    - TE005
  - type: conflicting-data
    severity: minor
    topic: benchmark-independence
    missingEvidence: Independent third-party benchmarks reconciling SiFive’s performance
      claims across generations and against alternatives.
    whyItMatters: Public performance marketing can be directionally true yet still
      overstate practical deployment gains.
    diligencePath: Commission or request third-party benchmark reports and customer-reproduced
      workload results.
    relatedQuestionRefs:
    - QE006
    - QE017
  - type: enumeration-incomplete
    severity: minor
    topic: ecosystem-roster
    missingEvidence: A complete and current list of every OS, EDA, RTOS, compiler,
      and reference-design partner supporting each SiFive family.
    whyItMatters: The chapter intentionally focuses on the partners most material
      to Linux, foundry, automotive, and AI adoption.
    diligencePath: Expand using a current partner-program export and per-family support
      matrix.
