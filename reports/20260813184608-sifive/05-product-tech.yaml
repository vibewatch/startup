- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User Job
  - Current Workflow
  - SiFive Solution
  - Measurable Benefit
  - Limitation
  rows:
  - - Bring up enterprise Linux on RISC-V
    - Use dev board to validate kernel, distro, drivers, and apps
    - HiFive Premier P550 + RHEL/Ubuntu support
    - Reference platform for enterprise and cloud-oriented software enablement
    - Still a developer preview / board-level path, not mass server shipment
  - - Build AI/ML accelerator SoC
    - Combine CPU control cores with vector/matrix or custom accelerators
    - Intelligence family + Samsung/heterogeneous platform pathways
    - Customizable control plus AI-specific compute blocks
    - Independent benchmark and customer production data are limited
  - - Design data-center CPU/control plane silicon
    - Profile workloads and integrate CPU IP with rack-scale fabrics
    - Performance family + P870-D + NVLink Fusion pathway
    - Potential for customization and power-aware orchestration
    - Named hyperscaler deployments remain private
  - - Design automotive domain controller
    - Use safety-ready IP, certified tools, and partner software stacks
    - Automotive family + HighTec / Renesas / Quintauris ecosystem
    - Lower integration friction for safety and cybersecurity workloads
    - Production SOP timing and volumes not public
  - - Ship storage controller
    - Embed SiFive IP in custom controller firmware and silicon
    - E51-derived IP in FADU SSD controller
    - Commercial proof of shipped product and power/area benefits
    - Reference is dated and not necessarily representative of 2026 mix
  notes: Benefits are presented only where a source gives some concrete hardware,
    software, or commercial proof; many downstream ROI claims still need customer
    diligence.
