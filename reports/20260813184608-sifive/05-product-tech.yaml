- id: trust-quality-roadmap
  title: Trust, Compliance, and Roadmap Boundaries
  body: 'On trust and compliance, SiFive has done more public work than many semiconductor
    startups. Automotive materials repeatedly reference ISO 26262 functional-safety
    packages and ISO/SAE 21434 cybersecurity alignment, while the P570 materials add
    explicit security and virtualization building blocks relevant to secure application
    processors. The company also presents a surprisingly broad tooling ecosystem around
    safety, verification, and enterprise Linux. Still, the open-source record remains
    stronger on certifications and partner endorsements than on operational evidence.
    There are no public defect-rate series, field-failure statistics, or support-SLA
    disclosures that would let outside investors judge product quality the way they
    would judge a mature public supplier. Roadmap credibility is therefore good but
    not absolute: SiFive clearly has active releases and visible partners, yet its
    most aggressive data-center claims still require management diligence around benchmarks,
    customer stage, and deployment timing.'
  claimRefs:
  - CE022
  - CE023
  - CE024
  - CE025
