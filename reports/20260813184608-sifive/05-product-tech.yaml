    - SoC/application CPU designers
    - Mature and current
    - 64-bit OoO, vectors, scalable to high core counts
    - Independent benchmark breadth still limited in public view
  - - Intelligence family
    - AI/ML SoC architects
    - Mature IP family, evolving software stack
    - Vector + matrix compute with configurable interfaces
    - Public real-customer deployment detail remains sparse
  - - Automotive family
    - Auto semiconductor and Tier 1 engineers
    - Mature safety-oriented family
    - ASIL packages, cybersecurity alignment, deterministic compute
    - Need independent proof of production volumes and field use
  - - HiFive Premier P550 board
    - Kernel, distro, and application developers
    - Commercially available dev platform
    - Ubuntu-preinstalled Linux reference board
    - Board success does not by itself prove end-market production wins
  - - Foundry / integration reference platforms
    - Custom SoC teams
    - Program-specific
    - Intel and Samsung ecosystem pathways
    - Public details on customer adoption are thin
  - - Partner-enabled ecosystem assets
    - Compiler, OS, and safety users
    - Active and expanding
    - Red Hat, HighTec, Quintauris, Renesas and others reduce friction
    - Partner logos do not equal shipped revenue without win data
  notes: Maturity is judged from public product availability, current releases, and
    visible ecosystem support; it does not imply independent validation of every performance
    or reliability claim.
