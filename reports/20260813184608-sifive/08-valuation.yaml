- id: comparable-valuation-framework
  title: Comparable Valuation Framework
  body: 'A comparable-based method is necessary, but the comp set has to be handled carefully. Arm is still the closest business-model analogue because licensing-plus-royalty economics are much closer to SiFive''s than to AMD''s or Marvell''s. However, Arm''s own 2026 expansion into silicon products means its market cap now reflects more than pure licensing economics. Qualcomm is useful for demonstrating the power and risk of a royalty-bearing semiconductor model at scale, especially around concentration. AMD, Marvell, and NVIDIA are less direct business-model matches, but they show that public AI compute and infrastructure multiples remain elevated for scaled winners.


    Private AI chip comparables confirm that investors still pay up for scarcity. But Cerebras and SambaNova are not CPU-IP licensing businesses; they are closer to full-stack AI compute stories. Their headline valuations support the idea that SiFive is not obviously overpriced simply because it sits at $3.65B. They do not prove that the current price is attractive for fresh capital.'
