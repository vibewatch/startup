  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure-waterfall
    missingEvidence: Liquidation preferences, anti-dilution protections, secondary-clearing reference points, and common-equity waterfall math.
    whyItMatters: Enterprise-value scenario bands can materially overstate realized fresh-money returns if senior securities or structure sit ahead of common.
    diligencePath: Request cap table, preferred stock term sheets, and any recent secondary transaction reference pricing.
    relatedQuestionRefs:
    - QV027
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: royalty-bearing-cohorts-and-concentration
    missingEvidence: Number of active royalty-bearing programs, top-customer share, stage progression from design win to shipment, and renewal/expansion dynamics.
    whyItMatters: This is the key bridge between ecosystem proof and durable economics, and it directly determines whether the current round is fair or stretched.
    diligencePath: Request cohort revenue tables, largest-customer concentration, and program-stage funnel reporting.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: enumeration-not-fully-public
    severity: minor
    topic: TV004 comparable set is intentionally sampled rather than exhaustive
    missingEvidence: A fully normalized public/private comparable universe with consistently disclosed revenue, margin, growth, and capital-structure data for all RISC-V, CPU-IP, and AI semiconductor peers.
    whyItMatters: No single exhaustive list would be decision-useful because most candidates are not business-model matches and many private peers lack consistent disclosure.
    diligencePath: Expand the comp set only after obtaining private-company financial disclosure or a narrower deal-specific peer list from management and bankers.
    relatedQuestionRefs:
    - QV007
    - QV012
    - QV013
    relatedTableRefs:
    - TV004
