- id: thesis-and-anti-thesis
  title: Thesis and Anti-Thesis
  body: 'The positive thesis has four legs. First, SiFive occupies a strategically valuable layer of the stack: CPU IP and RISC-V enablement rather than commodity board assembly. Second, the company has raised enough capital to keep investing in data-center-class roadmap work. Third, FADU and the Red Hat relationship demonstrate that SiFive has progressed past pure concept-stage ecosystem marketing. Fourth, the broader market is clearly rewarding scarce AI and compute infrastructure assets, including IP-heavy businesses.


    The anti-thesis is equally important. The best public proof remains ecosystem proof, not recurring royalty proof. Sacra''s front-loaded revenue warning is exactly the sort of issue that can make a round look fine on paper and too rich in hindsight. Arm''s move into first-party silicon also complicates the competitive and comp picture: the most obvious public analogue is becoming less neutral and more aggressive. The result is a company that deserves continued attention, but not valuation complacency.'
