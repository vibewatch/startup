- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence
  - What would change the view
  rows:
  - - SiFive occupies a valuable CPU-IP layer in an open RISC-V ecosystem
    - Business-model and funding sources consistently frame SiFive as an Arm-like licensing company.
    - Proof that customers are not converting to royalties would weaken this sharply.
  - - Series G gives SiFive time to pursue a bigger data-center and enterprise opportunity
    - $400M of fresh capital meaningfully extends strategic flexibility.
    - If another raise is needed before broader proof appears, this leg weakens.
  - - FADU and Red Hat show the company is past pure slideware
    - Named production-style and enterprise ecosystem references are real.
    - If proof does not broaden beyond these anchors, the narrative remains too narrow.
  - - Public revenue quality is still too opaque for high-conviction underwriting
    - Estimate dispersion, lumpy-revenue warnings, and absent audited metrics all point the same way.
    - Audited revenue, gross margin, and royalty-bearing cohort data would improve confidence.
  - - Arm is helpful but no longer a clean comp
    - Arm now sells its own AGI CPU and competes more directly across the ecosystem.
    - If Arm's silicon move fails, it becomes a cleaner licensing reference again.
  - - Private AI chip premiums do not automatically justify SiFive's mark
    - Cerebras and SambaNova are larger, fuller-stack AI compute stories.
    - If SiFive proves equivalent scarcity and scale, transferability improves.
  notes: 'The thesis and anti-thesis are symmetrical on purpose: SiFive looks strategically important, but public evidence still leaves real valuation risk.'
