company:
  name: SiFive
chapter:
  number: 8
  title: Valuation
  summary: SiFive is a credible RISC-V CPU IP company with meaningful ecosystem momentum, but the April 2026 $3.65B Series G leaves limited room for public-evidence error. If the high-side $298M revenue estimate is roughly right, the round implies about 12x revenue—defensible for a scarce late-private semiconductor IP asset. If actual recognized revenue is materially lower or royalties are not converting, the same price quickly looks stretched. Because public evidence is still much stronger on strategy, fundraising, and partners than on audited revenue, royalty-bearing customer breadth, and cash efficiency, the right call at this price is Track with medium-low confidence rather than a fresh full-price entry.
sections:
- id: recommendation-confidence-stance
  title: Recommendation, Confidence, and Valuation Stance
  body: 'The correct frame for SiFive is price-sensitive, not company-quality-sensitive. The company looks real: its business model is coherent, it has raised a meaningful late-stage round, and its ecosystem proof extends beyond slideware. But the same evidence set that makes SiFive interesting also reveals why the current round should not be chased casually. Public estimates of revenue are too wide, no audited financials are visible, and the most important drivers of long-term value—royalty-bearing customer count, concentration, cash conversion, and margin structure—remain undisclosed.


    At $3.65B, the round can be argued as roughly fair only if the high-side revenue view is directionally correct and if license activity is already turning into a meaningful royalty flywheel. If the low-end view is closer to reality, the valuation is stretched. That asymmetry is enough to keep the current recommendation at Track. Confidence should remain medium-low, and risk should remain high, because the public record is better at proving strategic relevance than at proving present-day financial quality.'
