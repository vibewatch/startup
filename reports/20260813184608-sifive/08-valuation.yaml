- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Signal / indicator
  - Transmission to thesis
  - Action implication
  rows:
  - - Another opaque financing round
    - New capital without hard revenue disclosure or convincing price discovery
    - Suggests Series G bought time but not proof.
    - Re-rate the valuation stance from full to stretched / avoid.
  - - Revenue reality lands near low-end estimates
    - Diligence or future filing implies revenue much closer to sub-$100M than to $250M-$300M
    - Explodes implied multiple and weakens IPO credibility.
    - Pass at current price; revisit only after reset.
  - - Royalty conversion remains thin
    - Few or no broadened royalty-bearing production programs
    - Turns the model into an option on future scale rather than evidence of current economics.
    - Hold recommendation at track or worse.
  - - Enterprise ecosystem proof stalls
    - Red Hat / Linux enablement stays preview-like without broader production proof
    - Weakens premium narrative for enterprise adoption.
    - Lower bull probability and trim fair-value band.
  - - Comp pressure increases from larger platforms
    - Arm, NVIDIA, or other ecosystem leaders compress SiFive's strategic whitespace
    - Raises go-to-market risk and exit complexity.
    - Demand higher margin of safety.
  notes: These are external or diligence-observable triggers designed for quarterly re-underwriting.
  claimRefs:
  - CV021
  - CV030
  - CV031
  - CV032
  - CV033
  - CV039
  - CV042
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited revenue and gross margin
    - Verified FY2025/FY2026 revenue, recognition policy, and gross-margin bridge
    - This is the single biggest confidence unlock for the current valuation.
    - CFO / auditor materials in data room.
  - - Royalty-bearing cohort detail
    - Count of active royalty-bearing programs, largest customers, and stage progression from design win to shipment
    - Needed to judge whether royalties are emerging or still mostly future optionality.
    - Finance + sales cohort analysis.
  - - Cash and runway
    - Post-Series-G cash balance, burn, hiring plan, and runway by scenario
    - Valuation comfort improves materially if capital adequacy is truly strong.
    - Board pack / management model.
  - - Preference and waterfall terms
    - Liquidation preferences, anti-dilution, secondary pricing, and common-equity economics
    - Fresh-money returns can diverge from enterprise-value math.
    - Legal docs and cap-table export.
  - - IPO readiness package
    - Auditor readiness, governance cleanup, segment disclosures, and timing assumptions
    - Needed to tell a plausible IPO path from a perpetual pre-IPO story.
    - CFO / counsel diligence session.
  - - Commercial proof expansion
    - Additional named production customers and partner-backed design wins
    - Would reduce concentration risk and support a higher confidence multiple.
    - Sales reference calls and customer proof pack.
  notes: These are the minimum diligence items required before paying full late-stage pricing with conviction.
