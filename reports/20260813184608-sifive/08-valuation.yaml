- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: sample
    basis: Selected to bracket SiFive with the most decision-useful public and private comps rather than enumerate every semiconductor peer.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Arm Holdings
    - Public CPU-IP licensor / platform
    - ~$297.6B market cap (Aug 2026)
    - Closest model comp for licensing-plus-royalty economics.
    - Now moving into first-party silicon, so not a pure licensing analogue anymore.
  - - Qualcomm
    - Public chip + licensing hybrid
    - ~$173.0B market cap; FY2025 revenue ~$38.4B
    - Shows how royalties plus chips can scale, and why concentration still matters.
    - Mobile-heavy mix and far greater scale reduce direct comparability.
  - - AMD
    - Public compute semiconductor
    - ~$788.5B market cap; FY2025 revenue ~$34.6B
    - Useful upper-end read-through for public AI compute appetite.
    - Not an IP-licensing business; product economics differ materially.
  - - Marvell
    - Public AI/custom-silicon infrastructure
    - ~$199.4B market cap
    - Useful data-center infrastructure anchor below NVIDIA's software moat.
    - Custom-silicon and networking exposure is not a CPU-IP royalty model.
  - - NVIDIA
    - Public AI platform leader
    - ~$5.456T market cap; FY2026 revenue ~$215.9B
    - Shows how much value software plus compute leadership can create.
    - Too dominant and integrated to anchor SiFive entry pricing directly.
  - - Cerebras
    - Late-private AI hardware
    - $8.1B Series G (Sep 2025)
    - Confirms continued scarcity premiums for AI-semiconductor names.
    - Full-stack AI compute story, not CPU-IP licensing.
  - - SambaNova
    - Late-private AI hardware
    - $11B valuation (Jul 2026)
    - Another marker that private AI chip capital remains available at premium marks.
    - Business model and scale differ materially from SiFive.
  notes: The table is directional rather than precise. It intentionally mixes business-model comps with market-context comps because no single clean public analogue exists.
