- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Implied valuation range
  - Core assumptions
  - Probability signal
  - What breaks first if wrong
  rows:
  - - Bear
    - $0.8B-$1.6B
    - Actual recognized revenue is near the low end of public estimates; royalties remain delayed; IPO window stays selective; a structured round or strategic sale sets price.
    - Meaningful
    - The headline valuation resets before the company narrative does.
  - - Base
    - $2.6B-$4.0B
    - Revenue proves closer to the mid-range; ecosystem proof broadens gradually; no major financial shock; IPO story stays alive but not premium-priced.
    - Highest
    - The current round already captures much of the realistic value band.
  - - Bull
    - $6.0B-$8.5B
    - Verified revenue moves clearly above current debate, royalty-bearing programs broaden, enterprise support hardens, and IPO-grade disclosure arrives.
    - Lower
    - Requires much better proof than the public record currently shows.
  notes: These are scenario bands, not DCF outputs. Common-equity outcomes could be worse if preferences or other structure terms are unfavorable.
