  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology
    missingEvidence: A fully exhaustive public chronology including every hiring, governance, and product milestone.
    whyItMatters: The milestone table is intentionally limited to public events material to company formation and scale, not every corporate event.
    diligencePath: Expand the chronology after management provides a complete dated corporate timeline.
    relatedTableRefs:
    - TO004
  - type: private-evidence-only
    severity: material
    topic: private-financials
    missingEvidence: Audited or management-certified 2025 revenue, revenue mix, and royalty concentration.
