company:
  name: SiFive
chapter:
  number: 1
  title: Company Overview
  summary: SiFive is a RISC-V processor IP company founded by the ISA’s inventors and now led by Patrick Little as it prepares for IPO readiness. Official sources confirm a $400 million Series G in April 2026 at a $3.65 billion valuation, a licensing-plus-royalty model, more than 500 designs using its IP, and a pivot toward AI data-center CPUs, while open-source diligence still leaves exact revenue, board control, and even headquarters-city details only partially resolved.
sections:
- id: identity-business-model
  title: Identity, Founding Story, and Business Model
  body: 'SiFive’s core identity is unusually strategic in semiconductors: it was founded in 2015 by Krste Asanovic, Yunsup Lee, and Andrew Waterman, the same Berkeley team credited with creating RISC-V in 2010. That origin matters because SiFive does not sell a commodity CPU or finished chip; it sells commercial implementations of an open standard that customers can license, customize, and integrate into their own silicon. The company’s own business-model page makes the revenue mechanics explicit: SiFive provides proprietary RISC-V processor IP, receives upfront licensing fees, and also collects downstream royalties tied to customer chip sales. Its public portfolio now spans Essential embedded cores, Intelligence vector and matrix AI products, Performance application processors, and Automotive offerings. That mix positions SiFive closer to Arm’s IP-licensing model than to a fabless product vendor, but with greater emphasis on architectural customization, open-standard alignment, and workload-specific
    co-design. The public website still leaves some ambiguity on the exact corporate center of gravity: recent press releases use Santa Clara datelines, the locations page lists Berkeley and other global offices, and older third-party profiles still point to San Mateo. For diligence purposes, Silicon Valley is the cleanest current descriptor, and the unresolved city-level discrepancy is better treated as a disclosure-quality issue than as a thesis point.'
