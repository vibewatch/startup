- id: milestones-ecosystem-and-footprint
  title: Operational Footprint, Ecosystem Proof, and Key Milestones
  body: 'Recent milestones show SiFive trying to convert standards leadership into ecosystem lock-in. The company says 2025 was a record-growth year, its IP sits in more than 500 designs, and over 10 billion SiFive-based cores have shipped. Public roadmap signals reinforce the same story: the P870-D targets data-center CPU orchestration, NVLink Fusion links future SiFive platforms into NVIDIA-centric AI systems, Red Hat chose the HiFive Premier P550 as its initial RHEL 10 RISC-V target, and Ubuntu ships preinstalled on the same board. Automotive proof points are similarly partner-led rather than customer-disclosed, with Renesas, HighTec, and Quintauris all announcing work tied to safety, zonal architectures, or next-generation vehicle compute. Geography also supports the scale thesis. SiFive’s locations page lists offices across the United States, Europe, India, China, Japan, Korea, Taiwan, and the United Kingdom, while Revelio still sees a workforce above 580 even after a post-2023 downsizing
    cycle. The weak spot is that exact revenue and headcount remain private. Third-party estimates are directionally useful but inconsistent, so the right conclusion is not that SiFive lacks scale; it is that public-market-grade operating disclosure has not arrived yet.'
