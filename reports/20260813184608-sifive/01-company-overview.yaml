- id: leadership-governance
  title: Leadership, Founder Continuity, and Governance Visibility
  body: 'Founder continuity remains one of SiFive’s strongest signaling assets. Patrick Little is the current chairman, president, and CEO, while Krste Asanovic remains publicly identified as co-founder and chief architect and Yunsup Lee continues to appear as co-founder and CTO in current official materials. Andrew Waterman remains part of the public founder narrative, reinforcing that the company still trades on direct proximity to the RISC-V standards story rather than on a later financial or operating rewrite. That founder-market fit is valuable in CPU IP, where customers care about ISA direction, software compatibility, and long-horizon roadmap credibility. At the same time, governance transparency is weaker than the operating story. Open sources do not provide a clean current board roster, voting structure, or investor-rights map that would let outside diligence assess control dynamics with confidence. The available evidence is mostly indirect: named investors appear in funding announcements,
    legal hire announcements emphasize IPO and M&A experience, and strategic partners continue to show up in product and ecosystem milestones. That is enough to say the company is institutionally backed and building toward public-company discipline, but not enough to reconstruct who actually governs it today.'
