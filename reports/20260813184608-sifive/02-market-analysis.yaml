- id: sizing-lenses
  title: Sizing Lenses — Broad RISC-V TAM vs. Adjacent Market Pools
  body: 'Public sizing data supports multiple, non-interchangeable lenses. At the
    narrowest level, Mordor projects the RISC-V technology market at $1.89 billion
    in 2026 growing to $10.62 billion by 2031, while Global Market Insights puts the
    broader 2026 market at $3.0 billion after a $2.3 billion 2025 base. Those are
    useful for benchmarking the commercial RISC-V opportunity itself. But SiFive’s
    strategic narrative reaches beyond that narrow pool. Its Series G press release
    frames next-generation AI and agentic data-center infrastructure as a $100 billion-plus
    opportunity, while SiFive’s own materials highlight hyperscaler CPU orchestration,
    vector compute, and NVLink-adjacent deployments. Automotive is another key adjacent
    pool: Future Market Insights estimates the 2026 automotive semiconductor market
    at $76.0 billion, of which processors represent 27%, or roughly $20.5 billion.
    These figures should not be collapsed into a single TAM because they measure different
    scopes: commercial RISC-V revenue, adjacent infrastructure budgets, and processor-heavy
    application domains. The disciplined conclusion is that SiFive has a small current
    monetized core market embedded inside much larger compute-spend categories that
    could expand its SAM over time.'
  claimRefs:
  - CM006
  - CM010
  - CM011
  - CM012
  - CM014
