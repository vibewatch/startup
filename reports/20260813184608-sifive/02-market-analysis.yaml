  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: som-model
    missingEvidence: By-vertical revenue mix, royalty waterfall, and conversion rates
      from evaluation to taped-out production programs.
    whyItMatters: Without those inputs, public TAM and SAM lenses cannot be converted
      into a defensible SiFive SOM or near-term revenue capture model.
    diligencePath: Request pipeline by buyer type, active design wins, expected royalty
      start dates, and historical conversion from proof-of-concept to production.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: minor
    topic: risc-v-market-size-band
    missingEvidence: A single reconciled definition explaining the gap between Mordor’s
      2026 RISC-V market size and Global Market Insights’ broader estimate.
    whyItMatters: Different scopes can overstate or understate SiFive’s current addressable
      market if used interchangeably.
    diligencePath: Ask management which external benchmark it uses internally and
      how it maps revenue to direct, adjacent, and strategic TAM layers.
    relatedQuestionRefs:
    - QM008
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: hyperscaler-conversion
    missingEvidence: Named hyperscaler design wins, paid evaluation milestones, and
      production-tapeout schedules.
    whyItMatters: Hyperscaler interest is a major part of the upside case, but evaluation
      without deployment does not prove revenue durability.
    diligencePath: Request customer names under NDA, program stage, committed spend,
      and attach to accelerators or full-CPU roles.
    relatedQuestionRefs:
    - QM005
    relatedTableRefs:
    - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-map-partiality
    missingEvidence: An exhaustive list of all buyer archetypes and every regional
      go-to-market partner used by SiFive.
    whyItMatters: The buyer map intentionally focuses on the highest-consequence channels
      rather than every possible embedded or industrial segment.
    diligencePath: Expand the segmentation after management provides CRM exports and
      partner-program details.
    relatedTableRefs:
    - TM003
