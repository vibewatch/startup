- id: gaps-and-contradictions
  title: Contradictions, Sizing Gaps, and Diligence Asks
  body: The core contradiction is between the narrow market SiFive monetizes today
    and the much larger end markets it references strategically. A $1.9-$3.0 billion
    commercial RISC-V market can still support a large private company, but it does
    not by itself justify every datacenter-AI or automotive aspiration embedded in
    the pitch deck. Those bigger numbers become actionable only if SiFive can prove
    conversion into licensable CPU attach, royalty-bearing production, and partner-enabled
    deployment. Public sources do not provide the needed bridge metrics. There is
    no disclosed by-vertical revenue split, no win-rate data, no royalty waterfall,
    and no bottoms-up view of how much of a hyperscaler or OEM program SiFive captures
    once its IP is selected. Diligence should therefore preserve the TAM range, treat
    analyst share estimates cautiously, and push management for vertical revenue mix,
    active pipeline by buyer type, royalty concentration, and deployment milestones
    by market. Without those, any published SOM would look more like storytelling
    than underwriting.
  claimRefs:
  - CM016
  - CM031
  - CM035
  - CM040
