chapter:
  key: market-analysis
  order: 2
  number: 2
  letter: M
  title: Market Analysis
  summary: SiFive participates in a small-but-fast-growing commercial RISC-V market
    nested inside much larger adjacent compute budgets. Third-party analysts size
    the 2026 RISC-V market at roughly $1.9B-$3.0B, with data-center and automotive
    segments growing above 40% CAGR, while company and partner materials show that
    SiFive’s realistic buyers are hyperscaler silicon teams, semiconductor vendors,
    Tier 1s, and OEM platform owners rather than end users. The upside is strong secular
    growth and sovereignty tailwinds; the limits are software maturity, standards
    fragmentation, and the fact that SiFive only captures the licensable CPU-IP slice
    of much larger markets.
sections:
- id: market-boundary
  title: Market Boundary, Included Spend, and Status-Quo Substitutes
  body: 'SiFive should be analyzed first as a processor-IP supplier, not as a seller
    of merchant CPUs, servers, or automotive modules. Its own business-model and portfolio
    materials make that explicit: the company licenses RISC-V cores and subsystems,
    collects upfront fees, and participates in downstream customer success through
    royalties. That means included spend is the licensable CPU, subsystem, and software-enablement
    layer inside customer SoCs. Excluded spend is most of the downstream semiconductor
    and infrastructure stack: GPUs, HBM, networking switches, packaging, chassis,
    power distribution, and finished devices. The addressable verticals are nonetheless
    broad. Official market pages position SiFive across data centers, AI/ML, automotive,
    edge/embedded, consumer, storage, and aerospace/defense. In cloud infrastructure,
    the status-quo substitute is Arm Neoverse and incumbent x86 server CPUs; in safety
    and body compute, the substitute is still proprietary or Arm-based automotive
    compute. The right market question is therefore not “how big is semiconductors?”
    but “how much compute and control silicon will buyers license or co-design in
    forms where open-standard CPU IP is strategically valuable?”'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
