companyProfile:
  summary: >-
    SiFive is a late-stage private semiconductor company founded in 2015 by RISC-V architects Krste
    Asanovic, Yunsup Lee, and Andrew Waterman to commercialize RISC-V processor IP. The company sells
    configurable CPU cores and related platform enablement across embedded, automotive, AI/ML, storage,
    and data-center use cases through an Arm-like licensing-plus-royalty model. Public sources support
    meaningful scale—500+ designs, 10B+ shipped cores, a $400M Series G at $3.65B valuation, and real
    ecosystem proof from FADU, Red Hat, Ubuntu, and other partners—but still do not disclose audited
    revenue, margins, cash runway, or royalty-bearing customer concentration.
  foundedDate: '2015-01-01'
  founders:
    - name: Krste Asanovic
      role: Co-founder and Chief Architect
      background: Co-creator of RISC-V and the public technical face of SiFive's architecture strategy.
      claimRefs: [CO001, CO004]
    - name: Yunsup Lee
      role: Co-founder and CTO
      background: Berkeley RISC-V pioneer and current technical executive tied to SiFive's product roadmap.
      claimRefs: [CO001, CO005]
    - name: Andrew Waterman
      role: Co-founder
      background: Publicly credited as a founder of both RISC-V and SiFive, reinforcing the company's standards origin.
      claimRefs: [CO001, CO006]
  foundingLocation: Berkeley, CA, USA
  headquarters: San Jose, CA, USA
  productSummary: >-
    Commercial RISC-V processor IP spanning Essential, Intelligence, Performance, and Automotive core
    families, plus development boards, software enablement, and partner integrations for Linux, Red Hat,
    Ubuntu, storage, automotive, and AI infrastructure use cases.
  customerFocus: >-
    Semiconductor companies, hyperscalers and custom-silicon teams, automotive Tier 1s and OEM
    ecosystems, storage/device makers, and developers using boards and software stacks as a funnel into
    future design wins.
  businessModel: >-
    Upfront IP license fees, downstream royalties tied to customer chip shipments, and associated
    engineering/software enablement that helps customers bring RISC-V-based products to market.
  stage: late-stage private
  fundingStatus: >-
    $400M Series G in April 2026 at a $3.65B post-money valuation, with roughly $766M+ of publicly
    disclosed cumulative funding across Series B through Series G history.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO005, CO006, CO007, CO008, CO013, CO018, CO019, CO025, CO036, CO037, CU009]
summary:
  headline: >-
    SiFive is the leading late-stage commercializer of RISC-V CPU IP, but the $3.65B Series G still
    prices in revenue quality and royalty conversion that public sources cannot yet verify.
