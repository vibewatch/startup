  - - Syntacore
    - Direct RISC-V IP peer
    - Private; configurable silicon-proven portfolio public
    - Embedded through Linux-capable application-class cores
    - Broad IP range with Linux-capable and MCU-class options
    - Public scale and customer proof are limited
  - - Andes Technology
    - Direct RISC-V IP peer
    - Frequently cited as one of the largest commercial RISC-V vendors in Asia
    - Embedded, wearables, automotive, low-power applications
    - Commercial maturity in lower-power and regional deployment
    - Public source quality on exact scale and price remains mixed
  - - Qualcomm / Ventana optionality
    - Adjacent entrant
    - Large incumbent systems company with custom CPU programs
    - Client, edge, and possible future high-performance RISC-V integration
    - Balance sheet, distribution, custom CPU expertise
    - Not currently a direct licensable CPU IP catalog peer
  - - Esperanto
    - Vertically integrated RISC-V alternative
    - Private system company selling RISC-V compute systems
    - AI/HPC systems and server inference
    - Ships systems rather than just IP
    - Different business model limits apples-to-apples comparison
  - - Renesas / Microchip
    - Status-quo substitute in embedded
    - Large public/semi-scale embedded incumbents
    - MCU/MPU, industrial, automotive embedded
    - Known support, qualification, and channel depth
    - Not the same buyer job as high-performance licensable CPU IP
  notes: Rows intentionally mix direct peers, incumbents, adjacents, and substitutes
    because buyers do the same.
