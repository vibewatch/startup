      gap
    - Medium
    - Request pipeline by segment and proof of win rate versus named rivals
  - - Open RISC-V positioning
    - Arm retains toolchain and ecosystem leadership despite less openness
    - High
    - Track enterprise and automotive software-validation milestones
  - - Partner-led trust bridge
    - Shared ecosystem partners may reduce differentiation if every vendor gains the
      same support layer
    - Medium
    - Ask which partners are exclusive, preferred, or broadly shared
  - - Flexibility versus internal build
    - Large customers may choose internal CPU design instead of buying licensable
      IP
    - Medium
    - Request examples where SiFive beat internal-build decisions on time-to-market
  - - Future optionality in AI / data center
    - Larger entrants like Qualcomm or systems vendors may adopt RISC-V and compress
      margins
    - High
    - Monitor new RISC-V M&A, custom-CPU roadmaps, and hyperscaler in-house moves
  - - Automotive long-cycle royalties
    - Safety/toolchain qualification may favor incumbents or other specialized vendors
    - Medium
    - Request audited automotive design-win funnel and partner dependency map
  notes: Severity reflects SiFive-specific moat durability, not category excitement.
