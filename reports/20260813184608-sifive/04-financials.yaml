- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Audited revenue by year and by stream
    - Blocks valuation and trend analysis
    - Obtain audited financial statements and stream-level revenue bridge
  - - Gross margin and COGS by stream
    - Prevents margin-path underwriting
    - Request gross margin and direct-cost allocation policy
  - - Royalty-bearing customer count and ramp timing
    - Blocks recurring-revenue quality assessment
    - Request customer cohort file showing pre-production vs royalty-active programs
  - - Cash on hand and monthly burn
    - Prevents real runway analysis
    - Request monthly cash walk and budget vs actuals
  - - Bookings / backlog / recognition bridge
    - Obscures commercial momentum quality
    - Request signed contracts, bookings, billings, and revenue bridge
  - - Customer concentration and top-account economics
    - Links directly to revenue durability and pricing power
    - Request top-10 customer revenue share and renewal / expansion behavior
  notes: These are the minimum data-room asks needed to convert the chapter from risk
    staging to underwriting.
