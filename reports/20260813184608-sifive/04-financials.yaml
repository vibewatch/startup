  rows:
  - - IP license fees
    - Upfront commercial access to CPU IP and collateral
    - Per program / agreement
    - Clearly part of the model; public pricing undisclosed
    - Medium-High
    - Request average deal size, timing, and segment mix
  - - Royalties
    - Per-unit revenue when customer chips ship in volume
    - Per chip / core / shipment basis
    - Economically central but publicly undisclosed
    - High if scaled
    - Request royalty rate structure and active royalty-bearing customers
  - - Engineering / enablement services
    - Integration, verification, and support attached to programs
    - Per milestone / engagement
    - Likely meaningful but not broken out
    - Medium
    - Request services revenue, margin, and attach rate
  - - Developer boards / channels
    - Board sales through SiFive and distribution partners
    - Per board unit
    - Publicly visible but likely small relative to IP
    - Low as core revenue, high as funnel value
    - Request units sold, contribution margin, and conversion to design wins
  - - Software / ecosystem support
    - Linux, distro, and partner enablement that supports adoption
    - Strategic investment rather than clear product SKU
    - Visible in partner announcements
    - Strategic rather than clearly monetized
    - Request whether any of this is reimbursed, bundled, or separately sold
  notes: The table distinguishes economic engines from adoption enablers.
