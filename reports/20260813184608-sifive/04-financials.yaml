  - - Gross margin
    - Not publicly disclosed
    - low
    - Tests whether the licensing model is already scaling economically
    - Request blended gross margin and by-stream margins
  - - Royalty share of revenue
    - Not publicly disclosed
    - low
    - Distinguishes recurring maturity from front-loaded license dependence
    - Request royalty vs license vs services split
  - - CAC / payback
    - Not publicly disclosed
    - low
    - Tests sales efficiency and funnel quality
    - Request enterprise sales cycle, CAC, and payback by segment
  - - Margin potential
    - High in theory if royalty mix rises
    - medium
    - Supports upside case for the model
    - Show royalty-bearing cohorts and expansion economics
  - - Revenue lumpiness risk
    - Material based on model structure
    - medium
    - Explains volatility and financing dependence
    - Show quarterly bookings, billings, and recognized revenue bridge
