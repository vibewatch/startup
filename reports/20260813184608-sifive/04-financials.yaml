- id: TI004
  title: Capital adequacy table
  columns:
  - Metric
  - Value / status
  - Implication
  - Diligence ask
  rows:
  - - Total funding from disclosed rounds
    - ~$765.5M official-round math before external roll-up framing
    - Shows meaningful historical equity support
    - Reconcile official round math to cap-table cash actually received
  - - Series G raise
    - +$400M in April 2026
    - Improves near-term capital flexibility materially
    - Request post-close cash balance and fees/net proceeds
  - - Series G valuation
    - $3.65B
    - Raises expectation for revenue quality and IPO readiness
    - Request board-approved operating plan supporting the valuation
  - - Cash on hand
    - Not publicly disclosed
    - Runway cannot be underwritten precisely
    - Request quarter-end cash, short-term investments, and restricted cash
  - - Monthly burn
    - Not publicly disclosed
    - Financing dependence remains unclear
    - Request monthly net burn and burn by function
  - - Debt / project finance
    - No public evidence found
    - Positive, but absence of evidence is not proof of absence
    - Confirm debt schedules, covenants, and any off-balance-sheet obligations
  notes: Capital adequacy is directionally strong after Series G but numerically incomplete
    without cash and burn.
