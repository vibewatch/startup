- id: partner-dependencies
  title: Partner, Customer, and Dependency Risks
  body: SiFive’s growth strategy is visibly partner-heavy. NVIDIA strengthens the
    AI data-center narrative; Red Hat and Canonical strengthen Linux credibility;
    Intel and Samsung strengthen platform and foundry credibility; HighTec, Quintauris,
    and Renesas strengthen automotive relevance. This is rational for a company of
    SiFive’s scale, but it also creates correlated dependency. If partners slow, reprioritize,
    or simply fail to convert ecosystem work into customer production programs, SiFive’s
    own trajectory slows with them. Sparse public customer disclosure compounds the
    problem because outsiders cannot judge revenue concentration or separate commercial
    customers from ecosystem validators with confidence. The result is a risk profile
    in which partnership quality and customer quality are inseparable. That is a powerful
    accelerant when things go right and a dangerous multiplier when things go wrong.
  claimRefs:
  - CR017
  - CR018
  - CR019
  - CR020
  - CR039
  - CR040
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: financial-model
  title: Financial and Model Risks
  body: 'The financial-model risks are mostly transmission risks. Sacra’s description
    of SiFive’s revenue as front-loaded and lumpy fits the classic semiconductor IP
    challenge: licenses arrive early, royalties arrive later, and long design cycles
    create uncertainty around timing. That means apparent momentum can coexist with
    financing sensitivity if royalties lag expectation. Series G materially reduces
    immediate pressure, but it does not solve the core information gap because the
    public record still lacks cash, burn, margin, and customer-cohort conversion data.
    IPO signaling can therefore become a risk if external expectations outrun internal
    readiness. There is no public evidence of debt overhang in the reviewed materials,
    which is helpful. But equity dependence remains the operative risk until the company
    can show that design wins are converting into durable recurring economics at the
    pace implied by valuation.'
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR031
  - CR032
  - CR041
  - CR042
  tableRefs:
  - TR004
  figureRefs:
  - FR002
- id: mitigations-triggers
  title: Mitigations, Monitoring, and Kill Criteria
  body: 'Public mitigations are meaningful but incomplete. Large equity financing
    gives SiFive time. Partnerships with NVIDIA, Red Hat, automotive players, and
    foundry/platform actors reduce isolation risk. Visible community and distro work
    shows active problem solving. Yet many mitigations are partner-mediated rather
    than structurally solved in-house, so they should be tracked as probabilities
    rather than guarantees. The most monitorable thesis-break triggers are clear:
    regulatory tightening that impairs counterparties or geographies; enterprise-software
    readiness failing to progress beyond preview-like states; evidence that design
    wins are not converting into royalties; or financing strain reappearing despite
    the Series G. Investors should also watch for compound effects rather than isolated
    events. The danger is rarely one bad forum thread or one legal memo; it is the
    interaction between ecosystem drag, customer hesitation, delayed royalties, and
    valuation expectations.'
  claimRefs:
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
  - CR033
  - CR041
