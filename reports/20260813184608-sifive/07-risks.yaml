company:
  name: SiFive
chapter:
  key: risks
  order: 7
  number: 7
  letter: R
  title: Risks
  summary: 'SiFive’s risk profile is elevated across regulation, ecosystem execution,
    partner dependency, and financial conversion. The biggest risks are not a single
    fatal flaw but a chain reaction: export-control and compliance complexity can
    slow counterparties; ecosystem immaturity can slow enterprise adoption; sparse
    named-customer disclosure can obscure concentration; and delayed royalty conversion
    can turn valuation confidence into financing sensitivity. Public mitigations exist—Series
    G funding, major partnerships, and visible Linux ecosystem work—but many of them
    are partner-mediated rather than fully controlled in-house. The most important
    diligence task is to separate reversible execution noise from structural shocks
    such as regulatory tightening or persistent royalty-conversion failure.'
sections:
- id: regulatory-legal
  title: Regulatory and Legal Risks
  body: The most structurally important risk category is regulatory and legal. SiFive
    is moving further into AI and data-center narratives just as U.S. export-control
    policy around advanced computing has become more expansive, more detailed, and
    more enforcement-oriented. Official BIS and GAO materials show that the rule set
    now reaches not only products but also counterparties, due diligence, entity-list
    exposure, and associated services. For a company selling IP rather than chips,
    that does not remove risk; it changes the locus of risk toward partner and customer
    compliance. RISC-V’s geopolitical salience adds a second layer. The architecture
    is now strategically discussed in U.S.-China competition, which increases the
    chance of future policy attention. The OpenFive/CFIUS episode also shows that
    SiFive-related assets can attract national-security review in transaction contexts.
    No active litigation surfaced in the public record reviewed here, but patent and
    licensing overhang should be assumed in a CPU IP market dominated by far larger
    incumbents.
  claimRefs:
