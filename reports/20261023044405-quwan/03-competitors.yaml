callouts:
  - calloutType: strength
    title: Community-led differentiation
    body: "Quwan's strongest evidenced distinction is the combination of game-focused voice interaction, social monetization, and esports adjacency; the durability of that combination is not yet independently benchmarked."
    claimRefs: [CP001, CP005, CP011]
  - calloutType: risk
    title: Historical evidence can overstate current advantage
    body: "The core user and financial comparisons are mostly 2022 or earlier, and a reported download pause coincided with MAU decline; current competitor share, retention, and pricing remain open."
    claimRefs: [CP011, CP012, CP015]

