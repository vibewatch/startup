    title: Public product and evidence stack
    type: stack
    summary: The stack separates verified Quwan product surfaces from external voice-AI artifacts whose production relationship is unverified.
    data:
      layers:
        - label: User access
          detail: "Current iPhone listing, accounts, messaging, and in-app purchase surface"
          items: ["TT Voice iPhone client", "Messaging and chat"]
        - label: Live interaction
          detail: "Game grouping, voice rooms, music, entertainment, and multiplayer events"
          items: ["Team formation", "Voice rooms", "Music interaction"]
        - label: Community and controls
          detail: "User-generated content, hosts, age controls, moderation, and privacy obligations"
          items: ["Room hosts", "Age assurance", "Parental controls"]
        - label: Operating assets
          detail: "TT Voice, TT Esports, and TT Game are the three publicly named core blocks"
          items: ["TT Voice", "TT Esports", "TT Game"]
        - label: Monetization
          detail: "Virtual items and host-led interaction dominate the reported 2023 revenue mix"
          items: ["Value-added services", "Host-led interactive services"]
        - label: External technical signal
          detail: "MaskGCT and Amphion artifacts are public, but Quwan production use is not established"
          items: ["MaskGCT paper", "Public checkpoints", "Bilingual demo"]
    approximationNotes: The ordering is an evidence taxonomy, not a measured internal architecture, data flow, or deployment topology.
    claimRefs: [CE005, CE008, CE011, CE014, CE015]
callouts:
  - calloutType: strength
    title: Coherent game-social workflow
    body: Public evidence consistently ties TT Voice to game grouping, live voice interaction, entertainment, and virtual-item monetization.
    claimRefs: [CE001, CE003, CE004, CE006]
  - calloutType: risk
    title: Production technology remains opaque
    body: Neither product listings nor the external MaskGCT trail establish Quwan's internal architecture, reliability, security effectiveness, or deployed AI advantage.
    claimRefs: [CE015, CE016]
