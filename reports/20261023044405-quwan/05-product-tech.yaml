company:
  name: Quwan
chapter:
  number: 5
  title: Product & Technology
  summary: Quwan's verified public product is a game-oriented voice-social platform spanning TT Voice, esports, and game operations. The evidence supports its user workflow and monetization surface, but not its internal architecture, reliability, security effectiveness, roadmap, or any production link to the separately published MaskGCT voice-AI stack.
sections:
  - id: product-workflow
    title: Product surface and user workflow
    body: >-
      Quwan's public product surface begins with TT Voice, which independent reporting characterizes
      as a gamer-centric networking platform. The current App Store listing turns that positioning
      into a concrete workflow: users can form game teams, match with teammates, enter multiplayer
      battle rooms, join music and entertainment sessions, and interact around esports. Another
      prospectus-derived description says users communicate through voice, text, virtual gifts, and
      chatrooms. Together, these sources support a product journey from discovery and grouping to
      live interaction and paid digital participation. They do not establish the quality of matching,
      audio latency, moderation, retention, or the share of users who use each feature. The storefront
      remains company-issued evidence even though Apple hosts it, so broad adoption language is not
      treated as independent proof.
    claimRefs: [CE001, CE003, CE006, CE007]
    tableRefs: [TE001, TE002]
  - id: operating-model
    title: Operating model and monetization
    body: >-
      A June 2024 report identifies three core business blocks: TT Voice, TT Esports, and TT Game.
      TT Voice is the economic center in the available evidence. The same report says users buy
      virtual items while interacting with other users and room hosts, and attributes 72.1% of 2023
      revenue to TT Voice value-added services and 25.6% to host-led interactive services. The
      resulting 97.7% concentration is a business-model fact, not an architecture claim, but it shows
      why real-time rooms, host tooling, payments, and content controls are operationally critical.
      Esports and game operations widen the engagement surface, yet the pool does not disclose
      module-level users, release cadence, integrations, support load, or current roadmap. Product
      breadth is therefore visible; independent evidence of technical maturity across that breadth
      is not.
    claimRefs: [CE002, CE004, CE005, CE006]
    figureRefs: [FE001]
  - id: technical-evidence
    title: Technical evidence and the MaskGCT boundary
    body: >-
      The assigned pool contains a substantial public MaskGCT technical trail: an arXiv paper
      describes a two-stage non-autoregressive text-to-speech model, Hugging Face exposes semantic
      codec, acoustic codec, text-to-semantic, and semantic-to-acoustic checkpoints, and the Amphion
      material documents audio-generation tasks and evaluation metrics. A demo page also exposes
      English and Chinese sample transcripts beside audio elements. These artifacts show that a
      reproducible voice-generation stack exists in public, but none of the fetched technical text
      identifies Quwan as the owner, contributor, operator, or production deployer. Accordingly,
      MaskGCT is treated as an external technical signal rather than Quwan differentiation. The
      required GitHub refresh URL was retained, but its fetched text exposed only a JavaScript shell,
      so no quotation or architecture inference is drawn from it.
    claimRefs: [CE010, CE011, CE012, CE013, CE014, CE015]
    tableRefs: [TE003]
  - id: controls-and-diligence
    title: Trust, safety, reliability, and diligence blockers
    body: >-
      The App Store makes the risk surface visible without proving control effectiveness. It rates
      the application 16+, identifies age assurance and parental controls, and lists unrestricted
      web access, messaging, user-generated content, social media, advertising, and mature or
      suggestive themes. It also says identifiers may be used to track users across apps and websites.
      Those disclosures create concrete diligence questions around youth protection, consent,
      moderation, content licensing, data retention, and advertising governance. Public materials
      do not provide security certifications, penetration-test summaries, uptime or incident
      history, service-level objectives, privacy-impact assessments, model-safety evaluations, or
      evidence of AI training-data rights. A recent storefront bug-fix note is maintenance evidence,
      not a reliability benchmark. Underwriting technical differentiation requires private production
      proof rather than extrapolation from features or research artifacts.
    claimRefs: [CE007, CE008, CE009, CE016]
