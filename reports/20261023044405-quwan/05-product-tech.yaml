      - [MaskGCT / Amphion artifacts, "Researchers and voice-AI developers", "Public paper, checkpoints, toolkit, package page, and demo", "Reproducible two-stage TTS capability", "No retained source establishes Quwan ownership or production deployment"]
    notes: Publicly named modules and artifacts are shown; maturity, differentiation, and Quwan affiliation are not inferred beyond the cited evidence.
    claimRefs: [CE001, CE002, CE006, CE010, CE012, CE015]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Publicly described workflow, Quwan surface, Measurable evidence, Limitation]
    rows:
      - ["Find teammates", "Form a game group and match with other players", "TT Voice team formation", null, "No matching-quality, completion, or repeat-use denominator"]
      - ["Interact during and around games", "Use voice, text, chatrooms, and virtual gifts", "TT Voice rooms and social interaction", "97.7% of 2023 revenue attributed to two TT Voice service categories", "Revenue concentration does not measure engagement quality or reliability"]
      - ["Join music and entertainment sessions", "Karaoke, live singing, and entertainment voice activity", "TT Voice music and entertainment features", null, "No independent engagement, retention, or content-rights evidence"]
      - ["Participate in esports experiences", "Follow or engage with teams, competitions, and multiplayer events", "TT Esports and TTG-related surfaces", null, "No current production-versus-promotion split or module economics"]
    notes: Null cells mean the assigned sources supplied no comparable outcome metric; the revenue percentage is company-derived reporting and not a conversion rate.
    claimRefs: [CE003, CE004, CE005, CE006]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Public evidence, Critical dependency, Risk or unknown]
    rows:
      - ["Client and account surface", "iPhone distribution, messaging, chat, and in-app purchases", "Apple distribution, identity, billing, and device compatibility", "No public client-security, account-recovery, or release-control evidence"]
      - ["Real-time community operations", "Voice rooms, game grouping, music, user-generated content, and virtual gifts", "Low-latency audio, host tooling, moderation, payments, and content rights", "No public capacity, latency, outage, abuse, or refund metrics"]
      - ["Trust and privacy controls", "16+ rating, age assurance, parental controls, and tracking disclosure", "Policy enforcement, consent, data governance, and youth safety", "Control effectiveness and regulatory assurance are not disclosed"]
      - ["External voice-AI reference", "MaskGCT paper, checkpoints, Amphion toolkit, and bilingual demo surface", "Training data, model components, inference infrastructure, and evaluation", "No fetched technical source links this stack to Quwan production"]
    notes: This table maps only publicly evidenced surfaces and dependencies; it is not a representation of Quwan's undisclosed internal system design.
    claimRefs: [CE007, CE008, CE009, CE010, CE012, CE013, CE014, CE015, CE016]
