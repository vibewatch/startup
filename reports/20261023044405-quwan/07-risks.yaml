    claimRefs: [CR001, CR005, CR007, CR010, CR011]
callouts:
  - calloutType: risk
    title: Highest-conviction risk
    body: "Minor-protection and personal-information obligations are explicit, broad and operationally demanding, while current evidence of Quwan's implementation is absent. Treat compliance maturity as an investment gate rather than assuming that no recorded incident means no exposure."
    claimRefs: [CR001, CR002, CR003, CR011]
  - calloutType: assumption
    title: Evidence limitation
    body: "The risk assessment uses historical public disclosures and a current legal framework, but it does not establish Quwan's FY2025/FY2026 financial position, current incidents, current licenses, or current control effectiveness."
    claimRefs: [CR006, CR007, CR014, CR016]
  - calloutType: recommendation
    title: Thesis-break monitoring
    body: "Do not underwrite a stronger recommendation until management reconciles current cash and cap-table terms, demonstrates tested age-assurance and incident controls, and shows that distribution continuity and cohorts have recovered from the historical download pause."
    claimRefs: [CR005, CR010, CR014, CR015]
