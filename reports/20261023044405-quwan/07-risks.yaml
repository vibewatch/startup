company:
  name: Quwan
chapter:
  number: 7
  title: Risks
  summary: Quwan's highest-confidence risks are regulatory exposure around minors, personal information, live interaction and virtual-value mechanics, plus stale public operating and financial disclosure. Historical reporting also shows user contraction during an app-download suspension and concentrated voting control, while current compliance, incident and liquidity evidence remains incomplete.
sections:
  - id: risk-ranking
    title: Risk ranking and investment relevance
    body: >-
      Quwan's risk profile is dominated by platform-governance obligations rather than a single disclosed failure. The 2024 legal analysis says China's minors-in-cyberspace framework applies to platforms with a large number of minor users or significant impact on minors, and lists impact assessments, a minor mode or designated area, an independent oversight body, platform rules, service discontinuation for seriously non-compliant providers, and an annual social-responsibility report. The same analysis says the criteria for “large number” and “significant impact” await later rules, which creates both compliance work and interpretive uncertainty. This matters because Quwan operates a voice and social product aimed at game users, and the public materials describe voice, text, virtual gifts, chatrooms and audio entertainment rather than a low-interaction utility. Regulatory exposure should therefore be monitored as an operating capability: age assurance, moderation, incident response, audit evidence, and controls over time and spending are thesis-critical, not disclosure add-ons. The investment implication is a high residual risk until Quwan supplies current control testing, enforcement history, and evidence that the current product configuration meets applicable requirements.
    claimRefs: [CR001, CR002, CR003, CR004, CR010]
    tableRefs: [TR001]
  - id: operating-and-financial
    title: Operating, financial and disclosure risks
    body: >-
      The available operating evidence is historical and internally inconsistent in freshness. A 36Kr report says average monthly active users fell from 16.8 million in 2021 to 13.8 million in 2022 after TT Voice downloads were paused from February 2022 through January 2023, while average monthly paying users rose to 1.0003 million and the paying rate reached 7.2%. The same report presents 2022 cash and cash equivalents of RMB956 million, whereas a separate LiveReport summary of the filing presents RMB935 million; neither source is current to this refresh. The difference is a reminder that accounting perimeter, date, or source extraction must be reconciled before using cash as runway. Historical profitability also benefited from reduced fair-value changes in preferred instruments and lower sales and marketing expense, so reported net income should not be treated as recurring cash generation without updated statements. A separate funding database page is partially blocked but states that it has one institutional investor, illustrating that even apparently simple financing facts need primary cap-table and financing-document confirmation. Until audited FY2025 and FY2026 YTD data, current cash, debt, obligations, cohort retention, and incident records are obtained, the risk stance should remain conservative.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: dependencies-and-kill-criteria
    title: Dependencies, mitigations and thesis-break triggers
    body: >-
      Quwan's dependency stack includes its app distribution and discovery channels, moderation and identity infrastructure, payment and virtual-goods controls, cloud and communications availability, and the capital and governance process required for a renewed listing. The historical download pause demonstrates that distribution interruption can coincide with a material MAU decline even when paying-user metrics improve. The legal framework also requires tighter handling of minors' personal information incidents, including immediate contingency measures, reporting and affected-user notification for actual or potential leakage, as well as access controls and annual compliance audits. These are monitorable dependencies: management should provide control ownership, testing cadence, incident counts, time-to-remediation, age-assurance coverage, chargeback and fraud rates, uptime, concentration by platform or supplier, and current financing runway. A thesis-break event would be a regulator-imposed service restriction, a material unremediated privacy or child-safety incident, another prolonged distribution interruption, or evidence that current liquidity cannot fund compliance and product investment through the listing process. A non-break but material downgrade would be persistent MAU contraction, rising payer concentration, or inability to reconcile current financial statements and cap-table terms.
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
    figureRefs: [FR001]
  - id: diligence-priorities
    title: Diligence priorities
    body: >-
      The decisive next work is evidence collection, not a more precise risk score. Quwan should provide the current legal-entity and product map, applicable licenses and registrations, regulator correspondence, privacy and minors' data-flow inventories, age-assurance and anti-addiction test results, moderation queues and escalation logs, security incidents and notifications, payment and virtual-goods controls, supplier and cloud concentration, service-level history, current cash and debt schedules, preferred-share and liquidation terms, and monthly cohort and payer data. External checks should reconcile the two reported 2022 cash figures, verify the reason and duration of the download pause, inspect any current listing or financing documents, and test whether the company has published or internally produced the annual minors-protection and compliance artifacts described by the legal framework. These asks are material because public evidence does not establish current compliance maturity, absence of incidents, or available cash.
    claimRefs: [CR014, CR015, CR016]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule or exposure, Jurisdiction, Likelihood, Severity, Mitigation maturity, Residual exposure, Diligence path]
    rows:
      - [Minors-in-cyberspace platform obligations, China, High, Critical, Unknown, High, "Obtain impact assessments, minor-mode controls, oversight ownership and annual reporting evidence."]
      - [Minors' personal-information processing and incident reporting, China, High, Critical, Unknown, High, "Map data flows; test consent, access approval, incident escalation and regulator/guardian notification."]
      - [Live-streaming, social and virtual-spending restrictions for minors, China, High, High, Unknown, "Test identity verification, time and spending controls, tipping restrictions and audit logs."]
      - [Listing, governance and cap-table execution risk, Hong Kong / China, Medium, High, Partial, "Reconcile current filing status, shareholder terms, preferences, approvals and sponsor path."]
    enumerationScope:
      coverage: partial
      basis: "Public regulatory and transaction evidence retained for the current refresh; private controls and current filings are not enumerated."
    notes: "Risk ranking is analytical; likelihood, severity and residual exposure are provisional where no current Quwan control evidence was available. Regulatory requirements are sourced from the retained 2024 legal analysis; listing facts are historical and require current primary-document verification."
    claimRefs: [CR001, CR002, CR003, CR004, CR010]
  - id: TR002
    title: Operational, quality, security and financial risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Age-assurance or moderation failure involving minors, High, Critical, Unknown, High, "No current control-test results or incident register retained."]
      - [Privacy incident involving minors' information, Medium, Critical, Unknown, High, "No current breach history, notification record or audit report retained."]
      - [Distribution interruption and MAU contraction, Medium, High, Partial, Medium-high, "No current app-store, download or channel continuity evidence."]
      - [Cash, debt or working-capital mismatch, Medium, High, Unknown, "Current audited cash, debt, obligations and cash-flow bridge are missing."]
      - [Recurring-profit quality and preferred-instrument accounting, Medium, High, Partial, Medium-high, "Updated statements are needed to separate accounting effects from cash generation."]
    notes: "Historical figures are not a current runway estimate. The two retained reports show different 2022 cash figures (RMB956 million and RMB935 million), so the discrepancy is recorded as a reconciliation gap rather than resolved."
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Monitoring or kill criterion]
    rows:
      - [App distribution and discovery, App stores and acquisition channels, Download suspension or ranking/distribution loss reduces acquisition and active usage, High, "Diversify channels and maintain reinstatement playbooks", Medium-high, "Monitor MAU and any prolonged distribution interruption."]
      - [Identity, moderation and anti-addiction services, Internal controls and regulated service providers, Inadequate age assurance or moderation creates regulatory and safety exposure, Critical, "Independent testing, escalation ownership and audit trail", High]
      - [Payments and virtual goods, Payment processors and internal ledger, Fraud, chargebacks or spending-control failure compresses margin or triggers enforcement, High, "Reconcile ledgers and enforce minor spending rules", High]
      - [Cloud, messaging and live audio infrastructure, Infrastructure and communications suppliers, Outage or capacity failure interrupts social and audio sessions, High, "Obtain SLA, redundancy, uptime and incident history", Medium-high]
    notes: "Counterparty names and concentration percentages were not disclosed in the retained pool; diligence should obtain the supplier register, contracts, SLAs and concentration schedule before assigning a numeric dependency limit."
    claimRefs: [CR010, CR011, CR012, CR013]
