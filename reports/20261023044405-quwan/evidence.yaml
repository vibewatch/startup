evidenceGaps:
  - type: stale
    severity: blocking
    topic: current-financials
    missingEvidence: Audited FY2025 and FY2026 YTD financial statements, including cash, debt, obligations, revenue mix, and margin.
    whyItMatters: >-
      The available revenue, profit, and cash figures are historical and cannot establish current liquidity or earnings
      quality.
    diligencePath: >-
      Obtain the latest audited accounts, management accounts, bank confirmations, debt schedule, and
      revenue-recognition bridge from management.
    relatedQuestionRefs:
      - QO008
      - QO010
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A current employee count reconciled to legal entities, contractors, and overseas operations.
    whyItMatters: >-
      The assigned sources report materially different workforce sizes, affecting scale and operating-leverage
      assessment.
    diligencePath: Request a dated HR roster and reconciliation to payroll, contractors, and entity-level headcount.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: ownership
    missingEvidence: Current cap table, preference stack, voting agreements, PIPE closing status, and liquidation waterfall.
    whyItMatters: >-
      Historical ownership and proposed transaction percentages do not establish present economic ownership or investor
      protections.
    diligencePath: >-
      Obtain the latest capitalization table, shareholder agreements, preference schedule, and executed
      transaction-closing documents.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: material
    topic: users
    missingEvidence: Current MAU, payer count, payer rate, cohort retention, and monetization by product line.
    whyItMatters: Registered-user stock and 2022 MAU do not establish current engagement or customer quality.
    diligencePath: >-
      Request product analytics exports and cohort tables covering the latest 24 months, with definitions and
      reconciliation to reported revenue.
    relatedQuestionRefs:
      - QO002
      - QO005
      - QO008
  - type: missing-source
    severity: blocking
    topic: sizing-gap
    missingEvidence: >-
      A current, independently reviewable bridge from Quwan product revenue and users to a defined China or global SAM
      and SOM.
    whyItMatters: >-
      Category estimates and broad games totals do not establish the portion Quwan can reach or monetize, which limits
      valuation underwriting.
    diligencePath: >-
      Request current product-line revenue, geography, MAU, payer cohorts, take rates, and a management bottom-up market
      model; reconcile it to audited accounts.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: stale
    severity: material
    topic: user-retention
    missingEvidence: FY2025 and 2026 YTD MAU, paying users, payer rate, retention cohorts, and acquisition source mix.
    whyItMatters: >-
      The latest retained user and payer evidence is historical and includes a period of paused downloads, so it cannot
      establish current adoption momentum.
    diligencePath: Obtain monthly cohort dashboards and audited KPI definitions for the latest 24 months.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: buyer-segmentation
    missingEvidence: Current geography, payer demographics, partner economics, and budget ownership by product line.
    whyItMatters: >-
      The adoption path may differ materially between consumer virtual-goods monetization and adjacent esports or
      distribution businesses.
    diligencePath: >-
      Request product-level revenue waterfalls, payer concentration, partner contracts, and user research by geography
      and use case.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Current competitor list prices, realized take rates, contract terms, and discounting for TT Voice, YY, Lizhi, and
      game-native alternatives.
    whyItMatters: >-
      Without like-for-like pricing and monetization data, relative willingness to pay and pricing power cannot be
      underwritten.
    diligencePath: >-
      Collect current public pricing pages and obtain anonymized customer or channel contracts for each material
      alternative.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
