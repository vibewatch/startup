company:
  name: Quwan
chapter:
  number: 1
  title: Company Overview
  summary: Quwan is a Guangzhou-based social-gaming and voice-interaction company whose TT Voice platform, esports assets, and newer AI work create a broad but difficult-to-underwrite operating perimeter. Public evidence supports a 2014 founding, substantial historical scale, venture backing, and a prior de-SPAC path, but current headcount, financials, ownership terms, and operating momentum remain unevenly disclosed.
sections:
  - id: identity-and-operating-perimeter
    title: Identity and operating perimeter
    body: >-
      Quwan's identity is relatively clear even though the public record is not
      current across every metric. Bloomberg describes Guangzhou Quwan Network
      Technology as developing software, social platforms, and AI large models in
      China, while Dealroom places the company in mobile entertainment and social
      gaming. A company-profile record gives a Guangzhou establishment date of
      December 13, 2014 and names Song Ke as legal representative. The operating
      perimeter therefore spans a consumer voice-social core, gaming and esports
      adjacencies, and AI products rather than a single narrowly reported SaaS
      model. TT Voice is reported as having more than 200 million cumulative
      registered users, but that is a registered-user stock, not a current active
      customer count.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-control
    title: Leadership, governance, and control
    body: >-
      The available leadership evidence points to founder-centered control with
      experienced operating and finance coverage. The 36Kr account identifies
      Song Ke, Chen Guangyao, and Du Guo as executive directors and says Song Ke
      controlled about 51.92% of voting rights before the proposed IPO through
      trusts, holding entities, and voting arrangements. It also reports that
      former CFO Sha Dachuan left for Zhihu and that Lu Shaoyu became CFO in
      March 2023, with responsibility for finance and legal management. This
      combination suggests meaningful founder dependence and a governance
      transition around listing readiness; the public pool does not establish a
      current board roster or whether the 2023 finance appointment remains in
      place in October 2026.
    claimRefs: [CO009, CO010, CO016]
    tableRefs: [TO002]
  - id: capital-and-scale
    title: Capital, valuation, and disclosed scale
    body: >-
      Historical financing evidence is substantial but time-bounded. Dealroom
      records a February 2021 Series B of $100 million at a reported $400 million
      valuation, while the 36Kr account describes 2020 revenue of RMB1.493
      billion, 2021 revenue of RMB2.63 billion, and 2022 revenue of RMB3.40
      billion. The same 36Kr account reports RMB956 million of cash and cash
      equivalents at the end of 2022, while Eastmoney reports RMB935 million for
      that period. A separate listing analysis reports a proposed combined equity
      value of about HK$8.215 billion and a PIPE purchase price of roughly
      HK$576-610 million in the 2024 Vision Deal transaction. These are not
      interchangeable measures: historical revenue is not ARR, reported cash is
      not current cash available, and a proposed transaction value is not proof
      of a completed financing or present valuation.
    claimRefs: [CO005, CO006, CO007, CO008, CO011, CO012]
    tableRefs: [TO003]
  - id: milestones-and-open-diligence
    title: Milestones and diligence implications
    body: >-
      The milestone record shows a progression from TT Voice launch and early
      game distribution into pan-entertainment social, esports, and AI. The
      available profile records TT Voice's 2014 launch, TT Esports in 2019,
      AI ecosystem work alongside 2021 financing, an AI joint laboratory in 2023,
      and the 2024 open-source release of the MaskGCT speech model. External
      industry data provides context rather than company verification: the China
      Audio and Digital Publishing Association reports 2024 domestic game sales
      of RMB325.783 billion and 674 million users, while Niko's 2026 report
      series covers PC, mobile, and console markets. The resulting diligence
      priority is current evidence: audited FY2025/FY2026 YTD financials,
      updated active-user and payer data, current ownership terms, and the
      status of any listing plan.
    claimRefs: [CO013, CO014, CO015]
    figureRefs: [FO001]
