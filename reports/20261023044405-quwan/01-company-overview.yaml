callouts:
  - calloutType: risk
    title: Current underwriting gap
    body: "The strongest public operating and financing numbers are historical or transaction-proposed. Current audited financials, liquidity, active-user quality, ownership terms, and listing status remain material diligence gaps."
    claimRefs: [CO007, CO008, CO011]
  - calloutType: insight
    title: Broad platform, concentrated control
    body: "Quwan combines a large voice-social user base with esports and AI initiatives, while reported founder voting control makes governance and key-person continuity central to underwriting."
    claimRefs: [CO002, CO003, CO009, CO015]
