      - [Paying users, Payer, "Virtual goods and social interaction", "643.9k average monthly paying users in 2020; 965.6k in 2021; about 1.0m in 2022-2023", high, "Retention, ARPPU, and payer concentration are not disclosed"]
      - [Hosts / room operators, "Supply-side participant; may receive user spending", "Host-led interaction and audio entertainment", "Host-led interaction represented 25.6% of 2023 revenue", medium, "Host count, take rate, and supply concentration are not disclosed"]
      - [Esports audience and league ecosystem, User/community, "League of Legends and Honor of Kings esports", "Quwan-owned teams and 2023 TTG revenue of RMB55.662m", medium, "Audience conversion and standalone customer economics are not disclosed"]
      - [Game distribution users, User, "Game distribution adjacent to the social platform", "Quwan is reported to provide game distribution", medium, "Active users, revenue, and channel dependence are not disclosed"]
    notes: "Public sources mix company/filing-derived figures, media reporting, and a company-linked description; registered users, MAU, paying users, and revenue are different populations and must not be treated as interchangeable."
    enumerationScope:
