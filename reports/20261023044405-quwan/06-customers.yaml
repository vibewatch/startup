    claimRefs: [CU001, CU002, CU003, CU004, CU011]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Period, Source basis, Confidence, Implication or missing denominator]
    rows:
      - [Average monthly active users, 12.3 million, "2020", "36Kr report of filing data", medium, "Starting base; no cohort denominator"]
      - [Average monthly active users, 16.8 million, "2021", "36Kr report of filing data", medium, "Growth before later decline"]
      - [Average monthly active users, 13.8 million, "2022", "36Kr report of filing data", medium, "Down from 2021; download pause is a confounder"]
      - [Average monthly active users, approximately 12.8 million, "2023", "Blue Whale report of updated financial data", medium, "About 7% below 2022; current post-pause durability remains unclear"]
      - [Average monthly paying users, 643.9 thousand, "2020", "36Kr report of filing data", medium, "No payer retention or ARPPU"]
      - [Average monthly paying users, 965.6 thousand, "2021", "36Kr report of filing data", medium, "Payer growth despite later MAU decline"]
      - [Average monthly paying users, 1.0003 million, "2022", "36Kr report of filing data", medium, "Reported paying rate was 7.2%"]
      - [Average monthly paying users, approximately 1.0 million, "2023", "Blue Whale report of updated financial data", medium, "Stable absolute payer count is not retention proof"]
      - [Virtual-goods sales revenue, "RMB3.107 billion", "2023", "Blue Whale report of updated financial data", medium, "About 6.1% lower year over year; source reports RMB31.07亿元"]
    notes: "Figures are reported on different source surfaces and periods; MAU, monthly paying users, paying rate, and virtual-goods revenue use different denominators. The row for 2023 virtual-goods sales converts the source's RMB31.07亿元 to RMB3.107 billion."
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or adoption surface, Segment, Deployment or use case, Production vs pilot, Outcome, Limitation]
    rows:
      - [TT Voice community, Mobile gamers and Gen Z, "Voice chat evolved into social gaming platform", "Operating platform; public description", "Personalized services and social interaction are described", "Claims are not an independent customer case study"]
      - [TT Voice registered-user base, Consumer community, "Registration and community access", "Claimed scale, not named deployment", "Over 100 million registered users was reported in 2021", "Registered users are not MAU, payers, or retained cohorts"]
      - [Quwan esports teams, Esports audience, "League of Legends and Honor of Kings franchise leagues", "Operating team ownership", "Two franchise-league teams are identified; TTG generated RMB55.662m in 2023 revenue", "Audience conversion and profitability are not customer outcomes"]
      - [Host-led interaction, Hosts and paying users, "Audio entertainment and interaction rooms", "Operating monetization surface", "25.6% of 2023 revenue came from host-led interaction services", "Host count, retention, and take rate are unavailable"]
    notes: "This is a partial enumeration of named adoption surfaces, not a list of independently verified customer references. Logos, registered users, and owned esports teams do not establish production deployments or retention."
    enumerationScope:
      coverage: partial
      basis: "Named customer-facing products, community scale signals, and operating surfaces explicitly described in assigned sources"
    claimRefs: [CU002, CU003, CU011, CU012, CU013]
