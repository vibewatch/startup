artifact: customers
slug: quwan
runDate: 2026-10-23
company:
  name: Quwan
chapter:
  number: 6
  title: Customers
  summary: Quwan's customer engine is a gamer-oriented social voice platform monetized through virtual goods and host-led interaction, with esports and game distribution as adjacent surfaces. Public evidence shows material scale but also a 2022-2023 decline in average monthly active users and virtual-goods revenue, while retention, cohort durability, and named production deployments remain unverified.
sections:
  - id: customer-segments
    title: Segmentation and customer economics
    body: "Quwan serves a consumer community rather than a disclosed enterprise account base. The buyer, user, and payer are often different roles inside the same social loop: a mobile gamer or Gen Z participant uses TT Voice for voice, text, chat-room, and social-gaming interaction; users and hosts transact in virtual goods; and the platform monetizes those interactions. Public descriptions also place TT Voice beside TT Esports and TT Game, but the available evidence does not disclose a customer-level revenue split for those adjacent businesses. This makes the core segment identifiable while leaving payer concentration, host concentration, geography, and revenue-band segmentation open. The most useful diligence cut is therefore a role-based cohort view separating registered users, active users, paying users, and host-side supply rather than treating a large registered-user figure as recurring commercial adoption."
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and durability
    body: "The disclosed trajectory is mixed. Average monthly active users rose from 12.3 million in 2020 to 16.8 million in 2021, then fell to 13.8 million in 2022 and approximately 12.8 million in 2023. Average monthly paying users increased from 643.9 thousand in 2020 to 965.6 thousand in 2021 and approximately 1.0 million in both 2022 and 2023, while the reported paying rate reached 7.2% in 2022. The 2022 filing period included a pause in TT Voice downloads from February 2022 through January 2023 and a stated shift toward deeper user connection and engagement, so the decline cannot be read as a clean demand signal without post-pause cohorts. Revenue concentration reinforces the durability question: 2023 value-added services and host-led interaction represented 97.7% of revenue, while virtual-item sales fell about 6.1% year over year. No public source in the assigned pool establishes NRR, GRR, churn, renewal, contract length, or cohort retention."
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-risks
    title: Named proof, expansion, and concentration risks
    body: "Named customer proof is thin in the assigned evidence. The strongest public evidence identifies TT Voice as a platform for mobile gamers, reports a claimed registered-user base, and identifies Quwan's ownership of teams in two franchise esports leagues; it does not identify paying customer names, production deployments, customer-quoted outcomes, or independently audited usage. The monetization model can expand when users interact more frequently and purchase more virtual gifts, but the same loop creates exposure to user-engagement volatility, host supply, platform-policy intervention, and concentration in one core service. Apple publishes a transparency process for app-removal requests tied to alleged platform-policy violations; that page is not evidence of a Quwan removal, but it is a relevant distribution-control dependency for an app-led customer funnel. A current cohort file, named reference list, host economics, and app-store incident history are required before expansion or durability can be underwritten."
    claimRefs: [CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
