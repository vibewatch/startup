          detail: Hosts participate in interaction services that represented 25.6% of 2023 revenue.
        - id: virtual-goods
          label: Virtual-goods purchase
          title: Virtual-goods purchase
          detail: Users purchase virtual items while interacting with users and hosts.
        - id: esports-adjacency
          label: Esports adjacency
          title: Esports adjacency
          detail: Quwan owns teams in League of Legends and Honor of Kings franchise leagues.
        - id: game-distribution
          label: Game-distribution adjacency
          title: Game-distribution adjacency
          detail: Quwan is reported to provide game distribution alongside instant voice messaging and social gaming.
    approximationNotes: "The sequence is an analytical representation of the operating model described by assigned sources, not a measured conversion funnel; no step-level conversion or retention rates are publicly established."
    claimRefs: [CU001, CU003, CU011, CU012, CU013]
callouts:
  - calloutType: insight
    title: Scale is visible; durability is not
    body: "Reported MAU fell from 16.8 million in 2021 to approximately 12.8 million in 2023, while monthly paying users stayed near 1.0 million. That combination warrants cohort and payer-quality diligence rather than a simple active-user growth narrative."
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
  - calloutType: risk
    title: Core revenue remains concentrated in interaction monetization
    body: "Value-added services and host-led interaction together represented 97.7% of 2023 revenue, so customer durability depends on continued engagement, payer conversion, and host supply."
    claimRefs: [CU010, CU014]
