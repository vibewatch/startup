        - id: uncertainty
          label: Current uncertainty
          detail: "No current audited 2025-2026 Quwan financial package or verified current valuation in the assigned pool."
        - id: liquidity
          label: Liquidity risk
          detail: "2024 de-SPAC terms were proposed; completion and current sponsor path are unverified."
        - id: diligence
          label: Required diligence
          detail: "Obtain audited metrics, cap table, preferences, waterfall, and current listing evidence."
        - id: recommendation
          label: Research-more
          detail: "Require a current, preference-adjusted price before entry."
      edges:
        - [scale, monetization]
        - [monetization, uncertainty]
        - [uncertainty, liquidity]
        - [liquidity, diligence]
        - [diligence, recommendation]
    claimRefs: [CV001, CV002, CV007, CV017, CV018]

callouts:
  - calloutType: recommendation
    title: "Recommendation: research-more"
    body: "Quwan has enough historical operating evidence to merit continued diligence, but not enough current valuation or capitalization evidence to support a buy."
    claimRefs: [CV001, CV007, CV017]
  - calloutType: risk
    title: Thesis-break trigger
    body: "A further user decline combined with weaker monetization, a materially dilutive financing, or inability to produce current audited accounts would break the investability thesis."
    claimRefs: [CV004, CV018, CV020]

