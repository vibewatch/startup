company:
  name: Quwan
chapter:
  number: 8
  title: Valuation
  summary: "Public evidence supports a scaled, historically profitable voice-social platform but does not establish a current price, audited 2025-2026 earnings base, or a completed listing. The appropriate stance is research-more: preserve upside optionality while requiring current financials, cap-table terms, and a defensible entry valuation."
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      Quwan's investment case is anchored in a real monetization history rather than a purely
      conceptual product. A 2023 LiveReport summary of the company's filing reported RMB3.402
      billion of 2022 revenue, RMB509 million of net profit, and RMB935 million of cash and
      cash equivalents, while also reporting 13.8 million average monthly active users and a
      7.2% 2022 paying rate. The same source says value-added services and audio entertainment
      represented 74.8% and 23.6% of revenue, respectively. That combination indicates a
      meaningful, high-gross-margin monetization engine, but it is historical and secondary.
      The anti-thesis is equally material: a later 36Kr account says monthly active users fell
      from 16.8 million in 2021 to 13.8 million in 2022 after downloads were paused, and a
      comparable game-centric voice platform, DouYu, reported 2024 revenue and gross profit
      declines plus a net loss. These data do not prove Quwan has followed the same path, but
      they make a stale 2022 profit base an unsafe proxy for current value.
    claimRefs: [CV001, CV002, CV004, CV005]
    tableRefs: [TV001, TV002]
  - id: financing-and-entry
    title: Financing context and entry discipline
    body: >-
      The clearest public financing mark is not a current round but the proposed 2024
      de-SPAC structure described by Sina Finance: a target equity value of approximately
      HK$6.892 billion for the transferred stake and an approximately HK$8.215 billion
      combined equity value, with PIPE investors buying at HK$10.00 per share and committing
      approximately HK$576 million, adjustable to HK$610 million. The article also describes
      different post-closing ownership outcomes depending on SPAC redemptions. Those figures
      are transaction terms, not proof that the transaction closed or that the mark remains
      current. The proposed structure therefore supplies a historical negotiation anchor and
      highlights dilution and redemption sensitivity, but not a clean present-day valuation.
      Hurun's 2025 methodology reinforces the need for discipline: it uses the most recent
      sizeable round and industry comparatives when private-company performance weakens, while
      explicitly warning that private valuations are difficult to pin down. An investment
      committee should not underwrite the old mark without updated audited accounts, current
      capitalization, preference rights, and evidence of a live listing path.
    claimRefs: [CV007, CV008, CV009, CV010]
    tableRefs: [TV003]
  - id: scenarios-and-comparables
    title: Scenarios and comparable signals
    body: >-
      A scenario framework is more reliable than a single point estimate because current
      Quwan revenue, margin, cash, and ownership data are not publicly refreshed in the
      assigned evidence. The base case assumes the historical 2022 earnings profile is not
      directly portable and keeps the recommendation at research-more until current data are
      obtained. The bull case requires renewed user growth, durable payer conversion, and a
      completed financing or listing at terms that do not transfer disproportionate value to
      new money. The bear case is a down-round or stalled liquidity event after user
      contraction and monetization pressure. Comparable signals are cautionary rather than
      mechanical: Hurun lists Discord at US$15 billion in its 2025 social-media section, while
      TechCrunch reports Discord was last valued at US$14.7 billion in a 2021 US$500 million
      fundraise and was only in exploratory IPO discussions in March 2025. JOYY's market
      capitalization was reported at US$4.08 billion on October 22, 2026, but public-market
      capitalization is not directly comparable to Quwan's private transaction marks. The
      correct use of these references is to set a valuation-discipline range and identify
      sensitivity, not to infer Quwan's value from a peer multiple.
    claimRefs: [CV011, CV012, CV013, CV014]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Decision, exit readiness, and diligence asks
    body: >-
      The recommendation is research-more with medium confidence and high risk. That is a
      price-sensitive conclusion: the business has evidence of scale and historical
      profitability, but the assigned pool contains no current Quwan audited financial
      statements, no verified 2026 valuation, and no evidence that the proposed de-SPAC
      completed. The first decision gate is a current financial package covering revenue
      quality, gross margin, cash, debt, working capital, and any non-cash fair-value effects.
      The second is a fully diluted cap table showing investor preferences, liquidation
      waterfalls, PIPE and redemption outcomes, and any secondary or post-transaction terms.
      The third is operating evidence on MAU, paying users, payer concentration, retention,
      AI contribution, and regulatory or app-distribution constraints. Exit readiness also
      requires a documented sponsor path, governance status, audited reporting timetable, and
      an observable transaction process. Until those items are closed, a buyer should require
      a material discount to any old unicorn or de-SPAC reference and define a thesis break as
      a further user decline, inability to demonstrate cash generation, or a materially
      dilutive financing.
    claimRefs: [CV017, CV018, CV019, CV020]

tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, research-more, "Historical scale and profit are supported by secondary filing summaries; current price is not established.", "Do not underwrite a buy before refreshed financial and transaction diligence."]
      - [Confidence, medium, "Evidence is multi-domain but key Quwan operating data stop largely at 2022-2024 transaction context.", "Treat the view as conditional and update on primary disclosures."]
      - [Risk rating, high, "User contraction, stalled liquidity, valuation uncertainty, and private-company disclosure gaps remain material.", "Require downside protection and explicit kill criteria."]
      - [Valuation stance, stretched, "The old HK$8.215bn proposed combined equity value is not demonstrated as current.", "Demand a current mark and preference-adjusted price before entry."]
    notes: "Assessment is an analyst synthesis of dated public evidence; no current Quwan valuation or audited 2025-2026 financial package was available in the assigned pool."
    claimRefs: [CV001, CV004, CV007, CV017]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Current implication]
    rows:
      - ["Scaled monetization engine", "2022 revenue was reported at RMB3.402bn with RMB509m net profit and 74.8% of revenue from value-added services.", "Audited current revenue and margin show persistence.", "Positive but historical."]
      - ["User engagement is fragile", "Average MAU fell from 16.8m in 2021 to 13.8m in 2022 after downloads were paused.", "Current MAU, payer, retention, and cohort data show durable recovery.", "Material anti-thesis."]
      - ["Transaction optionality exists", "The 2024 proposal described PIPE funding and an approximately HK$8.215bn combined equity value.", "Evidence confirms closing, terms, and a live sponsor/listing process.", "Historical anchor only."]
      - ["Comparable valuations can reset", "Hurun describes valuation cuts and uses comparatives when performance weakens; DouYu reported 2024 revenue and gross-profit declines.", "Quwan demonstrates differentiated growth and cash generation.", "Supports a conservative entry price."]
    notes: "Rows combine company-specific historical reports with external market signals; they are not a forecast or a substitute for a current valuation."
    claimRefs: [CV001, CV004, CV007, CV008, CV010, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - [Bull, "MAU and paying users recover; current audited margins remain attractive; listing or financing closes with limited dilution.", "Upside can be justified only by a refreshed primary mark and preference-adjusted equity value.", "Execution, regulation, dilution, and liquidity timing.", "Low-to-medium until current evidence is supplied."]
      - [Base, "2022 profitability is not assumed to persist; transaction reference remains historical; disclosure improves gradually.", "Research-more rather than buy; price must include a discount to old proposed marks.", "Stale financials and uncertain capitalization.", "Most supportable on current evidence."]
      - [Bear, "User contraction continues; monetization weakens; financing is delayed or repriced.", "Down-round or impaired liquidity creates capital loss and dilution.", "Commercialization, cash burn, governance, and exit risk.", "Material downside signal from comparable sector weakness."]
      - [Entry discipline, "No precise multiple is used because current revenue, EBITDA, cash, and fully diluted shares are unavailable.", "Set a bid only after audited metrics and waterfall are received; otherwise pass.", "False precision and adverse selection.", "Mandatory diligence condition."]
    notes: "Scenarios are qualitative because the assigned evidence does not provide a current Quwan denominator for a defensible price target; the old transaction figures are anchors, not forecasts."
    claimRefs: [CV007, CV009, CV011, CV017, CV018]

