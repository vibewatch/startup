callouts:
  - calloutType: strength
    title: Historical monetization scale
    body: "The reported 2022 revenue and gross profit base, together with a large paying-user population, supports diligence into a scaled operating asset rather than an unproven concept."
    claimRefs: [CI003, CI006]
  - calloutType: risk
    title: Current underwriting gap
    body: "Falling MAU, concentrated virtual-item revenue, an unprofitable esports segment, and unavailable current cash and burn data prevent a high-confidence view of cash earnings and runway."
    claimRefs: [CI005, CI008, CI012, CI015]
  - calloutType: recommendation
    title: Financing diligence before valuation
    body: "Treat historical profit and proposed PIPE terms as context, not available cash; require current audited accounts, cash and debt schedules, and product-line economics before underwriting a valuation."
    claimRefs: [CI009, CI013, CI015]
