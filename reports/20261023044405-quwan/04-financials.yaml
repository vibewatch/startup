      - [Adjusted net profit, "Approximately RMB607m in 2023", medium, "Better operating proxy than headline profit but still not cash flow", "Obtain adjusted-profit reconciliation and operating cash flow"]
      - [Cash and cash equivalents, "RMB935m or RMB956m at 2022 year-end", medium, "Historical liquidity is not current runway", "Resolve discrepancy and obtain current cash, debt, restricted cash, and burn"]
      - [Net revenue retention, null, low, "Retention is central to recurring social monetization but not disclosed", "Obtain payer and cohort retention by acquisition channel"]
    notes: "Historical values retain their reported periods; current cash, burn, runway, and retention remain unavailable."
    claimRefs: [CI006, CI012, CI013, CI016]
