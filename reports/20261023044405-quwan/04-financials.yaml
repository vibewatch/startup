company:
  name: Quwan
chapter:
  number: 4
  title: Financials
  summary: Quwan has disclosed a high-margin virtual-goods and audio-interaction model, but the latest usable detailed financial disclosure remains 2023-era and is not sufficient to underwrite current cash generation or runway. Historical profitability improved materially, while falling monthly active users, concentration in virtual-item revenue, and an uneconomic esports segment keep revenue quality and capital adequacy as material diligence questions.
sections:
  - id: revenue-quality
    title: Revenue model and public traction
    body: >-
      Quwan's disclosed monetization is primarily a digital social-entertainment model: users buy virtual items while interacting with other users and hosts on TT Voice. The 2022 disclosure summarized by LiveReport attributes 74.8% of revenue to value-added services and 23.6% to audio entertainment services, while a later 2023 update attributes 72.1% and 25.6% respectively to those categories. That concentration makes gross bookings, payer behavior, platform take rate, host economics, and moderation costs more important than a generic software-revenue lens. The same 2023 update reports revenue of approximately RMB3.225 billion, down 5.2% year over year, average monthly active users of approximately 12.8 million, and roughly 1 million average monthly paying users. These data are company-disclosure summaries reported by financial media, not audited current-period statements. The 2022 historical series shows strong scale but also a declining gross margin from 65.03% in 2020 to 54.16% in 2022, so the underwriting question is whether engagement and monetization can stabilize without proportionate acquisition or content-delivery cost.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001]
  - id: pricing-and-economics
    title: Pricing, cost structure, and unit economics
    body: >-
      Public sources do not disclose a reliable list-price schedule, realized price by virtual-item category, platform take rate, host payout rate, CAC, payback, retention cohorts, or contribution margin. The monetization mechanism is visible, but the price-to-revenue bridge is not. The 2022 financial summary reports gross profit of RMB1.842 billion on revenue of RMB3.402 billion and a 54.16% gross margin; the 2023 update reports that virtual-item sales were approximately RMB3.107 billion, down about 6.1% year over year, and that esports revenue grew to approximately RMB55.662 million while the esports operation recorded a 227.3% loss rate. This mix implies that a consolidated margin path can be obscured by loss-making adjacent activities and by non-cash accounting effects. Reported 2023 net profit of approximately RMB947 million was said to reflect fair-value changes in convertible and convertible-redeemable preferred shares; adjusted net profit was approximately RMB607 million, down 8.59% year over year. Accordingly, cash earnings, gross-to-net revenue conversion, and service-delivery costs remain more decision-useful than headline net income.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI011]
    tableRefs: [TI002, TI003]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Capital adequacy and underwriting verdict
    body: >-
      Quwan's capital position cannot be refreshed from the assigned public evidence to a current cash, debt, burn, or runway view. A 2023 prospectus summary reported RMB935 million of cash and cash equivalents at 31 December 2022, while another contemporaneous report gave RMB956 million; this small discrepancy is unresolved and neither figure is current as of the 2026 run date. The same materials describe historical special dividends and a later SPAC process, but they do not establish present liquidity after operating needs, distributions, transaction costs, debt obligations, or any post-2023 financing. The proposed PIPE was HK$576 million, adjustable to HK$610 million, but HK$298 million was designated to purchase existing shares, so the headline amount was not equivalent to new operating cash. Capital intensity also remains unresolved: an industry body flags rising development and acquisition costs, while a low-confidence public compendium reports cumulative Quwan R&D investment above RMB1.2 billion and a 100,000-square-metre headquarters project due for use in 2027 without quantifying remaining commitments. The financial verdict is therefore research-more: historical operating economics are credible enough to merit diligence, but current revenue quality, cash conversion, capital intensity, and financing dependency remain under-disclosed.
    claimRefs: [CI012, CI013, CI014, CI015, CI016]
    tableRefs: []
  - id: financial-exhibits
    title: Exhibits
    body: >-
      The exhibits separate reported revenue and margin history from list-price and unit-economics gaps. Nulls are intentional: no assigned source provides a defensible current value, and substituting zero would misstate the business. The revenue bridge is a mechanism diagram rather than a forecast; it shows how user activity is described as converting into virtual-item and audio-interaction revenue, then into gross profit, while retaining the disclosed qualifications around declining activity and unreported take rates.
    claimRefs: [CI001, CI006, CI009, CI012]
    tableRefs: []
    figureRefs: []
