  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is not all social media or all gaming spend. The narrow core is monetized mobile
              voice-social interaction for gamers: real-time voice, group participation, virtual goods, tipping, and
              adjacent entertainment around play. A broader adjacent market includes mobile gaming, esports, game
              distribution, and creator or digital-human products, but those categories should not be added to the core
              total without proof that Quwan captures the same budget. The status quo includes in-game voice, text chat,
              free community servers, and offline or platform-native social features. Dealroom describes TT Voice as
              evolving from a voice tool for team games into voice chat, game-centric networking, and matchmaking, while
              LiveReport attributes 74.8% of 2022 revenue to value-added services and 23.6% to audio entertainment. This
              points to a user-engagement and virtual-item budget, not a conventional enterprise software subscription.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
      - number: '2.2'
        title: Sizing lenses and adoption drivers
        blocks:
          - type: paragraph
            body: >-
              Multiple lenses are available, but they use different years, populations, and definitions. LiveReport,
              citing prospectus material, reports a China mobile voice-social market of RMB25.2 billion (RMB252 亿元) in
              2022, projected to RMB52.2 billion (RMB522 亿元) in 2027 at a 15.7% CAGR; the mobile-game-user social market
              is reported at RMB16.8 billion (RMB168 亿元) in 2022 and RMB38.2 billion (RMB382 亿元) in 2027 at a 17.9%
              CAGR. CADPA reports the wider 2024 China games market at RMB325.783 billion (RMB3,257.83 亿元) and 674
              million users, with mobile games at RMB238.217 billion (RMB2,382.17 亿元). These figures are useful bounds,
              not additive TAM components. The growth case is supported by mobile-first usage, social interaction around
              games, cross-platform distribution, and esports, while 2024 industry commentary also flags higher
              competition, research and acquisition costs, and a mature-market need for higher-quality content. For
              valuation, the key unresolved bridge is how much of the category is reachable by Quwan's products and how
              much revenue is retained after platform, content, compliance, and user-acquisition costs.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM015
      - number: '2.3'
        title: Buyer, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The primary user is a mobile gamer seeking coordination, group identity, and entertainment; the payer is
              an engaged participant purchasing virtual items or tipping performers; and the budget owner is usually the
              individual consumer rather than a procurement department. A second route is ecosystem monetization through
              esports, distribution, and creator or partner relationships, but public evidence does not quantify those
              lines separately. The adoption trigger is repeated team play and social connection, while substitutes are
              free voice or text tools and native game features. Historical prospectus reporting shows average monthly
              active users fell from 16.8 million in 2021 to 13.8 million in 2022 during a download pause, even as
              average monthly paying users rose to 1.0003 million and the payer rate reached 7.2%. That combination
              suggests monetization can deepen among retained users, but it also makes acquisition, retention,
              regulatory continuity, and payer quality central valuation constraints. Current MAU, payer cohorts,
              geography, and product-line economics remain open diligence items.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Category is large, but Quwan's addressable slice is unproven
            body: >-
              The public record supports substantial China gaming and voice-social categories, but the market lenses are
              not interchangeable and do not establish Quwan's current SAM, SOM, or forward growth.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: callout
            title: Retention and regulation can outweigh headline market growth
            body: >-
              Historical user decline during a download pause and the industry's stated cost and competition pressures
              mean that category CAGR should not be used as a proxy for Quwan revenue growth.
            calloutType: risk
            claimRefs:
              - CM010
              - CM013
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and positioning
        blocks:
          - type: paragraph
            body: >-
              Quwan's direct peer set is best defined by the job to be solved rather than by a single product label. TT
              Voice addresses game-adjacent social interaction through voice, text, virtual gifts, and chatrooms,
              placing YY-style team voice and audio-community products such as Lizhi in the direct or adjacent set. Game
              publishers, esports communities, messaging platforms, and status-quo in-game chat are substitutes;
              internal build is feasible for a large publisher but less attractive for a standalone community operator.
              The 2023 prospectus coverage identifies YY and Lizhi as listed comparables, while the 2024 industry report
              shows that mobile games, esports, and multi-platform distribution remain large but competitive categories.
              Quwan's reported advantage is integrated community and monetization, not a public price advantage or
              independently verified current market share.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP008
              - CP015
      - number: '3.2'
        title: Capability, distribution, and monetization trade-offs
        blocks:
          - type: paragraph
            body: >-
              Quwan's disclosed product scope combines real-time voice, social entertainment, virtual-goods
              monetization, esports assets, and an expanding applied-AI layer. That breadth can improve cross-sell and
              engagement, but it also exposes the company to multi-homing: users can move between voice rooms,
              game-native communities, general audio services, and publisher-operated channels. The evidence shows
              strong historical monetization, with value-added and audio-entertainment services representing most 2022
              revenue, but it does not disclose a comparable competitor price sheet, realized take rate, retention
              cohort, or customer acquisition cost. Therefore the buying comparison should emphasize workflow, community
              liquidity, distribution, and trust/regulatory execution rather than infer superior unit economics.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat case rests on accumulated community relationships, game-focused positioning, operating
              experience, and access to adjacent esports and AI capabilities. Those assets may raise the cost of
              recreating a live social graph, but they do not eliminate platform dependence or content and compliance
              risk. Historical evidence also shows a material user decline during the 2022 to early-2023 download pause,
              even as paying users and pay rate rose, which is consistent with monetization resilience but not proof of
              durable top-of-funnel growth. Industry evidence points to rising competition and acquisition costs. A
              Tencent-linked shareholder relationship evidences strategic-capital access, but the reviewed sources do
              not establish exclusive distribution. Current switching costs, partner exclusivity, moderation outcomes,
              and competitor response are not publicly established.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP017
          - type: table
            tableRef: TP003
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP015
      - number: '3.4'
        title: Competitive diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The most decision-relevant missing evidence is current and comparable rather than historical. A buyer or
              investor would need a competitor-by-competitor feature and price capture, common definitions for active
              and paying users, retention by cohort, channel-level acquisition economics, and evidence on whether
              esports, AI, and voice products share users or merely share branding. Public sources also do not establish
              whether YY, Lizhi, game publishers, or messaging platforms can replicate Quwan's community density at
              lower distribution cost. Until those tests are completed, Quwan merits a scaled-platform description with
              medium confidence in differentiation and low confidence in relative pricing power.
            claimRefs:
              - CP008
              - CP012
              - CP015
              - CP017
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Community-led differentiation
            body: >-
              Quwan's strongest evidenced distinction is the combination of game-focused voice interaction, social
              monetization, and esports adjacency; the durability of that combination is not yet independently
              benchmarked.
            calloutType: strength
            claimRefs:
              - CP001
              - CP005
              - CP011
          - type: callout
            title: Historical evidence can overstate current advantage
            body: >-
              The core user and financial comparisons are mostly 2022 or earlier, and a reported download pause
              coincided with MAU decline; current competitor share, retention, and pricing remain open.
            calloutType: risk
            claimRefs:
              - CP011
              - CP012
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Quwan's disclosed monetization is primarily a digital social-entertainment model: users buy virtual items
              while interacting with other users and hosts on TT Voice. The 2022 disclosure summarized by LiveReport
              attributes 74.8% of revenue to value-added services and 23.6% to audio entertainment services, while a
              later 2023 update attributes 72.1% and 25.6% respectively to those categories. That concentration makes
              gross bookings, payer behavior, platform take rate, host economics, and moderation costs more important
              than a generic software-revenue lens. The same 2023 update reports revenue of approximately RMB3.225
              billion, down 5.2% year over year, average monthly active users of approximately 12.8 million, and roughly
              1 million average monthly paying users. These data are company-disclosure summaries reported by financial
              media, not audited current-period statements. The 2022 historical series shows strong scale but also a
              declining gross margin from 65.03% in 2020 to 54.16% in 2022, so the underwriting question is whether
              engagement and monetization can stabilize without proportionate acquisition or content-delivery cost.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI008
      - number: '4.2'
        title: Pricing, cost structure, and unit economics
        blocks:
          - type: paragraph
            body: >-
              Public sources do not disclose a reliable list-price schedule, realized price by virtual-item category,
              platform take rate, host payout rate, CAC, payback, retention cohorts, or contribution margin. The
              monetization mechanism is visible, but the price-to-revenue bridge is not. The 2022 financial summary
              reports gross profit of RMB1.842 billion on revenue of RMB3.402 billion and a 54.16% gross margin; the
              2023 update reports that virtual-item sales were approximately RMB3.107 billion, down about 6.1% year over
              year, and that esports revenue grew to approximately RMB55.662 million while the esports operation
              recorded a 227.3% loss rate. This mix implies that a consolidated margin path can be obscured by
              loss-making adjacent activities and by non-cash accounting effects. Reported 2023 net profit of
              approximately RMB947 million was said to reflect fair-value changes in convertible and
              convertible-redeemable preferred shares; adjusted net profit was approximately RMB607 million, down 8.59%
              year over year. Accordingly, cash earnings, gross-to-net revenue conversion, and service-delivery costs
              remain more decision-useful than headline net income.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI012
              - CI013
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs: []
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Quwan's capital position cannot be refreshed from the assigned public evidence to a current cash, debt,
              burn, or runway view. A 2023 prospectus summary reported RMB935 million of cash and cash equivalents at 31
              December 2022, while another contemporaneous report gave RMB956 million; this small discrepancy is
              unresolved and neither figure is current as of the 2026 run date. The same materials describe historical
              special dividends and a later SPAC process, but they do not establish present liquidity after operating
              needs, distributions, transaction costs, debt obligations, or any post-2023 financing. The proposed PIPE
              was HK$576 million, adjustable to HK$610 million, but HK$298 million was designated to purchase existing
              shares, so the headline amount was not equivalent to new operating cash. Capital intensity also remains
              unresolved: an industry body flags rising development and acquisition costs, while a low-confidence public
              compendium reports cumulative Quwan R&D investment above RMB1.2 billion and a 100,000-square-metre
              headquarters project due for use in 2027 without quantifying remaining commitments. The financial verdict
              is therefore research-more: historical operating economics are credible enough to merit diligence, but
              current revenue quality, cash conversion, capital intensity, and financing dependency remain
              under-disclosed.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate reported revenue and margin history from list-price and unit-economics gaps. Nulls
              are intentional: no assigned source provides a defensible current value, and substituting zero would
              misstate the business. The revenue bridge is a mechanism diagram rather than a forecast; it shows how user
              activity is described as converting into virtual-item and audio-interaction revenue, then into gross
              profit, while retaining the disclosed qualifications around declining activity and unreported take rates.
            claimRefs:
              - CI001
              - CI006
              - CI009
              - CI012
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Historical monetization scale
            body: >-
              The reported 2022 revenue and gross profit base, together with a large paying-user population, supports
              diligence into a scaled operating asset rather than an unproven concept.
            calloutType: strength
            claimRefs:
              - CI003
              - CI006
          - type: callout
            title: Current underwriting gap
            body: >-
              Falling MAU, concentrated virtual-item revenue, an unprofitable esports segment, and unavailable current
              cash and burn data prevent a high-confidence view of cash earnings and runway.
            calloutType: risk
            claimRefs:
              - CI005
              - CI008
              - CI012
              - CI015
          - type: callout
            title: Financing diligence before valuation
            body: >-
              Treat historical profit and proposed PIPE terms as context, not available cash; require current audited
              accounts, cash and debt schedules, and product-line economics before underwriting a valuation.
            calloutType: recommendation
            claimRefs:
              - CI009
              - CI013
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and user workflow
        blocks:
          - type: paragraph
            body: >-
              Quwan's public product surface begins with TT Voice, which independent reporting characterizes as a
              gamer-centric networking platform. The current App Store listing turns that positioning into a concrete
              workflow: users can form game teams, match with teammates, enter multiplayer battle rooms, join music and
              entertainment sessions, and interact around esports. Another prospectus-derived description says users
              communicate through voice, text, virtual gifts, and chatrooms. Together, these sources support a product
              journey from discovery and grouping to live interaction and paid digital participation. They do not
              establish the quality of matching, audio latency, moderation, retention, or the share of users who use
              each feature. The storefront remains company-issued evidence even though Apple hosts it, so broad adoption
              language is not treated as independent proof.
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE007
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE010
              - CE012
              - CE015
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
      - number: '5.2'
        title: Operating model and monetization
        blocks:
          - type: paragraph
            body: >-
              A June 2024 report identifies three core business blocks: TT Voice, TT Esports, and TT Game. TT Voice is
              the economic center in the available evidence. The same report says users buy virtual items while
              interacting with other users and room hosts, and attributes 72.1% of 2023 revenue to TT Voice value-added
              services and 25.6% to host-led interactive services. The resulting 97.7% concentration is a business-model
              fact, not an architecture claim, but it shows why real-time rooms, host tooling, payments, and content
              controls are operationally critical. Esports and game operations widen the engagement surface, yet the
              pool does not disclose module-level users, release cadence, integrations, support load, or current
              roadmap. Product breadth is therefore visible; independent evidence of technical maturity across that
              breadth is not.
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE008
              - CE011
              - CE014
              - CE015
      - number: '5.3'
        title: Technical evidence and the MaskGCT boundary
        blocks:
          - type: paragraph
            body: >-
              The assigned pool contains a substantial public MaskGCT technical trail: an arXiv paper describes a
              two-stage non-autoregressive text-to-speech model, Hugging Face exposes semantic codec, acoustic codec,
              text-to-semantic, and semantic-to-acoustic checkpoints, and the Amphion material documents
              audio-generation tasks and evaluation metrics. A demo page also exposes English and Chinese sample
              transcripts beside audio elements. These artifacts show that a reproducible voice-generation stack exists
              in public, but none of the fetched technical text identifies Quwan as the owner, contributor, operator, or
              production deployer. Accordingly, MaskGCT is treated as an external technical signal rather than Quwan
              differentiation. The required GitHub refresh URL was retained, but its fetched text exposed only a
              JavaScript shell, so no quotation or architecture inference is drawn from it.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Trust, safety, reliability, and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The App Store makes the risk surface visible without proving control effectiveness. It rates the
              application 16+, identifies age assurance and parental controls, and lists unrestricted web access,
              messaging, user-generated content, social media, advertising, and mature or suggestive themes. It also
              says identifiers may be used to track users across apps and websites. Those disclosures create concrete
              diligence questions around youth protection, consent, moderation, content licensing, data retention, and
              advertising governance. Public materials do not provide security certifications, penetration-test
              summaries, uptime or incident history, service-level objectives, privacy-impact assessments, model-safety
              evaluations, or evidence of AI training-data rights. A recent storefront bug-fix note is maintenance
              evidence, not a reliability benchmark. Underwriting technical differentiation requires private production
              proof rather than extrapolation from features or research artifacts.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Coherent game-social workflow
            body: >-
              Public evidence consistently ties TT Voice to game grouping, live voice interaction, entertainment, and
              virtual-item monetization.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE006
          - type: callout
            title: Production technology remains opaque
            body: >-
              Neither product listings nor the external MaskGCT trail establish Quwan's internal architecture,
              reliability, security effectiveness, or deployed AI advantage.
            calloutType: risk
            claimRefs:
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segmentation and customer economics
        blocks:
          - type: paragraph
            body: >-
              Quwan serves a consumer community rather than a disclosed enterprise account base. The buyer, user, and
              payer are often different roles inside the same social loop: a mobile gamer or Gen Z participant uses TT
              Voice for voice, text, chat-room, and social-gaming interaction; users and hosts transact in virtual
              goods; and the platform monetizes those interactions. Public descriptions also place TT Voice beside TT
              Esports and TT Game, but the available evidence does not disclose a customer-level revenue split for those
              adjacent businesses. This makes the core segment identifiable while leaving payer concentration, host
              concentration, geography, and revenue-band segmentation open. The most useful diligence cut is therefore a
              role-based cohort view separating registered users, active users, paying users, and host-side supply
              rather than treating a large registered-user figure as recurring commercial adoption.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU011
      - number: '6.2'
        title: Adoption trajectory and durability
        blocks:
          - type: paragraph
            body: >-
              The disclosed trajectory is mixed. Average monthly active users rose from 12.3 million in 2020 to 16.8
              million in 2021, then fell to 13.8 million in 2022 and approximately 12.8 million in 2023. Average monthly
              paying users increased from 643.9 thousand in 2020 to 965.6 thousand in 2021 and approximately 1.0 million
              in both 2022 and 2023, while the reported paying rate reached 7.2% in 2022. The 2022 filing period
              included a pause in TT Voice downloads from February 2022 through January 2023 and a stated shift toward
              deeper user connection and engagement, so the decline cannot be read as a clean demand signal without
              post-pause cohorts. Revenue concentration reinforces the durability question: 2023 value-added services
              and host-led interaction represented 97.7% of revenue, while virtual-item sales fell about 6.1% year over
              year. No public source in the assigned pool establishes NRR, GRR, churn, renewal, contract length, or
              cohort retention.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU011
              - CU012
              - CU013
      - number: '6.3'
        title: Named proof, expansion, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Named customer proof is thin in the assigned evidence. The strongest public evidence identifies TT Voice
              as a platform for mobile gamers, reports a claimed registered-user base, and identifies Quwan's ownership
              of teams in two franchise esports leagues; it does not identify paying customer names, production
              deployments, customer-quoted outcomes, or independently audited usage. The monetization model can expand
              when users interact more frequently and purchase more virtual gifts, but the same loop creates exposure to
              user-engagement volatility, host supply, platform-policy intervention, and concentration in one core
              service. Apple publishes a transparency process for app-removal requests tied to alleged platform-policy
              violations; that page is not evidence of a Quwan removal, but it is a relevant distribution-control
              dependency for an app-led customer funnel. A current cohort file, named reference list, host economics,
              and app-store incident history are required before expansion or durability can be underwritten.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU002
              - CU003
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is visible; durability is not
            body: >-
              Reported MAU fell from 16.8 million in 2021 to approximately 12.8 million in 2023, while monthly paying
              users stayed near 1.0 million. That combination warrants cohort and payer-quality diligence rather than a
              simple active-user growth narrative.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: callout
            title: Core revenue remains concentrated in interaction monetization
            body: >-
              Value-added services and host-led interaction together represented 97.7% of 2023 revenue, so customer
              durability depends on continued engagement, payer conversion, and host supply.
            calloutType: risk
            claimRefs:
              - CU010
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and investment relevance
        blocks:
          - type: paragraph
            body: >-
              Quwan's risk profile is dominated by platform-governance obligations rather than a single disclosed
              failure. The 2024 legal analysis says China's minors-in-cyberspace framework applies to platforms with a
              large number of minor users or significant impact on minors, and lists impact assessments, a minor mode or
              designated area, an independent oversight body, platform rules, service discontinuation for seriously
              non-compliant providers, and an annual social-responsibility report. The same analysis says the criteria
              for “large number” and “significant impact” await later rules, which creates both compliance work and
              interpretive uncertainty. This matters because Quwan operates a voice and social product aimed at game
              users, and the public materials describe voice, text, virtual gifts, chatrooms and audio entertainment
              rather than a low-interaction utility. Regulatory exposure should therefore be monitored as an operating
              capability: age assurance, moderation, incident response, audit evidence, and controls over time and
              spending are thesis-critical, not disclosure add-ons. The investment implication is a high residual risk
              until Quwan supplies current control testing, enforcement history, and evidence that the current product
              configuration meets applicable requirements.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR010
      - number: '7.2'
        title: Operating, financial and disclosure risks
        blocks:
          - type: paragraph
            body: >-
              The available operating evidence is historical and internally inconsistent in freshness. A 36Kr report
              says average monthly active users fell from 16.8 million in 2021 to 13.8 million in 2022 after TT Voice
              downloads were paused from February 2022 through January 2023, while average monthly paying users rose to
              1.0003 million and the paying rate reached 7.2%. The same report presents 2022 cash and cash equivalents
              of RMB956 million, whereas a separate LiveReport summary of the filing presents RMB935 million; neither
              source is current to this refresh. The difference is a reminder that accounting perimeter, date, or source
              extraction must be reconciled before using cash as runway. Historical profitability also benefited from
              reduced fair-value changes in preferred instruments and lower sales and marketing expense, so reported net
              income should not be treated as recurring cash generation without updated statements. A separate funding
              database page is partially blocked but states that it has one institutional investor, illustrating that
              even apparently simple financing facts need primary cap-table and financing-document confirmation. Until
              audited FY2025 and FY2026 YTD data, current cash, debt, obligations, cohort retention, and incident
              records are obtained, the risk stance should remain conservative.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
      - number: '7.3'
        title: Dependencies, mitigations and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Quwan's dependency stack includes its app distribution and discovery channels, moderation and identity
              infrastructure, payment and virtual-goods controls, cloud and communications availability, and the capital
              and governance process required for a renewed listing. The historical download pause demonstrates that
              distribution interruption can coincide with a material MAU decline even when paying-user metrics improve.
              The legal framework also requires tighter handling of minors' personal information incidents, including
              immediate contingency measures, reporting and affected-user notification for actual or potential leakage,
              as well as access controls and annual compliance audits. These are monitorable dependencies: management
              should provide control ownership, testing cadence, incident counts, time-to-remediation, age-assurance
              coverage, chargeback and fraud rates, uptime, concentration by platform or supplier, and current financing
              runway. A thesis-break event would be a regulator-imposed service restriction, a material unremediated
              privacy or child-safety incident, another prolonged distribution interruption, or evidence that current
              liquidity cannot fund compliance and product investment through the listing process. A non-break but
              material downgrade would be persistent MAU contraction, rising payer concentration, or inability to
              reconcile current financial statements and cap-table terms.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR010
              - CR011
      - number: '7.4'
        title: Diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The decisive next work is evidence collection, not a more precise risk score. Quwan should provide the
              current legal-entity and product map, applicable licenses and registrations, regulator correspondence,
              privacy and minors' data-flow inventories, age-assurance and anti-addiction test results, moderation
              queues and escalation logs, security incidents and notifications, payment and virtual-goods controls,
              supplier and cloud concentration, service-level history, current cash and debt schedules, preferred-share
              and liquidation terms, and monthly cohort and payer data. External checks should reconcile the two
              reported 2022 cash figures, verify the reason and duration of the download pause, inspect any current
              listing or financing documents, and test whether the company has published or internally produced the
              annual minors-protection and compliance artifacts described by the legal framework. These asks are
              material because public evidence does not establish current compliance maturity, absence of incidents, or
              available cash.
            claimRefs:
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-conviction risk
            body: >-
              Minor-protection and personal-information obligations are explicit, broad and operationally demanding,
              while current evidence of Quwan's implementation is absent. Treat compliance maturity as an investment
              gate rather than assuming that no recorded incident means no exposure.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
          - type: callout
            title: Evidence limitation
            body: >-
              The risk assessment uses historical public disclosures and a current legal framework, but it does not
              establish Quwan's FY2025/FY2026 financial position, current incidents, current licenses, or current
              control effectiveness.
            calloutType: assumption
            claimRefs:
              - CR006
              - CR007
              - CR014
              - CR016
          - type: callout
            title: Thesis-break monitoring
            body: >-
              Do not underwrite a stronger recommendation until management reconciles current cash and cap-table terms,
              demonstrates tested age-assurance and incident controls, and shows that distribution continuity and
              cohorts have recovered from the historical download pause.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR010
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Quwan's investment case is anchored in a real monetization history rather than a purely conceptual
              product. A 2023 LiveReport summary of the company's filing reported RMB3.402 billion of 2022 revenue,
              RMB509 million of net profit, and RMB935 million of cash and cash equivalents, while also reporting 13.8
              million average monthly active users and a 7.2% 2022 paying rate. The same source says value-added
              services and audio entertainment represented 74.8% and 23.6% of revenue, respectively. That combination
              indicates a meaningful, high-gross-margin monetization engine, but it is historical and secondary. The
              anti-thesis is equally material: a later 36Kr account says monthly active users fell from 16.8 million in
              2021 to 13.8 million in 2022 after downloads were paused, and a comparable game-centric voice platform,
              DouYu, reported 2024 revenue and gross profit declines plus a net loss. These data do not prove Quwan has
              followed the same path, but they make a stale 2022 profit base an unsafe proxy for current value.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV017
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
              - CV010
              - CV011
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The clearest public financing mark is not a current round but the proposed 2024 de-SPAC structure
              described by Sina Finance: a target equity value of approximately HK$6.892 billion for the transferred
              stake and an approximately HK$8.215 billion combined equity value, with PIPE investors buying at HK$10.00
              per share and committing approximately HK$576 million, adjustable to HK$610 million. The article also
              describes different post-closing ownership outcomes depending on SPAC redemptions. Those figures are
              transaction terms, not proof that the transaction closed or that the mark remains current. The proposed
              structure therefore supplies a historical negotiation anchor and highlights dilution and redemption
              sensitivity, but not a clean present-day valuation. Hurun's 2025 methodology reinforces the need for
              discipline: it uses the most recent sizeable round and industry comparatives when private-company
              performance weakens, while explicitly warning that private valuations are difficult to pin down. An
              investment committee should not underwrite the old mark without updated audited accounts, current
              capitalization, preference rights, and evidence of a live listing path.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV007
              - CV009
              - CV011
              - CV017
              - CV018
      - number: '8.3'
        title: Scenarios and comparable signals
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more reliable than a single point estimate because current Quwan revenue, margin,
              cash, and ownership data are not publicly refreshed in the assigned evidence. The base case assumes the
              historical 2022 earnings profile is not directly portable and keeps the recommendation at research-more
              until current data are obtained. The bull case requires renewed user growth, durable payer conversion, and
              a completed financing or listing at terms that do not transfer disproportionate value to new money. The
              bear case is a down-round or stalled liquidity event after user contraction and monetization pressure.
              Comparable signals are cautionary rather than mechanical: Hurun lists Discord at US$15 billion in its 2025
              social-media section, while TechCrunch reports Discord was last valued at US$14.7 billion in a 2021 US$500
              million fundraise and was only in exploratory IPO discussions in March 2025. JOYY's market capitalization
              was reported at US$4.08 billion on October 22, 2026, but public-market capitalization is not directly
              comparable to Quwan's private transaction marks. The correct use of these references is to set a
              valuation-discipline range and identify sensitivity, not to infer Quwan's value from a peer multiple.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV017
              - CV018
      - number: '8.4'
        title: Decision, exit readiness, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more with medium confidence and high risk. That is a price-sensitive
              conclusion: the business has evidence of scale and historical profitability, but the assigned pool
              contains no current Quwan audited financial statements, no verified 2026 valuation, and no evidence that
              the proposed de-SPAC completed. The first decision gate is a current financial package covering revenue
              quality, gross margin, cash, debt, working capital, and any non-cash fair-value effects. The second is a
              fully diluted cap table showing investor preferences, liquidation waterfalls, PIPE and redemption
              outcomes, and any secondary or post-transaction terms. The third is operating evidence on MAU, paying
              users, payer concentration, retention, AI contribution, and regulatory or app-distribution constraints.
              Exit readiness also requires a documented sponsor path, governance status, audited reporting timetable,
              and an observable transaction process. Until those items are closed, a buyer should require a material
              discount to any old unicorn or de-SPAC reference and define a thesis break as a further user decline,
              inability to demonstrate cash generation, or a materially dilutive financing.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: research-more'
            body: >-
              Quwan has enough historical operating evidence to merit continued diligence, but not enough current
              valuation or capitalization evidence to support a buy.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV007
              - CV017
          - type: callout
            title: Thesis-break trigger
            body: >-
              A further user decline combined with weaker monetization, a materially dilutive financing, or inability to
              produce current audited accounts would break the investability thesis.
            calloutType: risk
            claimRefs:
              - CV004
              - CV018
              - CV020
