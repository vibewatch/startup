      - number: '1.2'
        title: Leadership, governance, and control
        blocks:
          - type: paragraph
            body: >-
              The available leadership evidence points to founder-centered control with experienced operating and
              finance coverage. The 36Kr account identifies Song Ke, Chen Guangyao, and Du Guo as executive directors
              and says Song Ke controlled about 51.92% of voting rights before the proposed IPO through trusts, holding
              entities, and voting arrangements. It also reports that former CFO Sha Dachuan left for Zhihu and that Lu
              Shaoyu became CFO in March 2023, with responsibility for finance and legal management. This combination
              suggests meaningful founder dependence and a governance transition around listing readiness; the public
              pool does not establish a current board roster or whether the 2023 finance appointment remains in place in
              October 2026.
            claimRefs:
              - CO009
              - CO010
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO009
              - CO010
              - CO016
      - number: '1.3'
        title: Capital, valuation, and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              Historical financing evidence is substantial but time-bounded. Dealroom records a February 2021 Series B
              of $100 million at a reported $400 million valuation, while the 36Kr account describes 2020 revenue of
              RMB1.493 billion, 2021 revenue of RMB2.63 billion, and 2022 revenue of RMB3.40 billion. The same 36Kr
              account reports RMB956 million of cash and cash equivalents at the end of 2022, while Eastmoney reports
              RMB935 million for that period. A separate listing analysis reports a proposed combined equity value of
              about HK$8.215 billion and a PIPE purchase price of roughly HK$576-610 million in the 2024 Vision Deal
              transaction. These are not interchangeable measures: historical revenue is not ARR, reported cash is not
              current cash available, and a proposed transaction value is not proof of a completed financing or present
              valuation.
