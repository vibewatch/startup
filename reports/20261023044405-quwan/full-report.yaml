      - number: '1.4'
        title: Milestones and diligence implications
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a progression from TT Voice launch and early game distribution into
              pan-entertainment social, esports, and AI. The available profile records TT Voice's 2014 launch, TT
              Esports in 2019, AI ecosystem work alongside 2021 financing, an AI joint laboratory in 2023, and the 2024
