chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating perimeter
        blocks:
          - type: paragraph
            body: >-
              Quwan's identity is relatively clear even though the public record is not current across every metric.
              Bloomberg describes Guangzhou Quwan Network Technology as developing software, social platforms, and AI
              large models in China, while Dealroom places the company in mobile entertainment and social gaming. A
              company-profile record gives a Guangzhou establishment date of December 13, 2014 and names Song Ke as
              legal representative. The operating perimeter therefore spans a consumer voice-social core, gaming and
              esports adjacencies, and AI products rather than a single narrowly reported SaaS model. TT Voice is
              reported as having more than 200 million cumulative registered users, but that is a registered-user stock,
              not a current active customer count.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
