  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Historical scale and monetization support the asset case, while stale disclosure and liquidity uncertainty
      constrain the recommendation.
    data:
      nodes:
        - id: scale
          label: Historical scale
          detail: 2022 revenue RMB3.402bn; 13.8m average MAU reported in a filing summary.
        - id: monetization
          label: Monetization
          detail: 2022 value-added services represented 74.8% of reported revenue.
        - id: uncertainty
          label: Current uncertainty
          detail: No current audited 2025-2026 Quwan financial package or verified current valuation in the assigned pool.
        - id: liquidity
          label: Liquidity risk
          detail: 2024 de-SPAC terms were proposed; completion and current sponsor path are unverified.
        - id: diligence
          label: Required diligence
          detail: Obtain audited metrics, cap table, preferences, waterfall, and current listing evidence.
        - id: recommendation
          label: Research-more
          detail: Require a current, preference-adjusted price before entry.
      edges:
