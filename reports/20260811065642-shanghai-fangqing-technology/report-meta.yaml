companyProfile:
  summary: >-
    Shanghai Fangqing Technology is a Shanghai-based private AI-infrastructure startup whose public
    story combines Liang Jun's HiSilicon/Cambricon pedigree, a disaggregated system architecture for
    transformer-era workloads, and a remarkably fast capital-formation path that culminated in a
    2026 unicorn valuation. The company appears to be building a full-stack product aimed at cloud,
    enterprise-AI, and compute-network buyers, with first commercialization targeted for late 2026.
    The main diligence constraint is proof density: public evidence validates the opportunity and the
    seriousness of the build, but not yet the product benchmarks, customer traction, or financial
    transparency needed for a high-conviction underwriting decision.
