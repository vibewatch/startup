  topStrengths:
    - Fangqing is pursuing a real infrastructure bottleneck with a differentiated full-stack architecture thesis rather than a generic domestic-chip story.
    - The company has unusually strong strategic and financial validation for its age, including state-backed and industrial investors.
    - Liang Jun's background across HiSilicon and Cambricon gives the team unusual technical credibility in Chinese semiconductor markets.
    - China’s 2026 compute buildout creates a plausible demand window if Fangqing can commercialize on time.
  topRisks:
    - "Public proof still lags the valuation: no named customers, no benchmark pack, and no audited financial disclosure were found."
    - Commercialization timing risk is acute because the company is trying to move from theory-heavy narrative to first product launch in late 2026.
    - Domestic incumbents and better-documented peers may close the same customer problem before Fangqing proves its edge.
    - Supply-chain, compliance, and governance uncertainties remain difficult to rank because disclosure is thin.
  unresolvedGaps:
    - Product brief, benchmark pack, and manufacturing-readiness evidence for the first full-stack system.
    - Named pilot or first-deployment evidence with workload, timeline, and buyer type.
    - Cash runway, production budget, and cap-table / governance clarity at the current mark.
    - A cleaner private-peer set matched on stage, proof, and customer adoption rather than only on domestic AI-chip theme.
