  figureRefs:
  - FI003
- id: capital-uses-and-adequacy
  title: Capital Uses and Adequacy
  body: 'The use-of-proceeds language is more informative than the company''s missing operating metrics. NIO Capital described earlier funding as supporting core technology research, productization, ecosystem development, and market expansion. A1-round coverage adds scale production, software-ecosystem work, and high-end hiring. That combination tells a clear financial story: Fangqing is not just paying for research; it is preparing for manufacturing, commercialization, and field execution. Those are expensive transitions for any AI-infrastructure company. Strong investor backing improves the odds that management can finance the next stage, but it does not answer the central diligence question of how long the cash lasts under base, delay, and acceleration cases. Adequacy should therefore be judged against milestones and burn scenarios, not against headline round sizes alone. In other words, Fangqing may be capitalized for the next stage, but the public record does not show whether management
    is capitalized for multiple slippage scenarios at once.'
  claimRefs:
  - CI004
  - CI005
  - CI020
  - CI022
  - CI023
  - CI031
  - CI034
  tableRefs:
  - TI004
  figureRefs:
  - FI001
- id: revenue-model-and-unit-economics
  title: Revenue Model and Unit Economics
  body: Public evidence supports only a narrow revenue-model view. Fangqing appears to plan future sales of chips, integrated systems, and attached software or service layers, but it does not publish pricing, bookings, or customer contract structure. That means classical SaaS-style efficiency ratios are unavailable and hardware-style unit economics can only be mapped qualitatively. The dominant cost lines are likely engineering payroll, tape-out and validation work, production preparation, ecosystem tooling, and customer enablement. Hiring activity reinforces the idea of an expanding payroll before shipment-backed receipts are visible. If commercialization slips, those costs can continue compounding without a public revenue offset. Investors should thus ask whether the promised architectural advantage can reach paying deployment fast enough to outrun the burn profile implied by the company's hiring and manufacturing ambitions. This is why a launch date is financially meaningful only if it
    converts into payable customer acceptance, not simply product announcement activity.
  claimRefs:
  - CI008
  - CI011
  - CI012
  - CI013
  - CI014
  - CI021
  - CI024
  - CI025
  - CI035
  tableRefs:
  - TI002
  - TI003
  figureRefs:
  - FI002
- id: disclosure-gap-versus-comparables
  title: Disclosure Gap Versus Listed Comparables
  body: 'One of the most important financial facts about Fangqing is comparative, not intrinsic: listed semiconductor companies give investors filing channels, while Fangqing does not. Nvidia, AMD, Broadcom, Marvell, Cambricon, and Hygon all maintain formal disclosure surfaces that let outsiders inspect at least some combination of audited statements, management discussion, and risk factors. Fangqing has no equivalent public filing regime today. That does not make the company weak, but it makes it materially harder to diligence. Public underwriting must lean on milestone logic, disclosed uses of proceeds, and strategic demand signals from data-center expansion and compute policy. The right verdict is therefore cautious but not dismissive: the company may be adequately financed for continued development, yet it is significantly under-disclosed relative to the capital intensity of its mission and the standards set by public comparables. That gap forces outside observers to substitute proxy
    logic for direct financial observation, which is always a weaker underwriting method.'
  claimRefs:
