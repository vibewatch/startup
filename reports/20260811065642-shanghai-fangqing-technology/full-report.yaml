            body: >-
              The next risk cluster sits in execution. Fangqing’s public plan involves self-developed chips and systems,
              scale production, software ecosystem work, and commercialization in a compressed window. That implies
              manufacturing readiness, integration readiness, and customer-support readiness all have to converge at
              roughly the same time. Without public benchmark packs or module-level documentation, outsiders cannot
              verify how close the company is to that convergence. Customer-proof risk compounds the picture, because no
              public deployment evidence yet offsets the possibility of qualification delays or unexpectedly heavy field
              support needs. This is a classic infrastructure risk pattern: the first few customer deployments can
              reveal technical or service burdens that were invisible in the concept stage. In other words, product risk
              here is inseparable from launch risk. A technically interesting platform can still fail its first market
              tests if qualification and support requirements arrive faster than the organization is ready to absorb.
