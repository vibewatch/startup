  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              Fangqing should not be analyzed against the entire semiconductor market, or even against the whole AI-chip
              market. The company's public pitch is narrower: it is building a disaggregated intelligent-computing
              system for transformer inference, so the relevant market is the slice of AI infrastructure spend tied to
              low-latency model serving in data centers, sovereign-compute programs, and large-enterprise AI platforms.
              That means the included spend is not only accelerator silicon, but also the system integration,
              interconnect, rack-level deployment, and software required to make inference workloads economical. Just as
              important are the excluded categories: smartphone SoCs, commodity networking, gaming GPUs, and other chips
              that do not solve the same job. Buyers can also substitute by sticking with Nvidia or Huawei-based
              systems, or by keeping inference inside generalized GPU clusters and internal ASIC roadmaps. The boundary
              logic matters because broad AI-chip TAM rhetoric overstates what Fangqing can realistically capture in its
              first product cycle.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM031
              - CM032
