  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Public Financial Baseline: Capital Raised, Little Else'
        blocks:
          - type: paragraph
            body: >-
              Public sources give Fangqing a recognizable financing history but not a recognizable income statement. The
              company has announced or been associated with angel financing, a large Pre-A sequence, and an August 2026
              A1 round valued above 10 billion yuan. Those disclosures confirm that capital markets believe the
              opportunity is large enough to fund, but they do not establish revenue, margin, or cash conversion. The
              company and media sources consistently point to a future commercialization milestone in Q4 2026, which
              keeps the public financial picture in a pre-revenue or at least pre-disclosure state. InforCapital offers
              a directional estimate of cumulative capital raised, yet even that should be treated as a non-audited
              external summary rather than a definitive ledger. The most supportable baseline is therefore simple:
              Fangqing is financed, but not financially transparent. The absence of even headline revenue or cash data
              is especially important because valuation growth has outpaced disclosure growth. Investors can see
              fundraising momentum, but they cannot yet see whether commercialization efficiency is improving underneath
              it.
