      - number: '3.3'
        title: Pricing, Distribution, and Switching Cost
        blocks:
          - type: paragraph
            body: >-
              Public pricing is thin across almost every private Chinese AI-chip vendor, so comparisons have to use
              second-order signals. Buyers can still observe system breadth, roadmap visibility, order proof, and
              software or community surface. Those signals favor incumbents or scaled peers. Huawei, Cambricon, Moore
              Threads, and MetaX all present broader public stacks than Fangqing. Order-proof commentary around MetaX
              and scaling commentary around Huawei further tilt trust toward vendors with visible deployment momentum.
              Switching cost therefore sits less in list price than in software adaptation, qualification time,
              deployment support, and channel confidence. For Fangqing, that raises the bar: it needs not just a
              differentiated architecture, but also a pathway to persuade buyers that qualifying a new disaggregated
              stack is worth the migration burden. Distribution also matters because channel relationships and
              integrator confidence can compress or lengthen proof-of-concept cycles. Fangqing has not yet shown that
              public go-to-market surface.
            claimRefs:
              - CP019
              - CP022
              - CP023
              - CP028
              - CP033
          - type: table
