  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Direct Peers, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              Fangqing is entering an already crowded domestic AI-compute field. The most powerful incumbent is Huawei
              Ascend, which combines chips, software, community, and documented hardware systems. Cambricon and Biren
              are obvious direct domestic AI-accelerator peers because they already present cloud or data-center
              products publicly. Moore Threads, MetaX, and Enflame broaden the peer set further by offering larger
              product families and louder 2026 product or capital-market narratives. That means Fangqing does not
              compete in an empty “domestic alternative” lane. It competes in a layered landscape that includes
              incumbents, startup-origin peers, and status-quo substitutes such as buying broader domestic systems or
              keeping inference inside generalized GPU clusters and internal ASIC roadmaps. The right first cut is
              therefore not just who also makes chips, but who already offers enough ecosystem or product surface to win
              buyer attention before Fangqing's first system ships. Fangqing also has to be compared against the buyer
              option of doing nothing new: staying inside familiar clusters, incumbent domestic stacks, or internally
              controlled accelerator programs. That substitute set makes the category harsher than a normal
              startup-versus-startup comparison.
            claimRefs:
