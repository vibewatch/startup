  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Fangqing operates in one of the most policy-contested parts of the technology stack. Export-control
              disputes, domestic compute policy, cybersecurity expectations, and data-security obligations all matter at
              once. MOFCOM’s statements make clear that AI-chip trade controls remain an active geopolitical issue,
              while official Chinese legal texts remind diligence teams that infrastructure products touch regulated
              data and network environments. This matters more for Fangqing than it would for a lightweight application
              startup because the company aims to ship core computing systems. Policy support for national compute
              buildout is real, but support can intensify scrutiny rather than reduce it. A pre-commercial company with
              limited public disclosure has less room to absorb an unexpected compliance or policy setback, which is why
              legal and regulatory items belong at the top of the risk list rather than the bottom. This category should
              be treated as persistent, not episodic, because both domestic and cross-border rules can change the
              operating envelope for infrastructure vendors faster than product cycles can adjust.
