      - number: '2.2'
        title: Sizing Lenses and Policy Context
        blocks:
          - type: paragraph
            body: >-
              The macro demand environment is real. JLL says the data-center industry is entering a historic expansion
              phase and expects global capacity to double by 2030, while Chinese policy and summit sources describe a
              national compute-network buildout and a 1.88 million PFLOPS intelligent-compute base by March 2026. Those
              are credible top-down signals that AI infrastructure spend is scaling fast. But they are still outer-bound
              context rather than Fangqing SAM. Aigazine, AInvest, and the DBS excerpt suggest domestic accelerators are
              gaining share and that cloud capex is rising, yet none of those sources tells us Fangqing's price points,
              attach rates, or design-win conversion. The right market conclusion is therefore two-layered: the
              addressable macro environment is large and expanding, but the company-specific serviceable market is still
              unpriced and unproven because Fangqing has not disclosed a commercial denominator. That distinction should
              survive into every later valuation discussion.
