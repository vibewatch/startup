        title: 'Core Technology Story: Causal Density, Disaggregation, and Full-Stack Ambition'
        blocks:
          - type: paragraph
            body: >-
              The company’s public technical voice is unusually centered on ideas. The reviewed essays talk about causal
              networks, causal-intelligence evolution, and causal density as a new physical quantity rather than
              publishing mainstream accelerator collateral. Third-party coverage and investor commentary then connect
              that intellectual framing to a decoupled or disaggregated architecture for transformer-oriented computing.
              Read together, these sources imply Fangqing sees its edge not as a minor chip tweak but as a system-level
              rethinking of memory, compute flow, and inference efficiency. That could be genuinely differentiated. It
              also raises the bar for proof, because the more ambitious the architectural claim, the more important
              implementation evidence becomes. Today the public record demonstrates originality of direction more
              clearly than repeatable engineering validation. This is why the chapter treats theory as an input to
              diligence, not an endpoint. Fangqing may indeed be solving a real systems bottleneck, but the public
