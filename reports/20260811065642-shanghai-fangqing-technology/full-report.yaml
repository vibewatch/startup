  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Public Product Surface: More System Thesis than SKU Catalog'
        blocks:
          - type: paragraph
            body: >-
              Fangqing’s official public surface is still better described as a system thesis than as a mature product
              catalog. The homepage positions the company as a next-generation intelligent-computing systems builder and
              promises cost-effective computing products and services, but it does not expose a conventional hardware
              portfolio, detailed module list, or spec-sheet library. Instead, the site’s visible content leans toward
              article hubs and technical-concept sections. That distinction matters because infrastructure buyers and
              diligence teams normally expect part numbers, system diagrams, memory and interconnect descriptions,
              performance envelopes, or at least a launch-ready product brief. Fangqing currently offers much less of
              that packaging. From public evidence alone, the company looks real and active, but the product surface
              remains thin and interpretive rather than sales-engineered. Even a teaser datasheet, architecture block
              diagram, or launch note would make the company easier to compare with the rest of the domestic accelerator
              field. The absence of those artifacts is itself a product fact, because it shapes how much a buyer can
              pre-qualify from public information.
