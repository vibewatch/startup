      - number: '1.2'
        title: Leadership, Governance, and Founder-Market Fit
        blocks:
          - type: paragraph
            body: >-
              Liang Jun is the anchor around which Fangqing's credibility currently rotates. Multiple independent
              reports and a partner announcement tie him to Huawei's Kirin SoC program and Cambricon's AI chip roadmap
              before his August 2024 arrival as Fangqing CEO. Baike further indicates that the legal-representative role
              shifted after his arrival, which strengthens the case that he became the company's controlling public
              executive rather than an external advisor. At the same time, governance visibility remains thin. The
              public record does not disclose board composition, voting rights, ownership percentages, or committee
              structure, so later chapters should not assume a conventional venture-governed profile simply because the
              investor list is prestigious. TechTimes also adds an adverse wrinkle: Liang's unresolved Cambricon equity
              dispute was still open in 2026, which does not negate his technical credibility but does increase
              key-person and headline risk.
