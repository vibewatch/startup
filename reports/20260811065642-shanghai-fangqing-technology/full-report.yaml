      - number: '2.4'
        title: Growth Drivers, Constraints, and Market Verdict
        blocks:
          - type: paragraph
            body: >-
              The demand drivers are unusually strong: AI-model deployment is broadening, policy is expanding domestic
              compute infrastructure, and export-control pressure keeps Chinese buyers searching for home-grown
              alternatives. Those conditions help explain why investors are willing to finance Fangqing before public
              tape-out. But the constraints are equally real. TechTimes and AInvest both point to supply and proof
              bottlenecks, and Fangqing still has not disclosed tape-out, foundry, process-node, benchmark, or customer
              details. In practical underwriting terms, that means the market case is better described as optionality
              than inevitability. Fangqing is entering a large, urgent, and policy-favored market, but not yet a
              frictionless one. The core open question is whether the company can arrive in time, with enough
              manufacturable performance, to clear enterprise qualification windows before incumbent domestic and
              imported substitutes harden further. That is why the current market verdict should emphasize timing,
              qualification, and conversion risk rather than treating macro policy support as a substitute for
              commercial proof.
