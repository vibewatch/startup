      - number: '3.2'
        title: Profile Comparisons and Capability Breadth
        blocks:
          - type: paragraph
            body: >-
              Capability breadth is where the maturity gap shows up fastest. Huawei documents rack and cluster hardware.
              Cambricon markets cloud AI chips. Biren markets data-center use across multiple industries. Moore Threads
              publishes training and inference GPU product pages, while MetaX already shows multi-series cards, servers,
              and interconnect-linked products. Even Enflame is discussed alongside the “four little dragons” of
              domestic GPUs. Fangqing, by contrast, is still presenting a system thesis and a future Q4 2026
              commercialization target. That difference matters because enterprise buyers compare what they can qualify
              now, not only what could theoretically be better later. Fangqing's architectural wedge may still be real,
              but today it is competing against portfolios and deployment surfaces that are more legible to buyers. In
              practice, breadth is a proxy for who has already invested in documentation, field support, and
              qualification muscle. That is why public product surfaces matter even when they do not fully reveal actual
              shipment scale.
