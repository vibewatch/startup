      - number: '2.3'
        title: Buyers, Adoption Path, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              For Fangqing, the likely first buyers are not consumers or small teams; they are infrastructure buyers
              with capital budgets and a reason to care about latency-per-cost. That points toward cloud platforms,
              sovereign compute projects, model developers, telcos, and large regulated enterprises. The user may be an
              AI-platform or inference engineering team, but the payer is more likely a CTO-led infrastructure
              organization or state-backed compute operator. The adoption path is long: architecture review, software
              adaptation, cluster qualification, procurement approval, and only then scaled deployment. Job postings and
              partner commentary reinforce this enterprise flavor by emphasizing solution, hardware, and systems roles
              rather than self-serve developer growth. That also means early market wins will likely depend on
              credibility, integration support, and policy access at least as much as on raw benchmark claims. The
              practical implication is that Fangqing must win a complex institutional sale, not simply persuade a
              developer to swipe a card and start building.
