    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding Timeline, and Business Thesis
        blocks:
          - type: paragraph
            body: >-
              Shanghai Fangqing Technology should be treated as a Shanghai-based private AI infrastructure startup whose
              public identity is clearer than its operating denominator. The official homepage frames the company as a
              builder of next-generation intelligent computing systems and emphasizes delivering cost-effective AI
              computing products and services, while multiple independent finance stories describe a disaggregated
              architecture and 4D Memory theory aimed at transformer inference efficiency. Public records support a
              September 2022 incorporation date, but multiple 2026 media profiles simplify that into an “early 2023”
              founding; the right diligence move is to preserve both facts and distinguish legal incorporation from
              operational launch. That matters because the company's commercial timeline is still forward-looking rather
              than proven: the public story is about architecture, capital formation, and founder pedigree more than
              shipped revenue or disclosed customers.
