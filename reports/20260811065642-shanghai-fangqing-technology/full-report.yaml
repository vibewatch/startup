      - number: '3.4'
        title: Moat Durability and Competitive Verdict
        blocks:
          - type: paragraph
            body: >-
              Fangqing's moat is currently conceptual, not yet operational. The company may have a sharper
              inference-focused thesis than a generic domestic-GPU story, and that is important. But the field is
              crowded with better-documented domestic rivals and powerful status-quo substitutes. Localization by itself
              is not a moat when every serious peer is also domestic. The real question is whether Fangqing can prove
              that its architecture produces enough latency, cost, or scalability advantage quickly enough to overcome
              ecosystem depth and qualification inertia elsewhere. Until product proof arrives, the competitive verdict
              should stay cautious: Fangqing has a plausible differentiated idea, but not yet a stronger documented
              market position than the incumbents and scaled peers it hopes to displace or outflank. The burden of proof
              remains squarely on forthcoming benchmarks, pilots, and delivery milestones.
