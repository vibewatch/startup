          - type: paragraph
            body: >-
              The milestone chronology now has enough substance to reuse across later chapters, but it is still
              dominated by financing events and forward-looking commercialization claims. Public sources support a
              sequence from 2022 incorporation, 2024 leadership reset under Liang Jun, 2025 angel disclosure, March 2026
