              important capabilities may still be in buildout while launch pressure rises. Founder pedigree can attract
              capital faster than a complete commercialization bench can be assembled, and the public equity-dispute
              narrative makes governance diligence more important, not less. Because Fangqing is under-disclosed
              relative to public semiconductor comparables, risk control has to be milestone-based. The most practical
              mitigations are straightforward: demand evidence gates for product readiness, supplier readiness,
              compliance readiness, first-customer proof, and cash-runway transparency. The correct verdict is cautious
              but actionable. Fangqing is not automatically disqualified by its risks, yet it should only be
              underwritten if diligence can convert several public unknowns into explicit operating controls and clear
              kill criteria. Good diligence can still make this investable, but only by replacing optimism with
