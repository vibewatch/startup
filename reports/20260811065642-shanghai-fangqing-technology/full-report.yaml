    title: Valuation
    sections:
      - number: '8.1'
        title: Current Anchor and What It Really Means
        blocks:
          - type: paragraph
            body: >-
              Fangqing’s public valuation anchor is clear: the August 2026 A1 round put the company above 10 billion
              yuan post-money. What is less clear is what exactly that price is buying today. The company has not yet
              publicly launched its first full-stack product, disclosed revenue, or named reference customers. That
              means the round is not validating a proven operating engine. It is validating a thesis: founder pedigree,
              a differentiated architecture claim, sustained investor appetite, and a large domestic AI-compute market
              opportunity. This distinction is the starting point for the chapter. A 10 billion yuan mark is meaningful,
              but it is meaningful as a forward-looking option on commercialization rather than as a backward-looking
              reflection of disclosed operating performance. The size of the mark matters because it raises the burden
              of proof for every subsequent round and compresses tolerance for a messy launch narrative.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV029
              - CV039
              - CV040
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV014
              - CV020
              - CV029
              - CV040
      - number: '8.2'
        title: Thesis, Anti-Thesis, and Scenario Logic
        blocks:
          - type: paragraph
            body: >-
              The bull case is easy to state. China’s compute buildout is real, data-center and sovereign demand are
              expanding, and Fangqing may still own a sharper inference or cost-performance wedge than broader domestic
              rivals. If the company launches on time and shows credible early proof, the current price could become a
              stepping-stone rather than a ceiling. The anti-thesis is equally clear. Public proof is still thin, peers
              are better documented, and incumbents can move quickly. That leaves the base case in the middle: Fangqing
              may be good enough to justify its current prestige, but not yet transparent enough to deserve materially
              higher pricing from public evidence alone. Bull, base, and bear cases should therefore pivot on
              milestones, not on small adjustments to peer multiples. This is why scenario analysis has to stay grounded
              in operational events. If proof arrives quickly, valuation can re-rate. If proof slips, the same price can
              suddenly look aggressive.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV014
              - CV015
              - CV017
              - CV018
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV023
              - CV024
          - type: table
            tableRef: TV003
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV015
              - CV017
              - CV018
              - CV025
              - CV032
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV035
      - number: '8.3'
        title: Comparables and Valuation Method
        blocks:
          - type: paragraph
            body: >-
              Public market giants provide useful context but poor direct comparability. NVIDIA, TSMC, Broadcom, AMD,
              and Intel all command enormous market caps because they combine scale, revenue, and disclosure depth.
              Their valuations show where semiconductor capital can go after proof, not where a late pre-commercial
              private company must belong today. More relevant context comes from domestic AI-chip enthusiasm around
              Cambricon, Biren, Enflame, and adjacent peers, yet even there Fangqing looks early relative to the mark it
              already carries. That is why a multiple-based approach is less persuasive than a milestone-based approach.
              The asset being priced is the probability that Fangqing can convert architecture and capital into
              customer-visible system proof before better-documented rivals close the same opening. Put differently, the
              comparable set is useful mainly for discipline. It reminds investors that scale and disclosure are what
              eventually justify semiconductor premium valuations in public markets.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV019
              - CV020
              - CV021
              - CV022
          - type: table
            tableRef: TV004
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
      - number: '8.4'
        title: Recommendation, Structure, and Final Asks
        blocks:
          - type: paragraph
            body: >-
              The right recommendation is conditional. For investors with access, strong diligence rights, and the
              ability to negotiate milestone protections, Fangqing can be a reasonable strategic participation candidate
              because the upside is still real. For investors relying mainly on headline unicorn status, the current
              mark looks expensive relative to proof. At this price, information rights, governance rights, and
              post-close milestone reporting matter more than usual. The thesis can break quickly if launch slips,
              pilots do not materialize, or the company cannot convert theory into a visible systems advantage. Final
              diligence should therefore focus less on debating the exact unicorn multiple and more on forcing clarity
              around product proof, customer proof, runway, and structure. Public evidence alone supports interest, but
              not complacency. The practical question is therefore not whether Fangqing is interesting, but whether the
              investor has enough access and leverage to convert uncertainty into monitored milestones. Without that
              access, the safer move is patience rather than paying for optionality that management has not yet
              converted into public proof.
            claimRefs:
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
