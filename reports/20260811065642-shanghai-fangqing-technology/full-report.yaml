              - CV040
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV021
              - CV034
              - CV037
              - CV038
              - CV040
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: This is an option, not a multiple story
            body: >-
              The current valuation is best read as pricing the chance of successful commercialization into a large
              domestic market.
            calloutType: insight
            claimRefs:
              - CV013
              - CV014
              - CV016
