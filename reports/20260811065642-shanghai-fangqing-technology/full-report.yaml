            title: Proof still trails price
            body: Launch, customer proof, and disclosure all remain incomplete relative to the round’s prestige.
            calloutType: risk
            claimRefs:
              - CV002
              - CV015
              - CV039
          - type: callout
            title: Participate only with control
            body: >-
              If an investor cannot secure strong diligence access and milestone protections, watch the name rather than
              chase the valuation.
            calloutType: recommendation
            claimRefs:
              - CV030
