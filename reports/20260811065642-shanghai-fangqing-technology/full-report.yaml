        title: Capital Formation, Investor Base, and Stage
        blocks:
          - type: paragraph
            body: >-
              Capital formation is the best corroborated part of Fangqing's public dossier. The company's 2025 angel
              sequence brought in Xiaomi Strategic Investment, NIO Capital, and Mingshi, with NIO later confirming its
              own participation and leadership of the angel+ round. The March 2026 Pre-A+ round then lifted disclosed
              financing by another 1 billion yuan, before the August 2026 A1 round pushed post-money valuation above 10
              billion yuan. A1 investor composition blended local state capital, broker-affiliated funds, strategic
              healthcare-linked capital, and repeat venture backers, which is stronger evidence of institutional
              conviction than of operating proof. The proceeds statement is also revealing: management is still funding
              chip and system R&D, scaled manufacturing, ecosystem build-out, and senior hiring, which is exactly the
              language of a pre-commercial deep-tech company preparing for first productization rather than a company
              scaling disclosed revenue lines. That is enough to support a late-stage funding label, but not a mature
              operating one.
