        title: Partner, Supply, and Competitive Pressure
        blocks:
          - type: paragraph
            body: >-
              Sector structure adds another layer of risk. Domestic-policy tailwinds do not remove upstream bottlenecks
              in foundry access, memory, packaging, or systems integration. At the same time, incumbents—especially
              Huawei—are moving quickly on both output and roadmap. Analyst commentary also describes a fragmented but
              crowded domestic field, which reduces forgiveness for schedule slips. Demand growth can even become a risk
              if startups scale against anticipated opportunity before they have repeatable proof. Fangqing therefore
              faces a two-sided market hazard: it must be early enough to matter, but not so early that it scales
              assumptions faster than operations. The company’s lack of public supplier detail means this part of the
              risk profile must still be inferred, yet the inference itself is strong enough to matter. The combination
              of incumbent speed and hidden dependency opacity is what makes this cluster dangerous. Even if demand is
              robust, Fangqing still has to reach it through a constrained and highly contested supply environment.
