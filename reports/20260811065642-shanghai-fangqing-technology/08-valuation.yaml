- id: comparables-and-valuation-method
  title: Comparables and Valuation Method
  body: Public market giants provide useful context but poor direct comparability. NVIDIA, TSMC, Broadcom, AMD, and Intel all command enormous market caps because they combine scale, revenue, and disclosure depth. Their valuations show where semiconductor capital can go after proof, not where a late pre-commercial private company must belong today. More relevant context comes from domestic AI-chip enthusiasm around Cambricon, Biren, Enflame, and adjacent peers, yet even there Fangqing looks early relative to the mark it already carries. That is why a multiple-based approach is less persuasive than a milestone-based approach. The asset being priced is the probability that Fangqing can convert architecture and capital into customer-visible system proof before better-documented rivals close the same opening. Put differently, the comparable set is useful mainly for discipline. It reminds investors that scale and disclosure are what eventually justify semiconductor premium valuations in public
    markets.
  claimRefs:
  - CV008
  - CV009
  - CV010
  - CV011
  - CV012
  - CV013
  - CV019
  - CV020
  - CV021
  - CV022
