chapter:
  number: 8
  title: Valuation
  summary: Fangqing’s valuation is best understood as an option on successful late-2026 commercialization in a strategically hot domestic AI-compute market. The current unicorn mark is plausible as a strategic narrative price, but already rich relative to public proof, which supports only conditional participation with strong diligence access and milestone protections.
sections:
- id: anchor-and-current-read
  title: Current Anchor and What It Really Means
  body: 'Fangqing’s public valuation anchor is clear: the August 2026 A1 round put the company above 10 billion yuan post-money. What is less clear is what exactly that price is buying today. The company has not yet publicly launched its first full-stack product, disclosed revenue, or named reference customers. That means the round is not validating a proven operating engine. It is validating a thesis: founder pedigree, a differentiated architecture claim, sustained investor appetite, and a large domestic AI-compute market opportunity. This distinction is the starting point for the chapter. A 10 billion yuan mark is meaningful, but it is meaningful as a forward-looking option on commercialization rather than as a backward-looking reflection of disclosed operating performance. The size of the mark matters because it raises the burden of proof for every subsequent round and compresses tolerance for a messy launch narrative.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV016
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: thesis-antithesis-and-scenarios
  title: Thesis, Anti-Thesis, and Scenario Logic
  body: 'The bull case is easy to state. China’s compute buildout is real, data-center and sovereign demand are expanding, and Fangqing may still own a sharper inference or cost-performance wedge than broader domestic rivals. If the company launches on time and shows credible early proof, the current price could become a stepping-stone rather than a ceiling. The anti-thesis is equally clear. Public proof is still thin, peers are better documented, and incumbents can move quickly. That leaves the base case in the middle: Fangqing may be good enough to justify its current prestige, but not yet transparent enough to deserve materially higher pricing from public evidence alone. Bull, base, and bear cases should therefore pivot on milestones, not on small adjustments to peer multiples. This is why scenario analysis has to stay grounded in operational events. If proof arrives quickly, valuation can re-rate. If proof slips, the same price can suddenly look aggressive.'
  claimRefs:
