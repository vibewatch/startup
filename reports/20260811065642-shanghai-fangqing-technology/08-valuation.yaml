  - TV004
  figureRefs: []
- id: recommendation-structure-and-final-asks
  title: Recommendation, Structure, and Final Asks
  body: The right recommendation is conditional. For investors with access, strong diligence rights, and the ability to negotiate milestone protections, Fangqing can be a reasonable strategic participation candidate because the upside is still real. For investors relying mainly on headline unicorn status, the current mark looks expensive relative to proof. At this price, information rights, governance rights, and post-close milestone reporting matter more than usual. The thesis can break quickly if launch slips, pilots do not materialize, or the company cannot convert theory into a visible systems advantage. Final diligence should therefore focus less on debating the exact unicorn multiple and more on forcing clarity around product proof, customer proof, runway, and structure. Public evidence alone supports interest, but not complacency. The practical question is therefore not whether Fangqing is interesting, but whether the investor has enough access and leverage to convert uncertainty
    into monitored milestones. Without that access, the safer move is patience rather than paying for optionality that management has not yet converted into public proof.
