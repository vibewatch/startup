  - FO003
- id: milestones-open-questions-and-adverse-context
  title: Milestones, Open Questions, and Adverse Context
  body: 'The milestone chronology now has enough substance to reuse across later chapters, but it is still dominated by financing events and forward-looking commercialization claims. Public sources support a sequence from 2022 incorporation, 2024 leadership reset under Liang Jun, 2025 angel disclosure, March 2026 Pre-A+ financing, and August 2026 A1 financing. BigGo and Shuziqushi say the first full-stack system should begin commercialization in Q4 2026, yet public sources still do not disclose tape-out timing, manufacturing partner, process node, revenue, customer count, or board structure. That leaves a stark split between narrative maturity and operating maturity. TechTimes makes the adverse case directly: the technical architecture may be promising, but independent observers still cannot test whether Fangqing can move from architecture thesis to silicon on schedule.  The same article also highlights why that gap matters commercially: a pre-silicon startup can attract strategic capital,
    but it still has to prove manufacturability, customer adoption, and timing discipline before valuation can be defended against later evidence. For underwriting, the chapter''s main conclusion is simple: the company has become a unicorn on team quality and architecture conviction before public product proof has arrived.'
