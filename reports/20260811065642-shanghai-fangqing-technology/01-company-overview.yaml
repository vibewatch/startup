company:
  name: Shanghai Fangqing Technology
chapter:
  number: 1
  title: Company Overview
  summary: Shanghai Fangqing Technology is a Shanghai-based private AI infrastructure startup whose public story is anchored by Liang Jun's Huawei/Cambricon pedigree, a disaggregated transformer-compute architecture, and a fast funding path culminating in an A1 round above RMB 10 billion valuation in August 2026. Public evidence supports strong institutional conviction and a planned Q4 2026 first commercialization, but revenue, customer, tape-out, foundry, and governance disclosures remain materially incomplete.
sections:
- id: identity-and-thesis
  title: Identity, Founding Timeline, and Business Thesis
  body: 'Shanghai Fangqing Technology should be treated as a Shanghai-based private AI infrastructure startup whose public identity is clearer than its operating denominator. The official homepage frames the company as a builder of next-generation intelligent computing systems and emphasizes delivering cost-effective AI computing products and services, while multiple independent finance stories describe a disaggregated architecture and 4D Memory theory aimed at transformer inference efficiency. Public records support a September 2022 incorporation date, but multiple 2026 media profiles simplify that into an “early 2023” founding; the right diligence move is to preserve both facts and distinguish legal incorporation from operational launch. That matters because the company''s commercial timeline is still forward-looking rather than proven: the public story is about architecture, capital formation, and founder pedigree more than shipped revenue or disclosed customers.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO036
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: leadership-governance-and-founder-market-fit
  title: Leadership, Governance, and Founder-Market Fit
  body: 'Liang Jun is the anchor around which Fangqing''s credibility currently rotates. Multiple independent reports and a partner announcement tie him to Huawei''s Kirin SoC program and Cambricon''s AI chip roadmap before his August 2024 arrival as Fangqing CEO. Baike further indicates that the legal-representative role shifted after his arrival, which strengthens the case that he became the company''s controlling public executive rather than an external advisor. At the same time, governance visibility remains thin. The public record does not disclose board composition, voting rights, ownership percentages, or committee structure, so later chapters should not assume a conventional venture-governed profile simply because the investor list is prestigious. TechTimes also adds an adverse wrinkle: Liang''s unresolved Cambricon equity dispute was still open in 2026, which does not negate his technical credibility but does increase key-person and headline risk.'
  claimRefs:
  - CO007
  - CO008
  - CO009
  - CO010
  - CO029
  - CO032
  - CO034
  tableRefs:
  - TO002
- id: capital-formation-and-stage
  title: Capital Formation, Investor Base, and Stage
  body: 'Capital formation is the best corroborated part of Fangqing''s public dossier. The company''s 2025 angel sequence brought in Xiaomi Strategic Investment, NIO Capital, and Mingshi, with NIO later confirming its own participation and leadership of the angel+ round. The March 2026 Pre-A+ round then lifted disclosed financing by another 1 billion yuan, before the August 2026 A1 round pushed post-money valuation above 10 billion yuan. A1 investor composition blended local state capital, broker-affiliated funds, strategic healthcare-linked capital, and repeat venture backers, which is stronger evidence of institutional conviction than of operating proof. The proceeds statement is also revealing: management is still funding chip and system R&D, scaled manufacturing, ecosystem build-out, and senior hiring, which is exactly the language of a pre-commercial deep-tech company preparing for first productization rather than a company scaling disclosed revenue lines. That is enough to support
    a late-stage funding label, but not a mature operating one.'
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
  tableRefs:
