chapter:
  number: 7
  title: Risks
  summary: Fangqing faces a dense risk network rather than a single dominant problem. The most material public clusters are regulatory and compliance exposure, production and proof timing, competitive compression from stronger domestic incumbents, supply-chain opacity, and disclosure-light governance and bench depth.
sections:
- id: regulatory-and-legal
  title: Regulatory and Legal Risk
  body: Fangqing operates in one of the most policy-contested parts of the technology stack. Export-control disputes, domestic compute policy, cybersecurity expectations, and data-security obligations all matter at once. MOFCOM’s statements make clear that AI-chip trade controls remain an active geopolitical issue, while official Chinese legal texts remind diligence teams that infrastructure products touch regulated data and network environments. This matters more for Fangqing than it would for a lightweight application startup because the company aims to ship core computing systems. Policy support for national compute buildout is real, but support can intensify scrutiny rather than reduce it. A pre-commercial company with limited public disclosure has less room to absorb an unexpected compliance or policy setback, which is why legal and regulatory items belong at the top of the risk list rather than the bottom. This category should be treated as persistent, not episodic, because both domestic
    and cross-border rules can change the operating envelope for infrastructure vendors faster than product cycles can adjust.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR026
  - CR029
  - CR030
  - CR039
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-quality-and-go-to-market
  title: Operational, Quality, and Go-to-Market Risk
  body: 'The next risk cluster sits in execution. Fangqing’s public plan involves self-developed chips and systems, scale production, software ecosystem work, and commercialization in a compressed window. That implies manufacturing readiness, integration readiness, and customer-support readiness all have to converge at roughly the same time. Without public benchmark packs or module-level documentation, outsiders cannot verify how close the company is to that convergence. Customer-proof risk compounds the picture, because no public deployment evidence yet offsets the possibility of qualification delays or unexpectedly heavy field support needs. This is a classic infrastructure risk pattern: the first few customer deployments can reveal technical or service burdens that were invisible in the concept stage. In other words, product risk here is inseparable from launch risk. A technically interesting platform can still fail its first market tests if qualification and support requirements arrive
    faster than the organization is ready to absorb.'
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR021
  - CR022
  - CR032
  - CR033
  - CR034
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: partner-supply-and-competitive-pressure
  title: Partner, Supply, and Competitive Pressure
  body: 'Sector structure adds another layer of risk. Domestic-policy tailwinds do not remove upstream bottlenecks in foundry access, memory, packaging, or systems integration. At the same time, incumbents—especially Huawei—are moving quickly on both output and roadmap. Analyst commentary also describes a fragmented but crowded domestic field, which reduces forgiveness for schedule slips. Demand growth can even become a risk if startups scale against anticipated opportunity before they have repeatable proof. Fangqing therefore faces a two-sided market hazard: it must be early enough to matter, but not so early that it scales assumptions faster than operations. The company’s lack of public supplier detail means this part of the risk profile must still be inferred, yet the inference itself is strong enough to matter. The combination of incumbent speed and hidden dependency opacity is what makes this cluster dangerous. Even if demand is robust, Fangqing still has to reach it through a constrained
    and highly contested supply environment.'
  claimRefs:
  - CR015
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR023
  - CR024
  tableRefs:
  - TR003
  figureRefs: []
- id: people-mitigation-and-verdict
  title: People, Mitigation, and Verdict
  body: 'People and governance complete the picture. Active recruiting shows motion, but it also implies that important capabilities may still be in buildout while launch pressure rises. Founder pedigree can attract capital faster than a complete commercialization bench can be assembled, and the public equity-dispute narrative makes governance diligence more important, not less. Because Fangqing is under-disclosed relative to public semiconductor comparables, risk control has to be milestone-based. The most practical mitigations are straightforward: demand evidence gates for product readiness, supplier readiness, compliance readiness, first-customer proof, and cash-runway transparency. The correct verdict is cautious but actionable. Fangqing is not automatically disqualified by its risks, yet it should only be underwritten if diligence can convert several public unknowns into explicit operating controls and clear kill criteria. Good diligence can still make this investable, but only by replacing
    optimism with controls. The more uncertainty remains around launch mechanics, the more explicit the evidence gates need to be.'
  claimRefs:
  - CR007
  - CR008
  - CR012
  - CR013
  - CR014
