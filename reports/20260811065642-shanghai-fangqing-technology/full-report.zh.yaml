companyProfile:
  summary: >-
    Shanghai Fangqing Technology 是一家总部在上海的私营 AI 基础设施初创公司。公开叙事把 Liang Jun 的 HiSilicon/Cambricon 背景、面向 transformer
    时代负载的解耦系统架构，以及一条异常快、最终在 2026 年推到独角兽估值的融资路径放在一起。公司似乎在打造面向云、企业 AI 与算力网络买家的全栈产品，首轮商业化目标定在 2026
    年末。主要尽调约束是证据密度：公开证据能验证机会和建设认真程度，但还不能验证产品基准、客户牵引或财务透明度，无法支撑高信心投资判断。
  foundedDate: '2022-09-29'
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
