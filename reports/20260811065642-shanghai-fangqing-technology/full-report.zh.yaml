      - number: '1.2'
        title: 领导层、治理与创始人-市场匹配
        blocks:
          - type: paragraph
            body: >-
              Liang Jun 是 Fangqing 当前信誉的核心锚点。多篇独立报道和一则合作伙伴公告都把他与 Huawei 的 Kirin SoC 项目、Cambricon 的 AI 芯片路线图联系起来，随后他在
              2024 年 8 月加入 Fangqing 担任 CEO。Baike
              还显示，他到任后法定代表人角色发生变化，这强化了一个判断：他成为公司公开层面的主导高管，而不是外部顾问。与此同时，治理可见度仍低。公开记录没有披露董事会构成、投票权、持股比例或委员会结构，因此后续章节不能因为投资人名单亮眼，就假设公司拥有传统
              VC 治理画像。TechTimes 还增加了一个反向褶皱：Liang 与 Cambricon 未解决的股权纠纷在 2026 年仍未关闭；这不否定他的技术可信度，但会抬高关键人物风险和舆情风险。
