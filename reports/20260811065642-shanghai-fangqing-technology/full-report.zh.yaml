              融资进程是 Fangqing 公开档案中佐证最充分的部分。公司 2025 年天使轮序列引入 Xiaomi Strategic Investment、NIO Capital 和 Mingshi，NIO
              之后确认自身参与并领投天使+轮。2026 年 3 月 Pre-A+ 轮又带来 RMB 1B 披露融资，随后 2026 年 8 月 A1 轮把投后估值推至 RMB 10B 以上。A1
              投资人结构混合了地方国资、券商系基金、医疗健康相关战略资本和复投
              VC；这更能证明机构信心，而不是经营证据。募资用途声明也很关键：管理层仍在为芯片和系统研发、规模化制造、生态建设和高端招聘筹资，这正是一个商业化前深科技公司准备首个产品化的语言，而不是一家正在扩张已披露收入线的公司。它足以支撑“后期融资”标签，但不足以支撑成熟经营标签。
