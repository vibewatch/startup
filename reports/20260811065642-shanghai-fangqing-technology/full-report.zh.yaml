          to: d2
          label: 补足执行人手
        - from: d2
          to: d4
          label: 支撑部署
        - from: d3
          to: d4
          label: 支撑合规使用
        - from: d4
          to: d5
          label: 支撑信心
        - from: d2
          to: d5
          label: 支撑可信度
