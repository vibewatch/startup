      - CR005
      - CR015
      - CR021
      - CR038
      - CR039
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 多项风险不是孤立出现，可能相互传导。
    data:
      nodes:
        - id: x1
          label: 生产延期
        - id: x2
          label: 试点 / 客户证据落空
        - id: x3
          label: 烧钱压力上升
        - id: x4
          label: 竞争位势转弱
        - id: x5
          label: 下一轮审查趋严
      edges:
        - from: x1
          to: x2
          label: 推迟部署
        - from: x1
          to: x3
          label: 拉长成本期
        - from: x2
          to: x4
          label: 削弱市场可信度
        - from: x3
          to: x5
          label: 推高融资疑虑
        - from: x4
          to: x5
          label: 压缩估值容忍度
