  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Fangqing 所处的是技术栈中政策争议最强的部分之一。出口管制争端、国产算力政策、网络安全预期和数据安全义务同时起作用。MOFCOM 的表态说明 AI
              芯片贸易管制仍是活跃的地缘政治问题，官方中国法律文本也提醒尽调团队，基础设施产品会触及受监管的数据和网络环境。对 Fangqing
              来说，这一点比轻量应用初创公司更重要，因为公司目标是交付核心计算系统。国家算力建设的政策支持是真实的，但支持也可能加强审查，而不是降低审查。商业化前、公开披露有限的公司，吸收意外合规或政策挫折的空间更小，因此法律和监管事项应放在风险清单顶部，而不是底部。这个类别应被视为持续性风险，而不是阶段性风险，因为国内和跨境规则都可能比产品周期调整更快地改变基础设施供应商的运营边界。
