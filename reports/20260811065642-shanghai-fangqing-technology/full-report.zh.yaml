    title: 采用 / 部署漏斗
    type: matrix
    layout: wide
    summary: 漏斗在可行细分市场上很宽，在已验证部署上很窄。
    data:
      columns:
        - 细分市场合理性
        - 准入合理性
        - 认证证明
        - 部署证明
      rows:
        - label: 云服务商
          values:
            - 高
            - 中高
            - 低
            - 低
        - label: 互联网 / 模型运营方
          values:
            - 高
            - 中
            - 低
            - 低
        - label: 企业 AI 运营方
          values:
            - 中
