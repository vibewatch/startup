        title: 规模测算视角与政策背景
        blocks:
          - type: paragraph
            body: >-
              宏观需求环境是真实的。JLL 称数据中心行业正在进入历史性扩张阶段，并预计全球容量到 2030 年翻倍；中国政策和峰会来源则描述了全国算力网络建设，以及到 2026 年 3 月达到 1.88 million
              PFLOPS 的智能算力底座。这些都是 AI 基础设施支出快速扩张的可信自上而下信号。但它们仍是外沿背景，不是 Fangqing 的 SAM。Aigazine、AInvest 和 DBS
              摘录暗示国产加速器正在提升份额，云资本开支也在上升，但这些来源没有告诉我们 Fangqing
              的价格点、附加率或设计定点转化。正确的市场结论因此分两层：可触达的宏观环境大且扩张，但公司特定的可服务市场仍未定价、未验证，因为 Fangqing 没有披露商业分母。这个区分应进入后续所有估值讨论。
