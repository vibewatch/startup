    claimRefs:
      - CR012
      - CR021
      - CR025
      - CR035
      - CR040
  - id: FV001
    title: 投资建议逻辑
    type: dag
    layout: wide
    summary: 建议从估值锚点出发，穿过证据缺口，落到有条件投资立场。
    data:
      nodes:
        - id: r1
          label: RMB 10B+ 估值锚点
        - id: r2
          label: 国内 AI 需求庞大
        - id: r3
          label: 公开证据仍薄
        - id: r4
          label: 里程碑投资判断
        - id: r5
          label: 仅有条件参与
      edges:
        - from: r1
          to: r3
          label: 抬高证据门槛
        - from: r2
          to: r4
          label: 支撑上行逻辑
        - from: r3
          to: r4
          label: 无法按指标做投资判断
        - from: r4
          to: r5
          label: 导出投资建议
    approximationNotes: 这是逻辑示意图，不是财务公式。
    claimRefs:
      - CV001
      - CV014
      - CV020
      - CV029
      - CV040
  - id: FV002
    title: 估值敏感性
    type: matrix
    layout: wide
    summary: 估值敏感性更多取决于里程碑证据，而不是公开市场倍数的小幅调整。
    data:
      columns:
        - 上线时间
        - 基准测试证据
        - 客户证据
        - 披露改善
      rows:
        - label: 乐观情景敏感性
          values:
            - 准时
            - 强
            - 具备
            - 强
        - label: 基准情景敏感性
          values:
            - 小幅推迟或准时
            - 部分
            - 有限
            - 部分
        - label: 悲观情景敏感性
          values:
            - 未按期
            - 弱或缺失
            - 缺失
            - 缺失
    claimRefs:
      - CV015
      - CV017
      - CV018
      - CV025
      - CV032
  - id: FV003
    title: 估值回报区间
    type: range
    layout: standard
    summary: 回报逻辑从当前轮次出发做情景推演，不绑定公开盈利或收入倍数。
    data:
      items:
        - label: 乐观情景
          low: 1.5
          mid: 2.5
          high: 4
          unit: x outcome vs current private mark
        - label: 基准情景
          low: 0.9
          mid: 1.1
          high: 1.5
          unit: x outcome vs current private mark
        - label: 悲观情景
          low: 0.2
          mid: 0.5
          high: 0.8
          unit: x outcome vs current private mark
    approximationNotes: 这些只是用于情景思考的方向性结果区间，不是公开市场交易估计。
    claimRefs:
      - CV025
      - CV026
      - CV027
      - CV028
      - CV035
  - id: FV004
    title: 投后 KPI
    type: kpi
    layout: compact
    summary: 投后最重要的 KPI 是里程碑和披露 KPI。
    data:
      items:
        - label: 首个试点证据所需时间
          value: critical
          status: warning
        - label: 基准测试包就绪时间
          value: critical
          status: warning
        - label: 上线后披露质量
          value: must improve
          status: warning
        - label: 客户证据密度
          value: currently low
          status: low
        - label: 当前建议
          value: conditional only
          status: medium
    claimRefs:
      - CV021
      - CV034
      - CV037
      - CV038
      - CV040
