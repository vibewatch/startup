      - number: '8.4'
        title: 建议、结构与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              建议必须带条件。若投资人有准入、强尽调权，并能谈到里程碑保护，Fangqing
              可以是一个合理的战略参与候选，因为上行仍然真实。若投资人主要押注“独角兽”头衔，当前价格相对证据显得昂贵。在这个价格上，信息权、治理权和交割后的里程碑报告比平时更重要。若发布延期、试点没有落地，或公司无法把理论转成可见的系统优势，投资逻辑会很快破裂。因此，最终尽调不要纠缠精确的独角兽倍数，而要逼出四件事的清晰度：产品证据、客户证据、现金跑道和交易结构。仅凭公开证据，Fangqing
              值得关注，但不能让人安心。实际问题不是 Fangqing
              是否有意思，而是投资人是否有足够准入和谈判筹码，把不确定性变成可监控的里程碑。没有这些准入，更安全的选择是等待，而不是为管理层尚未转化为公开证据的可选性买单。
