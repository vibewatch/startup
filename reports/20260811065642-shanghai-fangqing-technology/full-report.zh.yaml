      - CR018
      - CR022
      - CR032
      - CR033
      - CR034
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 执行成败取决于一串技术、组织和市场前置条件。
    data:
      nodes:
        - id: d1
          label: 人才补齐
        - id: d2
          label: 生产就绪
        - id: d3
          label: 合规就绪
        - id: d4
          label: 首个客户证据
        - id: d5
          label: 里程碑融资信心
      edges:
