              目前提供的包装少得多。仅看公开证据，公司真实且活跃，但产品呈现仍薄，且需要解读，而不是已为销售完成工程化包装。哪怕一份预告版数据表、架构框图或发布说明，也会让公司更容易与国产加速器其他玩家比较。这些材料缺席本身就是一个产品事实，因为它决定了买家能从公开信息中预认证多少。
