      - CU030
      - CU034
  - id: FU004
    title: 留存 / 重复使用队列
    type: kpi
    layout: compact
    summary: 公开资料基本还看不到留存类 KPI。
    data:
      items:
        - label: 已披露客户
          value: 0 public
          status: low
        - label: 公开试点证据
          value: 0 public
          status: low
        - label: 重复使用证据
          value: not observable
          status: low
        - label: 客群合理性
          value: high
          status: high
        - label: 上线初期集中度风险
          value: likely high
          status: warning
