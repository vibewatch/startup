      - number: '2.4'
        title: 增长驱动、约束与市场判断
        blocks:
          - type: paragraph
            body: >-
              需求驱动异常强：AI 模型部署正在变宽，政策在扩张国产算力基础设施，出口管制压力让中国买家持续寻找本土替代。这些条件解释了为什么投资人愿意在公开流片前给 Fangqing 融资。但约束同样真实。TechTimes
              和 AInvest 都指向供应与证明瓶颈，Fangqing 也仍未披露流片、代工、工艺节点、基准测试或客户细节。落实到投资判断，市场逻辑更像可选性，而不是必然性。Fangqing
              正进入一个巨大、紧迫且受政策偏好的市场，但市场并非没有摩擦。核心未解问题是：公司能否足够及时地到场，并拿出足够可制造的性能，在现有国产和进口替代方案进一步固化之前通过企业认证窗口。因此，当前市场结论应强调时间、认证和转化风险，而不是把宏观政策支持当作商业证明的替代品。
