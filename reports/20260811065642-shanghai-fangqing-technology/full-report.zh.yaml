  customerFocus: 潜在目标买家包括中国的云厂商、大型互联网与模型运营方、企业 AI 基础设施团队，以及主权或区域算力中心。
  businessModel: 预计是 B2B 硬件与系统供给模式，可能叠加软件和部署支持；但公开定价、合同结构和利润率画像仍未披露。
