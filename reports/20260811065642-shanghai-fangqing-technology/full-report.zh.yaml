            body: >-
              上市巨头能提供背景，但直接可比性很差。NVIDIA、TSMC、Broadcom、AMD 和 Intel
              之所以拥有庞大市值，是因为它们同时有规模、收入和披露深度。它们的估值说明，半导体资本在证据跑通后能走到哪里，而不是一家商业化前夜、未上市公司的今天必须站在哪里。更相关的参照来自国内对 AI 芯片的热情，围绕
              Cambricon、Biren、Enflame 及邻近公司；即便如此，相对已经背负的价格，Fangqing 仍显得早。因此，基于倍数的方法不如基于里程碑的方法有说服力。市场在给什么定价？是 Fangqing
              能否赶在披露更充分的竞争对手堵上同一窗口前，把架构和资本转化为客户看得见的系统证据。换句话说，可比公司主要用于约束纪律：它提醒投资人，最终在公开市场支撑半导体溢价估值的，是规模和披露。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
