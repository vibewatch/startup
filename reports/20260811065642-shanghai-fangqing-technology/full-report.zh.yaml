  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 Fangqing 放进整个半导体市场分析，甚至也不应放进整个 AI 芯片市场。公司的公开卖点更窄：它在为 transformer 推理打造解耦式智能计算系统，因此相关市场是 AI
              基础设施支出中与数据中心低延迟模型服务、主权算力项目和大型企业 AI
              平台绑定的那一块。这意味着纳入支出不只是加速器芯片，还包括让推理负载变得经济所需的系统集成、互连、机架级部署和软件。同样重要的是排除项：智能手机 SoC、通用网络设备、游戏
              GPU，以及其他并不解决同一工作的芯片。买家也可以选择替代方案：继续使用 Nvidia 或 Huawei 系系统，或把推理留在通用 GPU 集群和内部 ASIC 路线图里。边界逻辑很重要，因为宽泛的 AI 芯片
              TAM 叙事会高估 Fangqing 在首个产品周期中现实可捕获的空间。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM031
              - CM032
