      - number: '2.3'
        title: 买家、采用路径与预算归属
        blocks:
          - type: paragraph
            body: >-
              Fangqing 的首批买家大概率不是消费者或小团队，而是有资本预算、在意单位延迟成本的基础设施买家。它指向云平台、主权算力项目、模型开发商、运营商和大型受监管企业。使用者可能是 AI
              平台或推理工程团队，但付款方更可能是 CTO
              牵头的基础设施组织，或国资背景算力运营方。采用路径很长：架构评审、软件适配、集群认证、采购审批，然后才是规模化部署。招聘信息和合作伙伴评论也强化了这种企业化特征，它们强调解决方案、硬件和系统岗位，而不是自助式开发者增长。这也意味着早期市场胜利很可能至少同样依赖可信度、集成支持和政策通道，而不只是原始基准测试说法。实际含义是：Fangqing
              必须拿下一笔复杂的机构销售，而不是简单说服开发者刷卡开工。
