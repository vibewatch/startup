            body: >-
              公开来源给了 Fangqing 一段清晰可识别的融资历史，却没有给出可识别的利润表。公司宣布或被关联到天使轮融资、大型 Pre-A 序列，以及 2026 年 8 月估值超过 RMB 10B 的 A1
              轮。这些披露确认资本市场相信机会大到值得融资，但没有证明收入、利润率或现金转化。公司和媒体来源持续指向 2026 年 Q4
              的未来商业化里程碑，这让公开财务图景停留在收入前，或至少披露前状态。InforCapital
              给出了累计融资的方向性估计，但即使这个数字也应视为未经审计的外部摘要，而不是确定账本。因此，最能支撑的基线很简单：Fangqing
              有融资，但财务不透明。连概括性收入或现金数据都缺席，这一点尤其重要，因为估值增长已经跑在披露增长前面。投资人能看到融资动能，但还看不到其下方商业化效率是否正在改善。
