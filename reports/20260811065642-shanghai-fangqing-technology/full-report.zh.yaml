            body: >-
              Shanghai Fangqing Technology 应被视作总部在上海的私营 AI 基础设施初创公司：公开身份比经营底数更清楚。官网把公司定位为下一代智能计算系统建设者，强调交付高性价比 AI
              计算产品和服务；多篇独立财经报道则描述其面向 transformer 推理效率的解耦架构和 4D Memory 理论。公开记录支持 2022 年 9 月的注册成立日期，但多篇 2026
              年媒体画像将其简化为“2023
