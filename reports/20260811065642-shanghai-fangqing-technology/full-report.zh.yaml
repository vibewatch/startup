      - CU021
      - CU022
      - CU030
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高风险格子集中在监管、执行节奏、竞争压力和证据透明度不足。
    data:
      columns:
        - 发生概率
        - 影响
      rows:
        - label: 监管 / 法律
          values:
            - 中高
            - 高
        - label: 运营 / 质量
          values:
            - 高
            - 高
        - label: 供应链 / 依赖
