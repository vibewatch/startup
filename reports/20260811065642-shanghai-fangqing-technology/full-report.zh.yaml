  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、现有巨头与替代方案
        blocks:
          - type: paragraph
            body: >-
              Fangqing 进入的是已经拥挤的国产 AI 算力赛道。最强现有巨头是 Huawei Ascend，它把芯片、软件、社区和有文档的硬件系统组合在一起。Cambricon 和 Biren 是显而易见的国产 AI
              加速器直接同行，因为它们已经公开展示云或数据中心产品。Moore Threads、MetaX 和 Enflame 通过更大的产品族、更响的 2026 年产品或资本市场叙事进一步扩展了同行集合。这意味着
              Fangqing 并不在一条空白的“国产替代”车道里竞争。它所在的分层格局包括现有巨头、创业出身同行，以及维持现状的替代方案，例如购买更广泛的国产系统，或把推理留在通用 GPU 集群和内部 ASIC
              路线图里。因此，第一刀不只是看谁也做芯片，而是看 Fangqing 首个系统出货前，谁已经提供足够生态或产品可见度来赢得买家注意。Fangqing
