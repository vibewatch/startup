  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 当前公开证据能支撑市场需求，但具名客户层面的证明偏弱。
    data:
      columns:
        - 目标细分市场合理性
        - 商业化时点
        - 具名客户证明
        - 重复使用证明
      rows:
        - label: Fangqing 现状
          values:
            - 高
            - 中
            - 低
            - 低
        - label: 公共政策背景
          values:
            - 高
            - 中
            - none
            - none
        - label: 投资人 / 合作方语境
          values:
            - 中
            - 中
            - none
            - none
        - label: 同业公开叙事
          values:
            - 高
            - 中高
            - 中
