chapter:
  number: 2
  title: Market Analysis
  summary: 'Fangqing is pointed at a large and policy-accelerated China AI-infrastructure market, but the relevant wedge is much narrower than generic AI-chip TAM language suggests: low-latency inference systems for cloud, sovereign, and enterprise buyers. Public sources support real demand expansion and domestic-substitution momentum, yet Fangqing''s company-specific SAM remains unpriced because buyers, benchmarks, supply constraints, and first design wins are still largely undisclosed.'
sections:
- id: market-boundary-and-relevant-spend
  title: Market Boundary, Included Spend, and Substitutes
  body: 'Fangqing should not be analyzed against the entire semiconductor market, or even against the whole AI-chip market. The company''s public pitch is narrower: it is building a disaggregated intelligent-computing system for transformer inference, so the relevant market is the slice of AI infrastructure spend tied to low-latency model serving in data centers, sovereign-compute programs, and large-enterprise AI platforms. That means the included spend is not only accelerator silicon, but also the system integration, interconnect, rack-level deployment, and software required to make inference workloads economical. Just as important are the excluded categories: smartphone SoCs, commodity networking, gaming GPUs, and other chips that do not solve the same job. Buyers can also substitute by sticking with Nvidia or Huawei-based systems, or by keeping inference inside generalized GPU clusters and internal ASIC roadmaps. The boundary logic matters because broad AI-chip TAM rhetoric overstates
    what Fangqing can realistically capture in its first product cycle.'
  claimRefs:
  - CM004
  - CM005
  - CM006
  - CM031
  - CM032
  tableRefs:
  - TM001
  figureRefs: []
- id: sizing-lenses-and-policy-context
  title: Sizing Lenses and Policy Context
  body: 'The macro demand environment is real. JLL says the data-center industry is entering a historic expansion phase and expects global capacity to double by 2030, while Chinese policy and summit sources describe a national compute-network buildout and a 1.88 million PFLOPS intelligent-compute base by March 2026. Those are credible top-down signals that AI infrastructure spend is scaling fast. But they are still outer-bound context rather than Fangqing SAM. Aigazine, AInvest, and the DBS excerpt suggest domestic accelerators are gaining share and that cloud capex is rising, yet none of those sources tells us Fangqing''s price points, attach rates, or design-win conversion. The right market conclusion is therefore two-layered: the addressable macro environment is large and expanding, but the company-specific serviceable market is still unpriced and unproven because Fangqing has not disclosed a commercial denominator. That distinction should survive into every later valuation discussion.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM007
  - CM008
  - CM009
  - CM010
