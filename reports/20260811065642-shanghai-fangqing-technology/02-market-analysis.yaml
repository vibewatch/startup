  - - Internal custom ASIC / in-house build
    - Potentially competing spend that never becomes Fangqing revenue
    - Third-party startup system purchases
    - Major internet companies
    - Important leakage from broad domestic AI spend
  notes: The boundary logic is more important than any single TAM number because Fangqing's public narrative is inference-system specific.
