  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Fangqing
  - Diligence ask
  rows:
  - - National compute-network policy
    - Positive
    - Current
    - Expands long-term addressable infrastructure surface
    - Identify which policy programs can translate into actual procurement
  - - Data-center super-cycle
    - Positive
    - Current to medium term
    - Creates more facility and power context for AI-system deployment
    - Clarify where AI-specific capex sits inside broader expansion
  - - Domestic-substitution pressure
    - Positive
    - Current
    - Keeps buyers looking for non-Nvidia options
    - Test whether this becomes pilot demand or actual orders
  - - Inference-cost sensitivity
    - Positive
    - Current
    - Improves relevance of system-level latency and memory efficiency claims
    - Request benchmark-to-TCO mapping
  - - Foundry / packaging bottlenecks
    - Negative
    - Current
    - Could delay product or raise effective cost
    - Request tape-out and supply-chain roadmap
  - - Software migration / qualification burden
    - Negative
    - Current
    - Slows adoption even if hardware thesis is sound
    - Request framework compatibility and developer tooling proof
  - - Undisclosed customer and benchmark proof
    - Negative
    - Current
    - Makes SAM less bankable than macro TAM
    - Request named pilot or design-win evidence
  - - State-backed access vs independent demand
    - Mixed
    - Current
    - May accelerate introductions without proving market pull
    - Separate policy-linked pilots from repeat commercial orders
  notes: The market is attractive, but the main blockers are still execution and qualification rather than raw absence of demand.
