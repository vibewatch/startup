chapter:
  number: 6
  title: Customers
  summary: Fangqing appears aimed at real AI-infrastructure buyers, but public evidence still stops short of customer traction. The most credible current read is strong segment plausibility, serious go-to-market preparation, and a pronounced lack of named customer, pilot, deployment, retention, or concentration proof.
sections:
- id: customer-baseline
  title: 'Customer Baseline: Real Buyer Intent, No Named Public Customers'
  body: 'Fangqing’s public customer story starts with intent, not proof. The official site says the company aims to provide cost-effective computing products and services to customers, and investor or media coverage consistently frames Fangqing as building toward commercialization. But the reviewed sources did not name a production customer, an announced pilot, or a deployment case study. The Q4 2026 commercialization target is therefore crucial context: Fangqing seems close enough to market to talk about customers, yet still too early in public disclosure to show reference logos. That does not invalidate the business. It does mean the customer chapter has to separate plausible demand from verified adoption very carefully. Right now, the strongest honest baseline is that Fangqing appears to be preparing for external buyers while remaining one milestone short of public traction evidence. The absence of names is not surprising for a late pre-commercial hardware company, but it still creates
    a real diligence handicap because it prevents outsiders from testing adoption speed with concrete examples.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU029
  - CU034
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: likely-segments-and-demand-context
  title: Likely Segments and Demand Context
  body: Public market and policy signals make Fangqing’s likely target segments relatively easy to infer. China’s 2026 compute buildout is concentrated in cloud platforms, large-model infrastructure, data centers, and state-linked compute programs. Fangqing’s own architecture is discussed in relation to inference efficiency and transformer-serving workloads, which points toward customers that run substantial AI inference or mixed training-and-inference estates. That likely includes cloud providers, large internet companies, enterprise AI operators, and sovereign or regional compute centers. These are not proven Fangqing customers; they are the most credible customer classes given the company’s product direction and the market structure around it. The important nuance is that demand context is strong even though account-level validation is still absent. The newly fetched Alibaba Cloud GPU-service page also reinforces that cloud operators remain a natural first segment for any domestic AI-compute
    supplier trying to attach to large inference demand.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU018
  - CU019
  - CU030
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: proof-gap-retention-and-concentration
  title: Proof Gap, Retention, and Concentration
  body: 'Because Fangqing is still pre-commercial in public evidence, the usual customer-quality metrics are simply not observable. There is no retention curve, no repeat-purchase data, no satisfaction evidence, and no public concentration breakdown. Investors should resist filling that gap with optimism or pessimism. The right move is to mark those fields as unknown. At the same time, infrastructure-company logic does allow one careful inference: if Fangqing converts successfully, its first phase is likely to be concentrated in a small number of deep accounts rather than a broad base of small customers. That makes the first named logo disproportionately important. One real pilot or deployment would inform segmentation, adoption stage, support burden, and concentration risk all at once. Until then, peer comparison mostly serves to highlight how much customer proof Fangqing has not yet exposed. In that sense, this chapter is less about current satisfaction and more about what kind of first-account
    evidence would make satisfaction measurable later.'
  claimRefs:
  - CU008
  - CU009
  - CU012
  - CU013
  - CU020
  - CU021
  - CU022
  - CU023
  - CU031
  - CU033
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU004
- id: adoption-readiness-and-verdict
  title: Adoption Readiness and Verdict
  body: 'The most encouraging public signals sit upstream of revenue: hiring, product timing, and ecosystem language. Recruiting activity suggests the company is building execution capacity in advance of launch. The commercialization timeline implies that the next plausible customer stages are pilot, qualification, and initial design-in rather than mass deployment. If Fangqing can turn investor and policy access into repeat commercial accounts, the customer picture could improve quickly after launch. If it cannot, then today’s strong narrative and financing base may overstate actual product pull. The correct verdict from current evidence is therefore balanced. Fangqing seems aimed at real infrastructure buyers and seems to be building toward them seriously, but public sources still do not let outsiders verify customer traction. The first named pilot or production deployment remains the single most important artifact to watch after commercialization begins. Management credibility after launch
    will depend heavily on whether those first accounts are visible enough to establish a repeatable reference pattern.'
