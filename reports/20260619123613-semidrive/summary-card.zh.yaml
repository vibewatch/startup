  headline: SemiDrive 是中国能力最强的国产车规芯片设计公司之一，已打进 OEM 规模化供应链，并有国资支持；但收入不透明和美国出口管制风险压住买入信心——在收入披露和 C 轮估值确认前，维持观察。
