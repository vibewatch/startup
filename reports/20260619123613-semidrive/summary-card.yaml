  headline: >-
    SemiDrive is China's most capable domestic automotive chip designer with proven OEM-scale penetration and
    state-capital backing, but revenue opacity and US export-control risk constrain buy conviction — TRACK pending
    revenue disclosure and C-round valuation confirmation.
