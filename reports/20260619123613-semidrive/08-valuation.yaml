chapter:
  number: 8
  title: Valuation
  summary: >
    SemiDrive's May 2026 C-round (~$100M, cumulative raised >¥44B RMB) extends
    a funding trajectory anchored by a CB Insights-estimated July 2024 B-III
    implied valuation of $1.79–$1.93B. Revenue remains undisclosed, preventing
    precise price-sensitive judgment; scenario analysis applying Black Sesame's
    5.9x and Horizon Robotics' 13.3x EV/Revenue comp multiples to estimated
    revenue of $150–$350M yields a bull/base/bear enterprise value range of
    roughly $0.9B–$3.9B. The recommendation is TRACK: strong operational
    proof points and state-capital backing anchor the upside, while private
    revenue opacity, US geopolitical chip risks, and Qualcomm competitive
    pressure limit buy conviction at undisclosed C-round entry price.

sections:
  - id: investment-thesis-and-anti-thesis
    title: Investment Thesis and Anti-Thesis
    body: >
      SemiDrive occupies a structurally advantaged position in China's
      automotive chip supply chain. As one of the world's few companies
      simultaneously offering automotive-grade SoCs and high-performance MCUs,
      it has shipped more than 12 million chips since 2021, serves all of the
      top-10 China OEM groups, and achieved a 3.77% share of China's passenger
      car intelligent-cockpit pre-installation market in 2025—fifth overall and
      first among domestic suppliers. The May 2026 C-round (~$100M led by
      Suzhou state capital with Shaanxi Auto as a new strategic shareholder)
      validates continued institutional confidence and underscores a political
      imperative for domestic automotive chip self-sufficiency. The
      embodied-intelligence pivot to the R1 and D9-Max product lines expands the
      total addressable market optionality. Against these strengths, the
      anti-thesis is anchored by private revenue opacity (no financial
      disclosures) which prevents price-sensitive validation at the C-round
      implied price. The $100M C-round spread across three business lines
      (cockpit SoC, MCU/vehicle-control, embodied intelligence) constrains
      per-segment R&D budget at a time when 4nm process transitions and
      cockpit-driving integration SoCs require intensive capital. Qualcomm's
      SA8775P and SA8797 are already in Chinese mass-production vehicles, and
      US export-control clarifications in June 2026 expand AI-chip restrictions
      to Chinese-owned entities abroad, potentially affecting advanced-node
      access over the medium term. Horizon Robotics' stock has declined over 51%
      from its end-2025 peak, illustrating multiple-compression risk for Chinese
      automotive AI chip names even after successful IPO. The recommendation is
      TRACK, not buy: the thesis requires revenue disclosure, cap-table clarity,
      and C-round valuation confirmation before a price-sensitive investment
      decision can be supported by the available evidence.
