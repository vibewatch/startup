  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-opacity
      missingEvidence: "Audited or management-reported annual revenue and gross margin by product line for 2023, 2024, and 2025"
      whyItMatters: "Revenue is the denominator in all EV/Revenue comparable analysis; without it, the valuation range spans $885M–$3.85B+ and no price-sensitive investment judgment can be made with high confidence."
      diligencePath: "Request pre-IPO investor presentation from company IR; monitor HKEX listing application (A23/prospectus form) or STAR Market CSRC registration filings for public disclosure"
      relatedQuestionRefs:
        - QV001
        - QV009

    - type: private-evidence-only
      severity: blocking
      topic: cap-table
      missingEvidence: "Full cap table showing ownership percentages by investor class, liquidation preference terms, anti-dilution provisions, and participation rights for all funding rounds"
      whyItMatters: "Preference stack determines actual return outcomes in bear and base scenarios; a large liquidation overhang could eliminate common-share economics even in a base-case IPO scenario."
      diligencePath: "Legal counsel due diligence via data room; review HKEX prospectus filings when available; engage CB Insights paid tier for deal terms (B-III terms partially redacted in free tier)"
      relatedQuestionRefs:
        - QV022
        - QV023

    - type: private-evidence-only
      severity: material
