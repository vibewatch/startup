  - id: bull-base-bear-scenarios
    title: Bull, Base, and Bear Valuation Scenarios
    body: >
      Three scenarios bracket the SemiDrive investment thesis, each combining an
      estimated revenue range with a justifiable EV/Revenue multiple. All revenue
      figures are scenario estimates derived from shipment volume and ASP logic
      and are explicitly not confirmed company disclosures. Bull scenario: By
      2027, SemiDrive successfully completes an H-share or A-share IPO, having
      demonstrated accelerating cockpit-SoC adoption (4nm X10 entering mass
      production in 2026), global OEM supply commencement, and embodied
      intelligence early-stage revenues. Estimated revenue reaches $350M+ with
      gross margins recovering toward 40%+; IPO multiple of ~11x EV/Revenue
      (premium to Black Sesame for scale and global reach) implies an enterprise
      value of $3.85B+. Base scenario: Revenue growth continues but global
      expansion and embodied-intelligence monetization are delayed by 12–18
      months; estimated revenue of ~$250M at a 8x EV/Revenue multiple implies
      enterprise value ~$2.0B—modest premium over the B-III implied floor.
      C-round investors approximately break even or earn a modest return; IPO
      valuation visibility is achievable within 2 years if profitability pathway
      is confirmed. Bear scenario: Automotive semiconductor cyclical downturn
      (as seen in NXP's 2024–2025 revenue contraction) combines with
      Qualcomm/Renesas competitive displacement in the MCU segment; embodied
      intelligence commercialization is deferred; estimated revenue of $150M
      at a 5.9x comp multiple (matching Black Sesame, a peer with similar scale
      but proven public market status) implies enterprise value ~$885M—a
      potential down-round from the $1.8B+ B-III anchor. Bear triggers include
      US sanctions tightening to affect SMIC or TSMC access, a notable OEM
      customer loss, and a failed cross-domain SoC product cycle. The base
      scenario is the central case; the bull requires key near-term catalysts
      (revenue disclosure, IPO filing, first-overseas-OEM confirmed shipment)
      to materialize.
