  - id: exit-readiness-and-diligence-asks
    title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
    body: >
      SemiDrive's most natural exit pathway is an IPO—either on the Shanghai
      STAR Market (A-share) or Hong Kong Exchange (H-share), following the path
      of peers like Black Sesame (HKEX IPO in 2024) and Horizon Robotics
      (HKEX IPO in 2024). Chinese press coverage already labels SemiDrive as an
      "automotive chip unicorn," and multiple rounds of state capital
      participation reduce IPO regulatory friction. The IPO timeline is not
      publicly disclosed; the company has not filed any S-1 or prospectus as of
      the research date. Secondary sale to a strategic acquirer (e.g., a major
      Chinese OEM, tier-1 supplier, or pan-Chinese semiconductor group) is a
      lower-probability alternative given the strategic value of the company's
      independence. M&A by a Western semiconductor firm faces regulatory hurdles
      given SemiDrive's strategic importance to China's automotive self-reliance
      agenda. The thesis-break triggers center on operational execution, market
      environment, and capital-access risks. The geopolitical risk is
      particularly material: US export-control clarifications in June 2026 that
      extend restrictions on advanced AI chips to Chinese-owned entities
      operating overseas could, if broadened further, affect SemiDrive's access
      to advanced fabrication nodes for its next-generation 4nm X10 SoC and R1
      embodied-intelligence chip series. Given state-capital dominance in the
      cap table, a strategic secondary exit is unlikely without government
      alignment; the primary liquidity event is therefore an IPO, making the
      IPO timeline and valuation the key monitoring variable for any position
      holder.
