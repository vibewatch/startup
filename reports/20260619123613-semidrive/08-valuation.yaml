  - id: comparable-valuation-analysis
    title: Comparable Valuation Analysis
    body: >
      Given SemiDrive's private status and lack of disclosed revenue, valuation
      must rely on public-company and private-round benchmarks. The most
      directly comparable listed peer is Black Sesame Technologies (HKEX:02533),
      a Chinese automotive-grade SoC designer focused on ADAS. As of June 18,
      2026, Black Sesame has a market cap of approximately $1 billion, an
      enterprise value of $966M, and LTM revenue of $163M, yielding an
      EV/Revenue of 5.9x despite unprofitability (EBITDA margin -105%). Black
      Sesame grew revenue 75% year-over-year in FY2024; the high growth rate
      partially justifies its premium to mature comps. Horizon Robotics
      (HKG:9660), a Chinese ADAS-software-weighted company, trades at a
      significantly higher EV/Revenue of approximately 13.3x (EV HKD 55.77B,
      revenue HKD 4.18B as of June 18, 2026), but this premium largely reflects
      its software and algorithm content rather than chip-only revenues—making
      it a looser comparable for SemiDrive's hardware-centric business model.
      Horizon's stock has fallen 51% from its end-2025 peak, signaling
      sentiment volatility. Among mature Western comparables, NXP Semiconductors
      ($79.09B market cap, $12.62B TTM revenue, P/S ~6.3x) and STMicroelectronics
      ($69.67B market cap, ~$12.38B TTM revenue, P/S ~5.6x) trade at lower
      multiples reflecting cyclical maturity and profitability. A Chinese growth
      premium over these names is supportable for a high-growth domestic player
      but likely compresses toward NXP/ST levels post-IPO at scale. Qualcomm's
      Snapdragon Automotive platform provides an indirect cross-check: Qualcomm's
      automotive revenue was growing strongly but is diluted within the broader
      Qualcomm P/S. For SemiDrive, a blended comp EV/Revenue multiple of 6–10x
      appears defensible, weighted toward the lower end absent profitability
      evidence and subject to revenue estimation uncertainty. Using CB Insights'
      B-III implied valuation of $1.79-1.93B as a floor anchor, the C-round
      likely established a new floor above $2B, though this is inferred, not
      confirmed.
