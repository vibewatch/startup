      missingEvidence: "Confirmed C-round post-money valuation to determine whether a flat or down round occurred relative to the July 2024 B-III implied $1.79–$1.93B; any internal board discussion or investor communication"
      whyItMatters: "A flat or down round would signal loss of investor confidence and compress future IPO valuation expectations; currently cannot be confirmed or refuted from public evidence."
