  - id: financing-and-valuation-context
    title: Financing and Valuation Context
    body: >
      SemiDrive's capital formation history provides the primary valuation
      anchor. CB Insights records nine funding rounds and a total raised of
      $504.55M, though the company's own disclosures indicate cumulative Chinese
      raises exceeding ¥44 billion RMB (approximately $6.1B at current exchange
      rates), suggesting a more complete picture of capital deployment than the
      CB Insights USD figure captures. The July 2024 Series B-III is the last
      round with a disclosed valuation estimate: CB Insights estimates the
      post-money at $1,793M–$1,931M, placing SemiDrive in unicorn territory.
      The May 13, 2026 Series C raised approximately $100M (~¥6.9B RMB) and
      was led by Jiangsu Industrial Investment Social Security Fund (Suzhou
      state capital), with new strategic investor Shaanxi Automobile Hongde
      Investment (backed by Shaanxi Auto Group, a major commercial-vehicle OEM)
      and co-investors E-Town International Investment (Beijing Yizhuang state
      fund), Beijing Advanced Manufacturing Fund, Xi'an Finance Investment
      Management, and Yi Zhong Gentai Capital. No post-money valuation has been
      publicly disclosed for the C-round, and CB Insights shows the round amount
      as redacted. The multi-region state-capital composition—Suzhou, Beijing,
      and Xi'an government funds—signals both political alignment with
      semiconductor self-reliance policy and reduced risk of regulatory
      opposition to an eventual IPO. With Shaanxi Auto as a strategic OEM
      shareholder, SemiDrive gains supply-chain access and a captive MCU
      customer. CB Insights records 34 total investors through the C-round.
      Preference-stack and cap-table details are private; liquidation preferences
      and anti-dilution provisions remain a key diligence gap that could
      materially affect return calculations.
