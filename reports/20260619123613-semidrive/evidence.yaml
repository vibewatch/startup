evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-comparison-data
    missingEvidence: >-
      Comparable shipment volume, OEM win count, and revenue figures for Horizon Robotics and Black Sesame Technologies
      that would allow direct quantitative benchmarking against SemiDrive
    whyItMatters: >-
      Without audited or independently verified metrics for domestic peers, competitive positioning claims (cumulative
      shipments, OEM coverage) rest on self-reported or press-release data and cannot be stress-tested
    diligencePath: >-
      Review Horizon Robotics IPO prospectus filings with HKEX and public investor presentations; obtain analyst reports
      from CICC, Huatai, or similar covering China automotive chip market; compare design-win counts from publicly
      disclosed OEM supplier lists
    relatedQuestionRefs:
      - QO017
  - type: private-evidence-only
    severity: material
    topic: post-c-valuation
    missingEvidence: >-
      Post-money valuation following the May 2026 Series C round; any board-approved 409A or third-party valuation
      assessment
    whyItMatters: >-
      Without a current valuation, neither liquidation preference math nor return potential for the C round can be
      modelled; the 2024 estimate of $1.79B–$1.93B may be materially stale given 12+ months of additional scale
    diligencePath: >-
      Request cap table and post-C post-money valuation from company; obtain deal terms from a participating investor or
      the co-investors in the C round
    relatedQuestionRefs:
