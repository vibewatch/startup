    severity: material
    topic: headcount
    missingEvidence: Total employee headcount, breakdown between R&D and commercial functions, and year-over-year hiring trajectory
    whyItMatters: >-
      Headcount is a proxy for R&D burn rate and execution capacity; a company managing simultaneous SoC, MCU, and
      robotics chip tracks needs substantial engineering depth; headcount growth signals whether the $100M C-round is
      being deployed
    diligencePath: >-
      Request HR data or latest employment verification filings in China (国家企业信用信息公示系统); cross-check with LinkedIn
      headcount estimates
    relatedQuestionRefs:
