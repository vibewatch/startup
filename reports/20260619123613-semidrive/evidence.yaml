    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: domestic-share-discrepancy
    missingEvidence: >
      A reconciled, category-by-category breakdown of 'domestic automotive chip market share' that disaggregates the
      headline 35% forecast into premium segments (cockpit SoC, hi-perf MCU) versus mature commodity segments (power,
      sensors, 8-bit body), with consistent methodology across both figures.
    whyItMatters: >
      The 35% headline and 10% cockpit SoC localization figure imply that premium segments remain heavily
      foreign-dominated; using the 35% figure as a proxy for SemiDrive's specific segments would overstate the
      addressable opportunity and pace of share gains.
    diligencePath: >
      Request a product-category-level domestic share breakdown from GGII or CATARC; cross-check against individual OEM
      supplier qualification lists and Tier-1 module BOM disclosures.
    relatedQuestionRefs:
