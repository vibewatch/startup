  - type: private-evidence-only
    severity: minor
    topic: customer-count-corroboration
    missingEvidence: >
      Independent third-party corroboration of SemiDrive's stated OEM customer coverage (all China top-10 OEM groups and
      7 of global top-10). SCMP names six OEM brands but does not enumerate all ten Chinese OEM groups or verify the
      global top-10 claim.
    whyItMatters: >
      OEM customer breadth is a key commercial-traction metric; unverified customer claims are a common overstatement
      vector in pre-IPO company narratives.
    diligencePath: >
      Obtain signed reference letters or program-award letters from at least three OEM groups; cross-check against OEM
