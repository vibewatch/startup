  - type: missing-source
    severity: material
    topic: cockpit-soc-tam-gap
    missingEvidence: >
      An independently sourced, dollar-denominated TAM figure for China's automotive intelligent cockpit SoC market from
      a recognized analyst firm (IDC, IHS Markit/S&P Global, Yole Group, or GGII) with a disclosed methodology and clear
      product-perimeter definition.
    whyItMatters: >
      Without a transparent TAM denominator, SemiDrive's 3.77% cockpit SoC market share cannot be converted to a revenue
      figure, SAM and SOM cannot be derived for the highest-ASP product line, and the company's market-opportunity
      narrative cannot be independently stress-tested.
    diligencePath: >
      License GGII's China Intelligent Cockpit Chip Shipments database or the ResearchAndMarkets cockpit SoC report for
      a full dataset; alternatively, request OEM bill-of-materials and cockpit chip invoice data from two or three OEM
      IR relationships during due diligence.
    relatedQuestionRefs:
