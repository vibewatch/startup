figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    layout: wide
    summary: >-
      SemiDrive's public record runs from a 2018 founding through three funding milestones, functional-safety
      certifications, OEM-scale production, and an April-May 2026 cluster of product, partnership, and
      capital events that mark the company's international and embodied-intelligence pivot.
    data:
      items:
        - date: '2018'
          label: Founded
          detail: Chou Yujing and Zhang Qiang leave NXP to form SemiDrive as China's domestic automotive SoC+MCU provider.
          tone: positive
        - date: '2019'
          label: Series A and first ISO 26262:2018 management certificate
          detail: World's first TÜV Rheinland ISO 26262:2018 version functional safety management cert; SAIC and Sequoia join as investors.
          tone: positive
