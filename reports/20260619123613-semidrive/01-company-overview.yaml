  - id: section-scale
    title: Commercial scale, customers, and market position
    body: >
      By May 2026, SemiDrive's cumulative chip shipments had exceeded 12 million units across all product
      families, up from 10 million reported at year-end 2025 and 8 million at an earlier 2024 reference
      point — implying meaningful sequential production acceleration. The X9 cockpit SoC series alone
      has surpassed 5 million cumulative deliveries with year-over-year growth exceeding 50%, making it the
      #1 domestic brand in China's intelligent cockpit chip segment. The E3 MCU series crossed 5 million
      units in its first three years of commercial production.

      Customer coverage is broad by the standards of an eight-year-old chip startup. SemiDrive has achieved
      100% penetration of China's top-10 automotive OEM groups — covering brands including SAIC Motor,
      Chery, Chang'an, GAC, BAIC, Dongfeng, and others — and deployment in 7 of the world's top 10 OEM
      groups globally. The company states it serves over 260 customers and holds over 200 awarded design wins.
      Named customer references from public sources include Chery, Chang'an, SAIC, GAC, BAIC, Li Auto,
      Nissan, Honda, Volkswagen, and Geely/吉利.

      Third-party market research (GGAII / 高工智能汽车研究院) placed SemiDrive in the top-5 globally and
      first among domestic manufacturers in China's 2025 high-performance automotive MCU market by shipment
      volume. For cockpit SoCs, SemiDrive holds approximately 3.77% of China market share and is the
      only domestic brand to cover the full application spectrum from instrument clusters to domain
      controllers. The E3650 flagship MCU has been nominated on 90% of OEM next-generation domain
      controller platforms, and the E3620 powertrain MCU has multiple Tier 1 integrations in active development.
    claimRefs:
