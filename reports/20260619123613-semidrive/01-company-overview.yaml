  evidenceGaps:
    - type: enumeration-incomplete
      severity: minor
      topic: competitor-comparison-data
      missingEvidence: Comparable shipment volume, OEM win count, and revenue figures for Horizon Robotics and Black Sesame Technologies that would allow direct quantitative benchmarking against SemiDrive
      whyItMatters: Without audited or independently verified metrics for domestic peers, competitive positioning claims (cumulative shipments, OEM coverage) rest on self-reported or press-release data and cannot be stress-tested
      diligencePath: Review Horizon Robotics IPO prospectus filings with HKEX and public investor presentations; obtain analyst reports from CICC, Huatai, or similar covering China automotive chip market; compare design-win counts from publicly disclosed OEM supplier lists
      relatedQuestionRefs:
        - QO017

    - type: private-evidence-only
      severity: material
      topic: post-c-valuation
      missingEvidence: Post-money valuation following the May 2026 Series C round; any board-approved 409A or third-party valuation assessment
      whyItMatters: Without a current valuation, neither liquidation preference math nor return potential for the C round can be modelled; the 2024 estimate of $1.79B–$1.93B may be materially stale given 12+ months of additional scale
      diligencePath: Request cap table and post-C post-money valuation from company; obtain deal terms from a participating investor or the co-investors in the C round
      relatedQuestionRefs:
        - QO007

    - type: private-evidence-only
      severity: material
      topic: headcount
      missingEvidence: Total employee headcount, breakdown between R&D and commercial functions, and year-over-year hiring trajectory
      whyItMatters: Headcount is a proxy for R&D burn rate and execution capacity; a company managing simultaneous SoC, MCU, and robotics chip tracks needs substantial engineering depth; headcount growth signals whether the $100M C-round is being deployed
      diligencePath: Request HR data or latest employment verification filings in China (国家企业信用信息公示系统); cross-check with LinkedIn headcount estimates
      relatedQuestionRefs:
        - QO027

    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: Revenue, gross margin, and operating cash flow for FY2024 and FY2025; any available management accounts or auditor summary
      whyItMatters: Revenue and margin data are required to assess product-line economics, burn rate, and funding runway against the three-track strategic plan announced alongside the Series C raise
      diligencePath: Request audited financials or management accounts from the company; ask participating investors for the financial data room package

    - type: enumeration-incomplete
      severity: minor
      topic: leadership-coverage
      missingEvidence: Full C-suite composition (CFO, COO, VP Engineering, VP Sales), board composition, and independent director identities
      whyItMatters: Governance quality and succession risk cannot be fully assessed without knowing the full board and executive team; key-person concentration at the CEO level is asserted but board-level oversight of that risk is unverifiable
      diligencePath: Request corporate governance documents, board minutes summary, and executive team org chart during data room access
      relatedTableRefs:
        - TO002

    - type: enumeration-incomplete
      severity: minor
      topic: investor-coverage
      missingEvidence: Full investor registry and current shareholding percentages after Series C dilution; liquidation preference stack; anti-dilution provisions
      whyItMatters: Investor concentration in state-linked capital may affect governance, internationalization optionality (e.g. TSMC access, overseas listing), and exit timing; cannot be assessed without the full cap table
      diligencePath: Request official cap table (股权结构表) from the company or from a co-investor in the Series C; review industrial and commerce registry filings
      relatedTableRefs:
        - TO003

    - type: enumeration-incomplete
      severity: minor
      topic: milestone-coverage
      missingEvidence: Undisclosed financing tranches (e.g. bridge rounds, convertible notes), any adverse legal or regulatory events, and product recall or field quality incidents not covered in public press
      whyItMatters: Material adverse events between funding rounds can affect valuation and negotiation leverage; a full milestone record is required before committing to diligence recommendation
      diligencePath: Search China court registry (天眼查 / 企查查) for any litigation or adverse records; review CNIPA patent filings for IP dispute history; request a representation letter from management on material adverse events
      relatedTableRefs:
        - TO004

