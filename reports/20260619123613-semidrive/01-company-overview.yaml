        - id: domestic-customers
          label: China OEM base
          detail: 100% of China top-10 OEM groups; 260+ total customers; 200+ design wins; 12M+ chips shipped.
          tone: positive
        - id: global-expansion
          label: International expansion
          detail: European OEM X9 supply deal (EMEA); ZBO Electronics partnership (Europe/LatAm/SE Asia/India); <10% of prior shipments exported.
          tone: positive
        - id: capital
