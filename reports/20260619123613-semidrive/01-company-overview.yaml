company:
  name: SemiDrive
chapter:
  number: 1
  title: Company Overview
  summary: >-
    SemiDrive (芯驰科技) is a Nanjing-based automotive-grade chip design company founded in 2018 by former NXP
    executives to serve China's transition to smart electric vehicles. By May 2026 the company had shipped over
    12 million chips, achieved 100% coverage of China's top-10 OEM groups, closed a ~$100 million Series C, and
    announced a strategic expansion into embodied intelligence — while remaining a private company with no disclosed
    revenue, headcount, or post-C valuation.

sections:
  - id: section-identity
    title: Identity, founding, and operating model
    body: >
      SemiDrive — known in Chinese as 芯驰科技 (Xinchi Keji) and registered as 北京芯驰半导体科技股份有限公司 — was
      incorporated in 2018, roughly coinciding with the start of China's accelerating shift toward smart electric
      vehicles. The company's headquarters is in Nanjing, Jiangsu, with R&D centers in Beijing, Shanghai, Nanjing,
      and Shenzhen. The legal registration in Beijing and ICP filing (京ICP备2024056528号-1) reflect its status as
      a domestic semiconductor design house rather than a fabless international entity. The operating model is
      fabless chip design: SemiDrive defines, architects, and tapes out automotive-grade semiconductor products
      which are then manufactured by contract foundries (including TSMC for its advanced-node X10 product).

      The strategic positioning is to offer automotive-grade SoCs and high-performance MCUs for next-generation
      vehicle electronic/electrical (E/E) architectures, covering smart cockpits, intelligent gateways, and
      core vehicle control. As of the 2026 Beijing Auto Show, the company formally extended its mission to
      include embodied intelligence (humanoid and service robots), framing this as a natural transfer of
      automotive-grade chip competencies — high reliability, real-time control, functional safety — into
      the robotics value chain. This dual automotive-robotics ambition is reflected in the May 2026 Series C
      capital raise and the company's stated use of proceeds across three tracks: AI cockpit SoCs, high-end
      vehicle control MCUs, and embodied intelligence solutions.

      SemiDrive describes itself as one of the few companies globally that can simultaneously supply both
      automotive-grade SoCs and high-performance MCUs, covering the two most strategically sensitive chip
      categories in the automotive E/E evolution. This dual-capability positioning is important for
      understanding both the competitive moat and the organizational complexity the company carries.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO007
      - CO028
      - CO045

  - id: section-leadership
    title: Leadership, governance, and key-person dependence
    body: >
      SemiDrive was co-founded by Chou Yujing (仇雨菁), who serves as Chairwoman and CEO, and Zhang Qiang
      (张强). Both founders previously held senior positions at NXP Semiconductors, which is the dominant
      incumbent in automotive microcontrollers globally: Chou Yujing was NXP China's automotive chip R&D lead
      and Zhang Qiang was head of NXP Greater China's automotive division. This founding team configuration —
      technically deep chip designers who had already shipped automotive-grade products at scale — is a strong
      signal of founder-market fit and provides the company with credibility when negotiating with OEM
      procurement teams that require rigorous vehicle qualification processes.

      The broader senior leadership team includes Sun Mingle (孙鸣乐) as CTO, who led the architecture
      specification for the flagship X10 AI cockpit SoC and presented publicly at the 2026 Beijing Auto
      Show; Zhang Xitong (张曦桐) as MCU Product Line General Manager, responsible for the E3 series
      roadmap and strategy; and Eugene Wang as International Business General Manager, who has been the
      primary public spokesperson for the company's global expansion plans, notably the European OEM
      supply deal.

      Key-person risk is concentrated. Chou Yujing is the sole named founder and public face at investor
      conferences and press events. No governance documents, board composition, or succession plans are
      publicly available for a private company of this scale, which is a standard but material gap for
      any LP or strategic investor doing diligence. Independent board members, if any, have not been
      publicly identified. The investor-heavy board typical of a late-Series-B/C company likely includes
      representatives from SAIC, Sequoia China, and/or newer institutional investors, but this is unconfirmed.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
    tableRefs:
      - TO002

  - id: section-products
    title: Product portfolio and technical differentiation
    body: >
      SemiDrive produces four commercially active chip families. The X9 series is a smart cockpit SoC targeting
      infotainment, instrument cluster, and domain-controller applications; it is the company's highest-volume
      product and its #1 domestic brand position. The E3 series is a family of high-performance automotive
      MCUs covering zone controllers, domain controllers, advanced chassis/powertrain control, and ADAS
      domains. The G9 series is a central gateway/network processor purpose-built for new-generation
      E/E architectures that centralize vehicle communication. The V9 series was listed as a smart-driving
      chip, though its product page was unavailable at time of research.

      The next-generation flagship products under development include the X10 AI cockpit SoC and the E3800
      AMU (Architecture Master Unit). The X10 uses TSMC's 4nm automotive-grade process and delivers 80 TOPS
      dense AI compute with 154 GB/s DDR bandwidth, enabling on-device deployment of AI models up to 9B
      parameters — a meaningful step toward eliminating the external AI accelerator box and reducing
      system BOM cost by an estimated ¥1,500–3,000. The E3800 is the E3 series expansion toward a
      "central intelligent control brain" role, integrating more than 10 cores with aviation-grade
      embedded flash and multi-layer Ethernet acceleration. Both products were previewed at the
      April 2026 Beijing Auto Show.

      For embodied intelligence, SemiDrive has announced the R1 series compute brain and the D9-Max
      control brain (supporting EtherCAT real-time protocol), framing them as reuses of existing
      automotive-grade IP applied to the robotics control architecture. The E3650 flagship MCU received
      TÜV Rheinland ISO 26262 ASIL D functional safety product certification in 2026, adding a product-level
      safety certificate on top of the company's process-level ASIL D certification obtained in 2019.
    claimRefs:
