  evidenceGaps:
    - type: missing-source
      severity: material
      topic: "cockpit-soc-tam-gap"
      missingEvidence: >
        An independently sourced, dollar-denominated TAM figure for China's automotive intelligent
        cockpit SoC market from a recognized analyst firm (IDC, IHS Markit/S&P Global, Yole Group,
        or GGII) with a disclosed methodology and clear product-perimeter definition.
      whyItMatters: >
        Without a transparent TAM denominator, SemiDrive's 3.77% cockpit SoC market share cannot
        be converted to a revenue figure, SAM and SOM cannot be derived for the highest-ASP product
        line, and the company's market-opportunity narrative cannot be independently stress-tested.
      diligencePath: >
        License GGII's China Intelligent Cockpit Chip Shipments database or the ResearchAndMarkets
        cockpit SoC report for a full dataset; alternatively, request OEM bill-of-materials and
        cockpit chip invoice data from two or three OEM IR relationships during due diligence.
      relatedQuestionRefs:
        - QM010
      relatedTableRefs:
        - TM002

    - type: conflicting-data
      severity: material
      topic: "domestic-share-discrepancy"
      missingEvidence: >
        A reconciled, category-by-category breakdown of 'domestic automotive chip market share'
        that disaggregates the headline 35% forecast into premium segments (cockpit SoC, hi-perf MCU)
        versus mature commodity segments (power, sensors, 8-bit body), with consistent methodology
        across both figures.
      whyItMatters: >
        The 35% headline and 10% cockpit SoC localization figure imply that premium segments remain
        heavily foreign-dominated; using the 35% figure as a proxy for SemiDrive's specific segments
        would overstate the addressable opportunity and pace of share gains.
      diligencePath: >
        Request a product-category-level domestic share breakdown from GGII or CATARC; cross-check
        against individual OEM supplier qualification lists and Tier-1 module BOM disclosures.
      relatedQuestionRefs:
        - QM009

    - type: private-evidence-only
      severity: minor
      topic: "customer-count-corroboration"
      missingEvidence: >
        Independent third-party corroboration of SemiDrive's stated OEM customer coverage (all China
