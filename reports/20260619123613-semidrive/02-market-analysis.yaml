  - id: contradictions-gaps
    title: "Contradictions, Sizing Gaps, and Diligence Asks"
    body: >
      Two conflicting signals on the pace of domestic substitution complicate market-share
      modeling. SemiDrive's April 2026 Beijing Auto Show presentation cited an industry forecast
      that domestic vendors will capture 35% of China's automotive chip market in 2026. Yet an
      independent analyst report (BusinessWire/ResearchAndMarkets, 2025) places the cockpit SoC
      domestic localization rate at only about 10% as of 2024. These figures are not directly
      comparable—the 35% aggregates all automotive chip categories including mature power, sensor,
      and body segments where domestic vendors have further advanced, while the 10% measures only
      the premium cockpit SoC stratum. Nevertheless, the gap illustrates that SemiDrive's most
      strategic and highest-margin segment (cockpit SoC) remains heavily import-dependent, and
      the headline 35% figure should not be applied to premium chip segments without adjustment.

      Qualcomm continues to dominate the premium cockpit SoC segment (vehicles priced above
      RMB 200,000), where Snapdragon 8155P and 8295 and SA8775P remain the go-to platforms. Chinese
      domestic vendors including SemiDrive are gaining fastest in the RMB 100,000–200,000 band,
      where price sensitivity and the domestic supply chain's design-support responsiveness provide
      competitive leverage.

      No publicly accessible SAM/SOM figure isolates the combined high-performance MCU plus cockpit
      SoC sub-market addressable by SemiDrive. Investor-grade diligence would require direct
      engagement with OEM procurement teams or licensed access to GGII or China Automotive
      Technology & Research Center (CATARC) shipment databases. The delta between SemiDrive's 12
      million cumulative chip shipments (April 2026) and the prior 10-million figure (end-2025)
      implies roughly 2 million additional units in the first four months of 2026, suggesting
      accelerating run-rate but without revenue per unit, it cannot be converted to a market-share
      value figure.
    claimRefs:
      - CM037
      - CM038
      - CM039
      - CM040

