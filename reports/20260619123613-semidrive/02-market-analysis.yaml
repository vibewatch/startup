callouts:
  - calloutType: insight
    title: "Domestic Substitution Is Segment-Stratified"
    body: >
      The 35% all-category domestic automotive chip share forecast cited by SemiDrive reflects
      aggregate progress spanning mature, lower-tech segments (power, sensors, body electronics).
      The cockpit SoC stratum—SemiDrive's highest-ASP product line—stood at roughly 10% domestic
      localization as of 2024. Investors should model cockpit SoC market share gains from this lower
      base rather than applying the headline 35% figure.
    claimRefs:
      - CM037
      - CM011
      - CM017

  - calloutType: risk
    title: "TSMC and EDA Tool Dependency Creates Dual Supply-Chain Exposure"
    body: >
      SemiDrive's X10 AI cockpit SoC relies on TSMC's 4nm automotive process, and E3650 is
      produced at 22nm. Sixty-five percent of automotive-grade wafer output originates from
      Taiwan, Japan, and South Korea. US export controls on sub-28nm EDA tools complicate design
      iterations for domestic Chinese chipmakers. A geopolitical escalation or Taiwan Strait
      disruption would simultaneously cut wafer supply and curtail design-tool access,
      representing a scenario with limited mitigation options in the short term.
    claimRefs:
      - CM032
      - CM034
      - CM035
      - CM042

  - calloutType: strength
    title: "Zonal Architecture Transition Creates a Multi-Year Demand Tailwind"
    body: >
      The E/E architecture shift from distributed ECU to zonal and domain controllers directly
      expands the per-vehicle silicon content for SemiDrive's MCU line. BYD's consolidation of
      120 ECUs to 75 high-power nodes is the industry reference case; as OEMs across all tiers
      replicate this architecture, demand for ASIL-D-capable 32/64-bit MCUs rises. SemiDrive's
      E3650 has already been nominated for 90% of OEMs' next-generation domain-control platforms,
      providing a multi-year revenue pipeline once those models reach start-of-production in 2027–2028.
    claimRefs:
      - CM030
      - CM022
      - CM028

