company:
  name: "SemiDrive"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >
    SemiDrive operates at the intersection of two high-growth segments within China's automotive
    semiconductor market: intelligent cockpit SoCs and high-performance MCUs for zonal and domain
    controllers. Mordor Intelligence sizes China's automotive MCU market at USD 3.42 billion in 2025,
    forecast to reach USD 5.17 billion by 2031 (7.11% CAGR), driven by EV proliferation, E/E
    architecture consolidation, and domestic-substitution policy tailwinds. Independent data confirms
    domestic cockpit SoC localization exceeded 10% in 2024 with SemiDrive ranked #1 among domestic
    vendors, though a publicly verifiable SAM/SOM for the combined cockpit SoC plus high-performance
    MCU sub-market remains unavailable and is preserved as an evidence gap.

sections:
  - id: market-boundary
    title: "Market Boundary, Scope, and Status-Quo Substitutes"
    body: >
      SemiDrive's primary served market spans two complementary automotive semiconductor segments:
      (1) intelligent cockpit SoCs (branded X9/X10 series), covering instrument clusters,
      infotainment, multi-display domain controllers, and AI-assisted human-machine interaction; and
      (2) high-performance automotive MCUs (E3 series), addressing zone control units (ZCUs), domain
      control units (DCUs), powertrain, chassis, and ADAS safety applications. A third product line—
      the G9 series central-gateway and domain-fusion processor—serves the central gateway and
      domain-fusion market, bridging cockpit and vehicle-control architectures. These three segments
      collectively represent the "intelligent automotive compute" layer sitting above commodity body
      electronics (window lifts, simple actuators) and below advanced ADAS application processors
      (NVIDIA Orin, Horizon Journey series) and autonomous-driving inference SoCs.

      Excluded from SemiDrive's TAM are: power electronics semiconductors (inverter IGBTs, SiC
      MOSFETs), battery cell sensors and BMS analog front-ends, radar and LiDAR signal-processing
      ASICs, and consumer/telematics connectivity chips (5G/WiFi modems), even though those sit
      elsewhere in the same vehicle. Status-quo substitutes for cockpit SoC are dominated by Qualcomm
      Snapdragon 8155P, 8295, and SA8775P (EMEA and China); NXP i.MX 8 series; and Renesas R-Car
      series. Status-quo substitutes for high-performance MCU are NXP S32K/S32G families, Infineon
      AURIX TC4xx, Renesas RH850, and STMicro SPC5 series—all globally certified incumbents with
      long-established automotive tool chains. The embodied intelligence (humanoid robotics) segment
      represents a newly claimed adjacency where SemiDrive is extending its automotive IP.
