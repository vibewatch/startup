  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: "SemiDrive annual revenue by product line (cockpit SoC, MCU, gateway/ADAS, embodied intelligence) for 2024 and 2025"
      whyItMatters: "Without revenue data, gross margin, burn rate, and capital adequacy assessments are all scenario estimates that cannot support an underwriting decision"
      diligencePath: "Request management accounts or audited financial statements from SemiDrive data room; insist on product-line revenue breakdown and YoY growth rate"
      relatedQuestionRefs: [QI002, QI008, QI026]

    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: "SemiDrive gross profit and gross margin percentage by product family for 2023–2026"
      whyItMatters: "The comparable-company gross margin range of 33–65% is too wide to support a valuation; a 10-point margin difference at any revenue level changes the implied enterprise value materially"
      diligencePath: "Obtain audited P&L; request bill-of-materials cost breakdown for flagship products X9 and E3650; confirm foundry cost and packaging cost as percentage of ASP"
      relatedQuestionRefs: [QI006, QI021, QI025]

    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: "Monthly or quarterly cash burn rate, current cash balance, and management's board-approved funding roadmap"
      whyItMatters: "Cannot determine whether SemiDrive has sufficient runway to reach profitability or will require additional dilutive capital before any liquidity event"
      diligencePath: "Request quarterly cash flow statements; confirm C-round draw schedule and utilization plan; obtain board-approved operating budget"
      relatedQuestionRefs: [QI004, QI007]

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: "Revenue contribution from top-5 customers as a percentage of total revenue"
      whyItMatters: "100% OEM group coverage indicates breadth, but a single model program could represent 30–40% of revenue, creating hidden platform concentration risk"
