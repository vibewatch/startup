      - - X10 AI cockpit SoC (4nm; mass production from 2026)
        - "RMB 600–1,500 / unit estimated (~$83–$207 USD)"
        - Per-unit; requires multi-year OEM design-in nomination; qualification cycle 2–3 years
        - Estimated — 4nm process cost significantly higher than 7nm; no price disclosure
        - OEMs in RMB 100K–200K car segment (~50% of cockpit SoC sales) highly cost-sensitive; premium pricing headwind
