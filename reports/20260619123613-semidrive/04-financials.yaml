callouts:
  - calloutType: risk
    title: Three-Track Capital Thinness
    body: >-
      The ~$100M Series C, when allocated across cockpit SoC (X10 4nm ramp), high-end MCU
      (E3 series certification and next-gen development), and the new embodied intelligence
      vertical (R1/D9-Max), provides an estimated $20–40M per track. A single advanced-node
      tape-out alone costs $30–100M+. Analyst commentary explicitly flagged this allocation
      as "not generous." SemiDrive's next capital event is not announced; burn rate is
      undisclosed. If X10 4nm tape-out costs are at the high end of the range, the cockpit
      SoC track alone could consume the C-round within 12–18 months.
    claimRefs:
      - CI001
      - CI006
      - CI025
      - CI028
      - CI029

  - calloutType: insight
    title: OEM-Strategic Investors Signal Commercial Commitment
    body: >-
      Participation by SAIC Motor (historical), Shaanxi Auto Hongde Investment (Series C),
      and other OEM-adjacent capital signals that design-win nominations have created
      commercial commitments that investors view as revenue-visible. OEM strategic investors
      in semiconductor companies typically anchor supply relationships simultaneously with
      investment, providing a degree of forward revenue certainty not typical of pure-VC
      semiconductor rounds. SemiDrive's 100% coverage of China top-10 OEM groups strengthens
      this signal.
    claimRefs:
      - CI002
      - CI004
      - CI008
      - CI011

  - calloutType: risk
    title: US Export Control Headwind on Advanced-Node EDA Tooling
    body: >-
      US export control clarifications of June 2026 explicitly extended chip access
      restrictions to Chinese-owned firms operating overseas, closing an offshore-subsidiary
      loophole. If restrictions extend to EDA software (Synopsys, Cadence, Mentor) required
      for sub-7nm design—as some analysts expect as tensions escalate—SemiDrive's cost to
      develop X10 successors (likely 3nm) rises materially, compressing the unit economics
      of next-generation product investment. This adversely affects both the burn trajectory
      and the capital adequacy assessment.
    claimRefs:
      - CI027
      - CI038

