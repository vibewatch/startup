  - id: unit-economics
    title: Unit Economics and Cost Structure
    body: >-
      SemiDrive operates the fabless semiconductor model, eliminating wafer-fabrication
      capital expenditure but concentrating costs in R&D (front-end chip design, IP licensing,
      tape-out fees) and per-unit COGS (wafer cost from SMIC and other foundries, assembly,
      test, packaging). Primary capital uses are engineering headcount across four R&D centers,
      tape-out schedules for each product generation, and AEC-Q100/ISO 26262 certification
      programs. The automotive chip development cycle has shortened from 5–8 years to 2–3
      years, increasing the cadence and capital intensity of tape-out and recertification
      spend. A single advanced-node tape-out can cost tens of millions of USD; SemiDrive's
      X10 (4nm) represents its highest-cost tape-out investment to date.

      Gross margin is not disclosed. Comparable public companies provide a reference range:
      STMicroelectronics reported 33.8% GAAP gross margin in Q1 2026; Black Sesame
      Technologies reported a 41% gross margin in its most recent fiscal year; Horizon
      Robotics reported 65% gross margin LTM. This 33–65% range reflects different scale,
      product mix, and foundry negotiating leverage. At SemiDrive's cumulative shipment pace
      (12M+ chips over approximately 4 years; ~3M per year with trajectory accelerating), a
      blended ASP of $10–30 per chip implies an estimated annual revenue run rate of $30–90M
      currently, rising as the premium-priced X10 ramps. This is an analyst estimate, not
      management guidance. China automotive MCU market context: the market is forecast to
      reach $3.66B in 2026 (7.11% CAGR to $5.17B by 2031), with SemiDrive competing
      primarily in cockpit SoC and high-end MCU, supported by a government preference for
      domestic suppliers (10% price advantage in government fleet procurement). Working
      capital dynamics are not disclosed; OEM/Tier-1 payment terms in automotive supply
      chains typically run 90–180 days, creating meaningful working capital drag relative
      to revenue. Customer concentration data are unavailable.
