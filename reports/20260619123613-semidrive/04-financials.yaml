        - "90–180 day payment terms (OEM/Tier-1 automotive standard, inferred)"
        - Low — industry convention inferred; SemiDrive-specific terms undisclosed
        - Long DSO for chip suppliers increases cash burn relative to revenue recognition
        - Confirm DSO, inventory days, and trade-payable terms; working capital as % of revenue
    notes: "All financial metrics are estimated or inferred from comparable public companies (Black Sesame, Horizon Robotics, STMicro) and market benchmarks. SemiDrive has not disclosed any financial statements, margins, or unit economics. Low confidence ratings reflect estimation uncertainty, not source quality. Do not use these figures as management guidance."
