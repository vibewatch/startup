        - High-volume OEMs likely receive volume discounts; SemiDrive priced below Qualcomm SA8295P to win domestic share
        - "Estimated from China automotive SoC market benchmarks (TechInsights, ResearchAndMarkets); not confirmed"
      - - E3650 MCU flagship (22nm)
        - "RMB 50–150 / unit (~$7–$21 USD; E3650 higher spec than base E3)"
        - Per-unit to Tier-1, OEM, and zone-controller suppliers
        - Estimated — no official price; benchmarked to China automotive MCU market size ($3.42B, 2025)
        - Domestic suppliers hold 10% price preference in government fleet procurement; SemiDrive beneficiary
