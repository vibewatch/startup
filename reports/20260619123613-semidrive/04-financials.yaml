  - id: TI005
    title: Public Financial Gaps
    columns:
      - Missing Metric
      - Impact on Analysis
      - Access Status
      - Exact Diligence Path
    rows:
      - - Annual revenue by product line (SoC vs. MCU vs. gateway / other)
        - Blocking — prevents revenue quality, growth rate, and gross margin assessment; all financial scenarios underpinned
        - Private — not disclosed; CBInsights page behind paywall; PitchBook blocked by CAPTCHA
        - Request management accounts or audited financials from data room; insist on product-line breakdown
      - - Gross margin and gross profit by product family
        - Blocking — required for sustainable-economics verdict; 33–65% comp range too wide for underwriting
        - Private — no regulatory filing obligation for private Chinese companies
        - Request audited P&L for 2023–2026; confirm bill-of-materials and foundry cost structure for X9 and E3650
      - - Monthly / quarterly cash burn rate and current cash balance
        - Blocking — cannot assess runway or capital adequacy without actual cash flow data
        - Private — no disclosure; no credit rating or public debt requiring disclosure
        - Obtain quarterly cash flow statements; confirm C-round draw schedule and utilization plan
      - - Customer concentration (top-5 OEM revenue share)
        - Material — 260+ customers implies breadth but does not rule out single-OEM concentration above 30%
        - Private — not disclosed
        - Request customer concentration table (top-5 customers as % of revenue) from data room
      - - Headcount by function and total compensation expense
        - Material — R&D headcount is primary burn driver; equity structure affects dilution and retention risk
        - Private — LinkedIn suggests 800–1,500 employees but this is unverified
        - Request headcount by function (R&D / sales / operations) and total compensation expense for 2025–2026
    notes: "Access status reflects public information availability as of 2026-06-19. CBInsights and PitchBook entries for SemiDrive exist but are behind access controls. No regulatory filing obligation exists for SemiDrive as a private Chinese company. 'Blocking' severity means the gap prevents a diligence conclusion; 'material' means it affects judgment but does not prevent a preliminary view."
