    rows:
      - - Blended chip ASP (SoC + MCU)
        - "$10–30 / unit (estimated)"
        - Low — no official data; derived from market benchmarks and shipment volume analysis
        - Primary revenue-per-unit input; ±50% ASP variation produces ±50% revenue estimate swing
        - Confirm ASP by product line (X9, X10, E3650, G9, V9) and by OEM segment; obtain pricing schedule
      - - Gross margin
        - "40–65% estimated scenario range (comp-based: Black Sesame 41%, Horizon Robotics 65%, STMicro 34%)"
        - Low — not disclosed by SemiDrive; wide comp range limits precision
        - Core profitability driver; determines cash generation capacity from chip unit sales
        - Request audited P&L; confirm gross margin trend from 2023 to 2026 as X10 ramps
      - - R&D cost per chip generation (tape-out)
        - "$30M–$100M+ per advanced-node tape-out (estimated from analyst commentary)"
        - Low — cost figure from public analyst commentary on automotive chip development costs
        - Tape-out cost determines payback period and minimum shipment volume to recover NRE
        - Confirm total annual R&D spend; tape-out schedule and cost by chip generation
      - - EBITDA margin
        - "Estimated -80% to -200% based on Black Sesame (-156%) and Horizon Robotics (-135%) comps"
        - Low — estimated; SemiDrive EBITDA not disclosed; comp range applied to estimated revenue
        - Indicates distance from operating self-sufficiency and magnitude of funding dependency
        - Request EBITDA bridge from revenue to operating loss; quarterly cash flow statements
