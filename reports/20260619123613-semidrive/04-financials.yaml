        - Third-party reported — competitive benchmark; not SemiDrive pricing
        - Foreign supplier; SemiDrive X9 priced at discount to win Chinese OEM share under localization tailwind
        - S&P Global and TechInsights reports on cockpit SoC competitive landscape; not SemiDrive data
    notes: "All SemiDrive pricing is estimated from market benchmarks; no official list prices are published by SemiDrive. Qualcomm reference included solely for competitive context. Realized ASPs may vary materially from estimates due to volume discounts and OEM negotiation. Mark all SemiDrive cells as estimates."
