      - number: '3.6'
        title: 展示材料
        blocks:
          - type: callout
            title: Qualcomm 的 AI 座舱优势是结构性的，不只是时间领先
            body: >
              Qualcomm 的 SA8397（360 TOPS，204.8 GB/s）在原始 AI 算力上已超过 SemiDrive X10（80 TOPS，154 GB/s）的规格，Qualcomm
              的全球软件、认证和分销生态也很深。SemiDrive 的中国市场优势真实存在，但它与 Qualcomm 在全球市场的性能和生态差距是结构性的，需要多代产品和大量生态投入才能补上。出口管制扰动 Qualcomm
              在中国的供给，可能成为顺风，但不能成为可靠的全球竞争策略。
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
              - CP031
              - CP032
          - type: callout
            title: SoC + MCU 双产品组合是稀缺且可防守的竞争位置
            body: >
              在中国本土车规芯片公司中，SemiDrive 是极少数同时提供高性能座舱 SoC（X9/X10）和 ASIL-D 认证高性能 MCU（E3 系列）的公司之一。NXP 和 Renesas
              在全球范围内同时提供两类产品，但没有中国本土同行能匹配这一组合。双覆盖让公司能交叉销售进入 OEM E/E 平台项目，客户关系也比单一产品竞争者更黏。
            calloutType: strength
            claimRefs:
              - CP025
              - CP039
              - CP041
          - type: callout
            title: 出口管制既带来顺风，也带来脆弱点
            body: >
              美国出口管制针对中国总部企业，不论其海外运营如何安排；这同时让依赖 Qualcomm 的中国 OEM 更愿意接受 SemiDrive 本土 X9/X10 方案，也让 SemiDrive 自身依赖 TSMC
              的生产链（X10 使用 4nm）暴露在同类地缘政治扰动风险下。投资人应同时压力测试两种情境：SemiDrive 在中国替代 Qualcomm（上行）和 SemiDrive 因 TSMC
              准入限制遭遇自身供给中断（下行）。
