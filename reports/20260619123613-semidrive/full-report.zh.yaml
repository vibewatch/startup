      - number: '3.2'
        title: 在位竞争者：NXP、Renesas、STMicroelectronics、Qualcomm
        blocks:
          - type: paragraph
            body: |
              NXP Semiconductors 按收入计是全球最大的纯汽车芯片厂商，截至
              2026 年 6 月市值约 USD 79.09 billion，过去十二个月收入为
              USD 12.62 billion。其汽车业务——包括 S32 MCU 家族、i.MX
              应用处理器，以及雷达 / 连接芯片——约占集团收入 40%，并深度嵌入
              全球 Tier-1 安全和动力总成供应链。NXP 的 S32K MCU 与 i.MX 95
              5nm SoC 分别直接竞争 SemiDrive 的 E3650 和 X9/X10 系列，背后
              有成熟 AUTOSAR 生态和 20 多年的 OEM 认证积累。

              Renesas Electronics 拥有分布在 30 多个国家的 21,000 多名专业人员，
              R-Car 家族服务座舱 SoC 客户，RH850/U2A 家族服务安全 MCU 客户。
              R-Car X5H 平台借助 Chiplet 技术，把 NPU 性能在原生裸片基础上提高
              3–4×；这种设计路径瞄准的 AI 座舱计算需求，正是 SemiDrive X10
              用集成式 4nm 单片架构解决的问题。Renesas 未公开披露单颗价格或
              中国特定市场份额数字。

              STMicroelectronics 披露 2026 年 Q1 净收入 USD 3.10 billion（FY
              年化约 USD 12.4 billion），其 Stellar 系列 ASIL-D 汽车 MCU 在
              动力总成和区域控制器细分与 SemiDrive 竞争。ST 的主要汽车优势在
              欧洲 OEM 功率电子和车身电子，长期客户关系形成切换成本壁垒，新进入者
              很难快速打穿。

              Qualcomm 的 Snapdragon SA8295P 和 SA8775P 主导中国高端座舱 SoC 市场，
              尤其是 RMB 100,000–200,000 车价段。下一代 SA8397 把性能门槛抬到
              360 TOPS NPU 和 204.8 GB/s 内存带宽——达到上一代三倍——直接瞄准
              SemiDrive X10 试图覆盖的同类 AI 原生座舱能力。Qualcomm 最近披露的
              单季收入为 USD 10.6 billion，覆盖所有业务；汽车业务占比未单独披露。
              美国出口管制政策针对中国总部企业，不论其海外运营地点如何，这为依赖
              Qualcomm 的中国 OEM 制造供应不确定性，也间接强化了 SemiDrive 国产替代逻辑。
