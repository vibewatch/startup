  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              SemiDrive 通过向 Tier-1 汽车供应商和 OEM 客户销售车规级芯片单元获得收入，这是 fabless 半导体公司的典型模式。主要收入驱动来自座舱 SoC 系列（X9/X9P 系列；下一代 X10
              将于 2026 年进入量产）和高性能 MCU 系列（E3 系列，旗舰 E3650 自 2025 年末量产）。次级产品线——G9 中央网关 SoC 和 V9 智能驾驶 SoC——贡献额外单车收入。截至 2026 年
              5 月，公司累计出货超过 12 million 颗芯片，拥有 200+ 个活跃设计定点项目和 260+ 个客户，已建立有意义的重复出货基础。客户覆盖尤其广：覆盖中国前 10 大 OEM 集团的 100%，全球前
              10 大 OEM 集团中有 7 家已在量产车中部署 SemiDrive 芯片。2025 年，SemiDrive 在中国智能座舱 SoC 市场占有 3.77% 份额，总体排名第五，本土供应商第一。

              收入在芯片交付时确认。官方未披露定价。基于中国车规 SoC 和 MCU 市场基准，X9 代座舱 SoC ASP 估计在 RMB 200–800 / 颗（$28–$110 USD）；E3 系列 MCU ASP
              估计为 RMB 20–100（$3–$15 USD）；4nm X10 因制程节点成本抬升，预期较 X9 有实质溢价。这些是情景估算，不是管理层指引。软件工具（SDK、AUTOSAR 中间件、ETAS 和
              Elektrobit 集成）与芯片捆绑，用于加速生态采用并制造转换成本；任何来源中均未识别出单独定价的软件收入线。SemiDrive 新进入的具身智能垂直——通过 R1 和 D9-Max
              产品线覆盖人形机器人——仍在试点阶段，仅公布一个合作伙伴（Galactic General Robotics），未披露收入。截至 2024 年中，累计芯片出货中流向出口市场车辆的比例低于 10%；首个 EMEA
              量产合作（未披露欧洲车企，2024 年末宣布）是迈向国际收入多元化的战略一步。
