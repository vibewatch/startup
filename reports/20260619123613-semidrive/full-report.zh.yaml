      - number: '4.2'
        title: 资本结构与充足性
        blocks:
          - type: paragraph
            body: >-
              SemiDrive 采用多阶段风险投资与战略股权融资模式。2026 年 5 月约 $100M（¥690M RMB）的 Series C 由 Suzhou State-Owned Capital
              Investment（苏产投）领投，使累计披露融资超过 ¥4.4 billion RMB（~$610M）。C 轮引入了明显转向 OEM 战略资本和国家产业政策资本的变化：新战略股东 Shaanxi Auto
              Hongde Investment（陕汽鸿德投资，Shaanxi Auto Holdings 旗下单位）与财务共同投资方 Yizhuang State Investment、Beijing Advanced
              Manufacturing Fund、Xi'an Finance Capital、Yi Zhong Geng Tai 一起锚定供应链关系。历史投资方包括 SAIC Motor（OEM 战略方）、Sequoia
              Capital、Walden International 和 Matrix Partners。公司未披露任何公共债务工具、授信额度或项目融资义务。

              资本充足性无法完整评估，因为 burn rate、现金余额和运营费用均未披露。关于 C 轮的分析师评论指出，$100M 要分配给三条开发线——座舱 SoC（X10 4nm 爬坡）、高端
              MCU（下一代认证）和具身智能（R1/D9-Max 系列）——考虑到每个垂直的资本需求，并不“宽裕”。一次先进节点（7nm/5nm）tape-out 成本可达数千万美元；4nm 更高。可比中国车规 SoC
              公司展示了这种财务轮廓：Black Sesame Technologies 年 burn 约 $190M、收入 $122M（EBITDA margin -156%）；Horizon Robotics 年 burn
              约 ~$749M、收入 $556M（EBITDA margin -135%）。将这些 burn 强度套用到 SemiDrive 的估计收入区间，意味着每月净 burn 为 $10–35M，仅 C 轮增量可支撑
              18–48 个月 runway——高度取决于收入轨迹和费用管理。公司未公开宣布 IPO 时间表或下一轮融资触发条件。
