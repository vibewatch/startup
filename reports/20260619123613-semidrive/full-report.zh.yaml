      - number: '3.3'
        title: 直接中国同行：Horizon Robotics、Black Sesame、SiEngine、Huawei HiSilicon
        blocks:
          - type: paragraph
            body: |
              Horizon Robotics（HKG: 9660）成立于 2015 年，聚焦中国乘用车市场的
              ADAS 和自动驾驶 SoC。其 Journey 系列平台（J5、J6）被中国 OEM 广泛用于
              L2+ ADAS。过去十二个月收入约 USD 707 million，EBITDA 亏损约
              USD 584 million；企业价值约 USD 7 billion。Horizon 不提供 MCU 产品，
              也不是 SemiDrive 的主要座舱 SoC 竞争对手，但其不断壮大的软件和工具链
              生态会在座舱 - 驾驶融合架构收敛时形成跨细分压力。

              Black Sesame Technologies（HKG: 2533）成立于 2016 年，提供 Huashan
              A2000 和 Wudang C1200 系列芯片，面向高阶自动驾驶和座舱 - 驾驶融合。
              过去十二个月收入约 USD 163 million，EBITDA 亏损 USD 170 million，
              企业价值约 USD 966 million。Black Sesame 的产品组合不包括专用
              ASIL-D MCU 线，因此与 SemiDrive E3 系列的正面竞争有限。

              SiEngine Technology（未上市）是 SemiDrive 最直接的国产座舱 SoC 对手。
              其 Longying No.1 7nm 芯片量产已超过 100 万颗，并被 Geely Galaxy E5
              和 FAW Hongqi 车型采用。SiEngine 正用 Longying No.2（更高端的座舱 -
              驾驶融合）延展路线图，但尚无 MCU 产品，这让 SemiDrive 的双细分覆盖
              成为结构性差异点。

              Huawei HiSilicon 是 Huawei 子公司，借助 HarmonyOS 集成和 Huawei 在通信、
              连接与 AI 领域建立的软件生态，正在中国高端座舱细分快速增长。其深度垂直
              整合既带来能力优势，也形成许多非中国 OEM 不愿接受的地缘政治风险画像。

              MediaTek 的 Dimensity S1 Ultra 是全球首款量产 3nm 汽车芯片，集成
              5G 调制解调器和 Wi-Fi 7，并被 Changan Deepal 和 NEVO 车型采用。
              MediaTek 的消费级制程领先和 BYD 联合开发伙伴关系（D9000），在制程技术
              前沿构成相邻竞争压力。

              NVIDIA DRIVE Thor 是性能最高的相邻进入者，已随 Li Auto L9（2026 款）
              和 Leapmotor D19 在 2026 年 Q2 进入量产。它瞄准座舱 - ADAS 融合，
              价格和功耗包络位于 SemiDrive 当前产品之上，而不是直接竞争中端座舱细分。
