      - number: '7.2'
        title: 安全、质量与认证风险
        blocks:
          - type: paragraph
            body: >
              SemiDrive 为旗舰产品建立了可信的功能安全和网络安全资质栈。E3650 MCU 获得 TÜV Rheinland ISO 26262 ASIL D 产品认证，这是车规组件最高功能安全等级；公司自 2019
              年起持有 TÜV Rheinland ISO 26262:2018 功能安全管理证书，是最早具备流程级认证的中国芯片公司之一。E3650 还通过 AEC-Q100 Grade 1 车规可靠性认证，并通过集成玄武
              HSM 模块和国密算法支持，满足 ISO/SAE 21434 网络安全要求。SemiDrive 配套供应 ASIL D 级 MCAL 驱动和 FuSaLib 功能安全库，降低 Tier-1
              集成工作量。即便已有这些资质，认证风险仍然重要。当前 ASIL D 产品认证覆盖 E3650 MCU；下一代 X9 SoC 修订版、即将到来的 X10、G9 网关芯片以及新的机器人 R1
              系列是否都持有等效或在途认证，公开资料未完整记录。每个进入安全关键应用的新芯片家族都需要自己的多年认证战役，既耗资本，也耗时间。量产车辆中若发现潜在硅缺陷——尤其在区域控制、底盘控制或高级驾驶辅助等安全关键功能中——可能触发
              OEM 召回。对一家创始人来自 NXP 车规芯片部门、商业模式依赖 OEM 关系的公司而言，产品安全召回会在声誉上造成灾难性打击，在商业上造成毁灭性后果。网络安全合规要求（在欧洲销售车辆适用 UNECE R155
              和 R156）也给计划中的海外供应项目增加了另一重认证负担。欧洲市场车辆处理车内数据时是否符合 EU General Data Protection Regulation（GDPR），仍是未经验证的义务。
