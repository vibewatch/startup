          - type: callout
            title: 区域架构转型带来多年需求顺风
            body: >
              E/E 架构从分布式 ECU 转向区域和域控制器，直接扩大 SemiDrive MCU 线的单车硅含量。BYD 把 120 个 ECU 整合为 75 个高功率节点，是行业参考案例；随着各层级 OEM
              复制这一架构，对具备 ASIL-D 能力的 32/64-bit MCU 需求会上升。SemiDrive E3650 已获得 90% OEM 下一代域控平台提名，一旦这些车型在 2027–2028
              年进入量产，就会提供多年收入管线。
            calloutType: strength
