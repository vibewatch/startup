      - number: '6.3'
        title: 采用轨迹与市场位置
        blocks:
          - type: paragraph
            body: >
              SemiDrive 的采用轨迹体现为两条主要产品线都快速、复合式增长。到 2026 年 5 月，累计芯片交付超过 12 million 颗，从 2024 年约 8 million 颗加速，并在 2025 年末突破
              10 million 里程碑。截至 2026 年 4 月，X9 座舱 SoC 贡献其中 5 million 颗，官方称 YoY 增速超过 50%，并连续两年在中国智能座舱 SoC 市场本土品牌中排名 #1。E3
              MCU 系列同期在 50+ 量产车型中累计达到 5 million+ 颗。

              China Business Daily 2026 年 5 月报道引用的 GAOGONG Intelligence Research（高工智能汽车研究院）数据显示，按出货量，SemiDrive 2025
              年占中国智能座舱 SoC 市场 3.77%——总体第五（竞争对手包括 Qualcomm、Samsung、MediaTek 和 Horizon Robotics），中国本土供应商第一。E3 MCU 系列同样在
              2025 年按出货量进入中国高性能车规 MCU 供应商 top-5，本土第一。背景是，2025 年中国乘用车智能座舱渗透率达到 76.62%，意味着 SemiDrive 的 3.77%
              份额来自一个巨大的可服务池。

              E3650 旗舰 MCU 于 2024 年 10 月进入量产，截至 2026 年 4 月已在 90% 的 OEM 新一代域控平台上取得 design-in 位置。SemiDrive 的产品联合开发模式——OEM
              工程团队与 SemiDrive 共同定义芯片规格，而不是接收现成产品——加快了设计定点转化，但提高了每个客户对应的工程负担。ETAS AUTOSAR 合作（自 2020 年开始，2022 年 7 月正式签约）和
              2026 年 4 月完成的 Elektrobit AUTOSAR 适配，是关键的软件生态赋能因素，降低 OEM 软件团队集成负担，并加快爬坡时间表。
