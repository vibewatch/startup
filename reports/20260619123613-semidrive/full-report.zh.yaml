  - id: TM004
    title: 增长驱动与采用约束
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 机制 / 含义
      - 尽调问题
    rows:
      - - NEV/BEV 普及（MIIT 2030 年 40% 目标）
        - 驱动（+）
        - 中期（2–4 年）
        - 每辆 BEV 约嵌入 68 颗 MCU，而 ICE 约 48 颗；区域控制整合抬高单颗芯片价值
        - 核实 OEM EV 爬坡排期，以及各车型平台芯片含量
      - - E/E 架构转向区域 / 域控制器
        - 驱动（+）
        - 短中期（1–4 年）
        - BYD、Li Auto、NIO 正把 100+ ECU 整合为更少的高功率节点；32/64 位采用提速
        - 确认 SemiDrive 在 ZCU/DCU 定点中相对全球在位者的胜率
      - - 政府国产替代政策（MIIT 大基金三期，CNY 344B）
        - 驱动（+）
        - 短期（≤2 年）
        - 政府车队采购给 10% 价格偏好；国产芯片企业享受税收优惠
        - 评估政策红利是否具体流向 SemiDrive，还是分散到 15+ 家国内新进入者
      - - AI 座舱演进（端侧 LLM 部署，4nm 工艺）
        - 驱动（+）
        - 短期（2026–2027）
        - 2025 年，4nm 芯片在座舱 SoC 装机中的占比从 0.4% 升至 2.8%；X10 瞄准 7B 参数端侧模型
        - 跟踪 X10 量产爬坡和 OEM 采用，相比 Qualcomm SA8397 与 MediaTek Dimensity S1 Ultra 的表现
      - - 强制安全监管（GB 7258 AEB/LKA；C-NCAP 2025 升级）
        - 驱动（+）
        - 短期（已生效）
        - 更广车型段要求 ASIL-D MCU；低等级国产新进入者门槛被抬高
        - 核实 E3650 ASIL-D 认证的客户审计结果和现场可靠性数据
      - - 美国对先进芯片设计工具的出口管制（sub-28nm EDA）
        - 约束（−）
        - 短期（2026 年生效）
        - 放慢国产芯片开发节奏；部分层级被迫使用较老工具或 SMIC 成熟节点
        - 评估 SemiDrive 的 EDA 工具授权状态，以及对 X10（TSMC 4nm）与国产晶圆代工路线图的影响
      - - TSMC / 海外晶圆代工依赖（65% 汽车晶圆来自 TW/JP/KR）
        - 约束（−）
        - 中期（结构性）
        - 2024 年 4 月台湾地震让 TSMC 28nm 停摆 3 周；若地缘政治紧张升级，系统性供给风险会上升
        - 确认 SemiDrive 的安全库存政策、双代工策略（X10 用 TSMC；E3650 22nm 用 SMIC？）
      - - 8 位 MCU 商品化 / ASP 下滑（2024 年 −22%）
        - 约束（−）
        - 短期（活跃）
        - 国内新进入者把低端层级做成商品化市场；STMicro 报告毛利率下降 4.2 个百分点；压力可能上移
        - 评估国产高性能 MCU 竞争加剧时，SemiDrive E3 系列毛利率走势
      - - 5 年汽车认证周期（切换成本）
        - 混合
        - 结构性
        - 高切换成本保护 SemiDrive 已拿下的平台；也拖慢新客户获取
        - 审查 design-in 定点清单，区分新增席位与替换在位者；评估从定点到放量的历史表现
      - - 具身智能相邻市场扩张
        - 驱动（+）
        - 中期（1–3 年）
        - SemiDrive 把车规可靠性 IP 交叉销售到人形机器人；Galaxy General 合作验证了早期需求
        - 跟踪 R1/D9-Max 采用率、相对汽车的 ASP，以及机器人市场毛利率是否不同
    notes: |
      方向表示对 SemiDrive 收入机会的净影响。时间反映该驱动或约束最集中影响采用决策的阶段。「混合」用于同一动态既有帮助（保护已赢客户） 又有阻碍（拖慢新获胜）的情形。
