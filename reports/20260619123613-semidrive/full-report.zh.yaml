            body: >-
              SemiDrive 提供三条已量产车规产品线和一条新兴具身智能线。X9 座舱 SoC 系列是公司的收入锚点，出货超过 5 million 颗，并以 2025 年中国市场 3.77%
              份额验证了本土品牌领先地位。G9 中央网关处理器面向新的车辆 E/E 架构范式，整合 Ethernet、CAN-FD 和 LIN，并集成硬件安全模块。E3 MCU 家族由 22nm 旗舰 E3650 领衔，已实现
              5 million+ 出货，并在 2025 年被高工研究院评为中国高性能车规 MCU 第一供应商。到 2026 年北京车展，全产品累计出货超过 12 million 颗；公司称已覆盖中国前十 OEM
              集团的每一家，以及全球前十中的七家。E3650 已拿到约 90% 国内 OEM 下一代域控平台的设计定点（公司口径），E3 系列已部署在 50+ 款量产车型中，包括 Li Auto L-series、Lotus
              ELETRE 和 Leapmotor C10/C16。2024 年末首次披露的未具名欧洲 OEM X9 SoC 量产车供应协议，标志着 SemiDrive 的首个海外 OEM 定点。
