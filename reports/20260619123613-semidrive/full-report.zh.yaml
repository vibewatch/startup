      - number: '8.3'
        title: 可比估值分析
        blocks:
          - type: paragraph
            body: >
              SemiDrive 仍是私营公司且未披露收入，估值只能依靠上市公司和私募轮次基准。最直接的上市可比公司是 Black Sesame Technologies（HKEX:02533），这是一家聚焦 ADAS
              的中国车规级 SoC 设计商。截至 2026 年 6 月 18 日，Black Sesame 市值约 $1B，企业价值 $966M，LTM 收入 $163M；尽管未盈利（EBITDA 利润率
              -105%），EV/Revenue 仍为 5.9x。Black Sesame FY2024 收入同比增长 75%，高增速部分解释了其相对成熟可比公司的溢价。Horizon
              Robotics（HKG:9660）是一家软件和算法权重更高的中国 ADAS 公司，EV/Revenue 明显更高，约 13.3x（2026 年 6 月 18 日 EV HKD 55.77B、收入 HKD
              4.18B）；但该溢价主要来自软件和算法内容，而非纯芯片收入，因此与 SemiDrive 的硬件中心型商业模式可比性较弱。Horizon 股价较 2025 年末高点下跌
              51%，显示市场情绪波动。成熟西方可比公司中，NXP Semiconductors（市值 $79.09B、TTM 收入 $12.62B、P/S 约 6.3x）和 STMicroelectronics（市值
              $69.67B、TTM 收入约 $12.38B、P/S 约 5.6x）交易倍数更低，反映周期成熟和盈利能力。中国高成长本土玩家相对这些公司享有成长溢价可以成立，但 IPO 后规模化时，很可能向 NXP/ST
              水平压缩。Qualcomm 的 Snapdragon Automotive 平台提供间接交叉校验：Qualcomm 汽车业务收入增长强劲，但被更大的 Qualcomm 整体 P/S 稀释。对 SemiDrive
              而言，6–10x 的混合可比 EV/Revenue 倍数具备防御性；在缺乏盈利证据且收入估算不确定的情况下，应向区间低端加权。以 CB Insights 的 B-III 隐含估值 $1.79B–$1.93B
              作为地板锚，C 轮很可能建立了高于 $2B 的新地板，但这是推断，尚未确认。
