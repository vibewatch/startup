      - number: '8.5'
        title: 退出准备度、论点破裂触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              SemiDrive 最自然的退出路径是 IPO——上海科创板（A 股）或香港交易所（H 股）均可，路径类似 Black Sesame（2024 年 HKEX IPO）和 Horizon Robotics（2024
              年 HKEX IPO）。中国媒体已经把 SemiDrive 称为「汽车芯片独角兽」，多轮国资参与也降低了 IPO 监管摩擦。IPO 时间表未公开；截至研究日期，公司尚未提交任何 S-1
              或招股书。出售给战略收购方（例如大型中国 OEM、Tier-1 供应商或泛中国半导体集团）是概率较低的替代路径，因为公司独立性具有战略价值。西方半导体公司并购 SemiDrive 面临监管障碍，原因在于
              SemiDrive 对中国汽车自主可控议程具有战略重要性。投资论点破裂触发点集中在运营执行、市场环境和资本获取风险。地缘政治风险尤其重要：2026 年 6 月美国出口管制说明把先进 AI
              芯片限制扩展到海外运营的中资实体；如果进一步扩大，可能影响 SemiDrive 下一代 4nm X10 SoC 和 R1
              具身智能芯片系列获取先进制造节点。考虑到国资在股权表中占主导，战略二级退出若没有政府配合，可能性较低；主要流动性事件因此仍是 IPO，IPO 时间线和估值成为任何持仓方最关键的监测变量。
            claimRefs:
