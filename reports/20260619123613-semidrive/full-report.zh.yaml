      - number: '3.4'
        title: 能力对比、定价与 GTM
        blocks:
          - type: paragraph
            body: |
              围绕主要采购标准——座舱 SoC AI 性能、ASIL-D MCU 可得性、网关 SoC 覆盖、
              AUTOSAR 生态深度、中国 OEM 量产记录和全球 OEM 定点——SemiDrive 与
              Qualcomm 在中国市场分别领先不同轴线，NXP 和 Renesas 则在全球 OEM 宽度上领先。
              AI 座舱 SoC 性能层级正在快速演进：Qualcomm SA8397（360 TOPS）与
              SemiDrive 即将推出的 X10（80 TOPS 密集计算，154 GB/s 带宽，可端侧部署
              9B 参数模型）代表 2026–2027 代际，Renesas R-Car X5H 和 Samsung
              Exynos Auto V920 则通过 Chiplet 扩展路径进入。

              SemiDrive E3650 使用 22nm 工艺——比竞争 MCU 常用的 28nm 领先整整一个节点——
              转化为更高每瓦性能和更小物理尺寸（19×19 mm BGA 封装，而竞争 BGA516 封装
              面积大 40%）。随着 Infineon 和 NXP 下一代 MCU 项目前进，这一制程优势会收窄，
              但 SemiDrive 更早进入量产，为 OEM 定点创造了约一个完整车型世代
              （2027–2028 车型平台）的窗口优势。

              座舱 - 驾驶融合是重塑竞争动态的关键架构趋势。Qualcomm SA8775P 从
              2025 年底开始成为首个量产的座舱 - 驾驶融合 SoC；SemiDrive X10 也按同一需求设计，
              采用单芯片架构，公司称可取消独立 AI Box，把每车系统 BOM 成本降低
              RMB 1,500–3,000。

              所有供应商定价均未披露。无论 SemiDrive、Qualcomm、NXP、Renesas 还是
              STMicroelectronics，都不公开汽车 SoC 或 MCU 的 OEM 单颗价格。价格在 OEM
              与 Tier-1 集成商的长期供货协议下双边谈判。Qualcomm 高端座舱平台的行业估计
              ASP（未获公开来源确认）会随出货量和设计复杂度大幅变化；SemiDrive 已实现
              ASP 和毛利率缺口是实质尽调问题。
