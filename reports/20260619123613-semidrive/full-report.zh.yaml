        - 退出；只有运营改善足以支撑修复时才持有；carry 测算承压
      - - 美国制裁扩大，限制 SemiDrive 使用 TSMC，或阻断先进节点设计工具出口
        - 美国商务部正式列入实体清单，或确认 TSMC 已通知 SemiDrive
        - X10（4nm）和 R1 量产路径被卡住；产品竞争力落后至少一代
        - 实质性障碍；立即重估；具身智能扩张也受损
      - - 具身智能收入到 2027 年底低于 $5M
        - IPO 后确认没有客户订单或收入披露
        - 第二增长曲线期权价值被打掉；$100M C 轮 ROI 部分依赖具身智能 TAM 期权
        - 下调牛市情景倍数；估值聚焦汽车主业
      - - 全球汽车半导体周期下行（收入同比收缩 >10%）
        - NXP 或 ST 宣布收入收缩 >10%；中国 NEV 销量环比下降 >5%
        - 历史先例（NXP 2024-2025 年下滑）显示，即便龙头也会出现 8–30% 收入压缩；SemiDrive 未披露数据，评估更难
        - 下调所有情景的远期收入估计；用低谷倍数重新校准 EV
    notes: |
      触发器按估计严重性和可观察性排序。单一杀伤力最大的触发器是美国制裁路径（技术差距不可逆）；短期最可能出现的是汽车周期走弱。所有触发器都可通过公开数据或一手尽调访谈衡量。
    claimRefs:
      - CV031
      - CV034
      - CV035
      - CV047
      - CV052
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入与毛利率披露
        - 经审计或管理层报告的年度收入（2023、2024、2025）以及按产品线拆分的毛利率
        - 收入是所有估值模型的核心输入；没有收入，EV/Revenue 可比分析只能完全依赖情景估计
        - 公司 CFO；IPO 前披露；HKEX 上市申请草稿
      - - C 轮投后估值与股权结构
        - 确认投后估值、总流通股数、优先权结构，以及所有轮次的清算优先权条款
        - 股权结构决定投资人真实回报测算；熊市情景下，清算优先权可能吃掉普通股回报
        - 法律顾问；投资条款清单审阅；HKEX IPO 招股书申报文件（如有）
      - - 制造节点与晶圆厂供货协议
        - 确认 X9、X10、E3、G9 系列的晶圆厂伙伴（TSMC、SMIC）；最低采购量承诺；R1 制程节点路线图
        - 美国出口管制与 TSMC/SMIC 资格是首要地缘政治风险；只有供给安全确认后，DCF 建模才站得住
        - 公司 COO；供应链尽调；晶圆厂备案 / 文件
      - - 客户收入集中度
        - 前五大客户收入拆分；定点转化率；平均合同期限与定价动态
        - 如果集中度高，单个 OEM 客户流失会放大损益冲击；下行情景建模也需要该数据
        - 公司 CRO；向 OEM 采购团队做渠道核查；访谈 Tier-1 供应商
      - - IPO 时间表与交易所选择
        - 确认上市方案（A 股科创板 vs. HKEX vs. 两地上市）；目标 IPO 时间窗口；预期流通股比例与发行规模
        - IPO 是所有投资人类别的主要流动性事件；时间表决定持有期和回报测算
        - 公司 CEO/IR；投行聘用文件审阅；监管申报检索（科创板 CSRC 注册或 HKEX 上市申请）
      - - 具身智能收入管线
        - 确认 R1 和 D9-Max 产品在机器人应用中的客户合同或 LOI；2026-2027 年收入在手订单
        - 牛市情景高度依赖具身智能变现；没有管线，C 轮投向该板块的 $100M 短期 ROI 不可见
        - 公司 BD 团队；伙伴访谈（Galaxy General Robot）；行业活动与产品发布跟踪
    notes: |
      尽调问题按对估值置信度的估计影响排序。第 1、2 项（收入 / 毛利率与股权结构）是上调买入信心的前置条件。第 3、4 项对情景调整重要。第 5、6 项是回报画像建模所必需。
    claimRefs:
      - CV007
      - CV027
      - CV031
      - CV043
      - CV053
      - CV055
