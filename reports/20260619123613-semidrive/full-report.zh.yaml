  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与现状替代方案
        blocks:
          - type: paragraph
            body: >
              SemiDrive 的主要服务市场横跨两个互补的汽车半导体细分：第一，智能座舱 SoC（品牌为 X9/X10 系列），覆盖仪表盘、信息娱乐、多屏域控制器和 AI 辅助人机交互；第二，高性能汽车 MCU（E3
              系列），面向区域控制单元（ZCU）、域控制单元（DCU）、动力总成、底盘和 ADAS 安全应用。第三条产品线——G9
              系列中央网关和域融合处理器——服务中央网关和域融合市场，连接座舱与整车控制架构。三个细分共同构成「智能汽车计算」层，位于商品化车身电子（车窗升降、简单执行器）之上，也低于高阶 ADAS 应用处理器（NVIDIA
              Orin、Horizon Journey 系列）和自动驾驶推理 SoC。

              SemiDrive 的 TAM 不包括：功率电子半导体（逆变器 IGBT、SiC MOSFET）、电池单体传感器和 BMS 模拟前端、雷达和 LiDAR 信号处理 ASIC，以及消费 /
              车联网连接芯片（5G/WiFi 调制解调器），尽管这些同样装在车内。座舱 SoC 的现状替代方案由 Qualcomm Snapdragon 8155P、8295 和 SA8775P（EMEA 与中国）、NXP
              i.MX 8 系列、Renesas R-Car 系列主导。高性能 MCU 的现状替代方案包括 NXP S32K/S32G 家族、Infineon AURIX TC4xx、Renesas RH850 和
              STMicro SPC5 系列——这些都是全球认证的在位者，拥有长期成熟的汽车工具链。具身智能（人形机器人）细分则是 SemiDrive 新近声称进入的相邻市场，公司正把汽车 IP 延伸到这里。
