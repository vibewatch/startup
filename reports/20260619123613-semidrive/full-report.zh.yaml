      - number: '3.5'
        title: 护城河耐久性、切换成本与竞争风险
        blocks:
          - type: paragraph
            body: >
              SemiDrive 的核心护城河在于双品类覆盖：同一家本土供应商同时供应座舱 SoC 和 ASIL-D MCU；同时，公司借助认证 AUTOSAR 伙伴（ETAS、Elektrobit）扩大软件生态，并在中国
              OEM 定点资格上占住先发位置。公司已覆盖中国前 10 大 OEM 集团的 100%，以及全球前 10 大中的 7 家，形成了广泛的设计定点基础，限制了被快速替换的可能。


              车规芯片认证周期通常从 SOP 承诺到量产需要 3–5 年，由此形成买卖双方锁定。SemiDrive 的 E3650 一旦进入下一代 E/E 平台设计（公司称 E3650 瞄准中国 OEM 新一代域控平台的
              90%），OEM 在平台周期中途替换芯片的转换成本会高到难以承受。但同一机制眼下也保护了 NXP 和 Renesas 在全球 OEM 账户中的既有位置；SemiDrive 要拿到非中国定点，必须切入
              incumbents 尚未深扎的绿地平台项目。


              最有力的反向证据来自 TechInsights 记录的性能差距：中国本土座舱 SoC 与 Qualcomm 主流平台仍有差距。SemiDrive 的 X10 瞄准补齐这条差距，但截至 2026 年 6
              月，公司只有一个已确认的非中国量产 OEM 关系（X9 的未具名欧洲车企），累计总出货中进入出口市场车辆的比例低于 10%。面向全球 OEM 账户的 GTM
              基础设施——包括区域销售覆盖、外语技术支持、Tier-1 联合开发资源——仍处早期。


              美国半导体出口管制针对中国总部企业，不论其海外子公司如何安排，由此形成双刃剑：它削弱了 Qualcomm 对中国 OEM 客户的供货确定性，给 SemiDrive
              在国内替代创造机会；但它也提高了全球（尤其欧洲和北美）OEM 供应链对中国来源芯片的地缘政治审查，可能限制 SemiDrive 的国际扩张。SemiDrive 生产依赖 TSMC（公司确认 X10 使用
              4nm），也形成了供给连续性脆弱点，与其试图替代 Qualcomm 时利用的风险相互映照。


              SemiDrive 与 ETAS（Bosch 子公司）、Elektrobit 围绕 AUTOSAR 和 CycurHSM 网络安全认证合作，并满足 VW、GM、SAIC 的技术要求，提升了软件可信度。与 ZBO
              Electronics 合作做全球 IVI 分销（欧洲、南美、东南亚、印度），说明公司意识到了 GTM 缺口，但执行深度和收入贡献尚未公开确认。
