          tone: positive
        - date: '2019'
          label: Series A 轮与首张 ISO 26262:2018 管理认证
          detail: 获得全球首张 TÜV Rheinland ISO 26262:2018 版功能安全管理认证；SAIC 和 Sequoia 入股。
