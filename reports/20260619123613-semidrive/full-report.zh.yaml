            body: >-
              功能安全和网络安全合规是核心产品差异点。SemiDrive 在 2019 年获得 TÜV Rheinland 全球首张 ISO 26262:2018 功能安全管理证书；2026 年，E3650 MCU 获得
              TÜV Rheinland ISO 26262 ASIL D 产品认证，这是最高车规安全完整性等级。SemiDrive 同时提供符合 ASIL-D 的完整软件栈（MCAL 底层驱动和 FuSaLib
              功能安全库）。所有 E3650 单元都满足 AEC-Q100 Grade 1 车规可靠性要求（−40°C 至 +125°C 工作范围）。玄武 HSM 模块满足 ISO/SAE 21434 车规网络安全要求，达到
              Evita Full 及以上，并以硬件支持中国国密和国际算法。ETAS 将其 CycurHSM 适配到 SemiDrive E3 MCU 家族；ETAS 称 CycurHSM 是全球唯一获得 ISO-21434
              产品认证的 HSM 软件。SemiDrive 的网络安全架构已通过 Volkswagen Group、GM 和 Stellantis 的 OEM 网络安全框架认证。
