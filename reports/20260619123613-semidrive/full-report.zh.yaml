      - number: '1.3'
        title: 产品组合与技术差异化
        blocks:
          - type: paragraph
            body: >
              SemiDrive 目前有四个商业化活跃芯片家族。X9 系列是智能座舱 SoC，面向信息娱乐、仪表盘和域控制器应用；它是公司最高出货量产品，也是其国产品牌第一位置的来源。E3 系列是一组高性能汽车
              MCU，覆盖区域控制器、域控制器、高阶底盘 / 动力总成控制和 ADAS 域。G9 系列是中央网关 / 网络处理器，专为集中整车通信的新一代 E/E 架构设计。V9
              系列被列为智能驾驶芯片，但研究时其产品页面无法访问。

              在研下一代旗舰产品包括 X10 AI 座舱 SoC 和 E3800 AMU（Architecture Master Unit）。X10 使用 TSMC 4nm 车规工艺，提供 80 TOPS 密集 AI 算力和
              154 GB/s DDR 带宽，可在端侧部署最高 9B 参数的 AI 模型——这意味着向取消外置 AI 加速盒、并将系统 BOM 成本估计降低 ¥1,500–3,000 迈出实质一步。E3800 则把 E3
              系列扩展到「中央智能控制大脑」角色，集成 10 个以上核心、航空级嵌入式闪存和多层以太网加速。两款产品均在 2026 年 4 月北京车展预览。

              在具身智能方向，SemiDrive 已发布 R1 系列计算大脑和 D9-Max 控制大脑（支持 EtherCAT 实时协议），将其定位为把现有车规级 IP 复用于机器人控制架构。E3650 旗舰 MCU 于
              2026 年获得 TÜV Rheinland ISO 26262 ASIL D 功能安全产品认证，在公司 2019 年取得的流程级 ASIL D 认证之上，又增加了产品级安全证书。
