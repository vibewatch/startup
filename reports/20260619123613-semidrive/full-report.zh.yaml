      - number: '6.4'
        title: 留存、复购与持久性
        blocks:
          - type: paragraph
            body: >
              SemiDrive 不披露留存指标——NRR、GRR、流失率、合同续约率、cohort 数据或 NPS 分数均未公开。这是私营 B2B
              车规芯片公司的常规做法，本身不代表留存问题，但构成了重要尽调缺口。以下结构性指标暗示隐性留存较高：

              第一，车规芯片设计定点会在一款车型 3–5 年生产生命周期内形成工程和合同锁定。芯片一旦通过 AEC-Q100 认证并集成进 OEM Bill of Materials，OEM
              很少会在周期中途转向其他供应商，因为要承担重新认证、软件移植和 BOM 重设计成本。SemiDrive 的 E3 和 X9 部署在 2022–2025 年上市车辆中，这些车辆将大致持续生产到 2027–2030
              年。

              第二，ETAS 合作（自 2020 年活跃，2022 年 7 月签署战略协议）和 2026 年 4 月完成的 Elektrobit AUTOSAR 完整适配，都把 SemiDrive 芯片嵌入更广的软件栈。OEM
              软件团队围绕这些工具搭建开发基础设施之后，转换摩擦会增加。

              第三，Geely 2026 年 4 月公开表示将深化在区域控制和 ADAS 上的合作，这是证据语料中最强的直接留存和 land-and-expand 信号。Shaanxi Automobile（陕汽）在 2026
              年 5 月作为战略投资人加入 Series C，并公开表示有意在其车型平台部署 SemiDrive 芯片——由此形成投资人兼客户关系，进一步把留存与资本绑定。

              已检索语料中没有任何有记录的客户流失事件、量产部署失败、供货纠纷或公开投诉。但不能把这种缺席解读为留存完美：SemiDrive 不会公开暴露供应链事故，OEM 客户也不披露芯片供应商变更。
