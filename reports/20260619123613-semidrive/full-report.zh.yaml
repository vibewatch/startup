      - number: '7.3'
        title: 竞争与技术风险
        blocks:
          - type: paragraph
            body: >
              SemiDrive 在两条核心产品线上同时面对资本雄厚的全球 incumbents 和快速崛起的中国本土竞争者。在座舱 SoC 市场，Qualcomm 的 Snapdragon 平台占据主导；面向 2026
              车型发布的 SA8397 提供 360 TOPS NPU 算力，而 SemiDrive 即将推出的 X10 为 40 TOPS——旗舰层面存在 9x 性能差距。Qualcomm、NXP、Renesas 和
              STMicroelectronics 都有数十年车规认证历史和深扎的 OEM design-in 位置。SemiDrive 2025 年中国座舱 SoC 市场份额达到
              3.77%，总体第五、本土供应商第一；但国内本土化率到 2024 年才刚超过 10%，意味着中国座舱 SoC 市场 90% 仍由外资 incumbents 掌握。本土对手中，SiEngine 的 Longying
              No.1（7nm 制程）仅 Geely Galaxy E5 就已出货超过 1 million 颗，具备舱驾一体的 Longying No.2 也已进入量产。Horizon Robotics 和 Black
              Sesame Technologies 在相邻 ADAS 与计算 SoC 细分竞争，并利用香港 IPO 资本（Horizon enterprise value 约 ~$7B）。座舱 SoC
              市场还处在技术拐点：主流芯片制程正从 7nm 推进到 4nm，支持端侧 7B 多模态模型的 AI 座舱将在两到三年内成为主流。SemiDrive 的 X10 明确为这一转型设计，但必须按计划在 2026
              年实现量产，并在 NPU 与内存带宽规格上顶住 Qualcomm SA8397（360 TOPS / 204 GB/s）和 MediaTek Dimensity S1 Ultra（3nm 制程）的竞争。MCU
              领域，NXP 和 Renesas 仍按装机基数领先全球，本土竞争者 GigaDevice 和 CEC Huada 也在取得 ASIL-D 认证，争夺中国 OEM 项目。
