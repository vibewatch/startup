  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >
              SemiDrive 在中国汽车芯片供应链中占据结构性有利位置。作为全球少数同时提供车规级 SoC 和高性能 MCU 的公司之一，SemiDrive 自 2021 年以来出货超过 1200 万颗芯片，服务中国前十大
              OEM 集团全部成员，并在 2025 年拿下中国乘用车智能座舱前装市场 3.77% 份额——整体第五、国产供应商第一。2026 年 5 月 C 轮（约 $100M，由苏州国资领投，Shaanxi Auto
              作为新战略股东加入）验证了机构信心仍在，也凸显了中国汽车芯片自主可控的政治必要性。向 R1 和 D9-Max 产品线的具身智能转向，扩大了 TAM 可选空间。反论点则落在私营公司收入不透明（无财务披露）上，C
              轮隐含价格缺少价格敏感型验证。$100M C 轮要覆盖三条业务线（座舱 SoC、MCU/车辆控制、具身智能），在 4nm 制程切换和座舱驾驶一体化 SoC
              都需要重资本投入的阶段，单业务线研发预算受限。Qualcomm SA8775P 和 SA8797 已在中国量产车型中落地，2026 年 6 月美国出口管制说明把 AI
              芯片限制扩大到海外中资实体，中期可能影响先进节点准入。Horizon Robotics 股价较 2025 年末高点下跌超过 51%，说明中国汽车 AI 芯片标的即使成功
              IPO，也面临估值倍数压缩风险。建议为跟踪（TRACK），而非买入：在公开证据足以支持价格敏感型投资决策前，投资论点还需要收入披露、股权结构清晰度和 C 轮估值确认。
