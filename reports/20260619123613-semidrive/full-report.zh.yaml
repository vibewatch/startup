      - number: '8.6'
        title: 图表资料
        blocks:
          - type: callout
            title: 跟踪——收入披露是关键催化
            body: >
              SemiDrive 的运营画像值得继续跟踪。近期最重要的单一催化，是收入披露：可能来自 IPO 前的自愿投资人沟通，也可能来自 HKEX 上市申请。在那之前，情景分析把企业价值框在 $885M（熊市）到
              $3.85B+（牛市）之间，约 $2B 的基准情景仅较 2024 年 7 月隐含估值有温和溢价；对缺少股权结构和收入清晰度的新投资人而言，这个入场点可以接受但并不诱人。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV036
              - CV037
              - CV038
          - type: callout
            title: 美国出口管制——不可忽视的尾部风险
            body: >
              2026 年 6 月美国政府说明将 AI 芯片出口限制扩展到海外运营的中资实体，这是一项尚未被充分定价的结构性风险。如果管制进一步收紧，纳入先进制程 SoC 设计工具出口，或限制 SemiDrive 4nm
              X10 项目获得 TSMC 产能，下一代座舱 SoC 路线图可能延迟 18–24 个月，并抹去牛市情景的核心产品假设。hstoday.us
              关于半导体制裁悖论的分析指出，此类管制可能无意中加速中国本土替代方案发展，但短期扰动成本是真实的。该风险概率低、影响高，值得明确监测。
            calloutType: risk
            claimRefs:
              - CV031
              - CV036
              - CV037
          - type: callout
            title: 国资架构降低治理风险，也限制退出弹性
            body: >
              SemiDrive 的多区域国资投资人基础（苏州、北京、西安政府基金，加上 OEM Shaanxi
              Auto）显著降低了治理失灵或被迫融资崩塌的风险。但这也约束了退出弹性：出售给西方收购方在政治上可能性很低，二级出售动态会受国资基金授权约束，而非纯商业逻辑。最现实的退出是境内 IPO，因此 IPO 流程和科创板
              / HKEX 上市估值，是任何非国资投资人测算回报的主要依据。
            calloutType: insight
            claimRefs:
              - CV025
              - CV026
              - CV053
              - CV054
