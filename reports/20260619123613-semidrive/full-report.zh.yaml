  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: |
              SemiDrive 处在两个相互咬合的产品细分中，这两条线共同定义了
              它的竞争足迹：（1）智能座舱 SoC（X9、X10），面向车载信息娱乐、
              数字仪表和域控制器；（2）高性能车规 MCU（E3 系列），覆盖区域
              控制器、动力总成域控制和底盘安全系统。这种双细分策略在纯汽车
              芯片供应商中并不常见，既创造交叉销售优势，也扩大了竞争正面。

              竞争宇宙分为四层。在位者——NXP、Renesas、STMicroelectronics
              和 Qualcomm——占据全球 OEM 钱包份额的大头，受益于深度 Tier-1
              集成、多年 PPAP 认证周期，以及跨越二十多年供货历史的成熟安全栈。
              直接中国本土同行——Horizon Robotics、Black Sesame Technologies、
              SiEngine Technology 和 Huawei HiSilicon——在同一个中国 OEM 市场竞争，
              由国产化要求和 OEM 供应安全担忧驱动。相邻进入者——NVIDIA（DRIVE Thor）
              和 MediaTek（Dimensity S1 Ultra）——分别从高性能 AI 计算和消费级
              汽车芯片侧切入。现状替代方案包括传统离散 MCU 架构、多供应商域板
              （区域架构之前），以及正在萌芽的 OEM 自研芯片联合开发浪潮（BYD
              与 MediaTek、Geely 与 SiEngine）。

              在这个背景下，SemiDrive 估计已连续两年位居中国国产座舱 SoC 市场第一，
              截至 2026 年 4 月，所有产品累计出货超过 1200 万颗。2024 年中国乘用车
              座舱 SoC 整体国产化率超过 10%，并预计继续上升，这验证了市场机会，
              也加剧了中国本土内部竞争。
