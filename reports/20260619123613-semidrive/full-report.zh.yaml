      - number: '4.4'
        title: 公开财务缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              SemiDrive 是私营公司，且根据中国公司法没有任何监管申报义务，几乎造成了全面财务披露缺口。收入、毛利率、EBITDA、运营费用拆分、员工数、客户集中度和 ASP 数据均未公开。CBInsights
              财务档案和 PitchBook 公司页面都在访问控制之后，未提供经验证的财务数据。可用于初步财务结论的证据如下。

              资本位置：按中国初创公司标准相当充足（总融资约 ~$610M），C 轮为三条同步开发线新增 ~$100M。资本强度明显偏高——单次先进节点 tape-out 可花费数千万美元，车规认证每代需要 2–3
              年，具身智能扩张还要求围绕 R1 和 D9-Max 产品线投入额外 NRE。收入模式：结构合理。Fabless 芯片模式叠加 12M+ 累计出货、260+ 客户和 200+ 设计定点，提供了有意义的收入基础，但与
              Qualcomm incumbents 的 ASP 差距带来持续定价压力。利润率路径：现阶段结构性为负，与所有可比上市同行一致；要实现 EBITDA breakeven，需要收入大幅放大（可能 $500M+）或
              R&D 强度急剧下降，两者都不会很快发生。

              一个反向宏观风险是 2026 年 6 月美国出口管制澄清，明确把芯片准入限制延伸到在海外运营的中国所有权企业，并可能延伸至 sub-7nm 芯片设计所需的 EDA 工具。如果先进 EDA
              软件授权受限，SemiDrive 开发 X10 后继产品（可能 3nm）的成本会显著上升。

              核心尽调阻塞点：（a）按产品线拆分收入的审计财务报表；（b）经确认的 burn rate 和融资计划；（c）实际毛利率与 33–65% 可比区间的对照；（d）客户集中度和订单
              backlog。没有管理账，本章只能提供情景框架。
