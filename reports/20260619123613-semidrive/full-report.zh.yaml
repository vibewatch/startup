      - number: '4.3'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >-
              SemiDrive 采用 fabless 半导体模式，省去晶圆制造资本开支，但成本集中在 R&D（前端芯片设计、IP 授权、tape-out 费用）和单颗 COGS（来自 SMIC
              及其他晶圆厂的晶圆成本、组装、测试、封装）。主要资本用途包括四个 R&D 中心的工程人员、每代产品的 tape-out 排期，以及 AEC-Q100/ISO 26262 认证项目。车规芯片开发周期已从 5–8
              年缩短到 2–3 年，tape-out 和再认证支出的节奏与资本强度随之提高。一次先进节点 tape-out 可花费数千万美元；SemiDrive 的 X10（4nm）是公司迄今成本最高的 tape-out
              投资。

              毛利率未披露。可比上市公司给出参考区间：STMicroelectronics 2026 年 Q1 报告 GAAP gross margin 为 33.8%；Black Sesame Technologies
              最近财年毛利率为 41%；Horizon Robotics LTM 毛利率为 65%。33–65% 区间反映了规模、产品组合和晶圆厂议价能力差异。按 SemiDrive 累计出货节奏（约 4 年超过 12M
              颗；约每年 3M 颗且轨迹加速），混合 ASP 为 $10–30 / 颗意味着当前估计年收入 run rate 为 $30–90M，且会随高价 X10 爬坡而上升。这是分析师估计，不是管理层指引。中国车规 MCU
              市场背景：预计 2026 年市场达到 $3.66B（7.11% CAGR 至 2031 年 $5.17B），SemiDrive 主要竞争座舱 SoC 和高端
              MCU，并受到政府偏好本土供应商的支持（政府车队采购中有 10% 价格优势）。营运资本动态未披露；汽车供应链中 OEM/Tier-1 付款账期通常为 90–180
              天，相对收入形成明显营运资本拖累。客户集中度数据不可得。
