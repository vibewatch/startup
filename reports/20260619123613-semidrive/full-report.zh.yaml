      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              最强的结构性驱动来自 EV 渗透率与 E/E 架构集中化的交汇。MIIT 目标是到 2030 年新能车销量占比 40%；每辆 BEV 约嵌入 68 颗 MCU，可比 ICE 车型为 48 颗；区域架构把大量低端
              ECU 集中到更少、更高功率的芯片中——即便单车芯片数量被理顺，单颗芯片 ASP 仍被推高。BYD 在 e-platform 3.0 中把 120 个分布式 ECU 替换为 75 个高功率节点，Li Auto
              也复用了这一概念。这一迁移直接利好 SemiDrive 的高端 ZCU/DCU MCU 线，并创造对 E3650 这类异构多核设计的需求。

              政府政策是第二大驱动。MIIT 的 Big Fund Phase III 承诺投入 CNY 344 billion（约 USD 47 billion）支持国内半导体规模化。政府车队采购中，优惠采购规则给国产芯片
              10% 的价格优势。中国 2024 年 GB 7258 安全法规强制要求自动紧急制动和车道保持辅助，需要 ASIL-D 级 MCU——SemiDrive 已通过 TÜV Rheinland 为 E3650
              取得该认证——覆盖整个车队，而不只是高端车型。2025 年 C-NCAP 升级增加 V2X 和驾驶员监测要求，进一步扩大芯片含量。

              AI 座舱演进构成第三个驱动：汽车芯片制程正从 7nm 向 4nm 推进，仅 2024 至 2025 年，4nm 芯片装机占比就从 0.4% 升至 2.8%。SemiDrive 基于 TSMC 4nm 的 X10
              AI 座舱 SoC 计划于 2026 年量产，目标是在端侧部署 7B 参数多模态大模型；Qualcomm SA8397 等在位者也在同时追求类似规格。

              这些驱动面前仍有实质约束。2026 年 6 月发布的美国出口管制澄清，把半导体限制延伸到在海外运营的中资企业，收紧对先进 AI 硬件和设计工具的获取。对 sub-28nm EDA
              和设计验证工具的限制约束国内芯片开发时间线，并迫使企业转向旧工具流或国产替代。65% 的车规级晶圆产出来自台湾、日本和韩国；2024 年 4 月台湾地震导致 TSMC 28nm
              产线停摆三周，暴露了系统性风险。8-bit 车身控制 MCU 的 ASP 在 2024 年下降 22%，因为国内进入者把低端市场商品化，给生态毛利带来压力。STMicroelectronics
              称，中国车身电子价格竞争导致其毛利率下降 4.2 个百分点；随着国内能力成熟，这种压力可能上移到 32-bit 层级。
