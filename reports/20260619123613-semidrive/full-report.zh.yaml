      - number: '1.5'
        title: 融资历史与投资人结构
        blocks:
          - type: paragraph
            body: >
              SemiDrive 已完成 9 轮融资，CBInsights 记录累计融资 $504.55M。中国第三方财经媒体（Sina Finance / China Business News）报道称累计融资超过 ¥44
              亿元（按 2026 年现行汇率约 $600M），反映不同来源之间可能存在四舍五入和汇率换算差异。最近一轮是 2026 年 5 月 13 日完成的约 $100M（约 ¥690M）Series
              C，由苏产投（Co-Stone Venture Capital / Jiangsu Industrial Investment Social Security
              Fund）领投，陕汽鸿德投资作为战略产业股东加入，亦庄国投（E-Town International Investment）、北京先进制造基金、西安财金投资管理和宜众根泰资本等共同参与。

              早期资本来自战略和财务分量都很重的投资方：SAIC Motor（一家重要 OEM 客户兼投资人）、Sequoia Capital China、Walden International 和 Matrix
              Partners。2024 年 7 月完成的 Series B-III 是 CBInsights 首次记录估值估算的一轮，估值区间为 $1.79B–$1.93B，使 SemiDrive
              当时达到或接近独角兽门槛。Series C 后估值未公开披露。

              投资人组合值得关注：OEM
              关联资本（SAIC、陕汽鸿德）带来商业协同，也可能制造治理复杂度。国资背景资本（苏产投、亦庄国投、北京先进制造基金）反映国产汽车芯片对国家产业政策的战略重要性，并提供政府采购网络入口，但也可能在治理独立性或战略选择空间上形成约束（例如
              IPO 时间、国际化决策或未来 M&A）。上海证券报在 C 轮时称 SemiDrive 为「自动驾驶芯片独角兽」。
