            body: >
              SemiDrive 的 X10 座舱 SoC 路线图建立在 TSMC 4nm 制程之上。中国本土没有该节点的等价晶圆厂。如果美国出口管制扩展到面向中国无晶圆厂 设计公司的先进节点晶圆制造——类似 AI
              训练芯片已发生的情形——X10 项目会停摆，本代产品与 Qualcomm、MediaTek 竞争的窗口也会永久关闭。这是二元结果风险，不是渐进逆风，应按投资论点破裂触发点处理。
