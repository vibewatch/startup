      - number: '5.2'
        title: 技术架构
        blocks:
          - type: paragraph
            body: >-
              SemiDrive 设计异构多核 SoC 和 MCU，并以硅集成做差异化。E3650 MCU 采用 22nm 车规制程——相比同类产品常见的 28nm 具备节点优势——集成 600MHz ARM
              Cortex-R52+ lock-step 集群、带 ECC 的 16MB 嵌入式 NVM 和大容量 SRAM。自研 SSDPE 通信加速器从主 CPU 卸载 CAN FD 包处理，在高总线负载下实现零丢包。玄武
              HSM 模块提供硬件信任根，同时支持中国国密算法（SM2/SM3/SM4）和国际算法（AES/RSA/ECC/SHA）。G9 网关处理器采用异构设计，把高性能 Cortex-A55 CPU 与双核
              lock-step Cortex-R5 配对处理实时任务，并连接集成 SDPE 网络加速引擎，支持高速、低延迟 Ethernet/CAN-FD 交换并内置 HSM。X10 AI 座舱 SoC 转向 TSMC
              4nm 车规制程，提供 80 TOPS 稠密 AI 算力和 154GB/s DDR 带宽，支持端侧部署最高 9B 参数大模型。SemiDrive 称 X10 可替代域控制器加外置 AI Box 的组合，将系统
              BOM 成本降低 RMB 1,500–3,000。公司报告称，E3650 相比可比竞品算力约高 40%、嵌入式存储大 30%、die area 小 40%。
