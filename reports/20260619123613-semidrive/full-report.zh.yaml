chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立背景与运营模式
        blocks:
          - type: paragraph
            body: >
              SemiDrive——中文名芯驰科技（Xinchi Keji），注册主体为北京芯驰半导体科技股份有限公司——成立于 2018
              年，时间大致赶上中国智能电动车加速切换的起点。公司总部位于江苏南京，在北京、上海、南京和深圳设有研发中心。北京注册地和 ICP
              备案（京ICP备2024056528号-1）显示，它是一家国内半导体设计公司，而不是无晶圆厂跨国实体。运营模式是无晶圆厂芯片设计：SemiDrive
              定义、架构设计并流片车规级半导体产品，随后交由代工厂生产（其先进节点 X10 产品包括由 TSMC 代工）。

              战略定位上，公司为下一代汽车电子 / 电气（E/E）架构提供车规级 SoC 和高性能 MCU，覆盖智能座舱、智能网关和核心整车控制。截至 2026 年北京车展，SemiDrive
              正式把使命扩展到具身智能（人形和服务机器人），并将其描述为车规级芯片能力——高可靠性、实时控制、功能安全——向机器人价值链的自然迁移。这条汽车 + 机器人双线雄心，也体现在 2026 年 5 月 Series C
              融资和公司披露的三条资金用途上：AI 座舱 SoC、高端整车控制 MCU、具身智能解决方案。

              SemiDrive 自称是全球少数能同时供应车规级 SoC 和高性能 MCU 的公司之一，覆盖汽车 E/E 演进中最具战略敏感性的两类芯片。理解公司的竞争护城河和组织复杂度时，这种双能力定位是关键。
            claimRefs:
              - CO001
              - CO002
