      items:
        - label: 熊市情景
          low: 700
          mid: 885
          high: 1100
          note: $150M 收入 × 5.9x 可比倍数；低于 B-III 轮隐含 $1.8B 底部
        - label: 基准情景
          low: 1600
          mid: 2000
          high: 2500
          note: $250M 收入 × 8x；较 B-III 锚点小幅溢价；IPO 前折价
        - label: 牛市情景
          low: 2800
          mid: 3850
          high: 5000
          note: $350M+ 收入 × 11x；IPO 溢价；具身智能期权价值
    approximationNotes: |
      区间反映收入估算不确定性（±30%）以及各情景内的倍数区间变化。数值单位为 USD 百万。公司没有确认收入或估值数据；所有数字仅作为方向性判断的情景分析。
    claimRefs:
      - CV036
      - CV037
      - CV038
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    layout: standard
    summary: |
      面向 IC 的七个投资维度评分。评分是分析师基于现有证据给出的判断（1–10 分）；经济性和估值得分较低，反映私有公司信息不透明。
    data:
      items:
        - label: 市场机会
          value: 8
          note: 中国汽车 MCU + 座舱 SoC 在增长；具身智能提供期权价值；全球扩张仍在早期
        - label: 产品 / 技术验证
          value: 8
          note: 12M+ 芯片进入量产；ASIL-D MCU 已认证；X10（4nm）将在 2026 年投产；产品组合完整
        - label: 竞争护城河
          value: 7
          note: 双 SoC+MCU 在国内玩家中独特；AEC-Q100/ASIL-D 认证门槛高；Qualcomm 仍主导高端座舱
        - label: 客户验证
          value: 8
          note: 覆盖中国前十大 OEM；进入全球前十大中的 7 家；260+ 客户；拿下下一代 E/E 平台定点
        - label: 单位经济性 / 财务
          value: 4
          note: 收入和利润率未公开；烧钱速度未知；$100M C 轮分配给 3 条业务线，显示资本压力
        - label: 风险画像
          value: 4
          note: 美国地缘政治风险显著；Qualcomm/NXP/Renesas 带来竞争压力；具身智能尚未验证；存在周期风险
        - label: 估值 / 入场
          value: 5
          note: 隐含约 $1.8B+ 底部；基准约 $2B；相对 Black Sesame（$163M 收入对应 $1B）不便宜；若收入不及预期，估值偏紧
    approximationNotes: |
      评分采用 1–10 分制（10 = 最高确信度）。收入 / 经济性和风险评分因私有公司信息不透明而下调。市场、产品和客户评分反映可直接观察的证据。
