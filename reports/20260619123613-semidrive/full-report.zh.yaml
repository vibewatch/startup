      - number: '2.2'
        title: 市场规模：TAM、视角分析与证据约束
        blocks:
          - type: paragraph
            body: >
              中国汽车 MCU 市场中，当前可得的最颗粒化独立估算来自 Mordor Intelligence：该机构估计 2025 年市场规模为 USD 3.42 billion，2026 年增至 USD 3.66
              billion，到 2031 年达到 USD 5.17 billion，CAGR 为 7.11%。其中，32-bit 器件以 45.78% 的价值份额领先（2025 年 USD 1.57
              billion），反映区域架构迁移；64-bit 器件预计 CAGR 为 8.78%，是增长最快的位宽子细分，因为域融合控制器需要虚拟化和更高吞吐量。纯电动车平台带来最强需求向量，预计到 2031 年 CAGR
              为 11.05%；每辆 BEV 平均嵌入约 68 颗 MCU，而可比 ICE 车型为 48 颗。安全和 ADAS 应用在 2025 年占 MCU 收入 34.05%；电池管理系统预计 CAGR 为
              10.26%，是增长最快的应用子细分。

              座舱 SoC 子市场方面，截至研究日，公开申报文件或可访问分析师预览中没有方法透明的独立 TAM 数字。BusinessWire 和 ResearchAndMarkets 报道称，中国汽车智能座舱 SoC
              的国产化率在 2024 年超过 10%，SemiDrive、HiSilicon 和 SiEngine 被列为领先国产供应商，而 Qualcomm、Renesas 和 AMD 仍主导整体市场。Sina
              Finance 引用 GGII（Gaogong Intelligence Automotive Research）行业数据称，SemiDrive 2025 年占中国智能座舱 SoC 市场
              3.77%，整体排名第五，国产厂商第一。这个数字意味着中国智能座舱 SoC 市场大致为 USD 1–3 billion（考虑到 SemiDrive 已知收入轨迹未获确认），但精确 TAM 分母未被独立披露。RMB
              100,000–200,000 价格带占所有搭载座舱 SoC 的乘用车销量近半，是国内挑战者（SiEngine、Rockchip、MediaTek）增速最快、竞争最激烈的需求中心。

              对 SemiDrive 的高性能 MCU 细分而言，公司 E3 系列按公司引用的 GGII 数据在 2025 年按出货量位列全球前五、国产第一，但没有独立的美元价值口径拆分高性能 MCU 子市场（面向
              ZCU/DCU 的 MCU 与商品化车身控制器）。2024 年中国生产 1040 万辆 NEV，占全国汽车产量 35%，这构成长期 MCU 需求增长的体量基础。
