      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >
              SemiDrive 的资本形成历史，是最主要的估值锚。CB Insights 记录九轮融资、累计融资 $504.55M；但公司自身披露显示，中国融资累计超过 44 亿元人民币（按当前汇率约
              $6.1B），说明公司资本投入的完整图景可能超过 CB Insights 的美元口径。2024 年 7 月 Series B-III 是最后一轮有披露估值估算的融资：CB Insights 估算投后估值为
              $1,793M–$1,931M，使 SemiDrive 进入独角兽区间。2026 年 5 月 13 日 Series C 融资约 $100M（约 ¥6.9
              亿元人民币），由江苏省产业投资社会保障基金（苏州国资）领投，新战略投资方 Shaanxi Automobile Hongde Investment（Shaanxi Auto Group 支持，后者为大型商用车
              OEM）加入，共同投资方包括 E-Town International Investment（北京亦庄国资基金）、Beijing Advanced Manufacturing Fund、Xi'an Finance
              Investment Management 和 Yi Zhong Gentai Capital。C 轮投后估值未公开披露，CB Insights
              将融资金额显示为未披露。苏州、北京、西安政府基金共同参与的多区域国资结构，既释放出与半导体自主政策一致的信号，也降低了未来 IPO 遭遇监管反对的风险。Shaanxi Auto 作为战略 OEM 股东，为
              SemiDrive 带来供应链接入和一个受控 MCU 客户。CB Insights 记录 C 轮后总投资方为 34 家。优先权结构和股权表细节仍属私有；清算优先权与反稀释条款是关键尽调缺口，可能显著影响回报测算。
