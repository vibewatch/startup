      - number: '1.6'
        title: 全球扩张、合作伙伴与战略里程碑
        blocks:
          - type: paragraph
            body: >
              2024–2026 年，SemiDrive 的全球战略从被动覆盖出口车辆，转向主动开发国际 OEM。一家未披露名称的欧洲 OEM 同意在面向 EMEA 市场销售的轿车和 SUV 中部署 X9 座舱 SoC，标志着
              SemiDrive 首个海外 OEM 量产合作。Eugene Wang 在 2024 年确认，当时出货芯片中用于出口车辆的比例低于 10%，因此欧洲项目代表的是结构性一步，而不是单纯增量。

              2026 年 4 月与 ZBO Electronics 签署的战略合作协议，借助基于 SemiDrive 座舱 SoC 的预集成 IVI
              软硬件方案，瞄准欧洲、拉美、东南亚和印度市场。软件生态方面，Elektrobit（2026 年 4 月）完成 E3620 和 E3650 MCU 的完整 AUTOSAR 适配；ETAS（Bosch 子公司，自
              2020 年起为长期合作伙伴，2022 年 7 月正式签约）将覆盖扩展到支持 E3 MCU CycurHSM 网络安全，提供符合 ISO/SAE 21434 的安全固件栈。欧洲 OEM 要求 AUTOSAR
              合规和独立功能安全认证栈，这些生态集成实质提高了 SemiDrive 通过认证的概率。

              2026 年 4 月北京车展是迄今最集中的公开里程碑事件：SemiDrive 发布 Strategy 2.0（汽车智能 → 通用智能），预览 X10 和 E3800 平台，披露 R1/D9-Max
              具身智能产品线，确认与 Galaxy General Robotics 的合作，并宣布累计出货超过 1200 万颗。数周后 2026 年 5 月 Series C 完成，用资本验证了这套战略叙事。

              安全认证历史是关键的信任资产：SemiDrive 于 2019 年获得全球首张 TÜV Rheinland ISO 26262:2018 版本功能安全管理证书，在首次量产爬坡前就建立了流程级 ASIL D
              能力框架。2026 年 E3650 的 ASIL D 产品级认证，为流程证书再补上产品级证明。
