          - type: callout
            title: TSMC 与 EDA 工具依赖形成双重供应链暴露
            body: >
              SemiDrive 的 X10 AI 座舱 SoC 依赖 TSMC 4nm 车规工艺，E3650 则采用 22nm。65% 的车规级晶圆产出来自台湾、日本和韩国。美国对 sub-28nm EDA
              工具的出口管制，让中国国内芯片厂商的设计迭代更复杂。地缘政治升级或台海中断会同时切断晶圆供应并限制设计工具获取，构成短期内缓释手段有限的情景。
            calloutType: risk
            claimRefs:
              - CM032
