      - number: '1.7'
        title: 风险图谱、不利因素与尽调缺口
        blocks:
          - type: paragraph
            body: >
              SemiDrive 的风险画像由三个贯穿各章的结构性挑战塑造。第一，私营公司不透明：SemiDrive 不公开披露收入、毛利率、经营利润、员工数或股权结构细节。$100M Series C 融资没有任何已披露收入
              run-rate 可匹配，外部分析师无法建模烧钱速度、现金跑道或利润率轨迹。这对中国晚期无晶圆厂芯片初创公司并不罕见，但意味着投资人只能用客户牵引指标（定点项目、出货量、OEM
              覆盖）代替直接财务证据来判断财务健康度。

              第二，出口管制和供应链风险：SemiDrive 的 X10 AI 座舱 SoC 使用 TSMC 4nm 车规工艺。截至 2026 年 6
              月，美国政府政策明确把先进芯片出口限制延伸到中资企业，不论其在哪里运营——这一澄清把先进 AI 加速器硬件限制扩展到全球范围内的中国实体。虽然 SemiDrive 现有产品（22nm E3650、既有 X9
              SoC）未必触发最高等级管制，但公司的未来产品路线图依赖持续获得 TSMC 或同等级代工厂的先进制程节点。任何美中半导体政策升级，都可能推迟先进节点流片，并实质影响 X10 产品进度。

              第三，Sina Finance 指出的「三线资本风险」：约 $100M Series C 被分配到座舱 SoC 开发、高性能 MCU
              扩展，以及一条全新的具身智能产品线。每条线单独都需要数亿元人民币级投资周期（先进流片、软件生态开发、认证成本）。把一轮 C 轮资金摊到三条线，会提高至少一条线投资不足的概率，尤其当机器人商业化时间线延伸到
              2027 年之后时。来自 NXP、Renesas、Qualcomm（国际）以及 Horizon Robotics（国内座舱 ADAS 芯片）的竞争压力，又进一步压缩执行窗口。
