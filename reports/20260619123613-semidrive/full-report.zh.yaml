  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层
        blocks:
          - type: paragraph
            body: >
              SemiDrive 的客户群几乎完全由中国汽车 OEM 集团及其一级（Tier-1）供应链伙伴构成，围绕三类主要采购渠道组织：OEM 直接芯片供应、Tier-1
              模组集成商，以及国际渠道分销商。所有情境下，买方都是 OEM 工程或采购组织；芯片的终端用户则是使用座舱、动力总成控制或 ADAS 功能的车内乘员。

              截至 2026 年 5 月，SemiDrive 服务 260+ 客户，拥有 200+ 设计定点项目。公司称对中国前 10 大 OEM 集团覆盖率为 100%，全球前 10 大 OEM 集团中有 7
              家已在量产车中部署 SemiDrive 芯片。对一家 2018 年成立的公司而言，这些数字代表了广泛市场渗透。按产品线划分，客户分为四个垂直：（1）智能座舱——采购 X9 SoC 的 OEM
              infotainment 和仪表集成商；（2）车辆控制——采购 E3 MCU 的 OEM 与 Tier-1 ECU / 域控制器开发者；（3）网关与 ADAS——采购 G9 网关 SoC 和 V9 ADAS
              SoC 的 OEM；（4）具身智能——采购未来 R1 和 D9-Max 产品的机器人 OEM（收入前合作阶段）。

              地域分层高度偏向中国：截至 2024 年，累计芯片出货中流向出口车辆的比例低于 10%。已具名的国际扩张仅限于一个未披露欧洲 OEM（X9 SoC，EMEA 轿车 / SUV，计划 2025 H2）、与 ZBO
              Electronics 的渠道合作，覆盖欧洲、南美、SE Asia 和印度（2026 年 4 月签署），以及与 Elektrobit 的软件生态赋能合作（2026 年 4 月完成 AUTOSAR
              适配），后者满足欧洲软件定义汽车采购要求。2025 年中国乘用车智能座舱渗透率达到 76.62%，为 SemiDrive 国内客户增长提供了巨大的出货基数。
