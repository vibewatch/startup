      - number: '1.4'
        title: 商业规模、客户与市场位置
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 5 月，SemiDrive 全产品家族累计芯片出货超过 1200 万颗，高于 2025 年底披露的 1000 万颗和 2024 年早期参考点的 800 万颗——说明连续生产加速已经显著。仅
              X9 座舱 SoC 系列累计交付就超过 500 万颗，同比增长超过 50%，成为中国智能座舱芯片细分市场国产品牌第一。E3 MCU 系列在商业量产前三年突破 500 万颗。

              以一家成立 8 年的芯片初创公司标准看，客户覆盖很广。SemiDrive 已实现中国前 10 大汽车 OEM 集团 100% 渗透——覆盖 SAIC
              Motor、Chery、Chang'an、GAC、BAIC、Dongfeng 等品牌——并进入全球前 10 大 OEM 集团中的 7 家。公司称其服务客户超过 260 家，已获定点项目超过 200
              个。公开来源点名的客户包括 Chery、Chang'an、SAIC、GAC、BAIC、Li Auto、Nissan、Honda、Volkswagen 和 Geely/吉利。

              第三方市场研究（GGAII / 高工智能汽车研究院）按出货量将 SemiDrive 列为 2025 年中国高性能汽车 MCU 市场全球前 5、国产第一。座舱 SoC 方面，SemiDrive 约占中国市场
              3.77%，也是唯一覆盖从仪表盘到域控制器全应用谱系的国产品牌。E3650 旗舰 MCU 已在 90% 的 OEM 下一代域控制器平台获得提名，E3620 动力总成 MCU 也有多个 Tier 1
              集成项目在开发中。
