      - number: '7.4'
        title: 资本强度与财务风险
        blocks:
          - type: paragraph
            body: >
              汽车芯片设计是无晶圆厂半导体开发里最烧钱的分支之一。一颗芯片从初始设计到流片、车规级认证，再到爬坡量产，通常要花掉数亿元人民币；单次 7nm 或 5nm 先进制程流片，仅晶圆费用就可能达到数千万美元，还不含
              EDA 许可、验证和多年认证周期。SemiDrive 于 2026 年 5 月完成约 $100M（近 10 亿美元） C 轮融资，累计融资超过 44 亿元人民币。针对 C 轮的分析师评论明确指出，$100M
              分摊到座舱 SoC、MCU 和具身智能三条竞争赛道，在各方向的资本需求面前「并不宽裕」。2026 北京车展宣布的具身智能转向，瞄准「脑—小脑—躯干—关节」机器人全栈产品，核心汽车业务仍在为 X10
              开发持续烧钱，同时还要追加 NRE、认证和市场投入。商业化阶段更靠后的中国汽车芯片可比公司，展示了结构性投入压力：Horizon Robotics LTM 收入 $707M、EBITDA 为
              -$584M；Black Sesame Technologies 收入 $163M、EBITDA 为 -$170M。SemiDrive
              没有公开披露收入、毛利率或盈利能力数据，外部无法独立判断烧钱速度和资金续航。按历史融资节奏（约每 18 到 24 个月一轮），如果研发节奏不变，本轮资金或可支撑运营到 2027
              年；但任何成本超支、晶圆厂涨价或项目延期，都可能迫使公司进行稀释性的过桥融资。STMicroelectronics（规模相近的全球成熟厂商）2026 年 Q1 毛利率为 33.8%，可作为 SemiDrive
              规模化后应瞄准的利润结构参照，但 SemiDrive 的真实毛利率仍未验证。
