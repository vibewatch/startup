      - number: '7.7'
        title: 风险联动与投资论点破裂点
        blocks:
          - type: paragraph
            body: >
              核心风险并非相互独立：传导路径最终都汇到两个结果——收入不及预期和估值压缩。美国出口管制升级，是下游影响最广的根触发因素。一旦先进制程节点（TSMC 4nm/5nm）受限，X10 路线图停滞，座舱 SoC
              客户转向 Qualcomm 或 MediaTek，本土 OEM 信任被削弱，下一轮融资折价定价——这一切可能在两到三年窗口内发生。资本耗尽是第二个独立触发因素，下游效果相近：如果约 $100M C
              轮资金不足以在下一轮融资前完成 X10 流片并取得 AEC-Q100 认证，困境型过桥融资会稀释早期投资人，并向 OEM 定点团队释放项目困难信号。安全召回或重大现场失效概率低，但严重度高；SemiDrive
              芯片已进入数百款车型的区域控制器和底盘应用，一旦安全关键路径出现软件或硬件缺陷，可能触发 OEM 责任索赔，并被立即踢出定点。四个投资论点破裂触发点是：（1）TSMC 出于任何原因限制向 SemiDrive
              供货；（2）C 轮资金在 Series D 完成前耗尽；（3）首个海外 OEM 取消或实质性推迟；（4）已装车量产产品的 ISO 26262 ASIL D
              认证失败或被撤销。这些触发点应被视为可监测、具体的事件，而非方向性趋势。如果十二个月后的下一次尽调更新中四项均保持绿色，尽管结构性风险仍在，投资论点仍然走在正轨上。
