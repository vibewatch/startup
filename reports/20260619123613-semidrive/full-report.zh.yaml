      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >
              SemiDrive 由仇雨菁和张强共同创立，仇雨菁担任董事长兼 CEO。两位创始人此前均在 NXP Semiconductors 担任高管；NXP 是全球汽车微控制器领域的主导在位者。仇雨菁曾任 NXP
              中国汽车芯片研发负责人，张强曾任 NXP 大中华区汽车事业部负责人。这个创始团队配置——技术深、且已经规模化交付过车规级产品的芯片设计者——强烈证明创始人与市场匹配，也让公司在面对要求严苛整车认证流程的 OEM
              采购团队时更有可信度。

              更广义的高管团队包括 CTO 孙鸣乐，他主导旗舰 X10 AI 座舱 SoC 的架构规格，并在 2026 年北京车展公开发布；MCU 产品线总经理张曦桐，负责 E3 系列路线图和战略；国际业务总经理 Eugene
              Wang，则是公司全球扩张计划的主要公开发言人，尤其代表公司沟通欧洲 OEM 供货协议。

              关键人物风险集中。仇雨菁是唯一被点名的创始人，也是投资者会议和媒体活动中的公众面孔。以公司当前规模而言，作为私营企业未公开治理文件、董事会构成或继任计划并不罕见，但对任何 LP
              或战略投资者的尽调都是实质缺口。独立董事如存在，也未公开披露。晚期 Series B/C 公司常见的投资人密集型董事会，可能包括 SAIC、Sequoia China 和 / 或新机构投资者代表，但尚未证实。
