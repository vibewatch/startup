      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              中国汽车 SoC 和 MCU 市场通过两条不同采购路径运转，并在软件定义汽车（SDV）范式下趋于合流。传统路径是芯片经过 Tier-1 域控制器集成商（如 Bosch、Continental、UAES、Desay
              SV、Foryou），Tier-1 是直接采购相对方；OEM 批准芯片供应商，但不直接下采购单。新兴路径在座舱 SoC 和高端 MCU 选择中越来越常见：OEM 直接作出 design-in 决策，与
              Tier-1 伙伴共同选择芯片，甚至指定某款芯片，随后由 Tier-1 集成并开票。SemiDrive 横跨 260+ 客户关系的 200+ 个 design-in 项目（Sina
              Finance，2026）体现了两条路径的宽度。

              OEM 买方基础高度集中：SemiDrive 覆盖中国所有前 10 大 OEM 集团和全球前 10 大中的 7 家，包括 Chery、Changan、SAIC、GAC、BAIC 和 Li
              Auto（SCMP），也通过国际 OEM 采用隐含覆盖 Honda、Nissan 和 Volkswagen。采用触发点因细分而异：座舱 SoC 的触发点是 3–5 年设计周期的新车型项目；MCU 的触发点是
              E/E 架构重构周期，同样为 3–5 年。Geely 硬件工程负责人公开确认 SemiDrive E3650 和 E3620「精准匹配」Geely 新一代 EE 架构方向，并将该产品家族列为关键战略重点。ZBO
              Electronics 2026 年战略合作协议把买方路径扩展到欧洲、南美、东南亚和印度 OEM，突破中国本土装机基础。

              发票层面的付款方通常是 Tier-1 集成商，其模块 BOM 成本吸收芯片价格。OEM 最终通过模块总成采购价为此买单，因此 OEM 对 BOM 的敏感度就是价格天花板。SP Global
              指出，汽车芯片验证传统上可拉长到 5 年，一旦芯片完成设计导入，切换成本就很高——这有利于在位者，也让 SemiDrive 一旦获得提名，就能形成更耐久的收入。
