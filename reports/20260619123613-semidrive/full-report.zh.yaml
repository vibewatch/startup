          tone: positive
        - date: '2022'
          label: E3 MCU 发布与国内首个 ASIL D/SIL 3 认证
          detail: E3 系列成为首款获得 ASIL D 的国产 MCU；2022 年 7 月与 ETAS 合作正式化。
          tone: positive
        - date: '2024'
