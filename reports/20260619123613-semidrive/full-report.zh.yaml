      - number: '7.6'
        title: 执行、人才与披露风险
        blocks:
          - type: paragraph
            body: >
              SemiDrive 创始团队有 20 多年汽车芯片经验，根基来自 NXP 中国汽车业务：CEO 仇雨菁曾任 NXP 中国汽车芯片研发负责人，CTO 张强曾领导 NXP
              大中华区汽车业务部。履历是优势，也带来关键人风险：任一创始人离开，公司都会失去多年在 NXP 积累的、最直接通向汽车 OEM 关系网络的制度连接。2026 年 4
              月宣布的具身智能战略转向，带来执行带宽风险。公司要同时管理座舱 SoC 升级周期（X9 到 X10，4nm）、MCU 产品线扩张（E3 系列爬坡、ZCU 和底盘应用），以及新的机器人芯片栈（R1
              负责计算「大脑」，D9-Max 负责电机控制「小脑」）；在汽车芯片工程师稀缺的人才市场里，这等于把工程组织的有效工作范围放大三倍。作为私营公司，SemiDrive
              不发布财报、员工数、收入或毛利数据。披露不透明意味着，投资人无法在融资轮之间独立核验烧钱速度、单位经济性或公司财务状况。公司首个海外 OEM
              订单来自未披露名称的欧洲车企，外部也难以独立验证交易条款、产量承诺或量产状态。新海外 OEM 的汽车芯片认证周期，从初步评估、验证、型式认证到量产签核，通常需要两到三年；因此即使订单已经宣布，海外定点
              转化为现金流仍很遥远。负面财经报道已指出，「具身智能 + 汽车」双线战略可能分散管理层注意力，并拖延核心汽车产品刷新。
