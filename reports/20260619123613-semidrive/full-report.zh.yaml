    summary: >
      基于分析师证据和公开披露，将九家竞争者按中国市场渗透率（x 轴）与 AI 原生座舱 SoC 性能层级（y 轴）做序数定位。Qualcomm 在两条轴上都占优；国产玩家中，SemiDrive 和 Huawei HiSilicon
