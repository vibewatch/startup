    具身智能模块，用于机器人。
  customerFocus: 中国及全球汽车 OEM 及其 Tier-1 供应商；目标场景覆盖智能座舱、整车控制（区域 / 域 ECU）、中央网关和 ADAS。覆盖中国前 10 大 OEM 集团 100%，以及全球前 10 大 OEM 集团中的 7 家。
  businessModel: >-
    按颗向汽车 OEM 和 Tier-1 供应商销售无晶圆厂芯片，采用设计定点模式；定点项目锁定多年量产供货协议。软件工具（SDK、AUTOSAR
    中间件、安全库）随芯片捆绑，帮助生态更快采用，并降低客户切换意愿。未发现单独定价的软件收入线。
