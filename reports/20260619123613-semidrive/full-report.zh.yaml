      - number: '8.4'
        title: 牛市、基准与熊市估值情景
        blocks:
          - type: paragraph
            body: >
              三个情景框定 SemiDrive 投资论点，每个情景都把估算收入区间与可解释的 EV/Revenue 倍数结合。所有收入数字均为基于出货量和 ASP 逻辑推导的情景估算，明确不是公司确认披露。牛市情景：到
              2027 年，SemiDrive 成功完成 H 股或 A 股 IPO，并证明座舱 SoC 采用加速（4nm X10 于 2026 年进入量产）、全球 OEM 供货启动、具身智能形成早期收入。估算收入达到
              $350M+，毛利率恢复至 40%+；约 11x EV/Revenue 的 IPO 倍数（因规模和全球触达相对 Black Sesame 溢价）意味着企业价值
              $3.85B+。基准情景：收入继续增长，但全球扩张和具身智能货币化推迟 12–18 个月；估算收入约 $250M、8x EV/Revenue 倍数，意味着企业价值约 $2.0B——较 B-III
              隐含地板只有温和溢价。C 轮投资人大致打平或取得小幅回报；如果盈利路径得到确认，两年内可获得 IPO 估值可见性。熊市情景：汽车半导体周期下行（类似 NXP 2024–2025 年收入收缩）叠加
              Qualcomm/Renesas 在 MCU 细分市场的竞争替代；具身智能商业化被推迟；估算收入 $150M，按 5.9x 可比倍数（匹配规模相近但已被公开市场验证的 Black Sesame）计算，企业价值约
              $885M——相对 $1.8B+ 的 B-III 锚点可能出现降估值融资。熊市触发因素包括美国制裁收紧并影响 SMIC 或 TSMC 准入、重要 OEM 客户流失，以及跨域 SoC
              产品周期失败。基准情景是中心情形；牛市需要近期关键催化（收入披露、IPO 申请、首个海外 OEM 确认出货）落地。
