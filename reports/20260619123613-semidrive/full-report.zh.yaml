companyProfile:
  summary: >-
    SemiDrive（芯驰科技，Xinchi Keji）是一家位于南京的车规级无晶圆厂汽车半导体公司，2018 年由前 NXP Semiconductors 高管创立，目标是补齐中国车规芯片供应的国产缺口。公司设计并销售汽车 SoC
    （X9/X10 座舱系列）、高性能 MCU（E3 系列）、中央网关 SoC（G9）和 ADAS SoC（V9），是少数能同时规模化供应 SoC 与 MCU 两类产品的中国本土公司之一。截至 2026 年 5 月，SemiDrive
    芯片出货已超过 1200 万颗，覆盖中国前 10 大 OEM 集团 100%，以 3.77% 的中国市场份额位列国产座舱 SoC 供应商第一，并完成约 $100M 的 Series C，使累计融资超过 ¥44 亿元人民币。2026
    年 4 月北京车展上，公司发布「Strategy 2.0」，借助 R1 计算大脑和 D9-Max 运动控制器，把使命延伸到具身智能（机器人）领域。
  foundedDate: '2018-01-01'
  founders:
    - name: Chou Yujing (仇雨菁)
      role: 联合创始人、董事长兼 CEO
