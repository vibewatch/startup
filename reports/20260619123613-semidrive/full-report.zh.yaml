      - number: '6.2'
        title: 具名 OEM 证明与部署证据
        blocks:
          - type: paragraph
            body: >
              SemiDrive 的具名量产部署证据在 E3 MCU 产品线上最强，既有公司新闻稿，也有独立媒体佐证，覆盖多个国内 OEM 品牌。E3 系列在中国汽车行业实现了两个有意义的第一：首个用于量产车 LiDAR
              控制的国产高性能 MCU，以及首个应用于量产乘用车主动悬架（CDC）控制系统的国产车规芯片。

              LiDAR 应用方面，具名车型包括 Li Auto（理想）L7、L8、L9、MEGA，以及 Lotus ELETRE、Leapmotor C10 和 C16——均已验证量产。主动悬架控制方面，具名车型包括
              Chery Tiggo 9 和 Xingtu Yaokuang（Chery 的高端子品牌）。在动力总成 / EV 领域，E3 MCU 芯片通过 Tier-1 供应商 Weiran Energy（威睿能源）集成进
              Smart Elf #1、Smart Elf #3 和 Zeekr X 的 OBC/DCDC 系统；这些车辆出口到欧洲，提供了间接的国际量产足迹。Geely（吉利）是确认最明确的主要 OEM 客户：2026 年
              4 月北京车展上，Geely Intelligent Hardware Center 负责人 Wei Hao 公开确认双方围绕 E3 MCU 系列在 EV
              动力总成和三电系统上深度合作，并表达了把合作延伸至区域控制和 ADAS 领域的计划。这是证据语料中最强的独立客户证言。

              X9 座舱 SoC 方面，SCMP 和 Asia Business Outlook 在 2024 年末确认，SemiDrive 自 2021 年以来已向 100+ 车型供应芯片，并点名
              Chery、Chang'an、SAIC Motor、GAC、BAIC 和 Li Auto 为座舱客户。独立来源没有公开确认 X9 部署的具体车型名称。首个欧洲 OEM 客户身份仍未由 SemiDrive
              或所有已检索独立来源披露，限制了公司最常引用的国际里程碑的可验证性。
