      - number: '6.5'
        title: 集中度风险与全球扩张
        blocks:
          - type: paragraph
            body: >
              SemiDrive 面临重大的地域客户集中。截至 2024 年末，累计芯片出货中流向出口车辆的比例低于 10%，意味着超过 90% 的创收出货量绑定在中国本土 OEM
              生产上。中国新能源车市场若持续收缩、地缘贸易冲击出现，或国内 OEM 利润率被压缩并把价格压力传导给芯片供应商，SemiDrive 的出货量会受到不成比例的影响。

              在中国内部，OEM 集中度风险难以评估，因为 SemiDrive 没有披露按客户划分的收入拆分。260+ 的客户数意味着按账户数量看较为分散，但出货集中度很可能明显偏向领先 NEV 平台（Geely 生态、Li
              Auto、Chery 高端线），这些平台最积极采用需要 E3 MCU 和 AI 座舱 SoC 的域控制器架构。投资人基础（SAIC Motor、Sequoia China、Matrix Partners，以及
              2026 年 5 月加入的 Shaanxi Auto）包含 OEM 战略投资人；若这些投资人偏好 SemiDrive 而非替代方案，可能放大集中度，也可能在其日后转向时制造风险。

              全球扩张活跃但仍处早期。首个宣布的欧洲 OEM 交易（面向 EMEA 轿车 / SUV 车型的 X9 SoC，2024 年末宣布）尚未被独立确认已达量产或正式合同公告。ZBO Electronics 于 2026
              年 4 月签约成为渠道伙伴，为欧洲、南美、东南亚和印度提供分销基础设施，但该渠道对应的客户 pipeline 尚未披露。美国围绕中国芯片供应链对欧洲 OEM 施加地缘政治压力——体现在对中国企业 AI
              和半导体供应限制日益扩大——即使供应关系存在，也可能让欧洲 OEM 不愿公开披露，从而增加国际扩张轨迹的不透明度。

              China Business Daily 的分析师评论指出，~$100M Series C 要分拆给三项战略押注（AI 座舱
              SoC、MCU、具身智能），相对于每个方向所需的工程投入可能偏薄，可能给国际扩张线带来执行风险。
