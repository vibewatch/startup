  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与出口管制风险
        blocks:
          - type: paragraph
            body: >
              美国针对先进半导体技术的出口管制，是 SemiDrive 产品路线图中严重度最高的外部风险。2026 年 6 月，美国政府澄清先进 AI
              芯片出口限制不仅适用于在中国境内运营的公司，也适用于中国所有权企业及其位于海外的子公司，关闭了部分中国科技公司通过离岸实体获取受限硬件的漏洞。NVIDIA 的 Blackwell AI
              芯片仍在限制清单上；其他先进处理器继续面临许可审查。对 SemiDrive 的实际后果，是围绕美国来源电子设计自动化（EDA）工具、先进制程节点技术和 ARM
              架构授权的边界持续收紧，而这些都对公司下一代产品路线图至关重要。Mordor Intelligence 指出，sub-28nm
              设计工具上的出口管制摩擦直接压低了中国本土车规芯片供应链成熟的速度。SemiDrive 的 X10 座舱 SoC 瞄准 4nm 制程节点，目前该节点只能由中国以外的 TSMC 提供。美国管制若扩大到覆盖 TSMC
              为中国芯片设计公司提供的制造服务，X10 项目将停摆。中国 MIIT “Big Fund” Phase III CNY 344 billion（$47
              billion）计划表明，北京把半导体自给视为国家安全优先事项，给国内带来监管顺风，也凸显这条供应链的政治敏感性。本土化政策形成优先采购优势（政府车队据称有 10%
              价格边际），但如果政策目标改变或贸易谈判介入，也让 SemiDrive 暴露于快速反转风险。另一个单独风险是，SemiDrive
              已宣布海外扩张——包括与未披露欧洲车企的首个量产供应协议——但该业务位于地缘政治灰色地带，欧洲 OEM 可能因政治和客户压力而不愿在 EMEA 销售车辆中采用中国芯片。
