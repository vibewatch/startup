      - number: '7.5'
        title: 合作伙伴、客户集中度与依赖风险
        blocks:
          - type: paragraph
            body: >
              SemiDrive 的收入基础高度集中在中国本土 OEM：总经理 Eugene Wang 接受 SCMP 采访时称，自 2021 年以来累计出货的 1200 万颗以上芯片中，用于出口市场车辆的比例低于
              10%。公司服务 260 多家客户，覆盖超过 90% 的中国本土 OEM 集团，包括中国前十大 OEM 集团全部成员，以及全球前十大 OEM
              集团中的七家。客户面广是优势，但收入集中在单一地理和政策环境，也构成实质风险：中国汽车国产化偏好若逆转，中外双边贸易协议若让海外成熟厂商以同等条件重返市场，或地缘政治升级触发反向制裁，都可能快速压缩本土需求。供给侧，SemiDrive
              对 TSMC 存在关键依赖，下一代座舱 SoC 路线图（4nm X10）所需先进制程节点离不开 TSMC。国内晶圆厂 SMIC 承接较老节点（28nm 及以上），CanSemi
              支持部分汽车芯片产能，但两者都不具备竞争性 AI 座舱芯片所需 4nm 或 5nm 节点资质。ARM IP 许可支撑 SemiDrive 的 CPU 和 GPU 内核架构；如果 ARM
              向中国芯片设计公司授权的能力受扰动（假设美国出口管制进一步延伸），新的 SoC 开发会停摆。AUTOSAR 与安全软件栈建立在 Elektrobit（AUMOVIO 子公司）和 ETAS（Bosch
              子公司）合作之上；两者提供基础 MCAL 驱动、中间件和网络安全模块，SemiDrive 将其与芯片打包。任一伙伴交付失败或调价，公司都要花高成本自研替代。海外扩张上，SemiDrive 依赖 ZBO
              Electronics（2026 年 4 月签约）进入欧洲、南美、东南亚和印度市场；未具名欧洲车企订单，是海外分销模式的第一场考验。
