      - number: '2.5'
        title: 矛盾、规模缺口与尽调要求
        blocks:
          - type: paragraph
            body: >
              两个关于国产替代速度的冲突信号，让市场份额建模变复杂。SemiDrive 2026 年 4 月北京车展演示引用行业预测称，国产厂商将在 2026 年拿下中国汽车芯片市场
              35%。但一份独立分析师报告（BusinessWire/ResearchAndMarkets，2025）认为，截至 2024 年，座舱 SoC 国产化率仅约 10%。这两个数字不能直接比较——35%
              汇总了所有汽车芯片品类，包括国产厂商推进更深的成熟功率、传感器和车身细分，而 10% 只衡量高端座舱 SoC 层。不过，这个差距说明 SemiDrive 最具战略意义、毛利最高的细分（座舱
              SoC）仍高度依赖进口，不能未经调整就把 35% 的标题数字套用到高端芯片细分。

              Qualcomm 仍主导高端座舱 SoC 细分（车价高于 RMB 200,000），Snapdragon 8155P、8295 和 SA8775P 仍是首选平台。包括 SemiDrive 在内的中国国产供应商，在
              RMB 100,000–200,000 价格带增长最快；该价格带更敏感于成本，国产供应链的设计支持响应速度也能形成竞争杠杆。

              公开渠道没有可访问的 SAM/SOM 数字能隔离 SemiDrive 可服务的高性能 MCU + 座舱 SoC 合并子市场。投资级尽调需要直接接触 OEM 采购团队，或购买 GGII / China
              Automotive Technology & Research Center（CATARC）出货数据库。SemiDrive 2026 年 4 月累计 1200 万颗芯片出货与 2025 年底 1000
              万颗之间的差值，意味着 2026 年前四个月新增约 200 万颗，显示 run-rate 正在加速；但如果没有单颗收入，无法转化为按价值计的市场份额数字。
            claimRefs:
              - CM037
              - CM038
              - CM039
              - CM040
      - number: '2.6'
        title: 图表
        blocks:
