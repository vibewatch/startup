            body: >-
              ~$100M Series C 轮融资覆盖三条并行产品线：车规 SoC、MCU 和具身智能。相比每条产品线分别融资且轮次规模更大的竞争者，SemiDrive 每个活跃战线分到的资本明显更薄，在 X10 和
              E3800 关键 R&D 与认证窗口期，单条产品线投入不足的风险上升。
            calloutType: risk
            claimRefs:
              - CE047
