        - Black Sesame 在年收入 $122M 上每月 burn 约 $16M；Horizon Robotics 在 $556M 上每月约 $62M
        - 确认扣除收入后的月度现金消耗；索取季度现金流量表
      - - C 轮后估算 runway
        - 假设每月 burn $10–35M，估算为 18–48 个月（2027 年末至 2030 年中）
        - 低 — 取决于未披露的收入轨迹和费用管理；无指引
        - 假设不再融资；IPO 或后续融资会显著延长 runway
        - 索取融资计划、下一轮触发条件、资金用途拆分和董事会批准的经营计划
    notes: 账面现金、burn rate 和 runway 等资本充足性数字，来自已披露融资总额和可比同行 burn 结构的估算。SemiDrive 未披露资产负债表、利润表或现金流数据。置信度评级反映估算不确定性。所有估算仅为情景输入。
