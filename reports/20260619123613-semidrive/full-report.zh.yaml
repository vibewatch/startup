            title: 国产替代按细分分层
            body: >
              SemiDrive 引用的 35% 全品类国产汽车芯片份额预测，反映的是成熟、低技术含量细分（功率、传感器、车身电子）在内的整体进展。座舱 SoC 层——SemiDrive ASP 最高的产品线——截至 2024
              年国产化率约为 10%。投资人应从这个更低基数建模座舱 SoC 市场份额提升，而不是直接套用 35% 的标题数字。
            calloutType: insight
