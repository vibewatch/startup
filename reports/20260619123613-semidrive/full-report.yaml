        title: Partner, Customer Concentration, and Dependency Risk
        blocks:
          - type: paragraph
            body: >
              SemiDrive's revenue base is highly concentrated in Chinese domestic OEMs: fewer than 10% of the cumulative
              12+ million chips shipped since 2021 were used in export-market vehicles as of the SCMP interview with
              general manager Eugene Wang. The company serves over 260 customers covering more than 90% of domestic
              Chinese OEM groups, including all of China's top ten OEM groups and seven of the global top ten OEM
              groups. While breadth is a strength, revenue concentration in a single geography and policy environment is
              a material risk: any reversal of China's automotive localization preference, a bilateral trade deal that
              reopens the market to foreign incumbents on equal terms, or geopolitical escalation imposing reverse
              sanctions could compress domestic demand sharply. On the supply side, SemiDrive is critically dependent on
              TSMC for the advanced process nodes needed for its next-generation cockpit SoC roadmap (X10 at 4nm).
              Domestic foundry SMIC serves older nodes (28nm and above) and CanSemi supports some automotive chip
              volumes, but neither is qualified for the 4nm or 5nm nodes required for competitive AI cockpit chips. ARM
              IP licenses underpin SemiDrive's CPU and GPU core architecture; any disruption to ARM's ability to license
              Chinese chip designers (under hypothetical US export-control extensions) would halt new SoC development.
              The AUTOSAR and safety software stack is built on partnerships with Elektrobit (AUMOVIO subsidiary) and
              ETAS (Bosch subsidiary); both provide foundational MCAL drivers, middleware, and cybersecurity modules
              that SemiDrive bundles with its chips. Failure or pricing changes at either partner would require
              expensive in-house development to replace. For overseas expansion, SemiDrive relies on ZBO Electronics
              (signed April 2026) to access European, South American, Southeast Asian, and Indian markets; the unnamed
