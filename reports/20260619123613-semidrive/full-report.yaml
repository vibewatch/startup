      - number: '2.2'
        title: 'Market Sizing: TAM, Lens Analysis, and Evidence Constraints'
        blocks:
          - type: paragraph
            body: >
              The most granular independent estimate available for the China automotive MCU market comes from Mordor
              Intelligence, which sizes it at USD 3.42 billion in 2025, growing to USD 3.66 billion in 2026 and USD 5.17
              billion by 2031 at a 7.11% CAGR. Within that market, 32-bit devices lead with a 45.78% value share (USD
              1.57 billion in 2025), reflecting the zonal architecture shift; 64-bit devices are forecast at an 8.78%
              CAGR—the fastest bit-class sub-segment—as domain-fusion controllers demand virtualization and higher
              throughput. Battery electric vehicle platforms create the strongest demand vector, with an 11.05% CAGR
              expected through 2031, each BEV embedding approximately 68 MCUs on average versus 48 in a comparable ICE
              model. Safety and ADAS applications captured 34.05% of MCU revenue in 2025; battery management systems are
              projected at 10.26% CAGR, the fastest application sub-segment.

              For the cockpit SoC sub-market, no independently sourced TAM figure with a transparent methodology was
              available in public filings or accessible analyst previews as of the research date. BusinessWire and
              ResearchAndMarkets report that the domestic localization rate for China automotive intelligent cockpit
              SoCs exceeded 10% in 2024, with SemiDrive, HiSilicon, and SiEngine identified as the leading domestic
              vendors, while Qualcomm, Renesas, and AMD still dominate the overall market. Sina Finance, citing industry
              data from GGII (Gaogong Intelligence Automotive Research), reports SemiDrive holding 3.77% of China's
              intelligent cockpit SoC market in 2025, ranking fifth overall and first among domestic vendors. This
              figure implies a China intelligent cockpit SoC market of roughly USD 1–3 billion (given SemiDrive's known
              revenue trajectory is unconfirmed), though the precise TAM denominator is not independently disclosed. The
              RMB 100,000–200,000 price range accounts for nearly half of all passenger-car cockpit SoC-equipped vehicle
              sales, making it the fiercely contested demand center where domestic challengers (SiEngine, Rockchip,
              MediaTek) are gaining fastest.

              For SemiDrive's high-performance MCU segment, the company's E3 series ranked among the top five globally
              and #1 domestically by shipments in 2025 per company-cited GGII data, but no independent dollar-value
              breakdown of the high-performance MCU sub-market (MCUs targeted at ZCU/DCU versus commodity body
              controllers) is available. China produced 10.4 million NEVs in 2024—35% of national auto
              output—establishing the volume base underpinning long-term MCU demand growth.
