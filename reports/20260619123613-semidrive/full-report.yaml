      - number: '6.2'
        title: Named OEM proof and deployment evidence
        blocks:
          - type: paragraph
            body: >
              SemiDrive's named production deployment evidence is strongest for the E3 MCU product line, confirmed
              across multiple domestic OEM brands through both company press releases and independent media
              corroboration. The E3 series achieved two meaningful firsts in the China automotive industry: it was the
              first domestic high-performance MCU deployed for LiDAR control in mass-produced vehicles, and the first
              domestic automotive chip applied to active-suspension (CDC) control systems in a production passenger car.

              For LiDAR applications, named models include Li Auto (理想) L7, L8, L9, and MEGA, as well as Lotus ELETRE
              and Leapmotor C10 and C16 — all verified in mass production. For active-suspension control, named models
              include the Chery Tiggo 9 and Xingtu Yaokuang (Chery's premium sub-brand). In the powertrain/EV domain, E3
              MCU chips were integrated via Tier-1 supplier Weiran Energy (威睿能源) into OBC/DCDC systems on Smart Elf #1,
              Smart Elf #3, and Zeekr X — vehicles that were exported to Europe, providing an indirect international
              production footprint. Geely (吉利) is the most definitively confirmed major OEM customer: at the April 2026
              Beijing Auto Show, Geely's Intelligent Hardware Center head Wei Hao publicly confirmed deep cooperation on
              E3 MCU series for EV powertrain and three-electric systems, and expressed plans to extend the partnership
              to zone control and ADAS domains. This is the strongest independent customer testimony in the corpus.

              For the X9 cockpit SoC, SCMP and Asia Business Outlook confirmed in late 2024 that SemiDrive has supplied
              chips to 100+ vehicle models since 2021, naming Chery, Chang'an, SAIC Motor, GAC, BAIC, and Li Auto as
              cockpit customers. No specific model names for X9 deployments are publicly confirmed in independent
              sources. The identity of the first European OEM customer remains undisclosed by both SemiDrive and all
              searched independent sources, limiting verifiability of the company's most-cited international milestone.
