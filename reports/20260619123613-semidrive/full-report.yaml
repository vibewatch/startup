      - number: '5.3'
        title: Safety, Security, and Compliance
        blocks:
          - type: paragraph
            body: >-
              Functional safety and cybersecurity compliance are core product differentiators. SemiDrive obtained TÜV
              Rheinland's first ISO 26262:2018 functional-safety management certificate globally in 2019, and in 2026
              the E3650 MCU achieved TÜV Rheinland ISO 26262 ASIL D product certification—the highest automotive safety
              integrity level. SemiDrive simultaneously provides an ASIL-D-compliant full software stack (MCAL
              bottom-layer drivers and the FuSaLib functional-safety library). All E3650 units meet AEC-Q100 Grade 1
              automotive reliability requirements (−40°C to +125°C operating range). The Xuanwu HSM module meets ISO/SAE
              21434 automotive cybersecurity requirements at Evita Full and above, with hardware support for Chinese
              national cryptography alongside international algorithms. ETAS' CycurHSM, described by ETAS as the world's
              only ISO-21434 product-certified HSM software, has been adapted for the SemiDrive E3 MCU family.
              SemiDrive's cybersecurity architecture is qualified under Volkswagen Group, GM, and Stellantis OEM
              cybersecurity frameworks.
