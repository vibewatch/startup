      - number: '7.6'
        title: Execution, People, and Disclosure Risk
        blocks:
          - type: paragraph
            body: >
              SemiDrive's founding team brings 20+ years of automotive chip experience rooted in NXP's China automotive
              division: CEO Qiu Yujing was NXP's China automotive chip R&D head and CTO Zhang Qiang led NXP's Greater
              China Automotive Business Unit. This pedigree is a strength but also a key-person risk: if either founder
              departs, the company loses its most direct institutional connection to automotive OEM relationship
              networks built over years at NXP. The embodied intelligence strategic pivot announced in April 2026
              represents an execution bandwidth risk. Simultaneously managing a cockpit SoC upgrade cycle (X9 to X10,
              4nm), an MCU product line expansion (E3 series ramp, ZCU and chassis applications), and a new robotics
              chip stack (R1 for computing "brain", D9-Max for motor control "cerebellum") requires tripling the
              effective scope of the engineering organisation in a talent market where automotive chip engineers are
              scarce. As a private company, SemiDrive does not publish financial statements, headcount, revenue, or
              margin data. This disclosure opacity means investors cannot independently verify burn rate, unit
              economics, or the financial position of the company between fundraising rounds. The company's first
              overseas OEM deal involves an unidentified European automaker, which limits the ability to independently
              verify deal terms, volume commitments, or production status. The automotive chip qualification cycle for a
              new overseas OEM—from initial chip evaluation through validation, homologation, and series production
              sign-off—typically spans two to three years, meaning revenue from overseas wins is a distant cash flow
              even after the deal is announced. Adverse financial coverage has noted the potential for the "dual-track"
              embodied-intelligence and automotive strategy to fragment management focus and delay the core automotive
              product refresh.
