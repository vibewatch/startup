            title: Post-Series-C valuation and financial metrics undisclosed
            body: >-
              No post-Series-C valuation, revenue, gross margin, burn rate, or employee headcount has been publicly
              disclosed. The July 2024 CBInsights valuation estimate of $1.79–$1.93B may be stale. Investors should
              request financial data room access as a gating condition for any transaction.
            calloutType: risk
            claimRefs:
              - CO022
              - CO038
          - type: callout
            title: Advanced-node supply-chain exposure to US export controls
            body: >-
              The next-generation X10 SoC requires TSMC 4nm automotive process. Tightening US export restrictions on
              Chinese-owned firms — extended to overseas subsidiaries as of June 2026 — represent a scenario risk to
              SemiDrive's advanced-node roadmap execution.
            calloutType: risk
            claimRefs:
              - CO029
              - CO037
          - type: callout
            title: Prioritize financial data room and governance documentation
            body: >-
              Given the private-company opacity gap and the three-track capital deployment, the highest-priority
              diligence step is reviewing audited financials, cap table, and board governance documents. Confirm whether
              Series C proceeds are ring-fenced per track or treated as unified working capital.
            calloutType: recommendation
            claimRefs:
