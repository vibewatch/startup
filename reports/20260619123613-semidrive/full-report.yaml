    rows:
      - - NEV/BEV proliferation (MIIT 40% target by 2030)
        - Driver (+)
        - Medium-term (2–4 yr)
        - Each BEV embeds ~68 MCUs vs ~48 ICE; zonal consolidation raises per-chip value
        - Verify OEM EV ramp schedules and chip content per model platform
      - - E/E architecture shift to zonal/domain controllers
        - Driver (+)
        - Short–medium-term (1–4 yr)
        - BYD, Li Auto, NIO consolidating 100+ ECUs into fewer high-power nodes; accelerates 32/64-bit adoption
        - Confirm SemiDrive win rate in ZCU/DCU nominations vs. global incumbents
      - - Government domestic-substitution policy (MIIT Big Fund III, CNY 344B)
        - Driver (+)
        - Short-term (≤2 yr)
        - 10% price preference in gov. fleet procurement; preferential tax treatment for domestic chip firms
        - Assess whether policy benefits flow to SemiDrive specifically or spread across 15+ domestic entrants
      - - AI cockpit evolution (on-device LLM deployment, 4nm process)
        - Driver (+)
        - Short-term (2026–2027)
        - >-
          4nm chips rose from 0.4% to 2.8% of cockpit SoC installations in 2025; X10 targets 7B parameter on-device
          model
        - Track X10 mass-production ramp and OEM adoption vs. Qualcomm SA8397 and MediaTek Dimensity S1 Ultra
      - - Mandatory safety regulation (GB 7258 AEB/LKA; C-NCAP 2025 upgrade)
        - Driver (+)
        - Short-term (already in force)
        - ASIL-D MCU mandated across broader vehicle segments; raises barrier for low-grade domestic entrants
        - Verify customer audit results and field reliability data for E3650 ASIL-D certification
      - - US export controls on advanced chip design tools (sub-28nm EDA)
        - Constraint (−)
        - Short-term (active 2026)
        - Slows domestic chip development timelines; forces use of older tools or SMIC mature nodes for some layers
        - Assess SemiDrive's EDA tool licensing status and impact on X10 (TSMC 4nm) versus domestic foundry roadmap
      - - TSMC / overseas foundry dependency (65% of automotive wafers from TW/JP/KR)
        - Constraint (−)
        - Medium-term (structural)
        - >-
          April 2024 Taiwan earthquake halted TSMC 28nm for 3 weeks; systemic supply risk if geopolitical tension
          escalates
        - Confirm SemiDrive's safety-stock policy, dual-foundry strategy (TSMC for X10; SMIC for E3650 22nm?)
      - - 8-bit MCU commoditization / ASP erosion (−22% in 2024)
        - Constraint (−)
        - Short-term (active)
        - >-
          Domestic entrants commoditizing lower tiers; STMicro reported 4.2-pt gross margin decline; could migrate
          upward
        - Assess SemiDrive's gross margin trajectory on E3 series as domestic hi-perf MCU competition intensifies
      - - 5-year automotive qualification cycle (switching cost)
        - Mixed
        - Structural
        - High switching cost protects SemiDrive in won platforms; also slows new customer acquisition
        - Review design-in nomination list for new vs. incumbent slot displacement; assess time-to-volume track record
      - - Embodied-intelligence adjacency expansion
        - Driver (+)
        - Medium-term (1–3 yr)
        - >-
          SemiDrive cross-sells automotive-grade reliability IP into humanoid robots; Galaxy General partnership
          validates early demand
        - Track R1/D9-Max adoption rates, ASPs relative to automotive, and whether robot-market gross margins differ
    notes: >
      Direction designates net impact on SemiDrive's revenue opportunity. Timing reflects when the driver or constraint
      most acutely affects adoption decisions. 'Mixed' applies where the same dynamic both helps (protects won accounts)
