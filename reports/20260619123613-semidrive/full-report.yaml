  - id: FV003
    title: Bull / Base / Bear Enterprise Value Range
    type: range
    layout: standard
    summary: >
      Low/base/high enterprise value estimates under the three scenarios, reflecting revenue and multiple variation. All
      values are analytical estimates, not market prices.
    data:
      items:
        - label: Bear Scenario
          low: 700
          mid: 885
          high: 1100
          note: $150M rev × 5.9x comp; down from B-III implied $1.8B floor
        - label: Base Scenario
          low: 1600
          mid: 2000
          high: 2500
          note: $250M rev × 8x; modest premium to B-III anchor; pre-IPO discount
        - label: Bull Scenario
          low: 2800
          mid: 3850
          high: 5000
          note: $350M+ rev × 11x; IPO premium; embodied intelligence option value
    approximationNotes: >
      Ranges reflect revenue estimation uncertainty (±30%) and multiple range variation within each scenario. Values in
      USD millions. No confirmed revenue or valuation data from the company; all figures are scenario analysis for
      directional guidance only.
