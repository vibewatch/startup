      - CV037
      - CV038
  - id: FV004
    title: Investment KPI Scorecard
    type: kpi
    layout: standard
    summary: >
      IC-ready scoring across seven investment dimensions. Scores are analyst assessments (1–10) based on available
      evidence; lower scores in economics and valuation reflect private opacity.
    data:
      items:
        - label: Market Opportunity
          value: 8
          note: China automotive MCU + cockpit SoC growing; embodied intelligence optionality; global expansion nascent
        - label: Product / Tech Proof
          value: 8
          note: 12M+ chips in mass production; ASIL-D MCU certified; X10 (4nm) entering production 2026; full portfolio
        - label: Competitive Moat
          value: 7
          note: >-
            Dual SoC+MCU unique among domestic players; AEC-Q100/ASIL-D certifications high barrier; Qualcomm still
            dominant in premium cockpit
        - label: Customer Proof
          value: 8
          note: All top-10 China OEMs; 7 of global top-10; 260+ customers; design wins in next-gen E/E platforms
        - label: Unit Economics / Financial
          value: 4
          note: >-
            Revenue and margins private; burn unknown; $100M C-round split across 3 business lines signals capital
            pressure
        - label: Risk Profile
          value: 4
          note: >-
            US geopolitical risk material; competitive pressure from Qualcomm/NXP/Renesas; embodied intelligence
            unproven; cycle risk
        - label: Valuation / Entry
          value: 5
          note: >-
            Implied ~$1.8B+ floor; base ~$2B; not cheap vs. Black Sesame ($1B for $163M revenue); stretched if revenue
            disappoints
    approximationNotes: >
      Scores are on a 1–10 scale (10 = highest conviction). Revenue/economics and risk scores are penalized for private
      opacity. Market, product, and customer scores reflect directly observable evidence.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV021
      - CV044
