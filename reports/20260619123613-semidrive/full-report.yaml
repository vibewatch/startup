      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The most powerful structural driver is the intersection of EV penetration and E/E architecture
              consolidation. MIIT targets 40% new-energy vehicle sales by 2030; each BEV embeds approximately 68 MCUs
              versus 48 in a comparable ICE model, and zonal architectures consolidate many low-end ECUs into fewer,
              higher-power chips—pushing the average selling price per chip upward even as unit counts rationalize. BYD
              replaced 120 distributed ECUs with 75 higher-power nodes in its e-platform 3.0, and Li Auto replicated the
              concept. This shift directly benefits SemiDrive's premium ZCU/DCU MCU line and creates demand for the kind
              of heterogeneous multi-core design the E3650 delivers.

              Government policy is the second major driver. MIIT's Big Fund Phase III commits CNY 344 billion
              (approximately USD 47 billion) to domestic semiconductor scaling. Preferential procurement rules give
              domestic chips a 10% price edge in government fleet purchases. China's 2024 GB 7258 safety regulation
              mandates automatic emergency braking and lane-keeping assist, requiring ASIL-D-rated MCUs—a certification
              SemiDrive now holds via TÜV Rheinland for E3650—across the vehicle fleet rather than only in premium
              models. The 2025 C-NCAP upgrade adds V2X and driver-monitoring mandates, further expanding chip content.

              AI cockpit evolution represents the third driver: automotive chip processes are advancing from 7nm toward
              4nm, with 4nm chips rising from 0.4% to 2.8% of installations between 2024 and 2025 alone. SemiDrive's X10
              AI cockpit SoC on TSMC 4nm—scheduled for mass production in 2026—targets on-device deployment of
              7B-parameter multimodal large models, a specification that incumbents like Qualcomm SA8397 are pursuing
              simultaneously.

              Against these drivers stand material constraints. US export control clarifications issued in June 2026
              extend semiconductor restrictions to Chinese-owned firms operating overseas, tightening access to advanced
              AI hardware and design tools. Restrictions on sub-28nm EDA and design verification tools constrain
              domestic chip development timelines and push firms toward older tool flows or homegrown alternatives.
              Sixty-five percent of automotive-grade wafer output originates from Taiwan, Japan, and South Korea; the
              April 2024 Taiwan earthquake halted TSMC 28nm lines for three weeks, demonstrating systemic exposure.
              Average selling prices for 8-bit body-control MCUs dropped 22% in 2024 as domestic entrants commoditized
              the low end, creating margin pressure across the ecosystem. STMicroelectronics cited a 4.2-point gross
              margin dip linked to China's body-electronics price competition—a pressure that could migrate upward to
              32-bit tiers as domestic capabilities mature.
