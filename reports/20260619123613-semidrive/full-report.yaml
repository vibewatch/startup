      - number: '1.5'
        title: Funding history and investor structure
        blocks:
          - type: paragraph
            body: >
              SemiDrive has completed nine funding rounds, with CBInsights recording total capital raised of $504.55M.
              Third-party Chinese financial press (Sina Finance / China Business News) reports cumulative funding
              exceeding ¥4.4 billion (approximately $600M at prevailing 2026 exchange rates), reflecting possible
              rounding and currency-conversion differences between sources. The most recent round is a Series C of
              approximately $100M (~¥690M) closed on May 13, 2026, led by 苏产投 (Co-Stone Venture Capital / Jiangsu
              Industrial Investment Social Security Fund), with Shaanxi Auto Hongde Investment joining as a strategic
              industrial shareholder and co-investors including 亦庄国投 (E-Town International Investment), Beijing Advanced
              Manufacturing Fund, Xi'an Finance Investment Management, and Yizhong Gentai Capital.

              Early capital came from strategically and financially prominent investors: SAIC Motor (a major OEM
              customer-investor), Sequoia Capital China, Walden International, and Matrix Partners. The Series B-III
              round closed in July 2024 was the first round for which CBInsights recorded a valuation estimate of
              $1.79–$1.93 billion, placing SemiDrive at or near unicorn threshold at that time. No post-Series-C
              valuation has been publicly disclosed.

              The investor mix is notable: OEM-linked capital (SAIC, Shaanxi Auto Hongde) creates both commercial
              alignment and potential governance complexity. State-linked capital (苏产投, 亦庄国投, Beijing Advanced
              Manufacturing Fund) reflects the strategic importance of domestic automotive chips to national industrial
              policy and provides access to government procurement networks, but also introduces potential constraints
              on governance independence or strategic optionality (e.g., IPO timing, internationalization decisions, or
              future M&A). Shanghai Securities News characterized SemiDrive as an "autonomous driving chip unicorn" at
              the time of the C round.
