      - number: '1.7'
        title: Risk landscape, adverse factors, and diligence gaps
        blocks:
          - type: paragraph
            body: >
              SemiDrive's risk profile is shaped by three structural challenges that cut across chapters. First,
              private-company opacity: SemiDrive does not disclose revenue, gross margin, operating profit, employee
              count, or cap table details publicly. The $100M Series C raises are not matched by any disclosed revenue
              run-rate, making it impossible for an external analyst to model burn rate, runway, or margin trajectory.
              This is not unusual for a Chinese late-stage fabless startup, but it means investors must rely on customer
              traction metrics (design wins, shipment volume, OEM coverage) as proxies for financial health rather than
              direct financial evidence.

              Second, export-control and supply-chain risk: SemiDrive's X10 AI cockpit SoC uses TSMC's 4nm
              automotive-grade process. US government policy as of June 2026 explicitly extends advanced chip export
              restrictions to Chinese-owned firms regardless of where they operate — a clarification that extends
              restrictions on advanced AI accelerator hardware to Chinese entities globally. While SemiDrive's current
              products (22nm E3650, existing X9 SoC) may not trigger the highest-tier controls, the company's future
              product roadmap depends on continued access to advanced fabrication nodes at TSMC or equivalent foundries.
              Any escalation in US-China semiconductor policy could delay advanced-node tapeouts and materially affect
              the X10 product schedule.

              Third, the "three-front capital risk" identified by Sina Finance: the ~$100M Series C is allocated across
              cockpit SoC development, high-performance MCU expansion, and an entirely new embodied intelligence product
              line. Each track individually requires multi-hundred-million-RMB investment cycles (advanced tapeouts,
              software ecosystem development, certification costs). Spreading a single C-round across all three
              increases the probability of under-investment in at least one track, particularly if the robotics
              commercialization timeline extends beyond 2027. Competitive pressure from NXP, Renesas, Qualcomm
              (international), and Horizon Robotics (domestic in cockpit ADAS chips) adds execution urgency.
            claimRefs:
              - CO037
              - CO038
              - CO039
              - CO044
