      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Qualcomm AI Cockpit Dominance is Structural, Not Just Temporal
            body: >
              Qualcomm's SA8397 (360 TOPS, 204.8 GB/s) already exceeds the specifications of SemiDrive's X10 (80 TOPS,
              154 GB/s) on raw AI compute, and Qualcomm's global software, certification, and distribution ecosystems
              are deep. SemiDrive's Chinese-market advantage is real, but the performance and ecosystem gap with
              Qualcomm in global markets is structural and will require multiple product generations and substantial
              ecosystem investment to close. Export-control disruption to Qualcomm is a plausible tailwind in China but
              is not a reliable global competitive strategy.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
              - CP031
              - CP032
          - type: callout
            title: Dual SoC + MCU Portfolio Is a Rare and Defensible Competitive Position
            body: >
              Among domestic Chinese automotive chip companies, SemiDrive is one of the very few simultaneously offering
              a high-performance cockpit SoC (X9/X10) and an ASIL-D certified high-performance MCU (E3 series). NXP and
              Renesas offer both globally, but no domestic Chinese peer matches this combination. This dual-coverage
              enables cross-sell into OEM E/E platform programmes and creates stickier customer relationships than
              single-product competitors.
            calloutType: strength
            claimRefs:
              - CP025
              - CP039
              - CP041
          - type: callout
            title: Export Control Dynamics Create Both a Tailwind and a Vulnerability
            body: >
              US export controls targeting Chinese-headquartered firms regardless of overseas operations simultaneously
              make Qualcomm-dependent China OEMs more receptive to SemiDrive's domestic X9/X10 proposition and expose
              SemiDrive's own TSMC-dependent production chain (X10 on 4nm) to the same geopolitical disruption risk.
              Investors should stress-test both scenarios: SemiDrive displacement of Qualcomm in China (upside) and
              SemiDrive's own supply interruption from TSMC access restrictions (downside).
            calloutType: insight
            claimRefs:
