          Destroys second-growth-curve option value; $100M C-round ROI depends partly on embodied-intelligence TAM
          optionality
        - Adjust bull-scenario multiple downward; focus valuation on automotive core
      - - Automotive semiconductor global cycle downturn (revenue contraction >10% YoY)
        - NXP or ST announce >10% revenue contraction; China NEV volumes decline >5% QoQ
        - >-
          Historical precedent (NXP 2024-2025 decline) shows even leaders compress 8–30% revenue; SemiDrive harder to
          assess without disclosure
        - Reduce forward revenue estimate in all scenarios; recalibrate EV using trough multiples
    notes: >
      Triggers are ordered by estimated severity and observability. The most damaging single trigger is the US sanctions
      pathway (irreversible technology gap); the most probable short-term trigger is automotive cycle softening. All
      triggers are measurable through public data or primary diligence conversations.
    claimRefs:
      - CV031
      - CV034
      - CV035
      - CV047
      - CV052
  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Revenue and gross margin disclosure
        - Audited or management-reported annual revenue (2023, 2024, 2025) and gross margin by product line
        - >-
          Revenue is the primary input to all valuation models; without it, EV/Revenue comp analysis relies entirely on
          scenario estimates
        - Company CFO; pre-IPO disclosure; HKEX listing application draft
      - - C-round post-money valuation and cap table
        - >-
          Confirmed post-money valuation, total shares outstanding, preference stack, and liquidation-preference terms
          for all rounds
        - >-
          Cap-table structure determines actual investor return math; liquidation preferences in a bear scenario could
          wipe common-share returns
        - Legal counsel; term sheet review; HKEX IPO prospectus filing (if available)
      - - Manufacturing node and foundry supply agreements
        - >-
          Confirmed foundry partners (TSMC, SMIC) for X9, X10, E3, G9 series; minimum volume commitments; process node
          roadmap for R1
        - >-
          US export controls and TSMC/SMIC eligibility are the primary geopolitical risk; confirmed supply security is
          necessary for DCF modeling
        - Company COO; supply chain due diligence; foundry filings
      - - Customer revenue concentration
        - >-
          Revenue breakdown by top-5 customers; design-win conversion rate; average contract duration and pricing
          dynamics
        - >-
          A single OEM customer loss has outsized P&L impact if concentration is high; also needed for downside scenario
          modeling
        - Company CRO; channel checks with OEM procurement teams; Tier-1 supplier interviews
      - - IPO timeline and exchange selection
        - >-
          Confirmed listing plan (A-share STAR Market vs. HKEX vs. dual listing); targeted IPO date range; expected
          free-float and offer size
        - >-
          IPO is the primary liquidity event for all investor classes; timeline drives hold period and return
          calculation
        - >-
          Company CEO/IR; investment bank mandate review; regulatory filing search (STAR Market CSRC registration or
          HKEX listing application)
      - - Embodied-intelligence revenue pipeline
        - >-
          Confirmed customer contracts or LOIs for R1 and D9-Max products in robotic applications; revenue backlog for
          2026-2027
        - >-
          The bull scenario depends materially on embodied-intelligence monetization; without pipeline, the $100M
          C-round allocation to this segment has no near-term ROI visibility
        - Company BD team; partner interviews (Galaxy General Robot); industry events and product launch trackers
    notes: >
      Diligence asks are ranked by estimated impact on valuation confidence. Items 1 and 2 (revenue/margin and cap
      table) are blocking for any buy-conviction upgrade. Items 3 and 4 are material for scenario adjustment. Items 5
      and 6 are required for return-profile modeling.
    claimRefs:
      - CV007
      - CV027
      - CV031
      - CV043
      - CV053
      - CV055
