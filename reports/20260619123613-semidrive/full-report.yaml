  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization
        blocks:
          - type: paragraph
            body: >-
              SemiDrive generates revenue through the sale of automotive-grade chip units to Tier-1 automotive suppliers
              and OEM customers, the canonical model for a fabless semiconductor company. Its primary revenue drivers
              are the cockpit SoC family (X9/X9P series; next-gen X10 entering mass production in 2026) and the
              high-performance MCU family (E3 series, with E3650 flagship in mass production since late 2025). Secondary
              product lines—the G9 central-gateway SoC and V9 intelligent-driving SoC—add further per-unit revenue. With
              over 12 million chips shipped cumulatively through May 2026, 200+ active design-win projects, and 260+
              customers, SemiDrive has established a meaningful recurring volume base. Customer breadth is exceptional:
              100% coverage of China's top 10 OEM groups and seven of the global top 10 OEM groups have deployed
              SemiDrive chips in mass-produced vehicles. SemiDrive held a 3.77% share of China's intelligent cockpit SoC
              market in 2025, ranking fifth overall and first among domestic suppliers.

              Revenue is recognized on chip delivery. No official pricing is published. Based on China automotive SoC
              and MCU market benchmarks, X9-generation cockpit SoC ASPs are estimated in the range of RMB 200–800 per
              unit ($28–$110 USD); E3-series MCU ASPs are estimated at RMB 20–100 ($3–$15 USD); and the 4nm X10 is
              expected to command a material premium over X9 given its process-node cost uplift. These are scenario
              estimates, not management guidance. Software tools (SDK, AUTOSAR middleware, ETAS and Elektrobit
              integrations) are bundled with chips to accelerate ecosystem adoption and create switching costs; no
              separately priced software revenue line has been identified in any source. SemiDrive's new embodied
              intelligence vertical—covering humanoid robotics via the R1 and D9-Max product lines—is at pilot stage,
              with only a single announced partnership (Galactic General Robotics) and no disclosed revenue. Fewer than
              10% of total chip shipments through mid-2024 were destined for export markets; the first EMEA
              mass-production partnership (undisclosed European carmaker, announced late 2024) represents a strategic
              step toward international revenue diversification.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
              - CI013
