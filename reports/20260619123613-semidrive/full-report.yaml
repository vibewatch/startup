      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              China's automotive SoC and MCU market operates through two distinct procurement pathways that are
              converging under the software-defined vehicle (SDV) paradigm. The traditional pathway routes chips through
              Tier-1 domain-controller integrators (e.g., Bosch, Continental, UAES, Desay SV, Foryou) who are the direct
              procurement counterparty; the OEM approves the chip supplier but does not place the purchase order. The
              emerging pathway, increasingly common for cockpit SoC and premium MCU selection, has the OEM making a
              direct design-in decision— selecting the chip jointly with its Tier-1 partner or even mandating a specific
              chip—after which the Tier-1 integrates and invoices. SemiDrive's 200+ design-in projects across 260+
              customer relationships (Sina Finance, 2026) reflect the breadth of both pathways.

              The OEM buyer base is concentrated: SemiDrive covers all of China's top-10 OEM groups and 7 of the world's
              top-10, including Chery, Changan, SAIC, GAC, BAIC, and Li Auto (SCMP), as well as Honda, Nissan, and
              Volkswagen implicitly through international OEM adoption. The adoption trigger differs by segment: for
              cockpit SoC, the trigger is a new vehicle-model program with a 3–5-year design horizon; for MCU, it is an
              E/E architecture redesign cycle, also 3–5 years. Geely's hardware engineering leadership publicly
              confirmed that SemiDrive E3650 and E3620 "precisely match" Geely's new-generation EE architecture
              direction and flagged the product family as a key strategic focus. ZBO Electronics' 2026 strategic
              cooperation agreement expands the buyer pathway into European, South American, Southeast Asian, and Indian
              OEMs, broadening beyond China's domestic installed base.

              The payer at the invoice level is generally the Tier-1 integrator, whose module BOM cost absorbs the chip
              price. The OEM ultimately funds this through its module-assembly purchase price, making OEM BOM
              sensitivity the price ceiling. SP Global notes that automotive chip validation traditionally stretches to
              five years, creating high switching costs once a chip is designed in—a dynamic that benefits incumbents
              and creates durable revenue once SemiDrive achieves nomination.
