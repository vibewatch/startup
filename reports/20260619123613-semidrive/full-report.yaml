      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: TRACK — Revenue Disclosure Is the Key Catalyst
            body: >
              SemiDrive's operational profile justifies continued monitoring. The single most important near-term
              catalyst is revenue disclosure, either through a voluntary investor communication ahead of IPO or through
              an HKEX listing application. Until then, scenario analysis brackets the enterprise value between $885M
              (bear) and $3.85B+ (bull), and the base case of ~$2B represents only a modest premium to the July 2024
              implied valuation—an acceptable but not compelling entry point for a new investor without cap- table and
              revenue clarity.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV036
              - CV037
              - CV038
          - type: callout
            title: US Export Controls — A Non-Negligible Tail Risk
            body: >
              The June 2026 US government clarification extending AI chip export restrictions to Chinese-owned entities
              operating abroad is a structural risk that has not been fully priced. If tightened further to include
              advanced-process SoC design tool exports or TSMC access restrictions for SemiDrive's 4nm X10 program, it
              could delay the next-generation cockpit SoC roadmap by 18–24 months and eliminate the bull scenario's key
              product assumption. The hstoday.us analysis of the semiconductor sanction paradox notes that such controls
              may inadvertently accelerate China's domestic alternative development, but the near-term disruption cost
              is real. This risk is rated as low-probability but high-impact, and merits explicit monitoring.
            calloutType: risk
            claimRefs:
              - CV031
              - CV036
              - CV037
          - type: callout
            title: State-Capital Architecture Reduces Governance Risk, Limits Exit Flexibility
            body: >
              SemiDrive's multi-region state-capital investor base (Suzhou, Beijing, Xi'an government funds plus OEM
              Shaanxi Auto) significantly reduces the risk of governance failure or forced fundraising collapse.
              However, it also constrains exit flexibility: a strategic sale to a Western acquirer is politically
              improbable, and secondary sale dynamics will be governed by state-capital fund mandates rather than purely
              commercial logic. The most realistic exit is a domestic IPO, making the IPO process and STAR Market/HKEX
              listing valuation the primary return calculation for any non-state investor holding a position.
            calloutType: insight
            claimRefs:
              - CV025
              - CV026
              - CV053
              - CV054
