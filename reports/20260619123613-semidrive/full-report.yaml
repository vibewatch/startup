    title: Recommendation Decision Logic
    type: flow
    layout: standard
    summary: >
      Decision chain from operational proof, market position, and valuation context to TRACK recommendation with
      conditions for upgrade to buy.
    data:
      nodes:
        - id: op-proof
          label: |-
            Operational Proof
            12M+ chips shipped, all top-10 China OEMs, 5th in cockpit SoC
        - id: market-pos
          label: |-
            Market Position
            3.77% domestic cockpit SoC share; unique dual SoC+MCU portfolio
        - id: financing
          label: |-
            Financing Signal
            B-III $1.79–1.93B implied; C-round ~$100M w/ state-capital + OEM investor
        - id: risk-gaps
          label: |-
            Risk & Gaps
            Revenue opacity, Qualcomm pressure, US chip export controls
        - id: valuation
          label: |-
