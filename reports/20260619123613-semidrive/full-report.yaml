      - number: '1.6'
        title: Global expansion, partnerships, and strategic milestones
        blocks:
          - type: paragraph
            body: >
              SemiDrive's global strategy shifted from reactive export-vehicle coverage to active international OEM
              development in 2024-2026. An undisclosed European OEM agreed to deploy the X9 cockpit SoC in sedans and
              SUVs sold in the EMEA market, marking SemiDrive's first mass-production partnership with an overseas OEM.
              Eugene Wang confirmed in 2024 that fewer than 10% of shipped chips were used in export vehicles at that
              time, so the European deal represents a structural step rather than incremental volume.

              A strategic cooperation agreement with ZBO Electronics (April 2026) targets European, Latin American,
              Southeast Asian, and Indian markets through a pre-integrated IVI hardware-software solution built on
              SemiDrive's cockpit SoC. On the software ecosystem side, Elektrobit (April 2026) completed full AUTOSAR
              adaptation for the E3620 and E3650 MCUs, and ETAS (a Bosch subsidiary; long-term partner since 2020,
              formal agreement July 2022) expanded coverage to support E3 MCU CycurHSM cybersecurity — providing the
              ISO/SAE 21434-compliant security firmware stack. These ecosystem integrations materially improve the
              likelihood of qualification success with European OEMs who demand AUTOSAR compliance and independent
              functional-safety certification stacks.

              The April 2026 Beijing Auto Show was the most concentrated public milestone event to date: SemiDrive
              announced Strategy 2.0 (automotive intelligence → general intelligence), previewed the X10 and E3800
              platforms, disclosed the R1/D9-Max embodied intelligence product line, confirmed the Galaxy General
              Robotics partnership, and announced cumulative shipments exceeding 12 million units. The May 2026 Series C
              closed weeks after the show, validating the strategic narrative with capital.

              Safety certification history is a key trust-building asset: SemiDrive obtained the world's first TÜV
              Rheinland ISO 26262:2018 version functional safety management certificate in 2019, establishing a
              process-level ASIL D capability framework that preceded its first mass-production ramp. The 2026 ASIL D
              product-level certification for the E3650 adds a product-grade proof point to the process certificate.
