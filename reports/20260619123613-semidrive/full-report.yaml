      - number: '7.3'
        title: Competitive and Technology Risk
        blocks:
          - type: paragraph
            body: >
              SemiDrive competes against well-capitalised global incumbents and a fast-rising cohort of domestic Chinese
              rivals in both its core product lines. In the cockpit SoC market, Qualcomm's Snapdragon platforms
              dominate; the SA8397 announced for 2026 models delivers 360 TOPS of NPU computing power, versus the 40
              TOPS in SemiDrive's forthcoming X10—a 9x performance gap at the flagship level. Qualcomm, NXP, Renesas,
              and STMicroelectronics all carry decades of automotive qualification history and deeply entrenched OEM
              design-in positions. SemiDrive's China cockpit SoC market share reached 3.77% in 2025, placing it fifth
              overall but first among domestic suppliers; however, the domestic localization rate only crossed 10% in
              2024, meaning 90% of China's cockpit SoC market remains with foreign incumbents. Among domestic rivals,
              SiEngine's Longying No.1 (7nm process) has shipped over one million units into Geely Galaxy E5 alone, and
              the Longying No.2 with cockpit-driving integration has entered mass production. Horizon Robotics and Black
              Sesame Technologies compete in adjacent ADAS and compute SoC segments, drawing on Hong Kong IPO capital
              (Horizon with ~$7B enterprise value). The cockpit SoC market is also undergoing a technology inflection:
              the mainstream chip process is advancing from 7nm to 4nm, and AI-oriented cockpits requiring on-device 7B
              multimodal model support will become mainstream within two to three years. SemiDrive's X10 is explicitly
              designed for this transition, but must reach mass production in 2026 as planned and sustain competitive
              NPU and memory bandwidth specifications against Qualcomm SA8397 (360 TOPS / 204 GB/s) and MediaTek's
              Dimensity S1 Ultra (3nm process). In MCU, NXP and Renesas remain the global leaders by installed base, and
              domestic rivals GigaDevice and CEC Huada are gaining ASIL-D certification to compete in Chinese OEM
              programmes.
