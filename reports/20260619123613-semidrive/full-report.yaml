      - number: '4.2'
        title: Capital Structure and Adequacy
        blocks:
          - type: paragraph
            body: >-
              SemiDrive has followed a multi-stage venture and strategic equity funding model. The May 2026 Series C of
              approximately $100M (¥690M RMB), led by Suzhou State-Owned Capital Investment (苏产投), brought cumulative
              disclosed financing above ¥4.4 billion RMB (~$610M). The C-round introduced a meaningful shift toward
              OEM-strategic and state-industrial-policy capital: new strategic shareholder Shaanxi Auto Hongde
              Investment (陕汽鸿德投资, a unit of Shaanxi Auto Holdings) anchors the supply chain relationship alongside
              financial co-investors Yizhuang State Investment, Beijing Advanced Manufacturing Fund, Xi'an Finance
              Capital, and Yi Zhong Geng Tai. Historical investors include SAIC Motor (OEM strategic), Sequoia Capital,
              Walden International, and Matrix Partners. No public debt instrument, credit facility, or project-finance
              obligation has been disclosed.

              Capital adequacy cannot be fully assessed because burn rate, cash balance, and operating expenses are
              undisclosed. Analyst commentary on the C-round noted that $100M divided across three development
              tracks—cockpit SoC (X10 4nm ramp), high-end MCU (next-gen certification), and embodied intelligence
              (R1/D9-Max series)—is "not generous" given the capital demands of each vertical. A single advanced-node
              (7nm/5nm) tape-out run costs tens of millions of USD; 4nm is higher still. Comparable Chinese automotive
              SoC companies illustrate the financial profile: Black Sesame Technologies burned approximately $190M per
              year on $122M in revenue (EBITDA margin -156%); Horizon Robotics burned ~$749M per year on $556M in
              revenue (EBITDA margin -135%). Applying these burn intensities to SemiDrive's estimated revenue range
              suggests a monthly net burn of $10–35M, implying 18–48 months of runway from the C-round increment
              alone—materially dependent on revenue trajectory and expense management. No IPO timeline or next-round
              trigger has been publicly announced.
