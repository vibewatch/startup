      - number: '6.4'
        title: Retention, repeat business, and durability
        blocks:
          - type: paragraph
            body: >
              SemiDrive does not disclose retention metrics — no NRR, GRR, churn rates, contract-renewal rates, cohort
              data, or NPS scores are publicly available. This is standard practice for a private B2B automotive chip
              company and does not in itself indicate a retention problem, but it creates a material due-diligence gap.
              The following structural indicators suggest high implicit retention:

              First, automotive chip design wins create engineering and contractual lock-in spanning a vehicle model's
              3–5 year production lifecycle. Once a chip clears AEC-Q100 qualification and is integrated into an OEM's
              Bill of Materials, the OEM rarely re-sources to an alternative supplier mid-cycle due to the
              re-qualification, software porting, and BOM redesign costs. SemiDrive's E3 and X9 deployments are in
              vehicles launched 2022–2025 that will continue in production through approximately 2027–2030.

              Second, the ETAS partnership (active since 2020, strategic agreement signed July 2022) and the Elektrobit
              AUTOSAR full adaptation completed April 2026 both embed SemiDrive chips in broader software stacks,
              increasing switching friction for OEM software teams who have built development infrastructure around
              these tools.

              Third, Geely's public April 2026 statement committing to deepen cooperation in zone control and ADAS is
              the strongest direct retention and land-and-expand signal in the evidence corpus. Shaanxi Automobile (陕汽),
              which joined the Series C as a strategic investor in May 2026, has publicly stated its intent to deploy
              SemiDrive chips in its vehicle platforms — creating an investor-customer relationship that further ties
              retention to capital alignment.

              Absent from the searched corpus are any documented customer churn events, failed production deployments,
              supply disputes, or public complaints. However, this absence should not be interpreted as confirmation of
              perfect retention: SemiDrive does not surface supply-chain incidents publicly, and the OEM customers do
              not disclose chip-vendor changes.
