  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Export Control Risk
        blocks:
          - type: paragraph
            body: >
              US export controls on advanced semiconductor technology represent the single highest-severity external
              risk to SemiDrive's product roadmap. In June 2026 the US government clarified that export restrictions on
              advanced AI chips apply not only to companies operating inside China but also to Chinese-owned firms and
              subsidiaries located overseas, closing a loophole that had allowed some Chinese technology firms to access
              restricted hardware through offshore entities. NVIDIA's Blackwell AI chips remain on the restricted list;
              other advanced processors continue to face licensing scrutiny. The practical consequence for SemiDrive is
              a progressively tightening perimeter around US-origin electronic design automation (EDA) tools, advanced
              process-node technology, and ARM architecture licenses that are essential to the company's next-generation
              product roadmap. Mordor Intelligence notes that export- control frictions on sub-28nm design tools
              directly temper the speed at which China's domestic automotive chip supply chain can mature. SemiDrive's
              X10 cockpit SoC targets a 4nm process node, which is currently only available from TSMC outside China. Any
              expansion of US controls to cover TSMC-supplied fabrication services for Chinese chip designers would halt
              the X10 programme. China's MIIT "Big Fund" Phase III CNY 344 billion ($47 billion) initiative signals that
              Beijing treats semiconductor self-sufficiency as a national security priority, providing regulatory
              tailwinds domestically, but also underscoring how politically charged the supply chain is. The
              localization policy creates a preferential procurement advantage (a reported 10% price edge in government
              fleets) but exposes SemiDrive to rapid reversal risk if policy goals shift or trade negotiations
              intervene. Separately, SemiDrive's announced overseas expansion—including the first mass-production supply
              agreement with an undisclosed European carmaker—operates in a geopolitical grey zone where European OEMs
              may face political and customer pressure against adopting Chinese chips in EMEA-sold vehicles.
