  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >
              SemiDrive's primary served market spans two complementary automotive semiconductor segments: (1)
              intelligent cockpit SoCs (branded X9/X10 series), covering instrument clusters, infotainment,
              multi-display domain controllers, and AI-assisted human-machine interaction; and (2) high-performance
              automotive MCUs (E3 series), addressing zone control units (ZCUs), domain control units (DCUs),
              powertrain, chassis, and ADAS safety applications. A third product line— the G9 series central-gateway and
              domain-fusion processor—serves the central gateway and domain-fusion market, bridging cockpit and
              vehicle-control architectures. These three segments collectively represent the "intelligent automotive
              compute" layer sitting above commodity body electronics (window lifts, simple actuators) and below
              advanced ADAS application processors (NVIDIA Orin, Horizon Journey series) and autonomous-driving
              inference SoCs.

              Excluded from SemiDrive's TAM are: power electronics semiconductors (inverter IGBTs, SiC MOSFETs), battery
              cell sensors and BMS analog front-ends, radar and LiDAR signal-processing ASICs, and consumer/telematics
              connectivity chips (5G/WiFi modems), even though those sit elsewhere in the same vehicle. Status-quo
              substitutes for cockpit SoC are dominated by Qualcomm Snapdragon 8155P, 8295, and SA8775P (EMEA and
              China); NXP i.MX 8 series; and Renesas R-Car series. Status-quo substitutes for high-performance MCU are
              NXP S32K/S32G families, Infineon AURIX TC4xx, Renesas RH850, and STMicro SPC5 series—all globally
              certified incumbents with long-established automotive tool chains. The embodied intelligence (humanoid
              robotics) segment represents a newly claimed adjacency where SemiDrive is extending its automotive IP.
            claimRefs:
