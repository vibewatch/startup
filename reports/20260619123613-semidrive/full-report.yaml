companyProfile:
  summary: >-
    SemiDrive (芯驰科技, Xinchi Keji) is a Nanjing-based fabless automotive semiconductor company founded in 2018 by former
    NXP Semiconductors executives to close China's domestic gap in automotive-grade chip supply. The company designs and
    sells automotive SoCs (X9/X10 cockpit series), high-performance MCUs (E3 series), central-gateway SoCs (G9), and
    ADAS SoCs (V9), making it one of the few domestic Chinese firms simultaneously supplying both SoC and MCU categories
    at scale. By May 2026 SemiDrive had shipped over 12 million chips, achieved 100% coverage of China's top-10 OEM
    groups, ranked #1 among domestic cockpit SoC suppliers at 3.77% China market share, and closed a ~$100M Series C
    bringing cumulative financing above ¥4.4 billion RMB. At the April 2026 Beijing Auto Show the company announced
    "Strategy 2.0", extending its mission into embodied intelligence (robotics) via the R1 compute brain and D9-Max
    motion controller.
  foundedDate: '2018-01-01'
  founders:
    - name: Chou Yujing (仇雨菁)
      role: Co-founder, Chairwoman & CEO
      background: Former NXP China automotive chip R&D lead; led cockpit chip development at NXP Greater China.
      claimRefs:
        - CO005
        - CO007
    - name: Zhang Qiang (张强)
      role: Co-founder
      background: Former head of NXP Greater China automotive division; deep OEM sales and commercial relationships.
      claimRefs:
        - CO006
        - CO007
  foundingLocation: Beijing, China
  headquarters: Nanjing, China
  productSummary: >-
    Automotive-grade fabless chips: X9/X10 AI cockpit SoCs for infotainment and domain controllers; E3 series
    high-performance MCUs for zone/domain control, chassis, and powertrain; G9 central-gateway SoC for new-generation
    E/E architectures; R1/D9-Max embodied-intelligence modules for robotics.
  customerFocus: >-
    Chinese and global automotive OEMs and their Tier-1 suppliers; target use cases span smart cockpit, vehicle control
    (zone/domain ECUs), central gateway, and ADAS. Covers 100% of China's top-10 OEM groups and 7 of the world's top-10
    global OEM groups.
  businessModel: >-
    Per-unit fabless chip sales to automotive OEMs and Tier-1 suppliers under a design-win engagement model; design-wins
    lock multi-year production supply agreements. Software tools (SDK, AUTOSAR middleware, safety libraries) are bundled
    with chips to accelerate ecosystem adoption and reduce customer switching. No separately priced software revenue
    line has been identified.
  stage: Series C
  fundingStatus: >-
    Completed nine funding rounds; Series C of ~$100M (~¥690M) closed May 13 2026, led by Jiangsu state capital (苏产投)
    with Shaanxi Auto Hongde as strategic OEM shareholder and co-investors including 亦庄国投, Beijing Advanced
    Manufacturing Fund, and Xi'an Finance. Historical investors include SAIC Motor, Sequoia Capital China, Walden
    International, and Matrix Partners. Cumulative disclosed financing exceeds ¥4.4 billion RMB (~$600M); CBInsights
    records $504.55M. No post-Series-C valuation disclosed; July 2024 B-III CBInsights implied valuation was
    $1.79B–$1.93B.
