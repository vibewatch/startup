      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >
              SemiDrive was co-founded by Chou Yujing (仇雨菁), who serves as Chairwoman and CEO, and Zhang Qiang (张强).
              Both founders previously held senior positions at NXP Semiconductors, which is the dominant incumbent in
              automotive microcontrollers globally: Chou Yujing was NXP China's automotive chip R&D lead and Zhang Qiang
              was head of NXP Greater China's automotive division. This founding team configuration — technically deep
              chip designers who had already shipped automotive-grade products at scale — is a strong signal of
              founder-market fit and provides the company with credibility when negotiating with OEM procurement teams
              that require rigorous vehicle qualification processes.

              The broader senior leadership team includes Sun Mingle (孙鸣乐) as CTO, who led the architecture
              specification for the flagship X10 AI cockpit SoC and presented publicly at the 2026 Beijing Auto Show;
              Zhang Xitong (张曦桐) as MCU Product Line General Manager, responsible for the E3 series roadmap and
              strategy; and Eugene Wang as International Business General Manager, who has been the primary public
              spokesperson for the company's global expansion plans, notably the European OEM supply deal.

              Key-person risk is concentrated. Chou Yujing is the sole named founder and public face at investor
              conferences and press events. No governance documents, board composition, or succession plans are publicly
              available for a private company of this scale, which is a standard but material gap for any LP or
              strategic investor doing diligence. Independent board members, if any, have not been publicly identified.
              The investor-heavy board typical of a late-Series-B/C company likely includes representatives from SAIC,
              Sequoia China, and/or newer institutional investors, but this is unconfirmed.
