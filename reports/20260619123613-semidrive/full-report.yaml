      - number: '1.3'
        title: Product portfolio and technical differentiation
        blocks:
          - type: paragraph
            body: >
              SemiDrive produces four commercially active chip families. The X9 series is a smart cockpit SoC targeting
              infotainment, instrument cluster, and domain-controller applications; it is the company's highest-volume
              product and its #1 domestic brand position. The E3 series is a family of high-performance automotive MCUs
              covering zone controllers, domain controllers, advanced chassis/powertrain control, and ADAS domains. The
              G9 series is a central gateway/network processor purpose-built for new-generation E/E architectures that
              centralize vehicle communication. The V9 series was listed as a smart-driving chip, though its product
              page was unavailable at time of research.

              The next-generation flagship products under development include the X10 AI cockpit SoC and the E3800 AMU
              (Architecture Master Unit). The X10 uses TSMC's 4nm automotive-grade process and delivers 80 TOPS dense AI
              compute with 154 GB/s DDR bandwidth, enabling on-device deployment of AI models up to 9B parameters — a
              meaningful step toward eliminating the external AI accelerator box and reducing system BOM cost by an
              estimated ¥1,500–3,000. The E3800 is the E3 series expansion toward a "central intelligent control brain"
              role, integrating more than 10 cores with aviation-grade embedded flash and multi-layer Ethernet
              acceleration. Both products were previewed at the April 2026 Beijing Auto Show.

              For embodied intelligence, SemiDrive has announced the R1 series compute brain and the D9-Max control
              brain (supporting EtherCAT real-time protocol), framing them as reuses of existing automotive-grade IP
              applied to the robotics control architecture. The E3650 flagship MCU received TÜV Rheinland ISO 26262 ASIL
              D functional safety product certification in 2026, adding a product-level safety certificate on top of the
              company's process-level ASIL D certification obtained in 2019.
