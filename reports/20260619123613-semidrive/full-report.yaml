chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding, and operating model
        blocks:
          - type: paragraph
            body: >
              SemiDrive — known in Chinese as 芯驰科技 (Xinchi Keji) and registered as 北京芯驰半导体科技股份有限公司 — was incorporated in
              2018, roughly coinciding with the start of China's accelerating shift toward smart electric vehicles. The
              company's headquarters is in Nanjing, Jiangsu, with R&D centers in Beijing, Shanghai, Nanjing, and
              Shenzhen. The legal registration in Beijing and ICP filing (京ICP备2024056528号-1) reflect its status as a
              domestic semiconductor design house rather than a fabless international entity. The operating model is
              fabless chip design: SemiDrive defines, architects, and tapes out automotive-grade semiconductor products
              which are then manufactured by contract foundries (including TSMC for its advanced-node X10 product).

              The strategic positioning is to offer automotive-grade SoCs and high-performance MCUs for next-generation
              vehicle electronic/electrical (E/E) architectures, covering smart cockpits, intelligent gateways, and core
              vehicle control. As of the 2026 Beijing Auto Show, the company formally extended its mission to include
              embodied intelligence (humanoid and service robots), framing this as a natural transfer of
              automotive-grade chip competencies — high reliability, real-time control, functional safety — into the
              robotics value chain. This dual automotive-robotics ambition is reflected in the May 2026 Series C capital
              raise and the company's stated use of proceeds across three tracks: AI cockpit SoCs, high-end vehicle
              control MCUs, and embodied intelligence solutions.

              SemiDrive describes itself as one of the few companies globally that can simultaneously supply both
              automotive-grade SoCs and high-performance MCUs, covering the two most strategically sensitive chip
              categories in the automotive E/E evolution. This dual-capability positioning is important for
              understanding both the competitive moat and the organizational complexity the company carries.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO007
