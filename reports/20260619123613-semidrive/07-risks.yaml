chapter:
  number: 7
  title: Risks
  summary: >
    SemiDrive's principal risks concentrate in three interlocking areas: (1) US export-control
    escalation, which as of June 2026 explicitly reaches Chinese-owned overseas subsidiaries and
    could restrict EDA tools, foundry access, or IP licensing needed for the 4nm X10 roadmap;
    (2) structural capital-intensity pressure as a ~$100M C-round must simultaneously fund
    cockpit SoC, MCU, and an embryonic embodied-intelligence vertical against rivals who draw
    on far larger balance sheets; and (3) customer-concentration and disclosure opacity, with
    more than 90% of revenue sourced from China's domestic OEM base and no public financial
    disclosures to allow independent burn-rate assessment. Functional-safety certifications
    (ISO 26262 ASIL D, AEC-Q100 Grade 1, ISO/SAE 21434) are in place for flagship products,
    providing genuine mitigation on the safety-certification front. Kill criteria center on
    TSMC access loss, C-round runway exhaustion before the next round, or cancellation of the
    first overseas OEM program.

sections:
  - id: regulatory-export-control
    title: Regulatory and Export Control Risk
    body: >
      US export controls on advanced semiconductor technology represent the single highest-severity
      external risk to SemiDrive's product roadmap. In June 2026 the US government clarified that
      export restrictions on advanced AI chips apply not only to companies operating inside China
      but also to Chinese-owned firms and subsidiaries located overseas, closing a loophole that
      had allowed some Chinese technology firms to access restricted hardware through offshore
      entities. NVIDIA's Blackwell AI chips remain on the restricted list; other advanced
      processors continue to face licensing scrutiny. The practical consequence for SemiDrive is
      a progressively tightening perimeter around US-origin electronic design automation (EDA)
      tools, advanced process-node technology, and ARM architecture licenses that are essential
      to the company's next-generation product roadmap. Mordor Intelligence notes that export-
      control frictions on sub-28nm design tools directly temper the speed at which China's
      domestic automotive chip supply chain can mature. SemiDrive's X10 cockpit SoC targets a
      4nm process node, which is currently only available from TSMC outside China. Any expansion
      of US controls to cover TSMC-supplied fabrication services for Chinese chip designers would
      halt the X10 programme. China's MIIT "Big Fund" Phase III CNY 344 billion ($47 billion)
      initiative signals that Beijing treats semiconductor self-sufficiency as a national
      security priority, providing regulatory tailwinds domestically, but also underscoring how
      politically charged the supply chain is. The localization policy creates a preferential
      procurement advantage (a reported 10% price edge in government fleets) but exposes SemiDrive
      to rapid reversal risk if policy goals shift or trade negotiations intervene. Separately,
      SemiDrive's announced overseas expansion—including the first mass-production supply
      agreement with an undisclosed European carmaker—operates in a geopolitical grey zone where
      European OEMs may face political and customer pressure against adopting Chinese chips in
      EMEA-sold vehicles.
