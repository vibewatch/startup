  - id: risk-interconnections
    title: Risk Interconnections and Thesis Breaks
    body: >
      The principal risks are not independent: their transmission paths converge on the same
      two outcomes—revenue shortfall and valuation compression. US export control escalation
      is the root trigger with the widest downstream reach. If advanced process-node access
      (TSMC 4nm/5nm) is restricted, the X10 roadmap stalls, cockpit SoC customers migrate to
      Qualcomm or MediaTek, domestic OEM trust erodes, and the next fundraising round prices
      at a discount—all within a two-to-three year window. Capital exhaustion is a second
      independent trigger with similar downstream effects: if the ~$100M C-round runway is
      insufficient to complete X10 tapeout and achieve AEC-Q100 qualification before the next
      raise, a distressed bridge would dilute early investors and signal programme difficulty
      to OEM design-in teams. A safety recall or material field failure is a low-probability
      but high-severity scenario; given that SemiDrive chips are present in zone controllers
      and chassis applications in hundreds of vehicle models, a software or hardware defect
      in a safety-critical path could trigger OEM liability claims and immediate design-out.
      The four thesis-break triggers are: (1) TSMC restricts supply to SemiDrive for any
      reason; (2) the C-round runway depletes before Series D closes; (3) the first overseas
      OEM cancels or materially delays; and (4) ISO 26262 ASIL D certification fails or is
      withdrawn for a product already in production vehicles. These triggers are intended as
      monitorable, concrete events, not directional trends. If all four remain green at the
      next diligence update in twelve months, the investment thesis is on track despite the
      structural risks.
