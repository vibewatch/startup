  - id: safety-quality-certification
    title: Safety, Quality, and Certification Risk
    body: >
      SemiDrive has built a credible functional-safety and cybersecurity credential stack for
      its flagship products. The E3650 MCU achieved ISO 26262 ASIL D product certification from
      TÜV Rheinland, the highest functional-safety level for automotive components, and the
      company has held TÜV Rheinland's ISO 26262:2018 functional safety management certificate
      since 2019—making it one of the earliest Chinese chip companies with process-level
      accreditation. The E3650 also passed AEC-Q100 Grade 1 automotive reliability certification
      and meets ISO/SAE 21434 cybersecurity requirements through its integrated Xuanwu HSM module
      with Chinese national cryptographic algorithm support. SemiDrive supplies accompanying
      MCAL drivers and a FuSaLib functional safety library at ASIL D level, reducing Tier-1
      integration effort. Despite these credentials, meaningful certification risks remain.
      The current ASIL D product certification covers the E3650 MCU; whether the next-generation
      X9 SoC revisions, the upcoming X10, the G9 gateway chip, and the new robotics R1 series
      all hold equivalent or pending certifications is not fully publicly documented. Each new
      chip family entering safety-critical applications requires its own multi-year certification
      campaign, which is both capital- and time-intensive. Any latent silicon defect discovered
      in a production vehicle—particularly in safety-critical functions such as zone control,
      chassis control, or advanced driver assistance—could trigger an OEM recall. For a company
      whose founders come from NXP's automotive chip division and whose business model depends
      on OEM relationships, a product-safety recall would be reputationally catastrophic and
      commercially devastating. The cybersecurity compliance requirement (UNECE R155 and R156
      for vehicles sold in Europe) adds another certification burden for the planned overseas
      supply programme. Compliance with EU General Data Protection Regulation (GDPR) for
      in-vehicle data processed in European-market vehicles is also an unverified obligation.
