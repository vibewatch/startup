callouts:
  - calloutType: risk
    title: TSMC Access Is the Single Highest-Severity Operational Risk
    body: >
      SemiDrive's X10 cockpit SoC roadmap is built around a 4nm TSMC process. There is no domestic
      Chinese foundry equivalent at this node. If US export controls extend to cover advanced-node
      wafer fabrication for Chinese fabless designers—as has occurred with AI training chips—the X10
      programme would halt and the competitive window against Qualcomm and MediaTek would close
      permanently for the current product generation. This is a binary outcome risk, not a gradual
      headwind, and it should be treated as a thesis-break trigger.
    claimRefs:
      - CR004
      - CR039
      - CR001

  - calloutType: risk
    title: Capital Allocation Across Three Competing Verticals Raises Exhaustion Risk
    body: >
      Analyst commentary on the May 2026 C-round explicitly noted that ~$100M divided across
      automotive cockpit SoC (X10 tapeout and certification), high-end MCU (E3 series expansion),
      and embodied intelligence (R1/D9-Max robotics) is "not generous" relative to the capital
      requirements of each direction. Comparable Chinese automotive chip companies (Horizon
      Robotics, Black Sesame Technologies) remain in deep losses even at later commercial stages.
      Without public financial disclosures, investors cannot verify actual burn rate or when the
      next round will be required.
    claimRefs:
      - CR024
      - CR026
      - CR027
      - CR028
      - CR029
      - CR032

  - calloutType: insight
    title: China OEM Localization Policy Is Both Tailwind and Concentration Risk
    body: >
      China's MIIT localization push provides SemiDrive with a structural competitive advantage—
      10% price preference in government fleet procurement, Big Fund III support, and OEM alignment
      with domestic supply chain mandates. But a market where 90%+ of revenue is sourced from
      a single policy environment is inherently fragile. Any bilateral trade normalization,
      policy reversal, or geopolitical event that removes the localization preference would
      simultaneously remove the competitive moat and compress addressable revenue.
    claimRefs:
      - CR046
      - CR048
      - CR030
      - CR033

