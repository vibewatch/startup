  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - TSMC export restriction / supply disruption
        - Track BIS rulemaking and TSMC quarterly business reports for any China policy change
        - TSMC communicates restriction on advanced-node services to Chinese fabless designers
        - Immediate thesis break — X10 programme halted; divest or reassess entry at 7nm-only path
      - - C-round capital runway exhaustion before Series D close
        - Monitor SemiDrive funding announcements and estimated burn rate against comparable peers
        - No new funding announced within 18 months of C-round close (by end of H1 2027)
        - Material risk flag — bridge risk; investigate burn rate and OEM design-in revenue timing before next commit
      - - First overseas OEM deal cancellation or material delay
        - Track production readiness announcements for the unnamed European carmaker programme
        - European OEM publicly cancels or no volume production by Q4 2026 (per original SCMP timeline)
        - Significant concern — global expansion thesis weakened; re-evaluate at revised timeline
      - - ISO 26262 ASIL D certification withdrawal or failure for production chip
        - Monitor automotive safety body announcements, OEM quality bulletins, NHTSA/CMIIT recall databases
        - TÜV Rheinland withdraws ASIL D certificate or OEM initiates safety recall citing SemiDrive chip
        - Thesis break — OEM design-out likely; potential liability claims; exit or write-down decision
      - - Qualcomm SA8397 / competing platform wins critical domestic OEM design-in at SemiDrive's expense
        - Track OEM model announcements and supplier attribution in Chinese auto industry press
        - Two or more top-5 domestic OEM groups switch cockpit SoC from SemiDrive to Qualcomm / SiEngine for 2027+ programmes
        - Warning sign — competitive position under pressure; reassess X10 differentiation timeline
      - - Embodied intelligence programme materially delays automotive product refresh
        - Monitor X10 and E3 new product announcement cadence; compare to stated 2026 X10 mass-production target
        - X10 mass-production delayed beyond Q4 2026 or E3 series new SKU misses announced roadmap by 6+ months
        - Execution risk flag — dual-track strategy creating automotive product gap; assess resource reallocation
    notes: >
      Kill criteria and action thresholds are illustrative investment-monitoring guidelines based on
      publicly observable signals; they are not contractual or legal commitments. Thresholds are
      set conservatively to give advance warning, not to trigger immediate exit on first data point.
    claimRefs:
      - CR001
      - CR004
      - CR016
      - CR024
      - CR026
      - CR034
      - CR042

