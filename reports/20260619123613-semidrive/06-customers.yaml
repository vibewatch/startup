  - id: section-trajectory
    title: Adoption trajectory and market position
    body: >
      SemiDrive's adoption trajectory is characterized by rapid, compounding shipment growth across both
      major product lines. Cumulative chip deliveries surpassed 12 million units by May 2026, accelerating
      from approximately 8 million through 2024 and exceeding the 10 million milestone by end-2025. The
      X9 cockpit SoC accounted for 5 million of those units as of April 2026, growing at a stated YoY
      rate exceeding 50%, and has held the #1 position among domestic brands in the Chinese smart cockpit
      SoC market for two consecutive years. The E3 MCU series reached 5 million+ cumulative units across
      50+ production vehicle models as of the same date.

      Market share data from GAOGONG Intelligence Research (高工智能汽车研究院), cited in the May 2026
      China Business Daily report, places SemiDrive at 3.77% of China's smart cockpit SoC market by
      volume in 2025 — fifth overall (competing against Qualcomm, Samsung, MediaTek, and Horizon
      Robotics), and first among domestic Chinese suppliers. The E3 MCU series similarly ranked within
      China's top-5 high-performance vehicle-grade MCU suppliers in 2025 by shipment volume, first
      domestically. For context, China's smart cockpit penetration in passenger cars reached 76.62%
      in 2025, meaning SemiDrive's 3.77% share is drawn from a large addressable pool.

      The E3650 flagship MCU entered mass production in October 2024 and has secured design-in positions
      on 90% of OEMs' new-generation domain control platforms as of April 2026. SemiDrive's product
      co-development model — where OEM engineering teams jointly define chip specifications with
      SemiDrive rather than receiving off-the-shelf products — accelerates design-win conversion
      but increases the engineering overhead per customer. The ETAS AUTOSAR partnership (since 2020,
      formally contracted July 2022) and the Elektrobit AUTOSAR adaptation completed April 2026 are
      key software ecosystem enablers that reduce the integration burden on OEM software teams and
      accelerate ramp-up timelines.
