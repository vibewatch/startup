    - type: missing-source
      severity: material
      topic: NRR and GRR
      missingEvidence: >-
        No net revenue retention (NRR), gross revenue retention (GRR), or customer churn rate has been
        disclosed by SemiDrive or mentioned in any third-party source for any customer segment.
      whyItMatters: >-
        Without retention metrics, it is impossible to determine whether the stated 260+ customer count
        represents stable recurring relationships or a cumulative historical total that includes churned
        accounts. High structural lock-in is inferred but not validated by data.
      diligencePath: >-
        Request cohort-level retention analysis from CFO, broken down by OEM size tier and product line,
        covering the period 2021–2026. Also request any expired or terminated supply agreements.
      relatedQuestionRefs:
