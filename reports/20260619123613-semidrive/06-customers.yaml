  - id: section-concentration
    title: Concentration risk and global expansion
    body: >
      SemiDrive faces material geographic customer concentration. By end-2024, fewer than 10% of cumulative
      chip shipments were destined for export-bound vehicles, which means over 90% of revenue-generating
      volume is tied to China-based OEM production. Any sustained contraction in China's new-energy vehicle
      market, geopolitical trade shock, or domestic OEM margin compression that pushes price pressure onto
      chip suppliers would disproportionately impact SemiDrive's shipment volumes.

      Within China, OEM concentration risk is difficult to assess because SemiDrive has not disclosed
      its revenue breakdown by customer. The 260+ stated customer count implies broad diversification by
      number of accounts, but the shipment concentration likely skews heavily toward the leading NEV
      platforms (Geely ecosystem, Li Auto, Chery's premium lines) that are the most aggressive adopters
      of domain-controller architectures requiring E3 MCU and AI cockpit SoCs. The investor base
      (SAIC Motor, Sequoia China, Matrix Partners, plus Shaanxi Auto in May 2026) includes OEM
      strategic investors whose procurement preferences could amplify concentration if they favor
      SemiDrive over alternatives — or create risk if they later shift strategy.

      Global expansion is active but early-stage. The first-announced European OEM deal (X9 SoC for
      EMEA sedan/SUV models, announced late 2024) has not been independently confirmed as having
      reached mass production or a formal contract announcement. ZBO Electronics, signed as a
      channel partner in April 2026, provides distribution infrastructure for Europe, South America,
      Southeast Asia, and India, but the customer pipeline attached to this channel is not yet
      disclosed. US geopolitical pressure on European OEMs around Chinese chip supply chains —
      reflected in increasingly broad US export restrictions on AI and semiconductor supply to Chinese
      firms — may deter European OEMs from public disclosure even if supply relationships exist,
      adding opacity to the international expansion trajectory.

      Analyst commentary in China Business Daily noted that the ~$100M Series C is being split across
      three strategic bets (AI cockpit SoC, MCU, embodied intelligence), which may be thin relative
      to the engineering investment each domain requires, potentially creating execution risk in the
      international expansion tracks.
