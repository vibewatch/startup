callouts:
  - calloutType: strength
    title: Broadest domestic OEM coverage of any local automotive chip supplier
    body: >-
      SemiDrive's 100% coverage of China's top-10 OEM groups and deployment in 50+ production models
      positions it as the highest-penetration domestic automotive chip supplier across both cockpit SoC
      and high-performance MCU. No domestic competitor has publicly claimed equivalent OEM breadth across
      both product categories simultaneously.
    claimRefs:
      - CU002
      - CU003
      - CU007
      - CU035

  - calloutType: risk
    title: Named international customers and revenue remain opaque
    body: >-
      Despite claiming 7 of global top-10 OEM deployments and one European OEM deal, SemiDrive has not
      named a single non-Chinese production customer. The opacity makes it impossible to verify the strategic
      value or revenue contribution of international expansion, and reduces the credibility of the global
      expansion narrative for due-diligence purposes.
    claimRefs:
      - CU003
      - CU015
      - CU038
      - CU039

  - calloutType: risk
    title: Analyst concern over Series C funding adequacy for three parallel bets
    body: >-
      China Business Daily analysts noted that allocating ~$100M across AI cockpit SoC, MCU, and embodied
      intelligence simultaneously may be insufficient for the engineering depth each direction requires.
      If capital constraints force prioritization, international expansion (the highest-cost customer
      acquisition track) may be de-prioritized.
    claimRefs:
      - CU031
      - CU044

