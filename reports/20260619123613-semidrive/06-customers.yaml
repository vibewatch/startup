      relatedTableRefs:
        - TU004

    - type: private-evidence-only
      severity: material
      topic: revenue concentration
      missingEvidence: >-
        SemiDrive has not disclosed what share of revenue or shipment volume is attributable to its
        top-1, top-3, or top-5 customers. The 260+ customer count does not reveal revenue distribution.
      whyItMatters: >-
        If a small number of OEM groups (e.g., Geely ecosystem, Li Auto, or SAIC) account for a
        disproportionate share of revenue, the customer risk profile is materially worse than the
        headline account count implies.
      diligencePath: >-
