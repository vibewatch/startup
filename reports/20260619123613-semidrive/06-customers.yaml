    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Four-stage journey from initial OEM engineering engagement through mass-production design-win to
      multi-product expansion, illustrating how SemiDrive converts automotive OEM relationships into
      durable multi-year accounts.
    data:
      nodes:
        - id: stage-1
          label: Engineering Engagement
          description: OEM chip team evaluates SemiDrive SoC or MCU for next-generation E/E architecture
        - id: stage-2
          label: Design-Win and Qualification
          description: Joint product definition; AEC-Q100 qualification; AUTOSAR integration; pilot prototype
        - id: stage-3
          label: Mass Production Ramp
          description: OEM issues volume purchase orders; chip enters BOM for vehicle model SOP; ramp to full rate
        - id: stage-4
          label: Multi-Product Expansion
          description: OEM extends SemiDrive chip coverage from one domain to additional domains (cockpit + MCU; MCU + gateway)
    approximationNotes: >-
      Journey stages and activities are constructed from company press releases, investor commentary (China
      Business Daily), and the Geely executive public statement at the 2026 Beijing AE. No customer-journey
      data has been independently audited; timelines are indicative from automotive chip industry norms.
