chapter:
  number: 6
  title: Customers
  summary: >-
    SemiDrive has achieved full coverage of China's top-10 OEM groups and 7 of the global top-10, shipping
    12 million+ automotive-grade chips across 50+ vehicle models by May 2026. The X9 cockpit SoC ranks first
    among domestic brands in China (3.77% market share) with 5M+ units delivered, while the E3 MCU is deployed
    in named production programs at Geely, Li Auto, Chery, Lotus, Leapmotor, Smart, and Zeekr. Global expansion
    is nascent — fewer than 10% of chips have gone to export-bound vehicles — and named non-Chinese OEM
    identities remain undisclosed, creating material opacity around international concentration risk.

sections:
  - id: section-segmentation
    title: Customer base segmentation
    body: >
      SemiDrive's customer base is composed almost entirely of Chinese automotive OEM groups and their
      first-tier (Tier-1) supply-chain partners, structured around three primary purchase channels: direct
      OEM chip supply, Tier-1 module integrators, and international channel distributors. The buyer in all
      cases is the OEM engineering or procurement organization; end-users of the chip are vehicle occupants
      accessing cockpit, powertrain control, or ADAS functions.

      As of May 2026, SemiDrive serves 260+ customers with 200+ design-win projects. Coverage of China's
      top-10 OEM groups is stated to be 100%, and 7 of the world's top-10 global OEM groups have deployed
      SemiDrive chips in mass-produced vehicles. These figures represent broad market penetration for a
      company founded in 2018. Customer segmentation by product line maps to four verticals: (1) Smart
      Cockpit — OEM infotainment and instrument-cluster integrators purchasing the X9 SoC; (2) Vehicle
      Control — OEM and Tier-1 ECU/domain-controller developers purchasing the E3 MCU; (3) Gateway and
      ADAS — OEMs purchasing G9 gateway SoC and V9 ADAS SoC; and (4) Embodied Intelligence — robotics
      OEMs (pre-revenue partnership stage) purchasing forthcoming R1 and D9-Max products.

      Geographic segmentation heavily favors China: fewer than 10% of cumulative chip shipments through
      2024 were destined for export-bound vehicles. Named international expansion is limited to one
      undisclosed European OEM (X9 SoC, EMEA sedans/SUVs, planned H2 2025), a channel partnership with
      ZBO Electronics covering Europe, South America, SE Asia, and India (signed April 2026), and a
      software-ecosystem enabler partnership with Elektrobit (AUTOSAR adaptation completed April 2026)
      that satisfies European software-defined vehicle procurement requirements. The smart-cockpit
      penetration rate in Chinese passenger cars reached 76.62% in 2025, providing a large volume base
      from which SemiDrive's domestic customer growth is drawn.
