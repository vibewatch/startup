  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >-
      Eight-step flow from OEM platform definition through chip selection, software integration, certification,
      validation, mass production, vehicle launch, and ongoing OTA lifecycle management.
    data:
      nodes:
        - id: n1
          label: OEM Platform Definition
          detail: OEM architecture team defines E/E topology, safety levels, and compute requirements for new model programme.
        - id: n2
          label: SemiDrive SoC/MCU Selection
          detail: OEM or Tier-1 system integrator evaluates and selects SemiDrive chip (E3650, G9, X9/X10) for target ECU/domain.
        - id: n3
          label: SDK and AUTOSAR BSW Integration
          detail: Tier-1 integrates SemiDrive MCAL, ETAS or Elektrobit AUTOSAR BSW, and target OS (QNX/RTOS/Android) into ECU software stack.
        - id: n4
          label: Functional Safety & Cybersecurity Certification
          detail: System-level ASIL D and ISO 21434 certification activities; SemiDrive supplies FuSaLib and ETAS CycurHSM HSM firmware.
        - id: n5
          label: System Validation (HiL / SiL / Vehicle)
          detail: Hardware-in-loop and system-level validation of safety, performance, and communication across full vehicle network.
        - id: n6
          label: Mass Production Readiness
          detail: SemiDrive ramps wafer starts with TSMC; AEC-Q100 screening; Tier-1 assembles ECU modules at scale.
        - id: n7
          label: Vehicle Launch and OEM Delivery
          detail: Vehicle with SemiDrive-embedded ECUs enters series production; OEM delivers to end customers.
        - id: n8
          label: OTA Updates and Lifecycle Support
          detail: SemiDrive provides long-term firmware, security patch, and AUTOSAR update support for the vehicle service life.
      edges:
        - from: n1
          to: n2
          label: chip requirements
        - from: n2
          to: n3
          label: SDK delivery
        - from: n3
          to: n4
          label: certified stack
        - from: n4
          to: n5
          label: safety artefacts
        - from: n5
          to: n6
          label: validated system
        - from: n6
          to: n7
          label: production ramp
        - from: n7
          to: n8
          label: deployment
    claimRefs:
