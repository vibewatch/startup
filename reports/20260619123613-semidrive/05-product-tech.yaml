callouts:
  - calloutType: strength
    title: Dual Domestic Champion — Cockpit and Control
    body: >-
      SemiDrive is the only Chinese company simultaneously holding the top domestic market-share position
      in both cockpit SoCs (3.77% China share, #1 domestic) and high-performance automotive MCUs (#1 Chinese
      vendor, top-5 globally per Gaogong). This dual-champion status reduces the vulnerability of any
      single product line and strengthens bargaining leverage in OEM platform negotiations.
    claimRefs:
      - CE004
      - CE005
      - CE039

  - calloutType: risk
    title: TSMC Foundry Concentration Risk
    body: >-
      The X10 AI cockpit SoC relies exclusively on TSMC's 4nm automotive-grade process, and the E3650 uses
      TSMC (or equivalent) at 22nm. No domestic Chinese foundry offers equivalent automotive-qualified advanced
      nodes. Any geopolitical disruption, export-control escalation targeting foundry access, or TSMC capacity
      reallocation could delay or halt SemiDrive's next-generation product ramp.
    claimRefs:
      - CE021
      - CE045

  - calloutType: insight
    title: Developer Ecosystem Maturity Signal
    body: >-
      The completion of full AUTOSAR BSW adaptation by both Elektrobit and ETAS—two of the world's three
      largest AUTOSAR stack providers—signals that SemiDrive's E3 MCUs have achieved the software-ecosystem
      maturity threshold that OEM tier-1 suppliers require for a production design-in decision. This reduces
      OEM integration risk and accelerates the path from silicon sample to mass production.
    claimRefs:
      - CE035
      - CE036

  - calloutType: risk
    title: Dual-Track Capital Dilution Risk
    body: >-
      The ~$100M Series C rounds were raised across three concurrent product lines: automotive SoC, MCU,
      and embodied intelligence. Compared with competitors who raised discrete larger rounds per product
      track, SemiDrive's capital per active front is materially thinner, raising the risk of under-investment
      in any single line during the critical R&D and qualification window for X10 and E3800.
    claimRefs:
      - CE047
      - CE048

