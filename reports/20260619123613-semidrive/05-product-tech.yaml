  evidenceGaps:
    - type: missing-source
      severity: material
      topic: X10-production-ramp
      missingEvidence: >-
        An official or third-party confirmed mass-production start date and initial customer list for the
        X10 AI cockpit SoC, backed by a Tier-1 integrator or OEM programme announcement.
      whyItMatters: >-
        X10 is central to SemiDrive's 4nm cockpit roadmap and the company's ability to close the AI
        performance gap with Qualcomm. An unconfirmed production ramp limits confidence in near-term
        revenue forecasts and the strategic significance of the 2026 Beijing Auto Show announcements.
      diligencePath: >-
        Request official production ramp announcement or customer reference from SemiDrive IR; monitor
        automotive news for OEM design-win press releases; check 2026 Q3 industry analyst coverage.
      relatedQuestionRefs:
        - QE015
        - QE019

    - type: private-evidence-only
      severity: material
      topic: E3650-design-wins
      missingEvidence: >-
        Independent validation of the "90% of OEM next-gen zone controller design wins" claim, such as
        OEM procurement announcements or Tier-1 integrator public statements.
      whyItMatters: >-
        This claim, if verified, would be the strongest evidence of SemiDrive's MCU market dominance.
        If overstated, it could indicate dependence on a narrower customer set.
      diligencePath: >-
        Request customer reference list from SemiDrive under NDA; cross-check against OEM EE architecture
        announcements that cite MCU vendors; look for Tier-1 product briefs citing E3650.
      relatedQuestionRefs:
        - QE004

    - type: missing-source
      severity: material
      topic: TSMC-supply-terms
      missingEvidence: >-
        Any public or disclosed detail on SemiDrive's TSMC foundry supply agreement terms, including
        capacity reservation, pricing escalators, or geopolitical force-majeure provisions.
      whyItMatters: >-
        SemiDrive's X10 4nm product and potentially E3650 advanced-node replacements rely entirely on
        TSMC capacity. The absence of public supply terms makes it impossible to assess supply chain
        resilience or pricing risk.
      diligencePath: >-
        Review supply chain disclosures in any upcoming SemiDrive IPO filing; request foundry strategy
        briefing; monitor TSMC automotive-customer capacity allocations in industry press.
      relatedQuestionRefs:
        - QE014

