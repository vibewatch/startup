  - id: roadmap-embodied-intelligence
    title: Roadmap, Embodied Intelligence, and Risks
    body: >-
      The 2026 Beijing Auto Show (April 24) served as the company's flagship product reveal, introducing the
      X10 AI cockpit SoC (scheduled for 2026 mass production per analyst reports), the E3800 Architecture
      Master Unit (10+ cores, aerospace-grade embedded memory 10–20× the performance of conventional eFlash,
      NPU+CPU pipeline), the Dual-Star AMU (two E3650 chips connected via the SemiLink interconnect with
      microsecond-level cross-chip latency presenting as a single 10–16 core virtual chip), and the E3610
      IO-type zone controller. None of these products had confirmed mass-production timelines as of the
      research date. The E3620P powertrain MCU was launched at the 2025 Shanghai Auto Show and entered
      production, with Zhenqu Technology as its first customer. Under "Strategy 2.0," SemiDrive announced
      a full-stack embodied-intelligence platform covering R1 series (AI inference "computing brain"), D9-Max
      (EtherCAT "intelligent cerebellum"), and a partnership with Galaxy Universal Robotics—all at
      development stage. Capital concentration risk is material: the ~$100M Series C was raised across three
      concurrent product lines. Export controls on sub-28nm EDA tools create a background risk for the
      advanced-node X10 roadmap. The China automotive MCU market is projected to grow from USD 3.42B in 2025
      to USD 5.17B by 2031 (CAGR 7.11%), providing a supportive demand backdrop.
