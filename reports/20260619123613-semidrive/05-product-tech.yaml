  - id: technology-architecture
    title: Technology Architecture
    body: >-
      SemiDrive designs heterogeneous multi-core SoCs and MCUs with differentiated silicon integration. The
      E3650 MCU is fabricated on a 22nm automotive-grade process—a node advantage over the 28nm standard for
      comparable products—and integrates an ARM Cortex-R52+ lock-step cluster running at 600MHz, 16MB embedded
      NVM with ECC, and large-capacity SRAM. The proprietary SSDPE communication accelerator offloads CAN FD
      packet handling from the main CPU, achieving zero packet loss at high bus loads. The Xuanwu HSM module
      provides hardware-root-of-trust with both Chinese national cryptography (SM2/SM3/SM4) and international
      algorithms (AES/RSA/ECC/SHA). The G9 gateway processor employs a heterogeneous design pairing a
      high-performance Cortex-A55 CPU with a dual-core lock-step Cortex-R5 for real-time processing, connected
      to an integrated SDPE network-acceleration engine that enables high-speed, low-latency Ethernet/CAN-FD
      switching with built-in HSM. The X10 AI cockpit SoC moves to TSMC's 4nm automotive-grade process,
      delivering 80 TOPS dense AI compute and 154GB/s DDR bandwidth, enabling on-device deployment of up to
      9B-parameter large models. SemiDrive claims the X10 replaces the combination of a domain controller and
      an external AI Box, reducing system BOM cost by RMB 1,500–3,000. The company reports the E3650
      achieves approximately 40% higher compute, 30% larger embedded storage, and 40% smaller die area versus
      comparable competing products.
