  - id: software-ecosystem-partnerships
    title: Software Ecosystem and Partnerships
    body: >-
      SemiDrive operates a tiered software-ecosystem model organized into three official partner categories:
      Operating System/Basic Software, Tool/Protocol Stack/Safety, and Application/Ecology/Vision. For AUTOSAR
      basic software, the company maintains formal partnerships with both ETAS (since 2020, formal agreement
      July 2022) and Elektrobit (announced April 2026). Elektrobit (EB tresos Studio) has completed full
      AUTOSAR BSW adaptation covering both the E3620 and E3650 MCUs, providing a validated software layer for
      next-generation domain and zone controllers. ETAS, a Bosch subsidiary, supplies both AUTOSAR solutions
      and its CycurHSM cybersecurity firmware; the two companies have co-supported multiple mass-produced
      vehicle programs. Supported OS and toolchain stack includes QNX Hypervisor, Android, and RTOS, with
      toolchain partners IAR, Greenhills, and UDE. The X10 cockpit SoC targets QNX 8.0 + Android 16
      co-existence. In April 2026, SemiDrive signed a strategic cooperation agreement with ZBO Electronics
      (Romania-headquartered) to expand into Europe, South America, Southeast Asia, and India with
      integrated IVI solutions. An unnamed European OEM supply agreement for the X9 SoC adds evidence of
      product-market fit outside China.
