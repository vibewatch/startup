chapter:
  number: 5
  title: Product & Technology
  summary: >-
    SemiDrive's product portfolio spans three mass-production automotive lines—X9/X10 cockpit SoCs,
    G9 central gateway processor, and the E3 MCU family (E3650 flagship at 22nm, ASIL D certified
    by TÜV Rheinland)—that together have shipped over 12 million units to 10/10 China top-OEM groups
    and 7/10 global top-OEMs as of April 2026. The 2026 Beijing Auto Show unveiled next-generation
    products (X10 4nm AI cockpit SoC, E3800 AMU flagship MCU) alongside a full embodied-intelligence
    extension into humanoid robotics, while the software ecosystem is mature with full AUTOSAR
    adaptation via Elektrobit and ETAS.

sections:
  - id: product-lines-market
    title: Product Lines and Market Position
    body: >-
      SemiDrive offers three mass-production automotive product lines and one emerging embodied-intelligence
      line. The X9 cockpit SoC series is the company's revenue anchor, with over five million units shipped
      and the leading domestic brand position validated by a 3.77% China market share in 2025. The G9 central
      gateway processor targets the new vehicle E/E architecture paradigm, handling Ethernet, CAN-FD, and LIN
      consolidation with an integrated hardware-security module. The E3 MCU family—led by the 22nm E3650
      flagship—achieved five million-plus shipments and was ranked the number-one Chinese high-performance
      automotive MCU vendor in 2025 by the Gaogong Institute. Cumulative all-product shipments exceeded twelve
      million units by the 2026 Beijing Auto Show, with the company claiming coverage of every one of China's
      top-ten OEM groups and seven of the global top-ten. The E3650 has secured design-wins for approximately
      ninety percent of domestic OEM next-generation domain-controller platforms (company-claimed), and the
      E3 series is deployed in over fifty mass-production vehicle models including Li Auto L-series, Lotus
      ELETRE, and Leapmotor C10/C16. An unnamed European OEM supply agreement for the X9 SoC in mass-produced
      vehicles was first disclosed in late 2024, marking SemiDrive's initial overseas OEM win.
