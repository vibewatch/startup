  customerFocus: Professional short-term-rental hosts and property managers, especially multi-listing operators that need multi-channel sync, owner workflows, team coordination, and deeper integrations.
  businessModel: Primarily SaaS-style subscription and workflow software revenue, with quote-led pricing by listing count and newer attach surfaces in payments, financing, insurance, direct booking, and AI-driven automation.
