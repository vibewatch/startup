      - number: '5.2'
        title: 架构与集成模式
        blocks:
          - type: paragraph
            body: >-
              公开记录中最强的技术证据来自 Hostaway 的开发者文档，而不是营销文案。文档展示了真实的伙伴和构建者表面：面向内部软件的公开 API、绑定明确伙伴标识的 API key、长期有效但可续期的
              token、带细粒度事件订阅的统一 webhook，以及复杂支付流处理——在这些场景里 API 伙伴和 OTA
              可能已经收取了部分预订余额。这个点重要，因为真实运营产品不是死在精心演示，而是死在边界案例。Hostaway 文档展示了围绕伙伴渠道、离线收费、no-show 报告、取消费更新，以及到 2027 年从旧版
              webhook 模型迁移出去的具体设计选择。结合 WordPress 和 Zapier
              集成，技术故事指向一个生态原生平台，其价值高度依赖可靠互联。基础设施层架构仍不透明，但工作流和伙伴集成的运营模式在公开来源中少见地清晰。
