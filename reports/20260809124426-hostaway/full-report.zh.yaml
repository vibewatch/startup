      - number: '1.4'
        title: 规模节点、战略势能与可见尽调信号
        blocks:
          - type: paragraph
            body: >
              公开里程碑记录显示，公司在多个战线同时加速。Hostaway 2023 年年终更新提到 249 次产品发布、60 名新员工、35 个新市场伙伴，以及新加入的 Google Vacation Rentals
              房源渠道。这个信号重要，因为它说明公司不只是讲叙事，而是在把资本转成真实发版节奏。2024 年和 2025 年材料随后从执行证明转向塑造品类的野心：Hostaway 自称是第一家集成 ChatGPT 的
              PMS，强调 AI 辅助消息和定价是产品差异点，并公开 2026 年在 Airbnb、Booking.com 和 Vrbo 三大顶级连接认证上的「三冠」。周年报道又补充了招聘规模、面向欧洲的扩张和 G2
              快速增长认可。但风险面也真实存在，并已在公开评论来源中可见。Trustpilot 和 Software Advice 有详细投诉，涉及支付授权设计、支持延迟、计费摩擦、VRBO
              故障、重复预订风险和反复涨价；与此同时，G2、Capterra 和 Software Advice 的整体评分仍然强。最重要的综合结论并不是 Hostaway
              缺少产品市场匹配；它显然已经有。真正的尽调问题是，公司能否把品类领先融资、AI 野心和分销合作转化为耐久的企业级执行，同时不让支持质量、计费信任和治理不透明拖累一个原本强劲的运营故事。
