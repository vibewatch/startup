      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Hostaway 这类软件的购买中心会随组合规模变化。小房东往往同时是买方、用户和付款方；但一旦运营商跨多个 OTA
              管理几十套房源，经济性就会更专业化。中端市场管理方最在意渠道同步、更干净的执行、房价管理、报表和基础直接预订能力，因为即使中等规模也会让手工对账变得昂贵。更大的运营商会在收益管理、运营、财务和合规中加入正式预算负责人，因为痛点从简单预订同步转向全系统吞吐和利润保护。2026
              年证据指向一个专业管理方正在拉开与休闲房东差距的市场：管理 100 套以上房源的运营商更快采用
              AI，使用更成熟的定价纪律，并在收入上明显跑赢个人。直接预订仍不成熟，但这个弱点反而可能提高供应商价值，因为它们能帮助运营商在不丢失运营控制的情况下分散需求。多渠道分销复杂度同样重要；一旦管理方必须对齐多个
              OTA 数据源、清洁日历、费用和本地规则，软件采购就不再是便利工具，而是运营基础设施。
