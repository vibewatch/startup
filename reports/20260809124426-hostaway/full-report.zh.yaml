        - 最新股权结构表、清算优先权栈、稀释、老股 / 新股组合
        - 即使业务质量高，也由它决定当前价格能否投资
        - 公司财务和法律尽调
      - - 国际合规
        - 隐私、数据传输和司法辖区控制栈
        - 需要用它把法律风险从叙事转成可衡量敞口
        - 法律 / 安全尽调
    notes: 这里每个问题都影响决策；没有一个只是锦上添花。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
