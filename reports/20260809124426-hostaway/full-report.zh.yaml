      - number: '8.4'
        title: 最终尽调事项与论点破裂点
        blocks:
          - type: paragraph
            body: >-
              尽调清单很直接，也没有可选项。第一，投资人需要合并财务报表，把集团收入、烧钱和利润率与较窄的 Opco 申报对齐。 第二，投资人需要队列耐久性数据——NRR、GRR、logo
              流失、附加率和流失原因——以判断工作流深度到底带来健康扩张，还是只是黏性的复杂度。 第三，投资人需要伙伴和支持证据：OTA 合同依赖、Stripe 经济性、保险理赔结果、正常运行时间历史和 SLA 分布。
              这些要求不是收尾清单；它们决定 Hostaway 是否配得上溢价倍数，还是只应留在观察名单上。如果私有数据显示留存疲弱、
              集中度有分量、支持成本严重膨胀，或伙伴脆弱性把增长变成运营负担，论点就会破裂。在那之前，最纪律化的公开证据立场是： 公司质量高，市场位置有吸引力，价格仍未解。
