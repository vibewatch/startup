              不发布自助套餐表，而是先按房源数量划分潜客。这与一种随运营商复杂度扩展的合同结构一致，也可能混合基础订阅逻辑与按房源或打包计价的经济性。融资稿也重要，因为它显示 Hostaway 正从核心 SaaS
              扩展到支付相邻和风险相邻产品，例如 Hostaway Capital 和 Hostaway Insurance。这不能证明这些新产品今天已经贡献了可观收入，但说明管理层正在搭建比狭窄 PMS
