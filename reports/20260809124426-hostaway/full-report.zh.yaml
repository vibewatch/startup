companyProfile:
  summary: >-
    Hostaway 是一家总部位于赫尔辛基、远程优先的物业管理软件平台，由 Marcus Räder、Saber Kordestanchi 和 Mikko Nurminen 于 2015
    年创立。公司面向专业短租管理方销售一体化运营系统，组合了 PMS、渠道管理、消息、报表、直接预订、业主工作流、集成，以及更新的 AI、定价、资本和保险模块。公开证据支持其广泛的国际覆盖、可观的客户采用，以及通过 PSG 和
    General Atlantic 获得成长资本的少见能力。业务在战略上强、商业相关性高，但相对其后期估值叙事，合并经济性披露仍不足。
