      - number: '7.2'
        title: 运营、安全与服务一致性风险
        blocks:
          - type: paragraph
            body: >-
              Hostaway 的运营风险不像灾难性的产品崩盘，更像复杂工作流带来的执行波动。公司公开文件列出了有分量的缓释措施： 强制 2FA、细粒度权限、住客门户时间控制，以及退房后自动隐藏门禁码和
              Wi-Fi。这些都是好信号。 但同一套文件也说明，客户或管理员必须正确配置大量敏感决策。管理员级权限带来很宽的可见范围；入住中的门户会有意展示门禁码和支付信息； 认证依赖 SMS 和 magic-link
              的可靠性；分布式团队的入职培训还必须第一次就落到位。评论记录展示了问题会怎样发生。 Trustpilot 投诉提到支持缓慢、账单争议和令人沮丧的售后体验，而 G2 和 Software Advice
              又显示，只要入职和支持响应及时，同一款产品也能让用户觉得很出色。 因此，风险不是“没有控制”，而是在复杂控制面之上执行不稳定。只要客户把 Hostaway 用作日常运营底座，这种不稳定仍可能有实质财务影响。
