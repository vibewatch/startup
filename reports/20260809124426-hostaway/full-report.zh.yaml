  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律和监管敞口
        blocks:
          - type: paragraph
            body: >-
              Hostaway 最显眼的法律风险不是某个冷门边角问题，而是一个普通但严肃的负担：在全球化、重集成的工作流里处理敏感的住客、预订和支付数据。 隐私政策罕见地写得很明白：Hostaway
              会作为网站和服务活动的数据控制者，处理姓名、联系方式、预订、支付、评价、消息和任务。 因此，GDPR 以及适用场景下的加州隐私法会直接打到公司身上。监管问题不只是抽象的合规文书。
              一个平台把市场共享、跨境传输、住客沟通和财务记录放在一起，通知、同意、访问、删除、更正、限制和泄露处置都会出现多个失效点。 Hostaway 确实释放了一些治理信号——DPO
              联系方式、投诉权利和法律资源页面——但公开记录更多证明义务存在，较少给出可独立验证的保证材料。 投资人由此面对的结论是：隐私敞口既是最明显的风险之一，也是仅靠公开披露最难承保的风险之一。
            claimRefs:
              - CR001
              - CR002
