            title: 隐私敞口是最清晰的高严重性风险
            body: Hostaway 公开披露，其会处理住客、预订、支付和通信数据，并把有关字段共享给集成伙伴。GDPR、CCPA、权限和供应商链治理因此处在尽调核心，而不是外围。
