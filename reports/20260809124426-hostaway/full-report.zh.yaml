      - number: '1.2'
        title: 创始人、领导层可见度与远程优先运营模式
        blocks:
          - type: paragraph
            body: >
              创始故事在官方和第三方报道中少见地一致。Hostaway 由 Marcus Räder、Saber Kordestanchi 和 Mikko Nurminen 于 2015
              年创办，起点是他们发现高速增长的在线旅行社与房源管理方可用的碎片化后台工具之间存在结构性缺口，而后者需要跨这些平台运营。Marcus Räder 是最主要的公开高管声音，并持续被识别为 CEO
              兼联合创始人；TechCrunch 在 2024 年称 Saber Kordestanchi 为 CSO，而 Mikko Nurminen
              仍是最常在外部访谈中与融资、文化和早期扩张评论相连的联合创始人。领导层连续性也是一个可见主题：2023 年 PSG 公告和 2024 年 General Atlantic/PSG
              公告都明确称，融资后管理团队将保持不变。同样重要的是，Hostaway 的组织设计本身就是投资论点的一部分。Marcus Räder
              后来的评论和周年报道描述了远程优先、全球分布的结构；这让公司早期能在北美和欧洲之间取得平衡，后来又能把招聘集中到增长需要的地方。公开规模信号在这里连贯：2024 年官方融资材料称，公司在 44 个国家拥有 230
              多名员工；2025
              年周年报道称，员工人数在两年内增加一倍以上，且每位员工都获得股权。更不清晰的是治理深度。公开材料没有给出详细的当前董事会名单、委员会结构或所有权拆分，因此投资者应把创始人层面的领导层可见度视为高，但把更广控制框架的可见度视为较低。
