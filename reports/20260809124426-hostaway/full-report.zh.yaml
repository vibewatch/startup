              年末业务覆盖 90+ 个国家，拥有 200 多个市场伙伴和 230 多人的远程团队。这些事实支持可观规模，也暗示了不小的成本基础：24/7 电话支持、上手服务、多语言覆盖、伙伴管理和持续 AI
              开发，都需要持续投入。最令人困惑的公开数据点是芬兰实体申报。Asiakastieto 显示 Hostaway Oy 在 2025 年有 0 名员工、约 €1.3 million 经营亏损，而 Hostaway
