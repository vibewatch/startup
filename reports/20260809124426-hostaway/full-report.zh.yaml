      - number: '1.3'
        title: 融资历史、投资方与经济利益相关方
        blocks:
          - type: paragraph
            body: >
              Hostaway 的资本历史是 STR 软件生态中最清晰的品类领导信号之一。拐点出现在 2023 年，PSG 领投 $175 million
              战略成长投资，公司和投资方材料称这是当时该品类史上最大融资额。第二个更大的拐点出现在 2024 年 12 月，General Atlantic 领投 $365 million 战略成长投资，PSG
              也参与其中。官方稿称交易后 General Atlantic 和 PSG 是重要少数股东，而 TechCrunch 报道投后估值为 $925 million。到 2025 年末，公司和行业报道称 Hostaway
              以 $1 billion 估值成为第一家短租 PMS 独角兽，多家媒体也将其称为估值最高的度假租赁软件公司。Tracxn 的汇总画像显示，已披露融资为 7 轮 $543
              million；这与两轮巨额融资加早期种子资本方向一致，即使完整股权结构表和持股比例仍未公开。资金用途在各来源之间也一致：国际扩张、语言本地化、产品开发、AI、直接预订，以及资本、保险、智能锁集成等相邻服务。合在一起看，资本基础说明
              Hostaway 已不再只是一个高速增长的自举型产品；它是一个后期软件平台，投资人预期更接近规模化垂直 SaaS 公司，而不是生活方式型旅游科技业务。
