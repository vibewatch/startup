  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              分析 Hostaway
              时，应把它放在短租生态内的运营软件供应商位置，而不是把它当作整个预订市场的代理。它的产品范围位于控制层：同步渠道、自动化住客运营、支持直接预订，并越来越多地处理报表和合规工作。因此，相关市场边界从
              PMS、渠道管理、自动化、消息、定价、报表和直接预订基础设施开始。住宿夜晚本身的总预订价值不在其中；那是制造运营痛点的需求池，却不是 Hostaway
              能直接变现的收入池。相邻表面仍然重要，因为它们影响买还是建的决策和路径经济性。例如，Google Vacation Rentals 重要，是因为它是直接预订和元搜索渠道，而不是替代
              PMS。最强的现状替代方案是手工工作流、电子表格、堆叠的单点工具，或 OTA 优先的运营方式。这个框架很关键，因为它避免了常见分析错误：把整个度假租赁市场称为 Hostaway 的 TAM，而 Hostaway
              实际销售的是帮助专业运营商管理这个市场的软件。
