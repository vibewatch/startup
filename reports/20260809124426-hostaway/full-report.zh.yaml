      - number: '2.2'
        title: 规模测算视角、相互矛盾的估计及其含义
        blocks:
          - type: paragraph
            body: >-
              公开市场规模测算有方向价值，但方法噪音很大。最宽的住宿支出估计把 2026 年全球度假租赁或短租活动放在约 USD 106.5 billion 到 USD 165.7 billion 区间，Mordor 和
              Precedence 落在这两个边界之间。这些数字有助于理解品类重要性和旅行需求，但仍高估了 Hostaway 的服务市场，因为 Hostaway
              并不按住宿支出抽成。更相关的软件和平台估计小得多，也乱得多：已审阅的 2026 年软件层数字约在 USD 440 million 到 USD 1.06 billion
              之间，取决于发布方把市场定义为完整物业管理软件、度假租赁平台，还是端到端运营工具。这个差距太大，不能把任何一个数字当作事实锚。正确解读不是市场不可知，而是必须把广义旅行 GMV 与软件层分开。Hostaway
              的论点依赖于大型旅行品类中的工作流复杂度、专业化和可附加的软件支出，而不是直接捕获每一晚经 Airbnb、Vrbo 或 Booking.com 预订住宿的总价值。
