      - number: '7.3'
        title: 伙伴和模式依赖风险
        blocks:
          - type: paragraph
            body: >-
              Hostaway 的业务和第三方深度缠在一起，这既是优势，也是脆弱点。OTA 连接是价值主张的核心，因此 Airbnb 和 Expedia 改规则、 API 不稳定或伙伴身份变化，即使 Hostaway
              自身运行正常，也会伤到客户体验。支付流依赖 Stripe Connect 这类基础设施， 让 Hostaway 不必从零搭建全球 KYC、制裁、PCI 和税务系统，但也把依赖集中到一个受监管的交易对手上。保险依赖
              Safely， 且只覆盖部分客户。市场伙伴还会触及住客消息、门锁、定价、CRM 和直接预订工作流。客户案例把这种敞口讲得很具体： 运营方一旦把预订、支付、业主报表、门锁或增购集中到
              Hostaway，伙伴失效就不再是外围问题，而会影响收入。 最大的公开盲点在于，Hostaway 不披露伙伴合同条款、正常运行时间历史或交易对手集中度指标，因此剩余依赖风险只能推断，无法衡量。
