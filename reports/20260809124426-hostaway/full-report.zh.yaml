        title: 客户基础与理想客户画像
        blocks:
          - type: paragraph
            body: >-
              Hostaway 的公开客户证据指向相当清晰的 ICP：管理多个房源、通常跨渠道、业主和地域运营的专业短租运营商。定价流程不是从孤立房东清单开始，而是从房源数量区间开始；Airbnb
              伙伴目录也明确称，该产品适用于从小型 STR/VR 公司到 1,000 多套房源的运营商。这个范围重要。它说明 Hostaway
              想要的是已经感受到渠道、业主和团队复杂度的管理方，而不是可以靠手工流程活下去的休闲单套房源爱好者。具名证明集强化了这一判断。MidTown、Leisr、CMHBNB、Vacationer Dubai、Rather
              Be 和 Brathay 都描述了多房源运营、业主工作流或远程团队协同。因此，客户基础在地域和规模上看起来很广，但在运营画像上较窄：当业务已经跨过需要集中化、自动化和直接预订基础设施的门槛时，Hostaway
              看起来最强。即使评论证据也更偏向考虑规模、工作流深度和支持响应的运营商，而不是一次性托管便利。
