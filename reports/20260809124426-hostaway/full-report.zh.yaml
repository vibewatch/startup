chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与客户足迹
        blocks:
          - type: paragraph
            body: >
              Hostaway 将自己定位为一体化度假租赁运营平台，而不是狭窄的房源同步工具；当前公开记录大体支持这一定位。官网、2024 年和 2025
              年公司公告，以及第三方产品目录，都一致描述了一层统一软件：服务短租业主和专业管理方，覆盖物业管理、渠道管理、消息、自动化、报表、支付、直接预订工具和开放集成。官方材料称，平台与
              Airbnb、Vrbo、Booking.com、Expedia、TripAdvisor、Marriott、Google Travel 等渠道有深度 OTA 连接，Hostaway
              充当控制层，同步房源、预订、定价和住客沟通。规模表述方向性强，即使并非完全稳定：Hostaway 称服务数千名活跃客户；官方融资材料将客户锚定在 90 多个国家，更早的公司口径提到 100
              多个国家，周年报道之后又称覆盖 100 多个市场。差异不推翻核心结论：Hostaway
              是全球产品，而非区域小众供应商；但也意味着当前精确足迹应在管理层尽调中确认，不能只从营销文案推断。平台的可服务客户也从只有少量房源的房东延伸到拥有数百或数千套房源的企业级管理方。这个跨度很关键，因为它把
              Hostaway 定义为推动专业化的扩张型软件层，而不只是面向高级个人用户的工具。
