              的目录和竞争对手页面显示，几个同行也有有意义的徽章覆盖和直接集成。这意味着更耐久的切换成本存在于更深一层：业主对账单、支付路由、消息自动化、直接预订网站、智能锁工作流、收益规则和自定义 API
              驱动流程。一旦运营商围绕这些工作流训练团队、业主、清洁人员和住客，迁移就会变得痛苦。同时，开放生态趋势削弱了绝对锁定。API、市场和集成目录能帮助供应商赢下更大客户，但也让买方可以随时间重组或替换栈的一部分。因此，内部自建主要仍是有技术资源或特殊工作流需求的运营商的替代方案，而不是普通买方的替代方案；后者只想要可靠的运营骨干。
