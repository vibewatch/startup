      - number: '8.2'
        title: 估值背景与可比框架
        blocks:
          - type: paragraph
            body: >-
              融资背景很亮眼。PSG 在 2023 年以 $175M 投资进入，General Atlantic 在 2024 年底领投 $365M 战略增长投资， Hostaway 称公司在 2025 年跨过 $1B
              估值门槛。这些都是真实的赞助方信心和市场胃口信号。但仅凭它们，不能证明新投资人应当显著高于当前标记出价。 可比公司也强化了谨慎必要性。Airbnb、Booking 和 Expedia
              这类旅游市场平台能提供有用的公开估值锚，但结构上不同于 Hostaway 更窄的垂直软件画像。 HubSpot
              对自有渠道和营销技术栈逻辑更有参考价值，但它并非旅游公司。结果不是一个精确答案，而是一个有用但不完美的代理区间。 同时，Hostaway Opco
              申报又引入额外模糊性：它提供了真实的本地财务数据，却不是集团经济性的合并图景。 合在一起，正确问题不是“公允价值到底是多少？”，而是“我们实际能看到的证据，能支持在当前底价上方支付多少溢价？”
