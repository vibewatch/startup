      - number: '8.3'
        title: 情景区间与期望价值
        blocks:
          - type: paragraph
            body: >-
              公开记录不完整，所以唯一诚实的方法是做情景分析，而不是制造虚假的精确度。牛市情景下，Hostaway 证明了强劲的队列留存、 干净的支持可扩展性，并能把
              AI、直接预订和相邻的类金融科技模块有效变现。在这组假设下，估值显著高于独角兽底线是合理的， 赞助方之间的上行仍然存在。基准情景更保守：Hostaway 确实是品类赢家，但私有经济性只是好，而不是极好；
              它支持在当前底线上给出温和溢价，而不是一次阶跃式重估。熊市情景不是公司质量崩塌，而是重新定价：
              支持波动、伙伴依赖、竞争或疲弱的耐久性指标，把资产压回当前叙事溢价以下。由于公司看起来真实且具备战略意义，这些情景的期望价值仍偏正。 但安全边际太薄，除非价格下移或私有指标提高信念，否则还不足以给出确信买入判断。
