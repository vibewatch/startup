      - 所含能力信号
      - 未知项 / 注意事项
      - 含义
    rows:
      - - Hostaway
        - 报价驱动；按房源数收集需求，分 2-14、15-49 和 50+ 个房源；Software Advice 称价格需询价
        - AI 消息、渠道管理器、直订、业主结算单、支持
        - 没有清晰自助价目表，也没有公开实施成本标准
        - 对大客户更灵活，但不利于快速比价的 SMB 买家
      - - Guesty
        - 官网 Lite 为 $9/mo；第三方摘要称起价约 $23/mo；Pro 和 Enterprise 为配置化报价
        - Lite 覆盖 Airbnb / Vrbo / Booking.com 同步和收件箱；Pro 增加 60+ 个渠道、业主门户、收益工具；Enterprise 增加安全和高级报表
        - 用户报告有附加费，规模扩大后有效成本更高
        - 能拿下小型用户，但价格异议仍是活跃销售风险
      - - Lodgify
        - $14-$62/mo 公开套餐；7 天免费试用
        - 渠道管理器、网站构建器、预订引擎、支付、消息、任务，高阶套餐含业主报表
        - 高级能力和附加项仍会抬高总成本
        - 面向小型运营方的自助获客动作很强
      - - Hostfully
        - 留存公开画像称 PMS 约为 $99 + $20/property/mo，或含 API 的 $21/property/mo；无免费 PMS 试用
        - PMS、流程管线、收件箱、直订、业主门户、设备、API、报表
        - 入驻费不一；准确包装取决于如何解读来源
        - 比纯询价同业更透明，但仍不如简单套餐表标准化
      - - Avantio
        - 留存来源没有自助价目表；演示 / 询价驱动姿态
        - 面向机构的 PMS、渠道管理器、业主区、会计、网站
        - 留存来源未公开实施范围、模块和合同条款
        - 适合面向 20+ 套房源机构的顾问式销售，但限制即时比较
      - - Hostify
        - Software Advice 起价 $20/mo；官网强调无入驻费和退款保证
        - 渠道管理器、收件箱、预订引擎、业主仪表盘、分析、移动应用
