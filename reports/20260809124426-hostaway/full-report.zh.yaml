  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与核心论点
        blocks:
          - type: paragraph
            body: >-
              Hostaway 值得投资人认真关注，因为公开记录支持的是一个真实的品类领导者，而不是营销外壳。公司在细分赛道里融到罕见的大额轮次，
              吸引了一线成长投资人，跨过独角兽门槛，也展示出有分量的产品、客户和伙伴宽度。因此，定性案例很强。问题在价格纪律。
              公开证据没有给出合并收入、NRR、GRR、支持成本结构或毛利率证明，投资人无法在当前独角兽标记或更高价格上干净承保。 这很关键，因为 Hostaway 的故事已经背负了
              AI、直接预订和持续国际增长带来的溢价预期。公开案例支持紧密跟踪、深入尽调， 并在缺失指标补齐后愿意为质量付费。它不支持把高质量公司自动等同于有吸引力的入场价。因此，本报告的建议是跟踪 / 继续研究，
              置信度为中；估值立场可以概括为：质量很贵，但证据仍薄。
