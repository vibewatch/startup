      - number: '5.4'
        title: 信任控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              Hostaway 的公开信任姿态是混合的。正面看，公司暴露了几项真实控制细节：AI CoHost 称存在人工批准边界，API secret 只显示一次，access token 会过期，webhook
              目的地会被验证以避免不安全网络目标，保险理赔也嵌入工作流。这些是具体实现控制。负面看，在保留来源集中，公开保证披露仍相对薄弱。G2 称 Hostaway
              没有在其页面添加卖方安全信息，也没有保留来源给出公开状态页、SOC 2 报告、ISO 认证或可审计事故日志。技术依赖风险也仍然显著。平台依赖 OTA API、伙伴生态、外部定价数据源，以及可能包含 OTA
              已收款和伙伴已收款余额的支付流。这对品类来说正常，但意味着可靠性部分是系统集成问题，不只是软件质量问题。核心产品看起来可信且成熟；信任表面仍需要更多可验证披露。
