- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Public API
    - Connect in-house software and partner tools
    - Dashboard-issued keys, partner mapping, token lifecycle
    - Restricted discoverability for outsiders; token hygiene matters
  - - Unified webhooks
    - Push reservation, task, and message events to third parties
    - Stable event model and external endpoint reliability
    - Webhook failures can disable flows after prolonged errors
  - - Partner Channel
    - Handle non-OTA partners with custom reservations and markups
    - Correct partner designation and automation setup
    - Misconfigured logic can create reconciliation issues
  - - Auto-payment engine
    - Calculate remaining balances around OTA and offline charges
    - OTA settlement behavior, partner-added charges, payment templates
    - Billing complexity and double-charge risk if logic is mishandled
  - - Pricing-data layer
    - Feed dynamic pricing model with large market data inputs
    - External data partners, OTA market data, Hostaway reservations
    - Black-box uplift claims and partner-data quality risk
  - - Website / CMS connectors
    - Expose listings and bookings to websites and automation layers
    - WordPress connector, Zapier, other partner apps
    - Integration drift or plugin failure can impact lead capture
  notes: The public docs reveal operating-logic details but not cloud-infrastructure internals. The main technical read is integration complexity, not stack transparency.
