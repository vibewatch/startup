callouts:
- calloutType: insight
  title: The strongest public technical evidence lives in the support docs
  body: Hostaway’s marketing pages explain what the product is for, but its support docs reveal how the platform actually behaves under edge cases. The public API, webhook, partner-channel, and auto-payment articles are the clearest proof that this is a real operations platform and not just a glossy booking dashboard.
  claimRefs:
  - CE013
  - CE015
  - CE018
  - CE019
- calloutType: risk
  title: Trust posture is operationally detailed but externally under-disclosed
  body: Hostaway shows real controls around keys, tokens, webhook destinations, and AI approval boundaries. But the retained sources still do not surface a public status page, security packet, or formal certification evidence. That gap may not mean weak security, but it does mean investors must ask for direct materials instead of inferring trust from product polish.
  claimRefs:
  - CE016
  - CE032
  - CE033
  - CE034
  - CE035
- calloutType: assumption
  title: Integration depth is likely the real product moat surface
  body: Many rivals advertise similar headline modules. What looks more defensible in the public record is Hostaway’s depth around eventing, OTA-specific logic, partner channels, payment edge cases, and workflow orchestration. If that depth proves reliable in diligence, it matters more than a long feature list.
  claimRefs:
  - CE018
  - CE019
  - CE027
  - CE029
  - CE037
