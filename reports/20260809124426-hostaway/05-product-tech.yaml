- id: trust-controls-and-technical-risks
  title: Trust controls and technical risks
  body: 'Hostaway’s public trust posture is mixed. On the positive side, the company exposes several real control details: AI CoHost says human approval boundaries exist, API secrets are shown only once, access tokens expire, webhook destinations are validated to avoid unsafe network targets, and insurance claims are embedded into the workflow. Those are concrete implementation controls. The negative side is that public assurance disclosures remain relatively weak in the retained source set. G2 says Hostaway has not added seller security information there, and no retained source gives a public status page, SOC 2 report, ISO certification, or auditable incident log. Technical dependency risk also remains significant. The platform relies on OTA APIs, partner ecosystems, external data sources for pricing, and payment flows that can include OTA-collected and partner-collected balances. That is normal for the category, but it means reliability is partly a systems-integration problem, not only
    a software-quality problem. The core product looks credible and mature; the trust surface still needs more verifiable disclosure.'
