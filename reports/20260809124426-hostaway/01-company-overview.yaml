  - calloutType: risk
    title: Execution quality and governance transparency remain the main underwriting questions
    body: >
      Strong growth does not eliminate the need to verify support responsiveness, billing trust, exact board oversight, and audited financials.
      Those are the clearest gaps still visible from public evidence.
