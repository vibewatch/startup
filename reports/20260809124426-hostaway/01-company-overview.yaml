callouts:
  - calloutType: strength
    title: Hostaway has crossed from category upstart to capital-backed platform leader
    body: >
      Between the PSG and General Atlantic financings, the 2025 unicorn milestone, and top-tier OTA recognition, Hostaway has amassed stronger
      external validation than almost any independent STR PMS peer.
    claimRefs:
      - CO022
      - CO024
      - CO028
      - CO029
