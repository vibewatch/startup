  evidenceGaps:
    - type: missing-source
      severity: material
      topic: board-governance
      missingEvidence: A current board roster, committee structure, and director biographies for Hostaway.
      whyItMatters: Governance transparency is limited for a company that has already crossed late-stage private funding thresholds and claims unicorn status.
      diligencePath: Request the latest board deck or corporate governance appendix from management and cross-check against shareholder documents.
      relatedQuestionRefs:
        - QO007
      relatedTableRefs:
        - TO002
    - type: missing-source
      severity: material
      topic: exact-scale-metrics
      missingEvidence: A current exact count of managed properties, customer accounts, and ARR-contributing units.
      whyItMatters: Marketing language uses broad ranges and changing geography labels, which limits precision for cohort and market-share analysis.
      diligencePath: Request the latest KPI dashboard with exact customer, property, and unit counts by region and segment.
      relatedQuestionRefs:
        - QO012
    - type: private-evidence-only
      severity: material
      topic: ownership-and-secondaries
      missingEvidence: Ownership percentages by investor and founders plus any completed secondary liquidity details.
      whyItMatters: Capital structure and founder/employee liquidity affect incentives, governance leverage, and late-stage financing risk.
      diligencePath: Review the cap table, shareholder agreement summary, and any secondary sale schedule from the last two financings.
      relatedQuestionRefs:
        - QO021
      relatedTableRefs:
        - TO003
    - type: private-evidence-only
      severity: blocking
      topic: financial-disclosure
      missingEvidence: Audited revenue, ARR, gross margin, cash balance, burn, NRR, and current profitability metrics.
      whyItMatters: The public story strongly supports product and financing momentum, but valuation underwriting is impossible without clean financials.
      diligencePath: Request audited financial statements, board KPI packs, and monthly SaaS metrics with cohort retention and margin detail.
      relatedQuestionRefs:
        - QO022
    - type: conflicting-data
      severity: minor
      topic: metric-normalization
      missingEvidence: A management-approved definitions table for countries, markets, integrations, partners, customers, and properties.
      whyItMatters: Public sources use overlapping but not identical metrics, which can lead to accidental overstatement in later analyses.
      diligencePath: Ask management to provide a single glossary for headline operating metrics used in investor, customer, and press materials.
      relatedQuestionRefs:
        - QO025
      relatedTableRefs:
        - TO004
