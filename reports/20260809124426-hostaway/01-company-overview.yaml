  - id: capital-base-and-stakeholders
    title: Funding history, investors, and economic stakeholders
    body: >
      Hostaway’s capital history is one of the clearest signals of category leadership in the STR software ecosystem. The inflection point came in
      2023, when PSG led a $175 million strategic growth investment that company and investor materials described as the largest amount ever raised
      in the category at that point. The second, even larger inflection came in December 2024, when General Atlantic led a $365 million strategic
      growth investment with PSG also participating. Official releases described General Atlantic and PSG as significant minority shareholders after
      the transaction, while TechCrunch reported a $925 million post-money valuation. By late 2025, company and industry coverage described
      Hostaway as the first short-term-rental PMS unicorn at a $1 billion valuation, and multiple outlets framed it as the highest-valued vacation
      rental software company. Tracxn’s aggregate profile places disclosed funding at $543 million over seven rounds, which is directionally
      consistent with the two mega-rounds plus earlier seed capital, even if the full cap table and ownership percentages remain private. The use of
      proceeds is also consistent across sources: international expansion, language localization, product development, AI, direct booking, and
      adjacent services such as capital, insurance, and smart-lock integrations. Taken together, the capital base indicates that Hostaway is not
      just a fast-growing bootstrapped product anymore; it is a late-stage software platform with investor expectations closer to a scaled vertical
      SaaS company than to a lifestyle travel-tech business.
    claimRefs:
      - CO022
      - CO023
      - CO024
      - CO025
      - CO026
      - CO027
      - CO028
      - CO029
      - CO030
      - CO031
