company:
  name: Hostaway
chapter:
  number: 1
  title: Company Overview
  summary: >
    Hostaway is a Finland-headquartered, remote-first short-term-rental property-management-software vendor founded in 2015 by Marcus Räder,
    Saber Kordestanchi, and Mikko Nurminen. Public sources consistently support its rise from a bootstrapped channel-management startup to the
    category's best-capitalized independent STR PMS, with a $175 million PSG round in 2023, a $365 million General Atlantic-led round in 2024 at
    a reported $925 million valuation, and unicorn status in 2025. The company shows credible global scale, AI-heavy product ambition, and strong
    OTA connectivity, but still leaves material diligence gaps around exact current property count, board composition, investor ownership, and
    audited financial disclosure.
sections:
  - id: identity-and-platform
    title: Identity, product scope, and customer footprint
    body: >
      Hostaway positions itself as an all-in-one vacation-rental operating platform rather than a narrow listing-sync tool, and the current public
      record broadly supports that framing. The homepage, 2024 and 2025 company announcements, and third-party product directories consistently
      describe a unified software layer for short-term-rental owners and professional managers covering property management, channel management,
      messaging, automation, reporting, payments, direct-booking tooling, and open integrations. Official materials say the platform offers deep
      OTA connectivity across Airbnb, Vrbo, Booking.com, Expedia, TripAdvisor, Marriott, Google Travel, and other channels, with Hostaway acting
      as the control layer that synchronizes listings, reservations, pricing, and guest communication. The scale language is directionally strong
      even if not perfectly stable: Hostaway says it serves thousands of active customers; official funding materials anchor those customers in over
      90 countries, earlier company language referenced over 100 countries, and anniversary coverage later described more than 100 markets. That
      variance does not undermine the core conclusion that Hostaway is a global product rather than a regional niche vendor, but it does mean the
      exact current footprint should be confirmed in management diligence rather than assumed from marketing copy alone. The platform’s addressable
      customer set also spans from hosts with a handful of properties to enterprise managers with hundreds or thousands of listings, which matters
      because it frames Hostaway as a scaling software layer for professionalization rather than merely a prosumer tool.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO010
      - CO042
      - CO050
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: founders-leadership-and-operating-model
    title: Founders, leadership visibility, and remote-first operating model
    body: >
      The founder story is unusually consistent across official and third-party coverage. Hostaway was launched in 2015 by Marcus Räder, Saber
      Kordestanchi, and Mikko Nurminen after they identified a structural gap between fast-growing online travel agencies and the fragmented
      back-office tooling available to property managers trying to operate across them. Marcus Räder is the dominant public executive voice and is
      consistently identified as CEO and co-founder; TechCrunch described Saber Kordestanchi as CSO in 2024, while Mikko Nurminen remained the
      co-founder most visibly tied to fundraising, culture, and early scaling commentary in external interviews. Leadership continuity is also a
      visible theme: both the 2023 PSG announcement and the 2024 General Atlantic/PSG announcement explicitly said the management team would remain
      unchanged after those financings. Equally important, Hostaway’s organizational design is part of the thesis. Marcus Räder’s later comments and
      the anniversary coverage describe a remote-first, globally distributed structure that gave the company early balance across North America and
      Europe and later allowed it to concentrate hiring where growth required it. Public scale signals are coherent here: official 2024 financing
      materials said the company had more than 230 employees across 44 countries, while 2025 anniversary coverage said the workforce had more than
      doubled over two years and that every employee received equity. What remains much less visible is governance depth. Public materials do not
      surface a detailed current board roster, committee structure, or ownership breakdown, so investors should treat leadership visibility as high
      around the founders but lower around the broader control framework.
    claimRefs:
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
      - CO019
      - CO020
      - CO021
      - CO048
