callouts:
- calloutType: risk
  title: Privacy exposure is the clearest high-severity risk
  body: Hostaway openly discloses that it handles guest, booking, payment, and communications data and shares relevant fields with integration partners. That makes GDPR, CCPA, permissions, and vendor-chain governance central—not peripheral—to the diligence case.
  claimRefs:
  - CR001
  - CR002
  - CR004
  - CR005
  - CR037
  - CR038
- calloutType: insight
  title: The product’s strength and fragility run through the same dependency map
  body: The same integrations that make Hostaway valuable also amplify failure transmission. OTA APIs, Stripe, Safely, and marketplace tools help the platform scale, but they also ensure that third-party issues can become Hostaway issues in the eyes of customers.
  claimRefs:
  - CR019
  - CR021
  - CR022
  - CR030
  - CR034
- calloutType: assumption
  title: Residual risk is elevated mostly because public disclosure is thin on outcomes
  body: 'Controls exist and many customers appear satisfied, but investors still do not get the public metrics that would convert risk inference into measurable exposure: NRR, concentration, SLA distributions, incident history, and assurance artifacts.'
  claimRefs:
  - CR018
  - CR035
  - CR036
  - CR040
