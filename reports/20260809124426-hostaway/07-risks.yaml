  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: assurance-and-incident-history
    missingEvidence: Public or private SOC 2 / ISO materials, relevant company incident history, postmortems, penetration-test summaries, and a clearly attributable status history for this Hostaway.
    whyItMatters: The retained sources document policies and controls, but they do not let an investor independently verify reliability or security-assurance maturity.
    diligencePath: Request security packet, certification reports, incident log, uptime history, and root-cause reviews for the last 24 months.
    relatedQuestionRefs:
    - QR017
    - QR018
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: retention-concentration-slas
    missingEvidence: NRR, GRR, logo churn, first-response and resolution-time distributions, support staffing ratios, and top-customer revenue concentration.
    whyItMatters: These are the key metrics needed to distinguish strong durable software economics from support-heavy operational lock-in.
    diligencePath: Request cohort retention, top-10 customer share, SLA dashboards, support cost per account, and churn reason codes.
    relatedQuestionRefs:
    - QR015
    relatedTableRefs:
    - TR004
    - TR005
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: A fuller litigation, enforcement, and jurisdiction-by-jurisdiction compliance inventory covering privacy, payments, insurance, labor, and consumer-contract exposure.
    whyItMatters: The public register identifies visible legal regimes, but not every jurisdictional nuance or private dispute that may matter in diligence.
    diligencePath: Run counsel-led legal diligence with litigation search, contract review, regulator-inquiry log, and country-specific privacy/payments matrix.
    relatedQuestionRefs:
    - QR001
    - QR023
    - QR029
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: partner-contracts-and-uptime
    missingEvidence: Commercial terms, termination rights, uptime history, fallback plans, and concentration metrics for OTA, Stripe, Safely, and major marketplace partners.
    whyItMatters: Hostaway’s model depends on third parties for distribution, payments, claims, and workflow extensions, but public sources do not quantify that exposure.
    diligencePath: Request key partner agreements, uptime logs, escalation paths, redundancy plans, and revenue / usage concentration by partner.
