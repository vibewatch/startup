callouts:
- calloutType: insight
  title: Hostaway looks financially credible, but not yet fully underwriteable from public data
  body: The public record supports a real recurring-software business with strong capital access, meaningful customer scale, and monetization surfaces beyond a core PMS subscription. What it does not support is precise underwriting on ARR quality, margin structure, CAC efficiency, or runway. That gap matters more than the headline funding amounts.
  claimRefs:
  - CI011
  - CI020
  - CI021
  - CI040
- calloutType: risk
  title: Entity filings can mislead if read as group economics
  body: The Finnish Hostaway Oy filing is useful and real, but it should be handled carefully. It validates the registered entity and shows statutory data for that slice of the organization. It does not reconcile with the broader operating footprint disclosed by General Atlantic, so using it as consolidated performance evidence would produce a distorted financial picture.
  claimRefs:
  - CI022
  - CI023
  - CI024
  - CI025
- calloutType: assumption
  title: Recent capital lowers immediate financing stress but not efficiency risk
  body: Two large growth-equity rounds strongly suggest Hostaway has resources to keep investing through its roadmap. That does not prove the business is capital efficient. Investors still need burn, margin, and retention data to tell whether this is a compounding SaaS model or a support-intensive platform that must keep raising to fund growth.
  claimRefs:
  - CI011
  - CI036
  - CI037
  - CI039
