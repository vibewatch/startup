tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Core PMS / channel-manager subscription
    - Recurring platform subscription for reservations, channel sync, inbox, reporting, and owner workflows
    - Account and/or listing based
    - Visible and clearly core, but realized pricing is not public
    - Likely high-quality recurring SaaS
    - Request ARR by cohort, price waterfalls, contract length, and gross retention
  - - AI automation tools
    - Higher-value workflow automation around guest messaging, listing optimization, and operational insights
    - Per plan, bundle, or expansion module (public unit not disclosed)
    - Clearly positioned as strategic and ROI-driving
    - Potential expansion / retention lever
    - Request attach rate, standalone pricing, and impact on churn or NRR
  - - Direct-booking websites and owned-channel tooling
    - Website builder, booking engine, coupons, SEO/AI search visibility, guest portal
    - Bundle or add-on (unit not disclosed)
    - Strategically emphasized on public surfaces
    - Recurring plus ROI-linked upsell potential
    - Request attach rates, take-up by cohort, and direct-booking GMV influenced
  - - Marketplace / partner attach revenue
    - Third-party integrations and partner ecosystem monetization
    - Referral, subscription revenue-share, or platform fee (not publicly specified)
    - 200+ marketplace partners disclosed; exact economics unavailable
    - Potentially attractive but opaque
    - Request partner revenue mix, gross margin, and top-partner concentration
  - - Payments / capital / insurance
    - Flexible payment processing plus newer capital and insurance offerings
    - Transaction or financing economics not disclosed
    - Clearly referenced in financing release, commercial contribution unknown
    - Higher upside but least proven publicly
    - Request launch dates, customer adoption, underwriting / loss assumptions, and revenue contribution
  - - Implementation / onboarding services
    - Sales-led onboarding and support for professional operators
    - One-time or bundled service economics undisclosed
    - Operationally important but commercially unquantified
    - Could help adoption but dilute margins if underpriced
    - Request onboarding fees, implementation hours, and payback by customer size
  notes: The public evidence is good enough to map monetization surfaces, but not good enough to rank their present revenue contribution.
