- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / null
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR / revenue
    - 'null'
    - low
    - Core scale metric for underwriting recurring software
    - Request latest ARR, revenue, and historical growth by cohort
  - - Gross margin
    - 'null'
    - low
    - Needed to judge whether support-heavy delivery still resembles software economics
    - Request gross margin bridge including support, onboarding, and partner costs
  - - CAC / payback
    - 'null'
    - low
    - Quote-led pricing and onboarding may require meaningful sales and success spend
    - Request sales efficiency by segment, channel mix, and payback period
  - - NRR / gross retention
    - 'null'
    - low
    - Expansion thesis depends on add-ons and retention durability
    - Request NRR, logo churn, and module attach by cohort
  - - Support intensity
    - 24/7 phone support; 97%+ CSAT; multilingual global coverage
    - medium
    - Support quality can aid retention but also pressure margins
    - Request tickets per account, resolution times, and support cost per customer
  - - Customer scale proxy
    - 20,000+ property managers; 90+ countries; 200+ partners
    - medium
    - Confirms meaningful platform scale but not monetization efficiency
    - Request active paying accounts, managed properties, and ARPA by cohort
  notes: Every null row represents a real underwriting blocker, not a missing clerical detail.
