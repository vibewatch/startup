- id: capital-adequacy-and-diligence-blockers
  title: Capital adequacy and diligence blockers
  body: 'Hostaway appears well financed relative to most vertical-software peers in the category. A $175 million growth investment in 2023 followed by a $365 million strategic growth round in late 2024 signals strong access to capital, credibility with specialist software investors, and enough balance-sheet flexibility to keep funding AI, global expansion, partner attach products, and possibly acquisitions. That said, recent financing does not remove the need for cash-efficiency diligence. Public sources do not disclose cash on hand, burn, runway, debt exposure, or the revenue contribution of newer products like financing and insurance. Nor do they show whether support and onboarding intensity are compressing margins as the product broadens. The result is a split verdict: the company likely has ample near-term capacity to execute its roadmap, but the public record is still missing almost every metric an investor would need to assess revenue quality, margin durability, and the probability
    of another financing event. The next diligence layer must move from marketing and financing announcements into cohort economics, retention, and cash conversion.'
