  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: core-software-metrics
    missingEvidence: Current ARR, recognized revenue, gross margin, CAC, payback, logo churn, and NRR by cohort.
    whyItMatters: Those are the metrics that distinguish a well-capitalized but inefficient platform from a durable compounding vertical SaaS business.
    diligencePath: Request audited revenue and margin history, current ARR bridge, funnel metrics, and retention cohorts by listing-count band and geography.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI018
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: Live quotes showing Hostaway realized pricing, onboarding fees, discounts, and module pricing at comparable listing counts.
    whyItMatters: Quote-led list pricing obscures actual ACV and makes peer benchmarking unreliable if investors use only public competitor cards.
    diligencePath: Collect live quotes for 10, 50, and 250 listings from Hostaway and top peers, then normalize modules and services.
    relatedQuestionRefs:
    - QI012
    - QI021
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: cash-efficiency
    missingEvidence: Current cash balance, monthly burn, runway, debt schedule, and capital allocation by product, hiring, and M&A.
    whyItMatters: Recent financing rounds prove access to capital but not how efficiently that capital is being turned into retained recurring revenue.
    diligencePath: Request latest board deck financials, monthly cash flow, hiring plan, and downside runway scenarios.
    relatedQuestionRefs:
    - QI014
    - QI018
    - QI024
    relatedTableRefs:
    - TI004
  - type: conflicting-data
    severity: material
    topic: entity-vs-group-accounts
    missingEvidence: A clean reconciliation between Hostaway Oy statutory accounts and the broader consolidated operating group described in investor and company materials.
    whyItMatters: Without that bridge, entity filings can be over-interpreted either as hidden weakness or hidden profitability.
    diligencePath: Request entity map, intercompany structure, employee allocations, and consolidated versus statutory financial statements.
    relatedQuestionRefs:
    - QI016
    - QI017
    relatedTableRefs:
    - TI004
    - TI005
