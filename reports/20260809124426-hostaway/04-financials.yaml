- id: TI002
  title: Pricing / monetization table
  columns:
  - Company
  - Public price / unit / contract
  - List vs realized pricing
  - Discounts / unknowns
  - Source
  rows:
  - - Hostaway
    - Quote-led; intake by 2-14, 15-49, and 50+ listings; Software Advice says pricing available on request
    - List pricing is largely hidden
    - No public onboarding fee, discount ladder, or realized ACV data
    - Hostaway pricing page + Software Advice
  - - Guesty
    - Lite from $9/month on official site; third-party sources also cite ~$23/month starting point
    - Visible list pricing only at the low end; larger plans configured
    - Users report expensive add-ons and percentage-style frustration
    - Guesty pricing + GetApp
  - - Lodgify
    - Public plans roughly $14-$62/month with 7-day trial
    - Transparent list pricing for SMB buyers
    - Premium add-ons and higher-tier economics still vary
    - Lodgify pricing + GetApp
  - - Hostfully
    - Public profile describes ~$99 base plus $20/property/month, or $21/property with API
    - More explicit than Hostaway, but not a clean plan grid
    - Onboarding fee varies; packaging interpretation depends on retained profile
    - Hostfully about + pricing
  - - Hostify
    - $20/month starting price; money-back guarantee; no onboarding fees highlighted on homepage
    - Transparent low-end list pricing
    - Full plan detail and enterprise packaging remain less clear
    - Hostify review + homepage
  notes: Hostaway’s public opacity is not necessarily a weakness if it correlates with higher ACV and better retention, but that relationship cannot be tested from public evidence alone.
