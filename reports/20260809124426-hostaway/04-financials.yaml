- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact
  - Exact diligence path
  rows:
  - - Revenue / ARR by cohort
    - Cannot size current scale or benchmark valuation efficiently
    - Request monthly recurring revenue, ARR, and growth by segment and geography
  - - Gross margin by product and services
    - Cannot judge whether support and onboarding are structurally compressing margins
    - Build a gross-margin bridge separating software, support, onboarding, partner, and fintech-like products
  - - CAC / payback by segment
    - Cannot tell whether quote-led motion is efficient
    - Request funnel metrics from lead to close, segmented by listing-count band
  - - Retention / NRR / churn reasons
    - Cannot validate expansion or durability thesis
    - Request cohort retention, gross churn, NRR, and loss-code analysis
  - - Cash burn / runway
    - Cannot assess financing dependency despite big rounds
    - Request recent cash balance, monthly net burn, and downside scenario planning
  - - Attach-product contribution
    - Cannot tell whether capital, insurance, payments, AI, or direct-booking modules are material revenue contributors
    - Request product-level revenue mix, attach rates, and gross-margin contribution
  notes: This chapter intentionally separates what is public from what is still required. The missing fields are core to underwriting, not nice-to-have context.
