  - FU002
- id: named-customer-proof-and-deployment
  title: Named customer proof and deployment depth
  body: The strongest customer evidence in the retained set is the density of named production deployments, not a single hero logo. Brathay Cottages ties Hostaway to owner reporting, dynamic pricing, and automated tasks after operational pain on SuperControl. Vacationer Dubai describes a 320-listing, 29-person operation using Hostaway as the single place for listings, guest communications, owner statements, and financial reporting. Leisr says it scaled from 10 to 85 listings after adopting Hostaway, while CMHBNB claims a 5-7 day migration from Guesty and multi-market expansion across three states. MidTown, Rather Be, and Rent Live Play round out the picture with direct-booking use, remote operations, upsell monetization, and partner-integration depth. None of this proves universal customer success, but it does show Hostaway is embedded in real operator workflows across a meaningful range of customer archetypes. That is much more credible than a logo wall or isolated testimonial snippets.
  claimRefs:
  - CU012
  - CU013
  - CU015
  - CU017
  - CU020
  - CU022
  - CU025
  - CU028
  - CU029
  - CU030
