  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Public NRR, GRR, logo churn, renewal rates, cohort retention tables, and customer-tenure distributions by segment.
    whyItMatters: Without real durability metrics, it is impossible to distinguish healthy expansion from sticky-but-dissatisfied operational lock-in.
    diligencePath: Request cohort-retention schedules, NRR/GRR by listing-count band, churn reasons, and tenure distributions for the last 24 months.
    relatedQuestionRefs:
    - QU014
    - QU023
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 customer revenue share, active paying-account count, revenue by customer-size band, and renewal calendar for large accounts.
    whyItMatters: A few scaled property managers could contribute an outsized share of revenue or churn risk, but public evidence does not show concentration at all.
    diligencePath: Request customer concentration schedule, revenue by cohort, and top-account renewal timing before underwriting valuation or downside scenarios.
    relatedQuestionRefs:
    - QU015
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: A fuller census of named Hostaway customers with consistent fields for portfolio size, segment, geography, deployment depth, and recency.
    whyItMatters: The retained table is representative rather than exhaustive, so it supports pattern recognition more than market-share or segment-mix precision.
    diligencePath: Expand the customer-proof set with more case studies, independent procurement records, and customer-operated sites, then normalize them into one census.
    relatedQuestionRefs:
    - QU005
    - QU009
    - QU016
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: support-and-implementation-slas
    missingEvidence: Segmented first-response times, resolution times, implementation duration distributions, migration failure rates, and support staffing ratios.
    whyItMatters: Support quality is one of the most repeated customer themes, both positive and adverse, and it can meaningfully affect retention and cost-to-serve.
    diligencePath: Request SLA dashboards, onboarding completion metrics, escalation rates, and support cost per account by segment.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
