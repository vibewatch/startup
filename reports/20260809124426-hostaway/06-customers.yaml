company:
  name: Hostaway
chapter:
  number: 6
  title: Customers
  summary: 'Hostaway’s customer evidence is strongest where it shows real production property managers centralizing channels, owner workflows, direct booking, and integrations inside one system. The named proof set spans regional operators, remote multi-market managers, and at least one 320-listing Dubai operator, which supports a credible professional-manager ICP. Independent review evidence is broadly positive but not uniform; support quality and pricing friction still surface in adverse reviews. The key underwriting gap is durability: public evidence is rich on deployment stories and thin on retention, concentration, and cohort economics.'
sections:
- id: customer-base-and-icp
  title: Customer base and ideal-customer profile
  body: 'Hostaway’s public customer evidence points to a fairly clear ICP: professional short-term-rental operators managing multiple listings, often across channels, owners, and geographies. The pricing flow does not start with a lone host checklist; it starts with listing-count bands, and Airbnb’s partner directory explicitly describes the product as suitable from small STR/VR companies up through 1,000-plus listings. That range matters. It suggests Hostaway wants the manager who already feels channel, owner, and team complexity—not the casual single-unit hobbyist who can survive with manual processes. The named proof set reinforces this reading. MidTown, Leisr, CMHBNB, Vacationer Dubai, Rather Be, and Brathay all describe multi-property operations, owner workflows, or remote-team coordination. The customer base therefore looks broad in geography and size, but narrow in operational profile: Hostaway appears strongest when a business has already crossed the threshold where centralization,
    automation, and direct-booking infrastructure become necessary rather than nice-to-have. Even the review evidence skews toward operators thinking about scale, workflow depth, and support responsiveness, not one-off hosting convenience.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU006
  - CU007
  - CU010
  - CU011
  tableRefs:
  - TU001
  - TU002
