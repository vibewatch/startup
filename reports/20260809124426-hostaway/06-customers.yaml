figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: A typical Hostaway customer journey starts when a multi-listing operator outgrows fragmented tools and ends with deeper attachment to direct booking, reporting, AI, and integrations.
  data:
    items:
    - id: discover
      label: Discover
      actor: Founder / ops lead
      description: The buyer realizes manual channel sync, owner reporting, or guest messaging is breaking as listing count rises.
      channels:
      - Peer referrals
      - Airbnb partner directory
      - Review sites
      - Search
    - id: evaluate
      label: Evaluate
      actor: Buyer + small team
      description: The operator compares Hostaway against Guesty, Lodgify, Hostify, or older PMS tools and focuses on breadth, support, and migration confidence.
      channels:
      - Demos
      - Reviews
      - Case studies
      - Pricing intake
    - id: migrate
      label: Migrate
      actor: Ops team
      description: Onboarding, listing migration, training, and workflow setup happen; friction is highest here and support quality matters most.
      channels:
      - Onboarding sessions
      - Support
      - Documentation
      - Import workflows
    - id: operate
      label: Operate
      actor: Reservations / owner / guest teams
      description: The account centralizes channel management, messaging, reporting, owner statements, direct booking, and integrations into one system.
      channels:
      - Dashboard
      - Mobile app
      - Owner portal
      - Marketplace
    - id: expand
      label: Expand
      actor: Leadership
      description: The account adds AI, direct-booking, upsells, or deeper integrations once the PMS core is trusted enough to widen usage.
      channels:
      - AI modules
      - Direct booking
      - Integrations
      - Upsells
