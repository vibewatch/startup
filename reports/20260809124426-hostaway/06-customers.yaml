tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Typical use case
  - Public proof
  - Strategic value
  - Gap
  rows:
  - - SMB professional managers (2-14 listings)
    - Founder-operator often buys; small ops team uses; company pays
    - Centralize OTA sync, guest messaging, direct booking, and reporting before headcount scales
    - Pricing flow starts at 2-14 listings; review sites show small-business users
    - Entry wedge and future expansion pool
    - No public conversion or churn data by listing cohort
  - - Scaling property managers (15-49 listings)
    - Operations lead / founder buys; team, cleaners, and owner-facing staff use
    - Need owner statements, multi-unit workflows, automation, and integrations
    - Pricing flow has a 15-49 band; named customers like Rather Be and CMHBNB fit this pattern
    - Likely sweet spot for upsells and direct-booking attach
    - No public ARPA or attach-rate disclosure
  - - Larger managers (50+ listings)
    - Ops / revenue / finance leadership buys; broader team uses
    - Need centralized workflow across multiple channels, owners, and markets
    - Pricing flow has 50+ path; MidTown, Leisr, and Vacationer show scaled use cases
    - Higher ACV potential and more pain-driven retention
    - No public enterprise win-rate or support-cost data
  - - Enterprise-style / customized accounts
    - Commercial team buys; cross-functional users operate inside platform
    - Customized solutions, deadlines, budget control, and dense partner ecosystems
    - G2 seller text references enterprise customers and custom solutions
    - Potentially highest-value customers
    - No public case-level contract sizes or renewal terms
  - - Owned-channel-forward operators
    - Marketing / founder buys; reservations and guest teams use
    - Run direct-booking sites, SEO, guest data capture, and repeat-stay plays
    - 2026 report plus MidTown, Vacationer, Rather Be, and Rent Live Play direct-booking sites
    - Important expansion vector beyond core PMS
    - No public direct-booking GMV or attach by cohort
  - - Integration-heavy remote operators
    - Founder / ops buyer; distributed team uses
    - Combine PMS core with locks, CRM, pricing, security, and partner tools
    - Rent Live Play and Leisr stories emphasize integrations and remote ops
    - Deep embedding raises switching costs
    - No public uptime or support SLA by integration complexity
  notes: Segment definitions are inferred from listing-count bands, review demographics, partner listings, and named operator stories rather than from a disclosed customer census.
