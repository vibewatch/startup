  - TU003
  figureRefs:
  - FU003
- id: satisfaction-retention-and-switching
  title: Satisfaction, retention, and switching friction
  body: 'The review evidence is directionally positive but not clean. G2 and Software Advice both show strong aggregate satisfaction and many reviews praising channel integration, automation, reporting, and support. Those sources also surface buyers who explicitly moved to Hostaway for more professional multi-unit functionality and better owner reporting. At the same time, Trustpilot adds meaningful adverse evidence: long wait times, ignored tickets, billing friction, perceived price increases, and several users threatening or beginning to switch. Importantly, those adverse reviews do not eliminate switching-cost evidence—they sharpen it. One reviewer explicitly says changing channel managers is difficult and time-consuming, and the case-study set repeatedly frames PMS selection as a decision operators do not want to reverse. The result is a nuanced durability picture: operational embedding and customer satisfaction appear real, but there is still no public retention math robust enough to
    separate sticky success from costly lock-in.'
  claimRefs:
  - CU008
  - CU009
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
  - CU036
  - CU037
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-and-concentration
  title: Expansion potential and concentration unknowns
  body: 'Hostaway’s customer expansion logic looks plausible even though the public evidence stops short of proving durable revenue compounding. The 2026 operator report shows why the wedge exists: larger operators are adopting AI faster, owned-channel maturity is still weak across the market, and direct-booking playbooks remain underdeveloped. Named customer stories suggest Hostaway can grow from core PMS usage into direct-booking sites, owner portals, integrations, mobile-app usage, and even upsell monetization. Rather Be’s upsell revenue story is the clearest attach example. But concentration risk remains almost entirely opaque. The retained evidence does not show top-customer revenue share, active paying account concentration, NRR by cohort, or even a reliable public count of current paying operators. That means the commercial story is strong on customer-story density and weak on portfolio economics. Investors can reasonably believe Hostaway has expandable customers; they still cannot
    publicly verify how concentrated, durable, or efficiently monetized that customer base is.'
  claimRefs:
