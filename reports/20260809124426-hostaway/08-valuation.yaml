- id: final-diligence-and-thesis-breakers
  title: Final diligence and thesis-breakers
  body: 'The diligence agenda is straightforward and non-optional. First, investors need consolidated financials that reconcile group revenue, burn, and margins against the narrow Opco filing. Second, they need cohort durability data—NRR, GRR, logo churn, attach rates, and loss reasons—so they can tell whether workflow depth is producing healthy expansion or just sticky complexity. Third, they need partner and support evidence: OTA contract dependence, Stripe economics, insurance claims outcomes, uptime history, and SLA distributions. Those asks are not cleanup items; they determine whether Hostaway merits a premium multiple or simply deserves watchlist status. The thesis breaks if private data reveals weak retention, meaningful concentration, severe support-cost inflation, or partner fragility that turns growth into operational burden. Until then, the most disciplined public-evidence stance is: high-quality company, attractive market position, unresolved price.'
  claimRefs:
  - CV036
  - CV037
  - CV038
  - CV039
