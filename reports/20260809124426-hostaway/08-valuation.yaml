    - Lower multiple reflects broader public travel exposure, not Hostaway-like software quality
  - - HubSpot
    - ~$10.5B market cap; $3.13B 2025 revenue
    - ~3.4x market-cap / sales proxy
    - Owned-channel, marketing, CRM expansion analogue
    - Not travel-specific; current public multiple also reflects its own cycle
