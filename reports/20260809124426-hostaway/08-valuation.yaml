callouts:
- calloutType: insight
  title: Hostaway looks investable in quality terms, not obviously investable in price terms
  body: The public record is strong enough to treat Hostaway as a serious late-stage asset. It is not strong enough to justify paying materially above the current unicorn floor without private confirmation of revenue quality, retention, and support scalability.
  claimRefs:
  - CV022
  - CV030
  - CV031
  - CV040
- calloutType: risk
  title: The Opco filing is useful and dangerous at the same time
  body: The Hostaway Opco filing gives a real statutory data point—revenue, loss, equity ratio, headcount—but it cannot be used as a clean proxy for consolidated group economics. Investors who over-read it in either direction will misprice the asset.
  claimRefs:
  - CV006
  - CV007
  - CV028
  - CV036
- calloutType: assumption
  title: Upside exists, but it is gated by proof of durable monetization
  body: The bull case depends on Hostaway converting product breadth into clean retention and attach-rate economics. Until those metrics are disclosed, the scenario upside is a justified possibility, not a bankable base case.
  claimRefs:
  - CV021
  - CV032
  - CV034
  - CV037
