company:
  name: Hostaway
chapter:
  number: 8
  title: Valuation
  summary: Hostaway’s public evidence supports a high-quality late-stage vertical-software asset with real category leadership, strong sponsor backing, and credible product/customer depth. It does not support a high-conviction buy above the current unicorn floor without private disclosure on consolidated economics, retention, support scalability, and cap-table structure. The right public-evidence stance is track / research more, with upside available if private metrics validate the premium story.
sections:
- id: recommendation-and-core-thesis
  title: Recommendation and core thesis
  body: Hostaway deserves serious investor attention because the public record supports a real category leader, not a promotional shell. The company has raised unusually large rounds for its niche, attracted top-tier growth investors, crossed the unicorn threshold, and shows meaningful product, customer, and partner breadth. The qualitative case is therefore strong. The problem is price discipline. Public evidence does not give investors the consolidated revenue, NRR, GRR, support-cost structure, or gross-margin proof needed to underwrite a clean buy at or above the current unicorn mark. That matters because Hostaway’s story already carries premium expectations around AI, direct booking, and continued international growth. The public case supports tracking closely, leaning in on diligence, and being willing to pay for quality once the missing metrics are provided. It does not support pretending that a high-quality company automatically equals an attractive entry. The recommendation here
    is therefore track / research more with medium confidence and a valuation stance best described as quality-rich but still evidence-thin.
  claimRefs:
  - CV001
  - CV002
  - CV008
  - CV018
  - CV024
  - CV030
  - CV031
  - CV040
  tableRefs:
  - TV001
