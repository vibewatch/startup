  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Hostaway should be analyzed as an operating-software vendor inside the short-term-rental ecosystem, not as
              a proxy for the full booking market. Its product scope lives in the control layer that synchronizes
              channels, automates guest operations, supports direct booking, and increasingly handles reporting and
              compliance work. That means the relevant market boundary starts with PMS, channel management, automation,
              messaging, pricing, reporting, and direct-booking infrastructure. It excludes the gross booking value of
              accommodation nights themselves, which is the demand pool that creates pain for operators but is not the
              revenue pool Hostaway can directly monetize. The adjacent surfaces still matter because they shape
              buy-versus-build decisions and route economics. Google Vacation Rentals, for example, matters as a
              direct-booking and metasearch channel rather than a substitute PMS. The strongest status-quo alternatives
              are manual workflows, spreadsheets, stacked point tools, or an OTA-first operating approach. That framing
              is important because it prevents a common analytical mistake: calling the entire vacation-rental market
              Hostaway's TAM when the company actually sells the software that helps professional operators manage that
              market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
