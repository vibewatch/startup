            body: >-
              The adverse evidence points to a competitive market where Hostaway is well positioned but far from
              insulated. Guesty carries the strongest public scale signal and the broadest segment span, yet review
              sources repeatedly surface pricing and support frustration. Lodgify is attractive at the bottom end
              because its free-trial and low-price motion lowers switching barriers, but the same review sources show
