  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - What would change the view
    rows:
      - - >-
          Hostaway looks like a genuine category leader with elite backers, real customer proof, OTA partnerships, and
          credible AI/direct-booking upside.
        - >-
          Confirmed NRR >110, strong gross margins, and durable attach-rate expansion would strengthen the thesis
          materially.
      - - >-
          The public record is too thin on consolidated economics, retention, and support-cost structure to justify a
          confident buy at or above the unicorn mark.
        - A lower entry price or stronger private disclosures would weaken the anti-thesis.
      - - Workflow depth and partner breadth may create a durable moat for scaled property managers.
        - Evidence that customers can switch easily or that partners are unreliable would damage this view.
      - - >-
          Competition is real and valuation discipline matters because alternatives can pressure support-sensitive or
          price-sensitive cohorts.
        - >-
          Clear proof that Hostaway wins and retains higher-value cohorts at superior economics would reduce this
          concern.
    notes: The anti-thesis is about price and evidence sufficiency, not about the company being low quality.
