      - number: '7.2'
        title: Operational, security, and service-consistency risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk at Hostaway looks less like catastrophic product implosion and more like complex workflow
              variance. The company publicly documents meaningful mitigations: required 2FA, granular permissions,
              guest-portal timing controls, and automatic hiding of codes and Wi-Fi after checkout. Those are good
              signs. But the same documentation also makes clear how many sensitive decisions must be configured
              correctly by customers or admins. Admin-level permissions grant broad visibility; active-stay portals
              deliberately surface access codes and payment details; authentication depends on SMS and magic-link
              reliability; and distributed teams need onboarding that lands correctly the first time. The review record
              shows how this can go wrong. Trustpilot complaints describe slow support, billing disputes, and
              frustrating post-sale experiences, while G2 and Software Advice show that the same product can feel
              excellent when onboarding and support are responsive. The risk is therefore not ‘no controls’—it is
              inconsistent execution on top of a complex control surface. That can still be financially material if
              customers depend on Hostaway for daily operations.
            claimRefs:
