  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Durability miss
        - Private NRR below 100 or weak GRR once disclosed
        - Undercuts premium-software narrative
        - Move to pass or demand deep price reset
      - - Support cost blowout
        - SLA deterioration plus rising support intensity
        - Turns workflow depth into margin drag
        - Reduce valuation range and confidence
      - - Partner fragility
        - Meaningful OTA, Stripe, or insurance dependency failure
        - Undermines operating-system thesis
        - Re-rate downside and reassess moat
      - - Concentration risk
        - Top-customer exposure materially higher than expected
        - Makes growth and renewal base fragile
        - Demand structural discount
      - - Privacy or security event
        - Material regulator inquiry or confirmed guest-data incident
        - Damages trust and raises legal burden
        - Pause investment or require remediation proof
    notes: These are the events most likely to change the call after deeper diligence.
    claimRefs:
      - CV038
      - CV039
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Consolidated financials
        - Group revenue, gross margin, burn, and cash runway
        - Needed to bridge from qualitative strength to price support
        - Finance diligence with management and data room
      - - Cohort durability
        - NRR, GRR, logo churn, attach rates, and churn reasons
        - Key test of whether expansion modules truly create enterprise value
        - Revenue operations / FP&A diligence
      - - Support scalability
        - SLA distributions, staffing ratios, ticket load, escalation rates
        - Needed to assess whether product breadth is economically sustainable
        - Support leadership and operations diligence
      - - Partner dependence
        - OTA, Stripe, insurance, and marketplace contract terms plus uptime history
        - Core to moat quality and downside risk
        - Business development / legal diligence
      - - Valuation mechanics
        - Latest cap table, preference stack, dilution, secondary / primary mix
        - Determines whether current price is investable even if business quality is high
        - Corporate finance and legal diligence
      - - International compliance
        - Privacy, data-transfer, and jurisdictional control stack
        - Needed to convert legal risk from narrative to measurable exposure
        - Legal / security diligence
    notes: Every ask here is decision-critical; none are cosmetic.
    claimRefs:
      - CV036
      - CV037
      - CV038
