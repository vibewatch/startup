      - number: '8.4'
        title: Final diligence and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The diligence agenda is straightforward and non-optional. First, investors need consolidated financials
              that reconcile group revenue, burn, and margins against the narrow Opco filing. Second, they need cohort
              durability data—NRR, GRR, logo churn, attach rates, and loss reasons—so they can tell whether workflow
              depth is producing healthy expansion or just sticky complexity. Third, they need partner and support
              evidence: OTA contract dependence, Stripe economics, insurance claims outcomes, uptime history, and SLA
              distributions. Those asks are not cleanup items; they determine whether Hostaway merits a premium multiple
              or simply deserves watchlist status. The thesis breaks if private data reveals weak retention, meaningful
              concentration, severe support-cost inflation, or partner fragility that turns growth into operational
              burden. Until then, the most disciplined public-evidence stance is: high-quality company, attractive
              market position, unresolved price.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
          - type: table
            tableRef: TV005
            claimRefs:
              - CV038
              - CV039
          - type: table
            tableRef: TV006
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Hostaway looks investable in quality terms, not obviously investable in price terms
            body: >-
              The public record is strong enough to treat Hostaway as a serious late-stage asset. It is not strong
              enough to justify paying materially above the current unicorn floor without private confirmation of
              revenue quality, retention, and support scalability.
            calloutType: insight
            claimRefs:
              - CV022
              - CV030
              - CV031
              - CV040
          - type: callout
            title: The Opco filing is useful and dangerous at the same time
            body: >-
              The Hostaway Opco filing gives a real statutory data point—revenue, loss, equity ratio, headcount—but it
              cannot be used as a clean proxy for consolidated group economics. Investors who over-read it in either
              direction will misprice the asset.
            calloutType: risk
            claimRefs:
              - CV006
              - CV007
              - CV028
              - CV036
          - type: callout
            title: Upside exists, but it is gated by proof of durable monetization
            body: >-
              The bull case depends on Hostaway converting product breadth into clean retention and attach-rate
              economics. Until those metrics are disclosed, the scenario upside is a justified possibility, not a
              bankable base case.
            calloutType: assumption
            claimRefs:
              - CV021
              - CV032
              - CV034
              - CV037
