            body: >-
              The strongest technical evidence in the public record comes from Hostaway’s developer documentation rather
              than its marketing copy. The docs show a genuine partner and builder surface: a public API for in-house
              software, API keys tied to explicit partner designations, long-lived but renewable tokens, unified
              webhooks with granular event subscriptions, and handling for tricky payment flows where API partners and
              OTAs may already have collected part of the reservation balance. That matters because real operational
