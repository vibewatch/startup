              base: 24/7 phone support, onboarding, multilingual coverage, partner management, and continued AI
              development all require sustained investment. The most confusing public datapoint is the Finnish entity
              filing. Asiakastieto shows Hostaway Oy with 0 employees and roughly €1.3 million operating loss in 2025,
