      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buying center for Hostaway-style software changes with portfolio size. Small hosts often act as buyer,
              user, and payer simultaneously, but the economics become more specialized once an operator manages dozens
              of listings across multiple OTAs. Mid-market managers care most about channel sync, cleaner execution,
              rate management, reporting, and basic direct-booking capability because even moderate scale makes manual
              reconciliation expensive. Larger operators add formal budget owners in revenue management, operations,
              finance, and compliance because the pain shifts from simple booking sync to system-wide throughput and
              margin protection. The 2026 evidence points to a market where professional managers are pulling away from
              casual hosts: operators managing 100-plus listings are adopting AI faster, using more sophisticated
              pricing discipline, and materially outperforming individuals on revenue. Direct bookings remain
              underdeveloped, but that weakness arguably increases the value of vendors that help operators diversify
              demand without losing operational control. Multi-channel distribution complexity also matters; once a
              manager must reconcile multiple OTA feeds, cleaning calendars, fees, and local rules, the software
              purchase stops being a convenience and becomes operating infrastructure.
