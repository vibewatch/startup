      - number: '1.2'
        title: Founders, leadership visibility, and remote-first operating model
        blocks:
          - type: paragraph
            body: >
              The founder story is unusually consistent across official and third-party coverage. Hostaway was launched
              in 2015 by Marcus Räder, Saber Kordestanchi, and Mikko Nurminen after they identified a structural gap
              between fast-growing online travel agencies and the fragmented back-office tooling available to property
              managers trying to operate across them. Marcus Räder is the dominant public executive voice and is
              consistently identified as CEO and co-founder; TechCrunch described Saber Kordestanchi as CSO in 2024,
              while Mikko Nurminen remained the co-founder most visibly tied to fundraising, culture, and early scaling
              commentary in external interviews. Leadership continuity is also a visible theme: both the 2023 PSG
              announcement and the 2024 General Atlantic/PSG announcement explicitly said the management team would
              remain unchanged after those financings. Equally important, Hostaway’s organizational design is part of
              the thesis. Marcus Räder’s later comments and the anniversary coverage describe a remote-first, globally
              distributed structure that gave the company early balance across North America and Europe and later
              allowed it to concentrate hiring where growth required it. Public scale signals are coherent here:
              official 2024 financing materials said the company had more than 230 employees across 44 countries, while
              2025 anniversary coverage said the workforce had more than doubled over two years and that every employee
              received equity. What remains much less visible is governance depth. Public materials do not surface a
              detailed current board roster, committee structure, or ownership breakdown, so investors should treat
              leadership visibility as high around the founders but lower around the broader control framework.
