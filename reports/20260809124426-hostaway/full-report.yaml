        title: Revenue model and monetization surfaces
        blocks:
          - type: paragraph
            body: >-
              Hostaway’s public materials support a vertical-software revenue model rather than a marketplace or
              merchant model. The company sells an all-in-one operating platform for short-term-rental managers and then
              layers high-value workflow modules on top: channel management, AI-powered communication, direct-booking
              websites, analytics, owner reporting, and integrations. The pricing surface is deliberately sales-led.
              Instead of publishing a self-serve plan grid, Hostaway first segments prospects by listing count, which is
              consistent with a contract structure that scales with operator complexity and likely blends base
              subscription logic with per-listing or bundle-based economics. The financing releases also matter because
              they show Hostaway expanding beyond core SaaS into payments-adjacent and risk-adjacent products such as
              Hostaway Capital and Hostaway Insurance. That does not prove those newer products are materially
              contributing to revenue today, but it does show management is building more monetization surfaces than a
              narrow PMS fee. The likely economic picture is therefore recurring core subscription revenue with a
              still-unquantified expansion layer around AI, direct-booking, payments, financing, insurance, and partner
              attach products.
