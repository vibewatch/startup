      - number: '7.3'
        title: Partner and model-dependency risk
        blocks:
          - type: paragraph
            body: >-
              Hostaway’s business is deeply intertwined with third parties, and that is simultaneously its strength and
              its fragility. OTA connectivity is central to the value proposition, so Airbnb and Expedia rule changes,
              API instability, or partner-status shifts can damage the customer experience even when Hostaway itself is
              functioning. Payment flows rely on infrastructure like Stripe Connect, which reduces Hostaway’s need to
              build global KYC, sanctions, PCI, and tax systems from scratch but concentrates dependency on a single
              regulated counterparty. Insurance depends on Safely and is only partially available to the customer base.
              Marketplace partners touch guest messaging, locks, pricing, CRM, and direct-booking workflows. The
              customer case studies make the exposure concrete: once operators centralize bookings, payments, owner
              reporting, locks, or upsells in Hostaway, a partner failure is no longer peripheral. It becomes
              revenue-affecting. The biggest public blind spot is that Hostaway does not disclose partner contract
              terms, uptime histories, or counterparty concentration metrics, so the residual dependency risk has to be
              inferred rather than measured.
