              - CV017
      - number: '8.3'
        title: Scenario ranges and expected value
        blocks:
          - type: paragraph
            body: >-
              Because the public record is incomplete, the only honest approach is scenario work rather than false
              precision. In the bull case, Hostaway proves strong cohort retention, clean support scalability, and
              meaningful monetization of AI, direct-booking, and adjacent fintech-style modules. Under that set of
              assumptions, a valuation meaningfully above the unicorn floor is reasonable and sponsor-to-sponsor upside
              remains intact. The base case is more conservative: Hostaway is indeed a category winner, but private
              economics arrive as good rather than great, justifying a modest premium to the current floor rather than a
              step-change re-rating. The bear case is not a collapse in company quality; it is a repricing in which
              support variance, partner dependence, competition, or weak durability metrics compress the asset back
              below its current narrative premium. The expected value of those scenarios still leans positive because
              the company looks real and strategically relevant. But the margin of safety is too thin for a confident
              buy call unless price moves or private metrics improve conviction.
            claimRefs:
              - CV009
              - CV010
              - CV021
              - CV022
              - CV023
              - CV032
              - CV033
              - CV034
              - CV035
