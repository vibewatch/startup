      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer proof is real, but it is concentrated in vendor-authored narratives
            body: >-
              Hostaway has more named production stories than many comparable software vendors, and several are specific
              enough to be useful. But the strongest public proof still comes from Hostaway-authored case studies rather
              than audited cohort metrics or independent renewal data.
            calloutType: insight
            claimRefs:
              - CU011
              - CU012
              - CU015
              - CU017
              - CU036
          - type: callout
            title: The retention story is still mostly inferred
            body: >-
              Review strength, multi-module usage, and migration pain all suggest durability. None of that substitutes
              for NRR, GRR, logo-churn, support-SLA, or top-customer concentration data. Investors should treat customer
              quality as directionally positive but not yet underwriteable from public evidence alone.
            calloutType: risk
            claimRefs:
              - CU033
              - CU034
              - CU036
              - CU037
          - type: callout
            title: Hostaway likely wins when customer complexity outruns simpler tools
            body: >-
              The best-fit users in the retained evidence are operators who need owner reporting, multi-channel sync,
              integrations, remote-team coordination, and direct-booking growth. That does not prove Hostaway wins every
              segment; it does suggest the core value increases sharply after the buyer has moved beyond hobbyist scale.
            calloutType: assumption
