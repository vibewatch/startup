        title: Product scope and customer jobs
        blocks:
          - type: paragraph
            body: >-
              Hostaway is not one feature. It is a broad operating system for short-term-rental managers. The platform’s
              public surfaces consistently group together channel management, reservation handling, AI-driven messaging,
              dynamic pricing, owner reporting, direct booking, and integrations into one operating workflow. That
              matters because the product is designed around the daily job of a professional manager, not the isolated
              needs of a casual host. The channel manager sits at the center, keeping availability and pricing aligned
              across OTAs and direct-booking surfaces. Around that core, Hostaway layers an increasingly commercial
              front end—website builder, SEO, marketing, guest portals—and an increasingly intelligent operational layer
              via AI CoHost. The result is a product map that starts with distribution control, expands into
              communication and operational automation, and then reaches into demand generation and owner/financial
              workflows. This breadth explains both why customers can centralize work inside Hostaway and why switching
              can become painful once multiple teams, owners, and partners depend on the same system.
