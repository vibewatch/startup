      - number: '7.4'
        title: Execution, competition, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Execution risk matters because Hostaway is no longer just a channel manager. It is trying to be the
              operating system for professional STR managers, with AI, direct booking, reporting, insurance, and partner
              ecosystems layered on top. That scope creates upside, but it also raises the standard for support,
              migration quality, ROI proof, and internal coordination. The independent market summary and Hostaway’s own
              report both suggest customers are under pressure: competition is up, marketing spend is rising, AI
              expectations are climbing, and direct bookings remain hard. If Hostaway cannot consistently help customers
              monetize those newer surfaces, then product breadth turns from moat narrative into support burden.
              Competitive review data sharpens the downside: buyers have alternatives with better value or cleaner
              support stories. The core thesis only really breaks if support variance worsens, privacy or permissions
              failures become public, partner outages drive customer churn, or public durability metrics—once
              disclosed—show that deep workflow embedding is not translating into healthy retention and expansion.
