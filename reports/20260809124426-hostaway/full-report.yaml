              direct-booking sites, owner portals, integrations, mobile-app usage, and even upsell monetization. Rather
              Be’s upsell revenue story is the clearest attach example. But concentration risk remains almost entirely
              opaque. The retained evidence does not show top-customer revenue share, active paying account
              concentration, NRR by cohort, or even a reliable public count of current paying operators. That means the
              commercial story is strong on customer-story density and weak on portfolio economics. Investors can
              reasonably believe Hostaway has expandable customers; they still cannot publicly verify how concentrated,
              durable, or efficiently monetized that customer base is.
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU026
