  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Hostaway’s most visible legal risk is not some exotic edge case; it is the ordinary but serious burden of
              handling sensitive guest, booking, and payment data across a global, integration-heavy workflow. The
              privacy policy is unusually explicit that Hostaway acts as controller for website and service activity and
              processes names, contact details, bookings, payments, reviews, messages, and tasks. That creates direct
              exposure to GDPR and, where applicable, California privacy law. The regulatory issue is not merely
              abstract compliance paperwork. A platform that combines marketplace sharing, international transfers,
              guest communications, and financial records creates multiple failure points for notice, consent, access,
              deletion, correction, restriction, and breach handling. Hostaway does show governance signals—a DPO
              contact, complaint rights, and legal-resource pages—but the public record remains much stronger on the
              existence of obligations than on independently verifiable assurance artifacts. For investors, that means
              privacy exposure is both one of the most obvious risks and one of the hardest to underwrite from public
              disclosure alone.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR036
