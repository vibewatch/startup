companyProfile:
  summary: >-
    Hostaway is a Helsinki-headquartered, remote-first property-management software platform founded in 2015 by Marcus
    Räder, Saber Kordestanchi, and Mikko Nurminen. The company sells an all-in-one operating system for professional
    short-term-rental managers that combines PMS, channel management, messaging, reporting, direct booking, owner
    workflows, integrations, and newer AI, pricing, capital, and insurance surfaces. Public evidence supports broad
    international reach, meaningful customer adoption, and unusual access to growth capital via PSG and General
    Atlantic. The business appears strategically strong and commercially relevant, but consolidated economics remain
    under-disclosed relative to its late-stage valuation narrative.
