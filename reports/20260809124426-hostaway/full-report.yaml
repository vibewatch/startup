      - number: '8.2'
        title: Valuation context and comparable frame
        blocks:
          - type: paragraph
            body: >-
              The financing context is impressive. PSG entered in 2023 with a $175M investment, General Atlantic led a
              $365M strategic growth investment in late 2024, and Hostaway says it crossed a $1B valuation threshold in
              2025. Those are real signals of sponsor confidence and market appetite. They are not, by themselves, proof
              that a new investor should pay materially above the current mark. The comparable set reinforces the need
              for caution. Travel marketplaces like Airbnb, Booking, and Expedia offer useful public valuation anchors
              but are structurally different from Hostaway’s narrower vertical-software profile. HubSpot is more
              relevant for owned-channel and marketing-stack logic, but it is not travel-specific. The result is a
              useful but imperfect proxy range rather than a precise answer. Meanwhile, the Hostaway Opco filing
              introduces additional ambiguity: it offers real local financial data, but not a consolidated picture of
              group economics. Taken together, the right frame is not ‘What is the exact fair value?’ but ‘What premium
              above the current floor is justified by evidence we can actually see?’
            claimRefs:
              - CV003
              - CV004
              - CV005
