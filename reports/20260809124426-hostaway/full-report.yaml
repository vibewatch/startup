chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and customer footprint
        blocks:
          - type: paragraph
            body: >
              Hostaway positions itself as an all-in-one vacation-rental operating platform rather than a narrow
              listing-sync tool, and the current public record broadly supports that framing. The homepage, 2024 and
              2025 company announcements, and third-party product directories consistently describe a unified software
              layer for short-term-rental owners and professional managers covering property management, channel
              management, messaging, automation, reporting, payments, direct-booking tooling, and open integrations.
              Official materials say the platform offers deep OTA connectivity across Airbnb, Vrbo, Booking.com,
              Expedia, TripAdvisor, Marriott, Google Travel, and other channels, with Hostaway acting as the control
              layer that synchronizes listings, reservations, pricing, and guest communication. The scale language is
              directionally strong even if not perfectly stable: Hostaway says it serves thousands of active customers;
              official funding materials anchor those customers in over 90 countries, earlier company language
              referenced over 100 countries, and anniversary coverage later described more than 100 markets. That
              variance does not undermine the core conclusion that Hostaway is a global product rather than a regional
              niche vendor, but it does mean the exact current footprint should be confirmed in management diligence
              rather than assumed from marketing copy alone. The platform’s addressable customer set also spans from
              hosts with a handful of properties to enterprise managers with hundreds or thousands of listings, which
              matters because it frames Hostaway as a scaling software layer for professionalization rather than merely
              a prosumer tool.
