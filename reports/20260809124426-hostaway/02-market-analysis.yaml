callouts:
- calloutType: insight
  title: Hostaway benefits from market complexity more than from raw travel volume
  body: The most useful public insight is not that vacation rentals are a huge travel category; it is that the operational software slice stays small, specialized, and increasingly valuable as professional operators widen their lead and compliance burdens rise. That is a much better fit for a vertical SaaS underwriting frame than a marketplace-take-rate frame.
  claimRefs:
  - CM006
  - CM017
  - CM035
  - CM043
- calloutType: risk
  title: Regulation is a double-edged sword for Hostaway
  body: The 2026 EU framework and local city rules make compliance tooling more valuable, but they can also shrink the number of legal operators in the most supply-constrained urban markets. The net effect should be positive only if Hostaway skews toward professional, compliant customers rather than casual hosts most exposed to bans or permit loss.
  claimRefs:
  - CM020
  - CM021
  - CM024
  - CM042
- calloutType: assumption
  title: Public software TAM is too noisy to support a single precise SAM or SOM number
  body: The reviewed software-market estimates are useful as bounding evidence, but publisher quality and market definitions vary enough that investors should request internal ARR by segment, average contract value, managed-property counts, and retention by cohort before treating any external software TAM figure as decision-grade.
  claimRefs:
  - CM013
  - CM014
  - CM015
  - CM016
  - CM025
