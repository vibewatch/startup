company:
  name: Hostaway
chapter:
  number: 2
  title: Market Analysis
  summary: Hostaway operates in a large and still-growing short-term-rental ecosystem, but its true market is the far smaller software and workflow layer that helps professional operators manage distribution, direct booking, pricing, guest operations, and compliance. Public 2026 estimates for broad stay spend range from roughly USD 106.5 billion to USD 165.7 billion, while software-focused estimates fall between about USD 440 million and USD 1.06 billion. The market is being reshaped by operator professionalization, AI adoption, direct-booking underperformance, and the May 2026 EU registration/data-sharing regime. Those forces generally strengthen the case for centralized PMS vendors like Hostaway, but exact public SAM and SOM remain too noisy to quantify precisely without private company data.
sections:
- id: market-boundary-and-substitutes
  title: Market boundary, included spend, and substitutes
  body: 'Hostaway should be analyzed as an operating-software vendor inside the short-term-rental ecosystem, not as a proxy for the full booking market. Its product scope lives in the control layer that synchronizes channels, automates guest operations, supports direct booking, and increasingly handles reporting and compliance work. That means the relevant market boundary starts with PMS, channel management, automation, messaging, pricing, reporting, and direct-booking infrastructure. It excludes the gross booking value of accommodation nights themselves, which is the demand pool that creates pain for operators but is not the revenue pool Hostaway can directly monetize. The adjacent surfaces still matter because they shape buy-versus-build decisions and route economics. Google Vacation Rentals, for example, matters as a direct-booking and metasearch channel rather than a substitute PMS. The strongest status-quo alternatives are manual workflows, spreadsheets, stacked point tools, or an OTA-first
    operating approach. That framing is important because it prevents a common analytical mistake: calling the entire vacation-rental market Hostaway''s TAM when the company actually sells the software that helps professional operators manage that market.'
