- id: sizing-lenses-and-definition-noise
  title: Sizing lenses, contradictory estimates, and what they imply
  body: 'Public market sizing is directionally useful but methodologically noisy. The broadest stay-spend estimates place global vacation-rental or short-term-rental activity in a 2026 range from roughly USD 106.5 billion to USD 165.7 billion, with Mordor and Precedence landing between those bounds. Those figures are helpful for understanding category importance and travel demand, but they still overstate Hostaway''s served market because Hostaway does not earn a take rate on lodging spend. The more relevant software and platform estimates are much smaller and much messier: reviewed 2026 software-layer figures range from roughly USD 440 million to USD 1.06 billion, depending on whether the publisher defines the market as full property-management software, vacation-rental platforms, or end-to-end operational tooling. That gap is too wide to treat any single number as ground truth. The correct interpretation is not that the market is unknowable, but that broad travel GMV and the software layer
    must be separated. Hostaway''s thesis depends on workflow complexity, professionalization, and attachable software spend within a large travel category, not on directly capturing the gross value of every stay booked through Airbnb, Vrbo, or Booking.com.'
