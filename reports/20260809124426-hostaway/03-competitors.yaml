callouts:
- calloutType: insight
  title: The field is crowded at the core, segmented at the edges
  body: The durable competitive question is not who has a PMS, channel manager, or direct-booking site. It is which vendor can win and retain each cohort more efficiently. Hostaway appears strongest in the middle of the market where buyers want serious workflow depth without the full complexity or cost signature of the heaviest enterprise stacks.
  claimRefs:
  - CP028
  - CP029
  - CP033
  - CP039
- calloutType: risk
  title: Partner badges are necessary, not proprietary
  body: Hostaway's 2026 triple-crown matters, but Airbnb's own partner directory shows several credible peers in the same ecosystem. If investors mistake badge parity for exclusive distribution control, they will overstate Hostaway's moat and underweight price, onboarding, and retention competition.
  claimRefs:
  - CP001
  - CP004
  - CP027
  - CP042
- calloutType: assumption
  title: Public pricing clarity is a real go-to-market differentiator
  body: The evidence suggests Lodgify and Hostify make quick SMB comparison easier than Hostaway or Avantio, while Hostfully sits somewhere in between. That does not prove Hostaway loses on price, but it does mean the company needs support, implementation, or reliability advantages strong enough to overcome extra buying friction.
  claimRefs:
  - CP003
  - CP013
  - CP020
  - CP023
  - CP025
  - CP041
