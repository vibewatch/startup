- id: durability-and-adverse-evidence
  title: Durability and adverse evidence
  body: 'The adverse evidence points to a competitive market where Hostaway is well positioned but far from insulated. Guesty carries the strongest public scale signal and the broadest segment span, yet review sources repeatedly surface pricing and support frustration. Lodgify is attractive at the bottom end because its free-trial and low-price motion lowers switching barriers, but the same review sources show synchronization and support friction. Hostfully looks like the closest like-for-like workflow rival to Hostaway, though its economics and exact packaging remain less standardized than its product breadth. Hostify can credibly win on value and service but has much thinner public scale evidence. Avantio appears well aligned with larger agencies, especially outside the smallest-host cohort, but its public pricing is sparse. The underwriting implication is straightforward: Hostaway probably wins when buyers value reliability, partner quality, support, and balanced feature depth, yet the
    category is still vulnerable to price pressure and commoditization in SMB and lower-midmarket cohorts. Precise win-rate, churn, and funding comparisons still require private diligence.'
