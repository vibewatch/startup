- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company
  - Public price / unit / model
  - Included capabilities signal
  - Unknowns / caveats
  - Implication
  rows:
  - - Hostaway
    - Quote-led; listing-count intake for 2-14, 15-49, and 50+ listings; Software Advice says pricing available on request
    - AI messaging, channel manager, direct booking, owner statements, support
    - No clean self-serve rate card or public implementation-cost standard
    - Flexible for larger accounts but less favorable to fast price-shopping SMB buyers
  - - Guesty
    - $9/mo Lite on official site; third-party summaries cite about $23/mo starting point; Pro and Enterprise are configured offers
    - Lite covers Airbnb / Vrbo / Booking.com sync and inbox; Pro adds 60+ channels, owners portal, revenue tools; Enterprise adds security and advanced reporting
    - Users report add-on fees and higher effective cost at scale
    - Can land small users, but price objections remain an active sales risk
  - - Lodgify
    - $14-$62/mo public plans; 7-day free trial
    - Channel manager, website builder, booking engine, payments, messaging, tasks, owner reporting on higher tiers
    - Premium capabilities and add-ons still increase total cost
    - Very strong self-serve acquisition motion for small operators
  - - Hostfully
    - Retained public profile describes PMS at roughly $99 + $20/property/mo or $21/property/mo with API; no free PMS trial
    - PMS, pipeline, inbox, direct booking, owner portal, devices, API, reporting
    - Onboarding fee varies; exact packaging depends on source interpretation
    - More transparent than quote-only peers but still less standardized than a simple plan grid
  - - Avantio
    - No retained self-serve price card; demo / quote-led posture
    - Agency-focused PMS, channel manager, owners area, accounting, websites
    - Implementation scope, modules, and contract terms not public in retained set
    - Fits consultative sales for 20+ property agencies, but limits instant comparison
  - - Hostify
    - $20/mo starting price on Software Advice; homepage stresses no onboarding fees and money-back guarantee
    - Channel manager, inbox, booking engine, owner dashboard, analytics, mobile app
    - Five-plan structure exists but the retained source set does not expose every tier clearly
    - Aggressive value option for price-sensitive buyers
  notes: Hostfully’s pricing row relies on a retained company profile last updated in 2025, so it is directionally useful but should not be treated as contract-ready without a live quote.
