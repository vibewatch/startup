- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Top-tier OTA partner status
    - Partner badges are shared by multiple peers and are therefore table stakes rather than exclusive distribution control
    - high
    - Ask management for channel-specific conversion, uptime, and issue-resolution data that prove performance above badge parity
  - - Broad integrations and open API
    - Open ecosystems help upsell and fit complex accounts, but they also lower modular switching costs
    - medium
    - Request attach-rate, API usage, and net-retention data by ecosystem depth
  - - Support and onboarding reputation
    - Support advantages can erode if peers close gaps or if growth outruns service quality
    - medium
    - Pressure-test CSAT, response times, onboarding duration, and escalation rates versus competitors
  - - Balanced mid-market positioning
    - SMB price-led challengers can undercut while enterprise-scale peers outspend on features and GTM
    - high
    - Model win-rate by cohort and ask where Hostaway loses on price versus complexity
  - - Workflow lock-in via websites, owner portals, and payments
    - Migration vendors or better import tooling can reduce practical switching costs over time
    - medium
    - Review actual migration timelines, data portability, and historical churn drivers by module
  notes: The real moat question is whether Hostaway converts broad feature parity into higher retention and better economics, not whether it has a unique feature checklist.
