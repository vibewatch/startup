tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Hostaway
    - Direct peer / mid-market platform
    - Private; Software Advice cites 20,000+ property managers and Hostaway cites 300+ integrations
    - Professional managers scaling roughly 5-500+ properties
    - Balanced all-in-one PMS + channel manager + AI + support + owner workflows
    - Quote-led pricing and limited public migration / win-rate disclosure
  - - Guesty
    - Direct peer with enterprise reach
    - 500K+ listings on platform; 250+ R&D experts; private funding details not refreshed in retained set
    - From 1-3 listings (Lite) through complex enterprise portfolios
    - Broadest public scale signal, 60+ channels, enterprise controls, large ecosystem
    - Review sources repeatedly cite high price, add-on fees, and uneven support
  - - Lodgify
    - SMB / self-serve challenger
    - Trusted in 180+ countries; public plans from one property up to much larger portfolios; funding not disclosed in retained set
    - Independent hosts, small managers, and direct-booking-focused operators
    - Strong website + booking engine + free-trial motion and public pricing
    - Less compelling for high-complexity ops; reviews still cite sync and support friction
  - - Hostfully
    - Direct peer / flexible workflow platform
    - Claims 60,000+ properties and 100+ countries; founded 2015; funding not disclosed in retained set
    - Managers from one listing to hundreds or more
    - PMS + guidebooks + devices + 100+/120+ integrations + 60+ channels
    - Packaging clarity is weaker than simplest self-serve rivals; exact economics rely on profile-style sources
  - - Avantio
    - Agency specialist / incumbent
    - 24+ years in market; explicit 20+ property focus; current property count undisclosed
    - Professional property-management agencies and larger portfolios
    - Agency-oriented controls, owner area, accounting, 60+ channels, long operating history
    - Little retained public pricing transparency and less obvious micro-host appeal
  - - Hostify
    - Value-oriented challenger
    - 70 verified reviews on GetApp / Software Advice; broader scale and funding not well disclosed publicly
    - SMBs and smaller managers wanting an all-in-one PMS
    - Low entry pricing, 24/7 support posture, easy all-in-one narrative
    - Much thinner proof surface than Hostaway, Guesty, or Lodgify
  - - Internal build + stacked tools
    - Substitute / status quo
    - No single vendor scale; effort scales with operator complexity and technical talent
    - Tech-capable operators or teams that outgrow point tools in a unique way
    - Maximum configurability using OTAs, websites, pricing tools, locks, accounting, and APIs
    - High implementation burden, slower rollout, and weak default support / accountability
  notes: The key competitive split is not whether vendors have PMS and channel-management features; it is which customer tier they are optimized to onboard, support, and retain.
