          label: Named asset license
          detail: Sanofi received exclusive worldwide rights to HXN-1002 and HXN-1003 in 2025.
          tone: positive
        - id: development
          label: Development and commercialization channel
          detail: Sanofi is expected to lead development and worldwide commercialization.
          tone: positive
        - id: expansion
          label: Broader platform collaboration
          detail: The 2026 collaboration applies the platform to several autoimmune and inflammatory programs.
          tone: positive
        - id: gap
          label: Diversification and durability proof
          detail: No public customer count, retention, realized milestone, or production outcome is disclosed.
          tone: risk
        - id: commercial-proof
          label: Commercial proof remains conditional
          detail: Potential milestone values and partnership scope are not realized revenue or clinical success.
