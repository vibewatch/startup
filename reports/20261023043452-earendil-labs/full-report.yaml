  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Earendil's relevant market is narrower than either global biologics sales or the entire
              artificial-intelligence software market. It includes computational protein design, biological-data
              workflows, experimental validation, and integrated discovery programs that can be transferred to a
              pharmaceutical sponsor; it excludes generic cloud infrastructure, clinical-care software, and eventual
              drug sales that have not been earned by the platform. GMI separates software, services, infrastructure,
              computational chemistry, disease-focused platforms, and integrated discovery-to-clinic models, showing
              that buyers can substitute licensed tools, outsourced scientific services, internal discovery teams,
              conventional CROs, or asset licensing for an Earendil-style partnership. This boundary matters because
              software revenue, service fees, milestone consideration, royalties, and proprietary drug value use
              different denominators and cannot be combined into one addressable market without a program-level model.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM009
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              GMI estimates the global artificial-intelligence-in-drug-discovery category at $4.0 billion in 2026 and
              forecasts $43.9 billion in 2035 at a 30.5% CAGR. That is a broad publisher estimate, not an Earendil TAM:
              the same source says software represented 67.9% of 2025 market revenue and services are projected to grow
              at a 31.1% CAGR, while Earendil publicly presents an integrated platform-plus-program model. Deal
              economics provide a second, non-additive lens. Sanofi's company-issued release specifies up to $160
              million of upfront and near-term payments and up to $2.56 billion of total potential value; Unite.AI
              reports $55 million upfront and more than $1.5 billion of total potential value for Genentech. Those
              totals include contingent milestones and royalties, so they are neither revenue nor market size. No
              assigned source supplies a sponsor-count, annual-spend, win-rate, or program- conversion denominator from
              which to calculate Earendil's SAM or SOM.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM012
              - CM013
              - CM014
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM012
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM009
              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Large pharmaceutical companies are the clearest evidenced buyers because they can fund discovery, absorb
              clinical-development risk, and commercialize globally. Their business-development, R&D, and
              therapeutic-area leaders control partnership budgets, while computational biologists, protein engineers,
              assay scientists, translational researchers, and clinical teams use or evaluate the output. The Sanofi
              structure assigns development and worldwide commercialization to the partner; the Genentech structure has
              Earendil lead discovery and research through early clinical development before Genentech assumes global
              clinical development and commercialization. These structures indicate a gated adoption path rather than a
              self-serve software sale: scientific validation, target and rights selection, reproducible wet-lab
              results, development handoff, and milestone acceptance precede broader economic capture. Emerging
              biopharma, internal pharma platforms, CROs, and infrastructure vendors remain buyer segments or
              substitutes, but the assigned evidence does not disclose Earendil's customer count, renewal behavior,
              procurement cycle, or concentration beyond named partnerships.
            claimRefs:
              - CM009
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The demand case combines scientific need with pressure on R&D productivity. PubMed reports that around 30%
              to 40% of inflammatory-bowel-disease patients either do not respond or lose response to current
              treatments, supporting continued demand for new mechanisms. IQVIA reports longer end-to-end development
              timelines and a three-month increase in inter-trial intervals, which raises the value of tools that
              improve early prioritization. Yet the same evidence does not establish that AI removes clinical attrition.
              Frontiers describes anti-TL1A proof-of-concept and remaining challenges, and its featured candidate
              evidence is preclinical rather than human efficacy. GMI identifies fragmented assay data, transferability,
              model credibility, data rights, intellectual property, and regulatory documentation as adoption barriers.
              BioSpace additionally says much of Earendil's technology remains under wraps. Valuation should therefore
              be tied to independently reproducible development milestones, realized cash, diversified counterparties,
              and clinical conversion rather than the broad category CAGR or headline contingent deal values.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Pharmaceutical demand is evidenced
            body: >-
              Sanofi and Genentech structures show that global pharmaceutical partners will fund integrated biologics
              discovery and assume downstream development or commercialization responsibilities.
            calloutType: strength
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
          - type: callout
            title: Category size is not company opportunity
            body: >-
              The $4.0 billion 2026 category estimate includes business models and applications that are not shown to be
              addressable by Earendil, while company-specific SAM and SOM denominators remain unavailable.
            calloutType: risk
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM016
          - type: callout
            title: Underwrite the conversion evidence
            body: >-
              Diligence should bridge each generated program to reproducible validation, partner acceptance, IND and
              clinical milestones, realized payments, and retained royalty or product rights.
            calloutType: recommendation
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM011
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and basis of comparison
        blocks:
          - type: paragraph
            body: >-
              Earendil's relevant alternatives are not limited to one named software competitor. The buyer can source
              biologics discovery from AI-native platforms, clinical-stage TechBio companies, antibody specialists,
              incumbent pharmaceutical R&D teams, contract research and manufacturing partners, or an internal build.
              The public record describes Earendil as integrating machine learning, generative protein engineering, and
              high-throughput experiments across discovery and early development (CP001, CP002). That creates a
              comparison on four buyer outcomes: differentiated molecules, experimental throughput, clinical-development
              handoff, and trusted regulatory/manufacturing execution. It does not establish a price-per-program or a
              guaranteed cycle-time advantage. AbCellera is a clinical-stage antibody-medicine company spanning
              endocrinology, women's health, immunology, and oncology (CP007), while Recursion presents itself as a
              clinical-stage TechBio company decoding biology (CP008). These are credible capability analogs, not proof
              that their products or economics are interchangeable with Earendil's.
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP008
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP012
      - number: '3.2'
        title: Profiles, scale signals, and strategic direction
        blocks:
          - type: paragraph
            body: >-
              Earendil's strongest public differentiation is a vertically integrated platform paired with large-pharma
              counterparties. The September 2026 Genentech collaboration assigns Earendil discovery through early
              clinical development and gives Genentech later global development and commercialization responsibility
              (CP002). The March financing coverage says the capital is intended to expand interdisciplinary teams and
              advance a pipeline of antibody and biologics programs (CP005). PatSnap's 23 October 2026 snapshot shows a
              pipeline with discovery, preclinical, and phase-1 entries, including HXN-1001 and several bispecific or
              multispecific targets (CP006). These are scale and progression signals, not independently audited proof of
              clinical efficacy. The competitive risk is that incumbents and platform peers can match individual
              computational capabilities while retaining deeper clinical, commercial, and manufacturing infrastructure.
              The evidence also does not disclose comparable headcount, program-level costs, realized revenue, or
              partner conversion rates.
            claimRefs:
              - CP002
              - CP005
              - CP006
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP007
              - CP008
              - CP012
      - number: '3.3'
        title: Capability, distribution, and buyer trade-offs
        blocks:
          - type: paragraph
            body: >-
              For a biopharma buyer, a platform is valuable only if it improves the probability-adjusted path from
              target selection to a manufacturable, clinically useful product. Earendil's Genentech arrangement is
              evidence that a major incumbent is willing to reserve a role for Earendil in discovery and early
              development, while retaining downstream control (CP002). Sanofi-related reporting likewise describes
              strategic collaboration and milestone-linked access to autoimmune and inflammatory programs (CP003). Those
              relationships can reduce distribution friction and supply access, but they can also concentrate validation
              and bargaining power in a small number of counterparties. AbCellera's disclosed focus on antibody
              medicines and Recursion's public TechBio positioning illustrate that specialized platforms and broader
              biology platforms can both compete for the same pharma innovation budget (CP007, CP008). Public sources do
              not provide list pricing, realized pricing, contract duration, exclusivity breadth, customer concentration
              beyond identified partners, or switching-cost measurements. Those unknowns prevent a confident claim that
              Earendil is cheaper, faster, or harder to replace.
            claimRefs:
              - CP002
              - CP003
              - CP007
              - CP008
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP009
              - CP011
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat case rests on a combination of proprietary data generated by high-throughput experiments, an
              integrated design-to-validation loop, internal programs, and access to global pharmaceutical partners. The
              public financing narrative says Earendil's AI engine has generated more than 40 programs and that HXN-1001
              is intended for phase-2 development (CP004, CP005). That output breadth is promising, but program count is
              not the same as clinical success, approved products, or recurring platform revenue. An independent
              IntuitionLabs review records failures in other AI-drug-discovery programs and notes that the field still
              faces a translation gap between AI-generated candidates and marketed medicines (CP010). The principal
              displacement risks are incumbent internal platforms, rapid commoditization of model tooling, weak
              reproducibility in wet-lab validation, and partner control over later development. Earendil's durable
              advantage therefore remains an open question until public evidence shows differentiated clinical outcomes,
              repeatable partner economics, and retention or expansion across customers.
            claimRefs:
              - CP004
              - CP005
              - CP010
              - CP011
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic validation is the clearest differentiator
            body: >-
              Genentech's disclosed role in later global development and commercialization, together with reported
              Sanofi collaborations, gives Earendil distribution and development access that a pure software vendor
              would not automatically possess.
            calloutType: strength
            claimRefs:
              - CP002
              - CP003
          - type: callout
            title: Partner concentration and translation remain unproven
            body: >-
              The assigned evidence does not establish customer diversification, realized economics, or a clinical
              success advantage; reported program breadth and headline deal values should not be treated as proof of a
              durable moat.
            calloutType: risk
            claimRefs:
              - CP004
              - CP009
              - CP010
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization architecture
        blocks:
          - type: paragraph
            body: >-
              Earendil's disclosed model combines internal drug development with partnered discovery, licensing, and
              downstream royalties rather than a published SaaS or transaction price. The September 2026 Genentech
