  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Earendil is positioned as an integrated AI-biologics platform with strategic validation, while peers show
      specialized antibody or broader TechBio scope; coordinates are ordinal evidence summaries, not market rankings.
    data:
      xAxis: Integration from AI design through experimental and early clinical work (ordinal 1-5)
      yAxis: External strategic and clinical validation visible in assigned sources (ordinal 1-5)
      points:
        - label: Earendil Labs
          x: 5
          'y': 4
          note: >-
            Integrated AI, generative protein engineering, high-throughput experiments, and reported Sanofi/Genentech
            collaborations.
        - label: AbCellera
          x: 3
          'y': 4
          note: >-
            Clinical-stage antibody-medicine focus is explicit; end-to-end integration beyond the assigned profile is
            not scored.
        - label: Recursion
          x: 4
          'y': 4
          note: >-
            Clinical-stage TechBio positioning is explicit; assigned source does not establish comparable biologics
            scope.
        - label: Incumbent pharma internal build
          x: 3
          'y': 5
          note: >-
            Established clinical, regulatory, manufacturing, and commercial infrastructure is an industry-level
            comparator, not a sourced company score.
        - label: Contract research or manufacturing substitute
          x: 2
          'y': 3
          note: Can provide capacity and execution but does not necessarily own an integrated discovery platform.
        - label: Status quo manual discovery
          x: 1
          'y': 2
          note: Baseline substitute for buyer workflow; no company-specific performance score is asserted.
    approximationNotes: >-
      Coordinates are analyst-authored ordinal assessments constrained by the cited capability and validation
      descriptions; they are not measured market-share, efficacy, price, or probability estimates.
