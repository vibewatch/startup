  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Earendil's product is best understood as a biologics R&D engine rather than a standalone software
              subscription. Public descriptions place machine learning, generative protein engineering, molecular
              computation, and high-throughput biology in one loop: models propose or optimize protein sequences,
              experiments test their properties, and results feed later design cycles. That workflow serves two routes
              to value. Earendil can build internal therapeutic programs, while a pharma partner can license selected
              molecules or use the platform to generate additional candidates. The Sanofi license for HXN-1002 and
              HXN-1003 is concrete proof of a product handoff, but the public record does not disclose a customer-facing
              API, implementation timeline, service-level commitment, or reproducibility benchmark. The operating model
              therefore looks closer to integrated discovery services plus proprietary pipeline creation than to a
              conventional seat-based software product.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE007
