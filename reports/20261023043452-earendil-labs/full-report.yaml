              commercialization. The 2025 Sanofi license used the same broad pattern: upfront and near-term
              consideration, development and commercial milestones, and royalties. These agreements validate an ability
              to monetize programs, but milestone ceilings are not recognized revenue, ARR, or cash available.
            claimRefs:
