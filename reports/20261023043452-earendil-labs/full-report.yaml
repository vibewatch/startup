      - number: '4.2'
        title: Capital base and operating-cost exposure
        blocks:
          - type: paragraph
            body: >-
              Earendil announced $787 million of financing in March 2026, with stated uses spanning platform expansion,
              interdisciplinary hiring, and advancement of internal antibody and biologics programs. That is funding
              raised, not a disclosed balance-sheet cash figure. The retained evidence provides no current cash, monthly
              burn, debt schedule, restricted cash, working-capital profile, capex plan, or runway. The operating model
              also combines computational infrastructure with high-throughput wet-lab validation and early clinical
              work, implying meaningful research, laboratory, and specialist-personnel costs. Without program-level
              spend or cash-flow statements, neither capital sufficiency nor the next financing trigger can be
              calculated.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI011
              - CI016
      - number: '4.3'
        title: Traction proxies and execution risk
        blocks:
          - type: paragraph
            body: >-
              Public traction is expressed through pipeline breadth and partner commitments rather than revenue.
              Earendil says its platform has generated more than 40 programs, while a third-party pipeline snapshot
              dated October 23, 2026 lists HXN-1001 and four other named projects as preclinical. That classification
              conflicts with BioPharm International's report that HXN-1001 was ready for Phase II development, so stage
              should be verified directly rather than converted into a financial forecast. Sector evidence is also
              cautionary: IntuitionLabs cites Phase II efficacy failures at other AI-drug companies, while Recursion's
              market capitalization data show a 13.34% decline in 2026. These are not Earendil outcomes, but they argue
              against assigning full value to preclinical platform output.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI014
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence threshold
        blocks:
          - type: paragraph
            body: >-
              The strongest financial evidence is the combination of a large financing round and concrete upfront
              collaboration payments. The weakest link is the missing bridge from those transaction announcements to
              current cash, recognized revenue, gross margin, and program-level return on invested capital. Sanofi and
              Genentech can absorb later-stage development or commercialization responsibilities for partnered programs,
              which may reduce Earendil's downstream spend on those assets, but Earendil still funds platform work,
              discovery, early development, and retained programs. The underwriting stance is therefore research-more:
              treat upfronts as contract-specific cash candidates subject to receipt and accounting confirmation,
              probability-weight milestones, exclude royalties until commercial assumptions are supported, and require a
              full liquidity and cost bridge before judging runway.
