chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Earendil Labs presents itself as an AI-enabled protein-therapeutics company rather than a software vendor.
              Its official homepage says it develops AI platforms that transform protein therapeutics research and
              development and applies them to discover and develop novel drugs. The company overview evidence places the
              legal entity in Delaware and describes operating offices in Beijing, while independent coverage describes
              a cross-border model linking American incorporation, Chinese operations, and global pharmaceutical
              partners. That operating design may support access to scientific and development capabilities, but it also
              creates jurisdictional, governance, and data-rights diligence needs. Public pages identify Jian Peng as
              founder and CEO and Zhenping Zhu as co-founder, president, and co-CEO; a complete board and executive
              roster is not disclosed in the assigned evidence.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
      - number: '1.2'
        title: Capital and partnership validation
        blocks:
          - type: paragraph
            body: >-
              The strongest current validation is commercial rather than purely promotional. Independent reporting says
              Earendil announced $787 million of financing on March 20, 2026, with participation from Sanofi, Dimension,
              DST Global, INCE Capital, Luminous Ventures, Miracle Capital, and the Hillhouse-Pfizer Biotech Development
              Fund. The same reporting describes a pipeline of nearly 20 drugs on the website and more than 40 programs
              claimed overall, with HXN-1001 described as ready for Phase 2 development. Earendil also announced a
              Genentech collaboration with a $55 million upfront payment and potential value above $1.5 billion, subject
              to closing conditions and milestone achievement. A separate January 2026 Sanofi collaboration carried $160
              million in upfront and near-term payments and up to $2.4 billion in additional development and commercial
              milestones. These figures are transaction terms or company-reported pipeline counts, not revenue, ARR, or
              realized cash proceeds. The financing and partnership record supports strategic interest, while the
              absence of disclosed round structure, runway, board rights, or milestone realization limits confidence in
              economic durability.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO013
      - number: '1.3'
        title: Leadership, milestones, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The public timeline shows a rapid progression from platform positioning to clinical and partnering
              milestones: the official news page records a Phase 1 initiation for HXN-1001 in July 2025 and a Sanofi
              license announcement in April 2025; later reporting describes the March 2026 financing and additional 2026
              partnership activity. The Genentech announcement extends the partnership narrative into oncology, but the
              fetched article says target combinations, program names, preclinical data, and closing timing were not
              disclosed. The evidence therefore supports a milestone sequence, not a completed clinical or financial
              outcome. Key-person dependence is a live diligence issue because public materials foreground Jian Peng and
              Zhenping Zhu, while the assigned sources do not establish succession depth, board composition, or
              functional coverage. Customer diversification beyond Sanofi and Genentech, realized milestone cash, and
              the legal and regulatory implications of the cross-border structure remain open questions. Independent
              sector analysis also cautions that autoimmune bispecific adoption still depends on clinical proof of
              concept and Phase III success, together with resolution of manufacturing and regulatory barriers; the
              partnership record therefore validates interest, not clinical or commercial success.
