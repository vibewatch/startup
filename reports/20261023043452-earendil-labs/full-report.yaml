        - Obtain price, ownership, cash, burn, security terms, clinical status, and realized payments
        - No numeric entry range should be set from financing size alone
        - Required before underwriting
        - Evidence package remains incomplete
    notes: >-
      Scenarios are qualitative because the assigned evidence does not disclose a priced valuation, audited operating
      metrics, asset-level probabilities, or realized collaboration cash.
