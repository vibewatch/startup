  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Clinical-development execution, high, critical, early, "Very high", "No retained Earendil efficacy readout or complete public trial record."]
      - [CMC or batch-release failure, medium, critical, partial, high, "No quality agreement, deviation history, or backup manufacturing evidence."]
      - [AI/model validation or assay reproducibility failure, medium, high, early, high, "No independent validation package or reproducibility metrics."]
      - [Cybersecurity or health-data incident, medium, high, partial, high, "No public SOC, DPA, audit, or incident-history evidence in the assigned pool."]
    notes: "This register separates failure modes from evidence quality; absent public materials are recorded as gaps rather than negative incidents."
    claimRefs: [CR006, CR007, CR010, CR011, CR013]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Monitoring trigger]
    rows:
      - [GMP development and manufacturing, "WuXi Biologics / CRDMO", "Capacity, quality, or transfer failure delays clinical supply.", critical, "End-to-end development scope and GMP capability are announced; contract controls are undisclosed.", high, "Missed batch release, deviation recurrence, audit finding, or unqualified alternate site."]
      - [Commercial and clinical development, "Genentech / Roche", "Subject-to-closing collaboration does not close or target programs are delayed.", high, "Large-pharma development and commercialization role is announced.", medium-high, "No close notice, no target disclosure, or termination/change in scope."]
      - [Autoimmune partnering and validation, Sanofi, "Program or platform dependence concentrates validation and milestone timing.", high, "License and discovery collaborations provide external validation.", high, "No human-study start, missed milestone, or counterparty portfolio reprioritization."]
      - [Cross-border corporate and data operations, "US entity / Beijing affiliate and global partners", "Data, regulatory, or governance friction interrupts development.", high, "Multiple jurisdictions and partner controls are visible; internal controls are not.", high, "Regulatory inquiry, data-transfer restriction, or inability to evidence permissions."]
    notes: "Counterparty roles are based on the assigned disclosures; financial concentration percentages and contract protections were not publicly evidenced."
    claimRefs: [CR002, CR003, CR010, CR014]
