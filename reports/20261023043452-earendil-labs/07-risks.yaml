chapter:
  number: 7
  title: Risks
  summary: >-
    Earendil has credible partner and platform signals, but its risk profile remains
    dominated by clinical translation, regulatory and manufacturing execution, and
    dependence on contingent partnership economics. Public evidence is stronger on
    announced collaborations than on realized clinical outcomes, cash usage, data
    controls, or the resilience of its supplier and partner network.
sections:
  - id: risk-ranking
    title: Risk ranking and thesis implications
    body: >-
      The highest-consequence risk is clinical translation: public materials describe
      a large AI-generated pipeline and early clinical programs, but do not establish
      patient efficacy or approved products. The Genentech announcement provides a
      $55 million upfront payment and potential milestones exceeding $1.5 billion,
      while the text says the transaction remains subject to customary closing
      conditions; milestone headlines therefore should not be treated as realized
      revenue or cash. A second cluster concerns execution: Earendil's WuXi
      Biologics agreement assigns end-to-end development and GMP manufacturing
      services to a partner. Regulatory, privacy, and data-rights obligations add
      cross-border diligence requirements. The investment implication is a high
      residual-risk profile until clinical readouts, manufacturing controls, partner
      concentration, and cash runway are evidenced.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: regulatory-clinical
    title: Regulatory, clinical, and data exposure
    body: >-
      Regulatory risk is not limited to whether a candidate reaches a trial. FDA
      guidance states that a biologics license application must provide product and
      manufacturing information, nonclinical data, clinical pharmacology, and
      clinical data sufficient to assess safety, effectiveness, and quality. The
      public ClinicalTrials.gov record assigned to this pool is for afimkibart, not
      an Earendil asset, so it is a useful comparator for the disclosure standard
      rather than proof of Earendil progress. The risk register consequently treats
      absent trial identifiers, endpoints, and results as evidence gaps rather than
      as evidence of failure. The FTC separately warns that health-data holders have
      security obligations and that breach-notification rules may apply. Earendil's
      AI and cross-border operating model makes data provenance, permissions,
      validation, and incident response material diligence items.
    claimRefs: [CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
  - id: operational-dependency
    title: Operational, quality, and dependency risks
    body: >-
      Earendil's operating model combines internal discovery with external
      development and manufacturing. The WuXi release says the partner will provide
      cell-line, process, bioassay, formulation, and GMP manufacturing services,
      which can accelerate scale-up but creates a concentrated dependency across
      critical CMC workstreams. Public descriptions of the platform emphasize
      iterative computational design and high-throughput validation, yet the
      available evidence does not disclose assay reproducibility, batch deviations,
      quality agreements, backup capacity, or validated model controls. The
      pipeline database also presents a snapshot with most programs in discovery or
      preclinical stages, reinforcing that operational readiness is not equivalent
      to commercial manufacturing readiness. Kill criteria should focus on missed
      IND or trial milestones, unresolved CMC deviations, and inability to evidence
      independent quality oversight.
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
  - id: monitoring-and-kill-criteria
    title: Monitoring indicators and diligence path
    body: >-
      Monitoring should prioritize observable milestones rather than promotional
      pipeline counts. For the internal portfolio, request trial identifiers,
      protocol endpoints, enrollment and safety updates, and dated clinical
      readouts. For partner programs, verify closing notices, named targets,
      achieved milestones, and the contractual split between upfront, development,
      regulatory, and sales payments. For operations, obtain the WuXi quality
      agreement, audit rights, business-continuity plan, manufacturing-site
      qualification, and deviation history. For privacy and AI governance, obtain
      data maps, permissions, model-validation records, retention rules, and
      incident logs. A thesis break would be a material safety signal, repeated
      trial delay, failed CMC release, partner termination, inability to substantiate
      cash runway, or a reportable data incident without a tested response.
    claimRefs: [CR002, CR006, CR010, CR014, CR015]
    tableRefs: []
callouts:
  - calloutType: risk
    title: Contingent economics are not de-risked cash
    body: >-
      Announced milestone ceilings and royalties may validate partner interest, but
      they remain contingent until contractual triggers and payments are evidenced.
    claimRefs: [CR002, CR003]
  - calloutType: assumption
    title: Clinical disclosure is the gating evidence
    body: >-
      The risk view assumes that the absence of public efficacy, endpoint, and trial
      identifiers is an unresolved disclosure gap, not proof that a program failed.
    claimRefs: [CR006, CR009]
