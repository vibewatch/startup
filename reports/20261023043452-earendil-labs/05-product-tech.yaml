  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: validation
      missingEvidence: Program-level hit rates, developability metrics, reproducibility data, and independent benchmark results across the AI-design and experimental loop.
      whyItMatters: Without denominators and controls, a broad program count cannot establish that the platform consistently produces differentiated or clinic-ready molecules.
      diligencePath: Request blinded validation packages, assay-level denominators, model-versus-baseline benchmarks, and program stage-gate records for partnered and internal assets.
      relatedQuestionRefs: [QE005, QE008]
    - type: missing-source
      severity: material
      topic: controls
      missingEvidence: Security, privacy, data-rights, model-governance, laboratory quality, and change-control documentation.
      whyItMatters: These controls determine whether partner data and regulated development workflows can be operated safely and audited.
      diligencePath: Obtain the trust package, data provenance and permitted-use schedules, access-control evidence, quality-system certifications, and incident history under NDA.
      relatedQuestionRefs: [QE006, QE007]
    - type: enumeration-incomplete
      severity: minor
      topic: pipeline
      missingEvidence: A complete, dated program inventory with stage, indication, ownership, partner status, and next milestone for every asset.
      whyItMatters: Public pipeline pages show breadth but do not make portfolio maturity, duplication, or concentration fully auditable.
      diligencePath: Reconcile the official pipeline against a management-provided asset register and current clinical/regulatory records.
      relatedQuestionRefs: [QE002, QE009]
