  - id: TE002
    title: Workflow and use cases
    columns: [User job, Current workflow, Earendil solution, Measurable benefit publicly evidenced, Limitation]
    rows:
      - [Identify viable protein candidates, Target and sequence design followed by testing, AI-assisted molecular design plus high-throughput biology, Program generation and partner selection are described, No public hit-rate denominator]
      - [Optimize developability, Predict properties and iterate against experimental results, Integrated computational and experimental loop, Optimization is claimed as a platform objective, No independent comparative benchmark]
      - ["Advance internal therapeutics", "Select and progress proprietary programs", "Internal pipeline spanning immunology, inflammation, and oncology", "More than 40 programs are reported by company-linked coverage", "Program-level stage gates are incomplete"]
      - [Give pharma access to selected assets, License candidates or collaborate on discovery, Sanofi license and later platform collaboration, External partnership exists, Partner diligence materials are not public]
    notes: >-
      Public evidence supports the workflow descriptions and partnership existence,
      not a quantified causal benefit; measurable-benefit cells retain that limitation.
    claimRefs: [CE002, CE003, CE005, CE010]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or control question]
    rows:
      - ["Computational design", "Generate and rank protein or antibody candidates", "Models, sequence data, and compute", "Validation, provenance, and model-change controls"]
      - ["Structure and property prediction", "Estimate candidate behavior before experiments", "Training data and GPU infrastructure", "Calibration, uncertainty, and external replication"]
      - ["High-throughput experimental validation", "Test and refine designed molecules", "Assays, laboratories, and biological materials", "Reproducibility, quality system, and throughput"]
      - ["Program progression", "Move selected assets toward IND and clinical work", "Translational, regulatory, and manufacturing partners", "Stage-gate evidence, CMC readiness, and clinical attrition"]
    notes: >-
      The architecture is an analytical decomposition of publicly described
      computational and experimental activities; unreported controls are explicit
      diligence questions, not findings of absence.
    claimRefs: [CE005, CE011, CE013, CE016]
figures:
  - id: FE001
    title: Earendil product architecture map
    type: stack
    summary: A computational-design and experimental-validation loop feeds internal and partnered therapeutic programs.
    data:
      layers:
        - label: Program outputs
          detail: Internal antibody programs, Sanofi-licensed bispecifics, and IND or clinical candidates.
        - label: Translational progression
          detail: Candidate selection, IND-enabling work, and Phase II progression.
        - label: Experimental layer
          detail: High-throughput biology, property testing, and feedback into model development.
        - label: Computational layer
          detail: Molecular computation, protein design, and property prediction.
        - label: Data and governance
          detail: Data provenance, access control, model change control, and laboratory quality remain diligence requirements.
        - label: Partner handoff
          detail: Selected candidates move through licensing, translational work, and clinical-development interfaces.
    approximationNotes: >-
      Layer order is an analytical representation of the described operating model,
      not a disclosed software or laboratory topology.
    claimRefs: [CE002, CE005, CE006, CE010]
callouts:
  - calloutType: strength
    title: External validation is concentrated but real
    body: Sanofi has licensed two bispecific programs and expanded the relationship to platform-enabled discovery, giving Earendil a credible external test of selected outputs even though broader technical benchmarks remain private.
    claimRefs: [CE003, CE010]
  - calloutType: risk
    title: Scale claims outrun public controls evidence
    body: The public record supports a broad pipeline and an AI-plus-biology workflow, but does not disclose reproducibility, security, data-rights, assay-quality, or program-level conversion metrics needed to underwrite technical maturity.
    claimRefs: [CE013, CE014, CE015, CE016]
