company:
  name: Earendil Labs
chapter:
  number: 5
  title: Product & Technology
  summary: Earendil presents an AI-native biologics discovery platform that combines computational protein design with high-throughput biological experimentation, then advances internally generated antibody programs and partnered assets. Public evidence is strongest on the platform's claimed operating model and pipeline inventory; independent evidence remains thinner on reproducibility, validation rates, security, and operational controls.
sections:
  - id: customer-workflow
    title: Product and customer workflow
    body: >-
      Earendil's product is best understood as a biologics R&D engine rather than a
      standalone software subscription. Public descriptions place machine learning,
      generative protein engineering, molecular computation, and high-throughput biology
      in one loop: models propose or optimize protein sequences, experiments test their
      properties, and results feed later design cycles. That workflow serves two routes
      to value. Earendil can build internal therapeutic programs, while a pharma partner
      can license selected molecules or use the platform to generate additional
      candidates. The Sanofi license for HXN-1002 and HXN-1003 is concrete proof of a
      product handoff, but the public record does not disclose a customer-facing API,
      implementation timeline, service-level commitment, or reproducibility benchmark.
      The operating model therefore looks closer to integrated discovery services plus
      proprietary pipeline creation than to a conventional seat-based software product.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: platform-architecture
    title: Platform architecture and pipeline
    body: >-
      The disclosed architecture has three linked layers: computational design and
      prediction, experimental generation and testing, and therapeutic-program
      progression. A Dealroom profile describes the HeliXon design platform as an
      iterative system in which deep-learning models design antibody sequences,
      predict properties, and receive high-throughput experimental feedback. The
      company's pipeline page shows the resulting program breadth across immunology,
      inflammation, and oncology, including monoclonal, bispecific, trispecific,
      T-cell engager, and antibody-drug-conjugate formats. HXN-1001 is described by
      independent trade coverage as a half-life-extended anti-TL1A antibody prepared
      for Phase II, while the official pipeline page presents program-stage columns
      without a public legend that supplies dates, probability of success, or
      quantitative validation rates. Breadth is therefore observable; comparative
      technical performance is not.
    claimRefs: [CE005, CE006, CE007, CE008]
    figureRefs: [FE001]
  - id: maturity-deployment
    title: Maturity, deployment, and differentiation
    body: >-
      Maturity is uneven across the stack. The platform has produced a large stated
      number of programs and has generated a partnered asset set, but most named
      programs on the official pipeline remain in discovery, PCC, or IND-enabling
      stages. The public milestone that is easiest to verify is HXN-1001's planned
      Phase II progression; multiple IND submissions are described as planned for
      2026 and 2027 rather than completed. Sanofi's worldwide exclusive license and
      later platform collaboration are meaningful external validation of selected
      outputs, not proof that every program or model output is clinic-ready. AlphaFold
      provides a useful practitioner-community benchmark for the infrastructure
      burden of protein-structure inference: its public implementation requires
      Linux, NVIDIA GPU support, and large genetic databases. That source does not
      establish Earendil's implementation, but it highlights why compute, data
      licensing, experiment throughput, and assay quality are material diligence
      dependencies for an AI-biologics platform.
    claimRefs: [CE009, CE010, CE011, CE012]
    tableRefs: [TE003]
  - id: controls-and-gaps
    title: Trust, controls, and technical diligence gaps
    body: >-
      The public evidence does not establish Earendil's security controls, data-rights
      framework, model governance, auditability, laboratory quality system, or
      integration and uptime commitments. Nor does it provide a denominator for
      candidate-generation success, experimental hit rates, manufacturability
      improvements, or clinical translation. The official pipeline is useful as an
      inventory, but it is not a validation report, and trade articles largely repeat
      company-reported descriptions of scale and plans. The central technical risk is
      therefore not whether Earendil can describe an AI-plus-biology loop; it is
      whether that loop produces repeatable, differentiated, developable molecules
      under controlled laboratory and regulatory processes. A diligence process should
      request model and assay validation packages, data provenance and permitted-use
      records, change-control and access-control policies, partner handoff criteria,
      program-level stage-gate data, and evidence that the platform's claimed
      advantages persist outside selected examples.
    claimRefs: [CE013, CE014, CE015, CE016]
    tableRefs: []
