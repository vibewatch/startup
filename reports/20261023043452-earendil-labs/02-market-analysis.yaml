    body: "Sanofi and Genentech structures show that global pharmaceutical partners will fund integrated biologics discovery and assume downstream development or commercialization responsibilities."
    claimRefs: [CM012, CM013, CM014, CM015]
  - calloutType: risk
    title: Category size is not company opportunity
    body: "The $4.0 billion 2026 category estimate includes business models and applications that are not shown to be addressable by Earendil, while company-specific SAM and SOM denominators remain unavailable."
    claimRefs: [CM001, CM003, CM004, CM005, CM016]
  - calloutType: recommendation
    title: Underwrite the conversion evidence
    body: "Diligence should bridge each generated program to reproducible validation, partner acceptance, IND and clinical milestones, realized payments, and retained royalty or product rights."
    claimRefs: [CM006, CM007, CM008, CM011, CM016]
