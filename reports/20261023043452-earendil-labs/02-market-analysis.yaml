company:
  name: Earendil Labs
chapter:
  number: 2
  title: Market Analysis
  summary: "Earendil addresses a narrow, evidence-intensive slice of the AI drug-discovery market: integrated biologics design and validation sold to pharmaceutical partners or converted into proprietary therapeutic value. Independent estimates support category growth and unmet need, while public evidence does not isolate Earendil's SAM, SOM, repeatable buyer conversion, or realized economics."
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Earendil's relevant market is narrower than either global biologics sales or the
      entire artificial-intelligence software market. It includes computational protein
      design, biological-data workflows, experimental validation, and integrated
      discovery programs that can be transferred to a pharmaceutical sponsor; it
      excludes generic cloud infrastructure, clinical-care software, and eventual drug
      sales that have not been earned by the platform. GMI separates software, services,
      infrastructure, computational chemistry, disease-focused platforms, and integrated
      discovery-to-clinic models, showing that buyers can substitute licensed tools,
      outsourced scientific services, internal discovery teams, conventional CROs, or
      asset licensing for an Earendil-style partnership. This boundary matters because
      software revenue, service fees, milestone consideration, royalties, and proprietary
      drug value use different denominators and cannot be combined into one addressable
      market without a program-level model.
    claimRefs: [CM003, CM004, CM005, CM009]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Evidence-constrained sizing
    body: >-
      GMI estimates the global artificial-intelligence-in-drug-discovery category at
      $4.0 billion in 2026 and forecasts $43.9 billion in 2035 at a 30.5% CAGR. That is a
      broad publisher estimate, not an Earendil TAM: the same source says software
      represented 67.9% of 2025 market revenue and services are projected to grow at a
      31.1% CAGR, while Earendil publicly presents an integrated platform-plus-program
      model. Deal economics provide a second, non-additive lens. Sanofi's company-issued
      release specifies up to $160 million of upfront and near-term payments and up to
      $2.56 billion of total potential value; Unite.AI reports $55 million upfront and
      more than $1.5 billion of total potential value for Genentech. Those totals include
      contingent milestones and royalties, so they are neither revenue nor market size.
      No assigned source supplies a sponsor-count, annual-spend, win-rate, or program-
      conversion denominator from which to calculate Earendil's SAM or SOM.
    claimRefs: [CM001, CM002, CM003, CM004, CM012, CM013, CM014, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      Large pharmaceutical companies are the clearest evidenced buyers because they can
      fund discovery, absorb clinical-development risk, and commercialize globally.
      Their business-development, R&D, and therapeutic-area leaders control partnership
      budgets, while computational biologists, protein engineers, assay scientists,
      translational researchers, and clinical teams use or evaluate the output. The
      Sanofi structure assigns development and worldwide commercialization to the
      partner; the Genentech structure has Earendil lead discovery and research through
      early clinical development before Genentech assumes global clinical development
      and commercialization. These structures indicate a gated adoption path rather than
      a self-serve software sale: scientific validation, target and rights selection,
      reproducible wet-lab results, development handoff, and milestone acceptance precede
      broader economic capture. Emerging biopharma, internal pharma platforms, CROs, and
      infrastructure vendors remain buyer segments or substitutes, but the assigned
      evidence does not disclose Earendil's customer count, renewal behavior, procurement
      cycle, or concentration beyond named partnerships.
    claimRefs: [CM009, CM012, CM013, CM014, CM015, CM016]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Adoption drivers, constraints, and valuation relevance
    body: >-
      The demand case combines scientific need with pressure on R&D productivity.
      PubMed reports that around 30% to 40% of inflammatory-bowel-disease patients either
      do not respond or lose response to current treatments, supporting continued demand
      for new mechanisms. IQVIA reports longer end-to-end development timelines and a
      three-month increase in inter-trial intervals, which raises the value of tools that
      improve early prioritization. Yet the same evidence does not establish that AI
      removes clinical attrition. Frontiers describes anti-TL1A proof-of-concept and
      remaining challenges, and its featured candidate evidence is preclinical rather
      than human efficacy. GMI identifies fragmented assay data, transferability, model
      credibility, data rights, intellectual property, and regulatory documentation as
      adoption barriers. BioSpace additionally says much of Earendil's technology remains
      under wraps. Valuation should therefore be tied to independently reproducible
      development milestones, realized cash, diversified counterparties, and clinical
      conversion rather than the broad category CAGR or headline contingent deal values.
    claimRefs: [CM006, CM007, CM008, CM010, CM011, CM016]
