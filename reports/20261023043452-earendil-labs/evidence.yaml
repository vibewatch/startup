evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster, executive responsibility matrix, investor rights summary, and succession plan.
    whyItMatters: >-
      Leadership concentration and investor control can materially affect execution risk and the value attributable to
      common equity.
    diligencePath: >-
      Request the latest organizational chart, board minutes or consent summaries, financing term sheets, and governance
      documents under NDA.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: financing
    missingEvidence: Audited or management financial statements showing cash received, burn, runway, revenue, and milestone receipts.
    whyItMatters: >-
      Funding raised and potential partnership value do not establish cash available, operating sustainability, or
      revenue quality.
    diligencePath: >-
      Obtain audited statements, current cash and debt schedules, budget-to-actual reporting, and a milestone
      receivables schedule.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: pipeline
    missingEvidence: >-
      A reconciled list of all programs with ownership, stage, indication, partner rights, and current development
      status.
    whyItMatters: >-
      The public record references more than 40 programs and a website list of 19, but does not reconcile scope or
      stage.
    diligencePath: Request the confidential pipeline register and reconcile it to clinical-trial, patent, and partner disclosures.
