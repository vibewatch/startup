      - [Strategic validation, "Two Sanofi relationships include disclosed upfront, milestone, and royalty structures", "Milestone ceilings are contingent and realized receipts are unknown", "Payment history and contract-level probability schedule"]
      - [AI discovery upside, "Large peer financings and valuations show investor appetite", "IntuitionLabs notes no AI-originated drug has reached market", "Replicated clinical efficacy and development speed"]
    notes: Evidence includes company-issued financing claims, independent reporting, and market-data snapshots; limitations identify where those sources do not establish economic value.
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV012, CV013, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Multiple programs advance clinically; partner payments are realized; counterparties diversify", "Potential premium to platform peers, subject to verified asset probabilities and entry terms", "Low-to-medium until independently verified", "Missed IND, trial, or partner milestones"]
      - [Base, "Platform output and partnering continue, but timing and cash conversion remain uncertain", "Use a risk-adjusted pipeline model only after cap-table and asset data are obtained", "Most defensible current case", "Persistent disclosure gaps or financing dependence"]
      - [Bear, "Lead program remains preclinical or slips; contingent economics do not convert; financing resets", "Dilution and preference overhang can impair common-equity value despite capital raised", "Material possibility", "Down round, partner withdrawal, or adverse clinical signal"]
      - [Diligence gate, "Obtain price, ownership, cash, burn, security terms, clinical status, and realized payments", "No numeric entry range should be set from financing size alone", "Required before underwriting", "Evidence package remains incomplete"]
    notes: Scenarios are qualitative because the assigned evidence does not disclose a priced valuation, audited operating metrics, asset-level probabilities, or realized collaboration cash.
    claimRefs: [CV001, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV015, CV016]
