        - [partnered-research, upfronts]
        - [partnered-research, milestones]
        - [partnered-research, royalties]
        - [platform, retained-pipeline]
    approximationNotes: "This is a qualitative contract-flow map, not a cash waterfall; no contingent amount is summed into liquidity or recognized revenue."
    claimRefs: [CI007, CI008, CI011, CI012, CI013]

callouts:
  - calloutType: strength
    title: Concrete upfront economics
    body: The $55 million Genentech upfront and the historical $125 million Sanofi upfront provide tangible monetization evidence beyond a generic AI-platform narrative, subject to receipt and accounting verification.
    claimRefs: [CI004, CI006]
  - calloutType: risk
    title: Funding is not runway
    body: The $787 million financing amount does not reveal current unrestricted cash, burn, commitments, or runway, so it cannot independently establish capital adequacy.
    claimRefs: [CI001, CI003, CI011]
  - calloutType: recommendation
    title: Require a transaction-to-cash bridge
    body: Reconcile financing proceeds and partner payments to audited cash, recognized revenue, deferred revenue, obligations, and program-level spend before valuing milestones or royalties.
    claimRefs: [CI003, CI012, CI013, CI016]

