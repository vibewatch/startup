      - [Product royalties, Tiered share of net product sales, Percentage of defined net sales, "Genentech rate undisclosed; Sanofi high-single to low-double digits", "Long-dated and dependent on approval and commercialization", "Provide royalty definitions, deductions, duration, territory, and probability-weighted launch cases"]
      - [Retained internal programs, Future license or product economics, Per program or commercial product, "More than 40 programs reported; no recognized revenue disclosed", "Pipeline optionality rather than current revenue", "Provide ownership, stage, spend, partnering plan, and expected economics by asset"]
    notes: "Values are disclosed transaction terms or company-reported program counts; milestone ceilings, royalty rights, and pipeline breadth are not treated as current revenue, ARR, or cash."
    claimRefs: [CI004, CI005, CI006, CI008, CI012, CI013]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Economic term, Contract basis, Disclosed amount, Key uncertainty, Underwriting treatment]
    rows:
      - [Genentech upfront, Research collaboration, "$55 million", "Customary closing conditions and recognition policy", "Include only after receipt and accounting verification"]
      - [Genentech potential value, Upfront plus development regulatory and sales milestones, "More than $1.5 billion", "Milestone mix timing and probability are undisclosed", "Probability-weight each event; do not book the ceiling"]
      - [Genentech royalties, Tiered royalties on net product sales, "Rate undisclosed", "Requires approved commercial products and contract definitions", "Exclude from base case until launch and rate assumptions are supported"]
      - [Sanofi upfront and near-term, Worldwide exclusive license, "$125 million upfront plus $50 million near-term", "Receipt dates and accounting treatment require confirmation", "Use as historical validation, not a recurring price point"]
      - [Sanofi milestones and royalties, Development and commercial milestones plus product royalties, "$1.72 billion milestone pool; high-single to low-double digit royalties", "Asset success and commercial sales are prerequisites", "Treat as contingent option value"]
    notes: "These bespoke collaboration terms are not list pricing and do not establish realized revenue, recurring revenue, margin, or a repeatable contract price."
    claimRefs: [CI004, CI005, CI006, CI012, CI013]
  - id: TI003
    title: Unit economics and capital-adequacy gaps
    columns: [Metric, Public value, Confidence, Why it matters, Specific diligence request]
    rows:
      - [Recognized revenue, null, Unavailable, "Separates contracted headline value from accounting performance", "Provide audited revenue by upfront milestone royalty and research-service category"]
      - [Gross margin, null, Unavailable, "Tests whether partnered discovery can scale economically", "Provide direct labor compute laboratory and allocated overhead by program"]
      - [CAC and sales cycle, null, Unavailable, "Measures efficiency of winning strategic pharma collaborations", "Provide business-development spend cycle length funnel conversion and renewal data"]
      - [Program cost to IND, null, Unavailable, "Connects platform output to capital consumption", "Provide fully loaded cost and elapsed time by program stage and cohort"]
      - [Monthly cash burn, null, Unavailable, "Required to calculate runway", "Provide trailing 12-month cash flow and current monthly operating and investing burn"]
      - [Cash and runway, null, Unavailable, "Determines financing dependency and dilution risk", "Provide unrestricted cash debt restricted cash commitments and board-approved forecast"]
    notes: "Null means the assigned public evidence does not support a value; it is not zero. Every missing metric requires management or audited financial evidence."
    claimRefs: [CI003, CI011, CI016]

