figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: Earendil is positioned as an integrated AI-biologics platform with strategic validation, while peers show specialized antibody or broader TechBio scope; coordinates are ordinal evidence summaries, not market rankings.
    data:
      xAxis: "Integration from AI design through experimental and early clinical work (ordinal 1-5)"
      yAxis: "External strategic and clinical validation visible in assigned sources (ordinal 1-5)"
      points:
        - label: Earendil Labs
          x: 5
          y: 4
          note: "Integrated AI, generative protein engineering, high-throughput experiments, and reported Sanofi/Genentech collaborations."
        - label: AbCellera
          x: 3
          y: 4
          note: "Clinical-stage antibody-medicine focus is explicit; end-to-end integration beyond the assigned profile is not scored."
        - label: Recursion
          x: 4
          y: 4
          note: "Clinical-stage TechBio positioning is explicit; assigned source does not establish comparable biologics scope."
        - label: Incumbent pharma internal build
          x: 3
          y: 5
          note: "Established clinical, regulatory, manufacturing, and commercial infrastructure is an industry-level comparator, not a sourced company score."
        - label: Contract research or manufacturing substitute
          x: 2
          y: 3
          note: "Can provide capacity and execution but does not necessarily own an integrated discovery platform."
        - label: Status quo manual discovery
          x: 1
          y: 2
          note: "Baseline substitute for buyer workflow; no company-specific performance score is asserted."
    approximationNotes: "Coordinates are analyst-authored ordinal assessments constrained by the cited capability and validation descriptions; they are not measured market-share, efficacy, price, or probability estimates."
    claimRefs: [CP001, CP002, CP007, CP008, CP012]
callouts:
  - calloutType: strength
    title: Strategic validation is the clearest differentiator
    body: Genentech's disclosed role in later global development and commercialization, together with reported Sanofi collaborations, gives Earendil distribution and development access that a pure software vendor would not automatically possess.
    claimRefs: [CP002, CP003]
  - calloutType: risk
    title: Partner concentration and translation remain unproven
    body: The assigned evidence does not establish customer diversification, realized economics, or a clinical success advantage; reported program breadth and headline deal values should not be treated as proof of a durable moat.
    claimRefs: [CP004, CP009, CP010, CP011]
