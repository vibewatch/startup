company:
  name: Earendil Labs
chapter:
  number: 6
  title: Customers
  summary: Earendil's public customer proof is concentrated in Sanofi, where two licensing transactions and a newer discovery collaboration provide unusually specific commercial validation for a private AI-biologics company. The record supports strategic-partner traction and a partner-led model, but does not establish a diversified active-customer base, retention, recurring revenue, or production use beyond named programs.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segmentation
    body: >-
      Earendil appears to serve two overlapping customer groups: large biopharmaceutical companies seeking differentiated antibody candidates and internal drug-development teams that use an AI-plus-experiment platform. Sanofi is the clearest public payer and strategic customer. The January 2026 collaboration says Sanofi will lead development and worldwide commercialization of candidates arising from the collaboration, while Earendil supplies discovery capability and receives upfront and milestone-linked economics. The April 2025 license similarly transferred exclusive worldwide rights to two named bispecific antibodies. This is stronger than a logo-only reference because the public record identifies assets, therapeutic areas, consideration, and counterparty responsibilities. It still does not disclose whether Earendil sells platform access as a standalone product, how many paying accounts exist, or how customer economics are recognized over time.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and durability
    body: >-
      Public evidence shows progression from a bilateral asset license to a second, broader Sanofi collaboration, which is a credible adoption trajectory for an early biotech platform. The first transaction covered HXN-1002 and HXN-1003; the later collaboration applied the discovery platform to several Sanofi autoimmune and inflammatory disease programs. Independent coverage also reports collaborations with WuXi XDC and WuXi Biologics, but the available text does not provide contract dates, active-use measures, program outcomes, or customer-level revenue. Earendil's own technology page describes an iterative design, prediction, experimental-validation, and self-improvement loop, but that describes the product rather than customer retention. No public NRR, GRR, churn, renewal, contract-length, cohort, utilization, or satisfaction metric was found in the assigned successful sources. The correct diligence conclusion is therefore partner traction with durability unproven, not retention established.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: named-proof-and-concentration
    title: Named proof, expansion, and concentration
    body: >-
      Named customer proof is commercially meaningful but concentrated. Sanofi is tied to two distinct public relationships: an exclusive license for two bispecific antibodies and a subsequent platform collaboration covering additional autoimmune and inflammatory programs. Those relationships connect Earendil to a global pharmaceutical development and commercialization channel, and the reported economics include $125 million upfront in the 2025 license plus up to $1.72 billion in development and commercial milestones, and up to $160 million in upfront and near-term payments in the 2026 collaboration. These are potential transaction values and milestone opportunities, not realized revenue or cash available. Tech in Asia additionally reports potential relationships with WuXi XDC and WuXi Biologics and says Earendil was considering a Hong Kong IPO; its article attributes the IPO report to people familiar with the matter. The public record does not show whether those relationships are customers, partners, or prospective commercial counterparties, nor does it identify a top-customer revenue share. Concentration and cross-border procurement, regulatory, and commercialization dependence therefore remain material diligence gaps.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
    figureRefs: [FU001]
