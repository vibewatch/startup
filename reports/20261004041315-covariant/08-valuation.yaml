  - id: "TV003"
    title: "Bull, Base, and Bear Scenarios"
    columns:
      - "Scenario"
      - "Evidence-bound assumptions"
      - "Valuation and return logic"
      - "Probability signal and downside trigger"
    rows:
      - - "Bull"
        - "Retained rights, customer renewals, and partner integrations produce independently verified growth and improving unit economics."
        - "No range supportable; price only after audited metrics and terms permit a milestone-based return model."
        - "Favorable only if retention and runway are documented; breaks on material churn or restricted IP."
      - - "Base"
        - "Covariant continues serving customers, but team capacity and transaction economics remain uncertain."
        - "No range supportable; require a discount for unresolved execution, capitalization, and liquidity risk."
        - "Most consistent with current public evidence; breaks if diligence cannot reconcile cash, preferences, and operating plan."
      - - "Bear"
        - "Personnel transfer, customer attrition, or limited retained rights impair the standalone business."
        - "Downside cannot be quantified without liabilities and preferences; recovery may be below cumulative capital raised."
        - "Adverse signal is any failed renewal, runway shortfall, or inability to produce executed IP and licensing schedules."
    notes: "Qualitative scenarios only; no retained source provides current valuation, ARR, margins, burn, cash, debt, or preference-stack data."
