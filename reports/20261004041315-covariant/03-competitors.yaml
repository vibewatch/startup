  - id: TP003
    title: Commercial pricing, packaging, and integration comparison
    columns:
      - Provider Archetype
      - Pricing Model
      - Contract Structure
      - Facility Retrofit Requirements
      - Switching Barrier
      - Diligence Implication
    rows:
      - - Covariant AI Platform
        - Hybrid RaaS (platform license + hardware lease)
        - Multi-year subscription (aligned with 3-5 yr 3PL agreements)
        - 4-8 weeks conveyor, electrical, and safety integration
        - High mechanical and WMS switching cost once operational
        - Assess post-founder software update velocity and support SLAs
      - - Legacy Conveyor / AS/RS
        - Heavy Capex purchase + maintenance contracts
        - 5-10 year capital amortization schedules
        - Months-long civil and structural facility overhauls
        - Very high financial lock-in due to sunk balance sheet capital
        - High initial barrier limits adoption among flexible 3PL networks
      - - Industrial Picking Integrator
        - Capital equipment sale with software service fees
        - Multi-year enterprise master service agreements
        - Significant floor space reservation and electrical retrofitting
        - Moderate to high switching cost tied to hardware footprint
        - High volume required to justify dedicated picking station economics
      - - Status Quo Manual Labor
        - Fully variable hourly wages + temp agency fees
        - At-will or short-term flexible staffing contracts
        - Zero facility retrofit required beyond basic safety
        - Minimal mechanical switching cost, highly flexible
        - Highly vulnerable to 5-7% annual warehouse wage inflation
    notes: "Contractual and deployment estimates reflect industry standards across North American and European logistics facilities; retrofit timelines based on reported site installation averages."
    claimRefs:
      - CP008
      - CP009
      - CP011
      - CP014

