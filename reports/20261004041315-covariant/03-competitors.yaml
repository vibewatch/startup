callouts:
  - calloutType: risk
    title: Strategic Displacement Threat from the Amazon Licensing Transaction
    body: >-
      Amazon's August 2024 hiring of Covariant co-founders Peter Chen, Pieter Abbeel, and Rocky Duan, combined with non-exclusive licensing of Covariant's foundation models, fundamentally alters the competitive equilibrium. Amazon fulfillment centers deploy hundreds of thousands of robotic systems. By bringing Covariant's foundational architecture in-house under its Fulfillment Technologies & Robotics team, Amazon neutralizes a key potential technology vendor while building captive capability that will not be accessible to commercial 3PLs or competing retailers.
    claimRefs:
      - CP010
      - CP015

