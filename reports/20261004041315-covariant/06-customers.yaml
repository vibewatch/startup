callouts:
  - calloutType: "risk"
    title: "Customer Support and Continuity Risk Post-Amazon Transaction"
    body: "While Amazon licensed Covariant's foundation models and hired the founding research team, Covariant was left to operate independently with its remaining staff. Whistleblower complaints and industry reporting have characterized the post-deal entity as a constrained operation, introducing substantial counterparty risk for enterprise customers relying on continuous software updates, model improvements, and SLA support."
    claimRefs:
      - "CU009"
      - "CU011"
      - "CU012"
