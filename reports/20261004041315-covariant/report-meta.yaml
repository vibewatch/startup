companyProfile:
  summary: >-
    Covariant builds AI software and foundation models for warehouse manipulation, picking, sortation, and item
    induction, integrating with partner automation hardware. Founded in 2017 by UC Berkeley and OpenAI researchers, the
    company remained operational after Amazon hired three co-founders in 2024, licensed its foundation models, and left
    Covariant serving existing customers under new leadership. Public disclosure still leaves financial performance,
    retained IP boundaries, and customer durability materially opaque.
