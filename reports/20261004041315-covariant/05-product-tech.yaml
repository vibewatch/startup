callouts:
  - calloutType: "insight"
    title: "The Embodied Data Flywheel as Covariant's Primary Competitive Moat"
    body: "Unlike pure-software LLMs where training data is scraped from the public internet, robotics foundation models require rich, continuous physical interaction data. Covariant's deployment across commercial distribution centers in over 15 countries functions as an automated data engine, generating millions of physical pick-and-place trajectories every few weeks. This interaction corpus provides the ground truth required to train learned physics simulation in RFM-1, creating a defensive moat that academic laboratories and non-deployed competitors struggle to replicate."
    claimRefs:
      - "CE004"
      - "CE006"
      - "CE008"
