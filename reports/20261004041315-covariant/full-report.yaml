      - number: '1.2'
        title: Executive Leadership and Amazon Reverse-Acquihire Transaction
        blocks:
          - type: paragraph
            body: >-
              In August 2024, Covariant underwent a fundamental corporate and governance restructuring when Amazon
              entered into an agreement to hire three of Covariant's primary co-founders—Chief Executive Officer Peter
              Chen, President and Chief Scientist Pieter Abbeel, and Chief Technology Officer Rocky Duan—along with
              approximately 25% of the company's total workforce into Amazon's Fulfillment Technologies and Robotics
              team. As part of this arrangement, Amazon obtained a non-exclusive license to Covariant's robotics
              foundation models, mirroring similar reverse-acquihire transactions conducted by major technology
              conglomerates across the artificial intelligence sector. Following the departure of the founding executive
              trio, Covariant announced that Chief Operating Officer Ted Stinson would assume the role of Chief
              Executive Officer, leading the continuing independent operating entity alongside remaining co-founder
              Tianhao Zhang to support existing commercial warehouse deployments.
