              - CR012
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Partner dependence, capital risk, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              Covariant historically supplied AI software while KNAPP and ABB supplied physical automation components,
              creating delivery dependencies outside Covariant's direct control. Covariant now describes KNAPP as an
              exclusive user of Covariant Brain for several piece-picking applications; that is evidence of channel
              validation and of counterparty concentration, not proof of contractual exclusivity duration or revenue
              durability. Funding history is similarly bounded: reporting supports $222 million raised through April
              2023, while a syndicated 2021 company release described an earlier $80 million round for R&D and global
              growth. Funding raised is not cash available. Investment should pause if customer renewals, partner
              commitments, post-transfer staffing, license economics, or runway cannot be documented; it should fail if
              retained rights prevent independent product development or if verified field reliability falls below
              customer SLAs.
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
