        title: Adoption Proof, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is directional rather than financial. Company-issued 2021 material
              described deployments across fashion, health and beauty, industrial supply, pharmaceuticals, grocery,
              parcel, and general merchandise. Amazon stated in August 2024 that Covariant would continue serving dozens
