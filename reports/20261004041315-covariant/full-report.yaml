              - CR015
      - number: '7.3'
        title: Operational quality and team execution
        blocks:
          - type: paragraph
            body: >-
              Covariant's own materials provide useful but non-independent operating signals: advertised throughput of
              500-1,000 picks per hour, a greater-than-99.9% piece-picking success rate, and customer examples. Those
              figures do not disclose fleet-wide denominators, intervention rates, downtime, safety events, or
              performance after the Amazon personnel transfer. Silicon Republic also reported Covariant's acknowledgment
              that existing models struggle with physical-law understanding and the accuracy, precision, and reliability
              required for autonomous interaction. RFM-1's reported 8-billion-parameter scale does not resolve those
              deployment questions. Mitigation maturity is therefore partial: production claims exist, but independent
              current quality evidence and the post-transfer technical organization are missing.
            claimRefs:
              - CR001
              - CR004
              - CR008
              - CR009
              - CR012
              - CR013
              - CR014
              - CR015
