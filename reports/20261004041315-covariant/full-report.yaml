  - id: FU001
    title: Enterprise customer procurement and deployment lifecycle
    type: journey-map
    summary: >-
      Typical customer progression from integrator benchmark testing to ongoing operational support, highlighting
      friction points following the 2024 Amazon transaction.
    data:
      items:
        - label: 'Phase 1: Integrator Benchmark'
          detail: Customer evaluates Covariant Brain against manual picking benchmarks via integrators like Knapp or ABB.
          touchpoints:
            - Integrator lab testing
            - SKU variation assessment
            - Picking speed benchmarking
        - label: 'Phase 2: Pilot Installation'
          detail: Initial installation of single picking cell or robotic putwall at a regional distribution facility.
          touchpoints:
            - Warehouse WMS integration
            - Physical cell calibration
            - Operator training
        - label: 'Phase 3: Production Go-Live'
          detail: Deployment handles live consumer order streams across standard operating shifts.
          touchpoints:
            - 24/7 autonomous operation
            - Intervention handling
            - Throughput SLA monitoring
        - label: 'Phase 4: Expansion Evaluation'
          detail: Account reviews multi-facility rollout across fulfillment network based on unit economics.
          touchpoints:
            - Fleet expansion planning
            - Software maintenance reviews
            - Corporate ROI validation
        - label: 'Phase 5: Operational Uncertainty'
          detail: >-
            Procurement hesitation emerges post-August 2024 as core founders and engineering talent transition to
            Amazon.
          touchpoints:
            - Vendor viability audits
            - Escalation to interim management
            - Risk of contract renegotiation
        - label: 'Phase 6: Contract Resolution'
          detail: Customers decide whether to retain existing stations or freeze future automation capital outlays.
          touchpoints:
            - Hardware OEM support dependence
            - Alternative AI model evaluations
            - Maintenance agreement renewals
    approximationNotes: Lifecycle phases synthesized from reported customer adoption workflows and post-acquisition corporate disruption.
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU007
      - CU009
      - CU011
