              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break tests
            body: >-
              Pause investment if Covariant cannot provide the executed Amazon agreement, a current technical org chart,
              post-transaction customer renewals, partner contract terms, independent SLA data, and a board-approved
              runway plan. Reject the thesis if retained rights block independent model development, key partners can
              terminate without replacement coverage, verified field performance misses customer SLAs, or available
              liquidity cannot fund the diligence-confirmed operating plan.
            calloutType: recommendation
            claimRefs:
