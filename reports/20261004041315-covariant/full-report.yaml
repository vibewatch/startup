  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Covariant (legally established as Embodied Intelligence Inc.) was founded in 2017 by robotics researchers
              and artificial intelligence scientists from UC Berkeley and OpenAI, including Peter Chen, Pieter Abbeel,
              Rocky Duan, and Tianhao Zhang. Operating from headquarters in Berkeley and Emeryville, California, the
              company set out to build universal artificial intelligence software—branded initially as the Covariant
              Brain and later expanded to the 8-billion parameter RFM-1 robotics foundation model—designed to give
              commercial warehouse robots the capacity to see, reason, and act across dynamic logistics environments.
              Rather than manufacturing physical robot hardware arms or conveyor belts directly, Covariant established a
              software-centric business model partnering with industrial automation and systems integrators such as ABB,
              Knapp AG, and Bastian Solutions to deploy automated order picking, putwall sortation, and item induction
              across retail, pharmaceutical, and e-commerce distribution centers.
