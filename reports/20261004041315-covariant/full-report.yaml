  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Thesis, and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with medium confidence and high underwriting risk. The positive case
              rests on operating continuity and strategic relevance: Amazon said Covariant would continue serving dozens
              of customers after licensing its robotic foundation models, while Lift Automation describes integration
              with conveyors, automated storage and retrieval systems, and warehouse control systems. Those signals
              support a thesis that Covariant retains commercially useful software and deployment relationships rather
              than being an empty residual entity.


              The anti-thesis is more consequential for valuation. Amazon hired three founders and around one quarter of
              Covariant's employees while taking a non-exclusive model license, and The Robot Report said the parties
              declined to disclose deal details. Publicly retained evidence therefore cannot establish which
              capabilities, economics, or competitive advantages remained with Covariant. The thesis becomes investable
              only if management verifies customer retention, product ownership, development capacity, and standalone
              financial performance; absent those items, the company may be strategically relevant without offering an
              attractive new-money price.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV007
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV015
      - number: '8.2'
        title: Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The strongest quantified financing fact is historical, not a current value marker. TechCrunch reported
              that the April 2023 $75 million Series C extension brought total capital raised to $222 million, and
              Tracxn's page updated October 2, 2026 reports the same total across five rounds. An archived Reddit post
              also records the earlier $40 million Series B and $67 million cumulative funding in 2020. These figures
              describe financing history; they do not establish cash available, enterprise value, revenue, or investor
              return.


              Current entry economics remain unobservable in the assigned evidence. Tracxn masks its last-known
              valuation, EquityZen places current valuation, stock price, cap-table, preference, and financial data
              behind account verification, and public reporting does not disclose the Amazon agreement's consideration.
              Entry discipline should therefore require a fully diluted capitalization table, security-level
              preferences, current cash and debt, audited or quality-of-earnings financials, and the proposed round
              price before any valuation stance stronger than insufficient-evidence can be supported.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: Scenarios, Exit Readiness, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis must remain qualitative because no retained source supplies a defensible current price,
              revenue base, margin profile, burn rate, or preference stack. In the bull case, customer continuity,
              integration breadth, and retained model rights translate into independently verified renewals and
              improving economics. The base case is continued operation with material uncertainty over team capacity and
              deal economics, making a price decision contingent on private diligence. The bear case is that personnel
              transfer, unclear rights, or customer attrition leaves insufficient standalone value relative to financing
              obligations.


              EquityZen describes a potential private-secondary route and notes that an IPO, merger, acquisition, or
              eligible secondary transaction can provide liquidity, but its public page does not show a live Covariant
              price or transaction volume. Exit readiness is therefore unproven. Thesis-break triggers are measurable:
              material customer churn, inability to document retained IP and model-development rights, insufficient
              runway through the next value milestone, or proposed terms that subordinate new money to undisclosed
              preferences. Passing diligence requires evidence on each trigger, not a narrative premium for the Amazon
              relationship.
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV012
