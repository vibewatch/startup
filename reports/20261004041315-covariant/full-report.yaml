        title: Exhibits
        blocks:
          - type: callout
            title: Do not convert financing history into valuation
            body: >-
              The $222 million figure is cumulative capital raised. It does not establish current cash, enterprise
              value, preference-adjusted equity value, or a supportable entry price.
            calloutType: recommendation
            claimRefs:
