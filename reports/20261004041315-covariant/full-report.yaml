              - CU007
              - CU008
              - CU010
      - number: '6.3'
        title: Retention Durability, Account Concentration, and Acquisition Fallout
        blocks:
          - type: paragraph
            body: >-
              Customer durability and expansion faced an existential shift on August 30, 2024, when Amazon executed a
              reverse-acquihire agreement to license Covariant's robotic foundation models and hire co-founders Peter
              Chen, Pieter Abbeel, and Rocky Duan along with approximately 25% of Covariant's total workforce. Although
              Amazon and Covariant publicly stated that the startup would continue serving its dozens of existing
              commercial customers under COO Ted Stinson, subsequent reports and whistleblower filings in 2025 indicated
              that the transaction severely compromised the company's operating autonomy. The departure of key
              engineering leadership, coupled with Amazon's restrictive covenants and cessation of public product
              updates, created immediate procurement friction and retention risks for existing commercial enterprise
              accounts.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU009
              - CU011
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer Support and Continuity Risk Post-Amazon Transaction
            body: >-
              While Amazon licensed Covariant's foundation models and hired the founding research team, Covariant was
              left to operate independently with its remaining staff. Whistleblower complaints and industry reporting
              have characterized the post-deal entity as a constrained operation, introducing substantial counterparty
              risk for enterprise customers relying on continuous software updates, model improvements, and SLA support.
            calloutType: risk
            claimRefs:
              - CU009
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and residual exposure
        blocks:
          - type: paragraph
            body: >-
              The leading risk is not a demonstrated product failure; it is organizational and contractual uncertainty
              after Amazon hired Peter Chen, Pieter Abbeel, Rocky Duan, and roughly one quarter of Covariant's workforce
              while taking a non-exclusive model license. Amazon said Covariant would continue serving dozens of
              customers, and independent reporting named Ted Stinson and Tianhao Zhang as the continuing leaders, but
              the license economics were not disclosed. That combination supports a high-impact continuity assessment
              without proving customer churn, insolvency, or loss of retained intellectual property. Public headcount
              descriptions also conflict sharply, making current staffing depth a diligence item rather than a reliable
              operating metric. The heatmap therefore uses qualitative likelihood and mitigation labels, not modeled
              probabilities.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
