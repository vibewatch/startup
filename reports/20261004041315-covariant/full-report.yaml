figures:
  - id: FO001
    title: Covariant Corporate Evolution and Milestone Timeline
    type: timeline
    summary: >-
      Key corporate, financing, product development, and organizational milestones from founding in 2017 through the
      August 2024 Amazon reverse acquihire.
    data:
      items:
        - label: Company Inception
          date: '2017'
          detail: >-
            Founded as Embodied Intelligence Inc. in Berkeley by Peter Chen, Pieter Abbeel, Rocky Duan, and Tianhao
            Zhang.
          tone: positive
        - label: Stealth Exit & Covariant Brain
          date: 2020-01
          detail: Emerged from stealth publicly branding the universal AI platform for robotic manipulation.
          tone: neutral
        - label: Series B Capitalization
          date: 2020-05
          detail: Closed $40M Series B financing led by Index Ventures, bringing cumulative funding to $67M.
          tone: positive
        - label: Series C Expansion
          date: 2021-07
          detail: Raised $80M Series C round led by Index Ventures with Temasek and CPPIB, expanding global team.
          tone: positive
        - label: Series C1 Extension
          date: 2023-04
          detail: Added $75M in Series C extension funding at a reported $625M valuation to fulfill order backlogs.
          tone: positive
        - label: RFM-1 Foundation Model Launch
          date: 2024-03
          detail: Introduced 8-billion parameter robotics foundation model combining internet data with physical sensor data.
          tone: positive
        - label: Amazon Reverse Acquihire
          date: 2024-08
          detail: >-
            Amazon hired 3 co-founders and 25% of workforce while licensing foundation models; Ted Stinson appointed
            CEO.
          tone: adverse
    approximationNotes: Milestone dates correspond to public press releases, news filings, and verified corporate disclosures.
    claimRefs:
      - CO001
      - CO003
      - CO005
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
  - id: FM001
    title: 'Sizing Evidence Ladder: Broad Capacity to Vendor Capture'
    type: pyramid
    summary: >-
      Six evidence layers narrow from broad robotics activity to Covariant-specific capture, while making the
      unsupported market-value steps visible.
    data:
