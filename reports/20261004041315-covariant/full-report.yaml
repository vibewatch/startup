  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The supportable market boundary is warehouse and distribution-center robotic manipulation, not industrial
              robotics as a whole. Covariant's reported configurations cover goods-to-person picking, robotic putwalls,
              sorter induction, kitting, and depalletization, with Covariant supplying perception and manipulation
              intelligence while integrators supply robot arms, conveyors, safety infrastructure, and service. A narrow
              market definition therefore includes manipulation software, workcell integration, commissioning, support,
              and model updates. It excludes unrelated industrial robots, general conveyance, storage infrastructure,
              and mobile transport unless they are part of a manipulation deployment. The practical substitutes are
              manual handling, conventional task-specific automation, and postponing automation; the assigned evidence
              does not quantify spending for those alternatives. Broader applications in hospitals, factories, shops,
              homes, manufacturing, agriculture, and food remain company-described adjacencies rather than demonstrated
              components of the current serviceable market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
