      - number: '2.3'
        title: Buyers, Budget Path, and Adoption Friction
        blocks:
          - type: paragraph
            body: >-
              Sacra identifies the typical economic buyer as an operations, supply-chain, or automation executive
              comparing robotic capacity with warehouse labor costs. The end users are facility teams that load totes,
              monitor stations, clear jams, and handle rejected items, but the retained sources do not disclose which
              cost center pays or what approval thresholds apply by segment. Revenue reportedly combines AI licenses,
              partner-procured hardware, installation and commissioning, recurring support and model updates, and
              sometimes performance-linked fees. That structure makes adoption materially heavier than a software-only
              purchase: workflow design, gripper selection, camera calibration, warehouse-system integration, safety
              validation, and on-site commissioning can take months. Covariant One further shifts some performance risk
              to the vendor by withholding customer payment when guaranteed performance is not met. UpMarket's account
              of a Covariant report says 55% cited lower human-labor costs as an automation-budget driver, but this
              company-originated survey signal is not evidence of committed spending.
