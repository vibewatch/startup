              - CR016
      - number: '7.2'
        title: Regulatory, legal, and contractual exposure
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not show that Covariant itself is subject to an enforcement action. GeekWire
              instead provides a narrower warning signal: regulators were paying closer attention to big-technology
              hiring-plus-license structures and the FTC reportedly questioned Amazon's separate Adept deal. Covariant's
              transaction has comparable structural features, but analogy is not a finding. The more immediate diligence
              risk is contractual: Amazon's license is expressly non-exclusive, yet the financial consideration and
              detailed boundaries were not public. Investors need the agreement, derivative-work provisions,
              customer-use restrictions, and regulatory correspondence before concluding that Covariant retained
              sufficient economics or freedom to operate. Industrial safety, privacy, and security controls are also
              absent from this pool and remain unverified rather than presumed deficient.
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR012
              - CR013
              - CR015
          - type: table
