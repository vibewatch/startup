callouts:
  - calloutType: "recommendation"
    title: "Thesis-break tests"
    body: >-
      Pause investment if Covariant cannot provide the executed Amazon agreement,
      a current technical org chart, post-transaction customer renewals, partner contract
      terms, independent SLA data, and a board-approved runway plan. Reject the thesis if
      retained rights block independent model development, key partners can terminate
      without replacement coverage, verified field performance misses customer SLAs, or
      available liquidity cannot fund the diligence-confirmed operating plan.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR005"
      - "CR007"
      - "CR010"
      - "CR012"
      - "CR013"
