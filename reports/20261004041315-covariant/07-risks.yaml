company:
  name: "Covariant"
chapter:
  number: 7
  title: "Risks"
  summary: "Covariant's highest-evidence risks are execution continuity after Amazon hired three founders and roughly one quarter of the workforce, uncertainty around an undisclosed non-exclusive model license, and dependence on external warehouse-integration partners. Public evidence supports historical deployment and performance claims, but it does not establish current cash runway, post-transaction retention, independent fleet reliability, or Covariant-specific regulatory clearance."
sections:
  - id: "ranked-risk-view"
    title: "Risk ranking and residual exposure"
    body: >-
      The leading risk is not a demonstrated product failure; it is organizational and
      contractual uncertainty after Amazon hired Peter Chen, Pieter Abbeel, Rocky Duan,
      and roughly one quarter of Covariant's workforce while taking a non-exclusive model
      license. Amazon said Covariant would continue serving dozens of customers, and
      independent reporting named Ted Stinson and Tianhao Zhang as the continuing leaders,
      but the license economics were not disclosed. That combination supports a high-impact
      continuity assessment without proving customer churn, insolvency, or loss of retained
      intellectual property. Public headcount descriptions also conflict sharply, making
      current staffing depth a diligence item rather than a reliable operating metric.
      The heatmap therefore uses qualitative likelihood and mitigation labels, not modeled
      probabilities.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR008"
      - "CR009"
    figureRefs:
      - "FR001"
  - id: "regulatory-legal-and-contractual"
    title: "Regulatory, legal, and contractual exposure"
    body: >-
      The assigned evidence does not show that Covariant itself is subject to an
      enforcement action. GeekWire instead provides a narrower warning signal: regulators
      were paying closer attention to big-technology hiring-plus-license structures and the
      FTC reportedly questioned Amazon's separate Adept deal. Covariant's transaction has
      comparable structural features, but analogy is not a finding. The more immediate
      diligence risk is contractual: Amazon's license is expressly non-exclusive, yet the
      financial consideration and detailed boundaries were not public. Investors need the
      agreement, derivative-work provisions, customer-use restrictions, and regulatory
      correspondence before concluding that Covariant retained sufficient economics or
      freedom to operate. Industrial safety, privacy, and security controls are also absent
      from this pool and remain unverified rather than presumed deficient.
    claimRefs:
      - "CR002"
      - "CR005"
      - "CR006"
      - "CR012"
      - "CR013"
      - "CR015"
    tableRefs:
      - "TR001"
  - id: "operational-quality-and-team"
    title: "Operational quality and team execution"
    body: >-
      Covariant's own materials provide useful but non-independent operating signals:
      advertised throughput of 500-1,000 picks per hour, a greater-than-99.9% piece-picking
      success rate, and customer examples. Those figures do not disclose fleet-wide
      denominators, intervention rates, downtime, safety events, or performance after the
      Amazon personnel transfer. Silicon Republic also reported Covariant's acknowledgment
      that existing models struggle with physical-law understanding and the accuracy,
      precision, and reliability required for autonomous interaction. RFM-1's reported
      8-billion-parameter scale does not resolve those deployment questions. Mitigation
      maturity is therefore partial: production claims exist, but independent current
      quality evidence and the post-transfer technical organization are missing.
    claimRefs:
      - "CR001"
      - "CR004"
      - "CR008"
      - "CR009"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
    tableRefs:
      - "TR002"
  - id: "partners-capital-and-kill-criteria"
    title: "Partner dependence, capital risk, and kill criteria"
    body: >-
      Covariant historically supplied AI software while KNAPP and ABB supplied physical
      automation components, creating delivery dependencies outside Covariant's direct
      control. Covariant now describes KNAPP as an exclusive user of Covariant Brain for
      several piece-picking applications; that is evidence of channel validation and of
      counterparty concentration, not proof of contractual exclusivity duration or revenue
      durability. Funding history is similarly bounded: reporting supports $222 million
      raised through April 2023, while a syndicated 2021 company release described an
      earlier $80 million round for R&D and global growth. Funding raised is not cash
      available. Investment should pause if customer renewals, partner commitments,
      post-transfer staffing, license economics, or runway cannot be documented; it should
      fail if retained rights prevent independent product development or if verified field
      reliability falls below customer SLAs.
    claimRefs:
      - "CR007"
      - "CR010"
      - "CR011"
      - "CR016"
    tableRefs:
      - "TR003"
