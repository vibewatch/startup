figures:
  - id: FM001
    title: "Sizing Evidence Ladder: Broad Capacity to Vendor Capture"
    type: pyramid
    summary: "Six evidence layers narrow from broad robotics activity to Covariant-specific capture, while making the unsupported market-value steps visible."
    data:
      items:
        - label: "Broad robotics deployment"
          value: "806,000 installations/year by 2029"
          detail: "Global industrial-robot installation forecast across all sectors; volume, not spend."
        - label: "Geographic concentration"
          value: "China: 59% of 2025 installations"
          detail: "Share of the broad global installation base; not Covariant exposure."
        - label: "Warehouse manipulation category"
          value: "No isolated public value"
          detail: "The relevant category is narrower than industrial robotics, but the assigned pool provides no defensible TAM."
        - label: "Serviceable warehouse segment"
          value: "No isolated public value"
          detail: "SAM requires geography, workflows, integration eligibility, and pricing that are not public."
        - label: "Recurring automation comparator"
          value: "Locus: estimated $180M ARR"
          detail: "A different warehouse-automation model; benchmark only, not Covariant revenue."
        - label: "Covariant capture evidence"
          value: "$32.6M vs. $100M-$250M revenue estimates"
          detail: "Conflicting 2026 third-party estimates; neither is ARR, cash, or audited market share."
    approximationNotes: "This is an evidence ladder, not an additive or proportional pyramid. Values use different units and denominators; missing TAM and SAM values are explicit gaps."
    claimRefs:
      - CM001
      - CM012
      - CM013
      - CM014
      - CM015
      - CM016
callouts:
  - calloutType: risk
    title: "A broad robotics forecast is not Covariant's TAM"
    body: "The 806,000-installation forecast includes industrial robots outside warehouse manipulation and reports units rather than spending. Applying it directly to Covariant would require unsupported assumptions about eligible workflows, geography, price, software share, and deployment conversion."
    claimRefs:
      - CM001
      - CM012
      - CM013
  - calloutType: recommendation
    title: "Underwrite from contracts, not directory estimates"
    body: "Request audited revenue, recurring software revenue, backlog, deployed and contracted workcells, renewal and churn data, price by workflow, partner economics, and customer-level payback evidence before using a market-share or revenue-multiple valuation."
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM015
      - CM016
