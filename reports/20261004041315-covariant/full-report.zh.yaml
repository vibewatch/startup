      - number: '5.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 具身数据飞轮是 Covariant 的主要竞争护城河
            body: >-
              纯软件 LLM 的训练数据可以从公开互联网抓取，而机器人基础模型需要丰富且持续的物理交互数据。Covariant 在超过 15
              个国家的商业配送中心部署，构成了一台自动化数据引擎，每隔几周便产生数百万条物理拣选和放置轨迹。这些交互数据集提供了训练 RFM-1
              学习型物理仿真所需的真实基准，形成学术实验室和未部署竞争者难以复制的防御性护城河。
            calloutType: insight
            claimRefs:
              - CE004
              - CE006
              - CE008
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础分层与工作流应用
        blocks:
          - type: paragraph
            body: >-
              Covariant
              瞄准处理复杂单件拣选、物料导入和订单分拣的高吞吐配送中心及物流运营商。公司将商业覆盖分为三大垂直领域：工业供应与分销批发商、第三方物流（3PL）履约服务商，以及大型综合电商零售商。传统仓储自动化系统长期依赖预编程运动学脚本，包装、照明或方向发生变化时便会失效；Covariant
              因此部署 AI 驱动的 Covariant Brain 平台，在无需手动重新工程的情况下处理广泛的商品差异。通过与 Knapp AG 和 ABB Ltd 等系统集成商合作，Covariant
              能够在北美和欧洲物流网络中既有工业机械臂和传送带基础设施之上交付软件智能。
