      - number: '1.2'
        title: 高管团队与 Amazon 反向收购式招募交易
        blocks:
          - type: paragraph
            body: >-
              2024 年 8 月，Amazon 与 Covariant 达成协议，招募其三位主要联合创始人——CEO Peter Chen、总裁兼首席科学家 Pieter Abbeel、CTO Rocky
              Duan——以及公司约 25% 的员工加入 Amazon Fulfillment Technologies and Robotics 团队，Covariant
              因此经历了根本性的公司和治理重组。作为安排的一部分，Amazon 获得 Covariant
              机器人基础模型的非独家许可，这与大型科技集团在人工智能领域开展的类似反向收购式招募交易相似。创始高管三人离开后，Covariant 宣布由 COO Ted Stinson 接任 CEO，并与留任的联合创始人
              Tianhao Zhang 一起领导继续独立运营的实体，支持现有商用仓储部署。
