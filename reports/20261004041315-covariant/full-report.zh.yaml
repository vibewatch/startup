      - number: '1.3'
        title: 资本化历程、估值背景与战略规模
        blocks:
          - type: paragraph
            body: >-
              在 2024 年 8 月与 Amazon 的交易前，Covariant 通过五轮融资累计获得 $222M 私募风险投资。其资本化历程包括：2020 年 5 月由 Index Ventures 领投、Amplify
              Partners 和 Radical Ventures 参与的 $40M Series B；2021 年 7 月由 Index Ventures 联合领投、Temasek 和 Canada Pension
              Plan Investment Board 等新机构参与的 $80M Series C；以及 2023 年 4 月的 $75M Series C 延伸轮，据报道该轮将公司估值定为
              $625M。然而，之后私募二级交易平台和 IPO 前市场给出的估值最高达到 $2.7B，但公司完全没有披露经验证的 ARR、毛利率或单位经济数据，投机性市场估值与已确认的经营基本面之间因此出现了巨大的分析缺口。
