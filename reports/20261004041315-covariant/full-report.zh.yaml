            body: >-
              没有任何保留的来源单独给出纯机器人操作软件的 TAM、SAM 或 SOM。现有数字回答的是不同问题，不能相加或包装成漏斗。Sacra 预测到 2029 年工业机器人年安装量为 806,000 台，并称中国占
              2025 年全球安装量的 59%；两者描述的市场都远大于 Covariant 的仓储细分市场，也都不是支出估算。Sacra 估计 Locus Robotics 的 ARR 为
              $180M，这是重复性自动化业务的对比对象，不是 Covariant 的收入或市场规模。从公司收入捕获角度看，UpMarket 给出 2026 年收入 $32.6M，LeadIQ 则估计截至 2026 年 7
              月为 $100M 至 $250M。这些估算相差至少约三倍，抓取文本没有披露方法，若没有经审计的收入、积压订单、定价和部署数据，就无法支撑可靠的 SOM。
