      - number: '2.3'
        title: 买方、预算路径与采用阻力
        blocks:
          - type: paragraph
            body: >-
              Sacra
              将典型经济买方定义为运营、供应链或自动化高管，他们会把机器人产能与仓库人工成本进行比较。终端用户是负责装载料箱、监控工位、清理卡顿和处理被拒物品的现场团队，但现有来源没有披露由哪个成本中心付款，也没有说明不同细分市场适用什么审批门槛。据报道，收入由
              AI
              许可、合作伙伴采购的硬件、安装和调试、持续支持与模型更新，以及有时与绩效挂钩的费用组成。这种结构让采用成本明显高于纯软件采购：工作流设计、夹具选择、摄像头校准、仓库系统集成、安全验证和现场调试可能耗时数月。Covariant
              One 在未达到保证绩效时扣留客户付款，进一步将部分绩效风险转给供应商。UpMarket 转述 Covariant 一份报告称，55%
              的受访者将降低人工成本列为自动化预算的驱动因素，但这项由公司发起的调查信号并不能证明已经承诺的支出。
