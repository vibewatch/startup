  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、仓储工作流集成与运行机制
        blocks:
          - type: paragraph
            body: >-
              Covariant 开发软件，让工业机器人能够在非结构化物理环境中看见、推理并行动。公司不制造实体机械臂或自动存取系统，而是提供名为 Covariant Brain
              的通用软件智能层。在商业履约中心，人工订单拣选和物品处理是主要运营瓶颈，面临严重的劳动力短缺和波动的季节性业务量。传统工业机器人依赖为结构化、重复性任务优化的确定性预编程运动路径；面对新
              SKU、可变形包装、反光表面或杂乱料箱时，这些系统却会失效。Covariant Brain 用端到端深度神经网络替代僵化的自动化代码，将标准 2D 和 3D
              视觉传感器直接连接到机械臂运动规划和末端执行器操作，从而应对这一通用化难题。平台部署于订单导入、机器人 putwall 和组套等仓储工作流，可识别物品边界、确定抓取姿态并处理多样库存，拣选速度最高可达每小时
              515 件，同时保持高度自主。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
