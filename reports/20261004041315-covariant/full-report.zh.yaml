        title: 展示材料
        blocks:
          - type: callout
            title: 论点破坏测试
            body: >-
              如果 Covariant 无法提供已签署的 Amazon 协议、当前技术组织架构、交易后的客户续约、合作伙伴合同条款、独立 SLA
              数据和董事会批准的现金跑道计划，应暂停投资。如果保留的权利阻碍独立模型开发、关键合作伙伴可以在没有替代覆盖的情况下终止合同、经验证的现场表现未达到客户
              SLA，或可用流动性无法支撑经尽调确认的运营计划，则应否决该投资论点。
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR007
              - CR010
              - CR012
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、论点与反论点
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，信心中等，投资判断风险高。正面论点建立在运营连续性和战略相关性上：Amazon 表示，在取得机器人基础模型许可后，Covariant 将继续服务数十家客户；Lift Automation
              则描述了其与传送带、自动存取系统和仓库控制系统的集成。这些信号支持一个论点：Covariant 仍保有有商业价值的软件和部署关系，而不是一个空壳残余实体。


              反论点对估值更为关键。Amazon 招募了三位创始人及约四分之一的 Covariant 员工，同时取得非独家模型许可；The Robot Report
              称双方拒绝披露交易细节。因此，公开保留的证据无法确定哪些能力、经济利益或竞争优势仍留在
              Covariant。只有在管理层验证客户留存、产品所有权、开发能力和独立财务表现后，该论点才具备投资价值；在此之前，公司即使具有战略意义，也未必能以有吸引力的新资金价格投资。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV005
              - CV007
              - CV012
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
