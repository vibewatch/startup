      - number: '4.4'
        title: 财务结论：私营运营数据阻碍投资判断
        blocks:
          - type: paragraph
            body: >-
              公开记录足以识别一种混合模式假设：软件、绩效、合作伙伴集成和模型许可并存；但不足以据此作出投资判断。Forge 页面显示市场活动有限，访问页面没有 Forge Price 或 Forge Price
              估值；EquityZen
              则把估值和财务详情置于投资者验证之后。两者都不能替代公司财务报表。因此，关键尽调材料应包括客户层面的合同和客户群组数据、按收入来源确认的收入、按部署拆分的收入成本、毛利率、现金、消耗、债务义务，以及 Amazon
              协议中的付款和持续权利安排。在这些记录核对相互冲突的融资数据并量化交易后的经济性之前，收入质量、利润率路径和资本充足性仍是重大未知数。
