            body: >-
              现有证据没有显示 Covariant 自身受到执法行动。GeekWire 提供了一个更窄的警示信号：监管机构正密切关注大型科技公司的“招聘加许可”结构，FTC 据报道还询问了 Amazon 的另一项 Adept
