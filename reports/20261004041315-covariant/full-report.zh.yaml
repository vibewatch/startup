      - number: '5.3'
        title: 硬件模块化、集成商交付与 Amazon 交易后的战略依赖
        blocks:
          - type: paragraph
            body: >-
              Covariant
              技术的核心架构原则是硬件独立。软件可连接全球主要自动化供应商的现成六轴工业机械臂，以及可热插拔的吸盘式或平行夹爪，从而避免专有硬件制造成本和供应链锁定。市场落地高度依赖交钥匙系统集成商，最突出的是奥地利物流自动化龙头
              KNAPP AG。KNAPP 在 26 家企业客户中推广与 Covariant 联合开发的“Pick-it-Easy Robot powered by Covariant AI”，并与其专有的 KiSoft
              仓库管理软件集成。这种生态策略有利于棕地和绿地设施无缝采用，但也引入了严重的结构性依赖。此外，2024 年 8 月 Amazon 交易中，Amazon 取得 Covariant
              机器人基础模型的非独家许可，并招募联合创始人 Pieter Abbeel、Peter Chen、Rocky Duan 以及约 25% 的 Covariant 研究人员，造成了尖锐的技术连续性风险。尽管 CEO
              Ted Stinson 领导下的商业运营仍在继续，但公司失去主要科学架构师后，能否推动下一代基础模型突破，仍是尚未解决的尽调问题。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE008
              - CE009
