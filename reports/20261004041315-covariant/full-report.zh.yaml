      - number: '4.3'
        title: 历史资本不能证明当前流动性
        blocks:
          - type: paragraph
            body: >-
              Forge 和 Tracxn 都报告历史融资约 $222M，可作为有用但未经审计的融资参考点。该数字不等于可用现金：2020 年的一轮融资指定用于扩张和招聘，2021
              年的一份新闻稿也称资金将用于研发和全球增长。BounceWatch 与其他数据库冲突，报告七轮融资累计 $456M，其中包括保留证据无法核对的后续条目。Amazon 在 2024 年招募三位创始人及约四分之一
              Covariant 员工，也进一步破坏了与交易前成本基础的可比性。没有任何保留来源说明当前现金、净消耗、现金跑道、债务、许可收益或未来融资触发条件。
