  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与剩余敞口
        blocks:
          - type: paragraph
            body: >-
              最大风险不是已证实的产品失败，而是 Amazon 招募 Peter Chen、Pieter Abbeel、Rocky Duan 及约四分之一 Covariant
              员工并取得非独家模型许可后产生的组织和合同不确定性。Amazon 表示 Covariant 将继续服务数十家客户，独立报道也将 Ted Stinson 和 Tianhao Zhang
              列为继续领导者，但许可经济性没有披露。这种组合支持高影响连续性评估，却不能证明客户流失、资不抵债或保留的知识产权丧失。公开的人数描述也存在明显冲突，因此当前人员深度应作为尽调事项，而不是可靠的运营指标。热力图因此采用定性可能性和缓释标签，而非建模概率。
