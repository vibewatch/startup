      - number: '3.2'
        title: 直接竞争者画像与在位者规模
        blocks:
          - type: paragraph
            body: >-
              机器人单件拣选的直接竞争分为纯硬件软件集成商和以软件为中心的基础模型平台。在硬件集成自动化领域，Berkshire Grey 和 Zebra Technologies
              在主要零售配送中心占据稳固位置。Berkshire Grey
              的产品组合专注于高速包裹分拣、物品拣选和自动容器处理。其机械吞吐能力强，但历史上要求结构化呈现和明确的料箱几何形状，遇到不可预测的服装或柔性包装时灵活性较低。Zebra Technologies
              则将移动自动化与固定工业扫描结合起来，目标是广泛的库存可见性，而不是自主操作。


              在软件导向的竞争者中，Dexterity 和 Ambi Robotics 等初创企业在包裹处理和组套领域构成直接替代方案。Dexterity 专注于码垛、拆垛和包裹分拣，并与全球包裹承运商建立合作。Ambi
              Robotics 利用仿真到现实迁移和模块化分拣单元，尤其面向电商包裹导入。Covariant 的平台差异在于商用拣选打包应用的广度，覆盖订单分拣、物料导入、货到人拣选、组套和拆垛。虽然在 Series D
              之前其风险融资达到 $222M，但 Covariant 的主要商业风险仍是对 McKesson、Otto Group 和 Radial 等关键账户的客户集中。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP010
              - CP012
      - number: '3.3'
        title: 商业包装、切换成本与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              仓储机器人商业结构主要有两种范式：传统设备采购加维护协议，以及 Robotics-as-a-Service（RaaS）订阅模式。传统仓储集成商通常要求数百万美元的前期资本投入，并采用多年摊销计划。相比之下，AI
              原生供应商常以混合 RaaS 定价部署，在基础硬件租赁和远程监控服务之外，按机器人单元收取每月软件平台费。这会把自动化支出从资产负债表上的资本开支转为运营支出，直接匹配 3PL 客户通常 3 至 5
              年的服务合同。


              尽管运营更灵活，已部署机器人单元的物理切换成本仍然很高。部署机器人拣选工位需要改造仓库传送带、铺设专用三相电力基础设施和气动管线，并加装实体安全屏障，现场安装和调试需要 4 至 8 周。一旦与 SAP
              EWM、Manhattan Associates 或 Blue Yonder 等现有仓库管理系统（WMS）集成，替换就会造成大幅运营停机。Covariant 的长期竞争护城河仍面临严重阻力：Amazon
              非独家取得 Covariant 模型许可并招募其联合创始人，形成了一个强大的专属竞争者，能够在全球最大物流网络中内化基础模型能力；与此同时，独立竞争者也在持续缩小计算机视觉准确率差距。
            claimRefs:
              - CP009
              - CP011
              - CP014
              - CP015
