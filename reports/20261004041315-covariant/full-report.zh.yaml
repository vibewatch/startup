      items:
        - label: 阶段 1：集成商基准测试
          detail: 客户通过 Knapp 或 ABB 等集成商，将 Covariant Brain 与人工拣选基准进行比较。
          touchpoints:
            - 集成商实验室测试
            - SKU 差异评估
            - 拣选速度基准测试
        - label: 阶段 2：试点安装
          detail: 在区域配送设施初步安装单个拣选单元或机器人码垛墙。
          touchpoints:
            - 仓库 WMS 集成
            - 物理单元校准
            - 操作员培训
        - label: 阶段 3：生产上线
          detail: 部署系统在标准运营班次中处理实时消费者订单流。
          touchpoints:
            - 24/7 自主运行
            - 人工干预处理
            - 吞吐量 SLA 监控
        - label: 阶段 4：扩张评估
          detail: 客户根据单位经济性，评估在履约网络内向多设施推广。
          touchpoints:
            - 车队扩张规划
            - 软件维护审查
            - 企业 ROI 验证
        - label: 阶段 5：运营不确定性
          detail: 2024 年 8 月后，核心创始人和工程人才转至 Amazon，采购犹豫随之出现。
          touchpoints:
            - 供应商生存能力审计
            - 向临时管理层升级
            - 合同重新谈判风险
        - label: 阶段 6：合同处理
          detail: 客户决定保留现有工作站，还是冻结未来的自动化资本支出。
          touchpoints:
            - 依赖硬件 OEM 支持
            - 评估替代 AI 模型
            - 续签维护协议
    approximationNotes: 根据报道的客户采用工作流和收购后的公司动荡综合得出的生命周期阶段。
