      - number: '5.2'
        title: 机器人基础模型（RFM-1）、物理仿真与群体学习架构
        blocks:
          - type: paragraph
            body: >-
              驱动平台的核心技术引擎是 RFM-1（Robotics Foundation Model），于 2024 年推出。这是一款拥有 80
              亿参数的多模态序列模型，训练数据涵盖文本、视觉、视频和物理交互轨迹。不同于纯数字基础模型，RFM-1
              充当具身世界模型，预测物理结果并模拟未来场景，例如可变形塑料袋如何移动、圆柱形物体如何在传送带上稳定下来，从而让机器人无需依赖脆弱的手写物理引擎就能规划最优抓取轨迹。该架构支持任意到任意的多模态条件输入，仓库现场人员可以用自然语言指令和直观提示与机器人工作站互动。此外，Covariant
              运行着全球群体学习数据飞轮：当欧洲配送中心的一台机器人遇到陌生 SKU
              并抓取失败时，高分辨率传感器遥测数据和交互轨迹会被采集并传输到云端。模型吸收这一失败案例、更新操作策略，并将轻量模型权重推送到全球机器人群体，让联网部署立即获得适应后的能力。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
