      - number: '3.4'
        title: 展示材料
        blocks:
          - type: callout
            title: Amazon 许可交易带来的战略替代威胁
            body: >-
              Amazon 在 2024 年 8 月招募 Covariant 联合创始人 Peter Chen、Pieter Abbeel 和 Rocky Duan，并取得 Covariant
              基础模型的非独家许可，彻底改变了竞争平衡。Amazon 的履约中心部署着数十万套机器人系统。Amazon 将 Covariant 的基础架构纳入 Fulfillment Technologies &
              Robotics 团队后，既消除了一个潜在的关键技术供应商，也在内部打造了商业 3PL 和竞争零售商无法获得的专属能力。
            calloutType: risk
            claimRefs:
              - CP010
              - CP015
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入机制可见，但收入质量不可见
        blocks:
          - type: paragraph
            body: >-
              保留的证据支持一种以软件为中心的商业模式，但不足以构成已披露的财务画像。BounceWatch 将 Covariant 归类为 B2B SaaS 和平台软件，收入包括订阅、按使用量计费和按绩效计费；一份 2020
              年报告则援引管理层称，Covariant 提供软件，系统合作伙伴提供部署的其余部分。Amazon 在 2024 年通过取得 Covariant
              机器人基础模型的非独家许可，又增加了一个合理的收入来源。这些来源说明的是机制而非经济性：没有保留来源报告客户价格、实际收入组合、合同期限、续约条款、折扣或收入确认政策。因此，重复性收入质量和许可收入贡献仍未得到验证。
