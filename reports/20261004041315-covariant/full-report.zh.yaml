              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV015
      - number: '8.2'
        title: 融资背景与入场纪律
        blocks:
          - type: paragraph
            body: >-
              最强的量化融资事实属于历史，而不是当前价值标记。TechCrunch 报道称，2023 年 4 月的 $75M Series C 延伸轮将累计融资推至 $222M；Tracxn 页面于 2026 年 10 月 2
              日更新，也报告五轮融资累计相同金额。一则存档的 Reddit 帖子还记录了更早的 $40M Series B，以及 2020 年累计融资
              $67M。这些数字描述融资历史，并不能证明可用现金、企业价值、收入或投资者回报。


              现有证据无法观察当前入场经济性。Tracxn 隐藏了最后已知估值，EquityZen 将当前估值、股价、资本表、优先权和财务数据置于账户验证之后，公开报道也没有披露 Amazon
              协议的对价。因此，入场纪律应要求在任何支持“不足证据”以外的估值判断前，取得完全稀释后的资本表、证券层面的优先权、当前现金和债务、经审计或经质量收益审查的财务数据，以及拟议轮次价格。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: 情景、退出准备度与论点破坏触发条件
        blocks:
          - type: paragraph
            body: >-
              由于没有保留来源提供可信的当前价格、收入基础、利润率画像、消耗率或优先股堆叠结构，情景分析必须保持定性。在乐观情景中，客户连续性、集成广度和保留的模型权利转化为经独立验证的续约和改善中的经济性。基准情景是公司继续运营，但团队能力和交易经济性仍存在重大不确定性，价格决策取决于私下尽调。悲观情景是人员转移、权利不清或客户流失，导致独立价值不足以覆盖融资义务。


              EquityZen 描述了一条潜在的私募二级交易路径，并指出 IPO、合并、收购或符合条件的二级交易都可以提供流动性，但其公开页面没有显示 Covariant
              的实时价格或交易量。因此，退出准备度尚未得到证明。论点破坏触发条件是可衡量的：重大客户流失、无法记录保留的 IP
              和模型开发权、无法维持到下一个价值里程碑的现金跑道，或拟议条款将新资金置于未披露优先权之后。通过尽调必须逐项取得触发条件的证据，不能仅凭 Amazon 关系给予叙事溢价。
            claimRefs:
