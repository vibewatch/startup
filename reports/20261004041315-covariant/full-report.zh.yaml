      - number: '2.4'
        title: 采用证据、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              最强的采用证据是方向性的，而非财务性的。公司发布的 2021 年材料称，部署覆盖时装、健康美容、工业供应、制药、杂货、包裹和综合商品。Amazon 在 2024 年 8 月表示，在取得 Covariant
              机器人基础模型许可并招募三位创始人及约四分之一员工后，Covariant
              将继续服务数十家客户。这验证了多垂直行业使用和不小的已安装基础，但不能证明部署盈利能力、续约率或当前增长。市场吸引力取决于两股相反力量：昂贵且波动的仓储工作创造了对适应性操作的需求，但长周期集成、绩效保证、合作伙伴依赖和交易后的组织能力可能拖慢转化并压缩利润率。估值工作应采用经过验证的重复性软件经济性和留存客户证据，而不是宽泛的机器人市场预测或相互冲突的目录收入估算。
            claimRefs:
              - CM006
