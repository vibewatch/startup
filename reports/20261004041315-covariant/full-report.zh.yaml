  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与商业模式
        blocks:
          - type: paragraph
            body: >-
              Covariant（法律实体为 Embodied Intelligence Inc.）由来自 UC Berkeley 和 OpenAI 的机器人研究人员及人工智能科学家于 2017 年创立，创始成员包括
              Peter Chen、Pieter Abbeel、Rocky Duan 和 Tianhao Zhang。公司总部位于加州 Berkeley 和 Emeryville，最初希望打造通用人工智能软件，先以
              Covariant Brain 为品牌，后来扩展为拥有 80 亿参数的 RFM-1 机器人基础模型，帮助商用仓储机器人在动态物流环境中看见、推理并行动。Covariant
              没有直接制造实体机器人手臂或传送带，而是建立了以软件为中心的商业模式，与 ABB、Knapp AG、Bastian Solutions
              等工业自动化和系统集成商合作，在零售、制药和电商配送中心部署自动拣选、putwall 分拣和物料导入。
