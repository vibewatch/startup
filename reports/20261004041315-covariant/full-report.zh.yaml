  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可支持的市场边界是仓储和配送中心的机器人操作，而不是整个工业机器人市场。Covariant 据报道的配置覆盖货到人拣选、机器人 putwall、分拣机导入、组套和拆垛；Covariant
              提供感知和操作智能，集成商则提供机械臂、传送带、安全基础设施和服务。因此，较窄的市场定义包括操作软件、工作单元集成、调试、支持和模型更新；除非属于操作部署的一部分，否则不包括无关的工业机器人、通用输送、仓储基础设施和移动运输。实际替代方案是人工处理、传统的特定任务自动化以及推迟自动化，但现有证据没有量化这些替代方案的支出。医院、工厂、商店、家庭、制造业、农业和食品等更广泛的应用仍只是公司描述的邻近市场，并非当前可服务市场中已证实的组成部分。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
