  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与战略分类
        blocks:
          - type: paragraph
            body: >-
              仓储自动化和履约机器人行业按吞吐量标准化程度与商品目录可变性形成结构性分层。传统物流自动化长期依赖高吞吐、专用传送系统、自动存取系统（AS/RS）和固定料箱分拣机，主要供应商包括 Berkshire
              Grey、Zebra Technologies、Dematic 和 Swisslog。这些传统系统在低混合度、高标准化设施中展现出出色的单位经济性和速度，但需要巨额前期资本支出，投资回收期也往往长达 18 至
              24 个月。因此，合同物流运营商和第三方物流（3PL）供应商长期以来都因客户流失风险高、SKU 结构不断变化，而抵制大规模固定自动化。


              相比之下，以 Covariant 为代表的 AI 原生机器人软件供应商，以及 Ambi Robotics、Dexterity 和 Osaro
              等新兴同行，瞄准中高混合度的操作环境。这些系统使用配备吸取式和多指抓取末端工具的视觉引导机械臂，无需进行物理重新工程，就能动态适应不同客户的商品目录。Covariant 的战略主张是通过 Covariant
              Brain 和 RFM-1 基础模型提供通用操作智能。然而，竞争领域已从同业初创企业扩展到超大规模零售商的内部工程项目，Amazon 在 2024 年 8 月取得 Covariant
              基础模型许可并招募核心技术领导层的交易就是突出例子。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
              - CP010
              - CP013
