      - number: '4.2'
        title: 商业证据显示合作伙伴参与交付，且服务工作量不小
        blocks:
          - type: paragraph
            body: >-
              商业版图有外部迹象，但没有财务转化数据。Amazon 表示，2024 年协议后 Covariant 将继续服务数十家客户；一家联合发布的 2021 年公司新闻稿称，部署覆盖欧洲、北美和亚太地区。LeadIQ
              另行记录了 2024 年与 Amazon
              的合作，但没有提供合同金额。交付模式将自有软件与合作伙伴提供的机器人系统结合起来，说明除软件开发外，还需要承担工程、集成、部署和持续研究成本。公开来源没有量化销售周期、获客成本、实施人力、计算成本、利用率或毛利率，因此无法计算销售效率或贡献利润率。
