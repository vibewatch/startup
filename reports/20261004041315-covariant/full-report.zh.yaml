figures:
  - id: FO001
    title: Covariant 公司演变与里程碑时间线
    type: timeline
    summary: 从 2017 年创立到 2024 年 8 月 Amazon 反向收购式招募期间的关键公司、融资、产品开发和组织里程碑。
    data:
      items:
        - label: 公司成立
          date: '2017'
          detail: Peter Chen、Pieter Abbeel、Rocky Duan 和 Tianhao Zhang 在伯克利创立 Embodied Intelligence Inc.。
          tone: positive
        - label: 走出隐身期与 Covariant Brain
          date: 2020-01
          detail: 公开走出隐身期，并以机器人操作通用 AI 平台的品牌亮相。
          tone: neutral
        - label: B 轮融资
          date: 2020-05
          detail: 完成由 Index Ventures 领投的 $40M B 轮融资，累计融资达到 $67M。
          tone: positive
        - label: C 轮扩张
          date: 2021-07
          detail: 完成由 Index Ventures、Temasek 和 CPPIB 参与的 $80M C 轮融资，扩大全球团队。
          tone: positive
        - label: C1 轮追加融资
          date: 2023-04
          detail: 以据报道 $625M 的估值新增 $75M C 轮追加融资，用于满足积压订单。
          tone: positive
        - label: RFM-1 基础模型发布
          date: 2024-03
          detail: 推出拥有 80 亿参数的机器人基础模型，将互联网数据与物理传感器数据结合起来。
          tone: positive
        - label: Amazon 反向收购式招募
          date: 2024-08
          detail: Amazon 聘用 3 位联合创始人和 25% 的员工，同时获得基础模型许可；Ted Stinson 被任命为 CEO。
          tone: adverse
    approximationNotes: 里程碑日期对应公开新闻稿、新闻申报文件和经核实的公司披露。
    claimRefs:
      - CO001
      - CO003
      - CO005
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
  - id: FM001
    title: 规模证据阶梯：从广泛产能到厂商收入捕获
    type: pyramid
    summary: 六层证据从广泛的机器人活动逐步收窄至 Covariant 的具体收入捕获，同时显出缺乏支持的市场价值推导环节。
    data:
      items:
        - label: 广泛的机器人部署
          value: 806,000 installations/year by 2029
          detail: 覆盖所有行业的全球工业机器人安装量预测；衡量的是数量，不是支出。
        - label: 地理集中度
          value: 'China: 59% of 2025 installations'
          detail: 全球广泛安装基数中的份额；不代表 Covariant 的敞口。
        - label: 仓库操作类别
          value: No isolated public value
          detail: 该类别比工业机器人更窄，但分配到的市场池没有提供可辩护的 TAM。
        - label: 可服务仓库细分市场
          value: No isolated public value
          detail: SAM 需要地理范围、工作流、集成资格和定价信息，而这些信息均未公开。
        - label: 经常性自动化可比对象
          value: 'Locus: estimated $180M ARR'
          detail: 另一种仓库自动化模式；仅作基准，不代表 Covariant 的收入。
        - label: Covariant 收入捕获证据
          value: $32.6M vs. $100M-$250M revenue estimates
          detail: 相互冲突的 2026 年第三方估计；两者都不是 ARR、现金或经审计的市场份额。
    approximationNotes: 这是证据阶梯，而非可加总或按比例缩放的金字塔。各数值使用不同单位和分母；TAM 与 SAM 缺失是明确的证据空白。
