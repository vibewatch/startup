      - number: '4.3'
        title: 缺失指标与投资研判障碍
        blocks:
          - type: paragraph
            body: >-
              公开记录至今未披露
              ARR、毛利率、NRR、烧钱速度、现金跑道或客户集中度。这些并非无足轻重的遗漏，而是决定业务能否支撑其资本结构、以及何种估值倍数才算合理的底层变量。最合理的做法是将公开财务数据视作方向性参考，而非定论。在管理层提供详尽运营数据包之前，所有估值推算都应保持情景分析的形式，切忌预设公开记录能够支撑精确数字。同样的数据缺口还阻碍了严谨现金流模型的搭建，也让任何毛利推演都带有推测性质。因此投资方必然会要求更严格的财务汇报契约。全面尽职调查仍不可或缺。
            claimRefs:
              - CI006
              - CI009
              - CI012
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工作流与功能模块
        blocks:
          - type: paragraph
            body: >-
              Overhaul
              的产品叙事立足于一个明确承诺：从被动观察货运转向主动掌控货运。公开资料在这一点上表述高度一致。平台将可视化、预测性风险情报与合规监控整合进控制塔工作流中，便于调度人员查看货运状态、分级处置异常，并在风险引擎报警时迅速升级响应。收购
              FreightVerify 则让这一叙事更为具象，把工作流直接延伸至单件级追踪与制造端场景，使该产品不再只是单纯的货运预警系统，而是升级为与库存和生产成果深度绑定的全局运营层。
            claimRefs:
