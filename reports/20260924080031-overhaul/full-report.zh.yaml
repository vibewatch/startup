      - number: '5.2'
        title: 系统架构、遥测数据与 AI
        blocks:
          - type: paragraph
            body: >-
              系统架构属于数据密集型且不绑定特定硬件设备。公开说明中提到了
              GPS、电子记录仪（ELD）、温度、震动与倾斜传感器、开关门事件、路线背景、天气、路况及犯罪热力图。这使得其技术优势并不依赖某一种单一传感器，而在于数据接入、风险评分与应急干预的综合能力。RiskGPT 与
              Vision 模块引入了 AI 能力，但其实际表现依然受制于前端遥测数据的质量，以及人工控制塔的运营纪律。若输入数据噪点过多，AI 层的输出上限也就被底层事件处理管线锁死了。
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
      - number: '5.3'
        title: 信任机制、合规性与差异化
        blocks:
          - type: paragraph
            body: >-
              其护城河不仅源自技术，更植根于运营与信任。Overhaul 要求客户共享敏感货运信息，并托付公司处理异常介入、追回甚至部分涉保决策。因此，公开信息中缺少 SOC 2
              或同等合规细节是一个实质性的尽调问题，绝非次要脚注。只要能同时交付端到端工作流、单件级数据与人工处置响应，公司的差异化优势就最突出。基于公开证据，其最薄弱之处在于：除了公司自身的营销宣传外，缺少更深层次的外部背书与开发者验证。实际面临的考验在于，随着货运量与客户预期攀升，这套风控与介入机制能否顺畅完成规模化扩张。
            claimRefs:
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE011
              - CE012
              - CE006
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 明确命名的客户背书
        blocks:
          - type: paragraph
            body: >-
              最强有力的客户佐证，是将具体品牌与落地实效相结合。Overhaul 在 Microsoft 身上做到了这一点，且在官方与第三方渠道中多次明确提及 Bristol Myers Squibb、CEVA 与
              Arvato。覆盖的行业分布也十分合理：汽车、生命科学、医疗健康、物流与高科技行业均面临高昂的货运异常成本，并极度重视运输确定性。相比普通的客户商标墙，这套客户组合说服力更强，因为它证明该平台已深度切入那些试错成本极高的核心业务流中。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU003
              - CU004
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
      - number: '6.2'
        title: 采用轨迹与业务规模
        blocks:
          - type: paragraph
            body: >-
              收购 FreightVerify 显著强化了客户层面的说服力，因为它带来了具体的规模指标，而非仅仅列举客户名称。该收购为公司引入了排名前十的汽车制造商中的六家、约 70,000 名月度用户，以及约 280,000
              处发运网点。这足以说明该平台已超越早期试用阶段，形成了实打实的业务覆盖。100 million
              单的追踪发运量指标尤其具有参考意义，它印证了业务活跃深度，而非单纯的开户数量。即便如此，公开记录仍未披露这些业务量中有多少属于持续性使用，有多少属于一次性集成工作。这一区分至关重要，因为只有循环发生的使用行为才能将规模转化为持久的收入。
            claimRefs:
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: 业务韧性、客户留存与集中度
        blocks:
          - type: paragraph
            body: >-
              缺失的关键一环在于业务韧性。公开渠道看不到任何流失率、续约率、合同周期或头部客户集中度数据，业务韧性依然只能靠推断。其采购决策很可能是由运营部门发起、财务部门把关，尤其在对合规与数据安全要求严苛的受监管垂直行业更是如此。这使得其客户叙事虽具真实性，但尚不完整。在尽调推进中，最有效的下一步是获取详细客户清单，核实实际投产状态、ARR
              占比、续约节点，以及 FreightVerify
              的客户究竟带来了增量，还是仅仅换了个包装重新展示。这些细节能将实质性扩张与停留在口头上的噱头区分开来，同时也能验证该平台黏性是否足以守住定价能力。这正是投资评估的核心所在。
            claimRefs:
              - CU007
              - CU008
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU010
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 外部威胁：需求、监管与竞争
        blocks:
          - type: paragraph
            body: >-
              Overhaul
              的风险特征首先源于其市场建立在代价昂贵的问题之上。货物盗窃频发固然会刺激产品需求，但买方的采购紧迫感也完全与外部货损趋势绑定。第二项风险来自监管层面：一旦公司涉足保险、合规及敏感货运数据，就必须承担严格的行业监管与隐私保护义务，这远比单纯的软件风险更难回避。竞争则是第三重威胁，规模更大的可视化厂商完全可以补齐周边功能，侵蚀其差异化优势。这些风险同时深刻影响着采购周期与合作伙伴尽职调查。
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR010
              - CR012
      - number: '7.2'
        title: 运营与安全风险
        blocks:
          - type: paragraph
            body: >-
              该运营模式并非纯软件驱动。它依赖数据源、系统集成、传感器及人工控制塔的协同，任何一个环节掉链子，都会演变为客户直接可见的运营事故。AI
              还带来了另一重失效模式：误报会干扰正常运营流程，而漏报则可能放过真实威胁。公开记录未明确说明 SOC 2
              认证或隐私防护措施，这导致公司在大企业采购评估中被划入较高风险类别。简而言之，该平台固然实用，但也恰好暴露在客户最敏感的要害部位。局部的微小纰漏可能会层层放大，最终演变为全账户层面的信任危机。
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR012
      - number: '7.3'
        title: 财务风险与一票否决指标
        blocks:
          - type: paragraph
            body: >-
              财务层面的核心风险在于：在公开指标尚不完备的情况下，公司依然需要外部资本输血。August 2025
              轮次中引入的债权进一步收紧了财务纪律，加之缺乏关于留存率、毛利率或集中度的公开数据，根本无法证实其现有资本结构处于安全充裕状态。最切实可行的一票否决标准十分明确：若安全合规文件迟迟无法提供、客户集中度过高，或者利润率过于微薄无法支撑服务团队运营，整个投资逻辑就会遭受实质性削弱。这些正是后续更新需要紧密跟踪的核心问题，资金提供方同样会关注这些压力点。
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              正面投资逻辑十分清晰：Overhaul
              身处痛点真实而明确的赛道，拥有已披露的大企业客户，并将软件、应急响应与保险服务紧密结合，这是纯粹的可视化厂商短期内难以轻易复制的。反向逻辑同样简单直接：公司并未披露测算清晰估值所需的财务基础数据。未公开
              ARR、未公开毛利率，也未公开留存数据，市场固然可以讲故事，但目前还无法在数字上给出实质证明。这促使估值立场转向审慎。
            claimRefs:
              - CV001
              - CV002
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV007
              - CV008
              - CV009
      - number: '8.2'
        title: 资本背景与可比公司基准
        blocks:
          - type: paragraph
            body: >-
              公开资本信息具有参考价值但不完整。公司虽已完成多轮融资，但 August 2025 的 Series C
              轮并未披露投后估值。这迫使估值分析不得不依赖可比公司逻辑，而非明确的交易标价。最贴近的估值锚点是一级市场可视化同业以及更宽泛的供应链软件标杆，但由于 Overhaul
              额外叠加了保险与人工响应服务，这些可比参照物并非完美对标。合理的解读并非断言该公司在绝对意义上便宜还是昂贵，而是公开记录尚不足以让人有把握判定其究竟落在区间哪一端。这一点至关重要，因为 ARR
              或利润率的细微偏差，都会导致最终结论发生剧烈变动。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV011
      - number: '8.3'
        title: 情景推演与决策结论
        blocks:
          - type: paragraph
            body: >-
              务实的估值框架应当基于情景推演。悲观情景假设利润率偏低、缺乏留存数据验证，并给予较低的估值倍数；基准情景假设合理的 ARR 倍数且不设过于激进的预期；乐观情景则要求证实 FreightVerify
              确实拓宽了客户群体，且毛利率足以覆盖服务团队的成本开支。这些假设在如今的公开记录中均无法得到验证。因此当前最合理的投资建议是「继续研究」：该标的足够有吸引力值得保留在追踪名单中，但尚未具备足够透明度以供准确核定估值。价格只是检验工具，并非投资逻辑本身。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV011
