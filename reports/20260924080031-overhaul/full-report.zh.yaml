      - number: '4.2'
        title: 资本结构与融资节奏
        blocks:
          - type: paragraph
            body: >-
              融资节奏是其最清晰的公开财务信号。Overhaul 于 2021 年完成 Series B 轮，2025 年初完成成长期轮次，随后在 August 2025 完成了包含 Series C
              与债权结构的组合融资。这种融资轨迹说明，即便入局多年，公司依然属于重资本投入型业务。债权资金构成了实质门槛，因为它引入了纯股权投资人无需承担的还本付息与债务契约违约风险。August 2025
              轮次未披露估值，导致市场无从判断投资方究竟是溢价加注、平价跟投，还是进行了折价重置。这种不确定性是构建任何投资判断的核心考量。
