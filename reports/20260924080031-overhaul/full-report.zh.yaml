    title: 公司概况
    sections:
      - number: '1.1'
        title: 定位、起源与领导团队
        blocks:
          - type: paragraph
            body: >-
              理解 Overhaul 的最佳切入点，是将其视为一家总部位于 Austin 的供应链软件与服务企业。公司成立于 2016 年，业务已从最初的货运追踪，拓展至安全管理、合规审查与风险干预。公司公开网页始终将
              Barry Conlon 列为 CEO，第三方数据库也将其归类为创始人掌舵的企业，并同样标明其位于
              Austin。公司公开资料反复强调自身并非普通的可视化厂商，其主打的控制塔工作流专为高后果货运打造，而非普通包裹追踪。这种定位至关重要，它解释了为何该平台在未公开披露估值的情况下，仍能打入受监管的高价值垂直行业。
