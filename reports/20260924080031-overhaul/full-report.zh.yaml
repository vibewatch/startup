            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM012
      - number: '2.3'
        title: 市场测算逻辑与不确定性
        blocks:
          - type: paragraph
            body: >-
              公开证据支持采用区间测算而非单一 TAM 数字来界定市场规模。相关预算组合涵盖软件订阅、专业服务及保险周边业务，但这些支出分散在货主、3PL
              以及受监管终端市场之中。因此，尽调的关键不在于市场是否足够「庞大」，而在于当 ROI
              得到验证后，究竟有多少预算能真正从人工监控迁移至高阶监控。最具参考价值的结论是保留了底层假设的有界区间，而非虚假精确的耸动标题。从尽职调查来看，市场规模应当理解为一个与减损证明、理赔纪律及保费预算转化深度绑定的运营区间，而非脱离买方采购行为的风险投资式
              TAM 宣称。这样才能让测算保持诚实。
            claimRefs:
              - CM007
              - CM008
              - CM011
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 同业格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              Overhaul 面临的竞争格局远比常规的可视化候选名单更宽泛。直接竞争对手包括 project44 与 FourKites
              等以软件见长的平台，但实际的替代方案还涵盖车载通信（telematics）公司、防欺诈工具，以及货主内部的人工工作流。这一差异非常关键，因为买方往往先从具体痛点切入，随后才评估是否需要更完备的控制塔平台。当客户不仅想获知货物位置，更想明确后续处置动作、责任归属以及保险如何在响应路径中衔接时，Overhaul
              的竞争壁垒最为稳固。
