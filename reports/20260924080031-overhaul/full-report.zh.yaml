      - number: '1.2'
        title: 融资、规模与资本结构
        blocks:
          - type: paragraph
            body: >-
              相较于当前估值，公开融资脉络能提供更多有效信息。Overhaul 于 2021 年完成 $35 million Series B 轮融资，随后在 2025 年初完成一轮成长期融资，并在 August 2025
              完成包含 MidCap Financial 债权在内的 $105 million Series C 轮融资。Sacra 与 Tracxn
              对其累计融资金额存在分歧——这在非公开融资轮次、债权与未披露份额相互交织时屡见不鲜——但两者均表明该企业资金充裕。核心结论不在于具体的融资金额数字，而在于公司持续筹集资本的同时不断叠加周边服务，说明公司倾向于靠融资支撑产品线扩张，而非收紧平台投入。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO009
      - number: '1.3'
        title: 里程碑与待解问题
        blocks:
          - type: paragraph
            body: >-
              本轮更新中最重大的里程碑是收购 FreightVerify，该交易显著拓展了公司在汽车制造领域与零部件级可视化的业务版图。相关证据也指向一个更广泛的问题：尽管经历了多轮公开融资，Overhaul
              仍未披露当前估值，且各公开数据库对累计融资总额意见不一。也就是说，其资本运作脉络比股权结构更清晰。从尽调视角看，核心待解疑问在于：创始人兼 CEO 的股权架构是否稳固、August 2025
              轮融资背后的债权条款如何约束，以及公开记录之外是否发生过估值重置。
            claimRefs:
              - CO010
              - CO011
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状
        blocks:
          - type: paragraph
            body: >-
              评估 Overhaul
              的市场规模，不应将其归入通用的运输管理软件。更具参考价值的边界，在于可视化、应急干预与风险转移相互重叠的切入场景：高价值货运、高时效货运，以及一旦出险就会造成可衡量损失的受监管货运。这一界定契合公开资料中防范货物盗窃、打击货运欺诈与合规监控的叙事。当前行业现状仍是远程车载信息系统（telematics）、电子表格、承运人电话催办以及保险补救方案的机械拼凑；真正的市场空间，在于将过去被动处置的支出转移至实时受控的控制塔平台。
