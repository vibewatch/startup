      - number: '3.2'
        title: 差异化与定价逻辑
        blocks:
          - type: paragraph
            body: >-
              公司的差异化优势不在于单纯的追踪覆盖广度，而在于将人工干预、保险与货物安全工作流深度融合。这种复合能力支撑了溢价空间，因为买方买单的是避免损失的结果，而非一个可视化看板。FreightVerify
              补上了另一块拼图：单件级追踪与制造端应用场景，将竞争切入点拓宽至汽车与医疗健康工作流。核心问题在于对手能否单纯靠软件复制这套组合拳。如果能，其护城河就会收窄；如果不能，Overhaul
              的一体化运营模式便能确保平台始终领先于单点工具。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP011
      - number: '3.3'
        title: 护城河韧性与竞争风险
        blocks:
          - type: paragraph
            body: >-
              主要的竞争风险来自大型平台引发的通用化与同质化。可视化巨头可以补齐异常事件管理，而车载信息厂商则能从承运人端向上延伸。Overhaul
              的护城河在于人工在环的处置响应机制与保险经济效益，这比单纯的软件功能更难仿造。但这一防线的前提，是客户持续为风险处置干预付费，而非仅仅为了货运追踪买单。因此最核心的尽调问题非常直接：Overhaul
              凭借运营模式在哪些场景能够胜出，而在哪些场景下，买方使用更便宜的可视化工具或内部人工流程也同样能满足需求？该问题的答案决定了其护城河属于底层结构壁垒，还是仅仅是一层包装。这正是竞争维度的试金石：唯有服务质量显性胜出，买方才愿意持续付费。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商业化
        blocks:
          - type: paragraph
            body: >-
              Overhaul
              的变现途径主要有三种：软件订阅、保险经纪与监控服务。围绕同一起货运事件撬动多重收入杠杆固然具备吸引力，但也给毛利分析带来了难度。公开记录显示，该平台的收费主要挂钩发货量与功能模块，而非简单的按人头（per-seat）订阅。因此不能将公开估值生搬硬套到纯
              SaaS 的分析框架中。财务端的核心问题在于：服务层究竟是能持续拉升利润率的高附加值利器，还是一个仅在高增长掩盖下显得光鲜的人工劳动包袱。
