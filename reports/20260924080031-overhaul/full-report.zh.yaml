companyProfile:
  summary: >-
    Overhaul 成立于 2016 年，总部位于
    Austin，是一家整合了货运可视化、货物风险管理、合规监控与人工控制塔运营的供应链软件与服务企业。公开资料将其定位为超越单纯追踪工具的厂商：它面向高后果货运销售侧重响应处置的工作流，并在核心产品之上叠加了保险经纪与周边监控服务。公开记录支持其已获得大企业落地并于
    2025 年完成了重大融资，但公司披露的运营细节仍不够充分，无法支持清晰的估值判断。
  foundedDate: '2016-01-01'
  founders:
    - name: Barry Conlon
      role: CEO 兼创始人
      background: 公司公告与融资发布中均公开将其列为核心负责人。
      claimRefs:
        - CO004
  foundingLocation: Austin, Texas, United States
