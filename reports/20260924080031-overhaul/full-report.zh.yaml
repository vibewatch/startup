      - number: '2.2'
        title: 需求驱动因素与落地瓶颈
        blocks:
          - type: paragraph
            body: >-
              最强劲的需求驱动来自损失防范：当盗窃或货损成本足够高昂时，买方就有充分理由采购一套能压低事故率并提升追回率的专用系统。第二个驱动因素是保险经济效益：按照买方主张，保费节约与更严苛的理赔合规纪律，将风险管理转变为算得清账的财务讨论。制约因素同样现实：产品必须按运输线路逐条证明
              ROI、融入既有运营流程，并通过合规或法务审查。正因如此，该市场虽在扩张，但依然高度聚焦且偏重运营交付，绝非大众型通用 SaaS。
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM010
              - CM012
