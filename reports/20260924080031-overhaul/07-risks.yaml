sections:
- id: external-threats
  title: 'External threats: demand, regulation, and competition'
  body: 'Overhaul’s risk profile starts with the fact that its market is built around expensive problems. Cargo theft can
    increase the need for the product, but it also means the company lives in an environment where buyer urgency is tied to
    external loss trends. The second risk is regulatory: as soon as the company touches insurance, compliance, and sensitive
    freight data, it inherits supervision and privacy obligations that are harder to hide from than ordinary software risk.
    Competition is the third threat, because larger visibility vendors can add adjacent capabilities and erode differentiation.
    These risks also shape procurement cycles and partner diligence.'
  claimRefs:
  - CR001
  - CR002
  - CR010
  - CR011
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-and-security
  title: Operational and security risk
  body: 'The operational model is not purely software. It depends on data feeds, integrations, sensors, and a human control
    tower, which means a failure in any one layer can create a customer-visible incident. AI adds another failure mode: false
    positives can disrupt operations while false negatives can miss real threats. The fact that the public record does not
    clearly spell out SOC 2 or privacy posture keeps the company in a higher-risk bucket for enterprise procurement. In short,
    the platform is useful, but it is also exposed at the exact point where customers are most sensitive. Small failures can
    cascade into larger account-level trust problems.'
  claimRefs:
  - CR003
  - CR006
  - CR007
  - CR008
  - CR012
  tableRefs:
  - TR002
- id: financial-and-kill-criteria
  title: Financial risk and kill criteria
  body: 'The financial risk is that the company still needs outside capital while public metrics remain incomplete. Debt in
    the August 2025 round adds another layer of discipline, and the absence of public retention, margin, or concentration
    data makes it impossible to prove the capital stack is comfortable. The most useful kill criteria are straightforward:
    if security documentation remains unavailable, if customer concentration is extreme, or if margins are too thin to support
    the service layer, then the thesis weakens materially. Those are the exact issues to monitor in the next refresh. Capital
    providers will care about the same stress points.'
  claimRefs:
  - CR004
  - CR005
  - CR009
  - CR012
  tableRefs:
  - TR003
