companyProfile:
  summary: >-
    Overhaul is an Austin-based supply-chain software and services company founded in 2016 that combines shipment
    visibility, cargo-risk management, compliance monitoring, and human control-tower operations. Public materials
    position the company as more than a tracking tool: it sells a response-oriented workflow for high-consequence
    freight, with insurance brokerage and adjacent monitoring services layered on top. The public record supports
    enterprise adoption and a meaningful 2025 funding event, but the company still does not disclose enough operating
    detail to underwrite a clean valuation.
  foundedDate: '2016-01-01'
  founders:
    - name: Barry Conlon
      role: CEO and founder
      background: Publicly cited as the company leader in company and financing announcements.
      claimRefs:
        - CO004
  foundingLocation: Austin, Texas, United States
  headquarters: Austin, Texas, United States
  productSummary: Shipment visibility, cargo risk management, compliance monitoring, and human-in-the-loop control tower operations.
  customerFocus: Enterprise shippers, 3PLs, automotive manufacturers, and regulated freight operators.
  businessModel: B2B software subscriptions, insurance brokerage, and monitoring / control-tower services.
  stage: late-stage private
  fundingStatus: >-
    Public sources support a $105 million Series C in August 2025 with MidCap debt and conflicting total-funding
    estimates ranging from roughly $215 million to $271 million.
  disclosureProfile: private-undisclosed
  claimRefs:
    - CO001
    - CO005
    - CO006
    - CO011
    - CO012
chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origin, and leadership
        blocks:
          - type: paragraph
            body: >-
              Overhaul is best understood as an Austin-based supply-chain software and services company that started in
              2016 and has since broadened from tracking shipments to managing security, compliance, and risk
              intervention. Public company pages consistently present Barry Conlon as the CEO, while third-party
              databases describe the business as founder-led and highlight the same Austin base. The company’s public
              materials also emphasize that it is not a generic visibility vendor: it markets a control-tower workflow
              designed for high-consequence cargo rather than commodity parcel tracking. That positioning matters
              because it explains why the platform can sell into regulated, high-value verticals even without a
              disclosed public valuation.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO011
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO006
              - CO007
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO006
              - CO010
      - number: '1.2'
        title: Funding, scale, and capital structure
        blocks:
          - type: paragraph
            body: >-
              The public funding trail is more informative than the current valuation. Overhaul secured a $35 million
              Series B in 2021, followed by a 2025 growth round and then the August 2025 $105 million Series C that
              included MidCap Financial debt. Sacra and Tracxn disagree on total funding, which is common when private
              rounds, debt, and undisclosed tranches are mixed together, but both point to a heavily capitalized
              business. The important takeaway is not the exact top-line total; it is that the company has continued to
              raise capital while layering in adjacent services, suggesting a strategy of financing product breadth
              rather than starving the platform.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO009
      - number: '1.3'
        title: Milestones and unresolved questions
        blocks:
          - type: paragraph
            body: >-
              The most meaningful milestone in the current refresh is the FreightVerify acquisition, because it
              materially expands the product’s footprint into automotive manufacturing and part-level visibility. The
              evidence also points to a broader issue: despite multiple public funding events, Overhaul still does not
              disclose a current valuation, and public databases disagree on total funding. That means the capital story
              is clearer than the ownership story. For diligence, the open questions are whether the founder / CEO
              ownership structure is stable, how debt sits behind the August 2025 round, and whether any valuation reset
              occurred off the public record.
            claimRefs:
              - CO010
              - CO011
              - CO012
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              Overhaul should not be sized as generic transportation management software. The more useful boundary is
              the wedge where visibility, intervention, and risk transfer overlap: high-value freight, time-sensitive
              freight, and regulated freight that creates a measurable cost when it goes wrong. That framing is
              consistent with public language around cargo theft, freight fraud, and compliance monitoring. The status
              quo is still a stack of telematics, spreadsheets, carrier calls, and insurance workarounds, so the real
              market is the spend that shifts from reactive processes to a monitored control plane.
            claimRefs:
              - CM001
              - CM005
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM005
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM006
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM011
      - number: '2.2'
        title: Demand drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest demand driver is loss prevention: when theft or damage is expensive enough, buyers can
              justify a dedicated system that reduces incidents and improves recovery. A second driver is insurance
              economics, because premium savings and better claims discipline turn risk management into a financial
              conversation. The constraints are just as real: the product must prove ROI lane by lane, integrate into
              existing operations, and satisfy compliance or legal review. That is why the market is expanding, but
              still selective and operationally intensive rather than mass-market SaaS.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM012
      - number: '2.3'
        title: Sizing logic and uncertainty
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a range-based sizing approach rather than a single TAM number. The relevant
              budget mix includes software subscriptions, services, and an insurance adjacency, but the spend is spread
              across shippers, 3PLs, and regulated end markets. That means the right diligence question is not whether
              the market is “large”; it is how much of the budget actually moves from manual monitoring to premium
              monitoring when ROI is proven. The most useful output is a bounded range with assumptions preserved, not a
              false-precision headline. The implication for diligence is that market size should be read as an operating
              range tied to proof of loss reduction, claims discipline, and premium spend conversion, not as a
              venture-style TAM claim detached from buyer behavior. This keeps the sizing honest.
            claimRefs:
              - CM007
              - CM008
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Peer landscape and substitutes
        blocks:
          - type: paragraph
            body: >-
              Overhaul’s competitive set is broader than the usual visibility market shortlist. The direct peers are
              software-led platforms such as project44 and FourKites, but the practical substitutes also include
              telematics companies, fraud-detection tools, and manual workflows inside the shipper’s own operation. That
              matters because buyers often start with a narrow problem and then decide whether they need a broader
              control plane. Overhaul’s position is strongest when the customer wants not only to know where freight is,
              but also what to do next, who is accountable, and how insurance fits into the response path.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP008
              - CP009
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP006
      - number: '3.2'
        title: Differentiation and pricing logic
        blocks:
          - type: paragraph
            body: >-
              The company’s differentiator is not raw tracking coverage; it is the blend of intervention, insurance, and
              cargo-security workflow. That blend can support premium pricing because the buyer is buying avoided loss,
              not just a dashboard. FreightVerify adds another layer: item-level and manufacturing use cases that
              broaden the competitive wedge into auto and healthcare workflows. The key question is whether competitors
              can replicate enough of this stack with software alone. If they can, the moat narrows. If they cannot,
              Overhaul’s integrated operating model keeps the platform above point-solutions.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP011
      - number: '3.3'
        title: Moat durability and risk
        blocks:
          - type: paragraph
            body: >-
              The main competitive risk is commoditization by larger platforms. Visibility players can add exception
              management, while telematics vendors can climb the stack from the carrier side. Overhaul’s defense is that
              its human-in-the-loop response and insurance economics are harder to copy than software features alone.
              But that defense is only durable if customers keep paying for intervention and not just tracking. The most
              useful diligence question is therefore simple: where does Overhaul win because of its operating model, and
              where would a buyer be just as well served by a cheaper visibility tool or in-house process? The answer
              determines whether the moat is structural or merely packaging. That is the competitive test. Buyers will
              pay only where service quality is visibly superior.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Overhaul appears to monetize in three distinct ways: software subscription, insurance brokerage, and
              monitoring services. That is attractive because it creates multiple revenue levers around the same freight
              event, but it also makes margin analysis harder. The public record suggests the platform is sold against
              shipment volume and feature set rather than a simple per-seat license. That means public valuation should
              not be forced into a pure SaaS template. The right financial question is whether the services layer is a
              durable margin enhancer or a labor-intensive drag that only looks attractive while growth is strong.
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI010
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI004
              - CI009
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI008
      - number: '4.2'
        title: Capital structure and financing cadence
        blocks:
          - type: paragraph
            body: >-
              The financing cadence is the clearest public financial signal. Overhaul raised a Series B in 2021, a
              growth round in early 2025, and a Series C plus debt stack in August 2025. That pattern says the company
              is still capital-intensive even after years in market. Debt adds a real hurdle because it introduces
              repayment and covenant risk that pure-equity investors do not face. The absence of a disclosed valuation
              in the August 2025 round means the market cannot tell whether investors paid up, held flat, or reset
              lower. That uncertainty is central to any underwriting view.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI007
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI005
      - number: '4.3'
        title: Missing metrics and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The open record still does not reveal ARR, gross margin, NRR, burn, runway, or customer concentration.
              Those are not minor missing pieces; they are the variables that determine whether the business can support
              its capital stack and what kind of valuation multiple is reasonable. The best interpretation is to treat
              public financial data as directionally informative, not definitive. Until management shares an operating
              package, all valuation work should stay in scenario form rather than pretending that the public record
              supports exact numbers. That same gap also blocks a credible cash-flow bridge and makes any margin bridge
              speculative. Investors would therefore insist on tighter reporting covenants. Full diligence still
              required.
            claimRefs:
              - CI006
              - CI009
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow and modules
        blocks:
          - type: paragraph
            body: >-
              Overhaul’s product story is built around a simple promise: move from observing freight to actively
              controlling freight. The public material is unusually consistent on that point. The platform combines
              visibility, predictive risk intelligence, and compliance monitoring in a control-tower workflow that lets
              operators see shipment status, triage exceptions, and escalate when the risk engine flags a problem.
              FreightVerify makes the story more specific by extending the workflow into item-level and manufacturing
              use cases, which means the product is no longer just a freight alerting system; it is a broader
              operational layer tied to inventory and production outcomes.
            claimRefs:
              - CE001
              - CE002
              - CE007
              - CE009
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE006
              - CE010
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
      - number: '5.2'
        title: Architecture, telemetry, and AI
        blocks:
          - type: paragraph
            body: >-
              The architecture is data-heavy and device-agnostic. Public descriptions reference GPS, electronic logging
              devices, temperature, shock and tilt sensors, door events, route context, weather, traffic, and crime heat
              maps. That makes the technical edge less about one sensor and more about the combination of ingestion,
              scoring, and intervention. RiskGPT and the Vision module add an AI layer, but they are still bounded by
              the quality of the incoming telemetry and the operating discipline of the human control tower. If those
              inputs are noisy, the AI layer can only be as good as the underlying event pipeline.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
      - number: '5.3'
        title: Trust, compliance, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The moat is not just technical; it is operational and trust-based. Overhaul is asking customers to share
              sensitive shipment information and rely on the company for exception handling, recovery, and in some cases
              insurance-related decisions. That means the public lack of SOC 2 or equivalent detail is a real diligence
              question, not a footnote. The company’s differentiation is strongest where it can show end-to-end workflow
              plus item-level data plus response. The weakest point, based on public evidence, is the depth of external
              trust and developer proof beyond the company’s own marketing surface. The practical question is whether
              these controls scale cleanly as freight volume and customer expectations rise.
            claimRefs:
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE011
              - CE012
              - CE006
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Named customer proof
        blocks:
          - type: paragraph
            body: >-
              Customer proof is strongest when it combines a named logo with a concrete outcome. Overhaul has that for
              Microsoft, and it has repeated named references for Bristol Myers Squibb, CEVA, and Arvato across official
              and third-party sources. The vertical mix is also coherent: automotive, life sciences, healthcare,
              logistics, and high tech all face expensive freight exceptions and a premium on reliability. That is a
              better proof set than a generic logo wall because it shows the platform is already being used in workflows
              where failure is expensive.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU003
              - CU004
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU007
      - number: '6.2'
        title: Adoption trajectory and scale
        blocks:
          - type: paragraph
            body: >-
              FreightVerify materially improves the customer narrative because it adds scale metrics rather than just
              logos. The acquisition brought in six of the top ten automotive manufacturers, around 70,000 monthly
              users, and about 280,000 shipping locations. That is enough to say the platform is not just being tested;
              it is being used in a meaningful operational footprint. The 100 million tracked shipment figure is
              especially useful because it shows activity depth, not just account count. Even so, the public record
              still does not show how much of that activity is recurring versus one-off integration work. The
              distinction matters because recurring usage is what turns scale into durable revenue.
            claimRefs:
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: Durability, retention, and concentration
        blocks:
          - type: paragraph
            body: >-
              The missing piece is durability. We do not see public churn, renewal, contract-length, or top-customer
              concentration data, which means the durability story remains inferential. The buying motion is likely
              operations-led but finance-validated, especially in regulated verticals where compliance and data handling
              matter. That makes the customer story real but not complete. In diligence, the most useful next step is a
              customer roster that shows production status, ARR share, renewal timing, and whether FreightVerify
              customers are additive or simply re-labeled proof points. These details separate real expansion from
              headline-only proof. They also show whether the platform is sticky enough to defend pricing. That is the
              underwriting core.
            claimRefs:
              - CU007
              - CU008
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'External threats: demand, regulation, and competition'
        blocks:
          - type: paragraph
            body: >-
              Overhaul’s risk profile starts with the fact that its market is built around expensive problems. Cargo
              theft can increase the need for the product, but it also means the company lives in an environment where
              buyer urgency is tied to external loss trends. The second risk is regulatory: as soon as the company
              touches insurance, compliance, and sensitive freight data, it inherits supervision and privacy obligations
              that are harder to hide from than ordinary software risk. Competition is the third threat, because larger
              visibility vendors can add adjacent capabilities and erode differentiation. These risks also shape
              procurement cycles and partner diligence.
            claimRefs:
              - CR001
              - CR002
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR010
              - CR012
      - number: '7.2'
        title: Operational and security risk
        blocks:
          - type: paragraph
            body: >-
              The operational model is not purely software. It depends on data feeds, integrations, sensors, and a human
              control tower, which means a failure in any one layer can create a customer-visible incident. AI adds
              another failure mode: false positives can disrupt operations while false negatives can miss real threats.
              The fact that the public record does not clearly spell out SOC 2 or privacy posture keeps the company in a
              higher-risk bucket for enterprise procurement. In short, the platform is useful, but it is also exposed at
              the exact point where customers are most sensitive. Small failures can cascade into larger account-level
              trust problems.
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR008
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR012
      - number: '7.3'
        title: Financial risk and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The financial risk is that the company still needs outside capital while public metrics remain incomplete.
              Debt in the August 2025 round adds another layer of discipline, and the absence of public retention,
              margin, or concentration data makes it impossible to prove the capital stack is comfortable. The most
              useful kill criteria are straightforward: if security documentation remains unavailable, if customer
              concentration is extreme, or if margins are too thin to support the service layer, then the thesis weakens
              materially. Those are the exact issues to monitor in the next refresh. Capital providers will care about
              the same stress points.
            claimRefs:
              - CR004
              - CR005
              - CR009
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is straightforward: Overhaul operates in a real, painful market, has named enterprise
              customers, and combines software with response and insurance in a way that is difficult for pure
              visibility vendors to copy quickly. The anti-thesis is just as straightforward: the company has not
              published the financial inputs needed to underwrite a clean valuation. No public ARR, no public gross
              margin, and no public retention data means the market can tell a story, but it cannot yet prove the math.
              That pushes the valuation stance toward caution.
            claimRefs:
              - CV001
              - CV002
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV007
              - CV008
              - CV009
      - number: '8.2'
        title: Capital context and comparable anchors
        blocks:
          - type: paragraph
            body: >-
              The public capital context is helpful but incomplete. The company has raised multiple rounds, yet the
              August 2025 Series C did not disclose a post-money valuation. That forces valuation work to rely on comp
              logic rather than headline price. The most relevant anchors are private-market visibility peers and
              broader supply-chain software marks, but those comps are imperfect because Overhaul layers in insurance
              and human response. The right reading is not that the company is cheap or expensive in absolute terms; it
              is that the public record is not sufficient to say with confidence which side of the range it belongs on.
              That matters because even a small variance in ARR or margin could move the conclusion materially.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV011
      - number: '8.3'
        title: Scenario framing and decision
        blocks:
          - type: paragraph
            body: >-
              A sensible valuation frame is scenario-based. A bear case assumes weak margin, limited retention proof,
              and a lower multiple; a base case assumes a reasonable ARR multiple with no heroic assumptions; a bull
              case requires proof that FreightVerify expands the customer base and that margins remain healthy enough to
              support the service layer. Those assumptions are not visible in the public record today. That is why the
              right recommendation is research-more: the business is interesting enough to keep on the list, but not yet
              transparent enough to price confidently. Price is a check, not the thesis.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV011
