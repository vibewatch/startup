sections:
- id: identity-and-origin
  title: Identity, origin, and leadership
  body: 'Overhaul is best understood as an Austin-based supply-chain software and services company that started in 2016 and
    has since broadened from tracking shipments to managing security, compliance, and risk intervention. Public company pages
    consistently present Barry Conlon as the CEO, while third-party databases describe the business as founder-led and highlight
    the same Austin base. The company’s public materials also emphasize that it is not a generic visibility vendor: it markets
    a control-tower workflow designed for high-consequence cargo rather than commodity parcel tracking. That positioning matters
    because it explains why the platform can sell into regulated, high-value verticals even without a disclosed public valuation.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  tableRefs:
  - TO001
  - TO002
  - TO003
  figureRefs:
  - FO001
- id: funding-and-scale
  title: Funding, scale, and capital structure
  body: The public funding trail is more informative than the current valuation. Overhaul secured a $35 million Series B in
    2021, followed by a 2025 growth round and then the August 2025 $105 million Series C that included MidCap Financial debt.
    Sacra and Tracxn disagree on total funding, which is common when private rounds, debt, and undisclosed tranches are mixed
    together, but both point to a heavily capitalized business. The important takeaway is not the exact top-line total; it
    is that the company has continued to raise capital while layering in adjacent services, suggesting a strategy of financing
    product breadth rather than starving the platform.
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO009
- id: milestones-and-open-questions
  title: Milestones and unresolved questions
  body: 'The most meaningful milestone in the current refresh is the FreightVerify acquisition, because it materially expands
    the product’s footprint into automotive manufacturing and part-level visibility. The evidence also points to a broader
    issue: despite multiple public funding events, Overhaul still does not disclose a current valuation, and public databases
    disagree on total funding. That means the capital story is clearer than the ownership story. For diligence, the open questions
    are whether the founder / CEO ownership structure is stable, how debt sits behind the August 2025 round, and whether any
    valuation reset occurred off the public record.'
  claimRefs:
  - CO010
  - CO011
  - CO012
