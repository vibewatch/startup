sections:
- id: named-customers
  title: Named customer proof
  body: 'Customer proof is strongest when it combines a named logo with a concrete outcome. Overhaul has that for Microsoft,
    and it has repeated named references for Bristol Myers Squibb, CEVA, and Arvato across official and third-party sources.
    The vertical mix is also coherent: automotive, life sciences, healthcare, logistics, and high tech all face expensive
    freight exceptions and a premium on reliability. That is a better proof set than a generic logo wall because it shows
    the platform is already being used in workflows where failure is expensive.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU009
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: adoption-and-scale
  title: Adoption trajectory and scale
  body: FreightVerify materially improves the customer narrative because it adds scale metrics rather than just logos. The
    acquisition brought in six of the top ten automotive manufacturers, around 70,000 monthly users, and about 280,000 shipping
    locations. That is enough to say the platform is not just being tested; it is being used in a meaningful operational footprint.
    The 100 million tracked shipment figure is especially useful because it shows activity depth, not just account count.
    Even so, the public record still does not show how much of that activity is recurring versus one-off integration work.
    The distinction matters because recurring usage is what turns scale into durable revenue.
  claimRefs:
  - CU004
  - CU005
  - CU006
- id: durability-and-risk
  title: Durability, retention, and concentration
  body: The missing piece is durability. We do not see public churn, renewal, contract-length, or top-customer concentration
    data, which means the durability story remains inferential. The buying motion is likely operations-led but finance-validated,
    especially in regulated verticals where compliance and data handling matter. That makes the customer story real but not
    complete. In diligence, the most useful next step is a customer roster that shows production status, ARR share, renewal
    timing, and whether FreightVerify customers are additive or simply re-labeled proof points. These details separate real
    expansion from headline-only proof. They also show whether the platform is sticky enough to defend pricing. That is the
    underwriting core.
  claimRefs:
  - CU007
  - CU008
  - CU010
  - CU011
  - CU012
  tableRefs:
  - TU003
