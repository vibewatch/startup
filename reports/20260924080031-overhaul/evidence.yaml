evidenceGaps:
  - type: missing-source
    severity: material
    topic: ownership and cap-table
    missingEvidence: A current cap table or management presentation clarifying founder ownership and board composition.
    whyItMatters: Founder identity and ownership concentration affect governance and liquidity judgment.
    diligencePath: Request a current cap-table summary and board roster in the data room.
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: market sizing
    missingEvidence: A public, source-backed TAM/SAM/SOM model that isolates cargo security from general logistics software.
    whyItMatters: A broad logistics TAM would overstate the investable market for Overhaul.
    diligencePath: Build a bottoms-up model from cargo-loss exposure, insurance spend, and high-consequence freight volumes.
  - type: private-evidence-only
    severity: material
    topic: public financials
    missingEvidence: Audited ARR, gross margin, NRR, burn, and runway.
    whyItMatters: Those inputs determine whether the capital stack is supportable and how durable the business model is.
    diligencePath: Request a management financial package and cohort / margin bridge.
  - type: private-evidence-only
    severity: material
    topic: trust controls
    missingEvidence: A public SOC 2 / privacy / DPA / security posture statement.
    whyItMatters: The platform handles sensitive shipment and customer data, so trust controls are central to enterprise adoption.
    diligencePath: Request security and privacy docs, plus any third-party certifications.
  - type: private-evidence-only
    severity: material
    topic: customer concentration
    missingEvidence: Top-10 customer concentration, renewal cadence, and contract length.
    whyItMatters: Durability and concentration are central to whether named logos translate into reliable revenue.
    diligencePath: Request a customer roster with ARR share, contract dates, and renewal history.
  - type: private-evidence-only
    severity: material
    topic: security and compliance posture
    missingEvidence: Public SOC 2 / GDPR / DPA / breach-response documentation.
    whyItMatters: This is the main enterprise trust blocker for a freight-data platform.
    diligencePath: Request the security and privacy packet from management.
  - type: private-evidence-only
    severity: blocking
    topic: valuation inputs
    missingEvidence: ARR, gross margin, NRR, debt terms, and concentration data.
    whyItMatters: Without those inputs, any exact valuation number would be false precision.
    diligencePath: Request the financial package and customer concentration schedule before sizing the position.
