sections:
- id: workflow-and-modules
  title: Workflow and modules
  body: 'Overhaul’s product story is built around a simple promise: move from observing freight to actively controlling freight.
    The public material is unusually consistent on that point. The platform combines visibility, predictive risk intelligence,
    and compliance monitoring in a control-tower workflow that lets operators see shipment status, triage exceptions, and
    escalate when the risk engine flags a problem. FreightVerify makes the story more specific by extending the workflow into
    item-level and manufacturing use cases, which means the product is no longer just a freight alerting system; it is a broader
    operational layer tied to inventory and production outcomes.'
  claimRefs:
  - CE001
  - CE002
  - CE007
  - CE009
  tableRefs:
  - TE001
  - TE002
  figureRefs:
  - FE001
- id: architecture-and-ai
  title: Architecture, telemetry, and AI
  body: The architecture is data-heavy and device-agnostic. Public descriptions reference GPS, electronic logging devices,
    temperature, shock and tilt sensors, door events, route context, weather, traffic, and crime heat maps. That makes the
    technical edge less about one sensor and more about the combination of ingestion, scoring, and intervention. RiskGPT and
    the Vision module add an AI layer, but they are still bounded by the quality of the incoming telemetry and the operating
    discipline of the human control tower. If those inputs are noisy, the AI layer can only be as good as the underlying event
    pipeline.
  claimRefs:
  - CE003
  - CE004
  - CE005
  - CE006
- id: trust-and-differentiation
  title: Trust, compliance, and differentiation
  body: The moat is not just technical; it is operational and trust-based. Overhaul is asking customers to share sensitive
    shipment information and rely on the company for exception handling, recovery, and in some cases insurance-related decisions.
    That means the public lack of SOC 2 or equivalent detail is a real diligence question, not a footnote. The company’s differentiation
    is strongest where it can show end-to-end workflow plus item-level data plus response. The weakest point, based on public
    evidence, is the depth of external trust and developer proof beyond the company’s own marketing surface. The practical
    question is whether these controls scale cleanly as freight volume and customer expectations rise.
  claimRefs:
  - CE010
  - CE011
  - CE012
  tableRefs:
  - TE003
