sections:
- id: thesis-antithesis
  title: Thesis and anti-thesis
  body: 'The thesis is straightforward: Overhaul operates in a real, painful market, has named enterprise customers, and combines
    software with response and insurance in a way that is difficult for pure visibility vendors to copy quickly. The anti-thesis
    is just as straightforward: the company has not published the financial inputs needed to underwrite a clean valuation.
    No public ARR, no public gross margin, and no public retention data means the market can tell a story, but it cannot yet
    prove the math. That pushes the valuation stance toward caution.'
  claimRefs:
  - CV001
  - CV002
  - CV006
  tableRefs:
  - TV001
  - TV002
  figureRefs:
  - FV001
- id: capital-and-comps
  title: Capital context and comparable anchors
  body: The public capital context is helpful but incomplete. The company has raised multiple rounds, yet the August 2025
    Series C did not disclose a post-money valuation. That forces valuation work to rely on comp logic rather than headline
    price. The most relevant anchors are private-market visibility peers and broader supply-chain software marks, but those
    comps are imperfect because Overhaul layers in insurance and human response. The right reading is not that the company
    is cheap or expensive in absolute terms; it is that the public record is not sufficient to say with confidence which side
    of the range it belongs on. That matters because even a small variance in ARR or margin could move the conclusion materially.
  claimRefs:
  - CV003
  - CV004
  - CV005
  - CV011
- id: scenario-and-decision
  title: Scenario framing and decision
  body: 'A sensible valuation frame is scenario-based. A bear case assumes weak margin, limited retention proof, and a lower
    multiple; a base case assumes a reasonable ARR multiple with no heroic assumptions; a bull case requires proof that FreightVerify
    expands the customer base and that margins remain healthy enough to support the service layer. Those assumptions are not
    visible in the public record today. That is why the right recommendation is research-more: the business is interesting
    enough to keep on the list, but not yet transparent enough to price confidently. Price is a check, not the thesis.'
  claimRefs:
  - CV007
  - CV008
  - CV009
  - CV010
  - CV012
  tableRefs:
  - TV003
