sections:
- id: revenue-model
  title: Revenue model and monetization
  body: 'Overhaul appears to monetize in three distinct ways: software subscription, insurance brokerage, and monitoring services.
    That is attractive because it creates multiple revenue levers around the same freight event, but it also makes margin
    analysis harder. The public record suggests the platform is sold against shipment volume and feature set rather than a
    simple per-seat license. That means public valuation should not be forced into a pure SaaS template. The right financial
    question is whether the services layer is a durable margin enhancer or a labor-intensive drag that only looks attractive
    while growth is strong.'
  claimRefs:
  - CI001
  - CI002
  - CI008
  - CI010
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: capital-structure
  title: Capital structure and financing cadence
  body: The financing cadence is the clearest public financial signal. Overhaul raised a Series B in 2021, a growth round
    in early 2025, and a Series C plus debt stack in August 2025. That pattern says the company is still capital-intensive
    even after years in market. Debt adds a real hurdle because it introduces repayment and covenant risk that pure-equity
    investors do not face. The absence of a disclosed valuation in the August 2025 round means the market cannot tell whether
    investors paid up, held flat, or reset lower. That uncertainty is central to any underwriting view.
  claimRefs:
  - CI003
  - CI004
  - CI005
  - CI007
  - CI011
  tableRefs:
  - TI003
- id: missing-metrics
  title: Missing metrics and underwriting blockers
  body: The open record still does not reveal ARR, gross margin, NRR, burn, runway, or customer concentration. Those are not
    minor missing pieces; they are the variables that determine whether the business can support its capital stack and what
    kind of valuation multiple is reasonable. The best interpretation is to treat public financial data as directionally informative,
    not definitive. Until management shares an operating package, all valuation work should stay in scenario form rather than
    pretending that the public record supports exact numbers. That same gap also blocks a credible cash-flow bridge and makes
    any margin bridge speculative. Investors would therefore insist on tighter reporting covenants. Full diligence still required.
  claimRefs:
  - CI006
  - CI009
  - CI012
