sections:
- id: peer-landscape
  title: Peer landscape and substitutes
  body: Overhaul’s competitive set is broader than the usual visibility market shortlist. The direct peers are software-led
    platforms such as project44 and FourKites, but the practical substitutes also include telematics companies, fraud-detection
    tools, and manual workflows inside the shipper’s own operation. That matters because buyers often start with a narrow
    problem and then decide whether they need a broader control plane. Overhaul’s position is strongest when the customer
    wants not only to know where freight is, but also what to do next, who is accountable, and how insurance fits into the
    response path.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  tableRefs:
  - TP001
  - TP002
  figureRefs:
  - FP001
- id: differentiation
  title: Differentiation and pricing logic
  body: 'The company’s differentiator is not raw tracking coverage; it is the blend of intervention, insurance, and cargo-security
    workflow. That blend can support premium pricing because the buyer is buying avoided loss, not just a dashboard. FreightVerify
    adds another layer: item-level and manufacturing use cases that broaden the competitive wedge into auto and healthcare
    workflows. The key question is whether competitors can replicate enough of this stack with software alone. If they can,
    the moat narrows. If they cannot, Overhaul’s integrated operating model keeps the platform above point-solutions.'
  claimRefs:
  - CP005
  - CP006
  - CP007
  - CP008
  tableRefs:
  - TP003
- id: durability
  title: Moat durability and risk
  body: 'The main competitive risk is commoditization by larger platforms. Visibility players can add exception management,
    while telematics vendors can climb the stack from the carrier side. Overhaul’s defense is that its human-in-the-loop response
    and insurance economics are harder to copy than software features alone. But that defense is only durable if customers
    keep paying for intervention and not just tracking. The most useful diligence question is therefore simple: where does
    Overhaul win because of its operating model, and where would a buyer be just as well served by a cheaper visibility tool
    or in-house process? The answer determines whether the moat is structural or merely packaging. That is the competitive
    test. Buyers will pay only where service quality is visibly superior.'
  claimRefs:
  - CP009
  - CP010
  - CP011
  - CP012
