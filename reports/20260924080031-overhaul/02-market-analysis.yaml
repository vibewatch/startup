sections:
- id: market-boundary
  title: Market boundary and status quo
  body: 'Overhaul should not be sized as generic transportation management software. The more useful boundary is the wedge
    where visibility, intervention, and risk transfer overlap: high-value freight, time-sensitive freight, and regulated freight
    that creates a measurable cost when it goes wrong. That framing is consistent with public language around cargo theft,
    freight fraud, and compliance monitoring. The status quo is still a stack of telematics, spreadsheets, carrier calls,
    and insurance workarounds, so the real market is the spend that shifts from reactive processes to a monitored control
    plane.'
  claimRefs:
  - CM001
  - CM005
  - CM009
  tableRefs:
  - TM001
  - TM002
  figureRefs:
  - FM001
- id: demand-drivers
  title: Demand drivers and adoption constraints
  body: 'The strongest demand driver is loss prevention: when theft or damage is expensive enough, buyers can justify a dedicated
    system that reduces incidents and improves recovery. A second driver is insurance economics, because premium savings and
    better claims discipline turn risk management into a financial conversation. The constraints are just as real: the product
    must prove ROI lane by lane, integrate into existing operations, and satisfy compliance or legal review. That is why the
    market is expanding, but still selective and operationally intensive rather than mass-market SaaS.'
  claimRefs:
  - CM003
  - CM004
  - CM006
  - CM010
  - CM012
  tableRefs:
  - TM003
- id: sizing-and-uncertainty
  title: Sizing logic and uncertainty
  body: Public evidence supports a range-based sizing approach rather than a single TAM number. The relevant budget mix includes
    software subscriptions, services, and an insurance adjacency, but the spend is spread across shippers, 3PLs, and regulated
    end markets. That means the right diligence question is not whether the market is “large”; it is how much of the budget
    actually moves from manual monitoring to premium monitoring when ROI is proven. The most useful output is a bounded range
    with assumptions preserved, not a false-precision headline. The implication for diligence is that market size should be
    read as an operating range tied to proof of loss reduction, claims discipline, and premium spend conversion, not as a
    venture-style TAM claim detached from buyer behavior. This keeps the sizing honest.
  claimRefs:
  - CM007
  - CM008
  - CM011
