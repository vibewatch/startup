callouts:
  - calloutType: "insight"
    title: "Predictable Per-Seat SaaS vs. Consumption-Based AI Pricing"
    body: "While many generative AI vendors bill on volatile token consumption or per-resolution API credits, Serval differentiates commercially with predictable per-seat SaaS subscription packaging. This pricing strategy removes customer budgeting friction and protects enterprise buyers from unexpected bill shock, though it shifts inference cost absorption risk back onto Serval's gross margins."
    claimRefs:
      - "CI003"
      - "CI009"
      - "CI010"
  - calloutType: "risk"
    title: "Unanchored ARR Growth and Valuation Disconnect in Underwriting"
    body: "Serval's reported 500% revenue growth in late 2025 lacks baseline ARR grounding in public filings. Without disclosing whether this expansion reflects growth from $500k to $3M or $2M to $12M, institutional investors cannot evaluate customer cohort durability, underlying revenue quality, or the fundamental multiples justifying the $1 billion Series B valuation."
    claimRefs:
      - "CI002"
      - "CI013"
      - "CI014"
