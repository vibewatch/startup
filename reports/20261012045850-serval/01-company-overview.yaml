chapter:
  number: 1
  title: "Company Overview"
  summary: "Serval is a San Francisco AI-native IT service management company founded in 2024 by CEO Jake Stauch and CTO Alex McLeod. It announced a $75 million Series B at a $1 billion valuation in December 2025 and reported $127 million raised since August, but absolute revenue, current headcount, total customers, board composition, and financing terms remain undisclosed."
sections:
  - id: "identity-and-product"
    title: "Identity, product, and business model"
    body: >-
      Serval was founded in 2024 and is headquartered in San Francisco. Its product combines
      help desk, access management, asset management, and workflow automation for internal
      enterprise operations. Serval describes a two-agent model: Catalyst turns natural-language
      instructions into code-based workflows, while the Help Desk Agent runs approved workflows
      against employee requests. The public evidence supports an enterprise software model but
      not a transparent price list: Multiples classifies the revenue model as subscription, while
      Macha found no public tiers or starting price and described a demo-led, custom-contract
      process. That opacity prevents a public estimate of contract value, deployment economics,
      or recurring revenue.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO014"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership, talent strategy, and governance gaps"
    body: >-
      Publicly identified leadership remains concentrated around co-founders Jake Stauch, chief
      executive officer, and Alex McLeod, chief technology officer. Serval also identifies former
      Greylock partner Christine Kim as Head of Strategic Projects and leader of Serval Start.
      That two-year, San Francisco-based program selected 12 people from more than 500 applicants
      for its first cohort and is intended to produce a recurring pipeline of forward-deployed
      engineering talent. The initiative is a credible recruiting signal, but it does not resolve
      key-person or governance questions. The assigned evidence does not identify board members,
      independent directors, founder voting control, succession coverage, or investor consent
      rights, so no conclusion about board independence or control allocation is supportable.
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO016"
    tableRefs:
      - "TO002"
  - id: "capital-and-scale"
    title: "Financing, operating signals, and underwriting limits"
    body: >-
      Serval's disclosed financing accelerated rapidly. SiliconANGLE reported a $47 million
      Series A led by Redpoint on October 21, 2025 and said total capital then reached $52 million.
      Serval announced a $75 million Series B led by Sequoia on December 11, 2025 at a $1 billion
      valuation, stating that total capital raised since August was $127 million. Multiples records
      $122 million across the two priced rounds, so the extra $5 million implied by Serval's total
      requires reconciliation rather than being assigned to an undocumented round. Serval also
      claimed 500% revenue growth and more than tripled headcount in the roughly three months after
      Series A, but gave neither an absolute revenue base nor a current employee count. Customer
      evidence is similarly directional: company material claims 50–80% automatic ticket
      resolution, while independent reporting cited six named customers automating more than 50%
      of IT tickets. Neither establishes total customers, ARR, retention, margins, or cash burn.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO015"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
