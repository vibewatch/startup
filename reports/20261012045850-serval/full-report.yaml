      - number: '5.3'
        title: Platform Modules, Asset Graph & Governance Controls
        blocks:
          - type: paragraph
            body: >-
              Beyond conversational ticketing, Serval integrates access management and an asset configuration database
              directly into its core platform. Serval Databases functions as an enterprise configuration management
              database (CMDB) and context graph, continuously ingesting hardware assets, software licenses, SaaS
              subscriptions, and employee records from mobile device management (MDM), identity providers (IdP), and
              HRIS systems. A field-level priority engine reconciles conflicting data sources to maintain an
              authoritative single source of truth. Leveraging this context graph, Serval deploys scheduled Proactive
              Agents that monitor ticket histories and asset telemetry to identify security vulnerabilities, reclaim
              dormant software licenses, and stage proposed workflow automations for administrative review. Access
              governance is embedded natively through time-bounded just-in-time (JIT) provisioning, automated
              deprovisioning, and scheduled access reviews designed for SOC 2 Type II and ISO 27001 compliance.
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE009
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
      - number: '5.4'
        title: Deployment Modes, Differentiation & Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Serval provides flexible deployment options tailored to enterprise security postures, including a
              multi-tenant cloud service with a 99.9% uptime SLA, a hybrid model executing workers inside customer
              networks, and a fully self-hosted single-tenant Kubernetes deployment. To facilitate enterprise adoption
              without forcing high-risk migrations, Serval features bidirectional synchronization with incumbent ITSMs
              including ServiceNow, Jira Service Management, and Freshservice. However, diligence surfaces several
              technical and operational risks. First, customer telemetry indicates a steep operational learning curve
              and significant setup complexity across multi-system identity integrations. Second, displacing entrenched
              incumbents is hindered by decades of legacy business logic, custom tables, and established vendor
              integrations. Finally, the complete absence of a public developer portal, open-source SDKs, or public
              developer community metrics leaves platform extensibility dependent on private vendor disclosures.
            claimRefs:
              - CE007
              - CE008
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Air Gap Prevents Runaway AI Actions
            body: >-
              Serval's strict structural separation between the administrative Catalyst workflow-generation agent and
              the employee-facing Help Desk execution agent eliminates runtime prompt improvisation, ensuring that
              automated tickets only execute verified, deterministic TypeScript code with enforced approval gates.
            calloutType: strength
            claimRefs:
              - CE002
              - CE003
          - type: callout
            title: Configuration Overhead and High Switching Barriers
            body: >-
              While Serval provides two-way synchronization with ServiceNow and Jira, real-world deployments encounter
              steep configuration curves, complex IdP permission mappings, and heavy resistance to displacing entrenched
              enterprise ITSM customizations.
            calloutType: risk
            claimRefs:
              - CE007
              - CE011
              - CE012
          - type: callout
            title: Integrated CMDB Graph Powers Contextual Autonomous Resolutions
            body: >-
              By embedding hardware, software, and SaaS license reconciliation directly into Serval Databases rather
              than treating the CMDB as an external connector, the platform resolves access and device tickets with
              complete organizational context.
            calloutType: insight
            claimRefs:
              - CE004
              - CE005
              - CE006
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation Table
        blocks:
          - type: paragraph
            body: >-
              Serval's commercial traction centers on engineering-led organizations and high-growth technology scale-ups
              that require sophisticated automation beyond legacy rule engines. Target buyers primarily comprise Heads
              of IT, Chief Information Security Officers, and Directors of IT Operations seeking to eliminate repetitive
              employee administration. Disclosed production accounts are heavily concentrated in frontier artificial
              intelligence, developer tooling, and modern fintech, where internal IT stacks already leverage modern
              identity providers such as Okta, JumpCloud, Slack, and Google Workspace. While this concentration delivers
              exceptional referenceability and rapid viral expansion among peer venture-backed businesses, Serval's
              penetration into traditional, heavily regulated, or non-technical enterprise environments remains nascent,
              creating vertical concentration risk if macroeconomic headwinds constrain venture software budgets.
            claimRefs:
              - CU001
              - CU006
              - CU011
              - CU013
          - type: table
