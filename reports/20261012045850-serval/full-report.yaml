        - Pre-built connectors, SCIM compliance, and multi-tenant API scope ceilings
        - Medium
      - - Cloud Infrastructure Hosting
        - Amazon Web Services (AWS)
        - Primary SaaS hosting, compute, and marketplace channel
        - Medium
        - Regional cloud outage or AWS Marketplace policy revisions
        - Medium
        - Multi-region architecture and self-hosted Kubernetes deployment compatibility
        - Low
    notes: >-
      Dependencies evaluated across critical external infrastructure, API partners, and platform integration
      counterparts; ordered by failure severity.
    claimRefs:
      - CR001
      - CR003
      - CR011
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Supporting Evidence
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - Proven product automation in tech startups but lack of non-tech enterprise evidence
        - Withhold growth-equity investment until ARR scale and enterprise repeatability are demonstrated
      - - Confidence
        - Medium
        - Documented $1B Series B and Series A rounds, but absolute revenue and unit economics are undisclosed
        - Do not underwrite at premium entry multiples without audited financials
      - - Risk Rating
        - High
        - Incumbent response from ServiceNow/Moveworks and potential LLM automation commoditization
        - Require explicit IP defensibility and multi-agent workflow stickiness proof
      - - Valuation Stance
        - Stretched
        - 4.3x valuation step-up in 4 months to $1B post-money on unanchored ARR
        - Seek 40-50% discount on secondary market or wait for Series C anchoring
    notes: >-
      Summary ratings synthesize Series A/B financing terms, customer automation metrics, and competitive threat levels
      from incumbents.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV013
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Perspective
      - Core Argument
      - Evidence Anchor
      - What Would Change View
    rows:
      - - Investment Thesis (Market)
        - AI-native ITSM replaces brittle manual ticketing with autonomous natural language workflows
        - Automating over 50% of IT tickets at Perplexity, Mercor, and Ramp
        - Customer churn or failure to expand beyond tech-forward startups
      - - Investment Thesis (Product)
        - Separation of Catalyst builder agent and deterministic help desk runtime creates reliable enterprise execution
        - TypeScript workflow generation with human-in-the-loop audit logs and RBAC
        - Runtime execution failures or security vulnerabilities in customer production environments
      - - Anti-Thesis (Competition)
        - >-
          ServiceNow $3.88B quarterly revenue and Moveworks acquisition provide distribution moat that compresses Serval
          TAM
        - ServiceNow deployed Level 1 Service Desk AI Specialist with existing enterprise ERP footprint
        - Demonstrated displacement of ServiceNow as primary system of record in Global 2000 accounts
      - - Anti-Thesis (Valuation)
        - >-
          Current $1B valuation implies astronomical forward revenue multiples given estimated sub-$25M ARR and
          30-person team
        - Series B preempted at $1B post-money with 500% revenue growth on undisclosed base
        - Audited ARR disclosure exceeding $50M with >130% net revenue retention and >75% gross margins
    notes: >-
      Thesis points reflect company and investor claims; anti-thesis points reflect independent market comps and
      incumbent distribution scale.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Operating Assumptions
      - Valuation / Return Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          ARR scales to $80M+ by 2028; horizontal expansion into HR/Finance/Legal; >140% NRR; enterprise displacement of
          legacy ITSM
        - $2.5B–$3.5B exit via IPO or strategic acquisition by Microsoft/Salesforce at 20x–30x ARR
        - ServiceNow ecosystem lock-in; commoditization of workflow LLMs
        - 20% (requires flawless enterprise execution)
      - - Base Case
        - ARR reaches $30M–$45M by 2028; strong penetration in mid-market tech; moderate enterprise expansion; ~115% NRR
        - $750M–$1.2B valuation at 15x–20x ARR; flat to modest return relative to Series B entry
        - Growth deceleration after exhausting tech-startup vertical; margin pressure from LLM inferencing
        - 50% (most plausible trajectory given current customer base)
      - - Bear Case
        - >-
          ARR stalls below $20M; enterprise pilots fail security/compliance reviews; Moveworks/ServiceNow bundle crushes
          standalone pricing
        - $200M–$350M distressed acquisition or down-round recapitalization at 5x–8x ARR; >65% capital impairment
        - Enterprise churn, security incident via agent access permissions, high cash burn
        - 30% (elevated given $1B entry valuation overhang)
    notes: >-
      Scenarios model 2026–2028 horizon from Series B post-money baseline; probability signals reflect absence of
      audited ARR and unit economics.
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
