  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Serval's supportable core market is internal enterprise service management rather than external customer
              support. Its own positioning combines employee-request handling, onboarding and offboarding, just-in-time
              access, ticketing, asset management, and workflow orchestration. The nearest spend boundary is therefore
              the overlap of ITSM software, identity and access operations, and workflow automation; the broader
              adjacency includes HR, finance, legal, and security service workflows. Status-quo substitutes include
              manual queues and administrator-built workflows inside legacy systems. Serval also offers a lower
              switching-cost entry path as an automation layer synchronized with an incumbent ITSM, allowing a customer
              to defer replacement of the system of record. The assigned evidence does not establish which portions of
              those budgets are incremental versus reallocated.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              No retained source supplies a transparent market-size methodology, geographic boundary, base year, CAGR,
              or numeric TAM/SAM/SOM that can be applied to Serval. Public outcome evidence is useful for adoption
              underwriting but cannot be converted into market size: Serval reports that Perplexity exceeded 50%
              automation and separately says customers routinely automate 50% to 80% of help-desk tickets. Its buyer
              guide also cites a $15-$25 live-agent ticket cost versus $2-$4 for an AI-resolved ticket, but the
              underlying analyst material is not in the assigned pool. These measures indicate a potential efficiency
              wedge, not addressable revenue. Any valuation model should therefore use customer-specific ticket volume,
              eligible workflow share, pricing, and retention rather than a generic ITSM market estimate.
            claimRefs:
              - CM004
              - CM005
              - CM006
