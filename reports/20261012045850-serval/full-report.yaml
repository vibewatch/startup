chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and business model
        blocks:
          - type: paragraph
            body: >-
              Serval was founded in 2024 and is headquartered in San Francisco. Its product combines help desk, access
              management, asset management, and workflow automation for internal enterprise operations. Serval describes
              a two-agent model: Catalyst turns natural-language instructions into code-based workflows, while the Help
              Desk Agent runs approved workflows against employee requests. The public evidence supports an enterprise
              software model but not a transparent price list: Multiples classifies the revenue model as subscription,
              while Macha found no public tiers or starting price and described a demo-led, custom-contract process.
              That opacity prevents a public estimate of contract value, deployment economics, or recurring revenue.
