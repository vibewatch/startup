      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The clearest buyer profile is a funded mid-market-to-enterprise IT or operations team, while employees are
              the day-to-day users through chat, email, or web request channels. Security and functional operations
              teams become additional buyers as workflows expand into access, HR, finance, and legal. Public evidence
              does not identify the contractual payer or budget owner, and demo-gated pricing prevents a bottom-up seat
              or usage estimate. Adoption can begin with repetitive, high-volume access and service requests: an AWS
              Marketplace reviewer reports that configured access workflows reduced completion from one or two days to
              minutes. That same reviewer describes an initial learning curve, indicating that workflow configuration
              and operating ownership remain prerequisites rather than disappearing with AI.
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM009
              - CM011
              - CM012
