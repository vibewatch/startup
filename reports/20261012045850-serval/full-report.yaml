          - type: paragraph
            body: >-
              Serval's disclosed financing accelerated rapidly. SiliconANGLE reported a $47 million Series A led by
              Redpoint on October 21, 2025 and said total capital then reached $52 million. Serval announced a $75
              million Series B led by Sequoia on December 11, 2025 at a $1 billion valuation, stating that total capital
