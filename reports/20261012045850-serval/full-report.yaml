              - CM013
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Demand is driven by the gap between ticket tracking and completed resolution, the breadth of repetitive
              access and employee-service work, and the option to deploy automation before replacing an incumbent ITSM.
              Serval's deterministic workflow model, explicit publication controls, scoped APIs, approval policies, and
              multiple deployment models address trust and data-residency objections that can delay enterprise adoption.
              Constraints are equally material: buyer education and configuration effort are real, pricing is opaque,
              small teams without dedicated workflow ownership may be a poor fit, and the available ROI benchmarks are
              primarily company-issued or customer-specific rather than independent market evidence. Valuation should
              reward verified expansion only after diligence establishes contract values, implementation burden, renewal
              behavior, and whether automation gains persist across ordinary customers rather than selected references.
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM009
              - CM010
