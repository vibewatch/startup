evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics
    missingEvidence: Absolute revenue or ARR, gross margin, retention, cash burn, runway, and customer concentration.
    whyItMatters: >-
      The 500% growth claim and $1 billion valuation cannot be converted into revenue quality, efficiency, or valuation
      multiples without denominators.
    diligencePath: >-
      Request monthly recurring revenue bridges, cohort retention, gross-margin detail, cash statements, and customer
      concentration schedules.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A financing schedule reconciling the company's $127 million cumulative total with $122 million across the two
      priced rounds.
    whyItMatters: >-
      The unexplained $5 million may reflect earlier financing, but the assigned evidence does not establish its date,
      security, investors, or terms.
    diligencePath: Obtain the cap table, financing closing sets, securities ledger, and a round-by-round sources-and-uses schedule.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete board membership, independent directors, voting control, investor consent rights, and succession
      arrangements.
    whyItMatters: Founder dependence and investor control cannot be assessed from financing participation alone.
    diligencePath: >-
      Review the charter, voting agreement, investor-rights agreement, board minutes, option plan, and executive
      succession plan.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: >-
      A complete customer list with contract value, deployment status, cohort retention, and standardized automation
      denominators.
    whyItMatters: >-
      Named logos and customer-specific automation percentages do not establish total customers, recurring revenue, or
      representative product performance.
    diligencePath: >-
      Request a customer census, top-account contracts, reference calls, renewal data, and ticket-level KPI exports for
      a representative cohort.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent market study with category definition, geography, base year, value, CAGR, and methodology for ITSM
      or AI service-management spend.
    whyItMatters: Without a transparent denominator, numeric TAM, SAM, and SOM would be fabricated and cannot anchor valuation.
    diligencePath: >-
      Obtain licensed analyst research or triangulate public-company segment revenue with government organization counts
      and documented Serval eligibility filters.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Contract pricing, actual budget owner, implementation cost, eligible ticket volume, renewal behavior, and
      customer-level automation definitions.
    whyItMatters: >-
      These inputs determine whether operational savings translate into durable software revenue and a supportable
      serviceable market.
    diligencePath: >-
      Request a pricing schedule, anonymized contract cohort, implementation statements of work, renewal data, and three
      customer references with comparable ticket-volume baselines.
    relatedQuestionRefs:
      - QM003
      - QM007
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: independent-validation
    missingEvidence: >-
      Independent benchmarks for deployment time, automation rate, cost per resolved ticket, and failure or rollback
      rates.
    whyItMatters: >-
      Most retained performance evidence is company-issued or customer-specific and may not generalize across ordinary
      deployments.
    diligencePath: >-
      Commission reference calls and obtain auditable pilot telemetry with common definitions for automated, assisted,
      deflected, and human-resolved tickets.
    relatedQuestionRefs:
      - QM004
      - QM007
      - QM008
  - type: private-evidence-only
