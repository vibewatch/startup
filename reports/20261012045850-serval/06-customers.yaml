company:
  name: Serval
chapter:
  number: 6
  title: Customers
  summary: Serval demonstrates strong production traction and rapid automation gains across high-profile venture-backed technology
    companies including Perplexity, Together AI, Ramp, and SeatGeek, while enterprise adoption beyond tech scale-ups remains
    nascent. Key customer evidence highlights 50%+ autonomous ticket resolution and 95% just-in-time access automation, though
    customer concentration in fast-moving tech startups and complete opacity around net retention and churn create underwriting
    uncertainty.
sections:
- id: customer-segmentation-and-profile
  title: Customer Segmentation Table
  body: Serval's commercial traction centers on engineering-led organizations and high-growth technology scale-ups that require
    sophisticated automation beyond legacy rule engines. Target buyers primarily comprise Heads of IT, Chief Information Security
    Officers, and Directors of IT Operations seeking to eliminate repetitive employee administration. Disclosed production
    accounts are heavily concentrated in frontier artificial intelligence, developer tooling, and modern fintech, where internal
    IT stacks already leverage modern identity providers such as Okta, JumpCloud, Slack, and Google Workspace. While this
    concentration delivers exceptional referenceability and rapid viral expansion among peer venture-backed businesses, Serval's
    penetration into traditional, heavily regulated, or non-technical enterprise environments remains nascent, creating vertical
    concentration risk if macroeconomic headwinds constrain venture software budgets.
  claimRefs:
  - CU001
  - CU006
  - CU011
  - CU013
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-automation-outcomes
  title: Adoption Trajectory & Autonomous Resolution Metrics
  body: 'Enterprise adoption velocity is anchored by rapid time-to-value, with Serval claiming that newly onboarded customer
    cohorts consistently achieve 50% or higher autonomous ticket resolution within four weeks of deployment. Documented customer
    outcomes corroborate substantial workload reductions: Perplexity automated over half of its incoming IT requests across
    employee onboarding and offboarding, while SeatGeek escalated from 0% to 40% automation in three weeks and surpassed 50%
    within sixty days. In access governance, Together AI achieved a 95% automation rate on just-in-time access requests, demonstrating
    that access provisioning represents Serval''s highest-leverage initial use case. However, because absolute baseline ticket
    counts, human escalation volumes, and resolution complexity tiers remain unpublished, underwriting long-term deflection
    durability requires private validation.'
  claimRefs:
  - CU002
  - CU003
  - CU004
  - CU005
  tableRefs:
  - TU002
- id: named-production-deployments-and-case-proof
  title: Named Customer Deployments & Case Proof
  body: Publicly verified customer deployments validate that Serval operates as an active system of action rather than an
    experimental pilot across its core accounts. High-profile reference customers including Perplexity, Together AI, SeatGeek,
    and Ramp have deployed Serval into full production for daily IT operations. At Ramp, IT teams utilize the Catalyst workflow
    agent to draft and publish custom automation workflows 50% faster from historical ticket logs. Verified user feedback
    from AWS Marketplace confirms that Serval operates effectively as a Level 1 and Level 2 IT team member, compressing access
    request fulfillment from days to minutes while standardizing policy execution. Nevertheless, public references remain
    almost entirely confined to tech-forward software businesses with clean cloud environments, leaving unresolved how the
    platform handles messy legacy on-premises infrastructure.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU012
  tableRefs:
  - TU003
- id: expansion-retention-and-concentration-risks
  title: Account Expansion Loops & Durability Risks
  body: 'Customer expansion follows an organic land-and-expand trajectory: after resolving core IT help desk volume and access
    requests, enterprise customers extend Serval horizontally into HR onboarding, security access reviews, legal contract
    workflows, and engineering provisioning. The creation of bespoke TypeScript workflows establishes substantial technical
    switching costs, anchoring customer lock-in and driving multi-department contract growth without proportional sales costs.
    However, critical retention metrics including net revenue retention, gross revenue retention, and annual logo churn remain
    completely undisclosed. Furthermore, because Serval utilizes a demo-gated custom platform fee without published pricing
    tiers, procurement transparency is limited, and renewal escalation caps remain a crucial diligence requirement for prospective
    institutional underwriters.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU014
