      - "CP014"
  - calloutType: insight
    title: "Air-Gapped Determinism as an Enterprise Security Wedge"
    body: "Serval's architectural separation between the conversational Help Desk Agent and the Catalyst workflow-generation engine creates an audit boundary that addresses enterprise compliance objections to black-box LLM execution in privileged access management environments."
