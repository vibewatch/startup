    body: "ServiceNow's acquisition of Moveworks and deep integration across enterprise systems of record presents a formidable barrier to Serval's rip-and-replace strategy, as incumbent IT buyers can deploy bundled conversational deflection without migrating core service catalogs or undergoing custom forward-deployed engineering pilots."
    claimRefs:
