chapter:
  number: 5
  title: "Product & Technology"
  summary: "Serval delivers an AI-native enterprise service management platform featuring a two-agent architecture that separates conversational request resolution from administrative workflow generation. By compiling natural-language prompts into deterministic TypeScript automations backed by an integrated asset database and a six-tier governance model, Serval targets 50%+ autonomous resolution while mitigating model hallucination risks."
sections:
  - id: "product-service-definition"
    title: "Product Definition & Workflow Automation Engine"
    body: "Serval positions its platform as enterprise service management engineered natively for artificial intelligence, replacing traditional ticket-tracking queues with autonomous request execution. Rather than deflecting users to static knowledge base documentation, Serval ingests employee inquiries across Slack, Microsoft Teams, email, and web portals, autonomously executing backend workflows to resolve issues directly. Core use cases span automated software access provisioning, employee onboarding and offboarding lifecycle management, password and MFA resets, and cross-departmental administrative operations across HR, legal, finance, and security. By integrating service requests with native access controls and configuration data, customer deployments report resolving over 50% of incoming tickets without technician intervention, reducing mean time to resolution from hours or days to minutes."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE005"
      - "CE010"
    tableRefs:
      - "TE002"
  - id: "architecture-two-agent-model"
    title: "Two-Agent System Architecture & Deterministic Execution"
    body: "At the technical core of Serval is an agentic architecture enforcing a strict separation of powers between two distinct AI systems: the employee-facing Help Desk Agent and the administrative Catalyst Agent. The Help Desk Agent reasons over natural-language requests and retrieves organizational context, but it is strictly constrained to invoking pre-approved, published workflows through an architectural air gap that prevents runtime prompt improvisation. Workflow creation is governed by Catalyst, an admin-facing agent that converts natural-language instructions into inspectable, deterministic TypeScript code rather than fragile LLM prompt chains. Workflows sync directly to GitHub for enterprise version control and can be managed via the Serval CLI, enforcing an infrastructure-as-code discipline with code-level approval gates, role-based access control, and strict API scope ceilings."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE008"
      - "CE014"
    figureRefs:
      - "FE001"
    tableRefs:
      - "TE003"
  - id: "core-modules-and-cmdb"
    title: "Platform Modules, Asset Graph & Governance Controls"
    body: "Beyond conversational ticketing, Serval integrates access management and an asset configuration database directly into its core platform. Serval Databases functions as an enterprise configuration management database (CMDB) and context graph, continuously ingesting hardware assets, software licenses, SaaS subscriptions, and employee records from mobile device management (MDM), identity providers (IdP), and HRIS systems. A field-level priority engine reconciles conflicting data sources to maintain an authoritative single source of truth. Leveraging this context graph, Serval deploys scheduled Proactive Agents that monitor ticket histories and asset telemetry to identify security vulnerabilities, reclaim dormant software licenses, and stage proposed workflow automations for administrative review. Access governance is embedded natively through time-bounded just-in-time (JIT) provisioning, automated deprovisioning, and scheduled access reviews designed for SOC 2 Type II and ISO 27001 compliance."
    claimRefs:
      - "CE002"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE009"
    tableRefs:
      - "TE001"
  - id: "deployment-differentiation-risks"
    title: "Deployment Modes, Differentiation & Technical Risks"
    body: "Serval provides flexible deployment options tailored to enterprise security postures, including a multi-tenant cloud service with a 99.9% uptime SLA, a hybrid model executing workers inside customer networks, and a fully self-hosted single-tenant Kubernetes deployment. To facilitate enterprise adoption without forcing high-risk migrations, Serval features bidirectional synchronization with incumbent ITSMs including ServiceNow, Jira Service Management, and Freshservice. However, diligence surfaces several technical and operational risks. First, customer telemetry indicates a steep operational learning curve and significant setup complexity across multi-system identity integrations. Second, displacing entrenched incumbents is hindered by decades of legacy business logic, custom tables, and established vendor integrations. Finally, the complete absence of a public developer portal, open-source SDKs, or public developer community metrics leaves platform extensibility dependent on private vendor disclosures."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE011"
      - "CE012"
      - "CE013"
