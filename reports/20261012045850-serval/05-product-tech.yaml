    data:
      layers:
        - label: "Layer 1: Omnichannel Ingestion & Interface Tier"
          detail: "Captures employee requests and conversational context across Slack, Microsoft Teams, email, phone, and embedded web portals."
          modules:
            - "Slack & Teams Bot Endpoints"
            - "Email & Voice Parsing Gateways"
            - "ServiceNow Embedded Portal Widgets"
        - label: "Layer 2: Agent Reasoning & Intent Triage Tier"
          detail: "Evaluates requests, retrieves relevant knowledge base articles, and routes tickets without improvising code in production."
          modules:
            - "Help Desk Agent Runtime"
            - "Knowledge Retrieval Engine (Notion/Confluence)"
            - "Context & Conversation Memory Store"
        - label: "Layer 3: Deterministic Workflow & Automation Tier"
          detail: "Runs pre-compiled, version-controlled TypeScript automations built by Catalyst with strict input/output logging."
          modules:
            - "Catalyst Workflow Generator"
            - "TypeScript Execution Engine"
            - "GitHub Sync & Serval CLI Manager"
        - label: "Layer 4: Access Governance & Security Air-Gap Tier"
          detail: "Enforces a rigid architectural air gap between authoring and execution, supported by RBAC, API scope ceilings, and multi-step approvals."
          modules:
            - "Architectural Air-Gap Boundary"
            - "API Scope Ceiling Enforcer"
            - "JIT Provisioning & Multi-Step Approvals"
        - label: "Layer 5: Serval Databases & CMDB Context Graph Tier"
          detail: "Maintains a reconciled graph of hardware, software licenses, SaaS subscriptions, and configuration items with field-level priority rules."
          modules:
            - "Multi-Source Ingestion Pipeline"
            - "Field Priority Reconciliation Engine"
            - "Proactive Diagnostic Agents"
        - label: "Layer 6: Deployment & Enterprise Integration Infrastructure"
          detail: "Connects to identity providers, MDM, and legacy ITSMs across cloud-hosted, hybrid local worker, and self-hosted environments."
          modules:
            - "IdP & MDM Connectors (Okta, Kandji, Google)"
            - "Two-Way ITSM Sync (ServiceNow, Jira)"
            - "Cloud / Hybrid / Self-Hosted Infrastructure"
    approximationNotes: "Architecture layers and module boundaries reflect published technical specifications, patent disclosures, and security architecture documentation."
callouts:
  - calloutType: "strength"
    title: "Architectural Air Gap Prevents Runaway AI Actions"
    body: "Serval's strict structural separation between the administrative Catalyst workflow-generation agent and the employee-facing Help Desk execution agent eliminates runtime prompt improvisation, ensuring that automated tickets only execute verified, deterministic TypeScript code with enforced approval gates."
    claimRefs:
      - "CE002"
      - "CE003"
  - calloutType: "risk"
    title: "Configuration Overhead and High Switching Barriers"
    body: "While Serval provides two-way synchronization with ServiceNow and Jira, real-world deployments encounter steep configuration curves, complex IdP permission mappings, and heavy resistance to displacing entrenched enterprise ITSM customizations."
    claimRefs:
      - "CE007"
      - "CE011"
      - "CE012"
  - calloutType: "insight"
    title: "Integrated CMDB Graph Powers Contextual Autonomous Resolutions"
    body: "By embedding hardware, software, and SaaS license reconciliation directly into Serval Databases rather than treating the CMDB as an external connector, the platform resolves access and device tickets with complete organizational context."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
