    title: "Product Architecture & Security Governance Stack"
    type: "stack"
    summary: "Six-tier technical architecture illustrating Serval's two-agent separation of powers, deterministic TypeScript execution runtime, integrated CMDB context store, and multi-cloud deployment models."
    claimRefs:
