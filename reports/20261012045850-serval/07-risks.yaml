  - calloutType: insight
    title: Air-Gapped Two-Agent Design Protects Execution Security
    body: By isolating natural-language intent parsing in the help desk agent from deterministic, compiled TypeScript workflows, Serval prevents conversational prompt injection from executing unauthorized privileged actions.
