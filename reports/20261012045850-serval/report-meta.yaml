companyProfile:
  summary: >-
    Serval is a San Francisco-based AI-native IT service management company founded in 2024 by Jake Stauch and Alex
    McLeod. It combines a Help Desk Agent and a Catalyst workflow builder to automate employee service, access, and
    cross-functional workflows, and it has publicly disclosed a $75 million Series B at a $1 billion valuation alongside
    $127 million raised in total. Public evidence still leaves absolute ARR, exact headcount, customer count, and unit
    economics opaque.
