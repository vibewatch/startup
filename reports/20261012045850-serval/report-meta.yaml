  topStrengths:
    - >-
      Deterministic two-agent workflow architecture supports auditable automation across IT, access, and employee
      workflows.
    - Strong investor support and $127M of disclosed capital provide substantial operating runway.
    - Public customer evidence shows fast ticket automation gains in high-profile technology accounts.
  topRisks:
    - Absolute ARR, gross margin, and net retention remain undisclosed, limiting underwriting confidence.
    - >-
      Public customer evidence is concentrated in venture-backed technology companies rather than broad enterprise
      verticals.
    - Incumbent ITSM vendors can bundle AI features and exploit their distribution and system-of-record advantages.
  unresolvedGaps:
    - Absolute ARR or MRR to ground the 500% growth claim and support valuation multiples.
    - Gross margin, CAC payback, and net revenue retention across customer cohorts.
    - Exact headcount and customer count, plus a broader mix of non-tech enterprise references.
    - Cap-table, liquidation preference, and board/control terms at the $1B Series B price.
