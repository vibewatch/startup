    title: Evidence-constrained market sizing ladder
    type: pyramid
    summary: >-
      The evidence narrows from a broad service-management adjacency to a supportable initial
      workflow wedge, without assigning unsupported market values.
    data:
      items:
        - label: Broad adjacency
          value: Enterprise service management
          detail: "IT, HR, finance, legal, security, and operations workflows"
        - label: Core category
          value: Internal IT service management
          detail: "Help desk, ticketing, access, assets, and employee requests"
        - label: Deployment wedge
          value: Automation overlay
          detail: "Bidirectional synchronization can precede system-of-record migration"
        - label: Target buyer
          value: Mid-market to enterprise IT and operations
          detail: "A competitor-issued review describes this as the best-fit customer profile"
        - label: Initial use cases
          value: Repetitive access and service requests
          detail: "Public customer evidence shows time compression after workflows are configured"
        - label: Numeric underwriting boundary
          value: TAM/SAM/SOM unavailable
          detail: "No retained source provides a transparent market-size value or methodology"
    approximationNotes: "This is a qualitative scope ladder; it intentionally contains no estimated market values."
    claimRefs: [CM001, CM002, CM004, CM011, CM014, CM015]
callouts:
  - calloutType: assumption
    title: Do not convert automation rates into market size
    body: >-
      Ticket automation percentages and cost-per-ticket claims describe operating outcomes.
      Without customer counts, eligible ticket volumes, pricing, and a defined geography, they
      cannot support a revenue TAM, SAM, or SOM.
    claimRefs: [CM004, CM005, CM006]
