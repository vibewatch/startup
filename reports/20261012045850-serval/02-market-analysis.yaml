      - [Identity and access, "IT and security teams", Employees and administrators, Undisclosed, "Approval, provisioning, and deprovisioning", Undisclosed, "Slow manual access requests and audit needs"]
      - [Cross-functional ESM, "HR, finance, legal, or operations teams", Employees and functional operators, Undisclosed, "Onboarding and interdepartmental workflows", Undisclosed, "Repeated handoffs across systems and departments"]
      - [Incumbent-ITSM overlay, "Existing ITSM owners", Employees and service-desk staff, Undisclosed, "Automation synchronized with the current record system", Undisclosed, "Need for automation without immediate migration"]
    notes: "Buyer and user descriptions are qualitative; public assigned evidence does not disclose the contracting payer, budget owner, or procurement path."
    claimRefs: [CM002, CM003, CM007, CM008, CM009, CM010, CM011, CM012, CM013]
figures:
