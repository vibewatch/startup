    approximationNotes: 定位基于有记录的执行架构进行定性序数评分（x 轴：对话式拦截与确定性代码生成）以及平台范围（y 轴：点状聊天层与完整 ESM 系统记录源）。
    claimRefs:
      - CP002
      - CP008
      - CP015
  - id: FI001
    title: 收入转化与交付毛利流程
    type: flow
    summary: 展示客户请求接入、工作流执行、按席位 SaaS 变现和软件毛利率实现的流程推进。
    data:
      nodes:
        - label: 1. 服务请求接入
          detail: 员工通过 Slack、Teams、电子邮件或门户提交服务台请求
        - label: 2. 确定性执行
          detail: Catalyst 生成的 TypeScript 工作流在 RBAC 和 API 上限约束下执行操作
        - label: 3. 按席位 SaaS 订阅
          detail: 每个员工席位收取可预测的核心平台费，不加收执行附加费
        - label: 4. 部门级 ESM 拓展
          detail: 自然扩展超出 IT，进入 HR、财务、法律和安全工作流
        - label: 5. 前置部署工程
          detail: 高接触度客户工程团队构建定制集成并加速部署
        - label: 6. 软件毛利率实现
          detail: 扣除云基础设施、LLM 模型推理和合作伙伴 API 成本后的毛利
    approximationNotes: 流程展示将客户服务需求转化为实际 SaaS 收入和毛利率的架构阶段；绝对美元单位毛利率仍未公开。
    claimRefs:
      - CI003
      - CI007
      - CI009
      - CI010
  - id: FE001
    title: 产品架构与安全治理堆栈
    type: stack
    summary: 六层技术架构展示 Serval 的双代理分权、确定性 TypeScript 执行运行时、集成 CMDB 上下文存储和多云部署模式。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE008
      - CE014
    data:
      layers:
        - label: 第 1 层：全渠道接入与界面层
          detail: 接收来自 Slack、Microsoft Teams、电子邮件、电话和嵌入式 Web 门户的员工请求及对话上下文。
          modules:
            - Slack 与 Teams 机器人端点
            - 电子邮件与语音解析网关
            - ServiceNow 嵌入式门户组件
        - label: 第 2 层：代理推理与意图分流层
          detail: 评估请求、检索相关知识库文章并分派工单，不在生产环境临时编写代码。
          modules:
            - 服务台代理运行时
            - 知识检索引擎（Notion/Confluence）
            - 上下文与对话记忆存储
        - label: 第 3 层：确定性工作流与自动化层
          detail: 运行 Catalyst 构建的预编译、版本控制 TypeScript 自动化，并严格记录输入 / 输出日志。
          modules:
            - Catalyst 工作流生成器
            - TypeScript 执行引擎
            - GitHub 同步与 Serval CLI 管理器
        - label: 第 4 层：访问治理与安全隔离层
          detail: 在编写与执行之间实施严格的架构隔离，并由 RBAC、API 范围上限和多步骤审批提供支撑。
          modules:
            - 架构隔离边界
            - API 范围上限执行器
            - JIT 配置与多步骤审批
        - label: 第 5 层：Serval 数据库与 CMDB 上下文图层
          detail: 维护硬件、软件许可证、SaaS 订阅和配置项的对账图谱，并设置字段级优先级规则。
          modules:
            - 多源接入管道
            - 字段优先级对账引擎
            - 主动式诊断代理
        - label: 第 6 层：部署与企业集成基础设施
          detail: 连接身份提供商、MDM 和传统 ITSM，覆盖云托管、混合本地工作器和自托管环境。
          modules:
            - IdP 与 MDM 连接器（Okta、Kandji、Google）
            - 双向 ITSM 同步（ServiceNow、Jira）
            - 云 / 混合 / 自托管基础设施
    approximationNotes: 架构层次与模块边界来自已发布的技术规格、专利披露和安全架构文档。
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从前置部署工程试点到横向扩展至多个部门的五阶段采用生命周期。
    approximationNotes: 生命周期阶段与扩展触发因素综合自 Serval 试点合同、AWS Marketplace 评价和 Sacra 分析。
    data:
      items:
        - label: 初步范围界定
          detail: IT 管理层评估需演示后才能使用的平台，并界定初始重复工单量
          tone: neutral
          touchpoints:
            - 厂商演示
            - 安全信任中心审查
            - Slack 与 IDP 集成审计
        - label: 前置部署试点
          detail: Serval 部署工程师共同搭建初始工作流，并保证工单自动化率达到 50%
          tone: positive
          touchpoints:
            - 专属部署团队
            - 4 周上线周期
            - Okta 与 Slack 核心工作流预演
        - label: IT 服务台正式上线
          detail: Help Desk Agent 在 Slack 和 Teams 中自主处理员工工单
          tone: positive
          touchpoints:
            - 终端用户 Slack 私信
            - 自动化 JIT 访问审批
            - 管理员监督仪表盘
        - label: Catalyst 自我优化
          detail: Catalyst 分析历史工单日志，起草新的代码自动化流程
          tone: positive
          touchpoints:
            - 工单历史解析
            - TypeScript 工作流生成
            - 管理员 PR 式代码审查
        - label: 部门扩展
          detail: 采用范围自然扩展至 HR 入职、安全审查和财务审批
          tone: positive
          touchpoints:
            - 跨职能入职流程
            - NDA 与合同流转
            - 硬件配置
        - label: 替代记录系统
          detail: 客户停用旧 ITSM 工具，将 Serval 确立为企业主系统
          tone: warning
          touchpoints:
            - 旧 CMDB 迁移
            - 全面停用工单系统
            - 企业年度合同续签
    claimRefs:
      - CU007
      - CU009
      - CU010
      - CU011
      - CU012
  - id: FR001
    title: 风险热力图
