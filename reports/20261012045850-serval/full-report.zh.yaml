      - number: '4.3'
        title: 运营成本结构、计算费用与毛利率机制
        blocks:
          - type: paragraph
            body: >-
              Serval 的销货成本（COGS）和服务交付经济性主要由三类支出决定：多云基础设施托管、基础大语言模型推理计算，以及第三方 API 集成维护。运营工单的行业基准显示，自主 AI 解决请求的成本为每单
              $2–$4，而人工实时坐席支持为 $15–$25，能为客户 IT 预算带来明显 ROI。但对 Serval 自身而言， 利润率转化高度依赖缓存效率和 token 经济性。Catalyst
              将自然语言指令编译为确定性、可复用的 TypeScript 代码，并对企业 API 执行， 因而无需每个重复支持工单都重新运行昂贵的非确定性 LLM
              推理。代码生成与确定性工具执行的架构分离限制了边际计算消耗，使公司能在合同规模相对固定集成开销扩张时， 争取软件毛利率。
            claimRefs:
              - CI008
              - CI009
              - CI010
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI007
              - CI009
              - CI010
      - number: '4.4'
        title: 资本充足性、现金消耗与投资判断结论
        blocks:
          - type: paragraph
            body: >-
              从资产负债表和融资角度看，Serval 近期资本充足性极强。公司在 2025 年 10 月由 Redpoint 领投完成 $47M A 轮后，于 2025 年 12 月由 Sequoia Capital
              领投完成一笔抢先完成的 $75M B 轮，投后估值 $1B，累计股权融资达到 $127M。按报道中不足 100 人的运营员工数，Serval 的流动现金储备在标准企业烧钱轨迹下 可提供多年
              runway。然而从机构投资判断角度看，这一估值倍数是未经验证的信念跃迁。Serval 在 2025 年末报告收入增长 500%，但没有 ARR 基线、净收入留存（NRR） 队列或经验证的 GAAP
              毛利率作为锚点。在缺少经审计财务报表的情况下，对 $1B 估值的投资判断只能把 Serval 视为高风险的创投资产，而不是可据以承保的经营企业。
            claimRefs:
              - CI001
              - CI002
              - CI011
              - CI013
              - CI014
