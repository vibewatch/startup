              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 增长驱动、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              需求来自工单跟踪与完成解决之间的差距、重复性权限和员工服务工作的广度，以及在替换现有 ITSM 之前先部署自动化的选择。Serval 的确定性工作流模型、 明确的发布控制、受限
              API、审批政策和多种部署模式，能够回应企业采用常见的信任与数据驻留顾虑。约束同样明显：买方教育和配置工作真实存在， 定价不透明，没有专职工作流负责人的小团队可能并不适合，现有 ROI
              基准也主要来自公司或单个客户，而非独立市场证据。只有在尽调确认合同价值、 实施负担、续约行为，以及自动化收益能否在普通客户而非精选案例中持续之后，估值才应奖励可验证的扩张。
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM009
              - CM010
              - CM012
              - CM013
              - CM015
