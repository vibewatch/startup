              - CR014
      - number: '7.5'
        title: 风险监控框架与下行论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              以独角兽估值评估 Serval，需要持续监测关键运营、技术和商业里程碑。关键指标包括非科技企业客户获取速度、子处理者 API 毛利率稳定性，以及试点结束后的客户留存指标。 关键下行论点破坏触发器包括：现有厂商限制
              API 合作伙伴访问或掠夺式捆绑引发的激烈反击；未经授权的智能体脚本执行造成大范围安全漏洞；以及在风险融资收缩期间， 核心科技初创客户群的客户流失率超过 20%。若这些触发器中的任何一个出现，Serval
              作为独立系统记录源的竞争护城河将迅速恶化。
            claimRefs:
              - CR001
              - CR003
              - CR008
              - CR014
      - number: '7.6'
        title: 展示项
        blocks:
          - type: callout
            title: 平台结构性暴露于基础模型上游定价
            body: Serval 的整套自动化引擎在架构上不依赖拥有底层模型权重；如果前沿实验室调整商业定价，公司就会面临利润率突然压缩或 API 限速风险。
            calloutType: risk
            claimRefs:
              - CR001
          - type: callout
            title: 隔离式双智能体设计保护执行安全
            body: Serval 将帮助台智能体中的自然语言意图解析与确定性、编译后的 TypeScript 工作流隔离，防止对话式提示注入执行未经授权的特权操作。
            calloutType: insight
            claimRefs:
              - CR002
              - CR010
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、立场与建议逻辑
        blocks:
          - type: paragraph
            body: >-
              Serval 的投资论点颇具吸引力：它试图把企业 IT 服务管理从人工、路由工单的文件柜，变成自主执行平台。公司引入双智能体架构，由 Catalyst Agent 构建自然语言工作流， 由 Help Desk
              Agent 确定性执行，使 Perplexity、Mercor 和 Ramp 等前瞻科技客户能够自动化超过 50% 的日常 IT 支持请求。这种运营效率解决了企业的一大摩擦点，
              显著缩短分散技术团队的平均解决时间，并降低支持工单处理成本。


              但投资建议严格为“跟踪”，估值立场为“偏高”。技术范式转变可信，也得到一级风险投资支持的验证；然而，公开证据没有提供支撑 $1.0B 投后估值所需的基线数据。 当前客户案例几乎全部集中在风险投资支持的 AI
              和软件初创公司，能否扩展到拥有复杂传统基础设施的非科技企业仍有疑问。在 Serval 证明企业扩张可重复、并披露 可验证的 ARR 里程碑之前，应推迟新增资本承诺。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV013
      - number: '8.2'
        title: 融资背景、估值倍数脱节与反向论点
        blocks:
          - type: paragraph
            body: >-
              Serval 的资本化速度异常快：从 2025 年 10 月以 $232M 估值完成 $47M A 轮，到 2025 年 12 月由 Sequoia Capital 领投、以 $1.0B 投后估值完成
              一笔抢先完成的 $75M B 轮。四个月内估值增长 4.3 倍，支撑因素是公司声称收入增长 500% 和员工数翻三倍。Sequoia 明确将 Serval 与其 16 年前早期投资 ServiceNow
              相提并论，强调以 IT 为中心的系统记录源横向拓展至 HR、财务和法务工作流的潜力。


              但核心反向论点在于现有厂商根深蒂固，以及缺乏锚点的估值定价。ServiceNow 仍是企业服务管理领域的主导者，2026 年第二季度季度订阅收入达到 $3.88B， 并于 2025 年 12 月以 $2.85B
              收购对话式 AI 专家 Moveworks，以强化 AI 原生的前线防御。此外，在没有经审计的绝对收入或净留存指标时，Serval 的 $1.0B 估值明显脱离传统软件基本面。PagerDuty 等中端市场 IT
              支持现有厂商的 EV/Revenue 约为 2.5 倍，说明 Serval 按高位投机增长倍数定价，执行失误没有任何安全边际。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV010
      - number: '8.3'
        title: 情景投资判断与可比倍数分析
        blocks:
          - type: paragraph
            body: >-
              为评估 $1.0B B 轮基准下的潜在回报，我们围绕 2026 至 2028 年投资期限建立乐观、基准和悲观运营情景。乐观情景（20% 概率）下，Serval 成功把 Catalyst 打造成覆盖
              HR、采购和法务部门的横向工作流自动化引擎，ARR 增长超过 $80M，支持以 20 倍至 30 倍倍数实现 $2.5B–$3.5B 退出。基准情景（50% 概率）下，
              公司在科技和中端市场账户中稳步扩张，2028 年 ARR 达到 $30M–$45M，估值达到 $750M–$1.2B，相对 B 轮入场价格带来持平至温和回报。


              悲观情景（30% 概率）下，Serval 遇到结构性企业摩擦。安全、合规和定制集成要求显著拉长企业 IT 销售周期，基础模型进步也会让基础对话式工单商品化。 随着 ServiceNow 在现有企业合同中推出原生
              AI 专家智能体，Serval 的增长放缓至 ARR 低于 $20M，最终以 $200M–$350M 完成低价轮融资或陷入困境的战略收购。 悲观情景被赋予较高概率，凸显进入缺乏锚点的 B
              轮独角兽融资所固有的脆弱性。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 退出期限、尽调问题与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              Serval 的退出准备仍处于早期发展阶段。公司团队规模不足 30 人，成立还不到两年，因此 IPO 至少还要 3—5 年，且前提是经审计的 GAAP 业务规模超过 $100M ARR
              并实现正自由现金流。在此之前，被寻求现代智能代理工作流编排层的 Microsoft、Salesforce 或 Atlassian 等企业生态巨头战略收购，是中期最可行的流动性路径。


              在参与任何潜在的老股交易或未来 C 轮融资前，机构投资者必须要求四项不可妥协的尽调信息：（1）绝对 ARR 和月度烧钱率，用来核实 500% 的增长说法；（2）计入第三方 LLM
              推理费用后的经审计毛利率；（3）客户群留存曲线和净收入留存率（NRR）基准；（4）向非科技行业《财富》1000 强客户做背调访谈。可量化的论点失效触发条件包括：同比 ARR 增长降至 100% 以下、毛利率跌破
              65%、关键高管离职，或发生任何涉及自主特权访问配置的重大安全漏洞。
            claimRefs:
              - CV013
              - CV014
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 估值评估：收入基础夯实前维持跟踪立场
            body: Serval 展现出非凡的产品迭代速度和令人印象深刻的早期客户吸引力，但 10 亿美元的 B 轮估值缺乏可验证的收入证明。投资者应先场外观察进展，直到公司披露经审计的 ARR 和单位经济模型。
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV014
          - type: callout
            title: 下行风险：在位者反击与模型商品化
            body: ServiceNow 的订阅收入已达数十亿美元，并将收购的 Moveworks AI 能力打包销售，Serval 因此面临强烈的分销阻力。此外，生成式 AI 代理快速商品化，可能压缩纯软件公司的估值倍数。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
