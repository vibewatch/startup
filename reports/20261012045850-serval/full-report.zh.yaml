        title: 展示项
        blocks:
          - type: callout
            title: 不要把自动化率换算成市场规模
            body: 工单自动化比例和单工单成本主张描述的是运营结果。没有客户数、符合条件的工单量、定价和明确地域，它们无法支持收入 TAM、SAM 或 SOM。
            calloutType: assumption
            claimRefs:
              - CM004
              - CM005
              - CM006
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与架构分层
        blocks:
          - type: paragraph
            body: >-
              企业 IT 服务管理市场已经分成两类：在既有系统记录源上加装人工智能的成熟平台，以及围绕智能体自动化原生设计的新兴平台。ServiceNow、Jira Service Management
              等现有厂商主导核心企业服务目录，但主要依赖规则路由、管理脚本，以及收购或叠加到传统关系型架构上的对话式分流机器人。相比之下， Atomicwork、Aisera、Serval 等 AI
              原生挑战者把服务台重点放在自动执行动作，而不是人工跟踪工单。第三类是 eesel AI 这样的轻量对话层， 可直接接入现有帮助台而不替换底层系统记录源。Serval
              试图跨越这些分层：既支持双向同步下的渐进式共存，也支持替换 IT、HR、安全和财务部门的传统 ITSM 基础设施。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: 竞争对手画像与相对定位
        blocks:
          - type: paragraph
            body: >-
              对竞争格局的评估显示，自动化执行深度与企业平台广度之间存在明显取舍。ServiceNow 等成熟平台在全球 2000 强企业中拥有无可匹敌的平台广度和合规认证， 最近又通过收购 Moveworks，把多语言
              LLM 工单分流直接嵌入生态，增强了对话能力。但传统平台总拥有成本高，专业服务周期复杂。直接竞争者 Atomicwork 以角色化 AI
              协作者替代企业服务管理，并提供公开的结果导向定价，给评估提供透明锚点。eesel AI 等点解决方案通过快速自助式上线和历史工单模拟提高采用速度，
              却缺少全面企业服务管理所需的原生权限治理、资产跟踪和工单系统记录源。Serval 处于一个独特的高深度象限：把自然语言指令编译为确定性的 TypeScript 代码， 同时横向扩展至企业运营部门。
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP008
              - CP015
      - number: '3.3'
        title: 功能与架构能力对比
        blocks:
          - type: paragraph
            body: >-
              企业评估 AI 原生 ITSM，核心看架构防御力、代码透明度和治理边界。传统分流机器人使用概率语言模型猜测回复或推荐知识文章，而 Serval 采用双智能体架构： Catalyst Agent
              把自然语言管理员简报转成可检查、可测试的 TypeScript 工作流，Help Desk Agent 只执行已批准、已发布的例程。这种分离形成架构隔离， 确保终端用户不能提示系统执行未经审查的代码或访问未授权
              API。此外，Serval 原生提供即时权限配置和身份治理，把多日的 SaaS 权限申请压缩成一次点击的审批。 与 Aisera、Moveworks 这类封闭黑箱竞争者不同，Serval 直接暴露工作流代码，支持
              Git 版本控制、代码审查和基于分支的变更管理，直面企业安全和可审计性要求。
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: 定价模式、产品打包与市场进入摩擦
        blocks:
          - type: paragraph
            body: >-
              在竞争领域，市场进入方式和合同透明度构成明显的商业分野。Serval 采用不透明、需演示获取的定价策略，没有公布价位层级、席位费用或用量费率，
              而是按组织员工数和自动化范围协商定制订阅合同。每次部署都从专属前置部署工程师主导的四阶段试点开始，并附带至少自动化 50% 新增 IT 工单的明确合同保证。
              这种高触达方式能从资金充足的科技公司中最大化提取支付意愿，但相较于 Atomicwork（公开 Professional 计划，年费 $25,000 起并收取结果费用） 和 eesel AI（500
              个工单额度、月费 $299 起的透明订阅），也带来明显摩擦。
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: 护城河持久性、切换成本与现有厂商反应
        blocks:
          - type: paragraph
            body: >-
              Serval 的长期防御力依赖确定性工作流仓库和双向集成层产生的切换成本。IT 组织一旦在 Git 中构建并进行版本控制，把跨部门自动化流程固化下来， 迁移到竞争平台就需要重新设计这些运营例程。与此同时，与
              ServiceNow、Jira 和 Zendesk 的双向同步降低了初始采用门槛，允许客户在完全切换前无扰共存。 但竞争性替代风险依然很高。ServiceNow、BMC Helix 和 Atlassian
              等平台厂商正把原生 AI 智能体能力直接嵌入现有企业协议，利用深厚客户关系和已经沉没的管理投入。 如果传统套件能在不要求完整数据库迁移的情况下提供可信的自主解决能力，Serval
              定制定价、依赖工程师的销售模式可能面临日益加大的获客摩擦和利润率压缩。
            claimRefs:
              - CP005
              - CP007
              - CP011
              - CP014
              - CP015
      - number: '3.6'
        title: 展示项
        blocks:
          - type: callout
            title: 现有平台的惯性与捆绑式分流
            body: >-
              ServiceNow 收购 Moveworks，并深度接入企业系统记录源，对 Serval 的替换式策略构成强大障碍：现有 IT 买方可以部署捆绑的对话式分流，无需迁移核心服务目录，
              也无需经历定制的前置部署工程试点。
            calloutType: risk
            claimRefs:
              - CP007
              - CP014
          - type: callout
            title: 隔离式确定性是企业安全切口
            body: Serval 将对话式 Help Desk Agent 与 Catalyst 工作流生成引擎严格分开，建立审计边界，从而回应企业在特权访问管理环境中对黑箱 LLM 执行的合规顾虑。
            calloutType: insight
            claimRefs:
              - CP003
              - CP009
              - CP010
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、变现架构与定价不透明
        blocks:
          - type: paragraph
            body: >-
              Serval 的商业模式围绕企业软件即服务（SaaS）订阅平台展开，先从核心 IT 服务管理（ITSM）工作流切入，再横向扩张。不同于按推理 token、API 调用或工单解决 收取浮动费用的消费型 AI
              基础设施厂商，Serval 以可预测的按席位订阅层级打包平台，不另收执行费。平台主要通过员工帮助台自动化、自动权限配置和设备生命周期编排变现， 企业扩张则来自向人力资源、财务、法务和安全团队的跨部门采用。但
              Serval 在公开营销渠道上严格保持定价不透明，没有披露标价、最低起订席位或标准层级费用。 公司采用需演示获取的销售漏斗，按企业规模、席位数量和组织支付意愿双边协商合同。
            claimRefs:
              - CI003
              - CI005
              - CI007
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI007
      - number: '4.2'
        title: 市场进入、企业签约与销售效率动态
        blocks:
          - type: paragraph
            body: >-
              Serval 的企业市场进入模式面向首席信息官和 IT 基础设施负责人，采用高触达的前置部署工程模式。为了降低 ServiceNow 等现有厂商带来的部署风险， Serval
              为潜在客户配备专属部署工程团队，在试点期间配置定制集成并构建首批 Catalyst 工作流。这项前置服务投入帮助 Serval 在 Spotify、Fox、Live Nation、 GitLab
              等头部企业账户，以及 Perplexity、Mercor、Together AI 等高速增长科技独角兽中建立据点。销售策略按部门先落地、再扩展，逐步抬高合同价值： IT 服务台自动化常规工单后，Catalyst
              工作流引擎再用于自动化 HR 入职、财务采购审批和法务 NDA 流转。该顾问式模式能锁定更高平均合同价值和高切换成本， 但也带来前端利润摩擦；相比自助平台，采购犹豫还会拉长销售周期。
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI012
