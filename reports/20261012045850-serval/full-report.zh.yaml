  - id: FV001
    title: Serval 投资决策逻辑
    type: flow
    summary: 将企业问题规模、技术架构、客户进展与竞争风险依次串联，得出最终的跟踪建议。
    data:
      nodes:
        - id: n1
          label: 企业 IT 瓶颈
          detail: 手工处理工单、重置密码和脆弱的工作流广泛拖累生产力
        - id: n2
          label: 智能代理 AI 架构
          detail: Catalyst Agent 生成 TypeScript 工作流；Help Desk Agent 借助气隙隔离确定性执行
        - id: n3
          label: 早期客户进展
          detail: Perplexity、Mercor 和 Ramp 等知名科技客户的工单自动化率达到 50%+
        - id: n4
          label: 企业壁垒与在位者
          detail: ServiceNow 的规模（季度收入 $3.88B）和模型商品化的可能性威胁扩张
        - id: n5
          label: 估值倍数脱节
          detail: 在未披露 ARR、单位经济性或 SEC Form D 文件的情况下，估值跃升 4.3x 至 $1B 投后估值
        - id: n6
          label: 建议：跟踪
          detail: 在等待经审计的企业收入披露期间，维持跟踪立场，并将估值评级定为偏高
      edges:
        - from: n1
          to: n2
          label: 由……解决
        - from: n2
          to: n3
          label: 推动
        - from: n3
          to: n4
          label: 面对
        - from: n4
          to: n5
          label: 拉高
        - from: n5
          to: n6
          label: 得出结论
    approximationNotes: 该流程将定性尽调发现抽象成一套顺序决策框架。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV013
