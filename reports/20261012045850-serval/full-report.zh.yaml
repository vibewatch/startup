      - number: '7.3'
        title: 平台依赖、基础 LLM 暴露与竞争动态
        blocks:
          - type: paragraph
            body: >-
              Serval 商业模式的根本脆弱性在于完全依赖外部基础模型和既有软件生态。Serval 不构建或维护自有基础模型，而是通过 OpenAI 和 Anthropic 的前沿 API 路由任务。 这使 Serval
              暴露于上游突然调价、限速约束和 API 弃用。与此同时，ServiceNow 和 Atlassian 等传统企业服务管理厂商正在把原生智能体能力和对话式构建器嵌入根深蒂固的平台。 虽然 Serval 当前支持与
              ServiceNow、Jira Service Management 和 Freshservice 双向同步，但如果现有厂商限制 API 吞吐，或将生成式自动化工具激进地捆绑进现有企业许可协议，
              这种中间层定位仍很脆弱。
            claimRefs:
              - CR001
              - CR003
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR011
      - number: '7.4'
        title: 客户集中、定价摩擦与财务不透明
        blocks:
          - type: paragraph
            body: >-
              Serval 的商业进展带有明显的科技初创客户集中和高度估值不透明特征。早期案例和公开参考客户主要是风险投资支持的 AI 与软件公司，包括 Perplexity、Together AI、 Clay 和
              Mercor。虽然这些高速增长的科技客户展示了快速采用，Serval 在制造、医疗和零售等传统强监管企业垂直领域仍基本未经验证。此外，公司采用没有公开层级、
              依赖高资源投入前置部署工程试点的不透明、需演示获取的定价模式。尽管公司声称收入增长 500% 并取得 $1B B 轮估值，但尚未公开披露 ARR、毛利率、获客成本或现金消耗， 无法进行标准的单位经济投资判断。
            claimRefs:
              - CR004
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR008
