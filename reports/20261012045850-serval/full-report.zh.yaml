            body: >-
              Serval 的运营风险集中在自主工作流可能对生产企业环境触发意外修改。为缓解对话式 AI 固有的提示注入漏洞，平台在自然语言 Help Desk Agent 与后端工作流执行之间 设置架构隔离。所有
              Catalyst 自动化都会编译成确定性 TypeScript 代码，执行前必须经过管理员明确审查、版本控制和发布。但企业客户部署显示，在映射复杂跨部门权限时，
              初期存在运营学习曲线和配置负担。此外，主动后台智能体会持续检查已连接的 IT 基础设施，在工单提交前起草修复方案；如果放松管理员审查护栏，可能引入运营扰动。
            claimRefs:
              - CR002
              - CR005
              - CR010
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
