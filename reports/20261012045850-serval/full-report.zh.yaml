        - label: Serval
          x: 8.5
          'y': 8
        - label: Atomicwork
          x: 7.5
          'y': 7
        - label: Moveworks（ServiceNow）
          x: 5.5
          'y': 8.5
        - label: Aisera
          x: 6
          'y': 5.5
        - label: eesel AI
          x: 4
