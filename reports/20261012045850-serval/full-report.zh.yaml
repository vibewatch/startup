  - id: FM001
    title: 证据约束下的市场规模阶梯
    type: pyramid
    summary: 证据将范围从宽泛的服务管理相邻市场收窄到可支撑的初始工作流切入口，但不赋予缺乏依据的市场价值。
    data:
      items:
        - label: 宽泛相邻市场
          value: Enterprise service management
          detail: IT、HR、财务、法律、安全和运营工作流
        - label: 核心类别
          value: Internal IT service management
          detail: 服务台、工单、访问、资产和员工请求
        - label: 部署切入口
          value: Automation overlay
          detail: 双向同步可以先于系统记录源迁移
        - label: 目标买方
          value: Mid-market to enterprise IT and operations
          detail: 竞争对手发布的评测将其描述为最匹配的客户画像
        - label: 初始用例
          value: Repetitive access and service requests
          detail: 公开客户证据显示，配置工作流后耗时缩短
        - label: 数值投资判断边界
          value: TAM/SAM/SOM unavailable
          detail: 留存来源没有提供透明的市场规模数值或方法论
    approximationNotes: 这是定性的范围阶梯，刻意不包含任何估算市场价值。
    claimRefs:
      - CM001
      - CM002
      - CM004
      - CM011
      - CM014
      - CM015
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 按自动化执行深度和企业平台广度，展示 ITSM 与自动化提供商的战略定位。
    data:
