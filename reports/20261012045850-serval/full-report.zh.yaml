  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Serval 能够站住脚的核心市场是企业内部服务管理，而不是外部客户支持。其自身定位覆盖员工请求处理、入职与离职、即时权限、工单、资产管理和工作流编排。 因此，最接近的预算边界是 ITSM
              软件、身份与权限运营、工作流自动化三者的交集；更广的邻接市场包括 HR、财务、法务和安全服务工作流。 现状替代方案则是人工队列和管理员在旧系统中搭建的工作流。Serval 还提供较低切换成本的切入方式：作为与现有
              ITSM 同步的自动化层，客户可以暂缓更换系统记录源。 指定证据无法判断这些预算中哪些是新增预算，哪些只是重新分配。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
      - number: '2.2'
        title: 受证据约束的市场测算
        blocks:
          - type: paragraph
            body: >-
              没有留存来源提供透明的市场规模方法、地理边界、基准年份、CAGR，或可用于 Serval 的数字化 TAM/SAM/SOM。公开结果证据有助于判断采用情况， 但不能换算成市场规模：Serval 称
              Perplexity 的自动化率超过 50%，又单独表示客户通常能将帮助台工单的 50%–80% 自动化。其买方指南还引用 $15–$25 的人工坐席工单成本与 $2–$4 的 AI
              解决工单成本，但指定资料池没有底层分析材料。这些指标说明存在潜在效率切口，不等于可触达收入。 因此，估值模型应使用客户具体的工单量、符合条件的工作流占比、定价和留存率，而不是套用泛化的 ITSM 市场估值。
            claimRefs:
              - CM004
              - CM005
              - CM006
