      - number: '1.3'
        title: 融资、经营信号与投资判断边界
        blocks:
          - type: paragraph
            body: >-
              Serval 的披露融资增长极快。SiliconANGLE 报道称，公司于 2025 年 10 月 21 日完成由 Redpoint 领投的 $47M A 轮，当时累计资本达到 $52M。 Serval 于
              2025 年 12 月 11 日宣布由 Sequoia 领投的 $75M B 轮，估值 $1B，并称自 8 月以来累计融资 $127M。Multiples 记录两轮定价融资合计 $122M，因此 Serval
              所说总额中多出的 $5M 需要核对，不能直接归入未披露轮次。Serval 还称，A 轮后约三个月内收入增长 500%、员工数增长逾三倍，
              但没有给出绝对收入基数或当前员工数。客户证据同样只是方向性信号：公司材料称自动解决 50%–80% 的工单，独立报道则称六家已命名客户将超过 50% 的 IT
              工单自动化。两者都不能证明客户总数、ARR、留存率、利润率或现金消耗。
