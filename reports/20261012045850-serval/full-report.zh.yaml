    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Serval 成立于 2024 年，总部位于旧金山。产品把帮助台、权限管理、资产管理和工作流自动化结合起来，服务企业内部运营。Serval 描述了双智能体模式： Catalyst
              将自然语言指令转成代码工作流，Help Desk Agent 则针对员工请求运行已获批准的工作流。公开证据支持其企业软件模式，但看不到透明价目表： Multiples 将收入模式归类为订阅，Macha
              则未找到公开套餐或起始价格，并称其采用演示驱动、定制合同的流程。因此，外部无法估算合同价值、 部署经济性或经常性收入。
