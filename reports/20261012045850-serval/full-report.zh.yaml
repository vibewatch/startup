              公开确认的领导层仍集中在联合创始人 Jake Stauch（首席执行官）和 Alex McLeod（首席技术官）身上。Serval 还将前 Greylock 合伙人 Christine Kim
              列为战略项目负责人及 Serval Start 负责人。这个总部在旧金山、为期两年的项目首期从 500 多名申请者中选出 12 人，旨在持续输送前置部署工程人才。
              该项目是可信的招聘信号，但没有解决关键人物依赖或治理问题。现有证据未披露董事会成员、独立董事、创始人投票控制权、继任安排或投资人同意权， 因而无法据此判断董事会独立性或控制权分配。
