evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, board committees, shareholder percentages, and any minority-protection or consent rights
      attached to Mitsubishi, Diamond, Manulife, or Generate.
    whyItMatters: >-
      Control economics and board composition affect future financing flexibility, exit optionality, and conflict
      management.
    diligencePath: >-
      Request the current cap table, board observer or director matrix, and the latest stockholders or investor-rights
      agreements.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: >-
      Current revenue, ARR, gross margin, cash burn, and any mix between subscription revenue, project sales, and other
      services.
    whyItMatters: >-
      A clean company-overview judgment is incomplete without knowing whether disclosed scale metrics are translating
      into financial performance.
    diligencePath: >-
      Obtain CFO-prepared monthly reporting, audited financial statements if available, and a bridge from project MW or
      customers to revenue and margin.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Most recent priced equity valuation, security type, liquidation preferences, and any secondary activity around the
      2024 and 2025 financings.
    whyItMatters: Recommendation framing and dilution risk are hard to assess without a current valuation anchor.
    diligencePath: >-
      Request the latest financing documents, board materials approving the round, and any contemporaneous fairness or
      valuation work.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: Current enterprise-wide employee count and any recent hiring, attrition, or restructuring disclosures.
    whyItMatters: Headcount is a key maturity and burn-rate indicator for a capital-intensive clean-energy platform.
    diligencePath: Request current HR census by function and location plus a 12-month hiring and attrition summary.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: customer-complaints
    missingEvidence: >-
      A broader and normalized complaint dataset across BBB, state attorneys general, utility commission filings, and
      internal customer-service metrics.
    whyItMatters: >-
      One resolved BBB complaint is not enough to conclude whether onboarding or billing friction is isolated or
      systemic.
    diligencePath: >-
      Request complaint-rate metrics by product and state, then cross-check against utility and regulator complaint
      databases.
    relatedQuestionRefs:
      - QO028
  - type: conflicting-data
    severity: material
    topic: market-size-normalization
    missingEvidence: >-
      A normalized current-market capacity series that reconciles DOE or NREL, Wood Mackenzie or CCSA, and any later
      public dataset pages onto the same AC or DC basis and as-of date.
    whyItMatters: >-
      Nexamp valuation and share-of-market work will overstate or understate SAM if public market-size figures are
      blended without unit normalization.
    diligencePath: >-
      Obtain the latest underlying project-level dataset or analyst workbook and restate every cited market-size figure
      onto one consistent unit basis before modeling penetration.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: public-sector-and-anchor-mix
    missingEvidence: >-
      Project-level disclosure of Nexamp's anchor-tenant mix, public-sector share, and subscriber concentration by state
      or utility territory.
    whyItMatters: >-
      Anchor concentration changes project finance, customer-acquisition cost, and churn risk, but the public pack does
      not show how much of Nexamp's pipeline depends on those segments.
    diligencePath: >-
      Request state-by-state subscriber mix, anchor concentration limits, and public-sector offtake examples from
      management or lender materials.
    relatedQuestionRefs:
      - QM017
      - QM018
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: blocking
    topic: nexamp-specific-sam
    missingEvidence: >-
      A current Nexamp disclosure showing active states, subscriber counts or pipeline by utility territory, and the
      share of projects already cleared for interconnection and billing.
    whyItMatters: >-
      Without utility-territory and pipeline-clearing data, public evidence cannot convert the broad enabled-state
      market into a credible Nexamp-specific SAM or SOM.
    diligencePath: >-
      Obtain utility-territory pipeline, waitlist, and energization data from Nexamp management or project-finance
      materials and size SAM from live or near-live territories only.
    relatedQuestionRefs:
      - QM026
    relatedTableRefs:
      - TM002
  - type: stale
    severity: minor
    topic: federal-support-stability
    missingEvidence: >-
      Post-litigation or post-rulemaking evidence on the lasting status of Solar for All and the practical effect of
      changing federal tax-credit timing on community-solar finance.
    whyItMatters: >-
      Federal support may not be the primary demand driver, but subsidy and tax-credit uncertainty still affects LMI
      economics, financing cost, and project timing.
    diligencePath: >-
      Refresh EPA, Treasury, and state implementation materials before using any federal support assumption in the
      investment case.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: competitor-unit-economics
    missingEvidence: >-
      Public competitor customer-acquisition cost, churn, NRR, and contribution-margin data comparable to Nexamp's
      actual operating economics.
    whyItMatters: >-
      Public pricing convergence means retail discounts alone do not explain who wins; without unit-economics, diligence
      cannot tell whether Nexamp's integrated model converts better than Arcadia-style distribution or rooftop-channel
      entrants.
    diligencePath: >-
      Request cohort CAC, waitlist conversion, churn, default rates, and billing-dispute rates from management and
      benchmark them against peer investor or lender materials under NDA.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: competitor-territory-exposure
    missingEvidence: >-
      Utility-territory, subscriber-concentration, and energized-versus-waitlisted project exposure across the peer set,
      especially for Summit Ridge, Dimension, Pivot, and Solar Landscape.
    whyItMatters: >-
      The category's real moat cap is local utility and policy dependence, so state or utility concentration can make a
      seemingly scaled competitor far more fragile than headline GW figures imply.
    diligencePath: >-
      Collect utility-territory and energization-stage detail from company decks, permitting records, or lender
      materials and restate each peer's concentration by utility, state, and project stage.
    relatedQuestionRefs:
      - QP027
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: minor
    topic: state-specific-contract-terms
    missingEvidence: >-
      A current, multi-state side-by-side comparison of community-solar contract terms, billing models, credit checks,
      and cancellation rules across the major providers outside a few public Illinois or review sources.
    whyItMatters: >-
      Public retail comparisons are good enough to show pricing convergence and friction patterns, but they are not
      complete enough to underwrite every state-level customer experience or compliance burden.
    diligencePath: >-
      Pull current customer agreements or regulator-filed disclosures for each provider's largest active states and
      normalize billing, credit, and termination terms into one contract comparison workbook.
    relatedQuestionRefs:
      - QP028
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Monthly GAAP revenue, ARR definitions, deferred revenue, and segment revenue mix by community solar, PPA, and
      utility-scale development.
    whyItMatters: >-
      Public pricing mechanics do not reveal recognized revenue quality, seasonality, or the mix between recurring
      subscription cash flow and project-development revenue.
    diligencePath: >-
      Request board materials or monthly management reporting package with revenue bridge, contract mix, and
      revenue-recognition memo.
    relatedQuestionRefs:
      - QI020
      - QI025
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-runway
    missingEvidence: >-
      Current unrestricted cash, restricted cash, monthly burn by function, and 18-24 month runway model under base and
      downside cases.
    whyItMatters: >-
      Nexamp clearly has financing access, but solvency and next-round timing cannot be underwritten without actual
      liquidity and burn data.
    diligencePath: >-
      Request treasury report, 13-week cash forecast, covenant-compliance report, and financing plan through at least
      year-end 2027.
    relatedQuestionRefs:
      - QI019
      - QI025
