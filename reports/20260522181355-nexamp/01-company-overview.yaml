- id: capital-scale-and-partnerships
  title: Capital Formation, Scale, and Partner Signals
  body: >-
    Nexamp's public capital-formation and scale trajectory is well evidenced from 2023 forward. Official and independent sources agree that the company secured more than $400 million of tax equity and debt in May 2023 for 49 solar-and-storage projects across six states, then placed a 1.5 GW Heliene module order in August 2023, then opened a second national headquarters in Chicago in January 2024 with more than $2 billion of Illinois investment plans, and then raised $520 million of corporate capital led by Manulife in 2024. Around that 2024 raise, Nexamp said it served nearly 80,000 customers and had more than 1.5 GW of generating and in-construction capacity. Later disclosures push the story further: the Walmart and Microsoft partnerships show continuing demand for community-solar offtake, pv magazine reported a roughly $3.9 billion path to nearly 3 GW by 2028, and Macquarie added a $350 million long-term facility for utility-scale expansion. The company therefore looks financeable and commercially relevant even though current valuation and revenue remain opaque.
