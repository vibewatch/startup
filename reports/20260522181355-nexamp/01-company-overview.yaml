    - Lead investor in 2024 corporate financing
    - Led the $520M raise
    - Key provider of growth capital into national pipeline expansion
    - Clarify security type, governance rights, and liquidation preferences
  - - Generate Capital
    - Existing investor and repeat financing partner
    - Participated in the $520M raise and was cited in 2024 financing materials
    - Repeated sponsor support lowers signaling risk around follow-on capital
    - Determine current stake and economic role after 2024 financing
  - - U.S. Bancorp Impact Finance
    - 2023 tax-equity provider
    - Led tax equity in the 49-project, six-state portfolio financing
