    - Majority owner and long-term strategic sponsor
    - Mitsubishi says it first invested in 2016 and Nexamp became a subsidiary in 2018
    - Strongest disclosed control anchor in the public pack
    - Obtain current ownership percentage, board seats, and any veto or consent rights
