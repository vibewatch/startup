company:
  name: Nexamp
chapter:
  number: 1
  title: Company Overview
  summary: Nexamp is a 2007-founded, vertically integrated community-solar developer, owner, and operator centered on subscriber bill-credit products and expanding into broader distributed solar and storage. The public record shows a clear capital-formation arc — more than $400 million of project financing in 2023, a $520 million corporate raise in 2024, and a $350 million Macquarie facility in 2025 — alongside disclosed scale markers of nearly 80,000 customers and more than 1.5 GW of generating and in-construction capacity in 2024. The main diligence gaps are current valuation, revenue or ARR, enterprise headcount, and fuller governance disclosure beyond CEO Zaid Ashai, co-founder Will Thompson, and Mitsubishi or Diamond's majority-ownership history.
sections:
- id: identity-and-model
  title: Identity, Footprint, and Business Model
  body: >-
    Nexamp should be treated as a vertically integrated community-solar platform rather than a pure lead generator or a narrow EPC. Official current materials say the company was founded in 2007 by two U.S. Army veterans and operates by acquiring or developing projects, financing them, building them, operating them, and managing subscribers over the asset life. The product explanation is consistent across official and third-party consumer-oriented pages: customers subscribe to off-site solar farms, receive utility-bill credits, and avoid rooftop hardware, sign-up fees, and long-term contracts while targeting roughly 10% to 15% savings. Nexamp also claims average annual subscriber savings of about $275. The official about and leadership pages anchor the present-day footprint: Boston remains the primary headquarters, Chicago is a second national headquarters, and the company presents itself as active across multiple offices and market regions. For later chapters, the reusable ground truth is that Nexamp monetizes distributed solar and storage through development and ownership plus customer management, not through a software-only or installer-only model.
