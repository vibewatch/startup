  - - MUFG
    - 2023 debt provider
    - Led debt commitments alongside U.S. Bancorp tax equity
    - Confirms institutional debt access for distributed solar and storage projects
    - Request tenor, covenants, and collateral package
  - - Heliene
    - Module supply-chain partner
    - 1.5 GW order for community-solar module supply
    - Major domestic-content and procurement de-risking signal
    - Verify volume delivered to date, pricing protection, and domestic-content assumptions
  - - Walmart
    - Retail partner and customer-proof counterparty
    - 31 community-solar projects across five states and more than 120 MW DC
    - High-visibility external validation of customer demand and execution credibility
    - Obtain contract tenor, REC or subscriber economics, and expected COD cadence
  - - Microsoft
    - Corporate REC offtake counterparty
    - Roughly 100 projects and 300 MW AC across five ISO regions
    - Demonstrates national pipeline monetization beyond household subscriptions
    - Clarify REC pricing, project timing, and pipeline conversion assumptions
  - - Macquarie Asset Management
    - Long-term financing partner
    - Arranged $350M facility for utility-scale solar and battery expansion in 2025
    - Supports the new utility-scale chapter of the business
    - Determine whether utility-scale financing changes leverage tolerance or sponsor control
