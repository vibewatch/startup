- id: milestones-adverse-and-gaps
  title: Milestones, Adverse Signals, and Remaining Gaps
  body: >-
    Company-overview diligence cannot be all growth milestones. The strongest negative signal in the fetched pack is not an existential operating failure but growing friction around deployment economics and disclosure limits. In August 2025, Nexamp and 14 affiliates filed a New York Public Service Commission complaint disputing $3.615 million of additional National Grid interconnection charges across 14 projects; the pleading argues the utility missed required timelines and relied on stale cost estimates. RTO Insider independently characterized the matter as a complaint about unfair cost increases and interconnection-process violations. On the consumer side, BBB shows one resolved billing complaint in the last three years, which is too small to call a broad service breakdown but enough to preserve as a minor adverse datapoint. More important than either issue is what the public record still does not show: current revenue or ARR, current valuation after the 2024 and 2025 financings, enterprise-wide headcount, and a complete board or cap-table picture. Those disclosure gaps should stay explicit rather than being papered over with stale private-market estimates.
