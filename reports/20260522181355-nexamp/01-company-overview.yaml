- id: leadership-and-governance
  title: Founders, Leadership, and Governance
  body: >-
    Nexamp's public leadership picture is strongest at the executive level and weakest at detailed governance. The leadership page identifies Zaid Ashai as chairman and CEO, Will Thompson as co-founder and senior vice president of asset-management services, and an operating bench that includes Kamran Idrees in legal, Peter Tawczynski in finance, Chris Clark in development, Chris Perron in infrastructure deployment, Kyle Gietzen in capital markets, and Kelly Friend in policy and markets. The founder story page adds historical context: Dan Leary and Thompson took the business full-time in February 2007 after Leary's early garage-based solar work. Ownership disclosure is thinner but still material. Mitsubishi says it first invested in 2016 and that Nexamp became its subsidiary in 2018 through Diamond Generating. That gives a plausible control anchor, but the fetched pack does not expose a current board roster, economic ownership split, or any minority-protection terms. Governance diligence should therefore focus on formal board composition, investor rights, and post-2024 control economics rather than on executive-role uncertainty.
