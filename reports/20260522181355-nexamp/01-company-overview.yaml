  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, board committees, shareholder percentages, and any minority-protection or consent rights attached to Mitsubishi, Diamond, Manulife, or Generate.
    whyItMatters: Control economics and board composition affect future financing flexibility, exit optionality, and conflict management.
    diligencePath: Request the current cap table, board observer or director matrix, and the latest stockholders or investor-rights agreements.
    relatedQuestionRefs:
    - QO010
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Current revenue, ARR, gross margin, cash burn, and any mix between subscription revenue, project sales, and other services.
    whyItMatters: A clean company-overview judgment is incomplete without knowing whether disclosed scale metrics are translating into financial performance.
    diligencePath: Obtain CFO-prepared monthly reporting, audited financial statements if available, and a bridge from project MW or customers to revenue and margin.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Most recent priced equity valuation, security type, liquidation preferences, and any secondary activity around the 2024 and 2025 financings.
    whyItMatters: Recommendation framing and dilution risk are hard to assess without a current valuation anchor.
    diligencePath: Request the latest financing documents, board materials approving the round, and any contemporaneous fairness or valuation work.
    relatedQuestionRefs:
    - QO026
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: headcount
    missingEvidence: Current enterprise-wide employee count and any recent hiring, attrition, or restructuring disclosures.
    whyItMatters: Headcount is a key maturity and burn-rate indicator for a capital-intensive clean-energy platform.
    diligencePath: Request current HR census by function and location plus a 12-month hiring and attrition summary.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: customer-complaints
    missingEvidence: A broader and normalized complaint dataset across BBB, state attorneys general, utility commission filings, and internal customer-service metrics.
    whyItMatters: One resolved BBB complaint is not enough to conclude whether onboarding or billing friction is isolated or systemic.
    diligencePath: Request complaint-rate metrics by product and state, then cross-check against utility and regulator complaint databases.
    relatedQuestionRefs:
    - QO028
