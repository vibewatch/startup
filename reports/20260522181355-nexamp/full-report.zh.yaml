      - number: '8.4'
        title: 最终判断取决于私人尽调，不是又一篇新闻稿
        blocks:
          - type: paragraph
            body: >-
              剩余工作概念上直接，影响上决定性。若要从继续研究明确上调为有条件买入，公司必须证明公开记录无法证明的东西。第一，打开股权结构表，让投资者看清 2024-2026
              年融资在优先级堆栈中的确切位置，以及清算优先权或反稀释调价条款是否侵蚀普通股上行。第二，管理层必须提供经审计、或至少达到董事会级别的组合现金收益证据，订户回款和流失数据，契约余量，以及按州拆分的项目政策重置和并网准备金敞口。第三，退出路径必须按当前市场现实来描述。近期先例显示，资方再资本化、基础设施基金出售和结构化延续融资，比溢价公开市场退出更可信。如果
              Nexamp 在融资质量上开始像承压太阳能同行，或政策与并网条件在 Nexamp
              提供更清晰经济性之前把社区太阳能市场再压下一档，投资逻辑就会破裂。在私人尽调补上这些缺口之前，正确姿态是先看下行、带着价格纪律接触，并愿意因为价格离场。
