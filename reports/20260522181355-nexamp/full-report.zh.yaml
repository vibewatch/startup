  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价机制
        blocks:
          - type: paragraph
            body: >-
              Nexamp 的公开客户材料描述的是一个直接但非 SaaS 的收入引擎。公司不是按固定 cents-per-kWh
              费率售电；它把社区太阳能项目的一部分分配给订阅用户，让公用事业公司应用由此产生的账单抵扣，然后按约定折扣向客户收取这些抵扣费用。该折扣是主要公开定价信号：Nexamp 自己的 2026
              年指南和帮助文章显示，州项目折扣约 10% 至 15%，账单抵扣结构旨在降低全年电力总成本，而不是替代公用事业关系。指南还清楚说明，计费历史上是双账单流程，不过 Nexamp 正在转向合并到公用事业账单的收费。

              经济含义是，Nexamp 的居民收入质量取决于三项公开只部分可见的变量：公用事业信用估值、对客户的合同折扣和回款效率。Nexamp 披露的信息足以说明机制，包括 Shared Solar Bill
              Credit、SO Subscription Fee 以及公用事业公司的 1% net-crediting fee。但它没有披露各队列实际定价、订阅用户流失、坏账损失或收入确认政策。居民订阅以外，Nexamp
              的企业网站宣传商业购电协议（PPA）、托管太阳能农场项目、储能和独立服务，说明收入组合比面向客户的社区太阳能更宽，还包括商业和项目开发收入。
