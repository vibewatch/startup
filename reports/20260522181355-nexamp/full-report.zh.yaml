  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Nexamp 不应按模糊的“整个太阳能” TAM 分析。本章核心市场是州政策启用的社区太阳能：异地、接入配电网的项目，账单抵扣流向多个客户，并靠订阅管理、锚定租户需求和经常性电费节省变现。DOE
              材料将该产品定义为家庭、企业、非营利组织及其他客户类别共享收益，而不是单站点所有权。这一点关键，因为相关替代集合不只是其他太阳能开发商。真正替代方案包括继续使用默认公用事业供电、在场地条件允许时安装屋顶太阳能、签另一份共享太阳能订阅，或单独推进现场商业项目。Nexamp
              最匹配的是客户希望省钱并参与清洁能源，但无法或不愿自行安装屋顶太阳能的场景。公司自己的客户材料也强化了这一点：卖点是无前期成本的账单抵扣节省，另行开票，不是硬件销售。因此，市场边界比总太阳能市场窄，但又比低收入居民订阅更宽，因为公共部门锚定客户、小企业及其他非居民账户可以稳定项目经济性。
