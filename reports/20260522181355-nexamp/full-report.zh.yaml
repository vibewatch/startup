      - number: '7.4'
        title: 剩余敞口、缓释因素与否决标准
        blocks:
          - type: paragraph
            body: >-
              最强的公开缓释因素真实存在，但不完整。Nexamp 并非在真空中运营：New York 的 SIR
              流程、州项目管理方、公用事业费率文件和活跃政策工作组都提供了改革通道；公司近期又募集了新的债务和股权资本；客户评价表面也只是分化，而非一边倒负面。即便如此，剩余判断仍偏谨慎，因为可见缓释因素还没有回答最关乎投资的问题。公开来源仍未量化头部客户集中度、按支出或
              MW
              计算的供应商集中度、契约余量、现金跑道、项目级回报，或详细的安全控制姿态。因此，最清晰的否决标准应是可衡量的运营和融资事件，而不是感觉：更多意外并网账单、投诉积压增加、融资或供应商延误，或管理层在尽调中无法提供集中度和经济性数据。若这些触发因素出现，风险故事会从可管理的复杂性转向投资逻辑受损。
