  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、布局与商业模式
        blocks:
          - type: paragraph
            body: >-
              Nexamp 不应被当作纯线索生成商或狭窄 EPC，而应看作垂直整合的社区太阳能平台。官方现有材料称，公司由两名美国陆军退伍军人于 2007
              年创立，运营方式是收购或开发项目、为项目融资、建设、运营，并在资产全生命周期管理订阅用户。官方和第三方面向消费者页面对产品解释一致：客户订阅异地太阳能农场，获得电费账单抵扣，不需要屋顶硬件、注册费或长期合同，目标节省约
              10% 至 15%。Nexamp 还称订阅用户年均节省约 $275。官方 About 和领导层页面锚定了当前布局：Boston 仍是主总部，Chicago
              是第二全国总部，公司称自己在多个办公室和市场区域运营。后续章节可复用的底层事实是：Nexamp 通过开发和持有资产叠加客户管理，把分布式太阳能和储能变现，而不是纯软件或纯安装商模式。
