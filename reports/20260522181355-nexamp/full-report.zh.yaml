  - id: TM004
    title: 增长驱动因素和约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - 可负担定位和账单节省
        - 正向
        - 当前
        - 社区太阳能越来越被定义为消费者降本工具，而不只是气候基础设施
        - 验证 Nexamp 在实际公用事业辖区里的节省额，是否仍能跨过消费者获客门槛
      - - LMI 预留和受保护节省规则
        - 正向
        - 当前至中期
        - 州规则可扩大可及性，并减少目标细分市场中的订户价值流失
        - 梳理 Nexamp 哪些州要求明确的节省下限或预留比例
      - - NCSP+ 技术援助和生态支持
        - 正向
        - 当前
        - 即便补助存在不确定性，联邦协调仍在支撑项目设计和合作伙伴知识
        - 确认 Nexamp 是否受益于当前州级协作或技术援助渠道
      - - 订户获客成本下降趋势
        - 正向
        - 2025-2030 年展望
        - 只要开发商能维持高转化，就会改善单位经济性
        - 索取 Nexamp 按州、细分市场和等待名单账龄拆分的 CAC
      - - 并网排队延迟
        - 负向
        - 当前
        - 即使客户需求存在，项目并网送电和收入启动也会变慢
        - 承保时间表前，先按公用事业公司和馈线校准 Nexamp 项目延误
      - - 账单和抵免复杂度
        - 负向
        - 当前
        - 双账单流程和延迟抵免会压低转化、满意度或实际节省
        - 按州计费制度衡量流失率和投诉率
      - - Solar for All 和税收抵免时点的联邦政策波动
        - 负向
        - 当前至中期
        - 公共补贴假设不像 2024 年看起来那么可融资
        - 建模无 Solar for All 支持、安全港执行更慢的下行情景
      - - 围绕补偿、灵活并网和可负担性的州规则重设
        - 混合
        - 2026 年起
        - 规则改善的市场带来上行，但也迫使商业打法持续调整
        - 为 Nexamp 的现有和目标市场维护逐州规则跟踪器
    notes: 本表同时放入需求侧驱动和运营约束，因为只有政策、并网和计费让项目跑通后，市场规模才能变现。
