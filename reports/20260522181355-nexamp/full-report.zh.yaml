        - 政策敏感度叠加同业困境，使下行风险不对称
        - 要求下行保护和硬性尽调关口
        - 只有 Nexamp 证明现金收益稳定、契约压力低，风险才会下降
      - - 估值立场
        - 价格未披露时未知；只有接近区间低端才算合理
        - 公开可比公司分歧太大，眼下不足以支撑完整平台溢价
        - 不要只凭新闻稿支付财务 sponsor 级倍数
        - 若入场价格落在区间下三分位且优先级清晰，立场会改善
      - - 首选退出路径
        - IPO 之前先走 sponsor 再资本化或出售给基础设施买家
        - 近期行业先例更支持私有到私有的退出
        - 按私人市场退出承销，不押注激进的公开市场重估
        - 若太阳能公开可比公司修复且 Nexamp 披露完整报告指标，判断会改变
    notes: 本表是决策摘要，不是财务模型。它把本章证据落到当前立场、价格纪律，以及若要上调建议还需要补哪些尽调。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV045
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 支撑证据
      - 反向观点
      - 什么会改变判断
    rows:
      - - 平台融资动能
        - Nexamp 已披露多轮九位数融资，覆盖股权、债务和开发资本
        - 融资动能并不揭示股权稀释、现金转化或优先股堆叠严重程度
        - 展示完整股权结构表、资金用途和融资后已实现现金指标
      - - 市场体量成立
        - 社区太阳能规模足够大，仍能吸引机构项目融资
        - 行业增长已经放缓，仍高度暴露于政策和并网摩擦
        - 证明 Nexamp 的州别组合集中在经济性稳定、排队可见度高的市场
      - - 战略平台上行
        - Altus 证明分布式太阳能能吸引数十亿美元级 sponsor 私有化
        - Altus 的公开披露比 Nexamp 当前更干净
        - 提供经审计的资产层面现金生成和 sponsor 可接手的报告包
      - - 困境下行是真实风险
        - Sunnova 说明，一旦杠杆、流动性和政策转负，太阳能平台股权可能崩塌
        - 住宅太阳能困境并不等同于社区太阳能平台经济性
        - 证明杠杆更低、回款更强，州政策组合也比困境同业更少暴露
      - - 私人资本仍可获得
        - Dimension、Pivot、Summit Ridge 和 Solar Landscape 都在 2025-2026 年完成大额融资安排
        - 债务仓储和建设期融资工具，不等于干净的股权估值标记
        - 证明股权需求，而不只是项目层面债务胃口
      - - 当前反向逻辑
        - 公开证据仍可解释为资本密集型项目滚动整合，普通股之上隐藏着优先级
        - 如果私人尽调显示现金收益持久、清算瀑布干净，Nexamp 也可能拿到溢价
        - 提供清算瀑布模型、DSCR 历史和逐州毛利率桥
    notes: 投资逻辑和反向逻辑都有意对价格敏感。公司质量更高也可能仍是差投资：如果投资人穿透未解决的优先级和政策风险去付款，回报就会被吃掉。
