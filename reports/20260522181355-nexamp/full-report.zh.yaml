              300 MW AC；Nexamp 则把该组合定位为每年惠及近 100000 户家庭，并叠加 LMI 和劳动力收益。Chipotle 的锚定客户—订户结构最清楚：它取得与 20 MW 相关的账单抵扣，其余 55
              MW 预计惠及约 9000 个家庭、非营利组织和企业。Albany Medical Center 是最成熟的具名机构参照，涉及 4 个太阳能农场、约 7.9 MW，每年节省超过
              $150000。Give-A-Ray、Nexamp 在 Maryland 的项目群等 LMI 项目说明，公开证据并不只来自企业标识。
