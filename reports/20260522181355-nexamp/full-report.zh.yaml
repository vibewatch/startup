  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 指示性 EV 区间
      - 回报逻辑
      - 概率信号
      - 关键失败模式
    rows:
      - - 悲观
        - 仅靠公开资料的尽调始终无法补齐股权结构表和现金收益缺口，政策逆风让社区太阳能折现率持续处在高位
        - USD 900M 至 1200M
        - 入场只有在带下行保护的项目平台敞口下才成立，而不是纯增长股权
        - 市场进一步收缩、意外成本通胀增加，或出现救助融资措辞
        - 优先股和债务优先级吃掉多数上行，退出倍数同时压缩
      - - 基准
        - 私人尽调确认签约现金生成稳定、优先级可控，但透明度不足以支撑完整平台溢价
        - USD 1200M 至 1600M
        - 只有入场价为 sponsor 再资本化或基建出售退出留出空间，且无需激进重估时才可接受
        - 组合表现包干净、契约余量充足，州项目组合稳定
        - 现金收益不及预期，或政策重置削弱订户经济性
      - - 乐观
        - Nexamp 证明现金生成经过审计、优先股包袱温和，且 sponsor 胃口接近 Altus 式控股定价
        - USD 1800M 至 2200M
        - 上行取决于干净的私人市场退出，以及 Nexamp 能像高溢价分布式太阳能平台一样扩张的证据
        - 管理层开放经审计指标、项目回报和可支持退出的报告
        - 隐藏稀释或疲弱经营指标会把情景打回基准或悲观区间
    notes: 这些是示意性企业价值区间，不是观察到的市场估值标记，也不是每股股权价值。如果清算优先权、债务或其他优先索取权高于公开记录目前暗示，股权价值可能明显更低。
