  - id: TP001
    title: 竞争者画像表
    columns:
      - 竞争者 / 替代方案
      - 类别
      - 公开规模 / 融资信号
      - 目标买方
      - 产品范围
      - 公开定价 / 打包方式
      - 战略角度 / 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Rows cover the most relevant direct, adjacent, substitute, and status-quo alternatives evidenced in the 2026
        fetched source pack, not every U.S. community-solar provider.
    rows:
      - - Nexamp
        - 以锚定客户为核心的一体化运营商
        - 全国性开发商 / 提供商；伊利诺伊州对比页比企业规模细节更清楚地展示当前公开零售条款
        - 希望无需现场面板就获得社区太阳能节省的租户、房主和企业
        - 面向订户的社区太阳能，覆盖开发、建设、持有、运营
        - 引用的 CUB 图表显示，伊利诺伊州方案节省 15%、期限 15 年、提前 90 天通知
        - 强一体化标杆，但公开定价不明显高出品类常规水平
      - - Summit Ridge Energy
        - 直接同业
        - 158 MW 获得 $305M 融资；运营或开发中超过 2 GW
        - 社区太阳能覆盖区内的家庭和企业，包括环境正义和 LMI 细分
        - 社区太阳能开发、持有和订户运营
        - 每月账单抵免节省；搬迁可提前一个月终止；具体全州定价公开层面尚未完全标准化
        - 有规模的直接同业；公开合同透明度弱于 Arcadia 或伊利诺伊州图表提供商
      - - Clearway Community Solar
        - 有传统能源平台母公司背书的直接同业
        - 四个州历史客户近 15000；母公司能源平台覆盖 28 个州
        - 居民、企业、学校、医院和市政机构
        - 本地太阳能农场，加客户登记和账单抵免管理
        - 引用页面显示保证节省、无前期成本、无取消费
        - 简单性强，但公开差异化主张主要是便利性，而不是清晰护城河
      - - Arcadia
        - 相邻平台竞争者
        - 管理规模 2 GW+；订户 223000+；15 个州
        - 需要低摩擦登记和订户服务的家庭、企业和开发商
        - 侧重订户获取、账单集成和管理，而不是纯资产栈
        - 节省 5% 到 20%；无带费用的长期锁定；强调单账单或集成计费
        - 相较 Nexamp 的全一体化模式，Arcadia 是分发和软件驱动最强的替代方案
      - - Dimension Energy
        - 直接同业
        - $650M 融资；当前组合 132 MW；已执行 1000+ MW；开发中 3.5 GW；35000+ 客户
        - 多州社区太阳能和储能市场中的社区与订户
        - 开发、持有、运营社区太阳能和储能，并强调社区参与
        - 主打即时账单节省，但公开零售合同条款不如 Arcadia 或伊利诺伊州图表标准化
        - 运营上接近 Nexamp，公开政策 / 社区叙事强于零售打包细节
      - - Pivot Energy
        - 直接或相邻进入者
        - 太阳能开发足迹合计 4 GW；500 MWac Microsoft 框架；40 个项目、144 MW 社区太阳能组合
        - 通过社区规模组合触达社区、企业和订户
        - 社区规模太阳能加储能，并带企业合作伙伴渠道
        - 公开零售打包不如开发商 / 合作伙伴证明透明
        - 合作伙伴和资本获取能力强，但面向消费者的公开定价相对不透明
      - - Solar Landscape
        - 通过商业屋顶切入的直接进入者
        - $600M 债务额度；146 MW 社区太阳能组合；已部署 350+ 个项目、630 MWdc
        - 通过商业屋顶项目和社区合作伙伴服务居民
        - 来自商业地产屋顶的分布式发电和社区太阳能
        - 保证节省；无前期成本；伊利诺伊州图表显示节省 20%、5 年期、无费用、合并计费
        - 差异化来自屋顶场址控制，而不是传统绿地订户获客模式
      - - 屋顶 / 内部自建太阳能
        - 替代品
        - 无单一供应商规模信号；经济性取决于客户屋顶、公用事业费率和融资
        - 拥有合适屋顶且愿意投入资本开支的业主或企业
        - 现场面板、BIPV 或其他内部发电
        - 上行潜力更高，但仍有前期成本、并网和持续公用事业费用
        - 所有权重要时有吸引力；当简单性和无资本开支接入最重要时较弱
      - - 默认公用事业服务 / 公用事业主导选项
        - 既有现状选项
        - 法定服务关系和既有账单触达
        - 优先考虑最简单计费路径、且不想做切换工作的买方
        - 标准零售供电和公用事业公司管理的项目
        - 熟悉的一张账单，且无需管理社区太阳能合同
        - 摩擦最低，但缺少专门的本地太阳能折扣叙事
    notes: 公开画像行混合了公司直接披露、非营利对比图表和独立行业报道；定价单元格在公开条款因项目或公用事业辖区而有实质差异时，按州呈现。
