  - id: FU001
    title: Nexamp 客户旅程图
    type: journey-map
    layout: wide
    summary: 公开客户触点始于低门槛的共享太阳能发现，经过合作伙伴辅助准入、上线后的账单抵扣，最后进入倡导或推荐循环。
    data:
      items:
        - actor: 家庭租户或屋主
          touchpoints:
            - 邮编搜索或社区太阳能说明
            - 无需屋顶 / 无前期费用营销
            - Trustpilot 或口碑评价核查
          emotion: 想省钱，但不想折腾屋顶
          painpoint: Utility jargon and project waitlists are hard to parse
          opportunity: The accessibility message expands the reachable market
          label: 发现
        - actor: LMI 家庭或社区合作伙伴
          touchpoints:
            - 可负担住房或社区组织触达
            - Give-A-Ray 或 Maryland 资格规则
            - 注册支持和信任建立
          emotion: 有兴趣，但警惕隐藏成本
          painpoint: Enrollment friction and trust barriers
          opportunity: Partner-led outreach and subsidized models reduce friction
          label: 准入
        - actor: 可持续发展经理或 CFO
          touchpoints:
            - For Business 页面
            - 锚定租户账单示例
            - Walmart、Microsoft、Chipotle 或 Albany Med 证据
          emotion: 需要节省，也需要 ESG 证据
          painpoint: Contract and billing mechanics are less intuitive than onsite solar
          opportunity: Anchor subscriptions support projects without onsite deployment
          label: 评估
        - actor: 已上线订户或机构
          touchpoints:
            - 公用事业账单抵扣
            - Nexamp 发票
            - 季节性结转和支持互动
          emotion: 看得到节省，但会盯紧入账时点
          painpoint: Two-bill timing and support quality shape trust
          opportunity: Clearer billing education can improve retention
          label: 在线服务
        - actor: 推荐客户或合作伙伴组织
          touchpoints:
            - 推荐语或案例研究
            - 关联方或员工注册
            - 社区触达或同伴推荐
          emotion: 节省看得见时愿意背书
          painpoint: Long-term impact is still hard to quantify publicly
          opportunity: Albany Med and community-partner loops hint at repeat expansion
          label: 扩张 / 倡导
    claimRefs:
      - CU001
      - CU003
      - CU006
      - CU024
      - CU033
      - CU036
      - CU040
      - CU042
  - id: FU002
    title: Nexamp 采用与部署流程
    type: flow
    layout: wide
    summary: Nexamp 的公开采用引擎把订户兴趣和锚定承诺连接到项目承保、上线抵扣、服务运营和推荐驱动扩张。
    data:
      nodes:
        - id: household-interest
          label: 家庭或小企业需求
