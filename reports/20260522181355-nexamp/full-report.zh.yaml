      - number: '8.2'
        title: 可比信号既显示财务资方胃口，也显示严峻下行风险
        blocks:
          - type: paragraph
            body: >-
              可比公司集合并不支持给 Nexamp 套一个整齐倍数。它展示的是一条很宽的估值走廊，两端由商业模式质量、资本结构和披露深度决定。建设性一端，TPG 2025 年同意以约 $2.2 billion（含债务）收购
              Altus Power，说明规模化分布式太阳能资产在买方能够尽调运营资产组合时，仍能拿到控制权价值定价。Clearway 约 $9.35 billion
              市值说明，具备耐久披露和现金流可见性的合同电力平台，仍能获得公开股权资金。负面一端，Sunnova 破产、Fitch 下调至 D、以及 $27.67 million
              市值显示，当融资和政策条件转向时，高杠杆太阳能平台股权会多快坍塌。SolarBank
              的小市值估值也说明，公开市场通常只给规模较小或验证不足的开发商保留有限股权价值。私人融资集合位于两端之间。Dimension、Pivot、Summit Ridge 和 Solar Landscape 在
              2025-2026
              年都完成了九位数授信，确认资本仍想配置分布式和社区太阳能敞口。但这些交易大多是债务、建设或仓储设施，不是干净的股权估值锚。信号很清楚：私人资本窗口仍开着，但更容易奖励具体资产和已获资金支持的管线，而不是公布透明企业价值。
