        blocks:
          - type: paragraph
            body: >-
              在这种离散度下，纯公开资料的正确产出不是精确估值，而是一套承销纪律。基准结论是，Nexamp 应高于陷入困境的公开太阳能残值股，因为它仍在融资，也似乎仍处在美国全国已超过 10 GW
              的社区太阳能市场里；同时它也应低于最强的平台型参照，因为公司披露明显少于 Altus 或完整披露的合同电力发行人。这一逻辑支持宽泛的企业价值区间，而不是每股股权价值。悲观情景把 Nexamp
              视为一个不透明、受政策影响的项目整合平台；其优先股和债务层吸收了大部分上行。基准情景假设私人尽调确认资产级现金收益率稳定、优先级可控，但披露仍不足以支撑完整平台溢价。乐观情景要求经审计证据证明，Nexamp
              能把资本通道转化为持续现金生成，而且资本结构足够干净，新投资者可以分享上行。今天这些证据点并不公开，所以建议仍是「继续研究」，不是「买入」。这个区间的用途是限制支付价格上限，而不是证明某个隐藏价格已经公允。
