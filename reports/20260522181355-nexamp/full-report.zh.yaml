      - number: '3.4'
        title: 护城河耐久性、商品化风险与反向信号
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，Nexamp 的护城河真实存在，但有上限。场地获取、订阅用户管理、合作伙伴分销和融资关系都是可防守优势，但如今没有一项独一无二。Summit Ridge、Dimension、Pivot 和
              Solar Landscape 都证明近期能拿到九位数资本。Arcadia 证明，获客、计费集成和开发商服务可以脱离直接资产所有权独立扩张。Solar Landscape
              说明，商业屋顶控制可以成为差异化项目发起渠道。不过，最重要的负面证据不是某个竞争者以低价压过 Nexamp，而是整个品类仍依赖公用事业并网、账单抵扣管理和州项目设计。Nexamp 2026 年 1 月向 New
              York PSC 提交的文件描述了 14 个项目合计 $3.615 million 的争议，以及一张比初始保证金高 52% 的发票。Solar Power World 关于 Maine
              的报道显示，州政策追溯调整可冻结新开发，不论开发商质量如何。这意味着，社区太阳能的持久护城河只部分来自公司自身，也取决于一家公司是否有运营纪律、本地关系和资产负债表耐心，能比其他玩家更好地扛过政策和公用事业冲击。
