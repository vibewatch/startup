        title: 耐久度、满意度与留存可见性
        blocks:
          - type: paragraph
            body: >-
              耐久度证据偏正面，但并不完整。公开可见、最接近留存证明的是 Albany Medical Center 超过五年的合作；Nexamp
              称节省仍在累积，甚至带动该医疗系统内其他医院采用社区太阳能。Trustpilot 2026 年 3 月快照也显示家庭层面满意度较广：693 条评论、4.4/5
              评分，许多摘录称赞注册简单、解释清楚、确有节省。但这些正面信号旁边，有一个持续摩擦主题：公开评论和第三方解读反复提到双账单模式、公用事业抵扣与 Nexamp
              账单的时间差，以及客服偶尔响应较慢带来的困惑。官方页面解释了为什么该模式会显得不直观：节省按年度呈现，抵扣额
              可能季节性滚存，企业客户还可能有合并账单等不同安排。仍然缺的是硬留存数据：无论家庭订户还是锚定客户，都未找到公开 NRR、GRR、流失、续约或队列披露。
