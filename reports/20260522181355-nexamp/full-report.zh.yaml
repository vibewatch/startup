      - number: '4.5'
        title: 反向敞口、公开缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              Nexamp 当前记录中的主要财务反向信号不是订阅用户不满，而是项目成本不确定性。Nexamp 在 2025 年 8 月向 New York PSC 提交的申诉中称，National Grid 就 14
              个项目要求追加 $3,615,637 并网成本，比此前金额高 52%，并警告 29 个开发项目预计还会收到约 $9.2 million 追加发票，另外 12 个项目还有估计 $10 million
              不确定敞口。PSC 通知重述了 Nexamp 的指控：National Grid
              未能善意提供成本估算，也未能证明提高后的调账发票合理。对于一家正在社区太阳能扩张的公司，这类意外成本通胀即使在刚获得融资时，也会侵蚀项目回报并收紧流动性。

              更广泛的政策风险会放大问题。CBRE 2026 年市场更新提示近期税收抵免建设截止日期、Illinois ABP 项目容量耗尽，以及 Maryland 从 NEM 1.0 转向补偿更低的 NEM 2.0。Wood
              Mackenzie 仍将该市场描述为竞争激烈但走向成熟，累计装机已超过 10 GWdc，但 2025 年装机比 2024 年下降 25%。因此结论是混合的：Nexamp
              看起来融资足以继续建设，但公开证据仍不足以支撑收入质量、利润率耐久性或现金跑道。财务投资逻辑只有拿到私有收入、利润率、契约和现金数据后才可投资。
