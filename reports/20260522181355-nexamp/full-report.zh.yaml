      - number: '1.4'
        title: 里程碑、反向信号与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              公司概况尽调不能只看增长里程碑。抓取材料中最强的负面信号不是生死级运营失败，而是围绕部署经济性和披露边界的摩擦在增加。2025 年 8 月，Nexamp 及 14 家关联方向 New York Public
              Service Commission 提起申诉，争议 14 个项目中 National Grid 追加的 $3.615 million 并网费用；申诉称公用事业公司错过规定时间线，并依赖过时成本估算。RTO
              Insider 独立将该事项描述为针对不公平成本上涨和并网流程违规的投诉。消费者侧，BBB
              显示过去三年有一件已解决的账单投诉，数量太小，不能称为广泛服务崩盘，但足以作为轻微反向数据点保留。比上述两个问题更重要的是公开记录仍没有显示什么：当前收入或 ARR、2024 和 2025
              年融资后的当前估值、全公司员工数，以及完整董事会或股权结构表图景。这些披露缺口应被明示，而不是用过时私募市场估算粉饰。
