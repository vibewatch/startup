      - number: '4.2'
        title: GTM 动线与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Nexamp 的公开 GTM 证据主要是行业结构证据，而不是公司披露的销售数据。最佳数字代理来自 2026 年 Wood Mackenzie 和 Coalition for Community Solar
              Access 展望：2025 年订阅用户获客成本平均为 $70 per kWdc，低中收入订阅用户升至 $100 per kWdc。这一点重要，因为 Nexamp
              深耕社区太阳能；项目建成后，订阅用户获取、注册处理、计费支持和留存仍是真实成本中心。同一展望称，获客成本同比下降 12%，并应随着市场整合和合并计费扩张继续下降。

              Nexamp 自己的 2026 年计费更新在这一背景下很重要。把打折后的 Nexamp 收费直接放到公用事业账单上，相比旧双账单模式，应减少客户困惑和回款摩擦。尽管如此，公开来源仍没有给出 Nexamp 自身实际
              CAC、回本周期、流失或续约数据。最强规模代理是 Walmart 合作：31 个项目、超过 120 MWDC、约 8,000 名居民客户，以及五个州每年超过 $2 million 的客户节省。Wood
              Mackenzie 还称 Nexamp 拿下 2025 年社区太阳能装机的 18%，这支持公司是规模化订阅用户管理者和开发商的判断，但不能证明其 GTM 动线能按单客高效变现。
