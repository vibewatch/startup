  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 能不能定价先看资本通道，但最终卡在股权层
        blocks:
          - type: paragraph
            body: >-
              Nexamp 公开记录显示融资动能强、股权透明度弱。过去两年，公司披露了 $520 million 公司层融资、面向运营组合的 $340 million 再融资、$350 million Macquarie
              建设授信以及单独的 Nomura 开发资本，还在 2026 年提交了规模略低于 $180 million 的优先股 Form D。这一模式重要，因为它说明贷款方和私募资本仍把 Nexamp
              当成可融资的平台，而不是搁浅的项目开发商。但这并不能解决新投资者的核心估值问题。同一公开记录仍缺少几个决定性变量：新的股权支票究竟买到有吸引力的上行，还是只是给一套层层叠加的资本结构补钱，而普通股回报被压在其下。没有公开
              GAAP 收入，没有披露 EBITDA 或现金余额，没有发布债务契约包，也没有面向新优先股的公开清算瀑布。基于公开记录的投资结论因此是不对称的。Nexamp
              可以可信地宣称自己具备平台地位，因为机构资金持续进场；但公司还不能套用接近公开市场的估值标准，因为衡量普通股层下行和上行所需的数据仍是私有的。
