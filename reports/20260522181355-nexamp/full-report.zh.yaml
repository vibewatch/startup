      - number: '4.3'
        title: 成本结构与资本强度
        blocks:
          - type: paragraph
            body: >-
              Nexamp 的公开证据指向一个由项目建设、订阅用户获客、计费管理和持续资产运营主导的成本结构，而不是纯软件毛利率。DOE 的 PV benchmark
              框架是底层建设经济性最接近的公开类比，因为它评估商业和公用事业级系统，将隔夜资本开支拆成八类，并分析系统生命周期内的 O&M。Berkeley Lab 的 Tracking the Sun
              数据集提供更宽的分布式太阳能背景，包括安装价格和融资，不过它只覆盖最高 5 MW-AC 的项目；更大项目必须按公用事业级处理。换句话说，公开基准可以框定 Nexamp 的成本包络，但无法揭示其已实现项目回报。

              客户侧只是稍微清楚一些。NREL 的订阅用户价值研究显示，大多数社区太阳能订阅用户按净现值口径省钱，这解释了为什么 Nexamp 可以在不要求预付款的情况下推广 10%-15%
              折扣。但同样的公开来源也凸显了该模式为何资本密集：获客不是免费的，LMI 获客更贵，储能在历史社区太阳能基数中占比仍有限。Nexamp
              自己的指南称，公司从建设到运营管理项目，进一步说明公司在完整生命周期中承担开发和运营复杂性，即便公开记录从未披露项目级 EBITDA、毛利率或资产级 IRR。
