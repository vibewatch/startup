companyProfile:
  summary: >-
    Nexamp 是一家成长期美国社区太阳能平台，开发、融资、建设、持有并运营分布式太阳能资产，同时管理订阅用户关系和账单抵扣项目。公开证据显示：公司创立于 2007 年，总部在 Boston，并在 Chicago 设第二总部；截至
    2024 年融资前后，公司拥有近 80,000 名客户、超过 1.5 GW 已发电及在建容量，并继续获得大额资本和锚定客户合作。
