  - id: TV005
    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发项
      - 阈值
      - 如何传导到投资逻辑
      - 行动含义
    rows:
      - - 股权结构表优先级差于暗示
        - 大额清算优先权、ratchet 条款，或新股权之上的优先索取权
        - 即便经营表现扎实，也会压缩普通股上行
        - 重新定价至悲观区间，或直接放弃
      - - 组合经济性未通过尽调
        - DSCR 疲弱、资产现金收益低，或流失率和回款损失偏高
        - 把平台叙事打回项目滚动整合风险
        - 将建议维持在继续研究，或下调至回避
      - - 政策和并网恶化
        - 市场再收缩一段、排队成本显著上升，或核心州订户经济性下降
        - 推高折现率，降低退出信心
        - 下移估值区间，收紧回报门槛
      - - 融资质量恶化
        - 出现救助资本、重组措辞或契约压力
        - 让 Nexamp 更像困境太阳能同业，而不是 sponsor 支持的平台
        - 视为投资逻辑破裂，直到重新承销资产负债表风险
      - - 退出路径关闭
        - 没有 sponsor 兴趣、没有基础设施买家出价，也没有可信 IPO 路径
        - 移除区间高端溢价，使持有假设不现实
        - 只按带下行保护的结构承销，否则退出
    notes: 这些是明确否决标准，不是泛泛风险。每一项都会改变投资的实际优先级，或削弱赚取目标回报所需退出路径的可信度。
    claimRefs:
      - CV038
      - CV040
      - CV041
      - CV042
      - CV045
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构表和清算瀑布
        - 2024 至 2026 年完整证券堆叠，包括清算优先权和转换机制
        - 没有它，公开 EV 区间无法换算为股权价值或 MOIC
        - CFO 材料包，加上律师审查最终融资文件
      - - 资产现金生成
        - 按主要州和项目批次拆分的组合层面收入、EBITDA、DSCR 和项目现金收益桥
        - 决定 Nexamp 值得平台溢价，还是只能按项目定价
        - 财务尽调，使用资产层面经营模型和贷款人报告包
      - - 订户质量
        - 按州和客户队列拆分的流失率、回款损失、账单争议率和已实现节省
        - 把增长叙事转化为耐久单位经济性，或直接证伪
        - 商业尽调，使用客户运营仪表盘导出和队列留存文件
      - - 政策和排队暴露
        - 逐州 MW 分配、排队位置、准备金假设和并网成本暴露
        - 决定折现率、COD 时点和下行触发项
        - 开发与监管尽调，使用管线进度表和准备金备忘录
      - - 退出准备度
        - 当前 sponsor 接触、董事会退出计划、报告包成熟度和先例交流
        - 检验承销的退出路径是真实存在，还是只是一厢情愿
        - CEO 和董事会材料，加上银行家背景访谈
    notes: 每项尽调要求都为了把本章从仅基于公开资料的筛选判断，推进成可投资的承销文件。如果管理层拿不出这些材料，投资建议不应上调。
    claimRefs:
      - CV040
      - CV041
      - CV043
      - CV044
      - CV045
