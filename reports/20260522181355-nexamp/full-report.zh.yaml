      - number: '1.3'
        title: 资本形成、规模与合作伙伴信号
        blocks:
          - type: paragraph
            body: >-
              Nexamp 自 2023 年以来的公开融资与规模轨迹证据充分。官方和独立来源一致显示，公司先在 2023 年 5 月为六个州的 49 个太阳能与储能项目获得超过 $400 million
              税收权益和债务融资，随后在 2023 年 8 月下达 1.5 GW Heliene 组件订单，2024 年 1 月在 Chicago 开设第二全国总部并计划在 Illinois 投资超过 $2
              billion，随后在 2024 年完成由 Manulife 领投的 $520 million 公司层面融资。在 2024 年融资前后，Nexamp 称其服务近 80,000 名客户，并拥有超过 1.5 GW
              已发电和在建容量。后续披露把故事进一步推高：Walmart 和 Microsoft 合作说明社区太阳能包销需求仍在；pv magazine 报道称，到 2028 年公司将走向近 3 GW、约 $3.9
              billion 的路径；Macquarie 又为公用事业级扩张提供 $350 million 长期融资工具。因此，即便当前估值和收入仍不透明，公司看起来仍具融资能力和商业相关性。
