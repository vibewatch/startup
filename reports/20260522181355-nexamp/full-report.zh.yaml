    layout: wide
    summary: 推荐链条从可见的融资能力出发，经过可比公司估值离散和披露缺口，落到继续研究的结论。
    data:
      nodes:
        - id: capital-access
          label: 资本获取能力可见
          detail: Nexamp 披露了 2024 年公司层融资，以及 2025-2026 年债务、授信和优先股事件
        - id: market-context
          label: 社区太阳能仍然重要
          detail: 该行业已跨过 10 GW，但增长放慢，且仍对政策敏感
        - id: comp-dispersion
          label: 可比估值区间极宽
          detail: 参照样本从困境太阳能残余标的，到数十亿美元规模的签约电力和私有化结果不等
        - id: disclosure-gap
          label: 股权侧关键输入仍未公开
          detail: 收入、EBITDA、现金、契约条款和清算瀑布细节仍未披露
        - id: range-not-mark
          label: 公开结论只能给区间，不能给定价
          detail: 本章只能支撑 EV 区间和入场纪律
        - id: entry-discipline
          label: 入场价格比公司质量叙事更重要
          detail: 无视优先级或政策风险而支付高价，会毁掉上行空间
        - id: recommendation
          label: 继续研究
          detail: 只有私有尽调补齐现金流和股权结构表缺口后，才上调判断
      edges:
        - from: capital-access
          to: market-context
          label: 融资证明标的仍有投资意义
        - from: market-context
          to: comp-dispersion
          label: 市场仍可投，但不均衡
        - from: comp-dispersion
          to: disclosure-gap
          label: 离散度抬高举证门槛
        - from: disclosure-gap
          to: range-not-mark
          label: 缺失数据挡住精确判断
        - from: range-not-mark
          to: entry-discipline
          label: 用区间做护栏
        - from: entry-discipline
          to: recommendation
          label: 价格和尽调决定结论
    approximationNotes: 这是决策流，不是按时间刻度展开的运营模型。它突出驱动推荐结论的分析依赖。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV010
      - CV022
      - CV036
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 0-10 序数敏感性评分，显示哪些证据缺口或市场力量最能影响 Nexamp 可支撑的入场估值。
    data:
      items:
        - label: 经审计收入与利润率披露
          value: 9
        - label: 股权结构表与优先权清晰度
          value: 9
        - label: 政策与并网稳定性
          value: 8
        - label: 公开可比公司的困境信号
          value: 8
        - label: 发起人资本可得性
          value: 6
        - label: 私有退出准备度
          value: 7
    approximationNotes: 数值是定性敏感性评分，不是百分比变化或估值点估计。分数越高，该因素越能撬动 Nexamp 可支撑估值区间。
    claimRefs:
      - CV013
      - CV018
      - CV027
      - CV035
      - CV040
      - CV045
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 悲观、基准和乐观承销情景下的低、中、高企业价值区间。这些区间用于限制入场价格，而不是预测当前隐藏估值。
    data:
      items:
        - label: 悲观承销区间
          low: 900
          mid: 1050
          high: 1200
          unit: USD M
          detail: 项目平台属性处理不透明，并带有重大政策和优先级折价
        - label: 基准承销区间
          low: 1200
          mid: 1400
          high: 1600
          unit: USD M
          detail: 稳定的资产现金生成已由私有资料证明，但披露仍不足以支撑全额溢价
        - label: 乐观承销区间
          low: 1800
          mid: 2000
          high: 2200
          unit: USD M
          detail: 类似 Altus 的发起人胃口，加上清晰股权结构表和经审计的现金生成证据
    approximationNotes: 这些企业价值区间来自公开可比公司和融资参照。由于债务和优先股堆叠没有足够公开细节，区间没有扣除精确的债务和优先层。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 基于公开证据质量，而非管理层访问，压缩呈现投资案例评分。
    approximationNotes: 评分是综合本章证据得出的 0-10 定性判断，并非正式评分算法计算结果。
    data:
      items:
        - label: 资本获取能力
          value: 8
          unit: /10
          detail: 2024-2026 年反复完成九位数融资和授信
          claimRefs:
            - CV003
            - CV004
            - CV005
            - CV006
        - label: 披露质量
          value: 2
          unit: /10
          detail: 收入、EBITDA、现金、契约条款和股权结构表细节仍属私有信息
          claimRefs:
            - CV008
            - CV009
        - label: 市场顺风
          value: 6
          unit: /10
          detail: 社区太阳能市场仍大，但已不再呈现一路上行的增长曲线
          claimRefs:
            - CV010
            - CV011
            - CV012
        - label: 下行不对称
          value: 3
          unit: /10
          detail: 同业困境和政策敏感性让下行保护仍不可少
          claimRefs:
            - CV017
            - CV018
            - CV038
        - label: 估值支撑
          value: 5
          unit: /10
          detail: 区间站得住，清晰定价站不住
          claimRefs:
            - CV030
            - CV031
            - CV039
        - label: 退出准备度
          value: 4
          unit: /10
          detail: 私有退出可行，但管理层尚未公开展示足以支持退出的报告深度
          claimRefs:
            - CV041
            - CV045
    claimRefs:
