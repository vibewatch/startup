      - number: '5.5'
        title: 信任、合规与产品技术风险
        blocks:
          - type: paragraph
            body: >-
              Nexamp 的信任姿态在公司解释流程的地方最强，在外部人需要鉴证的地方最弱。Privacy Policy 和 Terms of Use
              明确说明，公司可能收集敏感身份、计费和公用事业账户数据；在授权后可访问公用事业账单和用量信息；并依赖数字通信、门户偏好和 Autopay 运行部分客户体验。这足以说明 Nexamp
              理解其产品控制面，但不足以证明外部鉴证成熟，因为抓取到的公开材料不包含 SOC 报告、ISO 认证、渗透测试摘要、公开事件响应承诺或外部 API/安全文档。


              New York 并网争议强化了运营风险判断。NYSEIA 的支持文件显示，Nexamp
              的产品体验仍在多大程度上依赖公司无法直接控制的公用事业成本估算、时间安排和计费行为。对第五章尽调而言，结论因此是混合的：Nexamp
              看起来拥有真实的多产品运营平台，内部软件和现场执行能力也有意义；但公开证据仍留下安全保证、计费质量指标，以及 One Bill、自行施工和开发者工具等新能力在规模化后有多可重复的问题。
