        - id: support
          label: 账单与支持层
          detail: 季节性结转、发票时间和客服共同决定实际体验。
        - id: expansion
          label: 转介绍与后续扩张
          detail: 标杆客户、联盟伙伴和社区合作方把新用户带入后续队列。
      edges:
