      - number: '5.3'
        title: 运营架构与内部技术信号
        blocks:
          - type: paragraph
            body: >-
              Nexamp 没有公开开发者门户或详细外部技术架构，但职位招聘、计费运营岗位和合作伙伴材料合起来，仍暴露出有意义的运营架构。开发者信号来源指向 React 和 TypeScript 前端、基于 Django 和
              FastAPI 的 Python 服务、SQL 支撑的数据工作、CI/CD，以及 Azure 上的 Terraform。计费运营岗位又补上一层，明确提到 API callouts、通知系统、仪表盘，以及
              Zuora、NetSuite、Workato、Tray.io、Genesys、Twilio 和 Pardot 等第三方平台。


              由此浮现的公开图景是一个内部运营平台，把客户流程与财务和项目流程接在一起。计费偏好在客户门户中管理，启用 One Bill 时可访问公用事业数据，Developer Accelerator Program
              则向合作伙伴开放共享定价计算器、追踪器和数据室。这让 Nexamp 看起来像一家工作流繁重、具备真实内部软件深度的清洁能源运营商。不过，公开证据仍不完整：没有公开 API 文档、没有 One Bill
              发布日志，也没有公开技术 SLA 或 uptime 披露，外部投资人无法像评估传统 SaaS 公司那样评估软件可靠性。
