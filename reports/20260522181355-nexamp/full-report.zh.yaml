      - number: '2.4'
        title: 增长驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              市场仍在扩张，但闸门越来越偏运营和监管，而不是概念。2026 年证据指向需求侧驱动：可负担性政治、LMI 预留、NCSP+
              下技术援助增加、订阅用户获客成本下降，以及围绕社区太阳能的州级规则制定仍在继续。与此同时，公开记录清楚显示，项目交付受并网和计费约束。DOE 称，并网成本和时间的不确定性是社区太阳能部署最持久的障碍之一；FERC
              称截至 2022 年底，全国排队中有超过 10,000 项请求、代表超过 2,000 GW，大多数研究仍然延误。Order No. 2023 方向上利好，但它是流程修补，不保证 Nexamp
              实际区域的公用事业执行会更快。2026 年政策报道还显示，市场正在进入重设计阶段，补偿费率、灵活并网、合并计费和可负担性目标正在逐州重调。长期耐久性因此更好，但简单 TAM
              故事更难讲。联邦政策又增加一层不确定性：EPA 监察长称 Solar for All 已于 2025 年 8 月终止，意味着开发商不能假设联邦补助会继续抵消获客或 LMI
              经济性。剩余尽调缺口不是市场是否存在，而是 Nexamp 能否在所选州把政策启用的需求转化为特定公用事业辖区内、并网障碍已清除、计费可落地且获客成本有吸引力的项目。
