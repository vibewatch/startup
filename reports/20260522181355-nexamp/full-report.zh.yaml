  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 参考指标
      - 估值或状态
      - 对 Nexamp 的参考意义
      - 局限
    rows:
      - - Altus Power
        - 控股私有化交易
        - 约 USD 2200M（含债务）
        - 近期最好的证据：规模化分布式太阳能资产能完成数十亿美元级 sponsor 交易
        - 披露质量优于 Nexamp 当前公开记录，资产组合也不同
      - - Clearway Energy
        - 公开股权参考
        - 约 USD 9350M 市值（2026 年 5 月）
        - 显示有稳定公开报告的签约电力平台可获得溢价
        - Yieldco 组合和报告深度都超过 Nexamp 当前披露集
      - - Sunnova Energy
        - 困境公开股权参考
        - 约 USD 27.67M 市值，并在 2025 年进入 Chapter 11 程序
        - 强烈提醒：融资压力下，太阳能平台股权可能崩塌
        - 住宅太阳能融资模型不同于社区太阳能开发
      - - SolarBank
        - 小市值开发商参考
        - 约 USD 33.58M 市值（2026 年 5 月）
        - 为规模较小的太阳能开发平台提供公开市场低端基准
        - 规模小得多，与 Nexamp 融资足迹的可比性更弱
      - - Dimension Energy
        - 私人项目融资参考
        - USD 650M 融资，覆盖 25 个社区太阳能项目、132 MW
        - 确认贷款人对大型社区太阳能组合有胃口
        - 融资规模不是股权估值，且资产特定
      - - Pivot 与 Summit Ridge
        - 私人融资参考
        - Pivot 多贷款人融资包 USD 225M，Summit Ridge MUFG 融资工具 USD 290M
        - 显示贷款人持续支持分布式和社区太阳能平台
        - 融资工具规模不能直接换算成企业价值
      - - Solar Landscape
        - 分布式发电债务仓储参考
        - USD 600M 优先债务融资工具，包括 USD 350M 仓储和 USD 250M 定期贷款
        - 说明债务市场愿意支持规模化分布式发电运营商
        - 屋顶商业地产模型不同于 Nexamp 的社区太阳能组合
    notes: 这个可比集合有意混合公开股权估值、sponsor 私有化和私人融资工具，因为没有一个干净的公开同业篮子能完美映射 Nexamp。阅读这些行时，应把它们当作承销纪律的边界标记，而不是一一对应的估值倍数。
    enumerationScope:
