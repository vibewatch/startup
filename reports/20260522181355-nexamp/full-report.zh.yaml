      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >-
              Nexamp 的公开领导层图景在高管层面最清晰，在具体治理层面最薄弱。领导层页面列出 Zaid Ashai 为董事长兼 CEO，Will Thompson 为联合创始人兼资产管理服务高级副总裁，运营班底还包括法务
              Kamran Idrees、财务 Peter Tawczynski、开发 Chris Clark、基础设施部署 Chris Perron、资本市场 Kyle Gietzen，以及政策与市场 Kelly
              Friend。创始人故事页面补充历史背景：Dan Leary 在车库里做早期太阳能项目后，Leary 和 Thompson 于 2007 年 2 月把业务转为全职。所有权披露更薄，但仍有意义。Mitsubishi
              称其 2016 年首次投资，并在 2018 年通过 Diamond Generating 使 Nexamp
              成为其子公司。这给出一个合理的控制权锚点，但抓取到的材料没有披露当前董事会名单、经济所有权拆分或任何少数股东保护条款。因此，治理尽调应聚焦正式董事会构成、投资人权利和 2024
              年后控制权经济，而不是高管角色是否明确。
