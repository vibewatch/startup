      - number: '5.4'
        title: 能力成熟度、扩张路径与差异化
        blocks:
          - type: paragraph
            body: >-
              公开成熟度画像不均衡，但方向上强。社区太阳能及相关客户服务运营显然足够成熟，可以支撑州级零售产品、门户计费和公用事业抵扣流程。储能不再只是愿景：Nexamp 披露，到 2023 年底已有 22 个项目、100
              MWh 投运，另有超过 5 GWh 在开发或建设中，同时也描述了整合多个逆变器供应商、储能系统和控制方案所需的调试纪律。公用事业级业务更新，但到 2025 年已拥有专门建设和开发资本，以及 6 GW 管线说法。


              最有辨识度的运营信号是并网工作的自行施工。官方和独立来源都称，Nexamp 通过自行承担公用事业相邻的采购和施工任务完成三个试点项目，目标是在满足安全要求的同时削减时间和成本。叠加 Developer
              Accelerator 工具集和 Heliene 组件采购，这说明 Nexamp
              的差异化是运营杠杆：协调供应商、合作伙伴、公用事业公司、资本和客户管理的能力。公开路线图证据在扩张方向上可信，但在附加率、模块级采用，以及这些新能力能否在试点以外变成可重复系统优势方面，要薄得多。
