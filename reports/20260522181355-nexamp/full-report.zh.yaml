  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与用户任务
        blocks:
          - type: paragraph
            body: >-
              Nexamp 的产品不是单一应用或单一融资包装。公开可见的产品范围涵盖消费者社区太阳能订阅、商业购电协议、土地所有者托管、独立业主服务支持、储能、太阳能开发，以及面向第三方开发商的 Developer
              Accelerator Program。这些产品最强共同线索是垂直整合：Nexamp 把自己呈现为能够融资、设计、建设、持有、运营，并随后管理客户或合作伙伴关系的一方，而不是在狭窄项目里程碑处交接责任。


              这一点对尽调重要，因为公司的差异化看起来更多来自运营广度，而不是面向消费者的软件 SKU。业务菜单和 Solar Development
              页面都描述了一个平台，把资产收购、清洁能源部署、资产管理、客户获取和公用事业协调接在一起。Developer Accelerator Program
              通过向外部开发商提供融资、定价工具、追踪器和共享数据室，把同一运营模式向外延伸。换句话说，Nexamp 公开可见的产品架构是一个嵌入软件的服务与资产栈，而不是单独销售的软件。
