  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与政策风险
        blocks:
          - type: paragraph
            body: >-
              Nexamp
              的公开法律与监管暴露面格外重要，因为公司处在社区太阳能项目里，经济性不只由双边合同决定，也部分取决于监管方、公用事业公司和账单规则。公司自己发布的隐私和账单条款显示，它处理大量客户、财务和公用事业账户数据；One
              Bill 机制还依赖自动扣款、无纸化账单和公用事业账户凭据。更尖锐的风险是并网成本能否锁定。Nexamp 在 2025 年 8 月经核实向 New York PSC 提交的申诉称，National Grid 要求
              14 个已完工项目追加 $3,615,637，较此前金额增加 52%，并警告 41 个其他项目还可能收到更多对账发票。NYSEIA 和 NY-BEST 的第三方意见没有把这场争议当成孤立麻烦，而是视为更广泛的
              SIR 成本确定性失灵证据。New York 之外，Massachusetts、Maryland 和 Illinois 在 2025-2026
              年仍在更新费率、激励、账单或分配规则。这组因素让法律和监管漂移成为当下的投资承销风险，而不是假设性风险。
