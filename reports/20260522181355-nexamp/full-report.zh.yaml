      - number: '7.2'
        title: 运营、账单与客户服务风险
        blocks:
          - type: paragraph
            body: >-
              Nexamp 的公开记录显示，运营风险不只在太阳能资产建设，也在把项目接到订户的数据、账单和支持层。公司条款本身说明，客户体验高度依赖凭据访问无误、公用事业账单及时抓取、自动扣款成功，以及 Nexamp
              与公用事业公司之间干净交接。因此账单摩擦不只是外观问题。BBB 的投诉量、Trustpilot 2026 年 3 月好坏参半但总体正面的快照，以及 Nexamp 自己对 One Bill
              的限制说明，共同指向一个真实模式：许多客户确实省钱并喜欢服务，但仍有相当一部分遇到账单、催收或支持痛点。并网时点又增加了一条运营风险通道。Illinois 项目页面显示候补名单压力和开发商额度上限，Canary
              则报道 Ameren 一次只研究一个项目，威胁到项目保住联邦税收抵免资格。换句话说，Nexamp 的运营风险来自公用事业公司、订户账单和排队管理之间的流程依赖，而不是某个工厂或产品缺陷。
