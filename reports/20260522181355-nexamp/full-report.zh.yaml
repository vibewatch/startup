        title: 证据展项
        blocks:
          - type: callout
            title: 社区太阳能解决真实准入问题
            body: 最强结构性需求信号不是抽象碳需求，而是屋顶太阳能在物理和经济上的排除。DOE 和 Berkeley Lab 都显示，为什么租户、多户住宅家庭和低收入客户在社区太阳能中占比更高。
