      - number: '2.3'
        title: 买方细分、预算负责人和采用路径
        blocks:
          - type: paragraph
            body: >-
              Nexamp
              的买方地图比“居民订阅用户”更宽。公开州项目页面显示，核心社区太阳能市场如今包括租户、房主、多户住宅、小企业、学校、非营利组织、公共实体，某些情况下还包括更大的锚定租户。买方、用户和付款方往往不同。家庭订阅里，电力账户持有人事实上三者合一。可负担住房里，业主或物业管理方、居民和补贴管理员都可能影响资格或经济性。市政或非营利用例里，设施团队可能用电，而财务办公室或治理机构掌握预算决策。DOE
              项目设计材料把本地企业、学校和非营利组织等锚定租户视为重要角色，因为它们可降低融资和获客成本；但材料也警告，过大的锚定租户会挤出小订阅用户。各州案例显示，市场设计会影响买方转化。New York
              明确把社区太阳能定位给房主、租户、企业和多户住宅。Massachusetts 强调租户和屋顶不可行的住宅，年节省 5% 至 20%。Illinois Solar for All
              加入收入筛选和严格费用上限，Maryland 则加入消费者保护和明确 LMI 分配规则。Nexamp
              自身材料确认，产品通过双账单流程销售，节省兑现会滞后，因此采用不仅取决于总节省比例，还取决于客户耐心、项目并网发电时间线和项目披露是否清楚。
