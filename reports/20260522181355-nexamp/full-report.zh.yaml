      - number: '2.2'
        title: 规模测算视角与可触达范围
        blocks:
          - type: paragraph
            body: >-
              证据支持多重规模测算视角，而不是单一英雄式 TAM。DOE 市场追踪器显示，2024 年 6 月美国运营中社区太阳能为 7.87 GW；引用 Wood Mackenzie 或 CCSA 的 2026
              年公开摘要则显示，2025 年底装机容量为 10.1 GW。这两组数字都指向真实市场，但在核对 AC/DC 和截止口径前不应混合使用。第二个视角是政策可用性：NREL 2024 年政策回顾发现，只有 24
              个州或地方辖区（含 District of Columbia）有赋能政策，只有 20 个有低收入条款。因此，Nexamp 的近期 SAM 是政策启用地区，而不是全国电力市场。第三个视角是结构性准入需求。DOE
              引用 NREL 分析称，近半数家庭和企业无法安装屋顶太阳能。Census 数据进一步放大这一准入缺口：美国有 148.3 million 套住房，业主自住房占比
              65.2%，意味着庞大租户人群仍依赖异地方案。第四个视角是公平准入基础设施：DOE 称，在合格项目结构中接受 HUD 援助的居民可以加入社区太阳能，而不失去公用事业补贴支持，约 4.5 million
              户可负担住房家庭因此进入视野。合在一起，这些视角解释了 Nexamp 的市场为什么有意义但并不顺滑：政策闸门、单位归一和计费机制比泛泛的全国电力需求更关键。
