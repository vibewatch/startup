        - id: assignment
          label: 农场分配
          detail: 容量可用后，Nexamp 分配合适的太阳能份额
        - id: crediting
          label: 公用事业账单抵扣
          detail: 公用事业公司计入负值行项目或其他因地区而异的抵扣标签
        - id: nexamp-invoice
          label: Nexamp 发票
          detail: 订户支付所生成抵扣的折扣后价值
        - id: autopay
