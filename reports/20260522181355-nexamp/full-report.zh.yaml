  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 方案 / 模式
      - 声称节省或价值
      - 合同期限
      - 取消 / 抵免政策
      - 计费模式 / 客户摩擦
      - 竞争含义
    rows:
      - - Nexamp（伊利诺伊州公开对比 + 帮助中心）
        - 节省 15%；社区太阳能账单抵免在分配到电站并经过短暂计费滞后后开始
        - 引用的伊利诺伊州图表为 15 年
        - 引用的伊利诺伊州图表显示提前 90 天通知即可免费取消
        - 通常为双账单；引用的伊利诺伊州图表显示无纸化账单和自动扣款为可选
        - 零售条款扎实，但不明显跳出同业方案的商品化区间
      - - Summit Ridge
        - 每月稳定节省；官方 FAQ 称伊利诺伊州客户合计每年节省约 $1.5M
        - 已抓取资料中，不同市场尚未公开标准化
        - 订阅用户搬家需提前一个月通知
        - 公用事业账单抵扣叠加聚合方协调
        - 退出灵活有帮助，但公开费率细节有限，难以逐项对比定价
      - - Clearway
        - 保底节省；EnergySage 称公司官网宣传可节省 20%
        - 因市场和合同而异
        - 限时无取消费；EnergySage 摘要列出软性信用检查
        - 既有公用事业关系不变；项目主打便利、无需屋顶
        - 简单性卖点强，但具体节省机制取决于州和项目
      - - Arcadia
        - 引用的评测和图表显示可节省 5% 至 20%
        - 引用的 Illinois LMI 图表显示最长 15 年；EnergySage 评测采用随时可取消表述
        - 无费用；引用的 Illinois 图表显示需提前 90 天通知；EnergySage 显示无需信用检查
        - 强调单一账单或整合账单，降低社区太阳能的传统摩擦
        - 同业中公开摩擦降低叙事最强
      - - Solar Landscape
        - 保底折扣；引用的 Illinois 图表为 20%
