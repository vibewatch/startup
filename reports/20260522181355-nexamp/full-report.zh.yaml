    type: flow
    layout: wide
    summary: 公开订户工作流从注册和公用事业数据收集开始，进入账单抵扣、Nexamp 账单，并处理搬家或 One Bill 变更等例外。
    approximationNotes: 该流程面向流程，不按时间比例绘制；它合并了公开消费者材料、帮助中心材料和法律材料。
