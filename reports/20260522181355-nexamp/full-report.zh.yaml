  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接、相邻、替代与现状格局
        blocks:
          - type: paragraph
            body: >-
              Nexamp 的竞争集合按类别理解最容易，而不是寻找唯一一对一对手。最近的直接同行是其他社区太阳能开发商和运营商，它们控制项目发起、融资、资产执行，以及至少一部分订阅用户管理。公开证据将 Summit
              Ridge、Clearway、Dimension、Pivot 和 Solar Landscape 放在这个圈层，尽管各自依赖不同渠道或场地策略。Arcadia
              重要，但更像相邻平台，而不是镜像开发商：其公开卖点是全国订阅用户管理、面向开发商的交钥匙服务，以及为客户降摩擦，而不是自有土地或屋顶控制。买方也会拿 Nexamp
              与替代方案和现状比较，而不只是同行。对于有合适屋顶和资本的客户，屋顶或自建太阳能能给出更高的所有权上行空间；默认公用事业服务仍是最容易路径，因为它保留熟悉的一张账单，也避免合同切换。因此，竞争问题不只是还有谁销售社区太阳能，而是谁能以最低摩擦和最持久本地执行赢下同一个客户任务。
