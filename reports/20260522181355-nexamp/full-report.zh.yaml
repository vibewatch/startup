        title: 扩张飞轮、集中度与渠道风险
        blocks:
          - type: paragraph
            body: >-
              扩张似乎不只靠品牌需求本身，同样取决于渠道设计和政策结构。Nexamp 的社区参与页面显示，社区组织可以作为有偿获客伙伴；Give-A-Ray 依赖 ComEd 识别并招募合格客户；Maryland
              项目则依靠订户组织和州规则决定谁能加入、以什么条件加入。这种伙伴介导结构可以是优势，因为它打开了单靠直接数字营销未必触达的 LMI 与机构渠道。它也让 Nexamp
              依赖公用事业公司、监管方和可信的本地中介。抓取到的公开资料包显示，Nexamp 可以用锚定交易承销更广泛的社区参与，但没有量化头部客户在收入或 MW 中的占比。同样，相比 Albany
              Med、Walmart、Microsoft、Chipotle 和 LMI 项目的证据，具名市政和学校客户证明仍偏薄。因此在尽调中，客户故事在覆盖广度和参照质量上可信，但对集中度和可复制性的披露仍不足。
