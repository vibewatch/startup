  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 对 Nexamp 的意义
    rows:
      - - 家庭社区太阳能订阅
        - 面向住宅公用事业账户的场外项目开发、订户获取、账单抵扣管理和经常性订阅服务
        - 表后屋顶设备购买，以及单纯切换零售供电商
        - 家庭公用事业账户持有人
        - 主要需求池；这里无预付的节省，比拥有面板更重要
      - - 可负担住房与 LMI 专项
        - 面向符合收入资格或接受 HUD 援助家庭、由州或联邦支持的订阅
        - 未处理公用事业补贴额度的泛化屋顶太阳能可负担性说法
        - 居民、物业经理或住房运营方，取决于项目设计
        - 受政策支持的细分市场，消费者保护和节省规则更强
      - - 小企业或农村商业订户
        - 面向企业公用事业账户的共享太阳能账单抵扣，或相邻分布式能源融资
        - 不含共享太阳能成分的完整现场商业 EPC 或市场化 PPA
        - 企业主、CFO 或设施负责人
        - 非住宅扩张路径；预算回本而非碳品牌推动采用
      - - 市政、学校、非营利和社区锚定客户
        - 锚定租户订阅或社区持有结构，用来稳定项目并降低 CAC
        - 脱离本地账单抵扣项目的公用事业规模采购
        - 设施部门、公共预算负责人或非营利财务负责人
        - 重要，因为锚定需求能提高本地辖区里的项目可融资性
      - - 社区规模分布式太阳能邻近市场
        - 并入配电网的项目，带有订阅或共享收益结构，可能包括更大锚定客户
        - 脱离本地账单抵扣逻辑的市场化公用事业规模发电和非捆绑企业采购
