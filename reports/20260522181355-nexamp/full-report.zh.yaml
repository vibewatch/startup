      - number: '5.2'
        title: 客户流程、计费轨道与服务运营
        blocks:
          - type: paragraph
            body: >-
              最清楚的公开流程是社区太阳能订阅旅程。Nexamp
              的消费者页面称，家庭注册、提供公用事业账户信息、等待分配到某个太阳能农场，然后开始在公用事业关系一侧收到账单抵扣。公司把这一产品定位为简单，因为没有屋顶面板或前期成本；但实际运营流程更复杂：公用事业抵扣单向入账，订阅费用通过
              Nexamp 支付，如果用户注册无纸化账单、Autopay 或 One Bill，客户体验又会变化。


              Nexamp 的帮助中心和法律材料让服务层更具体。客户通过门户管理计费偏好，Autopay 只在账户清零后开始；如档案中有电子邮箱，无纸化账单会在第一张发票后成为默认。One Bill
              更进一步，要求提供公用事业凭证，并授权 Nexamp 代表客户获取公用事业账单并促成付款。这是有意义的运营便利，但也意味着产品依赖公用事业时间、客户凭证准确性，以及客户搬家、关闭 Autopay
              或某周期未收到发票时的异常处理。
