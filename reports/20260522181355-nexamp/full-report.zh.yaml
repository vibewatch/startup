      - 公开可衡量收益
      - 运营限制
    rows:
      - - 无需屋顶面板即可加入社区太阳能
        - 检查资格，提交基本信息和公用事业账户信息，等待电站分配
        - Nexamp 将用户匹配到附近太阳能电站，并按预期用量确定订阅规模
        - 引用的 Virginia 流程宣传年节省 15%
        - 只有名额开放后收益才开始，服务取决于公用事业辖区
      - - 接收并理解月度抵扣
        - 公用事业公司入账账单抵扣，并可能因服务区不同使用不同标签
        - Nexamp 在帮助文档中解释抵扣额度展示方式和折扣结构
        - 抵扣额度可降低或超过每月公用事业费用，并结转到后续账期
        - 不同公用事业公司的呈现方式不一；缺少指引时，客户容易困惑
      - - 自动向 Nexamp 支付月账单
        - 用户登录 community.nexamp.com，在余额为零后开通，随后收到发票和扣款通知
        - 自动付款在发票生成 25 天后扣收全额发票金额
        - 去掉手动付款截止日，把付款管理集中到一处
        - 存在逾期余额时，自动付款不会启动；它仍是独立于公用事业公司账单的另一项依赖
      - - 用 One Bill 替代分拆账单
        - 客户启用无纸化账单和自动付款，分享公用事业账户凭证，并收到合并账单通知
        - Nexamp 通过 One Bill 获取公用事业账单，并协助支付公用事业费用
        - 可能降低账单管理摩擦，并整合付款轨道
        - 如果 One Bill 停用或失败，客户必须恢复直接向公用事业公司付款
      - - 转移或取消订阅
        - 客户联系支持团队，提供新地址或搬出时间
        - Nexamp 在符合条件时转移账户，否则协调取消
        - 新住所符合条件时，可保持续用
        - 公用事业公司提交窗口和 90 天通知期限制变更生效速度
      - - 将 DG 项目接入 Developer Accelerator
        - 开发商达成基准里程碑，签署 PFA 和项目购买文件，并在跟踪器和数据室共享材料
        - Nexamp 提供开发融资、价格透明度和共享运营资源
        - 合格合作伙伴能更早拿到资本，也更清楚费用
        - 项目只向获批开发商开放，公开使用指标缺失
    notes: 这些行把客户流程和合作伙伴流程放在一起，因为 Nexamp 公开产品入口同时面向订阅者和合作伙伴；公开资料对流程描述更强，对转化或质量指标更弱。
