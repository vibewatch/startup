      - number: '3.3'
        title: 定价、包装、分销能力与切换成本
        blocks:
          - type: paragraph
            body: >-
              公开包装比公开规模更快收敛。EnergySage 的供应商比较、CUB 的 Illinois 图表，以及多个运营商页面都指向一个品类：账单抵扣折扣通常在 10% 至 20%
              左右，取消费常常没有，通知期也常短到让社区太阳能切换成本有意义但不沉重。在这种背景下，客户体验细节权重格外高。Arcadia 的单账单和随时取消卖点、Solar Landscape 在 Illinois
              的合并计费方案、Summit Ridge 的搬家一个月终止条款，以及 Clearway
              的保证节省表述，都是在缩小社区太阳能与留在公用事业公司之间的心理和行政落差。对于有合适屋顶的客户，屋顶太阳能仍是上行更高的替代方案，但 SolarReviews 2026
              年公用事业指南解释了许多买方为何仍犹豫：公用事业费用仍在，回购规则可能令人失望，并网耗时，系统规模规则也限制设计。因此，Nexamp
              所处战场上，仅靠价格不够。更可能胜出的是能让注册、计费、公用事业协调和本地项目可得性比同行和现状都更可预测的公司。
