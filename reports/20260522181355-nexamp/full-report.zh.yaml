      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Nexamp 最清楚的财务证据不是经营表现，而是融资活动。2025 年 4 月，Nexamp 与 PGIM Private Capital 完成 $340 million 私募债务再融资，覆盖七个州的 39
              座太阳能农场，代表 150 MW 太阳能和 37 MWh 储能。已披露的 $107 million PPC shelf facility 尤其重要，因为它为未来三年的项目提供明确的后续资本渠道信号。2025
              年的其他披露又增加一层资本支持：Macquarie 宣布为 Nexamp 公用事业级扩张提供 $350 million 长期融资工具，Renewables Now 报道 Nomura
              也为早期项目提供未披露的开发资本。

              2026 年 Form D 是最新资产负债表信号。Nexamp 申报了一项最高 $179,997,174 的 Series 1E2 Preferred Stock 豁免发行，首次销售日期为 2026 年 2 月
              27 日。合在一起，公开资本栈显示，在约 14
              个月窗口内，公司同时使用项目债务、基础设施融资和优先股。这符合一家持有并开发大量太阳能资产、仍需要外部资本资助增长的企业。但公开记录没有显示账本另一面：当前不受限制现金、月度烧钱速度、债务契约、追索结构或承诺资本开支之后的真实流动性余量。
