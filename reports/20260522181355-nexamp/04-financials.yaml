callouts:
  - calloutType: strength
    title: Public capital access is real and recent
    body: >-
      Nexamp's 2025-2026 public record shows three distinct financing channels in active use: project debt
      refinancing with PGIM, infrastructure financing from Macquarie, and a 2026 preferred-equity Form D. That mix is
      consistent with a developer-owner that still has external financing support even though it does not publish
      operating financials.
    claimRefs:
      - CI029
      - CI031
      - CI033
      - CI036
      - CI037
      - CI040
  - calloutType: insight
    title: Billing consolidation could improve customer-economics execution
    body: >-
      The move from a legacy two-bill structure toward utility-bill-integrated charging is not just a customer-service
      change. It also aligns with Wood Mackenzie's view that consolidated billing can reduce subscriber-acquisition and
      servicing friction in community solar.
    claimRefs:
      - CI005
      - CI007
      - CI016
  - calloutType: risk
    title: Interconnection cost inflation is a live downside risk
    body: >-
      Nexamp's New York PSC complaint quantifies surprise interconnection costs already invoiced and additional exposure
      still expected across development projects. That kind of project-cost inflation can compress equity returns and
      absorb liquidity even while external financing remains available.
    claimRefs:
      - CI041
      - CI042
      - CI043
      - CI044
  - calloutType: risk
    title: Public sources do not support a full underwriting case
    body: >-
      The public domain is enough to prove Nexamp has scale, financing access, and a visible revenue mechanism. It is
      not enough to prove revenue quality, gross margin, covenant headroom, or runway. Any investment decision still
      requires private revenue, margin, debt, and treasury data.
    claimRefs:
      - CI038
      - CI039
      - CI040
      - CI050
