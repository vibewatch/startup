  - id: TI004
    title: Capital adequacy table
    columns:
      - Item
      - Value
      - Public status
      - Why it matters
      - Diligence ask
    rows:
      - - PGIM private-placement refinancing
        - $340M debt refinancing for 39 solar farms / 150 MW solar / 37 MWh storage
        - Publicly disclosed in multiple 2025 sources
        - Demonstrates active project-finance access and refinancing capacity
        - Provide debt schedule, interest cost, amortization, DSCR tests, and recourse terms
      - - PPC shelf facility
        - $107M additional facility
        - Publicly disclosed; covenant package undisclosed
        - Shows follow-on financing capacity but not true liquidity headroom
        - Provide shelf draw conditions, borrowing base, covenants, and remaining availability
      - - Macquarie utility-scale facility
        - $350M long-term financing
        - Publicly disclosed in 2025
        - Funds utility-scale capex and signals lender confidence in pipeline execution
        - Provide facility tenor, pricing, collateral, and project-level eligibility criteria
      - - 2026 preferred-equity offering
        - Up to $179,997,174 of Series 1E2 Preferred Stock
        - Public filing via SEC Form D / NASAA
        - Indicates fresh equity capital or recapitalization activity in 2026
        - Provide cap-table update, investor list, liquidation preferences, and use of proceeds
      - - Additional development capital
        - Nomura amount undisclosed
        - Reported publicly, amount not disclosed
        - Suggests another capital source for early-stage pipeline spend
        - Provide development-facility size, draw cadence, and market/geography allocation
      - - Adverse interconnection exposure
        - $3.616M invoiced; ~$9.2M expected on 29 projects; another ~$10M estimated on 12 more
        - Publicly alleged in 2025 complaint
        - Could compress project returns and absorb liquidity otherwise available for buildout
        - Provide project-by-project exposure table, reserve policy, and downside liquidity plan
      - - Cash on hand / monthly burn / runway
        - null
        - Not publicly disclosed
        - Core solvency and next-round timing cannot be underwritten without it
        - Provide current unrestricted cash, monthly burn bridge, covenant headroom, and 18-24 month runway model
    notes: >-
      Nexamp's capital access is much more visible than its liquidity position. Public sources show debt, infrastructure
