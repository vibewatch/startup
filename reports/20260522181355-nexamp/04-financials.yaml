figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: >-
      Nexamp's public residential monetization path runs from solar generation to utility bill credit to a discounted
      subscription charge that is now moving toward consolidated billing.
    data:
      nodes:
        - id: project-output
          label: Solar farm output
          detail: Community-solar project produces electricity and sends value into the utility system
        - id: utility-credit
          label: Utility values monthly bill credit
          detail: Credit amount varies with state rules, utility rates, and generation output
        - id: subscriber-bill
          label: Shared Solar Bill Credit appears on utility bill
          detail: Negative line item lowers what the customer owes the utility
        - id: subscription-fee
          label: Nexamp charges discounted SO Subscription Fee
          detail: Customer pays for credits at a discount rather than at full utility-bill value
        - id: billing-transition
          label: 2026 billing migration
          detail: Discounted Nexamp charges are moving from a separate invoice onto the utility bill
        - id: payment-rails
          label: ACH or card payment through portal
          detail: Customers can manage payment methods in Nexamp's billing portal
        - id: net-savings
          label: Customer keeps the discount spread as savings
          detail: Published savings bands are roughly 10% to 15% depending on program
        - id: nexamp-cash
          label: Nexamp cash collections
          detail: Cash receipts support project operations, servicing, and future capital needs
      edges:
        - from: project-output
          to: utility-credit
          label: Generation creates bill-credit value
        - from: utility-credit
          to: subscriber-bill
          label: Credit posts to utility statement
        - from: subscriber-bill
          to: subscription-fee
          label: Nexamp charges discounted value
        - from: subscription-fee
          to: billing-transition
          label: Invoice mechanics changing in 2026
        - from: billing-transition
          to: payment-rails
          label: Collections workflow
        - from: payment-rails
          to: nexamp-cash
          label: Customer remits payment
        - from: utility-credit
          to: net-savings
          label: Discount leaves savings with customer
        - from: subscription-fee
          to: net-savings
          label: Savings equal credit less discounted fee
    approximationNotes: >-
      This bridge is mechanistic rather than accounting-specific. Nexamp does not disclose the exact mapping from bill
      credits and subscription fees to GAAP revenue, deferred revenue, or cash conversion.
    claimRefs:
      - CI001
      - CI005
      - CI006
      - CI007
      - CI010
