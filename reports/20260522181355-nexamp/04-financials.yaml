  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Impact
      - Exact diligence path
    rows:
      - - GAAP revenue, ARR, and revenue-recognition policy
        - Prevents underwriting of true scale, mix, seasonality, and the relationship between customer discounts and recognized revenue
        - Request monthly GAAP revenue bridge, ARR definition, deferred-revenue roll-forward, and revenue-recognition memo by product line and state program
      - - Gross margin by asset class and customer cohort
        - Blocks analysis of whether discounted bill-credit pricing leaves attractive retained economics after construction, O&M, servicing, and financing costs
        - Request project-level gross margin, portfolio contribution margin, and margin bridge split by community solar, PPA, and utility-scale development
      - - Cash, burn, runway, and liquidity reserves
        - Prevents solvency analysis and next-round timing assessment despite visible external capital access
        - Request treasury report, 13-week cash forecast, monthly burn by function, and 24-month runway model under base and downside cases
      - - Debt covenants, recourse structure, and collateral package
        - Public debt amounts are visible, but downside risk cannot be assessed without covenant triggers and recourse information
        - Request executed facility agreements, borrowing-base definitions, cross-default provisions, and sponsor support arrangements
      - - CAC payback, churn, delinquency, and collection loss
        - The public pricing model is visible, but recurring revenue quality is not
        - Request cohort retention, renewals, delinquency rates, bad-debt expense, and CAC payback by acquisition channel and state program
      - - Project-level policy and interconnection sensitivity
        - Public sources show deadlines and disputes, but not how much of Nexamp's pipeline is exposed by state or utility
        - Request pipeline-by-state schedule, tax-credit safe-harbor status, interconnection milestones, and project IRR sensitivity to policy and cost delays
    notes: >-
      These are the minimum private-data requests needed to turn Nexamp's public financing story into an underwriteable
      financial model.
    claimRefs:
      - CI038
      - CI039
      - CI040
      - CI045
