tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Community-solar subscription charges
        - Utility applies bill credit; Nexamp charges the credited value at a contractual discount
        - Bill-credit value less discount
        - Core public model; no fixed kWh rate; state-specific discounts apply
        - Official pricing mechanism is clear, realized pricing is not
        - Provide subscriber contract forms, realized discount by cohort, collections loss, and revenue-recognition memo
      - - Business PPAs
        - Commercial users buy energy or sustainability output through power purchase agreements
        - Contracted PPA price / term
        - Publicly advertised on business site; pricing not disclosed
        - Revenue motion confirmed, economics undisclosed
        - Provide signed PPA templates, weighted-average tenor, escalators, and margin profile
      - - Hosting-a-farm / project-development economics
        - Nexamp develops and operates projects on customer land or rooftops and shares economics with hosts
        - Site-level project cash flow
        - Offered publicly; host payout economics not disclosed
        - Business line visible, revenue capture opaque
        - Provide host-payment formulas, land-lease terms, and retained developer economics
      - - Energy-storage paired projects
        - Solar-plus-storage projects contribute capacity and dispatch value alongside generation
        - Project-level storage cash flow
        - Publicly disclosed in financed portfolios; standalone revenue split not disclosed
        - Operational presence visible, revenue attribution unavailable
        - Provide storage revenue stack, merchant exposure, and contracted vs merchant mix
      - - Standalone services
        - Development, management, and other standalone clean-energy services offered to business customers
        - Service fee / contract
        - Advertised publicly; no pricing or mix disclosed
        - Existence confirmed, monetization not disclosed
        - Provide service catalog, average contract value, and share of total revenue
    notes: >-
      Nexamp publicly discloses revenue mechanisms and offered business lines, but not revenue mix, realized pricing,
      or segment margin. Rows distinguish visible monetization pathways from economics that remain private.
