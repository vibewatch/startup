  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue-quality
      missingEvidence: Monthly GAAP revenue, ARR definitions, deferred revenue, and segment revenue mix by community solar, PPA, and utility-scale development.
      whyItMatters: Public pricing mechanics do not reveal recognized revenue quality, seasonality, or the mix between recurring subscription cash flow and project-development revenue.
      diligencePath: Request board materials or monthly management reporting package with revenue bridge, contract mix, and revenue-recognition memo.
      relatedQuestionRefs:
        - QI020
        - QI025
    - type: private-evidence-only
      severity: blocking
      topic: liquidity-runway
      missingEvidence: Current unrestricted cash, restricted cash, monthly burn by function, and 18-24 month runway model under base and downside cases.
      whyItMatters: Nexamp clearly has financing access, but solvency and next-round timing cannot be underwritten without actual liquidity and burn data.
      diligencePath: Request treasury report, 13-week cash forecast, covenant-compliance report, and financing plan through at least year-end 2027.
      relatedQuestionRefs:
        - QI019
        - QI025
    - type: private-evidence-only
      severity: material
      topic: debt-structure
      missingEvidence: Executed debt agreements, covenant package, borrowing-base terms, recourse structure, and remaining availability under the PPC shelf facility and other project financings.
      whyItMatters: Public debt amounts alone do not reveal covenant headroom or how much downside risk could migrate back to the parent company.
      diligencePath: Request complete debt schedule plus executed facility documents, compliance certificates, and any sponsor-support agreements.
      relatedQuestionRefs:
        - QI021
        - QI025
    - type: missing-source
      severity: material
      topic: sales-efficiency
      missingEvidence: Nexamp-specific CAC, payback, churn, delinquency, bad debt, and renewal rates by channel and customer cohort.
      whyItMatters: Industry benchmarks prove community-solar acquisition is costly, but they do not show whether Nexamp's own recurring revenue compounds efficiently.
      diligencePath: Request cohort retention tables, customer acquisition cost by state and segment, and collections-aging reports.
      relatedQuestionRefs:
        - QI007
        - QI009
        - QI025
    - type: missing-source
      severity: material
      topic: project-sensitivity
      missingEvidence: State-by-state pipeline schedule, tax-credit safe-harbor status, interconnection milestone tracking, and project-level IRR sensitivity to cost overruns or compensation changes.
      whyItMatters: Public policy and complaint sources show real exposure, but not how much of Nexamp's pipeline is vulnerable in Illinois, Maryland, New York, or other key states.
      diligencePath: Request pipeline rollup with state, utility, COD, interconnection status, tax-credit position, and downside IRR sensitivity by project.
      relatedQuestionRefs:
        - QI022
        - QI023
        - QI025
