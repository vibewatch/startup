    - Developer or subscriber organization
    - Many end users
    - Large anchor plus smaller subscribers
    - Finance project around anchor then fill remaining subscriber slots
    - Improves bankability but can be limited by state rules to preserve broad access
  notes: Buyer, user, and payer are often different parties. That distinction matters because customer-acquisition cost, churn risk, and contract friction vary by segment.
