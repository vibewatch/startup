    - Resident utility account holder
    - Enroll in local project; receive utility bill credits; pay discounted subscription invoice
    - Cannot host rooftop solar but wants immediate bill relief
  - - Income-qualified or HUD-assisted households
    - Resident plus housing or assistance administrator
    - Resident
    - Resident with program oversight from housing operator or agency
    - Eligibility verification; protected utility-allowance treatment; savings disclosure
