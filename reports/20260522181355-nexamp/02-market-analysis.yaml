- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Affordability positioning and bill savings
    - Positive
    - Current
    - Community solar is increasingly framed as a consumer-cost tool rather than only climate infrastructure
    - Test whether Nexamp's actual utility-territory savings still clear consumer-acquisition hurdles
  - - LMI carve-outs and protected savings rules
    - Positive
    - Current to medium term
    - State rules can widen access and reduce subscriber value leakage in target segments
    - Map which Nexamp states require explicit savings floors or carve-outs
  - - NCSP+ technical assistance and ecosystem support
    - Positive
    - Current
    - Federal coordination still supports program design and partner knowledge even after grant uncertainty
    - Confirm whether Nexamp is benefiting from current state collaborative or technical-assistance channels
  - - Lower subscriber-acquisition cost trend
    - Positive
    - 2025-2030 outlook
    - Improves unit economics if developers can keep conversion high
    - Request Nexamp CAC by state, segment, and waitlist age
  - - Interconnection queue delays
    - Negative
    - Current
    - Project energization and revenue start are slowed even when customer demand exists
    - Normalize Nexamp project delays by utility and feeder before underwriting timelines
  - - Billing and crediting complexity
    - Negative
    - Current
    - Two-bill workflows and delayed credits can suppress conversion, satisfaction, or realized savings
    - Measure churn and complaint rates by state billing regime
  - - Federal-policy volatility around Solar for All and tax-credit timing
    - Negative
    - Current to medium term
    - Public subsidy assumptions are less bankable than they looked in 2024
    - Model downside cases with no Solar for All support and slower safe-harbor execution
  - - State rule redesign around compensation, flexible interconnection, and affordability
    - Mixed
    - 2026 onward
    - Creates upside where rules improve but forces constant commercial adaptation
    - Maintain a state-by-state rule tracker for Nexamp's active and target markets
  notes: This table mixes demand-side drivers with operational constraints because market size is only monetizable once policy, interconnection, and billing allow projects to clear.
