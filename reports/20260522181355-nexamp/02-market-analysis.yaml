tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Nexamp
  rows:
  - - Household community-solar subscriptions
    - Off-site project development, subscriber acquisition, billing-credit management, and recurring subscription servicing for residential utility accounts
    - Behind-the-meter rooftop equipment purchases and pure retail-supply switching
    - Household utility account holder
    - Primary demand pool where no-upfront savings matter more than panel ownership
  - - Affordable housing and LMI carve-outs
    - State or federally supported subscriptions for income-qualified or HUD-assisted households
    - Generic rooftop-solar affordability claims without utility-allowance treatment
    - Resident, property manager, or housing operator depending on program design
    - Policy-supported segment with stronger consumer-protection and savings rules
  - - Small-business or rural-commercial subscribers
    - Shared-solar bill credits or adjacent distributed-energy financing for business utility accounts
    - Full onsite commercial EPC or merchant PPAs with no shared-solar component
    - Business owner, CFO, or facilities lead
    - Relevant non-residential expansion path where budget payback, not carbon branding, drives adoption
  - - Municipal, school, nonprofit, and community anchors
    - Anchor-tenant subscriptions or community-owned structures that stabilize projects and lower CAC
    - Utility-scale procurement disconnected from local bill-credit programs
    - Facilities department, public budget owner, or nonprofit finance lead
    - Important because anchor demand can improve project bankability in local territories
  - - Community-scale distributed-solar adjacency
    - Distribution-connected projects with subscription or shared-benefit structures that may include larger anchors
    - Merchant utility-scale generation and unbundled corporate procurement outside local bill-credit logic
    - Developer plus anchor subscriber or local energy team
    - Useful adjacency as Nexamp broadens offerings, but should not be treated as the entire market
  notes: Included spend is limited to markets where off-site generation creates monetizable local bill credits or subscription value; generic solar generation spend remains outside scope.
