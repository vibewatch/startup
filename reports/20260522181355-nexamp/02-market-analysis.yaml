  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-size-normalization
    missingEvidence: A normalized current-market capacity series that reconciles DOE or NREL, Wood Mackenzie or CCSA, and any later public dataset pages onto the same AC or DC basis and as-of date.
    whyItMatters: Nexamp valuation and share-of-market work will overstate or understate SAM if public market-size figures are blended without unit normalization.
    diligencePath: Obtain the latest underlying project-level dataset or analyst workbook and restate every cited market-size figure onto one consistent unit basis before modeling penetration.
    relatedQuestionRefs:
    - QM009
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: public-sector-and-anchor-mix
    missingEvidence: Project-level disclosure of Nexamp's anchor-tenant mix, public-sector share, and subscriber concentration by state or utility territory.
    whyItMatters: Anchor concentration changes project finance, customer-acquisition cost, and churn risk, but the public pack does not show how much of Nexamp's pipeline depends on those segments.
    diligencePath: Request state-by-state subscriber mix, anchor concentration limits, and public-sector offtake examples from management or lender materials.
    relatedQuestionRefs:
    - QM017
    - QM018
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: blocking
    topic: nexamp-specific-sam
    missingEvidence: A current Nexamp disclosure showing active states, subscriber counts or pipeline by utility territory, and the share of projects already cleared for interconnection and billing.
    whyItMatters: Without utility-territory and pipeline-clearing data, public evidence cannot convert the broad enabled-state market into a credible Nexamp-specific SAM or SOM.
    diligencePath: Obtain utility-territory pipeline, waitlist, and energization data from Nexamp management or project-finance materials and size SAM from live or near-live territories only.
    relatedQuestionRefs:
    - QM026
    relatedTableRefs:
    - TM002
  - type: stale
    severity: minor
    topic: federal-support-stability
    missingEvidence: Post-litigation or post-rulemaking evidence on the lasting status of Solar for All and the practical effect of changing federal tax-credit timing on community-solar finance.
    whyItMatters: Federal support may not be the primary demand driver, but subsidy and tax-credit uncertainty still affects LMI economics, financing cost, and project timing.
    diligencePath: Refresh EPA, Treasury, and state implementation materials before using any federal support assumption in the investment case.
    relatedQuestionRefs:
    - QM024
