  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Core assumptions
      - Indicative EV range
      - Return logic
      - Probability signal
      - Key failure mode
    rows:
      - - Bear
        - Public-only diligence never clears the cap-table and cash-yield gaps, and policy headwinds keep community-solar discount rates elevated
        - USD 900M to 1200M
        - Entry only works as downside-protected project-platform exposure rather than pure growth equity
        - More market contraction, more surprise cost inflation, or rescue financing language
        - Preferred and debt seniority absorb most upside while exit multiple compresses
      - - Base
        - Private diligence confirms stable contracted cash generation and manageable seniority but not enough transparency for a full platform premium
        - USD 1200M to 1600M
        - Acceptable only if entry leaves room for a sponsor recap or infra-sale exit without heroic rerating
        - Clean portfolio performance pack, covenant headroom, and stable state-program mix
        - Cash yields disappoint or policy resets cut subscriber economics
      - - Bull
        - Nexamp proves audited cash generation, modest preference overhang, and sponsor appetite close to Altus-like control pricing
        - USD 1800M to 2200M
        - Upside depends on a clean private exit and evidence that Nexamp can scale like a premium distributed-solar platform
        - Management opens audited metrics, project returns, and exit-ready reporting
        - Hidden dilution or weak operating metrics collapse the case back toward the base or bear band
    notes: >-
      These are illustrative enterprise-value bands, not observed market marks or equity values per share. Equity value
      could be materially lower if liquidation preferences, debt, or other senior claims are larger than the public
      record currently implies.
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV040
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Reference metric
      - Valuation or status
      - Relevance to Nexamp
      - Limitation
    rows:
      - - Altus Power
        - Take-private control transaction
        - Approximately USD 2200M including debt
        - Best recent proof that scaled distributed-solar assets can clear a multibillion-dollar sponsor deal
        - Better disclosure and different asset mix than Nexamp's current public record
      - - Clearway Energy
        - Public equity reference
        - Approximately USD 9350M market cap in May 2026
        - Shows premium available to contracted-power platforms with steady public reporting
        - Yieldco mix and reporting depth exceed Nexamp's current disclosure set
      - - Sunnova Energy
        - Distressed public equity reference
        - Approximately USD 27.67M market cap and chapter 11 process in 2025
        - Hard downside reminder that solar-platform equity can implode under financing stress
        - Residential solar financing model is not identical to community-solar development
      - - SolarBank
        - Small-cap developer reference
        - Approximately USD 33.58M market cap in May 2026
        - Lower-end public market benchmark for a smaller solar developer platform
        - Much smaller scale and weaker comparability to Nexamp's financing footprint
      - - Dimension Energy
        - Private project financing reference
        - USD 650M financing for 132 MW across 25 community-solar projects
        - Confirms lender appetite for large community-solar portfolios
        - Financing size is not an equity valuation and is asset-specific
      - - Pivot and Summit Ridge
        - Private financing reference
        - USD 225M multi-lender Pivot package and USD 290M Summit Ridge MUFG facility
        - Shows repeat lender support for distributed and community-solar platforms
        - Facility size does not translate directly into enterprise value
      - - Solar Landscape
        - Distributed generation debt warehouse reference
        - USD 600M senior debt facility including USD 350M warehouse and USD 250M term loan
        - Demonstrates debt appetite for scaled distributed-generation operators
        - Rooftop commercial real-estate model differs from Nexamp's community-solar mix
    notes: >-
      The comparable set intentionally mixes public equity marks, a sponsor take-private, and private financing
      facilities because no clean public peer basket maps perfectly to Nexamp. Read the rows as boundary markers for
      underwriting discipline, not as one-for-one valuation multiples.
    enumerationScope:
      coverage: partial
      basis: >-
        This enumeration covers the main public and directly accessible 2025-2026 references most relevant to Nexamp's
        distributed and community-solar model, but it does not include private board marks, signed term sheets, or
        subscription-only databases that would sharpen an exact private-market multiple.
    claimRefs:
