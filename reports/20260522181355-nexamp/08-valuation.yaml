  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: capital-stack
      missingEvidence: Full cap table from 2024 through 2026 with liquidation preferences, conversion mechanics, ratchets, board rights, and any senior claim above new equity.
      whyItMatters: Without the true waterfall, the chapter can only estimate enterprise value and cannot convert the range into reliable common-equity upside or downside.
      diligencePath: Request definitive financing documents, capitalization tables, and a management walkthrough of all seniority provisions with counsel present.
      relatedQuestionRefs:
        - QV005
        - QV018
        - QV026
    - type: private-evidence-only
      severity: material
      topic: portfolio-economics
      missingEvidence: Audited 2025 revenue, EBITDA, unrestricted cash, DSCR, and asset-level cash-yield data by major state and project vintage.
      whyItMatters: Those metrics determine whether Nexamp deserves a platform premium or should instead be valued like a financed project roll-up with limited equity upside.
      diligencePath: Request audited financials, lender reporting packs, project-level performance dashboards, and board materials used to approve growth capital.
      relatedQuestionRefs:
        - QV020
        - QV026
        - QV027
    - type: enumeration-incomplete
      severity: minor
      topic: comparable-valuation
      missingEvidence: Private valuation marks, signed term sheets, or recent sponsor bids for community-solar platforms that are closer to Nexamp than the public-comp and financing set.
      whyItMatters: The current comparable table is good enough for boundary setting but not good enough to tighten the valuation band into a point estimate.
      diligencePath: Gather banker materials, signed or recent sponsor indications, and subscription database excerpts for private community-solar transactions.
      relatedQuestionRefs:
        - QV018
        - QV029
      relatedTableRefs:
        - TV004
    - type: missing-source
      severity: material
      topic: exit-readiness
      missingEvidence: Current sponsor outreach, board-approved exit pathways, reporting-package maturity, and evidence that likely acquirers can diligence Nexamp as a platform.
      whyItMatters: A premium entry price only works if the exit path is real, timely, and compatible with the company's disclosure profile and capital structure.
      diligencePath: Review board decks, banker conversations, sponsor feedback, and draft exit materials before underwriting any premium case.
      relatedQuestionRefs:
        - QV029
        - QV030
