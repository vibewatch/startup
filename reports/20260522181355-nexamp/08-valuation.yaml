schemaVersion: report-v2
artifact: valuation
slug: nexamp
runDate: '2026-05-22'
company:
  name: Nexamp
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports Nexamp as a scaled, well-financed community-solar platform but not as a tightly
    priceable equity story. The chapter finds wide valuation dispersion across comparable public and private solar
    references, repeated nine-figure capital access for Nexamp and peers, and a current evidence gap around Nexamp's
    revenue, margin, cash generation, and liquidation waterfall, leading to a research-more recommendation and only a
    low-confidence public underwriting range.
sections:
  - id: priceability-and-capital-stack
    title: Priceability starts with capital access, but stops at the equity layer
    body: >-
      Nexamp's public record is strong on financing momentum and weak on equity transparency. In the last two years the
      company has disclosed a $520 million corporate raise, a $340 million refinancing for an operating portfolio, a
      $350 million Macquarie construction facility plus separate Nomura development capital, and a 2026 preferred-stock
      Form D sized at just under $180 million. That pattern matters because it shows lenders and private capital
      providers still treating Nexamp as a financeable platform rather than a stranded project developer. It does not,
      however, solve the core valuation problem for a new investor. The same public record still omits the pieces that
      determine whether a fresh equity check buys attractive upside or just funds a layered capital stack above which
      common-equity returns are capped. There is no public GAAP revenue, no disclosed EBITDA or cash balance, no
      published debt-covenant package, and no public liquidation waterfall for the newer preferred equity. The
      investment conclusion from the public record is therefore asymmetric. Nexamp can plausibly claim platform status
      because institutional money keeps showing up, but the company cannot yet claim a public-market-like valuation
      standard because the data needed to size downside and upside at the common-equity layer remains private.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV046
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: comparable-signals-and-dispersion
    title: Comparable signals show both sponsor appetite and severe downside risk
    body: >-
      The comparable set does not support a single neat multiple for Nexamp. Instead, it shows a very wide valuation
      corridor whose endpoints are driven by business-model quality, capital structure, and disclosure depth. At the
      constructive end, TPG's 2025 agreement to buy Altus Power for about $2.2 billion including debt shows that scaled
      distributed-solar assets can still command control-value pricing when the buyer can diligence an operating fleet.
      Clearway's roughly $9.35 billion market cap shows public equity remains available for contracted power platforms
      with durable disclosure and cash-flow visibility. At the negative end, Sunnova's bankruptcy, Fitch downgrade to D,
      and $27.67 million market cap show how quickly leveraged solar-platform equity can collapse when financing and
      policy conditions turn. SolarBank's small-cap valuation underscores that public markets often reserve only modest
      equity value for smaller or less-proven developers. The private financing set sits in between those poles.
      Dimension, Pivot, Summit Ridge, and Solar Landscape all closed nine-figure facilities in 2025-2026, confirming
      that capital still wants distributed and community-solar exposure. But those transactions are mostly debt,
      construction, or warehouse facilities, not clean equity marks. The signal is clear. Private capital is open, but
      it is rewarding specific assets and funded pipelines more readily than it is publishing transparent enterprise
      values.
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
    tableRefs:
      - TV002
      - TV004
    figureRefs:
      - FV002
  - id: scenario-range-and-recommendation
    title: A range is possible, but only as a discipline tool rather than a price target
    body: >-
      Given that dispersion, the right public-only output is not a precise mark but an underwriting discipline. The
      base conclusion is that Nexamp deserves to trade above distressed public solar stubs because it is still raising
      capital and appears relevant to a community-solar market that has crossed 10 GW nationally. It also deserves to
      trade below the strongest platform references because the company is materially less transparent than Altus or a
      fully reported contracted-power issuer. That logic supports a wide enterprise-value band rather than an equity
      value per share. The bear case treats Nexamp as an opaque, policy-exposed project roll-up whose preferred and debt
      layers absorb much of the upside. The base case assumes private diligence confirms stable asset-level cash yields
      and manageable seniority but still not enough disclosure to justify a full platform premium. The bull case requires
      audited proof that Nexamp can convert capital access into durable cash generation and that the capital stack is
      clean enough for a new investor to share in that upside. Because those proof points are not public today, the
      recommendation is research-more, not buy. The range is useful as a ceiling on what to pay, not as evidence that a
      hidden price is already fair.
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
    tableRefs:
      - TV003
    figureRefs:
      - FV003
      - FV004
  - id: diligence-gates-and-thesis-breakers
    title: The final call depends on private diligence, not another press release
    body: >-
      The remaining work is straightforward in concept and decisive in effect. A clean upgrade from research-more to a
      conditional buy requires the company to prove what the public record cannot. First, the cap table has to be opened
      so an investor can see exactly where the 2024-2026 financings sit in the seniority stack and whether liquidation
      preferences or ratchets impair common-equity upside. Second, management must provide audited or at least board-grade
      portfolio cash-yield evidence, subscriber collections and churn data, covenant headroom, and a state-by-state view
      of project exposure to policy resets and interconnection reserves. Third, the exit path has to be described in a way
      that matches current market reality. Recent precedent suggests sponsor recapitalizations, infrastructure-fund sales,
      and structured continuation financing are more credible than a premium public-market exit. The thesis breaks if
      Nexamp starts to resemble stressed solar peers on financing quality or if policy and interconnection conditions push
      the community-solar market into another leg down before Nexamp produces clearer economics. Until private diligence
      closes those gaps, the right posture is downside-first engagement and willingness to walk away on price.
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
    tableRefs:
      - TV005
      - TV006
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Lens
      - Current verdict
      - Public support
      - Decision implication
      - What would change the view
    rows:
      - - Recommendation
        - Research-more
        - Capital access is real but equity priceability is not
        - Do not issue a buy on undisclosed valuation terms
        - Move to track or buy only after cap table and asset-level economics are opened
      - - Confidence
        - Medium
        - Direction of evidence is clear while precision is weak
        - Use scenario ceilings rather than a point target
        - Confidence rises with audited 2025 results and documented preference stack
      - - Risk rating
        - High
        - Policy sensitivity plus peer distress keep downside asymmetric
        - Require downside protection and hard diligence gates
        - Risk falls only if Nexamp proves stable cash yields and low covenant pressure
      - - Valuation stance
        - Unknown at undisclosed price and fair only near the low end
        - Public comps are too dispersed to justify a full platform premium today
        - Avoid paying sponsor-quality multiples off press releases alone
        - Stance improves if entry sits in the lower third of the range with clean seniority
      - - Preferred exit path
        - Sponsor recap or infrastructure sale before IPO
        - Recent sector precedent favors private-to-private outcomes
        - Underwrite to a private exit path, not a heroic public rerating
        - View changes if solar public comps recover and Nexamp discloses full reporting metrics
    notes: >-
      This table is a decision summary rather than a financial model. It translates the chapter's evidence into current
      posture, price discipline, and what additional diligence would be required to move the recommendation.
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV045
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence in favor
      - Counterpoint
      - What would change the view
    rows:
      - - Platform financing momentum
        - Nexamp has disclosed repeated nine-figure raises across equity, debt, and development capital
        - Financing momentum does not reveal equity dilution, cash conversion, or preference stack severity
        - Show full cap table, use of proceeds, and realized post-financing cash metrics
      - - Market relevance
        - Community solar is large enough to matter and still attracts institutional project finance
        - Sector growth has slowed and remains highly exposed to policy and interconnection friction
        - Show that Nexamp's state mix is concentrated in markets with stable economics and queue visibility
      - - Strategic-platform upside
        - Altus proves distributed solar can attract a multibillion-dollar sponsor take-private
        - Altus had cleaner public disclosure than Nexamp currently provides
        - Deliver audited asset-level cash generation and sponsor-ready reporting packages
      - - Distress downside is real
        - Sunnova shows solar-platform equity can collapse when leverage, liquidity, and policy turn negative
        - Residential solar distress is not identical to community-solar platform economics
        - Demonstrate lower leverage, stronger collections, and less exposed state policy mix than distressed peers
      - - Private capital is available
        - Dimension, Pivot, Summit Ridge, and Solar Landscape all closed large facilities in 2025-2026
        - Debt warehouse and construction facilities are not the same thing as a clean equity mark
        - Show equity demand, not just project-level debt appetite
      - - Current anti-thesis
        - Public evidence still fits a capital-intensive project roll-up with hidden seniority above common equity
        - Nexamp may in fact earn a premium if private diligence shows durable cash yields and a clean waterfall
        - Provide waterfall model, DSCR history, and state-by-state gross-margin bridge
    notes: >-
      The thesis and anti-thesis are deliberately price-sensitive. A higher-quality company can still be a poor investment
      if the investor pays through unresolved seniority and policy risk.
