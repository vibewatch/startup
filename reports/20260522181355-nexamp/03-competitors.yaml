- id: moat-durability-adverse-signals-and-gaps
  title: Moat Durability, Commoditization Risk, and Adverse Signals
  body: >-
    The public record suggests Nexamp's moat is real but capped. Site access, subscriber management,
    partner distribution, and financing relationships are defensible advantages, yet none is unique
    anymore. Summit Ridge, Dimension, Pivot, and Solar Landscape all demonstrate recent nine-figure
    capital access. Arcadia demonstrates that customer acquisition, billing integration, and developer
    services can scale independently from direct asset ownership. Solar Landscape shows that commercial
    rooftop control can become a differentiated origination channel. The most important negative evidence,
    however, is not a single competitor out-pricing Nexamp. It is that the whole category still relies on
    utility interconnection, bill-credit administration, and state program design. Nexamp's January 2026
    New York PSC filing describes a $3.615 million dispute across 14 projects and one invoice 52% above
    initial deposits. Solar Power World's Maine coverage shows that retroactive state policy changes can
    freeze new development regardless of developer quality. That means the durable moat in community solar
    is only partly company-specific. It also depends on whether a company has the operational discipline,
    local relationships, and balance-sheet patience to survive policy and utility shocks better than the
    rest of the field.
  claimRefs:
  - CP042
  - CP043
  - CP044
  - CP045
  - CP046
  - CP047
  - CP048
