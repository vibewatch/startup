  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitor-unit-economics
    missingEvidence: Public competitor customer-acquisition cost, churn, NRR, and contribution-margin data comparable to Nexamp's actual operating economics.
    whyItMatters: Public pricing convergence means retail discounts alone do not explain who wins; without unit-economics, diligence cannot tell whether Nexamp's integrated model converts better than Arcadia-style distribution or rooftop-channel entrants.
    diligencePath: Request cohort CAC, waitlist conversion, churn, default rates, and billing-dispute rates from management and benchmark them against peer investor or lender materials under NDA.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: competitor-territory-exposure
    missingEvidence: Utility-territory, subscriber-concentration, and energized-versus-waitlisted project exposure across the peer set, especially for Summit Ridge, Dimension, Pivot, and Solar Landscape.
    whyItMatters: The category's real moat cap is local utility and policy dependence, so state or utility concentration can make a seemingly scaled competitor far more fragile than headline GW figures imply.
    diligencePath: Collect utility-territory and energization-stage detail from company decks, permitting records, or lender materials and restate each peer's concentration by utility, state, and project stage.
    relatedQuestionRefs:
    - QP027
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: minor
    topic: state-specific-contract-terms
    missingEvidence: A current, multi-state side-by-side comparison of community-solar contract terms, billing models, credit checks, and cancellation rules across the major providers outside a few public Illinois or review sources.
    whyItMatters: Public retail comparisons are good enough to show pricing convergence and friction patterns, but they are not complete enough to underwrite every state-level customer experience or compliance burden.
    diligencePath: Pull current customer agreements or regulator-filed disclosures for each provider's largest active states and normalize billing, credit, and termination terms into one contract comparison workbook.
    relatedQuestionRefs:
    - QP028
    relatedTableRefs:
    - TP003
