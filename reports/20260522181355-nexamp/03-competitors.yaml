- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Main threat
  - Severity
  - Current public evidence
  - Mitigation / diligence ask
  rows:
  - - Integrated development plus subscriber operations
    - Multiple peers now pair capital, assets, and customer programs
    - high
    - Summit Ridge, Dimension, Pivot, and Solar Landscape all show recent scale or financing signals
    - Request Nexamp's current CAC, churn, and project energization speed versus each peer cohort
  - - Pricing discipline
    - Public retail discounts are clustering into a 10% to 20% band
    - high
    - EnergySage and CUB comparisons suggest limited public price differentiation across providers
    - Focus diligence on conversion, churn, and billing experience rather than headline discount alone
  - - Subscriber-management software and billing know-how
    - Arcadia can win on simpler digital enrollment and billing integration
    - high
    - Arcadia's public materials emphasize single-bill or integrated workflows and cancel-anytime terms
    - Test Nexamp's subscriber NPS, billing disputes, and waitlist conversion against Arcadia-like alternatives
  - - Site and channel access
    - Solar Landscape's commercial-rooftop network and Pivot's partner channels attack from different origination angles
    - medium
    - Solar Landscape cites 170+ real-estate owners; Pivot cites Microsoft and national corporate trust
    - Map Nexamp's own rooftop, landowner, and enterprise channel exclusivity by state
  - - Capital access
    - Capital is no longer scarce across the peer set
    - high
    - Summit Ridge, Dimension, Pivot, and Solar Landscape all disclosed nine-figure financings
    - Underwrite Nexamp on margin, queue speed, and channel quality rather than on financing access alone
  - - Policy and interconnection expertise
    - Regulators or utilities can still reset project economics after development work is underway
    - critical
    - NY PSC complaint and Maine's LD 1777 both show category-wide exposure to utility and policy shocks
    - Stress test Nexamp's portfolio by utility territory, interconnection stage, and retroactive-policy sensitivity
  notes: Severity is an analyst judgment based on current public evidence; it is meant to prioritize diligence, not to estimate exact financial downside.
