- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Offer / model
  - Stated savings or value
  - Contract term
  - Cancellation / credit policy
  - Billing model / customer friction
  - Competitive implication
  rows:
  - - Nexamp (Illinois public comparison + help center)
    - 15% savings; community-solar bill credits begin after farm assignment and a short billing lag
    - 15 years in the cited Illinois chart
    - No fee with 90 days' notice in the cited Illinois chart
    - Two bills are common; paperless billing and autopay are optional in the cited Illinois chart
    - Solid retail terms, but not obviously outside the commodity band of peer offers
  - - Summit Ridge
    - Consistent monthly savings; Illinois customers collectively save about $1.5M annually per official FAQ
    - Not publicly standardized across markets in the fetched pack
    - One month's notice if the subscriber moves
    - Utility bill credits plus aggregator coordination
    - Flexible exit helps, but limited public tariff detail makes apples-to-apples pricing harder
  - - Clearway
    - Guaranteed savings; EnergySage says the company site advertises 20% savings
    - Varies by market and contract
    - No cancellation fees for a limited time; soft credit check on EnergySage summary
    - Existing utility relationship stays in place; program markets convenience and no roof required
    - Strong simplicity message, though specific savings mechanics depend on state and project
  - - Arcadia
    - 5% to 20% savings in cited reviews and charts
    - Up to 15 years in the cited Illinois LMI chart; cancel-anytime framing in EnergySage review
    - No fee; 90-day notice on cited Illinois chart; no credit check on EnergySage
    - Single-bill or integrated billing emphasis reduces classic community-solar friction
    - Best public friction-reduction story among the peer set
  - - Solar Landscape
    - Guaranteed discount; 20% in the cited Illinois chart
    - 5 years with 2-year auto-renewal in the cited Illinois chart
    - No fee in the cited Illinois chart
    - Consolidated billing in the cited Illinois chart
    - Shorter term and consolidated billing create a sharp public retail offer in eligible territories
  - - Rooftop / internal-build solar
    - Potentially greater lifetime savings and ownership upside
    - Equipment life or loan term rather than subscription term
    - No subscription cancellation, but asset sale or financing unwind is harder
    - Upfront capex, interconnection, utility fees, and siting complexity remain
    - Higher upside for qualified buyers, much higher effort and commitment than community solar
  - - Default utility service
    - No explicit community-solar discount
    - None beyond the standing utility relationship
    - No switching contract
    - One familiar utility bill and no project waitlist or enrollment work
    - Lowest friction baseline that community-solar providers must beat on simplicity and trust
  notes: Public packaging terms are state- and project-specific; this table only uses terms explicitly visible in cited comparison pages and official FAQs rather than extrapolating nationally.
