  claims:
  - id: CP001
    statement: Nexamp's closest direct peers are other community-solar developers and operators that control project execution and compete for the same subscriber pool, including Summit Ridge, Clearway, Dimension, Pivot, and Solar Landscape.
    type: inferred
    topic: competitive-landscape
    sourceRefs:
    - SP001
    - SP024
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP001
    - QP002
  - id: CP002
    statement: Arcadia is better treated as an adjacent platform competitor than as a mirror-image developer because its public pitch centers on subscriber management, developer services, and billing integration rather than on owning the full asset stack.
    type: inferred
    topic: competitive-landscape
    sourceRefs:
    - SP011
    - SP012
    - SP013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP003
  - id: CP003
    statement: Rooftop or internal-build solar is a substitute rather than a direct peer because it depends on site suitability, interconnection, and upfront capital even when it can offer higher ownership upside.
    type: inferred
    topic: substitute-set
    sourceRefs:
    - SP027
    - SP028
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP004
  - id: CP004
    statement: Default utility service remains the strongest status-quo competitor because it preserves one familiar bill and avoids the contract switching or siting work required by community solar or rooftop alternatives.
    type: inferred
