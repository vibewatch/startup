company:
  name: Nexamp
chapter:
  number: 3
  title: Competitors
  summary: >-
    Nexamp competes in a crowded but structured field: direct asset-heavy peers such as Summit Ridge,
    Clearway, Dimension, Pivot, and Solar Landscape now all show meaningful scale or recent financing,
    while Arcadia attacks the category from the subscriber-management side rather than the asset base.
    Public customer packaging is converging around low-friction 10% to 20% bill-credit savings with low
    upfront commitment, so Nexamp's likely moat is less about price than about integrated execution,
    site access, and distribution depth. The strongest adverse evidence is that utility and policy
    dependence can still overwhelm company-level strengths, as shown by Nexamp's New York
    interconnection dispute and Maine's retroactive community-solar policy reset.
sections:
- id: landscape-and-category-boundaries
  title: Direct, Adjacent, Substitute, and Status-Quo Landscape
  body: >-
    Nexamp's competitive set is easiest to understand by class rather than by a single one-to-one rival.
    The nearest direct peers are other community-solar developers and operators that control project
    origination, financing, asset execution, and at least part of subscriber management. Public evidence
    places Summit Ridge, Clearway, Dimension, Pivot, and Solar Landscape in that orbit, even though each
    leans on a different channel or site strategy. Arcadia matters, but more as an adjacent platform than
    as a mirror-image developer: its public pitch is national subscriber management, turnkey services for
    developers, and friction reduction for customers rather than proprietary land or rooftop control.
    Buyers also compare Nexamp against substitutes and the status quo, not just against peers. Rooftop or
    internal-build solar can offer more ownership upside for customers with suitable roofs and capital,
    while default utility service remains the easiest path because it preserves one familiar bill and avoids
    contract switching. The competitive question is therefore not just who else sells community solar. It
    is who can win the same customer job with the lowest friction and the most durable local execution.
