callouts:
- calloutType: insight
  title: Public pricing is converging faster than public scale
  body: >-
    Across EnergySage, CUB, and operator pages, the visible retail promise is converging around low-friction
    10% to 20% savings with few upfront fees. That weakens price as a durable moat and pushes diligence toward
    conversion, billing accuracy, and local project availability.
  claimRefs:
  - CP035
  - CP039
  - CP040
- calloutType: strength
  title: Nexamp still compares best against pure platforms when asset control matters
  body: >-
    Arcadia is stronger on subscriber-management friction, but Dimension, Summit Ridge, and Solar Landscape are the
    closer tests of whether Nexamp's integrated development-and-operations model is still competitively distinct.
  claimRefs:
  - CP001
  - CP022
  - CP027
  - CP038
- calloutType: risk
  title: Utility and policy dependence remain the category's biggest moat cap
  body: >-
    Nexamp's New York PSC dispute and Maine's retroactive policy reset show that even a well-capitalized developer
    can lose economics to utility behavior or state redesign. Competitive durability therefore depends partly on who
    can survive policy shocks better, not only on who prices best.
  claimRefs:
  - CP042
  - CP043
  - CP044
  - CP048
