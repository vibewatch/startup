figures:
- id: FU001
  title: Nexamp customer journey map
  type: journey-map
  layout: wide
  summary: Public customer touchpoints move from inclusive shared-solar discovery through partner-assisted access, live bill-crediting, and then advocacy or referral loops.
  data:
    items:
    - actor: Household renter or homeowner
      touchpoints:
      - Zip-code search or community solar explainer
      - No-rooftop / no-upfront-cost marketing
      - Trustpilot or word-of-mouth review check
      emotion: Wants savings without rooftop hassle
      painpoint: Utility jargon and project waitlists are hard to parse
      opportunity: The accessibility message expands the reachable market
      label: Discovery
    - actor: LMI household or community partner
      touchpoints:
      - Affordable housing or community-organization outreach
      - Give-A-Ray or Maryland eligibility rules
      - Enrollment support and trust-building
      emotion: Interested but cautious about hidden costs
      painpoint: Enrollment friction and trust barriers
      opportunity: Partner-led outreach and subsidized models reduce friction
      label: Access
    - actor: Sustainability manager or CFO
      touchpoints:
      - For Business page
      - Anchor-tenant billing example
      - Walmart, Microsoft, Chipotle, or Albany Med proof
      emotion: Needs savings plus ESG proof
      painpoint: Contract and billing mechanics are less intuitive than onsite solar
      opportunity: Anchor subscriptions support projects without onsite deployment
      label: Evaluation
    - actor: Live subscriber or institution
      touchpoints:
      - Utility bill credits
      - Nexamp invoice
      - Seasonal rollover and support interactions
      emotion: Sees savings but scrutinizes timing
      painpoint: Two-bill timing and support quality shape trust
      opportunity: Clearer billing education can improve retention
      label: Live service
    - actor: Reference customer or partner organization
      touchpoints:
      - Testimonial or case study
      - Affiliate or staff enrollment
      - Community outreach or peer referral
      emotion: Will advocate when savings are tangible
      painpoint: Long-term impact is still hard to quantify publicly
      opportunity: Albany Med and community-partner loops hint at repeat expansion
      label: Expansion / advocacy
  claimRefs:
  - CU001
  - CU003
  - CU006
  - CU024
  - CU033
  - CU036
  - CU040
  - CU042
- id: FU002
  title: Nexamp adoption and deployment flow
  type: flow
  layout: wide
  summary: Nexamp's public adoption engine links subscriber interest and anchor commitments to project underwriting, go-live credits, service operations, and referral-driven expansion.
  data:
    nodes:
    - id: household-interest
      label: Household or small-business demand
      detail: Eligible customers hear a no-rooftop savings pitch directly or through a community partner.
    - id: anchor-demand
      label: Anchor or institutional buyer
      detail: Organizations evaluate discounted bill credits or REC-based procurement.
    - id: underwriting
      label: Project underwriting
      detail: Anchor commitments and subscriber demand help finance and justify a project portfolio.
    - id: construction
      label: Construction and interconnection
      detail: Projects enter buildout and wait for utility approvals before customers can be credited.
    - id: live-crediting
      label: Live bill credits
      detail: Customers begin seeing utility credits and then separate Nexamp invoices or consolidated billing.
    - id: support
      label: Billing and support layer
      detail: Seasonal rollover, invoice timing, and customer service shape the lived experience.
    - id: expansion
      label: Referral and repeat expansion
      detail: Reference customers, affiliates, and community partners bring new users into later cohorts.
    edges:
    - from: household-interest
      to: underwriting
      label: Subscription demand
    - from: anchor-demand
      to: underwriting
      label: Anchor commitment
    - from: underwriting
      to: construction
      label: Financing and permitting
    - from: construction
      to: live-crediting
      label: Farm reaches operation
    - from: live-crediting
      to: support
      label: Credits and invoices create service touchpoints
    - from: support
      to: expansion
      label: Good savings create advocacy
    - from: support
      to: household-interest
      label: Poor billing clarity slows new demand
  claimRefs:
  - CU008
  - CU011
  - CU016
  - CU024
  - CU033
  - CU035
  - CU037
  - CU041
  - CU042
