  enumerationScope:
    coverage: partial
    basis: Rows capture the strongest named customer proof found in the 2026 fetched public pack rather than an exhaustive customer roster across every Nexamp market.
  rows:
  - - Walmart-backed households
    - Corporate anchor plus downstream residential and local-business beneficiaries
    - 31 community-solar projects across five states
    - Rollout; first projects expected online mid-2025 into 2026
    - ~8,000 residential customers; >$2M annual savings
    - Portfolio-level disclosure only, not project-by-project operations
  - - Microsoft-supported households
    - Corporate REC buyer plus downstream community beneficiaries
    - ~100 projects across five ISO regions
    - Multi-year rollout
    - Nearly 100,000 homes annually; LMI and workforce benefits per project
    - Microsoft buys RECs, not retail bill credits
  - - Chipotle and downstream communities
    - Restaurant anchor subscriber plus households, nonprofits, and businesses
    - 15 farms across IL, NY, MD, and ME
    - Under construction at announcement; expected online by 2026
    - 20 MW for Chipotle; ~9,000 downstream beneficiaries
    - Operating retention and realized savings are not yet public
  - - Albany Medical Center
    - Hospital network / institutional subscriber
    - Credits from four Nexamp farms in National Grid territory
    - Live multi-year production
    - '>$150k annual savings; >75 staff and students enrolled'
    - Contract tenor and expansion economics are undisclosed
  - - Give-A-Ray beneficiaries
    - Income-qualified households in the Rockford area
    - Free community-solar credits via the ComEd/Nexamp program
    - Operating program model
    - ~650 customers per year; ~$250 annual savings; 75% of usage covered
    - Program economics rely on utility and policy support
  - - Deerfield residents
    - Community-solar subscribers at a Massachusetts site with storage
    - Subscriber credits enhanced by storage dispatch
    - Operating case study
    - Increased credits and value for subscribed residents
    - No named end customer and no quantified household savings
  notes: The evidence set is strongest on flagship corporate and institutional references plus LMI programs; it is much thinner on municipal or school examples and on project-level retention once projects are live.
