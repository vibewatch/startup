  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Public NRR, GRR, churn, renewal-rate, and cohort-retention data by customer segment.
    whyItMatters: Without direct durability metrics, the chapter must rely on proxies such as Albany Med tenure and review sentiment rather than underwrite renewals with confidence.
    diligencePath: Request subscriber and anchor-customer cohorts, cancellation reasons, move-out rates, and renewal curves by state and segment.
    relatedQuestionRefs:
    - QU018
    - QU027
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Top-customer revenue share, megawatt share, and contract-tenor disclosure for major anchor customers.
    whyItMatters: Customer concentration can materially change downside risk even when public reference quality looks strong.
    diligencePath: Request top-10 customer concentration, anchor MW share by state, and minimum remaining contract term for each major enterprise counterparty.
    relatedQuestionRefs:
    - QU023
    - QU027
    relatedTableRefs:
    - TU006
  - type: enumeration-incomplete
    severity: material
    topic: public-sector-gap
    missingEvidence: Named municipal, school, and other public-sector customer case studies with live outcomes and customer quotes.
    whyItMatters: The fetched pack suggests public-sector potential, but current evidence is too thin to judge repeatability outside corporate, hospital, and LMI-program examples.
    diligencePath: Request a named public-sector reference list, with live sites, savings outcomes, contract structures, and willingness-to-reference status.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU004
    - TU006
  - type: missing-source
    severity: material
    topic: conversion-funnel-gap
    missingEvidence: Signup-to-live activation times, waitlist sizes, complaint-resolution SLAs, and billing-error rates by utility territory.
    whyItMatters: Customer demand may be healthy while realized savings and retention still suffer if activation, billing, or service operations are inconsistent.
    diligencePath: Request funnel metrics from lead to active subscription, average time to first bill credit, first-contact resolution, and billing-adjustment rates by state.
    relatedQuestionRefs:
    - QU027
    relatedTableRefs:
    - TU003
    - TU005
