- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver or risk
  - Public evidence
  - Impact
  - Current read
  - Diligence path
  rows:
  - - Anchor-backed expansion
    - Walmart, Microsoft, and Chipotle deals underwrite broader beneficiary pools
    - Faster multi-state scaling
    - Positive but still announcement-heavy
    - Request realized conversion and savings by project cohort
  - - Institutional referral loop
    - Albany Med says other hospitals in its network adopted after its success
    - Potential land-and-expand inside health systems
    - Positive signal with narrow sample size
    - Request reference list and expansion MW or savings by existing customer
  - - Community-partner acquisition
    - Nexamp compensates community groups for enrolled customers
    - Opens harder-to-reach LMI channels
    - Useful but opaque
    - Request partner count, CAC, and activation yield by channel
  - - Utility / program dependence
    - ComEd identifies Give-A-Ray users and Maryland uses subscriber-organization rules
    - Expansion can be gated by utilities and regulators
    - Material dependency
    - Review state-by-state utility and program bottlenecks
  - - Named public-sector visibility gap
    - Public pack is richer on corporate, hospital, and household proof than on schools or municipalities
    - Limits confidence in public-sector repeatability
    - Negative disclosure gap
    - Request named school and municipal customer case studies
  - - Top-customer concentration disclosure
    - No public top-customer revenue or MW share was found
    - Hard to underwrite concentration risk
    - Negative disclosure gap
    - Request top-10 customer concentration, anchor MW share, and contract tenors
  notes: Nexamp's expansion story looks credible on breadth and channel creativity, but the public pack does not quantify how much of current economics depends on a small set of anchors, utilities, or referral partners.
