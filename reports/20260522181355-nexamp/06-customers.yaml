- id: TU002
  title: Customer access and inclusion mechanics table
  columns:
  - Mechanic
  - Target segment
  - Public promise or rule
  - Customer benefit
  - Caveat
  rows:
  - - No rooftop installation
    - Homeowners and renters
    - Shared-solar pages say offsite participation replaces rooftop solar
    - Access for homes that cannot host panels
    - Savings still depend on project availability and utility territory
  - - No upfront cost or credit check
    - Households and LMI subscribers
    - Official pages say there are no upfront costs or credit checks
    - Lowers signup friction
    - Does not remove two-bill complexity
  - - No long-term contract or cancellation fee
    - Households
    - Official pages and Trustpilot company description say customers can leave without penalty
    - Reduces contractual lock-in risk
    - Does not guarantee seamless transfers when moving
  - - Discounted bill credits for organizations
    - Businesses and institutions
    - Anchor-tenant page shows utility credits bought at a discount
    - Organization-level savings without owning onsite solar
    - Billing structure may still require separate invoices
  - - Partner-led outreach and enrollment
    - LMI and community-based subscribers
    - Nexamp works with community groups, affordable housing providers, and municipalities
    - Better access for harder-to-reach communities
    - Public data does not show channel conversion rates
  notes: The public offer is accessibility-heavy and enrollment-friendly, but the same materials still leave open questions about transfer mechanics, state-specific exceptions, and actual channel efficiency.
