- id: durability
  title: Durability, satisfaction, and retention visibility
  body: |-
    Durability evidence is directionally positive but incomplete. The best public retention-style proof is Albany Medical Center's five-plus-year partnership, which Nexamp says is still compounding savings and has even encouraged other hospitals in the system to adopt community solar. Trustpilot's March 2026 snapshot also suggests broad satisfaction at the household level, with 693 reviews and a 4.4/5 rating, and many excerpts praising easy signup, clear explanations, and real savings. But those positives sit next to a consistent friction theme: public reviews and third-party explainers repeatedly describe confusion around the two-bill model, the timing gap between utility credits and Nexamp invoices, and occasional slow customer-service resolution. Official pages help explain why the model can feel unintuitive, because savings are framed annually, credits can roll over seasonally, and business customers may have different billing setups such as consolidated billing. What is still missing is hard durability data: no public NRR, GRR, churn, renewal, or cohort disclosures were found for either household subscribers or anchor customers.
  claimRefs:
  - CU026
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  tableRefs:
  - TU005
- id: expansion-risk
  title: Expansion loops, concentration, and channel risk
  body: |-
    Expansion appears to depend as much on channel design and policy structure as on pure brand demand. Nexamp's community-engagement page shows that community organizations can act as compensated acquisition partners, while Give-A-Ray depends on ComEd to identify and enroll eligible customers and Maryland's program relies on subscriber organizations and state rules to govern who can join and on what terms. That partner-mediated structure can be a strength because it opens LMI and institutional channels that direct digital marketing alone might not reach. It also creates dependence on utilities, regulators, and trusted local intermediaries. The fetched public pack suggests Nexamp can use anchor deals to underwrite broader community participation, but it does not quantify top-customer concentration by revenue or MW share. Likewise, named municipal and school customer proof remains thin relative to the evidence for Albany Med, Walmart, Microsoft, Chipotle, and LMI programs. For diligence, the customer story is therefore credible on breadth and reference quality, but still under-disclosed on concentration and repeatability.
  claimRefs:
  - CU035
  - CU036
  - CU037
  - CU038
  - CU039
  - CU040
