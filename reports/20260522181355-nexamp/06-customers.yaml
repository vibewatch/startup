- id: adoption-proof
  title: Named customer proof and adoption trajectory
  body: |-
    Named customer proof is strongest where Nexamp ties a recognizable anchor or institution to a larger downstream beneficiary pool. Walmart and Nexamp announced 31 projects across five states and more than 120 MW, with roughly 8,000 residential customers and local businesses expected to benefit; pv magazine USA added that the portfolio was expected to start going live in mid-2025 and continue into 2026. Microsoft is a different customer motion: it buys RECs from roughly 100 projects totaling about 300 MW AC, while Nexamp positions the portfolio as benefiting nearly 100,000 homes annually and adding LMI and workforce benefits. Chipotle provides the clearest named anchor-subscriber structure, taking bill credits associated with 20 MW while the remaining 55 MW is meant to benefit about 9,000 families, nonprofits, and businesses. Albany Medical Center is the most mature named institutional reference, with four farms, roughly 7.9 MW, and more than $150,000 in annual savings. LMI programs such as Give-A-Ray and Nexamp's Maryland fleet show that public proof is not limited to corporate logos.
