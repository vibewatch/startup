tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public proof
  - Main gap
  rows:
  - - Households and renters
    - Individual subscriber / end user / bill payer
    - Save on utility bills without rooftop panels
    - Official shared-solar pages and household review sources
    - No disclosed churn or active national subscriber count by segment
  - - LMI households
    - Household subscriber; sometimes utility or program-assisted payer flow
    - Lower energy burden through discounted or free credits
    - LMI blogs, Give-A-Ray, and Maryland testimony
    - No public conversion funnel or default rate
  - - Anchor organizations
    - Organization buyer / energy manager / budget owner
    - Buy bill credits or subscribe at scale to support projects and lower costs
    - Anchor-tenant page plus Chipotle, Albany Med, Microsoft, and Walmart proof
    - No public standard contract terms or tenure by segment
  - - Community organizations and housing partners
    - Partner influencer rather than end payer
    - Recruit and educate subscribers in local communities
    - Community-engagement page and LMI outreach materials
    - Partner count and economics are undisclosed
  - - Utilities and program managers
    - Channel / admin intermediary
    - Identify eligible customers, govern program rules, and manage enrollment
    - ComEd Give-A-Ray model and Maryland program disclosures
    - Utility dependence can slow expansion
  notes: This table mixes end customers with acquisition and intermediation roles because Nexamp's public customer engine depends on both direct subscribers and program or channel partners.
