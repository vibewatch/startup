  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Interconnection cost certainty
        - New utility invoice or PSC outcome
        - More surprise overrun invoices arrive or the PSC path fails to restore cost certainty
        - Hold back New York economics, raise reserve assumptions, and widen risk premium
      - - Illinois queue and credit timing
        - Waitlist position and study cadence
        - Projects cannot begin construction by July 2026 or lose line of sight to service by end-2027
        - Haircut Illinois pipeline value and reassess tax-credit eligibility assumptions
      - - Billing and support friction
        - Complaint backlog and repeat billing failures
        - BBB complaint pace or unresolved billing cases keep climbing despite billing-transition efforts
        - Treat servicing as an acquisition and retention drag, not a fixable nuisance
      - - Capital-provider dependence
        - Financing milestone slippage
        - Macquarie, Nomura, PGIM, or equity timelines slip or tighten materially
        - Recut buildout timing, liquidity assumptions, and valuation confidence
      - - Supplier concentration
        - Heliene production or delivery slippage
        - Module ramp, domestic-content qualification, or delivery schedule misses project needs
        - Reassess schedule, margin, and domestic-content upside assumptions
      - - Disclosure opacity
        - Diligence response quality
        - Management cannot provide concentration, security, covenant, and IRR data on request
        - Treat opacity itself as a thesis break for aggressive underwriting
    notes: These kill criteria are intentionally monitorable; each one can be tested with a dated internal schedule, metric pack, or documentary response.
