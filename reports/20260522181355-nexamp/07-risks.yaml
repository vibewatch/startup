    figureRefs:
      - FR002
  - id: partner-capital-and-execution
    title: Partner, capital, and execution dependence
    body: |-
      Nexamp's model is capital intensive and counterparties matter. Public financing disclosures show the company leaning on
      multiple layers of outside capital at once: PGIM-backed refinancing for operating assets, Macquarie construction capital
      for utility-scale projects, Nomura development capital for earlier-stage work, and a 2026 preferred-equity Form D. That
      is not a sign of distress on its own, but it does mean growth is financing-conditioned. Supplier and execution
      dependence are visible too. Heliene's investor deck calls Nexamp its largest customer and shareholder, which suggests a
      strategically aligned relationship but also a two-way concentration risk if manufacturing ramp, delivery timing, or
      domestic-content assumptions slip. Nexamp's own leadership and careers pages, plus Built In listings, reinforce the
      same conclusion from a different angle: the company still needs significant specialized capacity in interconnection,
      OT/SCADA reliability, collections, auditing, and scheduling. Comparably's weak leadership score is not decisive on its
      own, but it increases the burden of proof on bench depth and execution discipline.
    claimRefs:
      - CR027
      - CR028
      - CR029
      - CR030
      - CR031
      - CR032
      - CR033
      - CR034
      - CR043
      - CR044
    tableRefs:
      - TR003
      - TR004
    figureRefs:
      - FR003
  - id: residual-verdict-and-kill-criteria
    title: Residual exposure, mitigations, and kill criteria
    body: |-
      The strongest public mitigants are real but incomplete. Nexamp is not operating in a vacuum: New York's SIR process,
      state program managers, utility tariff filings, and active policy working groups create channels for reform; the company
      has recently raised fresh debt and equity capital; and customer-review surfaces are mixed rather than uniformly
      negative. Even so, the residual verdict remains cautious because the visible mitigants do not yet close the most
      investment-relevant questions. Public sources still do not quantify top-customer concentration, supplier concentration
      by spend or MW, covenant headroom, cash runway, project-level returns, or a detailed security-control posture. That is
      why the cleanest kill criteria are measurable operational and financing events rather than vibes: more surprise
      interconnection invoices, growing complaint backlogs, financing or supplier slippage, or management's inability to
      produce concentration and economics data in diligence. If those triggers appear, the risk story would shift from
      manageable complexity to thesis impairment.
    claimRefs:
      - CR041
      - CR042
      - CR043
      - CR044
      - CR045
    tableRefs:
      - TR005
