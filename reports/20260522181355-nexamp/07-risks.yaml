  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-transparency
      missingEvidence: Dedicated trust-center or security-program disclosures, incident history, certification set, and architecture or control summaries.
      whyItMatters: Without these materials, public privacy and billing terms are not enough to underwrite operational security or cyber-response maturity.
      diligencePath: Request SOC 2 and ISO reports, latest penetration-test summary, incident log, and any customer-facing security documentation.
      relatedQuestionRefs:
        - QR028
    - type: private-evidence-only
      severity: material
      topic: concentration-disclosure
      missingEvidence: Top-customer, supplier, and lender concentration by revenue, MW, spend, and contract tenor.
      whyItMatters: Public sources show dependency but not enough detail to size counterparty concentration or substitution risk.
      diligencePath: Request top-10 customer and counterparty concentration schedules, supplier allocation by portfolio, and lender exposure by facility.
      relatedQuestionRefs:
        - QR029
    - type: private-evidence-only
      severity: blocking
      topic: liquidity-and-covenants
      missingEvidence: Cash balance, burn, DSCR or covenant package, remaining facility availability, and project-level return metrics.
      whyItMatters: Capital intensity is visible publicly, but residual financial risk cannot be underwritten without liquidity and covenant headroom.
      diligencePath: Request debt agreements, covenant compliance certificates, treasury report, 13-week cash forecast, and project IRR bridge.
      relatedQuestionRefs:
        - QR030
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-legal-register
      missingEvidence: A complete 50-state litigation, enforcement, tariff, and permit schedule across all Nexamp markets.
      whyItMatters: The public register in this chapter covers the strongest visible disputes and rule changes but could miss additional local dockets or settlements.
      diligencePath: Request outside counsel's matter list, internal docket tracker, and a state-by-state policy exposure matrix, then cross-check against active market footprints.
      relatedTableRefs:
        - TR001
