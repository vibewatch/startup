company:
  name: Nexamp
chapter:
  number: 7
  title: Risks
  summary: >-
    Nexamp's clearest public risk is interconnection and policy dependence: its 2025 New York PSC complaint quantified
    $3.6 million of added invoices across 14 projects and flagged another roughly $19.2 million of expected or estimated
    exposure, while Illinois, Maryland, and Massachusetts all showed active 2025-2026 rule or capacity changes. Secondary
    but still material risks are billing and support friction, dependence on outside capital and key counterparties such as
    utilities and Heliene, and execution load across interconnection, OT, collections, and multi-state program management.
sections:
  - id: regulatory-legal-and-policy
    title: Regulatory, legal, and policy risk
    body: |-
      Nexamp's public legal and regulatory surface is unusually important because the company sits inside community-solar
      programs whose economics are partly defined by regulators, utilities, and billing rules rather than only by bilateral
      contracts. The company itself publishes broad privacy and billing terms that show meaningful handling of customer,
      financial, and utility-account data, plus a One Bill construct that depends on autopay, paperless billing, and utility
      credentials. The sharper risk, though, is interconnection cost certainty. Nexamp's verified August 2025 complaint to
      the New York PSC said National Grid sought another $3,615,637 across 14 completed projects, a 52% increase versus prior
      amounts, and warned that more reconciliation invoices could follow across 41 additional projects. Third-party comments
      from NYSEIA and NY-BEST did not treat that dispute as an isolated annoyance; they treated it as evidence of broader SIR
      cost-certainty failure. Outside New York, Massachusetts, Maryland, and Illinois were all still updating tariff,
      incentive, billing, or allocation rules in 2025-2026. That combination makes legal and regulatory drift a current,
      not hypothetical, underwriting risk.
    claimRefs:
