callouts:
  - calloutType: risk
    title: Interconnection cost certainty is the top kill criterion
    body: Surprise utility invoices after projects are effectively committed can destroy returns even when customer demand and financing remain intact, so project-level exposure and reserve policy are mandatory diligence asks.
    claimRefs:
      - CR010
      - CR011
      - CR012
      - CR013
      - CR041
  - calloutType: insight
    title: Billing complexity is both legal and operational
    body: One Bill improves convenience in theory, but it also creates dependence on utility credentials, utility bill timing, autopay, and support execution; that makes billing friction a systems risk, not just a CX complaint.
    claimRefs:
      - CR005
      - CR006
      - CR039
      - CR042
  - calloutType: recommendation
    title: Do not underwrite through opacity
    body: Ask for concentration, covenant, incident, and project-economics data before giving full credit for scale, because the current public record still leaves those variables materially under-disclosed.
    claimRefs:
      - CR043
      - CR044
      - CR045
