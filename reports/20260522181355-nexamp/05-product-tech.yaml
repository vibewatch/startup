- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control, certification, or quality signal
  - Public status
  - Scope
  - What the evidence does show
  - Gap or risk
  rows:
  - - Privacy Policy
    - Published; last updated 2021-12-16
    - Website, customer interactions, utility and billing data
    - Explicit disclosure of PII, utility-account, financial, and device-data collection plus fraud and security uses
    - Public policy is dated and does not provide modern assurance detail
  - - Terms of Use / One Bill terms
    - Published; last modified 2023-08-10
    - Consolidated billing, Autopay, utility access, and account rules
    - Explains prerequisites, credential access, payment timing, and customer obligations
    - No public control narrative for credential vaulting, exception handling, or reconciliation accuracy
  - - Autopay and paperless help docs
    - Published help-center workflow
    - Invoice timing, notifications, and billing preferences
    - Shows 25-day Autopay timing, portal-driven payment preferences, and paperless defaults
    - No public payment-failure, notice-delivery, or billing-error rates
  - - Storage commissioning capability
    - Publicly claimed operational discipline
    - Integration of multiple inverters, storage systems, and control schemes
    - Nexamp says it invested in commissioning capabilities for 22 operational projects
    - No public availability, round-trip efficiency, or warranty-performance metrics
  - - Self-performance safety and reliability
    - Official plus independent validation
    - Grid-upgrade execution with utility coordination
    - Sources say utilities and Nexamp engineers coordinated to meet technical requirements and preserve safety and reliability
    - No public benchmark for timeline reduction or cost savings by project
  - - External security and compliance artifacts
    - Not surfaced in fetched public pack
    - Customer trust, developer trust, and billing-system assurance
    - Privacy, terms, and help docs exist and are operationally specific
    - No public SOC 2, ISO 27001, pen-test, public API, or security whitepaper was found
  notes: 'The table distinguishes process disclosure from assurance: Nexamp publicly documents how sensitive workflows operate,
    but the fetched pack does not include third-party attestations or quantitative quality metrics.'
