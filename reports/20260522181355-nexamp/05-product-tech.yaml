callouts:
- calloutType: strength
  title: The product moat is operationally integrated
  body: Nexamp's strongest public differentiation is not a single software feature; it is the ability to span development,
    deployment, customer management, partner tooling, and utility coordination in one operating model.
  claimRefs:
  - CE001
  - CE002
  - CE028
  - CE039
- calloutType: risk
  title: Billing convenience increases control-surface risk
  body: One Bill, Autopay, and utility-credential access make the experience easier for customers, but they also concentrate
    trust risk in credential handling, billing accuracy, and utility-dependent exception workflows.
  claimRefs:
  - CE017
  - CE022
  - CE040
  - CE048
- calloutType: insight
  title: Public software signals are real but still inward-facing
