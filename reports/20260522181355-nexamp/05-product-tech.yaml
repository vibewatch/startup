- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Nexamp solution
  - Publicly measurable benefit
  - Operational limitation
  rows:
  - - Join community solar without rooftop panels
    - Check eligibility, submit basic and utility-account information, wait for a farm allocation
    - Nexamp links the user to a nearby solar farm and sizes the subscription to expected usage
    - Advertised 15% annual savings in the cited Virginia flow
    - Benefit starts only after a spot opens and service depends on utility territory
  - - Receive and understand monthly credits
    - Utility posts bill credits and may show them under different labels by service territory
    - Nexamp explains credit presentation and discount structure in its help docs
    - Credits can lower or exceed monthly utility charges and roll forward
    - Presentation varies by utility and can confuse customers without guidance
  - - Automate monthly payment to Nexamp
    - User logs into community.nexamp.com, enrolls after balance is zero, then receives invoice and charge notices
    - Autopay processes the full invoice 25 days after generation
    - Removes a manual due date and centralizes payment management
    - Autopay will not start with past-due balances and is still a separate dependency from utility billing
  - - Use One Bill instead of split bills
    - Customer enables paperless billing and Autopay, shares utility credentials, and receives consolidated billing notices
    - Nexamp retrieves utility bills and facilitates utility payment through One Bill
    - Potentially reduces bill-management friction and consolidates payment rails
    - If One Bill is disabled or fails, the customer must resume direct utility payment
  - - Move or cancel a subscription
    - Customer contacts support and provides new address or move-out timing
    - Nexamp transfers the account if eligible or coordinates cancellation
    - Can preserve service continuity when the new home qualifies
    - Utility submission windows and 90-day notice limit how quickly changes take effect
  - - Bring a DG project into the Developer Accelerator
    - Developer hits baseline milestones, signs a PFA and project purchase documents, and shares materials in trackers and
      data rooms
    - Nexamp provides development financing, pricing transparency, and shared operating resources
    - Earlier-stage capital and clearer fee visibility for qualified partners
    - Program access is gated to approved developers and public usage metrics are unavailable
  notes: Rows mix customer and partner workflows because Nexamp's public product surface is both subscriber-facing and partner-facing;
    the public pack is stronger on process description than on conversion or quality metrics.
