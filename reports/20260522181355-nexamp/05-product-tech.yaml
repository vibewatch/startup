- id: trust-risks
  title: Trust, compliance, and product-technology risks
  body: 'Nexamp''s trust posture is strongest where the company explains process and weakest where outsiders need assurance.
    The Privacy Policy and Terms of Use are explicit that the business may collect sensitive identity, billing, and utility-account
    data, can access utility bills and usage information when authorized, and relies on digital communications, portal preferences,
    and Autopay to run parts of the customer experience. That is enough to show Nexamp understands the control surface of
    its product. It is not enough to demonstrate mature external assurance, because the fetched public pack does not include
    a SOC report, ISO certification, penetration-test summary, public incident-response commitment, or external API/security
    documentation.


    The New York interconnection dispute sharpens the operational-risk case. NYSEIA''s support filing shows how much Nexamp''s
    product experience still depends on utility cost estimates, timing, and billing conduct outside the company''s direct
    control. For chapter-five diligence, the verdict is therefore mixed: Nexamp appears to have a real, multi-product operating
    platform with meaningful internal software and field-execution capability, but public evidence still leaves open questions
    about security assurance, billing-quality metrics, and how repeatable newer capabilities such as One Bill, self-performance,
    and developer tooling are at scale.'
  claimRefs:
  - CE022
  - CE023
  - CE040
  - CE041
  - CE042
  - CE045
  - CE046
  - CE048
