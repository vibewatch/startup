  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: Public security artifacts such as SOC 2, ISO 27001, penetration-test summary, incident-response overview,
      or credential-vaulting controls for One Bill.
    whyItMatters: Without external assurance, the trust case for sensitive billing and utility-data workflows remains largely
      self-attested.
    diligencePath: Request the latest security questionnaire, independent audit reports, incident history, and architecture
      review for portal, One Bill, and billing integrations.
    relatedQuestionRefs:
    - QE020
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: external-api-docs
    missingEvidence: Public API references, SDK docs, or partner integration guides for customer, billing, or developer-partner
      workflows.
    whyItMatters: The lack of public integration documentation makes it hard to judge whether Nexamp has defensible platform
      interfaces or only internal tooling.
    diligencePath: Ask for partner-facing API docs, integration schemas, auth model, webhook catalogue, and example implementation
      timelines.
    relatedQuestionRefs:
    - QE024
    - QE025
  - type: missing-source
    severity: material
    topic: billing-quality-metrics
    missingEvidence: Invoice accuracy, payment-failure rates, customer-support SLA, One Bill adoption rate, and billing-related
      complaint metrics by utility territory.
    whyItMatters: Product-tech diligence cannot fully underwrite customer-experience quality without quantitative reliability
      and exception data.
    diligencePath: Request monthly billing-ops KPI dashboards, utility-by-utility error rates, support response times, and
      churn tied to billing issues.
