  enumerationScope:
    coverage: partial
    basis: Rows cover the product and service modules directly exposed in the 2026 fetched source pack, not every contract
      variation or state-specific program Nexamp may operate.
  rows:
  - - Community-solar subscription
    - Homeowners and renters
    - Live retail offer with state-specific pricing and utility-credit workflow
    - No roof or upfront capex required; savings embedded in bill-credit mechanics
    - Need churn, billing-error, and One Bill adoption metrics
  - - One Bill and portal billing
    - Existing subscribers
    - Partially deployed account-management workflow
    - Consolidates utility and Nexamp payments behind Autopay and paperless settings
    - Need rollout coverage, exception rates, and utility-by-utility support map
  - - Host a solar farm
    - Landowners and facility owners
    - Mature marketed service
    - Nexamp handles design, permitting, interconnection, O&M, and decommissioning
    - Need standard lease economics and project-selection criteria
  - - Power purchase agreements
    - Commercial and industrial buyers
    - Mature marketed offer
    - Supports both onsite and offsite procurement with discount framing
    - Need sample tenor, escalator, and performance-guarantee terms
  - - Energy storage
    - Commercial, campus, municipal, and utility-scale buyers
    - Operating and expanding capability
    - Design-build-own-operate model links storage to solar and EV charging use cases
    - Need control-system, warranty, and performance-guarantee detail
  - - Solar development and owner services
    - Asset owners, developers, utilities, and acquisition targets
    - Mature platform capability
    - Lifecycle coverage spans acquisition, deployment, asset management, and customer management
    - Need conversion rates and service-level commitments
  - - Developer Accelerator Program
    - Third-party DG solar, storage, and EV developers
    - Active but partner-gated program
    - Pricing calculator, trackers, data rooms, and project financing structure extend Nexamp's platform outward
    - Need public partner count, market coverage, and fee logic
