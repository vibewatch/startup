      - number: '8.4'
        title: The final call depends on private diligence, not another press release
        blocks:
          - type: paragraph
            body: >-
              The remaining work is straightforward in concept and decisive in effect. A clean upgrade from
              research-more to a conditional buy requires the company to prove what the public record cannot. First, the
              cap table has to be opened so an investor can see exactly where the 2024-2026 financings sit in the
              seniority stack and whether liquidation preferences or ratchets impair common-equity upside. Second,
              management must provide audited or at least board-grade portfolio cash-yield evidence, subscriber
              collections and churn data, covenant headroom, and a state-by-state view of project exposure to policy
              resets and interconnection reserves. Third, the exit path has to be described in a way that matches
              current market reality. Recent precedent suggests sponsor recapitalizations, infrastructure-fund sales,
              and structured continuation financing are more credible than a premium public-market exit. The thesis
              breaks if Nexamp starts to resemble stressed solar peers on financing quality or if policy and
              interconnection conditions push the community-solar market into another leg down before Nexamp produces
              clearer economics. Until private diligence closes those gaps, the right posture is downside-first
              engagement and willingness to walk away on price.
