      - number: '5.4'
        title: Capability maturity, expansion path, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The public maturity profile is uneven but directionally strong. Community solar and related
              customer-service operations are clearly mature enough to support statewide retail offers, portal billing,
              and utility-credit workflows. Storage is no longer aspirational: Nexamp disclosed 100 MWh operating across
              22 projects by end-2023 and more than 5 GWh under development or construction, while also describing the
              commissioning discipline needed to integrate multiple inverter providers, storage systems, and control
              schemes. The utility-scale business is newer, but by 2025 it already had dedicated construction and
              development capital plus a 6 GW pipeline claim.


              The most distinctive operating signal is self-performance on interconnection work. Both official and
              independent sources say Nexamp completed three pilot projects by taking on utility-adjacent procurement
              and construction tasks itself, with the stated goal of cutting time and cost while meeting safety
              requirements. Combined with the Developer Accelerator tool set and the Heliene module procurement, that
              suggests Nexamp's differentiation is operational leverage: its ability to coordinate suppliers, partners,
              utilities, capital, and customer management. Public roadmap evidence is credible on expansion direction,
              but it is much thinner on attach rates, module-by-module adoption, and whether these newer capabilities
              have become repeatable system advantages outside pilot settings.
