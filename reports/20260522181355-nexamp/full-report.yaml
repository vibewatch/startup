      - - Nexamp
        - Anchor integrated operator
        - >-
          Nationwide developer/provider; Illinois comparison pages show current public retail terms more clearly than
          enterprise scale details
        - Renters, homeowners, and businesses seeking community-solar savings without onsite panels
        - Develop-build-own-operate subscriber-facing community solar
        - 15% savings and 15-year Illinois offer with 90-day notice on the cited CUB chart
        - Strong integrated benchmark, but public pricing is not obviously outside the category norm
      - - Summit Ridge Energy
        - Direct peer
        - $305M financing for 158 MW; more than 2 GW operating or under development
        - Households and businesses in community-solar territories, including environmental-justice and LMI segments
        - Community-solar development, ownership, and subscriber operations
        - >-
          Monthly bill-credit savings; one-month move termination; exact statewide pricing not fully standardized
          publicly
        - Scaled direct peer; public contract transparency is thinner than Arcadia or Illinois chart providers
      - - Clearway Community Solar
        - Direct peer with incumbent-style parent backing
        - Nearly 15000 historical customers in four states; parent energy platform across 28 states
        - Residents, businesses, schools, hospitals, and municipalities
        - Local solar farms plus customer enrollment and bill-credit management
        - Guaranteed savings; no upfront cost; no cancellation fees on cited pages
        - Simplicity is strong, but the public differentiation claim is mainly convenience rather than a distinct moat
      - - Arcadia
        - Adjacent platform competitor
        - 2 GW+ under management; 223000+ subscribers; 15 states
        - Homes, businesses, and developers needing low-friction enrollment and subscriber services
        - Subscriber acquisition, billing integration, and management rather than the pure asset stack
        - 5% to 20% savings; no long-term fee-bearing lock-in; single-bill or integrated billing emphasis
        - Strongest distribution and software-led alternative to Nexamp's fully integrated model
      - - Dimension Energy
        - Direct peer
        - $650M financing; 132 MW current portfolio; 1000+ MW executed; 3.5 GW under development; 35000+ customers
        - Communities and subscribers in multi-state community-solar and storage markets
        - Develop-own-operate community solar and storage with community-engagement emphasis
        - >-
          Immediate bill-savings framing, but public retail contract terms are less standardized than Arcadia or
          Illinois charts
        - >-
          Looks operationally close to Nexamp, with stronger public policy/community-language than retail packaging
          detail
      - - Pivot Energy
        - Direct or adjacent entrant
        - >-
          4 GW total solar development footprint; 500 MWac Microsoft framework; 40-project 144 MW community-solar
          portfolio
        - Communities, corporates, and subscribers reached through community-scale portfolios
        - Community-scale solar plus storage with corporate partner channels
        - Public retail packaging is less transparent than developer/partner proof
        - Strong partner and capital access, but public consumer-facing pricing is comparatively opaque
      - - Solar Landscape
        - Direct entrant via commercial rooftops
        - $600M debt facility; 146 MW community-solar portfolio; 350+ projects and 630 MWdc deployed
        - Residents served through commercial-rooftop projects and community partners
        - Distributed generation and community solar sourced from commercial real estate rooftops
        - >-
          Guaranteed savings; no upfront cost; Illinois chart shows 20% savings, 5-year term, no fee, consolidated
          billing
        - Differentiated by rooftop site control rather than the classic greenfield subscriber-origination model
      - - Rooftop / internal-build solar
        - Substitute
        - No single vendor scale signal; economics depend on customer roof, utility tariff, and financing
        - Owners or businesses with suitable roofs and capex appetite
        - Onsite panels, BIPV, or other internal generation
        - Higher upside potential but upfront cost, interconnection, and ongoing utility charges remain
        - Attractive where ownership matters; weaker where simplicity and no-capex access matter most
      - - Default utility service / utility-led options
        - Status quo incumbent
        - Mandated service relationship and existing billing footprint
        - Buyers prioritizing the simplest billing path and zero switching work
        - Standard retail supply and utility-administered programs
        - One familiar bill and no community-solar contract management
        - Lowest friction but no dedicated local-solar discount narrative
