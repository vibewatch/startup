  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Cap-table seniority worse than implied
        - Large liquidation preferences, ratchets, or senior claims above new equity
        - Compresses common-equity upside even if operating performance is solid
        - Reprice toward the bear range or pass entirely
      - - Portfolio economics fail diligence
        - Weak DSCR, low asset cash yields, or elevated churn and collections loss
        - Converts platform narrative into project-roll-up risk
        - Hold recommendation at research-more or move to avoid
      - - Policy and interconnection deterioration
        - Another market-contraction leg, material queue costs, or reduced subscriber economics in core states
        - Raises discount rates and lowers exit confidence
        - Shift valuation band downward and tighten return hurdle
      - - Financing quality worsens
        - Rescue capital, restructuring language, or covenant stress emerges
        - Makes Nexamp look more like distressed solar peers than sponsor-backed platforms
        - Treat as thesis break until balance-sheet risk is re-underwritten
      - - Exit path closes
        - No sponsor interest, no infrastructure bids, and no credible IPO path
        - Removes the premium end of the range and turns hold assumptions unrealistic
        - Underwrite only to downside-protected structures or walk away
    notes: >-
      These are explicit kill criteria rather than generic risks. Each one changes either the realized seniority of the
      investment or the plausibility of the exit required to earn target returns.
    claimRefs:
      - CV038
      - CV040
      - CV041
      - CV042
      - CV045
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Cap table and waterfall
        - Full security stack from 2024 through 2026 including liquidation preferences and conversion mechanics
        - Without it, public EV bands cannot be translated into equity value or MOIC
        - CFO package plus counsel review of definitive financing documents
      - - Asset cash generation
        - Portfolio-level revenue, EBITDA, DSCR, and project cash-yield bridge by major state and vintage
        - Determines whether Nexamp merits a platform premium or only project-style pricing
        - Finance diligence with asset-level operating model and lender reporting packs
      - - Subscriber quality
        - Churn, collections loss, billing dispute rates, and realized savings by state and customer cohort
        - Converts growth narrative into durable unit economics or disproves it
        - Commercial diligence using customer-ops dashboard exports and cohort retention files
      - - Policy and queue exposure
        - State-by-state allocation of MW, waitlist position, reserve assumptions, and interconnection cost exposure
        - Shapes discount rates, COD timing, and downside triggers
        - Development and regulatory diligence with pipeline schedule and reserve memos
      - - Exit readiness
        - Current sponsor outreach, board exit plans, reporting package maturity, and precedent conversations
        - Tests whether the underwritten exit path is real or aspirational
        - CEO and board materials plus banker reference calls
    notes: >-
      Each diligence ask is designed to convert the chapter from a public-only screening judgment into an investable
      underwriting file. If management cannot produce these materials, the recommendation should not be upgraded.
    claimRefs:
      - CV040
      - CV041
      - CV043
      - CV044
      - CV045
