      - number: '8.2'
        title: Comparable signals show both sponsor appetite and severe downside risk
        blocks:
          - type: paragraph
            body: >-
              The comparable set does not support a single neat multiple for Nexamp. Instead, it shows a very wide
              valuation corridor whose endpoints are driven by business-model quality, capital structure, and disclosure
              depth. At the constructive end, TPG's 2025 agreement to buy Altus Power for about $2.2 billion including
              debt shows that scaled distributed-solar assets can still command control-value pricing when the buyer can
              diligence an operating fleet. Clearway's roughly $9.35 billion market cap shows public equity remains
              available for contracted power platforms with durable disclosure and cash-flow visibility. At the negative
              end, Sunnova's bankruptcy, Fitch downgrade to D, and $27.67 million market cap show how quickly leveraged
              solar-platform equity can collapse when financing and policy conditions turn. SolarBank's small-cap
              valuation underscores that public markets often reserve only modest equity value for smaller or
              less-proven developers. The private financing set sits in between those poles. Dimension, Pivot, Summit
              Ridge, and Solar Landscape all closed nine-figure facilities in 2025-2026, confirming that capital still
              wants distributed and community-solar exposure. But those transactions are mostly debt, construction, or
              warehouse facilities, not clean equity marks. The signal is clear. Private capital is open, but it is
              rewarding specific assets and funded pipelines more readily than it is publishing transparent enterprise
              values.
