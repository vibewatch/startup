  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Nexamp should be treated as a vertically integrated community-solar platform rather than a pure lead
              generator or a narrow EPC. Official current materials say the company was founded in 2007 by two U.S. Army
              veterans and operates by acquiring or developing projects, financing them, building them, operating them,
              and managing subscribers over the asset life. The product explanation is consistent across official and
              third-party consumer-oriented pages: customers subscribe to off-site solar farms, receive utility-bill
              credits, and avoid rooftop hardware, sign-up fees, and long-term contracts while targeting roughly 10% to
              15% savings. Nexamp also claims average annual subscriber savings of about $275. The official about and
              leadership pages anchor the present-day footprint: Boston remains the primary headquarters, Chicago is a
              second national headquarters, and the company presents itself as active across multiple offices and market
              regions. For later chapters, the reusable ground truth is that Nexamp monetizes distributed solar and
              storage through development and ownership plus customer management, not through a software-only or
              installer-only model.
