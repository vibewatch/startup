            body: >-
              Named customer proof is strongest where Nexamp ties a recognizable anchor or institution to a larger
              downstream beneficiary pool. Walmart and Nexamp announced 31 projects across five states and more than 120
              MW, with roughly 8,000 residential customers and local businesses expected to benefit; pv magazine USA
              added that the portfolio was expected to start going live in mid-2025 and continue into 2026. Microsoft is
              a different customer motion: it buys RECs from roughly 100 projects totaling about 300 MW AC, while Nexamp
              positions the portfolio as benefiting nearly 100,000 homes annually and adding LMI and workforce benefits.
              Chipotle provides the clearest named anchor-subscriber structure, taking bill credits associated with 20
