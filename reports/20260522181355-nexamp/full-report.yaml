      - number: '4.2'
        title: GTM motion and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Public GTM evidence for Nexamp is mostly industry-structure evidence rather than company-reported sales
              data. The best numeric proxy comes from the 2026 Wood Mackenzie and Coalition for Community Solar Access
              outlook, which says subscriber-acquisition costs averaged $70 per kWdc in 2025 and climbed to $100 per
              kWdc for low- and moderate-income subscribers. That matters because Nexamp operates heavily in community
              solar, where subscriber acquisition, enrollment processing, billing support, and retention are real cost
              centers even after the project is built. The same outlook says acquisition costs fell 12% year over year
              and should keep declining as the market consolidates and consolidated billing expands.

              Nexamp's own 2026 billing update is important in that context. Moving the discounted Nexamp charge
              directly onto the utility bill should reduce customer confusion and collections friction relative to the
              legacy two-bill model. Still, public sources stop short of giving actual CAC, payback, churn, or renewal
              data for Nexamp itself. The strongest scale proxy is the Walmart partnership: 31 projects, more than 120
              MWDC, about 8,000 residential customers, and more than $2 million per year of customer savings across five
              states. Wood Mackenzie also says Nexamp captured 18% of 2025 community-solar installations, which supports
              the view that the company is a scaled subscriber manager and developer, but not that its GTM motion is
              efficiently monetized on a per-customer basis.
            claimRefs:
