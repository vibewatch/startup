      - number: '2.4'
        title: Growth Drivers, Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The market is still expanding, but the gating items are increasingly operational and regulatory rather
              than conceptual. The 2026 evidence points to demand-side drivers: affordability politics, LMI carve-outs,
              growing technical assistance under NCSP+, lower subscriber-acquisition costs, and continued state
              rulemaking around community solar. At the same time, the public record is clear that project delivery is
              constrained by interconnection and billing. DOE calls uncertainty in interconnection cost and timing one
              of the most persistent barriers to community-solar deployment, and FERC says the national queue contained
              more than 10,000 requests representing over 2,000 GW at the end of 2022, with most studies still late.
              Order No. 2023 is directionally positive, but it is a process repair, not a guarantee of faster utility
              execution in Nexamp's actual territories. 2026 policy reporting also shows the market moving into a
              redesign phase where compensation rates, flexible interconnection, consolidated billing, and affordability
              targets are being re-tuned state by state. That is good for long-run durability but bad for easy TAM
              narratives. Federal policy now adds another layer of uncertainty: EPA's inspector general said Solar for
              All was terminated in August 2025, which means developers cannot assume continued federal grant support
              will offset subscriber-acquisition or LMI economics. The remaining diligence gap is not whether a market
              exists. It is whether Nexamp can convert policy-enabled demand into utility-territory-specific,
              interconnection-cleared, billing-ready projects at attractive customer-acquisition cost in its chosen
              states.
