      - number: '2.2'
        title: Sizing Lenses and Addressable Reach
        blocks:
          - type: paragraph
            body: >-
              The evidence supports multiple sizing lenses, not a single heroic TAM. DOE's market tracker put operating
              U.S. community solar at 7.87 GW in June 2024, while public 2026 summaries citing Wood Mackenzie or CCSA
              put end-2025 installed capacity at 10.1 GW. Those numbers both point to a real market, but they should not
              be blended without checking AC/DC and cut-off conventions. A second lens is policy availability: NREL's
              2024 policy review found only 24 states or localities, including the District of Columbia, had enabling
              policy, and only 20 had low-income provisions. So the near-term SAM for Nexamp is policy-enabled
              territories rather than the national electricity market. A third lens is structural access need. DOE cites
              NREL analysis saying nearly half of households and businesses cannot host rooftop solar. Census data adds
              scale to that access gap by showing 148.3 million U.S. housing units and a national owner-occupied rate of
              65.2%, which means a very large renter population still depends on off-site options. A fourth lens is
              equitable-access infrastructure: DOE said HUD-assisted residents in qualifying program structures can join
              community solar without losing utility-allowance support, bringing roughly 4.5 million affordable-housing
              families into view. Together, these lenses show why Nexamp's market is meaningful but not frictionless:
              policy gates, unit normalization, and billing mechanics matter more than generic national electricity
              demand.
