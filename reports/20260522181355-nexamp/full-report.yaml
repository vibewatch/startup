        title: Exhibits
        blocks:
          - type: callout
            title: Community solar solves a real access problem
            body: >-
              The strongest structural demand signal is not abstract carbon demand but physical and economic exclusion
              from rooftop solar. DOE and Berkeley Lab both show why renters, multifamily households, and lower-income
              customers over-index in community solar.
            calloutType: strength
            claimRefs:
              - CM004
              - CM039
          - type: callout
            title: Policy-enabled states matter more than national TAM slogans
            body: >-
              Nexamp's monetizable market is concentrated in enabled states with workable billing, interconnection, and
              LMI design. National power demand is a poor proxy for actual SAM.
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
              - CM020
              - CM052
          - type: callout
            title: Interconnection and billing are the real pacing items
            body: >-
              Customer demand does not convert into revenue until utility queues clear and credits show up on bills.
              That is why interconnection and billing mechanics deserve more weight than raw market-size headlines.
            calloutType: risk
            claimRefs:
              - CM037
              - CM042
              - CM043
              - CM045
          - type: callout
            title: Public market-size figures still need normalization
            body: >-
              The public evidence is sufficient to conclude the market is meaningful and growing, but current 2024-2026
              capacity figures still need consistent units and cut-off dates before feeding a valuation model.
            calloutType: assumption
            claimRefs:
