            body: >-
              Nexamp does not publish a public developer portal or detailed external technical architecture, but the
              combination of job postings, billing-operations roles, and partner materials still exposes a meaningful
              operating architecture. Developer-signal sources point to a React and TypeScript front end, Python
              services built with Django and FastAPI, SQL-backed data work, CI/CD, and Terraform on Azure. The
              billing-operations role adds another layer by explicitly referencing API callouts, notification systems,
              dashboards, and third-party platforms such as Zuora, NetSuite, Workato, Tray.io, Genesys, Twilio, and
              Pardot.


              The public picture that emerges is an internal operating platform that ties customer workflows to
              financial and project workflows. Billing preferences are managed in a customer portal, utility data is
              accessed when One Bill is enabled, and the Developer Accelerator Program exposes shared pricing
              calculators, trackers, and data rooms to partners. That makes Nexamp look like a workflow-heavy
              clean-energy operator with real internal software depth. The public evidence is still incomplete, however:
              there is no public API reference, no release log for One Bill, and no public technical SLA or uptime
              disclosure that would let an outside investor assess software reliability the way they would for a
              conventional SaaS company.
