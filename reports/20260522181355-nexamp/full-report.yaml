      - number: '6.4'
        title: Expansion loops, concentration, and channel risk
        blocks:
          - type: paragraph
            body: >-
              Expansion appears to depend as much on channel design and policy structure as on pure brand demand.
              Nexamp's community-engagement page shows that community organizations can act as compensated acquisition
              partners, while Give-A-Ray depends on ComEd to identify and enroll eligible customers and Maryland's
              program relies on subscriber organizations and state rules to govern who can join and on what terms. That
              partner-mediated structure can be a strength because it opens LMI and institutional channels that direct
              digital marketing alone might not reach. It also creates dependence on utilities, regulators, and trusted
              local intermediaries. The fetched public pack suggests Nexamp can use anchor deals to underwrite broader
              community participation, but it does not quantify top-customer concentration by revenue or MW share.
              Likewise, named municipal and school customer proof remains thin relative to the evidence for Albany Med,
              Walmart, Microsoft, Chipotle, and LMI programs. For diligence, the customer story is therefore credible on
              breadth and reference quality, but still under-disclosed on concentration and repeatability.
