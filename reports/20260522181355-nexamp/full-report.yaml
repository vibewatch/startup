  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and policy risk
        blocks:
          - type: paragraph
            body: >-
              Nexamp's public legal and regulatory surface is unusually important because the company sits inside
              community-solar

              programs whose economics are partly defined by regulators, utilities, and billing rules rather than only
              by bilateral

              contracts. The company itself publishes broad privacy and billing terms that show meaningful handling of
              customer,

              financial, and utility-account data, plus a One Bill construct that depends on autopay, paperless billing,
              and utility

              credentials. The sharper risk, though, is interconnection cost certainty. Nexamp's verified August 2025
              complaint to

              the New York PSC said National Grid sought another $3,615,637 across 14 completed projects, a 52% increase
              versus prior

              amounts, and warned that more reconciliation invoices could follow across 41 additional projects.
              Third-party comments

              from NYSEIA and NY-BEST did not treat that dispute as an isolated annoyance; they treated it as evidence
              of broader SIR

              cost-certainty failure. Outside New York, Massachusetts, Maryland, and Illinois were all still updating
              tariff,

              incentive, billing, or allocation rules in 2025-2026. That combination makes legal and regulatory drift a
              current,

              not hypothetical, underwriting risk.
