          - type: paragraph
            body: >-
              Nexamp's public customer surface starts with community-solar subscribers, not a single enterprise software
              buyer. Official consumer pages say the program is open to homeowners and renters, requires no rooftop
              installation, and is designed to turn local solar-farm output into discounted bill credits. The same guide
              expands the segment map well beyond households: businesses, universities, hospitals, religious
              organizations, and municipalities are all listed as eligible users where program rules allow. That
              broadening matters because Nexamp is not only chasing one retail persona. It also markets an
              anchor-subscriber motion for organizations, plus partner-led outreach through community organizations and
              affordable housing groups. Maryland's community-solar program page reinforces that this is a multi-segment
              structure by explicitly distinguishing residential vs commercial subscriptions and LMI discounts. The
              result is a customer base that appears diversified by payer type, even if public sources still do not
              quantify exact mix or revenue contribution by segment.
