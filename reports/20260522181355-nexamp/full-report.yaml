      - number: '2.3'
        title: Buyer Segments, Budget Owners, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Nexamp's buyer map is broader than “residential subscribers.” Public state-program pages show that core
              community-solar markets now include renters, homeowners, multifamily properties, small businesses,
              schools, nonprofits, public entities, and in some cases larger anchor tenants. Buyer, user, and payer
              often differ. In a household subscription, the electric-account holder is effectively all three. In
              affordable housing, the property owner or manager, resident, and subsidy administrator can all affect
              eligibility or economics. In municipal or nonprofit use cases, the facilities team may use the power while
              the finance office or governing body owns the budget decision. DOE's program-design materials treat anchor
              tenants such as local businesses, schools, and nonprofits as important because they can reduce financing
              and customer-acquisition costs, but they also warn that overly large anchors can crowd out smaller
              subscribers. The state examples show how market design affects buyer conversion. New York openly positions
              community solar for homeowners, renters, businesses, and multifamily buildings. Massachusetts highlights
              renters and homes without viable roofs, with 5% to 20% annual savings. Illinois Solar for All adds an
              income screen and an aggressive fee cap, while Maryland adds consumer protections and explicit LMI
              allocation rules. Nexamp's own materials confirm that the product is sold through a two-bill workflow with
              delayed realization of savings, which means adoption depends not only on gross savings percentages but
              also on customer patience, project energization timelines, and the clarity of program disclosures.
            claimRefs:
