  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing mechanics
        blocks:
          - type: paragraph
            body: >-
              Nexamp's public customer materials describe a straightforward but non-SaaS revenue engine. The company
              does not sell electricity at a fixed cents-per-kWh rate; instead, it assigns subscribers a share of a
              community-solar project, lets the utility apply the resulting bill credit, and then charges the customer
              for those credits at an agreed discount. That discount is the primary public pricing signal: Nexamp's own
              2026 guide and help articles show state-program discounts around 10% to 15%, with the bill-credit
              structure designed to lower total annual electricity cost rather than replace the utility relationship.
              The guide also makes clear that billing has historically been a two-bill process, although Nexamp is now
              migrating toward consolidated utility-bill charging.

              The economic implication is that Nexamp's residential revenue quality depends on three moving parts that
              are only partially visible publicly: utility credit valuation, the contracted discount to the customer,
              and collections efficiency. Nexamp discloses enough to show the mechanism, including the Shared Solar Bill
              Credit, SO Subscription Fee, and the utility's 1% net-crediting fee. It does not disclose realized pricing
              by cohort, subscriber churn, bad-debt loss, or revenue-recognition policy. Outside residential
              subscriptions, Nexamp's business site advertises PPAs, hosting-a-farm programs, energy storage, and
              standalone services, which suggests a broader commercial and project-development revenue mix than
              customer-facing community solar alone.
            claimRefs:
              - CI001
